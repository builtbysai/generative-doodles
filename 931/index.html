<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Ship Would You Be?</title>
<style>
  html, body { margin: 0; padding: 0; background: #F4EFE3; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* What Ship Would You Be? -- No.931
   A generative ship's-badge engine after Stefanie Posavec's National
   Maritime Museum residency. Every mark reads one variable:
   sky hatch = neuroticism, sea waves = conscientiousness,
   token = agreeableness (wheel for the very open), ring = openness,
   badge scale = word popularity. The badges ARE the survey. */

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }

// ---------- palette (strict) ----------
var PAPER = '#F4EFE3';
var BRASS = '#B9770E';
var NAVY  = '#1A2A4A';
var TEAL  = '#2E86AB';
var GRAY  = '#5D6D7E';
var RED   = '#C0392B';
var INK   = '#1A1A1A';

// ---------- the survey ----------
var WORDS = [
  { w: 'Dreamer',       wt: 3.0, b: { n:  0.05, a:  0.05, o:  0.25, c: -0.10 } },
  { w: 'Rebel',         wt: 2.0, b: { n:  0.10, a: -0.20, o:  0.15, c: -0.05 } },
  { w: 'Listener',      wt: 3.0, b: { n: -0.05, a:  0.30, o:  0.05, c:  0.05 } },
  { w: 'Perfectionist', wt: 2.0, b: { n:  0.12, a: -0.05, o: -0.05, c:  0.28 } },
  { w: 'Wanderer',      wt: 2.0, b: { n:  0.00, a:  0.00, o:  0.28, c: -0.15 } },
  { w: 'Keeper',        wt: 2.0, b: { n: -0.08, a:  0.15, o: -0.05, c:  0.20 } },
  { w: 'Spark',         wt: 1.5, b: { n:  0.15, a:  0.10, o:  0.20, c: -0.10 } },
  { w: 'Anchor',        wt: 2.0, b: { n: -0.12, a:  0.05, o: -0.10, c:  0.22 } },
  { w: 'Tide',          wt: 1.5, b: { n:  0.05, a:  0.10, o:  0.10, c:  0.00 } },
  { w: 'Compass',       wt: 2.0, b: { n: -0.05, a:  0.00, o:  0.10, c:  0.15 } }
];
var NREC = 72;

function tokenOf(rec) {
  if (rec.o > 0.85) return 'wheel';
  if (rec.a < 1 / 3) return 'anchor';
  if (rec.a < 2 / 3) return 'monkey';
  return 'gull';
}
function ringOf(rec) {
  if (rec.o < 0.30) return 'thin';
  if (rec.o < 0.60) return 'medium';
  if (rec.o < 0.85) return 'thick';
  return 'double';
}

var cohort = null;      // {records, pop, heroIdx, grid, sortMode, stampMoments}
var cohortN = 0;
var segs = {};          // recIdx -> {t0, dur, fx, fy, fr, tx, ty, tr}
var readings = [];      // {t, recIdx}
var epochShift = 0;     // print-clock shift (reseed restarts the print)
var PRINT_OFF = 33;     // frame one: the print opens 33 s in (~55% of 60 s)
var LOOP = 78, PRINT_END = 60, HOLD_END = 70;

function genCohort(seed) {
  var rng = mulberry32(seed);
  var totalWt = 0, i, j;
  for (i = 0; i < WORDS.length; i++) totalWt += WORDS[i].wt;
  var records = [];
  var pop = {};
  for (i = 0; i < WORDS.length; i++) pop[WORDS[i].w] = 0;
  for (i = 0; i < NREC; i++) {
    var pick = rng() * totalWt, wi = 0;
    while (pick > WORDS[wi].wt) { pick -= WORDS[wi].wt; wi++; }
    var wd = WORDS[wi], b = wd.b;
    var rec = {
      word: wd.w,
      n: clamp01(0.5 + b.n + (rng() - 0.5) * 0.55),
      a: clamp01(0.5 + b.a + (rng() - 0.5) * 0.55),
      o: clamp01(0.5 + b.o + (rng() - 0.5) * 0.55),
      c: clamp01(0.5 + b.c + (rng() - 0.5) * 0.55)
    };
    rec.token = tokenOf(rec);
    rec.ring = ringOf(rec);
    records.push(rec);
    pop[rec.word]++;
  }
  // display order: a deterministic shuffle of all 72
  var order = [];
  for (i = 0; i < NREC; i++) order.push(i);
  for (i = NREC - 1; i > 0; i--) {
    j = Math.floor(rng() * (i + 1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  // hero: first shuffled record whose word is the most popular
  var heroWord = WORDS[0].w;
  for (i = 0; i < WORDS.length; i++) if (pop[WORDS[i].w] > pop[heroWord]) heroWord = WORDS[i].w;
  var heroIdx = -1;
  for (i = 0; i < NREC; i++) if (records[order[i]].word === heroWord) { heroIdx = order[i]; break; }
  var grid = [];
  for (i = 0; i < NREC; i++) if (order[i] !== heroIdx) grid.push(order[i]);
  // print starts: hero first, then grid in initial order
  var starts = {};
  starts[heroIdx] = 0;
  for (i = 0; i < grid.length; i++) starts[grid[i]] = 2.5 + i * 2.55;
  var moments = [];
  var disp = [heroIdx].concat(grid.slice(0, 24));
  for (i = 0; i < disp.length; i++) {
    moments.push(starts[disp[i]] + 2.1);
    moments.push(starts[disp[i]] + 5.6);
  }
  moments.sort(function (x, y) { return x - y; });
  return { records: records, pop: pop, heroIdx: heroIdx, grid: grid, sortMode: -1, starts: starts, stampMoments: moments };
}
cohort = genCohort(93100);

// ---------- canvas / viewport ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 720, H = 720, PHONE = false;
function resize() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  W = vv ? vv.width : (window.innerWidth || 720);
  H = vv ? vv.height : (window.innerHeight || 720);
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  canvas.width = Math.round(W); canvas.height = Math.round(H);
  segs = {}; // snap to assignment on resize
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);
}
resize();

// ---------- layout ----------
function layout() {
  var legendH = PHONE ? 62 : 50;
  var readingH = 28;
  var top = H * 0.025;
  var bot = H - legendH - readingH - 4;
  var x0 = W * 0.02, x1 = W * 0.98;
  var cols = PHONE ? 3 : 5;
  var rows = PHONE ? 5 : 4;
  var cellW = (x1 - x0) / cols, cellH = (bot - top) / rows;
  // cells left empty for the hero: on desktop the two cells straddling the
  // fleet centre (their midpoint IS the centre); on phone the centre cell.
  var skips = PHONE ? [2 * cols + 1] : [1 * cols + 2, 2 * cols + 2];
  var cells = [];
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      if (skips.indexOf(r * cols + c) >= 0) continue;
      cells.push({ x: x0 + cellW * (c + 0.5), y: top + cellH * (r + 0.5) });
    }
  }
  return {
    legendH: legendH, readingH: readingH, top: top, bot: bot,
    cols: cols, rows: rows, cellW: cellW, cellH: cellH, cells: cells,
    cx: (x0 + x1) / 2, cy: (top + bot) / 2,
    need: cells.length
  };
}
function popMax() {
  var m = 1;
  for (var w in cohort.pop) if (cohort.pop[w] > m) m = cohort.pop[w];
  return m;
}
function badgeR(recIdx, L) {
  var cellR = Math.min(L.cellW, L.cellH) * 0.40;
  var f = Math.sqrt(cohort.pop[cohort.records[recIdx].word] / popMax());
  return cellR * Math.max(0.5, f);
}
function basePose(recIdx) {
  var L = layout();
  if (recIdx === cohort.heroIdx) {
    var hr = Math.min(badgeR(recIdx, L) * 1.7, Math.min(L.cellW, L.cellH) * 0.88, (L.bot - L.top) * 0.30);
    return { x: L.cx, y: L.cy, r: hr };
  }
  var slot = cohort.grid.indexOf(recIdx);
  var cell = L.cells[slot % L.cells.length];
  return { x: cell.x, y: cell.y, r: badgeR(recIdx, L) };
}
function pose(recIdx, t) {
  var base = basePose(recIdx);
  var s = segs[recIdx];
  if (s && t >= s.t0 && t < s.t0 + s.dur) {
    var k = smooth((t - s.t0) / s.dur);
    return {
      x: s.fx + (s.tx - s.fx) * k,
      y: s.fy + (s.ty - s.fy) * k,
      r: s.fr + (s.tr - s.fr) * k
    };
  }
  return base;
}
function displayed() {
  var L = layout();
  return [cohort.heroIdx].concat(cohort.grid.slice(0, L.need));
}

// ---------- print clock ----------
function printT(t) {
  var pt = (t + PRINT_OFF - epochShift) % LOOP;
  if (pt < 0) pt += LOOP;
  return pt;
}
function clearAlpha(pt) {
  if (pt >= HOLD_END && pt < HOLD_END + 4) return 1 - (pt - HOLD_END) / 4;
  if (pt >= HOLD_END + 4) return 0;
  return 1;
}
function printProg(recIdx, pt) {
  var st = cohort.starts[recIdx];
  return clamp((pt - st) / 7, 0, 1);
}

// ---------- hand lettering ----------
function handText(str, cx, cy, size, color, seed, bold) {
  ctx.font = (bold ? 'bold ' : '') + size + 'px Georgia, "Times New Roman", serif';
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  var r = mulberry32(seed);
  var widths = [], total = 0, i;
  for (i = 0; i < str.length; i++) {
    var wch = ctx.measureText(str[i]).width + size * 0.06;
    widths.push(wch); total += wch;
  }
  total -= size * 0.06;
  var x = cx - total / 2;
  for (i = 0; i < str.length; i++) {
    var jx = (r() - 0.5) * size * 0.07;
    var jy = (r() - 0.5) * size * 0.12;
    var rot = (r() - 0.5) * 0.055;
    ctx.save();
    ctx.translate(x + widths[i] / 2 + jx, cy + jy);
    ctx.rotate(rot);
    ctx.fillText(str[i], -widths[i] / 2, 0);
    ctx.restore();
    x += widths[i];
  }
  return total;
}
function textWidth(str, size, bold) {
  ctx.font = (bold ? 'bold ' : '') + size + 'px Georgia, "Times New Roman", serif';
  return ctx.measureText(str).width + str.length * size * 0.06;
}

// ---------- badge drawing ----------
function drawToken(kind, cx, cy, s, lw) {
  ctx.strokeStyle = RED;
  ctx.fillStyle = RED;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (kind === 'anchor') {
    ctx.moveTo(cx, cy - 0.95 * s); ctx.lineTo(cx, cy + 0.72 * s);
    ctx.moveTo(cx - 0.55 * s, cy - 0.42 * s); ctx.lineTo(cx + 0.55 * s, cy - 0.42 * s);
    ctx.moveTo(cx - 0.68 * s, cy + 0.28 * s);
    ctx.quadraticCurveTo(cx, cy + 0.95 * s, cx + 0.68 * s, cy + 0.28 * s);
    ctx.moveTo(cx - 0.68 * s, cy + 0.28 * s); ctx.lineTo(cx - 0.44 * s, cy + 0.30 * s);
    ctx.moveTo(cx + 0.68 * s, cy + 0.28 * s); ctx.lineTo(cx + 0.44 * s, cy + 0.30 * s);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy - 1.02 * s, 0.16 * s, 0, Math.PI * 2); ctx.stroke();
  } else if (kind === 'monkey') {
    ctx.arc(cx, cy - 0.02 * s, 0.60 * s, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx - 0.68 * s, cy - 0.38 * s, 0.25 * s, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 0.68 * s, cy - 0.38 * s, 0.25 * s, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 0.30 * s, cy + 0.30 * s);
    ctx.quadraticCurveTo(cx, cy + 0.52 * s, cx + 0.30 * s, cy + 0.30 * s);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx - 0.23 * s, cy - 0.14 * s, 0.075 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 0.23 * s, cy - 0.14 * s, 0.075 * s, 0, Math.PI * 2); ctx.fill();
  } else if (kind === 'gull') {
    ctx.moveTo(cx - 1.05 * s, cy + 0.18 * s);
    ctx.quadraticCurveTo(cx - 0.52 * s, cy - 0.62 * s, cx, cy + 0.02 * s);
    ctx.quadraticCurveTo(cx + 0.52 * s, cy - 0.62 * s, cx + 1.05 * s, cy + 0.18 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy + 0.10 * s); ctx.lineTo(cx, cy + 0.62 * s);
    ctx.moveTo(cx, cy + 0.62 * s); ctx.lineTo(cx - 0.20 * s, cy + 0.82 * s);
    ctx.moveTo(cx, cy + 0.62 * s); ctx.lineTo(cx + 0.20 * s, cy + 0.82 * s);
    ctx.stroke();
  } else { // wheel
    ctx.arc(cx, cy, 0.80 * s, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 0.58 * s, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    for (var k = 0; k < 6; k++) {
      var an = k * Math.PI / 3 + 0.3;
      ctx.moveTo(cx - Math.cos(an) * 0.58 * s, cy - Math.sin(an) * 0.58 * s);
      ctx.lineTo(cx + Math.cos(an) * 0.58 * s, cy + Math.sin(an) * 0.58 * s);
    }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 0.13 * s, 0, Math.PI * 2); ctx.fill();
  }
}

function drawBadge(recIdx, t, pt) {
  var p = printProg(recIdx, pt);
  if (p <= 0) return;
  var rec = cohort.records[recIdx];
  var pos = pose(recIdx, t);
  var cx = pos.x, cy = pos.y, r = pos.r;
  var ca = clearAlpha(pt);
  if (ca <= 0) return;

  var ringProg = clamp(p / 0.30, 0, 1);
  var seaProg  = clamp((p - 0.25) / 0.30, 0, 1);
  var skyProg  = clamp((p - 0.50) / 0.30, 0, 1);
  var tokProg  = clamp((p - 0.75) / 0.25, 0, 1);
  var banProg  = clamp((p - 0.85) / 0.15, 0, 1);

  // ring geometry by openness
  var lw, inset;
  if (rec.ring === 'thin')        { lw = Math.max(1.2, r * 0.050); inset = lw; }
  else if (rec.ring === 'medium') { lw = Math.max(1.6, r * 0.100); inset = lw; }
  else if (rec.ring === 'thick')  { lw = Math.max(2.0, r * 0.180); inset = lw; }
  else                            { lw = Math.max(1.2, r * 0.055); inset = lw * 3.1; }
  var ri = r - inset - r * 0.03;

  ctx.save();
  ctx.globalAlpha = ca;

  // --- ring (stamps in with a slight overshoot) ---
  if (ringProg > 0) {
    var rr = r * (1 + 0.13 * (1 - ringProg) * (1 - ringProg));
    ctx.globalAlpha = ca * Math.min(1, ringProg * 1.6);
    ctx.strokeStyle = BRASS;
    ctx.lineWidth = lw * (rr / r);
    ctx.beginPath(); ctx.arc(cx, cy, rr - lw / 2 * (rr / r), 0, Math.PI * 2); ctx.stroke();
    if (rec.ring === 'double') {
      ctx.beginPath(); ctx.arc(cx, cy, rr - lw * 2.35 * (rr / r), 0, Math.PI * 2); ctx.stroke();
    }
  }

  // --- interior, clipped ---
  ctx.globalAlpha = ca;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, ri, 0, Math.PI * 2); ctx.clip();

  // sky: hatch density = neuroticism
  if (skyProg > 0) {
    ctx.save();
    ctx.beginPath(); ctx.rect(cx - ri, cy - ri, ri * 2, ri); ctx.clip();
    ctx.strokeStyle = GRAY;
    ctx.lineWidth = Math.max(0.8, r * 0.022);
    ctx.globalAlpha = ca * 0.85 * Math.min(1, skyProg * 1.4);
    var lines = [];
    var hn = 2 + Math.round(rec.n * 7), k;
    for (k = 0; k < hn; k++) lines.push({ h: cy - ri + (k + 0.5) * (ri / hn) });
    var diag = [];
    if (rec.n >= 0.4) {
      var dn = 1 + Math.round((rec.n - 0.4) / 0.6 * 8);
      var sp = (ri * 2) / (dn + 2);
      for (k = 0; k < dn + 2; k++) diag.push(-ri + k * sp);
    }
    var totalLines = lines.length + diag.length * 2;
    var show = Math.ceil(totalLines * skyProg);
    var li;
    for (li = 0; li < lines.length && li < show; li++) {
      ctx.beginPath();
      ctx.moveTo(cx - ri, lines[li].h); ctx.lineTo(cx + ri, lines[li].h);
      ctx.stroke();
    }
    var rem = show - lines.length;
    for (k = 0; k < diag.length && rem > 0; k++, rem--) {
      ctx.beginPath();
      ctx.moveTo(cx + diag[k] - ri * 0.4, cy);
      ctx.lineTo(cx + diag[k] + ri * 0.4, cy - ri);
      ctx.stroke();
    }
    for (k = 0; k < diag.length && rem > 0; k++, rem--) {
      ctx.beginPath();
      ctx.moveTo(cx + diag[k] + ri * 0.4, cy);
      ctx.lineTo(cx + diag[k] - ri * 0.4, cy - ri);
      ctx.stroke();
    }
    ctx.restore();
  }

  // sea: wave amplitude = conscientiousness
  if (seaProg > 0) {
    ctx.save();
    ctx.beginPath(); ctx.rect(cx - ri, cy, ri * 2, ri); ctx.clip();
    ctx.strokeStyle = TEAL;
    ctx.lineWidth = Math.max(0.9, r * 0.028);
    ctx.globalAlpha = ca * 0.9;
    var amp = (0.02 + 0.15 * rec.c) * ri;
    var xEnd = cx - ri + 2 * ri * seaProg;
    var rowsW = [0.16, 0.38, 0.60, 0.82], rw;
    for (rw = 0; rw < rowsW.length; rw++) {
      var wy = cy + ri * rowsW[rw];
      ctx.beginPath();
      var steps = 28, sx;
      for (sx = 0; sx <= steps; sx++) {
        var wx = cx - ri + (2 * ri) * (sx / steps);
        if (wx > xEnd) break;
        var wyy = wy + Math.sin((wx - cx) / ri * 5 + rw * 1.7) * amp;
        if (sx === 0) ctx.moveTo(wx, wyy); else ctx.lineTo(wx, wyy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // horizon
  ctx.globalAlpha = ca * Math.max(seaProg, skyProg) * 0.8;
  ctx.strokeStyle = NAVY;
  ctx.lineWidth = Math.max(0.8, r * 0.02);
  ctx.beginPath(); ctx.moveTo(cx - ri, cy); ctx.lineTo(cx + ri, cy); ctx.stroke();

  ctx.restore(); // unclip

  // --- banner with the survey word ---
  if (banProg > 0) {
    var word = rec.word.toUpperCase();
    var bs = Math.max(7, r * 0.17);
    var tw = textWidth(word, bs, true);
    var maxW = ri * 1.86;
    var guard = 0;
    while (tw > maxW && bs > 6 && guard < 30) { bs *= 0.92; tw = textWidth(word, bs, true); guard++; }
    var bh = Math.max(10, r * 0.27);
    var by = cy + ri * 0.52;
    var bw = tw + bh * 0.95;
    var bx = cx - bw / 2;
    ctx.globalAlpha = ca * banProg;
    ctx.beginPath();
    ctx.moveTo(bx, by - bh / 2);
    ctx.lineTo(bx + bw, by - bh / 2);
    ctx.lineTo(bx + bw - bh * 0.22, by);
    ctx.lineTo(bx + bw, by + bh / 2);
    ctx.lineTo(bx, by + bh / 2);
    ctx.lineTo(bx + bh * 0.22, by);
    ctx.closePath();
    ctx.fillStyle = PAPER; ctx.fill();
    ctx.strokeStyle = NAVY; ctx.lineWidth = Math.max(0.8, r * 0.02); ctx.stroke();
    handText(word, cx, by + bs * 0.04, bs, NAVY, 5000 + recIdx * 37, true);
  }

  // --- token (stamps in) ---
  if (tokProg > 0) {
    var ts = r * 0.30 * (1 + 0.30 * (1 - tokProg) * (1 - tokProg));
    ctx.globalAlpha = ca * Math.min(1, tokProg * 1.6);
    drawToken(rec.token, cx, cy - ri * 0.06, ts, Math.max(1.2, r * 0.045));
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---------- readings ----------
function readingFor(rec) {
  var sky = rec.n < 0.25 ? 'calm sky' : (rec.n < 0.55 ? 'restless sky' : (rec.n < 0.80 ? 'stormy sky' : 'tempest sky'));
  var sea = rec.c < 0.25 ? 'flat sea' : (rec.c < 0.55 ? 'easy sea' : (rec.c < 0.80 ? 'choppy sea' : 'heavy sea'));
  var tok = rec.token + ' heart';
  var ring = rec.ring === 'thin' ? 'fine ring' : (rec.ring === 'medium' ? 'bold ring' : (rec.ring === 'thick' ? 'heavy ring' : 'double ring'));
  return rec.word + ': ' + sky + ', ' + sea + ', ' + tok + ', ' + ring;
}
function readingAt(t) {
  var cur = null;
  for (var i = 0; i < readings.length; i++) if (readings[i].t <= t) cur = readings[i];
  return cur;
}

// ---------- audio: lazy, gesture-born ----------
var AC = null, masterGain = null;
function ensureAudio() {
  if (AC) { if (AC.resume) AC.resume(); return; }
  if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
  try {
    var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext : webkitAudioContext;
    AC = new Ctor();
    masterGain = AC.createGain(); masterGain.gain.value = 0.85;
    masterGain.connect(AC.destination);
  } catch (e) { AC = null; }
}
function thump(when, vol) {
  if (!AC) return;
  var o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(130, when);
  o.frequency.exponentialRampToValueAtTime(48, when + 0.11);
  var g = AC.createGain();
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.001, when + 0.14);
  o.connect(g); g.connect(masterGain);
  o.start(when); o.stop(when + 0.16);
}
function bell(when) {
  if (!AC) return;
  var freqs = [1318.5, 1975.5];
  for (var i = 0; i < freqs.length; i++) {
    var o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = freqs[i];
    var g = AC.createGain();
    g.gain.setValueAtTime(i === 0 ? 0.11 : 0.05, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 1.3);
    o.connect(g); g.connect(masterGain);
    o.start(when); o.stop(when + 1.35);
  }
}
var prevPT = null;
function audioFrame(t) {
  if (!AC) return;
  var pt = printT(t);
  if (prevPT !== null && pt < PRINT_END) {
    var moments = cohort.stampMoments, n = 0;
    for (var i = 0; i < moments.length; i++) {
      var m = moments[i], crossed;
      if (pt >= prevPT) crossed = (m > prevPT && m <= pt);
      else crossed = (m > prevPT || m <= pt);
      if (crossed && n < 4) { thump(AC.currentTime + 0.02 + n * 0.045, 0.13); n++; }
    }
  }
  prevPT = pt;
}

// ---------- draw ----------
function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  var L = layout();
  var pt = printT(t);
  var disp = displayed();
  var di;
  // grid badges first, hero last (on top)
  for (di = 1; di < disp.length; di++) drawBadge(disp[di], t, pt);
  drawBadge(disp[0], t, pt);

  // reading line
  var rd = readingAt(t);
  if (rd) {
    var ra = Math.min(1, (t - rd.t) / 0.4);
    ctx.save();
    ctx.globalAlpha = ra;
    handText(readingFor(cohort.records[rd.recIdx]), W / 2, L.bot + L.readingH * 0.62, PHONE ? 11.5 : 13.5, INK, 777, false);
    ctx.restore();
  }

  // legend strip (same hand as the badges)
  var ly = H - L.legendH;
  ctx.strokeStyle = NAVY;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W * 0.04, ly + 2); ctx.lineTo(W * 0.96, ly + 2); ctx.stroke();
  ctx.globalAlpha = 1;
  var legend = 'SKY = NERVES \u00B7 SEA = CARE \u00B7 TOKEN = WARMTH \u00B7 RING = OPENNESS \u00B7 SIZE = POPULARITY';
  var ls = PHONE ? 10 : 12.5;
  if (!PHONE || textWidth(legend, ls, false) <= W * 0.94) {
    handText(legend, W / 2, ly + L.legendH * 0.58, ls, INK, 4242, false);
  } else {
    handText('SKY = NERVES \u00B7 SEA = CARE \u00B7 TOKEN = WARMTH', W / 2, ly + L.legendH * 0.36, ls, INK, 4243, false);
    handText('RING = OPENNESS \u00B7 SIZE = POPULARITY', W / 2, ly + L.legendH * 0.74, ls, INK, 4244, false);
  }
}

// ---------- interaction ----------
var T0 = Date.now();
function evT() { return (Date.now() - T0) / 1000; }
var downInfo = null, lastTap = null;

function hitBadge(x, y, t) {
  var disp = displayed();
  // hero first (drawn on top), then grid in reverse order
  var order = [disp[0]];
  for (var i = disp.length - 1; i >= 1; i--) order.push(disp[i]);
  for (i = 0; i < order.length; i++) {
    var p = pose(order[i], t);
    var dx = x - p.x, dy = y - p.y;
    if (dx * dx + dy * dy <= p.r * p.r * 1.1) return order[i];
  }
  return -1;
}
function swapHero(recIdx, t) {
  var old = cohort.heroIdx;
  if (recIdx === old) return;
  var pOld = pose(old, t), pNew = pose(recIdx, t);
  var slot = cohort.grid.indexOf(recIdx);
  cohort.grid[slot] = old;
  cohort.heroIdx = recIdx;
  var bOld = basePose(old), bNew = basePose(recIdx);
  segs[old] = { t0: t, dur: 0.8, fx: pOld.x, fy: pOld.y, fr: pOld.r, tx: bOld.x, ty: bOld.y, tr: bOld.r };
  segs[recIdx] = { t0: t, dur: 0.8, fx: pNew.x, fy: pNew.y, fr: pNew.r, tx: bNew.x, ty: bNew.y, tr: bNew.r };
}
var SORTS = [
  function (a, b) { var d = cohort.records[a].word.localeCompare(cohort.records[b].word); return d !== 0 ? d : cohort.pop[cohort.records[b].word] - cohort.pop[cohort.records[a].word]; },
  function (a, b) { return cohort.records[b].n - cohort.records[a].n; },
  function (a, b) { var d = cohort.pop[cohort.records[b].word] - cohort.pop[cohort.records[a].word]; return d !== 0 ? d : cohort.records[a].word.localeCompare(cohort.records[b].word); }
];
function shuffleFleet(t) {
  cohort.sortMode = (cohort.sortMode + 1) % 3;
  var before = {};
  var i;
  for (i = 0; i < cohort.grid.length; i++) before[cohort.grid[i]] = pose(cohort.grid[i], t);
  var vis = cohort.grid.slice(0, layout().need);
  var rest = cohort.grid.slice(layout().need);
  vis.sort(SORTS[cohort.sortMode]);
  cohort.grid = vis.concat(rest);
  for (i = 0; i < vis.length; i++) {
    var bp = basePose(vis[i]), op = before[vis[i]];
    if (Math.abs(bp.x - op.x) > 0.5 || Math.abs(bp.y - op.y) > 0.5) {
      segs[vis[i]] = { t0: t, dur: 1.0, fx: op.x, fy: op.y, fr: op.r, tx: bp.x, ty: bp.y, tr: bp.r };
    }
  }
}
function reseed(t) {
  cohortN++;
  cohort = genCohort(93100 + cohortN * 7919);
  segs = {};
  readings = [];
  epochShift = t + PRINT_OFF; // print clock restarts at 0
  prevPT = null;
  if (AC) thump(AC.currentTime + 0.02, 0.2);
}
function onDown(e) {
  ensureAudio();
  var x = (e.clientX !== undefined) ? e.clientX : W / 2;
  var y = (e.clientY !== undefined) ? e.clientY : H / 2;
  downInfo = { t: evT(), x: x, y: y, lx: x, ly: y };
}
function onMove(e) {
  if (!downInfo) return;
  downInfo.lx = (e.clientX !== undefined) ? e.clientX : downInfo.lx;
  downInfo.ly = (e.clientY !== undefined) ? e.clientY : downInfo.ly;
}
function onUp(e) {
  if (!downInfo) return;
  var t = evT();
  var tapX = downInfo.x, tapY = downInfo.y;
  var dx = downInfo.lx - downInfo.x, dy = downInfo.ly - downInfo.y;
  var adx = Math.abs(dx), ady = Math.abs(dy);
  var wasSwipe = adx > 60 && adx > 1.6 * ady;
  var wasTap = adx < 10 && ady < 10;
  downInfo = null;
  if (wasSwipe) { lastTap = null; shuffleFleet(t); return; }
  if (!wasTap) return;
  if (lastTap && t - lastTap < 0.35) {
    lastTap = null;
    reseed(t);
    return;
  }
  lastTap = t;
  var hit = hitBadge(tapX, tapY, t);
  if (hit >= 0) {
    swapHero(hit, t);
    readings.push({ t: t, recIdx: hit });
    if (AC) bell(AC.currentTime + 0.02);
  }
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { downInfo = null; });
}

// ---------- run ----------
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    var t = (Date.now() - T0) / 1000;
    draw(t);
    audioFrame(t);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
