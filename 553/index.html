<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loco Pimiento</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2E8D0; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict, nothing else) ----------
  var GREEN = '#5C7A3D';   // pepper
  var TAN   = '#EAC97E';   // caption banners
  var BROWN = '#B96A35';   // hatched office ground
  var PURPLE= '#8A5AA8';   // eggplant
  var ORANGE= '#E07B39';   // carrot
  var RED   = '#D93A2B';   // title red (radish body: palette has no pink)
  var INK   = '#1A1A1A';
  var CREAM = '#F2E8D0';   // paper

  // ---------- seeded RNG (mulberry32, fixed seed) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(553067);

  // ---------- design space: portrait page 1080 x 1440 ----------
  var DW = 1080, DH = 1440;

  // ---------- title letter jitter (precomputed, seeded) ----------
  var TITLE = 'LOCO PIMIENTO';
  var titleJit = [];
  for (var ti = 0; ti < TITLE.length; ti++) {
    titleJit.push({ rot: (rng() - 0.5) * 0.09, dy: (rng() - 0.5) * 9, dx: (rng() - 0.5) * 4 });
  }

  // ---------- panels ----------
  // column boundaries and row boundaries (uneven gutters via per-panel jitter)
  var COLB = [36, 372, 708, 1044];
  var ROWB = [238, 802, 1366];
  var CAPTIONS = {
    0: 'LOCO PIMIENTO ES UN PELIGRO TRABAJANDO',
    2: 'ROMPE COSAS',
    5: 'PERO NADIE SE ATREVE A DESPEDIRLO PORQUE ESTÁ PIRADO…'
  };
  // initial composed states: an escalation read across the page
  var INIT_STATES = [0, 1, 2, 1, 2, 3];
  var panels = [];
  for (var pi = 0; pi < 6; pi++) {
    var col = pi % 3, row = (pi / 3) | 0;
    var jx = (rng() - 0.5) * 14, jy = (rng() - 0.5) * 14;
    var jw = (rng() - 0.5) * 12, jh = (rng() - 0.5) * 12;
    panels.push({
      i: pi,
      x: COLB[col] + 15 + jx, y: ROWB[row] + 15 + jy,
      w: (COLB[col + 1] - COLB[col]) - 30 + jw,
      h: (ROWB[row + 1] - ROWB[row]) - 30 + jh,
      state: INIT_STATES[pi],
      seed: 1000 + pi * 137,
      framePts: null
    });
  }

  // wobbly frame path points for a panel (seeded, fixed)
  function framePoints(p) {
    var r = mulberry32(p.seed);
    var pts = [];
    var steps = 7, k, t;
    for (k = 0; k <= steps; k++) { t = k / steps; pts.push([p.x + t * p.w, p.y + (r() - 0.5) * 7]); }
    for (k = 1; k <= steps; k++) { t = k / steps; pts.push([p.x + p.w + (r() - 0.5) * 7, p.y + t * p.h]); }
    for (k = 1; k <= steps; k++) { t = k / steps; pts.push([p.x + p.w - t * p.w, p.y + p.h + (r() - 0.5) * 7]); }
    for (k = 1; k < steps; k++) { t = k / steps; pts.push([p.x + (r() - 0.5) * 7, p.y + p.h - t * p.h]); }
    return pts;
  }
  panels.forEach(function (p) { p.framePts = framePoints(p); });

  // ---------- interaction state ----------
  var shake = 0;          // 0..1 page shake amount (decays)
  var dartX = 0;          // pepper pupil dart offset, design px
  var dragging = false, lastPX = 0, downX = 0, downY = 0, downT = 0, moved = 0;

  // ---------- canvas / sizing ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var viewW = 0, viewH = 0, scaleF = 1, offX = 0, offY = 0;

  function isPhone() {
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : 0;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : 0;
    if (sw && sh) return Math.min(sw, sh) < 700;
    return viewH > viewW * 1.15;
  }

  function resize() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    viewW = vv ? vv.width : window.innerWidth;
    viewH = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // portrait page keeps its shape; fit whole page, center
    scaleF = Math.min(viewW / DW, viewH / DH);
    offX = (viewW - DW * scaleF) / 2;
    offY = (viewH - DH * scaleF) / 2;
    draw(currentT);
  }

  // ---------- helpers ----------
  function poly(pts, close) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (close) ctx.closePath();
  }
  function wobRect(x, y, w, h, seed, amt) {
    var r = mulberry32(seed), pts = [], steps = 5, k, t;
    for (k = 0; k <= steps; k++) { t = k / steps; pts.push([x + t * w, y + (r() - 0.5) * amt]); }
    for (k = 1; k <= steps; k++) { t = k / steps; pts.push([x + w + (r() - 0.5) * amt, y + t * h]); }
    for (k = 1; k <= steps; k++) { t = k / steps; pts.push([x + w - t * w, y + h + (r() - 0.5) * amt]); }
    for (k = 1; k < steps; k++) { t = k / steps; pts.push([x + (r() - 0.5) * amt, y + h - t * h]); }
    return pts;
  }
  function ellipse(x, y, rx, ry) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  }
  function line(x1, y1, x2, y2) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  // hand-lettered text: per-letter jitter from a seeded stream
  function handText(text, cx, y, font, color, seed, spacing) {
    var r = mulberry32(seed);
    ctx.font = font; ctx.fillStyle = color; ctx.textBaseline = 'middle';
    var widths = [], total = 0, i, w;
    for (i = 0; i < text.length; i++) { w = ctx.measureText(text[i]).width; widths.push(w); total += w + (spacing || 0); }
    total -= (spacing || 0);
    var x = cx - total / 2;
    for (i = 0; i < text.length; i++) {
      ctx.save();
      ctx.translate(x + widths[i] / 2, y + (r() - 0.5) * 5);
      ctx.rotate((r() - 0.5) * 0.07);
      ctx.textAlign = 'center';
      ctx.fillText(text[i], 0, 0);
      ctx.restore();
      x += widths[i] + (spacing || 0);
    }
    return total;
  }
  function wrapLines(text, font, maxW) {
    ctx.font = font;
    var words = text.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var trial = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(trial).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = trial;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ---------- title ----------
  function drawTitle() {
    var font = '900 106px "Arial Black", "Archivo Black", sans-serif';
    ctx.font = font; ctx.textBaseline = 'middle';
    var widths = [], total = 0, i;
    for (i = 0; i < TITLE.length; i++) { var w = ctx.measureText(TITLE[i]).width; widths.push(w); total += w + 3; }
    total -= 3;
    function pass(color, ox, oy) {
      var x = DW / 2 - total / 2;
      ctx.fillStyle = color;
      for (var i = 0; i < TITLE.length; i++) {
        ctx.save();
        ctx.translate(x + widths[i] / 2 + titleJit[i].dx + ox, 108 + titleJit[i].dy + oy);
        ctx.rotate(titleJit[i].rot);
        ctx.textAlign = 'center';
        ctx.fillText(TITLE[i], 0, 0);
        ctx.restore();
        x += widths[i] + 3;
      }
    }
    pass(INK, 7, 7);       // black offset shadow
    pass(RED, 0, 0);       // red letters
    handText('por ROBERTA VÁZQUEZ', DW / 2, 196, 'italic 700 37px Georgia, serif', INK, 777, 1);
  }

  // ---------- crosshatch ground ----------
  function drawHatch(p) {
    var inset = 9;
    var x0 = p.x + inset, y0 = p.y + inset, x1 = p.x + p.w - inset, y1 = p.y + p.h - inset;
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    ctx.fillStyle = BROWN; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    var spacing = 30 - p.state * 5.5;         // denser as anger rises
    var off = (p.seed % 17);
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.42; ctx.lineWidth = 2.2;
    var d, k;
    ctx.beginPath();
    for (d = -p.h; d < p.w + p.h; d += spacing) {
      ctx.moveTo(x0 + d + off, y0); ctx.lineTo(x0 + d + off + p.h, y1);
    }
    ctx.stroke();
    ctx.beginPath();
    for (k = -p.h; k < p.w + p.h; k += spacing + 4) {
      ctx.moveTo(x0 + k + off, y1); ctx.lineTo(x0 + k + off + p.h, y0);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- characters ----------
  // the pepper: cx, floorY (feet), s = scale, anger 0..3, tremble phase
  function drawPepper(cx, floorY, s, anger, t, seed) {
    var bob = (anger >= 3) ? Math.sin(t * 30 + seed) * 1.6 : 0;
    ctx.save(); ctx.translate(cx + bob, floorY); ctx.scale(s, s);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // legs + shoes
    ctx.strokeStyle = INK; ctx.lineWidth = 7;
    line(-20, -58, -24, -8); line(20, -58, 24, -8);
    ctx.fillStyle = INK;
    ellipse(-28, -5, 15, 7); ctx.fill();
    ellipse(28, -5, 15, 7); ctx.fill();
    // arms
    ctx.strokeStyle = INK; ctx.lineWidth = 8;
    line(-52, -120, -84, -84 + (anger >= 2 ? -8 : 0));
    line(52, -120, 84, -84 + (anger >= 2 ? -8 : 0));
    // body: bell pepper blob with lobes
    ctx.beginPath();
    ctx.moveTo(0, -196);
    ctx.bezierCurveTo(-34, -200, -52, -186, -56, -158);
    ctx.bezierCurveTo(-66, -120, -60, -66, -38, -52);
    ctx.bezierCurveTo(-16, -40, 16, -40, 38, -52);
    ctx.bezierCurveTo(60, -66, 66, -120, 56, -158);
    ctx.bezierCurveTo(52, -186, 34, -200, 0, -196);
    ctx.closePath();
    ctx.fillStyle = GREEN; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    // lobe lines
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.moveTo(-26, -188); ctx.bezierCurveTo(-34, -140, -32, -90, -22, -56); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(26, -188); ctx.bezierCurveTo(34, -140, 32, -90, 22, -56); ctx.stroke();
    ctx.globalAlpha = 1;
    // stem
    ctx.beginPath();
    ctx.moveTo(-10, -194); ctx.quadraticCurveTo(-4, -224, 14, -226);
    ctx.quadraticCurveTo(20, -212, 10, -196); ctx.closePath();
    ctx.fillStyle = GREEN; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
    // face: heavy-lidded eyes
    var eyeY = -158;
    [-21, 21].forEach(function (ex) {
      ellipse(ex, eyeY, 13.5, 11); ctx.fillStyle = CREAM; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
      ellipse(ex + dartX, eyeY + 3, 5, 5.5); ctx.fillStyle = INK; ctx.fill();
      // heavy lid: green cap over top of eye, lower as anger rises
      ctx.beginPath();
      ctx.ellipse(ex, eyeY, 14.5, 12, 0, Math.PI, Math.PI * 2);
      ctx.lineTo(ex + 14.5, eyeY - 2 - anger * 1.6); ctx.lineTo(ex - 14.5, eyeY - 2 - anger * 1.6);
      ctx.closePath(); ctx.fillStyle = GREEN; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
    });
    // brows: angle steepens with anger
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
    var ba = 4 + anger * 5;
    line(-36, eyeY - 26 + ba, -7, eyeY - 26 - ba * 0.4);
    line(36, eyeY - 26 + ba, 7, eyeY - 26 - ba * 0.4);
    // mouth by anger: flat / wavy / zigzag teeth / open shout. NEVER a smile.
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    var my = -104, i, x;
    if (anger === 0) { line(-17, my, 17, my); }
    else if (anger === 1) {
      ctx.beginPath(); ctx.moveTo(-18, my);
      for (i = 0; i < 4; i++) ctx.quadraticCurveTo(-18 + i * 9 + 4.5, my + ((i % 2) ? 5 : -5), -18 + (i + 1) * 9, my);
      ctx.stroke();
    } else if (anger === 2) {
      ctx.beginPath(); ctx.moveTo(-19, my);
      for (i = 0; i < 6; i++) { x = -19 + (i + 1) * 6.3; ctx.lineTo(x, my + ((i % 2) ? 7 : -3)); }
      ctx.stroke();
    } else {
      ellipse(0, my + 4, 17, 13); ctx.fillStyle = RED; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
      line(-17, my - 4, 17, my - 4);
      // anger puff at the stem
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(34, -216, 9, 0.4, 5.2); ctx.arc(48, -208, 7, 1.2, 6.4); ctx.stroke();
    }
    ctx.restore();
  }

  // coworkers: kind 'eggplant' | 'carrot' | 'radish'; fear 0..3
  function drawCoworker(kind, cx, floorY, s, fear, t, seed) {
    var tremble = fear >= 3 ? Math.sin(t * 34 + seed) * 2 : (fear === 2 ? Math.sin(t * 22 + seed) * 1 : 0);
    ctx.save(); ctx.translate(cx + tremble, floorY); ctx.scale(s, s);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
    line(-13, -46, -16, -6); line(13, -46, 16, -6);
    ctx.fillStyle = INK;
    ellipse(-19, -3, 12, 6); ctx.fill(); ellipse(19, -3, 12, 6); ctx.fill();
    ctx.lineWidth = 7;
    if (kind === 'eggplant') {
      ellipse(0, -102, 40, 58); ctx.fillStyle = PURPLE; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
      ctx.beginPath(); // calyx
      ctx.moveTo(-30, -146); ctx.quadraticCurveTo(0, -128, 30, -146);
      ctx.quadraticCurveTo(16, -162, 0, -160); ctx.quadraticCurveTo(-16, -162, -30, -146);
      ctx.closePath(); ctx.fillStyle = GREEN; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -158); ctx.quadraticCurveTo(4, -176, 14, -180); ctx.stroke();
    } else if (kind === 'carrot') {
      ctx.beginPath();
      ctx.moveTo(-30, -158); ctx.quadraticCurveTo(0, -168, 30, -158);
      ctx.quadraticCurveTo(24, -90, 0, -34); ctx.quadraticCurveTo(-24, -90, -30, -158);
      ctx.closePath(); ctx.fillStyle = ORANGE; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
      line(-16, -116, 2, -112); line(-8, -80, 12, -76);
      ctx.strokeStyle = GREEN; ctx.lineWidth = 7;
      line(0, -162, -14, -188); line(0, -162, 2, -192); line(0, -162, 16, -186);
    } else { // radish in title red (palette has no pink: construction choice)
      ellipse(0, -96, 42, 52); ctx.fillStyle = RED; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8, -50); ctx.quadraticCurveTo(0, -26, 6, -16); ctx.stroke();
      ctx.strokeStyle = GREEN; ctx.lineWidth = 7;
      line(0, -144, -18, -172); line(0, -144, 0, -178); line(0, -144, 18, -170);
    }
    // worried face: raised arc brows, small wavy mouth, sweat at fear>=2
    var fy = kind === 'carrot' ? -128 : -108;
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(-15, fy - 12, 8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(15, fy - 12, 8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ellipse(-14, fy, 4.5, 6); ctx.fillStyle = INK; ctx.fill();
    ellipse(14, fy, 4.5, 6); ctx.fill();
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-10, fy + 20);
    ctx.quadraticCurveTo(-5, fy + 15 + fear, 0, fy + 20);
    ctx.quadraticCurveTo(5, fy + 25 + fear, 10, fy + 20); ctx.stroke();
    if (fear >= 2) {
      ctx.fillStyle = CREAM;
      [[-52, -128], [52, -118], [-48, -88]].forEach(function (d) {
        ctx.beginPath();
        ctx.moveTo(d[0], d[1] - 10);
        ctx.quadraticCurveTo(d[0] + 7, d[1] + 4, d[0], d[1] + 9);
        ctx.quadraticCurveTo(d[0] - 7, d[1] + 4, d[0], d[1] - 10);
        ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
      });
    }
    ctx.restore();
  }

  // ---------- props ----------
  function drawMop(x, y, ang) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.lineCap = 'round';
    line(0, 0, 0, -118);
    ctx.strokeStyle = CREAM; ctx.lineWidth = 5;
    for (var i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(i * 6, 0);
      ctx.quadraticCurveTo(i * 9, 16, i * 11, 30 + Math.abs(i) * 3); ctx.stroke();
    }
    ctx.restore();
  }
  function drawBucket(x, floorY) {
    ctx.beginPath();
    ctx.moveTo(x - 26, floorY - 40); ctx.lineTo(x + 26, floorY - 40);
    ctx.lineTo(x + 20, floorY); ctx.lineTo(x - 20, floorY); ctx.closePath();
    ctx.fillStyle = RED; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x, floorY - 40, 26, 7, 0, Math.PI, Math.PI * 2); ctx.stroke();
  }
  function drawComputer(p, cx, floorY, t) {
    // desk
    ctx.fillStyle = INK; ctx.fillRect(cx - 118, floorY - 66, 236, 12);
    ctx.fillRect(cx - 108, floorY - 54, 12, 54); ctx.fillRect(cx + 96, floorY - 54, 12, 54);
    // monitor
    var mx = cx - 62, my = floorY - 196, mw = 124, mh = 96;
    poly(wobRect(mx, my, mw, mh, p.seed + 55, 4), true);
    ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.rect(mx + 8, my + 8, mw - 16, mh - 16); ctx.clip();
    if (p.state >= 2) {
      ctx.strokeStyle = RED; ctx.lineWidth = 9; ctx.lineCap = 'round';
      line(mx + 26, my + 22, mx + mw - 26, my + mh - 22);
      line(mx + mw - 26, my + 22, mx + 26, my + mh - 22);
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
      line(mx + 14, my + 6, mx + 40, my + 34); line(mx + 40, my + 34, mx + 34, my + 60);
      line(mx + mw - 12, my + 40, mx + mw - 38, my + 52);
    } else {
      ctx.strokeStyle = INK; ctx.lineWidth = 4;
      for (var i = 0; i < 3; i++) line(mx + 20, my + 26 + i * 20, mx + 20 + [70, 48, 84][i], my + 26 + i * 20);
      ctx.fillStyle = TAN; ctx.fillRect(mx + 20, my + mh - 26, 30, 10);
    }
    ctx.restore();
    ctx.fillStyle = INK; ctx.fillRect(cx - 8, floorY - 100, 16, 34);
    // keyboard
    poly(wobRect(cx - 44, floorY - 60, 88, 14, p.seed + 56, 3), true);
    ctx.fillStyle = TAN; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
    // speech bubble once the error lands
    if (p.state >= 2) {
      var bw = 252, bh = 96, bx = cx - bw / 2, by = my - bh - 26;
      poly(wobRect(bx, by, bw, bh, p.seed + 57, 6), true);
      ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - 14, by + bh - 2); ctx.lineTo(cx + 6, by + bh + 24); ctx.lineTo(cx + 22, by + bh - 2);
      ctx.closePath(); ctx.fillStyle = CREAM; ctx.fill(); ctx.stroke();
      var lines = wrapLines('¿QUÉ DIABLOS ACABO DE HACER?', '700 25px sans-serif', bw - 30);
      for (var li = 0; li < lines.length; li++) {
        handText(lines[li], cx, by + bh / 2 + (li - (lines.length - 1) / 2) * 30, '700 25px sans-serif', INK, p.seed + 60 + li, 0);
      }
    }
  }
  function drawBrokenChair(x, floorY, seed) {
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    // tilted backrest: two posts and two slats, leaning after the fall
    line(x - 40, floorY - 98, x - 18, floorY - 38);
    line(x - 8, floorY - 104, x + 14, floorY - 44);
    line(x - 43, floorY - 88, x - 5, floorY - 94);
    line(x - 36, floorY - 66, x + 2, floorY - 72);
    // seat board with red cushion
    line(x - 22, floorY - 40, x + 44, floorY - 40);
    ctx.fillStyle = RED;
    ellipse(x + 10, floorY - 45, 32, 8); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
    ellipse(x + 10, floorY - 45, 32, 8); ctx.stroke();
    // legs: one straight, one splayed, one snapped off lying on the floor
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
    line(x + 38, floorY - 40, x + 42, floorY);
    line(x - 18, floorY - 40, x - 36, floorY);
    line(x + 56, floorY - 4, x + 88, floorY - 18);
    line(x + 62, floorY - 16, x + 70, floorY - 2);
  }

  // ---------- panel scenes ----------
  function drawScene(p, t) {
    var cx = p.x + p.w / 2, floorY = p.y + p.h - 42;
    ctx.save();
    ctx.beginPath(); ctx.rect(p.x + 7, p.y + 7, p.w - 14, p.h - 14); ctx.clip();
    if (p.i === 0) {
      // mopping the office, puddle small
      ctx.strokeStyle = CREAM; ctx.lineWidth = 4;
      ellipse(cx - 60, floorY + 16, 74, 11); ctx.stroke();
      ellipse(cx - 60, floorY + 16, 44, 7); ctx.stroke();
      drawPepper(cx - 18, floorY, 0.92, p.state, t, p.seed);
      drawMop(cx + 52, floorY + 8, 0.5);
      drawBucket(cx - 116, floorY);
    } else if (p.i === 1) {
      // the flood rises with the state
      var wl = 16 + p.state * 30;
      ctx.fillStyle = CREAM;
      ctx.beginPath();
      ctx.moveTo(p.x + 7, floorY + 34);
      for (var wx = p.x + 7; wx <= p.x + p.w - 7; wx += 18) {
        ctx.quadraticCurveTo(wx + 9, floorY + 34 - wl - 8 + Math.sin(wx * 0.05 + p.seed) * 3, wx + 18, floorY + 34 - wl);
      }
      ctx.lineTo(p.x + p.w - 7, p.y + p.h - 7); ctx.lineTo(p.x + 7, p.y + p.h - 7); ctx.closePath();
      ctx.globalAlpha = 0.88; ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.beginPath();
      for (var wx2 = p.x + 20; wx2 <= p.x + p.w - 30; wx2 += 18) {
        ctx.quadraticCurveTo(wx2 + 9, floorY + 34 - wl - 8 + Math.sin(wx2 * 0.05 + p.seed) * 3, wx2 + 18, floorY + 34 - wl);
        if (wx2 === p.x + 20) ctx.moveTo(wx2, floorY + 34 - wl);
      }
      ctx.stroke();
      drawPepper(cx - 40, floorY, 0.92, p.state, t, p.seed);
      drawMop(cx + 34, floorY - 26, -0.4);
      drawBucket(cx + 118, floorY - wl + 30);
    } else if (p.i === 2) {
      drawComputer(p, cx + 30, floorY, t);
      drawPepper(cx - 102, floorY, 0.72, p.state, t, p.seed);
    } else if (p.i === 3) {
      // coworkers watch the pepper lose it
      drawPepper(cx - 98, floorY, 0.95, p.state, t, p.seed);
      drawCoworker('eggplant', cx + 44, floorY, 0.8, p.state, t, p.seed + 1);
      drawCoworker('carrot', cx + 108, floorY, 0.8, p.state, t, p.seed + 2);
    } else if (p.i === 4) {
      // he breaks things
      drawBrokenChair(cx + 22, floorY, p.seed);
      drawPepper(cx - 92, floorY, 0.95, p.state, t, p.seed);
      drawCoworker('radish', cx + 110, floorY, 0.78, p.state, t, p.seed + 3);
    } else {
      // nobody dares fire him: the whole pantry huddles
      drawCoworker('eggplant', cx - 112, floorY, 0.84, p.state, t, p.seed + 4);
      drawCoworker('carrot', cx - 28, floorY, 0.84, p.state, t, p.seed + 5);
      drawCoworker('radish', cx + 50, floorY, 0.84, p.state, t, p.seed + 6);
      drawPepper(cx + 112, floorY, 0.5, p.state, t, p.seed);
    }
    ctx.restore();
  }

  function drawCaption(p) {
    var text = CAPTIONS[p.i];
    var font = p.i === 5 ? '700 24px sans-serif' : '700 27px sans-serif';
    var lines = wrapLines(text, font, p.w - 56);
    var bh = lines.length * 32 + 20;
    var bx = p.x + 18, by = p.y + 16, bw = p.w - 36;
    poly(wobRect(bx, by, bw, bh, p.seed + 91, 5), true);
    ctx.fillStyle = TAN; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
    for (var i = 0; i < lines.length; i++) {
      handText(lines[i], bx + bw / 2, by + bh / 2 + (i - (lines.length - 1) / 2) * 32, font, INK, p.seed + 95 + i, 0);
    }
  }

  function drawPanel(p, t) {
    ctx.save();
    if (shake > 0.01) {
      var cx = p.x + p.w / 2, cy = p.y + p.h / 2;
      ctx.translate(cx, cy);
      ctx.rotate(Math.sin(t * 42 + p.i * 1.7) * 0.012 * shake);
      ctx.translate(-cx + Math.sin(t * 55 + p.i * 2.3) * 5 * shake, -cy + Math.cos(t * 49 + p.i) * 4 * shake);
    }
    drawHatch(p);
    drawScene(p, t);
    if (CAPTIONS[p.i]) drawCaption(p);
    // wobbly frame, double-stroked like a redrawn marker line
    poly(p.framePts, true);
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.save();
    ctx.translate(2.5, 2); ctx.globalAlpha = 0.6; ctx.lineWidth = 3;
    poly(p.framePts, true); ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  // ---------- main draw ----------
  var PHASE0 = 2.4; // constant first-frame phase: coworkers mid-tremble, composed
  var currentT = PHASE0;

  function draw(t) {
    currentT = t;
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.save();
    ctx.translate(offX, offY);
    ctx.scale(scaleF, scaleF);
    drawTitle();
    for (var i = 0; i < panels.length; i++) drawPanel(panels[i], t);
    // hint
    ctx.globalAlpha = 0.55;
    handText('tap · drag', DW - 92, DH - 26, '600 25px sans-serif', INK, 4242, 0);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- pointer: tap advances a panel, horizontal drag shakes ----------
  function toDesign(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [(e.clientX - r.left - offX) / scaleF, (e.clientY - r.top - offY) / scaleF];
  }
  function onDown(e) {
    dragging = true; moved = 0;
    var pt = toDesign(e);
    downX = lastPX = pt[0]; downY = pt[1];
    downT = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  }
  function onMove(e) {
    if (!dragging) return;
    var pt = toDesign(e);
    var dx = pt[0] - lastPX;
    moved += Math.abs(pt[0] - downX) + Math.abs(pt[1] - downY);
    lastPX = pt[0];
    if (Math.abs(dx) > 1) {
      shake = Math.min(1, shake + Math.abs(dx) / 90);
      dartX = Math.max(-6, Math.min(6, dx * 0.12));
    }
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (moved < 14 && now - downT < 600) {
      var pt = toDesign(e);
      for (var i = 0; i < panels.length; i++) {
        var p = panels[i];
        if (pt[0] >= p.x && pt[0] <= p.x + p.w && pt[1] >= p.y && pt[1] <= p.y + p.h) {
          p.state = (p.state + 1) % 4;
          break;
        }
      }
    }
    draw(currentT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointerleave', function () { dragging = false; });
  }

  // ---------- animation: anchored at PHASE0 + elapsed, never clock-derived ----------
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    var t = PHASE0 + (ts - startStamp) / 1000;
    if (!dragging && shake > 0) shake = Math.max(0, shake - 0.02);
    if (!dragging) dartX *= 0.9;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', resize);
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }

  resize();       // synchronous first frame at PHASE0 (resize calls draw)
  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
