<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deviations from Design</title>
<style>
html, body { margin: 0; padding: 0; background: #f4f1ea; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#f4f1ea';
var INK = [17, 17, 17];
var WARM = [176, 48, 96];
var COOL = [31, 107, 74];
var PINK = [232, 74, 138];
var MAGENTA = [194, 24, 155];
var GREEN = [46, 158, 91];
var PLATE = '#fbf9f4';
var PLATE_LINE = 'rgba(17,17,17,0.40)';
var TITLE_INK = '#111111';
var HINT_INK = '#444444';
var FIRST_T = 6.0;
var GRID = 5;
var RAYS_MAX = 64;
var BANDS_MAX = 9;
/* A fixed guilloche lattice of radiating line-burst ornaments. Five
   deviation values strain it: symmetry breaking, band curvature,
   stroke density, color temperature, ornament jitter. Each deviation
   drifts on its own slow LFO when untouched; dragging anywhere
   remaps touch position to the two dominant knobs (x = symmetry,
   y = curvature) and they drift back on release. Deviation is never
   allowed to break the lattice: every value stays in [0,1] and the
   ornaments always return to their grid. Frame one is t = FIRST_T,
   a fixed developed state with the LFOs at a calm, near-perfect
   phase, so the byte gate is deterministic. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mix(a, b, f) {
  return [Math.round(a[0] + (b[0] - a[0]) * f),
    Math.round(a[1] + (b[1] - a[1]) * f),
    Math.round(a[2] + (b[2] - a[2]) * f)];
}
/* Fixed seed tables: per-ornament phase and per-ray jitter/bend. */
var rng = mulberry32(1670);
var ornParams = [];
var o, j;
for (o = 0; o < GRID * GRID; o++) {
  ornParams.push({
    phase: rng() * TAU,
    rot: (rng() - 0.5) * 0.9,
    ringPhase: rng() * TAU
  });
}
var rayParams = [];
for (o = 0; o < GRID * GRID; o++) {
  var rays = [];
  for (j = 0; j < RAYS_MAX; j++) {
    rays.push({
      dir: rng() < 0.5 ? 1 : -1,
      jitPhase: rng() * TAU,
      jitAmp: 0.4 + rng() * 0.6,
      asym: (rng() - 0.5) * 2
    });
  }
  rayParams.push(rays);
}
var bandParams = [];
for (j = 0; j < BANDS_MAX; j++) {
  bandParams.push({
    frac: 0.12 + 0.88 * (j / BANDS_MAX) + (rng() - 0.5) * 0.05,
    wob: 0.5 + rng() * 2.5,
    phase: rng() * TAU,
    col: j % 3,
    width: 1.5 + rng() * 3.5
  });
}
/* Five LFOs: base, amplitude, angular speed, phase. All slow. */
var LFO = [
  { base: 0.06, amp: 0.07, w: 0.11, ph: 0.4 },   /* symmetry */
  { base: 0.05, amp: 0.06, w: 0.09, ph: 1.9 },   /* curvature */
  { base: 0.30, amp: 0.12, w: 0.07, ph: 3.1 },   /* density */
  { base: 0.50, amp: 0.16, w: 0.05, ph: 0.8 },   /* temperature */
  { base: 0.05, amp: 0.05, w: 0.13, ph: 2.6 }    /* jitter */
];
function lfoValue(i, t) {
  var L = LFO[i];
  return clamp(L.base + L.amp * Math.sin(L.w * t + L.ph), 0, 1);
}
/* Live deviation state. Dragging remaps x to symmetry, y to curvature. */
var dev = [0, 0, 0, 0, 0];
var dragging = false;
var dragX = 0, dragY = 0;
function updateDev(t) {
  var i, target;
  for (i = 0; i < 5; i++) {
    if (dragging && i === 0) target = clamp(dragX, 0, 1);
    else if (dragging && i === 1) target = clamp(dragY, 0, 1);
    else target = lfoValue(i, t);
    /* Fast toward a dragged target, slow drift back to the LFO. */
    var k = (dragging && (i === 0 || i === 1)) ? 0.35 : 0.02;
    dev[i] = lerp(dev[i], target, k);
  }
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function drawOrnament(cx, cy, R, oi, t) {
  var sym = dev[0], cur = dev[1], den = dev[2], jit = dev[4];
  var p = ornParams[oi];
  var rays = rayParams[oi];
  var n = Math.round(24 + den * (RAYS_MAX - 24));
  var i, s, u, r, a, x, y;
  var rot = p.rot * sym;
  var ink = inkColor();
  ctx.lineCap = 'round';
  /* Wavy inner guilloche ring. */
  ctx.beginPath();
  var ringR = R * 0.20;
  var steps = 48;
  for (s = 0; s <= steps; s++) {
    var th = (s / steps) * TAU;
    var rr = ringR * (1 + 0.18 * Math.sin(6 * th + p.ringPhase + 0.3 * t));
    x = cx + Math.cos(th) * rr;
    y = cy + Math.sin(th) * rr;
    if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = rgba(ink, 0.85);
  ctx.lineWidth = Math.max(0.8, R * 0.012);
  ctx.stroke();
  /* Radiating line bursts. */
  for (i = 0; i < n; i++) {
    var rp = rays[i];
    var a0 = (i / n) * TAU + rot + sym * 0.30 * Math.sin(i * 1.7 + p.phase) + sym * 0.12 * rp.asym;
    ctx.beginPath();
    for (s = 0; s <= 7; s++) {
      u = s / 7;
      r = R * (0.22 + 0.78 * u);
      a = a0 + rp.dir * cur * 1.15 * u * u;
      var jx = jit * R * 0.10 * rp.jitAmp * Math.sin(u * TAU * 2 + rp.jitPhase);
      var jPerp = a + Math.PI / 2;
      x = cx + Math.cos(a) * r + Math.cos(jPerp) * jx;
      y = cy + Math.sin(a) * r + Math.sin(jPerp) * jx;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = rgba(ink, 0.80);
    ctx.lineWidth = Math.max(0.7, R * 0.011);
    ctx.stroke();
  }
  /* Outer hairline ring holding the ornament to its cell. */
  ctx.beginPath();
  ctx.moveTo(cx + R, cy);
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.strokeStyle = rgba(ink, 0.30);
  ctx.lineWidth = Math.max(0.6, R * 0.008);
  ctx.stroke();
}
function inkColor() {
  var tmp = dev[3];
  var f = Math.abs(tmp - 0.5) * 2;
  if (f < 0.02) return INK;
  var toward = tmp > 0.5 ? WARM : COOL;
  return mix(INK, toward, clamp(f * 0.85, 0, 1));
}
function totalDeviation() {
  var tmpDev = Math.abs(dev[3] - 0.5) * 2;
  return (dev[0] + dev[1] + dev[2] * 0.5 + tmpDev + dev[4]) / 4.5;
}
function drawBands(cx, cy, Rmax, t) {
  var D = totalDeviation();
  if (D < 0.03) return;
  var cols = [PINK, MAGENTA, GREEN];
  var count = 3 + Math.round(D * (BANDS_MAX - 3));
  var i, s, th, r, x, y;
  for (i = 0; i < count; i++) {
    var b = bandParams[i];
    ctx.beginPath();
    for (s = 0; s <= 96; s++) {
      th = (s / 96) * TAU;
      r = Rmax * b.frac * (1 + 0.06 * Math.sin(b.wob * th + b.phase + 0.15 * t) + 0.03 * Math.sin(5 * th + b.phase * 2));
      x = cx + Math.cos(th) * r;
      y = cy + Math.sin(th) * r;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = rgba(cols[b.col], clamp(D * 0.55, 0, 0.55));
    ctx.lineWidth = b.width * (0.6 + D);
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Deviations from Design').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Deviations from Design').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 08').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Deviations from Design', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 08', plateX + 14, plateY + 7 + titlePx + 3);
  /* Hint plate, bottom left. */
  var hint = 'Drag to bend the design.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  /* Deviation readout, tiny monospace at the bottom edge. */
  var readPx = isPhone ? 9 : 10;
  ctx.font = readPx + 'px monospace';
  var readout = 'SYM ' + dev[0].toFixed(2) + '  CUR ' + dev[1].toFixed(2) +
    '  DEN ' + dev[2].toFixed(2) + '  TMP ' + dev[3].toFixed(2) +
    '  JIT ' + dev[4].toFixed(2);
  var readW = ctx.measureText(readout).width;
  var readPlateW = readW + 20;
  var readPlateH = readPx + 12;
  var readPlateX, readPlateY;
  if (isPhone) {
    readPlateX = 12;
    readPlateY = hintPlateY - readPlateH - 8;
  } else {
    readPlateX = VW - readPlateW - 12;
    readPlateY = VH - readPlateH - 12;
  }
  ctx.fillStyle = PLATE;
  ctx.fillRect(readPlateX, readPlateY, readPlateW, readPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(readPlateX + 0.5, readPlateY + 0.5, readPlateW - 1, readPlateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.fillText(readout, readPlateX + 10, readPlateY + 6);
}
function draw(t) {
  size();
  updateDev(t);
  var S = Math.min(VW, VH);
  var sq = isPhone ? S : S * 0.94;
  var x0 = (VW - sq) / 2, y0 = (VH - sq) / 2;
  var cell = sq / GRID;
  var R = cell * 0.46;
  var cx = VW / 2, cy = VH / 2;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var o, gx, gy;
  for (gy = 0; gy < GRID; gy++) {
    for (gx = 0; gx < GRID; gx++) {
      o = gy * GRID + gx;
      drawOrnament(x0 + cell * (gx + 0.5), y0 + cell * (gy + 0.5), R, o, t);
    }
  }
  drawBands(cx, cy, Math.hypot(VW, VH) * 0.55, t);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
function onPoint(e) {
  var rect = canvas.getBoundingClientRect();
  var px = (e.clientX - rect.left) / rect.width;
  var py = (e.clientY - rect.top) / rect.height;
  dragX = clamp(px, 0, 1);
  dragY = clamp(py, 0, 1);
}
if (typeof window !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    onPoint(e);
    if (e.preventDefault) e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (dragging) onPoint(e);
  });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });
  canvas.addEventListener('pointerleave', function () { dragging = false; });
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    deviations: function () { return dev.slice(); },
    setDrag: function (x, y) { dragging = true; dragX = x; dragY = y; },
    releaseDrag: function () { dragging = false; }
  };
}
/* ---- frame one: t = FIRST_T, a developed state ---- */
size();
/* Seed the live state at the fixed first-frame LFO values so frame
   one is identical on every load. */
(function () {
  var i;
  for (i = 0; i < 5; i++) dev[i] = lfoValue(i, FIRST_T);
})();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
