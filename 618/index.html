<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1959 Two Generations</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0d10; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Two Generations, TC8 / PP1206, study #255 tom-challenger.
  // Two saxophone voices trade phrases across a dark stage: one
  // errant and young (quick darting lines, bright reed gold), one
  // deep and old (long held tones, dark bronze). The 53 minute
  // duo is compressed to a watchable exchange: call, response,
  // overlap, silence. Two generations, one poster. It is a
  // lineage, not a contest: no winner, no score, only the
  // exchange passing from one voice to the other.
  var STAGE = '#0d0d10';   // stage black
  var GOLD = '#f2c14e';    // young reed gold, bright
  var GOLD_LT = '#f7d774'; // young gold, highlight
  var BRONZE = '#a97c3f';  // old bronze, deep
  var BRONZE_DK = '#7d5a2c'; // old bronze, dark
  var BREATH = '#f2ede1';  // breath white
  var DRONE = '#3a3226';   // drone bed, warm dark

  // Fixed-phase first frame: FIRST_T = 24 s. At t = 24 the
  // exchange is in overlap: the young dart (21 to 26 s) and the
  // old response (22 to 31 s) are both sounding, so two arcs
  // cross the stage at once and frame one already shows the
  // lineage in motion.
  var FIRST_T = 24;
  var SEED = 1959;
  var CYCLE = 64; // one exchange cycle, in seconds

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is accepted as an alias for the same clock,
  // so the node-canvas render tool (which passes its probe value
  // as ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and fixed salts, so every frame is a pure
  // function of t.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // The exchange template, one 64 second cycle. Each entry is a
  // phrase: voice y (young) or o (old), start second, duration.
  // Young phrases are short (2 to 5 s) and high; old phrases are
  // long (6 to 12 s) and low. Between them sit silences, dark
  // gaps where only the drone bed sounds.
  var TEMPLATE = [
    { v: 'y', s: 0, d: 4 },   // young calls
    { v: 'o', s: 6, d: 10 },  // old answers
    { v: 'y', s: 17, d: 3 },  // young darts
    { v: 'y', s: 21, d: 5 },  // overlap: young
    { v: 'o', s: 22, d: 9 },  // overlap: old
    // silence 32 to 40
    { v: 'o', s: 40, d: 9 },  // old calls
    { v: 'y', s: 50, d: 5 },  // young answers
    { v: 'y', s: 57, d: 4 },  // close together: young
    { v: 'o', s: 57, d: 6 }   // close together: old
  ];

  // Phrase-length and register priors. Young: 5 to 9 quick notes
  // per phrase, high register (arc apex 0.75 to 1.0 of the arc
  // height band). Old: 2 to 4 long notes per phrase, low
  // register (arc apex 0.25 to 0.5 of the band). The note count
  // and the per-note jitter vary by cycle through a seeded rng,
  // so each cycle is a fresh exchange with the same priors.
  function phrasesForCycle(cycle) {
    var out = [];
    var i;
    for (i = 0; i < TEMPLATE.length; i++) {
      var tp = TEMPLATE[i];
      var rng = mulberry32(SEED * 31 + cycle * 977 + i * 131 + 7);
      var notes, reg;
      if (tp.v === 'y') {
        notes = 5 + Math.floor(rng() * 5);
        reg = 0.75 + rng() * 0.25;
      } else {
        notes = 2 + Math.floor(rng() * 3);
        reg = 0.25 + rng() * 0.25;
      }
      var jitters = [];
      var j;
      for (j = 0; j < notes; j++) {
        jitters.push((rng() - 0.5) * 2);
      }
      out.push({
        v: tp.v, start: cycle * CYCLE + tp.s, dur: tp.d,
        end: cycle * CYCLE + tp.s + tp.d,
        notes: notes, reg: reg, jitters: jitters,
        salt: cycle * 977 + i * 131
      });
    }
    return out;
  }

  // The phase name for a time inside a cycle, for the plate.
  function phaseName(tc) {
    if (tc < 4) { return 'Call, young'; }
    if (tc < 6) { return 'Listening'; }
    if (tc < 16) { return 'Response, old'; }
    if (tc < 17) { return 'Listening'; }
    if (tc < 20) { return 'Dart, young'; }
    if (tc < 21) { return 'Listening'; }
    if (tc < 31) { return 'Overlap'; }
    if (tc < 32) { return 'Listening'; }
    if (tc < 40) { return 'Silence'; }
    if (tc < 49) { return 'Call, old'; }
    if (tc < 50) { return 'Listening'; }
    if (tc < 55) { return 'Response, young'; }
    if (tc < 57) { return 'Listening'; }
    return 'Close, together';
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function lerp(a, b, f) { return a + (b - a) * f; }

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    // On a tall phone the stage is full-bleed, so the exchange is
    // centred higher with taller arcs; on desktop it sits in the
    // square stage a little below centre.
    if (isPhone) {
      L.baseY = H * 0.52;
      L.arcH = 0.42 * u;
      L.droneY = H * 0.70;
    } else {
      L.baseY = H * 0.60;
      L.arcH = 0.30 * u;
      L.droneY = H * 0.82;
    }
    L.youngX = W * 0.20;
    L.oldX = W * 0.80;
    L.youngTgt = W * 0.66;
    L.oldTgt = W * 0.34;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Quadratic bezier point for a phrase arc: from the speaker
  // across toward the other voice, apex height by register.
  function arcPoint(ph, s) {
    var x0 = (ph.v === 'y') ? L.youngX : L.oldX;
    var x1 = (ph.v === 'y') ? L.youngTgt : L.oldTgt;
    var cx = (x0 + x1) / 2;
    var cy = L.baseY - ph.reg * L.arcH;
    var mx = lerp(lerp(x0, cx, s), lerp(cx, x1, s), s);
    var my = lerp(lerp(L.baseY, cy, s), lerp(cy, L.baseY, s), s);
    return { x: mx, y: my };
  }

  // One phrase as a light trail: a polyline along the arc up to
  // the played fraction, notes as dots along it, a bright head
  // dot at the leading edge. A finished phrase fades as a ghost
  // for 8 seconds after it ends, then the stage goes dark again.
  function drawPhrase(ph, t, ghostAlpha) {
    var col = (ph.v === 'y') ? GOLD : BRONZE;
    var colLt = (ph.v === 'y') ? GOLD_LT : BRONZE;
    var p = clamp((t - ph.start) / ph.dur, 0, 1);
    var age = t - ph.end;
    var alpha;
    if (age >= 0) {
      alpha = ghostAlpha * (1 - age / 8);
      p = 1;
    } else {
      alpha = 1;
    }
    if (alpha <= 0.01) { return; }
    var steps = 24;
    var i;
    ctx.strokeStyle = hexA(col, a4(0.55 * alpha));
    ctx.lineWidth = (ph.v === 'y') ? 1.6 : 2.4;
    ctx.beginPath();
    var pt0 = arcPoint(ph, 0);
    ctx.moveTo(pt0.x, pt0.y);
    for (i = 1; i <= steps; i++) {
      var s = (i / steps) * p;
      var pt = arcPoint(ph, s);
      ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
    // Notes along the played part of the arc.
    for (i = 0; i < ph.notes; i++) {
      var sn = (i + 0.5) / ph.notes;
      if (sn > p + 0.001) { break; }
      var np = arcPoint(ph, sn);
      var jy = ph.jitters[i] * L.u * 0.012;
      var r = (ph.v === 'y') ? Math.max(2.2, L.u * 0.006) : Math.max(3.4, L.u * 0.009);
      ctx.fillStyle = hexA(colLt, a4(0.9 * alpha));
      ctx.beginPath();
      ctx.moveTo(np.x + r, np.y + jy);
      ctx.arc(np.x, np.y + jy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    // Bright head dot at the leading edge while sounding.
    if (age < 0) {
      var hp = arcPoint(ph, p);
      var hr = (ph.v === 'y') ? Math.max(4, L.u * 0.011) : Math.max(5.5, L.u * 0.014);
      ctx.fillStyle = hexA(BREATH, a4(0.95));
      ctx.beginPath();
      ctx.moveTo(hp.x + hr, hp.y);
      ctx.arc(hp.x, hp.y, hr, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = hexA(col, a4(0.9));
      ctx.beginPath();
      ctx.moveTo(hp.x + hr * 0.55, hp.y);
      ctx.arc(hp.x, hp.y, hr * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // A voice at rest or sounding: a glowing reed point with a
  // short flare of lines. Bright and wide while its phrase
  // sounds, dim and small while it listens.
  function drawVoice(x, active, col, colLt, big) {
    var r = big ? Math.max(10, L.u * 0.028) : Math.max(7, L.u * 0.02);
    var glowR = r * (active ? 3.4 : 2.2);
    ctx.fillStyle = hexA(col, a4(active ? 0.16 : 0.07));
    ctx.beginPath();
    ctx.moveTo(x + glowR, L.baseY);
    ctx.arc(x, L.baseY, glowR, 0, Math.PI * 2);
    ctx.fill();
    // Reed flare: short lines fanning upward from the point.
    var i;
    ctx.strokeStyle = hexA(col, a4(active ? 0.9 : 0.45));
    ctx.lineWidth = 1.4;
    for (i = -3; i <= 3; i++) {
      var ang = -Math.PI / 2 + i * 0.28;
      var len = r * (active ? 2.6 : 1.8) * (1 - Math.abs(i) * 0.12);
      ctx.beginPath();
      ctx.moveTo(x, L.baseY);
      ctx.lineTo(x + Math.cos(ang) * len, L.baseY + Math.sin(ang) * len);
      ctx.stroke();
    }
    ctx.fillStyle = hexA(colLt, a4(active ? 1 : 0.6));
    ctx.beginPath();
    ctx.moveTo(x + r, L.baseY);
    ctx.arc(x, L.baseY, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = hexA(BREATH, a4(active ? 0.8 : 0.35));
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x + r, L.baseY);
    ctx.arc(x, L.baseY, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Stage black ground.
    ctx.fillStyle = STAGE;
    ctx.fillRect(0, 0, W, H);

    // The shared drone bed: a low warm band that breathes slowly
    // under the whole exchange, plus a thin breath-white line.
    var breathe = 0.5 + 0.5 * Math.sin(t * 0.5);
    var grad = ctx.createLinearGradient(0, L.droneY - L.u * 0.05, 0, L.droneY + L.u * 0.05);
    grad.addColorStop(0, hexA(DRONE, a4(0)));
    grad.addColorStop(0.5, hexA(DRONE, a4(0.10 + 0.05 * breathe)));
    grad.addColorStop(1, hexA(DRONE, a4(0)));
    ctx.fillStyle = grad;
    ctx.fillRect(0, L.droneY - L.u * 0.05, W, L.u * 0.10);
    ctx.strokeStyle = hexA(BREATH, a4(0.10 + 0.05 * breathe));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W * 0.06, L.droneY);
    ctx.lineTo(W * 0.94, L.droneY);
    ctx.stroke();

    // Phrases: this cycle, the previous cycle (for trails that
    // fade across the cycle boundary), and the next cycle (for
    // probes near the end of a cycle). Ghosts fade over 8 s.
    var cycle = Math.floor(t / CYCLE);
    var ci;
    var youngActive = false, oldActive = false;
    var all = [];
    for (ci = cycle - 1; ci <= cycle + 1; ci++) {
      var ps = phrasesForCycle(ci);
      var k;
      for (k = 0; k < ps.length; k++) { all.push(ps[k]); }
    }
    var i;
    for (i = 0; i < all.length; i++) {
      var ph = all[i];
      if (t < ph.start - 0.001) { continue; }
      if (t > ph.end + 8) { continue; }
      if (t >= ph.start && t <= ph.end) {
        if (ph.v === 'y') { youngActive = true; } else { oldActive = true; }
      }
      drawPhrase(ph, t, 0.45);
    }

    // The two voices, left young in gold, right old in bronze.
    drawVoice(L.youngX, youngActive, GOLD, GOLD_LT, false);
    drawVoice(L.oldX, oldActive, BRONZE, BRONZE, true);

    // Voice labels under the stage line.
    var fsLabel = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    ctx.font = fsLabel + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = hexA(GOLD, a4(0.75));
    ctx.textAlign = 'center';
    ctx.fillText('the young voice', L.youngX, L.droneY + fsLabel + 14);
    ctx.fillStyle = hexA(BRONZE, a4(0.85));
    ctx.fillText('the old voice', L.oldX, L.droneY + fsLabel + 14);
    ctx.textAlign = 'left';

    // ---- Plates: title top-left, number and date below it, the
    // phase readout and a short descriptor top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = BREATH;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Two Generations', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(BREATH, 0.8);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1959 · 2007 · 05 · 24', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    var tc = ((t % CYCLE) + CYCLE) % CYCLE;
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(BREATH, 0.65);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('two saxophones, one lineage', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.fillStyle = hexA(BREATH, 0.8);
    ctx.font = fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(phaseName(tc), W - 18, 18 + fsTitle * 0.8 + fsSmall + 8 + fsSmall + 6);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom, breath white on a faint
    // dark pill so it stays legible over the stage.
    var hint = 'Watch the exchange unfold.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(BREATH, a4(0.08));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(BREATH, a4(0.25));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = hexA(BREATH, a4(0.9));
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1959 exposes the phase, the cycle, and the
  // active voices at any t.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1959 = {
      phase: function (t) { return phaseName(((t % CYCLE) + CYCLE) % CYCLE); },
      cycle: CYCLE,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the drone breathes at about 0.08 Hz and the
  // exchange advances through its 64 s cycle, all well under
  // the 14 Hz ceiling. Guarded so node-canvas QA (no
  // requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
