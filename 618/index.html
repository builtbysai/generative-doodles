<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Crown Grows Itself</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F5F1E8; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.618 "The Crown Grows Itself" — EXPANSION #75 mariona-cabassa (theinvisiblecircle), block 2 "Corona".
// A featureless deep-blue profile head, perfectly still, wearing a living radial crown
// of folk flowers and leaves that breathe open and closed. Tap a flower and it sheds
// its petals and regrows; double-tap and the whole crown reseeds. The head never moves.

var cv = document.getElementById('c');
var ctx = cv.getContext('2d');

var PAL = {
  head: '#1E4D8C',
  pink: '#E87B9C',
  yellow: '#F2C14E',
  leaf: '#6A9A5B',
  paper: '#F5F1E8',
  deep: '#12315E'
};
var BASE_SEED = 618750;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var view = { w: 300, h: 300, dpr: 1 };
var layout = { S: 300, ox: 0, oy: 0, ccx: 150, ccy: 150 };
var elapsedNow = 0;
var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;

function isPhone() {
  var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : view.w;
  var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : view.h;
  if (Math.min(sw, sh) < 700) return true;
  return view.h > view.w * 1.15;
}

// ---------------------------------------------------------------- crown data
var generation = 1;
var crown = [];
var particles = [];

function buildCrown(gen) {
  var rng = mulberry32(BASE_SEED + gen * 131);
  var rings = [
    { n: 21, rad: 0.208, size: 0.046 },
    { n: 33, rad: 0.312, size: 0.039 }
  ];
  var a0 = -195 * Math.PI / 180, a1 = 15 * Math.PI / 180;
  var items = [];
  var flowerSerial = 0;
  for (var ri = 0; ri < rings.length; ri++) {
    var ring = rings[ri];
    for (var i = 0; i < ring.n; i++) {
      var f = i / (ring.n - 1);
      var it = {
        ring: ri,
        ang: a0 + (a1 - a0) * f + (rng() - 0.5) * 0.03,
        rad: ring.rad + (rng() - 0.5) * 0.02,
        size: ring.size * (0.85 + rng() * 0.3),
        phase: rng() * Math.PI * 2,
        period: 5.5 + rng() * 5.5,
        rot: (rng() - 0.5) * 0.6,
        kind: 'leaf'
      };
      if (i % 3 !== 2) {
        it.kind = 'flower';
        it.color = (flowerSerial % 2 === 0) ? 'pink' : 'yellow';
        it.petals = 5 + Math.floor(rng() * 5);
        it.accent = false;
        it.state = 'bloom';
        it.stateT = 0;
        it.reseed = 0;
        it.serial = flowerSerial;
        flowerSerial++;
      }
      items.push(it);
    }
  }
  var flowers = items.filter(function (d) { return d.kind === 'flower'; });
  var picks = {};
  var count = 0;
  while (count < 3) {
    var idx = Math.floor(rng() * flowers.length);
    if (!picks[idx]) { picks[idx] = true; count++; }
  }
  Object.keys(picks).forEach(function (k) { flowers[+k].accent = true; });
  crown = items;
}

function itemPos(it) {
  return [
    layout.ccx + Math.cos(it.ang) * it.rad * layout.S,
    layout.ccy + Math.sin(it.ang) * it.rad * layout.S
  ];
}

// ---------------------------------------------------------------- drawing
function petalPath(L, W) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(W, -L * 0.38, 0, -L);
  ctx.quadraticCurveTo(-W, -L * 0.38, 0, 0);
  ctx.closePath();
}

function drawFlower(it, x, y, t) {
  var S = layout.S;
  var b = 0.55 + 0.38 * Math.sin(it.phase + t * 2 * Math.PI / it.period);
  if (b < 0.08) b = 0.08;
  var scale = 1;
  if (it.state === 'released') {
    // bare calyx while the new bud forms
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = PAL.leaf;
    ctx.beginPath();
    ctx.arc(0, 0, it.size * S * 0.16, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }
  if (it.state === 'growing') {
    var k = (t - it.stateT) / 0.8;
    if (k >= 1) { it.state = 'bloom'; }
    else scale = 0.15 + 0.85 * (1 - (1 - k) * (1 - k));
  }
  var R = it.size * S * scale;
  var outer = PAL[it.color];
  var inner = (it.color === 'pink') ? PAL.yellow : PAL.pink;
  var center = it.accent ? PAL.deep : inner;
  var step = Math.PI * 2 / it.petals;
  var j, L, W;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(it.rot);
  // outer petals
  ctx.fillStyle = outer;
  L = R * (0.78 + 0.5 * b);
  W = L * 0.56;
  for (j = 0; j < it.petals; j++) {
    ctx.save();
    ctx.rotate(j * step);
    petalPath(L, W);
    ctx.fill();
    ctx.restore();
  }
  // inner petals, half-step offset, bloom-driven
  ctx.fillStyle = inner;
  L = R * (0.30 + 0.48 * b);
  W = L * 0.55;
  for (j = 0; j < it.petals; j++) {
    ctx.save();
    ctx.rotate((j + 0.5) * step);
    petalPath(L, W);
    ctx.fill();
    ctx.restore();
  }
  // center disc
  ctx.fillStyle = center;
  ctx.beginPath();
  ctx.arc(0, 0, R * (0.15 + 0.1 * b), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawLeaf(it, x, y, t) {
  var S = layout.S;
  var sway = 0.05 * Math.sin(it.phase + t * 2 * Math.PI / it.period);
  var len = it.size * S * 1.55 * (0.93 + 0.07 * Math.sin(it.phase * 1.7 + t * 2 * Math.PI / it.period));
  var w = len * 0.30;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(it.ang + Math.PI / 2 + sway);
  ctx.fillStyle = PAL.leaf;
  petalPath(len, w);
  ctx.fill();
  ctx.strokeStyle = PAL.paper;
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = Math.max(1, S * 0.0016);
  ctx.beginPath();
  ctx.moveTo(0, -len * 0.14);
  ctx.lineTo(0, -len * 0.82);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawHead() {
  var S = layout.S;
  var s = 0.385 * S;
  var x0 = layout.ox + 0.5 * S - 0.40 * s;
  var y0 = layout.oy + 0.425 * S;
  function P(x, y) { return [x0 + x * s, y0 + y * s]; }
  function Q(cx, cy, ex, ey) { var c = P(cx, cy), e = P(ex, ey); ctx.quadraticCurveTo(c[0], c[1], e[0], e[1]); }
  function B(c1x, c1y, c2x, c2y, ex, ey) { var a = P(c1x, c1y), b = P(c2x, c2y), e = P(ex, ey); ctx.bezierCurveTo(a[0], a[1], b[0], b[1], e[0], e[1]); }
  function L(x, y) { var p = P(x, y); ctx.lineTo(p[0], p[1]); }

  ctx.fillStyle = PAL.head;
  ctx.beginPath();
  var start = P(0.40, 0.02);
  ctx.moveTo(start[0], start[1]);
  Q(0.17, 0.05, 0.115, 0.19);   // forehead
  Q(0.095, 0.32, 0.015, 0.44);  // brow out to nose tip
  Q(0.05, 0.478, 0.085, 0.495); // nose underside
  Q(0.108, 0.512, 0.10, 0.528); // under-nose indent
  Q(0.072, 0.542, 0.082, 0.556); // upper lip
  Q(0.106, 0.566, 0.10, 0.579); // mouth notch
  Q(0.076, 0.596, 0.088, 0.613); // lower lip
  Q(0.11, 0.633, 0.098, 0.66);  // chin crease to chin
  Q(0.10, 0.688, 0.16, 0.706);  // chin bottom
  Q(0.26, 0.738, 0.315, 0.79);  // jaw underside
  L(0.30, 1.10);                // front of neck
  L(0.64, 1.10);                // neck bottom
  Q(0.615, 0.95, 0.585, 0.83);  // back of neck
  B(0.80, 0.66, 0.815, 0.34, 0.66, 0.14); // back of skull / hair mass
  Q(0.55, 0.03, 0.40, 0.02);    // crown of skull
  ctx.closePath();
  ctx.fill();

  // hair sweep: one quiet arc inside the silhouette, deep accent at low alpha
  ctx.strokeStyle = PAL.deep;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = Math.max(1.2, s * 0.014);
  ctx.lineCap = 'round';
  ctx.beginPath();
  var h0 = P(0.315, 0.075);
  ctx.moveTo(h0[0], h0[1]);
  Q(0.60, 0.10, 0.685, 0.38);
  Q(0.715, 0.60, 0.60, 0.79);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawParticles(t) {
  var alive = [];
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var age = t - p.born;
    if (age < 0 || age > 2) continue;
    alive.push(p);
    var x = p.x + p.vx * age + 6 * Math.sin(age * 3 + p.born * 7);
    var y = p.y + p.vy * age + 34 * age * age;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot + p.vr * age);
    ctx.globalAlpha = 1 - age / 2;
    ctx.fillStyle = p.color;
    petalPath(p.size, p.size * 0.5);
    ctx.fill();
    ctx.restore();
  }
  particles = alive;
  ctx.globalAlpha = 1;
}

function draw(t) {
  cv.style.width = view.w + 'px';
  cv.style.height = view.h + 'px';
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = PAL.paper;
  ctx.fillRect(0, 0, view.w, view.h);

  var S = Math.min(view.w, view.h);
  layout = {
    S: S,
    ox: (view.w - S) / 2,
    oy: (view.h - S) / 2,
    ccx: view.w / 2,
    ccy: (view.h - S) / 2 + 0.515 * S
  };

  // resolve a pending single tap once the double-tap window has passed
  if (pendingTap && t - pendingTap.t > 0.36) {
    singleTap(pendingTap.x, pendingTap.y, t);
    pendingTap = null;
  }

  var i, it, pos;
  for (i = 0; i < crown.length; i++) {           // outer ring first
    it = crown[i];
    if (it.ring !== 1) continue;
    pos = itemPos(it);
    if (it.kind === 'flower') drawFlower(it, pos[0], pos[1], t); else drawLeaf(it, pos[0], pos[1], t);
  }
  for (i = 0; i < crown.length; i++) {           // inner ring
    it = crown[i];
    if (it.ring !== 0) continue;
    pos = itemPos(it);
    if (it.kind === 'flower') drawFlower(it, pos[0], pos[1], t); else drawLeaf(it, pos[0], pos[1], t);
  }
  drawHead();
  drawParticles(t);
}

// ---------------------------------------------------------------- interaction
var pendingTap = null;
var lastTapT = -9;

function releaseFlower(it, x, y, t) {
  it.state = 'released';
  it.stateT = t;
  it.reseed++;
  var rng = mulberry32(555000 + it.serial * 91 + it.reseed * 17 + generation * 7);
  var newPetals = 5 + Math.floor(rng() * 5);
  for (var k = 0; k < it.petals; k++) {
    var a = it.rot + k * Math.PI * 2 / it.petals + (rng() - 0.5) * 0.3;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * (14 + rng() * 24),
      vy: Math.sin(a) * 14 - 8,
      rot: a + Math.PI / 2,
      vr: (rng() - 0.5) * 2.6,
      color: PAL[it.color],
      size: it.size * layout.S * (0.75 + rng() * 0.4),
      born: t
    });
  }
  it.petals = newPetals;
  it.phase = rng() * Math.PI * 2;
}

function singleTap(x, y, t) {
  var best = null, bestD = 1e9, i, it, pos;
  for (i = 0; i < crown.length; i++) {
    it = crown[i];
    if (it.kind !== 'flower' || it.state !== 'bloom') continue;
    pos = itemPos(it);
    var dx = pos[0] - x, dy = pos[1] - y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < it.size * layout.S * 1.35 && d < bestD) { bestD = d; best = { it: it, x: pos[0], y: pos[1] }; }
  }
  if (best) releaseFlower(best.it, best.x, best.y, t);
}

function reseedCrown() {
  generation++;
  buildCrown(generation);
  particles = [];
}

function nowSec() {
  var p = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var t = (p - T0) / 1000;
  return t > 0 ? t : elapsedNow;
}

cv.addEventListener('pointerdown', function (e) {
  var t = nowSec();
  elapsedNow = t;
  if (t - lastTapT < 0.35) {
    pendingTap = null;
    lastTapT = -9;
    reseedCrown();
  } else {
    pendingTap = { x: e.clientX, y: e.clientY, t: t };
    lastTapT = t;
  }
});

// ---------------------------------------------------------------- sizing + loop
function fit() {
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  var dpr = Math.min((typeof window !== 'undefined' && window.devicePixelRatio) || 1, 2);
  view = { w: w, h: h, dpr: dpr };
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  draw(elapsedNow);
}
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', fit);
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('resize', fit);
}

buildCrown(1);
fit();
draw(0);

if (typeof requestAnimationFrame === 'function') {
  var startStamp = null;
  var tick = function (ts) {
    if (startStamp === null) startStamp = ts;
    elapsedNow = (ts - startStamp) / 1000;
    // a released flower becomes a growing bud after a short bare beat
    for (var i = 0; i < crown.length; i++) {
      var it = crown[i];
      if (it.kind === 'flower' && it.state === 'released' && elapsedNow - it.stateT > 0.85) {
        it.state = 'growing';
        it.stateT = elapsedNow;
      }
    }
    draw(elapsedNow);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
