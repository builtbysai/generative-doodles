<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stool of Objects</title>
<style>
html, body { margin: 0; padding: 0; background: #5E1712; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: preparation. Ordinary objects laid on strings change what the
   strings can say. The felt phenomenon is a dead-quiet booth where one
   small placement rewires the timbre. The mechanism: drag an object from
   the stool onto the string zone and the voice and the drawn string
   behavior change deterministically; drag it back and the clean guitar
   returns. Nothing else happens. The mic listens. */
var TAU = Math.PI * 2;
var BOOTH = '#7A211B';
var BOOTH_DARK = '#5E1712';
var BOOTH_LT = '#8E2A22';
var MIC = '#141210';
var PENCIL = '#F2C230';
var WIRE = '#C9C9CF';
var STONE = '#8A8A86';
var PAPER = '#F5F0E6';
var COIN = '#D9C98F';
var PLATE = '#F5F0E6';
var PLATE_LINE = 'rgba(20,18,16,0.35)';
var TITLE_INK = '#141210';
var HINT_INK = '#5C4630';
var FRAME_T = 1.2;         /* fixed phase: first pluck 1.2 s into its decay */
var PLUCK_LEN = 4.0;       /* seconds between plucks */
var FRAME_ONE_NOTE = 'frame one t = 1.2 s, strings mid decay after the pluck at t = 0';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var tapPluck = -1;         /* phaseT of the last tap on the strings, -1 = none */
var lastPluckIdx = 0;
/* seeded wall seams: faint vertical acoustic panel lines */
var SEAMS = (function () {
  var rng = mulberry32(1865), out = [], i;
  for (i = 0; i < 7; i++) out.push(0.06 + rng() * 0.5);
  return out;
})();
/* The inventory. Finite, shown, five objects. slotY is the string-zone
   shelf each object rests on when prepared. */
var OBJECTS = [
  { id: 'pencils', label: 'pencils', timbre: 'rattling harmonics', homeX: 0.23, slotY: 0.235, prepared: false },
  { id: 'wire', label: 'wire loop', timbre: 'metallic bow', homeX: 0.31, slotY: 0.315, prepared: false },
  { id: 'stones', label: 'stones', timbre: 'dull thuds', homeX: 0.385, slotY: 0.395, prepared: false },
  { id: 'coin', label: 'coin', timbre: 'bright ping', homeX: 0.455, slotY: 0.475, prepared: false },
  { id: 'clothespin', label: 'clothespin', timbre: 'damped thud', homeX: 0.505, slotY: 0.555, prepared: false }
];
var HOME_Y = 0.618;
var dragId = -1, dragX = 0, dragY = 0, dragOffX = 0, dragOffY = 0;
var SC = { x: 0, y: 0, w: 0, h: 0 };
var audioCtx = null, masterGain = null, noiseBuf = null;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function seg(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
  if (fill) ctx.fill(); else ctx.stroke();
}
function ell(x, y, rx, ry, fill) {
  ctx.beginPath(); ctx.moveTo(x + rx, y); ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
  if (fill) ctx.fill(); else ctx.stroke();
}
/* ---- pluck envelope: plucks at multiples of PLUCK_LEN, plus any tap ---- */
function pluckAge(t) {
  var a = t % PLUCK_LEN;
  if (tapPluck >= 0 && t >= tapPluck) a = Math.min(a, t - tapPluck);
  return a;
}
function pluckAmp(t) {
  var a = pluckAge(t);
  return a < 3.5 ? Math.exp(-a * 1.7) : 0;
}
/* ---- the five objects, drawn at (x, y) with unit s ---- */
function drawPencil(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = PENCIL; ctx.strokeStyle = MIC; ctx.lineWidth = Math.max(1, s * 0.06);
  ctx.fillRect(-s * 1.05, -s * 0.22, s * 1.7, s * 0.44);
  ctx.strokeRect(-s * 1.05, -s * 0.22, s * 1.7, s * 0.44);
  ctx.fillStyle = PAPER;
  ctx.beginPath(); ctx.moveTo(s * 0.65, -s * 0.22); ctx.lineTo(s * 1.15, 0);
  ctx.lineTo(s * 0.65, s * 0.22); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = MIC; circ(s * 1.02, 0, s * 0.07, true);
  ctx.fillStyle = STONE; ctx.fillRect(-s * 1.28, -s * 0.22, s * 0.23, s * 0.44);
  ctx.strokeRect(-s * 1.28, -s * 0.22, s * 0.23, s * 0.44);
  ctx.strokeStyle = rgba(MIC, 0.5); ctx.lineWidth = Math.max(1, s * 0.04);
  seg(-s * 0.95, 0, s * 0.55, 0);
  ctx.restore();
}
function drawWire(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.strokeStyle = WIRE; ctx.lineWidth = Math.max(1.5, s * 0.16);
  ctx.beginPath(); ctx.moveTo(x * 0 + s * 0.75, s * 0.1);
  ctx.arc(0, 0, s * 0.78, 0.15, TAU * 0.92); ctx.stroke();
  ctx.lineWidth = Math.max(1, s * 0.1);
  ctx.beginPath(); ctx.moveTo(s * 0.72, s * 0.28);
  ctx.quadraticCurveTo(s * 1.15, s * 0.55, s * 0.95, s * 0.95); ctx.stroke();
  ctx.strokeStyle = rgba(MIC, 0.45);
  ctx.beginPath(); ctx.moveTo(-s * 0.78, 0);
  ctx.arc(0, 0, s * 0.78, Math.PI * 0.9, Math.PI * 1.15); ctx.stroke();
  ctx.restore();
}
function drawStones(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = STONE; ctx.strokeStyle = MIC; ctx.lineWidth = Math.max(1, s * 0.06);
  circ(-s * 0.55, s * 0.18, s * 0.42, true);
  ctx.beginPath(); ctx.moveTo(-s * 0.13, s * 0.18); ctx.arc(-s * 0.55, s * 0.18, s * 0.42, 0, TAU); ctx.stroke();
  circ(s * 0.25, -s * 0.28, s * 0.36, true);
  ctx.beginPath(); ctx.moveTo(s * 0.61, -s * 0.28); ctx.arc(s * 0.25, -s * 0.28, s * 0.36, 0, TAU); ctx.stroke();
  circ(s * 0.62, s * 0.28, s * 0.3, true);
  ctx.beginPath(); ctx.moveTo(s * 0.92, s * 0.28); ctx.arc(s * 0.62, s * 0.28, s * 0.3, 0, TAU); ctx.stroke();
  ctx.fillStyle = rgba(PAPER, 0.7);
  circ(-s * 0.68, s * 0.05, s * 0.09, true);
  circ(s * 0.14, -s * 0.4, s * 0.08, true);
  ctx.restore();
}
function drawCoin(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = COIN; ctx.strokeStyle = MIC; ctx.lineWidth = Math.max(1, s * 0.06);
  circ(0, 0, s * 0.55, true);
  ctx.beginPath(); ctx.moveTo(s * 0.55, 0); ctx.arc(0, 0, s * 0.55, 0, TAU); ctx.stroke();
  ctx.strokeStyle = rgba(MIC, 0.55); ctx.lineWidth = Math.max(1, s * 0.05);
  circ(0, 0, s * 0.36, false);
  ctx.fillStyle = MIC; circ(0, 0, s * 0.08, true);
  ctx.restore();
}
function drawClothespin(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = PAPER; ctx.strokeStyle = MIC; ctx.lineWidth = Math.max(1, s * 0.06);
  ctx.beginPath();
  ctx.moveTo(-s * 0.18, -s * 0.95); ctx.lineTo(s * 0.1, -s * 0.95);
  ctx.lineTo(s * 0.28, s * 0.85); ctx.lineTo(-s * 0.05, s * 0.85);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-s * 0.1, -s * 0.95); ctx.lineTo(s * 0.18, -s * 0.95);
  ctx.lineTo(s * 0.05, s * 0.85); ctx.lineTo(-s * 0.28, s * 0.85);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = WIRE; ctx.fillRect(-s * 0.32, -s * 0.28, s * 0.64, s * 0.22);
  ctx.strokeRect(-s * 0.32, -s * 0.28, s * 0.64, s * 0.22);
  ctx.restore();
}
var DRAWERS = { pencils: drawPencil, wire: drawWire, stones: drawStones, coin: drawCoin, clothespin: drawClothespin };
var ROT_HOME = { pencils: -0.12, wire: 0.25, stones: 0, coin: 0, clothespin: 0.1 };
var ROT_SLOT = { pencils: 0.06, wire: -0.15, stones: 0, coin: 0, clothespin: 1.35 };
function objPos(o) {
  var S = Math.min(SC.w, SC.h);
  if (dragId >= 0 && OBJECTS[dragId] === o) return { x: dragX, y: dragY, s: S * 0.044 };
  if (o.prepared) return { x: SC.x + SC.w * 0.82, y: SC.y + SC.h * o.slotY, s: S * 0.044 };
  return { x: SC.x + SC.w * o.homeX, y: SC.y + SC.h * HOME_Y, s: S * 0.044 };
}
/* ---- the room ---- */
function drawBooth(sc) {
  ctx.fillStyle = BOOTH;
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = BOOTH_DARK;
  ctx.fillRect(0, sc.y + sc.h * 0.92, VW, VH);
  ctx.strokeStyle = rgba(BOOTH_DARK, 0.5);
  ctx.lineWidth = 1;
  seg(0, sc.y + sc.h * 0.92, VW, sc.y + sc.h * 0.92);
  var i;
  for (i = 0; i < SEAMS.length; i++) {
    ctx.strokeStyle = rgba(BOOTH_DARK, 0.35);
    seg(sc.x + sc.w * SEAMS[i], sc.y, sc.x + sc.w * SEAMS[i], sc.y + sc.h * 0.92);
  }
  if (!isPhone) {
    ctx.strokeStyle = rgba(PAPER, 0.25);
    ctx.lineWidth = 1;
    ctx.strokeRect(sc.x + 0.5, sc.y + 0.5, sc.w - 1, sc.h - 1);
  }
}
function drawMic(sc) {
  var S = Math.min(sc.w, sc.h);
  var cx = sc.x + sc.w * 0.36;
  var sway = Math.sin(phaseT * 0.5) * S * 0.004;
  ctx.strokeStyle = MIC; ctx.lineWidth = Math.max(1.5, S * 0.004);
  seg(cx, sc.y, cx + sway, sc.y + sc.h * 0.13);
  /* pop filter: a ring with mesh */
  var fy = sc.y + sc.h * 0.175;
  ctx.fillStyle = rgba(MIC, 0.55);
  circ(cx + sway, fy, S * 0.052, true);
  ctx.strokeStyle = WIRE; ctx.lineWidth = Math.max(1.5, S * 0.005);
  circ(cx + sway, fy, S * 0.052, false);
  ctx.strokeStyle = rgba(WIRE, 0.4); ctx.lineWidth = 1;
  seg(cx + sway - S * 0.045, fy, cx + sway + S * 0.045, fy);
  seg(cx + sway, fy - S * 0.045, cx + sway, fy + S * 0.045);
  /* mic body */
  var by = sc.y + sc.h * 0.235;
  ctx.fillStyle = MIC;
  ctx.beginPath(); ctx.moveTo(cx + sway - S * 0.02, by);
  ctx.lineTo(cx + sway + S * 0.02, by);
  ctx.lineTo(cx + sway + S * 0.016, by + S * 0.075);
  ctx.lineTo(cx + sway - S * 0.016, by + S * 0.075);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = WIRE; ctx.lineWidth = Math.max(1, S * 0.003);
  seg(cx + sway - S * 0.019, by + S * 0.022, cx + sway + S * 0.019, by + S * 0.022);
  seg(cx + sway - S * 0.018, by + S * 0.048, cx + sway + S * 0.018, by + S * 0.048);
}
function drawStool(sc) {
  var S = Math.min(sc.w, sc.h);
  var cx = sc.x + sc.w * 0.36, cy = sc.y + sc.h * 0.66;
  var floorY = sc.y + sc.h * 0.92;
  ctx.strokeStyle = MIC; ctx.lineWidth = Math.max(2, S * 0.008);
  seg(cx - S * 0.09, cy + S * 0.02, cx - S * 0.13, floorY);
  seg(cx + S * 0.09, cy + S * 0.02, cx + S * 0.13, floorY);
  seg(cx, cy + S * 0.02, cx, floorY);
  ctx.fillStyle = MIC;
  ell(cx, cy, S * 0.165, S * 0.032, true);
  ctx.strokeStyle = rgba(PAPER, 0.5); ctx.lineWidth = Math.max(1, S * 0.003);
  ell(cx, cy, S * 0.165, S * 0.032, false);
  ctx.fillStyle = rgba(PAPER, 0.14);
  ell(cx, cy - S * 0.004, S * 0.14, S * 0.022, true);
}
/* ---- the guitar: body intrudes as a curved edge from the right ---- */
function drawGuitar(sc) {
  var S = Math.min(sc.w, sc.h);
  var bx = sc.x + sc.w * 1.04, by = sc.y + sc.h * 0.62, br = S * 0.34;
  ctx.fillStyle = MIC;
  ctx.beginPath(); ctx.moveTo(bx - br, by); ctx.arc(bx, by, br, 0, TAU); ctx.fill();
  ctx.strokeStyle = PAPER; ctx.lineWidth = Math.max(1.5, S * 0.004);
  ctx.beginPath(); ctx.moveTo(bx - br, by); ctx.arc(bx, by, br, 0, TAU); ctx.stroke();
  /* sound hole */
  var hx = sc.x + sc.w * 0.88, hy = sc.y + sc.h * 0.62;
  ctx.fillStyle = BOOTH_DARK;
  circ(hx, hy, S * 0.055, true);
  ctx.strokeStyle = rgba(PAPER, 0.6); ctx.lineWidth = Math.max(1, S * 0.003);
  circ(hx, hy, S * 0.055, false);
  /* bridge */
  ctx.fillStyle = PAPER;
  ctx.fillRect(sc.x + sc.w * 0.70, sc.y + sc.h * 0.665, sc.w * 0.24, S * 0.008);
}
function stringZoneRect(sc) {
  return { x0: sc.x + sc.w * 0.665, y0: sc.y + sc.h * 0.09,
           x1: sc.x + sc.w * 0.975, y1: sc.y + sc.h * 0.68 };
}
function drawStrings(sc) {
  var S = Math.min(sc.w, sc.h);
  var z = stringZoneRect(sc);
  ctx.fillStyle = rgba(PAPER, 0.05);
  ctx.fillRect(z.x0, z.y0, z.x1 - z.x0, z.y1 - z.y0);
  ctx.strokeStyle = rgba(PAPER, 0.28); ctx.lineWidth = 1;
  ctx.strokeRect(z.x0 + 0.5, z.y0 + 0.5, z.x1 - z.x0 - 1, z.y1 - z.y0 - 1);
  ctx.fillStyle = rgba(PAPER, 0.75);
  ctx.font = Math.max(10, S * 0.016) + 'px monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('strings', z.x0 + S * 0.012, z.y0 + S * 0.008);
  var amp = pluckAmp(phaseT);
  var age = pluckAge(phaseT);
  var i, k;
  for (i = 0; i < 6; i++) {
    var sx = sc.x + sc.w * (0.70 + i * 0.048);
    var vib = amp * Math.sin(age * 30 + i * 1.7) * S * 0.008;
    ctx.strokeStyle = PAPER;
    ctx.lineWidth = i < 2 ? Math.max(1.5, S * 0.003) : Math.max(1, S * 0.002);
    ctx.beginPath();
    ctx.moveTo(sx, z.y0 + S * 0.02);
    /* kinks where prepared objects press the string */
    var pts = [{ y: z.y0 + S * 0.02, x: sx }];
    for (k = 0; k < OBJECTS.length; k++) {
      var o = OBJECTS[k];
      if (!o.prepared) continue;
      var oy = sc.y + sc.h * o.slotY;
      var ox = sc.x + sc.w * 0.82;
      pts.push({ y: oy - S * 0.03, x: sx + vib * 0.4 });
      pts.push({ y: oy, x: sx + (ox - sx) * 0.18 + vib });
      pts.push({ y: oy + S * 0.03, x: sx + vib * 0.4 });
    }
    pts.push({ y: sc.y + sc.h * 0.665, x: sx });
    var j;
    for (j = 1; j < pts.length; j++) {
      var midY = (pts[j - 1].y + pts[j].y) / 2;
      var wob = (j === pts.length - 1) ? vib : 0;
      ctx.lineTo(pts[j - 1].x + (j > 1 ? 0 : vib * 0.5), midY + wob * 0.3);
      ctx.lineTo(pts[j].x, pts[j].y);
    }
    ctx.stroke();
  }
}
function voiceText() {
  var names = [], i;
  for (i = 0; i < OBJECTS.length; i++) {
    if (OBJECTS[i].prepared) names.push(OBJECTS[i].label);
  }
  if (names.length === 0) return 'voice: clean guitar';
  return 'voice: ' + names.join(' + ');
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Stool of Objects').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Stool of Objects').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 19').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Stool of Objects', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 19', plateX + 14, plateY + 7 + titlePx + 3);
  /* hint plate, bottom left */
  var hint = 'Drag an object onto the strings to prepare the guitar.';
  var hintPx = smallPx;
  ctx.font = hintPx + 'px monospace';
  while (hintPx > 9 && ctx.measureText(hint).width > VW - 24) {
    hintPx -= 1;
    ctx.font = hintPx + 'px monospace';
  }
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = hintPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  /* voice plate: bottom right on wide screens, stacked above the hint on phones */
  var vt = voiceText();
  ctx.font = smallPx + 'px monospace';
  var vtW = ctx.measureText(vt).width;
  var vtPlateW = vtW + 24;
  var vtPlateH = smallPx + 14;
  var vtPlateY = VH - vtPlateH - 12;
  var vtPlateX = VW - vtPlateW - 12;
  if (vtPlateX <= hintPlateX + hintPlateW + 8) {
    vtPlateX = 12;
    vtPlateY = hintPlateY - vtPlateH - 8;
  }
  ctx.fillStyle = PLATE;
  ctx.fillRect(vtPlateX, vtPlateY, vtPlateW, vtPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(vtPlateX + 0.5, vtPlateY + 0.5, vtPlateW - 1, vtPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(vt, vtPlateX + 12, vtPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  SC = sc;
  var S = Math.min(sc.w, sc.h);
  drawBooth(sc);
  drawGuitar(sc);
  drawStrings(sc);
  drawStool(sc);
  drawMic(sc);
  var i;
  /* objects still on the stool */
  for (i = 0; i < OBJECTS.length; i++) {
    var o = OBJECTS[i];
    if (o.prepared) continue;
    if (dragId >= 0 && OBJECTS[dragId] === o) continue;
    var p = objPos(o);
    DRAWERS[o.id](p.x, p.y, p.s, ROT_HOME[o.id]);
  }
  /* dragged object follows the pointer, on top */
  if (dragId >= 0) {
    var d = OBJECTS[dragId];
    DRAWERS[d.id](dragX, dragY, S * 0.044, ROT_HOME[d.id]);
  }
  /* prepared objects rest on the strings, on top */
  for (i = 0; i < OBJECTS.length; i++) {
    var q = OBJECTS[i];
    if (!q.prepared) continue;
    if (dragId >= 0 && OBJECTS[dragId] === q) continue;
    var pp = objPos(q);
