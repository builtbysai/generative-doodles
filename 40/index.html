<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№40 · Moire Rings</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(28,28,30,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to shift the phase</div>
<script>
'use strict';
// No40 Moire Rings.
// Two identical fields of dots: concentric rings, ring r carrying
// 6r dots, one field in ink, one in indigo. The fields rotate in
// opposite directions at slightly different rates, so where the
// dots nearly coincide they darken into bands, and the bands
// breathe slowly across the field. Nothing here but the two
// rotations: the interference is the picture. Drag horizontally to
// shift the second field's phase; on release the offset eases back
// to the loop rate.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '40', 10) || 40;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f4f1ea';
const INK = '#1c1c1e';
const INDIGO = '#2b3a67';
const RINGS = 16;

let phaseDrag = 0;         // extra phase on field two while dragging
let phaseEase = 0;         // lingering offset after release, decays to 0
let dragging = false;
let dragStartX = 0, dragStartPhase = 0;

function layout(w, h) {
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  return { RX, RY, ox: (w - RX) / 2, oy: (h - RY) / 2 };
}

function drawField(cx, cy, stepR, phase, color, dotR) {
  ctx.fillStyle = color;
  for (let r = 1; r <= RINGS; r++) {
    const n = 6 * r;
    const rad = r * stepR;
    for (let i = 0; i < n; i++) {
      const a = phase + (i / n) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx + rad * Math.cos(a), cy + rad * Math.sin(a), dotR, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const { RX, RY } = layout(w, h);
  const t = nowMs / 1000;
  phaseEase *= 0.995;
  const cx = w / 2, cy = h / 2;
  const stepR = Math.min(RX, RY) * 0.47 / RINGS;
  const dotR = Math.max(0.9, stepR * 0.16);
  const p1 = t * 0.05;
  const p2 = -t * 0.043 + phaseDrag + phaseEase;
  drawField(cx, cy, stepR, p1, INK, dotR);
  drawField(cx, cy, stepR, p2, INDIGO, dotR);
  return {};
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(9000);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function pointerX(ev) {
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0 };
  return ev.clientX - r.left;
}
canvas.addEventListener('pointerdown', ev => {
  dragging = true;
  dragStartX = pointerX(ev);
  dragStartPhase = phaseDrag + phaseEase;
  phaseEase = 0;
});
canvas.addEventListener('pointermove', ev => {
  if (!dragging) return;
  const [w, h] = viewportWH();
  const { RX } = layout(w, h);
  phaseDrag = dragStartPhase + ((pointerX(ev) - dragStartX) / RX) * Math.PI * 2;
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  phaseEase = phaseDrag;
  phaseDrag = 0;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
