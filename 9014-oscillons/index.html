<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9014 · Oscillons — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14120d;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 600px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #a33b2e; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #0c0e0a;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #a33b2e; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9014</span> · Oscillons</h1>
  <p>Waveforms drawn the way an oscilloscope draws them: a bright beam sweeping
  phosphor, glowing brighter where it lingers. <b>Click the piece for a new
  variation.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 424242;

const TAU = Math.PI * 2;
const VU = 1000;
const BG = "#0c0e0a";

// phosphor palette: one dominant, one secondary per piece
const PHOSPHORS = [
  ["#a9f2c4", "#8fdce8"],  // mint + cyan
  ["#8fdce8", "#a9f2c4"],  // cyan + mint
  ["#a9f2c4", "#f2c879"],  // mint + amber
  ["#f2c879", "#a9f2c4"],  // amber + mint
  ["#b8f0d0", "#7fd0e0"]
];

function hexRGB(h){
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}

function makeNoise(rnd){
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = rnd();
  const at = x => g[x & 255];
  const sm = t => t * t * (3 - 2 * t);
  return function(x){
    const xi = Math.floor(x), xf = x - xi;
    const a = at(xi), b = at(xi + 1), u = sm(xf);
    return a + (b - a) * u;
  };
}

function draw(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  const K = S / VU;
  canvas.width = S * dpr; canvas.height = S * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr * K, 0, 0, dpr * K, 0, 0);

  const rnd = mulberry32(seed);
  const wob = makeNoise(mulberry32(seed ^ 0x51ab));
  const wob2 = makeNoise(mulberry32(seed ^ 0x77e1));

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, VU, VU);

  const pal = PHOSPHORS[(rnd() * PHOSPHORS.length) | 0];
  const cDom = hexRGB(pal[0]), cSec = hexRGB(pal[1]);

  // faint screen glow at the center
  const glow = ctx.createRadialGradient(500, 500, 60, 500, 500, 520);
  glow.addColorStop(0, `rgba(${cDom[0]},${cDom[1]},${cDom[2]},0.055)`);
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, VU, VU);

  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Build traces: a mix of X-Y mode (lissajous figures) and sweep mode
  // (time-domain waveforms), like a real bench oscilloscope.
  const traces = [];
  const nXY = 2 + ((rnd() * 2) | 0);      // 2..3 lissajous figures
  const nSweep = 1 + ((rnd() * 3) | 0);   // 1..3 waveforms
  for (let i = 0; i < nXY; i++){
    const dom = i === 0;
    traces.push({
      mode: "xy",
      cx: 500 + (rnd() - 0.5) * (dom ? 60 : 300),
      cy: 500 + (rnd() - 0.5) * (dom ? 60 : 300),
      scale: dom ? 300 + rnd() * 90 : 100 + rnd() * 130,
      a: 1 + ((rnd() * 4) | 0), b: 1 + ((rnd() * 4) | 0),
      a2: 2 + ((rnd() * 5) | 0), b2: 2 + ((rnd() * 5) | 0),
      p1: rnd() * TAU, p2: rnd() * TAU, q1: rnd() * TAU, q2: rnd() * TAU,
      harm: 0.10 + rnd() * 0.14,
      wobAmp: 0.03 + rnd() * 0.05,
      wobF: 0.6 + rnd() * 1.4,
      color: dom || rnd() < 0.7 ? cDom : cSec,
      bright: dom ? 1.0 : 0.45 + rnd() * 0.25,
      rot: (rnd() - 0.5) * 0.6,
      w: dom ? 2.6 : 1.4 + rnd() * 0.9
    });
  }
  for (let i = 0; i < nSweep; i++){
    traces.push({
      mode: "sweep",
      yBase: 150 + (i + rnd() * 0.8) * (700 / nSweep),
      amp: 40 + rnd() * 90,
      f: 2 + ((rnd() * 5) | 0),
      f2: 5 + ((rnd() * 9) | 0),
      p1: rnd() * TAU, p2: rnd() * TAU,
      harm: 0.12 + rnd() * 0.16,
      wobAmp: 0.04 + rnd() * 0.06,
      wobF: 1.2 + rnd() * 2.2,
      color: rnd() < 0.75 ? cDom : cSec,
      bright: 0.4 + rnd() * 0.3,
      w: 1.2 + rnd() * 0.8
    });
  }

  // draw each trace as speed-shaded segments: a real beam glows brighter
  // where it lingers (turnaround points) and dims where it races
  function strokeTrace(pts, color, bright, lw){
    // pass 1: soft halo
    ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},${0.10 * bright})`;
    ctx.lineWidth = lw * 4.2;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    // pass 2: per-segment beam shading
    for (let i = 1; i < pts.length; i++){
      const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      const sp = Math.hypot(dx, dy);
      const a = Math.min(0.9, (2.6 / (sp + 1.4))) * bright;
      ctx.strokeStyle = `rgba(${color[0]},${color[1]},${color[2]},${a.toFixed(3)})`;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(pts[i - 1][0], pts[i - 1][1]);
      ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
    }
  }

  const N = 1100;
  for (const tr of traces){
    const pts = [];
    if (tr.mode === "xy"){
      const ca = Math.cos(tr.rot), sa = Math.sin(tr.rot);
      for (let i = 0; i <= N; i++){
        const t = (i / N) * TAU;
        let x = Math.sin(tr.a * t + tr.p1) + tr.harm * Math.sin(tr.a2 * t + tr.p2);
        let y = Math.sin(tr.b * t + tr.q1) + tr.harm * Math.sin(tr.b2 * t + tr.q2);
        x += (wob(t * tr.wobF + tr.p1) - 0.5) * 2 * tr.wobAmp * 3;
        y += (wob2(t * tr.wobF + tr.q1) - 0.5) * 2 * tr.wobAmp * 3;
        const rx = x * ca - y * sa, ry = x * sa + y * ca;
        pts.push([tr.cx + rx * tr.scale, tr.cy + ry * tr.scale]);
      }
    } else {
      const x0 = 90 + rnd() * 180, x1 = 910 - rnd() * 180;
      for (let i = 0; i <= N; i++){
        const x = x0 + (x1 - x0) * (i / N);
        const t = (i / N) * TAU;
        let y = Math.sin(tr.f * t + tr.p1) + tr.harm * Math.sin(tr.f2 * t + tr.p2);
        y += (wob(t * tr.wobF + tr.p1) - 0.5) * 2 * tr.wobAmp * 4;
        pts.push([x, tr.yBase + y * tr.amp]);
      }
    }
    strokeTrace(pts, tr.color, tr.bright, tr.w);
  }
  ctx.globalCompositeOperation = "source-over";

  // analogue finish: grain + vignette + whisper of scanlines
  const rnd2 = mulberry32(seed ^ 0x33cc);
  for (let i = 0; i < 2600; i++){
    const gx = rnd2() * VU, gy = rnd2() * VU;
    ctx.globalAlpha = 0.02 + rnd2() * 0.05;
    ctx.fillStyle = rnd2() < 0.7 ? "#cfe0d4" : "#0a0c08";
    const gs = 1.0 + rnd2() * 1.5;
    ctx.fillRect(gx, gy, gs, gs);
  }
  ctx.globalAlpha = 1;
  ctx.globalAlpha = 0.028;
  ctx.fillStyle = "#000";
  for (let yy = 0; yy < VU; yy += 4) ctx.fillRect(0, yy, VU, 1.4);
  ctx.globalAlpha = 1;
  const vg = ctx.createRadialGradient(500, 500, 340, 500, 500, 760);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VU, VU);
}

window.addEventListener("resize", draw);
document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  draw();
});
draw();
</script>
</body>
</html>
