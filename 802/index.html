<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monochrome Field</title>
<style>
  html, body { margin: 0; padding: 0; background: #C83A1E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): the vermilion-orange enamel and its own darker edge tone.
  // The sheen tone is the field mixed toward white inside the same family:
  // #C83A1E mixed 0.38 toward white = #DE846C. No new hue enters.
  var FIELD = '#C83A1E';
  var EDGE  = '#A62C14';
  var SHEEN = '#DE846C';

  var LOOP = 40; // seconds, seamless

  // Sheen sweep phase: centre x = W * (0.5 + 0.45 * sin(PHASE(t))).
  // PHASE0 is chosen so at t = 0 the band sits at 0.30 * W (left-centre),
  // inside the frame and readable in the thumbnail: sin(PHASE0) = -0.444.
  var PHASE0 = -0.4605;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // mulberry32: deterministic seeded RNG
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function viewportSize() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
  }

  function isPhone(w, h) {
    var sw = 0, sh = 0;
    if (window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return h > w * 1.15;
  }

  // ---------- precomputed layout (function of size only, fixed seed) ----------
  var layout = null;

  function buildLayout(w, h) {
    var rng = mulberry32(80240);
    var phone = isPhone(w, h);

    // Fine enamel grain: precomputed specks of the edge tone and the sheen
    // tone at ~3% alpha, denser dark than light, like pigment unevenness.
    var grain = [];
    var grainCount = Math.floor(w * h / (phone ? 210 : 260));
    for (var i = 0; i < grainCount; i++) {
      grain.push({
        x: rng() * w,
        y: rng() * h,
        s: 0.6 + rng() * 1.6,
        a: 0.015 + rng() * 0.030,
        dark: rng() < 0.62
      });
    }

    return { w: w, h: h, grain: grain, minDim: Math.min(w, h) };
  }

  // ---------- drawing ----------

  function drawEdgeDarkening() {
    // Layered flat inset bands of the edge tone, low alpha, cumulative
    // toward the perimeter. Flat bands, never a gradient.
    var w = layout.w, h = layout.h;
    var step = Math.max(2, layout.minDim * 0.014);
    var alphas = [0.055, 0.045, 0.036, 0.027, 0.018];
    ctx.strokeStyle = EDGE;
    for (var i = 0; i < alphas.length; i++) {
      ctx.globalAlpha = alphas[i];
      ctx.lineWidth = step;
      var inset = step * (i + 0.5);
      ctx.strokeRect(inset, inset, w - inset * 2, h - inset * 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawSheen(phase) {
    // The specular band: nested full-height flat rects of the sheen tone,
    // widest and faintest first, each narrower layer adding a whisper of
    // alpha, so the composited light ramps smoothly to ~0.29 at the centre
    // and back to nothing at the band edges. No gradient, no thin strips
    // (fractional strip edges antialias into visible pinstripes).
    // Rect coordinates are rounded to whole pixels for the same reason.
    // The band centre sweeps left to right and back on the loop phase.
    var w = layout.w, h = layout.h;
    var cx = w * (0.5 + 0.45 * Math.sin(phase));
    var half = w * 0.30; // band half-width
    var layers = 24;
    ctx.fillStyle = SHEEN;
    for (var i = 0; i < layers; i++) {
      var hw = half * (1 - i / layers);
      var x = Math.round(cx - hw);
      ctx.globalAlpha = 0.014;
      ctx.fillRect(x, 0, Math.round(hw * 2), h);
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    var size = viewportSize();
    if (!layout || layout.w !== size.w || layout.h !== size.h) {
      canvas.width = size.w;
      canvas.height = size.h;
      layout = buildLayout(size.w, size.h);
    }
    canvas.style.width = size.w + 'px';
    canvas.style.height = size.h + 'px';

    var w = layout.w, h = layout.h;
    var phase = (t / LOOP) * Math.PI * 2 + PHASE0;
    var s = Math.sin(phase);

    // the flat enamel field, wall to wall
    ctx.globalAlpha = 1;
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, w, h);

    // brightness breath, +/-4% on the sweep phase: a whisper of the sheen
    // tone when the light gathers, of the edge tone as it leaves
    if (s > 0) {
      ctx.globalAlpha = 0.05 * s;
      ctx.fillStyle = SHEEN;
      ctx.fillRect(0, 0, w, h);
    } else if (s < 0) {
      ctx.globalAlpha = 0.05 * (-s);
      ctx.fillStyle = EDGE;
      ctx.fillRect(0, 0, w, h);
    }
    ctx.globalAlpha = 1;

    // enamel grain
    var i, g;
    for (i = 0; i < layout.grain.length; i++) {
      g = layout.grain[i];
      ctx.globalAlpha = g.a;
      ctx.fillStyle = g.dark ? EDGE : SHEEN;
      ctx.fillRect(g.x, g.y, g.s, g.s);
    }
    ctx.globalAlpha = 1;

    // the light on the field
    drawSheen(phase);

    // the field's own darker rim
    drawEdgeDarkening();
  }

  // frame one: synchronous, fixed phase t = 0 (sheen at left-centre)
  draw(0);

  var start = null;
  function frame(ts) {
    if (start === null) start = ts;
    draw(((ts - start) / 1000) % LOOP);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

  function onResize() { draw(0); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
