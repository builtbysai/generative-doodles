<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.191 Forty-Five Foot Worm</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EFE7D6; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font:12px system-ui, sans-serif; color:#6E766E; opacity:0.75;
    pointer-events:none; letter-spacing:0.04em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag to conduct, tap a red segment</div>
<script>
(function () {
'use strict';
// No.191 Forty-Five Foot Worm. Wilson Park, Torrance: a forty five
// foot ferrocement worm, genuinely climbable, genuinely a landmark,
// crawling in place on warm paper like a treadmill diorama of the
// park. Forty four segments ride a lazy S that bleeds off both
// edges; a peristalsis wave runs head to tail on a 45 second loop
// while the park furniture drifts past below. Every tenth segment
// is painted weathered signal red. Drag along the body to conduct
// the ripple with your finger; tap a red segment and it tucks,
// shy, then relaxes. No face, no eyes: it is concrete, and loved.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#EFE7D6', SEG = '#9AA39B', SEAM = '#6E766E', SHADOW = '#D8CFBB', RED = '#C4451F';
var W = 0, H = 0, phone = false;
var seed = 191191;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
var state = seed >>> 0;
function rand() { state = (state * 1664525 + 1013904223) >>> 0; return state / 4294967296; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

var NSEG = 44;
var segSpeck = [], segCenters = [];
function spline(s) {
  return {
    x: -0.08 * W + 1.16 * W * s,
    y: H * 0.46 + H * 0.15 * Math.sin(s * Math.PI * 2 * 0.85 + 0.6)
  };
}
function buildSegs() {
  segCenters = [];
  for (var i = 0; i < NSEG; i++) {
    var s = (i + 0.5) / NSEG;
    var p = spline(s), p2 = spline(Math.min(1.02, s + 0.01));
    segCenters.push({ s: s, x: p.x, y: p.y, ang: Math.atan2(p2.y - p.y, p2.x - p.x) });
  }
  segSpeck = [];
  state = seed >>> 0;
  for (var j = 0; j < NSEG; j++) {
    var dots = [];
    for (var k = 0; k < 7; k++) dots.push([(rand() - 0.5) * 0.8, (rand() - 0.5) * 0.62, 0.8 + rand() * 1.6]);
    segSpeck.push(dots);
  }
}
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
  buildSegs();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction -----------------------------------------------------------
var pulses = []; // conducted ripples {s, at}
var tucks = {};  // segment index -> start time (seconds, piece clock)
var dragging = false, downX = 0, downY = 0, downAt = 0, fingerS = -1, lastPulseAt = 0;
function nearestS(x, y) {
  var best = -1, bd = 1e12;
  for (var i = 0; i < segCenters.length; i++) {
    var dx = segCenters[i].x - x, dy = segCenters[i].y - y;
    var d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  return { i: best, d: Math.sqrt(bd) };
}
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; downX = e.clientX; downY = e.clientY; downAt = e.timeStamp;
  var n = nearestS(e.clientX, e.clientY);
  fingerS = n.i >= 0 ? segCenters[n.i].s : -1;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var n = nearestS(e.clientX, e.clientY);
  if (n.i < 0) return;
  fingerS = segCenters[n.i].s;
  var nowS = pieceT;
  if (nowS - lastPulseAt > 0.09) {
    lastPulseAt = nowS;
    pulses.push({ s: fingerS, at: nowS });
    if (pulses.length > 24) pulses.shift();
  }
});
canvas.addEventListener('pointerup', function (e) {
  var moved = Math.sqrt((e.clientX - downX) * (e.clientX - downX) + (e.clientY - downY) * (e.clientY - downY));
  dragging = false;
  fingerS = -1;
  if (moved < 8 && e.timeStamp - downAt < 350) {
    var n = nearestS(e.clientX, e.clientY);
    if (n.i >= 0 && n.i % 10 === 4 && n.d < Math.max(H * 0.07, 30)) tucks[n.i] = pieceT;
  }
});
canvas.addEventListener('pointercancel', function () { dragging = false; fingerS = -1; });

// ---- drawing ----------------------------------------------------------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
var pieceT = 0, lastNow = -1;
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && now > 0) pieceT += Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  var t = pieceT + 12; // frame one: the crawl already developed
  var crawl = t * (Math.PI * 2 * 4 / 45);

  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  // park props drifting on the treadmill, along the bottom
  var drift = t * 7;
  function px(frac) { return ((frac * (W + 320) - drift) % (W + 320) + (W + 320)) % (W + 320) - 160; }
  ctx.fillStyle = SHADOW;
  ctx.fillRect(0, H * 0.885, W, H * 0.012);
  var benchAt = [0.10, 0.47, 0.82];
  for (var bi = 0; bi < benchAt.length; bi++) {
    var bx = px(benchAt[bi]), by = H * 0.845, bw = Math.min(W, H) * 0.16;
    ctx.strokeStyle = SEAM;
    ctx.lineWidth = Math.max(2, H * 0.004);
    for (var sl = 0; sl < 3; sl++) {
      ctx.beginPath();
      ctx.moveTo(bx, by + sl * H * 0.011);
      ctx.lineTo(bx + bw, by + sl * H * 0.011);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(bx + bw * 0.12, by + H * 0.024);
    ctx.lineTo(bx + bw * 0.12, H * 0.885);
    ctx.moveTo(bx + bw * 0.88, by + H * 0.024);
    ctx.lineTo(bx + bw * 0.88, H * 0.885);
    ctx.stroke();
  }
  var blobAt = [[0.30, SEG], [0.65, RED], [0.93, SEG]];
  for (var bli = 0; bli < blobAt.length; bli++) {
    var lx = px(blobAt[bli][0]), ly = H * 0.878, lr = Math.min(W, H) * 0.020;
    ctx.fillStyle = blobAt[bli][1];
    ctx.beginPath();
    ctx.ellipse(lx, ly, lr * 1.5, lr, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(lx + lr * 0.9, ly - lr * 0.55, lr * 0.72, lr * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // segment size: keyed to height, but capped by the segment pitch so
  // a narrow phone frame keeps pills in proportion instead of a thicket
  var spacing = 1.16 * W / NSEG;
  var segH = Math.min(H * 0.088, spacing * 2.6);

  // soft shadow band under the worm
  ctx.strokeStyle = SHADOW;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = segH;
  ctx.beginPath();
  for (var si2 = 0; si2 <= 40; si2++) {
    var sp2 = spline(si2 / 40);
    if (si2 === 0) ctx.moveTo(sp2.x, sp2.y + segH * 0.18);
    else ctx.lineTo(sp2.x, sp2.y + segH * 0.18);
  }
  ctx.stroke();

  // segments
  for (var i = 0; i < NSEG; i++) {
    var c = segCenters[i];
    var ph = c.s * 22 + crawl;
    var wave = Math.sin(ph);
    var lift = segH * 0.14 * Math.max(0, wave);
    // conducted pulses: gaussian lift travelling toward the tail
    for (var pi = 0; pi < pulses.length; pi++) {
      var pu = pulses[pi], age = t - pu.at;
      if (age < 0 || age > 1.8) continue;
      var sc = pu.s - age * 0.22;
      var dd = (c.s - sc) / 0.035;
      lift += segH * 0.23 * Math.exp(-dd * dd) * (1 - age / 1.8);
    }
    if (fingerS >= 0) {
      var fd = (c.s - fingerS) / 0.03;
      lift += segH * 0.19 * Math.exp(-fd * fd);
    }
    // shy tuck on red segments
    var tuckK = 0;
    if (tucks[i] !== undefined) {
      var tau = t - tucks[i];
      if (tau > 2.0) delete tucks[i];
      else if (tau < 0.25) tuckK = tau / 0.25;
      else if (tau < 0.9) tuckK = 1;
      else tuckK = 1 - (tau - 0.9) / 1.1;
      tuckK = tuckK * tuckK * (3 - 2 * tuckK);
    }
    var hScale = (1 + 0.13 * wave) * (1 - 0.38 * tuckK);
    var lScale = (1 - 0.05 * wave) * (1 - 0.30 * tuckK);
    var nx = -Math.sin(c.ang), ny = Math.cos(c.ang);
    var cxp = c.x + nx * (-lift + tuckK * segH * 0.18);
    var cyp = c.y + ny * (-lift + tuckK * segH * 0.18);
    ctx.save();
    ctx.translate(cxp, cyp);
    ctx.rotate(c.ang + tuckK * 0.22);
    var lw = spacing * 1.14 * lScale, lh = segH * hScale;
    var red = i % 10 === 4;
    ctx.fillStyle = red ? RED : SEG;
    rr(-lw / 2, -lh / 2, lw, lh, lh * 0.32);
    ctx.fill();
    ctx.strokeStyle = SEAM;
    ctx.lineWidth = Math.max(1.2, H * 0.0022);
    rr(-lw / 2 + 1, -lh / 2 + 1, lw - 2, lh - 2, lh * 0.30);
    ctx.stroke();
    // weathering
    ctx.fillStyle = red ? PAPER : SEAM;
    for (var di = 0; di < segSpeck[i].length; di++) {
      var d = segSpeck[i][di];
      ctx.globalAlpha = red ? 0.5 : 0.28;
      ctx.beginPath();
      ctx.arc(d[0] * lw, d[1] * lh, d[2], 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
