<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.210 In Need of Love</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#070708; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.210 In Need of Love (Asia Ward). A small hunched creature of
// worn cloth and old-coat wool, one limb too long, glass eyes
// slightly mismatched, alone in a large dark field. It flinches.
// A hidden trust value runs everything: fast drags and hard taps
// startle it, trust drops, it hunches tighter; slow gentle drags
// across its back soothe it, trust rises, a warm blush blooms
// through the fabric, it uncurls and leans into the touch. At full
// trust it does its one trick, a soft jiggle of contentment, then
// settles. Nothing about the trust is ever shown; it is read only
// in the body. Double-tap deals another unsettling creature.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#070708';
var CLOTH_A = '#57504A', CLOTH_B = '#3E4A55', WOOL = '#4E3E35';
var EYE_A = '#C8D4DE', EYE_B = '#9FB8C4', BLUSH = '#C87E5E', STITCH = '#8A8074';
var W = 0, H = 0, phone = false;
var seed = 210210;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mixc(h1, h2, k) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], k)) + ',' + Math.round(lerp(a[1], b[1], k)) + ',' + Math.round(lerp(a[2], b[2], k)) + ')';
}
var T = 0, lastNow = -1;

// ---- the creature and its trust --------------------------------------------
var trust = 0.12;
var lean = 0, leanTgt = 0;
var recX = 0, recY = 0;      // recoil offset, springs home
var jiggleT = -10;           // contentment jiggle start
var jiggleDone = false;
var nextFlinch = 7;
var touching = false, gentleNow = false;
var variant = null;
function makeVariant(r) {
  return {
    longSide: r() < 0.5 ? -1 : 1,
    bigEye: r() < 0.5 ? 0 : 1,
    tilt: (r() - 0.5) * 0.14,
    hunchBias: 0.85 + r() * 0.3,
    swap: r() < 0.5
  };
}
variant = makeVariant(rand);
function fabrics() {
  var warm = trust * 0.62;
  return {
    a: mixc(variant.swap ? CLOTH_B : CLOTH_A, BLUSH, warm),
    b: mixc(variant.swap ? CLOTH_A : CLOTH_B, BLUSH, warm * 0.8),
    wool: mixc(WOOL, BLUSH, warm * 0.9)
  };
}

// ---- input ---------------------------------------------------------------------
var downT = 0, downX = 0, downY = 0, downMoved = 0;
var lastPX = 0, lastPY = 0, lastPt = 0, startledAt = -10;
var lastTapUp = -1000, tapStreak = 0;
function creatureGeom() {
  var s = H * (phone ? 0.30 : 0.35);
  return { cx: W / 2 + lean * s * 0.22 + recX, cy: H * 0.54 + recY, s: s };
}
canvas.addEventListener('pointerdown', function (e) {
  touching = true; gentleNow = false;
  downT = performance.now(); downX = lastPX = e.clientX; downY = lastPY = e.clientY;
  downMoved = 0; lastPt = downT;
});
canvas.addEventListener('pointermove', function (e) {
  if (!touching) return;
  var now = performance.now();
  var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var dt = Math.max(1, now - lastPt) / 1000;
  var v = dist / dt; // px per second
  downMoved += dist;
  lastPX = e.clientX; lastPY = e.clientY; lastPt = now;
  var g = creatureGeom();
  var dcx = e.clientX - g.cx, dcy = e.clientY - (g.cy - g.s * 0.2);
  var near = Math.sqrt(dcx * dcx + dcy * dcy) < g.s * 0.95;
  var vThresh = Math.min(W, H) * 1.05;
  if (!near) { gentleNow = false; return; }
  if (v > vThresh) {
    gentleNow = false;
    if (now / 1000 - startledAt > 0.45) {
      startledAt = now / 1000;
      trust = Math.max(0, trust - 0.15);
      jiggleDone = trust >= 0.98 ? jiggleDone : false;
      var a = Math.atan2(dcy, dcx);
      recX += -Math.cos(a) * g.s * 0.10;
      recY += -Math.sin(a) * g.s * 0.05 - g.s * 0.02;
    }
  } else if (dist > 0.5) {
    gentleNow = true;
    leanTgt = clamp(dcx / (g.s * 0.8), -1, 1);
  }
});
function endTouch(e) {
  if (!touching) return;
  touching = false; gentleNow = false;
  var now = performance.now();
  var quick = now - downT < 260 && downMoved < 14;
  if (quick) {
    var g = creatureGeom();
    var dcx = e.clientX - g.cx, dcy = e.clientY - (g.cy - g.s * 0.2);
    var near = Math.sqrt(dcx * dcx + dcy * dcy) < g.s * 1.1;
    if (now - lastTapUp < 330) {
      // double-tap: a new unsettling creature
      variant = makeVariant(rand);
      trust = 0.12; leanTgt = 0; jiggleDone = false; jiggleT = -10;
      lastTapUp = -1000;
      return;
    }
    lastTapUp = now;
    if (near) {
      // a hard little tap: startle
      trust = Math.max(0, trust - 0.15);
      var a = Math.atan2(dcy, dcx);
      recX += -Math.cos(a) * g.s * 0.09;
      recY += -Math.sin(a) * g.s * 0.05 - g.s * 0.025;
    }
  }
}
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', function () { touching = false; gentleNow = false; });

// ---- resize -----------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing ------------------------------------------------------------------------
function blob(cx, cy, rx, ry, rot, wob, fill, seam, u) {
  ctx.beginPath();
  for (var i = 0; i < 16; i++) {
    var a = i / 16 * 6.2832;
    var rr = 1 + Math.sin(a * 3 + cx * 0.02) * wob;
    var px = cx + Math.cos(a) * rx * rr, py = cy + Math.sin(a) * ry * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (seam) {
    ctx.strokeStyle = STITCH; ctx.lineWidth = Math.max(1, u * 0.9);
    ctx.setLineDash([u * 4, u * 3]); ctx.globalAlpha = 0.55; ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
}
function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) { dt = Math.min(0.05, (time - lastNow) / 1000); T += dt; }
  lastNow = time;
  if (dt > 0) {
    if (gentleNow) {
      trust = Math.min(1, trust + dt * 0.1);
    } else if (!touching) {
      trust = Math.max(0, trust - dt * 0.02);
      if (trust < 0.55) leanTgt *= Math.pow(0.4, dt);
    }
    if (trust >= 0.995 && !jiggleDone) { jiggleT = T; jiggleDone = true; }
    if (jiggleDone && trust < 0.6) jiggleDone = false;
    lean += (leanTgt - lean) * Math.min(1, dt * 2.2);
    recX *= Math.pow(0.001, dt); recY *= Math.pow(0.001, dt);
    if (trust < 0.3 && T > nextFlinch) {
      nextFlinch = T + 9 + Math.random() * 6;
      recX += (Math.random() - 0.5) * H * 0.012;
      recY -= H * 0.004;
    }
  }
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var g = creatureGeom();
  var s = g.s, u = s / 100;
  var F = fabrics();
  var curl = (1 - trust * 0.82) * variant.hunchBias; // 1 = tightest hunch
  var breathe = 1 + Math.sin(T * 1.15) * 0.014;
  var jig = (T - jiggleT < 1.8 && jiggleT > 0) ? Math.sin((T - jiggleT) * 22) * u * 1.6 * (1 - (T - jiggleT) / 1.8) : 0;
  var cx = g.cx + jig, cy = g.cy;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(variant.tilt * (0.4 + curl * 0.6));
  ctx.scale(breathe, breathe);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.ellipse(0, s * 0.40, s * 0.44, s * 0.06, 0, 0, 6.2832); ctx.fill();
  // the too-long limb, drooping to the ground on its side
  var ls = variant.longSide;
  ctx.strokeStyle = F.wool;
  ctx.lineCap = 'round';
  ctx.lineWidth = s * 0.085;
  ctx.beginPath();
  ctx.moveTo(ls * s * 0.20, -s * 0.05);
  ctx.quadraticCurveTo(ls * s * 0.52, s * 0.16, ls * s * 0.55, s * 0.40);
  ctx.stroke();
  // the short arm, tucked on the other side
  ctx.strokeStyle = F.b;
  ctx.lineWidth = s * 0.08;
  ctx.beginPath();
  ctx.moveTo(-ls * s * 0.22, -s * 0.02);
  ctx.quadraticCurveTo(-ls * s * 0.36, s * 0.10, -ls * s * 0.30, s * 0.24);
  ctx.stroke();
  // hunched back: the spine curls forward as trust falls
  blob(0, -s * 0.02, s * 0.40, s * (0.34 + curl * 0.05), 0, 0.045, F.a, true, u);
  // old-coat wool panel over one shoulder
  blob(-ls * s * 0.13, -s * 0.16 - curl * s * 0.03, s * 0.21, s * 0.16, 0.3, 0.05, F.wool, true, u);
  // second cloth panel low on the body
  blob(ls * s * 0.10, s * 0.14, s * 0.24, s * 0.15, -0.2, 0.05, F.b, true, u);
  // head, tucked down and forward, rising a little as trust grows
  var hx = s * 0.10, hy = -s * (0.16 + curl * 0.10) + (trust * s * 0.06);
  blob(hx, hy, s * 0.185, s * 0.165, 0, 0.05, F.b, true, u);
  // mismatched glass eyes: one bigger, the colours not quite a pair
  var eBig = variant.bigEye === 0 ? 0 : 1;
  var eyes = [
    { dx: -0.055, dy: -0.015, r: eBig === 0 ? 0.034 : 0.026, col: EYE_A },
    { dx: 0.065, dy: -0.03, r: eBig === 1 ? 0.034 : 0.026, col: EYE_B }
  ];
  for (var ei = 0; ei < 2; ei++) {
    var ex = hx + eyes[ei].dx * s, ey = hy + eyes[ei].dy * s, er = eyes[ei].r * s;
    var eg = ctx.createRadialGradient(ex - er * 0.4, ey - er * 0.45, er * 0.1, ex, ey, er);
    eg.addColorStop(0, '#FFFFFF'); eg.addColorStop(0.35, eyes[ei].col); eg.addColorStop(1, '#46525C');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(ex - er * 0.35, ey - er * 0.4, er * 0.22, 0, 6.2832); ctx.fill();
  }
  // soft blush pool on the back, only while it is soothed
  if (trust > 0.25) {
    var bg = ctx.createRadialGradient(-s * 0.05, -s * 0.18, s * 0.02, -s * 0.05, -s * 0.18, s * 0.34);
    bg.addColorStop(0, BLUSH); bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = (trust - 0.25) * 0.5;
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(-s * 0.05, -s * 0.18, s * 0.34, s * 0.26, 0, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
