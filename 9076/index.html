<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9076 · Quarter Turn</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#ece3cc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(74,62,42,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(236,227,204,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another quarter turn</div>
<script>
'use strict';
// No9076 Quarter Turn.
// A grid of truchet tiles, one rule per tile: two quarter-circle arcs
// joining the midpoints of neighboring edges. Each tile flips a seeded
// coin for which pair of corners its arcs use, and the flips chain
// across the grid into long accidental paths that enter one edge of
// the piece and leave by another. No path is designed; the piece is
// what the coin flips happen to connect. The flips are not fair by
// accident: the build measures the mix and keeps seeds where neither
// orientation takes more than about two thirds of the grid, because a
// lopsided mix collapses into stripes. A few tiles, seeded, draw their
// arcs in vermilion.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9076', 10) || 9076;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#ece3cc';
const INK = '#2a251e';
const VERM = '#b3402a';

function compose(s, cols, rows) {
  const rnd = mulberry32(s);
  const tiles = new Uint8Array(cols * rows);
  let ones = 0;
  for (let i = 0; i < tiles.length; i++) { tiles[i] = rnd() < 0.5 ? 0 : 1; ones += tiles[i]; }
  const mix = ones / tiles.length;
  return { tiles, cols, rows, mix, vermSeed: (s ^ 0x77aa19) >>> 0 };
}

function buildPiece(baseSeed, cols, rows) {
  let best = null, bestDist = 1;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0, cols, rows);
    const dist = Math.abs(p.mix - 0.5);
    if (dist < bestDist) { bestDist = dist; best = p; }
    if (p.mix > 0.36 && p.mix < 0.64) return p;
  }
  return best;
}

let piece = null, pieceKey = '';

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const cols = 13;
  const cell = RX / cols;
  const rows = Math.max(6, Math.round(RY / cell));
  const key = cols + 'x' + rows;
  if (!piece || pieceKey !== key) { piece = buildPiece(seed, cols, rows); pieceKey = key; }
  const p = piece;
  const vrnd = mulberry32(p.vermSeed);

  ctx.lineCap = 'round';
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const x = ox + i * cell, y = oy + j * cell;
      const cxm = x + cell / 2, top = y, bot = y + cell, lef = x, rig = x + cell, cym = y + cell / 2;
      const verm = vrnd() < 0.045;
      ctx.strokeStyle = verm ? VERM : INK;
      ctx.lineWidth = Math.max(1.2, cell * 0.13);
      ctx.beginPath();
      if (p.tiles[j * cols + i] === 0) {
        ctx.arc(x, y, cell / 2, 0, Math.PI / 2);            // top-left corner arc
        ctx.moveTo(rig, cym);
        ctx.arc(rig, bot, cell / 2, Math.PI, Math.PI * 1.5); // bottom-right
      } else {
        ctx.arc(rig, y, cell / 2, Math.PI / 2, Math.PI);    // top-right
        ctx.moveTo(x, cym);
        ctx.arc(x, bot, cell / 2, Math.PI * 1.5, Math.PI * 2); // bottom-left
      }
      ctx.stroke();
    }
  }
}

function redraw() { piece = null; draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
