<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexagon Ripple</title>
<style>
html, body { margin: 0; padding: 0; background: #0d0d0d; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var SQ3 = Math.sqrt(3);
var BG = [13, 13, 13];
var DIM = [74, 74, 74];
var BRIGHT = [242, 242, 242];
var GAP = 0.5;
var N_CENTERS = 48;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1557000);
var CENTERS = [];
for (var ci = 0; ci < N_CENTERS; ci++) {
  CENTERS.push([0.2 + 0.6 * rng(), 0.2 + 0.6 * rng()]);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, R = 24, SPEED = 300, lastT = 0, startT = null;
var dragRipple = null;
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function isPhone() {
  var minScreen = 1000000;
  if (typeof window !== 'undefined' && window.screen) {
    minScreen = Math.min(window.screen.width, window.screen.height);
  }
  if (minScreen < 700) return true;
  if (VW > 0 && VH > 0 && VH > VW * 1.15) return true;
  return false;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  R = Math.max(14, 0.032 * Math.min(VW, VH));
  SPEED = 0.30 * Math.max(VW, VH);
}
function maxDist(cx, cy) {
  var d1 = Math.sqrt(cx * cx + cy * cy);
  var d2 = Math.sqrt((VW - cx) * (VW - cx) + cy * cy);
  var d3 = Math.sqrt(cx * cx + (VH - cy) * (VH - cy));
  var d4 = Math.sqrt((VW - cx) * (VW - cx) + (VH - cy) * (VH - cy));
  return Math.max(d1, d2, d3, d4);
}
function autoRipple(t) {
  var T = 0, k = 0;
  while (k < 10000) {
    var c = CENTERS[k % N_CENTERS];
    var cx = c[0] * VW, cy = c[1] * VH;
    var life = (maxDist(cx, cy) + 3 * R) / SPEED;
    if (t < T + life + GAP) {
      var r = SPEED * (t - T);
      return { cx: cx, cy: cy, r: r, k: k, active: (t - T) <= life };
    }
    T += life + GAP;
    k++;
  }
  var c0 = CENTERS[0];
  return { cx: c0[0] * VW, cy: c0[1] * VH, r: 0, k: k, active: false };
}
function ringInfluence(x, y, ring) {
  if (!ring || !ring.active) return 0;
  var dx = x - ring.cx, dy = y - ring.cy;
  var d = Math.sqrt(dx * dx + dy * dy);
  var delta = d - ring.r;
  var sigma = 1.6 * R;
  var z = delta / sigma;
  return Math.exp(-0.5 * z * z);
}
function hexPath(cx, cy, r) {
  ctx.beginPath();
  for (var i = 0; i < 6; i++) {
    var a = (Math.PI / 3) * i;
    var px = cx + r * Math.cos(a);
    var py = cy + r * Math.sin(a);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function publishHook(auto, drag) {
  if (typeof window !== 'undefined') {
    window.__p1557 = {
      auto: { cx: auto.cx, cy: auto.cy, r: auto.r, k: auto.k, active: auto.active },
      drag: drag ? { cx: drag.cx, cy: drag.cy, t0: drag.t0 } : null,
      R: R, SPEED: SPEED, VW: VW, VH: VH, phone: isPhone()
    };
  }
}
function draw(t) {
  lastT = t;
  size();
  var auto = autoRipple(t);
  var drag = null;
  if (dragRipple) {
    var dr = SPEED * (t - dragRipple.t0);
    var dLife = (maxDist(dragRipple.cx, dragRipple.cy) + 3 * R) / SPEED;
    drag = { cx: dragRipple.cx, cy: dragRipple.cy, r: dr, active: (t - dragRipple.t0) <= dLife };
  }
  ctx.fillStyle = rgb(BG);
  ctx.fillRect(0, 0, VW, VH);
  var dx = 1.5 * R, dy = SQ3 * R;
  var baseW = Math.max(1, 0.045 * R);
  for (var col = 0; col * dx - R < VW + R; col++) {
    var x = col * dx;
    var yOff = (col % 2 === 1) ? dy / 2 : 0;
    for (var row = 0; row * dy - R + yOff < VH + R; row++) {
      var y = row * dy + yOff - R * 0.5;
      var inf = ringInfluence(x, y, auto);
      if (drag) {
        var di = ringInfluence(x, y, drag);
        if (di > inf) inf = di;
      }
      var rr = R * (1 + 0.30 * inf);
      var cr = Math.round(DIM[0] + (BRIGHT[0] - DIM[0]) * inf);
      var cg = Math.round(DIM[1] + (BRIGHT[1] - DIM[1]) * inf);
      var cb = Math.round(DIM[2] + (BRIGHT[2] - DIM[2]) * inf);
      ctx.strokeStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
      ctx.lineWidth = baseW * (1 + 1.2 * inf);
      hexPath(x, y, rr);
      ctx.stroke();
    }
  }
  publishHook(auto, dragRipple);
}
function onDown(e) {
  dragRipple = { t0: lastT, cx: e.clientX, cy: e.clientY };
  publishHook(autoRipple(lastT), dragRipple);
}
canvas.addEventListener('pointerdown', onDown);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
