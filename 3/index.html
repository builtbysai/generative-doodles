<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№3 · Desordres</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ead8; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(74,62,42,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(242,234,216,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another desordres</div>
<script>
'use strict';
// No3 Desordres.
// A homage to Vera Molnar's (Des)Ordres: a strict grid of squares on
// cream, and a single rule of subversion. Disorder grows across the
// grid from one corner to the other: near the calm corner each square
// sits almost exactly on its grid point, barely turned; by the far
// corner squares are rotated hard and shoved off their points by
// layered sine noise. Nothing else changes: same ink, same square,
// same grid. A few squares (a seeded 4 percent) are drawn in vermilion.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '3', 10) || 3;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f2ead8';
const INK = '#37322a';
const VERM = '#b3402a';

function compose(s, cols, rows) {
  const rnd = mulberry32(s);
  // Disorder direction: which diagonal it grows along.
  const flipX = rnd() < 0.5, flipY = rnd() < 0.5;
  const p1 = rnd() * Math.PI * 2, p2 = rnd() * Math.PI * 2;
  const verm = new Uint8Array(cols * rows);
  let vermCount = 0;
  const vrnd = mulberry32((s ^ 0x51f15e) >>> 0);
  for (let i = 0; i < verm.length; i++) { verm[i] = vrnd() < 0.04 ? 1 : 0; vermCount += verm[i]; }
  return { flipX, flipY, p1, p2, verm, vermShare: vermCount / verm.length, cols, rows, rndState: s };
}

function buildPiece(baseSeed, cols, rows) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0, cols, rows);
    if (!best) best = p;
    if (p.vermShare >= 0.015 && p.vermShare <= 0.07) return p;
  }
  return best;
}

let piece = null, pieceKey = '';

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Centered composition: the grid block keeps its proportions; the
  // page ground is the piece's cream on every screen.
  const S = Math.min(w, h);
  const cols = 12, rows = 12;
  const cell = S * 0.86 / cols;
  const gx = (w - cell * cols) / 2, gy = (h - cell * rows) / 2;

  const key = cols + 'x' + rows;
  if (!piece || pieceKey !== key) { piece = buildPiece(seed, cols, rows); pieceKey = key; }
  const p = piece;
  const jrnd = mulberry32((seed ^ 0x77aa19) >>> 0);
  const jit = new Float64Array(cols * rows * 3);
  for (let i = 0; i < jit.length; i++) jit[i] = jrnd() * 2 - 1;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);
  ctx.lineWidth = Math.max(1, cell / 26);

  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const idx = j * cols + i;
      const u = p.flipX ? 1 - i / (cols - 1) : i / (cols - 1);
      const v = p.flipY ? 1 - j / (rows - 1) : j / (rows - 1);
      const disorder = Math.pow((u + v) / 2, 1.9);          // 0 calm, 1 far corner
      const n = Math.sin(i * 1.7 + p.p1) * Math.sin(j * 1.3 + p.p2);
      const rot = (jit[idx * 3] * 0.9 + n * 0.35) * disorder * 0.62;   // up to ~36 deg
      const dx = jit[idx * 3 + 1] * disorder * cell * 0.26;
      const dy = jit[idx * 3 + 2] * disorder * cell * 0.26;
      const cxp = gx + (i + 0.5) * cell + dx;
      const cyp = gy + (j + 0.5) * cell + dy;
      const half = cell * 0.34;
      ctx.strokeStyle = p.verm[idx] ? VERM : INK;
      ctx.save();
      ctx.translate(cxp, cyp);
      ctx.rotate(rot);
      ctx.strokeRect(-half, -half, half * 2, half * 2);
      ctx.restore();
    }
  }
}

function redraw() { piece = null; draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
