<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero (Broken Symmetry), Study</title>
<style>
html, body { margin: 0; padding: 0; background: #9aa0a3; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#9aa0a3';
var PLATE = '#f2efe8';
var INK = '#1c1c22';
var BANDS = 24;
var SPREAD = 16;
/* Flat grey bands hold their calm. A microscopic tremble grows, a tear
   opens off-center, and the rupture spreads outward until the bands
   have bloomed into slow fluid color. Frame one is t = 0, performance
   0: perfectly flat bands, no tremble yet. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smoothstep(a, b, x) {
  var f = clamp((x - a) / (b - a), 0, 1);
  return f * f * (3 - 2 * f);
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(ix, iy, s) {
  var h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(s, 974634239);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  var a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s);
  var c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}
function fbm(x, y, s) {
  return vnoise(x, y, s) * 0.6 + vnoise(x * 2.13 + 7.7, y * 2.13 + 3.1, s + 11) * 0.28
    + vnoise(x * 4.31 + 13.3, y * 4.31 + 9.4, s + 23) * 0.12;
}
/* Eight fixed performances of the same score. Same laws, new
   trajectory: each entry sets its own rupture site (off-center),
   first-tear time, and flow seed. Performance 0 opens the piece. */
var PERFS = [
  { seed: 101, sx: 0.63, sy: 0.38, t0: 8.0 },
  { seed: 202, sx: 0.31, sy: 0.55, t0: 9.0 },
  { seed: 303, sx: 0.68, sy: 0.62, t0: 7.5 },
  { seed: 404, sx: 0.42, sy: 0.30, t0: 8.5 },
  { seed: 505, sx: 0.58, sy: 0.48, t0: 8.0 },
  { seed: 606, sx: 0.74, sy: 0.36, t0: 9.5 },
  { seed: 707, sx: 0.28, sy: 0.58, t0: 7.0 },
  { seed: 808, sx: 0.66, sy: 0.44, t0: 8.2 }
];
var PAL = [
  [214, 138, 58],
  [46, 138, 138],
  [206, 106, 84],
  [188, 148, 58],
  [126, 88, 128],
  [52, 98, 138]
];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
var perfIdx = 0;
var perfStart = 0;
var fadeEnd = -1;
function perf() { return PERFS[perfIdx]; }
/* Arrival time of the rupture front at a normalized point. The front
   leaves the seed point at t0 and travels outward at one unit of
   aspect-corrected distance per SPREAD seconds; a fixed noise term
   makes the front ragged, so the tear spreads unevenly instead of
   as a clean disc. */
function arrivalAt(nx, ny, p) {
  var dx = (nx - p.sx) * (VW / VH), dy = ny - p.sy;
  var d = Math.sqrt(dx * dx + dy * dy);
  return p.t0 + d * SPREAD + (fbm(nx * 3, ny * 3, p.seed + 77) - 0.5) * 6;
}
function ruptureAt(nx, ny, pt, p) {
  var tArr = arrivalAt(nx, ny, p);
  return smoothstep(tArr, tArr + 3, pt);
}
function trembleAt(nx, ny, pt, p) {
  var tArr = arrivalAt(nx, ny, p);
  var pre = clamp((pt - (tArr - 4)) / 4, 0, 1);
  var global = smoothstep(0, 8, pt) * 0.5;
  return Math.max(pre, global);
}
function fluidColor(wx, wy, pt, p) {
  var n1 = fbm(wx * 3.2 + pt * 0.008, wy * 3.2 - pt * 0.006, p.seed);
  var n2 = fbm(wx * 5.1 - pt * 0.005, wy * 4.3 + pt * 0.007, p.seed + 31);
  var pos = n1 * 5.999;
  var i = Math.floor(pos), f = pos - i;
  f = f * f * (3 - 2 * f);
  var a = PAL[i], b = PAL[(i + 1) % PAL.length];
  var bright = 0.85 + 0.3 * n2;
  return [
    Math.round(lerp(a[0], b[0], f) * bright),
    Math.round(lerp(a[1], b[1], f) * bright),
    Math.round(lerp(a[2], b[2], f) * bright)
  ];
}
function drawField(pt, p) {
  var bandH = VH / BANDS;
  var cell = Math.max(8, Math.min(VW, VH) / 96);
  var cols = Math.ceil(VW / cell), rows = Math.ceil(VH / cell);
  var x, y, nx, ny, u, pre, wy, wx, b, g, col, fc, r, gg, bb;
  for (y = 0; y < rows; y++) {
    for (x = 0; x < cols; x++) {
      nx = (x + 0.5) * cell / VW;
      ny = (y + 0.5) * cell / VH;
      u = ruptureAt(nx, ny, pt, p);
      if (u > 0.001) {
        pre = trembleAt(nx, ny, pt, p);
        wx = nx + (fbm(nx * 2.0 + 9.1, ny * 2.5, p.seed + 5) - 0.5) * 40 * u / VW;
        wy = ny + (fbm(nx * 2.5 + p.seed * 0.13, ny * 1.5, p.seed) - 0.5)
          * (6 * pre + 46 * u) / VH;
      } else {
        pre = trembleAt(nx, ny, pt, p);
        wx = nx;
        wy = ny + (fbm(nx * 2.5 + p.seed * 0.13, ny * 1.5, p.seed) - 0.5)
          * (6 * pre) / VH;
      }
      b = Math.max(0, Math.min(BANDS - 1, Math.floor(wy * BANDS)));
      g = 150 + 16 * Math.sin(b * 1.7 + 0.6) + 6 * Math.sin(b * 0.9);
      if (u > 0.001) {
        fc = fluidColor(wx, wy, pt, p);
        r = Math.round(lerp(g, fc[0], u));
        gg = Math.round(lerp(g + 3, fc[1], u));
        bb = Math.round(lerp(g + 6, fc[2], u));
      } else {
        r = Math.round(g); gg = Math.round(g + 3); bb = Math.round(g + 6);
      }
      ctx.fillStyle = 'rgb(' + r + ',' + gg + ',' + bb + ')';
      ctx.fillRect(x * cell, y * cell, cell + 0.5, cell + 0.5);
    }
  }
  /* Band boundary lines: faint while calm, trembling as the front
     approaches, gone once the rupture has passed. */
  var bi, sx, lx, ly, lw, alpha;
  ctx.lineWidth = 1;
  for (bi = 1; bi < BANDS; bi++) {
    var y0 = bi * bandH;
    ctx.beginPath();
    for (sx = 0; sx <= 60; sx++) {
      lx = sx / 60;
      ly = y0 + (vnoise(lx * 6, bi * 3.1, p.seed) - 0.5)
        * (2 + 10 * trembleAt(lx, bi / BANDS, pt, p));
      if (sx === 0) ctx.moveTo(lx * VW, ly); else ctx.lineTo(lx * VW, ly);
    }
    alpha = 0.14 * (1 - ruptureAt(0.5, bi / BANDS, pt, p));
    ctx.strokeStyle = 'rgba(40,42,46,' + alpha.toFixed(4) + ')';
    ctx.stroke();
  }
  /* The first tear: a short bright slit at the seed point, flashing
     as the rupture opens, then swallowed by the bloom. */
  if (pt >= p.t0 && pt <= p.t0 + 2.5) {
    var ta = Math.sin(Math.PI * (pt - p.t0) / 2.5) * 0.8;
    var rng = mulberry32(p.seed);
    var ang = rng() * TAU;
    var tx = p.sx * VW, ty = p.sy * VH;
    var tl = 0.06 * Math.min(VW, VH);
    ctx.beginPath();
    ctx.moveTo(tx - Math.cos(ang) * tl, ty - Math.sin(ang) * tl);
    ctx.lineTo(tx + Math.cos(ang) * tl, ty + Math.sin(ang) * tl);
    ctx.strokeStyle = 'rgba(255,240,210,' + ta.toFixed(4) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Zero (Broken Symmetry), Study').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Zero (Broken Symmetry), Study').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 31').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = 'rgba(28,28,34,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Zero (Broken Symmetry), Study', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = 'rgba(28,28,34,0.8)';
  ctx.fillText('2006 · 07 · 31', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap for a new performance.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = 'rgba(28,28,34,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = 'rgba(28,28,34,0.9)';
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var p = perf();
  var pt = t - perfStart;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawField(pt, p);
  if (fadeEnd >= 0 && t < fadeEnd) {
    var fa = clamp((fadeEnd - t) / 0.6, 0, 1) * 0.85;
    ctx.fillStyle = 'rgba(154,160,163,' + fa.toFixed(4) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    bandCount: function () { return BANDS; },
    seedCount: function () { return PERFS.length; },
    onset: function () { return perf().t0; },
    ruptureAt: function (nx, ny, pt) { return ruptureAt(nx, ny, pt, perf()); },
    performance: function () { return perfIdx; },
    setPerformance: function (i) {
      perfIdx = ((i % PERFS.length) + PERFS.length) % PERFS.length;
      perfStart = clockT;
      fadeEnd = clockT + 0.6;
    }
  };
}
function onTap() {
  perfIdx = (perfIdx + 1) % PERFS.length;
  perfStart = clockT;
  fadeEnd = clockT + 0.6;
}
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onTap);
}
/* ---- frame one: t = 0, performance 0, flat calm bands ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = 0, prevTs = null, t0 = null;
draw(0);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
