<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№48 · Halftone Print</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(26,26,26,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to stir</div>
<script>
'use strict';
// No48 Halftone Print (after darien.brito, prompt 13 via Bug).
// A live flow field of layered sines, every period an integer ratio
// of the 18 second loop so the seam closes exactly, rendered only
// as halftone dots on a fixed print grid: dot radius encodes field
// intensity. Ink on paper, two colors, nothing else. Drag stirs a
// vortex under the finger that decays in about three seconds.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '48', 10) || 48;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
const PAPER = '#f4f1ea', INK = '#1a1a1a', LOOP = 18;
let stir = null, stirAmp = 0;
function field(x, y, t){
  const ph = (t / LOOP) * Math.PI * 2;
  let v = 0;
  v += Math.sin(x * 2.6 + Math.sin(y * 3.4 + ph * 2) * 1.6 + ph * 1) * 0.35;
  v += Math.sin(y * 5.2 - Math.sin(x * 2.2 - ph * 3) * 1.3 - ph * 2) * 0.30;
  v += Math.sin(x * 1.5 - y * 7.8 + Math.sin(x * 4.0 + ph * 2) * 0.9 + ph * 3) * 0.40;
  v += Math.sin(x * 6.3 + y * 2.0 - ph * 4) * 0.20;
  v += Math.sin(Math.hypot(x - 0.5, y - 0.5) * 7.0 - ph * 3) * 0.18;
  return Math.max(0, Math.min(1, v + 0.5));
}
function drawFrame(nowMs){
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, w, h);
  const t = nowMs / 1000;
  stirAmp *= 0.94;
  let rx, ry, rw, rh;
  if (isPhone()){ rx = 0; ry = 0; rw = w; rh = h; }
  else { const s = Math.min(w, h) * 0.86; rx = (w - s) / 2; ry = (h - s) / 2; rw = s; rh = s; }
  const gap = Math.max(7, rw / 78);
  ctx.fillStyle = INK;
  for (let gy = ry + gap / 2; gy < ry + rh; gy += gap){
    for (let gx = rx + gap / 2; gx < rx + rw; gx += gap){
      const nx = (gx - rx) / rw, ny = (gy - ry) / rh;
      let v = field(nx, ny, t);
      if (stir && stirAmp > 0.02){
        const d = Math.hypot(gx - stir.x, gy - stir.y);
        const infl = Math.exp(-(d * d) / (2 * 90 * 90)) * stirAmp;
        v += Math.sin(d * 0.09 - t * 6) * infl * 0.7;
      }
      v = Math.max(0, Math.min(1, (v - 0.20) / 0.66));
      const r = Math.pow(v, 1.3) * gap * 0.50;
      if (r < 0.35) continue;
      ctx.beginPath(); ctx.arc(gx, gy, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); }
drawFrame(7000);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown', ev => { stir = { x: ev.clientX, y: ev.clientY }; stirAmp = 1; });
canvas.addEventListener('pointermove', ev => { if (stir){ stir = { x: ev.clientX, y: ev.clientY }; stirAmp = Math.min(1.4, stirAmp + 0.25); } });
function endDrag(){ stir = null; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
