<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plants Are Protected</title>
<style>
  html, body { margin: 0; padding: 0; background: #5a5e66; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1406000);

  // Round fading alphas to 4 decimals before stringifying (node-canvas quirk:
  // scientific-notation alphas like 2.5e-15 parse as opaque).
  function a4(x) {
    if (x < 0) x = 0; if (x > 1) x = 1;
    return Math.round(x * 10000) / 10000;
  }
  function rgba(r, g, b, a) {
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  var STORM = '#5a5e66', LEAF = '#2f6b3a', LEAF_DK = '#244f2c',
      LEAF_LT = '#3d8149', RAIN = '#b8c0c4', WIPER = '#1a1a18',
      CREAM = '#e8e2d4', GOLD = '#f5c542';

  // ---- Plants: seeded leaf systems, three depth layers, frame edge to edge ----
  // Each plant: center, layer, leaf count, leaf seeds. Leaves drawn as pointed
  // quadratic-curve shapes (no ellipse calls, per the node-canvas quirk).
  var plants = [];
  var layers = [
    { n: 26, smin: 0.45, smax: 0.75, col: LEAF_DK },   // back, small
    { n: 24, smin: 0.8, smax: 1.25, col: LEAF },       // mid
    { n: 18, smin: 1.3, smax: 2.0, col: LEAF_LT }      // front, large
  ];
  for (var L = 0; L < layers.length; L++) {
    var lay = layers[L];
    for (var i = 0; i < lay.n; i++) {
      var nl = 5 + Math.floor(rng() * 5);
      var leaves = [];
      for (var k = 0; k < nl; k++) {
        leaves.push({
          ang: rng() * Math.PI * 2,
          len: 26 + rng() * 46,
          wid: 10 + rng() * 14,
          ph: rng() * Math.PI * 2,
          fr: 0.7 + rng() * 0.9
        });
      }
      plants.push({
        x: rng(), y: rng(), // unit coords, scaled to canvas at draw time
        scale: lay.smin + rng() * (lay.smax - lay.smin),
        col: lay.col,
        leaves: leaves,
        ph: rng() * Math.PI * 2
      });
    }
  }

  // ---- Rain: seeded streaks, visibility gated by the storm envelope ----
  var drops = [];
  for (var d = 0; d < 240; d++) {
    drops.push({
      x: rng(), y: rng(),
      sp: 420 + rng() * 520,   // px/s fall speed
      len: 12 + rng() * 26,
      thr: rng()               // drawn only when intensity exceeds this
    });
  }

  // ---- Throat captions: the prompt's own short felt-sound phrases ----
  // Material text drifting like weather, never a subtitle strip.
  var phrases = [
    { text: 'rain beats against the exterior', y: 0.16, sp: 14, x0: 0.10 },
    { text: 'vibration in the throat', y: 0.38, sp: 19, x0: 0.55 },
    { text: 'hum felt in the chest', y: 0.62, sp: 11, x0: 0.30 },
    { text: 'tongue pressed to the roof of the mouth', y: 0.84, sp: 16, x0: 0.12 }
  ];

  // ---- Storm envelope: closed-form 48 s cycle ----
  // Shake -> gyrate -> settle, then breathe again. Bump is continuous at wrap.
  function storm(t) {
    var u = (t % 48) / 48;
    var bump = Math.exp(-Math.pow((u - 0.5) / 0.25, 2));
    return {
      rain: 0.30 + 0.65 * bump,          // rain intensity 0.30..0.95
      sway: 0.30 + 0.75 * bump,          // sway amplitude 0.30..1.05
      freq: 0.8 + 1.2 * bump,            // sway speed multiplier
      gold: 0.10 * bump                  // slow thunder-gold wash, never a flash
    };
  }

  // ---- Drag: parts the leaves, nearby plants sing harder ----
  // Recorded samples decay closed-form; nothing is frame-integrated.
  var drags = []; // {x, y, t}
  var dragging = false, lastX = 0, lastY = 0;
  function pos(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  function onDown(e) {
    dragging = true;
    var p = pos(e); lastX = p.x; lastY = p.y;
    drags.push({ x: p.x, y: p.y, t: now() });
    if (drags.length > 200) drags.splice(0, drags.length - 200);
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pos(e);
    lastX = p.x; lastY = p.y;
    drags.push({ x: p.x, y: p.y, t: now() });
    if (drags.length > 200) drags.splice(0, drags.length - 200);
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: true });
  canvas.addEventListener('touchmove', onMove, { passive: true });
  canvas.addEventListener('touchend', onUp);

  // Drag field at a point: push vector (parting) + gain (singing harder).
  function dragField(px, py, t) {
    var gx = 0, gy = 0, gain = 0;
    for (var k = 0; k < drags.length; k++) {
      var s = drags[k];
      var age = t - s.t;
      if (age < 0) age = 0;
      if (age > 5) continue;
      var w = Math.exp(-age / 2.2);
      var dx = px - s.x, dy = py - s.y;
      var d2 = dx * dx + dy * dy;
      var fall = Math.exp(-d2 / (130 * 130));
      if (fall < 0.01) continue;
      var dist = Math.sqrt(d2) + 1;
      var push = 55 * w * fall;
      gx += (dx / dist) * push;
      gy += (dy / dist) * push;
      gain += 1.4 * w * fall;
    }
    // Cap total parting displacement so a dense drag path cannot shove
    // leaves clean out of the region (a channel, not a void).
    var mag = Math.sqrt(gx * gx + gy * gy);
    if (mag > 60) { gx = gx / mag * 60; gy = gy / mag * 60; }
    if (gain > 1.6) gain = 1.6;
    return { x: gx, y: gy, gain: gain };
  }

  // ---- Viewport ----
  var W = 0, H = 0;
  function resize() {
    var vv = (typeof window.visualViewport !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = Math.round(w); canvas.height = Math.round(h);
    draw(0);
  }
  if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  function isPhone() {
    var s = window.screen;
    if (s) {
      var mn = Math.min(s.width, s.height);
      if (mn < 700) return true;
    }
    return H > W * 1.15;
  }

  // Time handling: boot flag — frame one is draw(0); clock starts with rAF.
  var startTime = 0, booted = false;
  function now() {
    if (!booted) return 0;
    return (performance.now() - startTime) / 1000;
  }

  function drawLeaf(cx, cy, leaf, swayAng, S, col) {
    var a = leaf.ang + swayAng;
    var len = leaf.len * S, wid = leaf.wid * S;
    var tx = cx + Math.cos(a) * len, ty = cy + Math.sin(a) * len;
    var nx = -Math.sin(a), ny = Math.cos(a);
    var mx = cx + Math.cos(a) * len * 0.5 + nx * wid,
        my = cy + Math.sin(a) * len * 0.5 + ny * wid;
    var mx2 = cx + Math.cos(a) * len * 0.5 - nx * wid,
        my2 = cy + Math.sin(a) * len * 0.5 - ny * wid;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(mx, my, tx, ty);
    ctx.quadraticCurveTo(mx2, my2, cx, cy);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
  }

  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var S = Math.min(W, H) / 900;
    // Field-like composition goes full-bleed on phones.
    if (isPhone()) { S = Math.max(W, H) / 900; }

    var st = storm(t);

    // Storm-gray ground.
    ctx.fillStyle = STORM;
    ctx.fillRect(0, 0, W, H);

    // Plants: leaves fill the frame edge to edge, camera low among them.
    for (var p = 0; p < plants.length; p++) {
      var pl = plants[p];
      var cx = pl.x * W, cy = pl.y * H;
      var df = dragField(cx, cy, t);
      cx += df.x; cy += df.y;
      var amp = st.sway * (1 + df.gain);
      var sc = pl.scale * S;
      for (var k = 0; k < pl.leaves.length; k++) {
        var lf = pl.leaves[k];
        var swayAng = Math.sin(t * st.freq * lf.fr + lf.ph + pl.ph) * 0.28 * amp;
        drawLeaf(cx, cy, lf, swayAng, sc, pl.col);
      }
    }

    // Rain streaks, count gated by the storm envelope.
    ctx.lineWidth = Math.max(1, S * 1.5);
    ctx.strokeStyle = rgba(184, 192, 196, 0.55);
    ctx.beginPath();
    for (var d = 0; d < drops.length; d++) {
      var dr = drops[d];
      if (dr.thr > st.rain) continue;
      var x = ((dr.x * (W + 60) + t * 22) % (W + 60)) - 30;
      var y = ((dr.y * (H + 120) + t * dr.sp) % (H + 120)) - 60;
      // Right-edge wiper zone reads clearer: streaks there are fainter.
      var zone = (x > W - 120);
      ctx.moveTo(x, y);
      ctx.lineTo(x - 4, y + dr.len * S);
      if (zone) { /* drawn with the same stroke; cleared by the blade pass below */ }
    }
    ctx.stroke();
    // Faint cleared band at the right edge where the wiper works.
    ctx.fillStyle = rgba(26, 26, 24, 0.18);
    ctx.fillRect(W - 120, 0, 120, H);

    // Wiper: steady rhythm, a dark blade sweeping from the bottom-right pivot.
    var wper = 2.4;
    // Blade sweeps the up-left arc from the bottom-right pivot, staying in frame.
    var wang = -Math.PI + 0.25 + (0.5 + 0.5 * Math.sin(t * Math.PI * 2 / wper)) * 1.1;
    var px = W - 60, py = H;
    var bl = H * 0.72;
    var bx = px + Math.cos(wang) * bl, by = py + Math.sin(wang) * bl;
    ctx.strokeStyle = WIPER;
    ctx.lineWidth = Math.max(6, S * 9);
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(bx, by);
    ctx.stroke();
    // Pivot dot as a filled rect (no arc batching quirks).
    ctx.fillStyle = WIPER;
    var ps = Math.max(8, S * 12);
    ctx.fillRect(px - ps / 2, py - ps / 2, ps, ps);

    // Slow thunder-gold wash breathing with the storm, never a flash.
    if (st.gold > 0.005) {
      ctx.fillStyle = rgba(245, 197, 66, st.gold);
      ctx.fillRect(0, 0, W, H);
    }

    // Throat captions: material text drifting like weather, never a strip.
    var fs = Math.max(15, Math.round(Math.min(W, H) * 0.032));
    ctx.font = fs + 'px sans-serif';
    ctx.textBaseline = 'middle';
    for (var c = 0; c < phrases.length; c++) {
      var ph = phrases[c];
      var tw = ctx.measureText(ph.text).width;
      var span = W + tw + 400;
      var off = W + 200 - ph.x0 * W;
      var x = W + 200 - ((off + t * ph.sp) % span);
      var y = ph.y * H;
      ctx.fillStyle = rgba(232, 226, 212, 0.88);
      ctx.fillText(ph.text, x, y);
    }

    // Grain: seeded dots keyed by quantized time (0.5 s quantum).
    var q = Math.floor(t * 2);
    var grng = mulberry32(1406000 + q * 7919);
    ctx.fillStyle = rgba(232, 230, 220, 0.05);
    for (var g = 0; g < 140; g++) {
      var gx = grng() * W, gy = grng() * H;
      ctx.fillRect(gx, gy, 2, 2);
    }
  }

  resize();
  draw(0);

  function loop(ts) {
    if (!booted) { booted = true; startTime = ts; }
    draw(now());
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
