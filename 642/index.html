<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La Pendiente</title>
<style>
  html, body { margin: 0; padding: 0; background: #EFE7D3; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// La Pendiente: the 45 degree slope rule as an interactive instrument.
// Drag the handle on the steep segment to steepen or flatten the slope.
// Below 45 degrees the plate is calm ink on paper. At or above 45 degrees
// the regime flips: amber inner border, amber slope face, piolet and
// crampon line glyphs pinned to the face. Double-tap reseeds the mountain.

var PAPER = '#EFE7D3';
var INK = '#1B2430';
var GRAY = '#8A8F96';
var AMBER = '#E8A33D';
var GEAR = '#3A4E6B';

var BASE_SEED = 64231;
var FLIP_ANGLE = 45;

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var q = '';
try { q = (typeof location !== 'undefined' && location.search) || ''; } catch (e) { q = ''; }
var FORCED_FLIP = q.indexOf('flip') >= 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var state = {
  reseedCount: 0,
  seed: BASE_SEED,
  theta: FORCED_FLIP ? 57 : 30, // slope angle in degrees (the steepness parameter s)
  lastTapAt: -10000,
  lastTapX: 0,
  lastTapY: 0,
  drag: null
};

var view = { w: 0, h: 0, phone: false };
var layout = null;   // frame geometry
var profile = null;  // seeded ridge data for current seed (independent of theta)

function buildProfile(seed) {
  var rnd = mulberry32(seed);
  var p = {
    u0: 0.36 + rnd() * 0.14,          // steep segment start (fraction of inner width)
    uLen: 0.17 + rnd() * 0.07,        // steep segment length (fraction)
    leftH: 0.10 + rnd() * 0.07,       // ridge height at left edge (fraction of frame height)
    b0H: 0.21 + rnd() * 0.09,         // ridge height at steep base (fraction)
    rightH: 0.08 + rnd() * 0.08,      // ridge height at right edge (fraction)
    wobA1: 1.1 + rnd() * 0.7,
    wobF1: 9 + rnd() * 5,
    wobP1: rnd() * Math.PI * 2,
    wobA2: 0.6 + rnd() * 0.5,
    wobF2: 23 + rnd() * 9,
    wobP2: rnd() * Math.PI * 2
  };
  p.u1 = p.u0 + p.uLen;
  return p;
}

function smoothstep(x) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  return x * x * (3 - 2 * x);
}

function computeLayout() {
  var w = view.w, h = view.h;
  var fw, fh;
  if (view.phone) {
    fw = w * 0.86;
    fh = h * 0.52;
  } else {
    fw = Math.min(w * 0.68, 880);
    fh = Math.min(h * 0.64, 620);
  }
  layout = {
    fx: (w - fw) / 2,
    fy: (h - fh) / 2,
    fw: fw,
    fh: fh,
    pad: Math.max(14, fw * 0.035)
  };
}

// Geometry of the ridge for the current seed, theta and layout.
// Returns sampled points plus the steep segment endpoints. Pure function.
function ridgeGeometry() {
  var L = layout, p = profile;
  var x0 = L.fx + L.pad, x1 = L.fx + L.fw - L.pad;
  var innerW = x1 - x0;
  var baseY = L.fy + L.fh * 0.90;

  var b0x = x0 + p.u0 * innerW;
  var b1x = x0 + p.u1 * innerW;
  var runPx = b1x - b0x;
  var b0h = p.b0H * L.fh;

  // Cap the rise so the summit stays inside the frame; thetaMax follows.
  var maxRise = 0.80 * L.fh - b0h;
  var thetaMax = Math.min(68, Math.atan2(maxRise, runPx) * 180 / Math.PI);
  var theta = Math.max(12, Math.min(state.theta, thetaMax));
  var rise = Math.tan(theta * Math.PI / 180) * runPx;
  var b0y = baseY - b0h;
  var b1y = b0y - rise;
  var measured = Math.atan2(b0y - b1y, b1x - b0x) * 180 / Math.PI;

  var leftH = p.leftH * L.fh, rightH = p.rightH * L.fh;
  var N = 180;
  var pts = [];
  for (var i = 0; i <= N; i++) {
    var u = i / N;
    var x = x0 + u * innerW;
    var hgt, mask;
    if (u <= p.u0) {
      hgt = leftH + (b0h - leftH) * smoothstep(u / p.u0);
      mask = smoothstep(Math.min(1, (p.u0 - u) / 0.05));
    } else if (u >= p.u1) {
      hgt = (b0h + rise) + (rightH - (b0h + rise)) * smoothstep((u - p.u1) / (1 - p.u1));
      mask = smoothstep(Math.min(1, (u - p.u1) / 0.05));
    } else {
      var t = (u - p.u0) / p.uLen;
      hgt = b0h + rise * t;
      mask = 0;
    }
    var wob = (p.wobA1 * Math.sin(u * p.wobF1 + p.wobP1) +
               p.wobA2 * Math.sin(u * p.wobF2 + p.wobP2)) * mask;
    pts.push({ x: x, y: baseY - hgt + wob });
  }
  return {
    pts: pts, baseY: baseY, x0: x0, x1: x1,
    b0: { x: b0x, y: b0y }, b1: { x: b1x, y: b1y },
    theta: measured, thetaMax: thetaMax,
    handle: { x: (b0x + b1x) / 2, y: (b0y + b1y) / 2 }
  };
}

function drawPiolet(cx, cy, s) {
  ctx.strokeStyle = GEAR;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  // shaft
  ctx.moveTo(cx - 8 * s, cy + 15 * s);
  ctx.lineTo(cx + 5 * s, cy - 11 * s);
  // spike below shaft foot
  ctx.moveTo(cx - 8 * s, cy + 15 * s);
  ctx.lineTo(cx - 10 * s, cy + 19 * s);
  // head bar
  ctx.moveTo(cx - 3 * s, cy - 13 * s);
  ctx.lineTo(cx + 10 * s, cy - 13 * s);
  // adze tick
  ctx.moveTo(cx - 3 * s, cy - 13 * s);
  ctx.lineTo(cx - 7 * s, cy - 9 * s);
  ctx.stroke();
  // pick arc
  ctx.beginPath();
  ctx.moveTo(cx + 10 * s, cy - 13 * s);
  ctx.quadraticCurveTo(cx + 16 * s, cy - 11 * s, cx + 15 * s, cy - 3 * s);
  ctx.stroke();
}

function drawCrampon(cx, cy, s) {
  ctx.strokeStyle = GEAR;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  // frame: rounded rectangle
  var w = 15 * s, h = 4.5 * s, r = 3 * s;
  ctx.beginPath();
  ctx.moveTo(cx - w + r, cy - h);
  ctx.lineTo(cx + w - r, cy - h);
  ctx.quadraticCurveTo(cx + w, cy - h, cx + w, cy - h + r);
  ctx.lineTo(cx + w, cy + h - r);
  ctx.quadraticCurveTo(cx + w, cy + h, cx + w - r, cy + h);
  ctx.lineTo(cx - w + r, cy + h);
  ctx.quadraticCurveTo(cx - w, cy + h, cx - w, cy + h - r);
  ctx.lineTo(cx - w, cy - h + r);
  ctx.quadraticCurveTo(cx - w, cy - h, cx - w + r, cy - h);
  ctx.stroke();
  // straps
  ctx.beginPath();
  ctx.moveTo(cx - 9 * s, cy - h);
  ctx.lineTo(cx - 6 * s, cy - h - 6 * s);
  ctx.moveTo(cx + 9 * s, cy - h);
  ctx.lineTo(cx + 6 * s, cy - h - 6 * s);
  ctx.stroke();
  // spike ticks
  ctx.beginPath();
  var spikes = [-12, -6, 0, 6, 12];
  for (var i = 0; i < spikes.length; i++) {
    ctx.moveTo(cx + spikes[i] * s, cy + h);
    ctx.lineTo(cx + spikes[i] * s, cy + h + 6 * s);
  }
  ctx.stroke();
}

function draw(t) {
  var w = view.w, h = view.h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  var L = layout;
  var g = ridgeGeometry();
  var flipped = g.theta >= FLIP_ANGLE - 1e-9;

  // breathing: sub-pixel sway, zero at t = 0 so frame one is exact
  var sway = Math.sin(t * 0.45) * 0.6;

  // paper
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.translate(0, sway);

  // clip to frame interior
  ctx.beginPath();
  ctx.rect(L.fx + 3, L.fy + 3, L.fw - 6, L.fh - 6);
  ctx.clip();

  // amber slope face (flipped state only)
  if (flipped) {
    ctx.fillStyle = AMBER;
    ctx.beginPath();
    ctx.moveTo(g.b0.x, g.b0.y);
    ctx.lineTo(g.b1.x, g.b1.y);
    ctx.lineTo(g.b1.x, g.baseY + 4);
    ctx.lineTo(g.b0.x, g.baseY + 4);
    ctx.closePath();
    ctx.fill();
  }

  // threshold line: exactly 45 degrees, through the steep base, clipped
  ctx.strokeStyle = GRAY;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1;
  ctx.beginPath();
  var ext = L.fw + L.fh;
  ctx.moveTo(g.b0.x - ext * 0.5, g.b0.y + ext * 0.5);
  ctx.lineTo(g.b0.x + ext * 0.5, g.b0.y - ext * 0.5);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // ridgeline
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (var i = 0; i < g.pts.length; i++) {
    if (i === 0) ctx.moveTo(g.pts[i].x, g.pts[i].y);
    else ctx.lineTo(g.pts[i].x, g.pts[i].y);
  }
  ctx.stroke();

  // gear glyphs pinned to the steep face (flipped state only)
  if (flipped) {
    var th = g.theta * Math.PI / 180;
    var nx = Math.sin(th), ny = Math.cos(th); // downhill normal of the face
    var gs = Math.max(0.8, Math.min(1.15, L.fw / 760));
    var p1x = g.b0.x + (g.b1.x - g.b0.x) * 0.30 + nx * 20;
    var p1y = g.b0.y + (g.b1.y - g.b0.y) * 0.30 + ny * 20;
    var p2x = g.b0.x + (g.b1.x - g.b0.x) * 0.70 + nx * 22;
    var p2y = g.b0.y + (g.b1.y - g.b0.y) * 0.70 + ny * 22;
    drawPiolet(p1x, p1y, gs);
    drawCrampon(p2x, p2y, gs);
  }

  ctx.restore();

  // handle on the slope
  ctx.save();
  ctx.translate(0, sway);
  ctx.beginPath();
  ctx.arc(g.handle.x, g.handle.y, 9, 0, Math.PI * 2);
  ctx.fillStyle = PAPER;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(g.handle.x - 4.5, g.handle.y);
  ctx.lineTo(g.handle.x + 4.5, g.handle.y);
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  // borders: outer ink frame; inner border gray when calm, amber when flipped
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.5;
  ctx.strokeRect(L.fx, L.fy, L.fw, L.fh);
  if (flipped) {
    ctx.strokeStyle = AMBER;
    ctx.lineWidth = 3;
  } else {
    ctx.strokeStyle = GRAY;
    ctx.lineWidth = 1;
  }
  ctx.strokeRect(L.fx + 7, L.fy + 7, L.fw - 14, L.fh - 14);
}

function resize() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) || null;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  view.w = w;
  view.h = h;
  var sw = (typeof window !== 'undefined' && window.screen) ? Math.min(window.screen.width, window.screen.height) : Math.min(w, h);
  view.phone = sw < 700 || h > w * 1.15;
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  computeLayout();
  draw(currentT);
}

var currentT = 0;
var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;

function frame(now) {
  var t = ((typeof now === 'number' ? now : t0) - t0) / 1000;
  currentT = t;
  draw(t);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}

function eventPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function onDown(e) {
  var pos = eventPos(e);
  var g = ridgeGeometry();
  var dx = pos.x - g.handle.x, dy = pos.y - g.handle.y;
  if (dx * dx + dy * dy <= 28 * 28) {
    var th = g.theta * Math.PI / 180;
    state.drag = {
      startX: pos.x, startY: pos.y,
      startTheta: state.theta,
      ux: Math.cos(th), uy: -Math.sin(th),
      runPx: g.b1.x - g.b0.x
    };
  } else {
    state.drag = null;
  }
  state.downAt = currentT;
  state.downX = pos.x;
  state.downY = pos.y;
  if (e.preventDefault) e.preventDefault();
}

function onMove(e) {
  if (!state.drag) return;
  var pos = eventPos(e);
  var d = state.drag;
  var along = (pos.x - d.startX) * d.ux + (pos.y - d.startY) * d.uy;
  var next = d.startTheta + along * (26 / Math.max(40, d.runPx));
  state.theta = Math.max(12, Math.min(68, next));
  draw(currentT);
  if (e.preventDefault) e.preventDefault();
}

function onUp(e) {
  var wasDrag = !!state.drag;
  state.drag = null;
  var pos = { x: state.downX, y: state.downY };
  try { pos = eventPos(e); } catch (err) {}
  var moved = Math.abs(pos.x - state.downX) + Math.abs(pos.y - state.downY);
  var quick = (currentT - (state.downAt || 0)) < 0.35;
  if (!wasDrag && quick && moved < 8) {
    var nowMs = currentT * 1000;
    if (nowMs - state.lastTapAt < 350) {
      // double-tap: reseed
      state.reseedCount += 1;
      state.seed = BASE_SEED + state.reseedCount * 7919;
      profile = buildProfile(state.seed);
      state.theta = 30;
      state.lastTapAt = -10000;
      draw(currentT);
    } else {
      state.lastTapAt = nowMs;
    }
  }
}

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('resize', resize);
}

profile = buildProfile(state.seed);
resize();
draw(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
</script>
</body>
</html>
