<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.237 Shadows Variable</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EFE8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.237 Shadows Variable (James Woodfill). After the Crossing
// Signals works of 2022, whose catalog captions read "(shadows
// variable)": flat wood tone panels, bars, triangles and one disc,
// drift and turn slowly on a pale wall while two fixed warm lamps
// off frame throw long hard shadows down and to the right. The
// shadows lag the panels by a beat and a half and stretch as a
// panel nears its lamp, so the shadow layer is a second artwork
// trailing the first. The lamps never move; the world does.
// Watch only, nothing to touch.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var WALL = '#F2EFE8';
var SHADOW = 'rgba(74,68,56,0.55)';
var W = 0, H = 0, phone = false;
var T = 23, lastNow = -1; // frame one: mid drift, shadows already thrown and lagging

// Panel space is 800 x 1000 units (4:5). Two lamps sit off frame,
// up and to the left; both throw shadows to the lower right.
var LAMPS = [ { x: -320, y: -300 }, { x: -140, y: -560 } ];

// kind: 0 bar, 1 triangle, 2 disc. Drift and rotation are slow
// sines with periods between 40 and 90 seconds.
var PANELS = [
  { kind:0, w:300, h:44,  col:'#D9B98A', bx:300, by:320, ax:26, ay:18, px:61, py:83, ph:0.4, ba:12,  ra:22, rp:74, rh:0.0 },
  { kind:0, w:240, h:36,  col:'#B8B8B8', bx:520, by:470, ax:20, ay:26, px:77, py:53, ph:2.1, ba:-18, ra:28, rp:67, rh:1.3 },
  { kind:1, s:130,        col:'#D9B98A', bx:250, by:600, ax:18, ay:22, px:89, py:71, ph:4.0, ba:40,  ra:30, rp:81, rh:2.2 },
  { kind:2, r:70,         col:'#FAFAFA', bx:560, by:680, ax:24, ay:16, px:57, py:79, ph:1.1, ba:0,   ra:0,  rp:90, rh:0.0 },
  { kind:0, w:200, h:30,  col:'#FAFAFA', bx:430, by:230, ax:16, ay:20, px:67, py:59, ph:5.2, ba:65,  ra:20, rp:49, rh:3.1 },
  { kind:1, s:100,        col:'#B8B8B8', bx:610, by:350, ax:22, ay:18, px:73, py:87, ph:3.3, ba:-70, ra:26, rp:63, rh:0.7 },
  { kind:0, w:170, h:40,  col:'#E8632B', bx:350, by:790, ax:28, ay:14, px:83, py:67, ph:2.8, ba:24,  ra:18, rp:71, rh:4.4 },
  { kind:1, s:84,         col:'#FAFAFA', bx:180, by:430, ax:14, ay:24, px:59, py:77, ph:0.9, ba:110, ra:32, rp:55, rh:5.0 },
  { kind:0, w:150, h:26,  col:'#D9B98A', bx:640, by:820, ax:18, ay:20, px:79, py:61, ph:4.7, ba:-35, ra:24, rp:69, rh:1.9 }
];

function posAt(p, t) {
  return {
    x: p.bx + p.ax * Math.sin(2 * Math.PI * t / p.px + p.ph),
    y: p.by + p.ay * Math.sin(2 * Math.PI * t / p.py + p.ph * 1.7)
  };
}
function angAt(p, t) {
  return (p.ba + p.ra * Math.sin(2 * Math.PI * t / p.rp + p.rh)) * Math.PI / 180;
}
function localPts(p) {
  if (p.kind === 0) {
    var hw = p.w / 2, hh = p.h / 2;
    return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
  }
  if (p.kind === 1) {
    var s = p.s;
    return [[0, -s * 0.62], [s * 0.58, s * 0.42], [-s * 0.58, s * 0.42]];
  }
  return null; // disc
}

// Shadow state per panel: a critically damped follow of the panel
// pose, seeded a beat and a half in the past so the lag is real
// from the first frame.
var lag = PANELS.map(function (p) {
  var q = posAt(p, T - 1.5);
  return { x: q.x, y: q.y, vx: 0, vy: 0, a: angAt(p, T - 1.5), va: 0 };
});
function stepLag(dt) {
  var om = 3.4; // omega; zeta 1, settles in about a second and a half
  for (var i = 0; i < PANELS.length; i++) {
    var p = PANELS[i], L = lag[i];
    var q = posAt(p, T), ta = angAt(p, T);
    L.vx += (om * om * (q.x - L.x) - 2 * om * L.vx) * dt;
    L.vy += (om * om * (q.y - L.y) - 2 * om * L.vy) * dt;
    L.x += L.vx * dt; L.y += L.vy * dt;
    var da = ta - L.a;
    L.va += (om * om * da - 2 * om * L.va) * dt;
    L.a += L.va * dt;
  }
}

function panelRect() {
  var pw = Math.min(W * 0.96, H * 0.94 * 0.8);
  var ph = pw * 1.25;
  if (ph > H * 0.94) { ph = H * 0.94; pw = ph * 0.8; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, s: pw / 800 };
}

function worldPts(p, cx, cy, ang, scale) {
  var pts = localPts(p), out = [];
  var ca = Math.cos(ang), sa = Math.sin(ang);
  for (var i = 0; i < pts.length; i++) {
    var lx = pts[i][0] * scale, ly = pts[i][1] * scale;
    out.push([cx + lx * ca - ly * sa, cy + lx * sa + ly * ca]);
  }
  return out;
}
function trace(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}

function draw() {
  ctx.fillStyle = WALL;
  ctx.fillRect(0, 0, W, H);
  var r = panelRect(), s = r.s;
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.scale(s, s);
  // Shadow layer first: for each panel, one skewed, dilated copy
  // per lamp, offset along the lamp vector with magnitude 1/dist.
  ctx.fillStyle = SHADOW;
  for (var i = 0; i < PANELS.length; i++) {
    var p = PANELS[i], L = lag[i];
    for (var j = 0; j < LAMPS.length; j++) {
      var dx = L.x - LAMPS[j].x, dy = L.y - LAMPS[j].y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var mag = 150000 / d;
      var ox = dx / d * mag, oy = dy / d * mag;
      var dil = 1 + 90 / d;
      if (p.kind === 2) {
        ctx.beginPath();
        ctx.arc(L.x + ox, L.y + oy, p.r * dil, 0, Math.PI * 2);
        ctx.fill();
      } else {
        trace(worldPts(p, L.x + ox, L.y + oy, L.a, dil));
        ctx.fill();
      }
    }
  }
  // Panels flat on top, no shading, no gradients.
  for (var k = 0; k < PANELS.length; k++) {
    var q = PANELS[k], pos = posAt(q, T), ang = angAt(q, T);
    ctx.fillStyle = q.col;
    if (q.kind === 2) {
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, q.r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      trace(worldPts(q, pos.x, pos.y, ang, 1));
      ctx.fill();
    }
  }
  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  if (dt > 0) stepLag(dt);
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
