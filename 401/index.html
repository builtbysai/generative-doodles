<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.401 Hair River</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2A81D; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.401 Hair River (nina-clausonet).
// After Nina Clausonet's flowing-hair-as-current
// mechanism: her white-haired muse in profile, closed
// eyes, turquoise dress, on a textured golden ground.
// Her white hair leaves her head as a broad river-band
// crossing the full frame, and riding the current are
// exactly three teal birds, eight golden leaves and ten
// small white petals. A flat stepped sunburst sits
// behind her head. WATCH-ONLY: no interaction at all,
// a pure 30s seamless loop - sprites complete whole
// traversals of their bezier flow curves, birds flap on
// a 0.75s two-frame cycle, leaves tumble and the hair
// edges ripple on periods that divide the loop. Grain
// is fixed speckle data (900 static + 200 drifting
// dots, alpha 0.06-0.12), never a texture. The only
// lettering is her script signature, drawn as
// hand-lettered stroke paths in deep red at the bottom
// right (the designed-text exception for this piece).
// Palette closed at the specced hexes, used flat or at
// flat alpha steps. One canvas, no offscreen canvas,
// no gradients, no filters, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GOLD = '#F2A81D', TEAL = '#1FA3A3', HAIR = '#FFFFFF';
var BIRD = '#1899A8', LEAF1 = '#F5C13B', LEAF2 = '#E08A2E';
var SKIN = '#D97B3F', SIG = '#8C2F28';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30;
if (LOOP !== 30) throw new Error('Hair River loop must be 30s');
var TICK = 1 / 60;
var TAU = Math.PI * 2;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-looking
// value is baked from this at load and never changes
// between frames or renders.
var seed = 401;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- small draw helpers --------------------------------
function circ(x, y, r, col, a) {
  ctx.globalAlpha = (a === undefined ? 1 : a);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function ell(x, y, rx, ry, col, rot, a) {
  ctx.globalAlpha = (a === undefined ? 1 : a);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function poly(pts, col, a) {
  ctx.globalAlpha = (a === undefined ? 1 : a);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function line(x1, y1, x2, y2, w, col, a) {
  ctx.globalAlpha = (a === undefined ? 1 : a);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- flow curves ---------------------------------------
// Four bezier flow curves carry the sprites; the hair
// band itself is the filled region between a top and a
// bottom edge curve. All curves run from the head (left)
// past the right edge of the design space.
function cubicAt(p, t) {
  var u = 1 - t;
  return [
    u * u * u * p[0] + 3 * u * u * t * p[2] + 3 * u * t * t * p[4] + t * t * t * p[6],
    u * u * u * p[1] + 3 * u * u * t * p[3] + 3 * u * t * t * p[5] + t * t * t * p[7]
  ];
}
function sampleCurve(p, n) {
  var out = [], i;
  for (i = 0; i <= n; i++) out.push(cubicAt(p, i / n));
  return out;
}
function arcTable(p) {
  var pts = sampleCurve(p, 240), cum = [0], i;
  for (i = 1; i < pts.length; i++) {
    var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
    cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
  }
  return { pts: pts, cum: cum, total: cum[cum.length - 1] };
}
function posAt(tab, u) {
  var d = u * tab.total, lo = 0, hi = tab.cum.length - 1;
  while (lo < hi - 1) { var mid = (lo + hi) >> 1; if (tab.cum[mid] <= d) lo = mid; else hi = mid; }
  var seg = tab.cum[hi] - tab.cum[lo] || 1, f = (d - tab.cum[lo]) / seg;
  var a = tab.pts[lo], b = tab.pts[hi];
  return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, ang: Math.atan2(b[1] - a[1], b[0] - a[0]) };
}
var CURVE_DEF = [
  [370, 318, 640, 268, 950, 330, 1315, 285],
  [375, 378, 650, 338, 955, 392, 1315, 352],
  [375, 438, 660, 408, 960, 452, 1315, 420],
  [380, 492, 670, 470, 965, 508, 1315, 482]
];
if (CURVE_DEF.length < 3 || CURVE_DEF.length > 5) throw new Error('Hair River needs 3-5 flow curves');
var CURVES = CURVE_DEF.map(arcTable);
var TOP_DEF = [352, 282, 630, 232, 950, 292, 1315, 248];
var BOT_DEF = [352, 548, 665, 516, 965, 556, 1315, 540];
var TOP_S = sampleCurve(TOP_DEF, 64), BOT_S = sampleCurve(BOT_DEF, 64);
function edgeY(samples, x) {
  var i;
  for (i = 1; i < samples.length; i++) {
    if (samples[i][0] >= x || i === samples.length - 1) {
      var a = samples[i - 1], b = samples[i], dx = (b[0] - a[0]) || 1;
      return a[1] + (b[1] - a[1]) * ((x - a[0]) / dx);
    }
  }
  return samples[samples.length - 1][1];
}
function insideBand(x, y) {
  if (x < 352 || x > 1315) return false;
  return y >= edgeY(TOP_S, x) - 4 && y <= edgeY(BOT_S, x) + 4;
}

// ---- sprites -------------------------------------------
// Exactly 3 birds, 8 leaves, 10 petals. Each sprite
// completes a whole number of traversals per 30s loop,
// so every rider is home again at the wrap.
var SPRITES = [];
function addSprite(kind, curve, trav, off, extra) {
  var s = { kind: kind, curve: curve, trav: trav, off: off };
  if (extra) for (var k in extra) s[k] = extra[k];
  SPRITES.push(s);
}
addSprite('bird', 0, 1, 0.14, {});
addSprite('bird', 1, 1, 0.58, {});
addSprite('bird', 2, 2, 0.55, {});
addSprite('leaf', 0, 2, 0.52, { col: LEAF1, tp: 6, dir: 1 });
addSprite('leaf', 1, 1, 0.22, { col: LEAF2, tp: 7.5, dir: -1 });
addSprite('leaf', 2, 1, 0.74, { col: LEAF1, tp: 5, dir: 1 });
addSprite('leaf', 3, 2, 0.08, { col: LEAF2, tp: 10, dir: -1 });
addSprite('leaf', 0, 1, 0.86, { col: LEAF2, tp: 7.5, dir: 1 });
addSprite('leaf', 1, 2, 0.80, { col: LEAF1, tp: 6, dir: -1 });
addSprite('leaf', 3, 1, 0.44, { col: LEAF1, tp: 10, dir: 1 });
addSprite('leaf', 2, 2, 0.05, { col: LEAF2, tp: 5, dir: -1 });
addSprite('petal', 0, 1, 0.34, { rp: 10 });
addSprite('petal', 1, 2, 0.12, { rp: 15 });
addSprite('petal', 2, 1, 0.52, { rp: 6 });
addSprite('petal', 3, 1, 0.66, { rp: 10 });
addSprite('petal', 0, 2, 0.70, { rp: 15 });
addSprite('petal', 1, 1, 0.40, { rp: 6 });
addSprite('petal', 2, 2, 0.88, { rp: 10 });
addSprite('petal', 3, 2, 0.26, { rp: 15 });
addSprite('petal', 1, 1, 0.90, { rp: 10 });
addSprite('petal', 3, 1, 0.90, { rp: 6 });
var N_BIRD = SPRITES.filter(function (s) { return s.kind === 'bird'; }).length;
var N_LEAF = SPRITES.filter(function (s) { return s.kind === 'leaf'; }).length;
var N_PETAL = SPRITES.filter(function (s) { return s.kind === 'petal'; }).length;
if (N_BIRD !== 3) throw new Error('Hair River needs exactly 3 birds');
if (N_LEAF !== 8) throw new Error('Hair River needs exactly 8 leaves');
if (N_PETAL !== 10) throw new Error('Hair River needs exactly 10 petals');
SPRITES.forEach(function (s) {
  if (LOOP / s.trav !== LOOP / s.trav || (LOOP * s.trav) % LOOP !== 0) throw new Error('sprite traversal must be whole');
  if (s.tp && LOOP % s.tp !== 0 && (LOOP / s.tp) % 1 !== 0) throw new Error('tumble period must divide the loop');
  if (s.rp && LOOP % s.rp !== 0) throw new Error('petal period must divide the loop');
});

// ---- grain ---------------------------------------------
// 900 static speckle dots + 200 slow-drifting dots,
// baked from the seeded LCG at flat alpha steps
// (0.06-0.12). Dots landing inside the hair band are
// tinted warm (skin / ground at flat alpha), which is
// the hair's light grain; the rest cycle the palette.
// Drifting dots wander on small circular paths whose
// periods divide the loop, so they are home at the wrap.
var GRAIN_COLS = [HAIR, SIG, SKIN, LEAF1];
var GRAIN_ALPHAS = [0.06, 0.09, 0.12];
var STATIC_GRAIN = [], DRIFT_GRAIN = [];
(function () {
  var i, x, y;
  for (i = 0; i < 900; i++) {
    x = rnd() * DW; y = rnd() * DH;
    var inB = insideBand(x, y) || (x < 430 && y > 250 && y < 560);
    STATIC_GRAIN.push({
      x: x, y: y, r: 0.8 + rnd() * 1.1,
      col: inB ? (i % 2 ? SKIN : GOLD) : GRAIN_COLS[Math.floor(rnd() * 4)],
      a: inB ? 0.10 + (i % 2) * 0.02 : GRAIN_ALPHAS[Math.floor(rnd() * 3)]
    });
  }
  for (i = 0; i < 200; i++) {
    DRIFT_GRAIN.push({
      x: rnd() * DW, y: rnd() * DH, r: 0.8 + rnd() * 1.0,
      col: GRAIN_COLS[Math.floor(rnd() * 4)],
      a: GRAIN_ALPHAS[Math.floor(rnd() * 3)],
      per: [10, 15, 30][Math.floor(rnd() * 3)],
      amp: 6 + rnd() * 10, ph: rnd() * TAU
    });
  }
})();
if (STATIC_GRAIN.length !== 900) throw new Error('Hair River needs exactly 900 static grain dots');
if (DRIFT_GRAIN.length !== 200) throw new Error('Hair River needs exactly 200 drifting grain dots');
DRIFT_GRAIN.forEach(function (g) { if (LOOP % g.per !== 0) throw new Error('drift period must divide the loop'); });

// ---- sunburst ------------------------------------------
// Flat stepped rays behind the head: 24 wedges in two
// alternating flat alpha steps of leaf-gold over the
// ground, a flat disc and a ring. No gradient.
function drawSunburst() {
  var cx = 330, cy = 392, i, R = 470;
  for (i = 0; i < 24; i++) {
    var a0 = (i / 24) * TAU, a1 = ((i + 1) / 24) * TAU;
    ctx.globalAlpha = i % 2 ? 0.16 : 0.30;
    ctx.fillStyle = LEAF1;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a0, a1);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
  circ(cx, cy, 168, LEAF1, 0.5);
  circ(cx, cy, 128, LEAF1, 0.35);
}

// ---- hair river ----------------------------------------
// The band is redrawn each frame from sampled edge
// points; each edge ripples on a 6s period (5 whole
// cycles per loop), phase stepped along the edge, so
// the surface moves like slow water and the wrap is
// seamless.
var RIP_P = 6;
if (LOOP % RIP_P !== 0) throw new Error('ripple period must divide the loop');
function drawHairBand(t) {
  var n = 28, i, pts = [], top = sampleCurve(TOP_DEF, n), bot = sampleCurve(BOT_DEF, n);
  for (i = 0; i <= n; i++) {
    var f = i / n;
    pts.push([top[i][0], top[i][1] + 6 * Math.sin(TAU * (t / RIP_P) + i * 0.5) * (0.3 + 0.7 * f)]);
  }
  for (i = n; i >= 0; i--) {
    pts.push([bot[i][0], bot[i][1] + 8 * Math.sin(TAU * (t / RIP_P) + i * 0.5 + 1.7)]);
  }
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}

// ---- muse ----------------------------------------------
// Profile head, facing right: forehead, a small nose
// bump, lips, chin, then the jaw back to the neck. The
// white hair cap covers the top and back of the head
// and falls to the shoulder, merging into the river.
// The teal dress is a simple flared bust shape with
// three fold strokes.
function drawDress() {
  ctx.fillStyle = TEAL;
  ctx.beginPath();
  ctx.moveTo(258, 512);
  ctx.quadraticCurveTo(300, 486, 332, 484);
  ctx.quadraticCurveTo(372, 486, 410, 512);
  ctx.quadraticCurveTo(452, 620, 488, 900);
  ctx.lineTo(168, 900);
  ctx.quadraticCurveTo(206, 640, 258, 512);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = BIRD; ctx.globalAlpha = 0.30; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(300, 560); ctx.quadraticCurveTo(316, 700, 300, 880); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(352, 552); ctx.quadraticCurveTo(372, 700, 366, 880); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(262, 580); ctx.quadraticCurveTo(258, 720, 268, 880); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawHead() {
  // neck
  ctx.fillStyle = SKIN;
  ctx.fillRect(306, 452, 44, 58);
  // face silhouette
  ctx.beginPath();
  ctx.moveTo(330, 297);
  ctx.bezierCurveTo(385, 297, 414, 330, 416, 372);
  ctx.bezierCurveTo(417, 388, 425, 397, 425, 405);
  ctx.bezierCurveTo(425, 411, 417, 413, 415, 419);
  ctx.bezierCurveTo(419, 429, 419, 435, 414, 441);
  ctx.bezierCurveTo(418, 453, 414, 467, 404, 479);
  ctx.bezierCurveTo(388, 497, 356, 506, 330, 504);
  ctx.bezierCurveTo(285, 501, 244, 462, 242, 402);
  ctx.bezierCurveTo(240, 340, 278, 297, 330, 297);
  ctx.closePath(); ctx.fill();
  // hair cap: top and back of the head, falling behind
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.moveTo(402, 336);
  ctx.bezierCurveTo(388, 292, 330, 270, 278, 288);
  ctx.bezierCurveTo(234, 303, 218, 352, 224, 402);
  ctx.bezierCurveTo(229, 448, 250, 492, 292, 514);
  ctx.bezierCurveTo(322, 529, 356, 524, 378, 500);
  ctx.bezierCurveTo(336, 486, 302, 446, 296, 396);
  ctx.bezierCurveTo(292, 356, 306, 334, 336, 324);
  ctx.bezierCurveTo(364, 316, 390, 320, 402, 336);
  ctx.closePath(); ctx.fill();
  // closed eye, serene cap arc + two lash ticks
  ctx.strokeStyle = SIG; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(368, 400, 12, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(359, 405); ctx.lineTo(355, 410); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(377, 405); ctx.lineTo(381, 410); ctx.stroke();
  // lips: a small quiet curve
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(404, 436, 5.5, Math.PI * 0.15, Math.PI * 0.95); ctx.stroke();
}

// ---- sprites drawn -------------------------------------
function drawBird(x, y, ang, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang * 0.6);
  var flap = Math.floor(t / 0.375) % 2 === 0;
  poly([[-13, -1], [-27, -8], [-25, 4], [-14, 4]], BIRD);      // tail
  ell(0, 0, 17, 10.5, BIRD);                                    // body
  circ(14, -7, 8.5, BIRD);                                      // head
  poly([[20, -8.5], [29, -5.5], [20, -3]], LEAF2);             // beak
  circ(16, -8, 1.7, LEAF1);                                     // eye
  ctx.save();                                                   // wing, 2-frame flap
  ctx.translate(-2, -4);
  ctx.rotate(flap ? -0.75 : 0.45);
  ell(-4, -5, 12, 5, BIRD);
  ctx.restore();
  ctx.restore();
}
function drawLeafSprite(x, y, s, t) {
  var rot = s.dir * TAU * (t / s.tp);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ell(0, 0, 13, 6, s.col);
  line(-11, 0, 11, 0, 1.6, s.col === LEAF1 ? LEAF2 : LEAF1, 0.85);
  line(11, 0, 16, -2, 1.6, s.col, 1);
  ctx.restore();
}
function drawPetal(x, y, s, t) {
  var rot = TAU * (t / s.rp) + s.off * TAU;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ell(0, 0, 7.5, 4.5, HAIR);
  circ(0, 0, 1.8, LEAF1);
  ctx.restore();
}
function drawSprites(t) {
  var i;
  for (i = 0; i < SPRITES.length; i++) {
    var s = SPRITES[i];
    var u = (s.off + s.trav * (t / LOOP)) % 1;
    var p = posAt(CURVES[s.curve], u);
    var bob = 4 * Math.sin(TAU * (t / RIP_P) + p.x * 0.005);
    if (s.kind === 'bird') drawBird(p.x, p.y + bob, p.ang, t);
    else if (s.kind === 'leaf') drawLeafSprite(p.x, p.y + bob, s, t);
    else drawPetal(p.x, p.y + bob, s, t);
  }
}

// ---- signature ------------------------------------------
// Hand-lettered script stroke paths (the word reads as
// her flowing "nina" signature flourish), stroked in
// deep red, bottom right. No font text anywhere.
var SIG_STROKES = [
  [[2, 46], [5, 28], [8, 19], [13, 16], [17, 20], [18, 30], [21, 19], [25, 17], [28, 24], [29, 40], [33, 44]],
  [[42, 46], [44, 30], [46, 21], [49, 28], [51, 46]],
  [[60, 46], [63, 28], [66, 19], [71, 16], [75, 20], [76, 30], [79, 19], [83, 17], [86, 24], [87, 40], [91, 44]],
  [[112, 21], [103, 17], [96, 23], [95, 34], [99, 44], [106, 46], [112, 40], [114, 28], [114, 20]],
  [[114, 20], [116, 36], [120, 46], [127, 43]]
];
function strokePath(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length - 1; i++) {
    var mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
  ctx.stroke();
}
function drawSignature() {
  ctx.save();
  ctx.translate(1028, 788);
  ctx.scale(1.18, 1.18);
  ctx.strokeStyle = SIG; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.92; ctx.lineWidth = 3;
  SIG_STROKES.forEach(strokePath);
  circ(45, 9, 2.6, SIG, 0.92);   // the i dot
  ctx.globalAlpha = 0.65; ctx.lineWidth = 2;
  strokePath([[2, 55], [40, 61], [88, 58], [128, 50]]);
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---- grain drawn ---------------------------------------
function drawGrain(t) {
  var i, g;
  for (i = 0; i < STATIC_GRAIN.length; i++) {
    g = STATIC_GRAIN[i];
    circ(g.x, g.y, g.r, g.col, g.a);
  }
  for (i = 0; i < DRIFT_GRAIN.length; i++) {
    g = DRIFT_GRAIN[i];
    var ph = TAU * (t / g.per) + g.ph;
    circ(g.x + g.amp * Math.cos(ph), g.y + g.amp * 0.6 * Math.sin(ph), g.r, g.col, g.a);
  }
}

function draw(t) {
  ctx.fillStyle = GOLD;
  ctx.fillRect(0, 0, DW, DH);
  drawSunburst();
  drawHairBand(t);
  drawDress();
  drawHead();
  drawSprites(t);
  drawGrain(t);
  drawSignature();
}

// ---- clock and frame -----------------------------------
// Determinism: frame one is drawn synchronously at the
// constant phase T0 (river mid-flow, sprites spread
// along their curves), and the animation clock advances
// from that anchor in fixed 1/60 ticks accumulated from
// rAF timestamps. Frame one never reads a wall clock.
var T0 = 11.0;
var T = T0;
var lastNow = -1, acc = 0;
function step() { /* watch-only: state lives in the clock */ }

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Cover fit: the field fills the viewport at any aspect.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  // On phones the cover crop would cut the muse (she sits
  // in the left third) out of the frame entirely, so the
  // crop window anchors to design x=100 instead of the
  // centre: head and dress stay in frame, the river still
  // flows off the right edge.
  if (phone && DW * S > W) OX = Math.max(W - DW * S, -100 * S);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
