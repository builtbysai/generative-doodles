<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Multispecies Square</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F0D0B8; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  var PHASE0 = 1.5;
  var SKY = '#F0D0B8', CREAM = '#E8DCC8', IVY = '#3E7C3F';
  var GREEN_FAR = '#7AC86A', GREEN_MID = '#5FAE4E', GREEN_NEAR = '#4A8C3A';
  var PATH = '#D8C89A', GOOSE = '#F5F2E8', BILL = '#E08030', PIG = '#E8A898';

  function frameRect() {
    if (PHONE) return { x: 0, y: 0, w: W, h: H };
    var ar = 4 / 3, fw, fh;
    if (W / H > ar) { fh = H; fw = H * ar; } else { fw = W; fh = W / ar; }
    return { x: (W - fw) / 2, y: (H - fh) / 2, w: fw, h: fh };
  }

  function ell(x, y, rx, ry, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(rx, ry);
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  function ellStroke(x, y, rx, ry, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(rx, ry);
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  function rect(x, y, w, h) { ctx.fillRect(x, y, w, h); }
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

  // Drag disturbance state. No drag has happened at load, so frame one is
  // exactly the undisturbed scene and thumbs are deterministic.
  var dragX = 0, dragY = 0, dragT = -100, dragging = false;
  function pointerPos(e) {
    var r = { left: 0, top: 0 };
    if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function onDown(e) {
    var p = pointerPos(e); dragX = p.x; dragY = p.y; dragging = true;
    disturb(p.x, p.y);
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pointerPos(e); dragX = p.x; dragY = p.y;
    disturb(p.x, p.y);
  }
  function onUp() { dragging = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // Cubic bezier path, curving from bottom-right up to the tree side.
  var PA = [0.94, 0.93], PB = [0.88, 0.82], PC = [0.60, 0.70], PD = [0.34, 0.55];
  function pathPoint(u, lat) {
    var v = 1 - u;
    var x = v*v*v*PA[0] + 3*v*v*u*PB[0] + 3*v*u*u*PC[0] + u*u*u*PD[0];
    var y = v*v*v*PA[1] + 3*v*v*u*PB[1] + 3*v*u*u*PC[1] + u*u*u*PD[1];
    return { x: x, y: y + (lat || 0) };
  }
  function tri(t, speed) {
    var c = (t * speed) % 2;
    return c < 1 ? c : 2 - c;
  }

  // Geese: waypoint loops, one per goose, fixed phases.
  var GEESE = [
    { pts: [[0.42, 0.60], [0.55, 0.66], [0.50, 0.74], [0.38, 0.70]], speed: 26, ph: 0.0, s: 1.00, scat: 0, scatX: 0, scatY: 0, scatT: -100 },
    { pts: [[0.55, 0.82], [0.72, 0.88], [0.68, 0.95], [0.50, 0.90]], speed: 32, ph: 0.3, s: 1.35, scat: 0, scatX: 0, scatY: 0, scatT: -100 },
    { pts: [[0.30, 0.48], [0.42, 0.52], [0.38, 0.58], [0.26, 0.54]], speed: 24, ph: 0.85, s: 0.70, scat: 0, scatX: 0, scatY: 0, scatT: -100 },
    { pts: [[0.80, 0.80], [0.88, 0.86], [0.82, 0.93], [0.72, 0.87]], speed: 30, ph: 0.15, s: 1.20, scat: 0, scatX: 0, scatY: 0, scatT: -100 }
  ];
  function goosePos(g, t, F) {
    var n = g.pts.length;
    var cyc = ((t / g.speed) + g.ph) % 1;
    var seg = Math.min(n - 1, Math.floor(cyc * n));
    var f = (cyc * n) - seg;
    var a = g.pts[seg], b = g.pts[(seg + 1) % n];
    var x = (a[0] + (b[0] - a[0]) * f) * F.w + F.x;
    var y = (a[1] + (b[1] - a[1]) * f) * F.h + F.y;
    var dir = (b[0] >= a[0]) ? 1 : -1;
    var decay = Math.exp(-Math.max(0, t - g.scatT) * 1.2);
    x += g.scatX * decay; y += g.scatY * decay;
    return { x: x, y: y, dir: dir };
  }
  function disturb(px, py) {
    // Geese near the fingertip scatter away and resettle on their waypoints.
    for (var i = 0; i < GEESE.length; i++) {
      var g = GEESE[i];
      var p = goosePos(g, lastT, lastF);
      var dx = p.x - px, dy = p.y - py;
      var d = Math.sqrt(dx * dx + dy * dy);
      var R = 0.20 * lastF.w;
      if (d < R && d > 1) {
        var k = (1 - d / R) * 0.09 * lastF.w;
        g.scatX = dx / d * k; g.scatY = dy / d * k * 0.6; g.scatT = lastT;
      }
    }
    dragT = lastT;
  }
  var lastT = PHASE0, lastF = { x: 0, y: 0, w: 100, h: 100 };

  var ASCALE = 1;
  function drawGoose(x, y, s, dir, t, ph) {
    var u = s * ASCALE;
    var waddle = Math.sin(t * 5 + ph * 9) * 0.10;
    var step = Math.sin(t * 7 + ph * 9);
    var peck = 0;
    var gate = ((t * 0.23 + ph) % 1);
    if (gate < 0.35) peck = Math.sin(gate / 0.35 * Math.PI) * 0.9;
    ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1); ctx.rotate(waddle);
    ctx.fillStyle = GOOSE;
    ell(0, 0, 26 * u, 15 * u, 0);
    ctx.fillStyle = '#D8D2C0';
    ell(-2 * u, 10 * u, 20 * u, 6 * u, 0);
    // neck and head, dipping when pecking
    ctx.strokeStyle = GOOSE; ctx.lineWidth = 9 * u; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(18 * u, -6 * u);
    ctx.quadraticCurveTo(30 * u, -16 * u, 30 * u, -26 * u + peck * 18 * u);
    ctx.stroke();
    ctx.fillStyle = GOOSE; circle(30 * u, -28 * u + peck * 18 * u, 8 * u);
    ctx.fillStyle = BILL;
    ell(38 * u, -27 * u + peck * 18 * u, 6 * u, 3 * u, 0);
    ctx.fillStyle = '#222222'; circle(32 * u, -30 * u + peck * 18 * u, 1.6 * u);
    // legs, alternating steps
    ctx.strokeStyle = BILL; ctx.lineWidth = 3 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8 * u, 12 * u); ctx.lineTo(-8 * u + step * 4 * u, 22 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8 * u, 12 * u); ctx.lineTo(8 * u - step * 4 * u, 22 * u); ctx.stroke();
    ctx.restore();
  }

  function drawPiglet(x, y, s, dir, t) {
    var u = s * ASCALE;
    var trot = Math.sin(t * 9);
    ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
    ctx.fillStyle = PIG;
    ell(0, 0, 24 * u, 16 * u, 0);
    circle(24 * u, -4 * u, 13 * u);
    ell(18 * u, -15 * u, 5 * u, 8 * u, -0.3);
    ell(30 * u, -15 * u, 5 * u, 8 * u, 0.3);
    ctx.fillStyle = '#D88A80';
    ell(36 * u, -2 * u, 6 * u, 5 * u, 0);
    ctx.fillStyle = '#7A4A44';
    circle(34 * u, -2 * u, 1.2 * u); circle(38 * u, -2 * u, 1.2 * u);
    ctx.fillStyle = '#222222'; circle(26 * u, -7 * u, 1.6 * u);
    ctx.strokeStyle = PIG; ctx.lineWidth = 3 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-14 * u, 12 * u); ctx.lineTo(-14 * u + trot * 5 * u, 22 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4 * u, 13 * u); ctx.lineTo(-4 * u - trot * 5 * u, 23 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12 * u, 12 * u); ctx.lineTo(12 * u - trot * 5 * u, 22 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(20 * u, 13 * u); ctx.lineTo(20 * u + trot * 5 * u, 23 * u); ctx.stroke();
    ctx.strokeStyle = '#D88A80'; ctx.lineWidth = 2.5 * u;
    ctx.beginPath(); ctx.arc(-24 * u, -2 * u, 5 * u, 0, Math.PI * 1.5); ctx.stroke();
    ctx.restore();
  }

  function drawStiltKid(x, y, s, t, ph, coat, skin) {
    var u = s * ASCALE;
    var bob = Math.sin(t * 2.2 + ph) * 3 * u;
    var sway = Math.sin(t * 1.4 + ph) * 0.06;
    ctx.save(); ctx.translate(x, y + bob); ctx.rotate(sway);
    ctx.strokeStyle = '#6E4A2A'; ctx.lineWidth = 4 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10 * u, 0); ctx.lineTo(-10 * u, 44 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10 * u, 0); ctx.lineTo(10 * u, 44 * u); ctx.stroke();
    ctx.fillStyle = coat;
    rect(-13 * u, -34 * u, 26 * u, 32 * u);
    ctx.fillStyle = skin; circle(0, -42 * u, 10 * u);
    ctx.fillStyle = '#222222'; circle(3 * u, -44 * u, 1.6 * u);
    ctx.fillStyle = '#3A2E24';
    ell(0, -52 * u, 11 * u, 5 * u, 0);
    ctx.strokeStyle = skin; ctx.lineWidth = 5 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-12 * u, -28 * u); ctx.lineTo(-24 * u, -18 * u + Math.sin(t * 2.2 + ph) * 3 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12 * u, -28 * u); ctx.lineTo(24 * u, -18 * u - Math.sin(t * 2.2 + ph) * 3 * u); ctx.stroke();
    ctx.restore();
  }

  function drawJogger(x, y, s, dir, t) {
    var u = s * ASCALE;
    var run = Math.sin(t * 8);
    ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1); ctx.rotate(0.12);
    ctx.strokeStyle = '#2A2E38'; ctx.lineWidth = 5 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -10 * u); ctx.lineTo(-10 * u + run * 6 * u, 22 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -10 * u); ctx.lineTo(12 * u - run * 6 * u, 20 * u); ctx.stroke();
    ctx.fillStyle = '#C84A3A'; rect(-11 * u, -36 * u, 22 * u, 26 * u);
    ctx.fillStyle = '#E8C8A8'; circle(0, -44 * u, 9 * u);
    ctx.fillStyle = '#2A2E38'; ell(0, -52 * u, 10 * u, 4 * u, 0);
    ctx.strokeStyle = '#E8C8A8'; ctx.lineWidth = 4 * u;
    ctx.beginPath(); ctx.moveTo(-10 * u, -30 * u); ctx.lineTo(-20 * u, -18 * u - run * 4 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10 * u, -30 * u); ctx.lineTo(20 * u, -18 * u + run * 4 * u); ctx.stroke();
    ctx.restore();
  }

  function drawGrandmother(x, y, s, t, ph, shawl, dress) {
    var u = s * ASCALE;
    var sway = Math.sin(t * 0.8 + ph) * 0.04;
    ctx.save(); ctx.translate(x, y); ctx.rotate(sway);
    ctx.fillStyle = dress; rect(-14 * u, -30 * u, 28 * u, 30 * u);
    ctx.fillStyle = shawl; ell(0, -28 * u, 16 * u, 10 * u, 0);
    ctx.fillStyle = '#E8C8A8'; circle(0, -40 * u, 9 * u);
    ctx.fillStyle = '#C8C8C8'; ell(0, -47 * u, 10 * u, 5 * u, 0);
    ctx.restore();
  }

  function drawBuildings(F) {
    var bx = [0.00, 0.25, 0.50, 0.75];
    var bh = [0.26, 0.30, 0.24, 0.28];
    var tops = [0.04, 0.02, 0.05, 0.03];
    for (var b = 0; b < 4; b++) {
      var x0 = F.x + bx[b] * F.w, w0 = 0.25 * F.w;
      var yTop = F.y + tops[b] * F.h, yBot = F.y + (tops[b] + bh[b]) * F.h;
      ctx.fillStyle = CREAM; rect(x0, yTop, w0, yBot - yTop);
      ctx.fillStyle = '#6E6250';
      ctx.beginPath();
      ctx.moveTo(x0, yTop); ctx.lineTo(x0 + w0 * 0.15, yTop - 0.035 * F.h);
      ctx.lineTo(x0 + w0 * 0.85, yTop - 0.035 * F.h); ctx.lineTo(x0 + w0, yTop);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#9A8C74';
      for (var r = 0; r < 3; r++) {
        for (var c = 0; c < 3; c++) {
          var wx = x0 + w0 * (0.18 + c * 0.30), wy = yTop + (yBot - yTop) * (0.20 + r * 0.28);
          rect(wx, wy, w0 * 0.12, (yBot - yTop) * 0.16);
          ctx.fillStyle = '#C8BCA8'; rect(wx, wy + (yBot - yTop) * 0.16, w0 * 0.12, 2);
          ctx.fillStyle = '#9A8C74';
        }
      }
      // ivy patches climbing the facade
      ctx.fillStyle = IVY;
      var ivyX = x0 + w0 * (0.05 + (b % 2) * 0.55);
      ell(ivyX + w0 * 0.10, yBot - 0.05 * F.h, w0 * 0.10, 0.05 * F.w, 0);
      ell(ivyX + w0 * 0.06, yBot - 0.10 * F.h, w0 * 0.07, 0.04 * F.w, 0);
      ell(ivyX + w0 * 0.16, yBot - 0.09 * F.h, w0 * 0.06, 0.035 * F.w, 0);
    }
  }

  function drawTree(F) {
    var tx = F.x + 0.21 * F.w;
    ctx.fillStyle = '#5C4028';
    ctx.beginPath();
    ctx.moveTo(tx - 0.022 * F.w, F.y + 0.60 * F.h);
    ctx.lineTo(tx + 0.022 * F.w, F.y + 0.60 * F.h);
    ctx.lineTo(tx + 0.014 * F.w, F.y + 0.20 * F.h);
    ctx.lineTo(tx - 0.014 * F.w, F.y + 0.20 * F.h);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5C4028'; ctx.lineWidth = Math.max(2, 0.008 * F.w); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tx, F.y + 0.42 * F.h); ctx.lineTo(tx - 0.05 * F.w, F.y + 0.34 * F.h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx, F.y + 0.36 * F.h); ctx.lineTo(tx + 0.05 * F.w, F.y + 0.28 * F.h); ctx.stroke();
    // canopy blobs
    var blobs = [[0.21, 0.16, 0.13], [0.10, 0.22, 0.09], [0.33, 0.21, 0.09], [0.16, 0.08, 0.08], [0.28, 0.09, 0.08]];
    for (var i = 0; i < blobs.length; i++) {
      ctx.fillStyle = (i % 2) ? '#4A8C3A' : '#5FAE4E';
      ell(F.x + blobs[i][0] * F.w, F.y + blobs[i][1] * F.h, blobs[i][2] * F.w, blobs[i][2] * F.w * 0.85, 0);
    }
    // treehouse: platform, hut, roof, ladder
    var hx = F.x + 0.20 * F.w, hy = F.y + 0.30 * F.h;
    ctx.fillStyle = '#7A5A34'; rect(hx - 0.055 * F.w, hy, 0.11 * F.w, 0.012 * F.h);
    ctx.fillStyle = '#A88050'; rect(hx - 0.045 * F.w, hy - 0.075 * F.h, 0.09 * F.w, 0.075 * F.h);
    ctx.fillStyle = '#8A4A2A';
    ctx.beginPath();
    ctx.moveTo(hx - 0.055 * F.w, hy - 0.075 * F.h); ctx.lineTo(hx, hy - 0.105 * F.h);
    ctx.lineTo(hx + 0.055 * F.w, hy - 0.075 * F.h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#F2C86A'; rect(hx - 0.012 * F.w, hy - 0.055 * F.h, 0.024 * F.w, 0.03 * F.h);
    ctx.strokeStyle = '#5C4028'; ctx.lineWidth = Math.max(1.5, 0.004 * F.w);
    ctx.beginPath(); ctx.moveTo(hx - 0.03 * F.w, hy + 0.012 * F.h); ctx.lineTo(hx - 0.03 * F.w, hy + 0.16 * F.h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx + 0.03 * F.w, hy + 0.012 * F.h); ctx.lineTo(hx + 0.03 * F.w, hy + 0.16 * F.h); ctx.stroke();
    for (var s = 0; s < 4; s++) {
      ctx.beginPath();
      ctx.moveTo(hx - 0.03 * F.w, hy + (0.05 + s * 0.035) * F.h);
      ctx.lineTo(hx + 0.03 * F.w, hy + (0.05 + s * 0.035) * F.h); ctx.stroke();
    }
  }

  function drawPath(F) {
    ctx.lineCap = 'round';
    for (var i = 0; i < 24; i++) {
      var u0 = i / 24, u1 = (i + 1) / 24;
      var p0 = pathPoint(u0), p1 = pathPoint(u1);
      var wdt = (0.055 + u1 * 0.03) * F.w;
      ctx.strokeStyle = PATH; ctx.lineWidth = wdt;
      ctx.beginPath();
      ctx.moveTo(F.x + p0.x * F.w, F.y + p0.y * F.h);
      ctx.lineTo(F.x + p1.x * F.w, F.y + p1.y * F.h);
      ctx.stroke();
    }
  }

  function drawBench(F) {
    var bx = F.x + 0.64 * F.w, by = F.y + 0.68 * F.h;
    ctx.fillStyle = '#6E4A2A';
    rect(bx, by, 0.17 * F.w, 0.012 * F.h);
    rect(bx + 0.01 * F.w, by + 0.012 * F.h, 0.012 * F.w, 0.04 * F.h);
    rect(bx + 0.145 * F.w, by + 0.012 * F.h, 0.012 * F.w, 0.04 * F.h);
    rect(bx, by - 0.045 * F.h, 0.012 * F.w, 0.045 * F.h);
    rect(bx + 0.158 * F.w, by - 0.045 * F.h, 0.012 * F.w, 0.045 * F.h);
  }

  var TUFTS = [];
  (function () {
    var pts = [[0.06, 0.80], [0.12, 0.92], [0.44, 0.86], [0.58, 0.96], [0.90, 0.96], [0.94, 0.70], [0.20, 0.66], [0.46, 0.60]];
    for (var i = 0; i < pts.length; i++) TUFTS.push(pts[i]);
  })();

  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var F = frameRect();
    lastF = F;
    ASCALE = F.w * 0.0012;
    // page ground is the peach sky wash
    ctx.fillStyle = SKY; ctx.fillRect(0, 0, W, H);
    // soft sun, top-right behind the buildings
    ctx.fillStyle = 'rgba(242,168,122,0.55)';
    circle(F.x + 0.88 * F.w, F.y + 0.10 * F.h, 0.075 * F.w);
    ctx.fillStyle = '#F2A87A';
    circle(F.x + 0.88 * F.w, F.y + 0.10 * F.h, 0.05 * F.w);
    drawBuildings(F);
    // three ground bands, far to near
    ctx.fillStyle = GREEN_FAR; rect(F.x, F.y + 0.30 * F.h, F.w, 0.22 * F.h);
    ctx.fillStyle = GREEN_MID; rect(F.x, F.y + 0.52 * F.h, F.w, 0.22 * F.h);
    ctx.fillStyle = GREEN_NEAR; rect(F.x, F.y + 0.74 * F.h, F.w, 0.26 * F.h);
    drawPath(F);
    drawTree(F);
    // far-band goose, smallest scale
    var g3 = goosePos(GEESE[2], t, F);
    drawGoose(g3.x, g3.y, GEESE[2].s, g3.dir, t, GEESE[2].ph);
    // stilt kids, mid band left of center
    drawStiltKid(F.x + 0.30 * F.w, F.y + 0.66 * F.h, 1.0, t, 0.0, '#3A5FA0', '#E8C8A8');
    drawStiltKid(F.x + 0.37 * F.w, F.y + 0.70 * F.h, 1.1, t, 0.7, '#A0522D', '#D8B898');
    // bench and grandmothers
    drawBench(F);
    drawGrandmother(F.x + 0.68 * F.w, F.y + 0.68 * F.h, 1.0, t, 0.0, '#6E4A6E', '#3A3A4A');
    drawGrandmother(F.x + 0.76 * F.w, F.y + 0.68 * F.h, 1.0, t, 1.3, '#4A6E5A', '#5A3A2A');
    // mid-band goose
    var g1 = goosePos(GEESE[0], t, F);
    drawGoose(g1.x, g1.y, GEESE[0].s, g1.dir, t, GEESE[0].ph);
    // piglet on the path, following the fingertip briefly while dragged
    var pu = tri(t, 0.045);
    var pcyc = (t * 0.045) % 2;
    var pp = pathPoint(pu);
    var px = F.x + pp.x * F.w, py = F.y + pp.y * F.h;
    var pdir = (pcyc < 1) ? -1 : 1;
    var follow = 0;
    if (dragT > -50) follow = Math.max(0, 1 - (t - dragT) / 2) * 0.8;
    if (follow > 0) {
      px = px * (1 - follow) + dragX * follow;
      py = py * (1 - follow) + dragY * follow;
    }
    // piglet stays inside the frame
    px = Math.max(F.x + 10, Math.min(F.x + F.w - 10, px));
    py = Math.max(F.y + 10, Math.min(F.y + F.h - 10, py));
    drawPiglet(px, py, 1.05, pdir, t);
    // jogger looping the path, return leg on a parallel offset
    var ju = (t * 0.07 + 0.5) % 2;
    var jp, jdir;
    if (ju < 1) { jp = pathPoint(ju, 0); jdir = -1; }
    else { jp = pathPoint(2 - ju, -0.035); jdir = 1; }
    drawJogger(F.x + jp.x * F.w, F.y + jp.y * F.h, 1.05, jdir, t);
    // near-band geese
    var g2 = goosePos(GEESE[1], t, F);
    drawGoose(g2.x, g2.y, GEESE[1].s, g2.dir, t, GEESE[1].ph);
    var g4 = goosePos(GEESE[3], t, F);
    drawGoose(g4.x, g4.y, GEESE[3].s, g4.dir, t, GEESE[3].ph);
    // foreground tufts and flowers
    ctx.strokeStyle = '#2E6E2A'; ctx.lineWidth = Math.max(1.5, 0.003 * F.w); ctx.lineCap = 'round';
    for (var i = 0; i < TUFTS.length; i++) {
      var tx = F.x + TUFTS[i][0] * F.w, ty = F.y + TUFTS[i][1] * F.h;
      var sw = Math.sin(t * 1.3 + i) * 0.004 * F.w;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + sw, ty - 0.02 * F.h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tx + 0.008 * F.w, ty); ctx.lineTo(tx + 0.008 * F.w - sw, ty - 0.018 * F.h); ctx.stroke();
    }
    ctx.fillStyle = '#F2EAD8';
    circle(F.x + 0.14 * F.w, F.y + 0.90 * F.h, 0.008 * F.w);
    ctx.fillStyle = '#E08090';
    circle(F.x + 0.60 * F.w, F.y + 0.94 * F.h, 0.008 * F.w);
    ctx.fillStyle = '#F2EAD8';
    circle(F.x + 0.92 * F.w, F.y + 0.88 * F.h, 0.008 * F.w);
  }

  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      draw(PHASE0 + (now - start) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
