<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№97 · Gyre Lines</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#A98B5F; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(26,21,18,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to turn a gyre</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.97 Gyre Lines: static plotter triptych, seeded PRNG "Gyre Lines".
// Each gyre: exactly 72 vertices around a circle, each joined to the centre by a hairline;
// vertices are displaced radially by smooth harmonic noise into an organic outline, and the
// perimeter is drawn as the chain of small triangle-strip edges between neighbouring spokes.
// STATIC decision (per spec default, same pattern as No.89/90/92): no automatic motion.
// The only interaction is drag-only rotation of the gyre under the fingertip, around its centre.
const VERTS=72;
const rng=mulberry(hashStr('Gyre Lines'));
const GYRES=[];
for(let g=0; g<3; g++){
  const harms=[];
  const nh=4;
  for(let j=0;j<nh;j++) harms.push({ k:2+j, amp:0.05+rng()*0.05, ph:rng()*Math.PI*2 });
  GYRES.push({ harms, rot:0 });
}
function displacedRadius(gyre, theta){
  let d=0;
  for(const hm of gyre.harms) d+=hm.amp*Math.sin(hm.k*theta+hm.ph);
  return 1+d;
}
let dragGyre=-1, dragLastAng=0;
function computeLayout(w,h){
  const phone=isPhone();
  let ox=0, oy=0, dw=w, dh=h;
  if(!phone){ const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; dw=S; dh=S; }
  const out=[];
  for(let g=0; g<3; g++){
    const cx=ox+dw*(g+0.5)/3;
    const cy=oy+dh/2;
    const R=Math.min(dw/3, dh)*0.40;
    out.push([cx, cy, R]);
  }
  return out;
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#A98B5F'; ctx.fillRect(0,0,w,h);
  const layout=computeLayout(w,h);
  ctx.strokeStyle='#1A1512';
  ctx.lineWidth=1;
  ctx.beginPath();
  layout.forEach(([cx, cy, R], gi)=>{
    const gyre=GYRES[gi];
    const pts=[];
    for(let k=0;k<VERTS;k++){
      const th=gyre.rot + (k/VERTS)*Math.PI*2;
      const rr=R*displacedRadius(gyre, (k/VERTS)*Math.PI*2); // outline fixed to the gyre; the whole figure rotates
      pts.push([cx+Math.cos(th)*rr, cy+Math.sin(th)*rr]);
    }
    for(let k=0;k<VERTS;k++){
      const [x,y]=pts[k];
      ctx.moveTo(cx,cy); ctx.lineTo(x,y);                       // spoke: vertex to centre
      const [nx,ny]=pts[(k+1)%VERTS];
      ctx.moveTo(x,y); ctx.lineTo(nx,ny);                       // perimeter: triangle-strip edge
    }
  });
  ctx.stroke();
  if(VERTS*3!==216) console.assert(false,'verts',VERTS*3);
  return {};
}
let curLayout=null;
function pointerPos(e){ const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{left:0,top:0}; return [e.clientX-r.left, e.clientY-r.top]; }
canvas.addEventListener('pointerdown',e=>{
  const [x,y]=pointerPos(e);
  const [w,h]=viewportWH(); curLayout=computeLayout(w,h);
  let best=-1, bd=1e18;
  curLayout.forEach(([cx,cy],i)=>{ const d=Math.hypot(x-cx,y-cy); if(d<bd){ bd=d; best=i; } });
  dragGyre=best;
  const [cx,cy]=curLayout[best];
  dragLastAng=Math.atan2(y-cy, x-cx);
});
canvas.addEventListener('pointermove',e=>{
  if(dragGyre<0||!curLayout) return;
  const [x,y]=pointerPos(e);
  const [cx,cy]=curLayout[dragGyre];
  const a=Math.atan2(y-cy, x-cx);
  let d=a-dragLastAng;
  if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2;
  GYRES[dragGyre].rot+=d;
  dragLastAng=a;
  drawFrame(performance.now());
});
function endP(){ dragGyre=-1; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
