<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.262 River Shadow</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#CBBFA8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.262 River Shadow (Stanzin Tsepel). After his 2026
// Henasku work: a deep Himalayan canyon in layered rock
// strata, and through the gorge floor the pale winding
// shadow of a river that no longer flows. The ghost
// channel breathes on a 30 second loop, widening,
// narrowing to a thread, widening again: a memory of
// flow, not water. Dust motes drift in the warm rake.
// Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var ROCK = '#6B4A36', DEEP = '#3F2C20', PALE = '#D9D3C4', DUST = '#CBBFA8', LICHEN = '#7A8B6F';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var T = 4.0, lastNow = -1; // frame one: the ribbon mid breath, partly widened

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- canyon geometry ---------------------------------------------------------
// wall inner edges lean outward as the gorge drops
function leftEdge(y) { return 472 - (y / DH) * 152; }
function rightEdge(y) { return 808 + (y / DH) * 152; }

// strata bands for both walls, carved with seeded jitter
var bandsL = [], bandsR = [];
(function () {
  var r = rng(26211);
  var y = -8;
  while (y < DH + 8) {
    var h = 30 + r() * 26;
    bandsL.push({ y: y, h: h, j1: (r() - 0.5) * 22, j2: (r() - 0.5) * 22, tone: r() });
    y += h;
  }
  var r2 = rng(26223);
  y = -8;
  while (y < DH + 8) {
    var h2 = 30 + r2() * 26;
    bandsR.push({ y: y, h: h2, j1: (r2() - 0.5) * 22, j2: (r2() - 0.5) * 22, tone: r2() });
    y += h2;
  }
})();
// lichen patches clinging to the strata
var lichen = [];
(function () {
  var r = rng(26237);
  for (var i = 0; i < 30; i++) {
    var left = r() < 0.5;
    var y = 40 + r() * 800;
    var edge = left ? leftEdge(y) : rightEdge(y);
    lichen.push({ x: left ? 30 + r() * (edge - 70) : edge + 40 + r() * (DW - edge - 70), y: y, rx: 6 + r() * 15, ry: 2.5 + r() * 4, a: 0.25 + r() * 0.3 });
  }
})();
// dust motes hanging in the rake of light
var motes = [];
(function () {
  var r = rng(26249);
  for (var i = 0; i < 36; i++) motes.push({ fx: r(), fy: r(), sz: 1 + r() * 1.9, ph: r() * Math.PI * 2, sp: 2.5 + r() * 5 });
})();
// the ghost river's centre line across the gorge floor
function riverX(y) { return 640 + 72 * Math.sin((y - 520) / 150) + 30 * Math.sin((y - 520) / 63); }

function drawWall(bands, left) {
  for (var i = 0; i < bands.length; i++) {
    var b = bands[i];
    var e1 = (left ? leftEdge(b.y) : rightEdge(b.y)) + b.j1;
    var e2 = (left ? leftEdge(b.y + b.h) : rightEdge(b.y + b.h)) + b.j2;
    ctx.fillStyle = b.tone < 0.52 ? ROCK : mix(ROCK, DEEP, 0.45 + b.tone * 0.4);
    ctx.beginPath();
    if (left) {
      ctx.moveTo(-10, b.y); ctx.lineTo(e1, b.y); ctx.lineTo(e2, b.y + b.h); ctx.lineTo(-10, b.y + b.h);
    } else {
      ctx.moveTo(DW + 10, b.y); ctx.lineTo(e1, b.y); ctx.lineTo(e2, b.y + b.h); ctx.lineTo(DW + 10, b.y + b.h);
    }
    ctx.closePath(); ctx.fill();
    // a lit lip on some band tops where the rake catches
    if (b.tone > 0.62) {
      ctx.strokeStyle = rgba(DUST, 0.16);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(left ? -10 : e1, b.y); ctx.lineTo(left ? e1 : DW + 10, b.y); ctx.stroke();
    }
  }
}

function draw() {
  // dust sky in the gorge opening
  ctx.fillStyle = DUST;
  ctx.fillRect(0, 0, DW, DH);
  // distant ridge closing the gorge far up the frame
  ctx.fillStyle = mix(ROCK, DUST, 0.25);
  ctx.beginPath();
  ctx.moveTo(leftEdge(430), 545); ctx.lineTo(520, 468); ctx.lineTo(700, 505); ctx.lineTo(880, 452); ctx.lineTo(rightEdge(430), 545);
  ctx.lineTo(rightEdge(430), 580); ctx.lineTo(leftEdge(430), 580);
  ctx.closePath(); ctx.fill();
  // the gorge floor: dark strata falling away
  ctx.fillStyle = DEEP;
  ctx.beginPath();
  ctx.moveTo(leftEdge(520), 520); ctx.lineTo(rightEdge(520), 520); ctx.lineTo(rightEdge(DH), DH); ctx.lineTo(leftEdge(DH), DH);
  ctx.closePath(); ctx.fill();
  // floor strata seams, converging with the perspective
  ctx.strokeStyle = rgba(ROCK, 0.5);
  ctx.lineWidth = 2;
  for (var f = 0; f < 6; f++) {
    var fy = 585 + f * 56;
    ctx.beginPath(); ctx.moveTo(leftEdge(fy) + 6, fy); ctx.lineTo(rightEdge(fy) - 6, fy); ctx.stroke();
  }
  // canyon walls
  drawWall(bandsL, true);
  drawWall(bandsR, false);
  // lichen
  for (var l = 0; l < lichen.length; l++) {
    var p = lichen[l];
    ctx.fillStyle = rgba(LICHEN, p.a);
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, Math.PI * 2); ctx.fill();
  }
  // the warm rake: flat shafts of dusty light from the upper left
  ctx.fillStyle = rgba(DUST, 0.07);
  ctx.beginPath(); ctx.moveTo(120, -20); ctx.lineTo(430, -20); ctx.lineTo(150, DH + 20); ctx.lineTo(-160, DH + 20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(DUST, 0.05);
  ctx.beginPath(); ctx.moveTo(560, -20); ctx.lineTo(760, -20); ctx.lineTo(430, DH + 20); ctx.lineTo(210, DH + 20); ctx.closePath(); ctx.fill();

  // ---- the ghost river -----------------------------------------------------
  // breath: 0 thread .. 1 full width, one slow sine over 30 seconds
  var breath = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(T * Math.PI * 2 / 30 - 0.6));
  var pts = [];
  for (var y = 528; y <= DH + 10; y += 16) pts.push([riverX(y), y]);
  function ribbon(widthMul, alpha) {
    ctx.strokeStyle = rgba(PALE, alpha);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // width grows toward the viewer down the floor
    for (var s = 0; s < pts.length - 1; s++) {
      var persp = 0.35 + 0.65 * ((pts[s][1] - 520) / 380);
      ctx.lineWidth = Math.max(1, 52 * persp * breath * widthMul);
      ctx.beginPath(); ctx.moveTo(pts[s][0], pts[s][1]); ctx.lineTo(pts[s + 1][0], pts[s + 1][1]); ctx.stroke();
    }
  }
  ribbon(2.6, 0.05);  // the luminous halo pass
  ribbon(1.7, 0.09);
  ribbon(1.0, 0.16);
  ribbon(0.55, 0.30); // the remembered channel itself

  // ---- dust motes in the light ----------------------------------------------
  for (var m = 0; m < motes.length; m++) {
    var mo = motes[m];
    var dx = ((mo.fx * DW + T * mo.sp) % (DW + 30)) - 15;
    var dy = mo.fy * DH + Math.sin(T * 0.22 + mo.ph) * 14;
    ctx.fillStyle = rgba(DUST, 0.14 + 0.1 * Math.sin(T * 0.45 + mo.ph));
    ctx.beginPath(); ctx.arc(dx, dy, mo.sz, 0, Math.PI * 2); ctx.fill();
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = DUST;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: the canyon fills the frame
  var S = Math.max(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
