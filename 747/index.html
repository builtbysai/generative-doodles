<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedgework Drift</title>
<style>
  html, body { margin: 0; padding: 0; background: #08080A; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (strict)
  var ROOM = '#08080A';
  var FLOOR = '#111114';
  var LIME = '212,242,74';    // #D4F24A
  var VIOLET = '154,106,232'; // #9A6AE8

  var LOOP = 60; // seconds, seamless

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0 && minDim < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  window.addEventListener('resize', function () { resize(); draw(lastT); });

  // A blade is a stack of alpha strips: widest/faintest first, hard core last.
  // widths are fractions of the blade's nominal half-width unit.
  var STRIPS = [
    { w: 9.0, a: 0.045 },
    { w: 5.5, a: 0.075 },
    { w: 3.2, a: 0.13 },
    { w: 1.8, a: 0.22 },
    { w: 1.0, a: 0.38 },
    { w: 0.45, a: 0.62 },
    { w: 0.16, a: 0.95 }
  ];

  function drawBlade(cx, cy, angle, unit, rgb, composite) {
    var len = Math.hypot(W, H) * 1.35; // extends well past the frame edges
    ctx.save();
    ctx.globalCompositeOperation = composite;
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    var i, s;
    for (i = 0; i < STRIPS.length; i++) {
      s = STRIPS[i];
      ctx.fillStyle = 'rgba(' + rgb + ',' + s.a + ')';
      ctx.fillRect(-len / 2, -s.w * unit / 2, len, s.w * unit);
    }
    ctx.restore();
  }

  var lastT = 0;

  function draw(tSec) {
    lastT = tSec;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var u = ((tSec % LOOP) + LOOP) % LOOP / LOOP; // loop phase 0..1
    var ph = Math.PI * 2 * u;
    var pivot = Math.sin(ph);           // -1..1, one full cycle per loop
    var pivotAmt = Math.abs(pivot);

    // Room
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, W, H);

    // Floor plane (bottom band), very faint
    var floorY = H * 0.78;
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, floorY, W, H - floorY);

    // Corner seam: vertical seam on the right wall + floor edge line.
    // Seam dissolves (fades to nothing) at pivot extremes, returns at settle.
    var seamA = 0.16 * (1 - pivotAmt) + 0.0;
    var seamX = W * 0.66;
    if (seamA > 0.004) {
      ctx.fillStyle = 'rgba(200,200,210,' + seamA.toFixed(4) + ')';
      ctx.fillRect(seamX, 0, 1.2, floorY);
      ctx.fillStyle = 'rgba(200,200,210,' + (seamA * 0.7).toFixed(4) + ')';
      ctx.fillRect(0, floorY, W, 1.2);
    }

    // Crossing point: off-center, drifts a few percent with integer cycles
    var cx = W * (0.44 + 0.035 * Math.sin(ph));
    var cy = H * (0.46 + 0.028 * Math.sin(ph * 2 + 1.1));
    if (isPhone()) { cx = W * 0.46; }

    var unit = Math.max(2.2, Math.min(W, H) * 0.017);
    var swing = 8 * Math.PI / 180;

    var a1 = -0.58 + swing * pivot;        // lime blade
    var a2 = 0.66 - swing * 0.85 * pivot;  // violet blade, counter-pivot

    drawBlade(cx, cy, a1, unit, LIME, 'source-over');
    drawBlade(cx, cy, a2, unit, VIOLET, 'lighter'); // additive: overlap sums brighter
  }

  resize();
  draw(0); // deterministic frame one: loop t = 0

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function frame(now) {
    var elapsed = ((now - t0) / 1000);
    draw(elapsed);
    requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
