<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Parabolic Listener</title>
<style>
html, body { margin: 0; padding: 0; background: #0b0b0e; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0b0b0e';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, motes mid-drift, one bloom mid-fade */
var MOTES = 170;
var BLOOM_DUR = 3.0; /* seconds a focal bloom lives */
var MOTE_WARM = '#F2EAD8';
var BLOOM_AMBER = '#E8A33D';
var STEEL = '#9AA4B0';
var PLATE_FILL = '#111114';
var PLATE_LINE = 'rgba(232,226,210,0.25)';
var PLATE_INK = '#E8E2D2';
var HINT_INK = '#E8E2D2';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- fixed seeded mote table, seed 1795 ----
   Per mote: x0, y0 (field fractions), size, drift speed, vertical phase,
   brightness, bloom jitter. */
var TABLE = [];
(function buildTable() {
  var rng = mulberry32(1795);
  var i;
  for (i = 0; i < MOTES; i++) {
    TABLE.push({
      x0: rng(), y0: rng(),
      size: 0.7 + rng() * 1.7,
      speed: 0.008 + rng() * 0.014, /* field widths per second, right to left */
      ph: rng() * TAU,
      amp: 0.01 + rng() * 0.03,
      bright: 0.25 + rng() * 0.6
    });
  }
})();
/* ---- fixed bloom schedule, seed 1795 ----
   Blooms at t0 = 58.8 + m * 6.4 + jitter, so at frame one (t = 60 s)
   the m = 0 bloom is 1.2 s into its 3.0 s fade: partway through. */
var BLOOMS = [];
(function buildBlooms() {
  var rng = mulberry32(1795 + 77);
  var m;
  for (m = -9; m <= 9; m++) {
    BLOOMS.push({
      t0: 58.8 + m * 6.4 + (rng() - 0.5) * 1.6,
      ox: (rng() - 0.5) * 0.10, /* focus offsets, fractions of dish radius */
      oy: (rng() - 0.5) * 0.10,
      peak: 0.55 + rng() * 0.3
    });
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* aim: pan/tilt in radians, 0 at frame one; target set by dragging */
var aim = { pan: 0, tilt: 0 };
var aimTarget = { pan: 0, tilt: 0 };
var dragging = false, dragStartX = 0, dragStartY = 0, dragStartPan = 0, dragStartTilt = 0;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
var D = { cx: 0, cy: 0, R: 0, gy: 0 }; /* main dish geometry */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
  D.cx = F.x + 0.34 * F.w;
  D.cy = F.y + 0.52 * F.h;
  D.R = 0.30 * F.w;
  D.gy = F.y + 0.88 * F.h; /* ground line */
}
/* Focal point for the current (lagged) aim. Mouth opens to the right. */
function focusPoint() {
  var fx = D.cx + 0.62 * D.R * Math.cos(aim.pan);
  var fy = D.cy - 0.62 * D.R * Math.sin(aim.tilt);
  return { x: fx, y: fy };
}
/* Mote position at time t, closed form: right-to-left drift with a
   vertical sway, bent toward the current focus by a Gaussian falloff. */
function motePos(m, t) {
  var fx = focusPoint().x, fy = focusPoint().y;
  var x = F.x + (((m.x0 - m.speed * t) % 1) + 1) % 1 * F.w;
  var y = F.y + (m.y0 + m.amp * Math.sin(m.ph + t * 0.10)) * F.h;
  var dx = fx - x, dy = fy - y;
  var d2 = dx * dx + dy * dy;
  var sig = 1.6 * D.R;
  var bend = 0.55 * Math.exp(-d2 / (2 * sig * sig));
  x += dx * bend;
  y += dy * bend;
  return { x: x, y: y, near: Math.exp(-d2 / (2 * (0.35 * D.R) * (0.35 * D.R))) };
}
function drawDish(cx, cy, R, dim) {
  var a = dim ? 0.45 : 1.0;
  /* bowl: radial gradient, deepest at the mouth's left edge */
  var g = ctx.createRadialGradient(cx - 0.35 * R, cy, R * 0.1, cx, cy, R);
  g.addColorStop(0, rgba('#23242B', 0.95 * a));
  g.addColorStop(0.7, rgba('#141519', 0.95 * a));
  g.addColorStop(1, rgba('#0E0E11', 0.95 * a));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(cx, cy, R * 0.98, R, 0, 0, TAU);
  ctx.fill();
  /* inner bowl shading: a darker crescent on the right half */
  ctx.fillStyle = rgba('#050507', 0.55 * a);
  ctx.beginPath();
  ctx.ellipse(cx + 0.18 * R, cy, R * 0.62, R * 0.82, 0, 0, TAU);
  ctx.fill();
  /* rim */
  ctx.strokeStyle = rgba(STEEL, 0.38 * a);
  ctx.lineWidth = Math.max(1.5, R * 0.012);
  ctx.beginPath();
  ctx.ellipse(cx, cy, R * 0.98, R, 0, 0, TAU);
  ctx.stroke();
  /* steel rim light on the upper-left arc */
  ctx.strokeStyle = rgba('#C8D2E1', 0.55 * a);
  ctx.lineWidth = Math.max(1.5, R * 0.016);
  ctx.beginPath();
  ctx.ellipse(cx, cy, R * 0.98, R, 0, Math.PI * 0.62, Math.PI * 1.38);
  ctx.stroke();
}
function drawTower() {
  var tx = F.x + F.w - 0.035 * F.w;
  var top = D.gy - 0.24 * F.h;
  var w = Math.max(6, F.w * 0.012);
  ctx.fillStyle = '#141419';
  ctx.fillRect(tx - w / 2, top, w, D.gy - top);
  /* siren horn at the top */
  ctx.beginPath();
  ctx.moveTo(tx - w * 1.1, top + 2);
  ctx.lineTo(tx + w * 1.6, top - 0.06 * F.h);
  ctx.lineTo(tx + w * 1.1, top + 2);
  ctx.closePath();
  ctx.fill();
  /* faint edge light on the tower's left side */
  ctx.fillStyle = 'rgba(200,200,210,0.07)';
  ctx.fillRect(tx - w / 2, top, 1.5, D.gy - top);
}
function drawField(t) {
  var i, m, p;
  /* faint ground line */
  ctx.strokeStyle = 'rgba(200,200,210,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(F.x, D.gy);
  ctx.lineTo(F.x + F.w, D.gy);
  ctx.stroke();
  /* second dish behind, smaller and dimmer, upper right of the main dish */
  drawDish(D.cx + 0.24 * F.w, D.cy - 0.17 * F.h, D.R * 0.55, true);
  /* siren tower at the far right edge */
  drawTower();
  /* main dish */
  drawDish(D.cx, D.cy, D.R, false);
  /* support pole and base */
  ctx.strokeStyle = rgba(STEEL, 0.30);
  ctx.lineWidth = Math.max(2, D.R * 0.02);
  ctx.beginPath();
  ctx.moveTo(D.cx, D.cy + D.R * 0.88);
  ctx.lineTo(D.cx, D.gy);
  ctx.stroke();
  ctx.fillStyle = rgba(STEEL, 0.22);
  ctx.beginPath();
  ctx.ellipse(D.cx, D.gy, D.R * 0.16, D.R * 0.03, 0, 0, TAU);
  ctx.fill();
  /* feed arm from dish centre to the focal point */
  var fp = focusPoint();
  ctx.strokeStyle = rgba(STEEL, 0.45);
  ctx.lineWidth = Math.max(1.2, D.R * 0.008);
  ctx.beginPath();
  ctx.moveTo(D.cx, D.cy);
  ctx.lineTo(fp.x, fp.y);
  ctx.stroke();
  ctx.fillStyle = rgba('#C8CCD4', 0.8);
  ctx.beginPath();
  ctx.arc(fp.x, fp.y, Math.max(2, D.R * 0.02), 0, TAU);
  ctx.fill();
  /* faint constant glow at the focus: the listening point */
  var glow = ctx.createRadialGradient(fp.x, fp.y, 0, fp.x, fp.y, D.R * 0.28);
  glow.addColorStop(0, rgba(BLOOM_AMBER, 0.07));
  glow.addColorStop(1, rgba(BLOOM_AMBER, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(fp.x, fp.y, D.R * 0.28, 0, TAU);
  ctx.fill();
  /* focal blooms: closed-form schedule, soft amber, brief */
  for (i = 0; i < BLOOMS.length; i++) {
    var b = BLOOMS[i];
    var age = t - b.t0;
    if (age < 0 || age >= BLOOM_DUR) continue;
    var frac = age / BLOOM_DUR;
    var br = D.R * (0.10 + 0.22 * frac);
    var bx = fp.x + b.ox * D.R, by = fp.y + b.oy * D.R;
    var bg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    bg.addColorStop(0, rgba(BLOOM_AMBER, b.peak * (1 - frac)));
    bg.addColorStop(0.5, rgba(BLOOM_AMBER, b.peak * 0.45 * (1 - frac)));
    bg.addColorStop(1, rgba(BLOOM_AMBER, 0));
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, TAU);
    ctx.fill();
    /* bright core while the bloom is young */
    if (frac < 0.5) {
      ctx.fillStyle = rgba('#F6D9A0', 0.5 * (1 - frac * 2));
      ctx.beginPath();
      ctx.arc(bx, by, br * 0.28, 0, TAU);
      ctx.fill();
    }
  }
  /* motes: warm white, drifting right to left, bending to the focus */
  for (i = 0; i < MOTES; i++) {
    m = TABLE[i];
    p = motePos(m, t);
    var al = clamp(m.bright + p.near * 0.5, 0, 1);
    var r = m.size * (1 + p.near * 0.9) * (F.w / 860);
    ctx.fillStyle = rgba(MOTE_WARM, al);
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.5, r), 0, TAU);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Parabolic Listener').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Parabolic Listener').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 11').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Parabolic Listener', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 11', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to re-aim the dish.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawField(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    aim: function () { return { pan: aim.pan, tilt: aim.tilt }; },
    aimTarget: function () { return { pan: aimTarget.pan, tilt: aimTarget.tilt }; },
    moteCount: function () { return MOTES; },
    focus: function () { return focusPoint(); },
    bloomsAt: function (t) {
      var out = [], i;
      for (i = 0; i < BLOOMS.length; i++) {
        var age = t - BLOOMS[i].t0;
        if (age >= 0 && age < BLOOM_DUR) out.push({ age: age, peak: BLOOMS[i].peak });
      }
      return out;
    }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragStartX = (e && typeof e.clientX === 'number') ? e.clientX : 0;
    dragStartY = (e && typeof e.clientY === 'number') ? e.clientY : 0;
    dragStartPan = aimTarget.pan;
    dragStartTilt = aimTarget.tilt;
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging || !e || typeof e.clientX !== 'number' || typeof e.clientY !== 'number') return;
    var dx = e.clientX - dragStartX;
    var dy = e.clientY - dragStartY;
    aimTarget.pan = clamp(dragStartPan + dx * 0.0012, -0.35, 0.35);
    aimTarget.tilt = clamp(dragStartTilt - dy * 0.0012, -0.28, 0.28);
  });
  window.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('pointercancel', function () { dragging = false; });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      /* aim chases the drag target slowly: soft lag, never game-fast */
      var k = 1 - Math.exp(-dt * 0.5);
      aim.pan += (aimTarget.pan - aim.pan) * k;
      aim.tilt += (aimTarget.tilt - aim.tilt) * k;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
