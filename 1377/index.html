<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunter's Moon</title>
<style>
  html, body { margin: 0; padding: 0; background: #120808; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). No unseeded randomness anywhere.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Deterministic hash for quantized-time values (flicker, grain).
  function hash1(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  var SEED = 1377000;
  var CYCLE = 48; // seconds: draw 0-17, hold to 40, fade 40-48, repeat

  // ---- Street scene geometry (seeded once, in fractions of the frame) ----
  var buildings = [];
  (function () {
    var r = mulberry32(SEED + 101);
    var x = -0.02;
    while (x < 1.02) {
      var bw = 0.05 + r() * 0.09;
      buildings.push({
        fx: x, fw: bw,
        fh: 0.18 + r() * 0.22,
        tone: r(),
        win: 2 + Math.floor(r() * 4)
      });
      x += bw + 0.005 + r() * 0.02;
    }
  })();

  // Wet-light streaks on the street band.
  var streaks = [];
  (function () {
    for (var i = 0; i < 26; i++) {
      var r = mulberry32(SEED + 2000 + i * 7919);
      streaks.push({ fx: r(), fy: 0.62 + r() * 0.30, fw: 0.04 + r() * 0.16, a: 0.10 + r() * 0.22, ph: r() * 6.28 });
    }
  })();

  // Rain streaks: closed-form positions, never stored state.
  var rain = [];
  (function () {
    for (var i = 0; i < 170; i++) {
      var r = mulberry32(SEED + 3000 + i * 7919);
      rain.push({ fx: r(), fy: r(), sp: 420 + r() * 380, len: 10 + r() * 22, a: 0.05 + r() * 0.12 });
    }
  })();

  // Dust motes: closed-form drift.
  var dust = [];
  (function () {
    for (var i = 0; i < 60; i++) {
      var r = mulberry32(SEED + 4000 + i * 7919);
      dust.push({ fx: r(), fy: r(), vx: 6 + r() * 14, s: 1 + r() * 2, ph: r() * 6.28, a: 0.06 + r() * 0.14 });
    }
  })();

  // Film grain dots: visibility keyed by (dot, quantized 2 s time index).
  var grain = [];
  (function () {
    for (var i = 0; i < 260; i++) {
      var r = mulberry32(SEED + 5000 + i * 7919);
      grain.push({ fx: r(), fy: r(), s: 1 + Math.floor(r() * 2), base: 0.05 + r() * 0.10 });
    }
  })();

  // ---- Cipher script: 9 glyphs, each a set of seeded strokes ----
  // A stroke is a sampled polyline (loops approximated by curve samples,
  // arrows by a line plus head ticks, dot-trails by point lists).
  function buildGlyph(g) {
    var r = mulberry32(SEED + 9000 + g * 7919);
    var strokes = [];
    var n = 3 + Math.floor(r() * 3);
    for (var s = 0; s < n; s++) {
      var kind = Math.floor(r() * 5); // 0 loop, 1 arrow, 2 dots, 3 zig, 4 arc
      var cx = (r() - 0.5) * 0.7, cy = (r() - 0.5) * 0.7;
      var pts = [];
      if (kind === 0) {
        // Closed loop: sample an ellipse-ish wobbly loop.
        var rx = 0.28 + r() * 0.22, ry = 0.22 + r() * 0.20;
        var ph = r() * 6.28, wob = 0.05 + r() * 0.10;
        for (var k = 0; k <= 20; k++) {
          var a = (k / 20) * Math.PI * 2;
          pts.push([cx + Math.cos(a) * rx + Math.sin(a * 3 + ph) * wob,
                    cy + Math.sin(a) * ry + Math.cos(a * 2 + ph) * wob]);
        }
      } else if (kind === 1) {
        // Arrow: shaft plus head ticks at the end.
        var ax = cx - 0.3 + r() * 0.2, ay = cy + (r() - 0.5) * 0.4;
        var bx = cx + 0.3 - r() * 0.2, by = cy + (r() - 0.5) * 0.4;
        for (var k2 = 0; k2 <= 8; k2++) {
          pts.push([ax + (bx - ax) * (k2 / 8), ay + (by - ay) * (k2 / 8)]);
        }
        var dx = bx - ax, dy = by - ay, dl = Math.sqrt(dx * dx + dy * dy) || 1;
        var ux = dx / dl, uy = dy / dl;
        pts.push([bx - ux * 0.12 - uy * 0.10, by - uy * 0.12 + ux * 0.10]);
        pts.push([bx, by]);
        pts.push([bx - ux * 0.12 + uy * 0.10, by - uy * 0.12 - ux * 0.10]);
      } else if (kind === 2) {
        // Dot-trail along a shallow curve.
        var x0 = cx - 0.35, y0 = cy + (r() - 0.5) * 0.3;
        var x1 = cx + 0.35, y1 = cy + (r() - 0.5) * 0.3;
        var bend = (r() - 0.5) * 0.5;
        for (var k3 = 0; k3 < 7; k3++) {
          var tt = k3 / 6;
          pts.push([x0 + (x1 - x0) * tt,
                    y0 + (y1 - y0) * tt + Math.sin(tt * Math.PI) * bend]);
        }
      } else if (kind === 3) {
        // Zigzag with irregular amplitude, so it never reads as a letter.
        var zx = cx - 0.35, zy = cy;
        for (var k4 = 0; k4 <= 6; k4++) {
          var amp = 0.13 + r() * 0.18;
          pts.push([zx + k4 * 0.117, zy + ((k4 % 2 === 0) ? -amp : amp)]);
        }
      } else {
        // Open arc sweep.
        var arx = 0.30 + r() * 0.15, ary = 0.26 + r() * 0.15;
        var a0 = r() * 3.0;
        for (var k5 = 0; k5 <= 12; k5++) {
          var aa = a0 + (k5 / 12) * (1.2 + r() * 0.8);
          pts.push([cx + Math.cos(aa) * arx, cy + Math.sin(aa) * ary]);
        }
      }
      strokes.push({ kind: kind, pts: pts, start: g * 1.2 + s * 1.1, dur: 1.6 });
    }
    return { gx: (g % 3 - 1), gy: (Math.floor(g / 3) - 1), jx: (r() - 0.5) * 0.3, jy: (r() - 0.5) * 0.3, strokes: strokes };
  }
  var glyphs = [];
  for (var g = 0; g < 9; g++) glyphs.push(buildGlyph(g));

  // ---- Interaction: drag moves the script glyphs, loop never breaks ----
  var drag = null; // {sx, sy, ox, oy} while active
  var dragOff = { x: 0, y: 0 };
  var dragRel = null; // {t, x, y} release point for decay
  var nowT = 0;

  function decayedOffset(t) {
    if (!dragRel) return { x: 0, y: 0 };
    var dt = t - dragRel.t;
    if (dt <= 0) return { x: dragRel.x, y: dragRel.y };
    var f = Math.exp(-dt / 3);
    return { x: dragRel.x * f, y: dragRel.y * f };
  }
  function currentOffset(t) {
    if (drag) return { x: drag.ox, y: drag.oy };
    return decayedOffset(t);
  }

  function draw(t) {
    nowT = t;
    var w, h;
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    var phone = false;
    if (typeof window.screen !== 'undefined' && window.screen) {
      var minDim = Math.min(window.screen.width, window.screen.height);
      phone = minDim < 700;
    }
    if (!phone && h > w * 1.15) phone = true;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';

    var S = Math.min(w, h); // scale unit
    var horizon = h * 0.55;

    // ---- Ground: near-black, then the red grade ----
    ctx.fillStyle = '#120808';
    ctx.fillRect(0, 0, w, h);

    // Flicker envelope: seeded function of quantized time (0.12 s steps).
    var q = Math.floor(t / 0.12);
    var flick = hash1(q) * 2 - 1; // -1..1
    // Hue wobble: slow closed-form sine sums.
    var wob = Math.sin(t * 0.7) * 0.5 + Math.sin(t * 1.7 + 2.0) * 0.5;

    // ---- Buildings: soft dark rectangles in deep red ----
    for (var i = 0; i < buildings.length; i++) {
      var b = buildings[i];
      var bx = b.fx * w, bw = b.fw * w, bh = b.fh * h;
      var by = horizon - bh;
      ctx.fillStyle = (b.tone < 0.5) ? '#6e0d0d' : '#3d0a0a';
      ctx.fillRect(bx, by, bw, bh);
      // Windows: small flat rects, some lit.
      var wr = mulberry32(SEED + 6000 + i * 7919);
      for (var wn = 0; wn < b.win; wn++) {
        var wx = bx + wr() * Math.max(4, bw - 10);
        var wy = by + wr() * Math.max(4, bh - 14);
        ctx.fillStyle = (wr() < 0.3) ? '#a81414' : '#2a0606';
        ctx.fillRect(wx, wy, Math.max(3, bw * 0.08), Math.max(4, bh * 0.06));
      }
    }

    // ---- Street band: wet asphalt in near-black with red sheen ----
    ctx.fillStyle = '#1a0a0a';
    ctx.fillRect(0, horizon, w, h - horizon);

    // Wet-light streaks, shimmering on quantized time.
    for (var si = 0; si < streaks.length; si++) {
      var st = streaks[si];
      var shim = 0.75 + 0.25 * Math.sin(t * 0.9 + st.ph + hash1(q + si) * 0.6);
      ctx.fillStyle = 'rgba(200,60,40,' + (st.a * shim).toFixed(3) + ')';
      ctx.fillRect(st.fx * w, st.fy * h, st.fw * w, 2 + (si % 3));
    }

    // ---- Rain: thin vertical streaks, closed-form fall ----
    ctx.fillStyle = 'rgba(216,193,145,1)';
    for (var ri = 0; ri < rain.length; ri++) {
      var dr = rain[ri];
      var span = h + 60;
      var ry = ((dr.fy * span + dr.sp * t) % span) - 30;
      ctx.fillStyle = 'rgba(216,193,145,' + dr.a.toFixed(3) + ')';
      ctx.fillRect(dr.fx * w, ry, 1, dr.len);
    }

    // ---- Hunter-red grade wash (flat alpha, never a gradient) ----
    var washA = 0.20 + flick * 0.03 + wob * 0.02;
    ctx.fillStyle = 'rgba(168,20,20,' + washA.toFixed(3) + ')';
    ctx.fillRect(0, 0, w, h);

    // ---- Cipher script: blue glyphs, center, large, overlapping ----
    // Phase-shifted +12 s so frame one is already mid-draw: most of the
    // script is visible and still re-drawing, never an empty center.
    var tt = (t + 12) % CYCLE;
    var fade = 1;
    if (tt >= 40) fade = (CYCLE - tt) / 8;
    var off = currentOffset(t);
    var gx0 = w * 0.5, gy0 = h * 0.46;
    var cell = S * 0.17;
    var G = S * 0.15; // glyph box
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var gi = 0; gi < glyphs.length; gi++) {
      var gl = glyphs[gi];
      var par = 0.85 + gi * 0.04; // slight per-glyph parallax on drag
      var ox = gx0 + gl.gx * cell + gl.jx * cell + off.x * par;
      var oy = gy0 + gl.gy * cell + gl.jy * cell + off.y * par;
      for (var s2 = 0; s2 < gl.strokes.length; s2++) {
        var stk = gl.strokes[s2];
        var f = (tt - stk.start) / stk.dur;
        if (f <= 0) continue;
        if (f > 1) f = 1;
        var pts = stk.pts;
        var total = pts.length;
        var show = Math.floor(f * total);
        if (show < 1) continue;
        ctx.strokeStyle = 'rgba(61,111,224,' + (0.85 * fade).toFixed(3) + ')';
        ctx.lineWidth = Math.max(2, S * 0.004);
        ctx.beginPath();
        if (stk.kind === 2) {
          // Dot-trail: filled squares, never stroked arcs.
          ctx.fillStyle = 'rgba(61,111,224,' + (0.9 * fade).toFixed(3) + ')';
          for (var di = 0; di < show && di < total; di++) {
            var dp = pts[di];
            var ds = Math.max(2, S * 0.008);
            ctx.fillRect(ox + dp[0] * G - ds / 2, oy + dp[1] * G - ds / 2, ds, ds);
          }
        } else {
          ctx.moveTo(ox + pts[0][0] * G, oy + pts[0][1] * G);
          for (var pi = 1; pi < show && pi < total; pi++) {
            ctx.lineTo(ox + pts[pi][0] * G, oy + pts[pi][1] * G);
          }
          ctx.stroke();
        }
      }
    }

    // ---- Dust motes drifting across the whole field ----
    for (var du = 0; du < dust.length; du++) {
      var dm = dust[du];
      var dx = ((dm.fx * w + dm.vx * t) % w + w) % w;
      var dy = dm.fy * h + Math.sin(t * 0.3 + dm.ph) * 10;
      ctx.fillStyle = 'rgba(216,193,145,' + dm.a.toFixed(3) + ')';
      ctx.fillRect(dx, dy, dm.s, dm.s);
    }

    // ---- Film grain: seeded dots keyed by quantized 2 s index ----
    var q2 = Math.floor(t / 2);
    for (var gr = 0; gr < grain.length; gr++) {
      var gd = grain[gr];
      var hv = hash1(gd.fx * 100000 + q2 * 7919);
      if (hv < 0.35) continue;
      ctx.fillStyle = 'rgba(236,236,236,' + (gd.base * (0.5 + hv * 0.5)).toFixed(3) + ')';
      ctx.fillRect(gd.fx * w, gd.fy * h, gd.s, gd.s);
    }

    // ---- Vignette edges: nested flat-alpha frames, never gradients ----
    for (var v = 0; v < 6; v++) {
      ctx.strokeStyle = 'rgba(0,0,0,' + (0.03 + v * 0.012).toFixed(3) + ')';
      ctx.lineWidth = Math.max(4, S * 0.012);
      ctx.strokeRect(v * S * 0.02, v * S * 0.02, w - v * S * 0.04, h - v * S * 0.04);
    }
  }

  // Pointer handlers: drag moves the script glyphs; release decays back.
  function pd(e) {
    var x = (e.clientX !== undefined) ? e.clientX : 0;
    var y = (e.clientY !== undefined) ? e.clientY : 0;
    var cur = currentOffset(nowT);
    drag = { startX: x, startY: y, accX: cur.x, accY: cur.y };
    dragOff.x = cur.x; dragOff.y = cur.y;
    dragRel = null;
  }
  function pm(e) {
    if (!drag) return;
    var x = (e.clientX !== undefined) ? e.clientX : 0;
    var y = (e.clientY !== undefined) ? e.clientY : 0;
    dragOff.x = drag.accX + (x - drag.startX);
    dragOff.y = drag.accY + (y - drag.startY);
  }
  function pu(e) {
    if (!drag) return;
    var x = (e.clientX !== undefined) ? e.clientX : drag.startX;
    var y = (e.clientY !== undefined) ? e.clientY : drag.startY;
    dragRel = { t: nowT, x: drag.accX + (x - drag.startX), y: drag.accY + (y - drag.startY) };
    drag = null;
  }
  // currentOffset must read the in-progress drag totals:
  currentOffset = function (t) {
    if (drag) return { x: dragOff.x, y: dragOff.y };
    return decayedOffset(t);
  };

  canvas.addEventListener('pointerdown', pd);
  canvas.addEventListener('pointermove', pm);
  canvas.addEventListener('pointerup', pu);
  canvas.addEventListener('pointercancel', pu);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { draw(nowT); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(nowT); });
    }
  }

  // Boot: frame one is draw(0) at a constant phase; the clock starts only
  // with the rAF loop. No Date.now() / performance.now() in frame one.
  draw(0);
  var t0 = null;
  function loop(ts) {
    if (t0 === null) t0 = ts;
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
