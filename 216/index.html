<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.216 Night Pilot</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#04060A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.216 Night Pilot (David Bowen). A plant is the pilot: two slow
// noise channels, the variable resistance of its leaves, steer a
// drone through the night sky, and the drone's amber light draws a
// long-exposure trail behind it. The trail is the whole drawing,
// and it is always dissolving: each point of light fades over
// about twenty five seconds. When a flight's trail has fully faded
// the drone hovers, breathes, and a new plant takes over with a
// new signal. Double tap for a new plant at once; drag near the
// drone to nudge it off course for a moment.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#04060A';
var HEAD = '#FFF2CC';
var TRAIL_A = [232, 180, 92], TRAIL_B = [58, 42, 18]; // #E8B45C -> #3A2A12
var W = 0, H = 0, phone = false;
var seed = 216216;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
var T = 0, lastNow = -1;

// ---- the plant: two slow resistance channels -------------------------------------------
// Each channel is layered sines at incommensurate rates: the pair
// never repeats, the velocity vector keeps rotating through the
// quadrants, and the flight comes out as loops, dives and glides
// rather than one held direction. plantOff rephases both channels,
// so every new plant flies a genuinely different hand.
var plantOff = 0; // grows by 1000 per plant, so each pilot differs
function leafSignal(t) {
  var p = plantOff;
  var a = Math.sin(t * 0.55 + p * 0.731) * 0.58
        + Math.sin(t * 0.89 + p * 1.37 + 2.1) * 0.30
        + Math.sin(t * 2.49 + p * 2.11) * 0.12;
  var b = Math.sin(t * 0.44 + p * 1.93 + 4.2) * 0.58
        + Math.sin(t * 0.78 + p * 0.57) * 0.30
        + Math.sin(t * 2.15 + p * 2.71 + 1.3) * 0.12;
  return { a: clamp(a, -1, 1), b: clamp(b, -1, 1) };
}

// ---- the drone --------------------------------------------------------------------------------
var FADE = 25;
var drone = null;      // {x, y, vx, vy} in normalised coords
var trail = [];        // {x, y, age}
var flightT = 0, flightPhase = 'fly', phaseAge = 0;
var nudge = null;      // {x, y, age} a hand's disturbance, normalised
function resetDrone() {
  drone = {
    x: 0.3 + rand() * 0.4, y: 0.3 + rand() * 0.4,
    vx: (rand() - 0.5) * 0.05, vy: (rand() - 0.5) * 0.05
  };
  flightT = 0; flightPhase = 'fly'; phaseAge = 0;
}
resetDrone();
function stepDrone(dt) {
  phaseAge += dt;
  flightT += dt;
  if (flightPhase === 'hover') {
    // the old trail is gone; the drone hangs, trembling on its signal
    drone.vx *= (1 - 3 * dt); drone.vy *= (1 - 3 * dt);
    drone.x += drone.vx * dt + Math.sin(T * 9) * 0.00035;
    drone.y += drone.vy * dt + Math.cos(T * 7.3) * 0.00035;
    if (phaseAge > 3) { plantOff += 1000; trail = []; flightPhase = 'fly'; phaseAge = 0; flightT = 0; }
    ageTrail(dt);
    return;
  }
  var sig = leafSignal(flightT);
  var tvx = sig.a * 0.13, tvy = sig.b * 0.10;
  // soft boundary turns: the signal bends before the edge arrives
  var m = 0.13;
  if (drone.x < m) tvx += (m - drone.x) * 0.55;
  if (drone.x > 1 - m) tvx -= (drone.x - (1 - m)) * 0.55;
  if (drone.y < m) tvy += (m - drone.y) * 0.55;
  if (drone.y > 1 - m) tvy -= (drone.y - (1 - m)) * 0.55;
  // a nudge: repelled from the hand, decaying as the plant reasserts
  if (nudge) {
    nudge.age += dt;
    var ndx = drone.x - nudge.x, ndy = drone.y - nudge.y;
    var nd = Math.sqrt(ndx * ndx + ndy * ndy);
    if (nd < 0.22 && nd > 0.001) {
      var nf = (1 - nd / 0.22) * Math.exp(-nudge.age * 0.55) * 0.16;
      tvx += ndx / nd * nf; tvy += ndy / nd * nf;
    }
    if (nudge.age > 4) nudge = null;
  }
  drone.vx += (tvx - drone.vx) * Math.min(1, dt * 2.4);
  drone.vy += (tvy - drone.vy) * Math.min(1, dt * 2.4);
  drone.x += drone.vx * dt; drone.y += drone.vy * dt;
  drone.x = clamp(drone.x, 0.02, 0.98); drone.y = clamp(drone.y, 0.02, 0.98);
  trail.push({ x: drone.x, y: drone.y, age: 0 });
  ageTrail(dt);
  // when this flight's light has fully faded behind it, rest
  if (flightT > FADE + 14) { flightPhase = 'hover'; phaseAge = 0; }
}
function ageTrail(dt) {
  for (var i = trail.length - 1; i >= 0; i--) {
    trail[i].age += dt;
    if (trail[i].age > FADE) trail.splice(i, 1);
  }
  if (trail.length > 2600) trail.splice(0, trail.length - 2600);
}
// pre-run: frame one is mid-flight, the trail already wandering,
// its older reaches half faded
(function preRun() {
  var saveT = T;
  for (var i = 0; i < 1500; i++) { T = i / 60; stepDrone(1 / 60); }
  T = saveT;
})();

// ---- input -------------------------------------------------------------------------------------
var dragging = false, lastDownT = -9;
canvas.addEventListener('pointerdown', function (e) {
  var nx = e.clientX / Math.max(1, W), ny = e.clientY / Math.max(1, H);
  if (T - lastDownT < 0.35) {
    plantOff += 1000; trail = []; resetDrone(); // a new plant
    lastDownT = -9;
  } else {
    lastDownT = T;
    dragging = true;
    if (drone) {
      var dx = nx - drone.x, dy = ny - drone.y;
      if (dx * dx + dy * dy < 0.22 * 0.22) nudge = { x: nx, y: ny, age: 0 };
    }
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var nx = e.clientX / Math.max(1, W), ny = e.clientY / Math.max(1, H);
  if (drone) {
    var dx = nx - drone.x, dy = ny - drone.y;
    if (dx * dx + dy * dy < 0.22 * 0.22) nudge = { x: nx, y: ny, age: 0 };
  }
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- resize -----------------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing -------------------------------------------------------------------------------------------
function trailColour(age) {
  var k = clamp(age / FADE, 0, 1);
  var ease = k * k * (3 - 2 * k);
  var r = Math.round(lerp(TRAIL_A[0], TRAIL_B[0], ease));
  var g = Math.round(lerp(TRAIL_A[1], TRAIL_B[1], ease));
  var b = Math.round(lerp(TRAIL_A[2], TRAIL_B[2], ease));
  return 'rgba(' + r + ',' + g + ',' + b + ',' + (1 - k * 0.55).toFixed(3) + ')';
}
function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && time > 0) { var dt = Math.min(0.05, (time - lastNow) / 1000); T += dt; stepDrone(dt); }
  lastNow = time;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // the trail: a fading polyline, drawn in runs of like age
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var lw = Math.max(1.3, Math.min(W, H) * 0.0032);
  for (var i = 1; i < trail.length; i++) {
    var p = trail[i], q = trail[i - 1];
    if (Math.abs(p.x - q.x) > 0.06 || Math.abs(p.y - q.y) > 0.06) continue; // a splice, not a stroke
    ctx.strokeStyle = trailColour(p.age);
    ctx.lineWidth = lw * (1 - clamp(p.age / FADE, 0, 1) * 0.45);
    ctx.beginPath();
    ctx.moveTo(q.x * W, q.y * H);
    ctx.lineTo(p.x * W, p.y * H);
    ctx.stroke();
  }
  // the drone: a small bright point with a soft glow, riding the head
  if (drone) {
    var hx = drone.x * W, hy = drone.y * H;
    var gs = Math.min(W, H) * 0.034;
    var gr = ctx.createRadialGradient(hx, hy, 0, hx, hy, gs);
    gr.addColorStop(0, 'rgba(255,242,204,0.85)');
    gr.addColorStop(0.25, 'rgba(232,180,92,0.32)');
    gr.addColorStop(1, 'rgba(232,180,92,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(hx, hy, gs, 0, 6.2832); ctx.fill();
    ctx.fillStyle = HEAD;
    ctx.beginPath(); ctx.arc(hx, hy, Math.max(1.8, Math.min(W, H) * 0.0042), 0, 6.2832); ctx.fill();
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
