<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tremble Staves</title>
<style>
  html, body { margin: 0; padding: 0; background: #05080C; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- seeded PRNG (mulberry32), never Math.random ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1362000);

  // ---- viewport (Visual Viewport API, pinned canvas) ----
  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof visualViewport !== 'undefined') ? visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    if (!w) w = 1280; if (!h) h = 900;
    W = w; H = h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var minDim = Math.min(window.screen.width, window.screen.height);
    phone = (minDim < 700) || (H > W * 1.15);
    try { document.body.style.background = '#05080C'; } catch (e) {}
  }
  size();
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { size(); draw(clockT); });
    if (typeof visualViewport !== 'undefined' && visualViewport.addEventListener) {
      visualViewport.addEventListener('resize', function () { size(); draw(clockT); });
    }
  }

  // ---- seeded field data ----
  var stars = [];
  for (var i = 0; i < 90; i++) {
    stars.push({ x: rng(), y: rng() * 0.55, r: 0.6 + rng() * 1.3, a: 0.25 + rng() * 0.6, p: rng() * 6.28 });
  }
  // Ambient standing-pool ripple sources (fixed, periodic).
  var pools = [];
  for (var j = 0; j < 7; j++) {
    pools.push({ x: 0.06 + rng() * 0.88, y: 0.66 + rng() * 0.30, ph: rng() * 6.28, per: 7 + rng() * 6 });
  }
  // Cello speckle / wear, seeded once.
  var wear = [];
  for (var k = 0; k < 26; k++) {
    wear.push({ x: (rng() - 0.5) * 0.8, y: (rng() - 0.5) * 0.8, r: 1 + rng() * 3, a: 0.10 + rng() * 0.18 });
  }

  // ---- interaction state (recorded events only) ----
  var dragRipples = [];   // {x, y, t0} in pixels, piece time
  var celloTouches = {};  // pointerId -> {x, y} while held on the cello
  var dragLast = null;    // last drag sample for path interpolation
  var clockT = 0;         // piece time in seconds (set by rAF; 0 at boot)

  function celloGeom() {
    var horizon = H * 0.60;
    var base = Math.min(W, H);
    var s = base * 0.30;              // cello body height-ish scale
    var cx = W * 0.5 + towOffset(clockT);
    var bob = Math.sin(clockT * (2 * Math.PI / 6.0)) * 3.5;
    var tilt = Math.sin(clockT * (2 * Math.PI / 9.0) + 1.2) * 0.03;
    return { cx: cx, top: horizon - s * 0.62 + bob, s: s, tilt: tilt, horizon: horizon };
  }
  function celloHit(x, y) {
    var g = celloGeom();
    var dx = (x - g.cx) / (g.s * 0.38);
    var dy = (y - (g.top + g.s * 0.69)) / (g.s * 0.62);
    return (dx * dx + dy * dy) <= 1;
  }

  // Bird crossing: 48 s loop, crosses left->right during phase 10-22 s.
  function birdState(t) {
    var ph = t % 48;
    if (ph < 10 || ph > 22) return null;
    var u = (ph - 10) / 12;
    return { x: -0.12 * W + u * 1.24 * W, y: H * (0.20 + 0.05 * Math.sin(u * Math.PI)), flap: Math.sin(t * 14) };
  }
  // Cello is towed slightly toward the bird while it passes, eases back after.
  function towOffset(t) {
    var b = birdState(t);
    if (b) {
      var cx = W * 0.5;
      var d = (b.x - cx) / W;
      return Math.max(-0.10, Math.min(0.10, d * 0.35)) * W;
    }
    var ph = t % 48;
    if (ph >= 22 && ph < 30) {
      var v = (ph - 22) / 8;
      return 0.10 * W * (1 - v) * (ph < 22 ? 1 : 1); // ease back to center
    }
    return 0;
  }

  // ---- audio: lazy, gesture-held only ----
  var actx = null, voices = {};
  function ensureAudio() {
    if (actx) return true;
    try {
      var AC = (typeof AudioContext !== 'undefined') ? AudioContext : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if (!AC) return false;
      actx = new AC();
      return true;
    } catch (e) { return false; }
  }
  function updateVoices() {
    if (!actx) return;
    var ids = Object.keys(celloTouches);
    var n = ids.length;
    // Fret (1 touch): single low voice. Fret + bow (2+ touches): harmony pair.
    var targets = [];
    if (n >= 1) targets.push(98.0);
    if (n >= 2) targets.push(146.8);
    var keys = Object.keys(voices);
    for (var i = 0; i < keys.length; i++) {
      var f = parseFloat(keys[i]);
      if (targets.indexOf(f) < 0) {
        try { voices[keys[i]].osc.stop(); } catch (e) {}
        try { voices[keys[i]].gain.disconnect(); } catch (e) {}
        delete voices[keys[i]];
      }
    }
    for (var j = 0; j < targets.length; j++) {
      var fr = targets[j];
      if (!voices[fr]) {
        try {
          var osc = actx.createOscillator();
          osc.type = (j === 0) ? 'sawtooth' : 'triangle';
          osc.frequency.value = fr;
          var flt = actx.createBiquadFilter();
          flt.type = 'lowpass'; flt.frequency.value = 420;
          var gn = actx.createGain();
          gn.gain.value = 0.0;
          osc.connect(flt); flt.connect(gn); gn.connect(actx.destination);
          osc.start();
          gn.gain.linearRampToValueAtTime(0.05, actx.currentTime + 0.4);
          voices[fr] = { osc: osc, gain: gn };
        } catch (e) {}
      }
    }
  }
  function stopVoices() {
    var keys = Object.keys(voices);
    for (var i = 0; i < keys.length; i++) {
      try { voices[keys[i]].osc.stop(); } catch (e) {}
      try { voices[keys[i]].gain.disconnect(); } catch (e) {}
    }
    voices = {};
  }

  // ---- pointer handling ----
  function evPos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    return r;
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = evPos(e);
    if (celloHit(p.x, p.y)) {
      celloTouches[e.pointerId] = p;
      if (ensureAudio()) updateVoices();
    } else if (p.y > H * 0.60) {
      dragRipples.push({ x: p.x, y: p.y, t0: clockT });
      dragLast = p;
    }
    try { e.preventDefault(); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = evPos(e);
    if (celloTouches[e.pointerId]) { celloTouches[e.pointerId] = p; return; }
    if (dragLast && p.y > H * 0.58) {
      var dx = p.x - dragLast.x, dy = p.y - dragLast.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 24) {
        dragRipples.push({ x: p.x, y: p.y, t0: clockT });
        dragLast = p;
      }
    }
  });
  function endPointer(e) {
    if (celloTouches[e.pointerId]) {
      delete celloTouches[e.pointerId];
      if (Object.keys(celloTouches).length === 0) stopVoices(); else updateVoices();
    }
    dragLast = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---- drawing helpers ----
  function ellipse(cx, cy, rx, ry) {
    ctx.beginPath();
    ctx.moveTo(cx + rx, cy);
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  }
  function drawCello(g) {
    var s = g.s, cx = g.cx, top = g.top;
    ctx.save();
    ctx.translate(cx, top + s * 0.55);
    ctx.rotate(g.tilt);
    ctx.translate(-cx, -(top + s * 0.55));
    // Neck + scroll (above body).
    ctx.fillStyle = '#3E3630';
    ctx.fillRect(cx - s * 0.045, top - s * 0.42, s * 0.09, s * 0.48);
    ctx.beginPath();
    ctx.arc(cx, top - s * 0.44, s * 0.075, 0, Math.PI * 2);
    ctx.fillStyle = '#2B2119'; ctx.fill();
    // Body: single waisted outline (upper bout, pinched waist, lower bout).
    ctx.fillStyle = '#E8E0D0';
    ctx.beginPath();
    ctx.moveTo(cx, top + s * 0.08);
    ctx.bezierCurveTo(cx + s * 0.30, top + s * 0.10, cx + s * 0.32, top + s * 0.50, cx + s * 0.20, top + s * 0.66);
    ctx.bezierCurveTo(cx + s * 0.12, top + s * 0.74, cx + s * 0.12, top + s * 0.80, cx + s * 0.20, top + s * 0.88);
    ctx.bezierCurveTo(cx + s * 0.36, top + s * 1.00, cx + s * 0.36, top + s * 1.22, cx, top + s * 1.30);
    ctx.bezierCurveTo(cx - s * 0.36, top + s * 1.22, cx - s * 0.36, top + s * 1.00, cx - s * 0.20, top + s * 0.88);
    ctx.bezierCurveTo(cx - s * 0.12, top + s * 0.80, cx - s * 0.12, top + s * 0.74, cx - s * 0.20, top + s * 0.66);
    ctx.bezierCurveTo(cx - s * 0.32, top + s * 0.50, cx - s * 0.30, top + s * 0.10, cx, top + s * 0.08);
    ctx.closePath(); ctx.fill();
    // Rust wear patches (flat alpha).
    ctx.fillStyle = 'rgba(138,75,42,0.25)';
    for (var i = 0; i < wear.length; i++) {
      var w = wear[i];
      ctx.beginPath();
      ctx.arc(cx + w.x * s, top + s * 0.70 + w.y * s, w.r * (s / 90), 0, Math.PI * 2);
      ctx.fill();
    }
    // F-holes: two short slanted strokes flanking the strings.
    ctx.strokeStyle = '#3E3630'; ctx.lineWidth = Math.max(1, s * 0.014);
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.15, top + s * 0.58);
    ctx.quadraticCurveTo(cx - s * 0.11, top + s * 0.72, cx - s * 0.14, top + s * 0.86);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.15, top + s * 0.58);
    ctx.quadraticCurveTo(cx + s * 0.11, top + s * 0.72, cx + s * 0.14, top + s * 0.86);
    ctx.stroke();
    // Strings: 4 lines from scroll to tailpiece.
    ctx.strokeStyle = 'rgba(43,33,25,0.85)'; ctx.lineWidth = Math.max(1, s * 0.008);
    for (var k = -1.5; k <= 1.5; k++) {
      ctx.beginPath();
      ctx.moveTo(cx + k * s * 0.022, top - s * 0.40);
      ctx.lineTo(cx + k * s * 0.045, top + s * 1.18);
      ctx.stroke();
    }
    // Tailpiece.
    ctx.fillStyle = '#3E3630';
    ctx.fillRect(cx - s * 0.09, top + s * 1.02, s * 0.18, s * 0.16);
    ctx.restore();
  }
  function drawBird(b) {
    ctx.save();
    // Silhouette slightly lighter than the night sky so it reads against it.
    ctx.fillStyle = '#16202E';
    // Body + head + beak + flapping wings, silhouette only.
    ellipse(b.x, b.y, 26, 11); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x + 24, b.y - 8, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(b.x + 30, b.y - 9); ctx.lineTo(b.x + 42, b.y - 5); ctx.lineTo(b.x + 30, b.y - 3);
    ctx.closePath(); ctx.fill();
    var flap = b.flap * 14;
    ctx.beginPath();
    ctx.moveTo(b.x - 4, b.y - 2);
    ctx.quadraticCurveTo(b.x - 22, b.y - 26 - flap, b.x - 40, b.y - 12 - flap);
    ctx.quadraticCurveTo(b.x - 20, b.y - 2, b.x - 4, b.y - 2);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(b.x - 4, b.y + 2);
    ctx.quadraticCurveTo(b.x - 20, b.y + 22 + flap, b.x - 36, b.y + 12 + flap);
    ctx.quadraticCurveTo(b.x - 18, b.y + 2, b.x - 4, b.y + 2);
    ctx.closePath(); ctx.fill();
    // Tether line to the cello while passing near it.
    var g = celloGeom();
    if (Math.abs(b.x - g.cx) < W * 0.30) {
      ctx.strokeStyle = 'rgba(232,224,208,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(b.x - 6, b.y + 4); ctx.lineTo(g.cx, g.top + g.s * 0.2); ctx.stroke();
    }
    ctx.restore();
  }
  function drawRipples(t) {
    var horizon = H * 0.60;
    ctx.strokeStyle = '#DCE8E4';
    // Ambient standing-pool rings (periodic, closed-form).
    for (var i = 0; i < pools.length; i++) {
      var p = pools[i];
      var ph = ((t % p.per) / p.per);
      var r = 6 + ph * 46;
      ctx.globalAlpha = 0.20 * (1 - ph);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(p.x * W, p.y * H, r, r * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Drag disturbances: expanding rings, 6 s life, pruned by age.
    var keep = [];
    for (var j = 0; j < dragRipples.length; j++) {
      var d = dragRipples[j];
      var age = t - d.t0;
      if (age < 0 || age > 6) continue;
      keep.push(d);
      var rr = 4 + age * 26;
      ctx.globalAlpha = 0.55 * (1 - age / 6);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, rr, rr * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 0.30 * (1 - age / 6);
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, rr * 0.6, rr * 0.19, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    dragRipples = keep;
    ctx.globalAlpha = 1;
    // Horizon foam line + foam ring around the cello waterline.
    var g = celloGeom();
    ctx.fillStyle = 'rgba(220,232,228,0.20)';
    ctx.fillRect(0, horizon - 1, W, 2);
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = '#DCE8E4'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(g.cx, horizon + 2, g.s * 0.42, 7, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- main draw: pure function of piece time t + recorded events ----
  function draw(t) {
    clockT = t;
    var horizon = H * 0.60;
    // Sky.
    ctx.fillStyle = '#05080C';
    ctx.fillRect(0, 0, W, horizon + 1);
    // Stars (twinkle = closed-form sine).
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = st.a * (0.75 + 0.25 * Math.sin(t * 0.7 + st.p));
      ctx.fillStyle = '#DCE8E4';
      ctx.beginPath();
      ctx.arc(st.x * W, st.y * H, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Water base.
    ctx.fillStyle = '#0E2A38';
    ctx.fillRect(0, horizon, W, H - horizon);
    // Cello (full), then submerged tint over the water half.
    var g = celloGeom();
    drawCello(g);
    ctx.fillStyle = 'rgba(14,42,56,0.45)';
    ctx.fillRect(0, horizon, W, H - horizon);
    // Touch markers on the cello: fret dot / bow glow.
    var ids = Object.keys(celloTouches);
    for (var k = 0; k < ids.length; k++) {
      var tp = celloTouches[ids[k]];
      ctx.fillStyle = (ids.length >= 2) ? 'rgba(232,224,208,0.55)' : 'rgba(232,224,208,0.35)';
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, ids.length >= 2 ? 14 : 9, 0, Math.PI * 2);
      ctx.fill();
    }
    // Ripples + foam.
    drawRipples(t);
    // Bird on its fixed clock.
    var b = birdState(t);
    if (b) drawBird(b);
  }

  // ---- boot: synchronous first frame at t = 0, clock starts with rAF ----
  draw(0);
  function loop(ts) {
    if (typeof loop.start === 'undefined') loop.start = ts;
    draw((ts - loop.start) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
