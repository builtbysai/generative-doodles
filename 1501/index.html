<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walking the Cut</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var CHARCOAL = '#2a2a30';
  var SKY = '#b8bcc0';
  var GOLD = '#d9a441';
  var CREAM = '#e8e0d0';

  var PERIODS = [7, 11, 17];
  var OFFSETS = [0, 4.07, 12.07];

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1501000);
  // Seeded per-screen post jitter, fixed for the whole piece life.
  var POST_JITTER = [];
  var s;
  for (s = 0; s < 3; s++) {
    POST_JITTER.push([]);
    var k;
    for (k = 0; k < 16; k++) { POST_JITTER[s].push((rng() - 0.5) * 2); }
  }

  var W = 0, H = 0;
  var drags = [];       // completed drags: {dx}
  var activeDrag = null; // {x0, baseX}
  var bootDone = false;

  function viewport() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1280; h = 720; }
    return { w: w, h: h };
  }

  function isPhone() {
    if (typeof window !== 'undefined' && window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) { return true; }
    }
    return H > W * 1.15;
  }

  function resize() {
    var v = viewport();
    W = v.w; H = v.h;
    canvas.width = W; canvas.height = H;
    draw(0);
  }

  function r4(x) {
    return Math.round(x * 10000) / 10000;
  }

  function layout() {
    var phone = isPhone();
    var marginX = W * 0.04;
    var gap = W * 0.02;
    var totalW = W - marginX * 2;
    var sw = (totalW - gap * 2) / 3;
    var top = H * 0.05;
    var bottom = phone ? H * 0.80 : H * 0.78;
    var screens = [];
    var i;
    for (i = 0; i < 3; i++) {
      screens.push({ x: marginX + i * (sw + gap), y: top, w: sw, h: bottom - top });
    }
    return { screens: screens, frame: 6, phone: phone };
  }

  function viewerXAt(t) {
    var base = W * 0.5;
    var x = base;
    var i;
    for (i = 0; i < drags.length; i++) { x += drags[i].dx; }
    if (activeDrag) { x += activeDrag.dx; }
    var lo = W * 0.08, hi = W * 0.92;
    if (x < lo) { x = lo; }
    if (x > hi) { x = hi; }
    return x;
  }

  function phaseAt(i, t) {
    var p = ((t + OFFSETS[i]) % PERIODS[i]) / PERIODS[i];
    if (p < 0) { p += 1; }
    return p;
  }

  function circDist(a, b) {
    var d = Math.abs(a - b);
    if (d > 0.5) { d = 1 - d; }
    return d;
  }

  function alignedAt(t) {
    var p0 = phaseAt(0, t), p1 = phaseAt(1, t), p2 = phaseAt(2, t);
    var m = Math.max(circDist(p0, p1), circDist(p0, p2), circDist(p1, p2));
    return m < 0.08;
  }

  function brightnessAt(i, t) {
    var L = layout();
    var cx = L.screens[i].x + L.screens[i].w / 2;
    var d = Math.abs(viewerXAt(t) - cx) / W;
    var f = 0.85 + 0.30 * Math.exp(-((d / 0.18) * (d / 0.18)));
    return f;
  }

  function drawFence(sc, si, lt, period) {
    var p = lt / period;
    var ix = sc.x, iy = sc.y, iw = sc.w, ih = sc.h;
    // Clip to the screen interior: a gate travelling off one edge must
    // never spill its gate posts onto the neighbouring screen.
    ctx.save();
    ctx.beginPath();
    ctx.rect(ix, iy, iw, ih);
    ctx.clip();
    ctx.fillStyle = SKY;
    ctx.fillRect(ix, iy, iw, ih);
    var baseY = iy + ih * 0.85;
    var topY = iy + ih * 0.35;
    var fenceH = baseY - topY;
    var nPosts = 14;
    var spacing = iw / nPosts;
    var gapW = spacing * 3;
    var gapCX = ix - gapW / 2 + p * (iw + gapW);
    // Ground line.
    ctx.fillStyle = CHARCOAL;
    ctx.fillRect(ix, baseY, iw, 2);
    // Rails, broken at the gate gap.
    var railY1 = topY + fenceH * 0.25;
    var railY2 = topY + fenceH * 0.60;
    var r;
    for (r = 0; r < 2; r++) {
      var ry = (r === 0) ? railY1 : railY2;
      ctx.fillStyle = CHARCOAL;
      if (gapCX - gapW / 2 > ix) { ctx.fillRect(ix, ry, (gapCX - gapW / 2) - ix, 3); }
      if (gapCX + gapW / 2 < ix + iw) { ctx.fillRect(gapCX + gapW / 2, ry, (ix + iw) - (gapCX + gapW / 2), 3); }
    }
    // Posts, omitted inside the gate gap, with seeded height jitter.
    var j;
    for (j = 0; j < nPosts; j++) {
      var px = ix + spacing * (j + 0.5);
      if (Math.abs(px - gapCX) < gapW / 2) { continue; }
      var jit = POST_JITTER[si][j % 16];
      var ph = fenceH * (1 + jit * 0.04);
      ctx.fillStyle = CHARCOAL;
      ctx.fillRect(px - 2, baseY - ph, 4, ph);
      // Post cap dot: filled rect, never a batched arc.
      ctx.fillRect(px - 2, baseY - ph - 3, 4, 3);
    }
    // Gate marker: two slightly taller gate posts framing the gap.
    ctx.fillStyle = CHARCOAL;
    ctx.fillRect(gapCX - gapW / 2 - 2, baseY - fenceH * 1.06, 4, fenceH * 1.06);
    ctx.fillRect(gapCX + gapW / 2 - 2, baseY - fenceH * 1.06, 4, fenceH * 1.06);
    ctx.restore();
  }

  function drawViewer(vx) {
    var u = Math.min(W, H);
    var baseY = H * 0.97;
    var hh = u * 0.055;
    var bw = u * 0.035;
    // Body: flat sky-grey rect on the charcoal gallery floor.
    ctx.fillStyle = SKY;
    ctx.fillRect(vx - bw / 2, baseY - hh * 1.6, bw, hh * 1.6);
    // Head: own beginPath arc with a moveTo first (node-canvas quirk).
    ctx.beginPath();
    ctx.moveTo(vx + u * 0.022, baseY - hh * 1.6 - u * 0.022);
    ctx.arc(vx, baseY - hh * 1.6 - u * 0.022, u * 0.022, 0, Math.PI * 2);
    ctx.fillStyle = SKY;
    ctx.fill();
    // Feet line.
    ctx.fillStyle = SKY;
    ctx.fillRect(vx - bw, baseY - 2, bw * 2, 2);
  }

  function draw(t) {
    if (!W || !H) {
      var v = viewport();
      W = v.w; H = v.h;
      canvas.width = W; canvas.height = H;
    }
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var L = layout();
    ctx.fillStyle = CHARCOAL;
    ctx.fillRect(0, 0, W, H);
    var aligned = alignedAt(t);
    var i;
    for (i = 0; i < 3; i++) {
      var sc = L.screens[i];
      // Cream frame.
      ctx.fillStyle = CREAM;
      ctx.fillRect(sc.x - L.frame, sc.y - L.frame, sc.w + L.frame * 2, sc.h + L.frame * 2);
      var lt = (t + OFFSETS[i]) % PERIODS[i];
      if (lt < 0) { lt += PERIODS[i]; }
      drawFence(sc, i, lt, PERIODS[i]);
      // Brightness weight from viewer position: approached screen brightens,
      // others dim, via flat-alpha overlays only.
      var f = brightnessAt(i, t);
      if (f < 1) {
        ctx.fillStyle = 'rgba(42,42,48,' + r4(1 - f) + ')';
        ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
      } else if (f > 1) {
        ctx.fillStyle = 'rgba(232,224,208,' + r4((f - 1) * 0.5) + ')';
        ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
      }
      // Alignment flash: brief gold wash over all screens for one beat.
      if (aligned) {
        ctx.fillStyle = 'rgba(217,164,65,0.3)';
        ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
      }
    }
    drawViewer(viewerXAt(t));
  }

  function onDown(e) {
    var x = (e.clientX !== undefined) ? e.clientX : e.x;
    var y = (e.clientY !== undefined) ? e.clientY : e.y;
    var vx = viewerXAt(0);
    // Drag starts on the viewer-figure (generous grab zone, figure never
    // enters a screen: its row sits below the screens).
    if (Math.abs(x - vx) < W * 0.09 && y > H * 0.78) {
      activeDrag = { x0: x, dx: 0, base: vx };
    }
  }
  function onMove(e) {
    if (!activeDrag) { return; }
    var x = (e.clientX !== undefined) ? e.clientX : e.x;
    activeDrag.dx = x - activeDrag.x0;
  }
  function onUp() {
    if (!activeDrag) { return; }
    drags.push({ dx: activeDrag.dx });
    activeDrag = null;
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
  }

  // Probe API: drive the piece at forced times without touching the clock.
  if (typeof window !== 'undefined') {
    window.__piece = {
      drawAt: function (t) { draw(t); },
      phaseAt: phaseAt,
      alignedAt: alignedAt,
      brightnessAt: brightnessAt,
      viewerXAt: viewerXAt,
      pointerDown: onDown,
      pointerMove: onMove,
      pointerUp: onUp,
      layout: layout
    };
  }

  // Fixed-phase first frame.
  draw(0);
  bootDone = true;

  var startTime = null;
  function loop(ts) {
    if (startTime === null) { startTime = ts; }
    var t = (ts - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
