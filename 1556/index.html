<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind Chime</title>
<style>
html, body { margin: 0; padding: 0; background: #0d0d0d; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BG = [13, 13, 13];
var LINE = [242, 242, 242];
var N = 7;
var HALF = [0.44, 0.375, 0.31, 0.25, 0.19, 0.13, 0.075];
var VEL = [0.211, -0.127, 0.293, -0.071, 0.187, -0.233, 0.113];
var EASE_TAU = 0.8;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1556000);
var PHASE = [];
for (var pi = 0; pi < N; pi++) PHASE.push(rng() * TAU);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var drag = null;
var rel = [];
for (var ri = 0; ri < N; ri++) rel.push(null);
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function freeAngle(i, t) { return PHASE[i] + VEL[i] * t; }
function angleAt(i, t) {
  if (drag && drag.layer === i) return drag.grabAngle + drag.accum;
  var a = freeAngle(i, t);
  if (rel[i]) a += rel[i].off * Math.exp(-(t - rel[i].t0) / EASE_TAU);
  return a;
}
function wrapDelta(a, b) {
  var d = a - b;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return d;
}
function stateAt(t) {
  var minDim = Math.min(VW, VH);
  var cx = VW / 2, cy = VH / 2;
  var angles = [], half = [];
  for (var i = 0; i < N; i++) {
    angles.push(angleAt(i, t));
    half.push(HALF[i] * minDim);
  }
  return { cx: cx, cy: cy, minDim: minDim, angles: angles, half: half };
}
function publishHook(st) {
  if (typeof window !== 'undefined') {
    window.__p1556 = {
      angles: st.angles.slice(), half: st.half.slice(),
      cx: st.cx, cy: st.cy, minDim: st.minDim,
      dragLayer: drag ? drag.layer : null,
      offsets: rel.map(function (r) { return r ? r.off : 0; })
    };
  }
}
function draw(t) {
  lastT = t;
  size();
  var st = stateAt(t);
  ctx.fillStyle = rgb(BG);
  ctx.fillRect(0, 0, VW, VH);
  ctx.strokeStyle = rgb(LINE);
  ctx.lineWidth = Math.max(1, 0.0018 * st.minDim);
  for (var i = 0; i < N; i++) {
    var h = st.half[i];
    ctx.save();
    ctx.translate(st.cx, st.cy);
    ctx.rotate(st.angles[i]);
    ctx.strokeRect(-h, -h, 2 * h, 2 * h);
    ctx.restore();
  }
  publishHook(st);
}
function layerHit(x, y) {
  var st = stateAt(lastT);
  var dx = x - st.cx, dy = y - st.cy;
  var r = Math.sqrt(dx * dx + dy * dy);
  var th = Math.atan2(dy, dx);
  var tol = Math.max(12, 0.03 * st.minDim);
  var best = -1, bestDiff = Infinity;
  for (var i = 0; i < N; i++) {
    var a = st.angles[i];
    var ca = Math.abs(Math.cos(th - a)), sa = Math.abs(Math.sin(th - a));
    var d = st.half[i] / Math.max(ca, sa);
    var diff = Math.abs(r - d);
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  }
  return bestDiff <= tol ? best : -1;
}
function onDown(e) {
  var x = e.clientX, y = e.clientY;
  var li = layerHit(x, y);
  if (li >= 0) {
    var st = stateAt(lastT);
    var pa = Math.atan2(y - st.cy, x - st.cx);
    drag = { layer: li, grabAngle: st.angles[li], accum: 0, lastPA: pa };
    rel[li] = null;
  } else {
    drag = null;
  }
  publishHook(stateAt(lastT));
}
function onMove(e) {
  if (!drag) return;
  var st = stateAt(lastT);
  var pa = Math.atan2(e.clientY - st.cy, e.clientX - st.cx);
  drag.accum += wrapDelta(pa, drag.lastPA);
  drag.lastPA = pa;
  publishHook(stateAt(lastT));
}
function onUp(e) {
  if (drag) {
    var i = drag.layer;
    var held = drag.grabAngle + drag.accum;
    rel[i] = { t0: lastT, off: held - freeAngle(i, lastT) };
    drag = null;
  }
  publishHook(stateAt(lastT));
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
