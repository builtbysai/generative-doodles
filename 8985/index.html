<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Two Values · № 8985</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f5f1e6; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* ============================================================
   TWO VALUES · № 8985
   A virtual wall plotter living in two spaces at once.
   Two phase-shifted near-sine cable-length signals (the drive
   score, left) are resolved live into a gondola position by
   circle intersection, and the plotter draws its path (right).
   The signals and the drawing are the same piece of music.
   Click anywhere for a new seeded variation.
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const drawC = document.createElement('canvas');   // fading ink layer for the wall
const dctx = drawC.getContext('2d');

const TAU = Math.PI * 2;
const T = 60;                 // master period, seconds (seamless loop)
const MOTOR_CM = 120;         // imagined distance between motors, for readouts

const PALETTES = [
  { paper: '#f5f1e6', inkA: '#2a3a8c', inkB: '#b23c17', pen: '#22242c' },
  { paper: '#f1efe8', inkA: '#0e6e5c', inkB: '#a34d1c', pen: '#23262b' },
  { paper: '#edf0f2', inkA: '#1c5fa8', inkB: '#b02a4e', pen: '#20242c' },
  { paper: '#f4ecdc', inkA: '#6d4a12', inkB: '#1f6f8b', pen: '#26221c' }
];

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeParams(seed) {
  const r = mulberry32(seed);
  let k1 = 1 + ((r() * 3) | 0);
  let k2 = 1 + ((r() * 3) | 0);
  if (k2 === k1) k2 = (k2 % 3) + 1;
  const p1 = r() * TAU;
  let p2 = r() * TAU;
  const d = Math.abs(((p2 - p1 + Math.PI * 3) % TAU) - Math.PI);
  if (d < 0.55) p2 += 1.15;                       // keep the phase shift legible
  const A1 = 0.13 + r() * 0.06, A2 = 0.13 + r() * 0.06;   // amplitude, fraction of D
  const h1 = A1 * (0.10 + r() * 0.18), h2 = A2 * (0.10 + r() * 0.18); // 2nd harmonic
  return {
    pal: PALETTES[(r() * PALETTES.length) | 0],
    sig: [
      { k: k1, p: p1, A: A1, h: h1, pb: r() * TAU },
      { k: k2, p: p2, A: A2, h: h2, pb: r() * TAU }
    ]
  };
}

let seed = 271828;
let P = makeParams(seed);

let W = 0, H = 0, DPR = 1, mobile = false;
let geo = null;          // all layout geometry
let ghost = null;        // Path2D of the full-cycle planned path (wall coords)
let traces = [];         // per band: {fill, line, yMid, X, Y}
let t0 = performance.now();
let prevG = null;
let lastClick = 0;

const SERIF = "Georgia, 'Times New Roman', serif";
const MONO = "ui-monospace, 'SF Mono', Menlo, Consolas, monospace";

function signalVal(theta, i) {          // cable length, in units of motor separation D
  const s = P.sig[i];
  return 0.85 + s.A * Math.sin(s.k * theta + s.p) + s.h * Math.sin(2 * s.k * theta + s.pb);
}

function gondola(theta) {
  const D = geo.D;
  const L1 = signalVal(theta, 0) * D, L2 = signalVal(theta, 1) * D;
  let a = (L1 * L1 - L2 * L2 + D * D) / (2 * D);
  a = Math.min(Math.max(a, D * 0.06), D * 0.94);
  const h = Math.sqrt(Math.max(L1 * L1 - a * a, 36));
  const x = geo.motorX + a;
  const y = Math.min(geo.motorY + h, geo.wall.y + geo.wall.h - 26);
  return { x, y };
}

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  mobile = W < 720;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const m = mobile ? 14 : 26;
  const hh = mobile ? 56 : 80;
  const gap = mobile ? 10 : 22;
  let sig, wall;
  if (!mobile) {
    const availW = W - 2 * m - gap;
    const sigW = Math.round(availW * 0.56);
    sig = { x: m, y: hh, w: sigW, h: H - hh - m };
    wall = { x: m + sigW + gap, y: hh, w: availW - sigW, h: H - hh - m };
  } else {
    const availH = H - hh - m - gap;
    const sigH = Math.round(availH * 0.42);
    sig = { x: m, y: hh, w: W - 2 * m, h: sigH };
    wall = { x: m, y: hh + sigH + gap, w: W - 2 * m, h: availH - sigH };
  }

  // signal bands: label row, trace area, tick labels
  const bands = [];
  const bh = sig.h / 2;
  for (let i = 0; i < 2; i++) {
    const by = sig.y + i * bh;
    const labelH = mobile ? 18 : 24, tickH = mobile ? 12 : 16;
    bands.push({
      x: sig.x, y: by, w: sig.w, h: bh,
      trace: { x: sig.x + (mobile ? 10 : 16), y: by + labelH, w: sig.w - (mobile ? 20 : 32), h: bh - labelH - tickH },
      labelY: by + labelH - (mobile ? 5 : 7),
      tickY: by + bh - (mobile ? 3 : 5)
    });
  }

  // wall geometry
  const inset = mobile ? 16 : 26;
  const wr = { x: wall.x + inset, y: wall.y + inset, w: wall.w - inset * 2, h: wall.h - inset * 2 };
  const motorInset = mobile ? 14 : 18;
  const motorX = wr.x + motorInset, motorY = wr.y + (mobile ? 16 : 22);
  const D = wr.w - motorInset * 2;

  geo = { m, hh, gap, sig, wall, bands, wr, motorX, motorY, D };

  // fading ink layer, device pixels
  drawC.width = Math.max(2, Math.round(wr.w * DPR));
  drawC.height = Math.max(2, Math.round(wr.h * DPR));
  dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  dctx.clearRect(0, 0, wr.w, wr.h);

  buildGhost();
  buildTraces();
  prevG = null;
}

function buildGhost() {
  ghost = new Path2D();
  const N = 720;
  for (let i = 0; i <= N; i++) {
    const g = gondola((i / N) * TAU);
    if (i === 0) ghost.moveTo(g.x, g.y); else ghost.lineTo(g.x, g.y);
  }
  ghost.closePath();
}

function buildTraces() {
  traces = [];
  const N = 260;
  for (let b = 0; b < 2; b++) {
    const tr = geo.bands[b].trace;
    let ymin = Infinity, ymax = -Infinity;
    const vs = [];
    for (let i = 0; i <= N; i++) {
      const v = signalVal((i / N) * TAU, b);
      vs.push(v); ymin = Math.min(ymin, v); ymax = Math.max(ymax, v);
    }
    const pad = (ymax - ymin) * 0.18 + 1e-6;
    ymin -= pad; ymax += pad;
    const X = f => tr.x + f * tr.w;
    const Y = v => tr.y + tr.h - ((v - ymin) / (ymax - ymin)) * tr.h;
    const yMid = Y(0.85);
    const line = new Path2D(), fill = new Path2D();
    for (let i = 0; i <= N; i++) {
      const x = X(i / N), y = Y(vs[i]);
      if (i === 0) { line.moveTo(x, y); fill.moveTo(x, yMid); fill.lineTo(x, y); }
      else { line.lineTo(x, y); fill.lineTo(x, y); }
    }
    fill.lineTo(X(1), yMid); fill.closePath();
    traces.push({ line, fill, yMid, X, Y });
  }
}

function hairline(alpha) {
  return 'rgba(20,20,26,' + alpha + ')';
}

function drawPanelLabel(text, cx, y) {
  ctx.save();
  ctx.font = '500 ' + (mobile ? 9 : 10) + 'px ' + MONO;
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  const w = ctx.measureText(text).width + 30;
  ctx.fillStyle = P.pal.paper;
  ctx.fillRect(cx - w / 2, y - 8, w, 16);
  ctx.fillStyle = 'rgba(30,30,36,0.62)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, y + 1);
  ctx.restore();
}

function render(elapsed, dt) {
  const pal = P.pal;
  const theta = TAU * ((elapsed % T) / T);
  const L1 = signalVal(theta, 0) * geo.D, L2 = signalVal(theta, 1) * geo.D;
  const cmPerPx = MOTOR_CM / geo.D;

  ctx.fillStyle = pal.paper;
  ctx.fillRect(0, 0, W, H);

  /* ---------- header ---------- */
  const hx = geo.m, hy = mobile ? 34 : 50;
  ctx.fillStyle = '#1d1f26';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = (mobile ? 24 : 32) + 'px ' + SERIF;
  ctx.fillText('Two Values', hx, hy);
  ctx.save();
  ctx.font = '500 ' + (mobile ? 8.5 : 10) + 'px ' + MONO;
  try { ctx.letterSpacing = '2.5px'; } catch (e) {}
  ctx.fillStyle = 'rgba(30,30,36,0.55)';
  ctx.fillText('TWO DRIVE SIGNALS · ONE DRAWING MACHINE', hx, hy + (mobile ? 14 : 18));
  ctx.restore();

  ctx.textAlign = 'right';
  ctx.font = '500 ' + (mobile ? 10 : 12) + 'px ' + MONO;
  ctx.fillStyle = 'rgba(30,30,36,0.75)';
  ctx.fillText('№ 8985 · SEED ' + seed, W - hx, mobile ? 26 : 40);
  ctx.font = (mobile ? 9 : 10.5) + 'px ' + MONO;
  ctx.fillStyle = 'rgba(30,30,36,0.45)';
  ctx.fillText('click for a new seed', W - hx, mobile ? 40 : 58);
  ctx.textAlign = 'left';

  /* ---------- signal space ---------- */
  const s = geo.sig;
  ctx.strokeStyle = hairline(0.4); ctx.lineWidth = 1;
  ctx.strokeRect(s.x + 0.5, s.y + 0.5, s.w - 1, s.h - 1);
  drawPanelLabel('SIGNAL SPACE', s.x + s.w / 2, s.y);

  const playX = traces[0].X((elapsed % T) / T);
  const inks = [pal.inkA, pal.inkB];

  for (let b = 0; b < 2; b++) {
    const band = geo.bands[b], tr = band.trace, tc = traces[b];
    if (b === 1) {
      ctx.strokeStyle = hairline(0.28);
      ctx.beginPath(); ctx.moveTo(s.x + 8, band.y + 0.5); ctx.lineTo(s.x + s.w - 8, band.y + 0.5); ctx.stroke();
    }
    // label row: name left, live cable length right
    ctx.font = '500 ' + (mobile ? 9.5 : 11) + 'px ' + MONO;
    try { ctx.letterSpacing = '2px'; } catch (e) {}
    ctx.fillStyle = inks[b];
    ctx.fillText(b === 0 ? 'CABLE 1' : 'CABLE 2', tr.x, band.labelY);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(30,30,36,0.6)';
    const cm = (b === 0 ? L1 : L2) * cmPerPx;
    ctx.fillText(cm.toFixed(1) + ' cm', tr.x + tr.w, band.labelY);
    ctx.textAlign = 'left';
    try { ctx.letterSpacing = '0px'; } catch (e) {}

    // trace area frame
    ctx.strokeStyle = hairline(0.35);
    ctx.strokeRect(tr.x + 0.5, tr.y + 0.5, tr.w - 1, tr.h - 1);

    // wash + center line
    ctx.fillStyle = inks[b] + '22';
    ctx.fill(tc.fill);
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = hairline(0.3);
    ctx.beginPath(); ctx.moveTo(tr.x, tc.yMid); ctx.lineTo(tr.x + tr.w, tc.yMid); ctx.stroke();
    ctx.restore();

    // time ticks
    ctx.strokeStyle = hairline(0.35);
    ctx.font = (mobile ? 8 : 9) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(30,30,36,0.45)';
    ctx.textAlign = 'center';
    for (let i = 0; i <= 6; i++) {
      const tx = tr.x + (i / 6) * tr.w;
      ctx.beginPath(); ctx.moveTo(tx, tr.y + tr.h); ctx.lineTo(tx, tr.y + tr.h + 4); ctx.stroke();
      if (!mobile || i % 2 === 0) ctx.fillText(String(i * 10), tx, band.tickY);
    }
    if (!mobile) { ctx.textAlign = 'right'; ctx.fillText('s', tr.x + tr.w + 2, band.tickY); }
    ctx.textAlign = 'left';

    // the trace
    ctx.strokeStyle = inks[b];
    ctx.lineWidth = mobile ? 2 : 2.5;
    ctx.lineJoin = 'round';
    ctx.stroke(tc.line);
    ctx.lineWidth = 1;
  }

  // playhead across both bands
  ctx.strokeStyle = hairline(0.55);
  ctx.beginPath();
  ctx.moveTo(playX, geo.bands[0].trace.y);
  ctx.lineTo(playX, geo.bands[1].trace.y + geo.bands[1].trace.h);
  ctx.stroke();
  for (let b = 0; b < 2; b++) {
    const tc = traces[b];
    const y = tc.Y(signalVal(theta, b));
    ctx.fillStyle = inks[b];
    ctx.beginPath(); ctx.arc(playX, y, mobile ? 4 : 5, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.paper;
    ctx.beginPath(); ctx.arc(playX, y, mobile ? 1.6 : 2, 0, TAU); ctx.fill();
  }

  /* ---------- wall space ---------- */
  const wl = geo.wall, wr = geo.wr;
  ctx.strokeStyle = hairline(0.4); ctx.lineWidth = 1;
  ctx.strokeRect(wl.x + 0.5, wl.y + 0.5, wl.w - 1, wl.h - 1);
  drawPanelLabel('WALL SPACE', wl.x + wl.w / 2, wl.y);

  // planned path (the full cycle, hairline)
  ctx.strokeStyle = 'rgba(32,34,44,0.20)';
  ctx.stroke(ghost);

  // ink layer: fade old ink, add the new segment
  const g = gondola(theta);
  dctx.save();
  dctx.globalCompositeOperation = 'destination-out';
  dctx.fillStyle = 'rgba(0,0,0,' + (1 - Math.exp(-dt / 18)) + ')';
  dctx.fillRect(0, 0, wr.w, wr.h);
  dctx.restore();
  if (prevG) {
    dctx.save();
    dctx.translate(-wr.x, -wr.y);
    dctx.strokeStyle = pal.pen;
    dctx.globalAlpha = 0.85;
    dctx.lineWidth = mobile ? 1.6 : 2.1;
    dctx.lineCap = 'round'; dctx.lineJoin = 'round';
    dctx.beginPath(); dctx.moveTo(prevG.x, prevG.y); dctx.lineTo(g.x, g.y); dctx.stroke();
    dctx.restore();
  }
  prevG = g;

  // composite the ink
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(drawC, wr.x * DPR, wr.y * DPR, wr.w * DPR, wr.h * DPR);
  ctx.restore();

  // wall frame
  ctx.strokeStyle = hairline(0.45);
  ctx.strokeRect(wr.x + 0.5, wr.y + 0.5, wr.w - 1, wr.h - 1);

  // cables
  const motors = [
    { x: geo.motorX, y: geo.motorY, c: inks[0], n: '1' },
    { x: geo.motorX + geo.D, y: geo.motorY, c: inks[1], n: '2' }
  ];
  for (const mt of motors) {
    ctx.strokeStyle = mt.c; ctx.globalAlpha = 0.85; ctx.lineWidth = mobile ? 1.2 : 1.5;
    ctx.beginPath(); ctx.moveTo(mt.x, mt.y); ctx.lineTo(g.x, g.y); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 1;
  }

  // motors
  for (const mt of motors) {
    ctx.fillStyle = pal.paper;
    ctx.strokeStyle = '#1d1f26'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mt.x, mt.y, mobile ? 8 : 10, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1d1f26';
    ctx.beginPath(); ctx.arc(mt.x, mt.y, 2.2, 0, TAU); ctx.fill();
    ctx.font = (mobile ? 9 : 10) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(30,30,36,0.55)';
    ctx.textAlign = 'center';
    ctx.fillText(mt.n, mt.x, mt.y + (mobile ? 20 : 24));
    ctx.textAlign = 'left';
  }

  // gondola
  ctx.fillStyle = pal.paper;
  ctx.strokeStyle = '#1d1f26'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(g.x, g.y, mobile ? 5 : 6, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1d1f26';
  ctx.beginPath(); ctx.arc(g.x, g.y, 2.1, 0, TAU); ctx.fill();
}

let lastNow = 0;
function frame(now) {
  if (!lastNow) lastNow = now;
  const dt = Math.min((now - lastNow) / 1000, 0.1);
  lastNow = now;
  render((now - t0) / 1000, dt);
  requestAnimationFrame(frame);
}

function reseed(newSeed) {
  seed = newSeed;
  P = makeParams(seed);
  buildGhost();
  buildTraces();
  dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  dctx.clearRect(0, 0, geo.wr.w, geo.wr.h);
  prevG = null;
  t0 = performance.now();
}

window.addEventListener('resize', layout);
canvas.addEventListener('click', () => {
  const now = performance.now();
  if (now - lastClick < 400) return;
  lastClick = now;
  reseed(10000 + ((Math.random() * 90000) | 0));
});
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') reseed(10000 + ((Math.random() * 90000) | 0));
});

layout();
requestAnimationFrame(frame);
</script>
</body>
</html>
