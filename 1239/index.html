<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nothing To See Here</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0B0D; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1239 "Nothing To See Here" - Christina Battle study block CB8.
   After Battle + Adan De La Garza's Denver series (2013-2016): a dark
   exhibition room, a projection wall, four short curated programs with a
   leader countdown between reels, and wall text in their curatorial voice.
   Programs are given their full time; the visitor may assist the
   projectionist (skip) or reseed the order, never channel-surf.
   Ships silent by house rule: the "sound first" program is waveforms as
   image. Flat fills only; no pixel buffers; seeded hashes only. */

var T0 = 11;                 // fixed first-frame phase: program 1, local 8 s
var LEAD = 3;                // leader countdown before every program, seconds
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

var PAL = {
  room: '#0B0B0D', wall: '#131318', wallSide: '#0E0E12', floor: '#0D0D10',
  screenEdge: '#26262C', leader: '#F2EFE6', red: '#C23B2E',
  green: '#5FA88A', sepia: '#C4A87E', chalk: '#D8D4C8',
  card: '#141419', black: '#050506'
};
var SEP = { sky: '#E3D3AC', paper: '#EDE6D6', mid: '#A98F63',
            dark: '#6B543A', deep: '#4A3826', sand: '#C4A87E' };

/* ---------- seeded hash (integer, deterministic) ---------- */
function ih(a, b) {
  var x = ((a | 0) * 374761393 + (b | 0) * 668265263) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function step12(t) { return Math.floor(t * 12) / 12; }

/* ---------- time / interaction state ---------- */
function perfNow() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
}
var startPerf = perfNow();
var jump = 0;                // projectionist skips shift the piece clock
var salt = 0;                // double-tap reseeds the program order
function pieceNow() { return T0 + (perfNow() - startPerf) + jump; }

var dragging = false, downX = 0, downY = 0, curX = 0, curY = 0, downT = 0, lastTapT = -10;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; downX = curX = e.clientX; downY = curY = e.clientY; downT = perfNow();
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return; curX = e.clientX; curY = e.clientY;
});
function endPointer() {
  if (!dragging) return; dragging = false;
  var dx = curX - downX, dy = curY - downY, now = perfNow();
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    skip(dx < 0 ? 1 : -1);                       // swipe left = next reel
    lastTapT = -10;
  } else if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && now - downT < 0.4) {
    if (now - lastTapT < 0.32) { salt++; lastTapT = -10; }
    else lastTapT = now;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- program queue ---------- */
var PROGS = [
  { id: 'snap',    dur: 36, title: 'Found Photographs', line: 'found, not taken' },
  { id: 'sound',   dur: 36, title: 'Sound First',       line: 'sound first' },
  { id: 'syn',     dur: 40, title: 'Video Syndrome',    line: 'underrepresented mediums welcome' },
  { id: 'protest', dur: 30, title: 'Protest Etiquette', line: 'pay what you can' }
];
var CYCLE = 4 * LEAD + 36 + 36 + 40 + 30;        // 154 s
function perm(n, s) {
  var a = [], i, j, tmp;
  for (i = 0; i < n; i++) a.push(i);
  if (s === 0) return a;                         // salt 0 = canonical order
  for (i = n - 1; i > 0; i--) {
    j = Math.floor(ih(s * 131 + 7, i) * (i + 1)); tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function buildSegs() {
  var q = perm(4, salt), segs = [], pos = 0, i;
  for (i = 0; i < 4; i++) {
    var p = PROGS[q[i]];
    segs.push({ prog: p, leadStart: pos, progStart: pos + LEAD, end: pos + LEAD + p.dur });
    pos += LEAD + p.dur;
  }
  return segs;
}
function locate(cyc) {
  var segs = buildSegs(), i;
  for (i = 0; i < segs.length; i++) {
    if (cyc < segs[i].end) {
      return { seg: segs[i], idx: i, leader: cyc < segs[i].progStart,
               local: cyc - segs[i].progStart, leadLocal: cyc - segs[i].leadStart };
    }
  }
  var last = segs[segs.length - 1];
  return { seg: last, idx: segs.length - 1, leader: false, local: 0, leadLocal: 0 };
}
function skip(dir) {
  var now = pieceNow();
  var cyc = ((now % CYCLE) + CYCLE) % CYCLE;
  var loc = locate(cyc), segs = buildSegs(), target, delta;
  if (dir > 0) {
    target = segs[(loc.idx + 1) % 4].leadStart;
    delta = target - cyc; while (delta <= 0.001) delta += CYCLE;
  } else {
    target = (cyc - loc.seg.leadStart > 1.0) ? loc.seg.leadStart
                                              : segs[(loc.idx + 3) % 4].leadStart;
    delta = target - cyc; while (delta >= -0.001) delta -= CYCLE;
  }
  jump += delta;
}

/* ---------- small drawing helpers ---------- */
function rr(x, y, w, h) { ctx.fillRect(x, y, w, h); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function poly(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function seg2(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

/* ================= PROGRAM 1: SNAPSHOTS ================= */
function tinyFigure(x, y, s, col) {
  ctx.fillStyle = col;
  circ(x, y - s * 0.62, s * 0.20);
  rr(x - s * 0.13, y - s * 0.44, s * 0.26, s * 0.46);
}
function drawStill(x, y, w, h, idx) {
  var kind = idx % 5, v = Math.floor(idx / 5);
  ctx.fillStyle = SEP.sky; rr(x, y, w, h);
  if (kind === 0) {                                   /* beach */
    ctx.fillStyle = SEP.mid; rr(x, y + h * 0.52, w, h * 0.16);
    ctx.fillStyle = SEP.sand; rr(x, y + h * 0.68, w, h * 0.32);
    ctx.fillStyle = SEP.dark; circ(x + w * (0.24 + v * 0.1), y + h * 0.24, h * 0.075);
    ctx.strokeStyle = SEP.deep; ctx.lineWidth = Math.max(1.5, h * 0.008);
    for (var ln = 0; ln < 3; ln++)
      seg2(x + w * 0.06, y + h * (0.56 + ln * 0.045), x + w * 0.94, y + h * (0.545 + ln * 0.045));
    poly([x + w * 0.62, y + h * 0.70, x + w * 0.80, y + h * 0.70, x + w * 0.71, y + h * 0.545]);
    seg2(x + w * 0.71, y + h * 0.70, x + w * 0.71, y + h * 0.86);
    tinyFigure(x + w * 0.30, y + h * 0.86, h * 0.16, SEP.deep);
    tinyFigure(x + w * 0.38, y + h * 0.885, h * 0.125, SEP.dark);
    if (v > 0) tinyFigure(x + w * 0.55, y + h * 0.90, h * 0.14, SEP.deep);
  } else if (kind === 1) {                            /* birthday table */
    ctx.fillStyle = SEP.mid; rr(x, y + h * 0.66, w, h * 0.34);
    for (var b = 0; b < 7; b++) {
      ctx.fillStyle = b % 2 ? SEP.dark : SEP.deep;
      var bx = x + w * (0.07 + b * 0.135);
      poly([bx, y + h * 0.075, bx + w * 0.075, y + h * 0.075, bx + w * 0.0375, y + h * 0.20]);
    }
    ctx.strokeStyle = SEP.deep; ctx.lineWidth = Math.max(1.2, h * 0.006);
    seg2(x + w * 0.03, y + h * 0.06, x + w * 0.97, y + h * 0.06);
    for (var hd = 0; hd < 4; hd++) { ctx.fillStyle = SEP.deep; circ(x + w * (0.22 + hd * 0.19), y + h * 0.60, h * 0.052); }
    ctx.fillStyle = SEP.dark; rr(x + w * 0.10, y + h * 0.68, w * 0.80, h * 0.075);
    rr(x + w * 0.16, y + h * 0.755, w * 0.05, h * 0.20); rr(x + w * 0.79, y + h * 0.755, w * 0.05, h * 0.20);
    ctx.fillStyle = SEP.paper; rr(x + w * 0.415, y + h * 0.545, w * 0.17, h * 0.075);
    rr(x + w * 0.435, y + h * 0.475, w * 0.13, h * 0.07);
    ctx.strokeStyle = SEP.deep; ctx.lineWidth = Math.max(1.2, h * 0.007);
    for (var cd = 0; cd < 3; cd++) {
      var cx2 = x + w * (0.465 + cd * 0.05);
      seg2(cx2, y + h * 0.475, cx2, y + h * 0.425);
      ctx.fillStyle = SEP.mid; circ(cx2, y + h * 0.412, h * 0.013);
    }
  } else if (kind === 2) {                            /* the dog */
    ctx.fillStyle = SEP.mid; rr(x, y + h * 0.60, w, h * 0.40);
    ctx.strokeStyle = SEP.deep; ctx.lineWidth = Math.max(1.5, h * 0.009);
    seg2(x, y + h * 0.42, x + w, y + h * 0.42); seg2(x, y + h * 0.50, x + w, y + h * 0.50);
    for (var p = 0; p < 9; p++) seg2(x + w * (0.05 + p * 0.115), y + h * 0.36, x + w * (0.05 + p * 0.115), y + h * 0.56);
    ctx.fillStyle = SEP.dark;
    circ(x + w * 0.16, y + h * 0.30, h * 0.085); circ(x + w * 0.24, y + h * 0.345, h * 0.07); circ(x + w * 0.10, y + h * 0.35, h * 0.06);
    var dx = x + w * 0.46, dy = y + h * 0.66, s = h;
    ctx.fillStyle = SEP.deep;
    ctx.save(); ctx.translate(dx, dy - s * 0.16); ctx.scale(1.55, 1);
    ctx.beginPath(); ctx.arc(0, 0, s * 0.085, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    circ(dx + s * 0.15, dy - s * 0.215, s * 0.056);
    poly([dx + s * 0.125, dy - s * 0.25, dx + s * 0.115, dy - s * 0.315, dx + s * 0.165, dy - s * 0.265]);
    ctx.strokeStyle = SEP.deep; ctx.lineWidth = s * 0.02;
    seg2(dx - s * 0.125, dy - s * 0.19, dx - s * 0.185, dy - s * 0.265);
    rr(dx - s * 0.105, dy - s * 0.085, s * 0.028, s * 0.15);
    rr(dx - s * 0.045, dy - s * 0.085, s * 0.028, s * 0.15);
    rr(dx + s * 0.075, dy - s * 0.085, s * 0.028, s * 0.15);
    rr(dx + s * 0.125, dy - s * 0.085, s * 0.028, s * 0.15);
    if (v > 0) { ctx.fillStyle = 'rgba(237,230,214,0.5)'; circ(dx - s * 0.02, dy - s * 0.17, s * 0.038); }
  } else if (kind === 3) {                            /* mountain road */
    ctx.fillStyle = SEP.mid;
    poly([x, y + h * 0.66, x + w * 0.34, y + h * 0.16, x + w * 0.62, y + h * 0.66]);
    ctx.fillStyle = SEP.dark;
    poly([x + w * 0.36, y + h * 0.66, x + w * 0.66, y + h * 0.24, x + w, y + h * 0.66]);
    ctx.fillStyle = SEP.sky;
    poly([x + w * 0.315, y + h * 0.235, x + w * 0.34, y + h * 0.16, x + w * 0.37, y + h * 0.235,
          x + w * 0.35, y + h * 0.215, x + w * 0.335, y + h * 0.25, x + w * 0.325, y + h * 0.215]);
    ctx.fillStyle = SEP.deep;
    poly([x + w * 0.40, y + h, x + w * 0.487, y + h * 0.62, x + w * 0.525, y + h * 0.62, x + w * 0.64, y + h]);
    ctx.fillStyle = SEP.paper;
    rr(x + w * 0.494, y + h * 0.70, w * 0.016, h * 0.05);
    rr(x + w * 0.488, y + h * 0.83, w * 0.028, h * 0.065);
    ctx.fillStyle = SEP.deep;
    rr(x + w * 0.545, y + h * 0.665, w * 0.085, h * 0.038);
    poly([x + w * 0.56, y + h * 0.665, x + w * 0.575, y + h * 0.635, x + w * 0.605, y + h * 0.635, x + w * 0.615, y + h * 0.665]);
  } else {                                            /* kitchen */
    ctx.fillStyle = SEP.paper; rr(x + w * 0.08, y + h * 0.10, w * 0.26, h * 0.34);
    ctx.strokeStyle = SEP.deep; ctx.lineWidth = Math.max(1.5, h * 0.009);
    ctx.strokeRect(x + w * 0.08, y + h * 0.10, w * 0.26, h * 0.34);
    seg2(x + w * 0.21, y + h * 0.10, x + w * 0.21, y + h * 0.44);
    seg2(x + w * 0.08, y + h * 0.27, x + w * 0.34, y + h * 0.27);
    seg2(x + w * 0.52, y + h * 0.13, x + w * 0.92, y + h * 0.13);
    ctx.fillStyle = SEP.deep;
    circ(x + w * 0.60, y + h * 0.235, h * 0.048); circ(x + w * 0.72, y + h * 0.255, h * 0.058); circ(x + w * 0.85, y + h * 0.235, h * 0.044);
    ctx.strokeStyle = SEP.deep;
    seg2(x + w * 0.60, y + h * 0.13, x + w * 0.60, y + h * 0.19);
    seg2(x + w * 0.72, y + h * 0.13, x + w * 0.72, y + h * 0.20);
    seg2(x + w * 0.85, y + h * 0.13, x + w * 0.85, y + h * 0.195);
    ctx.fillStyle = SEP.dark; rr(x, y + h * 0.62, w * 0.58, h * 0.07);
    rr(x + w * 0.03, y + h * 0.69, w * 0.04, h * 0.31); rr(x + w * 0.47, y + h * 0.69, w * 0.04, h * 0.31);
    ctx.fillStyle = SEP.mid; circ(x + w * 0.17, y + h * 0.575, h * 0.045); circ(x + w * 0.30, y + h * 0.585, h * 0.036);
    ctx.fillStyle = SEP.dark; rr(x + w * 0.68, y + h * 0.60, w * 0.26, h * 0.05);
    rr(x + w * 0.70, y + h * 0.65, w * 0.035, h * 0.35); rr(x + w * 0.885, y + h * 0.65, w * 0.035, h * 0.35);
    ctx.fillStyle = SEP.deep; circ(x + w * 0.81, y + h * 0.545, h * 0.05);
  }
  /* vignette: flat darker corners */
  ctx.fillStyle = 'rgba(74,56,38,0.20)';
  poly([x, y, x + w * 0.20, y, x, y + h * 0.26]);
  poly([x + w, y, x + w * 0.80, y, x + w, y + h * 0.26]);
  poly([x, y + h, x + w * 0.20, y + h, x, y + h * 0.74]);
  poly([x + w, y + h, x + w * 0.80, y + h, x + w, y + h * 0.74]);
}
function drawSnapshots(x, y, w, h, lt, t) {
  ctx.fillStyle = '#0A0A0B'; rr(x, y, w, h);
  var px = x + w * 0.055, py = y + h * 0.07, pw = w * 0.89, ph = h * 0.86;
  ctx.fillStyle = SEP.paper; rr(px, py, pw, ph);
  var ix = px + pw * 0.045, iy = py + ph * 0.055, iw = pw * 0.91, ih2 = ph * 0.89;
  var idx = Math.floor(lt / 4) % 9;
  drawStill(ix, iy, iw, ih2, idx);
  ctx.fillStyle = SEP.deep;                            /* date stamp */
  ctx.font = '700 ' + clamp(ph * 0.045, 8, 15) + 'px "Courier New", monospace';
  ctx.textBaseline = 'alphabetic';
  var stamp = "'8" + (7 + (idx % 3)) + ' ' + (1 + Math.floor(ih(idx, 5) * 12)) + '/' + (1 + Math.floor(ih(idx, 9) * 28));
  ctx.fillText(stamp, ix + iw - ctx.measureText(stamp).width - iw * 0.02, iy + ih2 - ih2 * 0.03);
  var stp = Math.floor(lt * 12);
  if (stp % 48 === 1) { ctx.fillStyle = 'rgba(242,239,230,0.20)'; rr(x, y, w, h); }  /* clunk cut */
}

/* ================= PROGRAM 2: SOUND FIRST ================= */
function waveLine(cx, cy, w, amp, st, seed, mirror) {
  ctx.beginPath();
  var n = 56, i, px2, py2;
  for (i = 0; i <= n; i++) {
    var u = i / n;
    var val = Math.sin(u * 6.3 + st * 2.2 + seed) * 0.55
            + Math.sin(u * 14.7 - st * 3.1 + seed * 2.0) * 0.30
            + Math.sin(u * 29.0 + st * 1.3) * 0.15;
    px2 = cx - w / 2 + u * w;
    py2 = cy + val * amp * (mirror ? -1 : 1);
    if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
  }
  ctx.stroke();
}
function drawSound(x, y, w, h, lt) {
  ctx.fillStyle = '#050607'; rr(x, y, w, h);
  var st = step12(lt), mode = Math.floor(lt / 6) % 6;
  var cx = x + w / 2, cy = y + h / 2;
  ctx.strokeStyle = PAL.green; ctx.lineWidth = Math.max(1.6, h * 0.006); ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(95,168,138,0.16)';
  seg2(x + w * 0.06, cy, x + w * 0.94, cy);
  ctx.strokeStyle = PAL.green;
  if (mode === 0) {
    waveLine(cx, cy, w * 0.84, h * 0.30, st, 1.7, false);
  } else if (mode === 1) {
    for (var k = 0; k < 5; k++)
      waveLine(cx, y + h * (0.20 + k * 0.15), w * 0.84, h * 0.055, st, 1.7 + k * 0.9, false);
  } else if (mode === 2) {
    ctx.beginPath();
    var R = h * 0.30, n2 = 64, i2, a2, r2;
    for (i2 = 0; i2 <= n2; i2++) {
      a2 = (i2 / n2) * Math.PI * 2;
      r2 = R * (1 + 0.17 * Math.sin(a2 * 3 + st * 2.0) + 0.10 * Math.sin(a2 * 7 - st * 3.0));
      var px3 = cx + Math.cos(a2) * r2 * (w / h > 1.4 ? 1.25 : 1), py3 = cy + Math.sin(a2) * r2;
      if (i2 === 0) ctx.moveTo(px3, py3); else ctx.lineTo(px3, py3);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(95,168,138,0.4)';
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.55, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = PAL.green;
  } else if (mode === 3) {
    for (var gy = 0; gy < 3; gy++) for (var gx = 0; gx < 8; gx++) {
      var bh = h * (0.05 + 0.16 * Math.abs(Math.sin(gx * 1.7 + gy * 2.3 + st * 3.0)));
      var bxx = x + w * (0.14 + gx * 0.09), byy = y + h * (0.30 + gy * 0.20);
      rr(bxx, byy - bh / 2, Math.max(2, w * 0.012), bh);
    }
  } else if (mode === 4) {
    waveLine(cx, cy, w * 0.84, h * 0.26, st, 4.2, false);
    waveLine(cx, cy, w * 0.84, h * 0.26, st, 4.2, true);
  } else {
    ctx.beginPath();
    var R2 = h * 0.27, n3 = 64, i3, a3, r3;
    for (i3 = 0; i3 <= n3; i3++) {
      a3 = (i3 / n3) * Math.PI * 2;
      r3 = R2 * (1 + 0.15 * Math.sin(a3 * 4 - st * 2.4) + 0.08 * Math.sin(a3 * 9 + st * 1.7));
      var px4 = cx + Math.cos(a3) * r3 * 1.25, py4 = cy + Math.sin(a3) * r3;
      if (i3 === 0) ctx.moveTo(px4, py4); else ctx.lineTo(px4, py4);
    }
    ctx.stroke();
    waveLine(cx, cy, w * 0.5, h * 0.10, st, 2.6, false);
  }
  ctx.lineCap = 'butt';
}

/* ================= PROGRAM 3: VIDEO SYNDROME ================= */
function drawBandFigures(x, y, w, h, lt, mode) {
  var fl = y + h * 0.80;                               /* stage floor */
  var st6 = Math.floor(lt * 6);
  var sil = mode === 0 ? '#07070A' : (mode === 1 ? 'rgba(214,106,138,0.22)' : 'rgba(95,168,138,0.22)');
  var sway = (st6 % 2 === 0 ? -1 : 1) * w * 0.004;
  ctx.fillStyle = sil; ctx.strokeStyle = sil;
  /* singer */
  var sx2 = x + w * 0.30 + sway, sh2 = h;
  rr(sx2 - w * 0.016, fl - sh2 * 0.30, w * 0.013, sh2 * 0.30);
  rr(sx2 + w * 0.006, fl - sh2 * 0.30, w * 0.013, sh2 * 0.30);
  poly([sx2 - w * 0.026, fl - sh2 * 0.30, sx2 + w * 0.028, fl - sh2 * 0.30, sx2 + w * 0.020, fl - sh2 * 0.55, sx2 - w * 0.018, fl - sh2 * 0.55]);
  circ(sx2, fl - sh2 * 0.588, sh2 * 0.042);
  ctx.lineWidth = Math.max(1.6, w * 0.004);
  seg2(x + w * 0.365, fl, x + w * 0.358, fl - sh2 * 0.56);
  ctx.fillStyle = sil; circ(x + w * 0.357, fl - sh2 * 0.575, sh2 * 0.016);
  /* guitarist */
  var gx2 = x + w * 0.52;
  ctx.fillStyle = sil;
  rr(gx2 - w * 0.015, fl - sh2 * 0.29, w * 0.013, sh2 * 0.29);
  rr(gx2 + w * 0.007, fl - sh2 * 0.29, w * 0.013, sh2 * 0.29);
  poly([gx2 - w * 0.025, fl - sh2 * 0.29, gx2 + w * 0.027, fl - sh2 * 0.29, gx2 + w * 0.019, fl - sh2 * 0.54, gx2 - w * 0.017, fl - sh2 * 0.54]);
  circ(gx2, fl - sh2 * 0.578, sh2 * 0.042);
  ctx.save(); ctx.translate(gx2 + w * 0.05, fl - sh2 * 0.42); ctx.rotate(0.5); ctx.scale(1.25, 1);
  ctx.beginPath(); ctx.arc(0, 0, sh2 * 0.052, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.strokeStyle = sil; ctx.lineWidth = Math.max(1.6, w * 0.004);
  seg2(gx2 + w * 0.082, fl - sh2 * 0.478, gx2 + w * 0.14, fl - sh2 * 0.535);
  seg2(gx2 + w * 0.018, fl - sh2 * 0.50, gx2 + w * 0.052, fl - sh2 * (st6 % 2 === 0 ? 0.415 : 0.385));
  /* drummer */
  var dx2 = x + w * 0.76;
  ctx.fillStyle = sil;
  poly([dx2 - w * 0.022, fl - sh2 * 0.26, dx2 + w * 0.024, fl - sh2 * 0.26, dx2 + w * 0.017, fl - sh2 * 0.47, dx2 - w * 0.015, fl - sh2 * 0.47]);
  circ(dx2, fl - sh2 * 0.505, sh2 * 0.04);
  ctx.beginPath(); ctx.arc(dx2, fl - sh2 * 0.088, sh2 * 0.088, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(dx2 - w * 0.048, fl - sh2 * 0.225, sh2 * 0.040, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(dx2 + w * 0.048, fl - sh2 * 0.235, sh2 * 0.043, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = sil; ctx.lineWidth = Math.max(1.4, w * 0.0035);
  seg2(dx2 - w * 0.105, fl - sh2 * 0.46, dx2 - w * 0.04, fl - sh2 * 0.46);
  seg2(dx2 + w * 0.04, fl - sh2 * 0.49, dx2 + w * 0.10, fl - sh2 * 0.49);
  seg2(dx2 - w * 0.026, fl - sh2 * 0.44, dx2 - w * 0.052, fl - sh2 * (st6 % 2 === 0 ? 0.28 : 0.31));
  seg2(dx2 + w * 0.026, fl - sh2 * 0.44, dx2 + w * 0.052, fl - sh2 * (st6 % 2 === 0 ? 0.31 : 0.28));
  if (mode === 0) {                                    /* rim light ticks */
    ctx.strokeStyle = 'rgba(214,106,138,0.85)'; ctx.lineWidth = Math.max(1.4, w * 0.003);
    seg2(sx2 - w * 0.020, fl - sh2 * 0.54, sx2 - w * 0.024, fl - sh2 * 0.33);
    ctx.strokeStyle = 'rgba(227,195,71,0.85)';
    seg2(gx2 - w * 0.019, fl - sh2 * 0.53, gx2 - w * 0.023, fl - sh2 * 0.32);
    ctx.strokeStyle = 'rgba(95,168,138,0.85)';
    seg2(dx2 - w * 0.017, fl - sh2 * 0.46, dx2 - w * 0.020, fl - sh2 * 0.29);
  }
}
function drawSyndrome(x, y, w, h, lt) {
  ctx.fillStyle = '#2A1E3E'; rr(x, y, w, h);
  ctx.fillStyle = '#33224A'; rr(x + w / 3, y, w / 3, h);
  ctx.fillStyle = '#1F3644'; rr(x + 2 * w / 3, y, w / 3, h);
  ctx.fillStyle = 'rgba(214,106,138,0.07)';
  poly([x + w * 0.06, y, x + w * 0.30, y, x + w * 0.44, y + h * 0.80, x + w * 0.16, y + h * 0.80]);
  ctx.fillStyle = 'rgba(95,168,138,0.07)';
  poly([x + w * 0.70, y, x + w * 0.94, y, x + w * 0.86, y + h * 0.80, x + w * 0.58, y + h * 0.80]);
  ctx.fillStyle = '#17171D'; rr(x, y + h * 0.80, w, h * 0.20);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  for (var sl = 0; sl < h; sl += 6) rr(x, y + sl, w, 1);
  var cyc7 = lt % 7, melting = cyc7 > 5.8, mi = melting ? (cyc7 - 5.8) / 1.2 : 0;
  drawBandFigures(x, y, w, h, lt, 0);
  if (melting) {
    var bands = [0.18, 0.42, 0.63], bg;
    for (bg = 0; bg < 3; bg++) {
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y + h * bands[bg], w, h * 0.13); ctx.clip();
      ctx.translate(0, (bg + 1) * h * 0.035 * mi);
      drawBandFigures(x, y, w, h, lt, bg % 2 ? 2 : 1);
      ctx.restore();
    }
    var tbY = y + mi * h;
    ctx.fillStyle = 'rgba(242,239,230,0.13)'; rr(x, tbY - h * 0.012, w, h * 0.024);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    for (var sp = 0; sp < 40; sp++) {
      var spx = x + ih(sp, Math.floor(lt * 12)) * w;
      rr(spx, tbY - h * 0.012 + ih(sp, 31) * h * 0.024, 2, 1.5);
    }
  }
  if (lt < 3) {
    ctx.fillStyle = PAL.leader;
    poly([x + w * 0.035, y + h * 0.055, x + w * 0.035, y + h * 0.115, x + w * 0.058, y + h * 0.085]);
    ctx.font = '700 ' + clamp(h * 0.052, 10, 16) + 'px "Courier New", monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('PLAY', x + w * 0.068, y + h * 0.108);
  }
}

/* ================= PROGRAM 4: PROTEST FLASH ================= */
function drawEar(cx, cy, r) {
  ctx.beginPath(); ctx.arc(cx, cy, r, -0.35 * Math.PI, 1.05 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + r * 0.08, cy + r * 0.05, r * 0.58, -0.3 * Math.PI, 1.0 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + r * 0.16, cy + r * 0.12, r * 0.26, -0.2 * Math.PI, 1.05 * Math.PI); ctx.stroke();
  seg2(cx - r * 0.30, cy + r * 0.82, cx - r * 0.05, cy + r * 1.02);
}
function drawEye(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx - r * 1.15, cy);
  ctx.quadraticCurveTo(cx, cy - r * 1.05, cx + r * 1.15, cy);
  ctx.quadraticCurveTo(cx, cy + r * 1.05, cx - r * 1.15, cy);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.42, 0, Math.PI * 2); ctx.stroke();
  circ(cx, cy, r * 0.15);
  ctx.strokeStyle = PAL.red; ctx.lineWidth = r * 0.13;
  seg2(cx - r * 1.2, cy + r * 0.95, cx + r * 1.2, cy - r * 0.95);
}
function drawHands(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 1.05);
  ctx.quadraticCurveTo(cx - r * 0.62, cy + r * 0.55, cx - r * 0.30, cy - r * 0.55);
  ctx.quadraticCurveTo(cx - r * 0.16, cy - r * 1.0, cx, cy - r * 1.05);
  ctx.quadraticCurveTo(cx + r * 0.16, cy - r * 1.0, cx + r * 0.30, cy - r * 0.55);
  ctx.quadraticCurveTo(cx + r * 0.62, cy + r * 0.55, cx, cy + r * 1.05);
  ctx.fill();
  ctx.strokeStyle = 'rgba(11,11,13,0.55)'; ctx.lineWidth = r * 0.05;
  seg2(cx, cy - r * 1.0, cx, cy + r * 0.95);
}
function drawMic(cx, cy, r) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.5);
  ctx.beginPath();
  ctx.moveTo(-r * 0.30, -r * 0.95);
  ctx.lineTo(r * 0.30, -r * 0.95);
  ctx.quadraticCurveTo(r * 0.34, -r * 0.30, r * 0.20, -r * 0.18);
  ctx.lineTo(-r * 0.20, -r * 0.18);
  ctx.quadraticCurveTo(-r * 0.34, -r * 0.30, -r * 0.30, -r * 0.95);
  ctx.stroke();
  seg2(-r * 0.325, -r * 0.62, r * 0.325, -r * 0.62);
  seg2(-r * 0.315, -r * 0.40, r * 0.315, -r * 0.40);
  rr(-r * 0.07, -r * 0.18, r * 0.14, r * 0.85);
  ctx.beginPath(); ctx.moveTo(0, r * 0.67);
  ctx.quadraticCurveTo(r * 0.05, r * 1.05, -r * 0.38, r * 1.12);
  ctx.stroke();
  ctx.restore();
}
function drawPalms(cx, cy, r) {
  var s2;
  for (s2 = -1; s2 <= 1; s2 += 2) {
    ctx.beginPath();
    ctx.moveTo(cx + s2 * r * 0.10, cy + r * 0.95);
    ctx.quadraticCurveTo(cx + s2 * r * 0.95, cy + r * 0.75, cx + s2 * r * 0.88, cy - r * 0.25);
    ctx.quadraticCurveTo(cx + s2 * r * 0.80, cy - r * 0.85, cx + s2 * r * 0.38, cy - r * 0.88);
    ctx.quadraticCurveTo(cx + s2 * r * 0.12, cy - r * 0.88, cx + s2 * r * 0.10, cy - r * 0.30);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(11,11,13,0.5)'; ctx.lineWidth = r * 0.045;
    seg2(cx + s2 * r * 0.30, cy - r * 0.80, cx + s2 * r * 0.34, cy - r * 0.05);
    seg2(cx + s2 * r * 0.55, cy - r * 0.78, cx + s2 * r * 0.58, cy - r * 0.02);
    ctx.strokeStyle = PAL.chalk;
  }
}
var PROTEST_FRAMES = [
  { pic: 'ear',   cap: 'listen first' },
  { pic: 'eye',   cap: 'no photographs' },
  { pic: 'hands', cap: 'hold space' },
  { pic: 'mic',   cap: 'pass the mic' },
  { pic: 'palms', cap: 'hold space' },
  { pic: 'ear',   cap: 'listen first' }
];
function drawProtest(x, y, w, h, lt) {
  ctx.fillStyle = '#070708'; rr(x, y, w, h);
  if ((lt % 5) < 0.12) return;                          /* blink between frames */
  var fr = PROTEST_FRAMES[Math.floor(lt / 5) % 6];
  var cx = x + w / 2, cy = y + h * 0.40, r = h * 0.185;
  ctx.strokeStyle = PAL.chalk; ctx.fillStyle = PAL.chalk;
  ctx.lineWidth = r * 0.11; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (fr.pic === 'ear') drawEar(cx, cy, r);
  else if (fr.pic === 'eye') drawEye(cx, cy, r);
  else if (fr.pic === 'hands') drawHands(cx, cy, r);
  else if (fr.pic === 'mic') drawMic(cx, cy, r);
  else drawPalms(cx, cy, r);
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
  ctx.fillStyle = PAL.chalk;
  ctx.font = 'italic 400 ' + clamp(h * 0.062, 14, 27) + 'px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(fr.cap, cx, y + h * 0.80);
  ctx.textAlign = 'left';
}

/* ================= LEADER ================= */
function drawLeader(x, y, w, h, ll, t) {
  ctx.fillStyle = '#060606'; rr(x, y, w, h);
  var ws = Math.floor(t * 12);
  var jx = (ih(3, ws) - 0.5) * 4, jy = (ih(9, ws) - 0.5) * 4;
  var cx = x + w / 2 + jx, cy = y + h / 2 + jy, R = h * 0.31;
  ctx.strokeStyle = 'rgba(242,239,230,0.35)'; ctx.lineWidth = 1.5;
  seg2(cx - R * 1.5, cy, cx + R * 1.5, cy);
  seg2(cx, cy - R * 1.35, cx, cy + R * 1.35);
  ctx.strokeStyle = PAL.leader; ctx.lineWidth = Math.max(2, h * 0.008);
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  var sa = -Math.PI / 2 + (ll % 1) * Math.PI * 2;
  ctx.strokeStyle = 'rgba(242,239,230,0.6)';
  seg2(cx, cy, cx + Math.cos(sa) * R, cy + Math.sin(sa) * R);
  var n = 3 - Math.floor(ll);
  ctx.fillStyle = PAL.red;
  ctx.font = '700 ' + h * 0.34 + 'px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('' + n, cx, cy + h * 0.012);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(242,239,230,0.5)';
  ctx.font = '400 ' + clamp(h * 0.035, 9, 13) + 'px "Courier New", monospace';
  ctx.fillText('REEL CHANGE', x + w * 0.035, y + h * 0.075);
}

/* ================= ROOM / FRAME ================= */
function isPhone() {
  var s = window.screen;
  if (s && Math.min(s.width, s.height) < 700) return true;
  return H > W * 1.15;
}
function layout() {
  if (isPhone()) {
    var sw = W * 0.92, sx = W * 0.04, sy = H * 0.065, sh = Math.min(sw * 0.66, H * 0.46);
    return { sx: sx, sy: sy, sw: sw, sh: sh,
             px: W * 0.06, py: sy + sh + H * 0.028, pw: W * 0.88, ph: H * 0.145, stacked: true };
  }
  var sw2 = W * 0.64, sx2 = W * 0.045, sy2 = H * 0.12, sh2 = Math.min(sw2 * 0.60, H * 0.68);
  return { sx: sx2, sy: sy2, sw: sw2, sh: sh2,
           px: sx2 + sw2 + W * 0.028, py: sy2, pw: W - (sx2 + sw2 + W * 0.028) - W * 0.035,
           ph: sh2 * 0.58, stacked: false };
}
function screenPath(L) {
  var inset = L.sw * 0.01;
  ctx.beginPath();
  ctx.moveTo(L.sx + inset, L.sy);
  ctx.lineTo(L.sx + L.sw - inset, L.sy);
  ctx.lineTo(L.sx + L.sw, L.sy + L.sh);
  ctx.lineTo(L.sx, L.sy + L.sh);
  ctx.closePath();
}
function wrapLines(text, maxW) {
  var words = text.split(' '), lines = [], cur = '', i, test;
  for (i = 0; i < words.length; i++) {
    test = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawPlacard(L, loc) {
  var prog = loc.seg.prog;
  var padX = clamp(L.pw * 0.075, 8, 22);
  var tx = L.px + padX, tw = L.pw - padX * 2;
  var hdrS = clamp(tw * 0.060, 7.5, 11);
  var labS = clamp(tw * 0.055, 7.5, 10.5);
  var titS = clamp(tw * 0.105, 13, 21);
  var linS = clamp(tw * 0.088, 11, 16);
  ctx.font = '600 ' + titS + 'px Georgia, serif';
  var tl = wrapLines(prog.title, tw);
  ctx.font = 'italic 400 ' + linS + 'px Georgia, serif';
  var ll2 = wrapLines(prog.line, tw);
  var padTop = clamp(L.ph * 0.14, 10, 24);
  var contentH = padTop + hdrS * 1.9 + labS * 1.55 + tl.length * titS * 1.18
               + titS * 0.45 + 7 + ll2.length * linS * 1.32 + padTop * 0.6;
  var cardH = Math.max(L.ph, contentH);
  ctx.fillStyle = PAL.card; rr(L.px, L.py, L.pw, cardH);
  ctx.strokeStyle = 'rgba(216,212,200,0.45)'; ctx.lineWidth = 1;
  ctx.strokeRect(L.px + 0.5, L.py + 0.5, L.pw - 1, cardH - 1);
  ctx.textBaseline = 'alphabetic';
  var y = L.py + padTop + hdrS;
  ctx.fillStyle = 'rgba(216,212,200,0.55)';
  ctx.font = '400 ' + hdrS + 'px "Courier New", monospace';
  ctx.fillText('NOTHING TO SEE HERE', tx, y);
  y += hdrS * 0.9 + labS;
  ctx.fillStyle = PAL.chalk;
  ctx.font = '400 ' + labS + 'px "Courier New", monospace';
  ctx.fillText(loc.leader ? 'NEXT PROGRAM' : 'PROGRAM', tx, y);
  y += labS * 0.55 + titS;
  ctx.font = '600 ' + titS + 'px Georgia, serif';
  var i;
  for (i = 0; i < tl.length; i++) { ctx.fillText(tl[i], tx, y); if (i < tl.length - 1) y += titS * 1.18; }
  y += titS * 0.45;
  ctx.strokeStyle = 'rgba(216,212,200,0.4)'; ctx.lineWidth = 1;
  seg2(tx, y, tx + tw * 0.4, y);
  y += 7 + linS;
  ctx.font = 'italic 400 ' + linS + 'px Georgia, serif';
  for (i = 0; i < ll2.length; i++) { ctx.fillText(ll2[i], tx, y); if (i < ll2.length - 1) y += linS * 1.32; }
}
function draw(t) {
  if (!W) return;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  var cyc = ((t % CYCLE) + CYCLE) % CYCLE;
  var loc = locate(cyc);
  var L = layout();
  /* room */
  ctx.fillStyle = PAL.room; rr(0, 0, W, H);
  ctx.fillStyle = PAL.wall; rr(W * 0.035, H * 0.045, W * 0.93, H * 0.72);
  ctx.fillStyle = PAL.wallSide;
  poly([0, 0, W * 0.035, H * 0.045, W * 0.035, H * 0.765, 0, H]);
  poly([W, 0, W * 0.965, H * 0.045, W * 0.965, H * 0.765, W, H]);
  ctx.fillStyle = PAL.floor; rr(0, H * 0.765, W, H * 0.235);
  ctx.fillStyle = 'rgba(242,239,230,0.032)';
  poly([L.sx + L.sw * 0.10, L.sy + L.sh, L.sx + L.sw * 0.90, L.sy + L.sh,
        L.sx + L.sw * 1.03, H * 0.99, L.sx - L.sw * 0.03, H * 0.99]);
  /* beam cone + dust */
  var bx = L.sx + L.sw / 2, by = H * 0.028;
  var fl2 = 0.05 + 0.016 * ih(7, Math.floor(t * 12));
  ctx.fillStyle = 'rgba(242,239,230,' + fl2.toFixed(3) + ')';
  poly([bx, by, L.sx + L.sw * 0.01, L.sy, L.sx + L.sw * 0.99, L.sy,
        L.sx + L.sw, L.sy + L.sh, L.sx, L.sy + L.sh]);
  ctx.fillStyle = 'rgba(242,239,230,0.20)';
  for (var d = 0; d < 34; d++) {
    var du = ih(d, 3), dv = ih(d, 11);
    var dxp = bx + (L.sx + du * L.sw - bx) * dv;
    var dyp = by + (L.sy + ((d * 37) % 10) / 10 * L.sh - by) * dv;
    ctx.globalAlpha = 0.10 + 0.25 * ih(d, Math.floor(t * 3));
    rr(dxp, dyp, 1.6, 1.6);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#1B1B21'; rr(bx - 9, by - 5, 18, 10);
  ctx.fillStyle = PAL.leader; circ(bx, by, 1.8);
  /* screen */
  screenPath(L);
  ctx.fillStyle = '#000'; ctx.fill();
  ctx.save(); screenPath(L); ctx.clip();
  if (loc.leader) drawLeader(L.sx, L.sy, L.sw, L.sh, loc.leadLocal, t);
  else if (loc.seg.prog.id === 'snap') drawSnapshots(L.sx, L.sy, L.sw, L.sh, loc.local, t);
  else if (loc.seg.prog.id === 'sound') drawSound(L.sx, L.sy, L.sw, L.sh, loc.local);
  else if (loc.seg.prog.id === 'syn') drawSyndrome(L.sx, L.sy, L.sw, L.sh, loc.local);
  else drawProtest(L.sx, L.sy, L.sw, L.sh, loc.local);
  ctx.fillStyle = 'rgba(242,239,230,0.028)'; rr(L.sx, L.sy, L.sw, L.sh);
  ctx.restore();
  screenPath(L);
  ctx.strokeStyle = PAL.screenEdge; ctx.lineWidth = 2; ctx.stroke();
  /* placard */
  drawPlacard(L, loc);
  /* audience silhouettes */
  ctx.fillStyle = PAL.black;
  circ(W * 0.35, H * 1.015, W * 0.052);
  circ(W * 0.615, H * 1.03, W * 0.066);
  ctx.beginPath(); ctx.arc(W * 0.35, H * 1.09, W * 0.105, Math.PI, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W * 0.615, H * 1.115, W * 0.13, Math.PI, Math.PI * 2); ctx.fill();
  if (L.stacked) circ(W * 0.82, H * 1.02, W * 0.045);
}

/* ---------- sizing: Visual Viewport API ---------- */
function resize() {
  var vv = window.visualViewport;
  W = Math.floor(vv ? vv.width : window.innerWidth);
  H = Math.floor(vv ? vv.height : window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
window.addEventListener('resize', function () { resize(); draw(pieceNow()); });

resize();
draw(T0);                                            // synchronous fixed-phase first frame
if (typeof requestAnimationFrame === 'function') {
  var tick = function () {
    draw(pieceNow());
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
