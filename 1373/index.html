<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Island Weights</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0D2836; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1373000);

  var DEEP = '#0D2836', FOAM = '#D8E2E0', IRON = '#23211E',
      MOSS = '#3F5238', GOLD = '#C9A227';

  // Four weights: base angle (N, E, S, W), each with seeded variation.
  var BASES = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
  var weights = [];
  for (var i = 0; i < 4; i++) {
    var r = mulberry32(1373000 + i * 7919);
    weights.push({
      base: BASES[i],
      shank: 0.9 + r() * 0.25,          // shank length factor
      fluke: 0.34 + r() * 0.16,         // fluke spread factor
      ring: 0.10 + r() * 0.05,          // ring radius factor
      mossA: r() * Math.PI * 2,         // moss patch angle
      mossD: 0.15 + r() * 0.25,         // moss patch distance
      speckles: (function () {
        var arr = [];
        for (var k = 0; k < 14; k++) {
          arr.push({ a: r() * Math.PI * 2, d: 0.72 + r() * 0.28, s: 0.8 + r() * 1.6 });
        }
        return arr;
      })(),
      verse: (function () {
        var glyphs = [];
        var types = ['bar', 'dots', 'chev', 'arc', 'tick', 'cross', 'dia'];
        for (var g = 0; g < 7; g++) glyphs.push(types[Math.floor(r() * types.length)]);
        return glyphs;
      })()
    });
  }

  var W = 0, H = 0, lastT = 0;
  var rotOffset = 0, releaseT = -100, dragging = false, lastX = 0, moved = 0;
  var ripples = []; // {pool, t0}
  var screenPos = []; // per-weight {x, y} from last draw

  function viewportSize() {
    var vw = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vw && vw.width && vw.height) return { w: vw.width, h: vw.height };
    return { w: window.innerWidth, h: window.innerHeight };
  }
  function resize() {
    var s = viewportSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
  }
  resize();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }

  function angDiff(a, b) {
    var d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return Math.abs(d);
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }

  function dot(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function line(x1, y1, x2, y2, color, w) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.stroke();
  }

  function drawGlyph(type, x, y, s, color) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1, s * 0.14);
    if (type === 'bar') {
      line(x - s * 0.5, y, x + s * 0.5, y, color, ctx.lineWidth);
    } else if (type === 'dots') {
      dot(x - s * 0.3, y, s * 0.14, color);
      dot(x + s * 0.3, y, s * 0.14, color);
    } else if (type === 'chev') {
      ctx.beginPath();
      ctx.moveTo(x - s * 0.45, y + s * 0.3);
      ctx.lineTo(x, y - s * 0.3);
      ctx.lineTo(x + s * 0.45, y + s * 0.3);
      ctx.stroke();
    } else if (type === 'arc') {
      ctx.beginPath();
      ctx.moveTo(x + s * 0.45, y);
      ctx.arc(x, y, s * 0.45, 0, Math.PI, true);
      ctx.stroke();
    } else if (type === 'tick') {
      line(x - s * 0.35, y + s * 0.35, x + s * 0.35, y - s * 0.35, color, ctx.lineWidth);
    } else if (type === 'cross') {
      line(x - s * 0.4, y, x + s * 0.4, y, color, ctx.lineWidth);
      line(x, y - s * 0.4, x, y + s * 0.4, color, ctx.lineWidth);
    } else if (type === 'dia') {
      ctx.beginPath();
      ctx.moveTo(x, y - s * 0.45);
      ctx.lineTo(x + s * 0.4, y);
      ctx.lineTo(x, y + s * 0.45);
      ctx.lineTo(x - s * 0.4, y);
      ctx.closePath();
      ctx.stroke();
    }
  }

  function drawAnchor(w, x, y, s) {
    var sh = s * w.shank, fl = s * w.fluke, rg = s * w.ring;
    ctx.strokeStyle = IRON;
    ctx.fillStyle = IRON;
    ctx.lineWidth = Math.max(1.5, s * 0.07);
    // ring
    ctx.beginPath();
    ctx.moveTo(x + rg, y - 0.55 * s);
    ctx.arc(x, y - 0.55 * s, rg, 0, Math.PI * 2);
    ctx.stroke();
    // shank
    line(x, y - 0.55 * s + rg, x, y + 0.42 * s, IRON, ctx.lineWidth);
    // stock (crossbar)
    line(x - 0.30 * s, y - 0.30 * s, x + 0.30 * s, y - 0.30 * s, IRON, ctx.lineWidth);
    // arms: two quadratic flukes from the bottom
    ctx.beginPath();
    ctx.moveTo(x, y + 0.42 * s);
    ctx.quadraticCurveTo(x - fl * 0.5, y + 0.48 * s, x - fl, y + 0.18 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y + 0.42 * s);
    ctx.quadraticCurveTo(x + fl * 0.5, y + 0.48 * s, x + fl, y + 0.18 * s);
    ctx.stroke();
    // fluke tips
    dot(x - fl, y + 0.18 * s, Math.max(1.5, s * 0.05), IRON);
    dot(x + fl, y + 0.18 * s, Math.max(1.5, s * 0.05), IRON);
    // moss patch
    var mx = x + Math.cos(w.mossA) * w.mossD * s;
    var my = y + Math.sin(w.mossA) * w.mossD * s;
    dot(mx, my, Math.max(1.5, s * 0.06), MOSS);
    // cardinal-gold accent on the ring
    dot(x, y - 0.55 * s - rg, Math.max(1.5, s * 0.045), GOLD);
  }

  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = DEEP;
    ctx.fillRect(0, 0, W, H);

    var cx = W / 2, cy = H / 2;
    var R = Math.min(W, H) * 0.34;
    var pr = Math.min(W, H) * 0.11;

    // Orbit: 180 s per revolution, closed-form over piece time.
    var orbit = (t % 180) / 180 * Math.PI * 2;
    // Drag offset decays exponentially after release; orbit always resumes.
    var off = 0;
    if (!dragging && releaseT > -50) {
      off = rotOffset * Math.exp(-(t - releaseT) / 3);
    } else if (dragging) {
      off = rotOffset;
    }
    var ang = orbit + off;

    // Faint orbit path.
    ctx.beginPath();
    ctx.moveTo(cx + R, cy);
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = FOAM;
    ctx.globalAlpha = 0.14;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 1;
    dot(cx, cy, Math.max(2, pr * 0.06), GOLD);

    for (var i = 0; i < 4; i++) {
      var w = weights[i];
      var a = w.base + ang;
      var px = cx + Math.cos(a) * R;
      var py = cy + Math.sin(a) * R;
      screenPos[i] = { x: px, y: py };

      // Pool: deep disc, foam rim, animated rings, speckles.
      ctx.beginPath();
      ctx.moveTo(px + pr, py);
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fillStyle = '#0E2F3E';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(px + pr, py);
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.strokeStyle = FOAM;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.globalAlpha = 1;
      for (var k = 0; k < 3; k++) {
        var ph = ((t * 0.12 + k / 3 + i * 0.13) % 1 + 1) % 1;
        var rr = pr * (0.35 + 0.6 * ph);
        ctx.beginPath();
        ctx.moveTo(px + rr, py);
        ctx.arc(px, py, rr, 0, Math.PI * 2);
        ctx.strokeStyle = FOAM;
        ctx.globalAlpha = 0.26 * (1 - ph);
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      for (var s2 = 0; s2 < w.speckles.length; s2++) {
        var sp = w.speckles[s2];
        dot(px + Math.cos(sp.a) * sp.d * pr, py + Math.sin(sp.a) * sp.d * pr, sp.s, FOAM);
      }
      // Touch ripples: expanding flat-alpha rings, closed-form over recorded touches.
      for (var rp = 0; rp < ripples.length; rp++) {
        var rip = ripples[rp];
        if (rip.pool !== i) continue;
        var age = t - rip.t0;
        if (age < 0 || age > 3) continue;
        var rrad = pr * (0.3 + age * 0.9);
        ctx.beginPath();
        ctx.moveTo(px + rrad, py);
        ctx.arc(px, py, rrad, 0, Math.PI * 2);
        ctx.strokeStyle = FOAM;
        ctx.globalAlpha = 0.5 * (1 - age / 3);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Anchor, upright.
      drawAnchor(w, px, py, pr * 0.72);

      // Verse: surfaces only when faced; touch deepens it.
      var d = angDiff(a, -Math.PI / 2);
      var env = d < 0.35 ? 1 : (d > 0.9 ? 0 : smooth((0.9 - d) / 0.55));
      var boost = 0;
      for (var b = 0; b < ripples.length; b++) {
        if (ripples[b].pool === i) {
          var ba = t - ripples[b].t0;
          if (ba >= 0 && ba < 6) boost += Math.exp(-ba / 4);
        }
      }
      boost = Math.min(1, boost);
      // Verse exists only while faced; touch deepens it, never summons it.
      var alpha = env * (0.8 + 0.2 * boost);
      if (alpha > 0.02) {
        var vy = py + pr * 0.55 + (1 - env) * pr * 0.15;
        var gs = pr * 0.16;
        var gap = pr * 0.24;
        var x0 = px - gap * 3;
        ctx.globalAlpha = alpha;
        for (var g = 0; g < w.verse.length; g++) {
          drawGlyph(w.verse[g], x0 + g * gap, vy, gs, FOAM);
        }
        ctx.globalAlpha = 1;
      }
    }
  }

  function onDown(e) {
    // Fold the decayed offset in, so a new drag starts from the current angle.
    if (!dragging && releaseT > -50) {
      rotOffset = rotOffset * Math.exp(-(lastT - releaseT) / 3);
    }
    dragging = true;
    moved = 0;
    lastX = e.clientX;
  }
  function onMove(e) {
    if (!dragging) return;
    var dx = e.clientX - lastX;
    lastX = e.clientX;
    moved += Math.abs(dx);
    rotOffset += dx * 0.004;
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    releaseT = lastT;
    if (moved < 12) {
      // Tap: ripple the pool under the pointer, if any.
      for (var i = 0; i < 4; i++) {
        var p = screenPos[i];
        if (!p) continue;
        var pr = Math.min(W, H) * 0.11;
        var dx = e.clientX - p.x, dy = e.clientY - p.y;
        if (dx * dx + dy * dy < (pr * 1.4) * (pr * 1.4)) {
          ripples.push({ pool: i, t0: lastT });
          if (ripples.length > 24) ripples.shift();
          break;
        }
      }
    }
  }
  if (typeof window !== 'undefined') {
    window.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  // Frame one: constant phase, drawn synchronously at load.
  draw(0);

  // rAF loop, guarded; clock starts only with the loop.
  var started = false, t0 = 0;
  function loop(ts) {
    if (!started) { started = true; t0 = ts; }
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
