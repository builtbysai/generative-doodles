<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ornament as Weather</title>
<style>
html, body { margin: 0; padding: 0; background: #2A2A2C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = [42, 42, 44];
var LIGHT = [237, 237, 232];
var MID = [138, 138, 134];
var DARK = [23, 23, 26];
var PHASE = 12.0;
var SEED = 1610003;
var FORM_S = 20, HOLD_S = 15, DISS_S = 10, CYCLE_S = FORM_S + HOLD_S + DISS_S;
var N_ROS = 8;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashRand(seed) { var r = mulberry32(seed); return r(); }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}

/* ---- rosette definitions: fixed authored tables, seeded ---- */
var ROSETTES = (function () {
  var rng = mulberry32(SEED);
  var out = [], i, j;
  for (i = 0; i < N_ROS; i++) {
    var arms = 5 + Math.floor(rng() * 4); /* 5-8 arms, asymmetric counts */
    var armSpec = [];
    for (j = 0; j < arms; j++) {
      armSpec.push({
        a0: (j / arms) * TAU + (rng() - 0.5) * 0.9,
        turns: 1.5 + rng() * 0.9,
        wob: 0.06 + rng() * 0.10,
        wobF: 2 + Math.floor(rng() * 3),
        wobP: rng() * TAU,
        r0: rng() * 0.28,
        col: j % 3 === 0 ? LIGHT : (j % 3 === 1 ? MID : DARK),
        lw: 0.9 + rng() * 1.6,
        len: 0.72 + rng() * 0.28
      });
    }
    var loose = [];
    for (j = 0; j < 9; j++) {
      loose.push({
        a: rng() * TAU, r0: 0.55 + rng() * 0.75,
        len: 0.10 + rng() * 0.22, wobP: rng() * TAU,
        col: rng() < 0.5 ? LIGHT : MID, lw: 0.8 + rng() * 1.2
      });
    }
    out.push({
      offset: (i / N_ROS) * CYCLE_S + rng() * 3,
      radFrac: 0.075 + rng() * 0.05, /* diameter 15-25% of frame width */
      spin: (rng() - 0.5) * 0.10,
      arms: armSpec, loose: loose,
      seed: SEED + i * 977
    });
  }
  return out;
})();
/* ground texture: faint seeded whorl arcs, static, part of the ground */
var GROUND_ARCS = (function () {
  var rng = mulberry32(SEED + 555);
  var out = [], i;
  for (i = 0; i < 90; i++) {
    out.push({
      x: rng(), y: rng(), r: 0.02 + rng() * 0.09,
      a0: rng() * TAU, sweep: 0.6 + rng() * 2.2,
      a: 0.03 + rng() * 0.07, lw: 0.6 + rng() * 1.0
    });
  }
  return out;
})();
/* rosette centre for rosette i in cycle k: pure function of (i, k).
   One rosette per cell of a 3x3 grid (one cell empty, rotating per cycle),
   shuffled by a seeded Fisher-Yates per cycle, so the field stays spread
   and dense instead of clumping by chance. */
var GRID_CELLS = [0, 1, 2, 3, 4, 5, 6, 7, 8];
function rosetteCentre(i, k) {
  var r = ROSETTES[i];
  var g1 = hashRand(r.seed + k * 131 + 11);
  var g2 = hashRand(r.seed + k * 131 + 29);
  var g3 = hashRand(r.seed + k * 131 + 47);
  var R = r.radFrac * VW;
  var mx = R + 0.03 * VW; /* centre at least a radius + margin from the edge */
  var my = R + 0.03 * Math.min(VW, VH);
  var cells = GRID_CELLS.slice();
  var rng = mulberry32(SEED + k * 7919 + 5);
  var j, tmp;
  for (j = cells.length - 1; j > 0; j--) {
    tmp = Math.floor(rng() * (j + 1));
    var swap = cells[j]; cells[j] = cells[tmp]; cells[tmp] = swap;
  }
  var cell = cells[i];
  var col = cell % 3, row = Math.floor(cell / 3);
  var cx = ((col + 0.5) / 3 + (g1 - 0.5) * 0.14) * VW;
  var cy = ((row + 0.5) / 3 + (g2 - 0.5) * 0.14) * VH;
  return {
    x: clamp(cx, mx, Math.max(mx + 1, VW - mx)),
    y: clamp(cy, my, Math.max(my + 1, VH - my)),
    rot: g3 * TAU
  };
}
function rosetteState(i, t) {
  var r = ROSETTES[i];
  var cyc = (((t - r.offset) % CYCLE_S) + CYCLE_S) % CYCLE_S;
  var k = Math.floor((t - r.offset) / CYCLE_S);
  if (t - r.offset < 0) k = Math.floor((t - r.offset) / CYCLE_S);
  var env, grow;
  if (cyc < FORM_S) { var f = smooth(cyc / FORM_S); env = 0.3 + 0.7 * f; grow = 0.25 + 0.75 * f; }
  else if (cyc < FORM_S + HOLD_S) { env = 1; grow = 1; }
  else { var d = smooth((cyc - FORM_S - HOLD_S) / DISS_S); env = d < 0.8 ? (1 - 0.7 * d / 0.8) : (0.3 * (1 - (d - 0.8) / 0.2)); grow = 1; }
  var c = rosetteCentre(i, k);
  return { cx: c.x, cy: c.y, rot: c.rot, env: env, grow: grow, k: k, cyc: cyc };
}

/* ---- drag vortex: recorded samples only, closed-form decay ---- */
var drags = [];
var dragging = false;
function pointerPos(e) {
  var rect = { left: 0, top: 0 };
  if (canvas.getBoundingClientRect) { try { rect = canvas.getBoundingClientRect(); } catch (err) { rect = { left: 0, top: 0 }; } }
  var x = (e.clientX !== undefined ? e.clientX : 0) - rect.left;
  var y = (e.clientY !== undefined ? e.clientY : 0) - rect.top;
  return { x: x, y: y };
}
function onDown(e) {
  dragging = true;
  var p = pointerPos(e);
  drags.push({ x: p.x, y: p.y, t: lastT });
  if (drags.length > 60) drags.shift();
}
function onMove(e) {
  if (!dragging) return;
  var p = pointerPos(e);
  var last = drags[drags.length - 1];
  if (last && Math.abs(p.x - last.x) + Math.abs(p.y - last.y) < 2) return;
  drags.push({ x: p.x, y: p.y, t: lastT });
  if (drags.length > 60) drags.shift();
}
function onUp() { dragging = false; }
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
/* vortex displacement of point (x,y) at piece time t: rotation + outward fling */
function vortex(x, y, t, fling) {
  var dx = 0, dy = 0, i, s, dt, w, ddx, ddy, d, fall, ang, ca, sa, rx, ry;
  var R = Math.max(70, Math.min(VW, VH) * 0.16);
  for (i = 0; i < drags.length; i++) {
    s = drags[i];
    dt = t - s.t;
    if (dt < 0 || dt > 4) continue;
    w = Math.exp(-dt / 1.1);
    ddx = x - s.x; ddy = y - s.y;
    d = Math.sqrt(ddx * ddx + ddy * ddy);
    fall = Math.exp(-(d * d) / (R * R));
    if (fall < 0.01) continue;
    ang = 0.55 * w * fall; /* tighten: rotate nearby strokes around the pointer */
    ca = Math.cos(ang); sa = Math.sin(ang);
    rx = ddx * ca - ddy * sa; ry = ddx * sa + ddy * ca;
    dx += (rx - ddx) + fling * (ddx / (d + 1)) * 26 * w * fall;
    dy += (ry - ddy) + fling * (ddy / (d + 1)) * 26 * w * fall;
  }
  return { x: x + dx, y: y + dy };
}

function drawRosette(i, t) {
  var st = rosetteState(i, t);
  if (st.env <= 0.02) return;
  var r = ROSETTES[i];
  var R = r.radFrac * VW;
  var u = Math.min(VW, VH) / 100;
  var slowSpin = st.rot + r.spin * t;
  var a, s, th, rad, wob, px, py, vp, steps, j;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (a = 0; a < r.arms.length; a++) {
    var arm = r.arms[a];
    var maxTh = arm.turns * TAU * arm.len * st.grow;
    steps = 110;
    ctx.strokeStyle = rgba(arm.col, (arm.col === DARK ? 0.85 : 0.75) * st.env);
    ctx.lineWidth = Math.max(0.8, arm.lw * u * 0.28);
    ctx.beginPath();
    for (s = 0; s <= steps; s++) {
      th = (s / steps) * maxTh;
      var frac = th / (arm.turns * TAU);
      rad = R * (arm.r0 + (1 - arm.r0) * Math.pow(frac, 0.9));
      /* ink wobble: radius breathes like a hand-drawn stroke */
      wob = 1 + arm.wob * Math.sin(th * arm.wobF + arm.wobP + 0.35 * Math.sin(t * 0.11 + arm.wobP));
      rad *= wob;
      var ang = arm.a0 + slowSpin + th + 0.22 * Math.sin(th * 0.7 + arm.wobP);
      px = st.cx + Math.cos(ang) * rad;
      py = st.cy + Math.sin(ang) * rad;
      vp = vortex(px, py, t, 0);
      if (s === 0) ctx.moveTo(vp.x, vp.y); else ctx.lineTo(vp.x, vp.y);
    }
    ctx.stroke();
    /* paisley head: a small filled comma at the arm root */
    var hx = st.cx + Math.cos(arm.a0 + slowSpin) * R * 0.10;
    var hy = st.cy + Math.sin(arm.a0 + slowSpin) * R * 0.10;
    var hv = vortex(hx, hy, t, 0);
    ctx.fillStyle = rgba(arm.col === LIGHT ? MID : LIGHT, 0.35 * st.env);
    ctx.beginPath();
    ctx.moveTo(hv.x + R * 0.03, hv.y);
    ctx.arc(hv.x, hv.y, R * 0.03, 0, TAU);
    ctx.fill();
  }
  /* loose strokes orbiting the rosette: flung outward by the vortex */
  for (j = 0; j < r.loose.length; j++) {
    var L = r.loose[j];
    var la = L.a + slowSpin * 0.6 + 0.05 * t * (j % 2 === 0 ? 1 : -1);
    var lx = st.cx + Math.cos(la) * R * L.r0;
    var ly = st.cy + Math.sin(la) * R * L.r0;
    var lx2 = st.cx + Math.cos(la + L.len) * R * (L.r0 + 0.08);
    var ly2 = st.cy + Math.sin(la + L.len) * R * (L.r0 + 0.08);
    var v1 = vortex(lx, ly, t, 1), v2 = vortex(lx2, ly2, t, 1);
    ctx.strokeStyle = rgba(L.col, 0.55 * st.env);
    ctx.lineWidth = Math.max(0.7, L.lw * u * 0.24);
    ctx.beginPath();
    ctx.moveTo(v1.x, v1.y);
    ctx.quadraticCurveTo(
      (v1.x + v2.x) / 2 + Math.sin(L.wobP + t * 0.2) * 3,
      (v1.y + v2.y) / 2 + Math.cos(L.wobP + t * 0.2) * 3,
      v2.x, v2.y);
    ctx.stroke();
  }
}

function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = 'rgb(' + GROUND[0] + ',' + GROUND[1] + ',' + GROUND[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var i;
  /* ground texture: faint whorl arcs, part of the ground the rosettes dissolve into */
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (i = 0; i < GROUND_ARCS.length; i++) {
    var g = GROUND_ARCS[i];
    ctx.strokeStyle = rgba(MID, g.a);
    ctx.lineWidth = Math.max(0.6, g.lw);
    ctx.beginPath();
    ctx.arc(g.x * VW, g.y * VH, g.r * Math.min(VW, VH), g.a0, g.a0 + g.sweep);
    ctx.stroke();
  }
  /* a slow, very faint large-scale churn behind the rosettes */
  ctx.strokeStyle = rgba(LIGHT, 0.022);
  ctx.lineWidth = Math.max(1, Math.min(VW, VH) * 0.002);
  for (i = 0; i < 5; i++) {
    var rr = (0.18 + i * 0.14) * Math.min(VW, VH);
    ctx.beginPath();
    ctx.arc(VW * 0.5, VH * 0.5, rr, t * 0.02 + i * 1.3, t * 0.02 + i * 1.3 + 1.6);
    ctx.stroke();
  }
  for (i = 0; i < N_ROS; i++) drawRosette(i, t);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
