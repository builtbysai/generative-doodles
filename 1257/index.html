<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soil/Soul Zoetrope</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#14100B; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
  No.1257 "Soil/Soul Zoetrope" — Esther Hz EH2, after Soil/Soul (2023).
  A hand-cranked paper zoetrope drum: 12 frames of Steiner's cow-horn
  burial ritual — stars wheeling above, the horn sinking into soil,
  astrality sparkles rising, roots drinking down to a star below.
  The 12 frames are shape PROGRAMS (drawn by code from a phase index),
  not offscreen canvases. NO auto-play: the drum turns only when the
  crank is dragged; on release it coasts down on friction (tau = 1.2 s).
  Tap toggles the slit mask. Silent.
*/

// ---------- seeded hashes ----------
var SEED = 1257;
function h1(n){ // deterministic hash -> [0,1)
  var x = Math.sin(n * 127.1 + SEED * 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function h2(a, b){ return h1(a * 57.31 + b * 131.7 + 9.17); }

// ---------- palette ----------
var ROOM   = "#14100B";  // the dark room around the drum
var DRUM   = "#2A2419";  // drum dark
var DRUMIN = "#191410";  // drum mouth interior
var BASE   = "#20180F";
var BASEED = "#332619";
var MASKC  = "#201A11";
var MASKED = "#0E0B07";
var PAPER  = "#D8CDB4";  // strip paper
var SOIL   = "#4A3423";  // soil umber
var SOILD  = "#38261A";  // soil speckle dark
var SOILL  = "#5A4230";  // soil speckle light / mound
var HORN   = "#E3D3B8";  // horn cream
var HORNSH = "#B89B62";  // horn banding
var STARW  = "#F5F2E8";  // star white
var ROOTG  = "#5E6B3F";  // root green
var SKYIN  = "#241B10";  // card sky (dark inside the paper frame)

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone(){
  try {
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    if (sw < 700) return true;
  } catch(e){}
  return H > W * 1.15;
}
function resize(){
  var vw = (window.visualViewport ? window.visualViewport.width  : window.innerWidth)  || 800;
  var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) || 600;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = vw; H = vh;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + "px";
  canvas.style.height = H + "px";
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
window.addEventListener("resize", resize);

// ---------- drum state ----------
// theta: drum angle (radians). Frame one is at rest: theta = 0, mask ON.
// Motion is event-driven physics: drag segments set theta directly;
// a coast segment is the closed form theta_r + omega*tau*(1-exp(-dt/tau)).
var TAU = 1.2;                    // friction time constant (s)
var NFR = 12, STEP = Math.PI * 2 / NFR;
var thetaRest = 0;                // theta while at rest / being dragged (live value)
var coast = null;                 // {thR, om, tR} while coasting
var maskOn = true;
var drag = null;                  // active pointer drag state
var startStamp = null, lastNow = 0;

function nowSec(){
  if (startStamp === null) return 0;
  return (lastNow - startStamp) / 1000;
}
function thetaAt(t){
  if (drag) return drag.theta;
  if (coast){
    var dt = t - coast.tR;
    if (dt <= 0) return coast.thR;
    var om = coast.om * Math.exp(-dt / TAU);
    if (Math.abs(om) < 0.02){ // settled: freeze where it stopped
      thetaRest = coast.thR + coast.om * TAU * (1 - Math.exp(-dt / TAU));
      coast = null;
      return thetaRest;
    }
    return coast.thR + coast.om * TAU * (1 - Math.exp(-dt / TAU));
  }
  return thetaRest;
}

// ---------- shape helpers (each arc/ellipse gets its own path) ----------
function dot(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
function ell(x, y, rx, ry){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.2832); }
function line(x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function sparkle(x, y, r){
  ctx.beginPath();
  ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
  ctx.stroke();
}

// ============================================================
//  The 12-frame strip: one ritual, frame k = phase k.
//  Card space: 100 wide x 132 tall.
// ============================================================
var BURY = [0, 0.30, 0.62, 0.85, 1, 1, 1, 1, 1, 1, 1, 1]; // horn sink per frame

function drawScene(k){
  var surfY = 58;             // soil surface line in card space
  // --- sky ---
  ctx.fillStyle = SKYIN;
  ctx.fillRect(5, 5, 90, surfY - 5);
  // stars wheeling on a flattened orbit around a pivot below the sky
  var wheel = k * 0.26;       // one notch per frame
  ctx.save();
  ctx.beginPath(); ctx.rect(5, 5, 90, surfY - 5); ctx.clip();
  for (var s = 0; s < 9; s++){
    var ang = wheel + s * (Math.PI * 2 / 9) + h1(s * 3.1) * 0.35;
    var rad = 27 + (s % 3) * 9 + h2(s, 4) * 5;
    var sx = 50 + rad * Math.cos(ang);
    var sy = 66 + rad * Math.sin(ang) * 0.92;
    if (sy < 8 || sy > surfY - 2 || sx < 7 || sx > 93) continue;
    ctx.fillStyle = STARW;
    ctx.globalAlpha = 0.55 + 0.45 * h2(s, 8);
    dot(sx, sy, s % 3 === 0 ? 1.7 : 1.15);
    if (s % 4 === 1){
      ctx.strokeStyle = STARW; ctx.lineWidth = 0.7;
      sparkle(sx, sy, 3.1);
    }
  }
  // moon sliver riding the same wheel
  var ma = wheel + 2.4, mx = 50 + 44 * Math.cos(ma), my = 66 + 44 * Math.sin(ma) * 0.92;
  if (my > 9 && my < surfY - 3 && mx > 9 && mx < 91){
    ctx.globalAlpha = 1;
    ctx.fillStyle = HORN;
    dot(mx, my, 4.6);
    ctx.fillStyle = SKYIN;
    dot(mx + 2.1, my - 1.1, 3.9);
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // --- soil (cross-section) ---
  ctx.fillStyle = SOIL;
  ctx.fillRect(5, surfY, 90, 127 - surfY);
  for (var p = 0; p < 30; p++){ // fixed speckle field: same soil every frame
    var px = 8 + h2(p, 1) * 84, py = surfY + 4 + h2(p, 2) * 62;
    ctx.fillStyle = (p % 3 === 0) ? SOILL : SOILD;
    dot(px, py, 0.8 + h2(p, 3) * 0.9);
  }
  ctx.strokeStyle = SOILL; ctx.lineWidth = 1.4;
  line(5, surfY, 95, surfY);

  var d = BURY[k];
  var hornTop = 24 + d * 30;  // 24 = standing at surface; 54 = fully buried
  var hornCx = 50;

  // pit notch while the horn is still entering
  if (d < 1){
    ctx.fillStyle = SOILD;
    ell(hornCx, surfY, 15 * (1 - d * 0.35), 2.6);
    ctx.fill();
  }

  // --- the horn ---
  ctx.beginPath();
  ctx.moveTo(hornCx - 8, hornTop);
  ctx.quadraticCurveTo(hornCx - 10, hornTop + 15, hornCx - 1, hornTop + 29);
  ctx.quadraticCurveTo(hornCx + 2, hornTop + 34, hornCx + 5, hornTop + 30);
  ctx.quadraticCurveTo(hornCx + 9, hornTop + 14, hornCx + 8, hornTop + 1);
  ctx.quadraticCurveTo(hornCx, hornTop - 2.5, hornCx - 8, hornTop);
  ctx.closePath();
  ctx.fillStyle = HORN;
  ctx.fill();
  ctx.strokeStyle = HORNSH; ctx.lineWidth = 0.9;
  ctx.stroke();
  // banding across the horn
  ctx.strokeStyle = "rgba(184,155,98,0.6)"; ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(hornCx - 8.6, hornTop + 11);
  ctx.quadraticCurveTo(hornCx, hornTop + 14.5, hornCx + 7.6, hornTop + 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hornCx - 7.2, hornTop + 21);
  ctx.quadraticCurveTo(hornCx, hornTop + 24, hornCx + 5.9, hornTop + 20);
  ctx.stroke();
  // rim of the horn mouth (visible until it slips under the surface)
  if (hornTop < surfY - 1){
    ctx.fillStyle = "#C9B489";
    ell(hornCx, hornTop, 6.8, 2.1);
    ctx.fill();
  }

  // --- buried phase: mound + astrality sparkles rising (frames 4-11) ---
  if (k >= 4){
    ctx.fillStyle = SOILL;
    ell(hornCx, surfY, 15, 3.4);
    ctx.fill();
    ctx.fillStyle = SOIL;
    ell(hornCx, surfY - 1.2, 10, 2.4);
    ctx.fill();
    var nsp = Math.min(k - 3, 5);
    for (var j = 0; j < nsp; j++){
      var ax = hornCx + (h2(k, j * 7 + 1) - 0.5) * 30;
      var ay = 50 - ((k * 2 + j * 7) % 24) - j * 1.5;
      if (ay < 9) ay = 9 + j * 2;
      ctx.strokeStyle = STARW;
      ctx.globalAlpha = 0.45 + 0.5 * h2(j, k);
      ctx.lineWidth = 0.9;
      sparkle(ax, ay, 2.4 + h2(j, 5) * 1.2);
    }
    ctx.globalAlpha = 1;
  }

  // --- roots drinking down (frames 8-11) ---
  if (k >= 8){
    var g = k - 7;                       // 1..4 growth steps
    var tipX = hornCx, tipY = hornTop + 33;
    var starY = 120;
    // the star below: cosmos under the soil, faint until the root reaches it
    ctx.fillStyle = STARW;
    ctx.globalAlpha = (k >= 11) ? 1 : 0.32;
    dot(hornCx, starY, 1.6);
    ctx.strokeStyle = STARW; ctx.lineWidth = 0.9;
    sparkle(hornCx, starY, (k >= 11) ? 4.4 : 3.0);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = ROOTG;
    ctx.lineCap = "round";
    // centre root
    ctx.lineWidth = 2.3;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.quadraticCurveTo(tipX + 2.5, tipY + g * 5, tipX - 1, tipY + g * 9.5);
    ctx.stroke();
    // side roots
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(tipX - 2, tipY - 1);
    ctx.quadraticCurveTo(tipX - 7, tipY + g * 3.4, tipX - 10, tipY + g * 6.2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tipX + 2, tipY - 1);
    ctx.quadraticCurveTo(tipX + 7, tipY + g * 3.2, tipX + 10, tipY + g * 6.0);
    ctx.stroke();
    if (g >= 3){ // root hairs at the centre tip
      ctx.lineWidth = 0.9;
      var ey = tipY + g * 9.5;
      line(tipX - 1, ey, tipX - 4.4, ey + 2.6);
      line(tipX - 1, ey, tipX + 2.2, ey + 3.0);
    }
  }

  // card ink edge
  ctx.strokeStyle = "rgba(74,52,35,0.55)";
  ctx.lineWidth = 1.1;
  ctx.strokeRect(5, 5, 90, 122);
}

// ============================================================
//  Drum geometry + drawing
// ============================================================
function geom(){
  var phone = isPhone();
  var drumW = phone ? W * 0.86 : Math.min(W * 0.74, H * 1.12);
  var cx = phone ? W * 0.465 : W * 0.485;
  var cy = H * (phone ? 0.40 : 0.44);
  var Rx = drumW / 2;
  var bandH = drumW * 0.375;
  var rimRy = drumW * 0.034;
  var botRy = rimRy * 0.85;
  return {
    phone: phone, drumW: drumW, cx: cx, cy: cy, Rx: Rx,
    bandH: bandH, rimRy: rimRy, botRy: botRy,
    rimCy: cy - bandH / 2, botCy: cy + bandH / 2
  };
}
function topY(g, phi){ return g.rimCy + g.rimRy * Math.cos(phi); }
function botY(g, phi){ return g.botCy + g.botRy * Math.cos(phi); }
function xAt(g, phi){ return g.cx + g.Rx * Math.sin(phi); }

function bandPath(g){
  ctx.beginPath();
  var i, phi;
  for (i = 0; i <= 30; i++){
    phi = -Math.PI / 2 + (i / 30) * Math.PI;
    var x = xAt(g, phi), y = topY(g, phi);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  for (i = 0; i <= 30; i++){
    phi = Math.PI / 2 - (i / 30) * Math.PI;
    ctx.lineTo(xAt(g, phi), botY(g, phi));
  }
  ctx.closePath();
}

function drawFrame(g, idx, phi){
  var half = STEP / 2 * 0.94;               // paper gap between frames
  var pL = phi - half, pR = phi + half;
  var xTL = xAt(g, pL), yTL = topY(g, pL);
  var xTR = xAt(g, pR), yTR = topY(g, pR);
  var xBR = xAt(g, pR), yBR = botY(g, pR);
  var xBL = xAt(g, pL), yBL = botY(g, pL);
  ctx.beginPath();
  ctx.moveTo(xTL, yTL); ctx.lineTo(xTR, yTR);
  ctx.lineTo(xBR, yBR); ctx.lineTo(xBL, yBL);
  ctx.closePath();
  ctx.fillStyle = PAPER;
  ctx.fill();
  ctx.save();
  ctx.clip();
  var ccx = (xTL + xTR + xBR + xBL) / 4, ccy = (yTL + yTR + yBR + yBL) / 4;
  var fw = Math.abs(xTR - xTL), fh = Math.abs(yBL - yTL);
  ctx.translate(ccx, ccy);
  ctx.scale(fw / 100, fh / 132);
  ctx.translate(-50, -66);
  drawScene(idx);
  ctx.restore();
  // paper edge over the clip
  ctx.beginPath();
  ctx.moveTo(xTL, yTL); ctx.lineTo(xTR, yTR);
  ctx.lineTo(xBR, yBR); ctx.lineTo(xBL, yBL);
  ctx.closePath();
  ctx.strokeStyle = DRUM;
  ctx.lineWidth = Math.max(1.2, g.drumW * 0.0022);
  ctx.stroke();
}

function drawMask(g){
  // gaps centred where the five front frames rest at theta = 0
  var phis = [-Math.PI / 3, -Math.PI / 6, 0, Math.PI / 6, Math.PI / 3];
  var gaps = [];
  for (var i = 0; i < phis.length; i++){
    var fw = Math.abs(xAt(g, phis[i] + STEP / 2) - xAt(g, phis[i] - STEP / 2));
    gaps.push({ c: xAt(g, phis[i]), hw: fw * 0.335 });
  }
  gaps.sort(function(a, b){ return a.c - b.c; });
  ctx.save();
  bandPath(g);
  ctx.clip();
  ctx.fillStyle = MASKC;
  var x0 = g.cx - g.Rx - 2, x1 = g.cx + g.Rx + 2;
  var y0 = g.rimCy - 3, y1 = g.botCy + g.botRy + 3;
  var cur = x0;
  for (var j = 0; j < gaps.length; j++){
    var gl = gaps[j].c - gaps[j].hw, gr = gaps[j].c + gaps[j].hw;
    if (gl > cur) ctx.fillRect(cur, y0, gl - cur, y1 - y0);
    cur = Math.max(cur, gr);
  }
  if (cur < x1) ctx.fillRect(cur, y0, x1 - cur, y1 - y0);
  // thin dark seams at each gap edge
  ctx.fillStyle = MASKED;
  for (var m = 0; m < gaps.length; m++){
    ctx.fillRect(gaps[m].c - gaps[m].hw - 1, y0, 2, y1 - y0);
    ctx.fillRect(gaps[m].c + gaps[m].hw - 1, y0, 2, y1 - y0);
  }
  ctx.restore();
}

function drawMaskRaised(g){
  // the mask ring lifted: a thin slitted strip hovering above the drum
  var y = g.rimCy - g.drumW * 0.115;
  var hh = g.drumW * 0.045;
  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = MASKC;
  ctx.fillRect(g.cx - g.Rx, y, g.Rx * 2, hh);
  // slits show the room through them
  ctx.fillStyle = ROOM;
  var phis = [-Math.PI / 3, -Math.PI / 6, 0, Math.PI / 6, Math.PI / 3];
  for (var i = 0; i < phis.length; i++){
    var fw = Math.abs(xAt(g, phis[i] + STEP / 2) - xAt(g, phis[i] - STEP / 2));
    ctx.fillRect(xAt(g, phis[i]) - fw * 0.335, y, fw * 0.67, hh);
  }
  ctx.strokeStyle = BASEED; ctx.lineWidth = 1.2;
  ctx.strokeRect(g.cx - g.Rx, y, g.Rx * 2, hh);
  ctx.restore();
  // two slim posts holding it up
  ctx.strokeStyle = BASE; ctx.lineWidth = Math.max(2, g.drumW * 0.006);
  line(g.cx - g.Rx * 0.92, y + hh, g.cx - g.Rx * 0.92, g.rimCy - 2);
  line(g.cx + g.Rx * 0.92, y + hh, g.cx + g.Rx * 0.92, g.rimCy - 2);
}

function drawRoom(){
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, W, H);
  // the room's own stars: static, seeded, everywhere (drum covers the middle)
  for (var s = 0; s < 120; s++){
    var sx = h2(s, 21) * W, sy = h2(s, 22) * H;
    var r = 0.7 + h2(s, 23) * 1.5;
    ctx.fillStyle = STARW;
    ctx.globalAlpha = 0.18 + 0.55 * h2(s, 24);
    dot(sx, sy, r);
    if (s % 13 === 0){
      ctx.strokeStyle = STARW; ctx.lineWidth = 0.8;
      sparkle(sx, sy, r * 2.6);
    }
  }
  ctx.globalAlpha = 1;
}

function draw(t){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var g = geom();
  var th = thetaAt(t);
  drawRoom();

  // floor shadow + stand
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ell(g.cx, g.botCy + g.drumW * 0.155, g.Rx * 0.86, g.drumW * 0.028);
  ctx.fill();
  ctx.beginPath(); // plinth trapezoid
  ctx.moveTo(g.cx - g.Rx * 0.52, g.botCy + g.botRy * 0.3);
  ctx.lineTo(g.cx + g.Rx * 0.52, g.botCy + g.botRy * 0.3);
  ctx.lineTo(g.cx + g.Rx * 0.68, g.botCy + g.drumW * 0.135);
  ctx.lineTo(g.cx - g.Rx * 0.68, g.botCy + g.drumW * 0.135);
  ctx.closePath();
  ctx.fillStyle = BASE;
  ctx.fill();
  ctx.strokeStyle = BASEED; ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.fillStyle = "#2A2115"; // platter disc
  ell(g.cx, g.botCy + g.drumW * 0.138, g.Rx * 0.70, g.drumW * 0.020);
  ctx.fill();

  // top rim: full ellipse, then the dark mouth inside it
  ctx.fillStyle = DRUM;
  ell(g.cx, g.rimCy, g.Rx, g.rimRy);
  ctx.fill();
  ctx.fillStyle = DRUMIN;
  ell(g.cx, g.rimCy, g.Rx * 0.865, g.rimRy * 0.60);
  ctx.fill();
  // bottom rim front
  ctx.fillStyle = "#241C11";
  ell(g.cx, g.botCy, g.Rx, g.botRy);
  ctx.fill();

  // frames, side-most first so the centre frame lands on top
  var vis = [];
  for (var i = 0; i < NFR; i++){
    var phi = i * STEP - th;
    while (phi > Math.PI) phi -= Math.PI * 2;
    while (phi < -Math.PI) phi += Math.PI * 2;
    if (Math.cos(phi) > 0.03) vis.push({ idx: i, phi: phi, c: Math.cos(phi) });
  }
  vis.sort(function(a, b){ return a.c - b.c; });
  for (var v = 0; v < vis.length; v++) drawFrame(g, vis[v].idx, vis[v].phi);

  // slit mask over the band, or raised above it
  if (maskOn) drawMask(g); else drawMaskRaised(g);

  // band outline
  bandPath(g);
  ctx.strokeStyle = "rgba(14,11,7,0.8)";
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // crank: strut from drum to axle, arm + grip rotate with theta
  var ax = g.cx + g.Rx + g.drumW * 0.030;
  var ay = g.botCy + g.drumW * 0.088;
  ctx.strokeStyle = "#241B10";
  ctx.lineWidth = Math.max(3, g.drumW * 0.011);
  line(g.cx + g.Rx * 0.82, g.botCy + g.drumW * 0.045, ax, ay);
  var psi = th + 2.25;                       // crank angle (rest pose at theta 0)
  var armL = g.drumW * 0.062;
  var gx = ax + armL * Math.cos(psi), gy = ay + armL * Math.sin(psi);
  ctx.strokeStyle = "#4A3A26";
  ctx.lineWidth = Math.max(3.5, g.drumW * 0.008);
  line(ax, ay, gx, gy);
  ctx.fillStyle = HORN;                      // grip
  dot(gx, gy, Math.max(6, g.drumW * 0.020));
  ctx.strokeStyle = DRUM; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(gx, gy, Math.max(6, g.drumW * 0.020), 0, 6.2832); ctx.stroke();
  ctx.fillStyle = DRUM;                      // hub
  dot(ax, ay, Math.max(4.5, g.drumW * 0.011));
  ctx.strokeStyle = "#57492F"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(ax, ay, Math.max(4.5, g.drumW * 0.011), 0, 6.2832); ctx.stroke();

  // pin the CSS size every draw (house rule)
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
}

// ---------- interaction ----------
// Drag near the crank: circular cranking around the axle.
// Drag elsewhere: pushing the drum (horizontal travel turns the axle).
// Release: coast with exponential friction. Tap (no drag): toggle mask.
function axle(){
  var g = geom();
  return { x: g.cx + g.Rx + g.drumW * 0.030, y: g.botCy + g.drumW * 0.088, g: g };
}
function angDiff(a, b){
  var d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
canvas.addEventListener("pointerdown", function(e){
  var t = nowSec();
  var th = thetaAt(t);
  var a = axle();
  var nearCrank = Math.hypot(e.clientX - a.x, e.clientY - a.y) < a.g.drumW * 0.30;
  drag = {
    theta: th, mode: nearCrank ? "crank" : "push",
    lastAng: Math.atan2(e.clientY - a.y, e.clientX - a.x),
    lastX: e.clientX, moved: false,
    samples: [{ t: t, th: th }]
  };
  coast = null;
});
canvas.addEventListener("pointermove", function(e){
  if (!drag) return;
  var t = nowSec();
  var a = axle();
  var dth = 0;
  if (drag.mode === "crank"){
    var ang = Math.atan2(e.clientY - a.y, e.clientX - a.x);
    dth = angDiff(ang, drag.lastAng);
    drag.lastAng = ang;
  } else {
    dth = (e.clientX - drag.lastX) / a.g.Rx * 1.2;
    drag.lastX = e.clientX;
  }
  if (Math.abs(dth) > 0.0005) drag.moved = true;
  drag.theta += dth;
  drag.samples.push({ t: t, th: drag.theta });
  if (drag.samples.length > 6) drag.samples.shift();
});
function endDrag(){
  if (!drag) return;
  var t = nowSec();
  var wasDrag = drag.moved;
  var th = drag.theta, om = 0;
  if (wasDrag && drag.samples.length >= 2){
    var s0 = drag.samples[0], s1 = drag.samples[drag.samples.length - 1];
    if (s1.t - s0.t > 0.03) om = (s1.th - s0.th) / (s1.t - s0.t);
    if (Math.abs(om) > 6) om = 6 * Math.sign(om);
  }
  drag = null;
  if (wasDrag && Math.abs(om) > 0.05){
    coast = { thR: th, om: om, tR: t };
  } else if (wasDrag){
    thetaRest = th;
  } else {
    maskOn = !maskOn;   // a tap: toggle the slit mask
    thetaRest = th;
  }
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

// ---------- run ----------
resize();
draw(0); // synchronous fixed-phase first frame: drum at rest, mask on
function frame(now){
  lastNow = now;
  if (startStamp === null) startStamp = now;
  draw(nowSec());
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
</script>
