<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Lit Drones</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0C10; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var LOOP = 45;          // one full mind-read cycle, seconds
  var PHASE = 13;         // fixed first frame: mid-reveal hold (cycle time 13 s)
  var NDRONES = 15;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var vw = 0, vh = 0, dpr = 1;
  var curT = PHASE;

  // visitor's chosen number: {cycle, num} once a drag completes, else null.
  // State is a closed-form function of t and this one recorded event.
  var chosen = null;
  var dragNum = null;     // number under the pointer while dragging

  // ---- deterministic PRNG (mulberry32) ----
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }
  function lerp(a, b, f) { return a + (b - a) * f; }

  function isPhone() {
    try {
      var s = window.screen;
      if (s && Math.min(s.width, s.height) < 700) return true;
    } catch (e) {}
    return vh > vw * 1.15;
  }

  // ---- per-drone seeded constants (ring jitter, bob phases) ----
  var drones = [];
  (function () {
    var r = rng(10940707);
    for (var i = 0; i < NDRONES; i++) {
      drones.push({
        ang: (i / NDRONES) * Math.PI * 2 + (r() - 0.5) * 0.14,
        rad: (r() - 0.5) * 0.045,          // radius jitter, in units of S
        bobF: 0.5 + r() * 0.7,             // bob frequency
        bobP: r() * Math.PI * 2,           // bob phase
        bobA: 0.003 + r() * 0.003,         // bob amplitude, units of S
        swayP: r() * Math.PI * 2
      });
    }
  })();

  // ---- the number for cycle k: visitor's choice wins from the next
  // cycle after the drag; otherwise a seeded sequence. Cycle 0 is 3. ----
  function numberFor(k) {
    if (chosen && k > chosen.cycle) return chosen.num;
    if (k === 0) return 3;
    var r = rng(77003 + k * 131);
    return 1 + Math.floor(r() * 6);
  }
  // ---- the revealed set for cycle k: seeded shuffle, first N ----
  function revealedSet(k, n) {
    var idx = [];
    for (var i = 0; i < NDRONES; i++) idx.push(i);
    var r = rng(5150 + k * 977);
    for (var i = NDRONES - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    var set = {};
    for (var m = 0; m < n; m++) set[idx[m]] = true;
    return set;
  }

  // ---- cycle timeline (ct in [0,45)) ----
  //  0-6   dial sweep 1 -> N
  //  6-10  pan: drones turn to face the figure
  // 10-11  reveal: red fades in over a full second, chosen descend
  // 11-16  hold
  // 16-18  red fades out, dim light returns
  // 40-45  needle eases back to 1 for the next sweep
  function needleAt(ct, n) {
    if (dragNum !== null) return dragNum;
    if (ct < 6) return 1 + (n - 1) * smooth(ct / 6);
    if (ct < 40) return n;
    return n + (1 - n) * smooth((ct - 40) / 5);
  }
  function facingAt(ct) {
    if (ct < 6) return 0;
    if (ct < 10) return smooth((ct - 6) / 4);
    if (ct < 18) return 1;
    if (ct < 22) return 1 - smooth((ct - 18) / 4);
    return 0;
  }
  function revealAt(ct) { // red intensity / descend amount, 0..1
    if (ct < 10) return 0;
    if (ct < 11) return smooth(ct - 10);
    if (ct < 16) return 1;
    if (ct < 18) return 1 - smooth((ct - 16) / 2);
    return 0;
  }

  function drawDrone(x, y, size, rot, dimA, redA, phone) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    var s = size;
    // glow first (flat-alpha layered circles)
    if (redA > 0.003) {
      ctx.fillStyle = '#FF2A1E';
      ctx.globalAlpha = 0.10 * redA;
      ctx.beginPath(); ctx.arc(0, 0, s * 3.1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.16 * redA;
      ctx.beginPath(); ctx.arc(0, 0, s * 2.1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.28 * redA;
      ctx.beginPath(); ctx.arc(0, 0, s * 1.35, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (dimA > 0.003) {
      ctx.fillStyle = '#E8E8E6';
      ctx.globalAlpha = 0.05 * dimA;
      ctx.beginPath(); ctx.arc(0, 0, s * 2.0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.10 * dimA;
      ctx.beginPath(); ctx.arc(0, 0, s * 1.25, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // skeletal frame: X arms + 4 rotor rings + hub
    ctx.strokeStyle = '#3A3A40';
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = Math.max(1, s * 0.16);
    var a = s * 0.95;
    ctx.beginPath();
    ctx.moveTo(-a, -a); ctx.lineTo(a, a);
    ctx.moveTo(-a, a); ctx.lineTo(a, -a);
    ctx.stroke();
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = Math.max(1, s * 0.13);
    var corners = [[-a, -a], [a, -a], [a, a], [-a, a]];
    for (var i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(corners[i][0], corners[i][1], s * 0.42, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // hub: dark body, red when lit
    ctx.fillStyle = redA > 0.003 ? '#FF2A1E' : '#1A1A1E';
    ctx.globalAlpha = redA > 0.003 ? (0.35 + 0.65 * redA) : 1;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.52, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // nose tick: the facing direction
    ctx.strokeStyle = '#E8E8E6';
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = Math.max(1, s * 0.14);
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.5);
    ctx.lineTo(0, -s * 1.15);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function draw(t) {
    if (!vw || !vh) return;
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    var phone = isPhone();
    var S = Math.min(vw, vh);
    var ox = (vw - S) / 2, oy = (vh - S) / 2;
    var cx = ox + S / 2, cy = oy + S * 0.56;

    var cyc = Math.floor(t / LOOP);
    var ct = t - cyc * LOOP;
    var n = numberFor(cyc);
    var set = revealedSet(cyc, n);
    var rev = revealAt(ct);
    var face = facingAt(ct);
    var needle = needleAt(ct, n);

    // ---- stage ----
    ctx.fillStyle = '#0B0C10';
    ctx.fillRect(0, 0, vw, vh);

    // ---- dial: shallow arc across the top, numerals 1-6 ----
    var dcx = cx, dcy = oy + S * 1.02, dR = S * 0.95;
    var a0 = -Math.PI / 2 - 0.50, a1 = -Math.PI / 2 + 0.50;
    ctx.strokeStyle = '#3A3A40';
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = Math.max(1, S * 0.0022);
    ctx.beginPath(); ctx.arc(dcx, dcy, dR, a0, a1); ctx.stroke();
    ctx.font = Math.max(9, S * (phone ? 0.026 : 0.022)) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var d = 0; d < 6; d++) {
      var da = a0 + (a1 - a0) * (d / 5);
      var tx = dcx + Math.cos(da) * dR, ty = dcy + Math.sin(da) * dR;
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(dcx + Math.cos(da) * (dR - S * 0.012), dcy + Math.sin(da) * (dR - S * 0.012));
      ctx.lineTo(dcx + Math.cos(da) * (dR + S * 0.012), dcy + Math.sin(da) * (dR + S * 0.012));
      ctx.stroke();
      ctx.fillStyle = '#3A3A40';
      ctx.fillText(String(d + 1),
        dcx + Math.cos(da) * (dR + S * 0.038),
        dcy + Math.sin(da) * (dR + S * 0.038));
    }
    // needle + resting marker
    var na = a0 + (a1 - a0) * ((needle - 1) / 5);
    ctx.strokeStyle = '#E8E8E6';
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(1, S * 0.0022);
    ctx.beginPath();
    ctx.moveTo(dcx + Math.cos(na) * (dR - S * 0.055), dcy + Math.sin(na) * (dR - S * 0.055));
    ctx.lineTo(dcx + Math.cos(na) * dR, dcy + Math.sin(na) * dR);
    ctx.stroke();
    ctx.fillStyle = '#E8E8E6';
    ctx.beginPath();
    ctx.arc(dcx + Math.cos(na) * dR, dcy + Math.sin(na) * dR, S * 0.006, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // ---- fog: three bands drifting horizontally, layered flat alpha
    // so the edges feather instead of reading as solid slabs ----
    ctx.fillStyle = '#2A2D33';
    var fogY = [0.34, 0.58, 0.80];
    var fogSpd = [0.011, -0.007, 0.009];
    var fogH = [0.040, 0.055, 0.038];
    for (var f = 0; f < 3; f++) {
      var fx = cx + Math.sin(t * fogSpd[f] * Math.PI * 2 + f * 2.1) * S * 0.16;
      var layers = [[0.62, 1.00, 0.09], [0.50, 0.78, 0.11], [0.38, 0.55, 0.12]];
      for (var L = 0; L < 3; L++) {
        ctx.globalAlpha = layers[L][2];
        ctx.beginPath();
        ctx.ellipse(fx, oy + S * fogY[f], S * layers[L][0], S * fogH[f] * layers[L][1], 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // ---- the figure: small, dark, at the center of the ring ----
    var fh = S * 0.085;
    ctx.fillStyle = '#0E0E10';
    ctx.strokeStyle = '#2A2D33';
    ctx.globalAlpha = 1;
    ctx.lineWidth = Math.max(1, S * 0.0018);
    ctx.beginPath(); ctx.arc(cx, cy - fh * 0.52, fh * 0.16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - fh * 0.14, cy + fh * 0.55);
    ctx.quadraticCurveTo(cx - fh * 0.17, cy - fh * 0.30, cx - fh * 0.10, cy - fh * 0.36);
    ctx.lineTo(cx + fh * 0.10, cy - fh * 0.36);
    ctx.quadraticCurveTo(cx + fh * 0.17, cy - fh * 0.30, cx + fh * 0.14, cy + fh * 0.55);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // ---- drones ----
    var R = S * 0.35;
    var baseSize = S * (phone ? 0.030 : 0.027);
    for (var i = 0; i < NDRONES; i++) {
      var dr = drones[i];
      var isLit = !!set[i];
      var rr = R + dr.rad * S;
      var bx = cx + Math.cos(dr.ang) * rr + Math.sin(t * dr.bobF * 0.7 + dr.swayP) * S * 0.0022;
      var by = cy + Math.sin(dr.ang) * rr * 0.92 + Math.sin(t * dr.bobF + dr.bobP) * dr.bobA * S;
      var descend = isLit ? rev : 0;
      var px = bx;
      var py = by + descend * S * 0.012;               // slightly lower
      var size = baseSize * (1 + descend * 0.08);      // and slightly nearer
      var tangent = dr.ang + Math.PI / 2;
      var toCenter = dr.ang + Math.PI;
      var rot = tangent + (toCenter - tangent) * face;
      var dimA = (1 - rev) * (0.55 + 0.45 * Math.sin(t * dr.bobF + dr.bobP) * 0.5 + 0.225);
      var redA = isLit ? rev : 0;
      if (!isLit) dimA = dimA * (1 - rev);             // the rest go dark at the reveal
      drawDrone(px, py, size, rot, isLit ? 0 : dimA, redA, phone);
    }

    curT = t;
  }

  // ---- drag horizontally to choose the number for the next cycle ----
  function numFromX(x) {
    var S = Math.min(vw, vh);
    var ox = (vw - S) / 2;
    var f = (x - (ox + S * 0.08)) / (S * 0.84);
    var v = Math.round(1 + clamp01(f) * 5);
    return v < 1 ? 1 : v > 6 ? 6 : v;
  }
  var dragging = false;
  function onDown(e) {
    dragging = true;
    dragNum = numFromX(e.clientX || 0);
    draw(curT);
  }
  function onMove(e) {
    if (!dragging) return;
    dragNum = numFromX(e.clientX || 0);
    draw(curT);
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var v = numFromX(e.clientX || 0);
    chosen = { cycle: Math.floor(curT / LOOP), num: v };
    dragNum = null;
    draw(curT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    if (window.addEventListener) {
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }
  }

  function resize() {
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    } else {
      vw = window.innerWidth;
      vh = window.innerHeight;
    }
    dpr = window.devicePixelRatio || 1;
    if (dpr > 2) dpr = 2;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(curT);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) window.addEventListener('resize', resize);

  resize();
  draw(PHASE);

  // motion loop: anchored at the fixed phase, elapsed time only
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var loop = function (now) {
      if (t0 === null) t0 = now;
      draw(PHASE + (now - t0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
