<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.396 Nine Cats</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FAF3E6; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.396 Nine Cats (galitskaya-illustration).
// After Anna Galitskaya's cat contact sheet: a 3x3
// catalog of cats in costume around her wordmark
// block. One cat body recipe (round body, ears, tail)
// wears eight costume-activity overlay sets: gardener
// in overalls, scholar with telescope, black cat under
// a spotted umbrella, frog hat on a watermelon slice,
// kitten in foliage, two kittens looking up, white cat
// hugging a knitted cactus, grey cat in a mushroom cap
// with a lantern. The centre cell is the wordmark:
// the piece title lettered in a flat rounded rectangle
// with a tiny fox glyph, the only text in the piece
// under the batch's designed-text exception. TAP a cat
// cell and that cat alone redraws itself in the NEXT
// costume-activity from its own fixed sequence (a
// rotation of the eight sets, never random) through a
// 0.8s stroke reveal; the wordmark never changes and
// is not tappable. All cats breathe on staggered whole
// cycles of the 20s loop and blink at fixed slots.
// Palette is closed at the five specced hexes. All
// scatter is fixed seeded data baked at load; one
// canvas, no offscreen canvas, no gradients, no
// filters, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#FAF3E6', INK = '#3A3330', GRAY = '#A89B8C';
var RUST = '#D96C4A', TEAL = '#2E8B8B';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 20;
if (LOOP !== 20) throw new Error('Nine Cats loop must be 20s');
var REVEAL_T = 0.8;
var BLINK_P = 5; // 4 whole blink cycles per loop
if (LOOP % BLINK_P !== 0) throw new Error('blink period must divide the loop');
var TICK = 1 / 60;
var PI = Math.PI;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-looking
// value is baked from this at load and never changes
// between frames or renders.
var seed = 396;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- point and path helpers ----------------------------
// Every mark in the piece is a sampled point list baked
// at load; fills and lines alike carry cumulative arc
// lengths so a vignette can redraw by stroke reveal.
function ellPts(cx, cy, rx, ry, n, a0, a1, rot) {
  var pts = [], i, a, x, y;
  var cr = Math.cos(rot || 0), sr = Math.sin(rot || 0);
  if (a0 === undefined) a0 = 0;
  if (a1 === undefined) a1 = PI * 2;
  for (i = 0; i <= n; i++) {
    a = a0 + (a1 - a0) * i / n;
    x = Math.cos(a) * rx; y = Math.sin(a) * ry;
    pts.push([cx + x * cr - y * sr, cy + x * sr + y * cr]);
  }
  return pts;
}
function qPts(p0, p1, p2, n) {
  var pts = [], i, t;
  for (i = 0; i <= n; i++) {
    t = i / n;
    pts.push([(1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * p1[0] + t * t * p2[0],
              (1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * p1[1] + t * t * p2[1]]);
  }
  return pts;
}
function join() {
  var out = [], i, j, a;
  for (i = 0; i < arguments.length; i++) {
    a = arguments[i];
    for (j = 0; j < a.length; j++) { if (out.length && j === 0) continue; out.push(a[j]); }
  }
  return out;
}
function mov(pts, dx, dy, s) {
  return pts.map(function (p) { return [p[0] * s + dx, p[1] * s + dy]; });
}
function rotPts(pts, cx, cy, ang) {
  var cr = Math.cos(ang), sr = Math.sin(ang);
  return pts.map(function (p) {
    var x = p[0] - cx, y = p[1] - cy;
    return [cx + x * cr - y * sr, cy + x * sr + y * cr];
  });
}
function rrectPts(x, y, w, h, r) {
  return join(
    [[x + r, y], [x + w - r, y]],
    ellPts(x + w - r, y + r, r, r, 5, -PI / 2, 0),
    [[x + w, y + h - r]],
    ellPts(x + w - r, y + h - r, r, r, 5, 0, PI / 2),
    [[x + r, y + h]],
    ellPts(x + r, y + h - r, r, r, 5, PI / 2, PI),
    [[x, y + r]],
    ellPts(x + r, y + r, r, r, 5, PI, PI * 1.5));
}
function starPts(cx, cy, r, ri) {
  var pts = [], i, a, rad;
  for (i = 0; i < 10; i++) {
    a = -PI / 2 + i * PI / 5;
    rad = (i % 2 === 0) ? r : ri;
    pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
  }
  return pts;
}
function leafPts(cx, cy, len, wid, ang) {
  var ux = Math.cos(ang), uy = Math.sin(ang);
  var px = -uy, py = ux;
  var tip = [cx + ux * len, cy + uy * len];
  var c1 = [cx + ux * len * 0.45 + px * wid, cy + uy * len * 0.45 + py * wid];
  var c2 = [cx + ux * len * 0.45 - px * wid, cy + uy * len * 0.45 - py * wid];
  return join(qPts([cx, cy], c1, tip, 7), qPts(tip, c2, [cx, cy], 7));
}

// ---- vignette elements ---------------------------------
// k 'f': closed sampled path, filled flat and inked.
// k 'l': open polyline stroke. k 'd': small filled dot.
// ns on a fill suppresses the ink outline (soft shadow).
function elF(pts, color, alpha, ns) {
  return { k: 'f', pts: pts, color: color, alpha: (alpha === undefined ? 1 : alpha), ns: !!ns };
}
function elL(pts, color, width, alpha) {
  return { k: 'l', pts: pts, color: color, width: width || 2, alpha: (alpha === undefined ? 1 : alpha) };
}
function elD(x, y, r, color, alpha) {
  return { k: 'd', x: x, y: y, r: r, color: color, alpha: (alpha === undefined ? 1 : alpha) };
}
function bakeEl(el) {
  var cum = [0], i, dx, dy;
  if (el.k === 'd') { el.cum = [0, 8]; el.len = 8; return el; }
  if (el.k === 'f') {
    var f = el.pts[0], l = el.pts[el.pts.length - 1];
    if (f[0] !== l[0] || f[1] !== l[1]) el.pts = el.pts.concat([[f[0], f[1]]]);
  }
  for (i = 1; i < el.pts.length; i++) {
    dx = el.pts[i][0] - el.pts[i - 1][0]; dy = el.pts[i][1] - el.pts[i - 1][1];
    cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
  }
  el.cum = cum; el.len = cum[cum.length - 1];
  return el;
}
function bakeVig(v) {
  var t = 0, i;
  for (i = 0; i < v.els.length; i++) { bakeEl(v.els[i]); t += v.els[i].len; }
  v.total = t;
  return v;
}
function tracePts(pts, close) {
  var i;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function strokeTo(el, upto) {
  var pts = el.pts, cum = el.cum, i, seg, f;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  if (upto >= el.len) {
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  } else {
    for (i = 1; i < pts.length; i++) {
      if (cum[i] <= upto) { ctx.lineTo(pts[i][0], pts[i][1]); continue; }
      seg = cum[i] - cum[i - 1];
      f = seg > 0 ? (upto - cum[i - 1]) / seg : 0;
      ctx.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f,
                 pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f);
      break;
    }
  }
  ctx.stroke();
}
function drawEl(el, p) {
  if (p <= 0) return;
  ctx.globalAlpha = el.alpha;
  if (el.k === 'd') {
    if (p >= 0.6) {
      ctx.fillStyle = el.color;
      ctx.beginPath();
      ctx.arc(el.x, el.y, el.r, 0, PI * 2);
      ctx.fill();
    }
  } else if (el.k === 'l') {
    ctx.strokeStyle = el.color;
    ctx.lineWidth = el.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    strokeTo(el, el.len * p);
  } else {
    if (p >= 0.55) {
      ctx.fillStyle = el.color;
      tracePts(el.pts, true);
      ctx.fill();
    }
    if (p > 0 && !el.ns) {
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2.1;
      ctx.lineJoin = 'round';
      strokeTo(el, el.len * p);
    }
  }
  ctx.globalAlpha = 1;
}
function drawVig(v, frac) {
  var budget = v.total * frac, i, el, p;
  for (i = 0; i < v.els.length; i++) {
    el = v.els[i];
    p = budget <= 0 ? 0 : Math.min(1, budget / el.len);
    drawEl(el, p);
    budget -= el.len;
  }
}

// ---- the cat body recipe -------------------------------
// One recipe in cell-local space (origin at cell centre,
// ground line at y 88): soft ground shadow, curled tail,
// round body with a flattened base, two pointed ears,
// round head, ink nose, mouth and whiskers. The tint is
// part of the costume-activity: each overlay set says
// which cat is wearing it. Eyes are returned separately
// and drawn after everything else, so they can blink.
function catBase(s, dx, dy, tint, tintA, belly) {
  var els = [], eyes = [];
  function M(pts) { return mov(pts, dx, dy, s); }
  els.push(elF(M(ellPts(0, 88, 66, 9, 20)), GRAY, 0.3, true));
  els.push(elF(M(ellPts(56, 62, 46, 17, 22, 0, PI * 2, -0.35)), tint, tintA));
  var body = ellPts(0, 22, 58, 64, 36).map(function (p) {
    var y = p[1];
    if (y > 86) y = 86 - (y - 86) * 0.15;
    return [p[0], y];
  });
  els.push(elF(M(body), tint, tintA));
  if (belly) els.push(elF(M(ellPts(0, 40, 30, 34, 24)), belly.color, belly.alpha));
  els.push(elF(M([[-36, -72], [-35, -92], [-31, -109], [-16, -97], [-3, -85]]), tint, tintA));
  els.push(elF(M([[36, -72], [35, -92], [31, -109], [16, -97], [3, -85]]), tint, tintA));
  els.push(elF(M([[-28, -80], [-26, -98], [-12, -85]]), GROUND, 0.55));
  els.push(elF(M([[28, -80], [26, -98], [12, -85]]), GROUND, 0.55));
  els.push(elF(M(ellPts(0, -54, 38, 38, 30)), tint, tintA));
  els.push(elF(M([[-4.5, -45], [4.5, -45], [0, -39]]), INK, 1));
  els.push(elL(M(qPts([0, -39], [-3, -34], [-8, -35], 6)), INK, 1.6));
  els.push(elL(M(qPts([0, -39], [3, -34], [8, -35], 6)), INK, 1.6));
  els.push(elL(M([[16, -44], [44, -48]]), INK, 1.4));
  els.push(elL(M([[17, -39], [45, -38]]), INK, 1.4));
  els.push(elL(M([[16, -34], [42, -27]]), INK, 1.4));
  els.push(elL(M([[-16, -44], [-44, -48]]), INK, 1.4));
  els.push(elL(M([[-17, -39], [-45, -38]]), INK, 1.4));
  els.push(elL(M([[-16, -34], [-42, -27]]), INK, 1.4));
  eyes.push({ x: -14 * s + dx, y: -56 * s + dy, r: 3.4 * s });
  eyes.push({ x: 14 * s + dx, y: -56 * s + dy, r: 3.4 * s });
  return { els: els, eyes: eyes };
}

// ---- the eight costume-activity overlay sets -----------
// Set 0, gardener: tan cat (warm grey at half strength)
// in teal overalls with a rust pocket, watering can and
// trowel beside.
function vig0() {
  var b = catBase(1, 0, 0, GRAY, 0.5, { color: GROUND, alpha: 0.35 });
  var els = b.els;
  var ov = ellPts(0, 56, 42, 32, 28).map(function (p) {
    var y = p[1];
    if (y > 86) y = 86 - (y - 86) * 0.15;
    return [p[0], y];
  });
  els.push(elF(ov, TEAL, 1));
  els.push(elL([[0, 74], [0, 86]], INK, 2, 0.45));
  els.push(elF([[-25, 2], [-15, 2], [-19, 36], [-29, 36]], TEAL, 1));
  els.push(elF([[25, 2], [15, 2], [19, 36], [29, 36]], TEAL, 1));
  els.push(elD(-20, 8, 2.4, INK));
  els.push(elD(20, 8, 2.4, INK));
  els.push(elF([[-11, 56], [11, 56], [11, 72], [-11, 72]], RUST, 1));
  els.push(elF([[84, 86], [118, 86], [112, 48], [90, 48]], RUST, 1));
  els.push(elL([[90, 56], [68, 40]], RUST, 6));
  els.push(elD(66, 38, 4.5, RUST));
  els.push(elL(qPts([112, 52], [126, 60], [116, 76], 8), INK, 2.4));
  els.push(elL([[-94, 86], [-84, 64]], INK, 5));
  els.push(elF([[-84, 64], [-75, 44], [-91, 45]], TEAL, 1));
  return bakeVig({ els: els, eyes: b.eyes, eyeColor: INK });
}
// Set 1, scholar: red-panda cat (rust at 0.8) with ink
// glasses and ear tufts, a stack of books and a
// telescope beside.
function vig1() {
  var b = catBase(1, 0, 0, RUST, 0.8, { color: GROUND, alpha: 0.3 });
  var els = b.els;
  els.push(elL([[-31, -106], [-36, -116]], INK, 2));
  els.push(elL([[-27, -108], [-28, -119]], INK, 2));
  els.push(elL([[31, -106], [36, -116]], INK, 2));
  els.push(elL([[27, -108], [28, -119]], INK, 2));
  els.push(elF([[-118, 62], [-78, 62], [-78, 86], [-118, 86]], TEAL, 1));
  els.push(elF([[-114, 40], [-80, 40], [-80, 62], [-114, 62]], RUST, 1));
  els.push(elF([[-110, 20], [-82, 20], [-82, 40], [-110, 40]], TEAL, 1));
  els.push(elL([[-114, 51], [-80, 51]], INK, 1.5));
  els.push(elF([[84, 4], [120, -28], [129, -18], [94, 15]], TEAL, 1));
  els.push(elD(124, -23, 3, INK));
  els.push(elL([[100, 10], [86, 86]], INK, 3));
  els.push(elL([[100, 10], [114, 86]], INK, 3));
  els.push(elL([[100, 10], [101, 86]], INK, 2.4));
  els.push(elL(ellPts(-14, -56, 12.5, 12.5, 20), INK, 2.4));
  els.push(elL(ellPts(14, -56, 12.5, 12.5, 20), INK, 2.4));
  els.push(elL([[-2, -58], [2, -58]], INK, 2.4));
  els.push(elL([[-26, -58], [-37, -63]], INK, 2.2));
  els.push(elL([[26, -58], [37, -63]], INK, 2.2));
  return bakeVig({ els: els, eyes: b.eyes, eyeColor: INK });
}
// Set 2, umbrella: black cat (solid ink, ground-colour
// eyes) under a tilted rust umbrella with cream spots.
function vig2() {
  var b = catBase(1, 0, 0, INK, 1, { color: GROUND, alpha: 0.18 });
  var els = b.els;
  var can = [], i, a, rr;
  for (i = 0; i <= 44; i++) {
    a = PI + PI * i / 44;
    rr = 42 - 6 * Math.abs(Math.sin(2.5 * (a - PI)));
    can.push([18 + rr * Math.cos(a), -98 + rr * Math.sin(a) * 0.68]);
  }
  can = rotPts(can, 18, -98, -0.08);
  els.push(elF(can, RUST, 1));
  els.push(elD(-8, -112, 3.5, GROUND));
  els.push(elD(18, -120, 4, GROUND));
  els.push(elD(42, -110, 3.5, GROUND));
  els.push(elL([[18, -98], [44, 8]], GROUND, 3.5));
  els.push(elL(qPts([44, 8], [44, 18], [35, 17], 6), GROUND, 3));
  return bakeVig({ els: els, eyes: b.eyes, eyeColor: GROUND });
}
// Set 3, frog hat: brown cat (warm grey at 0.85) in a
// teal frog hat, sitting behind a watermelon slice.
function vig3() {
  var b = catBase(1, 0, 0, GRAY, 0.85, { color: GROUND, alpha: 0.35 });
  var els = b.els;
  els.push(elF(ellPts(0, 84, 46, 30, 24, PI, PI * 2), RUST, 1));
  els.push(elL(ellPts(0, 84, 39, 24, 24, PI, PI * 2), GROUND, 4));
  els.push(elD(-20, 66, 1.8, INK));
  els.push(elD(-6, 58, 1.8, INK));
  els.push(elD(10, 64, 1.8, INK));
  els.push(elD(22, 72, 1.8, INK));
  els.push(elD(0, 74, 1.8, INK));
  els.push(elF(ellPts(-20, -100, 9.5, 9.5, 14), TEAL, 1));
  els.push(elF(ellPts(20, -100, 9.5, 9.5, 14), TEAL, 1));
  els.push(elD(-20, -101, 3.4, INK));
  els.push(elD(20, -101, 3.4, INK));
  els.push(elF(ellPts(0, -80, 41, 22, 24, PI, PI * 2), TEAL, 1));
  els.push(elL(qPts([-10, -88], [0, -83], [10, -88], 6), INK, 2));
  return bakeVig({ els: els, eyes: b.eyes, eyeColor: INK });
}
// Set 4, foliage: small orange kitten (rust at half
// strength, drawn at 0.82) framed by teal leaves and
// rust berries.
function vig4() {
  var b = catBase(0.82, 0, 10, RUST, 0.5, { color: GROUND, alpha: 0.3 });
  var els = [];
  els.push(elF(leafPts(-74, 26, 42, 11, -1.15), TEAL, 1));
  els.push(elF(leafPts(74, 26, 42, 11, -2.0), TEAL, 1));
  els = els.concat(b.els);
  els.push(elF(leafPts(-64, 82, 36, 10, -2.65), TEAL, 1));
  els.push(elF(leafPts(-38, 88, 32, 9, -2.95), TEAL, 1));
  els.push(elF(leafPts(64, 82, 36, 10, -0.5), TEAL, 1));
  els.push(elF(leafPts(38, 88, 32, 9, -0.2), TEAL, 1));
  els.push(elF(leafPts(0, 90, 30, 9, -1.57), TEAL, 1));
  els.push(elD(-52, 70, 3, RUST));
  els.push(elD(54, 68, 3, RUST));
  els.push(elD(24, 80, 2.6, RUST));
  els.push(elD(-24, 80, 2.6, RUST));
  return bakeVig({ els: els, eyes: b.eyes, eyeColor: INK });
}
// Set 5, two kittens: a full-size kitten and a smaller
// pale one side by side, both looking up at a rust star.
function vig5() {
  var a = catBase(0.74, -38, 18, GRAY, 1, { color: GROUND, alpha: 0.4 });
  var c = catBase(0.56, 48, 34, GRAY, 0.55, null);
  var els = a.els.concat(c.els);
  var eyes = a.eyes.concat(c.eyes);
  var i;
  for (i = 0; i < eyes.length; i++) eyes[i] = { x: eyes[i].x, y: eyes[i].y - 4, r: eyes[i].r };
  els.push(elF(starPts(6, -104, 11, 4.5), RUST, 1));
  els.push(elD(-24, -96, 1.8, INK));
  els.push(elD(36, -92, 1.8, INK));
  return bakeVig({ els: els, eyes: eyes, eyeColor: INK });
}
// Set 6, cactus hug: white cat (ground fill, ink
// outline) hugging a ribbed teal cactus in a rust pot.
function vig6() {
  var b = catBase(1, 0, 0, GROUND, 1, { color: GRAY, alpha: 0.3 });
  var els = b.els;
  var col = join(ellPts(0, -2, 17, 17, 12, PI, PI * 2),
                 [[17, 58]],
                 ellPts(0, 58, 17, 10, 8, 0, PI));
  els.push(elF(ellPts(-30, 8, 9, 20, 14), TEAL, 1));
  els.push(elF(ellPts(-22, 24, 12, 8, 12), TEAL, 1));
  els.push(elF(ellPts(30, -6, 9, 20, 14), TEAL, 1));
  els.push(elF(ellPts(22, 10, 12, 8, 12), TEAL, 1));
  els.push(elF(col, TEAL, 1));
  els.push(elL(qPts([-8, -6], [-9, 24], [-8, 52], 8), INK, 2, 0.3));
  els.push(elL(qPts([0, -10], [0, 24], [0, 54], 8), INK, 2, 0.3));
  els.push(elL(qPts([8, -6], [9, 24], [8, 52], 8), INK, 2, 0.3));
  els.push(elF([[-19, 56], [19, 56], [27, 86], [-27, 86]], RUST, 1));
  els.push(elF([[-30, 50], [30, 50], [30, 58], [-30, 58]], RUST, 1));
  els.push(elD(30, -30, 3.2, RUST));
  els.push(elD(30, -30, 1.4, GROUND));
  els.push(elF(ellPts(-21, 32, 11, 7.5, 12), GRAY, 1));
  els.push(elF(ellPts(21, 32, 11, 7.5, 12), GRAY, 1));
  return bakeVig({ els: els, eyes: b.eyes, eyeColor: INK });
}
// Set 7, mushroom cap: grey cat in a rust mushroom cap
// with cream spots, holding a lit lantern on a cord.
function vig7() {
  var b = catBase(1, 0, 0, GRAY, 1, { color: GROUND, alpha: 0.4 });
  var els = b.els;
  els.push(elF(ellPts(0, -82, 54, 30, 26, PI, PI * 2), RUST, 1));
  els.push(elL([[-54, -82], [54, -82]], RUST, 6));
  els.push(elD(-26, -100, 4.5, GROUND));
  els.push(elD(2, -112, 4, GROUND));
  els.push(elD(28, -98, 4.5, GROUND));
  els.push(elD(-6, -94, 3.2, GROUND));
  els.push(elL([[40, -84], [26, -52]], INK, 2));
  els.push(elL([[-40, -84], [-26, -52]], INK, 2));
  els.push(elL([[40, -30], [76, 2]], INK, 2));
  els.push(elF([[68, -6], [86, -6], [92, 2], [62, 2]], RUST, 1));
  els.push(elF(rrectPts(64, 2, 26, 40, 5), GROUND, 1));
  els.push(elL([[70.5, 4], [70.5, 40]], INK, 1.4, 0.6));
  els.push(elL([[83.5, 4], [83.5, 40]], INK, 1.4, 0.6));
  els.push(elD(77, 22, 4.5, RUST));
  els.push(elL([[77, 42], [77, 52]], INK, 2));
  return bakeVig({ els: els, eyes: b.eyes, eyeColor: INK });
}
var VIGS = [vig0(), vig1(), vig2(), vig3(), vig4(), vig5(), vig6(), vig7()];
if (VIGS.length !== 8) throw new Error('Nine Cats needs exactly 8 costume-activity sets');

// ---- the sheet: grid, gutters, wordmark ----------------
// 3x3 grid centred in the design space. Dividers and
// border are sampled polylines with a fixed +-1px
// hand-wobble baked from the seed.
var GX = 200, GY = 60, GW = 880, GH = 780;
var CW = GW / 3, CH = GH / 3;
function cellRect(i) {
  var c = i % 3, r = Math.floor(i / 3);
  return { x: GX + c * CW, y: GY + r * CH, w: CW, h: CH, cx: GX + c * CW + CW / 2, cy: GY + r * CH + CH / 2 };
}
var GRID = (function () {
  var border = rrectPts(GX, GY, GW, GH, 16).map(function (p) {
    return [p[0] + (rnd() * 2 - 1), p[1] + (rnd() * 2 - 1)];
  });
  var divs = [], i, pts;
  [GX + CW, GX + 2 * CW].forEach(function (x) {
    pts = [];
    for (i = 0; i <= 20; i++) pts.push([x + (rnd() * 2 - 1), GY + GH * i / 20]);
    divs.push(pts);
  });
  [GY + CH, GY + 2 * CH].forEach(function (y) {
    pts = [];
    for (i = 0; i <= 24; i++) pts.push([GX + GW * i / 24, y + (rnd() * 2 - 1)]);
    divs.push(pts);
  });
  return { border: border, divs: divs };
})();
// Exactly 40 tiny hearts, leaves and stars scattered in
// the margin gutters around the sheet, asserted.
var SCATTER = [];
(function () {
  var i, side, x, y;
  for (i = 0; i < 40; i++) {
    side = Math.floor(rnd() * 4);
    if (side === 0) { x = 230 + rnd() * 820; y = 16 + rnd() * 26; }
    else if (side === 1) { x = 230 + rnd() * 820; y = 858 + rnd() * 26; }
    else if (side === 2) { x = 126 + rnd() * 48; y = 90 + rnd() * 720; }
    else { x = 1106 + rnd() * 48; y = 90 + rnd() * 720; }
    SCATTER.push({ x: x, y: y, type: i % 3, color: [RUST, TEAL, INK][i % 3], s: 5.5 + rnd() * 4.5, rot: rnd() * PI });
  }
  if (SCATTER.length !== 40) throw new Error('Nine Cats needs exactly 40 gutter motifs');
})();
function heartPts(cx, cy, s) {
  var pts = [], i, a, x, y;
  for (i = 0; i <= 20; i++) {
    a = i / 20 * PI * 2;
    x = 16 * Math.pow(Math.sin(a), 3);
    y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
    pts.push([cx + x * s / 16, cy - y * s / 16]);
  }
  return pts;
}
function drawScatter() {
  var i, m, pts;
  ctx.globalAlpha = 0.8;
  for (i = 0; i < SCATTER.length; i++) {
    m = SCATTER[i];
    ctx.fillStyle = m.color;
    if (m.type === 0) pts = heartPts(m.x, m.y, m.s);
    else if (m.type === 1) pts = mov(rotPts(leafPts(0, 0, m.s * 1.7, m.s * 0.62, 0), 0, 0, m.rot), m.x, m.y, 1);
    else pts = starPts(m.x, m.y, m.s, m.s * 0.45);
    tracePts(pts, true);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
// The centre wordmark: flat rounded rectangle, the
// piece title lettered in ink serif, a tiny rust fox
// glyph beneath. The only text in the piece, under the
// batch's designed-text exception. It never changes.
function drawFox(cx, cy) {
  ctx.fillStyle = RUST;
  tracePts([[cx - 16, cy - 4], [cx - 13, cy - 19], [cx - 4, cy - 9]], true);
  ctx.fill();
  tracePts([[cx + 16, cy - 4], [cx + 13, cy - 19], [cx + 4, cy - 9]], true);
  ctx.fill();
  tracePts([[cx - 16, cy - 5], [cx + 16, cy - 5], [cx + 9, cy + 9], [cx, cy + 15], [cx - 9, cy + 9]], true);
  ctx.fill();
  ctx.fillStyle = GROUND;
  tracePts([[cx - 6.5, cy + 5], [cx + 6.5, cy + 5], [cx, cy + 14]], true);
  ctx.fill();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(cx - 6.5, cy - 1, 1.7, 0, PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 6.5, cy - 1, 1.7, 0, PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy + 7.5, 1.8, 0, PI * 2); ctx.fill();
}
function drawWordmark() {
  var r = cellRect(4);
  var x = r.cx - 118, y = r.cy - 84, w = 236, h = 168;
  ctx.fillStyle = GROUND;
  tracePts(rrectPts(x, y, w, h, 14), true);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.6;
  ctx.lineJoin = 'round';
  tracePts(rrectPts(x, y, w, h, 14), true);
  ctx.stroke();
  ctx.strokeStyle = RUST;
  ctx.lineWidth = 1.4;
  tracePts(rrectPts(x + 7, y + 7, w - 14, h - 14, 10), true);
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'italic 700 44px Georgia, "Times New Roman", serif';
  ctx.fillText('Nine Cats', r.cx, r.cy - 30);
  drawFox(r.cx, r.cy + 42);
}

// ---- cells and motion ----------------------------------
// Cell state: the centre cell is the wordmark; every cat
// cell holds its current overlay set. A cell's sequence
// is the rotation of the eight sets starting from its
// opening set, advanced one step per tap: cell 0 runs
// 0,1,2,... cell 1 runs 1,2,3,... and so on, wrapping
// mod 8. Fixed authored order, never random.
var CELLS = [];
(function () {
  var i, cats = 0;
  for (i = 0; i < 9; i++) {
    if (i === 4) CELLS.push({ word: true, overlay: -1, revealAt: -10 });
    else { CELLS.push({ word: false, overlay: i < 4 ? i : i - 1, revealAt: -10 }); cats++; }
  }
  if (cats !== 8) throw new Error('Nine Cats needs exactly 8 cat cells');
})();
function catOrder(i) { return i < 4 ? i : i - 1; }
var BREATH = [20, 10, 5, 4];
(function () {
  var i;
  for (i = 0; i < BREATH.length; i++) {
    if (LOOP % BREATH[i] !== 0) throw new Error('breath period must divide the loop');
  }
})();
function ease(u) { return u * u * (3 - 2 * u); }
function drawEyes(v, closed) {
  var i, e;
  ctx.fillStyle = v.eyeColor;
  for (i = 0; i < v.eyes.length; i++) {
    e = v.eyes[i];
    ctx.beginPath();
    ctx.ellipse(e.x, e.y, e.r, Math.max(0.4, e.r * (1 - closed * 0.92)), 0, 0, PI * 2);
    ctx.fill();
  }
}
function drawCell(i) {
  var r = cellRect(i), st = CELLS[i];
  if (st.word) { drawWordmark(); return; }
  var v = VIGS[st.overlay], k = catOrder(i);
  var t = T % LOOP;
  var per = BREATH[k % 4];
  var s = 1 + 0.03 * Math.sin(2 * PI * t / per + k * 0.9);
  var frac = 1;
  if (st.revealAt >= 0) {
    var u = (T - st.revealAt) / REVEAL_T;
    if (u >= 1) { st.revealAt = -10; frac = 1; }
    else frac = ease(Math.max(0, u));
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
  ctx.clip();
  ctx.translate(r.cx, r.cy + 88);
  ctx.scale(s, s);
  ctx.translate(-r.cx, -(r.cy + 88));
  ctx.translate(r.cx, r.cy);
  drawVig(v, frac);
  if (frac > 0.7) {
    var ph = (t + k * 1.7) % BLINK_P;
    var closed = ph < 0.3 ? Math.sin(PI * ph / 0.3) : 0;
    ctx.globalAlpha = Math.min(1, (frac - 0.7) / 0.3);
    drawEyes(v, closed);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  drawScatter();
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.9;
  ctx.lineWidth = 2.6;
  ctx.lineJoin = 'round';
  tracePts(GRID.border, true);
  ctx.stroke();
  ctx.lineWidth = 2;
  var i;
  for (i = 0; i < GRID.divs.length; i++) { tracePts(GRID.divs[i], false); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (i = 0; i < 9; i++) drawCell(i);
}

// ---- motion state --------------------------------------
// Constant first-frame phase: T = 7.3s into the 20s
// loop. The sheet is complete, every cat mid-breath at
// its own staggered phase, and no blink slot is open:
// with blink offsets k x 1.7s on the 5s blink period,
// every cat's blink phase at 7.3s sits past the 0.3s
// window, so all sixteen eyes are open. Frame one is
// drawn synchronously at this constant; the rAF loop
// advances T from the same anchor in fixed ticks.
// Frame one never reads a wall clock.
var T = 7.3;
var lastNow = -1, acc = 0;

// ---- pointer: tap a cat to recostume it -----------------
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  if (p.x < GX || p.x > GX + GW || p.y < GY || p.y > GY + GH) return;
  var col = Math.floor((p.x - GX) / CW), row = Math.floor((p.y - GY) / CH);
  var st = CELLS[row * 3 + col];
  if (!st || st.word) return;
  if (st.revealAt >= 0 && T - st.revealAt < REVEAL_T) return;
  st.overlay = (st.overlay + 1) % 8;
  st.revealAt = T;
});

// ---- sizing: centred fit, page ground = sheet ground ---
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
