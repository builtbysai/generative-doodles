<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild Posting</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #B7A894;
  }
  canvas {
    display: block;
    margin: 0;
    padding: 0;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="wall"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('wall');
  var ctx = canvas.getContext('2d');

  // Palette (strict): wall stone, mortar, poster white, and the four
  // poster colors of the affichages. Nothing else is ever mixed in;
  // shading is done with alpha overlays of these same colors.
  var WALL = '#B7A894';
  var MORTAR = '#8E8271';
  var PAPER = '#F4F1EA';
  var INK = '#232323';
  var COLORS = ['#C8102E', '#2F6BC0', '#232323', '#E8B62A']; // red, blue, black, yellow

  var PEEL_START = 40;   // seconds after posting, the corner lifts
  var PEEL_DUR = 10;     // peel + fade lasts this long, then it is gone
  var MAX_POSTERS = 12;  // the wall holds at most this many alive
  var ASPECT = 1.35;     // poster height / width

  // Seeded RNG (mulberry32). Every seeded value is fixed forever, so
  // frame one is the same on every load and in the QA renderer.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var r = Math.imul(a ^ (a >>> 15), 1 | a);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic per-cell hash for the stone tone variation.
  function hash2(r, c) {
    var h = (r * 374761393 + c * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ---------- posters ----------
  // A poster is a record {u, v, w, rot, color, born, forced, seed}:
  // u/v are its center as frame fractions, w its width as a fraction
  // of frame width, born its birth time on the piece timeline (t=0 at
  // load, so seeded posters carry negative births), forced an optional
  // early peel-start time set when the wall overflows.

  var posters = [];
  var postCounter = 0;

  function peelStart(p) {
    var s = p.born + PEEL_START;
    if (p.forced !== null && p.forced < s) s = p.forced;
    return s;
  }

  // Peel progress 0..1 at time t; >= 1 means the poster is gone.
  function peelP(p, t) {
    var ps = peelStart(p);
    if (t < ps) return 0;
    return (t - ps) / PEEL_DUR;
  }

  function aliveAt(p, t) {
    return peelP(p, t) < 1;
  }

  function addPoster(p, t) {
    posters.push(p);
    // Cap: the wall holds at most MAX_POSTERS up at once. Any excess
    // makes the oldest posters start peeling right now, oldest first;
    // a peeling poster is on its way out and gone within PEEL_DUR.
    var alive = posters.filter(function (q) { return aliveAt(q, t); });
    alive.sort(function (a, b) { return a.born - b.born; });
    var excess = alive.length - MAX_POSTERS;
    var fi = 0;
    for (var k = 0; k < excess; k++) {
      while (fi < alive.length &&
             (alive[fi] === p || (alive[fi].forced !== null && alive[fi].forced <= t))) fi++;
      if (fi >= alive.length) break;
      alive[fi].forced = t;
      fi++;
    }
    // Prune the fully gone to keep the record list short.
    posters = posters.filter(function (q) { return aliveAt(q, t); });
  }

  // The lived-in wall: five posters pasted before load, at mid ages,
  // clustered left and center, never centered, none yet peeling.
  (function seedWall() {
    var rng = mulberry32(788001);
    var seeds = [
      { u: 0.20, v: 0.34, w: 0.240, rot: -0.06, color: 0, born: -8 },
      { u: 0.38, v: 0.56, w: 0.200, rot: 0.05, color: 1, born: -17 },
      { u: 0.56, v: 0.30, w: 0.185, rot: 0.09, color: 3, born: -26 },
      { u: 0.13, v: 0.70, w: 0.175, rot: 0.03, color: 2, born: -33 },
      { u: 0.48, v: 0.78, w: 0.210, rot: -0.08, color: 0, born: -21 }
    ];
    for (var i = 0; i < seeds.length; i++) {
      var s = seeds[i];
      posters.push({
        u: s.u + (rng() * 2 - 1) * 0.008,
        v: s.v + (rng() * 2 - 1) * 0.008,
        w: s.w,
        rot: s.rot + (rng() * 2 - 1) * 0.02,
        color: s.color,
        born: s.born,
        forced: null,
        seed: 788100 + i * 977
      });
    }
    postCounter = seeds.length;
  })();

  // ---------- view ----------

  var viewW = 0;
  var viewH = 0;
  var isPhone = false;

  function measure() {
    var vv = window.visualViewport;
    viewW = vv ? vv.width : window.innerWidth;
    viewH = vv ? vv.height : window.innerHeight;
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    if (sw && sh) {
      isPhone = Math.min(sw, sh) < 700;
    } else {
      isPhone = viewH > viewW * 1.15;
    }
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---------- wall ----------

  function drawWall() {
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, viewW, viewH);

    var rows = 11;
    var rowH = viewH / rows;
    var blockW = rowH * 2.6;
    // Subtle per-block tone shift: mortar washed over the stone.
    for (var r = 0; r < rows; r++) {
      var off = (r % 2) ? -blockW / 2 : 0;
      for (var cx = off; cx < viewW; cx += blockW) {
        var v = hash2(r, Math.round((cx - off) / blockW));
        if (v > 0.25) {
          ctx.globalAlpha = (v - 0.25) * 0.14;
          ctx.fillStyle = MORTAR;
          ctx.fillRect(cx, r * rowH, blockW, rowH);
        }
      }
    }
    ctx.globalAlpha = 1;

    // Mortar grid.
    ctx.strokeStyle = MORTAR;
    ctx.lineWidth = Math.max(1.2, viewH * 0.0022);
    ctx.beginPath();
    for (var r2 = 0; r2 <= rows; r2++) {
      ctx.moveTo(0, r2 * rowH);
      ctx.lineTo(viewW, r2 * rowH);
    }
    for (var r3 = 0; r3 < rows; r3++) {
      var off3 = (r3 % 2) ? -blockW / 2 : 0;
      for (var cx3 = off3; cx3 <= viewW; cx3 += blockW) {
        ctx.moveTo(cx3, r3 * rowH);
        ctx.lineTo(cx3, (r3 + 1) * rowH);
      }
    }
    ctx.stroke();
  }

  function drawDoorway() {
    var x0 = viewW * 0.70, x1 = viewW * 0.92;
    var y0 = viewH * 0.15, y1 = viewH;
    var w = x1 - x0, h = y1 - y0;

    ctx.fillStyle = MORTAR;
    ctx.fillRect(x0, y0, w, h);

    // Louvered slats: alternating light bands and shade lines.
    var slats = 14;
    var sh = h / slats;
    for (var i = 0; i < slats; i++) {
      ctx.globalAlpha = 0.20;
      ctx.fillStyle = WALL;
      ctx.fillRect(x0, y0 + i * sh + sh * 0.45, w, sh * 0.55);
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = INK;
      ctx.fillRect(x0, y0 + i * sh, w, Math.max(1.2, sh * 0.12));
    }
    ctx.globalAlpha = 1;

    // Frame.
    ctx.strokeStyle = INK;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = Math.max(2, viewW * 0.003);
    ctx.strokeRect(x0, y0, w, h);
    ctx.globalAlpha = 1;
  }

  // ---------- one poster ----------

  // Tiny illegible stamp marks: two rows of seeded micro-squiggles,
  // the gesture of a date stamp with no characters in it.
  function drawStamps(p, pw, ph) {
    var rnd = mulberry32(p.seed);
    ctx.strokeStyle = INK;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1;
    var sw = Math.min(pw * 0.16, 26);
    var x0 = pw / 2 - sw - pw * 0.05;
    var yBase = ph / 2 - ph * 0.055;
    for (var row = 0; row < 2; row++) {
      var y = yBase - row * ph * 0.045;
      ctx.beginPath();
      var n = 6;
      for (var i = 0; i <= n; i++) {
        var x = x0 + (sw * i) / n;
        var yy = y + Math.sin(i * 1.7 + rnd() * 2.4) * 1.4;
        if (i === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawPoster(p, t) {
    var pp = peelP(p, t);
    if (pp >= 1) return;

    var boost = isPhone ? 1.22 : 1;
    var pw = p.w * viewW * boost;
    var ph = pw * ASPECT;
    var cx = p.u * viewW;
    var cy = p.v * viewH;

    // Snap: a fresh paste lands at full opacity with a 90 ms scale
    // settle from 1.06. It never glides and never fades in.
    var snap = 1;
    var age = t - p.born;
    if (age >= 0 && age < 0.09) snap = 1.06 - 0.06 * (age / 0.09);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(p.rot);
    ctx.scale(snap, snap);
    if (pp > 0) ctx.globalAlpha = 1 - pp * pp * 0.9;

    // Paper edge shadow.
    ctx.fillStyle = INK;
    ctx.globalAlpha *= 0.26;
    ctx.fillRect(-pw / 2 + 3, -ph / 2 + 4, pw, ph);
    ctx.globalAlpha = (pp > 0) ? 1 - pp * pp * 0.9 : 1;

    // Body: white, then the color stripes of the module.
    ctx.fillStyle = PAPER;
    ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
    ctx.save();
    ctx.beginPath();
    ctx.rect(-pw / 2, -ph / 2, pw, ph);
    ctx.clip();
    var pair = Math.max(8, Math.min(40, viewW / 38));
    var half = pair / 2;
    ctx.fillStyle = COLORS[p.color];
    for (var x = -pw / 2 + half; x < pw / 2; x += pair) {
      ctx.fillRect(x, -ph / 2, half, ph);
    }
    drawStamps(p, pw, ph);
    ctx.restore();

    // Paper edge line.
    ctx.strokeStyle = MORTAR;
    ctx.globalAlpha *= 0.55;
    ctx.lineWidth = 1;
    ctx.strokeRect(-pw / 2, -ph / 2, pw, ph);
    ctx.globalAlpha = (pp > 0) ? 1 - pp * pp * 0.9 : 1;

    // Peel: the bottom-right corner lifts and folds back along a
    // diagonal; the vacated corner shows the wall again, the flap
    // shows the shaded underside of the paper.
    if (pp > 0) {
      var L = Math.min(pw * 0.55 * pp, ph * 0.8);
      if (L > 1) {
        var ax = pw / 2 - L, ay = ph / 2;        // on the bottom edge
        var bx = pw / 2, by = ph / 2 - L;        // on the right edge
        var fx = pw / 2 - L, fy = ph / 2 - L;    // reflected corner
        // Exposed wall.
        ctx.beginPath();
        ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(pw / 2, ph / 2);
        ctx.closePath();
        ctx.fillStyle = WALL;
        ctx.fill();
        // Flap shadow, slightly offset.
        ctx.beginPath();
        ctx.moveTo(ax + 2, ay + 2); ctx.lineTo(bx + 2, by + 2); ctx.lineTo(fx + 2, fy + 2);
        ctx.closePath();
        ctx.fillStyle = INK;
        ctx.globalAlpha *= 0.18;
        ctx.fill();
        ctx.globalAlpha = (pp > 0) ? 1 - pp * pp * 0.9 : 1;
        // The flap itself: paper underside, mortar-shaded.
        ctx.beginPath();
        ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(fx, fy);
        ctx.closePath();
        ctx.fillStyle = PAPER;
        ctx.fill();
        ctx.fillStyle = MORTAR;
        ctx.globalAlpha *= 0.30;
        ctx.fill();
        ctx.globalAlpha = (pp > 0) ? 1 - pp * pp * 0.9 : 1;
        // Fold crease.
        ctx.beginPath();
        ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
        ctx.strokeStyle = MORTAR;
        ctx.globalAlpha *= 0.6;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---------- frame ----------

  function draw(t) {
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    drawWall();
    drawDoorway();
    var ordered = posters.slice().sort(function (a, b) { return a.born - b.born; });
    for (var i = 0; i < ordered.length; i++) drawPoster(ordered[i], t);
  }

  // ---------- interaction: drag is the pasting hand ----------

  var currentT = 0;
  var lastT = 0;
  var drag = null;

  function evPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0)) - r.left;
    var y = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0)) - r.top;
    return { x: x, y: y };
  }

  function onDown(e) {
    var pos = evPos(e);
    drag = { x0: pos.x, y0: pos.y, x1: pos.x, y1: pos.y, moved: false };
  }

  function onMove(e) {
    if (!drag) return;
    var pos = evPos(e);
    drag.x1 = pos.x; drag.y1 = pos.y;
    if (Math.abs(drag.x1 - drag.x0) + Math.abs(drag.y1 - drag.y0) > 6) drag.moved = true;
  }

  function onUp(e) {
    if (!drag) return;
    var pos = evPos(e);
    var dx = pos.x - drag.x0;
    var dy = pos.y - drag.y0;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var wasDrag = drag.moved && dist > 24;
    drag = null;
    if (!wasDrag) return; // a tap pastes nothing; there are no buttons
    // Rotation from the drag angle, folded into a slight tilt.
    var ang = Math.atan2(dy, dx);
    var rot = Math.max(-0.17, Math.min(0.17, ang * 0.12));
    var p = {
      u: pos.x / viewW,
      v: pos.y / viewH,
      w: 0.17 + (hash2(postCounter, 7) * 0.07),
      rot: rot,
      color: postCounter % COLORS.length,
      born: currentT,
      forced: null,
      seed: 788500 + postCounter * 131
    };
    postCounter++;
    addPoster(p, currentT);
    draw(currentT);
  }

  function resize() {
    measure();
    draw(lastT);
  }

  measure();
  draw(0);

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { drag = null; });
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: true });
  canvas.addEventListener('touchmove', onMove, { passive: true });
  canvas.addEventListener('touchend', onUp, { passive: true });

  if (typeof window.requestAnimationFrame === 'function') {
    var start = null;
    var frame = function (ts) {
      if (start === null) start = ts;
      lastT = (ts - start) / 1000;
      currentT = lastT;
      draw(lastT);
      window.requestAnimationFrame(frame);
    };
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
