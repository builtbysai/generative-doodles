<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se Cayó Colgando el Matisse</title>
<style>
  html, body { margin: 0; padding: 0; background: #EFE7D8; overflow: hidden; }
  canvas { display: block; cursor: grab; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var TAU = Math.PI * 2;
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function sstep(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function easeIO(t) { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

// ---------- palette (strict, ML block 2) ----------
var WALL = "#EFE7D8";
var GOLD = "#B98A2F";
var RED = "#C0392B";
var BLUE = "#2C5FA8";
var BLACK = "#1A1A1A";
var WOOD = "#8A6A4A";
var GREY = "#5A5A5A";
var TAN = "#7A6A5A";

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone() {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0 && mn < 700) return true;
  return H > W * 1.15;
}

function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  draw(currentPhase());
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
}
window.addEventListener("resize", resize);

// ---------- animation state ----------
// Scripted 14 s micro-narrative loop:
//   0.0-5.5  worker hangs the forgery from the ladder; ladder sways
//   4.6-5.5  the sway grows (the warning beat)
//   5.5-6.3  THE FALL: worker slides off, forgery tilts crooked
//   5.9-6.9  onlookers flinch; one camera flash pops at 6.05
//   6.3-10.8 worker sits on the floor, dazed
//   8.0-10.5 guard walks in, calm
//  10.5-11.5 guard re-hangs the forgery straight; worker stands
//  11.5-13.2 guard walks out; worker climbs back up
//  13.2-14.0 settle; identical to t=0
var LOOP = 14;
var PHASE0 = 2.5;         // fixed first frame: mid-hang, forgery straight
var startStamp = null;

function currentPhase() {
  if (startStamp === null) return PHASE0;
  var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  return PHASE0 + (now - startStamp) / 1000;
}

// ---------- interaction: drag the ladder, wobble it harder ----------
var dragEnergy = 0;       // extra sway energy, decays over time
var dragging = false, lastPX = 0, lastPY = 0;
canvas.addEventListener("pointerdown", function (e) {
  dragging = true; lastPX = e.clientX; lastPY = e.clientY;
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
  dragEnergy = clamp(dragEnergy + (Math.abs(dx) + Math.abs(dy)) * 0.0016, 0, 0.09);
});
function endDrag() { dragging = false; }
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

// ---------- stage ----------
var SW = 1000, SH = 700;
var FLOOR_Y = 560;

// wall speckles, precomputed once (deterministic)
var speckles = [];
(function () {
  var rng = mulberry32(578070);
  for (var i = 0; i < 90; i++) {
    speckles.push({ x: rng() * SW, y: rng() * 530, r: 0.8 + rng() * 1.5 });
  }
})();

// ---------- forgery (tiny homage, NOT a copy) ----------
var NAIL = { x: 500, y: 205 };
var FRAME = { x: 400, y: 231, w: 200, h: 150 };   // outer box

function frameTilt(t) {
  if (t < 5.5) return 0;
  if (t < 6.4) { // falls crooked with a small overshoot bounce
    var u = (t - 5.5) / 0.9;
    return -0.13 * sstep(u) - 0.02 * Math.sin(u * Math.PI * 2) * (1 - u);
  }
  if (t < 10.5) return -0.115;
  if (t < 11.5) return -0.115 * (1 - sstep((t - 10.5) / 1.0));
  return 0;
}
function frameCornerBR(tilt) { // world position of frame bottom-right corner
  var c = Math.cos(tilt), s = Math.sin(tilt);
  var dx = (FRAME.x + FRAME.w) - NAIL.x, dy = (FRAME.y + FRAME.h) - NAIL.y;
  return { x: NAIL.x + c * dx - s * dy, y: NAIL.y + s * dx + c * dy };
}

function drawForgery(tilt) {
  ctx.save();
  ctx.translate(NAIL.x, NAIL.y);
  ctx.rotate(tilt);
  ctx.translate(-NAIL.x, -NAIL.y);
  // hanging wire
  ctx.strokeStyle = GREY; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(FRAME.x + 8, FRAME.y + 4);
  ctx.lineTo(NAIL.x, NAIL.y);
  ctx.lineTo(FRAME.x + FRAME.w - 8, FRAME.y + 4);
  ctx.stroke();
  // gold frame
  ctx.fillStyle = GOLD;
  ctx.fillRect(FRAME.x, FRAME.y, FRAME.w, FRAME.h);
  // paper interior
  var ix = FRAME.x + 12, iy = FRAME.y + 12, iw = FRAME.w - 24, ih = FRAME.h - 24;
  ctx.fillStyle = WALL;
  ctx.fillRect(ix, iy, iw, ih);
  // --- simplified cutout homage shapes (flat, generic) ---
  // red organic blob, left-center
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.moveTo(448, 272);
  ctx.bezierCurveTo(436, 292, 442, 318, 462, 330);
  ctx.bezierCurveTo(484, 342, 502, 326, 500, 304);
  ctx.bezierCurveTo(498, 284, 478, 266, 464, 268);
  ctx.bezierCurveTo(456, 269, 451, 269, 448, 272);
  ctx.fill();
  // blue vertical leaf, right
  ctx.fillStyle = BLUE;
  ctx.beginPath();
  ctx.moveTo(548, 252);
  ctx.bezierCurveTo(562, 282, 562, 318, 548, 350);
  ctx.bezierCurveTo(534, 318, 534, 282, 548, 252);
  ctx.fill();
  // black circle, top-right
  ctx.fillStyle = BLACK;
  ctx.beginPath(); ctx.arc(566, 264, 10, 0, TAU); ctx.fill();
  // red small circle, bottom-left
  ctx.fillStyle = RED;
  ctx.beginPath(); ctx.arc(438, 346, 9, 0, TAU); ctx.fill();
  // black bird silhouette, top-left
  ctx.fillStyle = BLACK;
  ctx.beginPath(); ctx.ellipse(458, 258, 14, 6.5, -0.25, 0, TAU); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(446, 254); ctx.lineTo(432, 246); ctx.lineTo(444, 264); ctx.closePath(); ctx.fill();
  // blue wavy band along the bottom
  ctx.strokeStyle = BLUE; ctx.lineWidth = 7; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(424, 354);
  ctx.bezierCurveTo(458, 342, 492, 364, 524, 352);
  ctx.bezierCurveTo(548, 344, 562, 356, 578, 350);
  ctx.stroke();
  ctx.restore();
  // the nail itself
  ctx.fillStyle = GREY;
  ctx.beginPath(); ctx.arc(NAIL.x, NAIL.y, 3.5, 0, TAU); ctx.fill();
}

// ---------- ladder ----------
var LAD_BASE = { x: 668, y: FLOOR_Y };
var LAD_LEN = 400;
var LAD_LEAN = -0.24;

function ladderAngle(t, phase) {
  var amp = 0.010 + dragEnergy;
  if (t > 4.6 && t < 5.5) amp += 0.045 * sstep((t - 4.6) / 0.9); // warning wobble
  return LAD_LEAN + Math.sin(phase * 2.4) * amp + Math.sin(phase * 5.7) * amp * 0.35;
}
function ladderPoint(ang, u, side) {
  var c = Math.cos(ang), s = Math.sin(ang);
  return {
    x: LAD_BASE.x + c * side + s * u * LAD_LEN,
    y: LAD_BASE.y + s * side - c * u * LAD_LEN
  };
}
function drawLadder(ang) {
  ctx.save();
  ctx.translate(LAD_BASE.x, LAD_BASE.y);
  ctx.rotate(ang);
  ctx.strokeStyle = WOOD; ctx.lineCap = "round";
  // rungs
  ctx.lineWidth = 4.5; ctx.globalAlpha = 0.85;
  for (var k = 1; k <= 9; k++) {
    var y = -k * 42;
    ctx.beginPath(); ctx.moveTo(-17, y); ctx.lineTo(17, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // rails
  ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(-17, 4); ctx.lineTo(-17, -LAD_LEN); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(17, 4); ctx.lineTo(17, -LAD_LEN); ctx.stroke();
  ctx.restore();
}

// ---------- posable little figure ----------
// P: hip, shoulder (derived), feet, hands, colors, face direction
function drawPerson(P) {
  var sh = {
    x: P.hip.x + Math.sin(P.lean) * P.torso,
    y: P.hip.y - Math.cos(P.lean) * P.torso
  };
  var head = {
    x: sh.x + Math.sin(P.lean) * (P.headR * 0.95),
    y: sh.y - Math.cos(P.lean) * (P.headR * 0.95)
  };
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  // legs (two-segment, knee pushed toward facing)
  ctx.strokeStyle = P.color; ctx.lineWidth = 5.5;
  [P.footL, P.footR].forEach(function (f) {
    var kx = (P.hip.x + f.x) / 2 + P.face * 5;
    var ky = (P.hip.y + f.y) / 2 - 2;
    ctx.beginPath(); ctx.moveTo(P.hip.x, P.hip.y); ctx.lineTo(kx, ky); ctx.lineTo(f.x, f.y); ctx.stroke();
  });
  // torso
  ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(P.hip.x, P.hip.y); ctx.lineTo(sh.x, sh.y); ctx.stroke();
  // arms
  ctx.lineWidth = 5;
  [{ h: P.handL }, { h: P.handR }].forEach(function (a) {
    var ex = (sh.x + a.h.x) / 2 + P.face * 3;
    var ey = (sh.y + a.h.y) / 2 + 3;
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(ex, ey); ctx.lineTo(a.h.x, a.h.y); ctx.stroke();
  });
  // head
  ctx.fillStyle = WALL;
  ctx.strokeStyle = P.color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(head.x, head.y, P.headR, 0, TAU); ctx.fill(); ctx.stroke();
  // eyes
  ctx.fillStyle = BLACK;
  ctx.beginPath(); ctx.arc(head.x + P.face * 3 - 3.2, head.y - 1, 1.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(head.x + P.face * 3 + 3.2, head.y - 1, 1.4, 0, TAU); ctx.fill();
  if (P.mouthO) {
    ctx.beginPath(); ctx.arc(head.x + P.face * 3, head.y + 4.5, 2.4, 0, TAU); ctx.stroke();
  }
  // cap
  if (P.cap) {
    ctx.fillStyle = P.cap;
    ctx.beginPath(); ctx.arc(head.x, head.y - 1.5, P.headR, Math.PI, TAU); ctx.fill();
    ctx.fillRect(head.x + (P.face > 0 ? 0 : -P.headR - 5), head.y - 2.5, P.headR + 5, 3);
  }
  return head;
}
function shadow(x, rx) {
  ctx.fillStyle = BLACK; ctx.globalAlpha = 0.10;
  ctx.beginPath(); ctx.ellipse(x, FLOOR_Y + 4, rx, 5, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function lerpPt(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) }; }
function lerpPose(A, B, t) {
  var o = {};
  for (var k in A) {
    if (typeof A[k] === "number") o[k] = lerp(A[k], B[k], t);
    else o[k] = lerpPt(A[k], B[k], t);
  }
  return o;
}

// ---------- worker timeline ----------
function workerPose(t, phase, ang) {
  // attach weight to the ladder
  var w;
  if (t < 5.5) w = 1;
  else if (t < 6.3) w = 1 - sstep((t - 5.5) / 0.8);
  else if (t < 11.8) w = 0;
  else if (t < 13.0) w = sstep((t - 11.8) / 1.2);
  else w = 1;

  // riding pose (feet on two rungs, right hand at the picture's right edge)
  var fL = ladderPoint(ang, 0.60, 13), fR = ladderPoint(ang, 0.505, 13);
  var mid = { x: (fL.x + fR.x) / 2, y: (fL.y + fR.y) / 2 };
  var reach = { x: 606 + Math.sin(phase * 3.0) * 3, y: 288 + Math.cos(phase * 2.3) * 4 };
  if (t >= 5.5) reach = { x: 606, y: 288 };
  var ride = {
    hip: { x: mid.x + 9, y: mid.y - 42 },
    footL: fL, footR: fR,
    handL: ladderPoint(ang, 0.68, -14),
    handR: reach,
    lean: 0.10, torso: 30, headR: 10.5
  };

  // floor track: seated spot, then standing, then a step to the ladder base
  var fx, s; // floor x, seated amount
  if (t < 10.8) { fx = 612; s = 1; }
  else if (t < 11.5) { var u1 = sstep((t - 10.8) / 0.7); fx = lerp(612, 632, u1); s = 1 - u1; }
  else if (t < 11.8) { fx = lerp(632, 656, (t - 11.5) / 0.3); s = 0; }
  else { fx = 656; s = 0; }
  if (t < 6.3) s = 1; // already seated-shaped while sliding off
  var stand = {
    hip: { x: fx, y: FLOOR_Y - 44 },
    footL: { x: fx - 9, y: FLOOR_Y }, footR: { x: fx + 10, y: FLOOR_Y },
    handL: { x: fx - 15, y: FLOOR_Y - 52 }, handR: { x: fx + 16, y: FLOOR_Y - 52 },
    lean: 0.04, torso: 30, headR: 10.5
  };
  var sit = {
    hip: { x: fx, y: FLOOR_Y - 25 },
    footL: { x: fx + 30, y: FLOOR_Y }, footR: { x: fx + 15, y: FLOOR_Y },
    handL: { x: fx - 13, y: FLOOR_Y - 30 }, handR: { x: fx + 14, y: FLOOR_Y - 31 },
    lean: 0.14, torso: 30, headR: 10.5
  };
  var floor = lerpPose(stand, sit, s);
  var pose = lerpPose(floor, ride, w);
  pose.color = GREY; pose.face = -1;
  pose.attach = w; pose.seated = s;
  // tumble rotation while sliding off
  pose.rot = 0; pose.anchor = { x: (pose.footL.x + pose.footR.x) / 2, y: FLOOR_Y };
  if (t >= 5.5 && t < 6.6) {
    pose.rot = -0.55 * Math.sin(Math.PI * clamp((t - 5.5) / 1.1, 0, 1));
    pose.anchor = { x: (pose.footL.x + pose.footR.x) / 2, y: (pose.footL.y + pose.footR.y) / 2 };
  }
  return pose;
}

// ---------- guard timeline ----------
function guardPose(t, tilt) {
  var x, moving = 0;
  if (t < 8.0) x = 1050;
  else if (t < 10.5) { var u = easeIO((t - 8.0) / 2.5); x = lerp(1050, 560, u); moving = (u > 0 && u < 1) ? 1 : 0; }
  else if (t < 11.5) x = 560;
  else if (t < 13.2) { var u2 = easeIO((t - 11.5) / 1.7); x = lerp(560, 1050, u2); moving = (u2 > 0 && u2 < 1) ? 1 : 0; }
  else x = 1050;
  var face = (t >= 11.5) ? 1 : -1; // walks in facing left, out facing right
  var sw = moving ? Math.sin(t * 9.0) * 11 : 0;
  var bob = moving ? Math.abs(Math.sin(t * 9.0)) * 3 : 0;
  var hip = { x: x, y: FLOOR_Y - 58 - bob };
  var handR = { x: x + face * 16, y: FLOOR_Y - 66 + (moving ? -sw * 0.5 : 0) };
  if (t >= 10.5 && t < 11.5) handR = frameCornerBR(tilt); // arm meets the crooked corner
  return {
    hip: hip,
    footL: { x: x - 9 + (face < 0 ? sw : -sw), y: FLOOR_Y - (moving && sw > 0 ? 4 : 0) },
    footR: { x: x + 9 + (face < 0 ? -sw : sw), y: FLOOR_Y - (moving && sw < 0 ? 4 : 0) },
    handL: { x: x - face * 15, y: FLOOR_Y - 64 + (moving ? sw * 0.5 : 0) },
    handR: handR,
    lean: face * 0.03, torso: 36, headR: 11,
    color: BLUE, face: face, cap: BLACK
  };
}

// ---------- onlookers ----------
function drawOnlookers(t, phase) {
  // flinch envelope
  var f = 0;
  if (t >= 5.85 && t < 6.9) f = Math.sin(Math.PI * (t - 5.85) / 1.05);
  // shock onlooker (left): jumps, arms fly up
  var sx = 240, sway = Math.sin(phase * 0.9) * 0.02;
  shadow(sx, 24);
  drawPerson({
    hip: { x: sx, y: FLOOR_Y - 40 - 13 * f },
    footL: { x: sx - 8, y: FLOOR_Y - 13 * f }, footR: { x: sx + 9, y: FLOOR_Y - 13 * f },
    handL: { x: sx - 13 + f * -6, y: FLOOR_Y - 48 - f * 26 },
    handR: { x: sx + 14 + f * 6, y: FLOOR_Y - 48 - f * 26 },
    lean: sway - f * 0.12, torso: 28, headR: 9.5,
    color: TAN, face: 1, mouthO: f > 0.25
  });
  // photo onlooker: holds a little camera up the whole time
  var px = 322;
  shadow(px, 24);
  var head = drawPerson({
    hip: { x: px, y: FLOOR_Y - 40 - 6 * f },
    footL: { x: px - 8, y: FLOOR_Y - 6 * f }, footR: { x: px + 9, y: FLOOR_Y - 6 * f },
    handL: { x: px + 12, y: FLOOR_Y - 62 - 6 * f },
    handR: { x: px + 15, y: FLOOR_Y - 58 - 6 * f },
    lean: 0.03, torso: 28, headR: 9.5,
    color: GREY, face: 1
  });
  // camera box in front of the face
  var cx = head.x + 10, cy = head.y + 1 - 6 * f;
  ctx.fillStyle = BLACK;
  ctx.fillRect(cx - 2, cy - 6, 13, 10);
  // the one flash pop
  if (t >= 6.05 && t < 6.45) {
    var fa = 1 - (t - 6.05) / 0.4;
    ctx.save();
    ctx.globalAlpha = fa;
    ctx.strokeStyle = GOLD; ctx.lineWidth = 2.4; ctx.lineCap = "round";
    var fx2 = cx + 14, fy2 = cy - 2, R = 15 + (1 - fa) * 9;
    for (var i = 0; i < 6; i++) {
      var a = i / 6 * TAU + 0.4;
      ctx.beginPath();
      ctx.moveTo(fx2 + Math.cos(a) * R * 0.35, fy2 + Math.sin(a) * R * 0.35);
      ctx.lineTo(fx2 + Math.cos(a) * R, fy2 + Math.sin(a) * R);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ---------- main draw ----------
function draw(phase) {
  var t = phase % LOOP;
  if (t < 0) t += LOOP;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // page ground = the wall color
  ctx.fillStyle = WALL;
  ctx.fillRect(0, 0, W, H);

  // stage fit: keep the framing at every size
  var scale = Math.min(W / SW, H / SH);
  var ox = (W - SW * scale) / 2, oy = (H - SH * scale) / 2;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0, 0, SW, SH); ctx.clip();

  // wall
  ctx.fillStyle = WALL;
  ctx.fillRect(0, 0, SW, SH);
  ctx.fillStyle = WOOD; ctx.globalAlpha = 0.05;
  for (var i = 0; i < speckles.length; i++) {
    ctx.beginPath(); ctx.arc(speckles[i].x, speckles[i].y, speckles[i].r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // floor + baseboard
  ctx.fillStyle = WOOD; ctx.globalAlpha = 0.14;
  ctx.fillRect(0, FLOOR_Y, SW, SH - FLOOR_Y);
  ctx.globalAlpha = 0.35;
  ctx.fillRect(0, FLOOR_Y - 13, SW, 13);
  ctx.globalAlpha = 0.18;
  ctx.fillRect(0, 606, SW, 2); ctx.fillRect(0, 652, SW, 2);
  ctx.globalAlpha = 1;

  var tilt = frameTilt(t);
  var ang = ladderAngle(t, phase);

  drawForgery(tilt);
  drawLadder(ang);
  drawOnlookers(t, phase);

  // worker (with tumble rotation around the feet while sliding off)
  var wp = workerPose(t, phase, ang);
  shadow(lerp(wp.hip.x, LAD_BASE.x, wp.attach * 0.5), 26);
  ctx.save();
  if (wp.rot) {
    ctx.translate(wp.anchor.x, wp.anchor.y);
    ctx.rotate(wp.rot);
    ctx.translate(-wp.anchor.x, -wp.anchor.y);
  }
  var wHead = drawPerson(wp);
  ctx.restore();
  // dazed: two tiny gold stars circling the seated worker's head
  if (t >= 6.4 && t < 10.7 && wp.attach < 0.1) {
    ctx.fillStyle = GOLD;
    for (var s2 = 0; s2 < 2; s2++) {
      var a2 = phase * 2.3 + s2 * Math.PI;
      ctx.beginPath();
      ctx.arc(wHead.x + Math.cos(a2) * 17, wHead.y - 8 + Math.sin(a2) * 5, s2 ? 2.2 : 3.2, 0, TAU);
      ctx.fill();
    }
  }

  // guard
  var gp = guardPose(t, tilt);
  if (gp.hip.x < 1015) {
    shadow(gp.hip.x, 28);
    drawPerson(gp);
  }

  ctx.restore(); // unclip stage

  // hint, tiny and lowercase
  ctx.fillStyle = TAN; ctx.globalAlpha = 0.8;
  ctx.font = (isPhone() ? 13 : 12) + "px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText("drag", W - 14, H - 12);
  ctx.globalAlpha = 1;
}

// ---------- run ----------
resize();
draw(PHASE0);
if (typeof requestAnimationFrame === "function") {
  startStamp = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  var lastStamp = startStamp;
  var loop = function () {
    var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
    var dt = clamp((now - lastStamp) / 1000, 0, 0.1);
    lastStamp = now;
    dragEnergy *= Math.pow(0.35, dt); // wobble energy settles
    draw(currentPhase());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
