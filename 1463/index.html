<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calligrammes Bookshop</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #3a2e28; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var started = false, t0 = 0, currentT = 0;

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(q) { q = clamp(q, 0, 1); return q * q * (3 - 2 * q); }
  function round4(v) { return Math.round(v * 10000) / 10000; }

  var INK = '#1e1e24', PAPER = '#efe6d0', WOOD = '#6b4a2f', SHELF = '#3a2e28';
  var SPINES = ['#d9a441', '#2e6f6a', '#a34a24', '#5b2a4a', '#efe6d0'];
  var WINDOW_LIGHT = '#d8e2dc';

  var WORDS = ['book', 'leaf', 'light', 'door', 'wind', 'star', 'rain', 'song', 'sea', 'moon', 'stone', 'fire', 'tree', 'road', 'home'];

  // Shape target layouts, as fractions (fx, fy) of the shape box.
  function towerLayout() {
    var rows = [3, 3, 2, 2, 2, 2, 1];
    var ys = [0.9, 0.6, 0.3, 0.0, -0.3, -0.6, -0.9];
    var pts = [], k = 0;
    for (var r = 0; r < rows.length; r++) {
      var n = rows[r];
      var xs = n === 3 ? [-0.55, 0, 0.55] : (n === 2 ? [-0.3, 0.3] : [0]);
      for (var j = 0; j < n; j++) { pts.push([xs[j], ys[r]]); k++; }
    }
    return pts;
  }
  function birdLayout() {
    return [
      [0.55, -0.8],
      [-0.5, -0.35], [-0.15, -0.35], [0.2, -0.35], [0.55, -0.35],
      [-0.7, 0.1], [-0.35, 0.1], [0, 0.1], [0.35, 0.1], [0.7, 0.1],
      [-0.4, 0.55], [0, 0.55], [0.4, 0.55],
      [-0.78, -0.1], [-0.82, 0.35]
    ];
  }
  function stairLayout() {
    var pts = [];
    var xs = [-0.8, -0.4, 0, 0.4, 0.8];
    var ys = [0.9, 0.54, 0.18, -0.18, -0.54];
    for (var c = 0; c < 5; c++) {
      for (var s = 0; s <= c; s++) { pts.push([xs[c], ys[s]]); }
    }
    return pts;
  }
  var SHAPES = [towerLayout(), birdLayout(), stairLayout()];

  // Seeded scatter positions, one per word, shared across shapes.
  var scatter = (function () {
    var rnd = mulberry32(1463000 + 101);
    var arr = [];
    for (var i = 0; i < WORDS.length; i++) {
      arr.push([(rnd() * 1.8 - 0.9), (rnd() * 1.7 - 0.85)]);
    }
    return arr;
  })();

  // Seeded book rows, computed per frame size from a fixed stream.
  function bookRows() {
    var rnd = mulberry32(1463000);
    var rows = [];
    var rowYs = [0.10, 0.24, 0.38, 0.52];
    for (var r = 0; r < rowYs.length; r++) {
      var books = [];
      var x = 0;
      while (x < W) {
        var bw = 10 + rnd() * 20;
        var bh = 0.085 * H * (0.75 + rnd() * 0.45);
        var col = SPINES[Math.floor(rnd() * SPINES.length)];
        books.push([x, bw, bh, col]);
        x += bw + 2;
      }
      rows.push([rowYs[r], books]);
    }
    return rows;
  }
  var booksCache = null, booksCacheW = -1, booksCacheH = -1;

  function shapeBox() {
    var sw = 0.52 * W, sh = 0.44 * H;
    return { cx: 0.50 * W, cy: 0.385 * H, sw: sw, sh: sh };
  }

  // Cycle: 36 s, three 12 s segments. t=0 sits at segment 0, local 4 (tower held).
  function cyclePos(i, t) {
    var Te = (t + 4) % 36;
    var seg = Math.floor(Te / 12);
    var local = Te - seg * 12;
    var box = shapeBox();
    var tgt = SHAPES[seg][i];
    var tx = box.cx + tgt[0] * box.sw / 2;
    var ty = box.cy + tgt[1] * box.sh / 2;
    var sc = scatter[i];
    var sx = box.cx + sc[0] * box.sw / 2;
    var sy = box.cy + sc[1] * box.sh / 2;
    var x, y, a;
    if (local < 4) {
      var d = (i % 5) * 0.18;
      var q = smooth((local - d) / 3);
      x = sx + (tx - sx) * q;
      y = sy + (ty - sy) * q;
      a = 0.4 + 0.6 * q;
    } else if (local < 9) {
      var bob = Math.sin(t * 2 * Math.PI / 3 + i * 0.9) * 2;
      x = tx; y = ty + bob; a = 1;
    } else {
      var r = smooth((local - 9) / 3);
      x = tx + (sx - tx) * r;
      y = ty + (sy - ty) * r;
      a = 1 - 0.6 * r;
    }
    return [x, y, a];
  }

  // Drag state, closed-form over recorded events.
  var drags = []; // {word, px, py, t0, t1, rx, ry, ox, oy}
  function wordPos(i, t) {
    var base = cyclePos(i, t);
    var d = null;
    for (var k = drags.length - 1; k >= 0; k--) {
      if (drags[k].word === i && drags[k].t0 <= t) { d = drags[k]; break; }
    }
    if (!d) return base;
    if (d.t1 === null) return [d.px, d.py, 1];
    var dt = t - d.t1;
    var decay = Math.exp(-dt / 1.5);
    return [base[0] + d.ox * decay, base[1] + d.oy * decay, base[2]];
  }

  function pointerPos(e) {
    var x = (e.clientX !== undefined) ? e.clientX : e.offsetX;
    var y = (e.clientY !== undefined) ? e.clientY : e.offsetY;
    return [x, y];
  }
  function nearestWord(x, y, t) {
    var best = -1, bestD = 1e9;
    var fs = fontSize();
    for (var i = 0; i < WORDS.length; i++) {
      var p = wordPos(i, t);
      var dx = p[0] - x, dy = p[1] - y;
      var dd = dx * dx + dy * dy;
      if (dd < bestD) { bestD = dd; best = i; }
    }
    if (bestD < (48 + fs) * (48 + fs)) return best;
    return -1;
  }
  function onDown(e) {
    var p = pointerPos(e);
    var w = nearestWord(p[0], p[1], currentT);
    if (w >= 0) {
      drags.push({ word: w, px: p[0], py: p[1], t0: currentT, t1: null, rx: 0, ry: 0, ox: 0, oy: 0 });
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    var p = pointerPos(e);
    for (var k = drags.length - 1; k >= 0; k--) {
      if (drags[k].t1 === null) { drags[k].px = p[0]; drags[k].py = p[1]; break; }
    }
  }
  function onUp(e) {
    for (var k = drags.length - 1; k >= 0; k--) {
      if (drags[k].t1 === null) {
        var base = cyclePos(drags[k].word, currentT);
        drags[k].t1 = currentT;
        drags[k].rx = drags[k].px; drags[k].ry = drags[k].py;
        drags[k].ox = drags[k].px - base[0];
        drags[k].oy = drags[k].py - base[1];
        break;
      }
    }
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function fontSize() {
    var s = Math.min(W, H);
    return Math.round(clamp(s * 0.048, 15, 32));
  }

  function resize() {
    var vw = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.width : window.innerWidth;
    var vh = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    var minScreen = Math.min(window.screen.width, window.screen.height);
    isPhone = (minScreen < 700) || (H > W * 1.15);
    booksCache = null;
  }

  function draw(t) {
    currentT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = SHELF;
    ctx.fillRect(0, 0, W, H);

    if (booksCache === null || booksCacheW !== W || booksCacheH !== H) {
      booksCache = bookRows(); booksCacheW = W; booksCacheH = H;
    }
    // Shelves of books fill the background.
    for (var r = 0; r < booksCache.length; r++) {
      var rowY = booksCache[r][0] * H;
      var books = booksCache[r][1];
      for (var b = 0; b < books.length; b++) {
        var bk = books[b];
        ctx.fillStyle = bk[3];
        ctx.fillRect(bk[0], rowY - bk[2], bk[1], bk[2]);
      }
      ctx.fillStyle = WOOD;
      ctx.fillRect(0, rowY, W, 4);
    }

    // Window onto a street, upper right.
    var wx0 = 0.82 * W, wy0 = 0.05 * H, ww = 0.15 * W, wh = 0.25 * H;
    ctx.fillStyle = WINDOW_LIGHT;
    ctx.fillRect(wx0, wy0, ww, wh);
    ctx.fillStyle = SHELF;
    ctx.fillRect(wx0 + 0.12 * ww, wy0 + 0.45 * wh, 0.30 * ww, 0.55 * wh);
    ctx.fillRect(wx0 + 0.55 * ww, wy0 + 0.30 * wh, 0.32 * ww, 0.70 * wh);
    ctx.fillStyle = WOOD;
    ctx.fillRect(wx0 + 0.48 * ww, wy0, 0.04 * ww, wh);
    ctx.fillRect(wx0, wy0 + 0.45 * wh, ww, 0.03 * wh);
    ctx.fillRect(wx0, wy0, ww, 3);
    ctx.fillRect(wx0, wy0 + wh, ww, 3);

    // Paper panel behind the word-shape, above the counter.
    var box = shapeBox();
    var px0 = box.cx - 0.29 * W, py0 = box.cy - 0.265 * H;
    var pw = 0.58 * W, ph = 0.53 * H;
    ctx.fillStyle = SHELF;
    ctx.fillRect(px0 + 4, py0 + 5, pw, ph);
    ctx.fillStyle = PAPER;
    ctx.fillRect(px0, py0, pw, ph);
    ctx.strokeStyle = WOOD;
    ctx.lineWidth = 2;
    ctx.strokeRect(px0, py0, pw, ph);

    // Counter, lower third.
    var cy0 = 0.67 * H;
    ctx.fillStyle = WOOD;
    ctx.fillRect(0, cy0, W, H - cy0);
    ctx.fillStyle = SHELF;
    ctx.fillRect(0, cy0, W, 3);
    // A small stack of books on the counter, right side.
    var bx = 0.82 * W, by = cy0;
    ctx.fillStyle = '#d9a441'; ctx.fillRect(bx, by - 16, 0.09 * W, 16);
    ctx.fillStyle = '#2e6f6a'; ctx.fillRect(bx + 4, by - 30, 0.08 * W, 14);
    ctx.fillStyle = '#5b2a4a'; ctx.fillRect(bx + 8, by - 42, 0.07 * W, 12);

    // The word-shape.
    var fs = fontSize();
    ctx.font = 'bold ' + fs + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < WORDS.length; i++) {
      var p = wordPos(i, t);
      ctx.globalAlpha = round4(p[2]);
      ctx.fillStyle = INK;
      ctx.fillText(WORDS[i], p[0], p[1]);
    }
    ctx.globalAlpha = 1;
  }

  function onResize() { resize(); draw(currentT); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }
  resize();
  draw(0);

  function loop(now) {
    if (!started) { started = true; t0 = now; }
    draw((now - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

  if (typeof window !== 'undefined') {
    window.__piece = { draw: draw, wordPos: wordPos, cyclePos: cyclePos, words: WORDS, shapes: SHAPES };
  }
})();
</script>
</body>
</html>
