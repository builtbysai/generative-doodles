<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kanary Band</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #2e4a2a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG, fixed seed: frame one is fully deterministic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1813);

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  // Loop: 240 s. Birds follow seeded schedules; nothing is conducted.
  var LOOP = 240;

  function alpha(v) {
    var a = Math.round(v * 10000) / 10000;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    return a;
  }
  function lerp(a, b, f) { return a + (b - a) * f; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---- Perches, in aviary-local coordinates (u across, v down) ----
  // inst: which instrument answers when a bird lands here.
  var PERCHES = [
    { u: 0.36, v: 0.585, inst: 'chime', z: 0.95 },  // chime rail
    { u: 0.72, v: 0.700, inst: 'drum',  z: 1.00 },  // paper drum rim
    { u: 0.16, v: 0.300, inst: 'bell',  z: 0.90 },  // bell perch A
    { u: 0.85, v: 0.340, inst: 'bell',  z: 0.90 },  // bell perch B
    { u: 0.55, v: 0.380, inst: 'branch', z: 0.85 }, // branch upper
    { u: 0.30, v: 0.480, inst: 'branch', z: 0.85 }, // branch lower
    { u: 0.63, v: 0.520, inst: 'bell',  z: 0.95 },  // bell perch C
    { u: 0.46, v: 0.240, inst: 'swing', z: 0.80 }   // hanging swing
  ];
  var NP = PERCHES.length;

  // ---- Bird schedules: seeded, irregular, never quantized to a beat ----
  // Segment: { t0, t1, from, to, kind } kind: 'rest' | 'preen' | 'fly' | 'hop'
  var BIRDS = [];
  var LANDINGS = []; // { t, perch } every arrival, drives instrument responses
  var NB = 12;
  for (var bi = 0; bi < NB; bi++) {
    var br = mulberry32(1813 + bi * 101);
    var perch = Math.floor(br() * NP);
    var t = 0;
    var segs = [];
    // First segment: start perched, resting, so frame one has birds on instruments.
    var firstDur = 4 + br() * 10;
    segs.push({ t0: 0, t1: firstDur, from: perch, to: perch, kind: (br() < 0.5 ? 'rest' : 'preen') });
    t = firstDur;
    while (t < LOOP) {
      var roll = br();
      var next;
      if (roll < 0.42) {
        next = Math.floor(br() * NP);
        if (next === perch) next = (next + 1 + Math.floor(br() * (NP - 1))) % NP;
        var dur = 0.9 + br() * 0.7;
        segs.push({ t0: t, t1: t + dur, from: perch, to: next, kind: 'fly' });
        LANDINGS.push({ t: t + dur, perch: next });
        perch = next;
        t += dur;
      } else if (roll < 0.58) {
        next = (perch + (br() < 0.5 ? 1 : NP - 1)) % NP;
        var hd = 0.45 + br() * 0.25;
        segs.push({ t0: t, t1: t + hd, from: perch, to: next, kind: 'hop' });
        LANDINGS.push({ t: t + hd, perch: next });
        perch = next;
        t += hd;
      } else if (roll < 0.78) {
        var rd = 3 + br() * 9;
        segs.push({ t0: t, t1: t + rd, from: perch, to: perch, kind: 'rest' });
        t += rd;
      } else {
        var pd = 2 + br() * 4;
        segs.push({ t0: t, t1: t + pd, from: perch, to: perch, kind: 'preen' });
        t += pd;
      }
    }
    BIRDS.push({ segs: segs, hue: br(), size: 0.85 + br() * 0.3, phase: br() * Math.PI * 2, ox: ((((bi + 2) % 5) - 2) * 0.03) });
  }
  LANDINGS.sort(function (a, b) { return a.t - b.t; });

  // Instrument response at time t for a perch: decaying sway after each landing.
  function responseAt(t, perchIdx) {
    var s = 0;
    for (var i = 0; i < LANDINGS.length; i++) {
      var L = LANDINGS[i];
      if (L.perch !== perchIdx) continue;
      var dt = t - L.t;
      if (dt < 0 || dt > 6) continue;
      s += Math.exp(-dt / 1.8) * Math.cos(dt * 5.0);
    }
    return clamp(s, -1, 1);
  }

  // Bird state at time t: position in aviary-local coords, pose, scale.
  function birdAt(bird, t) {
    var segs = bird.segs;
    var seg = segs[0];
    for (var i = 0; i < segs.length; i++) {
      if (t >= segs[i].t0 && t < segs[i].t1) { seg = segs[i]; break; }
      if (t >= segs[i].t1) seg = segs[i];
    }
    var pa = PERCHES[seg.from], pb = PERCHES[seg.to];
    var f = seg.t1 > seg.t0 ? (t - seg.t0) / (seg.t1 - seg.t0) : 0;
    f = clamp(f, 0, 1);
    var x, y, z, pose, ang;
    if (seg.kind === 'fly') {
      var e = f * f * (3 - 2 * f); // smoothstep
      x = lerp(pa.u, pb.u, e);
      var lift = Math.sin(f * Math.PI) * 0.10;
      y = lerp(pa.v, pb.v, e) - lift;
      z = lerp(pa.z, pb.z, e);
      pose = 'fly';
      ang = Math.atan2((pb.v - pa.v) - Math.cos(f * Math.PI) * 0.10 * Math.PI, pb.u - pa.u);
    } else if (seg.kind === 'hop') {
      var e2 = f;
      x = lerp(pa.u, pb.u, e2);
      y = lerp(pa.v, pb.v, e2) - Math.sin(f * Math.PI) * 0.035;
      z = lerp(pa.z, pb.z, e2);
      pose = 'hop';
      ang = 0;
    } else {
      x = pa.u;
      y = pa.v;
      z = pa.z;
      pose = seg.kind; // 'rest' or 'preen'
      ang = 0;
    }
    return { x: x + bird.ox, y: y, z: z, pose: pose, ang: ang, f: f, t: t, bird: bird };
  }

  function drawBird(s, X, Y, S) {
    var px = X(s.x), py = Y(s.y);
    var sc = S * s.z * s.bird.size;
    var bob = 0;
    if (s.pose === 'rest') bob = Math.sin(s.t * 1.4 + s.bird.phase) * 0.8;
    if (s.pose === 'preen') bob = Math.sin(s.t * 3.0 + s.bird.phase) * 1.2;
    py += bob * (S / 40);
    ctx.save();
    ctx.translate(px, py);
    if (s.pose === 'fly' || s.pose === 'hop') ctx.rotate(clamp(s.ang, -0.5, 0.5) * 0.4);
    var body = 6 * sc, head = 3.2 * sc;
    // Tail.
    ctx.fillStyle = '#d9a41f';
    ctx.beginPath();
    ctx.moveTo(-body * 0.7, 0);
    ctx.lineTo(-body * 1.5, -2 * sc);
    ctx.lineTo(-body * 1.5, 3 * sc);
    ctx.closePath();
    ctx.fill();
    // Wings.
    if (s.pose === 'fly') {
      var flap = Math.sin(s.t * 22 + s.bird.phase);
      ctx.fillStyle = '#e8b93a';
      ctx.beginPath();
      ctx.moveTo(-2 * sc, -2 * sc);
      ctx.lineTo(-body * 0.9, -body * 0.9 - flap * 4 * sc);
      ctx.lineTo(-body * 0.2, -body * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-2 * sc, 2 * sc);
      ctx.lineTo(-body * 0.9, body * 0.9 + flap * 4 * sc);
      ctx.lineTo(-body * 0.2, body * 0.3);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = '#e0aa26';
      ctx.beginPath();
      ctx.moveTo(-body * 0.55, -body * 0.35);
      ctx.lineTo(body * 0.45, -body * 0.1);
      ctx.lineTo(body * 0.2, body * 0.45);
      ctx.lineTo(-body * 0.6, body * 0.3);
      ctx.closePath();
      ctx.fill();
    }
    // Body.
    ctx.fillStyle = '#f2c531';
    ctx.beginPath();
    ctx.moveTo(body, 0);
    ctx.ellipse(0, 0, body, body * 0.72, 0, 0, Math.PI * 2);
    ctx.fill();
    // Head.
    var hx = body * 0.72, hy = -body * 0.42;
    if (s.pose === 'preen') { hx = body * 0.45; hy = -body * 0.1; }
    ctx.fillStyle = '#f6d34e';
    ctx.beginPath();
    ctx.moveTo(hx + head, hy);
    ctx.arc(hx, hy, head, 0, Math.PI * 2);
    ctx.fill();
    // Beak.
    ctx.fillStyle = '#c97b2e';
    ctx.beginPath();
    ctx.moveTo(hx + head * 0.8, hy - 1.5 * sc);
    ctx.lineTo(hx + head * 1.7, hy + 0.5 * sc);
    ctx.lineTo(hx + head * 0.8, hy + 2 * sc);
    ctx.closePath();
    ctx.fill();
    // Eye.
    ctx.fillStyle = '#1c1c1c';
    ctx.beginPath();
    ctx.moveTo(hx + head * 0.45, hy - head * 0.2);
    ctx.arc(hx + head * 0.2, hy - head * 0.2, 1.4 * sc, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw(t) {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var W = Math.max(1, Math.floor(vw));
    var H = Math.max(1, Math.floor(vh));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var isPhone = false;
    try {
      var sw = window.screen.width, sh = window.screen.height;
      var mn = Math.min(sw, sh);
      isPhone = mn < 700 || (H > W * 1.15);
    } catch (e) { isPhone = (H > W * 1.15); }

    var lt = t % LOOP;

    // Page ground: garden green, dark.
    ctx.fillStyle = '#2e4a2a';
    ctx.fillRect(0, 0, W, H);

    // Garden beyond the mesh: soft bushes and morning light.
    var g1 = ctx.createLinearGradient(0, 0, W, H);
    g1.addColorStop(0, '#7fae62');
    g1.addColorStop(0.55, '#55763f');
    g1.addColorStop(1, '#33502c');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);
    // Bush blobs.
    var br2 = mulberry32(1813 + 900);
    for (var g = 0; g < 14; g++) {
      var gx = br2() * W, gy = H * (0.55 + br2() * 0.45), gr = 40 + br2() * 110;
      ctx.fillStyle = 'rgba(38, 74, 32, ' + alpha(0.25 + br2() * 0.25) + ')';
      ctx.beginPath();
      ctx.moveTo(gx + gr, gy);
      ctx.arc(gx, gy, gr, 0, Math.PI * 2);
      ctx.fill();
    }
    // Morning light rays from the top left.
    ctx.save();
    ctx.globalAlpha = alpha(0.10);
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(W * 0.55, 0);
    ctx.lineTo(W * 0.85, H);
    ctx.lineTo(W * 0.25, H);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // ---- Aviary rect ----
    var ax, ay, aw, ah;
    if (isPhone) {
      ax = 0; ay = 58; aw = W; ah = H - 58;
    } else {
      var side = Math.min(W * 0.88, H * 0.86);
      aw = side * 1.18; ah = side;
      ax = (W - aw) / 2; ay = Math.max(H * 0.085, side * 0.16);
      if (ay + ah > H * 0.97) ay = H * 0.97 - ah;
    }
    var X = function (u) { return ax + u * aw; };
    var Y = function (v) { return ay + v * ah; };
    var S = Math.min(aw, ah) / 100; // scene scale

    // Inside the aviary: warm morning air.
    var in1 = ctx.createLinearGradient(0, ay, 0, ay + ah);
    in1.addColorStop(0, '#f3df9e');
    in1.addColorStop(0.5, '#e8cf8d');
    in1.addColorStop(1, '#c9a86a');
    ctx.fillStyle = in1;
    ctx.fillRect(ax, ay, aw, ah);
    // Back garden seen through the far mesh, soft green.
    ctx.fillStyle = 'rgba(122, 158, 92, 0.35)';
    ctx.fillRect(ax, ay + ah * 0.55, aw, ah * 0.45);

    // Floor: honey wood planks with scattered seed.
    ctx.fillStyle = '#a97e46';
    ctx.fillRect(ax, Y(0.86), aw, ah * 0.14);
    ctx.strokeStyle = 'rgba(90, 58, 24, 0.5)';
    ctx.lineWidth = 1;
    for (var p = 0; p < 5; p++) {
      ctx.beginPath();
      ctx.moveTo(ax, Y(0.86 + p * 0.028));
      ctx.lineTo(ax + aw, Y(0.86 + p * 0.028));
      ctx.stroke();
    }
    var sr = mulberry32(1813 + 500);
    ctx.fillStyle = '#e8d9a8';
    for (var sd = 0; sd < 26; sd++) {
      var sx = ax + sr() * aw, sy = Y(0.88 + sr() * 0.10);
      ctx.beginPath();
      ctx.moveTo(sx + 1.2, sy);
      ctx.arc(sx, sy, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- Instruments ----

    // Chime bars: five tuned bars hanging from a rail.
    var chimeResp = responseAt(lt, 0);
    var railY = Y(0.585), railX0 = X(0.16), railX1 = X(0.56);
    ctx.strokeStyle = '#7a5a30';
    ctx.lineWidth = 3 * S;
    ctx.beginPath();
    ctx.moveTo(railX0, railY);
    ctx.lineTo(railX1, railY);
    ctx.stroke();
    var barCols = ['#c9a86a', '#b8b0a0', '#d8b25e', '#a8a89e', '#c98f4e'];
    for (var cb = 0; cb < 5; cb++) {
      var bx = railX0 + (cb + 0.5) * (railX1 - railX0) / 5;
      var blen = (14 + cb * 3.5) * S;
      var sway = chimeResp * Math.sin(cb * 1.3 + 0.6) * 0.10;
      ctx.save();
      ctx.translate(bx, railY);
      ctx.rotate(sway);
      ctx.strokeStyle = '#8a6a3a';
      ctx.lineWidth = 1.2 * S;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 6 * S);
      ctx.stroke();
      ctx.fillStyle = barCols[cb];
      ctx.fillRect(-2.5 * S, 6 * S, 5 * S, blen);
      ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha(0.35 + 0.45 * Math.abs(chimeResp)) + ')';
      ctx.fillRect(-2.5 * S, 6 * S, 1.5 * S, blen);
      ctx.restore();
    }

    // Paper drum: pale cylinder, skin ripples when a bird lands on its rim.
    var drumResp = responseAt(lt, 1);
    var dx = X(0.72), dy = Y(0.78), dw = 20 * S, dh = 12 * S;
    ctx.fillStyle = '#8a6a3a';
    ctx.beginPath();
    ctx.moveTo(dx - dw, dy - dh);
    ctx.lineTo(dx + dw, dy - dh);
    ctx.lineTo(dx + dw * 0.9, dy + dh);
    ctx.lineTo(dx - dw * 0.9, dy + dh);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#b98d54';
    ctx.fillRect(dx - dw, dy - dh, dw * 2, 4 * S);
    // Skin: ripples with the landing response.
    var ripple = 1 + drumResp * 0.12;
    ctx.fillStyle = '#f2e8cf';
    ctx.beginPath();
    ctx.ellipse(dx, dy - dh, dw * ripple, 4 * S * ripple, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = 1.5 * S;
    ctx.beginPath();
    ctx.ellipse(dx, dy - dh, dw, 4 * S, 0, 0, Math.PI * 2);
    ctx.stroke();
    if (Math.abs(drumResp) > 0.05) {
      ctx.strokeStyle = 'rgba(120, 90, 40, ' + alpha(0.5 * Math.abs(drumResp)) + ')';
      ctx.lineWidth = 1.2 * S;
      ctx.beginPath();
      ctx.ellipse(dx, dy - dh, dw * 0.55 * ripple, 2.5 * S * ripple, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Bell perches: small perches with a hanging bell that rocks.
    function bellPerch(idx, u, v, len) {
      var resp = responseAt(lt, idx);
      var bx = X(u), by = Y(v);
      ctx.strokeStyle = '#7a5a30';
      ctx.lineWidth = 2.5 * S;
      ctx.beginPath();
      ctx.moveTo(bx - 12 * S, by);
      ctx.lineTo(bx + 12 * S, by);
      ctx.stroke();
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(resp * 0.28);
      ctx.strokeStyle = '#6a4a26';
      ctx.lineWidth = 1.2 * S;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, len);
      ctx.stroke();
      ctx.fillStyle = '#d8b25e';
      ctx.beginPath();
      ctx.moveTo(-5 * S, len + 8 * S);
      ctx.lineTo(5 * S, len + 8 * S);
      ctx.lineTo(3 * S, len);
      ctx.lineTo(-3 * S, len);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#8a6a3a';
      ctx.beginPath();
      ctx.moveTo(2 * S, len + 8 * S);
      ctx.arc(0, len + 9 * S, 1.6 * S, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    bellPerch(2, 0.16, 0.300, 10 * S);
    bellPerch(3, 0.85, 0.340, 11 * S);
    bellPerch(6, 0.63, 0.520, 10 * S);

    // Branches: two plain perches, slight bob on landing.
    function branch(idx, u0, v0, u1, v1) {
      var resp = responseAt(lt, idx);
      ctx.save();
      ctx.translate(X(u0), Y(v0));
      ctx.rotate(resp * 0.03);
      ctx.strokeStyle = '#6a4a26';
      ctx.lineWidth = 3.5 * S;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(X(u1) - X(u0), Y(v1) - Y(v0));
      ctx.stroke();
      ctx.restore();
    }
    branch(4, 0.42, 0.380, 0.68, 0.360);
    branch(5, 0.18, 0.480, 0.42, 0.470);

    // Hanging swing: sways when a bird lands on it.
    var swingResp = responseAt(lt, 7);
    var swx = X(0.46), swy = Y(0.150);
    ctx.save();
    ctx.translate(swx, swy);
    ctx.rotate(swingResp * 0.22);
    ctx.strokeStyle = '#6a4a26';
    ctx.lineWidth = 1.5 * S;
    ctx.beginPath();
    ctx.moveTo(-10 * S, 0);
    ctx.lineTo(-10 * S, Y(0.240) - swy);
    ctx.moveTo(10 * S, 0);
    ctx.lineTo(10 * S, Y(0.240) - swy);
    ctx.stroke();
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(-12 * S, Y(0.240) - swy, 24 * S, 3 * S);
    ctx.restore();

    // Chime rail perch bar (birds stand on the rail itself).
    ctx.strokeStyle = '#5e421e';
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    ctx.moveTo(railX0, railY);
    ctx.lineTo(railX1, railY);
    ctx.stroke();
    // Drum rim perch.
    ctx.strokeStyle = '#5e421e';
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    ctx.moveTo(dx - dw, dy - dh);
    ctx.lineTo(dx + dw, dy - dh);
    ctx.stroke();

    // ---- Birds, drawn back to front by depth ----
    var states = [];
    for (var b = 0; b < NB; b++) states.push(birdAt(BIRDS[b], lt));
    states.sort(function (a, c2) { return a.z - c2.z; });
    for (var s2 = 0; s2 < states.length; s2++) drawBird(states[s2], X, Y, S);

    // ---- Aviary frame: honey wood posts, pitched roof ----
    ctx.strokeStyle = '#7a5a30';
    ctx.lineWidth = 5 * S;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax + aw / 2, ay - 12 * S);
    ctx.lineTo(ax + aw, ay);
    ctx.stroke();
    ctx.fillStyle = 'rgba(122, 90, 48, 0.35)';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax + aw / 2, ay - 12 * S);
    ctx.lineTo(ax + aw, ay);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#8a6a3a';
    ctx.lineWidth = 6 * S;
    ctx.strokeRect(ax, ay, aw, ah);
    // Corner posts.
    ctx.fillStyle = '#6a4a26';
    ctx.fillRect(ax - 3 * S, ay - 3 * S, 6 * S, ah + 6 * S);
    ctx.fillRect(ax + aw - 3 * S, ay - 3 * S, 6 * S, ah + 6 * S);

    // ---- Front mesh, slightly out of focus: faint double grid ----
    var meshStep = 18 * S;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
    ctx.lineWidth = 1;
    for (var mx = ax; mx <= ax + aw; mx += meshStep) {
      ctx.beginPath();
      ctx.moveTo(mx, ay);
      ctx.lineTo(mx, ay + ah);
      ctx.stroke();
    }
    for (var my = ay; my <= ay + ah; my += meshStep) {
      ctx.beginPath();
      ctx.moveTo(ax, my);
      ctx.lineTo(ax + aw, my);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(60, 50, 30, 0.05)';
    for (var mx2 = ax + meshStep / 2; mx2 <= ax + aw; mx2 += meshStep) {
      ctx.beginPath();
      ctx.moveTo(mx2, ay);
      ctx.lineTo(mx2, ay + ah);
      ctx.stroke();
    }

    // ---- Title, date and hint plates, drawn on canvas ----
    ctx.textAlign = 'left';
    ctx.fillStyle = '#f2e8cf';
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillText('THE KANARY BAND', 16, 24);
    ctx.fillStyle = '#cfe0b8';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('2006 · 12 · 29', 16, 42);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#cfe0b8';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('WATCH ONLY', W / 2, H - 14);
  }

  function sizeAndDraw(t) { draw(t); }

  // One synchronous frame at load: fixed phase t = 60 s.
  sizeAndDraw(60);

  if (reduced) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = 60 + (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }

  function onResize() { draw(60); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
