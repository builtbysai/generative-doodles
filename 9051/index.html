<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№9051 · Ruled Lines</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #faf8f2; overflow: hidden; }
  canvas { display: block; }
  .cap { position: fixed; left: 14px; bottom: 10px; font: italic 12px Georgia, serif;
         color: #8a8478; user-select: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">№9051 · Ruled Lines · click for another field</div>
<script>
// Ruled Lines: dense hand-drawn horizontal rules in ballpoint blue.
// A hidden radial field modulates each line's wave — the un-drawn
// tension between lines forms a ghostly circular presence.
// Inspired by the ballpoint-on-ruled-paper current, drawn originally.
let seed = 42;
const q = new URLSearchParams(location.search);
if (q.has('seed')) seed = parseInt(q.get('seed'), 10) || 42;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function render() {
  const rnd = mulberry32(seed);
  const canvas = document.getElementById('c');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // paper
  ctx.fillStyle = '#faf8f2';
  ctx.fillRect(0, 0, W, H);
  // faint paper grain
  ctx.fillStyle = '#f3efe4';
  for (let i = 0; i < 400; i++) {
    ctx.fillRect(rnd() * W, rnd() * H, 1.5, 1.5);
  }

  // hidden field: 1-3 ghost centers
  const ghosts = [];
  const ng = 1 + ((rnd() * 2) | 0);
  for (let i = 0; i < ng; i++) {
    ghosts.push({
      x: W * (0.25 + rnd() * 0.5),
      y: H * (0.25 + rnd() * 0.5),
      r: Math.min(W, H) * (0.18 + rnd() * 0.22),
      dir: rnd() > 0.5 ? 1 : -1
    });
  }

  const lineGap = Math.max(7, H / 110);
  ctx.strokeStyle = '#2b4d9b';
  ctx.lineCap = 'round';

  for (let y0 = lineGap * 0.5; y0 < H; y0 += lineGap) {
    ctx.lineWidth = 0.8 + rnd() * 0.9;
    ctx.globalAlpha = 0.55 + rnd() * 0.3;
    ctx.beginPath();
    const steps = Math.ceil(W / 14);
    for (let s = 0; s <= steps; s++) {
      const x = (s / steps) * W;
      // field influence: sum of gaussian bumps
      let lift = 0;
      for (const g of ghosts) {
        const dx = (x - g.x) / g.r, dy = (y0 - g.y) / g.r;
        const d2 = dx * dx + dy * dy;
        lift += g.dir * Math.exp(-d2 * 2.2);
      }
      // wave: amplitude grows with |lift|, plus hand wobble
      const wob = Math.sin(x * 0.008 + y0 * 0.05 + seed) * 1.2
                + Math.sin(x * 0.031 + y0 * 0.11) * 0.7;
      const y = y0 + lift * lineGap * 9 + wob * (0.4 + Math.abs(lift) * 2.2);
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // red margin line, like a notebook
  ctx.strokeStyle = '#c46a5e';
  ctx.lineWidth = 1.2;
  ctx.globalAlpha = 0.5;
  const mx = W * 0.08;
  ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, H); ctx.stroke();
  ctx.globalAlpha = 1;
}

render();
window.addEventListener('resize', render);
window.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  render();
});
</script>
</body>
</html>
