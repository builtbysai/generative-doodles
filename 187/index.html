<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.187 Gravity Light</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font:12px system-ui, sans-serif; color:#9A9AA2; opacity:0.5;
    pointer-events:none; letter-spacing:0.04em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag to tilt, tap to drop a ball</div>
<script>
(function () {
'use strict';
// No.187 Gravity Light (Eugene Sargent). A wall of 24 vertical
// acrylic tubes; inside them, pulses of light are real balls under
// real gravity. Every position comes from a fixed-step integrator:
// fall, acceleration, bounce with restitution 0.82, energy bleeding
// away bounce by bounce, the light cooling white to cyan or magenta
// to amber as the energy fades. Drag tilts the gravity vector, tap
// drops in one new ball, and untouched the wall feeds itself on a
// slow irregular rhythm so it never fully stills.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#050505', GLASS = '#1A1A20';
var CYAN = '#35F0FF', MAGENTA = '#FF3EC8', AMBER = '#FFB13E';
var LANES = 24, MAXBALLS = 40;
var W = 0, H = 0, phone = false;
var seed = 187187;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;

function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function hexRgb(hx) {
  return [parseInt(hx.slice(1, 3), 16), parseInt(hx.slice(3, 5), 16), parseInt(hx.slice(5, 7), 16)];
}
var C_WHITE = [255, 255, 255], C_CYAN = hexRgb(CYAN), C_MAG = hexRgb(MAGENTA), C_AMBER = hexRgb(AMBER);
function mix(a, b, k) {
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * k) + ',' +
    Math.round(a[1] + (b[1] - a[1]) * k) + ',' +
    Math.round(a[2] + (b[2] - a[2]) * k) + ')';
}
function mixA(a, b, k, al) {
  return 'rgba(' + Math.round(a[0] + (b[0] - a[0]) * k) + ',' +
    Math.round(a[1] + (b[1] - a[1]) * k) + ',' +
    Math.round(a[2] + (b[2] - a[2]) * k) + ',' + al + ')';
}

// ---- physics -------------------------------------------------------
// y in pixels, floor at H (tubes bleed past the frame top and bottom).
// energy: apex height of the latest bounce as a fraction of H.
var balls = [];
var tiltX = 0, tiltY = 0, tiltTX = 0, tiltTY = 0;   // current / target
var spawnIn = 0.5;

function spawnBall(lane, yFrac) {
  if (balls.length >= MAXBALLS) return;
  balls.push({
    lane: lane,
    y: (yFrac !== undefined ? yFrac : 0.04 + rand() * 0.25) * H,
    v: 0,
    r: Math.max(3.5, Math.min(W, H) * 0.009),
    kind: rand() < 0.5 ? 0 : 1,
    energy: 1,
    settled: 0,
    hist: []
  });
}

var DT = 1 / 120;
function stepPhysics(dt) {
  var g = H * 2.1 * (0.55 + 0.95 * Math.max(0, tiltY));
  var i, j, b;
  for (i = 0; i < balls.length; i++) {
    b = balls[i];
    if (b.settled) { b.settled += dt; continue; }
    b.v += g * dt;
    b.v *= (1 - 0.06 * dt);
    b.y += b.v * dt;
    if (b.y >= H - b.r) {
      b.y = H - b.r;
      var impact = Math.abs(b.v);
      b.v = -b.v * 0.82;
      b.energy = clamp(Math.pow(0.82, 2) * (b.energy), 0, 1);
      // apex of the coming bounce relative to fall height so far
      b.energy = clamp((b.v * b.v) / (2 * g) / (H * 0.92), 0, 1);
      if (Math.abs(b.v) < H * 0.045) { b.v = 0; b.settled = 0.0001; }
    }
    if (b.y < b.r) { b.y = b.r; b.v = Math.abs(b.v) * 0.5; }
  }
  // adjacent-lane collisions transfer a kick
  for (i = 0; i < balls.length; i++) {
    for (j = i + 1; j < balls.length; j++) {
      var a = balls[i], c = balls[j];
      if (Math.abs(a.lane - c.lane) === 1 && Math.abs(a.y - c.y) < (a.r + c.r) * 1.4 && !a.settled && !c.settled) {
        var dv = (c.v - a.v) * 0.14;
        a.v += dv; c.v -= dv;
      }
    }
  }
  // remove long-settled balls
  for (i = balls.length - 1; i >= 0; i--) {
    if (balls[i].settled > 8) balls.splice(i, 1);
  }
  // self feeding
  spawnIn -= dt;
  if (spawnIn <= 0) {
    spawnIn = 0.7 + rand() * 1.9;
    if (balls.length < 34) spawnBall(Math.floor(rand() * LANES));
  }
}

// pre-run: a living wall on frame one, balls staggered in age
function prerun() {
  balls = [];
  var i, s;
  for (i = 0; i < 7; i++) spawnBall(Math.floor(rand() * LANES), rand());
  for (s = 0; s < 120 * 3; s++) stepPhysics(DT);
  for (i = 0; i < 7; i++) spawnBall(Math.floor(rand() * LANES), rand() * 0.7);
  for (s = 0; s < 120 * 2; s++) stepPhysics(DT);
  for (i = 0; i < 5; i++) spawnBall(Math.floor(rand() * LANES), rand() * 0.4);
  for (s = 0; s < 120; s++) stepPhysics(DT);
  for (i = 0; i < 4; i++) spawnBall(Math.floor(rand() * LANES), rand() * 0.35);
  for (s = 0; s < 42; s++) stepPhysics(DT);
  for (i = 0; i < 3; i++) spawnBall(Math.floor(rand() * LANES), rand() * 0.2);
  for (s = 0; s < 18; s++) stepPhysics(DT);
  // record a little history so trails exist on frame one
  for (var k = 0; k < balls.length; k++) {
    var b = balls[k];
    for (var h = 0; h < 10; h++) b.hist.push(b.y - b.v * 0.016 * (10 - h));
  }
}

// ---- layout ---------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
  if (!balls.length) prerun();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction ----------------------------------------------------
var dragging = false, downX = 0, downY = 0, downAt = 0, moved = 0;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; moved = 0;
  downX = e.clientX; downY = e.clientY; downAt = e.timeStamp;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var dx = e.clientX - downX, dy = e.clientY - downY;
  moved = Math.max(moved, Math.sqrt(dx * dx + dy * dy));
  tiltTX = clamp(dx / 240, -1, 1);
  tiltTY = clamp(dy / 240, -1, 1);
});
function endPointer(e) {
  if (!dragging) return;
  dragging = false;
  if (moved < 8 && e.timeStamp - downAt < 350) {
    var lane = clamp(Math.floor(e.clientX / (W / LANES)), 0, LANES - 1);
    spawnBall(lane, 0.03);
  }
  tiltTX = 0; tiltTY = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { dragging = false; tiltTX = 0; tiltTY = 0; });

// ---- draw -------------------------------------------------------------
var lastNow = -1, accum = 0;
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && now > 0) {
    var dtF = Math.min(0.05, (now - lastNow) / 1000);
    accum += dtF;
    while (accum >= DT) { stepPhysics(DT); accum -= DT; }
  }
  lastNow = now;
  tiltX += (tiltTX - tiltX) * 0.08;
  tiltY += (tiltTY - tiltY) * 0.08;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var laneW = W / LANES;
  // tubes
  for (var i = 0; i < LANES; i++) {
    ctx.fillStyle = GLASS;
    ctx.globalAlpha = 0.55;
    ctx.fillRect(i * laneW + 1.5, -12, laneW - 3, H + 24);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    ctx.fillRect(i * laneW + 1.5, -12, 1, H + 24);
  }
  // pulses, additive
  ctx.globalCompositeOperation = 'lighter';
  for (var k = 0; k < balls.length; k++) {
    var b = balls[k];
    // history trail
    b.hist.push(b.y);
    if (b.hist.length > 14) b.hist.shift();
    var kindCol = b.kind === 0 ? C_CYAN : C_MAG;
    var baseCol = b.energy > 0.28 ? kindCol : C_AMBER;
    var cx = (b.lane + 0.5) * laneW + tiltX * laneW * 0.30;
    var speedK = clamp(Math.abs(b.v) / (H * 1.1), 0, 1);
    var fade = b.settled ? (b.settled < 5 ? 1 : clamp(1 - (b.settled - 5) / 3, 0, 1)) : 1;
    // vertical gradient pulse, length grows with speed
    var len = b.r * (3 + speedK * 16);
    var yTop = b.v > 0 ? b.y - len * 0.25 : b.y - len * 0.75;
    var grad = ctx.createLinearGradient(0, yTop, 0, yTop + len);
    grad.addColorStop(0, mixA(baseCol, C_WHITE, 0, 0));
    grad.addColorStop(0.5, mixA(baseCol, C_WHITE, 0.25, 0.5 * fade));
    grad.addColorStop(1, mixA(baseCol, C_WHITE, 0, 0));
    ctx.fillStyle = grad;
    ctx.fillRect(cx - b.r * 0.8, yTop, b.r * 1.6, len);
    // trail history dots
    for (var h = 0; h < b.hist.length - 1; h++) {
      var a = (h / b.hist.length) * 0.16 * fade;
      ctx.fillStyle = mixA(baseCol, C_WHITE, 0, a);
      ctx.fillRect(cx - b.r * 0.45, b.hist[h] - b.r * 0.4, b.r * 0.9, b.r * 0.8);
    }
    // hot core
    var coreA = (0.35 + speedK * 0.65) * fade;
    ctx.fillStyle = mixA(C_WHITE, baseCol, 0.15, coreA);
    ctx.beginPath();
    ctx.arc(cx, b.y, b.r * (0.75 + speedK * 0.3), 0, Math.PI * 2);
    ctx.fill();
    // floor pool glow for settled balls
    if (b.settled) {
      ctx.fillStyle = mixA(C_AMBER, C_WHITE, 0, 0.13 * fade);
      ctx.fillRect(cx - laneW * 0.42, H - 3, laneW * 0.84, 3);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
