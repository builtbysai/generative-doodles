<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1937 Obsidian</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0808; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the prompt's named colors: volcanic black
  // ground, cooling basalt grey, slow ember red, umber, bright bands in
  // brief rust orange.
  var BG = '#0a0808';       // volcanic black
  var BASALT = '#2b2726';   // cooling basalt grey
  var UMBER = '#5a3a22';    // umber
  var EMBER_DEEP = '#6e1f12'; // deep ember red
  var EMBER = '#8c2f1a';    // slow ember red
  var RUST = '#c65a1e';     // bright band rust orange
  var RUST_BRIGHT = '#d97a2e'; // band core, brighter rust
  var INK = '#d8d2c8';      // plate ink, warm ash
  var INK_DIM = '#8f887c';  // muted ink

  // Fixed-phase first frame: t = 90 s. At 90 s the seeded currents are
  // already wandering up from the bottom corners, and the first bright
  // band (triggered at t = 0, peaked at 60 s) is mid-cooling at about
  // 90 percent of its peak, so frame one already shows the black field
  // with faint ember currents and one cooling rust band mid-surface.
  // Frame one is byte-reproducible: every plume, blob and band is a
  // pure function of t and the seeded PRNG.
  var FIRST_T = 90;

  // Seeded PRNG, mulberry32. A fresh instance is built per parameter
  // set from the piece number, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Slow convection model. Fourteen plumes enter from the bottom
  // corners (seven from the left, seven from the right) and wander
  // upward. Each plume carries a temperature that cools exponentially
  // as it rises and pulses slowly with t, on periods of five to ten
  // minutes. Brightness and color are tied to temperature: hot ember
  // at the base, cooling through umber to basalt grey, then black.
  var PLUMES = [];
  (function buildPlumes() {
    for (var i = 0; i < 14; i++) {
      var rng = mulberry32(1937 * 31 + i * 977);
      var left = (i % 2 === 0);
      PLUMES.push({
        x0: left ? 0.04 + rng() * 0.28 : 0.68 + rng() * 0.28,
        rise: 0.55 + rng() * 0.35,
        amp1: 0.03 + rng() * 0.05,
        amp2: 0.02 + rng() * 0.04,
        k1: 1 + Math.floor(rng() * 2),
        k2: 2 + Math.floor(rng() * 3),
        ph1: rng() * Math.PI * 2,
        ph2: rng() * Math.PI * 2,
        w1: 0.004 + rng() * 0.008,
        w2: 0.002 + rng() * 0.006,
        base: 0.7 + rng() * 0.3,
        cool: 1.0 + rng() * 0.9,
        width: 0.036 + rng() * 0.03,
        hue: rng()
      });
    }
  })();

  // Cooling basalt: six very faint large grey masses that drift almost
  // imperceptibly, giving the black field a slow geological texture.
  var BLOBS = [];
  (function buildBlobs() {
    var rng = mulberry32(1937 * 13 + 5);
    for (var i = 0; i < 6; i++) {
      BLOBS.push({
        x: rng(), y: rng(),
        r: 0.16 + rng() * 0.18,
        ph: rng() * Math.PI * 2,
        w: 0.001 + rng() * 0.002,
        a: 0.04 + rng() * 0.04
      });
    }
  })();

  // Bright bands: rare convection events. Each band surfaces in the
  // center third, spreads, then cools back into the black with a
  // half-life of about 300 s. Band 0 is triggered at t = 0 so it is
  // already cooling at frame one; later bands trigger roughly every
  // ten minutes, so the field is never without a slow event for long,
  // but never hurried either.
  var BANDS = [];
  (function buildBands() {
    var rng = mulberry32(1937 * 7 + 11);
    for (var i = 0; i < 6; i++) {
      var t0 = (i === 0) ? 0 : i * 640 + (rng() - 0.5) * 240;
      BANDS.push({
        t0: Math.max(0, t0),
        y: 0.36 + rng() * 0.28,
        x: 0.32 + rng() * 0.36,
        w: 0.42 + rng() * 0.26,
        peak: 0.65 + rng() * 0.35,
        ph: rng() * Math.PI * 2
      });
    }
  })();

  // QA probe hook: ?t=NNN renders the frame at simulated time NNN
  // seconds. render-piece.js passes its seed argument as ?seed=, so a
  // numeric seed is read as the probe time too. The default render
  // (no params) is the deterministic first frame at FIRST_T.
  function probeT() {
    try {
      var s = (typeof location !== 'undefined' && location.search) ? location.search : '';
      var m = s.match(/[?&]t=(\d+(?:\.\d+)?)/);
      if (m) { return parseFloat(m[1]); }
      var m2 = s.match(/[?&]seed=(\d+(?:\.\d+)?)/);
      if (m2) { return parseFloat(m2[1]); }
    } catch (e) {}
    return null;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var probe = probeT();
  var baseT = (probe !== null) ? probe : FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function smooth(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }
  function mixHex(h1, h2, u) {
    var r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
    var r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
    var r = Math.round(lerp(r1, r2, u)), g = Math.round(lerp(g1, g2, u)), b = Math.round(lerp(b1, b2, u));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  // Temperature 0..1 to color: basalt grey, umber, deep ember, ember,
  // rust orange at the hottest. Umber-leaning plumes (hue near 1)
  // shift the mid stops toward umber.
  function tempColor(temp, hue) {
    var u = clamp(temp, 0, 1);
    var mid = mixHex(UMBER, EMBER_DEEP, clamp(hue, 0, 1));
    if (u < 0.3) { return mixHex(BASALT, UMBER, u / 0.3); }
    if (u < 0.6) { return mixHex(UMBER, mid, (u - 0.3) / 0.3); }
    if (u < 0.85) { return mixHex(mid, EMBER, (u - 0.6) / 0.25); }
    return mixHex(EMBER, RUST, (u - 0.85) / 0.15);
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // One plume point: s is progress up the rise, 0 at the bottom corner,
  // 1 at the top of the rise. The path wanders on two slow sines.
  function plumePoint(p, s, t) {
    var y = H * (1 - s * p.rise);
    var x = p.x0 * W
      + Math.sin(s * Math.PI * 2 * p.k1 + p.ph1 + t * p.w1) * p.amp1 * W
      + Math.sin(s * Math.PI * 2 * p.k2 + p.ph2 - t * p.w2) * p.amp2 * W;
    return { x: x, y: y };
  }
  // Temperature at a point on a plume: cools exponentially with height,
  // pulses slowly with t on a five to ten minute period.
  function tempAt(p, s, t) {
    var pulse = 0.8 + 0.2 * Math.sin(t * 0.011 + p.ph1);
    return p.base * Math.exp(-p.cool * s) * pulse;
  }

  // A band's brightness at t: 0 before it triggers, rising smoothly
  // over 60 s to its peak, then cooling exponentially with a 300 s
  // half-life.
  function bandB(b, t) {
    if (t < b.t0) { return 0; }
    var age = t - b.t0;
    var rise = smooth(0, 60, age);
    var decay = Math.exp(-Math.max(0, age - 60) / 300);
    return b.peak * rise * decay;
  }

  function drawCircle(x, y, r, fill) {
    if (r <= 0) { return; }
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // ---- Cooling basalt: faint large grey masses, almost still.
    for (var bi = 0; bi < BLOBS.length; bi++) {
      var bl = BLOBS[bi];
      var bx = (bl.x + Math.sin(t * bl.w + bl.ph) * 0.02) * W;
      var by = (bl.y + Math.cos(t * bl.w * 0.7 + bl.ph) * 0.02) * H;
      drawCircle(bx, by, bl.r * W, hexA(BASALT, bl.a));
    }

    // ---- Convection plumes: soft ribbons of overlapping circles,
    // hotter and wider at the base, cooling and narrowing as they rise.
    var STEPS = 42;
    for (var pi = 0; pi < PLUMES.length; pi++) {
      var p = PLUMES[pi];
      for (var j = 0; j <= STEPS; j++) {
        var s = j / STEPS;
        var pt = plumePoint(p, s, t);
        var temp = tempAt(p, s, t);
        var breathe = 0.85 + 0.3 * Math.sin(t * 0.007 + p.ph2 + s * 3);
        var r = p.width * W * (1 - 0.3 * s) * breathe;
        drawCircle(pt.x, pt.y, r, hexA(tempColor(temp, p.hue), a4(0.09 + temp * 0.24)));
      }
      // Hotter thin core along the same path, every third step.
      for (var k = 0; k <= STEPS; k += 3) {
        var s2 = k / STEPS;
        var pt2 = plumePoint(p, s2, t);
        var temp2 = tempAt(p, s2, t);
        var breathe2 = 0.85 + 0.3 * Math.sin(t * 0.007 + p.ph2 + s2 * 3);
        var r2 = p.width * W * (1 - 0.3 * s2) * breathe2 * 0.42;
        drawCircle(pt2.x, pt2.y, r2, hexA(tempColor(clamp(temp2 * 1.25, 0, 1), p.hue), a4(0.1 + temp2 * 0.32)));
      }
    }

    // ---- Bright bands: a horizontal spread of overlapping circles in
    // the center third, with a brighter rust core. Circles are stepped
    // at 0.3 radii so the band's edge is smooth, never beaded, and the
    // alpha tapers toward each end so the band spreads and fades
    // instead of ending abruptly.
    for (var di = 0; di < BANDS.length; di++) {
      var b = BANDS[di];
      var bright = bandB(b, t);
      if (bright <= 0.01) { continue; }
      var cy = b.y * H + Math.sin(t * 0.004 + b.ph) * H * 0.01;
      var cx = b.x * W;
      var hw = b.w * W / 2;
      var glowR = H * 0.085;
      var bandR = H * 0.042;
      var coreR = H * 0.018;
      var gx, u, env;
      for (gx = cx - hw; gx <= cx + hw; gx += glowR * 0.3) {
        u = Math.abs(gx - cx) / hw;
        env = 1 - smooth(0.55, 1.0, u) * 0.7;
        drawCircle(gx, cy, glowR, hexA(EMBER, a4(bright * 0.012 * env)));
      }
      for (gx = cx - hw; gx <= cx + hw; gx += bandR * 0.3) {
        u = Math.abs(gx - cx) / hw;
        env = 1 - smooth(0.55, 1.0, u) * 0.7;
        drawCircle(gx, cy, bandR, hexA(RUST, a4(bright * 0.03 * env)));
      }
      for (gx = cx - hw * 0.9; gx <= cx + hw * 0.9; gx += coreR * 0.3) {
        u = Math.abs(gx - cx) / hw;
        env = 1 - smooth(0.55, 1.0, u) * 0.7;
        drawCircle(gx, cy, coreR, hexA(RUST_BRIGHT, a4(bright * 0.07 * env)));
      }
    }

    // ---- Plates: title top-left, palette note top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(fsTitle * 0.55);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Obsidian', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1937 · 2007 · 05 · 02', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(INK_DIM, 0.9);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('basalt, ember, umber', W - 18, 18 + fsTitle * 0.8);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fsSub * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch only. Slow currents rise.', W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // No interaction: drag does nothing, the process does not negotiate.
  // No click-to-reload anywhere. No pointer handlers are attached.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(baseT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(baseT); });
    }
  } catch (e) {}

  resize();
  draw(baseT); // one synchronous frame at load

  // Motion loop: the field evolves over minutes, so redraws are
  // throttled to four per second; every change is a slow sine with a
  // period of minutes, far under the 14 Hz ceiling. Guarded so
  // node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var lastDraw = 0;
    var loop = function (now) {
      if (now - lastDraw >= 250) {
        lastDraw = now;
        draw(baseT + (now - start) / 1000);
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
