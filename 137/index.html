<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cursor Bloom</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101014; }
  canvas { display:block; touch-action:none; }
  .hint { position:fixed; left:0; right:0; bottom:14px; text-align:center;
    font:12px/1.4 monospace; color:#8a8a96; letter-spacing:0.08em; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">touch to become the fifth cursor</div>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

var LOOP = 40, TRAIL = 12, STEP = 1 / 30, NHIST = Math.floor(TRAIL / STEP);
var HUES = ['#5AF2FF', '#FF3EB5', '#E8FF47'];
var GLYPHS = ['arrow', 'ibeam', 'hand', 'cross'];
var comets = [];
function makeComets() {
  comets = [];
  var defs = [
    { cx: 0.30, cy: 0.34, ax: 0.20, ay: 0.16, fx: 3, fy: 2, px: 0.0, py: 1.3 },
    { cx: 0.68, cy: 0.30, ax: 0.22, ay: 0.20, fx: 2, fy: 3, px: 2.1, py: 0.4 },
    { cx: 0.36, cy: 0.68, ax: 0.24, ay: 0.15, fx: 3, fy: 4, px: 4.0, py: 2.6 },
    { cx: 0.66, cy: 0.66, ax: 0.18, ay: 0.22, fx: 4, fy: 3, px: 1.1, py: 5.0 }
  ];
  for (var i = 0; i < 4; i++) {
    comets.push({ d: defs[i], hue: HUES[i % 3], glyph: GLYPHS[i], hist: [], follow: 0 });
  }
}
function pathPos(d, t) {
  var a = 2 * Math.PI / LOOP;
  return {
    x: W * (d.cx + d.ax * Math.sin(a * d.fx * t + d.px)),
    y: H * (d.cy + d.ay * Math.sin(a * d.fy * t + d.py))
  };
}
var pointer = { active: false, x: 0, y: 0, hist: [], near: -1 };
function simulate(t) {
  for (var i = 0; i < comets.length; i++) {
    var c = comets[i];
    var p = pathPos(c.d, t);
    if (c.follow > 0.01 && pointer.near === i) {
      p = { x: p.x + (pointer.x - p.x) * c.follow * 0.85, y: p.y + (pointer.y - p.y) * c.follow * 0.85 };
    }
    c.hist.push(p);
    if (c.hist.length > NHIST) c.hist.shift();
  }
  if (pointer.active) {
    pointer.hist.push({ x: pointer.x, y: pointer.y });
    if (pointer.hist.length > Math.floor(2.5 / STEP)) pointer.hist.shift();
  } else if (pointer.hist.length) {
    pointer.hist.shift();
  }
}
function preRoll() {
  for (var k = NHIST; k >= 0; k--) simulate(-k * STEP);
}
function drawGlyph(kind, x, y, s, color) {
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, s * 0.12);
  ctx.beginPath();
  if (kind === 'arrow') {
    ctx.moveTo(x, y); ctx.lineTo(x + s * 0.85, y + s * 0.62); ctx.lineTo(x + s * 0.42, y + s * 0.68);
    ctx.lineTo(x + s * 0.62, y + s * 1.15); ctx.lineTo(x + s * 0.42, y + s * 1.22); ctx.lineTo(x + s * 0.22, y + s * 0.78);
    ctx.lineTo(x, y + s * 1.05); ctx.closePath(); ctx.fill();
  } else if (kind === 'ibeam') {
    ctx.moveTo(x - s * 0.4, y); ctx.lineTo(x + s * 0.4, y); ctx.moveTo(x, y); ctx.lineTo(x, y + s * 1.1);
    ctx.moveTo(x - s * 0.4, y + s * 1.1); ctx.lineTo(x + s * 0.4, y + s * 1.1); ctx.stroke();
  } else if (kind === 'hand') {
    ctx.moveTo(x, y + s * 1.05); ctx.lineTo(x, y + s * 0.3); ctx.quadraticCurveTo(x, y, x + s * 0.24, y);
    ctx.lineTo(x + s * 0.3, y + s * 0.42); ctx.lineTo(x + s * 0.52, y + s * 0.36); ctx.lineTo(x + s * 0.56, y + s * 0.62);
    ctx.lineTo(x + s * 0.78, y + s * 0.58); ctx.lineTo(x + s * 0.8, y + s * 1.0); ctx.quadraticCurveTo(x + s * 0.55, y + s * 1.3, x + s * 0.25, y + s * 1.2);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.moveTo(x - s * 0.55, y + s * 0.5); ctx.lineTo(x + s * 0.55, y + s * 0.5);
    ctx.moveTo(x, y); ctx.lineTo(x, y + s);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y + s * 0.5, s * 0.34, 0, Math.PI * 2); ctx.stroke();
  }
}
function drawTrail(hist, color, maxW, alphaMul) {
  var n = hist.length;
  if (n < 2) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (var i = 1; i < n; i++) {
    var p0 = hist[i - 1], p1 = hist[i];
    var dx = p1.x - p0.x, dy = p1.y - p0.y;
    var sp = Math.sqrt(dx * dx + dy * dy);
    var age = i / n;
    var linger = Math.max(0, 1 - sp / (maxW * 1.15));
    var wdt = 1.1 + (maxW - 1.1) * Math.pow(linger, 1.6);
    ctx.strokeStyle = color;
    ctx.globalAlpha = age * age * 0.38 * alphaMul;
    ctx.lineWidth = wdt;
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    if (linger > 0.62) {
      ctx.globalAlpha = age * 0.07 * alphaMul;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(p1.x, p1.y, wdt * 1.7, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function draw() {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#101014'; ctx.fillRect(0, 0, W, H);
  var gs = Math.max(11, Math.min(W, H) * 0.026);
  for (var i = 0; i < comets.length; i++) {
    var c = comets[i];
    drawTrail(c.hist, c.hue, gs * 0.42, 1);
    var head = c.hist[c.hist.length - 1];
    if (head) drawGlyph(c.glyph, head.x - gs * 0.2, head.y - gs * 0.1, gs, '#F2F2F2');
  }
  if (pointer.hist.length > 1) drawTrail(pointer.hist, '#F2F2F2', gs * 0.62, 1);
  if (pointer.active) drawGlyph('arrow', pointer.x - gs * 0.2, pointer.y - gs * 0.1, gs * 1.25, '#FFFFFF');
}
function setPointer(e) {
  var r = { x: e.clientX, y: e.clientY };
  pointer.x = r.x; pointer.y = r.y;
}
canvas.addEventListener('pointerdown', function (e) {
  pointer.active = true; setPointer(e);
  var best = 1e9; pointer.near = -1;
  for (var i = 0; i < comets.length; i++) {
    var h = comets[i].hist[comets[i].hist.length - 1];
    if (!h) continue;
    var d = (h.x - pointer.x) * (h.x - pointer.x) + (h.y - pointer.y) * (h.y - pointer.y);
    if (d < best) { best = d; pointer.near = i; }
  }
});
canvas.addEventListener('pointermove', function (e) { if (pointer.active) setPointer(e); });
function endPointer() { pointer.active = false; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

resize();
makeComets();
preRoll();
var T0 = Date.now(), lastSim = 0;
function frame() {
  var t = (Date.now() - T0) / 1000;
  while (lastSim < t) { lastSim += STEP; simulate(lastSim); }
  for (var i = 0; i < comets.length; i++) {
    var target = (pointer.active && pointer.near === i) ? 1 : 0;
    comets[i].follow += (target - comets[i].follow) * 0.04;
  }
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
draw();
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
