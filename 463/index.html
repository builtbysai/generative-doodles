<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Manager</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5E9C8; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32) ----------
  var seed = 463463;
  function rng() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // ---------- tonal-first composition, palette applied via LUT ----------
  // Tones are grayscale values (0-255) fixed by the composition.
  // Each colorway maps tone roles to flat colors.
  var COLORWAYS = [
    { ground: '#F5E9C8', skin: '#E91E63' },  // magenta on pale yellow
    { ground: '#F2EAD8', skin: '#2B5FE3' },  // cobalt on cream
    { ground: '#EAD9BC', skin: '#1E8A8A' }   // teal on sand
  ];
  var SUIT = '#14141C';
  var SHIRT = '#F7F2E4';
  var INK = '#14141C'; // eyes, mouth, tie knot shade, hint

  function buildLut(colorway) {
    // tone role -> color. The drawing code below only ever asks the LUT.
    return {
      ground: colorway.ground,
      skin: colorway.skin,
      suit: SUIT,
      shirt: SHIRT,
      ink: INK
    };
  }

  // ---------- pose state (seeded) ----------
  function rollPose() {
    return {
      colorway: Math.floor(rng() * 3),
      tilt: (rng() * 2 - 1) * 0.07,        // head tilt, radians (about +/-4 deg)
      tieAngle: (rng() * 2 - 1) * 0.16,    // tie swing, radians
      gesture: Math.floor(rng() * 3),      // 0 none, 1 hand at lapel, 2 hand raised at side
      shoulder: 0.96 + rng() * 0.08,       // shoulder width factor
      headSquash: 0.94 + rng() * 0.1       // head ellipse ry/rx
    };
  }

  // Load-time state is fixed: colorway 0 (magenta on pale yellow), base pose.
  // Roll pose params from the seeded stream but pin the first colorway.
  var pose = rollPose();
  pose.colorway = 0;
  var lut = buildLut(COLORWAYS[0]);

  // ---------- drag parallax (head follows fingertip, +/-6px lag) ----------
  var dragTargetX = 0, dragTargetY = 0;
  var headOffX = 0, headOffY = 0;
  var dragging = false;
  var downX = 0, downY = 0, downTime = 0, moved = false;

  function clamp(v, m) { return v < -m ? -m : (v > m ? m : v); }

  function onDown(x, y) {
    dragging = true; moved = false;
    downX = x; downY = y; downTime = performance.now();
  }
  function onMove(x, y) {
    if (!dragging) return;
    var dx = x - downX, dy = y - downY;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    dragTargetX = clamp(dx * 0.08, 6);
    dragTargetY = clamp(dy * 0.08, 6);
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    var dt = performance.now() - downTime;
    if (!moved && dt < 350) {
      // tap / double-tap: reseed pose + colorway from the seeded stream
      pose = rollPose();
      lut = buildLut(COLORWAYS[pose.colorway]);
    }
    dragTargetX = 0; dragTargetY = 0;
  }

  canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY); });
  canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', function (e) {
    if (e.touches.length) onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', function (e) {
    if (e.touches.length) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  canvas.addEventListener('touchend', onUp);

  // ---------- sizing ----------
  function viewSize() {
    var w, h;
    if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
    else { w = window.innerWidth; h = window.innerHeight; }
    return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
  }
  function isPhone(w, h) {
    var sw = 0, sh = 0;
    if (window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return h > w * 1.15;
  }

  // ---------- drawing ----------
  function draw(now) {
    var s = viewSize();
    var w = s.w, h = s.h;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    // page ground follows the active colorway
    if (document.body && document.body.style) document.body.style.background = lut.ground;

    // ease head parallax toward target (lag)
    headOffX += (dragTargetX - headOffX) * 0.12;
    headOffY += (dragTargetY - headOffY) * 0.12;
    if (Math.abs(headOffX) < 0.01) headOffX = 0;
    if (Math.abs(headOffY) < 0.01) headOffY = 0;

    ctx.fillStyle = lut.ground;
    ctx.fillRect(0, 0, w, h);

    // Composition: head-and-shoulders, centered, figure height = 60% of frame.
    // Frame unit is based on the smaller dimension so the shape holds on phones.
    var unit = Math.min(w, h);
    var figH;
    if (h > w) figH = Math.min(h * 0.62, unit * 1.02);       // portrait: fill more of the tall frame
    else figH = Math.min(h * 0.62, unit * 0.78);             // landscape / square
    var cx = w / 2;
    var baseY = h / 2 + figH * 0.52;      // bottom of the shoulders block
    var headR = figH * 0.20;              // head radius (x)
    var headRy = headR * pose.headSquash;
    var neckTop = baseY - figH * 0.62;
    var headCx = cx + headOffX;
    var headCy = neckTop - headRy * 0.72 + headOffY;

    // ---- shoulders / suit trapezoid ----
    var shW = figH * 0.46 * pose.shoulder;  // half width at base
    var shTopW = figH * 0.155;              // half width at neck
    var shTopY = neckTop + figH * 0.05;
    ctx.fillStyle = lut.suit;
    ctx.beginPath();
    ctx.moveTo(cx - shTopW, shTopY);
    ctx.lineTo(cx + shTopW, shTopY);
    ctx.lineTo(cx + shW, baseY);
    ctx.lineTo(cx - shW, baseY);
    ctx.closePath();
    ctx.fill();

    // ---- shirt triangle ----
    var shirtW = figH * 0.085;
    ctx.fillStyle = lut.shirt;
    ctx.beginPath();
    ctx.moveTo(cx - shirtW, shTopY);
    ctx.lineTo(cx + shirtW, shTopY);
    ctx.lineTo(cx, shTopY + figH * 0.30);
    ctx.closePath();
    ctx.fill();

    // ---- tie (swings by seeded tieAngle) ----
    ctx.save();
    ctx.translate(cx, shTopY + figH * 0.028);
    ctx.rotate(pose.tieAngle);
    ctx.fillStyle = lut.ink;
    var tieW = figH * 0.020;
    ctx.beginPath(); // knot
    ctx.moveTo(-tieW, 0); ctx.lineTo(tieW, 0);
    ctx.lineTo(tieW * 0.7, figH * 0.035); ctx.lineTo(-tieW * 0.7, figH * 0.035);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); // blade
    ctx.moveTo(-tieW * 0.7, figH * 0.035);
    ctx.lineTo(tieW * 0.7, figH * 0.035);
    ctx.lineTo(tieW * 1.15, figH * 0.20);
    ctx.lineTo(0, figH * 0.245);
    ctx.lineTo(-tieW * 1.15, figH * 0.20);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // ---- hand gesture variants (flat, skin hand + suit cuff) ----
    if (pose.gesture === 1) {
      // hand at lapel: cuff wedge + skin ellipse over the chest, left side
      var hx = cx - figH * 0.13, hy = shTopY + figH * 0.17;
      ctx.fillStyle = lut.suit;
      ctx.beginPath();
      ctx.moveTo(hx - figH * 0.055, hy + figH * 0.10);
      ctx.lineTo(hx + figH * 0.03, hy - figH * 0.01);
      ctx.lineTo(hx + figH * 0.075, hy + figH * 0.045);
      ctx.lineTo(hx + figH * 0.005, hy + figH * 0.13);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = lut.skin;
      ctx.beginPath();
      ctx.ellipse(hx, hy, figH * 0.038, figH * 0.052, 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (pose.gesture === 2) {
      // hand raised at the right side, a thick sleeve rising from the shoulder slope
      var rx = cx + shW * 0.86, ry = baseY - figH * 0.34;
      ctx.fillStyle = lut.suit;
      ctx.beginPath();
      ctx.moveTo(cx + shW * 0.42, baseY);
      ctx.lineTo(rx - figH * 0.030, ry + figH * 0.055);
      ctx.lineTo(rx + figH * 0.052, ry + figH * 0.075);
      ctx.lineTo(cx + shW * 0.86, baseY);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = lut.skin;
      ctx.beginPath();
      ctx.ellipse(rx + figH * 0.012, ry, figH * 0.040, figH * 0.058, -0.15, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- neck ----
    ctx.fillStyle = lut.skin;
    var neckW = figH * 0.052;
    ctx.fillRect(headCx - neckW / 2, neckTop - headRy * 0.25, neckW, figH * 0.10);

    // ---- head (tilts by seeded pose tilt, follows drag parallax) ----
    ctx.save();
    ctx.translate(headCx, headCy);
    ctx.rotate(pose.tilt);
    ctx.fillStyle = lut.skin;
    ctx.beginPath();
    ctx.ellipse(0, 0, headR, headRy, 0, 0, Math.PI * 2);
    ctx.fill();
    // ears
    ctx.beginPath();
    ctx.ellipse(-headR * 0.99, headRy * 0.05, headR * 0.13, headRy * 0.20, 0, 0, Math.PI * 2);
    ctx.ellipse(headR * 0.99, headRy * 0.05, headR * 0.13, headRy * 0.20, 0, 0, Math.PI * 2);
    ctx.fill();
    // eyes: two dots, neutral
    ctx.fillStyle = lut.ink;
    var eyeY = -headRy * 0.08, eyeDx = headR * 0.36, eyeR = Math.max(1.6, headR * 0.055);
    ctx.beginPath(); ctx.arc(-eyeDx, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeDx, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
    // mouth: one neutral straight line
    ctx.strokeStyle = lut.ink;
    ctx.lineWidth = Math.max(1.4, headR * 0.045);
    ctx.beginPath();
    ctx.moveTo(-headR * 0.20, headRy * 0.38);
    ctx.lineTo(headR * 0.20, headRy * 0.38);
    ctx.stroke();
    ctx.restore();

    // ---- hint ----
    ctx.fillStyle = 'rgba(20,20,28,0.35)';
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag', 14, h - 14);
  }

  // ---------- loop (typeof-guarded rAF, anchored clock) ----------
  var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var FIXED_OFFSET = 0; // constant phase: the portrait is a still composition
  function frame() {
    var elapsed = ((typeof performance !== 'undefined' && performance.now) ? performance.now() : 0) - startStamp;
    draw(FIXED_OFFSET + elapsed);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { draw(FIXED_OFFSET); });
  window.addEventListener('resize', function () { draw(FIXED_OFFSET); });

  draw(FIXED_OFFSET); // synchronous deterministic first frame
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
