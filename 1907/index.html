<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1907 The Empty Hook</title>
<style>
  html, body { margin: 0; padding: 0; background: #171310; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette from the prompt: dark room, warm wood wall and hook,
  // amber guitar, cool grey electronics desk with red pilot lights,
  // slide lines in pale silver.
  var ROOM = '#171310';       // dark room
  var WALL = '#4a3220';        // warm wood wall
  var WALL_LIT = '#6b4a2f';    // wall inside the spotlight
  var WOOD = '#8a5f36';        // hook and desk edge
  var AMBER = '#d99a3d';       // guitar body
  var AMBER_DEEP = '#a86f24';
  var AMBER_LIT = '#f0b95c';
  var GREY = '#8a9096';        // electronics desk
  var GREY_DARK = '#565c62';
  var GREY_BOX = '#6e747a';
  var RED = '#c93a2e';         // pilot lights
  var SILVER = '#d8dde2';      // slide lines
  var SILVER_DIM = '#9aa2ab';
  var FIGURE = '#2e2a26';      // performer silhouette
  var FIGURE_RIM = '#c98f4e';
  var CREAM = '#e8ddc9';       // plate text
  var CREAM_DIM = '#a89a80';

  // Fixed-phase first frame: t = 90 s. The defection is long complete:
  // the guitar hangs on its hook at upper left, the figure sits at the
  // desk at right, slide lines are in play, and the figure is mid
  // glance-back toward the hook (glance window 84 to 92 s of each
  // 32 s cycle, so t = 90 is three quarters through the glance).
  // All state is a pure function of t, so frame one is byte-reproducible.
  var FIRST_T = 90;
  var GLANCE_CYCLE = 32;       // one glance every 32 s
  var GLANCE_START = 20;       // glance begins 20 s into each cycle
  var GLANCE_LEN = 8;          // glance lasts 8 s

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(u) { return u * u * (3 - 2 * u); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha

  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      // Field-like composition, square on desktop; page ground is the
      // piece's own dark room color.
      stageH = vh * 0.92;
      stageW = Math.min(vw * 0.94, stageH);
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  // Glance amount, 0 to 1, as a pure function of t. Rises, holds, falls.
  function glanceAt(t) {
    var u = (t % GLANCE_CYCLE - GLANCE_START) / GLANCE_LEN;
    if (u < 0 || u > 1) { return 0; }
    if (u < 0.25) { return smooth(u / 0.25); }
    if (u < 0.7) { return 1; }
    return 1 - smooth((u - 0.7) / 0.3);
  }

  // Slow camera pan, tied to the glance: the room drifts a little toward
  // the hook while the figure looks back, then settles.
  function panAt(t) { return glanceAt(t) * -W * 0.018; }

  function drawGuitar(gx, gy, s, t) {
    // The guitar hangs from the hook, lit like a relic. Neck rises to
    // the upper right, body below the hook, strings catching the light.
    var bodyR = 46 * s;
    var bx = gx + 6 * s, by = gy + 92 * s;
    // Warm halo around the instrument.
    var halo = ctx.createRadialGradient(bx, by - 20 * s, 4, bx, by - 20 * s, 150 * s);
    halo.addColorStop(0, hexA(AMBER_LIT, 0.20));
    halo.addColorStop(1, hexA(AMBER_LIT, 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.moveTo(bx + 150 * s, by - 20 * s);
    ctx.arc(bx, by - 20 * s, 150 * s, 0, Math.PI * 2);
    ctx.fill();
    // Neck.
    ctx.strokeStyle = WOOD;
    ctx.lineWidth = 9 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx - 4 * s, by - 34 * s);
    ctx.lineTo(bx + 52 * s, gy + 2 * s);
    ctx.stroke();
    // Headstock.
    ctx.fillStyle = WOOD;
    ctx.beginPath();
    ctx.moveTo(bx + 52 * s, gy + 2 * s);
    ctx.lineTo(bx + 74 * s, gy - 12 * s);
    ctx.lineTo(bx + 68 * s, gy + 6 * s);
    ctx.closePath();
    ctx.fill();
    // Body: two joined lobes, amber with a darker edge. Each arc gets
    // its own moveTo first (node-canvas joins arcs to the prior point).
    ctx.fillStyle = AMBER;
    ctx.beginPath();
    ctx.moveTo(bx + 24 * s, by - 28 * s);
    ctx.ellipse(bx, by - 26 * s, 24 * s, 27 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx + 34 * s, by + 16 * s);
    ctx.ellipse(bx, by + 16 * s, 34 * s, 40 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = hexA(AMBER_DEEP, 0.8);
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.moveTo(bx + 24 * s, by - 26 * s);
    ctx.ellipse(bx, by - 26 * s, 24 * s, 27 * s, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bx + 34 * s, by + 16 * s);
    ctx.ellipse(bx, by + 16 * s, 34 * s, 40 * s, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Sound hole.
    ctx.fillStyle = '#241a10';
    ctx.beginPath();
    ctx.moveTo(bx + 11 * s, by - 6 * s);
    ctx.arc(bx, by - 6 * s, 11 * s, 0, Math.PI * 2);
    ctx.fill();
    // Strings, faint silver, from headstock to the bridge.
    var i, sx0, sy0, sx1, sy1;
    for (i = 0; i < 3; i++) {
      sx0 = bx + 56 * s + i * 3 * s; sy0 = gy + 2 * s - i * 2 * s;
      sx1 = bx - 6 * s + i * 3 * s; sy1 = by + 30 * s;
      ctx.strokeStyle = hexA(SILVER, 0.35 + 0.1 * hash(i + 9));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx0, sy0);
      ctx.lineTo(sx1, sy1);
      ctx.stroke();
    }
    // The three phrases, played once long ago, survive only as faint
    // arcs etched in the light around the body.
    for (i = 0; i < 3; i++) {
      var pr = bodyR + 16 * s + i * 10 * s;
      ctx.strokeStyle = hexA(AMBER_LIT, 0.16 - i * 0.04);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(bx + pr, by - bodyR * 0.1);
      ctx.arc(bx, by - bodyR * 0.1, pr, -Math.PI * 0.28, Math.PI * 0.28);
      ctx.stroke();
    }
  }

  function drawDesk(dx, dy, dw, s, t) {
    // Electronics desk: cool grey boxes, knobs, red pilot lights,
    // a small screen showing the granulated bed.
    var topY = dy;
    // Tabletop.
    ctx.fillStyle = GREY_DARK;
    ctx.fillRect(dx - 10 * s, topY, dw + 20 * s, 10 * s);
    ctx.fillStyle = WOOD;
    ctx.fillRect(dx - 10 * s, topY + 10 * s, dw + 20 * s, 3 * s);
    // Two equipment boxes.
    var i, bx, by, bw, bh;
    for (i = 0; i < 2; i++) {
      bx = dx + i * (dw / 2 + 6 * s);
      by = topY - 52 * s - (i === 1 ? 14 * s : 0);
      bw = dw / 2 - 6 * s; bh = 52 * s + (i === 1 ? 14 * s : 0);
      ctx.fillStyle = GREY_BOX;
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = hexA('#2a2e32', 0.7);
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, bh);
      // Knobs.
      var k;
      for (k = 0; k < 4; k++) {
        var kx = bx + 12 * s + k * ((bw - 24 * s) / 3);
        ctx.fillStyle = GREY_DARK;
        ctx.beginPath();
        ctx.moveTo(kx + 4 * s, by + 16 * s);
        ctx.arc(kx, by + 16 * s, 4 * s, 0, Math.PI * 2);
        ctx.fill();
      }
      // Pilot light: slow, quantized blink, never faster than 1 Hz.
      var blink = (Math.floor(t / 2) + i * 3) % 3 !== 0;
      ctx.fillStyle = blink ? RED : hexA(RED, 0.25);
      ctx.beginPath();
      ctx.moveTo(bx + bw - 12 * s + 3 * s, by + 14 * s);
      ctx.arc(bx + bw - 12 * s, by + 14 * s, 3 * s, 0, Math.PI * 2);
      ctx.fill();
      if (blink) {
        var glow = ctx.createRadialGradient(bx + bw - 12 * s, by + 14 * s, 1, bx + bw - 12 * s, by + 14 * s, 12 * s);
        glow.addColorStop(0, hexA(RED, 0.35));
        glow.addColorStop(1, hexA(RED, 0));
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.moveTo(bx + bw - 12 * s + 12 * s, by + 14 * s);
        ctx.arc(bx + bw - 12 * s, by + 14 * s, 12 * s, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // Small screen: the granulated bed as a low waveform, resting on
    // the left equipment box.
    var sx = dx + 8 * s, sy = topY - 52 * s - 30 * s, sw = dw * 0.42, sh = 30 * s;
    ctx.fillStyle = '#10181c';
    ctx.fillRect(sx, sy, sw, sh);
    ctx.strokeStyle = hexA(SILVER, 0.8);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    var p;
    for (p = 0; p <= 40; p++) {
      var px = sx + (p / 40) * sw;
      var py = sy + sh / 2 + Math.sin(p * 0.9 + t * 0.6) * (3 + 5 * hash(p)) * s;
      if (p === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
    // Desk leg at the left end, down to the floor.
    ctx.fillStyle = GREY_DARK;
    ctx.fillRect(dx - 6 * s, topY + 13 * s, 6 * s, H * 0.86 - topY - 13 * s);
    // Slide guitar leaning against the desk leg, silent now.
    ctx.strokeStyle = WOOD;
    ctx.lineWidth = 6 * s;
    ctx.beginPath();
    ctx.moveTo(dx + dw - 4 * s, topY + 10 * s);
    ctx.lineTo(dx + dw + 14 * s, H * 0.86);
    ctx.stroke();
  }

  function drawFigure(fx, baseY, s, t, glance) {
    // Seated at the desk, facing right toward the electronics. During a
    // glance the head turns left, back toward the hook.
    var breathe = 1 + 0.012 * Math.sin(t * 0.3);
    var headR = 14 * s * breathe;
    var headY = baseY - 108 * s;
    var shoulderY = baseY - 86 * s;
    var hipY = baseY - 8 * s;
    // Torso, leaning slightly toward the desk.
    ctx.fillStyle = FIGURE;
    ctx.beginPath();
    ctx.moveTo(fx - 22 * s, shoulderY);
    ctx.quadraticCurveTo(fx - 28 * s, (shoulderY + hipY) / 2, fx - 24 * s, hipY);
    ctx.lineTo(fx + 24 * s, hipY);
    ctx.quadraticCurveTo(fx + 28 * s, (shoulderY + hipY) / 2, fx + 20 * s, shoulderY);
    ctx.quadraticCurveTo(fx, shoulderY - 12 * s, fx - 22 * s, shoulderY);
    ctx.closePath();
    ctx.fill();
    // Warm rim light on the shoulder, from the guitar side.
    ctx.strokeStyle = hexA(FIGURE_RIM, 0.7);
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.moveTo(fx - 21 * s, shoulderY + 6 * s);
    ctx.quadraticCurveTo(fx - 26 * s, (shoulderY + hipY) / 2, fx - 23 * s, hipY - 10 * s);
    ctx.stroke();
    // Head: turns left with the glance.
    var hx = fx + 4 * s - glance * 12 * s;
    ctx.fillStyle = FIGURE;
    ctx.beginPath();
    ctx.moveTo(hx + headR, headY);
    ctx.arc(hx, headY, headR, 0, Math.PI * 2);
    ctx.fill();
    // Gaze line toward the hook during the glance.
    if (glance > 0.15) {
      ctx.strokeStyle = hexA(SILVER, a4(0.35 * glance));
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(hx - headR, headY);
      ctx.lineTo(hx - W * 0.34, headY - H * 0.06);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // Arm reaching to the desk controls.
    var handX = fx + 40 * s, handY = shoulderY + 34 * s;
    ctx.strokeStyle = FIGURE;
    ctx.lineWidth = 6 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(fx + 14 * s, shoulderY + 12 * s);
    ctx.quadraticCurveTo(fx + 32 * s, shoulderY + 20 * s, handX, handY);
    ctx.stroke();
    return { handX: handX, handY: handY };
  }

  function drawSlideLines(x0, x1, yBase, s, t) {
    // Pale silver glissando lines with random dropouts: each line is
    // drawn as short segments, and a segment is skipped when its
    // deterministic hash falls below the dropout threshold at this t.
    var li, seg, px, py, drop;
    for (li = 0; li < 3; li++) {
      var y = yBase + (li - 1) * 26 * s;
      var drift = Math.sin(t * 0.25 + li * 2.1) * 10 * s;
      var amp = (14 + li * 8) * s;
      ctx.strokeStyle = hexA(li === 1 ? SILVER : SILVER_DIM, li === 1 ? 0.85 : 0.55);
      ctx.lineWidth = li === 1 ? 1.8 : 1.2;
      for (seg = 0; seg < 46; seg++) {
        var u0 = seg / 46, u1 = (seg + 1) / 46;
        drop = hash(li * 100 + seg * 7 + Math.floor(t / 3) * 13);
        if (drop < 0.16) { continue; }
        var ax = lerp(x0, x1, u0);
        var ay = y + Math.sin(u0 * Math.PI * 2.2 + t * 0.35 + li) * amp + drift * u0;
        var bx2 = lerp(x0, x1, u1);
        var by2 = y + Math.sin(u1 * Math.PI * 2.2 + t * 0.35 + li) * amp + drift * u1;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx2, by2);
        ctx.stroke();
      }
    }
  }

  function drawGranules(gx, gy, dx, dy, s, t) {
    // Granulated memories of the three phrases: small amber dots
    // drifting from the hook toward the desk, fading as they arrive.
    var i, u, px, py, al;
    for (i = 0; i < 36; i++) {
      u = (hash(i * 3 + 1) + t * 0.008 * (0.5 + hash(i * 5 + 2))) % 1;
      var arc = Math.sin(u * Math.PI) * H * 0.10;
      px = lerp(gx + 30 * s, dx, u) + Math.sin(i * 2.7 + t * 0.4) * 6 * s;
      py = lerp(gy + 90 * s, dy - 40 * s, u) - arc;
      al = a4(0.10 + 0.45 * (1 - u) * (0.5 + 0.5 * Math.sin(t * 0.8 + i)));
      ctx.fillStyle = hexA(AMBER_LIT, al);
      ctx.beginPath();
      ctx.moveTo(px + 2.2 * s, py);
      ctx.arc(px, py, 2.2 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var glance = glanceAt(t);
    var pan = panAt(t);

    // Dark room.
    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(pan, 0);

    var s = clamp(Math.min(W, H) / 560, 0.6, 1.25);
    var floorY = H * 0.86;

    // Wood wall, left two thirds; darker room to the right.
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W * 0.62, floorY);
    // Wall boards.
    var b;
    for (b = 0; b < 6; b++) {
      ctx.strokeStyle = hexA('#2e1f12', 0.5);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo((b + 1) * W * 0.103, 0);
      ctx.lineTo((b + 1) * W * 0.103, floorY);
      ctx.stroke();
    }
    // Spotlight cone from above onto the guitar.
    var hookX = W * 0.17, hookY = H * 0.26;
    var cone = ctx.createLinearGradient(hookX, 0, hookX, H * 0.62);
    cone.addColorStop(0, hexA(AMBER_LIT, 0.14));
    cone.addColorStop(1, hexA(AMBER_LIT, 0));
    ctx.fillStyle = cone;
    ctx.beginPath();
    ctx.moveTo(hookX - 12 * s, 0);
    ctx.lineTo(hookX + 12 * s, 0);
    ctx.lineTo(hookX + 120 * s, H * 0.62);
    ctx.lineTo(hookX - 90 * s, H * 0.62);
    ctx.closePath();
    ctx.fill();
    // Lit patch of wall behind the guitar.
    ctx.fillStyle = hexA(WALL_LIT, 0.35);
    ctx.fillRect(hookX - 78 * s, H * 0.16, 190 * s, H * 0.46);

    // Floor.
    ctx.fillStyle = '#241c15';
    ctx.fillRect(0, floorY, W, H - floorY);
    ctx.strokeStyle = hexA('#3a2c1e', 0.8);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, floorY);
    ctx.lineTo(W, floorY);
    ctx.stroke();

    // The hook: a small wooden peg on the wall.
    ctx.fillStyle = WOOD;
    ctx.fillRect(hookX - 4 * s, hookY - 8 * s, 8 * s, 16 * s);
    ctx.beginPath();
    ctx.moveTo(hookX + 4 * s, hookY - 4 * s);
    ctx.arc(hookX + 10 * s, hookY - 2 * s, 5 * s, -Math.PI / 2, Math.PI * 0.55);
    ctx.fill();

    // The guitar, on its hook, where it stays.
    drawGuitar(hookX, hookY, s, t);

    // Desk and electronics at right.
    var deskX = W * 0.60, deskW = W * 0.34, deskY = H * 0.66;
    drawDesk(deskX, deskY, deskW, s, t);

    // The figure, seated at the desk.
    var fig = drawFigure(deskX - 26 * s, floorY, s, t, glance);

    // Slide lines in play between the desk and the room.
    drawSlideLines(W * 0.42, W * 0.94, H * 0.44, s, t);

    // Granulated memories drifting from hook to desk.
    drawGranules(hookX, hookY, deskX, deskY, s, t);

    ctx.restore();

    // Title plate, drawn on the canvas, top-left, clear of the hook.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 640, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = CREAM;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Empty Hook', 18, 34);
    ctx.fillStyle = CREAM_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1907 · 2007 · 04 · 02', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(CREAM_DIM, 0.9);
    ctx.fillText('Watch the guitar stay.', 18, H - 20);
  }

  // Watch only: no pointer, touch, or key handlers. Nothing picks the
  // guitar up again, nothing scrubs the story, nothing reloads.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
