<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.298 Flash Drop</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F7EFE0; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.298 Flash Drop (Ruby Waters).
// A tattoo flash sheet inked live on cream paper. A 3 by 3 grid
// holds nine creature motifs in reading order: puffer, daruma,
// cat, koi, chrysanthemum, hannya, Mt Fuji, horse, boar. Each
// cell runs outline, flat colour flood, then a detail pass, one
// cell every four seconds. After all nine the sheet holds for
// six seconds, then washes back to bare outlines over six
// seconds. The loop is 48 seconds and watch-only.
// Outline reveal is a real stroke-dash reveal: each outline
// path is stroked with a dash length set from its measured
// path length. Fill is data-only: each fill region is a flat
// path clipped first to its motif silhouette and then to an
// expanding circle centred on the motif. All marks are path
// data drawn each frame, and there is no text in the piece.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F7EFE0', INK = '#141414', VERM = '#D23A2A';
var COBALT = '#2B5EA7', YELLOW = '#E8B93B', MINT = '#7FD1B9';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 48, HOLD0 = 36, HOLD1 = 42;
var T = 10.25, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function ease(p) { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); }
function ell(cx, cy, rx, ry, n, a0, a1) {
  n = n || 36; a0 = a0 || 0; a1 = (a1 === undefined ? Math.PI * 2 : a1);
  var pts = [];
  for (var i = 0; i <= n; i++) {
    var a = a0 + (a1 - a0) * i / n;
    pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
  }
  return pts;
}
function poly(pts) { return pts; }
function pathFrom(pts, close) {
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  if (close) ctx.closePath();
}
function pathLen(pts, close) {
  var L = 0;
  for (var i = 1; i < pts.length; i++) {
    var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
    L += Math.sqrt(dx * dx + dy * dy);
  }
  if (close && pts.length > 2) {
    var ex = pts[0][0] - pts[pts.length - 1][0], ey = pts[0][1] - pts[pts.length - 1][1];
    L += Math.sqrt(ex * ex + ey * ey);
  }
  return L;
}

// ---- motif construction -------------------------------------------
// Local space per motif: 200 wide, 150 tall, centre (100, 75).
// A motif is { name, sils, fills, lines, details } where sils are
// closed silhouette paths, fills are { c, pts, si } flat regions
// clipped to sils[si], lines are extra open outline paths, and
// details are small primitives drawn in the final pass.
function spiky() {
  var pts = [];
  for (var i = 0; i < 60; i++) {
    var a = i / 60 * Math.PI * 2;
    var f = (i % 5 === 0) ? 1.16 : 0.97;
    pts.push([100 + Math.cos(a) * 68 * f, 75 + Math.sin(a) * 52 * f]);
  }
  return pts;
}
function scallop() {
  var pts = [];
  for (var i = 0; i <= 72; i++) {
    var a = i / 72 * Math.PI * 2;
    var r = 62 + Math.sin(a * 12) * 7;
    pts.push([100 + Math.cos(a) * r, 75 + Math.sin(a) * r * 0.92]);
  }
  return pts;
}
function petal(cx, cy, ang, len, wid) {
  var pts = [], n = 10, i, a, d, w;
  for (i = 0; i <= n; i++) {
    d = i / n; w = Math.sin(d * Math.PI) * wid;
    a = ang + Math.PI / 2;
    pts.push([cx + Math.cos(ang) * d * len + Math.cos(a) * w, cy + Math.sin(ang) * d * len + Math.sin(a) * w]);
  }
  for (i = n; i >= 0; i--) {
    d = i / n; w = Math.sin(d * Math.PI) * wid;
    a = ang - Math.PI / 2;
    pts.push([cx + Math.cos(ang) * d * len + Math.cos(a) * w, cy + Math.sin(ang) * d * len + Math.sin(a) * w]);
  }
  return pts;
}
function koiBody() {
  var pts = [], i, t, x, cy, half;
  for (i = 0; i <= 20; i++) {
    t = i / 20; x = 34 + t * 138; cy = 80 - t * 8;
    half = 7 + Math.sin(t * Math.PI) * 25 * (0.55 + 0.45 * t);
    pts.push([x, cy - half]);
  }
  for (i = 20; i >= 0; i--) {
    t = i / 20; x = 34 + t * 138; cy = 80 - t * 8;
    half = 7 + Math.sin(t * Math.PI) * 25 * (0.55 + 0.45 * t);
    pts.push([x, cy + half]);
  }
  return pts;
}
var motifs = [];
(function () {
  var r = rng(298114);
  // 1 puffer
  (function () {
    var dots = [];
    for (var i = 0; i < 9; i++) dots.push({ k: 'dot', x: 62 + r() * 62, y: 48 + r() * 44, r: 3, c: INK });
    motifs.push({
      name: 'puffer', sils: [spiky()],
      fills: [
        { c: YELLOW, pts: spiky(), si: 0 },
        { c: MINT, pts: ell(100, 104, 52, 24, 28, 0, Math.PI), si: 0 },
        { c: COBALT, pts: poly([[168, 75], [190, 60], [190, 92]]), si: 0 }
      ],
      lines: [ell(76, 96, 20, 10, 16, 0.2, Math.PI - 0.2)],
      details: [{ k: 'dot', x: 66, y: 62, r: 6, c: INK }, { k: 'ring', x: 66, y: 62, r: 11, c: INK, w: 3 },
        { k: 'line', pts: [[52, 84], [60, 88], [52, 92]], c: INK, w: 3 }].concat(dots)
    });
  })();
  // 2 daruma
  motifs.push({
    name: 'daruma', sils: [ell(100, 78, 62, 58)],
    fills: [
      { c: VERM, pts: ell(100, 78, 62, 58), si: 0 },
      { c: PAPER, pts: ell(100, 66, 38, 30), si: 0 },
      { c: YELLOW, pts: ell(100, 112, 30, 16), si: 0 }
    ],
    lines: [ell(100, 66, 38, 30), ell(100, 112, 30, 16)],
    details: [
      { k: 'dot', x: 84, y: 62, r: 6, c: INK }, { k: 'dot', x: 116, y: 62, r: 6, c: INK },
      { k: 'line', pts: [[70, 46], [92, 50]], c: INK, w: 4 }, { k: 'line', pts: [[108, 50], [130, 46]], c: INK, w: 4 },
      { k: 'line', pts: [[90, 82], [110, 82]], c: INK, w: 4 },
      { k: 'line', pts: [[86, 108], [114, 108]], c: VERM, w: 3 }
    ]
  });
  // 3 cat
  motifs.push({
    name: 'cat',
    sils: [ell(100, 96, 52, 42), ell(100, 48, 36, 30),
      poly([[70, 30], [76, 6], [94, 22]]), poly([[106, 22], [124, 6], [130, 30]]),
      ell(144, 60, 12, 21)],
    fills: [
      { c: YELLOW, pts: ell(100, 96, 52, 42), si: 0 }, { c: YELLOW, pts: ell(100, 48, 36, 30), si: 1 },
      { c: YELLOW, pts: poly([[70, 30], [76, 6], [94, 22]]), si: 2 }, { c: YELLOW, pts: poly([[106, 22], [124, 6], [130, 30]]), si: 3 },
      { c: VERM, pts: poly([[74, 26], [77, 13], [89, 22]]), si: 2 }, { c: VERM, pts: poly([[111, 22], [123, 13], [126, 26]]), si: 3 },
      { c: VERM, pts: ell(100, 84, 42, 11), si: 0 },
      { c: MINT, pts: ell(144, 60, 12, 21), si: 4 }
    ],
    lines: [ell(100, 84, 42, 11)],
    details: [
      { k: 'dot', x: 86, y: 46, r: 4.5, c: INK }, { k: 'dot', x: 114, y: 46, r: 4.5, c: INK },
      { k: 'dot', x: 100, y: 56, r: 3, c: VERM },
      { k: 'line', pts: [[90, 64], [110, 64]], c: INK, w: 3 },
      { k: 'dot', x: 100, y: 90, r: 7, c: YELLOW },
      { k: 'line', pts: [[58, 110], [84, 116]], c: INK, w: 3 }, { k: 'line', pts: [[116, 116], [142, 110]], c: INK, w: 3 }
    ]
  });
  // 4 koi
  motifs.push({
    name: 'koi', sils: [koiBody(), poly([[36, 68], [12, 48], [16, 76], [12, 104], [38, 88]])],
    fills: [
      { c: PAPER, pts: koiBody(), si: 0 },
      { c: VERM, pts: ell(78, 60, 25, 15), si: 0 }, { c: COBALT, pts: ell(120, 82, 21, 12), si: 0 },
      { c: YELLOW, pts: ell(150, 62, 13, 9), si: 0 },
      { c: MINT, pts: poly([[36, 68], [12, 48], [16, 76], [12, 104], [38, 88]]), si: 1 }
    ],
    lines: [ell(62, 68, 14, 19, 16, -1.1, 1.1), ell(100, 72, 18, 21, 16, -1.1, 1.1), ell(136, 74, 14, 17, 14, -1.1, 1.1)],
    details: [
      { k: 'dot', x: 158, y: 66, r: 5, c: INK }, { k: 'ring', x: 158, y: 66, r: 9, c: INK, w: 2.5 },
      { k: 'dot', x: 88, y: 56, r: 3, c: INK }, { k: 'dot', x: 110, y: 88, r: 3, c: INK }, { k: 'dot', x: 134, y: 58, r: 3, c: INK }
    ]
  });
  // 5 chrysanthemum
  (function () {
    var fills = [{ c: YELLOW, pts: scallop(), si: 0 }], lines = [], i, a;
    for (i = 0; i < 12; i++) {
      a = i / 12 * Math.PI * 2;
      fills.push({ c: (i % 2 ? VERM : YELLOW), pts: petal(100, 75, a, 58, 11), si: 0 });
      lines.push(petal(100, 75, a, 52, 7));
    }
    motifs.push({
      name: 'chrysanthemum', sils: [scallop()], fills: fills, lines: lines,
      details: [{ k: 'dot', x: 100, y: 75, r: 10, c: VERM }, { k: 'ring', x: 100, y: 75, r: 16, c: INK, w: 2.5 },
        { k: 'dot', x: 92, y: 70, r: 2.5, c: INK }, { k: 'dot', x: 108, y: 80, r: 2.5, c: INK }]
    });
  })();
  // 6 hannya
  motifs.push({
    name: 'hannya',
    sils: [poly([[100, 138], [62, 118], [54, 66], [64, 30], [100, 20], [136, 30], [146, 66], [138, 118]]),
      poly([[64, 32], [52, 4], [78, 18]]), poly([[136, 32], [148, 4], [122, 18]])],
    fills: [
      { c: PAPER, pts: poly([[100, 138], [62, 118], [54, 66], [64, 30], [100, 20], [136, 30], [146, 66], [138, 118]]), si: 0 },
      { c: YELLOW, pts: poly([[64, 32], [52, 4], [78, 18]]), si: 1 }, { c: YELLOW, pts: poly([[136, 32], [148, 4], [122, 18]]), si: 2 },
      { c: VERM, pts: ell(100, 106, 26, 12), si: 0 }
    ],
    lines: [ell(100, 106, 26, 12)],
    details: [
      { k: 'dot', x: 78, y: 62, r: 5, c: INK }, { k: 'dot', x: 122, y: 62, r: 5, c: INK },
      { k: 'line', pts: [[62, 48], [90, 56]], c: INK, w: 5 }, { k: 'line', pts: [[110, 56], [138, 48]], c: INK, w: 5 },
      { k: 'line', pts: [[84, 100], [84, 112]], c: PAPER, w: 3 }, { k: 'line', pts: [[100, 100], [100, 114]], c: PAPER, w: 3 },
      { k: 'line', pts: [[116, 100], [116, 112]], c: PAPER, w: 3 },
      { k: 'line', pts: [[70, 84], [86, 88]], c: VERM, w: 3 }, { k: 'line', pts: [[114, 88], [130, 84]], c: VERM, w: 3 }
    ]
  });
  // 7 Mt Fuji
  motifs.push({
    name: 'fuji',
    sils: [poly([[100, 22], [150, 78], [182, 122], [18, 122], [50, 78]]), ell(164, 34, 17, 17)],
    fills: [
      { c: COBALT, pts: poly([[100, 22], [150, 78], [182, 122], [18, 122], [50, 78]]), si: 0 },
      { c: PAPER, pts: poly([[100, 22], [122, 50], [110, 56], [100, 48], [90, 56], [78, 50]]), si: 0 },
      { c: MINT, pts: poly([[18, 122], [182, 122], [166, 104], [34, 104]]), si: 0 },
      { c: VERM, pts: ell(164, 34, 17, 17), si: 1 }
    ],
    lines: [poly([[78, 50], [90, 56], [100, 48], [110, 56], [122, 50]])],
    details: [
      { k: 'line', pts: [[52, 96], [84, 88]], c: PAPER, w: 3 }, { k: 'line', pts: [[116, 88], [148, 96]], c: PAPER, w: 3 },
      { k: 'dot', x: 64, y: 112, r: 3, c: INK }, { k: 'dot', x: 100, y: 114, r: 3, c: INK }, { k: 'dot', x: 136, y: 112, r: 3, c: INK }
    ]
  });
  // 8 horse
  (function () {
    var body = poly([[14, 42], [26, 26], [36, 12], [44, 24], [58, 32], [70, 38], [148, 38], [170, 52], [172, 70],
      [166, 86], [166, 122], [152, 122], [150, 90], [110, 90], [108, 122], [94, 122], [92, 90],
      [64, 86], [54, 68], [38, 60], [20, 56], [12, 50]]);
    motifs.push({
      name: 'horse', sils: [body],
      fills: [
        { c: YELLOW, pts: body, si: 0 },
        { c: VERM, pts: poly([[36, 14], [48, 24], [70, 38], [64, 52], [46, 38], [34, 28]]), si: 0 },
        { c: MINT, pts: poly([[96, 46], [132, 46], [132, 72], [96, 72]]), si: 0 },
        { c: VERM, pts: poly([[170, 52], [188, 66], [182, 96], [168, 78]]), si: 0 },
        { c: COBALT, pts: poly([[92, 90], [110, 90], [110, 100], [92, 100]]), si: 0 }
      ],
      lines: [poly([[96, 46], [132, 46], [132, 72], [96, 72]])],
      details: [
        { k: 'dot', x: 32, y: 36, r: 4, c: INK }, { k: 'dot', x: 19, y: 47, r: 2.5, c: INK },
        { k: 'line', pts: [[94, 118], [110, 118]], c: INK, w: 4 }, { k: 'line', pts: [[150, 118], [166, 118]], c: INK, w: 4 },
        { k: 'dot', x: 114, y: 59, r: 5, c: VERM }
      ]
    });
  })();
  // 9 boar
  motifs.push({
    name: 'boar',
    sils: [ell(112, 80, 64, 44), ell(48, 86, 24, 21), poly([[78, 42], [88, 18], [102, 38]]), poly([[122, 36], [138, 16], [144, 40]])],
    fills: [
      { c: YELLOW, pts: ell(112, 80, 64, 44), si: 0 }, { c: PAPER, pts: ell(48, 86, 24, 21), si: 1 },
      { c: VERM, pts: poly([[80, 44], [90, 24], [100, 40]]), si: 2 }, { c: VERM, pts: poly([[124, 38], [136, 22], [142, 40]]), si: 3 },
      { c: VERM, pts: ell(128, 62, 30, 10, 24, 0.2, Math.PI - 0.4), si: 0 }
    ],
    lines: [ell(150, 80, 18, 26, 18, -1.2, 1.2)],
    details: [
      { k: 'dot', x: 96, y: 66, r: 5, c: INK }, { k: 'dot', x: 42, y: 82, r: 3.5, c: INK }, { k: 'dot', x: 54, y: 82, r: 3.5, c: INK },
      { k: 'line', pts: [[58, 98], [68, 108], [62, 114]], c: PAPER, w: 4 },
      { k: 'line', pts: [[84, 118], [84, 128]], c: INK, w: 5 }, { k: 'line', pts: [[140, 118], [140, 128]], c: INK, w: 5 },
      { k: 'line', pts: [[108, 96], [150, 96]], c: VERM, w: 3 }
    ]
  });
})();
if (motifs.length !== 9) throw new Error('Flash Drop needs exactly 9 motifs, got ' + motifs.length);
var ORDER = ['puffer', 'daruma', 'cat', 'koi', 'chrysanthemum', 'hannya', 'fuji', 'horse', 'boar'];
for (var oi = 0; oi < 9; oi++) {
  if (motifs[oi].name !== ORDER[oi]) throw new Error('motif order broken at ' + oi);
}

// ---- per-cell state from the 48 second loop -------------------------
function cellState(i, lt48) {
  if (lt48 >= HOLD0 && lt48 < HOLD1) return { o: 1, f: 1, d: 1, bare: false };
  if (lt48 >= HOLD1) {
    var w = ease((lt48 - HOLD1) / 6);
    return { o: 1, f: 1 - w, d: clamp(((1 - w) - 0.45) / 0.55, 0, 1), bare: w > 0.85 };
  }
  var lt = lt48 - i * 4;
  if (lt < 0) return { o: 1, f: 0, d: 0, bare: true };
  if (lt < 1.4) return { o: ease(lt / 1.4), f: 0, d: 0, bare: false };
  if (lt < 3.2) return { o: 1, f: ease((lt - 1.4) / 1.8), d: 0, bare: false };
  if (lt < 4) return { o: 1, f: 1, d: ease((lt - 3.2) / 0.8), bare: false };
  return { o: 1, f: 1, d: 1, bare: false };
}

function strokeDashReveal(pts, close, budget) {
  var L = pathLen(pts, close);
  if (L <= 0 || budget <= 0) return 0;
  var vis = clamp(budget, 0, L);
  ctx.save();
  if (typeof ctx.setLineDash === 'function') ctx.setLineDash([vis, L + 16]);
  pathFrom(pts, close);
  ctx.stroke();
  if (typeof ctx.setLineDash === 'function') ctx.setLineDash([]);
  ctx.restore();
  return L;
}
function drawDetail(d) {
  ctx.fillStyle = d.c; ctx.strokeStyle = d.c;
  if (d.k === 'dot') { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); }
  else if (d.k === 'ring') { ctx.lineWidth = d.w || 3; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.stroke(); }
  else if (d.k === 'line') {
    ctx.lineWidth = d.w || 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    pathFrom(d.pts, false); ctx.stroke();
  }
}
function drawMotif(m, st) {
  var cx = 100, cy = 75, i, f;
  // fills: silhouette clip, then expanding circle clip, then flat path
  if (st.f > 0) {
    if (!m.maxR) {
      var mr = 0, mi, mj, mdx, mdy, md;
      for (mi = 0; mi < m.sils.length; mi++) {
        for (mj = 0; mj < m.sils[mi].length; mj++) {
          mdx = m.sils[mi][mj][0] - 100; mdy = m.sils[mi][mj][1] - 75;
          md = Math.sqrt(mdx * mdx + mdy * mdy);
          if (md > mr) mr = md;
        }
      }
      m.maxR = mr;
    }
    var rad = st.f * m.maxR * 1.03;
    for (i = 0; i < m.fills.length; i++) {
      f = m.fills[i];
      ctx.save();
      pathFrom(m.sils[f.si || 0], true); ctx.clip();
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.clip();
      pathFrom(f.pts, true); ctx.fillStyle = f.c; ctx.fill();
      ctx.restore();
    }
  }
  // outlines
  ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var paths = [];
  for (i = 0; i < m.sils.length; i++) paths.push({ pts: m.sils[i], close: true });
  for (i = 0; i < m.lines.length; i++) paths.push({ pts: m.lines[i], close: false });
  if (st.bare) {
    ctx.lineWidth = 2;
    for (i = 0; i < paths.length; i++) { pathFrom(paths[i].pts, paths[i].close); ctx.stroke(); }
  } else {
    ctx.lineWidth = 5;
    var total = 0;
    for (i = 0; i < paths.length; i++) total += pathLen(paths[i].pts, paths[i].close);
    var budget = st.o * total, used = 0;
    for (i = 0; i < paths.length; i++) {
      if (budget - used <= 0) break;
      used += strokeDashReveal(paths[i].pts, paths[i].close, budget - used);
    }
  }
  // detail pass
  if (st.d > 0) {
    var n = Math.ceil(st.d * m.details.length);
    for (i = 0; i < n && i < m.details.length; i++) drawDetail(m.details[i]);
  }
}

function stepSim() { T += TICK; }

function draw() {
  var lt48 = T % LOOP;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, DW, DH);
  var gx = 130, gy = 90, cw = 340, ch = 240, col, row, i;
  for (row = 0; row < 3; row++) {
    for (col = 0; col < 3; col++) {
      i = row * 3 + col;
      ctx.save();
      ctx.translate(gx + col * cw + 70, gy + row * ch + 45);
      drawMotif(motifs[i], cellState(i, lt48));
      ctx.restore();
    }
  }
  // thin black rules over the sheet
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.strokeRect(gx, gy, cw * 3, ch * 3);
  ctx.beginPath();
  for (i = 1; i < 3; i++) {
    ctx.moveTo(gx + i * cw, gy); ctx.lineTo(gx + i * cw, gy + ch * 3);
    ctx.moveTo(gx, gy + i * ch); ctx.lineTo(gx + cw * 3, gy + i * ch);
  }
  ctx.stroke();
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the sheet keeps its shape, page ground is paper
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
