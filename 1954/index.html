<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1954 Considered Return</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a120b; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Considered Return, TC3 / PP1201, study #255 tom-challenger.
  // A long tape strip of an improvisation scrolls slowly and the
  // played line glows gold along it. Behind it a second layer:
  // the same gestures stretched, folded, reversed by an invisible
  // editor, in cold blue, ghosting above the strip. Two time
  // layers interfere: the played moment and the returned-to
  // moment. Tap a moment on the strip to send it to the editor:
  // it gets stretched or folded into the blue layer. Tap is the
  // edit decision, not a reseed; the strip never restarts.
  var INK = '#f2e8d5';      // plate ink, warm off-white on dark ground
  var INK_DIM = '#c9b896';  // muted plate ink
  var GROUND_TOP = '#2a1d12'; // page ground, top
  var GROUND_BOT = '#1a120b'; // page ground, bottom
  var TAPE = '#7a5636';     // tape brown, strip body
  var TAPE_DK = '#5d3f24';  // tape brown, dark edge and holes
  var TAPE_LT = '#8f6c42';  // tape brown, light edge
  var GOLD = '#e8b23a';     // played gold, the played line
  var GOLD_LT = '#f6cf6e';  // played gold, bright core
  var ICE = '#7fc4e8';      // edited ice blue, ghost layer
  var ICE_LT = '#b5ddf2';   // edited ice blue, bright core
  var WHITE = '#ffffff';    // playhead white
  var PILL = '#e8dcc8';     // hint pill, pale parchment
  var PILL_INK = '#2b2118'; // hint ink, dark brown

  // Fixed-phase first frame: FIRST_T = 10 s. At t = 10 the tape
  // has scrolled 0.15 of a cycle, the playhead sits at gesture
  // position 0.77, and two edits are already in the blue layer:
  // a stretch at 0.30 and a fold at 0.62, so the edit lags 1.8 s
  // behind the playhead and the piece reads at once.
  var FIRST_T = 10;
  var SEED = 1954;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load,
  // ?edit=<x>:<y> sends the moment at normalized (x, y) to the
  // editor at load (y must fall on the strip), ?seed= varies the
  // texture seed. Read at load only.
  var seedParam = 0, probeT = null, probeEdit = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = qs.match(/[?&]seed=(-?\d+)/); if (m) { seedParam = parseInt(m[1], 10) || 0; }
    var mt = qs.match(/[?&]t=([0-9.]+)/); if (mt) { probeT = parseFloat(mt[1]); }
    var me = qs.match(/[?&]edit=([0-9.]+):([0-9.]+)/); if (me) { probeEdit = { x: parseFloat(me[1]), y: parseFloat(me[2]) }; }
  } catch (e) {}
  var FIELD_SEED = seedParam ? (SEED + seedParam * 101) : SEED;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and a fixed salt, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The improvisation: a closed-form gesture, a sum of three
  // sines over one cycle of tape. The strip shows one full cycle,
  // twelve seconds of playing, and the tape scrolls at 0.015
  // cycles per second, so the line drifts slowly left under the
  // fixed playhead.
  var TAPE_SECONDS = 12;
  var SCROLL = 0.015;
  var PLAYHEAD_X = 0.62;
  var STRIP_TOP = 0.36, STRIP_BOT = 0.64;
  var GHOST_MID = 0.22;
  var MAX_EDITS = 8;
  var KINDS = ['stretch', 'fold', 'reverse'];

  function gesture(u) {
    return 0.55 * Math.sin(2 * Math.PI * 3 * u + 1.7) +
           0.30 * Math.sin(2 * Math.PI * 7 * u + 0.4) +
           0.18 * Math.sin(2 * Math.PI * 13 * u + 2.9);
  }
  function phaseAt(t) { return (t * SCROLL) % 1; }
  function uAt(x, t) {
    var u = (x + phaseAt(t)) % 1;
    return u < 0 ? u + 1 : u;
  }
  function xAt(u, t) {
    var x = (u - phaseAt(t)) % 1;
    return x < 0 ? x + 1 : x;
  }

  // State. The edits are the only state, and they only change
  // through a tap (or the ?edit= hook at load), so frame one is a
  // pure function of FIRST_T and the fixed opening state.
  var edits = [
    { u: 0.30, kind: 'stretch', span: 0.16 },
    { u: 0.62, kind: 'fold', span: 0.16 }
  ];

  // Send the moment at normalized (nx, ny) to the editor. The
  // kind cycles stretch, fold, reverse with each new edit, so the
  // blue layer gathers all three treatments. Returns true when an
  // edit was added.
  function sendToEditor(nx, ny) {
    if (ny < STRIP_TOP - 0.02 || ny > STRIP_BOT + 0.02) { return false; }
    if (edits.length >= MAX_EDITS) { edits.shift(); }
    var kind = KINDS[edits.length % 3];
    edits.push({ u: uAt(nx, lastT), kind: kind, span: 0.16 });
    return true;
  }

  function lastEdit() { return edits.length ? edits[edits.length - 1] : null; }
  function playheadU(t) { return uAt(PLAYHEAD_X, t); }
  function lagSeconds(t) {
    var e = lastEdit();
    if (!e) { return 0; }
    var d = (playheadU(t) - e.u + 1) % 1;
    return d * TAPE_SECONDS;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The ground: dark brown, darker toward the bottom, so the tape
  // strip and the blue ghosts read as lit layers over it.
  function drawGround() {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, GROUND_TOP);
    grad.addColorStop(1, GROUND_BOT);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // A faint seeded speckle, the dust on the tape box.
    var rng = mulberry32(FIELD_SEED * 3 + 5);
    var i;
    ctx.fillStyle = hexA(INK_DIM, a4(0.10));
    for (i = 0; i < 90; i++) {
      var sx = rng() * W, sy = rng() * H;
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
  }

  // The tape strip: a brown band across the full width with dark
  // sprocket holes along both edges, a light top rim, and faint
  // frame seams every twelfth of the width, like film frames.
  function drawStrip() {
    var top = STRIP_TOP * H, bot = STRIP_BOT * H;
    ctx.fillStyle = TAPE;
    ctx.fillRect(0, top, W, bot - top);
    ctx.fillStyle = TAPE_LT;
    ctx.fillRect(0, top, W, 3);
    ctx.fillStyle = TAPE_DK;
    ctx.fillRect(0, bot - 3, W, 3);
    // Frame seams.
    ctx.strokeStyle = hexA(TAPE_DK, a4(0.45));
    ctx.lineWidth = 1;
    var i;
    for (i = 1; i < 12; i++) {
      var fx = (i / 12) * W;
      ctx.beginPath();
      ctx.moveTo(fx, top + 10); ctx.lineTo(fx, bot - 10);
      ctx.stroke();
    }
    // Sprocket holes, top and bottom rows.
    var hw = Math.max(8, W / 48), hh = 8;
    var n = Math.floor(W / (hw * 2));
    for (i = 0; i < n; i++) {
      var hx = (i + 0.5) * (W / n) - hw / 2;
      ctx.fillStyle = TAPE_DK;
      ctx.fillRect(hx, top + 6, hw, hh);
      ctx.fillRect(hx, bot - 6 - hh, hw, hh);
    }
    // The strip's shadow on the ground.
    ctx.fillStyle = hexA('#000000', a4(0.25));
    ctx.fillRect(0, bot, W, 4);
  }

  // The played line: the gold gesture scrolling slowly along the
  // strip, drawn as a glow pass, a mid pass, and a bright core.
  function drawPlayed(t) {
    var midY = 0.5 * H, amp = 0.09 * H;
    var passes = [
      { w: 7, col: GOLD, al: 0.14 },
      { w: 3.5, col: GOLD, al: 0.30 },
      { w: 1.5, col: GOLD_LT, al: 0.95 }
    ];
    var p, i, x;
    for (p = 0; p < passes.length; p++) {
      ctx.strokeStyle = hexA(passes[p].col, a4(passes[p].al));
      ctx.lineWidth = passes[p].w;
      ctx.beginPath();
      for (i = 0; i <= 160; i++) {
        x = (i / 160) * W;
        var y = midY + gesture(uAt(x / W, t)) * amp;
        if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
      }
      ctx.stroke();
    }
  }

  // One edited ghost: the same gesture segment transformed by
  // its kind. Stretch spreads it 1.6 times wider, fold mirrors
  // both halves onto one span centered on the ghost, reverse runs
  // it backwards. The ghost floats above the strip in ice blue,
  // with a thin connector down to the moment it came from.
  function drawGhost(e, t) {
    var cx = xAt(e.u, t) * W;
    var midY = GHOST_MID * H, amp = 0.07 * H;
    var halfSpan = (e.span / 2) * W;
    var spread = e.kind === 'stretch' ? 1.6 : (e.kind === 'fold' ? 1.6 : 1.0);
    var passes = [
      { w: 5, col: ICE, al: 0.16 },
      { w: 2, col: ICE_LT, al: 0.9 }
    ];
    var p, i;
    for (p = 0; p < passes.length; p++) {
      ctx.strokeStyle = hexA(passes[p].col, a4(passes[p].al));
      ctx.lineWidth = passes[p].w;
      ctx.beginPath();
      for (i = 0; i <= 60; i++) {
        var s = (i / 60) - 0.5; // -0.5 to 0.5 across the segment
        var gx, gu;
        if (e.kind === 'fold') {
          gx = cx + (Math.abs(s) - 0.25) * halfSpan * 2 * spread;
          gu = e.u + s * e.span;
        } else if (e.kind === 'reverse') {
          gx = cx - s * halfSpan * 2 * spread;
          gu = e.u - s * e.span;
        } else {
          gx = cx + s * halfSpan * 2 * spread;
          gu = e.u + s * e.span;
        }
        var gy = midY + gesture(gu) * amp;
        if (i === 0) { ctx.moveTo(gx, gy); } else { ctx.lineTo(gx, gy); }
      }
      ctx.stroke();
    }
    // Connector from the ghost down to its moment on the strip.
    ctx.strokeStyle = hexA(ICE, a4(0.35));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, midY + amp + 6);
    ctx.lineTo(cx, STRIP_TOP * H - 4);
    ctx.stroke();
    // A small blue marker at the ghost's center.
    ctx.fillStyle = hexA(ICE_LT, a4(0.9));
    ctx.beginPath(); ctx.moveTo(cx + 4, midY); ctx.arc(cx, midY, 4, 0, Math.PI * 2); ctx.fill();
  }

  // The edited layer: every edit ghosts above the strip, the
  // newest one drawn last so it sits on top.
  function drawEdited(t) {
    var i;
    for (i = 0; i < edits.length; i++) { drawGhost(edits[i], t); }
  }

  // The playhead: a thin white line through the strip and the
  // ghost layer, with a small triangle at the top of the strip.
  function drawPlayhead() {
    var px = PLAYHEAD_X * W;
    ctx.strokeStyle = hexA(WHITE, a4(0.9));
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, 0.06 * H); ctx.lineTo(px, STRIP_BOT * H + 6);
    ctx.stroke();
    ctx.fillStyle = hexA(WHITE, a4(0.95));
    ctx.beginPath();
    ctx.moveTo(px - 6, STRIP_TOP * H - 14);
    ctx.lineTo(px + 6, STRIP_TOP * H - 14);
    ctx.lineTo(px, STRIP_TOP * H - 4);
    ctx.closePath();
    ctx.fill();
  }

  // The lag gauge: a small timeline below the strip with a gold
  // tick for the playhead and a blue tick for the last edit, and
  // a line of text stating how far behind the edit lags.
  function drawLag(t) {
    var ty = 0.74 * H;
    var tx0 = 0.10 * W, tx1 = 0.90 * W;
    ctx.strokeStyle = hexA(INK_DIM, a4(0.55));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tx0, ty); ctx.lineTo(tx1, ty);
    ctx.stroke();
    var e = lastEdit();
    if (e) {
      var ex = tx0 + e.u * (tx1 - tx0);
      ctx.fillStyle = ICE;
      ctx.fillRect(ex - 1.5, ty - 7, 3, 14);
    }
    var px = tx0 + playheadU(t) * (tx1 - tx0);
    ctx.fillStyle = GOLD;
    ctx.fillRect(px - 1.5, ty - 7, 3, 14);
    var fs = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.font = fs + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = hexA(INK_DIM, a4(0.9));
    var lag = lagSeconds(t);
    var lagText = 'edit lags ' + lag.toFixed(1) + ' s behind';
    ctx.fillText(lagText, W / 2, ty + 26);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawGround();
    drawEdited(t);
    drawStrip();
    drawPlayed(t);
    drawPlayhead();
    drawLag(t);

    // ---- Plates: title top-left, number and date below it, a
    // short descriptor and the edit count top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Considered Return', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.8);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1954 · 2007 · 05 · 19', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(INK, 0.65);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('the edit is a second performance', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.fillStyle = hexA(INK, 0.8);
    ctx.font = fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Edits ' + edits.length + ' of ' + MAX_EDITS, W - 18, 18 + fsTitle * 0.8 + fsSmall + 8 + fsSmall + 6);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom on a pale pill so it stays
    // legible over the dark ground.
    var hint = 'Tap a moment to send it to the editor.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(PILL, a4(0.9));
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = PILL_INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function perfT() { return lastT; }

  function canvasPos(e) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function toNorm(p) { return { x: p.x / W, y: p.y / H }; }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      var p = toNorm(canvasPos(e));
      if (sendToEditor(p.x, p.y)) {
        draw(reduced ? FIRST_T : perfT());
      }
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1954 exposes the edit, the edit count, the lag,
  // and the state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1954 = {
      edit: sendToEditor,
      editCount: function () { return edits.length; },
      lag: function (t) { return lagSeconds(t === undefined ? lastT : t); },
      kinds: function () { var k = [], i; for (i = 0; i < edits.length; i++) { k.push(edits[i].kind); } return k; },
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  // Apply the ?edit= hook after resize(), so sendToEditor sees
  // the real stage size; before the first frame either way.
  if (probeEdit) { sendToEditor(probeEdit.x, probeEdit.y); }
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the tape scrolls at 0.015 cycles per second, the
  // ghosts drift with it, all well under the 14 Hz ceiling.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
