<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Third Voice</title>
<style>
html, body { margin: 0; padding: 0; background: #08080B; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: one body makes two sounds on a dark stage, an amber thread from
   the cello and a pale blue thread from the microphone, and where they cross
   they become a single violet-white hum that brightens and dims with their
   beating. The viewer only watches; the merge cannot be steered. */
var TAU = Math.PI * 2;
var GROUND = '#08080B';
var FIGURE = '#17151C';
var AMBER = '#E8A33D';
var AMBER_HI = '#F5C46A';
var BLUE = '#A8C8E8';
var BLUE_HI = '#D6E6F7';
var VIOLET = '#B9A8F5';
var VIOLET_HI = '#EFEAFF';
var MAGENTA = '#D6336C';
var PLATE = '#0D0D0F';
var PLATE_LINE = 'rgba(221,227,232,0.28)';
var TITLE_INK = '#EDEDE8';
var HINT_INK = '#9AA3AD';
var FRAME_T = 60.0;        /* fixed phase: merged ribbon near full brightness */
var BEAT_HZ = 0.77;        /* 110.77 minus 110 Hz: cello and voice detune */
var BEAT_PHASE = 0.6;      /* merge brightness 0.98 at frame one */
var WOB_PERIOD = 26;       /* slow ribbon sway, seconds */
var MERGE_FX = 0.66, MERGE_FY = 0.30;   /* where the two threads cross */
var THREAD_COUNT = 3;      /* two source threads, one merged thread */
var MOTE_COUNT = 36;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var soundOn = false;
var audioCtx = null;
var voices = null;
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
/* ---- beating: warm light and merged ribbon share one phase ---- */
function beatPhase(t) { return TAU * BEAT_HZ * t + BEAT_PHASE; }
function mergeBrightness(t) { return 0.5 + 0.5 * Math.sin(beatPhase(t)); }
function warmAmount(t) { return mergeBrightness(t); }
/* ---- seeded dust motes that ride the threads ---- */
var MOTES = [];
(function () {
  var rng = mulberry32(1848);
  var i;
  for (i = 0; i < MOTE_COUNT; i++) {
    MOTES.push({
      thread: i % 3,                 /* 0 amber, 1 blue, 2 merged */
      s: rng(),                     /* position along the thread, 0 to 1 */
      lat: (rng() * 2 - 1) * 0.02,  /* lateral offset, fraction of min(VW,VH) */
      r: 0.0006 + rng() * 0.0012,   /* radius, fraction of min(VW,VH) */
      ph: rng() * TAU,
      per: 6 + rng() * 8,           /* pulse period, 6 to 14 s */
      a: 0.05 + rng() * 0.10
    });
  }
})();
/* ---- smooth curve through points, Catmull-Rom sampling ---- */
function sampleCurve(pts, perSpan) {
  var out = [];
  var n = pts.length, i, j, s, t, t2, t3, p0, p1, p2, p3;
  for (i = 0; i < n - 1; i++) {
    p0 = pts[Math.max(0, i - 1)];
    p1 = pts[i];
    p2 = pts[i + 1];
    p3 = pts[Math.min(n - 1, i + 2)];
    for (j = 0; j < perSpan; j++) {
      s = j / perSpan; t = s; t2 = t * t; t3 = t2 * t;
      out.push({
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
      });
    }
  }
  out.push({ x: pts[n - 1].x, y: pts[n - 1].y });
  return out;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The stage fills the frame to the edges on every screen: no architecture,
   nothing between the viewer and the figure but the threads. */
function fieldRect() {
  return { x: 0, y: 0, w: VW, h: VH };
}
/* ---- figure geometry: centered, small, plain silhouette ---- */
function figureGeom(sc) {
  var m = Math.min(sc.w, sc.h);
  var cx = sc.x + sc.w * 0.5;
  var baseY = sc.y + sc.h * 0.64;
  var h = m * 0.26;
  var u = h / 100;
  return {
    m: m, cx: cx, baseY: baseY, h: h, u: u,
    head: { x: cx - 3 * u, y: baseY - 88 * u, r: 8 * u },
    mic: { x: cx - 13 * u, y: baseY - 88 * u, r: 3.5 * u },
    cello: { x: cx + 20 * u, y: baseY - 38 * u }
  };
}
function mergePoint(sc) {
  return { x: sc.x + MERGE_FX * sc.w, y: sc.y + MERGE_FY * sc.h };
}
/* ---- thread paths, rebuilt each frame from figure + fixed waypoints ---- */
function threadPaths(sc, fg) {
  var M = mergePoint(sc);
  var px = function (fx, fy) { return { x: sc.x + fx * sc.w, y: sc.y + fy * sc.h }; };
  return {
    amber: sampleCurve([
      { x: fg.cello.x, y: fg.cello.y },
      px(0.38, 0.72), px(0.20, 0.66), px(0.16, 0.44),
      px(0.30, 0.28), px(0.50, 0.24), M
    ], 22),
    blue: sampleCurve([
      { x: fg.mic.x, y: fg.mic.y },
      px(0.36, 0.34), px(0.30, 0.20), px(0.46, 0.14), M
    ], 22),
    merged: sampleCurve([
      M, px(0.80, 0.36), px(0.90, 0.28), px(1.03, 0.33)
    ], 22)
  };
}
function wobble(pts, t, phase, m) {
  var out = [];
  var n = pts.length, i, s, dx, dy, len, ox, oy, off;
  var amp = m * 0.006;
  for (i = 0; i < n; i++) {
    s = i / (n - 1);
    var a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    dx = b.x - a.x; dy = b.y - a.y;
    len = Math.sqrt(dx * dx + dy * dy) || 1;
    ox = -dy / len; oy = dx / len;
    off = amp * Math.sin(TAU * (s * 1.5 + t / WOB_PERIOD) + phase);
    out.push({ x: pts[i].x + ox * off, y: pts[i].y + oy * off });
  }
  return out;
}
function strokePath(pts) {
  var i;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}
function drawThread(pts, mid, core, bright, m) {
  var wGlow = m * 0.012, wMid = m * 0.0035, wCore = m * 0.0012;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = rgba(mid, 0.05 * bright);
  ctx.lineWidth = wGlow;
  strokePath(pts);
  ctx.strokeStyle = rgba(mid, 0.30 * bright);
  ctx.lineWidth = wMid;
  strokePath(pts);
  ctx.strokeStyle = rgba(core, 0.85 * bright);
  ctx.lineWidth = wCore;
  strokePath(pts);
}
function drawStageWash(sc, fg, t) {
  var m = fg.m;
  var warm = warmAmount(t);
  var cx = fg.cx, cy = fg.baseY - fg.h * 0.45;
  var R = m * 0.52;
  var g;
  g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  g.addColorStop(0, rgba(AMBER, 0.055 * warm));
  g.addColorStop(1, rgba(AMBER, 0));
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  g.addColorStop(0, rgba(BLUE, 0.055 * (1 - warm)));
  g.addColorStop(1, rgba(BLUE, 0));
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  /* faint floor glow under the figure */
  ctx.fillStyle = rgba(AMBER, 0.04);
  ctx.beginPath();
  ctx.moveTo(fg.cx + m * 0.07, fg.baseY + m * 0.002);
  ctx.ellipse(fg.cx, fg.baseY + m * 0.002, m * 0.07, m * 0.007, 0, 0, TAU);
  ctx.fill();
  /* gentle vignette: the stage darkens toward the edges */
  g = ctx.createRadialGradient(cx, cy, m * 0.2, cx, cy, Math.max(sc.w, sc.h) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
}
function drawMergeGlow(sc, t) {
  var M = mergePoint(sc);
  var m = Math.min(sc.w, sc.h);
  var R = m * 0.30;
  var b = mergeBrightness(t);
  var g = ctx.createRadialGradient(M.x, M.y, 0, M.x, M.y, R);
  g.addColorStop(0, rgba(MAGENTA, 0.10 + 0.16 * b));
  g.addColorStop(0.55, rgba(MAGENTA, 0.04 + 0.06 * b));
  g.addColorStop(1, rgba(MAGENTA, 0));
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
}
function drawThreads(sc, fg, t) {
  var paths = threadPaths(sc, fg);
  var m = fg.m;
  var amberB = 0.75 + 0.25 * Math.sin(TAU * t / 24 + 1.2);
  var blueB = 0.75 + 0.25 * Math.sin(TAU * t / 29 + 2.6);
  var mergedB = mergeBrightness(t);
  var lists = [paths.amber, paths.blue, paths.merged];
  var wobbled = [
    wobble(paths.amber, t, 0, m),
    wobble(paths.blue, t, 2.1, m),
    wobble(paths.merged, t, 4.2, m)
  ];
  drawThread(wobbled[0], AMBER, AMBER_HI, amberB, m);
  drawThread(wobbled[1], BLUE, BLUE_HI, blueB, m);
  drawThread(wobbled[2], VIOLET, VIOLET_HI, mergedB, m);
  /* dust motes riding the threads */
  var i, mo, pts, idx, p, a, bright;
  for (i = 0; i < MOTES.length; i++) {
    mo = MOTES[i];
    pts = lists[mo.thread];
    idx = Math.floor(mo.s * (pts.length - 1));
    p = pts[idx];
    bright = mo.thread === 0 ? amberB : (mo.thread === 1 ? blueB : mergedB);
    a = mo.a * bright * (0.5 + 0.5 * Math.sin(TAU * t / mo.per + mo.ph));
    ctx.fillStyle = rgba(mo.thread === 0 ? AMBER_HI : (mo.thread === 1 ? BLUE_HI : VIOLET_HI), a);
    ctx.beginPath();
    ctx.moveTo(p.x + mo.r * m, p.y + mo.lat * m);
    ctx.arc(p.x, p.y + mo.lat * m, mo.r * m, 0, TAU);
    ctx.fill();
  }
}
function drawFigure(sc, fg, t) {
  var m = fg.m, u = fg.u, cx = fg.cx, baseY = fg.baseY;
  ctx.fillStyle = FIGURE;
  /* seated torso and skirt, one plain blob */
  ctx.beginPath();
  ctx.moveTo(cx - 9 * u, baseY - 74 * u);
  ctx.bezierCurveTo(cx - 13 * u, baseY - 60 * u, cx - 14 * u, baseY - 34 * u, cx - 15 * u, baseY - 12 * u);
  ctx.bezierCurveTo(cx - 15 * u, baseY - 2 * u, cx - 8 * u, baseY, cx, baseY);
  ctx.bezierCurveTo(cx + 9 * u, baseY, cx + 15 * u, baseY - 2 * u, cx + 14 * u, baseY - 12 * u);
  ctx.bezierCurveTo(cx + 13 * u, baseY - 34 * u, cx + 12 * u, baseY - 60 * u, cx + 8 * u, baseY - 74 * u);
  ctx.bezierCurveTo(cx + 4 * u, baseY - 80 * u, cx - 4 * u, baseY - 80 * u, cx - 9 * u, baseY - 74 * u);
  ctx.fill();
  /* head, plain circle, no face */
  ctx.beginPath();
  ctx.moveTo(fg.head.x + fg.head.r, fg.head.y);
  ctx.arc(fg.head.x, fg.head.y, fg.head.r, 0, TAU);
  ctx.fill();
  /* cello: two bouts, neck, scroll, all silhouette */
  ctx.save();
  ctx.translate(fg.cello.x, fg.cello.y);
  ctx.rotate(-0.25);
  ctx.beginPath();
  ctx.moveTo(13 * u, 0);
  ctx.ellipse(0, 0, 13 * u, 16 * u, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(10 * u, -20 * u);
  ctx.ellipse(0, -20 * u, 10 * u, 12 * u, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle = FIGURE;
  ctx.lineWidth = 3 * u;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 15 * u, baseY - 66 * u);
  ctx.lineTo(cx + 6 * u, baseY - 86 * u);
  ctx.stroke();
  ctx.fillStyle = FIGURE;
  ctx.beginPath();
  ctx.moveTo(cx + 5 * u + 3 * u, baseY - 88 * u);
  ctx.arc(cx + 5 * u, baseY - 88 * u, 3 * u, 0, TAU);
  ctx.fill();
  /* bow, a thin amber line across the strings */
  ctx.strokeStyle = rgba(AMBER, 0.55);
  ctx.lineWidth = Math.max(1, 1.5 * u);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 10 * u, baseY - 50 * u);
  ctx.lineTo(cx + 32 * u, baseY - 26 * u);
  ctx.stroke();
  /* microphone at her mouth: small dark disc, pale blue rim, thin stand */
  ctx.strokeStyle = rgba(BLUE, 0.35);
  ctx.lineWidth = Math.max(1, 1.2 * u);
  ctx.beginPath();
  ctx.moveTo(fg.mic.x - 3 * u, baseY - 40 * u);
  ctx.lineTo(fg.mic.x, fg.mic.y + fg.mic.r);
  ctx.stroke();
  ctx.fillStyle = '#0B0B0E';
  ctx.beginPath();
  ctx.moveTo(fg.mic.x + fg.mic.r, fg.mic.y);
  ctx.arc(fg.mic.x, fg.mic.y, fg.mic.r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(BLUE_HI, 0.6);
  ctx.lineWidth = Math.max(1, 0.8 * u);
  ctx.beginPath();
  ctx.arc(fg.mic.x, fg.mic.y, fg.mic.r, 0, TAU);
  ctx.stroke();
  /* rim light: amber on the warm side, pale blue on the cool side */
  ctx.strokeStyle = rgba(AMBER, 0.4);
  ctx.lineWidth = Math.max(1, 1 * u);
  ctx.beginPath();
  ctx.arc(fg.head.x, fg.head.y, fg.head.r, -1.2, 1.2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 12 * u, baseY - 72 * u);
  ctx.lineTo(cx + 14 * u, baseY - 16 * u);
  ctx.stroke();
  ctx.strokeStyle = rgba(BLUE, 0.35);
  ctx.beginPath();
  ctx.arc(fg.head.x, fg.head.y, fg.head.r, Math.PI - 1.2, Math.PI + 1.2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - 12 * u, baseY - 72 * u);
  ctx.lineTo(cx - 14 * u, baseY - 16 * u);
  ctx.stroke();
  /* rim light on the cello's lower bout, warm side */
  ctx.strokeStyle = rgba(AMBER, 0.3);
  ctx.beginPath();
  ctx.arc(fg.cello.x + 2 * u, fg.cello.y + 2 * u, 13 * u, -1.0, 1.4);
  ctx.stroke();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Third Voice').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Third Voice').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 02').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Third Voice', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 02', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
/* ---- sound: two generative voices with slight detune, tap only ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try { audioCtx = new AudioContext(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function startVoices(ac) {
  if (voices) return;
  try {
    var master = ac.createGain();
    master.gain.value = 0.9;
    master.connect(ac.destination);
    /* cello: sawtooth at 110 Hz through a lowpass, slow bow vibrato */
    var celloGain = ac.createGain(); celloGain.gain.value = 0.05;
    var celloFilter = ac.createBiquadFilter();
    celloFilter.type = 'lowpass'; celloFilter.frequency.value = 650; celloFilter.Q.value = 0.8;
    var cello = ac.createOscillator(); cello.type = 'sawtooth'; cello.frequency.value = 110;
    var vib = ac.createOscillator(); vib.type = 'sine'; vib.frequency.value = 5.4;
    var vibGain = ac.createGain(); vibGain.gain.value = 1.8;
    vib.connect(vibGain); vibGain.connect(cello.frequency);
    cello.connect(celloFilter); celloFilter.connect(celloGain); celloGain.connect(master);
    cello.start(); vib.start();
    /* voice: sawtooth at 110.77 Hz through two formants, breathier vibrato */
    var voiceGain = ac.createGain(); voiceGain.gain.value = 0.04;
    var form1 = ac.createBiquadFilter();
    form1.type = 'bandpass'; form1.frequency.value = 730; form1.Q.value = 2;
    var form2 = ac.createBiquadFilter();
    form2.type = 'bandpass'; form2.frequency.value = 1150; form2.Q.value = 3;
    var voice = ac.createOscillator(); voice.type = 'sawtooth'; voice.frequency.value = 110.77;
    var vib2 = ac.createOscillator(); vib2.type = 'sine'; vib2.frequency.value = 4.9;
    var vib2Gain = ac.createGain(); vib2Gain.gain.value = 2.4;
    vib2.connect(vib2Gain); vib2Gain.connect(voice.frequency);
    voice.connect(form1); form1.connect(voiceGain);
    voice.connect(form2); form2.connect(voiceGain);
    voiceGain.connect(master);
    voice.start(); vib2.start();
    /* breath: looped seeded noise through a high bandpass, slow swell */
    var noiseLen = ac.sampleRate * 2;
    var buf = ac.createBuffer(1, noiseLen, ac.sampleRate);
    var ch = buf.getChannelData(0);
    var nrng = mulberry32(1848);
    var i;
    for (i = 0; i < noiseLen; i++) ch[i] = nrng() * 2 - 1;
    var noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
    var breathFilter = ac.createBiquadFilter();
    breathFilter.type = 'bandpass'; breathFilter.frequency.value = 2400; breathFilter.Q.value = 0.8;
    var breathGain = ac.createGain(); breathGain.gain.value = 0.006;
    var breathLfo = ac.createOscillator(); breathLfo.type = 'sine'; breathLfo.frequency.value = 1 / 7;
