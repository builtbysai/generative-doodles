<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Outrage</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#EFE3C8; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  // Palette: exactly the three colors of the brief, nothing else.
  var GROUND = '#EFE3C8';  // pale cream field
  var SLAB   = '#1A1A1A';  // black domino slabs
  var THUMB  = '#E8B62D';  // yellow thumbs-down stamp, the only accent

  // Seeded RNG (mulberry32). The slab table is regenerated from the
  // seed alone, so any loop time renders the same scene on any load.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- The deterministic cascade. The loop is LOOP seconds long and
  // N slabs spawn on an exact steady beat (one every LOOP / N seconds).
  // Each slab has a fixed lifespan inside the loop: it falls, topples,
  // settles into the pile, then fades out as newer slabs land, so the
  // loop wraps seamlessly. The state of every slab is a pure function
  // of (loop time, seed): nothing is accumulated frame to frame.
  var LOOP = 40;
  var N = 30;
  var FALL = 3.6;      // seconds of gravity fall
  var TOPPLE = 1.3;    // seconds of rigid rotation on impact
  var LIFE = 26.0;     // seconds from spawn to fully faded
  var FADE = 3.0;      // fade-out window at the end of a slab's life
  var FIXED_T = 17;    // constant first-frame loop phase

  var seed = 478;
  var slabs = [];

  function buildSlabs() {
    var rng = mulberry32(seed * 1000 + 61);
    // Pile slots are stratified evenly across the pile width and then
    // shuffled with the seed, so the pile always spreads wall to wall
    // instead of clumping, while the assignment stays seeded.
    var slots = [];
    var i;
    for (i = 0; i < N; i++) slots.push(((i + 0.5) / N) * 2 - 1);
    for (i = N - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = slots[i]; slots[i] = slots[j]; slots[j] = tmp;
    }
    slabs = [];
    for (var k = 0; k < N; k++) {
      var layerRoll = rng();
      var layer = layerRoll < 0.50 ? 0 : (layerRoll < 0.82 ? 1 : 2);
      var dir = rng() < 0.5 ? -1 : 1;
      slabs.push({
        spawn: k * (LOOP / N),
        fallJitter: (rng() * 2 - 1),          // within the cascade column
        pileOff: slots[k] * 0.94 + (rng() * 2 - 1) * 0.05,
        layer: layer,
        yJitter: (rng() * 2 - 1),
        dir: dir,
        fallAng: (rng() * 2 - 1) * 0.10,      // radians, slight tilt in fall
        finalAng: dir * (1.28 + rng() * 0.30) // radians, near flat on the pile
      });
    }
  }

  function layout() { /* sizes are derived inside draw from W and H */ }

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
    layout();
  }

  function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // One thumbs-down stamp, drawn in slab-local coordinates centered on
  // (0, 0); g is the glyph's full height in px. The silhouette: a fist
  // block across the top with three finger bumps on its upper edge, and
  // a thumb shaft descending on the left, ending in a rounded tip well
  // below the fist. Flat yellow, no outline, no shading.
  function thumbGlyph(g) {
    var u = g / 2; // half-size unit; glyph spans about -u..u vertically
    ctx.save();
    ctx.translate(-0.14 * u, 0); // center the asymmetric silhouette
    ctx.fillStyle = THUMB;
    // Thumb shaft and rounded tip: a thick column descending on the
    // left, starting inside the fist so the silhouette is one piece.
    ctx.beginPath();
    ctx.moveTo(-0.74 * u, -0.30 * u);
    ctx.lineTo(-0.02 * u, -0.30 * u);
    ctx.lineTo(-0.02 * u, 0.52 * u);
    ctx.quadraticCurveTo(-0.02 * u, 0.98 * u, -0.38 * u, 0.98 * u);
    ctx.quadraticCurveTo(-0.74 * u, 0.98 * u, -0.74 * u, 0.52 * u);
    ctx.closePath();
    ctx.fill();
    // Fist block: one bold rounded slab across the top, right of and
    // overlapping the shaft by a wide margin so the stamp is one piece.
    roundRectPath(-0.30 * u, -1.00 * u, 1.30 * u, 0.95 * u, 0.22 * u);
    ctx.fill();
    // Finger seams: three thick slab-black grooves down the fist,
    // negative space that makes the curled fingers read at small sizes.
    ctx.strokeStyle = SLAB;
    ctx.lineWidth = Math.max(1.4, 0.10 * u);
    ctx.lineCap = 'round';
    var bx = [0.16, 0.50, 0.84];
    for (var j = 0; j < bx.length; j++) {
      ctx.beginPath();
      ctx.moveTo(bx[j] * u, -0.80 * u);
      ctx.lineTo(bx[j] * u, -0.30 * u);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Slab state at loop time t: returns null when the slab is outside
  // its lifespan, otherwise its center, angle and alpha.
  function slabState(s, t, geom) {
    var age = t - s.spawn;
    if (age < 0) age += LOOP;
    if (age >= LIFE) return null;

    var alpha = 1;
    if (age > LIFE - FADE) alpha = 1 - (age - (LIFE - FADE)) / FADE;
    if (alpha <= 0) return null;

    var fallX = geom.cx + s.fallJitter * geom.colHalf;
    var pileX = geom.cx + s.pileOff * geom.pileHalf;
    var layerStep = geom.sw * 0.58;
    var uprightY = geom.groundY - s.layer * layerStep - geom.sh / 2 + s.yJitter * 3;
    var flatY = geom.groundY - s.layer * layerStep - geom.sw / 2 + s.yJitter * 3;

    var x, y, ang;
    if (age < FALL) {
      var p = age / FALL;
      var startY = -geom.sh * 0.62;
      x = fallX;
      // Gravity with a softened exponent, so slabs stay spread down
      // the column instead of lingering at the top and rushing the pile.
      y = startY + (uprightY - startY) * Math.pow(p, 1.35);
      ang = s.fallAng * p;
    } else if (age < FALL + TOPPLE) {
      var q = easeOutCubic((age - FALL) / TOPPLE);
      x = fallX + (pileX - fallX) * q;
      y = uprightY + (flatY - uprightY) * q;
      ang = s.fallAng + (s.finalAng - s.fallAng) * q;
    } else {
      x = pileX;
      y = flatY;
      ang = s.finalAng;
    }
    return { x: x, y: y, ang: ang, alpha: alpha, age: age };
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var U = Math.min(W, H);
    var sw = Math.max(38, Math.min(108, U * 0.115));
    var sh = sw * 1.58;
    var geom = {
      cx: W / 2,
      sw: sw,
      sh: sh,
      colHalf: W * 0.085,   // cascade column about 30% of frame width overall
      pileHalf: W * (PHONE ? 0.38 : 0.35),
      groundY: H - U * 0.045
    };

    // Collect the visible population, oldest first, so the pile draws
    // in landing order and the falling slabs stay in front.
    var vis = [];
    for (var i = 0; i < slabs.length; i++) {
      var st = slabState(slabs[i], t, geom);
      if (st) vis.push(st);
    }
    vis.sort(function (a, b) { return b.age - a.age; });

    for (var j = 0; j < vis.length; j++) {
      var s2 = vis[j];
      ctx.save();
      ctx.globalAlpha = s2.alpha;
      ctx.translate(s2.x, s2.y);
      ctx.rotate(s2.ang);
      ctx.fillStyle = SLAB;
      roundRectPath(-sw / 2, -sh / 2, sw, sh, sw * 0.13);
      ctx.fill();
      thumbGlyph(sw * 0.74);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // One synchronous, constant first frame: loop phase 17s, a fully
  // developed mid-collapse scene (slabs mid-fall, one toppling, a
  // settled pile). Never derived from the clock.
  resize();
  buildSlabs();
  draw(FIXED_T);

  // ---- Motion: rAF typeof-guarded, anchored as the fixed offset plus
  // elapsed time, wrapped by the 40s loop.
  var startStamp = (typeof performance !== "undefined" && performance.now)
    ? performance.now() : 0;
  function step() {
    var elapsed = ((typeof performance !== "undefined" && performance.now)
      ? performance.now() - startStamp : 0) / 1000;
    draw((FIXED_T + elapsed) % LOOP);
  }
  if (typeof requestAnimationFrame === 'function') {
    var loopFn = function () { step(); requestAnimationFrame(loopFn); };
    requestAnimationFrame(loopFn);
  }

  // ---- Interaction: watch-only base. A tap does nothing on its own;
  // a double tap (or dblclick) reseeds the fall: the seed advances and
  // the slab table (fall jitter, pile spots, topple angles) regenerates.
  // The loop phase re-anchors at the fixed offset so the reseeded fall
  // starts from the same developed scene. Nothing ever reloads.
  function reseed() {
    seed += 1;
    buildSlabs();
    startStamp = (typeof performance !== "undefined" && performance.now)
      ? performance.now() : 0;
    draw(FIXED_T);
  }
  var downAt = 0, downX = 0, downY = 0, lastTapAt = 0, lastTapX = 0, lastTapY = 0;
  function onDown(e) {
    downAt = Date.now(); downX = e.clientX || 0; downY = e.clientY || 0;
  }
  function onUp(e) {
    var now = Date.now();
    var x = e.clientX || 0, y = e.clientY || 0;
    var quick = (now - downAt) < 300 &&
      Math.abs(x - downX) < 9 && Math.abs(y - downY) < 9;
    if (quick && (now - lastTapAt) < 350 &&
        Math.abs(x - lastTapX) < 24 && Math.abs(y - lastTapY) < 24) {
      lastTapAt = 0;
      reseed();
    } else if (quick) {
      lastTapAt = now; lastTapX = x; lastTapY = y;
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('dblclick', reseed);
  }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  if (typeof window !== "undefined" && window.visualViewport &&
      window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
})();
</script>
</body>
</html>
