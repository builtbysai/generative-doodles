<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifestation Five</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #E8E5DD; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // Manifestation Five (Olivier Mosset, EXPANSION #98 PP6).
  // The BMPT motif-swap of December 1967 rebuilt as a loop: one square
  // canvas, one ring motif, three hands. Take 1 is Toroni's hand (the ring
  // as a circumference of No. 50 brush imprints), take 2 is Buren's hand
  // (the ring as an annulus of 8.7 cm stripes), take 3 is Mosset's own hand
  // (the flat black outline of No.800). 60 s loop, three 20 s takes, HARD
  // CUTS only: authorship changes, the idea stays. The tiny counter in the
  // canvas's bottom-right corner is the one text the prompt sanctions.
  // Frame one is loop t = 0: take 1, fully shown, counter 01/03.

  var LOOP = 60;
  var TAKE_LEN = 20;
  var PHASE = 0; // frame-one loop phase: take 1 (Toroni)

  // Per-take palettes, strict.
  var TORONI_GROUND = "#ECE8DE";
  var COBALT = "#2B5FA6";
  var BUREN_WHITE = "#F6F3EC";
  var VERMILION = "#C8102E";
  var MOSSET_GROUND = "#F4F2EC";
  var MOSSET_INK = "#141414";
  // The gallery wall the canvas hangs on: one constant surround for all
  // three takes, the same presentation tone as No.800.
  var SURROUND = "#E8E5DD";

  var GROUNDS = [TORONI_GROUND, BUREN_WHITE, MOSSET_GROUND];
  var COUNTER_TONES = [COBALT, VERMILION, MOSSET_INK];

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  // mulberry32: the only randomness in the piece, consumed once at setup.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Toroni's hand: the imprint, exactly as established in No.792 ----
  // A dab is a solid body of paint, near-opaque through its upper
  // two-thirds where the brush first pressed, easing toward the dry bottom
  // edge where it lifted. Bristle texture lives INSIDE the body: cobalt
  // ridges add density, thin ground-coloured gaps score the separations
  // between bristle bundles, and a dense cluster of load strokes sits at
  // the top edge. The hand lives only in this texture and in placement
  // jitter along the circumference, never in the motif.
  function makeImprint(rng) {
    var streaks = [];
    var n = 26 + Math.floor(rng() * 13); // 26..38 density ridges
    for (var i = 0; i < n; i++) {
      streaks.push({
        x: (rng() * 2 - 1) * 0.46,
        top: -0.5 + rng() * 0.1,
        len: 0.58 + rng() * 0.44,
        w: 0.028 + rng() * 0.03,
        a: 0.45 + rng() * 0.4
      });
    }
    var gaps = [];
    var g = 18 + Math.floor(rng() * 10); // 18..27 bristle-gap scores
    for (var h = 0; h < g; h++) {
      gaps.push({
        x: (rng() * 2 - 1) * 0.46,
        top: -0.5 + rng() * 0.08,
        len: 0.5 + rng() * 0.48,
        w: 0.012 + rng() * 0.014,
        a: 0.16 + rng() * 0.2
      });
    }
    var load = [];
    var m = 8 + Math.floor(rng() * 5); // dense top-edge load strokes
    for (var j = 0; j < m; j++) {
      load.push({
        x: (rng() * 2 - 1) * 0.44,
        len: 0.1 + rng() * 0.12,
        w: 0.03 + rng() * 0.03,
        a: 0.65 + rng() * 0.3
      });
    }
    return {
      rot: (rng() * 2 - 1) * 0.035,       // rotation jitter, +-2 degrees
      scl: 0.95 + rng() * 0.1,            // scale jitter, +-5 percent
      alp: 0.9 + rng() * 0.1,             // alpha jitter, +-10 percent
      body: 0.9 + rng() * 0.1,            // dab body alpha: solid paint
      streaks: streaks,
      gaps: gaps,
      load: load
    };
  }

  // Draw one fully-pressed imprint centred at (cx, cy), dab size s, its
  // local frame rotated by baseRot so the dab travels around the ring:
  // width tangential, dense load edge pointing outward.
  function drawDab(cx, cy, s, imp, baseRot) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(baseRot + imp.rot);
    ctx.scale(imp.scl, imp.scl);
    ctx.fillStyle = COBALT;
    var BANDS = 12, b, bf;
    for (b = 0; b < BANDS; b++) {
      bf = b / BANDS;
      ctx.globalAlpha = imp.alp * imp.body *
        (bf < 0.62 ? 1 : 1 - 0.45 * smooth((bf - 0.62) / 0.38));
      ctx.fillRect(-s / 2, -s / 2 + bf * s, s, s / BANDS + 1);
    }
    ctx.lineCap = "butt";
    var k, st, seg, segLen, y0, y1;
    ctx.strokeStyle = COBALT;
    for (k = 0; k < imp.streaks.length; k++) {
      st = imp.streaks[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      y0 = st.top * s;
      segLen = (st.len * s) / 3;
      for (seg = 0; seg < 3; seg++) {
        ctx.globalAlpha = imp.alp * st.a * (seg === 0 ? 1 : (seg === 1 ? 0.62 : 0.35));
        y1 = y0 + segLen;
        ctx.beginPath();
        ctx.moveTo(st.x * s, y0);
        ctx.lineTo(st.x * s, y1);
        ctx.stroke();
        y0 = y1;
      }
    }
    ctx.strokeStyle = TORONI_GROUND;
    for (k = 0; k < imp.gaps.length; k++) {
      st = imp.gaps[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      y0 = st.top * s;
      segLen = (st.len * s) / 3;
      for (seg = 0; seg < 3; seg++) {
        ctx.globalAlpha = st.a * (seg === 0 ? 1 : (seg === 1 ? 0.6 : 0.3));
        y1 = y0 + segLen;
        ctx.beginPath();
        ctx.moveTo(st.x * s, y0);
        ctx.lineTo(st.x * s, y1);
        ctx.stroke();
        y0 = y1;
      }
    }
    ctx.strokeStyle = COBALT;
    for (k = 0; k < imp.load.length; k++) {
      st = imp.load[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      ctx.globalAlpha = imp.alp * st.a;
      ctx.beginPath();
      ctx.moveTo(st.x * s, -s / 2);
      ctx.lineTo(st.x * s, -s / 2 + st.len * s);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }

  // The ring of dabs: 63 imprints around the shared motif circle. Angular
  // jitter is a fraction of the step between neighbours; radial jitter is
  // a fraction of the dab size. All seeded at setup, fixed for the piece.
  var DABS = [];
  (function () {
    var rng = mulberry32(805001);
    var N = 63;
    var step = (Math.PI * 2) / N;
    for (var i = 0; i < N; i++) {
      DABS.push({
        a: i * step,
        aOff: (rng() * 2 - 1) * 0.25 * step,
        rOff: (rng() * 2 - 1) * 0.12, // in dab-size units, applied at draw
        imp: makeImprint(rng)
      });
    }
  })();

  // Mosset's own hand: the wobble parameters of the canonical ring, seeded
  // once (the same administrative near-perfection as No.800).
  var MOSSET_WOB = (function () {
    var rng = mulberry32(805003);
    return { phase: rng() * Math.PI * 2, harm: 3 + Math.floor(rng() * 2) };
  })();

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    DPR = window.devicePixelRatio || 1;
    W = Math.round(w);
    H = Math.round(h);
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
  }

  var currentT = PHASE;

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () { resize(); draw(currentT); });
  }
  window.addEventListener("resize", function () { resize(); draw(currentT); });

  function draw(t) {
    currentT = t;
    if (W === 0) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    // The take is a pure function of loop time. Hard cuts: nothing in the
    // drawing reads the phase inside a take, so a boundary is one frame.
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var take = Math.floor(lt / TAKE_LEN) % 3;

    // Surround: the gallery wall. It does not change hands.
    ctx.fillStyle = SURROUND;
    ctx.fillRect(0, 0, W, H);

    // One centred square canvas, the same geometry for all three hands:
    // fits the frame's smaller dimension (94% desktop, 92% phone).
    var side = Math.min(W, H) * (isPhone() ? 0.92 : 0.94);
    var ox = (W - side) / 2;
    var oy = (H - side) / 2;
    var cx = ox + side / 2;
    var cy = oy + side / 2;

    ctx.fillStyle = GROUNDS[take];
    ctx.fillRect(ox, oy, side, side);

    // Hairline so the canvas edge stays just perceptible on the wall.
    ctx.strokeStyle = "rgba(20,20,20,0.10)";
    ctx.lineWidth = 1;
    ctx.strokeRect(ox + 0.5, oy + 0.5, side - 1, side - 1);

    // The shared motif: a centred ring whose centreline diameter is 66%
    // of the canvas side, as in No.800. Each hand gives it its own
    // material thickness around that same centreline.
    var R = side * 0.33;

    if (take === 0) {
      // Toroni: dab size approximates the ring's stroke width (3.3% of
      // side); 63 dabs at ~0.91 dab-widths of arc read as one ring of
      // distinct imprints, load edge outward all the way around.
      var sDab = side * 0.036;
      for (var i = 0; i < DABS.length; i++) {
        var d = DABS[i];
        var ang = d.a + d.aOff;
        var rad = R + d.rOff * sDab;
        drawDab(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad,
          sDab, d.imp, ang + Math.PI / 2);
      }
    } else if (take === 1) {
      // Buren: the ring as an annulus one stripe pair thick, filled with
      // horizontal bands at the 8.7 cm module (one band = 8.7% of the
      // 100-unit canvas side), anchored at the canvas's top edge and
      // clipped to the annulus (outer circle minus inner circle). The
      // white bands are the canvas ground continuing through, as in the
      // stripe works themselves; the ring reads in vermilion.
      var bandH = side * 0.087;
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R + bandH, 0, Math.PI * 2);
      ctx.arc(cx, cy, R - bandH, 0, Math.PI * 2, true);
      ctx.clip();
      var k = 0;
      for (var y = oy; y < oy + side; y += bandH, k++) {
        ctx.fillStyle = (k % 2 === 0) ? VERMILION : BUREN_WHITE;
        ctx.fillRect(ox, y, side, bandH + 1);
      }
      ctx.restore();
    } else {
      // Mosset: the flat black outline, stroke exactly 3.3% of side, with
      // the filing-cabinet wobble of No.800 (0.3% of side, seeded lobes).
      var wobbleAmp = side * 0.003;
      var steps = 160;
      ctx.strokeStyle = MOSSET_INK;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = Math.max(0.6, side * 0.033);
      ctx.beginPath();
      for (var s2 = 0; s2 <= steps; s2++) {
        var a2 = (Math.PI * 2 * s2) / steps;
        var rr = R + Math.sin(a2 * MOSSET_WOB.harm + MOSSET_WOB.phase) * wobbleAmp;
        var x2 = cx + Math.cos(a2) * rr;
        var y2 = cy + Math.sin(a2) * rr;
        if (s2 === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
      }
      ctx.stroke();
    }

    // The sanctioned counter: tiny, neutral grotesk, bottom-right corner
    // of the canvas, in the current hand's dark tone at low alpha. It
    // changes only at the cuts.
    var fs = Math.max(10, Math.round(side * 0.016));
    ctx.font = fs + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.textAlign = "right";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = COUNTER_TONES[take];
    ctx.globalAlpha = 0.55;
    ctx.fillText("0" + (take + 1) + "/03",
      ox + side - side * 0.022, oy + side - side * 0.022);
    ctx.globalAlpha = 1;
  }

  resize();
  draw(PHASE);

  // Watch-only. The loop is anchored at load: frame one is the synchronous
  // draw above at the constant PHASE, and the animation is PHASE plus
  // elapsed-since-load, never a wall clock.
  if (typeof requestAnimationFrame === "function") {
    var start = null;
    var tick = function (now) {
      if (start === null) start = now;
      draw(PHASE + (now - start) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
