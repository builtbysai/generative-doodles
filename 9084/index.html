<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No9084 · Murmur</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #04060a; }
  body { position: fixed; inset: 0; width: 100%; touch-action: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function() {
  'use strict';
  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var T = 14;                 // seamless loop period, seconds
  var TWO_PI = Math.PI*2;

  // Seeded RNG
  var _s = 9084;
  function rnd() {
    _s |= 0; _s = _s + 0x6D2B79F5 | 0;
    var z = Math.imul(_s ^ _s >>> 15, 1 | _s);
    z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z;
    return ((z ^ z >>> 14) >>> 0) / 4294967296;
  }

  var N = 380, ps = [];
  var cx = 0, cy = 0, R = 0;

  function build() {
    _s = 9084;
    cx = W/2; cy = H/2; R = Math.min(W,H)*0.30;
    ps = [];
    for (var i = 0; i < N; i++) {
      ps.push({
        ra: (i/N)*TWO_PI + (rnd()-0.5)*0.35,   // ring angle
        rr: 1 + (rnd()-0.5)*0.14,              // ring radius jitter
        a1: 1 + Math.floor(rnd()*3),           // drift harmonics (integers -> seamless)
        a2: 1 + Math.floor(rnd()*3),
        p1: rnd()*TWO_PI, p2: rnd()*TWO_PI, p3: rnd()*TWO_PI,
        ax: (0.10+rnd()*0.22)*W, ay: (0.10+rnd()*0.22)*H,
        tw: 2 + Math.floor(rnd()*3)            // twinkle harmonic
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var vw = window.innerWidth, vh = window.innerHeight;
    if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
    W = vw; H = vh;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle = '#04060a'; ctx.fillRect(0,0,W,H);
    build();
  }

  function sstep(a, b, x) {
    var f = Math.min(1, Math.max(0, (x-a)/(b-a)));
    return f*f*(3-2*f);
  }
  // Coalesce envelope over loop phase u in [0,1)
  function env(u) {
    return sstep(0.12, 0.38, u) * (1 - sstep(0.62, 0.92, u));
  }

  // Touch stirs: transient offsets, decay to keep the loop intact
  var stir = [];
  function addStir(x, y, vx, vy) {
    stir.push({x:x, y:y, vx:vx, vy:vy, life:1});
    if (stir.length > 8) stir.shift();
  }
  var lastP = null;
  window.addEventListener('pointerdown', function(e){ lastP = {x:e.clientX, y:e.clientY}; });
  window.addEventListener('pointermove', function(e){
    if (lastP) {
      addStir(e.clientX, e.clientY, (e.clientX-lastP.x)*2.2, (e.clientY-lastP.y)*2.2);
      lastP = {x:e.clientX, y:e.clientY};
    }
  });
  window.addEventListener('pointerup', function(){ lastP = null; });
  window.addEventListener('pointercancel', function(){ lastP = null; });

  function draw(t) {
    // trails
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(4,6,10,0.10)';
    ctx.fillRect(0, 0, W, H);

    var u = (t % T) / T;
    var wt = u * TWO_PI;
    var e = env(u);
    var rot = wt; // one full ring rotation per loop -> seamless

    // faint guide ring while coalesced
    if (e > 0.01) {
      ctx.strokeStyle = 'rgba(127,219,232,' + (0.10*e).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, TWO_PI); ctx.stroke();
    }

    // decay stir
    for (var s = stir.length-1; s >= 0; s--) {
      stir[s].life *= 0.90;
      if (stir[s].life < 0.02) stir.splice(s, 1);
    }

    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < N; i++) {
      var p = ps[i];
      // drift position (integer harmonics -> loops seamlessly)
      var dx = p.ax*Math.sin(p.a1*wt + p.p1) + p.ax*0.4*Math.sin(p.a2*wt + p.p2);
      var dy = p.ay*Math.cos(p.a1*wt + p.p2) + p.ay*0.4*Math.cos(p.a2*wt + p.p1);
      // ring position
      var ang = p.ra + rot;
      var rx = cx + Math.cos(ang)*R*p.rr;
      var ry = cy + Math.sin(ang)*R*p.rr;
      var x = cx + dx + (rx - (cx + dx))*e;
      var y = cy + dy + (ry - (cy + dy))*e;
      // stir offsets
      for (var k = 0; k < stir.length; k++) {
        var st = stir[k];
        var ddx = x - st.x, ddy = y - st.y;
        var d2 = ddx*ddx + ddy*ddy, rad = 130;
        if (d2 < rad*rad) {
          var f = (1 - Math.sqrt(d2)/rad) * st.life;
          x += st.vx * f * 0.06; y += st.vy * f * 0.06;
        }
      }
      var twk = 0.72 + 0.28*Math.sin(p.tw*wt + p.p3);
      var a = (0.30 + 0.70*e) * twk;
      var r = 1.1 + 1.4*e;
      var L = Math.round(52 + 30*e + 12*twk);
      ctx.fillStyle = 'hsla(190, 90%, ' + L + '%, ' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, r, 0, TWO_PI); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  var t0 = performance.now()/1000;
  function frame() {
    draw(performance.now()/1000 - t0);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  frame();
})();
</script>
</body>
</html>
