<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.422 Fruit Fashion</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FF4FA3; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.422 Fruit Fashion (kittyo.illustration, EXPANSION #45).
// After Kitty O'Rourke's fruit-fusion series: one
// full-bleed character per view, each fusing a single
// fruit into fashion. (1) A woman in a watermelon-slice
// bucket hat holding a pear stamped FRESH, on hot pink.
// (2) A confident Black woman with a voluminous afro,
// red-lens sunglasses and a pink lemon-print dress, on
// lemon yellow. (3) A woman with banana-pendant
// earrings, a yellow polka-dot headscarf and pink round
// sunglasses, a toucan perched on a fruit stack on her
// head, on tangerine. TAP advances to the next of the
// exactly THREE AUTHORED characters, in prompt order,
// never a runtime pick: the incoming character slides
// in from the right on an analytic spring while the
// ground cross-fades on fixed ticks. Ambient 28s loop,
// all on whole cycles: fruit sprigs drift in the
// ground's negative space, the character sways
// 2 degrees, the earrings swing as pendulums. The only
// text is the FRESH stamp on character 1's pear, the
// set's designed text, drawn as hand-lettered STROKE
// PATHS, never system fonts; this set carries no
// signature anywhere. Black outlines on every shape
// are her grammar. Frame one is character 1 complete
// at the constant phase T = 6.4s; the clock is
// anchored there and advances in fixed 1/60 ticks,
// never from a wall clock. Flat colour only, one
// canvas, no offscreen canvas, no gradients, no
// shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette (closed) -----------------------------------
var PINKG = '#FF4FA3';   // ground 1, sunglasses pink, dress pink
var LEMONG = '#FFE066';  // ground 2, lemon fruit, scarf dots
var TANG = '#FF9500';     // ground 3, toucan beak
var MELON = '#FF3B3B';   // watermelon flesh
var RIND = '#2E7D4F';     // rind, leaves, char 1 + 3 tops
var BANANA = '#FFD832';  // banana fruit, headscarf
var SKIN1 = '#F1C9A5';
var SKIN2 = '#8A5A3B';
var SKIN3 = '#C68A4A';
var HAIR1 = '#1A1A1A';   // also the ink everywhere
var HAIR3 = '#C0392B';   // red hair
var SUNRED = '#E63329';  // char 2 lenses, FRESH stamp
var INK = '#1A1A1A';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 28;
if (LOOP !== 28) throw new Error('Fruit Fashion ambient loop must be 28s');
var TICK = 1 / 60;
var T0 = 6.4;
var T = T0;

// ---- seeded data ----------------------------------------
// Fixed-seed LCG, the house pattern: sprig tables are
// baked from this at load and never change between
// frames or renders. No Math.random anywhere.
var seed = 422;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// Fruit sprigs in the ground's negative space: fixed
// authored counts per character, positions kept clear
// of the central figure, each with a drift phase.
function sprigTable(n) {
  var out = [], i, x, y;
  for (i = 0; i < n; i++) {
    // scatter into the side bands and top corners
    var band = i % 4;
    if (band === 0) { x = 60 + rnd() * 300; y = 90 + rnd() * 700; }
    else if (band === 1) { x = 920 + rnd() * 300; y = 90 + rnd() * 700; }
    else if (band === 2) { x = 380 + rnd() * 520; y = 60 + rnd() * 110; }
    else { x = 120 + rnd() * 1040; y = 780 + rnd() * 80; }
    out.push({ x: x, y: y, s: 0.8 + rnd() * 0.7, r: (rnd() - 0.5) * 1.2,
               ph: rnd() * Math.PI * 2, cy: (i % 2 === 0) ? 1 : 2 });
  }
  return out;
}
var SPRIGS = [sprigTable(14), sprigTable(14), sprigTable(14)];
if (SPRIGS[0].length !== 14 || SPRIGS[1].length !== 14 || SPRIGS[2].length !== 14)
  throw new Error('each ground must hold exactly 14 sprigs');

// ---- character table: fixed rotation of 3, prompt order -
var CHARS = [
  { ground: PINKG, skin: SKIN1 },
  { ground: LEMONG, skin: SKIN2 },
  { ground: TANG, skin: SKIN3 }
];
if (CHARS.length !== 3) throw new Error('exactly 3 authored characters');

// ---- state ------------------------------------------------
var cur = 0;             // character on show
var from = 0;            // outgoing character during a slide
var transT = -10;        // anchored-clock start of the slide
var TRANS_LEN = 1.1;
var lastNow = -1, acc = 0;

// QA hooks via the renderer's query string (?seed=...):
// char=N starts the piece on character N, settled.
// Default play is unaffected.
var QS = (typeof location !== 'undefined' && location.search) || '';
var cm = QS.match(/char=(\d+)/);
if (cm) { cur = clampN(parseInt(cm[1], 10)); from = cur; }
function clampN(n) { return ((n % 3) + 3) % 3; }

// ---- small helpers ---------------------------------------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function ell(x, y, rx, ry, rot, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function circ(x, y, r, col) { ell(x, y, r, r, 0, col); }
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function rr(x, y, w, h, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath(); ctx.fill();
}
function outl(lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw || 6; ctx.lineJoin = 'round'; ctx.stroke(); }
function ellO(x, y, rx, ry, rot, col, lw) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fillStyle = col; ctx.fill(); outl(lw);
}
function seg(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function curve(x1, y1, cx, cy, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}
function pathOf(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
}

// ---- hand-lettered stroke-path capitals ------------------
// Same marker hand as the set: unit-box polylines,
// bowls as sampled arcs, weight proportional to size.
// Only FRESH is needed in this piece.
function arcPts(cx, cy, rx, ry, a0, a1, n) {
  var pts = [], i, a;
  for (i = 0; i <= n; i++) {
    a = a0 + (a1 - a0) * i / n;
    pts.push(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry);
  }
  return pts;
}
function cubicPts(p0, p1, p2, p3, n) {
  var pts = [], i, t, mt;
  for (i = 0; i <= n; i++) {
    t = i / n; mt = 1 - t;
    pts.push(
      mt * mt * mt * p0[0] + 3 * mt * mt * t * p1[0] + 3 * mt * t * t * p2[0] + t * t * t * p3[0],
      mt * mt * mt * p0[1] + 3 * mt * mt * t * p1[1] + 3 * mt * t * t * p2[1] + t * t * t * p3[1]
    );
  }
  return pts;
}
function catPts() {
  var out = [], i, a = arguments;
  for (i = 0; i < a.length; i++) out = out.concat(a[i]);
  return out;
}
var LETTERS = {
  'F': { w: 0.62, s: [[0, 1, 0, 0, 0.60, 0], [0, 0.52, 0.48, 0.52]] },
  'R': { w: 0.72, s: [[0, 1, 0, 0],
                      catPts([0, 0, 0.26, 0], arcPts(0.26, 0.26, 0.34, 0.26, -Math.PI / 2, Math.PI / 2, 9), [0.26, 0.52, 0, 0.52]),
                      [0.32, 0.52, 0.70, 1]] },
  'E': { w: 0.64, s: [[0.62, 0, 0, 0, 0, 1, 0.64, 1], [0, 0.5, 0.52, 0.5]] },
  'S': { w: 0.68, s: [catPts(cubicPts([0.62, 0.16], [0.45, -0.04], [0.08, 0.06], [0.12, 0.30], 8),
                             cubicPts([0.12, 0.30], [0.16, 0.52], [0.60, 0.44], [0.62, 0.68], 8),
                             cubicPts([0.62, 0.68], [0.64, 0.94], [0.28, 1.06], [0.08, 0.84], 8))] },
  'H': { w: 0.76, s: [[0, 0, 0, 1], [0.76, 0, 0.76, 1], [0, 0.5, 0.76, 0.5]] }
};
var SPACE_W = 0.42;
var JIT = [[0.010, 0.004], [-0.014, -0.003], [0.006, 0.006], [-0.008, 0.002],
           [0.013, -0.005], [-0.005, 0.003], [0.009, -0.002], [-0.011, 0.005]];
function wordWidth(str, h) {
  var w = 0, i, L;
  for (i = 0; i < str.length; i++) {
    if (str[i] === ' ') { w += SPACE_W * h; continue; }
    L = LETTERS[str[i]];
    if (!L) continue;
    w += L.w * h + 0.16 * h;
  }
  return w > 0 ? w - 0.16 * h : 0;
}
function strokeWord(str, x, y, h, col, seedOff) {
  ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(2, h * 0.16);
  var cx = x, i, j, L, jit;
  for (i = 0; i < str.length; i++) {
    if (str[i] === ' ') { cx += SPACE_W * h; continue; }
    L = LETTERS[str[i]];
    if (!L) continue;
    jit = JIT[(i + (seedOff || 0)) % JIT.length];
    ctx.save();
    ctx.translate(cx + L.w * h / 2, y + h / 2);
    ctx.rotate(jit[0]);
    ctx.translate(-L.w * h / 2, -h / 2 + jit[1] * h);
    for (j = 0; j < L.s.length; j++) {
      var raw = L.s[j], pts = [], k;
      for (k = 0; k < raw.length; k += 2) pts.push(raw[k] * h, raw[k + 1] * h);
      pathOf(pts); ctx.stroke();
    }
    ctx.restore();
    cx += L.w * h + 0.16 * h;
  }
}

// ---- fruit recipes (path data, drawn per frame) ----------
// Watermelon slice: dome up, rind along the rim.
function sliceMotif(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0); ctx.closePath();
  ctx.fillStyle = MELON; ctx.fill(); outl(5);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.80, Math.PI, 0); ctx.closePath();
  ctx.fillStyle = MELON; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0);
  ctx.strokeStyle = RIND; ctx.lineWidth = r * 0.22; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.86, Math.PI, 0); ctx.closePath();
  ctx.fillStyle = MELON; ctx.fill();
  var seeds = [[-0.45, -0.30], [0, -0.52], [0.42, -0.28], [-0.18, -0.14], [0.22, -0.12]];
  for (var i = 0; i < seeds.length; i++) ell(seeds[i][0] * r, seeds[i][1] * r, r * 0.07, r * 0.11, seeds[i][0], INK);
  ctx.restore();
}
function lemonMotif(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  ellO(0, 0, 30 * s, 21 * s, 0, LEMONG, 5);
  circ(-29 * s, 0, 4.5 * s, INK); circ(29 * s, 0, 4.5 * s, INK);
  ellO(14 * s, -22 * s, 13 * s, 7 * s, -0.6, RIND, 4);
  ctx.restore();
}
function bananaPath(scale) {
  // crescent in a ~ (24 x 84) box, tip at top
  var s = scale;
  ctx.beginPath();
  ctx.moveTo(0, -42 * s);
  ctx.quadraticCurveTo(30 * s, -8 * s, 14 * s, 40 * s);
  ctx.quadraticCurveTo(6 * s, 47 * s, 0 * s, 40 * s);
  ctx.quadraticCurveTo(-12 * s, 2 * s, 0, -42 * s);
  ctx.closePath();
}
function bananaMotif(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  bananaPath(s); ctx.fillStyle = BANANA; ctx.fill(); outl(5);
  seg(0, -42 * s, 0, -50 * s, 6, INK);
  ctx.restore();
}
function leafPair(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  ellO(-10 * s, 0, 13 * s, 6 * s, -0.5, RIND, 4);
  ellO(10 * s, 0, 13 * s, 6 * s, 0.5 + Math.PI, RIND, 4);
  ctx.restore();
}
function drawSprigs(idx, lt) {
  var tab = SPRIGS[idx], i, sp, dx, dy;
  for (i = 0; i < tab.length; i++) {
    sp = tab[i];
    dx = Math.sin((lt / LOOP) * Math.PI * 2 * sp.cy + sp.ph) * 13;
    dy = Math.cos((lt / LOOP) * Math.PI * 2 * sp.cy + sp.ph * 1.7) * 9;
    if (idx === 0) sliceMotif(sp.x + dx, sp.y + dy, 21 * sp.s, sp.r);
    else if (idx === 1) lemonMotif(sp.x + dx, sp.y + dy, sp.s, sp.r);
    else bananaMotif(sp.x + dx, sp.y + dy, sp.s * 0.55, sp.r);
    leafPair(sp.x + dx + 16 * sp.s, sp.y + dy + 12 * sp.s, sp.s * 0.8, sp.r + 0.6);
  }
}

// ---- shared bust geometry ---------------------------------
var HEAD = { x: 640, y: 338, r: 146 };
function torsoPath() {
  ctx.beginPath();
  ctx.moveTo(452, 905);
  ctx.lineTo(466, 648);
  ctx.quadraticCurveTo(472, 556, 566, 540);
  ctx.lineTo(714, 540);
  ctx.quadraticCurveTo(808, 556, 814, 648);
  ctx.lineTo(828, 905);
  ctx.closePath();
}
function drawNeck(skin) {
  rect(606, 452, 68, 108, skin);
  ctx.strokeStyle = INK; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(606, 470); ctx.lineTo(606, 552); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(674, 470); ctx.lineTo(674, 552); ctx.stroke();
}
function drawFaceBase(skin) {
  ellO(HEAD.x, HEAD.y, HEAD.r, HEAD.r * 1.04, 0, skin, 6);
  ellO(HEAD.x - HEAD.r - 2, HEAD.y + 8, 25, 31, 0, skin, 5);   // ears
  ellO(HEAD.x + HEAD.r + 2, HEAD.y + 8, 25, 31, 0, skin, 5);
}
function drawFacePlain() {
  circ(HEAD.x - 52, HEAD.y + 6, 8, INK);
  circ(HEAD.x + 52, HEAD.y + 6, 8, INK);
  curve(HEAD.x - 74, HEAD.y - 26, HEAD.x - 54, HEAD.y - 36, HEAD.x - 32, HEAD.y - 27, 6, INK);
  curve(HEAD.x + 32, HEAD.y - 27, HEAD.x + 54, HEAD.y - 36, HEAD.x + 74, HEAD.y - 26, 6, INK);
  curve(HEAD.x - 4, HEAD.y + 34, HEAD.x + 2, HEAD.y + 44, HEAD.x - 2, HEAD.y + 52, 5, INK);
  ctx.beginPath(); ctx.arc(HEAD.x, HEAD.y + 52, 30, 0.25, Math.PI - 0.25); outl(6);
  ctx.globalAlpha = 0.45;
  ell(HEAD.x - 92, HEAD.y + 44, 19, 11, 0, PINKG);
  ell(HEAD.x + 92, HEAD.y + 44, 19, 11, 0, PINKG);
  ctx.globalAlpha = 1;
}
function smileOnly() {
  curve(HEAD.x - 4, HEAD.y + 40, HEAD.x + 2, HEAD.y + 48, HEAD.x - 2, HEAD.y + 54, 5, INK);
  ctx.beginPath(); ctx.arc(HEAD.x, HEAD.y + 54, 28, 0.3, Math.PI - 0.3); outl(6);
}
// earring pendulum: drawDrop(kind) is called with the
// origin at the ear anchor, rotated by the swing angle.
function earring(earX, earY, ang, kind) {
  ctx.save(); ctx.translate(earX, earY); ctx.rotate(ang);
  seg(0, 0, 0, 16, 4, INK);
  if (kind === 'leaf') {
    ellO(0, 38, 11, 20, 0.15, RIND, 4);
  } else if (kind === 'lemon') {
    ellO(0, 40, 17, 24, 0, LEMONG, 4);
    ellO(6, 20, 10, 5, -0.5, RIND, 3);
  } else { // banana pendant
    bananaPath(0.92); ctx.fillStyle = BANANA; ctx.fill(); outl(4);
    ctx.translate(0, 4);
  }
  ctx.restore();
}

// ---- character 1: watermelon hat + FRESH pear -------------
function drawChar1(lt) {
  var sw = Math.sin((lt / LOOP) * Math.PI * 2 * 4) * 0.30;
  // long black hair behind everything
  ctx.beginPath();
  ctx.moveTo(478, 250);
  ctx.quadraticCurveTo(470, 560, 486, 700);
  ctx.lineTo(560, 700);
  ctx.quadraticCurveTo(548, 480, 556, 330);
  ctx.lineTo(724, 330);
  ctx.quadraticCurveTo(732, 480, 720, 700);
  ctx.lineTo(794, 700);
  ctx.quadraticCurveTo(810, 560, 802, 250);
  ctx.quadraticCurveTo(640, 130, 478, 250);
  ctx.closePath();
  ctx.fillStyle = HAIR1; ctx.fill(); outl(6);
  drawNeck(SKIN1);
  // green top with a watermelon-slice print, clipped
  torsoPath(); ctx.fillStyle = RIND; ctx.fill(); outl(6);
  ctx.save(); torsoPath(); ctx.clip();
  var gx, gy, row = 0;
  for (gy = 585; gy < 890; gy += 92, row++) {
    for (gx = 500 + (row % 2) * 56; gx < 810; gx += 112) sliceMotif(gx, gy, 24, 0.1);
  }
  ctx.restore(); torsoPath(); outl(6);
  // arms: left rests down, right reaches to the pear
  ctx.strokeStyle = SKIN1; ctx.lineWidth = 30; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(486, 580); ctx.quadraticCurveTo(448, 690, 470, 800); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(792, 580); ctx.quadraticCurveTo(840, 636, 806, 694); ctx.stroke();
  // head + face
  drawFaceBase(SKIN1);
  // fringe: black cap low over the brow
  ctx.beginPath();
  ctx.moveTo(HEAD.x - HEAD.r, HEAD.y + 6);
  ctx.quadraticCurveTo(HEAD.x - HEAD.r, HEAD.y - HEAD.r - 20, HEAD.x, HEAD.y - HEAD.r - 14);
  ctx.quadraticCurveTo(HEAD.x + HEAD.r, HEAD.y - HEAD.r - 20, HEAD.x + HEAD.r, HEAD.y + 6);
  ctx.quadraticCurveTo(HEAD.x + 60, HEAD.y - 44, HEAD.x, HEAD.y - 30);
  ctx.quadraticCurveTo(HEAD.x - 60, HEAD.y - 44, HEAD.x - HEAD.r, HEAD.y + 6);
  ctx.closePath();
  ctx.fillStyle = HAIR1; ctx.fill(); outl(5);
  drawFacePlain();
  // watermelon bucket hat: red dome, rind band, green brim
  ctx.save(); ctx.translate(HEAD.x, 218);
  ctx.beginPath(); ctx.arc(0, 10, 128, Math.PI, 0); ctx.closePath();
  ctx.fillStyle = MELON; ctx.fill(); outl(6);
  ctx.beginPath(); ctx.arc(0, 10, 128, Math.PI * 1.06, Math.PI * 1.94);
  ctx.strokeStyle = MELON; ctx.lineWidth = 4; ctx.stroke();
  var sd = [[-72, -52], [-30, -78], [22, -84], [70, -50], [-48, -26], [4, -40], [52, -18], [-6, -96]];
  for (var i = 0; i < sd.length; i++) ell(sd[i][0], sd[i][1] + 10, 6, 9, sd[i][0] * 0.01, INK);
  ctx.beginPath();
  ctx.moveTo(-142, 16); ctx.lineTo(142, 16); ctx.lineTo(158, 52); ctx.lineTo(-158, 52); ctx.closePath();
  ctx.fillStyle = RIND; ctx.fill(); outl(6);
  ctx.restore();
  // earrings: leaf drops
  earring(HEAD.x - HEAD.r - 2, HEAD.y + 34, sw, 'leaf');
  earring(HEAD.x + HEAD.r + 2, HEAD.y + 34, -sw, 'leaf');
  // the FRESH pear, held in front of the torso
  ctx.save(); ctx.translate(800, 716);
  ctx.beginPath();
  ctx.moveTo(0, -58);
  ctx.bezierCurveTo(17, -58, 24, -38, 30, -22);
  ctx.bezierCurveTo(46, 4, 48, 20, 48, 38);
  ctx.bezierCurveTo(48, 68, 27, 84, 0, 84);
  ctx.bezierCurveTo(-27, 84, -48, 68, -48, 38);
  ctx.bezierCurveTo(-48, 20, -46, 4, -30, -22);
  ctx.bezierCurveTo(-24, -38, -17, -58, 0, -58);
  ctx.closePath();
  ctx.fillStyle = RIND; ctx.fill(); outl(6);
  curve(0, -58, 4, -76, 14, -84, 6, INK);
  ellO(22, -66, 17, 8, -0.5, LEMONG, 4);
  circ(2, 74, 15, SKIN1); outl(4); // thumb of the holding hand
  // FRESH stamp: red stamp band across the pear
  ctx.save(); ctx.translate(0, 16); ctx.rotate(-0.16);
  ctx.strokeStyle = SUNRED; ctx.lineWidth = 4;
  ctx.strokeRect(-56, -17, 112, 34);
  strokeWord('FRESH', -wordWidth('FRESH', 21) / 2, -10, 21, SUNRED, 1);
  ctx.restore();
  ctx.restore();
}

// ---- character 2: afro + lemon-print dress ---------------
function drawChar2(lt) {
  var sw = Math.sin((lt / LOOP) * Math.PI * 2 * 4 + 0.8) * 0.30;
  drawNeck(SKIN2);
  // pink dress with a lemon print, clipped
  torsoPath(); ctx.fillStyle = PINKG; ctx.fill(); outl(6);
  ctx.save(); torsoPath(); ctx.clip();
  var gx, gy, row = 0;
  for (gy = 592; gy < 895; gy += 96, row++) {
    for (gx = 498 + (row % 2) * 58; gx < 812; gx += 116) lemonMotif(gx, gy, 0.95, (row % 2 ? -0.3 : 0.25));
  }
  ctx.restore(); torsoPath(); outl(6);
  // arms at her sides
  ctx.strokeStyle = SKIN2; ctx.lineWidth = 30; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(488, 584); ctx.quadraticCurveTo(452, 700, 476, 806); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(792, 584); ctx.quadraticCurveTo(828, 700, 804, 806); ctx.stroke();
  // afro: a cluster of ink circles, one soft silhouette
  // behind the face (fill only, like the set's curl work)
  var acx = HEAD.x, acy = HEAD.y - 12, ai, aa;
  circ(acx, acy, 192, HAIR1);
  for (ai = 0; ai < 10; ai++) {
    aa = (ai / 10) * Math.PI * 2 + 0.31;
    circ(acx + Math.cos(aa) * 168, acy + Math.sin(aa) * 162, 61, HAIR1);
  }
  for (ai = 0; ai < 15; ai++) {
    aa = (ai / 15) * Math.PI * 2 + 0.10;
    circ(acx + Math.cos(aa) * 206, acy + Math.sin(aa) * 198, 41, HAIR1);
  }
  drawFaceBase(SKIN2);
  // red-lens sunglasses
  rr(HEAD.x - 128, HEAD.y - 38, 118, 92, 26, SUNRED); outl(6);
  rr(HEAD.x + 10, HEAD.y - 38, 118, 92, 26, SUNRED); outl(6);
  seg(HEAD.x - 10, HEAD.y - 6, HEAD.x + 10, HEAD.y - 6, 9, INK);
  seg(HEAD.x - 128, HEAD.y - 22, HEAD.x - HEAD.r + 4, HEAD.y - 30, 9, INK);
  seg(HEAD.x + 128, HEAD.y - 22, HEAD.x + HEAD.r - 4, HEAD.y - 30, 9, INK);
  ell(HEAD.x - 92, HEAD.y + 2, 20, 7, -0.5, LEMONG);
  ell(HEAD.x + 46, HEAD.y + 2, 20, 7, -0.5, LEMONG);
  smileOnly();
  ctx.globalAlpha = 0.4;
  ell(HEAD.x - 92, HEAD.y + 66, 19, 11, 0, PINKG);
  ell(HEAD.x + 92, HEAD.y + 66, 19, 11, 0, PINKG);
  ctx.globalAlpha = 1;
  // lemon-drop earrings
  earring(HEAD.x - HEAD.r - 2, HEAD.y + 34, sw, 'lemon');
  earring(HEAD.x + HEAD.r + 2, HEAD.y + 34, -sw, 'lemon');
}

// ---- character 3: banana earrings, scarf, toucan stack ----
function drawToucan(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  seg(6, 34, 16, 86, 9, INK); // tail
  ellO(0, 0, 34, 46, 0.12, INK, 5); // body
  ell(-6, 8, 17, 28, 0.1, LEMONG); // chest
  circ(14, -44, 25, INK); outl(5); // head
  ctx.beginPath(); // beak
  ctx.moveTo(32, -54);
  ctx.quadraticCurveTo(84, -52, 88, -34);
  ctx.quadraticCurveTo(60, -26, 34, -32);
  ctx.closePath();
  ctx.fillStyle = TANG; ctx.fill(); outl(5);
  circ(20, -50, 5, LEMONG);
  seg(-6, 44, -14, 56, 6, INK); seg(10, 44, 12, 56, 6, INK); // feet
  ctx.restore();
}
function drawChar3(lt) {
  var sw = Math.sin((lt / LOOP) * Math.PI * 2 * 4 + 1.6) * 0.34;
  // red hair masses at the sides, under the scarf
  ellO(HEAD.x - HEAD.r + 6, HEAD.y + 78, 44, 96, 0.08, HAIR3, 6);
  ellO(HEAD.x + HEAD.r - 6, HEAD.y + 78, 44, 96, -0.08, HAIR3, 6);
  drawNeck(SKIN3);
  // green top with a banana print, clipped
  torsoPath(); ctx.fillStyle = RIND; ctx.fill(); outl(6);
  ctx.save(); torsoPath(); ctx.clip();
  var gx, gy, row = 0;
  for (gy = 600; gy < 895; gy += 100, row++) {
    for (gx = 506 + (row % 2) * 58; gx < 806; gx += 116) bananaMotif(gx, gy, 0.62, (row % 2 ? 0.5 : -0.4));
  }
  ctx.restore(); torsoPath(); outl(6);
  ctx.strokeStyle = SKIN3; ctx.lineWidth = 30; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(488, 584); ctx.quadraticCurveTo(452, 700, 476, 806); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(792, 584); ctx.quadraticCurveTo(828, 700, 804, 806); ctx.stroke();
  drawFaceBase(SKIN3);
  // yellow polka-dot headscarf over the top of the head
  ctx.beginPath();
  ctx.moveTo(HEAD.x - HEAD.r - 4, HEAD.y + 26);
  ctx.quadraticCurveTo(HEAD.x - HEAD.r - 10, HEAD.y - HEAD.r - 26, HEAD.x, HEAD.y - HEAD.r - 22);
  ctx.quadraticCurveTo(HEAD.x + HEAD.r + 10, HEAD.y - HEAD.r - 26, HEAD.x + HEAD.r + 4, HEAD.y + 26);
  ctx.quadraticCurveTo(HEAD.x + 70, HEAD.y - 34, HEAD.x, HEAD.y - 26);
  ctx.quadraticCurveTo(HEAD.x - 70, HEAD.y - 34, HEAD.x - HEAD.r - 4, HEAD.y + 26);
  ctx.closePath();
  ctx.fillStyle = BANANA; ctx.fill(); outl(6);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(HEAD.x - HEAD.r - 4, HEAD.y + 26);
  ctx.quadraticCurveTo(HEAD.x - HEAD.r - 10, HEAD.y - HEAD.r - 26, HEAD.x, HEAD.y - HEAD.r - 22);
  ctx.quadraticCurveTo(HEAD.x + HEAD.r + 10, HEAD.y - HEAD.r - 26, HEAD.x + HEAD.r + 4, HEAD.y + 26);
  ctx.quadraticCurveTo(HEAD.x + 70, HEAD.y - 34, HEAD.x, HEAD.y - 26);
  ctx.quadraticCurveTo(HEAD.x - 70, HEAD.y - 34, HEAD.x - HEAD.r - 4, HEAD.y + 26);
  ctx.closePath(); ctx.clip();
  var dots = [[-96, -96], [-38, -126], [30, -118], [92, -88], [-64, -56], [8, -70], [70, -40], [-110, -34], [118, -30], [-14, -128]];
  for (var i = 0; i < dots.length; i++) circ(HEAD.x + dots[i][0], HEAD.y + dots[i][1], 11, LEMONG);
  ctx.restore();
  ellO(HEAD.x - 118, HEAD.y - 118, 27, 22, -0.4, BANANA, 5); // scarf knot
  // pink round sunglasses
  ctx.beginPath(); ctx.arc(HEAD.x - 56, HEAD.y + 10, 53, 0, Math.PI * 2);
  ctx.fillStyle = INK; ctx.fill();
  ctx.strokeStyle = PINKG; ctx.lineWidth = 13; ctx.stroke();
  ctx.beginPath(); ctx.arc(HEAD.x + 56, HEAD.y + 10, 53, 0, Math.PI * 2);
  ctx.fillStyle = INK; ctx.fill();
  ctx.strokeStyle = PINKG; ctx.lineWidth = 13; ctx.stroke();
  seg(HEAD.x - 4, HEAD.y + 2, HEAD.x + 4, HEAD.y + 2, 11, PINKG);
  seg(HEAD.x - 106, HEAD.y - 2, HEAD.x - HEAD.r + 6, HEAD.y - 12, 10, PINKG);
  seg(HEAD.x + 106, HEAD.y - 2, HEAD.x + HEAD.r - 6, HEAD.y - 12, 10, PINKG);
  ell(HEAD.x - 74, HEAD.y - 8, 16, 6, -0.6, PINKG);
  ell(HEAD.x + 38, HEAD.y - 8, 16, 6, -0.6, PINKG);
  smileOnly();
  ctx.globalAlpha = 0.45;
  ell(HEAD.x - 92, HEAD.y + 62, 19, 11, 0, PINKG);
  ell(HEAD.x + 92, HEAD.y + 62, 19, 11, 0, PINKG);
  ctx.globalAlpha = 1;
  // banana-pendant earrings
  earring(HEAD.x - HEAD.r - 2, HEAD.y + 34, sw, 'banana');
  earring(HEAD.x + HEAD.r + 2, HEAD.y + 34, -sw, 'banana');
  // fruit stack on the scarf, toucan perched on top
  sliceMotif(HEAD.x - 26, 178, 58, 0);
  lemonMotif(HEAD.x + 44, 168, 1.15, 0.3);
  bananaMotif(HEAD.x + 2, 128, 0.8, 0.9);
  drawToucan(HEAD.x + 112, 102, 1.0);
}

var DRAWERS = [drawChar1, drawChar2, drawChar3];

// ---- the slide spring --------------------------------------
// Underdamped analytic spring on fixed ticks: p goes
// 0 -> 1 with a small overshoot, settled by TRANS_LEN.
function springP(t) {
  if (t <= 0) return 0;
  if (t >= TRANS_LEN) return 1;
  var zw = 5.5, wd = 10;
  return 1 - Math.exp(-zw * t) * (Math.cos(wd * t) + (zw / wd) * Math.sin(wd * t));
}

function drawScene(idx, lt, alpha) {
  ctx.save();
  if (alpha < 1) ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  rect(-2400, -2400, DW + 4800, DH + 4800, CHARS[idx].ground);
  drawSprigs(idx, lt);
  ctx.restore();
}
function drawFigure(idx, lt, xOff) {
  var sway = Math.sin((lt / LOOP) * Math.PI * 2) * (2 * Math.PI / 180);
  ctx.save();
  ctx.translate(640 + xOff, 895);
  ctx.rotate(sway);
  ctx.translate(-640, -895);
  DRAWERS[idx](lt);
  ctx.restore();
}

function draw() {
  var lt = T % LOOP;
  var p = (T - transT < TRANS_LEN) ? springP(T - transT) : 1;
  if (p < 1) {
    // outgoing ground full, incoming ground cross-fades,
    // outgoing figure slides left, incoming from the right
    drawScene(from, lt, 1);
    drawScene(cur, lt, p);
    drawFigure(from, lt, -DW * p);
    drawFigure(cur, lt, DW * (1 - p));
  } else {
    drawScene(cur, lt, 1);
    drawFigure(cur, lt, 0);
  }
}

// ---- step ---------------------------------------------------
function step() {
  // Nothing integrates: slide and ambient motion are
  // pure functions of the anchored clock.
}

// ---- pointer: tap = next character --------------------------
var downX = -1, downY = -1, downT = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved >= 28 || held >= 0.8) return;
  if (T - transT < TRANS_LEN) return;   // one slide at a time
  from = cur;
  cur = (cur + 1) % CHARS.length;
  transT = T;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; });

// ---- sizing: full-bleed cover fit ---------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  rect(0, 0, W, H, CHARS[cur].ground);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
