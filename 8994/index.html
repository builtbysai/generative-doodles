<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№8994 · Half-Moon Dots - Generative Doodles</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #17171e; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// №8994 - Half-Moon Dots
// A breathing dotted field crossed by a slowly rotating crescent window that
// waxes and wanes. Dots straddling the window edge are drawn bisected (half in
// each tone) and slightly enlarged, so the boundary itself becomes the subject.
// Plain canvas, no dependencies. Seeded RNG: the layout is deterministic.

// ---------- tiny utils ----------
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// hash-based value noise, deterministic per seed
function hash2(ix, iy, seed) {
  let h = (ix * 374761393 + iy * 668265263 + seed * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function vnoise(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, seed), b = hash2(ix + 1, iy, seed);
  const c = hash2(ix, iy + 1, seed), d = hash2(ix + 1, iy + 1, seed);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

// ---------- configuration ----------
const CFG = {
  seed: 11,
  bg: '#17171e',          // ink ground
  fg: '#e9dec3',          // bone dots
  spacing: 34,            // dot grid pitch, px
  rBase: 0.30,            // dot radius as fraction of spacing
  breath: 0.45,           // breathing amplitude
  innerScale: 0.94,       // dots inside the window run slightly smaller
  edgeBoost: 0.5,         // edge-straddling dots are enlarged
  band: 0.7,              // edge band width, in units of spacing
  jitter: 0.16,           // positional jitter, in units of spacing
  R: 0.30,                // crescent outer radius, fraction of min(w,h)
  rB: 0.58,               // inner disc radius, fraction of R
  dMin: 0.16, dMax: 0.38, // inner-disc offset range, fraction of R (waxing)
  Trot: 84,               // full rotation, seconds
  Twax: 47,               // wax/wane cycle, seconds
  theta0: 0.7             // opening orientation, radians
};

// ---------- crescent window geometry ----------
// inside(x,y), dist(x,y) signed (negative inside), fillPath(c).
function crescentGeom(cx, cy, R, rB, d, th) {
  const bx = cx + d * Math.cos(th), by = cy + d * Math.sin(th);
  return {
    inside(x, y) {
      const dA = Math.hypot(x - cx, y - cy) - R;
      const dB = Math.hypot(x - bx, y - by) - rB;
      return dA < 0 && dB > 0;
    },
    dist(x, y) {
      const dA = Math.hypot(x - cx, y - cy) - R;
      const dB = Math.hypot(x - bx, y - by) - rB;
      const inW = dA < 0 && dB > 0;
      let m = Infinity;
      if (dB > 0) m = Math.min(m, Math.abs(dA)); // outer arc is real only outside disc B
      if (dA < 0) m = Math.min(m, Math.abs(dB)); // inner arc is real only inside disc A
      return inW ? -m : m;
    },
    fillPath(c) {
      c.beginPath();
      c.arc(cx, cy, R, 0, TAU);
      c.arc(bx, by, rB, 0, TAU);
      c.fill('evenodd'); // disc B sits strictly inside disc A, so this is the crescent
    }
  };
}

function makeGeom(t, W, H) {
  const cx = W / 2, cy = H / 2;
  const R = CFG.R * Math.min(W, H);
  const rB = CFG.rB * R;
  const wax = 0.5 + 0.5 * Math.sin(TAU * t / CFG.Twax);
  const d = R * (CFG.dMin + (CFG.dMax - CFG.dMin) * wax);
  const th = CFG.theta0 + TAU * t / CFG.Trot;
  return crescentGeom(cx, cy, R, rB, d, th);
}

// ---------- canvases ----------
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const dotCanvas = document.createElement('canvas');  // dot mask layer
const dctx = dotCanvas.getContext('2d');
const toneCanvas = document.createElement('canvas'); // two-tone color layer
const mctx = toneCanvas.getContext('2d');

let W = 0, H = 0, dots = [];

function buildField() {
  dots = [];
  const rand = mulberry32(CFG.seed);
  const s = CFG.spacing, j = CFG.jitter * s;
  for (let gy = s * 0.5; gy < H + s; gy += s) {
    for (let gx = s * 0.5; gx < W + s; gx += s) {
      dots.push({
        x: gx + (rand() * 2 - 1) * j,
        y: gy + (rand() * 2 - 1) * j,
        ph: rand() * TAU
      });
    }
  }
}

function resize() {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const cv of [canvas, dotCanvas, toneCanvas]) {
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
  }
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildField();
}
window.addEventListener('resize', resize);

// ---------- frame ----------
function frame(now) {
  const t = now / 1000;
  const geom = makeGeom(t, W, H);
  const s = CFG.spacing, bandW = s * CFG.band;

  // 1. dot mask: white dots, breathing radii, edge dots enlarged
  dctx.clearRect(0, 0, W, H);
  dctx.fillStyle = '#fff';
  dctx.beginPath();
  for (let i = 0; i < dots.length; i++) {
    const dot = dots[i];
    const n = vnoise(dot.x * 0.007 + t * 0.05, dot.y * 0.007 - t * 0.023, CFG.seed);
    let r = s * CFG.rBase * (1 + CFG.breath * (n - 0.5) * 2);
    r *= 1 + 0.10 * Math.sin(t * 0.45 + dot.ph);
    const sd = geom.dist(dot.x, dot.y);
    if (sd < 0) r *= CFG.innerScale;
    const ad = Math.abs(sd);
    if (ad < bandW) {
      const f = 1 - ad / bandW;
      const e = f * f * (3 - 2 * f);
      r *= 1 + CFG.edgeBoost * e;
    }
    if (r > 0.4) {
      dctx.moveTo(dot.x + r, dot.y);
      dctx.arc(dot.x, dot.y, r, 0, TAU);
    }
  }
  dctx.fill();

  // 2. two-tone layer: fg outside the window, bg inside it, masked by the dots.
  //    A dot straddling the edge is bisected by construction.
  mctx.clearRect(0, 0, W, H);
  mctx.globalCompositeOperation = 'source-over';
  mctx.fillStyle = CFG.fg;
  mctx.fillRect(0, 0, W, H);
  mctx.fillStyle = CFG.bg;
  geom.fillPath(mctx);
  mctx.globalCompositeOperation = 'destination-in';
  mctx.drawImage(dotCanvas, 0, 0, W, H);
  mctx.globalCompositeOperation = 'source-over';

  // 3. main: bg ground, inverted window ground, then the dot layer
  ctx.fillStyle = CFG.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = CFG.fg;
  geom.fillPath(ctx);
  ctx.drawImage(toneCanvas, 0, 0, W, H);

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
