<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potato-Bag Automatism</title>
<style>
  html,body{margin:0;padding:0;background:#B98F5E;overflow:hidden;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var KRAFT = '#B98F5E', INK = '#14100C', SHEEN = '#D6C199', CREASE = '#7A8CA3';
var canvas = document.getElementById('c');

/* Seeded PRNG (mulberry32). The walker, creases, pipes and panel
   decorations all draw from this one stream, in a fixed order, so
   every load generates the same drawing. Never Math.random. */
var seed = 1308000;
function rnd(){
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

var STEP = 7, PANEL = 520;
var pts = [];
var px = 0, py = 450, theta = 0;
var curPanel = 0, panelTarget = 450;
var pipes = [], nextPipeX = 700 + rnd() * 500;
var panels = {};
var sheenIdx = [];

function panelFor(x){ return Math.floor(x / PANEL); }

function ensurePanels(upToX){
  var k = 0;
  while (k * PANEL <= upToX){
    if (!panels[k]){
      var creases = [], nc = 2 + Math.floor(rnd() * 2), ci, si, cx, cy, seg;
      for (ci = 0; ci < nc; ci++){
        seg = [];
        cx = k * PANEL + rnd() * PANEL; cy = rnd() * 900;
        seg.push({x: cx, y: cy});
        var nseg = 5 + Math.floor(rnd() * 5);
        for (si = 0; si < nseg; si++){
          cx += 30 + rnd() * 60; cy += (rnd() - 0.5) * 130;
          if (cy < 0) cy = 0; if (cy > 900) cy = 900;
          seg.push({x: cx, y: cy});
        }
        creases.push(seg);
      }
      var tabs = [], nt = 1 + Math.floor(rnd() * 2), ti;
      for (ti = 0; ti < nt; ti++){
        tabs.push({
          x: k * PANEL + rnd() * (PANEL - 60),
          y: rnd() < 0.5 ? rnd() * 60 : 840 + rnd() * 50,
          w: 34 + rnd() * 30, h: 12 + rnd() * 8
        });
      }
      panels[k] = {creases: creases, tabs: tabs};
    }
    k++;
  }
}

function ensurePipes(upToX){
  while (nextPipeX <= upToX){
    pipes.push({x: nextPipeX, y: 270 + rnd() * 360, r: 18 + rnd() * 14});
    nextPipeX += 900 + rnd() * 500;
  }
}

function step(){
  var idx = pts.length;
  var k = panelFor(px);
  if (k !== curPanel){
    panelTarget = 0.6 * py + 0.4 * 450;
    curPanel = k;
  }
  theta += (rnd() - 0.5) * 0.7;
  var frac = (px - curPanel * PANEL) / PANEL;
  if (frac < 0.35) theta += (panelTarget - py) / 900 * 0.22;
  theta += (450 - py) / 900 * 0.06;
  if (theta > 1.45) theta = 1.45;
  if (theta < -1.45) theta = -1.45;
  var cx = px + STEP * Math.cos(theta);
  var cy = py + STEP * Math.sin(theta);
  if (cy < 140 || cy > 760){
    theta = (cy < 140) ? Math.abs(theta) * 0.5 + 0.35 : -(Math.abs(theta) * 0.5 + 0.35);
    cx = px + STEP * Math.cos(theta);
    cy = py + STEP * Math.sin(theta);
  }
  var pi, p, dx, dy, d, ang, t1, t2, tt, ddx, ddy, dd;
  for (pi = 0; pi < pipes.length; pi++){
    p = pipes[pi];
    if (Math.abs(p.x - cx) < p.r + 30){
      dx = cx - p.x; dy = cy - p.y; d = Math.sqrt(dx * dx + dy * dy);
      if (d < p.r + 10){
        ang = Math.atan2(dy, dx);
        t1 = ang + Math.PI / 2; t2 = ang - Math.PI / 2;
        tt = (Math.cos(t1) > Math.cos(t2)) ? t1 : t2;
        if (tt > 1.45) tt = 1.45;
        if (tt < -1.45) tt = -1.45;
        theta = tt;
        cx = px + STEP * Math.cos(theta);
        cy = py + STEP * Math.sin(theta);
        ddx = cx - p.x; ddy = cy - p.y; dd = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dd < p.r + 10 && dd > 0){
          cx = p.x + ddx / dd * (p.r + 10);
          cy = p.y + ddy / dd * (p.r + 10);
        }
      }
    }
  }
  if (idx > 90){
    var j, q, qx, qy, cross;
    for (j = Math.max(0, idx - 500); j < idx - 80; j += 3){
      q = pts[j];
      if (!q) continue;
      qx = cx - q.x; qy = cy - q.y;
      if (qx * qx + qy * qy < 900){
        cross = Math.cos(theta) * qy - Math.sin(theta) * qx;
        theta += (cross > 0 ? -0.9 : 0.9);
        if (theta > 1.45) theta = 1.45;
        if (theta < -1.45) theta = -1.45;
        cx = px + STEP * Math.cos(theta);
        cy = py + STEP * Math.sin(theta);
        break;
      }
    }
  }
  px = cx; py = cy;
  pts.push({x: px, y: py});
  if (idx % 170 === 0) sheenIdx.push(idx);
}

function ensurePath(upToX){
  while (px < upToX) step();
}

function lowerBound(x){
  var lo = 0, hi = pts.length - 1, mid;
  while (lo < hi){
    mid = (lo + hi) >> 1;
    if (pts[mid].x < x) lo = mid + 1; else hi = mid;
  }
  return lo;
}

function viewport(){
  var w = 1280, h = 900;
  try {
    if (typeof visualViewport !== 'undefined' && visualViewport){
      w = visualViewport.width; h = visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth){
      w = window.innerWidth; h = window.innerHeight;
    }
  } catch (e){}
  return {w: w, h: h};
}

var scrubTotal = 0, dragging = false, lastDragX = 0;
function dragX(e){
  if (e.clientX !== undefined) return e.clientX;
  if (e.touches && e.touches[0]) return e.touches[0].clientX;
  return 0;
}
function onDown(e){
  dragging = true; lastDragX = dragX(e);
  try { if (e.preventDefault) e.preventDefault(); } catch (err){}
}
function onMove(e){
  if (!dragging) return;
  var x = dragX(e);
  scrubTotal += (x - lastDragX) * 1.5;
  lastDragX = x;
  try { if (e.preventDefault) e.preventDefault(); } catch (err){}
}
function onUp(){
  dragging = false;
}
try {
  if (canvas.addEventListener){
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
} catch (e){}
try {
  if (typeof window !== 'undefined' && window.addEventListener){
    window.addEventListener('resize', function(){ draw(clockT); });
  }
} catch (e){}

var clockT = 0;

function draw(t){
  clockT = t;
  var vp = viewport();
  var W = vp.w, H = vp.h;
  var dpr = 1;
  try {
    if (typeof window !== 'undefined' && window.devicePixelRatio){
      dpr = Math.min(2, window.devicePixelRatio);
    }
  } catch (e){}
  var bw = Math.round(W * dpr), bh = Math.round(H * dpr);
  if (canvas.width !== bw || canvas.height !== bh){
    canvas.width = bw; canvas.height = bh;
  }
  try { canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; } catch (e){}
  try { if (document && document.body && document.body.style) document.body.style.background = KRAFT; } catch (e){}
  var ctx = canvas.getContext('2d');
  try { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); } catch (e){}
  var sy = H / 900;
  var viewX = 40 * t - scrubTotal;
  if (viewX < 0) viewX = 0;
  var penX = viewX + W - 30;
  var upToX = viewX + W + 80;
  ensurePanels(upToX);
  ensurePipes(upToX);
  ensurePath(upToX);
  function X(x){ return x - viewX; }
  function Y(y){ return y * sy; }

  ctx.fillStyle = KRAFT;
  ctx.fillRect(0, 0, W, H);

  var k0 = panelFor(viewX) - 1, k1 = panelFor(viewX + W) + 1, k, ci, si, seg, ti, tab;
  ctx.strokeStyle = CREASE;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.22;
  for (k = k0; k <= k1; k++){
    if (!panels[k]) continue;
    for (ci = 0; ci < panels[k].creases.length; ci++){
      seg = panels[k].creases[ci];
      ctx.beginPath();
      ctx.moveTo(X(seg[0].x), Y(seg[0].y));
      for (si = 1; si < seg.length; si++) ctx.lineTo(X(seg[si].x), Y(seg[si].y));
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = SHEEN;
  ctx.globalAlpha = 0.35;
  for (k = k0; k <= k1; k++){
    if (!panels[k]) continue;
    for (ti = 0; ti < panels[k].tabs.length; ti++){
      tab = panels[k].tabs[ti];
      ctx.fillRect(X(tab.x), Y(tab.y), tab.w, tab.h * sy);
    }
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.45;
  var bx, yy;
  for (k = Math.max(1, k0); k <= k1; k++){
    bx = X(k * PANEL);
    if (bx < -10 || bx > W + 10) continue;
    for (yy = 0; yy < 110; yy += 14){
      ctx.beginPath();
      ctx.moveTo(bx, Y(yy));
      ctx.lineTo(bx, Y(yy + 8));
      ctx.stroke();
    }
    for (yy = 790; yy < 900; yy += 14){
      ctx.beginPath();
      ctx.moveTo(bx, Y(yy));
      ctx.lineTo(bx, Y(yy + 8));
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  var pi2, p;
  ctx.strokeStyle = CREASE;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.4;
  for (pi2 = 0; pi2 < pipes.length; pi2++){
    p = pipes[pi2];
    if (X(p.x) < -p.r - 10 || X(p.x) > W + p.r + 10) continue;
    ctx.beginPath();
    ctx.moveTo(X(p.x) + p.r, Y(p.y));
    ctx.arc(X(p.x), Y(p.y), p.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  var start = lowerBound(viewX - 20);
  var end = lowerBound(penX);
  if (end >= pts.length) end = pts.length - 1;
  var penY = 450;
  if (end > 0 && end < pts.length){
    var a = pts[end - 1], b = pts[end];
    if (b.x > a.x){
      var fr = (penX - a.x) / (b.x - a.x);
      penY = a.y + (b.y - a.y) * fr;
    } else {
      penY = b.y;
    }
  }
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (start < pts.length){
    ctx.moveTo(X(pts[start].x), Y(pts[start].y));
    var ii;
    for (ii = start + 1; ii < end; ii++) ctx.lineTo(X(pts[ii].x), Y(pts[ii].y));
    ctx.lineTo(X(penX), Y(penY));
    ctx.stroke();
  }

  ctx.strokeStyle = SHEEN;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.5;
  var si2, sidx, sp, sq;
  for (si2 = 0; si2 < sheenIdx.length; si2++){
    sidx = sheenIdx[si2];
    if (sidx < start || sidx + 3 >= end) continue;
    sp = pts[sidx]; sq = pts[sidx + 3];
    ctx.beginPath();
    ctx.moveTo(X(sp.x), Y(sp.y));
    ctx.lineTo(X(sq.x), Y(sq.y));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(X(penX) + 4.5, Y(penY));
  ctx.arc(X(penX), Y(penY), 4.5, 0, Math.PI * 2);
  ctx.fill();
}

draw(0);

var started = false, startTs = 0;
function loop(ts){
  if (!started){ started = true; startTs = ts; }
  draw((ts - startTs) / 1000);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
