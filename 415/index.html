<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.415 Neon Shoe</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FF1E78; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.415 Neon Shoe (yeti-iglesias, EXPANSION #44).
// After Yeti Iglesias's client-maximalism mode (the
// Vans MX collab): a giant white sneaker on a
// black-and-white checkerboard floor under a hot pink
// sky, neon green and black leaves, five giant
// watching eyes on leaf stems, a watermelon slice, a
// pink hand holding a huge black pencil, and a small
// black cat in pink headphones perched on the shoe's
// toe, phone in paws. Brick-wall line doodles float
// in the sky. DRAG horizontally and the whole scene
// pans like a diorama: every layer is DATA drawn per
// frame on the one canvas at its own parallax factor
// (sky and brick doodles 0.3x, leaves and eyes 0.6x,
// shoe, floor and cat 1.0x); the layers are drawn
// wider than the design field so a clamped pan
// reveals more bricks and leaves at the edges and no
// layer edge ever shows. Release and a spring eases
// the pan back, snapping to exactly zero offset.
// Ambient 30s loop: the five eyes blink at FIXED
// STAGGERED SLOTS (one eye at a time, never two
// together), the leaves sway on whole cycles, the
// sparkles twinkle on whole cycles, and the cat's
// phone screen flickers in FLAT ALPHA STEPS on a
// fixed 4-step schedule, never runtime random. The
// checkerboard is exactly 8 perspective rows. Grain
// is fixed dot DATA: exactly 600 speckle dots drawn
// in table order every frame. The only lettering is
// her hand-lettered "Yeti" signature bottom-right,
// drawn as STROKE PATHS (no font text), the set's
// designed-text exception. Frame one is drawn at the
// constant phase T = 12.06s (eye 3 of 5 caught
// mid-blink at its fixed slot, phone lit); the clock
// is anchored there and advances in fixed 1/60 ticks,
// never from a wall clock. Flat colour only, one
// canvas, no offscreen canvas, no gradients, no
// shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Hot pink sky; shoe and checkerboard black / white;
// leaves neon green and black; eye irises pink and
// teal; watermelon red; pencil black with purple
// stripes (the set purple); cat black, headphones and
// hand pink. Nothing else.
var SKY = '#FF1E78', WHITE = '#FFFFFF', BLACK = '#111111';
var NEON = '#39FF14', PINK = '#FF4FA3', TEAL = '#1FA3A3';
var MELON = '#FF3B3B', HAND = '#FF9ECF', PURPLE = '#9B30FF';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30;
if (LOOP !== 30) throw new Error('Neon Shoe ambient loop must be 30s');
var TICK = 1 / 60;
var HORIZON = 600;

// ---- seeded data ----------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
function makeRng(seedStart) {
  var s = seedStart;
  return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---- sky layer (parallax 0.3): brick doodles, sparkles --
// Brick-wall line doodle patches: clusters of small
// outlined bricks, line segments only, spread wider
// than the field so the pan reveals more at the edges.
var BRICKS = [
  { x: -210, y: 150 }, { x: 210, y: 96 }, { x: 560, y: 210 },
  { x: 830, y: 80 }, { x: 1180, y: 170 }, { x: 1470, y: 110 }
];
// Sparkle seasoning in the sky, twinkling on whole
// cycles of the 30s loop.
var SPARKS = [];
(function () {
  var rng = makeRng(4153);
  var spots = [
    [-90, 300], [120, 60], [420, 300], [700, 40], [980, 300],
    [1300, 60], [1520, 320], [330, 470], [1120, 460]
  ];
  for (var i = 0; i < spots.length; i++) {
    SPARKS.push({ x: spots[i][0], y: spots[i][1], r: 10 + rng() * 12, k: 2 + Math.floor(rng() * 4), ph: rng() * 6.28 });
  }
})();

// ---- mid layer (parallax 0.6): eyes, leaves, melon, pencil
// Exactly five watching eyes on stems, asserted. Each
// eye: stem base on the floor line, white eyeball,
// pink or teal iris, and ONE fixed blink slot inside
// the 30s loop (0.24s long). The slots are staggered
// so exactly one eye blinks at a time.
var EYES = [
  { x: 150,  y: 305, rx: 42, ry: 54, iris: PINK, slot: 3.0 },
  { x: 330,  y: 205, rx: 48, ry: 62, iris: TEAL, slot: 7.5 },
  { x: 640,  y: 148, rx: 52, ry: 66, iris: PINK, slot: 12.0 },
  { x: 1015, y: 225, rx: 46, ry: 60, iris: TEAL, slot: 18.5 },
  { x: 1185, y: 330, rx: 40, ry: 52, iris: PINK, slot: 24.0 }
];
if (EYES.length !== 5) throw new Error('Neon Shoe must hold exactly 5 eyes');
var BLINK_LEN = 0.24;
// Free leaves on stems, neon green and black in turn,
// swaying on whole cycles of the loop. The two
// off-field entries exist so the pan reveals them.
var LEAVES = [
  { x: -150, y: 500, s: 46, col: NEON,  k: 2, ph: 0.5 },
  { x: 88,   y: 478, s: 54, col: BLACK, k: 3, ph: 2.2 },
  { x: 238,  y: 528, s: 42, col: NEON,  k: 2, ph: 4.0 },
  { x: 405,  y: 498, s: 44, col: BLACK, k: 3, ph: 1.1 },
  { x: 838,  y: 478, s: 52, col: NEON,  k: 2, ph: 3.3 },
  { x: 962,  y: 530, s: 42, col: BLACK, k: 3, ph: 5.1 },
  { x: 1128, y: 486, s: 50, col: NEON,  k: 2, ph: 0.9 },
  { x: 1252, y: 540, s: 40, col: BLACK, k: 3, ph: 2.7 },
  { x: 1435, y: 495, s: 48, col: NEON,  k: 2, ph: 4.6 }
];

// ---- front layer (parallax 1.0): floor, shoe, cat -------
// The checkerboard: exactly 8 perspective rows,
// asserted. Row depths are the boundaries between
// them; lateral lines live in floor space and converge
// toward the horizon.
var FLOOR_ROWS = 8;
if (FLOOR_ROWS !== 8) throw new Error('checkerboard must hold exactly 8 rows');
function floorY(d) { return HORIZON + (DH - HORIZON) * Math.pow(d, 1.7); }
function floorX(u, d) { return DW / 2 + u * (0.55 + 0.45 * Math.pow(d, 1.15)); }
var FLOOR_U = [];
for (var fu = -1820; fu <= 1820; fu += 140) FLOOR_U.push(fu);

// The cat's phone screen: a fixed 4-step flicker
// schedule of flat alphas, one step per 0.45s of loop
// time, cycling forever. Never random.
var FLICK = [1.0, 0.3, 0.85, 0.45];
var FLICK_STEP = 0.45;

// Paper grain: exactly 600 fixed speckle dots over the
// whole design field, drawn in this order every frame.
var rngGrain = makeRng(415);
var GRAIN = [];
for (var gi = 0; gi < 600; gi++) {
  GRAIN.push({ x: rngGrain() * DW, y: rngGrain() * DH, r: 0.8 + rngGrain() * 1.3, dark: rngGrain() < 0.5 });
}
if (GRAIN.length !== 600) throw new Error('grain count');

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellA(x, y, rx, ry, rot, color, alpha) {
  ctx.globalAlpha = alpha;
  ell(x, y, rx, ry, rot, color);
  ctx.globalAlpha = 1;
}
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function poly(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}
function sparkPath(cx, cy, r, rot) {
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var rad = i % 2 === 0 ? r : r * 0.22;
    var a = rot + i * Math.PI / 4 - Math.PI / 2;
    var X = cx + Math.cos(a) * rad, Y = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}
// A pointed leaf, centred on its stem top, tilted by
// the sway angle.
function drawLeafShape(x, y, s, rot, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.quadraticCurveTo(s * 0.62, -s * 0.15, 0, s);
  ctx.quadraticCurveTo(-s * 0.62, -s * 0.15, 0, -s);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

// ---- sky layer ------------------------------------------
// One brick doodle patch: three staggered rows of
// outlined bricks, white line segments at flat alpha.
function drawBricks(b, off) {
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = WHITE;
  ctx.lineWidth = 3;
  for (var r = 0; r < 3; r++) {
    var y = b.y + r * 22;
    var xoff = r % 2 === 0 ? 0 : 26;
    for (var cix = 0; cix < 3; cix++) {
      ctx.strokeRect(b.x + off + xoff + cix * 52, y, 48, 18);
    }
  }
  ctx.globalAlpha = 1;
}

// ---- mid layer ------------------------------------------
// Eye blink envelope: 1 open, ~0.1 at the middle of the
// eye's fixed slot.
function blinkScale(e, lt) {
  if (lt >= e.slot && lt <= e.slot + BLINK_LEN) {
    return 1 - 0.9 * Math.sin(Math.PI * (lt - e.slot) / BLINK_LEN);
  }
  return 1;
}
function drawEye(e, off, lt) {
  var x = e.x + off;
  // Stem, curving up from the floor line.
  ctx.strokeStyle = BLACK; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 14, HORIZON + 52);
  ctx.quadraticCurveTo(x + 16, (HORIZON + e.y) / 2, x, e.y + e.ry - 4);
  ctx.stroke();
  // Two small leaves riding the stem.
  var sway = 0.1 * Math.sin(Math.PI * 2 * 2 * lt / LOOP + e.x);
  drawLeafShape(x - 20, (HORIZON + e.y) / 2 + 30, 24, -0.7 + sway, NEON);
  drawLeafShape(x + 22, (HORIZON + e.y) / 2 - 6, 20, 0.8 - sway, BLACK);
  // The eyeball, squashed by the blink envelope.
  var bs = blinkScale(e, lt);
  ctx.save();
  ctx.translate(x, e.y);
  ctx.scale(1, bs);
  ctx.beginPath();
  ctx.ellipse(0, 0, e.rx, e.ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = WHITE;
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = BLACK;
  ctx.stroke();
  if (bs > 0.3) {
    ell(0, 2, e.rx * 0.44, e.rx * 0.44, 0, e.iris);
    ell(0, 2, e.rx * 0.2, e.rx * 0.2, 0, BLACK);
    ell(-e.rx * 0.14, -e.rx * 0.12, e.rx * 0.09, e.rx * 0.09, 0, WHITE);
  }
  ctx.restore();
}
// Watermelon slice: neon rind, white band, red flesh,
// black seeds; a half-disc wedge floating in the mid
// layer.
function drawMelon(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 64, 0, Math.PI);
  ctx.closePath();
  ctx.fillStyle = NEON;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, 55, 0, Math.PI);
  ctx.closePath();
  ctx.fillStyle = WHITE;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, 47, 0, Math.PI);
  ctx.closePath();
  ctx.fillStyle = MELON;
  ctx.fill();
  var seeds = [[-26, 22], [-8, 33], [12, 30], [27, 18], [0, 16]];
  for (var i = 0; i < seeds.length; i++) {
    ell(x + seeds[i][0], y + seeds[i][1], 3.6, 5, 0, BLACK);
  }
}
// The huge pencil, held from the upper right, and the
// pink hand gripping it. Drawn in a rotated group in
// the mid layer.
function drawPencil(off) {
  ctx.save();
  ctx.translate(1015 + off, 168);
  ctx.rotate(0.62);
  // Body: a long black bar.
  ctx.fillStyle = BLACK;
  ctx.fillRect(-360, -27, 430, 54);
  // Purple stripes across the body.
  ctx.fillStyle = PURPLE;
  ctx.fillRect(-300, -27, 16, 54);
  ctx.fillRect(-190, -27, 16, 54);
  ctx.fillRect(-80, -27, 16, 54);
  // Tip: white wood cone, black lead point.
  poly(WHITE, [-360, -27, -428, 0, -360, 27]);
  poly(BLACK, [-404, -9, -428, 0, -404, 9]);
  // Eraser end in hand pink.
  ctx.fillStyle = HAND;
  ctx.fillRect(70, -27, 30, 54);
  ctx.restore();
  // The hand: a pink mitt with three finger bumps,
  // gripping the pencil near its top end (the pencil's
  // centreline passes through about (1102, 228)).
  var hx = 1102 + off, hy = 228;
  ell(hx, hy, 56, 46, 0.3, HAND);
  ell(hx - 34, hy - 30, 17, 24, -0.4, HAND);
  ell(hx - 4, hy - 40, 18, 26, 0, HAND);
  ell(hx + 28, hy - 32, 17, 24, 0.4, HAND);
  ell(hx + 8, hy + 26, 30, 20, 0.2, HAND);
}

// ---- front layer ----------------------------------------
// The checkerboard floor: 8 perspective rows of
// trapezoid tiles in floor space, shifted by the pan.
function drawFloor(pan) {
  // Base: white across the whole floor band, wider
  // than the field so the pan never shows an edge.
  ctx.fillStyle = WHITE;
  ctx.fillRect(-700 + pan, HORIZON, DW + 1400, DH - HORIZON);
  for (var r = 0; r < FLOOR_ROWS; r++) {
    var d0 = r / FLOOR_ROWS, d1 = (r + 1) / FLOOR_ROWS;
    var y0 = floorY(d0), y1 = floorY(d1);
    for (var cix = 0; cix < FLOOR_U.length - 1; cix++) {
      var parity = ((cix + r) % 2 + 2) % 2;
      if (parity === 0) continue; // white tiles are the base
      var xa = floorX(FLOOR_U[cix], d0) + pan, xb = floorX(FLOOR_U[cix + 1], d0) + pan;
      var xc = floorX(FLOOR_U[cix + 1], d1) + pan, xd = floorX(FLOOR_U[cix], d1) + pan;
      poly(BLACK, [xa, y0, xb, y0, xc, y1, xd, y1]);
    }
  }
  // Horizon edge.
  seg(-700 + pan, HORIZON, DW + 700 + pan, HORIZON, 5, BLACK);
}
// The giant sneaker: flat white, black outline, stitch
// dashes and cross laces. Toe at the right.
function drawShoe(pan) {
  ctx.save();
  ctx.translate(pan, 0);
  // Sole band.
  ctx.beginPath();
  ctx.moveTo(302, 676);
  ctx.lineTo(986, 676);
  ctx.quadraticCurveTo(1010, 676, 1008, 694);
  ctx.quadraticCurveTo(1006, 714, 978, 714);
  ctx.lineTo(330, 714);
  ctx.quadraticCurveTo(302, 714, 300, 694);
  ctx.quadraticCurveTo(300, 676, 302, 676);
  ctx.closePath();
  ctx.fillStyle = WHITE;
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = BLACK;
  ctx.stroke();
  seg(312, 695, 996, 695, 5, BLACK);
  // Upper.
  ctx.beginPath();
  ctx.moveTo(320, 678);
  ctx.lineTo(324, 566);
  ctx.quadraticCurveTo(326, 524, 376, 516);
  ctx.quadraticCurveTo(424, 500, 486, 514);
  ctx.quadraticCurveTo(640, 548, 742, 578);
  ctx.quadraticCurveTo(856, 606, 922, 620);
  ctx.quadraticCurveTo(992, 634, 988, 678);
  ctx.closePath();
  ctx.fillStyle = WHITE;
  ctx.fill();
  ctx.stroke();
  // Ankle opening.
  ell(442, 518, 28, 10, -0.1, BLACK);
  // Toe cap stitch arc (dashed).
  ctx.strokeStyle = BLACK; ctx.lineWidth = 4;
  ctx.setLineDash([8, 7]);
  ctx.beginPath();
  ctx.moveTo(862, 592);
  ctx.quadraticCurveTo(930, 626, 918, 676);
  ctx.stroke();
  // Heel stitch arc (dashed).
  ctx.beginPath();
  ctx.moveTo(392, 540);
  ctx.quadraticCurveTo(366, 606, 380, 676);
  ctx.stroke();
  ctx.setLineDash([]);
  // Laces: five crosses down the tongue slope.
  ctx.lineWidth = 7;
  for (var i = 0; i < 5; i++) {
    var t = i / 4;
    var lx = 512 + t * 196, ly = 534 + t * 52;
    seg(lx - 26, ly - 15, lx + 30, ly + 13, 7, BLACK);
    seg(lx - 26, ly + 13, lx + 30, ly - 15, 7, BLACK);
  }
  ctx.restore();
}
// The cat, perched on the shoe's toe, pink headphones
// on, phone in its paws. The screen flickers on the
// fixed FLICK schedule.
function drawCat(pan, lt) {
  ctx.save();
  ctx.translate(pan, 0);
  var cx = 902, by = 618; // toe top perch
  // Tail, curling down the toe.
  ctx.strokeStyle = BLACK; ctx.lineWidth = 15; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + 44, by - 8);
  ctx.quadraticCurveTo(cx + 88, by + 6, cx + 76, by + 52);
  ctx.stroke();
  // Body.
  ell(cx, by - 38, 52, 56, 0, BLACK);
  // Head.
  ell(cx, by - 116, 41, 38, 0, BLACK);
  poly(BLACK, [cx - 36, by - 138, cx - 30, by - 172, cx - 8, by - 148]);
  poly(BLACK, [cx + 36, by - 138, cx + 30, by - 172, cx + 8, by - 148]);
  // Headphones: pink band and cups.
  ctx.strokeStyle = HAND; ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.arc(cx, by - 118, 44, Math.PI * 1.08, Math.PI * 1.92);
  ctx.stroke();
  ell(cx - 42, by - 112, 11, 17, 0, HAND);
  ell(cx + 42, by - 112, 11, 17, 0, HAND);
  // Face: white eyes, pink nose.
  ell(cx - 15, by - 118, 5, 6.5, 0, WHITE);
  ell(cx + 15, by - 118, 5, 6.5, 0, WHITE);
  poly(HAND, [cx - 5, by - 105, cx + 5, by - 105, cx, by - 99]);
  // Phone in the paws, screen flickering in flat
  // alpha steps on the fixed schedule.
  ctx.save();
  ctx.translate(cx, by - 52);
  ctx.rotate(-0.08);
  ctx.fillStyle = BLACK;
  ctx.fillRect(-17, -24, 34, 48);
  var fi = Math.floor(lt / FLICK_STEP) % 4;
  ctx.globalAlpha = FLICK[fi];
  ctx.fillStyle = WHITE;
  ctx.fillRect(-12, -18, 24, 34);
  ctx.globalAlpha = 1;
  ctx.restore();
  // Paws over the phone edges.
  ell(cx - 24, by - 46, 10, 13, 0.3, BLACK);
  ell(cx + 24, by - 46, 10, 13, -0.3, BLACK);
  ctx.restore();
}

// Her hand-lettered signature, stroke paths only, in
// black ink at the bottom right. No font text. The
// signature sits on the checkerboard, so every stroke
// is laid twice: a white underlay first, then the
// black ink, keeping the lettering legible on both
// tile colours.
function sigStrokes(color, w, sy) {
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Y
  ctx.beginPath();
  ctx.moveTo(1082, sy - 30); ctx.lineTo(1101, sy - 7); ctx.lineTo(1120, sy - 30);
  ctx.moveTo(1101, sy - 7); ctx.lineTo(1101, sy + 15);
  ctx.stroke();
  // e: a small loop with its crossbar through it
  ctx.beginPath();
  ctx.ellipse(1142, sy + 2, 10.5, 12.5, 0, 0, Math.PI * 2);
  ctx.stroke();
  seg(1131.5, sy - 1, 1152.5, sy - 1, w * 0.88, color);
  // t
  ctx.beginPath();
  ctx.moveTo(1173, sy - 28); ctx.lineTo(1173, sy + 10);
  ctx.quadraticCurveTo(1173, sy + 17, 1182, sy + 16);
  ctx.stroke();
  seg(1161, sy - 13, 1185, sy - 13, w * 0.88, color);
  // i
  seg(1204, sy - 15, 1204, sy + 15, w, color);
  // flourish
  ctx.beginPath();
  ctx.moveTo(1078, sy + 28);
  ctx.quadraticCurveTo(1150, sy + 36, 1226, sy + 23);
  ctx.stroke();
}
function drawSignature() {
  var sy = 856;
  sigStrokes(WHITE, 9.5, sy);
  ell(1204, sy - 27, 5.6, 5.6, 0, WHITE);
  sigStrokes(BLACK, 5, sy);
  ell(1204, sy - 27, 3.4, 3.4, 0, BLACK);
}

// ---- piece state ----------------------------------------
// Constant first-frame phase: T = 12.06s into the 30s
// loop, inside eye 3's fixed blink slot (12.0s +
// 0.06, the lid about 60 percent closed), with the
// phone on a lit flicker step.
var T = 12.06;
var lastNow = -1, acc = 0;
// Diorama pan, in design px, clamped; springs back to
// exactly zero on release.
var PAN_MAX = 240;
var pan = 0, panV = 0, dragging = false;

// Optional QA probe via the query string the house
// renderer passes as ?seed=... : pan=N starts the
// piece panned N px so the layered offsets render.
// Deterministic; default play is unaffected.
var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
var pm = /pan=(-?\d+)/.exec(qs);
if (pm) pan = clamp(parseInt(pm[1], 10), -PAN_MAX, PAN_MAX);

function step() {
  if (!dragging) {
    panV += (-pan * 90 - panV * 12) * TICK;
    pan += panV * TICK;
    if (Math.abs(pan) < 0.05 && Math.abs(panV) < 0.5) { pan = 0; panV = 0; }
  }
}

function drawScene(lt) {
  // Sky: hot pink over the whole extended field.
  ctx.fillStyle = SKY;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);

  // Sky layer at 0.3x: brick doodles and sparkles.
  var skyOff = pan * 0.3;
  for (var b = 0; b < BRICKS.length; b++) drawBricks(BRICKS[b], skyOff);
  for (var k = 0; k < SPARKS.length; k++) {
    var sp = SPARKS[k];
    var tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(Math.PI * 2 * sp.k * lt / LOOP + sp.ph));
    ctx.globalAlpha = tw;
    sparkPath(sp.x + skyOff, sp.y, sp.r, 0);
    ctx.fillStyle = WHITE;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Mid layer at 0.6x: eye stems and eyes, free
  // leaves, the watermelon, the pencil and hand.
  var midOff = pan * 0.6;
  for (var e = 0; e < EYES.length; e++) drawEye(EYES[e], midOff, lt);
  for (var l = 0; l < LEAVES.length; l++) {
    var lf = LEAVES[l];
    var lsway = 0.14 * Math.sin(Math.PI * 2 * lf.k * lt / LOOP + lf.ph);
    ctx.strokeStyle = BLACK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(lf.x + midOff, HORIZON + 52);
    ctx.quadraticCurveTo(lf.x + midOff + 10, (HORIZON + lf.y) / 2, lf.x + midOff, lf.y + lf.s * 0.7);
    ctx.stroke();
    drawLeafShape(lf.x + midOff, lf.y, lf.s, lsway, lf.col);
  }
  drawMelon(196 + midOff, 392);
  drawPencil(midOff);

  // Front layer at 1.0x: floor, shoe, cat.
  drawFloor(pan);
  drawShoe(pan);
  drawCat(pan, lt);

  // Paper grain over all, fixed table order.
  for (var g2 = 0; g2 < GRAIN.length; g2++) {
    var gd = GRAIN[g2];
    if (gd.dark) ellA(gd.x, gd.y, gd.r, gd.r, 0, BLACK, 0.05);
    else ellA(gd.x, gd.y, gd.r, gd.r, 0, WHITE, 0.06);
  }

  drawSignature();
}

function draw() { drawScene(T % LOOP); }

// ---- pointer: drag pans the diorama ---------------------
// A horizontal drag sets the pan directly (clamped);
// on release the spring in step() eases it back to
// exactly zero. The piece never reloads.
var downX = -1, startPan = 0, lastPanX = 0, lastPanT = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; startPan = pan; lastPanX = p.x; lastPanT = T;
  dragging = true; panV = 0;
});
canvas.addEventListener('pointermove', function (e) {
  if (downX < 0) return;
  var p = toDesign(e);
  pan = clamp(startPan + (p.x - downX), -PAN_MAX, PAN_MAX);
  var dt = T - lastPanT;
  if (dt > 0.001) {
    var v = (p.x - lastPanX) / dt;
    panV = 0.65 * panV + 0.35 * clamp(v, -2600, 2600);
    lastPanX = p.x; lastPanT = T;
  }
});
function endPointer() {
  downX = -1;
  dragging = false;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// ---- sizing: full-bleed cover fit, page ground = sky ----
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
