<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№75 · Plus Minus</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#1c1c1e; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(128,128,128,0.85); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag up for plus, down for minus</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
function autoLeft(t){
  const ph=t%12;
  if(ph<5) return 1-smooth(ph/5);
  if(ph<7) return 0;
  return smooth((ph-7)/5);
}
let override={left:null,right:null};
let dragPanel=null, releaseAt={left:-10,right:-10};
function morph(panel,t){
  if(dragPanel===panel&&override[panel]!==null) return override[panel];
  if(override[panel]!==null&&t-releaseAt[panel]<4) return override[panel];
  if(override[panel]!==null&&dragPanel!==panel) override[panel]=null;
  const a=autoLeft(t);
  return panel==='left'?a:1-a;
}
function drawForm(cx,cy,len,m,fill){
  const th=len*0.13;
  ctx.fillStyle=fill;
  ctx.fillRect(cx-len/2,cy-th/2,len,th);
  const vh=m*len;
  if(vh>1) ctx.fillRect(cx-th/2,cy-vh/2,th,vh);
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const t=nowMs/1000;
  const mid=w/2;
  ctx.fillStyle='#d8d5ce'; ctx.fillRect(0,0,mid,h);
  ctx.fillStyle='#1c1c1e'; ctx.fillRect(mid,0,w-mid,h);
  ctx.fillStyle='#8a8a8a'; ctx.fillRect(mid-0.5,0,1,h);
  const panelW=mid;
  const len=panelW*0.52;
  const cy=h/2;
  drawForm(panelW/2,cy,len,morph('left',t),'#8a8a8a');
  drawForm(mid+panelW/2,cy,len,morph('right',t),'#e8e6e0');
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(1000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
function setFromEvent(e){
  const [w,h]=viewportWH();
  const panel=e.clientX<w/2?'left':'right';
  dragPanel=panel;
  override[panel]=Math.max(0,Math.min(1,1-e.clientY/h));
  return panel;
}
canvas.addEventListener('pointerdown',e=>{ setFromEvent(e); });
canvas.addEventListener('pointermove',e=>{ if(dragPanel) setFromEvent(e); });
function endP(){ if(dragPanel){ releaseAt[dragPanel]=performance.now()/1000; dragPanel=null; } }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
