<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.381 Witchy Woman</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1C1220; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.381 Witchy Woman (jenkbdoodles).
// After Jen K's Witchy Woman, her 99th consecutive weekly
// challenge entry: a boho-1970s maximalist floral toss on a
// near-black plum ground. Rich jewel-tone florals (poppies,
// daisies, chrysanthemums) woven through with tiny moons,
// stars, evil-eye dots and crystal shards in antique gold,
// at maximalist density with every gap filled. Exactly 14
// hero blooms (petal counts 6 to 12 by species) and exactly
// 28 mid buds, over scattered leaves, with 120 micro gold
// details in the gaps. The field runs on one seamless 50s
// master loop (LOOP): hero petals pulse between 0.9 and 1.0
// scale on 5 or 10 whole cycles, buds breathe on whole
// cycles, and the gold details shimmer between 0.55 and 1.0
// alpha on 5 or 10 whole cycles, so frame 50s is
// pixel-identical to frame 0 at rest.
// DRAG carries a moonlight: three concentric flat discs of
// translucent gold at stepped alphas (no gradient, no
// lighter composite) centred on the pointer. Any floral or
// detail whose centre falls inside the inner disc is drawn
// one palette step brighter; when the light moves on, the
// brightness lingers and fades behind it, so the field
// keeps a short comet trail of lit blooms. The bright step
// variants are authored hexes, listed in process.md.
// Never click-to-reload; drag is the only gesture.
// Determinism: the first frame is drawn synchronously at
// the constant phase T = 18.7 (pulses and shimmers
// mid-wave, no pointer, no moonlight), never Date.now()
// minus an offset, and the animation advances from that
// anchor in fixed 1/60 ticks. Flat colour only, one
// canvas, all marks are JS data drawn directly each frame.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 50;
var TAU = Math.PI * 2;
var PAGE = '#1C1220';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 18.7, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- palette ----------------------------------------------------------
// The specced hexes, plus one authored brighter step per colour
// for the moonlight. Bright steps are used only while an element
// sits inside the moonlight's inner disc.
var GROUND = '#1C1220';
var FLORALS = ['#7A2E4A', '#B565A7', '#3F6FA3', '#D97E36'];
var FLORALS_B = ['#A03A5E', '#CD83BE', '#5E8FBE', '#E89A54'];
var LEAF = '#4E7A4E', LEAF_B = '#679A67';
var GOLD = '#C9A24B', GOLD_B = '#DEC06E';
var BLUE = '#3F6FA3';

// ---- seeded rng ---------------------------------------------------------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(0x381B);

// ---- scatter ------------------------------------------------------------
// Rejection placement in design coords. Deterministic: the rng
// stream is fixed. minD relaxes slightly only if a point proves
// stubborn, so the asserted counts always land.
function scatter(count, minD, ok) {
  var pts = [], tries, x, y, i, good, d;
  while (pts.length < count) {
    tries = 0;
    good = false;
    while (!good && tries < 600) {
      tries++;
      x = 30 + rng() * (DW - 60);
      y = 30 + rng() * (DH - 60);
      good = ok(x, y);
      if (good) {
        for (i = 0; i < pts.length; i++) {
          d = Math.hypot(pts[i].x - x, pts[i].y - y);
          if (d < minD * (tries > 300 ? 0.8 : 1)) { good = false; break; }
        }
      }
    }
    if (!good) { x = 30 + rng() * (DW - 60); y = 30 + rng() * (DH - 60); }
    pts.push({ x: x, y: y });
  }
  return pts;
}

// ---- the field ------------------------------------------------------------
// Heroes first (they anchor the composition), then buds kept out
// of hero discs, leaves anywhere, micros kept out of hero discs
// and off bud heads, so every register has its own space and the
// gaps between them belong to the gold.

var SPECIES = ['poppy', 'daisy', 'mum'];
var PETALS = { poppy: [6, 7], daisy: [11, 12], mum: [12, 12] };

var heroPts = scatter(14, 218, function () { return true; });
var HEROES = heroPts.map(function (p, i) {
  var sp = SPECIES[i % 3];
  return {
    x: p.x, y: p.y, r: 96 + rng() * 26, sp: sp,
    petals: PETALS[sp][i % 2], col: i % 4,
    rot: rng() * TAU, k: (i % 2 === 0) ? 5 : 10,
    ph: rng() * TAU, lit: 0
  };
});

function outsideHeroes(x, y, pad) {
  for (var i = 0; i < HEROES.length; i++) {
    if (Math.hypot(HEROES[i].x - x, HEROES[i].y - y) < HEROES[i].r + pad) return false;
  }
  return true;
}

var budPts = scatter(28, 74, function (x, y) { return outsideHeroes(x, y, 26); });
var BUDS = budPts.map(function (p, i) {
  return {
    x: p.x, y: p.y, s: 30 + rng() * 12, col: (i * 3 + 1) % 4,
    rot: rng() * TAU, k: (i % 2 === 0) ? 10 : 5,
    ph: rng() * TAU, lit: 0
  };
});

var leafPts = scatter(40, 58, function () { return true; });
var LEAVES = leafPts.map(function (p, i) {
  return {
    x: p.x, y: p.y, s: 40 + rng() * 26,
    rot: rng() * TAU, k: (i % 2 === 0) ? 5 : 10,
    ph: rng() * TAU, lit: 0
  };
});

function clearOfBuds(x, y) {
  for (var i = 0; i < BUDS.length; i++) {
    if (Math.hypot(BUDS[i].x - x, BUDS[i].y - y) < 30) return false;
  }
  return true;
}
var microPts = scatter(120, 36, function (x, y) {
  return outsideHeroes(x, y, -6) && clearOfBuds(x, y);
});
var MICRO_KINDS = ['star', 'dot', 'moon', 'eye', 'crystal', 'star', 'dot', 'sparkle'];
var MICROS = microPts.map(function (p, i) {
  return {
    x: p.x, y: p.y, kind: MICRO_KINDS[Math.floor(rng() * MICRO_KINDS.length)],
    s: 6 + rng() * 6, rot: rng() * TAU,
    k: (i % 2 === 0) ? 10 : 5, ph: rng() * TAU, lit: 0
  };
});

if (HEROES.length !== 14) throw new Error('Witchy Woman needs exactly 14 hero blooms');
if (BUDS.length !== 28) throw new Error('Witchy Woman needs exactly 28 buds');
if (MICROS.length !== 120) throw new Error('Witchy Woman needs exactly 120 micro details');

// ---- painters -------------------------------------------------------------

function petalEllipse(L, Wd) {
  ctx.beginPath();
  ctx.ellipse(L / 2, 0, L / 2, Wd / 2, 0, 0, TAU);
  ctx.fill();
}

function drawBloom(b, t) {
  var pulse = 0.90 + 0.10 * (0.5 + 0.5 * Math.sin(TAU * b.k * (t / LOOP) + b.ph));
  var col = b.lit >= 0.5 ? FLORALS_B[b.col] : FLORALS[b.col];
  var R = b.r, i, a;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot);
  ctx.fillStyle = col;
  if (b.sp === 'poppy') {
    for (i = 0; i < b.petals; i++) {
      ctx.save();
      ctx.rotate((i / b.petals) * TAU);
      petalEllipse(R * pulse, R * pulse * 0.62);
      ctx.restore();
    }
    ctx.fillStyle = GROUND;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.24, 0, TAU);
    ctx.fill();
    ctx.fillStyle = b.lit >= 0.5 ? GOLD_B : GOLD;
    for (i = 0; i < 8; i++) {
      a = (i / 8) * TAU + 0.4;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * R * 0.155, Math.sin(a) * R * 0.155, R * 0.028, 0, TAU);
      ctx.fill();
    }
  } else if (b.sp === 'daisy') {
    for (i = 0; i < b.petals; i++) {
      ctx.save();
      ctx.rotate((i / b.petals) * TAU);
      petalEllipse(R * pulse, R * pulse * 0.30);
      ctx.restore();
    }
    ctx.fillStyle = b.lit >= 0.5 ? GOLD_B : GOLD;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.22, 0, TAU);
    ctx.fill();
    ctx.fillStyle = GROUND;
    for (i = 0; i < 6; i++) {
      a = (i / 6) * TAU + 0.9;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * R * 0.11, Math.sin(a) * R * 0.11, R * 0.026, 0, TAU);
      ctx.fill();
    }
  } else { // mum: two petal rings, inner shorter
    for (i = 0; i < b.petals; i++) {
      ctx.save();
      ctx.rotate((i / b.petals) * TAU);
      petalEllipse(R * pulse, R * pulse * 0.34);
      ctx.restore();
    }
    for (i = 0; i < 8; i++) {
      ctx.save();
      ctx.rotate(((i + 0.5) / 8) * TAU);
      petalEllipse(R * pulse * 0.60, R * pulse * 0.30);
      ctx.restore();
    }
    ctx.fillStyle = b.lit >= 0.5 ? GOLD_B : GOLD;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.15, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawBud(b, t) {
  var pulse = 0.96 + 0.04 * (0.5 + 0.5 * Math.sin(TAU * b.k * (t / LOOP) + b.ph));
  var sway = 0.05 * Math.sin(TAU * b.k * (t / LOOP) + b.ph + 1.2);
  var s = b.s * pulse;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot + sway);
  // sepals: two small green points at the base
  ctx.fillStyle = b.lit >= 0.5 ? LEAF_B : LEAF;
  ctx.save();
  ctx.rotate(0.55);
  petalEllipse(s * 0.55, s * 0.26);
  ctx.restore();
  ctx.save();
  ctx.rotate(-0.55);
  petalEllipse(s * 0.55, s * 0.26);
  ctx.restore();
  // closed teardrop head
  ctx.fillStyle = b.lit >= 0.5 ? FLORALS_B[b.col] : FLORALS[b.col];
  ctx.beginPath();
  ctx.moveTo(0, s * 0.55);
  ctx.quadraticCurveTo(s * 0.52, s * 0.10, 0, -s * 0.62);
  ctx.quadraticCurveTo(-s * 0.52, s * 0.10, 0, s * 0.55);
  ctx.fill();
  ctx.restore();
}

function drawLeaf(l, t) {
  var sway = 0.04 * Math.sin(TAU * l.k * (t / LOOP) + l.ph);
  ctx.save();
  ctx.translate(l.x, l.y);
  ctx.rotate(l.rot + sway);
  ctx.fillStyle = l.lit >= 0.5 ? LEAF_B : LEAF;
  petalEllipse(l.s, l.s * 0.36);
  ctx.strokeStyle = GROUND;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(l.s * 0.08, 0);
  ctx.lineTo(l.s * 0.92, 0);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function star5(r) {
  var i, a;
  ctx.beginPath();
  for (i = 0; i < 10; i++) {
    a = -Math.PI / 2 + i * Math.PI / 5;
    var rr = (i % 2 === 0) ? r : r * 0.45;
    if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
}

function sparkle4(r) {
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.quadraticCurveTo(r * 0.16, -r * 0.16, r, 0);
  ctx.quadraticCurveTo(r * 0.16, r * 0.16, 0, r);
  ctx.quadraticCurveTo(-r * 0.16, r * 0.16, -r, 0);
  ctx.quadraticCurveTo(-r * 0.16, -r * 0.16, 0, -r);
  ctx.closePath();
  ctx.fill();
}

function drawMicro(m, t) {
  var shimmer = 0.55 + 0.45 * Math.sin(TAU * m.k * (t / LOOP) + m.ph);
  var lit = m.lit >= 0.5;
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.rot);
  ctx.globalAlpha = lit ? 1 : shimmer;
  ctx.fillStyle = lit ? GOLD_B : GOLD;
  if (m.kind === 'star') {
    star5(m.s);
  } else if (m.kind === 'sparkle') {
    sparkle4(m.s * 1.25);
  } else if (m.kind === 'dot') {
    ctx.beginPath();
    ctx.arc(0, 0, m.s * 0.34, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(m.s * 0.85, m.s * 0.5, m.s * 0.20, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-m.s * 0.7, m.s * 0.62, m.s * 0.16, 0, TAU);
    ctx.fill();
  } else if (m.kind === 'moon') {
    ctx.beginPath();
    ctx.arc(0, 0, m.s, 0.35, Math.PI * 1.65);
    ctx.arc(m.s * 0.42, -m.s * 0.12, m.s * 0.78, Math.PI * 1.55, Math.PI * 0.42, true);
    ctx.closePath();
    ctx.fill();
  } else if (m.kind === 'eye') {
    // evil eye: gold ring, blue iris, ground pupil
    ctx.beginPath();
    ctx.arc(0, 0, m.s * 0.72, 0, TAU);
    ctx.fill();
    ctx.fillStyle = BLUE;
    ctx.beginPath();
    ctx.arc(0, 0, m.s * 0.44, 0, TAU);
    ctx.fill();
    ctx.fillStyle = GROUND;
    ctx.beginPath();
    ctx.arc(0, 0, m.s * 0.20, 0, TAU);
    ctx.fill();
  } else { // crystal shard: flat diamond with a ground facet line
    ctx.beginPath();
    ctx.moveTo(0, -m.s);
    ctx.lineTo(m.s * 0.62, 0);
    ctx.lineTo(0, m.s);
    ctx.lineTo(-m.s * 0.62, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = GROUND;
    ctx.globalAlpha = (lit ? 1 : shimmer) * 0.55;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-m.s * 0.62, 0);
    ctx.lineTo(m.s * 0.62, 0);
    ctx.moveTo(0, -m.s);
    ctx.lineTo(0, m.s);
    ctx.stroke();
    ctx.globalAlpha = lit ? 1 : shimmer;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---- moonlight --------------------------------------------------------------
// Three stepped translucent gold discs follow the pointer while it
// is down. Elements inside the inner disc (r 95) step one palette
// step brighter; their lit value decays slowly after the light
// leaves, so the brightness trails behind the pointer.

var MOON_R = 95;
var moon = { x: 0, y: 0, tx: 0, ty: 0, down: false, alpha: 0 };

function stepLit(el, dt) {
  var target = 0;
  if (moon.alpha > 0.3) {
    var d = Math.hypot(el.x - moon.x, el.y - moon.y);
    if (d < MOON_R) target = 1;
  }
  if (target > el.lit) el.lit = Math.min(1, el.lit + dt * 4);
  else el.lit = Math.max(0, el.lit - dt * 1.1);
}

function update(dt) {
  moon.alpha += ((moon.down ? 1 : 0) - moon.alpha) * Math.min(1, dt * 5);
  if (moon.alpha < 0.01 && !moon.down) moon.alpha = 0;
  moon.x += (moon.tx - moon.x) * Math.min(1, dt * 12);
  moon.y += (moon.ty - moon.y) * Math.min(1, dt * 12);
  var i;
  for (i = 0; i < HEROES.length; i++) stepLit(HEROES[i], dt);
  for (i = 0; i < BUDS.length; i++) stepLit(BUDS[i], dt);
  for (i = 0; i < LEAVES.length; i++) stepLit(LEAVES[i], dt);
  for (i = 0; i < MICROS.length; i++) stepLit(MICROS[i], dt);
}

function drawMoonlight() {
  if (moon.alpha <= 0) return;
  ctx.save();
  ctx.fillStyle = GOLD;
  ctx.globalAlpha = 0.05 * moon.alpha;
  ctx.beginPath();
  ctx.arc(moon.x, moon.y, 220, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 0.08 * moon.alpha;
  ctx.beginPath();
  ctx.arc(moon.x, moon.y, 150, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 0.12 * moon.alpha;
  ctx.beginPath();
  ctx.arc(moon.x, moon.y, MOON_R, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---- draw -------------------------------------------------------------------

function draw(t) {
  var i;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  for (i = 0; i < LEAVES.length; i++) drawLeaf(LEAVES[i], t);
  for (i = 0; i < BUDS.length; i++) drawBud(BUDS[i], t);
  for (i = 0; i < HEROES.length; i++) drawBloom(HEROES[i], t);
  for (i = 0; i < MICROS.length; i++) drawMicro(MICROS[i], t);
  drawMoonlight();
}

// ---- sizing -------------------------------------------------------------------

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- pointer: drag carries the moonlight ---------------------------------------

function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  moon.tx = p.x; moon.ty = p.y;
  moon.x = p.x; moon.y = p.y;
  moon.down = true;
});
canvas.addEventListener('pointermove', function (e) {
  if (!moon.down) return;
  var p = toDesign(e);
  moon.tx = p.x; moon.ty = p.y;
});
function endPointer() { moon.down = false; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);

// ---- frame -----------------------------------------------------------------------

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Cover-fit: the field fills every screen, cropped, never boxed.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAGE;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; update(TICK); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
})();
</script>
</body>
</html>
