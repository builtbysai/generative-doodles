<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№134 · Hex House Study</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0D; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(200,204,212,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to orbit the house</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function sstep(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function easeOutBack(x){ const c1=1.70158, c3=c1+1; x=clamp(x,0,1); return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }

// No.134 Hex House Study: a brutalist mansion of rounded-box SDFs floating in
// a black void. It assembles from scattered blocks, orbits a quarter turn,
// holds, and its one neon strip pulses. One amber window, chrome edges.
const GROUND='#0B0B0D';
const CONC=[138,143,152], CHROME=[200,204,212], AMBER=[255,179,71], NEON=[90,242,255];
// c center, b half extents, r corner radius, m material (0 concrete, 1 amber, 2 neon),
// at assembly start time, from scatter position
const BLOCKS=[
  {c:[0,-1.04,0],      b:[1.18,0.10,0.88], r:0.04, m:0, at:0.2, from:[0,-3.0,0]},
  {c:[-0.18,-0.36,0],  b:[0.72,0.58,0.62], r:0.05, m:0, at:0.7, from:[-3.2,0.4,0]},
  {c:[-1.02,-0.56,0.10],b:[0.34,0.38,0.55], r:0.05, m:0, at:1.3, from:[-3.4,-0.8,1.4]},
  {c:[0.80,-0.18,-0.06],b:[0.36,0.76,0.50], r:0.05, m:0, at:1.9, from:[3.2,0.9,-1.2]},
  {c:[-0.18,0.29,0],   b:[0.82,0.07,0.72], r:0.03, m:0, at:2.6, from:[0,3.2,0]},
  {c:[-0.36,0.52,0.04],b:[0.40,0.16,0.44], r:0.04, m:0, at:3.2, from:[-1.6,3.0,0.8]},
  {c:[0.80,0.64,-0.06],b:[0.44,0.06,0.58], r:0.03, m:0, at:3.8, from:[1.8,3.2,-0.8]},
  {c:[-0.10,-0.74,0.70],b:[0.30,0.20,0.14], r:0.04, m:0, at:4.4, from:[0,-0.6,3.6]},
  {c:[-0.40,-0.34,0.645],b:[0.16,0.23,0.045],r:0.004,m:1, at:4.9, from:[-0.4,-0.34,3.4]},
  {c:[-0.18,0.375,0.705],b:[0.80,0.016,0.016],r:0.008,m:2, at:5.3, from:[0,3.4,0.7]}
];
const LOOP=20;
let timeVal=11.0, lastMs=null;
let dragging=false, dragLastX=0, dragLastY=0;
let userAz=0, userEl=0, velAz=0, velEl=0, lastDragS=-99, lastNowS=0;

function blockPos(bl, pt){
  const e=easeOutBack((pt-bl.at)/1.1);
  if(e<=0) return null;
  const k=1-e;
  return [bl.c[0]+(bl.from[0]-bl.c[0])*k, bl.c[1]+(bl.from[1]-bl.c[1])*k, bl.c[2]+(bl.from[2]-bl.c[2])*k];
}
function sdRB(px,py,pz, bl, pos){
  const qx=Math.abs(px-pos[0])-bl.b[0], qy=Math.abs(py-pos[1])-bl.b[1], qz=Math.abs(pz-pos[2])-bl.b[2];
  const ax=Math.max(qx,0), ay=Math.max(qy,0), az=Math.max(qz,0);
  return Math.hypot(ax,ay,az)+Math.min(Math.max(qx,Math.max(qy,qz)),0)-bl.r;
}
function scene(px,py,pz, pt, positions){
  let d=1e9, m=0;
  for(let i=0;i<BLOCKS.length;i++){
    const pos=positions[i]; if(!pos) continue;
    const dd=sdRB(px,py,pz, BLOCKS[i], pos);
    if(dd<d){ d=dd; m=BLOCKS[i].m; }
  }
  return [d, m];
}
function envB(rx,ry,rz){
  let b=0.25+0.45*Math.pow(Math.max(0, ry*0.5+0.5), 1.5);
  b+=0.7*Math.pow(Math.max(0, Math.sin(ry*8.0+0.8)), 8);
  b+=0.35*Math.pow(Math.max(0, Math.sin(rx*5.0+2.0)), 10);
  return Math.min(b, 1.5);
}
const LX=0.48, LY=0.78, LZ=0.40; // one analytic light (normalised)

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const nowS=nowMs/1000; lastNowS=nowS;
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(!dragging){
    timeVal+=dt;
    userAz+=velAz*dt; userEl+=velEl*dt;
    const dec=Math.exp(-2.4*dt); velAz*=dec; velEl*=dec;
    if(Math.abs(velAz)<0.02 && Math.abs(velEl)<0.02){ const k=Math.min(1, dt*1.4); userAz+=(0-userAz)*k; userEl+=(0-userEl)*k; }
  }
  const pt=((timeVal%LOOP)+LOOP)%LOOP;
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h);
  const positions=BLOCKS.map(bl=>blockPos(bl, pt));
  // camera: loop azimuth -0.65 -> quarter turn during 6-16s, hold after
  let az=-0.65;
  if(pt>6) az=-0.65 + sstep((pt-6)/10)*(Math.PI/2);
  az+=userAz;
  const el=0.32+userEl;
  const dist=4.6;
  const camX=Math.sin(az)*Math.cos(el)*dist, camY=Math.sin(el)*dist-0.1, camZ=Math.cos(az)*Math.cos(el)*dist;
  // camera basis
  let fx=-camX, fy=-camY, fz=-camZ; const fl=Math.hypot(fx,fy,fz); fx/=fl; fy/=fl; fz/=fl;
  // right = cross(forward, worldUp(0,1,0)) = (-f.z, 0, f.x)
  let rx=-fz, ryy=0, rzz=fx;
  const rl=Math.hypot(rx,ryy,rzz)||1; rx/=rl; rzz/=rl;
  const ux=ryy*fz-rzz*fy, uy=rzz*fx-rx*fz, uz=rx*fy-ryy*fx; // up = cross(right, forward)... sign checked in QA
  const aspect=w/h, tanV=1.9/(dist*Math.min(1, aspect));
  const target=30000;
  const cell=clamp(Math.round(Math.sqrt(w*h/target)), 4, 7);
  const cw=Math.ceil(w/cell), chh=Math.ceil(h/cell);
  // neon pulse: one bump inside the hold phase
  const neonPulse=0.5+1.5*Math.exp(-Math.pow(pt-17.6,2)/0.45);
  for(let j=0;j<chh;j++){
    const ndcY=1-((j+0.5)/chh)*2;
    for(let i=0;i<cw;i++){
      const ndcX=((i+0.5)/cw*2-1);
      let dx=fx+ (rx*ndcX*aspect + ux*ndcY)*tanV;
      let dy=fy+ (ryy*ndcX*aspect + uy*ndcY)*tanV;
      let dz=fz+ (rzz*ndcX*aspect + uz*ndcY)*tanV;
      const dl=Math.hypot(dx,dy,dz); dx/=dl; dy/=dl; dz/=dl;
      // bounding sphere reject: center (0,-0.12,0), radius 2.45
      const ocx=camX-0, ocy=camY+0.12, ocz=camZ-0;
      const bq=ocx*dx+ocy*dy+ocz*dz;
      const cq=ocx*ocx+ocy*ocy+ocz*ocz-2.45*2.45;
      const disc=bq*bq-cq;
      if(disc<0) continue;
      let t=-bq-Math.sqrt(disc)-0.05; if(t<0.1) t=0.1;
      let d=0, m=0, hit=false, px=0, py=0, pz=0;
      for(let s=0;s<56;s++){
        px=camX+dx*t; py=camY+dy*t; pz=camZ+dz*t;
        const sd=scene(px,py,pz, pt, positions); d=sd[0]; m=sd[1];
        if(d<0.006){ hit=true; break; }
        t+=Math.max(d*0.9, 0.01);
        if(t>dist+3) break;
      }
      if(!hit) continue;
      // normal
      const e=0.008;
      let nx=scene(px+e,py,pz,pt,positions)[0]-scene(px-e,py,pz,pt,positions)[0];
      let ny=scene(px,py+e,pz,pt,positions)[0]-scene(px,py-e,pz,pt,positions)[0];
      let nz=scene(px,py,pz+e,pt,positions)[0]-scene(px,py,pz-e,pt,positions)[0];
      const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
      let R, G, B;
      if(m===1){ const s=0.9+0.1*Math.max(0, nx*LX+ny*LY+nz*LZ); R=AMBER[0]*s; G=AMBER[1]*s; B=AMBER[2]*s; }
      else if(m===2){ const s=neonPulse; R=NEON[0]*s; G=NEON[1]*s; B=NEON[2]*s; }
      else {
        const diff=Math.max(0, nx*LX+ny*LY+nz*LZ);
        // soft shadow toward the one light
        let sh=1;
        { let st2=0.03; const sx=px+nx*0.03, sy=py+ny*0.03, sz=pz+nz*0.03;
          for(let s2=0;s2<10;s2++){
            const dd=scene(sx+LX*st2, sy+LY*st2, sz+LZ*st2, pt, positions)[0];
            sh=Math.min(sh, 8*dd/st2);
            st2+=Math.max(dd, 0.02);
            if(st2>3) break;
          }
          sh=clamp(sh, 0, 1);
        }
        const vx=-dx, vy=-dy, vz=-dz;
        const ndv=Math.max(0, nx*vx+ny*vy+nz*vz);
        let rx2=2*ndv*nx-vx, ry2=2*ndv*ny-vy, rz2=2*ndv*nz-vz;
        const edge=Math.pow(1-ndv, 2.5);
        const env=envB(rx2, ry2, rz2);
        const spec=Math.pow(Math.max(0, rx2*LX+ry2*LY+rz2*LZ), 24)*0.5;
        const base=0.20+0.85*diff*sh;
        const mixv=clamp(edge*0.85, 0, 1);
        R=CONC[0]*base*(1-mixv)+CHROME[0]*(0.30+0.80*env)*mixv + CHROME[0]*spec;
        G=CONC[1]*base*(1-mixv)+CHROME[1]*(0.30+0.80*env)*mixv + CHROME[1]*spec;
        B=CONC[2]*base*(1-mixv)+CHROME[2]*(0.30+0.80*env)*mixv + CHROME[2]*spec;
      }
      ctx.fillStyle='rgb('+Math.round(clamp(R,0,255))+','+Math.round(clamp(G,0,255))+','+Math.round(clamp(B,0,255))+')';
      ctx.fillRect(i*cell, j*cell, cell, cell);
    }
  }
}
function frame(nowMs){ drawFrame(nowMs); }
function ptr(e){ return [e.clientX, e.clientY]; }
canvas.addEventListener('pointerdown',e=>{ const [x,y]=ptr(e); dragging=true; dragLastX=x; dragLastY=y; velAz=0; velEl=0; });
canvas.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const [x,y]=ptr(e);
  const dAz=(x-dragLastX)*0.005, dEl=(y-dragLastY)*0.004;
  userAz+=dAz; userEl=clamp(userEl+dEl, -0.9, 0.9);
  velAz=dAz*30; velEl=dEl*30;
  dragLastX=x; dragLastY=y; frame(performance.now());
});
function endP(){ dragging=false; lastDragS=lastNowS; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);
function loop(nowMs){ frame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
frame(0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>frame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>frame(performance.now()));
</script>
</body>
</html>
