<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№78 · Quadrant Weave</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F3EDE1; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(20,20,20,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag a tile to turn it</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const GROUND='#F3EDE1', INK='#141414', PAL=['#1F4ED8','#2E9E5B','#E03A1F','#D9A02B'];

// No.78 Quadrant Weave: 8x8 = 64 tiles
const N=8; let baseRot=[], fieldCol=[], manual={};
{ const r=rng(7807); for(let y=0;y<N;y++){ baseRot.push([]); fieldCol.push([]); for(let x=0;x<N;x++){ baseRot[y].push(Math.floor(r()*4)); fieldCol[y].push((x+y+Math.floor(r()*2))%4); } } }
function tileTurns(x,y,t){
  const diag=x+y, ph=t%18;
  // forward wave 0-8, hold 8-9, reverse 9-17, hold 17-18
  let extra=0, anim=0;
  const ft=diag/14*7; // arrival 0..7
  if(ph<8){ if(ph>=ft+0.7){ extra=1; } else if(ph>=ft){ anim=smooth((ph-ft)/0.7); extra=0; } }
  else if(ph<9){ extra=1; }
  else if(ph<17){ const rt=7-(diag/14*7); const rp=ph-9; if(rp>=rt+0.7){ extra=0; } else if(rp>=rt){ extra=1; anim=-smooth((rp-rt)/0.7); } else { extra=1; } }
  else { extra=0; }
  const m=manual[x+','+y]||0;
  return {rot: baseRot[y][x]+extra+m, anim: anim};
}
function drawTile2(x0,y0,cell,rot,anim){
  ctx.save();
  ctx.beginPath(); ctx.rect(x0,y0,cell,cell); ctx.clip();
  ctx.translate(x0+cell/2,y0+cell/2); ctx.rotate(anim*Math.PI/2); ctx.translate(-(x0+cell/2),-(y0+cell/2));
  const parity=((rot%2)+2)%2, r=cell/2;
  ctx.strokeStyle=INK; ctx.lineWidth=cell*0.12;
  ctx.beginPath();
  if(parity===0){
    ctx.arc(x0,y0,r,0,Math.PI/2);
    ctx.moveTo(x0+cell-r,y0+cell); ctx.arc(x0+cell,y0+cell,r,Math.PI,Math.PI*1.5);
  } else {
    ctx.arc(x0+cell,y0,r,Math.PI/2,Math.PI);
    ctx.moveTo(x0,y0+cell-r); ctx.arc(x0,y0+cell,r,Math.PI*1.5,Math.PI*2);
  }
  ctx.stroke();
  ctx.restore();
}
let lastTap=0;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const t=nowMs/1000;
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h);
  const S=Math.min(w,h)*0.84, x0=(w-S)/2, y0=(h-S)/2, cell=S/N;
  let count=0;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    ctx.fillStyle=PAL[fieldCol[y][x]]; ctx.fillRect(x0+x*cell,y0+y*cell,cell,cell);
    const st=tileTurns(x,y,t);
    drawTile2(x0+x*cell,y0+y*cell,cell,st.rot,st.anim);
    count++;
  }
  if(count!==64) console.assert(false,'count',count);
  return {};
}
canvas.addEventListener('pointerdown',e=>{
  const [w,h]=viewportWH(); const S=Math.min(w,h)*0.84, x0=(w-S)/2, y0=(h-S)/2, cell=S/N;
  const gx=Math.floor((e.clientX-x0)/cell), gy=Math.floor((e.clientY-y0)/cell);
  if(gx>=0&&gx<N&&gy>=0&&gy<N){ const k=gx+','+gy; manual[k]=(manual[k]||0)+1; }
});

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(8500);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
