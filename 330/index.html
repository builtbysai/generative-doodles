<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.330 Fear Hope Field</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#8A8578; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.330 Fear Hope Field (arunima-dazess-wangchuk).
// One continuous surface reads fear and warning at one edge
// and hope and wellbeing at the other, rendered as flat
// colour cells stepped like dye lots, never as a smooth
// gradient. The field is a grid of exactly 40 by 28 cells,
// 1120 in all, each cell holding one scalar value. A cell
// colour is a quantised lookup on a six colour axis running
// warning red, ember orange, ash grey, undyed wool,
// wellbeing teal, hope peach, so neighbours step visibly
// from lot to lot. The axis runs diagonally, from the lower
// left toward the upper right, so neither pole owns the
// composition. Idle is a 48s seamless cycle of authored
// currents: the base value at each cell is built from a
// diagonal term, two travelling waves and two orbiting
// eddies, every time term an integer multiple of the loop
// phase, so the frame at 48s is identical to frame 0 when
// the field is untouched. Touch writes into the scalar
// field: the pointer position sets the local axis value
// with radial falloff in design coords, and a drag paints
// the axis continuously. Painted values fade slowly back
// into the drift. A double tap advances to the next of 5
// pre-authored current patterns in fixed order and clears
// the paint. No random seed is ever taken at runtime. All
// marks are flat filled cells drawn each frame on one
// canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var AXIS = ['#B3372B', '#D9703B', '#8A8578', '#E4D8C3', '#3E7C7B', '#F2B28C'];
var GROUND = '#8A8578';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 48;
var T = 19.4, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

// ---- cell grid: exactly 40 by 28, asserted -------------------
var COLS = 40, ROWS = 28;
var NCELLS = COLS * ROWS;
if (NCELLS !== 1120) throw new Error('Fear Hope Field needs exactly 1120 cells');
if (AXIS.length !== 6) throw new Error('Fear Hope Field needs exactly six axis colours');
var CELLW = DW / COLS, CELLH = DH / ROWS;

// Diagonal coordinate in 0..1: 0 at the lower left corner
// (fear), 1 at the upper right corner (hope).
function diagAt(x, y) {
  return (x / DW) * 0.72 + (1 - y / DH) * 0.28;
}

// ---- 5 pre-authored current patterns -------------------------
// tilt scales the diagonal term (a negative tilt runs the
// axis the other way). a1 and a2 are travelling waves with
// spatial rates kx, ky, loop multiples n and phases p. Each
// pattern also carries two eddies: a centre that orbits on
// the loop phase and lifts or lowers the values near it.
// Every number below is authored; nothing is randomised.
var PATTERNS = [
  { tilt: 1.30,
    a1: 0.16, kx1: 0.0055, ky1: 0.0020, n1: 1, p1: 0.0,
    a2: 0.09, kx2: -0.0030, ky2: 0.0070, n2: 2, p2: 1.7,
    e1x: 340, e1y: 620, e1orb: 150, e1sig: 280, e1amp: 0.20, e1n: 1, e1p: 0.0,
    e2x: 950, e2y: 260, e2orb: 170, e2sig: 300, e2amp: -0.18, e2n: 1, e2p: 2.4 },
  { tilt: 0.85,
    a1: 0.22, kx1: 0.0035, ky1: -0.0050, n1: 1, p1: 1.1,
    a2: 0.13, kx2: 0.0080, ky2: 0.0040, n2: 3, p2: 0.4,
    e1x: 880, e1y: 640, e1orb: 190, e1sig: 320, e1amp: 0.24, e1n: 1, e1p: 1.9,
    e2x: 380, e2y: 240, e2orb: 140, e2sig: 260, e2amp: -0.22, e2n: 2, e2p: 0.8 },
  { tilt: 1.60,
    a1: 0.10, kx1: 0.0090, ky1: 0.0060, n1: 2, p1: 2.6,
    a2: 0.07, kx2: 0.0040, ky2: -0.0090, n2: 1, p2: 0.9,
    e1x: 180, e1y: 180, e1orb: 110, e1sig: 220, e1amp: 0.16, e1n: 1, e1p: 3.6,
    e2x: 1100, e2y: 720, e2orb: 120, e2sig: 240, e2amp: -0.16, e2n: 1, e2p: 0.2 },
  { tilt: 0.60,
    a1: 0.26, kx1: 0.0022, ky1: 0.0032, n1: 1, p1: 0.5,
    a2: 0.15, kx2: -0.0026, ky2: 0.0024, n2: 2, p2: 3.1,
    e1x: 640, e1y: 450, e1orb: 260, e1sig: 420, e1amp: 0.26, e1n: 1, e1p: 0.0,
    e2x: 640, e2y: 450, e2orb: 340, e2sig: 380, e2amp: -0.20, e2n: 1, e2p: 3.14 },
  { tilt: -1.15,
    a1: 0.18, kx1: 0.0048, ky1: 0.0052, n1: 1, p1: 2.0,
    a2: 0.10, kx2: 0.0065, ky2: -0.0035, n2: 2, p2: 1.2,
    e1x: 980, e1y: 660, e1orb: 160, e1sig: 300, e1amp: 0.22, e1n: 1, e1p: 1.4,
    e2x: 300, e2y: 280, e2orb: 150, e2sig: 280, e2amp: -0.20, e2n: 1, e2p: 4.2 }
];
if (PATTERNS.length !== 5) throw new Error('Fear Hope Field needs exactly 5 current patterns');
var patternIdx = 0;

// Base scalar value at a design point under a pattern and a
// loop phase. All time terms use integer multiples of the
// phase, which is what makes the 48s cycle seamless.
function baseValue(x, y, pat, phase) {
  var v = 0.5 + pat.tilt * (diagAt(x, y) - 0.5);
  v += pat.a1 * Math.sin(pat.kx1 * x + pat.ky1 * y + pat.n1 * phase + pat.p1);
  v += pat.a2 * Math.sin(pat.kx2 * x + pat.ky2 * y + pat.n2 * phase + pat.p2);
  var ex = pat.e1x + pat.e1orb * Math.cos(pat.e1n * phase + pat.e1p);
  var ey = pat.e1y + pat.e1orb * 0.7 * Math.sin(pat.e1n * phase + pat.e1p);
  var dx = x - ex, dy = y - ey;
  v += pat.e1amp * Math.exp(-(dx * dx + dy * dy) / (pat.e1sig * pat.e1sig));
  ex = pat.e2x + pat.e2orb * Math.cos(pat.e2n * phase + pat.e2p);
  ey = pat.e2y + pat.e2orb * 0.7 * Math.sin(pat.e2n * phase + pat.e2p);
  dx = x - ex; dy = y - ey;
  v += pat.e2amp * Math.exp(-(dx * dx + dy * dy) / (pat.e2sig * pat.e2sig));
  return clamp(v, 0, 1);
}

// ---- painted layer: touch writes held over the drift ---------
var paintVal = new Float32Array(NCELLS);
var paintAmt = new Float32Array(NCELLS);
var PAINT_R = 190;
function writeAt(x, y) {
  var tv = clamp(diagAt(x, y), 0, 1);
  var c0 = Math.max(0, Math.floor((x - PAINT_R) / CELLW));
  var c1 = Math.min(COLS - 1, Math.floor((x + PAINT_R) / CELLW));
  var r0 = Math.max(0, Math.floor((y - PAINT_R) / CELLH));
  var r1 = Math.min(ROWS - 1, Math.floor((y + PAINT_R) / CELLH));
  for (var r = r0; r <= r1; r++) {
    for (var c = c0; c <= c1; c++) {
      var cx = (c + 0.5) * CELLW, cy = (r + 0.5) * CELLH;
      var dx = cx - x, dy = cy - y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d >= PAINT_R) continue;
      var f = 1 - d / PAINT_R;
      var wgt = f * f * (3 - 2 * f) * 0.96;
      var idx = r * COLS + c;
      if (wgt >= paintAmt[idx]) {
        paintVal[idx] = tv;
        paintAmt[idx] = wgt;
      } else if (wgt > 0.25) {
        paintVal[idx] = paintVal[idx] * 0.5 + tv * 0.5;
      }
    }
  }
}
function clearPaint() {
  for (var i = 0; i < NCELLS; i++) { paintAmt[i] = 0; paintVal[i] = 0; }
}
// Paint fades slowly back into the drift, with a half life
// near 28s, stepped once per tick.
function stepField() {
  var keep = 1 - TICK / 40;
  for (var i = 0; i < NCELLS; i++) {
    if (paintAmt[i] > 0.001) paintAmt[i] *= keep;
    else paintAmt[i] = 0;
  }
}

function draw() {
  var pat = PATTERNS[patternIdx];
  var phase = ((T % LOOP) / LOOP) * Math.PI * 2;
  var lastCol = null;
  for (var r = 0; r < ROWS; r++) {
    var cy = (r + 0.5) * CELLH;
    var y0 = r * CELLH;
    for (var c = 0; c < COLS; c++) {
      var cx = (c + 0.5) * CELLW;
      var v = baseValue(cx, cy, pat, phase);
      var idx = r * COLS + c;
      var amt = paintAmt[idx];
      if (amt > 0) v = v * (1 - amt) + paintVal[idx] * amt;
      var qi = Math.floor(v * 6);
      if (qi < 0) qi = 0;
      if (qi > 5) qi = 5;
      var col = AXIS[qi];
      if (col !== lastCol) { ctx.fillStyle = col; lastCol = col; }
      ctx.fillRect(c * CELLW, y0, CELLW + 0.6, CELLH + 0.6);
    }
  }
}

// ---- interaction: touch and drag write, double tap reseed ----
var drag = null;
var suppressWrite = false;
var lastTapMs = 0;
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  var now = Date.now();
  if (now - lastTapMs < 350) {
    patternIdx = (patternIdx + 1) % PATTERNS.length;
    clearPaint();
    lastTapMs = 0;
    suppressWrite = true;
  } else {
    lastTapMs = now;
    suppressWrite = false;
    writeAt(p[0], p[1]);
  }
  drag = { x: p[0], y: p[1] };
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag || suppressWrite) return;
  var p = toDesign(e);
  drag.x = p[0]; drag.y = p[1];
  writeAt(p[0], p[1]);
});
canvas.addEventListener('pointerup', function () { drag = null; suppressWrite = false; });
canvas.addEventListener('pointercancel', function () { drag = null; suppressWrite = false; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; stepField(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
