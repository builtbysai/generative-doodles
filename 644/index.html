<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa-Guía</title>
<style>
  html, body { margin: 0; padding: 0; background: #F4EFE2; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // ---------- palette (strict) ----------
  var PAPER = "#F4EFE2"; // map sheet
  var INK   = "#2A3340"; // contour ink, sheet border, tabs
  var RUST  = "#B4572E"; // route
  var BLACK = "#14110D"; // summit triangle
  var WATER = "#3A4E6B"; // lake

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- QA / seed hook ----------
  // ?seed=NNNN  -> use NNNN as the terrain seed.
  // ?seed=tNN   -> freeze the morph clock at NN seconds (verification only).
  var FORCE_T = null;
  var seed = 644078;
  (function () {
    var s = "";
    try { s = String((typeof location !== "undefined" && location.search) || ""); } catch (e) { s = ""; }
    var m = s.match(/[?&]seed=([^&]*)/);
    if (m) {
      var v = decodeURIComponent(m[1]);
      if (/^t\d+(\.\d+)?$/.test(v)) FORCE_T = parseFloat(v.slice(1));
      else if (/^\d+$/.test(v)) seed = parseInt(v, 10);
    }
  })();

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  // ---------- viewport (Visual Viewport API) ----------
  var W = 0, H = 0, phone = false;
  var plotX = 0, plotY = 0, plotW = 0, plotH = 0;
  var COLS = 104, ROWS = 74;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : Math.min(w, h);
    phone = (sw < 700) || (h > w * 1.15);
    var mx = Math.max(30, w * 0.075);
    var my = Math.max(26, h * 0.07);
    plotX = mx; plotY = my; plotW = w - mx * 2; plotH = h - my * 2;
    ROWS = Math.max(56, Math.min(130, Math.round(COLS * plotH / plotW)));
  }
  window.addEventListener("resize", resize);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", resize);
  }
  resize();

  // ---------- terrain parameters (regenerated per seed) ----------
  var P = null;
  function sstep(a, b, x) {
    var t = (x - a) / (b - a);
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    return t * t * (3 - 2 * t);
  }
  function fieldRaw(pr, u, v, th) {
    // sum of gaussians, centres drifting on the 60 s loop phase th
    var s = 0;
    for (var i = 0; i < pr.gauss.length; i++) {
      var g = pr.gauss[i];
      var cx = g.cx + g.dr * Math.cos(th + g.dp);
      var cy = g.cy + g.dr * 0.8 * Math.sin(th + g.dp * 1.7);
      var amp = g.amp * (1 + 0.13 * Math.sin(th + g.ap));
      var dx = u - cx, dy = v - cy;
      s += amp * Math.exp(-(dx * dx + dy * dy) / (2 * g.sig * g.sig));
    }
    // carved lake basin (fixed per seed, so the lake keeps its saddle)
    var lx = u - pr.lake.u, ly = v - pr.lake.v;
    s -= 0.5 * Math.exp(-(lx * lx + ly * ly) / (2 * 0.06 * 0.06));
    // hand-draft wobble baked into the field, so contour lines wander slightly
    s += 0.028 * Math.sin(6.2832 * (2 * u + 3 * v) + pr.w1)
       + 0.020 * Math.cos(6.2832 * (3 * u - 2 * v) + pr.w2)
       + 0.012 * Math.sin(6.2832 * (5 * u + 4 * v) + pr.w3);
    // falloff envelope: field dies at the sheet edges so every contour closes
    var env = sstep(0, 0.16, u) * sstep(0, 0.16, 1 - u) * sstep(0, 0.16, v) * sstep(0, 0.16, 1 - v);
    return env * s;
  }
  function genParams(sd) {
    var rng = mulberry32(sd);
    var pr = { gauss: [], lake: null, w1: rng() * 6.2832, w2: rng() * 6.2832, w3: rng() * 6.2832 };
    // one dominant massif peak
    pr.gauss.push({ cx: 0.42 + rng() * 0.16, cy: 0.38 + rng() * 0.16, sig: 0.25 + rng() * 0.03,
                    amp: 1.0, dr: 0.02, dp: rng() * 6.2832, ap: rng() * 6.2832 });
    for (var i = 0; i < 4; i++) {
      pr.gauss.push({ cx: 0.2 + rng() * 0.6, cy: 0.2 + rng() * 0.6, sig: 0.15 + rng() * 0.13,
                      amp: 0.5 + rng() * 0.35, dr: 0.015 + rng() * 0.028,
                      dp: rng() * 6.2832, ap: rng() * 6.2832 });
    }
    // lake: seeded candidates, keep the lowest t=0 field away from the main peak
    var best = null, bestF = Infinity;
    for (var k = 0; k < 14; k++) {
      var cu = 0.22 + rng() * 0.56, cv = 0.22 + rng() * 0.56;
      var dpk = Math.hypot(cu - pr.gauss[0].cx, cv - pr.gauss[0].cy);
      if (dpk < 0.24) continue;
      var f = fieldRawNoLake(pr, cu, cv);
      if (f < bestF) { bestF = f; best = { u: cu, v: cv }; }
    }
    if (!best) best = { u: 0.68, v: 0.72 };
    best.r = 0.042 + rng() * 0.012;
    pr.lake = best;
    return pr;
  }
  function fieldRawNoLake(pr, u, v) {
    var s = 0;
    for (var i = 0; i < pr.gauss.length; i++) {
      var g = pr.gauss[i];
      var dx = u - g.cx, dy = v - g.cy;
      s += g.amp * Math.exp(-(dx * dx + dy * dy) / (2 * g.sig * g.sig));
    }
    return s;
  }
  P = genParams(seed);

  // ---------- contour extraction (marching squares, segments joined to paths) ----------
  function contourPaths(F, nx, ny, level) {
    var ptOf = {};   // edge key -> [gx, gy]
    function hPoint(i, j) {
      var k = "h" + i + "_" + j, p = ptOf[k];
      if (p) return p;
      var a = F[j][i], b = F[j][i + 1];
      var t = (level - a) / (b - a);
      p = [i + t, j]; ptOf[k] = p; return p;
    }
    function vPoint(i, j) {
      var k = "v" + i + "_" + j, p = ptOf[k];
      if (p) return p;
      var a = F[j][i], b = F[j + 1][i];
      var t = (level - a) / (b - a);
      p = [i, j + t]; ptOf[k] = p; return p;
    }
    // edges of cell (i,j): 0 bottom, 1 right, 2 top, 3 left
    function edgeKey(e, i, j) {
      if (e === 0) { hPoint(i, j); return "h" + i + "_" + j; }
      if (e === 2) { hPoint(i, j + 1); return "h" + i + "_" + (j + 1); }
      if (e === 3) { vPoint(i, j); return "v" + i + "_" + j; }
      vPoint(i + 1, j); return "v" + (i + 1) + "_" + j;
    }
    var TABLE = {
      1: [[3, 0]], 2: [[0, 1]], 3: [[3, 1]], 4: [[1, 2]], 6: [[0, 2]], 7: [[3, 2]],
      8: [[3, 2]], 9: [[0, 2]], 11: [[1, 2]], 12: [[3, 1]], 13: [[0, 1]], 14: [[3, 0]]
    };
    var segs = [];
    for (var j = 0; j < ny - 1; j++) {
      for (var i = 0; i < nx - 1; i++) {
        var v00 = F[j][i], v10 = F[j][i + 1], v11 = F[j + 1][i + 1], v01 = F[j + 1][i];
        var idx = (v00 >= level ? 1 : 0) | (v10 >= level ? 2 : 0) | (v11 >= level ? 4 : 0) | (v01 >= level ? 8 : 0);
        if (idx === 0 || idx === 15) continue;
        var pairs;
        if (idx === 5 || idx === 10) {
          var c = (v00 + v10 + v11 + v01) / 4 >= level;
          pairs = (idx === 5) ? (c ? [[3, 2], [0, 1]] : [[3, 0], [1, 2]])
                              : (c ? [[3, 0], [1, 2]] : [[3, 2], [0, 1]]);
        } else {
          pairs = TABLE[idx];
        }
        for (var q = 0; q < pairs.length; q++) {
          segs.push([edgeKey(pairs[q][0], i, j), edgeKey(pairs[q][1], i, j)]);
        }
      }
    }
    // join segments into paths through shared edge keys (degree <= 2)
    var byKey = {};
    for (var s = 0; s < segs.length; s++) {
      (byKey[segs[s][0]] = byKey[segs[s][0]] || []).push(s);
      (byKey[segs[s][1]] = byKey[segs[s][1]] || []).push(s);
    }
    var used = new Array(segs.length);
    var paths = [];
    for (var s0 = 0; s0 < segs.length; s0++) {
      if (used[s0]) continue;
      used[s0] = 1;
      var keys = [segs[s0][0], segs[s0][1]];
      var closed = false;
      // extend the tail
      for (;;) {
        var endKey = keys[keys.length - 1];
        if (endKey === keys[0] && keys.length > 2) { closed = true; break; }
        var cand = byKey[endKey] || [];
        var nxt = -1;
        for (var z = 0; z < cand.length; z++) if (!used[cand[z]]) { nxt = cand[z]; break; }
        if (nxt < 0) break;
        used[nxt] = 1;
        var other = segs[nxt][0] === endKey ? segs[nxt][1] : segs[nxt][0];
        keys.push(other);
      }
      if (!closed) {
        // extend the head backwards
        for (;;) {
          var headKey = keys[0];
          var cand2 = byKey[headKey] || [];
          var nxt2 = -1;
          for (var z2 = 0; z2 < cand2.length; z2++) if (!used[cand2[z2]]) { nxt2 = cand2[z2]; break; }
          if (nxt2 < 0) break;
          used[nxt2] = 1;
          var other2 = segs[nxt2][0] === headKey ? segs[nxt2][1] : segs[nxt2][0];
          keys.unshift(other2);
          if (other2 === keys[keys.length - 1]) { closed = true; break; }
        }
      }
      var pts = [];
      for (var m = 0; m < keys.length; m++) pts.push(ptOf[keys[m]]);
      paths.push({ pts: pts, closed: closed });
    }
    return paths;
  }

  // ---------- route fitting (waypoint switchbacks, refit per frame) ----------
  var currentRoute = []; // pixel points, refreshed every draw
  function fitRoute(summitPx, lakePx, lakeClearR) {
    var B = [plotX + plotW * 0.09, plotY + plotH * 0.90];
    var S = summitPx;
    var dx = S[0] - B[0], dy = S[1] - B[1];
    var L = Math.hypot(dx, dy) || 1;
    var px = -dy / L, py = dx / L;
    var legs = 6;
    var ampMax = Math.max(20, 0.15 * L);
    var wp = [];
    for (var k = 0; k <= legs; k++) {
      var t = k / legs;
      var off = 0;
      if (k > 0 && k < legs) off = (k % 2 === 0 ? -1 : 1) * ampMax * (1 - 0.5 * t);
      wp.push([B[0] + dx * t + px * off, B[1] + dy * t + py * off]);
    }
    // densify
    var pts = [];
    for (var a = 0; a < wp.length - 1; a++) {
      var steps = Math.max(2, Math.ceil(Math.hypot(wp[a + 1][0] - wp[a][0], wp[a + 1][1] - wp[a][1]) / 12));
      for (var sIdx = 0; sIdx < steps; sIdx++) {
        var tt = sIdx / steps;
        pts.push([wp[a][0] + (wp[a + 1][0] - wp[a][0]) * tt, wp[a][1] + (wp[a + 1][1] - wp[a][1]) * tt]);
      }
    }
    pts.push([S[0], S[1]]);
    // two light smoothing passes (endpoints fixed)
    for (var pass = 0; pass < 2; pass++) {
      var sm = [pts[0]];
      for (var i2 = 1; i2 < pts.length - 1; i2++) {
        sm.push([(pts[i2 - 1][0] + 2 * pts[i2][0] + pts[i2 + 1][0]) / 4,
                 (pts[i2 - 1][1] + 2 * pts[i2][1] + pts[i2 + 1][1]) / 4]);
      }
      sm.push(pts[pts.length - 1]);
      pts = sm;
    }
    // deflect around the lake disc and clamp inside the sheet
    for (var i3 = 1; i3 < pts.length - 1; i3++) {
      var vx = pts[i3][0] - lakePx[0], vy = pts[i3][1] - lakePx[1];
      var d = Math.hypot(vx, vy);
      if (d < lakeClearR) {
        if (d < 0.001) { vx = 1; vy = 0; d = 1; }
        pts[i3][0] = lakePx[0] + vx / d * lakeClearR;
        pts[i3][1] = lakePx[1] + vy / d * lakeClearR;
      }
      pts[i3][0] = Math.max(plotX + 5, Math.min(plotX + plotW - 5, pts[i3][0]));
      pts[i3][1] = Math.max(plotY + 5, Math.min(plotY + plotH - 5, pts[i3][1]));
    }
    return pts;
  }

  // ---------- interaction ----------
  var dragging = false, dragPt = null, tracer = null;
  var downX = 0, downY = 0, downT = 0, moved = false, lastTapT = -1000, lastTapX = 0, lastTapY = 0;
  function evPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function nowMs() { return (typeof performance !== "undefined" && performance.now) ? performance.now() : 0; }
  canvas.addEventListener("pointerdown", function (e) {
    var p = evPos(e);
    dragging = true; moved = false;
    downX = p[0]; downY = p[1]; downT = nowMs(); dragPt = p; tracer = null;
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var p = evPos(e);
    dragPt = p;
    if (Math.hypot(p[0] - downX, p[1] - downY) > 6) moved = true;
    // nearest point on the current route polyline
    var best = null, bestD = Infinity;
    for (var i = 0; i < currentRoute.length - 1; i++) {
      var ax = currentRoute[i][0], ay = currentRoute[i][1];
      var bx = currentRoute[i + 1][0], by = currentRoute[i + 1][1];
      var abx = bx - ax, aby = by - ay;
      var len2 = abx * abx + aby * aby || 1;
      var tt = ((p[0] - ax) * abx + (p[1] - ay) * aby) / len2;
      tt = tt < 0 ? 0 : (tt > 1 ? 1 : tt);
      var qx = ax + abx * tt, qy = ay + aby * tt;
      var d2 = (p[0] - qx) * (p[0] - qx) + (p[1] - qy) * (p[1] - qy);
      if (d2 < bestD) { bestD = d2; best = [qx, qy]; }
    }
    tracer = best;
  });
  function endPointer(e) {
    if (!dragging) return;
    dragging = false; tracer = null;
    var t = nowMs();
    if (!moved && t - downT < 400) {
      if (t - lastTapT < 350 && Math.hypot(downX - lastTapX, downY - lastTapY) < 48) {
        // double-tap: reseed the massif
        seed = (Math.imul(seed, 9301) + 49297) % 233280;
        if (seed < 0) seed += 233280;
        P = genParams(seed + 644000);
        lastTapT = -1000;
      } else {
        lastTapT = t; lastTapX = downX; lastTapY = downY;
      }
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  // ---------- draw ----------
  var LEVELS = [0.16, 0.26, 0.36, 0.46, 0.56, 0.66, 0.76, 0.86];
  function draw(tSec) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    var u = Math.min(W, H);
    var lwContour = Math.max(1, u * 0.0018);
    var lwRoute = Math.max(1.6, u * 0.0032);

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // field grid at this phase
    var period = 60;
    var th = 6.2832 * ((tSec % period) / period);
    var nx = COLS + 1, ny = ROWS + 1;
    var F = new Array(ny);
    var fmax = -Infinity, smaxI = 0, smaxJ = 0;
    for (var j = 0; j < ny; j++) {
      F[j] = new Array(nx);
      var v = j / ROWS;
      for (var i = 0; i < nx; i++) {
        var val = fieldRaw(P, i / COLS, v, th);
        F[j][i] = val;
        if (val > fmax && i > 2 && i < nx - 3 && j > 2 && j < ny - 3) { fmax = val; smaxI = i; smaxJ = j; }
      }
    }
    if (fmax === -Infinity) fmax = 1;

    // contours (clipped to the sheet so nothing strays past the border)
    ctx.save();
    ctx.beginPath();
    ctx.rect(plotX, plotY, plotW, plotH);
    ctx.clip();
    ctx.strokeStyle = INK;
    ctx.lineWidth = lwContour;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    for (var li = 0; li < LEVELS.length; li++) {
      var paths = contourPaths(F, nx, ny, fmax * LEVELS[li]);
      for (var pi = 0; pi < paths.length; pi++) {
        var pts = paths[pi].pts;
        if (pts.length < 2) continue;
        ctx.beginPath();
        for (var m = 0; m < pts.length; m++) {
          var X = plotX + (pts[m][0] / COLS) * plotW;
          var Y = plotY + (pts[m][1] / ROWS) * plotH;
          if (m === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
        }
        if (paths[pi].closed) ctx.closePath();
        ctx.stroke();
      }
    }

    // lake: flat blue blob in its carved basin, drawn over the inner contours
    var lakePx = [plotX + P.lake.u * plotW, plotY + P.lake.v * plotH];
    var lrx = P.lake.r * plotW, lry = P.lake.r * plotH;
    ctx.beginPath();
    for (var a2 = 0; a2 <= 28; a2++) {
      var ang = (a2 / 28) * 6.2832;
      var rr = 1 + 0.15 * Math.sin(3 * ang + P.w1) + 0.09 * Math.cos(5 * ang + P.w2);
      var LX = lakePx[0] + Math.cos(ang) * rr * lrx;
      var LY = lakePx[1] + Math.sin(ang) * rr * lry;
      if (a2 === 0) ctx.moveTo(LX, LY); else ctx.lineTo(LX, LY);
    }
    ctx.closePath();
    ctx.fillStyle = WATER;
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(0.8, lwContour * 0.7);
    ctx.stroke();

    // route, refit to the current summit
    var summitPx = [plotX + (smaxI / COLS) * plotW, plotY + (smaxJ / ROWS) * plotH];
    var lakeClearR = Math.max(lrx, lry) * 1.22 + 9;
    currentRoute = fitRoute(summitPx, lakePx, lakeClearR);
    ctx.beginPath();
    for (var r2 = 0; r2 < currentRoute.length; r2++) {
      if (r2 === 0) ctx.moveTo(currentRoute[r2][0], currentRoute[r2][1]);
      else ctx.lineTo(currentRoute[r2][0], currentRoute[r2][1]);
    }
    ctx.strokeStyle = RUST;
    ctx.lineWidth = lwRoute;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();

    // summit triangle at the field maximum
    var ts = Math.max(7, u * 0.016);
    ctx.beginPath();
    ctx.moveTo(summitPx[0], summitPx[1] - ts * 0.72);
    ctx.lineTo(summitPx[0] - ts * 0.62, summitPx[1] + ts * 0.48);
    ctx.lineTo(summitPx[0] + ts * 0.62, summitPx[1] + ts * 0.48);
    ctx.closePath();
    ctx.fillStyle = BLACK;
    ctx.fill();

    // drag tracer dot riding the route
    if (dragging && tracer) {
      ctx.beginPath();
      ctx.arc(tracer[0], tracer[1], Math.max(4.5, u * 0.008), 0, 6.2832);
      ctx.fillStyle = PAPER;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(tracer[0], tracer[1], Math.max(3, u * 0.0052), 0, 6.2832);
      ctx.fillStyle = RUST;
      ctx.fill();
    }
    ctx.restore();

    // sheet border
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.1, lwContour * 1.1);
    ctx.strokeRect(plotX, plotY, plotW, plotH);

    // folio tabs along the right edge: plain dark tabs, one tick each
    var tabW = Math.max(10, (W - (plotX + plotW)) * 0.55);
    var tabH = plotH * 0.07;
    ctx.fillStyle = INK;
    for (var tb = 0; tb < 5; tb++) {
      var ty = plotY + plotH * (0.16 + tb * 0.18) - tabH / 2;
      ctx.fillRect(plotX + plotW, ty, tabW, tabH);
      ctx.strokeStyle = PAPER;
      ctx.lineWidth = Math.max(1, lwContour);
      ctx.beginPath();
      ctx.moveTo(plotX + plotW + tabW * 0.28, ty + tabH / 2);
      ctx.lineTo(plotX + plotW + tabW * 0.72, ty + tabH / 2);
      ctx.stroke();
    }
  }

  // ---------- clock: frame one is the synchronous draw at phase 0 ----------
  if (FORCE_T !== null) {
    draw(FORCE_T);
  } else {
    draw(0);
    if (typeof requestAnimationFrame === "function") {
      var t0 = null;
      var frame = function (ts) {
        if (t0 === null) t0 = ts;
        draw((ts - t0) / 1000);
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    }
  }
})();
</script>
</body>
</html>
