<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1985 Exposed for the Force</title>
<style>
  html, body { margin: 0; padding: 0; background: #160b06; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1985 Exposed for the Force, MC2 / PP1232, study #259
  // mateo-villanueva-brandt.
  // A towering smoke column at sunset fills two thirds of the
  // frame. At its base a tiny hooded figure, near-black, gazes
  // up. The camera exposes for the smoke: the plume is
  // ember-lit and detailed, the human is a dark anchor.
  // Column vertical center-right, figure small at lower left,
  // vast dark dunes below. The column churns slowly upward,
  // embers drift, the figure is perfectly still. Watch-only:
  // the piece earns its scale from stillness, any input would
  // shrink it. Study ref: M2 backlit silhouette against the
  // element.
  var GROUND = '#160b06'; // page ground, near-black brown

  // Fixed-phase first frame: FIRST_T = 24 s. The cycle is
  // 240 s: the sky cross-fades sunset to dusk and back on a
  // smooth cosine, so there is no cut, and the column density
  // breathes on the same slow clock. At t = 24 the light is
  // still sunset (dayFrac about 0.10) and the column is at
  // full density, so the first frame shows the plume mid-churn
  // with embers visible and the figure in place.
  var FIRST_T = 24;
  var CYCLE = 240;
  var SEED = 1985;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }
  function fbm(x) {
    return vnoise(x) * 0.55 + vnoise(x * 2.13 + 7.7) * 0.30 + vnoise(x * 4.31 + 3.1) * 0.15;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function mix(a, b, f) {
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palettes: sunset -> dusk, cross-faded by dayFrac.
  // Burnt orange, deep brown, black; one ember-gold core.
  var SKY_TOP_SUN = [74, 26, 14], SKY_TOP_DUSK = [18, 10, 22];
  var SKY_MID_SUN = [188, 82, 30], SKY_MID_DUSK = [58, 30, 52];
  var SKY_LOW_SUN = [244, 150, 66], SKY_LOW_DUSK = [122, 52, 36];
  var DUNE_FAR_SUN = [92, 52, 28], DUNE_FAR_DUSK = [34, 22, 22];
  var DUNE_MID_SUN = [62, 34, 20], DUNE_MID_DUSK = [24, 16, 16];
  var DUNE_NEAR_SUN = [38, 20, 12], DUNE_NEAR_DUSK = [14, 10, 10];
  var SMOKE_HOT = [140, 80, 44];
  var SMOKE_MID = [84, 54, 40];
  var SMOKE_COOL = [48, 38, 34];
  var EMBER = [255, 140, 40];
  var EMBER_HOT = [255, 205, 110];
  var CORE = [255, 178, 74];
  var FIGURE = [12, 9, 8];
  var CREAM = [250, 232, 200];

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.horizon = H * 0.58;
    L.colCX = W * 0.66;          // column centre, right two thirds
    L.colH = L.horizon;          // column rises from horizon to top
    L.figX = W * 0.15;           // figure, small at lower left
    L.figY = H * 0.90;
    L.figH = H * 0.075;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle -----------------------------------------------------
  // dayFrac 0 = sunset, 1 = dusk, smooth cosine over CYCLE so
  // the light fades toward dusk and returns without a cut.
  // density 0.55..1 breathes on the same clock, phase offset
  // so the column is full at the first frame.
  function cycleState(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    var dayFrac = 0.5 - 0.5 * Math.cos(2 * Math.PI * p / CYCLE);
    var density = 0.72 + 0.28 * Math.sin(2 * Math.PI * p / CYCLE + 1.2);
    return { p: p, dayFrac: dayFrac, density: density };
  }

  // Column half-width at a given height above the horizon:
  // narrow at the base, billowing wider toward the top.
  function colHalfWidth(yAbove) {
    var f = clamp(yAbove / L.colH, 0, 1);
    return W * (0.11 + 0.17 * f * f);
  }

  // ---- Sky -------------------------------------------------------
  function drawSky(dayFrac, t) {
    var top = mix(SKY_TOP_SUN, SKY_TOP_DUSK, dayFrac);
    var mid = mix(SKY_MID_SUN, SKY_MID_DUSK, dayFrac);
    var low = mix(SKY_LOW_SUN, SKY_LOW_DUSK, dayFrac);
    var g = ctx.createLinearGradient(0, 0, 0, L.horizon);
    g.addColorStop(0, rgb(top));
    g.addColorStop(0.55, rgb(mid));
    g.addColorStop(1, rgb(low));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, L.horizon + 1);

    // Low sun behind the column, glow alone, no disc: a disc
    // would read as a pale orb through the thin smoke at the
    // column's base. The glow fades out as dusk comes on.
    var sunA = 1 - dayFrac;
    if (sunA > 0.02) {
      var sunX = W * 0.68, sunY = L.horizon - H * 0.005, sunR = W * 0.035;
      var sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 3.4);
      sg.addColorStop(0, rgba([255, 185, 100], a4(0.55 * sunA)));
      sg.addColorStop(1, rgba([255, 140, 60], 0));
      ctx.fillStyle = sg;
      ctx.fillRect(sunX - sunR * 3.4, sunY - sunR * 3.4, sunR * 6.8, sunR * 6.8);
    }

    // Faint stars fade in with dusk, upper sky only.
    if (dayFrac > 0.35) {
      var rng = mulberry32(SEED * 13 + 5);
      var starA = (dayFrac - 0.35) / 0.65;
      for (var i = 0; i < 46; i++) {
        var sx = rng() * W, sy = rng() * H * 0.30;
        var sr = 0.6 + rng() * 1.1;
        var tw = 0.5 + 0.5 * Math.sin(t * 0.6 + i * 1.7);
        ctx.fillStyle = rgba(CREAM, a4(0.55 * starA * tw));
        ctx.beginPath();
        ctx.moveTo(sx + sr, sy);
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---- Dunes -----------------------------------------------------
  // Vast dark dunes below the horizon: three layered ridges,
  // each a smooth noise crest, darkening toward the viewer.
  // No grass, no shrubs: the ground is empty but for the
  // figure, so the scale stays with the column.
  function duneRidge(yBase, amp, col, seedOff, t) {
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, yBase);
    // Index-based steps: accumulating x += W / 60 in floating
    // point stops one step short of W at some stage widths
    // (at W = 576 the last crest point lands at 566.4), and the
    // closing lineTo(W, H) then cuts diagonally, leaving a
    // triangular gap of page ground at the right edge. Stepping
    // by index lands exactly on W at i = 60.
    var i, x;
    for (i = 0; i <= 60; i++) {
      x = i * W / 60;
      var n = fbm(x / W * 3.1 + seedOff) - 0.5;
      ctx.lineTo(x, yBase - n * amp - Math.sin(x / W * Math.PI) * amp * 0.25);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }
  function drawDunes(dayFrac) {
    var far = mix(DUNE_FAR_SUN, DUNE_FAR_DUSK, dayFrac);
    var mid = mix(DUNE_MID_SUN, DUNE_MID_DUSK, dayFrac);
    var near = mix(DUNE_NEAR_SUN, DUNE_NEAR_DUSK, dayFrac);
    // Flat far-dune base from the horizon down past the
    // deepest dip of the far crest: without it, the strip
    // between the sky bottom and a dipping crest shows the
    // near-black page ground as a hard band.
    ctx.fillStyle = rgb(far);
    ctx.fillRect(0, L.horizon, W, H * 0.07);
    duneRidge(L.horizon + H * 0.01, H * 0.045, far, 2.3);
    duneRidge(L.horizon + H * 0.10, H * 0.06, mid, 5.9);
    duneRidge(L.horizon + H * 0.21, H * 0.075, near, 9.4);

    // Long low light catching the crest of the near ridge,
    // warm from the column side, fading toward the left.
    var crestY = L.horizon + H * 0.21;
    ctx.strokeStyle = rgba([214, 120, 52], a4(0.35 * (1 - dayFrac * 0.7)));
    ctx.lineWidth = Math.max(1, H * 0.002);
    ctx.beginPath();
    // Same index-based stepping as duneRidge, for the same
    // floating-point reason: the stroke must reach exactly W.
    var i, x;
    for (i = 0; i <= 60; i++) {
      x = i * W / 60;
      var n = fbm(x / W * 3.1 + 9.4) - 0.5;
      var y = crestY - n * H * 0.075 - Math.sin(x / W * Math.PI) * H * 0.019;
      if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
  }

  // ---- Smoke column ----------------------------------------------
  // Stacked scrolling noise sprites: rows of soft blobs whose
  // centres drift with a slow 1D noise field and scroll upward
  // with time, wrapping at the top. Each blob is a radial
  // gradient sprite fading to transparent at its edge, so the
  // overlaps melt into one another instead of reading as a
  // stack of discs. Vertical temperature gradient: the smoke
  // is ember-warm near the base and cools to near-black toward
  // the top. Three passes (outer warm smoke, mid smoke, dark
  // core) give the column volume. One ember-gold core glows
  // inside the column, brightest at the base and fading with
  // height. An ember-lit rim on the column's left edge keeps
  // it from reading as flat gray.
  function drawColumn(t, density, dayFrac) {
    var step = H * 0.020;
    var rows = Math.ceil(L.colH / step);
    var drift = H * 0.008; // px per second, upward scroll
    var pass, j, k;

    // Ember glow at the base, behind the smoke.
    var glowR = W * 0.22;
    var gg = ctx.createRadialGradient(L.colCX, L.horizon, 0, L.colCX, L.horizon, glowR);
    gg.addColorStop(0, rgba(EMBER, a4(0.55 * (1 - dayFrac * 0.6))));
    gg.addColorStop(1, rgba(EMBER, 0));
    ctx.fillStyle = gg;
    ctx.fillRect(L.colCX - glowR, L.horizon - glowR, glowR * 2, glowR);

    // Scorch shadow where the column meets the dunes.
    ctx.fillStyle = rgba([14, 8, 6], a4(0.5));
    ctx.beginPath();
    ctx.moveTo(L.colCX + W * 0.16, L.horizon + H * 0.004);
    ctx.ellipse(L.colCX, L.horizon + H * 0.004, W * 0.16, H * 0.010, 0, 0, Math.PI * 2);
    ctx.fill();

    for (pass = 0; pass < 3; pass++) {
      var passAlpha = [0.16, 0.18, 0.22][pass];
      var passScale = [1.35, 1.0, 0.62][pass];
      for (j = 0; j < rows; j++) {
        var yAbove = ((j * step + t * drift) % L.colH);
        var y = L.horizon - yAbove;
        var heat = 1 - clamp(yAbove / L.colH, 0, 1); // 1 hot at base, 0 cool at top
        var passCol = pass === 2 ? mix(SMOKE_COOL, SMOKE_MID, heat) :
          (pass === 1 ? mix(SMOKE_COOL, SMOKE_MID, heat) : mix(SMOKE_MID, SMOKE_HOT, heat));
        var spread = colHalfWidth(yAbove) * passScale;
        var nBlobs = 7;
        for (k = 0; k < nBlobs; k++) {
          var nj = fbm(j * 0.9 + k * 2.7 + t * 0.03) - 0.5;
          var bx = L.colCX + nj * 2 * spread * 0.85 +
            Math.sin(t * 0.05 + j * 0.8 + k * 1.9) * W * 0.008;
          var br = W * (0.045 + 0.055 * hash1(j * 7 + k * 13 + pass * 31)) *
            (0.8 + 0.5 * clamp(yAbove / L.colH, 0, 1)) * passScale;
          var ba = passAlpha * density * (0.7 + 0.6 * hash1(j * 3 + k * 11 + pass * 17));
          var bg = ctx.createRadialGradient(bx, y, 0, bx, y, br);
          bg.addColorStop(0, rgba(passCol, a4(ba)));
          bg.addColorStop(0.6, rgba(passCol, a4(ba * 0.6)));
          bg.addColorStop(1, rgba(passCol, 0));
          ctx.fillStyle = bg;
          ctx.fillRect(bx - br, y - br, br * 2, br * 2);
        }
      }
    }

    // Ember-gold core: one vertical glowing spine inside the
    // column, brightest at the base and fading with height.
    // A chain of heavily overlapping warm sprites, so it reads
    // as a continuous core, never a dotted line.
    var cy;
    for (cy = L.horizon; cy >= 0; cy -= H / 160) {
      var cAbove = L.horizon - cy;
      var cFrac = clamp(cAbove / L.colH, 0, 1);
      var cx = L.colCX + (fbm(cAbove * 0.02 + t * 0.03) - 0.5) * W * 0.05;
      var cr = Math.max(W * 0.02, H * 0.016) * (0.7 + 0.6 * fbm(cAbove * 0.05 + 4.2));
      var ca = 0.22 * (1 - cFrac * 0.85) * (1 - dayFrac * 0.4);
      var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
      cg.addColorStop(0, rgba(CORE, a4(ca)));
      cg.addColorStop(1, rgba(CORE, 0));
      ctx.fillStyle = cg;
      ctx.fillRect(cx - cr, cy - cr, cr * 2, cr * 2);
    }

    // Ember-lit rim along the column's left edge: a chain of
    // heavily overlapping soft warm sprites hugging the smoke
    // edge, so the light reads as a continuous glow catching
    // the column rather than a dotted line.
    var rimA = 0.22 * (1 - dayFrac * 0.55);
    var ry;
    for (ry = L.horizon; ry >= 0; ry -= H / 120) {
      var yA = L.horizon - ry;
      var rx = L.colCX - colHalfWidth(yA) * 0.62 +
        (fbm(yA * 0.02 + t * 0.03) - 0.5) * W * 0.02;
      var rr = Math.max(W * 0.014, H * 0.011); // sprite diameter
      // exceeds the step on every size, so the rim is a
      // continuous band, never a dotted line
      var rg = ctx.createRadialGradient(rx, ry, 0, rx, ry, rr);
      rg.addColorStop(0, rgba(EMBER, a4(rimA)));
      rg.addColorStop(1, rgba(EMBER, 0));
      ctx.fillStyle = rg;
      ctx.fillRect(rx - rr, ry - rr, rr * 2, rr * 2);
    }

    // Embers rising inside the column, pure functions of t.
    for (var e = 0; e < 70; e++) {
      var es = 10 + hash1(e * 3.7) * 22; // rise speed, px per second
      var ey = L.horizon - ((hash1(e * 7.7) * L.colH + t * es) % L.colH);
      var eAbove = L.horizon - ey;
      var eSpread = colHalfWidth(eAbove) * 0.9;
      var ex = L.colCX + (hash1(e * 3.1) - 0.5) * 2 * eSpread;
      var er = Math.max(0.8, W * (0.0012 + hash1(e * 5.3) * 0.0022));
      var flick = 0.55 + 0.45 * Math.sin(t * 3 + e * 2.4);
      var fade = 1 - clamp(eAbove / L.colH, 0, 1) * 0.7; // dim toward the top
      var hot = hash1(e * 11.3) > 0.7;
      ctx.fillStyle = rgba(hot ? EMBER_HOT : EMBER, a4(0.85 * flick * fade));
      ctx.beginPath();
      ctx.moveTo(ex + er, ey);
      ctx.arc(ex, ey, er, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Figure ----------------------------------------------------
  // The hooded watcher, standing small at lower left, gazing
  // up at the column. A static silhouette: no term of t enters
  // this function, the figure never moves. Drawn as one filled
  // path: hood dome tilted toward the column, cloak falling
  // straight to the ground.
  function drawFigure() {
    var fx = L.figX, fy = L.figY, h = L.figH;
    ctx.fillStyle = rgba([14, 8, 6], a4(0.4));
    ctx.beginPath();
    ctx.moveTo(fx + h * 0.30, fy + h * 0.02);
    ctx.ellipse(fx, fy + h * 0.02, h * 0.30, h * 0.05, 0, 0, Math.PI * 2);
    ctx.fill();
    // Silhouette, head tilted up toward the column.
    ctx.fillStyle = rgb(FIGURE);
    ctx.beginPath();
    ctx.moveTo(fx - h * 0.16, fy);                        // back hem
    ctx.quadraticCurveTo(fx - h * 0.20, fy - h * 0.55, fx - h * 0.13, fy - h * 0.72); // back up to shoulder
    ctx.quadraticCurveTo(fx - h * 0.12, fy - h * 0.90, fx + h * 0.02, fy - h * 0.96); // hood dome, crown toward column
    ctx.quadraticCurveTo(fx + h * 0.14, fy - h * 0.98, fx + h * 0.13, fy - h * 0.84); // hood front, face turned up
    ctx.quadraticCurveTo(fx + h * 0.12, fy - h * 0.70, fx + h * 0.15, fy - h * 0.52); // chest
    ctx.quadraticCurveTo(fx + h * 0.17, fy - h * 0.25, fx + h * 0.16, fy);           // cloak front to hem
    ctx.closePath();
    ctx.fill();
    // A faint ember rim on the figure's column-facing side:
    // the only light that reaches the watcher.
    ctx.strokeStyle = rgba([255, 150, 60], a4(0.55));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(fx + h * 0.13, fy - h * 0.84);
    ctx.quadraticCurveTo(fx + h * 0.12, fy - h * 0.70, fx + h * 0.15, fy - h * 0.52);
    ctx.quadraticCurveTo(fx + h * 0.17, fy - h * 0.25, fx + h * 0.16, fy - h * 0.02);
    ctx.stroke();
  }

  // ---- Captions --------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var cs = cycleState(t);
    var dayFrac = cs.dayFrac;

    // Ground is near-black brown; the stage is the whole image.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawSky(dayFrac, t);
    drawDunes(dayFrac);
    drawColumn(t, cs.density, dayFrac);
    drawFigure();

    // Caption, top left, and the hint, bottom center. Cream
    // stays readable from sunset into dusk.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CREAM, a4(0.88));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1985 · Exposed for the Force', W * 0.04, H * 0.055);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CREAM, a4(0.92));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the column churn.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer listeners. The piece is watched,
  // never driven.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1985 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1985 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return cycleState(t); },
      dayFrac: function (t) { return cycleState(t).dayFrac; },
      density: function (t) { return cycleState(t).density; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the slow venue cycle. The sky fades sunset
  // to dusk and back on a 240 s cosine, the column density
  // breathes, embers rise, the figure never moves. Guarded
  // so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
