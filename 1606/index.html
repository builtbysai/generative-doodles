<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We Have a River Now</title>
<style>
html, body { margin: 0; padding: 0; background: #7EC8E3; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var SKY = [126, 200, 227];
var MOUNTAIN = [139, 124, 184];
var HATCH = [91, 74, 138];
var TREE = [63, 163, 77];
var FIELD = [242, 193, 78];
var SOIL = [138, 90, 59];
var RIVER = [77, 150, 255];
var INK = [34, 48, 60];
var PHASE = 2.0;
var GROW_S = 4.0;
var STEP_S = 25.0;
var SEED = 1606007;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function easeOut(k) { k = clamp(k, 0, 1); return 1 - (1 - k) * (1 - k); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}

/* ---- the log: fixed authored dates, one day per feature, never the runtime clock ---- */
var FEATURES = [
  { name: 'tree', day: '2006-05-30' },
  { name: 'mountains', day: '2006-05-31' },
  { name: 'field', day: '2006-06-01' },
  { name: 'power', day: '2006-06-02' },
  { name: 'river', day: '2006-06-03' },
  { name: 'birds', day: '2006-06-04' }
];
var CYCLE_S = FEATURES.length * STEP_S;
function featureState(t) {
  var cyc = ((t % CYCLE_S) + CYCLE_S) % CYCLE_S;
  var idx = Math.floor(cyc / STEP_S);
  var local = cyc - idx * STEP_S;
  return { idx: idx, k: smooth(local / GROW_S) };
}

/* ---- seeded wobble: hand-drawn edges, fixed at load ---- */
function wobbleLine(x0, y0, x1, y1, n, amp, rng) {
  var pts = [], i, f, px, py, dx, dy, len, nx, ny, off;
  dx = x1 - x0; dy = y1 - y0; len = Math.sqrt(dx * dx + dy * dy) + 1e-6;
  nx = -dy / len; ny = dx / len;
  for (i = 0; i <= n; i++) {
    f = i / n;
    off = (i === 0 || i === n) ? 0 : (rng() - 0.5) * 2 * amp;
    px = x0 + dx * f + nx * off;
    py = y0 + dy * f + ny * off;
    pts.push({ x: px, y: py });
  }
  return pts;
}
function tracePts(pts) {
  ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
}
var WOB = (function () {
  var rng = mulberry32(SEED + 31);
  return {
    groundTop: rng(), groundBot: rng(),
    fieldTop: rng(), riverTop: rng(), riverBot: rng(),
    birdX: [0.52 + rng() * 0.08, 0.63 + rng() * 0.08, 0.72 + rng() * 0.08],
    birdY: [0.14 + rng() * 0.05, 0.19 + rng() * 0.05, 0.13 + rng() * 0.05],
    cloudSeed: rng() * 10
  };
})();
function bandTopEdge(rect, yFrac, amp, seed) {
  var rng = mulberry32(SEED + seed);
  return wobbleLine(rect.x, rect.y + yFrac * rect.h, rect.x + rect.w, rect.y + yFrac * rect.h, 14, amp, rng);
}
function drawBand(rect, y0, y1, color, seed) {
  var top = bandTopEdge(rect, y0, Math.max(1.5, 0.004 * rect.w), seed);
  ctx.fillStyle = rgba(color, 1);
  ctx.beginPath();
  tracePts(top);
  ctx.lineTo(rect.x + rect.w, rect.y + y1 * rect.h);
  ctx.lineTo(rect.x, rect.y + y1 * rect.h);
  ctx.closePath();
  ctx.fill();
}
function drawGroundLine(rect, yFrac, seed) {
  var pts = bandTopEdge(rect, yFrac, Math.max(1, 0.002 * rect.w), seed);
  ctx.strokeStyle = rgba(INK, 0.85);
  ctx.lineWidth = Math.max(1.2, 0.0035 * rect.w);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  tracePts(pts);
  ctx.stroke();
}
function dot(x, y, r) {
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, TAU);
}
function flourish(x, y, r, alpha) {
  if (alpha <= 0.01) return;
  ctx.strokeStyle = rgba(INK, 0.9 * alpha);
  ctx.lineWidth = Math.max(1, 0.003 * rectW());
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
  ctx.moveTo(x - r * 0.7, y - r * 0.7); ctx.lineTo(x + r * 0.7, y + r * 0.7);
  ctx.moveTo(x - r * 0.7, y + r * 0.7); ctx.lineTo(x + r * 0.7, y - r * 0.7);
  ctx.stroke();
}
function rectW() { return compRectCache.w; }
var compRectCache = { x: 0, y: 0, w: 0, h: 0 };

function drawCloud(rect, t, baseX, yFrac, speed, scale) {
  var span = 1.3;
  var fx = (((baseX + t * speed) % span) + span) % span - 0.15;
  var cx = rect.x + fx * rect.w;
  var cy = rect.y + yFrac * rect.h;
  var r = 0.035 * rect.w * scale;
  ctx.strokeStyle = rgba(INK, 0.75);
  ctx.lineWidth = Math.max(1.2, 0.003 * rect.w);
  ctx.beginPath();
  ctx.arc(cx - r * 1.1, cy, r * 0.75, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.35, r, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + r * 1.1, cy, r * 0.7, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - r * 1.8, cy + r * 0.45);
  ctx.lineTo(cx + r * 1.8, cy + r * 0.45);
  ctx.stroke();
}
function drawMountains(rect, k) {
  var x0 = rect.x, y0 = rect.y, w = rect.w, h = rect.h;
  var base = y0 + 0.60 * h;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, y0, w * clamp(k, 0, 1), h);
  ctx.clip();
  var tris = [
    { ax: 0.06, bx: 0.42, peak: 0.38 },
    { ax: 0.34, bx: 0.72, peak: 0.34 },
    { ax: 0.66, bx: 0.97, peak: 0.40 }
  ];
  var i, tr, px, py;
  for (i = 0; i < tris.length; i++) {
    tr = tris[i];
    px = x0 + ((tr.ax + tr.bx) / 2) * w;
    py = y0 + tr.peak * h;
    ctx.fillStyle = rgba(MOUNTAIN, 1);
    ctx.beginPath();
    ctx.moveTo(x0 + tr.ax * w, base);
    ctx.lineTo(px, py);
    ctx.lineTo(x0 + tr.bx * w, base);
    ctx.closePath();
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x0 + tr.ax * w, base);
    ctx.lineTo(px, py);
    ctx.lineTo(x0 + tr.bx * w, base);
    ctx.closePath();
    ctx.clip();
    ctx.strokeStyle = rgba(HATCH, 0.85);
    ctx.lineWidth = Math.max(1, 0.0028 * w);
    var hx;
    for (hx = -0.2; hx < 1.2; hx += 0.07) {
      ctx.beginPath();
      ctx.moveTo(x0 + (tr.ax + hx * (tr.bx - tr.ax)) * w, base);
      ctx.lineTo(x0 + (tr.ax + hx * (tr.bx - tr.ax) + 0.10) * w, y0 + (tr.peak - 0.02) * h);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
  if (k > 0 && k < 1) flourish(x0 + 0.42 * w, y0 + 0.38 * h, Math.max(4, 0.012 * w), 1 - k);
}
function drawTree(rect, k) {
  var e = easeOut(k);
  var ax = rect.x + 0.20 * rect.w;
  var ay = rect.y + 0.75 * rect.h;
  var s = Math.max(0.001, e);
  ctx.save();
  ctx.translate(ax, ay);
  ctx.scale(s, s);
  var u = rect.w;
  ctx.fillStyle = rgba(SOIL, 1);
  ctx.fillRect(-0.012 * u, -0.10 * u, 0.024 * u, 0.10 * u);
  ctx.fillStyle = rgba(TREE, 1);
  ctx.beginPath();
  dot(0, -0.16 * u, 0.055 * u);
  ctx.fill();
  ctx.beginPath();
  dot(-0.045 * u, -0.11 * u, 0.042 * u);
  ctx.fill();
  ctx.beginPath();
  dot(0.045 * u, -0.11 * u, 0.042 * u);
  ctx.fill();
  ctx.restore();
  if (k > 0 && k < 1) flourish(ax, ay - 0.16 * rect.w * e, Math.max(4, 0.012 * rect.w), 1 - k);
}
function drawPower(rect, k) {
  var x0 = rect.x, y0 = rect.y, w = rect.w, h = rect.h;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, y0, w * clamp(k, 0, 1), h);
  ctx.clip();
  ctx.strokeStyle = rgba(INK, 0.9);
  ctx.lineWidth = Math.max(1.5, 0.004 * w);
  ctx.lineCap = 'round';
  var poles = [0.62, 0.86];
  var i, px;
  for (i = 0; i < poles.length; i++) {
    px = x0 + poles[i] * w;
    ctx.beginPath();
    ctx.moveTo(px, y0 + 0.75 * h);
    ctx.lineTo(px, y0 + 0.50 * h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px - 0.035 * w, y0 + 0.53 * h);
    ctx.lineTo(px + 0.035 * w, y0 + 0.53 * h);
    ctx.stroke();
  }
  ctx.lineWidth = Math.max(1, 0.0028 * w);
  ctx.beginPath();
  ctx.moveTo(x0 + 0.30 * w, y0 + 0.55 * h);
  ctx.quadraticCurveTo(x0 + 0.46 * w, y0 + 0.62 * h, x0 + 0.62 * w, y0 + 0.53 * h);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x0 + 0.62 * w, y0 + 0.53 * h);
  ctx.quadraticCurveTo(x0 + 0.74 * w, y0 + 0.60 * h, x0 + 0.86 * w, y0 + 0.53 * h);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x0 + 0.86 * w, y0 + 0.53 * h);
  ctx.quadraticCurveTo(x0 + 0.93 * w, y0 + 0.58 * h, x0 + 1.0 * w, y0 + 0.54 * h);
  ctx.stroke();
  ctx.restore();
  if (k > 0 && k < 1) flourish(x0 + 0.86 * w, y0 + 0.50 * h, Math.max(4, 0.012 * w), 1 - k);
}
function drawRiver(rect, k, t) {
  var x0 = rect.x, y0 = rect.y, w = rect.w, h = rect.h;
  var top = bandTopEdge(rect, 0.80, Math.max(1.5, 0.004 * w), 77);
  var bot = bandTopEdge(rect, 0.92, Math.max(1.5, 0.004 * w), 78);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, y0, w * clamp(k, 0, 1), h);
  ctx.clip();
  ctx.fillStyle = rgba(RIVER, 1);
  ctx.beginPath();
  tracePts(top);
  for (var i = bot.length - 1; i >= 0; i--) ctx.lineTo(bot[i].x, bot[i].y);
  ctx.closePath();
  ctx.fill();
  /* shimmer: short sky dashes drifting along the band */
  var spacing = 0.09 * w;
  var off = (t * 0.012 * w) % spacing;
  ctx.strokeStyle = rgba(SKY, 0.9);
  ctx.lineWidth = Math.max(1.2, 0.003 * w);
  ctx.lineCap = 'round';
  var sx, sy;
  for (sx = x0 - spacing + off; sx < x0 + w; sx += spacing) {
    sy = y0 + 0.86 * h + Math.sin((sx - x0) / w * 9 + WOB.cloudSeed) * 0.008 * h;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + 0.035 * w, sy + 0.004 * h);
    ctx.stroke();
  }
  ctx.restore();
  if (k > 0 && k < 1) flourish(x0 + 0.5 * w, y0 + 0.86 * h, Math.max(4, 0.012 * w), 1 - k);
}
function drawBirds(rect, k) {
  var e = easeOut(k);
  var i, bx, by, r;
  ctx.strokeStyle = rgba(INK, 0.9);
  ctx.lineWidth = Math.max(1.2, 0.003 * rect.w);
  ctx.lineCap = 'round';
  for (i = 0; i < 3; i++) {
    bx = rect.x + WOB.birdX[i] * rect.w;
    by = rect.y + WOB.birdY[i] * rect.h;
    r = 0.014 * rect.w * Math.max(0.001, e);
    ctx.beginPath();
    ctx.moveTo(bx - r, by);
    ctx.lineTo(bx, by - r * 0.7);
    ctx.lineTo(bx + r, by);
    ctx.stroke();
  }
  if (k > 0 && k < 1) flourish(rect.x + WOB.birdX[1] * rect.w, rect.y + WOB.birdY[1] * rect.h, Math.max(4, 0.012 * rect.w), 1 - k);
}
function drawFeature(rect, name, k, t) {
  if (k <= 0) return;
  if (name === 'tree') drawTree(rect, k);
  else if (name === 'mountains') drawMountains(rect, k);
  else if (name === 'field') {
    ctx.save();
    ctx.beginPath();
    ctx.rect(rect.x, rect.y, rect.w * clamp(k, 0, 1), rect.h);
    ctx.clip();
    drawBand(rect, 0.60, 0.75, FIELD, 55);
    ctx.restore();
    if (k > 0 && k < 1) flourish(rect.x + 0.55 * rect.w, rect.y + 0.67 * rect.h, Math.max(4, 0.012 * rect.w), 1 - k);
  }
  else if (name === 'power') drawPower(rect, k);
  else if (name === 'river') drawRiver(rect, k, t);
  else if (name === 'birds') drawBirds(rect, k);
}

function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  compRectCache = rect;
  ctx.fillStyle = 'rgb(' + SKY[0] + ',' + SKY[1] + ',' + SKY[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var st = featureState(t);
  /* clouds idle above everything */
  drawCloud(rect, t, 0.22, 0.10, 0.004, 1.0);
  drawCloud(rect, t, 0.65, 0.22, 0.0028, 0.8);
  /* base ground: soil foreground and the ground lines, present from the first frame */
  drawBand(rect, 0.75, 1.0, SOIL, 66);
  drawGroundLine(rect, 0.60, 67);
  drawGroundLine(rect, 0.75, 68);
  /* the log, in seeded order: features already written stay, the current one grows in */
  var i;
  for (i = 0; i < FEATURES.length; i++) {
    if (i < st.idx) drawFeature(rect, FEATURES[i].name, 1, t);
    else if (i === st.idx) drawFeature(rect, FEATURES[i].name, st.k, t);
  }
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.85);
  ctx.fillText('We Have a River Now', rect.x + rect.w / 2, rect.y + Math.max(6, 0.012 * rect.h));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.65);
  ctx.fillText('2006 · 06 · 05', rect.x + rect.w / 2, rect.y + Math.max(6, 0.012 * rect.h) + titlePx + 5);
  /* the log date stamp, lower corner: the day of the latest entry written so far */
  ctx.textAlign = 'right';
  ctx.font = 'bold ' + smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.8);
  ctx.fillText('log ' + FEATURES[st.idx].day, rect.x + rect.w - 10, rect.y + rect.h - smallPx - 30);
  ctx.textAlign = 'center';
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.7);
  ctx.fillText('Watch only. The log writes itself.', rect.x + rect.w / 2, rect.y + rect.h - smallPx - 10);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
