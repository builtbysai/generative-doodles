<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№5210 · Seven Moods</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #060606; overflow: hidden; height: 100vh; cursor: pointer; user-select: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let W, H;

function resize() {
  W = innerWidth;
  H = innerHeight;
  cv.width = W;
  cv.height = H;
}
resize();
addEventListener('resize', resize);

// Color palettes merging tones across eras and moods
const palettes = [
  { bg: '#0c0a0a', baseHue: 15,  spread: 45, sat: 70, light: 58 },
  { bg: '#0a0a0e', baseHue: 280, spread: 60, sat: 75, light: 62 },
  { bg: '#100f0d', baseHue: 38,  spread: 35, sat: 65, light: 54 },
  { bg: '#090e12', baseHue: 205, spread: 50, sat: 70, light: 56 },
  { bg: '#0a100d', baseHue: 155, spread: 40, sat: 65, light: 52 },
  { bg: '#120b12', baseHue: 330, spread: 55, sat: 80, light: 60 },
  { bg: '#0d0d12', baseHue: 240, spread: 70, sat: 75, light: 64 }
];

let currentPaletteIdx = 0;
let pieces = [];
let t = 0;
let mx = 0, my = 0;

function createPieces() {
  const p = palettes[currentPaletteIdx];
  const count = 160;
  pieces = [];
  for (let k = 0; k < count; k++) {
    const a = Math.random() * Math.PI * 2;
    const rad = 60 + Math.random() * Math.min(W, H) * 0.44;
    pieces.push({
      x: W / 2 + Math.cos(a) * rad * (W > H ? 1.35 : 0.85),
      y: H / 2 + Math.sin(a) * rad * 0.65,
      z: Math.random(),
      s: 3 + Math.random() * 8,
      hue: (p.baseHue + (Math.random() - 0.5) * p.spread + 360) % 360,
      targetHue: (p.baseHue + (Math.random() - 0.5) * p.spread + 360) % 360,
      motion: Math.random() < 0.22,
      ph: Math.random() * Math.PI * 2,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35
    });
  }
}

function nextPalette() {
  currentPaletteIdx = (currentPaletteIdx + 1) % palettes.length;
  const p = palettes[currentPaletteIdx];
  for (const piece of pieces) {
    piece.targetHue = (p.baseHue + (Math.random() - 0.5) * p.spread + 360) % 360;
  }
}

addEventListener('pointermove', e => {
  mx = e.clientX / W - 0.5;
  my = e.clientY / H - 0.5;
});
addEventListener('pointerdown', nextPalette);

function frame() {
  t += 0.01;
  const cur = palettes[currentPaletteIdx];
  const grd = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.72);
  grd.addColorStop(0, cur.bg);
  grd.addColorStop(1, '#040404');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `hsla(${cur.baseHue}, 45%, 55%, 0.05)`;
  for (let i = 0; i < 48; i++) {
    const dx = (i * 137.5 + t * 10) % W;
    const dy = (i * 89.3 + t * 6) % H;
    ctx.beginPath();
    ctx.arc(dx, dy, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }
  for (const p of pieces) {
    p.hue += (p.targetHue - p.hue) * 0.05;
    p.x += p.vx + mx * p.z * 1.8;
    p.y += p.vy + my * p.z * 1.8;
    p.ph += 0.02;
    const tw = 0.55 + 0.45 * Math.sin(p.ph);
    const breathe = 1 + 0.08 * Math.sin(t * 2 + p.ph);
    const radius = p.s * breathe * (0.6 + p.z * 0.6);
    ctx.fillStyle = `hsla(${p.hue}, ${cur.sat}%, ${cur.light}%, ${0.8 * tw})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.5, radius), 0, Math.PI * 2);
    ctx.fill();
    if (p.motion) {
      ctx.strokeStyle = `hsla(${p.hue}, ${cur.sat}%, ${cur.light}%, ${0.35 * tw})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius + 5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  requestAnimationFrame(frame);
}
createPieces();
frame();
</script>
</body>
</html>
