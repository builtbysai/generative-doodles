<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illusion of Interactivity</title>
<style>
  html, body { margin: 0; padding: 0; background: #0C0E12; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var PHASE = 18; // fixed first-frame phase: CUE 03 just fired, conductor mid-gesture
  var CUE_LOOP = 45;
  var BLEND = 3; // seconds for a re-authored route to re-fit
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var vw = 0, vh = 0, dpr = 1;
  var curT = PHASE;

  function isPhone() {
    try {
      var s = window.screen;
      if (s && Math.min(s.width, s.height) < 700) return true;
    } catch (e) {}
    return vh > vw * 1.15;
  }

  // deterministic seed
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1089);
  function jit(amt) { return (rnd() * 2 - 1) * amt; }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smoother(x) { x = clamp(x, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }

  // ---- routes: closed Catmull-Rom loops through waypoints (stage fractions).
  // Each waypoint carries a target (tx,ty) and a blend origin (fx,fy,t0);
  // its effective position is a closed-form function of t, so a drag
  // re-authors the route and every drone re-fits over BLEND seconds.
  function makeRoute(defs, lapSeconds) {
    return {
      lap: lapSeconds,
      wp: defs.map(function (d) {
        var x = d[0] + jit(0.010), y = d[1] + jit(0.010);
        return { fx: x, fy: y, tx: x, ty: y, t0: -10 };
      }),
      table: null
    };
  }
  var routes = [
    makeRoute([[0.22, 0.30], [0.50, 0.20], [0.78, 0.30], [0.80, 0.55], [0.55, 0.68], [0.28, 0.60]], 26),
    makeRoute([[0.18, 0.68], [0.38, 0.44], [0.62, 0.70], [0.82, 0.47], [0.60, 0.25], [0.34, 0.31]], 34),
    makeRoute([[0.17, 0.185], [0.50, 0.155], [0.83, 0.185], [0.855, 0.50], [0.83, 0.815], [0.50, 0.845], [0.17, 0.815], [0.145, 0.50]], 40)
  ];
  // 12 drones: 4 per route, constant speed, seeded phase offsets
  var drones = [];
  routes.forEach(function (r, ri) {
    for (var k = 0; k < 4; k++) {
      drones.push({ route: ri, off: k / 4 + jit(0.03) });
    }
  });

  function wpAt(w, t) {
    var u = (t - w.t0) / BLEND;
    if (u >= 1) return { x: w.tx, y: w.ty };
    var e = smoother(u);
    return { x: w.fx + (w.tx - w.fx) * e, y: w.fy + (w.ty - w.fy) * e };
  }

  // closed Catmull-Rom sampling + arc-length table (rebuilt per frame from
  // the effective waypoints, so blends and drags are exact)
  var SEG = 48;
  function buildTable(route, t) {
    var pts = route.wp.map(function (w) { return wpAt(w, t); });
    var n = pts.length;
    var samples = [];
    for (var i = 0; i < n; i++) {
      var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      for (var k = 0; k < SEG; k++) {
        var u = k / SEG, u2 = u * u, u3 = u2 * u;
        samples.push({
          x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * u + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * u2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * u3),
          y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * u + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * u2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * u3)
        });
      }
    }
    var cum = [0];
    for (var j = 1; j <= samples.length; j++) {
      var a = samples[j - 1], b = samples[j % samples.length];
      cum.push(cum[j - 1] + Math.hypot(b.x - a.x, b.y - a.y));
    }
    route.table = { samples: samples, cum: cum, L: cum[samples.length] };
  }
  function posAt(route, dist) {
    var tb = route.table, L = tb.L;
    var d = ((dist % L) + L) % L;
    var lo = 0, hi = tb.cum.length - 1;
    while (lo < hi - 1) { var mid = (lo + hi) >> 1; if (tb.cum[mid] <= d) lo = mid; else hi = mid; }
    var segLen = tb.cum[lo + 1] - tb.cum[lo];
    var f = segLen > 0 ? (d - tb.cum[lo]) / segLen : 0;
    var a = tb.samples[lo % tb.samples.length], b = tb.samples[(lo + 1) % tb.samples.length];
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, tx: b.x - a.x, ty: b.y - a.y };
  }
  // lap-flash: time since each drone last crossed its route start, closed-form
  function routeFlash(route, t) {
    var best = 0;
    drones.forEach(function (dr) {
      if (dr.route !== routes.indexOf(route)) return;
      var p = (t / route.lap + dr.off) % 1;
      var since = p * route.lap;
      if (since < 2.2) best = Math.max(best, Math.exp(-since / 0.45));
    });
    return best;
  }

  // ---- cue clock: fully independent of the drones. The conductor gestures
  // on this clock; nothing the figure does can reach a route.
  var CUES = [3, 9.5, 16, 22.5, 29, 35.5, 42];
  var POSES = ['L', 'R', 'B', 'L', 'R', 'B', 'L']; // left / right / both arms
  var CUE_POS = [[0.14, 0.17], [0.86, 0.17], [0.86, 0.83], [0.14, 0.83], [0.50, 0.155], [0.50, 0.845], [0.125, 0.50]];
  var POSE_LEN = 2.8;
  function cueState(t) {
    var u = ((t % CUE_LOOP) + CUE_LOOP) % CUE_LOOP;
    var fired = 0, active = -1, age = 0;
    for (var i = 0; i < CUES.length; i++) {
      if (u >= CUES[i]) { fired = i + 1; if (u - CUES[i] < POSE_LEN) { active = i; age = u - CUES[i]; } }
    }
    if (fired === 0) fired = CUES.length; // wrap: last cue of the previous loop
    return { u: u, fired: fired, active: active, age: age };
  }
  // arm raise envelope for the active cue: up 0.5 s, hold, down from 2.2 s
  function raiseAt(age) {
    if (age < 0.5) return smooth(age / 0.5);
    if (age < 2.2) return 1;
    return 1 - smooth((age - 2.2) / (POSE_LEN - 2.2));
  }

  function draw(t) {
    if (!vw || !vh) return;
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';

    // stage, full-bleed
    ctx.fillStyle = '#0C0E12';
    ctx.fillRect(0, 0, vw, vh);

    // square stage, centered
    var S = Math.min(vw, vh);
    var ox = (vw - S) / 2, oy = (vh - S) / 2;
    var phone = isPhone();
    var lw = Math.max(1, S * 0.0016);
    function X(fx) { return ox + fx * S; }
    function Y(fy) { return oy + fy * S; }

    routes.forEach(function (r) { buildTable(r, t); });
    var cs = cueState(t);

    // ---- carpet: pale rectangle, ~80% of frame, faint engineering grid ----
    var cx0 = 0.10, cy0 = 0.12, cx1 = 0.90, cy1 = 0.88;
    ctx.fillStyle = '#1A1D24';
    ctx.fillRect(X(cx0), Y(cy0), (cx1 - cx0) * S, (cy1 - cy0) * S);
    ctx.strokeStyle = '#E8E8E6';
    ctx.globalAlpha = 0.045;
    ctx.lineWidth = 1;
    for (var g = 1; g < 8; g++) {
      var gx = cx0 + (cx1 - cx0) * g / 8, gy = cy0 + (cy1 - cy0) * g / 8;
      ctx.beginPath(); ctx.moveTo(X(gx), Y(cy0)); ctx.lineTo(X(gx), Y(cy1)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(cx0), Y(gy)); ctx.lineTo(X(cx1), Y(gy)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#5C6B80';
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = lw;
    ctx.strokeRect(X(cx0), Y(cy0), (cx1 - cx0) * S, (cy1 - cy0) * S);
    ctx.globalAlpha = 1;

    // ---- guide-lines: the routes are the drawing ----
    routes.forEach(function (r) {
      var flash = routeFlash(r, t);
      var sm = r.table.samples;
      function trace(width, alpha) {
        ctx.strokeStyle = '#35E0FF';
        ctx.globalAlpha = alpha;
        ctx.lineWidth = width;
        ctx.beginPath();
        for (var i = 0; i <= sm.length; i++) {
          var p = sm[i % sm.length];
          if (i === 0) ctx.moveTo(X(p.x), Y(p.y)); else ctx.lineTo(X(p.x), Y(p.y));
        }
        ctx.stroke();
      }
      trace(S * 0.011, 0.08 + 0.30 * flash);   // glow pass
      trace(S * 0.0035, 0.50);                  // body
      trace(S * 0.0016, 0.80);                  // core, at the specced 0.8
      ctx.globalAlpha = 1;
      // lap flash ring at the route start
      if (flash > 0.02) {
        var sp = sm[0];
        ctx.strokeStyle = '#35E0FF';
        ctx.globalAlpha = flash * 0.7;
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.arc(X(sp.x), Y(sp.y), S * (0.012 + 0.02 * (1 - flash)), 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      // waypoint nodes (the draggable authoring points)
      r.wp.forEach(function (w) {
        var p = wpAt(w, t);
        ctx.fillStyle = '#35E0FF';
        ctx.globalAlpha = 0.45;
        ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), S * 0.0042, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      });
    });

    // ---- cue markers: amber diamonds on their own clock ----
    CUE_POS.forEach(function (cp, i) {
      var isActive = (cs.active === i);
      var r = S * (isActive ? 0.010 : 0.0068);
      var px = X(cp[0]), py = Y(cp[1]);
      if (isActive) {
        ctx.fillStyle = '#FFB02E';
        ctx.globalAlpha = 0.25;
        ctx.beginPath(); ctx.arc(px, py, r * 2.1, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#FFB02E';
      ctx.globalAlpha = isActive ? 1 : 0.38;
      ctx.beginPath();
      ctx.moveTo(px, py - r); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r); ctx.lineTo(px - r, py);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    });

    // ---- drones: small skeletal ticks with blue orb dots ----
    drones.forEach(function (dr) {
      var r = routes[dr.route];
      var pos = posAt(r, (t / r.lap + dr.off) * r.table.L);
      var px = X(pos.x), py = Y(pos.y);
      var ang = Math.atan2(pos.ty, pos.tx);
      var d = S * 0.0105, rr = S * 0.0048;
      var ca = Math.cos(ang), sa = Math.sin(ang);
      function L(lx, ly) { return [px + (lx * ca - ly * sa) * 1, py + (lx * sa + ly * ca) * 1]; }
      ctx.strokeStyle = '#E8E8E6';
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = lw;
      // X frame
      var c1 = L(-d, -d), c2 = L(d, d), c3 = L(-d, d), c4 = L(d, -d);
      ctx.beginPath();
      ctx.moveTo(c1[0], c1[1]); ctx.lineTo(c2[0], c2[1]);
      ctx.moveTo(c3[0], c3[1]); ctx.lineTo(c4[0], c4[1]);
      ctx.stroke();
      // rotor rings at the four corners
      [c1, c2, c3, c4].forEach(function (c) {
        ctx.beginPath(); ctx.arc(c[0], c[1], rr, 0, Math.PI * 2); ctx.stroke();
      });
      ctx.globalAlpha = 1;
      // orb dot: halo + core
      ctx.fillStyle = '#35E0FF';
      ctx.globalAlpha = 0.30;
      ctx.beginPath(); ctx.arc(px, py, S * 0.0075, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#BFE3FF';
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(px, py, S * 0.0034, 0, Math.PI * 2); ctx.fill();
    });

    // ---- conductor: tiny dark figure, center, gesturing on cue time ----
    var fx = X(0.50), fy = Y(0.50);
    ctx.strokeStyle = '#5C6B80';
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(fx, fy, S * 0.031, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    var raiseL = 0, raiseR = 0;
    if (cs.active >= 0) {
      var rv = raiseAt(cs.age), pose = POSES[cs.active];
      if (pose === 'L' || pose === 'B') raiseL = rv;
      if (pose === 'R' || pose === 'B') raiseR = rv;
    }
    ctx.strokeStyle = '#101014';
    ctx.fillStyle = '#101014';
    ctx.lineWidth = Math.max(1.4, S * 0.004);
    ctx.lineCap = 'round';
    // legs
    ctx.beginPath();
    ctx.moveTo(fx, fy + S * 0.010); ctx.lineTo(fx - S * 0.008, fy + S * 0.025);
    ctx.moveTo(fx, fy + S * 0.010); ctx.lineTo(fx + S * 0.008, fy + S * 0.025);
    // torso
    ctx.moveTo(fx, fy + S * 0.010); ctx.lineTo(fx, fy - S * 0.012);
    ctx.stroke();
    // arms: hand lerps between rest (down-out) and raised (up-out)
    function hand(side, r) {
      var sx = fx + side * S * 0.007, sy = fy - S * 0.010;
      var rx = fx + side * S * 0.020, ry = fy + S * 0.006;
      var ux = fx + side * S * 0.019, uy = fy - S * 0.026;
      return { sx: sx, sy: sy, hx: rx + (ux - rx) * r, hy: ry + (uy - ry) * r };
    }
    var hL = hand(-1, raiseL), hR = hand(1, raiseR);
    ctx.beginPath();
    ctx.moveTo(hL.sx, hL.sy); ctx.lineTo(hL.hx, hL.hy);
    ctx.moveTo(hR.sx, hR.sy); ctx.lineTo(hR.hx, hR.hy);
    ctx.stroke();
    // head
    ctx.beginPath(); ctx.arc(fx, fy - S * 0.019, S * 0.0072, 0, Math.PI * 2); ctx.fill();
    ctx.lineCap = 'butt';

    // ---- corner mono labels ----
    ctx.fillStyle = '#5C6B80';
    ctx.font = Math.max(9, S * (phone ? 0.019 : 0.016)) + 'px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('ROUTE A', X(0.028), Y(0.048));
    ctx.fillText('ROUTE B', X(0.028), Y(0.972));
    ctx.textAlign = 'right';
    var cueTxt = 'CUE 0' + cs.fired;
    ctx.fillText(cueTxt, X(0.972), Y(0.048));
    ctx.fillText('ROUTE C', X(0.972), Y(0.972));
    ctx.textAlign = 'left';

    curT = t;
  }

  // ---- drag re-authoring: grab the nearest waypoint, bend its route ----
  var drag = null;
  function stagePoint(ev) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var px = (ev.clientX - rect.left), py = (ev.clientY - rect.top);
    var S = Math.min(vw, vh);
    return { fx: (px - (vw - S) / 2) / S, fy: (py - (vh - S) / 2) / S, S: S };
  }
  function bakeAll(t) {
    routes.forEach(function (r) {
      r.wp.forEach(function (w) {
        var p = wpAt(w, t);
        w.fx = p.x; w.fy = p.y; w.t0 = t;
      });
    });
  }
  function onDown(ev) {
    var sp = stagePoint(ev);
    var best = null, bestD = 0.05;
    routes.forEach(function (r) {
      r.wp.forEach(function (w) {
        var p = wpAt(w, curT);
        var d = Math.hypot(p.x - sp.fx, p.y - sp.fy);
        if (d < bestD) { bestD = d; best = w; }
      });
    });
    if (!best) return;
    bakeAll(curT);
    drag = best;
    onMove(ev);
    if (ev.preventDefault) ev.preventDefault();
  }
  function onMove(ev) {
    if (!drag) return;
    var sp = stagePoint(ev);
    drag.tx = clamp(sp.fx, 0.125, 0.875);
    drag.ty = clamp(sp.fy, 0.145, 0.855);
  }
  function onUp() { drag = null; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  function resize() {
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    } else {
      vw = window.innerWidth;
      vh = window.innerHeight;
    }
    dpr = window.devicePixelRatio || 1;
    if (dpr > 2) dpr = 2;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(curT);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) window.addEventListener('resize', resize);

  resize();
  draw(PHASE);

  // motion loop: anchored at the fixed phase, elapsed time only
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var loop = function (now) {
      if (t0 === null) t0 = now;
      draw(PHASE + (now - t0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
