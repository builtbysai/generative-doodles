<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Exchange</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#000000';
var WHITE = '#ffffff';
var FRAME_T = 60.0; /* fixed phase: first exchange mid-crossing at frame one */
var EXCHANGE_START = 55.0; /* first exchange begins 5 s before frame one, so at t=60 its head is past the gap */
var EXCHANGE_PERIOD = 210.0; /* exchanges are minutes apart */
var EXCHANGE_LEN = 8.0; /* seconds for one line to cross */
var BANDS = 64; /* horizontal bands per panel */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function greyStr(v) {
  var g = Math.round(clamp(v, 0, 255));
  return 'rgb(' + g + ',' + g + ',' + g + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
var GAP = 3;
var PANEL_W = 0;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
  GAP = Math.max(2, Math.round(F.w * 0.006));
  PANEL_W = (F.w - GAP) / 2;
}
/* Panel state: each panel evolves on its own closed-form schedule. */
/* L: slow drift 480 s, sheen 340 s. R: slow drift 660 s, sheen 430 s. */
var PANELS = [
  { x: 0, drift: 480.0, drift2: 310.0, sheen: 340.0, ph1: 0.6, ph2: 2.1, ph3: 1.2, k1: 1.3, k2: 3.1 },
  { x: 1, drift: 660.0, drift2: 410.0, sheen: 430.0, ph1: 3.9, ph2: 0.4, ph3: 2.8, k1: 0.9, k2: 2.3 }
];
function panelRect(p) {
  return { x: F.x + p.x * (PANEL_W + GAP), y: F.y, w: PANEL_W, h: F.h };
}
/* Exchanges: index k starts at EXCHANGE_START + k * EXCHANGE_PERIOD, */
/* even k sends left to right, odd k sends right to left. */
function exchangeIndex(t) {
  if (t < EXCHANGE_START) return -1;
  return Math.floor((t - EXCHANGE_START) / EXCHANGE_PERIOD);
}
function exchangeStart(k) { return EXCHANGE_START + k * EXCHANGE_PERIOD; }
function exchangeFrom(k) { return (k % 2 === 0) ? 0 : 1; }
function exchangeTo(k) { return (k % 2 === 0) ? 1 : 0; }
/* Height of the travelling line for exchange k, from a fixed seed. */
function exchangeY(k) {
  var r = mulberry32(1770 + k * 7);
  return 0.25 + r() * 0.5;
}
/* How many exchanges panel p has fully absorbed by time t. */
function absorbedCount(p, t) {
  var k, n = 0;
  var last = exchangeIndex(t);
  for (k = 0; k <= last; k++) {
    if (exchangeTo(k) === p && t >= exchangeStart(k) + EXCHANGE_LEN) n++;
  }
  return n;
}
function panelGrey(p, v, t) {
  var recv = absorbedCount(p.x, t);
  var shift = recv * 0.12; /* receiving panel shifts slightly per absorption */
  var lift = Math.min(recv, 4) * 1.2;
  var g = 9
    + 7 * Math.sin(TAU * (v * p.k1) + t / p.drift * TAU + p.ph1 + shift)
    + 4 * Math.sin(TAU * (v * p.k2) - t / p.drift2 * TAU + p.ph2);
  /* slow sheen: one faint lighter band drifting through the panel */
  var centre = 0.5 + 0.3 * Math.sin(t / p.sheen * TAU + p.ph3);
  var d = (v - centre) / 0.09;
  g += 3.5 * Math.exp(-d * d);
  return g + lift;
}
function drawPanel(p, t) {
  var r = panelRect(p);
  var i, v, y0, bh;
  bh = r.h / BANDS;
  for (i = 0; i < BANDS; i++) {
    v = (i + 0.5) / BANDS;
    y0 = r.y + i * bh;
    ctx.fillStyle = greyStr(panelGrey(p, v, t));
    ctx.fillRect(r.x, y0, r.w, bh + 0.5);
  }
  /* hairline edge so each panel reads against the black ground */
  ctx.fillStyle = 'rgba(255,255,255,0.0600)';
  ctx.fillRect(r.x, r.y, r.w, 1);
  ctx.fillRect(r.x, r.y + r.h - 1, r.w, 1);
  ctx.fillRect(r.x, r.y, 1, r.h);
  ctx.fillRect(r.x + r.w - 1, r.y, 1, r.h);
}
function drawExchange(t) {
  var k = exchangeIndex(t);
  if (k < 0) return;
  var start = exchangeStart(k);
  var age = t - start;
  if (age < 0 || age >= EXCHANGE_LEN) return;
  var from = exchangeFrom(k);
  var to = exchangeTo(k);
  var fr = panelRect(PANELS[from]);
  var tr = panelRect(PANELS[to]);
  var fromCx = fr.x + fr.w / 2;
  var toCx = tr.x + tr.w / 2;
  var frac = age / EXCHANGE_LEN;
  var headX = fromCx + (toCx - fromCx) * frac;
  var len = PANEL_W * 0.55;
  var x0, x1;
  if (from === 0) { x0 = headX - len; x1 = headX; }
  else { x0 = headX; x1 = headX + len; }
  var y = F.y + exchangeY(k) * F.h;
  var fadeIn = clamp(age / 1.0, 0, 1);
  var fadeOut = clamp((EXCHANGE_LEN - age) / 1.5, 0, 1);
  var alpha = (0.9 * Math.min(fadeIn, fadeOut)).toFixed(4);
  ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0, y);
  ctx.lineTo(x1, y);
  ctx.stroke();
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawPanel(PANELS[0], phaseT);
  drawPanel(PANELS[1], phaseT);
  drawExchange(phaseT);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Exchange').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Exchange').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 16').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = 'rgba(255,255,255,0.0500)';
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = 'rgba(255,255,255,0.1000)';
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = 'rgba(255,255,255,0.4200)';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Exchange', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.3000)';
  ctx.fillText('2006 · 11 · 16', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = 'rgba(255,255,255,0.0500)';
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = 'rgba(255,255,255,0.1000)';
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = 'rgba(255,255,255,0.3000)';
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    exchangeIndex: function () { return exchangeIndex(phaseT); },
    absorbed: function () { return [absorbedCount(0, phaseT), absorbedCount(1, phaseT)]; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60 s, exchange 0 mid-crossing ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
