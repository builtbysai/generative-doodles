<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.289 Gold Seam</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0C0D; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.289 Gold Seam (Sophia Golovanevskaya).
// A dark vessel that slowly breaks into shards along glowing
// seams, then reassembles, the seams staying as gold kintsugi
// lines. Each cycle the break pattern differs; the gold seams
// accumulate, up to three past sets, then fade. Tapping forces
// the next break at once; double-tapping freezes a broken
// state with glowing seams. Nothing ever reloads.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VESSEL = '#232022', EDGE = '#171417', GOLD = '#D8A93F', GLOW = '#F5D97A', GROUND = '#0D0C0D';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 7.2, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var LOOP = 16;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
function sstep(a, b, x) {
  var u = clamp01((x - a) / (b - a));
  return u * u * (3 - 2 * u);
}
function lerp(a, b, u) { return a + (b - a) * u; }

// ---- vessel profile -------------------------------------------------
// Same lathe family as the batch: half widths against height
// fraction, Catmull-Rom sampled. The vessel stands 70 percent
// of the frame height, centred in the design space.
var CX = DW / 2, VH = DH * 0.70, TOP = (DH - VH) / 2;
var PROF = [
  [0.00, 56], [0.05, 49], [0.12, 58], [0.22, 95],
  [0.34, 140], [0.44, 168], [0.54, 178], [0.64, 168],
  [0.76, 138], [0.86, 104], [0.94, 80], [1.00, 84]
];
function baseHalf(t) {
  var n = PROF.length;
  var x = clamp01(t) * (n - 1);
  var i = Math.min(n - 2, Math.floor(x));
  var u = x - i;
  var p0 = PROF[Math.max(0, i - 1)][1], p1 = PROF[i][1];
  var p2 = PROF[i + 1][1], p3 = PROF[Math.min(n - 1, i + 2)][1];
  return 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
}
var VPOLY = [];
(function buildVesselPoly() {
  var N = 44, i, t;
  for (i = 0; i <= N; i++) { t = i / N; VPOLY.push([CX + baseHalf(t), TOP + t * VH]); }
  for (i = N; i >= 0; i--) { t = i / N; VPOLY.push([CX - baseHalf(t), TOP + t * VH]); }
})();
function vesselPath() {
  ctx.beginPath();
  for (var i = 0; i < VPOLY.length; i++) {
    if (i === 0) ctx.moveTo(VPOLY[i][0], VPOLY[i][1]); else ctx.lineTo(VPOLY[i][0], VPOLY[i][1]);
  }
  ctx.closePath();
}
function inVessel(x, y) {
  var inside = false;
  for (var i = 0, j = VPOLY.length - 1; i < VPOLY.length; j = i++) {
    var xi = VPOLY[i][0], yi = VPOLY[i][1], xj = VPOLY[j][0], yj = VPOLY[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

// ---- Voronoi shards ---------------------------------------------------
// Shards are Voronoi cells of seeded points inside the vessel,
// each cell clipped to the vessel outline by the half planes
// against every other seed. All geometry is plain data, drawn
// directly each frame. Interior edges shared by two cells are
// the seams; each seam records its two cells so a separating
// seam can be stroked once under each cell transform.
function clipHalf(poly, ax, ay, bx, by) {
  var mx = (ax + bx) / 2, my = (ay + by) / 2;
  var dx = bx - ax, dy = by - ay;
  function side(p) { return (p[0] - mx) * dx + (p[1] - my) * dy; }
  var out = [];
  if (!poly.length) return out;
  for (var i = 0; i < poly.length; i++) {
    var cur = poly[i], prv = poly[(i + poly.length - 1) % poly.length];
    var sc = side(cur), sp = side(prv);
    var cin = sc <= 0.001, pin = sp <= 0.001;
    if (cin !== pin) {
      var u = sp / (sp - sc);
      out.push([prv[0] + (cur[0] - prv[0]) * u, prv[1] + (cur[1] - prv[1]) * u]);
    }
    if (cin) out.push(cur);
  }
  return out;
}
function buildShards(seed) {
  var r = rng(seed);
  var pts = [], tries = 0;
  while (pts.length < 15 && tries < 900) {
    tries++;
    var t = 0.06 + r() * 0.88;
    var hw = baseHalf(t) * 0.88;
    var x = CX + (r() * 2 - 1) * hw;
    var y = TOP + t * VH;
    if (!inVessel(x, y)) continue;
    var ok = true;
    for (var i = 0; i < pts.length; i++) {
      var ddx = pts[i][0] - x, ddy = pts[i][1] - y;
      if (ddx * ddx + ddy * ddy < 78 * 78) { ok = false; break; }
    }
    if (ok) pts.push([x, y]);
  }
  var cells = [];
  for (var a = 0; a < pts.length; a++) {
    var poly = VPOLY.slice();
    for (var b = 0; b < pts.length; b++) {
      if (b === a) continue;
      poly = clipHalf(poly, pts[a][0], pts[a][1], pts[b][0], pts[b][1]);
      if (!poly.length) break;
    }
    if (poly.length < 3) continue;
    var gx = 0, gy = 0;
    for (var k = 0; k < poly.length; k++) { gx += poly[k][0]; gy += poly[k][1]; }
    gx /= poly.length; gy /= poly.length;
    var dirx = gx - CX, diry = gy - (TOP + VH * 0.52);
    var dl = Math.sqrt(dirx * dirx + diry * diry) || 1;
    cells.push({
      poly: poly, gx: gx, gy: gy,
      dx: dirx / dl, dy: diry / dl,
      dist: 4 + r() * 7,
      rot: (r() - 0.5) * 0.045,
      shade: r()
    });
  }
  // seams: edges appearing in exactly two cells
  var map = {}, seams = [];
  function key(p, q) {
    var a1 = Math.round(p[0] * 2) + ',' + Math.round(p[1] * 2);
    var a2 = Math.round(q[0] * 2) + ',' + Math.round(q[1] * 2);
    return a1 < a2 ? a1 + '|' + a2 : a2 + '|' + a1;
  }
  for (var ci = 0; ci < cells.length; ci++) {
    var pp = cells[ci].poly;
    for (var ei = 0; ei < pp.length; ei++) {
      var p = pp[ei], q = pp[(ei + 1) % pp.length];
      var kk = key(p, q);
      if (!map[kk]) map[kk] = { p: p, q: q, cells: [] };
      map[kk].cells.push(ci);
    }
  }
  var ox = CX - 30, oy = TOP + VH * 0.34;
  for (var key2 in map) {
    var e = map[key2];
    if (e.cells.length !== 2) continue;
    var mx2 = (e.p[0] + e.q[0]) / 2, my2 = (e.p[1] + e.q[1]) / 2;
    var dd = Math.sqrt((mx2 - ox) * (mx2 - ox) + (my2 - oy) * (my2 - oy));
    seams.push({ p: e.p, q: e.q, a: e.cells[0], b: e.cells[1], thr: clamp01(dd / 430 + (r() - 0.5) * 0.10) });
  }
  return { cells: cells, seams: seams };
}
function seedFor(idx) { return 289011 + idx * 7919; }

// ---- seam history -------------------------------------------------------
var curIdx = 1;
var cur = buildShards(seedFor(curIdx));
var history = [buildShards(seedFor(0))]; // one past set already held at frame one
function pushHistory() {
  history.unshift(cur);
  if (history.length > 3) history.length = 3;
}

// ---- cycle state ----------------------------------------------------------
// One 16 second cycle: intact, crack propagates, shards part,
// hold broken and glowing, reassemble, rest with gold seams.
// Frozen (double-tap) eases separation and glow to full and
// holds them there.
var cycleStart = 0, frozen = false, freezeAmt = 0;
var curSep = 0, curReveal = 0, curGlow = 0, lastK = 0;
function phaseValues(u) {
  var sep, rev, glow;
  if (u < 0.18) { sep = 0; rev = 0; glow = 0.12; }
  else if (u < 0.38) { var f = sstep(0.18, 0.38, u); sep = 0.3 * f; rev = f; glow = 0.12 + 0.63 * f; }
  else if (u < 0.55) { var f2 = sstep(0.38, 0.55, u); sep = 0.3 + 0.7 * f2; rev = 1; glow = 0.75 + 0.25 * f2; }
  else if (u < 0.72) { sep = 1; rev = 1; glow = 1; }
  else if (u < 0.88) { var f3 = sstep(0.72, 0.88, u); sep = 1 - f3; rev = 1; glow = 1 - 0.45 * f3; }
  else { sep = 0; rev = 1; glow = 0.55; }
  return [sep, rev, glow];
}
function updateState() {
  var ct = T - cycleStart;
  var k = Math.floor(ct / LOOP);
  var u = (ct - k * LOOP) / LOOP;
  if (k > lastK) {
    for (var i = lastK; i < k; i++) { pushHistory(); curIdx++; cur = buildShards(seedFor(curIdx)); }
    lastK = k;
  }
  var v = phaseValues(u);
  var pulse = 0.92 + 0.08 * Math.sin(T * 2.2);
  curSep = Math.max(v[0], freezeAmt);
  curReveal = Math.max(v[1], freezeAmt);
  curGlow = Math.max(v[2], freezeAmt) * pulse;
}
function stepSim() {
  T += TICK;
  var target = frozen ? 1 : 0;
  freezeAmt += (target - freezeAmt) * Math.min(1, TICK * 3);
  if (Math.abs(target - freezeAmt) < 0.001) freezeAmt = target;
  updateState();
}
updateState();

// ---- drawing ----------------------------------------------------------------
function xform(cell, p, sep) {
  var ox2 = cell.dx * cell.dist * sep, oy2 = cell.dy * cell.dist * sep;
  var ang = cell.rot * sep;
  var dx = p[0] - cell.gx, dy = p[1] - cell.gy;
  var ca = Math.cos(ang), sa = Math.sin(ang);
  return [cell.gx + dx * ca - dy * sa + ox2, cell.gy + dx * sa + dy * ca + oy2];
}
function strokeSeg(p, q, f) {
  ctx.moveTo(p[0], p[1]);
  ctx.lineTo(lerp(p[0], q[0], f), lerp(p[1], q[1], f));
}
function seamPasses(seamsList, reveal, glow, sep, cellsRef, alphaScale) {
  // layered translucent gold: a wide low-alpha glow pass under
  // a narrower mid pass under a bright thin core, never a
  // gradient or shadowBlur
  var passes = [
    { wdt: 7.0, style: rgba(GLOW, 0.10 * glow * alphaScale) },
    { wdt: 3.4, style: rgba(GOLD, 0.38 * Math.max(glow, 0.25) * alphaScale) },
    { wdt: 1.5, style: rgba(GLOW, 0.85 * Math.max(glow, 0.3) * alphaScale) }
  ];
  for (var pi = 0; pi < passes.length; pi++) {
    ctx.strokeStyle = passes[pi].style;
    ctx.lineWidth = passes[pi].wdt;
    ctx.lineCap = 'round';
    ctx.beginPath();
    var any = false;
    for (var si = 0; si < seamsList.length; si++) {
      var sm = seamsList[si];
      var f = clamp01((reveal - sm.thr) / 0.08);
      if (f <= 0) continue;
      any = true;
      if (cellsRef) {
        var ca2 = cellsRef[sm.a], cb2 = cellsRef[sm.b];
        if (ca2) { var pa = xform(ca2, sm.p, sep), qa = xform(ca2, sm.q, sep); strokeSeg(pa, qa, f); }
        if (cb2) { var pb = xform(cb2, sm.p, sep), qb = xform(cb2, sm.q, sep); strokeSeg(pb, qb, f); }
      } else {
        strokeSeg(sm.p, sm.q, f);
      }
    }
    if (any) ctx.stroke();
  }
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-80, -80, DW + 160, DH + 160);
  var sep = curSep, reveal = curReveal, glow = curGlow;
  // base silhouette so parted shards never show ground inside
  vesselPath();
  ctx.fillStyle = EDGE;
  ctx.fill();
  // shards
  for (var ci = 0; ci < cur.cells.length; ci++) {
    var cell = cur.cells[ci];
    ctx.beginPath();
    for (var vi = 0; vi < cell.poly.length; vi++) {
      var tp = xform(cell, cell.poly[vi], sep);
      if (vi === 0) ctx.moveTo(tp[0], tp[1]); else ctx.lineTo(tp[0], tp[1]);
    }
    ctx.closePath();
    ctx.fillStyle = VESSEL;
    ctx.fill();
    if (cell.shade > 0.5) { ctx.fillStyle = rgba(EDGE, 0.28); ctx.fill(); }
    ctx.strokeStyle = rgba(EDGE, 0.9);
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }
  // accumulated past seam sets at rest, faint and fading with
  // age, clipped to the silhouette
  ctx.save();
  vesselPath();
  ctx.clip();
  for (var hi = 0; hi < history.length; hi++) {
    var aScale = [0.34, 0.20, 0.11][hi] || 0.11;
    seamPasses(history[hi].seams, 1, 0.55, 0, null, aScale);
  }
  ctx.restore();
  // current seams, offset with their shards so the cracks glow
  // along both parted edges, clipped to the silhouette so no
  // gold tip drifts past the vessel wall as the shards part
  ctx.save();
  vesselPath();
  ctx.clip();
  seamPasses(cur.seams, reveal, glow, sep, cur.cells, 1);
  // settled gold stays visible after reassembly
  if (sep < 0.05 && reveal >= 1) seamPasses(cur.seams, 1, 0.5, 0, null, 0.8);
  ctx.restore();
  // mouth: a dark opening with a faint gold rim
  var hw0 = baseHalf(0);
  ctx.beginPath();
  ctx.ellipse(CX, TOP, hw0, hw0 * 0.24, 0, 0, Math.PI * 2);
  ctx.fillStyle = EDGE;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(CX, TOP, hw0, hw0 * 0.24, 0, 0, Math.PI * 2);
  ctx.strokeStyle = rgba(GOLD, 0.35);
  ctx.lineWidth = 2;
  ctx.stroke();
  // foot line
  var hwB = baseHalf(1);
  ctx.beginPath();
  ctx.moveTo(CX - hwB, TOP + VH);
  ctx.lineTo(CX + hwB, TOP + VH);
  ctx.strokeStyle = rgba(EDGE, 0.9);
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ---- resize ---------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction: tap forces the next break, double-tap freezes -------------------
var downX = 0, downY = 0, downT = 0, lastTapT = -10000, pendingTap = null;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function forceBreak() {
  pushHistory();
  curIdx++;
  cur = buildShards(seedFor(curIdx));
  cycleStart = T - 0.18 * LOOP;
  lastK = 0;
  frozen = false;
  updateState();
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p[0]; downY = p[1]; downT = Date.now();
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
canvas.addEventListener('pointerup', function (e) {
  var p = toDesign(e);
  var dx = p[0] - downX, dy = p[1] - downY;
  if (dx * dx + dy * dy > 144 || Date.now() - downT > 600) return;
  var now = Date.now();
  if (now - lastTapT < 380) {
    if (pendingTap !== null && typeof clearTimeout === 'function') clearTimeout(pendingTap);
    pendingTap = null;
    lastTapT = -10000;
    frozen = !frozen;
    return;
  }
  lastTapT = now;
  if (typeof setTimeout === 'function') {
    pendingTap = setTimeout(function () { pendingTap = null; forceBreak(); }, 380);
  } else {
    forceBreak();
  }
});
canvas.addEventListener('pointercancel', function () {});

// ---- frame ---------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
