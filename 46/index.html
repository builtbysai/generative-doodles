<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№46 · Voronoi Drift</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0e; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,228,216,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to spin</div>
<script>
'use strict';
// No46 Voronoi Drift (after darien.brito, prompt 11 via Bug).
// Points on a Fibonacci sphere, projected to a disk; each visible
// point grows its Voronoi cell by half-plane clipping. The count
// breathes 120 to 260 over a 20 second loop, so the rare pentagons
// (amber) and heptagons (cyan) wander through the lattice of
// hexagons. The defects are the subject. Drag spins the sphere.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '46', 10) || 46;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
const GROUND = '#0b0b0e', EDGE = '#e8e4d8', PENT = '#e8a33d', HEPT = '#3dd6e8';
const LOOP = 20;
let rotX = 0.35, rotY = 0.6, spinV = 0, dragging = false, lastP = null;

function clipBisector(poly, px, py, qx, qy){
  const mx = (px + qx) / 2, my = (py + qy) / 2, dx = qx - px, dy = qy - py;
  const out = [];
  for (let i = 0; i < poly.length; i++){
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = (a[0] - mx) * dx + (a[1] - my) * dy;
    const db = (b[0] - mx) * dx + (b[1] - my) * dy;
    if (da <= 0) out.push(a);
    if ((da < 0 && db > 0) || (da > 0 && db < 0)){
      const t = da / (da - db);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
  }
  return out;
}
function clipCircle(poly, cx, cy, r, seg){
  let out = poly;
  const lim = r * Math.cos(Math.PI / seg);
  for (let k = 0; k < seg; k++){
    const am = ((k + 0.5) / seg) * Math.PI * 2;
    const ux = Math.cos(am), uy = Math.sin(am);
    const next = [];
    for (let i = 0; i < out.length; i++){
      const a = out[i], b = out[(i + 1) % out.length];
      const da = (a[0] - cx) * ux + (a[1] - cy) * uy - lim;
      const db = (b[0] - cx) * ux + (b[1] - cy) * uy - lim;
      if (da <= 0) next.push(a);
      if ((da < 0 && db > 0) || (da > 0 && db < 0)){
        const t = da / (da - db);
        next.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
      }
    }
    out = next;
    if (!out.length) break;
  }
  return out;
}

function drawFrame(nowMs){
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.fillStyle = GROUND; ctx.fillRect(0, 0, w, h);

  const t = (nowMs / 1000) % LOOP;
  if (!dragging){ rotY += 0.0016 + spinV; spinV *= 0.985; rotX += 0.0004; }
  const breathe = 0.5 - 0.5 * Math.cos((t / LOOP) * Math.PI * 2);
  const N = Math.round(120 + 140 * breathe);
  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) * (isPhone() ? 0.47 : 0.38);

  const GA = Math.PI * (3 - Math.sqrt(5));
  const pts = [];
  const sx = Math.sin(rotX), cxr = Math.cos(rotX), sy = Math.sin(rotY), cyr = Math.cos(rotY);
  for (let i = 0; i < N; i++){
    const y = 1 - 2 * (i + 0.5) / N;
    const rr = Math.sqrt(Math.max(0, 1 - y * y));
    const th = GA * i;
    let x = Math.cos(th) * rr, z = Math.sin(th) * rr, yy = y;
    let y1 = yy * cxr - z * sx, z1 = yy * sx + z * cxr;
    let x2 = x * cyr + z1 * sy, z2 = -x * sy + z1 * cyr;
    if (z2 <= 0.02) continue;
    pts.push([cx + x2 * R, cy + y1 * R]);
  }
  ctx.lineWidth = 0.7;
  for (let i = 0; i < pts.length; i++){
    const [px, py] = pts[i];
    const near = [];
    for (let j = 0; j < pts.length; j++){
      if (j === i) continue;
      const dx = pts[j][0] - px, dy = pts[j][1] - py;
      near.push([dx * dx + dy * dy, j]);
    }
    near.sort((a, b) => a[0] - b[0]);
    let poly = [[px - R, py - R], [px + R, py - R], [px + R, py + R], [px - R, py + R]];
    for (let k = 0; k < Math.min(12, near.length) && poly.length; k++){
      const [qx, qy] = pts[near[k][1]];
      poly = clipBisector(poly, px, py, qx, qy);
    }
    if (!poly.length) continue;
    // Clean the clipped polygon: drop near-duplicate points and merge
    // near-collinear edges, so the side count is the true cell count.
    const clean = [];
    for (const p of poly){
      const q = clean[clean.length - 1];
      if (!q || Math.hypot(p[0] - q[0], p[1] - q[1]) > 1.2) clean.push(p);
    }
    let changed = true;
    while (changed && clean.length > 3){
      changed = false;
      for (let i = 0; i < clean.length; i++){
        const a = clean[(i + clean.length - 1) % clean.length], b = clean[i], c = clean[(i + 1) % clean.length];
        const v1 = [b[0] - a[0], b[1] - a[1]], v2 = [c[0] - b[0], c[1] - b[1]];
        const l1 = Math.hypot(v1[0], v1[1]), l2 = Math.hypot(v2[0], v2[1]);
        if (l1 > 0 && l2 > 0 && Math.abs(v1[0] * v2[1] - v1[1] * v2[0]) / (l1 * l2) < 0.09){ clean.splice(i, 1); changed = true; break; }
      }
    }
    const dc = Math.hypot(px - cx, py - cy);
    const sides = dc < R * 0.84 ? clean.length : -1;
    poly = clipCircle(poly, cx, cy, R, 36);
    if (poly.length < 3) continue;
    ctx.beginPath();
    poly.forEach(([x, y], ii) => { if (ii === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.closePath();
    if (sides === 5){ ctx.fillStyle = PENT; ctx.fill(); }
    else if (sides === 7){ ctx.fillStyle = HEPT; ctx.fill(); }
    ctx.strokeStyle = EDGE; ctx.globalAlpha = 0.55; ctx.stroke(); ctx.globalAlpha = 1;
  }
  return { cells: pts.length };
}
function loop(nowMs){ drawFrame(nowMs); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); }
drawFrame(5200);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown', ev => { dragging = true; lastP = { x: ev.clientX, y: ev.clientY }; });
canvas.addEventListener('pointermove', ev => {
  if (!dragging || !lastP) return;
  rotY += (ev.clientX - lastP.x) * 0.008; rotX += (ev.clientY - lastP.y) * 0.005;
  spinV = (ev.clientX - lastP.x) * 0.0006;
  lastP = { x: ev.clientX, y: ev.clientY };
});
function endDrag(){ dragging = false; lastP = null; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
