<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.400 Snow Cello</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1E3A5F; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.400 Snow Cello (galitskaya-illustration).
// After Anna Galitskaya's Wonderful Winter Week leopard
// cellist: a flat kidlit leopard sits in a snowy clearing
// at night, serenely bowing a cello while snow falls and
// small gold note-shapes lift off the strings and fade.
// WATCH-ONLY: no interaction at all, a pure 32s motion
// loop. The bow saws on a 4s phrase (8 per loop), the
// whole figure breathes 0.99-1.01 on that same phrase,
// the head tilts with it, 150 snow particles each fall a
// whole number of field heights per loop, and 12 abstract
// notes (blob + stem, never real notation) rise on
// staggered whole-cycle loops with stepped fades, so the
// loop is seamless. Palette is closed at the five specced
// hexes, each used flat or at flat alpha steps. One
// canvas, no offscreen canvas, no gradients, no filters,
// no shadowBlur. No text anywhere.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var NIGHT = '#1E3A5F', SNOW = '#F4F6F8', GOLD = '#D9A441';
var INK = '#2B2620', BROWN = '#8A5A33', NOTEGOLD = '#E8A93D';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 32;
if (LOOP !== 32) throw new Error('Snow Cello loop must be 32s');
var BOW_P = 4; // bow phrase, seconds
if (LOOP / BOW_P !== 8) throw new Error('bow must complete exactly 8 cycles per loop');
var TICK = 1 / 60;
var GY = 762; // ground contact line under the leopard, design space
var TAU = Math.PI * 2;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-looking
// value is baked from this at load and never changes
// between frames or renders.
var seed = 400;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// Leopard spots: fixed tables baked at load, placed by
// polar coordinates scaled inside each body ellipse so no
// spot ever strays outside its silhouette.
function spotTable(n, cx, cy, rx, ry, rMin, rMax) {
  var out = [], i;
  for (i = 0; i < n; i++) {
    var a = rnd() * TAU;
    var rr = Math.sqrt(rnd()) * 0.78;
    out.push({ x: cx + Math.cos(a) * rx * rr, y: cy + Math.sin(a) * ry * rr, r: rMin + rnd() * (rMax - rMin) });
  }
  return out;
}
var TORSO_SPOTS = spotTable(12, 10, -230, 88, 115, 4.5, 8);
var HAUNCH_SPOTS = spotTable(9, -30, -95, 120, 95, 4.5, 8);
if (TORSO_SPOTS.length !== 12 || HAUNCH_SPOTS.length !== 9) throw new Error('leopard needs its spot tables');
// Head spots are authored, small, on the forehead.
var HEAD_SPOTS = [
  { x: -8, y: -450, r: 5 }, { x: 14, y: -460, r: 6 }, { x: 36, y: -448, r: 5 },
  { x: -26, y: -436, r: 4 }, { x: 54, y: -434, r: 4 }
];
if (HEAD_SPOTS.length !== 5) throw new Error('leopard needs its head spots');

// Snow: exactly 150 particles. Each falls a whole number
// of field heights per 32s loop (k = 1, 2 or 3) and sways
// on a period that divides the loop (8s or 16s), so every
// flake is home again at the wrap.
var FLAKES = [];
(function () {
  var i;
  for (i = 0; i < 150; i++) {
    FLAKES.push({
      x: rnd() * DW,
      y0: rnd() * DH,
      k: 1 + Math.floor(rnd() * 3),
      r: 1.3 + rnd() * 2.2,
      a: [0.35, 0.55, 0.8][Math.floor(rnd() * 3)],
      swayAmp: 6 + rnd() * 14,
      swayP: rnd() < 0.5 ? 8 : 16,
      swayPh: rnd() * TAU
    });
  }
})();
if (FLAKES.length !== 150) throw new Error('Snow Cello needs exactly 150 snow particles');
if (LOOP % 8 !== 0 || LOOP % 16 !== 0) throw new Error('snow sway periods must divide the loop');

// Gold notes: exactly 12 abstract shapes (blob + stem,
// some with a flag tick; never real notation). Each rises
// from the cello strings on a 16s cycle (2 per loop),
// staggered by 4/3s so the rises interleave; alpha is a
// stepped envelope, zero at both ends of the rise, so
// nothing pops at the wrap.
var NOTE_P = 16;
if (LOOP / NOTE_P !== 2) throw new Error('note cycle must complete whole times per loop');
var NOTES = [];
(function () {
  var i;
  for (i = 0; i < 12; i++) {
    NOTES.push({
      off: i * (NOTE_P / 12),
      bx: 700 + rnd() * 45,
      drift: 18 + rnd() * 26,
      dPh: rnd() * TAU,
      s: 0.8 + rnd() * 0.5,
      flag: i % 2 === 0
    });
  }
})();
if (NOTES.length !== 12) throw new Error('Snow Cello needs exactly 12 notes');

// ---- drawing helpers -----------------------------------
// Figure drawing happens in local space: origin at the
// ground contact point under the leopard, +x right, -y up.
function circ(x, y, r, col, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function ell(x, y, rx, ry, col, rot, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function poly(pts, col, alpha) {
  var i;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function limb(x1, y1, x2, y2, w, col, alpha, bend) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo((x1 + x2) / 2 + (bend || 0), (y1 + y2) / 2, x2, y2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function line(x1, y1, x2, y2, w, col, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- the clearing --------------------------------------
// Snowy pines: stacked flat triangles, ink at low alpha,
// each tier capped with a small flat snow triangle.
function pine(x, baseY, h, alpha) {
  var tiers = 3, i, w0 = h * 0.62;
  poly([[x - 5, baseY], [x + 5, baseY], [x + 4, baseY - h * 0.12], [x - 4, baseY - h * 0.12]], INK, alpha);
  for (i = 0; i < tiers; i++) {
    var fy = i / tiers;
    var ty = baseY - h * (0.08 + fy * 0.62);
    var tw = w0 * (1 - fy * 0.55);
    var th = h * 0.42;
    poly([[x - tw / 2, ty], [x + tw / 2, ty], [x, ty - th]], INK, alpha);
    poly([[x - tw * 0.16, ty - th * 0.68], [x + tw * 0.16, ty - th * 0.68], [x, ty - th]], SNOW, 0.5);
  }
}
function drawClearing() {
  var i;
  // Moon: one flat disc, upper right, with faint flat craters.
  circ(1080, 148, 54, SNOW, 0.95);
  circ(1062, 132, 10, NIGHT, 0.08);
  circ(1096, 166, 7, NIGHT, 0.08);
  circ(1088, 122, 5, NIGHT, 0.08);
  // Pines framing the sides, behind the snowfield.
  pine(84, 786, 330, 0.32);
  pine(168, 800, 235, 0.26);
  pine(30, 796, 210, 0.22);
  pine(1196, 792, 345, 0.32);
  pine(1112, 806, 225, 0.26);
  pine(1248, 800, 250, 0.22);
  // Back ridge and the snowfield hill the leopard sits on.
  ctx.fillStyle = SNOW;
  ctx.globalAlpha = 0.25;
  ctx.beginPath();
  ctx.moveTo(0, 742);
  ctx.quadraticCurveTo(340, 706, 680, 736);
  ctx.quadraticCurveTo(1000, 762, DW, 724);
  ctx.lineTo(DW, DH); ctx.lineTo(0, DH);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.moveTo(0, 756);
  ctx.quadraticCurveTo(320, 722, 640, 748);
  ctx.quadraticCurveTo(960, 772, DW, 736);
  ctx.lineTo(DW, DH); ctx.lineTo(0, DH);
  ctx.closePath(); ctx.fill();
  // Soft flat shadow pooled under the figure.
  ell(640, 768, 215, 18, INK, 0, 0.16);
}

// ---- the leopard and cello ------------------------------
function drawSpots(table) {
  var i;
  for (i = 0; i < table.length; i++) circ(table[i].x, table[i].y, table[i].r, INK);
}
function drawCello() {
  // Cello in its own tilted frame: top leaning left,
  // body resting toward the snow, endpin down.
  ctx.save();
  ctx.translate(110, -180);
  ctx.rotate(-0.32);
  ctx.scale(1.12, 1.12);
  ell(0, 60, 62, 52, BROWN);        // lower bout
  ell(0, -38, 44, 40, BROWN);       // upper bout
  ell(0, 8, 34, 32, BROWN);         // waist
  poly([[-7, -70], [7, -70], [5, -150], [-5, -150]], INK); // neck
  circ(0, -158, 10, INK);           // scroll
  line(-4, -140, -6, 95, 2.5, SNOW, 0.55);  // strings
  line(4, -140, 6, 95, 2.5, SNOW, 0.55);
  poly([[-13, 22], [13, 22], [13, 34], [-13, 34]], SNOW, 0.5); // bridge
  line(0, 112, 8, 168, 4, INK);     // endpin
  ctx.restore();
}
function drawFigure(t) {
  var ph = TAU * (t / BOW_P);            // the 4s bow phrase
  var saw = Math.sin(ph) * 26;           // bow travel along its axis
  var breathe = 1 + 0.01 * Math.sin(ph - 0.6);
  var tilt = 0.035 * Math.sin(ph - 0.9);  // head tilt, same phrase
  var i;
  ctx.save();
  ctx.translate(640, GY);
  ctx.scale(breathe, breathe);
  // Tail, curling around the base, ink tip.
  limb(-105, -34, -178, -66, 26, GOLD, 1, -10);
  circ(-182, -68, 13, GOLD);
  circ(-186, -72, 6, INK);
  circ(-150, -52, 5, INK);
  circ(-128, -40, 4.5, INK);
  // Seated haunch and torso.
  ell(-30, -95, 120, 95, GOLD);
  drawSpots(HAUNCH_SPOTS);
  ell(10, -230, 88, 115, GOLD);
  drawSpots(TORSO_SPOTS);
  // Front leg down to a flat paw on the snow.
  limb(55, -165, 62, -22, 26, GOLD, 1, 4);
  ell(68, -12, 36, 13, GOLD);
  // Cello across the body.
  drawCello();
  // Far paw resting on the cello neck.
  limb(-42, -300, 62, -302, 22, GOLD, 1, -6);
  circ(66, -304, 14, GOLD);
  // Bow: a long ink line through the hand, sawing along
  // its own axis; the hair runs parallel in faint snow.
  var bdx = 0.95, bdy = -0.31;
  var hx = 172 + bdx * saw, hy = -252 + bdy * saw;
  line(hx - bdx * 98, hy - bdy * 98, hx + bdx * 108, hy + bdy * 108, 5, INK);
  line(hx - bdx * 98 + 7, hy - bdy * 98 + 5, hx + bdx * 108 + 7, hy + bdy * 108 + 5, 2, SNOW, 0.5);
  // Bow arm: shoulder to elbow to the moving hand.
  var ex = 138 + saw * 0.4, ey = -282;
  limb(80, -308, ex, ey, 24, GOLD, 1, 6);
  limb(ex, ey, hx, hy, 20, GOLD, 1, -4);
  circ(hx, hy, 13, GOLD);
  // Head, tilting faintly with the phrase about the neck.
  ctx.save();
  ctx.translate(25, -362);
  ctx.rotate(tilt);
  ctx.translate(-25, 362);
  circ(-18, -455, 20, GOLD);   // ears
  circ(66, -452, 20, GOLD);
  circ(-18, -455, 8, INK);
  circ(66, -452, 8, INK);
  circ(25, -405, 62, GOLD);    // head
  drawSpots(HEAD_SPOTS);
  ell(28, -374, 30, 20, GOLD); // muzzle
  ell(30, -382, 8, 6, INK);    // nose
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(2, -412, 10, Math.PI * 1.12, Math.PI * 1.88);  // serene closed eyes
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(50, -412, 10, Math.PI * 1.12, Math.PI * 1.88);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(30, -362, 7, Math.PI * 0.15, Math.PI * 0.85);  // small mouth curve
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// ---- notes and snow -------------------------------------
function drawNotes(t) {
  var i;
  for (i = 0; i < NOTES.length; i++) {
    var n = NOTES[i];
    var p = ((t + n.off) % NOTE_P) / NOTE_P;
    var env = Math.sin(Math.PI * p);
    var a = Math.floor(env * 8) / 8; // stepped fade
    if (a <= 0) continue;
    var x = n.bx + 30 * p + n.drift * Math.sin(TAU * p + n.dPh);
    var y = 470 - 246 * p;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(n.s, n.s);
    ctx.globalAlpha = a;
    ell(-6, 0, 11, 8, NOTEGOLD, -0.35);
    line(3, -2, 3, -34, 4, NOTEGOLD);
    if (n.flag) poly([[3, -34], [17, -28], [17, -17], [3, -23]], NOTEGOLD);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawSnow(t) {
  var i;
  for (i = 0; i < FLAKES.length; i++) {
    var f = FLAKES[i];
    var y = (f.y0 + f.k * DH * (t / LOOP)) % DH;
    var x = f.x + f.swayAmp * Math.sin(TAU * (t / f.swayP) + f.swayPh);
    circ(x, y, f.r, SNOW, f.a);
  }
}

function draw(t) {
  ctx.fillStyle = NIGHT;
  ctx.fillRect(0, 0, DW, DH);
  drawClearing();
  drawFigure(t);
  drawNotes(t);
  drawSnow(t);
}

// ---- clock and frame -----------------------------------
// Determinism: frame one is drawn synchronously at the
// constant phase T0 (bow at mid-stroke crossing, snow
// mid-fall, notes spread through their rises), and the
// animation clock advances from that anchor in fixed
// 1/60 ticks accumulated from rAF timestamps. Frame one
// never reads a wall clock.
var T0 = 14.0;
var T = T0;
var lastNow = -1, acc = 0;
function step() { /* watch-only: state lives in the clock */ }

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Centred fit: the whole scene sits inside the viewport,
  // and the page ground takes the night tone.
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
