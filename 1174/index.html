<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wrong Ways Prevail</title>
<style>
  html, body { margin: 0; padding: 0; background: #08080A; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Wrong Ways Prevail — Jon Satrom study JS7 ----------
  // "There are no right ways to provoke the glitch, only the wrong ways
  // prevail." A dark stage where generic error dialogs arrive on a fixed
  // 28 s conductor's score (14 spawns, seeded order), drift to their resting
  // places, stack and overlap — a fugue of failure. The score strip along
  // the bottom notates every entrance. Dismissal is impossible by design:
  // tapping a dialog splits it into two smaller ones with fresh complaints;
  // dragging flings it, and it bounces off the edges of the stage. At most
  // 12 dialogs may exist; the oldest fades when the stage overflows. The
  // watch-only composition is a pure function of loop time; visitor physics
  // (flings, splits) is a fixed-timestep simulation seeded from that same
  // deterministic state, so frame one is identical for every visitor.

  var BG = '#08080A';
  var STRIP_BG = '#141416';
  var BODY = '#F0F0F0';
  var TITLEBAR = '#D0D0D0';
  var INK = '#1A1A1A';
  var NOTE = '#00FFC2';
  var NOTE_DIM = '#175244';
  var STAFF = '#2E2E33';
  var DOTS = ['#FF5F57', '#FEBC2E', '#28C840'];

  var LOOP = 28;              // seconds per composition
  var T0 = 11.0;              // first-frame phase: six resting, one arriving
  var MAXD = 12;              // dialog cap

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- the message bank: 24 absurd errors, none blaming the viewer ----------
  var BANK = [
    'The operation could not be completed because it was Tuesday.',
    'Error -609: the file is too honest.',
    'Your startup disk is almost full of regrets.',
    'Something went wrong, but politely, and at a reasonable volume.',
    'The printer has achieved sentience and requested the day off.',
    'Error 12: the calendar insists it is still 1904.',
    'A window was left open and the bits got cold.',
    'The download is complete. Nobody knows of what.',
    'Your settings have wandered off and joined a brass band.',
    'Error -1: success occurred in the wrong format.',
    'The cloud is full. Please imagine smaller weather.',
    'This action was scheduled for yesterday and missed itself.',
    'The font has opinions now. Strong ones.',
    'Error 404: the manual was last seen humming in the vents.',
    'The undo history has forgiven everything and remembers nothing.',
    'A dialog appeared inside this dialog. It also has concerns.',
    'The battery is at 104 percent and showing off.',
    'Error 7: the server responded in interpretive dance.',
    'Your files have been alphabetized by vibes.',
    'The update will install itself sometime next spring.',
    'Warning: the hamster wheel in sector 4 is purely decorative.',
    'Error -88: the shortcut took the scenic route and settled there.',
    'The trash can is full of tiny unfinished symphonies.',
    'Everything is fine. The computer just wanted to say that dramatically.'
  ];
  var TITLES = ['Error', 'Notice', 'Warning', 'Alert', 'System', 'Oops'];

  // ---------- the score: 14 entrances on a rhythmic grid ----------
  var SCORE_TIMES = [0.8, 2.4, 4.0, 5.6, 7.2, 9.0, 10.6, 12.4, 14.2, 16.0, 18.0, 20.0, 22.4, 24.8];
  var events = [];
  (function buildScore() {
    var rnd = mulberry32(1174);
    // seeded shuffle of the bank for entrance order
    var order = [];
    for (var i = 0; i < BANK.length; i++) order.push(i);
    for (var j = order.length - 1; j > 0; j--) {
      var k = Math.floor(rnd() * (j + 1));
      var tmp = order[j]; order[j] = order[k]; order[k] = tmp;
    }
    for (var e = 0; e < SCORE_TIMES.length; e++) {
      events.push({
        time: SCORE_TIMES[e],
        msg: order[e],
        title: TITLES[Math.floor(rnd() * TITLES.length)],
        size: e < 3 ? 0 : (rnd() < 0.55 ? 1 : (rnd() < 0.5 ? 0 : 2)),
        fx: 0.05 + rnd() * 0.52,          // resting spot, fractions of stage
        fy: 0.05 + rnd() * 0.62,
        edge: Math.floor(rnd() * 3),      // 0 left, 1 right, 2 top
        pitch: Math.floor(rnd() * 5)      // staff position 0..4
      });
    }
  })();
  var nextBank = SCORE_TIMES.length; // split children continue through the bank

  // ---------- viewport / layout ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, stageH = 0, stripH = 64, S = 1, phone = false;

  function fit() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var nw = vv ? vv.width : (window.innerWidth || 1280);
    var nh = vv ? vv.height : (window.innerHeight || 800);
    var ow = W, oh = stageH;
    W = nw; H = nh;
    stripH = Math.max(52, Math.min(72, Math.round(H * 0.09)));
    stageH = H - stripH;
    var sw = (typeof window !== 'undefined' && window.screen) ? Math.min(window.screen.width, window.screen.height) : 9999;
    phone = sw < 700 || H > W * 1.15;
    S = Math.min(W / 1150, stageH / 720);
    S = Math.max(0.5, Math.min(1.1, S));
    if (phone) S *= 0.94;
    canvas.width = W; canvas.height = H;
    if (ow > 0 && (ow !== W || oh !== stageH)) {
      var rx = W / ow, ry = stageH / oh;
      for (var i = 0; i < dialogs.length; i++) {
        var d = dialogs[i];
        d.x *= rx; d.y *= ry; d.vx *= rx; d.vy *= ry;
        layoutDialog(d);
        if (d.mode === 'drift' && typeof d.fx === 'number') {
          d.rx = Math.round(d.fx * Math.max(1, W - d.w));
          d.ry = Math.round(d.fy * Math.max(1, stageH - d.h));
          if (d.edge === 0) { d.sx = -d.w - 12; d.sy = d.ry; }
          else if (d.edge === 1) { d.sx = W + 12; d.sy = d.ry; }
          else { d.sx = d.rx; d.sy = -d.h - 12; }
          placeDrift(d, simTime % LOOP);
        }
        clampDialog(d);
      }
    }
  }

  // dialog geometry by size class (widths in reference px, scaled by S)
  var CLASS_W = [352, 278, 214];
  function layoutDialog(d) {
    d.w = Math.round(CLASS_W[d.size] * S);
    var fs = Math.round(14 * S);
    ctx.font = fs + 'px sans-serif';
    var maxW = d.w - Math.round(30 * S);
    var words = BANK[d.msg].split(' ');
    var lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    d.lines = lines;
    d.h = Math.round(26 * S) + Math.round(12 * S) + lines.length * Math.round(19 * S) + Math.round(34 * S) + Math.round(10 * S);
  }
  function clampDialog(d) {
    if (d.x < 0) d.x = 0;
    if (d.y < 0) d.y = 0;
    if (d.x > W - d.w) d.x = Math.max(0, W - d.w);
    if (d.y > stageH - d.h) d.y = Math.max(0, stageH - d.h);
  }

  // ---------- simulation state ----------
  var dialogs = [];        // z-order = array order
  var bornCounter = 0;
  var simTime = T0;
  var spawnedIdx = 0;
  var prevLoopT = T0 % LOOP;

  function makeDialog(ev, loopT) {
    var d = {
      msg: ev.msg, title: ev.title, size: ev.size,
      born: bornCounter++, mode: 'drift',
      spawnT: ev.time, x: 0, y: 0, vx: 0, vy: 0,
      fx: ev.fx, fy: ev.fy, edge: ev.edge,
      fadeStart: -1, wiggleStart: -99
    };
    layoutDialog(d);
    d.rx = Math.round(ev.fx * Math.max(1, W - d.w));
    d.ry = Math.round(ev.fy * Math.max(1, stageH - d.h));
    if (ev.edge === 0) { d.sx = -d.w - 12; d.sy = d.ry; }
    else if (ev.edge === 1) { d.sx = W + 12; d.sy = d.ry; }
    else { d.sx = d.rx; d.sy = -d.h - 12; }
    placeDrift(d, loopT);
    return d;
  }
  function placeDrift(d, loopT) {
    var p = (loopT - d.spawnT) / 0.8;
    if (p >= 1) { d.x = d.rx; d.y = d.ry; d.mode = 'rest'; return; }
    if (p < 0) p = 0;
    var step = Math.floor(p * 6) / 6;                 // stepped ease, 6 steps
    var e = step * step * (3 - 2 * step);
    d.x = d.sx + (d.rx - d.sx) * e;
    d.y = d.sy + (d.ry - d.sy) * e;
  }
  function spawnEvent(ev, loopT) {
    dialogs.push(makeDialog(ev, loopT));
    enforceCap();
  }
  function enforceCap() {
    var alive = [];
    for (var i = 0; i < dialogs.length; i++) if (dialogs[i].fadeStart < 0) alive.push(dialogs[i]);
    while (alive.length > MAXD) {
      var oldest = alive.shift();
      oldest.fadeStart = simTime;
    }
  }

  function initSim() {
    dialogs = []; bornCounter = 0; spawnedIdx = 0;
    var loopT = simTime % LOOP;
    while (spawnedIdx < events.length && events[spawnedIdx].time <= loopT) {
      dialogs.push(makeDialog(events[spawnedIdx], loopT));
      spawnedIdx++;
    }
    enforceCap();
    prevLoopT = loopT;
  }

  function step(dt) {
    simTime += dt;
    var loopT = simTime % LOOP;
    if (loopT < prevLoopT) {           // wrapped: the fugue restarts clean
      dialogs = []; spawnedIdx = 0;
      drag = null;
    }
    prevLoopT = loopT;
    while (spawnedIdx < events.length && events[spawnedIdx].time <= loopT) {
      spawnEvent(events[spawnedIdx], loopT);
      spawnedIdx++;
    }
    for (var i = dialogs.length - 1; i >= 0; i--) {
      var d = dialogs[i];
      if (d.fadeStart >= 0) {
        if (simTime - d.fadeStart > 0.6) dialogs.splice(i, 1);
        continue;
      }
      if (d.mode === 'drift') placeDrift(d, loopT);
      else if (d.mode === 'free') {
        d.x += d.vx * dt; d.y += d.vy * dt;
        var fr = Math.pow(0.32, dt);
        d.vx *= fr; d.vy *= fr;
        if (d.x < 0) { d.x = 0; d.vx = -d.vx * 0.6; }
        if (d.y < 0) { d.y = 0; d.vy = -d.vy * 0.6; }
        if (d.x > W - d.w) { d.x = Math.max(0, W - d.w); d.vx = -d.vx * 0.6; }
        if (d.y > stageH - d.h) { d.y = Math.max(0, stageH - d.h); d.vy = -d.vy * 0.6; }
        if (Math.abs(d.vx) < 7 && Math.abs(d.vy) < 7) { d.vx = 0; d.vy = 0; d.mode = 'rest'; }
      }
    }
  }

  // ---------- visitor interaction ----------
  var drag = null;
  function hitTest(px, py) {
    for (var i = dialogs.length - 1; i >= 0; i--) {
      var d = dialogs[i];
      if (d.fadeStart >= 0) continue;
      if (px >= d.x && px <= d.x + d.w && py >= d.y && py <= d.y + d.h) return d;
    }
    return null;
  }
  function splitDialog(d) {
    var idx = dialogs.indexOf(d);
    if (idx < 0) return;
    if (d.size >= 2) { d.wiggleStart = simTime; return; }   // smallest: just wiggle
    dialogs.splice(idx, 1);
    var dirs = [-1, 1];
    for (var k = 0; k < 2; k++) {
      var c = {
        msg: nextBank % BANK.length, title: TITLES[(d.born + k) % TITLES.length],
        size: d.size + 1, born: bornCounter++, mode: 'free',
        spawnT: -1, x: 0, y: 0, vx: dirs[k] * 95, vy: -34,
        fadeStart: -1, wiggleStart: -99
      };
      nextBank++;
      layoutDialog(c);
      c.x = d.x + d.w / 2 - c.w / 2 + dirs[k] * Math.round(d.w * 0.16);
      c.y = d.y + Math.round(d.h * 0.2) + k * Math.round(10 * S);
      clampDialog(c);
      dialogs.push(c);
    }
    enforceCap();
  }
  function toFront(d) {
    var i = dialogs.indexOf(d);
    if (i >= 0) { dialogs.splice(i, 1); dialogs.push(d); }
  }
  function onDown(px, py) {
    var d = hitTest(px, py);
    if (!d) return;
    toFront(d);
    drag = { d: d, ox: px - d.x, oy: py - d.y, sx: px, sy: py, t: simTime, moved: 0, samples: [{ x: px, y: py, t: simTime }] };
    if (d.mode === 'drift') { d.mode = 'rest'; }
    d.vx = 0; d.vy = 0;
  }
  function onMove(px, py) {
    if (!drag) return;
    var d = drag.d;
    d.x = px - drag.ox; d.y = py - drag.oy;
    clampDialog(d);
    drag.moved = Math.max(drag.moved, Math.abs(px - drag.sx) + Math.abs(py - drag.sy));
    drag.samples.push({ x: px, y: py, t: simTime });
    if (drag.samples.length > 8) drag.samples.shift();
  }
  function onUp(px, py) {
    if (!drag) return;
    var d = drag.d, wasDrag = drag;
    drag = null;
    var dist = Math.abs(px - wasDrag.sx) + Math.abs(py - wasDrag.sy);
    if (dist < 8 && simTime - wasDrag.t < 1.0) {          // a tap: dismiss? never. split.
      splitDialog(d);
      return;
    }
    var s = wasDrag.samples, vx = 0, vy = 0;
    if (s.length >= 2) {
      var a = s[0], b = s[s.length - 1], dt = Math.max(0.016, b.t - a.t);
      vx = (b.x - a.x) / dt; vy = (b.y - a.y) / dt;
      var mag = Math.sqrt(vx * vx + vy * vy);
      if (mag > 1400) { vx *= 1400 / mag; vy *= 1400 / mag; }
    }
    d.vx = vx; d.vy = vy;
    d.mode = (Math.abs(vx) < 7 && Math.abs(vy) < 7) ? 'rest' : 'free';
  }
  if (canvas && canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY); });
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
    canvas.addEventListener('pointerup', function (e) { onUp(e.clientX, e.clientY); });
    canvas.addEventListener('pointercancel', function () { drag = null; });
  }

  // ---------- drawing ----------
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.closePath();
  }
  function drawDialog(d, loopT) {
    var alpha = 1;
    if (d.fadeStart >= 0) alpha = Math.max(0, 1 - (simTime - d.fadeStart) / 0.6);
    if (loopT >= 27) alpha *= Math.max(0, 28 - loopT);   // end-of-loop clear
    if (alpha <= 0) return;
    var dx = 0;
    var wt = simTime - d.wiggleStart;
    if (wt >= 0 && wt < 0.45) dx = Math.sin(wt * 36) * 3.5 * (1 - wt / 0.45);
    var x = Math.round(d.x + dx), y = Math.round(d.y);
    ctx.save();
    ctx.globalAlpha = alpha;
    // flat offset shadow (no shadowBlur, house rule)
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    rrect(x + 5, y + 6, d.w, d.h, Math.round(8 * S)); ctx.fill();
    // body
    ctx.fillStyle = BODY;
    rrect(x, y, d.w, d.h, Math.round(8 * S)); ctx.fill();
    // title bar
    var tbh = Math.round(26 * S);
    ctx.fillStyle = TITLEBAR;
    rrect(x, y, d.w, tbh + Math.round(8 * S), Math.round(8 * S)); ctx.fill();
    ctx.fillRect(x, y + tbh, d.w, Math.round(2 * S));
    ctx.fillStyle = BODY;
    ctx.fillRect(x, y + tbh - Math.round(2 * S), d.w, Math.round(4 * S));
    // three dots
    var dr = Math.max(3, Math.round(5.5 * S));
    for (var i = 0; i < 3; i++) {
      ctx.fillStyle = DOTS[i];
      circle(x + Math.round(13 * S) + i * Math.round(17 * S), y + Math.round(tbh / 2), dr);
      ctx.fill();
    }
    // title
    ctx.fillStyle = INK;
    ctx.font = '600 ' + Math.round(13 * S) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d.title, x + d.w / 2, y + Math.round(tbh / 2) + 1);
    // message
    ctx.font = Math.round(14 * S) + 'px sans-serif';
    ctx.textAlign = 'left';
    var lh = Math.round(19 * S);
    for (var l = 0; l < d.lines.length; l++) {
      ctx.fillText(d.lines[l], x + Math.round(15 * S), y + tbh + Math.round(12 * S) + Math.round(lh / 2) + l * lh);
    }
    // OK button — decorative. tapping anywhere splits the dialog anyway.
    var bw = Math.round(56 * S), bh = Math.round(24 * S);
    var bx = x + d.w - bw - Math.round(12 * S), by = y + d.h - bh - Math.round(9 * S);
    ctx.strokeStyle = '#9A9A9A'; ctx.lineWidth = 1;
    rrect(bx, by, bw, bh, Math.round(6 * S)); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.font = Math.round(12 * S) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('OK', bx + bw / 2, by + bh / 2 + 1);
    ctx.restore();
  }
  function drawStrip(loopT) {
    ctx.fillStyle = STRIP_BG;
    ctx.fillRect(0, stageH, W, stripH);
    var top = stageH + Math.round(stripH * 0.22);
    var bot = stageH + Math.round(stripH * 0.78);
    // staff: 5 lines
    ctx.strokeStyle = STAFF; ctx.lineWidth = 1;
    for (var i = 0; i < 5; i++) {
      var y = Math.round(top + (bot - top) * (i / 4)) + 0.5;
      ctx.beginPath(); ctx.moveTo(Math.round(W * 0.04), y); ctx.lineTo(Math.round(W * 0.96), y); ctx.stroke();
    }
    var x0 = W * 0.04, x1 = W * 0.96;
    // notes
    for (var e = 0; e < events.length; e++) {
      var ev = events[e];
      var nx = x0 + (ev.time / LOOP) * (x1 - x0);
      var ny = bot - (ev.pitch / 4) * (bot - top);
      ctx.fillStyle = ev.time <= loopT ? NOTE : NOTE_DIM;
      circle(nx, ny, Math.max(3, Math.round(4.5 * S))); ctx.fill();
      ctx.fillRect(Math.round(nx + Math.max(3, Math.round(4.5 * S))) - 1, Math.round(ny - 13 * S), 2, Math.round(13 * S));
    }
    // playhead
    var px = x0 + (loopT / LOOP) * (x1 - x0);
    ctx.strokeStyle = NOTE; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(Math.round(px) + 0.5, stageH + Math.round(stripH * 0.1)); ctx.lineTo(Math.round(px) + 0.5, stageH + Math.round(stripH * 0.9)); ctx.stroke();
    ctx.lineWidth = 1;
  }
  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var loopT = simTime % LOOP;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < dialogs.length; i++) drawDialog(dialogs[i], loopT);
    drawStrip(loopT);
  }

  // ---------- boot ----------
  fit();
  initSim();
  draw();                        // synchronous fixed-phase first frame

  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', function () { fit(); draw(); });
    if (window.addEventListener) window.addEventListener('resize', function () { fit(); draw(); });
  }
  if (typeof requestAnimationFrame === 'function') {
    var start = nowMs(), last = T0;
    var frame = function () {
      var target = T0 + (nowMs() - start) / 1000;
      var remain = target - last;
      while (remain > 0) {
        var dt = Math.min(1 / 240, remain);
        step(dt);
        last += dt; remain -= dt;
      }
      draw();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
