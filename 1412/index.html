<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Future Base — Generative Doodle №1412</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #e8e2d4; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  /* ---------- palette ---------- */
  var PAPER = '#e8e2d4', INK = '#1a1a18', WINE = '#7a1e2a', POOL = '#2e6f8e',
      GOLD = '#f5c542', GRAY = '#8a8f94', DOTLINE = '#4a4a44', GREEN = '#2f6b3a';

  /* ---------- seeded rng (mulberry32), never Math.random ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1412000);

  /* ---------- alpha helper: rounded to 4 decimals (node-canvas quirk) ---------- */
  function ra(a) {
    var r = Math.round(a * 10000) / 10000;
    if (r < 0) return 0;
    if (r > 1) return 1;
    return r;
  }
  function C(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + ra(a) + ')';
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(s) { s = clamp(s, 0, 1); return s * s * (3 - 2 * s); }

  /* ---------- viewport ---------- */
  function viewportSize() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return [w, h];
  }
  function isPhoneSize(w, h) {
    if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
      return Math.min(window.screen.width, window.screen.height) < 700;
    }
    return h > w * 1.15;
  }
  function onResize() { draw(currentT); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) {
      window.addEventListener('resize', onResize);
    }
  }

  /* ---------- zones (draggable landing objects) ---------- */
  /* home positions are fractions of the viewport; offsets are px and decay back after release */
  function makeZone(fx, fy) {
    return { fx: fx, fy: fy, offX: 0, offY: 0, drag: false,
             grabDX: 0, grabDY: 0, relT: null, relX: 0, relY: 0 };
  }
  var zones = {
    wine: makeZone(0.16, 0.80),
    pool: makeZone(0.52, 0.58),
    golf: makeZone(0.83, 0.82),
    fray: makeZone(0.86, 0.18)
  };
  function zonePos(z, w, h, t) {
    var ox = z.offX, oy = z.offY;
    if (!z.drag && z.relT !== null) {
      var f = Math.exp(-(t - z.relT) / 2);
      if (f < 0.01) { z.offX = 0; z.offY = 0; z.relT = null; ox = 0; oy = 0; }
      else { ox = z.relX * f; oy = z.relY * f; }
    }
    return [z.fx * w + ox, z.fy * h + oy];
  }
  function zoneAway(z, w, h, t) {
    var p = zonePos(z, w, h, t);
    var dx = p[0] - z.fx * w, dy = p[1] - z.fy * h;
    return Math.sqrt(dx * dx + dy * dy) > 45;
  }

  /* ---------- trajectories ---------- */
  var ORIGIN = [0.10, 0.14];
  var TYPES = ['wine', 'pool', 'golf', 'golf', 'paranoid',
               'normal', 'normal', 'normal', 'normal', 'normal',
               'normal', 'normal', 'normal', 'normal', 'normal',
               'normal', 'normal', 'normal', 'normal', 'normal'];
  var LAND = {
    wine: [0.16, 0.76], pool: [0.52, 0.58], golf: [0.83, 0.82], paranoid: [0.84, 0.20]
  };
  var trajs = [];
  (function buildTrajs() {
    var placed = [[LAND.wine[0], LAND.wine[1]], [LAND.pool[0], LAND.pool[1]],
                  [LAND.golf[0], LAND.golf[1]], [LAND.paranoid[0], LAND.paranoid[1]]];
    for (var i = 0; i < 20; i++) {
      var type = TYPES[i], land;
      if (type === 'wine' || type === 'pool' || type === 'golf' || type === 'paranoid') {
        land = LAND[type === 'paranoid' ? 'paranoid' : type];
        if (type === 'golf') land = [LAND.golf[0] + (i === 3 ? 0.012 : -0.012), LAND.golf[1]];
      } else {
        var ok = false, tries = 0, cand = [0.5, 0.5];
        while (!ok && tries < 60) {
          tries++;
          cand = [0.18 + rng() * 0.75, 0.30 + rng() * 0.58];
          ok = true;
          var dxo = cand[0] - ORIGIN[0], dyo = cand[1] - ORIGIN[1];
          if (dxo * dxo + dyo * dyo < 0.0625) ok = false;
          for (var k = 0; k < placed.length && ok; k++) {
            var dx = cand[0] - placed[k][0], dy = cand[1] - placed[k][1];
            if (dx * dx + dy * dy < 0.0064) ok = false;
          }
        }
        land = cand;
        placed.push(cand);
      }
      trajs.push({
        type: type, land: land,
        bulge1: 0.10 + rng() * 0.12, bulge2: 0.10 + rng() * 0.12,
        midOff: (rng() - 0.5) * 0.12,
        fraySeed: rng() * 1000, stagger: i * 2
      });
    }
  })();

  var CYCLE = 40, DRAW_DUR = 1.4, FATE_DUR = 1.0, HOLD_END = 38, NPTS = 64;

  function quad(p0, c, p1, s) {
    var u = 1 - s;
    return [u * u * p0[0] + 2 * u * s * c[0] + s * s * p1[0],
            u * u * p0[1] + 2 * u * s * c[1] + s * s * p1[1]];
  }
  /* two semicircles arching away from the origin: O -> M -> L, second arc mirrored */
  function trajPoints(tr, w, h) {
    var O = [ORIGIN[0] * w, ORIGIN[1] * h];
    var L = [tr.land[0] * w, tr.land[1] * h];
    var dx = L[0] - O[0], dy = L[1] - O[1];
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    var px = -dy / dist, py = dx / dist;
    var M = [(O[0] + L[0]) / 2 + px * tr.midOff * dist,
             (O[1] + L[1]) / 2 + py * tr.midOff * dist];
    var C1 = [(O[0] + M[0]) / 2 + px * tr.bulge1 * dist,
              (O[1] + M[1]) / 2 + py * tr.bulge1 * dist];
    var C2 = [(M[0] + L[0]) / 2 - px * tr.bulge2 * dist,
              (M[1] + L[1]) / 2 - py * tr.bulge2 * dist];
    var pts = [];
    for (var i = 0; i <= NPTS; i++) {
      var s = i / NPTS;
      if (s <= 0.5) pts.push(quad(O, C1, M, s * 2));
      else pts.push(quad(M, C2, L, (s - 0.5) * 2));
    }
    return pts;
  }
  function strokePts(pts, upto, color, alpha, width) {
    var n = Math.max(1, Math.min(pts.length - 1, Math.floor(upto)));
    ctx.strokeStyle = C(color, alpha);
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i <= n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }
  function dot(x, y, s, color, alpha) {
    ctx.fillStyle = C(color, alpha);
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  function ring(x, y, r, color, alpha, width) {
    ctx.strokeStyle = C(color, alpha);
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  /* ---------- zone drawing ---------- */
  function drawWineGlass(x, y, u) {
    var bw = 34 * u, bh = 30 * u;
    ctx.strokeStyle = C(INK, 0.9);
    ctx.lineWidth = 2 * u;
    ctx.beginPath();
    ctx.moveTo(x - bw / 2, y - bh);
    ctx.quadraticCurveTo(x - bw / 2, y, x, y + 2 * u);
    ctx.quadraticCurveTo(x + bw / 2, y, x + bw / 2, y - bh);
    ctx.stroke();
    ctx.fillStyle = C(WINE, 0.85);
    ctx.beginPath();
    ctx.moveTo(x - bw / 2 + 3 * u, y - bh * 0.35);
    ctx.quadraticCurveTo(x - bw / 2 + 3 * u, y - 2 * u, x, y);
    ctx.quadraticCurveTo(x + bw / 2 - 3 * u, y - 2 * u, x + bw / 2 - 3 * u, y - bh * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = C(INK, 0.9);
    ctx.lineWidth = 2 * u;
    ctx.beginPath();
    ctx.moveTo(x, y + 2 * u);
    ctx.lineTo(x, y + 26 * u);
    ctx.moveTo(x - 14 * u, y + 26 * u);
    ctx.lineTo(x + 14 * u, y + 26 * u);
    ctx.stroke();
  }
  function drawPool(x, y, u) {
    ctx.fillStyle = C(POOL, 0.9);
    ctx.beginPath();
    ctx.ellipse(x, y, 92 * u, 34 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = C('#7aa8d8', 0.5);
    ctx.beginPath();
    ctx.ellipse(x, y, 62 * u, 20 * u, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function drawGreen(x, y, u, flagScale) {
    ctx.fillStyle = C(GREEN, 0.9);
    ctx.beginPath();
    ctx.ellipse(x, y, 78 * u, 30 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = C(INK, 0.95);
    ctx.beginPath();
    ctx.arc(x, y, 7 * u, 0, Math.PI * 2);
    ctx.fill();
    if (flagScale > 0.01) {
      var ph = 30 * u * flagScale;
      ctx.strokeStyle = C(INK, 0.9);
      ctx.lineWidth = 1.6 * u;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y - ph);
      ctx.stroke();
      ctx.fillStyle = C(GOLD, 0.95);
      ctx.beginPath();
      ctx.moveTo(x, y - ph);
      ctx.lineTo(x + 20 * u * flagScale, y - ph + 6 * u);
      ctx.lineTo(x, y - ph + 12 * u);
      ctx.closePath();
      ctx.fill();
    }
  }
  function drawFrayZone(x, y, u) {
    ctx.strokeStyle = C(GRAY, 0.85);
    ctx.lineWidth = 1.6 * u;
    for (var k = 0; k < 9; k++) {
      var sx = x - 34 * u + k * 8 * u;
      var sy = y + ((k * 37) % 5 - 2) * 3 * u;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + 4 * u, sy + 7 * u);
      ctx.lineTo(sx + 9 * u, sy + 2 * u);
      ctx.stroke();
    }
  }

  /* ---------- pointer: drag a landing zone ---------- */
  var dragZone = null;
  function pointerPos(e) {
    if (typeof e.clientX === 'number') return [e.clientX, e.clientY];
    return [e.offsetX || 0, e.offsetY || 0];
  }
  function onDown(e) {
    var p = pointerPos(e);
    var best = null, bestD = 1e9;
    var keys = ['wine', 'pool', 'golf', 'fray'];
    for (var i = 0; i < keys.length; i++) {
      var z = zones[keys[i]];
      var pos = zonePos(z, canvas.width, canvas.height, currentT);
      var dx = p[0] - pos[0], dy = p[1] - pos[1];
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = z; }
    }
    var grabR = Math.max(60, 70 * (Math.min(canvas.width, canvas.height) / 900));
    if (best && bestD < grabR) {
      dragZone = best;
      best.drag = true;
      best.relT = null;
      var pos2 = zonePos(best, canvas.width, canvas.height, currentT);
      best.grabDX = p[0] - pos2[0];
      best.grabDY = p[1] - pos2[1];
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragZone) return;
    var p = pointerPos(e);
    dragZone.offX = p[0] - dragZone.grabDX - dragZone.fx * canvas.width;
    dragZone.offY = p[1] - dragZone.grabDY - dragZone.fy * canvas.height;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (dragZone) {
      dragZone.drag = false;
      dragZone.relT = currentT;
      dragZone.relX = dragZone.offX;
      dragZone.relY = dragZone.offY;
      dragZone = null;
    }
    if (e && e.preventDefault) e.preventDefault();
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  /* ---------- main draw ---------- */
  var currentT = 0;
  function draw(t) {
    currentT = t;
    var size = viewportSize();
    var w = size[0], h = size[1];
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var u = Math.min(w, h) / 900;
    var phone = isPhoneSize(w, h);
    void phone; /* centered composition keeps its shape on phones; page ground is the paper color */

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, w, h);

    var wineP = zonePos(zones.wine, w, h, t);
    var poolP = zonePos(zones.pool, w, h, t);
    var golfP = zonePos(zones.golf, w, h, t);
    var frayP = zonePos(zones.fray, w, h, t);
    var wineAway = zoneAway(zones.wine, w, h, t);
    var poolAway = zoneAway(zones.pool, w, h, t);
    var golfAway = zoneAway(zones.golf, w, h, t);
    var frayAway = zoneAway(zones.fray, w, h, t);

    /* zones under the trajectories */
    drawPool(poolP[0], poolP[1], u);
    drawGreen(golfP[0], golfP[1], u, 0);
    drawFrayZone(frayP[0], frayP[1], u);
    drawWineGlass(wineP[0], wineP[1] - 30 * u, u);

    /* golf flag scale: popped while any golf trajectory is in fate or hold and the hole is home */
    var flagScale = 0;
    for (var gi = 0; gi < trajs.length; gi++) {
      if (trajs[gi].type !== 'golf') continue;
      var gl = (t + trajs[gi].stagger) % CYCLE;
      if (!golfAway && gl >= DRAW_DUR && gl < HOLD_END) {
        flagScale = gl < DRAW_DUR + FATE_DUR ? smooth((gl - DRAW_DUR) / FATE_DUR) : 1;
      }
    }
    if (flagScale > 0) drawGreen(golfP[0], golfP[1], u, flagScale);

    /* trajectories, in sequence, one every ~2 s */
    for (var i = 0; i < trajs.length; i++) {
      var tr = trajs[i];
      var local = (t + tr.stagger) % CYCLE;
      var pts = trajPoints(tr, w, h);
      var fade = 1;
      if (local >= HOLD_END) fade = 1 - (local - HOLD_END) / (CYCLE - HOLD_END);
      var lw = 2 * u;
      if (local < DRAW_DUR) {
        var p = local / DRAW_DUR;
        strokePts(pts, p * NPTS, INK, 0.9 * fade, lw);
      } else if (local < DRAW_DUR + FATE_DUR) {
        var q = (local - DRAW_DUR) / FATE_DUR;
        if (tr.type === 'wine' && !wineAway) {
          strokePts(pts, NPTS, INK, 0.9 * (1 - q) * fade, lw);
          var nd = Math.floor(q * 26);
          for (var d = 0; d < nd; d++) {
            var idx = Math.floor((d / 26) * NPTS);
            dot(pts[idx][0], pts[idx][1], 3.4 * u, DOTLINE, 0.9 * fade);
          }
        } else if (tr.type === 'pool' && !poolAway) {
          strokePts(pts, NPTS, INK, 0.9 * fade, lw);
          for (var k = 0; k < 3; k++) {
            ring(pts[NPTS][0], pts[NPTS][1], q * (26 + 34 * k) * u, POOL, 0.5 * (1 - q) * fade, 1.6 * u);
          }
        } else if (tr.type === 'golf' && !golfAway) {
          var upto = NPTS * (1 - 0.15 * q);
          strokePts(pts, upto, INK, 0.9 * fade, lw);
        } else if (tr.type === 'paranoid' && !frayAway) {
          strokePts(pts, Math.floor(NPTS * 0.7), INK, 0.9 * fade, lw);
          for (var s2 = 0; s2 < 3; s2++) {
            ctx.strokeStyle = C(GRAY, 0.8 * fade);
            ctx.lineWidth = 1.4 * u;
            ctx.beginPath();
            var start = Math.floor(NPTS * 0.7);
            ctx.moveTo(pts[start][0], pts[start][1]);
            for (var pi = start + 1; pi <= NPTS; pi++) {
              var jx = Math.sin(tr.fraySeed + s2 * 13 + pi * 1.7) * q * 8 * u;
              var jy = Math.cos(tr.fraySeed + s2 * 7 + pi * 2.3) * q * 8 * u;
              ctx.lineTo(pts[pi][0] + jx, pts[pi][1] + jy);
            }
            ctx.stroke();
          }
        } else if (tr.type === 'golf' && golfAway) {
          /* hole dragged away: the line overshoots past the hole */
          var last = pts[NPTS], prev = pts[NPTS - 1];
          var vx = last[0] - prev[0], vy = last[1] - prev[1];
          var vl = Math.sqrt(vx * vx + vy * vy) || 1;
          var over = [last[0] + vx / vl * 0.14 * Math.min(w, h) * 0.28,
                      last[1] + vy / vl * 0.14 * Math.min(w, h) * 0.28];
          strokePts(pts, NPTS, INK, 0.9 * fade, lw);
          ctx.strokeStyle = C(INK, 0.9 * fade);
          ctx.lineWidth = lw;
          ctx.beginPath();
          ctx.moveTo(last[0], last[1]);
          ctx.lineTo(over[0], over[1]);
          ctx.stroke();
          dot(over[0], over[1], 4 * u, INK, 0.9 * fade);
        } else {
          /* wine/pool/paranoid with their zone dragged away: the line lands whole */
          strokePts(pts, NPTS, INK, 0.9 * fade, lw);
          dot(pts[NPTS][0], pts[NPTS][1], 4 * u, INK, 0.9 * fade);
        }
      } else {
        /* hold: completed trace persists until the fade-out */
        if (tr.type === 'wine' && !wineAway) {
          for (var d2 = 0; d2 < 26; d2++) {
            var idx2 = Math.floor((d2 / 26) * NPTS);
            dot(pts[idx2][0], pts[idx2][1], 3.4 * u, DOTLINE, 0.9 * fade);
          }
        } else if (tr.type === 'pool' && !poolAway) {
          strokePts(pts, NPTS, INK, 0.9 * fade, lw);
          ring(pts[NPTS][0], pts[NPTS][1], 30 * u, POOL, 0.15 * fade, 1.4 * u);
          ring(pts[NPTS][0], pts[NPTS][1], 52 * u, POOL, 0.10 * fade, 1.4 * u);
        } else if (tr.type === 'golf' && !golfAway) {
          strokePts(pts, Math.floor(NPTS * 0.85), INK, 0.9 * fade, lw);
        } else if (tr.type === 'paranoid' && !frayAway) {
          strokePts(pts, Math.floor(NPTS * 0.7), INK, 0.9 * fade, lw);
          for (var s3 = 0; s3 < 3; s3++) {
            ctx.strokeStyle = C(GRAY, 0.8 * fade);
            ctx.lineWidth = 1.4 * u;
            ctx.beginPath();
            var start3 = Math.floor(NPTS * 0.7);
            ctx.moveTo(pts[start3][0], pts[start3][1]);
            for (var pi3 = start3 + 1; pi3 <= NPTS; pi3++) {
              var jx3 = Math.sin(tr.fraySeed + s3 * 13 + pi3 * 1.7) * 8 * u;
              var jy3 = Math.cos(tr.fraySeed + s3 * 7 + pi3 * 2.3) * 8 * u;
              ctx.lineTo(pts[pi3][0] + jx3, pts[pi3][1] + jy3);
            }
            ctx.stroke();
          }
        } else if (tr.type === 'golf' && golfAway) {
          var last2 = pts[NPTS], prev2 = pts[NPTS - 1];
          var vx2 = last2[0] - prev2[0], vy2 = last2[1] - prev2[1];
          var vl2 = Math.sqrt(vx2 * vx2 + vy2 * vy2) || 1;
          var over2 = [last2[0] + vx2 / vl2 * 0.14 * Math.min(w, h) * 0.28,
                       last2[1] + vy2 / vl2 * 0.14 * Math.min(w, h) * 0.28];
          strokePts(pts, NPTS, INK, 0.9 * fade, lw);
          ctx.strokeStyle = C(INK, 0.9 * fade);
          ctx.lineWidth = lw;
          ctx.beginPath();
          ctx.moveTo(last2[0], last2[1]);
          ctx.lineTo(over2[0], over2[1]);
          ctx.stroke();
          dot(over2[0], over2[1], 4 * u, INK, 0.9 * fade);
        } else {
          strokePts(pts, NPTS, INK, 0.9 * fade, lw);
          dot(pts[NPTS][0], pts[NPTS][1], 4 * u, INK, 0.9 * fade);
        }
      }
    }

    /* origin: fixed, never moves */
    var ox = ORIGIN[0] * w, oy = ORIGIN[1] * h;
    ctx.fillStyle = C(INK, 0.95);
    ctx.beginPath();
    ctx.arc(ox, oy, 5 * u, 0, Math.PI * 2);
    ctx.fill();
    ring(ox, oy, 11 * u, INK, 0.35, 1.2 * u);
  }

  /* frame one: synchronous, constant phase */
  draw(0);

  /* animation clock starts only with the rAF loop */
  var startTime = null;
  function loop(ts) {
    if (startTime === null) startTime = ts;
    draw((ts - startTime) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
