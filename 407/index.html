<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.407 Edition Engine</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5EFE0; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.407 Edition Engine (nina-clausonet, EXPANSION #43).
// After Nina Clausonet's challenge-origination
// mechanism: the piece is a living announcement
// poster for her drawing challenges. Poster content
// IS the artwork here (the designed-text exception):
// a seasonal header scene with her white-haired
// closed-eye muse, the prompt list as designed rows
// (one icon glyph plus its term per row), a rules
// block of four fixed lines, and a host roll of
// exactly ten avatar dots with tiny motif glyphs.
// No real names or handles anywhere. The three
// editions are FIXED AUTHORED POSTERS, never seeded
// at runtime: September (Sweetember Days), December
// (Wonderful Winter Week), July (Month of Masters),
// one palette per edition, never mixed. DOUBLE-TAP
// advances the season with a 1s page-turn wipe on
// fixed ticks; the old poster slides off left over
// the new one. DRAG scrolls the prompt rows inside
// their clip; on release a spring returns the scroll
// to exactly zero. Ambient 15s loop: the header
// scene breathes on one whole cycle, and exactly one
// host dot pulses at a time, each dot taking a 1.5s
// turn in fixed order. Grain is her heavy paper
// grain as DATA: exactly 900 fixed speckle dots drawn
// in table order every frame, never a texture or
// filter. Frame one is the September edition complete
// at the constant phase T = 3.2s; the clock is
// anchored there and advances in fixed 1/60 ticks,
// never from a wall clock. Flat colour only, one
// canvas, no offscreen canvas, no gradients, no
// shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- fixed slots ---------------------------------------
// Her muse is one recipe under every edition: white
// hair, cream-pink skin, ink features. Edition
// palettes live in the EDITIONS table below.
var SKIN = '#F2C9A8', HAIR = '#FFFFFF';
var FEATURE = '#2B2620';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 15;
if (LOOP !== 15) throw new Error('Edition Engine ambient loop must be 15s');
var TICK = 1 / 60;
var T0 = 3.2;
var T = T0;

// ---- the fixed authored editions -----------------------
// Rows are authored from her observed lexicons. Each
// row: one icon glyph plus its term. Rules are the
// same four fixed lines in every edition.
var RULES = [
  'Draw each prompt in your own style',
  'Hand drawn only, no AI art',
  'One drawing a day, late is fine',
  'Share it with the challenge tag'
];
if (RULES.length !== 4) throw new Error('rules block must hold exactly 4 lines');

var EDITIONS = [
  {
    name: 'September',
    ground: '#F5EFE0', ink: '#2B2620',
    acc: '#C0562F', acc2: '#E8A93D',
    chipA: { bg: '#C0562F', fg: '#F5EFE0' },
    chipB: { bg: '#E8A93D', fg: '#2B2620' },
    title: 'SWEETEMBER DAYS', titleSize: 62,
    sub: 'SEPTEMBER EDITION - ONE PROMPT A DAY',
    prop: 'leaves',
    rows: [
      { glyph: 'cat',      term: 'cozy cat' },
      { glyph: 'wreath',   term: 'autumn wreath' },
      { glyph: 'outfit',   term: 'fall outfit' },
      { glyph: 'mushroom', term: 'mushrooms' },
      { glyph: 'pumpkin',  term: 'pumpkin patch' }
    ]
  },
  {
    name: 'December',
    ground: '#1B2A5B', ink: '#F5EFE0',
    acc: '#E63329', acc2: '#E8A93D',
    chipA: { bg: '#E63329', fg: '#F5EFE0' },
    chipB: { bg: '#E8A93D', fg: '#1B2A5B' },
    title: 'WONDERFUL WINTER WEEK', titleSize: 50,
    sub: 'DECEMBER EDITION - ONE COZY WEEK OF TRIPLES',
    prop: 'star',
    rows: [
      { glyph: 'knit',     term: 'knitted accessory + jaguar + festive headband' },
      { glyph: 'scarf',    term: 'wool scarf + snow monkey + steaming mug' },
      { glyph: 'hedgehog', term: 'checkered coat + hedgehog + fairy lights' },
      { glyph: 'bear',     term: 'cosy turtleneck + polar bear + candy cane' },
      { glyph: 'penguin',  term: 'knitted shawl + penguin + gift parcel' }
    ]
  },
  {
    name: 'July',
    ground: '#C98A2E', ink: '#4A2E1E',
    acc: '#F5EFE0', acc2: '#4A2E1E',
    chipA: { bg: '#F5EFE0', fg: '#4A2E1E' },
    chipB: { bg: '#4A2E1E', fg: '#C98A2E' },
    title: 'MONTH OF MASTERS', titleSize: 62,
    sub: 'JULY EDITION - STUDY THE MASTERS',
    prop: 'palette',
    rows: [
      { glyph: 'lily',     term: 'Monet - water lilies' },
      { glyph: 'klimt',    term: 'Klimt - golden ornament' },
      { glyph: 'portrait', term: 'Vigee Le Brun - the portrait' },
      { glyph: 'starry',   term: 'Van Gogh - starry sky' },
      { glyph: 'palette',  term: 'a master of your choice' }
    ]
  }
];
if (EDITIONS.length !== 3) throw new Error('edition table must hold exactly 3');
for (var ei = 0; ei < 3; ei++) {
  if (EDITIONS[ei].rows.length !== 5) throw new Error('each edition must hold exactly 5 prompt rows');
}

// Host roll: exactly ten avatar dots, motif glyphs,
// no names. One pulses at a time on the 15s loop.
var HOSTS = ['leaf', 'star', 'mug', 'moon', 'flower',
             'mushroom', 'cat', 'snowflake', 'sun', 'heart'];
if (HOSTS.length !== 10) throw new Error('host roll must hold exactly 10');

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
var seed = 407;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// Paper grain: exactly 900 fixed speckle dots over
// the whole design field, drawn last, in this order.
var GRAIN = [];
while (GRAIN.length < 900) {
  GRAIN.push({ x: rnd() * DW, y: rnd() * DH, r: 0.8 + rnd() * 1.1, acc: GRAIN.length % 5 === 3 });
}
if (GRAIN.length !== 900) throw new Error('grain count');

// Header snowfall for the December scene: 26 dots in
// the header band, bobbing on whole cycles of the
// 15s loop.
var SNOW = [];
while (SNOW.length < 26) {
  SNOW.push({ x: 700 + rnd() * 540, y: 48 + rnd() * 210,
              r: 2 + rnd() * 2.6, k: 1 + Math.floor(rnd() * 3),
              ph: rnd() * Math.PI * 2, amp: 4 + rnd() * 5 });
}
if (SNOW.length !== 26) throw new Error('snow count');

// ---- state ----------------------------------------------
var edition = 0;
var wipeFrom = -1, wipeStart = 0, WIPE_LEN = 1.0;
var scrollY = 0, scrollV = 0;
var ROW_PITCH = 74, ROW_VIEW_Y0 = 348, ROW_VIEW_Y1 = 640;
var MAXSCROLL = 5 * ROW_PITCH - (ROW_VIEW_Y1 - ROW_VIEW_Y0);
var lastNow = -1, acc = 0;

// QA hooks via the renderer's query string (?seed=...):
// edition=N renders edition N at rest; wipe=1 renders
// a mid-wipe frame into the next edition. Default
// play is unaffected.
var QS = (typeof location !== 'undefined' && location.search) || '';
var em = QS.match(/edition=(\d)/);
if (em) edition = parseInt(em[1], 10) % 3;
if (QS.indexOf('wipe=1') >= 0) {
  wipeFrom = edition; edition = (edition + 1) % 3; wipeStart = T0 - 0.5;
}

// ---- small helpers --------------------------------------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
function ell(x, y, rx, ry, rot, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function ellA(x, y, rx, ry, rot, col, a) {
  ctx.globalAlpha = a; ell(x, y, rx, ry, rot, col); ctx.globalAlpha = 1;
}
function circ(x, y, r, col) { ell(x, y, r, r, 0, col); }
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function rr(x, y, w, h, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath(); ctx.fill();
}
function seg(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function segA(x1, y1, x2, y2, w, col, a) { ctx.globalAlpha = a; seg(x1, y1, x2, y2, w, col); ctx.globalAlpha = 1; }
function curve(x1, y1, cx, cy, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}
function poly(pts, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function txt(str, x, y, font, col, align, alpha) {
  ctx.font = font; ctx.fillStyle = col; ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle'; ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillText(str, x, y); ctx.globalAlpha = 1;
}
var SERIF = 'Georgia, "DejaVu Serif", serif';

// ---- icon glyphs ----------------------------------------
// Drawn centred at (x, y), half-size s. fg is the glyph
// colour, dt the detail colour (usually the chip bg).
function star4(x, y, s, col) {
  poly([x, y - s, x + s * 0.28, y - s * 0.28, x + s, y, x + s * 0.28, y + s * 0.28,
        x, y + s, x - s * 0.28, y + s * 0.28, x - s, y, x - s * 0.28, y - s * 0.28], col);
}
function glyph(kind, x, y, s, fg, dt) {
  var i, a;
  if (kind === 'cat') {
    poly([x - s * 0.55, y - s * 0.25, x - s * 0.6, y - s * 0.95, x - s * 0.08, y - s * 0.55], fg);
    poly([x + s * 0.55, y - s * 0.25, x + s * 0.6, y - s * 0.95, x + s * 0.08, y - s * 0.55], fg);
    circ(x, y + s * 0.08, s * 0.62, fg);
    circ(x - s * 0.22, y, s * 0.07, dt); circ(x + s * 0.22, y, s * 0.07, dt);
    seg(x - s * 0.85, y + s * 0.3, x - s * 0.35, y + s * 0.22, s * 0.07, fg);
    seg(x + s * 0.85, y + s * 0.3, x + s * 0.35, y + s * 0.22, s * 0.07, fg);
  } else if (kind === 'wreath') {
    for (i = 0; i < 8; i++) {
      a = i / 8 * Math.PI * 2;
      circ(x + Math.cos(a) * s * 0.62, y + Math.sin(a) * s * 0.62, s * 0.3, fg);
    }
    circ(x, y + s * 0.72, s * 0.16, dt);
  } else if (kind === 'outfit') {
    poly([x - s * 0.35, y - s * 0.7, x + s * 0.35, y - s * 0.7, x + s * 0.85, y - s * 0.2,
          x + s * 0.5, y + s * 0.05, x + s * 0.5, y + s * 0.75, x - s * 0.5, y + s * 0.75,
          x - s * 0.5, y + s * 0.05, x - s * 0.85, y - s * 0.2], fg);
  } else if (kind === 'mushroom') {
    ctx.fillStyle = fg; ctx.beginPath();
    ctx.ellipse(x, y - s * 0.05, s * 0.85, s * 0.62, 0, Math.PI, Math.PI * 2); ctx.fill();
    poly([x - s * 0.28, y - s * 0.02, x + s * 0.28, y - s * 0.02, x + s * 0.18, y + s * 0.7, x - s * 0.18, y + s * 0.7], fg);
    circ(x - s * 0.3, y - s * 0.35, s * 0.11, dt); circ(x + s * 0.25, y - s * 0.45, s * 0.09, dt);
    circ(x + s * 0.05, y - s * 0.2, s * 0.08, dt);
  } else if (kind === 'pumpkin') {
    ell(x, y + s * 0.08, s * 0.8, s * 0.66, 0, fg);
    ctx.strokeStyle = dt; ctx.lineWidth = s * 0.09; ctx.beginPath();
    ctx.ellipse(x, y + s * 0.08, s * 0.38, s * 0.64, 0, 0, Math.PI * 2); ctx.stroke();
    rect(x - s * 0.08, y - s * 0.85, s * 0.16, s * 0.3, fg);
  } else if (kind === 'knit') {
    rr(x - s * 0.75, y - s * 0.55, s * 1.5, s * 1.1, s * 0.15, fg);
    ctx.strokeStyle = dt; ctx.lineWidth = s * 0.11; ctx.lineCap = 'round'; ctx.beginPath();
    for (i = 0; i < 4; i++) {
      var zx = x - s * 0.55 + i * s * 0.36;
      ctx.moveTo(zx, y - s * 0.25); ctx.lineTo(zx + s * 0.18, y); ctx.lineTo(zx, y + s * 0.25);
    }
    ctx.stroke();
  } else if (kind === 'scarf') {
    rr(x - s * 0.8, y - s * 0.4, s * 1.6, s * 0.8, s * 0.2, fg);
    seg(x - s * 0.4, y - s * 0.4, x - s * 0.4, y + s * 0.4, s * 0.12, dt);
    seg(x + s * 0.05, y - s * 0.4, x + s * 0.05, y + s * 0.4, s * 0.12, dt);
    seg(x + s * 0.5, y - s * 0.4, x + s * 0.5, y + s * 0.4, s * 0.12, dt);
  } else if (kind === 'mug') {
    rr(x - s * 0.55, y - s * 0.35, s * 1.0, s * 0.95, s * 0.12, fg);
    ctx.strokeStyle = fg; ctx.lineWidth = s * 0.14; ctx.beginPath();
    ctx.arc(x + s * 0.62, y + s * 0.12, s * 0.3, -Math.PI * 0.45, Math.PI * 0.55); ctx.stroke();
    curve(x - s * 0.2, y - s * 0.55, x - s * 0.35, y - s * 0.8, x - s * 0.2, y - s * 0.95, s * 0.1, fg);
    curve(x + s * 0.15, y - s * 0.55, x, y - s * 0.8, x + s * 0.15, y - s * 0.95, s * 0.1, fg);
  } else if (kind === 'hedgehog') {
    ctx.fillStyle = fg; ctx.beginPath();
    ctx.ellipse(x, y + s * 0.35, s * 0.8, s * 0.62, 0, Math.PI, Math.PI * 2); ctx.fill();
    for (i = 0; i < 5; i++) {
      a = Math.PI + i / 4 * Math.PI;
      seg(x + Math.cos(a) * s * 0.55, y + s * 0.35 + Math.sin(a) * s * 0.45,
          x + Math.cos(a) * s * 0.92, y + s * 0.35 + Math.sin(a) * s * 0.78, s * 0.1, fg);
    }
    circ(x + s * 0.42, y + s * 0.28, s * 0.09, dt);
  } else if (kind === 'bear') {
    circ(x - s * 0.5, y - s * 0.5, s * 0.3, fg); circ(x + s * 0.5, y - s * 0.5, s * 0.3, fg);
    circ(x, y + s * 0.05, s * 0.68, fg);
    ell(x, y + s * 0.28, s * 0.3, s * 0.2, 0, dt);
    circ(x, y + s * 0.18, s * 0.09, fg);
  } else if (kind === 'penguin') {
    ell(x, y, s * 0.55, s * 0.78, 0, fg);
    ell(x, y + s * 0.22, s * 0.32, s * 0.48, 0, dt);
    circ(x - s * 0.16, y - s * 0.38, s * 0.07, dt); circ(x + s * 0.16, y - s * 0.38, s * 0.07, dt);
    poly([x - s * 0.09, y - s * 0.26, x + s * 0.09, y - s * 0.26, x, y - s * 0.1], fg);
  } else if (kind === 'lily') {
    seg(x - s * 0.85, y + s * 0.55, x + s * 0.85, y + s * 0.55, s * 0.12, dt);
    ell(x - s * 0.3, y - s * 0.05, s * 0.2, s * 0.42, -0.5, fg);
    ell(x, y - s * 0.2, s * 0.22, s * 0.5, 0, fg);
    ell(x + s * 0.3, y - s * 0.05, s * 0.2, s * 0.42, 0.5, fg);
  } else if (kind === 'klimt') {
    ctx.strokeStyle = fg; ctx.lineWidth = s * 0.13; ctx.lineCap = 'round'; ctx.beginPath();
    for (i = 0; i <= 40; i++) {
      a = i / 40 * Math.PI * 3.4; var rad = s * 0.12 + i / 40 * s * 0.6;
      var gx = x + Math.cos(a) * rad, gy = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
    }
    ctx.stroke();
    circ(x - s * 0.62, y - s * 0.62, s * 0.1, fg); circ(x + s * 0.66, y + s * 0.5, s * 0.1, fg);
  } else if (kind === 'portrait') {
    ctx.strokeStyle = fg; ctx.lineWidth = s * 0.12;
    ctx.strokeRect(x - s * 0.62, y - s * 0.8, s * 1.24, s * 1.6);
    circ(x, y - s * 0.28, s * 0.3, fg);
    ctx.fillStyle = fg; ctx.beginPath();
    ctx.ellipse(x, y + s * 0.78, s * 0.44, s * 0.34, 0, Math.PI, Math.PI * 2); ctx.fill();
  } else if (kind === 'starry') {
    ctx.strokeStyle = fg; ctx.lineWidth = s * 0.12; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.arc(x - s * 0.15, y + s * 0.25, s * 0.5, Math.PI * 0.9, Math.PI * 2.15); ctx.stroke();
    ctx.beginPath(); ctx.arc(x - s * 0.15, y + s * 0.25, s * 0.26, Math.PI * 0.9, Math.PI * 2.3); ctx.stroke();
    star4(x + s * 0.5, y - s * 0.5, s * 0.3, fg);
    circ(x + s * 0.62, y + s * 0.55, s * 0.11, fg);
  } else if (kind === 'palette') {
    circ(x, y, s * 0.72, fg);
    circ(x + s * 0.3, y + s * 0.28, s * 0.16, dt);
    circ(x - s * 0.3, y - s * 0.25, s * 0.13, dt);
    circ(x + s * 0.28, y - s * 0.3, s * 0.13, dt);
    circ(x - s * 0.05, y + s * 0.35, s * 0.13, dt);
  } else if (kind === 'leaf') {
    ell(x, y, s * 0.42, s * 0.78, 0.6, fg);
    seg(x - s * 0.3, y + s * 0.55, x + s * 0.35, y - s * 0.6, s * 0.09, dt);
  } else if (kind === 'star') {
    star4(x, y, s * 0.85, fg);
  } else if (kind === 'moon') {
    circ(x, y, s * 0.72, fg);
    circ(x + s * 0.32, y - s * 0.18, s * 0.58, dt);
  } else if (kind === 'flower') {
    for (i = 0; i < 5; i++) {
      a = i / 5 * Math.PI * 2 - Math.PI / 2;
      circ(x + Math.cos(a) * s * 0.42, y + Math.sin(a) * s * 0.42, s * 0.3, fg);
    }
    circ(x, y, s * 0.2, dt);
  } else if (kind === 'snowflake') {
    for (i = 0; i < 3; i++) {
      a = i / 3 * Math.PI;
      seg(x - Math.cos(a) * s * 0.75, y - Math.sin(a) * s * 0.75,
          x + Math.cos(a) * s * 0.75, y + Math.sin(a) * s * 0.75, s * 0.11, fg);
    }
    circ(x, y, s * 0.12, fg);
  } else if (kind === 'sun') {
    circ(x, y, s * 0.42, fg);
    for (i = 0; i < 8; i++) {
      a = i / 8 * Math.PI * 2;
      seg(x + Math.cos(a) * s * 0.58, y + Math.sin(a) * s * 0.58,
          x + Math.cos(a) * s * 0.85, y + Math.sin(a) * s * 0.85, s * 0.11, fg);
    }
  } else if (kind === 'heart') {
    ctx.fillStyle = fg; ctx.beginPath();
    ctx.moveTo(x, y + s * 0.75);
    ctx.bezierCurveTo(x - s * 1.05, y + s * 0.05, x - s * 0.62, y - s * 0.8, x, y - s * 0.3);
    ctx.bezierCurveTo(x + s * 0.62, y - s * 0.8, x + s * 1.05, y + s * 0.05, x, y + s * 0.75);
    ctx.fill();
  }
}

// ---- the muse (one recipe, seasonal prop) ---------------
function drawMuse(ed, lt) {
  var cx = 1062, cy = 158;
  // July: a flat sun disc behind the hair.
  if (ed.prop === 'palette') circ(cx, cy + 6, 116, ed.acc);
  // Hair mass: white blob with side falls.
  circ(cx, cy, 94, HAIR);
  ell(cx - 82, cy + 62, 26, 62, 0.12, HAIR);
  ell(cx + 82, cy + 62, 26, 62, -0.12, HAIR);
  ell(cx, cy - 58, 88, 40, 0, HAIR);
  // Face.
  circ(cx, cy + 12, 60, SKIN);
  ell(cx, cy - 32, 62, 30, 0, HAIR);
  // Scalloped fringe.
  for (var f = 0; f < 5; f++) circ(cx - 44 + f * 22, cy - 18, 12, HAIR);
  // Closed eyes, brows, nose, lips.
  curve(cx - 34, cy + 14, cx - 24, cy + 21, cx - 14, cy + 14, 4.5, FEATURE);
  curve(cx + 14, cy + 14, cx + 24, cy + 21, cx + 34, cy + 14, 4.5, FEATURE);
  curve(cx - 34, cy - 2, cx - 24, cy - 6, cx - 14, cy - 2, 3.5, FEATURE);
  curve(cx + 14, cy - 2, cx + 24, cy - 6, cx + 34, cy - 2, 3.5, FEATURE);
  curve(cx - 4, cy + 26, cx, cy + 32, cx + 4, cy + 26, 3, FEATURE);
  ell(cx, cy + 44, 11, 5.5, 0, ed.prop === 'palette' ? FEATURE : ed.acc);
  // Dress: a flat trapezoid in the edition accent,
  // cut off by the header divider.
  poly([cx - 58, 252, cx + 58, 252, cx + 92, 292, cx - 92, 292], ed.acc);
  ell(cx, cy + 96, 20, 12, 0, SKIN);
  // Seasonal prop.
  if (ed.prop === 'leaves') {
    glyph('leaf', cx - 34, 246, 20, ed.acc2, ed.acc);
    glyph('leaf', cx + 6, 256, 17, ed.acc, ed.acc2);
    glyph('leaf', cx + 38, 244, 15, ed.acc2, ed.acc);
  } else if (ed.prop === 'star') {
    seg(cx - 34, 262, cx - 66, 196, 6, ed.ink);
    star4(cx - 72, 182, 24, ed.acc2);
    circ(cx - 72, 182, 6, ed.acc);
  } else if (ed.prop === 'palette') {
    glyph('palette', cx, 252, 26, ed.acc, ed.ink);
    seg(cx + 30, 268, cx + 62, 224, 5, ed.ink);
  }
}

// Header dressing per season: falling leaves, snowfall,
// or small sun sparkles, all on whole cycles of the
// 15s loop so the loop is seamless.
function drawHeaderDressing(ed, lt) {
  var i, bob;
  if (ed.prop === 'leaves') {
    var leaves = [
      { x: 818, y: 96, s: 22, k: 1, ph: 0.4, c: 0 }, { x: 880, y: 196, s: 17, k: 2, ph: 2.1, c: 1 },
      { x: 762, y: 226, s: 15, k: 3, ph: 4.0, c: 0 }, { x: 1210, y: 84, s: 18, k: 2, ph: 1.2, c: 1 },
      { x: 1236, y: 210, s: 14, k: 1, ph: 3.3, c: 0 }
    ];
    for (i = 0; i < leaves.length; i++) {
      var L = leaves[i];
      bob = Math.sin(Math.PI * 2 * (L.k * lt / LOOP) + L.ph) * 7;
      glyph('leaf', L.x, L.y + bob, L.s, L.c ? ed.acc : ed.acc2, L.c ? ed.acc2 : ed.acc);
    }
  } else if (ed.prop === 'star') {
    for (i = 0; i < SNOW.length; i++) {
      var sn = SNOW[i];
      bob = Math.sin(Math.PI * 2 * (sn.k * lt / LOOP) + sn.ph) * sn.amp;
      ellA(sn.x, sn.y + bob, sn.r, sn.r, 0, ed.ink, 0.75);
    }
    // A small flat fir at the muse's left.
    poly([906, 236, 934, 236, 920, 196], ed.acc2);
    poly([910, 208, 930, 208, 920, 176], ed.acc2);
    rect(917, 236, 6, 12, ed.ink);
    star4(920, 168, 8, ed.acc);
  } else if (ed.prop === 'palette') {
    var sp = [
      { x: 806, y: 92, s: 13, k: 2, ph: 0.8 }, { x: 862, y: 208, s: 10, k: 3, ph: 2.6 },
      { x: 1224, y: 96, s: 11, k: 1, ph: 4.4 }, { x: 1240, y: 216, s: 9, k: 2, ph: 1.7 }
    ];
    for (i = 0; i < sp.length; i++) {
      bob = Math.sin(Math.PI * 2 * (sp[i].k * lt / LOOP) + sp[i].ph) * 5;
      star4(sp[i].x, sp[i].y + bob, sp[i].s, ed.ink);
    }
  }
}

// ---- one edition's poster -------------------------------
function drawPoster(idx, lt) {
  var ed = EDITIONS[idx];
  // Ground over the design field and beyond, so the
  // sliding page carries its own ground.
  rect(-80, -80, DW + 160, DH + 160, ed.ground);

  // Header scene, breathing on the 15s loop about
  // the muse.
  txt('A DRAWING CHALLENGE', 66, 74, '700 23px ' + SERIF, ed.acc, 'left', 1);
  txt(ed.title, 64, 140, '700 ' + ed.titleSize + 'px ' + SERIF, ed.ink, 'left', 1);
  txt(ed.sub, 66, 198, '400 25px ' + SERIF, ed.ink, 'left', 0.78);
  segA(66, 236, 700, 236, 3, ed.ink, 0.35);
  txt('hosted with love, drawn by hand', 66, 262, 'italic 400 22px ' + SERIF, ed.ink, 'left', 0.6);
  var br = 1 + 0.012 * Math.sin(Math.PI * 2 * lt / LOOP);
  ctx.save();
  ctx.translate(1062, 168); ctx.scale(br, br); ctx.translate(-1062, -168);
  drawMuse(ed, lt);
  drawHeaderDressing(ed, lt);
  ctx.restore();
  segA(48, 296, 1232, 296, 3, ed.ink, 0.4);

  // Prompt rows, clipped; the scroll offset comes
  // from the drag state.
  txt('THE PROMPTS', 66, 326, '700 24px ' + SERIF, ed.ink, 'left', 1);
  ctx.save();
  ctx.beginPath(); ctx.rect(40, ROW_VIEW_Y0, DW - 80, ROW_VIEW_Y1 - ROW_VIEW_Y0); ctx.clip();
  for (var r = 0; r < ed.rows.length; r++) {
    var cy = ROW_VIEW_Y0 + r * ROW_PITCH + 37 + scrollY;
    if (cy < ROW_VIEW_Y0 - 40 || cy > ROW_VIEW_Y1 + 40) continue;
    var chip = r % 2 === 0 ? ed.chipA : ed.chipB;
    rr(96, cy - 27, 54, 54, 12, chip.bg);
    glyph(ed.rows[r].glyph, 123, cy, 17, chip.fg, chip.bg);
    txt(ed.rows[r].term, 182, cy + 1, '400 29px ' + SERIF, ed.ink, 'left', 1);
    if (r < ed.rows.length - 1) segA(96, cy + 36, 1184, cy + 36, 2, ed.ink, 0.22);
  }
  ctx.restore();
  segA(48, 664, 1232, 664, 3, ed.ink, 0.4);

  // Rules block, bottom left: four fixed lines.
  txt('THE RULES', 66, 700, '700 24px ' + SERIF, ed.ink, 'left', 1);
  for (var q = 0; q < RULES.length; q++) {
    circ(78, 740 + q * 34, 4, ed.acc === ed.ground ? ed.ink : ed.acc);
    txt(RULES[q], 100, 740 + q * 34, '400 24px ' + SERIF, ed.ink, 'left', 0.92);
  }

  // Host roll, bottom right: exactly ten dots, one
  // pulsing per 1.5s slot of the 15s loop.
  txt('YOUR HOSTS', 700, 700, '700 24px ' + SERIF, ed.ink, 'left', 1);
  var slot = Math.floor((lt % LOOP) / 1.5) % 10;
  var pph = ((lt % LOOP) % 1.5) / 1.5;
  for (var h = 0; h < HOSTS.length; h++) {
    var hx = 716 + h * 47, hy = 762;
    var hs = h === slot ? 1 + 0.16 * Math.sin(Math.PI * pph) : 1;
    if (h === slot) {
      ctx.strokeStyle = ed.acc; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(hx, hy, 27 * hs, 0, Math.PI * 2); ctx.stroke();
    }
    circ(hx, hy, 21 * hs, ed.ink);
    glyph(HOSTS[h], hx, hy, 11 * hs, ed.ground, ed.ink);
  }
  txt('ten hosts, one muse, no two alike', 700, 824, 'italic 400 21px ' + SERIF, ed.ink, 'left', 0.6);
}

function draw() {
  var lt = T % LOOP;
  var ed = EDITIONS[edition];
  // Page ground: the current edition's ground fills
  // the whole canvas, letterbox included.
  rect(0, 0, W, H, ed.ground);
  if (wipeFrom >= 0) {
    var p = clamp((T - wipeStart) / WIPE_LEN, 0, 1);
    drawPoster(edition, lt);
    var off = -easeInOut(p) * (DW + 120);
    ctx.save();
    ctx.translate(off, 0);
    drawPoster(wipeFrom, lt);
    ctx.restore();
    var fx = DW + off;
    if (fx > 0) {
      rect(fx, 0, 12, DH, EDITIONS[wipeFrom].acc);
      ctx.globalAlpha = 0.18; rect(fx + 12, 0, 26, DH, EDITIONS[wipeFrom].ink); ctx.globalAlpha = 1;
    }
  } else {
    drawPoster(edition, lt);
  }
  // Paper grain over all, fixed table order, in the
  // current edition's ink and accent.
  for (var g = 0; g < GRAIN.length; g++) {
    var gd = GRAIN[g];
    if (gd.acc) ellA(gd.x, gd.y, gd.r, gd.r, 0, ed.acc, 0.05);
    else ellA(gd.x, gd.y, gd.r, gd.r, 0, ed.ink, 0.05);
  }
}

// ---- step: springs and wipe bookkeeping ------------------
function step() {
  if (wipeFrom >= 0 && T - wipeStart >= WIPE_LEN) wipeFrom = -1;
  if (!dragging) {
    scrollV += (-160 * scrollY - 16 * scrollV) * TICK;
    scrollY += scrollV * TICK;
    if (Math.abs(scrollY) < 0.05 && Math.abs(scrollV) < 2) { scrollY = 0; scrollV = 0; }
  }
}

function advanceSeason() {
  if (wipeFrom >= 0) return;
  wipeFrom = edition;
  edition = (edition + 1) % EDITIONS.length;
  wipeStart = T;
  scrollY = 0; scrollV = 0;
}

// ---- pointer: drag scrolls, double-tap turns ------------
var downX = -1, downY = -1, downT = 0, lastTapT = -10, dragging = false;
var dragStartScroll = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T; dragging = false;
  dragStartScroll = scrollY;
});
canvas.addEventListener('pointermove', function (e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  if (Math.sqrt(dx * dx + dy * dy) > 6) dragging = true;
  if (dragging) { scrollY = clamp(dragStartScroll + dy, -MAXSCROLL, 0); scrollV = 0; }
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  var wasDrag = dragging || moved >= 28;
  downX = -1; dragging = false;
  if (wasDrag || held >= 0.8) return;
  if (T - lastTapT < 0.4) {
    lastTapT = -10;
    advanceSeason();
  } else {
    lastTapT = T;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; dragging = false; });

// ---- sizing: centred fit, page ground = edition ground --
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  // Canvas-space ground fill first (draw() paints it
  // again inside the transform path below).
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  rect(0, 0, W, H, EDITIONS[edition].ground);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
