<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art from Code</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#000000';
var WHITE = [255, 255, 255];
var PLATE = '#000000';
var PLATE_LINE = 'rgba(255,255,255,0.45)';
var TITLE_INK = '#ffffff';
var HINT_INK = 'rgba(255,255,255,0.85)';
var FIRST_T = 0;
var CODE_HOLD = 8;
var DISSOLVE_SPAN = 78;
var PATTERN_HOLD = 20;
var FADE_SPAN = 8;
var PERIOD = CODE_HOLD + DISSOLVE_SPAN + PATTERN_HOLD + FADE_SPAN;
var CELL_FADE = 0.9;
/* The piece ships its own source as a string constant. Each line carries
   the kind of drawing routine it belongs to, so the dissolve is
   structural: a rosette line's cells become rosettes, a mirror line's
   cells become reflected rosettes, the border line's cells become
   star spikes, loop lines become small rosettes. The live functions
   below are the same algorithm the listing describes. */
var CODE = [
  ['// art from code', 'code'],
  ['function rosette(x, y, r, n) {', 'rosette'],
  ['  for (var p = 0; p < n; p++) {', 'loop'],
  ['    var a = p * TAU / n;', 'loop'],
  ['    petal(x, y, r, a);', 'petal'],
  ['  }', 'code'],
  ['  ring(x, y, r * 0.55);', 'rosette'],
  ['}', 'code'],
  ['function petal(x, y, r, a) {', 'petal'],
  ['  line(x, y, x + cos(a) * r,', 'petal'],
  ['       y + sin(a) * r);', 'petal'],
  ['  arc(x + cos(a) * r / 2,', 'petal'],
  ['      y + sin(a) * r / 2, r / 4);', 'petal'],
  ['}', 'code'],
  ['function mirror(col) {', 'mirror'],
  ['  return col % 2 ? -1 : 1;', 'mirror'],
  ['}', 'code'],
  ['for (var row = 0; row < ROWS; row++)', 'loop'],
  ['  for (var col = 0; col < COLS; col++)', 'loop'],
  ['    rosette(cellX(col), cellY(row),', 'rosette'],
  ['            R, 8 * mirror(col));', 'rosette'],
  ['border(star, 24);', 'border']
];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* Fixed seed table: per-cell jitter so no two rosettes are identical. */
var rng = mulberry32(1671);
var JITTER = [];
var ji;
for (ji = 0; ji < 8192; ji++) JITTER.push(rng());
function jitterAt(n) { return JITTER[n % 8192]; }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
  layoutKey = '';
}
/* ---- layout: one character grid spans the whole frame ---- */
var layoutKey = '';
var L = null;
function layout() {
  var key = VW + 'x' + VH;
  if (L && layoutKey === key) return L;
  layoutKey = key;
  var lines = CODE.length;
  var maxLen = 0, i;
  for (i = 0; i < lines; i++) maxLen = Math.max(maxLen, CODE[i][0].length);
  var fs = Math.min((VW - 72) / (maxLen * 0.62), (VH - 150) / (lines * 1.35));
  fs = Math.max(11, Math.min(fs, 26));
  ctx.font = fs + 'px monospace';
  var cw = ctx.measureText('M').width;
  var ch = fs * 1.35;
  var cols = Math.max(10, Math.floor(VW / cw));
  var rows = Math.max(10, Math.floor(VH / ch));
  var startCol = Math.max(0, Math.floor((cols - maxLen) / 2));
  var minTopRow = Math.ceil(80 / ch);
  var startRow = Math.max(minTopRow, Math.floor((rows - lines) / 2));
  var maxTopRow = Math.floor((VH - 56) / ch) - lines;
  if (startRow > maxTopRow) startRow = Math.max(0, maxTopRow);
  /* Build the dissolve order: listing cells in reading order first,
     then blank cells in reading order, so the field completes edge
     to edge after the code itself has dissolved. */
  var cells = [];
  var r, c, li, ci, line;
  for (li = 0; li < lines; li++) {
    line = CODE[li][0];
    for (ci = 0; ci < line.length; ci++) {
      cells.push({ col: startCol + ci, row: startRow + li, ch: line.charAt(ci), kind: CODE[li][1] });
    }
  }
  for (r = 0; r < rows; r++) {
    for (c = 0; c < cols; c++) {
      if (r >= startRow && r < startRow + lines &&
          c >= startCol && c < startCol + CODE[r - startRow][0].length) continue;
      cells.push({ col: c, row: r, ch: null, kind: 'blank' });
    }
  }
  var total = cells.length;
  for (i = 0; i < total; i++) {
    cells[i].start = CODE_HOLD + i * (DISSOLVE_SPAN / total);
    cells[i].seed = i;
  }
  L = { fs: fs, cw: cw, ch: ch, cols: cols, rows: rows,
    startCol: startCol, startRow: startRow, cells: cells, total: total };
  return L;
}
/* ---- the real algorithm, as the listing describes it ---- */
function petal(x, y, r, a, alpha) {
  var ex = x + Math.cos(a) * r, ey = y + Math.sin(a) * r;
  var mx = x + Math.cos(a) * r * 0.5, my = y + Math.sin(a) * r * 0.5;
  ctx.strokeStyle = rgba(WHITE, alpha);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.fillStyle = rgba(WHITE, alpha);
  ctx.beginPath();
  ctx.moveTo(mx + r * 0.22, my);
  ctx.arc(mx, my, r * 0.22, 0, TAU);
  ctx.fill();
}
function rosette(x, y, r, n, mir, alpha, grow, seed) {
  var rr = r * (0.35 + 0.65 * grow);
  var wob = (jitterAt(seed) - 0.5) * 0.12;
  var p, a;
  ctx.lineWidth = Math.max(0.7, r * 0.10);
  for (p = 0; p < n; p++) {
    a = mir * p * TAU / n + wob;
    petal(x, y, rr, a, alpha);
  }
  ctx.strokeStyle = rgba(WHITE, alpha);
  ctx.beginPath();
  ctx.moveTo(x + rr * 0.55, y);
  ctx.arc(x, y, rr * 0.55, 0, TAU);
  ctx.stroke();
}
function mirror(col) { return col % 2 ? -1 : 1; }
function starSpike(x, y, r, alpha, grow) {
  var rr = r * (0.35 + 0.65 * grow);
  var k;
  ctx.strokeStyle = rgba(WHITE, alpha);
  ctx.lineWidth = Math.max(0.7, r * 0.12);
  for (k = 0; k < 4; k++) {
    var a = Math.PI / 4 + k * Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(WHITE, alpha);
  ctx.beginPath();
  ctx.moveTo(x + rr * 0.18, y);
  ctx.arc(x, y, rr * 0.18, 0, TAU);
  ctx.fill();
}
function drawMotif(cell, cx, cy, r, alpha, grow) {
  var mir = mirror(cell.col);
  var kind = cell.kind;
  if (kind === 'border') { starSpike(cx, cy, r, alpha, grow); return; }
  var n = kind === 'rosette' ? 8 : kind === 'mirror' ? 8 :
          kind === 'petal' ? 2 : kind === 'loop' ? 4 : 6;
  rosette(cx, cy, r, n, mir, alpha, grow, cell.seed);
}
/* Spiky star border: only in the final pattern stage. */
function drawBorder(alpha) {
  if (alpha <= 0.001) return;
  var lay = L;
  var stepX = lay.cw, stepY = lay.ch;
  var depth = lay.ch * 0.85;
  var i, x;
  ctx.fillStyle = rgba(WHITE, alpha);
  for (i = 0; i < lay.cols; i++) {
    x = (i + 0.5) * stepX;
    ctx.beginPath();
    ctx.moveTo(x - stepX * 0.30, 0);
    ctx.lineTo(x, depth);
    ctx.lineTo(x + stepX * 0.30, 0);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - stepX * 0.30, VH);
    ctx.lineTo(x, VH - depth);
    ctx.lineTo(x + stepX * 0.30, VH);
    ctx.closePath();
    ctx.fill();
  }
  var j, y;
  for (j = 0; j < lay.rows; j++) {
    y = (j + 0.5) * stepY;
    ctx.beginPath();
    ctx.moveTo(0, y - stepY * 0.30);
    ctx.lineTo(depth, y);
    ctx.lineTo(0, y + stepY * 0.30);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(VW, y - stepY * 0.30);
    ctx.lineTo(VW - depth, y);
    ctx.lineTo(VW, y + stepY * 0.30);
    ctx.closePath();
    ctx.fill();
  }
}
function drawListing(alpha) {
  var lay = L;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = lay.fs + 'px monospace';
  ctx.fillStyle = rgba(WHITE, alpha);
  var li;
  for (li = 0; li < CODE.length; li++) {
    ctx.fillText(CODE[li][0], lay.startCol * lay.cw, (lay.startRow + li) * lay.ch);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Art from Code').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Art from Code').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 09').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Art from Code', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 09', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var lay = layout();
  var tt = ((t % PERIOD) + PERIOD) % PERIOD;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var r = Math.min(lay.cw, lay.ch) * 0.44;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = lay.fs + 'px monospace';
  var i, cell, cx, cy, f, grow;
  if (tt < CODE_HOLD) {
    drawListing(1);
  } else if (tt < CODE_HOLD + DISSOLVE_SPAN) {
    for (i = 0; i < lay.total; i++) {
      cell = lay.cells[i];
      cx = (cell.col + 0.5) * lay.cw;
      cy = (cell.row + 0.5) * lay.ch;
      if (tt < cell.start) {
        if (cell.ch !== null) {
          ctx.fillStyle = rgba(WHITE, 1);
          ctx.fillText(cell.ch, cell.col * lay.cw, cell.row * lay.ch);
        }
      } else if (tt < cell.start + CELL_FADE) {
        f = (tt - cell.start) / CELL_FADE;
        grow = f * f * (3 - 2 * f);
        if (cell.ch !== null) {
          ctx.fillStyle = rgba(WHITE, 1 - f);
          ctx.fillText(cell.ch, cell.col * lay.cw, cell.row * lay.ch);
        }
        drawMotif(cell, cx, cy, r, 0.92 * f, grow);
      } else {
        drawMotif(cell, cx, cy, r, 0.92, 1);
      }
    }
  } else if (tt < CODE_HOLD + DISSOLVE_SPAN + PATTERN_HOLD) {
    var holdF = clamp((tt - CODE_HOLD - DISSOLVE_SPAN) / 3, 0, 1);
    for (i = 0; i < lay.total; i++) {
      cell = lay.cells[i];
      cx = (cell.col + 0.5) * lay.cw;
      cy = (cell.row + 0.5) * lay.ch;
      drawMotif(cell, cx, cy, r, 0.92, 1);
    }
    drawBorder(0.92 * holdF);
  } else {
    f = (tt - CODE_HOLD - DISSOLVE_SPAN - PATTERN_HOLD) / FADE_SPAN;
    var patA = 0.92 * (1 - f);
    for (i = 0; i < lay.total; i++) {
      cell = lay.cells[i];
      cx = (cell.col + 0.5) * lay.cw;
      cy = (cell.row + 0.5) * lay.ch;
      drawMotif(cell, cx, cy, r, patA, 1);
    }
    drawBorder(patA);
    drawListing(f);
  }
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    cellCount: function () { layout(); return L.total; },
    period: function () { return PERIOD; }
  };
}
/* ---- frame one: t = FIRST_T, the full code listing ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
