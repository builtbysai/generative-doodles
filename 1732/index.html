<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Score Follower</title>
<style>
html, body { margin: 0; padding: 0; background: #121210; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#121210';
var PLATE = '#1E1E1A';
var PLATE_LINE = 'rgba(242,239,230,0.35)';
var TITLE_INK = '#F2EFE6';
var HINT_INK = '#C99A3A';
var PAPER = '#F2EFE6';
var BANDS = [
  { name: 'LOW', color: '#A85B3A' },
  { name: 'HIGH', color: '#C99A3A' },
  { name: 'SUB', color: '#6E7B8A' },
  { name: 'SUPER-HIGH', color: '#7A8A5A' }
];
var PRE_ROLL = 6.0;
var GROUP_WINDOW = 0.04;
var BURST_N = 12;
var MAX_DOTS = 80;
var SPAWN_EVERY = 0.14;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1732);
var simTime = 0;
var splitY = 0;
var dots = [];
var ribbons = [];
var pending = [];
var spawnAcc = 0;
var lastFlush = 0;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  splitY = VH / 3;
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function laneOf(x) {
  var b = Math.floor(x / (VW / 4));
  return clamp(b, 0, 3);
}
function spawnDot(y0) {
  var y = (typeof y0 === 'number') ? y0 : (rng() * splitY - 10);
  dots.push({
    x: rng() * VW,
    y: y,
    vx: (rng() - 0.5) * 12,
    vy: 18 + rng() * 22,
    r: 1.6 + rng() * 1.6,
    alpha: 0.55 + rng() * 0.4,
    parsed: false
  });
}
function parseDot(d) {
  var band = laneOf(d.x);
  var laneW = VW / 4;
  var cx = (band + 0.5) * laneW + (rng() - 0.5) * laneW * 0.4;
  ribbons.push({
    x: cx,
    y: splitY + 2,
    vy: d.vy * 1.7 + 8,
    len: 60 + rng() * 90,
    alpha: 0.95,
    band: band
  });
  d.parsed = true;
}
function flushBuffer() {
  var i, ev;
  for (i = 0; i < pending.length; i++) {
    ev = pending[i];
    var band = laneOf(ev.x);
    var laneW = VW / 4;
    ribbons.push({
      x: (band + 0.5) * laneW + (ev.jx || 0),
      y: ev.y,
      vy: 34 + rng() * 22,
      len: 60 + rng() * 80,
      alpha: 0.95,
      band: band
    });
  }
  pending.length = 0;
  lastFlush = simTime;
}
function injectBurst(x, y) {
  var i;
  for (i = 0; i < BURST_N; i++) {
    var ex = clamp(x + (rng() - 0.5) * 100, 6, VW - 6);
    var ey = clamp(y + (rng() - 0.5) * 44, 6, VH - 6);
    pending.push({ x: ex, y: ey, jx: (rng() - 0.5) * (VW / 4) * 0.4 });
    dots.push({
      x: ex, y: ey - 14,
      vx: (rng() - 0.5) * 10, vy: 14 + rng() * 14,
      r: 1.8 + rng() * 1.4, alpha: 0.9, parsed: false
    });
  }
  flushBuffer();
}
function update(dt) {
  var i, d, r;
  simTime += dt;
  spawnAcc += dt;
  while (spawnAcc >= SPAWN_EVERY && dots.length < MAX_DOTS) {
    spawnAcc -= SPAWN_EVERY;
    spawnDot();
  }
  if (simTime - lastFlush >= GROUP_WINDOW) flushBuffer();
  for (i = dots.length - 1; i >= 0; i--) {
    d = dots[i];
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    if (d.x < -6) d.x = VW + 6;
    if (d.x > VW + 6) d.x = -6;
    if (!d.parsed && d.y >= splitY) parseDot(d);
    if (d.parsed) d.alpha -= dt * 0.55;
    if (d.y > VH + 12 || d.alpha <= 0.02) dots.splice(i, 1);
  }
  for (i = ribbons.length - 1; i >= 0; i--) {
    r = ribbons[i];
    r.y += r.vy * dt;
    r.alpha -= dt * 0.05;
    if (r.alpha <= 0.03 || r.y - r.len > VH + 24) ribbons.splice(i, 1);
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var i, d, r, b;
  var laneW = VW / 4;
  /* bottom zone: faint lift so the parsed machine reads apart from the drift */
  ctx.fillStyle = 'rgba(242,239,230,0.025)';
  ctx.fillRect(0, splitY, VW, VH - splitY);
  /* lane separators in the streams zone */
  ctx.strokeStyle = 'rgba(242,239,230,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (i = 1; i < 4; i++) {
    ctx.moveTo(i * laneW, splitY);
    ctx.lineTo(i * laneW, VH);
  }
  ctx.stroke();
  /* split line: the parse boundary */
  ctx.strokeStyle = 'rgba(242,239,230,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, splitY + 0.5);
  ctx.lineTo(VW, splitY + 0.5);
  ctx.stroke();
  /* ribbons: persistent colored streams, clipped to the streams zone */
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, splitY, VW, VH - splitY);
  ctx.clip();
  for (i = 0; i < ribbons.length; i++) {
    r = ribbons[i];
    ctx.strokeStyle = rgba(BANDS[r.band].color, r.alpha * 0.85);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(r.x, r.y - r.len);
    ctx.lineTo(r.x, r.y);
    ctx.stroke();
    ctx.fillStyle = rgba(BANDS[r.band].color, r.alpha);
    ctx.beginPath();
    ctx.moveTo(r.x + 2.6, r.y);
    ctx.arc(r.x, r.y, 2.6, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  /* drifting paper dots, each with its own fading alpha */
  for (i = 0; i < dots.length; i++) {
    d = dots[i];
    ctx.fillStyle = rgba(PAPER, d.alpha);
    ctx.beginPath();
    ctx.moveTo(d.x + d.r, d.y);
    ctx.arc(d.x, d.y, d.r, 0, TAU);
    ctx.fill();
  }
  /* zone labels */
  var smallPx = isPhone ? 10 : 11;
  ctx.font = smallPx + 'px monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(242,239,230,0.55)';
  ctx.fillText('DRIFT', VW - 12, 12);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(242,239,230,0.55)';
  ctx.fillText('PARSED STREAMS', 12, splitY + 10);
  /* band labels at the top of the streams zone */
  ctx.textAlign = 'center';
  for (b = 0; b < 4; b++) {
    ctx.fillStyle = rgba(BANDS[b].color, 0.85);
    ctx.fillText(BANDS[b].name, (b + 0.5) * laneW, splitY + 42);
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Score Follower').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Score Follower').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 09').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Score Follower', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 09', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap to inject a burst of events.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
var downX = 0, downY = 0, downT = 0;
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    downX = e.clientX || 0; downY = e.clientY || 0; downT = simTime;
  });
  canvas.addEventListener('pointerup', function (e) {
    var x = e.clientX || 0, y = e.clientY || 0;
    var moved = Math.hypot(x - downX, y - downY);
    if (moved < 12) {
      injectBurst(x, y);
      draw();
    }
  });
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { simTime = t; draw(); },
    inject: function (x, y) { injectBurst(x, y); draw(); },
    dotCount: function () { return dots.length; },
    ribbonCount: function () { return ribbons.length; },
    bandCount: function () { return BANDS.length; },
    burstN: function () { return BURST_N; },
    splitY: function () { return splitY; },
    simTime: function () { return simTime; }
  };
}
/* ---- frame one: fixed 6 s deterministic pre-roll of drift and parsing ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
(function preRoll() {
  var steps = Math.round(PRE_ROLL * 60);
  var dt = 1 / 60;
  var i, band;
  /* the follower has been running before frame one: seed ribbons already
     distributed through the streams zone so all four voices read at load */
  for (i = 0; i < 28; i++) {
    band = Math.floor(rng() * 4);
    ribbons.push({
      x: (band + 0.5) * (VW / 4) + (rng() - 0.5) * (VW / 4) * 0.5,
      y: splitY + 30 + rng() * (VH - splitY - 60),
      vy: 30 + rng() * 25,
      len: 60 + rng() * 90,
      alpha: 0.45 + rng() * 0.5,
      band: band
    });
  }
  for (i = 0; i < steps; i++) update(dt);
})();
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) { update(dt); draw(); }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
