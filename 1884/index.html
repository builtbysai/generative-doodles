<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rupture and Repair</title>
<style>
html, body { margin: 0; padding: 0; background: #D9CBB0; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Rupture and Repair: a woven linen banner hangs edge to edge,
   embroidered with fragmented red-thread letterforms. On a slow
   three-minute cycle the cloth tears along a seam near the center,
   threads snap and curl, a corner drops; then invisible hands mend
   it, gold cross-stitches landing one by one along the crack, the
   corner sewn back, the text re-knitting with a gold scar line

var LINEN_LIGHT = '#E9DFC6';
var GAP_DARK = '#7A6A4E';
var RED = '#A8232A';
var RED_DEEP = '#7E1A20';
var GOLD = '#C9A227';
var GOLD_DEEP = '#9A7B1A';
var GREEN = '#6B8E3E';
var GREEN_DEEP = '#4E6B2C';
var INK = '#3A2E1C';

var TITLE_INK = '#EFE6CF';

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;

var phaseT = FRAME_T;
/* ---- deterministic geometry: crack, threads, glyphs, weave ---- */

    vw = window.innerWidth; vh = window.innerHeight;

/* The banner fills the frame edge to edge on every screen. */
