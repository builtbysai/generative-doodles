<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Body, Between Poses</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (strict) ----------
  var WHITE = [255, 255, 255];   // #FFFFFF figure + cut flash
  var GRAY  = [138, 141, 132];   // #8A8D84 motion vectors
  var CYAN  = [79, 214, 255];    // #4FD6FF fast joints
  function mix3(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function css(c, a) {
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smoother(u) { return u * u * u * (u * (u * 6 - 15) + 10); }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300, DPR = 1, CX = 150, CY = 160, SCALE = 100, IS_PHONE = false;

  function detectPhone() {
    var sw = 0, sh = 0;
    try { sw = window.screen.width || 0; sh = window.screen.height || 0; } catch (e) { }
    if (sw && sh && Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }
  function resize() {
    var w = 0, h = 0;
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width) { w = vv.width; h = vv.height; }
    if (!w) { w = window.innerWidth || 300; h = window.innerHeight || 300; }
    W = w; H = h;
    DPR = window.devicePixelRatio || 1;
    var pw = Math.round(W * DPR), ph = Math.round(H * DPR);
    if (canvas.width !== pw) canvas.width = pw;
    if (canvas.height !== ph) canvas.height = ph;
    IS_PHONE = detectPhone();
    SCALE = Math.min(H * 0.88, W * 0.96) / 2.1;
    CX = W / 2;
    CY = H * 0.52;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceT); });
  }
  window.addEventListener('resize', function () { resize(); draw(pieceT); });
  try { canvas.style.touchAction = 'none'; } catch (e) { }

  // ---------- pose library ----------
  // Components: [spine, neck, uaL, faL, uaR, faR, thL, shL, thR, shR, rootY, rootX]
  // Angles are absolute segment directions in radians (screen coords, y down):
  // down = 1.5708, up = -1.5708. rootY/rootX are pelvis offsets in figure units.
  var POSES = [
    [-1.55, -1.55,  1.80, 1.85,  1.34, 1.29,  1.62, 1.60,  1.52, 1.54,  0.00,  0.00], // neutral
    [-1.05, -1.35,  2.40, 2.20,  0.75, 0.95,  0.45, 2.35,  0.75, 2.50,  0.34,  0.00], // crouch
    [-1.75, -1.70, -1.95, -2.20, -1.20, -0.95, 1.70, 1.66,  1.45, 1.50, -0.06,  0.02], // reach
    [-1.35, -0.90, -0.40, -0.15,  2.60, 2.90,  1.25, 1.35,  1.85, 1.75,  0.05, -0.03], // twist
    [-0.55, -0.80, -2.50, -2.10,  0.30, 0.70,  1.50, 1.45, -0.50, 0.60,  0.10,  0.10], // fall
    [-1.30, -1.50,  2.50, 2.75,  0.65, 0.40,  1.05, 1.70,  1.95, 1.80,  0.16, -0.02], // rise
    [-1.45, -1.50, -1.00, -0.60,  2.20, 2.50,  0.35, 0.50,  2.45, 1.62,  0.22,  0.06], // lunge
    [-0.35, -0.55,  1.95, 2.05,  1.20, 1.10,  1.60, 1.58,  1.53, 1.55,  0.06,  0.03], // bow
    [-1.70, -1.60,  2.90, 2.60,  0.25, 0.55,  1.58, 1.56,  0.15, 0.20, -0.02, -0.04], // kick
    [-0.95, -0.70,  0.90, 0.20,  2.25, 2.95,  0.30, 2.60,  0.60, 2.80,  0.38,  0.00], // curl
    [-2.15, -2.30, -2.60, -2.85, -0.55, -0.30, 1.75, 1.70,  1.40, 1.45,  0.02, -0.05], // arch
    [-1.50, -1.55,  0.80, 1.00,  2.35, 2.15,  0.95, 1.30,  2.20, 2.50,  0.04,  0.05]  // stride
  ];
  var NCOMP = 12;
  var STEP = 2.0;    // seconds between keyframe blend starts
  var BLEND = 2.4;   // seconds per transition (overlaps the next step: no dwell)

  // Per-component phase lag (seeded): joints pass through keyframes at slightly
  // different instants, so the figure as a whole never rests.
  var lagRng = mulberry32(1015176);
  var LAG = [];
  for (var li = 0; li < NCOMP; li++) LAG.push((lagRng() * 2 - 1) * 0.30);

  // ---------- phrase timeline (closed form over piece time) ----------
  // A phrase is 6 or 7 poses: its morph runs STEP*(n-1)+BLEND = 12.4s or 14.4s,
  // which is also the cut interval, inside the specced 11-16s.
  var phrases = [];   // {start, poses:[poseIdx,...], dur}
  function buildPhrases(seed, fromT, count) {
    var rng = mulberry32(seed);
    var out = [];
    var t = fromT;
    for (var i = 0; i < count; i++) {
      var n = 6 + (rng() < 0.5 ? 0 : 1);
      var ps = [];
      var prev = -1;
      for (var k = 0; k < n; k++) {
        var p;
        do { p = (rng() * POSES.length) | 0; } while (p === prev);
        ps.push(p); prev = p;
      }
      var dur = STEP * (n - 1) + BLEND;
      out.push({ start: t, poses: ps, dur: dur });
      t += dur;
    }
    return out;
  }
  // Phrase 0 is authored so frame one (t = 7s) sits mid crouch-to-reach:
  // blends land on STEP boundaries, so at t=7 the chain is inside blend 4
  // (poses[3] crouch -> poses[4] reach).
  phrases.push({ start: 0, poses: [0, 11, 7, 1, 2, 4], dur: STEP * 5 + BLEND });
  var tail = buildPhrases(1015177, phrases[0].dur, 80);
  phrases = phrases.concat(tail);

  function phraseAt(t) {
    for (var i = 0; i < phrases.length; i++) {
      if (t < phrases[i].start + phrases[i].dur) return phrases[i];
    }
    return phrases[phrases.length - 1];
  }
  // Chained overlapping blends for one component: start at poses[0], then each
  // next keyframe eases in over BLEND seconds starting every STEP seconds.
  // Because BLEND > STEP, at least one blend is always mid-flight.
  function compAt(ph, c, t) {
    var local = t - ph.start + LAG[c];
    var ps = ph.poses;
    var v = POSES[ps[0]][c];
    for (var i = 1; i < ps.length; i++) {
      var b = clamp((local - (i - 1) * STEP) / BLEND, 0, 1);
      if (b <= 0) break;
      v += (POSES[ps[i]][c] - v) * smoother(b);
    }
    return v;
  }
  function poseAt(t) {
    var ph = phraseAt(t);
    var out = new Array(NCOMP);
    for (var c = 0; c < NCOMP; c++) out[c] = compAt(ph, c, t);
    return out;
  }

  // ---------- rig / forward kinematics ----------
  // Joint indices: 0 pelvis, 1 chest, 2 neckTop, 3 head, 4 shL, 5 elL, 6 wrL,
  // 7 shR, 8 elR, 9 wrR, 10 hipL, 11 kneeL, 12 ankL, 13 hipR, 14 kneeR, 15 ankR
  var NJ = 16;
  var BONES = [
    [0, 1], [1, 2],                       // spine, neck
    [1, 4], [4, 5], [5, 6],               // left arm
    [1, 7], [7, 8], [8, 9],               // right arm
    [0, 10], [10, 11], [11, 12],          // left leg (pelvis to hip joint line)
    [0, 13], [13, 14], [14, 15]           // right leg
  ];
  var L_SPINE = 0.55, L_NECK = 0.15, L_UA = 0.34, L_FA = 0.30;
  var L_THIGH = 0.42, L_SHIN = 0.42, HEAD_R = 0.115, SHO_W = 0.19, HIP_W = 0.10;

  function fk(pose) {
    var P = new Array(NJ);
    var px = pose[11], py = pose[10];
    P[0] = [px, py];
    var spA = pose[0];
    var chest = [px + L_SPINE * Math.cos(spA), py + L_SPINE * Math.sin(spA)];
    P[1] = chest;
    var nkA = pose[1];
    var neckTop = [chest[0] + L_NECK * Math.cos(nkA), chest[1] + L_NECK * Math.sin(nkA)];
    P[2] = neckTop;
    P[3] = [neckTop[0] + HEAD_R * 0.92 * Math.cos(nkA), neckTop[1] + HEAD_R * 0.92 * Math.sin(nkA)];
    // shoulders: perpendicular offsets from chest along the spine direction
    var perpX = Math.cos(spA + Math.PI / 2), perpY = Math.sin(spA + Math.PI / 2);
    // screen-left shoulder is index 4 chain (uaL): offset toward -perp when upright
    P[4] = [chest[0] - SHO_W * perpX, chest[1] - SHO_W * perpY];
    P[7] = [chest[0] + SHO_W * perpX, chest[1] + SHO_W * perpY];
    P[5] = [P[4][0] + L_UA * Math.cos(pose[2]), P[4][1] + L_UA * Math.sin(pose[2])];
    P[6] = [P[5][0] + L_FA * Math.cos(pose[3]), P[5][1] + L_FA * Math.sin(pose[3])];
    P[8] = [P[7][0] + L_UA * Math.cos(pose[4]), P[7][1] + L_UA * Math.sin(pose[4])];
    P[9] = [P[8][0] + L_FA * Math.cos(pose[5]), P[8][1] + L_FA * Math.sin(pose[5])];
    P[10] = [px - HIP_W, py];
    P[13] = [px + HIP_W, py];
    P[11] = [P[10][0] + L_THIGH * Math.cos(pose[6]), P[10][1] + L_THIGH * Math.sin(pose[6])];
    P[12] = [P[11][0] + L_SHIN * Math.cos(pose[7]), P[11][1] + L_SHIN * Math.sin(pose[7])];
    P[14] = [P[13][0] + L_THIGH * Math.cos(pose[8]), P[13][1] + L_THIGH * Math.sin(pose[8])];
    P[15] = [P[14][0] + L_SHIN * Math.cos(pose[9]), P[14][1] + L_SHIN * Math.sin(pose[9])];
    return P;
  }

  // ---------- interaction state ----------
  var pieceT = 7.0;             // frame one: fixed offset, mid crouch-to-reach
  var timeScale = 1;
  var slowUntil = -1;           // loop-clock seconds while slow-mo runs
  var loopClock = 0;            // accumulated real seconds (rAF driven)
  var dragChain = null;         // [endJoint, midJoint, baseJoint]
  var dragTarget = null;        // unit-space pointer position
  var releaseInfo = null;       // {chain, dx, dy, at} decaying pull after release
  var CHAINS = { 6: [6, 5, 4], 9: [9, 8, 7], 12: [12, 11, 10], 15: [15, 14, 13], 3: [3, 2, 1] };
  var ENDS = [6, 9, 12, 15, 3];

  function applyPull(P, t) {
    var chain = null, tx = 0, ty = 0, fade = 0;
    if (dragChain && dragTarget) {
      chain = dragChain; tx = dragTarget[0]; ty = dragTarget[1]; fade = 1;
    } else if (releaseInfo) {
      var age = loopClock - releaseInfo.at;
      if (age < 0.45) {
        chain = releaseInfo.chain;
        var end = P[chain[0]];
        tx = end[0] + releaseInfo.dx; ty = end[1] + releaseInfo.dy;
        fade = 1 - age / 0.45;
      } else releaseInfo = null;
    }
    if (!chain) return P;
    var e = P[chain[0]];
    var ox = (tx - e[0]) * fade, oy = (ty - e[1]) * fade;
    var w = [1.0, 0.55, 0.28];
    var out = P.slice();
    for (var i = 0; i < 3; i++) {
      var j = chain[i];
      out[j] = [P[j][0] + ox * w[i], P[j][1] + oy * w[i]];
    }
    return out;
  }

  function jointsAt(t) {
    return fk(poseAt(t));
  }

  // ---------- trails (short vertex history, 0.4s) ----------
  var TRAIL_N = 10;
  var trail = [];   // array of joint-position snapshots, oldest first
  function seedTrail(t) {
    trail = [];
    for (var i = TRAIL_N - 1; i >= 1; i--) {
      trail.push(jointsAt(t - i * 0.044));
    }
  }

  // ---------- audio (lazy, gesture-gated, guarded) ----------
  var AC = null, aOsc = null, aGain = null, lastTick = 0;
  function audioInit() {
    if (AC) return;
    try {
      var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext :
                 (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null;
      if (!Ctor) return;
      AC = new Ctor();
      aOsc = AC.createOscillator();
      aGain = AC.createGain();
      aOsc.type = 'triangle';
      aOsc.frequency.value = 110;
      aGain.gain.value = 0;
      aOsc.connect(aGain); aGain.connect(AC.destination);
      aOsc.start();
    } catch (e) { AC = null; }
  }
  function audioBlip(freq, dur, vol) {
    if (!AC) return;
    try {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + dur + 0.02);
    } catch (e) { }
  }
  function audioFrame(totalSpeed, t) {
    if (!AC || !aOsc) return;
    try {
      var f = 80 + clamp(totalSpeed, 0, 6) * 55;
      aOsc.frequency.setTargetAtTime(f, AC.currentTime, 0.08);
      aGain.gain.setTargetAtTime(0.028, AC.currentTime, 0.1);
    } catch (e) { }
  }

  // ---------- drawing ----------
  function toPx(p) { return [CX + p[0] * SCALE, CY + p[1] * SCALE]; }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    var ph = phraseAt(t);
    var P = applyPull(jointsAt(t), t);
    var Pprev = jointsAt(t - 0.06);
    if (dragChain || releaseInfo) Pprev = applyPull(Pprev, t);
    var vel = new Array(NJ), speed = new Array(NJ), totalSpeed = 0;
    for (var j = 0; j < NJ; j++) {
      var vx = (P[j][0] - Pprev[j][0]) / 0.06;
      var vy = (P[j][1] - Pprev[j][1]) / 0.06;
      vel[j] = [vx, vy];
      speed[j] = Math.sqrt(vx * vx + vy * vy);
      totalSpeed += speed[j];
    }
    function heat(j) { return clamp((speed[j] - 0.30) / 1.45, 0, 1); }

    // faint vertex trails (white at 0.15, ~0.4s of history)
    ctx.lineWidth = 1;
    for (var tj = 0; tj < NJ; tj++) {
      if (tj === 3) continue; // head trail reads as clutter; the circle carries it
      ctx.strokeStyle = css(WHITE, 0.11);
      ctx.beginPath();
      var started = false;
      for (var s = 0; s < trail.length; s++) {
        var tp = toPx(trail[s][tj]);
        if (!started) { ctx.moveTo(tp[0], tp[1]); started = true; }
        else ctx.lineTo(tp[0], tp[1]);
      }
      var hp = toPx(P[tj]);
      if (started) { ctx.lineTo(hp[0], hp[1]); ctx.stroke(); }
    }

    // motion vectors (gray, capped length)
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = css(GRAY, 0.85);
    ctx.beginPath();
    for (var vj = 0; vj < NJ; vj++) {
      if (speed[vj] < 0.05) continue;
      var a = toPx(P[vj]);
      var vl = Math.min(speed[vj] * 0.11, 0.17);
      var ux = vel[vj][0] / speed[vj], uy = vel[vj][1] / speed[vj];
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(a[0] + ux * vl * SCALE, a[1] + uy * vl * SCALE);
    }
    ctx.stroke();

    // bones, tinted toward cyan where the endpoints run fast
    ctx.lineCap = 'round';
    for (var b = 0; b < BONES.length; b++) {
      var j0 = BONES[b][0], j1 = BONES[b][1];
      var hMix = (heat(j0) + heat(j1)) / 2;
      ctx.strokeStyle = css(mix3(WHITE, CYAN, hMix), 0.96);
      ctx.lineWidth = 2.4;
      var p0 = toPx(P[j0]), p1 = toPx(P[j1]);
      ctx.beginPath();
      ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p1[0], p1[1]);
      ctx.stroke();
    }
    // shoulder and hip bars
    ctx.strokeStyle = css(mix3(WHITE, CYAN, (heat(4) + heat(7)) / 2), 0.96);
    ctx.beginPath();
    var s0 = toPx(P[4]), s1 = toPx(P[7]);
    ctx.moveTo(s0[0], s0[1]); ctx.lineTo(s1[0], s1[1]); ctx.stroke();
    ctx.strokeStyle = css(mix3(WHITE, CYAN, (heat(10) + heat(13)) / 2), 0.96);
    ctx.beginPath();
    var h0 = toPx(P[10]), h1 = toPx(P[13]);
    ctx.moveTo(h0[0], h0[1]); ctx.lineTo(h1[0], h1[1]); ctx.stroke();

    // joint dots
    for (var dj = 0; dj < NJ; dj++) {
      if (dj === 3) continue;
      var dp = toPx(P[dj]);
      ctx.fillStyle = css(mix3(WHITE, CYAN, heat(dj)), 1);
      ctx.beginPath();
      ctx.arc(dp[0], dp[1], dj === 0 || dj === 1 ? 3.0 : 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
    // head circle
    var hd = toPx(P[3]);
    ctx.strokeStyle = css(mix3(WHITE, CYAN, heat(3)), 0.98);
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(hd[0], hd[1], HEAD_R * SCALE, 0, Math.PI * 2);
    ctx.stroke();

    // the cut: one frame of white at 0.15 when a phrase boundary is crossed
    if (ph.start > 0 && t - ph.start < 0.055) {
      ctx.fillStyle = css(WHITE, 0.15);
      ctx.fillRect(0, 0, W, H);
    }
    return totalSpeed;
  }

  // ---------- pointer interaction ----------
  function evPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX - r.left - CX) / SCALE;
    var y = (e.clientY - r.top - CY) / SCALE;
    return [x, y];
  }
  var downAt = 0, downPos = null, lastTapAt = -10, pendingTap = null;
  var cutCount = 0;
  function forceCut() {
    // rebuild the timeline from now with a fresh seed: an immediate hard cut
    cutCount++;
    var seed = 1015200 + cutCount * 7919;
    var np = buildPhrases(seed, pieceT, 80);
    phrases = phrases.filter(function (p) { return p.start + p.dur <= pieceT; });
    phrases = phrases.concat(np);
    seedTrail(pieceT);
    audioBlip(140, 0.07, 0.05);
  }
  canvas.addEventListener('pointerdown', function (e) {
    audioInit();
    if (AC && AC.resume) { try { AC.resume(); } catch (err) { } }
    downAt = loopClock;
    downPos = evPos(e);
    // nearest limb end becomes the drag chain
    var P = jointsAt(pieceT);
    var best = null, bestD = 1e9;
    for (var i = 0; i < ENDS.length; i++) {
      var j = ENDS[i];
      var dx = P[j][0] - downPos[0], dy = P[j][1] - downPos[1];
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = j; }
    }
    dragChain = CHAINS[best];
    dragTarget = downPos;
    releaseInfo = null;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (dragChain) dragTarget = evPos(e);
  });
  function endPointer(e) {
    if (!dragChain) return;
    var upPos = evPos(e);
    var moved = Math.sqrt(Math.pow(upPos[0] - downPos[0], 2) + Math.pow(upPos[1] - downPos[1], 2));
    var quick = loopClock - downAt < 0.35;
    if (quick && moved < 0.05) {
      // a tap: a second tap inside 300ms is a double-tap (cut now)
      if (loopClock - lastTapAt < 0.30) {
        lastTapAt = -10;
        if (pendingTap !== null) { clearTimeout(pendingTap); pendingTap = null; }
        forceCut();
      } else {
        lastTapAt = loopClock;
        pendingTap = setTimeout(function () {
          pendingTap = null;
          slowUntil = loopClock + 10;   // slow the morph 10x for 10s
        }, 300);
      }
      dragChain = null; dragTarget = null;
    } else {
      // released drag: remember the pull so it decays instead of snapping
      var P = jointsAt(pieceT);
      var e0 = P[dragChain[0]];
      releaseInfo = {
        chain: dragChain,
        dx: (dragTarget[0] - e0[0]), dy: (dragTarget[1] - e0[1]),
        at: loopClock
      };
      dragChain = null; dragTarget = null;
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- main loop ----------
  resize();
  seedTrail(pieceT);
  draw(pieceT);

  var lastTs = null, lastPhraseStart = phraseAt(pieceT).start, tickArmed = true;
  function frame(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    loopClock += dt;
    timeScale = (loopClock < slowUntil) ? 0.1 : 1;
    pieceT += dt * timeScale;
    // push trail snapshot (real-time history of the drawn figure)
    trail.push(applyPull(jointsAt(pieceT), pieceT));
    while (trail.length > TRAIL_N) trail.shift();
    var spd = draw(pieceT);
    // cut click + tick sounds on live events only
    var ps = phraseAt(pieceT).start;
    if (ps !== lastPhraseStart) { lastPhraseStart = ps; audioBlip(140, 0.07, 0.05); }
    if (AC) {
