<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeanne's Schedule</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e0d0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (only these colours).
  var WALLS = '#e8e0d0', WOOD = '#8a6a48', TEAL = '#3a6f6a';
  var DRESS = '#4a5a7a', SKIN = '#f2ead8', SLATE = '#6b7686', SCARLET = '#c1272d';

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1465000);
  // Seeded tile-dot decoration for the kitchen wall (fixed at load).
  var tileDots = [];
  for (var i = 0; i < 14; i++) tileDots.push(rand());

  var W = 0, H = 0, barH = 0, lastT = 0;
  var DAY = 72, LOOP = 216;

  function size() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    barH = Math.max(30, Math.round(h * 0.09));
  }
  size();

  function isPhone() {
    var s = window.screen;
    var m = Math.min(s.width, s.height);
    if (m < 700) return true;
    return H > W * 1.15;
  }

  // ---- Day scripts ----
  // Anchors are fractions within their room rect, resolved in draw().
  // Segment: {k:'peel'|'wash'|'bathe'|'cook'|'sit'|'sleep'|'walk', d:seconds, at:'TABLE'|'SINK'|'TUB'|'STOVE'|'CHAIR'|'BED', from, to}
  function dayStd() {
    return [
      { k: 'peel', d: 10, at: 'TABLE' },
      { k: 'walk', d: 2, from: 'TABLE', to: 'SINK' },
      { k: 'wash', d: 10, at: 'SINK' },
      { k: 'walk', d: 2, from: 'SINK', to: 'TUB' },
      { k: 'bathe', d: 12, at: 'TUB' },
      { k: 'walk', d: 2, from: 'TUB', to: 'STOVE' },
      { k: 'cook', d: 12, at: 'STOVE' },
      { k: 'walk', d: 2, from: 'STOVE', to: 'CHAIR' },
      { k: 'sit', d: 6, at: 'CHAIR' },
      { k: 'walk', d: 2, from: 'CHAIR', to: 'BED' },
      { k: 'sleep', d: 9, at: 'BED' },
      { k: 'walk', d: 3, from: 'BED', to: 'TABLE' }
    ];
  }
  function dayDev() {
    // Day three: washing skipped, cooking performed out of order (before bathing).
    return [
      { k: 'peel', d: 10, at: 'TABLE' },
      { k: 'walk', d: 3, from: 'TABLE', to: 'STOVE' },
      { k: 'cook', d: 12, at: 'STOVE' },
      { k: 'walk', d: 3, from: 'STOVE', to: 'TUB' },
      { k: 'bathe', d: 12, at: 'TUB' },
      { k: 'walk', d: 3, from: 'TUB', to: 'CHAIR' },
      { k: 'sit', d: 6, at: 'CHAIR' },
      { k: 'walk', d: 3, from: 'CHAIR', to: 'BED' },
      { k: 'sleep', d: 17, at: 'BED' },
      { k: 'walk', d: 3, from: 'BED', to: 'TABLE' }
    ];
  }
  var DAYS = [dayStd(), dayStd(), dayDev()];

  function stateAt(J) {
    var day = Math.floor(J / DAY) % 3;
    var dt = J - Math.floor(J / DAY) * DAY;
    var segs = DAYS[day];
    var acc = 0, seg = segs[segs.length - 1], lt = 0, si = segs.length - 1;
    for (var i = 0; i < segs.length; i++) {
      if (dt < acc + segs[i].d) { seg = segs[i]; lt = dt - acc; si = i; break; }
      acc += segs[i].d;
    }
    return { day: day, dayTime: dt, seg: seg, segIndex: si, lt: lt, segs: segs };
  }

  // ---- Clock / scrub state (closed-form over recorded events) ----
  var baseJ = 0, baseClock = 0, scrubbing = false, scrubJ = 0;
  function journey(t) {
    if (scrubbing) return scrubJ;
    var j = (baseJ + (t - baseClock)) % LOOP;
    if (j < 0) j += LOOP;
    return j;
  }

  function onBar(e) {
    var y = (typeof e.clientY === 'number') ? e.clientY : e.y;
    return y >= H - barH;
  }
  function scrub(e) {
    var x = (typeof e.clientX === 'number') ? e.clientX : e.x;
    var f = x / W; if (f < 0) f = 0; if (f > 1) f = 1;
    var st = stateAt(journey(lastT));
    scrubJ = st.day * DAY + f * DAY;
  }
  canvas.addEventListener('pointerdown', function (e) {
    if (onBar(e)) { scrubbing = true; scrub(e); }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (scrubbing) scrub(e);
  });
  function endScrub() {
    if (scrubbing) {
      scrubbing = false;
      baseJ = scrubJ; baseClock = lastT;
    }
  }
  canvas.addEventListener('pointerup', endScrub);
  canvas.addEventListener('pointercancel', endScrub);

  // ---- Drawing ----
  function rect(x, y, w, h, col) {
    ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
  }
  function circle(x, y, r, col) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.fill();
  }
  function line(x1, y1, x2, y2, col, w) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();
  }

  function drawFigure(x, y, fh, gesture, lt) {
    // x,y = feet centre (standing) or body centre anchor. fh = figure height.
    var hw = fh * 0.16; // half width
    var headR = fh * 0.13;
    var hy = y - fh + headR; // head centre
    if (gesture === 'sleep') {
      // Lying in bed: horizontal body.
      rect(x - fh * 0.42, y - fh * 0.10, fh * 0.84, fh * 0.20, DRESS);
      circle(x - fh * 0.50, y - fh * 0.02, headR, SKIN);
      ctx.beginPath(); ctx.moveTo(x - fh * 0.50 + headR, y - fh * 0.02);
      ctx.arc(x - fh * 0.50, y - fh * 0.02, headR, -1.2, 1.2);
      ctx.fillStyle = SLATE; ctx.fill();
      return;
    }
    if (gesture === 'sit') {
      // Seated: compressed body, legs forward.
      rect(x - hw, y - fh * 0.62, hw * 2, fh * 0.62, DRESS);
      rect(x - hw, y - fh * 0.10, fh * 0.42, fh * 0.10, DRESS);
      circle(x, y - fh * 0.62 - headR + fh * 0.06, headR, SKIN);
      ctx.beginPath(); ctx.moveTo(x + headR, y - fh * 0.62 - headR + fh * 0.06);
      ctx.arc(x, y - fh * 0.62 - headR + fh * 0.06, headR, -1.2, 1.2);
      ctx.fillStyle = SLATE; ctx.fill();
      line(x - hw * 0.7, y - fh * 0.45, x - hw * 0.7, y - fh * 0.18, SKIN, fh * 0.05);
      line(x + hw * 0.7, y - fh * 0.45, x + hw * 0.7, y - fh * 0.18, SKIN, fh * 0.05);
      return;
    }
    var bob = 0;
    if (gesture === 'walk') bob = Math.abs(Math.sin(lt * 9)) * fh * 0.03;
    var fy = y - bob;
    // Legs / feet.
    var legSwing = (gesture === 'walk') ? Math.sin(lt * 9) * fh * 0.05 : 0;
    rect(x - hw * 0.55, fy - fh * 0.10, hw * 0.5, fh * 0.10 + legSwing * 0.3, SKIN);
    rect(x + hw * 0.05, fy - fh * 0.10, hw * 0.5, fh * 0.10 - legSwing * 0.3, SKIN);
    // Dress: trapezoid shoulders to hem.
    ctx.beginPath();
    ctx.moveTo(x - hw * 0.8, fy - fh * 0.78);
    ctx.lineTo(x + hw * 0.8, fy - fh * 0.78);
    ctx.lineTo(x + hw * 1.15, fy - fh * 0.08);
    ctx.lineTo(x - hw * 1.15, fy - fh * 0.08);
    ctx.closePath();
    ctx.fillStyle = DRESS; ctx.fill();
    // Head + hair cap.
    circle(x, hy, headR, SKIN);
    ctx.beginPath(); ctx.moveTo(x + headR, hy);
    ctx.arc(x, hy, headR, -2.6, -0.5);
    ctx.fillStyle = SLATE; ctx.fill();
    // Arms by gesture.
    var sh = fy - fh * 0.74, ax = hw * 0.95;
    if (gesture === 'peel') {
      var a = Math.sin(lt * 4) * fh * 0.10;
      line(x - ax, sh, x - ax - hw * 0.3, sh + fh * 0.30 + a, SKIN, fh * 0.05);
      line(x + ax, sh, x + ax + hw * 0.3, sh + fh * 0.30 - a, SKIN, fh * 0.05);
    } else if (gesture === 'wash') {
      var s = Math.sin(lt * 8) * fh * 0.03;
      line(x - ax, sh, x - ax - hw * 0.2, sh + fh * 0.32 + s, SKIN, fh * 0.05);
      line(x + ax, sh, x + ax + hw * 0.2, sh + fh * 0.32 - s, SKIN, fh * 0.05);
    } else if (gesture === 'cook') {
      var cx = Math.cos(lt * 5) * fh * 0.06, cy = Math.sin(lt * 5) * fh * 0.06;
      line(x - ax, sh, x - ax - hw * 0.2, sh + fh * 0.32, SKIN, fh * 0.05);
      line(x + ax, sh, x + ax + hw * 0.35 + cx, sh + fh * 0.34 + cy, SKIN, fh * 0.05);
    } else if (gesture === 'bathe') {
      line(x - ax, sh, x - ax - hw * 0.2, sh + fh * 0.28, SKIN, fh * 0.05);
      line(x + ax, sh, x + ax + hw * 0.2, sh + fh * 0.28, SKIN, fh * 0.05);
    } else {
      line(x - ax, sh, x - ax - hw * 0.2, sh + fh * 0.34, SKIN, fh * 0.05);
      line(x + ax, sh, x + ax + hw * 0.2, sh + fh * 0.34, SKIN, fh * 0.05);
    }
    if (gesture === 'bathe') {
      // Screen in front of the lower body; head and shoulders stay visible.
      var sw = hw * 2.6, sy = fy - fh * 0.52;
      rect(x - sw / 2, sy, sw, fh * 0.52, WALLS);
      ctx.strokeStyle = WOOD; ctx.lineWidth = Math.max(2, fh * 0.02);
      ctx.strokeRect(x - sw / 2, sy, sw, fh * 0.52);
      // Steam wisps above the screen.
      var st = (lt % 3) / 3;
      rect(x - hw * 0.6, sy - fh * 0.10 - st * fh * 0.10, fh * 0.05, fh * 0.08, WALLS);
      rect(x + hw * 0.3, sy - fh * 0.06 - ((lt + 1) % 3) / 3 * fh * 0.10, fh * 0.05, fh * 0.08, WALLS);
    }
  }

  function draw(t) {
    lastT = t;
    var J = journey(t);
    var st = stateAt(J);
    var planH = H - barH;
    var phone = isPhone();
    var gap = Math.max(6, Math.round(Math.min(W, planH) * 0.014));
    var rw = (W - gap * 3) / 2, rh = (planH - gap * 3) / 2;
    // Ground = walls colour; rooms = wood floors.
    rect(0, 0, W, planH, WALLS);
    var rooms = [
      { x: gap, y: gap, w: rw, h: rh },            // kitchen (top-left)
      { x: gap * 2 + rw, y: gap, w: rw, h: rh },   // bathroom (top-right)
      { x: gap, y: gap * 2 + rh, w: rw, h: rh },   // bedroom (bottom-left)
      { x: gap * 2 + rw, y: gap * 2 + rh, w: rw, h: rh } // sitting (bottom-right)
    ];
    for (var r = 0; r < 4; r++) rect(rooms[r].x, rooms[r].y, rooms[r].w, rooms[r].h, WOOD);

    // Kitchen tiles: teal strip + seeded dots along the top wall.
    var k = rooms[0];
    rect(k.x, k.y, k.w, Math.max(4, k.h * 0.05), TEAL);
    for (var d = 0; d < tileDots.length; d++) {
      var tx = k.x + tileDots[d] * k.w;
      rect(tx, k.y + k.h * 0.07, Math.max(3, k.w * 0.012), Math.max(3, k.w * 0.012), TEAL);
    }
    function roomPt(room, fx, fy) {
      return { x: room.x + fx * room.w, y: room.y + fy * room.h };
    }
    // Fixtures (flat shapes, palette only).
    var table = roomPt(k, 0.30, 0.48), sink = roomPt(k, 0.76, 0.30), stove = roomPt(k, 0.72, 0.76);
    var fs = Math.min(rw, rh);
    rect(table.x - fs * 0.14, table.y - fs * 0.07, fs * 0.28, fs * 0.14, WALLS);
    ctx.strokeStyle = WOOD; ctx.lineWidth = Math.max(2, fs * 0.012);
    ctx.strokeRect(table.x - fs * 0.14, table.y - fs * 0.07, fs * 0.28, fs * 0.14);
    rect(sink.x - fs * 0.10, sink.y - fs * 0.06, fs * 0.20, fs * 0.12, WALLS);
    rect(sink.x - fs * 0.02, sink.y - fs * 0.10, fs * 0.04, fs * 0.05, TEAL);
    rect(stove.x - fs * 0.11, stove.y - fs * 0.08, fs * 0.22, fs * 0.16, SLATE);
    rect(stove.x - fs * 0.11, stove.y + fs * 0.08, fs * 0.22, fs * 0.03, WOOD);
    var b = rooms[1];
    var tub = roomPt(b, 0.52, 0.55);
    rect(tub.x - fs * 0.20, tub.y - fs * 0.09, fs * 0.40, fs * 0.18, WALLS);
    ctx.strokeStyle = WOOD; ctx.lineWidth = Math.max(2, fs * 0.012);
    ctx.strokeRect(tub.x - fs * 0.20, tub.y - fs * 0.09, fs * 0.40, fs * 0.18);
    rect(tub.x - fs * 0.18, tub.y - fs * 0.06, fs * 0.36, fs * 0.03, TEAL);
    var bed = rooms[2];
    var bedPt = roomPt(bed, 0.50, 0.50);
    rect(bedPt.x - fs * 0.26, bedPt.y - fs * 0.13, fs * 0.52, fs * 0.26, WOOD);
    rect(bedPt.x - fs * 0.22, bedPt.y - fs * 0.09, fs * 0.44, fs * 0.18, WALLS);
    rect(bedPt.x - fs * 0.22, bedPt.y - fs * 0.09, fs * 0.10, fs * 0.07, SLATE);
    var sit = rooms[3];
    var chair = roomPt(sit, 0.55, 0.50);
    rect(chair.x - fs * 0.13, chair.y - fs * 0.10, fs * 0.26, fs * 0.20, WOOD);
    rect(chair.x - fs * 0.10, chair.y - fs * 0.07, fs * 0.20, fs * 0.14, WALLS);

    var anchors = { TABLE: table, SINK: sink, TUB: tub, STOVE: stove, CHAIR: chair, BED: bedPt };
    var seg = st.seg, fh = Math.min(W, planH) * (phone ? 0.20 : 0.17);
    var fx, fy, gesture = seg.k;
    if (seg.k === 'walk') {
      var a = anchors[seg.from], c = anchors[seg.to];
      var p = seg.d > 0 ? st.lt / seg.d : 0;
      var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      fx = a.x + (c.x - a.x) * e; fy = a.y + (c.y - a.y) * e;
    } else {
      var an = anchors[seg.at];
      fx = an.x; fy = an.y + fh * 0.10;
      if (seg.k === 'sleep') { fx = bedPt.x; fy = bedPt.y + fh * 0.05; }
      if (seg.k === 'sit') { fx = chair.x; fy = chair.y + fh * 0.10; }
      if (seg.k === 'bathe') { fx = tub.x; fy = tub.y + fh * 0.12; }
    }
    drawFigure(fx, fy, fh, gesture, st.lt);

    // Schedule bar.
    var by = planH;
    rect(0, by, W, barH, SLATE);
    rect(0, by, W, Math.max(2, barH * 0.06), WALLS);
    var segs = st.segs, bx = 0;
    var innerY = by + barH * 0.22, innerH = barH * 0.56;
    for (var s = 0; s < segs.length; s++) {
      var bw = W * (segs[s].d / DAY);
      var col = (s === st.segIndex) ? SCARLET : WALLS;
      rect(bx + 1, innerY, Math.max(2, bw - 2), innerH, col);
      bx += bw;
    }
    // Playhead.
    var px = W * (st.dayTime / DAY);
    rect(px - 1, by + barH * 0.12, 2, barH * 0.76, SKIN);
    // Day dots (three, current scarlet).
    for (var dd = 0; dd < 3; dd++) {
      var ds = Math.max(5, barH * 0.16);
      rect(W - (3 - dd) * (ds + 6), by + barH * 0.10, ds, ds, dd === st.day ? SCARLET : WALLS);
    }

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // Boot: frame one is draw(0), clock starts only with the rAF loop.
  draw(0);
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  function onResize() { size(); draw(lastT); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  if (window.addEventListener) window.addEventListener('resize', onResize);

  if (typeof window !== 'undefined') {
    window.__piece = {
      drawAt: function (t) { baseJ = t % LOOP; baseClock = t; scrubbing = false; draw(t); },
      stateAt: stateAt,
      journeyAt: function (t) { return journey(t); },
      scrubTo: function (dayTime) {
        var st = stateAt(journey(lastT));
        scrubJ = st.day * DAY + dayTime; scrubbing = true; lastT = lastT;
        return scrubJ;
      },
      release: function () { scrubbing = false; baseJ = scrubJ; baseClock = lastT; }
    };
  }
})();
</script>
</body>
</html>
