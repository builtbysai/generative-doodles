<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№ 9106</title>
<!-- 9106-SMOKE-V1 -->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0806; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  // Seeded RNG (mulberry32) — reseeded per strike so no two plumes match.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32((Math.random() * 1e9) | 0);

  // Value noise + fbm for the curl-ish flow field.
  function hash2(x, y) {
    var h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return h - Math.floor(h);
  }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y) {
    return vnoise(x, y) * 0.55 + vnoise(x * 2.13 + 7.7, y * 2.13 + 3.1) * 0.28 + vnoise(x * 4.31 + 13.7, y * 4.31 + 9.2) * 0.17;
  }

  // Soft radial sprite, tinted at draw time via globalAlpha + shadow-free fills.
  var sprite = document.createElement('canvas');
  sprite.width = sprite.height = 128;
  (function () {
    var s = sprite.getContext('2d');
    var g = s.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,255,255,0.85)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.38)');
    g.addColorStop(0.7, 'rgba(255,255,255,0.12)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    s.fillStyle = g; s.fillRect(0, 0, 128, 128);
  })();

  // Pre-tinted sprite variants: cool body, warm lit, dark back layer.
  function tinted(r, g, b) {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var x = c.getContext('2d');
    x.drawImage(sprite, 0, 0);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    x.fillRect(0, 0, 128, 128);
    return c;
  }
  var SPR_BODY = tinted(148, 162, 184);   // cool grey-blue
  var SPR_LIT = tinted(255, 176, 96);     // ember amber
  var SPR_BACK = tinted(104, 112, 132);   // rear layer, close to body: no dark ring

  var MAXP = 550;
  var parts = [];
  // Match state machine: idle -> strike -> flame -> ember -> quiet -> strike...
  var match = { state: 'idle', t: 0, x: 0.5, y: 0.88, seed: 1, flame: 0, ember: 0, nextStrike: 1.2, burstT: 0 };
  var wind = 0;      // slow ambient drift, re-rolled per strike
  var stirX = -1, stirY = -1, stirVX = 0, stirVY = 0, stirT = 0;

  function startStrike() {
    match.seed = (Math.random() * 1e9) | 0;
    rng = mulberry32(match.seed);
    match.x = 0.32 + rng() * 0.36;
    match.y = 0.84 + rng() * 0.08;
    wind = (rng() - 0.5) * 26;
    match.state = 'strike'; match.t = 0;
  }

  function spawnPlume(n, spread, speed) {
    var mx = match.x * W, my = match.y * H;
    for (var i = 0; i < n; i++) {
      if (parts.length >= MAXP) parts.shift();
      var a = rng() * Math.PI * 2, r = rng() * spread;
      parts.push({
        x: mx + Math.cos(a) * r, y: my - rng() * 8,
        vx: (rng() - 0.5) * 14, vy: -speed * (0.55 + rng() * 0.7),
        age: 0, life: 8 + rng() * 5,
        size: 8 + rng() * 13, grow: 9 + rng() * 11,
        depth: rng(), // 0 = back (big, slow), 1 = front (lit, crisp)
        swirl: (rng() - 0.5) * 2.4,
        phase: rng() * Math.PI * 2,
        drift: (rng() - 0.5) * 2,
        wisp: rng() < 0.35
      });
    }
  }

  function step(dt, t) {
    // Match beat timing (breathing, not metronome: 13-21s between strikes).
    match.t += dt;
    if (match.state === 'idle' && match.t >= match.nextStrike) startStrike();
    else if (match.state === 'strike' && match.t > 0.25) { match.state = 'flame'; match.t = 0; }
    else if (match.state === 'flame') {
      match.flame = 1;
      if (match.t > 1.1 + rng() * 0.3) { match.state = 'ember'; match.t = 0; match.burstT = 0; spawnPlume(60, 12, 46); }
    } else if (match.state === 'ember') {
      match.flame = Math.max(0, match.flame - dt * 1.4);
      match.ember = Math.max(0, 1 - match.t / 3.2);
      // Smoke in distinct puffs, widening as the ember dies, so the plume
      // has gaps and billows instead of one uniform flood.
      match.burstT += dt;
      if (match.t < 2.6 && match.burstT > 0.24) {
        match.burstT = 0;
        spawnPlume(7, 5 + match.t * 8, 40);
      }
      if (match.t > 3.4) { match.state = 'idle'; match.t = 0; match.nextStrike = 13 + rng() * 8; match.ember = 0; }
    }

    // Occasional stray wisps so the air never fully empties between strikes.
    if (match.state === 'idle' && Math.random() < dt * 3 && parts.length < 300) {
      spawnPlume(1, 30, 22);
    }

    var tN = t * 0.05;
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.age += dt;
      if (p.age >= p.life) { parts.splice(i, 1); continue; }
      // Flow field: curl-ish wander + buoyancy + ambient wind.
      var n = fbm(p.x * 0.0016 + p.depth, p.y * 0.0016 - tN);
      var ang = n * Math.PI * 4 + p.swirl;
      var depthF = 0.55 + p.depth * 0.65;
      p.vx += Math.cos(ang) * 26 * depthF * dt;
      p.vy += (-34 * depthF - 6) * dt + Math.sin(ang) * 12 * dt;
      p.vx += wind * dt * 0.4;
      // Per-particle curl: lateral sine drift so each puff twists instead
      // of rising straight, plus a slow outward billow with age.
      p.vx += Math.sin(p.age * 1.7 + p.phase) * 22 * dt + p.drift * p.age * 1.4 * dt;
      p.vy += Math.cos(p.age * 1.3 + p.phase) * 8 * dt;
      // Drag stir: a real force, radial push + swirl around the pointer.
      if (stirT > 0) {
        var dx = p.x - stirX, dy = p.y - stirY;
        var d2 = dx * dx + dy * dy, R = 190;
        if (d2 < R * R && d2 > 1) {
          var d = Math.sqrt(d2), f = (1 - d / R) * 260;
          p.vx += (dx / d * f + -dy / d * stirVX * 0.35) * dt;
          p.vy += (dy / d * f + dx / d * stirVY * 0.35) * dt;
        }
      }
      // Drag + speed cap so smoke stays soft, never frantic.
      p.vx *= (1 - 0.55 * dt); p.vy *= (1 - 0.35 * dt);
      var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (sp > 150) { p.vx *= 150 / sp; p.vy *= 150 / sp; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.size += p.grow * dt;
    }
    if (stirT > 0) stirT -= dt;
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    // Near-black warm ground.
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0b0806'); bg.addColorStop(0.75, '#120c08'); bg.addColorStop(1, '#17100a');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    var mx = match.x * W, my = match.y * H;
    // Ember glow spilling onto the smoke (only while flame/ember live).
    var glow = Math.max(match.flame, match.ember);
    if (glow > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var gr = ctx.createRadialGradient(mx, my - 14, 0, mx, my - 14, Math.min(W, H) * 0.42);
      gr.addColorStop(0, 'rgba(255,150,50,' + (0.34 * glow) + ')');
      gr.addColorStop(0.5, 'rgba(255,110,30,' + (0.12 * glow) + ')');
      gr.addColorStop(1, 'rgba(255,110,30,0)');
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // Smoke: back layer first (dark, big), then body, then lit front.
    var order = [0, 1, 2];
    for (var layer = 0; layer < 3; layer++) {
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        var li = p.depth < 0.33 ? 0 : (p.depth < 0.72 ? 1 : 2);
        if (li !== layer) continue;
        var k = p.age / p.life;
        var fadeIn = Math.min(1, p.age / 1.2), fadeOut = 1 - Math.max(0, (k - 0.55) / 0.45);
        var a = Math.min(fadeIn, fadeOut);
        if (a <= 0) continue;
        // Warm lit edges near the ember and early in life, cool body otherwise.
        var edx = p.x - mx, edy = p.y - (my - 14);
        var ed = Math.sqrt(edx * edx + edy * edy);
        var lit = Math.max(0, 1 - ed / 260) * glow * 0.9 + Math.max(0, 1 - p.age / 2.5) * 0.35;
        var spr = li === 0 ? SPR_BACK : (lit > 0.45 ? SPR_LIT : SPR_BODY);
        var alpha = (li === 0 ? 0.05 : 0.10) * a * (0.6 + p.depth * 0.5);
        if (lit > 0.45) alpha *= 1.25;
        ctx.save();
        ctx.globalAlpha = Math.min(0.26, alpha);
        var s = p.size * (li === 0 ? 1.25 : 1);
        if (p.wisp) {
          // Streak the sprite along its velocity: wisps read as smoke
          // strands, not round blobs.
          var va = Math.atan2(p.vy, p.vx);
          ctx.translate(p.x, p.y); ctx.rotate(va); ctx.scale(1.7, 0.7);
          ctx.drawImage(spr, -s, -s, s * 2, s * 2);
        } else {
          ctx.drawImage(spr, p.x - s, p.y - s, s * 2, s * 2);
        }
        ctx.restore();
      }
    }

    // The match itself: stick + head, flame flicker, dying ember dot.
    if (match.state !== 'idle') {
      var ang = -0.5 + Math.sin(t * 0.7) * 0.02;
      ctx.save();
      ctx.translate(mx, my); ctx.rotate(ang);
      ctx.fillStyle = '#c8a06a'; ctx.fillRect(-2, 0, 4, 64);
      ctx.fillStyle = '#7a2d1d';
      ctx.beginPath(); ctx.arc(0, -2, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      if (match.state === 'flame' || match.flame > 0.05) {
        var fl = match.flame * (0.85 + 0.15 * Math.sin(t * 31) * Math.sin(t * 17 + 2));
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var fg = ctx.createRadialGradient(mx, my - 22, 0, mx, my - 22, 58 * fl);
        fg.addColorStop(0, 'rgba(255,230,160,0.95)');
        fg.addColorStop(0.4, 'rgba(255,150,40,0.55)');
        fg.addColorStop(1, 'rgba(255,110,20,0)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.ellipse(mx, my - 26, 22 * fl, 42 * fl, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else if (match.state === 'ember' && match.ember > 0.02) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,120,30,' + (0.85 * match.ember) + ')';
        ctx.beginPath(); ctx.arc(mx, my - 4, 4.5 * match.ember + 1, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

    // Quiet vignette so the edges fall away.
    var vg = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  function onPointer(e) {
    var nx, ny;
    if (e.touches && e.touches[0]) { nx = e.touches[0].clientX; ny = e.touches[0].clientY; }
    else { nx = e.clientX; ny = e.clientY; }
    if (stirX >= 0) { stirVX = nx - stirX; stirVY = ny - stirY; }
    stirX = nx; stirY = ny; stirT = 0.6;
  }
  window.addEventListener('pointermove', onPointer, { passive: true });
  window.addEventListener('pointerdown', onPointer, { passive: true });

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt, now / 1000);
    draw(now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
