<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.370 Fiddlehead Biome</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E140F; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.370 Fiddlehead Biome (al_kovalyova_design).
// After Olena Kovalova's Forest Biome wallpaper: a dense
// fern toss on near-black, uncurling fiddlehead spirals,
// arching fronds with serrated leaflets, and cream
// butterflies sprinkled in the negative space. The field
// is a half-drop wallpaper tile of 640x450 holding exactly
// 10 fiddleheads and 4 butterflies, so a 1280x900 screen
// shows exactly 40 fiddleheads and 16 butterflies. Each
// fiddlehead is built in two parts: a gently bending
// stalk with leaflet pairs, topped by an explicit
// Archimedean coil. The curl parameter u drives the
// unfurl: at u = 0.2 the stalk is short and the coil
// winds just over two full turns; at u = 1.0 the stalk
// has grown long and the coil opens to a loose hook.
// Over the 20s master loop every fiddlehead completes
// exactly one unfurl and re-curl cycle, u = 0.6 + 0.4
// sin, with golden-angle staggered phases, and the
// butterflies flap and bob on whole cycles of the same
// loop, so frame 20s is pixel-identical to frame 0.
// Dragging is a breeze: pointer velocity drives a
// breeze vector, fronds and fiddleheads bend away along
// their stems, butterflies scatter further, and on
// release everything springs back to the authored state
// and settles at exactly zero, so the seam holds.
// Frame one is drawn at the constant phase T = 6.3s,
// fiddleheads at mixed curl phases; the animation clock
// is anchored to that constant plus elapsed time, never
// a wall-clock offset. Flat colour only, one canvas, no
// gradients, no shadowBlur, no offscreen canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 20;              // seconds, seamless master loop
var PW = 640, PH = 450;     // half-drop tile; 2x2 tiles per screen
var BASE_H = 120;           // nominal fiddlehead height at scale 1
var PAL = {
  ground: '#0E140F',
  fernA: '#7A9B76',
  fernB: '#5C7A58',
  cream: '#F1EBDC',
  gold: '#C9A24B'
};
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 6.3, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var breezeX = 0, breezeY = 0;

// ---- fixed-seed table generation -------------------------------
// mulberry32: pure integer PRNG, identical on every engine.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rnd = mulberry32(370370);
var FIDS = [], BFS = [];
(function build() {
  var i, j, tries, bx, by, ok, dx, dy;
  for (i = 0; i < 10; i++) {
    // one fiddlehead per cell of a 5x2 jittered grid, so the
    // toss covers the tile evenly with no empty bands.
    FIDS.push({
      x: (i % 5) * 128 + 64 + (rnd() * 2 - 1) * 38,
      y: Math.floor(i / 5) * 225 + 112 + (rnd() * 2 - 1) * 55,
      s: 0.40 + rnd() * 0.76,            // nominal height 48..139px
      rot: (rnd() * 2 - 1) * 0.55,
      tone: i % 2,
      bend: (rnd() * 2 - 1) * 14,        // stalk lean, px at the top
      ph: i * 2.399963,                  // golden-angle phase stagger
      dots: (i % 3 === 0) ? 3 : ((i % 3 === 1) ? 2 : 0),
      flip: (i % 4 === 3) ? -1 : 1
    });
  }
  for (i = 0; i < 4; i++) {
    bx = 0; by = 0; ok = false;
    for (tries = 0; tries < 40 && !ok; tries++) {
      bx = 40 + rnd() * 560; by = 40 + rnd() * 370; ok = true;
      for (j = 0; j < FIDS.length; j++) {
        dx = bx - FIDS[j].x; dy = by - FIDS[j].y;
        if (dx * dx + dy * dy < 60 * 60) { ok = false; break; }
      }
    }
    BFS.push({
      x: bx, y: by,
      s: 0.8 + rnd() * 0.5,
      rot: (rnd() * 2 - 1) * 0.7,
      ph: rnd() * Math.PI * 2,
      fl: 8,                             // wing flaps per loop
      bob: (i % 3) + 2,                  // bob cycles per loop
      sc: 1.2 + rnd() * 1.0              // breeze scatter factor
    });
  }
})();
(function () {
  var i, h, bScreen;
  if (Object.keys(PAL).length !== 5) throw new Error('palette must hold exactly five colours');
  if (FIDS.length !== 10) throw new Error('need exactly 10 fiddleheads per tile');
  if (BFS.length !== 4) throw new Error('need exactly 4 butterflies per tile');
  if (FIDS.length * (DW / PW) * (DH / PH) !== 40) throw new Error('need exactly 40 fiddleheads per screen');
  bScreen = BFS.length * (DW / PW) * (DH / PH);
  if (bScreen < 12 || bScreen > 20) throw new Error('butterflies per screen must be 12..20');
  for (i = 0; i < FIDS.length; i++) {
    h = BASE_H * FIDS[i].s;
    if (h < 40 || h > 140) throw new Error('fiddlehead scale out of the 40..140px range');
  }
})();

// ---- arching fronds ----------------------------------------------
// Two large fronds arch from the bottom corners; two
// smaller ones sit behind them toward the middle so their
// arches still cross the narrow phone crop.
var FRONDS = [
  { bx: 452,  by: 972, L: 540, h0: -Math.PI / 2 + 0.26, bend: 0.80,  curl: 2.6,  leaf: 50, w: 3.4, tone: 1 },
  { bx: 828,  by: 972, L: 540, h0: -Math.PI / 2 - 0.26, bend: -0.80, curl: -2.6, leaf: 50, w: 3.4, tone: 1 },
  { bx: 90,   by: 958, L: 790, h0: -Math.PI / 2 + 0.52, bend: 1.32,  curl: 3.4,  leaf: 64, w: 4.2, tone: 0 },
  { bx: 1190, by: 958, L: 790, h0: -Math.PI / 2 - 0.52, bend: -1.32, curl: -3.4, leaf: 64, w: 4.2, tone: 0 }
];

// ---- phase ---------------------------------------------------------
function phase() { return (((T % LOOP) + LOOP) % LOOP) / LOOP; }

// ---- leaf shapes ---------------------------------------------------
// Smooth pointed leaf (young pinna) for the fiddleheads.
function leaf(x, y, dir, len, wid, fill) {
  var c = Math.cos(dir), s = Math.sin(dir), px = -s, py = c;
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + c * len * 0.5 + px * wid, y + s * len * 0.5 + py * wid, x + c * len, y + s * len);
  ctx.quadraticCurveTo(x + c * len * 0.5 - px * wid, y + s * len * 0.5 - py * wid, x, y);
  ctx.fill();
}
// Serrated leaflet for the arching fronds: a zigzag edge
// profile with a darker midrib.
var SERR = [[0, 0], [0.22, 0.52], [0.36, 0.30], [0.55, 0.46], [0.68, 0.24], [0.85, 0.30], [1, 0]];
function serrLeaf(x, y, dir, len, wid, fill) {
  var c = Math.cos(dir), s = Math.sin(dir), px = -s, py = c, i, a, w;
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (i = 1; i < SERR.length; i++) {
    a = SERR[i][0] * len; w = SERR[i][1] * wid;
    ctx.lineTo(x + c * a + px * w, y + s * a + py * w);
  }
  for (i = SERR.length - 2; i >= 0; i--) {
    a = SERR[i][0] * len; w = SERR[i][1] * wid;
    ctx.lineTo(x + c * a - px * w, y + s * a - py * w);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = PAL.fernB;
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + c * len * 0.96, y + s * len * 0.96);
  ctx.stroke();
}

// ---- fiddlehead ------------------------------------------------------
// Built in two parts. The stalk is a quadratic curve from
// the anchor, carrying leaflet pairs that grow toward its
// top. The coil is an explicit Archimedean spiral joined
// at the stalk top: u shortens the stalk and winds the
// coil to just over two turns at u = 0.2, and lengthens
// the stalk while opening the coil to a loose hook at
// u = 1.0. Tiny pinnae hug the first part of the coil,
// and gold spore dots gather at the coil centre. The
// stem is stroked in two passes, dark stalk and a
// lighter, thicker coil, so the spiral reads.
function drawFiddlehead(f, u, ax, ay) {
  var Hh = BASE_H * f.s;
  var Ls = Hh * (0.40 + 0.38 * u);
  var R = Hh * (0.36 - 0.13 * u);
  var turns = 2.3 - 1.2 * u;
  var cr = Math.cos(f.rot), sr = Math.sin(f.rot);
  var pts = [], i, t;
  function W(lx, ly) {
    var mx = f.flip < 0 ? -lx : lx;
    var hN = Math.max(0, Math.min(1, -ly / Hh));
    var bf = Math.pow(hN, 1.5) * 0.9;
    return [ax + cr * mx - sr * ly + breezeX * bf, ay + sr * mx + cr * ly + breezeY * bf];
  }
  var NS = 10, mt, lx, ly;
  for (i = 0; i <= NS; i++) {
    t = i / NS; mt = 1 - t;
    lx = 2 * mt * t * f.bend * 0.4 + t * t * f.bend;
    ly = -(2 * mt * t * Ls * 0.55 + t * t * Ls);
    pts.push(W(lx, ly));
  }
  var NC = 42, th, rr;
  var cxC = f.bend + R, cyC = -Ls;
  for (i = 1; i <= NC; i++) {
    t = i / NC;
    th = Math.PI + turns * 2 * Math.PI * t;
    rr = R * (1 - 0.62 * t);
    pts.push(W(cxC + rr * Math.cos(th), cyC + rr * Math.sin(th)));
  }
  var prim = f.tone ? PAL.fernB : PAL.fernA;
  var alt = f.tone ? PAL.fernA : PAL.fernB;
  var p, q, sa, prof, len, fill;
  for (i = 2; i <= NS - 3; i++) {
    t = i / NS;
    p = pts[i]; q = pts[i + 1];
    sa = Math.atan2(q[1] - p[1], q[0] - p[0]);
    prof = Math.pow(Math.sin(Math.PI * (0.2 + 0.65 * t)), 0.8);
    len = Hh * 0.155 * prof;
    if (len < 2) continue;
    fill = (i % 2 === 0) ? alt : prim;
    leaf(p[0], p[1], sa - 1.0, len, len * 0.36, fill);
    leaf(p[0], p[1], sa + 1.0, len, len * 0.36, fill);
  }
  var cW = W(cxC, cyC), dOut;
  for (i = NS + 5; i <= NS + 15; i += 5) {
    p = pts[i];
    dOut = Math.atan2(p[1] - cW[1], p[0] - cW[0]);
    leaf(p[0], p[1], dOut, Hh * 0.035, Hh * 0.013, prim);
  }
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = PAL.fernB;
  ctx.lineWidth = Math.max(1.2, 3.2 * f.s);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i <= NS; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  ctx.strokeStyle = PAL.fernA;
  ctx.lineWidth = Math.max(1.4, 4.8 * f.s);
  ctx.beginPath();
  ctx.moveTo(pts[NS][0], pts[NS][1]);
  for (i = NS + 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  if (f.dots > 0) {
    var da;
    ctx.fillStyle = PAL.gold;
    for (i = 0; i < f.dots; i++) {
      da = i * 2.4 + f.ph;
      ctx.beginPath();
      ctx.arc(cW[0] + Math.cos(da) * 4.5 * f.s, cW[1] + Math.sin(da) * 4.5 * f.s, 1.7 * f.s + 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ---- arching frond ---------------------------------------------------
// A procedural walk: the heading bends over the length
// of the frond and curls into a small crozier at the
// tip. Serrated leaflet pairs follow the stem, growing
// then easing as the curl takes over.
function drawFrond(fr) {
  var n = 46, i, t, cs, ang, dl;
  var pts = [], x = fr.bx, y = fr.by;
  for (i = 0; i <= n; i++) {
    t = i / n;
    var bf = Math.pow(t, 1.5) * 1.05;
    pts.push([x + breezeX * bf, y + breezeY * bf]);
    cs = t < 0.8 ? 0 : (t - 0.8) / 0.2;
    ang = fr.h0 + fr.bend * Math.pow(t, 1.7) + fr.curl * cs * cs;
    dl = (fr.L / n) * (1 - 0.4 * t);
    x += Math.cos(ang) * dl;
    y += Math.sin(ang) * dl;
  }
  var prim = fr.tone ? PAL.fernB : PAL.fernA;
  var alt = fr.tone ? PAL.fernA : PAL.fernB;
  var p, q, sa, shrink, len, fill;
  for (i = 5; i <= 40; i++) {
    t = i / n;
    p = pts[i]; q = pts[i + 1];
    sa = Math.atan2(q[1] - p[1], q[0] - p[0]);
    shrink = 1 - 0.5 * Math.max(0, (t - 0.6) / 0.4);
    len = fr.leaf * Math.pow(Math.sin(Math.PI * (0.10 + 0.78 * t)), 0.7) * shrink;
    if (len < 3) continue;
    fill = (i % 3 === 0) ? alt : prim;
    serrLeaf(p[0], p[1], sa - 1.02, len, len * 0.30, fill);
    serrLeaf(p[0], p[1], sa + 1.02, len, len * 0.30, fill);
  }
  ctx.strokeStyle = PAL.fernB;
  ctx.lineWidth = fr.w;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i <= n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  ctx.fillStyle = PAL.gold;
  ctx.beginPath();
  ctx.arc(pts[n][0], pts[n][1], 2.2, 0, Math.PI * 2);
  ctx.fill();
}

// ---- butterfly ---------------------------------------------------------
function wingPair(cx, cy, rx, ry, ra) {
  ctx.save();
  ctx.translate(-cx, cy); ctx.rotate(ra);
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-ra);
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawButterfly(b, ax, ay, ph) {
  var flap = 0.5 + 0.5 * Math.sin(2 * Math.PI * b.fl * ph + b.ph);
  var sq = 0.40 + 0.60 * flap;
  var bobY = 3 * Math.sin(2 * Math.PI * b.bob * ph + b.ph);
  ctx.save();
  ctx.translate(ax, ay + bobY);
  ctx.rotate(b.rot);
  ctx.scale(b.s * sq, b.s);
  ctx.fillStyle = PAL.cream;
  wingPair(7.5, -2, 8, 5, 0.45);
  wingPair(5, 4.5, 5.5, 4, 0.30);
  ctx.beginPath(); ctx.ellipse(0, 0.5, 2.1, 6.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -6, 1.9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAL.gold;
  ctx.beginPath(); ctx.arc(-8, -3, 1.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -3, 1.3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = PAL.cream;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -7); ctx.lineTo(-3.5, -11);
  ctx.moveTo(0, -7); ctx.lineTo(3.5, -11);
  ctx.stroke();
  ctx.restore();
}

// ---- field --------------------------------------------------------------
function drawField() {
  var ph = phase();
  var cx, cy, xoff, yoff, drop, i, f, b, ax, ay, bx, by, u;
  for (cx = -1; cx <= 2; cx++) {
    drop = (((cx % 2) + 2) % 2 !== 0) ? PH / 2 : 0;
    for (cy = -1; cy <= 2; cy++) {
      xoff = cx * PW; yoff = cy * PH + drop;
      for (i = 0; i < FIDS.length; i++) {
        f = FIDS[i];
        ax = xoff + f.x; ay = yoff + f.y;
        if (ax < -320 || ax > DW + 320 || ay < -320 || ay > DH + 320) continue;
        u = 0.6 + 0.4 * Math.sin(2 * Math.PI * ph + f.ph);
        drawFiddlehead(f, u, ax, ay);
      }
      for (i = 0; i < BFS.length; i++) {
        b = BFS[i];
        bx = xoff + b.x + breezeX * b.sc;
        by = yoff + b.y + breezeY * b.sc;
        if (bx < -320 || bx > DW + 320 || by < -320 || by > DH + 320) continue;
        drawButterfly(b, bx, by, ph);
      }
    }
  }
}

// ---- drawing ---------------------------------------------------------------
function draw() {
  var i;
  ctx.fillStyle = PAL.ground;
  ctx.fillRect(0, 0, DW, DH);
  for (i = 0; i < FRONDS.length; i++) drawFrond(FRONDS[i]);
  drawField();
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag is a breeze -----------------------------------------------------
var dragging = false, lastPX = 0, lastPY = 0, lastPT = 0, velX = 0, velY = 0;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true;
  lastPX = p.x; lastPY = p.y; lastPT = e.timeStamp;
  velX = 0; velY = 0;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dt = Math.max(16, e.timeStamp - lastPT) / 1000;
  velX = velX * 0.55 + ((p.x - lastPX) / dt) * 0.45;
  velY = velY * 0.55 + ((p.y - lastPY) / dt) * 0.45;
  lastPX = p.x; lastPY = p.y; lastPT = e.timeStamp;
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK;
    acc -= TICK; guard++;
  }
  if (guard === 4) acc = 0;
  // breeze: chase the pointer velocity while dragging,
  // spring back to exactly zero on release.
  if (dragging && time - lastPT > 90) { velX *= 0.85; velY *= 0.85; }
  var tx = 0, ty = 0, m;
  if (dragging) {
    tx = velX * 0.055; ty = velY * 0.055;
    m = Math.sqrt(tx * tx + ty * ty);
    if (m > 120) { tx *= 120 / m; ty *= 120 / m; }
  }
  var a = 1 - Math.exp(-(dragging ? 7 : 2.4) * dt);
  breezeX += (tx - breezeX) * a;
  breezeY += (ty - breezeY) * a;
  if (!dragging && Math.abs(breezeX) < 0.02 && Math.abs(breezeY) < 0.02) {
    breezeX = 0; breezeY = 0;
  }
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
