<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centrifugal</title>
<style>
html, body { margin: 0; padding: 0; background: #6B1A12; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#6B1A12';
var CREAM = '#F2E6C9';
var GOLD = '#C9A227';
var BLACK = '#14100C';
var PINK = '#E8A0A8';
var HOTRED = '#D81F1F';
var DARKOX = '#4A100B';
var SEED = 1637007;
/* Frame one is at t = 14 s: the violence cycle (48 s) is past calm and
   climbing toward its roar peak at t = 24 s, so the vortex is already
   developed and strokes are mid-flight. */
var PHASE = 14;
var CYCLE = 48;
/* Fixed authored storm table. Tap deals the next storm in order; a
   reseed is a new storm, never a reload. Storm 0 loads at frame one. */
var STORMS = [
  { mult: 0.90, seed: 1637007 },
  { mult: 0.55, seed: 1637113 },
  { mult: 1.35, seed: 1637221 },
  { mult: 0.70, seed: 1637333 },
  { mult: 1.15, seed: 1637441 }
];
var N_STROKES = 96;
var N_STREAKS = 26;
var N_GRAIN = 260;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function frac(v) { return v - Math.floor(v); }
function smoothstep(a, b, x) {
  var t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var CREAM_RGB = hexRgb(CREAM);
var GOLD_RGB = hexRgb(GOLD);
var BLACK_RGB = hexRgb(BLACK);
var PINK_RGB = hexRgb(PINK);
var HOTRED_RGB = hexRgb(HOTRED);
var GROUND_RGB = hexRgb(GROUND);
var DARKOX_RGB = hexRgb(DARKOX);
var PALETTE = [
  { rgb: CREAM_RGB, w: 0.30 },
  { rgb: GOLD_RGB, w: 0.22 },
  { rgb: BLACK_RGB, w: 0.25 },
  { rgb: PINK_RGB, w: 0.12 },
  { rgb: HOTRED_RGB, w: 0.11 }
];
function pickColor(rng) {
  var x = rng(), i;
  for (i = 0; i < PALETTE.length; i++) {
    x -= PALETTE[i].w;
    if (x <= 0) return PALETTE[i].rgb;
  }
  return PALETTE[0].rgb;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Field-like composition: full-bleed on phones and desktop, the spin
   has nowhere to escape. Vortex sits slightly off-center. */
function compRect() {
  return { x: 0, y: 0, w: VW, h: VH };
}
function vortex() {
  return { cx: VW * 0.54, cy: VH * 0.46, R: 0.58 * Math.max(VW, VH) };
}
/* ---- violence: slow 48 s cycle, calm gyre to roar and back ---- */
function cyc(t) { return 0.5 - 0.5 * Math.cos(TAU * t / CYCLE); }
var taps = [];
var stormIdx = 0;
function multAt(t) {
  var m = STORMS[0].mult, i;
  for (i = 0; i < taps.length; i++) if (taps[i].t <= t) m = taps[i].mult;
  return m;
}
function violence(t) { return multAt(t) * (0.45 + 0.55 * cyc(t)); }
/* S(t) is the closed-form integral of the base spin rate
   1.4 - 0.4 cos(2 pi t / 48): 1.4 t - (0.4 * 48 / 2 pi) sin(...). */
var S_K = 0.4 * CYCLE / TAU;
function S(t) { return 1.4 * t - S_K * Math.sin(TAU * t / CYCLE); }
/* Spin phase as a pure function of piece time and the recorded taps:
   each tap switches the storm multiplier, the phase stays continuous. */
function spinPhase(t) {
  var ph = 0, t0 = 0, m = STORMS[0].mult, i;
  for (i = 0; i < taps.length; i++) {
    var tt = taps[i].t;
    if (tt > t) break;
    ph += m * (S(tt) - S(t0));
    t0 = tt; m = taps[i].mult;
  }
  ph += m * (S(t) - S(t0));
  return ph;
}
/* ---- stroke field: built from a fixed seed, never Math.random ---- */
var strokes = [];
var streaks = [];
var grain = [];
function buildField(seed) {
  var rng = mulberry32(seed);
  var i, j;
  strokes = [];
  for (i = 0; i < N_STROKES; i++) {
    var g = [];
    var ng = 3 + Math.floor(rng() * 3);
    for (j = 0; j < ng; j++) g.push({ f: rng(), d: (rng() * 2 - 1) * 0.5, lite: rng() < 0.5 });
    strokes.push({
      th0: rng() * TAU,
      om: 0.12 + rng() * 0.33,
      off: rng(),
      inRate: 0.008 + rng() * 0.012,
      span: 0.5 + rng() * 0.9,
      wobAmp: 0.005 + rng() * 0.010,
      wobFreq: 1 + Math.floor(rng() * 2),
      wobPh: rng() * TAU,
      w: 2.5 + rng() * 5.0,
      alpha: 0.45 + rng() * 0.4,
      rgb: pickColor(rng),
      grain: g
    });
  }
  var rng2 = mulberry32(seed + 5);
  streaks = [];
  for (i = 0; i < N_STREAKS; i++) {
    streaks.push({
      th0: rng2() * TAU,
      om: 0.05 + rng2() * 0.10,
      r0: 0.35 + rng2() * 0.25,
      r1: 0.95 + rng2() * 0.20,
      w: 1.5 + rng2() * 3.0,
      alpha: 0.25 + rng2() * 0.35,
      bend: (rng2() * 2 - 1) * 0.35
    });
  }
  var rng3 = mulberry32(seed + 9);
  grain = [];
  for (i = 0; i < N_GRAIN; i++) {
    grain.push({
      x: rng3(), y: rng3(),
      s: 1 + Math.floor(rng3() * 2),
      lite: rng3() < 0.5,
      a: 0.05 + rng3() * 0.07
    });
  }
}
buildField(STORMS[0].seed);
/* ---- tap: deal the next storm from the fixed table ---- */
var downX = 0, downY = 0, downT = 0;
function onPointerDown(e) {
  downX = e.clientX; downY = e.clientY; downT = lastT;
}
function onPointerUp(e) {
  var dx = e.clientX - downX, dy = e.clientY - downY;
  if (Math.sqrt(dx * dx + dy * dy) > 12) return;
  stormIdx = (stormIdx + 1) % STORMS.length;
  taps.push({ t: downT, mult: STORMS[stormIdx].mult });
  buildField(STORMS[stormIdx].seed);
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', function () { downX = 0; downY = 0; });
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
/* ---- drawing ---- */
function drawGround(rect) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var i, g;
  for (i = 0; i < grain.length; i++) {
    g = grain[i];
    ctx.fillStyle = rgba(g.lite ? [138, 42, 26] : DARKOX_RGB, g.a);
    ctx.fillRect(g.x * rect.w, g.y * rect.h, g.s, g.s);
  }
}
function drawStreaks(t, v) {
  var i, s, k, f, ang, rr, x, y;
  ctx.lineCap = 'round';
  for (i = 0; i < streaks.length; i++) {
    s = streaks[i];
    ang = s.th0 + s.om * spinPhase(t);
    ctx.strokeStyle = rgba(BLACK_RGB, s.alpha * (0.6 + 0.4 * clamp(v, 0, 1)));
    ctx.lineWidth = s.w * (Math.min(VW, VH) / 720);
    ctx.beginPath();
    for (k = 0; k <= 5; k++) {
      f = k / 5;
      rr = v.R * (s.r0 + (s.r1 - s.r0) * f);
      x = v.cx + rr * Math.cos(ang + s.bend * f);
      y = v.cy + rr * Math.sin(ang + s.bend * f);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}
/* Point along a stroke at fraction f: angle advances with the span,
   radius spirals inward and wobbles on a seeded sine, so the stroke
   reads as a flung brush mark, never a concentric ring. */
function strokeXY(s, f, th, r, v, roff, span) {
  var ang = th + span * f;
  var rr = r * (1 - 0.22 * f) + roff
    + s.wobAmp * v.R * Math.sin(s.wobFreq * TAU * f + s.wobPh);
  return [v.cx + rr * Math.cos(ang), v.cy + rr * Math.sin(ang)];
}
function drawStroke(s, t, v, vn) {
  var K = 14, k, b, f, x, y, pt;
  var th = s.th0 + s.om * spinPhase(t);
  var p = frac(s.off + t * s.inRate);
  var r = v.R * (0.12 + 0.95 * (1 - p));
  var span = s.span * (0.7 + 0.5 * vn);
  var fade = smoothstep(0, 0.08, p) * (1 - smoothstep(0.85, 1, p));
  var a = s.alpha * (0.55 + 0.45 * vn) * fade;
  if (a < 0.01) return;
  var u = Math.min(VW, VH) / 720;
  ctx.lineCap = 'round';
  /* Bristle split: one heavy pass plus two thinner offset passes, so
     the stroke reads as a loaded brush, not a vector line. */
  for (b = -1; b <= 1; b++) {
    var roff = b * s.w * 0.32 * u;
    var bw = Math.max(0.8, s.w * u * (b === 0 ? 1 : 0.55));
    var ba = a * (b === 0 ? 1 : 0.5);
    ctx.strokeStyle = rgba(s.rgb, ba);
    ctx.lineWidth = bw;
    ctx.beginPath();
    for (k = 0; k <= K; k++) {
      f = k / K;
      pt = strokeXY(s, f, th, r, v, roff, span);
      if (k === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
    }
    ctx.stroke();
  }
  /* Grain flecks along the stroke, small flat rects. */
  for (k = 0; k < s.grain.length; k++) {
    var g = s.grain[k];
    pt = strokeXY(s, g.f, th, r, v, g.d * s.w * u, span);
    ctx.fillStyle = rgba(g.lite ? CREAM_RGB : DARKOX_RGB, 0.22 * fade);
    ctx.fillRect(pt[0] - 1, pt[1] - 1, 2, 2);
  }
}
function drawCore(t, v) {
  var u = Math.min(VW, VH) / 720;
  var coreR = 0.075 * Math.min(VW, VH);
  var i, ang;
  /* Hot red core with a red ring, tight cream arcs orbiting it. */
  ctx.fillStyle = HOTRED;
  ctx.beginPath();
  ctx.moveTo(v.cx + coreR, v.cy);
  ctx.arc(v.cx, v.cy, coreR, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(DARKOX_RGB, 0.85);
  ctx.lineWidth = Math.max(1.5, 3 * u);
  ctx.beginPath();
  ctx.moveTo(v.cx + coreR * 1.35, v.cy);
  ctx.arc(v.cx, v.cy, coreR * 1.35, 0, TAU);
  ctx.stroke();
  ctx.strokeStyle = rgba(HOTRED_RGB, 0.9);
  ctx.lineWidth = Math.max(1, 2 * u);
  ctx.beginPath();
  ctx.moveTo(v.cx + coreR * 0.62, v.cy);
  ctx.arc(v.cx, v.cy, coreR * 0.62, 0, TAU);
  ctx.stroke();
  var sp = spinPhase(t);
  for (i = 0; i < 5; i++) {
    ang = sp * (0.9 + i * 0.12) + i * (TAU / 5);
    ctx.strokeStyle = rgba(CREAM_RGB, 0.75);
    ctx.lineWidth = Math.max(1.2, 2.5 * u);
    ctx.lineCap = 'round';
    ctx.beginPath();
    var r0 = coreR * 1.8;
    ctx.moveTo(v.cx + r0 * Math.cos(ang), v.cy + r0 * Math.sin(ang));
    ctx.arc(v.cx, v.cy, r0, ang, ang + 0.9);
    ctx.stroke();
  }
}
function drawText(rect) {
  var titlePx = isPhone ? 18 : 20;
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var titleW = ctx.measureText('Centrifugal').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 06').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = cxm - plateW / 2, plateY = rect.y + 10;
  ctx.fillStyle = CREAM;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = GROUND;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Centrifugal', cxm, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(GROUND_RGB, 0.8);
  ctx.fillText('2006 · 07 · 06', cxm, plateY + 7 + titlePx + 3);
  var hint = 'Tap to reseed the storm.';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = rect.y + rect.h - hintPlateH - 10;
  ctx.fillStyle = CREAM;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = GOLD;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(GROUND_RGB, 0.85);
  ctx.fillText(hint, cxm, hintPlateY + 7);
}
var lastT = PHASE, prevTs = null;
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  var v = vortex();
  var viol = violence(t);
  var vn = clamp(viol / 1.35, 0, 1);
  drawGround(rect);
  drawStreaks(t, v);
  var i;
  for (i = 0; i < strokes.length; i++) drawStroke(strokes[i], t, v, vn);
  drawCore(t, v);
  drawText(rect);
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    strokeCount: function () { return strokes.length; },
    streakCount: function () { return streaks.length; },
    grainCount: function () { return grain.length; },
    violence: function (t) { return violence(t); },
    storm: function () { return stormIdx; },
    stormMult: function (t) { return multAt(t); },
    drawAt: function (t) { draw(t); },
    tapAt: function (t) {
      downT = t;
      stormIdx = (stormIdx + 1) % STORMS.length;
      taps.push({ t: t, mult: STORMS[stormIdx].mult });
      buildField(STORMS[stormIdx].seed);
      return stormIdx;
    }
  };
}
/* ---- frame one: fixed phase, fixed seed, no wall clock ---- */
size();
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (prevTs === null) prevTs = ts;
    if (loop.t0 === undefined) loop.t0 = ts;
    var t = PHASE + (ts - loop.t0) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
