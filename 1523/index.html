<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Turned Gaze</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #d8d2c4; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (verbatim from the prompt).
  var FIELD = '#d8d2c4';
  var INK = '#26221e';
  var RED = '#8f2d22';
  var GOLD = '#c9a86a';
  var SHADOW = '#8a8272';

  var LOOP = 60; // seconds; one gaze loop.
  var SEED = 1523000;
  var STARTS = [8, 26, 44]; // look-back windows start at these loop-local times.
  var DUR = 6; // seconds per look-back: 1 turn-in, 3 hold, 2 turn-out.

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Target row for each of the three look-backs in loop k, drawn from a
  // stream seeded by the loop index, so every loop index is reproducible
  // and the frame at local time 0 never depends on the loop index.
  function picksForLoop(k) {
    var rng = mulberry32(SEED + k * 7919);
    var p = [];
    for (var i = 0; i < 3; i++) { p.push(Math.floor(rng() * 4)); }
    return p;
  }

  function smoothstep(x) {
    if (x <= 0) { return 0; }
    if (x >= 1) { return 1; }
    return x * x * (3 - 2 * x);
  }

  function a4(x) { return Math.round(x * 10000) / 10000; }

  function size() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number' &&
        typeof window.visualViewport.height === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' &&
               typeof window.innerWidth === 'number' &&
               typeof window.innerHeight === 'number') {
      w = window.innerWidth; h = window.innerHeight;
    } else {
      w = 720; h = 720;
    }
    return { w: w, h: h };
  }

  function isPhone(w, h) {
    var minDim = 1e9;
    if (typeof window !== 'undefined' && window.screen &&
        typeof window.screen.width === 'number' &&
        typeof window.screen.height === 'number') {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
    if (minDim < 700) { return true; }
    return h > w * 1.15;
  }

  // Layout is a pure function of the canvas size, so probes can replicate
  // it exactly. Rows: four horizontal bands, two above and two below the
  // centre mark. Eyes sit left and right of a centre gap the mark stands in.
  function layout(W, H) {
    var phone = isPhone(W, H);
    var fx, fy, fw, fh;
    if (phone) {
      fx = 0; fy = 0; fw = W; fh = H;
    } else {
      var side = Math.min(W, H);
      fx = (W - side) / 2; fy = (H - side) / 2; fw = side; fh = side;
    }
    var s = Math.max(0.7, Math.min(fw, fh) / 720);
    var cx = fx + fw / 2, cy = fy + fh / 2;
    var rowGap = fh / 7;
    var rowYs = [cy - 2 * rowGap, cy - rowGap, cy + rowGap, cy + 2 * rowGap];
    var gap = 85 * s;
    var sx = Math.max(36, Math.min(64, fw / 22));
    var x0 = fx + 0.06 * fw, x1 = fx + 0.94 * fw;
    var eyes = [];
    for (var r = 0; r < 4; r++) {
      for (var x = x0; x <= cx - gap; x += sx) { eyes.push({ x: x, y: rowYs[r], row: r }); }
      for (var xx = cx + gap; xx <= x1; xx += sx) { eyes.push({ x: xx, y: rowYs[r], row: r }); }
    }
    return { fx: fx, fy: fy, fw: fw, fh: fh, cx: cx, cy: cy, s: s, rowYs: rowYs, eyes: eyes };
  }

  // Recorded drag sessions, closed-form over piece time. A session is a
  // hold on the centre mark: while it lasts, the gaze follows the
  // pointer's row; for 1 s after release the gaze decays, then the
  // schedule resumes. A session never recurs at a later loop wrap: its
  // effect is a function of absolute piece time only.
  var drags = [];
  var active = null;
  var nowT = 0;
  var cur = null;

  function onDown(e) {
    var d = size();
    var L = layout(d.w, d.h);
    var dx = e.clientX - L.cx, dy = e.clientY - L.cy;
    var reach = 70 * L.s;
    if (dx * dx + dy * dy <= reach * reach) {
      active = { start: nowT, end: null, pts: [{ t: nowT, y: e.clientY }] };
      drags.push(active);
    }
  }
  function onMove(e) {
    if (!active) { return; }
    active.pts.push({ t: nowT, y: e.clientY });
  }
  function onUp() {
    if (active) { active.end = nowT; active = null; }
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function rowNearest(session, t) {
    var y = session.pts[0].y;
    for (var i = 0; i < session.pts.length; i++) {
      if (session.pts[i].t <= t) { y = session.pts[i].y; } else { break; }
    }
    var best = 0, bd = 1e9;
    for (var r = 0; r < 4; r++) {
      var dd = Math.abs(y - cur.rowYs[r]);
      if (dd < bd) { bd = dd; best = r; }
    }
    return best;
  }

  // Current gaze: {row, env} or null. A live or decaying drag gaze wins
  // over the schedule; otherwise the scheduled look-back applies.
  function gazeAt(t, lt, k) {
    for (var i = drags.length - 1; i >= 0; i--) {
      var s = drags[i];
      if (t < s.start) { continue; }
      if (s.end === null) {
        return { row: rowNearest(s, t), env: smoothstep((t - s.start) / 0.5) };
      }
      if (t <= s.end + 1) {
        return { row: rowNearest(s, t), env: 1 - smoothstep((t - s.end) / 1) };
      }
      break;
    }
    var picks = picksForLoop(k);
    for (var j = 0; j < 3; j++) {
      var p = lt - STARTS[j];
      if (p >= 0 && p < DUR) {
        var env = p < 1 ? smoothstep(p) : p < 4 ? 1 : 1 - smoothstep((p - 4) / 2);
        return { row: picks[j], env: env };
      }
    }
    return null;
  }

  function line(x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function draw(t) {
    nowT = t;
    var lt = ((t % LOOP) + LOOP) % LOOP; // loop-local time; t=LOOP is t=0 exactly.
    var k = Math.floor(t / LOOP);
    var d = size();
    var W = d.w, H = d.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var L = layout(W, H);
    cur = L;
    var s = L.s;

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    var g = gazeAt(t, lt, k);

    // Eye-marks: an open arc with a dot. By default every dot is offset
    // toward the centre mark (staring at it). While its row is looked
    // back at, the dot slides to the opposite side: the row looks away,
    // then returns as the envelope falls.
    var er = 9 * s;
    var ds = Math.max(2, 4 * s);
    ctx.lineWidth = Math.max(1.5, 2 * s);
    ctx.strokeStyle = INK;
    for (var ei = 0; ei < L.eyes.length; ei++) {
      var e = L.eyes[ei];
      ctx.beginPath();
      ctx.moveTo(e.x - er, e.y);
      ctx.arc(e.x, e.y, er, Math.PI, 2 * Math.PI);
      ctx.stroke();
      var vx = L.cx - e.x, vy = L.cy - e.y;
      var vl = Math.sqrt(vx * vx + vy * vy) || 1;
      var ux = vx / vl, uy = vy / vl;
      var env = (g && g.row === e.row) ? g.env : 0;
      var ox = ux * 2.8 * s * (1 - env) + (-ux) * 3.2 * s * env;
      var oy = uy * 2.8 * s * (1 - env) + (-uy) * 3.2 * s * env;
      ctx.fillStyle = INK;
      ctx.fillRect(e.x + ox - ds / 2, e.y + oy - ds / 2, ds, ds);
    }

    // Centre dancer-mark: torso line, arm lines, leg lines, head-arc.
    // The head-arc tilts with the gaze: neutral level, tipped one way for
    // a row above, the other way for a row below, by the gaze envelope.
    var cx = L.cx, cy = L.cy;
    var headY = cy - 38 * s, hr = 10 * s;
    var tilt = 0;
    if (g && g.env > 0) {
      tilt = (L.rowYs[g.row] > cy ? 0.5 : -0.5) * g.env;
    }
    ctx.strokeStyle = RED;
    ctx.lineWidth = Math.max(2, 3 * s);
    ctx.lineCap = 'round';
    line(cx, cy - 26 * s, cx, cy + 26 * s);
    line(cx, cy - 16 * s, cx - 16 * s, cy - 4 * s);
    line(cx, cy - 16 * s, cx + 16 * s, cy - 4 * s);
    line(cx, cy + 26 * s, cx - 14 * s, cy + 48 * s);
    line(cx, cy + 26 * s, cx + 14 * s, cy + 48 * s);
    var mid = -Math.PI / 2 + tilt;
    var a0 = mid - 1.1, a1 = mid + 1.1;
    ctx.beginPath();
    ctx.moveTo(cx + hr * Math.cos(a0), headY + hr * Math.sin(a0));
    ctx.arc(cx, headY, hr, a0, a1);
    ctx.stroke();
    ctx.fillStyle = SHADOW;
    ctx.fillRect(cx - 20 * s, cy + 54 * s, 40 * s, 3);

    // Gaze line: thin, faint gold, drawn only during a look-back, from
    // the head's edge to the target row's centreline.
    if (g && g.env > 0) {
      var rowY = L.rowYs[g.row];
      var yStart = rowY > cy ? headY + hr : headY - hr;
      ctx.strokeStyle = GOLD;
      ctx.lineWidth = 2;
      ctx.globalAlpha = a4(0.85 * g.env);
      line(cx, yStart, cx, rowY);
      ctx.globalAlpha = 1;
    }
  }

  function onResize() { draw(nowT); }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', onResize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  }

  // Synchronous first frame at a constant phase.
  draw(0);

  // rAF loop as a plain function declaration. The first rAF call anchors
  // the clock; frame one never comes from elapsed time derived elsewhere.
  var t0 = null;
  function loop(ts) {
    if (t0 === null) { t0 = ts; }
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
