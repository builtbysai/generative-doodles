<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Delete the Base</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4F1E8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function phase(t, a, b) { return clamp01((t - a) / (b - a)); }
function cross(ax, ay, bx, by) { return ax * by - ay * bx; }
function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ---- Bonner's polygonal technique on the 4.8.8 base ------------------
// Octagons (n=8) on a square lattice, squares (n=4) in the diagonal
// gaps. From every edge midpoint, two rays leave into each adjacent
// polygon at the mode angle for that polygon's edge count (median:
// 90 - 180/n). Each ray is clipped to its own polygon; the chords are
// the pattern. Crossings are computed, never faked, and the weave
// alternates over/under along each ribbon.
function modeAngle(n, mode) {
  var step = 180 / n;
  if (mode === 'acute') return 90 - step - step * 0.5;
  if (mode === 'obtuse') return 90 - step + step * 0.5;
  return 90 - step;                      // median
}

var polys = [], edges = [], segs = [], crossings = [], panel = null;
var AP = Math.cos(Math.PI / 8), SIDE = 2 * Math.sin(Math.PI / 8);
var LUNIT = 2 * AP + SIDE;               // centre spacing when R = 1

function polyPts(cx, cy, n, R, rot) {
  var pts = [], k, a;
  for (k = 0; k < n; k++) {
    a = rot + k * 2 * Math.PI / n;
    pts.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R]);
  }
  return pts;
}
function rayHit(mx, my, dx, dy, pts) {
  var best = Infinity, i, A, B, ex, ey, den, u, v;
  for (i = 0; i < pts.length; i++) {
    A = pts[i]; B = pts[(i + 1) % pts.length];
    ex = B[0] - A[0]; ey = B[1] - A[1];
    den = cross(dx, dy, ex, ey);
    if (Math.abs(den) < 1e-9) continue;
    u = cross(A[0] - mx, A[1] - my, ex, ey) / den;
    v = cross(A[0] - mx, A[1] - my, dx, dy) / den;
    if (u > 1e-6 && v >= -1e-9 && v <= 1 + 1e-9 && u < best) best = u;
  }
  return best;
}

function build() {
  polys = []; edges = []; segs = []; crossings = [];
  if (!W || !H) return;
  var side = Math.min(W, H) * 0.90;
  panel = { x: (W - side) / 2, y: (H - side) / 2, s: side };
  var L = side / 3.1;
  var R = L / LUNIT, Rsq = SIDE * R / Math.SQRT2;
  var cx = W / 2, cy = H / 2, i, j;
  var reach = side / 2 + L * 0.75;
  for (i = -3; i <= 3; i++) for (j = -3; j <= 3; j++) {
    var ox = cx + i * L, oy = cy + j * L;
    if (Math.abs(ox - cx) < reach && Math.abs(oy - cy) < reach)
      polys.push({ pts: polyPts(ox, oy, 8, R, Math.PI / 8), n: 8, cx: ox, cy: oy });
    var sx = ox + L / 2, sy = oy + L / 2;
    if (Math.abs(sx - cx) < reach && Math.abs(sy - cy) < reach)
      polys.push({ pts: polyPts(sx, sy, 4, Rsq, 0), n: 4, cx: sx, cy: sy });
  }
  // unique edges, each tagged with its polygons
  var emap = {};
  polys.forEach(function (p, pi) {
    p.pts.forEach(function (A, k) {
      var B = p.pts[(k + 1) % p.pts.length];
      var key = [A, B].map(function (P) { return Math.round(P[0] * 2) + ',' + Math.round(P[1] * 2); }).sort().join('|');
      if (!emap[key]) { emap[key] = { a: A, b: B, polys: [] }; edges.push(emap[key]); }
      if (emap[key].polys.indexOf(pi) < 0) emap[key].polys.push(pi);
    });
  });
  // rays: two per midpoint per adjacent polygon, median angles
  polys.forEach(function (p, pi) {
    var beta = modeAngle(p.n, 'median') * Math.PI / 180;
    p.pts.forEach(function (A, k) {
      var B = p.pts[(k + 1) % p.pts.length];
      var mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
      var tx = B[0] - A[0], ty = B[1] - A[1], tl = Math.hypot(tx, ty);
      tx /= tl; ty /= tl;
      var nx = p.cx - mx, ny = p.cy - my, nl = Math.hypot(nx, ny);
      nx /= nl; ny /= nl;
      [1, -1].forEach(function (sgn) {
        var dx = Math.cos(beta) * sgn * tx + Math.sin(beta) * nx;
        var dy = Math.cos(beta) * sgn * ty + Math.sin(beta) * ny;
        var u = rayHit(mx, my, dx, dy, p.pts);
        if (isFinite(u))
          segs.push({ x1: mx, y1: my, x2: mx + dx * u, y2: my + dy * u,
                      poly: pi, hero: false, cross: [] });
      });
    });
  });
  // hero ribbon: the star woven inside the octagon nearest the centre
  var bestD = Infinity, heroPoly = -1;
  polys.forEach(function (p, pi) {
    if (p.n !== 8) return;
    var d = Math.hypot(p.cx - cx, p.cy - cy);
    if (d < bestD) { bestD = d; heroPoly = pi; }
  });
  segs.forEach(function (s) { s.hero = (s.poly === heroPoly); });
  // crossings: pairs inside the same (convex) polygon only
  var byPoly = {};
  segs.forEach(function (s, si) { (byPoly[s.poly] = byPoly[s.poly] || []).push(si); });
  Object.keys(byPoly).forEach(function (pk) {
    var list = byPoly[pk], a, b, i2, j2;
    for (a = 0; a < list.length; a++) for (b = a + 1; b < list.length; b++) {
      i2 = list[a]; j2 = list[b];
      var s1 = segs[i2], s2 = segs[j2];
      if ((s1.x1 === s2.x1 && s1.y1 === s2.y1) || (s1.x1 === s2.x2 && s1.y1 === s2.y2) ||
          (s1.x2 === s2.x1 && s1.y2 === s2.y1) || (s1.x2 === s2.x2 && s1.y2 === s2.y2)) continue;
      var d1x = s1.x2 - s1.x1, d1y = s1.y2 - s1.y1;
      var d2x = s2.x2 - s2.x1, d2y = s2.y2 - s2.y1;
      var den = cross(d1x, d1y, d2x, d2y);
      if (Math.abs(den) < 1e-9) continue;
      var u = cross(s2.x1 - s1.x1, s2.y1 - s1.y1, d2x, d2y) / den;
      var v = cross(s2.x1 - s1.x1, s2.y1 - s1.y1, d1x, d1y) / den;
      if (u > 0.03 && u < 0.97 && v > 0.03 && v < 0.97) {
        var ci = crossings.length;
        crossings.push({ a: i2, b: j2, ua: u, ub: v,
                         x: s1.x1 + d1x * u, y: s1.y1 + d1y * u });
        s1.cross.push(ci); s2.cross.push(ci);
      }
    }
  });
  // over/under: crossings alternate along each ribbon by their order
  // along the strand; the strand whose turn it is goes over. When both
  // strands claim the same state, strand a goes over.
  segs.forEach(function (s, si) {
    var arr = s.cross.map(function (ci) {
      var c = crossings[ci];
      return { ci: ci, u: (c.a === si) ? c.ua : c.ub };
    });
    arr.sort(function (p, q) { return p.u - q.u; });
    arr.forEach(function (e, ord) {
      if (crossings[e.ci].a === si) crossings[e.ci].ordA = ord;
      else crossings[e.ci].ordB = ord;
    });
  });
  crossings.forEach(function (c) {
    var aOver = (c.ordA % 2 === 0), bOver = (c.ordB % 2 === 0);
    c.overA = (aOver === bOver) ? true : aOver;
  });
  panel.L = L; panel.ribbonW = Math.max(3, L * 0.052);
}

function strokePartial(x1, y1, x2, y2, f) {
  if (f <= 0) return;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 + (x2 - x1) * f, y1 + (y2 - y1) * f);
  ctx.stroke();
}


function segLen(s) { return Math.hypot(s.x2 - s.x1, s.y2 - s.y1); }
function strokeRange(s, a, b) {
  var len = segLen(s);
  if (len === 0 || b - a <= 0.01) return;
  var ux = (s.x2 - s.x1) / len, uy = (s.y2 - s.y1) / len;
  ctx.beginPath();
  ctx.moveTo(s.x1 + ux * a, s.y1 + uy * a);
  ctx.lineTo(s.x1 + ux * b, s.y1 + uy * b);
  ctx.stroke();
}
// Draw every ribbon, leaving a clean gap in the under-strand at each
// crossing, then lay the over-strand's local piece back across the gap.
function drawWoven(weaveF, colorOf) {
  var gapHalf = panel.ribbonW * 0.60 * weaveF;
  ctx.lineCap = 'butt';
  segs.forEach(function (s, si) {
    var len = segLen(s);
    var blocked = [];
    s.cross.forEach(function (ci) {
      var c = crossings[ci];
      var under = c.overA ? segs[c.b] : segs[c.a];
      if (under !== s) return;
      var u = (c.a === si) ? c.ua : c.ub;
      blocked.push([u * len - gapHalf, u * len + gapHalf]);
    });
    blocked.sort(function (p, q) { return p[0] - q[0]; });
    ctx.strokeStyle = colorOf(s);
    ctx.lineWidth = panel.ribbonW;
    var cur = 0;
    blocked.forEach(function (iv) {
      if (iv[0] > cur) strokeRange(s, cur, Math.min(iv[0], len));
      cur = Math.max(cur, iv[1]);
    });
    if (cur < len) strokeRange(s, cur, len);
  });
  crossings.forEach(function (c) {
    var over = c.overA ? segs[c.a] : segs[c.b];
    var len = segLen(over);
    var u = (c.overA ? c.ua : c.ub) * len;
    ctx.strokeStyle = colorOf(over);
    ctx.lineWidth = panel.ribbonW;
    strokeRange(over, u - gapHalf * 1.35, u + gapHalf * 1.35);
  });
  ctx.lineCap = 'round';
}

var LOOP = 40, OFFSET = 30;   // frame one opens mid-braid, base already gone
function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#F4F1E8'; ctx.fillRect(0, 0, W, H);
  if (!panel) return;
  var t = ((now / 1000 + OFFSET) % LOOP + LOOP) % LOOP;
  var gridP = phase(t, 0, 6);
  var contactP = phase(t, 6, 9) * (1 - phase(t, 16, 19));
  var rayP = phase(t, 9, 16);
  var baseAlpha = gridP * (1 - phase(t, 16, 21));
  var widen = phase(t, 21, 26);
  var weave = phase(t, 26, 34);
  var ribbonW = 1.6 + (panel.ribbonW - 1.6) * widen;

  ctx.save();
  ctx.beginPath();
  ctx.rect(panel.x, panel.y, panel.s, panel.s);
  ctx.clip();

  // move one and five at once: the base, drawn on, then deleted
  if (baseAlpha > 0.003) {
    ctx.strokeStyle = '#8A8A8A';
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = 0.9 * baseAlpha;
    edges.forEach(function (e, ei) {
      var f = clamp01(gridP * 1.7 - hash(ei) * 0.7);
      if (baseAlpha < 0.999) f = 1;
      strokePartial(e.a[0], e.a[1], e.b[0], e.b[1], f);
    });
    ctx.globalAlpha = 1;
  }
  // move two: contact points mark in red, then leave with the base
  if (contactP > 0.003) {
    ctx.fillStyle = '#B03A2E';
    ctx.globalAlpha = contactP;
    edges.forEach(function (e) {
      ctx.beginPath();
      ctx.arc((e.a[0] + e.b[0]) / 2, (e.a[1] + e.b[1]) / 2, 2.6, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  // moves three and four: rays grow, then widen into ribbons
  if (rayP > 0) {
    if (weave > 0 && rayP >= 1) {
      // move five: the braid, gaps opening in the under-strands
      var savedW = panel.ribbonW;
      panel.ribbonW = ribbonW;
      drawWoven(weave, function (sg) { return sg.hero ? '#B03A2E' : '#1A1A1A'; });
      panel.ribbonW = savedW;
    } else {
      ctx.lineCap = 'round';
      segs.forEach(function (sg, si) {
        var f = clamp01(rayP * 1.45 - hash(si * 3 + 7) * 0.45);
        if (f <= 0) return;
        ctx.strokeStyle = sg.hero ? '#B03A2E' : '#1A1A1A';
        ctx.lineWidth = ribbonW;
        strokePartial(sg.x1, sg.y1, sg.x2, sg.y2, f);
      });
    }
  }
  ctx.restore();

  if (t >= 38) {   // soft reset to blank tracing paper
    ctx.fillStyle = 'rgba(244,241,232,' + phase(t, 38, 40).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

resize();
draw(0);
function frame(ts) {
  draw(ts || 0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
