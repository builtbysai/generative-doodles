<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.333 At Nature's Mercy</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#121110; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.333 At Nature's Mercy (arunima-dazess-wangchuk).
// After her 2023 paint-on-net: a tall sheer grey curtain hangs
// nearly empty in a dark room, and one small mountain in heavy
// black and white impasto sits low on the fabric, tiny against
// the void. The curtain is layered translucent vertical strokes
// on this one canvas, displaced as JS data by a low-amplitude
// sine field. The mountain is thick impasto stroke data in the
// lower sixth, displaced by the SAME field sampled at its own
// position, so it moves with the cloth exactly and never drifts
// relative to the fabric. The field completes whole cycles in
// 40s (one and two cycles per component), so the frame at 40s
// is pixel-identical to frame 0: a seamless breath. Watch only:
// there is no interaction at all.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var ROOM = '#121110', GREY = '#9A958C';
var MBLACK = '#1A1815', MWHITE = '#EDE8DC';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 40;
var T = 13.0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- fixed seed table ----------------------------------------
var seed = 20261210;
function rnd() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

// ---- the breath field -----------------------------------------
// Every time term is a whole number of cycles per 40s loop, so
// the field is exactly periodic with the loop. Amplitudes stay
// low: the fabric breathes almost imperceptibly.
function fieldX(x, y, t) {
  var ph = Math.PI * 2 * t / LOOP;
  return 6.5 * Math.sin(0.011 * y + ph)
       + 4.0 * Math.sin(0.005 * x - 0.004 * y + 2 * ph + 1.7);
}
function fieldY(x, y, t) {
  var ph = Math.PI * 2 * t / LOOP;
  return 3.0 * Math.sin(0.009 * x + ph + 0.6)
       + 1.8 * Math.sin(0.013 * y - 2 * ph + 2.9);
}
function dp(x, y, t) { return [x + fieldX(x, y, t), y + fieldY(x, y, t)]; }

// ---- the curtain ----------------------------------------------
// One hanging sheet: x from CX0 to CX1, top near the frame top,
// hem near the bottom. Three layers of vertical strokes, all in
// curtain grey, differing only in width and alpha. A fold
// function of x gathers the strokes into soft vertical folds.
var CX0 = 150, CX1 = 1130, CYT = 26, CYB = 848;
function foldAt(x) {
  var u = (x - CX0) / (CX1 - CX0);
  var f = 0.5 + 0.5 * Math.sin(u * Math.PI * 7.0 + 1.3);
  var g = 0.5 + 0.5 * Math.sin(u * Math.PI * 17.0 + 4.1);
  return 0.30 + 0.70 * Math.pow(f, 1.4) * (0.75 + 0.25 * g);
}
var STROKES = [];
(function () {
  var i, x, bw;
  // Layer 0: broad sheer body bands, wide enough to overlap
  // into one continuous veil. Their endpoints are inset by
  // half the stroke width (the "in" field) so the round caps
  // terminate inside the sheet instead of scalloping its
  // top and hem edges.
  for (i = 0; i < 16; i++) {
    bw = 52 + rnd() * 34;
    x = CX0 + (i + 0.5) / 16 * (CX1 - CX0) + (rnd() - 0.5) * 22;
    STROKES.push({ x: x, w: bw, a: 0.045 + rnd() * 0.035, in: bw * 0.5,
      swayAmp: 5 + rnd() * 6, swayFreq: 0.004 + rnd() * 0.002,
      swayPh: rnd() * 6.283, top: CYT + rnd() * 8, bot: CYB - rnd() * 10 });
  }
  // Layer 1: fold threads, alpha gathered by the fold function.
  for (i = 0; i < 120; i++) {
    x = CX0 + (i + 0.5) / 120 * (CX1 - CX0) + (rnd() - 0.5) * 5;
    STROKES.push({ x: x, w: 1.6 + rnd() * 2.6, in: 0,
      a: 0.05 + foldAt(x) * 0.10 + rnd() * 0.02,
      swayAmp: 4 + rnd() * 5, swayFreq: 0.004 + rnd() * 0.003,
      swayPh: rnd() * 6.283, top: CYT + rnd() * 10, bot: CYB - rnd() * 14 });
  }
  // Layer 2: crest lights, alpha concentrated at fold crests.
  for (i = 0; i < 40; i++) {
    x = CX0 + rnd() * (CX1 - CX0);
    STROKES.push({ x: x, w: 1.1 + rnd() * 1.2, in: 0,
      a: 0.04 + 0.16 * Math.pow(foldAt(x), 2.0),
      swayAmp: 4 + rnd() * 5, swayFreq: 0.004 + rnd() * 0.003,
      swayPh: rnd() * 6.283, top: CYT + rnd() * 10, bot: CYB - rnd() * 14 });
  }
})();
if (STROKES.length !== 176) throw new Error('At Natures Mercy needs exactly 176 curtain strokes');

function drawStrokePath(pts, t) {
  var i, p;
  ctx.beginPath();
  for (i = 0; i < pts.length; i++) {
    p = dp(pts[i][0], pts[i][1], t);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
}

function drawCurtain(t) {
  var i, j, s, y, x, pts;
  ctx.strokeStyle = GREY;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (i = 0; i < STROKES.length; i++) {
    s = STROKES[i];
    pts = [];
    for (y = s.top + s.in; y <= s.bot - s.in; y += 24) {
      x = s.x + s.swayAmp * Math.sin(y * s.swayFreq + s.swayPh);
      pts.push([x, y]);
    }
    x = s.x + s.swayAmp * Math.sin((s.bot - s.in) * s.swayFreq + s.swayPh);
    pts.push([x, s.bot - s.in]);
    ctx.globalAlpha = s.a;
    ctx.lineWidth = s.w;
    drawStrokePath(pts, t);
  }
  ctx.globalAlpha = 1;
}

// ---- the mountain ----------------------------------------------
// Exactly one mountain, small and off-centre in the lower
// sixth: ridge polyline authored once, body rows lerped from
// the ridge toward the base line, texture dabs inside, white
// catch strokes offset to the lit side. Every point is drawn
// through dp(), the same field the curtain uses, sampled at
// the point's own position.
var RIDGE = [
  [352, 830], [388, 812], [418, 790], [444, 768], [466, 754],
  [492, 766], [520, 784], [548, 802], [572, 818], [590, 832]
];
var BASE_Y = 836;
var JIT = [];
(function () {
  var i;
  for (i = 0; i < RIDGE.length * 4; i++) JIT.push((rnd() - 0.5) * 5);
})();
var DABS = [];
(function () {
  var i, k, x0, y0, len;
  for (i = 0; i < 10; i++) {
    k = 1 + Math.floor(rnd() * (RIDGE.length - 2));
    x0 = RIDGE[k][0] + (rnd() - 0.5) * 10;
    y0 = RIDGE[k][1] + 9 + rnd() * 20;
    len = 14 + rnd() * 18;
    DABS.push({ x: x0, y: y0, len: len, w: 6 + rnd() * 4, a: 0.45 + rnd() * 0.3 });
  }
})();
var MOUNTAINS = [{ ridge: RIDGE, dabs: DABS }];
if (MOUNTAINS.length !== 1) throw new Error('At Natures Mercy needs exactly one mountain');

function rowPoints(f, jitOff) {
  var i, pts = [];
  for (i = 0; i < RIDGE.length; i++) {
    pts.push([RIDGE[i][0] + JIT[(jitOff + i) % JIT.length],
              RIDGE[i][1] + (BASE_Y - RIDGE[i][1]) * f + JIT[(jitOff + i + 13) % JIT.length]]);
  }
  return pts;
}

function drawMountain(t) {
  var i, pts;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // Black mass: ridge band passes with seeded jitter, then body
  // rows filling down to the base, then inner texture dabs.
  ctx.strokeStyle = MBLACK;
  var passes = [30, 22, 15];
  for (i = 0; i < passes.length; i++) {
    pts = rowPoints(i * 0.10, i * 7);
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = passes[i];
    drawStrokePath(pts, t);
  }
  ctx.globalAlpha = 0.95; ctx.lineWidth = 24; drawStrokePath(rowPoints(0.22, 21), t);
  ctx.globalAlpha = 0.95; ctx.lineWidth = 27; drawStrokePath(rowPoints(0.48, 25), t);
  ctx.globalAlpha = 0.95; ctx.lineWidth = 28; drawStrokePath(rowPoints(0.74, 29), t);
  for (i = 0; i < DABS.length; i++) {
    ctx.globalAlpha = DABS[i].a;
    ctx.lineWidth = DABS[i].w;
    drawStrokePath([[DABS[i].x, DABS[i].y], [DABS[i].x + DABS[i].len, DABS[i].y + 2]], t);
  }
  // White catches on the lit slope, offset up and to the left,
  // layered translucency only, never shadowBlur.
  ctx.strokeStyle = MWHITE;
  ctx.globalAlpha = 0.90; ctx.lineWidth = 7;
  drawStrokePath([[414, 785], [442, 763], [464, 749]], t);
  ctx.globalAlpha = 0.70; ctx.lineWidth = 5;
  drawStrokePath([[489, 761], [518, 779]], t);
  ctx.globalAlpha = 0.85; ctx.lineWidth = 6;
  drawStrokePath([[458, 752], [472, 750]], t);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, DW, DH);
  drawCurtain(T);
  drawMountain(T);
}

// ---- sizing: centred fit, page ground is the room colour -----
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
