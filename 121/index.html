<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№121 · Weight of Process</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#EFE9DC; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(28,27,24,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to gather the ellipses</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.121 Weight of Process: ellipses only, three discrete stroke weights, red fog beneath
const PAPER='#EFE9DC', INK='#1C1B18';
let reseeds=0, ellipses=[], fogs=[];
function build(sd){
  const rnd=mulberry(sd);
  ellipses=[]; fogs=[];
  const clusters=[];
  for(let i=0;i<4;i++) clusters.push([0.14+rnd()*0.72, 0.16+rnd()*0.64]);
  const N=230;
  for(let i=0;i<N;i++){
    const c=clusters[i%4];
    const ang=rnd()*Math.PI*2, rr=Math.pow(rnd(),0.6)*0.17;
    ellipses.push({
      hx:clamp(c[0]+Math.cos(ang)*rr*1.3,0.03,0.97), hy:clamp(c[1]+Math.sin(ang)*rr,0.04,0.94),
      rx:0.018+rnd()*0.075, ry:0.012+rnd()*0.05,
      rot:rnd()*Math.PI, cls:(rnd()*3)|0,
      ph:rnd()*Math.PI*2, drift:0.004+rnd()*0.010,
      pp:14+rnd()*38, rsp:0.04+rnd()*0.10
    });
  }
  for(let i=0;i<5;i++) fogs.push({x:0.1+rnd()*0.8, y:0.1+rnd()*0.8, r:0.15+rnd()*0.20, a:0.06+rnd()*0.06, ph:rnd()*6.283});
}
build(hashStr('Weight of Process'));
let ptr=null, ptrStr=0, lastTapT=-1e9;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const t=nowMs/1000, unit=Math.min(w,h);
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,w,h);
  // red fog washes settle under the ellipses
  for(const f of fogs){
    const fx=(f.x+Math.sin(t*0.030+f.ph)*0.02)*w, fy=(f.y+Math.cos(t*0.024+f.ph)*0.02)*h, fr=f.r*unit*1.5;
    const g=ctx.createRadialGradient(fx,fy,0,fx,fy,fr);
    g.addColorStop(0,'rgba(194,58,42,'+f.a.toFixed(3)+')'); g.addColorStop(1,'rgba(194,58,42,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(fx,fy,fr,0,6.2832); ctx.fill();
  }
  ptrStr+=((ptr?1:0)-ptrStr)*0.07;
  const weights=[1,2.4,4.6];
  ctx.strokeStyle=INK; ctx.globalAlpha=0.85;
  for(const e of ellipses){
    const cycT=t+e.ph*7;
    const cls=(e.cls+Math.floor(cycT/e.pp))%3;
    const cyc=(cycT%e.pp)/e.pp;
    const pulse=cyc<0.10?Math.sin(cyc/0.10*Math.PI):0;
    let ex=(e.hx+Math.sin(t*0.11+e.ph)*e.drift)*w;
    let ey=(e.hy+Math.cos(t*0.09+e.ph*1.3)*e.drift)*h;
    if(ptrStr>0.01&&ptr){
      const dx=ptr[0]-ex, dy=ptr[1]-ey, d=Math.sqrt(dx*dx+dy*dy), R=unit*0.44;
      if(d<R&&d>1){ const f=(1-d/R)*ptrStr*0.38; ex+=dx*f; ey+=dy*f; }
    }
    const sc=1+0.07*Math.sin(t*0.13+e.ph*2)+pulse*0.12;
    ctx.lineWidth=weights[cls]*(1+pulse*0.9);
    ctx.beginPath();
    ctx.ellipse(ex,ey,e.rx*unit*sc,e.ry*unit*sc,e.rot+t*e.rsp,0,6.2832);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
canvas.addEventListener('pointerdown',e=>{
  if(e.timeStamp-lastTapT<350){ reseeds++; build(hashStr('Weight of Process '+reseeds)); lastTapT=-1e9; ptr=null; return; }
  lastTapT=e.timeStamp; ptr=[e.clientX,e.clientY];
});
canvas.addEventListener('pointermove',e=>{ if(ptr) ptr=[e.clientX,e.clientY]; });
function endP(){ ptr=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(9000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
