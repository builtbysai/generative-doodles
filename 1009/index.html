<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Stage Explodes, Quietly</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded rng (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var BASE_SEED = 100917;
  var DT = 1 / 120;               // fixed sim step
  var PREROLL = 1800;             // 15 s of sim before frame one
  var POOL = 640;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, U = 0, CX = 0, CY = 0, PHONE = false;

  function measure() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(50, Math.floor(w)); H = Math.max(50, Math.floor(h));
    canvas.width = W; canvas.height = H;
    U = Math.min(W, H); CX = W / 2; CY = H / 2;
    var sw = 0, sh = 0;
    if (window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    var mn = Math.min(sw, sh);
    PHONE = (mn > 0 && mn < 700) || (H > W * 1.15 && mn === 0);
  }
  measure();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { measure(); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { measure(); });
  }

  // ---------- choreography ----------
  // Pose params: lean, yaw, crouch, shL/shR (arm angle from straight down, rad),
  // elL/elR (elbow bend), hipL/hipR (thigh angle from straight down), kneeL/kneeR.
  // Slow phrases are interrupted by short SNAP transitions (0.7 s): those arm
  // whips are the sharp movements that detonate bursts.
  var POSES = [
    { t: 0.0,  lean: 0.05, yaw: 1.00, crouch: 0.00, shL: 0.15, elL: 0.20, shR: 0.15, elR: 0.20, hipL: 0.06, kneeL: 0.08, hipR: -0.06, kneeR: 0.08 },
    { t: 2.2,  lean: 0.02, yaw: 0.98, crouch: 0.04, shL: 0.40, elL: 0.30, shR: 0.90, elR: 1.10, hipL: 0.08, kneeL: 0.12, hipR: -0.08, kneeR: 0.12 },
    { t: 2.9,  lean: -0.10, yaw: 0.95, crouch: 0.00, shL: 0.55, elL: 0.35, shR: 2.95, elR: 0.25, hipL: 0.10, kneeL: 0.10, hipR: -0.14, kneeR: 0.16 },
    { t: 5.0,  lean: -0.04, yaw: 0.96, crouch: 0.02, shL: 0.80, elL: 0.40, shR: 2.20, elR: 0.50, hipL: 0.12, kneeL: 0.14, hipR: -0.12, kneeR: 0.14 },
    { t: 6.4,  lean: 0.06, yaw: 0.90, crouch: 0.06, shL: 0.90, elL: 0.35, shR: 1.00, elR: 0.40, hipL: 0.16, kneeL: 0.20, hipR: -0.14, kneeR: 0.18 },
    { t: 7.1,  lean: 0.14, yaw: 0.40, crouch: 0.12, shL: 1.60, elL: 0.25, shR: 1.50, elR: 0.45, hipL: 0.22, kneeL: 0.30, hipR: -0.20, kneeR: 0.26 },
    { t: 9.0,  lean: 0.10, yaw: 0.95, crouch: 0.08, shL: 1.20, elL: 0.35, shR: 1.10, elR: 0.40, hipL: 0.18, kneeL: 0.22, hipR: -0.16, kneeR: 0.20 },
    { t: 9.7,  lean: 0.85, yaw: 0.90, crouch: 0.55, shL: 1.05, elL: 0.55, shR: 0.95, elR: 0.60, hipL: 0.35, kneeL: 0.65, hipR: 0.28, kneeR: 0.55 },
    { t: 12.0, lean: 0.20, yaw: 0.96, crouch: 0.10, shL: 0.60, elL: 0.30, shR: 0.55, elR: 0.35, hipL: 0.10, kneeL: 0.16, hipR: -0.08, kneeR: 0.14 },
    { t: 12.7, lean: -0.06, yaw: 0.95, crouch: 0.02, shL: 2.95, elL: 0.28, shR: 0.50, elR: 0.35, hipL: -0.12, kneeL: 0.14, hipR: 0.10, kneeR: 0.10 },
    { t: 14.5, lean: -0.02, yaw: 0.97, crouch: 0.02, shL: 2.00, elL: 0.45, shR: 0.45, elR: 0.30, hipL: -0.06, kneeL: 0.10, hipR: 0.06, kneeR: 0.10 },
    { t: 16.0, lean: 0.05, yaw: 1.00, crouch: 0.00, shL: 0.15, elL: 0.20, shR: 0.15, elR: 0.20, hipL: 0.06, kneeL: 0.08, hipR: -0.06, kneeR: 0.08 }
  ];
  var PHRASE = 16;

  function smooth(a, b, x) {
    var u = (x - a) / (b - a);
    if (u < 0) u = 0; if (u > 1) u = 1;
    return u * u * (3 - 2 * u);
  }

  function poseAt(tt) {
    var t = ((tt % PHRASE) + PHRASE) % PHRASE;
    var i = 0;
    while (i < POSES.length - 2 && t >= POSES[i + 1].t) i++;
    var A = POSES[i], B = POSES[i + 1];
    var u = smooth(A.t, B.t, t);
    var o = {}, k;
    for (k in A) { if (k !== 't') o[k] = A[k] + (B[k] - A[k]) * u; }
    return o;
  }

  // Figure rig: returns joint positions for figure f at time tt.
  // f: {dx (offset in U units), phase, tempo, mirror}
  function rig(f, tt) {
    var p = poseAt(tt * f.tempo + f.phase);
    var m = f.mirror;
    var torso = 0.075 * U, thigh = 0.055 * U, shin = 0.055 * U;
    var uArm = 0.050 * U, fArm = 0.045 * U;
    var hipW = 0.020 * U, shoW = 0.026 * U;
    var fx = CX + f.dx * U;
    var pelvisY = CY + 0.055 * U + p.crouch * 0.028 * U;
    var pelvis = { x: fx, y: pelvisY };
    var lx = Math.sin(p.lean), ly = -Math.cos(p.lean);
    var chest = { x: fx + lx * torso, y: pelvisY + ly * torso };
    var head = { x: chest.x + lx * 0.020 * U, y: chest.y + ly * 0.020 * U };
    function side(sign) {
      var sx = fx + sign * shoW * p.yaw;
      var sy = chest.y + (chest.x - fx) * 0 + (sign * 0); // shoulders ride the chest point
      var shoulder = { x: sx + (chest.x - fx), y: chest.y };
      var shA = (sign * m < 0) ? p.shR : p.shL;
      var elB = (sign * m < 0) ? p.elR : p.elL;
      var ea = shA + elB * 0.9;
      var elbow = { x: shoulder.x + Math.sin(shA) * uArm * p.yaw, y: shoulder.y + Math.cos(shA) * uArm };
      var wrist = { x: elbow.x + Math.sin(ea) * fArm * p.yaw, y: elbow.y + Math.cos(ea) * fArm };
      var hx = fx + sign * hipW * p.yaw;
      var hipA = (sign * m < 0) ? p.hipR : p.hipL;
      var kneeB = (sign * m < 0) ? p.kneeR : p.kneeL;
      var hip = { x: hx, y: pelvisY };
      var ka = hipA - kneeB;
      var knee = { x: hip.x + Math.sin(hipA) * thigh * p.yaw, y: hip.y + Math.cos(hipA) * thigh };
      var ankle = { x: knee.x + Math.sin(ka) * shin * p.yaw, y: knee.y + Math.cos(ka) * shin };
      return { shoulder: shoulder, elbow: elbow, wrist: wrist, hip: hip, knee: knee, ankle: ankle };
    }
    var L = side(-1), R = side(1);
    return { pelvis: pelvis, chest: chest, head: head, L: L, R: R, fx: fx, fy: pelvisY };
  }

  var FIGURES = [
    { dx: -0.17, phase: 0.0, tempo: 1.00, mirror: 1 },
    { dx: 0.0, phase: 5.3, tempo: 0.93, mirror: -1 },
    { dx: 0.17, phase: 10.7, tempo: 1.07, mirror: 1 }
  ];

  // ---------- sim state ----------
  var rng, parts, flashes, simT, emitters, reseedCount, soloIdx, soloUntil;
  var BURST_V = 0.16; // limb-tip speed (U per second) that detonates a burst

  function newEmitter() { return { prev: 0, cool: 0, acc: 0 }; }

  function reset(seed) {
    rng = mulberry32(seed);
    parts = [];
    flashes = [];
    emitters = [];
    for (var i = 0; i < FIGURES.length * 4; i++) emitters.push(newEmitter());
    soloIdx = -1; soloUntil = -1;
  }

  function spawnBox(x, y, cx, cy, power) {
    if (parts.length >= POOL) parts.shift();
    var ang = Math.atan2(y - cy, x - cx) + (rng() - 0.5) * 3.4;
    var sp = (0.22 + rng() * 0.88) * U * (power || 1);
    var size = (3 + rng() * 13) * Math.max(0.6, U / 720);
    parts.push({
      x: x, y: y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.03 * U,
      rot: rng() * Math.PI * 2, vr: (rng() - 0.5) * 6,
      size: size, s0: size,
      life: 2.6 + rng() * 2.6, age: 0,
      tri: rng() < 0.38, filled: rng() < 0.62
    });
  }

  function burst(x, y, cx, cy, n, power) {
    for (var i = 0; i < n; i++) {
      // jitter the detonation point so a burst reads as hard shards, not a blob
      spawnBox(x + (rng() - 0.5) * 0.022 * U, y + (rng() - 0.5) * 0.022 * U, cx, cy, power);
    }
    flashes.push({ x: x, y: y, age: 0 });
    audioBurst(0.4 + 0.6 * (power || 1) * 0.5);
  }

  function limbTips(r) {
    return [r.L.wrist, r.R.wrist, r.L.ankle, r.R.ankle];
  }

  function stepSim() {
    simT += DT;
    var fi, ei;
    for (fi = 0; fi < FIGURES.length; fi++) {
      var f = FIGURES[fi];
      var rNow = rig(f, simT);
      var rPrev = rig(f, simT - DT);
      var tipsNow = limbTips(rNow), tipsPrev = limbTips(rPrev);
      var gain = (soloIdx === fi) ? 2 : 1;
      for (ei = 0; ei < 4; ei++) {
        var em = emitters[fi * 4 + ei];
        var dx = tipsNow[ei].x - tipsPrev[ei].x;
        var dy = tipsNow[ei].y - tipsPrev[ei].y;
        var speed = Math.sqrt(dx * dx + dy * dy) / DT; // px per second
        var sn = speed / U;                            // in U per second
        // continuous emission: every limb sheds boxes, faster limbs shed far more
        em.acc += (0.9 + Math.max(0, sn - 0.02) * 150) * gain * DT;
        while (em.acc >= 1) {
          em.acc -= 1;
          spawnBox(tipsNow[ei].x + (rng() - 0.5) * 0.008 * U,
            tipsNow[ei].y + (rng() - 0.5) * 0.008 * U, rNow.fx, rNow.fy, 0.8);
        }
        // burst: sharp movement crossing the threshold detonates
        em.cool -= DT;
        if (em.prev <= BURST_V && sn > BURST_V && em.cool <= 0) {
          em.cool = 0.5;
          burst(tipsNow[ei].x, tipsNow[ei].y, rNow.fx, rNow.fy,
            Math.floor(24 + rng() * 20) * gain, 1.15);
        }
        em.prev = sn;
      }
    }
    // pointer drag detonation
    if (ptr.down && ptr.moved) {
      for (var q = 0; q < 4; q++) spawnBox(ptr.x, ptr.y, ptr.x, ptr.y - 1, 0.8);
      ptr.flashAcc += DT;
      if (ptr.flashAcc > 0.09) { ptr.flashAcc = 0; flashes.push({ x: ptr.x, y: ptr.y, age: 0 }); audioBurst(0.5); }
    }
    // integrate boxes
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.age += DT;
      var dragF = Math.pow(0.72, DT); // gentle air drag
      p.vx *= dragF; p.vy *= dragF;
      p.x += p.vx * DT; p.y += p.vy * DT;
      p.rot += p.vr * DT;
      p.size = p.s0 * Math.max(0, 1 - p.age / p.life); // fade by shrinking, never by alpha
      if (p.age >= p.life || p.size <= 0.3) parts.splice(i, 1);
    }
    for (var j = flashes.length - 1; j >= 0; j--) {
      flashes[j].age += DT;
      if (flashes[j].age > 0.28) flashes.splice(j, 1);
    }
    if (soloUntil > 0 && simT > soloUntil) { soloIdx = -1; soloUntil = -1; }
  }

  // ---------- pointer ----------
  var ptr = { down: false, moved: false, x: 0, y: 0, sx: 0, sy: 0, t0: 0, flashAcc: 0 };
  var lastTapT = -10, lastTapClock = -10;

  function clockNow() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : simT;
  }

  function evPos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    else if (e.changedTouches && e.changedTouches[0]) { r.x = e.changedTouches[0].clientX; r.y = e.changedTouches[0].clientY; }
    return r;
  }

  function onDown(e) {
    var p = evPos(e);
    ptr.down = true; ptr.moved = false;
    ptr.x = p.x; ptr.y = p.y; ptr.sx = p.x; ptr.sy = p.y;
    ptr.t0 = clockNow(); ptr.flashAcc = 0;
    ensureAudio();
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!ptr.down) return;
    var p = evPos(e);
    ptr.x = p.x; ptr.y = p.y;
    if (Math.abs(p.x - ptr.sx) + Math.abs(p.y - ptr.sy) > 10) ptr.moved = true;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!ptr.down) return;
    ptr.down = false;
    var now = clockNow();
    var quick = (now - ptr.t0) < 0.30;
    if (quick && !ptr.moved) {
      if (now - lastTapClock < 0.35) {
        // double tap: new phrase
        reseedCount++;
        soloIdx = -1; soloUntil = -1;
        reset(BASE_SEED + reseedCount * 7919);
        simT = 0;
        for (var s = 0; s < 900; s++) stepSim();
        lastTapClock = -10;
      } else {
        lastTapClock = now;
        // tap: solo the nearest figure if the tap lands on one
        for (var i = 0; i < FIGURES.length; i++) {
          var fx = CX + FIGURES[i].dx * U;
          if (Math.abs(ptr.x - fx) < 0.085 * U && Math.abs(ptr.y - CY) < 0.16 * U) {
            soloIdx = i; soloUntil = simT + 10;
            break;
          }
        }
      }
    }
    if (e.preventDefault) e.preventDefault();
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { ptr.down = false; });
  canvas.addEventListener('touchstart', onDown, false);
  canvas.addEventListener('touchmove', onMove, false);
  canvas.addEventListener('touchend', onUp, false);
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);

  // ---------- audio (lazy, gesture-gated, guarded) ----------
  var AC = null, breathOsc = null, breathGain = null;
  function ensureAudio() {
    try {
      if (AC || typeof AudioContext === 'undefined') return;
      if (typeof window !== 'undefined' && typeof window.AudioContext === 'undefined' && typeof AudioContext === 'undefined') return;
      AC = new AudioContext();
      var master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
      AC._master = master;
      // deep stage bed
      var bed = AC.createOscillator(); bed.type = 'sine'; bed.frequency.value = 52;
      var bedG = AC.createGain(); bedG.gain.value = 0.045;
      bed.connect(bedG); bedG.connect(master); bed.start();
      // ring breathing tone
      breathOsc = AC.createOscillator(); breathOsc.type = 'triangle'; breathOsc.frequency.value = 96;
      breathGain = AC.createGain(); breathGain.gain.value = 0.016;
      breathOsc.connect(breathGain); breathGain.connect(master); breathOsc.start();
      // figure movement ticks: very soft high sine blips scheduled from bursts only
    } catch (err) { AC = null; }
  }
  function audioBurst(inten) {
    try {
      if (!AC) return;
      var dur = 0.09, n = Math.floor(AC.sampleRate * dur);
      var buf = AC.createBuffer(1, n, AC.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = AC.createBufferSource(); src.buffer = buf;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass';
      bp.frequency.value = 900 + Math.random() * 2200; bp.Q.value = 0.8;
      var g = AC.createGain(); g.gain.value = 0.10 * Math.min(1, inten);
      src.connect(bp); bp.connect(g); g.connect(AC._master);
      src.start();
    } catch (err) { /* audio is decoration; never break the visual */ }
  }

  // ---------- draw ----------
  function drawFigure(r, dim) {
    ctx.save();
    ctx.globalAlpha = dim ? 0.22 : 1;
    ctx.strokeStyle = '#2E6BFF';
    ctx.fillStyle = '#2E6BFF';
    ctx.lineWidth = Math.max(1.4, U * 0.0022);
    ctx.lineCap = 'round';
    function bone(a, b) {
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    function joint(p) {
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1.3, U * 0.002), 0, Math.PI * 2); ctx.fill();
    }
    bone(r.pelvis, r.chest);
    bone(r.chest, r.head);
    ctx.beginPath(); ctx.arc(r.head.x, r.head.y - 0.012 * U, 0.013 * U, 0, Math.PI * 2); ctx.stroke();
    var s;
    for (s = 0; s < 2; s++) {
      var S = s === 0 ? r.L : r.R;
      bone(r.chest, S.shoulder); bone(S.shoulder, S.elbow); bone(S.elbow, S.wrist);
      bone(r.pelvis, S.hip); bone(S.hip, S.knee); bone(S.knee, S.ankle);
      joint(S.shoulder); joint(S.elbow); joint(S.wrist);
      joint(S.hip); joint(S.knee); joint(S.ankle);
    }
    joint(r.pelvis); joint(r.chest);
    ctx.restore();
  }

  function drawRings() {
    var N = 7;
    ctx.save();
    ctx.lineWidth = Math.max(1, U * 0.0016);
    for (var i = 0; i < N; i++) {
      var frac = (i - (N - 1) / 2) / ((N - 1) / 2); // -1..1
      var y = CY + frac * 0.335 * H;
      var breathe = 1 + 0.07 * Math.sin(simT * 0.45 + i * 0.85);
      var rx = (0.30 - Math.abs(frac) * 0.055) * U * breathe * (PHONE ? 0.92 : 1);
      var ry = rx * 0.27;
      var rot = simT * 0.35 + i * 1.13;
      ctx.strokeStyle = '#FFFFFF';
      var SEG = 44;
      for (var s = 0; s < SEG; s++) {
        var a0 = (s / SEG) * Math.PI * 2, a1 = ((s + 1) / SEG) * Math.PI * 2;
        var glow = 0.5 + 0.5 * Math.sin(a0 * 2 + rot);
        ctx.globalAlpha = 0.7 * (0.35 + 0.65 * glow);
        ctx.beginPath();
        ctx.moveTo(CX + Math.cos(a0) * rx, y + Math.sin(a0) * ry);
        ctx.lineTo(CX + Math.cos(a1) * rx, y + Math.sin(a1) * ry);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    drawRings();

    // storm: hard white geometry, alpha full, fade is by size only
    ctx.save();
    ctx.fillStyle = '#FFFFFF';
    ctx.strokeStyle = '#FFFFFF';
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], s = p.size;
      if (s <= 0.3) continue;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.tri) {
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.62); ctx.lineTo(s * 0.55, s * 0.45); ctx.lineTo(-s * 0.55, s * 0.45);
        ctx.closePath();
        if (p.filled) ctx.fill(); else { ctx.lineWidth = 1.3; ctx.stroke(); }
      } else if (p.filled) {
        ctx.fillRect(-s / 2, -s * 0.34, s, s * 0.68);
      } else {
        ctx.lineWidth = 1.3;
        ctx.strokeRect(-s / 2, -s * 0.34, s, s * 0.68);
      }
      ctx.restore();
    }
    ctx.restore();

    // figures (the emitters)
    for (var fi = 0; fi < FIGURES.length; fi++) {
      var dim = (soloIdx >= 0 && soloIdx !== fi);
      drawFigure(rig(FIGURES[fi], simT), dim);
    }

    // limb flashes at burst points
    ctx.save();
    ctx.strokeStyle = '#9DBCFF';
    ctx.lineCap = 'round';
    for (var j = 0; j < flashes.length; j++) {
      var fl = flashes[j], u = fl.age / 0.28;
      ctx.globalAlpha = Math.max(0, 1 - u);
      var R = (4 + u * 16) * Math.max(0.6, U / 720);
      ctx.lineWidth = 1.6;
      for (var k = 0; k < 6; k++) {
        var a = (k / 6) * Math.PI * 2 + fl.x * 0.01;
        ctx.beginPath();
        ctx.moveTo(fl.x + Math.cos(a) * R * 0.35, fl.y + Math.sin(a) * R * 0.35);
        ctx.lineTo(fl.x + Math.cos(a) * R, fl.y + Math.sin(a) * R);
        ctx.stroke();
      }
    }
    ctx.restore();

    if (breathOsc && AC) {
      try {
        var bs = 1 + 0.07 * Math.sin(simT * 0.45);
        breathOsc.frequency.value = 70 + bs * 34;
      } catch (err) { /* ignore */ }
    }
  }

  // ---------- boot: seeded sim, fixed pre-roll, synchronous frame one ----------
  reseedCount = 0;
  reset(BASE_SEED);
  simT = 0;
  for (var s0 = 0; s0 < PREROLL; s0++) stepSim();
  draw();

  // ---------- live loop ----------
  var lastTs = -1, acc = 0;
  function loop(ts) {
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
    if (lastTs < 0) { lastTs = ts; return; }
    var el = (ts - lastTs) / 1000;
    lastTs = ts;
    if (el > 0.25) el = 0.25;
    acc += el;
    var n = 0;
    while (acc >= DT && n < 40) { stepSim(); acc -= DT; n++; }
    draw();
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
