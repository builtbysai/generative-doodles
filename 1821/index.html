<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapse</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0A10; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0B0A10';
var ROOM_DEEP = '#060509';
var SCREEN_BG = '#14102A';
var SCREEN_EDGE = '#2A2140';
var FRAME_BRASS = '#8A6D2F';
var FRAME_LINE = '#5C4A22';
var VIOLET = '#7A5CFF';
var VIOLET_DEEP = '#4B2FBF';
var VIOLET_PALE = '#B9A8FF';
var GOLD = '#D9A441';
var GOLD_PALE = '#E8C878';
var TITLE_INK = '#F2E8D8';
var HINT_INK = '#E8C878';
var PLATE = '#17131F';
var PLATE_LINE = 'rgba(217,164,65,0.55)';
var FRAME_T = 60;          /* fixed phase: first frame at t = 60 s */
var DRIFT_PERIOD = 47;     /* strobe rate drifts on a 47 s sine */
var K = 16;                /* ripple wavenumber, radians per screen unit */
var COLS = 46, ROWS = 28;  /* interference dot grid inside the screen */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mix(h1, h2, t) {
  var a = hexRgb(h1), b = hexRgb(h2);
  var r = Math.round(a[0] + (b[0] - a[0]) * t);
  var g = Math.round(a[1] + (b[1] - a[1]) * t);
  var bl = Math.round(a[2] + (b[2] - a[2]) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* strobe rate drifts slowly: 1.0 + 0.6 sin, so 0.4 to 1.6 Hz, max 1.6 Hz.
   strobePhase is the exact integral of that rate, so the wave phase and
   the brightness envelope can never drift apart. */
function strobeRate(t) { return 1.0 + 0.6 * Math.sin(TAU * t / DRIFT_PERIOD); }
function strobePhase(t) {
  return TAU * (t + (0.6 * DRIFT_PERIOD / TAU) * (1 - Math.cos(TAU * t / DRIFT_PERIOD)));
}
/* soft brightness envelope, a sine, never a hard cut */
function strobeEnv(t) { return 0.5 + 0.5 * Math.sin(strobePhase(t)); }
/* beat amplitude: contrast breathes on the same slow drift, so the
   pattern locks, breaks, and re-locks as the rate drifts */
function beatAmp(t) { return 0.65 + 0.35 * Math.sin(TAU * t / DRIFT_PERIOD + 1.2); }
function screenRect() {
  var w = Math.min(VW * 0.74, VH * 1.15);
  if (isPhone) w = VW * 0.88;
  var h = w * 0.62;
  if (h > VH * 0.62) { h = VH * 0.62; w = h / 0.62; }
  return { x: (VW - w) / 2, y: (VH - h) / 2, w: w, h: h };
}
function waveAt(u, v, wp) {
  /* u, v in screen units, aspect corrected; two ripple sources at
     u = -0.32 and u = +0.32, standing waves interfering */
  var ax = u + 0.32, bx = u - 0.32;
  var r1 = Math.sqrt(ax * ax + v * v);
  var r2 = Math.sqrt(bx * bx + v * v);
  var val = Math.sin(K * r1 - wp) + Math.sin(K * r2 - wp * 0.85)
    + 0.6 * Math.sin(K * 0.7 * (r1 + r2) + wp * 0.5);
  return val / 2.6;
}
function draw() {
  size();
  var t = phaseT;
  var wp = strobePhase(t);
  var env = strobeEnv(t);
  var beat = beatAmp(t);
  var s = Math.min(VW, VH);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* the dark room: a faint wash from above, black floor shadow below.
     Still at every t; only the interference inside the screen moves. */
  var wash = ctx.createRadialGradient(VW / 2, 0, 0, VW / 2, 0, VH * 0.9);
  wash.addColorStop(0, rgba(VIOLET_DEEP, 0.07));
  wash.addColorStop(0.6, rgba(VIOLET_DEEP, 0.02));
  wash.addColorStop(1, rgba(VIOLET_DEEP, 0));
  ctx.fillStyle = wash;
  ctx.fillRect(0, 0, VW, VH);
  var floor = ctx.createLinearGradient(0, VH - s * 0.16, 0, VH);
  floor.addColorStop(0, rgba(ROOM_DEEP, 0));
  floor.addColorStop(1, rgba(ROOM_DEEP, 0.7));
  ctx.fillStyle = floor;
  ctx.fillRect(0, VH - s * 0.16, VW, s * 0.16);
  var R = screenRect();
  /* projector glow spilling softly around the screen, breathing with
     the strobe envelope, never a hard cut */
  var glow = ctx.createRadialGradient(VW / 2, VH / 2, 0, VW / 2, VH / 2, R.w * 0.85);
  glow.addColorStop(0, rgba(VIOLET, (0.10 * env + 0.03).toFixed(4) * 1));
  glow.addColorStop(1, rgba(VIOLET, 0));
  ctx.fillStyle = glow;
  ctx.fillRect(R.x - R.w * 0.35, R.y - R.h * 0.55, R.w * 1.7, R.h * 2.1);
  /* the screen: deep violet ground, brass frame, thin inner edge */
  ctx.fillStyle = SCREEN_BG;
  ctx.fillRect(R.x, R.y, R.w, R.h);
  ctx.strokeStyle = FRAME_BRASS;
  ctx.lineWidth = Math.max(3, R.w * 0.004);
  ctx.strokeRect(R.x, R.y, R.w, R.h);
  ctx.strokeStyle = FRAME_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(R.x + 5.5, R.y + 5.5, R.w - 11, R.h - 11);
  /* interference, clipped to the screen interior */
  ctx.save();
  ctx.beginPath();
  ctx.rect(R.x + 7, R.y + 7, R.w - 14, R.h - 14);
  ctx.clip();
  var ix = R.x + 7, iy = R.y + 7, iw = R.w - 14, ih = R.h - 14;
  /* faint continuous ripple arcs from each source, under the dots */
  var src, rr, a2;
  var sources = [-0.32, 0.32];
  var si, ri;
  for (si = 0; si < 2; si++) {
    src = sources[si];
    var sx = ix + iw * (0.5 + src * 0.5);
    var sy = iy + ih * 0.5;
    for (ri = 1; ri <= 14; ri++) {
      rr = ri * iw * 0.045;
      a2 = 0.5 + 0.5 * Math.sin(K * (ri * 0.09) - wp * (si === 0 ? 1 : 0.85));
      ctx.strokeStyle = rgba(VIOLET_PALE, (0.05 + 0.10 * a2 * beat * (0.4 + 0.6 * env)));
      ctx.lineWidth = Math.max(1, iw * 0.0016);
      ctx.beginPath();
      ctx.arc(sx, sy, rr, 0, TAU);
      ctx.stroke();
    }
  }
  /* dot grid: each dot is one sample of the interference field.
     Crest dots run violet to pale, trough dots run brass gold. */
  var gx, gy, u, v, n, an, dotR, col;
  var cellW = iw / COLS, cellH = ih / ROWS;
  var baseR = Math.min(cellW, cellH) * 0.42;
  for (gy = 0; gy < ROWS; gy++) {
    for (gx = 0; gx < COLS; gx++) {
      u = ((gx + 0.5) / COLS - 0.5) * 2;
      v = ((gy + 0.5) / ROWS - 0.5) * 2 * (ih / iw);
      n = waveAt(u, v, wp);
      an = Math.abs(n);
      dotR = baseR * (0.45 + 0.9 * an * beat);
      col = mix(VIOLET, GOLD_PALE, clamp((n + 1) / 2, 0, 1));
      ctx.fillStyle = col;
      ctx.globalAlpha = clamp(0.10 + 0.75 * an * beat * (0.45 + 0.55 * env), 0, 1);
      ctx.beginPath();
      ctx.moveTo(ix + (gx + 0.5) * cellW + dotR, iy + (gy + 0.5) * cellH);
      ctx.arc(ix + (gx + 0.5) * cellW, iy + (gy + 0.5) * cellH, Math.max(dotR, 0.6), 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  /* screen sheen: a still diagonal veil, so the projection reads as a
     lit surface rather than a flat panel */
  var sheen = ctx.createLinearGradient(R.x, R.y, R.x + R.w, R.y + R.h);
  sheen.addColorStop(0, rgba(VIOLET_PALE, 0.05));
  sheen.addColorStop(0.5, rgba(VIOLET_PALE, 0));
  sheen.addColorStop(1, rgba(GOLD, 0.04));
  ctx.fillStyle = sheen;
  ctx.fillRect(R.x, R.y, R.w, R.h);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Lapse').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Lapse').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 06').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Lapse', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 06', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
/* ---- frame one: fixed phase t = 60 s, strobe near its fastest drift
   point (about 1.59 Hz) with the interference partway through a beat ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
