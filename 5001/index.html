<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>№5001 · Paradise Plot</title><meta name="description" content="Branching colonies compete for a shared field of resources; the resulting living lattice is drawn as a botanical print. Tap for another growth."><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e4d5}canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:none;cursor:pointer}canvas:active{cursor:pointer}canvas:focus-visible{outline:1px solid #343a31;outline-offset:-4px}
</style></head><body><canvas id="art" tabindex="0" aria-label="Paradise Plot. Tap or press Enter to grow a new variation."></canvas><script>
'use strict';
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function paradise(seed){
  const r=rng(seed),S=720;
  const palettes=[["#e9e4d5","#313f35","#65765a","#a3a47c","#ad5039"],["#e5dcca","#2e453b","#667e64","#a2a37b","#a84b35"],["#e8e5d9","#38483b","#66816a","#9c9c76","#b25940"]];
  const [bg,dark,mid,light,accent]=palettes[Math.floor(r()*palettes.length)];
  const points=[],nodes=[],roots=[],edges=[],shapes=[];
  // Root positions and resource clouds describe a shared habitat, not individual trees.
  const count=7+Math.floor(r()*3),phase=r()*Math.PI*2;
  // A shared radial habitat with lopsided lobes of resources; the network grows outward.
  for(let k=0;k<count;k++){
    const a=phase+k*Math.PI*2/count+(r()-.5)*.25,rootR=34+r()*14;
    const x=360+Math.cos(a)*rootR,y=360+Math.sin(a)*rootR;
    roots.push(nodes.length);nodes.push({x,y,parent:-1,gen:0,root:k,flow:1});
    const reach=172+r()*48,cx=360+Math.cos(a)*reach,cy=360+Math.sin(a)*reach;
    const rx=91+r()*30,ry=62+r()*36,n=340+Math.floor(r()*90);
    for(let i=0;i<n;i++){
      const theta=r()*Math.PI*2,d=Math.sqrt(r()),u=Math.cos(theta)*rx*d,v=Math.sin(theta)*ry*d;
      const px=cx+Math.cos(a)*u-Math.sin(a)*v,py=cy+Math.sin(a)*u+Math.cos(a)*v;
      if(Math.hypot(px-360,py-360)<300&&Math.hypot(px-360,py-360)>60)points.push({x:px,y:py,live:true});
    }
    for(let j=0;j<40;j++){const t=(j+1)/41;points.push({x:x+(cx-x)*t+(r()-.5)*48,y:y+(cy-y)*t+(r()-.5)*48,live:true});}
  }
  for(let gen=1;gen<=165;gen++){
    const sums=new Map();let alive=0;
    for(const p of points){
      if(!p.live)continue;
      let best=-1,bd=72*72;
      for(let j=0;j<nodes.length;j++){const v=nodes[j],dx=p.x-v.x,dy=p.y-v.y,d=dx*dx+dy*dy;if(d<bd){best=j;bd=d;}}
      if(bd<6.4*6.4){p.live=false;continue;}
      alive++;
      if(best<0)continue;
      const v=nodes[best],d=Math.sqrt(bd),a=sums.get(best)||[0,0,0];
      a[0]+=(p.x-v.x)/d;a[1]+=(p.y-v.y)/d;a[2]++;sums.set(best,a);
    }
    if(!alive||!sums.size||nodes.length>7500)break;
    let added=0;
    for(const [j,a] of sums){
      const v=nodes[j],d=Math.hypot(a[0],a[1]);if(d<.025)continue;
      const angle=Math.atan2(a[1],a[0])+(r()-.5)*.15;
      const step=3.5+r()*.85,x=v.x+Math.cos(angle)*step,y=v.y+Math.sin(angle)*step;
      if(Math.hypot(x-360,y-360)>309)continue;
      let close=false;
      for(let k=0;k<nodes.length;k++){if(k===j)continue;const q=nodes[k];if((q.x-x)**2+(q.y-y)**2<2.7**2){close=true;break;}}
      if(close)continue;
      nodes.push({x,y,parent:j,gen,root:v.root,flow:1});added++;
    }
    if(!added)break;
  }
  const children=new Uint16Array(nodes.length);
  for(let j=nodes.length-1;j>=0;j--){const n=nodes[j];if(n.parent>=0){nodes[n.parent].flow+=n.flow;children[n.parent]++;}}
  const line=(x1,y1,x2,y2,w,c,t=0)=>shapes.push({kind:"line",x1,y1,x2,y2,w,c,t});
  const circle=(x,y,rad,c,t=0)=>shapes.push({kind:"circle",x,y,rad,c,t});
  // Very small root marks anchor the branches without drawing a landscape.
  for(let i=0;i<roots.length;i++){const n=nodes[roots[i]];circle(n.x,n.y,2.2,dark);}
  for(let j=0;j<nodes.length;j++){
    const v=nodes[j];if(v.parent<0)continue;const p=nodes[v.parent];
    const w=Math.min(4.6,.72+Math.sqrt(v.flow)*.19),c=v.flow>32?dark:v.flow>3?mid:light;
    line(p.x,p.y,v.x,v.y,w,c,v.gen);
    // Growth terminals carry tiny reproductive marks, chosen from local structure.
    if(children[j]===0&&v.gen>10){
      const a=Math.atan2(v.y-p.y,v.x-p.x),rr=r();
      if(rr<.15){circle(v.x,v.y,1.25+r()*1.2,accent,v.gen+2);}
      else if(rr<.75){const len=3+r()*2.5,spread=.46+r()*.45;
        line(v.x,v.y,v.x+Math.cos(a+spread)*len,v.y+Math.sin(a+spread)*len,.85,mid,v.gen+2);
        line(v.x,v.y,v.x+Math.cos(a-spread)*len,v.y+Math.sin(a-spread)*len,.85,mid,v.gen+2);}
    }
  }
  return {bg,shapes,maxT:Math.max(...shapes.map(q=>q.t)),stats:{nodes:nodes.length,resources:points.length,consumed:points.filter(p=>!p.live).length,roots:roots.length}};
}
const build=paradise, GROWTH=true, DEFAULT=5001;
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
let seed=Number(new URLSearchParams(location.search).get('seed')||DEFAULT)>>>0,model,frame=0,start=0,elapsed=0,lastSize=null,pointer=null,override=null;
function draw(progress=1){
 const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight,dpr=Math.min(devicePixelRatio||1,2.5);
 if(!lastSize||lastSize[0]!==w||lastSize[1]!==h||lastSize[2]!==dpr){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';lastSize=[w,h,dpr];}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=model.bg;ctx.fillRect(0,0,w,h);document.body.style.background=model.bg;
 const unit=Math.min(w,h)/720;ctx.translate((w-720*unit)/2,(h-720*unit)/2);ctx.scale(unit,unit);ctx.lineCap='round';ctx.lineJoin='round';
 const limit=model.maxT*progress;
 for(const q of model.shapes){if(q.t>limit)continue;ctx.fillStyle=q.c;ctx.strokeStyle=q.c;ctx.beginPath();
 if(q.kind==='line'){ctx.lineWidth=q.w;ctx.moveTo(q.x1,q.y1);ctx.lineTo(q.x2,q.y2);ctx.stroke();}
 else if(q.kind==='circle'){ctx.arc(q.x,q.y,q.rad,0,Math.PI*2);ctx.fill();}
 else{ctx.moveTo(...q.pts[0]);for(let i=1;i<q.pts.length;i++)ctx.lineTo(...q.pts[i]);ctx.closePath();ctx.fill();}}
}
function tick(t){frame=0;if(!start)start=t;elapsed=Math.min(1,(t-start)/4200);draw(elapsed);if(elapsed<1&&!document.hidden)frame=requestAnimationFrame(tick);}
function rebuild(animate){if(frame)cancelAnimationFrame(frame);frame=0;model=build(seed,override);start=0;elapsed=GROWTH&&animate&&!reduced.matches?0:1;draw(elapsed);if(elapsed<1&&!document.hidden)frame=requestAnimationFrame(tick);}
function newSeed(){seed=(Math.random()*4294967296)>>>0;override=null;history.replaceState(null,'','?seed='+seed);rebuild(true);}
function locationInArt(e){const r=canvas.getBoundingClientRect(),s=Math.min(r.width,r.height),x=(e.clientX-r.left-(r.width-s)/2)/s*720,y=(e.clientY-r.top-(r.height-s)/2)/s*720;return{x:Math.max(160,Math.min(560,x)),y:Math.max(160,Math.min(560,y))};}
canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id||GROWTH)return;if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>5)pointer.moved=true;if(pointer.moved){override=locationInArt(e);model=build(seed,override);draw(1);}});
canvas.addEventListener('pointerup',e=>{if(!pointer||e.pointerId!==pointer.id)return;const p=pointer;pointer=null;if(!p.moved&&Math.hypot(e.clientX-p.x,e.clientY-p.y)<7)newSeed();});
canvas.addEventListener('pointercancel',()=>{pointer=null;});canvas.addEventListener('lostpointercapture',()=>{pointer=null;});
canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();newSeed();}});
function resize(){draw(elapsed);}
window.addEventListener('resize',resize);if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(frame)cancelAnimationFrame(frame);frame=0;}else if(elapsed<1&&!frame){start=performance.now()-elapsed*4200;frame=requestAnimationFrame(tick);}});
reduced.addEventListener('change',()=>{if(reduced.matches&&elapsed<1){if(frame)cancelAnimationFrame(frame);frame=0;elapsed=1;draw(1);}});
rebuild(false);
</script></body></html>
