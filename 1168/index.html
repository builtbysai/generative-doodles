<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prepared Desktop</title>
<style>
  html, body { margin:0; padding:0; background:#000000; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function(){
'use strict';

// ---------- seeded determinism: mulberry32 + integer hash ----------
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function h2(a,b){ var x=(Math.imul((a|0)+1,374761393)+Math.imul((b|0)+1,668265263))^0x5bf03635; x=Math.imul(x^(x>>>13),1274126177); return ((x^(x>>>16))>>>0)/4294967296; }

// wallpaper hill silhouettes, baked once from the seeded stream
var hillRng = mulberry32(1168001);
function bakeHill(n){ var raw=[], sm=[], i; for (i=0;i<n;i++) raw.push(hillRng()); for (i=0;i<n;i++) sm.push((raw[Math.max(0,i-1)]+raw[i]*2+raw[Math.min(n-1,i+1)])/4); return sm; }
var HILL_BACK = bakeHill(9), HILL_MID = bakeHill(11), HILL_FRONT = bakeHill(13);

// ---------- palette ----------
var SKY='#7FB3D5', HILL_B='#4A7A58', HILL_M='#3A6A48', HILL_F='#2E5A3E';
var CHROME='#E8E8E8', TITLEBAR='#C0C0C0', MENUBAR='#F5F5F5';
var INK='#222222';
var BALL=['#FF3B30','#FF9500','#FFCC00','#34C759','#007AFF','#AF52DE'];
var SORT_COLORS=['#00FFC2','#FF2B6E','#FFE14D','#3D5AFE','#FF9100','#B388FF'];
var CHAN_COLORS=['#00FFC2','#FF2B6E','#FFE14D'];
var GHOST_TINT=['#00FFC2','#FF2B6E','#3D5AFE'];   // per content type
var DOT_COLORS=['#FF5F57','#FEBC2E','#28C840'];
var DOCK_COLORS=['#FF2B6E','#00FFC2','#FFE14D','#3D5AFE','#FF9100','#B388FF','#34C759','#E8E8E8'];

// ---------- timing: 32s loop ----------
// 0-8 cascade open / 8-20 drag / 20-24 beachball freeze / 24-28 close / 28-32 clean
var LOOP=32, T0=14, NW=7;
function frozenTime(lt){ return lt<20 ? lt : (lt<24 ? 20 : lt-4); }  // contents + drag hold during the freeze
function easeOutCubic(p){ return 1-Math.pow(1-p,3); }
function easeInOut(p){ return p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

// window spawn / close schedule
function spawnAt(k){ return k*1.1; }
function closeAt(k){ return 24+(6-k)*0.55; }
var TITLES=['untitled-1','wave.pool','presets','untitled-2','channel jam','sort bench','jam session'];

// ---------- phone detection ----------
var sw=(window.screen && window.screen.width)||0;
var sh=(window.screen && window.screen.height)||0;
var minScreen=Math.min(sw||9999, sh||9999);
var isPhone = minScreen<700;

// ---------- view / canvas ----------
var canvas=document.getElementById('stage');
var ctx=canvas.getContext('2d');
var W=0, H=0;
function viewW(){ if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width; return window.innerWidth||800; }
function viewH(){ if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height; return window.innerHeight||800; }
function fit(){
  W=viewW(); H=viewH();
  canvas.width=W; canvas.height=H;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  if (!isPhone && H>W*1.15) isPhone=true;
}

// ---------- layout ----------
function layout(){
  var s=clamp(Math.min(W/1000, H/640), 0.42, 1.15);
  var menuH=Math.max(24, 26*s), dockH=58*s;
  var ww=340*s, wh=230*s, titleH=22*s, off=24*s;
  var bx=W*0.5-ww*0.55, by=menuH+(H-menuH-dockH)*0.13;
  return { s:s, menuH:menuH, dockH:dockH, ww:ww, wh:wh, titleH:titleH, off:off, bx:bx, by:by };
}
function winBase(L,k){ return { x:L.bx+k*L.off, y:L.by+k*L.off }; }

// drag offset of the top window (window 6), a pure function of loop time
function dragOffset(L, lt){
  var dx=0, dy=0, dlt;
  if (lt>=8 && lt<20){ dlt=lt-8; dx=Math.sin(dlt*0.9)*L.ww*0.34; dy=Math.sin(dlt*1.7+0.6)*L.wh*0.30; }
  else if (lt>=20 && lt<23.4){ dlt=12; dx=Math.sin(dlt*0.9)*L.ww*0.34; dy=Math.sin(dlt*1.7+0.6)*L.wh*0.30; }
  else if (lt>=23.4 && lt<24){ var e=easeInOut((lt-23.4)/0.6); dlt=12; dx=Math.sin(dlt*0.9)*L.ww*0.34*(1-e); dy=Math.sin(dlt*1.7+0.6)*L.wh*0.30*(1-e); }
  return { dx:dx, dy:dy };
}
function winPos(L, k, lt){
  var b=winBase(L,k), x=b.x, y=b.y;
  if (k===6){ var o=dragOffset(L,lt); x+=o.dx; y+=o.dy; }
  x=clamp(x, 6, Math.max(6, W-L.ww-6));
  y=clamp(y, L.menuH+4, Math.max(L.menuH+4, H-L.dockH-L.wh-4));
  return { x:x, y:y };
}
// spawn scale-in / close shrink, about the window centre; 0 = gone
function winScale(k, lt){
  var st=lt-spawnAt(k);
  if (st<0) return 0;
  var sc = st<0.25 ? easeOutCubic(st/0.25) : 1;
  var ct=lt-closeAt(k);
  if (ct>=0){ if (ct>=0.3) return 0; sc*= 1-easeInOut(ct/0.3); }
  return sc;
}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){
  r=Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arc(x+w-r, y+r, r, -Math.PI/2, 0);
  ctx.lineTo(x+w, y+h-r); ctx.arc(x+w-r, y+h-r, r, 0, Math.PI/2);
  ctx.lineTo(x+r, y+h); ctx.arc(x+r, y+h-r, r, Math.PI/2, Math.PI);
  ctx.lineTo(x, y+r); ctx.arc(x+r, y+r, r, Math.PI, Math.PI*1.5);
  ctx.closePath();
}
function dot(cx,cy,r){ ctx.beginPath(); ctx.moveTo(cx+r,cy); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill(); }

// ---------- wallpaper ----------
function hillPath(pts, baseY, amp){
  var i, x, y;
  ctx.beginPath();
  ctx.moveTo(-4, H+4);
  for (i=0;i<pts.length;i++){
    x=(i/(pts.length-1))*(W+8)-4; y=baseY-pts[i]*amp;
    if (i===0) ctx.lineTo(x,y); else {
      var px=((i-1)/(pts.length-1))*(W+8)-4, py=baseY-pts[i-1]*amp;
      ctx.quadraticCurveTo(px, py, (px+x)/2, (py+y)/2);
    }
  }
  ctx.lineTo(W+4, baseY-pts[pts.length-1]*amp);
  ctx.lineTo(W+4, H+4);
  ctx.closePath();
  ctx.fill();
}
function drawWallpaper(L){
  ctx.fillStyle=SKY; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=HILL_B; hillPath(HILL_BACK, H*0.60, H*0.14);
  ctx.fillStyle=HILL_M; hillPath(HILL_MID, H*0.72, H*0.13);
  ctx.fillStyle=HILL_F; hillPath(HILL_FRONT, H*0.86, H*0.11);
  ctx.fillStyle=HILL_F; ctx.fillRect(0, H*0.86, W, H*0.14);
}

// ---------- menubar + dock ----------
function drawMenubar(L){
  ctx.fillStyle=MENUBAR; ctx.fillRect(0,0,W,L.menuH);
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,L.menuH-1,W,1);
  var fs=Math.max(11, 12*L.s);
  ctx.fillStyle=INK;
  ctx.fillRect(14, L.menuH/2-5, 10, 10);   // generic system mark, no logo
  ctx.font='bold '+fs+'px monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('File   Edit   View   Window   Help', 34, L.menuH/2+0.5);
  ctx.textAlign='right';
  ctx.fillText('Fri 4:04 PM', W-14, L.menuH/2+0.5);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}
function drawDock(L){
  var tile=44*L.s, gap=8*L.s, pad=10*L.s, n=DOCK_COLORS.length;
  var dw=n*tile+(n-1)*gap+pad*2, dh=L.dockH;
  var dx=(W-dw)/2, dy=H-dh-6*L.s;
  ctx.fillStyle='rgba(245,245,245,0.55)'; rr(dx,dy,dw,dh,12*L.s); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1; rr(dx+0.5,dy+0.5,dw-1,dh-1,12*L.s); ctx.stroke();
  var i, tx, ty=dy+(dh-tile)/2;
  for (i=0;i<n;i++){
    tx=dx+pad+i*(tile+gap);
    ctx.fillStyle=DOCK_COLORS[i]; rr(tx,ty,tile,tile,9*L.s); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.75)';
    if (i%3===0) dot(tx+tile/2, ty+tile/2, tile*0.16);
    else if (i%3===1) ctx.fillRect(tx+tile*0.25, ty+tile*0.42, tile*0.5, tile*0.13);
    else { ctx.beginPath(); ctx.moveTo(tx+tile*0.5, ty+tile*0.28); ctx.lineTo(tx+tile*0.72, ty+tile*0.68); ctx.lineTo(tx+tile*0.28, ty+tile*0.68); ctx.closePath(); ctx.fill(); }
    if (i===6){ ctx.fillStyle=INK; dot(tx+tile/2, dy+dh-5*L.s, 2.2*L.s); }  // running indicator under the performer's app
  }
}

// ---------- window contents: three tiny procedural animations ----------
function contentSort(x,y,w,h,ft,seed){
  var colW=Math.max(8, 14*LAY_S), j, i;
  var cols=Math.max(3, Math.floor(w/colW));
  for (j=0;j<cols;j++){
    var rot=Math.floor(ft*1.5)+j*2+seed;
    var cy=y, rem=h;
    for (i=0;i<5 && rem>1;i++){
      var segH=(i===4)? rem : Math.max(4, (0.14+h2(j*7+seed, i*13)*0.30)*h);
      if (segH>rem) segH=rem;
      ctx.fillStyle=SORT_COLORS[((rot+i)%SORT_COLORS.length+SORT_COLORS.length)%SORT_COLORS.length];
      ctx.fillRect(x+j*colW+1, cy, colW-2, Math.max(1,segH-1));
      cy+=segH; rem-=segH;
    }
  }
}
function contentChan(x,y,w,h,ft,seed){
  var cw=w/10, ch=h/7, i, j, st=Math.floor(ft*3);
  for (j=0;j<7;j++) for (i=0;i<10;i++){
    var idx=((i*7+j*3+((i+j)%3))%3+3)%3;
    var col=CHAN_COLORS[idx];
    var px=x+i*cw, py=y+j*ch;
    if (h2(i*31+seed, j*17+st)<0.30){
      ctx.globalAlpha=0.55; ctx.fillStyle='#FF0000';
      ctx.fillRect(px+3*LAY_S, py, Math.max(1,cw-2), Math.max(1,ch-2));
      ctx.fillStyle='#0000FF';
      ctx.fillRect(px-3*LAY_S, py, Math.max(1,cw-2), Math.max(1,ch-2));
      ctx.globalAlpha=1;
    }
    ctx.fillStyle=col;
    ctx.fillRect(px+1, py+1, Math.max(1,cw-2), Math.max(1,ch-2));
  }
}
function contentWave(x,y,w,h,ft,seed){
  var li, px, py, step=Math.max(4, 6*LAY_S), midY=y+h/2;
  ctx.lineWidth=Math.max(1.2, 1.6*LAY_S);
  for (li=0;li<5;li++){
    ctx.strokeStyle=SORT_COLORS[(li+seed)%SORT_COLORS.length];
    ctx.beginPath();
    for (px=0; px<=w; px+=step){
      py=midY + Math.sin(px*0.045 + ft*2 + li*0.7 + seed)*h*0.16*Math.sin(li*0.9+ft*0.7)
           + Math.sin(px*0.11 - ft*3.1 + li)*h*0.05 + (li-2)*h*0.15;
      if (px===0) ctx.moveTo(x+px, py); else ctx.lineTo(x+px, py);
    }
    ctx.stroke();
  }
}
var LAY_S=1;
function drawWindowContent(k, x, y, w, h, ft){
  var type=k%3;
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.fillStyle='#101014'; ctx.fillRect(x,y,w,h);
  if (type===0) contentSort(x,y,w,h,ft,k*5);
  else if (type===1) contentChan(x,y,w,h,ft,k*5);
  else contentWave(x,y,w,h,ft,k*5);
  ctx.restore();
}

// ---------- windows ----------
function drawWindow(L, k, x, y, sc, ft){
  var ww=L.ww*sc, wh=L.wh*sc, th=L.titleH*sc;
  var cx=x+L.ww/2, cy=y+L.wh/2, dx=cx-ww/2, dy=cy-wh/2;
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.fillRect(dx+4*L.s, dy+5*L.s, ww, wh);
  ctx.fillStyle=CHROME; ctx.fillRect(dx, dy, ww, wh);
  ctx.fillStyle=TITLEBAR; ctx.fillRect(dx, dy, ww, th);
  ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1;
  ctx.strokeRect(dx+0.5, dy+0.5, ww-1, wh-1);
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(dx, dy+th, ww, 1);
  var dr=Math.max(2.5, 4.5*L.s*sc), i;
  for (i=0;i<3;i++){ ctx.fillStyle=DOT_COLORS[i]; dot(dx+(10+i*15)*L.s*sc, dy+th/2, dr); }
  ctx.fillStyle=INK;
  ctx.font='bold '+Math.max(9, 11*L.s*sc)+'px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(TITLES[k], dx+ww/2, dy+th/2+0.5);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  var inset=6*L.s*sc;
  drawWindowContent(k, dx+inset, dy+th+inset, ww-inset*2, wh-th-inset*2, ft);
}

// ghost trail of the dragged top window: sampled past positions, pure function of lt
function drawTrail(L, lt){
  if (lt<8.12 || lt>=24) return;
  var b=winBase(L,6), j;
  for (j=9;j>=1;j--){
    var ts=lt-j*0.12;
    if (ts<8) continue;
    var o=dragOffset(L, ts);
    var gx=clamp(b.x+o.dx, 6, Math.max(6, W-L.ww-6));
    var gy=clamp(b.y+o.dy, L.menuH+4, Math.max(L.menuH+4, H-L.dockH-L.wh-4));
    ctx.globalAlpha=0.30*(1-j/10);
    ctx.fillStyle=CHROME;
    ctx.fillRect(gx, gy, L.ww, L.wh);
    ctx.fillStyle=GHOST_TINT[0];
    ctx.fillRect(gx, gy+L.titleH, L.ww, L.wh-L.titleH);
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(0,0,0,0.25)';
    ctx.strokeRect(gx+0.5, gy+0.5, L.ww-1, L.wh-1);
  }
}

// ---------- beachball ----------
function drawBeachball(L, lt){
  var cx=W/2, cy=H/2-10*L.s;
  var p=clamp((lt-20)/0.4, 0, 1);
  var r=Math.max(26, 46*L.s)*(0.3+0.7*easeOutCubic(p));
  var ang=(lt-20)*9, i, a0, a1;
  for (i=0;i<6;i++){
    a0=ang+i*Math.PI/3; a1=ang+(i+1)*Math.PI/3;
    ctx.fillStyle=BALL[i];
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,a0,a1);
    ctx.closePath();
    ctx.fill();
  }
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cx+r,cy); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.35)'; dot(cx-r*0.34, cy-r*0.38, r*0.16);
}

// ---------- cursor ----------
function drawCursor(x, y, cs){
  var P=[[0,0],[0,17],[4.5,13],[7,19.5],[9.5,18],[7,12],[12,12]];
  var i;
  ctx.beginPath();
  for (i=0;i<P.length;i++){
    if (i===0) ctx.moveTo(x+P[i][0]*cs, y+P[i][1]*cs);
    else ctx.lineTo(x+P[i][0]*cs, y+P[i][1]*cs);
  }
  ctx.closePath();
  ctx.fillStyle='#FFFFFF'; ctx.fill();
  ctx.strokeStyle='#000000'; ctx.lineWidth=1.2; ctx.stroke();
}
function cursorPos(L, lt){
  var cs=Math.max(0.8, L.s), i;
  if (lt<8){
    var seg=clamp(lt/1.1, 0, NW-1), i0=Math.floor(seg), i1=Math.min(NW-1, i0+1);
    var f=easeInOut(seg-i0);
    var a=winBase(L,i0), b=winBase(L,i1);
    return { x:a.x+(b.x-a.x)*f + L.ww*0.5, y:a.y+(b.y-a.y)*f + L.titleH/2, cs:cs };
  }
  if (lt<24){
    var p=winPos(L, 6, lt);
    return { x:p.x+L.ww*0.5, y:p.y+L.titleH/2, cs:cs };
  }
  if (lt<28){
    var ck=6, best=1e9;
    for (i=0;i<NW;i++){ var d=Math.abs(closeAt(i)-lt); if (d<best){ best=d; ck=i; } }
    var cp=winBase(L, ck);
    return { x:cp.x+10*L.s, y:cp.y+L.titleH/2, cs:cs };
  }
  return { x:W-70*L.s, y:H-L.dockH-60*L.s, cs:cs };
}

// ---------- draw ----------
function draw(t){
  fit();
  var lt=((t%LOOP)+LOOP)%LOOP;
  var ft=frozenTime(lt);
  var L=layout(); LAY_S=L.s;
  var k, sc, pos;

  drawWallpaper(L);
  for (k=0;k<NW;k++){
    if (k===6) { drawTrail(L, lt); continue; }   // trail sits beneath the dragged top window
    sc=winScale(k, lt);
    if (sc<=0) continue;
    pos=winPos(L, k, lt);
    drawWindow(L, k, pos.x, pos.y, sc, ft);
  }
  sc=winScale(6, lt);
  if (sc>0){ pos=winPos(L, 6, lt); drawWindow(L, 6, pos.x, pos.y, sc, ft); }
  drawDock(L);
  drawMenubar(L);
  if (lt>=20 && lt<24) drawBeachball(L, lt);
  if (!(lt>=20 && lt<24)){
    var cp=cursorPos(L, lt);
    drawCursor(cp.x, cp.y, cp.cs);
  }
}

// ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
var lastT=T0;
if (window.addEventListener){
  window.addEventListener('resize', function(){ draw(lastT); });
}
if (window.visualViewport && window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize', function(){ draw(lastT); });
}
draw(T0);
var startStamp=null;
function frame(stamp){
  if (startStamp===null) startStamp=stamp;
  var t=T0+(stamp-startStamp)/1000;
  lastT=t;
  draw(t);
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
