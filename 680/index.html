<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Naciendo del Barro</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #171310; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.680 "Naciendo del Barro" (EXPANSION #82 clemente-mckay, block 8).
  // His workshop phrase "Quenas naciendo del barro" as a 40 s watch-only
  // loop. A lump of wet clay on a dark bench rises and hollows into a
  // quena flute (throwing), dries to leather-hard, glows in the kiln,
  // cools to burnished clay, and then sounds one breathy phrase as if
  // testing itself. Then a new lump. No hands, no wheel: the clay forms
  // itself, and the profile is never mirror-perfect (hand-thrown wobble
  // on every control point, left and right offsets independent).
  // The sounding phrase is gesture-gated: it plays only if a visitor
  // tap or click has already unlocked audio; otherwise the sounding
  // stage is visual only. See process.md.

  var WET = '#6E4A33';
  var DRY = '#A4764F';
  var KILN = '#E2722B';
  var BURN = '#8A4A2B';
  var BENCH = '#171310';
  var BREATH = '#CFE4E4';

  var LOOP = 40; // seconds
  var BASE_SEED = 680001;

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

  // ------------------------------------------------------------------
  // PROFILE. A lathe profile: control points of (height fraction,
  // radius fraction). Two keyframes with the same point count:
  //   LUMP:  a squat wet blob.
  //   QUENA: a tall flute, cylindrical body, mouthpiece block at top.
  // Each point carries independent seeded left/right static offsets and
  // a wobble phase, so the form is never mirror-perfect.
  // ------------------------------------------------------------------
  var LUMP = [
    [0.00, 0.50], [0.08, 0.56], [0.22, 0.55], [0.40, 0.47], [0.58, 0.36],
    [0.74, 0.25], [0.87, 0.16], [0.95, 0.10], [1.00, 0.055]
  ];
  var QUENA = [
    [0.00, 0.34], [0.05, 0.28], [0.18, 0.255], [0.38, 0.24], [0.58, 0.24],
    [0.76, 0.245], [0.88, 0.255], [0.95, 0.285], [1.00, 0.285]
  ];
  var NP = LUMP.length;
  var rng = mulberry32(BASE_SEED);
  var offL = [], offR = [], wobPhL = [], wobPhR = [], wobAmp = [], wobSpd = [];
  var i;
  for (i = 0; i < NP; i++) {
    offL.push((rng() * 2 - 1) * 0.012);
    offR.push((rng() * 2 - 1) * 0.012);
    wobPhL.push(rng() * Math.PI * 2);
    wobPhR.push(rng() * Math.PI * 2);
    wobAmp.push(0.5 + rng() * 0.7);
    wobSpd.push(0.6 + rng() * 0.8);
  }
  // Finger holes: height fractions down the front, seeded x jitter.
  var HOLES = [0.30, 0.38, 0.46, 0.54, 0.62, 0.70];
  var holeJit = [];
  for (i = 0; i < HOLES.length; i++) holeJit.push((rng() * 2 - 1) * 0.006);
  // Embers: seeded rise columns around the vessel.
  var EMBERS = [];
  for (i = 0; i < 26; i++) {
    EMBERS.push({
      x: (rng() * 2 - 1) * 0.16,
      ph: rng(),
      spd: 0.05 + rng() * 0.08,
      sway: rng() * Math.PI * 2,
      sz: 0.6 + rng() * 0.9
    });
  }
  // Breath lines: seeded curl drift per line.
  var breathDrift = [];
  for (i = 0; i < 5; i++) breathDrift.push((rng() * 2 - 1) * 0.055);
  // The sounding phrase: five notes from a breathy scale, seeded order
  // and detune, fixed for the life of the piece.
  var SCALE = [349.23, 392.00, 440.00, 493.88, 523.25];
  var NOTE_T = [32.3, 33.05, 33.7, 34.45, 35.15];
  var NOTES = [];
  for (i = 0; i < 5; i++) {
    NOTES.push({
      f: SCALE[Math.floor(rng() * SCALE.length)] * (1 + (rng() * 2 - 1) * 0.004),
      d: 0.6 + rng() * 0.35
    });
  }

  // ------------------------------------------------------------------
  // Canvas / viewport (Visual Viewport API, pinned in draw()).
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function isPhone(w, h) {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT()); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(currentT()); });
  }

  // ------------------------------------------------------------------
  // Anchored clock. Frame one is the synchronous draw at loop t = 0
  // (or at a QA-forced time via ?seed=tNN, inert in normal viewing).
  // Never derived from Date.now().
  // ------------------------------------------------------------------
  var forcedT = -1;
  if (typeof location !== 'undefined' && location.search) {
    var m = /seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
    if (m) forcedT = parseFloat(m[1]);
  }
  var anchor = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function currentT() {
    if (forcedT >= 0) return forcedT;
    if (typeof performance !== 'undefined' && performance.now) {
      return ((performance.now() - anchor) / 1000) % LOOP;
    }
    return 0;
  }
  function elapsed() {
    if (forcedT >= 0) return forcedT;
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - anchor) / 1000;
    }
    return 0;
  }

  // ------------------------------------------------------------------
  // Audio: lazily created, gesture-gated, typeof-guarded throughout.
  // The watch-only piece never creates a context on its own; a
  // pointerdown anywhere on the page unlocks it. The phrase fires from
  // the animation loop only when the context is running.
  // ------------------------------------------------------------------
  var audioCtx = null, audioUnlocked = false, noiseBuf = null;
  function unlockAudio() {
    try {
      var AC = (typeof window !== 'undefined') ? (window.AudioContext || window.webkitAudioContext) : null;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
      audioUnlocked = true;
    } catch (e) { /* silent: visual only */ }
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerdown', unlockAudio);
  }
  if (canvas.addEventListener) canvas.addEventListener('pointerdown', unlockAudio);

  function playNote(freq, dur) {
    if (!audioCtx || !audioUnlocked) return;
    try {
      if (audioCtx.state !== 'running') return;
      var t0 = audioCtx.currentTime;
      var gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.14, t0 + 0.09);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      var osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      // Slight pitch waver, hand-played imperfection.
      osc.frequency.setValueAtTime(freq * (1 + 0.0035 * Math.sin(2 * Math.PI * 5.5 * 0.0)), t0);
      var lfo = audioCtx.createOscillator();
      lfo.frequency.value = 5.5;
      var lfoGain = audioCtx.createGain();
      lfoGain.gain.value = freq * 0.0035;
      lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t0); lfo.start(t0);
      osc.stop(t0 + dur + 0.05); lfo.stop(t0 + dur + 0.05);
      // Breath: band-passed noise under the tone.
      if (!noiseBuf) {
        noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.6, audioCtx.sampleRate);
        var data = noiseBuf.getChannelData(0);
        var r = mulberry32(BASE_SEED + 7);
        for (var j = 0; j < data.length; j++) data[j] = r() * 2 - 1;
      }
      var src = audioCtx.createBufferSource();
      src.buffer = noiseBuf;
      var bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = freq * 2; bp.Q.value = 1.1;
      var ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.0001, t0);
      ng.gain.exponentialRampToValueAtTime(0.045, t0 + 0.07);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 0.9);
      src.connect(bp); bp.connect(ng); ng.connect(audioCtx.destination);
      src.start(t0); src.stop(t0 + dur);
    } catch (e) { /* silent */ }
  }
  var lastCycle = -1, fired = {};
  function audioTick() {
    if (!audioCtx || !audioUnlocked || forcedT >= 0) return;
    var el = elapsed();
    var cyc = Math.floor(el / LOOP);
    if (cyc !== lastCycle) { lastCycle = cyc; fired = {}; }
    var lt = el % LOOP;
    for (var j = 0; j < NOTE_T.length; j++) {
      if (!fired[j] && lt >= NOTE_T[j] && lt < NOTE_T[j] + 0.5) {
        fired[j] = true;
        playNote(NOTES[j].f, NOTES[j].d);
      }
    }
  }

  // ------------------------------------------------------------------
  // Geometry helpers.
  // ------------------------------------------------------------------
  function profilePoints(t, rise, cx, benchY, vesselH, maxR, wet) {
    // Returns array of [xLeft, xRight, y] per control point, bottom up.
    var pts = [];
    var hScale = lerp(0.34, 1.0, rise);
    for (var j = 0; j < NP; j++) {
      var yf = LUMP[j][0];
      var r = lerp(LUMP[j][1], QUENA[j][1], rise);
      var wob = wet * 0.010 * wobAmp[j];
      var rL = r + offL[j] + Math.sin(t * wobSpd[j] + wobPhL[j]) * wob;
      var rR = r + offR[j] + Math.sin(t * wobSpd[j] * 1.13 + wobPhR[j]) * wob;
      pts.push([cx - rL * maxR, cx + rR * maxR, benchY - yf * vesselH * hScale]);
    }
    return pts;
  }
  function traceProfile(pts, cx, formed, vesselH) {
    // Path: up the left side, across the top (with the mouthpiece
    // notch as `formed` grows), down the right side, close at base.
    var j, n = pts.length;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][2]);
    for (j = 1; j < n; j++) {
      var xc = (pts[j - 1][0] + pts[j][0]) / 2;
      var yc = (pts[j - 1][2] + pts[j][2]) / 2;
      ctx.quadraticCurveTo(pts[j - 1][0], pts[j - 1][2], xc, yc);
    }
    ctx.lineTo(pts[n - 1][0], pts[n - 1][2]);
    var topY = pts[n - 1][2];
    var notchW = (pts[n - 1][1] - pts[n - 1][0]) * 0.30;
    var notchD = formed * vesselH * 0.020;
    if (notchD > 0.4) {
      ctx.lineTo(cx - notchW, topY);
      ctx.lineTo(cx - notchW * 0.35, topY + notchD);
      ctx.lineTo(cx + notchW * 0.35, topY + notchD);
      ctx.lineTo(cx + notchW, topY);
    }
    ctx.lineTo(pts[n - 1][1], pts[n - 1][2]);
    for (j = n - 2; j >= 0; j--) {
      var xc2 = (pts[j + 1][1] + pts[j][1]) / 2;
      var yc2 = (pts[j + 1][2] + pts[j][2]) / 2;
      ctx.quadraticCurveTo(pts[j + 1][1], pts[j + 1][2], xc2, yc2);
    }
    ctx.lineTo(pts[0][1], pts[0][2]);
    ctx.closePath();
  }

  // ------------------------------------------------------------------
  // Draw one frame at loop time t. Pure function of t plus seeded data.
  // ------------------------------------------------------------------
  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var phone = isPhone(W, H);
    var S = Math.min(W, H);
    var cx = W / 2;
    var benchY = phone ? H * 0.72 : H * 0.70;
    var vesselH = phone ? H * 0.46 : S * 0.54;
    var maxR = vesselH * 0.30;

    // Stage parameters.
    var rise = smooth(0.5, 9.5, t);              // throwing
    var formed = smooth(10, 15, t);              // drying: holes, notch
    var dryMix = smooth(10, 13, t);              // wet -> dry tone
    var kiln = smooth(16, 18.5, t) * (1 - smooth(24, 26, t));
    var pulse = 0.75 + 0.25 * Math.sin(t * 2.1);
    var burnMix = smooth(26, 30, t);             // cooling -> burnished
    var wet = 1 - 0.55 * dryMix;                 // wobble calms as it dries

    // Ground.
    ctx.fillStyle = BENCH;
    ctx.fillRect(0, 0, W, H);
    // Bench surface and line.
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = WET;
    ctx.fillRect(0, benchY, W, H - benchY);
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = DRY;
    ctx.fillRect(0, benchY - 1, W, 2);
    ctx.globalAlpha = 1;
    // Contact shadow.
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = WET;
    ctx.beginPath();
    ctx.ellipse(cx, benchY + S * 0.012, maxR * 1.25, S * 0.016, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Main vessel pass (fades out late in the loop).
    var mainAlpha = 1 - smooth(36, 39.0, t);
    if (mainAlpha > 0.003) {
      var pts = profilePoints(t, rise, cx, benchY, vesselH, maxR, wet);
      ctx.globalAlpha = mainAlpha;
      // Base tone: wet, crossfaded to dry.
      traceProfile(pts, cx, formed, vesselH);
      ctx.fillStyle = WET;
      ctx.fill();
      if (dryMix > 0) {
        ctx.globalAlpha = mainAlpha * dryMix;
        traceProfile(pts, cx, formed, vesselH);
        ctx.fillStyle = DRY;
        ctx.fill();
        ctx.globalAlpha = mainAlpha;
      }
      // Cooling: burnished finish takes over.
      if (burnMix > 0) {
        ctx.globalAlpha = mainAlpha * burnMix;
        traceProfile(pts, cx, formed, vesselH);
        ctx.fillStyle = BURN;
        ctx.fill();
        ctx.globalAlpha = mainAlpha;
      }
      // Kiln core glow: an inner scaled profile, flat layered shape.
      if (kiln > 0.003) {
        var core = [];
        for (var j = 0; j < NP; j++) {
          core.push([cx + (pts[j][0] - cx) * 0.62, cx + (pts[j][1] - cx) * 0.62,
                     benchY - (benchY - pts[j][2]) * 0.86]);
        }
        ctx.globalAlpha = mainAlpha * kiln * (0.35 + 0.30 * pulse);
        traceProfile(core, cx, 0, vesselH);
        ctx.fillStyle = KILN;
        ctx.fill();
        ctx.globalAlpha = mainAlpha * kiln * (0.30 + 0.25 * pulse);
        var core2 = [];
        for (var k = 0; k < NP; k++) {
          core2.push([cx + (pts[k][0] - cx) * 0.34, cx + (pts[k][1] - cx) * 0.34,
                      benchY - (benchY - pts[k][2]) * 0.70]);
        }
        traceProfile(core2, cx, 0, vesselH);
        ctx.fillStyle = KILN;
        ctx.fill();
        ctx.globalAlpha = mainAlpha;
      }
      // Mouthpiece window (labium), as the form settles.
      if (formed > 0.05 && rise > 0.9) {
        var topY = pts[NP - 1][2];
        ctx.globalAlpha = mainAlpha * formed * 0.8;
        ctx.fillStyle = BENCH;
        ctx.beginPath();
        ctx.ellipse(cx, topY + vesselH * 0.045, maxR * 0.10, vesselH * 0.016, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      // Finger holes down the front.
      if (formed > 0.02) {
        ctx.fillStyle = BENCH;
        for (var hI = 0; hI < HOLES.length; hI++) {
          var ha = formed * smooth(0, 1, (formed * HOLES.length - hI) / 1.5 + 0.4);
          if (ha <= 0.02) continue;
          var hy = benchY - HOLES[hI] * vesselH;
          // Only once the body is tall enough to hold the hole.
          if (hy < pts[NP - 1][2] + vesselH * 0.05) continue;
          ctx.globalAlpha = mainAlpha * clamp(ha, 0, 1) * 0.85;
          ctx.beginPath();
          ctx.ellipse(cx + holeJit[hI] * S, hy, S * 0.011, S * 0.014, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }

    // The new lump fades in over the finished quena's fade.
    var lumpAlpha = smooth(37.6, 39.9, t);
    if (lumpAlpha > 0.003) {
      var lp = profilePoints(t, 0, cx, benchY, vesselH, maxR, 1);
      ctx.globalAlpha = lumpAlpha;
      traceProfile(lp, cx, 0, vesselH);
      ctx.fillStyle = WET;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Embers rise around the vessel during the kiln stage.
    if (kiln > 0.003) {
      ctx.fillStyle = KILN;
      for (var e = 0; e < EMBERS.length; e++) {
        var em = EMBERS[e];
        var frac = (t * em.spd + em.ph) % 1;
        var ey = benchY - frac * vesselH * 0.9;
        var ex = cx + em.x * S + Math.sin(t * 0.8 + em.sway) * S * 0.012;
        var ea = kiln * (1 - frac) * 0.8;
        if (ea <= 0.01) continue;
        ctx.globalAlpha = ea;
        ctx.beginPath();
        ctx.ellipse(ex, ey, em.sz * S * 0.004, em.sz * S * 0.007, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Breath lines rise from the mouth during the sounding stage.
    if (t >= 32 && t < 36.5) {
      var mouthY = benchY - vesselH;
      var riseH = Math.min(S * 0.30, mouthY - H * 0.04);
      ctx.strokeStyle = BREATH;
      ctx.lineCap = 'round';
      for (var b = 0; b < 5; b++) {
        var age = t - (32 + b * 0.7);
        if (age <= 0 || age > 3.4) continue;
        var grow = clamp(age / 2.2, 0, 1);
        var fade = Math.sin(Math.PI * clamp(age / 3.4, 0, 1));
        ctx.lineWidth = Math.max(1, S * 0.003);
        var segs = 20;
        var px = cx, py = mouthY;
        for (var s2 = 1; s2 <= segs; s2++) {
          var u = (s2 / segs) * grow;
          var yy = mouthY - u * riseH;
          var xx = cx + Math.sin(u * 5 + b * 1.7 + age * 0.7) * S * 0.032 * u + u * u * breathDrift[b] * S;
          ctx.globalAlpha = 0.7 * fade * (1 - u * 0.55);
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(xx, yy);
          ctx.stroke();
          px = xx; py = yy;
        }
      }
      ctx.globalAlpha = 1;
    }

    // Kiln warmth: one flat tint over the whole frame, pulsing.
    if (kiln > 0.003) {
      ctx.globalAlpha = kiln * (0.075 + 0.03 * Math.sin(t * 2.1));
      ctx.fillStyle = KILN;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // ------------------------------------------------------------------
  // Run. Synchronous first frame at t = 0 (deterministic), then the
  // anchored rAF loop when available.
  // ------------------------------------------------------------------
  resize();
  draw(forcedT >= 0 ? forcedT : 0);
  if (typeof requestAnimationFrame === 'function') {
    var tick = function () {
      draw(currentT());
      audioTick();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
