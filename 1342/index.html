<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finite / Infinite</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0C0B0A; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var WALL = '#0C0B0A';
  var LETTER = [245, 242, 234];   /* #F5F2EA */
  var DISSOLVE = [138, 133, 120]; /* #8A8578 */
  var BRONZE = '#A67B4F';
  var EDGE = '#2A2622';

  var S1 = ['WE', 'MUST', 'ACCEPT', 'FINITE', 'DISAPPOINTMENT'];
  var S2 = ['BUT', 'NEVER', 'LOSE', 'INFINITE', 'HOPE'];
  /* Two shared-grid lines. Sentence two's words sit in the gaps after
     sentence one's words: true interleaving, not a crossfade. */
  var LINES = [
    { s1: [0, 1, 2, 3], s2: [0, 1, 2, 3] },
    { s1: [4], s2: [4] }
  ];

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, DPR = 1;
  var isPhone = false;

  function viewportSize() {
    var vw, vh;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      vw = visualViewport.width; vh = visualViewport.height;
    } else {
      vw = window.innerWidth; vh = window.innerHeight;
    }
    return { w: vw, h: vh };
  }

  function detectPhone() {
    var minDim = 99999;
    try {
      if (window.screen && window.screen.width && window.screen.height) {
        minDim = Math.min(window.screen.width, window.screen.height);
      }
    } catch (e) { /* ignore */ }
    if (minDim < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var s = viewportSize();
    W = s.w; H = s.h;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    isPhone = detectPhone();
  }

  /* Interleave parameter: 0 = sentence one, 1 = sentence two.
     Auto-cycle is a 20 s triangle: rise 0-10 s, fall 10-20 s. */
  var cycleOffset = 0;      /* seconds added to piece time for the cycle */
  var dragging = false;
  var dragStartX = 0, dragStartT = 0, manualT = 0;
  var boot = true;

  function smoothstep(x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    return x * x * (3 - 2 * x);
  }

  function cycleParam(pieceT) {
    var ph = ((pieceT + cycleOffset) % 20 + 20) % 20;
    if (ph < 10) return smoothstep(ph / 10);
    return 1 - smoothstep((ph - 10) / 10);
  }

  function cycleRising(pieceT) {
    var ph = ((pieceT + cycleOffset) % 20 + 20) % 20;
    return ph < 10;
  }

  function currentT(pieceT) {
    if (dragging) return manualT;
    return cycleParam(pieceT);
  }

  function mix(a, b, f) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * f),
      Math.round(a[1] + (b[1] - a[1]) * f),
      Math.round(a[2] + (b[2] - a[2]) * f)
    ];
  }

  function rgba(c, a) {
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  /* Per-letter stagger offsets, seeded once (never Math.random). */
  var stag = [];
  (function () {
    var rng = mulberry32(1342000);
    var i;
    for (i = 0; i < 64; i++) stag.push(rng() * 0.25);
  })();

  function letterAlpha(t, idx, sentence) {
    var o = stag[(idx * 7 + (sentence === 2 ? 31 : 0)) % 64];
    if (sentence === 1) {
      var a1 = 1 - (t * 1.25 - o);
      if (a1 < 0) return 0;
      if (a1 > 1) return 1;
      return a1;
    }
    var a2 = t * 1.25 - 0.25 + o;
    if (a2 < 0) return 0;
    if (a2 > 1) return 1;
    return a2;
  }

  function draw(pieceT) {
    var t = currentT(pieceT);
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    /* Ambient edge light: flat-alpha bands, never a gradient. */
    ctx.fillStyle = 'rgba(42,38,34,0.55)';
    ctx.fillRect(0, 0, W, Math.max(2, H * 0.012));
    ctx.fillRect(0, H - Math.max(2, H * 0.012), W, Math.max(2, H * 0.012));
    ctx.fillStyle = 'rgba(42,38,34,0.28)';
    ctx.fillRect(0, 0, Math.max(2, W * 0.008), H);
    ctx.fillRect(W - Math.max(2, W * 0.008), 0, Math.max(2, W * 0.008), H);

    /* Faint seeded wall speckle, deterministic. */
    var rng = mulberry32(1342001);
    var i, sx, sy;
    ctx.fillStyle = 'rgba(245,242,234,0.03)';
    for (i = 0; i < 90; i++) {
      sx = rng() * W; sy = rng() * H;
      ctx.fillRect(sx, sy, 2, 2);
    }

    /* Fit the type: two lines, each a combined alternating sequence of
       sentence-one and sentence-two words sharing one grid. At t=0 only
       the sentence-one words show; at t=1 only the sentence-two words;
       at the midpoint both sit half-legible, interleaved. */
    var maxW = W * (isPhone ? 0.92 : 0.86);
    var fontPx = Math.min(W * 0.11, H * 0.14);
    var fontStack = '700 ' + fontPx + 'px "Arial Narrow", "Helvetica Neue", Arial, sans-serif';
    ctx.font = fontStack;
    ctx.textBaseline = 'alphabetic';
    var gap = fontPx * 0.9;
    var li, wi, lineW, line;
    function measureLine(words) {
      var w = 0, k;
      for (k = 0; k < words.length; k++) {
        if (k > 0) w += gap;
        w += ctx.measureText(words[k]).width;
      }
      return w;
    }
    /* Combined sequences: alternate sentence-one and sentence-two words. */
    var seqs = [];
    for (li = 0; li < LINES.length; li++) {
      line = LINES[li];
      var seq = [];
      var n = Math.max(line.s1.length, line.s2.length);
      for (var k = 0; k < n; k++) {
        if (k < line.s1.length) seq.push({ w: S1[line.s1[k]], s: 1 });
        if (k < line.s2.length) seq.push({ w: S2[line.s2[k]], s: 2 });
      }
      seqs.push(seq);
    }
    var widest = 0;
    for (li = 0; li < seqs.length; li++) {
      lineW = measureLine(seqs[li].map(function (e) { return e.w; }));
      if (lineW > widest) widest = lineW;
    }
    if (widest > maxW) {
      fontPx = fontPx * (maxW / widest);
      gap = fontPx * 0.9;
      ctx.font = '700 ' + fontPx + 'px "Arial Narrow", "Helvetica Neue", Arial, sans-serif';
    }
    var lineH = fontPx * 1.55;
    var blockH = lineH * seqs.length;
    var top = (H - blockH) / 2 + fontPx * 0.9;

    /* Draw both sentences letter by letter on the shared grid. */
    var y, x, word, wx, ch, cx, a, col;
    for (li = 0; li < seqs.length; li++) {
      var seq = seqs[li];
      y = top + li * lineH;
      var totalW = measureLine(seq.map(function (e) { return e.w; }));
      cx = (W - totalW) / 2;
      for (wi = 0; wi < seq.length; wi++) {
        word = seq[wi].w;
        for (var ci = 0; ci < word.length; ci++) {
          ch = word.charAt(ci);
          a = letterAlpha(t, wi * 5 + ci, seq[wi].s);
          if (a > 0) {
            col = mix(LETTER, DISSOLVE, 1 - a);
            ctx.fillStyle = rgba(col, a);
            ctx.fillText(ch, cx, y);
          }
          cx += ctx.measureText(ch).width;
        }
        cx += gap;
      }
    }

    /* Bronze underline: one rule beneath the block, spanning the shared
       grid, underlining whichever sentence is currently legible. */
    var uw = widest;
    var uy = top + (seqs.length - 1) * lineH + fontPx * 0.42;
    ctx.fillStyle = BRONZE;
    ctx.fillRect((W - uw) / 2, uy, uw, Math.max(2, fontPx * 0.045));
  }

  function onDown(e) {
    var p = pointerPos(e);
    dragging = true;
    dragStartX = p.x;
    dragStartT = cycleParam(lastPieceT);
    manualT = dragStartT;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pointerPos(e);
    var dx = p.x - dragStartX;
    manualT = dragStartT + dx / W * 1.5;
    if (manualT < 0) manualT = 0;
    if (manualT > 1) manualT = 1;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    /* Resume the auto-cycle from the scrubbed state, keeping direction. */
    var rising = cycleRising(lastPieceT);
    var desiredPhase = rising ? manualT * 10 : 20 - manualT * 10;
    cycleOffset = desiredPhase - lastPieceT;
    if (e.preventDefault) e.preventDefault();
  }
  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    var x = 0, y = 0;
    if (e.touches && e.touches.length) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
    else if (e.clientX !== undefined) { x = e.clientX; y = e.clientY; }
    return { x: x - r.left, y: y - r.top };
  }

  var lastPieceT = 0;
  var startTime = null;

  function loop(ts) {
    if (startTime === null) startTime = ts;
    lastPieceT = (ts - startTime) / 1000;
    draw(lastPieceT);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }

  function init() {
    resize();
    try {
      canvas.addEventListener('pointerdown', onDown, false);
      canvas.addEventListener('pointermove', onMove, false);
      canvas.addEventListener('pointerup', onUp, false);
      canvas.addEventListener('pointercancel', onUp, false);
      canvas.addEventListener('touchstart', onDown, false);
      canvas.addEventListener('touchmove', onMove, false);
      canvas.addEventListener('touchend', onUp, false);
    } catch (e) { /* QA renderer has no pointer events */ }
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('resize', function () { resize(); draw(lastPieceT); }, false);
      if (typeof visualViewport !== 'undefined' && visualViewport) {
        visualViewport.addEventListener('resize', function () { resize(); draw(lastPieceT); }, false);
      }
    }
    draw(0);
    boot = false;
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }

  init();
})();
</script>
</body>
</html>
