<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№25 · Interference</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ecdc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(43,58,103,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(242,236,220,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another interference</div>
<script>
'use strict';
// No25 Interference.
// A plain dot grid whose radii are set by the product of two linear
// waves, one running across, one running down: r follows
// (0.5 + 0.5 sin(kx x + p1)) x (0.5 + 0.5 sin(ky y + p2)). Where both
// waves crest, dots are fat; where either troughs, they vanish, so
// the grid breaks into islands of tone arranged on the diagonal.
// Single indigo ink on cream. The wave numbers are small integers or
// half-integers, gated so neither wave dominates: if one frequency
// runs away, the piece collapses into stripes.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '25', 10) || 25;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f2ecdc';
const INK = '#2b3a67';

function compose(s) {
  const rnd = mulberry32(s);
  const kx = 2 + ((rnd() * 4) | 0);
  const ky = 2 + ((rnd() * 4) | 0);
  return {
    kx, ky,
    p1: rnd() * Math.PI * 2, p2: rnd() * Math.PI * 2,
    ok: Math.abs(kx - ky) <= 2 && !(kx === ky && kx > 4)
  };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h);
  const ox = (w - S) / 2, oy = (h - S) / 2;
  const N = 44;
  const cell = S / N;
  ctx.fillStyle = INK;
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const u = (i + 0.5) / N, v = (j + 0.5) / N;
      const wx = 0.5 + 0.5 * Math.sin(u * p.kx * Math.PI * 2 + p.p1);
      const wy = 0.5 + 0.5 * Math.sin(v * p.ky * Math.PI * 2 + p.p2);
      const r = cell * 0.48 * Math.pow(wx * wy, 0.6);
      if (r < 0.3) continue;
      ctx.beginPath();
      ctx.arc(ox + u * S, oy + v * S, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
