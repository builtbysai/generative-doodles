<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Density, Drawn</title>
<style>
html, body { margin: 0; padding: 0; background: #262422; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: two funnels face each other across a dark room, nearly touching at
   the narrow ends, and the ink inside them breathes like a tide: one funnel
   fills with dense black scratches while the other thins to a few loose
   threads, then the tide turns and they trade places. */
var TAU = Math.PI * 2;
var GROUND = '#262422';
var GROUND_LIGHT = '#2E2B28';
var INK = '#0E0D0C';
var CHALK = '#EDEAE3';
var CHALK_SOFT = '#C9C4BA';
var OXIDE = '#A63E28';
var OXIDE_DEEP = '#7E2E1E';
var PLATE = '#EDEAE3';
var PLATE_LINE = 'rgba(14,13,12,0.35)';
var TITLE_INK = '#1A1816';
var HINT_INK = '#4A463F';
var FRAME_T = 60.0;        /* fixed phase for frame one */
var NMAX = 240;            /* loops per funnel at full density */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- funnels, in fractions of the square field ----
   Left funnel: wide opening at the left edge, narrow tip near the center.
   Right funnel: mirror image, washed in oxide red. */
var FUNNELS = [
  { dir: -1, wash: false, seed: 1858, ph: 0.0 },
  { dir: 1, wash: true, seed: 2858, ph: Math.PI }
];
/* Precompute every scribble loop once, from seeded PRNGs only. A loop has a
   position along the funnel axis (u, 0 wide end to 1 tip), a cross position
   (v, -1 to 1), a size, a tilt, and jitter for its bezier handles. */
function buildLoops(seed) {
  var rng = mulberry32(seed);
  var loops = [], i;
  for (i = 0; i < NMAX; i++) {
    var u = rng();
    var v = (rng() * 2 - 1) * 0.85 * (1 - u * 0.12);
    loops.push({
      u: u, v: v,
      size: 0.008 + rng() * 0.016 * (1 - u * 0.45),
      tilt: (rng() - 0.5) * 1.6,
      jx: (rng() - 0.5) * 0.02, jy: (rng() - 0.5) * 0.02,
      a: 0.45 + rng() * 0.40
    });
  }
  return loops;
}
var LOOPS = [buildLoops(FUNNELS[0].seed), buildLoops(FUNNELS[1].seed)];
/* Density is a slow tide with a 53 second period. At the fixed first frame
   (t = 60) the left funnel is dense and the right funnel sparse, mid-breath. */
function density(f, t) {
  return 0.55 + 0.45 * Math.sin(TAU * t / 53 + f.ph);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Centered geometric composition: a centered square on every screen, the
   page ground is the piece's own charcoal. */
function fieldRect() {
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* Funnel outline in field fractions: wide end, tip, and center line. */
function funnelGeom(f, rc) {
  var cx = 0.5, cy = 0.5;
  var tipX = cx + f.dir * 0.035;
  var wideX = cx + f.dir * 0.44;
  var wideHalf = 0.32, tipHalf = 0.035;
  return {
    tipX: rc.x + tipX * rc.w, wideX: rc.x + wideX * rc.w,
    cy: rc.y + cy * rc.h, wideHalf: wideHalf * rc.h, tipHalf: tipHalf * rc.h,
    dir: f.dir, rc: rc
  };
}
function loopPos(g, lp) {
  var x = lerp(g.wideX, g.tipX, lp.u);
  var half = lerp(g.wideHalf, g.tipHalf, lp.u);
  var y = g.cy + lp.v * half * 0.82;
  var r = lp.size * g.rc.w;
  /* keep every loop inside the funnel walls */
  var loX = Math.min(g.wideX, g.tipX) + r * 1.05;
  var hiX = Math.max(g.wideX, g.tipX) - r * 1.05;
  x = clamp(x, loX, hiX);
  var maxDy = Math.max(half * 0.92 - r, 0);
  y = clamp(y, g.cy - maxDy, g.cy + maxDy);
  return { x: x, y: y, r: r };
}
function drawLoop(p, lp, t) {
  var r = p.r;
  var breathe = 1 + 0.08 * Math.sin(TAU * t / 53 + lp.u * 2.1);
  var rr = r * breathe;
  /* a scribble is two overlapping open loops, not one clean closed petal */
  ctx.beginPath();
  ctx.moveTo(p.x + rr * Math.cos(lp.tilt), p.y + rr * Math.sin(lp.tilt));
  ctx.ellipse(p.x, p.y, rr, rr * 0.7, lp.tilt, 0, Math.PI * 2 * 0.85);
  ctx.stroke();
  var ox = p.x + lp.jx * rr * 2, oy = p.y + lp.jy * rr * 2;
  var tilt2 = lp.tilt + 0.7;
  ctx.beginPath();
  ctx.moveTo(ox + rr * 0.6 * Math.cos(tilt2), oy + rr * 0.6 * Math.sin(tilt2));
  ctx.ellipse(ox, oy, rr * 0.6, rr * 0.45, tilt2, 0, Math.PI * 2 * 0.9);
  ctx.stroke();
}
function drawFunnel(f, fi, rc, t) {
  var g = funnelGeom(f, rc);
  var m = Math.min(rc.w, rc.h);
  /* interior wash: a touch lighter charcoal on the left, oxide red on the right */
  ctx.beginPath();
  ctx.moveTo(g.wideX, g.cy - g.wideHalf);
  ctx.quadraticCurveTo(lerp(g.wideX, g.tipX, 0.5), g.cy - lerp(g.wideHalf, g.tipHalf, 0.5) * 0.96, g.tipX, g.cy - g.tipHalf);
  ctx.lineTo(g.tipX, g.cy + g.tipHalf);
  ctx.quadraticCurveTo(lerp(g.wideX, g.tipX, 0.5), g.cy + lerp(g.wideHalf, g.tipHalf, 0.5) * 0.96, g.wideX, g.cy + g.wideHalf);
  ctx.closePath();
  if (f.wash) {
    var wg = ctx.createLinearGradient(g.wideX, 0, g.tipX, 0);
    wg.addColorStop(0, rgba(OXIDE, 0.85));
    wg.addColorStop(1, rgba(OXIDE_DEEP, 0.55));
    ctx.fillStyle = wg;
  } else {
    ctx.fillStyle = GROUND_LIGHT;
  }
  ctx.fill();
  /* scribble field: only the first count loops show, so density reads as a
     tide rising and falling; the earliest loops are the loose sparse threads */
  var d = density(f, t);
  var count = Math.floor(d * NMAX);
  var loops = LOOPS[fi];
  var i, p;
  ctx.lineWidth = Math.max(1, m * 0.0022);
  for (i = 0; i < count; i++) {
    p = loopPos(g, loops[i]);
    /* chalk under-stroke, faint, so the black ink reads on the dark ground */
    ctx.strokeStyle = rgba(CHALK, 0.14 * loops[i].a);
    drawLoop(p, loops[i], t);
    ctx.strokeStyle = rgba(INK, loops[i].a);
    drawLoop(p, loops[i], t);
  }
  /* chalk outline, hand-drawn weight */
  ctx.strokeStyle = rgba(CHALK, 0.85);
  ctx.lineWidth = Math.max(1.5, m * 0.0035);
  ctx.beginPath();
  ctx.moveTo(g.wideX, g.cy - g.wideHalf);
  ctx.quadraticCurveTo(lerp(g.wideX, g.tipX, 0.5), g.cy - lerp(g.wideHalf, g.tipHalf, 0.5) * 0.96, g.tipX, g.cy - g.tipHalf);
  ctx.moveTo(g.tipX, g.cy + g.tipHalf);
  ctx.quadraticCurveTo(lerp(g.wideX, g.tipX, 0.5), g.cy + lerp(g.wideHalf, g.tipHalf, 0.5) * 0.96, g.wideX, g.cy + g.wideHalf);
  ctx.stroke();
  /* wide-end rim */
  ctx.beginPath();
  ctx.moveTo(g.wideX, g.cy - g.wideHalf);
  ctx.lineTo(g.wideX, g.cy + g.wideHalf);
  ctx.stroke();
}
function drawLabels(rc) {
  var m = Math.min(rc.w, rc.h);
  var px = isPhone ? 11 : 13;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = rgba(CHALK, 0.92);
  ctx.font = px + 'px monospace';
  var label = 'D Y N A M I C S   D E N S I T Y';
  while (px > 8 && ctx.measureText(label).width > rc.w * 0.86) {
    px -= 1;
    ctx.font = px + 'px monospace';
  }
  ctx.fillText(label, rc.x + rc.w / 2, rc.y + rc.h * 0.925);
  /* small tick where the narrow ends nearly touch */
  ctx.strokeStyle = rgba(CHALK, 0.55);
  ctx.lineWidth = Math.max(1, m * 0.002);
  var cx = rc.x + rc.w / 2, cy = rc.y + rc.h / 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy - m * 0.012);
  ctx.lineTo(cx, cy + m * 0.012);
  ctx.stroke();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Density, Drawn').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Density, Drawn').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 12').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Density, Drawn', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 12', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the density breathe.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var rc = fieldRect();
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var i;
  for (i = 0; i < FUNNELS.length; i++) drawFunnel(FUNNELS[i], i, rc, t);
  drawLabels(rc);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    funnelCount: FUNNELS.length,
    loopCount: NMAX
  };
}
/* ---- frame one: fixed phase t = 60.0 s, left funnel dense, right sparse ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
