<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>39508</title>
<style>
html, body { margin: 0; padding: 0; background: #EFEDE6; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* 39508 - No.1618 (sableraph #213, PP865 SP3)
   A dense page of Adam Smith, struck character by character as editions
   are bought. One tap is one edition. Irreversible, persisted. */
var PAPER = '#EFEDE6';
var INK = '#2A2A2E';
var RED = '#B03A2E';
var PHASE = 0;
var PER_EDITION = 4;          /* characters struck per edition bought */
var TOTAL_EDITIONS = 10000;
var TOTAL_CHARS = 37326;      /* corpus length; 37326 - 412*4 = 35678 remain */
var START_EDITIONS = 412;     /* fixed mid-erasure start: counter reads 412 / 35678 */
var FADE_S = 2.0;             /* ink-fade of the newly struck characters */
var STORE_KEY = 'doodles-1618-editions';
var COLS = 88;                /* fixed monospace grid; hard wrap, never reflows */

var PASSAGE = 'The greatest improvement in the productive powers of labour, and the greater part of the skill, dexterity, and judgment with which it is anywhere directed, or applied, seem to have been the effects of the division of labour. ';
/* Fixed corpus: the passage tiled and cut to exactly TOTAL_CHARS. */
var CORPUS = '';
(function () {
  while (CORPUS.length < TOTAL_CHARS) CORPUS += PASSAGE;
  CORPUS = CORPUS.slice(0, TOTAL_CHARS);
})();

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var INK_RGB = hexRgb(INK);

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}

/* ---- editions: fixed start; persisted only when localStorage exists ---- */
var editions = START_EDITIONS;
var fadeStart = -1e9;   /* piece time of the last bought edition; -inf = no fade */
var lastTapT = -1e9;
(function () {
  if (typeof localStorage === 'undefined') return;
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw !== null) {
      var n = parseInt(raw, 10);
      if (!isNaN(n) && n >= 0 && n <= TOTAL_EDITIONS) editions = n;
    }
  } catch (e) { /* storage unavailable: stay at the fixed start */ }
})();
function saveEditions() {
  if (typeof localStorage === 'undefined') return;
  try { localStorage.setItem(STORE_KEY, String(editions)); } catch (e) { /* ignore */ }
}

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Centered square text block on every size; ground is the paper itself. */
function compRect() {
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function geom(rect) {
  var s = rect.w;
  var blockX = rect.x + 0.06 * s;
  var blockW = 0.88 * s;
  var blockTop = rect.y + 0.135 * s;
  var blockBottom = rect.y + 0.855 * s;
  var cw = blockW / COLS;
  var fs = cw / 0.6;                 /* Courier advance is 0.6em */
  var lh = fs * 1.25;
  var rows = Math.floor((blockBottom - blockTop) / lh);
  return {
    s: s, blockX: blockX, blockW: blockW, blockTop: blockTop,
    cw: cw, fs: fs, lh: lh, rows: rows,
    titleY: rect.y + 0.018 * s,
    dateY: rect.y + 0.072 * s,
    counterY: rect.y + 0.882 * s,
    ledgerY: rect.y + 0.912 * s,
    hintY: rect.y + 0.932 * s,
    cx: rect.x + s / 2
  };
}
function struckCount() { return Math.min(editions * PER_EDITION, TOTAL_CHARS); }
function remaining() { return TOTAL_CHARS - struckCount(); }

function drawText(g, t) {
  var visible = COLS * g.rows;              /* chars shown on this page */
  var struck = Math.min(struckCount(), visible);
  var fadeEnd = struck;                     /* newest struck chars fade */
  var fadeBegin = fadeEnd - PER_EDITION;
  var fading = (t - fadeStart) < FADE_S && fadeStart > -1e8;
  var fadeA = fading ? clamp(1 - (t - fadeStart) / FADE_S, 0, 1) : 0;
  ctx.font = g.fs + 'px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  var r, lineStart, lineEnd, x, y, a, b;
  for (r = 0; r < g.rows; r++) {
    lineStart = r * COLS;
    lineEnd = Math.min(lineStart + COLS, visible);
    y = g.blockTop + r * g.lh;
    if (lineStart >= struck) {
      /* Whole line intact: one run. */
      ctx.fillStyle = INK;
      ctx.fillText(CORPUS.slice(lineStart, lineEnd), g.blockX, y);
      continue;
    }
    if (lineEnd <= struck) {
      /* Whole line struck: hairline gaps, nothing drawn. */
      if (fading && lineEnd > fadeBegin) {
        /* The fade band ends inside this fully-struck line. */
        a = Math.max(lineStart, fadeBegin);
        ctx.fillStyle = rgba(INK_RGB, fadeA);
        for (var i = a; i < lineEnd; i++) {
          ctx.fillText(CORPUS.charAt(i), g.blockX + (i - lineStart) * g.cw, y);
        }
      }
      continue;
    }
    /* Line straddles the erasure edge. */
    if (fading && lineStart < fadeBegin) {
      a = Math.max(lineStart, fadeBegin);
      ctx.fillStyle = rgba(INK_RGB, fadeA);
      for (var j = a; j < struck; j++) {
        ctx.fillText(CORPUS.charAt(j), g.blockX + (j - lineStart) * g.cw, y);
      }
    } else if (fading && lineStart >= fadeBegin) {
      ctx.fillStyle = rgba(INK_RGB, fadeA);
      for (var k = lineStart; k < struck; k++) {
        ctx.fillText(CORPUS.charAt(k), g.blockX + (k - lineStart) * g.cw, y);
      }
    }
    /* Intact run after the struck prefix. */
    x = g.blockX + (struck - lineStart) * g.cw;
    ctx.fillStyle = INK;
    ctx.fillText(CORPUS.slice(struck, lineEnd), x, y);
  }
}

function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  var g = geom(rect);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + Math.round(0.042 * g.s) + 'px "Courier New", monospace';
  ctx.fillText('39508', g.cx, g.titleY);
  ctx.font = Math.round(0.024 * g.s) + 'px "Courier New", monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.65);
  ctx.fillText('2006 · 06 · 17', g.cx, g.dateY);
  drawText(g, t);
  /* Counter line with the red ledger rule beneath it. */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = Math.round(0.023 * g.s) + 'px "Courier New", monospace';
  ctx.fillStyle = INK;
  ctx.fillText('EDITIONS ' + editions + ' / ' + TOTAL_EDITIONS +
    ' · CHARACTERS REMAINING ' + remaining(), g.cx, g.counterY);
  ctx.fillStyle = RED;
  ctx.fillRect(g.blockX, Math.round(g.ledgerY), g.blockW, Math.max(1.5, 0.002 * g.s));
  ctx.font = Math.round(0.021 * g.s) + 'px "Courier New", monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.7);
  ctx.fillText('Tap to buy an edition.', g.cx, g.hintY);
}

/* ---- tap is the transaction: one tap, one edition, no double-tap ---- */
var downX = 0, downY = 0, down = false;
function onDown(e) {
  down = true;
  downX = (typeof e.clientX === 'number') ? e.clientX : 0;
  downY = (typeof e.clientY === 'number') ? e.clientY : 0;
}
function onUp(e) {
  if (!down) return;
  down = false;
  var x = (typeof e.clientX === 'number') ? e.clientX : 0;
  var y = (typeof e.clientY === 'number') ? e.clientY : 0;
  var dx = x - downX, dy = y - downY;
  if (dx * dx + dy * dy > 12 * 12) return;          /* a drag is not a tap */
  if (lastT - lastTapT < FADE_S) return;            /* one tap per fade window */
  if (editions >= TOTAL_EDITIONS) return;
  editions += 1;
  lastTapT = lastT;
  fadeStart = lastT;
  saveEditions();
  draw(lastT);
}
function onCancel() { down = false; }
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onCancel);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
