<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Shot, Foundation Stone</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- palette (prompt only) ----
  var FIELD = '#2a2a30';
  var CREAM = '#e8e0d0';
  var GOLD = '#d9a441';
  var MUTED = ['#b8bcc0', '#4a5a7a', '#6b4a3a', '#2e6f6a'];

  // ---- seeded PRNG (mulberry32), never Math.random ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1498000);

  // ---- candidates: doorway, window, road, face-shape, tree ----
  // entry: edge the candidate drifts in from; angle: hover position around centre.
  var CANDS = [
    { kind: 'doorway', color: MUTED[0], entry: 'left',   angle: 210 },
    { kind: 'window',  color: MUTED[1], entry: 'top',    angle: 150 },
    { kind: 'road',    color: MUTED[2], entry: 'right',  angle: 30 },
    { kind: 'face',    color: MUTED[3], entry: 'bottom', angle: 330 },
    { kind: 'tree',    color: MUTED[0], entry: 'left',   angle: 90 }
  ];
  // second candidate colour stream so tree differs from doorway in tone use
  CANDS[4].color = MUTED[1];

  var LOOP = 120;          // two 60 s choosings; frame one repeats exactly at t=120
  var CHOOSING = 60;
  var SLOT = 8;            // approach 3 s, hover 3 s, leave 2 s
  var SETTLE_T = 40, RINGS_T = 46, CLEAR_T = 54;
  var SCHEDULED = [1, 4];  // choosing 0 settles the window, choosing 1 the tree

  // ---- sizing ----
  var W = 0, H = 0, CX = 0, CY = 0, U = 0;
  function size() {
    var vw = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : window;
    W = vw.width; H = vw.height;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    CX = W / 2; CY = H / 2; U = Math.min(W, H);
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(now); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { size(); draw(now); });
    }
  }

  // ---- helpers ----
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function round4(v) { return Math.round(v * 10000) / 10000; }
  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mixHex(a, b, t) {
    var ca = hexRgb(a), cb = hexRgb(b);
    return 'rgb(' + Math.round(lerp(ca[0], cb[0], t)) + ',' +
      Math.round(lerp(ca[1], cb[1], t)) + ',' + Math.round(lerp(ca[2], cb[2], t)) + ')';
  }
  function rgba(hex, a) {
    var c = hexRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + round4(a) + ')';
  }
  function hoverPos(c) {
    var r = 0.30 * U, a = c.angle * Math.PI / 180;
    return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
  }
  function entryPos(c) {
    var m = 0.06 * U;
    if (c.entry === 'left') return { x: -m, y: CY };
    if (c.entry === 'right') return { x: W + m, y: CY };
    if (c.entry === 'top') return { x: CX, y: -m };
    return { x: CX, y: H + m };
  }
  function exitPos(c) {
    // leaves toward a different edge than it entered from
    var m = 0.06 * U;
    if (c.entry === 'left') return { x: W + m, y: CY - 0.12 * U };
    if (c.entry === 'right') return { x: -m, y: CY + 0.12 * U };
    if (c.entry === 'top') return { x: CX + 0.12 * U, y: H + m };
    return { x: CX - 0.12 * U, y: -m };
  }

  // ---- drag events (closed-form replay) ----
  // { target, tDown, tUp, moves: [{t,x,y}], mode: 'choose'|'dismiss'|null }
  var drags = [];
  var active = null;
  var now = 0;

  // shifted loop time: every state derives from ltOf(t), so drags are
  // scoped to the loop instance they occurred in and loop closure is exact.
  function ltOf(t) { return (((t + PHASE) % LOOP) + LOOP) % LOOP; }
  function choosingOf(t) { return Math.floor(ltOf(t) / CHOOSING); }
  function loopOf(t) { return Math.floor((t + PHASE) / LOOP); }
  function ctOf(t) { return ltOf(t) - choosingOf(t) * CHOOSING; }

  function chosenIdx(choosing, t) {
    // latest choose-drag in this choosing of this loop (event time <= t) wins
    var idx = SCHEDULED[choosing];
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (d.mode === 'choose' && choosingOf(d.tUp) === choosing && loopOf(d.tUp) === loopOf(t) && d.tUp <= t) idx = d.target;
    }
    return idx;
  }
  function dismissedAt(target, choosing, t) {
    // latest dismiss-drag for this candidate in this choosing of this loop
    var at = -1;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (d.mode === 'dismiss' && d.target === target && choosingOf(d.tUp) === choosing && loopOf(d.tUp) === loopOf(t) && d.tUp <= t) at = d.tUp;
    }
    return at;
  }
  function dragState(target, choosing, t) {
    // returns {held:{x,y}} while dragging, {heldAt:{x,y},tUp} after a choose-drag,
    // {dismissAt, x, y} after a dismiss-drag, else null
    for (var i = drags.length - 1; i >= 0; i--) {
      var d = drags[i];
      if (d.target !== target || choosingOf(d.tDown) !== choosing || loopOf(d.tDown) !== loopOf(t)) continue;
      if (d.tUp === null && d.tDown <= t) {
        var last = d.moves[d.moves.length - 1];
        return { held: { x: last.x, y: last.y } };
      }
      if (d.tUp !== null && d.tUp <= t) {
        if (d.mode === 'choose') {
          var p = d.moves[d.moves.length - 1];
          return { heldAt: { x: p.x, y: p.y }, tUp: d.tUp };
        }
        if (d.mode === 'dismiss') return { dismissAt: d.tUp, x: d.moves[d.moves.length - 1].x, y: d.moves[d.moves.length - 1].y };
      }
    }
    return null;
  }

  // ---- candidate drawing (flat shapes, no text) ----
  function drawCand(kind, x, y, s, color, alpha, edgeGold) {
    ctx.save();
    ctx.globalAlpha = round4(alpha);
    ctx.translate(x, y);
    if (kind === 'doorway') {
      ctx.fillStyle = color;
      ctx.fillRect(-0.45 * s, -0.65 * s, 0.9 * s, 1.3 * s);
      ctx.fillStyle = FIELD;
      ctx.fillRect(-0.28 * s, -0.45 * s, 0.56 * s, 1.1 * s);
    } else if (kind === 'window') {
      ctx.fillStyle = color;
      ctx.fillRect(-0.55 * s, -0.55 * s, 1.1 * s, 1.1 * s);
      ctx.fillStyle = FIELD;
      ctx.fillRect(-0.4 * s, -0.4 * s, 0.8 * s, 0.8 * s);
      ctx.fillStyle = color;
      ctx.fillRect(-0.04 * s, -0.4 * s, 0.08 * s, 0.8 * s);
      ctx.fillRect(-0.4 * s, -0.04 * s, 0.8 * s, 0.08 * s);
    } else if (kind === 'road') {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-0.7 * s, 0.5 * s);
      ctx.lineTo(0.7 * s, 0.5 * s);
      ctx.lineTo(0.25 * s, -0.5 * s);
      ctx.lineTo(-0.25 * s, -0.5 * s);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = FIELD;
      ctx.fillRect(-0.05 * s, -0.35 * s, 0.1 * s, 0.7 * s);
    } else if (kind === 'face') {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, -0.6 * s);
      ctx.ellipse(0, 0, 0.55 * s, 0.6 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = FIELD;
      ctx.fillRect(-0.3 * s, -0.15 * s, 0.12 * s, 0.12 * s);
      ctx.fillRect(0.18 * s, -0.15 * s, 0.12 * s, 0.12 * s);
      ctx.fillRect(-0.2 * s, 0.28 * s, 0.4 * s, 0.07 * s);
    } else if (kind === 'tree') {
      ctx.fillStyle = color;
      ctx.fillRect(-0.09 * s, 0.1 * s, 0.18 * s, 0.6 * s);
      ctx.beginPath();
      ctx.moveTo(0, -0.65 * s);
      ctx.arc(0, -0.15 * s, 0.5 * s, 0, Math.PI * 2);
      ctx.fill();
    }
    if (edgeGold) {
      ctx.strokeStyle = GOLD;
      ctx.lineWidth = Math.max(2, 0.03 * s);
      ctx.strokeRect(-0.62 * s, -0.72 * s, 1.24 * s, 1.44 * s);
    }
    ctx.restore();
  }

  // ---- main draw: t in seconds, loop-local ----
  // phase shift so frame one opens mid-approach (candidate 0 half-entered)
  // rather than on a fully empty field; loop closure is unaffected because
  // every state derives from this shifted loop-local time.
  var PHASE = 1.5;
  function draw(t) {
    now = t;
    var lt = ltOf(t);
    var choosing = Math.floor(lt / CHOOSING);
    var ct = lt - choosing * CHOOSING;
    var s = 0.09 * U;

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    var chosen = chosenIdx(choosing, t);

    // candidates in slot order
    for (var i = 0; i < CANDS.length; i++) {
      var c = CANDS[i];
      var slot = i * SLOT;
      var hov = hoverPos(c);
      var ent = entryPos(c);
      var ex = exitPos(c);
      var isChosen = (i === chosen);
      var ds = dragState(i, choosing, t);
      var dis = dismissedAt(i, choosing, t);

      // dismissed early: 2 s leave from release position, then gone
      if (ds && ds.dismissAt !== undefined) {
        var q = (ct - ctOf(dis)) / 2;
        if (q >= 0 && q < 1) {
          var px = lerp(ds.x, ex.x, smooth(q));
          var py = lerp(ds.y, ex.y, smooth(q));
          drawCand(c.kind, px, py, s, c.color, 1 - q, false);
        }
        continue;
      }
      // while dragging: candidate follows the pointer
      if (ds && ds.held) {
        drawCand(c.kind, ds.held.x, ds.held.y, s, c.color, 1, false);
        continue;
      }

      if (ct < slot) continue; // not yet arrived

      if (isChosen) {
        if (ct < SETTLE_T) {
          // hold at hover (bob on loop-local phase), or held at drag release spot
          var hx = hov.x, hy = hov.y;
          if (ds && ds.heldAt) { hx = ds.heldAt.x; hy = ds.heldAt.y; }
          else {
            var bob = Math.sin(2 * Math.PI * (ct - slot - 3) / 6);
            hy = hov.y + bob * 0.012 * U;
          }
          drawCand(c.kind, hx, hy, s, c.color, 1, false);
        } else if (ct < RINGS_T) {
          // sink to centre, morph to cream with gold edge
          var p = easeOut((ct - SETTLE_T) / (RINGS_T - SETTLE_T));
          var sx = ds && ds.heldAt ? ds.heldAt.x : hov.x;
          var sy = ds && ds.heldAt ? ds.heldAt.y : hov.y;
          var col = mixHex(c.color, CREAM, p);
          drawCand(c.kind, lerp(sx, CX, p), lerp(sy, CY, p), s * (1 + 0.4 * p), col, 1, p > 0.5);
        } else if (ct < CLEAR_T) {
          // stone at centre; rings grow outward, faint, staggered
          drawCand(c.kind, CX, CY, s * 1.4, CREAM, 1, true);
          for (var r = 0; r < 4; r++) {
            var rp = (ct - RINGS_T - r * 1.5) / 8;
            if (rp >= 0 && rp <= 1) {
              ctx.save();
              ctx.globalAlpha = round4(0.35 * (1 - rp));
              ctx.strokeStyle = CREAM;
              ctx.lineWidth = Math.max(1, 0.008 * U);
              ctx.beginPath();
              ctx.moveTo(CX + (0.12 + rp * 0.38) * U, CY);
              ctx.arc(CX, CY, (0.12 + rp * 0.38) * U, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();
            }
          }
        } else {
          // field clears: stone fades out
          var f = (ct - CLEAR_T) / (CHOOSING - CLEAR_T);
          drawCand(c.kind, CX, CY, s * 1.4, CREAM, 1 - f, true);
        }
        continue;
      }

      // scheduled chosen displaced by a drag override: leaves over 2 s from hover
      if (i === SCHEDULED[choosing] && i !== chosen) {
        var ov = -1;
        for (var oi = 0; oi < drags.length; oi++) {
          var od = drags[oi];
          if (od.mode === 'choose' && od.target !== i && choosingOf(od.tUp) === choosing && loopOf(od.tUp) === loopOf(t) && od.tUp <= t) ov = od.tUp;
        }
        if (ov >= 0) {
          var oq = (ct - ctOf(ov)) / 2;
          if (oq >= 0 && oq < 1) {
            drawCand(c.kind, lerp(hov.x, ex.x, smooth(oq)), lerp(hov.y, ex.y, smooth(oq)), s, c.color, 1 - oq, false);
          }
          continue;
        }
      }

      // ordinary candidate: approach / hover / leave
      if (ct < slot + 3) {
        var ap = smooth((ct - slot) / 3);
        drawCand(c.kind, lerp(ent.x, hov.x, ap), lerp(ent.y, hov.y, ap), s, c.color, 1, false);
      } else if (ct < slot + 6) {
        var bob2 = Math.sin(2 * Math.PI * (ct - slot - 3) / 6);
        drawCand(c.kind, hov.x, hov.y + bob2 * 0.012 * U, s, c.color, 1, false);
      } else if (ct < slot + 8) {
        var lp = (ct - slot - 6) / 2;
        drawCand(c.kind, lerp(hov.x, ex.x, smooth(lp)), lerp(hov.y, ex.y, smooth(lp)), s, c.color, 1 - lp, false);
      }
      // after leave: gone
    }
  }

  // ---- pointer interaction ----
  function candAt(x, y, t) {
    var lt = ltOf(t);
    var choosing = Math.floor(lt / CHOOSING);
    var ct = lt - choosing * CHOOSING;
    var s = 0.09 * U;
    var chosen = chosenIdx(choosing, t);
    for (var i = 0; i < CANDS.length; i++) {
      if (i === chosen && ct >= SETTLE_T) continue; // stone is not draggable
      var slot = i * SLOT;
      if (ct < slot || ct >= slot + 6) continue; // only arriving / hovering candidates
      if (dismissedAt(i, choosing, t) >= 0) continue;
      var hov = hoverPos(CANDS[i]);
      var ent = entryPos(CANDS[i]);
      var px, py;
      if (ct < slot + 3) {
        var ap = smooth((ct - slot) / 3);
        px = lerp(ent.x, hov.x, ap); py = lerp(ent.y, hov.y, ap);
      } else { px = hov.x; py = hov.y; }
      var dx = x - px, dy = y - py;
      if (dx * dx + dy * dy <= (1.1 * s) * (1.1 * s)) return i;
    }
    return -1;
  }
  function onDown(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX || 0) - r.left, y = (e.clientY || 0) - r.top;
    var idx = candAt(x, y, now);
    if (idx >= 0) {
      active = { target: idx, tDown: now, moves: [{ t: now, x: x, y: y }], tUp: null, mode: null };
      drags.push(active);
    }
  }
  function onMove(e) {
    if (!active) return;
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX || 0) - r.left, y = (e.clientY || 0) - r.top;
    active.moves.push({ t: now, x: x, y: y });
    draw(now);
  }
  function onUp(e) {
    if (!active) return;
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX || 0) - r.left, y = (e.clientY || 0) - r.top;
    active.moves.push({ t: now, x: x, y: y });
    active.tUp = now;
    var dx = x - CX, dy = y - CY;
    var dc = Math.sqrt(dx * dx + dy * dy);
    var hov = hoverPos(CANDS[active.target]);
    var dh = Math.sqrt((x - hov.x) * (x - hov.x) + (y - hov.y) * (y - hov.y));
    if (dc <= 0.16 * U) active.mode = 'choose';
    else if (dh >= 0.22 * U) active.mode = 'dismiss';
    else { active.mode = null; drags.pop(); }
    active = null;
    draw(now);
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);

  // ---- boot: fixed-phase first frame, clock starts with the rAF loop ----
  draw(0);
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    draw((ts - startT) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  // ---- probe interface (QA harness only) ----
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      setTime: function (t) { now = t; },
      down: function (x, y) { onDown({ clientX: x, clientY: y || 0 }); },
      move: function (x, y) { onMove({ clientX: x, clientY: y || 0 }); },
      up: function (x, y) {
        var last = active && active.moves[active.moves.length - 1];
        onUp({ clientX: (x !== undefined ? x : (last ? last.x : 0)), clientY: (y !== undefined ? y : (last ? last.y : 0)) });
      }
    };
  }
})();
</script>
</body>
</html>
