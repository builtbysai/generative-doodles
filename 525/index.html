<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saints and Suns</title>
<style>
  html, body { margin: 0; padding: 0; background: #F7F2E4; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (the only colors in the piece) ----------
  var RED = '#E6392B', BLUE = '#2B4FE0', WHITE = '#FFFFFF',
      TEAL = '#39B8A5', GOLD = '#F5B301', CREAM = '#F7F2E4';
  var SHOULDER_COLS = [RED, BLUE, TEAL, GOLD];

  // ---------- grain (precomputed seeded specks, drawn directly) ----------
  var grain = [];
  (function () {
    var rng = mulberry32(525999);
    var cols = ['230,57,43', '43,79,224', '245,179,1', '57,184,165', '255,255,255'];
    for (var g = 0; g < 750; g++) {
      grain.push({
        x: rng(), y: rng(), a: rng() * Math.PI,
        l: 2 + rng() * 4.5,
        col: cols[(rng() * cols.length) | 0],
        al: 0.04 + rng() * 0.06
      });
    }
  })();

  // ---------- quilt layout (reseeded on tap) ----------
  var layoutSeed = 525063;
  var cells = [];      // 9 cells, row-major
  var checkerFlip = 0; // global checker phase, flips on reseed
  var pulseSun = 0;    // index into suns[] that pulses
  var suns = [
    { x: 1 / 3, y: 1 / 3 }, { x: 2 / 3, y: 1 / 3 },
    { x: 1 / 3, y: 2 / 3 }, { x: 2 / 3, y: 2 / 3 },
    { x: 0, y: 0 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 1 }
  ];
  function buildLayout() {
    var rng = mulberry32(layoutSeed);
    cells = [];
    for (var j = 0; j < 3; j++) {
      for (var i = 0; i < 3; i++) {
        var base = (i + j) % 2 === 0 ? RED : BLUE;   // alternating checker color
        var avoid = base === RED ? 0 : 1;            // SHOULDER_COLS index of base
        var sh = (rng() * SHOULDER_COLS.length) | 0;
        if (sh === avoid) sh = (sh + 1) % SHOULDER_COLS.length;
        cells.push({
          i: i, j: j,
          halo: (rng() * 3) | 0,        // 0 ring, 1 disc, 2 ring + rays
          eyes: (rng() * 3) | 0,        // 0 dots, 1 closed arcs, 2 dot + arc
          mark: (rng() * 3) | 0,        // 0 none, 1 gold cross, 2 gold dot
          shoulder: SHOULDER_COLS[sh],
          rot: (rng() - 0.5) * 0.22     // slight halo ray rotation jitter
        });
      }
    }
    checkerFlip = (rng() * 2) | 0;
    pulseSun = (rng() * suns.length) | 0;
  }
  buildLayout();

  // ---------- viewport / stage ----------
  var W = 0, H = 0, SX = 0, SY = 0, SS = 0;
  var isPhone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SS = Math.min(w, h);
    SX = (w - SS) / 2; SY = (h - SS) / 2;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || h > w * 1.15;
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- tap to reseed ----------
  var curT = 0, fadeFrom = -10;
  function reseed() {
    layoutSeed = (Math.imul(layoutSeed, 1664525) + 1013904223) >>> 0;
    buildLayout();
    fadeFrom = curT;
  }
  var pX = null, pY = null, pT = 0;
  function pdown(e) { pX = e.clientX; pY = e.clientY; pT = performance.now(); }
  function pup(e) {
    if (pX === null) return;
    var dx = e.clientX - pX, dy = e.clientY - pY;
    if (Math.sqrt(dx * dx + dy * dy) < 12 && performance.now() - pT < 500) reseed();
    pX = null;
  }
  canvas.addEventListener('pointerdown', pdown);
  canvas.addEventListener('pointerup', pup);
  canvas.addEventListener('dblclick', reseed);
  canvas.addEventListener('touchstart', function (e) { if (e.touches[0]) pdown(e.touches[0]); }, { passive: true });
  canvas.addEventListener('touchend', function (e) { if (e.changedTouches[0]) pup(e.changedTouches[0]); }, { passive: true });

  // ---------- drawing helpers (stage units: 1 = full stage) ----------
  function X(u) { return SX + u * SS; }
  function Y(u) { return SY + u * SS; }
  function circ(x, y, r, col) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * SS, 0, Math.PI * 2); ctx.fill();
  }
  function ring(x, y, r, wdt, col) {
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS;
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * SS, 0, Math.PI * 2); ctx.stroke();
  }
  function diamondPath(cx, cy, r) {
    ctx.beginPath();
    ctx.moveTo(X(cx), Y(cy - r));
    ctx.lineTo(X(cx + r), Y(cy));
    ctx.lineTo(X(cx), Y(cy + r));
    ctx.lineTo(X(cx - r), Y(cy));
    ctx.closePath();
  }

  var CELL = 1 / 3, R = 1 / 6;

  function drawSun(s, idx, t) {
    var pulse = idx === pulseSun ? 1 + 0.13 * Math.sin(t * Math.PI * 2 / 3.6) : 1;
    var rDisc = 0.050 * pulse, rTip = 0.102 * pulse, rBase = 0.055 * pulse;
    // ray petals: blue triangles, gold outline
    ctx.fillStyle = BLUE; ctx.strokeStyle = GOLD; ctx.lineWidth = 0.0018 * SS; ctx.lineJoin = 'round';
    for (var k = 0; k < 12; k++) {
      var a = k * Math.PI / 6 + 0.13;
      var a1 = a - 0.105, a2 = a + 0.105;
      ctx.beginPath();
      ctx.moveTo(X(s.x + Math.cos(a1) * rBase), Y(s.y + Math.sin(a1) * rBase));
      ctx.lineTo(X(s.x + Math.cos(a) * rTip), Y(s.y + Math.sin(a) * rTip));
      ctx.lineTo(X(s.x + Math.cos(a2) * rBase), Y(s.y + Math.sin(a2) * rBase));
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    circ(s.x, s.y, rDisc, BLUE);
    ring(s.x, s.y, rDisc, 0.0026, GOLD);
    circ(s.x, s.y, 0.012 * pulse, GOLD);
  }

  function drawPortrait(cell, cx, cy) {
    var checkerCol = ((cell.i + cell.j + checkerFlip) % 2 === 0) ? RED : BLUE;
    var hy = cy - 0.020;
    // halo (behind the head)
    if (cell.halo === 1) {
      circ(cx, hy, 0.056, GOLD);
    } else {
      if (cell.halo === 2) { // short rays around the ring
        ctx.strokeStyle = GOLD; ctx.lineWidth = 0.0035 * SS; ctx.lineCap = 'round';
        for (var k = 0; k < 8; k++) {
          var a = k * Math.PI / 4 + cell.rot;
          ctx.beginPath();
          ctx.moveTo(X(cx + Math.cos(a) * 0.058), Y(hy + Math.sin(a) * 0.058));
          ctx.lineTo(X(cx + Math.cos(a) * 0.070), Y(hy + Math.sin(a) * 0.070));
          ctx.stroke();
        }
      }
      ring(cx, hy, 0.052, 0.0075, GOLD);
    }
    // shoulders (trapezoid, stays inside the diamond)
    ctx.fillStyle = cell.shoulder;
    ctx.beginPath();
    ctx.moveTo(X(cx - 0.034), Y(cy + 0.045));
    ctx.lineTo(X(cx + 0.034), Y(cy + 0.045));
    ctx.lineTo(X(cx + 0.048), Y(cy + 0.104));
    ctx.lineTo(X(cx - 0.048), Y(cy + 0.104));
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = GOLD; ctx.lineWidth = 0.0022 * SS; ctx.stroke();
    // chest mark
    if (cell.mark === 1) { // small gold cross
      ctx.strokeStyle = GOLD; ctx.lineWidth = 0.004 * SS; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(X(cx), Y(cy + 0.058)); ctx.lineTo(X(cx), Y(cy + 0.090));
      ctx.moveTo(X(cx - 0.010), Y(cy + 0.070)); ctx.lineTo(X(cx + 0.010), Y(cy + 0.070));
      ctx.stroke();
    } else if (cell.mark === 2) {
      circ(cx, cy + 0.074, 0.0075, GOLD);
    }
    // face
    circ(cx, hy, 0.034, WHITE);
    ring(cx, hy, 0.034, 0.0024, GOLD);
    // eyes
    ctx.strokeStyle = checkerCol; ctx.fillStyle = checkerCol; ctx.lineCap = 'round';
    if (cell.eyes === 0) {
      circ(cx - 0.012, hy - 0.002, 0.0034, checkerCol);
      circ(cx + 0.012, hy - 0.002, 0.0034, checkerCol);
    } else if (cell.eyes === 1) {
      ctx.lineWidth = 0.0032 * SS;
      ctx.beginPath(); ctx.arc(X(cx - 0.012), Y(hy - 0.004), 0.006 * SS, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      ctx.beginPath(); ctx.arc(X(cx + 0.012), Y(hy - 0.004), 0.006 * SS, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    } else {
      circ(cx - 0.012, hy - 0.002, 0.0034, checkerCol);
      ctx.lineWidth = 0.0032 * SS;
      ctx.beginPath(); ctx.arc(X(cx + 0.012), Y(hy - 0.004), 0.006 * SS, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    }
    // mouth: small gold arc
    ctx.strokeStyle = GOLD; ctx.lineWidth = 0.0032 * SS;
    ctx.beginPath(); ctx.arc(X(cx), Y(hy + 0.008), 0.0085 * SS, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  }

  function drawCell(cell) {
    var cx = (cell.i + 0.5) * CELL, cy = (cell.j + 0.5) * CELL;
    var checkerCol = ((cell.i + cell.j + checkerFlip) % 2 === 0) ? RED : BLUE;
    // checkerboard clipped to the diamond
    ctx.save();
    diamondPath(cx, cy, R);
    ctx.clip();
    var sq = CELL / 8, x0 = cx - R, y0 = cy - R;
    for (var gy = 0; gy < 8; gy++) {
      for (var gx = 0; gx < 8; gx++) {
        ctx.fillStyle = ((gx + gy + cell.i + cell.j) % 2 === 0) ? checkerCol : WHITE;
        ctx.fillRect(X(x0 + gx * sq), Y(y0 + gy * sq), sq * SS + 1, sq * SS + 1);
      }
    }
    drawPortrait(cell, cx, cy);
    ctx.restore();
    // gold edge
    diamondPath(cx, cy, R);
    ctx.strokeStyle = GOLD; ctx.lineWidth = 0.0048 * SS; ctx.lineJoin = 'round';
    ctx.stroke();
  }

  function draw(t) {
    curT = t;
    // pin canvas css size every frame (house rule)
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // page ground
    ctx.fillStyle = CREAM; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath(); ctx.rect(SX, SY, SS, SS); ctx.clip();
    ctx.fillStyle = CREAM; ctx.fillRect(SX, SY, SS, SS);

    // very slow breath: whole quilt scales a touch about the stage centre
    var b = 1 + 0.008 * Math.sin(t * Math.PI * 2 / 16);
    ctx.translate(X(0.5), Y(0.5));
    ctx.scale(b, b);
    ctx.translate(-X(0.5), -Y(0.5));

    // suns in the gaps (interior gaps + quarter suns at the corners)
    for (var si = 0; si < suns.length; si++) drawSun(suns[si], si, t);
    // diamond medallions
    for (var ci = 0; ci < cells.length; ci++) drawCell(cells[ci]);
    // gold dots where diamond points meet along the edges
    ctx.fillStyle = GOLD;
    var pts = [[1 / 3, 0], [2 / 3, 0], [1 / 3, 1], [2 / 3, 1], [0, 1 / 3], [0, 2 / 3], [1, 1 / 3], [1, 2 / 3]];
    for (var pi = 0; pi < pts.length; pi++) circ(pts[pi][0], pts[pi][1], 0.0075, GOLD);

    // grain specks (precomputed, drawn directly)
    for (var gi = 0; gi < grain.length; gi++) {
      var gr = grain[gi];
      ctx.strokeStyle = 'rgba(' + gr.col + ',' + gr.al + ')';
      ctx.lineWidth = Math.max(1, 0.0013 * SS);
      ctx.beginPath();
      ctx.moveTo(X(gr.x), Y(gr.y));
      ctx.lineTo(X(gr.x + Math.cos(gr.a) * gr.l / 1080), Y(gr.y + Math.sin(gr.a) * gr.l / 1080));
      ctx.stroke();
    }

    ctx.restore();

    // reseed transition fade (cream veil decaying over 0.6 s)
    var fa = 0.55 * (1 - (t - fadeFrom) / 0.6);
    if (fa > 0) {
      ctx.fillStyle = 'rgba(247,242,228,' + fa + ')';
      ctx.fillRect(SX, SY, SS, SS);
    }
  }

  // ---------- deterministic first frame + loop ----------
  var PHASE0 = 1.9; // constant loop phase for frame one
  draw(PHASE0);
  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    draw(PHASE0 + (now - startStamp) / 1000);
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
