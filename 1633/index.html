<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint, Vanish, Repeat</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EAD8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F2EAD8';
var WASH = '#D9D9D2';
var INK = '#2B2B28';
var SEED = 1633007;
var PAINT_BASE = 24;      /* base paint duration in seconds, cycle 1 */
var VANISH = 6;           /* vanishing crossfade lasts 6 seconds */
var GROUPS = 8;           /* stroke groups, laid down centre outward */
var SIENNA = '#A0522D';
var INDIGO = '#2E4057';
var OXBLOOD = '#6E2434';
var INK_COLORS = [SIENNA, INDIGO, OXBLOOD];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var PAPER_RGB = hexRgb(PAPER);
var WASH_RGB = hexRgb(WASH);
var INK_RGB = hexRgb(INK);
var COLOR_RGB = [];
var ci;
for (ci = 0; ci < INK_COLORS.length; ci++) COLOR_RGB.push(hexRgb(INK_COLORS[ci]));
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Portrait field composition: full-bleed on phones, centred portrait
   sheet on desktop with the page ground the piece's own paper cream. */
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var h = Math.min(VH * 0.92, VW * 1.15);
  var w = h * 0.75;
  return { x: (VW - w) / 2, y: (VH - h) / 2, w: w, h: h };
}
/* ---- one paint cycle: seeded, perturbed every cycle ----
   Strokes are stored in units of Rmax so the same cycle draws correctly
   at any viewport size. Group g is the g-th ring out from the centre. */
var cycleCache = [];
function getCycle(c) {
  if (cycleCache[c]) return cycleCache[c];
  var rng = mulberry32(SEED + c * 7919);
  var timeScale = 0.7 + rng() * 0.9;
  var rotation = rng() * TAU;
  var paintDur = PAINT_BASE * timeScale;
  var strokes = [];
  var g, j;
  for (g = 0; g < GROUPS; g++) {
    var ring = 0.16 + 0.84 * (g + 0.5) / GROUPS;
    var nStrokes = 7 + Math.floor(rng() * 3);
    for (j = 0; j < nStrokes; j++) {
      var ang = rotation + rng() * TAU;
      var rr = ring * (0.82 + rng() * 0.36);
      var kind = rng() < 0.55 ? 'arc' : 'circle';
      var a0 = rng() * TAU;
      var span = (0.5 + rng() * 1.4) * Math.PI;
      var color = Math.floor(rng() * 3);
      var alpha = kind === 'arc' ? 0.55 + rng() * 0.4 : 0.5 + rng() * 0.35;
      var fillA = kind === 'circle' ? 0.16 + rng() * 0.18 : 0;
      strokes.push({
        group: g, idx: j, nInGroup: nStrokes, kind: kind,
        ox: Math.cos(ang) * rr, oy: Math.sin(ang) * rr,
        r: 0.05 + rng() * 0.11, a0: a0, span: span,
        color: color, alpha: alpha, fillA: fillA,
        lw: 1.6 + rng() * 1.8,
        ticks: kind === 'arc' ? 4 + Math.floor(rng() * 5) : 0
      });
    }
  }
  /* Easter egg: one small indigo eight-point star, seeded position,
     visible only while the painting vanishes. */
  var eggAng = rng() * TAU;
  var eggR = 0.25 + rng() * 0.45;
  var egg = { ox: Math.cos(eggAng) * eggR, oy: Math.sin(eggAng) * eggR, size: 0.05 + rng() * 0.02 };
  var cyc = { cycle: c, timeScale: timeScale, rotation: rotation,
              paintDur: paintDur, strokes: strokes, egg: egg };
  cycleCache[c] = cyc;
  return cyc;
}
function paintDur(c) { return getCycle(c).paintDur; }
function cycleStart(c) {
  var t = 0, k;
  for (k = 0; k < c; k++) t += paintDur(k) + VANISH;
  return t;
}
function cycleAt(t) {
  var c = 0, acc = 0;
  while (c < 1000) {
    var pd = paintDur(c);
    var len = pd + VANISH;
    if (t < acc + len) return { cycle: c, local: t - acc, paintDur: pd };
    acc += len; c++;
  }
  return { cycle: c, local: 0, paintDur: paintDur(c) };
}
/* ---- drawing ---- */
function drawStroke(rect, cx, cy, Rmax, s, p, strokeMul) {
  var scale = Rmax / 260;
  var x = cx + s.ox * Rmax;
  var y = cy + s.oy * Rmax * 1.05;
  var r = s.r * Rmax;
  var col = COLOR_RGB[s.color];
  var a = s.alpha * strokeMul;
  var lw = Math.max(1, s.lw * scale);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (s.kind === 'circle' && s.fillA > 0) {
    ctx.fillStyle = rgba(col, (s.fillA * p * strokeMul).toFixed(4) * 1);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }
  ctx.strokeStyle = rgba(col, a);
  ctx.lineWidth = lw;
  ctx.beginPath();
  var end = s.a0 + s.span * p;
  /* AGENTS.md node-canvas rule: moveTo before every batched arc. */
  ctx.moveTo(x + Math.cos(s.a0) * r, y + Math.sin(s.a0) * r);
  ctx.arc(x, y, r, s.a0, end);
  ctx.stroke();
  if (s.kind === 'arc' && s.ticks > 0) {
    var shown = Math.floor(p * s.ticks);
    var i;
    ctx.lineWidth = Math.max(1, lw * 0.6);
    ctx.beginPath();
    for (i = 0; i < shown; i++) {
      var ta = s.a0 + (i + 0.5) / s.ticks * s.span;
      var tx = x + Math.cos(ta) * r, ty = y + Math.sin(ta) * r;
      var nx = Math.cos(ta), ny = Math.sin(ta);
      var tl = 5 * scale + r * 0.12;
      ctx.moveTo(tx - nx * tl, ty - ny * tl);
      ctx.lineTo(tx + nx * tl, ty + ny * tl);
    }
    ctx.stroke();
  }
  return { x: x + Math.cos(end) * r, y: y + Math.sin(end) * r, color: col, on: p > 0 && p < 1 };
}
function drawEgg(rect, cx, cy, Rmax, egg, alpha) {
  var x = cx + egg.ox * Rmax;
  var y = cy + egg.oy * Rmax * 1.05;
  var s = egg.size * Rmax;
  var col = COLOR_RGB[1];
  ctx.strokeStyle = rgba(col, alpha);
  ctx.lineWidth = Math.max(1.5, Rmax / 260 * 2);
  ctx.lineCap = 'round';
  ctx.beginPath();
  var k;
  for (k = 0; k < 8; k++) {
    var a = k * Math.PI / 4;
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * s, y + Math.sin(a) * s);
  }
  ctx.stroke();
  ctx.fillStyle = rgba(col, alpha);
  ctx.beginPath();
  ctx.arc(x, y, Math.max(1.5, s * 0.18), 0, TAU);
  ctx.fill();
}
function drawText(rect) {
  var titlePx = isPhone ? 18 : 20;
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var titleW = ctx.measureText('Paint, Vanish, Repeat').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 02').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = cxm - plateW / 2, plateY = rect.y + 10;
  ctx.fillStyle = PAPER;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Paint, Vanish, Repeat', cxm, plateY + 8);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.75);
  ctx.fillText('2006 · 07 · 02', cxm, plateY + 8 + titlePx + 4);
  var hint = 'Tap to pause the painting mid-stroke.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = rect.y + rect.h - hintPlateH - 10;
  ctx.fillStyle = PAPER;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.fillStyle = rgba(INK_RGB, 0.85);
  ctx.fillText(hint, cxm, hintPlateY + 7);
}
function draw(t) {
  size();
  var rect = compRect();
  var cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
  var Rmax = Math.min(rect.w, rect.h) * 0.44;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  var st = cycleAt(t);
  var cyc = getCycle(st.cycle);
  var fade = 0, strokeMul = 1, washA = 0;
  if (st.local >= st.paintDur) {
    fade = clamp((st.local - st.paintDur) / VANISH, 0, 1);
    strokeMul = 1 - 0.96 * fade;
    washA = 0.85 * fade;
  }
  var paintT = Math.min(st.local, st.paintDur);
  var tip = null;
  var i, s;
  for (i = 0; i < cyc.strokes.length; i++) {
    s = cyc.strokes[i];
    var groupStart = s.group / GROUPS * st.paintDur;
    var groupDur = st.paintDur / GROUPS;
    var strokeDur = groupDur / s.nInGroup;
    var start = groupStart + s.idx * strokeDur;
    var p = clamp((paintT - start) / strokeDur, 0, 1);
    if (p <= 0) continue;
    var res = drawStroke(rect, cx, cy, Rmax, s, p, strokeMul);
    if (res.on && fade === 0) tip = res;
  }
  if (tip) {
    ctx.fillStyle = 'rgb(' + tip.color[0] + ',' + tip.color[1] + ',' + tip.color[2] + ')';
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, Math.max(2, Rmax / 260 * 3), 0, TAU);
    ctx.fill();
  }
  if (washA > 0) {
    ctx.fillStyle = rgba(WASH_RGB, washA);
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
  }
  if (fade > 0) {
    var eggA = Math.min(fade * 1.2, 1);
    if (fade > 0.9) eggA = eggA * (1 - fade) / 0.1;
    if (eggA > 0) drawEgg(rect, cx, cy, Rmax, cyc.egg, eggA * 0.95);
  }
  drawText(rect);
}
/* ---- pause: tap freezes the brush agents where they stand ---- */
var paused = false;
var clock = 0;
var lastTs = null;
function onTap() {
  paused = !paused;
}
if (typeof canvas.addEventListener === 'function') canvas.addEventListener('pointerdown', onTap);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
/* QA hook: ?cycle=K previews cycle K at a mid-paint phase. */
function queryCycle() {
  if (typeof location === 'undefined' || !location.search) return -1;
  var m = location.search.match(/cycle=(\d+)/);
  if (!m) return -1;
  return parseInt(m[1], 10);
}
/* ---- frame one: fixed phase, mid-paint of the current cycle ---- */
var startCycle = queryCycle();
if (startCycle < 0) startCycle = 0;
var PHASE = cycleStart(startCycle) + 0.45 * paintDur(startCycle);
size();
if (reduced) {
  draw(cycleStart(startCycle) + paintDur(startCycle));
} else {
  clock = PHASE;
  draw(clock);
  function loop(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (!paused) clock += dt;
    draw(clock);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
