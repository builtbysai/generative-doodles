<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songs for Birds That No Longer Sing</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1430000);

  // Round fading alphas to 4 decimals (node-canvas misparses scientific notation as opaque).
  function a4(x) {
    if (x < 0) x = 0; if (x > 1) x = 1;
    return Math.round(x * 10000) / 10000;
  }
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  var ROOM = '#141210', CLAY = '#b89a78', FEATHER = '#e8e2d4';
  var GOLD = '#d4a24e', GUESS = '#5a7a9a', NOTE = '#e8e2d4', STAND = '#6a5138';

  var W = 0, H = 0, isPhone = false;
  function size() {
    var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var minScreen = Math.min(window.screen.width, window.screen.height);
    isPhone = minScreen < 700 || H > W * 1.15;
  }
  size();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { size(); draw(clockT); });
  }
  window.addEventListener('resize', function () { size(); draw(clockT); });

  // ---- Call shape -------------------------------------------------------
  // u in [0,1) along the arc. Gap where no description survives: [0.55, 0.70).
  var GAP0 = 0.55, GAP1 = 0.70;
  function callAmp(u) {
    if (u >= GAP0 && u < GAP1) return 0;
    if (u < 0.30) { var k = u / 0.30; return k * k * (3 - 2 * k); }
    if (u < 0.55) return 1 - 0.12 * Math.sin((u - 0.30) / 0.25 * Math.PI * 2);
    if (u < 0.90) { var k2 = (u - 0.70) / 0.20; return 1 - k2 * k2 * (3 - 2 * k2); }
    return 0;
  }

  // ---- Bird variants (11 birds, one lit per cycle) ----------------------
  var variants = [];
  for (var i = 0; i < 11; i++) {
    var r = mulberry32(1430000 + i * 7919);
    variants.push({
      body: 0.92 + r() * 0.16,
      tail: 0.8 + r() * 0.5,
      crest: r() > 0.5,
      wingShade: r(),
      belly: r() > 0.4,
      speck: Math.floor(r() * 40)
    });
  }
  // Static speckle field for the room, seeded once.
  var speckles = [];
  for (var s = 0; s < 90; s++) {
    speckles.push([rnd(), rnd(), 1 + rnd() * 2]);
  }

  // ---- Interaction state (closed-form over recorded events) -------------
  var events = [];   // {kind:'scrub'|'guess', t, u}
  var scrub = null;  // {u, t} while a scrub drag is active
  var guesses = [];  // u values where the visitor marked a guess
  var resume = null; // {u, t} after a scrub ends: playhead re-anchors here

  function arcGeom() {
    var cx = W / 2, cy = H * 0.58;
    var m = Math.min(W, H);
    return { cx: cx, cy: cy, R: m * 0.38, amp: m * 0.055, bird: m * 0.16 };
  }
  // Map an arc parameter u to an angle: left (-175deg) to right (-5deg).
  function arcAngle(u) { return (-175 + u * 170) * Math.PI / 180; }
  function angleToU(ang) {
    var deg = ang * 180 / Math.PI;
    while (deg < -180) deg += 360;
    while (deg >= 180) deg -= 360;
    if (deg < -175 || deg > -5) return -1;
    return (deg + 175) / 170;
  }
  function ptFromEvent(e) {
    var x = (e.clientX !== undefined) ? e.clientX : e.offsetX;
    var y = (e.clientY !== undefined) ? e.clientY : e.offsetY;
    return { x: x, y: y };
  }

  function onDown(e) {
    if (e.preventDefault) e.preventDefault();
    var p = ptFromEvent(e), g = arcGeom();
    var dx = p.x - g.cx, dy = p.y - g.cy;
    var r = Math.sqrt(dx * dx + dy * dy);
    var u = angleToU(Math.atan2(dy, dx));
    if (u < 0) return;
    if (r < g.R - 50 || r > g.R + g.amp + 70) return;
    if (u >= GAP0 && u < GAP1) {
      guesses.push(u);
      events.push({ kind: 'guess', t: clockT, u: u });
    } else {
      scrub = { u: u, t: clockT };
      events.push({ kind: 'scrub', t: clockT, u: u });
    }
  }
  function onMove(e) {
    if (!scrub && guesses.length === 0) return;
    var p = ptFromEvent(e), g = arcGeom();
    var dx = p.x - g.cx, dy = p.y - g.cy;
    var r = Math.sqrt(dx * dx + dy * dy);
    var u = angleToU(Math.atan2(dy, dx));
    if (u < 0) return;
    if (r < g.R - 50 || r > g.R + g.amp + 70) return;
    if (scrub) {
      if (u >= GAP0 && u < GAP1) return; // scrubbing never lands inside the gap
      scrub.u = u;
    } else if (draggingGuess) {
      if (u >= GAP0 && u < GAP1 && Math.abs(u - guesses[guesses.length - 1]) > 0.02) {
        guesses.push(u);
      }
    }
  }
  var draggingGuess = false;
  function onUp(e) {
    if (scrub) {
      resume = { u: scrub.u, t: clockT };
      scrub = null;
    }
    draggingGuess = false;
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = ptFromEvent(e), g = arcGeom();
    var dx = p.x - g.cx, dy = p.y - g.cy;
    var r = Math.sqrt(dx * dx + dy * dy);
    var u = angleToU(Math.atan2(dy, dx));
    if (u >= GAP0 && u < GAP1 && r >= g.R - 50 && r <= g.R + g.amp + 70) draggingGuess = true;
    onDown(e);
  });
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // Effective playhead u for a given clock time, closed-form over events.
  function playhead(t) {
    if (scrub) return scrub.u;
    var base = (t % 30) / 30;
    if (resume && t >= resume.t) {
      var u = resume.u + (t - resume.t) / 30;
      return u - Math.floor(u);
    }
    return base;
  }

  function drawBird(bx, by, s, v, lit, headTilt) {
    // Stand (only for the lit bird; background birds float dim in the dark).
    if (lit) {
      ctx.fillStyle = STAND;
      ctx.fillRect(bx - s * 0.03, by + s * 0.55, s * 0.06, s * 0.75);
      ctx.beginPath();
      ctx.ellipse(bx, by + s * 1.32, s * 0.42, s * 0.10, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // Tail feathers (white, fanned, separated so each feather reads).
    ctx.fillStyle = lit ? FEATHER : rgba(FEATHER, 0.5);
    for (var f = -1; f <= 1; f++) {
      ctx.beginPath();
      ctx.ellipse(bx - s * 0.95 - Math.abs(f) * s * 0.10, by - s * 0.05 + f * s * 0.30, s * 0.45 * v.tail, s * 0.10, f * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }
    // Body: clay ellipse with seeded speckle (handmade texture).
    ctx.fillStyle = CLAY;
    ctx.beginPath();
    ctx.ellipse(bx, by, s * 0.85 * v.body, s * 0.62, 0, 0, Math.PI * 2);
    ctx.fill();
    if (lit) {
      var rr = mulberry32(1430000 + v.speck * 131);
      ctx.fillStyle = rgba('#8a6a44', 0.5);
      for (var i = 0; i < 14; i++) {
        var px = bx + (rr() - 0.5) * s * 1.3;
        var py = by + (rr() - 0.5) * s * 0.9;
        ctx.fillRect(px, py, 2, 2);
      }
      // Fabric wing patch with stitch dashes.
      ctx.fillStyle = v.wingShade > 0.5 ? '#a8845e' : '#c8a882';
      ctx.beginPath();
      ctx.ellipse(bx - s * 0.05, by + s * 0.05, s * 0.5, s * 0.34, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = rgba('#5a4028', 0.7);
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var d = 0; d < 6; d++) {
        var sx = bx - s * 0.35 + d * s * 0.12, sy = by - s * 0.15 + d * s * 0.07;
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + s * 0.06, sy + s * 0.03);
      }
      ctx.stroke();
      if (v.belly) {
        ctx.fillStyle = rgba(FEATHER, 0.55);
        ctx.beginPath();
        ctx.ellipse(bx + s * 0.25, by + s * 0.28, s * 0.4, s * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      if (v.crest) {
        ctx.fillStyle = FEATHER;
        ctx.beginPath();
        ctx.ellipse(bx + s * 0.55, by - s * 0.78, s * 0.16, s * 0.28, 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // Head: circle at the front-top, rotated slightly toward its own sound.
    var hx = bx + s * 0.72, hy = by - s * 0.55;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(headTilt);
    ctx.fillStyle = CLAY;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.34, 0, Math.PI * 2);
    ctx.fill();
    // Beak.
    ctx.fillStyle = '#8a6a44';
    ctx.beginPath();
    ctx.moveTo(s * 0.28, -s * 0.05);
    ctx.lineTo(s * 0.62, s * 0.05);
    ctx.lineTo(s * 0.28, s * 0.14);
    ctx.closePath();
    ctx.fill();
    // Eye.
    ctx.fillStyle = '#141210';
    ctx.beginPath();
    ctx.arc(s * 0.12, -s * 0.08, Math.max(2, s * 0.05), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw(t) {
    clockT = t;
    var g = arcGeom();
    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, W, H);
    // Room speckle, flat alpha.
    ctx.fillStyle = rgba(FEATHER, 0.05);
    for (var i = 0; i < speckles.length; i++) {
      var sp = speckles[i];
      ctx.fillRect(sp[0] * W, sp[1] * H, sp[2], sp[2]);
    }
    // Witness note: small paper rectangle, line marks only, never text.
    var nx = W * 0.06, ny = H * 0.82, nw = Math.min(W, H) * 0.13, nh = nw * 0.7;
    ctx.fillStyle = NOTE;
    ctx.fillRect(nx, ny, nw, nh);
    ctx.fillStyle = rgba('#8a8578', 0.8);
    for (var li = 0; li < 4; li++) {
      ctx.fillRect(nx + nw * 0.12, ny + nh * (0.22 + li * 0.18), nw * 0.76, 1);
    }
    // Ten dim birds waiting in the dark behind the lit one.
    var cycleIdx = Math.floor(t / 30) % 11;
    var bg = 0;
    for (var b = 0; b < 11; b++) {
      if (b === cycleIdx) continue;
      var col = bg % 5, row = Math.floor(bg / 5);
      bg++;
      var bx = W * (0.12 + col * 0.19);
      var by = H * (0.22 + row * 0.16);
      ctx.save();
      ctx.globalAlpha = a4(0.14);
      drawBird(bx, by, g.bird * 0.32, variants[b], false, 0);
      ctx.restore();
    }
    // Lit bird, center-frame, large, on its stand.
    var p = playhead(t);
    var headTilt = 0.22 * callAmp(p) * Math.sin(Math.PI * 2 * p);
    drawBird(g.cx, g.cy, g.bird, variants[cycleIdx], true, headTilt);

    // Spectrogram halo-score: arc above and around the bird.
    var STEPS = 120;
    // Faint full score (non-gap only).
    ctx.strokeStyle = rgba(GOLD, 0.28);
    ctx.lineWidth = 1;
    ctx.beginPath();
    var started = false;
    for (var k = 0; k <= STEPS; k++) {
      var u = k / STEPS;
      if (u >= GAP0 && u < GAP1) { started = false; continue; }
      var ang = arcAngle(u);
      var rad = g.R + callAmp(u) * g.amp;
      var px = g.cx + Math.cos(ang) * rad, py = g.cy + Math.sin(ang) * rad;
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
    // Bright played portion up to the playhead.
    if (p > 0) {
      ctx.strokeStyle = rgba(GOLD, 0.95);
      ctx.lineWidth = 2;
      ctx.beginPath();
      started = false;
      for (var k2 = 0; k2 <= STEPS; k2++) {
        var u2 = k2 / STEPS;
        if (u2 > p) break;
        if (u2 >= GAP0 && u2 < GAP1) { started = false; continue; }
        var ang2 = arcAngle(u2);
        var rad2 = g.R + callAmp(u2) * g.amp;
        var px2 = g.cx + Math.cos(ang2) * rad2, py2 = g.cy + Math.sin(ang2) * rad2;
        if (!started) { ctx.moveTo(px2, py2); started = true; } else { ctx.lineTo(px2, py2); }
      }
      ctx.stroke();
    }
    // Gap: faint dotted arc marking where no description survives.
    ctx.fillStyle = rgba('#8a8578', 0.5);
    for (var k3 = 0; k3 <= 24; k3++) {
      var u3 = GAP0 + (GAP1 - GAP0) * (k3 / 24);
      var ang3 = arcAngle(u3);
      var px3 = g.cx + Math.cos(ang3) * g.R, py3 = g.cy + Math.sin(ang3) * g.R;
      ctx.fillRect(px3 - 1, py3 - 1, 2, 2);
    }
    // Visitor guess-lines: blue, dashed, clearly marked as guesses.
    ctx.strokeStyle = rgba(GUESS, 0.9);
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    for (var gi = 0; gi < guesses.length; gi++) {
      var gu = guesses[gi];
      var a0 = arcAngle(Math.max(GAP0, gu - 0.015));
      var a1 = arcAngle(Math.min(GAP1, gu + 0.015));
      ctx.beginPath();
      ctx.moveTo(g.cx + Math.cos(a0) * g.R, g.cy + Math.sin(a0) * g.R);
      ctx.lineTo(g.cx + Math.cos(a1) * g.R, g.cy + Math.sin(a1) * g.R);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    // Playhead dot (gold), only where the call exists.
    if (p < GAP0 || p >= GAP1) {
      var pa = arcAngle(p);
      var pr = g.R + callAmp(p) * g.amp;
      ctx.fillStyle = GOLD;
      ctx.beginPath();
      ctx.arc(g.cx + Math.cos(pa) * pr, g.cy + Math.sin(pa) * pr, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  var clockT = 0;
  var booted = false;
  draw(0);
  booted = true;

  // rAF loop: plain function declaration behind a typeof guard.
  var startMs = null;
  function loop(ts) {
    if (startMs === null) startMs = ts;
    var t = (ts - startMs) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
