<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero State</title>
<style>
  html, body { margin: 0; padding: 0; background: #23272E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SLATE = '#23272E', STEEL = '#4A5A6A', ICE = '#B8C4CC',
      RED = '#8B1A1A', BONE = '#EDE8DC';

  var W = 0, H = 0, S = 0, CX = 0, CY = 0, phone = false;

  function size() {
    var vp = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vp ? vp.width : window.innerWidth;
    var h = vp ? vp.height : window.innerHeight;
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : w;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : h;
    var minDim = Math.min(sw, sh);
    phone = (minDim < 700) || (h > w * 1.15);
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    S = Math.min(w, h);
    CX = w / 2;
    CY = h * 0.60;
  }

  // One abstract portrait, drawn only from ellipses and arcs.
  // u is a unit scale; ox, oy are offsets in units; rot is radians;
  // sx, sy are stretches; alpha scales all strokes/fills.
  function portrait(u, ox, oy, rot, sx, sy, alpha, seed) {
    var rng = mulberry32(seed);
    var jx = (rng() - 0.5) * 0.10, jy = (rng() - 0.5) * 0.10;
    ctx.save();
    ctx.translate(CX + ox * u + jx * u, CY + oy * u + jy * u);
    ctx.rotate(rot);
    ctx.scale(sx, sy);
    ctx.lineWidth = Math.max(1, u * 0.016);
    ctx.lineCap = 'round';

    // Head outline: tall ellipse.
    ctx.beginPath();
    ctx.moveTo(u * 0.20, 0);
    ctx.ellipse(0, 0, u * 0.20, u * 0.27, 0, 0, Math.PI * 2);
    ctx.strokeStyle = hexA(ICE, 0.85 * alpha);
    ctx.stroke();

    // Inner head wash, faint steel.
    ctx.beginPath();
    ctx.moveTo(u * 0.17, 0);
    ctx.ellipse(0, 0, u * 0.17, u * 0.24, 0, 0, Math.PI * 2);
    ctx.fillStyle = hexA(STEEL, 0.22 * alpha);
    ctx.fill();

    // Eyes: two ellipses, slightly asymmetric.
    ctx.beginPath();
    ctx.moveTo(-u * 0.085 + u * 0.038, -u * 0.075);
    ctx.ellipse(-u * 0.085, -u * 0.075, u * 0.038, u * 0.024, -0.12, 0, Math.PI * 2);
    ctx.strokeStyle = hexA(BONE, 0.80 * alpha);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(u * 0.085 + u * 0.032, -u * 0.070);
    ctx.ellipse(u * 0.085, -u * 0.070, u * 0.032, u * 0.020, 0.10, 0, Math.PI * 2);
    ctx.strokeStyle = hexA(BONE, 0.80 * alpha);
    ctx.stroke();

    // Eye dots.
    ctx.beginPath();
    ctx.moveTo(-u * 0.085 + u * 0.010, -u * 0.075);
    ctx.ellipse(-u * 0.085, -u * 0.075, u * 0.010, u * 0.010, 0, 0, Math.PI * 2);
    ctx.fillStyle = hexA(ICE, 0.90 * alpha);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(u * 0.085 + u * 0.009, -u * 0.070);
    ctx.ellipse(u * 0.085, -u * 0.070, u * 0.009, u * 0.009, 0, 0, Math.PI * 2);
    ctx.fillStyle = hexA(ICE, 0.90 * alpha);
    ctx.fill();

    // Brow arcs.
    ctx.beginPath();
    ctx.moveTo(-u * 0.125, -u * 0.125);
    ctx.ellipse(-u * 0.085, -u * 0.125, u * 0.045, u * 0.020, 0, Math.PI, Math.PI * 2);
    ctx.strokeStyle = hexA(ICE, 0.55 * alpha);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(u * 0.045, -u * 0.120);
    ctx.ellipse(u * 0.085, -u * 0.120, u * 0.040, u * 0.018, 0, Math.PI, Math.PI * 2);
    ctx.strokeStyle = hexA(ICE, 0.55 * alpha);
    ctx.stroke();

    // Nose: one long arc down the center.
    ctx.beginPath();
    ctx.moveTo(u * 0.005, -u * 0.030);
    ctx.ellipse(0, -u * 0.005, u * 0.028, u * 0.055, 0.15, Math.PI * 0.9, Math.PI * 1.9);
    ctx.strokeStyle = hexA(STEEL, 0.70 * alpha);
    ctx.stroke();

    // Mouth: shallow arc.
    ctx.beginPath();
    ctx.moveTo(-u * 0.060, u * 0.130);
    ctx.ellipse(0, u * 0.130, u * 0.060, u * 0.030, 0, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.strokeStyle = hexA(BONE, 0.70 * alpha);
    ctx.stroke();

    ctx.restore();
  }

  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(3) + ')';
  }

  // Light-bleed streaks radiating from the edges inward, flat alpha shapes.
  function streaks(t, loopSeed) {
    var rng = mulberry32(loopSeed + 4242);
    var n = 10;
    for (var i = 0; i < n; i++) {
      var edge = Math.floor(rng() * 4);
      var pos = rng();
      var len = (0.18 + rng() * 0.30) * S;
      var wdt = (0.004 + rng() * 0.010) * S;
      var tw = 0.5 + 0.5 * Math.sin(t * 0.6 + i * 1.7);
      var a = 0.05 + 0.07 * tw;
      ctx.fillStyle = hexA(ICE, a);
      ctx.beginPath();
      if (edge === 0) { // from top edge downward
        var x = pos * W;
        ctx.moveTo(x - wdt, 0); ctx.lineTo(x + wdt, 0); ctx.lineTo(x, len);
      } else if (edge === 1) { // from bottom edge upward
        var x2 = pos * W;
        ctx.moveTo(x2 - wdt, H); ctx.lineTo(x2 + wdt, H); ctx.lineTo(x2, H - len);
      } else if (edge === 2) { // from left edge rightward
        var y = pos * H;
        ctx.moveTo(0, y - wdt); ctx.lineTo(0, y + wdt); ctx.lineTo(len, y);
      } else { // from right edge leftward
        var y2 = pos * H;
        ctx.moveTo(W, y2 - wdt); ctx.lineTo(W, y2 + wdt); ctx.lineTo(W - len, y2);
      }
      ctx.closePath();
      ctx.fill();
    }
  }

  // Loop: 28 s. Accrete 0-16 s (one copy per 2 s, max 8), hold 16-22 s,
  // collapse 22-28 s (one copy per 0.75 s, reverse order).
  var LOOP = 28, MAXCOPY = 8;
  function copyCount(lt) {
    if (lt < 16) return Math.min(MAXCOPY, Math.floor(lt / 2));
    if (lt < 22) return MAXCOPY;
    var gone = Math.floor((lt - 22) / 0.75);
    return Math.max(0, MAXCOPY - gone);
  }
  function copyAlpha(lt, idx) {
    // Fade-in of the newest copy during accretion.
    if (lt < 16) {
      var born = idx * 2;
      var age = lt - born;
      if (age < 0) return 0;
      return Math.min(1, age / 0.5);
    }
    if (lt < 22) return 1;
    // Collapse: copies vanish in reverse order, quick fade.
    var gone = Math.floor((lt - 22) / 0.75);
    var frac = ((lt - 22) % 0.75) / 0.75;
    var last = MAXCOPY - 1 - gone;
    if (idx > last) return 0;
    if (idx === last) return 1 - frac;
    return 1;
  }

  function draw(t) {
    size();
    ctx.fillStyle = SLATE;
    ctx.fillRect(0, 0, W, H);

    var loop = Math.floor(t / LOOP);
    var lt = t - loop * LOOP;
    var loopSeed = 1307 + loop * 7919;

    // Faint cold field marks: sparse ice dots, seeded per loop.
    var frng = mulberry32(loopSeed + 99);
    for (var d = 0; d < 26; d++) {
      var dx = frng() * W, dy = frng() * H, dr = (1 + frng() * 2);
      ctx.beginPath();
      ctx.moveTo(dx + dr, dy);
      ctx.ellipse(dx, dy, dr, dr, 0, 0, Math.PI * 2);
      ctx.fillStyle = hexA(ICE, 0.05);
      ctx.fill();
    }

    streaks(t, loopSeed);

    var u = S * 0.60;
    // Hold-phase warp: whole stack breathes and twists slightly.
    var warp = 0;
    if (lt >= 16 && lt < 22) {
      var hp = (lt - 16) / 6;
      warp = Math.sin(hp * Math.PI) * 0.06;
    }

    // Base portrait: the single cold portrait, always present.
    portrait(u, 0, 0, warp * 0.4, 1, 1, 1, loopSeed + 7);

    // Accreted copies: rotation, stretch, and offset grow with index.
    var crng = mulberry32(loopSeed + 500);
    var copies = [];
    for (var i = 0; i < MAXCOPY; i++) {
      copies.push({
        rot: (crng() - 0.5) * 0.55 * (i + 1) / MAXCOPY,
        sx: 1 + (crng() - 0.5) * 0.30 * (i + 1) / MAXCOPY,
        sy: 1 + (crng() - 0.5) * 0.42 * (i + 1) / MAXCOPY,
        ox: (crng() - 0.5) * 0.16 * (i + 1) / MAXCOPY,
        oy: (crng() - 0.5) * 0.12 * (i + 1) / MAXCOPY,
        seed: loopSeed + 1000 + i * 37
      });
    }
    var n = copyCount(lt);
    for (var k = 0; k < MAXCOPY; k++) {
      var a = copyAlpha(lt, k);
      if (a <= 0) continue;
      var c = copies[k];
      // Later copies read more translucent, like layered exposures.
      portrait(u, c.ox, c.oy, c.rot + warp, c.sx, c.sy, 0.55 * a, c.seed);
      // One blood-red streak per late copy: the beast's mark, never gore.
      if (k >= 5) {
        ctx.save();
        ctx.translate(CX + c.ox * u, CY + c.oy * u);
        ctx.rotate(c.rot);
        ctx.fillStyle = hexA(RED, 0.35 * a);
        ctx.fillRect(-u * 0.16, -u * 0.20 + k * u * 0.008, u * 0.05, u * 0.012);
        ctx.restore();
      }
    }
  }

  // Frame one: exactly t = 0, drawn synchronously at load.
  draw(0);

  // The clock starts with the rAF loop; frame one never comes from elapsed time.
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loopFn = function (now) {
      var t = (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loopFn);
    };
    requestAnimationFrame(loopFn);
  }

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(0); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { draw(0); });
    }
  }
})();
</script>
</body>
</html>
