<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nagging Ribbons</title>
<style>
  html, body { margin: 0; padding: 0; background: #1E1B16; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  /* ---------- palette ---------- */
  var BG = '#1E1B16', BAND = '#14110D';
  var RIBBON_WHITE = '#F2EFE4', RIBBON_RED = '#C0392B', RIBBON_BLUE = '#2E5FA3';
  var GOLD = '#C9A24B', INK = '#26241F', TAG_BG = '#EFE8D2';

  /* ---------- seeded determinism (no Math.random) ---------- */
  function hash(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function pick(arr, seed) { return arr[Math.floor(hash(seed) * arr.length) % arr.length]; }

  /* ---------- content banks ---------- */
  var NAGS = [
    ['did you eat?', 'bap meogeosseo?'],
    ['wear a jacket', 'ot ipgo na'],
    ['your metro card is empty', 'gyotong kadeu eopseo'],
    ['call your mother', 'eomma-ege jeonhwa hae'],
    ['did you sleep well?', 'jal jasseo?'],
    ['eat your vegetables', 'chaeso meogeo'],
    ['don\'t skip breakfast', 'achim georeuji ma'],
    ['umbrella? it is raining', 'usan gajyeoga'],
    ['wash your hands', 'son ssiseo'],
    ['text me when you arrive', 'dochakhamyeon yeonrakhae'],
    ['you look tired', 'pigonhae boyeo'],
    ['drink some water', 'mul masyeo']
  ];
  var TICKER = [
    'please yield your seat to the elderly',
    'let passengers off first',
    'mind the gap',
    'no eating on the bus',
    'keep your card ready',
    'quiet please, no phone calls',
    'hold the handrail',
    'stand clear of the doors'
  ];
  /* generator-written name bank + syllable-map retranslation */
  var NAMES = ['Sammy', 'Seungmin', 'Lee', 'Esther', 'Mama', 'Suchitra'];
  var SYL = { 'sam': 'saem', 'my': 'mi', 'seung': 'seung', 'min': 'min',
              'lee': 'i', 'es': 'e-seu', 'ther': 'teo', 'ma': 'ma',
              'su': 'su', 'chi': 'chi', 'tra': 'teu-ra' };
  function retranslate(name) {
    var low = name.toLowerCase(), out = '', i = 0, keys = Object.keys(SYL).sort(function (a, b) { return b.length - a.length; });
    while (i < low.length) {
      var matched = false;
      for (var k = 0; k < keys.length; k++) {
        if (low.slice(i, i + keys[k].length) === keys[k]) { out += SYL[keys[k]]; i += keys[k].length; matched = true; break; }
      }
      if (!matched) { out += low[i]; i += 1; }
    }
    return out.charAt(0).toUpperCase() + out.slice(1);
  }

  /* ---------- ribbons ---------- */
  var RIBBON_COLORS = [RIBBON_WHITE, RIBBON_RED, RIBBON_BLUE];
  var ribbons = [];
  var SLOT_COUNT = 10;
  function makeRibbon(slot, seedBase) {
    var color = pick(RIBBON_COLORS, seedBase + 1);
    /* initial set: distinct nags, stepped by 5 (coprime with 12); respawns hash-pick */
    var nag = (seedBase < 1000)
      ? NAGS[(slot * 5 + 3) % NAGS.length]
      : NAGS[Math.floor(hash(seedBase + 2) * NAGS.length) % NAGS.length];
    return {
      slot: slot, seed: seedBase,
      color: color,
      textColor: (color === RIBBON_WHITE) ? GOLD : '#F2EFE4',
      goldLine: GOLD,
      nagEn: nag[0], nagKo: nag[1],
      phase: hash(seedBase + 3) * Math.PI * 2,
      speed: 0.7 + hash(seedBase + 4) * 0.6,
      lenFrac: 0.34 + hash(seedBase + 5) * 0.34,
      width: 56 + hash(seedBase + 6) * 22,
      state: 'hanging', // hanging | stretching | folding | accepted
      acceptT: null, stretch: 0, releaseT: null,
      spawnT: 0
    };
  }
  function buildRibbons() {
    SLOT_COUNT = isPhone ? 6 : 10;
    ribbons = [];
    for (var s = 0; s < SLOT_COUNT; s++) ribbons.push(makeRibbon(s, 100 + s * 17));
  }

  var events = [];   // accepted / drag records, closed-form over t
  var tags = [];     // accepted name-tags in the corner cluster
  var drag = null;   // active drag: {ribbon, startY, curY, startX, curX}
  var downInfo = null;
  var t0 = null;     // rAF anchor; piece time = elapsed since load

  function pieceTime(now) { return t0 === null ? 0 : (now - t0) / 1000; }

  /* ---------- sizing ---------- */
  var W = 0, H = 0, isPhone = false;
  function resize() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    W = vv ? vv.width : (window.innerWidth || 1280);
    H = vv ? vv.height : (window.innerHeight || 800);
    canvas.width = W; canvas.height = H;
    var minScreen = 9999;
    try {
      if (window.screen) minScreen = Math.min(window.screen.width, window.screen.height);
    } catch (e) {}
    isPhone = (minScreen < 700) || (H > W * 1.15);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(pieceTime(performance.now())); });
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', function () { resize(); draw(pieceTime(performance.now())); });
    }
  }

  /* ---------- geometry ---------- */
  function ribbonX(r) {
    var margin = isPhone ? 14 : 40;
    var usable = W - margin * 2;
    var slotW = usable / SLOT_COUNT;
    var jitter = (hash(r.seed + 9) - 0.5) * slotW * 0.4;
    return margin + slotW * (r.slot + 0.5) + jitter;
  }
  function ribbonLen(r, t) {
    var base = H * r.lenFrac;
    if (r.state === 'stretching' && drag && drag.ribbon === r) {
      return base + Math.max(0, drag.curY - drag.startY) * 0.9;
    }
    if (r.state === 'folding' && r.releaseT !== null) {
      var dt = t - r.releaseT;
      var extra = r.stretch * Math.exp(-dt / 0.45);
      return base + extra;
    }
    return base;
  }
  function ribbonTop(r) { return 8 + hash(r.seed + 11) * 26; }

  function drawRibbon(r, t) {
    var x = ribbonX(r), top = ribbonTop(r), len = ribbonLen(r, t);
    var margin = isPhone ? 14 : 40;
    var slotW = (W - margin * 2) / SLOT_COUNT;
    var w = Math.min(isPhone ? r.width * 0.92 : r.width, slotW * 0.92);
    var sway = Math.sin(t * r.speed + r.phase) * 0.03;
    var segs = 7, segLen = len / segs;
    ctx.save();
    ctx.translate(x, top);
    ctx.rotate(sway);
    /* strip as flat quads, sine wind growing toward the tail */
    for (var j = 0; j < segs; j++) {
      var y0 = j * segLen, y1 = (j + 1) * segLen;
      var o0 = Math.sin(t * r.speed * 1.3 + r.phase + j * 0.55) * (1.5 + j * 1.6);
      var o1 = Math.sin(t * r.speed * 1.3 + r.phase + (j + 1) * 0.55) * (1.5 + (j + 1) * 1.6);
      ctx.fillStyle = r.color;
      ctx.beginPath();
      ctx.moveTo(-w / 2 + o0, y0);
      ctx.lineTo(w / 2 + o0, y0);
      ctx.lineTo(w / 2 + o1, y1);
      ctx.lineTo(-w / 2 + o1, y1);
      ctx.closePath();
      ctx.fill();
    }
    /* V-notch tail: cut from the ground color so the split reads */
    var tailO = Math.sin(t * r.speed * 1.3 + r.phase + segs * 0.55) * (1.5 + segs * 1.6);
    ctx.fillStyle = BG;
    ctx.beginPath();
    ctx.moveTo(-w * 0.22 + tailO, len + 1);
    ctx.lineTo(tailO, len - w * 0.5);
    ctx.lineTo(w * 0.22 + tailO, len + 1);
    ctx.closePath();
    ctx.fill();
    /* rosette at the anchor */
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.arc(0, 2, Math.min(9, w * 0.16), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = r.color;
    ctx.beginPath(); ctx.arc(0, 2, Math.min(5, w * 0.09), 0, Math.PI * 2); ctx.fill();
    /* lettering along the ribbon, gold */
    ctx.save();
    ctx.translate(0, len * 0.52);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = r.textColor;
    ctx.textAlign = 'center';
    ctx.font = '600 ' + Math.max(11, Math.round(w * 0.24)) + 'px Georgia, serif';
    ctx.fillText(r.nagEn, 0, -2);
    ctx.font = 'italic ' + Math.max(10, Math.round(w * 0.20)) + 'px Georgia, serif';
    ctx.fillText(r.nagKo, 0, Math.max(12, Math.round(w * 0.24)) + 4);
    ctx.restore();
    ctx.restore();
    r._x = x; r._top = top; r._len = len; r._w = w;
  }

  function drawTag(tag, idx, t) {
    var bw = 132, bh = 36, gap = 8;
    var perRow = Math.max(1, Math.floor((W - 24) / (bw + gap)));
    var col = idx % perRow, row = Math.floor(idx / perRow);
    var tx = W - 12 - (col + 1) * bw - col * gap;
    var ty = H - 56 - (row + 1) * bh - row * gap;
    var pop = 1;
    if (tag.bornT !== null) {
      var dt = t - tag.bornT;
      pop = dt < 0.3 ? 0.7 + 0.3 * (dt / 0.3) : 1;
    }
    ctx.save();
    ctx.translate(tx + bw / 2, ty + bh / 2);
    ctx.scale(pop, pop);
    ctx.fillStyle = TAG_BG;
    ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
    ctx.strokeStyle = GOLD; ctx.lineWidth = 1.5;
    ctx.strokeRect(-bw / 2, -bh / 2, bw, bh);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.font = '600 13px Georgia, serif';
    ctx.fillText(tag.name, 0, 5);
    ctx.restore();
  }

  function drawTicker(t) {
    var bandH = 44, y = H - bandH;
    ctx.fillStyle = BAND;
    ctx.fillRect(0, y, W, bandH);
    ctx.fillStyle = GOLD;
    ctx.fillRect(0, y, W, 1);
    var msg = TICKER.join('   \u2022   ') + '   \u2022   ';
    ctx.font = '13px "Courier New", monospace';
    var tw = ctx.measureText(msg).width;
    var speed = 26;
    var off = (t * speed) % tw;
    ctx.fillStyle = GOLD;
    ctx.textAlign = 'left';
    for (var x = -off; x < W; x += tw) ctx.fillText(msg, x, y + 27);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < ribbons.length; i++) {
      var r = ribbons[i];
      if (r.state === 'accepted') continue;
      if (r.state === 'folding' && r.acceptT !== null) {
        /* accept fold: ribbon shrinks toward the rosette over 0.8 s */
        var dt = t - r.acceptT;
        if (dt >= 0.8) { r.state = 'accepted'; continue; }
        var shrink = 1 - dt / 0.8;
        ctx.save();
        ctx.globalAlpha = shrink;
        drawRibbonFold(r, t, shrink);
        ctx.restore();
        continue;
      }
      drawRibbon(r, t);
    }
    for (var j = 0; j < tags.length; j++) drawTag(tags[j], j, t);
    drawTicker(t);
  }

  /* ribbon drawn with its length scaled (accept-fold), reusing geometry */
  function drawRibbonFold(r, t, shrink) {
    var x = ribbonX(r), top = ribbonTop(r);
    var len = H * r.lenFrac * shrink;
    var w = isPhone ? r.width * 0.92 : r.width;
    var sway = Math.sin(t * r.speed + r.phase) * 0.03;
    var segs = 7, segLen = len / Math.max(1, segs);
    ctx.save();
    ctx.translate(x, top);
    ctx.rotate(sway);
    for (var j = 0; j < segs; j++) {
      var y0 = j * segLen, y1 = (j + 1) * segLen;
      var o0 = Math.sin(t * r.speed * 1.3 + r.phase + j * 0.55) * (1.5 + j * 1.6);
      var o1 = Math.sin(t * r.speed * 1.3 + r.phase + (j + 1) * 0.55) * (1.5 + (j + 1) * 1.6);
      ctx.fillStyle = r.color;
      ctx.beginPath();
      ctx.moveTo(-w / 2 + o0, y0);
      ctx.lineTo(w / 2 + o0, y0);
      ctx.lineTo(w / 2 + o1, y1);
      ctx.lineTo(-w / 2 + o1, y1);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.arc(0, 2, Math.min(9, w * 0.16), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  /* ---------- interaction ---------- */
  function ribbonAt(px, py) {
    for (var i = 0; i < ribbons.length; i++) {
      var r = ribbons[i];
      if (r.state === 'accepted' || r.state === 'folding') continue;
      if (r._x === undefined) continue;
      if (Math.abs(px - r._x) <= r._w / 2 + 8 && py >= r._top - 6 && py <= r._top + r._len + 10) return r;
    }
    return null;
  }
  function pos(e) {
    var rect = canvas.getBoundingClientRect();
    var cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    var cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  }
  function onDown(e) {
    var p = pos(e);
    var r = ribbonAt(p.x, p.y);
    downInfo = { x: p.x, y: p.y, t: pieceTime(performance.now()), ribbon: r };
    if (r) drag = { ribbon: r, startX: p.x, startY: p.y, curX: p.x, curY: p.y };
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!drag) return;
    var p = pos(e);
    drag.curX = p.x; drag.curY = p.y;
    drag.ribbon.state = 'stretching';
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    var t = pieceTime(performance.now());
    if (drag) {
      var r = drag.ribbon;
      var moved = Math.abs(drag.curX - drag.startX) + Math.abs(drag.curY - drag.startY);
      if (moved < 10) {
        /* tap: accept the ribbon, fold it into a name-tag */
        r.state = 'folding';
        r.acceptT = t;
        var nameIdx = tags.length % NAMES.length;
        var variant = retranslate(NAMES[nameIdx]);
        tags.push({ name: variant, bornT: t + 0.8 });
        /* respawn a fresh ribbon in the freed slot after the fold */
        var slot = r.slot, seedBase = r.seed;
        r._respawnAt = t + 2.0;
        r._respawnSeed = seedBase + 1000 + tags.length * 31;
      } else {
        /* drag release: stretch decays, ribbon folds back to rest */
        r.stretch = Math.max(0, drag.curY - drag.startY) * 0.9;
        r.releaseT = t;
        r.state = 'folding';
        r.acceptT = null;
        /* return to hanging once the decay has settled (handled in draw loop) */
        r._settleAt = t + 2.5;
      }
      drag = null;
    }
    downInfo = null;
  }
  /* settle + respawn bookkeeping, closed-form over t */
  function housekeeping(t) {
    for (var i = 0; i < ribbons.length; i++) {
      var r = ribbons[i];
      if (r.state === 'folding' && r.acceptT === null && r._settleAt !== undefined && t >= r._settleAt) {
        r.state = 'hanging'; r.stretch = 0; r.releaseT = null; r._settleAt = undefined;
      }
      if (r.state === 'accepted' && r._respawnAt !== undefined && t >= r._respawnAt) {
        var fresh = makeRibbon(r.slot, r._respawnSeed);
        fresh.spawnT = t;
        ribbons[i] = fresh;
      }
    }
  }

  if (typeof document !== 'undefined' && canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { drag = null; downInfo = null; });
  }

  /* ---------- boot ---------- */
  resize();
  buildRibbons();
  draw(0);
  function loop(now) {
    if (t0 === null) t0 = now;
    var t = pieceTime(now);
    housekeeping(t);
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
