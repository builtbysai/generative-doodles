<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Grids Arguing</title>
<style>
html, body { margin: 0; padding: 0; background: #FAFAF7; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BLACK = '#111111';
var WHITE = '#FAFAF7';
// Rotation: 0.5 degrees per second, constant speed, with a 5 s pause every
// 45 s of motion (50 s cycle). angleDeg(t) is a closed-form function of piece
// time only: motion accumulates 45 s per cycle and freezes during the pause.
// Holds land at 22.5, 45, 67.5 ... degrees: exact, reproducible alignments.
function angleDeg(t) {
  var cycle = Math.floor(t / 50);
  var inCycle = t - 50 * cycle;
  var motion = 45 * cycle + Math.min(inCycle, 45);
  return 0.5 * motion;
}
function isPaused(t) {
  var inCycle = t - 50 * Math.floor(t / 50);
  return inCycle >= 45;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function draw(t) {
  lastT = t;
  size();
  var minDim = Math.min(VW, VH);
  var cx = VW / 2, cy = VH / 2;
  // Grid A: fine checker, full-bleed, integer-aligned cells.
  var cell = Math.max(10, Math.floor(minDim / 40));
  var cols = Math.ceil(VW / cell) + 1, rows = Math.ceil(VH / cell) + 1;
  var ox = Math.round((VW - cols * cell) / 2), oy = Math.round((VH - rows * cell) / 2);
  ctx.fillStyle = WHITE;
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = BLACK;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      if ((r + c) % 2 === 0) continue;
      ctx.fillRect(ox + c * cell, oy + r * cell, cell, cell);
    }
  }
  // Grid B: concentric arcs + radial spokes, rotated against grid A.
  var arcStep = cell;
  var maxR = Math.ceil(Math.hypot(VW, VH) / 2) + arcStep;
  var spokes = 60;
  var lw = Math.max(1, Math.round(cell * 0.11));
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angleDeg(t) * Math.PI / 180);
  ctx.strokeStyle = BLACK;
  ctx.lineWidth = lw;
  ctx.lineCap = 'butt';
  var ri;
  for (ri = 1; ri * arcStep <= maxR; ri++) {
    ctx.beginPath();
    ctx.moveTo(ri * arcStep, 0);
    ctx.arc(0, 0, ri * arcStep, 0, TAU);
    ctx.stroke();
  }
  var si;
  for (si = 0; si < spokes; si++) {
    var a = si * TAU / spokes;
    ctx.beginPath();
    ctx.moveTo(Math.round(Math.cos(a) * arcStep), Math.round(Math.sin(a) * arcStep));
    ctx.lineTo(Math.round(Math.cos(a) * maxR), Math.round(Math.sin(a) * maxR));
    ctx.stroke();
  }
  ctx.restore();
  // Caption: title, formula date, watch-only hint. Black on white, monochrome.
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'Two Grids Arguing  ·  2006 · 04 · 26  ·  Watch the grids argue.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = WHITE;
  ctx.fillRect(bx - pad, by, Math.ceil(tw) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = BLACK;
  ctx.textBaseline = 'top';
  ctx.fillText(label, bx, by + pad);
  if (typeof window !== 'undefined') {
    window.__p1566 = {
      t: t, angleDeg: angleDeg(t), paused: isPaused(t),
      cell: cell, arcStep: arcStep, spokes: spokes,
      cols: cols, rows: rows, cx: cx, cy: cy, minDim: minDim
    };
  }
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
