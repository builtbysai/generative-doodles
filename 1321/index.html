<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drawing as Incantation</title>
<style>
html,body{margin:0;padding:0;background:#EFE9DA;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var PAPER = '#EFE9DA';
var GRAPHITE = '#3F3D39';
var DARK = '#1A1917';
var INK = '#2A2A28';
var PURPLE = '#7B2D8B';
var GRID = '#CFC8B8';

var DRAW_S = 180;
var STRIKE_S = 1;
var HOLD_S = 20;
var FADE_S = 5;
var CYCLE_S = DRAW_S + STRIKE_S + HOLD_S + FADE_S;

var currentT = 0;
var cachedCycle = -1;
var strokes = [];
var strikeParts = [];
var sigBox = null;
var pageRect = null;

function viewportSize(){
  if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.width){
    return [visualViewport.width, visualViewport.height];
  }
  return [window.innerWidth, window.innerHeight];
}

function isPhone(w, h){
  try{
    if (typeof window !== 'undefined' && window.screen && window.screen.width){
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) return true;
    }
  }catch(e){}
  return h > w * 1.15;
}

function computePage(w, h){
  var phone = isPhone(w, h);
  var s = phone ? 0.88 * w : 0.8 * Math.min(w, h);
  var pw = s;
  var ph = s * 1.18;
  if (ph > 0.94 * h) { ph = 0.94 * h; pw = ph / 1.18; }
  return { x: (w - pw) / 2, y: (h - ph) / 2, w: pw, h: ph };
}

function buildCycle(cyc, w, h){
  var rng = mulberry32(1321000 + cyc * 7919);
  var pg = computePage(w, h);
  pageRect = pg;
  strokes = [];
  strikeParts = [];
  var mx = pg.w * 0.09;
  var my = pg.h * 0.07;
  var L = pg.x + mx, R = pg.x + pg.w - mx;
  var T = pg.y + my, B = pg.y + pg.h - my;

  function seg(x1, y1, x2, y2, wd, al, col){
    strokes.push({x1:x1, y1:y1, x2:x2, y2:y2, w:wd, a:al, c:col});
  }
  function dot(x, y, s, al, col){
    strokes.push({dot:true, x:x, y:y, s:s, a:al, c:col});
  }

  for (var i = 0; i < 46; i++){
    dot(L + rng() * (R - L), T + rng() * (B - T), 0.8 + rng() * 1.4, 0.05 + rng() * 0.08, GRAPHITE);
  }
  seg(L, T, R, T, 1, 0.5, GRID);
  seg(L, B, R, B, 1, 0.5, GRID);
  seg(L, T, L, B, 1, 0.5, GRID);
  seg(R, T, R, B, 1, 0.5, GRID);
  seg(pg.x + 2, pg.y + 2, pg.x + pg.w - 2, pg.y + 2, 1, 0.35, DARK);
  seg(pg.x + 2, pg.y + pg.h - 2, pg.x + pg.w - 2, pg.y + pg.h - 2, 1, 0.35, DARK);
  seg(pg.x + 2, pg.y + 2, pg.x + 2, pg.y + pg.h - 2, 1, 0.35, DARK);
  seg(pg.x + pg.w - 2, pg.y + 2, pg.x + pg.w - 2, pg.y + pg.h - 2, 1, 0.35, DARK);

  var lineGap = (B - T) * 0.52 / 26;
  var redLine = 13 + Math.floor(rng() * 4);
  var redY = 0, redX0 = 0, redX1 = 0;
  for (var li = 0; li < 26; li++){
    var y = T + pg.h * 0.05 + li * lineGap + (rng() - 0.5) * 1.5;
    var x = L + rng() * pg.w * 0.04;
    var end = R - rng() * pg.w * 0.06;
    while (x < end){
      var gl = 3 + rng() * 11;
      var kind = rng();
      if (kind < 0.78){
        seg(x, y + (rng() - 0.5) * 1.2, Math.min(x + gl, end), y + (rng() - 0.5) * 1.2, 1 + rng() * 1.1, 0.45 + rng() * 0.4, GRAPHITE);
      } else if (kind < 0.9){
        dot(x + 1, y, 1.2 + rng(), 0.5 + rng() * 0.3, GRAPHITE);
      } else {
        seg(x + 1, y - 2, x + 1, y + 2, 1, 0.5 + rng() * 0.3, GRAPHITE);
      }
      x += gl + 2 + rng() * 5;
    }
    if (li === redLine){ redY = y; redX0 = L + pg.w * 0.22; redX1 = R - pg.w * 0.08; }
  }
  var bh = lineGap * 1.7;
  for (var hy = redY - bh / 2; hy <= redY + bh / 2; hy += 2){
    seg(redX0 + (rng() - 0.5) * 2, hy, redX1 + (rng() - 0.5) * 2, hy + (rng() - 0.5) * 1, 1.6, 0.85, DARK);
  }
  seg(redX0, redY - bh / 2, redX1, redY - bh / 2, 1, 0.6, DARK);
  seg(redX0, redY + bh / 2, redX1, redY + bh / 2, 1, 0.6, DARK);

  var sigY0 = pg.y + pg.h * 0.68;
  var sigY1 = pg.y + pg.h * 0.86;
  var sigX0 = L + pg.w * 0.18;
  var sigX1 = R - pg.w * 0.14;
  sigBox = {x0:sigX0, y0:sigY0, x1:sigX1, y1:sigY1};
  var midY = sigY0 + (sigY1 - sigY0) * 0.5;
  var amp1 = (sigY1 - sigY0) * 0.16;
  var amp2 = (sigY1 - sigY0) * 0.06;
  var px = sigX0, py = midY;
  var segs = 180;
  for (var si = 0; si < segs; si++){
    var f = si / segs;
    var nx = sigX0 + f * (sigX1 - sigX0);
    var ny = midY + Math.sin(f * 9 + 1.3) * amp1 + Math.sin(f * 23) * amp2 + (rng() - 0.5) * 1.5;
    seg(px, py, nx, ny, 1.8 + rng() * 1.2, 0.6 + rng() * 0.35, INK);
    px = nx; py = ny;
    if (si % 23 === 11){
      var r = 4 + rng() * 7;
      var lx = nx, ly = ny;
      for (var li2 = 1; li2 <= 12; li2++){
        var a = li2 / 12 * Math.PI * 2;
        var ex = nx + Math.sin(a) * r;
        var ey = ny + (1 - Math.cos(a)) * r * 0.8;
        seg(lx, ly, ex, ey, 1.8 + rng(), 0.6 + rng() * 0.3, INK);
        lx = ex; ly = ey;
      }
    }
    if (si % 31 === 7){
      seg(nx - 6 - rng() * 6, ny - 4 - rng() * 8, nx + 6 + rng() * 6, ny + 4 + rng() * 8, 1.6, 0.65, INK);
    }
  }
  seg(sigX0 - pg.w * 0.02, sigY1 + pg.h * 0.02, sigX1 + pg.w * 0.03, sigY1 + pg.h * 0.015, 1.4, 0.7, INK);

  var sx0 = sigX0 - pg.w * 0.06, sy0 = sigY1 + pg.h * 0.05;
  var sx1 = sigX1 + pg.w * 0.05, sy1 = sigY0 - pg.h * 0.04;
  var dx = sx1 - sx0, dy = sy1 - sy0;
  var len = Math.sqrt(dx * dx + dy * dy);
  var ux = dx / len, uy = dy / len;
  var vx = -uy, vy = ux;
  for (var pi = 0; pi < 520; pi++){
    var pf = rng();
    var po = (rng() - 0.5) * 13;
    strikeParts.push({
      x: sx0 + ux * pf * len + vx * po,
      y: sy0 + uy * pf * len + vy * po,
      f: pf, s: 1 + rng() * 2.4, a: 0.3 + rng() * 0.6
    });
  }
  var prevX = sx0, prevY = sy0;
  for (var ci = 0; ci <= 40; ci++){
    var cf = ci / 40;
    var cxx = sx0 + dx * cf + vx * Math.sin(cf * 9) * 2.5;
    var cyy = sy0 + dy * cf + vy * Math.sin(cf * 9) * 2.5;
    strikeParts.push({core:true, f:cf, x1:prevX, y1:prevY, x2:cxx, y2:cyy});
    prevX = cxx; prevY = cyy;
  }
  cachedCycle = cyc;
}

function drawStroke(s){
  ctx.globalAlpha = s.a;
  ctx.strokeStyle = s.c;
  ctx.fillStyle = s.c;
  if (s.dot){
    ctx.fillRect(s.x - s.s / 2, s.y - s.s / 2, s.s, s.s);
  } else {
    ctx.lineWidth = s.w;
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function draw(t){
  var wh = viewportSize();
  var w = wh[0], h = wh[1];
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
  }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, w, h);

  var cyc = Math.floor(t / CYCLE_S);
  var ct = t - cyc * CYCLE_S;
  if (cyc !== cachedCycle || !pageRect){
    buildCycle(cyc, w, h);
  }
  var pg = pageRect;
  ctx.fillStyle = PAPER;
  ctx.fillRect(pg.x, pg.y, pg.w, pg.h);

  var total = strokes.length;
  var shown = 0;
  if (ct < DRAW_S){
    shown = Math.floor(total * ct / DRAW_S);
  } else {
    shown = total;
  }
  if (shown > 0){
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = DARK;
    ctx.fillRect(pg.x + pg.w, pg.y + 6, 7, pg.h);
    ctx.fillRect(pg.x + 6, pg.y + pg.h, pg.w, 7);
    ctx.globalAlpha = 1;
  }
  for (var i = 0; i < shown; i++){
    drawStroke(strokes[i]);
  }

  if (ct >= DRAW_S){
    var sp;
    if (ct < DRAW_S + STRIKE_S){
      sp = (ct - DRAW_S) / STRIKE_S;
    } else {
      sp = 1;
    }
    for (var j = 0; j < strikeParts.length; j++){
      var p = strikeParts[j];
      if (p.f > sp) continue;
      if (p.core){
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = PURPLE;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(p.x1, p.y1);
        ctx.lineTo(p.x2, p.y2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (p.f <= sp){
        ctx.globalAlpha = p.a;
        ctx.fillStyle = PURPLE;
        ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
        ctx.globalAlpha = 1;
      }
    }
  }

  if (ct >= DRAW_S + STRIKE_S + HOLD_S){
    var fa = (ct - DRAW_S - STRIKE_S - HOLD_S) / FADE_S;
    if (fa > 1) fa = 1;
    ctx.globalAlpha = fa;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
}

var startMs = null;
function loop(now){
  var t = (now - startMs) / 1000;
  currentT = t;
  draw(t);
  if (typeof requestAnimationFrame === 'function'){
    requestAnimationFrame(loop);
  }
}

draw(0);
if (typeof requestAnimationFrame === 'function'){
  startMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  requestAnimationFrame(loop);
}
if (typeof window !== 'undefined' && window.addEventListener){
  window.addEventListener('resize', function(){ draw(currentT); });
  if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener){
    visualViewport.addEventListener('resize', function(){ draw(currentT); });
  }
}
})();
</script>
</body>
</html>
