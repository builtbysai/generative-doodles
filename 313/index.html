<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.313 Potion Pair</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#171412; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.313 Potion Pair (Xanthe Caesia).
// Two small ceramic potion bottles, squat and round with cork
// stoppers: one raku black with feather-carbon trails, one cream
// with cobalt underglaze swirls. A faint gold thread of light arcs
// between their corks. No glass, no visible liquid: the potion
// shows only as a glowing seam at each cork and a light hum ring
// at each base. Drag one bottle and its pair follows on a
// critically-damped spring lag, upright and unflipped; the link
// stretches and brightens with separation, capped. Tap a cork and
// that bottle's glow pulses once while a single bubble rises in
// its seam light. Glow is layered translucent strokes only: no
// gradients, no blur filters, no second canvas, no text.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var RAKU = '#1E1A16', CREAM = '#F2EAD8', COBALT = '#2B5EA7';
var CORK = '#A4764A', GOLD = '#C9A227', EMBER = '#E2703A';
var GROUND = '#171412';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 4.5, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- seeded rng (static data generation only) -----------------------
function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

// ---- bottles: exactly 2, asserted ------------------------------------
var BOTTLES = [
  { kind: 'raku',  hx: 472, hy: 612, x: 472, y: 612, vx: 0, vy: 0, phase: 0 },
  { kind: 'cream', hx: 808, hy: 612, x: 808, y: 612, vx: 0, vy: 0, phase: 2.4 }
];
if (BOTTLES.length !== 2) throw new Error('Potion Pair needs exactly 2 bottles');
var HOME_SEP = Math.abs(BOTTLES[1].hx - BOTTLES[0].hx);
var MAX_SEP = HOME_SEP + 190;

// Bottle lathe profile: [dx, height above base] from bottom centre
// up the right side to the neck top. The left side mirrors it.
var PROF = [
  [0, 0], [62, 0], [84, 10], [92, 38], [92, 74],
  [86, 108], [70, 136], [50, 150], [30, 158], [27, 168], [27, 190]
];
var NECK_TOP = 190, CORK_H = 40, CORK_W = 24;
function bottlePath(cx, base) {
  var i, p;
  ctx.beginPath();
  ctx.moveTo(cx + PROF[0][0], base - PROF[0][1]);
  for (i = 1; i < PROF.length - 1; i++) {
    p = PROF[i];
    var nx = PROF[i + 1][0], ny = PROF[i + 1][1];
    ctx.quadraticCurveTo(cx + p[0], base - p[1], cx + (p[0] + nx) / 2, base - (p[1] + ny) / 2);
  }
  p = PROF[PROF.length - 1];
  ctx.lineTo(cx + p[0], base - p[1]);
  ctx.lineTo(cx - p[0], base - p[1]);
  for (i = PROF.length - 2; i >= 1; i--) {
    p = PROF[i];
    var px = PROF[i - 1][0], py = PROF[i - 1][1];
    ctx.quadraticCurveTo(cx - p[0], base - p[1], cx - (p[0] + px) / 2, base - (p[1] + py) / 2);
  }
  ctx.lineTo(cx - PROF[0][0], base - PROF[0][1]);
  ctx.closePath();
}
function corkPath(cx, base) {
  var x0 = cx - CORK_W, x1 = cx + CORK_W;
  var yTop = base - NECK_TOP - CORK_H + 4, yBot = base - NECK_TOP + 6;
  ctx.beginPath();
  ctx.moveTo(x0, yBot);
  ctx.lineTo(x0, yTop + 7);
  ctx.quadraticCurveTo(x0, yTop, x0 + 7, yTop);
  ctx.lineTo(x1 - 7, yTop);
  ctx.quadraticCurveTo(x1, yTop, x1, yTop + 7);
  ctx.lineTo(x1, yBot);
  ctx.closePath();
}
function corkTop(b) { return { x: b.x, y: b.y - NECK_TOP - CORK_H + 4 }; }
function seamY(b) { return b.y - NECK_TOP + 2; }

// ---- raku feather-carbon trails: seeded path data --------------------
// Each trail is a curving spine with short diagonal barbs, like the
// feathered carbon trails burnt into raku glaze.
var TRAILS = [];
(function () {
  var r = rng(31301), i, j;
  for (i = 0; i < 6; i++) {
    var x0 = -62 + i * 24 + (r() - 0.5) * 10;
    var y0 = 18 + r() * 26, len = 74 + r() * 52, sway = (r() - 0.5) * 34, lean = (r() - 0.5) * 40;
    var spine = [], barbs = [];
    var n = 7;
    for (j = 0; j <= n; j++) {
      var tt = j / n;
      spine.push({ x: x0 + lean * tt + sway * tt * tt, y: y0 + len * tt });
    }
    for (j = 1; j < n; j++) {
      var bp = spine[j], side = j % 2 ? 1 : -1;
      barbs.push({ x: bp.x, y: bp.y, dx: side * (7 + r() * 8), dy: -(4 + r() * 6) });
      barbs.push({ x: bp.x, y: bp.y, dx: -side * (5 + r() * 7), dy: -(3 + r() * 5) });
    }
    TRAILS.push({ spine: spine, barbs: barbs, a: 0.20 + r() * 0.22 });
  }
})();
if (TRAILS.length !== 6) throw new Error('Potion Pair needs exactly 6 raku trails');
// Raku speckle: pale salt flecks burnt into the black glaze.
var RAKU_SPECK = [];
(function () {
  var r = rng(31311), i;
  for (i = 0; i < 90; i++) {
    RAKU_SPECK.push({ x: (r() * 2 - 1) * 80, y: 12 + r() * 138, rad: 0.6 + r() * 1.5, a: 0.10 + r() * 0.30 });
  }
})();

// ---- cobalt swirls on the cream bottle: seeded path data -------------
var SWIRLS = [];
(function () {
  var r = rng(31302), i, j;
  for (i = 0; i < 4; i++) {
    var cx = -52 + i * 34 + (r() - 0.5) * 12;
    var cy = 44 + (i % 2) * 52 + r() * 18;
    var rMax = 15 + r() * 10, turns = 1.6 + r() * 0.7, ph = r() * Math.PI * 2;
    var pts = [];
    for (j = 0; j <= 40; j++) {
      var tt = j / 40, ang = ph + tt * turns * Math.PI * 2, rad = 1.5 + tt * rMax;
      pts.push({ x: cx + Math.cos(ang) * rad, y: cy + Math.sin(ang) * rad * 0.82 });
    }
    SWIRLS.push({ pts: pts, a: 0.55 + r() * 0.3 });
  }
})();
if (SWIRLS.length !== 4) throw new Error('Potion Pair needs exactly 4 cobalt swirls');
// Two broad cobalt sweep bands crossing the cream body.
var SWEEPS = [];
(function () {
  var r = rng(31321), i;
  for (i = 0; i < 2; i++) {
    SWEEPS.push({
      y0: 30 + i * 58 + r() * 10, y1: 62 + i * 52 + r() * 12,
      bend: -26 + r() * 52, w: 8 - i * 2.5, a: 0.50 - i * 0.14
    });
  }
})();
// Cork grain: seeded wavy vertical lines, shared shape per bottle.
var CORK_GRAIN = [];
(function () {
  var r = rng(31331), i, j;
  for (i = 0; i < 7; i++) {
    var gx = -18 + i * 6 + (r() - 0.5) * 2, pts = [];
    for (j = 0; j <= 3; j++) pts.push({ x: gx + (r() - 0.5) * 2.4, y: j / 3 });
    CORK_GRAIN.push({ pts: pts, a: 0.12 + r() * 0.16 });
  }
})();

// ---- interaction state ----------------------------------------------
var drag = null; // { idx, sx, sy, startDx, startDy, moved, lx, ly }
var pulseT0 = [-9, -9];
var bubbleT0 = [-9, -9];
var bubbleOff = [7, -8];

function springTo(b, tx, ty, dt) {
  // Critically-damped spring: stiffness k, damping c = 2*sqrt(k).
  var k = 30, c = 2 * Math.sqrt(k);
  var ax = k * (tx - b.x) - c * b.vx;
  var ay = k * (ty - b.y) - c * b.vy;
  b.vx += ax * dt; b.vy += ay * dt;
  b.x += b.vx * dt; b.y += b.vy * dt;
}
function tick(dt) {
  var i, b;
  if (drag) {
    var leader = BOTTLES[drag.idx], other = BOTTLES[1 - drag.idx];
    // The pair follows the leader's displacement, lagging on the spring.
    springTo(other, other.hx + (leader.x - leader.hx), other.hy + (leader.y - leader.hy), dt);
  } else {
    for (i = 0; i < BOTTLES.length; i++) {
      b = BOTTLES[i];
      if (Math.abs(b.x - b.hx) > 0.05 || Math.abs(b.y - b.hy) > 0.05 ||
          Math.abs(b.vx) > 0.5 || Math.abs(b.vy) > 0.5) {
        springTo(b, b.hx, b.hy, dt);
      } else { b.x = b.hx; b.y = b.hy; b.vx = 0; b.vy = 0; }
    }
  }
}

// ---- drawing ---------------------------------------------------------
function breathe(idx) {
  // 18s seamless idle loop: whole cycles only.
  return 0.5 + 0.5 * Math.sin(T * Math.PI * 2 / 18 + BOTTLES[idx].phase);
}
function pulseAmp(idx) {
  var dt = T - pulseT0[idx];
  if (dt < 0 || dt > 1.4) return 0;
  var p = dt / 1.4;
  return Math.sin(p * Math.PI) * (1 - p * 0.35);
}

function drawHumRing(b, idx) {
  var br = breathe(idx), pu = pulseAmp(idx);
  var inten = 0.55 + 0.45 * br + pu * 0.9;
  var i, rx;
  for (i = 5; i >= 1; i--) {
    rx = 62 + i * 10;
    ctx.globalAlpha = 0.028 * inten * (6 - i);
    st(EMBER, 3 + i * 1.6);
    ctx.beginPath(); ctx.ellipse(b.x, b.y + 7, rx, 6 + i * 2.1, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 0.16 * inten;
  st(EMBER, 2);
  ctx.beginPath(); ctx.ellipse(b.x, b.y + 7, 66, 7, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawRakuDecor(b) {
  var i, j, tr;
  for (i = 0; i < TRAILS.length; i++) {
    tr = TRAILS[i];
    // carbon haze under the feather
    ctx.globalAlpha = tr.a * 0.30;
    st(CREAM, 5.5);
    ctx.beginPath();
    for (j = 0; j < tr.spine.length; j++) {
      if (j === 0) ctx.moveTo(b.x + tr.spine[j].x, b.y - tr.spine[j].y);
      else ctx.lineTo(b.x + tr.spine[j].x, b.y - tr.spine[j].y);
    }
    ctx.stroke();
    // spine
    ctx.globalAlpha = tr.a + 0.14;
    st(CREAM, 1.6);
    ctx.beginPath();
    for (j = 0; j < tr.spine.length; j++) {
      if (j === 0) ctx.moveTo(b.x + tr.spine[j].x, b.y - tr.spine[j].y);
      else ctx.lineTo(b.x + tr.spine[j].x, b.y - tr.spine[j].y);
    }
    ctx.stroke();
    // feather barbs
    ctx.globalAlpha = tr.a * 0.85;
    st(CREAM, 1.1);
    for (j = 0; j < tr.barbs.length; j++) {
      var bb = tr.barbs[j];
      ctx.beginPath();
      ctx.moveTo(b.x + bb.x, b.y - bb.y);
      ctx.lineTo(b.x + bb.x + bb.dx, b.y - bb.y + bb.dy);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  for (i = 0; i < RAKU_SPECK.length; i++) {
    var sp = RAKU_SPECK[i];
    ctx.globalAlpha = sp.a;
    ctx.fillStyle = CREAM;
    circ(b.x + sp.x, b.y - sp.y, sp.rad, true);
  }
  ctx.globalAlpha = 1;
}

function drawCreamDecor(b) {
  var i, j;
  // broad sweep bands first, under the spirals
  for (i = 0; i < SWEEPS.length; i++) {
    var sw = SWEEPS[i];
    ctx.globalAlpha = sw.a;
    st(COBALT, sw.w);
    ctx.beginPath();
    ctx.moveTo(b.x - 84, b.y - sw.y0);
    ctx.quadraticCurveTo(b.x, b.y - sw.y0 - sw.bend, b.x + 84, b.y - sw.y1);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (i = 0; i < SWIRLS.length; i++) {
    var s = SWIRLS[i];
    ctx.globalAlpha = s.a;
    st(COBALT, 3.6);
    ctx.beginPath();
    for (j = 0; j < s.pts.length; j++) {
      if (j === 0) ctx.moveTo(b.x + s.pts[j].x, b.y - s.pts[j].y);
      else ctx.lineTo(b.x + s.pts[j].x, b.y - s.pts[j].y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBottle(b, idx) {
  var isRaku = b.kind === 'raku';
  // body
  bottlePath(b.x, b.y);
  ctx.fillStyle = isRaku ? RAKU : CREAM;
  ctx.fill();
  // decoration clipped inside the body
  ctx.save();
  bottlePath(b.x, b.y);
  ctx.clip();
  if (isRaku) drawRakuDecor(b); else drawCreamDecor(b);
  // soft shading at the belly edges, palette colours at low alpha
  ctx.globalAlpha = 0.055;
  ctx.fillStyle = isRaku ? CREAM : RAKU;
  ctx.beginPath(); ctx.ellipse(b.x - 60, b.y - 74, 12, 58, 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.04;
  ctx.beginPath(); ctx.ellipse(b.x + 64, b.y - 66, 11, 50, -0.16, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
  // body outline
  bottlePath(b.x, b.y);
  ctx.globalAlpha = isRaku ? 0.5 : 0.65;
  st(GROUND, 3);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // cork stopper
  corkPath(b.x, b.y);
  ctx.fillStyle = CORK;
  ctx.fill();
  ctx.globalAlpha = 0.7; st(GROUND, 2.2); ctx.stroke(); ctx.globalAlpha = 1;
  // cork top face
  var ct = corkTop(b);
  ctx.beginPath(); ctx.ellipse(ct.x, ct.y + 1, CORK_W - 2, 5.5, 0, 0, Math.PI * 2);
  ctx.globalAlpha = 0.22; ctx.fillStyle = RAKU; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.ellipse(ct.x, ct.y, CORK_W - 5, 4, 0, 0, Math.PI * 2);
  ctx.globalAlpha = 0.16; ctx.fillStyle = CREAM; ctx.fill(); ctx.globalAlpha = 1;
  // cork grain
  var i, j, g;
  var yTop = ct.y, yBot = b.y - NECK_TOP + 6;
  for (i = 0; i < CORK_GRAIN.length; i++) {
    g = CORK_GRAIN[i];
    ctx.globalAlpha = g.a;
    st(RAKU, 1.3);
    ctx.beginPath();
    for (j = 0; j < g.pts.length; j++) {
      var gx = b.x + g.pts[j].x, gy = yTop + 5 + g.pts[j].y * (yBot - yTop - 8);
      if (j === 0) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawSeamGlow(b, idx) {
  var br = breathe(idx), pu = pulseAmp(idx);
  var inten = 0.35 + 0.65 * br + pu * 1.25;
  var sy = seamY(b), i;
  // layered translucent strokes only, widening as they soften
  for (i = 5; i >= 1; i--) {
    ctx.globalAlpha = clamp(0.05 * inten * (6 - i), 0, 0.6);
    st(EMBER, 2 + i * 2.2);
    ctx.beginPath(); ctx.ellipse(b.x, sy, 27 + i * 2.4, 3.6 + i * 1.15, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = clamp(0.62 * inten, 0, 1);
  st(EMBER, 2.4);
  ctx.beginPath(); ctx.ellipse(b.x, sy, 28, 4.2, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = clamp(0.85 * inten, 0, 1);
  st(CREAM, 1.1);
  ctx.beginPath(); ctx.ellipse(b.x, sy, 24, 2.6, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
  // the single rising bubble, recycled per cork tap
  var bt = T - bubbleT0[idx];
  if (bt >= 0 && bt < 1.6) {
    var p = bt / 1.6;
    var bx = b.x + bubbleOff[idx] + Math.sin(p * 5 + idx * 2) * 3.5;
    var by = sy - 4 - p * 46;
    var brad = 2.6 + p * 3.6, ba = (1 - p) * (1 - p);
    ctx.globalAlpha = ba * 0.30; ctx.fillStyle = EMBER;
    circ(bx, by, brad * 1.9, true);
    ctx.globalAlpha = ba * 0.85; ctx.fillStyle = EMBER;
    circ(bx, by, brad, true);
    ctx.globalAlpha = ba; ctx.fillStyle = CREAM;
    circ(bx - brad * 0.3, by - brad * 0.3, brad * 0.38, true);
    ctx.globalAlpha = 1;
  }
}

function drawLink() {
  var a = corkTop(BOTTLES[0]), c = corkTop(BOTTLES[1]);
  var dx = c.x - a.x, dy = c.y - a.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var stretch = clamp((dist - HOME_SEP) / (MAX_SEP - HOME_SEP), 0, 1);
  var mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2 - 92 - stretch * 26;
  var breatheLink = 0.5 + 0.5 * Math.sin(T * Math.PI * 2 / 18 + 1.1);
  var bright = 0.30 + 0.22 * breatheLink + stretch * 0.55;
  // layered translucent strokes, outer soft to inner bright
  var layers = [
    { w: 8.5, a: 0.10 }, { w: 5, a: 0.18 }, { w: 2.8, a: 0.38 }, { w: 1.4, a: 0.75 }
  ];
  var i;
  for (i = 0; i < layers.length; i++) {
    ctx.globalAlpha = clamp(layers[i].a * bright / 0.52, 0, 1);
    st(GOLD, layers[i].w);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - 2);
    ctx.quadraticCurveTo(mx, my, c.x, c.y - 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // anchor glints where the thread meets each cork
  var ends = [a, c];
  for (i = 0; i < ends.length; i++) {
    ctx.globalAlpha = 0.22 * bright / 0.52; ctx.fillStyle = GOLD;
    circ(ends[i].x, ends[i].y - 2, 8, true);
    ctx.globalAlpha = clamp(0.8 * bright / 0.52, 0, 1);
    circ(ends[i].x, ends[i].y - 2, 2.8, true);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var i;
  for (i = 0; i < BOTTLES.length; i++) drawHumRing(BOTTLES[i], i);
  for (i = 0; i < BOTTLES.length; i++) drawBottle(BOTTLES[i], i);
  drawLink();
  for (i = 0; i < BOTTLES.length; i++) drawSeamGlow(BOTTLES[i], i);
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function inBottle(p, b) {
  var dx = Math.abs(p[0] - b.x), dyTop = b.y - 234, dyBot = b.y + 8;
  if (p[1] < dyTop || p[1] > dyBot) return false;
  if (p[1] < b.y - 150) return dx <= 56;
  return dx <= 102;
}
function inCork(p, b) {
  return Math.abs(p[0] - b.x) <= 36 && p[1] >= b.y - 240 && p[1] <= b.y - NECK_TOP + 14;
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e), i;
  for (i = 0; i < BOTTLES.length; i++) {
    if (inBottle(p, BOTTLES[i])) {
      drag = {
        idx: i, sx: p[0], sy: p[1], moved: 0,
        startDx: BOTTLES[i].x - BOTTLES[i].hx,
        startDy: BOTTLES[i].y - BOTTLES[i].hy,
        lx: BOTTLES[i].x, ly: BOTTLES[i].y
      };
      return;
    }
  }
  drag = null;
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = toDesign(e);
  drag.moved = Math.max(drag.moved, Math.abs(p[0] - drag.sx), Math.abs(p[1] - drag.sy));
  var b = BOTTLES[drag.idx];
  var ndx = drag.startDx + (p[0] - drag.sx);
  var ndy = drag.startDy + (p[1] - drag.sy);
  // clamp the pair: leader stays in frame and separation stays capped
  ndx = clamp(ndx, 190 - b.hx, 1090 - b.hx);
  ndy = clamp(ndy, 430 - b.hy, 742 - b.hy);
  var other = BOTTLES[1 - drag.idx];
  var sepX = (b.hx + ndx) - other.hx;
  if (Math.abs(sepX) > MAX_SEP) ndx = (other.hx + (sepX > 0 ? MAX_SEP : -MAX_SEP)) - b.hx;
  var nx = b.hx + ndx, ny = b.hy + ndy;
  // estimate leader velocity so the release spring starts smoothly
  b.vx = clamp((nx - drag.lx) * 14, -900, 900);
  b.vy = clamp((ny - drag.ly) * 14, -900, 900);
  drag.lx = nx; drag.ly = ny;
  b.x = nx; b.y = ny;
});
canvas.addEventListener('pointerup', function (e) {
  if (drag && drag.moved < 9) {
    var p = toDesign(e), i;
    for (i = 0; i < BOTTLES.length; i++) {
