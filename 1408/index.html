<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selby Circle</title>
<style>
  html, body { margin: 0; padding: 0; background: #a8805a; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1408000);
  function rr(a, b) { return a + rng() * (b - a); }
  function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
  // Round fading alphas to 4 decimals (node-canvas scientific-notation quirk).
  function a4(x) { return Math.round(Math.max(0, Math.min(1, x)) * 10000) / 10000; }
  function rgba(hex, al) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(al) + ')';
  }

  var W = 0, H = 0;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(1, Math.floor(w)); H = Math.max(1, Math.floor(h));
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  size();
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', size);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', size);
    }
  }

  // ---- Board grain: seeded flat strokes, fixed at layout time ----
  var grain = [];
  (function () {
    var n = 90;
    for (var i = 0; i < n; i++) {
      grain.push({ x: rng(), y: rng(), len: rr(0.04, 0.22), w: rr(1, 3), al: rr(0.04, 0.12), shade: pick(['#4a3826', '#8a6a44', '#c09a6a']) });
    }
  })();

  // ---- Vibration objects: quills, nails, cogs ----
  var KINDS = ['quill', 'nail', 'cog'];
  var objs = [];
  (function () {
    var count = 15;
    for (var i = 0; i < count; i++) {
      var kind = KINDS[i % 3];
      var edge = i % 4; // objects enter from the edges
      var bx, by;
      if (edge === 0) { bx = rr(0.02, 0.2); by = rr(0.05, 0.95); }
      else if (edge === 1) { bx = rr(0.8, 0.98); by = rr(0.05, 0.95); }
      else if (edge === 2) { bx = rr(0.05, 0.95); by = rr(0.02, 0.2); }
      else { bx = rr(0.05, 0.95); by = rr(0.8, 0.98); }
      objs.push({
        kind: kind, bx: bx, by: by,
        wx1: rr(0.08, 0.18), wx2: rr(0.05, 0.12), wy1: rr(0.08, 0.18), wy2: rr(0.05, 0.12),
        f1: rr(0.05, 0.12), f2: rr(0.05, 0.12), f3: rr(0.05, 0.12), f4: rr(0.05, 0.12),
        p1: rr(0, 6.283), p2: rr(0, 6.283), p3: rr(0, 6.283), p4: rr(0, 6.283),
        rot: rr(0, 6.283), rotSpd: rr(-0.25, 0.25),
        size: kind === 'cog' ? rr(10, 18) : (kind === 'quill' ? rr(22, 38) : rr(10, 16)),
        ink: pick(['#1f5fb8', '#1f5fb8', '#7aa8d8', '#e8e4da']),
        hopPh: rr(0, 6.283), hopFr: rr(0.5, 0.9)
      });
    }
  })();

  // ---- Ink splatter: stored history, oldest marks fade slowly, never wiped ----
  var stamps = [];
  function addStamp(x, y, big, col, age0) {
    var dots = [];
    var n = big ? 14 : 7;
    for (var i = 0; i < n; i++) {
      var ang = rng() * 6.283, dist = Math.pow(rng(), 0.6) * (big ? 26 : 14);
      dots.push({ dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist, s: rr(1, big ? 5 : 3), al: rr(0.25, 0.85) });
    }
    stamps.push({ x: x, y: y, col: col, born: age0, dots: dots });
    if (stamps.length > 900) stamps.splice(0, stamps.length - 900);
  }
  // Pre-seed a field at load: denser toward center, thinner at the rim.
  (function () {
    var cx = 0.5, cy = 0.5;
    for (var i = 0; i < 240; i++) {
      var ang = rng() * 6.283, rad = Math.pow(rng(), 1.6) * 0.48;
      var x = (cx + Math.cos(ang) * rad), y = (cy + Math.sin(ang) * rad * 0.9);
      addStamp(x, y, rng() < 0.25, pick(['#1f5fb8', '#1f5fb8', '#7aa8d8', '#e8e4da']), -rr(0, 90));
    }
  })();
  // Stamp age at piece time t: stamp.born is a piece-time birth (negative = pre-seeded).
  function stampAlpha(st, t) {
    var age = t - st.born;
    if (age < 0) return 0;
    if (age < 60) return 1;
    if (age < 180) return 1 - (age - 60) / 120; // slow fade of oldest marks only
    return 0;
  }

  // ---- Drag: localized driver gain field from recorded samples ----
  var drags = []; // {x, y (fractions), t}
  var dragging = false;
  function toFrac(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: (cx - r.left) / Math.max(1, W), y: (cy - r.top) / Math.max(1, H) };
  }
  function onDown(e) { dragging = true; recordDrag(e); }
  function onMove(e) { if (dragging) recordDrag(e); }
  function onUp() { dragging = false; }
  function recordDrag(e) {
    var f = toFrac(e);
    drags.push({ x: f.x, y: f.y, t: nowT });
    if (drags.length > 400) drags.splice(0, drags.length - 400);
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  var nowT = 0;
  var lastStampPulse = -1;

  // Low-frequency driver: pulses roughly every 3.2 s, shaped so hops read as beats.
  function driver(t) {
    var ph = (t % 3.2) / 3.2;
    var s = Math.sin(ph * 6.283);
    return Math.pow(Math.max(0, s), 2);
  }

  function gainAt(x, y, t) {
    var g = 1;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      var age = t - d.t;
      if (age < 0 || age > 6) continue;
      var dx = x - d.x, dy = y - d.y;
      var dist2 = dx * dx + dy * dy;
      g += 2.2 * Math.exp(-dist2 / (2 * 0.13 * 0.13)) * Math.exp(-age / 3);
    }
    return g;
  }

  function objPos(o, t) {
    var d = driver(t);
    var wx = o.wx1 * Math.sin(t * 0.021 * 6.283 + o.p1) + o.wx2 * Math.sin(t * 0.013 * 6.283 + o.p2);
    var wy = o.wy1 * Math.sin(t * 0.017 * 6.283 + o.p3) + o.wy2 * Math.sin(t * 0.011 * 6.283 + o.p4);
    // Gain is read at the object's CURRENT wander position, so the drag
    // turns up exactly the objects near the drag, wherever they have roamed.
    var g0 = gainAt(Math.max(0.02, Math.min(0.98, o.bx + wx)), Math.max(0.02, Math.min(0.98, o.by + wy)), t);
    var hop = Math.pow(Math.max(0, Math.sin(t * o.hopFr * 6.283 + o.hopPh)), 2) * d;
    var jx = (Math.sin(t * o.f1 * 6.283 + o.p1) + 0.6 * Math.sin(t * o.f2 * 6.283 + o.p2)) * (0.012 + 0.02 * d * g0);
    var jy = (Math.sin(t * o.f3 * 6.283 + o.p3) + 0.6 * Math.sin(t * o.f4 * 6.283 + o.p4)) * (0.012 + 0.02 * d * g0);
    var cx = o.bx + wx + jx, cy = o.by + wy + jy - hop * 0.012;
    // Keep wanderers on the board (closed-form clamp).
    cx = Math.max(0.02, Math.min(0.98, cx)); cy = Math.max(0.02, Math.min(0.98, cy));
    return {
      x: cx,
      y: cy,
      rot: o.rot + t * o.rotSpd + Math.sin(t * o.f1 * 6.283 + o.p1) * 0.2 * (1 + d),
      hop: hop, gain: g0
    };
  }

  function drawObj(o, p) {
    var px = p.x * W, py = p.y * H, s = o.size;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(p.rot);
    if (o.kind === 'quill') {
      // Tapered feather: shaft + vane, flat fills only.
      ctx.fillStyle = '#e8e4da';
      ctx.beginPath();
      ctx.moveTo(-s, 0); ctx.lineTo(s * 0.9, -s * 0.28); ctx.lineTo(s, 0); ctx.lineTo(s * 0.9, s * 0.28);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#4a3826';
      ctx.fillRect(-s - 4, -1, s * 2 + 8, 2);
      ctx.fillStyle = o.ink;
      ctx.fillRect(-s * 0.2, -2, s * 0.5, 4);
    } else if (o.kind === 'nail') {
      ctx.fillStyle = '#6a6e72';
      ctx.fillRect(-s, -2, s * 2, 4);
      ctx.fillStyle = '#4a3826';
      ctx.beginPath(); ctx.moveTo(s, -3); ctx.lineTo(s + 5, 0); ctx.lineTo(s, 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8a8f94';
      ctx.fillRect(-s - 3, -4, 4, 8);
    } else {
      // Cog: toothed wheel as flat rects + a disc (each arc its own beginPath).
      ctx.fillStyle = '#6a6e72';
      for (var k = 0; k < 10; k++) {
        ctx.save();
        ctx.rotate(k * 0.6283);
        ctx.fillRect(s - 2, -3, 6, 6);
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(0, 0, s, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#a8805a';
      ctx.beginPath(); ctx.arc(0, 0, s * 0.32, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#4a3826';
      ctx.beginPath(); ctx.arc(0, 0, s * 0.12, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }

  function draw(t) {
    nowT = t;
    // Board fills the frame edge to edge.
    ctx.fillStyle = '#a8805a';
    ctx.fillRect(0, 0, W, H);
    // Grain strokes.
    for (var gi = 0; gi < grain.length; gi++) {
      var g = grain[gi];
      ctx.fillStyle = rgba(g.shade, g.al);
      ctx.fillRect(g.x * W, g.y * H, g.len * W, g.w);
    }
    // Drop fresh splatter on each driver pulse peak (closed-form schedule).
    var pulseIdx = Math.floor(t / 3.2);
    if (pulseIdx > lastStampPulse) {
      lastStampPulse = pulseIdx;
      for (var oi = 0; oi < objs.length; oi++) {
        var o = objs[oi];
        var p = objPos(o, t);
        var g = gainAt(p.x, p.y, t);
        var n = g > 2.0 ? 4 : (g > 1.3 ? 3 : (g > 1.1 ? 2 : 1));
        for (var q = 0; q < n; q++) {
          addStamp(p.x + rr(-0.02, 0.02), p.y + rr(-0.02, 0.02), g > 1.6, o.ink, t);
        }
      }
      // Every pulse, wanderers drop ink near the center too, so the field
      // stays center-dense as the oldest marks fade (never a wipe).
      for (var ci = 0; ci < 10; ci++) {
        var ang = rng() * 6.283, rad = Math.pow(rng(), 2.0) * 0.30;
        addStamp(0.5 + Math.cos(ang) * rad, 0.5 + Math.sin(ang) * rad * 0.9, false, pick(['#1f5fb8', '#1f5fb8', '#7aa8d8', '#e8e4da']), t);
      }
    }
    // Ink stamps, oldest fading only.
    for (var si = 0; si < stamps.length; si++) {
      var st = stamps[si];
      var fa = stampAlpha(st, t);
      if (fa <= 0) continue;
      for (var di = 0; di < st.dots.length; di++) {
        var d = st.dots[di];
        ctx.fillStyle = rgba(st.col, d.al * fa);
        ctx.fillRect(st.x * W + d.dx, st.y * H + d.dy, d.s, d.s);
      }
    }
    // Objects on top of the ink.
    for (var i2 = 0; i2 < objs.length; i2++) {
      var o2 = objs[i2];
      var p2 = objPos(o2, t);
      // Soft flat-alpha shadow offset down-right (never shadowBlur).
      ctx.fillStyle = rgba('#4a3826', 0.18);
      ctx.fillRect(p2.x * W - o2.size + 3, p2.y * H - o2.size * 0.4 + 4, o2.size * 2, o2.size * 0.8);
      drawObj(o2, p2);
    }
  }

  // Frame one = draw(0) via boot flag; clock starts only with the rAF loop.
  draw(0);
  var startTime = null;
  function loop(ts) {
    if (startTime === null) startTime = ts;
    draw((ts - startTime) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
