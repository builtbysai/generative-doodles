<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9101 · The Juggler</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0806; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // After Luther Bangert: a juggler in black on a warm stage, five white
  // balls in a true cascade. The physics is Shannon's: each ball flies
  // 70% of its cycle and rides in a hand for the rest (hand dwell ratio
  // 0.75, the expert value). Hands scoop the way real hands do — catch
  // wide, carry low across the body, throw from inside — and two-bone
  // IK arms make the hands, not the drawing, do the work. Watch only.

  var T = 2200;              // one ball's full cycle, ms
  var DWELL = 0.30;          // fraction of the ball cycle spent in a hand
  var HAND_CYCLE = 0.40;     // in ball-cycle units (Shannon: 2 hands, 5 balls)
  var N_BALLS = 5;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, FH = 0, CX = 0;
  var TOP = 0, FLOOR = 0, SHOULDER_Y = 0, HIP_Y = 0, HAND_Y = 0;
  var CATCH_X = 0, THROW_X = 0, DIP = 0, APEX_H = 0, BALL_R = 0;
  var L1 = 0, L2 = 0;
  var backdrop = null, ballSprite = null;

  function frac(x) { return x - Math.floor(x); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function easeInOut(t) { return t * t * (3 - 2 * t); }

  // ---- stage geometry, rebuilt on resize -----------------------------------
  function build() {
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    FH = 0.58 * H;                    // figure height: head 30% -> feet 88%
    CX = W / 2;
    TOP = 0.30 * H;
    FLOOR = 0.88 * H;
    SHOULDER_Y = TOP + 0.19 * FH;
    HIP_Y = TOP + 0.52 * FH;
    HAND_Y = TOP + 0.46 * FH;
    CATCH_X = 0.36 * FH;              // catches land wide
    THROW_X = 0.19 * FH;              // throws leave from inside the catch width
    DIP = 0.05 * FH;
    APEX_H = HAND_Y - 0.12 * H;       // cascade apex at ~12% of the screen
    BALL_R = 0.024 * FH;
    L1 = 0.20 * FH;                   // upper arm
    L2 = 0.215 * FH;                  // forearm + hand

    bakeBackdrop();
    bakeBall();
  }

  function bakeBackdrop() {
    backdrop = document.createElement('canvas');
    backdrop.width = Math.max(2, Math.floor(W));
    backdrop.height = Math.max(2, Math.floor(H));
    var g = backdrop.getContext('2d');

    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#181009');
    grad.addColorStop(0.55, '#0e0906');
    grad.addColorStop(1, '#070504');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    // the red-lit panel from his stage photographs: a broad warm glow
    var panel = g.createRadialGradient(CX, 0.40 * H, 0, CX, 0.40 * H, 0.72 * Math.max(W, H));
    panel.addColorStop(0, 'rgba(172,58,34,0.50)');
    panel.addColorStop(0.45, 'rgba(128,40,24,0.26)');
    panel.addColorStop(1, 'rgba(90,26,16,0)');
    g.fillStyle = panel;
    g.fillRect(0, 0, W, H);

    // amber core behind the figure
    var core = g.createRadialGradient(CX, 0.38 * H, 0, CX, 0.38 * H, 0.36 * FH * 1.6);
    core.addColorStop(0, 'rgba(255,122,58,0.15)');
    core.addColorStop(1, 'rgba(255,122,58,0)');
    g.fillStyle = core;
    g.fillRect(0, 0, W, H);

    // floor and its pool of light (edge feathered, no hard horizon)
    var fg = g.createLinearGradient(0, FLOOR - 0.045 * H, 0, H);
    fg.addColorStop(0, 'rgba(74,46,26,0)');
    fg.addColorStop(0.35, 'rgba(74,46,26,0.42)');
    fg.addColorStop(1, 'rgba(12,7,4,0.92)');
    g.fillStyle = fg;
    g.fillRect(0, FLOOR - 0.045 * H, W, H - FLOOR + 0.045 * H);

    g.save();
    g.translate(CX, FLOOR + 0.012 * H);
    g.scale(1, 0.16);
    var pool = g.createRadialGradient(0, 0, 0, 0, 0, 0.46 * W);
    pool.addColorStop(0, 'rgba(255,170,92,0.20)');
    pool.addColorStop(1, 'rgba(255,170,92,0)');
    g.fillStyle = pool;
    g.beginPath();
    g.arc(0, 0, 0.46 * W, 0, 6.2832);
    g.fill();
    g.restore();

    // vignette
    var vg = g.createRadialGradient(CX, 0.46 * H, 0.34 * Math.max(W, H), CX, 0.46 * H, 0.98 * Math.max(W, H));
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.44)');
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);
  }

  function bakeBall() {
    var d = 128;
    ballSprite = document.createElement('canvas');
    ballSprite.width = ballSprite.height = d;
    var g = ballSprite.getContext('2d');
    var rg = g.createRadialGradient(d * 0.38, d * 0.32, d * 0.05, d * 0.5, d * 0.52, d * 0.54);
    rg.addColorStop(0, '#fffdf6');
    rg.addColorStop(0.55, '#f4ecd9');
    rg.addColorStop(0.86, '#d8cba9');
    rg.addColorStop(1, '#b3a37f');
    g.fillStyle = rg;
    g.beginPath();
    g.arc(d / 2, d / 2, d * 0.49, 0, 6.2832);
    g.fill();
  }

  // ---- body rhythm ----------------------------------------------------------
  function swaySh(u) { return 0.010 * FH * Math.sin(6.2832 * u / HAND_CYCLE); }
  function swayHip(u) { return 0.008 * FH * Math.sin(6.2832 * u / HAND_CYCLE); }
  function bob(u) { return 0.006 * FH * Math.sin(12.5664 * u / HAND_CYCLE + 1.0); }

  // ---- hands: the scoop ------------------------------------------------------
  // q = 0 at the catch (wide), q = 0.75 at the throw (inside): the hand
  // carries for 75% of its cycle, then swings back out empty.
  function handPos(h, u) {
    var s = h === 0 ? -1 : 1;
    var q = frac((u - h * 0.2) / HAND_CYCLE);
    var x, y;
    if (q < 0.75) {
      var w = easeInOut(q / 0.75);
      x = s * lerp(CATCH_X, THROW_X, w);
      y = HAND_Y + DIP * Math.sin(Math.PI * Math.pow(q / 0.75, 0.9));
    } else {
      var v = (q - 0.75) / 0.25;
      var e = 1 - (1 - v) * (1 - v);
      x = s * lerp(THROW_X, CATCH_X, e);
      y = HAND_Y + DIP * 0.35 * Math.sin(Math.PI * v);
    }
    return { x: CX + x + swaySh(u), y: y + bob(u) };
  }

  // where a ball's centre rides relative to its hand
  function heldPos(h, u) {
    var p = handPos(h, u);
    return { x: p.x, y: p.y - BALL_R * 0.55 };
  }

  // ---- balls -----------------------------------------------------------------
  function ballPos(i, u) {
    var uu = u - i * 0.2;
    var k = Math.floor(uu);
    var p = uu - k;
    var hand = (((i + k) % 2) + 2) % 2;
    if (p < DWELL) {
      var hp = heldPos(hand, u);
      return { x: hp.x, y: hp.y, held: true };
    }
    var w = (p - DWELL) / (1 - DWELL);
    var A = heldPos(hand, (i * 0.2) + k + DWELL);       // release point
    var B = heldPos(1 - hand, (i * 0.2) + k + 1);       // catch point, other hand
    return {
      x: lerp(A.x, B.x, w),
      y: lerp(A.y, B.y, w) - APEX_H * 4 * w * (1 - w),
      held: false
    };
  }

  // ---- arms: two-bone IK, elbow down and a touch out -------------------------
  function elbow(S, P, s) {
    var dx = P.x - S.x, dy = P.y - S.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var maxD = (L1 + L2) * 0.999;
    if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
    if (d < 1) { dx = 0; dy = 1; d = 1; }
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var hgt = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var mx = S.x + dx * a / d, my = S.y + dy * a / d;
    var px = -dy / d, py = dx / d;
    if (py < 0) { px = -px; py = -py; }
    return { x: mx + px * hgt + s * 0.012 * FH, y: my + py * hgt };
  }

  function limb(g, A, B, C, wA, wB, wC, col) {
    g.strokeStyle = col;
    g.lineCap = 'round';
    g.lineWidth = wA;
    g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke();
    g.lineWidth = wB;
    g.beginPath(); g.moveTo(B.x, B.y); g.lineTo(C.x, C.y); g.stroke();
    g.fillStyle = col;
    g.beginPath(); g.arc(B.x, B.y, wB * 0.5, 0, 6.2832); g.fill();
    g.beginPath(); g.arc(C.x, C.y, wC * 0.5, 0, 6.2832); g.fill();
  }

  // smooth closed path through points (quadratic midpoints)
  function smoothClosed(g, pts) {
    var n = pts.length;
    var mx = (pts[0].x + pts[n - 1].x) / 2, my = (pts[0].y + pts[n - 1].y) / 2;
    g.beginPath();
    g.moveTo(mx, my);
    for (var i = 0; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n];
      g.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
    }
    g.closePath();
  }

  var INK = '#161110';
  var INK_FAR = '#100d0b';
  var RIM = 'rgba(255,176,110,';

  function drawFigure(u, balls) {
    var g = ctx;
    var swS = swaySh(u), swH = swayHip(u), bb = bob(u);
    var shY = SHOULDER_Y + bb * 0.7;
    var hipY = HIP_Y + bb;

    // arm roots sit a shade inside the torso line so the joints don't knob
    var sh = [
      { x: CX - 0.115 * FH + swS, y: shY + 0.01 * FH },
      { x: CX + 0.115 * FH + swS, y: shY + 0.01 * FH }
    ];
    var hands = [handPos(0, u), handPos(1, u)];
    var elb = [elbow(sh[0], hands[0], -1), elbow(sh[1], hands[1], 1)];

    // soft shadow on the floor
    g.save();
    g.translate(CX + swH * 0.5, FLOOR + 0.006 * H);
    g.scale(1, 0.14);
    var shad = g.createRadialGradient(0, 0, 0, 0, 0, 0.30 * FH);
    shad.addColorStop(0, 'rgba(0,0,0,0.42)');
    shad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = shad;
    g.beginPath(); g.arc(0, 0, 0.30 * FH, 0, 6.2832); g.fill();
    g.restore();

    // legs: relaxed stance, knees soft
    for (var li = 0; li < 2; li++) {
      var s = li === 0 ? -1 : 1;
      var hip = { x: CX + s * 0.072 * FH + swH, y: hipY + 0.02 * FH };
      var ank = { x: CX + s * 0.148 * FH, y: FLOOR - 0.018 * FH };
      var knee = {
        x: (hip.x + ank.x) / 2 + s * 0.014 * FH,
        y: (hip.y + ank.y) / 2 + 0.012 * FH
      };
      limb(g, hip, knee, ank, 0.082 * FH, 0.058 * FH, 0.04 * FH, INK);
      // foot
      g.fillStyle = INK;
      g.save();
      g.translate(ank.x + s * 0.016 * FH, FLOOR - 0.008 * FH);
      g.rotate(s * 0.10);
      g.beginPath(); g.ellipse(0, 0, 0.046 * FH, 0.015 * FH, 0, 0, 6.2832); g.fill();
      g.restore();
    }

    // far arm, behind the torso
    limb(g, sh[0], elb[0], hands[0], 0.047 * FH, 0.040 * FH, 0.034 * FH, INK_FAR);

    // neck: a trapezoid that widens into the chest, drawn before the
    // torso so the join disappears
    g.fillStyle = INK;
    g.beginPath();
    g.moveTo(CX - 0.024 * FH + swS, shY - 0.075 * FH);
    g.lineTo(CX + 0.024 * FH + swS, shY - 0.075 * FH);
    g.lineTo(CX + 0.046 * FH + swS, shY + 0.03 * FH);
    g.lineTo(CX - 0.046 * FH + swS, shY + 0.03 * FH);
    g.closePath();
    g.fill();

    // torso: shoulders broad, waist narrow, hips between
    var torso = [
      { x: CX - 0.040 * FH + swS, y: shY - 0.030 * FH },
      { x: CX - 0.135 * FH + swS, y: shY + 0.014 * FH },
      { x: CX - 0.079 * FH + swH, y: HIP_Y - 0.07 * FH },
      { x: CX - 0.088 * FH + swH, y: hipY + 0.045 * FH },
      { x: CX + 0.088 * FH + swH, y: hipY + 0.045 * FH },
      { x: CX + 0.079 * FH + swH, y: HIP_Y - 0.07 * FH },
      { x: CX + 0.135 * FH + swS, y: shY + 0.014 * FH },
      { x: CX + 0.040 * FH + swS, y: shY - 0.030 * FH }
    ];
    smoothClosed(g, torso);
    g.fillStyle = INK;
    g.fill();
    // rim light that truly hugs the lit edge: stroke the torso outline,
    // clipped to a band along its right side only
    g.save();
    g.beginPath();
    g.rect(CX + 0.055 * FH, shY + 0.03 * FH, W - CX, (hipY + 0.005 * FH) - (shY + 0.03 * FH));
    g.clip();
    smoothClosed(g, torso);
    g.strokeStyle = RIM + '0.28)';
    g.lineWidth = Math.max(1.4, 0.007 * FH);
    g.stroke();
    g.restore();

    // head, tilting a breath toward the highest ball
    var topBall = null;
    for (var bi = 0; bi < balls.length; bi++) {
      if (!balls[bi].held && (!topBall || balls[bi].y < topBall.y)) topBall = balls[bi];
    }
    var tilt = topBall ? clamp((topBall.x - CX) / (0.5 * W), -1, 1) * 0.055 : 0;
    g.save();
    g.translate(CX + swS, shY - 0.012 * FH);
    g.rotate(tilt);
    var headCY = -0.108 * FH;
    g.beginPath();
    g.ellipse(0, headCY, 0.054 * FH, 0.069 * FH, 0, 0, 6.2832);
    g.fillStyle = INK;
    g.fill();
    // rim on the lit side of the head, clipped so it hugs the edge
    g.save();
    g.beginPath();
    g.rect(0.004 * FH, headCY - 0.08 * FH, 0.08 * FH, 0.16 * FH);
    g.clip();
    g.beginPath();
    g.ellipse(0, headCY, 0.054 * FH, 0.069 * FH, 0, 0, 6.2832);
    g.strokeStyle = RIM + '0.5)';
    g.lineWidth = Math.max(1.2, 0.005 * FH);
    g.stroke();
    g.restore();
    g.restore();

    // near arm, in front
    limb(g, sh[1], elb[1], hands[1], 0.047 * FH, 0.040 * FH, 0.034 * FH, INK);
  }

  var FIXED_T = null;
  (function () {
    var m = /[?&]t=(\d+)/.exec(window.location.search || '');
    if (m) FIXED_T = parseInt(m[1], 10);
  })();

  function frame(now) {
    var u = (FIXED_T === null ? now : FIXED_T) / T;
    ctx.drawImage(backdrop, 0, 0, W, H);

    var balls = [];
    var i;
    for (i = 0; i < N_BALLS; i++) balls.push(ballPos(i, u));

    // motion ghosts first, behind the figure, screen-blended so they
    // read as light and never as mud on the black suit
    var ghostA = [0.028, 0.05];
    var back;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (back = 2; back >= 1; back--) {
      ctx.globalAlpha = ghostA[back - 1];
      for (i = 0; i < N_BALLS; i++) {
        if (balls[i].held) continue;
        var gp = ballPos(i, u - back * 0.022);
        ctx.drawImage(ballSprite, gp.x - BALL_R, gp.y - BALL_R, BALL_R * 2, BALL_R * 2);
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    drawFigure(u, balls);

    for (i = 0; i < N_BALLS; i++) {
      ctx.drawImage(ballSprite, balls[i].x - BALL_R, balls[i].y - BALL_R, BALL_R * 2, BALL_R * 2);
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', build);
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
