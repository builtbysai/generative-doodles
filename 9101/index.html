<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9101 · Following</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #101014; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // After Luther Bangert: no juggler, only the balls. Three matte balls
  // follow each other along one slow figure-eight, dwelling at the lobes,
  // sweeping through the middle, weaving over and under at the crossing.
  // Watch only.

  var COLORS = ['#f0e7d3', '#d96f4e', '#c9a227'];   // ivory, clay, old gold
  var PERIOD = 9200;                                // one full eight, ms

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, S = 0;
  var sprites = {};

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }

  function shade(rgb, f) {
    return 'rgb(' + Math.round(rgb[0] * f) + ',' + Math.round(rgb[1] * f) + ',' + Math.round(rgb[2] * f) + ')';
  }

  // One matte ball, lit from upper left, baked into a sprite.
  function makeBall(col) {
    var d = 128, c = document.createElement('canvas');
    c.width = c.height = d;
    var g = c.getContext('2d');
    var rgb = hexRgb(col);
    var rg = g.createRadialGradient(d * 0.38, d * 0.34, d * 0.04, d * 0.5, d * 0.5, d * 0.52);
    rg.addColorStop(0, shade(rgb, 1.12));
    rg.addColorStop(0.55, shade(rgb, 1.0));
    rg.addColorStop(0.88, shade(rgb, 0.78));
    rg.addColorStop(1, shade(rgb, 0.62));
    g.fillStyle = rg;
    g.beginPath();
    g.arc(d / 2, d / 2, d * 0.48, 0, 6.2832);
    g.fill();
    return c;
  }

  function build() {
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H);
    for (var i = 0; i < COLORS.length; i++) sprites[COLORS[i]] = makeBall(COLORS[i]);
  }

  // Point on the eight at parameter a. Depth is sin(a): the same ball
  // passes the centre alternately in front and behind.
  function pointAt(a) {
    var cx = W / 2, cy = H * 0.50;
    return {
      x: cx + W * 0.335 * Math.cos(a),
      y: cy + H * 0.185 * 2 * Math.sin(a) * Math.cos(a) + S * 0.012 * Math.sin(2 * a),
      depth: Math.sin(a)
    };
  }

  function drawBall(i, a, alpha) {
    var p = pointAt(a);
    var r = S * 0.052 * (1 + 0.13 * p.depth);
    ctx.globalAlpha = alpha;
    ctx.drawImage(sprites[COLORS[i]], p.x - r, p.y - r, r * 2, r * 2);
    ctx.globalAlpha = 1;
    return p;
  }

  function frame(now) {
    ctx.fillStyle = '#101014';
    ctx.fillRect(0, 0, W, H);

    var base = now / PERIOD * 6.2832;
    var items = [];
    var i;
    for (i = 0; i < 3; i++) {
      var a = base + i * 2.0944;
      items.push({ i: i, a: a, depth: Math.sin(a) });
    }
    // Far balls first, so the weave reads at the crossing.
    items.sort(function (m, n) { return m.depth - n.depth; });
    for (i = 0; i < items.length; i++) {
      var it = items[i];
      drawBall(it.i, it.a - 0.055, 0.06);   // motion ghosts, camera-soft
      drawBall(it.i, it.a - 0.028, 0.10);
      drawBall(it.i, it.a, 1);
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', build);
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
