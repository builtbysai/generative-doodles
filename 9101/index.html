<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9101 · Cascade</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #060609; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // A true cascade, drawn with nothing but circles. Each ball rides a real
  // parabolic throw, gets scooped through the bottom of its hand's arc, and
  // trails a comet of shrinking circles that weaves the crossings visible.
  // Drag: tempo (sideways) and throw height (up/down). Tap: add a ball.

  var COLORS = ['#ff5347', '#ffb03a', '#2fd8c2', '#7aa8ff', '#e8e4da'];
  var DWELL = 0.30;              // fraction of each cycle spent in the hand
  var A_CATCH = -161 * Math.PI / 180;
  var A_THROW = -324.5 * Math.PI / 180;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, S = 0;
  var sprites = {};

  var nBalls = 3;
  var phaseTime = 0;             // juggler's clock, already tempo-scaled
  var lastNow = 0;
  var tempo = 1, tempoT = 1;     // throws per unit time
  var heightMul = 1, heightT = 1;
  var trails = [];               // per ball: recent {x, y}, oldest first

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }

  function makeSprite(col) {
    var c = document.createElement('canvas');
    c.width = c.height = 64;
    var g = c.getContext('2d');
    var rgb = hexRgb(col);
    var rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.55)');
    rg.addColorStop(0.4, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.18)');
    rg.addColorStop(1, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, 64, 64);
    return c;
  }

  function build() {
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H);
    for (var i = 0; i < COLORS.length; i++) sprites[COLORS[i]] = makeSprite(COLORS[i]);
    resetTrails();
  }

  function resetTrails() {
    trails = [];
    for (var i = 0; i < nBalls; i++) trails.push([]);
  }

  // Hand geometry. hand 0 = left (outward sign -1), hand 1 = right (+1).
  // Local +x is inward; the hand scoops from catch (outer, high) through the
  // bottom of its ellipse to throw (inner, low).
  function handCenter(hand) {
    var spread = S * 0.175;
    return { x: W / 2 + (hand === 0 ? -spread : spread), y: H * 0.78 };
  }

  function handPoint(hand, a) {
    var o = hand === 0 ? -1 : 1;
    var c = handCenter(hand);
    return {
      x: c.x - o * S * 0.055 * Math.cos(a),
      y: c.y + S * 0.021 * Math.sin(a)
    };
  }

  function ballPos(i, u) {
    var k = Math.floor(u);
    var p = u - k;
    var odd = nBalls % 2 === 1;
    var hand = odd ? (k % 2) : (i % 2);
    var target = odd ? 1 - hand : hand;
    if (p < DWELL) {
      var a = A_CATCH + (A_THROW - A_CATCH) * (p / DWELL);
      return handPoint(hand, a);
    }
    var q = (p - DWELL) / (1 - DWELL);
    var s = handPoint(hand, A_THROW);
    var e = handPoint(target, A_CATCH);
    var apex = S * 0.375 * heightMul;
    return {
      x: s.x + (e.x - s.x) * q,
      y: s.y + (e.y - s.y) * q - 4 * apex * q * (1 - q)
    };
  }

  function frame(now) {
    if (!lastNow) lastNow = now;
    var dt = Math.min(now - lastNow, 64);
    lastNow = now;
    tempo += (tempoT - tempo) * 0.06;
    heightMul += (heightT - heightMul) * 0.06;
    phaseTime += dt * tempo;

    var T = 2600 * (1 + (nBalls - 3) * 0.10);
    var r = Math.max(9, Math.min(30, S * 0.030)) * (nBalls >= 5 ? 0.85 : nBalls === 4 ? 0.93 : 1);

    ctx.fillStyle = '#060609';
    ctx.fillRect(0, 0, W, H);

    var pos = [], i, j;
    for (i = 0; i < nBalls; i++) {
      var u = phaseTime / T + i / nBalls;
      var pt = ballPos(i, u);
      pos.push(pt);
      var tr = trails[i];
      tr.push(pt);
      if (tr.length > 44) tr.shift();
    }

    // Trails: a tapering ribbon stroked along the recent path, dotted with
    // shrinking circles. Together they weave the crossings of the cascade.
    ctx.lineCap = 'round';
    for (i = 0; i < nBalls; i++) {
      var tr2 = trails[i];
      ctx.strokeStyle = COLORS[i];
      for (j = 1; j < tr2.length; j++) {
        var f = j / (tr2.length - 1);
        ctx.globalAlpha = 0.30 * f;
        ctx.lineWidth = Math.max(0.8, r * 1.15 * f);
        ctx.beginPath();
        ctx.moveTo(tr2[j - 1].x, tr2[j - 1].y);
        ctx.lineTo(tr2[j].x, tr2[j].y);
        ctx.stroke();
      }
      ctx.fillStyle = COLORS[i];
      for (j = 0; j < tr2.length; j += 2) {
        var f2 = tr2.length <= 1 ? 1 : j / (tr2.length - 1);
        ctx.globalAlpha = 0.45 * f2;
        ctx.beginPath();
        ctx.arc(tr2[j].x, tr2[j].y, Math.max(0.6, r * 0.5 * f2), 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // Balls, lowest on screen drawn last so crossings read near the hands.
    var order = pos.map(function (pt, idx) { return idx; })
      .sort(function (a, b) { return pos[a].y - pos[b].y; });
    for (j = 0; j < order.length; j++) {
      i = order[j];
      var b = pos[i];
      ctx.drawImage(sprites[COLORS[i]], b.x - r * 2.6, b.y - r * 2.6, r * 5.2, r * 5.2);
      ctx.fillStyle = COLORS[i];
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(b.x - r * 0.32, b.y - r * 0.36, r * 0.20, 0, 6.2832);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  // Interaction: drag shapes the juggling, tap adds a ball (3 -> 4 -> 5).
  var drag = null;
  canvas.addEventListener('pointerdown', function (e) {
    drag = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    drag.x = e.clientX; drag.y = e.clientY;
    tempoT = Math.max(0.55, Math.min(1.65, tempoT + dx * 0.0028));
    heightT = Math.max(0.55, Math.min(1.75, heightT - dy * 0.004));
  });
  canvas.addEventListener('pointerup', function (e) {
    if (drag && drag.moved < 10 && performance.now() - drag.t < 350) {
      nBalls = nBalls >= 5 ? 3 : nBalls + 1;
      resetTrails();
    }
    drag = null;
  });
  canvas.addEventListener('pointercancel', function () { drag = null; });

  window.addEventListener('resize', build);
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
