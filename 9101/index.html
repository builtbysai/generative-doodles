<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9101 · The Juggler</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0806; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // After Luther Bangert: a juggler in black on a warm stage, five white
  // balls in a true cascade. The physics is Shannon's: each ball flies
  // 70% of its cycle and rides in a hand for the rest (hand dwell ratio
  // 0.75, the expert value). Hands scoop the way real hands do — catch
  // wide, carry low across the body, throw from inside — and two-bone
  // IK arms make the hands, not the drawing, do the work. Watch only.
  //
  // A performance, not a metronome: over one 44-second master loop the
  // tempo breathes, the pattern narrows into a tight columns passage,
  // drops low and hot for a cycle, and twice a ball is flashed high
  // enough to lift the juggler's chin. Every throw carries seeded
  // jitter; dust hangs in the light; the rim light breathes.

  var T = 2200;              // one ball's full cycle, ms
  var DWELL = 0.30;          // fraction of the ball cycle spent in a hand
  var HAND_CYCLE = 0.40;     // in ball-cycle units (Shannon: 2 hands, 5 balls)
  var N_BALLS = 5;
  var MC = 20;               // master loop, ball cycles (44 s): every
                             // variation and noise below repeats with it
  var WOB = 0.09;            // tempo breath: phase wobble, in cycles

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, FH = 0, CX = 0;
  var TOP = 0, FLOOR = 0, SHOULDER_Y = 0, HIP_Y = 0, HAND_Y = 0;
  var CATCH_X = 0, THROW_X = 0, DIP = 0, APEX_H = 0, BALL_R = 0;
  var L1 = 0, L2 = 0;
  var backdrop = null, ballSprite = null;

  function frac(x) { return x - Math.floor(x); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function easeInOut(t) { return t * t * (3 - 2 * t); }

  // ---- seeded randomness that loops with the master cycle -------------------
  // Every noise argument below advances by a whole multiple of MC when u
  // advances by MC, so the 44-second loop is seamless.
  function hash2(a, b) {
    var x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function makeTable(n, seed) {
    var t = [], s = seed;
    for (var i = 0; i < n; i++) {
      s = (s * 16807) % 2147483647;
      t.push(s / 2147483647);
    }
    return t;
  }
  var NTAB = makeTable(256, 1234567);
  var NTABS = makeTable(48, 987654);       // slow features, ~0.9 s each
  function noiseFrom(tab, x) {
    var p = frac(x / MC) * tab.length;
    var i0 = Math.floor(p), f = p - i0;
    var sm = f * f * (3 - 2 * f);
    return lerp(tab[i0 % tab.length], tab[(i0 + 1) % tab.length], sm);
  }
  function noise1(x) { return noiseFrom(NTAB, x); }
  function noiseS(x) { return noiseFrom(NTABS, x); }

  // smooth bump centred at master-cycle c, half-width hw
  function pulse(u, c, hw) {
    var d = Math.abs(frac(u / MC) * MC - c);
    d = Math.min(d, MC - d);
    var t = clamp((hw - d) / (hw * 0.55), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function narrowPulse(u) { return pulse(u, 12.5, 1.7); }  // tight columns passage
  function hotPulse(u) { return pulse(u, 16.5, 1.3); }     // low, fast passage

  // pattern width breathes: narrow in the columns passage, a touch
  // wider in the hot passage, slow noise the rest of the time
  function widthMod(u) {
    return (1 - 0.32 * narrowPulse(u)) * (1 + 0.06 * hotPulse(u)) *
           (0.96 + 0.08 * noiseS(u + 13.7));
  }

  // per-throw apex: seeded jitter, the passages, and two flash tosses
  // per master loop (one ball sent high, the head follows it)
  function apexFor(i, k) {
    var k20 = ((k % MC) + MC) % MC;
    var us = i * 0.2 + k + DWELL;
    var a = 1 + (hash2(i * 7 + 2, k20) - 0.5) * 0.16;
    a *= (1 + 0.08 * narrowPulse(us)) * (1 - 0.18 * hotPulse(us));
    if (i === 2 && k20 === 5) a *= 1.17;
    if (i === 3 && k20 === 18) a *= 1.14;
    // floor: below this a crossing ball would cut across the face
    return Math.max(a, 0.78);
  }

  // dust in the light: unit-space seeds, scaled at draw time
  var MOTES = (function () {
    var arr = [];
    for (var j = 0; j < 22; j++) {
      arr.push({
        hx: hash2(j * 3 + 1, 7), hy: hash2(j * 5 + 2, 13),
        s: hash2(j, 29) > 0.5 ? 2 : 1,
        sz: 1.0 + 1.3 * hash2(j * 7 + 3, 31),
        ph: hash2(j * 11 + 5, 37) * 40
      });
    }
    return arr;
  })();

  // ---- stage geometry, rebuilt on resize -----------------------------------
  function build() {
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    FH = 0.58 * H;                    // figure height: head 30% -> feet 88%
    CX = W / 2;
    TOP = 0.30 * H;
    FLOOR = 0.88 * H;
    SHOULDER_Y = TOP + 0.19 * FH;
    HIP_Y = TOP + 0.52 * FH;
    HAND_Y = TOP + 0.46 * FH;
    CATCH_X = 0.36 * FH;              // catches land wide
    THROW_X = 0.19 * FH;              // throws leave from inside the catch width
    DIP = 0.05 * FH;
    APEX_H = HAND_Y - 0.12 * H;       // cascade apex at ~12% of the screen
    BALL_R = 0.024 * FH;
    L1 = 0.20 * FH;                   // upper arm
    L2 = 0.215 * FH;                  // forearm + hand

    bakeBackdrop();
    bakeBall();
  }

  function bakeBackdrop() {
    backdrop = document.createElement('canvas');
    backdrop.width = Math.max(2, Math.floor(W));
    backdrop.height = Math.max(2, Math.floor(H));
    var g = backdrop.getContext('2d');

    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#150c07');
    grad.addColorStop(0.55, '#0d0805');
    grad.addColorStop(1, '#050403');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    // the red-lit panel from his stage photographs: a broad warm glow
    var panel = g.createRadialGradient(CX, 0.40 * H, 0, CX, 0.40 * H, 0.72 * Math.max(W, H));
    panel.addColorStop(0, 'rgba(172,58,34,0.50)');
    panel.addColorStop(0.45, 'rgba(128,40,24,0.26)');
    panel.addColorStop(1, 'rgba(90,26,16,0)');
    g.fillStyle = panel;
    g.fillRect(0, 0, W, H);

    // amber core behind the figure
    var core = g.createRadialGradient(CX, 0.38 * H, 0, CX, 0.38 * H, 0.36 * FH * 1.6);
    core.addColorStop(0, 'rgba(255,122,58,0.15)');
    core.addColorStop(1, 'rgba(255,122,58,0)');
    g.fillStyle = core;
    g.fillRect(0, 0, W, H);

    // haze: a soft cone of stage light falling from above the panel
    g.save();
    g.beginPath();
    g.moveTo(CX - 0.10 * W, -0.02 * H);
    g.lineTo(CX + 0.10 * W, -0.02 * H);
    g.lineTo(CX + 0.36 * W, 0.66 * H);
    g.lineTo(CX - 0.36 * W, 0.66 * H);
    g.closePath();
    g.clip();
    var haze = g.createLinearGradient(0, 0, 0, 0.66 * H);
    haze.addColorStop(0, 'rgba(255,150,84,0.052)');
    haze.addColorStop(1, 'rgba(255,150,84,0)');
    g.fillStyle = haze;
    g.fillRect(0, 0, W, 0.66 * H);
    g.restore();

    // floor and its pool of light (edge feathered, no hard horizon)
    var fg = g.createLinearGradient(0, FLOOR - 0.045 * H, 0, H);
    fg.addColorStop(0, 'rgba(74,46,26,0)');
    fg.addColorStop(0.35, 'rgba(74,46,26,0.42)');
    fg.addColorStop(1, 'rgba(12,7,4,0.92)');
    g.fillStyle = fg;
    g.fillRect(0, FLOOR - 0.045 * H, W, H - FLOOR + 0.045 * H);

    g.save();
    g.translate(CX, FLOOR + 0.012 * H);
    g.scale(1, 0.16);
    var pool = g.createRadialGradient(0, 0, 0, 0, 0, 0.46 * W);
    pool.addColorStop(0, 'rgba(255,170,92,0.20)');
    pool.addColorStop(1, 'rgba(255,170,92,0)');
    g.fillStyle = pool;
    g.beginPath();
    g.arc(0, 0, 0.46 * W, 0, 6.2832);
    g.fill();
    g.restore();

    // vignette
    var vg = g.createRadialGradient(CX, 0.46 * H, 0.34 * Math.max(W, H), CX, 0.46 * H, 0.98 * Math.max(W, H));
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.52)');
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);
  }

  function bakeBall() {
    var d = 128;
    ballSprite = document.createElement('canvas');
    ballSprite.width = ballSprite.height = d;
    var g = ballSprite.getContext('2d');
    var rg = g.createRadialGradient(d * 0.38, d * 0.32, d * 0.05, d * 0.5, d * 0.52, d * 0.54);
    rg.addColorStop(0, '#fffdf6');
    rg.addColorStop(0.55, '#f4ecd9');
    rg.addColorStop(0.86, '#d8cba9');
    rg.addColorStop(1, '#b3a37f');
    g.fillStyle = rg;
    g.beginPath();
    g.arc(d / 2, d / 2, d * 0.49, 0, 6.2832);
    g.fill();
  }

  // ---- body rhythm: the hand-cycle pulse, with slower noise riding on it ----
  function swaySh(u) {
    return 0.010 * FH * Math.sin(6.2832 * u / HAND_CYCLE) +
           0.014 * FH * (noiseS(u + 3.3) - 0.5);
  }
  function swayHip(u) {
    return 0.008 * FH * Math.sin(6.2832 * u / HAND_CYCLE) +
           0.010 * FH * (noiseS(u + 8.8) - 0.5);
  }
  function bob(u) {
    return 0.006 * FH * Math.sin(12.5664 * u / HAND_CYCLE + 1.0) +
           0.006 * FH * (noiseS(3 * u + 9.1) - 0.5);
  }

  // ---- hands: the scoop ------------------------------------------------------
  // q = 0 at the catch (wide), q = 0.75 at the throw (inside): the hand
  // carries for 75% of its cycle, then swings back out empty.
  function handPos(h, u) {
    var s = h === 0 ? -1 : 1;
    var q = frac((u - h * 0.2) / HAND_CYCLE);
    // width, throw point and scoop depth all breathe — because heldPos
    // samples this same function, a riding ball never leaves its hand
    var wm = widthMod(u);
    var cX = CATCH_X * wm;
    // the throw point never crosses inside the shoulder line: past it
    // the IK elbow flips from tucked under to flung out sideways
    var tX = Math.max(THROW_X * wm * (0.92 + 0.16 * noiseS(u + 77.7)), 0.145 * FH);
    var dip = DIP * (0.85 + 0.30 * noiseS(2 * u + 40.2));
    var x, y;
    if (q < 0.75) {
      var w = easeInOut(q / 0.75);
      x = s * lerp(cX, tX, w);
      y = HAND_Y + dip * Math.sin(Math.PI * Math.pow(q / 0.75, 0.9));
    } else {
      var v = (q - 0.75) / 0.25;
      var e = 1 - (1 - v) * (1 - v);
      x = s * lerp(tX, cX, e);
      y = HAND_Y + dip * 0.35 * Math.sin(Math.PI * v);
    }
    return { x: CX + x + swaySh(u), y: y + bob(u) };
  }

  // where a ball's centre rides relative to its hand
  function heldPos(h, u) {
    var p = handPos(h, u);
    return { x: p.x, y: p.y - BALL_R * 0.55 };
  }

  // ---- balls -----------------------------------------------------------------
  function ballPos(i, u) {
    var uu = u - i * 0.2;
    var k = Math.floor(uu);
    var p = uu - k;
    var hand = (((i + k) % 2) + 2) % 2;
    if (p < DWELL) {
      var hp = heldPos(hand, u);
      return { x: hp.x, y: hp.y, held: true };
    }
    var w = (p - DWELL) / (1 - DWELL);
    var A = heldPos(hand, (i * 0.2) + k + DWELL);       // release point
    var B = heldPos(1 - hand, (i * 0.2) + k + 1);       // catch point, other hand
    return {
      x: lerp(A.x, B.x, w),
      y: lerp(A.y, B.y, w) - APEX_H * apexFor(i, k) * 4 * w * (1 - w),
      held: false
    };
  }

  // ---- arms: two-bone IK, elbow down and a touch out -------------------------
  function elbow(S, P, s) {
    var dx = P.x - S.x, dy = P.y - S.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var maxD = (L1 + L2) * 0.999;
    if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
    if (d < 1) { dx = 0; dy = 1; d = 1; }
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var hgt = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var mx = S.x + dx * a / d, my = S.y + dy * a / d;
    var px = -dy / d, py = dx / d;
    if (py < 0) { px = -px; py = -py; }
    return { x: mx + px * hgt + s * 0.012 * FH, y: my + py * hgt };
  }

  function limb(g, A, B, C, wA, wB, wC, col) {
    g.strokeStyle = col;
    g.lineCap = 'round';
    g.lineWidth = wA;
    g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke();
    g.lineWidth = wB;
    g.beginPath(); g.moveTo(B.x, B.y); g.lineTo(C.x, C.y); g.stroke();
    g.fillStyle = col;
    g.beginPath(); g.arc(B.x, B.y, wB * 0.5, 0, 6.2832); g.fill();
    g.beginPath(); g.arc(C.x, C.y, wC * 0.5, 0, 6.2832); g.fill();
  }

  // smooth closed path through points (quadratic midpoints)
  function smoothClosed(g, pts) {
    var n = pts.length;
    var mx = (pts[0].x + pts[n - 1].x) / 2, my = (pts[0].y + pts[n - 1].y) / 2;
    g.beginPath();
    g.moveTo(mx, my);
    for (var i = 0; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n];
      g.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
    }
    g.closePath();
  }

  var INK = '#161110';
  var INK_FAR = '#100d0b';
  var RIM = 'rgba(255,176,110,';

  function drawFigure(u, balls) {
    var g = ctx;
    var swS = swaySh(u), swH = swayHip(u), bb = bob(u);
    var breathe = 0.85 + 0.30 * noiseS(u + 21.4);   // stage light is alive
    var shY = SHOULDER_Y + bb * 0.7;
    var hipY = HIP_Y + bb;

    // arm roots sit a shade inside the torso line so the joints don't knob
    var sh = [
      { x: CX - 0.115 * FH + swS, y: shY + 0.01 * FH },
      { x: CX + 0.115 * FH + swS, y: shY + 0.01 * FH }
    ];
    var hands = [handPos(0, u), handPos(1, u)];
    var elb = [elbow(sh[0], hands[0], -1), elbow(sh[1], hands[1], 1)];

    // soft shadow on the floor
    g.save();
    g.translate(CX + swH * 0.5, FLOOR + 0.006 * H);
    g.scale(1, 0.14);
    var shad = g.createRadialGradient(0, 0, 0, 0, 0, 0.30 * FH);
    shad.addColorStop(0, 'rgba(0,0,0,0.42)');
    shad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = shad;
    g.beginPath(); g.arc(0, 0, 0.30 * FH, 0, 6.2832); g.fill();
    g.restore();

    // legs: relaxed stance, knees soft
    for (var li = 0; li < 2; li++) {
      var s = li === 0 ? -1 : 1;
      var hip = { x: CX + s * 0.072 * FH + swH, y: hipY + 0.02 * FH };
      var ank = { x: CX + s * 0.148 * FH, y: FLOOR - 0.018 * FH };
      var knee = {
        x: (hip.x + ank.x) / 2 + s * 0.014 * FH,
        y: (hip.y + ank.y) / 2 + 0.012 * FH
      };
      limb(g, hip, knee, ank, 0.082 * FH, 0.058 * FH, 0.04 * FH, INK);
      // foot, with a breath of warm highlight on the shoe's top edge
      g.fillStyle = INK;
      g.save();
      g.translate(ank.x + s * 0.016 * FH, FLOOR - 0.008 * FH);
      g.rotate(s * 0.10);
      g.beginPath(); g.ellipse(0, 0, 0.046 * FH, 0.015 * FH, 0, 0, 6.2832); g.fill();
      g.strokeStyle = 'rgba(255,176,110,0.20)';
      g.lineWidth = Math.max(1, 0.0035 * FH);
      g.beginPath();
      g.ellipse(0, -0.002 * FH, 0.038 * FH, 0.012 * FH, 0, Math.PI * 1.12, Math.PI * 1.88);
      g.stroke();
      g.restore();
    }

    // far arm, behind the torso
    limb(g, sh[0], elb[0], hands[0], 0.047 * FH, 0.040 * FH, 0.034 * FH, INK_FAR);

    // neck: a trapezoid that widens into the chest, drawn before the
    // torso so the join disappears
    g.fillStyle = INK;
    g.beginPath();
    g.moveTo(CX - 0.024 * FH + swS, shY - 0.075 * FH);
    g.lineTo(CX + 0.024 * FH + swS, shY - 0.075 * FH);
    g.lineTo(CX + 0.046 * FH + swS, shY + 0.03 * FH);
    g.lineTo(CX - 0.046 * FH + swS, shY + 0.03 * FH);
    g.closePath();
    g.fill();

    // torso: shoulders broad, waist narrow, hips between
    var torso = [
      { x: CX - 0.040 * FH + swS, y: shY - 0.030 * FH },
      { x: CX - 0.135 * FH + swS, y: shY + 0.014 * FH },
      { x: CX - 0.079 * FH + swH, y: HIP_Y - 0.07 * FH },
      { x: CX - 0.088 * FH + swH, y: hipY + 0.045 * FH },
      { x: CX + 0.088 * FH + swH, y: hipY + 0.045 * FH },
      { x: CX + 0.079 * FH + swH, y: HIP_Y - 0.07 * FH },
      { x: CX + 0.135 * FH + swS, y: shY + 0.014 * FH },
      { x: CX + 0.040 * FH + swS, y: shY - 0.030 * FH }
    ];
    smoothClosed(g, torso);
    g.fillStyle = INK;
    g.fill();
    // rim light that truly hugs the lit edge: stroke the torso outline,
    // clipped to a band along its right side only
    g.save();
    g.beginPath();
    g.rect(CX + 0.055 * FH, shY + 0.03 * FH, W - CX, (hipY + 0.005 * FH) - (shY + 0.03 * FH));
    g.clip();
    smoothClosed(g, torso);
    g.strokeStyle = RIM + (0.28 * breathe).toFixed(3) + ')';
    g.lineWidth = Math.max(1.4, 0.007 * FH);
    g.stroke();
    g.restore();
    // counter-light: a faint cool edge from stage left, so the black
    // suit models against the warm panel instead of merging with it
    g.save();
    g.beginPath();
    g.rect(CX - 0.145 * FH, shY + 0.03 * FH, 0.093 * FH, (hipY + 0.005 * FH) - (shY + 0.03 * FH));
    g.clip();
    smoothClosed(g, torso);
    g.strokeStyle = 'rgba(148,172,232,0.13)';
    g.lineWidth = Math.max(1.2, 0.006 * FH);
    g.stroke();
    g.restore();
    // the collar: a shallow crescent where the shirt meets the neck
    g.fillStyle = '#1e1712';
    g.beginPath();
    g.moveTo(CX - 0.047 * FH + swS, shY + 0.004 * FH);
    g.quadraticCurveTo(CX + swS, shY + 0.026 * FH, CX + 0.047 * FH + swS, shY + 0.004 * FH);
    g.lineTo(CX + 0.040 * FH + swS, shY - 0.012 * FH);
    g.quadraticCurveTo(CX + swS, shY + 0.008 * FH, CX - 0.040 * FH + swS, shY - 0.012 * FH);
    g.closePath();
    g.fill();

    // head, tilting a breath toward the highest ball
    var topBall = null;
    for (var bi = 0; bi < balls.length; bi++) {
      if (!balls[bi].held && (!topBall || balls[bi].y < topBall.y)) topBall = balls[bi];
    }
    var tilt = topBall ? clamp((topBall.x - CX) / (0.5 * W), -1, 1) * 0.055 : 0;
    tilt += 0.012 * (noiseS(2 * u + 5.5) - 0.5);
    // a flash toss lifts the chin: the head rises a breath to follow it
    var lift = topBall ? clamp((0.12 * H - topBall.y) / (0.075 * H), 0, 1) * 0.010 * FH : 0;
    g.save();
    g.translate(CX + swS, shY - 0.012 * FH - lift);
    g.rotate(tilt);
    var headCY = -0.108 * FH;
    g.beginPath();
    g.ellipse(0, headCY, 0.054 * FH, 0.069 * FH, 0, 0, 6.2832);
    g.fillStyle = INK;
    g.fill();
    // rim on the lit side of the head, clipped so it hugs the edge
    g.save();
    g.beginPath();
    g.rect(0.004 * FH, headCY - 0.08 * FH, 0.08 * FH, 0.16 * FH);
    g.clip();
    g.beginPath();
    g.ellipse(0, headCY, 0.054 * FH, 0.069 * FH, 0, 0, 6.2832);
    g.strokeStyle = RIM + (0.5 * breathe).toFixed(3) + ')';
    g.lineWidth = Math.max(1.2, 0.005 * FH);
    g.stroke();
    g.restore();
    // cool edge on the shadow side of the head
    g.save();
    g.beginPath();
    g.rect(-0.058 * FH, headCY - 0.08 * FH, 0.062 * FH, 0.16 * FH);
    g.clip();
    g.beginPath();
    g.ellipse(0, headCY, 0.054 * FH, 0.069 * FH, 0, 0, 6.2832);
    g.strokeStyle = 'rgba(148,172,232,0.16)';
    g.lineWidth = Math.max(1.1, 0.004 * FH);
    g.stroke();
    g.restore();
    g.restore();

    // near arm, in front
    limb(g, sh[1], elb[1], hands[1], 0.047 * FH, 0.040 * FH, 0.034 * FH, INK);
  }

  var FIXED_T = null;
  (function () {
    var m = /[?&]t=(\d+)/.exec(window.location.search || '');
    if (m) FIXED_T = parseInt(m[1], 10);
  })();

  // a ball drawn with a breath of stretch along its velocity — most at
  // the bottom of the arc where it moves fastest, none at the apex
  function drawBall(i, u, b) {
    var pA = ballPos(i, u - 0.012), pB = ballPos(i, u + 0.012);
    var vx = pB.x - pA.x, vy = pB.y - pA.y;
    var sp = Math.sqrt(vx * vx + vy * vy) / 0.024;      // px per cycle
    var s = clamp(0.030 * sp / FH, 0, 0.13);
    if (s < 0.004) {
      ctx.drawImage(ballSprite, b.x - BALL_R, b.y - BALL_R, BALL_R * 2, BALL_R * 2);
      return;
    }
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(vy, vx));
    ctx.scale(1 + s, 1 - 0.45 * s);
    ctx.drawImage(ballSprite, -BALL_R, -BALL_R, BALL_R * 2, BALL_R * 2);
    ctx.restore();
  }

  function frame(now) {
    // tempo breath: phase eases forward and back over the master loop
    var c = (FIXED_T === null ? now : FIXED_T) / T;
    var u = c + WOB * Math.sin(6.2832 * c / MC);
    ctx.drawImage(backdrop, 0, 0, W, H);

    var balls = [];
    var i;
    for (i = 0; i < N_BALLS; i++) balls.push(ballPos(i, u));

    // dust motes drifting in the light, falling slowly and looping
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (var j = 0; j < MOTES.length; j++) {
      var m = MOTES[j];
      var my = 0.06 * H + frac(m.hy + (u / MC) * m.s) * 0.62 * H;
      var mx = CX + (m.hx - 0.5) * 0.88 * W + (noiseS(u + m.ph) - 0.5) * 0.05 * W;
      var ma = 0.04 + 0.09 * noiseS(3 * u + m.ph * 3);
      ctx.fillStyle = 'rgba(255,190,130,' + ma.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(mx, my, m.sz * Math.max(1, FH / 520), 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();

    // motion ghosts first, behind the figure, screen-blended so they
    // read as light and never as mud on the black suit; each ball's
    // trail breathes with its own seeded weight
    var ghostA = [0.028, 0.05];
    var back;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (back = 2; back >= 1; back--) {
      for (i = 0; i < N_BALLS; i++) {
        if (balls[i].held) continue;
        var gp = ballPos(i, u - back * 0.022);
        var gk = Math.floor(u - back * 0.022 - i * 0.2);
        var gk20 = ((gk % MC) + MC) % MC;
        ctx.globalAlpha = ghostA[back - 1] * (0.7 + 0.6 * hash2(i * 13 + 7, gk20));
        ctx.drawImage(ballSprite, gp.x - BALL_R, gp.y - BALL_R, BALL_R * 2, BALL_R * 2);
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    drawFigure(u, balls);

    // the balls meet the floor's light: a soft shadow beneath each one
    // and a faint reflection in the pool, both growing as it descends
    var FY = FLOOR + 0.014 * H;
    for (i = 0; i < N_BALLS; i++) {
      var prox = clamp((0.80 * H - (FLOOR - balls[i].y)) / (0.52 * H), 0, 1);
      if (prox <= 0.02) continue;
      var sr = BALL_R * (2.0 - 0.8 * prox);
      ctx.fillStyle = 'rgba(0,0,0,' + (0.15 * prox).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(balls[i].x, FY, sr, sr * 0.22, 0, 0, 6.2832);
      ctx.fill();
    }
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, FLOOR + 0.002 * H, W, H - FLOOR);
    ctx.clip();
    ctx.globalCompositeOperation = 'screen';
    for (i = 0; i < N_BALLS; i++) {
      var prox2 = clamp((0.80 * H - (FLOOR - balls[i].y)) / (0.52 * H), 0, 1);
      if (prox2 <= 0.02) continue;
      ctx.globalAlpha = 0.10 * prox2;
      var ry = FY + (FY - balls[i].y) * 0.38;
      ctx.drawImage(ballSprite, balls[i].x - BALL_R, ry - BALL_R * 0.38, BALL_R * 2, BALL_R * 0.76);
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    for (i = 0; i < N_BALLS; i++) drawBall(i, u, balls[i]);

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', build);
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
