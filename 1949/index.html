<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1949 Three Hours Cut to Forty-Two</title>
<style>
  html, body { margin: 0; padding: 0; background: #171009; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Three Hours Cut to Forty-Two, LR6 / PP1196, study #254 lucy-railton.
  // A long tape strip scrolls slowly across the middle: a generator
  // improvises continuously, cello-like bowed tones wandering through
  // a dark field. An invisible editor is at work: the strip gets cut,
  // and only the kept passages stay lit in warm gold while the rest
  // goes cold grey and dark. The cuts are the composition; the kept
  // passages are left untouched, exactly as played. The field above
  // and below the strip shows the current kept passage blooming, and
  // a counter in the corner shows the ratio: hours of material in,
  // minutes of piece out. TAP forces a cut decision: the editor
  // evaluates the current moment and either keeps it (it glows) or
  // discards it (it goes dark). The stream never restarts and never
  // reloads: tap is the editorial cut, not a reseed.
  var FIELD_TOP = '#1c130a'; // dark field, top
  var FIELD_BOT = '#120c06'; // dark field, bottom
  var TAPE = '#2a1d12';      // tape dark brown
  var TAPE_DK = '#1f150c';   // tape shadow brown
  var TAPE_EDGE = '#4a3520'; // tape edge
  var GOLD = '#d9a441';      // kept passages, warm gold
  var GOLD_LT = '#f2c14e';   // bright gold core
  var GOLD_DK = '#a97b22';   // deep gold
  var GREY = '#5a6066';      // cut sections, cold grey
  var GREY_DK = '#33383d';   // cut section fill
  var GREY_X = '#14161a';    // evaluated discard, near black
  var BONE = '#f5f2ea';      // playhead, thin white line
  var PLATE = '#efe6d0';     // plate ink, warm off white
  var PILL = '#d9a441';      // hint pill, warm gold
  var PILL_INK = '#171009';  // hint ink, dark brown

  // Fixed-phase first frame: FIRST_T = 48 s. At t = 48 the tape is
  // mid-scroll, the current passage (segment 8) is kept and blooming
  // in gold, kept segments 0 and 8 are lit on the strip, the counter
  // reads IN 0:00:48, OUT 0:00:06, KEPT 22 percent. The playhead sits
  // at the centre of the strip.
  var FIRST_T = 48;
  var SEG = 6;            // seconds of material per tape segment
  var KEEP_P = 0.2333;    // hidden quality rule: keep ~23 percent, 42 of 180 minutes
  var FIELD_SEED = 1949;

  // QA probe hooks: ?t=<seconds> renders at an arbitrary time,
  // ?tap=<n> simulates n tap cut decisions at load, ?seed= varies
  // the texture seed. Read at load only.
  var seedParam = 0, tParam = null, tapParam = 0;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = qs.match(/[?&]seed=(-?\d+)/); if (m) { seedParam = parseInt(m[1], 10) || 0; }
    var mt = qs.match(/[?&]t=([0-9.]+)/); if (mt) { tParam = parseFloat(mt[1]); }
    var mk = qs.match(/[?&]tap=(\d+)/); if (mk) { tapParam = parseInt(mk[1], 10) || 0; }
  } catch (e) {}
  if (seedParam) { FIELD_SEED = 1949 + seedParam * 101; }
  var startT = (tParam !== null && !isNaN(tParam)) ? tParam : FIRST_T;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the piece
  // number and segment index, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Hidden quality of segment k: first draw of its seeded PRNG.
  function segHash(k) {
    var rng = mulberry32(FIELD_SEED * 1000 + k * 7919);
    return rng();
  }

  // Editorial decisions forced by taps: segment index -> { kept, t }.
  // A decision overrides the hidden rule for that segment forever;
  // the stream never restarts, so a cut segment stays cut.
  var decisions = {};
  var decisionCount = 0;
  var lastDecision = null;

  // Segment status: the hidden rule, unless a tap overruled it.
  function segKept(k) {
    if (decisions[k] !== undefined) { return decisions[k].kept; }
    return segHash(k) < KEEP_P;
  }

  // The editor evaluates the segment under the playhead at time t:
  // keep it when its hidden quality passes the rule, discard it when
  // it does not. The decision is recorded, so the tape remembers.
  function tapAt(t) {
    var k = Math.floor(t / SEG);
    var kept = segHash(k) < KEEP_P;
    decisions[k] = { kept: kept, t: t };
    lastDecision = { k: k, kept: kept, t: t };
    decisionCount++;
    return lastDecision;
  }

  // Simulated taps at load: one per second from the start time, so
  // each evaluates a later moment as the tape scrolls.
  var i;
  for (i = 0; i < tapParam; i++) { tapAt(startT + i * 1.0); }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = startT;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h + ':' + pad2(m) + ':' + pad2(s);
  }

  // The improvisation: a bowed tone wandering through the field.
  // Closed-form sum of slow sines, a pure function of material time.
  function pitch(mt) {
    return 0.5 * Math.sin(2 * Math.PI * 0.045 * mt + 1.3)
         + 0.25 * Math.sin(2 * Math.PI * 0.07 * mt + 0.4)
         + 0.2 * Math.sin(2 * Math.PI * 0.023 * mt + 2.1);
  }

  // Ratio counter: material in is the stream clock; material out is
  // the kept segments so far, plus the kept part of the current one.
  function ratioAt(t) {
    var kNow = Math.floor(t / SEG);
    var keptCount = 0, k;
    for (k = 0; k <= kNow; k++) { if (segKept(k)) { keptCount++; } }
    var total = kNow + 1;
    var outSec = 0;
    for (k = 0; k < kNow; k++) { if (segKept(k)) { outSec += SEG; } }
    if (segKept(kNow)) { outSec += t - kNow * SEG; }
    return {
      inSec: t,
      outSec: outSec,
      keptPct: total > 0 ? Math.round(100 * keptCount / total) : 0,
      keptCount: keptCount,
      total: total
    };
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The field: dark brown gradient, the wandering tone trace above
  // and below the strip, and the bloom of the current passage.
  function drawField(t, curKept, flare) {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, FIELD_TOP);
    grad.addColorStop(1, FIELD_BOT);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    var pps = W / 90;
    var centerX = W / 2;
    var stripTop = H * 0.435, stripBot = H * 0.605;
    var traceCol = curKept ? GOLD : GREY;
    var traceA = curKept ? 0.75 : 0.4;
    var amp = H * 0.09;

    // Tone trace above the strip, and its mirror below, phase shifted.
    var x;
    ctx.strokeStyle = hexA(traceCol, a4(traceA));
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (x = 0; x <= W; x += 3) {
      var mt = t + (x - centerX) / pps;
      var y = stripTop - 34 - pitch(mt) * amp;
      if (x === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
    ctx.strokeStyle = hexA(traceCol, a4(traceA * 0.6));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (x = 0; x <= W; x += 3) {
      var mt2 = t + (x - centerX) / pps;
      var y2 = stripBot + 34 + pitch(mt2 + 7) * amp;
      if (x === 0) { ctx.moveTo(x, y2); } else { ctx.lineTo(x, y2); }
    }
    ctx.stroke();

    // Bloom: soft radial gold glow above and below the strip near the
    // playhead while the current passage is kept; faint cold grey
    // while it is cut. A kept tap decision flares the bloom; a
    // discard decision collapses it for a couple of seconds.
    var kNow = Math.floor(t / SEG);
    var rng = mulberry32(FIELD_SEED * 777 + kNow * 131);
    var bloomA = curKept ? 0.22 : 0.08;
    if (lastDecision && lastDecision.k === kNow) {
      var dt = t - lastDecision.t;
      if (dt >= 0 && dt < 2.5) {
        var fenv = 1 - dt / 2.5;
        bloomA = lastDecision.kept ? bloomA * (1 + 1.6 * fenv) : bloomA * (1 - fenv);
      }
    }
    var bloomCol = curKept ? GOLD_LT : GREY;
    var br = parseInt(bloomCol.slice(1, 3), 16), bg = parseInt(bloomCol.slice(3, 5), 16), bb = parseInt(bloomCol.slice(5, 7), 16);
    var j;
    for (j = 0; j < 12; j++) {
      var bx = centerX + (rng() - 0.5) * W * 0.62;
      var by = stripTop - 24 - rng() * H * 0.30;
      var brad = 16 + rng() * 52;
      var ba = a4(bloomA * (0.4 + rng() * 0.6));
      var grad = ctx.createRadialGradient(bx, by, 0, bx, by, brad);
      grad.addColorStop(0, 'rgba(' + br + ',' + bg + ',' + bb + ',' + ba + ')');
      grad.addColorStop(1, 'rgba(' + br + ',' + bg + ',' + bb + ',0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.moveTo(bx + brad, by); ctx.arc(bx, by, brad, 0, Math.PI * 2); ctx.fill();
    }
    for (j = 0; j < 12; j++) {
      var cx = centerX + (rng() - 0.5) * W * 0.62;
      var cy = stripBot + 24 + rng() * H * 0.30;
      var crad = 16 + rng() * 52;
      var ca = a4(bloomA * (0.4 + rng() * 0.6));
      var grad2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, crad);
      grad2.addColorStop(0, 'rgba(' + br + ',' + bg + ',' + bb + ',' + ca + ')');
      grad2.addColorStop(1, 'rgba(' + br + ',' + bg + ',' + bb + ',0)');
      ctx.fillStyle = grad2;
      ctx.beginPath(); ctx.moveTo(cx + crad, cy); ctx.arc(cx, cy, crad, 0, Math.PI * 2); ctx.fill();
    }
  }

  // The tape strip: scrolling segments, kept passages in warm gold,
  // cut sections in cold grey. Segments before the stream starts are
  // unrecorded leader, dark and empty. A tap decision marks its
  // segment: kept decisions glow with a bright edge, discards go
  // near black with a thin grey slash.
  function drawTape(t) {
    var pps = W / 90;
    var centerX = W / 2;
    var stripTop = H * 0.435, stripBot = H * 0.605;
    var stripH = stripBot - stripTop;

    ctx.fillStyle = TAPE_DK;
    ctx.fillRect(0, stripTop - 4, W, stripH + 8);

    var kMin = Math.floor((t - centerX / pps) / SEG) - 1;
    var kMax = Math.floor((t + (W - centerX) / pps) / SEG) + 1;
    var k;
    for (k = kMin; k <= kMax; k++) {
      var x0 = centerX + (k * SEG - t) * pps;
      var x1 = centerX + ((k + 1) * SEG - t) * pps;
      var w = x1 - x0;
      if (x1 < 0 || x0 > W) { continue; }
      if (k < 0) {
        ctx.fillStyle = TAPE;
        ctx.fillRect(x0, stripTop, w, stripH);
      } else if (segKept(k)) {
        var g = ctx.createLinearGradient(0, stripTop, 0, stripBot);
        g.addColorStop(0, GOLD_LT);
        g.addColorStop(0.5, GOLD);
        g.addColorStop(1, GOLD_DK);
        ctx.fillStyle = g;
        ctx.fillRect(x0, stripTop, w, stripH);
        ctx.fillStyle = hexA(GOLD_LT, a4(0.55));
        ctx.fillRect(x0, stripTop + stripH * 0.32, w, stripH * 0.36);
      } else {
        ctx.fillStyle = GREY_DK;
        ctx.fillRect(x0, stripTop, w, stripH);
        ctx.fillStyle = hexA(GREY, a4(0.5));
        ctx.fillRect(x0, stripTop, w, 2);
      }
      if (decisions[k] !== undefined) {
        if (decisions[k].kept) {
          ctx.strokeStyle = hexA(BONE, a4(0.9));
          ctx.lineWidth = 2;
          ctx.strokeRect(x0 + 1.5, stripTop + 1.5, w - 3, stripH - 3);
        } else {
          ctx.fillStyle = GREY_X;
          ctx.fillRect(x0, stripTop, w, stripH);
          ctx.strokeStyle = hexA(GREY, a4(0.8));
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x0 + 4, stripBot - 4);
          ctx.lineTo(x1 - 4, stripTop + 4);
          ctx.stroke();
        }
      }
      ctx.fillStyle = hexA(TAPE_DK, a4(0.8));
      ctx.fillRect(x1 - 1, stripTop, 2, stripH);
    }

    // Sprocket holes along the top and bottom edges of the tape.
    var off = (t * pps) % 18;
    var sx;
    ctx.fillStyle = hexA(TAPE_DK, a4(0.9));
    for (sx = -off; sx < W; sx += 18) {
      ctx.fillRect(sx, stripTop + 4, 6, 5);
      ctx.fillRect(sx, stripBot - 9, 6, 5);
    }
    ctx.fillStyle = TAPE_EDGE;
    ctx.fillRect(0, stripTop - 2, W, 2);
    ctx.fillRect(0, stripBot, W, 2);

    // Playhead: a thin white line at the centre of the strip.
    ctx.fillStyle = hexA(BONE, a4(0.95));
    ctx.fillRect(centerX - 1, stripTop - 14, 2, stripH + 28);
    ctx.beginPath();
    ctx.moveTo(centerX - 6, stripTop - 14);
    ctx.lineTo(centerX + 6, stripTop - 14);
    ctx.lineTo(centerX, stripTop - 6);
    ctx.closePath();
    ctx.fill();
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var kNow = Math.floor(t / SEG);
    var curKept = segKept(kNow);
    var flare = 0;
    if (lastDecision) {
      var dtf = t - lastDecision.t;
      if (dtf >= 0 && dtf < 2.5) { flare = 1 - dtf / 2.5; }
    }
    drawField(t, curKept, flare);
    drawTape(t);

    // ---- Ratio counter, small in the bottom-right corner, above
    // the hint: hours of material in, minutes of piece out, and the
    // kept share against the session target.
    var r = ratioAt(t);
    var fsCount = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(GOLD_LT, a4(0.95));
    ctx.font = '600 ' + fsCount + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('IN ' + fmtClock(r.inSec) + ' · OUT ' + fmtClock(r.outSec), W - 18, H - 62);
    ctx.fillStyle = hexA(PLATE, a4(0.65));
    ctx.font = fsCount + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('KEPT ' + r.keptPct + '% · 3:00:00 IN, 0:42:00 OUT', W - 18, H - 44);

    // ---- Plates: title top-left, number and date below it, a short
    // descriptor top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textAlign = 'left';
    ctx.fillStyle = PLATE;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Three Hours Cut to Forty-Two', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(PLATE, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1949 · 2007 · 05 · 14', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(PLATE, 0.6);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('an editor, at work', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom on a warm gold pill so it
    // stays legible over the dark field.
    var hint = 'Tap to force the editor\'s cut.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(PILL, a4(0.85));
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = PILL_INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function perfT() { return lastT; }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      tapAt(perfT());
      draw(reduced ? startT : perfT());
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(startT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(startT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1949 exposes segment, decision, and ratio state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1949 = {
      kept: segKept,
      hash: segHash,
      decision: function (k) { return decisions[k] || null; },
      tapAt: tapAt,
      tapCount: function () { return decisionCount; },
      ratio: ratioAt,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T,
      startT: startT
    };
  } catch (e) {}

  resize();
  draw(startT); // one synchronous frame at load

  // Motion loop: the tape scrolls at W/90 px per second of material
  // time, the tone wanders at 0.023 to 0.11 Hz, the bloom pulses
  // slowly, all under the 14 Hz ceiling. Guarded so node-canvas
  // QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = startT + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
