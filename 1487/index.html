<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Long Room, 1975 to Now</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e0d0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  // ---------- seeded PRNG (mulberry32), never Math.random ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1487000);

  // ---------- palette (IW8 only) ----------
  var CREAM = '#e8e0d0', BRICK = '#a8674a', WOOD = '#8a6a48';
  var SPINE1 = '#4a5a7a', SPINE2 = '#6b4a3a', SPINE3 = '#2f4636';
  var PALE = '#f2ead8', GOLD = '#d9a441';
  var SPINES = [SPINE1, SPINE2, SPINE3, SPINE1, SPINE2];

  // ---------- journey timeline (loop-local, sums to LOOP) ----------
  var LOOP = 72;
  var SEGS = [
    { kind: 'travel', from: 0.00, to: 0.30, dur: 14 },
    { kind: 'dwell', room: 0, p: 0.30, dur: 4 },
    { kind: 'travel', from: 0.30, to: 0.58, dur: 14 },
    { kind: 'dwell', room: 1, p: 0.58, dur: 4 },
    { kind: 'travel', from: 0.58, to: 0.82, dur: 12 },
    { kind: 'dwell', room: 2, p: 0.82, dur: 4 },
    { kind: 'travel', from: 0.82, to: 1.00, dur: 10 },
    { kind: 'dwell', room: 3, p: 1.00, dur: 4 },
    { kind: 'dissolve', p: 1.00, dur: 6 }
  ];
  function timeline(j) {
    var t = ((j % LOOP) + LOOP) % LOOP;
    var acc = 0;
    for (var s = 0; s < SEGS.length; s++) {
      var sg = SEGS[s];
      if (t < acc + sg.dur) {
        var f = (t - acc) / sg.dur;
        if (sg.kind === 'travel') return { p: sg.from + (sg.to - sg.from) * f, phase: 'travel', room: -1, alpha: 1 };
        if (sg.kind === 'dwell') return { p: sg.p, phase: 'dwell', room: sg.room, alpha: 1 };
        return { p: 1, phase: 'dissolve', room: -1, alpha: 1 - f };
      }
      acc += sg.dur;
    }
    return { p: 0, phase: 'travel', room: -1, alpha: 1 };
  }

  // ---------- journey time with drag scrub (closed-form over events) ----------
  var evts = [];
  function journeyTime(t) {
    var anchorT = 0, anchorJ = 0, dragJ = null;
    for (var k = 0; k < evts.length; k++) {
      var e = evts[k];
      if (e.t > t) break;
      if (e.kind === 'down' || e.kind === 'move') { dragJ = e.j; anchorT = e.t; anchorJ = e.j; }
      else if (e.kind === 'up') { dragJ = null; anchorT = e.t; anchorJ = e.j; }
    }
    if (dragJ !== null) return dragJ;
    return anchorJ + (t - anchorT);
  }
  var lastT = 0;
  function scrubJ(x, w) {
    var v = x / w * LOOP;
    if (v < 0) v = 0;
    if (v > LOOP) v = LOOP;
    return v;
  }

  // ---------- geometry ----------
  function vp(w, h) { return { x: 0.86 * w, y: 0.5 * h }; }
  function rectAt(d, w, h) {
    var v = vp(w, h);
    var fx0 = v.x - 0.05 * w, fy0 = v.y - 0.11 * h;
    var fx1 = v.x + 0.05 * w, fy1 = v.y + 0.11 * h;
    return {
      x0: 0 + (fx0 - 0) * d, y0: 0 + (fy0 - 0) * d,
      x1: w + (fx1 - w) * d, y1: h + (fy1 - h) * d
    };
  }
  // fixed voice-line path in corridor space: 25 points, never mutated
  var PATH = [];
  (function () {
    for (var i = 0; i <= 24; i++) {
      var d = i / 24;
      PATH.push({ d: d, u: 0.55 * Math.sin(d * 9.0) + 0.45 * Math.sin(d * 17.0 + 1.2) });
    }
  })();
  function linePoint(d, w, h) {
    var v = vp(w, h);
    var x = v.x - (v.x - 0.02 * w) * Math.pow(1 - d, 1.35);
    var u = 0;
    for (var i = 0; i < PATH.length - 1; i++) {
      var a = PATH[i], b = PATH[i + 1];
      if (d >= a.d && d <= b.d) {
        var f = (d - a.d) / (b.d - a.d);
        u = a.u + (b.u - a.u) * f;
        break;
      }
      if (d > PATH[PATH.length - 1].d) u = PATH[PATH.length - 1].u;
    }
    var y = 0.5 * h + u * (1 - d) * 0.11 * h;
    return { x: x, y: y };
  }
  function round4(v) { return Math.round(v * 10000) / 10000; }

  // ---------- seeded decoration ----------
  // shelf spines hug the left/right edges of each receding room rect, upper portion
  var shelfSpines = []; // {d, side, i, col, stripe}
  (function () {
    var bounds = [0.30, 0.58, 0.82];
    for (var b = 0; b < bounds.length; b++) {
      for (var side = 0; side < 2; side++) {
        for (var i = 0; i < 5; i++) {
          shelfSpines.push({
            d: bounds[b], side: side, i: i,
            col: SPINES[Math.floor(rng() * SPINES.length)],
            stripe: rng() < 0.35
          });
        }
      }
    }
  })();
  var crowd = []; // far-room crowd shapes, clustered near the vanishing point
  (function () {
    for (var i = 0; i < 9; i++) {
      crowd.push({
        fx: 0.2 + rng() * 0.6, fy: 0.2 + rng() * 0.6,
        col: [SPINE1, SPINE2, SPINE3][Math.floor(rng() * 3)]
      });
    }
  })();
  var nearFigs = []; // nearest-room seated figures
  (function () {
    var cols = [SPINE1, SPINE2, SPINE3, SPINE1];
    for (var i = 0; i < 4; i++) {
      nearFigs.push({ fx: 0.10 + i * 0.16, col: cols[i] });
    }
  })();

  // ---------- drawing helpers (no batched arcs, no ellipses) ----------
  function dot(ctx, x, y, r, col) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
  }
  function rect(ctx, x, y, w, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w, h);
  }

  function draw(t) {
    lastT = t;
    var cv = document.getElementById('c');
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    if (cv.width !== w) cv.width = w;
    if (cv.height !== h) cv.height = h;
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    var ctx = cv.getContext('2d');
    var lt = ((journeyTime(t) % LOOP) + LOOP) % LOOP;
    var st = timeline(journeyTime(t));
    var v = vp(w, h);

    // ground: cream room
    rect(ctx, 0, 0, w, h, CREAM);
    // floor polygon (brick, flat alpha)
    ctx.globalAlpha = round4(0.2);
    ctx.beginPath();
    ctx.moveTo(0, h); ctx.lineTo(w, h); ctx.lineTo(v.x, v.y); ctx.closePath();
    ctx.fillStyle = BRICK; ctx.fill();
    ctx.globalAlpha = 1;
    // far room: pale fill inside rect(0.82), crowd shapes clustered near VP
    var far = rectAt(0.82, w, h);
    rect(ctx, far.x0, far.y0, far.x1 - far.x0, far.y1 - far.y0, PALE);
    var tip = linePoint(st.p, w, h);
    var dwelling = st.phase === 'dwell';
    for (var ci = 0; ci < crowd.length; ci++) {
      var cr = crowd[ci];
      var cx = v.x + (cr.fx - 0.5) * (far.x1 - far.x0) * 0.45;
      var cy = v.y + (cr.fy - 0.5) * (far.y1 - far.y0) * 0.4;
      var cs = Math.max(3, h * 0.024);
      var shift = 0;
      if (dwelling) {
        var dx = tip.x - cx;
        shift = Math.max(-1, Math.min(1, dx / 200)) * cs * 0.35;
      }
      rect(ctx, cx - cs * 0.8, cy, cs * 1.6, cs * 1.9, cr.col);
      dot(ctx, cx + shift, cy - cs * 0.5, cs * 0.7, PALE);
    }

    // shelf rooms: spine columns hugging each room rect's left/right edges
    for (var si = 0; si < shelfSpines.length; si++) {
      var sp = shelfSpines[si];
      var rr = rectAt(sp.d, w, h);
      var rh = rr.y1 - rr.y0;
      var bw = Math.max(3, w * 0.012), bh = Math.max(6, rh * 0.08);
      var bx = sp.side === 0 ? rr.x0 + w * 0.008 : rr.x1 - w * 0.008 - bw;
      var by = rr.y0 + (0.10 + sp.i * 0.10) * rh;
      rect(ctx, bx, by, bw, bh, sp.col);
      if (sp.stripe) rect(ctx, bx + bw * 0.3, by, Math.max(1, bw * 0.2), bh, GOLD);
    }

    // room rect outlines + perspective lines (nearest-room contents draw over these)
    ctx.strokeStyle = WOOD; ctx.lineWidth = Math.max(2, w * 0.0025);
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(v.x, v.y);
    ctx.moveTo(w, 0); ctx.lineTo(v.x, v.y);
    ctx.moveTo(0, h); ctx.lineTo(v.x, v.y);
    ctx.moveTo(w, h); ctx.lineTo(v.x, v.y);
    var r;
    r = rectAt(0.30, w, h); ctx.rect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
    r = rectAt(0.58, w, h); ctx.rect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
    r = rectAt(0.82, w, h); ctx.rect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
    ctx.stroke();

    // nearest room: bench + seated figures along the bottom, monitor wall left
    // figures sit ON the bench: seat at thigh level, shins down to feet
    var benchY = h * 0.86; // feet level
    for (var fi = 0; fi < nearFigs.length; fi++) {
      var fg = nearFigs[fi];
      var fx = fg.fx * w;
      var fs = h * 0.15; // figure height
      var hy = benchY - fs;
      var seatY = hy + fs * 0.62;
      rect(ctx, fx, hy + fs * 0.30, fs * 0.42, fs * 0.45, fg.col); // torso
      rect(ctx, fx + fs * 0.42, seatY, fs * 0.55, fs * 0.14, fg.col); // thigh
      rect(ctx, fx + fs * 0.90, seatY + fs * 0.14, fs * 0.13, benchY - seatY - fs * 0.14, fg.col); // shin
      var hshift = 0;
      if (dwelling) {
        var fdx = tip.x - fx;
        hshift = Math.max(-1, Math.min(1, fdx / 250)) * fs * 0.06;
      }
      dot(ctx, fx + fs * 0.21 + hshift, hy + fs * 0.14, fs * 0.17, CREAM);
    }
    rect(ctx, w * 0.05, benchY - h * 0.15 * 0.38, w * 0.62, Math.max(2, h * 0.006), WOOD); // bench line at seat level
    // monitor wall: three monitors stacked at the left edge, screens cycle on loop-local time
    var monCols = [SPINE1, BRICK, GOLD];
    var midx = Math.floor(lt / 2) % 3;
    for (var mi = 0; mi < 3; mi++) {
      var mx = w * 0.02, my = h * 0.12 + mi * h * 0.14;
      var mw = w * 0.075, mh = h * 0.11;
      rect(ctx, mx, my, mw, mh, BRICK);
      rect(ctx, mx + mw * 0.08, my + mh * 0.1, mw * 0.84, mh * 0.8, monCols[(midx + mi) % 3]);
      dot(ctx, mx + mw * 0.5, my + mh * 0.5, Math.max(2, h * 0.008), CREAM);
    }

    // voice-line: fixed path prefix up to progress, foreshortened, dissolving at the end
    ctx.globalAlpha = round4(st.alpha);
    ctx.strokeStyle = GOLD;
    ctx.lineCap = 'round';
    var prev = null;
    for (var i = 0; i < PATH.length - 1; i++) {
      var d0 = PATH[i].d, d1 = PATH[i + 1].d;
      if (st.p <= d0) break;
      var p0 = linePoint(d0, w, h);
      var p1 = st.p >= d1 ? linePoint(d1, w, h) : linePoint(st.p, w, h);
      var dmid = (d0 + Math.min(d1, st.p)) / 2;
      ctx.lineWidth = 1.5 + 5 * (1 - dmid);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
      prev = p1;
      if (st.p < d1) break;
    }
    // leading tip dot at the line's current end
    if (prev) dot(ctx, prev.x, prev.y, 3 + 3 * (1 - st.p), GOLD);
    else {
      var start = linePoint(0, w, h);
      dot(ctx, start.x, start.y, 6, GOLD);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- boot: frame one is draw(0), clock starts with the rAF loop ----------
  draw(0);
  var startTs = null;
  function loop(ts) {
    if (startTs === null) startTs = ts;
    draw((ts - startTs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  // ---------- interaction: drag along the corridor scrubs the line's position ----------
  function attach() {
    var cv = document.getElementById('c');
    function curW() {
      var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
      return vv ? vv.width : window.innerWidth;
    }
    function down(x) { evts.push({ t: lastT, kind: 'down', j: scrubJ(x, curW()) }); }
    function move(x) { evts.push({ t: lastT, kind: 'move', j: scrubJ(x, curW()) }); }
    function up(x) { evts.push({ t: lastT, kind: 'up', j: scrubJ(x, curW()) }); }
    var dragging = false;
    function onDown(e) { dragging = true; down(e.clientX); }
    function onMove(e) { if (dragging) move(e.clientX); }
    function onUp(e) { if (dragging) { dragging = false; up(e.clientX); } }
    if (cv.addEventListener) {
      cv.addEventListener('pointerdown', onDown);
      cv.addEventListener('pointermove', onMove);
      cv.addEventListener('pointerup', onUp);
    }
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('pointerup', onUp);
    }
    if (typeof window !== 'undefined') {
      window.__piece = {
        draw: draw,
        state: function (t) {
          var st = timeline(journeyTime(t));
          return { progress: st.p, phase: st.phase, room: st.room, alpha: st.alpha, journey: journeyTime(t) };
        },
        down: function (t, x) { evts.push({ t: t, kind: 'down', j: scrubJ(x, curW()) }); },
        move: function (t, x) { evts.push({ t: t, kind: 'move', j: scrubJ(x, curW()) }); },
        up: function (t, x) { evts.push({ t: t, kind: 'up', j: scrubJ(x, curW()) }); }
      };
    }
  }
  attach();

  // ---------- viewport + phone handling ----------
  function onResize() { draw(lastT); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }
})();
</script>
</body>
</html>
