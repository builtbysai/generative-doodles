<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop-Up 1895</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var PHASE = 12; // fixed first-frame phase: book ~64 deg open, gears mid-turn
  var LOOP = 40;  // unattended breathing loop, seconds
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var vw = 0, vh = 0, dpr = 1;
  var curT = PHASE;

  var PAPER = '#FFFFFF';
  var CREASE = '#C9C9C4';
  var SKIN = '#C9C9C7';
  var ACCENT = '#8A8A86';
  var BG = '#0A0A0A';

  function isPhone() {
    try {
      var s = window.screen;
      if (s && Math.min(s.width, s.height) < 700) return true;
    } catch (e) {}
    return vh > vw * 1.15;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smoother(u) { return u * u * u * (u * (u * 6 - 15) + 10); }

  // ---- master parameter: page-spread angle, degrees 0..90 ----
  // Unattended: slow sine breathing between 15 and 80 degrees, 40 s loop.
  function breathAngle(t) {
    return 47.5 + 32.5 * Math.sin((Math.PI * 2 * (t - 8.5)) / LOOP);
  }

  // Recorded pointer state (events only; the angle stays closed-form in t).
  var drag = null;    // {a0, y0, a} while a vertical drag is held
  var release = null; // {tR, aR} after a drag ends: analytic ease back to breathing

  function angleAt(t) {
    if (drag) return drag.a;
    if (release) {
      var u = (t - release.tR) / 6;
      if (u >= 1) { release = null; return breathAngle(t); }
      if (u < 0) u = 0;
      var w = smoother(u);
      return release.aR * (1 - w) + breathAngle(t) * w;
    }
    return breathAngle(t);
  }

  // ---- projection-skin data (deterministic) ----
  var SKY1 = [0.05, 0.34, 0.18, 0.46, 0.28, 0.55, 0.22, 0.40, 0.31, 0.50, 0.16, 0.38, 0.27, 0.44];
  var SKY2 = [0.30, 0.52, 0.24, 0.42, 0.60, 0.34, 0.48, 0.26, 0.55, 0.38];

  function drawGear(cx, cy, r, teeth, rot) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.34, 0, Math.PI * 2);
    ctx.stroke();
    for (var i = 0; i < teeth; i++) {
      var a = rot + (i / teeth) * Math.PI * 2;
      var ca = Math.cos(a), sa = Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(cx + ca * r * 0.82, cy + sa * r * 0.82);
      ctx.lineTo(cx + ca * r * 1.22, cy + sa * r * 1.22);
      ctx.stroke();
      // spokes
      ctx.beginPath();
      ctx.moveTo(cx + ca * r * 0.34, cy + sa * r * 0.34);
      ctx.lineTo(cx + ca * r * 0.82, cy + sa * r * 0.82);
      ctx.stroke();
    }
  }

  function drawSkyline(x0, x1, yBase, hMax, heights, t, seed) {
    var n = heights.length, bw = (x1 - x0) / n;
    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var bx = x0 + i * bw, bh = heights[i] * hMax;
      ctx.rect(bx + bw * 0.12, yBase - bh, bw * 0.76, bh);
    }
    ctx.stroke();
    // soft blinking window lights
    for (var j = 0; j < n; j++) {
      var wx = x0 + j * bw + bw * 0.5, wy = yBase - heights[j] * hMax * 0.55;
      var ph = 0.5 + 0.5 * Math.sin(t * 1.3 + (j + seed) * 1.7);
      ctx.globalAlpha = 0.2 + 0.6 * ph;
      ctx.beginPath();
      ctx.arc(wx, wy, Math.max(0.7, hMax * 0.045), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.85;
  }

  // ---- element silhouettes (path only; caller fills/strokes) ----
  // top = face top y, bot = face bottom y (the fold line on the page)
  function pathCloud(cx, top, w, bot) {
    var r1 = w * 0.30, r2 = w * 0.38, r3 = w * 0.30;
    var y1 = top + r1 * 0.95, y2 = top + r2 * 0.72, y3 = top + r3 * 0.95;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, bot);
    ctx.lineTo(cx - w / 2, y1);
    ctx.arc(cx - w * 0.26, y1, r1, Math.PI, Math.PI * 1.55);
    ctx.arc(cx, y2, r2, Math.PI * 1.28, Math.PI * 1.78);
    ctx.arc(cx + w * 0.26, y3, r3, Math.PI * 1.42, 0);
    ctx.lineTo(cx + w / 2, bot);
    ctx.closePath();
  }
  function pathTree(cx, top, w, bot) {
    var midY = top + (bot - top) * 0.52;
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.07, bot);
    ctx.lineTo(cx - w * 0.07, midY);
    ctx.lineTo(cx + w * 0.07, midY);
    ctx.lineTo(cx + w * 0.07, bot);
    ctx.closePath();
    ctx.moveTo(cx + w * 0.52, top + (bot - top) * 0.34);
    ctx.arc(cx, top + (bot - top) * 0.34, w * 0.52, 0, Math.PI * 2);
    ctx.moveTo(cx - w * 0.28 + w * 0.34, top + (bot - top) * 0.48);
    ctx.arc(cx - w * 0.28, top + (bot - top) * 0.48, w * 0.34, 0, Math.PI * 2);
    ctx.moveTo(cx + w * 0.28 + w * 0.34, top + (bot - top) * 0.48);
    ctx.arc(cx + w * 0.28, top + (bot - top) * 0.48, w * 0.34, 0, Math.PI * 2);
  }
  function pathHouse(cx, top, w, bot) {
    var roofY = top + (bot - top) * 0.30;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, bot);
    ctx.lineTo(cx - w / 2, roofY);
    ctx.lineTo(cx + w / 2, roofY);
    ctx.lineTo(cx + w / 2, bot);
    ctx.closePath();
    ctx.moveTo(cx - w * 0.58, roofY);
    ctx.lineTo(cx, top);
    ctx.lineTo(cx + w * 0.58, roofY);
    ctx.closePath();
  }
  function pathFence(cx, top, w, bot) {
    ctx.beginPath();
    ctx.rect(cx - w / 2, top, w, bot - top);
  }
  function pathOf(el, cx, top, w, bot) {
    if (el.type === 'cloud') pathCloud(cx, top, w, bot);
    else if (el.type === 'tree') pathTree(cx, top, w, bot);
    else if (el.type === 'house') pathHouse(cx, top, w, bot);
    else pathFence(cx, top, w, bot);
  }

  // back-to-front
  var ELEMENTS = [
    { type: 'cloud', cx: 0.355, w: 0.335, base: 0.900, maxRise: 0.295 },
    { type: 'tree',  cx: 0.240, w: 0.100, base: 0.908, maxRise: 0.335 },
    { type: 'tree',  cx: 0.700, w: 0.115, base: 0.908, maxRise: 0.355 },
    { type: 'fence', cx: 0.500, w: 0.620, base: 0.922, maxRise: 0.095 },
    { type: 'house', cx: 0.545, w: 0.210, base: 0.915, maxRise: 0.255 }
  ];

  function drawElement(el, S, ox, oy, riseFrac, t) {
    var cx = ox + el.cx * S;
    var w = el.w * S;
    var bot = oy + el.base * S;
    var rise = el.maxRise * S * riseFrac;
    var top = bot - rise;
    if (rise < 0.75) return; // fully flat: the element is the page itself
    var dx = w * 0.035, dy = -rise * 0.05;

    // extruded side edge (crease gray), offset up-right
    ctx.save();
    ctx.translate(dx, dy);
    pathOf(el, cx, top, w, bot);
    ctx.fillStyle = 'rgba(201,201,196,0.55)';
    ctx.fill();
    ctx.restore();

    // front face, white paper
    pathOf(el, cx, top, w, bot);
    ctx.fillStyle = PAPER;
    ctx.fill();
    ctx.lineWidth = Math.max(0.8, S * 0.0014);
    ctx.strokeStyle = CREASE;
    ctx.stroke();

    // ---- projection skin, clipped to the front face ----
    ctx.save();
    pathOf(el, cx, top, w, bot);
    ctx.clip();
    // the skin slides a little as the face rises
    ctx.translate(0, (1 - riseFrac) * S * 0.03);
    ctx.strokeStyle = SKIN;
    ctx.fillStyle = SKIN;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(0.8, S * 0.0016);
    var fh = bot - top;
    if (el.type === 'cloud') {
      drawGear(cx - w * 0.05, top + fh * 0.52, w * 0.20, 9, t * 0.15);
      ctx.strokeStyle = ACCENT;
      drawGear(cx + w * 0.30, top + fh * 0.72, w * 0.10, 7, -t * 0.22);
      ctx.strokeStyle = SKIN;
    } else if (el.type === 'tree') {
      drawGear(cx, top + fh * 0.32, w * 0.30, 8, t * 0.18 + el.cx * 7);
    } else if (el.type === 'fence') {
      // slats + rails as paper creases, skyline skin along the band
      ctx.strokeStyle = CREASE;
      var slats = 14;
      for (var i = 0; i <= slats; i++) {
        var sx = cx - w / 2 + (i / slats) * w;
        ctx.beginPath(); ctx.moveTo(sx, top); ctx.lineTo(sx, bot); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(cx - w / 2, top + fh * 0.34); ctx.lineTo(cx + w / 2, top + fh * 0.34); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - w / 2, top + fh * 0.72); ctx.lineTo(cx + w / 2, top + fh * 0.72); ctx.stroke();
      ctx.strokeStyle = SKIN;
      drawSkyline(cx - w * 0.46, cx + w * 0.46, bot - fh * 0.08, fh * 0.5, SKY2, t, 3);
    } else if (el.type === 'house') {
      // the numeral, largest face in the spread
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = ACCENT;
      ctx.font = '600 ' + Math.round(w * 0.335) + 'px Georgia, "Times New Roman", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('1895', cx, top + fh * 0.66);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = SKIN;
      drawGear(cx - w * 0.31, top + fh * 0.44, w * 0.085, 7, -t * 0.2);
      drawGear(cx + w * 0.33, top + fh * 0.86, w * 0.06, 6, t * 0.26);
      // door, a plain paper crease
      ctx.strokeStyle = CREASE;
      ctx.strokeRect(cx - w * 0.075, bot - fh * 0.30, w * 0.15, fh * 0.30);
      ctx.strokeStyle = SKIN;
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    if (!vw || !vh) return;
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, vw, vh);

    // square stage, centered; the spread is edge-to-edge within it
    var S = Math.min(vw, vh);
    var ox = (vw - S) / 2, oy = (vh - S) / 2;
    var phone = isPhone();

    var ang = angleAt(t);              // degrees, 0..90
    var k = (90 - ang) / 90;           // 0 = fully open, 1 = closed
    var riseFrac = Math.sin(ang * Math.PI / 180); // V-fold rise factor

    // ---- pages ----
    var spineTopX = ox + S * 0.5, spineTopY = oy + S * 0.115;
    var spineBotX = ox + S * 0.5, spineBotY = oy + S * 0.925;
    var halfW = S * (0.5 - 0.115 * k);
    var outTopY = oy + S * (0.10 + 0.012 * k);
    var outBotY = oy + S * (0.94 - 0.03 * k);
    var sides = [-1, 1];
    for (var si = 0; si < 2; si++) {
      var sgn = sides[si];
      ctx.beginPath();
      ctx.moveTo(spineTopX, spineTopY);
      ctx.lineTo(spineTopX + sgn * halfW, outTopY);
      ctx.lineTo(spineTopX + sgn * halfW, outBotY);
      ctx.lineTo(spineBotX, spineBotY);
      ctx.closePath();
      ctx.fillStyle = PAPER;
      ctx.fill();
      ctx.lineWidth = Math.max(0.8, S * 0.0014);
      ctx.strokeStyle = CREASE;
      ctx.stroke();
    }
    // page shading: a whisper of gray on the left page so the fold reads
    ctx.beginPath();
    ctx.moveTo(spineTopX, spineTopY);
    ctx.lineTo(spineTopX - halfW, outTopY);
    ctx.lineTo(spineTopX - halfW, outBotY);
    ctx.lineTo(spineBotX, spineBotY);
    ctx.closePath();
    ctx.fillStyle = 'rgba(201,201,196,0.16)';
    ctx.fill();
    // spine crease shadow, both sides, widening toward the bottom
    ctx.beginPath();
    ctx.moveTo(spineTopX - S * 0.004, spineTopY);
    ctx.lineTo(spineTopX + S * 0.004, spineTopY);
    ctx.lineTo(spineBotX + S * 0.018, spineBotY);
    ctx.lineTo(spineBotX - S * 0.018, spineBotY);
    ctx.closePath();
    ctx.fillStyle = 'rgba(201,201,196,0.30)';
    ctx.fill();
    // center fold line
    ctx.beginPath();
    ctx.moveTo(spineTopX, oy + S * 0.105);
    ctx.lineTo(spineBotX, oy + S * 0.935);
    ctx.lineWidth = Math.max(1, S * 0.0018);
    ctx.strokeStyle = CREASE;
    ctx.stroke();

    // ---- pop-up elements, back to front ----
    for (var ei = 0; ei < ELEMENTS.length; ei++) {
      drawElement(ELEMENTS[ei], S, ox, oy, riseFrac, t);
    }

    // ---- red stage wash over the top edge of the spread (flat alpha) ----
    var washY = oy + S * 0.098;
    ctx.fillStyle = 'rgba(255,59,48,0.05)';
    ctx.fillRect(ox, washY, S, S * 0.11);
    ctx.fillStyle = 'rgba(255,59,48,0.15)';
    ctx.fillRect(ox, washY, S, S * 0.05);

    curT = t;
  }

  // ---- vertical drag sets the spread angle ----
  function stageS() { return Math.min(vw, vh) || 1; }
  function onDown(e) {
    release = null;
    drag = { a: angleAt(curT), y0: e.clientY, a0: angleAt(curT) };
    drag.a = drag.a0;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!drag) return;
    var dy = (e.clientY - drag.y0) / stageS();
    drag.a = clamp(drag.a0 + dy * 140, 0, 90);
  }
  function onUp() {
    if (!drag) return;
    release = { tR: curT, aR: drag.a };
    drag = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  if (window.addEventListener) window.addEventListener('pointerup', onUp);

  function resize() {
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    } else {
      vw = window.innerWidth;
      vh = window.innerHeight;
    }
    dpr = window.devicePixelRatio || 1;
    if (dpr > 2) dpr = 2;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(curT);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) window.addEventListener('resize', resize);

  resize();
  draw(PHASE);

  // motion loop: anchored at the fixed phase, elapsed time only
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var loop = function (now) {
      if (t0 === null) t0 = now;
      draw(PHASE + (now - t0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
