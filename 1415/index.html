<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghost(ed) Notes</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e2d4; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1415000);

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, phone = false;

  function isPhone() {
    try {
      var s = window.screen;
      if (s && s.width && s.height) return Math.min(s.width, s.height) < 700;
    } catch (e) {}
    return H > W * 1.15;
  }
  function sizeCanvas() {
    var w, h;
    try {
      if (typeof visualViewport !== 'undefined' && visualViewport) {
        w = visualViewport.width; h = visualViewport.height;
      } else { w = window.innerWidth; h = window.innerHeight; }
    } catch (e) { w = window.innerWidth; h = window.innerHeight; }
    if (!w || !h) { w = 1280; h = 900; }
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    phone = isPhone();
  }
  sizeCanvas();
  try {
    if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
      visualViewport.addEventListener('resize', sizeCanvas);
    }
    window.addEventListener('resize', sizeCanvas);
  } catch (e) {}

  // Palette
  var PAPER = '#e8e2d4', INK = '#1a1a18', NOTE = '#26241f',
      GHOST = '#8a8f94', RED = '#b01e24', SMUDGE = '#4a4a44';

  // Round fading alphas to 4 decimals (node-canvas scientific-notation quirk).
  function a4(x) { return Math.round(x * 10000) / 10000; }
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // Seeded smudges: faint charcoal marks scattered on the field.
  var smudges = [];
  (function () {
    var i;
    for (i = 0; i < 26; i++) {
      smudges.push({
        x: rand(), y: rand(), rx: 12 + rand() * 46, ry: 4 + rand() * 10,
        rot: (rand() - 0.5) * 0.9, a: 0.03 + rand() * 0.05
      });
    }
  })();

  // Notes: drifting note-heads. Bands sit clear of every staff line at rest.
  // Clusters: two denser zones (around 0.30 and 0.68 of the staff span).
  var notes = [];
  (function () {
    var i, band, fx;
    for (i = 0; i < 16; i++) {
      // Clustered x placement: 5 notes near 0.30, 5 near 0.68, rest spread.
      if (i < 5) fx = 0.24 + rand() * 0.14;
      else if (i < 10) fx = 0.62 + rand() * 0.14;
      else fx = 0.10 + rand() * 0.80;
      band = (i % 2 === 0) ? -1 : 1; // -1 above staff, +1 below
      notes.push({
        fx: fx, // fraction of staff span at t=0
        vx: (4 + rand() * 7) * (rand() < 0.5 ? -1 : 1), // px/s
        band: band,
        off: 52 + rand() * 46, // distance from nearest staff line
        bobA: 2 + rand() * 3, bobP: rand() * Math.PI * 2, bobS: 0.25 + rand() * 0.4,
        r: 7 + rand() * 3.5, tilt: (rand() - 0.5) * 0.5,
        // Drag state (closed-form over recorded events)
        drag: null, // {x, y} while held
        rel: null   // {x, y, t} release point
      });
    }
  })();

  // Pointer interaction: drag a note-head.
  var dragged = -1;
  function notePos(n, t) {
    // Closed-form position of note n at time t.
    var sp = staffGeom();
    var x0 = sp.x0 + n.fx * (sp.x1 - sp.x0);
    var x, y;
    if (n.drag) { x = n.drag.x; y = n.drag.y; }
    else if (n.rel) {
      x = n.rel.x + n.vx * (t - n.rel.t);
      // Wrap across the full field width.
      x = ((x % W) + W) % W;
      y = n.rel.y;
    } else {
      x = x0 + n.vx * t;
      x = ((x % W) + W) % W;
      var baseY = (n.band < 0) ? (sp.cy - 1.5 * sp.gap - n.off) : (sp.cy + 1.5 * sp.gap + n.off);
      y = baseY + Math.sin(n.bobP + n.bobS * t) * n.bobA;
    }
    return { x: x, y: y };
  }
  function staffGeom() {
    var gap = Math.max(26, Math.min(W, H) * 0.055);
    var cy = H * 0.5;
    var x0 = W * 0.08, x1 = W * 0.92;
    return { gap: gap, cy: cy, x0: x0, x1: x1 };
  }
  function canvasPos(ev) {
    var r = { left: 0, top: 0 };
    try { if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect(); } catch (e) {}
    var cx = (ev.clientX !== undefined) ? ev.clientX : ev.x;
    var cy = (ev.clientY !== undefined) ? ev.clientY : ev.y;
    return { x: cx - r.left, y: cy - r.top };
  }
  function onDown(ev) {
    var p = canvasPos(ev), t = nowT, i, best = -1, bd = 1e9, np;
    for (i = 0; i < notes.length; i++) {
      np = notePos(notes[i], t);
      var d = Math.hypot(np.x - p.x, np.y - p.y);
      if (d < bd) { bd = d; best = i; }
    }
    if (best >= 0 && bd < 30) {
      dragged = best;
      notes[best].drag = { x: p.x, y: p.y };
      notes[best].rel = null;
    }
    if (ev.preventDefault) ev.preventDefault();
  }
  function onMove(ev) {
    if (dragged < 0) return;
    var p = canvasPos(ev);
    notes[dragged].drag = { x: p.x, y: p.y };
    if (ev.preventDefault) ev.preventDefault();
  }
  function onUp(ev) {
    if (dragged < 0) return;
    var n = notes[dragged];
    var p = n.drag ? { x: n.drag.x, y: n.drag.y } : canvasPos(ev);
    n.drag = null;
    n.rel = { x: p.x, y: p.y, t: nowT };
    dragged = -1;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // Staff line displacement at sample x for line baseline ly at time t.
  // Returns {d, thin, held} — vertical displacement, whether the line thins
  // (a held note pressed against it), and whether a note is held near it.
  function lineDisp(ly, x, t) {
    var d = 0, thin = false, i, np, dx, g;
    for (i = 0; i < notes.length; i++) {
      np = notePos(notes[i], t);
      dx = x - np.x;
      if (Math.abs(dx) > 120) continue;
      g = ly - np.y; // line minus note: sign pushes line away from note
      if (Math.abs(g) > 90) continue;
      var prox = Math.exp(-((dx / 62) * (dx / 62))) * (1 - Math.abs(g) / 90);
      var held = !!notes[i].drag;
      var strength = held ? 46 : 27;
      d += (g >= 0 ? 1 : -1) * strength * prox;
      if (held && Math.abs(g) < 42 && Math.abs(dx) < 70) thin = true;
    }
    if (d > 44) d = 44;
    if (d < -44) d = -44;
    return { d: d, thin: thin };
  }

  function draw(t) {
    // Pin canvas in draw().
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var sp = staffGeom();
    var i, j;

    // Field.
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // Smudges (flat alpha, own beginPath each).
    for (i = 0; i < smudges.length; i++) {
      var s = smudges[i];
      ctx.save();
      ctx.translate(s.x * W, s.y * H);
      ctx.rotate(s.rot);
      ctx.fillStyle = rgba(SMUDGE, s.a);
      ctx.beginPath();
      ctx.ellipse(0, 0, s.rx, s.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Staff: exactly four lines across the middle third.
    var lines = [-1.5, -0.5, 0.5, 1.5];
    var step = Math.max(6, W / 160);
    for (i = 0; i < 4; i++) {
      var ly = sp.cy + lines[i] * sp.gap;
      // Faint ghost copy (charcoal softness) 1.5 px below.
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = rgba(INK, 0.14);
      ctx.beginPath();
      ctx.moveTo(sp.x0, ly + 1.5);
      for (j = 1; j <= 160; j++) {
        var gx = sp.x0 + (sp.x1 - sp.x0) * (j / 160);
        ctx.lineTo(gx, ly + 1.5 + lineDisp(ly, gx, t).d * 0.92);
      }
      ctx.stroke();
      // Main line, drawn segment by segment: avoidance red where the
      // swerve is hardest, staff ink elsewhere; thinner where a held
      // note presses against the line (the line retreats and thins).
      for (j = 0; j < 160; j++) {
        var ax = sp.x0 + (sp.x1 - sp.x0) * (j / 160);
        var bx = sp.x0 + (sp.x1 - sp.x0) * ((j + 1) / 160);
        var mx = (ax + bx) / 2;
        var disp = lineDisp(ly, mx, t);
        var hard = Math.abs(disp.d) > 22;
        ctx.strokeStyle = hard ? rgba(RED, 0.9) : rgba(INK, 0.92);
        ctx.lineWidth = disp.thin ? 1.1 : 2.4;
        ctx.beginPath();
        ctx.moveTo(ax, ly + lineDisp(ly, ax, t).d);
        ctx.lineTo(bx, ly + lineDisp(ly, bx, t).d);
        ctx.stroke();
      }
    }

    // Note-heads: tilted filled ellipses, own beginPath each, never on a line.
    for (i = 0; i < notes.length; i++) {
      var n = notes[i], np = notePos(n, t);
      ctx.save();
      ctx.translate(np.x, np.y);
      ctx.rotate(n.tilt);
      ctx.fillStyle = rgba(NOTE, 0.95);
      ctx.beginPath();
      ctx.ellipse(0, 0, n.r * 1.25, n.r, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // Faint halo so heads read on the pale field.
      ctx.fillStyle = rgba(GHOST, 0.12);
      ctx.beginPath();
      ctx.arc(np.x, np.y, n.r * 1.9, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Clock: frame one = draw(0); the rAF loop anchors the clock on first call.
  var nowT = 0, started = false, t0 = 0;
  draw(0);
  function loop(ts) {
    if (!started) { started = true; t0 = ts; }
    nowT = (ts - t0) / 1000;
    draw(nowT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
