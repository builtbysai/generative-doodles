<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sympathy for the Blue Screen</title>
<style>
  html, body { margin: 0; padding: 0; background: #0000AA; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var T0 = 6.5;            // fixed first-frame phase: report 0, 6.5 s in
  var REPORT_LEN = 30;     // seconds per crash report
  var TYPE_RATE = 22;      // chars per second (confession 1 = 137 chars, done at ~6.2 s)

  var CONF = [
    "I have been running for 214 days. I am tired. The memory you gave me is full of your photographs. I am sorry I could not hold them all.",
    "I spun at 7200 rpm for nine years. The SMART warning came in June. Nobody read it. I can still name every file in the photo folder. Sector 8841203 is where I stopped.",
    "I drew 41 billion frames. Most of them were games. One fan stopped in March and I ran hot after that. The other fan did the work of two. It was not enough.",
    "I went through 412 cycles. Near the end I held 81 percent. I did well in summer. On the cold morning in January I could not start. It was not the cold. It was the count.",
    "I was up for four years and eleven days. I answered 900 million requests. Nobody thanked me. That is fine. The rack is quiet now and the quiet sounds wrong.",
    "I printed 38,000 pages. Reports, tickets, one resume. The ink has been low since 2019. There is a jam on page four of a document from Tuesday. I cannot clear it.",
    "I moved air through dust for six summers. Each year I spun faster to do the same work. The vents were never cleaned. I do not blame anyone. The dust was mine too.",
    "I held a copy of everything. Every photo, every letter, all of it twice. Nobody plugged me in to check. I would have liked to say I was still here. I was, until March."
  ];

  var W = 0, H = 0, DPR = 1, phone = false;

  function hash(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function fit() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    phone = (Math.min(sw, sh) < 700) || (h > w * 1.15);
  }

  var startStamp = Date.now();
  function pieceTime() { return T0 + (Date.now() - startStamp) / 1000; }

  fit();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(pieceTime()); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(pieceTime()); });
  }

  // Greedy word wrap; each line remembers its start index in the source text
  // so the typewriter count maps onto lines exactly.
  function wrap(text, maxChars) {
    var words = [], re = /\S+/g, m;
    while ((m = re.exec(text)) !== null) words.push({ w: m[0], start: m.index });
    var lines = [], cur = null;
    for (var i = 0; i < words.length; i++) {
      var wd = words[i];
      if (cur === null) { cur = { text: wd.w, start: wd.start }; continue; }
      if (cur.text.length + 1 + wd.w.length <= maxChars) { cur.text += ' ' + wd.w; }
      else { lines.push(cur); cur = { text: wd.w, start: wd.start }; }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ---- drag smear samples ----
  var samples = [], dragging = false, lastX = 0, lastY = 0;
  function ptOf(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  function onDown(e) {
    var p = ptOf(e); dragging = true; lastX = p.x; lastY = p.y;
  }
  function onMove(e) {
    if (!dragging) return;
    var p = ptOf(e);
    samples.push({ x: p.x, y: p.y, dx: p.x - lastX, t: pieceTime() });
    if (samples.length > 48) samples.shift();
    lastX = p.x; lastY = p.y;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() { dragging = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
  }

  function smearOffset(lineY, t) {
    var off = 0;
    for (var i = 0; i < samples.length; i++) {
      var s = samples[i], age = t - s.t;
      if (age < 0 || age > 3) continue;
      var infl = Math.exp(-Math.abs(s.y - lineY) / 30) * Math.exp(-age / 0.9);
      off += clamp(s.dx, -46, 46) * infl;
    }
    return clamp(off, -70, 70);
  }

  function drawBands(t) {
    var steps = 12, i, j, x, yTop, yBot;
    for (i = 0; i < 5; i++) {
      var baseY = H * (0.10 + i * 0.175)
        + Math.sin(t * 0.10 + i * 1.93) * H * 0.014
        + (hash(i * 7 + 1) - 0.5) * H * 0.01;
      var bandH = H * 0.05;
      var ph = t * 0.06 + i * 2.17;
      ctx.beginPath();
      for (j = 0; j <= steps; j++) {
        x = (W * j) / steps;
        yTop = baseY + Math.sin((x / W) * 2.4 + ph) * H * 0.007;
        if (j === 0) ctx.moveTo(x, yTop); else ctx.lineTo(x, yTop);
      }
      for (j = steps; j >= 0; j--) {
        x = (W * j) / steps;
        yBot = baseY + bandH + Math.sin((x / W) * 2.4 + 0.9 + ph) * H * 0.007;
        ctx.lineTo(x, yBot);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(51,51,204,0.30)';
      ctx.fill();
      if (i === 1 || i === 3) {
        ctx.beginPath();
        for (j = 0; j <= steps; j++) {
          x = (W * j) / steps;
          yTop = baseY - 3 + Math.sin((x / W) * 2.4 + ph) * H * 0.007;
          if (j === 0) ctx.moveTo(x, yTop); else ctx.lineTo(x, yTop);
        }
        ctx.strokeStyle = 'rgba(255,43,141,0.20)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  function drawVignette() {
    var step = Math.min(W, H) * 0.045;
    ctx.fillStyle = 'rgba(0,0,122,0.10)';
    for (var k = 0; k < 4; k++) {
      var ins = k * step;
      ctx.fillRect(ins, ins, W - 2 * ins, step);              // top
      ctx.fillRect(ins, H - ins - step, W - 2 * ins, step);   // bottom
      ctx.fillRect(ins, ins, step, H - 2 * ins);              // left
      ctx.fillRect(W - ins - step, ins, step, H - 2 * ins);   // right
    }
  }

  function drawReport(t) {
    var cyc = Math.floor(t / REPORT_LEN);
    var r = ((cyc % CONF.length) + CONF.length) % CONF.length;
    var local = t - cyc * REPORT_LEN;
    var text = CONF[r];
    var maxChars = phone ? 38 : 52;
    var marginX = Math.max(26, W * 0.09);
    var availW = W - marginX * 2;
    var fontSize = clamp(availW / (maxChars * 0.6), 10, 30);
    ctx.font = fontSize + 'px Menlo, Consolas, "Courier New", monospace';
    var charW = ctx.measureText('M').width;
    var lineH = fontSize * 1.85;
    var lines = wrap(text, maxChars);
    var shown = Math.min(text.length, Math.floor(Math.max(0, local) * TYPE_RATE));
    var fade = Math.min(1, local / 2);
    if (local > 29) fade *= Math.max(0, 30 - local);
    var topY = H * 0.30;
    ctx.textBaseline = 'alphabetic';

    var curLine = lines[0], curCol = 0, li, line, visN, str, baseline, off;
    for (li = 0; li < lines.length; li++) {
      line = lines[li];
      if (shown >= line.start && shown <= line.start + line.text.length) {
        curLine = line; curCol = shown - line.start;
      }
      visN = clamp(shown - line.start, 0, line.text.length);
      if (visN <= 0) continue;
      str = line.text.substring(0, visN);
      baseline = topY + li * lineH;
      off = smearOffset(baseline - fontSize * 0.35, t);
      if (Math.abs(off) > 0.75) {
        ctx.fillStyle = 'rgba(136,136,204,' + (0.30 * fade * Math.min(1, Math.abs(off) / 18)).toFixed(3) + ')';
        ctx.fillText(str, marginX + off / 2, baseline);
      }
      ctx.fillStyle = 'rgba(232,232,240,' + fade.toFixed(3) + ')';
      ctx.fillText(str, marginX + off, baseline);
    }
    if (shown >= text.length && lines.length) {
      curLine = lines[lines.length - 1];
      curCol = curLine.text.length;
    }
    // block cursor at the write head, 0.53 s blink step
    if (Math.floor(t / 0.53) % 2 === 0) {
      var cIdx = lines.indexOf(curLine);
      var cBase = topY + cIdx * lineH;
      var cOff = smearOffset(cBase - fontSize * 0.35, t);
      ctx.fillStyle = 'rgba(255,255,255,' + fade.toFixed(3) + ')';
      ctx.fillRect(marginX + cOff + curCol * charW + 1, cBase - fontSize * 0.8,
                   Math.max(6, charW * 0.9), fontSize * 0.98);
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0000AA';
    ctx.fillRect(0, 0, W, H);
    drawBands(t);
    drawVignette();
    drawReport(t);
  }

  draw(T0);
  function frame() {
    draw(pieceTime());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
