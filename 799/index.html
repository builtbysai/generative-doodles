<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1965/1966</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0E0D0B; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  // Strict palette, two worlds. Left (1965): near-black ground, vermilion,
  // teal, black, pale. Right (1966): warm white, cobalt. Nothing else.
  var L_GROUND = "#0E0D0B";
  var VERMILION = "#C8401F";
  var TEAL = "#2E8C83";
  var INK = "#1A1A1A";        // black strokes, lifted a breath off the ground
  var PALE = "#E8E2D2";
  var R_GROUND = "#ECE8DE";
  var COBALT = "#2B5FA6";

  // The wipe starts at center: half gesture, half rule.
  var ANCHOR0 = 0.5;

  // Idle rule: after 5 s without a pointer, the line breathes plus or
  // minus 2 percent of the frame width on a 10 s sine around wherever it
  // was left. The decision sways; it does not wander.
  var IDLE_DELAY = 5;
  var BREATH_PERIOD = 10;
  var BREATH_AMP = 0.02;

  // mulberry32: the only randomness in the piece, consumed once at setup.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
  function easeOut(p) { return 1 - (1 - p) * (1 - p); }

  // ---- The 1965 side: one gestural composition, painted once -----------
  // Everything on the left is parameter data from a single seeded stream:
  // nested squares (center, size, rotation, colour, width, and a wobble
  // offset for every interior edge point) and free bezier strokes. The
  // draw step only evaluates the parameters; nothing is improvised per
  // frame, so the painting is identical on every load, as a painting is.

  function makeSquares(rng, cx, cy, sizes, colors) {
    var out = [];
    for (var i = 0; i < sizes.length; i++) {
      var wob = [];
      for (var k = 0; k < 16; k++) wob.push((rng() * 2 - 1) * 0.014); // of size
      out.push({
        cx: cx + (rng() * 2 - 1) * 0.012,   // the hand never centres twice
        cy: cy + (rng() * 2 - 1) * 0.012,
        size: sizes[i],
        rot: (rng() * 2 - 1) * 0.055,       // a few degrees off true
        color: colors[i % colors.length],
        width: 0.009 + rng() * 0.013,       // of min dimension
        alpha: 0.82 + rng() * 0.18,
        wob: wob
      });
    }
    return out;
  }

  function makeStroke(rng, colors) {
    var x0 = rng(), y0 = rng();
    return {
      x0: x0, y0: y0,
      x1: x0 + (rng() * 2 - 1) * 0.45, y1: y0 + (rng() * 2 - 1) * 0.45,
      x2: x0 + (rng() * 2 - 1) * 0.55, y2: y0 + (rng() * 2 - 1) * 0.55,
      x3: x0 + (rng() * 2 - 1) * 0.5,  y3: y0 + (rng() * 2 - 1) * 0.5,
      color: colors[Math.floor(rng() * colors.length)],
      width: 0.004 + rng() * 0.012,
      alpha: 0.55 + rng() * 0.4
    };
  }

  var ART = (function () {
    var rng = mulberry32(799101);
    var squares = [];
    // The main nest, low and left of centre: the 1965 motif itself.
    squares = squares.concat(makeSquares(rng, 0.33, 0.46,
      [0.62, 0.525, 0.435, 0.35, 0.27, 0.195],
      [VERMILION, PALE, TEAL, INK, VERMILION, TEAL]));
    // A second, smaller nest up high, half of it usually under the rule.
    squares = squares.concat(makeSquares(rng, 0.62, 0.17,
      [0.30, 0.225, 0.155], [TEAL, VERMILION, PALE]));
    // A third nest in the lower-left corner.
    squares = squares.concat(makeSquares(rng, 0.15, 0.80,
      [0.26, 0.19, 0.125], [PALE, TEAL, VERMILION]));
    var strokes = [];
    var cols = [VERMILION, TEAL, PALE, INK, VERMILION, TEAL];
    for (var i = 0; i < 13; i++) strokes.push(makeStroke(rng, cols));
    return { squares: squares, strokes: strokes };
  })();

  // ---- The 1966 side: the first imprint grid ---------------------------
  // The same dab construction as Thirty Centimeters: a solid body of
  // paint, near-opaque through its upper two-thirds, bristle ridges and
  // ground-coloured gap scores inside it, a dense load at the top edge.
  // Here every imprint is fully pressed and nothing ever moves; only the
  // wipe decides how much of the grid the world gets to see.
  function makeImprint(rng) {
    var streaks = [];
    var n = 26 + Math.floor(rng() * 13);
    for (var i = 0; i < n; i++) {
      streaks.push({
        x: (rng() * 2 - 1) * 0.46,
        top: -0.5 + rng() * 0.1,
        len: 0.58 + rng() * 0.44,
        w: 0.028 + rng() * 0.03,
        a: 0.45 + rng() * 0.4
      });
    }
    var gaps = [];
    var g = 18 + Math.floor(rng() * 10);
    for (var h = 0; h < g; h++) {
      gaps.push({
        x: (rng() * 2 - 1) * 0.46,
        top: -0.5 + rng() * 0.08,
        len: 0.5 + rng() * 0.48,
        w: 0.012 + rng() * 0.014,
        a: 0.16 + rng() * 0.2
      });
    }
    var load = [];
    var m = 8 + Math.floor(rng() * 5);
    for (var j = 0; j < m; j++) {
      load.push({
        x: (rng() * 2 - 1) * 0.44,
        len: 0.1 + rng() * 0.12,
        w: 0.03 + rng() * 0.03,
        a: 0.65 + rng() * 0.3
      });
    }
    return {
      rot: (rng() * 2 - 1) * 0.035,
      scl: 0.95 + rng() * 0.1,
      alp: 0.9 + rng() * 0.1,
      body: 0.9 + rng() * 0.1,
      streaks: streaks,
      gaps: gaps,
      load: load
    };
  }

  var IMPRINTS = (function () {
    var rng = mulberry32(799201);
    var set = [];
    for (var i = 0; i < 16; i++) set.push(makeImprint(rng));
    return set;
  })();

  function drawImprint(cx, cy, s, imp) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(imp.rot);
    ctx.scale(imp.scl, imp.scl);
    ctx.fillStyle = COBALT;
    var BANDS = 12, b, bf;
    for (b = 0; b < BANDS; b++) {
      bf = b / BANDS;
      ctx.globalAlpha = imp.alp * imp.body *
        (bf < 0.62 ? 1 : 1 - 0.45 * smooth((bf - 0.62) / 0.38));
      ctx.fillRect(-s / 2, -s / 2 + bf * s, s, s / BANDS + 1);
    }
    ctx.lineCap = "butt";
    var k, st, seg, segLen, y0, y1;
    ctx.strokeStyle = COBALT;
    for (k = 0; k < imp.streaks.length; k++) {
      st = imp.streaks[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      y0 = st.top * s;
      segLen = (st.len * s) / 3;
      for (seg = 0; seg < 3; seg++) {
        ctx.globalAlpha = imp.alp * st.a * (seg === 0 ? 1 : (seg === 1 ? 0.62 : 0.35));
        y1 = y0 + segLen;
        ctx.beginPath();
        ctx.moveTo(st.x * s, y0);
        ctx.lineTo(st.x * s, y1);
        ctx.stroke();
        y0 = y1;
      }
    }
    ctx.strokeStyle = R_GROUND;
    for (k = 0; k < imp.gaps.length; k++) {
      st = imp.gaps[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      y0 = st.top * s;
      segLen = (st.len * s) / 3;
      for (seg = 0; seg < 3; seg++) {
        ctx.globalAlpha = st.a * (seg === 0 ? 1 : (seg === 1 ? 0.6 : 0.3));
        y1 = y0 + segLen;
        ctx.beginPath();
        ctx.moveTo(st.x * s, y0);
        ctx.lineTo(st.x * s, y1);
        ctx.stroke();
        y0 = y1;
      }
    }
    ctx.strokeStyle = COBALT;
    for (k = 0; k < imp.load.length; k++) {
      st = imp.load[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      ctx.globalAlpha = imp.alp * st.a;
      ctx.beginPath();
      ctx.moveTo(st.x * s, -s / 2);
      ctx.lineTo(st.x * s, -s / 2 + st.len * s);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---- Frame, sizing, phone rule ---------------------------------------
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    DPR = window.devicePixelRatio || 1;
    W = Math.round(w);
    H = Math.round(h);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  // ---- The wipe: a closed-form function of the recorded drag -----------
  // Pointer events are recorded as samples {t, fx} on the piece's own
  // timeline (seconds since load, position as a fraction of width). The
  // line's place at any time t is computed from those samples alone:
  // piecewise-linear between them, the last one held after release, and
  // the idle breath added once the hand has been gone for 5 s. No state
  // is integrated frame to frame, so frame one (no samples, t = 0) is
  // exactly the centred seam, every time.
  var samples = [];
  var dragging = false;
  var lastEventT = 0;
  var currentT = 0;

  function marginFx() { return isPhone() ? 0.10 : 0.06; }
  function clampFx(fx) {
    var m = marginFx();
    return fx < m ? m : (fx > 1 - m ? 1 - m : fx);
  }

  function wipeFxAt(t) {
    var base, i;
    if (samples.length === 0) {
      base = ANCHOR0;
    } else if (t <= samples[0].t) {
      base = samples[0].fx;
    } else if (t >= samples[samples.length - 1].t) {
      base = samples[samples.length - 1].fx;
    } else {
      base = samples[samples.length - 1].fx;
      for (i = 1; i < samples.length; i++) {
        if (t < samples[i].t) {
          var p = (t - samples[i - 1].t) / Math.max(1e-6, samples[i].t - samples[i - 1].t);
          base = samples[i - 1].fx + (samples[i].fx - samples[i - 1].fx) * p;
          break;
        }
      }
    }
    if (!dragging) {
      var idle = t - lastEventT;
      if (idle > IDLE_DELAY) {
        base += BREATH_AMP * Math.sin(2 * Math.PI * (idle - IDLE_DELAY) / BREATH_PERIOD);
      }
    }
    return clampFx(base);
  }

  function pointerFx(e) {
    var r = canvas.getBoundingClientRect();
    if (!r || !r.width) return ANCHOR0;
    return clampFx((e.clientX - r.left) / r.width);
  }

  function record(e) {
    samples.push({ t: currentT, fx: pointerFx(e) });
    if (samples.length > 4000) samples.splice(0, samples.length - 4000);
    lastEventT = currentT;
  }

  canvas.addEventListener("pointerdown", function (e) {
    dragging = true;
    record(e);
    if (e.preventDefault) e.preventDefault();
    draw(currentT);
  });
  window.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    record(e);
    draw(currentT);
  });
  window.addEventListener("pointerup", function (e) {
    if (!dragging) return;
    dragging = false;
    record(e);
    draw(currentT);
  });
  window.addEventListener("pointercancel", function () {
    dragging = false;
    lastEventT = currentT;
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () { resize(); draw(currentT); });
  }
  window.addEventListener("resize", function () { resize(); draw(currentT); });

  // ---- Drawing ----------------------------------------------------------
  function drawSquare(sq, M) {
    var cxp = sq.cx * W, cyp = sq.cy * H;
    var size = sq.size * M;
    var half = size / 2;
    var cosr = Math.cos(sq.rot), sinr = Math.sin(sq.rot);
    var corners = [];
    var base = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
    var i, j;
    for (i = 0; i < 4; i++) {
      var lx = base[i][0] * half, ly = base[i][1] * half;
      corners.push([cxp + lx * cosr - ly * sinr, cyp + lx * sinr + ly * cosr]);
    }
    ctx.strokeStyle = sq.color;
    ctx.globalAlpha = sq.alpha;
    ctx.lineWidth = Math.max(1, sq.width * M);
    ctx.lineJoin = "miter";
    ctx.beginPath();
    // Walk the four edges; each edge carries four interior points nudged
    // perpendicular by the seeded wobble, so the line trembles like a
    // hand-drawn one while the corners stay decided.
    for (i = 0; i < 4; i++) {
      var a = corners[i], b = corners[(i + 1) % 4];
      var dx = b[0] - a[0], dy = b[1] - a[1];
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / len, ny = dx / len;
      if (i === 0) ctx.moveTo(a[0], a[1]);
      for (j = 1; j <= 4; j++) {
        var p = j / 5;
        var off = (j === 5 ? 0 : sq.wob[i * 4 + (j - 1)] * size);
        ctx.lineTo(a[0] + dx * p + nx * off, a[1] + dy * p + ny * off);
      }
      ctx.lineTo(b[0], b[1]);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawLeft() {
    var M = Math.min(W, H);
    ctx.fillStyle = L_GROUND;
    ctx.fillRect(0, 0, W, H);
    var i, st;
    ctx.lineCap = "round";
    for (i = 0; i < ART.strokes.length; i++) {
      st = ART.strokes[i];
      ctx.strokeStyle = st.color;
      ctx.globalAlpha = st.alpha;
      ctx.lineWidth = Math.max(1, st.width * M);
      ctx.beginPath();
      ctx.moveTo(st.x0 * W, st.y0 * H);
      ctx.bezierCurveTo(st.x1 * W, st.y1 * H, st.x2 * W, st.y2 * H, st.x3 * W, st.y3 * H);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (i = 0; i < ART.squares.length; i++) drawSquare(ART.squares[i], M);
  }

  function drawRight() {
    ctx.fillStyle = R_GROUND;
    ctx.fillRect(0, 0, W, H);
    // The lattice: exact, unjittered, brick-offset, the same field as
    // Thirty Centimeters. Pitch derives from the frame's smaller
    // dimension; the interval is the constant.
    var P = Math.min(W, H) / 5.4;
    var S = P * 0.5;
    var cx = W / 2, cy = H / 2;
    for (var r = 0; r < 4; r++) {
      for (var c = 0; c < 4; c++) {
        var i = r * 4 + c;
        var x = cx + (c - (r % 2 === 0 ? 1.75 : 1.25)) * P;
        var y = cy + (r - 1.5) * P;
        drawImprint(x, y, S, IMPRINTS[i]);
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    currentT = t;
    if (W === 0) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    var wx = wipeFxAt(t) * W;

    // The 1965 painting, full-frame, clipped to the left of the line.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, wx, H);
    ctx.clip();
    drawLeft();
    ctx.restore();

    // The 1966 grid, full-frame, clipped to the right of the line.
    ctx.save();
    ctx.beginPath();
    ctx.rect(wx, 0, W - wx, H);
    ctx.clip();
    drawRight();
    ctx.restore();

    ctx.globalAlpha = 1;
  }

  resize();
  draw(0);

  // The loop is anchored at load: frame one is the synchronous draw above
  // at t = 0 with the seam centred, and the animation is elapsed-since-
  // load on the same timeline the drag samples are recorded against.
  // Never a wall clock.
  if (typeof requestAnimationFrame === "function") {
    var start = null;
    var tick = function (now) {
      if (start === null) start = now;
      draw((now - start) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
