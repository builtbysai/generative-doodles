<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploded Cabin</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FFF6E8;
  }
  canvas {
    display: block;
    margin: 0;
    padding: 0;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Palette (strict and complete): cream struts, five pane colors,
  // and the warm glow that is also the page ground and the margins.
  var CREAM = '#F1EAD9';
  var GLOW = '#FFF6E8';
  var PANES = ['#D63B2F', '#E87B2A', '#E8B62A', '#2F6BC0', '#7A4FB0'];
  var PANE_ALPHA = 0.55;

  var CHAMBERS = 6;        // nested frames, near (0) to far (5)
  var DRIFT_PERIOD = 50;   // seconds, watch-only in-and-out drift
  var DRIFT_AMP = 0.30;    // how deep the idle drift travels
  var SPRING_TAU = 1.15;   // seconds, settle-back spring constant

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var r = Math.imul(a ^ (a >>> 15), 1 | a);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Chamber layout (precomputed, seeded, size-independent) ----
  // Base perspective scale per chamber: geometric falloff toward the
  // vanishing point at frame center.
  var baseScale = [];
  for (var bi = 0; bi < CHAMBERS; bi++) baseScale.push(Math.pow(0.70, bi));

  // Each chamber is a 2 x 3 grid of cells. A seeded subset of cells
  // carries a flat translucent pane; the rest stay open so the eye
  // travels through. Colors rotate through the five-color cycle with
  // a per-chamber offset, so no two adjacent chambers repeat a layout
  // of hues. All fractions are of the chamber's inner rect.
  var COLS = 2, ROWS = 3;
  var layouts = [];
  (function buildLayouts() {
    var rnd = mulberry32(786013);
    for (var c = 0; c < CHAMBERS; c++) {
      var cells = [];
      var i, filled = 0;
      for (i = 0; i < COLS * ROWS; i++) {
        var on = rnd() < 0.62;
        cells.push(on);
        if (on) filled++;
      }
      // Keep every chamber between 3 and 5 panes: never a wall,
      // never an empty frame.
      i = 0;
      while (filled < 3) {
        if (!cells[i % cells.length]) { cells[i % cells.length] = true; filled++; }
        i++;
      }
      i = 0;
      while (filled > 5) {
        if (cells[i % cells.length]) { cells[i % cells.length] = false; filled--; }
        i++;
      }
      var order = [];
      for (i = 0; i < COLS * ROWS; i++) order.push(i);
      for (i = order.length - 1; i > 0; i--) {
        var j = Math.floor(rnd() * (i + 1));
        var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
      }
      var colorOf = {};
      var k = 0;
      for (i = 0; i < order.length; i++) {
        if (cells[order[i]]) {
          colorOf[order[i]] = PANES[(c + k) % PANES.length];
          k++;
        }
      }
      layouts.push({ cells: cells, colorOf: colorOf });
    }
  })();

  // ---- Viewport ----
  var viewW = 0;
  var viewH = 0;
  var isPhone = false;

  function measure() {
    var vv = window.visualViewport;
    viewW = vv ? vv.width : window.innerWidth;
    viewH = vv ? vv.height : window.innerHeight;
    var sw = window.screen ? window.screen.width : viewW;
    var sh = window.screen ? window.screen.height : viewH;
    isPhone = Math.min(sw, sh) < 700 || viewH > viewW * 1.15;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---- Interaction timeline --------------------------------------
  // z (depth), ox and oy (viewpoint shift, unit fractions) are pure
  // functions of t and of the recorded pointer phases. A phase is
  // either a drag (pointer samples, linearly interpolated) or a free
  // phase (release point + critically damped spring decay back to
  // the idle drift). Before the first phase, the idle drift rules.
  // Nothing is frame-integrated state.
  var phases = [];
  var dragging = false;
  var dragStart = null; // {t, x, y, z, ox, oy}
  var lastT = 0;

  function driftZ(t) {
    return DRIFT_AMP * (0.5 - 0.5 * Math.cos(2 * Math.PI * t / DRIFT_PERIOD));
  }
  function spring(u) {
    if (u <= 0) return 1;
    return (1 + u / SPRING_TAU) * Math.exp(-u / SPRING_TAU);
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function phaseAt(t) {
    var found = null;
    for (var i = 0; i < phases.length; i++) {
      if (phases[i].t0 <= t) found = phases[i];
      else break;
    }
    return found;
  }

  function stateAt(t) {
    var ph = phaseAt(t);
    if (!ph) return { z: driftZ(t), ox: 0, oy: 0 };
    if (ph.kind === 'drag') {
      var s = ph.samples;
      if (t <= s[0].t) return { z: s[0].z, ox: s[0].ox, oy: s[0].oy };
      for (var i = 1; i < s.length; i++) {
        if (t <= s[i].t) {
          var a = s[i - 1], b = s[i];
          var f = (b.t - a.t) > 0 ? (t - a.t) / (b.t - a.t) : 1;
          return {
            z: a.z + (b.z - a.z) * f,
            ox: a.ox + (b.ox - a.ox) * f,
            oy: a.oy + (b.oy - a.oy) * f
          };
        }
      }
      var last = s[s.length - 1];
      return { z: last.z, ox: last.ox, oy: last.oy };
    }
    // free phase: spring back toward the idle drift / center
    var u = t - ph.t0;
    var k = spring(u);
    return {
      z: driftZ(t) + (ph.z - driftZ(ph.t0)) * k,
      ox: ph.ox * k,
      oy: ph.oy * k
    };
  }

  function pointerPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : null;
    var x = (typeof e.clientX === 'number') ? e.clientX : 0;
    var y = (typeof e.clientY === 'number') ? e.clientY : 0;
    if (r) { x -= r.left; y -= r.top; }
    return { x: x, y: y };
  }

  function onDown(e) {
    var p = pointerPos(e);
    var st = stateAt(lastT);
    dragging = true;
    dragStart = { t: lastT, x: p.x, y: p.y, z: st.z, ox: st.ox, oy: st.oy };
    phases.push({
      kind: 'drag', t0: lastT,
      samples: [{ t: lastT, z: st.z, ox: st.ox, oy: st.oy }]
    });
    if (e.preventDefault) e.preventDefault();
  }

  function dragSample(p) {
    var ph = phases[phases.length - 1];
    if (!ph || ph.kind !== 'drag') return;
    var z = clamp(dragStart.z + (p.y - dragStart.y) / (0.6 * viewH), 0, 1);
    var ox = clamp(dragStart.ox + (p.x - dragStart.x) / (0.5 * viewW), -1, 1);
    var oy = clamp(dragStart.oy + (p.y - dragStart.y) / (0.5 * viewH), -1, 1);
    ph.samples.push({ t: lastT, z: z, ox: ox, oy: oy });
    if (ph.samples.length > 240) ph.samples.splice(1, 1);
  }

  function onMove(e) {
    if (!dragging) return;
    dragSample(pointerPos(e));
  }

  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    if (typeof e.clientX === 'number') dragSample(pointerPos(e));
    var st = stateAt(lastT);
    phases.push({ kind: 'free', t0: lastT, z: st.z, ox: st.ox, oy: st.oy });
    dragStart = null;
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---- Drawing ----
  function drawChamber(idx, cx, cy, w, h) {
    var strut = clamp(0.045 * h, 2.5, 26);
    var innerX = cx - w / 2 + strut;
    var innerY = cy - h / 2 + strut;
    var innerW = w - strut * 2;
    var innerH = h - strut * 2;
    if (innerW <= 0 || innerH <= 0) return;
    var layout = layouts[idx];
    var cellW = innerW / COLS;
    var cellH = innerH / ROWS;
    var gap = Math.min(0.16 * cellW, 0.16 * cellH, strut * 0.55);

    // Panes: flat translucent fills, nothing else.
    ctx.globalAlpha = PANE_ALPHA;
    for (var i = 0; i < COLS * ROWS; i++) {
      if (!layout.cells[i]) continue;
      var col = i % COLS;
      var row = Math.floor(i / COLS);
      ctx.fillStyle = layout.colorOf[i];
      ctx.fillRect(
        innerX + col * cellW + gap / 2,
        innerY + row * cellH + gap / 2,
        cellW - gap,
        cellH - gap
      );
    }
    ctx.globalAlpha = 1;

    // Struts and mullions: cream bands over the pane edges.
    ctx.fillStyle = CREAM;
    ctx.fillRect(cx - w / 2, cy - h / 2, w, strut);              // top
    ctx.fillRect(cx - w / 2, cy + h / 2 - strut, w, strut);      // bottom
    ctx.fillRect(cx - w / 2, cy - h / 2, strut, h);              // left
    ctx.fillRect(cx + w / 2 - strut, cy - h / 2, strut, h);      // right
    var mull = Math.max(1.5, strut * 0.38);
    for (var m = 1; m < COLS; m++) {
      ctx.fillRect(innerX + m * cellW - mull / 2, innerY, mull, innerH);
    }
    for (var n = 1; n < ROWS; n++) {
      ctx.fillRect(innerX, innerY + n * cellH - mull / 2, innerW, mull);
    }
  }

  function draw(t) {
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';

    ctx.fillStyle = GLOW;
    ctx.fillRect(0, 0, viewW, viewH);

    var st = stateAt(t);
    var cx = viewW * 0.5;
    var cy = viewH * 0.5;
    var maxW = viewW * (isPhone ? 0.94 : 0.88);
    var maxH = viewH * (isPhone ? 0.90 : 0.86);

    // Far-end glow: layered warm ellipses at the vanishing point,
    // drawn under the chambers so the stacked panes light up
    // against it as the depth saturates.
    var glowR = Math.min(maxW, maxH) * 0.30;
    ctx.fillStyle = GLOW;
    for (var g = 5; g >= 1; g--) {
      ctx.globalAlpha = 0.14;
      ctx.beginPath();
      ctx.ellipse(cx, cy, glowR * g / 5, glowR * g / 5 * 0.82, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Chambers, far to near, so nearer frames composite over the
    // deeper ones and the corridor saturates toward the center.
    // Depth z grows every chamber; near chambers grow fastest and
    // slide past, far chambers approach. Viewpoint shift parallaxes
    // near chambers most.
    var deepW = 0, deepH = 0;
    for (var idx = CHAMBERS - 1; idx >= 0; idx--) {
      var s = baseScale[idx];
      var eff = s * (1 + st.z * 1.9 * (1.25 - s));
      var w = maxW * eff;
      var h = maxH * eff;
      var ox = -st.ox * 0.06 * viewW * s;
      var oy = -st.oy * 0.04 * viewH * s;
      drawChamber(idx, cx + ox, cy + oy, w, h);
      if (idx === CHAMBERS - 1) { deepW = w; deepH = h; }
      if (idx === CHAMBERS - 2) {
        // Far-end light: once the two deepest chambers are down,
        // lay a soft warm glow over them so the corridor's end
        // reads lit before the nearer chambers composite over it.
        var gr = Math.min(deepW, deepH) * 0.52;
        ctx.fillStyle = GLOW;
        for (var q = 3; q >= 1; q--) {
          ctx.globalAlpha = 0.10;
          ctx.beginPath();
          ctx.ellipse(cx, cy, gr * q / 3, gr * q / 3 * 0.82, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }
  }

  function resize() {
    measure();
    draw(lastT);
  }

  measure();
  draw(0);

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  var startMs = null;
  if (typeof window.requestAnimationFrame === 'function') {
    var frame = function (ts) {
      if (startMs === null) startMs = ts;
      lastT = (ts - startMs) / 1000;
      if (lastT < 0) lastT = 0;
      draw(lastT);
      window.requestAnimationFrame(frame);
    };
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
