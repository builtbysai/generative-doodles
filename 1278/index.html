<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Mended Heart</title>
<style>
html, body { margin: 0; padding: 0; background: #141112; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var HEART = '#8E1F2F';
  var WOUND = '#3A1215';
  var CREAM = '#F0E2C4';
  var ROSE = '#D97B8C';
  var GOLD = '#C99A3C';
  var GROUND = '#141112';
  var FLOSS = [CREAM, ROSE, GOLD];

  var W = 0, H = 0, S = 0, u = 0, cx = 0, cy = 0, dipY = 0, botY = 0;
  var gapMax = 0, tear = null; // tear: {ys:[], jx:[]}
  var lastT = 0;
  var userStitches = [];
  var dragging = false, prevX = 0, prevY = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function viewport() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return { w: w, h: h };
  }

  function isPhone() {
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : W;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : H;
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }

  function size() {
    var v = viewport();
    W = v.w; H = v.h;
    canvas.width = W; canvas.height = H;
    // Centered geometric piece: same shape on phones, slightly larger
    // relative to the narrow viewport; page ground is the piece color.
    S = Math.min(W, H) * (isPhone() ? 0.88 : 0.82);
    u = S / 2;
    cx = W / 2;
    cy = H * 0.52;
    dipY = cy - 0.52 * u;
    botY = cy + 1.05 * u;
    gapMax = 0.10 * S;
  }

  function build() {
    var rnd = mulberry32(1278);
    var N = 15, ys = [], jx = [];
    for (var i = 0; i < N; i++) {
      ys.push(dipY + (botY - dipY) * i / (N - 1));
      if (i === 0 || i === N - 1) jx.push(0);
      else jx.push((rnd() - 0.5) * 0.10 * u);
    }
    tear = { ys: ys, jx: jx };
  }

  function tearX(y) {
    var ys = tear.ys, jx = tear.jx;
    if (y <= ys[0]) return jx[0];
    for (var i = 1; i < ys.length; i++) {
      if (y <= ys[i]) {
        var f = (y - ys[i - 1]) / (ys[i] - ys[i - 1]);
        return jx[i - 1] + (jx[i] - jx[i - 1]) * f;
      }
    }
    return jx[jx.length - 1];
  }

  function smooth(s) { return s * s * (3 - 2 * s); }

  // Heal phase, closed form over piece time. Period 44 s: close 0-30 s
  // (0 -> 0.82), hold 30-34 s, ease open 34-44 s. Never fully closed.
  function healAt(t) {
    var p = ((t % 44) + 44) % 44;
    if (p < 30) return 0.82 * smooth(p / 30);
    if (p < 34) return 0.82;
    return 0.82 * (1 - smooth((p - 34) / 10));
  }

  function halfPath(s, g) {
    var sh = s * g / 2;
    ctx.beginPath();
    ctx.moveTo(cx + sh, dipY);
    ctx.bezierCurveTo(cx - 0.55 * s * u + sh, cy - 0.95 * u,
                      cx - 1.02 * s * u + sh, cy - 0.55 * u,
                      cx - 0.98 * s * u + sh, cy - 0.12 * u);
    ctx.bezierCurveTo(cx - 0.95 * s * u + sh, cy + 0.45 * u,
                      cx - 0.45 * s * u + sh, cy + 0.95 * u,
                      cx + sh, botY);
    for (var i = tear.ys.length - 1; i >= 0; i--) {
      ctx.lineTo(cx + tear.jx[i] + sh, tear.ys[i]);
    }
    ctx.closePath();
  }

  function dot(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function stipple(s, g, rnd) {
    ctx.save();
    halfPath(s, g);
    ctx.clip();
    var n = 70, r0 = Math.max(1, S / 720);
    for (var i = 0; i < n; i++) {
      var x = cx - 1.05 * u + rnd() * 2.10 * u;
      var y = dipY + rnd() * (botY - dipY);
      var r = r0 * (0.8 + rnd() * 1.4);
      ctx.fillStyle = (i % 2 === 0) ? 'rgba(0,0,0,0.10)' : 'rgba(255,240,220,0.08)';
      dot(x, y, r);
    }
    ctx.restore();
  }

  function drawStitch(y, g, color, type, p) {
    var ext = 0.03 * u;
    var lx = cx + tearX(y) - g / 2 - ext;
    var rx = cx + tearX(y) + g / 2 + ext;
    var hs = 0.09 * u;
    var lw = Math.max(3, 0.012 * S);
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (type === 0) {
      // X-stitch: two diagonals, grown from their midpoints by p.
      var segs = [
        [lx, y - hs, rx, y + hs],
        [lx, y + hs, rx, y - hs]
      ];
      for (var i = 0; i < 2; i++) {
        var a = segs[i];
        var mx = (a[0] + a[2]) / 2, my = (a[1] + a[3]) / 2;
        ctx.beginPath();
        ctx.moveTo(mx + (a[0] - mx) * p, my + (a[1] - my) * p);
        ctx.lineTo(mx + (a[2] - mx) * p, my + (a[3] - my) * p);
        ctx.stroke();
      }
    } else {
      // Running stitch: dashes revealed left to right by p.
      var total = rx - lx, nd = 5;
      var step = total / nd, dlen = step * 0.55;
      for (var j = 0; j < nd; j++) {
        var sx = lx + j * step;
        var ex = sx + dlen;
        var reveal = lx + total * p;
        if (sx >= reveal) break;
        if (ex > reveal) ex = reveal;
        ctx.beginPath();
        ctx.moveTo(sx, y);
        ctx.lineTo(ex, y);
        ctx.stroke();
      }
    }
  }

  function draw(t) {
    lastT = t;
    if (canvas.style) {
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
    }
    var hn = healAt(t);
    var g = gapMax * (1 - hn);
    if (typeof document !== 'undefined' && document.body) {
      document.body.style.background = GROUND;
    }

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Soft shadow pool beneath the heart.
    ctx.save();
    ctx.translate(cx, botY + 0.10 * u);
    ctx.scale(0.78 * u, 0.09 * u);
    ctx.beginPath();
    ctx.moveTo(1, 0);
    ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fill();
    ctx.restore();

    // Suspension threads from the top edge to the lobe tops.
    ctx.strokeStyle = CREAM;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    var th = [-1, 1];
    for (var k = 0; k < 2; k++) {
      var s = th[k];
      var ax = cx + s * 0.50 * u + s * g / 2;
      var ay = cy - 0.82 * u;
      ctx.beginPath();
      ctx.moveTo(ax, 0);
      ctx.quadraticCurveTo(ax, ay * 0.5 + 6, ax, ay);
      ctx.stroke();
    }

    // Heart halves.
    var rnd = mulberry32(1278);
    var halves = [-1, 1];
    for (var hi = 0; hi < 2; hi++) {
      var hs2 = halves[hi];
      halfPath(hs2, g);
      ctx.fillStyle = HEART;
      ctx.fill();
      stipple(hs2, g, rnd);
      halfPath(hs2, g);
      ctx.strokeStyle = 'rgba(30,8,10,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Wound edges: dark strips along the jagged tear on both halves.
    ctx.strokeStyle = WOUND;
    ctx.lineWidth = Math.max(4, 0.014 * S);
    ctx.lineJoin = 'round';
    for (var e = 0; e < 2; e++) {
      var sh2 = (e === 0 ? -1 : 1) * g / 2;
      ctx.beginPath();
      ctx.moveTo(cx + tear.jx[0] + sh2, tear.ys[0]);
      for (var i2 = 1; i2 < tear.ys.length; i2++) {
        ctx.lineTo(cx + tear.jx[i2] + sh2, tear.ys[i2]);
      }
      ctx.stroke();
    }

    // Base stitches: 7, spanning the tear, colours cycling cream/rose/gold.
    var fracs = [0.08, 0.22, 0.36, 0.50, 0.64, 0.78, 0.90];
    for (var bi = 0; bi < fracs.length; bi++) {
      var by = dipY + (botY - dipY) * fracs[bi];
      drawStitch(by, g, FLOSS[bi % 3], bi % 2, 1);
    }

    // Visitor stitches, drawn in with a 0.6 s growth, then part of the loop.
    for (var ui = 0; ui < userStitches.length; ui++) {
      var st = userStitches[ui];
      var p = (t - st.t0) / 0.6;
      if (p > 1) p = 1;
      if (p < 0) p = 0;
      drawStitch(st.y, g, FLOSS[(fracs.length + ui) % 3], st.type, p);
    }
  }

  function pos(e) {
    if (typeof e.offsetX === 'number') return { x: e.offsetX, y: e.offsetY };
    var b = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: e.clientX - b.left, y: e.clientY - b.top };
  }

  function addStitch(y) {
    var lo = dipY + 0.05 * u, hi = botY - 0.05 * u;
    if (y < lo) y = lo;
    if (y > hi) y = hi;
    var type = userStitches.length % 2;
    userStitches.push({ y: y, t0: lastT, type: type });
    if (userStitches.length > 14) userStitches.shift();
  }

  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e);
    dragging = true; prevX = p.x; prevY = p.y;
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pos(e);
    if (dragging) {
      var crossed = (prevX - cx) * (p.x - cx) < 0;
      if (crossed && p.y > dipY - 10 && p.y < botY + 10) addStitch(p.y);
    }
    prevX = p.x; prevY = p.y;
  });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); build(); draw(lastT); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { size(); build(); draw(lastT); });
    }
  }

  size();
  build();
  draw(0); // Boot flag: frame one is exactly t = 0, never wall-clock time.
  if (typeof requestAnimationFrame !== 'undefined') {
    var start = null;
    function loop(ts) {
      if (start === null) start = ts;
      draw((ts - start) / 1000);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
