<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№45 · Thirty Seconds</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,255,255,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scrub time</div>
<script>
'use strict';
// No45 Thirty Seconds (after mathiaskrissmer, prompt 10 via Bug).
// Seven points fly Lissajous paths in 3D, projected flat. Each
// leaves a luminous trail that fades over exactly 30 seconds, the
// length of the loop. Frequencies are integer ratios of the loop,
// so every path closes exactly and the trail that fades out is the
// trail that fades in: no seam. Positions are analytic in time, so
// the whole trail buffer (900 samples per point at 30 per second)
// is recomputed from the clock each frame, and a drag that scrubs
// time rebuilds it deterministically. White trails on black,
// nothing else drawn.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '45', 10) || 45;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#000000';
const LOOP = 30;
const SAMPLES = 900;

const rnd = mulberry32(seed);
const POINTS = Array.from({ length: 7 }, () => ({
  fx: 1 + ((rnd() * 4) | 0),
  fy: 1 + ((rnd() * 4) | 0),
  fz: 1 + ((rnd() * 3) | 0),
  px: rnd() * Math.PI * 2,
  py: rnd() * Math.PI * 2,
  pz: rnd() * Math.PI * 2,
  amp: 0.72 + rnd() * 0.24
}));

function posAt(P, t) {
  const u = t / LOOP * Math.PI * 2;
  const x = Math.sin(u * P.fx + P.px) * P.amp;
  const y = Math.sin(u * P.fy + P.py) * P.amp;
  const z = Math.sin(u * P.fz + P.pz) * P.amp;
  // fixed view tilt
  const tilt = 0.6, c = Math.cos(tilt), s = Math.sin(tilt);
  return [x, y * c - z * s, z];
}

let scrub = 0;
let dragInfo = null;
let holdPos = null, holdUntil = 0;

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  let tPos;
  if (dragInfo) tPos = dragInfo.pos;
  else if (holdPos != null && performance.now() / 1000 < holdUntil) tPos = holdPos;
  else tPos = ((nowMs / 1000 + scrub) % LOOP + LOOP) % LOOP;

  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) * 0.40;

  ctx.globalCompositeOperation = 'lighter';
  for (const P of POINTS) {
    // trail in age chunks for the alpha ramp
    const CH = 45;
    for (let s = 0; s < SAMPLES - 1; s += CH) {
      const ageMid = (s + CH / 2) / SAMPLES;
      const alpha = Math.pow(1 - ageMid, 1.6) * 0.75;
      if (alpha < 0.004) continue;
      ctx.strokeStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = Math.max(0.7, R * 0.004);
      ctx.beginPath();
      for (let k = s; k <= Math.min(SAMPLES - 1, s + CH); k++) {
        const tt = tPos - k / 30;
        const [x, y] = posAt(P, tt);
        const X = cx + x * R, Y = cy + y * R;
        if (k === s) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  return {};
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(14000);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function pointerX(ev) {
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0 };
  return ev.clientX - r.left;
}
function currentPos() {
  if (dragInfo) return dragInfo.pos;
  return ((performance.now() / 1000 + scrub) % LOOP + LOOP) % LOOP;
}
canvas.addEventListener('pointerdown', ev => {
  dragInfo = { x: pointerX(ev), startPos: currentPos(), pos: currentPos() };
  holdPos = null;
});
canvas.addEventListener('pointermove', ev => {
  if (!dragInfo) return;
  const [w, h] = viewportWH();
  const dx = pointerX(ev) - dragInfo.x;
  dragInfo.pos = (((dragInfo.startPos + (dx / Math.min(w, h)) * LOOP) % LOOP) + LOOP) % LOOP;
});
function endDrag() {
  if (!dragInfo) return;
  holdPos = dragInfo.pos;
  holdUntil = performance.now() / 1000 + 4;
  scrub = dragInfo.pos - performance.now() / 1000;
  dragInfo = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
