<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.230 Melt Together</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FDE98A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.230 Melt Together (Matthew Kluber). The ambiguity game, after
// his 2019 Friday I'm in Love: orange, yellow and teal thin lines
// above and below a central band whose pale ground carries fragmented
// teal-green and orange geometry. One slow diagonal wave of
// luminance crosses the panel every forty seconds or so, desynced
// from every painted edge, so edges seem to shift colour while the
// paint never moves. Which colours are painted and which are
// projected is deliberately undecidable. Subtlety is the point.
// Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var ORANGE = '#F5871F', YELLOW = '#FFC425', TEAL = '#1FB5A6', DEEP = '#0E7C72', BANDGROUND = '#FDE98A';
var W = 0, H = 0, phone = false;
var T = 13, lastNow = -1; // frame one: the wave partway across the panel

function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- painted stripes: one seeded stack over the whole panel height --------------
var DH = 300;
var stripes = [];
(function () {
  var rand = rng(230417), y = 0;
  var cyc = [ORANGE, YELLOW, TEAL, ORANGE, TEAL, YELLOW];
  var k = 0;
  while (y < DH) {
    var h = 4 + rand() * 7;
    stripes.push({ y: y, h: h, color: cyc[k % cyc.length] });
    k++;
    y += h;
  }
})();

// ---- band fragments: rows of broken teal-green and orange geometry --------------
var fragRows = [];
(function () {
  var rand = rng(230733);
  var rows = 5;
  for (var r = 0; r < rows; r++) {
    var segs = [], x = 0.02 + rand() * 0.03;
    while (x < 0.94) {
      var len = Math.min(0.05 + rand() * 0.13, 0.97 - x);
      var kind = rand();
      segs.push({ x: x, len: len, color: kind < 0.52 ? DEEP : ORANGE, tri: rand() < 0.22 });
      x += len + 0.02 + rand() * 0.05;
    }
    fragRows.push({ v: (r + 0.5) / rows, segs: segs });
  }
})();

function panel() {
  var pw = W * (phone ? 1 : 0.94);
  var ph = pw / 2;
  if (ph > H * 0.94) { ph = H * 0.94; pw = ph * 2; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
}
function bandRect(p) {
  var bh = p.h * 0.42;
  return { x: p.x + p.w * 0.10, y: p.y + (p.h - bh) / 2, w: p.w * 0.80, h: bh };
}

function drawStripes(p, y0, y1) {
  var sy = p.h / DH;
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, y0, p.w, y1 - y0); ctx.clip();
  for (var i = 0; i < stripes.length; i++) {
    ctx.fillStyle = stripes[i].color;
    ctx.fillRect(p.x, p.y + stripes[i].y * sy, p.w, Math.max(1, stripes[i].h * sy) + 0.5);
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = BANDGROUND;
  ctx.fillRect(0, 0, W, H);
  var p = panel();
  var b = bandRect(p);
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
  ctx.fillStyle = BANDGROUND;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  drawStripes(p, p.y, b.y);
  drawStripes(p, b.y + b.h, p.y + p.h);
  // the central band: pale ground, fragmented geometry, hard edges
  ctx.fillStyle = BANDGROUND;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  var rowH = b.h / fragRows.length;
  for (var r = 0; r < fragRows.length; r++) {
    var row = fragRows[r];
    var ry = b.y + r * rowH + rowH * 0.22, rh = rowH * 0.56;
    for (var s = 0; s < row.segs.length; s++) {
      var seg = row.segs[s];
      var sx = b.x + seg.x * b.w, sw = seg.len * b.w;
      ctx.fillStyle = seg.color;
      if (seg.tri) {
        ctx.beginPath();
        ctx.moveTo(sx, ry + rh);
        ctx.lineTo(sx + sw / 2, ry);
        ctx.lineTo(sx + sw, ry + rh);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(sx, ry, sw, rh);
      }
    }
  }
  ctx.strokeStyle = DEEP;
  ctx.lineWidth = Math.max(1.5, p.h * 0.006);
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  // the projection: one diagonal luminance wave, additive, kept quiet
  var ph = (T % 80) / 80;
  var tri = ph < 0.5 ? ph * 2 : 2 - 2 * ph;
  var ang = 25 * Math.PI / 180;
  var dx = Math.cos(ang), dy = Math.sin(ang);
  var off = (tri - 0.5) * 1.5 * p.w;
  var cx = p.x + p.w / 2 + dx * off, cy = p.y + p.h / 2 + dy * off;
  var bw = p.w * 0.55, diag = Math.hypot(p.w, p.h);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  var g = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
  g.addColorStop(0, 'rgba(255,248,225,0)');
  g.addColorStop(0.5, 'rgba(255,248,225,0.10)');
  g.addColorStop(1, 'rgba(255,248,225,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.fillRect(-bw / 2, -diag, bw, diag * 2);
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only, no labels, no chrome.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
