<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ordered State, Re-Ordered</title>
<style>
  html, body { margin: 0; padding: 0; background: #d8d2c8; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function round4(x) { return Math.round(x * 10000) / 10000; }

  var COLS = 6, ROWS = 4, N = COLS * ROWS;
  var TYPES = ['cup', 'key', 'spoon', 'button', 'stone', 'paper', 'thread'];
  var TYPE_FILL = {
    cup: '#f2ead8', key: '#8a8a8a', spoon: '#b8b8b8', button: '#e86a4a',
    stone: '#5a6a7a', paper: '#f2f2ee', thread: '#b84a1a'
  };
  var GROUND = '#d8d2c8', TRAY = '#8a7a64', SHADOW = '#6a5a44';

  var objects = [];
  var order = [];
  for (var i = 0; i < N; i++) {
    var rng = mulberry32(1447000 + i * 7919);
    objects.push({
      id: i, type: TYPES[i % TYPES.length],
      wob: [rng(), rng(), rng(), rng(), rng(), rng()],
      extraRot: (i === 7) ? 0.09 : 0,
      fromX: 0, fromY: 0, toX: 0, toY: 0, tweenStart: -10, tweenDur: 0.6,
      dragging: false, px: 0, py: 0
    });
    order.push(i);
  }

  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var minScreen = Math.min(window.screen.width, window.screen.height);
    phone = minScreen < 700 || (H > W * 1.15 && minScreen < 700);
    if (typeof window !== 'undefined' && window.screen) {
      phone = Math.min(window.screen.width, window.screen.height) < 700;
      if (!phone && H > W * 1.15) phone = false;
    }
  }
  size();

  function layout() {
    var margin = phone ? 14 : Math.max(48, Math.min(W, H) * 0.07);
    var trayW = W - margin * 2, trayH = H - margin * 2;
    var cellW = trayW / COLS, cellH = trayH / ROWS;
    return { margin: margin, trayW: trayW, trayH: trayH, cellW: cellW, cellH: cellH };
  }
  // Slot geometry. Row index 2 (the third row) is baked crooked: a small
  // rotation about the row centre plus a y offset, applied to every slot of
  // that row. This geometry is computed from constants on every call, so no
  // swap, tween or drag can ever straighten the row.
  function slotPos(slot, L) {
    var col = slot % COLS, row = (slot / COLS) | 0;
    var x = L.margin + col * L.cellW + L.cellW / 2;
    if (col >= 4) x += 14; // the one wider gap, after column 3
    var y = L.margin + row * L.cellH + L.cellH / 2;
    if (row === 2) {
      var cx = L.margin + L.trayW / 2;
      var dx = x - cx;
      var ang = 0.026; // ~1.5 degrees, visibly but slightly off-parallel
      x = cx + dx * Math.cos(ang);
      y = y + 6 + dx * Math.sin(ang);
    }
    return { x: x, y: y };
  }
  function slotOf(id) { return order.indexOf(id); }

  var nextSwapAt = 8, swapCount = 0;
  function swapPair(k) {
    var rng = mulberry32(1447000 + 100000 + k * 7919);
    var row = Math.floor(rng() * ROWS);
    var col = Math.floor(rng() * (COLS - 1));
    return [row * COLS + col, row * COLS + col + 1];
  }
  function applySwaps(t) {
    while (nextSwapAt <= t) {
      var pair = swapPair(swapCount);
      var a = order[pair[0]], b = order[pair[1]];
      var L = layout();
      var pa = slotPos(pair[0], L), pb = slotPos(pair[1], L);
      var oa = objects[a], ob = objects[b];
      // Each object tweens from its current drawn position to its new slot.
      var curA = posNow(oa, nextSwapAt, L), curB = posNow(ob, nextSwapAt, L);
      oa.fromX = curA.x; oa.fromY = curA.y; oa.toX = pb.x; oa.toY = pb.y;
      oa.tweenStart = nextSwapAt; oa.tweenDur = 0.6;
      ob.fromX = curB.x; ob.fromY = curB.y; ob.toX = pa.x; ob.toY = pa.y;
      ob.tweenStart = nextSwapAt; ob.tweenDur = 0.6;
      order[pair[0]] = b; order[pair[1]] = a;
      nextSwapAt += 8; swapCount++;
    }
  }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function posNow(o, t, L) {
    if (o.dragging) return { x: o.px, y: o.py };
    if (t >= o.tweenStart && t <= o.tweenStart + o.tweenDur) {
      var f = easeOut((t - o.tweenStart) / o.tweenDur);
      return { x: o.fromX + (o.toX - o.fromX) * f, y: o.fromY + (o.toY - o.fromY) * f };
    }
    return slotPos(slotOf(o.id), L);
  }
  function posAt(o, t, L) {
    var p = posNow(o, t, L);
    var ph = o.wob[0] * Math.PI * 2;
    return {
      x: p.x + Math.sin(t * 0.9 + ph) * 0.6,
      y: p.y + Math.cos(t * 0.7 + ph) * 0.6
    };
  }

  function wobPoly(o, r, npts) {
    var pts = [];
    for (var i = 0; i < npts; i++) {
      var a = (i / npts) * Math.PI * 2;
      var rr = r * (1 + (o.wob[i % o.wob.length] - 0.5) * 0.22);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    return pts;
  }
  function trace(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  function disc(x, y, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function drawObject(o, x, y, s, t) {
    var fill = TYPE_FILL[o.type];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(o.extraRot + (o.wob[1] - 0.5) * 0.06);
    ctx.scale(s, s);
    ctx.fillStyle = SHADOW;
    ctx.globalAlpha = round4(0.18);
    ctx.fillRect(-s * 0 + -22, 20, 44, 5);
    ctx.globalAlpha = 1;
    var u = Math.min(30, 30);
    if (o.type === 'cup') {
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.moveTo(-20, -14); ctx.lineTo(20, -14); ctx.lineTo(14, 18); ctx.lineTo(-14, 18);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = SHADOW; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(20, -8); ctx.arc(26, 0, 8, -Math.PI / 2, Math.PI / 2); ctx.stroke();
      ctx.fillStyle = '#d8c8a8'; ctx.fillRect(-20, -14, 40, 3);
    } else if (o.type === 'key') {
      ctx.fillStyle = fill;
      ctx.fillRect(-22, -3, 34, 6);
      ctx.fillRect(8, 3, 4, 8); ctx.fillRect(16, 3, 4, 8);
      ctx.strokeStyle = fill; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-22, 0); ctx.arc(-28, 0, 8, 0, Math.PI * 2); ctx.stroke();
    } else if (o.type === 'spoon') {
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.ellipse(0, -14, 10, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(-2.5, -2, 5, 28);
    } else if (o.type === 'button') {
      trace(wobPoly(o, 19, 12));
      ctx.fillStyle = fill; ctx.fill();
      ctx.fillStyle = SHADOW;
      disc(-5, -5, 2.2, SHADOW); disc(5, -5, 2.2, SHADOW);
      disc(-5, 5, 2.2, SHADOW); disc(5, 5, 2.2, SHADOW);
    } else if (o.type === 'stone') {
      trace(wobPoly(o, 20, 9));
      ctx.fillStyle = fill; ctx.fill();
    } else if (o.type === 'paper') {
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.moveTo(-20, -15); ctx.lineTo(14, -15); ctx.lineTo(20, -9);
      ctx.lineTo(20, 15); ctx.lineTo(-20, 15); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c8c0b0';
      ctx.beginPath(); ctx.moveTo(14, -15); ctx.lineTo(20, -9); ctx.lineTo(14, -9); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#a89a80'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-14, -4); ctx.lineTo(10, -4); ctx.moveTo(-14, 4); ctx.lineTo(6, 4); ctx.stroke();
    } else if (o.type === 'thread') {
      ctx.strokeStyle = fill; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (var r = 4; r <= 18; r += 5) {
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.arc(0, 0, r, 0, Math.PI * 1.6);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(30, -8); ctx.stroke();
    }
    ctx.restore();
  }

  function draw(t) {
    size();
    var L = layout();
    applySwaps(t);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    // Tray: plain ground panel with a tray line, nothing outside it.
    ctx.fillStyle = '#cfc8bc';
    ctx.fillRect(L.margin - 8, L.margin - 8, L.trayW + 16, L.trayH + 16);
    ctx.strokeStyle = TRAY; ctx.lineWidth = 2;
    ctx.strokeRect(L.margin - 8, L.margin - 8, L.trayW + 16, L.trayH + 16);
    var cell = Math.min(L.cellW, L.cellH);
    var s = cell / 84;
    for (var i = 0; i < N; i++) {
      var o = objects[order[i]];
      if (o.dragging) continue;
      var p = posAt(o, t, L);
      drawObject(o, p.x, p.y, s, t);
    }
    // Dragged object last, lifted, with a soft flat shadow.
    for (var j = 0; j < N; j++) {
      var d = objects[j];
      if (!d.dragging) continue;
      ctx.fillStyle = SHADOW;
      ctx.globalAlpha = round4(0.22);
      ctx.fillRect(d.px - 24, d.py + 22, 48, 6);
      ctx.globalAlpha = 1;
      drawObject(d, d.px, d.py - 4, s * 1.12, t);
    }
  }

  var drag = null;
  function evPos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }
  function nearestObj(p, t) {
    var L = layout(), best = null, bestD = 1e9;
    for (var i = 0; i < N; i++) {
      var o = objects[i];
      var q = posAt(o, t, L);
      var d = Math.hypot(q.x - p.x, q.y - p.y);
      if (d < bestD) { bestD = d; best = o; }
    }
    return bestD < 44 ? best : null;
  }
  function nearestSlot(p, L) {
    var best = 0, bestD = 1e9;
    for (var s = 0; s < N; s++) {
      var q = slotPos(s, L);
      var d = Math.hypot(q.x - p.x, q.y - p.y);
      if (d < bestD) { bestD = d; best = s; }
    }
    return best;
  }
  var lastT = 0;
  canvas.addEventListener('pointerdown', function (e) {
    var p = evPos(e);
    var o = nearestObj(p, lastT);
    if (!o) return;
    drag = o;
    o.dragging = true; o.px = p.x; o.py = p.y;
    if (e.preventDefault) e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = evPos(e);
    drag.px = p.x; drag.py = p.y;
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!drag) return;
    var p = evPos(e);
    var L = layout();
    var slot = nearestSlot(p, L);
    var o = drag;
    o.dragging = false;
    var oldSlot = slotOf(o.id);
    order.splice(oldSlot, 1);
    order.splice(slot, 0, o.id);
    var dest = slotPos(slot, L);
    o.fromX = p.x; o.fromY = p.y; o.toX = dest.x; o.toY = dest.y;
    o.tweenStart = lastT; o.tweenDur = 0.6;
    drag = null;
  });

  // Frame one is a constant phase: draw(0) synchronously at load.
  draw(0);

  var t0 = -1;
  function loop(ts) {
    if (t0 < 0) t0 = ts;
    lastT = (ts - t0) / 1000;
    draw(lastT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: function (t) { lastT = t; draw(t); },
      order: function () { return order.slice(); },
      slotPos: function (s) { return slotPos(s, layout()); },
      objects: objects,
      layout: layout
    };
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(lastT); });
    }
  }
})();
</script>
</body>
</html>
