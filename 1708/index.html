<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interloper</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EEE6; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F2EEE6';
var PLATE = '#17120F';
var PLATE_LINE = 'rgba(217,30,30,0.55)';
var TITLE_INK = '#F2EEE6';
var HINT_INK = '#E8A49A';
var RED = '#D91E1E';
var WHITE = '#F2EEE6';
var BLACK = '#17120F';
var IRID = ['#BFE8E0', '#C9B8F0', '#F0D9A0'];
var BANDS = 15;
var PERIOD = 24;
var FRAME_T = 6.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- seeded 1D value noise / fbm ---- */
function hash1(n) {
  var h = Math.imul(n | 0, 0x27D4EB2D) ^ 0x9E3779B9;
  h = Math.imul(h ^ (h >>> 15), 0x85EBCA6B);
  h = h ^ (h >>> 13);
  return ((h >>> 0) / 4294967296);
}
function vnoise(x) {
  var i = Math.floor(x), f = x - i;
  var a = hash1(i), b = hash1(i + 1);
  return a + (b - a) * smooth(f);
}
function fbm1(x) {
  var v = 0, amp = 0.5, f = 1, o;
  for (o = 0; o < 4; o++) { v += amp * vnoise(x * f); f *= 2.03; amp *= 0.5; }
  return v;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1708);
/* seeded grain dots, fixed positions in stage space */
var grain = [];
var gi;
for (gi = 0; gi < 420; gi++) {
  grain.push({ x: rng(), y: rng(), r: 0.6 + rng() * 1.4, a: 0.04 + rng() * 0.07 });
}
/* seeded texture-line offsets per band */
var texOff = [];
var ti;
for (ti = 0; ti < BANDS; ti++) {
  texOff.push([0.28 + rng() * 0.12, 0.62 + rng() * 0.12]);
}
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- ribbon centerline, in stage coords ---- */
function ribBaseY(u, sh) {
  var drift = 0.03 * sh * Math.sin(TAU * phaseT / PERIOD + 0.7);
  var amp = 1 + 0.22 * Math.sin(TAU * phaseT / PERIOD);
  var wander = 0.07 * sh * amp * (fbm1(u * 3.1 + phaseT * 0.02) - 0.5) * 2;
  var sine = 0.045 * sh * Math.sin(TAU * 1.5 * u + 1.2 + phaseT * 0.05);
  return sh * (0.30 + 0.38 * u) + wander + sine + drift;
}
function ribWidth(sh) {
  return sh * 0.052 * (1 + 0.12 * Math.sin(TAU * phaseT / 18));
}
function ribSlope(u, sh) {
  var e = 0.004;
  return (ribBaseY(Math.min(1, u + e), sh) - ribBaseY(Math.max(0, u - e), sh)) / (2 * e * sh);
}
/* distance from a stage point to the ribbon centerline (ribbon is a function of x) */
function ribDist(x, y, st) {
  var u = clamp((x - st.x) / st.w, 0, 1);
  var ry = st.y + ribBaseY(u, st.h);
  var sl = ribSlope(u, st.h);
  return (y - ry) / Math.sqrt(1 + sl * sl);
}
/* vertical displacement of a band point near the ribbon: bands are pushed away,
   with a slow traveling wake ripple so they reform behind the ribbon */
function bandDisp(x, y, st) {
  var d = ribDist(x, y, st);
  var sig = st.h * 0.075;
  var fall = Math.exp(-(d * d) / (sig * sig));
  var u = clamp((x - st.x) / st.w, 0, 1);
  var wake = 1 + 0.25 * Math.sin(TAU * (u - phaseT / PERIOD) * 2);
  var amp = st.h * 0.034 * wake;
  return (d >= 0 ? 1 : -1) * amp * fall;
}
/* distorted band edge y at stage x, before displacement */
function edgeY(i, x, st) {
  var u = (x - st.x) / st.w;
  var base = st.y + (i / BANDS) * st.h;
  var wob = st.h * 0.011 * (fbm1(u * 5.2 + i * 1.37) - 0.5) * 2
          + st.h * 0.005 * Math.sin(TAU * 2.3 * u + i * 0.9);
  return base + wob;
}
var BAND_COLS = [RED, WHITE, BLACK];
var TEX_COLS = ['#8F0F0F', '#C9C2B2', '#4A4038'];
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var sw = st.w, sh = st.h;
  var NX = 160;
  var i, k, s, x, y;
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, sw, sh);
  ctx.clip();
  /* ---- bands: distorted stripe function, edges displaced near the ribbon ---- */
  for (i = 0; i < BANDS; i++) {
    ctx.beginPath();
    for (s = 0; s <= NX; s++) {
      x = st.x + s / NX * sw;
      y = edgeY(i, x, st) + bandDisp(x, edgeY(i, x, st), st);
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    for (s = NX; s >= 0; s--) {
      x = st.x + s / NX * sw;
      y = edgeY(i + 1, x, st) + bandDisp(x, edgeY(i + 1, x, st), st);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = BAND_COLS[i % 3];
    ctx.fill();
    /* internal texture: two faint wavy lines inside the band, following the same field */
    for (k = 0; k < 2; k++) {
      var f0 = texOff[i][k];
      ctx.beginPath();
      for (s = 0; s <= NX; s++) {
        x = st.x + s / NX * sw;
        var yt = edgeY(i, x, st) * (1 - f0) + edgeY(i + 1, x, st) * f0;
        y = yt + bandDisp(x, yt, st);
        if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.lineWidth = Math.max(0.75, sh * 0.0012);
      ctx.strokeStyle = rgba(TEX_COLS[i % 3], 0.35);
      ctx.stroke();
    }
  }
  /* grain speckle, fixed seeded positions */
  for (gi = 0; gi < grain.length; gi++) {
    var gx = st.x + grain[gi].x * sw;
    var gy = st.y + grain[gi].y * sh;
    ctx.fillStyle = 'rgba(23,18,15,' + grain[gi].a.toFixed(4) + ')';
    ctx.beginPath();
    ctx.arc(gx, gy, grain[gi].r, 0, TAU);
    ctx.fill();
  }
  /* ---- ribbon: thick noise-driven curve over the bands ---- */
  var w = ribWidth(sh);
  var NP = 200;
  var pts = [];
  for (s = 0; s <= NP; s++) {
    var u = s / NP;
    pts.push({ x: st.x - 8 + u * (sw + 16), y: st.y + ribBaseY(u, sh) });
  }
  function strokePts(offset, lw, style) {
    ctx.beginPath();
    var p, q, dx, dy, len, nx, ny;
    for (p = 0; p <= NP; p++) {
      q = pts[Math.min(NP, p + 1)];
      var pr = pts[Math.max(0, p - 1)];
      dx = q.x - pr.x; dy = q.y - pr.y;
      len = Math.sqrt(dx * dx + dy * dy) || 1;
      nx = -dy / len; ny = dx / len;
      var px = pts[p].x + nx * offset, py = pts[p].y + ny * offset;
      if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.lineWidth = lw;
    ctx.strokeStyle = style;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  /* iridescent halo just outside the ribbon body */
  strokePts(0, w + 7, 'rgba(201,184,240,0.20)');
  strokePts(0, w + 3, 'rgba(191,232,224,0.22)');
  /* ribbon body */
  strokePts(0, w, BLACK);
  /* marbled inner veins, offset from the centerline */
  strokePts(-w * 0.22, Math.max(1, w * 0.045), 'rgba(217,30,30,0.55)');
  strokePts(w * 0.18, Math.max(1, w * 0.035), 'rgba(242,238,230,0.28)');
  strokePts(-w * 0.05, Math.max(1, w * 0.03), 'rgba(74,64,56,0.6)');
  /* thin iridescent edge lines hugging both ribbon edges */
  strokePts(-w / 2 + 1.5, Math.max(1.25, w * 0.03), rgba(IRID[0], 0.75));
  strokePts(w / 2 - 1.5, Math.max(1.25, w * 0.03), rgba(IRID[1], 0.65));
  strokePts(-w / 2 + 4, Math.max(1, w * 0.02), rgba(IRID[2], 0.5));
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Interloper').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Interloper').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 15').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Interloper', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 15', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the ribbon cross.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    bandCount: function () { return BANDS; },
    ribbonWidth: function () { var st = stageRect(); return ribWidth(st.h); },
    displacementAt: function (fx, fy) {
      var st = stageRect();
      return bandDisp(st.x + fx * st.w, st.y + fy * st.h, st);
    },
    ribbonYAt: function (fu) { var st = stageRect(); return ribBaseY(fu, st.h) / st.h; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed pre-roll t = 6s ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
