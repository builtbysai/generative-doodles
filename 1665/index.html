<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Pursuit, Pentagons</title>
<style>
html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
/* Palette: the silver-on-black inverse. The paper-white run was
   built and rendered first, but its #F2F2EE threadlines on paper
   were unreadable at thumb size (faint hairlines, no flower), so
   this run uses the prompt's own inverse instead: silver lines on
   black, agents as bright dots. One palette, no mixing. */
var GROUND = '#0e0e0d';
var LINE = [201, 201, 194];
var AGENT = '#f2f2ee';
var PLATE = '#1e1e1b';
var PLATE_EDGE = 'rgba(237,237,230,0.35)';
var INK = '#edede6';
var INK_SOFT = 'rgba(237,237,230,0.8)';
/* The chase, closed form. n agents start on the vertices of a regular
   n-gon of radius R and each moves at constant speed toward the next.
   By symmetry the agents always form a regular n-gon: at chase
   progress u in [0,1) the radius is R*(1-u) and the whole figure has
   rotated by -cot(pi/n)*ln(1-u). Speed checks out exactly: radial
   component -v*sin(pi/n), tangential v*cos(pi/n), total v, aimed at
   the next vertex. No frame integration anywhere, so any frame is a
   pure function of piece time. */
var CYCLES = [3, 4, 5, 6, 7, 8];
var CHASE = 8.0;
var HOLD = 1.2;
var CYCLE = CHASE + HOLD;
var SAMPLES = 200;
/* Fixed rotation per polygon, so each chase opens at its own angle. */
var ROT = { 3: 0.0, 4: 0.5, 5: 0.9, 6: 0.2, 7: 1.1, 8: 0.65 };
/* Frame one is a developed pentagon rosette: piece time 0 lands in
   the n=5 cycle at 62% of its chase, so the timeline is offset by
   two full cycles plus 4.96 s of the pentagon chase. */
var OFFSET = 2 * CYCLE + 0.62 * CHASE;
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* Piece time t maps onto the repeating 3..8 cycle. Returns the
   polygon side count, the chase progress u (1 once closed), and the
   hold progress (0 while chasing). */
function cycleAt(t) {
  var tt = t + OFFSET;
  var total = CYCLE * CYCLES.length;
  var wrapped = tt - Math.floor(tt / total) * total;
  var idx = Math.floor(wrapped / CYCLE);
  var local = wrapped - idx * CYCLE;
  var n = CYCLES[idx];
  if (local < CHASE) return { n: n, u: local / CHASE, hold: 0 };
  return { n: n, u: 1, hold: (local - CHASE) / HOLD };
}
/* Agent i position at chase progress u. u is capped so the radius
   never drops below 0.75 px: beyond that the spiral winds inside a
   single pixel and further turns are invisible. */
function agentPos(n, i, u, R, cx, cy) {
  var uMax = 1 - 0.75 / R;
  if (u > uMax) u = uMax;
  var rho = R * (1 - u);
  var phi = -Math.cos(Math.PI / n) / Math.sin(Math.PI / n) * Math.log(1 - u);
  var ang = ROT[n] + (TAU * i) / n + phi;
  return [cx + rho * Math.cos(ang), cy + rho * Math.sin(ang)];
}
function drawChase(cyc) {
  var minD = Math.min(VW, VH);
  var R = 0.36 * minD;
  var cx = VW / 2, cy0 = VH / 2;
  var c = cyc;
  var n = c.n;
  var lw = Math.max(1, minD / 700);
  var dotR = Math.max(2.5, minD * 0.005);
  /* During the hold the finished rosette breathes out to 40% before
     the next polygon begins. */
  var holdFade = 1 - 0.6 * c.hold;
  var uMax = 1 - 0.75 / R;
  /* Sample times cluster toward closure (power 2.2) so the tight
     final winding stays smooth instead of jumping in long chords. */
  var j, s, u, age, alpha, p0, p1, k;
  for (var i = 0; i < n; i++) {
    for (j = 0; j < SAMPLES; j++) {
      var f0 = j / SAMPLES, f1 = (j + 1) / SAMPLES;
      var u0 = uMax * (1 - Math.pow(1 - f0, 2.2));
      var u1 = uMax * (1 - Math.pow(1 - f1, 2.2));
      /* Only draw the trail up to the current chase progress. */
      if (u0 > c.u) break;
      if (u1 > c.u) u1 = c.u;
      age = (c.u - u1) * CHASE;
      alpha = (0.22 + 0.68 * (1 - age / CHASE)) * holdFade;
      if (alpha <= 0.01) continue;
      p0 = agentPos(n, i, u0, R, cx, cy0);
      p1 = agentPos(n, i, u1, R, cx, cy0);
      ctx.beginPath();
      ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p1[0], p1[1]);
      ctx.strokeStyle = rgba(LINE, alpha);
      ctx.lineWidth = lw;
      ctx.stroke();
    }
  }
  /* Agents: ink dots at their current positions, or at the center
     while the closed figure holds its breath. */
  ctx.fillStyle = AGENT;
  for (k = 0; k < n; k++) {
    var p = agentPos(n, k, c.u, R, cx, cy0);
    ctx.beginPath();
    ctx.moveTo(p[0] + dotR, p[1]);
    ctx.arc(p[0], p[1], dotR, 0, TAU);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  var title = 'Double Pursuit, Pentagons';
  var date = '2006 · 08 · 03';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(title).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText(date).width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_EDGE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(title, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = INK_SOFT;
  ctx.fillText(date, plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_EDGE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = INK_SOFT;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var c = cycleAt(t);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawChase(c);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    cycleAt: function (t) { return cycleAt(t); },
    agentPos: function (n, i, u) {
      var minD = Math.min(VW, VH);
      return agentPos(n, i, u, 0.36 * minD, VW / 2, VH / 2);
    }
  };
}
/* ---- frame one: t = 0, a partially closed pentagon rosette ---- */size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = 0, prevTs = null, t0 = null;
draw(0);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
