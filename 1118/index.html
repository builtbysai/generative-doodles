<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scanlines</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0C; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1118 "Scanlines" — Markus Kison study block MK7.
   An abstract lathe-turned vessel (a profile of stacked bulges, not any
   real object) turns slowly on a disc in the dark. A red laser line sweeps
   down its height, one pass every 20 s: above the line the surface is
   resolved into lit dashes and fine rings, below it the form dissolves
   into faint points drifting down and out. Each pass, a few seeded
   crosshair / tick decals fade in where the line has passed and fade out
   again over ten seconds. Drag orbits; double-tap reseeds the profile.
   Everything unattended is a closed-form function of piece time t;
   frame one is a fixed phase mid-pass, so the thumb is reproducible. */

var TAU = Math.PI * 2;

/* ---------- seeded rng (determinism: no Math.random, no wall clock) ------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(a, b) {  // deterministic per-pass seed
  var h = (a ^ Math.imul(b + 1, 0x9E3779B1)) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 0x85EBCA6B) >>> 0;
  return (h ^ (h >>> 13)) >>> 0;
}
var SEED = 111816;   // scanned at build: three pass-0 decals read at frame one
(function () {
  var m = /[?&]seed=(\d+)/.exec((typeof location !== 'undefined' && location.search) || '');
  if (m) SEED = parseInt(m[1], 10) >>> 0;
})();

/* ---------- palette ------------------------------------------------------ */
var COL = {
  ground: '#0A0A0C',
  body: [207, 200, 188],        // warm gray #CFC8BC
  disc: [26, 25, 28],
  discRim: [74, 70, 64],
  shadow: [0, 0, 0],
  laser: [255, 58, 48],         // #FF3A30
  decal: [232, 228, 218]        // pale ink
};
function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

/* ---------- lathe profile --------------------------------------------------
   radius(v), v = 0 at the foot, 1 at the lip: a foot flare, a gentle taper
   and a sum of seeded gaussian bulges. Smooth by construction.            */
var prof = null;
function buildProfile(seed) {
  var r = mulberry32(seed);
  var bulges = [];
  var nb = 3 + Math.floor(r() * 2);               // 3-4 bulges
  for (var i = 0; i < nb; i++) {
    bulges.push({
      c: 0.12 + r() * 0.78,
      w: 0.10 + r() * 0.13,
      a: 0.020 + r() * 0.055
    });
  }
  prof = {
    base: 0.088 + r() * 0.02,
    taper: 0.16 + r() * 0.14,                     // narrows toward the lip
    foot: 0.030 + r() * 0.018,
    bulges: bulges
  };
}
function radiusAt(v) {
  var rad = prof.base * (1 - prof.taper * v);
  rad += prof.foot * Math.exp(-Math.pow(v / 0.055, 2));        // foot flare
  rad += 0.012 * Math.exp(-Math.pow((v - 1) / 0.05, 2));        // lip bead
  for (var i = 0; i < prof.bulges.length; i++) {
    var b = prof.bulges[i];
    rad += b.a * Math.exp(-Math.pow((v - b.c) / b.w, 2));
  }
  return rad;
}
buildProfile(SEED);

/* ---------- surface points -------------------------------------------------
   Rings x around-points, precomputed per point: base angle, seeded jitter
   for the dissolve drift. Positions are evaluated closed-form per frame. */
var RINGS = 60, AROUND = 56;
var pts = [];
(function buildPoints() {
  var r = mulberry32(hash2(SEED, 77));
  for (var i = 0; i < RINGS; i++) {
    for (var j = 0; j < AROUND; j++) {
      pts.push({
        ring: i,
        v: i / (RINGS - 1),
        a: (j / AROUND) * TAU,
        jx: r() - 0.5,               // dissolve jitter, fixed per point
        jy: r() - 0.5,
        tw: 0.75 + r() * 0.45        // per-point brightness variation
      });
    }
  }
})();

/* ---------- sizing -------------------------------------------------------- */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var vw = 300, vh = 300, dpr = 1, phone = false;
var PHASE = 10.0;                 // frame one: mid-pass of the 20 s sweep
var T = PHASE;

function fit() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  vw = vv ? vv.width : (window.innerWidth || 300);
  vh = vv ? vv.height : (window.innerHeight || 300);
  dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
  var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : vw;
  var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : vh;
  phone = (Math.min(sw, sh) < 700) || (vh > vw * 1.15);
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(); });
  }
  window.addEventListener('resize', function () { fit(); draw(); });
}
fit();

/* stage: the vessel is a centred geometric composition, so the square holds
   on phones too; the page ground is the piece's own ground colour. */
function stage() {
  var S = Math.min(vw, vh);
  return { w: S, h: S, ox: (vw - S) / 2, oy: (vh - S) / 2 };
}

/* ---------- interaction ----------------------------------------------------
   Drag orbits: the offset is held while dragging and eases back to the
   turntable with a ~3.5 s time constant after release. Double-tap (two
   short, still presses within 320 ms) reseeds the profile. A single tap
   does nothing. Never click-to-reload.                                   */
var drag = null;                  // {x0, off} while dragging
var dragOff = 0, dragOffT = 0;    // released offset and the piece time of release
var downInfo = null;              // {x, y, t} of the current press
var lastTapT = -10;
function curOff(t) {
  if (drag) return drag.off;
  return dragOff * Math.exp(-(t - dragOffT) / 3.5);
}
function azimuth(t) {
  return t * TAU / 90 + curOff(t);               // turntable: 90 s per rev
}
function evPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [e.clientX - r.left, e.clientY - r.top];
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    var p = evPos(e);
    downInfo = { x: p[0], y: p[1], t: T };
    var o = curOff(T);
    drag = { x0: p[0], off0: o, off: o };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = evPos(e), st = stage();
    drag.off = drag.off0 + (p[0] - drag.x0) / st.w * 2.4;
  });
  var endPress = function (e) {
    if (drag) { dragOff = drag.off; dragOffT = T; drag = null; }
    if (downInfo) {
      var p = evPos(e);
      var moved = Math.abs(p[0] - downInfo.x) + Math.abs(p[1] - downInfo.y);
      if (moved < 8 && T - downInfo.t < 0.45) {              // a tap
        if (T - lastTapT < 0.32) {                           // double-tap
          SEED = hash2(SEED, Math.floor(T * 10) + 1);
          buildProfile(SEED);
          lastTapT = -10;
        } else lastTapT = T;
      }
      downInfo = null;
    }
  };
  canvas.addEventListener('pointerup', endPress);
  canvas.addEventListener('pointercancel', function () { drag = null; downInfo = null; });
}

/* ---------- decals ---------------------------------------------------------
   Per pass k, five seeded surface points. A decal fades in as the line
   passes its height and out over the following ten seconds.              */
function passDecals(k) {
  var r = mulberry32(hash2(SEED, 1000 + k));
  var out = [];
  for (var i = 0; i < 5; i++) {
    out.push({
      v: 0.10 + r() * 0.84,
      a: r() * TAU,
      cross: r() < 0.55,
      size: 0.010 + r() * 0.007
    });
  }
  return out;
}

/* ---------- draw ----------------------------------------------------------- */
var PASS = 20;                    // seconds per scan pass
var BASE_Y = 0.815, VHGT = 0.55, CX = 0.5, TILT = 0.30, LIGHT = 0.9;

function surfPoint(p, az, st) {
  var rad = radiusAt(p.v);
  var ang = p.a + az;
  var x = CX + rad * Math.cos(ang);
  var y = BASE_Y - p.v * VHGT - rad * Math.sin(ang) * TILT;
  return { x: st.ox + x * st.w, y: st.oy + y * st.h, rad: rad, ang: ang, sin: Math.sin(ang) };
}

function draw() {
  var st = stage();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, 0, vw, vh);

  var t = T;
  var az = azimuth(t);
  var frac = (t % PASS) / PASS;
  var scanV = 1 - frac;                              // line sweeps top -> bottom
  var env = Math.pow(Math.sin(Math.PI * frac), 0.7); // dissolve strength envelope
  var k = Math.floor(t / PASS);

  /* turntable: contact shadow, disc, rim */
  var dcx = st.ox + CX * st.w, dcy = st.oy + BASE_Y * st.h;
  var drx = 0.30 * st.w, dry = 0.052 * st.h;
  ctx.fillStyle = rgba(COL.shadow, 0.55);
  ctx.beginPath(); ctx.ellipse(dcx, dcy + dry * 0.55, drx * 0.82, dry * 0.8, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = rgba(COL.disc, 1);
  ctx.beginPath(); ctx.ellipse(dcx, dcy, drx, dry, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba(COL.discRim, 0.8);
  ctx.lineWidth = Math.max(1, st.w * 0.0016);
  ctx.beginPath(); ctx.ellipse(dcx, dcy, drx, dry, 0, 0, TAU); ctx.stroke();
  ctx.strokeStyle = rgba(COL.discRim, 0.30);
  ctx.beginPath(); ctx.ellipse(dcx, dcy, drx * 0.78, dry * 0.78, 0, 0, TAU); ctx.stroke();

  /* vessel surface, back half then front half */
  for (var half = 0; half < 2; half++) {
    for (var idx = 0; idx < pts.length; idx++) {
      var p = pts[idx];
      var sp = surfPoint(p, az, st);
      var front = sp.sin > 0;
      if ((half === 1) !== front) continue;
      var shade = 0.34 + 0.66 * (0.5 + 0.5 * Math.cos(sp.ang - LIGHT));
      shade *= p.tw;
      var d = scanV - p.v;               // > 0: this ring is still ahead of the line
      if (p.v >= scanV) {
        /* resolved: short dash along the ring toward the next point */
        var q = { v: p.v, a: p.a + TAU / AROUND, jx: 0, jy: 0, tw: 1 };
        var sq = surfPoint(q, az, st);
        var near = (p.v - scanV) < 0.025 ? 1.25 : 1.0;   // active band at the line
        ctx.strokeStyle = rgba(COL.body, Math.min(1, (0.16 + 0.62 * shade) * near));
        ctx.lineWidth = Math.max(1, st.w * 0.0021);
        ctx.beginPath();
        ctx.moveTo(sp.x, sp.y);
        ctx.lineTo(sq.x, sq.y);
        ctx.stroke();
      } else {
        /* dissolving: point drifts down and out, fading with distance
           below the line and with the pass envelope */
        var dd = d;
        var drift = dd * dd * 0.10 * env + dd * 0.015 * env;
        var ox = (Math.cos(sp.ang) * 0.55 + p.jx) * drift * st.w;
        var oy = (0.85 + p.jy * 0.3) * drift * st.h + dd * dd * 0.05 * env * st.h;
        var a = (0.10 + 0.40 * shade) * Math.max(0, 1 - dd * 1.15) * (0.35 + 0.65 * env);
        if (a <= 0.004) continue;
        ctx.fillStyle = rgba(COL.body, a);
        var s = Math.max(1, st.w * 0.0022);
        ctx.fillRect(sp.x + ox - s / 2, sp.y + oy - s / 2, s, s);
      }
    }
  }

  /* decals for this pass and the tail of the previous pass */
  for (var kk = k - 1; kk <= k; kk++) {
    if (kk < 0) continue;
    var decs = passDecals(kk);
    for (var di = 0; di < decs.length; di++) {
      var dec = decs[di];
      var passT = kk * PASS + (1 - dec.v) * PASS;    // when the line reaches dec.v
      var dt = t - passT;
      if (dt < 0 || dt > 10) continue;
      var al = Math.min(1, dt / 0.4) * (1 - dt / 10);
      var dp = surfPoint({ v: dec.v, a: dec.a, jx: 0, jy: 0, tw: 1 }, az, st);
      if (dp.sin < -0.25) continue;                  // hidden round the back
      al *= 0.35 + 0.65 * (0.5 + 0.5 * dp.sin);
      var sz = dec.size * st.w;
      ctx.strokeStyle = rgba(COL.decal, al * 0.95);
      ctx.lineWidth = Math.max(1, st.w * 0.0014);
      ctx.beginPath();
      if (dec.cross) {
        ctx.moveTo(dp.x - sz, dp.y); ctx.lineTo(dp.x + sz, dp.y);
        ctx.moveTo(dp.x, dp.y - sz); ctx.lineTo(dp.x, dp.y + sz);
      } else {
        ctx.moveTo(dp.x - sz * 0.7, dp.y + sz * 0.7);
        ctx.lineTo(dp.x + sz * 0.3, dp.y - sz * 0.5);
        ctx.lineTo(dp.x + sz, dp.y + sz * 0.1);
      }
      ctx.stroke();
    }
  }

  /* the scanline: soft skirt of stacked translucent rects, then the core.
     No gradients anywhere. */
  var lineY = st.oy + (BASE_Y - scanV * VHGT) * st.h;
  var halfW = radiusAt(Math.max(0, Math.min(1, scanV))) * 1.45 + 0.055;
  var lx0 = st.ox + (CX - halfW) * st.w, lx1 = st.ox + (CX + halfW) * st.w;
  ctx.fillStyle = rgba(COL.laser, 0.045);
  ctx.fillRect(lx0, lineY - st.h * 0.016, lx1 - lx0, st.h * 0.032);
  ctx.fillStyle = rgba(COL.laser, 0.09);
  ctx.fillRect(lx0, lineY - st.h * 0.007, lx1 - lx0, st.h * 0.014);
  ctx.fillStyle = rgba(COL.laser, 0.92);
  ctx.fillRect(lx0, lineY - Math.max(1, st.h * 0.0014), lx1 - lx0, Math.max(2, st.h * 0.0028));
}

/* Sound: none. The piece ships silent; the scan is a visual patience and a
   servo tick would only hurry it. */

/* ---------- main loop ------------------------------------------------------ */
draw();
var lastTs = -1;
function frame(ts) {
  if (lastTs < 0) lastTs = ts;
  T = PHASE + (ts - lastTs) / 1000;
  draw();
  requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
</script>
</body>
</html>
