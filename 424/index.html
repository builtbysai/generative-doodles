<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.424 Mood Boosters</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFF6E8; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.424 Mood Boosters (kittyo.illustration, EXPANSION #45).
// After Kitty O'Rourke's monthly Mood Boosters series: a
// 2x2 grid of pocketable joy vignettes on one canvas,
// reading as a calendar page on cream. Top-left a bright
// sun in sunglasses over sunny yellow; top-right a woman
// whose deep pockets overflow with flowers, on teal;
// bottom-left a beach day-trip (striped towel, ice
// cream, small sun) on coral; bottom-right a woman under
// a polka-dot umbrella in April showers, on rain sky.
// A slim header strip reads MOOD BOOSTERS · MAY (the
// prompt's dash rendered as a middot, per the house
// no-em-dash rule) and a small hand-lettered caption
// sits under each scene: "brighter days are coming",
// "always happy with decent pockets", "beach day-trip"
// (the prompt gives the beach cell no caption, so its
// own description words stand in), "keeping dry in the
// April showers". All lettering is drawn as STROKE
// PATHS from a tiny hand-lettered glyph table, never
// system fonts. Kitty O does not sign these pieces, so
// there is no signature. BLACK OUTLINES on every shape
// are her grammar in this set.
//
// WATCH-ONLY: no interaction at all; the loop is the
// piece. The ambient loop is 36s, seamless: each cell
// runs its micro-motion on its own staggered phase
// (cell offsets 0 / 9 / 18 / 27s of the loop) and every
// sub-period divides 36s exactly, so the loop wraps
// clean. The sun rotates once per loop and its lenses
// glint twice per loop; pocket flowers sway on 12s;
// the ice cream drips one drop every 9s; rain streaks
// fall whole panel-heights per loop while the umbrella
// twirls on 9s. Frame one is drawn at the constant
// phase T = 13.7s with all four vignettes developed and
// mid-motion; the clock is anchored there and advances
// in fixed 1/60 ticks, never from a wall clock. Flat
// colour only, one canvas, no offscreen canvas, no
// gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// One ground per cell, never mixed across cells: sunny
// yellow, pocket teal, beach coral, rain sky. Shared:
// sun yellow with orange rays, flowers pink and white,
// umbrella pink with white dots, rain-drop pale blue,
// black ink outlines, dark plum lettering. The cream is
// the set's cream (as in No.419 and No.420): the page,
// the gutters and the caption ground. Nothing else.
var SUNNY = '#FFE066', TEAL = '#2A9D8F', CORAL = '#FF8C69', SKY = '#7BCEEB';
var SUN = '#FFD832', RAYS = '#F5A623';
var PINK = '#FF4FA3', WHITE = '#FFFFFF', UMB = '#FF9ECF';
var RAIN = '#BFE3F5', INK = '#1A1A1A', PLUM = '#3A2E3F';
var CREAM = '#FFF6E8';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 36;
if (LOOP !== 36) throw new Error('Mood Boosters loop must be 36s');
var TICK = 1 / 60;

// QA probe via the house seed pattern: ?seed=late starts
// the clock at a late constant phase so the drip reset,
// the second glint and the rain wrap can be
// render-checked. It does not affect the shipped
// default, which starts at T_OFF = 13.7s exactly.
var seedStr = (typeof location !== 'undefined' && location.search) ? location.search : '';
var T_OFF = seedStr.indexOf('late') >= 0 ? 30.25 : 13.7;

// ---- the grid ------------------------------------------
// Calendar layout on the cream page: outer margin 24, a
// 56px header strip, then two rows. Each cell is a 318px
// scene panel plus a 64px caption zone on the cream.
var MARG = 24, HEADER_H = 56, GRID_Y = 94;
var SCENE_H = 318, CAP_H = 64, GUT = 18;
var COL_W = (DW - 2 * MARG - GUT) / 2;
var CELLS = [
  { x: MARG,           y: GRID_Y,                 off: 0,  cap: 'brighter days are coming' },
  { x: MARG + COL_W + GUT, y: GRID_Y,              off: 9,  cap: 'always happy with decent pockets' },
  { x: MARG,           y: GRID_Y + SCENE_H + CAP_H + GUT, off: 18, cap: 'beach day-trip' },
  { x: MARG + COL_W + GUT, y: GRID_Y + SCENE_H + CAP_H + GUT, off: 27, cap: 'keeping dry in the April showers' }
];
if (CELLS.length !== 4) throw new Error('Mood Boosters must have exactly 4 cells');
if (CELLS[0].off !== 0 || CELLS[1].off !== 9 || CELLS[2].off !== 18 || CELLS[3].off !== 27)
  throw new Error('cell stagger offsets must be 0 / 9 / 18 / 27');

// ---- small draw helpers ---------------------------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function circ(x, y, r, fill, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, lw) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x0, y0, x1, y1, col, lw) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function star(x, y, r, rot, fill, lw) {
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var a = rot + i * Math.PI / 5, rad = (i % 2 === 0) ? r : r * 0.48;
    var px = x + rad * Math.cos(a), py = y + rad * Math.sin(a);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function cloud(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x - 50 * s, y + 14 * s);
  ctx.arc(x - 30 * s, y + 2 * s, 17 * s, Math.PI * 0.98, Math.PI * 1.9);
  ctx.arc(x + 2 * s, y - 8 * s, 24 * s, Math.PI * 1.02, Math.PI * 2.02);
  ctx.arc(x + 32 * s, y + 2 * s, 16 * s, Math.PI * 1.12, Math.PI * 0.08);
  ctx.lineTo(x + 50 * s, y + 14 * s);
  ctx.closePath();
  ctx.fillStyle = WHITE; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.stroke();
}
function flower(x, y, petal, s) {
  for (var i = 0; i < 5; i++) {
    var a = -Math.PI / 2 + i * (Math.PI * 2 / 5);
    circ(x + 8.5 * s * Math.cos(a), y + 8.5 * s * Math.sin(a), 7 * s, petal, 2.2);
  }
  circ(x, y, 4.6 * s, SUN, 2.2);
}

// ---- hand-lettered stroke glyphs -------------------------
// Each glyph is a list of strokes; each stroke is a list
// of [x, y] points. Capitals live in a unit box x 0..0.72,
// y 0..1 (y down). Lowercase shares the box with the
// baseline at y = 1.0, x-height top at y = 0.35,
// ascenders reaching y = 0 and descenders y = 1.35.
// Lettering is stroked path data only, never font text.
function arcPts(cx, cy, rx, ry, a0, a1, n) {
  var pts = [];
  for (var i = 0; i <= n; i++) {
    var a = (a0 + (a1 - a0) * (i / n)) * Math.PI / 180;
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return pts;
}
var GLYPHS = {
  A: [ [[0, 1], [0.36, 0], [0.72, 1]], [[0.15, 0.64], [0.57, 0.64]] ],
  B: [ [[0.07, 0], [0.07, 1]],
       [[0.07, 0], [0.42, 0.01], [0.56, 0.13], [0.56, 0.3], [0.43, 0.43], [0.07, 0.47]],
       [[0.07, 0.47], [0.48, 0.49], [0.62, 0.63], [0.62, 0.83], [0.49, 0.97], [0.07, 1]] ],
  D: [ [[0.08, 0], [0.08, 1]],
       [[0.08, 0], [0.38, 0.01], [0.58, 0.18], [0.64, 0.5], [0.58, 0.82], [0.38, 0.99], [0.08, 1]] ],
  E: [ [[0.1, 0], [0.1, 1]], [[0.1, 0], [0.64, 0]], [[0.1, 0.5], [0.52, 0.5]], [[0.1, 1], [0.66, 1]] ],
  M: [ [[0.02, 1], [0.02, 0], [0.36, 0.55], [0.7, 0], [0.7, 1]] ],
  O: [ arcPts(0.36, 0.5, 0.34, 0.49, 0, 360, 20) ],
  R: [ [[0.08, 0], [0.08, 1]],
       [[0.08, 0], [0.45, 0.01], [0.6, 0.13], [0.6, 0.33], [0.45, 0.47], [0.08, 0.5]],
       [[0.34, 0.5], [0.64, 1]] ],
  S: [ [[0.6, 0.15], [0.45, 0.02], [0.21, 0.03], [0.1, 0.18], [0.15, 0.35], [0.33, 0.47], [0.53, 0.57], [0.62, 0.73], [0.53, 0.91], [0.31, 1], [0.13, 0.9]] ],
  T: [ [[0.36, 0], [0.36, 1]], [[0.04, 0.02], [0.68, 0.02]] ],
  Y: [ [[0.02, 0], [0.36, 0.44]], [[0.7, 0], [0.36, 0.44], [0.36, 1]] ],
  a: [ [[0.62, 0.45], [0.48, 0.36], [0.26, 0.36], [0.12, 0.5], [0.12, 0.82], [0.24, 0.97], [0.46, 1], [0.62, 0.9]],
       [[0.62, 0.35], [0.62, 1]] ],
  b: [ [[0.1, 0], [0.1, 1]],
       [[0.1, 0.62], [0.3, 0.38], [0.52, 0.38], [0.62, 0.55], [0.62, 0.8], [0.5, 0.97], [0.28, 1], [0.1, 0.95]] ],
  c: [ arcPts(0.37, 0.68, 0.3, 0.31, -50, -310, 12) ],
  d: [ [[0.62, 0.5], [0.45, 0.37], [0.25, 0.37], [0.12, 0.55], [0.12, 0.8], [0.25, 0.97], [0.48, 1], [0.62, 0.88]],
       [[0.62, 0], [0.62, 1]] ],
  e: [ [[0.12, 0.66], [0.6, 0.66]],
       [[0.6, 0.66], [0.58, 0.48], [0.42, 0.36], [0.24, 0.38], [0.12, 0.55], [0.12, 0.82], [0.24, 0.97], [0.45, 1], [0.6, 0.9]] ],
  g: [ [[0.62, 0.5], [0.45, 0.37], [0.25, 0.37], [0.12, 0.55], [0.12, 0.8], [0.25, 0.97], [0.48, 1], [0.62, 0.88]],
       [[0.62, 0.35], [0.62, 1.05], [0.52, 1.28], [0.3, 1.35], [0.14, 1.26]] ],
  h: [ [[0.1, 0], [0.1, 1]],
       [[0.1, 0.62], [0.24, 0.42], [0.44, 0.36], [0.58, 0.46], [0.6, 0.65], [0.6, 1]] ],
  i: [ [[0.34, 0.35], [0.34, 1]], [[0.34, 0.1], [0.345, 0.13]] ],
  k: [ [[0.1, 0], [0.1, 1]], [[0.58, 0.35], [0.16, 0.68]], [[0.28, 0.56], [0.62, 1]] ],
  l: [ [[0.3, 0], [0.3, 0.92], [0.42, 1], [0.56, 0.98]] ],
  m: [ [[0.05, 0.35], [0.05, 1]],
       [[0.05, 0.58], [0.16, 0.4], [0.28, 0.4], [0.32, 0.58], [0.32, 1]],
       [[0.32, 0.58], [0.43, 0.4], [0.55, 0.4], [0.6, 0.58], [0.6, 1]] ],
  n: [ [[0.08, 0.35], [0.08, 1]],
       [[0.08, 0.58], [0.22, 0.4], [0.42, 0.38], [0.54, 0.5], [0.56, 0.7], [0.56, 1]] ],
  o: [ arcPts(0.36, 0.68, 0.3, 0.32, 0, 360, 16) ],
  p: [ [[0.1, 0.35], [0.1, 1.35]],
       [[0.1, 0.6], [0.28, 0.38], [0.5, 0.38], [0.62, 0.55], [0.62, 0.78], [0.5, 0.96], [0.28, 1], [0.1, 0.95]] ],
  r: [ [[0.1, 0.35], [0.1, 1]], [[0.1, 0.6], [0.26, 0.4], [0.44, 0.36], [0.58, 0.42]] ],
  s: [ [[0.56, 0.45], [0.42, 0.36], [0.24, 0.37], [0.13, 0.48], [0.2, 0.62], [0.38, 0.7], [0.54, 0.78], [0.58, 0.9], [0.44, 1], [0.22, 1], [0.12, 0.92]] ],
  t: [ [[0.34, 0.05], [0.34, 0.88], [0.44, 1], [0.58, 0.97]], [[0.14, 0.42], [0.56, 0.42]] ],
  w: [ [[0.02, 0.38], [0.15, 1], [0.29, 0.5], [0.43, 1], [0.58, 0.38]] ],
  y: [ [[0.05, 0.35], [0.33, 0.88]], [[0.6, 0.35], [0.33, 0.9], [0.22, 1.22], [0.08, 1.32]] ],
  '-': [ [[0.14, 0.68], [0.5, 0.68]] ]
};
var ADV = 0.8, SPACE_ADV = 0.42;
function textWidth(str, h) {
  var toks = str.split(' '), total = 0;
  for (var i = 0; i < toks.length; i++) {
    if (i > 0) total += SPACE_ADV * h;
    if (toks[i] === '·') total += 0.5 * h;
    else if (toks[i].length > 0) total += (ADV * (toks[i].length - 1) + 0.74) * h;
  }
  return total;
}
function drawText(str, cx, topY, h, col, lw) {
  var x = cx - textWidth(str, h) / 2;
  var toks = str.split(' ');
  ctx.strokeStyle = col; ctx.lineWidth = lw;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (var ti = 0; ti < toks.length; ti++) {
    if (ti > 0) x += SPACE_ADV * h;
    var tok = toks[ti];
    if (tok === '·') {
      ctx.beginPath(); ctx.arc(x + 0.25 * h, topY + 0.52 * h, 0.085 * h, 0, Math.PI * 2);
      ctx.fillStyle = col; ctx.fill();
      x += 0.5 * h;
      continue;
    }
    for (var li = 0; li < tok.length; li++) {
      var strokes = GLYPHS[tok.charAt(li)];
      if (strokes) {
        for (var si = 0; si < strokes.length; si++) {
          var pts = strokes[si];
          ctx.beginPath();
          for (var pi = 0; pi < pts.length; pi++) {
            var px = x + pts[pi][0] * h, py = topY + pts[pi][1] * h;
            if (pi === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }
      }
      x += ADV * h;
    }
    if (tok.length > 0) x -= (ADV - 0.74) * h;
  }
}
function drawCaption(str, cx, topY, maxW) {
  var h = 27;
  var w = textWidth(str, h);
  if (w > maxW) h *= maxW / w;
  drawText(str, cx, topY, h, PLUM, 3.4);
}

// ---- fixed rain table -------------------------------------
// Fixed-seed scatter for the April cell: 44 streaks, each
// falling a whole number of wrap ranges per 36s loop, so
// the rain wraps seamlessly. Data only, drawn directly.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var WRAP = SCENE_H + 40;
var DROPS = [];
(function () {
  var rng = mulberry32(424);
  for (var i = 0; i < 44; i++) {
    DROPS.push({
      x: 14 + rng() * (COL_W - 28),
      y0: rng() * WRAP,
      len: 12 + rng() * 7,
      wraps: rng() < 0.5 ? 2 : 3
    });
  }
})();
if (DROPS.length !== 44) throw new Error('rain table must hold exactly 44 streaks');

// ---- header ----------------------------------------------
function drawHeader() {
  drawText('MOOD BOOSTERS · MAY', DW / 2, MARG + 8, 34, PLUM, 5);
  flower(64, MARG + HEADER_H / 2, PINK, 1.05);
  flower(DW - 64, MARG + HEADER_H / 2, PINK, 1.05);
}

// ---- shared face ------------------------------------------
// Minimal happy face: two closed-eye arcs and a smile.
function happyFace(cx, cy, s) {
  ctx.strokeStyle = INK; ctx.lineWidth = 3.4 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx - 13 * s, cy, 6.5 * s, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 13 * s, cy, 6.5 * s, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy + 4 * s, 9 * s, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
  circ(cx - 24 * s, cy + 8 * s, 5 * s, PINK, 0);
  circ(cx + 24 * s, cy + 8 * s, 5 * s, PINK, 0);
}

// ---- cell 0: the sunglassed sun (sunny yellow) -------------
function drawSunCell(lt) {
  var cx = COL_W / 2, cy = 138;
  var drift = 6 * Math.sin(Math.PI * 2 * lt / LOOP);
  cloud(96 + drift, 52, 0.8);
  cloud(COL_W - 92 - drift, 66, 0.66);
  // low hills give the vignette its horizon
  ctx.beginPath(); ctx.ellipse(70, SCENE_H + 26, 210, 74, 0, Math.PI, Math.PI * 2); ctx.closePath();
  ctx.fillStyle = RAYS; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(COL_W - 40, SCENE_H + 34, 240, 84, 0, Math.PI, Math.PI * 2); ctx.closePath();
  ctx.fillStyle = RAYS; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
  // rotating ray group: one whole turn per loop
  var rot = Math.PI * 2 * lt / LOOP;
  ctx.fillStyle = RAYS; ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  for (var i = 0; i < 12; i++) {
    var a = rot + i * Math.PI / 6, hw = 0.14;
    ctx.beginPath();
    ctx.moveTo(cx + 82 * Math.cos(a - hw), cy + 82 * Math.sin(a - hw));
    ctx.lineTo(cx + 118 * Math.cos(a), cy + 118 * Math.sin(a));
    ctx.lineTo(cx + 82 * Math.cos(a + hw), cy + 82 * Math.sin(a + hw));
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  circ(cx, cy, 76, SUN, 5);
  // sunglasses: two ink lenses, a bridge, temple arms
  var glint = Math.pow(Math.max(0, Math.sin(Math.PI * 2 * lt / 18)), 8);
  var lensY = cy - 8;
  ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - 66, lensY - 8); ctx.lineTo(cx - 96, lensY - 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 66, lensY - 8); ctx.lineTo(cx + 96, lensY - 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 14, lensY - 6); ctx.quadraticCurveTo(cx, lensY - 14, cx + 14, lensY - 6); ctx.stroke();
  rr(cx - 68, lensY - 24, 56, 42, 15); ctx.fillStyle = INK; ctx.fill();
  rr(cx + 12, lensY - 24, 56, 42, 15); ctx.fillStyle = INK; ctx.fill();
  if (glint > 0.03) {
    ctx.save();
    ctx.globalAlpha = glint * 0.95;
    ctx.strokeStyle = WHITE; ctx.lineWidth = 6;
    rr(cx - 68, lensY - 24, 56, 42, 15); ctx.clip();
    line(cx - 58, lensY + 14, cx - 34, lensY - 22, WHITE, 6);
    line(cx - 40, lensY + 16, cx - 22, lensY - 14, WHITE, 4);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = glint * 0.95;
    rr(cx + 12, lensY - 24, 56, 42, 15); ctx.clip();
    line(cx + 22, lensY + 14, cx + 46, lensY - 22, WHITE, 6);
    line(cx + 40, lensY + 16, cx + 58, lensY - 14, WHITE, 4);
    ctx.restore();
  }
  // smile and cheeks under the shades
  ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy + 22, 26, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
  circ(cx - 48, cy + 30, 8, PINK, 0);
  circ(cx + 48, cy + 30, 8, PINK, 0);
}

// ---- cell 1: pockets full of flowers (teal) ----------------
function drawPocketCell(lt) {
  var cx = COL_W / 2;
  line(18, 296, cx - 104, 296, INK, 3);
  line(cx + 104, 296, COL_W - 18, 296, INK, 3);
  var sway = Math.sin(Math.PI * 2 * lt / 12);
  // dress
  ctx.beginPath();
  ctx.moveTo(cx - 42, 128); ctx.lineTo(cx + 42, 128);
  ctx.lineTo(cx + 88, 274); ctx.quadraticCurveTo(cx, 288, cx - 88, 274);
  ctx.closePath(); ctx.fillStyle = WHITE; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.lineJoin = 'round'; ctx.stroke();
  // arms: outlined by a fat ink stroke under a white one
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - 40, 140); ctx.quadraticCurveTo(cx - 86, 176, cx - 74, 214);
  ctx.strokeStyle = INK; ctx.lineWidth = 17; ctx.stroke();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 10; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 40, 140); ctx.quadraticCurveTo(cx + 86, 176, cx + 74, 214);
  ctx.strokeStyle = INK; ctx.lineWidth = 17; ctx.stroke();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 10; ctx.stroke();
  circ(cx - 74, 218, 8, WHITE, 3.5);
  circ(cx + 74, 218, 8, WHITE, 3.5);
  // shoes
  ell(cx - 42, 296, 17, 8, INK, 0);
  ell(cx + 42, 296, 17, 8, INK, 0);
  // hair mass, then face over it
  circ(cx, 82, 40, INK, 0);
  circ(cx - 33, 96, 13, INK, 0);
  circ(cx + 33, 96, 13, INK, 0);
  circ(cx, 44, 14, INK, 0);
  circ(cx, 88, 33, WHITE, 4);
  happyFace(cx, 90, 0.92);
  line(cx - 6, 122, cx - 4, 132, INK, 4);
  line(cx + 6, 122, cx + 4, 132, INK, 4);
  // two deep pockets, flowers spilling and swaying
  var pockets = [-58, 58];
  for (var pi = 0; pi < 2; pi++) {
    var px = cx + pockets[pi];
    for (var fi = 0; fi < 5; fi++) {
      var fx = px - 26 + fi * 13;
      var hx = fx + sway * (4 + fi * 1.6) * (pi === 0 ? 1 : 0.85);
      var hy = 196 - ((fi % 2) * 10 + (fi === 2 ? 6 : 0));
      ctx.beginPath(); ctx.moveTo(fx, 232);
      ctx.quadraticCurveTo(fx + (hx - fx) * 0.4, 214, hx, hy + 8);
      ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.stroke();
      flower(hx, hy, fi % 2 === 0 ? PINK : WHITE, 0.92);
    }
    rr(px - 39, 216, 78, 62, 14); ctx.fillStyle = WHITE; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(px, 224, 26, Math.PI * 0.15, Math.PI * 0.85);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
  }
}

// ---- cell 2: beach day-trip (coral) --------------------------
function drawBeachCell(lt) {
  // a small sun of its own, rays turning with the cell clock
  var sx = 88, sy = 70, rot = Math.PI * 2 * lt / LOOP;
  ctx.fillStyle = RAYS; ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
  for (var i = 0; i < 8; i++) {
    var a = rot + i * Math.PI / 4, hw = 0.17;
    ctx.beginPath();
    ctx.moveTo(sx + 38 * Math.cos(a - hw), sy + 38 * Math.sin(a - hw));
    ctx.lineTo(sx + 56 * Math.cos(a), sy + 56 * Math.sin(a));
    ctx.lineTo(sx + 38 * Math.cos(a + hw), sy + 38 * Math.sin(a + hw));
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  circ(sx, sy, 34, SUN, 4);
  var drift = 5 * Math.sin(Math.PI * 2 * lt / LOOP + 1.3);
  cloud(452 + drift, 54, 0.72);
  cloud(238 - drift, 40, 0.55);
  line(18, 214, COL_W - 18, 214, INK, 3);
  // striped towel in slight perspective
  var tx = 300, ty = 232;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tx - 118, ty - 26); ctx.lineTo(tx + 118, ty - 26);
  ctx.lineTo(tx + 148, ty + 52); ctx.lineTo(tx - 148, ty + 52);
  ctx.closePath(); ctx.clip();
  var bands = [WHITE, SUN, WHITE, PINK, WHITE, SUN];
  for (var bi = 0; bi < bands.length; bi++) {
    ctx.fillStyle = bands[bi];
    ctx.fillRect(tx - 160, ty - 26 + bi * 13.5, 320, 14);
  }
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(tx - 118, ty - 26); ctx.lineTo(tx + 118, ty - 26);
  ctx.lineTo(tx + 148, ty + 52); ctx.lineTo(tx - 148, ty + 52);
  ctx.closePath(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();
  // shells and a starfish on the sand
  ctx.beginPath(); ctx.arc(96, 262, 17, Math.PI, Math.PI * 2); ctx.closePath();
  ctx.fillStyle = WHITE; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
  line(96, 262, 84, 246, INK, 2.4); line(96, 262, 96, 244, INK, 2.4); line(96, 262, 108, 246, INK, 2.4);
  star(140, 288, 17, -0.4, RAYS, 3.5);
  ctx.beginPath(); ctx.arc(522, 288, 11, Math.PI, Math.PI * 2); ctx.closePath();
  ctx.fillStyle = WHITE; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
  line(522, 288, 515, 279, INK, 2); line(522, 288, 522, 277.5, INK, 2); line(522, 288, 529, 279, INK, 2);
  // the ice cream: cone, two scoops, and its drip
  var ix = 486;
  ctx.beginPath();
  ctx.moveTo(ix - 24, 196); ctx.lineTo(ix + 24, 196); ctx.lineTo(ix, 258);
  ctx.closePath(); ctx.fillStyle = RAYS; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(ix - 24, 196); ctx.lineTo(ix + 24, 196); ctx.lineTo(ix, 258);
  ctx.closePath(); ctx.clip();
  line(ix - 26, 214, ix + 14, 248, INK, 2.2);
  line(ix - 8, 204, ix + 26, 234, INK, 2.2);
  line(ix + 26, 214, ix - 14, 248, INK, 2.2);
  line(ix + 8, 204, ix - 26, 234, INK, 2.2);
  ctx.restore();
  circ(ix, 168, 29, WHITE, 4);
  circ(ix, 134, 24, PINK, 4);
  circ(ix, 108, 7.5, PINK, 3);
  // one drip per 9s of cell time: grows, falls, lands
  var q = (lt % 9) / 9;
  if (q < 0.18) {
    ell(ix - 24, 190 + q * 22, 3.6, 3.6 + q * 16, WHITE, 2.4);
  } else {
    var fq = (q - 0.18) / 0.82;
    var dy = 194 + fq * fq * 62;
    ctx.globalAlpha = fq > 0.9 ? 1 - (fq - 0.9) * 8 : 1;
    ell(ix - 24, dy, 3.8, 5.6, WHITE, 2.4);
    ctx.globalAlpha = 1;
    if (fq > 0.94) ell(ix - 24, 259, 4 + (fq - 0.94) * 90, 2.2, WHITE, 0);
  }
}

// ---- cell 3: April showers (rain sky) -----------------------
function canopyPath() {
  ctx.beginPath();
  ctx.moveTo(-118, 0);
  ctx.arc(0, 0, 118, Math.PI, 0, false);
  for (var i = 0; i < 5; i++) {
    var x0 = 118 - i * 47.2, x1 = 118 - (i + 1) * 47.2;
    ctx.quadraticCurveTo((x0 + x1) / 2, 15, x1, 0);
  }
  ctx.closePath();
}
var UMB_DOTS = [[-76, -52], [-38, -84], [6, -94], [52, -78], [86, -40], [-8, -52], [34, -34], [-58, -16]];
function drawRainCell(lt) {
  // the rain, behind everything, wrapping whole ranges
  ctx.strokeStyle = RAIN; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath();
  for (var i = 0; i < DROPS.length; i++) {
    var d = DROPS[i];
    var y = ((d.y0 + d.wraps * WRAP * (lt / LOOP)) % WRAP) - 20;
    ctx.moveTo(d.x, y); ctx.lineTo(d.x - 3, y + d.len);
  }
  ctx.stroke();
  var cx = COL_W / 2;
  // her dress and shoes first, then head, then umbrella
  ctx.beginPath();
  ctx.moveTo(cx + 4, 196); ctx.lineTo(cx + 66, 196);
  ctx.lineTo(cx + 84, 288); ctx.quadraticCurveTo(cx + 36, 298, cx - 14, 288);
  ctx.closePath(); ctx.fillStyle = WHITE; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.lineJoin = 'round'; ctx.stroke();
  ell(cx + 12, 296, 14, 7, INK, 0);
  ell(cx + 58, 296, 14, 7, INK, 0);
  circ(cx + 36, 132, 32, INK, 0);
  circ(cx + 36, 168, 26, WHITE, 4);
  happyFace(cx + 36, 170, 0.8);
  // arm out to the handle grip
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx + 52, 208); ctx.quadraticCurveTo(cx + 16, 216, cx - 6, 204);
  ctx.strokeStyle = INK; ctx.lineWidth = 15; ctx.stroke();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 9; ctx.stroke();
  // puddle and its splashes (3s cycle)
  ell(cx + 30, 300, 88, 10, RAIN, 3);
  var sp = (lt % 3) / 3;
  ctx.strokeStyle = RAIN; ctx.lineWidth = 3;
  var spl = [[-32, -0.5], [26, 0.3], [58, 0.65]];
  for (var si = 0; si < spl.length; si++) {
    var ph = (sp + spl[si][1] + 1) % 1;
    var hh = 3 + 7 * Math.sin(ph * Math.PI);
    line(cx + 30 + spl[si][0] - 3, 296, cx + 30 + spl[si][0] - 4, 296 - hh, RAIN, 3);
    line(cx + 30 + spl[si][0] + 3, 296, cx + 30 + spl[si][0] + 4, 296 - hh, RAIN, 3);
  }
  // the umbrella, twirling on a 9s cycle about its crown
  var tw = 0.16 * Math.sin(Math.PI * 2 * lt / 9);
  ctx.save();
  ctx.translate(cx - 8, 106);
  ctx.rotate(tw);
  ctx.save();
  canopyPath(); ctx.clip();
  ctx.fillStyle = UMB; ctx.fillRect(-120, -120, 240, 140);
  for (var di = 0; di < UMB_DOTS.length; di++) circ(UMB_DOTS[di][0], UMB_DOTS[di][1], 6.5, WHITE, 0);
  ctx.restore();
  canopyPath(); ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
  circ(0, -122, 6, UMB, 3.5);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 92);
  ctx.quadraticCurveTo(0, 108, -13, 106);
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
  ctx.restore();
  circ(cx - 14, 204, 7.5, WHITE, 3.5);
}

// ---- captions ------------------------------------------------
function drawCellScene(idx, lt) {
  if (idx === 0) drawSunCell(lt);
  else if (idx === 1) drawPocketCell(lt);
  else if (idx === 2) drawBeachCell(lt);
  else drawRainCell(lt);
}
var GROUNDS = [SUNNY, TEAL, CORAL, SKY];
function draw() {
  ctx.fillStyle = CREAM;
  ctx.fillRect(-240, -240, DW + 480, DH + 480);
  drawHeader();
  for (var i = 0; i < 4; i++) {
    var cell = CELLS[i];
    var lt = (T + cell.off) % LOOP;
    ctx.save();
    ctx.beginPath(); ctx.rect(cell.x, cell.y, COL_W, SCENE_H); ctx.clip();
    ctx.translate(cell.x, cell.y);
    ctx.fillStyle = GROUNDS[i]; ctx.fillRect(0, 0, COL_W, SCENE_H);
    drawCellScene(i, lt);
    ctx.restore();
    ctx.beginPath(); ctx.rect(cell.x, cell.y, COL_W, SCENE_H);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    drawCaption(cell.cap, cell.x + COL_W / 2, cell.y + SCENE_H + 15, COL_W - 20);
  }
}

// ---- clock ----------------------------------------------------
// T starts at the constant phase T_OFF and advances in fixed
// 1/60 ticks; frame one is drawn synchronously at T_OFF
// exactly, so the thumbnail reproduces byte-identically from
// the shipped script.
var T = T_OFF, acc = 0, lastNow = -1;
function step() { /* state is a pure function of T */ }

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
