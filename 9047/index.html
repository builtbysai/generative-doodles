<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№9047 · Deliberately Uninteresting</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8dcc4; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #stage { position: relative; }
  canvas { display: block; }
  .cap { font-family: Georgia, 'Times New Roman', serif; font-style: italic;
         color: #4a4132; text-align: center; padding: 14px 20px 26px;
         font-size: 17px; max-width: 720px; }
  .cap b { font-style: normal; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="cap"><b>№9047 · Deliberately Uninteresting</b> (after Sol LeWitt). Thousands of identical marks. The composition lives in coverage, never in the mark. Up close it is nothing but handwriting, at distance a curve. Click for another field.</div>
<script>
'use strict';
// Deliberately Uninteresting, after Sol LeWitt's late scribble drawings.
// LeWitt: "it is best that the basic unit be deliberately uninteresting."
// Draftsmen fill areas with graphite scribble until a tonal gradient
// emerges. One boring mark, nine thousand times. The curve is readable
// only at distance.

function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function parseSeed() {
  const m = /[?&]seed=(\d+)/.exec(location.search);
  if (m) return parseInt(m[1], 10) >>> 0;
  return 374001;
}
let seed = parseSeed();

function makeNoise(rand) {
  const p = new Float64Array(256);
  for (let i = 0; i < 256; i++) p[i] = rand();
  return (x) => {
    const xi = Math.floor(x), xf = x - xi;
    const a = p[xi & 255], b = p[(xi + 1) & 255];
    const u = xf * xf * (3 - 2 * xf);
    return a + (b - a) * u;
  };
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const U = 1000;

function fit() {
  const availW = Math.min(window.innerWidth, 900);
  const availH = window.innerHeight - 120;
  const s = Math.max(0.2, Math.min(availW / U, availH / U));
  cv.width = Math.round(U * s); cv.height = Math.round(U * s);
  cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
}
window.addEventListener('resize', () => { fit(); draw(); });

function draw() {
  const s = cv.width / U;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  const rand = mulberry32(seed);
  const noise = makeNoise(mulberry32(seed ^ 0x5eed));

  // warm paper
  const g = ctx.createLinearGradient(0, 0, U, U);
  g.addColorStop(0, '#f5ecda'); g.addColorStop(0.55, '#f1e6cf'); g.addColorStop(1, '#e7d8b8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, U, U);

  // the curve the coverage draws: a shallow arch across the sheet.
  // seeded: its height, position, and fullness wander.
  const archH = 130 + rand() * 90;      // arch height
  const archY = 430 + rand() * 140;     // arch baseline
  const archX = 500 + (rand() - 0.5) * 120; // arch center
  const band = 125 + rand() * 55;       // band thickness
  const x0 = 120, x1 = 880;
  const archAt = (x) => {
    const t = (x - x0) / (x1 - x0);
    return archY - archH * Math.sin(Math.PI * Math.min(1, Math.max(0, t)));
  };

  // the mark: one tiny graphite scribble, deliberately boring.
  // a short curved stroke, a few pixels long, same every time.
  function mark(x, y, tone) {
    const a = rand() * Math.PI * 2;
    const r = 2.2 + rand() * 1.6;
    const wob = (rand() - 0.5) * 1.8;
    const alpha = 0.45 + rand() * 0.35;
    ctx.strokeStyle = 'rgba(52,50,46,' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 1.15;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(
      x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6 + wob,
      x + Math.cos(a) * r, y + Math.sin(a) * r
    );
    ctx.stroke();
  }

  // fill the sheet on a jittered grid; coverage follows the arch.
  // dense areas get multiple overlapping marks: that overlap is what
  // builds the darks, the way a draftsman's hand does.
  const step = 9;
  for (let gy = 90; gy < 910; gy += step) {
    for (let gx = 90; gx < 910; gx += step) {
      const x = gx + (rand() - 0.5) * step * 0.9;
      const y = gy + (rand() - 0.5) * step * 0.9;
      // tone: gaussian falloff from the arch, windowed at the edges
      const d = (y - archAt(x)) / band;
      let tone = Math.exp(-d * d);
      const ex = Math.min(1, (x - 90) / 130, (910 - x) / 130);
      tone *= Math.max(0, Math.min(1, ex));
      // a whisper of tone everywhere, so the field never fully empties
      tone = 0.05 + 0.95 * tone;
      // the draftsman's hand: faint large-scale unevenness
      tone *= 0.85 + 0.3 * noise(x * 0.004 + y * 0.002);
      tone = Math.min(1, tone);
      const n = tone < 0.22 ? (rand() < tone * 4.5 ? 1 : 0) : 1 + Math.floor(tone * 2.4);
      for (let k = 0; k < n; k++) {
        mark(x + (rand() - 0.5) * 4, y + (rand() - 0.5) * 4, tone);
      }
    }
  }

  // paper grain
  for (let i = 0; i < 4200; i++) {
    const x = rand() * U, y = rand() * U, r = 0.5 + rand() * 1.3;
    ctx.fillStyle = rand() < 0.85
      ? 'rgba(90,74,52,' + (0.03 + rand() * 0.07).toFixed(3) + ')'
      : 'rgba(255,252,240,' + (0.04 + rand() * 0.05).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  // vignette
  const vg = ctx.createRadialGradient(U/2, U/2, U*0.32, U/2, U/2, U*0.75);
  vg.addColorStop(0, 'rgba(120,95,60,0)');
  vg.addColorStop(1, 'rgba(120,95,60,0.15)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, U, U);

  // wobbly plate frame
  ctx.strokeStyle = 'rgba(70,62,50,0.6)'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  const m = 64, S = 44, pts = [];
  const corners = [[m,m],[U-m,m],[U-m,U-m],[m,U-m]];
  for (let e = 0; e < 4; e++) {
    const [x0c,y0c] = corners[e], [x1c,y1c] = corners[(e+1)%4];
    for (let i = 0; i <= S; i++) {
      const t = i / S;
      const nx = x0c + (x1c-x0c)*t, ny = y0c + (y1c-y0c)*t;
      const off = (noise(e*97 + t*9 + 3) - 0.5) * 7;
      const ddx = x1c-x0c, ddy = y1c-y0c, L = Math.hypot(ddx,ddy) || 1;
      pts.push([nx + (-ddy/L)*off, ny + (ddx/L)*off]);
    }
  }
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (const [x,y] of pts) ctx.lineTo(x, y);
  ctx.closePath(); ctx.stroke();
}

fit();
draw();
document.addEventListener('click', () => {
  seed = (Math.random() * 1e9) >>> 0;
  history.replaceState(null, '', '?seed=' + seed);
  draw();
});
</script>
</body>
</html>
