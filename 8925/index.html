<!DOCTYPE html>
<html lang="utf-8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No8925 · Chord Orbits</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0d0b14; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(242,234,216,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for new orbits</div>
<script>
'use strict';
// No8925 Chord Orbits.
// Three concentric rings of points; every k-th pair joined by a hairline.
// k differs per ring, so one ring weaves a dense web while another draws a
// slow star polygon. Warm white thread on near-black, nothing else.
// The seed chooses point counts, steps, radii and phase; click for another.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '8925', 10) || 8925;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0d0b14';
const THREAD = '#f2ead8';

function compose(s) {
  const rnd = mulberry32(s);
  const rings = [];
  // Radii as shares of the piece size, jittered; phase per ring.
  const baseR = [0.30, 0.62, 0.94];
  for (let r = 0; r < 3; r++) {
    const n = 48 + ((rnd() * 48) | 0);          // 48-95 points
    // step k: 2 .. n/2, seeded; different k per ring -> different webs
    const k = 2 + ((rnd() * (n / 2 - 2)) | 0);
    rings.push({
      n,
      k,
      radius: baseR[r] * (0.97 + rnd() * 0.06),
      phase: rnd() * Math.PI * 2,
      alpha: 0.34 + rnd() * 0.22,
    });
  }
  return { rings };
}

function renderPiece(c, W, H, p) {
  c.fillStyle = GROUND;
  c.fillRect(0, 0, W, H);

  // Centered piece: ground is the page color, composition centers at any size.
  const S = Math.min(W, H) * 0.92;
  const cx = W / 2, cy = H / 2;

  c.lineWidth = 1;
  for (const ring of p.rings) {
    const R = ring.radius * S / 2;
    c.strokeStyle = THREAD;
    c.globalAlpha = ring.alpha;
    c.beginPath();
    for (let i = 0; i < ring.n; i++) {
      const a1 = ring.phase + (i / ring.n) * Math.PI * 2;
      const a2 = ring.phase + (((i + ring.k) % ring.n) / ring.n) * Math.PI * 2;
      c.moveTo(cx + Math.cos(a1) * R, cy + Math.sin(a1) * R);
      c.lineTo(cx + Math.cos(a2) * R, cy + Math.sin(a2) * R);
    }
    c.stroke();
  }
  // Pin the middle: one small filled dot per ring radius so the eye rests.
  c.globalAlpha = 0.9;
  c.fillStyle = THREAD;
  c.beginPath();
  c.arc(cx, cy, Math.max(1.5, S * 0.004), 0, Math.PI * 2);
  c.fill();
  c.globalAlpha = 1;
}

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  const p = compose(seed);
  renderPiece(ctx, w, h, p);
}

window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  draw();
});
draw();
</script>
</body>
</html>
