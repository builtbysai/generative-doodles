<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.348 Enid Engine</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0F0C; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.348 Enid Engine (emibeebuzz).
// After her named signature floral Enid, a moody twisty
// floral, slightly spooky: an ogee damask that grows.
// Vine tendrils extend inward from the frame edges along
// pointed-arch guide curves, small bone leaves unfold as
// the stems pass, and ember blooms scale open at the
// branch tips; then the growth recedes in exact reverse
// and begins again. The whole system is built once at
// load by a seeded recursive walker and stored as data:
// main stems follow ogee guides (a shared period, adjacent
// stems in anti-phase, so the stems interlace like a
// trellis), and each stem forks into bezier children that
// fork again. Every branch is generated in the left half
// of the field only and then mirrored across the centre
// axis, so the lattice is mirror-symmetric at every
// frame by construction. The loop is 28s seamless: grow
// forward for 14s, retract in exact reverse for 14s, so
// frame 28s is pixel-identical to frame 0. Watch-only:
// no interaction, no text, no chrome. Flat colour only:
// near-black ground, moss vines, bone leaves, ember
// blooms, nothing else.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0D0F0C', MOSS = '#7FB069', BONE = '#E8DCC8', EMBER = '#E4572E';
var PALETTE = [GROUND, MOSS, BONE, EMBER];
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 28, GROW = 14;        // seconds; grow then exact reverse
if (PALETTE.length !== 4) throw new Error('Enid Engine needs exactly 4 colours');
if (LOOP !== 28 || GROW * 2 !== LOOP) throw new Error('Enid Engine loop must be 28s, grow 14s + retract 14s');

// ---- seeded rng (fixed seed; no runtime randomness) ----
function RNG(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rng = RNG(58152);

// ---- ogee guide curves ----------------------------------
// One shared period so neighbouring stems undulate in a
// coordinated damask rhythm; adjacent entries run in
// anti-phase and interlace.
var PERIOD = 460;
function guideH(x0, yBase, len, amp, phase) {
  var pts = [], n = Math.max(10, Math.round(len / 8)), i, s;
  for (i = 0; i <= n; i++) {
    s = len * i / n;
    var env = 0.3 + 0.7 * Math.min(1, s / 70);
    pts.push({ x: x0 + s, y: yBase + amp * Math.sin(2 * Math.PI * s / PERIOD + phase) * env });
  }
  return pts;
}
function guideV(y0, xBase, len, dir, amp, phase) {
  var pts = [], n = Math.max(10, Math.round(len / 8)), i, s;
  for (i = 0; i <= n; i++) {
    s = len * i / n;
    var env = 0.3 + 0.7 * Math.min(1, s / 70);
    pts.push({ x: xBase + amp * Math.sin(2 * Math.PI * s / PERIOD + phase) * env, y: y0 + dir * s });
  }
  return pts;
}

// ---- branch records --------------------------------------
var branches = [];
function finishBranch(pts, w0, wTip, t0, t1, depth) {
  var cum = [0], i;
  for (i = 1; i < pts.length; i++) {
    var dx = pts[i].x - pts[i - 1].x, dy = pts[i].y - pts[i - 1].y;
    cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
  }
  var b = {
    pts: pts, cum: cum, total: cum[cum.length - 1],
    w0: w0, wTip: wTip, t0: t0, t1: t1, depth: depth,
    bloom: rng() < (depth === 0 ? 0.75 : 0.62),
    bloomR: depth === 0 ? 17 + rng() * 6 : (depth === 1 ? 13 + rng() * 5 : 10 + rng() * 4),
    bloomRot: rng() * Math.PI,
    leaves: []
  };
  var nl = depth === 0 ? 4 + Math.floor(rng() * 3) : (depth === 1 ? 3 + Math.floor(rng() * 2) : 2 + Math.floor(rng() * 2));
  for (i = 0; i < nl; i++) {
    b.leaves.push({ f: 0.2 + rng() * 0.72, side: rng() < 0.5 ? -1 : 1, len: Math.max(6, 9 + rng() * 6 - depth * 1.5) });
  }
  b.leaves.sort(function (a, c) { return a.f - c.f; });
  branches.push(b);
  return b;
}
function sampleAt(b, d) {
  if (d <= 0) return b.pts[0];
  if (d >= b.total) return b.pts[b.pts.length - 1];
  var lo = 0, hi = b.cum.length - 1;
  while (lo < hi - 1) { var mid = (lo + hi) >> 1; if (b.cum[mid] <= d) lo = mid; else hi = mid; }
  var u = (d - b.cum[lo]) / (b.cum[hi] - b.cum[lo]);
  return {
    x: b.pts[lo].x + (b.pts[hi].x - b.pts[lo].x) * u,
    y: b.pts[lo].y + (b.pts[hi].y - b.pts[lo].y) * u
  };
}
function tangentAt(b, d) {
  var p0 = sampleAt(b, Math.max(0, d - 5)), p1 = sampleAt(b, Math.min(b.total, d + 5));
  return Math.atan2(p1.y - p0.y, p1.x - p0.x);
}
// Fork a child branch off branch b at arc fraction f.
// The child is a cubic bezier leaving along a rotated
// tangent, with a sine wiggle along its normal for the
// twisty hand of the original. Points are kept inside
// the field (with a small bleed) by squashing toward the
// fork point on any axis that overshoots.
function clampAxis(pts, start, key, lo, hi) {
  var i, ext = start[key];
  for (i = 0; i < pts.length; i++) { if (key === 'x' ? pts[i].x > ext : pts[i].y > ext) ext = pts[i][key]; }
  var minV = start[key];
  for (i = 0; i < pts.length; i++) { if (pts[i][key] < minV) minV = pts[i][key]; }
  if (ext > hi && ext > start[key]) {
    var k1 = (hi - start[key]) / (ext - start[key]);
    for (i = 0; i < pts.length; i++) pts[i][key] = start[key] + (pts[i][key] - start[key]) * k1;
  }
  if (minV < lo && minV < start[key]) {
    var k2 = (lo - start[key]) / (minV - start[key]);
    for (i = 0; i < pts.length; i++) pts[i][key] = start[key] + (pts[i][key] - start[key]) * k2;
  }
}
function fork(b, f, depth) {
  var start = sampleAt(b, f * b.total);
  var ta = tangentAt(b, f * b.total);
  var side = rng() < 0.5 ? -1 : 1;
  var ang = ta + side * (0.5 + rng() * 0.45);
  var len = depth === 0 ? 150 + rng() * 130 : 90 + rng() * 80;
  var dirx = Math.cos(ang), diry = Math.sin(ang);
  var end = { x: start.x + dirx * len, y: start.y + diry * len };
  var p1 = { x: start.x + Math.cos(ta) * len * 0.4, y: start.y + Math.sin(ta) * len * 0.4 };
  var p2 = { x: end.x - dirx * len * 0.34, y: end.y - diry * len * 0.34 };
  var pts = [], n = 26, i, wob = rng() * Math.PI * 2, wobAmp = 3.5 + rng() * 3;
  for (i = 0; i <= n; i++) {
    var u = i / n, v = 1 - u;
    var x = v * v * v * start.x + 3 * v * v * u * p1.x + 3 * v * u * u * p2.x + u * u * u * end.x;
    var y = v * v * v * start.y + 3 * v * v * u * p1.y + 3 * v * u * u * p2.y + u * u * u * end.y;
    var dx = 3 * v * v * (p1.x - start.x) + 6 * v * u * (p2.x - p1.x) + 3 * u * u * (end.x - p2.x);
    var dy = 3 * v * v * (p1.y - start.y) + 6 * v * u * (p2.y - p1.y) + 3 * u * u * (end.y - p2.y);
    var dl = Math.sqrt(dx * dx + dy * dy) || 1;
    var off = Math.sin(u * Math.PI * 2.1 + wob) * wobAmp * (1 - u * 0.4);
    pts.push({ x: x + (-dy / dl) * off, y: y + (dx / dl) * off });
  }
  clampAxis(pts, start, 'x', -30, 716);
  clampAxis(pts, start, 'y', -24, 924);
  var t0 = b.t0 + f * (b.t1 - b.t0);
  var t1 = Math.min(0.99, t0 + 0.15 + rng() * 0.2);
  return finishBranch(pts, Math.max(2.2, b.wTip + 1.4), 1.1, t0, t1, depth + 1);
}

// ---- build the left half, then mirror ---------------------
var mains = [], i, j;
var leftY = [78, 262, 450, 638, 822];
for (i = 0; i < leftY.length; i++) {
  var lenH = 470 + rng() * 180;
  mains.push(finishBranch(
    guideH(0, leftY[i], lenH, 64 + rng() * 30, (i % 2) * Math.PI + (rng() * 0.5 - 0.25)),
    8.5, 1.6, rng() * 0.04, Math.min(0.92, 0.45 + 0.45 * (lenH / 650) + rng() * 0.05), 0));
}
var topX = [120, 330, 540];
for (i = 0; i < topX.length; i++) {
  var lenT = 330 + rng() * 140;
  mains.push(finishBranch(
    guideV(0, topX[i], lenT, 1, 62 + rng() * 26, (i % 2) * Math.PI + (rng() * 0.5 - 0.25)),
    8, 1.6, rng() * 0.04, Math.min(0.9, 0.45 + 0.45 * (lenT / 650) + rng() * 0.05), 0));
}
var botX = [170, 380, 590];
for (i = 0; i < botX.length; i++) {
  var lenB = 300 + rng() * 130;
  mains.push(finishBranch(
    guideV(DH, botX[i], lenB, -1, 62 + rng() * 26, ((i + 1) % 2) * Math.PI + (rng() * 0.5 - 0.25)),
    8, 1.6, rng() * 0.04, Math.min(0.9, 0.45 + 0.45 * (lenB / 650) + rng() * 0.05), 0));
}
var children = [];
for (i = 0; i < mains.length; i++) {
  children.push(fork(mains[i], 0.34 + rng() * 0.1, 0));
  children.push(fork(mains[i], 0.6 + rng() * 0.12, 0));
  if (rng() < 0.3) children.push(fork(mains[i], 0.82 + rng() * 0.06, 0));
}
for (i = 0; i < children.length; i++) {
  if (rng() < 0.35) fork(children[i], 0.45 + rng() * 0.2, 1);
}
var halfCount = branches.length;
for (i = 0; i < halfCount; i++) {
  var src = branches[i];
  var mpts = [];
  for (j = 0; j < src.pts.length; j++) mpts.push({ x: DW - src.pts[j].x, y: src.pts[j].y });
  var mleaves = [];
  for (j = 0; j < src.leaves.length; j++) mleaves.push({ f: src.leaves[j].f, side: -src.leaves[j].side, len: src.leaves[j].len });
  branches.push({
    pts: mpts, cum: src.cum.slice(), total: src.total,
    w0: src.w0, wTip: src.wTip, t0: src.t0, t1: src.t1, depth: src.depth,
    bloom: src.bloom, bloomR: src.bloomR, bloomRot: -src.bloomRot, leaves: mleaves
  });
}
if (branches.length !== halfCount * 2) throw new Error('Enid Engine branches must mirror in pairs');

// ---- drawing ----------------------------------------------
function subPts(b, d0, d1) {
  var arr = [sampleAt(b, d0)], k;
  for (k = 0; k < b.pts.length; k++) { if (b.cum[k] > d0 && b.cum[k] < d1) arr.push(b.pts[k]); }
  arr.push(sampleAt(b, d1));
  return arr;
}
function leafPath(x, y, a, len, wf) {
  var dx = Math.cos(a), dy = Math.sin(a);
  var px = -dy, py = dx, w = len * wf;
  var tx = x + dx * len, ty = y + dy * len;
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + dx * len * 0.4 + px * w, y + dy * len * 0.4 + py * w, tx, ty);
  ctx.quadraticCurveTo(x + dx * len * 0.4 - px * w, y + dy * len * 0.4 - py * w, x, y);
}
function drawBloom(x, y, R, rot) {
  if (R < 1.2) return;
  var k;
  ctx.fillStyle = EMBER;
  ctx.beginPath();
  for (k = 0; k < 8; k++) leafPath(x, y, rot + k * Math.PI / 4, R, 0.42);
  ctx.fill();
  ctx.beginPath();
  for (k = 0; k < 5; k++) leafPath(x, y, rot + Math.PI / 5 + k * 2 * Math.PI / 5, R * 0.56, 0.42);
  ctx.fill();
  ctx.fillStyle = GROUND;
  ctx.beginPath();
  ctx.arc(x, y, R * 0.15, 0, Math.PI * 2);
  ctx.fill();
}
var STEM_BANDS = 6;
function drawBranch(b, G) {
  var p = (G - b.t0) / (b.t1 - b.t0);
  if (p <= 0) return;
  if (p > 1) p = 1;
  var band, k;
  ctx.strokeStyle = MOSS;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (band = 0; band < STEM_BANDS; band++) {
    var f0 = band / STEM_BANDS, f1 = (band + 1) / STEM_BANDS;
    if (f0 >= p) break;
    var ff1 = Math.min(f1, p);
    var pts = subPts(b, f0 * b.total, ff1 * b.total);
    if (pts.length < 2) continue;
    ctx.lineWidth = Math.max(0.8, b.w0 + (b.wTip - b.w0) * ((f0 + ff1) / 2));
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
    ctx.stroke();
  }
  // Leaves unfold just behind the growth front.
  ctx.fillStyle = BONE;
  ctx.beginPath();
  var anyLeaf = false;
  for (k = 0; k < b.leaves.length; k++) {
    var lf = b.leaves[k];
    var sl = (p - lf.f) / 0.05;
    if (sl <= 0) continue;
    if (sl > 1) sl = 1;
    var d = lf.f * b.total;
    var base = sampleAt(b, d);
    var ta = tangentAt(b, d);
    leafPath(base.x, base.y, ta + lf.side * 0.85, lf.len * sl, 0.36);
    anyLeaf = true;
  }
  if (anyLeaf) ctx.fill();
  // The tip bloom swells open as the branch completes.
  if (b.bloom) {
    var sb = (p - 0.8) / 0.2;
    if (sb > 0) {
      if (sb > 1) sb = 1;
      sb = sb * sb * (3 - 2 * sb);
      var tip = sampleAt(b, b.total);
      drawBloom(tip.x, tip.y, b.bloomR * sb, b.bloomRot);
    }
  }
}
function draw(t) {
  var ph = t % LOOP;
  var G = ph <= GROW ? ph / GROW : (LOOP - ph) / GROW;
  var i;
  for (i = 0; i < branches.length; i++) drawBranch(branches[i], G);
}

// ---- frame -------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Cover-fit: this is a field composition, full bleed at
  // every aspect; the design space is scaled to cover and
  // centred, so edges crop rather than letterbox.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  draw(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
// Frame one starts developed: exactly 10.9s into the 28s
// cycle, growth at about 78 percent, blooms open at many
// tips. The first frame is drawn at this fixed phase,
// never from a wall clock, so a render of the script
// always lands on the same frame; the live loop then
// advances from the same anchor by elapsed time.
var T_OFFSET = 10.9;
resize();
frame(T_OFFSET);
if (typeof requestAnimationFrame === 'function') {
  var loadMs = Date.now();
  var loop = function () {
    frame(T_OFFSET + (Date.now() - loadMs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
