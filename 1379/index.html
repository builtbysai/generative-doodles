<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>El Aliso Burns</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded randomness (mulberry32, never unseeded) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var SEED = 1379000;
  // Value-noise lattice hash: deterministic function of (x, y).
  function hash2(x, y) {
    var h = Math.sin(x * 127.1 + y * 311.7 + SEED * 0.013) * 43758.5453;
    return h - Math.floor(h);
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var a = hash2(xi, yi), b = hash2(xi + 1, yi);
    var c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    var u = smooth(xf), v = smooth(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  // Per-index seeded value in [0,1), from one mulberry stream.
  var rng = mulberry32(SEED);
  var PRE = [];
  for (var i = 0; i < 4096; i++) PRE.push(rng());

  // ---------- viewport + phone detection ----------
  function isPhone() {
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : 0;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : 0;
    if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
    var w = sizeW(), h = sizeH();
    return h > w * 1.15;
  }
  function sizeW() {
    if (typeof window !== 'undefined' && window.visualViewport) return window.visualViewport.width;
    if (typeof window !== 'undefined' && window.innerWidth) return window.innerWidth;
    return canvas.width || 720;
  }
  function sizeH() {
    if (typeof window !== 'undefined' && window.visualViewport) return window.visualViewport.height;
    if (typeof window !== 'undefined' && window.innerHeight) return window.innerHeight;
    return canvas.height || 720;
  }
  var W = 0, H = 0;
  function resize() {
    W = sizeW(); H = sizeH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  resize();
  if (typeof document !== 'undefined' && document.body) {
    document.body.style.background = '#1a1a1a';
    document.body.style.margin = '0';
    document.body.style.overflow = 'hidden';
  }

  // ---------- interaction: drag raises / lowers flame intensity ----------
  var drags = []; // {t, dy}
  var dragId = null, lastY = 0;
  function onDown(e) {
    dragId = (e.pointerId !== undefined) ? e.pointerId : 0;
    lastY = e.clientY;
  }
  function onMove(e) {
    if (dragId === null) return;
    if (e.pointerId !== undefined && e.pointerId !== dragId) return;
    var dy = e.clientY - lastY;
    lastY = e.clientY;
    if (dy !== 0) drags.push({ t: nowT, dy: dy });
  }
  function onUp(e) {
    if (e.pointerId !== undefined && e.pointerId !== dragId) return;
    dragId = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  // Flame intensity: closed-form over recorded drags. Drag up (dy < 0) raises,
  // drag down lowers; each drag's effect decays with tau 10 s toward neutral 1.
  function intensityAt(t) {
    var v = 1;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (t < d.t) continue;
      v += (-d.dy) * 0.004 * Math.exp(-(t - d.t) / 10);
    }
    if (v < 0.3) v = 0.3;
    if (v > 2.2) v = 2.2;
    return v;
  }

  // ---------- loop timing ----------
  var LOOP = 24; // seconds
  function easeInOut(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return t * t * (3 - 2 * t);
  }
  // Burn fraction: 0 -> 1 across 0-16 s, ember hold 16-20 s, reconstitute 20-24 s.
  function burnAt(lt) {
    if (lt < 16) return Math.pow(lt / 16, 0.9);
    if (lt < 20) return 1;
    return 1 - (lt - 20) / 4;
  }
  // Torch figure horizontal position; null when offscreen.
  function torchXAt(lt) {
    var on = 0.86, off = 1.15;
    if (lt < 2 || lt >= 22) return null;
    if (lt < 6) return off + (on - off) * easeInOut((lt - 2) / 4);
    if (lt < 18) return on + Math.sin(lt * 0.9) * 0.004;
    return on + (off - on) * easeInOut((lt - 18) / 4);
  }

  // ---------- drawing helpers ----------
  function shade(g) { // g in [0,1] -> grayscale palette step
    if (g < 0.25) return '#1a1a1a';
    if (g < 0.5) return '#6b6b6b';
    if (g < 0.8) return '#d6d6d6';
    return '#ececec';
  }

  function draw(t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var b = burnAt(lt);
    var inten = intensityAt(t);
    var u = Math.min(W, H); // scene unit
    var feetY = 0.80 * H;
    var bodyH = 0.52 * H;
    var ex = 0.32 * W; // effigy center x
    var burnY = feetY - b * bodyH;

    // Gate-weave: small closed-form offset of the whole scene.
    var weaveX = (Math.sin(t * 1.7) + Math.sin(t * 3.1 + 1.3)) * 1.5;
    var weaveY = (Math.sin(t * 2.3 + 0.7) + Math.sin(t * 4.1)) * 1.0;

    ctx.save();
    ctx.translate(weaveX, weaveY);
    // Sky / field.
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-4, -4, W + 8, H + 8);

    // Water band behind the figures: coarse bark noise (scale 1).
    var waterTop = 0.42 * H, waterBot = 0.78 * H;
    ctx.fillStyle = '#d6d6d6';
    ctx.fillRect(0, waterTop, W, waterBot - waterTop);
    for (var row = 0; row < 26; row++) {
      var y = waterTop + (row + 0.5) * (waterBot - waterTop) / 26;
      for (var sx = 0; sx < 22; sx++) {
        var x0 = sx * W / 22;
        var n = vnoise(sx * 0.9 + row * 0.13, row * 0.55);
        ctx.fillStyle = shade(n);
        ctx.globalAlpha = 0.30;
        ctx.fillRect(x0, y, W / 22 * (0.55 + 0.45 * hash2(sx * 3 + 1, row)), 2);
      }
    }
    ctx.globalAlpha = 1;
    // Horizon line.
    ctx.fillStyle = '#6b6b6b';
    ctx.fillRect(0, waterTop, W, 1);

    // Shore / ground band: medium bark noise (scale 2).
    ctx.fillStyle = '#6b6b6b';
    ctx.fillRect(0, waterBot, W, H - waterBot);
    for (var gi = 0; gi < 260; gi++) {
      var gx = PRE[(gi * 7) % 4096] * W;
      var gy = waterBot + PRE[(gi * 13 + 5) % 4096] * (H - waterBot);
      var gn = vnoise(gx * 0.02, gy * 0.05);
      ctx.fillStyle = shade(gn);
      ctx.globalAlpha = 0.35;
      ctx.fillRect(gx, gy, 3, 2);
    }
    ctx.globalAlpha = 1;

    // ---- Effigy: dark silhouette underlay (reads against light water) ----
    var headR = 0.055 * u;
    var headY = feetY - 0.92 * bodyH;
    var torsoTop = feetY - 0.82 * bodyH, torsoBot = feetY - 0.50 * bodyH;
    var halfW = 0.055 * u;
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.moveTo(ex - halfW - 5, torsoBot);
    ctx.lineTo(ex - halfW - 5, torsoTop);
    ctx.lineTo(ex + halfW + 5, torsoTop);
    ctx.lineTo(ex + halfW + 5, torsoBot);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ex, headY, headR + 5, 0, Math.PI * 2);
    ctx.fill();
    // Limbs as thick dark strokes.
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineCap = 'round';
    function limb(x1, y1, x2, y2, wdt) {
      ctx.lineWidth = wdt;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    var shoulderY = feetY - 0.76 * bodyH;
    var handY = feetY - 0.52 * bodyH;
    limb(ex - halfW, shoulderY, ex - 0.11 * u, handY, 0.030 * u);
    limb(ex + halfW, shoulderY, ex + 0.11 * u, handY, 0.030 * u);
    limb(ex - halfW * 0.5, torsoBot, ex - 0.035 * u, feetY, 0.034 * u);
    limb(ex + halfW * 0.5, torsoBot, ex + 0.035 * u, feetY, 0.034 * u);

    // ---- Effigy straw strands (fine bark noise, scale 3) ----
    // Strands are drawn only above the burn line; below it the effigy is gone.
    function strand(x, y, len, ang, col, alpha) {
      if (y > burnY + 2) return; // consumed
      ctx.strokeStyle = col;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = Math.max(1, 0.004 * u);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.sin(ang) * len, y + Math.cos(ang) * len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    var sIdx = 0;
    function bundle(cx, yTop, yBot, hw, count, seedBase) {
      for (var k = 0; k < count; k++) {
        var jx = (PRE[(seedBase + k * 3) % 4096] - 0.5) * 2 * hw;
        var jy = PRE[(seedBase + k * 5 + 1) % 4096] * (yBot - yTop) + yTop;
        var n = vnoise((cx + jx) * 0.06, jy * 0.06);
        var col = shade(n);
        // Charred band just above the burn line darkens.
        if (jy > burnY - 0.03 * bodyH) col = '#6b6b6b';
        strand(cx + jx, jy, 0.030 * u * (0.6 + PRE[(seedBase + k * 7 + 2) % 4096]),
          (PRE[(seedBase + k * 11 + 3) % 4096] - 0.5) * 0.5, col, 0.9);
        sIdx++;
      }
    }
    bundle(ex, torsoTop, torsoBot, halfW, 90, 100);
    bundle(ex, headY - headR, headY + headR, headR, 40, 900);
    bundle(ex - halfW * 0.5, torsoBot, feetY, 0.030 * u, 34, 1500);
    bundle(ex + halfW * 0.5, torsoBot, feetY, 0.030 * u, 34, 1800);
    // Arms: diagonal strand runs.
    function armBundle(x1, y1, x2, y2, count, seedBase) {
      for (var k = 0; k < count; k++) {
        var tt = PRE[(seedBase + k * 3) % 4096];
        var px = x1 + (x2 - x1) * tt;
        var py = y1 + (y2 - y1) * tt;
        var off = (PRE[(seedBase + k * 5 + 1) % 4096] - 0.5) * 0.030 * u;
        var n = vnoise(px * 0.06, py * 0.06);
        var col = shade(n);
        if (py > burnY - 0.03 * bodyH) col = '#6b6b6b';
        strand(px + off, py, 0.026 * u, 0.6, col, 0.9);
      }
    }
    armBundle(ex - halfW, shoulderY, ex - 0.11 * u, handY, 26, 2100);
    armBundle(ex + halfW, shoulderY, ex + 0.11 * u, handY, 26, 2300);

    // ---- Ember clusters at and below the burn line ----
    var emberBase = (b >= 1) ? feetY : burnY;
    for (var ei = 0; ei < 46; ei++) {
      var eSeed = 3000 + ei * 7;
      var exx = ex + (PRE[eSeed % 4096] - 0.5) * 0.16 * u;
      var eyy = emberBase + PRE[(eSeed + 3) % 4096] * Math.min(0.06 * H, feetY - emberBase + 0.05 * H);
      if (eyy > feetY + 2) eyy = feetY - PRE[(eSeed + 5) % 4096] * 0.03 * H;
      var pulse = hash2(ei, Math.floor(t * 4));
      ctx.fillStyle = pulse > 0.45 ? '#ececec' : '#d6d6d6';
      ctx.globalAlpha = 0.35 + 0.55 * pulse;
      var es = 1 + PRE[(eSeed + 9) % 4096] * 3;
      ctx.fillRect(exx, eyy, es, es);
    }
    ctx.globalAlpha = 1;

    // ---- Flames: stored-history tongues above the burn line ----
    var flameCount = Math.round(22 * inten);
    var flameH = 0.16 * u * inten * (b < 1 ? (0.6 + 0.8 * Math.sin(Math.PI * Math.min(b * 1.2, 1))) : 0.35);
    for (var fi = 0; fi < flameCount; fi++) {
      var fSeed = 4000 + fi * 13;
      var fx = ex + (PRE[fSeed % 4096] - 0.5) * 0.13 * u;
      var flick = hash2(fi, Math.floor(t * 8));
      var fh = flameH * (0.5 + flick);
      var fBase = emberBase;
      ctx.fillStyle = (fi % 3 === 0) ? '#ececec' : '#d6d6d6';
      ctx.globalAlpha = 0.30 + 0.22 * flick;
      ctx.beginPath();
      ctx.moveTo(fx - 0.005 * u, fBase);
      ctx.lineTo(fx + 0.005 * u, fBase);
      ctx.lineTo(fx + (PRE[(fSeed + 4) % 4096] - 0.5) * 0.012 * u, fBase - fh);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- Torch-bearing figure at the water's edge ----
    var txFrac = torchXAt(lt);
    if (txFrac !== null) {
      var tx = txFrac * W;
      var tFeet = feetY;
      var tH = 0.42 * H;
      var tHeadY = tFeet - 0.92 * tH;
      var tHeadR = 0.045 * u;
      var gesture = (lt >= 6 && lt < 18) ? Math.sin(lt * 0.9) * 0.35 : 0;
      ctx.fillStyle = '#1a1a1a';
      ctx.strokeStyle = '#d6d6d6';
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1.5;
      // Body silhouette with a light outline so it reads on both bands.
      ctx.beginPath();
      ctx.moveTo(tx - 0.022 * u, tFeet);
      ctx.lineTo(tx - 0.022 * u, tFeet - 0.55 * tH);
      ctx.lineTo(tx + 0.022 * u, tFeet - 0.55 * tH);
      ctx.lineTo(tx + 0.022 * u, tFeet);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(tx, tHeadY, tHeadR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // Legs.
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 0.020 * u;
      ctx.beginPath();
      ctx.moveTo(tx - 0.010 * u, tFeet - 0.55 * tH);
      ctx.lineTo(tx - 0.016 * u, tFeet);
      ctx.moveTo(tx + 0.010 * u, tFeet - 0.55 * tH);
      ctx.lineTo(tx + 0.016 * u, tFeet);
      ctx.stroke();
      // Raised arm + torch, gesturing.
      var armAng = -0.9 + gesture;
      var hx = tx + Math.cos(armAng) * 0.075 * u;
      var hy = (tFeet - 0.72 * tH) + Math.sin(armAng) * 0.075 * u;
      ctx.strokeStyle = '#d6d6d6';
      ctx.lineWidth = Math.max(1.5, 0.010 * u);
      ctx.beginPath();
      ctx.moveTo(tx + 0.020 * u, tFeet - 0.70 * tH);
      ctx.lineTo(hx, hy);
      ctx.stroke();
      // Torch stick + flame.
      ctx.strokeStyle = '#ececec';
      ctx.lineWidth = Math.max(1.5, 0.006 * u);
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(hx + 0.008 * u, hy - 0.030 * u);
      ctx.stroke();
      var tf = hash2(77, Math.floor(t * 8));
      ctx.fillStyle = '#ececec';
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(hx + 0.008 * u - 0.008 * u, hy - 0.030 * u);
      ctx.lineTo(hx + 0.008 * u + 0.008 * u, hy - 0.030 * u);
      ctx.lineTo(hx + 0.008 * u + (tf - 0.5) * 0.006 * u, hy - 0.030 * u - (0.020 + tf * 0.014) * u);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ---- 16mm grain: seeded dots keyed by quantized time ----
    var qt = Math.floor(t * 4);
    for (var di = 0; di < 220; di++) {
      var on = hash2(di * 3 + 1, qt);
      if (on < 0.5) continue;
      ctx.fillStyle = '#ececec';
      ctx.globalAlpha = 0.07;
      ctx.fillRect(PRE[(di * 7) % 4096] * W, PRE[(di * 11 + 2) % 4096] * H, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;

    // Vignette edges as flat-alpha rects (no gradients).
    ctx.fillStyle = '#1a1a1a';
    ctx.globalAlpha = 0.18;
    var vg = 0.035 * u;
    ctx.fillRect(0, 0, W, vg);
    ctx.fillRect(0, H - vg, W, vg);
    ctx.fillRect(0, 0, vg, H);
    ctx.fillRect(W - vg, 0, vg, H);
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  // ---------- boot: frame one is draw(0); clock starts with the rAF loop ----------
  var nowT = 0;
  var booted = false;
  draw(0);
  var startTs = null;
  function loop(ts) {
    if (startTs === null) startTs = ts;
    nowT = (ts - startTs) / 1000;
    draw(nowT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
