<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№88 · Sphere Tiling</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFFFFF; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(17,17,17,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to turn the sphere</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.88 Sphere Tiling: graticule every 15 deg plus icosahedron edges, loop 60s
let dragRX=0, dragRY=0, dragging=false, lastPt=null, baseRY=0;
function icoEdges(){
  const phi=(1+Math.sqrt(5))/2; let v=[[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]];
  v=v.map(p=>{ const l=Math.hypot(p[0],p[1],p[2]); return [p[0]/l,p[1]/l,p[2]/l]; });
  let edges=[], minD=1e9;
  for(let i=0;i<12;i++) for(let j=i+1;j<12;j++){ const d=Math.hypot(v[i][0]-v[j][0],v[i][1]-v[j][1],v[i][2]-v[j][2]); if(d<minD) minD=d; }
  for(let i=0;i<12;i++) for(let j=i+1;j<12;j++){ const d=Math.hypot(v[i][0]-v[j][0],v[i][1]-v[j][1],v[i][2]-v[j][2]); if(Math.abs(d-minD)<0.01) edges.push([v[i],v[j]]); }
  return edges;
}
const ICO=icoEdges();
function rot(p,ax,ay){ const cx=Math.cos(ax), sx=Math.sin(ax), cy=Math.cos(ay), sy=Math.sin(ay); let y=p[1]*cx-p[2]*sx, z=p[1]*sx+p[2]*cx; let x=p[0]*cy+z*sy; z=-p[0]*sy+z*cy; return [x,y,z]; }
function drawSegs(segs,cx,cy,R,ax,ay){
  for(const seg of segs){ let prev=null, prevZ=0;
    for(const p of seg){ const q=rot(p,ax,ay); const X=cx+q[0]*R, Y=cy+q[1]*R;
      if(prev){ ctx.strokeStyle = (q[2]+prevZ)/2<0 ? 'rgba(17,17,17,0.30)' : 'rgba(17,17,17,1)'; ctx.beginPath(); ctx.moveTo(prev[0],prev[1]); ctx.lineTo(X,Y); ctx.stroke(); }
      prev=[X,Y]; prevZ=q[2]; } }
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); const t=nowMs/1000;
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,w,h);
  const cx=w/2, cy=h/2, R=Math.min(w,h)*0.35;
  const ay=(t/60)*Math.PI*2 + dragRY, ax=0.42+dragRX;
  ctx.lineWidth=1;
  let segs=[];
  for(let lat=-75; lat<=75; lat+=15){ const la=lat*Math.PI/180, seg=[]; for(let k=0;k<=72;k++){ const lo=k/72*Math.PI*2; seg.push([Math.cos(la)*Math.cos(lo), Math.sin(la), Math.cos(la)*Math.sin(lo)]); } segs.push(seg); }
  for(let lon=0; lon<180; lon+=15){ const lo=lon*Math.PI/180, seg=[]; for(let k=0;k<=72;k++){ const th=k/72*Math.PI*2; seg.push([Math.cos(th)*Math.cos(lo), Math.sin(th), Math.cos(th)*Math.sin(lo)]); } segs.push(seg); }
  drawSegs(segs,cx,cy,R,ax,ay);
  // icosa edges (subdivided so rotation curves them correctly on projection: straight chords are fine orthographically)
  for(const e of ICO){ const a=rot(e[0],ax,ay), b=rot(e[1],ax,ay); ctx.strokeStyle=((a[2]+b[2])/2<0)?'rgba(17,17,17,0.30)':'rgba(17,17,17,1)'; ctx.beginPath(); ctx.moveTo(cx+a[0]*R,cy+a[1]*R); ctx.lineTo(cx+b[0]*R,cy+b[1]*R); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.strokeStyle='#111111'; ctx.stroke();
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; lastPt=[e.clientX,e.clientY]; });
canvas.addEventListener('pointermove',e=>{ if(!dragging||!lastPt) return; dragRY+=(e.clientX-lastPt[0])*0.008; dragRX+=(e.clientY-lastPt[1])*0.008; dragRX=clamp(dragRX,-1.1,1.1); lastPt=[e.clientX,e.clientY]; });
function endP(){ dragging=false; lastPt=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(9000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
