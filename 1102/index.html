<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zephyr's App — №1102</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0C10; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
 * №1102 "Zephyr's App" — onformative study block OF7 (the Zephyr tool, 2017).
 *
 * The deliverable is the instrument, not the sculpture: a 60 m ceiling band
 * of wind-blown steel seen from below — sixty blade segments whose angles
 * follow a seeded wind field — shown mid-authorship, with faint cyan control
 * ghosts hovering at six key segments, still tuning the wind. A 45 s weather
 * loop (calm, gust, storm, calm) reshapes the band. Dragging composes the
 * wind: horizontal sets its direction, vertical its gust strength. Every
 * angle is a closed-form function of t and the recorded drag events — no
 * integrated state. Watch-only by default. Silent.
 */

var LOOP = 45;          // weather loop, seconds, seamless
var PHASE = 16;         // fixed first-frame phase: the gust, band mid-ripple
var NSEG = 60;          // blade segments in the band
var GHOSTS = [5, 15, 25, 34, 44, 54];

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- palette ---------- */
var GROUND = '#0A0C10';
var STEEL = [232, 228, 218];        // #E8E4DA warm-white steel
var STEEL_DARK = [148, 140, 126];   // shaded steel tone
var WINDLINE = [138, 155, 168];     // #8A9BA8
var GHOST = [74, 227, 255];         // #4AE3FF
var WHITE = [255, 255, 255];

function rgba(rgb, a) {
  return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')';
}
function mix(a, b, k) {
  return [Math.round(a[0] + (b[0] - a[0]) * k),
          Math.round(a[1] + (b[1] - a[1]) * k),
          Math.round(a[2] + (b[2] - a[2]) * k)];
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function sstep(p) { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); }

/* ---------- seeded rng (layout only) ---------- */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1102);

/* streamline seeds */
var STREAMS = [];
for (var si = 0; si < 16; si++) {
  STREAMS.push({ x: rng(), y: rng(), a: 0.10 + rng() * 0.16 });
}
/* per-segment jitter */
var SEGJ = [];
for (var sj = 0; sj < NSEG; sj++) SEGJ.push(rng());

/* ---------- sizing / phone detection ---------- */
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  canvas.width = W; canvas.height = H;
  var smin = Math.min(window.screen.width, window.screen.height);
  PHONE = smin < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
window.addEventListener('resize', resize);
resize();

/* ---------- weather: 45 s loop, calm -> gust -> storm -> calm ---------- */
function bump(lt, c, w) {
  var d = (lt - c) / w;
  if (d <= -1 || d >= 1) return 0;
  return 0.5 + 0.5 * Math.cos(Math.PI * d);
}
function weather(t) {
  var lt = ((t % LOOP) + LOOP) % LOOP;
  var env = 0.30 + 0.45 * bump(lt, 13, 8) + 0.75 * bump(lt, 27, 9.5);
  return clamp(env, 0, 1.2);
}

/* ---------- wind field: seeded sine curl, closed-form in t ---------- */
function fieldAngle(x, y, t, strength) {
  var u = x / W, v = y / H;
  var a = 0.90 * Math.sin(u * 5.3 + t * 0.21 + 0.7)
        + 0.70 * Math.sin(v * 6.1 - t * 0.16 + 2.3)
        + 0.50 * Math.sin((u + v) * 3.7 + t * 0.09 + 4.6)
        + 0.35 * Math.sin(u * 11.0 - v * 7.0 + t * (0.18 + 0.22 * strength));
  var drift = 0.15 * Math.sin(t * 2 * Math.PI / LOOP);
  return a * 0.62 * (0.45 + 0.55 * strength) + drift;
}

/* ---------- drag events: the recorded wind override ---------- */
var dragEvents = [];   // {t0, t1|null, dirOff, str}
var currentT = PHASE;

function overrideAt(t) {
  if (!dragEvents.length) return { w: 0, dirOff: 0, str: 0 };
  var e = dragEvents[dragEvents.length - 1];
  var w;
  if (e.t1 === null) {
    w = sstep((t - e.t0) / 1.0);
  } else {
    var wIn = sstep((e.t1 - e.t0) / 1.0);
    var p = clamp((t - e.t1) / 2.5, 0, 1);
    w = wIn * (0.5 + 0.5 * Math.cos(Math.PI * p));
  }
  return { w: w, dirOff: e.dirOff, str: e.str };
}

function pointerPos(ev) {
  var r = canvas.getBoundingClientRect();
  var cx = (ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0));
  var cy = (ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0));
  return { x: (cx - r.left) * (W / (r.width || W)), y: (cy - r.top) * (H / (r.height || H)) };
}
var dragStart = null;
function dragBegin(ev) {
  var p = pointerPos(ev);
  dragStart = p;
  dragEvents.push({ t0: currentT, t1: null, dirOff: 0, str: weather(currentT) });
  if (dragEvents.length > 24) dragEvents.shift();
}
function dragMove(ev) {
  if (!dragStart || !dragEvents.length) return;
  var e = dragEvents[dragEvents.length - 1];
  if (e.t1 !== null) return;
  var p = pointerPos(ev);
  e.dirOff = clamp((p.x - dragStart.x) / W, -1, 1) * 1.05;
  e.str = clamp(0.62 + (dragStart.y - p.y) / (0.5 * H) * 0.8, 0.05, 1.25);
}
function dragEnd() {
  if (!dragEvents.length) return;
  var e = dragEvents[dragEvents.length - 1];
  if (e.t1 === null) e.t1 = currentT;
  dragStart = null;
}
if (typeof window.PointerEvent !== 'undefined') {
  canvas.addEventListener('pointerdown', dragBegin);
  window.addEventListener('pointermove', dragMove);
  window.addEventListener('pointerup', dragEnd);
  window.addEventListener('pointercancel', dragEnd);
} else {
  canvas.addEventListener('mousedown', dragBegin);
  window.addEventListener('mousemove', dragMove);
  window.addEventListener('mouseup', dragEnd);
  canvas.addEventListener('touchstart', dragBegin);
  window.addEventListener('touchmove', dragMove);
  window.addEventListener('touchend', dragEnd);
}

/* ---------- geometry of the band ---------- */
function segCenter(i, t) {
  var u = (i + 0.5) / NSEG;
  var y = H * (0.34 + 0.085 * Math.sin(u * 4.4 + 0.5) + 0.030 * Math.sin(u * 9.1 + 1.2));
  y += H * 0.008 * Math.sin(t * 0.5 + u * 6.0);
  return { x: u * W, y: y, u: u };
}
function segAngle(i, t, strength, ov) {
  var c = segCenter(i, t);
  var a = fieldAngle(c.x, c.y, t, strength);
  /* ripple travelling along the band; speed and depth grow with strength */
  a += (0.10 + 0.30 * strength) * Math.sin(c.u * 14.0 - t * (1.1 + 1.6 * strength) + SEGJ[i] * 1.3);
  a += ov.dirOff * ov.w;
  return a;
}

/* ---------- drawing ---------- */
function drawBlade(cx, cy, ang, len, wid) {
  var dx = Math.cos(ang), dy = Math.sin(ang);
  var px = -dy, py = dx;                       // in-plane perpendicular
  var hx = dx * len / 2, hy = dy * len / 2;
  /* brightness by angle to a fixed light (from upper left) */
  var b = 0.5 + 0.5 * Math.cos(ang - (-0.9));
  ctx.lineCap = 'round';
  /* body: shaded steel tone */
  ctx.strokeStyle = rgba(mix(STEEL_DARK, STEEL, 0.25 + 0.65 * b), 0.96);
  ctx.lineWidth = wid;
  ctx.beginPath();
  ctx.moveTo(cx - hx, cy - hy);
  ctx.lineTo(cx + hx, cy + hy);
  ctx.stroke();
  /* lit face: narrower pass offset toward the light side */
  var off = wid * 0.17;
  ctx.strokeStyle = rgba(mix(STEEL_DARK, STEEL, 0.45 + 0.55 * b), 0.9);
  ctx.lineWidth = Math.max(1, wid * 0.58);
  ctx.beginPath();
  ctx.moveTo(cx - hx + px * off, cy - hy + py * off);
  ctx.lineTo(cx + hx + px * off, cy + hy + py * off);
  ctx.stroke();
  /* highlight spine */
  ctx.strokeStyle = rgba(WHITE, 0.18 + 0.38 * b);
  ctx.lineWidth = Math.max(1, wid * 0.15);
  ctx.beginPath();
  ctx.moveTo(cx - hx + px * off * 1.7, cy - hy + py * off * 1.7);
  ctx.lineTo(cx + hx + px * off * 1.7, cy + hy + py * off * 1.7);
  ctx.stroke();
}

function drawStreamline(s, t, strength, ov) {
  var S = Math.min(W, H);
  var x = s.x * W, y = s.y * H;
  var step = S * 0.012;
  ctx.strokeStyle = rgba(WINDLINE, s.a);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (var k = 0; k < 26; k++) {
    var a = fieldAngle(x, y, t, strength) + ov.dirOff * ov.w;
    x += Math.cos(a) * step;
    y += Math.sin(a) * step;
    ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawGhost(i, t, strength, ov) {
  var c = segCenter(i, t);
  var ang = segAngle(i, t, strength, ov);
  var S = Math.min(W, H);
  var len = S * (PHONE ? 0.17 : 0.20);
  var gx = c.x + len * 0.10 * Math.sin(ang);
  var gy = c.y - len * 0.44;
  var r = Math.max(3, S * 0.012);
  ctx.save();
  ctx.globalAlpha = 0.35;
  /* link to the blade it tunes */
  ctx.strokeStyle = rgba(GHOST, 0.5);
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.lineTo(c.x, c.y);
  ctx.stroke();
  ctx.setLineDash([]);
  /* handle ring */
  ctx.strokeStyle = rgba(GHOST, 0.95);
  ctx.beginPath();
  ctx.arc(gx, gy, r, 0, Math.PI * 2);
  ctx.stroke();
  /* target-angle tick: where the app is steering this blade */
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.lineTo(gx + Math.cos(ang) * r * 2.4, gy + Math.sin(ang) * r * 2.4);
  ctx.stroke();
  /* cross pin */
  ctx.beginPath();
  ctx.moveTo(gx - r * 0.45, gy); ctx.lineTo(gx + r * 0.45, gy);
  ctx.moveTo(gx, gy - r * 0.45); ctx.lineTo(gx, gy + r * 0.45);
  ctx.stroke();
  ctx.restore();
}

function draw(t) {
  currentT = t;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  var ov = overrideAt(t);
  var env = weather(t);
  var strength = env * (1 - ov.w) + ov.str * ov.w;
  var S = Math.min(W, H);
  var i, c;

  /* wind-lines streaming through the whole field */
  for (i = 0; i < STREAMS.length; i++) drawStreamline(STREAMS[i], t, strength, ov);

  /* the band's spine, faint, so the chain reads as one instrument */
  ctx.strokeStyle = rgba(STEEL, 0.10);
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (i = 0; i < NSEG; i++) {
    c = segCenter(i, t);
    if (i === 0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y);
  }
  ctx.stroke();

  /* blades */
  var spacing = W / NSEG;
  var wid = Math.max(2, spacing * 0.82);
  for (i = 0; i < NSEG; i++) {
    c = segCenter(i, t);
    var len = S * (PHONE ? 0.17 : 0.20) * (0.92 + 0.16 * SEGJ[i]);
    drawBlade(c.x, c.y, segAngle(i, t, strength, ov), len, wid);
  }

  /* control ghosts at six key segments */
  for (i = 0; i < GHOSTS.length; i++) drawGhost(GHOSTS[i], t, strength, ov);
}

draw(PHASE);

if (typeof requestAnimationFrame === 'function') {
  var t0 = null;
  var frame = function (now) {
    if (t0 === null) t0 = now;
    draw(PHASE + (now - t0) / 1000);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
