<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ostrich Tuning</title>
<style>
  html, body { margin: 0; padding: 0; background: #08080A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- palette (strict) ----
  var BG = '#08080A';
  var STRING_RGB = [216, 216, 220];   // #D8D8DC
  var SHIM_RGB = [232, 232, 236];     // #E8E8EC

  // ---- the six strings: one fundamental, micro-detuned ----
  var RATIOS = [1.000, 1.001, 0.999, 1.002, 1.0005, 0.9985];
  var NSTR = RATIOS.length;
  var LOOP = 30;              // seconds, seamless
  var CYCLES = 6;             // sine periods across the width
  var F0 = 0.55;              // base temporal rate (cycles per second)

  // Detune strength s(u) over the loop, and its closed-form integral D(u).
  // 0-3s: smoothstep ramp 0 -> 1 (shimmer forms). 3-24s: 1 (drift).
  // 24-28s: smoothstep ease 1 -> 0.15 (settle toward near-unison).
  // 28-30s: 0.15 (held through the fade).
  function sstep(a, b, x) {
    var t = (x - a) / (b - a);
    if (t < 0) t = 0; if (t > 1) t = 1;
    return t * t * (3 - 2 * t);
  }
  function sstepInt(a, b, x) {
    // integral of sstep(a,b,v) dv from a to x
    if (x <= a) return 0;
    var L = b - a;
    if (x >= b) return L * 0.5;
    var t = (x - a) / L;
    return L * (t * t * t - 0.5 * t * t * t * t);
  }
  function detuneStrength(u) {
    if (u < 3) return sstep(0, 3, u);
    if (u < 24) return 1;
    if (u < 28) return 1 - 0.85 * sstep(24, 28, u);
    return 0.15;
  }
  function detuneIntegral(u) {
    // D(u) = integral_0^u s(v) dv, closed form per segment
    var d = 0;
    if (u <= 3) return sstepInt(0, 3, u);
    d += 1.5;                                   // segment 0-3 total
    if (u <= 24) return d + (u - 3) * 1;
    d += 21;                                    // segment 3-24 total
    if (u <= 28) {
      var x = u - 24;
      d += x - 0.85 * sstepInt(24, 28, u);
      return d;
    }
    d += 4 - 0.85 * 2;                          // segment 24-28 total
    d += (u - 28) * 0.15;
    return d;
  }

  // Amplitude envelope: full at the strike (u=0), held, soft fade 28-30.
  function ampEnv(u) {
    if (u < 28) return 1;
    var t = (u - 28) / 2;
    return 1 - 0.7 * (t * t * (3 - 2 * t));
  }

  var W = 0, H = 0, DPR = 1;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    if (DPR > 2) DPR = 2;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return H > W * 1.15;
  }

  function mixc(a, b, t) {
    var r = Math.round(a[0] + (b[0] - a[0]) * t);
    var g = Math.round(a[1] + (b[1] - a[1]) * t);
    var bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  function draw(tSec) {
    var u = ((tSec % LOOP) + LOOP) % LOOP;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var phone = isPhone();
    var bandTop = H * 0.19, bandBot = H * 0.81;   // center-weighted field
    var amp = Math.min(W, H) * (phone ? 0.016 : 0.013) * ampEnv(u);
    var D = detuneIntegral(u);
    var sNow = detuneStrength(u);
    var step = Math.max(3, Math.round(W / 220));

    // per-string temporal phase (closed form): base cycles + detune drift
    var phase = [];
    var kPhase = [];
    for (var i = 0; i < NSTR; i++) {
      var d = RATIOS[i] - 1;
      phase[i] = 2 * Math.PI * (F0 * u + F0 * d * 40 * D);
      // spatial detune is exaggerated (x48) so the pairwise beats resolve
      // into visible bands along the string instead of one whole-string pulse
      kPhase[i] = 2 * Math.PI * CYCLES * (1 + d * 48);
    }

    ctx.lineWidth = Math.max(1.4, Math.min(W, H) * 0.0028);
    ctx.lineCap = 'round';

    for (var s = 0; s < NSTR; s++) {
      var yBase = bandTop + (bandBot - bandTop) * (NSTR === 1 ? 0.5 : s / (NSTR - 1));
      var prevX = 0;
      var prevY = yBase + amp * Math.sin(phase[s]);
      for (var x = step; x <= W + step; x += step) {
        var xx = Math.min(x, W);
        var frac = xx / W;
        var ph = kPhase[s] * frac + phase[s];
        var y = yBase + amp * Math.sin(ph);
        // interference: mean pairwise phase-alignment of this string vs the rest
        var acc = 0;
        for (var j = 0; j < NSTR; j++) {
          if (j === s) continue;
          var dp = (kPhase[s] - kPhase[j]) * frac + (phase[s] - phase[j]);
          var c = Math.cos(dp * 0.5);
          acc += c * c;
        }
        var align = acc / (NSTR - 1);            // 0..1
        var bright = Math.pow(align, 2) * (0.2 + 0.8 * sNow);
        ctx.strokeStyle = mixc(STRING_RGB, SHIM_RGB, bright);
        ctx.globalAlpha = 0.82 + 0.18 * bright;
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(xx, y);
        ctx.stroke();
        prevX = xx; prevY = y;
      }
    }
    ctx.globalAlpha = 1;
  }

  // QA hook: ?seed=<seconds> freezes the loop at that time (no animation).
  var frozen = null;
  if (typeof location !== 'undefined' && location.search) {
    var m = /seed=([0-9.]+)/.exec(location.search);
    if (m) frozen = parseFloat(m[1]);
  }

  resize();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); if (frozen !== null) draw(frozen); });
    }
    window.addEventListener('resize', function () { resize(); if (frozen !== null) draw(frozen); });
  }

  draw(frozen !== null ? frozen : 0);

  if (frozen === null && typeof requestAnimationFrame === 'function') {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      draw((now - t0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
