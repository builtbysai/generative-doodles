<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand-Coloured Photograph</title>
<style>
  html, body { margin: 0; padding: 0; background: #efe8d8; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random: frame one must be reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1450000);

  // Stable per-index hash so the hand-drawn wobble never flickers.
  function hash2(a, b) {
    var h = (a * 374761393 + b * 668265263) | 0;
    h = (h ^ (h >>> 13)) | 0;
    h = Math.imul(h, 1274126177);
    h = (h ^ (h >>> 16)) >>> 0;
    return h / 4294967296;
  }

  // Round fading alphas to 4 decimals: node-canvas misparses
  // scientific-notation alphas (e.g. 2.5e-15) as fully opaque.
  function a4(v) {
    if (v <= 0) return 0;
    if (v >= 1) return 1;
    return Math.round(v * 10000) / 10000;
  }

  var W = 0, H = 0;
  var phone = false;
  var nowT = 0;

  function size() {
    var vw = (typeof window.visualViewport !== 'undefined' && window.visualViewport)
      ? window.visualViewport.width : window.innerWidth;
    var vh = (typeof window.visualViewport !== 'undefined' && window.visualViewport)
      ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var minDim = Math.min(window.screen.width, window.screen.height);
    phone = minDim < 700 || (H > W * 1.15 && Math.min(W, H) < 700);
    if (typeof document !== 'undefined' && document.body) {
      document.body.style.background = '#efe8d8';
    }
  }

  // Every shape gets its own beginPath with a moveTo first:
  // node-canvas renders batched ellipse subpaths as giant connected polygons.
  function ell(cx, cy, rx, ry, fill, stroke, lw) {
    ctx.beginPath();
    ctx.moveTo(cx + rx, cy);
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  }
  function circ(cx, cy, r, fill, stroke, lw) {
    ell(cx, cy, r, r, fill, stroke, lw);
  }
  function rect(x, y, w, h, fill) {
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
  }
  function line(x1, y1, x2, y2, stroke, lw) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw || 2;
    ctx.stroke();
  }

  // Glaze zones, in photo-fraction coordinates. Colours are the prompt's
  // glaze palette; each zone is one timed wash of the hand at work.
  var ZONES = [
    { fx: 0.452, fy: 0.318, r: 0.055, color: '#e85a8a', name: 'cheek' },
    { fx: 0.700, fy: 0.600, r: 0.095, color: '#e8b83a', name: 'sleeve' },
    { fx: 0.588, fy: 0.198, r: 0.050, color: '#d81a2a', name: 'flower' },
    { fx: 0.300, fy: 0.600, r: 0.095, color: '#1a8a7a', name: 'sleeve' },
    { fx: 0.500, fy: 0.462, r: 0.045, color: '#6a2a8a', name: 'ribbon' }
  ];
  var GLAZE_COLORS = ['#e85a8a', '#e8b83a', '#d81a2a', '#1a8a7a', '#6a2a8a'];
  var CYCLE = 30; // 5 zones x 6 s; phase +3 s so frame one holds a wash.

  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function rgba(hex, alpha) {
    var c = hexRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a4(alpha) + ')';
  }
  // A wash with soft edges: layered flat-alpha circles, never a gradient.
  function glazeBlob(x, y, r, hex, alpha) {
    if (alpha <= 0.005) return;
    circ(x, y, r, rgba(hex, alpha * 0.55));
    circ(x, y, r * 0.7, rgba(hex, alpha * 0.75));
    circ(x, y, r * 0.45, rgba(hex, alpha));
  }
  function washEnvelope(local) {
    if (local < 1.5) return local / 1.5;
    if (local < 4.5) return 1;
    return (6 - local) / 1.5;
  }

  // Drag-painted glaze: a persistent layer that relaxes toward the timed
  // cycle (exponential decay, tau 15 s), never a fully coloured photograph.
  var blobs = [];
  var blobCount = 0;
  var dragging = false;
  var lastMove = null;

  function paintAt(fx, fy, slowBonus) {
    var s0 = 0.18 + 0.17 * slowBonus;
    blobs.push({ fx: fx, fy: fy, color: GLAZE_COLORS[blobCount % GLAZE_COLORS.length], s0: s0, t0: nowT });
    blobCount++;
  }
  function dragStart(fx, fy) {
    dragging = true;
    lastMove = { fx: fx, fy: fy, t: nowT };
    paintAt(fx, fy, 0.5);
  }
  function dragMove(fx, fy) {
    if (!dragging) return;
    var dx = fx - lastMove.fx, dy = fy - lastMove.fy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var dt = Math.max(nowT - lastMove.t, 0.01);
    var speed = dist / dt; // fraction of frame per second
    var slowBonus = Math.max(0, Math.min(1, 1 - speed / 2));
    if (dist > 0.003) paintAt(fx, fy, slowBonus);
    lastMove = { fx: fx, fy: fy, t: nowT };
  }
  function dragEnd() {
    dragging = false;
    lastMove = null;
  }

  function toFrac(e) {
    var r = { left: 0, top: 0 };
    if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
    var x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX)) - r.left;
    var y = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY)) - r.top;
    return { fx: x / W, fy: y / H };
  }

  function draw(t) {
    nowT = t;
    size();
    var b = phone ? 6 : 14; // narrow cream border, the paper edge
    var px = b, py = b, pw = W - 2 * b, ph = H - 2 * b;
    var u = Math.min(pw, ph);
    var X = function (f) { return px + f * pw; };
    // Figure verticals are in min-dimension units from a centered origin,
    // so head, neck and collar stay connected at every aspect ratio
    // (photo-height fractions detached them on tall phone frames).
    var spanK = 0.86;
    var oy = py + (ph - spanK * u) / 2 - 0.10 * u;
    var YU = function (k) { return oy + k * u; };

    rect(0, 0, W, H, '#efe8d8');

    // Bare room: wall above, floor below, both flat photograph gray.
    rect(px, py, pw, ph * 0.62, '#a8a8a8');
    rect(px, py + ph * 0.62, pw, ph * 0.38, '#5a5a5a');
    // Faint room tone: two wide low-alpha bands, never a gradient.
    rect(px, py, pw, ph * 0.10, 'rgba(232,232,232,0.12)');
    rect(px, py + ph * 0.62, pw, ph * 0.06, 'rgba(26,26,26,0.15)');

    var cx = X(0.5);
    // Hair mass behind the head.
    ell(cx, YU(0.285), u * 0.145, u * 0.155, '#1a1a1a');
    // Shoulders and skirt: the elaborate outfit, flat gray fills.
    ctx.beginPath();
    ctx.moveTo(X(0.335), YU(0.500));
    ctx.lineTo(X(0.665), YU(0.500));
    ctx.lineTo(X(0.720), YU(0.960));
    ctx.lineTo(X(0.280), YU(0.960));
    ctx.closePath();
    ctx.fillStyle = '#5a5a5a';
    ctx.fill();
    // Skirt fold lines, seeded and stable.
    for (var i = 0; i < 5; i++) {
      var fx0 = 0.40 + i * 0.05 + (hash2(i, 31) - 0.5) * 0.01;
      line(X(fx0), YU(0.560), X(fx0 - 0.02), YU(0.950), '#1a1a1a', 1);
    }
    // Wide sleeves.
    ell(X(0.300), YU(0.600), u * 0.105, u * 0.125, '#a8a8a8', '#1a1a1a', 2);
    ell(X(0.700), YU(0.600), u * 0.105, u * 0.125, '#a8a8a8', '#1a1a1a', 2);
    // Sleeve seams.
    line(X(0.300), YU(0.500), X(0.300), YU(0.700), '#5a5a5a', 1);
    line(X(0.700), YU(0.500), X(0.700), YU(0.700), '#5a5a5a', 1);
    // Bodice panels.
    line(X(0.440), YU(0.500), X(0.420), YU(0.780), '#1a1a1a', 1);
    line(X(0.560), YU(0.500), X(0.580), YU(0.780), '#1a1a1a', 1);
    // Ruffled collar: small circles around the neck.
    for (var j = 0; j < 9; j++) {
      var ang = Math.PI * (0.15 + j * 0.0875);
      var ccx = cx + Math.cos(Math.PI + ang) * u * 0.075;
      var ccy = YU(0.445) + Math.sin(Math.PI + ang) * u * 0.020;
      circ(ccx, ccy, u * 0.020, '#d8d8d8', '#1a1a1a', 1);
    }
    // Neck and face.
    rect(X(0.482), YU(0.400), u * 0.036, u * 0.060, '#e8e8e8');
    ell(cx, YU(0.300), u * 0.115, u * 0.135, '#e8e8e8', '#1a1a1a', 2);
    // Hair fringe across the forehead.
    ell(cx, YU(0.215), u * 0.115, u * 0.055, '#1a1a1a');
    // Brows, eyes, lips: posed, looking at the camera.
    line(X(0.452), YU(0.272), X(0.478), YU(0.268), '#1a1a1a', 2);
    line(X(0.522), YU(0.268), X(0.548), YU(0.272), '#1a1a1a', 2);
    circ(X(0.465), YU(0.290), u * 0.010, '#1a1a1a');
    circ(X(0.535), YU(0.290), u * 0.010, '#1a1a1a');
    ell(cx, YU(0.362), u * 0.022, u * 0.010, '#5a5a5a');
    // Flower in the hair: gray petals at base, coloured by the timed wash.
    for (var k = 0; k < 5; k++) {
      var pa = -Math.PI / 2 + k * (Math.PI * 2 / 5);
      circ(X(0.588) + Math.cos(pa) * u * 0.026, YU(0.198) + Math.sin(pa) * u * 0.026, u * 0.018, '#e8e8e8', '#1a1a1a', 1);
    }
    circ(X(0.588), YU(0.198), u * 0.012, '#5a5a5a');
    // Brooch at the collar.
    circ(cx, YU(0.462), u * 0.018, '#d8d8d8', '#1a1a1a', 1);

    // Timed wash: one zone at a time, holding, then softly fading
    // as the next wash appears elsewhere. The hand never finishes.
    var ct = (t + 3) % CYCLE;
    var zi = Math.floor(ct / 6) % ZONES.length;
    var z = ZONES[zi];
    var env = washEnvelope(ct % 6);
    glazeBlob(X(z.fx), YU(z.fy), z.r * u, z.color, 0.32 * env);

    // Drag-painted glaze, relaxing toward the timed cycle.
    for (var bi = 0; bi < blobs.length; bi++) {
      var bl = blobs[bi];
      var age = t - bl.t0;
      var strength = bl.s0 * Math.exp(-age / 15);
      if (strength < 0.01) continue;
      glazeBlob(bl.fx * W, bl.fy * H, u * 0.045, bl.color, Math.min(strength, 0.35));
    }
    // Prune fully relaxed blobs so the layer never accumulates.
    if (blobs.length > 400) blobs.splice(0, blobs.length - 400);
  }

  // Frame one is drawn synchronously at a constant phase.
  draw(0);

  // rAF loop as a plain function declaration, typeof-guarded.
  var startMs = null;
  function loop(ts) {
    if (startMs === null) startMs = ts;
    draw((ts - startMs) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }

  if (typeof canvas.addEventListener !== 'undefined') {
    canvas.addEventListener('pointerdown', function (e) {
      var f = toFrac(e);
      dragStart(f.fx, f.fy);
    });
    canvas.addEventListener('pointermove', function (e) {
      var f = toFrac(e);
      dragMove(f.fx, f.fy);
    });
    canvas.addEventListener('pointerup', function () { dragEnd(); });
    canvas.addEventListener('pointercancel', function () { dragEnd(); });
  }

  if (typeof window !== 'undefined') {
    window.__piece = { draw: draw, zones: ZONES, blobs: blobs,
      dragStart: dragStart, dragMove: dragMove, dragEnd: dragEnd,
      get nowT() { return nowT; } };
    window.addEventListener('resize', function () { draw(nowT); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(nowT); });
    }
  }
})();
</script>
</body>
</html>
