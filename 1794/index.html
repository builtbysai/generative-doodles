<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture and Incident</title>
<style>
html, body { margin: 0; padding: 0; background: #a3a8ad; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#a3a8ad';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, sun patch partway across the left wall, hall otherwise empty */
var CONCRETE_L = '#b7bcc0'; /* left wall */
var CONCRETE_R = '#a9aeb4'; /* right wall */
var CONCRETE_CEIL = '#c6c9cc'; /* ceiling */
var CONCRETE_FLOOR = '#9aa0a6'; /* floor */
var CONCRETE_BACK = '#8f959b'; /* back wall */
var BONE = '#d8d2c2';
var SHADOW_BLUE = '#5f7086';
var DOOR_DARK = '#5d646e';
var SUN_CORE = '#f2cf8a';
var SUN_WASH = '#e8b96a';
var AMBER = '#e8a83c';
var CROW = '#14161a';
var CROW_SHEEN = '#2e5d4a';
var FIGURE = '#3a3f46';
var PLATE_FILL = '#ffffff';
var PLATE_LINE = 'rgba(0,0,0,0.28)';
var PLATE_INK = '#2b2b28';
var HINT_INK = '#2b2b28';
/* Incident schedule, master cycle 600 s. At most the sun plus one other incident at once.
   Sun: continuous crawl, own 240 s cycle. Crow [100,140], door [220,245], figure [380,415].
   At t = 60 only the sun patch is active. */
var CYCLE = 600.0;
var SUN_CYCLE = 240.0;
var CROW_WIN = [100, 112, 128, 140]; /* enter, land, leave, gone */
var DOOR_WIN = [220, 228, 237, 245]; /* open, hold, close, shut */
var FIGURE_WIN = [380, 415]; /* walk left to right */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- fixed seeded table, seed 1794: wall speckle + small jitters ---- */
var TABLE = [];
(function buildTable() {
  var rng = mulberry32(1794);
  var i;
  for (i = 0; i < 90; i++) {
    TABLE.push({ side: rng() < 0.5 ? 'L' : 'R', u: 0.04 + rng() * 0.92, v: 0.05 + rng() * 0.9, r: 0.6 + rng() * 1.6 });
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
var VP = { x: 0, y: 0 }; /* vanishing point */
var BW = 0, BH = 0; /* back wall half width / half height */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
  VP = { x: F.x + 0.5 * F.w, y: F.y + 0.40 * F.h };
  BW = 0.13 * F.w; BH = 0.11 * F.h;
}
/* Point on a side wall. u: 0 front edge, 1 back wall. v: 0 top edge, 1 bottom edge. */
function wallPoint(side, u, v) {
  var tx, ty, bx, by;
  if (side === 'L') {
    tx = lerp(F.x, VP.x - BW, u); ty = lerp(F.y, VP.y - BH, u);
    bx = lerp(F.x, VP.x - BW, u); by = lerp(F.y + F.h, VP.y + BH, u);
  } else {
    tx = lerp(F.x + F.w, VP.x + BW, u); ty = lerp(F.y, VP.y - BH, u);
    bx = lerp(F.x + F.w, VP.x + BW, u); by = lerp(F.y + F.h, VP.y + BH, u);
  }
  return [lerp(tx, bx, v), lerp(ty, by, v)];
}
function poly(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  var i;
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
function polyScale(pts, s) {
  var cx = 0, cy = 0, i;
  for (i = 0; i < pts.length; i++) { cx += pts[i][0]; cy += pts[i][1]; }
  cx /= pts.length; cy /= pts.length;
  var out = [];
  for (i = 0; i < pts.length; i++) out.push([cx + (pts[i][0] - cx) * s, cy + (pts[i][1] - cy) * s]);
  return out;
}
/* ---- the hall: fixed authored drawing, pure function of F ---- */
function drawHall() {
  var i, u, p;
  /* ceiling */
  ctx.fillStyle = CONCRETE_CEIL;
  poly([[F.x, F.y], [F.x + F.w, F.y], [VP.x + BW, VP.y - BH], [VP.x - BW, VP.y - BH]]);
  ctx.fill();
  /* floor */
  ctx.fillStyle = CONCRETE_FLOOR;
  poly([[F.x, F.y + F.h], [F.x + F.w, F.y + F.h], [VP.x + BW, VP.y + BH], [VP.x - BW, VP.y + BH]]);
  ctx.fill();
  /* left and right walls */
  ctx.fillStyle = CONCRETE_L;
  poly([[F.x, F.y], [VP.x - BW, VP.y - BH], [VP.x - BW, VP.y + BH], [F.x, F.y + F.h]]);
  ctx.fill();
  ctx.fillStyle = CONCRETE_R;
  poly([[F.x + F.w, F.y], [VP.x + BW, VP.y - BH], [VP.x + BW, VP.y + BH], [F.x + F.w, F.y + F.h]]);
  ctx.fill();
  /* back wall */
  ctx.fillStyle = CONCRETE_BACK;
  ctx.fillRect(VP.x - BW, VP.y - BH, 2 * BW, 2 * BH);
  /* back wall: a narrow dark doorway dead centre, shut */
  ctx.fillStyle = '#6a7076';
  ctx.fillRect(VP.x - BW * 0.16, VP.y + BH * 0.05, BW * 0.32, BH * 0.95);
  ctx.strokeStyle = rgba(SHADOW_BLUE, 0.8);
  ctx.lineWidth = 1;
  ctx.strokeRect(VP.x - BW * 0.16 + 0.5, VP.y + BH * 0.05 + 0.5, BW * 0.32 - 1, BH * 0.95 - 1);
  /* ceiling transverse beams */
  ctx.strokeStyle = 'rgba(60,64,70,0.18)';
  ctx.lineWidth = Math.max(1, F.w * 0.002);
  var depths = [0.25, 0.5, 0.75];
  for (i = 0; i < depths.length; i++) {
    u = depths[i];
    var cL = [lerp(F.x, VP.x - BW, u), lerp(F.y, VP.y - BH, u)];
    var cR = [lerp(F.x + F.w, VP.x + BW, u), lerp(F.y, VP.y - BH, u)];
    ctx.beginPath();
    ctx.moveTo(cL[0], cL[1]);
    ctx.lineTo(cR[0], cR[1]);
    ctx.stroke();
  }
  /* floor tile grout: converging lines to VP + depth lines */
  ctx.strokeStyle = rgba(BONE, 0.55);
  ctx.lineWidth = Math.max(1, F.w * 0.0015);
  var cols = [0.12, 0.28, 0.44, 0.56, 0.72, 0.88];
  for (i = 0; i < cols.length; i++) {
    var bx0 = F.x + cols[i] * F.w;
    ctx.beginPath();
    ctx.moveTo(bx0, F.y + F.h);
    ctx.lineTo(VP.x, VP.y + BH);
    ctx.stroke();
  }
  for (i = 0; i < depths.length; i++) {
    u = depths[i];
    var fL = [lerp(F.x, VP.x - BW, u), lerp(F.y + F.h, VP.y + BH, u)];
    var fR = [lerp(F.x + F.w, VP.x + BW, u), lerp(F.y + F.h, VP.y + BH, u)];
    ctx.beginPath();
    ctx.moveTo(fL[0], fL[1]);
    ctx.lineTo(fR[0], fR[1]);
    ctx.stroke();
  }
  /* baseboards, shadow blue */
  ctx.fillStyle = rgba(SHADOW_BLUE, 0.55);
  poly([wallPoint('L', 0, 0.94), wallPoint('L', 1, 0.94), wallPoint('L', 1, 1), wallPoint('L', 0, 1)]);
  ctx.fill();
  poly([wallPoint('R', 0, 0.94), wallPoint('R', 1, 0.94), wallPoint('R', 1, 1), wallPoint('R', 0, 1)]);
  ctx.fill();
  /* left wall: two static doorways, shut, shadow blue frames */
  var doorsL = [[0.16, 0.32], [0.55, 0.68]];
  for (i = 0; i < doorsL.length; i++) {
    var d0 = doorsL[i][0], d1 = doorsL[i][1];
    ctx.fillStyle = '#7d838a';
    poly([wallPoint('L', d0, 0.42), wallPoint('L', d1, 0.42), wallPoint('L', d1, 1), wallPoint('L', d0, 1)]);
    ctx.fill();
    ctx.strokeStyle = rgba(SHADOW_BLUE, 0.9);
    ctx.lineWidth = Math.max(1, F.w * 0.002);
    poly([wallPoint('L', d0, 0.42), wallPoint('L', d1, 0.42), wallPoint('L', d1, 1), wallPoint('L', d0, 1)]);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(40,44,50,0.5)';
    ctx.lineWidth = 1;
    var mid = (d0 + d1) / 2;
    p = wallPoint('L', mid, 0.42);
    var p2 = wallPoint('L', mid, 1);
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]);
    ctx.lineTo(p2[0], p2[1]);
    ctx.stroke();
  }
  /* left wall ledge, the crow's perch: thin band at v 0.60 to 0.64, u 0.30 to 0.52, clear of both doorways */
  ctx.fillStyle = '#8d9297';
  poly([wallPoint('L', 0.30, 0.60), wallPoint('L', 0.52, 0.60), wallPoint('L', 0.52, 0.64), wallPoint('L', 0.30, 0.64)]);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  poly([wallPoint('L', 0.30, 0.60), wallPoint('L', 0.52, 0.60), wallPoint('L', 0.52, 0.615), wallPoint('L', 0.30, 0.615)]);
  ctx.fill();
  /* right wall: high window, pale cool light with a mullion cross */
  var wPts = [wallPoint('R', 0.72, 0.08), wallPoint('R', 0.88, 0.08), wallPoint('R', 0.88, 0.30), wallPoint('R', 0.72, 0.30)];
  ctx.fillStyle = '#dfe6ea';
  poly(wPts);
  ctx.fill();
  ctx.strokeStyle = rgba(SHADOW_BLUE, 0.9);
  ctx.lineWidth = Math.max(1, F.w * 0.002);
  poly(wPts);
  ctx.stroke();
  var wm1 = wallPoint('R', 0.80, 0.08), wm2 = wallPoint('R', 0.80, 0.30);
  var wm3 = wallPoint('R', 0.72, 0.19), wm4 = wallPoint('R', 0.88, 0.19);
  ctx.strokeStyle = 'rgba(95,112,134,0.7)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(wm1[0], wm1[1]);
  ctx.lineTo(wm2[0], wm2[1]);
  ctx.moveTo(wm3[0], wm3[1]);
  ctx.lineTo(wm4[0], wm4[1]);
  ctx.stroke();
  /* seeded wall speckle, fixed */
  ctx.fillStyle = 'rgba(43,41,38,0.05)';
  for (i = 0; i < TABLE.length; i++) {
    p = wallPoint(TABLE[i].side, TABLE[i].u, TABLE[i].v);
    ctx.fillRect(p[0], p[1], TABLE[i].r, TABLE[i].r);
  }
}
/* ---- incidents: closed-form functions of piece time ---- */
function sunU(t) {
  return 0.05 + 0.75 * ((t % SUN_CYCLE) / SUN_CYCLE);
}
function drawSun(t) {
  var u = sunU(t);
  var v = 0.35 + 0.06 * Math.sin(TAU * (t % SUN_CYCLE) / SUN_CYCLE);
  var pts = [
    wallPoint('L', u - 0.07, v - 0.13),
    wallPoint('L', u + 0.05, v - 0.13),
    wallPoint('L', u + 0.08, v + 0.13),
    wallPoint('L', u - 0.04, v + 0.13)
  ];
  ctx.fillStyle = rgba(SUN_WASH, 0.07);
  poly(polyScale(pts, 1.4));
  ctx.fill();
  ctx.fillStyle = rgba(SUN_WASH, 0.10);
  poly(polyScale(pts, 1.18));
  ctx.fill();
  ctx.fillStyle = rgba(SUN_CORE, 0.20);
  poly(pts);
  ctx.fill();
  /* warm wash on the floor below the patch */
  var fp = [lerp(F.x, VP.x - BW, u), lerp(F.y + F.h, VP.y + BH, u)];
  var fx = fp[0] + 0.06 * F.w, fy = fp[1] - 0.02 * F.h;
  ctx.fillStyle = rgba(SUN_WASH, 0.08);
  ctx.beginPath();
  ctx.moveTo(fx + 0.10 * F.w, fy);
  ctx.ellipse(fx, fy, 0.10 * F.w, 0.028 * F.h, 0, 0, TAU);
  ctx.fill();
}
function crowPos(t) {
  /* returns {x, y, ang, flying, perched} or null when the crow is away */
  var ct = t % CYCLE;
  var L = wallPoint('L', 0.42, 0.60);
  var s = F.w / 720;
  if (ct < CROW_WIN[0] || ct >= CROW_WIN[3]) return null;
  if (ct < CROW_WIN[1]) {
    var p = smooth((ct - CROW_WIN[0]) / (CROW_WIN[1] - CROW_WIN[0]));
    var x0 = F.x - 0.06 * F.w, y0 = F.y + 0.30 * F.h;
    var x = lerp(x0, L[0], p);
    var y = lerp(y0, L[1] - 8 * s, p) - Math.sin(p * Math.PI) * 0.05 * F.h;
    var x2 = lerp(x0, L[0], clamp(p + 0.02, 0, 1));
    var y2 = lerp(y0, L[1] - 8 * s, clamp(p + 0.02, 0, 1)) - Math.sin(clamp(p + 0.02, 0, 1) * Math.PI) * 0.05 * F.h;
    return { x: x, y: y, ang: Math.atan2(y2 - y, x2 - x), flying: true, flap: Math.sin(t * 9), s: s };
  }
  if (ct < CROW_WIN[2]) {
    return { x: L[0], y: L[1] - 8 * s + Math.sin(t * 1.8) * 1.2 * s, ang: 0, flying: false, flap: 0, s: s };
  }
  var q = smooth((ct - CROW_WIN[2]) / (CROW_WIN[3] - CROW_WIN[2]));
  var ex = lerp(L[0], F.x + 1.08 * F.w, q);
  var ey = lerp(L[1] - 8 * s, F.y + 0.24 * F.h, q) - Math.sin(q * Math.PI) * 0.04 * F.h;
  var ex2 = lerp(L[0], F.x + 1.08 * F.w, clamp(q + 0.02, 0, 1));
  var ey2 = lerp(L[1] - 8 * s, F.y + 0.24 * F.h, clamp(q + 0.02, 0, 1)) - Math.sin(clamp(q + 0.02, 0, 1) * Math.PI) * 0.04 * F.h;
  return { x: ex, y: ey, ang: Math.atan2(ey2 - ey, ex2 - ex), flying: true, flap: Math.sin(t * 9), s: s };
}
function drawCrow(t) {
  var c = crowPos(t);
  if (!c) return;
  var s = c.s;
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.ang);
  /* tail */
  ctx.fillStyle = CROW;
  ctx.beginPath();
  ctx.moveTo(-12 * s, -1 * s);
  ctx.lineTo(-24 * s, -4 * s);
  ctx.lineTo(-24 * s, 3 * s);
  ctx.lineTo(-12 * s, 3 * s);
  ctx.closePath();
  ctx.fill();
  /* body */
  ctx.beginPath();
  ctx.moveTo(16 * s, 0);
  ctx.ellipse(0, 0, 16 * s, 6.5 * s, 0, 0, TAU);
  ctx.fill();
  /* wing: flapping in flight, folded when perched */
  if (c.flying) {
    ctx.save();
    ctx.translate(-2 * s, -3 * s);
    ctx.rotate(-0.5 - c.flap * 0.55);
    ctx.beginPath();
    ctx.moveTo(12 * s, 0);
    ctx.ellipse(0, 0, 13 * s, 4 * s, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  } else {
    ctx.beginPath();
    ctx.moveTo(12 * s, -2 * s);
    ctx.ellipse(-1 * s, -2 * s, 12 * s, 3 * s, -0.08, 0, TAU);
    ctx.fill();
  }
  /* green sheen along the back */
  ctx.strokeStyle = rgba(CROW_SHEEN, 0.85);
  ctx.lineWidth = Math.max(1, 1.4 * s);
  ctx.beginPath();
  ctx.moveTo(-12 * s, -5 * s);
  ctx.quadraticCurveTo(0, -8 * s, 12 * s, -3 * s);
  ctx.stroke();
  /* head and beak */
  ctx.fillStyle = CROW;
  ctx.beginPath();
  ctx.moveTo(16 * s, -4 * s);
  ctx.arc(13 * s, -5 * s, 4.6 * s, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(16.5 * s, -6.5 * s);
  ctx.lineTo(23 * s, -4 * s);
  ctx.lineTo(16.5 * s, -2.5 * s);
  ctx.closePath();
  ctx.fill();
  /* eye */
  ctx.fillStyle = BONE;
  ctx.beginPath();
  ctx.moveTo(15.5 * s, -6 * s);
  ctx.arc(14.5 * s, -6 * s, 0.9 * s, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function doorOpen(t) {
  var dt = t % CYCLE;
  if (dt < DOOR_WIN[0] || dt >= DOOR_WIN[3]) return 0;
  if (dt < DOOR_WIN[1]) return smooth((dt - DOOR_WIN[0]) / (DOOR_WIN[1] - DOOR_WIN[0]));
  if (dt < DOOR_WIN[2]) return 1;
  return 1 - smooth((dt - DOOR_WIN[2]) / (DOOR_WIN[3] - DOOR_WIN[2]));
}
function drawDoor(t) {
  var a = doorOpen(t);
  var TL = wallPoint('R', 0.42, 0.45), TR = wallPoint('R', 0.58, 0.45);
  var BR = wallPoint('R', 0.58, 1), BL = wallPoint('R', 0.42, 1);
  /* doorway recess */
  ctx.fillStyle = '#7d838a';
  poly([TL, TR, BR, BL]);
  ctx.fill();
  /* amber slit of light at the free edge, growing as the door opens */
  if (a > 0.001) {
    var freeU = 0.58 - 0.16 * (1 - 0.8 * a);
    var sTL = wallPoint('R', 0.42, 0.45), sTR = wallPoint('R', freeU, 0.45);
    var sBR = wallPoint('R', freeU, 1), sBL = wallPoint('R', 0.42, 1);
    ctx.fillStyle = rgba(AMBER, 0.85 * a);
    poly([sTL, sTR, sBR, sBL]);
    ctx.fill();
    /* warm spill on the floor in front of the doorway */
    var spill = [BL, BR, [BR[0] + 0.10 * F.w, BR[1] + 0.05 * F.h], [BL[0] + 0.10 * F.w, BL[1] + 0.05 * F.h]];
    ctx.fillStyle = rgba(SUN_WASH, 0.10 * a);
    poly(spill);
    ctx.fill();
  }
  /* the door panel itself, hinged at u 0.58, foreshortening as it opens */
  var freeU2 = 0.58 - 0.16 * (1 - 0.8 * a);
  var pTL = wallPoint('R', freeU2, 0.45), pBL = wallPoint('R', freeU2, 1);
  ctx.fillStyle = a > 0.001 ? '#4c525c' : DOOR_DARK;
  poly([pTL, TR, BR, pBL]);
  ctx.fill();
  ctx.strokeStyle = rgba(SHADOW_BLUE, 0.9);
  ctx.lineWidth = Math.max(1, F.w * 0.002);
  poly([TL, TR, BR, BL]);
  ctx.stroke();
}
function figurePos(t) {
  var ft = t % CYCLE;
  if (ft < FIGURE_WIN[0] || ft >= FIGURE_WIN[1]) return null;
  var p = (ft - FIGURE_WIN[0]) / (FIGURE_WIN[1] - FIGURE_WIN[0]);
  return { x: lerp(F.x + 0.10 * F.w, F.x + 0.90 * F.w, p), y: F.y + 0.88 * F.h, phase: p * Math.PI * 8, p: p };
}
function drawFigure(t) {
  var f = figurePos(t);
  if (!f) return;
  var Hf = 0.14 * F.h;
  var hipY = f.y - 0.55 * Hf;
  var shoulderY = f.y - 0.86 * Hf;
  /* contact shadow */
  ctx.fillStyle = 'rgba(40,44,50,0.18)';
  ctx.beginPath();
  ctx.moveTo(f.x + 0.035 * F.w, f.y);
  ctx.ellipse(f.x, f.y, 0.035 * F.w, 0.008 * F.h, 0, 0, TAU);
  ctx.fill();
  var swing = Math.sin(f.phase) * 0.22 * Hf;
  ctx.strokeStyle = FIGURE;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1.5, Hf * 0.045);
  /* legs */
  ctx.beginPath();
  ctx.moveTo(f.x, hipY);
  ctx.lineTo(f.x - swing * 0.5, f.y);
  ctx.moveTo(f.x, hipY);
  ctx.lineTo(f.x + swing * 0.5, f.y);
  ctx.stroke();
  /* torso */
  ctx.lineWidth = Math.max(2, Hf * 0.075);
  ctx.beginPath();
  ctx.moveTo(f.x, hipY);
  ctx.lineTo(f.x, shoulderY);
  ctx.stroke();
  /* arms, swinging opposite the legs */
  ctx.lineWidth = Math.max(1.5, Hf * 0.04);
  var aswing = Math.sin(f.phase + Math.PI) * 0.12 * Hf;
  ctx.beginPath();
  ctx.moveTo(f.x, shoulderY + 0.04 * Hf);
  ctx.lineTo(f.x - aswing, shoulderY + 0.30 * Hf);
  ctx.moveTo(f.x, shoulderY + 0.04 * Hf);
  ctx.lineTo(f.x + aswing, shoulderY + 0.30 * Hf);
  ctx.stroke();
  /* head */
  ctx.fillStyle = FIGURE;
  ctx.beginPath();
  ctx.moveTo(f.x + Hf * 0.09, shoulderY - 0.02 * Hf);

}
function drawPlates() {

  var titleW = ctx.measureText('Architecture and Incident').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 10').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;

  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Architecture and Incident', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 10', plateX + 14, plateY + 7 + titlePx + 3);

  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;

  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawHall();
  drawSun(phaseT);
  drawDoor(phaseT);
  drawCrow(phaseT);
  drawFigure(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    sunU: function (t) { return sunU(t); },
    crow: function (t) { return crowPos(t); },
    doorOpen: function (t) { return doorOpen(t); },
    figure: function (t) { return figurePos(t); }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {

      var dt = clamp((now - prevTs) / 1000, 0, 0.05);

      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }

  })();
}
