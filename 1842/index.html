<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Map</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0A0C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a hand-drawn chalk graph of five eras on near-black. A playhead
   rides the edges at constant speed and the camera rides with it, always
   mid-journey. The same four bars play through each node's materials; only
   the clothes change. The viewer only watches. */
var TAU = Math.PI * 2;
var GROUND = '#0A0A0C';
var CHALK = '#EDEDE8';
var CHALK_DIM = '#C9C9C2';
var PLATE = '#101013';
var PLATE_LINE = 'rgba(237,237,232,0.30)';
var TITLE_INK = '#EDEDE8';
var HINT_INK = '#9AA3AD';
var FRAME_T = 60.0;        /* fixed phase: playhead on RAVE -> KRAFTWERK */
var SPEED = 40;            /* playhead speed, world units per second */
var LOOP_HORIZON = 86400;  /* piece time wraps here, seconds */
/* ---- fixed node layout, world units (world spans 0..1600 x 0..1000) ---- */
var NODES = [
  { name: 'KRAFTWERK', x: 120,  y: 180, r: 34, tint: '#EDEDE8', era: 'neutral chalk white' },
  { name: 'CHICAGO',   x: 620,  y: 140, r: 30, tint: '#D8C9B0', era: 'warm grey' },
  { name: 'DETROIT',   x: 1080, y: 220, r: 30, tint: '#A8C4DE', era: 'cold blue' },
  { name: 'TECHNO',    x: 820,  y: 620, r: 28, tint: '#B9C2CC', era: 'steel grey-blue' },
  { name: 'RAVE',      x: 350,  y: 700, r: 28, tint: '#D9C8E8', era: 'pale lilac' }
];
var NOTES = [
  { name: '808',   x: 760,  y: 260, to: 1 },
  { name: '303',   x: 1240, y: 360, to: 2 },
  { name: 'KLF',   x: 180,  y: 560, to: 4 },
  { name: 'ACID',  x: 980,  y: 760, to: 3 },
  { name: 'SHOOM', x: 520,  y: 860, to: 4 }
];
/* playhead tour: the main loop, in order, returning to the start */
var TOUR = [0, 1, 2, 3, 4, 0];
var EDGES = [];
(function () {
  var i, a, b, len;
  for (i = 0; i < TOUR.length - 1; i++) {
    a = NODES[TOUR[i]]; b = NODES[TOUR[i + 1]];
    len = Math.sqrt((b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y));
    EDGES.push({ a: TOUR[i], b: TOUR[i + 1], len: len });
  }
})();
var LOOP_LEN = 0;
(function () { var i; for (i = 0; i < EDGES.length; i++) LOOP_LEN += EDGES[i].len; })();
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hash2(x, y) {
  var s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1842);
var phaseT = FRAME_T;
/* seeded chalk dust: fixed specks across the field, drawn every frame */
var DUST = [];
(function () {
  var i;
  for (i = 0; i < 90; i++) {
    DUST.push({ x: rng() * 1600, y: rng() * 1000, r: 0.6 + rng() * 1.4, a: 0.04 + rng() * 0.10 });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- playhead: closed-form position on the tour at piece time t ---- */
function playheadAt(t) {
  var d = (SPEED * t) % LOOP_LEN;
  var i, e;
  for (i = 0; i < EDGES.length; i++) {
    e = EDGES[i];
    if (d <= e.len) {
      var f = d / e.len;
      var a = NODES[e.a], b = NODES[e.b];
      return { x: a.x + f * (b.x - a.x), y: a.y + f * (b.y - a.y), edge: i, frac: f, dist: d };
    }
    d -= e.len;
  }
  return { x: NODES[0].x, y: NODES[0].y, edge: 0, frac: 0, dist: 0 };
}
function nearestNode(px, py) {
  var best = 0, bd = 1e9, i, d;
  for (i = 0; i < NODES.length; i++) {
    d = Math.sqrt((NODES[i].x - px) * (NODES[i].x - px) + (NODES[i].y - py) * (NODES[i].y - py));
    if (d < bd) { bd = d; best = i; }
  }
  return { idx: best, dist: bd };
}
/* camera: centered on the playhead, so the view is always mid-journey */
function cameraAt(t, sc) {
  var p = playheadAt(t);
  var viewW = isPhone ? 950 : 1200;
  var scale = sc.w / viewW;
  var viewH = sc.h / scale;
  return { cx: p.x, cy: p.y, scale: scale, viewW: viewW, viewH: viewH, px: p.x, py: p.y };
}
function w2sx(cam, sc, x) { return sc.x + (x - (cam.cx - cam.viewW / 2)) * cam.scale; }
function w2sy(cam, sc, y) { return sc.y + (y - (cam.cy - cam.viewH / 2)) * cam.scale; }
/* ---- hand-drawn wobbly edge: jittered segments, seeded per segment ---- */
function drawEdge(cam, sc, a, b, edgeIdx, ink, alpha, width) {
  var segs = 26, i, f, px, py, nx, ny, ox, oy;
  var dx = b.x - a.x, dy = b.y - a.y;
  var len = Math.sqrt(dx * dx + dy * dy);
  nx = -dy / len; ny = dx / len;
  ctx.strokeStyle = rgba(ink, alpha);
  ctx.lineWidth = width;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (i = 0; i <= segs; i++) {
    f = i / segs;
    /* jitter falls to zero at the endpoints so lines meet the nodes */
    var env = Math.sin(Math.PI * f);
    ox = (hash2(edgeIdx * 31 + i, 7) - 0.5) * 14 * env;
    px = a.x + f * dx + nx * ox;
    py = a.y + f * dy + ny * ox;
    if (i === 0) ctx.moveTo(w2sx(cam, sc, px), w2sy(cam, sc, py));
    else ctx.lineTo(w2sx(cam, sc, px), w2sy(cam, sc, py));
  }
  ctx.stroke();
}
function drawNode(cam, sc, n, tinted, t) {
  var cx = w2sx(cam, sc, n.x), cy = w2sy(cam, sc, n.y);
  var r = n.r * cam.scale;
  var i, a0, a1, rr;
  var ink = tinted ? n.tint : CHALK;
  /* hand-drawn ring: three wobbly arcs, each starting with a moveTo */
  for (i = 0; i < 3; i++) {
    a0 = i * TAU / 3 + 0.05 * Math.sin(t * 0.11 + i);
    a1 = (i + 1) * TAU / 3 - 0.04;
    rr = r * (1 + 0.05 * Math.sin(i * 2.7 + n.x * 0.01));
    ctx.strokeStyle = rgba(ink, tinted ? 0.95 : 0.85);
    ctx.lineWidth = Math.max(1.2, r * 0.09);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a0) * rr, cy + Math.sin(a0) * rr);
    ctx.arc(cx, cy, rr, a0, a1);
    ctx.stroke();
  }
  /* chalk dot at the centre */
  ctx.fillStyle = rgba(ink, tinted ? 0.95 : 0.8);
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.16, cy);
  ctx.arc(cx, cy, Math.max(2, r * 0.16), 0, TAU);
  ctx.fill();
  if (tinted) {
    /* era glow around the nearest node */
    var g = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 3.2);
    g.addColorStop(0, rgba(n.tint, 0.14));
    g.addColorStop(1, rgba(n.tint, 0));
    ctx.fillStyle = g;
    ctx.fillRect(cx - r * 3.2, cy - r * 3.2, r * 6.4, r * 6.4);
  }
  /* hand-lettered label above the node */
  var fs = Math.max(11, 15 * cam.scale);
  ctx.font = 'bold ' + fs.toFixed(1) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = rgba(ink, tinted ? 0.98 : 0.9);
  ctx.fillText(n.name, cx, cy - r - 6);
}
function drawNote(cam, sc, nt) {
  var cx = w2sx(cam, sc, nt.x), cy = w2sy(cam, sc, nt.y);
  var target = NODES[nt.to];
  /* faint wobbly spur from the annotation to its node */
  drawEdge(cam, sc, { x: nt.x, y: nt.y }, target, 100 + nt.to, CHALK, 0.30, Math.max(0.75, 1.1 * cam.scale));
  ctx.fillStyle = rgba(CHALK_DIM, 0.75);
  ctx.beginPath();
  ctx.moveTo(cx + 3, cy);
  ctx.arc(cx, cy, Math.max(1.5, 2.2 * cam.scale), 0, TAU);
  ctx.fill();
  var fs = Math.max(9, 11 * cam.scale);
  ctx.font = fs.toFixed(1) + 'px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = rgba(CHALK_DIM, 0.85);
  ctx.fillText(nt.name, cx + 7, cy);
}
function drawPlayhead(cam, sc, t) {
  var p = playheadAt(t);
  var e = EDGES[p.edge];
  var a = NODES[e.a], b = NODES[e.b];
  /* short bright trail behind the playhead along its edge */
  var trail = 90, i, f, tx, ty;
  ctx.strokeStyle = rgba(CHALK, 0.35);
  ctx.lineWidth = Math.max(1, 2.2 * cam.scale);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (i = 0; i <= 10; i++) {
    f = p.frac - (i / 10) * (trail / e.len);
    if (f < 0) break;
    tx = a.x + f * (b.x - a.x);
    ty = a.y + f * (b.y - a.y);
    if (i === 0) ctx.moveTo(w2sx(cam, sc, tx), w2sy(cam, sc, ty));
    else ctx.lineTo(w2sx(cam, sc, tx), w2sy(cam, sc, ty));
  }
  ctx.stroke();
  var cx = w2sx(cam, sc, p.x), cy = w2sy(cam, sc, p.y);
  var pulse = 1 + 0.12 * Math.sin(TAU * t / 2.4);
  var r = Math.max(5, 9 * cam.scale * pulse);
  var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 3);
  g.addColorStop(0, rgba(CHALK, 0.35));
  g.addColorStop(1, rgba(CHALK, 0));
  ctx.fillStyle = g;
  ctx.fillRect(cx - r * 3, cy - r * 3, r * 6, r * 6);
  /* hand-drawn halo ring */
  ctx.strokeStyle = rgba(CHALK, 0.9);
  ctx.lineWidth = Math.max(1.2, 1.6 * cam.scale);
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(0.3) * r, cy + Math.sin(0.3) * r);
  ctx.arc(cx, cy, r, 0.3, TAU - 0.4);
  ctx.stroke();
  ctx.fillStyle = CHALK;
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.38, cy);
  ctx.arc(cx, cy, Math.max(2.5, r * 0.38), 0, TAU);
  ctx.fill();
}
function drawDust(cam, sc) {
  var i, d, sx, sy;
  for (i = 0; i < DUST.length; i++) {
    d = DUST[i];
    sx = w2sx(cam, sc, d.x); sy = w2sy(cam, sc, d.y);
    if (sx < sc.x - 4 || sx > sc.x + sc.w + 4 || sy < sc.y - 4 || sy > sc.y + sc.h + 4) continue;
    ctx.fillStyle = rgba(CHALK, d.a);
    ctx.fillRect(sx, sy, d.r, d.r);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Map').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Map').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 27').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Map', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 27', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = sceneRect();
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var cam = cameraAt(t, sc);
  var p = playheadAt(t);
  var near = nearestNode(p.x, p.y);
  var i, e;
  /* main loop edges first, then annotation spurs */
  for (i = 0; i < EDGES.length; i++) {
    e = EDGES[i];
    drawEdge(cam, sc, NODES[e.a], NODES[e.b], i, CHALK, 0.75, Math.max(1, 1.8 * cam.scale));
  }
  for (i = 0; i < NOTES.length; i++) drawNote(cam, sc, NOTES[i]);
  drawDust(cam, sc);
  for (i = 0; i < NODES.length; i++) drawNode(cam, sc, NODES[i], i === near.idx, t);
  drawPlayhead(cam, sc, t);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    playheadAt: playheadAt,
    nearestAt: function (t) { var p = playheadAt(t); return nearestNode(p.x, p.y); },
    loopLen: LOOP_LEN,
    nodeCount: NODES.length,
    noteCount: NOTES.length
  };
}
/* ---- frame one: fixed phase t = 60.0 s, playhead on RAVE -> KRAFTWERK ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % LOOP_HORIZON;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
