<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>9113 — Coins With the Wrong King</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#17141c;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
// №9113 "Coins With the Wrong King" — after study #202 (Mohamed Bourouissa), prompt MB6 (PP780).
// Driver: discs fall like slow leaves; landing on the table flips them gold->silver and swaps
// the ring glyph for a star-burst; they stack in a neat row. A full row lifts its oldest disc
// back into the fall. A disc can land dark-side and waits, dark, until another lands on it —
// then both flip. Drag a falling disc to hurry or slow it; drag a stacked disc to toss it
// back into the fall (unflipped). Watch-first.
// (Deviated from the prompt's two-dot face glyph: abstract ring vs star-burst only, no faces.)
var cv=document.getElementById("c"),ctx=cv.getContext("2d");
var W=0,H=0,tableY=0;
function resize(){var d=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);tableY=H*0.86;}
window.addEventListener("resize",resize);

var seed=9113;
function rnd(){seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;}

var ROWMAX=12, discs=[], row=[];
function spawn(top){
  discs.push({
    x:rnd()*W, y:top?-20:rnd()*tableY*0.5,
    vy:14+rnd()*26, sway:rnd()*6.28, swaySp:0.4+rnd()*0.8,
    r:13+rnd()*7, flipped:false, dark:false, state:"fall", // fall | stack
    boost:0
  });
}
for(var i=0;i<10;i++) spawn(false);

function land(d){
  // occasionally land dark-side
  if(rnd()<0.16 && !d.dark){ d.dark=true; d.y=tableY-d.r; return; }
  d.flipped=true; d.dark=false; d.state="stack"; d.vy=0;
  row.push(d);
  // a dark disc under a new landing flips too
  row.forEach(function(o){ if(o!==d && o.dark && Math.abs(o.x-d.x)<d.r*2.2){ o.dark=false; o.flipped=true; } });
  if(row.length>ROWMAX){
    var old=row.shift();
    old.flipped=false; old.dark=false; old.state="fall"; old.y=-20; old.x=rnd()*W; old.vy=14+rnd()*26;
  }
}

var drag=null;
function discAt(x,y){
  for(var i=discs.length-1;i>=0;i--){var d=discs[i];
    if(Math.hypot(d.x-x,d.y-y)<d.r+14) return d;}
  return null;
}
cv.addEventListener("pointerdown",function(e){
  var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  var d=discAt(x,y);
  if(d){ drag={d:d,y0:y}; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener("pointermove",function(e){
  if(!drag) return;
  var r=cv.getBoundingClientRect(),y=e.clientY-r.top;
  var d=drag.d;
  if(d.state==="fall"){ d.boost=(drag.y0-y)*2.2; } // drag up = hurry, down = slow
  else { // stacked: toss back into the fall, unflipped
    d.flipped=false; d.dark=false; d.state="fall"; d.y=y; d.x=e.clientX-r.left; d.vy=20;
    var ri=row.indexOf(d); if(ri>=0) row.splice(ri,1);
    drag=null;
  }
});
function endDrag(){ if(drag&&drag.d.state==="fall") drag.d.boost=0; drag=null; }
cv.addEventListener("pointerup",endDrag);
cv.addEventListener("pointercancel",endDrag);

var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  ctx.fillStyle="#17141c"; ctx.fillRect(0,0,W,H);
  // table line
  ctx.strokeStyle="#6a6258"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(W*0.06,tableY); ctx.lineTo(W*0.94,tableY); ctx.stroke();
  discs.forEach(function(d){
    if(d.state==="fall"){
      d.sway+=dt*d.swaySp;
      d.y+=(d.vy+d.boost)*dt;
      d.x+=Math.sin(d.sway)*22*dt;
      d.boost*=0.92;
      if(d.x<10)d.x=10; if(d.x>W-10)d.x=W-10;
      if(d.y>=tableY-d.r) land(d);
    }
  });
  // stacked row layout: neat row along the table, centered
  var n=row.length, gap=0;
  if(n>1) gap=Math.min(2*(row[0]?row[0].r:16)+6,(W*0.88)/n);
  var sx=W/2-gap*(n-1)/2;
  row.forEach(function(d,i){ d.x=sx+i*gap; d.y=tableY-d.r; });
  // draw
  discs.forEach(function(d){
    var col=d.dark?"#2a2530":(d.flipped?"#d8d8d8":"#c9a86a");
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,6.29); ctx.fill();
    if(!d.dark){
      if(!d.flipped){
        ctx.strokeStyle="#26221e"; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.arc(d.x,d.y,d.r*0.45,0,6.29); ctx.stroke();
      }else{
        ctx.strokeStyle="#26221e"; ctx.lineWidth=2.5;
        for(var k=0;k<8;k++){var a=k/8*6.283;
          ctx.beginPath();ctx.moveTo(d.x+Math.cos(a)*d.r*0.2,d.y+Math.sin(a)*d.r*0.2);
          ctx.lineTo(d.x+Math.cos(a)*d.r*0.62,d.y+Math.sin(a)*d.r*0.62);ctx.stroke();}
      }
    }
  });
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
