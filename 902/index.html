<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>m_is.'s/u</title>
<style>
  html, body { margin: 0; padding: 0; background: #080808; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(90263);

  // ---------- palette (strict: black and white only) ----------
  var GROUND = '#080808';
  var RING_WHITE = '#EDEDEA';
  var RING_MID = '#8E8E88';
  var VOID = '#000000';
  var BRUSH_WHITE = '#FFFFFF';
  var FIBER_GREY = '#555552';
  var TONES = [RING_WHITE, RING_MID, FIBER_GREY, BRUSH_WHITE];

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return H > W * 1.15;
  }

  function resize() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width || 0; h = window.visualViewport.height || 0;
    }
    if (!w || !h) {
      w = (typeof window !== 'undefined' && window.innerWidth) || 720;
      h = (typeof window !== 'undefined' && window.innerHeight) || 720;
    }
    W = Math.round(w); H = Math.round(h);
    DPR = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) {
      DPR = Math.min(window.devicePixelRatio, isPhone() ? 1.5 : 2);
    }
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  // ---------- specimen geometry (all precomputed, seeded) ----------
  // Units: radii are fractions of S = min(W, H); the specimen is centered.
  var NP = 90; // angular samples per ring

  // A set of torn concentric rings. Each ring carries NP radius multipliers
  // (seeded harmonics + per-sample tear jitter) and a list of short fibrous
  // arc strokes: a ring is never drawn as one clean ellipse.
  function makeRings(count, rIn, rOut, ex, ey, brightBias) {
    var rings = [];
    for (var i = 0; i < count; i++) {
      var f = count === 1 ? 0 : i / (count - 1);
      var rFrac = rIn + (rOut - rIn) * Math.pow(f, 1.08) + (rng() - 0.5) * 0.004;
      var h1 = { a: 0.010 + rng() * 0.030, k: 2 + Math.floor(rng() * 4), p: rng() * 6.2832 };
      var h2 = { a: 0.006 + rng() * 0.020, k: 6 + Math.floor(rng() * 6), p: rng() * 6.2832 };
      var h3 = { a: 0.003 + rng() * 0.012, k: 12 + Math.floor(rng() * 8), p: rng() * 6.2832 };
      var tear = 0.003 + rng() * 0.008;
      var samples = [];
      for (var j = 0; j < NP; j++) {
        var th = (j / NP) * Math.PI * 2;
        var m = 1
          + h1.a * Math.sin(h1.k * th + h1.p)
          + h2.a * Math.sin(h2.k * th + h2.p)
          + h3.a * Math.sin(h3.k * th + h3.p)
          + (rng() - 0.5) * 2 * tear;
        samples.push(m);
      }
      var strokes = [];
      var nSt = 22 + Math.floor(rng() * 17); // 22-38 fibrous strokes
      for (var s = 0; s < nSt; s++) {
        var roll = rng();
        var tone;
        if (roll < 0.50 + brightBias) tone = 0;        // ring white
        else if (roll < 0.80) tone = 1;                // ring mid
        else if (roll < 0.94) tone = 2;                // fiber grey
        else tone = 3;                                 // brush white, rare
        strokes.push({
          j0: Math.floor(rng() * NP),
          len: 3 + Math.floor(rng() * 7),              // 3-9 samples long
          dro: (rng() - 0.5) * 0.009,                  // radial offset (frac of S)
          w: 0.5 + rng() * 1.9,                        // px at S = 720
          tone: tone,
          alpha: 0.40 + rng() * 0.60
        });
      }
      rings.push({
        rFrac: rFrac, samples: samples, strokes: strokes,
        ex: ex, ey: ey, phase: rng() * Math.PI * 2
      });
    }
    return rings;
  }

  // View 1: tight torn rings around a dark heart.
  var view1 = { rings: makeRings(60, 0.075, 0.485, 1, 1, 0.10), voidRx: 0.075, voidRy: 0.075 };

  // View 2: a large oval swirl, a dark oval void at its heart, and a partial
  // neighbouring swirl cut off at the right edge, split by a vertical bar.
  var view2 = {
    rings: makeRings(44, 0.115, 0.46, 1.32, 0.94, 0.05),
    voidRx: 0.115 * 1.32, voidRy: 0.115 * 0.94,
    neighbour: makeRings(26, 0.09, 0.42, 1.20, 0.90, 0.0),
    nDx: 0.99, nDy: -0.05, barX0: 0.545, barX1: 0.60
  };

  // View 3: streaming brush arcs over a black void field. Each arc is a
  // tapered filled shape swept along a quadratic curve in polar space.
  function makeArcs(count) {
    var arcs = [];
    for (var i = 0; i < count; i++) {
      var dir = rng() < 0.82 ? 1 : -1;
      var a0 = rng() * Math.PI * 2;
      var span = (0.5 + rng() * 1.7) * dir;
      var r0 = 0.06 + Math.pow(rng(), 0.8) * 0.42;
      var r1 = Math.max(0.05, r0 + (rng() - 0.5) * 0.16);
      var rC = (r0 + r1) / 2 + 0.02 + rng() * 0.07;
      var roll = rng();
      arcs.push({
        a0: a0, a1: a0 + span, r0: r0, r1: r1, rC: rC,
        wMax: 2.5 + rng() * 9,               // px at S = 720
        tone: roll < 0.62 ? 3 : (roll < 0.84 ? 0 : (roll < 0.94 ? 1 : 2)),
        alpha: 0.30 + rng() * 0.60
      });
    }
    return arcs;
  }
  var view3 = { arcs: makeArcs(30) };

  // ---------- interaction state (recorded tap events only) ----------
  var events = []; // tap times, seconds since load
  var simTime = 0;

  function smooth(x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    return x * x * (3 - 2 * x);
  }

  // Page, fade and zoom are closed-form functions of the event list and t.
  function computeState(t) {
    var view = 0, fadeFrom = 0, fadeTo = 0, fadeStart = -1;
    var zoomStart = -1, pendingT = -1;
    function turn(tc) {
      if (fadeStart >= 0) { view = fadeTo; fadeStart = -1; }
      fadeFrom = view; fadeTo = (view + 1) % 3; fadeStart = tc;
    }
    for (var i = 0; i < events.length; i++) {
      var et = events[i];
      if (et > t) break;
      if (pendingT >= 0) {
        if (et - pendingT <= 0.35) { zoomStart = et; pendingT = -1; continue; }
        turn(pendingT + 0.35); pendingT = -1;
      }
      pendingT = et;
    }
    if (pendingT >= 0 && t >= pendingT + 0.35) { turn(pendingT + 0.35); pendingT = -1; }
    var a = view, b = view, p = 0, fs = -1;
    if (fadeStart >= 0) {
      var fp = (t - fadeStart) / 0.8;
      if (fp >= 1) { a = fadeTo; b = fadeTo; }
      else { a = fadeFrom; b = fadeTo; p = Math.max(fp, 0); fs = fadeStart; }
    }
    var zoom = 1;
    if (zoomStart >= 0) {
      var dt = t - zoomStart;
      if (dt < 6) zoom = 1 + 0.6 * smooth(dt / 6);          // slow push-in
      else if (dt < 7.5) zoom = 1.6;                        // hold a breath
      else if (dt < 11.5) zoom = 1.6 - 0.6 * smooth((dt - 7.5) / 4); // drift back
    }
    return { a: a, b: b, p: p, zoom: zoom, fadeStart: fs };
  }

  // ---------- drawing ----------
  function drawRings(rings, cx, cy, S, t, zoom) {
    var wScale = (S / 720) * zoom;
    for (var i = 0; i < rings.length; i++) {
      var ring = rings[i];
      // The only motion: a barely perceptible breathing of the radii,
      // plus or minus ~2.5 px over a 20 s cycle, a pure sine of t.
      var breath = 2.5 * Math.sin((Math.PI * 2 * t) / 20 + ring.phase * 0.15) / S;
      var baseR = ring.rFrac + breath;
      var sm = ring.samples;
      for (var s = 0; s < ring.strokes.length; s++) {
        var st = ring.strokes[s];
        ctx.strokeStyle = TONES[st.tone];
        ctx.globalAlpha = st.alpha;
        ctx.lineWidth = Math.max(0.4, st.w * wScale);
        ctx.beginPath();
        for (var k = 0; k <= st.len; k++) {
          var j = (st.j0 + k) % NP;
          var th = (j / NP) * Math.PI * 2;
          var r = (baseR * sm[j] + st.dro) * S;
          var x = cx + Math.cos(th) * r * ring.ex;
          var y = cy + Math.sin(th) * r * ring.ey;
          if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawView(idx, cx, cy, S, t, zoom) {
    if (idx === 0) {
      ctx.fillStyle = VOID;
      ctx.beginPath();
      ctx.arc(cx, cy, view1.voidRx * S * 0.98, 0, Math.PI * 2);
      ctx.fill();
      drawRings(view1.rings, cx, cy, S, t, zoom);
    } else if (idx === 1) {
      drawRings(view2.rings, cx, cy, S, t, zoom);
      drawRings(view2.neighbour, cx + view2.nDx * S, cy + view2.nDy * S, S, t, zoom);
      // the narrow vertical dark bar separating the two swirls
      ctx.fillStyle = VOID;
      ctx.fillRect(cx + view2.barX0 * S, 0, (view2.barX1 - view2.barX0) * S, H);
      // the dark oval void at the heart
      ctx.beginPath();
      ctx.ellipse(cx, cy, view2.voidRx * S * 0.98, view2.voidRy * S * 0.98, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      var scale = 1 + 0.004 * Math.sin((Math.PI * 2 * t) / 20);
      for (var i = 0; i < view3.arcs.length; i++) {
        var arc = view3.arcs[i];
        var SEG = 20, left = [], right = [], pts = [];
        for (var k2 = 0; k2 <= SEG; k2++) {
          var u = k2 / SEG;
          var ang = arc.a0 + (arc.a1 - arc.a0) * u;
          var rr = (1 - u) * (1 - u) * arc.r0 + 2 * (1 - u) * u * arc.rC + u * u * arc.r1;
          rr *= scale;
          pts.push({ x: cx + Math.cos(ang) * rr * S, y: cy + Math.sin(ang) * rr * S, u: u });
        }
        for (var k3 = 0; k3 <= SEG; k3++) {
          var p0 = pts[Math.max(0, k3 - 1)], p1 = pts[k3], p2 = pts[Math.min(SEG, k3 + 1)];
          var dx = p2.x - p0.x, dy = p2.y - p0.y;
          var dl = Math.sqrt(dx * dx + dy * dy) || 1;
          var nx = -dy / dl, ny = dx / dl;
          var wHalf = 0.5 * arc.wMax * (S / 720) * zoom * Math.pow(Math.sin(Math.PI * Math.min(p1.u * 1.15, 1)), 0.7);
          left.push({ x: p1.x + nx * wHalf, y: p1.y + ny * wHalf });
          right.push({ x: p1.x - nx * wHalf, y: p1.y - ny * wHalf });
        }
        ctx.fillStyle = TONES[arc.tone];
        ctx.globalAlpha = arc.alpha;
        ctx.beginPath();
        ctx.moveTo(left[0].x, left[0].y);
        for (var k4 = 1; k4 < left.length; k4++) ctx.lineTo(left[k4].x, left[k4].y);
        for (var k5 = right.length - 1; k5 >= 0; k5--) ctx.lineTo(right[k5].x, right[k5].y);
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var S = Math.min(W, H);
    var cx = W / 2, cy = H / 2;
    var st = computeState(t);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(st.zoom, st.zoom);
    ctx.translate(-cx, -cy);
    if (st.p > 0) {
      ctx.globalAlpha = 1 - st.p;
      drawView(st.a, cx, cy, S, t, st.zoom);
      ctx.globalAlpha = st.p;
      drawView(st.b, cx, cy, S, t, st.zoom);
      ctx.globalAlpha = 1;
    } else {
      drawView(st.a, cx, cy, S, t, st.zoom);
    }
    ctx.restore();
    return st;
  }

  // ---------- audio (lazy, gesture-only, typeof-guarded) ----------
  // Near-silence: a faint room tone; a page turn is one soft paper whisper.
  var AC = null, audioRng = mulberry32(4177);
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    if (typeof window === 'undefined') return;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (typeof Ctor !== 'function') return;
    try { AC = new Ctor(); } catch (e) { AC = null; return; }
    var len = Math.floor(AC.sampleRate * 2);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    var last = 0;
    for (var i = 0; i < len; i++) {
      var white = audioRng() * 2 - 1;
      last = (last + 0.02 * white) / 1.02; // brown-ish
      d[i] = last * 3.2;
    }
    var src = AC.createBufferSource();
    src.buffer = buf; src.loop = true;
    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 320;
    var g = AC.createGain();
    g.gain.value = 0.016; // at the edge of hearing
    src.connect(lp); lp.connect(g); g.connect(AC.destination);
    src.start();
  }
  function whisper() {
    if (!AC) return;
    var dur = 0.28;
    var len = Math.floor(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (audioRng() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource();
    src.buffer = buf;
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 0.7;
    var g = AC.createGain();
    var now = AC.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.10, now + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(bp); bp.connect(g); g.connect(AC.destination);
    src.start();
  }

  // ---------- events ----------
  function onDown() {
    ensureAudio();
    events.push(simTime);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(simTime); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { resize(); draw(simTime); });
    }
  }

  // ---------- run ----------
  resize();
  draw(0); // frame one: synchronous, t = 0, view 1 at rest scale
  var startStamp = -1, lastFadeStart = -1;
  function frame(ts) {
    if (startStamp < 0) startStamp = ts;
    simTime = (ts - startStamp) / 1000;
    var st = draw(simTime);
    if (st.fadeStart >= 0 && st.fadeStart !== lastFadeStart) {
      lastFadeStart = st.fadeStart;
      whisper();
    }
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
