<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.184 Quarter Turn</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#060606; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font:12px system-ui, sans-serif; color:#8A8A90; opacity:0.55;
    pointer-events:none; letter-spacing:0.04em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap to turn the crank</div>
<script>
(function () {
'use strict';
// No.184 Quarter Turn (Goodman-Strauss). A gyroid lattice band,
// drawn twice with an offset so its two sides wear different
// shades and cannot be swapped. At its vertices sit coloured
// nodes, and the nodes obey his Double Triamond rule absolutely:
// the colours may only ever cycle red to yellow to green to blue
// to red. No shuffle, no reversal, no other permutation ever
// appears, in the loop or from the tap. The tap is a crank:
// one tap, one quarter turn of the cycle.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#060606', SIDE_A = '#3A3A40', SIDE_B = '#141416';
var PALETTE = ['#E4572E', '#F2B233', '#4CAF7D', '#2E6BE6']; // red, yellow, green, blue
var MONO = [58, 58, 64];
var W = 0, H = 0;

// ---- gyroid band lattice ------------------------------------------
var SC = 1.02, TH = 0.9;
var pts = [], edges = [], nodes = [];
(function build() {
  var map = {};
  for (var i = -2; i <= 2; i++) for (var j = -2; j <= 2; j++) for (var k = -2; k <= 2; k++) {
    var x = i * SC, y = j * SC, z = k * SC;
    var f = Math.sin(x) * Math.cos(y) + Math.sin(y) * Math.cos(z) + Math.sin(z) * Math.cos(x);
    if (Math.abs(f) < TH) {
      map[i + ',' + j + ',' + k] = pts.length;
      pts.push([x, y, z]);
      var m = ((i + 2 * j + 3 * k) % 12 + 12) % 12;
      if (m < 6) nodes.push({ p: pts.length - 1, base: nodes.length % 4 });
    }
  }
  for (var a = 0; a < pts.length; a++) {}
  // edges between grid neighbours, recovered from coordinates
  for (var n = 0; n < pts.length; n++) {
    var p = pts[n];
    [[SC, 0, 0], [0, SC, 0], [0, 0, SC]].forEach(function (d) {
      var q = [p[0] + d[0], p[1] + d[1], p[2] + d[2]];
      for (var m2 = 0; m2 < pts.length; m2++) {
        var r = pts[m2];
        if (Math.abs(r[0] - q[0]) < 0.01 && Math.abs(r[1] - q[1]) < 0.01 && Math.abs(r[2] - q[2]) < 0.01) {
          edges.push([n, m2]);
          break;
        }
      }
    });
  }
})();

function hexRGB(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
var PAL_RGB = PALETTE.map(hexRGB);
function mixc(a, b, k) {
  return [Math.round(a[0] + (b[0] - a[0]) * k), Math.round(a[1] + (b[1] - a[1]) * k), Math.round(a[2] + (b[2] - a[2]) * k)];
}
function css(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

// ---- the 48 second loop --------------------------------------------
var LOOP = 48, OFFSET = 13;
function loopSteps(t) {           // cyclic steps scheduled by the loop
  var lt = ((t % LOOP) + LOOP) % LOOP;
  if (lt < 20) return 0;
  if (lt < 28) return (lt - 20) / 2;   // four quarter turns, crossfading
  return 4;
}
function monoMix(t) {              // fade to monochrome and back, 34-48s
  var lt = ((t % LOOP) + LOOP) % LOOP;
  if (lt < 34) return 0;
  if (lt < 41) return (lt - 34) / 7;
  return 1 - (lt - 41) / 7;
}
var tapCount = 0, tapAnim = 0, lastNow = -1;

function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function project(t) {
  var ay = t * Math.PI * 2 / 64;
  var ax = 0.55 + 0.10 * Math.sin(t * Math.PI * 2 / 97);
  var cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay);
  var S = Math.min(W, H) * 0.135;
  return pts.map(function (p) {
    var y1 = p[1] * cx - p[2] * sx, z1 = p[1] * sx + p[2] * cx;
    var x2 = p[0] * cy + z1 * sy, z2 = -p[0] * sy + z1 * cy;
    return { x: W / 2 + x2 * S, y: H / 2 + y1 * S, d: z2 };
  });
}

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var t = now / 1000 + OFFSET;
  var dt = lastNow < 0 ? 0 : Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  tapAnim += (tapCount - tapAnim) * Math.min(1, dt * 2.4 + (dt === 0 ? 0 : 0.02));
  var S = loopSteps(t) + tapAnim;
  var mono = monoMix(t);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var P = project(t);
  var i, a, b;
  // side B: the far shade, offset so the two sides cannot be swapped
  ctx.strokeStyle = SIDE_B;
  ctx.lineWidth = Math.max(4, Math.min(W, H) * 0.011);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (i = 0; i < edges.length; i++) {
    a = P[edges[i][0]]; b = P[edges[i][1]];
    ctx.moveTo(a.x + 4, a.y + 4);
    ctx.lineTo(b.x + 4, b.y + 4);
  }
  ctx.stroke();
  // side A: matte charcoal lattice
  ctx.strokeStyle = SIDE_A;
  ctx.lineWidth = Math.max(2, Math.min(W, H) * 0.0055);
  ctx.beginPath();
  for (i = 0; i < edges.length; i++) {
    a = P[edges[i][0]]; b = P[edges[i][1]];
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
  }
  ctx.stroke();
  // nodes: colour = palette[(base + S) mod 4], always a cyclic rotation
  for (i = 0; i < nodes.length; i++) {
    var nd = nodes[i], pr = P[nd.p];
    var idx = nd.base + S;
    var i0 = Math.floor(idx);
    var frac = idx - i0;
    var col = mixc(PAL_RGB[((i0 % 4) + 4) % 4], PAL_RGB[(((i0 + 1) % 4) + 4) % 4], frac);
    if (mono > 0) col = mixc(col, MONO, mono);
    var r = Math.min(W, H) * 0.0085 + Math.max(0, pr.d) * Math.min(W, H) * 0.0016;
    ctx.fillStyle = css(col);
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, Math.max(3, r), 0, Math.PI * 2);
    ctx.fill();
  }
}

canvas.addEventListener('pointerup', function (e) {
  // a tap (short, still) turns the crank exactly one quarter
  if (e.timeStamp - downAt < 350) tapCount++;
});
var downAt = 0;
canvas.addEventListener('pointerdown', function (e) { downAt = e.timeStamp; });

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
