<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.426 Golden Sun</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#A8D8F0; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.426 Golden Sun (yaelhofri, EXPANSION #46).
// After Yael Hofri's Sweetemberdays26 Prompt 1: a woman
// on a sunny balcony watering her plants under one huge
// golden sun. The sun is a flat radiant disc centred in
// the top third, diameter about a third of the width,
// ringed by exactly 12 ray triangles. Below it a brown
// railing runs the full width over a terracotta floor
// band; terracotta pots in three sizes stand along the
// bottom edge, and leafy trails on bezier stems trail in
// from the upper left. The woman stands lower right at
// half the canvas height in a pink dress, holding a
// tilted watering can; a stream of golden dots falls
// from its spout into the big pot at her side. The pots
// carry a brown edge (the palette's railing brown) so
// their terracotta separates from the terracotta floor.
//
// The ambient loop is 30s, seamless, and the piece is
// watch-only at rest: the sun's rays rotate exactly one
// ray pitch (30 degrees, a twelfth of a turn) per loop,
// so the wrap is invisible by the sun's own symmetry;
// the sun pulses 1.0 to 1.04 on 3 whole cycles per
// loop; every watering dot falls a whole number of
// times per loop and wraps at pot level; every leaf
// sways on a whole number of cycles per loop. DRAG
// stirs the air: the leaf sway amplitude follows the
// pointer's velocity while dragging, and on release
// the stir decays and snaps to exactly zero, so the
// sway settles back to exactly the ambient loop. Frame
// one is drawn synchronously at the constant phase
// T = 7.5s (sun part-turned, pulse at mid-scale, water
// mid-fall); the clock is anchored there and advances
// in fixed 1/60 ticks, never from a wall clock. Flat
// colour only, shapes defined by colour contrast, one
// canvas, no offscreen canvas, no gradients, no
// shadowBlur, no text anywhere.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Closed set from the prompt, nothing else: sun gold and
// ray yellow, sky blue, balcony terracotta, railing
// brown, two leaf greens, dress pink, skin. The watering
// dots take the ray yellow: drops catching the sunlight,
// the only palette colour that stays visible against
// sky, dress and terracotta alike.
var SUN = '#F5A623', RAYS = '#F7D354', SKY = '#A8D8F0';
var TERRA = '#C97B4A', BROWN = '#5B3A29';
var LEAF_D = '#4E7A3A', LEAF_L = '#6FA84F';
var DRESS = '#F06A8A', SKIN = '#F2C49B';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30;
if (LOOP !== 30) throw new Error('Golden Sun loop must be 30s');
var TICK = 1 / 60;

// ---- small draw helpers ---------------------------------
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function ell(x, y, rx, ry, fill) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function line(x0, y0, x1, y1, col, lw) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
// One leaf: a pointed blade extending +x from its stem
// point, length len, width wid, with a vein in the
// opposite green.
function leafShape(len, wid, fill, vein) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.5, -wid, len, 0);
  ctx.quadraticCurveTo(len * 0.5, wid, 0, 0);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  line(len * 0.14, 0, len * 0.88, 0, vein, 2.2);
}

// ---- fixed data: seeded scatter --------------------------
// Fixed seed, data only: phases for the leaf tables.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---- the sun ---------------------------------------------
// Flat disc, radius 205 (diameter 410, about a third of
// the 1280 width), centred in the top third at
// (640, 280). Exactly 12 ray triangles ring it.
var SUN_X = 640, SUN_Y = 280, SUN_R = 205;
var RAY_N = 12;
if (RAY_N !== 12) throw new Error('Golden Sun must have exactly 12 rays');
function drawSun(lt) {
  var pulse = 1 + 0.02 * (1 - Math.cos(Math.PI * 2 * 3 * lt / LOOP));
  var rot = (Math.PI * 2 / RAY_N) * (lt / LOOP);
  ctx.save();
  ctx.translate(SUN_X, SUN_Y);
  ctx.rotate(rot);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = RAYS;
  for (var i = 0; i < RAY_N; i++) {
    var a = i * Math.PI * 2 / RAY_N, hw = 0.105;
    ctx.beginPath();
    ctx.moveTo((SUN_R + 12) * Math.cos(a - hw), (SUN_R + 12) * Math.sin(a - hw));
    ctx.lineTo((SUN_R + 96) * Math.cos(a), (SUN_R + 96) * Math.sin(a));
    ctx.lineTo((SUN_R + 12) * Math.cos(a + hw), (SUN_R + 12) * Math.sin(a + hw));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.save();
  ctx.translate(SUN_X, SUN_Y);
  ctx.scale(pulse, pulse);
  circ(0, 0, SUN_R, SUN);
  ctx.restore();
}

// ---- trailing leaves from the upper left ------------------
// Three bezier stems trail in from the top and left
// edges. Each carries four leaves at fixed parameters;
// every leaf sways on a whole number of cycles per loop
// around its stem point. swayAmp is the shared air
// multiplier: 1 at rest, rising with drag velocity.
var TRAILS = [
  { p: [-30, 80, 150, 10, 310, 55, 445, 140] },
  { p: [-30, 265, 110, 175, 235, 205, 345, 305] },
  { p: [140, -30, 165, 85, 80, 150, 35, 265] }
];
var TRAIL_LEAVES = [];
(function () {
  var rng = mulberry32(426);
  var ts = [0.22, 0.44, 0.66, 0.88];
  for (var ti = 0; ti < TRAILS.length; ti++) {
    for (var li = 0; li < ts.length; li++) {
      TRAIL_LEAVES.push({
        trail: ti, t: ts[li],
        side: (li % 2 === 0) ? 1 : -1,
        len: 34 + Math.floor(rng() * 15),
        cyc: 2 + Math.floor(rng() * 3),
        ph: rng() * Math.PI * 2,
        dark: (ti + li) % 2 === 0
      });
    }
  }
})();
if (TRAIL_LEAVES.length !== 12) throw new Error('trails must carry exactly 12 leaves');
function cubic(p, t) {
  var u = 1 - t;
  return {
    x: u * u * u * p[0] + 3 * u * u * t * p[2] + 3 * u * t * t * p[4] + t * t * t * p[6],
    y: u * u * u * p[1] + 3 * u * u * t * p[3] + 3 * u * t * t * p[5] + t * t * t * p[7]
  };
}
function cubicTan(p, t) {
  var dx = 3 * (1 - t) * (1 - t) * (p[2] - p[0]) + 6 * (1 - t) * t * (p[4] - p[2]) + 3 * t * t * (p[6] - p[4]);
  var dy = 3 * (1 - t) * (1 - t) * (p[3] - p[1]) + 6 * (1 - t) * t * (p[5] - p[3]) + 3 * t * t * (p[7] - p[5]);
  return Math.atan2(dy, dx);
}
function drawTrails(lt, air) {
  var i;
  for (i = 0; i < TRAILS.length; i++) {
    var p = TRAILS[i].p;
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]);
    ctx.bezierCurveTo(p[2], p[3], p[4], p[5], p[6], p[7]);
    ctx.strokeStyle = LEAF_D; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  }
  var amp = 0.10 * (1 + 2.4 * air);
  for (i = 0; i < TRAIL_LEAVES.length; i++) {
    var L = TRAIL_LEAVES[i];
    var pt = cubic(TRAILS[L.trail].p, L.t);
    var ta = cubicTan(TRAILS[L.trail].p, L.t);
    var sway = amp * Math.sin(Math.PI * 2 * L.cyc * lt / LOOP + L.ph);
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(ta + L.side * (0.55 + sway));
    leafShape(L.len, L.len * 0.30, L.dark ? LEAF_D : LEAF_L, L.dark ? LEAF_L : LEAF_D);
    ctx.restore();
  }
}

// ---- balcony: floor band and railing -----------------------
function drawBalcony() {
  // floor band (the balcony floor seen edge-on)
  ctx.fillStyle = TERRA;
  ctx.fillRect(-260, 796, DW + 520, DH - 796 + 260);
  // balusters against the sky
  ctx.fillStyle = BROWN;
  for (var x = 26; x < DW; x += 74) ctx.fillRect(x, 686, 13, 88);
  // top and bottom rails
  ctx.fillRect(-260, 660, DW + 520, 26);
  ctx.fillRect(-260, 774, DW + 520, 22);
}

// ---- pots along the bottom edge ------------------------------
// Five terracotta pots in three sizes standing on the
// floor band, baseline 884. Each is a rimmed trapezoid
// with a fan of leaves over the rim; the foliage sways
// gently with the same air as the trails.
var POTS = [
  { x: 128, s: 0.62 }, { x: 292, s: 0.88 }, { x: 468, s: 0.58 },
  { x: 838, s: 1.02 }, { x: 1188, s: 0.50 }
];
if (POTS.length !== 5) throw new Error('Golden Sun must have exactly 5 pots');
var POT_LEAVES = [];
(function () {
  var rng = mulberry32(907);
  for (var pi = 0; pi < POTS.length; pi++) {
    for (var li = 0; li < 6; li++) {
      POT_LEAVES.push({
        pot: pi, k: li,
        ang: -Math.PI * (0.18 + 0.64 * (li / 5)),
        len: (30 + rng() * 16),
        cyc: 2 + Math.floor(rng() * 3),
        ph: rng() * Math.PI * 2,
        dark: li % 2 === 0
      });
    }
  }
})();
if (POT_LEAVES.length !== 30) throw new Error('pot foliage must hold exactly 30 leaves');
function potGeom(p) {
  var w = 150 * p.s, h = 104 * p.s;
  return { w: w, h: h, top: 884 - h, rimH: h * 0.22 };
}
function drawPotBody(p) {
  var g = potGeom(p);
  ctx.beginPath();
  ctx.moveTo(p.x - g.w * 0.36, 884);
  ctx.lineTo(p.x + g.w * 0.36, 884);
  ctx.lineTo(p.x + g.w * 0.5, g.top + g.rimH);
  ctx.lineTo(p.x - g.w * 0.5, g.top + g.rimH);
  ctx.closePath();
  ctx.fillStyle = TERRA; ctx.fill();
  ctx.strokeStyle = BROWN; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.beginPath();
  ctx.rect(p.x - g.w * 0.53, g.top, g.w * 1.06, g.rimH);
  ctx.fillStyle = TERRA; ctx.fill();
  ctx.strokeStyle = BROWN; ctx.lineWidth = 5; ctx.stroke();
}
function drawPotFoliage(p, lt, air) {
  var g = potGeom(p);
  var amp = 0.05 * (1 + 2.4 * air);
  for (var i = 0; i < POT_LEAVES.length; i++) {
    var L = POT_LEAVES[i];
    if (L.pot !== POTS.indexOf(p)) continue;
    var sway = amp * Math.sin(Math.PI * 2 * L.cyc * lt / LOOP + L.ph);
    var ll = L.len * (0.55 + 0.5 * p.s) + 8;
    ctx.save();
    ctx.translate(p.x, g.top + g.rimH * 0.6);
    ctx.rotate(L.ang + sway);
    leafShape(ll, ll * 0.30, L.dark ? LEAF_D : LEAF_L, L.dark ? LEAF_L : LEAF_D);
    ctx.restore();
  }
}

// ---- the woman and her watering can ---------------------------
// Lower right, feet on the 884 baseline, head top at
// 434: exactly half the canvas height. Pink A-line
// dress, brown hair (the palette's dark brown) falling
// behind her shoulders, bun on top. Her left arm reaches
// to the can; the can tilts over the big pot at x 838.
var CAN = { x: 905, y: 632, rot: -0.38 };
var SPOUT = { x: 821, y: 701 };
function drawWoman() {
  // hair fall behind the shoulders: a brown disc whose
  // lower half the dress covers, leaving hair beside
  // the face and shoulders
  circ(1035, 545, 63, BROWN);
  // legs and shoes
  line(975, 718, 968, 870, SKIN, 30);
  line(1062, 718, 1078, 870, SKIN, 30);
  ell(960, 880, 27, 10, BROWN);
  ell(1086, 880, 27, 10, BROWN);
  // dress
  ctx.beginPath();
  ctx.moveTo(972, 548);
  ctx.lineTo(1098, 548);
  ctx.lineTo(1130, 742);
  ctx.quadraticCurveTo(1035, 756, 940, 742);
  ctx.closePath();
  ctx.fillStyle = DRESS; ctx.fill();
  // neck and head
  ctx.fillStyle = SKIN;
  ctx.fillRect(1018, 516, 34, 36);
  circ(1035, 486, 47, SKIN);
  // hair cap and bun
  circ(1031, 476, 50, BROWN);
  circ(1038, 494, 44, SKIN);
  circ(984, 446, 20, BROWN);
  // face: closed happy eyes, smile, pink cheeks
  ctx.strokeStyle = BROWN; ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(1020, 492, 7, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  ctx.beginPath(); ctx.arc(1054, 492, 7, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.arc(1037, 500, 9, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
  ell(1002, 506, 7.5, 4.5, DRESS);
  ell(1072, 506, 7.5, 4.5, DRESS);
  // left arm reaching up to the can handle's end
  line(986, 576, 928, 592, SKIN, 24);
  // the watering can, tilted over the big pot
  ctx.save();
  ctx.translate(CAN.x, CAN.y);
  ctx.rotate(CAN.rot);
  // spout
  ctx.beginPath();
  ctx.moveTo(-46, -12);
  ctx.lineTo(-106, 24);
  ctx.lineTo(-98, 40);
  ctx.lineTo(-44, 16);
  ctx.closePath();
  ctx.fillStyle = TERRA; ctx.fill();
  // body
  ctx.beginPath();
  ctx.moveTo(-52 + 10, -34);
  ctx.lineTo(52 - 10, -34);
  ctx.arcTo(52, -34, 52, -34 + 10, 10);
  ctx.lineTo(52, 34 - 10);
  ctx.arcTo(52, 34, 52 - 10, 34, 10);
  ctx.lineTo(-52 + 10, 34);
  ctx.arcTo(-52, 34, -52, 34 - 10, 10);
  ctx.lineTo(-52, -34 + 10);
  ctx.arcTo(-52, -34, -52 + 10, -34, 10);
  ctx.closePath();
  ctx.fillStyle = TERRA; ctx.fill();
  // handle over the top and the hand's grip point
  ctx.beginPath();
  ctx.arc(0, -30, 38, Math.PI * 1.05, Math.PI * 1.95);
  ctx.strokeStyle = BROWN; ctx.lineWidth = 7; ctx.stroke();
  ctx.restore();
  circ(928, 592, 12, SKIN);
  // right arm hanging at her side
  ctx.beginPath();
  ctx.moveTo(1086, 576);
  ctx.quadraticCurveTo(1114, 636, 1108, 692);
  ctx.strokeStyle = SKIN; ctx.lineWidth = 24; ctx.lineCap = 'round'; ctx.stroke();
  circ(1108, 694, 12, SKIN);
}

// ---- the watering stream ---------------------------------------
// Exactly 7 golden dots on one quadratic path from the
// spout tip to the big pot's rim. Each dot falls a whole
// number of times per loop (12), staggered by sevenths,
// and wraps at pot level behind the pot's foliage, which
// is drawn after the stream. Seven dots over the short
// fall stay separate drops; sixteen merged into a ribbon
// at the first QA pass.
var DOTS = 7, FALLS = 12;
if (DOTS !== 7 || FALLS !== 12) throw new Error('stream table must be 7 dots x 12 falls');
var STREAM_END = { x: 838, y: 782 };
function drawStream(lt) {
  var cx = 820, cy = 740;
  for (var i = 0; i < DOTS; i++) {
    var p = (i / DOTS + FALLS * lt / LOOP) % 1;
    var u = 1 - p;
    var x = u * u * SPOUT.x + 2 * u * p * cx + p * p * STREAM_END.x;
    var y = u * u * SPOUT.y + 2 * u * p * cy + p * p * STREAM_END.y;
    circ(x, y, 4.6 - p * 0.9, RAYS);
  }
}

// ---- scene -------------------------------------------------------
function draw() {
  var lt = T % LOOP;
  ctx.fillStyle = SKY;
  ctx.fillRect(-280, -320, DW + 560, DH + 640);
  drawSun(lt);
  drawTrails(lt, airNow);
  drawBalcony();
  var i;
  for (i = 0; i < POTS.length; i++) drawPotBody(POTS[i]);
  for (i = 0; i < POTS.length; i++) {
    if (POTS[i].x !== 838) drawPotFoliage(POTS[i], lt, airNow);
  }
  drawWoman();
  drawStream(lt);
  drawPotFoliage(POTS[3], lt, airNow);
}

// ---- piece state ---------------------------------------------------
// Constant first-frame phase: T = 7.5s into the 30s loop
// (sun turned a quarter of a ray pitch, pulse at exactly
// mid-scale 1.02, dots spread down the stream). The clock
// advances in fixed 1/60 ticks from there.
//
// The air: while dragging, airNow eases toward a target
// set by the pointer's smoothed speed; on release it
// decays geometrically in step() and snaps to exactly
// zero, so the leaves settle back to exactly the ambient
// sway. The sway itself is a pure function of T and
// airNow, so frame one (air 0) is deterministic.
var T = 7.5;
var lastNow = -1, acc = 0;
var airNow = 0, velSm = 0, dragging = false;

function step() {
  if (dragging) {
    var target = Math.min(1, velSm / 1600);
    airNow += (target - airNow) * 0.10;
    velSm *= 0.92;
  } else {
    airNow *= 0.965;
    if (airNow < 0.002) airNow = 0;
    velSm = 0;
  }
  T += TICK;
}

// ---- pointer: drag anywhere to stir the air -------------------------
function toDesign(ev) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cx = (ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0)) - r.left;
  var cy = (ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0)) - r.top;
  return { x: (cx - OX) / S, y: (cy - OY) / S };
}
var lastPX = 0, lastPY = 0, lastPT = -1;
function onDown(ev) {
  dragging = true;
  var p = toDesign(ev);
  lastPX = p.x; lastPY = p.y;
  lastPT = (typeof ev.timeStamp === 'number') ? ev.timeStamp : -1;
  velSm = 0;
  if (ev.preventDefault) ev.preventDefault();
}
function onMove(ev) {
  if (!dragging) return;
  var p = toDesign(ev);
  var dx = p.x - lastPX, dy = p.y - lastPY;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var now = (typeof ev.timeStamp === 'number') ? ev.timeStamp : -1;
  if (lastPT >= 0 && now > lastPT) {
    var inst = dist / ((now - lastPT) / 1000);
    velSm = velSm * 0.6 + inst * 0.4;
  }
  lastPX = p.x; lastPY = p.y; lastPT = now;
  if (ev.preventDefault) ev.preventDefault();
}
function onUp() { dragging = false; }
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('touchcancel', onUp);
}

// ---- sizing ----------------------------------------------------------
// Desktop: cover fit, full-bleed field. Phones take a
// width fit instead (the No.413 precedent): at 390 wide
// a cover crop would lose the woman or the sun whole,
// while the width fit keeps the full composition, the
// sky continuing above the design and the terracotta
// floor band continuing below it, both seamless because
// the design's own grounds run to its edges.
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (phone) {
    S = W / DW;
    OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  } else {
    S = Math.max(W / DW, H / DH);
    OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  if (phone) {
    // the terracotta floor band continues to the foot
    // of the phone frame
    var x0 = -OX / S - 20, x1 = (W - OX) / S + 20;
    var yBot = (H - OY) / S + 20;
    ctx.fillStyle = TERRA;
    ctx.fillRect(x0, DH, x1 - x0, yBot - DH);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
