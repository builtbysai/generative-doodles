<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repertoire</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG, fixed seed: frame one is fully deterministic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1823);

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  // Loop: 120 s. State machine: scroll, dissolve, sort, collapse.
  // Each cycle the sort order changes: 0 = year ascending,
  // 1 = year descending, 2 = decade bands.
  var LOOP = 120;
  var PH = { SCROLL: 48, DISSOLVE: 18, SORT: 30, COLLAPSE: 24 };

  function stateAt(t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    if (lt < PH.SCROLL) return 'scroll';
    if (lt < PH.SCROLL + PH.DISSOLVE) return 'dissolve';
    if (lt < PH.SCROLL + PH.DISSOLVE + PH.SORT) return 'sort';
    return 'collapse';
  }
  function phaseProg(t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    if (lt < PH.SCROLL) return lt / PH.SCROLL;
    if (lt < PH.SCROLL + PH.DISSOLVE) return (lt - PH.SCROLL) / PH.DISSOLVE;
    if (lt < PH.SCROLL + PH.DISSOLVE + PH.SORT) return (lt - PH.SCROLL - PH.DISSOLVE) / PH.SORT;
    return (lt - PH.SCROLL - PH.DISSOLVE - PH.SORT) / PH.COLLAPSE;
  }
  function cycleIndex(t) { return Math.floor(t / LOOP); }

  // Palette: institutional grey, ledger-paper white, one red accent.
  var BG = '#1a1a1c';
  var WALL = '#232326';
  var GREY = '#6f6f74';
  var PAPER = '#f2f0e8';
  var INK = '#3a3a3e';
  var RED = '#c1272d';
  // Point cloud colored by decade: greys deepening toward white,
  // red reserved for the newest decade (2020s).
  var DECADE_COL = ['#7d7d82', '#8d8d88', '#9c9c96', '#ababa4', '#babab2', '#c9c9c0', '#d8d8ce', RED];

  function alpha(v) {
    var a = Math.round(v * 10000) / 10000;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    return a;
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }
  function lerp(a, b, f) { return a + (b - a) * f; }

  // 500 abstract glyph records with year metadata. No names, no
  // readable personal data: each record is a glyph kind plus a year.
  var RECORDS = [];
  for (var i = 0; i < 500; i++) {
    var year = 1952 + Math.floor(rnd() * 73); // 1952..2024
    RECORDS.push({
      i: i,
      year: year,
      decade: Math.min(7, Math.floor((year - 1950) / 10)),
      glyph: Math.floor(rnd() * 6),
      u: rnd(), v: rnd(), w: rnd(),
      // Dissolve stagger runs top row to bottom row, so the ledger
      // empties downward and the cloud fills from above.
      stagger: Math.floor(i / 20) / 24
    });
  }

  // Test hook (harmless in the browser): harness asserts the real
  // count and that the state machine visits all four states.
  try {
    window.__repertoireTest = { records: RECORDS, stateAt: stateAt, LOOP: LOOP };
  } catch (e) {}

  function drawGlyph(kind, x, y, s, col) {
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
    ctx.lineWidth = Math.max(1, s * 0.22);
    if (kind === 0) {
      // Short horizontal bar.
      ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x + s, y); ctx.stroke();
    } else if (kind === 1) {
      // Circle outline.
      ctx.beginPath(); ctx.moveTo(x + s * 0.7, y); ctx.arc(x, y, s * 0.7, 0, Math.PI * 2); ctx.stroke();
    } else if (kind === 2) {
      // Cross.
      ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x + s, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x, y + s); ctx.stroke();
    } else if (kind === 3) {
      // Triangle outline.
      ctx.beginPath();
      ctx.moveTo(x, y - s);
      ctx.lineTo(x + s, y + s * 0.7);
      ctx.lineTo(x - s, y + s * 0.7);
      ctx.closePath(); ctx.stroke();
    } else if (kind === 4) {
      // Small square.
      ctx.strokeRect(x - s * 0.7, y - s * 0.7, s * 1.4, s * 1.4);
    } else {
      // Two parallel dashes.
      ctx.beginPath(); ctx.moveTo(x - s, y - s * 0.45); ctx.lineTo(x + s, y - s * 0.45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - s, y + s * 0.45); ctx.lineTo(x + s, y + s * 0.45); ctx.stroke();
    }
  }

  function drawDot(x, y, r, col, a) {
    ctx.fillStyle = col;
    ctx.globalAlpha = alpha(a);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var W = Math.max(1, Math.floor(vw));
    var H = Math.max(1, Math.floor(vh));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var isPhone = false;
    try {
      var sw = window.screen.width, sh = window.screen.height;
      var mn = Math.min(sw, sh);
      isPhone = mn < 700 || (H > W * 1.15);
    } catch (e) { isPhone = (H > W * 1.15); }

    var lt = ((t % LOOP) + LOOP) % LOOP;
    var state = stateAt(t);
    var prog = phaseProg(t);
    var order = cycleIndex(t) % 3;

    // ---- Layout: centered ledger column of light in a dark room ----
    var colW = isPhone ? W * 0.64 : Math.min(W * 0.30, 340);
    var colX = (W - colW) / 2;
    var colTop = H * (isPhone ? 0.38 : 0.34);
    var colBot = H * 0.94;
    var colH = colBot - colTop;
    var cloudTop = H * 0.10;
    var cloudBot = colTop - H * 0.02;
    var cloudH = Math.max(40, cloudBot - cloudTop);
    var cloudL = W * (isPhone ? 0.14 : 0.20), cloudR = W * (isPhone ? 0.86 : 0.80);
    var cloudW = cloudR - cloudL;

    // ---- Room ----
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    // Wall panels.
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    var panel;
    for (panel = 1; panel < 6; panel++) {
      ctx.beginPath();
      ctx.moveTo(W * panel / 6, 0);
      ctx.lineTo(W * panel / 6, H);
      ctx.stroke();
    }
    // Floor line.
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.moveTo(0, H * 0.94); ctx.lineTo(W, H * 0.94); ctx.stroke();

    // Soft glow behind the ledger column.
    var glow;
    for (glow = 0; glow < 3; glow++) {
      ctx.fillStyle = 'rgba(242,240,232,' + (0.05 - glow * 0.015) + ')';
      ctx.fillRect(colX - 26 - glow * 22, colTop - 14, colW + 52 + glow * 44, colH + 28);
    }

    // ---- Academy flyer: one red accent on the right wall ----
    var flyW = isPhone ? 40 : 56, flyH = flyW * 1.3;
    var flyX = W - flyW - (isPhone ? 14 : 34);
    var flyY = H * 0.13;
    ctx.fillStyle = RED;
    ctx.fillRect(flyX, flyY, flyW, flyH);
    ctx.fillStyle = PAPER;
    ctx.fillRect(flyX + flyW * 0.16, flyY + flyH * 0.14, flyW * 0.68, flyH * 0.10);
    ctx.fillRect(flyX + flyW * 0.16, flyY + flyH * 0.32, flyW * 0.68, flyH * 0.05);
    ctx.fillRect(flyX + flyW * 0.16, flyY + flyH * 0.44, flyW * 0.45, flyH * 0.05);
    ctx.fillRect(flyX + flyW * 0.16, flyY + flyH * 0.56, flyW * 0.68, flyH * 0.05);
    ctx.fillRect(flyX + flyW * 0.16, flyY + flyH * 0.68, flyW * 0.30, flyH * 0.05);

    // ---- Ledger column of light ----
    ctx.fillStyle = PAPER;
    ctx.fillRect(colX, colTop, colW, colH);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(colX, colTop, colW, colH);
    // Header rule in red, ledger label.
    ctx.fillStyle = RED;
    ctx.fillRect(colX, colTop, colW, 3);
    ctx.fillStyle = GREY;
    ctx.font = '600 10px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('M E M B E R S H I P   L E D G E R', colX + 10, colTop + 20);
    ctx.textAlign = 'right';
    ctx.fillText('500', colX + colW - 10, colTop + 20);
    // Row rules, one per grid row.
    ctx.strokeStyle = 'rgba(58,58,62,0.14)';
    ctx.lineWidth = 1;
    var rr;
    for (rr = 1; rr < 25; rr++) {
      var ry = colTop + 28 + rr * ((colH - 28) / 25);
      ctx.beginPath(); ctx.moveTo(colX + 8, ry); ctx.lineTo(colX + colW - 8, ry); ctx.stroke();
    }

    // ---- Records ----
    // The ledger is a grid: 20 columns x 25 rows = all 500 records
    // visible at once, each in its own cell. The grid scrolls upward
    // a couple of rows and wraps, so the column never empties.
    var ledgerTop = colTop + 28;
    var ledgerH = colH - 28;
    var GRID_COLS = 20, GRID_ROWS = 25;
    var cellW = colW / GRID_COLS;
    var cellH = ledgerH / GRID_ROWS;
    // Scroll offset: rises during scroll, holds, eases back in collapse.
    var scrollPx;
    if (state === 'scroll') scrollPx = prog * cellH * 2;
    else if (state === 'collapse') scrollPx = (1 - prog) * cellH * 2;
    else scrollPx = cellH * 2;

    var i, rec;
    for (i = 0; i < RECORDS.length; i++) {
      rec = RECORDS[i];
      // Ledger position: grid cell, scrolling upward, wrapping
      // inside the ruled area.
      var gcol = rec.i % GRID_COLS;
      var grow = Math.floor(rec.i / GRID_COLS);
      var lx = colX + (gcol + 0.5) * cellW + (rec.u - 0.5) * 6;
      // Ledger row: scrolling and wrapping while the ledger is being
      // read, but a stable unwrapped grid while the cloud collapses
      // back, so the refilling ledger does not rotate under the
      // returning records (row 0 would otherwise sit at the bottom).
      var ly;
      if (state === 'collapse') {
        ly = ledgerTop + grow * cellH + (rec.v - 0.5) * 6;
      } else {
        var rawY = grow * cellH + (rec.v - 0.5) * 6 - scrollPx;
        ly = ledgerTop + (((rawY % ledgerH) + ledgerH) % ledgerH);
      }

      // Cloud scatter position (seeded, above the ledger).
      var cx = cloudL + rec.u * cloudW + (rec.w - 0.5) * 14;
      var cy = cloudTop + rec.v * cloudH;

      // Sorted position, by the cycle's sorting order.
      var yn = (rec.year - 1952) / 72;
      var sx, sy;
      if (order === 0) {
        sx = cloudL + yn * cloudW;
        sy = cloudTop + rec.v * cloudH;
      } else if (order === 1) {
        sx = cloudR - yn * cloudW;
        sy = cloudTop + rec.v * cloudH;
      } else {
        // Decade bands: y by decade, x by position inside the decade.
        sy = cloudTop + (rec.decade + 0.5) * (cloudH / 8) + (rec.v - 0.5) * (cloudH / 8) * 0.7;
        sx = cloudL + rec.u * cloudW;
      }
      sx += (rec.w - 0.5) * 10;
      sy += (rec.v - 0.5) * 6;

      var px, py, blend, a = 1;
      if (state === 'scroll') {
        px = lx; py = ly; blend = 0;
        // Fade rows at the column edges while scrolling.
        var edge = Math.min(ly - ledgerTop, (colTop + colH) - ly);
        if (edge < 14) a = alpha(Math.max(0, edge / 14));
      } else if (state === 'dissolve') {
        var df = smooth((prog - rec.stagger * 0.4) / 0.6);
        px = lerp(lx, cx, df); py = lerp(ly, cy, df); blend = df;
      } else if (state === 'sort') {
        var sf = smooth((prog - rec.stagger * 0.4) / 0.6);
        px = lerp(cx, sx, sf); py = lerp(cy, sy, sf); blend = 1;
      } else {
        var cf = smooth((prog - rec.stagger * 0.4) / 0.6);
        px = lerp(sx, lx, cf); py = lerp(sy, ly, cf); blend = 1 - cf;
        var edge2 = Math.min(ly - ledgerTop, (colTop + colH) - ly);
        if (cf > 0.85 && edge2 < 14) a = alpha(Math.max(0, edge2 / 14));
      }

      var col = DECADE_COL[rec.decade];
      if (blend < 0.5) {
        // Glyph in the ledger (or mid-dissolve, still a glyph).
        if (state === 'dissolve' || state === 'collapse') {
          // Travelling glyphs draw outside the column, unclipped.
          ctx.globalAlpha = alpha(a);
          drawGlyph(rec.glyph, px, py, 5 + (1 - blend) * 2, INK);
          ctx.globalAlpha = 1;
        } else {
          ctx.save();
          ctx.beginPath();
          ctx.rect(colX, ledgerTop, colW, ledgerH);
          ctx.clip();
          ctx.globalAlpha = alpha(a);
          drawGlyph(rec.glyph, px, py, 5, INK);
          // Tiny decade dot at the cell's lower right corner.
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.moveTo(px + 6, py + 5);
          ctx.arc(px + 5, py + 5, 1.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          ctx.globalAlpha = 1;
        }
      } else {
        // Point in the cloud, colored by decade.
        var r = 2.2 + rec.w * 1.8;
        drawDot(px, py, r, col, a);
      }
    }

    // State label, small and quiet, under the date at top left,
    // clear of the cloud zone and the ledger column.
    ctx.fillStyle = '#8a8a8e';
    ctx.font = '10px system-ui, sans-serif';
    ctx.textAlign = 'left';
    var label = state === 'scroll' ? 'S C R O L L I N G'
      : state === 'dissolve' ? 'D I S S O L V I N G'
      : state === 'sort' ? (order === 0 ? 'S O R T I N G   ·   Y E A R   ↑' : order === 1 ? 'S O R T I N G   ·   Y E A R   ↓' : 'S O R T I N G   ·   D E C A D E')
      : 'C O L L A P S I N G';
    ctx.fillText(label, 16, 60);

    // ---- Title, date and hint plates, drawn on canvas ----
    ctx.textAlign = 'left';
    ctx.fillStyle = '#d8d8ce';
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillText('REPERTOIRE', 16, 24);
    ctx.fillStyle = '#8a8a8e';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('2007 · 01 · 08', 16, 42);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8a8a8e';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('W A T C H   O N L Y', W / 2, H - 14);
  }

  function sizeAndDraw(t) { draw(t); }

  // One synchronous frame at load: fixed phase t = 57 s, mid-dissolve:
  // the top half of the ledger has emptied into the cloud above while
  // the bottom half still holds its glyph rows.
  sizeAndDraw(57);

  if (reduced) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = 57 + (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }

  function onResize() { draw(57); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
