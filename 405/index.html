<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.405 Pink Water</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F7A8C4; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.405 Pink Water (nina-clausonet).
// After Nina Clausonet's Monet homage: her white-haired
// muse stands in a field of flat pink and purple lily
// pads on dark teal water, hot-pink dress, dark-teal
// umbrella held high, white hair and a teal scarf
// streaming behind her as wind ribbons under a flat
// pink sky. WATCH-ONLY: no interaction at all, a pure
// 45s motion loop. The pads ARE the water (flat teal,
// no reflection); pads bob on per-pad whole-cycle
// sines; the ribbons oscillate on whole cycles that
// divide 45; one white petal crosses on a fixed
// schedule, 9s crossings starting at loop times 2, 11,
// 20, 29, 38 (5 per loop), chaining seamlessly across
// the wrap. Heavy paper grain is fixed speckle dot
// data drawn on the one canvas. Palette is closed at
// the seven specced hexes, each used flat or at flat
// alpha steps. One canvas, no offscreen canvas, no
// gradients, no filters, no shadowBlur. No text.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var SKY = '#F7A8C4', DRESS = '#FF1E7A', TEAL = '#14524F';
var PADPINK = '#F06292', PADPUR = '#B04BC0', WHITE = '#FFFFFF';
var SCARF = '#1FA3A3', SUNPINK = '#F26B8A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 45;
if (LOOP !== 45) throw new Error('Pink Water loop must be 45s');
var TICK = 1 / 60;
var TAU = Math.PI * 2;
var HORIZON = 470;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-looking
// value is baked from this at load and never changes
// between frames or renders.
var seed = 405;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// Clouds: 4 authored flat clouds (ellipse clusters) in
// the sun-disc pink, drifting on the whole 45s cycle.
var CLOUDS = [
  { x: 175, y: 118, s: 1.05, ph: 0.0 },
  { x: 430, y: 66,  s: 0.68, ph: 1.7 },
  { x: 1005, y: 238, s: 0.8,  ph: 3.4 },
  { x: 95,  y: 262, s: 0.6,  ph: 5.1 }
];
if (CLOUDS.length !== 4) throw new Error('Pink Water needs exactly 4 clouds');

// Lily pads: exactly 46. A fixed table baked at load:
// loose scatter over the water, depth-scaled (larger
// near the bottom), each with a centre notch, a 1px
// darker rim (the other pad colour or the water teal),
// and a bob period that divides the loop (45, 15 or
// 9s). Six authored indices carry a tiny flower.
var FLOWER_IDX = [4, 13, 22, 31, 38, 44];
var PADS = [];
(function () {
  var i;
  for (i = 0; i < 46; i++) {
    var depth = rnd();
    var y = 512 + depth * 348 + (rnd() - 0.5) * 26;
    var x = 36 + rnd() * (DW - 72);
    if (Math.abs(x - 640) < 78 && y < 706) x += (x < 640 ? -96 : 96);
    var rx = 30 + depth * 60 + rnd() * 12;
    PADS.push({
      x: x, y: y, rx: rx, ry: rx * 0.42,
      col: i % 2 === 0 ? PADPINK : PADPUR,
      notch: rnd() * TAU,
      bobP: [45, 15, 9][Math.floor(rnd() * 3)],
      bobPh: rnd() * TAU,
      bobAmp: 2 + depth * 3.5,
      flower: FLOWER_IDX.indexOf(i) >= 0
    });
  }
})();
if (PADS.length !== 46) throw new Error('Pink Water needs exactly 46 pads');
var flowerCount = 0, p;
for (p = 0; p < PADS.length; p++) if (PADS[p].flower) flowerCount++;
if (flowerCount !== 6) throw new Error('Pink Water needs exactly 6 pad flowers');
if (LOOP % 15 !== 0 || LOOP % 9 !== 0) throw new Error('pad bob periods must divide the loop');

// The petal: ONE white petal. Crossings last 9s and
// start at loop times 2, 11, 20, 29, 38, so they chain
// back to back and continue across the wrap; the path
// endpoints sit off-frame.
var PETAL_STARTS = [2, 11, 20, 29, 38];
var PETAL_DUR = 9;
if (PETAL_STARTS.length !== 5) throw new Error('Pink Water needs exactly 5 petal crossings per loop');
if (LOOP / PETAL_DUR !== 5) throw new Error('petal crossings must tile the loop');

// Grain: exactly 800 static speckle dots, a fixed table
// drawn in the same order every frame, over everything.
// Palette colours only, at flat alpha steps.
var GRAIN = [];
(function () {
  var i;
  for (i = 0; i < 800; i++) {
    var pick = rnd();
    GRAIN.push({
      x: rnd() * DW,
      y: rnd() * DH,
      r: 0.8 + rnd() * 1.1,
      col: pick < 0.82 ? WHITE : TEAL,
      a: pick < 0.5 ? 0.05 : (pick < 0.82 ? 0.09 : 0.06)
    });
  }
})();
if (GRAIN.length !== 800) throw new Error('Pink Water needs exactly 800 grain dots');

// ---- drawing helpers -----------------------------------
function circ(x, y, r, col, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function ell(x, y, rx, ry, col, rot, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function poly(pts, col, alpha) {
  var i;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function limb(x1, y1, x2, y2, w, col, alpha, bend) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo((x1 + x2) / 2 + (bend || 0), (y1 + y2) / 2, x2, y2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function line(x1, y1, x2, y2, w, col, alpha) {
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function streamer(x1, y1, w, cx, cy, x2, y2, col) {
  // A tapered wind ribbon: full width at the head end,
  // pointed at the streaming end, curved through one
  // oscillating control point.
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x1, y1 - w / 2);
  ctx.quadraticCurveTo(cx, cy - w * 0.3, x2, y2);
  ctx.quadraticCurveTo(cx, cy + w * 0.3, x1, y1 + w / 2);
  ctx.closePath(); ctx.fill();
}

// ---- sky ------------------------------------------------
function drawCloud(c, t) {
  var dx = 13 * Math.sin(TAU * (t / LOOP) + c.ph);
  var dy = 4 * Math.sin(TAU * (t / 15) + c.ph * 2.0);
  var x = c.x + dx, y = c.y + dy, s = c.s;
  ell(x, y, 64 * s, 26 * s, SUNPINK);
  ell(x - 42 * s, y + 7 * s, 40 * s, 19 * s, SUNPINK);
  ell(x + 44 * s, y + 8 * s, 42 * s, 20 * s, SUNPINK);
  ell(x + 4 * s, y - 14 * s, 38 * s, 20 * s, SUNPINK);
}
function drawSky(t) {
  var i;
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, DW, DH);
  // Sun: one flat disc, upper right.
  circ(1082, 138, 60, SUNPINK);
  for (i = 0; i < CLOUDS.length; i++) drawCloud(CLOUDS[i], t);
}

// ---- water and pads --------------------------------------
function drawPad(pd, t) {
  var bob = pd.bobAmp * Math.sin(TAU * (t / pd.bobP) + pd.bobPh);
  var x = pd.x, y = pd.y + bob;
  var rim = pd.col === PADPINK ? PADPUR : TEAL;
  // Body, then a 1px darker rim around it.
  ell(x, y, pd.rx, pd.ry, pd.col);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = rim;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y, pd.rx - 1, pd.ry - 1, 0, 0, TAU); ctx.stroke();
  // Centre notch: a wedge of water cut from the middle
  // to one edge, the classic lily-pad bite.
  var nx = Math.cos(pd.notch), ny = Math.sin(pd.notch);
  var spread = 0.42;
  var a1 = pd.notch - spread, a2 = pd.notch + spread;
  poly([
    [x, y],
    [x + Math.cos(a1) * (pd.rx + 2), y + Math.sin(a1) * (pd.ry + 2)],
    [x + Math.cos(a2) * (pd.rx + 2), y + Math.sin(a2) * (pd.ry + 2)]
  ], TEAL);
  // A short vein from the centre, opposite the notch.
  line(x, y, x - nx * pd.rx * 0.55, y - ny * pd.ry * 0.55, 2, rim, 0.65);
  if (pd.flower) {
    var fc = pd.col === PADPINK ? WHITE : SUNPINK;
    var k;
    for (k = 0; k < 5; k++) {
      var fa = (k / 5) * TAU + pd.notch;
      circ(x + Math.cos(fa) * 7, y + Math.sin(fa) * 4.5, 4.6, fc);
    }
    circ(x, y, 3.2, pd.col === PADPINK ? SUNPINK : WHITE);
  }
}
function drawWaterBack(t) {
  var i;
  ctx.fillStyle = TEAL;
  ctx.fillRect(0, HORIZON, DW, DH - HORIZON);
  for (i = 0; i < PADS.length; i++) if (PADS[i].y < 660) drawPad(PADS[i], t);
}
function drawWaterFront(t) {
  var i;
  for (i = 0; i < PADS.length; i++) if (PADS[i].y >= 660) drawPad(PADS[i], t);
}

// ---- the muse --------------------------------------------
// Local layout: she stands centre, waterline at her hem.
function drawMuse(t) {
  // Hair ribbons: three tapered white streamers flowing
  // left off the head, control points oscillating on
  // whole cycles that divide the loop (15s, 9s, 45s).
  var h1 = 19 * Math.sin(TAU * (t / 15) + 0.6);
  var h2 = 15 * Math.sin(TAU * (t / 9) + 2.2);
  var h3 = 12 * Math.sin(TAU * (t / LOOP) + 4.0);
  streamer(604, 350, 31, 466, 312 + h1, 306, 356 + h1 * 0.5, WHITE);
  streamer(598, 394, 25, 450, 404 + h2, 284, 384 + h2 * 0.5, WHITE);
  streamer(608, 428, 18, 484, 414 + h3, 342, 448 + h3 * 0.5, WHITE);
  // Scarf ribbon: teal, streaming left off the neck.
  var s1 = 14 * Math.sin(TAU * (t / 9) + 1.1);
  streamer(616, 452, 16, 508, 474 + s1, 396, 450 + s1 * 0.5, SCARF);
  // Back hair mass behind head and shoulders.
  ell(640, 408, 96, 118, WHITE);
  ell(596, 470, 44, 74, WHITE);
  ell(686, 466, 40, 66, WHITE);
  // Far arm, down at her side.
  limb(606, 470, 578, 566, 19, SKY, 1, -6);
  circ(606, 466, 17, DRESS);
  // Dress: one flat silhouette, three panels by seams.
  poly([[604, 452], [676, 452], [694, 648], [586, 648]], DRESS);
  line(622, 470, 614, 644, 3, PADPINK, 0.8);
  line(658, 470, 666, 644, 3, PADPINK, 0.8);
  ell(640, 452, 38, 12, DRESS);
  // Short legs below the hem, standing in the water.
  limb(620, 646, 618, 682, 16, SKY, 1, 0);
  limb(660, 646, 662, 682, 16, SKY, 1, 0);
  // Upper shaft, drawn before the head so the face
  // covers the middle stretch of it.
  line(640, 296, 640, 356, 6, TEAL);
  // Head: pink face, white hair over the crown.
  circ(640, 388, 47, SKY);
  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.arc(640, 388, 49, Math.PI * 0.98, Math.PI * 2.02);
  ctx.quadraticCurveTo(664, 356, 640, 368);
  ctx.quadraticCurveTo(616, 356, 591, 388);
  ctx.closePath(); ctx.fill();
  ell(596, 402, 13, 34, WHITE);
  ell(684, 402, 13, 34, WHITE);
  // Serene closed eyes and a small mouth, in teal.
  ctx.strokeStyle = TEAL;
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(622, 392, 8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  ctx.beginPath(); ctx.arc(658, 392, 8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  ctx.beginPath(); ctx.arc(640, 408, 6, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
  // Scarf band at the neck.
  ell(640, 446, 34, 11, SCARF);
  // Lower shaft and handle hook, in front of the chest.
  line(640, 432, 640, 454, 6, TEAL);
  ctx.strokeStyle = TEAL;
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(628, 454, 12, 0, Math.PI); ctx.stroke();
  // Near arm raised to grip the shaft at chest height.
  limb(672, 468, 650, 450, 19, SKY, 1, 4);
  circ(674, 464, 17, DRESS);
  circ(647, 447, 10, SKY);
  // Canopy and finial, held high in the upper third.
  line(640, 112, 640, 86, 5, TEAL);
  ctx.fillStyle = TEAL;
  ctx.beginPath();
  ctx.moveTo(446, 300);
  ctx.arc(640, 300, 194, Math.PI, 0);
  ctx.closePath(); ctx.fill();
  var sc;
  for (sc = 0; sc < 7; sc++) {
    var sx = 446 + 27.7 + sc * 55.4;
    ctx.beginPath(); ctx.arc(sx, 300, 27.7, 0, Math.PI); ctx.fill();
  }
  circ(640, 80, 7, TEAL);
}

// ---- the petal --------------------------------------------
function drawPetal(t) {
  var lt = ((t % LOOP) + LOOP) % LOOP;
  var u = (((lt - PETAL_STARTS[0]) % PETAL_DUR) + PETAL_DUR) % PETAL_DUR;
  var pr = u / PETAL_DUR;
  var x = (DW + 80) - pr * (DW + 160);
  var y = 330 - 92 * Math.sin(Math.PI * pr) + 10 * Math.sin(TAU * 3 * pr);
  var rot = TAU * 2 * pr + 0.7;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.moveTo(-17, 0);
  ctx.quadraticCurveTo(-6, -10, 17, 0);
  ctx.quadraticCurveTo(-6, 10, -17, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---- grain --------------------------------------------------
function drawGrain() {
  var i;
  for (i = 0; i < GRAIN.length; i++) {
    var g = GRAIN[i];
    circ(g.x, g.y, g.r, g.col, g.a);
  }
}

function draw(t) {
  drawSky(t);
  drawWaterBack(t);
  drawMuse(t);
  drawWaterFront(t);
  drawPetal(t);
  drawGrain();
}

// ---- clock and frame -----------------------------------
// Determinism: frame one is drawn synchronously at the
// constant phase T0 (field complete, ribbons mid-stream,
// the third petal crossing under way), and the animation
// clock advances from that anchor in fixed 1/60 ticks
// accumulated from rAF timestamps. Frame one never reads
// a wall clock.
var T0 = 23.5;
var T = T0;
var lastNow = -1, acc = 0;
function step() { /* watch-only: state lives in the clock */ }

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Cover-fit: the field fills the viewport on every
  // screen, phones included; the page ground takes the
  // sky pink.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
