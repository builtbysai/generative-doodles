<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9038 · Slat Light</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e9e2d0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; cursor: pointer; }
  .cap {
    position: fixed; left: 18px; bottom: 14px; pointer-events: none;
    color: #6b6250; font: italic 12.5px/1.5 Georgia, serif; opacity: 0.85;
  }
  .cap b { color: #3d382c; font-weight: normal; font-style: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><b>№9038 · Slat Light</b>, low sun through a fence, click for another evening</div>
<script>
'use strict';
/*
  Slat Light: the sun is offstage. All we see is what it does:
  long soft shadows raking across paper, deepening where they overlap,
  and one warm band where a slat is missing.
*/

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '424242', 10) || 424242;
let rand = mulberry32(seed);

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const U = 1000; // virtual units, viewport-invariant like №9021

function fit() {
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const s = Math.min(window.innerWidth, window.innerHeight) * 0.94;
  cv.width = s * DPR; cv.height = s * DPR;
  cv.style.width = s + 'px'; cv.style.height = s + 'px';
  ctx.setTransform(cv.width / U, 0, 0, cv.width / U, 0, 0);
}
window.addEventListener('resize', () => { fit(); draw(); });

// value noise for hand wobble
function makeNoise(r) {
  const p = new Array(256);
  for (let i = 0; i < 256; i++) p[i] = r();
  return function (x) {
    const xi = Math.floor(x), xf = x - xi;
    const a = p[xi & 255], b = p[(xi + 1) & 255];
    const u = xf * xf * (3 - 2 * xf);
    return a + (b - a) * u;
  };
}

function draw() {
  rand = mulberry32(seed);
  const noise = makeNoise(rand);
  const R = (a, b) => a + rand() * (b - a);

  // ---- paper ----
  const paper = ctx.createLinearGradient(0, 0, U, U);
  paper.addColorStop(0, '#f3eee1');
  paper.addColorStop(0.6, '#efe8d6');
  paper.addColorStop(1, '#e9e1cc');
  ctx.fillStyle = paper;
  ctx.fillRect(0, 0, U, U);

  // print area with margins
  const MX = 90, MY = 90, PW = U - 2 * MX, PH = U - 2 * MY;

  ctx.save();
  ctx.beginPath(); ctx.rect(MX, MY, PW, PH); ctx.clip();

  // ---- sun geometry ----
  const nSlats = 7 + Math.floor(rand() * 5);   // 7..11 slats
  const gapIdx = Math.floor(nSlats * 0.2 + rand() * nSlats * 0.6); // gap in the middle 60%
  const sunDx = R(0.4, 0.75);                      // shadow run per unit drop (low sun)
  const slatW = PW / nSlats;
  const bandW = slatW * R(0.66, 0.85);
  const yA = MY - 40, yB = MY + PH + 40;
  const shift = sunDx * (yB - yA);
  const xOff = -shift * 0.5; // center the shadow field so no side goes empty
  const bandLen = Math.hypot(shift, yB - yA);
  const bandAng = Math.atan2(shift, yB - yA);  // rotation from vertical

  // soft shadow bands, multiply so overlaps deepen.
  // each band is drawn in its own rotated frame so the soft gradient
  // stays perpendicular to the band direction
  ctx.globalCompositeOperation = 'multiply';
  for (let i = 0; i < nSlats; i++) {
    if (i === gapIdx) continue;
    const xTop = MX + xOff + i * slatW + slatW * 0.5;
    const ink = R(0.10, 0.17);
    ctx.save();
    ctx.translate(xTop + shift / 2, (yA + yB) / 2);
    ctx.rotate(bandAng);
    const g = ctx.createLinearGradient(-bandW / 2, 0, bandW / 2, 0);
    const ic = 'rgba(58,52,44,';
    g.addColorStop(0, ic + '0)');
    g.addColorStop(0.24, ic + ink.toFixed(3) + ')');
    g.addColorStop(0.76, ic + ink.toFixed(3) + ')');
    g.addColorStop(1, ic + '0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    const segs = 26;
    for (let s2 = 0; s2 <= segs; s2++) {
      const y = -bandLen / 2 + bandLen * s2 / segs;
      const x = -bandW / 2 + (noise(i * 13.7 + s2 * 0.35) - 0.5) * 26;
      s2 ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    for (let s2 = segs; s2 >= 0; s2--) {
      const y = -bandLen / 2 + bandLen * s2 / segs;
      ctx.lineTo(bandW / 2 + (noise(i * 13.7 + s2 * 0.35 + 50) - 0.5) * 26, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';

  // ---- the one warm band: where the slat is missing ----
  {
    const xTop = MX + xOff + gapIdx * slatW + slatW * 0.5;
    const lw = bandW * 1.15;
    const paintBand = (w, stops) => {
      ctx.save();
      ctx.translate(xTop + shift / 2, (yA + yB) / 2);
      ctx.rotate(bandAng);
      const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      for (const st of stops) g.addColorStop(st[0], st[1]);
      ctx.fillStyle = g;
      ctx.fillRect(-w / 2, -bandLen / 2, w, bandLen);
      ctx.restore();
    };
    paintBand(lw, [
      [0, 'rgba(214,150,70,0)'], [0.35, 'rgba(214,150,70,0.34)'],
      [0.5, 'rgba(226,170,90,0.42)'], [0.65, 'rgba(214,150,70,0.34)'],
      [1, 'rgba(214,150,70,0)']
    ]);
    paintBand(lw * 0.28, [
      [0, 'rgba(240,200,130,0)'], [0.5, 'rgba(240,200,130,0.5)'],
      [1, 'rgba(240,200,130,0)']
    ]);
  }

  ctx.restore();

  // ---- wobbly plate frame ----
  ctx.strokeStyle = 'rgba(70,62,50,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const fr = 64, fw = 40;
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (U - 2 * fr) * t + (noise(t * 9.1) - 0.5) * 5;
    const y = fr + (noise(t * 7.3 + 40) - 0.5) * 5;
    s2 ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr + (noise(t * 8.2 + 80) - 0.5) * 5;
    const y = fr + (U - 2 * fr) * t + (noise(t * 6.1 + 120) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr - (U - 2 * fr) * t + (noise(t * 7.7 + 160) - 0.5) * 5;
    const y = U - fr + (noise(t * 9.4 + 200) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (noise(t * 6.6 + 240) - 0.5) * 5;
    const y = U - fr - (U - 2 * fr) * t + (noise(t * 8.8 + 280) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  // ---- grain ----
  const gr = mulberry32(seed + 5);
  ctx.fillStyle = 'rgba(60,52,40,1)';
  for (let i = 0; i < 5200; i++) {
    ctx.globalAlpha = 0.025 + gr() * 0.06;
    const r = 0.6 + gr() * 1.6;
    ctx.beginPath();
    ctx.arc(gr() * U, gr() * U, r, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- vignette ----
  const v = ctx.createRadialGradient(U / 2, U / 2, U * 0.32, U / 2, U / 2, U * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(40,30,18,0.16)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, U, U);
}

cv.addEventListener('click', () => {
  const s = 1000 + Math.floor(Math.random() * 900000);
  location.search = '?seed=' + s;
});

fit();
draw();
</script>
</body>
</html>
