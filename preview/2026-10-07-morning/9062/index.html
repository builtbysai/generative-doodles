<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9062 — The Enthronement</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14100b; }
  #stage { position: fixed; inset: 0; display: block; touch-action: manipulation; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    text-align: center; color: rgba(216, 190, 150, 0.32);
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.24em; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">CLICK TO RESEED</div>
<script>
'use strict';
/* The Enthronement
   FUTURE_PIECES.md seed 482, from the Villa Lenbach / Villa Stuck
   Gesamtkunstwerk study: the shrine grammar. One focal object — a flame
   enthroned in a brazier — inside a deep architectural niche; flanking
   pilasters; a load-bearing patterned border (procedural Greek key);
   star-motif floor tiles; margins and ground rhyming with the focal
   palette. Warm marble/bronze/ink register: the period villa was dark,
   never pale. Study-informed, never copied.
   NOTE: piece number to be assigned by the coordinator (see process.md). */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const PALS = [
  { ink:'#0e0a06', wood:'#25150c', wood2:'#2e1b0f', bronze:'#8a6234', bronzeD:'#5c3f1e',
    gold:'#c9a24b', goldHi:'#e8c876', marble:'#c2a184', red:'#7d2a16', glow:'#ff9a2e' },
  { ink:'#0d0805', wood:'#201109', wood2:'#2a150b', bronze:'#7c5228', bronzeD:'#4e3418',
    gold:'#bd8f3a', goldHi:'#e0b968', marble:'#b28f6e', red:'#8a2f14', glow:'#ff8f24' },
  { ink:'#0f0b07', wood:'#271711', wood2:'#33200f', bronze:'#96703c', bronzeD:'#66491f',
    gold:'#d4ac55', goldHi:'#f0d083', marble:'#cbb08e', red:'#74301a', glow:'#ffa63a' }
];

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---- patterned border cells ---- */
function meanderCell(ctx, u, b, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'square'; ctx.lineJoin = 'miter';
  ctx.beginPath();
  ctx.moveTo(u * 0.08, b * 0.90);
  ctx.lineTo(u * 0.08, b * 0.10);
  ctx.lineTo(u * 0.92, b * 0.10);
  ctx.lineTo(u * 0.92, b * 0.90);
  ctx.lineTo(u * 0.30, b * 0.90);
  ctx.lineTo(u * 0.30, b * 0.40);
  ctx.lineTo(u * 0.68, b * 0.40);
  ctx.lineTo(u * 0.68, b * 0.64);
  ctx.lineTo(u * 0.48, b * 0.64);
  ctx.stroke();
}
function diamondCell(ctx, u, b, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(u * 0.5, b * 0.12); ctx.lineTo(u * 0.88, b * 0.5);
  ctx.lineTo(u * 0.5, b * 0.88); ctx.lineTo(u * 0.12, b * 0.5);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(u * 0.5, b * 0.5, lw * 0.9, 0, Math.PI * 2); ctx.fill();
}
function borderBand(ctx, x0, y0, x1, y1, b, motif, pal) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, y0, x1 - x0, y1 - y0);
  ctx.rect(x0 + b, y0 + b, x1 - x0 - 2 * b, y1 - y0 - 2 * b);
  ctx.fillStyle = '#17100a';
  ctx.fill('evenodd');
  const cell = motif === 'diamond' ? diamondCell : meanderCell;
  const col = pal.bronze, lw = Math.max(2.5, b * 0.10);
  const u = b * 1.02;
  function run(len) {
    const n = Math.max(1, Math.floor(len / u));
    const uu = len / n;
    for (let i = 0; i < n; i++) {
      ctx.save(); ctx.translate(i * uu, 0); ctx.scale(uu / u, 1);
      cell(ctx, u, b, col, lw);
      ctx.restore();
    }
  }
  ctx.save(); ctx.translate(x0 + b, y0); run(x1 - x0 - 2 * b); ctx.restore();
  ctx.save(); ctx.translate(x1 - b, y0 + b); ctx.rotate(Math.PI / 2); run(y1 - y0 - 2 * b); ctx.restore();
  ctx.save(); ctx.translate(x1 - b, y1 - b); ctx.rotate(Math.PI); run(x1 - x0 - 2 * b); ctx.restore();
  ctx.save(); ctx.translate(x0 + b, y1 - b); ctx.rotate(-Math.PI / 2); run(y1 - y0 - 2 * b); ctx.restore();
  ctx.restore();
}

function star8(ctx, cx, cy, r, col, fill) {
  ctx.save(); ctx.translate(cx, cy);
  for (let k = 0; k < 2; k++) {
    ctx.save(); ctx.rotate(k * Math.PI / 4);
    if (fill) { ctx.fillStyle = col; ctx.fillRect(-r, -r, 2 * r, 2 * r); }
    else { ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, r * 0.16); ctx.strokeRect(-r, -r, 2 * r, 2 * r); }
    ctx.restore();
  }
  ctx.restore();
}

function flame(ctx, cx, baseY, h, w, phase, t, slim) {
  const sway = Math.sin(t * 2.4 + phase) * w * 0.06;
  const hh = h * (1 + 0.045 * Math.sin(t * 5.7 + phase * 2));
  const layers = [
    [1.00, 'rgba(74,26,5,0.88)', 1.0],
    [0.76, 'rgba(158,70,14,0.92)', 0.97],
    [0.52, 'rgba(228,132,34,0.96)', 0.94],
    [0.30, 'rgba(255,196,92,1.0)', 0.90]
  ];
  for (const [s, col, hs] of layers) {
    const ww = w * s * slim, h2 = hh * s * hs;
    const sx = sway * s;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(cx - ww / 2, baseY);
    ctx.bezierCurveTo(cx - ww / 2, baseY - h2 * 0.52, cx - ww * 0.34 + sx, baseY - h2 * 0.80, cx + sx * 1.25, baseY - h2);
    ctx.bezierCurveTo(cx + ww * 0.34 + sx, baseY - h2 * 0.80, cx + ww / 2, baseY - h2 * 0.52, cx + ww / 2, baseY);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,238,190,0.95)';
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.10, baseY);
  ctx.bezierCurveTo(cx - w * 0.10, baseY - hh * 0.30, cx - w * 0.05 + sway, baseY - hh * 0.42, cx + sway * 0.8, baseY - hh * 0.48);
  ctx.bezierCurveTo(cx + w * 0.05 + sway, baseY - hh * 0.42, cx + w * 0.10, baseY - hh * 0.30, cx + w * 0.10, baseY);
  ctx.closePath(); ctx.fill();
}

function glyph(ctx, x, y, w, h, rng, col) {
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, w * 0.09); ctx.lineCap = 'round';
  const n = 2 + Math.floor(rng() * 3);
  for (let i = 0; i < n; i++) {
    const k = Math.floor(rng() * 5);
    ctx.beginPath();
    if (k === 0) { const gxx = x + w * rng(); ctx.moveTo(gxx, y); ctx.lineTo(gxx, y + h); }
    else if (k === 1) { const gy = y + h * rng(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); }
    else if (k === 2) { ctx.arc(x + w / 2, y + h / 2, w * 0.28, 0, Math.PI * 2); }
    else if (k === 3) { ctx.moveTo(x, y + h); ctx.lineTo(x + w / 2, y); ctx.lineTo(x + w, y + h); }
    else { ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); }
    ctx.stroke();
  }
}

function drawState(ctx, S, t) {
  const pal = S.pal;
  const CW = 1000, CH = 1250;
  const cw = ctx.canvas.width / S.dpr, ch = ctx.canvas.height / S.dpr;
  ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  ctx.fillStyle = pal.ink; ctx.fillRect(0, 0, cw, ch);
  const sc = Math.min(cw / CW, ch / CH);
  ctx.translate(cw / 2, ch / 2); ctx.scale(sc, sc); ctx.translate(-CW / 2, -CH / 2);

  /* ===== load-bearing frame ===== */
  ctx.strokeStyle = pal.gold; ctx.lineWidth = 2.5;
  ctx.strokeRect(14, 14, CW - 28, CH - 28);
  borderBand(ctx, 22, 22, CW - 22, CH - 22, 46, S.borderMotif, pal);
  ctx.strokeStyle = pal.gold; ctx.lineWidth = 2;
  ctx.strokeRect(76, 76, CW - 152, CH - 152);
  const corners = [[45, 45], [CW - 45, 45], [45, CH - 45], [CW - 45, CH - 45]];
  for (const [ccx, ccy] of corners) {
    ctx.save(); ctx.translate(ccx, ccy); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = pal.gold; ctx.fillRect(-11, -11, 22, 22);
    ctx.fillStyle = pal.ink; ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }

  /* ===== dark wood panel ground ===== */
  const px0 = 84, py0 = 84, px1 = CW - 84, py1 = CH - 84;
  const wg = ctx.createLinearGradient(px0, 0, px1, 0);
  wg.addColorStop(0, pal.wood2); wg.addColorStop(0.5, pal.wood); wg.addColorStop(1, pal.wood2);
  ctx.fillStyle = wg; ctx.fillRect(px0, py0, px1 - px0, py1 - py0);
  ctx.save();
  ctx.beginPath(); ctx.rect(px0, py0, px1 - px0, py1 - py0); ctx.clip();
  const grng = mulberry32(S.seed ^ 0x5f3a);
  ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = 2;
  for (let i = 0; i < 90; i++) {
    const gx = px0 + grng() * (px1 - px0);
    ctx.beginPath(); ctx.moveTo(gx, py0);
    ctx.bezierCurveTo(gx + (grng() - 0.5) * 40, py0 + 300, gx + (grng() - 0.5) * 40, py0 + 700, gx + (grng() - 0.5) * 20, py1);
    ctx.stroke();
  }
  ctx.restore();

  /* ===== flanking secondary verticals ===== */
  ctx.strokeStyle = pal.gold; ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(132, 130); ctx.lineTo(132, CH - 130);
  ctx.moveTo(CW - 132, 130); ctx.lineTo(CW - 132, CH - 130); ctx.stroke();
  ctx.globalAlpha = 1;

  /* ===== entablature: inscription tablet + roundels ===== */
  ctx.fillStyle = '#1c1109';
  rr(ctx, 290, 118, 420, 84, 6); ctx.fill();
  ctx.strokeStyle = pal.bronze; ctx.lineWidth = 3;
  rr(ctx, 290, 118, 420, 84, 6); ctx.stroke();
  const irng = mulberry32(S.seed ^ 0x77aa);
  for (let i = 0; i < 13; i++) glyph(ctx, 312 + i * 30, 140, 18, 40, irng, 'rgba(201,162,75,0.9)');
  for (const rx of [196, 804]) {
    ctx.fillStyle = pal.bronzeD;
    ctx.beginPath(); ctx.arc(rx, 160, 34, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = pal.gold; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(rx, 160, 34, 0, Math.PI * 2); ctx.stroke();
    star8(ctx, rx, 160, 13, pal.gold, true);
  }

  /* ===== flanking pilasters ===== */
  for (const pxx of [168, 752]) {
    const pyy = 258, pw = 80, ph = 742;
    const pg = ctx.createLinearGradient(pxx, 0, pxx + pw, 0);
    pg.addColorStop(0, pal.bronzeD); pg.addColorStop(0.35, pal.bronze);
    pg.addColorStop(0.65, pal.bronze); pg.addColorStop(1, pal.bronzeD);
    ctx.fillStyle = pg; ctx.fillRect(pxx, pyy, pw, ph);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 3;
    for (let f = 1; f < 5; f++) {
      const fx = pxx + pw * f / 5;
      ctx.beginPath(); ctx.moveTo(fx, pyy + 26); ctx.lineTo(fx, pyy + ph - 26); ctx.stroke();
    }
    ctx.strokeStyle = pal.goldHi; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(pxx + 2, pyy); ctx.lineTo(pxx + 2, pyy + ph); ctx.stroke();
    ctx.fillStyle = pal.bronzeD; ctx.fillRect(pxx - 12, pyy - 46, pw + 24, 30);
    ctx.fillStyle = pal.gold; ctx.fillRect(pxx - 16, pyy - 58, pw + 32, 14);
    ctx.fillStyle = pal.bronzeD; ctx.fillRect(pxx - 12, pyy + ph + 16, pw + 24, 30);
    ctx.fillStyle = pal.gold; ctx.fillRect(pxx - 16, pyy + ph + 44, pw + 32, 12);
  }

  /* ===== central niche: deep arch ===== */
  const nx0 = 292, nx1 = 708, nyBot = 986;
  const ncx = (nx0 + nx1) / 2, nr = (nx1 - nx0) / 2;
  const springY = S.arch === 'round' ? 620 : 560;
  function nichePath(inset) {
    const a0 = nx0 + inset, a1 = nx1 - inset, rad = nr - inset;
    ctx.beginPath();
    ctx.moveTo(a0, nyBot);
    ctx.lineTo(a0, springY);
    if (S.arch === 'round') ctx.arc(ncx, springY, rad, Math.PI, 0);
    else ctx.quadraticCurveTo(ncx, springY - rad * 1.35, a1, springY);
    ctx.lineTo(a1, nyBot);
    ctx.closePath();
  }
  nichePath(0);
  const ng = ctx.createRadialGradient(ncx, 660, 40, ncx, 660, 430);
  ng.addColorStop(0, '#2e1c0e'); ng.addColorStop(0.5, '#150c05'); ng.addColorStop(1, '#080402');
  ctx.fillStyle = ng; ctx.fill();
  ctx.save();
  nichePath(0); ctx.clip();
  ctx.lineWidth = 34; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  nichePath(17); ctx.stroke();
  ctx.restore();
  const glowR = 205 + 12 * Math.sin(t * 1.7 + S.phase);
  const hg = ctx.createRadialGradient(ncx, 600, 10, ncx, 600, glowR);
  hg.addColorStop(0, 'rgba(255,150,40,0.36)'); hg.addColorStop(1, 'rgba(255,150,40,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(ncx, 600, glowR, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  nichePath(0); ctx.clip();
  ctx.lineWidth = 22; ctx.strokeStyle = pal.bronze;
  nichePath(11); ctx.stroke();
  ctx.lineWidth = 5; ctx.strokeStyle = pal.goldHi;
  nichePath(24); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = pal.gold;
  ctx.save();
  ctx.translate(ncx, springY - nr + 8);
  ctx.beginPath();
  ctx.moveTo(-22, 0); ctx.lineTo(22, 0); ctx.lineTo(13, -36); ctx.lineTo(-13, -36);
  ctx.closePath(); ctx.fill(); ctx.restore();

  if (S.halo === 'rays') {
    ctx.strokeStyle = 'rgba(232,200,118,0.5)'; ctx.lineWidth = 3;
    const rays = 20;
    for (let i = 0; i < rays; i++) {
      const a = Math.PI * 1.06 + (i / (rays - 1)) * Math.PI * 0.88;
      const r1 = 165, r2 = 165 + 52 + 14 * Math.sin(t * 1.3 + i * 1.7);
      ctx.beginPath();
      ctx.moveTo(ncx + Math.cos(a) * r1, 620 + Math.sin(a) * r1);
      ctx.lineTo(ncx + Math.cos(a) * r2, 620 + Math.sin(a) * r2);
      ctx.stroke();
    }
  } else {
    ctx.strokeStyle = 'rgba(232,200,118,0.5)'; ctx.lineWidth = 3;
    for (let k = 1; k <= 3; k++) {
      ctx.beginPath();
      ctx.arc(ncx, springY, nr - k * 36, Math.PI * 1.06, Math.PI * 1.94);
      ctx.stroke();
    }
  }

  for (const sx of [nx0 - 60, nx1 + 60]) {
    ctx.save(); ctx.translate(sx, 420); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = pal.bronze; ctx.fillRect(-16, -16, 32, 32);
    ctx.fillStyle = pal.red; ctx.fillRect(-9, -9, 18, 18);
    ctx.restore();
  }

  /* ===== pedestal ===== */
  ctx.fillStyle = pal.bronzeD; ctx.fillRect(408, 936, 184, 34);
  ctx.fillStyle = pal.bronze; ctx.fillRect(430, 806, 140, 132);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 3;
  ctx.strokeRect(442, 820, 116, 104);
  ctx.fillStyle = pal.marble; ctx.fillRect(416, 772, 168, 36);
  ctx.strokeStyle = pal.gold; ctx.lineWidth = 2;
  ctx.strokeRect(416, 772, 168, 36);

  /* ===== THE FOCAL OBJECT: one flame enthroned in one brazier ===== */
  const foy = 772, bw = 320 * S.bowlW;
  ctx.fillStyle = pal.bronzeD; ctx.fillRect(ncx - 24, foy - 148, 48, 148);
  ctx.fillStyle = pal.bronze; ctx.fillRect(ncx - 24, foy - 148, 14, 148);
  ctx.fillStyle = pal.gold; ctx.fillRect(ncx - 42, foy - 158, 84, 14);
  ctx.fillStyle = pal.bronzeD;
  ctx.beginPath();
  ctx.moveTo(ncx - 58, foy); ctx.lineTo(ncx + 58, foy);
  ctx.lineTo(ncx + 34, foy - 26); ctx.lineTo(ncx - 34, foy - 26);
  ctx.closePath(); ctx.fill();
  const bowlY = foy - 158, bowlH = 96, bowlR = bw / 2;
  ctx.fillStyle = pal.bronzeD;
  ctx.beginPath(); ctx.ellipse(ncx, bowlY - bowlH, bowlR, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(ncx - bowlR, bowlY - bowlH);
  ctx.quadraticCurveTo(ncx, bowlY + 26, ncx + bowlR, bowlY - bowlH);
  ctx.closePath();
  const bg2 = ctx.createLinearGradient(ncx - bowlR, 0, ncx + bowlR, 0);
  bg2.addColorStop(0, pal.bronzeD); bg2.addColorStop(0.5, pal.bronze); bg2.addColorStop(1, pal.bronzeD);
  ctx.fillStyle = bg2; ctx.fill();
  ctx.strokeStyle = pal.goldHi; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(ncx - bowlR, bowlY - bowlH);
  ctx.quadraticCurveTo(ncx, bowlY + 26, ncx + bowlR, bowlY - bowlH);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,110,26,0.92)';
  ctx.beginPath(); ctx.ellipse(ncx, bowlY - bowlH, bowlR * 0.78, 17, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,190,90,0.9)';
  ctx.beginPath(); ctx.ellipse(ncx, bowlY - bowlH, bowlR * 0.42, 10, 0, 0, Math.PI * 2); ctx.fill();
  flame(ctx, ncx, bowlY - bowlH - 6, 300 * S.flameH, 200 * S.flameW, S.phase, t, S.slim);

  /* ===== floor strip: star-motif tile ===== */
  const fy0 = 1000, fy1 = 1140, ts = 70;
  ctx.fillStyle = '#120b06'; ctx.fillRect(px0, fy0, px1 - px0, fy1 - fy0);
  for (let ty = fy0, row = 0; ty < fy1; ty += ts, row++) {
    for (let tx = px0; tx < px1; tx += ts) {
      const ci = Math.floor((tx - px0) / ts) + row;
      ctx.fillStyle = ci % 2 === 0 ? '#1f130a' : '#2c1c0e';
      ctx.fillRect(tx + 1, ty + 1, ts - 2, ts - 2);
      if (ci % 3 === 0) {
        star8(ctx, tx + ts / 2, ty + ts / 2, 15, pal.gold, false);
        ctx.fillStyle = pal.red;
        ctx.beginPath(); ctx.arc(tx + ts / 2, ty + ts / 2, 4, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  ctx.strokeStyle = pal.gold; ctx.lineWidth = 2;
  ctx.strokeRect(px0, fy0, px1 - px0, fy1 - fy0);
  ctx.fillStyle = pal.bronzeD; ctx.fillRect(420, fy1, 160, 26);
  ctx.strokeStyle = pal.gold; ctx.lineWidth = 2; ctx.strokeRect(420, fy1, 160, 26);
}

var DEFAULT_SEED = 20261007; /* chosen by eye: meander border, pointed arch, ray halo */

function boot() {
  const canvas = document.getElementById('stage');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  function sizeCanvas() {
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  const q = new URLSearchParams(location.search);
  let seed = parseInt(q.get('seed') || '', 10);
  if (!Number.isFinite(seed)) seed = DEFAULT_SEED;

  const S = { dpr: dpr, seed: seed };
  function build(s) {
    S.seed = s;
    const rng = mulberry32(s);
    S.pal = PALS[Math.floor(rng() * PALS.length)];
    S.arch = rng() < 0.55 ? 'round' : 'pointed';
    S.borderMotif = rng() < 0.7 ? 'meander' : 'diamond';
    S.halo = rng() < 0.6 ? 'rays' : 'arches';
    S.flameH = 0.68 + rng() * 0.22;   /* tip stays clear of the tablet */
    S.flameW = 0.85 + rng() * 0.3;
    S.bowlW = 0.9 + rng() * 0.25;
    S.slim = 0.8 + rng() * 0.25;
    S.phase = rng() * Math.PI * 2;
  }
  build(seed);

  const ctx = canvas.getContext('2d');
  const start = performance.now();
  (function frame(now) {
    drawState(ctx, S, (now - start) / 1000);
    requestAnimationFrame(frame);
  })(start);

  window.addEventListener('click', () => {
    const ns = (Math.random() * 1e9) | 0;
    history.replaceState(null, '', '?seed=' + ns);
    build(ns);
  });
  document.title = '№9062 — The Enthronement — seed ' + S.seed;
}
boot();
</script>
</body>
</html>
