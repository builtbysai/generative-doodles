<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>One-Tenth Second, No. 9059</title>
<style>
  :root{
    --paper:#f1e7d0; --ink:#2a2419; --ink-soft:#5c5342;
    --hairline:#c9bb9c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;
    height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
    user-select:none; -webkit-user-select:none;
  }
  header{
    padding:14px 22px 6px;
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  .kicker{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft);}
  h1{font-size:22px; font-weight:normal; font-style:italic; margin:0;}
  .sub{font-size:12px; font-style:italic; color:var(--ink-soft); margin-left:auto;}
  #stage{position:relative; flex:1 1 auto; min-height:0; margin:0 14px;}
  #stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair;}
  footer{
    padding:8px 22px 12px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    border-top:1px solid var(--hairline);
  }
  .preset{
    font-family:Georgia,serif; font-style:italic; font-size:13px;
    background:transparent; color:var(--ink);
    border:1px solid var(--hairline); border-radius:20px;
    padding:5px 14px; cursor:pointer;
  }
  .preset[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .sliderbox{display:flex; align-items:center; gap:8px; margin-left:6px; font-size:12px; font-style:italic; color:var(--ink-soft);}
  #lag{accent-color:#a83e18; width:130px;}
  #lagval{font-style:normal; min-width:58px; color:var(--ink);}
  .hint{margin-left:auto; font-size:11.5px; font-style:italic; color:var(--ink-soft);}
  @media (max-width:560px){
    header{padding:10px 14px 4px; gap:8px;}
    h1{font-size:17px;} .kicker{font-size:9.5px;} .sub{display:none;}
    #stage{margin:0 8px;}
    footer{padding:7px 12px 10px; gap:7px;}
    .preset{font-size:12px; padding:4px 11px;}
    .hint{display:none;}
  }
</style>
</head>
<body>
<header>
  <span class="kicker">№ 9059</span>
  <h1>One-Tenth Second</h1>
  <span class="sub">one gesture, four timings. drag the paper to take the hand. tap for another.</span>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer>
  <button class="preset" data-p="mirror" aria-pressed="false">dead mirror</button>
  <button class="preset" data-p="quartet" aria-pressed="true">quartet</button>
  <button class="preset" data-p="alive" aria-pressed="false">it is alive</button>
  <span class="sliderbox">companion timing
    <input id="lag" type="range" min="0" max="1000" value="400" step="5">
    <span id="lagval">400 ms</span>
  </span>
  <span class="hint">tap the paper for a new hand · drag to conduct it</span>
</footer>
<script>
"use strict";
/* One-Tenth Second: timing as the only material.
   One ambient hand (a looping 2D flourish) drives four timing
   personalities, recorded as ink channels below it. The viewer can
   retune the envelopes live, or take the hand with a finger. */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ---------- seeded rng ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const q = new URLSearchParams(location.search);
const locked = q.has('seed');
const DEFAULT_SEED = 99; // big sweeping hand, crisp trill in the mirror channel
let seed = locked ? (parseInt(q.get('seed'),10)>>>0 || 1) : DEFAULT_SEED;

/* ---------- state ---------- */
const WIN = 9;            // seconds of channel record
const TRAIL = 3;          // seconds of bright live edge on the hand
const FPS = 60;
const S = {
  driver:{x:0,y:0}, target:{x:0,y:0},
  driving:false, releaseT:0,
  dHist:null, xyHist:null,     // y-signal history, 2D trail history
  t:0,
  chans:[], spring:{x:0,v:0},
  gesture:null, grain:null, wob:null,
  W:0, H:0, dpr:1, geom:null
};

/* The hand is one looping flourish: a base ellipse (the sweep), a
   second-harmonic loop (the loop-de-loop), a hand-wobble ripple, and
   one or two circular flourish bursts. The pen truly circles during
   a burst, so the trill reads as loops, never zigzag. */
function buildHand(rng){
  const P=9;
  const mkAxis=()=>({
    base:{a:0.85+rng()*0.3, p:rng()*Math.PI*2},
    loop:{f:2, a:0.18+rng()*0.22, p:rng()*Math.PI*2},
    rip:{f:3+Math.floor(rng()*3), a:0.05+rng()*0.09, p:rng()*Math.PI*2}
  });
  const hx=mkAxis(), hy=mkAxis();
  // keep the base ellipse open: phases must not line up into a diagonal
  if(Math.abs(Math.sin(hx.base.p-hy.base.p))<0.4) hy.base.p+=0.7;
  const bursts=[];
  const nb=1+Math.floor(rng()*2);
  for(let i=0;i<nb;i++){
    bursts.push({
      t0:rng()*P, w:0.6+rng()*0.6,
      loops:1+Math.floor(rng()*2), p:rng()*Math.PI*2,
      r:0.14+rng()*0.16
    });
  }
  const g={P,hx,hy,bursts,nx:1,ny:1};
  let px=0, py=0;
  for(let s=0;s<400;s++){
    const pt=handPointRaw(g, s/400*P);
    px=Math.max(px,Math.abs(pt.x)); py=Math.max(py,Math.abs(pt.y));
  }
  g.nx=px||1; g.ny=py||1;
  return g;
}
function axisBase(h,t,P){
  return h.base.a*Math.sin(2*Math.PI*t/P+h.base.p)
       + h.loop.a*Math.sin(2*Math.PI*h.loop.f*t/P+h.loop.p)
       + h.rip.a*Math.sin(2*Math.PI*h.rip.f*t/P+h.rip.p);
}
function handPointRaw(g,t){
  const P=g.P;
  t=((t%P)+P)%P;
  let x=axisBase(g.hx,t,P), y=axisBase(g.hy,t,P);
  for(const bu of g.bursts){
    let d=t-bu.t0; if(d>P/2)d-=P; if(d<-P/2)d+=P;
    const env=Math.exp(-(d*d)/(bu.w*bu.w));
    if(env<0.01) continue;
    const ph=bu.p + d*(2*Math.PI*bu.loops/(2*bu.w));
    x+=bu.r*env*Math.cos(ph);
    y+=bu.r*env*Math.sin(ph);
  }
  return {x,y};
}
function handPoint(g,t){
  const p=handPointRaw(g,t);
  return {x:p.x/g.nx, y:p.y/g.ny};
}

function makeGrain(rng){
  const s=128, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const g=cv.getContext('2d'), id=g.createImageData(s,s);
  for(let i=0;i<id.data.length;i+=4){
    const v=225+Math.floor(rng()*30);
    id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255;
  }
  g.putImageData(id,0,0);
  return cv;
}

function buildAll(){
  const rng=mulberry32(seed);
  const P=9;
  S.gesture=buildHand(rng);
  S.grain=makeGrain(mulberry32(seed^0x9e37));
  const wr=mulberry32(seed^0x51f7);
  S.wob={frame:Array.from({length:32},()=>(wr()-0.5)*3),
         base:Array.from({length:4},()=>Array.from({length:40},()=>(wr()-0.5)*2.2))};
  S.driver={x:0,y:0}; S.target={x:0,y:0}; S.t=0; S.releaseT=0;
  S.spring={x:0,v:0};
  S.dHist=new Float32Array(WIN*FPS);
  S.xyHist=new Float32Array(TRAIL*FPS*2);
  S.chans=[
    {key:'mirror', name:'mirror', sub:'12 ms', delay:0.012, tau:0.008, color:'#2f3d6e', width:1.7},
    {key:'shadow', name:'shadow', sub:'120 ms', delay:0.120, tau:0.06, color:'#7a4a22', width:1.9},
    {key:'comp', name:'companion', sub:'400 ms', delay:0.400, tau:0.16, color:'#a83e18', width:2.1},
    {key:'spring', name:'long spring', sub:'settle 1.4 s', delay:0.15, tau:0, color:'#2e5b45', width:2.1, spring:true},
  ];
  S.hist=S.chans.map(()=>new Float32Array(WIN*FPS));
  layout();
}

/* ---------- layout ---------- */
function layout(){
  const r=canvas.getBoundingClientRect();
  const small=r.width<560;
  S.dpr=Math.min(2, window.devicePixelRatio||1);
  S.W=Math.max(50,r.width); S.H=Math.max(50,r.height);
  canvas.width=Math.round(S.W*S.dpr); canvas.height=Math.round(S.H*S.dpr);
  const labelW=small?86:168, m=small?10:22, top=small?8:14, bot=small?8:14;
  const plotX=m+labelW, plotW=S.W-plotX-m;
  const flH=(S.H-top-bot)*0.36;                 // flourish band
  const bandH=(S.H-top-bot-flH)/4;              // channel bands
  S.geom={labelW,m,top,bot,plotX,plotW,flH,bandH,small,
          flTop:top, chTop:top+flH,
          amp:Math.min(bandH*0.36, small?26:40)};
}
new ResizeObserver(layout).observe(document.getElementById('stage'));

/* ---------- envelopes ---------- */
function lowpass(prev,x,dt,tau){
  const a=1-Math.exp(-dt/Math.max(tau,1e-4));
  return prev+(x-prev)*a;
}
function springStep(sp,target,dt){
  const k=42, c=4.6;   // loose: visible overshoot, ~1.4 s settle
  const acc=(target-sp.x)*k-sp.v*c;
  sp.v+=acc*dt; sp.x+=sp.v*dt;
  return sp.x;
}

/* ---------- sampling ---------- */
let last=performance.now();
function advance(dt){
  S.t+=dt;
  const G=S.gesture;
  const gp=handPoint(G,S.t), gx=gp.x, gy=gp.y;
  let wx, wy;
  if(S.driving){ wx=S.target.x; wy=S.target.y; }
  else if(S.releaseT>0){
    S.releaseT-=dt;
    const k=Math.max(0,S.releaseT/1.2);
    wx=S.target.x*k+gx*(1-k); wy=S.target.y*k+gy*(1-k);
    if(S.releaseT<=0){wx=gx;wy=gy;}
  } else { wx=gx; wy=gy; }
  S.driver.x=lowpass(S.driver.x,wx,dt,0.030);
  S.driver.y=lowpass(S.driver.y,wy,dt,0.030);

  push(S.dHist,S.driver.y);
  const xh=S.xyHist;
  xh.copyWithin(0,2); xh[xh.length-2]=S.driver.x; xh[xh.length-1]=S.driver.y;

  for(let i=0;i<S.chans.length;i++){
    const ch=S.chans[i];
    const back=Math.round(ch.delay*FPS);
    const raw=S.dHist[S.dHist.length-1-back]||0;
    let v;
    if(ch.spring) v=springStep(S.spring,raw,dt);
    else{
      const h=S.hist[i];
      v=lowpass(h[h.length-2]||0,raw,dt,ch.tau);
    }
    push(S.hist[i],v);
  }
}
function push(arr,v){arr.copyWithin(0,1);arr[arr.length-1]=v;}

/* ---------- drawing ---------- */
function draw(){
  const {W,H,dpr,geom}=S;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.fillStyle='#f1e7d0';
  ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha=0.05; ctx.globalCompositeOperation='multiply';
  ctx.fillStyle=ctx.createPattern(S.grain,'repeat');
  ctx.fillRect(0,0,W,H); ctx.restore();

  // wobbly plate frame
  ctx.save();
  ctx.strokeStyle='rgba(90,78,55,0.55)'; ctx.lineWidth=1.2;
  (function(){
    const w=S.wob.frame, m=geom.m+4, segs=18;
    const corner=[[m,m],[W-m,m],[W-m,H-m],[m,H-m]];
    let wi=0;
    ctx.beginPath();
    for(let e=0;e<4;e++){
      const a=corner[e], b=corner[(e+1)%4];
      const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1;
      const nx=-dy/L, ny=dx/L;
      for(let s2=0;s2<=segs;s2++){
        const t=s2/segs;
        const off=w[wi++%w.length]*0.9+Math.sin(t*Math.PI*3+e)*0.7;
        const x=a[0]+dx*t+nx*off, y=a[1]+dy*t+ny*off;
        (e===0&&s2===0)?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
    }
    ctx.closePath(); ctx.stroke();
  })();
  ctx.restore();

  ctx.globalCompositeOperation='multiply';
  drawFlourish();
  for(let i=0;i<S.chans.length;i++) drawChannel(i);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
}

/* flourish geometry: signal [-1.2,1.2] into the band */
function flGeom(){
  const g=S.geom;
  const cy=g.flTop+g.flH/2, x0=g.plotX, x1=g.plotX+g.plotW;
  const yAmp=g.flH*0.40;
  return {cy,x0,x1,yAmp,
    X:v=>x0+(v/1.2*0.5+0.5)*(x1-x0),
    Y:v=>cy-v*yAmp};
}
function drawFlourish(){
  const g=S.geom, fg=flGeom();
  const G=S.gesture;

  // the hand's path: the full closed loop in graphite ink
  ctx.save();
  ctx.globalAlpha=0.62;
  ctx.strokeStyle='#3a352b'; ctx.lineWidth=1.9; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  const N=280;
  for(let k=0;k<=N;k++){
    const t=k/N*G.P;
    const hp=handPoint(G,t), x=fg.X(hp.x), y=fg.Y(hp.y);
    k?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();

  // the live edge: last seconds redrawn brighter so the pen reads as moving
  const xh=S.xyHist, n=TRAIL*FPS, chunks=18;
  const per=Math.floor(n/chunks);
  ctx.save();
  ctx.fillStyle='#241f16';
  for(let c=0;c<chunks;c++){
    const a=Math.pow((c+1)/chunks,1.6)*0.85;
    if(a<0.03) continue;
    ctx.globalAlpha=a;
    const wBase=1.4+2.4*Math.pow((c+1)/chunks,1.2);
    ribbonPath(xh, c*per, Math.min(n,(c+1)*per+2), fg, wBase);
    ctx.fill();
  }
  ctx.restore();

  // now-dot
  const nx=fg.X(xh[xh.length-2]), ny=fg.Y(xh[xh.length-1]);
  ctx.save();
  ctx.globalAlpha=0.25; ctx.fillStyle='#a83e18';
  ctx.beginPath(); ctx.arc(nx,ny,7,0,7); ctx.fill();
  ctx.globalAlpha=0.95;
  ctx.beginPath(); ctx.arc(nx,ny,2.6,0,7); ctx.fill();
  ctx.restore();

  // label
  ctx.save();
  ctx.fillStyle='#2a2419'; ctx.textBaseline='middle';
  const lx=g.m+6, cy=g.flTop+g.flH*0.5;
  ctx.font=(g.small?'italic 12px':'italic 15px')+' Georgia,serif';
  ctx.fillText('the hand', lx, cy-(g.small?7:9));
  ctx.font=(g.small?'10px':'11.5px')+' Georgia,serif';
  ctx.fillStyle='#5c5342';
  ctx.fillText('the gesture itself', lx, cy+(g.small?7:9));
  ctx.restore();
}
/* filled variable-width ribbon through xyHist[i0..i1] (pairs) */
function ribbonPath(xh,i0,i1,fg,wBase){
  ctx.beginPath();
  let started=false;
  const fwd=[], bwd=[];
  for(let k=i0;k<i1;k++){
    const x=fg.X(xh[k*2]), y=fg.Y(xh[k*2+1]);
    const k2=Math.min(i1-1,k+1), k0=Math.max(i0,k-1);
    const dx=fg.X(xh[k2*2])-fg.X(xh[k0*2]), dy=fg.Y(xh[k2*2+1])-fg.Y(xh[k0*2+1]);
    const L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
    const spd=Math.hypot(dx,dy)*FPS/2;
    const w=(wBase*(0.6+1.4*Math.exp(-spd/60)))/2;
    fwd.push([x+nx*w,y+ny*w]); bwd.push([x-nx*w,y-ny*w]);
  }
  for(const p of fwd){ started?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); started=true; }
  for(let k=bwd.length-1;k>=0;k--) ctx.lineTo(bwd[k][0],bwd[k][1]);
  ctx.closePath();
}

function chanGeom(i){
  const g=S.geom;
  const cy=g.chTop+g.bandH*(i+0.5);
  return {cy, x0:g.plotX, x1:g.plotX+g.plotW, amp:g.amp, base:S.wob.base[i]};
}
function drawChannel(i){
  const ch=S.chans[i], cg=chanGeom(i), g=S.geom;
  const {cy,x0,x1,amp}=cg;
  ctx.save();
  ctx.strokeStyle='rgba(120,105,80,0.5)'; ctx.lineWidth=1;
  ctx.beginPath();
  const nb=cg.base.length;
  for(let k=0;k<=nb;k++){
    const x=x0+(x1-x0)*k/nb, y=cy+cg.base[k%nb]*0.4;
    k?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke(); ctx.restore();

  // ghost of the hand behind each response
  drawTrace(S.dHist,'rgba(107,100,85,0.16)',1.1,cg,0.16);
  // the trace: variable-width ink ribbon with a soft bleed pass
  drawTrace(S.hist[i],ch.color,ch.width,cg,0.88);

  ctx.save();
  ctx.fillStyle='#2a2419'; ctx.textBaseline='middle';
  const lx=g.m+6;
  ctx.font=(g.small?'italic 12px':'italic 15px')+' Georgia,serif';
  ctx.fillText(ch.name, lx, cy-(g.small?7:9));
  ctx.font=(g.small?'10px':'11.5px')+' Georgia,serif';
  ctx.fillStyle='#5c5342';
  ctx.fillText(ch.sub, lx, cy+(g.small?7:9));
  ctx.restore();
}

function drawTrace(hist,color,baseW,cg,alpha){
  const {cy,x0,x1,amp}=cg;
  const n=hist.length, step=(x1-x0)/(n-1), spdRef=2.2;
  ctx.save();
  ctx.fillStyle=color;
  const passes=[{ws:2.1,a:alpha*0.28},{ws:1.0,a:alpha}];
  for(const ps of passes){
    ctx.globalAlpha=ps.a;
    ctx.beginPath();
    let started=false;
    for(let k=0;k<n;k++){
      const v=hist[k], x=x0+k*step, y=cy-v*amp;
      const v2=hist[Math.min(n-1,k+1)];
      const spd=Math.abs(v2-v)*FPS;
      const w=(baseW*ps.ws*(0.55+1.7*Math.exp(-spd/spdRef)))/2;
      const vp=hist[Math.max(0,k-1)], vn=hist[Math.min(n-1,k+1)];
      const dx=2*step, dy=(vn-vp)*amp;
      const L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
      if(!started){ctx.moveTo(x+nx*w,y+ny*w);started=true;}
      else ctx.lineTo(x+nx*w,y+ny*w);
    }
    for(let k=n-1;k>=0;k--){
      const v=hist[k], x=x0+k*step, y=cy-v*amp;
      const v2=hist[Math.min(n-1,k+1)];
      const spd=Math.abs(v2-v)*FPS;
      const w=(baseW*ps.ws*(0.55+1.7*Math.exp(-spd/spdRef)))/2;
      const vp=hist[Math.max(0,k-1)], vn=hist[Math.min(n-1,k+1)];
      const dx=2*step, dy=(vn-vp)*amp;
      const L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
      ctx.lineTo(x-nx*w,y-ny*w);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ---------- main loop ---------- */
function frame(){
  const now=performance.now();
  let dt=(now-last)/1000; last=now;
  advance(Math.min(dt,0.05));
  draw();
  requestAnimationFrame(frame);
}

/* ---------- interaction ---------- */
const stage=document.getElementById('stage');
let pdown=null;
function targetFromEvent(e){
  const r=canvas.getBoundingClientRect(), fg=flGeom();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  const tx=((px-fg.x0)/(fg.x1-fg.x0)*2-1)*1.2;
  const ty=-((py-fg.cy)/fg.yAmp)*1.2;
  return {x:Math.max(-1.3,Math.min(1.3,tx)), y:Math.max(-1.3,Math.min(1.3,ty))};
}
stage.addEventListener('pointerdown',e=>{
  pdown={t:performance.now(),x:e.clientX,y:e.clientY,moved:false};
  S.driving=true; S.releaseT=0; S.target=targetFromEvent(e);
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!pdown) return;
  if(Math.hypot(e.clientX-pdown.x,e.clientY-pdown.y)>12) pdown.moved=true;
  S.target=targetFromEvent(e);
});
stage.addEventListener('pointerup',()=>{
  const quick=performance.now()-pdown.t<250&&!pdown.moved;
  pdown=null;
  if(quick){ S.driving=false; if(!locked) reseed(); else rebuild(); }
  else { S.driving=false; S.releaseT=1.2; }
});
stage.addEventListener('pointercancel',()=>{pdown=null;S.driving=false;S.releaseT=1.2;});

function rebuild(){
  buildAll();
  for(let k=0;k<WIN*FPS;k++) advance(1/FPS);
}
function reseed(){
  seed=(Math.random()*1e9)>>>0||7;
  if(!locked) history.replaceState(null,'','?seed='+seed);
  rebuild();
}

/* ---------- controls ---------- */
const lag=document.getElementById('lag'), lagval=document.getElementById('lagval');
lag.addEventListener('input',()=>{
  const ms=+lag.value;
  lagval.textContent=ms+' ms';
  const ch=S.chans.find(c=>c.key==='comp');
  if(ch){ch.delay=ms/1000;ch.sub=ms+' ms';}
  setPreset(null);
});
const presets=document.querySelectorAll('.preset');
function setPreset(name){
  presets.forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===name?'true':'false'));
}
presets.forEach(b=>b.addEventListener('click',()=>{
  const p=b.dataset.p, C=i=>S.chans[i];
  if(p==='mirror'){
    C(0).delay=0.015;C(0).tau=0.006;C(0).sub='15 ms';
    C(1).delay=0.030;C(1).tau=0.02;C(1).sub='30 ms';
    C(2).delay=0.060;C(2).tau=0.03;C(2).sub='60 ms';
    lag.value=60;lagval.textContent='60 ms';
  }else if(p==='alive'){
    C(0).delay=0.080;C(0).tau=0.03;C(0).sub='80 ms';
    C(1).delay=0.350;C(1).tau=0.10;C(1).sub='350 ms';
    C(2).delay=0.900;C(2).tau=0.18;C(2).sub='900 ms';
    lag.value=900;lagval.textContent='900 ms';
  }else{
    C(0).delay=0.012;C(0).tau=0.008;C(0).sub='12 ms';
    C(1).delay=0.120;C(1).tau=0.06;C(1).sub='120 ms';
    C(2).delay=0.400;C(2).tau=0.16;C(2).sub='400 ms';
    lag.value=400;lagval.textContent='400 ms';
  }
  setPreset(p);
}));

/* ---------- go ---------- */
rebuild();
requestAnimationFrame(frame);
</script>
</body>
</html>
