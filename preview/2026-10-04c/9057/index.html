<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9057 · Folded Light</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; }
  #stage { position: fixed; inset: 0; display: block; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    text-align: center; color: rgba(255,255,255,0.42);
    font: 12px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.14em; pointer-events: none; user-select: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click to refold</div>
<script>
'use strict';
/* №9057 · Folded Light
   FUTURE_PIECES.md seed 28: the arrangement fold as the piece.
   One palette, three panels — as rolled / dark heart / light heart.
   Same colors, three different moods. Order is a compositional parameter. */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '777001', 10) || 777001;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  draw();
}
window.addEventListener('resize', resize);

let palette, orders;
const LABELS = ['as rolled', 'dark heart', 'light heart'];

function buildWorld(s) {
  const rnd = mulberry32(s);
  const h0 = rnd() * 360;
  const spread = 24 + rnd() * 60;           // analogous family width
  const n = 6;
  palette = [];
  for (let i = 0; i < n; i++) {
    const h = (h0 + (rnd() - 0.5) * spread + 360) % 360;
    const L = 0.32 + rnd() * 0.52;          // 0.32..0.84
    let C = 0.06 + rnd() * 0.11;            // muted to vivid
    if (L > 0.68) C = Math.min(C, 0.09);    // no neon brights
    palette.push({ h, L, C });
  }
  // one accent: push chroma on a single color
  const acc = Math.floor(rnd() * n);
  palette[acc].C = Math.min(0.15, palette[acc].C + 0.05);
  if (palette[acc].L > 0.68) palette[acc].C = Math.min(palette[acc].C, 0.09);

  const shuffled = palette.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const byLight = palette.slice().sort((a, b) => a.L - b.L);
  // dark heart: darkest central, symmetric falloff outward
  const darkHeart = [];
  const tmp = byLight.slice();
  let side = 0;
  while (tmp.length) {
    const c = tmp.shift(); // darkest remaining
    if (side % 2 === 0) darkHeart.push(c); else darkHeart.unshift(c);
    side++;
  }
  // light heart: lightest central
  const lightHeart = [];
  const tmp2 = byLight.slice().reverse();
  side = 0;
  while (tmp2.length) {
    const c = tmp2.shift();
    if (side % 2 === 0) lightHeart.push(c); else lightHeart.unshift(c);
    side++;
  }
  orders = [shuffled, darkHeart, lightHeart];
}

// interpolate in OKLCH-ish (L, C, hue-angle with wraparound)
function mix(a, b, f) {
  let dh = b.h - a.h;
  if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
  return { L: a.L + (b.L - a.L) * f, C: a.C + (b.C - a.C) * f, h: (a.h + dh * f + 360) % 360 };
}
const css = (c) => `oklch(${(c.L * 100).toFixed(2)}% ${c.C.toFixed(3)} ${c.h.toFixed(1)})`;

function drawPanel(x0, w, order) {
  const n = order.length;
  const strips = 320;
  const segLen = H / n;
  for (let s = 0; s < strips; s++) {
    const y = (s / strips) * H;
    const pos = y / segLen;                 // 0..n in color-index space
    const i = Math.min(n - 2, Math.floor(pos));
    const f = pos - i;
    // smoothstep the local blend for softer band joints
    const sf = f * f * (3 - 2 * f);
    ctx.fillStyle = css(mix(order[i], order[i + 1], sf));
    ctx.fillRect(x0, y, w, H / strips + 1);
  }
}

function draw() {
  buildWorldIfNeeded();
  const pw = W / 3;
  for (let p = 0; p < 3; p++) drawPanel(p * pw, pw, orders[p]);
  // hairline dividers
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(pw - 0.5, 0, 1, H);
  ctx.fillRect(2 * pw - 0.5, 0, 1, H);
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(pw + 0.5, 0, 1, H);
  ctx.fillRect(2 * pw + 0.5, 0, 1, H);
  // whisper of grain for tactility
  const rnd = mulberry32(seed ^ 0x9e37);
  ctx.fillStyle = 'rgba(255,255,255,0.028)';
  const dots = Math.floor(W * H / 900);
  for (let i = 0; i < dots; i++) {
    ctx.fillRect(rnd() * W, rnd() * H, 1, 1);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.028)';
  for (let i = 0; i < dots; i++) {
    ctx.fillRect(rnd() * W, rnd() * H, 1, 1);
  }
  // labels
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '11px -apple-system, "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  for (let p = 0; p < 3; p++) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 6;
    ctx.fillText(LABELS[p].toUpperCase(), (p + 0.5) * pw, H - 56);
    ctx.restore();
  }
}

let builtSeed = null;
function buildWorldIfNeeded() {
  if (builtSeed !== seed) { buildWorld(seed); builtSeed = seed; }
}

canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  builtSeed = null;
  draw();
});

resize();
</script>
</body>
</html>
