<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9056 · Marine Snow</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #020607; }
  #stage { position: fixed; inset: 0; display: block; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom));
    text-align: center; color: rgba(180, 220, 215, 0.34);
    font: 12px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.14em; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another depth</div>
<script>
'use strict';
/* №9056 · Marine Snow
   The background of №9055 (dropped), polished into its own piece:
   a quiet water column — deep gradient, faint light shafts, layered
   marine snow drifting down through the dark. No creature. Stillness
   is the subject. */

// ---- seeded rng ----
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9056', 10) || 9056;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---- world ----
let washes, shafts, deepGlow, snow, motes, palette;

function buildWorld(s) {
  const rnd = mulberry32(s);
  // palette: deep blue-green base, whisper of violet (echo of 9055's backdrop)
  palette = {
    top: [4 + rnd() * 4, 12 + rnd() * 6, 14 + rnd() * 6],
    mid: [2 + rnd() * 3, 7 + rnd() * 4, 9 + rnd() * 4],
    bot: [1, 3 + rnd() * 2, 4 + rnd() * 2],
    washA: rnd() < 0.5 ? [88, 70, 150] : [60, 110, 130],   // violet or teal whisper
    washB: [40, 90, 100],
  };

  // large barely-there color washes, slow drift
  washes = [];
  for (let i = 0; i < 3; i++) {
    washes.push({
      x: rnd(), y: 0.25 + rnd() * 0.5, r: 0.45 + rnd() * 0.35,
      hue: i === 0 ? palette.washA : palette.washB,
      a: 0.028 + rnd() * 0.03,
      dx: (rnd() - 0.5) * 0.008, dy: (rnd() - 0.5) * 0.006,
      ph: rnd() * Math.PI * 2, sp: 0.05 + rnd() * 0.06,
    });
  }

  // faint volumetric shafts from above
  shafts = [];
  const nShafts = 4 + Math.floor(rnd() * 3);
  for (let i = 0; i < nShafts; i++) {
    shafts.push({
      x: 0.08 + rnd() * 0.84, w: 0.045 + rnd() * 0.09,
      tilt: 0.10 + rnd() * 0.12, a: 0.045 + rnd() * 0.05,
      ph: rnd() * Math.PI * 2, sp: 0.10 + rnd() * 0.12,
      sway: 0.015 + rnd() * 0.02,
    });
  }

  // one whisper of distant glow low in the frame — depth anchor, not a subject
  deepGlow = {
    x: 0.3 + rnd() * 0.4, y: 0.62 + rnd() * 0.2, r: 0.28 + rnd() * 0.15,
    hue: rnd() < 0.5 ? [70, 130, 140] : [90, 90, 160],
    a: 0.035 + rnd() * 0.03, ph: rnd() * Math.PI * 2, sp: 0.08 + rnd() * 0.08,
  };

  // marine snow in 4 depth layers: far = small, dim, slow; near = bigger, brighter
  snow = [];
  const layers = [
    { n: 55, size: [0.4, 1.0], a: [0.10, 0.30], vy: [3, 8],   blur: 0 },
    { n: 40, size: [0.8, 1.7], a: [0.16, 0.42], vy: [6, 14],  blur: 0 },
    { n: 28, size: [1.4, 2.6], a: [0.22, 0.55], vy: [10, 22], blur: 1 },
    { n: 14, size: [2.2, 4.0], a: [0.28, 0.60], vy: [16, 30], blur: 2 },
  ];
  layers.forEach((L, li) => {
    for (let i = 0; i < L.n; i++) {
      snow.push({
        x: rnd() * W, y: rnd() * H,
        r: L.size[0] + rnd() * (L.size[1] - L.size[0]),
        a: L.a[0] + rnd() * (L.a[1] - L.a[0]),
        vy: L.vy[0] + rnd() * (L.vy[1] - L.vy[0]),
        swayA: 4 + rnd() * 14, swayF: 0.1 + rnd() * 0.25,
        ph: rnd() * Math.PI * 2,
        layer: li, blur: L.blur,
        tone: rnd(), // 0 cool white, 1 faint teal
      });
    }
  });

  // a few bioluminescent motes: dim drifting sparks with slow pulse (not creatures)
  motes = [];
  for (let i = 0; i < 12; i++) {
    motes.push({
      x: rnd() * W, y: rnd() * H,
      r: 1.0 + rnd() * 1.6, a: 0.25 + rnd() * 0.4,
      vy: 2 + rnd() * 6, vx: (rnd() - 0.5) * 4,
      ph: rnd() * Math.PI * 2, sp: 0.25 + rnd() * 0.5,
      hue: rnd() < 0.6 ? [150, 230, 220] : [170, 150, 230],
    });
  }
}
buildWorld(seed);

// pointer stirs the water gently
const pointer = { x: -9999, y: -9999, tx: -9999, ty: -9999 };
window.addEventListener('pointermove', (e) => { pointer.tx = e.clientX; pointer.ty = e.clientY; });
window.addEventListener('pointerleave', () => { pointer.tx = -9999; pointer.ty = -9999; });

canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  buildWorld(seed);
});

function rgb(c) { return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; }

let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  // ease pointer
  pointer.x += (pointer.tx - pointer.x) * 0.06;
  pointer.y += (pointer.ty - pointer.y) * 0.06;

  // base gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(palette.top));
  g.addColorStop(0.55, rgb(palette.mid));
  g.addColorStop(1, rgb(palette.bot));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // color washes (additive, barely-there)
  ctx.globalCompositeOperation = 'lighter';
  for (const w of washes) {
    const wx = (w.x + Math.sin(t * w.sp + w.ph) * 0.03 + w.dx * t * 10 % 1) * W;
    const wy = (w.y + Math.cos(t * w.sp * 0.8 + w.ph) * 0.02) * H;
    const wr = w.r * Math.max(W, H);
    const rg = ctx.createRadialGradient(wx, wy, 0, wx, wy, wr);
    const flicker = 0.75 + 0.25 * Math.sin(t * w.sp * 2 + w.ph);
    rg.addColorStop(0, `rgba(${w.hue[0]},${w.hue[1]},${w.hue[2]},${(w.a * flicker).toFixed(3)})`);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(wx - wr, wy - wr, wr * 2, wr * 2);
  }

  // whisper of distant glow — depth anchor
  {
    const gx = (deepGlow.x + Math.sin(t * deepGlow.sp + deepGlow.ph) * 0.02) * W;
    const gy = deepGlow.y * H, gr = deepGlow.r * Math.max(W, H);
    const breathe = 0.7 + 0.3 * Math.sin(t * deepGlow.sp * 1.6 + deepGlow.ph);
    const gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    gg.addColorStop(0, `rgba(${deepGlow.hue[0]},${deepGlow.hue[1]},${deepGlow.hue[2]},${(deepGlow.a * breathe).toFixed(3)})`);
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
  }

  // light shafts
  for (const s of shafts) {
    const swayX = Math.sin(t * s.sp + s.ph) * s.sway * W;
    const xTop = s.x * W + swayX, xBot = xTop + s.tilt * H;
    const wTop = s.w * W, wBot = wTop * 1.9;
    const breathe = 0.7 + 0.3 * Math.sin(t * s.sp * 1.7 + s.ph * 2);
    const lg = ctx.createLinearGradient(xTop, 0, xBot, H);
    lg.addColorStop(0, `rgba(170,215,215,${(s.a * breathe).toFixed(3)})`);
    lg.addColorStop(1, 'rgba(170,215,215,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(xTop - wTop / 2, -10); ctx.lineTo(xTop + wTop / 2, -10);
    ctx.lineTo(xBot + wBot / 2, H + 10); ctx.lineTo(xBot - wBot / 2, H + 10);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // marine snow
  for (const p of snow) {
    p.y += p.vy * 0.016;
    const sx = p.x + Math.sin(t * p.swayF + p.ph) * p.swayA;
    if (p.y > H + 8) { p.y = -8; p.x = Math.random() * W; }
    // pointer stirs nearby flakes
    const dx = sx - pointer.x, dy = p.y - pointer.y;
    const d2 = dx * dx + dy * dy, R = 130;
    let ox = 0, oy = 0;
    if (d2 < R * R && d2 > 1) {
      const d = Math.sqrt(d2), push = (1 - d / R) * 26 / (p.layer + 1);
      ox = (dx / d) * push; oy = (dy / d) * push;
    }
    const tw = 0.8 + 0.2 * Math.sin(t * 0.9 + p.ph * 3);
    const a = p.a * tw;
    const col = p.tone < 0.7 ? '210,228,224' : '170,210,205';
    if (p.blur) { ctx.shadowBlur = p.blur * 3; ctx.shadowColor = `rgba(${col},${a.toFixed(2)})`; }
    ctx.fillStyle = `rgba(${col},${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(sx + ox, p.y + oy, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // motes: soft glowing sparks, slow pulse
  ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    m.x += m.vx * 0.016; m.y += m.vy * 0.016;
    if (m.y > H + 10) { m.y = -10; m.x = Math.random() * W; }
    if (m.x < -10) m.x = W + 10; if (m.x > W + 10) m.x = -10;
    const pulse = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * m.sp + m.ph));
    const a = m.a * pulse;
    const rg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 5);
    rg.addColorStop(0, `rgba(${m.hue[0]},${m.hue[1]},${m.hue[2]},${a.toFixed(3)})`);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  // vignette
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
