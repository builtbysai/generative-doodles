<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9058 · Patch Mountain</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #17100a; }
  #stage { position: fixed; inset: 0; display: block; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    text-align: center; color: rgba(235, 220, 195, 0.38);
    font: 12px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.14em; pointer-events: none; user-select: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another mountain</div>
<script>
'use strict';
/* №9058 · Patch Mountain
   Cézanne study seed 420 ("The Patch Is the Picture"): nothing is ever
   drawn. A mountain emerges from small parallel modulated patches laid on
   a reserved warm dark ground. Each zone's patches share a direction, hue
   jittered within a narrow band; a fixed fraction of ground stays
   untouched. No outlines anywhere. */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9058', 10) || 9058;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  draw();
}
window.addEventListener('resize', resize);

// 1D value noise for the ridgeline
function makeNoise(rnd) {
  const g = [];
  for (let i = 0; i < 64; i++) g.push(rnd());
  return function (x) {
    const xi = Math.floor(x * 63), xf = x * 63 - xi;
    const a = g[xi % 64], b = g[(xi + 1) % 64];
    const u = xf * xf * (3 - 2 * xf);
    return a + (b - a) * u;
  };
}

function draw() {
  const rnd = mulberry32(seed);
  const noise = makeNoise(rnd);

  // reserved warm dark ground: a tone in the chord, not a background
  const ground = [26 + rnd() * 8, 18 + rnd() * 6, 12 + rnd() * 5];
  ctx.fillStyle = `rgb(${ground[0]|0},${ground[1]|0},${ground[2]|0})`;
  ctx.fillRect(0, 0, W, H);

  // mountain mass: peak position and shoulders from seed
  const peakX = 0.52 + rnd() * 0.2;
  const peakY = 0.27 + rnd() * 0.08;
  const massW = 0.52 + rnd() * 0.14;
  function ridge(x) { // ridgeline y (0..1) at x (0..1)
    const d = Math.abs(x - peakX) / massW;
    let y = peakY + d * d * 0.72;
    y += (noise(x * 3.1) - 0.5) * 0.10 * (0.3 + d);
    y += (noise(x * 9.7 + 40) - 0.5) * 0.035;
    return y;
  }
  const snowY = peakY + 0.10 + rnd() * 0.04;
  const foreY = 0.72 + rnd() * 0.06;   // foreground starts

  // a few dark vertical trees for the Cézanne vertical accent
  const trees = [];
  const nTrees = 3 + Math.floor(rnd() * 4);
  for (let i = 0; i < nTrees; i++) {
    trees.push({ x: 0.08 + rnd() * 0.84, w: 0.012 + rnd() * 0.014,
                 top: 0, h: 0.10 + rnd() * 0.10, lean: (rnd() - 0.5) * 0.06 });
  }
  for (const tr of trees) {
    const gx = tr.x * W;
    tr.top = ridge(tr.x) + 0.02;
    tr.bot = tr.top + tr.h;
  }

  // zone palettes (narrow hue bands, jittered per patch)
  const skyH = 208 + rnd() * 22;
  const mtnH = 228 + rnd() * 26;
  const foreH = rnd() < 0.5 ? 78 + rnd() * 18 : 26 + rnd() * 14;

  const cell = Math.max(9, Math.min(W, H) / 62);
  const cover = 0.72;   // fixed fraction of ground left untouched

  function zoneAt(x, y) {
    const r = ridge(x / W);
    if (y / H < r) return 'sky';
    if (y / H > foreY) return 'fore';
    for (const tr of trees) {
      const tx = tr.x * W, tw = tr.w * W;
      if (Math.abs(x - tx) < tw && y / H > tr.top && y / H < tr.bot) return 'tree';
    }
    return 'mtn';
  }

  for (let gy = cell / 2; gy < H; gy += cell) {
    for (let gx = cell / 2; gx < W; gx += cell) {
      if (rnd() > cover) continue;               // reserved ground shows
      const jx = gx + (rnd() - 0.5) * cell * 0.7;
      const jy = gy + (rnd() - 0.5) * cell * 0.7;
      const z = zoneAt(jx, jy);
      let h, s, l, dir, len;
      if (z === 'sky') {
        h = skyH + (rnd() - 0.5) * 14; s = 16 + rnd() * 14; l = 40 + rnd() * 18;
        dir = (rnd() - 0.5) * 8; len = cell * (1.1 + rnd() * 0.5);
      } else if (z === 'mtn') {
        const snow = jy / H < snowY;
        if (snow) { h = mtnH + (rnd() - 0.5) * 10; s = 8 + rnd() * 8; l = 74 + rnd() * 12; }
        else { h = mtnH + (rnd() - 0.5) * 16; s = 12 + rnd() * 12; l = 28 + rnd() * 20; }
        dir = -19 + (rnd() - 0.5) * 10; len = cell * (1.0 + rnd() * 0.5);
      } else if (z === 'fore') {
        h = foreH + (rnd() - 0.5) * 14; s = 18 + rnd() * 14; l = 16 + rnd() * 14;
        dir = 4 + (rnd() - 0.5) * 8; len = cell * (1.15 + rnd() * 0.5);
      } else { // tree: dark verticals
        h = 95 + rnd() * 20; s = 22 + rnd() * 10; l = 12 + rnd() * 8;
        dir = 90 + (rnd() - 0.5) * 10; len = cell * (1.3 + rnd() * 0.6);
      }
      const wid = cell * (0.55 + rnd() * 0.3);
      ctx.save();
      ctx.translate(jx, jy);
      ctx.rotate(dir * Math.PI / 180);
      ctx.fillStyle = `hsl(${h.toFixed(1)},${s.toFixed(0)}%,${l.toFixed(0)}%)`;
      ctx.fillRect(-len / 2, -wid / 2, len, wid);
      ctx.restore();
    }
  }
}

canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  draw();
});

resize();
</script>
</body>
</html>
