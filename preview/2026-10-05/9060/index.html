<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9060 · Uncurl Etude</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0806; }
  #stage { position: fixed; inset: 0; display: block; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    text-align: center; color: rgba(200, 218, 235, 0.36);
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.24em; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">CLICK TO RESEED</div>
<script>
'use strict';
/* №9060 · Uncurl Etude
   FUTURE_PIECES.md seed 44: a drawing that exists only as angleDiffs.
   A wire-bending machine extrudes its turning history at a constant feed
   rate; at full length it clamps, then plays the history backward and
   retracts the wire through the head. One continuous mechanical motion,
   no cuts, no fades. */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rng) {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

const qs = new URLSearchParams(location.search);
let seed = (parseInt(qs.get('seed'), 10) >>> 0) || 906007;

/* ---------- turning history: the drawing exists only as angleDiffs ---------- */
const NSEG = 150;
const BEND_THRESH = 0.24; /* rad; counts as a "turn" for the HUD */
let deltas = [], vpts = [];
function buildHistory() {
  const rng = mulberry32(seed);
  deltas = []; vpts = [{ x: 0, y: 0 }];
  let x = 0, y = 0, hd = rng() * Math.PI * 2, sinceBend = 99, cumTurn = 0;
  for (let i = 0; i < NSEG; i++) {
    let d = gauss(rng) * 0.028; /* nearly straight feed, slight wobble */
    sinceBend++;
    /* decisive bends at points, like a real bender program: feed, bend, feed */
    if (sinceBend > 5 && rng() < 0.105) {
      const r = rng();
      const mag = r < 0.62 ? 0.35 + rng() * 0.55        /* crisp corner */
                : r < 0.90 ? 0.95 + rng() * 0.60        /* hard bend */
                :            1.70 + rng() * 0.80;        /* fold-back */
      let sgn = rng() < 0.5 ? -1 : 1;
      if (Math.abs(cumTurn) > 1.1 && Math.sign(cumTurn || sgn) === sgn) sgn = -sgn; /* unwind spirals */
      d = mag * sgn;
      sinceBend = 0;
    }
    const rad = Math.hypot(x, y);
    if (rad > 0.62) { /* gentle homing nudge, never a steering yank */
      const want = Math.atan2(-y, -x);
      let dd = want - hd;
      while (dd > Math.PI) dd -= 2 * Math.PI;
      while (dd < -Math.PI) dd += 2 * Math.PI;
      d += dd * 0.045;
    }
    cumTurn = cumTurn * 0.93 + d;
    hd += d;
    deltas.push(d);
    x += Math.cos(hd); y += Math.sin(hd);
    vpts.push({ x, y });
  }
}

/* ---------- fit the polyline to the stage ---------- */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1;
let pts = [], segs = [], totalLen = 0;

function fit() {
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (const p of vpts) {
    if (p.x < minx) minx = p.x; if (p.x > maxx) maxx = p.x;
    if (p.y < miny) miny = p.y; if (p.y > maxy) maxy = p.y;
  }
  const ml = W * 0.08, mr = W * 0.08, mt = H * 0.17, mb = H * 0.12;
  const sc = Math.min((W - ml - mr) / Math.max(1e-6, maxx - minx),
                     (H - mt - mb) / Math.max(1e-6, maxy - miny));
  const ox = ml + ((W - ml - mr) - (maxx - minx) * sc) / 2;
  const oy = mt + ((H - mt - mb) - (maxy - miny) * sc) / 2;
  pts = vpts.map(p => ({ x: ox + (p.x - minx) * sc, y: oy + (p.y - miny) * sc }));
  segs = []; totalLen = 0;
  for (let i = 0; i < NSEG; i++) {
    const a = pts[i], b = pts[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    segs.push({ hd: Math.atan2(dy, dx), len, raw: deltas[i] });
    totalLen += len;
  }
  for (let i = 0; i < NSEG; i++) { /* smoothed tangent: the head rotates through turns, never steps */
    let sx = 0, sy = 0;
    for (let k = -2; k <= 2; k++) {
      const j = Math.max(0, Math.min(NSEG - 1, i + k));
      sx += Math.cos(segs[j].hd); sy += Math.sin(segs[j].hd);
    }
    segs[i].shd = Math.atan2(sy, sx);
  }
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  S = Math.max(0.62, Math.min(1.15, Math.min(W, H) / 720));
  fit();
}
window.addEventListener('resize', resize);

/* ---------- phase machine: constant feed, no easing ---------- */
const T_EX = 13, T_CL = 1.0, T_RE = 13, T_DW = 1.2;
const ROLLER_R = 7;
let phase = 'EXTRUDE', phaseT = 0, s = 0;
let rollerA = 0, lastDir = 1, clock = 0;

function update(dt) {
  clock += dt;
  phaseT += dt;
  const v = totalLen / T_EX; /* px per second, identical both directions */
  if (phase === 'EXTRUDE') {
    s = Math.min(1, phaseT / T_EX);
    rollerA += v / (ROLLER_R * S) * dt; lastDir = 1;
    if (s >= 1) { phase = 'CLAMP'; phaseT = 0; }
  } else if (phase === 'CLAMP') {
    if (phaseT >= T_CL) { phase = 'RETRACT'; phaseT = 0; }
  } else if (phase === 'RETRACT') {
    s = Math.max(0, 1 - phaseT / T_RE);
    rollerA -= v / (ROLLER_R * S) * dt; lastDir = -1;
    if (s <= 0) { phase = 'DWELL'; phaseT = 0; }
  } else if (phase === 'DWELL') {
    if (phaseT >= T_DW) { phase = 'EXTRUDE'; phaseT = 0; }
  }
}

/* head pose at arc position s */
function headPose() {
  const fidx = s * NSEG;
  const i0 = Math.max(0, Math.min(NSEG - 1, Math.floor(fidx)));
  const fr = Math.max(0, Math.min(1, fidx - i0));
  const a = pts[i0], b = pts[i0 + 1];
  return {
    x: a.x + (b.x - a.x) * fr,
    y: a.y + (b.y - a.y) * fr,
    hd: segs[i0].shd,
    i0
  };
}

/* ---------- drawing ---------- */
const WIRE = '#9fabb8', WIRE_HI = '#e8eef5', WIRE_DK = '#222a33';

function background() {
  const g = ctx.createRadialGradient(W / 2, H * 0.40, 10, W / 2, H * 0.52, Math.max(W, H) * 0.78);
  g.addColorStop(0, '#151a21');
  g.addColorStop(0.55, '#0c0f14');
  g.addColorStop(1, '#04060a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(170,195,220,0.030)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const step = Math.max(20, H * 0.05);
  for (let y = H * 0.60; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function traceWire(i0, fr, offx, offy) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x + offx, pts[0].y + offy);
  for (let i = 1; i <= i0; i++) ctx.lineTo(pts[i].x + offx, pts[i].y + offy);
  if (fr > 0 && i0 < NSEG) {
    const a = pts[i0], b = pts[i0 + 1];
    ctx.lineTo(a.x + (b.x - a.x) * fr + offx, a.y + (b.y - a.y) * fr + offy);
  }
}

function drawWire(pose) {
  const fidx = s * NSEG;
  if (fidx < 0.02) return;
  const i0 = pose.i0, fr = Math.max(0, Math.min(1, fidx - i0));
  const wW = 7 * S;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  /* drop shadow */
  traceWire(i0, fr, 2.5 * S, 4.5 * S);
  ctx.strokeStyle = 'rgba(0,0,0,0.42)'; ctx.lineWidth = wW + 2.5 * S; ctx.stroke();
  /* body */
  traceWire(i0, fr, 0, 0);
  ctx.strokeStyle = WIRE_DK; ctx.lineWidth = wW; ctx.stroke();
  traceWire(i0, fr, 0, 0);
  ctx.strokeStyle = WIRE; ctx.lineWidth = wW - 2 * S; ctx.stroke();
  /* ruler ticks */
  ctx.strokeStyle = 'rgba(22,28,36,0.9)'; ctx.lineWidth = 1.3 * S;
  ctx.beginPath();
  for (let i = 8; i <= i0; i += 8) {
    const p = pts[i], hd = segs[i].shd;
    const nx = -Math.sin(hd), ny = Math.cos(hd), t = wW * 0.5 + 2 * S;
    ctx.moveTo(p.x - nx * t, p.y - ny * t);
    ctx.lineTo(p.x + nx * t, p.y + ny * t);
  }
  ctx.stroke();
  /* top highlight, offset toward the light */
  ctx.beginPath();
  const ho = -wW * 0.17;
  const put = (x, y, i) => {
    const hd = segs[Math.max(0, Math.min(NSEG - 1, i))].shd;
    ctx.lineTo(x - Math.sin(hd) * ho, y + Math.cos(hd) * ho);
  };
  ctx.moveTo(pts[0].x - Math.sin(segs[0].shd) * ho, pts[0].y + Math.cos(segs[0].shd) * ho);
  for (let i = 1; i <= i0; i++) put(pts[i].x, pts[i].y, i);
  if (fr > 0 && i0 < NSEG) {
    const a = pts[i0], b = pts[i0 + 1];
    put(a.x + (b.x - a.x) * fr, a.y + (b.y - a.y) * fr, i0);
  }
  ctx.strokeStyle = WIRE_HI; ctx.lineWidth = 1.7 * S; ctx.stroke();
  /* live tip: bridge the vibrating head to the laid wire */
  return { x: pose.x, y: pose.y };
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHead(pose) {
  const feeding = (phase === 'EXTRUDE' || phase === 'RETRACT');
  let vx = 0, vy = 0;
  if (feeding) { /* machine vibration, perpendicular to travel */
    const v = (Math.sin(clock * 296) * 0.9 + Math.sin(clock * 171 + 1.3) * 0.55) * S;
    vx = -Math.sin(pose.hd) * v; vy = Math.cos(pose.hd) * v;
  }
  /* live tip segment from laid wire to the vibrating nose */
  ctx.strokeStyle = WIRE; ctx.lineWidth = 5 * S; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(pose.x, pose.y); ctx.lineTo(pose.x + vx, pose.y + vy); ctx.stroke();

  ctx.save();
  ctx.translate(pose.x + vx, pose.y + vy);
  ctx.rotate(pose.hd);
  ctx.scale(1.28, 1.28); /* head reads at composition scale */

  /* steel snout */
  ctx.fillStyle = '#878d96'; ctx.strokeStyle = '#33373d'; ctx.lineWidth = 1.4 * S;
  ctx.beginPath();
  ctx.moveTo(-14 * S, -8 * S); ctx.lineTo(-2 * S, -4.5 * S);
  ctx.lineTo(-2 * S, 4.5 * S); ctx.lineTo(-14 * S, 8 * S);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  /* clamp jaws at the nose tip, straddling the wire: visibly pinch during CLAMP */
  const clampK = phase === 'CLAMP' ? Math.min(1, phaseT / 0.25) : 0;
  const gap = (10 - 7.5 * clampK) * S;
  ctx.fillStyle = '#aeb4bc'; ctx.strokeStyle = '#2c3036'; ctx.lineWidth = 1.2 * S;
  for (const sgn of [-1, 1]) {
    const jy = sgn * (gap / 2 + 2.5 * S);
    rr(-8 * S, jy - 2.5 * S, 7.5 * S, 5 * S, 1.2 * S);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(40,44,50,0.8)'; ctx.lineWidth = 1 * S;
    ctx.beginPath(); ctx.moveTo(-8 * S, jy); ctx.lineTo(-0.5 * S, jy); ctx.stroke();
    ctx.strokeStyle = '#2c3036'; ctx.lineWidth = 1.2 * S;
  }

  /* housing: safety orange, rounded */
  const hx = -56 * S, hw = 44 * S, hh = 32 * S;
  rr(hx, -hh / 2, hw, hh, 9 * S);
  ctx.fillStyle = '#ff6a1a'; ctx.fill();
  ctx.strokeStyle = '#7a2e08'; ctx.lineWidth = 2 * S; ctx.stroke();
  rr(hx + 3 * S, -hh / 2 + 3 * S, hw - 6 * S, 8 * S, 4 * S);
  ctx.fillStyle = 'rgba(255,150,70,0.55)'; ctx.fill();

  /* roller bay + two feed rollers */
  rr(hx + 8 * S, -hh / 2 - 9 * S, 28 * S, 12 * S, 5 * S);
  ctx.fillStyle = '#1c1e22'; ctx.fill();
  ctx.strokeStyle = '#0c0d0f'; ctx.lineWidth = 1.4 * S; ctx.stroke();
  for (const cx of [hx + 17 * S, hx + 27 * S]) {
    const cy = -hh / 2 - 3 * S, rad = 6.4 * S;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = '#2e3238'; ctx.fill();
    ctx.strokeStyle = '#0e0f11'; ctx.lineWidth = 1.6 * S; ctx.stroke();
    ctx.strokeStyle = 'rgba(220,225,232,0.75)'; ctx.lineWidth = 1.5 * S;
    for (let k = 0; k < 3; k++) {
      const a = rollerA + k * Math.PI * 2 / 3;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * rad * 0.85, cy + Math.sin(a) * rad * 0.85);
      ctx.stroke();
    }
  }

  /* direction arrow: travel direction, flips on reversal */
  ctx.fillStyle = '#3d1c07';
  const ay = 6 * S, ax = hx + 22 * S, dir = lastDir;
  ctx.beginPath();
  ctx.moveTo(ax + dir * 9 * S, ay);
  ctx.lineTo(ax - dir * 2 * S, ay - 5 * S);
  ctx.lineTo(ax - dir * 2 * S, ay + 5 * S);
  ctx.closePath(); ctx.fill();

  /* status LED */
  const led = phase === 'CLAMP' ? '#ffb020' : (feeding ? '#39d353' : '#1f2a22');
  ctx.beginPath(); ctx.arc(hx + 6 * S, -hh / 2 + 7 * S, 2.6 * S, 0, Math.PI * 2);
  ctx.fillStyle = led; ctx.fill();

  /* housing bolts */
  ctx.fillStyle = 'rgba(90,32,8,0.9)';
  for (const [bx, by] of [[hx + 5 * S, -hh / 2 + 5 * S], [hx + hw - 5 * S, -hh / 2 + 5 * S],
                          [hx + 5 * S, hh / 2 - 5 * S], [hx + hw - 5 * S, hh / 2 - 5 * S]]) {
    ctx.beginPath(); ctx.arc(bx, by, 1.8 * S, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function hud(pose) {
  const fs = Math.max(10, 11.5 * S);
  ctx.font = fs + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.textBaseline = 'top';
  const x = 16 * S, y = 14 * S, lh = fs * 1.55;
  const feedMM = (s * NSEG * 2.4).toFixed(1);
  let turns = 0;
  for (let i = 0; i <= pose.i0; i++) if (Math.abs(deltas[i]) > BEND_THRESH) turns++;
  const dth = (deltas[Math.min(NSEG - 1, pose.i0)] * 180 / Math.PI);
  const dths = (dth >= 0 ? '+' : '') + dth.toFixed(1);
  const lines = [
    ['WB-9060  WIRE BENDER', 0.95],
    ['FEED   ' + feedMM + ' MM', 0.8],
    ['TURNS  ' + String(turns).padStart(3, '0'), 0.8],
    ['DTHETA ' + dths + ' DEG', 0.8],
    ['MODE   ' + phase, 0.8]
  ];
  lines.forEach(([txt, a], i) => {
    ctx.fillStyle = 'rgba(186,208,226,' + a + ')';
    ctx.fillText(txt, x, y + i * lh);
  });
  if (phase === 'CLAMP' && Math.floor(clock * 6) % 2 === 0) {
    ctx.fillStyle = 'rgba(255,176,32,0.95)';
    ctx.fillText('> CLAMP ENGAGED', x, y + lines.length * lh);
  }
}

/* ---------- main loop ---------- */
let last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
  last = now;
  update(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  background();
  const pose = headPose();
  drawWire(pose);
  drawHead(pose);
  hud(pose);
  requestAnimationFrame(frame);
}

canvas.addEventListener('pointerdown', () => {
  seed = (Math.random() * 1e9) | 0;
  buildHistory(); fit();
  phase = 'EXTRUDE'; phaseT = 0; s = 0;
});

/* probe for QA captures */
window.__probe = {
  get phase() { return phase; },
  get s() { return s; }
};

buildHistory();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
