<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#04070a">
<title>Spectrogram, No. 8926</title>
<style>
  :root{
    --bg:#04070a; --phos:#8dffb4; --phos-dim:rgba(141,255,180,.42);
    --phos-faint:rgba(141,255,180,.16); --ink:#d9ffe6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
    user-select:none; -webkit-user-select:none;
  }
  header{padding:14px 20px 8px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
  .kicker{font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--phos-dim);}
  h1{font-size:21px; font-weight:600; margin:0; letter-spacing:.02em; color:#eafff2;}
  .sub{font-size:11.5px; color:var(--phos-dim); margin-left:auto;}
  #stage{position:relative; flex:1 1 auto; min-height:0; margin:0 12px; border:1px solid rgba(141,255,180,.14); border-radius:8px; overflow:hidden;}
  #cv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair;}
  footer{
    padding:10px 20px calc(12px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  button{
    font-family:inherit; font-size:13px; letter-spacing:.04em;
    background:transparent; color:var(--phos);
    border:1px solid rgba(141,255,180,.35); border-radius:20px;
    padding:7px 16px; cursor:pointer; transition:background .15s,color .15s;
  }
  button:hover{background:rgba(141,255,180,.10);}
  button[aria-pressed="true"]{background:var(--phos); color:#04140a; border-color:var(--phos); font-weight:600;}
  #btnSound{min-width:118px;}
  #seedLabel{font-size:11.5px; color:var(--phos-dim); letter-spacing:.06em;}
  .hint{margin-left:auto; font-size:11px; color:var(--phos-faint); letter-spacing:.04em;}
  @media (max-width:560px){
    header{padding:10px 14px 6px; gap:8px;}
    h1{font-size:17px;}
    .sub{display:none;}
    #stage{margin:0 8px;}
    footer{padding:8px 12px calc(10px + env(safe-area-inset-bottom)); gap:8px;}
    button{font-size:12px; padding:7px 13px;}
    .hint{display:none;}
  }
</style>
</head>
<body>
<header>
  <div class="kicker">generative doodles : an interactive instrument</div>
  <h1>Spectrogram, No. 8926</h1>
  <div class="sub">draw - the drawing is the score</div>
</header>
<div id="stage"><canvas id="cv"></canvas></div>
<footer>
  <button id="btnSound" aria-pressed="false">sound off</button>
  <button id="btnNew">new score</button>
  <button id="btnEraser" aria-pressed="false">eraser</button>
  <button id="btnClear">clear</button>
  <span id="seedLabel"></span>
  <span class="hint">draw with finger or mouse : x is time, y is pitch, brightness is loudness</span>
</footer>
<script>
"use strict";
/* Spectrogram, No. 8926.
   A drawing that plays itself: x is time, y is pitch, brightness is loudness.
   A playhead loops left to right; each column's drawn pixels become voices in
   a WebAudio oscillator bank. Pitch is log-mapped and quantized to an A minor
   pentatonic across three octaves (A2..A5). */

/* ---------- seeded rng ---------- */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

/* ---------- score model ---------- */
var COLS=144, ROWS=192;            // time columns x pitch rows (source of truth)
var grid=new Float32Array(COLS*ROWS);
var NOTES=16;                       // 16 pentatonic degrees, A2..A5
var PENT=[0,3,5,7,10];
var BASE=110;                       // A2
var NOTENAMES=["A","C","D","E","G"];
var noteFreq=[], noteName=[];
(function(){
  for(var n=0;n<NOTES;n++){
    var oct=(n/5)|0, deg=PENT[n%5];
    noteFreq.push(BASE*Math.pow(2,(oct*12+deg)/12));
    noteName.push(NOTENAMES[n%5]+(NOTENAMES[n%5]==="A"?(2+oct):""));
  }
})();
function noteOfY01(y01){ // y01: 0 bottom (low) .. 1 top (high)
  var n=Math.floor(y01*NOTES);
  return n<0?0:(n>=NOTES?NOTES-1:n);
}

/* ---------- dom ---------- */
var stage=document.getElementById("stage");
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var btnSound=document.getElementById("btnSound");
var btnNew=document.getElementById("btnNew");
var btnEraser=document.getElementById("btnEraser");
var btnClear=document.getElementById("btnClear");
var seedLabel=document.getElementById("seedLabel");

/* offscreen: crisp score + soft glow, both rebuilt from grid on resize */
var scoreC=document.createElement("canvas"), glowC=document.createElement("canvas");
var sctx=scoreC.getContext("2d"), gctx=glowC.getContext("2d");
var W=0,H=0,DPR=1;

function stampGrid(gx,gy,r,amt){
  var x0=Math.max(0,Math.floor(gx-r)), x1=Math.min(COLS-1,Math.ceil(gx+r));
  var y0=Math.max(0,Math.floor(gy-r)), y1=Math.min(ROWS-1,Math.ceil(gy+r));
  for(var y=y0;y<=y1;y++){
    for(var x=x0;x<=x1;x++){
      var dx=(x-gx)/r, dy=(y-gy)/r, d2=dx*dx+dy*dy;
      if(d2>1) continue;
      var i=y*COLS+x, w=(1-d2);
      var v=grid[i]+amt*w*w;
      grid[i]=v>1?1:(v<0?0:v);
    }
  }
}
function paintPolyline(pts,erase,widthPx){
  // paint the whole polyline as ONE path per layer (avoids beading at joints)
  var pass=[
    {c:sctx, w:widthPx,      style:"rgba(196,255,220,0.95)"},
    {c:gctx, w:widthPx*2.6,  style:"rgba(96,255,165,0.30)"}
  ];
  for(var k=0;k<pass.length;k++){
    var c=pass[k].c;
    c.save();
    if(erase) c.globalCompositeOperation="destination-out";
    c.strokeStyle=pass[k].style;
    c.lineWidth=pass[k].w;
    c.lineCap="round"; c.lineJoin="round";
    c.beginPath();
    c.moveTo(pts[0][0],pts[0][1]);
    for(var i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]);
    c.stroke();
    c.restore();
  }
  // update the score grid along every segment
  var r=(widthPx*(erase?1.5:1)/2)/(W/COLS);
  for(var s=1;s<pts.length;s++){
    var gx0=pts[s-1][0]/W*COLS, gy0=(1-pts[s-1][1]/H)*ROWS;
    var gx1=pts[s][0]/W*COLS, gy1=(1-pts[s][1]/H)*ROWS;
    var dx=gx1-gx0, dy=gy1-gy0;
    var dist=Math.sqrt(dx*dx+dy*dy), steps=Math.max(1,Math.ceil(dist/Math.max(0.5,r*0.5)));
    for(var q=0;q<=steps;q++){
      stampGrid(gx0+dx*q/steps, gy0+dy*q/steps, r, erase?-0.85:0.55);
    }
  }
}
function paintSegment(x0,y0,x1,y1,erase,widthPx){
  paintPolyline([[x0,y0],[x1,y1]],erase,widthPx);
}
function clearScore(){
  grid.fill(0);
  sctx.clearRect(0,0,scoreC.width,scoreC.height);
  gctx.clearRect(0,0,glowC.width,glowC.height);
}
function renderGridToCanvases(){
  // rebuild both offscreen layers from the grid (used on resize)
  sctx.clearRect(0,0,scoreC.width,scoreC.height);
  gctx.clearRect(0,0,glowC.width,glowC.height);
  var cw=scoreC.width/COLS, ch=scoreC.height/ROWS;
  for(var y=0;y<ROWS;y++){
    for(var x=0;x<COLS;x++){
      var e=grid[y*COLS+x];
      if(e<0.04) continue;
      var px=x*cw, py=y*ch;
      sctx.fillStyle="rgba(196,255,220,"+(0.95*e).toFixed(3)+")";
      sctx.fillRect(px,py,cw+0.5,ch+0.5);
      gctx.fillStyle="rgba(96,255,165,"+(0.30*e).toFixed(3)+")";
      var pad=Math.max(2,cw*0.9);
      gctx.fillRect(px-pad,py-pad,cw+0.5+pad*2,ch+0.5+pad*2);
    }
  }
}
function resize(){
  var r=stage.getBoundingClientRect();
  W=Math.max(50,r.width); H=Math.max(50,r.height);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  scoreC.width=Math.round(W*DPR); scoreC.height=Math.round(H*DPR);
  glowC.width=Math.round(W*DPR); glowC.height=Math.round(H*DPR);
  renderGridToCanvases();
}
window.addEventListener("resize",resize);

/* ---------- generative demo composition ---------- */
var DEFAULT_SEED=8926;
var curSeed=DEFAULT_SEED;
function compose(seed){
  clearScore();
  var rng=mulberry32(seed);
  var X=function(p){return p*W;}, Y=function(p){return (1-p)*H;};
  function stroke(pts,w){
    if(pts.length>1) paintPolyline(pts,false,w);
  }
  function snap(p){ return Math.min(0.98,Math.max(0.02,((Math.floor(p*NOTES)+0.5)/NOTES))); }
  var wBase=5.5+rng()*3;

  // 1. signature: ascending glissando diagonal, bottom-left to top-right
  var ph=rng()*6.28, pts=[];
  for(var i=0;i<=60;i++){
    var t=i/60, p=t*0.84+0.08+0.018*Math.sin(t*9+ph);
    pts.push([X(0.03+t*0.94), Y(p)]);
  }
  stroke(pts,wBase);

  // 2. arpeggio staircase
  var steps=7+((rng()*4)|0), sx0=0.08+rng()*0.1, sx1=0.88-rng()*0.08;
  var lo=0.12+rng()*0.1, hi=0.78+rng()*0.1;
  var px=X(sx0), py=Y(snap(lo)), st=[];
  for(var s2=1;s2<=steps;s2++){
    var nx=X(sx0+(sx1-sx0)*s2/steps), ny=Y(snap(lo+(hi-lo)*s2/steps));
    st.push([px,py],[nx,py],[nx,ny]);
    px=nx; py=ny;
  }
  stroke(st,wBase*0.9);

  // 3. chord stacks: a few tall vertical sonorities
  var nch=2+((rng()*2)|0);
  for(var c=0;c<nch;c++){
    var cx=0.12+rng()*0.76, nN=3+((rng()*2)|0), baseN=(rng()*10)|0;
    var top=0,bottom=1;
    for(var q=0;q<nN;q++){
      var nn=Math.min(15,baseN+q*2+((rng()*2)|0));
      var pp=snap((nn+0.5)/NOTES);
      if(pp>top)top=pp; if(pp<bottom)bottom=pp;
    }
    stroke([[X(cx),Y(top)],[X(cx),Y(bottom)]],wBase*1.15);
  }

  // 4. one lyrical line: a melody arc OR a descending answer, never both
  if(rng()<0.5){
    var cyc=1+((rng()*2)|0), amp=0.14+rng()*0.12, ph2=rng()*6.28, mpts=[];
    for(var m=0;m<=70;m++){
      var tm=m/70;
      mpts.push([X(0.05+tm*0.9), Y(0.5+amp*Math.sin(tm*cyc*6.283+ph2))]);
    }
    stroke(mpts,wBase*0.85);
  }else{
    var dpts=[], dph=rng()*6.28;
    for(var d=0;d<=50;d++){
      var td=d/50;
      dpts.push([X(0.05+td*0.9), Y(0.88-td*0.72+0.015*Math.sin(td*8+dph))]);
    }
    stroke(dpts,wBase*0.8);
  }

  // 5. bass line
  var bpts=[], bph=rng()*6.28;
  for(var b=0;b<=50;b++){
    var tb=b/50;
    bpts.push([X(0.04+tb*0.92), Y(0.05+0.03*Math.sin(tb*7+bph))]);
  }
  stroke(bpts,wBase*1.0);

  // 6. sparse high sparkles
  var nsp=3+((rng()*4)|0);
  for(var sp=0;sp<nsp;sp++){
    var spx=0.06+rng()*0.88, spy=0.74+rng()*0.20, len=0.02+rng()*0.04;
    var dir=rng()*6.28;
    stroke([[X(spx),Y(spy)],[X(spx+Math.cos(dir)*len),Y(Math.min(0.97,spy+Math.sin(dir)*len*0.6))]],wBase*0.7);
  }
  curSeed=seed;
  seedLabel.textContent="score № "+seed;
}

/* ---------- pointer drawing ---------- */
var drawing=false, erasing=false, lastX=0, lastY=0, everSoundGesture=false;
cv.addEventListener("contextmenu",function(e){e.preventDefault();});
cv.addEventListener("pointerdown",function(e){
  if(!everSoundGesture){ everSoundGesture=true; setSound(true); }
  drawing=true; erasing=btnEraser.getAttribute("aria-pressed")==="true";
  var r=cv.getBoundingClientRect();
  lastX=e.clientX-r.left; lastY=e.clientY-r.top;
  paintSegment(lastX,lastY,lastX+0.01,lastY,erasing,erasing?26:10);
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(!drawing) return;
  var r=cv.getBoundingClientRect();
  var x=e.clientX-r.left, y=e.clientY-r.top;
  paintSegment(lastX,lastY,x,y,erasing,erasing?26:10);
  lastX=x; lastY=y;
  e.preventDefault();
});
function endStroke(){ drawing=false; }
cv.addEventListener("pointerup",endStroke);
cv.addEventListener("pointercancel",endStroke);

/* ---------- audio engine ---------- */
var AC=null, master=null, voiceBus=null, voices=[], soundOn=false;
var NV=24;
function ensureAudio(){
  if(AC) return true;
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return false;
    AC=new Ctx();
    master=AC.createGain(); master.gain.value=0.7;
    var comp=AC.createDynamicsCompressor();
    comp.threshold.value=-18; comp.ratio.value=6; comp.attack.value=0.004; comp.release.value=0.2;
    master.connect(comp); comp.connect(AC.destination);
    // a breath of space: short feedback delay
    var delay=AC.createDelay(1.0); delay.delayTime.value=0.27;
    var fb=AC.createGain(); fb.gain.value=0.3;
    var wet=AC.createGain(); wet.gain.value=0.16;
    voiceBus=AC.createGain(); voiceBus.gain.value=1.0;
    voiceBus.connect(master);
    voiceBus.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
    var lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3400; lp.Q.value=0.4;
    // route voices through the lowpass into the bus
    voiceBus.disconnect();
    voiceBus.connect(lp); lp.connect(master);
    voiceBus.connect(delay);
    for(var i=0;i<NV;i++){
      var o=AC.createOscillator(); o.type="triangle"; o.frequency.value=110;
      var g=AC.createGain(); g.gain.value=0;
      o.connect(g); g.connect(voiceBus); o.start();
      voices.push({osc:o,gain:g});
    }
    return true;
  }catch(err){ AC=null; return false; }
}
function setSound(on){
  soundOn=on;
  btnSound.setAttribute("aria-pressed",on?"true":"false");
  btnSound.textContent=on?"sound on":"sound off";
  if(on){
    if(!ensureAudio()){ // no audio support: revert the toggle
      soundOn=false;
      btnSound.setAttribute("aria-pressed","false");
      btnSound.textContent="sound off";
      return;
    }
    if(AC.state==="suspended"){ AC.resume().catch(function(){}); }
  }else if(AC){
    var t=AC.currentTime;
    for(var i=0;i<voices.length;i++) voices[i].gain.gain.setTargetAtTime(0,t,0.03);
  }
}
btnSound.addEventListener("click",function(){ setSound(!soundOn); });
btnNew.addEventListener("click",function(){
  var s=1000+((Math.random()*90000)|0);
  compose(s);
});
btnEraser.addEventListener("click",function(){
  var on=btnEraser.getAttribute("aria-pressed")!=="true";
  btnEraser.setAttribute("aria-pressed",on?"true":"false");
});
btnClear.addEventListener("click",function(){ clearScore(); seedLabel.textContent="blank score"; });

document.addEventListener("visibilitychange",function(){
  if(document.hidden && AC && soundOn){
    var t=AC.currentTime;
    for(var i=0;i<voices.length;i++) voices[i].gain.gain.setTargetAtTime(0,t,0.02);
  }
});

/* ---------- playback ---------- */
var LOOP_MS=4000, t0=performance.now();
var noteEnergy=new Float32Array(NOTES);
var activeNotes=[];
function columnNotes(col){
  activeNotes.length=0;
  var band=ROWS/NOTES; // 12
  for(var n=0;n<NOTES;n++){
    var e=0;
    // n=0 is the lowest note: bottom rows
    var yA=(NOTES-1-n)*band, yB=yA+band;
    for(var y=yA;y<yB;y++){
      var v=grid[y*COLS+col];
      if(v>e) e=v;
    }
    noteEnergy[n]=e;
    if(e>0.03) activeNotes.push(n);
  }
  activeNotes.sort(function(a,b){return noteEnergy[b]-noteEnergy[a];});
  return activeNotes;
}
function tick(){
  var frac=(((performance.now()-t0)%LOOP_MS)+LOOP_MS)%LOOP_MS/LOOP_MS;
  var col=Math.min(COLS-1,Math.floor(frac*COLS));
  var notes=columnNotes(col);

  if(soundOn && AC){
    var t=AC.currentTime;
    for(var i=0;i<NV;i++){
      var v=voices[i];
      if(i<notes.length){
        var n=notes[i];
        v.osc.frequency.setTargetAtTime(noteFreq[n],t,0.02);
        v.gain.gain.setTargetAtTime(0.12*Math.pow(noteEnergy[n],1.15),t,0.025);
      }else{
        v.gain.gain.setTargetAtTime(0,t,0.025);
      }
    }
  }
  draw(frac,col,notes);
  requestAnimationFrame(tick);
}

/* ---------- frame render ---------- */
function draw(frac,col,notes){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // backdrop: faint note bands + octave lines
  ctx.fillStyle="rgba(4,7,10,1)";
  ctx.fillRect(0,0,W,H);
  for(var n=0;n<=NOTES;n++){
    var y=H-(n/NOTES)*H;
    var isOct=(n%5===0);
    ctx.strokeStyle=isOct?"rgba(141,255,180,0.13)":"rgba(141,255,180,0.045)";
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(W,y+0.5); ctx.stroke();
  }
  // layers
  ctx.drawImage(glowC,0,0,W,H);
  ctx.drawImage(scoreC,0,0,W,H);
  // pitch ruler, left edge
  ctx.font="10px ui-monospace,Menlo,Consolas,monospace";
  ctx.textBaseline="middle";
  for(var n2=0;n2<NOTES;n2++){
    var yn=H-((n2+0.5)/NOTES)*H;
    ctx.fillStyle="rgba(141,255,180,0.40)";
    ctx.fillText(noteName[n2],6,yn);
  }
  // playhead
  var px=((col+0.5)/COLS)*W;
  ctx.fillStyle="rgba(141,255,180,0.06)";
  ctx.fillRect(px-7,0,14,H);
  ctx.strokeStyle="rgba(234,255,242,0.85)";
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,H); ctx.stroke();
  // sounding notes glow on the playhead
  for(var i=0;i<notes.length;i++){
    var nn=notes[i], e=noteEnergy[nn];
    var ny=H-((nn+0.5)/NOTES)*H;
    var r=2.5+4.5*e;
    var gr=ctx.createRadialGradient(px,ny,0,px,ny,r*2.4);
    gr.addColorStop(0,"rgba(234,255,242,"+(0.55+0.45*e).toFixed(2)+")");
    gr.addColorStop(1,"rgba(141,255,180,0)");
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(px,ny,r*2.4,0,6.2832); ctx.fill();
  }
}

/* ---------- boot ---------- */
resize();
compose(DEFAULT_SEED);
requestAnimationFrame(tick);

/* debug hook for headless smoke tests */
window.__spectrogram={
  debug:function(){
    var mg=0;
    for(var i=0;i<voices.length;i++){var v=voices[i].gain.gain.value; if(v>mg)mg=v;}
    return {seed:curSeed, soundOn:soundOn,
      ctxState:AC?AC.state:"none", voices:voices.length, maxGain:mg,
      gridMax:(function(){var m=0;for(var i=0;i<grid.length;i++)if(grid[i]>m)m=grid[i];return m;})()};
  },
  setSound:setSound, compose:compose
};
</script>
</body>
</html>
