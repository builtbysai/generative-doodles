<!DOCTYPE html>
<html lang="UTF-8">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8923 Two Keys</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14120d; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// 8923 Two Keys — after Vallotton and Denis: the same tree composed twice,
// once in the committed black key and once in the committed white key.
// No middle gray. The pair is the argument. Click for another tree.
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromURL() {
  const m = /[?&]seed=(\d+)/.exec(location.search);
  return m ? parseInt(m[1], 10) >>> 0 : 892301;
}
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, seed = seedFromURL();

const BLACK = "#191411", WHITE = "#F4EFE2", BONE = "#EFE6D2";

function draw(s) {
  const rnd = mulberry32(s);
  const gap = Math.max(6, W * 0.008);
  const pw = (W - gap) / 2, ph = H;

  // One shared skeleton so both panels show the same tree.
  const tx = pw * (0.38 + rnd() * 0.24);
  const baseY = ph * (0.86 + rnd() * 0.04);
  const trunkH = ph * (0.42 + rnd() * 0.14);
  const trunkW = pw * (0.035 + rnd() * 0.02);
  const blobs = [];
  const nB = 6 + Math.floor(rnd() * 4);
  for (let i = 0; i < nB; i++) {
    blobs.push({
      x: tx + (rnd() - 0.5) * pw * 0.42,
      y: baseY - trunkH * (0.55 + rnd() * 0.5),
      r: pw * (0.10 + rnd() * 0.10),
    });
  }
  const lean = (rnd() - 0.5) * pw * 0.06;

  // BLACK KEY: solid black ground, the tree as white reserve, one white
  // hatched band doing the work light would do.
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, pw, ph); ctx.clip();
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, pw, ph);
  // The light device: diagonal white hatching across the upper panel.
  ctx.strokeStyle = BONE; ctx.lineWidth = Math.max(1.5, pw * 0.004);
  ctx.globalAlpha = 0.85;
  const hy = ph * (0.10 + rnd() * 0.12);
  for (let d = -ph; d < pw + ph; d += pw * 0.045) {
    ctx.beginPath();
    ctx.moveTo(d, hy - ph * 0.10);
    ctx.lineTo(d + ph * 0.28, hy + ph * 0.10);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // The tree as reserve.
  ctx.fillStyle = BONE;
  ctx.beginPath();
  ctx.moveTo(tx - trunkW / 2, baseY);
  ctx.quadraticCurveTo(tx - trunkW / 2 + lean * 0.4, baseY - trunkH / 2, tx + lean - trunkW * 0.32, baseY - trunkH);
  ctx.lineTo(tx + lean + trunkW * 0.32, baseY - trunkH);
  ctx.quadraticCurveTo(tx + trunkW / 2 + lean * 0.4, baseY - trunkH / 2, tx + trunkW / 2, baseY);
  ctx.closePath(); ctx.fill();
  for (const b of blobs) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  }
  // White grass ticks at the base.
  ctx.strokeStyle = BONE; ctx.lineWidth = Math.max(1.5, pw * 0.005);
  for (let i = 0; i < 14; i++) {
    const gx = tx + (rnd() - 0.5) * pw * 0.5;
    const gh = ph * (0.02 + rnd() * 0.035);
    ctx.beginPath(); ctx.moveTo(gx, baseY); ctx.lineTo(gx + (rnd() - 0.5) * 8, baseY - gh); ctx.stroke();
  }
  ctx.restore();

  // WHITE KEY: near-white ground, the tree dissolved to a breath.
  ctx.save();
  ctx.beginPath(); ctx.rect(pw + gap, 0, pw, ph); ctx.clip();
  ctx.fillStyle = WHITE;
  ctx.fillRect(pw + gap, 0, pw, ph);
  const ox = pw + gap;
  // Canopy as overlapping translucent washes.
  for (const b of blobs) {
    for (let k = 0; k < 3; k++) {
      ctx.fillStyle = "rgba(90,85,75," + (0.10 + rnd() * 0.08) + ")";
      ctx.beginPath();
      ctx.ellipse(ox + b.x + (rnd() - 0.5) * b.r * 0.5, b.y + (rnd() - 0.5) * b.r * 0.5,
                  b.r * (0.85 + rnd() * 0.3), b.r * (0.8 + rnd() * 0.3), rnd() * 3, 0, 7);
      ctx.fill();
    }
  }
  // Trunk as a breath: layered soft strokes.
  for (let k = 0; k < 5; k++) {
    ctx.strokeStyle = "rgba(70,64,55," + (0.16 - k * 0.025) + ")";
    ctx.lineWidth = trunkW * (1.6 - k * 0.22);
    ctx.beginPath();
    ctx.moveTo(ox + tx + (rnd() - 0.5) * 3, baseY);
    ctx.quadraticCurveTo(ox + tx + lean * 0.5, baseY - trunkH / 2, ox + tx + lean, baseY - trunkH);
    ctx.stroke();
  }
  // Sparse specks, the dissolve.
  ctx.fillStyle = "rgba(90,85,75,0.25)";
  for (let i = 0; i < 26; i++) {
    const b = blobs[Math.floor(rnd() * blobs.length)];
    ctx.beginPath();
    ctx.arc(ox + b.x + (rnd() - 0.5) * b.r * 2.4, b.y + (rnd() - 0.5) * b.r * 2.4,
            1 + rnd() * 2.5, 0, 7);
    ctx.fill();
  }
  ctx.restore();
}

function render() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(seed);
}

canvas.addEventListener("click", () => {
  seed = (Math.random() * 0xFFFFFFFF) >>> 0;
  history.replaceState(null, "", "?seed=" + seed);
  render();
});
window.addEventListener("resize", render);
render();
</script>
</body>
</html>
