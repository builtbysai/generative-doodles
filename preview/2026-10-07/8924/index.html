<!DOCTYPE html>
<html lang="UTF-8">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8924 One Tenth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14120d; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// 8924 One Tenth — after Goya's Dog: one vast composed ground filling nearly
// the whole frame, a single small figure pressed against the bottom edge.
// The ratio of figure to ground is the whole composition. Click for another.
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromURL() {
  const m = /[?&]seed=(\d+)/.exec(location.search);
  return m ? parseInt(m[1], 10) >>> 0 : 892401;
}
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, seed = seedFromURL();

// Warm ground families: [field, band, figure]. The field is nearly flat;
// the band is the single composed variation, never a texture.
const GROUNDS = [
  { field: "#C9A86A", band: "#B8945A", figure: "#2A2118" },
  { field: "#C4B393", band: "#AE9C7E", figure: "#241F18" },
  { field: "#D0A075", band: "#B98A5F", figure: "#2B2019" },
  { field: "#BFA77E", band: "#A78F66", figure: "#221D16" },
];

function draw(s) {
  const rnd = mulberry32(s);
  const g = GROUNDS[Math.floor(rnd() * GROUNDS.length)];

  // The vast field.
  ctx.fillStyle = g.field;
  ctx.fillRect(0, 0, W, H);

  // One diagonal band, soft-edged but present: the composed variation.
  const ang = (rnd() - 0.5) * 0.6;
  const bx = W * (0.25 + rnd() * 0.5);
  const bw = Math.min(W, H) * (0.16 + rnd() * 0.12);
  ctx.save();
  ctx.translate(bx, H / 2);
  ctx.rotate(ang);
  const grad = ctx.createLinearGradient(-bw, 0, bw, 0);
  grad.addColorStop(0, g.field);
  grad.addColorStop(0.5, g.band);
  grad.addColorStop(1, g.field);
  ctx.fillStyle = grad;
  ctx.fillRect(-bw, -H, bw * 2, H * 2);
  ctx.restore();

  // A breath of light off-center so the field has a somewhere.
  const lx = W * (0.25 + rnd() * 0.5), ly = H * (0.25 + rnd() * 0.3);
  const lr = Math.min(W, H) * (0.35 + rnd() * 0.2);
  const rg = ctx.createRadialGradient(lx, ly, 0, lx, ly, lr);
  rg.addColorStop(0, "rgba(255,250,235,0.20)");
  rg.addColorStop(1, "rgba(255,250,235,0)");
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  // The incident: a small head pressed against the bottom edge, gazing up.
  // Cranial mass plus a lifted snout; the upward look is the whole pathos.
  const fx = W * (0.32 + rnd() * 0.36);
  const fh = H * (0.115 + rnd() * 0.03);
  const gaze = (rnd() - 0.5) * 0.5;
  ctx.save();
  ctx.translate(fx, H - fh * 0.22);
  ctx.rotate(gaze * 0.4);
  ctx.fillStyle = g.figure;
  // Cranium.
  ctx.beginPath();
  ctx.ellipse(0, 0, fh * 0.42, fh * 0.5, 0, 0, 7);
  ctx.fill();
  // Snout lifting toward the gaze.
  ctx.save();
  ctx.rotate(-0.5 + gaze);
  ctx.beginPath();
  ctx.ellipse(fh * 0.18, -fh * 0.32, fh * 0.30, fh * 0.17, 0, 0, 7);
  ctx.fill();
  ctx.restore();
  // One eye, dark on dark, just barely there.
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.beginPath();
  ctx.arc(-fh * 0.10, -fh * 0.10, fh * 0.045, 0, 7);
  ctx.fill();
  ctx.restore();
}

function render() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(seed);
}

canvas.addEventListener("click", () => {
  seed = (Math.random() * 0xFFFFFFFF) >>> 0;
  history.replaceState(null, "", "?seed=" + seed);
  render();
});
window.addEventListener("resize", render);
render();
</script>
</body>
</html>
