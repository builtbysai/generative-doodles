<!DOCTYPE html>
<html lang="UTF-8">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9061 Wrong Sky</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14120d; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// 9061 Wrong Sky — after the Nabi color lithographs: flat unmodeled color
// zones laid first in deliberately wrong hues, the drawing a guest confined
// to zones, one accent color used exactly once. Click for a new street.
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromURL() {
  const m = /[?&]seed=(\d+)/.exec(location.search);
  return m ? parseInt(m[1], 10) >>> 0 : 906101;
}
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, seed = seedFromURL();

// Wrong-hue Nabi palettes: [sky, midA, midB, ground, dark, light].
// The sky is never blue. Vermilion is rationed to exactly one mark.
const PALETTES = [
  { sky: "#E3A82B", midA: "#7A8B6F", midB: "#9B7EBD", ground: "#3E5C4B", dark: "#2B2620", light: "#F2E3C2" },
  { sky: "#C96F4A", midA: "#5F7A6B", midB: "#D9C27A", ground: "#4A3B52", dark: "#241F1A", light: "#F5E9D0" },
  { sky: "#8FA3B8", midA: "#C2B280", midB: "#A85B3F", ground: "#5C6650", dark: "#20241F", light: "#EFE6CC" },
  { sky: "#D97B8F", midA: "#6B7A4F", midB: "#3F6B7A", ground: "#7A5B3F", dark: "#26211C", light: "#F0DFC0" },
];
const ACCENT = "#D93A1E";

function draw(s) {
  const rnd = mulberry32(s);
  const pal = PALETTES[Math.floor(rnd() * PALETTES.length)];
  const zoneCols = [pal.sky, pal.midA, pal.midB, pal.ground];

  // Zone layout: sky band, mid band split in two or three, foreground band.
  const horizon = H * (0.34 + rnd() * 0.16);
  const foreTop = H * (0.72 + rnd() * 0.10);
  const cuts = [];
  const nMid = 2 + Math.floor(rnd() * 2);
  let x = 0;
  for (let i = 0; i < nMid - 1; i++) {
    x += W * (0.22 + rnd() * 0.28);
    if (x < W * 0.92) cuts.push(x);
  }
  cuts.push(W);

  // Lay the flat zones first.
  ctx.fillStyle = pal.sky;
  ctx.fillRect(0, 0, W, horizon);
  let zx = 0, zi = 1;
  const midZones = [];
  for (const cx of cuts) {
    ctx.fillStyle = zoneCols[zi % zoneCols.length];
    ctx.fillRect(zx, horizon, cx - zx, foreTop - horizon);
    midZones.push([zx, cx]);
    zx = cx; zi++;
  }
  ctx.fillStyle = pal.ground;
  ctx.fillRect(0, foreTop, W, H - foreTop);

  // The drawing is a guest: simple flat shapes, each clipped to its zone.
  // Collect the painters first, then deal the single accent mark to exactly
  // one of them (never the sun, which stays light).
  const guests = [];
  const clipZone = (x0, x1, y0, y1, fn) => {
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    fn();
    ctx.restore();
  };

  // Sky guest: flat sun disc.
  clipZone(0, W, 0, horizon, () => {
    ctx.fillStyle = pal.light;
    const sx = W * (0.12 + rnd() * 0.76), sr = Math.min(W, H) * (0.05 + rnd() * 0.045);
    ctx.beginPath(); ctx.arc(sx, horizon * (0.25 + rnd() * 0.4), sr, 0, 7); ctx.fill();
  });

  // Sky guest: small flat birds.
  if (rnd() < 0.75) {
    const bx0 = W * (0.1 + rnd() * 0.8), by0 = horizon * (0.15 + rnd() * 0.5);
    const bn = 2 + Math.floor(rnd() * 3), br0 = 6 + rnd() * 10;
    guests.push((c) => clipZone(0, W, 0, horizon, () => {
      ctx.strokeStyle = c; ctx.lineWidth = Math.max(2, W * 0.003);
      for (let i = 0; i < bn; i++) {
        const bx = bx0 + (rnd() - 0.5) * W * 0.2, by = by0 + (rnd() - 0.5) * horizon * 0.2;
        ctx.beginPath(); ctx.arc(bx - br0 * 0.5, by, br0 * 0.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
        ctx.beginPath(); ctx.arc(bx + br0 * 0.5, by, br0 * 0.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      }
    }));
  }

  // Mid guests: one house or tree per mid zone, clipped to its zone.
  for (const [z0, z1] of midZones) {
    const zw = z1 - z0, zcx = z0 + zw / 2;
    if (rnd() < 0.7) {
      const hx = zcx + (rnd() - 0.5) * zw * 0.3;
      const hw = zw * (0.28 + rnd() * 0.22), hh = (foreTop - horizon) * (0.4 + rnd() * 0.3);
      const hy = foreTop - hh;
      guests.push((c) => clipZone(z0, z1, horizon, foreTop, () => {
        ctx.fillStyle = c;
        ctx.fillRect(hx - hw / 2, hy, hw, hh);
        ctx.beginPath();
        ctx.moveTo(hx - hw / 2 - hw * 0.08, hy);
        ctx.lineTo(hx, hy - hh * 0.45);
        ctx.lineTo(hx + hw / 2 + hw * 0.08, hy);
        ctx.closePath(); ctx.fill();
      }));
    } else {
      const tx = zcx + (rnd() - 0.5) * zw * 0.3;
      const th = (foreTop - horizon) * (0.5 + rnd() * 0.35);
      guests.push((c) => clipZone(z0, z1, horizon, foreTop, () => {
        ctx.fillStyle = c;
        const tw = Math.max(4, W * 0.008);
        ctx.fillRect(tx - tw / 2, foreTop - th, tw, th);
        ctx.beginPath(); ctx.arc(tx, foreTop - th, th * 0.32, 0, 7); ctx.fill();
      }));
    }
  }

  // Foreground guest: one or two walking figures.
  const nFig = 1 + Math.floor(rnd() * 2);
  for (let i = 0; i < nFig; i++) {
    const fx = W * (0.15 + rnd() * 0.7), fh = H * (0.09 + rnd() * 0.06);
    guests.push((c) => clipZone(0, W, foreTop, H, () => {
      ctx.fillStyle = c;
      const fw = fh * 0.32, fy = foreTop + (H - foreTop) * (0.55 + rnd() * 0.2);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(fx - fw / 2, fy - fh, fw, fh, fw / 2);
      else ctx.rect(fx - fw / 2, fy - fh, fw, fh);
      ctx.fill();
      ctx.beginPath(); ctx.arc(fx, fy - fh - fw * 0.42, fw * 0.42, 0, 7); ctx.fill();
    }));
  }

  const accentAt = Math.floor(rnd() * guests.length);
  guests.forEach((fn, i) => fn(i === accentAt ? ACCENT : pal.dark));
}

function render() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(seed);
}

canvas.addEventListener("click", () => {
  seed = (Math.random() * 0xFFFFFFFF) >>> 0;
  history.replaceState(null, "", "?seed=" + seed);
  render();
});
window.addEventListener("resize", render);
render();
</script>
</body>
</html>
