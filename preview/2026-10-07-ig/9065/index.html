<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>9065 Chrysanthemum Engine</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#020204;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
  #seed{position:fixed;right:10px;bottom:8px;color:rgba(255,255,255,.30);
    font:11px/1 ui-monospace,monospace;letter-spacing:.08em;user-select:none;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="seed"></div>
<script>
"use strict";
// 9065 Chrysanthemum Engine: a raymarched kaleidoscopic-IFS fractal bloom.
// Thousands of faceted crystal shards grown in a realtime fragment shader,
// pale pink and lavender on near-black, slow drift over dark nebula wisps.
// Click for a new seeded bloom. ?seed= makes it shareable.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const qp=new URLSearchParams(location.search);
let seed=qp.has("seed")?(parseInt(qp.get("seed"),10)>>>0):7;
const seedEl=document.getElementById("seed");

const VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
const FS=`
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform float u_pow;
uniform vec3 u_off;
uniform float u_spin;
uniform float u_hue;
uniform float u_fade;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0.,0.,c,-s,0.,s,c);}
mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0.,s,0.,1.,0.,-s,0.,c);}
mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,-s,0.,s,c,0.,0.,0.,1.);}

vec4 trap;
float mapK(vec3 p,float t){
  float dr=1.0;
  float r=0.0;
  trap=vec4(1e9);
  mat3 R=rotY(t*u_spin)*rotX(0.35+0.10*sin(t*0.045));
  vec3 c=R*p+u_off;
  vec3 z=vec3(0.0);
  for(int i=0;i<9;i++){
    r=length(z);
    if(r>2.0)break;
    float rr=dot(z,z);
    float theta=acos(clamp(z.z/max(r,1e-6),-1.,1.))*u_pow;
    float phi=atan(z.y,z.x)*u_pow;
    dr=pow(r,u_pow-1.0)*u_pow*dr+1.0;
    float zr=pow(r,u_pow);
    z=zr*vec3(sin(theta)*cos(phi),sin(phi)*sin(theta),cos(theta))+c;
    trap=min(trap,vec4(abs(z),rr));
  }
  return 0.5*log(max(r,1e-6))*r/dr;
}
vec3 calcN(vec3 p,float t){
  const vec2 e=vec2(0.0016,-0.0016);
  return normalize(e.xyy*mapK(p+e.xyy,t)+e.yyx*mapK(p+e.yyx,t)+e.yxy*mapK(p+e.yxy,t)+e.xxx*mapK(p+e.xxx,t));
}
vec3 pal(float h){
  h=fract(h);
  vec3 a=vec3(0.98,0.93,0.99);
  vec3 b=vec3(0.96,0.70,0.82);
  vec3 c=vec3(0.76,0.70,0.96);
  vec3 col=mix(a,b,smoothstep(0.0,0.45,h));
  col=mix(col,c,smoothstep(0.45,0.9,h));
  return col;
}
void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-u_res)/min(u_res.x,u_res.y);
  float t=u_time;
  vec2 nuv=uv*1.4+vec2(t*0.010,-t*0.006);
  float neb=vnoise(nuv*2.0)*0.62+vnoise(nuv*4.7+3.1)*0.38;
  vec3 bg=vec3(0.006,0.006,0.010);
  bg+=neb*vec3(0.085,0.038,0.042);
  bg+=vnoise(nuv*3.0+7.7)*vec3(0.016,0.042,0.038);

  vec3 ro=vec3(0.0,0.0,2.75+0.15*sin(t*0.05));
  vec3 rd=normalize(vec3(uv,-1.55));
  float td=0.0;float d=1e9;bool hit=false;
  for(int i=0;i<52;i++){
    vec3 p=ro+rd*td;
    d=mapK(p,t);
    if(d<0.0014){hit=true;break;}
    td+=d*0.85;
    if(td>10.0)break;
  }
  vec3 col=bg;
  if(hit){
    vec3 p=ro+rd*td;
    vec3 n=calcN(p,t);
    vec3 L=normalize(vec3(0.55,0.75,0.6));
    float dif=clamp(dot(n,L),0.,1.);
    float bac=clamp(dot(n,normalize(vec3(-0.5,-0.3,-0.4))),0.,1.);
    float spec=pow(clamp(dot(reflect(-L,n),-rd),0.,1.),26.);
    float h=fract(u_hue+trap.x*0.55+trap.y*0.35);
    vec3 base=pal(h);
    base*=0.92+0.16*vnoise(trap.xy*8.0);
    vec3 sh=base*(0.34+0.85*dif)+base*bac*0.30+spec*vec3(1.0,0.96,0.99)*1.1;
    float fog=exp(-td*0.30);
    col=mix(bg,sh,fog);
    col+=base*0.10*exp(-td*0.8);
  }
  float vg=smoothstep(1.9,0.45,length(uv));
  col*=mix(0.55,1.0,vg);
  col=1.0-exp(-col*1.7);
  col*=u_fade;
  gl_FragColor=vec4(col,1.0);
}`;

const canvas=document.getElementById("c");
const gl=canvas.getContext("webgl",{antialias:false,alpha:false,powerPreference:"high-performance"});
if(!gl){document.body.innerHTML="<p style='color:#ccc'>WebGL unavailable</p>";throw new Error("no webgl");}

function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw new Error(gl.getShaderInfoLog(s));}return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};["u_res","u_time","u_pow","u_off","u_spin","u_hue","u_fade"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));

const RSCALE=0.66;
function resize(){
  const w=Math.max(2,Math.floor(innerWidth*RSCALE)),h=Math.max(2,Math.floor(innerHeight*RSCALE));
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}
}
addEventListener("resize",resize);resize();

let P={};
function applySeed(s){
  seed=s>>>0;
  const r=mulberry32(seed);
  P={pow:7.0+Math.floor(r()*3.0), // 7, 8 or 9
     off:[(r()-0.5)*0.5,(r()-0.5)*0.5,(r()-0.5)*0.5],
     spin:0.04+r()*0.08, hue:r()};
  seedEl.textContent="seed "+seed;
}
let fade=1,fadeTarget=1;
canvas.addEventListener("pointerdown",()=>{fadeTarget=0;setTimeout(()=>{applySeed((Math.random()*1e9)|0);fadeTarget=1;},320);});

let t0=performance.now(),timeOverride=null;
window.__setTime=t=>{timeOverride=t;};
window.__reseed=s=>{applySeed(s);};
applySeed(seed);

function frame(now){
  resize();
  const t=timeOverride!==null?timeOverride:(now-t0)/1000;
  fade+=(fadeTarget-fade)*0.12;
  gl.uniform2f(U.u_res,canvas.width,canvas.height);
  gl.uniform1f(U.u_time,t);
  gl.uniform1f(U.u_pow,P.pow);
  gl.uniform3f(U.u_off,P.off[0],P.off[1],P.off[2]);
  gl.uniform1f(U.u_spin,P.spin);
  gl.uniform1f(U.u_hue,P.hue);
  gl.uniform1f(U.u_fade,fade);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
