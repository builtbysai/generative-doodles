<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>9063 Prism Split</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#010102;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
  #seed{position:fixed;right:10px;bottom:8px;color:rgba(255,255,255,.30);
    font:11px/1 ui-monospace,monospace;letter-spacing:.08em;user-select:none;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="seed"></div>
<script>
"use strict";
// 9063 Prism Split: near-mirror-symmetric refractive light on black.
// Cool rays left, warm rays right, converging on a glowing faceted core,
// with a faint glitch shimmer. Move the pointer to bend the symmetry axis.
// Click for a new seeded split. ?seed= makes it shareable.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const qp=new URLSearchParams(location.search);
let seed=qp.has("seed")?(parseInt(qp.get("seed"),10)>>>0):11;
const seedEl=document.getElementById("seed");

const VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
const FS=`
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform float u_bend;
uniform float u_hue;
uniform float u_fade;
uniform float u_gseed;
uniform vec4 u_ba; // beam angles seed pack
uniform vec4 u_bb;
uniform vec4 u_bc;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}

// one light beam from the core outward
float beam(vec2 uv,vec2 dir,float width,float len,float t,float ph){
  float along=dot(uv,dir);
  float across=abs(dot(uv,vec2(-dir.y,dir.x)));
  float head=smoothstep(len,len*0.55,along)*smoothstep(-0.02,0.06,along);
  float w=width*(0.7+0.6*along/len);
  float core=exp(-across*across/(w*w));
  float flick=0.75+0.25*sin(t*1.7+ph*6.2831);
  // fractal shimmer inside the beam
  float shimmer=0.75+0.5*vnoise(vec2(along*14.0-ph*9.0,t*0.6));
  return head*core*flick*shimmer;
}
void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-u_res)/min(u_res.x,u_res.y);
  float t=u_time;
  // bend the symmetry axis with the pointer
  uv.x-=u_bend*0.35*exp(-dot(uv,uv)*1.2);

  vec3 col=vec3(0.004,0.004,0.009);
  // faint dark chamber texture
  col+=vnoise(uv*3.0+t*0.02)*vec3(0.012,0.014,0.020);

  vec3 cool=vec3(0.30,0.82,1.00);
  vec3 warm=vec3(1.00,0.30,0.52);
  // 6 seeded beam pairs, mirrored for near-perfect symmetry
  for(int i=0;i<6;i++){
    float a0=i<4?(i==0?u_ba.x:(i==1?u_ba.y:(i==2?u_ba.z:u_ba.w))):(i==4?u_bb.x:u_bb.y);
    float a1=i<4?(i==0?u_bb.x:(i==1?u_bb.y:(i==2?u_bb.z:u_bb.w))):(i==4?u_bc.x:u_bc.y);
    float a2=i<4?(i==0?u_bc.x:(i==1?u_bc.y:(i==2?u_bc.z:u_bc.w))):(i==4?u_ba.x:u_ba.y);
    float ang=-1.05+a0*2.1;              // wide fan, right side
    float len=0.85+a1*1.0;
    float wid=0.010+a2*0.028;
    vec2 dir=vec2(cos(ang),sin(ang));
    float bR=beam(uv,dir,wid,len,t,a0+a1);
    float bL=beam(uv,vec2(-dir.x,dir.y),wid,len,t,a0+a1+0.37);
    col+=warm*bR*1.4;
    col+=cool*bL*1.4;
    // thin hot core line inside each beam
    col+=mix(warm,cool,0.5)* (bR+bL)*0.0; // reserved
    col+=vec3(1.0,0.98,0.95)*pow(bR,3.0)*1.2;
    col+=vec3(1.0,0.98,0.95)*pow(bL,3.0)*1.2;
  }

  // faceted core: slow-turning low-sided polygons
  float r=length(uv);
  float coreGlow=exp(-r*3.4);
  col+=vec3(0.70,1.0,0.40)*coreGlow*0.55*(0.72+0.28*sin(t*0.9));
  for(int k=1;k<=3;k++){
    float fk=float(k);
    float aa=atan(uv.y,uv.x)+t*0.05*fk;
    float sides=5.0+fk;
    float pr=r*(1.0+0.06*sin(aa*sides));
    float ring=smoothstep(0.012,0.0,abs(pr-0.10*fk-0.06))*exp(-pr*2.2);
    col+=mix(cool,warm,0.5+0.5*cos(aa))*ring*0.35;
  }
  // tiny hot center
  col+=vec3(1.0,1.0,0.95)*exp(-r*22.0)*1.6;

  // faint glitch shimmer
  float gsel=step(0.965,hash(vec2(floor(t*1.7),u_gseed)));
  float band=smoothstep(0.30,0.0,abs(fract(uv.y*0.5+t*0.03)-0.5)-0.10);
  col.rgb+=gsel*band*0.10*vec3(0.4,1.0,0.9)*sin(t*47.0);
  col*=1.0+gsel*band*0.20*sin(t*61.0);

  float vg=smoothstep(2.1,0.4,length(uv));
  col*=mix(0.45,1.0,vg);
  col=1.0-exp(-col*1.8);
  col*=u_fade;
  gl_FragColor=vec4(col,1.0);
}`;

const canvas=document.getElementById("c");
const gl=canvas.getContext("webgl",{antialias:false,alpha:false,powerPreference:"high-performance"});
if(!gl){document.body.innerHTML="<p style='color:#ccc'>WebGL unavailable</p>";throw new Error("no webgl");}

function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw new Error(gl.getShaderInfoLog(s));}return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};["u_res","u_time","u_bend","u_hue","u_fade","u_gseed","u_ba","u_bb","u_bc"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));

const RSCALE=0.75;
function resize(){
  const w=Math.max(2,Math.floor(innerWidth*RSCALE)),h=Math.max(2,Math.floor(innerHeight*RSCALE));
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}
}
addEventListener("resize",resize);resize();

let P={},bend=0.12,bendT=0.12,hueT=0,hue=0;
function applySeed(s){
  seed=s>>>0;
  const r=mulberry32(seed);
  P={ba:[r(),r(),r(),r()],bb:[r(),r(),r(),r()],bc:[r(),r(),r(),r()],gseed:r()*100};
  seedEl.textContent="seed "+seed;
}
addEventListener("pointermove",e=>{
  const nx=e.clientX/innerWidth*2-1, ny=e.clientY/innerHeight*2-1;
  bendT=0.12+nx*0.30;
  hueT=ny*0.5;
});
let fade=1,fadeTarget=1;
canvas.addEventListener("pointerdown",()=>{fadeTarget=0;setTimeout(()=>{applySeed((Math.random()*1e9)|0);fadeTarget=1;},320);});

let t0=performance.now(),timeOverride=null;
window.__setTime=t=>{timeOverride=t;};
window.__reseed=s=>{applySeed(s);};
window.__bend=b=>{bendT=b;};
applySeed(seed);

function frame(now){
  resize();
  const t=timeOverride!==null?timeOverride:(now-t0)/1000;
  fade+=(fadeTarget-fade)*0.12;
  bend+=(bendT-bend)*0.06; hue+=(hueT-hue)*0.06;
  gl.uniform2f(U.u_res,canvas.width,canvas.height);
  gl.uniform1f(U.u_time,t);
  gl.uniform1f(U.u_bend,bend);
  gl.uniform1f(U.u_hue,hue);
  gl.uniform1f(U.u_fade,fade);
  gl.uniform1f(U.u_gseed,P.gseed);
  gl.uniform4f(U.u_ba,P.ba[0],P.ba[1],P.ba[2],P.ba[3]);
  gl.uniform4f(U.u_bb,P.bb[0],P.bb[1],P.bb[2],P.bb[3]);
  gl.uniform4f(U.u_bc,P.bc[0],P.bc[1],P.bc[2],P.bc[3]);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
