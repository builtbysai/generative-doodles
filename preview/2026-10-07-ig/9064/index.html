<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>9064 Vortex Ribbons</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#010204;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
  #seed{position:fixed;right:10px;bottom:8px;color:rgba(255,255,255,.30);
    font:11px/1 ui-monospace,monospace;letter-spacing:.08em;user-select:none;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="seed"></div>
<script>
"use strict";
// 9064 Vortex Ribbons: luminous particle ribbons orbiting a dark vortex.
// A seeded strange attractor advects hundreds of glowing particles; each
// leaves a fading additive trail, greens golds and ambers on black, the
// center kept dark. Click for a new attractor. ?seed= makes it shareable.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const qp=new URLSearchParams(location.search);
let seed=qp.has("seed")?(parseInt(qp.get("seed"),10)>>>0):20261007;
const seedEl=document.getElementById("seed");

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(1.5,devicePixelRatio||1);
  const w=Math.floor(innerWidth*DPR),h=Math.floor(innerHeight*DPR);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  W=w;H=h;
}
addEventListener("resize",resize);resize();

const PAL=["#6dffa8","#a8ff6d","#ffd76a","#ffab4a","#ff7a3c","#ffe9a8"];
let P=null,parts=[],fadeA=1,fadeT=1;

function applySeed(s){
  seed=s>>>0;
  const r=mulberry32(seed);
  // vortex flow: handedness, arm count, tightness seeded
  P={dir:r()<0.5?-1:1, arms:2+((r()*3)|0),
     rot:r()*Math.PI*2, spin:(0.010+r()*0.020)*(r()<0.5?-1:1)};
  const n=Math.max(300,Math.min(900,Math.floor(W*H/2400)));
  parts=[];
  for(let i=0;i<n;i++){
    const arm=((r()*P.arms)|0)/P.arms;
    const th=(arm+r()*0.30)*Math.PI*2;
    const rad=0.14+Math.pow(r(),0.72)*0.86;
    parts.push({
      r0:rad, th:th,
      om:(0.85+0.15*r())*P.dir*(1.25-rad),
      rAmp:0.010+r()*0.060, rFr:0.25+r()*1.1, ph:r()*6.283,
      wobA:0.010+r()*0.030, wobF:1.5+r()*2.5,
      col:rad<0.36?"#ffe9a8":(rad<0.60?"#ffd76a":(r()<0.5?"#ffab4a":(r()<0.45?"#ff7a3c":"#6dffa8"))),
      w:0.9+r()*1.2, px:0, py:0, init:false
    });
  }
  seedEl.textContent="seed "+seed;
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="#010204";ctx.fillRect(0,0,W,H);
}

let t0=performance.now(),timeOverride=null,lastT=0;
window.__setTime=t=>{timeOverride=t;};
window.__reseed=s=>{applySeed(s);};

let flash=0;
canvas.addEventListener("pointerdown",()=>{fadeT=0;flash=1;setTimeout(()=>{applySeed((Math.random()*1e9)|0);fadeT=1;},300);});
applySeed(seed);

function frame(now){
  resize();
  const t=(timeOverride!==null?timeOverride:(now-t0)/1000);
  const dt=Math.min(0.05,Math.max(0.001,t-lastT));lastT=t;
  fadeA+=(fadeT-fadeA)*0.10;
  if(fadeA<0.05&&fadeT===0)return requestAnimationFrame(frame);

  // fade trails
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="rgba(1,2,4,0.045)";
  ctx.fillRect(0,0,W,H);

  const cx=W/2,cy=H/2;
  const base=Math.min(W,H)*0.44;
  const rot=P.rot+t*P.spin;
  const cosr=Math.cos(rot),sinr=Math.sin(rot);
  const coreR=Math.min(W,H)*0.070;

  ctx.globalCompositeOperation="lighter";
  ctx.lineCap="round";
  for(const pt of parts){
    pt.th+=pt.om*dt;
    const rr=pt.r0+pt.rAmp*Math.sin(t*pt.rFr+pt.ph);
    const wob=pt.wobA*Math.sin(t*pt.wobF+pt.ph*2.0);
    const ux=(rr+wob)*Math.cos(pt.th), uy=(rr+wob)*Math.sin(pt.th)*0.86;
    const sx=cx+(ux*cosr-uy*sinr)*base;
    const sy=cy+(ux*sinr+uy*cosr)*base;
    if(!pt.init){pt.px=sx;pt.py=sy;pt.init=true;}
    // dark vortex: skip segments inside the core
    const mx=(pt.px+sx)/2-cx,my=(pt.py+sy)/2-cy;
    if(mx*mx+my*my<coreR*coreR){pt.px=sx;pt.py=sy;continue;}
    ctx.strokeStyle=pt.col;
    ctx.globalAlpha=0.55*fadeA;
    ctx.lineWidth=pt.w*DPR;
    ctx.beginPath();ctx.moveTo(pt.px,pt.py);ctx.lineTo(sx,sy);ctx.stroke();
    pt.px=sx;pt.py=sy;
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
