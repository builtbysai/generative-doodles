<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hand-Processed Binary</title>
<style>
  html, body { margin:0; padding:0; background:#0C0C0E; overflow:hidden; height:100%; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var SKY = '#1B4FD8', GROUND = '#0D2B70', FIGURE = '#101014',
    MAGENTA = '#FF2B8D', CYAN = '#00E5FF', EMULSION = '#060810',
    CHALK = '#EDEDED', MARGIN = '#0C0C0E', CLOUD = '#BFD4FF';

var SLICES = 44;
var AMP = 26;              // max slice displacement from one stroke
var FRINGE_AT = 6;         // |offset| above this draws channel passes

// ---------- seeded rng ----------
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash1(n){ // deterministic 0..1 from an integer
  var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

// ---------- state ----------
var stripIndex = 0;
var strokes = [];          // committed scratches for this strip: {pts:[{x,y}..], dir:+1|-1}
var live = null;           // in-progress stroke {pts:[], dir}
var startT = null;

// ---------- scene variant (pure function of strip index) ----------
function variant(s){
  var rnd = mulberry32(1203000 + s * 7919);
  return {
    pose: Math.floor(rnd() * 3),              // 0 standing, 1 walking, 2 seated
    figX: 0.30 + rnd() * 0.38,                // figure centre, fraction of scene width
    horizon: 0.58 + rnd() * 0.10,             // horizon height fraction
    sunX: 0.12 + rnd() * 0.30,
    cloudSeed: Math.floor(rnd() * 1e9),
    blockSide: rnd() < 0.5 ? -1 : 1
  };
}

// ---------- sizing ----------
var W = 0, H = 0, DPR = 1;
function fit(){
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = w; H = h;
  canvas.width = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
function isPhone(){
  var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
  if (sw < 700) return true;
  return H > W * 1.15;
}
function sceneRect(){
  var m = isPhone() ? Math.min(W, H) * 0.03 : Math.min(W, H) * 0.07;
  return { x: m, y: m, w: W - 2 * m, h: H - 2 * m };
}

// ---------- scene drawing (drawn inside current transform/clip) ----------
// All coordinates in scene-local space: (0,0) top-left of scene, size sw x sh.
function drawFigure(v, sw, sh, color){
  var fx = v.figX * sw;
  var groundY = v.horizon * sh;
  var u = sh * 0.011; // unit
  ctx.fillStyle = color;
  if (v.pose === 2){ // seated on a block
    var bw = u * 16, bh = u * 7;
    var bx = fx + v.blockSide * u * 2 - bw / 2;
    ctx.fillRect(bx, groundY - bh, bw, bh);                       // block
    var hipY = groundY - bh;
    ctx.fillRect(fx - u * 1.6, hipY - u * 9, u * 3.2, u * 9);      // torso
    ctx.beginPath(); ctx.arc(fx, hipY - u * 12.5, u * 3.1, 0, Math.PI * 2); ctx.fill(); // head
    ctx.fillRect(fx - u * 1.4, hipY - u * 1.2, u * 11, u * 2.4);   // thigh forward
    ctx.fillRect(fx + u * 8.2, hipY - u * 1.2, u * 2.4, u * 8.5);  // shin down
    ctx.fillRect(fx - u * 4.6, hipY - u * 8, u * 3.4, u * 2.2);    // arm resting back
  } else if (v.pose === 1){ // walking
    var hipY2 = groundY - u * 13;
    ctx.beginPath(); ctx.arc(fx + u * 1.5, hipY2 - u * 10.5, u * 3.1, 0, Math.PI * 2); ctx.fill(); // head
    ctx.save(); ctx.translate(fx, hipY2 - u * 8); ctx.rotate(0.10); ctx.fillRect(-u * 1.7, 0, u * 3.4, u * 8.5); ctx.restore(); // torso
    // legs: one forward, one back
    ctx.save(); ctx.translate(fx, hipY2); ctx.rotate(-0.55); ctx.fillRect(-u * 1.1, 0, u * 2.2, u * 13); ctx.restore();
    ctx.save(); ctx.translate(fx, hipY2); ctx.rotate(0.45); ctx.fillRect(-u * 1.1, 0, u * 2.2, u * 13); ctx.restore();
    // arms swinging opposite
    ctx.save(); ctx.translate(fx, hipY2 - u * 7); ctx.rotate(0.5); ctx.fillRect(-u * 0.9, 0, u * 1.8, u * 9); ctx.restore();
    ctx.save(); ctx.translate(fx, hipY2 - u * 7); ctx.rotate(-0.4); ctx.fillRect(-u * 0.9, 0, u * 1.8, u * 9); ctx.restore();
  } else { // standing
    var hipY3 = groundY - u * 13;
    ctx.beginPath(); ctx.arc(fx, hipY3 - u * 10.5, u * 3.1, 0, Math.PI * 2); ctx.fill(); // head
    ctx.fillRect(fx - u * 1.7, hipY3 - u * 8, u * 3.4, u * 8.5);   // torso
    ctx.fillRect(fx - u * 1.6, hipY3, u * 2.2, u * 13);            // leg L
    ctx.fillRect(fx + u * 0.4, hipY3, u * 2.2, u * 13);            // leg R
    ctx.fillRect(fx - u * 3.4, hipY3 - u * 7.5, u * 1.8, u * 9);   // arm L
    ctx.fillRect(fx + u * 1.8, hipY3 - u * 7.5, u * 1.8, u * 9);   // arm R
  }
}
function drawScene(v, sw, sh, figureOnly){
  var groundY = v.horizon * sh;
  if (!figureOnly){
    ctx.fillStyle = SKY; ctx.fillRect(-60, 0, sw + 120, groundY + 1);
    // sun: pale disc, home-movie flat
    ctx.fillStyle = CLOUD; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(v.sunX * sw, sh * 0.20, sh * 0.055, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // clouds: flat ellipse pairs (paired arcs, never batched ellipse subpaths)
    var rnd = mulberry32(v.cloudSeed);
    for (var i = 0; i < 4; i++){
      var cx = rnd() * sw, cy = sh * (0.08 + rnd() * 0.2), cs = sh * (0.03 + rnd() * 0.03);
      ctx.fillStyle = CLOUD; ctx.globalAlpha = 0.35;
      ctx.beginPath(); ctx.arc(cx, cy, cs, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + cs * 1.1, cy + cs * 0.15, cs * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = GROUND; ctx.fillRect(-60, groundY, sw + 120, sh - groundY + 2);
    // fence posts on the ground line, flat silhouettes
    ctx.fillStyle = FIGURE; ctx.globalAlpha = 0.55;
    for (var p = 0; p < 7; p++){
      var px = sw * (0.06 + p * 0.045);
      ctx.fillRect(px, groundY - sh * 0.028, sw * 0.006, sh * 0.05);
    }
    ctx.globalAlpha = 1;
  }
  drawFigure(v, sw, sh, FIGURE);
}

// ---------- scratch field ----------
// Per-slice horizontal offset from a set of strokes.
function sliceOffsets(list, sr){
  // Per stroke, per slice: take the max influence over that stroke's points,
  // then sum the contributions across strokes.
  var offs = new Float32Array(SLICES);
  var sliceH = sr.h / SLICES;
  for (var k2 = 0; k2 < list.length; k2++){
    var st2 = list[k2];
    var per = new Float32Array(SLICES);
    for (var pj = 0; pj < st2.pts.length; pj++){
      var q = st2.pts[pj];
      var relY2 = q.y - sr.y;
      for (var r2 = 0; r2 < SLICES; r2++){
        var rowY2 = (r2 + 0.5) * sliceH;
        var infl2 = Math.exp(-Math.abs(relY2 - rowY2) / 20);
        if (infl2 > per[r2]) per[r2] = infl2;
      }
    }
    for (var r3 = 0; r3 < SLICES; r3++) offs[r3] += AMP * per[r3] * st2.dir;
  }
  return offs;
}

// ---------- pointer ----------
function evPos(e){
  var r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left), y: (e.clientY - r.top) };
}
canvas.addEventListener('pointerdown', function(e){
  var p = evPos(e);
  live = { pts: [p], dir: 1, len: 0, lastX: p.x };
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch(_){} }
});
canvas.addEventListener('pointermove', function(e){
  if (!live) return;
  var p = evPos(e);
  var last = live.pts[live.pts.length - 1];
  var dx = p.x - last.x, dy = p.y - last.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d < 4) return;
  live.len += d;
  if (Math.abs(dx) > 1) live.dir = dx > 0 ? 1 : -1;
  live.pts.push(p);
});
function endStroke(){
  if (!live) return;
  if (live.len >= 30){
    strokes.push({ pts: live.pts, dir: live.dir });
    if (strokes.length >= 20){
      strokes = [];
      stripIndex++;
    }
  }
  live = null;
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', function(){ live = null; });

// ---------- draw ----------
function draw(now){
  if (startT === null) startT = now;
  var t = (now - startT) / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = MARGIN; ctx.fillRect(0, 0, W, H);

  var sr = sceneRect();
  var v = variant(stripIndex);
  var all = live ? strokes.concat([live]) : strokes;
  var offs = sliceOffsets(all, sr);
  var sliceH = sr.h / SLICES;

  ctx.save();
  ctx.beginPath(); ctx.rect(sr.x, sr.y, sr.w, sr.h); ctx.clip();

  for (var r = 0; r < SLICES; r++){
    var y0 = sr.y + r * sliceH;
    var off = offs[r];
    ctx.save();
    ctx.beginPath(); ctx.rect(sr.x - 2, y0, sr.w + 4, sliceH + 1); ctx.clip();
    ctx.translate(sr.x + off, sr.y);
    drawScene(v, sr.w, sr.h, false);
    ctx.restore();
    if (Math.abs(off) > FRINGE_AT){
      // channel passes: figure-only, magenta / cyan, offset further each way
      ctx.save();
      ctx.beginPath(); ctx.rect(sr.x - 2, y0, sr.w + 4, sliceH + 1); ctx.clip();
      ctx.globalAlpha = 0.55;
      ctx.translate(sr.x + off - 4, sr.y);
      drawFigure(v, sr.w, sr.h, MAGENTA);
      ctx.translate(8, 0);
      drawFigure(v, sr.w, sr.h, CYAN);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // emulsion darkening: persistent stroke bands (filled circles along each path)
  ctx.fillStyle = EMULSION;
  for (var k = 0; k < all.length; k++){
    var pts = all[k].pts;
    ctx.globalAlpha = 0.18;
    for (var i = 0; i < pts.length; i++){
      ctx.beginPath(); ctx.moveTo(pts[i].x + 7, pts[i].y);
      ctx.arc(pts[i].x, pts[i].y, 7, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // ambient shimmer: slow diagonal light band, 9s sweep
  var ph = (t % 9) / 9;
  var bx = sr.x - sr.w * 0.4 + ph * (sr.w * 1.8);
  ctx.fillStyle = CLOUD; ctx.globalAlpha = 0.05;
  ctx.beginPath();
  ctx.moveTo(bx, sr.y + sr.h);
  ctx.lineTo(bx + sr.w * 0.22, sr.y);
  ctx.lineTo(bx + sr.w * 0.40, sr.y);
  ctx.lineTo(bx + sr.w * 0.18, sr.y + sr.h);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();

  // frame counter: archival chalk, bottom-left; tiny strip tag
  var n = strokes.length;
  ctx.fillStyle = CHALK; ctx.globalAlpha = 0.9;
  ctx.font = '13px monospace'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('frame ' + n, 14, H - 14);
  ctx.globalAlpha = 0.55; ctx.font = '10px monospace';
  ctx.fillText('strip ' + (stripIndex + 1), 14, H - 30);
  ctx.globalAlpha = 1;
}

fit();
draw(0); // synchronous first frame at fixed phase T0 = 0
if (typeof requestAnimationFrame === 'function'){
  var loop = function(now){ draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function(){ fit(); });
window.addEventListener('resize', function(){ fit(); });
})();
</script>
</body>
</html>
