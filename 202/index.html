<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.202 Worm Friends' Chorus</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#070708; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.202 Worm Friends' Chorus (Amanda Willshire). Maude's worm
// friends, the input stations of the mockingbird piece, given a
// stage of their own: nine dim green worms in a loose three by
// three field, each one a looping voice. Tap a worm to feed it a
// note, hold for a longer note; up to eight notes it loops them
// back raw at its own tempo, prime ratios against its neighbours
// so the chorus phases and never locks. Every replayed note is
// an expanding ripple and a flash. Double tap clears a voice.
// One worm is a stranger: it arrived with a phrase already in it
// and plays gold, so the piece is never silent.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#070708', IDLE = '#3E6B1F', ACTIVE = '#7CFC00', GOLD = '#C9A227';
var W = 0, H = 0, phone = false;
var seed = 202202;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function hexRgb(hx) {
  return [parseInt(hx.slice(1, 3), 16), parseInt(hx.slice(3, 5), 16), parseInt(hx.slice(5, 7), 16)];
}
var IDLE_RGB = hexRgb(IDLE), ACT_RGB = hexRgb(ACTIVE), GOLD_RGB = hexRgb(GOLD);
function mixRgb(a, b, k) {
  return 'rgb(' + Math.round(lerp(a[0], b[0], k)) + ',' + Math.round(lerp(a[1], b[1], k)) + ',' + Math.round(lerp(a[2], b[2], k)) + ')';
}

// ---- the nine worms -------------------------------------------------------------
var PRIMES = [29, 31, 37, 41, 43, 47, 53, 59, 61];
var worms = [];
var ripples = [];
function makeWorm(i, ghost) {
  var col = i % 3, row = (i / 3) | 0;
  var jx = (rand() - 0.5) * 0.055, jy = (rand() - 0.5) * 0.05;
  return {
    fx: 0.265 + col * 0.235 + jx, fy: 0.27 + row * 0.235 + jy,
    phase: rand() * 6.2832, bend: 0.55 + rand() * 0.5,
    tempo: PRIMES[i] / 43, ghost: !!ghost,
    phrase: [], loopLen: 0, cursor: 0, lastCursor: -1, t0: -1,
    flashT0: -10, flashDur: 0.3, recStart: -1, recLastEnd: -1, lastTapT: -10
  };
}
for (var wi = 0; wi < 9; wi++) worms.push(makeWorm(wi, wi === 4));
// the stranger arrives with a phrase already in it
var ghost = worms[4];
ghost.phrase = [
  { gap: 0.35, dur: 0.28 }, { gap: 0.22, dur: 0.16 }, { gap: 0.5, dur: 0.62 },
  { gap: 0.24, dur: 0.18 }, { gap: 0.66, dur: 0.3 }
];
function phraseStarts(w) {
  var starts = [], acc = 0;
  for (var i = 0; i < w.phrase.length; i++) {
    acc += w.phrase[i].gap;
    starts.push(acc);
    acc += w.phrase[i].dur;
  }
  w.loopLen = acc + 0.7;
  return starts;
}
ghost.t0 = 0;
var T = 2.1, lastNow = -1;   // frame one: the stranger mid-phrase
// two ripples already travelling when the curtain lifts
ripples.push({ x: 0, y: 0, w: 4, age: 0.55, dur: 0.62, gold: true });
ripples.push({ x: 0, y: 0, w: 4, age: 1.3, dur: 0.3, gold: true });

// ---- geometry ---------------------------------------------------------------------
function wormLen() { return clamp(Math.min(W, H) * 0.185, 56, 200); }
function wormPt(w, s, out) {
  // s in [-1, 1] along the body; a lazy curve that keeps breathing
  var L = wormLen();
  var x = s * L * 0.5;
  var y = Math.sin(s * 2.4 * w.bend + w.phase + T * 0.9) * L * 0.13
        + Math.sin(s * 5.1 + w.phase * 2 + T * 1.7) * L * 0.03;
  out.x = w.fx * W + x; out.y = w.fy * H + y;
}
var PT = { x: 0, y: 0 };
function wormHead(w) { wormPt(w, 1, PT); return PT; }

// ---- input: taps feed phrases ------------------------------------------------------
var downWorm = -1, downT = 0;
function pickWorm(x, y) {
  var best = -1, bd = 1e9;
  for (var i = 0; i < 9; i++) {
    var w = worms[i];
    var dx = x - w.fx * W, dy = y - w.fy * H;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < bd) { bd = d; best = i; }
  }
  return bd < wormLen() * 0.85 ? best : -1;
}
canvas.addEventListener('pointerdown', function (e) {
  var i = pickWorm(e.clientX, e.clientY);
  if (i < 0) return;
  var w = worms[i];
  if (T - w.lastTapT < 0.33) {
    // double tap: the voice drops out of the chorus
    w.phrase = []; w.loopLen = 0; w.t0 = -1; w.lastCursor = -1; w.recLastEnd = -1;
    w.lastTapT = -10; downWorm = -1;
    return;
  }
  w.lastTapT = T;
  downWorm = i; downT = T;
  w.recStart = T;
});
function endNote() {
  if (downWorm < 0) return;
  var w = worms[downWorm];
  downWorm = -1;
  var dur = clamp(T - downT, 0.09, 1.4);
  var gap = w.phrase.length === 0 ? 0.35 : clamp(downT - w.recLastEnd, 0.06, 2.5);
  w.phrase.push({ gap: gap, dur: dur });
  if (w.phrase.length > 8) w.phrase.shift();
  w.recLastEnd = T;
  if (w.t0 < 0) { w.t0 = T; w.lastCursor = -1; }
  phraseStarts(w);
}
canvas.addEventListener('pointerup', endNote);
canvas.addEventListener('pointercancel', endNote);

// ---- resize --------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- draw -----------------------------------------------------------------------------
function fireNote(w, idx, dur) {
  var h = wormHead(w);
  ripples.push({ x: h.x, y: h.y, w: idx, age: 0, dur: dur, gold: w.ghost });
  w.flashT0 = T; w.flashDur = Math.max(0.22, dur);
}
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && now > 0) {
    dt = Math.min(0.05, (now - lastNow) / 1000);
    T += dt;
  }
  lastNow = now;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var L = wormLen();
  // schedulers
  for (var i = 0; i < 9; i++) {
    var w = worms[i];
    if (w.t0 < 0 || w.phrase.length === 0) continue;
    var starts = phraseStarts(w);
    var cur = ((T - w.t0) * w.tempo) % w.loopLen;
    if (w.lastCursor >= 0) {
      for (var n = 0; n < starts.length; n++) {
        var s = starts[n];
        var hit = (w.lastCursor <= cur) ? (s > w.lastCursor && s <= cur)
                                        : (s > w.lastCursor || s <= cur);
        if (hit && dt > 0) fireNote(w, i, w.phrase[n].dur);
      }
    }
    w.cursor = cur; w.lastCursor = cur;
  }
  // ripples under the worms
  for (var r = ripples.length - 1; r >= 0; r--) {
    var rp = ripples[r];
    rp.age += dt;
    var wob = worms[rp.w];
    if (rp.x === 0 && rp.y === 0) { var hh = wormHead(wob); rp.x = hh.x; rp.y = hh.y; }
    var k = rp.age / (0.7 + rp.dur * 1.6);
    if (k >= 1) { ripples.splice(r, 1); continue; }
    var rad = (0.12 + k * (0.55 + rp.dur * 0.75)) * L;
    ctx.strokeStyle = rp.gold
      ? 'rgba(201,162,39,' + (0.55 * (1 - k)).toFixed(3) + ')'
      : 'rgba(124,252,0,' + (0.5 * (1 - k)).toFixed(3) + ')';
    ctx.lineWidth = Math.max(1.2, L * 0.016 * (1 - k * 0.5));
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, rad, 0, 6.2832);
    ctx.stroke();
  }
  // the worms themselves: chains of beads along a breathing curve
  var SEG = 11;
  for (var j = 0; j < 9; j++) {
    var wm = worms[j];
    var flash = clamp(1 - (T - wm.flashT0) / wm.flashDur, 0, 1);
    var base = wm.ghost ? GOLD_RGB : IDLE_RGB;
    var col = wm.ghost ? mixRgb(GOLD_RGB, [255, 240, 190], flash * 0.55)
                       : mixRgb(IDLE_RGB, ACT_RGB, flash);
    if (wm.ghost && flash <= 0) col = 'rgba(201,162,39,0.72)';
    ctx.fillStyle = col;
    for (var sIdx = SEG; sIdx >= 0; sIdx--) {
      var s = -1 + (sIdx / SEG) * 2;
      wormPt(wm, s, PT);
      var taper = 0.55 + 0.45 * (s + 1) / 2;
      var rr = L * 0.055 * taper * (1 + 0.1 * Math.sin(T * 2.2 + sIdx * 0.8 + wm.phase));
      ctx.beginPath();
      ctx.arc(PT.x, PT.y, rr, 0, 6.2832);
      ctx.fill();
    }
    // the head bead, a touch larger, with the phrase held in it
    wormPt(wm, 1, PT);
    ctx.beginPath();
    ctx.arc(PT.x, PT.y, L * 0.062, 0, 6.2832);
    ctx.fill();
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
