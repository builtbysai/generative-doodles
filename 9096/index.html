<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9096 · Pinwheel Quilt II</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f2eee1; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // After Hans's hand-drawn pinwheel quilt: a warped lattice of ink rosettes,
  // black and paper alternating like a checkerboard. Each rosette turns one
  // petal-step per loop, so the motion closes seamlessly, forever.
  var INK = '#171410', PAPER = '#f2eee1';
  var COLS = 5, ROWS = 6, LOOP = 16000;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, cell = 0;
  var seed = 20261019;
  var R = null, grid = [], cells = [], grain = null;

  function mulberry(s) {
    var a = s >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function build() {
    R = mulberry(seed);
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    var s = Math.min(W, H);
    cell = s / (Math.max(COLS, ROWS) + 1.4);
    var ox = (W - cell * COLS) / 2, oy = (H - cell * ROWS) / 2;

    // warped lattice: base point + static hand-drawn offset
    grid = [];
    var wob = cell * 0.26;
    for (var j = 0; j <= ROWS; j++) {
      var row = [];
      for (var i = 0; i <= COLS; i++) {
        var edge = (i === 0 || j === 0 || i === COLS || j === ROWS);
        row.push({
          bx: ox + i * cell, by: oy + j * cell,
          ox: edge ? 0 : (R() - 0.5) * 2 * wob,
          oy: edge ? 0 : (R() - 0.5) * 2 * wob
        });
      }
      grid.push(row);
    }

    cells = [];
    for (var cj = 0; cj < ROWS; cj++) for (var ci = 0; ci < COLS; ci++) {
      var black = ((ci + cj) % 2 === 0);
      var n = 8;
      var cx = (grid[cj][ci].bx + grid[cj][ci + 1].bx + grid[cj + 1][ci].bx + grid[cj + 1][ci + 1].bx) / 4;
      var cy = (grid[cj][ci].by + grid[cj][ci + 1].by + grid[cj + 1][ci].by + grid[cj + 1][ci + 1].by) / 4;
      cx += (R() - 0.5) * cell * 0.07;
      cy += (R() - 0.5) * cell * 0.07;
      var petals = [];
      for (var k = 0; k < n; k++) {
        petals.push({
          wob: (R() - 0.5) * 0.10,
          swirl: 0.45 + R() * 0.20
        });
      }
      cells.push({ cx: cx, cy: cy, n: n, dir: black ? 1 : -1, black: black,
                   petals: petals, r: cell * (0.47 + R() * 0.04),
                   lump: 0.035 + R() * 0.030, lumpPh: R() * 6.283, lumpPh2: R() * 6.283 });
    }

    // paper grain, drawn once
    grain = document.createElement('canvas');
    grain.width = Math.max(2, Math.floor(W / 2));
    grain.height = Math.max(2, Math.floor(H / 2));
    var g = grain.getContext('2d'), gr = mulberry(seed + 99), d;
    for (d = 0; d < 2400; d++) {
      g.fillStyle = 'rgba(74,62,44,' + (0.02 + gr() * 0.05).toFixed(3) + ')';
      var sz = 0.6 + gr() * 1.7;
      g.fillRect(gr() * grain.width, gr() * grain.height, sz, sz);
    }
  }

  function gx(i, j, breathe) { return grid[j][i].bx + grid[j][i].ox * breathe; }
  function gy(i, j, breathe) { return grid[j][i].by + grid[j][i].oy * breathe; }

  function draw(now) {
    var lt = (now % LOOP) / LOOP;
    var a = lt * Math.PI * 2;
    var breathe = 1 + 0.05 * Math.sin(a);

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(grain, 0, 0, W, H);

    var i, j, k, c;
    // rosettes: solid disk + curved pinwheel separators
    for (i = 0; i < cells.length; i++) {
      c = cells[i];
      var rot = c.dir * a / c.n; // one petal-step per loop: seamless
      var step = (Math.PI * 2) / c.n;
      // lumpy disk
      ctx.beginPath();
      for (var sgm = 0; sgm <= 64; sgm++) {
        var th = (sgm / 64) * Math.PI * 2;
        var rr = c.r * (1 + c.lump * Math.sin(3 * th + c.lumpPh) + c.lump * 0.7 * Math.sin(5 * th + c.lumpPh2));
        var px = c.cx + rr * Math.cos(th), py = c.cy + rr * Math.sin(th);
        if (sgm === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      if (c.black) {
        ctx.fillStyle = INK; ctx.fill();
      } else {
        ctx.fillStyle = PAPER; ctx.fill();
        ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2.5, cell * 0.032); ctx.stroke();
      }
      // separators: curved blades
      for (k = 0; k < c.n; k++) {
        var p = c.petals[k];
        var a0 = k * step + rot + p.wob;
        var a1 = a0 + c.dir * p.swirl * step;
        var r0 = cell * 0.055;
        ctx.beginPath();
        ctx.moveTo(c.cx + r0 * Math.cos(a0), c.cy + r0 * Math.sin(a0));
        ctx.quadraticCurveTo(
          c.cx + c.r * 0.62 * Math.cos(a0 + c.dir * p.swirl * step * 0.30),
          c.cy + c.r * 0.62 * Math.sin(a0 + c.dir * p.swirl * step * 0.30),
          c.cx + c.r * Math.cos(a1), c.cy + c.r * Math.sin(a1));
        if (c.black) {
          ctx.strokeStyle = PAPER; ctx.lineWidth = Math.max(1.5, cell * 0.022); ctx.stroke();
        } else {
          ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2.5, cell * 0.040); ctx.stroke();
        }
      }
    }

    // warped lattice lines over the top
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(4, cell * 0.050);
    var p;
    for (j = 0; j <= ROWS; j++) {
      ctx.beginPath();
      for (i = 0; i <= COLS; i++) {
        p = [gx(i, j, breathe), gy(i, j, breathe)];
        if (i === 0) ctx.moveTo(p[0], p[1]); else {
          var mx = (gx(i - 1, j, breathe) + p[0]) / 2, my = (gy(i - 1, j, breathe) + p[1]) / 2;
          ctx.quadraticCurveTo(gx(i - 1, j, breathe), gy(i - 1, j, breathe), mx, my);
          ctx.quadraticCurveTo(p[0], p[1], p[0], p[1]);
        }
      }
      ctx.stroke();
    }
    for (i = 0; i <= COLS; i++) {
      ctx.beginPath();
      for (j = 0; j <= ROWS; j++) {
        p = [gx(i, j, breathe), gy(i, j, breathe)];
        if (j === 0) ctx.moveTo(p[0], p[1]); else {
          var nx = (gx(i, j - 1, breathe) + p[0]) / 2, ny = (gy(i, j - 1, breathe) + p[1]) / 2;
          ctx.quadraticCurveTo(gx(i, j - 1, breathe), gy(i, j - 1, breathe), nx, ny);
          ctx.quadraticCurveTo(p[0], p[1], p[0], p[1]);
        }
      }
      ctx.stroke();
    }

    // center dots
    for (i = 0; i < cells.length; i++) {
      c = cells[i];
      ctx.beginPath();
      ctx.arc(c.cx, c.cy, Math.max(2, cell * 0.042), 0, Math.PI * 2);
      ctx.fillStyle = c.black ? PAPER : INK;
      ctx.fill();
    }
  }

  var lastTap = 0;
  canvas.addEventListener('pointerdown', function () {
    var now = performance.now();
    if (now - lastTap < 350) {
      seed = (Math.random() * 1e9) | 0;
      build();
    }
    lastTap = now;
  });

  window.addEventListener('resize', build);
  build();
  (function frame(now) {
    draw(now || 0);
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
