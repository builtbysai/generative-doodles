<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.362 Stingray Trellis</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101214; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.362 Stingray Trellis (jmarie.creates).
// After Julianne Haness's "Stingray Wallpaper": white-etched
// stingrays whose wingspans interlock into an ogee trellis
// lattice on black, a ring-dot starfield in the gaps. The
// creature outline and the lattice are the SAME path: one
// symmetric wing bezier per ray, mirror-tiled so wingtips
// touch neighbours at the shared cell edges and the snout
// and tail meet the rays above and below. The outline is a
// continuous network, not a school of separate animals.
//
// Palette is closed: linework white #F2EFE6 on ground
// #101214; the dot field is the same white at a fixed 0.6
// alpha. Flat only. One canvas, no offscreen canvas, no
// shadowBlur, no filters, no gradients.
//
// Motion is one 24s seamless master loop: the wing control
// points undulate on a sine field that completes exactly
// 2 whole cycles per loop, with the phase offset per cell,
// so frame 24s is pixel-identical to frame 0. The
// undulation weight is zero at every shared junction
// (wingtips, snout, tail tip), so the lattice never tears
// while it breathes. Frame one is drawn at a CONSTANT
// phase (T_OFFSET seconds into the loop), never from a
// wall clock, so the thumbnail reproduces byte-identically;
// the live loop advances from that same anchor.
//
// Interaction: DRAG pans the oversized repeat (clamped to
// the authored margin, position persists on release).
// DOUBLE-TAP advances the dot starfield to the next of
// three authored dot tables (fixed JS data, generated
// offline from fixed seeds; never runtime random).
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#101214';
var INK = '#F2EFE6';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var CYCLE = 24;              // seconds, seamless master loop
var T_OFFSET = 9;            // constant first-frame phase

// ---- lattice geometry --------------------------------------
// One cell holds one ray. CW x CH; the ray outline touches
// all four edges: wingtips at the left/right edge midpoints,
// snout at the top edge centre, tail tip at the bottom edge
// centre. Cells mirror-tile (flipX on odd columns, flipY on
// odd rows), so every touching point is shared with the
// neighbour across the edge.
var CW = 320, CH = 300;
// Ray outline as cubic segments in local coords:
// [x0,y0, c1x,c1y, c2x,c2y, x1,y1] closed loop, clockwise
// from the snout. Symmetric about x = CW/2. The outline is
// the DISC only: wide and flat, widest at the wingtip line,
// pinching to a narrow tail base at y = 206. The tail is a
// separate thin whip (TAIL below) running from the base to
// the bottom edge centre, so the creature reads as body
// plus whip, not as a leaf.
var OUTLINE = [
  [160,   2,  214,   2,  288,  40,  320, 128],  // right leading edge: snout to wingtip
  [320, 128,  284, 166,  228, 192,  170, 206],  // right trailing edge: wingtip to tail base
  [170, 206,  164, 216,  156, 216,  150, 206],  // disc bottom under the tail base
  [150, 206,   92, 192,   36, 166,    0, 128],  // left trailing edge: base to wingtip
  [  0, 128,   32,  40,  106,   2,  160,   2]   // left leading edge: wingtip to snout
];
// The whip tail: two converging curves, tail base to the
// bottom edge centre (drawn open, stroked).
var TAIL = [[169, 202], [163, 252], [160, 298], [157, 252], [151, 202]];
var CENTRE = [160, 110];     // echo scaling centre

// ---- dot starfield: three authored tables ------------------
// Ring dots live in the negative space at the grid
// intersections (cell corners), where the four neighbouring
// outlines curve away. One tile is 640x600 (2x2 cells) and
// holds 12 dots in 4 clusters of 3; tiling the table covers
// every intersection exactly once. Tables are literal data,
// generated offline from fixed seeds (362011 / 362022 /
// 362033); double-tap cycles them. [x, y, radius] in tile
// coords; negative coords wrap into the neighbouring tile.
var DOT_TABLES = [
  [[2.1,-27.6,4.4],[30,0,2.7],[-0.6,-24.6,5.1],[324.1,-1.7,3],[297.6,-9.9,4.5],[296.8,-17,5.2],[-20.8,271.4,4],[16.3,270.4,4.7],[-13.3,314.3,5],[305.9,279.5,5],[312.2,270.3,2.4],[296.9,314.6,5]],
  [[2.3,-27.8,3],[-5.6,19.9,3.4],[-16.1,-19.9,3.9],[302,-2.2,4.6],[342.4,18.3,3.1],[304.4,24.1,2.7],[-3.7,316.6,2.9],[27.8,292.8,4.1],[4.2,305.9,3.8],[332.1,274,4.4],[340,312.7,4.2],[337.1,276.8,2.4]],
  [[2.6,-27.9,4.6],[18.8,-20.2,4.1],[28.4,-15.3,2.7],[339.9,-2.7,3.2],[327.1,-13.5,4.6],[312,5.2,3.2],[13.3,301.9,4.7],[-20.8,315.2,3.5],[21.7,297.5,2.6],[298.4,328.5,3.8],[307.8,295,3],[317.3,299.1,2.9]]
];
if (OUTLINE.length !== 5) throw new Error('Stingray Trellis disc needs exactly 5 segments, got ' + OUTLINE.length);
if (TAIL.length !== 5) throw new Error('Stingray Trellis tail needs exactly 5 points, got ' + TAIL.length);
if (DOT_TABLES.length !== 3) throw new Error('Stingray Trellis needs exactly three dot tables');
DOT_TABLES.forEach(function (t) {
  if (t.length !== 12) throw new Error('each dot table needs exactly 12 dots, got ' + t.length);
});
var TILE_W = 640, TILE_H = 600;
var dotTable = 0;

// ---- pan state ----------------------------------------------
var panX = 0, panY = 0;      // design px, persists on release
var PAN_MAX = 170;           // clamp; the field is authored with margin beyond this

// ---- undulation ----------------------------------------------
// Sine offset field over a point already mirror-mapped into
// cell space (mx in 0..CW, my in 0..CH). Weight is zero at
// lx = 0 and lx = CW (wingtips) and near ly = 0 / ly = CH
// (snout / tail tip), so shared junctions stay put; the
// belly of each wing, where the control points sit, moves
// most. Phase is offset per cell.
function und(mx, my, col, row, t) {
  var wf = Math.sin(Math.PI * mx / CW);
  var vf = Math.sin(Math.PI * my / CH);
  var ph = (t / CYCLE) * Math.PI * 2 * 2 + col * 0.9 + row * 1.7;
  var a = 6 * wf * vf;
  return [a * Math.sin(ph + mx * 0.010), a * Math.cos(ph * 0.9 + my * 0.008)];
}

// Map a local point into world coords for cell (col,row):
// mirror-map, then add the undulation offset.
function MP(lx, ly, col, row, flipX, flipY, t) {
  var mx = flipX ? CW - lx : lx;
  var my = flipY ? CH - ly : ly;
  var o = und(mx, my, col, row, t);
  return [col * CW + mx + o[0], row * CH + my + o[1]];
}

function tracePath(pts, close) {
  // pts: flat array of mapped points, 8 per cubic segment
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 0; i < pts.length; i += 8) {
    ctx.bezierCurveTo(pts[i + 2], pts[i + 3], pts[i + 4], pts[i + 5], pts[i + 6], pts[i + 7]);
  }
  if (close) ctx.closePath();
}

function mapSegs(segs, col, row, flipX, flipY, t, scale) {
  var out = [];
  for (var i = 0; i < segs.length; i++) {
    var s = segs[i];
    for (var k = 0; k < 8; k += 2) {
      var lx = s[k], ly = s[k + 1];
      if (scale !== 1) {
        lx = CENTRE[0] + (lx - CENTRE[0]) * scale;
        ly = CENTRE[1] + (ly - CENTRE[1]) * scale;
      }
      var p = MP(lx, ly, col, row, flipX, flipY, t);
      out.push(p[0], p[1]);
    }
  }
  return out;
}

function drawRay(col, row, t) {
  var flipX = ((col % 2) + 2) % 2 === 1;
  var flipY = ((row % 2) + 2) % 2 === 1;
  // etched inner echoes first (thinner), outline last (boldest)
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.3;
  tracePath(mapSegs(OUTLINE, col, row, flipX, flipY, t, 0.72), true);
  ctx.stroke();
  ctx.lineWidth = 1.1;
  tracePath(mapSegs(OUTLINE, col, row, flipX, flipY, t, 0.47), true);
  ctx.stroke();
  // spine: snout to tail base, gently curved, then a fine
  // centre line down the whip
  var sp = [];
  [[160, 16], [166, 80], [163, 140], [160, 196]].forEach(function (q) {
    var p = MP(q[0], q[1], col, row, flipX, flipY, t);
    sp.push(p[0], p[1]);
  });
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(sp[0], sp[1]);
  ctx.quadraticCurveTo(sp[2], sp[3], sp[4], sp[5]);
  ctx.quadraticCurveTo(sp[6], sp[7], sp[6], sp[7] + 4);
  ctx.stroke();
  var tb = MP(160, 204, col, row, flipX, flipY, t);
  var tt = MP(160, 292, col, row, flipX, flipY, t);
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(tb[0], tb[1]);
  ctx.lineTo(tt[0], tt[1]);
  ctx.stroke();
  // the whip tail itself: two converging stroked curves
  var tp = TAIL.map(function (q) { return MP(q[0], q[1], col, row, flipX, flipY, t); });
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(tp[0][0], tp[0][1]);
  ctx.quadraticCurveTo(tp[1][0], tp[1][1], tp[2][0], tp[2][1]);
  ctx.quadraticCurveTo(tp[3][0], tp[3][1], tp[4][0], tp[4][1]);
  ctx.stroke();
  // gill slits: three short arcs each side of the spine
  ctx.lineWidth = 1.2;
  for (var side = -1; side <= 1; side += 2) {
    for (var g = 0; g < 3; g++) {
      var gy = 96 + g * 16;
      var a = MP(160 + side * 16, gy, col, row, flipX, flipY, t);
      var b = MP(160 + side * (34 + g * 3), gy + 9, col, row, flipX, flipY, t);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.quadraticCurveTo((a[0] + b[0]) / 2 + side * 3, (a[1] + b[1]) / 2, b[0], b[1]);
      ctx.stroke();
    }
  }
  // eyes: two small filled dots beside the snout
  ctx.fillStyle = INK;
  [-1, 1].forEach(function (side) {
    var e = MP(160 + side * 15, 34, col, row, flipX, flipY, t);
    ctx.beginPath();
    ctx.arc(e[0], e[1], 3.2, 0, Math.PI * 2);
    ctx.fill();
  });
  // the outline itself: the lattice line
  ctx.lineWidth = 3;
  tracePath(mapSegs(OUTLINE, col, row, flipX, flipY, t, 1), true);
  ctx.stroke();
}

function drawDots(t) {
  var table = DOT_TABLES[dotTable];
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.6;
  ctx.globalAlpha = 0.6;
  // tiles covering the authored field plus pan margin
  var tx0 = Math.floor((-CW * 2) / TILE_W), tx1 = Math.floor((DW + CW * 2) / TILE_W);
  var ty0 = Math.floor((-CH * 2) / TILE_H), ty1 = Math.floor((DH + CH * 2) / TILE_H);
  for (var ty = ty0; ty <= ty1; ty++) {
    for (var tx = tx0; tx <= tx1; tx++) {
      for (var i = 0; i < table.length; i++) {
        var d = table[i];
        ctx.beginPath();
        ctx.arc(tx * TILE_W + d[0], ty * TILE_H + d[1], d[2], 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
}

function draw(t) {
  ctx.save();
  ctx.translate(panX, panY);
  drawDots(t);
  // cells covering the design space plus one cell of margin
  // on every side (pan clamp 170 < cell 320/300, so coverage
  // holds at any allowed pan)
  for (var row = -2; row <= 4; row++) {
    for (var col = -2; col <= 5; col++) {
      drawRay(col, row, t);
    }
  }
  ctx.restore();
}

// ---- pointer: drag pan + double-tap dot advance --------------
var drag = null;             // {x, y, moved}
var lastTap = null;          // {time, x, y} in ms / css px
canvas.addEventListener('pointerdown', function (e) {
  drag = { x: e.clientX, y: e.clientY, moved: false };
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 6) drag.moved = true;
  if (drag.moved) {
    panX += dx / S; panY += dy / S;
    if (panX > PAN_MAX) panX = PAN_MAX; if (panX < -PAN_MAX) panX = -PAN_MAX;
    if (panY > PAN_MAX) panY = PAN_MAX; if (panY < -PAN_MAX) panY = -PAN_MAX;
    drag.x = e.clientX; drag.y = e.clientY;
  }
});
canvas.addEventListener('pointerup', function (e) {
  if (!drag) return;
  var wasDrag = drag.moved;
  drag = null;
  if (wasDrag) { lastTap = null; return; }
  var now = Date.now();
  if (lastTap && now - lastTap.time <= 350 &&
      Math.abs(e.clientX - lastTap.x) + Math.abs(e.clientY - lastTap.y) <= 40) {
    dotTable = (dotTable + 1) % DOT_TABLES.length;
    lastTap = null;
  } else {
    lastTap = { time: now, x: e.clientX, y: e.clientY };
  }
});
canvas.addEventListener('pointercancel', function () { drag = null; });

// ---- frame ---------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Full-bleed field composition: cover-fit on every
  // screen, phones included, page ground in the piece's
  // own black so any edge reads as night water.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  draw(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(T_OFFSET);
if (typeof requestAnimationFrame === 'function') {
  var loadMs = Date.now();
  var loop = function () {
    frame(T_OFFSET + (Date.now() - loadMs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
