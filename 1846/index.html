<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Hours</title>
<style>
html, body { margin: 0; padding: 0; background: #070708; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a dark dance floor seen from the booth, a few hundred small lights.
   One slow tide of brightness crosses the field like weather: no peaks, no
   drops, no climax. The viewer only watches; the tide cannot be steered. */
var TAU = Math.PI * 2;
var GROUND = '#070708';
var AMBER = '#E8A33D';
var AMBER_HI = '#F5C46A';
var WHITE = '#DDE3E8';
var WHITE_HI = '#FFFFFF';
var PLATE = '#0D0D0F';
var PLATE_LINE = 'rgba(221,227,232,0.28)';
var TITLE_INK = '#EDEDE8';
var HINT_INK = '#9AA3AD';
var FRAME_T = 60.0;        /* fixed phase: tide band near the top-left, moving down-right */
var TIDE_PERIOD = 720;     /* one tide crossing of the field, seconds */
var LFO_PERIOD = 240;      /* global slow brightness LFO, seconds */
var LIGHT_COUNT = 340;
var TIDE_ANGLE = 0.62;     /* tide band runs diagonally, radians from horizontal */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var soundOn = false;
var audioCtx = null;
var bed = null;
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
/* ---- seeded field: 340 lights, fixed at load ---- */
var LIGHTS = [];
(function () {
  var rng = mulberry32(1846);
  var i, warm;
  for (i = 0; i < LIGHT_COUNT; i++) {
    warm = rng() < 0.62;   /* 62 percent warm amber, 38 percent cool white */
    LIGHTS.push({
      x: 0.012 + rng() * 0.976,
      y: 0.015 + rng() * 0.970,
      r: 0.0016 + rng() * 0.0028,   /* core radius, fraction of min(VW,VH) */
      warm: warm,
      base: 0.55 + rng() * 0.30,    /* base brightness 0.55 to 0.85 */
      ph: rng() * TAU,              /* individual phase */
      per: 8 + rng() * 12,          /* individual swell period, 8 to 20 s */
      coup: 0.35 + rng() * 0.45     /* coupling to the tide, 0.35 to 0.80 */
    });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The field fills the frame to the edges on every screen: no booth, no DJ,
   no architecture, nothing between the viewer and the floor. */
function fieldRect() {
  return { x: 0, y: 0, w: VW, h: VH };
}
/* ---- the tide: a slow diagonal band of slightly brighter glow ---- */
function tideCoord(fx, fy) {
  var ca = Math.cos(TIDE_ANGLE), sa = Math.sin(TIDE_ANGLE);
  var d = (fx * ca + fy * sa) / (ca + sa);
  return d;   /* 0 at the top-left edge, 1 at the bottom-right edge */
}
function tideCenter(t) {
  return ((t / TIDE_PERIOD) % 1 + 1) % 1;
}
function tideGlow(d, t) {
  var c = tideCenter(t);
  var dist = Math.abs(d - c);
  if (dist > 0.5) dist = 1 - dist;   /* band wraps at the edges */
  var w = 0.20;
  var g = Math.exp(-(dist * dist) / (2 * w * w));
  return g;
}
function lightBrightness(L, t) {
  var d = tideCoord(L.x, L.y);
  var tide = tideGlow(d, t);
  var lfo = 1 + 0.15 * Math.sin(TAU * t / LFO_PERIOD + 0.8);
  var swell = 0.5 + 0.5 * Math.sin(TAU * t / L.per + L.ph);
  var b = L.base * lfo * (0.62 + 0.38 * swell) * (1 + L.coup * 0.85 * tide);
  return clamp(b, 0.05, 1);
}
function drawTideWash(sc, t) {
  var c = tideCenter(t);
  var ca = Math.cos(TIDE_ANGLE), sa = Math.sin(TIDE_ANGLE);
  var cx = sc.x + sc.w * c * ca;
  var cy = sc.y + sc.h * c * sa;
  var R = Math.min(sc.w, sc.h) * 0.42;
  var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  g.addColorStop(0, 'rgba(232,163,61,0.05)');
  g.addColorStop(0.6, 'rgba(232,163,61,0.02)');
  g.addColorStop(1, 'rgba(232,163,61,0)');
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
}
function drawField(sc, t) {
  var i, L, b, px, py, pr, halo, core;
  var m = Math.min(sc.w, sc.h);
  for (i = 0; i < LIGHTS.length; i++) {
    L = LIGHTS[i];
    b = lightBrightness(L, t);
    px = sc.x + L.x * sc.w;
    py = sc.y + L.y * sc.h;
    pr = L.r * m;
    /* soft halo, then the dull-gleam core */
    halo = 0.10 * b;
    ctx.fillStyle = rgba(L.warm ? AMBER : WHITE, halo);
    ctx.beginPath();
    ctx.moveTo(px + pr * 3.2, py);
    ctx.arc(px, py, pr * 3.2, 0, TAU);
    ctx.fill();
    core = 0.28 + 0.62 * b;
    ctx.fillStyle = rgba(L.warm ? AMBER_HI : WHITE_HI, core);
    ctx.beginPath();
    ctx.moveTo(px + pr, py);
    ctx.arc(px, py, pr, 0, TAU);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Four Hours').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Four Hours').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 31').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Four Hours', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 31', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
/* ---- sound: low restless pulse with slow filter tides, tap only ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try { audioCtx = new AudioContext(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function startBed(ac) {
  if (bed) return;
  try {
    var g = ac.createGain();
    g.gain.value = 0.008;
    var f = ac.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 220;
    f.connect(g);
    g.connect(ac.destination);
    var o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.value = 55;
    o.connect(f);
    o.start();
    var lfo = ac.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 1 / 240;
    var lg = ac.createGain();
    lg.gain.value = 120;
    lfo.connect(lg);
    lg.connect(f.frequency);
    lfo.start();
    bed = { osc: o, lfo: lfo, g: g, f: f };
  } catch (e) { bed = null; }
}
function stopBed() {
  if (!bed) return;
  try { bed.osc.stop(); bed.lfo.stop(); bed.g.disconnect(); } catch (e) {}
  bed = null;
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawTideWash(sc, t);
  drawField(sc, t);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    tideCenterAt: function (t) { return tideCenter(t); },
    lightCount: LIGHTS.length,
    meanBrightnessAt: function (t) {
      var s = 0, i;
      for (i = 0; i < LIGHTS.length; i++) s += lightBrightness(LIGHTS[i], t);
      return s / LIGHTS.length;
    }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, tide band at d = 0.083, top-left ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('click', function (ev) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var x = ev.clientX - rect.left;
    var y = ev.clientY - rect.top;
    if (x >= soundPlate.x && x <= soundPlate.x + soundPlate.w && y >= soundPlate.y && y <= soundPlate.y + soundPlate.h) {
      soundOn = !soundOn;
      if (soundOn) {
        var ac = ensureAudio();
        if (ac) startBed(ac);
      } else {
        stopBed();
      }
      draw();
    }
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
