<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9067 · Silt</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#16130f; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(240,233,214,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.75); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another silt</div>
<script>
'use strict';
// No9067 Silt.
// Sediment strata fill the square: stacked bands whose top edges are the
// sum of two slow sine waves. A single near-vertical seam cuts the stack;
// across the seam every band edge steps down or up by a small amount, so
// the layers read as two settled blocks that slipped against each other
// once and then kept settling. Band colors walk a short earth palette by
// small steps, so most neighbors are close in tone and a few are not.
// The subject is the accumulation itself, and the one interruption in it.
// Every seed is composition-checked: the build measures edge relief per
// band and retries with derived seeds until at least five bands are
// strongly relieved and at least two are nearly flat, so each piece has
// both weather and calm in it.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9067', 10) || 9067;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}

const ctx = canvas.getContext('2d');

// Earth palette, ordered light to dark. Bands walk it by small steps.
const PALETTE = ['#eee3c6', '#dec491', '#c99e5f', '#b0763a', '#96502e',
                 '#70452c', '#4e5a55', '#33534b', '#24382f'];
const SEAM_LINE = 'rgba(238,227,198,0.55)';

const SEG = 180; // samples per band edge

// Compose one candidate. Geometry in normalized units (square = 0..1).
function compose(s) {
  const rnd = mulberry32(s);
  const B = 26 + ((rnd() * 9) | 0);               // 26..34 bands

  // Band thicknesses: mostly even strata, a few thin partings, a few beds.
  const thick = new Float64Array(B);
  let total = 0;
  for (let i = 0; i < B; i++) {
    const r = rnd();
    thick[i] = r < 0.18 ? 0.35 + rnd() * 0.3 : (r > 0.86 ? 1.35 + rnd() * 0.55 : 0.8 + rnd() * 0.55);
    total += thick[i];
  }
  const tops = new Float64Array(B + 1);
  let acc = 0;
  for (let i = 0; i < B; i++) { tops[i] = acc / total; acc += thick[i]; }
  tops[B] = 1;

  // Per-edge wave parameters. Amplitude envelope varies slowly down the
  // stack: quiet at the top, weathered in the middle, quiet again below.
  const edges = [];
  for (let i = 0; i <= B; i++) {
    const depth = i / B;
    const env = 0.25 + 0.75 * Math.sin(Math.PI * Math.min(1, Math.max(0, depth * 1.08)));
    const a1 = (0.002 + rnd() * 0.016) * env;
    const a2 = (0.001 + rnd() * 0.007) * env;
    edges.push({
      a1, a2,
      k1: 1.1 + rnd() * 1.6, k2: 2.6 + rnd() * 2.8,
      p1: rnd() * Math.PI * 2, p2: rnd() * Math.PI * 2,
    });
  }

  // Seam: near-vertical, wandering slightly; per-edge step across it.
  const seamX = 0.56 + rnd() * 0.14;              // 0.56..0.70 of width
  const seamWander = 0.008 + rnd() * 0.016;
  const seamFreq = 1.5 + rnd() * 2.0;
  const seamPhase = rnd() * Math.PI * 2;
  const stepBase = 0.004 + rnd() * 0.006;
  const steps = new Float64Array(B + 1);
  for (let i = 0; i <= B; i++) steps[i] = (rnd() < 0.5 ? -1 : 1) * stepBase * (0.4 + rnd() * 0.9);
  // Pin the outer edges flat: the top edge is the surface and the bottom
  // edge is the floor. Waved, they would leave dark bites of page bg
  // inside the square at the top and bottom.
  edges[0].a1 = 0; edges[0].a2 = 0; steps[0] = 0;
  edges[B].a1 = 0; edges[B].a2 = 0; steps[B] = 0;

  // Palette walk: start light, take small steps, drift darker downward.
  const colors = [];
  let ci = (rnd() * 2) | 0;
  for (let i = 0; i < B; i++) {
    // Never two identical neighbors: same-color bands merge into one
    // visual slab and the stack loses its count.
    if (i > 0 && PALETTE[ci] === colors[i - 1]) ci = ci < PALETTE.length - 1 ? ci + 1 : ci - 1;
    colors.push(PALETTE[ci]);
    const drift = (i / B) * 1.1;
    let step = ((rnd() * 3) | 0) - 1;              // -1, 0, +1
    if (rnd() < drift * 0.35) step += 1;
    ci = Math.max(0, Math.min(PALETTE.length - 1, ci + step));
  }

  // Edge heights sampled, relief measured.
  const ys = new Float64Array((B + 1) * SEG);
  let relieved = 0, calm = 0;
  for (let i = 0; i <= B; i++) {
    const e = edges[i];
    let mn = Infinity, mx = -Infinity;
    for (let k = 0; k < SEG; k++) {
      const x = k / (SEG - 1);
      const seam = seamX + seamWander * Math.sin(x * 0 + seamPhase + tops[i] * seamFreq * Math.PI);
      const y = tops[i]
        + e.a1 * Math.sin(x * e.k1 * Math.PI * 2 + e.p1)
        + e.a2 * Math.sin(x * e.k2 * Math.PI * 2 + e.p2)
        + (x > seam ? steps[i] : 0);
      ys[i * SEG + k] = y;
      if (y < mn) mn = y;
      if (y > mx) mx = y;
    }
    const relief = mx - mn;
    if (relief > 0.020) relieved++;
    if (relief < 0.007) calm++;
  }

  return { B, tops, edges, ys, colors, seamX, seamWander, seamFreq, seamPhase, steps, relieved, calm };
}

function buildPiece(baseSeed) {
  let best = null, bestScore = -1;
  for (let attempt = 0; attempt < 16; attempt++) {
    const s = (baseSeed + attempt * 0x9E3779B9) >>> 0;
    const p = compose(s);
    const score = Math.min(p.relieved, 8) + Math.min(p.calm, 4);
    if (score > bestScore) { bestScore = score; best = p; }
    if (p.relieved >= 5 && p.calm >= 2) return p;
  }
  return best;
}

let piece = null;

function seamAt(p, yNorm) {
  return p.seamX + p.seamWander * Math.sin(p.seamPhase + yNorm * p.seamFreq * Math.PI);
}

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.fillStyle = '#16130f';
  ctx.fillRect(0, 0, w, h);
  // Portrait phones go full-bleed: a centered square leaves the artwork
  // small and adrift in a tall viewport. Landscape keeps the square.
  const portrait = h > w * 1.15;
  const RX = portrait ? w : Math.min(w, h);
  const RY = portrait ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  ctx.save();
  ctx.beginPath();
  ctx.rect(ox, oy, RX, RY);
  ctx.clip();

  // Bands: fill from this edge down to the next edge.
  for (let i = 0; i < p.B; i++) {
    ctx.fillStyle = p.colors[i];
    ctx.beginPath();
    for (let k = 0; k < SEG; k++) {
      const x = ox + (k / (SEG - 1)) * RX;
      const y = oy + p.ys[i * SEG + k] * RY;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    for (let k = SEG - 1; k >= 0; k--) {
      const x = ox + (k / (SEG - 1)) * RX;
      const y = oy + p.ys[(i + 1) * SEG + k] * RY;
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }

  // Seam: a thin pale line following the cut, so the steps read.
  ctx.strokeStyle = SEAM_LINE;
  ctx.lineWidth = Math.max(1, Math.min(RX, RY) / 720);
  ctx.beginPath();
  for (let k = 0; k <= 60; k++) {
    const yn = k / 60;
    const x = ox + seamAt(p, yn) * RX;
    const y = oy + yn * RY;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Restrained grain.
  const rnd = mulberry32((seed ^ 0x3f51ab) >>> 0);
  for (let g = 0; g < 2400; g++) {
    const x = ox + rnd() * RX, y = oy + rnd() * RY;
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(20,16,10,0.05)' : 'rgba(240,233,214,0.045)';
    ctx.fillRect(x, y, 1, 1);
  }

  ctx.restore();
}

function redraw() {
  piece = buildPiece(seed);
  draw();
}

window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});

draw();
</script>
</body>
</html>
