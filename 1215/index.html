<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Keep It Away From Everything</title>
<style>
  html, body { margin: 0; padding: 0; background: #050508; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- №1215 "Keep It Away From Everything" — Amy Szczepanski study block AS8 ----
  // The archival paradox: a Null_Sets band print in a dark vault, sealed away by
  // concentric rings over two minutes. Black hold: "saved." Then it returns, brighter.

  var T0 = 55;                 // fixed phase of the synchronous first frame (seconds of seal time)
  var CYCLE = 180;             // full cycle length in seal-time seconds
  var CLOSE_END = 120;         // seal closes over [0,120)
  var HOLD_END = 130;          // black hold    [120,130)
  var REOPEN_END = 150;        // reopen        [130,150)
                               // bright hold   [150,180)

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;

  function isPhone(w, h) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return sw < 700 || h > w * 1.15;
  }

  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(sealNow()); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(sealNow()); });
  }

  // ---- the print: 36 flat bands computed from Romeo and Juliet ----
  var TEXT = "But soft! What light through yonder window breaks? It is the east, and Juliet is the sun. " +
    "Arise, fair sun, and kill the envious moon, Who is already sick and pale with grief, " +
    "That thou her maid art far more fair than she: Be not her maid, since she is envious; " +
    "Her vestal livery is but sick and green And none but fools do wear it; cast it off. " +
    "It is my lady, O, it is my love! O, that she knew she were! She speaks yet she says nothing: what of that? " +
    "Her eye discourses; I will answer it. I am too bold, 'tis not to me she speaks: " +
    "Two of the fairest stars in all the heaven, Having some business, do entreat her eyes " +
    "To twinkle in their spheres till they return. What if her eyes were there, they in her head? " +
    "The brightness of her cheek would shame those stars, As daylight doth a lamp; her eyes in heaven " +
    "Would through the airy region stream so bright That birds would sing and think it were not night. " +
    "See, how she leans her cheek upon her hand! O, that I were a glove upon that hand, That I might touch that cheek!";

  var TABLE = ['#E5484D', '#F76B15', '#FFC53D', '#46A758', '#12A594',
               '#0090FF', '#6E56CF', '#D6409F', '#FF4D6D', '#101010'];
  var SHADE = [0.76, 1.0, 1.16];   // flat shade factors by byte-mean mod 3

  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }

  var BYTES = [];
  for (var ti = 0; ti < TEXT.length; ti++) BYTES.push(TEXT.charCodeAt(ti) & 0xff);

  var BANDS = 36, CHUNK = 24;
  var bandBase = [];   // [r,g,b] per band, full saturation, shade applied
  for (var b = 0; b < BANDS; b++) {
    var sum = 0;
    for (var i = 0; i < CHUNK; i++) sum += BYTES[(b * CHUNK + i) % BYTES.length];
    var mean = sum / CHUNK;
    var rgb = hexRgb(TABLE[sum % 10]);
    var sh = SHADE[Math.floor(mean) % 3];
    bandBase.push([Math.min(255, rgb[0] * sh), Math.min(255, rgb[1] * sh), Math.min(255, rgb[2] * sh)]);
  }

  function bandColor(bi, sat, dim) {
    var c = bandBase[bi];
    var lum = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
    var r = (lum + sat * (c[0] - lum)) * dim;
    var g = (lum + sat * (c[1] - lum)) * dim;
    var bl = (lum + sat * (c[2] - lum)) * dim;
    return 'rgb(' + Math.round(Math.max(0, Math.min(255, r))) + ',' +
                    Math.round(Math.max(0, Math.min(255, g))) + ',' +
                    Math.round(Math.max(0, Math.min(255, bl))) + ')';
  }

  function shadeColor(hex, f) {
    var c = hexRgb(hex);
    return 'rgb(' + Math.round(c[0] * f) + ',' + Math.round(c[1] * f) + ',' + Math.round(c[2] * f) + ')';
  }

  function smooth(u) { return u * u * (3 - 2 * u); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---- drag negotiation: seal time is a walk over recorded drag events ----
  var startWall = nowMs();
  var events = [];        // {t: wall seconds since load, dir: 'out'|'in'}
  var dragging = false, lastR = 0, lastPush = -1, lastDir = '';

  function nowMs() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return Date.now();
  }
  function wallNow() { return (nowMs() - startWall) / 1000; }

  function multAt(wt) {
    for (var i = events.length - 1; i >= 0; i--) {
      if (events[i].t <= wt) {
        if (wt - events[i].t <= 1.5) return events[i].dir === 'out' ? 0.4 : 2.2;
        return 1;
      }
    }
    return 1;
  }

  // Integrate seal time from the anchor (seal = T0 at wall 0) to wall time wt,
  // walking the breakpoints where the drag multiplier can change. The multiplier
  // applies only while sealing or reopening; holds always run at rate 1.
  function sealTimeAt(wt) {
    if (wt <= 0) return T0;
    var cuts = [0, wt];
    for (var i = 0; i < events.length; i++) {
      if (events[i].t > 0 && events[i].t < wt) cuts.push(events[i].t);
      var exp = events[i].t + 1.5;
      if (exp > 0 && exp < wt) cuts.push(exp);
    }
    cuts.sort(function (a, b2) { return a - b2; });
    var seal = T0;
    for (var k = 0; k + 1 < cuts.length; k++) {
      var a = cuts[k], segEnd = cuts[k + 1];
      if (segEnd <= a) continue;
      var s = ((seal % CYCLE) + CYCLE) % CYCLE;
      var approach = s < CLOSE_END || (s >= HOLD_END && s < REOPEN_END);
      var m = approach ? multAt(a) : 1;
      seal += (segEnd - a) * m;
    }
    return seal;
  }
  function sealNow() { return sealTimeAt(wallNow()); }

  function pointerPos(e) {
    var x = (e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0));
    var y = (e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0));
    return [x, y];
  }
  function onDown(e) {
    var p = pointerPos(e);
    dragging = true;
    lastR = Math.sqrt((p[0] - W / 2) * (p[0] - W / 2) + (p[1] - H / 2) * (p[1] - H / 2));
    lastDir = '';
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pointerPos(e);
    var r = Math.sqrt((p[0] - W / 2) * (p[0] - W / 2) + (p[1] - H / 2) * (p[1] - H / 2));
    var dir = '';
    if (r > lastR + 1) dir = 'out';
    else if (r < lastR - 1) dir = 'in';
    if (dir) {
      var t = wallNow();
      if (dir !== lastDir || t - lastPush > 0.35) {
        events.push({ t: t, dir: dir });
        if (events.length > 2000) events.splice(0, events.length - 2000);
        lastPush = t; lastDir = dir;
      }
      lastR = r;
    }
  }
  function onUp() { dragging = false; lastDir = ''; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    canvas.addEventListener('touchmove', onMove, { passive: true });
    canvas.addEventListener('touchend', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  // ---- drawing ----
  function draw(seal) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var cx = W / 2, cy = H / 2;
    var base = Math.min(W, H);
    var R0 = 0.34 * base;
    var k = clamp(base / 760, 0.55, 1);        // ring scale (phones: tighter rings)
    var cyc = Math.floor(seal / CYCLE);
    var s = ((seal % CYCLE) + CYCLE) % CYCLE;

    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, W, H);

    var R, sat;
    if (s < CLOSE_END) {
      var u = s / CLOSE_END;
      R = R0 * (1 - smooth(u));
      sat = (cyc === 0) ? 0.88 : 1 - 0.12 * smooth(clamp(s / 10, 0, 1));  // later cycles dim back down from full
    } else if (s < HOLD_END) {
      R = 0; sat = 0.88;
    } else if (s < REOPEN_END) {
      R = R0 * smooth((s - HOLD_END) / (REOPEN_END - HOLD_END));
      sat = 1.0;
    } else {
      R = R0; sat = 1.0;
    }

    if (R > 0.5) {
      var apert = R / R0;
      var dim = apert < 0.3 ? 0.4 + 0.6 * (apert / 0.3) : 1;
      var ringF = 0.5 + 0.5 * apert;           // the room darkens as the seal closes

      // -- rings (drawn first; the disc sits inside the inner ring) --
      var rotA = seal * 0.010, rotB = seal * -0.006, rotC = seal * 0.004;

      // ring C (outer): dark steel with ticks
      ctx.strokeStyle = shadeColor('#43434A', ringF);
      ctx.lineWidth = 15 * k;
      ctx.beginPath(); ctx.arc(cx, cy, R + 46 * k, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = shadeColor('#6A6A72', ringF);
      ctx.lineWidth = 15 * k;
      for (var c1 = 0; c1 < 18; c1++) {
        var a1 = rotC + c1 * (Math.PI * 2 / 18);
        ctx.beginPath(); ctx.arc(cx, cy, R + 46 * k, a1, a1 + 0.05); ctx.stroke();
      }
      // ring B (middle): steel with lighter segment arcs
      ctx.strokeStyle = shadeColor('#55555C', ringF);
      ctx.lineWidth = 11 * k;
      ctx.beginPath(); ctx.arc(cx, cy, R + 26 * k, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = shadeColor('#7A7A82', ringF);
      for (var c2 = 0; c2 < 6; c2++) {
        var a2 = rotB + c2 * (Math.PI * 2 / 6);
        ctx.beginPath(); ctx.arc(cx, cy, R + 26 * k, a2, a2 + 0.5); ctx.stroke();
      }
      // ring A (inner): steel with amber warning ticks
      ctx.strokeStyle = shadeColor('#6A6A72', ringF);
      ctx.lineWidth = 7 * k;
      ctx.beginPath(); ctx.arc(cx, cy, R + 10 * k, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = shadeColor('#FFB000', ringF);
      for (var c3 = 0; c3 < 12; c3++) {
        var a3 = rotA + c3 * (Math.PI * 2 / 12);
        ctx.beginPath(); ctx.arc(cx, cy, R + 10 * k, a3, a3 + 0.10); ctx.stroke();
      }

      // -- the print: bands clipped to the disc --
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
      var bandH = (2 * R) / BANDS;
      for (var bi = 0; bi < BANDS; bi++) {
        ctx.fillStyle = bandColor(bi, sat, dim);
        ctx.fillRect(cx - R, cy - R + bi * bandH, 2 * R, bandH + 1);
      }
      ctx.restore();
    }

    // -- black hold: the only text in the piece --
    if (s >= CLOSE_END && s < HOLD_END) {
      var alpha = clamp((s - CLOSE_END - 1) / 0.8, 0, 1) * clamp((HOLD_END - s) / 1, 0, 1);
      if (alpha > 0) {
        ctx.fillStyle = 'rgba(200,200,200,' + alpha.toFixed(3) + ')';
        ctx.font = Math.round(base * 0.035) + 'px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('saved.', cx, cy);
      }
    }
  }

  resize();
  draw(T0);   // synchronous fixed-phase first frame

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(sealNow());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
