<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.280 Calabash</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0D; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.280 Calabash (Njalikwa Chongwe).
// A squat calabash pot with small lug nubs at the shoulder,
// banded in earthy brown and sea-green, breathing very
// slowly while its band boundaries drift vertically on
// staggered sine phases like a slow tide, and fine speckle
// drifts upward across its surface and wraps. Watch only:
// there are no interaction handlers.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0B0B0D', BROWN = '#7A5B3F', SEA = '#6FA08C';
var INTERIOR = '#141210', SPECKLE = '#EFE6D2';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var T = 9, lastNow = -1; // frame one: loop at about 9s, bands already offset

function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- the vessel profile -------------------------------------------------
// Squat calabash, centred and large: top at y 190, foot at
// y 730 in the 1280 by 900 design space, so the vessel is
// 540 tall and up to about 670 wide at the belly, with
// generous near-black margins all round. The lathe width
// is a piecewise function of height, smoothstep
// interpolated between knots.
var CX = 640, VTOP = 190, VBOT = 730, VH = VBOT - VTOP;
var PROFILE = [
  [0.00, 118], [0.04, 122], [0.10, 106], [0.18, 132],
  [0.22, 166], [0.28, 205], [0.35, 250], [0.42, 288],
  [0.50, 316], [0.58, 332], [0.70, 330], [0.76, 312],
  [0.82, 282], [0.87, 242], [0.91, 205], [0.97, 138],
  [1.00, 122]
];
var BREATHE_W = [
  [0.00, -0.3], [0.10, -0.8], [0.18, -0.5], [0.28, 0.1],
  [0.42, 0.7], [0.58, 1.0], [0.70, 0.95], [0.82, 0.6],
  [0.91, 0.25], [1.00, 0.0]
];
function interp(knots, v) {
  if (v <= knots[0][0]) return knots[0][1];
  for (var i = 0; i < knots.length - 1; i++) {
    var a = knots[i], b = knots[i + 1];
    if (v <= b[0]) {
      var f = (v - a[0]) / (b[0] - a[0]);
      var s = f * f * (3 - 2 * f);
      return a[1] + (b[1] - a[1]) * s;
    }
  }
  return knots[knots.length - 1][1];
}
function halfWidth(y) {
  var v = (y - VTOP) / VH;
  var breathe = Math.sin(T * Math.PI * 2 / 36);
  var factor = 1 + 0.022 * breathe * interp(BREATHE_W, v);
  var w = interp(PROFILE, v) * factor;
  // small lug nubs at the shoulder: a narrow outward bump
  // centred at 26 percent down, part of the silhouette
  var d = (v - 0.25) / 0.032;
  w += 24 * Math.exp(-d * d);
  return w;
}
function profilePath() {
  var N = 84, i, y;
  ctx.beginPath();
  ctx.moveTo(CX - halfWidth(VTOP), VTOP);
  for (i = 1; i <= N; i++) {
    y = VTOP + VH * i / N;
    ctx.lineTo(CX - halfWidth(y), y);
  }
  ctx.lineTo(CX + halfWidth(VBOT), VBOT);
  for (i = N - 1; i >= 0; i--) {
    y = VTOP + VH * i / N;
    ctx.lineTo(CX + halfWidth(y), y);
  }
  ctx.closePath();
}

// ---- the bands ------------------------------------------------------------
// Horizontal bands alternating brown and sea-green. Each
// boundary drifts vertically on its own staggered sine
// phase over the 36 second loop, amplitude 14 px, so the
// bands slide like a slow tide rather than marching in
// lockstep. Flat fills only.
var BH = 90;
var BANDCOL = [BROWN, SEA];
function boundaryY(k) {
  var base = VTOP + k * BH;
  var phase = k * 0.95;
  return base + 14 * Math.sin(T * Math.PI * 2 / 36 + phase);
}

// ---- speckle ----------------------------------------------------------------
// About 200 speckle particles stored as data: a height
// fraction, a lateral fraction of the local half width, a
// size, an alpha and an upward speed. The height drifts
// up slowly and wraps from the mouth back to the foot.
var SPECKS = [];
(function () {
  var r = rng(28041);
  for (var i = 0; i < 200; i++) {
    SPECKS.push({
      v: r(),
      f: r() * 2 - 1,
      size: 0.9 + r() * 2.0,
      alpha: 0.07 + r() * 0.25,
      speed: 0.004 + r() * 0.009
    });
  }
})();

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-20, -20, DW + 40, DH + 40);
  ctx.save();
  profilePath();
  ctx.clip();
  // the banded body, each band filled between its own two
  // drifting boundaries
  for (var k = -1; k <= 7; k++) {
    var y0 = boundaryY(k), y1 = boundaryY(k + 1);
    ctx.fillStyle = BANDCOL[((k % 2) + 2) % 2];
    ctx.fillRect(CX - 380, y0 - 1, 760, (y1 - y0) + 2);
  }
  // fine speckle drifting up and wrapping, clipped to the pot
  ctx.fillStyle = SPECKLE;
  for (var i = 0; i < SPECKS.length; i++) {
    var sp = SPECKS[i];
    var vv = sp.v - T * sp.speed;
    vv = vv - Math.floor(vv);
    var y = VTOP + vv * VH;
    var x = CX + sp.f * halfWidth(y) * 0.92;
    ctx.globalAlpha = sp.alpha;
    ctx.beginPath();
    ctx.arc(x, y, sp.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // the mouth: a dark ellipse at the rim
  ctx.fillStyle = INTERIOR;
  ctx.beginPath();
  ctx.ellipse(CX, VTOP, halfWidth(VTOP) * 0.88, 19, 0, 0, Math.PI * 2);
  ctx.fill();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the vessel keeps its shape at any aspect,
  // with the page ground in the piece's near-black ground
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
