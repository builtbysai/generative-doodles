<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.217 Antipode</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A0A0C; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.217 Antipode (David Bowen). A pink foam relief of the point on
// earth exactly opposite the gallery, carved by an unseen CNC: cloud
// and ocean swell topography under raking light. The carving is still,
// as carvings are. Every fifty seconds the finished panel slides into
// the stack at the right and a new antipode scrapes in under a faint
// toolpath shimmer. Dragging across the panel is touching the foam:
// the finger presses a subtly deeper trail that stays on that carving
// until it is replaced. Double tap carves a new antipode now.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0A0A0C';
var FOAM = [232, 168, 184], SHADOW = [200, 120, 152], HIGH = [248, 216, 224], EDGE = '#B87888';
var W = 0, H = 0, phone = false;
var seed = 217217;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
var T = 24, lastNow = -1; // mid-cycle: frame one is a settled carving

// ---- fractal heightfield -------------------------------------------------------
// Value noise with smooth interpolation; four octaves of it give the
// swells, basins and one long coastline curve of the antipode.
function hash2(ix, iy, s) {
  var n = Math.sin(ix * 127.1 + iy * 311.7 + s * 74.7) * 43758.5453;
  return n - Math.floor(n);
}
function vnoise(x, y, s) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  var a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s);
  var c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}
function fbm(x, y, s) {
  var v = 0, amp = 0.55, f = 1, tot = 0;
  for (var o = 0; o < 4; o++) {
    v += vnoise(x * f, y * f, s + o * 13.7) * amp;
    tot += amp; amp *= 0.5; f *= 2.1;
  }
  return v / tot;
}
var GW = 150, GH = 100, SW = 75, SH = 50;
// A carving: a height grid, a pressure grid (the touch record), and a
// precomputed shaded colour per cell - all plain JS data, redrawn
// directly each frame.
function makeCarving(cseed, gw, gh) {
  var heights = new Float32Array(gw * gh);
  for (var j = 0; j < gh; j++) {
    for (var i = 0; i < gw; i++) {
      var u = i / (gw - 1), v = j / (gh - 1);
      var hgt = fbm(u * 5.2, v * 3.5, cseed);
      hgt += 0.16 * Math.sin(u * 4.1 + cseed * 0.7) * Math.cos(v * 3.3 + cseed * 0.3); // long swells
      hgt = Math.pow(clamp(hgt, 0, 1), 1.5);
      // soften toward the panel rim: carved foam keeps a quiet border
      var rim = Math.min(u, 1 - u, v, 1 - v);
      heights[j * gw + i] = hgt * (0.35 + 0.65 * smooth(rim / 0.10));
    }
  }
  var carv = { seed: cseed, gw: gw, gh: gh, heights: heights,
               pressure: new Float32Array(gw * gh), colors: null };
  shadeCarving(carv, 0, 0, gw - 1, gh - 1);
  return carv;
}
// Hillshade: light rakes in from the upper left; colour walks the foam
// ramp shadow -> base -> highlight by the dot of normal and light.
// Pressure deepens the surface, so a touch reads as a real groove.
var LX = -0.52, LY = -0.62, LZ = 0.59, FLAT_D = 0;
(function () { var m = Math.sqrt(LX * LX + LY * LY + LZ * LZ); LX /= m; LY /= m; LZ /= m; FLAT_D = LZ; })();
function cellShade(carv, i, j) {
  var gw = carv.gw, gh = carv.gh, hs = carv.heights, ps = carv.pressure;
  function eff(ii, jj) {
    ii = clamp(ii, 0, gw - 1); jj = clamp(jj, 0, gh - 1);
    var k = jj * gw + ii;
    return hs[k] - ps[k] * 0.9;
  }
  var dzdx = (eff(i + 1, j) - eff(i - 1, j)) * 6.5;
  var dzdy = (eff(i, j + 1) - eff(i, j - 1)) * 6.5;
  var nx = -dzdx, ny = -dzdy, nz = 1;
  var m = Math.sqrt(nx * nx + ny * ny + nz * nz);
  var d = (nx * LX + ny * LY + nz * LZ) / m;
  var t = clamp(0.5 + (d - FLAT_D) * 2.4, 0, 1); // flat foam sits mid-ramp
  var r, g, b;
  if (t < 0.5) { var k2 = t * 2; r = lerp(SHADOW[0], FOAM[0], k2); g = lerp(SHADOW[1], FOAM[1], k2); b = lerp(SHADOW[2], FOAM[2], k2); }
  else { var k3 = (t - 0.5) * 2; r = lerp(FOAM[0], HIGH[0], k3); g = lerp(FOAM[1], HIGH[1], k3); b = lerp(FOAM[2], HIGH[2], k3); }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}
function shadeCarving(carv, i0, j0, i1, j1) {
  if (!carv.colors) carv.colors = new Array(carv.gw * carv.gh);
  i0 = clamp(i0, 0, carv.gw - 1); i1 = clamp(i1, 0, carv.gw - 1);
  j0 = clamp(j0, 0, carv.gh - 1); j1 = clamp(j1, 0, carv.gh - 1);
  for (var j = j0; j <= j1; j++)
    for (var i = i0; i <= i1; i++)
      carv.colors[j * carv.gw + i] = cellShade(carv, i, j);
}

// ---- the stack -------------------------------------------------------------------
var carveCount = 0;
var current = makeCarving(seed, GW, GH);
var older1 = makeCarving(seed + 1013, SW, SH);
var older2 = makeCarving(seed + 2027, SW, SH);
// frame one already carries a faint touch: someone pressed the foam
// here before us, one slow curve across the panel.
(function () {
  for (var s = 0; s <= 60; s++) {
    var u = 0.16 + 0.62 * (s / 60);
    var v = 0.60 + 0.14 * Math.sin(s / 60 * 5.2 + 1.1);
    stampPressure(current, u * GW, v * GH, 3.2, 0.016);
  }
  shadeCarving(current, 0, 0, GW - 1, GH - 1);
})();
function stampPressure(carv, gx, gy, radCells, amt) {
  var i0 = Math.floor(gx - radCells), i1 = Math.ceil(gx + radCells);
  var j0 = Math.floor(gy - radCells), j1 = Math.ceil(gy + radCells);
  for (var j = j0; j <= j1; j++) {
    for (var i = i0; i <= i1; i++) {
      if (i < 0 || j < 0 || i >= carv.gw || j >= carv.gh) continue;
      var d = Math.sqrt((i - gx) * (i - gx) + (j - gy) * (j - gy));
      if (d < radCells) {
        var fall = 1 - d / radCells;
        var k = j * carv.gw + i;
        carv.pressure[k] = Math.min(1, carv.pressure[k] + amt * fall * fall);
      }
    }
  }
  shadeCarving(carv, i0 - 1, j0 - 1, i1 + 1, j1 + 1);
}

// ---- carving cycle -----------------------------------------------------------------
var CYCLE = 50, CARVE_LEN = 4;
var mode = 'idle', carveT0 = 0, nextCarveAt = 50, incoming = null, outgoing = null;
function startCarve() {
  if (mode === 'carve') return;
  carveCount++;
  incoming = makeCarving(seed + carveCount * 7919, GW, GH);
  outgoing = current;
  mode = 'carve'; carveT0 = T;
}
function finishCarve() {
  older2 = older1; older1 = outgoing; current = incoming;
  incoming = null; outgoing = null; mode = 'idle';
}

// ---- layout ---------------------------------------------------------------------------
function layout() {
  var mainW, mainCx, mainCy;
  if (phone) {
    mainW = Math.min(W * 0.94, H * 0.52 * 1.5);
    mainCx = W * 0.5; mainCy = H * 0.40;
  } else {
    mainW = Math.min(W * 0.65, H * 0.80 * 1.5);
    mainCx = W * 0.43; mainCy = H * 0.5;
  }
  var main = { x: mainCx - mainW / 2, y: mainCy - mainW / 3, w: mainW, h: mainW / 1.5, rot: 0 };
  var s1, s2;
  if (phone) {
    var w1 = W * 0.44;
    s1 = { x: W * 0.60, y: H * 0.70, w: w1, h: w1 / 1.5, rot: -0.05 };
    s2 = { x: W * 0.70, y: H * 0.80, w: w1 * 0.9, h: w1 * 0.9 / 1.5, rot: 0.06 };
  } else {
    var w2 = W * 0.30;
    s1 = { x: W * 0.815, y: H * 0.16, w: w2, h: w2 / 1.5, rot: -0.055 };
    s2 = { x: W * 0.845, y: H * 0.56, w: w2 * 0.94, h: w2 * 0.94 / 1.5, rot: 0.05 };
  }
  return { main: main, s1: s1, s2: s2 };
}
function drawPanel(carv, rect, alpha, reveal) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(rect.x + rect.w / 2, rect.y + rect.h / 2);
  ctx.rotate(rect.rot || 0);
  ctx.translate(-rect.w / 2, -rect.h / 2);
  // the foam block's edge: a darker slab peeking below-right
  var th = Math.max(4, rect.w * 0.012);
  ctx.fillStyle = EDGE;
  ctx.fillRect(th, th, rect.w, rect.h);
  var cw = rect.w / carv.gw, ch = rect.h / carv.gh;
  var rowsAll = carv.gh;
  var rowsDone = reveal < 1 ? Math.floor(rowsAll * reveal) : rowsAll;
  for (var j = 0; j < rowsAll; j++) {
    var y = j * ch;
    if (j < rowsDone) {
      for (var i = 0; i < carv.gw; i++) {
        ctx.fillStyle = carv.colors[j * carv.gw + i];
        ctx.fillRect(i * cw, y, cw + 0.6, ch + 0.6);
      }
    } else {
      // uncut foam ahead of the tool: flat, a whisper darker
      ctx.fillStyle = 'rgb(214,150,168)';
      ctx.fillRect(0, y, rect.w, ch + 0.6);
    }
  }
  if (reveal < 1) {
    // toolpath shimmer: faint horizontal passes sweeping the panel
    ctx.globalAlpha = alpha * 0.30;
    ctx.fillStyle = 'rgb(248,216,224)';
    for (var sLine = 0; sLine < 4; sLine++) {
      var yy = ((reveal * 1.6 + sLine * 0.27) % 1) * rect.h;
      ctx.fillRect(0, yy, rect.w, Math.max(1, rect.h * 0.006));
    }
    ctx.globalAlpha = alpha * 0.55;
    ctx.fillRect(0, rowsDone * ch, rect.w, Math.max(1.5, rect.h * 0.008));
    ctx.globalAlpha = alpha;
  }
  ctx.strokeStyle = EDGE;
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, rect.w, rect.h);
  ctx.restore();
}

// ---- input: touch the foam, double tap to carve ---------------------------------------
var dragging = false, lastPX = 0, lastPY = 0, lastDownT = -9, dragMoved = 0;
function panelPoint(e) {
  var r = canvas.getBoundingClientRect();
  var lay = layout();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  return { x: x, y: y, main: lay.main,
           inside: x >= lay.main.x && x <= lay.main.x + lay.main.w &&
                   y >= lay.main.y && y <= lay.main.y + lay.main.h };
}
function applyTouch(x, y, main) {
  var gx = (x - main.x) / main.w * GW;
  var gy = (y - main.y) / main.h * GH;
  var radCells = 40 / (main.w / GW); // ~40px press radius, in cells
  stampPressure(current, gx, gy, radCells, 0.10);
}
canvas.addEventListener('pointerdown', function (e) {
  var p = panelPoint(e);
  if (T - lastDownT < 0.35 && dragMoved < 6) { startCarve(); lastDownT = -9; dragging = false; return; }
  lastDownT = T; dragMoved = 0;
  if (p.inside && mode === 'idle') { dragging = true; lastPX = p.x; lastPY = p.y; applyTouch(p.x, p.y, p.main); }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = panelPoint(e);
  dragMoved += Math.abs(p.x - lastPX) + Math.abs(p.y - lastPY);
  if (p.inside && mode === 'idle') {
    // stamp along the drag segment so fast fingers leave a whole trail
    var steps = Math.max(1, Math.ceil(Math.hypot(p.x - lastPX, p.y - lastPY) / 9));
    for (var s = 1; s <= steps; s++)
      applyTouch(lerp(lastPX, p.x, s / steps), lerp(lastPY, p.y, s / steps), p.main);
  }
  lastPX = p.x; lastPY = p.y;
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing -----------------------------------------------------------------------------
function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  if (mode === 'idle' && T >= nextCarveAt) startCarve();
  if (mode === 'carve' && T - carveT0 >= CARVE_LEN) { finishCarve(); nextCarveAt = carveT0 + CYCLE; }
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var lay = layout();
  if (mode === 'idle') {
    drawPanel(older2, lay.s2, 0.92, 1);
    drawPanel(older1, lay.s1, 0.96, 1);
    drawPanel(current, lay.main, 1, 1);
  } else {
    var k = smooth((T - carveT0) / CARVE_LEN);
    // the stack shuffles down one slot while the finished carving
    // slides over to join it, and the new antipode scrapes in
    var outRect = { x: lerp(lay.main.x, lay.s1.x, k), y: lerp(lay.main.y, lay.s1.y, k),
                    w: lerp(lay.main.w, lay.s1.w, k), h: lerp(lay.main.h, lay.s1.h, k),
                    rot: lerp(0, lay.s1.rot, k) };
    var s1Rect = { x: lerp(lay.s1.x, lay.s2.x, k), y: lerp(lay.s1.y, lay.s2.y, k),
                   w: lerp(lay.s1.w, lay.s2.w, k), h: lerp(lay.s1.h, lay.s2.h, k),
                   rot: lerp(lay.s1.rot, lay.s2.rot, k) };
    drawPanel(older2, lay.s2, 0.92 * (1 - k), 1);
    drawPanel(older1, s1Rect, 0.96, 1);
    drawPanel(outgoing, outRect, 1, 1);
    drawPanel(incoming, lay.main, 1, k);
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
