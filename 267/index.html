<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.267 Living Vessels</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#A8C4D6; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.267 Living Vessels (Shupiwe Chongwe). After Vessel
// at Likir: an open dusty field backed by a low stone
// wall and arid mountains, about twenty six rough
// unfired clay vessels standing on flat stones, straw
// flecked mud surfaces, each holding a hidden seed.
// A slow irreversible progression over about 75 seconds:
// cracks spread, rims soften, patina darkens toward the
// eroded dark, then green shoots rise from the mouths,
// each vessel on its own threshold. Nothing resets.
// After the change only sprout sway and wind dust move.
// Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CLAY = '#B4653A', STRAW = '#D4A95C', MUD = '#8A5A3B', ERODED = '#5A3A26', STONE = '#9A958A', MOUNT = '#6B7B84', SPROUT = '#5E8C4A', STREAM = '#7A9B6D', SKY = '#A8C4D6';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 26, lastNow = -1; // frame one: erosion well underway, first sprouts showing

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

// ---- mountains: two arid ridges across the upper third ------------------------------
function ridge(seed, base, lo, hi) {
  var r = rng(seed), pts = [], x = -20;
  pts.push({ x: -20, y: base });
  while (x < DW + 20) {
    var wdt = 70 + r() * 110;
    var pk = lo + r() * (hi - lo);
    pts.push({ x: x + wdt * (0.32 + r() * 0.25), y: pk });
    pts.push({ x: x + wdt * (0.55 + r() * 0.2), y: pk + 6 + r() * 18 });
    x += wdt;
    pts.push({ x: x, y: base - 34 - r() * 36 });
  }
  pts.push({ x: DW + 20, y: base });
  return pts;
}
var ridgeFar = ridge(26711, 302, 96, 190);
var ridgeNear = ridge(26723, 316, 168, 252);

// ---- the low stone wall ----------------------------------------------------------------
var wallStones = [];
(function () {
  var r = rng(26731);
  for (var row = 0; row < 2; row++) {
    var x = -10 + (row ? -26 : 0);
    while (x < DW + 10) {
      var bw = 58 + r() * 44;
      wallStones.push({ x: x, y: 286 + row * 22, w: bw, h: 20, tone: (r() - 0.5) * 0.22, a: 0.85 + r() * 0.15 });
      x += bw + 3;
    }
  }
})();

// ---- field grain and dust ---------------------------------------------------------------
var grain = [];
(function () {
  var r = rng(26741);
  for (var i = 0; i < 750; i++) grain.push({ x: r() * DW, y: 330 + r() * (DH - 330), s: 0.8 + r() * 2.0, a: 0.05 + r() * 0.10, dark: r() < 0.55 });
})();
var motes = [];
(function () {
  var r = rng(26753);
  for (var i = 0; i < 46; i++) motes.push({ x: r() * DW, y: 350 + r() * 430, s: 0.9 + r() * 1.7, ph: r() * Math.PI * 2, sp: 0.5 + r() * 0.9, a: 0.14 + r() * 0.22 });
})();

// ---- the vessels: 26, in loose groups of 2 to 4 on flat stones --------------------------
var tones = [CLAY, CLAY, MUD, CLAY, MUD];
var groups = [
  { x: 122, y: 540, n: 3 }, { x: 278, y: 578, n: 4 }, { x: 434, y: 538, n: 3 },
  { x: 590, y: 592, n: 4 }, { x: 742, y: 546, n: 3 }, { x: 898, y: 586, n: 4 },
  { x: 1052, y: 542, n: 3 }, { x: 1190, y: 580, n: 2 }
];
var vessels = [], groupStones = [];
(function () {
  var r = rng(26767);
  for (var g = 0; g < groups.length; g++) {
    var gp = groups[g];
    groupStones.push({ x: gp.x, y: gp.y + 8, rx: gp.n * 27 + 34 + r() * 14, ry: 13 + r() * 4, tone: (r() - 0.5) * 0.2 });
    for (var i = 0; i < gp.n; i++) {
      var sc = 0.78 + r() * 0.55;
      var v = {
        x: gp.x + (i - (gp.n - 1) / 2) * 40 + (r() - 0.5) * 12,
        baseY: gp.y + (r() - 0.5) * 20 + i * 3,
        w: 50 * sc * (0.88 + r() * 0.24),
        h: 66 * sc * (0.85 + r() * 0.42),
        tone: tones[Math.floor(r() * tones.length)],
        delay: r() * 0.38,
        crackDelay: 0.05 + r() * 0.3,
        thresh: 0.20 + r() * 0.42,
        ph: r() * Math.PI * 2,
        sproutScale: 0.75 + r() * 0.6,
        flecks: [], cracks: [], patches: []
      };
      var rf = rng(26800 + vessels.length * 17);
      for (var f = 0; f < 15; f++) v.flecks.push({ u: (rf() - 0.5) * 0.86, v: 0.08 + rf() * 0.82, len: 2 + rf() * 3, ang: (rf() - 0.5) * 1.1, a: 0.18 + rf() * 0.28 });
      for (var c = 0; c < 3; c++) {
        var pts = [], cx = (rf() - 0.5) * 0.36, cy = 0.06 + rf() * 0.22;
        pts.push({ u: cx, v: cy });
        for (var sg = 0; sg < 4; sg++) { cx += (rf() - 0.5) * 0.13; cy += 0.13 + rf() * 0.08; pts.push({ u: cx, v: Math.min(0.94, cy) }); }
        v.cracks.push(pts);
      }
      for (var pt = 0; pt < 3; pt++) v.patches.push({ u: (rf() - 0.5) * 0.6, v: 0.25 + rf() * 0.6, rx: 0.16 + rf() * 0.2, a: 0.10 + rf() * 0.12 });
      vessels.push(v);
    }
  }
  vessels.sort(function (a, b) { return a.baseY - b.baseY; });
})();

function traceVessel(v, soft) {
  var x = v.x, by = v.baseY, w = v.w, h = v.h;
  var rimW = w * (0.30 - 0.035 * soft);
  ctx.beginPath();
  ctx.moveTo(x - w * 0.30, by);
  ctx.bezierCurveTo(x - w * 0.54, by - h * 0.10, x - w * 0.55, by - h * 0.42, x - w * 0.40, by - h * 0.72);
  ctx.bezierCurveTo(x - w * 0.33, by - h * 0.86, x - rimW, by - h * 0.90, x - rimW, by - h * (0.985 + 0.012 * soft));
  ctx.lineTo(x + rimW, by - h * (0.985 - 0.010 * soft));
  ctx.bezierCurveTo(x + rimW, by - h * 0.90, x + w * 0.33, by - h * 0.86, x + w * 0.40, by - h * 0.72);
  ctx.bezierCurveTo(x + w * 0.55, by - h * 0.42, x + w * 0.54, by - h * 0.10, x + w * 0.30, by);
  ctx.bezierCurveTo(x + w * 0.14, by + h * 0.035, x - w * 0.14, by + h * 0.035, x - w * 0.30, by);
  ctx.closePath();
}

function drawVessel(v, p) {
  var er = clamp01(p * 1.25 - v.delay * 0.45); // this vessel's erosion
  var crackP = clamp01((p - v.crackDelay) / Math.max(0.2, 1 - v.crackDelay));
  // its own flat stone
  ctx.fillStyle = rgba(ERODED, 0.30);
  ctx.beginPath(); ctx.ellipse(v.x, v.baseY + 6, v.w * 0.78, 7.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = mix(STONE, ERODED, 0.18);
  ctx.beginPath(); ctx.ellipse(v.x, v.baseY + 3.5, v.w * 0.74, 6.5, 0, 0, Math.PI * 2); ctx.fill();
  // body
  traceVessel(v, er);
  ctx.fillStyle = mix(v.tone, ERODED, 0.10 + 0.48 * er);
  ctx.fill();
  ctx.save();
  traceVessel(v, er);
  ctx.clip();
  // shaded flank and a lit flank
  ctx.fillStyle = rgba(ERODED, 0.20);
  ctx.fillRect(v.x + v.w * 0.16, v.baseY - v.h, v.w * 0.42, v.h);
  ctx.fillStyle = rgba(STRAW, 0.13);
  ctx.fillRect(v.x - v.w * 0.46, v.baseY - v.h, v.w * 0.24, v.h);
  // patina patches, deepening with erosion
  for (var pt = 0; pt < v.patches.length; pt++) {
    var pa = v.patches[pt];
    ctx.fillStyle = rgba(ERODED, pa.a * (0.35 + er));
    ctx.beginPath(); ctx.ellipse(v.x + pa.u * v.w, v.baseY - pa.v * v.h, pa.rx * v.w, pa.rx * v.h * 0.7, 0.4, 0, Math.PI * 2); ctx.fill();
  }
  // straw flecks in the mud surface
  for (var f = 0; f < v.flecks.length; f++) {
    var fl = v.flecks[f];
    var fx = v.x + fl.u * v.w, fy = v.baseY - fl.v * v.h;
    ctx.strokeStyle = rgba(STRAW, fl.a);
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + Math.cos(fl.ang) * fl.len, fy + Math.sin(fl.ang) * fl.len); ctx.stroke();
  }
  // cracks, drawn in proportion to this vessel's crack progress
  if (crackP > 0) {
    ctx.strokeStyle = rgba(ERODED, 0.78);
    ctx.lineWidth = 1.4;
    for (var c = 0; c < v.cracks.length; c++) {
      var pts = v.cracks[c];
      var upto = crackP * (pts.length - 1);
      ctx.beginPath();
      ctx.moveTo(v.x + pts[0].u * v.w, v.baseY - pts[0].v * v.h);
      for (var sg = 1; sg < pts.length; sg++) {
        if (sg > upto + 1) break;
        var frac = Math.min(1, upto - (sg - 1));
        var px = v.x + (pts[sg - 1].u + (pts[sg].u - pts[sg - 1].u) * frac) * v.w;
        var py = v.baseY - (pts[sg - 1].v + (pts[sg].v - pts[sg - 1].v) * frac) * v.h;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
  // mouth: dark opening, rim softening as erosion grows
  var rimW2 = v.w * (0.30 - 0.035 * er);
  ctx.fillStyle = rgba(ERODED, 0.92);
  ctx.beginPath(); ctx.ellipse(v.x, v.baseY - v.h * 0.985, rimW2, rimW2 * 0.34, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = rgba(mix(v.tone, ERODED, 0.25 + 0.4 * er), 0.9);
  ctx.lineWidth = 2 - 0.7 * er;
  ctx.beginPath(); ctx.ellipse(v.x, v.baseY - v.h * 0.985, rimW2, rimW2 * 0.34, 0, 0, Math.PI * 2); ctx.stroke();
  // the sprout, once erosion passes this vessel's threshold
  var g = smooth((p - v.thresh) / 0.22);
  if (g > 0) {
    var sway = Math.sin(T * 0.85 + v.ph) * 3.2 * g;
    var L = g * 44 * v.sproutScale * (v.h / 66);
    var mx = v.x, my = v.baseY - v.h * 0.985;
    var stem = [];
    for (var k = 0; k <= 4; k++) {
      var tt = k / 4;
      stem.push({ x: mx + sway * tt * tt + Math.sin(v.ph + tt * 1.6) * 2.4 * tt, y: my - L * tt });
    }
    ctx.strokeStyle = SPROUT;
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(stem[0].x, stem[0].y);
    for (var q = 1; q < stem.length; q++) ctx.lineTo(stem[q].x, stem[q].y);
    ctx.stroke();
    for (var lf = 0; lf < 3; lf++) {
      var lt = 0.45 + lf * 0.26;
      var idx = Math.min(4, Math.round(lt * 4));
      var side = lf % 2 ? 1 : -1;
      var ls = g * (7.5 - lf * 0.9);
      ctx.fillStyle = lf % 2 ? STREAM : SPROUT;
      ctx.beginPath();
      ctx.ellipse(stem[idx].x + side * ls * 0.55, stem[idx].y - ls * 0.3, ls, ls * 0.38, side * -0.55, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = STREAM;
    ctx.beginPath(); ctx.ellipse(stem[4].x, stem[4].y - 2.4, 3.4 * g + 0.6, 2.0 * g + 0.5, sway * 0.06, 0, Math.PI * 2); ctx.fill();
  }
}

function draw() {
  var p = clamp01(T / 75); // the irreversible progression
  // ---- sky --------------------------------------------------------------------------------
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, DW, DH);
  ctx.fillStyle = rgba(SKY, 0.5);
  ctx.fillRect(0, 40, DW, 26);
  // ---- mountains, upper third -------------------------------------------------------------
  ctx.fillStyle = rgba(MOUNT, 0.55);
  ctx.beginPath();
  ctx.moveTo(ridgeFar[0].x, ridgeFar[0].y);
  for (var i = 1; i < ridgeFar.length; i++) ctx.lineTo(ridgeFar[i].x, ridgeFar[i].y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = MOUNT;
  ctx.beginPath();
  ctx.moveTo(ridgeNear[0].x, ridgeNear[0].y);
  for (var j = 1; j < ridgeNear.length; j++) ctx.lineTo(ridgeNear[j].x, ridgeNear[j].y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(SKY, 0.16);
  ctx.beginPath(); ctx.ellipse(330, 224, 300, 20, 0.05, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(940, 258, 320, 18, -0.04, 0, Math.PI * 2); ctx.fill();
  // ---- the dusty field ----------------------------------------------------------------------
  ctx.fillStyle = mix(MUD, STRAW, 0.30);
  ctx.fillRect(0, 312, DW, DH - 312);
  ctx.fillStyle = rgba(STRAW, 0.10);
  ctx.fillRect(0, 312, DW, 60);
  ctx.fillStyle = rgba(ERODED, 0.07);
  ctx.beginPath(); ctx.ellipse(240, 760, 330, 52, 0.02, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(1010, 820, 360, 58, -0.02, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(STRAW, 0.08);
  ctx.beginPath(); ctx.ellipse(660, 700, 300, 40, 0, 0, Math.PI * 2); ctx.fill();
  for (var g2 = 0; g2 < grain.length; g2++) {
    var gr = grain[g2];
    ctx.fillStyle = gr.dark ? rgba(ERODED, gr.a) : rgba(STRAW, gr.a + 0.03);
    ctx.fillRect(gr.x, gr.y, gr.s, gr.s);
  }
  // ---- the low stone wall, sitting on the field line -----------------------------------------
  ctx.fillStyle = STONE;
  ctx.fillRect(0, 284, DW, 48);
  ctx.fillStyle = rgba(STRAW, 0.18);
  ctx.fillRect(0, 284, DW, 3);
  ctx.fillStyle = rgba(ERODED, 0.22);
  ctx.fillRect(0, 328, DW, 5);
  for (var ws = 0; ws < wallStones.length; ws++) {
    var st = wallStones[ws];
    ctx.fillStyle = rgba(mix(STONE, ERODED, 0.04 + (st.tone + 0.22) * 0.55), st.a);
    ctx.fillRect(st.x + 1, st.y + 1, st.w - 2, st.h - 2);
    ctx.fillStyle = rgba(ERODED, 0.20);
    ctx.fillRect(st.x, st.y + st.h - 2, st.w, 2);
  }
  // ---- group stones, then the vessels back to front -------------------------------------------
  for (var gs = 0; gs < groupStones.length; gs++) {
    var gst = groupStones[gs];
    ctx.fillStyle = rgba(ERODED, 0.18);
    ctx.beginPath(); ctx.ellipse(gst.x, gst.y + 4, gst.rx, gst.ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = mix(STONE, MUD, 0.25 + gst.tone);
    ctx.beginPath(); ctx.ellipse(gst.x, gst.y, gst.rx, gst.ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(STRAW, 0.10);
    ctx.beginPath(); ctx.ellipse(gst.x - gst.rx * 0.25, gst.y - gst.ry * 0.3, gst.rx * 0.5, gst.ry * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  }
  for (var vv = 0; vv < vessels.length; vv++) drawVessel(vessels[vv], p);
  // ---- wind dust, still drifting after everything else has settled ------------------------------
  for (var m = 0; m < motes.length; m++) {
    var mo = motes[m];
    var mx2 = (mo.x + T * 6.5 * mo.sp) % (DW + 30) - 15;
    var my2 = mo.y + Math.sin(T * 0.5 * mo.sp + mo.ph) * 9;
    ctx.fillStyle = rgba(STRAW, mo.a);
    ctx.beginPath(); ctx.arc(mx2, my2, mo.s, 0, Math.PI * 2); ctx.fill();
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: the field fills the frame edge to edge
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2;
  OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
