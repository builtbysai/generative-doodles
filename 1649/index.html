<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Theory of General Instability, No. 60</title>
<style>
html, body { margin: 0; padding: 0; background: #040407; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var VOID = '#040407';
var PLATE = '#0d0d18';
var PLATE_LINE = '#2a2f4d';
var INK = '#d7dcff';
var BLUE = [59, 108, 255];
var VIOLET = [139, 92, 246];
var MAGENTA = [255, 46, 154];
var WHITE = [255, 255, 255];
/* A near-uniform field with a sub-1% irregularity grows its own
   filaments and voids under an instability term. Frame one is at
   t = 60 s: the universe is 60 seconds old and still deciding.
   2.5 million particles is not canvas-2D-feasible; this piece runs
   3,249 seeded particles through the same physics, and the clumping
   is the point. */
var PHASE = 60;
var SEEDS = [1649001, 1649002, 1649003, 1649004, 1649005, 1649006, 1649007, 1649008];
var N_SIDE = 57;
var N = N_SIDE * N_SIDE;
var PRE_STEPS = 150, PRE_DT = 0.4;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* ---- the scalar field: curl modes + growth wells + void repulsors ----
   All positions live in unit space u,v in [0,1]; x = u*VW, y = v*VH.
   Wells pull hardest at their centres and the core adds a tangential
   swirl, so matter gathers into a fuzzy filamented core wrapped by a
   nebulous orbiting ring instead of collapsing to points. Voids push
   outward hardest at their centres, so black bubbles open where the
   field says so; no void is ever drawn as a shape. Centres and mode
   phases are precomputed once per advection step, never per particle. */
var MODES = [
  { fx: 2, fy: 2, a: 0.55, p: 1.7, q: 0.4, wu: 0.05, wv: 0.04, du: 0.13, dv: 0.11 },
  { fx: 3, fy: 1, a: 0.35, p: 4.2, q: 2.1, wu: 0.07, wv: 0.06, du: 0.09, dv: 0.07 },
  { fx: 1, fy: 3, a: 0.22, p: 0.9, q: 3.3, wu: 0.03, wv: 0.05, du: 0.05, dv: 0.06 }
];
var CORE = { bx: 0.58, by: 0.44, sig: 0.14, s: 0.005, swirl: 0.02, ax: 0.05, ay: 0.04, w1: 0.03, w2: 0.027, p1: 0.7, p2: 2.2 };
var WELLS = [
  { bx: 0.20, by: 0.68, sig: 0.10, s: 0.005, ax: 0.045, ay: 0.04, w1: 0.036, w2: 0.031, p1: 1.1, p2: 3.0 },
  { bx: 0.82, by: 0.74, sig: 0.09, s: 0.0045, ax: 0.04, ay: 0.045, w1: 0.033, w2: 0.029, p1: 2.4, p2: 0.5 },
  { bx: 0.28, by: 0.20, sig: 0.085, s: 0.0045, ax: 0.05, ay: 0.04, w1: 0.03, w2: 0.034, p1: 4.0, p2: 1.8 },
  { bx: 0.86, by: 0.22, sig: 0.075, s: 0.004, ax: 0.04, ay: 0.05, w1: 0.037, w2: 0.03, p1: 0.3, p2: 2.9 }
];
var VOIDS = [
  { bx: 0.38, by: 0.52, sig: 0.13, s: 0.025, ax: 0.010, ay: 0.012, w1: 0.044, w2: 0.057, p1: 1.6, p2: 0.9 },
  { bx: 0.68, by: 0.28, sig: 0.10, s: 0.024, ax: 0.012, ay: 0.010, w1: 0.059, w2: 0.046, p1: 3.5, p2: 2.0 },
  { bx: 0.52, by: 0.82, sig: 0.11, s: 0.024, ax: 0.011, ay: 0.009, w1: 0.052, w2: 0.063, p1: 2.7, p2: 4.1 }
];
var K_CURL = 0.005;
/* Gas pressure: the density gradient pushes back, so no bin can
   over-fill. This is the saturation that stops runaway collapse and
   lets the live field hold a steady clumped state. BETA is tuned so
   a 10-count bin-to-bin step repels at about 0.004 units per second. */
var BETA = 0.0004;
/* Deterministic thermal jitter: a hash of (particle, step) so the
   diffusion is reproducible by construction, never from a random
   source. It keeps filaments fuzzy instead of razor lines and stops
   the flow herding every particle onto a handful of streamlines. */
var DIFF = 0.005;
var advStep = 0;
function hash01(a, b) {
  var v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return v - Math.floor(v);
}
function growth(t) {
  /* The instability grows in over the first 45 s and then holds: the
     saturation that stops runaway collapse is the gas pressure term
     in the velocity field, not a fading well, so the live field keeps
     its structure and keeps drifting instead of dissolving. */
  if (t <= 45) return 0.35 + 0.65 * (t / 45);
  return 1;
}
/* Per-step precomputed field state: mode phase drifts, attractor
   centres (core + wells) and void centres. */
var step = { g: 1, mdu: [0, 0, 0], mdv: [0, 0, 0], ax: [0, 0, 0, 0, 0], ay: [0, 0, 0, 0, 0], vx: [0, 0, 0], vy: [0, 0, 0] };
var ATTRACTORS = [CORE, WELLS[0], WELLS[1], WELLS[2], WELLS[3]];
function prepareStep(t) {
  var i, c;
  step.g = growth(t);
  for (i = 0; i < MODES.length; i++) {
    step.mdu[i] = TAU * MODES[i].du * Math.sin(MODES[i].wu * t);
    step.mdv[i] = TAU * MODES[i].dv * Math.cos(MODES[i].wv * t);
  }
  for (i = 0; i < ATTRACTORS.length; i++) {
    c = ATTRACTORS[i];
    step.ax[i] = c.bx + c.ax * Math.sin(c.w1 * t + c.p1);
    step.ay[i] = c.by + c.ay * Math.cos(c.w2 * t + c.p2);
  }
  for (i = 0; i < VOIDS.length; i++) {
    c = VOIDS[i];
    step.vx[i] = c.bx + c.ax * Math.sin(c.w1 * t + c.p1);
    step.vy[i] = c.by + c.ay * Math.cos(c.w2 * t + c.p2);
  }
}
/* Velocity of one particle at (u,v). Uses the precomputed step state.
   Returns into the shared two-element array vel. */
var vel = [0, 0];
function velocity(u, v) {
  var vx = 0, vy = 0, i, m, au, av, sa, ca, sb, cb;
  for (i = 0; i < MODES.length; i++) {
    m = MODES[i];
    au = TAU * m.fx * u + step.mdu[i] + m.p;
    av = TAU * m.fy * v + step.mdv[i] + m.q;
    sa = Math.sin(au); ca = Math.cos(au);
    sb = Math.sin(av); cb = Math.cos(av);
    /* curl of psi: vx = dpsi/dv, vy = -dpsi/du */
    vx += m.a * sa * TAU * m.fy * cb;
    vy -= m.a * TAU * m.fx * ca * sb;
  }
  vx *= K_CURL; vy *= K_CURL;
  var g = step.g, dx, dy, d2, d, pull, ex;
  /* Attractors: pull hardest at the centre, core adds swirl. */
  for (i = 0; i < ATTRACTORS.length; i++) {
    dx = step.ax[i] - u; dy = step.ay[i] - v;
    d2 = dx * dx + dy * dy;
    d = Math.sqrt(d2) + 0.0001;
    ex = Math.exp(-d2 / (2 * ATTRACTORS[i].sig * ATTRACTORS[i].sig));
    pull = ATTRACTORS[i].s * g * ex;
    vx += pull * dx / d; vy += pull * dy / d;
    if (i === 0) {
      var sw = CORE.swirl * g * ex;
      vx += -dy / d * sw; vy += dx / d * sw;
    }
  }
  for (i = 0; i < VOIDS.length; i++) {
    dx = u - step.vx[i]; dy = v - step.vy[i];
    d2 = dx * dx + dy * dy;
    d = Math.sqrt(d2) + 0.0001;
    ex = Math.exp(-d2 / (2 * VOIDS[i].sig * VOIDS[i].sig));
    pull = VOIDS[i].s * g * ex;
    vx += pull * dx / d; vy += pull * dy / d;
  }
  /* Gas pressure from the density grid: push down the local gradient. */
  var bi = clamp(Math.floor(u * BINS), 0, BINS - 1);
  var bj = clamp(Math.floor(v * BINS), 0, BINS - 1);
  var gx = dens[bj * BINS + Math.min(bi + 1, BINS - 1)] - dens[bj * BINS + Math.max(bi - 1, 0)];
  var gy = dens[Math.min(bj + 1, BINS - 1) * BINS + bi] - dens[Math.max(bj - 1, 0) * BINS + bi];
  vx -= BETA * gx; vy -= BETA * gy;
  var sp = Math.sqrt(vx * vx + vy * vy);
  if (sp > 0.10) { vx *= 0.10 / sp; vy *= 0.10 / sp; }
  vel[0] = vx; vel[1] = vy;
}
/* ---- particles: jittered lattice, near-uniform at t = 0 ---- */
var px = [], py = [];
var seedIdx = 0;
function build(seed) {
  var rng = mulberry32(seed), i, j, cell = 1 / N_SIDE;
  px.length = 0; py.length = 0;
  advStep = 0;
  for (j = 0; j < N_SIDE; j++) {
    for (i = 0; i < N_SIDE; i++) {
      /* Lattice centre plus a sub-1%-of-frame jitter: the inflation
         irregularity the instability grows from. */
      px.push((i + 0.5) * cell + (rng() - 0.5) * cell * 0.6);
      py.push((j + 0.5) * cell + (rng() - 0.5) * cell * 0.6);
    }
  }
}
function wrap(x) {
  /* Periodic box: the curl field is exactly period-1 in u and v, so
     a particle leaving one edge re-enters at the opposite edge with
     the same velocity. No corner can trap particles, and the wells
     (all well inside the box) keep working as before. A step never
     moves more than 0.05, so one wrap is enough. */
  x = x % 1;
  if (x < 0) x += 1;
  return x;
}
function advect(dt, t) {
  var i, u, v, h1, h2, dj = DIFF * Math.sqrt(dt);
  prepareStep(t);
  computeDensity();
  for (i = 0; i < N; i++) {
    u = px[i]; v = py[i];
    velocity(u, v);
    h1 = hash01(i * 2 + 1, advStep);
    h2 = hash01(i * 2 + 2, advStep);
    px[i] = wrap(u + vel[0] * dt + dj * (h1 - 0.5) * 2);
    py[i] = wrap(v + vel[1] * dt + dj * (h2 - 0.5) * 2);
  }
  advStep++;
}
function preAdvect() {
  var s;
  for (s = 0; s < PRE_STEPS; s++) advect(PRE_DT, s * PRE_DT);
}
/* ---- density grid: colour follows measured local density ---- */
var BINS = 40;
var dens = new Array(BINS * BINS);
var lastDens = null;
function computeDensity() {
  var i, b;
  for (i = 0; i < BINS * BINS; i++) dens[i] = 0;
  for (i = 0; i < N; i++) {
    b = clamp(Math.floor(py[i] * BINS), 0, BINS - 1) * BINS +
        clamp(Math.floor(px[i] * BINS), 0, BINS - 1);
    dens[b]++;
  }
  lastDens = dens;
}
/* Colour buckets by bin count: sparse blue, filaments violet,
   clumps magenta, knots white. */
var BUCKETS = [
  { max: 1, col: BLUE, a: 0.50, r: 1.2 },
  { max: 2, col: VIOLET, a: 0.60, r: 1.3 },
  { max: 5, col: VIOLET, a: 0.70, r: 1.5 },
  { max: 11, col: MAGENTA, a: 0.85, r: 1.7 },
  { max: 1e9, col: WHITE, a: 0.95, r: 2.0 }
];
function bucketOf(c) {
  var b;
  for (b = 0; b < BUCKETS.length; b++) if (c <= BUCKETS[b].max) return b;
  return BUCKETS.length - 1;
}
function drawParticles() {
  var rScale = clamp(Math.min(VW, VH) / 900, 0.7, 1.3);
  var b, i, bin, r, x, y;
  for (b = 0; b < BUCKETS.length; b++) {
    r = BUCKETS[b].r * rScale;
    ctx.fillStyle = rgba(BUCKETS[b].col, BUCKETS[b].a);
    ctx.beginPath();
    for (i = 0; i < N; i++) {
      bin = clamp(Math.floor(py[i] * BINS), 0, BINS - 1) * BINS +
            clamp(Math.floor(px[i] * BINS), 0, BINS - 1);
      if (bucketOf(dens[bin]) !== b) continue;
      x = px[i] * VW; y = py[i] * VH;
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, TAU);
    }
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  var title = 'A Theory of General Instability, No. 60';
  var date = '2006 · 07 · 18';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(title).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText(date).width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(title, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba([215, 220, 255], 0.8);
  ctx.fillText(date, plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap to seed a new universe.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba([215, 220, 255], 0.9);
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
/* ---- tap: deal the next seed from the fixed table, same physics ---- */
var clockT = PHASE;
function reseed(i) {
  seedIdx = ((i % SEEDS.length) + SEEDS.length) % SEEDS.length;
  build(SEEDS[seedIdx]);
  preAdvect();
  lastT = clockT;
}
function onTap(e) {
  reseed(seedIdx + 1);
  if (e && e.preventDefault) e.preventDefault();
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onTap);
  canvas.addEventListener('mousedown', onTap);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
var lastT = PHASE;
function draw(t) {
  size();
  var dt = clamp(t - lastT, 0, 0.1);
  if (dt > 0) advect(dt, t);
  lastT = t;
  computeDensity();
  ctx.fillStyle = VOID;
  ctx.fillRect(0, 0, VW, VH);
  drawParticles();
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    advance: function (t) {
      /* Step the physics to sim time t without rendering each step. */
      var tt = clockT;
      while (tt < t - 0.000001) {
        var nt = Math.min(t, tt + 0.05);
        advect(nt - tt, nt);
        tt = nt;
      }
      clockT = t;
      draw(t);
    },
    reseed: function (i) { reseed(i); draw(clockT); },
    seedIndex: function () { return seedIdx; },
    particles: function () { return N; },
    stats: function () {
      var i, mx = 0, mxi = 0, sum = 0, empty = 0, core = 0, knot = 0;
      var ccx = step.ax[0], ccy = step.ay[0];
      for (i = 0; i < BINS * BINS; i++) {
        if (dens[i] > mx) { mx = dens[i]; mxi = i; }
        sum += dens[i];
        if (dens[i] === 0) empty++;
        if (dens[i] >= 9) knot++;
      }
      var vc = [0, 0, 0], ac = [0, 0, 0, 0, 0], v, a, dx, dy;
      for (i = 0; i < N; i++) {
        dx = px[i] - ccx; dy = py[i] - ccy;
        if (dx * dx + dy * dy < 0.12 * 0.12) core++;
        for (a = 0; a < ATTRACTORS.length; a++) {
          dx = px[i] - step.ax[a]; dy = py[i] - step.ay[a];
          if (dx * dx + dy * dy < 0.05 * 0.05) ac[a]++;
        }
        for (v = 0; v < VOIDS.length; v++) {
          dx = px[i] - step.vx[v]; dy = py[i] - step.vy[v];
          if (dx * dx + dy * dy < 0.06 * 0.06) vc[v]++;
        }
      }
      return {
        n: N, maxBin: mx, maxBinAt: [(mxi % BINS + 0.5) / BINS, (Math.floor(mxi / BINS) + 0.5) / BINS],
        meanBin: sum / (BINS * BINS),
        emptyBins: empty, knotBins: knot, coreCount: core,
        attractorCounts: ac, voidCounts: vc
      };
    }
  };
}
/* ---- frame one: fixed phase, fixed seed 0, no wall clock ---- */
size();
build(SEEDS[0]);
preAdvect();
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (ts === 0 || ts === undefined) ts = 0;
    var dt = 0;
    if (loop.prev === undefined) { loop.prev = ts; }
    else { dt = clamp((ts - loop.prev) / 1000, 0, 0.05); loop.prev = ts; }
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
