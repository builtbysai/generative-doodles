<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.209 Jiggle Choir</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#08080A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.209 Jiggle Choir (Asia Ward). Five small patchwork creatures,
// variations on the toy-mashup grammar, each cycling the four
// behaviour verbs, jiggle, shuffle, squeak, recoil, on its own
// clock, so the group is a desynchronized choir of twitching
// revived toys. Every forty five seconds or so they all squeak at
// once before drifting apart again. Their tempo follows the time
// of day: lively at midday, drowsy at night. Tap one for a solo
// squeak; drag through the group to scatter them, and they shuffle
// back into formation.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#08080A';
var FABRICS = ['#6B5B4E', '#4E556B', '#5C4A5E', '#4A5E52', '#6B4E3E'];
var FAB_B = ['#4E556B', '#5C4A5E', '#6B5B4E', '#6B4E3E', '#4A5E52'];
var STITCH = '#D8CFA8', EYE = '#C8D4DE', CATCH = '#FFFFFF', RIPPLE = '232,228,218';
var W = 0, H = 0, phone = false;
var seed = 209209;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function easeIO(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
var T = 0, lastNow = -1;

// tempo follows the local hour: 1.0 near midday, 0.3 in the small hours
var nowD = new Date();
var hourF = nowD.getHours() + nowD.getMinutes() / 60;
var TEMPO = 0.3 + 0.7 * (0.5 + 0.5 * Math.cos((hourF - 13) / 24 * 6.2832));

var VERBS = ['jiggle', 'shuffle', 'squeak', 'recoil'];
var DUR = { idle: 2.2, jiggle: 3, shuffle: 2.6, squeak: 2.1, recoil: 2.4 };
var PARAMS = [
  { fx: 0.32, fy: 0.46, s: 1.0, eyes: 2, arms: 2, phase: 0.0, first: 'squeak', firstAt: -0.7 },
  { fx: 0.58, fy: 0.36, s: 0.62, eyes: 2, arms: 3, phase: 5.3, first: 'jiggle', firstAt: -1.4 },
  { fx: 0.74, fy: 0.55, s: 0.58, eyes: 1, arms: 2, phase: 11.1, first: 'shuffle', firstAt: -0.9 },
  { fx: 0.50, fy: 0.66, s: 0.55, eyes: 2, arms: 1, phase: 17.6, first: 'recoil', firstAt: -0.5 },
  { fx: 0.18, fy: 0.64, s: 0.60, eyes: 2, arms: 2, phase: 23.9, first: 'idle', firstAt: -1.0 }
];
var creatures = [];
PARAMS.forEach(function (p, ci) {
  var r = rng(seed + ci * 977 + 13);
  var tl = [];
  var t = p.firstAt;
  tl.push({ name: p.first, t0: t, data: p.first === 'shuffle' ? { dir: 1 } : (p.first === 'recoil' ? { dx: 0.8, dy: -0.3 } : {}) });
  t += DUR[p.first];
  var bag = [];
  function nextVerb() {
    if (bag.length === 0) {
      bag = VERBS.slice();
      for (var i = bag.length - 1; i > 0; i--) { var j = (r() * (i + 1)) | 0; var tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp; }
    }
    return bag.pop();
  }
  for (var n = 0; n < 80; n++) {
    tl.push({ name: 'idle', t0: t, data: {} });
    t += DUR.idle;
    var v = nextVerb();
    var d = {};
    if (v === 'shuffle') d = { dir: r() < 0.5 ? -1 : 1 };
    if (v === 'recoil') { var a = r() * 6.2832; d = { dx: Math.cos(a), dy: Math.sin(a) * 0.5 }; }
    tl.push({ name: v, t0: t, data: d });
    t += DUR[v];
  }
  creatures.push({ p: p, tl: tl, ox: 0, oy: 0, vx: 0, vy: 0, solo: -10, walk: 0 });
});
var nextChorus = 42;
function stateAt(c, time) {
  for (var i = c.tl.length - 1; i >= 0; i--) if (c.tl[i].t0 <= time) return c.tl[i];
  return c.tl[0];
}
function isChorus(time) { return time > nextChorus && time < nextChorus + 2.0; }

// ---- input -----------------------------------------------------------------------------
var dragging = false, lastPX = 0, lastPY = 0;
function cgeom(c) {
  var s = Math.min(W, H) * 0.30 * c.p.s * (phone ? 0.8 : 1);
  var bob = (Math.abs(c.ox) + Math.abs(c.vx) > 2) ? -Math.abs(Math.sin(c.walk)) * s * 0.035 : 0;
  return { x: c.p.fx * W + c.ox, y: c.p.fy * H + c.oy + bob, s: s };
}
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; lastPX = e.clientX; lastPY = e.clientY;
  for (var i = 0; i < creatures.length; i++) {
    var g = cgeom(creatures[i]);
    var dx = e.clientX - g.x, dy = e.clientY - (g.y - g.s * 0.1);
    if (Math.sqrt(dx * dx + dy * dy) < g.s * 0.75) creatures[i].solo = T;
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var mx = e.clientX - lastPX, my = e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
  for (var i = 0; i < creatures.length; i++) {
    var g = cgeom(creatures[i]);
    var dx = g.x - e.clientX, dy = g.y - e.clientY;
    var d = Math.sqrt(dx * dx + dy * dy);
    var R = g.s * 1.5 + 30;
    if (d < R && d > 1) {
      var f = (1 - d / R) * 26;
      creatures[i].vx += (dx / d) * f + mx * 0.35;
      creatures[i].vy += (dy / d) * f * 0.6 + my * 0.2;
    }
  }
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- resize ------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing one creature ------------------------------------------------------------------
function blob(cx, cy, r, wob, fill, seam, u) {
  ctx.beginPath();
  for (var i = 0; i < 14; i++) {
    var a = i / 14 * 6.2832;
    var rr = r * (1 + Math.sin(a * 3 + cx * 0.013) * wob);
    var px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.94;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (seam) {
    ctx.strokeStyle = STITCH; ctx.lineWidth = Math.max(1, u * 1.0);
    ctx.setLineDash([u * 4.4, u * 3]); ctx.globalAlpha = 0.8; ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
}
function drawCreature(c, time) {
  var g = cgeom(c);
  var s = g.s, u = s / 110;
  var lt = time + c.p.phase;
  var st = stateAt(c, lt);
  var ltime = lt - st.t0;
  var chorus = isChorus(time);
  var squeaking = chorus || st.name === 'squeak' || (time - c.solo < 1.6 && c.solo >= 0);
  var sqT = chorus ? time - nextChorus : (st.name === 'squeak' ? ltime : Math.max(0, time - c.solo));
  var rootX = 0, rootY = 0, jigA = 0;
  if (st.name === 'shuffle') {
    rootX = (st.data.dir || 1) * 16 * u * easeIO(clamp(ltime / DUR.shuffle, 0, 1));
    rootY = -Math.sin(clamp(ltime / DUR.shuffle, 0, 1) * 3.1416) * 2.4 * u;
  } else if (st.name === 'recoil') {
    var mag = 30 * u * Math.exp(-ltime * 1.5) * Math.cos(Math.min(ltime * 2.4, 1.6));
    rootX = (st.data.dx || 0.8) * mag; rootY = (st.data.dy || 0) * mag * 0.6;
  } else if (st.name === 'jiggle') {
    jigA = 1;
  }
  var breathe = Math.sin(time * 1.3 + c.p.phase) * 1.2 * u;
  var cx = g.x + rootX, cy = g.y + rootY + breathe * 0.3;
  function jo(ph, amp) { return jigA ? Math.sin(time * 30 + ph + c.p.phase) * amp * u : 0; }
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.ellipse(cx, cy + s * 0.52, s * 0.46, s * 0.07, 0, 0, 6.2832); ctx.fill();
  // legs
  blob(cx - s * 0.17 + jo(1, 1.5), cy + s * 0.42, s * 0.13, 0.05, FAB_B[creatures.indexOf(c)], true, u);
  blob(cx + s * 0.18 + jo(2, 1.5), cy + s * 0.43, s * 0.125, 0.05, cFab(c), true, u);
  // arms: the count varies by creature, mismatched toys
  ctx.lineCap = 'round';
  for (var ai = 0; ai < c.p.arms; ai++) {
    var side = ai % 2 === 0 ? -1 : 1;
    var lvl = Math.floor(ai / 2);
    ctx.strokeStyle = ai === 1 ? FAB_B[creatures.indexOf(c)] : cFab(c);
    ctx.lineWidth = s * 0.085;
    ctx.beginPath();
    ctx.moveTo(cx + side * s * 0.24, cy - s * 0.08 + lvl * s * 0.16);
    ctx.quadraticCurveTo(
      cx + side * s * 0.46 + jo(ai * 2.1, 3),
      cy + s * 0.02 + lvl * s * 0.14,
      cx + side * s * 0.44 + jo(ai * 2.1, 3),
      cy + s * (0.28 + lvl * 0.1));
    ctx.stroke();
  }
  // torso and head
  blob(cx + jo(0, 2), cy + s * 0.05, s * 0.30, 0.05, cFab(c), true, u);
  var hx = cx + jo(3, 2.6), hy = cy - s * 0.33;
  blob(hx, hy, s * 0.20, 0.06, FAB_B[creatures.indexOf(c)], true, u);
  // glass eyes: two, or one big cyclops eye
  var eyeList = c.p.eyes === 1 ? [[0, -0.01, 0.055]] : [[-0.07, -0.02, 0.034], [0.075, -0.025, 0.034]];
  for (var ei = 0; ei < eyeList.length; ei++) {
    var ex = hx + eyeList[ei][0] * s, ey = hy + eyeList[ei][1] * s, er = eyeList[ei][2] * s;
    var eg = ctx.createRadialGradient(ex - er * 0.4, ey - er * 0.4, er * 0.1, ex, ey, er);
    eg.addColorStop(0, CATCH); eg.addColorStop(0.35, EYE); eg.addColorStop(1, '#5A6A74');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, 6.2832); ctx.fill();
    ctx.fillStyle = CATCH;
    ctx.beginPath(); ctx.arc(ex - er * 0.35, ey - er * 0.4, er * 0.24, 0, 6.2832); ctx.fill();
  }
  // squeak rings from the head
  if (squeaking) {
    for (var qi = 0; qi < 3; qi++) {
      var qk = (sqT / 2.1 + qi / 3) % 1;
      ctx.strokeStyle = 'rgba(' + RIPPLE + ',' + (0.30 * (1 - qk)).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, u * 1.3 * (1 - qk));
      ctx.beginPath(); ctx.arc(hx, hy + s * 0.06, (0.09 + qk * 0.72) * s, 0, 6.2832); ctx.stroke();
    }
  }
}
function cFab(c) { return FABRICS[creatures.indexOf(c)]; }

function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) { dt = Math.min(0.05, (time - lastNow) / 1000); T += dt * TEMPO; }
  lastNow = time;
  if (T > nextChorus + 2.5) nextChorus += 45;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // scatter physics: spring home with a shuffling bob
  for (var i = 0; i < creatures.length; i++) {
    var c = creatures[i];
    if (dt > 0) {
      c.vx += -c.ox * 26 * dt; c.vy += -c.oy * 26 * dt;
      c.vx *= Math.pow(0.02, dt); c.vy *= Math.pow(0.02, dt);
      c.ox += c.vx * dt * 8; c.oy += c.vy * dt * 8;
      if (Math.abs(c.ox) + Math.abs(c.vx) > 2) c.walk += dt * 9;
    }
  }
  var order = creatures.slice().sort(function (a, b) { return a.p.fy - b.p.fy; });
  for (var oi = 0; oi < order.length; oi++) drawCreature(order[oi], T);
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
