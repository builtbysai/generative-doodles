<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every Combination</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0A0A0A; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* No.955 "Every Combination" - reas PP116 Colorform Variations.
   A genuine combinatorial walk: 5 x 4 x 4 x 8 x 2 = 1280 colorforms,
   dealt in a seeded permutation, one tile stepping every 20 s.
   All drawn state is a closed form of (piece time, recorded events).
   Frame one is the synchronous draw at t = 0. Date is never used. */

var W = (typeof window !== "undefined") ? window : {};
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- the combinatorial space ---------- */
var TOTAL = 1280;          /* 5 bars x 4 circle x 4 arc x 8 rot x 2 pairing */
var WIN = 16;              /* 4 x 4 visible window */
var START_POS = 147;       /* the walk began before we arrived */
var SEED = 955116;

function shufflePerm(seed) {
  var r = mulberry32(seed);
  var p = [], i, j, t;
  for (i = 0; i < TOTAL; i++) p.push(i);
  for (i = TOTAL - 1; i > 0; i--) {
    j = (r() * (i + 1)) | 0;
    t = p[i]; p[i] = p[j]; p[j] = t;
  }
  return p;
}
function decode(idx) {
  return {
    bars: idx % 5,
    circ: ((idx / 5) | 0) % 4,
    arc: ((idx / 20) | 0) % 4,
    rot: ((idx / 80) | 0) % 8,
    pair: (idx / 640) | 0
  };
}

/* ---------- cities: exactly two hues + ground each ---------- */
var CITIES = [
  { name: "TOKYO",      ground: "#0A0A0A", a: "#FF2A9D", b: "#27E6FF", motif: [523.25, 783.99] },
  { name: "BERLIN",     ground: "#2B2B2B", a: "#8A8F98", b: "#D8D8D8", motif: [392.00, 587.33] },
  { name: "LONDON",     ground: "#3A4A5A", a: "#C8102E", b: "#E8E4DA", motif: [440.00, 659.25] },
  { name: "NEW YORK",   ground: "#1A1A1A", a: "#F7B500", b: "#8A9BA8", motif: [349.23, 523.25] },
  { name: "MEXICO CITY", ground: "#141414", a: "#FF4FD8", b: "#2EE6D6", motif: [587.33, 880.00] },
  { name: "LA",         ground: "#F5E6D3", a: "#FF8C5A", b: "#7FB3D5", motif: [493.88, 739.99] }
];
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
for (var ci = 0; ci < CITIES.length; ci++) {
  CITIES[ci].gRgb = hexRgb(CITIES[ci].ground);
  CITIES[ci].aRgb = hexRgb(CITIES[ci].a);
  CITIES[ci].bRgb = hexRgb(CITIES[ci].b);
}
function mixRgb(c1, c2, u) {
  var r = Math.round(c1[0] + (c2[0] - c1[0]) * u);
  var g = Math.round(c1[1] + (c2[1] - c1[1]) * u);
  var b = Math.round(c1[2] + (c2[2] - c1[2]) * u);
  return "rgb(" + r + "," + g + "," + b + ")";
}
function smooth(u) { return u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u); }

/* City schedule: changes at piece t = 90, 210, 330 ... (120 s apart),
   so at t = 0 Tokyo is 30 s fresh and fully tinted. */
var CITY_OFF = 30, CITY_LEN = 120, TINT_LEN = 5;
function cityAt(t) {
  var tt = t + CITY_OFF;
  var k = Math.floor(tt / CITY_LEN);
  var idx = ((k % 6) + 6) % 6;
  var prev = ((idx + 5) % 6);
  var start = k * CITY_LEN - CITY_OFF;        /* piece-time of this city's start */
  var u = smooth((t - start) / TINT_LEN);
  return { idx: idx, prev: prev, u: u, start: start };
}
function cityNameAlpha(t, ca) {
  /* opening reveal: full for the first 2.4 s, gone by 3 s */
  if (t < 3) return t < 2.4 ? 1 : 1 - (t - 2.4) / 0.6;
  var dt = t - ca.start;
  if (dt < 0 || dt > 2.5) return 0;
  if (dt < 0.3) return dt / 0.3;
  if (dt > 1.9) return 1 - (dt - 1.9) / 0.6;
  return 1;
}

/* ---------- walk state ---------- */
var vocabGen = 0;
var perm = shufflePerm(SEED);
var tiles = [];            /* {pos, seq, flip} - pos indexes the permutation */
var frontier = START_POS + WIN;   /* next unshown walk position */
var shown = START_POS;            /* counter value: 147 at frame one */
var dealSeq = 0;
var i;
for (i = 0; i < WIN; i++) tiles.push({ pos: START_POS + i, seq: dealSeq++, flip: -10 });

function redeal(firstPos, tNow) {
  for (var j = 0; j < WIN; j++) {
    tiles[j].pos = firstPos + j;
    tiles[j].seq = dealSeq++;
    tiles[j].flip = tNow;
  }
  frontier = firstPos + WIN;
}
function wrapWalk(tNow) {
  vocabGen++;
  perm = shufflePerm(SEED + vocabGen * 1013);
  redeal(0, tNow);
  shown = 0;
}
function advanceTile(tile, tNow) {
  if (frontier >= TOTAL) wrapWalk(tNow);
  tile.pos = frontier++;
  tile.seq = dealSeq++;
  tile.flip = tNow;
  shown++;
  tickSound(tile.pos);
}
function oldestTile() {
  var best = tiles[0];
  for (var j = 1; j < WIN; j++) if (tiles[j].seq < best.seq) best = tiles[j];
  return best;
}

/* ---------- audio: lazy, guarded, gesture-only ---------- */
var AC = null;
function ensureAudio() {
  if (typeof W.AudioContext === "undefined" && typeof W.webkitAudioContext === "undefined") return;
  if (AC) { if (AC.resume) AC.resume(); return; }
  try { AC = new (W.AudioContext || W.webkitAudioContext)(); } catch (e) { AC = null; }
}
function blip(freq, dur, gain, type) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    var t0 = AC.currentTime;
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* sound is garnish; the picture never depends on it */ }
}
function tickSound(pos) {
  if (!AC) return;
  blip(260 + (pos / TOTAL) * 240, 0.07, 0.05, "triangle");
}
function motifSound(idx) {
  if (!AC) return;
  var m = CITIES[idx].motif;
  blip(m[0], 0.18, 0.045, "sine");
  setTimeout(function () { blip(m[1], 0.22, 0.045, "sine"); }, 140);
}

/* ---------- layout ---------- */
var layout = { x: 0, y: 0, side: 0, tile: 0, gut: 0 };
function computeLayout(w, h) {
  var side = Math.min(w, h) * 0.92;
  var gut = side * 0.02;
  layout.side = side;
  layout.gut = gut;
  layout.tile = (side - 5 * gut) / 4;
  layout.x = (w - side) / 2;
  layout.y = (h - side) / 2;
}
function tileXY(idx) {
  var col = idx % 4, row = (idx / 4) | 0;
  var step = layout.tile + layout.gut;
  return [layout.x + layout.gut + col * step, layout.y + layout.gut + row * step];
}
function slotAt(x, y) {
  for (var j = 0; j < WIN; j++) {
    var p = tileXY(j);
    if (x >= p[0] && x <= p[0] + layout.tile && y >= p[1] && y <= p[1] + layout.tile) return j;
  }
  return -1;
}

/* ---------- drawing ---------- */
function rrPath(x, y, s, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + s - r, y);
  ctx.arcTo(x + s, y, x + s, y + r, r);
  ctx.lineTo(x + s, y + s - r);
  ctx.arcTo(x + s, y + s, x + s - r, y + s, r);
  ctx.lineTo(x + r, y + s);
  ctx.arcTo(x, y + s, x, y + s - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function drawForm(f, s, colA, colB) {
  /* only the form elements: the tile ground is painted unrotated by the
     caller, so the tile itself always stays a rounded square */
  var form = f.pair === 0 ? colA : colB;
  ctx.fillStyle = form;
  ctx.strokeStyle = form;
  var j;
  if (f.bars > 0) {
    var bw = s * 0.11, span = s * 0.66;
    var gap = f.bars > 1 ? (span - f.bars * bw) / (f.bars - 1) : 0;
    var x0 = -span / 2;
    for (j = 0; j < f.bars; j++) {
      ctx.fillRect(x0 + j * (bw + gap), -s * 0.34, bw, s * 0.68);
    }
  }
  if (f.circ > 0) {
    var r = [0, 0.13, 0.21, 0.29][f.circ] * s;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
  }
  if (f.arc > 0) {
    var a0 = (f.arc - 1) * Math.PI / 2;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.30, a0, a0 + Math.PI / 2);
    ctx.lineWidth = s * 0.11;
    ctx.stroke();
  }
}

var dragState = null;   /* {startX, base:[pos...], d} while scanning */
function displayPos(j) {
  if (dragState) return dragState.base[j] + dragState.d;
  return tiles[j].pos;
}
function displayShown() {
  if (dragState) {
    var mx = 0;
    for (var j = 0; j < WIN; j++) { var p = dragState.base[j] + dragState.d; if (p > mx) mx = p; }
    var f = mx + 1;
    return Math.max(shown, f - WIN);
  }
  return shown;
}

function draw(t) {
  var vv = (typeof W.visualViewport !== "undefined" && W.visualViewport) ? W.visualViewport : null;
  var w = vv ? vv.width : (W.innerWidth || 720);
  var h = vv ? vv.height : (W.innerHeight || 720);
  w = Math.round(w); h = Math.round(h);
  if (canvas.width !== w) canvas.width = w;
  if (canvas.height !== h) canvas.height = h;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";

  var sw = (W.screen && W.screen.width) || w;
  var sh = (W.screen && W.screen.height) || h;
  var phone = Math.min(sw, sh) < 700 || h > w * 1.15;

  computeLayout(w, h);
  var ca = cityAt(t);
  var cur = CITIES[ca.idx], prv = CITIES[ca.prev];
  var ground = mixRgb(prv.gRgb, cur.gRgb, ca.u);
  var colA = mixRgb(prv.aRgb, cur.aRgb, ca.u);
  var colB = mixRgb(prv.bRgb, cur.bRgb, ca.u);

  ctx.fillStyle = ground;
  ctx.fillRect(0, 0, w, h);

  var s = layout.tile, rad = s * 0.09;
  for (var j = 0; j < WIN; j++) {
    var p = tileXY(j);
    var combo = decode(perm[displayPos(j)]);
    var fu = (t - tiles[j].flip) / 0.3;
    var sy = 1;
    if (fu >= 0 && fu < 1) sy = Math.max(0.08, Math.abs(Math.cos(fu * Math.PI)));
    ctx.save();
    rrPath(p[0], p[1], s, rad);
    ctx.clip();
    ctx.fillStyle = combo.pair === 0 ? colB : colA;
    ctx.fillRect(p[0], p[1], s, s);
    ctx.translate(p[0] + s / 2, p[1] + s / 2);
    ctx.scale(1, sy);
    ctx.rotate(combo.rot * Math.PI / 4);
    drawForm(combo, s, colA, colB);
    ctx.restore();
  }

  /* city name, tiny caps top-left */
  var fs = Math.max(10, Math.round(layout.side * (phone ? 0.02 : 0.017)));
  ctx.font = "600 " + fs + "px monospace";
  ctx.textBaseline = "alphabetic";
  var na = cityNameAlpha(t, ca);
  if (na > 0.01) {
    ctx.globalAlpha = na * 0.92;
    ctx.fillStyle = colB;
    ctx.textAlign = "left";
    ctx.fillText(cur.name, 14, 14 + fs);
    ctx.globalAlpha = 1;
  }
  /* the counter, tiny monospace bottom-right */
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = colB;
  ctx.textAlign = "right";
  ctx.fillText(displayShown() + " / " + TOTAL, w - 14, h - 12);
  ctx.globalAlpha = 1;
}

/* ---------- time + scheduled steps ---------- */
var startStamp = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
function nowT() {
  if (typeof performance !== "undefined" && performance.now) {
    return (performance.now() - startStamp) / 1000;
  }
  return 0;
}
var lastStepIdx = 0;
var lastCityIdx = cityAt(0).idx;
function pump(t) {
  var stepIdx = Math.floor(t / 20);
  while (lastStepIdx < stepIdx) {
    lastStepIdx++;
    advanceTile(oldestTile(), lastStepIdx * 20);
  }
  var idx = cityAt(t).idx;
  if (idx !== lastCityIdx) { lastCityIdx = idx; motifSound(idx); }
}

/* ---------- interaction: tap steps, drag scans, double-tap reseeds ---------- */
var pDown = null;
var lastTap = { t: -10, slot: -1 };
function evtPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var x = (typeof e.clientX === "number") ? e.clientX : 0;
  var y = (typeof e.clientY === "number") ? e.clientY : 0;
  return [x - r.left, y - r.top];
}
function onDown(e) {
  ensureAudio();
  var p = evtPos(e);
  pDown = { x: p[0], y: p[1], dragging: false };
}
function onMove(e) {
  if (!pDown) return;
  var p = evtPos(e);
  var dx = p[0] - pDown.x;
  if (!pDown.dragging && Math.abs(dx) > 6) {
    pDown.dragging = true;
    var base = [];
    for (var j = 0; j < WIN; j++) base.push(tiles[j].pos);
    dragState = { base: base, d: 0 };
  }
  if (pDown.dragging && dragState) {
    var d = Math.round(dx / 28);
    var mn = Math.min.apply(null, dragState.base);
    var mx = Math.max.apply(null, dragState.base);
    if (d < -mn) d = -mn;
    if (d > TOTAL - 1 - mx) d = TOTAL - 1 - mx;
    dragState.d = d;
    draw(nowT());
  }
}
function onUp(e) {
  if (!pDown) return;
  var t = nowT();
  if (pDown.dragging && dragState) {
    var d = dragState.d, j, mx = 0;
    for (j = 0; j < WIN; j++) {
      tiles[j].pos = dragState.base[j] + d;
      if (tiles[j].pos > mx) mx = tiles[j].pos;
    }
    /* re-sequence by position so the lowest position is "oldest" again */
    var order = tiles.map(function (tl, ix) { return [tl.pos, ix]; }).sort(function (a, b) { return a[0] - b[0]; });
    for (j = 0; j < WIN; j++) tiles[order[j][1]].seq = dealSeq - WIN + j;
    if (mx + 1 > frontier) frontier = mx + 1;
    if (frontier - WIN > shown) shown = frontier - WIN;
    dragState = null;
    pDown = null;
    draw(t);
    return;
  }
  var p = evtPos(e);
  var slot = slotAt(p[0], p[1]);
  if (t - lastTap.t < 0.35) {
    /* double-tap: a new vocabulary */
    vocabGen++;
    perm = shufflePerm(SEED + 5000 + vocabGen * 7919);
    redeal(0, t);
    shown = WIN;   /* first window dealt */
    lastTap = { t: -10, slot: -1 };
  } else {
    if (slot >= 0) advanceTile(tiles[slot], t);
    lastTap = { t: t, slot: slot };
  }
  pDown = null;
  draw(t);
}
if (canvas.addEventListener) {
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", function () { pDown = null; dragState = null; });
}

/* ---------- frame one + loop ---------- */
draw(0);
function frame() {
  var t = nowT();
  pump(t);
  draw(t);
  if (typeof requestAnimationFrame !== "undefined") requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame !== "undefined") requestAnimationFrame(frame);
if (W.addEventListener) {
  W.addEventListener("resize", function () { draw(nowT()); });
}
if (typeof W.visualViewport !== "undefined" && W.visualViewport && W.visualViewport.addEventListener) {
  W.visualViewport.addEventListener("resize", function () { draw(nowT()); });
}
</script>
</body>
</html>
