<script>
"use strict";
/* ============================================================
   №8983 · Idle Day
   IOGraph lineage, synthetic input. A workday of cursor behavior
   is simulated tick by tick (reading pauses, scanning bursts, the
   afternoon scroll) and rendered through Zenkov's recipe:
     - movement becomes 0.45px hairline segments
     - stillness inside a 20px drift box accumulates idle radius
       at 0.9 per tick (10 ticks/sec, so 9px of radius per second,
       the same rate as his 0.3 per tick at 30 ticks/sec)
     - when the cursor leaves the box with radius over 20, stamp:
       soft halo (diameter 2r, alpha fading as it grows),
       a stroked ring, and a solid dot of diameter 2*sqrt(radius)
     - direction to hue, but a restrained two-ink loop instead of
       his CMY: two muted inks, lerped gently by movement angle
   ============================================================ */

// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 20260818;   // default seed (the piece's date)

const DEFAULT_SEED = 20260818;

// ---- virtual screen: all simulation happens in these units, so a seed
// ---- draws the identical day at every viewport size
const VW = 1600, VH = 1000;
const TICKS_PER_SEC = 10;          // simulation sample rate
const DRIFT_BOX = 20;              // stillness box, px
const RADIUS_RATE = 0.9;           // idle radius per tick (9 px/sec)
const DOT_MIN_R = 20;              // radius threshold before stamping

// ---- the two muted inks (paper: warm archival #f4efe3)
const INK_A = [122, 92, 62];       // iron-gall sepia
const INK_B = [70, 88, 110];       // slate indigo
const DEEP_A = [78, 58, 36];
const DEEP_B = [47, 60, 77];
const HUE_BUCKETS = 64;
function lerpInk(a, b, t){
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}
function css(c, alpha){
  return "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + alpha + ")";
}
// direction angle -> position in the two-ink loop: one gentle trip around
// the compass, east through south to west and back, lerped between the inks
function inkT(angle){ return (angle + Math.PI) / (2*Math.PI); }

/* ---------------- the simulated workday ----------------
   The day is a script of scenes. Scenes emit cursor behavior with
   durations; the sampler turns the script into a tick stream.
   All layout jitter is seeded, so the day is deterministic. */
function buildDay(rnd){
  const J = (v, amt) => v + (rnd()*2-1)*amt;
  // attention zones on the virtual screen, with clear aisles between them
  // so the travel lines between zones stay legible
  const mail = { x0: J(150, 25), x1: J(510, 20), y0: J(170, 20), y1: J(850, 20) };
  const doc  = { x0: J(670, 30), x1: J(1040, 30), y0: J(150, 20), y1: J(870, 20) };
  const chat = { x0: J(1330, 20), x1: J(1520, 20), y0: J(270, 40), y1: J(750, 40) };
  const bar  = { y0: J(46, 8), y1: J(100, 8), x0: 120, x1: 1480 };
  const dock = { y0: J(935, 6), y1: 976, x0: 300, x1: 1300 };
  const scenes = [];
  const S = (kind, minutes) => scenes.push({ kind, minutes });
  S("boot",   2 + rnd()*2);
  S("email",  35 + rnd()*20);
  S("work",   50 + rnd()*30);
  S("chat",   15 + rnd()*10);
  S("meet",   25 + rnd()*20);
  S("email",  25 + rnd()*20);
  S("lunch",  22 + rnd()*10);
  S("scroll", 45 + rnd()*30);
  S("scan",   20 + rnd()*15);
  S("work",   20 + rnd()*15);
  S("wrap",   15 + rnd()*15);
  // normalize to a full workday, about eight hours
  const total = scenes.reduce((a, s) => a + s.minutes, 0);
  const target = 480 + rnd()*30;
  for (const s of scenes) s.minutes *= target / total;
  return { mail, doc, chat, bar, dock, scenes };
}

/* ---------------- tick stream ----------------
   Fills path buffers with one sample per tick: {xs, ys, idle}.
   idle=true during reading pauses (stillness grammar). The renderer
   thins idle trails but accumulates radius on every idle tick. */
function simulate(rnd, day){
  const CAP = 600000;                    // ~16.6h at 10 ticks/sec
  const xs = new Float32Array(CAP);
  const ys = new Float32Array(CAP);
  const idle = new Uint8Array(CAP);
  let n = 0, simSecs = 0;
  const full = () => n >= CAP - 64;

  const clampX = x => Math.max(40, Math.min(1560, x));
  const clampY = y => Math.max(30, Math.min(975, y));
  const rx = (z, m) => z.x0 + m + rnd()*(z.x1 - z.x0 - 2*m);
  const ry = (z, m) => (z.y0||0) + m + rnd()*((z.y1||1000) - (z.y0||0) - 2*m);

  let x = 820 + (rnd()*2-1)*200, y = 946;
  xs[0] = x; ys[0] = y; idle[0] = 0; n = 1;

  function push(px, py, idl){
    if (full()) return;
    xs[n] = px; ys[n] = py; idle[n] = idl ? 1 : 0; n++;
  }

  // fast saccade-like move with a whisper of hand tremor
  function moveTo(nx, ny, sp){
    nx = clampX(nx); ny = clampY(ny);
    const x0 = x, y0 = y, dx = nx - x0, dy = ny - y0;
    const dist = Math.hypot(dx, dy);
    if (dist < 2){ x = nx; y = ny; push(x, y, false); simSecs += 0.1; return; }
    const steps = Math.max(2, Math.ceil(dist / sp));
    const px = -dy/dist, py = dx/dist;
    let ph = rnd()*6.283;
    for (let i = 1; i <= steps; i++){
      const t = i/steps, e = t*t*(3-2*t);
      ph += 0.9;
      const w = Math.sin(ph) * 1.1 * Math.sin(t*Math.PI);
      x = x0 + dx*e + px*w; y = y0 + dy*e + py*w;
      push(x, y, false);
    }
    simSecs += steps / TICKS_PER_SEC;
  }

  // reading pause: tiny jitter with a soft spring toward the anchor,
  // so the cursor stays inside the drift box while the radius grows
  function pause(secs, drift){
    const ticks = Math.round(secs * TICKS_PER_SEC);
    const cx = x, cy = y, d = drift || 1.8;
    for (let i = 0; i < ticks; i++){
      x += (rnd()*2-1)*d*0.5; y += (rnd()*2-1)*d*0.5;
      x += (cx-x)*0.06; y += (cy-y)*0.06;
      push(x, y, true);
      if (full()) break;
    }
    simSecs += secs;
  }

  // half-attentive slow drift (waiting in a meeting, thinking)
  function meander(secs, amp, sp){
    const ticks = Math.round(secs * TICKS_PER_SEC);
    const cx = x, cy = y;
    let hx = rnd()*6.28, hy = rnd()*6.28;
    for (let i = 0; i < ticks; i++){
      hx += 0.05 + rnd()*0.08; hy += 0.05 + rnd()*0.08;
      x += Math.cos(hx)*sp + (rnd()*2-1)*0.6;
      y += Math.sin(hy)*sp + (rnd()*2-1)*0.6;
      const dx = x-cx, dy = y-cy, dd = Math.hypot(dx, dy);
      if (dd > amp){ x = cx + dx/dd*amp; y = cy + dy/dd*amp; }
      x = clampX(x); y = clampY(y);
      if (i % 2 === 0) push(x, y, false);   // thin: it barely moves
      if (full()) break;
    }
    simSecs += secs;
  }

  const mail = day.mail, doc = day.doc, chat = day.chat, bar = day.bar, dock = day.dock;

  function dockRun(secs){
    const target = simSecs + secs;
    let dir = rnd() < 0.5 ? 1 : -1;
    moveTo(rx(dock, 40), dock.y0 + 4 + rnd()*8, 20);
    while (simSecs < target && !full()){
      const nx = dir > 0 ? dock.x1 - 40 - rnd()*200 : dock.x0 + 40 + rnd()*200;
      moveTo(nx, dock.y0 + 4 + rnd()*8, 24);
      pause(1.5 + rnd()*4);
      dir *= -1;
    }
  }
  function toolbarHops(secs){
    const target = simSecs + secs;
    while (simSecs < target && !full()){
      moveTo(bar.x0 + rnd()*(bar.x1 - bar.x0), bar.y0 + 6 + rnd()*(bar.y1 - bar.y0 - 12), 22);
      pause(1 + rnd()*3);
    }
  }
  function triageEmail(secs){
    const target = simSecs + secs;
    while (simSecs < target && !full()){
      const rowY = mail.y0 + 40 + Math.floor(rnd()*((mail.y1 - mail.y0 - 80)/64))*64;
      moveTo(rx(mail, 60), rowY + (rnd()*2-1)*14, 15 + rnd()*8);
      const read = 5 + rnd()*rnd()*16;
      pause(read);
      const r = rnd();
      if (r < 0.28){                       // open it: jump to the doc, read long
        moveTo(rx(doc, 80), ry(doc, 80), 20);
        pause(18 + rnd()*30);
        if (rnd() < 0.5){ moveTo(rx(mail, 60), rowY, 18); pause(3 + rnd()*6); }
      } else if (r < 0.58){                // quick scan down the list
        const hops = 2 + (rnd()*3|0);
        for (let h = 0; h < hops; h++){
          moveTo(rx(mail, 60), clampY(rowY + (h+1)*(50 + rnd()*40)), 22);
        }
        pause(4 + rnd()*10);
      }
    }
  }
  function deepWork(secs){
    const target = simSecs + secs;
    moveTo(rx(doc, 80), ry(doc, 80), 14);
    while (simSecs < target && !full()){
      const r = rnd();
      if (r < 0.55){                       // reading pause
        pause(18 + rnd()*rnd()*35);
        if (rnd() < 0.4) moveTo(x + (rnd()*2-1)*90, y + (rnd()*2-1)*60, 6);
      } else if (r < 0.75){                // small scroll while reading
        const k = 2 + (rnd()*4|0);
        for (let i = 0; i < k; i++){
          moveTo(x + (rnd()*2-1)*30, y + 70 + rnd()*90, 12);
          pause(4 + rnd()*9);
        }
      } else if (r < 0.9){                 // scan sweep across the doc
        moveTo(doc.x0 + rnd()*120, y + (rnd()*2-1)*120, 24);
        pause(2 + rnd()*5);
      } else {                             // glance away at mail or chat
        const zx = rnd() < 0.5 ? mail : chat;
        moveTo(rx(zx, 60), ry(zx, 60), 18);
        pause(6 + rnd()*12);
        moveTo(rx(doc, 80), ry(doc, 80), 18);
      }
    }
  }
  function chatBurst(secs){
    const target = simSecs + secs;
    moveTo(rx(chat, 40), ry(chat, 40), 18);
    while (simSecs < target && !full()){
      const r = rnd();
      if (r < 0.7){
        moveTo(rx(chat, 40), ry(chat, 40), 16 + rnd()*8);
        pause(3 + rnd()*rnd()*10);
      } else if (r < 0.85){                // check mail, come back
        moveTo(rx(mail, 60), ry(mail, 60), 18);
        pause(5 + rnd()*8);
        moveTo(rx(chat, 40), ry(chat, 40), 18);
      } else {                             // glance at the doc
        moveTo(rx(doc, 80), ry(doc, 80), 18);
        pause(8 + rnd()*12);
        moveTo(rx(chat, 40), ry(chat, 40), 18);
      }
    }
  }
  function meeting(secs){
    const target = simSecs + secs;
    moveTo(rx(doc, 120), ry(doc, 120), 12);
    meander(secs*0.25, 42, 0.8);           // settling, half attention
    pause(secs*(0.35 + rnd()*0.15));       // the long stillness
    meander(secs*0.2, 36, 0.7);
  }
  function afternoonScroll(secs){
    const target = simSecs + secs;
    moveTo(rx(doc, 100), doc.y0 + 60 + rnd()*120, 16);
    while (simSecs < target && !full()){
      const cycles = 6 + (rnd()*9|0);
      for (let i = 0; i < cycles && simSecs < target && !full(); i++){
        pause(5 + rnd()*12);               // read
        moveTo(x + (rnd()*2-1)*40, y + 90 + rnd()*140, 10 + rnd()*6); // scroll drift
      }
      if (y > doc.y1 - 160){               // bottom of the page: back to top
        moveTo(rx(doc, 100), doc.y0 + 80 + rnd()*160, 22);
        pause(4 + rnd()*8);
      }
      if (rnd() < 0.3){                    // distraction
        moveTo(rx(chat, 40), ry(chat, 40), 18);
        pause(8 + rnd()*15);
        moveTo(rx(doc, 100), y, 18);
      }
    }
  }
  function scanBursts(secs){
    const target = simSecs + secs;
    while (simSecs < target && !full()){
      const bursts = 2 + (rnd()*3|0);
      for (let b = 0; b < bursts && simSecs < target && !full(); b++){
        const y0 = doc.y0 + 60 + rnd()*(doc.y1 - doc.y0 - 260);
        moveTo(doc.x0 + rnd()*80, y0, 20);
        const sweeps = 3 + (rnd()*4|0);
        for (let s = 0; s < sweeps; s++){
          moveTo(doc.x1 - rnd()*100, y0 + (s+1)*(70 + rnd()*60), 26 + rnd()*10);
        }
        pause(6 + rnd()*14);
      }
      if (rnd() < 0.5){
        moveTo(rx(mail, 60), ry(mail, 60), 18);
        pause(10 + rnd()*20);
      }
    }
  }
  function wrapUp(secs){
    dockRun(secs*0.35);
    toolbarHops(secs*0.2);
    const target = simSecs + secs*0.35;
    while (simSecs < target && !full()){    // last quick pass over mail
      moveTo(rx(mail, 60), mail.y0 + 60 + rnd()*(mail.y1 - mail.y0 - 120), 20);
      pause(4 + rnd()*8);
    }
    moveTo(70 + rnd()*60, 950, 16);        // park in the corner
    pause(120 + rnd()*120);
  }

  for (const sc of day.scenes){
    if (full()) break;
    switch (sc.kind){
      case "boot": dockRun(sc.minutes*60*0.5); toolbarHops(sc.minutes*60*0.35);
                   pause(20 + rnd()*40); break;
      case "email": triageEmail(sc.minutes*60); break;
      case "work": deepWork(sc.minutes*60); break;
      case "chat": chatBurst(sc.minutes*60); break;
      case "meet": meeting(sc.minutes*60); break;
      case "lunch": moveTo(rx(mail, 150), ry(mail, 150), 12);  // settle in before leaving,
                   pause(sc.minutes*60*(0.85 + rnd()*0.1));   // so the long stillness lands on screen
                   moveTo(rx(mail, 60), ry(mail, 60), 16);
                   pause(20 + rnd()*30); break;
      case "scroll": afternoonScroll(sc.minutes*60); break;
      case "scan": scanBursts(sc.minutes*60); break;
      case "wrap": wrapUp(sc.minutes*60); break;
    }
  }
  return { xs, ys, idle, n, simSecs };
}

/* ---------------- render: Zenkov's recipe, two inks ---------------- */
function render(path){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = stage.clientWidth, ch = stage.clientHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  const ctx = canvas.getContext("2d");

  // paper
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#f4efe3";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const s = (cw / VW);   // stage keeps 8:5, so one scale fits both axes
  ctx.setTransform(s*dpr, 0, 0, s*dpr, 0, 0);
  ctx.lineWidth = 0.45;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const { xs, ys, idle, n } = path;
  const buckets = [];
  for (let i = 0; i < HUE_BUCKETS; i++) buckets.push([]);
  let segsSinceFlush = 0;
  const dots = [];

  function flush(){
    for (let b = 0; b < HUE_BUCKETS; b++){
      const arr = buckets[b];
      if (!arr.length) continue;
      const t = (b + 0.5) / HUE_BUCKETS;
      ctx.strokeStyle = css(lerpInk(INK_A, INK_B, t), 0.5);
      ctx.beginPath();
      for (let i = 0; i < arr.length; i += 4){
        ctx.moveTo(arr[i], arr[i+1]);
        ctx.lineTo(arr[i+2], arr[i+3]);
      }
      ctx.stroke();
      arr.length = 0;
    }
    segsSinceFlush = 0;
  }

  // recipe state
  let ax = xs[0], ay = ys[0], radius = 0;
  let lx = ax, ly = ay;   // last drawn point (thinning)

  for (let i = 1; i < n; i++){
    const x = xs[i], y = ys[i], idl = idle[i] === 1;
    // stillness box: accumulate radius while inside, stamp on exit
    if (Math.abs(x - ax) > DRIFT_BOX || Math.abs(y - ay) > DRIFT_BOX){
      if (radius > DOT_MIN_R){
        dots.push({ x: ax, y: ay, r: radius, t: inkT(Math.atan2(y - ay, x - ax)) });
      }
      ax = x; ay = y; radius = 0;
    }
    if (idl) radius += RADIUS_RATE;
    // thin idle trails (every 8th tick); moves draw every tick
    if ((idl && i % 8 !== 0) || (x === lx && y === ly)) continue;
    const b = Math.min(HUE_BUCKETS - 1, (inkT(Math.atan2(y - ly, x - lx)) * HUE_BUCKETS)|0);
    buckets[b].push(lx, ly, x, y);
    lx = x; ly = y;
    if (++segsSinceFlush > 8000) flush();
  }
  flush();

  // idle dots on top: halo, ring, solid dot of diameter 2*sqrt(radius).
  // halos and dots are restrained (faint, clamped) so attention zones
  // read as ink on paper, not smoke.
  for (const d of dots){
    const dotD = 2 * Math.sqrt(d.r);
    const col = lerpInk(DEEP_A, DEEP_B, d.t);
    const haloR = Math.min(d.r, 120);              // 2r diameter, clamped
    const haloA = Math.max(0.01, 0.07 - d.r/9000);
    if (haloR > 2){
      const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, haloR);
      g.addColorStop(0, css(col, haloA));
      g.addColorStop(1, css(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(d.x, d.y, haloR, 0, 6.2832); ctx.fill();
    }
    ctx.strokeStyle = css(col, 0.42);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(d.x, d.y, dotD/2, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = css(col, dotD > 120 ? 0.38 : 0.72);
    ctx.beginPath(); ctx.arc(d.x, d.y, dotD/2, 0, 6.2832); ctx.fill();
  }
  return path.simSecs;
}

/* ---------------- page ---------------- */
const stage = document.getElementById("stage");
let path = null;

function fmtHours(simSecs){
  const startMin = 9*60;
  const endMin = startMin + simSecs/60;
  const f = m => {
    let h = Math.floor(m/60), mm = Math.floor(m%60);
    const ap = h >= 12 ? "pm" : "am";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + String(mm).padStart(2, "0") + ap;
  };
  return f(startMin) + " to " + f(endMin);
}

function build(){
  const t0 = performance.now();
  const rnd = mulberry32(seed);
  const day = buildDay(rnd);
  path = simulate(rnd, day);
  const simSecs = render(path);
  document.getElementById("seedline").textContent = "seed " + seed;
  document.getElementById("stamp").textContent =
    "aug 18, 2026 · " + fmtHours(simSecs) + " · " +
    (simSecs/3600).toFixed(1) + " h of cursor";
  // eslint-disable-next-line no-console
  console.log("idle-day: seed " + seed + ", " + path.n + " ticks in " +
    Math.round(performance.now() - t0) + "ms");
}

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (path) render(path); }, 250);
});

stage.addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  // let the UI breathe before the (slow) rebuild
  stage.style.opacity = "0.35";
  setTimeout(() => { build(); stage.style.opacity = "1"; }, 60);
});

// build after first paint so the header shows during the slow render
requestAnimationFrame(() => setTimeout(build, 30));
</script>
</body>
</html>
