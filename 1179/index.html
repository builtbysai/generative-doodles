<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Subtraction</title>
<style>
  html, body { margin: 0; padding: 0; background: #111114; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- The Subtraction — Jason Soliday study block SD4 ----------
  // The score is a module inventory. Ten lines type out in the left margin;
  // each line activates a lane, and every lane re-renders the SAME master
  // signal after the chain of processes above it (plus its own) has been
  // applied: oscillator passes it through, filters smooth it (widening
  // moving averages), sloths drag it with an ultra-slow wander and thicken
  // the air, tremolos pulse its amplitude, equalizers recolor it by local
  // frequency band and reshape it with band gains. Every 60 s the inventory
  // shuffles (seeded per cycle, one module may drop and another double),
  // the list re-types, and the lanes rebuild — but the master signal runs
  // on one continuous global time and never jumps.
  //
  // The prompt's sloth is a Lorenz-style chaos integrator; an integrator is
  // frame-accumulated state, so here the wander is a quasiperiodic sum of
  // incommensurate slow sines instead — closed-form in t, deterministic,
  // and just as thick. Everything on screen is a pure function of t.

  var TAU = Math.PI * 2;
  var T0 = 26;               // fixed first-frame phase: cycle 0, all typed
  var CYCLE = 60;            // seconds per inventory cycle
  var N = 240;               // samples across each lane

  var BG = '#111114';
  var INV = '#C9C9D2';
  var LINE = '#E8E6DF';
  var OSC = '#F5F2E8';
  var FILT_TINT = '#9FB8AD';
  var HAZE = '#7C8FA0';
  var TREM = '#FFD166';
  var HEADER = '#6E6E78';
  var EQ_BANDS = ['#2E5A88', '#3E7A5E', '#8A4D6B'];  // low / mid / high
  var EQ_GAINS = [0.92, 1.10, 0.82];
  var FILT_WINDOWS = [5, 13, 25, 41, 61];

  var CANON = ['oscillator', 'filter', 'filter', 'sloth', 'sloth',
               'tremolo', 'tremolo', 'equalizer', 'equalizer', 'equalizer'];
  var SEED = 1179;

  // ---------- seeded rng / hashing ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function inventoryFor(cycle) {
    var inv = CANON.slice();
    if (cycle === 0) return inv;
    var rng = mulberry32((SEED ^ Math.imul(cycle + 1, 0x9E3779B9)) >>> 0);
    for (var i = inv.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = inv[i]; inv[i] = inv[j]; inv[j] = tmp;
    }
    if (rng() < 0.75) {                    // one module drops, another doubles
      var dj = Math.floor(rng() * 10), dk = Math.floor(rng() * 10);
      if (dk !== dj) inv[dj] = inv[dk];
    }
    return inv;
  }

  // ---------- the master signal ----------
  // Ultra-slow wander ("sloth"): quasiperiodic, closed-form, range ~[-1, 1].
  function sloth(t) {
    return 0.6 * Math.sin(0.043 * t) + 0.4 * Math.sin(0.0113 * t + 1.3);
  }
  function slothAmp(t) {
    return 0.7 * Math.sin(0.017 * t + 0.6) + 0.3 * Math.sin(0.0051 * t + 2.2);
  }
  function masterAt(u, t) {
    var sp = 0.9 * sloth(t);
    var v = 0.52 * Math.sin(TAU * 1.25 * u + 0.13 * t + sp)
          + 0.30 * Math.sin(TAU * 3.05 * u - 0.083 * t + 1.7 + 0.5 * sp)
          + 0.17 * Math.sin(TAU * 6.40 * u + 0.057 * t + 4.1);
    return v * (1 + 0.12 * slothAmp(t));
  }

  // ---------- chain processing on a sampled array ----------
  function movingAverage(a, w) {
    var half = (w - 1) / 2, out = new Array(a.length), i, j, s, c;
    for (i = 0; i < a.length; i++) {
      s = 0; c = 0;
      for (j = i - half; j <= i + half; j++) {
        var k = j < 0 ? 0 : (j >= a.length ? a.length - 1 : j);
        s += a[k]; c++;
      }
      out[i] = s / c;
    }
    return out;
  }

  function bandOf(d) {                     // local slope -> frequency band
    if (d < 0.012) return 0;
    if (d < 0.030) return 1;
    return 2;
  }

  // Apply one module to array a (mutates counts in st). Returns new array.
  function applyModule(a, mod, t, st) {
    var i, u;
    if (mod === 'oscillator') {
      return a;
    }
    if (mod === 'filter') {
      st.filt++;
      var w = FILT_WINDOWS[Math.min(st.filt - 1, FILT_WINDOWS.length - 1)];
      return movingAverage(a, w);
    }
    if (mod === 'sloth') {
      st.sloth++;
      var off = 0.16 * st.sloth * sloth(t);
      var sw = 2.2 * sloth(t), amp = 1 + 0.03 * st.sloth;
      for (i = 0; i < a.length; i++) {
        u = i / (a.length - 1);
        a[i] = a[i] * amp + off + 0.10 * st.sloth * Math.sin(TAU * 0.65 * u + sw);
      }
      return a;
    }
    if (mod === 'tremolo') {
      st.trem++;
      var rate = 0.45 + 0.30 * st.trem;
      var pulse = 0.5 + 0.5 * Math.sin(TAU * rate * t);
      var env = 0.55 + 0.45 * pulse;
      st.pulse = pulse;
      for (i = 0; i < a.length; i++) a[i] *= env;
      return a;
    }
    if (mod === 'equalizer') {
      st.eq++;
      // per-sample band gains, smoothed over 5 samples so band edges
      // reshape the line instead of stepping it
      var gains = new Array(a.length), out = a.slice(), j2, s2, c2;
      for (i = 0; i < a.length; i++) {
        var i0 = i > 0 ? i - 1 : 0, i1 = i < a.length - 1 ? i + 1 : a.length - 1;
        gains[i] = EQ_GAINS[bandOf(Math.abs(a[i1] - a[i0]))];
      }
      for (i = 0; i < a.length; i++) {
        s2 = 0; c2 = 0;
        for (j2 = i - 2; j2 <= i + 2; j2++) {
          var k2 = j2 < 0 ? 0 : (j2 >= a.length ? a.length - 1 : j2);
          s2 += gains[k2]; c2++;
        }
        out[i] = a[i] * (s2 / c2);
      }
      return out;
    }
    return a;
  }

  function lerpColor(c1, c2, f) {
    var a = [parseInt(c1.slice(1, 3), 16), parseInt(c1.slice(3, 5), 16), parseInt(c1.slice(5, 7), 16)];
    var b = [parseInt(c2.slice(1, 3), 16), parseInt(c2.slice(3, 5), 16), parseInt(c2.slice(5, 7), 16)];
    var r = Math.round(a[0] + (b[0] - a[0]) * f);
    var g = Math.round(a[1] + (b[1] - a[1]) * f);
    var bl = Math.round(a[2] + (b[2] - a[2]) * f);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  // ---------- view / canvas ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var lastT = T0;

  function viewW() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vv && vv.width) return vv.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vv && vv.height) return vv.height;
    return window.innerHeight || 800;
  }
  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw || 9999, sh || 9999);
    if (mn < 700) return true;
    return H > W * 1.15;
  }
  function fit() {
    W = viewW(); H = viewH();
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(lastT); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(lastT); });
  }

  // ---------- drawing ----------
  function tracePath(a, x0, x1, cy, amp) {
    ctx.beginPath();
    for (var i = 0; i < a.length; i++) {
      var u = i / (a.length - 1);
      var v = a[i]; if (v > 1.3) v = 1.3; if (v < -1.3) v = -1.3;
      var x = x0 + u * (x1 - x0), y = cy - v * amp;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }

  function draw(t) {
    lastT = t;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var phone = isPhone();
    var headerH = Math.max(30, Math.min(52, H * 0.07));
    var marginW = phone ? 92 : Math.max(150, Math.min(230, W * 0.17));
    var x0 = marginW + 14, x1 = W - 18;
    var laneTop = headerH, laneH = (H - headerH) / 10;
    var invFont = phone ? 10.5 : 13;
    var headFont = phone ? 9.5 : 11.5;

    var cycle = Math.floor(t / CYCLE);
    var ct = t - cycle * CYCLE;
    var inv = inventoryFor(cycle);

    // header
    ctx.font = headFont + 'px monospace';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = HEADER;
    ctx.textAlign = 'left';
    ctx.fillText('THE SUBTRACTION — a score in ten modules', 14, headerH / 2);
    ctx.textAlign = 'right';
    ctx.fillText(sloth(t) > 0 ? 'the air is thick' : 'the air is thin', W - 14, headerH / 2);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(232,230,223,0.14)';
    ctx.fillRect(0, headerH - 0.5, W, 1);

    // master samples
    var arr = new Array(N);
    var i;
    for (i = 0; i < N; i++) arr[i] = masterAt(i / (N - 1), t);

    var st = { filt: 0, sloth: 0, trem: 0, eq: 0, pulse: 0 };

    for (var lane = 0; lane < 10; lane++) {
      var mod = inv[lane];
      var cy = laneTop + laneH * (lane + 0.5);
      var amp = laneH * 0.34;
      var typeStart = lane * 2, typeDur = 0.5;
      var active = ct >= typeStart + typeDur;

      // chain input for this lane is `arr`; apply this lane's module
      var before = arr;
      arr = applyModule(arr.slice(), mod, t, st);

      // lane separator
      ctx.fillStyle = 'rgba(232,230,223,0.07)';
      ctx.fillRect(x0 - 8, laneTop + laneH * (lane + 1) - 0.5, (x1 - x0) + 8, 1);

      if (!active) {
        // guide line: the signal as it enters this stage, faint
        ctx.strokeStyle = LINE;
        ctx.globalAlpha = 0.20;
        ctx.lineWidth = 1.2;
        tracePath(before, x0, x1, cy, amp);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        // sloth haze: flat alpha bands, thickening with each sloth stage
        if (st.sloth > 0) {
          ctx.fillStyle = HAZE;
          ctx.globalAlpha = 0.05 + 0.035 * st.sloth;
          ctx.fillRect(x0, cy - laneH * 0.30, x1 - x0, laneH * 0.60);
          ctx.globalAlpha = 0.04 + 0.03 * st.sloth;
          ctx.fillRect(x0, cy - laneH * 0.16, x1 - x0, laneH * 0.32);
          ctx.globalAlpha = 1;
          // a soft under-stroke of the line itself, thickened air
          ctx.strokeStyle = HAZE;
          ctx.globalAlpha = 0.22;
          ctx.lineWidth = 4.5;
          tracePath(arr, x0, x1, cy, amp);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        // tremolo pulse overlay goes UNDER the line so band colors stay crisp
        if (st.trem > 0) {
          ctx.strokeStyle = TREM;
          ctx.globalAlpha = 0.16 + 0.42 * st.pulse;
          ctx.lineWidth = 3.4;
          tracePath(arr, x0, x1, cy, amp);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        if (st.eq > 0) {
          // band-colored segments by local frequency content
          ctx.lineWidth = 2.2;
          for (i = 0; i < N - 1; i++) {
            var d = Math.abs(arr[i + 1] - arr[i]);
            ctx.strokeStyle = EQ_BANDS[bandOf(d * 2)];
            var ua = i / (N - 1), ub = (i + 1) / (N - 1);
            var va = arr[i] > 1.3 ? 1.3 : (arr[i] < -1.3 ? -1.3 : arr[i]);
            var vb = arr[i + 1] > 1.3 ? 1.3 : (arr[i + 1] < -1.3 ? -1.3 : arr[i + 1]);
            ctx.beginPath();
            ctx.moveTo(x0 + ua * (x1 - x0), cy - va * amp);
            ctx.lineTo(x0 + ub * (x1 - x0), cy - vb * amp);
            ctx.stroke();
          }
        } else {
          ctx.strokeStyle = st.filt > 0
            ? lerpColor(OSC, FILT_TINT, Math.min(1, 0.45 * st.filt))
            : OSC;
          ctx.lineWidth = 1.6;
          tracePath(arr, x0, x1, cy, amp);
          ctx.stroke();
        }
      }

      // inventory line in the margin (doubles as the lane tag)
      ctx.font = invFont + 'px monospace';
      var name = mod;
      var shown;
      if (ct < typeStart) shown = 0;
      else if (ct >= typeStart + typeDur) shown = name.length;
      else shown = Math.floor(((ct - typeStart) / typeDur) * name.length);
      ctx.fillStyle = 'rgba(110,110,120,0.9)';
      ctx.fillText((lane + 1 < 10 ? '0' : '') + (lane + 1), 12, cy);
      ctx.fillStyle = active ? INV : 'rgba(201,201,210,0.55)';
      var tx = phone ? 30 : 34;
      if (shown > 0) ctx.fillText(name.slice(0, shown), tx, cy);
      if (ct >= typeStart && ct < typeStart + typeDur) {
        var cxp = tx + ctx.measureText(name.slice(0, shown)).width + 2;
        ctx.fillStyle = INV;
        ctx.globalAlpha = 0.85;
        ctx.fillRect(cxp, cy - invFont * 0.52, invFont * 0.58, invFont * 1.04);
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------- run ----------
  fit();
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var startStamp = null;
    var frame = function (now) {
      if (startStamp === null) startStamp = now;
      draw(T0 + (now - startStamp) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
