<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shelf Is the Work</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // Seeded PRNG (mulberry32). No Math.random anywhere.
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Prompt palette only.
  var WOOD = '#8a6a48';
  var SPINES = ['#4a5a7a', '#6b4a3a', '#2f4636', '#7a6a8a', '#d8d2c4'];
  var GOLD = '#d9a441';
  var SHADOW = '#2a2a30';
  var SHADOW_A = 'rgba(42,42,48,0.55)';
  var CREAM = '#d8d2c4';
  var TEAL = '#2e6f6a';
  var SCARLET = '#c1272d';
  var BRICK = '#a8674a';
  var GREY = '#b8bcc0';
  var IVORY = '#f2ead8';

  var COLS = 10, ROWS = 5;
  var LIT_SECONDS = 7; // lit shelf advances every 7 s (own timing, distinct from CR6's 6 s)
  var PULL_PX_FRAC = 0.024; // pulled spine rises by this fraction of height
  var ANIM_SECONDS = 0.3;

  // Spine data: seeded per spine (seed 1484000 + index * 7919).
  var spineData = [];
  for (var i = 0; i < COLS * ROWS; i++) {
    var r = mulberry32(1484000 + i * 7919);
    spineData.push({ color: SPINES[Math.floor(r() * SPINES.length)], stripe: r() < 0.35 });
  }

  var CW = 0, CH = 0, now = 0;
  var events = []; // successful spine taps, in order: {t, spine}

  function viewportSize() {
    var w, h;
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: w, h: h };
  }

  function resize() {
    var s = viewportSize();
    CW = s.w; CH = s.h;
    canvas.width = CW; canvas.height = CH;
    canvas.style.width = CW + 'px';
    canvas.style.height = CH + 'px';
  }

  // Geometry, as pure functions of CW/CH so probes and taps agree.
  function layout() {
    var gridX = CW * 0.03, gridW = CW * 0.94;
    var gridY = CH * 0.04, gridH = CH * 0.92;
    var colW = gridW / COLS, rowH = gridH / ROWS;
    var boardH = Math.max(6, CH * 0.014);
    var spW = colW * 0.72, spH = rowH * 0.66;
    var mw = CW * 0.40, mh = CH * 0.32;
    return {
      gridX: gridX, gridW: gridW, gridY: gridY, gridH: gridH,
      colW: colW, rowH: rowH, boardH: boardH, spW: spW, spH: spH,
      monitor: { x: (CW - mw) / 2, y: (CH - mh) / 2, w: mw, h: mh }
    };
  }

  function spineRect(idx, L) {
    var col = idx % COLS, row = Math.floor(idx / COLS);
    var x = L.gridX + col * L.colW + (L.colW - L.spW) / 2;
    var y = L.gridY + row * L.rowH + (L.rowH - L.spH - L.boardH);
    return { x: x, y: y, w: L.spW, h: L.spH };
  }

  // Closed-form tap state at time t: scan recorded taps in order.
  function stateAt(t) {
    var pulled = -1, prevPulled = -1, changeT = 0;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.t > t) break;
      if (e.spine === pulled) { prevPulled = pulled; pulled = -1; changeT = e.t; }
      else { prevPulled = pulled; pulled = e.spine; changeT = e.t; }
    }
    return { pulled: pulled, prevPulled: prevPulled, changeT: changeT };
  }

  function pullOffset(idx, st, t) {
    var pullH = CH * PULL_PX_FRAC;
    var k = Math.min(1, (t - st.changeT) / ANIM_SECONDS);
    if (idx === st.pulled) return -pullH * k;
    if (idx === st.prevPulled) return -pullH * (1 - k);
    return 0;
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- Miniature scenes, drawn inside the monitor screen rect (sx, sy, sw, sh).
  // Each is a closed-form function of piece time t. No text anywhere.
  function miniRoom(t, sx, sy, sw, sh) {
    rect(sx, sy, sw, sh, CREAM);
    rect(sx, sy + sh * 0.72, sw, sh * 0.28, WOOD);
    var cols = [SHADOW, TEAL, GREY];
    var lt = t % 12;
    var speaker = Math.floor(lt / 4) % 3;
    for (var i = 0; i < 3; i++) {
      var fx = sx + sw * (0.18 + i * 0.32);
      var fw = sw * 0.16, fh = sh * 0.42;
      var fy = sy + sh * 0.72 - fh;
      rect(fx, fy, fw, fh, cols[i]);
      dot(fx + fw / 2, fy - sh * 0.07, sh * 0.055, IVORY);
      if (i === speaker) {
        // Zigzag voice-line rising from the speaker.
        ctx.strokeStyle = GOLD; ctx.lineWidth = Math.max(1, sh * 0.012);
        ctx.beginPath();
        var vx = fx + fw / 2, vy = fy - sh * 0.13;
        ctx.moveTo(vx, vy);
        ctx.lineTo(vx + sw * 0.03, vy - sh * 0.05);
        ctx.lineTo(vx - sw * 0.02, vy - sh * 0.10);
        ctx.lineTo(vx + sw * 0.03, vy - sh * 0.15);
        ctx.stroke();
      }
    }
  }

  function miniCrowd(t, sx, sy, sw, sh) {
    rect(sx, sy, sw, sh, WOOD);
    var cols = [SHADOW, TEAL, CREAM, GREY, SHADOW, TEAL, CREAM];
    for (var i = 0; i < 7; i++) {
      var fx = sx + sw * (0.08 + i * 0.13);
      var fw = sw * 0.10, fh = sh * 0.34;
      var nod = Math.sin(t * 1.4 + i * 0.9) * sh * 0.02;
      var fy = sy + sh * 0.78 - fh + nod;
      rect(fx, fy, fw, fh, cols[i]);
      dot(fx + fw / 2, fy - sh * 0.06, sh * 0.05, IVORY);
    }
  }

  function miniMonitors(t, sx, sy, sw, sh) {
    rect(sx, sy, sw, sh, SHADOW);
    var screens = [CREAM, GREY, TEAL];
    for (var i = 0; i < 3; i++) {
      var mx = sx + sw * (0.08 + i * 0.32);
      var mw = sw * 0.24, mh = sh * 0.52;
      var my = sy + sh * 0.24;
      rect(mx, my, mw, mh, SHADOW);
      var phase = Math.floor(t / 2) % 3;
      rect(mx + mw * 0.08, my + mh * 0.10, mw * 0.84, mh * 0.80, screens[(i + phase) % 3]);
      // Flickering abstract blocks.
      var bt = Math.floor(t / 2);
      var bx = mx + mw * (0.15 + ((bt + i) % 3) * 0.22);
      rect(bx, my + mh * 0.30, mw * 0.18, mh * 0.18, SCARLET);
      rect(mx + mw * 0.55, my + mh * 0.55, mw * 0.20, mh * 0.16, GOLD);
    }
  }

  function drawMonitor(t, st, L) {
    var m = L.monitor;
    rect(m.x, m.y, m.w, m.h, SHADOW);
    ctx.strokeStyle = GOLD; ctx.lineWidth = Math.max(2, CW * 0.002);
    ctx.strokeRect(m.x, m.y, m.w, m.h);
    var pad = Math.max(8, CW * 0.008);
    var sx = m.x + pad, sy = m.y + pad, sw = m.w - pad * 2, sh = m.h - pad * 2;
    if (st.pulled < 0) {
      // Idle: a small gold dot drifting slowly across the dark screen.
      rect(sx, sy, sw, sh, SHADOW);
      var dx = sx + sw * (0.15 + 0.70 * (0.5 + 0.5 * Math.sin(t * 0.5)));
      dot(dx, sy + sh / 2, Math.max(3, sh * 0.05), GOLD);
    } else if (st.pulled % 3 === 0) {
      miniRoom(t, sx, sy, sw, sh);
    } else if (st.pulled % 3 === 1) {
      miniCrowd(t, sx, sy, sw, sh);
    } else {
      miniMonitors(t, sx, sy, sw, sh);
    }
  }

  function draw(t) {
    now = t;
    resize();
    var L = layout();
    // Wall: the prompt's shadow colour, so the lit shelf reads against it.
    rect(0, 0, CW, CH, SHADOW);
    var st = stateAt(t);
    var litRow = Math.floor(t / LIT_SECONDS) % ROWS;

    // Shelf boards.
    for (var r = 0; r < ROWS; r++) {
      var by = L.gridY + (r + 1) * L.rowH - L.boardH;
      rect(L.gridX, by, L.gridW, L.boardH, WOOD);
    }
    // Spines.
    for (var i = 0; i < COLS * ROWS; i++) {
      var sr = spineRect(i, L);
      var off = pullOffset(i, st, t);
      var d = spineData[i];
      rect(sr.x, sr.y + off, sr.w, sr.h, d.color);
      if (d.stripe) rect(sr.x + sr.w * 0.14, sr.y + off, Math.max(2, sr.w * 0.12), sr.h, GOLD);
    }
    // Soft shadow over every row except the lit one.
    for (var r2 = 0; r2 < ROWS; r2++) {
      if (r2 === litRow) continue;
      rect(L.gridX, L.gridY + r2 * L.rowH, L.gridW, L.rowH, SHADOW_A);
    }
    // Gold underline marks the lit shelf.
    var lby = L.gridY + (litRow + 1) * L.rowH - L.boardH;
    rect(L.gridX, lby + L.boardH + 2, L.gridW, Math.max(2, CH * 0.003), GOLD);
    // Monitor above the grid.
    drawMonitor(t, st, L);
    // A pulled spine is drawn again on top so it stays visible if it
    // overlaps the monitor edge.
    if (st.pulled >= 0) {
      var pr = spineRect(st.pulled, L);
      var poff = pullOffset(st.pulled, st, t);
      var pd = spineData[st.pulled];
      rect(pr.x, pr.y + poff, pr.w, pr.h, pd.color);
      if (pd.stripe) rect(pr.x + pr.w * 0.14, pr.y + poff, Math.max(2, pr.w * 0.12), pr.h, GOLD);
    }
  }

  function handleTap(x, y) {
    var L = layout();
    var m = L.monitor;
    if (x >= m.x && x <= m.x + m.w && y >= m.y && y <= m.y + m.h) return; // monitor taps ignored
    var pullH = CH * PULL_PX_FRAC;
    for (var i = 0; i < COLS * ROWS; i++) {
      var sr = spineRect(i, L);
      // Hit area extends upward by the pull distance so a pulled spine
      // can be tapped back.
      if (x >= sr.x && x <= sr.x + sr.w && y >= sr.y - pullH && y <= sr.y + sr.h) {
        events.push({ t: now, spine: i });
        return;
      }
    }
  }

  var downX = 0, downY = 0;
  canvas.addEventListener('pointerdown', function (e) {
    downX = e.clientX; downY = e.clientY;
  });
  canvas.addEventListener('pointerup', function (e) {
    var dx = e.clientX - downX, dy = e.clientY - downY;
    if (dx * dx + dy * dy <= 144) handleTap(e.clientX, e.clientY);
  });

  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      tap: function (x, y) { handleTap(x, y); },
      state: function () { return stateAt(now); },
      litRow: function () { return Math.floor(now / LIT_SECONDS) % ROWS; },
      spines: function () {
        var L = layout(), out = [];
        for (var i = 0; i < COLS * ROWS; i++) out.push(spineRect(i, L));
        return out;
      },
      monitor: function () { return layout().monitor; }
    };
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(now); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { draw(now); });
  }

  // Frame one is a constant phase: draw(0) synchronously at load.
  draw(0);

  var startTime = null;
  function loop(ts) {
    if (startTime === null) startTime = ts;
    draw((ts - startTime) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
