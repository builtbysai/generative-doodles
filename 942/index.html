<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fifty-Two Characters, One City</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2EDE2; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var PAPER = '#F2EDE2';
  var INK = '#1A1A1A';
  var LETTER = '#23211C';
  var DT = 1 / 120;              // fixed sim timestep (120 Hz)
  var PREROLL = 1800;            // 15 s of sim before frame one
  var BASE_SEED = 942103;
  var NIGHT_STEPS = 1200;        // 10 s of night service
  var CARD_STEPS = 600;          // 5 s card
  var SPARK_LIFE = 1.6;          // seconds a spark burst lives

  // line definitions: name, MTA color, node path on the shared grid,
  // age (0 young .. 1 old: shudder), trailSec (length), social (pause habit), speed
  var LINE_DEFS = [
    { name: 'the 1', color: '#EE352E', path: [[1,0],[1,1],[1,2],[2,3],[2,4],[3,5]], age: 0.90, trail: 3.0, social: 0.70, speed: 0.046 },
    { name: 'the 2', color: '#EE352E', path: [[0,1],[1,1],[2,2],[3,2],[4,3],[5,4],[6,4]], age: 0.55, trail: 4.5, social: 0.40, speed: 0.045 },
    { name: 'the 4', color: '#00985F', path: [[5,0],[5,1],[4,2],[4,3],[5,4],[6,5]], age: 0.85, trail: 2.5, social: 0.60, speed: 0.040 },
    { name: 'the 5', color: '#00985F', path: [[6,0],[5,1],[5,2],[4,3],[3,4],[3,5]], age: 0.20, trail: 5.5, social: 0.30, speed: 0.052 },
    { name: 'the 6', color: '#00985F', path: [[4,0],[4,1],[4,2],[3,3],[3,4],[2,5]], age: 0.75, trail: 3.5, social: 0.80, speed: 0.042 },
    { name: 'the 7', color: '#B933AD', path: [[0,3],[1,3],[2,3],[3,3],[4,3],[5,3],[6,3]], age: 0.15, trail: 6.0, social: 0.25, speed: 0.054 },
    { name: 'the A', color: '#2850AD', path: [[2,0],[2,1],[2,2],[3,3],[3,4],[4,5]], age: 0.80, trail: 4.0, social: 0.65, speed: 0.041 },
    { name: 'the C', color: '#2850AD', path: [[3,0],[3,1],[2,2],[2,3],[2,4],[1,5]], age: 0.50, trail: 3.0, social: 0.50, speed: 0.047 },
    { name: 'the E', color: '#2850AD', path: [[6,1],[6,2],[5,3],[4,3],[4,4],[3,5]], age: 0.30, trail: 5.0, social: 0.35, speed: 0.050 },
    { name: 'the L', color: '#A7A9AC', path: [[0,4],[1,4],[2,4],[3,4],[4,4],[5,4],[6,4]], age: 0.45, trail: 4.0, social: 0.55, speed: 0.044 }
  ];
  var NIGHT_OWLS = { 'the 7': true, 'the A': true, 'the L': true };

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var viewW = 300, viewH = 300, viewDpr = 1;

  function viewportSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && typeof window.innerWidth === 'number') {
      w = window.innerWidth; h = window.innerHeight;
    }
    if (!w || !h) { w = 300; h = 300; }
    return { w: w, h: h };
  }

  function isPhone() {
    if (typeof window !== 'undefined' && window.screen &&
        typeof window.screen.width === 'number' && typeof window.screen.height === 'number') {
      return Math.min(window.screen.width, window.screen.height) < 700;
    }
    var s = viewportSize();
    return s.h > s.w * 1.15; // aspect fallback only
  }

  function resize() {
    var s = viewportSize();
    viewW = s.w; viewH = s.h;
    viewDpr = 1;
    if (typeof window !== 'undefined' && typeof window.devicePixelRatio === 'number') {
      viewDpr = Math.min(window.devicePixelRatio || 1, 2);
    }
    canvas.width = Math.round(viewW * viewDpr);
    canvas.height = Math.round(viewH * viewDpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
  }

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  // ---------- world generation ----------
  // Shared seeded node grid: routes are paths over the same nodes, so any
  // node used by two or more lines is a transfer station by construction.
  var gridRng = mulberry32(BASE_SEED);
  var nodes = {}; // "c,r" -> {x, y, key, lines: []}
  function nodeAt(c, r) {
    var key = c + ',' + r;
    if (!nodes[key]) {
      nodes[key] = {
        key: key,
        x: 0.08 + c * (0.84 / 6) + (gridRng() - 0.5) * 0.036,
        y: 0.155 + r * (0.79 / 5) + (gridRng() - 0.5) * 0.04,
        lines: []
      };
    }
    return nodes[key];
  }

  var lines = [];
  var transferStations = []; // unique shared nodes

  LINE_DEFS.forEach(function (def, li) {
    var rng = mulberry32(BASE_SEED + 1000 + li * 77);
    var pts = [];       // wobbled polyline points {x,y}
    var cum = [];       // cumulative length at each point
    var stations = [];  // {dist, x, y, transfer, nodeKey}
    var total = 0;
    def.path.forEach(function (cr, ni) {
      var nd = nodeAt(cr[0], cr[1]);
      if (nd.lines.indexOf(li) === -1) nd.lines.push(li);
      if (ni === 0) {
        pts.push({ x: nd.x, y: nd.y }); cum.push(0);
        stations.push({ dist: 0, x: nd.x, y: nd.y, nodeKey: nd.key, nodeRef: nd });
        return;
      }
      var prev = def.path[ni - 1];
      var a = nodeAt(prev[0], prev[1]);
      var wob = (rng() - 0.5) * 0.028;
      var SUB = 6;
      var segStart = total;
      for (var k = 1; k <= SUB; k++) {
        var t = k / SUB;
        var px = a.x + (nd.x - a.x) * t + (-(nd.y - a.y)) * Math.sin(Math.PI * t) * wob;
        var py = a.y + (nd.y - a.y) * t + ((nd.x - a.x)) * Math.sin(Math.PI * t) * wob;
        var last = pts[pts.length - 1];
        total += Math.hypot(px - last.x, py - last.y);
        pts.push({ x: px, y: py }); cum.push(total);
        if (k === SUB / 2) {
          stations.push({ dist: total, x: px, y: py, nodeKey: null, nodeRef: null });
        }
      }
      stations.push({ dist: total, x: nd.x, y: nd.y, nodeKey: nd.key, nodeRef: nd });
      void segStart;
    });
    lines.push({
      def: def, pts: pts, cum: cum, len: total, stations: stations,
      speed: def.speed * (0.92 + rng() * 0.16),
      rng: rng
    });
  });

  // mark transfer stations (shared nodes) on every line + collect unique list
  Object.keys(nodes).forEach(function (key) {
    var nd = nodes[key];
    if (nd.lines.length >= 2) transferStations.push(nd);
  });
  lines.forEach(function (ln) {
    ln.stations.forEach(function (st) {
      st.transfer = !!(st.nodeRef && st.nodeRef.lines.length >= 2);
    });
    // pause schedule per transfer visit (seeded): social lines pause often
    ln.pauseDur = [];
    for (var i = 0; i < 128; i++) {
      ln.pauseDur.push(ln.rng() < ln.def.social ? 0.5 + ln.rng() * 1.6 : 0);
    }
  });

  // position + tangent at route distance u
  function posAt(ln, u) {
    var pts = ln.pts, cum = ln.cum;
    if (u <= 0) return { x: pts[0].x, y: pts[0].y, tx: pts[1].x - pts[0].x, ty: pts[1].y - pts[0].y };
    if (u >= ln.len) {
      var n = pts.length;
      return { x: pts[n - 1].x, y: pts[n - 1].y, tx: pts[n - 1].x - pts[n - 2].x, ty: pts[n - 1].y - pts[n - 2].y };
    }
    var lo = 0, hi = cum.length - 1;
    while (lo < hi - 1) { var mid = (lo + hi) >> 1; if (cum[mid] <= u) lo = mid; else hi = mid; }
    var f = (u - cum[lo]) / Math.max(1e-9, cum[hi] - cum[lo]);
    return {
      x: pts[lo].x + (pts[hi].x - pts[lo].x) * f,
      y: pts[lo].y + (pts[hi].y - pts[lo].y) * f,
      tx: pts[hi].x - pts[lo].x, ty: pts[hi].y - pts[lo].y
    };
  }
  function tri(s, L) { var m = s % (2 * L); if (m < 0) m += 2 * L; return m <= L ? m : 2 * L - m; }
  function triDir(s, L) { var m = s % (2 * L); if (m < 0) m += 2 * L; return m <= L ? 1 : -1; }

  // ---------- engineered first meeting ----------
  // Lines "the 1" (index 0) and "the 2" (index 1) share node 1,1 as the
  // first transfer each of them reaches. A deterministic dry-run scan over
  // start offsets picks offsets whose FIRST arrival at that station lands
  // together at ~14.5 s, so both pause there and a spark bursts in frame one.
  function dryRun(ln, s0, seconds) {
    var steps = Math.round(seconds / DT);
    var prevU = tri(s0, ln.len), prevD = {};
    ln.stations.forEach(function (st) { if (st.transfer) prevD[st.nodeKey] = prevU - st.dist; });
    var visits = []; // {nodeKey, time, visitIndex}
    var counts = {};
    for (var i = 1; i <= steps; i++) {
      var s = s0 + ln.speed * DT * i;
      var u = tri(s, ln.len);
      for (var k2 = 0; k2 < ln.stations.length; k2++) {
        var st2 = ln.stations[k2];
        if (!st2.transfer || st2.dist <= 0 || st2.dist >= ln.len) continue;
        var dNow = u - st2.dist;
        if (prevD[st2.nodeKey] !== undefined && ((prevD[st2.nodeKey] < 0 && dNow >= 0) || (prevD[st2.nodeKey] > 0 && dNow <= 0))) {
          counts[st2.nodeKey] = (counts[st2.nodeKey] || 0) + 1;
          visits.push({ nodeKey: st2.nodeKey, time: i * DT, visitIndex: visits.length });
        }
        prevD[st2.nodeKey] = dNow;
      }
      prevU = u;
    }
    return visits;
  }

  var meetTime = 14.5;
  (function planMeeting() {
    var A = lines[0], B = lines[1];
    var targetKey = '1,1';
    function targetDist(ln) {
      for (var i = 0; i < ln.stations.length; i++) if (ln.stations[i].nodeKey === targetKey) return ln.stations[i].dist;
      return -1;
    }
    function firstTargetTime(ln, s0) {
      // lean scan: first crossing of the target station only
      var d = -1;
      for (var i = 0; i < ln.stations.length; i++) if (ln.stations[i].nodeKey === targetKey) d = ln.stations[i].dist;
      if (d < 0) return null;
      var steps = Math.round(15.6 / DT);
      var prev = tri(s0, ln.len) - d;
      for (var k = 1; k <= steps; k++) {
        var now = tri(s0 + ln.speed * DT * k, ln.len) - d;
        if ((prev < 0 && now >= 0) || (prev > 0 && now <= 0)) return { time: k * DT };
        prev = now;
      }
      return null;
    }
    // line B first: scan offsets, keep the first-arrival closest to 14.5 s
    var bestB = null;
    for (var s0 = 0; s0 < 2 * B.len; s0 += 0.002) {
      var v = firstTargetTime(B, s0);
      if (v && (!bestB || Math.abs(v.time - 14.5) < Math.abs(bestB.visit.time - 14.5))) {
        bestB = { s0: s0, visit: v };
        if (Math.abs(v.time - 14.5) < 0.02) break;
      }
    }
    if (bestB) meetTime = bestB.visit.time;
    // line A: scan offsets to land on the same moment
    var bestA = null;
    for (var s1 = 0; s1 < 2 * A.len; s1 += 0.0015) {
      var v2 = firstTargetTime(A, s1);
      if (v2 && (!bestA || Math.abs(v2.time - meetTime) < Math.abs(bestA.visit.time - meetTime))) {
        bestA = { s0: s1, visit: v2 };
        if (Math.abs(v2.time - meetTime) < 0.015) break;
      }
    }
    function apply(ln, best) {
      if (!best) return 0;
      // zero every pause up to the meeting visit; the meeting visit pauses
      // 0.9 s so both characters linger together at the station
      var pre = dryRun(ln, best.s0, meetTime + 0.05);
      var targetVisit = -1;
      pre.forEach(function (vis) { if (vis.nodeKey === targetKey && targetVisit === -1) targetVisit = vis.visitIndex; });
      for (var i = 0; i < ln.pauseDur.length; i++) {
        if (i < targetVisit) ln.pauseDur[i] = 0;
        else if (i === targetVisit) ln.pauseDur[i] = 0.9;
      }
      return best.s0;
    }
    B.charS0 = apply(B, bestB);
    A.charS0 = apply(A, bestA);
    void targetDist;
  })();

  // ---------- characters & sim state ----------
  var simStep = 0;
  var chars = lines.map(function (ln, i) {
    var rng = mulberry32(BASE_SEED + 5000 + i * 131);
    var s0 = (ln.charS0 !== undefined) ? ln.charS0 : rng() * 2 * ln.len;
    return {
      line: ln, s: s0, pauseSteps: 0, visits: 0,
      x: 0, y: 0, tx: 1, ty: 0, dirSign: 1,
      trail: [], phase: rng() * Math.PI * 2,
      trailCap: Math.round(ln.def.trail / (4 * DT))
    };
  });
  var sparks = [];       // {x, y, birth, seed}
  var lastSparkAt = {};  // station key -> step of last spark
  var rushMult = 1;
  var nightUntil = -1;
  var cardLine = -1, cardUntil = -1;
  var pulseLine = -1, pulseStep = -1;

  // recorded events, consumed by the sim in step order
  var pendingEvents = [];
  function consumeEvents() {
    while (pendingEvents.length && pendingEvents[0].step <= simStep) {
      var ev = pendingEvents.shift();
      if (ev.type === 'tap' && ev.line >= 0) {
        cardLine = ev.line; cardUntil = simStep + CARD_STEPS;
        pulseLine = ev.line; pulseStep = simStep;
      } else if (ev.type === 'doubletap') {
        nightUntil = simStep + NIGHT_STEPS;
        cardLine = -1;
      } else if (ev.type === 'dragstart') {
        dragOn = true;
      } else if (ev.type === 'dragend') {
        dragOn = false;
      }
    }
  }
  var dragOn = false;

  // ---------- audio (lazy, gesture-only, fully guarded) ----------
  var audioCtx = null, humOsc = null, humGain = null, lastChimeStep = -999, lastSparkleStep = -999;
  function ensureAudio() {
    if (audioCtx) return;
    try {
      var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
      if (!AC) return;
      audioCtx = new AC();
      humOsc = audioCtx.createOscillator();
      humOsc.type = 'sawtooth';
      humOsc.frequency.value = 44;
      var lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 150;
      humGain = audioCtx.createGain(); humGain.gain.value = 0.035;
      humOsc.connect(lp); lp.connect(humGain); humGain.connect(audioCtx.destination);
      humOsc.start();
    } catch (e) { audioCtx = null; }
  }
  function blip(freq, t0, dur, gain) {
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* silent */ }
  }
  function chime() {
    if (!audioCtx || simStep - lastChimeStep < 40) return;
    lastChimeStep = simStep;
    var t = audioCtx.currentTime;
    blip(880, t, 0.18, 0.05); blip(1318, t + 0.07, 0.22, 0.04);
  }
  function sparkle() {
    if (!audioCtx || simStep - lastSparkleStep < 40) return;
    lastSparkleStep = simStep;
    var t = audioCtx.currentTime;
    blip(1760, t, 0.12, 0.035); blip(2217, t + 0.05, 0.12, 0.03); blip(2637, t + 0.1, 0.16, 0.025);
  }

  // ---------- sim step ----------
  function stepSim() {
    consumeEvents();
    var night = simStep < nightUntil;
    rushMult += (((dragOn) ? 2.2 : 1) - rushMult) * Math.min(1, DT * 2.5);

    chars.forEach(function (ch) {
      var ln = ch.line;
      if (night && !NIGHT_OWLS[ln.def.name]) return; // night: only owls run
      if (ch.pauseSteps > 0) { ch.pauseSteps--; return; }
      var prevU = tri(ch.s, ln.len);
      ch.s += ln.speed * rushMult * DT;
      var newU = tri(ch.s, ln.len);
      // transfer arrival? (interior stations only; termini just reverse)
      for (var i = 0; i < ln.stations.length; i++) {
        var st = ln.stations[i];
        if (!st.transfer || st.dist <= 0 || st.dist >= ln.len) continue;
        if ((prevU < st.dist && newU >= st.dist) || (prevU > st.dist && newU <= st.dist)) {
          var dur = ln.pauseDur[ch.visits % ln.pauseDur.length];
          ch.visits++;
          if (dur > 0) {
            if (rushMult > 1.4) dur *= 0.5;
            // snap s so u lands exactly on the station
            var m = ch.s % (2 * ln.len); if (m < 0) m += 2 * ln.len;
            if (m <= ln.len) ch.s += (st.dist - newU); else ch.s += (newU - st.dist);
            newU = st.dist;
            ch.pauseSteps = Math.round(dur / DT);
            chime();
          }
          break;
        }
      }
      var p = posAt(ln, newU);
      var d = triDir(ch.s, ln.len);
      ch.x = p.x; ch.y = p.y;
      ch.tx = p.tx * d; ch.ty = p.ty * d;
      ch.dirSign = d;
      if (simStep % 4 === 0) {
        ch.trail.push({ x: ch.x, y: ch.y });
        while (ch.trail.length > ch.trailCap) ch.trail.shift();
      }
    });

    // meetings: two characters at the same transfer station exchange a spark
    for (var a = 0; a < chars.length; a++) {
      for (var b = a + 1; b < chars.length; b++) {
        var ca = chars[a], cb = chars[b];
        var dx = ca.x - cb.x, dy = ca.y - cb.y;
        if (dx * dx + dy * dy > 0.013 * 0.013) continue;
        for (var t = 0; t < transferStations.length; t++) {
          var nd = transferStations[t];
          var ddx = ca.x - nd.x, ddy = ca.y - nd.y;
          if (ddx * ddx + ddy * ddy < 0.017 * 0.017) {
            if (simStep - (lastSparkAt[nd.key] || -9999) > 200) {
              lastSparkAt[nd.key] = simStep;
              sparks.push({ x: nd.x, y: nd.y, birth: simStep, seed: (simStep * 2654435761) % 100000 });
              sparkle();
            }
            break;
          }
        }
      }
    }
    sparks = sparks.filter(function (sp) { return (simStep - sp.birth) / 120 < SPARK_LIFE; });
    simStep++;
  }

  // ---------- card text ----------
  function cardText(ln) {
    var d = ln.def;
    var ageW = d.age >= 0.65 ? 'old' : (d.age <= 0.35 ? 'young' : 'middle-aged');
    var lenW = d.trail >= 4.5 ? 'long' : (d.trail <= 3.0 ? 'short' : 'middling');
    var socW = d.social >= 0.6 ? 'social' : (d.social <= 0.35 ? 'restless' : 'easygoing');
    var tail = d.social >= 0.6 ? 'always stopping to say hello' :
               (d.social <= 0.35 ? 'always running' : 'keeping its own timetable');
    return d.name + ' · ' + ageW + ', ' + lenW + ', ' + socW + ' · ' +
           ln.stations.length + ' stations, ' + tail;
  }

  // ---------- drawing ----------
  var HAND = '"Segoe Print","Bradley Hand","Comic Sans MS",cursive';

  function drawChar(ch, S) {
    var ln = ch.line;
    // shudder: older lines tremble (draw-only, a function of the step count)
    var sh = ln.def.age * 0.0055;
    var jx = sh * Math.sin(simStep * 0.9 + ch.phase) + sh * 0.6 * Math.sin(simStep * 2.7 + ch.phase * 2);
    var jy = sh * Math.cos(simStep * 1.1 + ch.phase) + sh * 0.6 * Math.cos(simStep * 3.1 + ch.phase);
    var x = (ch.x + jx) * viewW, y = (ch.y + jy) * viewH;
    var tl = Math.hypot(ch.tx, ch.ty) || 1;
    var ux = ch.tx / tl, uy = ch.ty / tl;
    var pulse = (pulseLine === lines.indexOf(ln) && simStep - pulseStep < 72)
      ? 1 + 0.35 * Math.sin((simStep - pulseStep) / 72 * Math.PI) : 1;
    var back = 0.030 * S * pulse, fwd = 0.013 * S * pulse;
    ctx.strokeStyle = ln.def.color;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(3, 0.020 * S * pulse);
    ctx.beginPath();
    ctx.moveTo(x - ux * back, y - uy * back);
    ctx.lineTo(x + ux * fwd, y + uy * fwd);
    ctx.stroke();
    // head
    ctx.fillStyle = ln.def.color;
    ctx.beginPath();
    ctx.arc(x + ux * (fwd + 0.004 * S), y + uy * (fwd + 0.004 * S), Math.max(2.4, 0.0105 * S * pulse), 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = PAPER;
    ctx.beginPath();
    ctx.arc(x + ux * (fwd + 0.004 * S), y + uy * (fwd + 0.004 * S), Math.max(1.1, 0.0042 * S * pulse), 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTrail(ch, S, bright) {
    var tr = ch.trail, n = tr.length;
    if (n < 2) return;
    ctx.strokeStyle = ch.line.def.color;
    ctx.lineCap = 'round';
    for (var i = 1; i < n; i++) {
      var f = i / n;
      ctx.globalAlpha = (bright ? 0.10 : 0.04) + 0.26 * f;
      ctx.lineWidth = Math.max(1, (0.0015 + 0.0095 * f) * S);
      ctx.beginPath();
      ctx.moveTo(tr[i - 1].x * viewW, tr[i - 1].y * viewH);
      ctx.lineTo(tr[i].x * viewW, tr[i].y * viewH);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(viewDpr, 0, 0, viewDpr, 0, 0);
    var S = Math.min(viewW, viewH);
    var night = simStep < nightUntil;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, viewW, viewH);

    // routes
    lines.forEach(function (ln) {
      ctx.strokeStyle = ln.def.color;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = Math.max(1.6, 0.0055 * S);
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ln.pts.forEach(function (p, i) {
        if (i === 0) ctx.moveTo(p.x * viewW, p.y * viewH);
        else ctx.lineTo(p.x * viewW, p.y * viewH);
      });
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // trails (under characters)
    chars.forEach(function (ch) { drawTrail(ch, S, false); });

    // stations
    lines.forEach(function (ln) {
      ln.stations.forEach(function (st) {
        if (st.transfer) return; // drawn once below
        ctx.fillStyle = INK;
        ctx.beginPath();
        ctx.arc(st.x * viewW, st.y * viewH, Math.max(1.8, 0.0052 * S), 0, Math.PI * 2);
        ctx.fill();
      });
    });
    transferStations.forEach(function (nd) {
      ctx.fillStyle = PAPER;
      ctx.beginPath();
      ctx.arc(nd.x * viewW, nd.y * viewH, Math.max(3.4, 0.010 * S), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(nd.x * viewW, nd.y * viewH, Math.max(2.2, 0.0062 * S), 0, Math.PI * 2);
      ctx.fill();
    });

    // line names at termini
    ctx.fillStyle = LETTER;
    ctx.font = '600 ' + Math.max(10, 0.023 * S) + 'px ' + HAND;
    lines.forEach(function (ln) {
      var p0 = ln.pts[0];
      var right = p0.x > 0.55;
      ctx.textAlign = right ? 'right' : 'left';
      var txp = (p0.x + (right ? -0.014 : 0.014)) * viewW;
      var typ = (p0.y - 0.016) * viewH;
      ctx.save();
      ctx.translate(txp, typ);
      ctx.rotate(right ? 0.02 : -0.02);
      ctx.lineWidth = 3; ctx.strokeStyle = PAPER;
      ctx.strokeText(ln.def.name, 0, 0);
      ctx.fillText(ln.def.name, 0, 0);
      ctx.restore();
    });

    // characters
    chars.forEach(function (ch) { drawChar(ch, S); });

    // sparks: paper-tone dots ringed in ink so the burst reads on paper
    sparks.forEach(function (sp) {
      var age = (simStep - sp.birth) / 120;
      var e = 1 - Math.pow(1 - age / SPARK_LIFE, 2);
      var rng = mulberry32(sp.seed);
      ctx.globalAlpha = Math.max(0, 1 - age / SPARK_LIFE);
      for (var i = 0; i < 14; i++) {
        var ang = rng() * Math.PI * 2, spd = 0.5 + rng() * 0.7;
        var r = (0.008 + 0.048 * e * spd) * S;
        var px = sp.x * viewW + Math.cos(ang) * r;
        var py = sp.y * viewH + Math.sin(ang) * r;
        ctx.fillStyle = PAPER;
        ctx.strokeStyle = INK; ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(px, py, Math.max(1.6, 0.006 * S), 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    });

    // top strip
    ctx.fillStyle = LETTER;
    ctx.textAlign = 'center';
    ctx.font = '600 ' + Math.max(13, 0.034 * S) + 'px ' + HAND;
    ctx.fillText('a data love letter to the subway', viewW / 2, 0.062 * viewH);

    // night service: dim everything, owls keep running on top
    if (night) {
      ctx.fillStyle = LETTER;
      ctx.globalAlpha = 0.45;
      ctx.fillRect(0, 0, viewW, viewH);
      ctx.globalAlpha = 1;
      chars.forEach(function (ch) {
        if (NIGHT_OWLS[ch.line.def.name]) { drawTrail(ch, S, true); drawChar(ch, S); }
      });
      ctx.fillStyle = PAPER;
      ctx.textAlign = 'center';
      ctx.font = '600 ' + Math.max(11, 0.024 * S) + 'px ' + HAND;
      ctx.fillText('night service', viewW / 2, 0.062 * viewH);
    }

    // tap card
    if (cardLine >= 0 && simStep < cardUntil) {
      var txt = cardText(lines[cardLine]);
      ctx.font = '600 ' + Math.max(11, 0.026 * S) + 'px ' + HAND;
      var tw = ctx.measureText(txt).width;
      var cw = Math.min(tw + 0.05 * S, viewW * 0.94);
      var chh = 0.062 * S + 14;
      var cx = (viewW - cw) / 2, cy = viewH - chh - 0.018 * viewH;
      ctx.fillStyle = PAPER;
      ctx.strokeStyle = LETTER; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.rect(cx, cy, cw, chh);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = lines[cardLine].def.color;
      ctx.fillRect(cx, cy, 0.008 * S, chh);
      ctx.fillStyle = LETTER;
      ctx.textAlign = 'center';
      ctx.fillText(txt, viewW / 2, cy + chh / 2 + 0.009 * S, cw - 0.03 * S);
    }
  }

  // ---------- pointer interaction ----------
  // Handlers only RECORD events (stamped with the sim step); the sim
  // consumes them in step order, so rush hour and night service are part
  // of the recorded history, never wall-clock side effects.
  var pDown = null, lastTap = null;
  function evPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0)) - r.left;
    var cy = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0)) - r.top;
    return { x: cx / viewW, y: cy / viewH };
  }
  function nearestLine(x, y) {
    var best = -1, bd = 0.055;
    chars.forEach(function (ch, i) {
      var dx = (ch.x - x) * viewW, dy = (ch.y - y) * viewH;
      var d = Math.hypot(dx, dy) / Math.min(viewW, viewH);
      if (d < bd) { bd = d; best = i; }
    });
    if (best >= 0) return best;
    bd = 0.035;
    lines.forEach(function (ln, i) {
      for (var k = 0; k < ln.pts.length - 1; k++) {
        var a = ln.pts[k], b = ln.pts[k + 1];
        var vx = b.x - a.x, vy = b.y - a.y;
        var t = Math.max(0, Math.min(1, ((x - a.x) * vx + (y - a.y) * vy) / (vx * vx + vy * vy || 1)));
        var dx = (a.x + vx * t - x) * viewW, dy = (a.y + vy * t - y) * viewH;
        var d = Math.hypot(dx, dy) / Math.min(viewW, viewH);
        if (d < bd) { bd = d; best = i; }
      }
    });
    return best;
  }
  function onDown(e) {
    ensureAudio();
    if (audioCtx && audioCtx.resume) { try { audioCtx.resume(); } catch (err) { /* noop */ } }
    var p = evPos(e);
    pDown = { x: p.x, y: p.y, step: simStep, moved: false };
  }
  function onMove(e) {
    if (!pDown) return;
    var p = evPos(e);
    if (Math.hypot(p.x - pDown.x, p.y - pDown.y) > 0.02) {
      if (!pDown.moved) {
        pDown.moved = true;
        pendingEvents.push({ step: simStep, type: 'dragstart' });
        pendingEvents.sort(function (a, b) { return a.step - b.step; });
      }
    }
  }
  function onUp(e) {
    if (!pDown) return;
    var p = evPos(e);
    if (pDown.moved) {
      pendingEvents.push({ step: simStep, type: 'dragend' });
    } else if (simStep - pDown.step < 40) {
      if (lastTap && simStep - lastTap.step < 42 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 0.05) {
        pendingEvents.push({ step: simStep, type: 'doubletap' });
        lastTap = null;
      } else {
        lastTap = { x: p.x, y: p.y, step: simStep };
        pendingEvents.push({ step: simStep, type: 'tap', line: nearestLine(p.x, p.y) });
      }
      pendingEvents.sort(function (a2, b2) { return a2.step - b2.step; });
    }
    pDown = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---------- run ----------
  resize();
  for (var i = 0; i < PREROLL; i++) stepSim(); // frame one = state after exactly 1800 steps
  draw();

  if (typeof requestAnimationFrame === 'function') {
    var lastTs = null, acc = 0, humTick = 0;
    var frame = function (ts) {
      if (lastTs === null) lastTs = ts;
      acc += Math.min(0.25, (ts - lastTs) / 1000);
      lastTs = ts;
      var n = Math.floor(acc / DT);
      if (n > 14) { n = 14; acc = 0; } else { acc -= n * DT; }
      for (var k = 0; k < n; k++) stepSim();
      if (n > 0) {
        draw();
        if (audioCtx && humOsc) {
          humTick++;
          if (humTick % 15 === 0) {
            var fastest = 0;
            chars.forEach(function (ch) { fastest = Math.max(fastest, ch.line.speed * rushMult); });
            try { humOsc.frequency.value = 38 + fastest * 320; } catch (e) { /* noop */ }
          }
        }
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
