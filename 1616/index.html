<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3021</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0E14; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0A0E14';
var STAR = '#A9DCEB';
var FRAME = '#3A4A5A';
var CAPTION = '#6B7C8E';
/* ---- decay model: spin starts 2021-05-01 (HEN, May 2021), reaches rest 3021-03-21 ---- */
var T0 = Date.UTC(2021, 4, 1, 0, 0, 0);
var T1 = Date.UTC(3021, 2, 21, 0, 0, 0);
var SPAN_S = (T1 - T0) / 1000;
var OMEGA0 = TAU / 86400; /* one turn per day at T0: glacial, and it only slows */
var K = 2; /* omega(u) = OMEGA0 * (1-u)^K, so omega hits exactly zero at u = 1 */
var THETA_TOTAL = OMEGA0 * SPAN_S / (K + 1);
var U_PHASE = 0.005; /* fixed reference instant for frame one (determinism) */
var PHASE_ANGLE = THETA_TOTAL * (1 - Math.pow(1 - U_PHASE, K + 1));
var MAX_INJECT = 1.5; /* rad/s, clamp on drag-injected velocity */
var DECAY_TAU = 25; /* seconds: injected energy bleeds away, schedule untouched */
var STORE_KEY = 'doodle-1616';
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function wrapAngle(a) {
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
}
function scheduleAngle(u) {
  u = clamp(u, 0, 1);
  return THETA_TOTAL * (1 - Math.pow(1 - u, K + 1));
}
function angleAtMs(ms) {
  return scheduleAngle((ms - T0) / (T1 - T0));
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
var geom = { cx: 0, cy: 0, R: 0, fx: 0, fy: 0, fw: 0, fh: 0 };
var extraAngle = 0, extraVel = 0, injections = 0;
function loadState() {
  if (typeof localStorage === 'undefined') return;
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    var st = JSON.parse(raw);
    if (typeof st.extraAngle === 'number') extraAngle = st.extraAngle;
    if (typeof st.injections === 'number') injections = st.injections;
    if (typeof st.extraVel === 'number' && typeof st.savedAt === 'number') {
      var dt = Math.max(0, (Date.now() - st.savedAt) / 1000);
      extraVel = st.extraVel * Math.exp(-dt / DECAY_TAU);
      extraAngle += extraVel * DECAY_TAU * (1 - Math.exp(-dt / DECAY_TAU));
    }
  } catch (e) { /* corrupted state: start clean on schedule */ }
}
function saveState() {
  if (typeof localStorage === 'undefined') return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      extraAngle: extraAngle, extraVel: extraVel,
      injections: injections, savedAt: Date.now()
    }));
  } catch (e) { /* storage unavailable: piece still runs on schedule */ }
}
function starVerts(R) {
  var v = [], i;
  for (i = 0; i < 16; i++) {
    var r = (i % 2 === 0) ? R : R * 0.52;
    var a = (i / 16) * TAU - Math.PI / 2;
    v.push([r * Math.cos(a), r * Math.sin(a)]);
  }
  return v;
}
function drawStar(cx, cy, R, angle) {
  var v = starVerts(R), i;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle % TAU);
  ctx.beginPath();
  ctx.moveTo(v[0][0], v[0][1]);
  for (i = 1; i < 16; i++) ctx.lineTo(v[i][0], v[i][1]);
  ctx.closePath();
  ctx.fillStyle = STAR;
  ctx.fill();
  /* faint facet shading: alternating triangles from the centre */
  for (i = 0; i < 16; i++) {
    var j = (i + 1) % 16;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(v[i][0], v[i][1]);
    ctx.lineTo(v[j][0], v[j][1]);
    ctx.closePath();
    ctx.fillStyle = (i % 2 === 0) ? 'rgba(46,90,110,0.16)' : 'rgba(255,255,255,0.05)';
    ctx.fill();
  }
  /* facet spokes */
  ctx.strokeStyle = 'rgba(58,74,90,0.45)';
  ctx.lineWidth = Math.max(1, R * 0.008);
  for (i = 0; i < 16; i += 2) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(v[i][0], v[i][1]);
    ctx.stroke();
  }
  ctx.restore();
}
function fmtAngle(angle) {
  var deg = (((angle % TAU) + TAU) % TAU) / TAU * 360;
  var s = deg.toFixed(2);
  while (s.length < 6) s = '0' + s;
  return s;
}
function drawFrame(angle, inj) {
  size();
  var rect = compRect();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var m = 0.07 * rect.w;
  var fr = { x: rect.x + m, y: rect.y + m, w: rect.w - 2 * m, h: rect.h - 2 * m };
  /* thin luminous frame: soft halo pass, then the crisp line */
  ctx.strokeStyle = 'rgba(58,74,90,0.30)';
  ctx.lineWidth = Math.max(3, 0.012 * fr.w);
  ctx.strokeRect(fr.x, fr.y, fr.w, fr.h);
  ctx.strokeStyle = FRAME;
  ctx.lineWidth = Math.max(1, 0.004 * fr.w);
  ctx.strokeRect(fr.x, fr.y, fr.w, fr.h);
  /* title + formula date, top inside the frame */
  var titlePx = isPhone ? 20 : 22;
  var smallPx = isPhone ? 12 : 13;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = STAR;
  ctx.fillText('3021', fr.x + fr.w / 2, fr.y + 0.045 * fr.h);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = CAPTION;
  ctx.fillText('2006 · 06 · 15', fr.x + fr.w / 2, fr.y + 0.045 * fr.h + titlePx + 6);
  /* star: centred at 55% of frame height, two thirds of the frame width */
  var cx = fr.x + fr.w / 2;
  var cy = fr.y + 0.55 * fr.h;
  var R = fr.w / 3;
  geom = { cx: cx, cy: cy, R: R, fx: fr.x, fy: fr.y, fw: fr.w, fh: fr.h };
  drawStar(cx, cy, R, angle);
  /* caption: live angle + rest date, baseline near the bottom inside the frame */
  var capPx = isPhone ? 12 : 14;
  var lineH = capPx + 7;
  var baseY = fr.y + fr.h - 0.035 * fr.h;
  ctx.font = capPx + 'px monospace';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = CAPTION;
  ctx.fillText('ANGLE ' + fmtAngle(angle) + '° · REST 3021-03-21', fr.x + fr.w / 2, baseY);
  if (inj > 0) {
    ctx.fillText('ENERGY ADDED ×' + inj + ' · REST DATE UNCHANGED', fr.x + fr.w / 2, baseY - lineH);
  }
  /* hint below the frame */
  var hintPx = isPhone ? 11 : 12;
  ctx.font = hintPx + 'px monospace';
  ctx.fillStyle = CAPTION;
  ctx.fillText('Drag to add energy.', rect.x + rect.w / 2, rect.y + rect.h - hintPx - 8);
}
/* ---- drag: flicking the star injects energy; the rest date never moves ---- */
var dragging = false, lastPA = 0, lastMoveT = 0, pVel = 0, dragTotal = 0;
function pointerPos(e) {
  var x = (typeof e.clientX === 'number') ? e.clientX : 0;
  var y = (typeof e.clientY === 'number') ? e.clientY : 0;
  if (canvas.getBoundingClientRect) {
    var r = canvas.getBoundingClientRect();
    x -= r.left; y -= r.top;
  }
  return { x: x, y: y };
}
function pointerAngle(e) {
  var p = pointerPos(e);
  return Math.atan2(p.y - geom.cy, p.x - geom.cx);
}
function onDown(e) {
  var p = pointerPos(e);
  var dx = p.x - geom.cx, dy = p.y - geom.cy;
  if (dx * dx + dy * dy > geom.R * geom.R * 1.32) return;
  dragging = true;
  lastPA = pointerAngle(e);
  lastMoveT = Date.now();
  pVel = 0; dragTotal = 0;
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (!dragging) return;
  var now = Date.now();
  var pa = pointerAngle(e);
  var d = wrapAngle(pa - lastPA);
  var dt = Math.max(0.016, (now - lastMoveT) / 1000);
  var inst = d / dt;
  pVel = 0.7 * pVel + 0.3 * inst;
  extraAngle += d;
  dragTotal += Math.abs(d);
  lastPA = pa; lastMoveT = now;
  if (e.preventDefault) e.preventDefault();
}
function onUp(e) {
  if (!dragging) return;
  dragging = false;
  if (dragTotal > 0.15 && Math.abs(pVel) > 0.05) {
    extraVel = clamp(extraVel + pVel, -MAX_INJECT, MAX_INJECT);
    injections += 1;
    saveState();
  }
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) {
    window.addEventListener('resize', size);
    window.addEventListener('pagehide', saveState);
  }
}
/* ---- frame one: fixed PHASE angle, no stored state, byte-reproducible ---- */
drawFrame(PHASE_ANGLE, 0);
if (!reduced) {
  loadState();
  var lastNow = null;
  function loop() {
    var now = Date.now();
    if (lastNow === null) lastNow = now;
    var dt = Math.min(0.25, (now - lastNow) / 1000);
    lastNow = now;
    if (!dragging) {
      extraVel *= Math.exp(-dt / DECAY_TAU);
      extraAngle += extraVel * dt;
    }
    drawFrame(angleAtMs(now) + extraAngle, injections);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
