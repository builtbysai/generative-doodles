<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A Knight's Walk</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- №1221 "A Knight's Walk" — Clint Enns study block CE6 ----
  // Oulipo constraint as a generative engine: a knight tours an 8x8 board,
  // one move per second, and every square it leaves changes medium —
  // film grain, then pixel blocks, then ASCII. The board fills with three
  // kinds of noise in visit order. Drag the knight to take over; only
  // legal L-moves land.

  var T0 = 31.4;        // fixed phase of the synchronous first frame (move 31, counter 32)
  var TOUR_LEN = 64;    // one tour = 64 moves = 64 seconds, then a fresh tour

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;

  function isPhone(w, h) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return sw < 700 || h > w * 1.15;
  }

  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---- seeded rng + integer hash: all noise derives from these ----
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(a, b) {
    var h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ---- knight geometry: square = y*8 + x ----
  var KM = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];
  function knightMoves(sq) {
    var x = sq % 8, y = (sq / 8) | 0, out = [];
    for (var i = 0; i < 8; i++) {
      var nx = x + KM[i][0], ny = y + KM[i][1];
      if (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) out.push(ny * 8 + nx);
    }
    return out;
  }
  function isKnightMove(a, b) {
    var dx = Math.abs((a % 8) - (b % 8)), dy = Math.abs(((a / 8) | 0) - ((b / 8) | 0));
    return (dx === 1 && dy === 2) || (dx === 2 && dy === 1);
  }

  // ---- the tours ----
  // One CLOSED tour, found at build time by a seeded Warnsdorff search
  // (mulberry32 tie-breaking, start square 0, seed 20 — the first seed in
  // 1..200000 whose 64-step walk ends a knight's move from its start).
  // The other three tours are its rotations; a rotation of a closed tour
  // is a closed tour. All four are verified at load (64 unique squares,
  // every step a legal L-move, last->first legal).
  var BASE_TOUR = [0, 10, 16, 1, 11, 5, 15, 30, 47, 62, 52, 58, 48, 33, 50, 56,
    41, 24, 9, 3, 20, 14, 4, 21, 6, 23, 13, 7, 22, 39, 54, 60,
    45, 55, 38, 28, 18, 8, 2, 12, 27, 37, 31, 46, 63, 53, 43, 26,
    36, 51, 61, 44, 29, 35, 25, 19, 34, 40, 57, 42, 59, 49, 32, 17];
  function rot90(sq) { var x = sq % 8, y = (sq / 8) | 0; return x * 8 + (7 - y); }
  function rot180(sq) { return 63 - sq; }
  function rot270(sq) { var x = sq % 8, y = (sq / 8) | 0; return (7 - x) * 8 + y; }
  function xform(tour, fn) { var out = []; for (var i = 0; i < tour.length; i++) out.push(fn(tour[i])); return out; }
  function verifyTour(tour) {
    if (tour.length !== 64) return false;
    var seen = {};
    for (var i = 0; i < 64; i++) { if (seen[tour[i]]) return false; seen[tour[i]] = 1; }
    for (var j = 1; j < 64; j++) if (!isKnightMove(tour[j - 1], tour[j])) return false;
    return isKnightMove(tour[63], tour[0]);   // closed
  }
  var TOURS = [BASE_TOUR, xform(BASE_TOUR, rot90), xform(BASE_TOUR, rot180), xform(BASE_TOUR, rot270)];
  for (var ti = 0; ti < TOURS.length; ti++) {
    if (!verifyTour(TOURS[ti])) TOURS[ti] = BASE_TOUR;   // cannot happen; verified at build time too
  }

  // ---- Warnsdorff completion, for resuming the tour after a visitor move ----
  // Greedy Warnsdorff over the squares not yet visited this cycle, retried
  // with 24 deterministic tie-break seeds; the longest path wins. Pure
  // function of (start, visited set): the result is cached on the event.
  function warnsdorffCompletion(start, visited, seedBase) {
    var best = [];
    var remaining = 0, s0;
    for (s0 = 0; s0 < 64; s0++) if (!visited[s0] && s0 !== start) remaining++;
    for (var attempt = 0; attempt < 24; attempt++) {
      var rng = mulberry32((Math.imul(seedBase + 1, 2654435761) + attempt * 97 + 13) >>> 0);
      var vis = visited.slice(); vis[start] = true;
      var path = [], cur = start;
      while (true) {
        var cands = knightMoves(cur), ci, pick = -1, bestDeg = Infinity, scored = [];
        for (ci = 0; ci < cands.length; ci++) {
          if (vis[cands[ci]]) continue;
          var nb = knightMoves(cands[ci]), deg = 0;
          for (var ni = 0; ni < nb.length; ni++) if (!vis[nb[ni]]) deg++;
          scored.push([deg, rng(), cands[ci]]);
          if (deg < bestDeg) bestDeg = deg;
        }
        if (!scored.length) break;
        var bt = Infinity;
        for (ci = 0; ci < scored.length; ci++) {
          if (scored[ci][0] === bestDeg && scored[ci][1] < bt) { bt = scored[ci][1]; pick = scored[ci][2]; }
        }
        cur = pick; vis[cur] = true; path.push(cur);
      }
      if (path.length > best.length) best = path;
      if (best.length >= remaining) break;
    }
    return best;
  }

  // ---- recorded visitor moves + ripples: piece state = f(events, t) ----
  var EVENTS = [];    // {te, square} — legal drops, in piece time
  var RIPPLES = [];   // {fx, fy, t0} — illegal drops (fractions of W/H)
  var drag = null;    // {x, y} live pointer while the knight is held

  // ---- the state machine: replayed purely from the tour schedule + events ----
  function stateAt(t) {
    var cycle = Math.floor(t / TOUR_LEN);
    var cycleStart = cycle * TOUR_LEN;
    var path = TOURS[((cycle % 4) + 4) % 4];
    var legStart = cycleStart;
    var visitOrder = [];
    var inOrder = new Array(64);
    var i;
    for (i = 0; i < 64; i++) inOrder[i] = -1;
    function pushUnique(sq) {
      var old = inOrder[sq];
      if (old >= 0) {
        visitOrder.splice(old, 1);
        for (var k = old; k < visitOrder.length; k++) inOrder[visitOrder[k]] = k;
      }
      inOrder[sq] = visitOrder.length;
      visitOrder.push(sq);
    }
    function advanceTo(time) {
      var posIdx = Math.floor(time - legStart);
      if (posIdx > path.length - 1) posIdx = path.length - 1;
      if (posIdx < 0) posIdx = 0;
      for (var k = 0; k <= posIdx; k++) pushUnique(path[k]);
      return posIdx;
    }
    var posIdx = advanceTo(Math.min(t, cycleStart + TOUR_LEN - 0.000001));
    for (i = 0; i < EVENTS.length; i++) {
      var ev = EVENTS[i];
      if (ev.te < cycleStart || ev.te > t) continue;
      posIdx = advanceTo(ev.te);
      var cur = path[posIdx];
      if (!isKnightMove(cur, ev.square)) continue;   // stale event; ignore
      pushUnique(ev.square);
      if (!ev._path) {
        var visBool = new Array(64);
        for (var q = 0; q < 64; q++) visBool[q] = inOrder[q] >= 0;
        var visitedCount = visitOrder.length;
        ev._path = [ev.square].concat(warnsdorffCompletion(ev.square, visBool, ev.square * 1000 + visitedCount));
      }
      path = ev._path;
      legStart = ev.te;
    }
    posIdx = advanceTo(t);
    return {
      visitOrder: visitOrder, inOrder: inOrder,
      current: path[posIdx], posIdx: posIdx, path: path, legStart: legStart
    };
  }

  // ---- time: anchored phase + elapsed since load ----
  function nowMs() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return Date.now();
  }
  var startWall = nowMs();
  function tNow() { return T0 + (nowMs() - startWall) / 1000; }

  // ---- board geometry ----
  function boardGeom() {
    var side = Math.min(W, H) * (isPhone(W, H) ? 0.94 : 0.92);
    return { side: side, x0: (W - side) / 2, y0: (H - side) / 2, cell: side / 8 };
  }
  function sqCenter(sq, g) {
    return [g.x0 + ((sq % 8) + 0.5) * g.cell, g.y0 + (((sq / 8) | 0) + 0.5) * g.cell];
  }
  function squareAt(px, py, g) {
    var cx = Math.floor((px - g.x0) / g.cell), cy = Math.floor((py - g.y0) / g.cell);
    if (cx < 0 || cx > 7 || cy < 0 || cy > 7) return -1;
    return cy * 8 + cx;
  }

  // ---- pointer: drag the knight ----
  function pointerPos(e) {
    var x = (e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0));
    var y = (e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0));
    return [x, y];
  }
  function onDown(e) {
    var p = pointerPos(e);
    var t = tNow();
    var st = stateAt(t);
    var g = boardGeom();
    var c = sqCenter(st.current, g);
    var d = Math.max(Math.abs(p[0] - c[0]), Math.abs(p[1] - c[1]));
    if (d < g.cell * 0.95) drag = { x: p[0], y: p[1] };
  }
  function onMove(e) {
    if (!drag) return;
    var p = pointerPos(e);
    drag.x = p[0]; drag.y = p[1];
  }
  function onUp() {
    if (!drag) return;
    var t = tNow();
    var st = stateAt(t);
    var g = boardGeom();
    var drop = squareAt(drag.x, drag.y, g);
    if (drop >= 0 && isKnightMove(st.current, drop)) {
      EVENTS.push({ te: t, square: drop });
    } else {
      RIPPLES.push({ fx: W ? drag.x / W : 0, fy: H ? drag.y / H : 0, t0: t });
    }
    drag = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    canvas.addEventListener('touchmove', onMove, { passive: true });
    canvas.addEventListener('touchend', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  // ---- the knight glyph: a pale horse-head silhouette, facing left ----
  var KNIGHT = [
    [0.46, 0.04], [0.54, 0.13], [0.63, 0.20], [0.72, 0.34], [0.78, 0.52],
    [0.80, 0.72], [0.82, 0.86], [0.84, 0.95], [0.18, 0.95], [0.18, 0.86],
    [0.28, 0.80], [0.29, 0.66], [0.20, 0.56], [0.11, 0.47], [0.14, 0.35],
    [0.24, 0.29], [0.31, 0.17], [0.38, 0.08]
  ];
  function drawKnight(cx, cy, cell, lift, scale) {
    var s = cell * 0.9 * scale;
    var ox = cx - s / 2, oy = cy - s / 2 - lift;
    ctx.fillStyle = '#F0F0F0';
    ctx.beginPath();
    for (var i = 0; i < KNIGHT.length; i++) {
      var px = ox + KNIGHT[i][0] * s, py = oy + KNIGHT[i][1] * s;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#0A0A0A';
    ctx.beginPath();
    ctx.arc(ox + 0.335 * s, oy + 0.30 * s, Math.max(1.2, s * 0.035), 0, Math.PI * 2);
    ctx.fill();
  }

  var ASCII = '@#%*+';

  function drawMedium(sq, age, x, y, cell, t) {
    if (age < 10) {
      // film grain: speckle pattern re-hashed 8x per second — it flickers
      var flick = Math.floor(t * 8);
      var n = 30, sr = Math.max(1.6, cell * 0.028);
      for (var i = 0; i < n; i++) {
        if (hash2(sq * 131 + flick * 7, i) > 0.60) continue;
        var sx = x + hash2(sq * 57 + i, flick) * (cell - sr);
        var sy = y + hash2(i * 91 + flick, sq * 13) * (cell - sr);
        ctx.fillStyle = 'rgba(138,138,138,' + (0.25 + 0.6 * hash2(sq + i, flick * 3)).toFixed(3) + ')';
        ctx.fillRect(sx, sy, sr, sr);
      }
    } else if (age < 24) {
      // pixel blocks: the square subdivides into a 4x4 block-noise grid
      var b = cell / 4;
      for (var by = 0; by < 4; by++) {
        for (var bx = 0; bx < 4; bx++) {
          var v = hash2(sq * 31, by * 4 + bx);
          if (v < 0.16) ctx.fillStyle = '#0F380F';
          else ctx.fillStyle = 'rgba(48,98,48,' + (0.35 + 0.6 * v).toFixed(3) + ')';
          ctx.fillRect(x + bx * b + 0.5, y + by * b + 0.5, b - 1, b - 1);
      }
      }
    } else {
      // ASCII: one stable glyph per square
      var ch = ASCII[Math.floor(hash2(sq, 777) * 5) % 5];
      ctx.fillStyle = 'rgba(155,188,15,0.92)';
      ctx.font = 'bold ' + Math.round(cell * 0.58) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ch, x + cell / 2, y + cell / 2 + cell * 0.02);
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    var g = boardGeom();
    var st = stateAt(t);
    var len = st.visitOrder.length;

    // -- board squares: near-black only, no white square is ever shown --
    for (var y = 0; y < 8; y++) {
      for (var x = 0; x < 8; x++) {
        ctx.fillStyle = ((x + y) % 2 === 0) ? '#0A0A0A' : '#1A1A1A';
        ctx.fillRect(g.x0 + x * g.cell, g.y0 + y * g.cell, g.cell, g.cell);
      }
    }

    // -- medium conversion: age = moves since the knight left the square --
    for (var vi = 0; vi < len; vi++) {
      var sq = st.visitOrder[vi];
      var age = (len - 1) - vi;
      drawMedium(sq, age, g.x0 + (sq % 8) * g.cell, g.y0 + ((sq / 8) | 0) * g.cell, g.cell, t);
    }

    // -- the trail: flat neon fills on the last five squares left --
    for (var r = 1; r <= 5 && r < len; r++) {
      var tsq = st.visitOrder[len - 1 - r];
      var tx = g.x0 + (tsq % 8) * g.cell, ty = g.y0 + ((tsq / 8) | 0) * g.cell;
      ctx.fillStyle = 'rgba(15,56,15,0.55)';
      ctx.fillRect(tx, ty, g.cell, g.cell);
      ctx.fillStyle = 'rgba(57,255,106,' + (0.46 - (r - 1) * 0.085).toFixed(3) + ')';
      ctx.fillRect(tx, ty, g.cell, g.cell);
    }

    // -- board edge --
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth = 1;
    ctx.strokeRect(g.x0 - 0.5, g.y0 - 0.5, g.side + 1, g.side + 1);

    // -- legal targets pulse while the knight is held --
    if (drag) {
      var targets = knightMoves(st.current);
      var pulse = 0.10 + 0.07 * (0.5 + 0.5 * Math.sin(t * 6));
      for (var tg = 0; tg < targets.length; tg++) {
        var ts = targets[tg];
        ctx.fillStyle = 'rgba(240,240,240,' + pulse.toFixed(3) + ')';
        ctx.fillRect(g.x0 + (ts % 8) * g.cell, g.y0 + ((ts / 8) | 0) * g.cell, g.cell, g.cell);
      }
    }

    // -- illegal-drop ripples --
    for (var rp = RIPPLES.length - 1; rp >= 0; rp--) {
      var rip = RIPPLES[rp], rage = t - rip.t0;
      if (rage > 0.5) { RIPPLES.splice(rp, 1); continue; }
      if (rage < 0) continue;
      ctx.strokeStyle = 'rgba(200,30,30,' + (1 - rage / 0.5).toFixed(3) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(rip.fx * W, rip.fy * H, (rage / 0.5) * g.cell * 1.1 + 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    // -- the knight: hop arc in the first 0.18s of each beat, or the hand --
    if (drag) {
      drawKnight(drag.x, drag.y, g.cell, g.cell * 0.10, 1.05);
    } else {
      var c = sqCenter(st.current, g);
      var frac = t - st.legStart - st.posIdx;
      var kx = c[0], ky = c[1], lift = 0, scale = 1;
      if (st.posIdx >= 1 && frac < 0.18) {
        var pc = sqCenter(st.path[st.posIdx - 1], g);
        var hp = frac / 0.18, arc = Math.sin(hp * Math.PI);
        kx = pc[0] + (c[0] - pc[0]) * hp;
        ky = pc[1] + (c[1] - pc[1]) * hp;
        lift = arc * g.cell * 0.30;
        scale = 1 + 0.05 * arc;
      }
      drawKnight(kx, ky, g.cell, lift, scale);
    }

    // -- move counter, top-left, small monospace gray --
    var fs = Math.round(clamp(W * 0.016, 12, 16));
    ctx.font = fs + 'px monospace';
    ctx.fillStyle = '#8A8A8A';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(String(len), 16, 16 + fs);
  }

  function drawCurrent() { draw(tNow()); }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); drawCurrent(); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); drawCurrent(); });
  }

  resize();
  draw(T0);   // synchronous fixed-phase first frame

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(tNow());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
