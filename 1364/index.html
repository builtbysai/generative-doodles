<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Declaration</title>
<style>
  html, body { margin: 0; padding: 0; background: #1A1A1A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded PRNG (mulberry32), never Math.random for frame content ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, isPhone = false;

  function isPhoneSize(w, h) {
    var sw = 0, sh = 0;
    try {
      if (typeof window !== 'undefined' && window.screen) {
        sw = window.screen.width || 0; sh = window.screen.height || 0;
      }
    } catch (e) { /* ignore */ }
    if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
    return h > w * 1.15;
  }

  function resize() {
    var w = 0, h = 0;
    try {
      if (typeof window !== 'undefined' && window.visualViewport) {
        w = window.visualViewport.width || 0; h = window.visualViewport.height || 0;
      }
    } catch (e) { /* ignore */ }
    if (!w || !h) {
      try { w = window.innerWidth; h = window.innerHeight; } catch (e2) { /* ignore */ }
    }
    if (!w || !h) { w = 1280; h = 900; }
    W = w; H = h;
    isPhone = isPhoneSize(w, h);
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    layout();
  }

  // ---------- whistles: exactly 70, loose parade formation (10 x 7) ----------
  var COLS = 10, ROWS = 7, COUNT = 70;
  var whistles = [];
  var subtitleMarks = [];

  function layout() {
    var rnd = mulberry32(1364000);
    whistles = [];
    // Formation rect: generous margins on desktop, full-bleed on phones.
    var mx = isPhone ? W * 0.04 : W * 0.10;
    var my = isPhone ? H * 0.08 : H * 0.13;
    var fw = W - mx * 2, fh = H - my * 2 - H * 0.08;
    var i = 0;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        // Loose parade: slight arc offset per row + seeded jitter.
        var arc = Math.sin((c / (COLS - 1)) * Math.PI) * -H * 0.012;
        var bx = mx + (c + 0.5) * (fw / COLS);
        var by = my + (r + 0.5) * (fh / ROWS) + arc;
        var jx = (rnd() - 0.5) * Math.min(18, fw / COLS * 0.45);
        var jy = (rnd() - 0.5) * Math.min(14, fh / ROWS * 0.45);
        // Facing: mostly upward, seeded variation.
        var ang = -Math.PI / 2 + (rnd() - 0.5) * 0.9;
        // Scale: slightly larger toward the front rows (lower rows read nearer).
        var sc = 0.85 + (r / (ROWS - 1)) * 0.35;
        whistles.push({
          x: bx + jx, y: by + jy,
          bx: bx, by: by,
          jx: jx, jy: jy,
          ang: ang,
          sc: sc,
          maxLen: 26 + rnd() * 16,
          seed: rnd(),
          red: rnd() < 0.12,
          phase: rnd() * Math.PI * 2
        });
        i++;
      }
    }
    // Subtitle: one row of invented pseudo-script marks (never readable words).
    subtitleMarks = [];
    var n = 18, sw = Math.min(W * 0.6, 520);
    var sx = (W - sw) / 2;
    for (var k = 0; k < n; k++) {
      subtitleMarks.push({
        x: sx + (k + 0.5) * (sw / n),
        len: 6 + rnd() * 14,
        kind: Math.floor(rnd() * 4), // 0 dash, 1 dot pair, 2 chevron, 3 arc
        a: rnd() * Math.PI * 2
      });
    }
  }

  // ---------- shared breath clock (8 s): exhale, hold, retract, rest/regroup ----------
  var BREATH_T = 8, PHASE0 = 1.5; // frame one sits mid-exhale, streaks visible
  function smooth01(u) {
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    return u * u * (3 - 2 * u);
  }
  function breathAt(t) {
    var p = (t + PHASE0) % BREATH_T;
    if (p < 3) return smooth01(p / 3);
    if (p < 4) return 1;
    if (p < 6) return 1 - smooth01((p - 4) / 2);
    return 0;
  }
  // Regroup: formation tightens mid-rest, then relaxes (smooth, closed-form).
  function jitterScaleAt(t) {
    var p = (t + PHASE0) % BREATH_T;
    if (p < 6 || p >= 8) return 1;
    var u = (p - 6) / 2;
    return 1 - 0.6 * Math.sin(Math.PI * u);
  }

  // ---------- drag state: recorded samples, closed-form decay ----------
  var drags = []; // {x, y, t}
  var dragging = false;
  var pieceNow = 0;

  function pruneDrags(t) {
    var out = [];
    for (var i = 0; i < drags.length; i++) {
      if (t - drags[i].t < 8) out.push(drags[i]);
    }
    drags = out;
  }
  // Global crowd volume from recent drag density (decays after release).
  function globalBoost(t) {
    var s = 0;
    for (var i = 0; i < drags.length; i++) {
      s += Math.exp(-(t - drags[i].t) / 1.5);
    }
    return Math.min(1, s / 8);
  }
  // Local boost near the pointer path for one whistle position.
  function localBoost(t, x, y) {
    var s = 0;
    for (var i = 0; i < drags.length; i++) {
      var dt = t - drags[i].t;
      if (dt < 0) continue;
      var dx = drags[i].x - x, dy = drags[i].y - y;
      var d2 = dx * dx + dy * dy;
      s += Math.exp(-d2 / (2 * 110 * 110)) * Math.exp(-dt / 1.5);
    }
    return Math.min(1, s);
  }

  // ---------- gesture-gated audio: filtered noise swells ONLY while dragging ----------
  var AC = null, noiseGain = null, audioReady = false;
  function ensureAudio() {
    if (audioReady) return true;
    var Ctor = null;
    try {
      if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
      else if (typeof webkitAudioContext !== 'undefined') Ctor = webkitAudioContext;
    } catch (e) { /* ignore */ }
    if (!Ctor) return false;
    try {
      AC = new Ctor();
      var len = AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      var rnd = mulberry32(1364000);
      for (var i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
      var src = AC.createBufferSource();
      src.buffer = buf; src.loop = true;
      var filt = AC.createBiquadFilter();
      filt.type = 'bandpass'; filt.frequency.value = 2200; filt.Q.value = 0.8;
      noiseGain = AC.createGain(); noiseGain.gain.value = 0;
      src.connect(filt); filt.connect(noiseGain); noiseGain.connect(AC.destination);
      src.start();
      audioReady = true;
      return true;
    } catch (e) { return false; }
  }
  function audioSetDragging(on, level) {
    if (!on) {
      if (AC && noiseGain) {
        try { noiseGain.gain.setTargetAtTime(0, AC.currentTime, 0.15); } catch (e) { /* ignore */ }
      }
      return;
    }
    if (!ensureAudio()) return;
    try {
      if (AC.state === 'suspended') AC.resume();
      noiseGain.gain.setTargetAtTime(0.10 * level, AC.currentTime, 0.1);
    } catch (e) { /* ignore */ }
  }

  function onDown(ev) {
    dragging = true;
    drags.push({ x: ev.clientX, y: ev.clientY, t: pieceNow });
    audioSetDragging(true, 0.4);
  }
  function onMove(ev) {
    if (!dragging) return;
    drags.push({ x: ev.clientX, y: ev.clientY, t: pieceNow });
    pruneDrags(pieceNow);
    var b = 0.35 + 0.65 * globalBoost(pieceNow);
    audioSetDragging(true, b);
  }
  function onUp() {
    dragging = false;
    audioSetDragging(false, 0);
  }
  try {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  } catch (e) { /* ignore */ }

  // ---------- drawing ----------
  function drawWhistle(w, js) {
    var x = w.bx + w.jx * js;
    var y = w.by + w.jy * js;
    var s = w.sc * Math.min(W, H) / 900;
    if (s < 0.5) s = 0.5;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(w.ang); // shape's +x axis (mouthpiece left, bowl right) points along facing
    ctx.fillStyle = w.red ? '#B3282D' : '#E8C51A';
    // Body
    ctx.fillRect(-8 * s, -5 * s, 16 * s, 10 * s);
    // Mouthpiece (left)
    ctx.fillRect(-14 * s, -2.5 * s, 6 * s, 5 * s);
    // Bowl (right): single arc with its own path, moveTo first (node-canvas quirk).
    ctx.beginPath();
    ctx.moveTo(8 * s + 5 * s, 0);
    ctx.arc(8 * s, 0, 5 * s, 0, Math.PI * 2);
    ctx.fill();
    // Pea hole
    ctx.fillStyle = '#1A1A1A';
    ctx.beginPath();
    ctx.moveTo(8 * s + 2 * s, 0);
    ctx.arc(8 * s, 0, 2 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return { x: x, y: y, ang: w.ang, s: s };
  }

  function drawStreak(wx, wy, ang, len, alpha) {
    if (len <= 0.5 || alpha <= 0.01) return;
    // Drawn in a rotated frame so all streak geometry follows the facing angle.
    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(ang);
    // Tapered main streak (flat triangle) + two thin side lines.
    ctx.fillStyle = 'rgba(242,242,242,' + alpha.toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(4, 0);
    ctx.lineTo(len, -2.5);
    ctx.lineTo(len, 2.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(242,242,242,' + (alpha * 0.55).toFixed(3) + ')';
    ctx.fillRect(6, -4, len * 0.8, 1);
    ctx.fillRect(6, 3, len * 0.65, 1);
    ctx.restore();
  }

  function drawSubtitle() {
    var y = H - Math.max(18, H * 0.03);
    ctx.fillStyle = 'rgba(242,242,242,0.35)';
    for (var i = 0; i < subtitleMarks.length; i++) {
      var m = subtitleMarks[i];
      if (m.kind === 0) {
        ctx.fillRect(m.x - m.len / 2, y, m.len, 2);
      } else if (m.kind === 1) {
        ctx.fillRect(m.x - 4, y, 2, 2);
        ctx.fillRect(m.x + 2, y, 2, 2);
      } else if (m.kind === 2) {
        ctx.beginPath();
        ctx.moveTo(m.x - m.len / 2, y + 4);
        ctx.lineTo(m.x, y - 2);
        ctx.lineTo(m.x + m.len / 2, y + 4);
        ctx.strokeStyle = 'rgba(242,242,242,0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(m.x - m.len / 2 + 3, y + 2);
        ctx.arc(m.x, y + 2, 3, Math.PI, 0);
        ctx.strokeStyle = 'rgba(242,242,242,0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  function draw(t) {
    pieceNow = t;
    if (!W || !H) resize();
    ctx.fillStyle = '#1A1A1A';
    ctx.fillRect(0, 0, W, H);
    pruneDrags(t);
    var breath = breathAt(t);
    var js = jitterScaleAt(t);
    var gb = globalBoost(t);
    for (var i = 0; i < whistles.length; i++) {
      var w = whistles[i];
      var pos = drawWhistle(w, js);
      // Streak origin: just past the mouthpiece along the facing direction.
      var mx = Math.cos(w.ang), my = Math.sin(w.ang);
      var lb = Math.min(1, gb * 0.5 + localBoost(t, pos.x, pos.y));
      var len = w.maxLen * breath * (1 + 0.9 * lb);
      var alpha = 0.08 + 0.38 * breath * (0.6 + 0.4 * lb);
      // Streak starts at the whistle mouth (front of the bowl side).
      drawStreak(pos.x + mx * 12 * pos.s, pos.y + my * 12 * pos.s, w.ang, len, alpha);
    }
    drawSubtitle();
  }

  // ---------- boot: frame one is draw(0); the clock starts with the rAF loop ----------
  function loop(ts) {
    draw(ts / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }

  try {
    if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
  } catch (e) { /* ignore */ }
  try {
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('resize', resize);
    }
  } catch (e) { /* ignore */ }

  resize();
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
