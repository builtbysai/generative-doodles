<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Goodman Strauss Sevens</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101114; }
  canvas { display:block; touch-action:none; }
  .hint { position:fixed; left:0; right:0; bottom:14px; text-align:center;
    font:12px/1.4 monospace; color:#7c7f88; letter-spacing:0.08em; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">drag to subdivide the field</div>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  fitView();
  dirty = true;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// --- 7-fold rhomb patch: canonical zonogon tiling from 7 generators ---
var V = [];
for (var k = 0; k < 7; k++) V.push([Math.cos(Math.PI / 14 + k * Math.PI / 7), Math.sin(Math.PI / 14 + k * Math.PI / 7)]);
function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
function baseRhombs() {
  var out = [];
  for (var i = 0; i < 7; i++) for (var j = i + 1; j < 7; j++) {
    var o = [0, 0];
    for (var m = i + 1; m < j; m++) o = add(o, V[m]);
    out.push([o, add(o, V[i]), add(add(o, V[i]), V[j]), add(o, V[j])]);
  }
  return out;
}
function subdivide(list) {
  var out = [];
  for (var n = 0; n < list.length; n++) {
    var r = list[n], c0 = r[0], c1 = r[1], c2 = r[2], c3 = r[3];
    function mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
    var m01 = mid(c0, c1), m12 = mid(c1, c2), m23 = mid(c2, c3), m03 = mid(c0, c3), cc = mid(c0, c2);
    out.push([c0, m01, cc, m03], [m01, c1, m12, cc], [cc, m12, c2, m23], [m03, cc, m23, c3]);
  }
  return out;
}
var GENS = [];
(function build() {
  var g = subdivide(subdivide(baseRhombs())); // display level 0: 336 rhombs
  for (var i = 0; i < 4; i++) { GENS.push(g); g = subdivide(g); }
})();
var BOUNDS = (function () {
  var mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9;
  var raw = baseRhombs();
  for (var i = 0; i < raw.length; i++) for (var j = 0; j < 4; j++) {
    mnx = Math.min(mnx, raw[i][j][0]); mxx = Math.max(mxx, raw[i][j][0]);
    mny = Math.min(mny, raw[i][j][1]); mxy = Math.max(mxy, raw[i][j][1]);
  }
  return { x: mnx, y: mny, w: mxx - mnx, h: mxy - mny };
})();

var view = { s: 1, ox: 0, oy: 0 };
var state = { level: 0, levelFloat: 0, seed: 3, anim: 1 };
var dirty = true;
function zoomFor(level) { return 1 + level * 0.10; }
function fitView() {
  var s = Math.max(W / BOUNDS.w, H / BOUNDS.h) * 1.22 * zoomFor(state.level);
  view.s = s;
  view.ox = W / 2 - (BOUNDS.x + BOUNDS.w / 2) * s;
  view.oy = H / 2 - (BOUNDS.y + BOUNDS.h / 2) * s;
}
function hash(n) {
  var x = Math.sin(n * 127.1 + state.seed * 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function draw() {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#101114'; ctx.fillRect(0, 0, W, H);
  var list = GENS[state.level];
  var grow = 1 + (1 - state.anim) * 0.05;
  ctx.lineWidth = state.level >= 2 ? 0.5 : 1;
  ctx.strokeStyle = '#2A2D33';
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    ctx.fillStyle = hash(i) < 1 / 7 ? '#7C6BA0' : '#B9BEC6';
    ctx.beginPath();
    for (var j = 0; j < 4; j++) {
      var px = view.ox + r[j][0] * view.s * grow - (grow - 1) * W / 2;
      var py = view.oy + r[j][1] * view.s * grow - (grow - 1) * H / 2;
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
var drag = null, lastTap = { t: 0, x: 0, y: 0 };
canvas.addEventListener('pointerdown', function (e) {
  var now = Date.now();
  if (now - lastTap.t < 320 && Math.abs(e.clientX - lastTap.x) < 44 && Math.abs(e.clientY - lastTap.y) < 44) {
    state.seed++;
    dirty = true;
    lastTap.t = 0;
    drag = null;
    return;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
  drag = { y0: e.clientY, x0: e.clientX, f0: state.levelFloat, level0: state.level };
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  state.levelFloat = Math.max(0, Math.min(3, drag.f0 + (e.clientY - drag.y0) / 150));
  var nl = Math.round(state.levelFloat);
  if (nl !== state.level) {
    var ratio = zoomFor(nl) / zoomFor(state.level);
    view.ox = drag.x0 - (drag.x0 - view.ox) * ratio;
    view.oy = drag.y0 - (drag.y0 - view.oy) * ratio;
    view.s *= ratio;
    state.level = nl;
    state.anim = 0;
    dirty = true;
  }
});
function endDrag() {
  if (drag) { state.levelFloat = state.level; drag = null; }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

resize();
draw();
var lastFrame = Date.now();
function frame() {
  if (state.anim < 1) { state.anim = Math.min(1, state.anim + 0.08); dirty = true; }
  if (dirty) { draw(); dirty = false; }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
