<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9074 · Hatch</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#ece3cc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(74,62,42,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(236,227,204,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another hatch</div>
<script>
'use strict';
// No9074 Hatch.
// An engraver's sphere, drawn the plotter way: one family of parallel
// lines, and the only thing that changes along each line is its weight.
// Every line is cut into short segments; a segment is drawn heavy where
// the surface it pretends to shade turns toward a seeded light, and
// hairline or skipped where it turns away. There is no outline and no
// disc fill; the ball exists only because the hatching swells and
// thins. The light is placed by the seed but gated inside the disc, and
// off-center: a centered light makes a bullseye, not a sphere.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9074', 10) || 9074;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#ece3cc';
const INK = '#26221b';

function compose(s) {
  const rnd = mulberry32(s);
  // Light position in disc units (disc radius = 1): gated off-center.
  const la = rnd() * Math.PI * 2;
  const lr = 0.30 + rnd() * 0.35;
  const lx = Math.cos(la) * lr, ly = Math.sin(la) * lr;
  const tilt = (rnd() - 0.5) * 0.9;               // hatch direction, radians
  return { lx, ly, tilt, ok: lr >= 0.30 };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition: the disc keeps its shape on every screen and
  // the page ground is the piece's ground, so it reads as a print.
  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.40;

  const rows = 46;
  const ct = Math.cos(p.tilt), st = Math.sin(p.tilt);
  ctx.strokeStyle = INK;
  ctx.lineCap = 'round';
  for (let j = 0; j < rows; j++) {
    const t = -1 + (j + 0.5) * (2 / rows);        // across the disc, in its frame
    const half = Math.sqrt(Math.max(0, 1 - t * t));
    const SEGS = 44;
    for (let i = 0; i < SEGS; i++) {
      const u0 = -half + (i / SEGS) * 2 * half;
      const u1 = -half + ((i + 1) / SEGS) * 2 * half;
      const um = (u0 + u1) / 2;
      // Surface normal shading: pretend a sphere, z = sqrt(1-u^2-t^2),
      // light at (lx, ly); brightness from the 2D falloff to the light.
      const d = Math.hypot(um - p.lx, t - p.ly);
      const shade = Math.max(0, 1 - d / 1.9);     // 0 away, up to 1 at light
      const rowEnv = 0.45 + 0.55 * Math.sqrt(Math.max(0, 1 - t * t));
      const width = (0.3 + Math.pow(shade, 1.6) * 3.4) * rowEnv;
      if (shade < 0.06 && (i + j) % 2 === 0) continue; // skip deep shade speckle
      // Segment endpoints in disc frame, rotated by tilt, to pixels.
      const x0 = cx + (u0 * ct - t * st) * R, y0 = cy + (u0 * st + t * ct) * R;
      const x1 = cx + (u1 * ct - t * st) * R, y1 = cy + (u1 * st + t * ct) * R;
      ctx.lineWidth = Math.max(0.5, width * (R / 300));
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
