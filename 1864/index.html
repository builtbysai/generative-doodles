<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizontal Guitar</title>
<style>
html, body { margin: 0; padding: 0; background: #14100C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: the posture shift. A guitar turned into a table, played from
   above, so the neck becomes a horizon line and the body a sound table.
   The felt phenomenon is quiet hands arriving from the dark to touch
   strings that answer. The mechanism is the strings: each gesture type
   (pluck, mallet strike, EBow swell, fretted touch) drives a visible
   string response, and the hands choreograph approach, contact, dwell,
   release, withdraw. Watch only. */
var TAU = Math.PI * 2;
var ROOM = '#14100C';
var ROOM_LO = '#0E0B08';
var AMBER = '#E8A94C';
var AMBER_HI = '#F2C06A';
var AMBER_DIM = '#8A6428';
var WOOD = '#6B3F22';
var WOOD_HI = '#8A5A2E';
var WOOD_LO = '#4A2C16';
var WOOD_LINE = '#3A2110';
var STRING = '#C9C9C2';
var STRING_DIM = '#8F8F88';
var SKIN = '#C98E6A';
var SKIN_LO = '#A66E4A';
var SKIN_LINE = '#7A4E32';
var PLATE = '#F3E9D2';
var PLATE_LINE = 'rgba(30,26,22,0.35)';
var TITLE_INK = '#1E1A16';
var HINT_INK = '#5C4630';
var FRAME_T = 37.0;        /* fixed phase: EBow dwelling on string 3, mallet just withdrawn */
var LOOP_LEN = 48.0;       /* seconds per loop */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function ease(f) { return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* seeded wood grain and dust, fixed for every frame */
var GRAIN = (function () {
  var rng = mulberry32(1864), out = [], i;
  for (i = 0; i < 26; i++) {
    out.push({ x: rng(), y: rng(), a: (rng() - 0.5) * 0.5, l: 0.05 + rng() * 0.16, w: 0.6 + rng() * 1.4 });
  }
  return out;
})();
var DUST = (function () {
  var rng = mulberry32(1865), out = [], i;
  for (i = 0; i < 40; i++) {
    out.push({ x: rng(), y: rng(), r: 0.5 + rng() * 1.6, a: 0.04 + rng() * 0.10 });
  }
  return out;
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function seg(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
  if (fill) ctx.fill(); else ctx.stroke();
}
function ellipse(x, y, rx, ry, rot, fill) {
  ctx.beginPath(); ctx.moveTo(x + rx, y);
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  if (fill) ctx.fill(); else ctx.stroke();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
/* ---- gesture choreography: approach, contact, dwell, release, withdraw ---- */
/* type: pluck, mallet, ebow, fret. str: 0..5 top to bottom. x: fraction
   along the string span where the gesture lands. */
var EVENTS = [
  { t0: 0,  dur: 6, type: 'pluck',  str: 0, x: 0.55 },
  { t0: 4,  dur: 6, type: 'mallet', str: 2, x: 0.62 },
  { t0: 9,  dur: 6, type: 'fret',   str: 1, x: 0.40 },
  { t0: 14, dur: 6, type: 'ebow',   str: 4, x: 0.70 },
  { t0: 19, dur: 6, type: 'mallet', str: 3, x: 0.50 },
  { t0: 24, dur: 6, type: 'pluck',  str: 5, x: 0.58 },
  { t0: 29, dur: 6, type: 'mallet', str: 1, x: 0.66 },
  { t0: 34, dur: 6, type: 'ebow',   str: 2, x: 0.45 },
  { t0: 39, dur: 6, type: 'pluck',  str: 3, x: 0.60 },
  { t0: 42, dur: 6, type: 'mallet', str: 0, x: 0.52 }
];
/* local progress of an event at time t, -1 when the event is not running */
function evLocal(ev, t) {
  var p = (t - ev.t0) / ev.dur;
  if (p < 0 || p > 1) return -1;
  return p;
}
/* hand height factor: 0 above the frame, 1 at the string */
function handHeight(p) {
  if (p < 0.25) return ease(p / 0.25) * 0.92;
  if (p < 0.35) return 0.92 + ease((p - 0.25) / 0.10) * 0.08;
  if (p < 0.65) return 1.0;
  if (p < 0.80) return 1.0 - ease((p - 0.65) / 0.15) * 0.12;
  return 0.88 * (1 - ease((p - 0.80) / 0.20));
}
/* ---- the instrument geometry, in field coordinates ---- */
function geom(sc) {
  var fw = sc.w, fh = sc.h;
  var bodyCx = sc.x + fw * 0.40;
  var bodyCy = sc.y + fh * 0.60;
  var bodyW = fw * 0.56;
  var bodyH = fh * 0.52;
  var neckY = bodyCy - bodyH * 0.10;      /* the neck is the horizon line */
  var neckTop = neckY - fh * 0.088;        /* fretboard spans the whole string spread */
  var neckBot = neckY + fh * 0.088;
  var nutX = bodyCx + bodyW * 0.38;
  var bridgeX = bodyCx - bodyW * 0.22;
  var holeX = bodyCx - bodyW * 0.02;
  var holeY = bodyCy - bodyH * 0.06;
  var strTop = neckY - fh * 0.075;
  var strBot = neckY + fh * 0.075;
  return {
    bodyCx: bodyCx, bodyCy: bodyCy, bodyW: bodyW, bodyH: bodyH,
    neckY: neckY, neckTop: neckTop, neckBot: neckBot, nutX: nutX,
    bridgeX: bridgeX, holeX: holeX, holeY: holeY,
    strTop: strTop, strBot: strBot,
    strX0: bridgeX, strX1: sc.x + fw + fw * 0.05
  };
}
function stringY(g, s) {
  return g.strTop + (g.strBot - g.strTop) * s / 5;
}
/* string displacement at fraction u along the span, from one event */
function evStringAmp(ev, t, u) {
  var hit = ev.t0 + ev.dur * 0.30;   /* contact happens at local p = 0.30 */
  if (ev.type === 'ebow') {
    var p = evLocal(ev, t);
    if (p < 0) return 0;
    var swell = 0;
    if (p >= 0.25 && p < 0.80) swell = ease(clamp((p - 0.25) / 0.30, 0, 1));
    else if (p >= 0.80) swell = 1 - ease((p - 0.80) / 0.20);
    if (swell <= 0) return 0;
    var env = Math.sin(Math.PI * clamp(u, 0, 1));
    return swell * 7.0 * Math.sin(TAU * 1.6 * (t - ev.t0)) * env;
  }
  if (t < hit) return 0;
  var dt = t - hit;
  if (dt > 4) return 0;
  var a0 = ev.type === 'mallet' ? 8.0 : 6.0;
  var f = ev.type === 'mallet' ? 7.0 : 5.0;
  if (ev.type === 'fret') { a0 = 5.0; f = 6.0; }
  var env2 = Math.sin(Math.PI * clamp(u, 0, 1));
  return a0 * Math.exp(-dt / 1.4) * Math.sin(TAU * f * dt) * env2;
}
function drawRoom(sc, t) {
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, VW, VH);
  /* warm lamp pool from the top left */
  var lx = sc.x + sc.w * 0.10, ly = sc.y + sc.h * 0.01;
  var R = sc.w * 0.85;
  var grd = ctx.createRadialGradient(lx, ly, 0, lx, ly, R);
  grd.addColorStop(0, rgba(AMBER, 0.34));
  grd.addColorStop(0.45, rgba(AMBER, 0.14));
  grd.addColorStop(1, rgba(AMBER, 0));
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, VW, VH);
  /* the lamp itself: a small shade silhouette in the top corner */
  ctx.fillStyle = ROOM_LO;
  ctx.beginPath();
  ctx.moveTo(lx - sc.w * 0.055, ly + sc.h * 0.085);
  ctx.lineTo(lx + sc.w * 0.055, ly + sc.h * 0.085);
  ctx.lineTo(lx + sc.w * 0.035, ly + sc.h * 0.03);
  ctx.lineTo(lx - sc.w * 0.035, ly + sc.h * 0.03);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgba(AMBER_HI, 0.8);
  ctx.lineWidth = Math.max(1, sc.w * 0.002);
  seg(lx, ly + sc.h * 0.03, lx, ly + sc.h * 0.085);
  ctx.fillStyle = rgba(AMBER_HI, 0.9);
  circ(lx, ly + sc.h * 0.10, Math.max(3, sc.w * 0.008), true);
  /* dust motes drifting in the lamplight */
  var i, d;
  for (i = 0; i < DUST.length; i++) {
    d = DUST[i];
    var dx = sc.x + d.x * sc.w + Math.sin(t * 0.11 + i * 1.7) * sc.w * 0.008;
    var dy = sc.y + d.y * sc.h * 0.55 + Math.cos(t * 0.09 + i * 2.3) * sc.h * 0.006;
    ctx.fillStyle = rgba(AMBER_HI, d.a);
    circ(dx, dy, d.r, true);
  }
}
function drawStand(sc, g) {
  var fw = sc.w, fh = sc.h;
  ctx.strokeStyle = '#241A12';
  ctx.lineWidth = Math.max(3, fw * 0.008);
  var y0 = g.bodyCy + Math.min(sc.w, sc.h) * 0.30;
  var y1 = sc.y + fh * 0.985;
  seg(g.bodyCx - g.bodyW * 0.28, y0, g.bodyCx - g.bodyW * 0.34, y1);
  seg(g.bodyCx + g.bodyW * 0.28, y0, g.bodyCx + g.bodyW * 0.34, y1);
  ctx.lineWidth = Math.max(2, fw * 0.005);
  seg(g.bodyCx - g.bodyW * 0.34, y1, g.bodyCx + g.bodyW * 0.34, y1);
}
function drawBody(sc, g) {
  var fw = sc.w, fh = sc.h;
  var cx = g.bodyCx, cy = g.bodyCy, w = g.bodyW, h = g.bodyH;
  var s = Math.min(sc.w, sc.h);
  /* varnished body: two overlapping bouts on one axis, the overlap
     pinching a waist on the top and bottom edges */
  var lx = cx - s * 0.10, ly = cy + s * 0.03, lr = s * 0.26;  /* lower bout */
  var ux = cx + s * 0.13, uy = cy - s * 0.03, ur = s * 0.19;  /* upper bout */
  ctx.fillStyle = WOOD;
  circ(lx, ly, lr, true);
  circ(ux, uy, ur, true);
  /* rim light along the upper edge, shadow along the lower edge */
  ctx.strokeStyle = rgba(AMBER_HI, 0.55);
  ctx.lineWidth = Math.max(1.5, fw * 0.003);
  ctx.beginPath(); ctx.moveTo(ux - ur * 0.85, uy - ur * 0.55);
  ctx.arc(ux, uy, ur, Math.PI * 0.9, Math.PI * 1.65, false); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx - lr * 0.9, ly - lr * 0.45);
  ctx.arc(lx, ly, lr, Math.PI * 0.9, Math.PI * 1.5, false); ctx.stroke();
  /* wood grain, seeded, only inside the bouts */
  ctx.strokeStyle = rgba(WOOD_LO, 0.35);
  var i, gr;
  for (i = 0; i < GRAIN.length; i++) {
    gr = GRAIN[i];
    var gx = cx - w * 0.5 + gr.x * w, gy = cy - h * 0.5 + gr.y * h;
    var d1 = (gx - lx) * (gx - lx) + (gy - ly) * (gy - ly);
    var d2 = (gx - ux) * (gx - ux) + (gy - uy) * (gy - uy);
    if (d1 > lr * lr && d2 > ur * ur) continue;
    var gl = gr.l * w;
    ctx.lineWidth = gr.w;
    ctx.beginPath(); ctx.moveTo(gx, gy);
    ctx.quadraticCurveTo(gx + gl * 0.5, gy + Math.sin(gr.a) * gl * 0.4, gx + gl, gy + Math.sin(gr.a) * gl * 0.8);
    ctx.stroke();
  }
  /* warm varnish sheen across the upper bout, fading to nothing */
  var sheen = ctx.createRadialGradient(ux, uy - ur * 0.3, 0, ux, uy - ur * 0.3, ur * 1.6);
  sheen.addColorStop(0, rgba(AMBER_HI, 0.16));
  sheen.addColorStop(1, rgba(AMBER_HI, 0));
  ctx.fillStyle = sheen;
  ctx.fillRect(ux - ur * 1.6, uy - ur * 1.9, ur * 3.2, ur * 3.2);
  var shade = ctx.createRadialGradient(lx, ly + lr * 0.5, 0, lx, ly + lr * 0.5, lr * 1.4);
  shade.addColorStop(0, rgba('#000000', 0.22));
  shade.addColorStop(1, rgba('#000000', 0));
  ctx.fillStyle = shade;
  ctx.fillRect(lx - lr * 1.4, ly - lr * 0.9, lr * 2.8, lr * 2.8);
  /* sound hole with a thin amber rosette ring */
  ctx.fillStyle = '#120D08';
  ellipse(g.holeX, g.holeY, w * 0.105, h * 0.17, 0, true);
  ctx.strokeStyle = rgba(AMBER, 0.75);
  ctx.lineWidth = Math.max(1.5, fw * 0.003);
  ellipse(g.holeX, g.holeY, w * 0.125, h * 0.20, 0, false);
  ctx.strokeStyle = rgba(AMBER_DIM, 0.6);
  ctx.lineWidth = Math.max(1, fw * 0.0015);
  ellipse(g.holeX, g.holeY, w * 0.135, h * 0.218, 0, false);
  /* bridge: a vertical bar across the strings, pins in a column */
  ctx.fillStyle = WOOD_LO;
  var bw = w * 0.045;
  var bTop = g.strTop - fh * 0.012, bBot = g.strBot + fh * 0.012;
  rrect(g.bridgeX - bw / 2, bTop, bw, bBot - bTop, bw * 0.4);
  ctx.fill();
  ctx.strokeStyle = WOOD_LINE;
  ctx.lineWidth = Math.max(1, fw * 0.0015);
  ctx.stroke();
  var s2;
  ctx.fillStyle = STRING;
  for (s2 = 0; s2 < 6; s2++) {
    circ(g.bridgeX, stringY(g, s2), Math.max(1.5, fw * 0.003), true);
  }
}
function drawNeck(sc, g) {
  var fw = sc.w;
  /* the neck runs off frame right like a horizon line; the fretboard
     starts just past the sound hole and runs to the right edge */
  var fbX0 = g.holeX + g.bodyW * 0.16;
  ctx.fillStyle = '#33200F';
  ctx.fillRect(fbX0, g.neckTop, sc.x + sc.w - fbX0 + fw * 0.05, g.neckBot - g.neckTop);
  ctx.fillStyle = WOOD_HI;
  ctx.fillRect(fbX0, g.neckTop, sc.x + sc.w - fbX0 + fw * 0.05, Math.max(1.5, (g.neckBot - g.neckTop) * 0.28));
  /* fretboard edge, the horizon itself */
  ctx.strokeStyle = rgba(AMBER_HI, 0.5);
  ctx.lineWidth = Math.max(1.5, fw * 0.0025);
  seg(g.nutX, g.neckTop, sc.x + sc.w + fw * 0.05, g.neckTop);
  /* frets */
  ctx.strokeStyle = rgba(STRING_DIM, 0.8);
  ctx.lineWidth = Math.max(1, fw * 0.0018);
  var i, fx = g.nutX, span = sc.x + sc.w - g.nutX;
  for (i = 1; i <= 12; i++) {
    fx = g.nutX + span * (1 - Math.pow(0.94, i)) / (1 - Math.pow(0.94, 12)) * 0.92;
    if (fx > sc.x + sc.w) break;
    seg(fx, g.neckTop, fx, g.neckBot);
  }
  /* fret markers */
  ctx.fillStyle = rgba(PLATE, 0.75);
  var marks = [3, 5, 7, 9, 12];
  for (i = 0; i < marks.length; i++) {
    var m = marks[i];
    var mx = g.nutX + span * (1 - Math.pow(0.94, m - 0.5)) / (1 - Math.pow(0.94, 12)) * 0.92;
    if (mx > sc.x + sc.w) break;
    circ(mx, g.neckY, Math.max(2, fw * 0.004), true);
  }
  /* nut */
  ctx.fillStyle = PLATE;
  ctx.fillRect(g.nutX - Math.max(2, fw * 0.004), g.neckTop, Math.max(2, fw * 0.004) * 2, g.neckBot - g.neckTop);
}
function drawStrings(sc, g, t) {
  var fw = sc.w;
  var s, i, u, x, y, amp;
  for (s = 0; s < 6; s++) {
    var y0 = stringY(g, s);
    var lw = Math.max(1, fw * 0.0022 - s * 0.12);
    ctx.strokeStyle = s < 3 ? rgba(STRING, 0.95) : rgba(STRING_DIM, 0.9);
    ctx.lineWidth = lw;
    ctx.beginPath();
    var steps = 48;
    for (i = 0; i <= steps; i++) {
      u = i / steps;
      x = lerp(g.strX0, g.strX1, u);
      y = y0;
      amp = 0;
      var e;
      for (e = 0; e < EVENTS.length; e++) {
        if (EVENTS[e].str === s) amp += evStringAmp(EVENTS[e], t, u);
      }
      y += amp;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    /* EBow glow where the EBow voice is swelling */
    for (e = 0; e < EVENTS.length; e++) {
      if (EVENTS[e].str !== s || EVENTS[e].type !== 'ebow') continue;
      var p = evLocal(EVENTS[e], t);
      if (p < 0.25 || p >= 0.80) continue;
      var glow = ease(clamp((p - 0.25) / 0.30, 0, 1));
      var gx = lerp(g.strX0, g.strX1, EVENTS[e].x);
      var gy = y0;
      var gr = Math.max(10, fw * 0.045) * (0.7 + 0.6 * glow);
      var grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      grd.addColorStop(0, rgba(AMBER_HI, 0.55 * glow));
      grd.addColorStop(1, rgba(AMBER_HI, 0));
      ctx.fillStyle = grd;
      ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
    }
  }
}
/* ---- hands, mallets, EBow: they arrive from the top edge ---- */
function drawArm(x, topY, palmY, lean, w) {
  /* forearm entering from above the frame on a gentle curve, fading
     out of the dark at the top so the hand is the focus, not the arm */
  var x0 = x + lean, y0 = topY - w;
  var x1 = x + lean * 2.6, y1 = (topY + palmY) / 2;
  var x2 = x + lean * 0.4, y2 = palmY;
  var N = 14, i, f;
  var pts = [];
  for (i = 0; i <= N; i++) {
    f = i / N;
    var px = (1 - f) * (1 - f) * x0 + 2 * (1 - f) * f * x1 + f * f * x2;
    var py = (1 - f) * (1 - f) * y0 + 2 * (1 - f) * f * y1 + f * f * y2;
    pts.push([px, py]);
  }
  var left = [], right = [];
  for (i = 0; i <= N; i++) {
    var a = pts[Math.max(0, i - 1)], b = pts[Math.min(N, i + 1)];
    var dx = b[0] - a[0], dy = b[1] - a[1];
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len, ny = dx / len;
    var hw = lerp(w * 0.36, w * 0.26, i / N);
    left.push([pts[i][0] + nx * hw, pts[i][1] + ny * hw]);
    right.push([pts[i][0] - nx * hw, pts[i][1] - ny * hw]);
  }
  var grd = ctx.createLinearGradient(0, y0, 0, y2);
  grd.addColorStop(0, rgba(SKIN, 0));
  grd.addColorStop(0.55, rgba(SKIN, 0.5));
  grd.addColorStop(1, rgba(SKIN, 0.92));
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(left[0][0], left[0][1]);
  for (i = 1; i <= N; i++) ctx.lineTo(left[i][0], left[i][1]);
  for (i = N; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
  ctx.closePath(); ctx.fill();
  /* lit edge on the lamp side */
  ctx.strokeStyle = rgba(AMBER_HI, 0.3);
  ctx.lineWidth = Math.max(1, w * 0.05);
  ctx.beginPath();
  ctx.moveTo(left[Math.floor(N * 0.4)][0], left[Math.floor(N * 0.4)][1]);
  for (i = Math.floor(N * 0.4) + 1; i <= N; i++) ctx.lineTo(left[i][0], left[i][1]);
  ctx.stroke();
}
function drawPalm(x, y, w) {
  ctx.fillStyle = SKIN;
  ctx.strokeStyle = SKIN_LINE;
  ctx.lineWidth = Math.max(1, w * 0.05);
  ellipse(x, y, w * 0.52, w * 0.42, 0, true);
  ctx.beginPath(); ctx.moveTo(x + w * 0.52, y);
  ctx.ellipse(x, y, w * 0.52, w * 0.42, 0, 0, TAU); ctx.stroke();
}
function drawFingers(x, y, w, spread, reach) {
  var i;
  ctx.fillStyle = SKIN;
  ctx.strokeStyle = SKIN_LINE;
  ctx.lineWidth = Math.max(1, w * 0.04);
  for (i = 0; i < 3; i++) {
    var fx = x + (i - 1) * spread;
    var fy0 = y + w * 0.22;
    var fy1 = y + w * 0.22 + reach * (1 - Math.abs(i - 1) * 0.18);
    rrect(fx - w * 0.085, fy0, w * 0.17, fy1 - fy0, w * 0.08);
    ctx.fill(); ctx.stroke();
  }
}
function drawGesture(sc, g, ev, t) {
  var p = evLocal(ev, t);
  if (p < 0) return;
  var h = handHeight(p);
  var gx = lerp(g.strX0, g.strX1, ev.x);
  var gy = stringY(g, ev.str);
  var fw = sc.w;
  var w = Math.max(30, fw * 0.042);   /* hand width */
  /* hand rises from above the field; at h = 1 the fingertips touch the string */
  var contactPalmY = gy - w * 0.62;
  var travel = contactPalmY - (sc.y - fw * 0.10);
  var palmY = (sc.y - fw * 0.10) + travel * h;
  var press = (p >= 0.25 && p < 0.65) ? 1 : 0;
  var topY = sc.y - fw * 0.02;
  var lean = fw * 0.05 * (ev.str % 2 === 0 ? 1 : -1);
  if (ev.type === 'mallet') {
    /* fist grips the handle; the head strikes the string */
    var headY = palmY + w * 0.55;
    var headR = Math.max(7, fw * 0.012);
    drawArm(gx + lean * 0.5, topY, palmY - w * 0.2, lean, w * 0.62);
    drawPalm(gx, palmY - w * 0.15, w * 0.9);
    ctx.strokeStyle = WOOD_HI;
    ctx.lineWidth = Math.max(3, fw * 0.006);
    seg(gx, palmY - w * 0.3, gx, headY - headR * 0.4);
    ctx.fillStyle = '#2E2015';
    ctx.strokeStyle = WOOD_LINE;
    ctx.lineWidth = Math.max(1, fw * 0.002);
    circ(gx, headY, headR, true);
    ctx.beginPath(); ctx.moveTo(gx + headR, headY);
    ctx.arc(gx, headY, headR, 0, TAU); ctx.stroke();
    if (press) {
      ctx.strokeStyle = rgba(AMBER_HI, 0.7);
      ctx.lineWidth = Math.max(1, fw * 0.0015);
      circ(gx, gy, headR * 1.9, false);
    }
    return;
  }
  if (ev.type === 'ebow') {
    /* fingers pinch a small dark device; its tip glows at the string */
    var devY = palmY + w * 0.5;
    drawArm(gx + lean * 0.5, topY, palmY - w * 0.2, lean, w * 0.62);
    drawPalm(gx, palmY - w * 0.15, w * 0.9);
    drawFingers(gx, palmY - w * 0.1, w * 0.8, w * 0.22, w * 0.5);
    ctx.fillStyle = '#1B1712';
    ctx.strokeStyle = STRING_DIM;
    ctx.lineWidth = Math.max(1, fw * 0.0018);
    rrect(gx - w * 0.16, devY - w * 0.42, w * 0.32, w * 0.55, w * 0.06);
    ctx.fill(); ctx.stroke();
    if (p >= 0.25 && p < 0.80) {
      var gl = ease(clamp((p - 0.25) / 0.30, 0, 1));
      ctx.fillStyle = rgba(AMBER_HI, 0.9 * gl);
      circ(gx, devY + w * 0.16, Math.max(2.5, fw * 0.005), true);
    }
    return;
  }
  /* pluck and fret: fingers reach down to the string */
  drawArm(gx + lean * 0.5, topY, palmY - w * 0.2, lean, w * 0.62);
  drawPalm(gx, palmY - w * 0.15, w * 0.9);
  var reach = w * 0.55 + (press ? w * 0.12 : 0);
  drawFingers(gx, palmY - w * 0.1, w * 0.85, w * 0.24, reach);
  if (ev.type === 'fret' && press) {
    /* the index finger presses the string to the fretboard */
    ctx.fillStyle = SKIN_LO;
    ellipse(gx, gy - w * 0.05, w * 0.14, w * 0.10, 0, true);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Horizontal Guitar').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Horizontal Guitar').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 18').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Horizontal Guitar', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 18', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the hands come and go.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  /* slow camera drift keeps the instrument centered */
  var driftX = Math.sin(TAU * t / LOOP_LEN) * sc.w * 0.008;
  var driftY = Math.cos(TAU * t / LOOP_LEN * 0.9) * sc.h * 0.006;
  ctx.save();
  ctx.translate(driftX, driftY);
  var g = geom(sc);
  drawRoom(sc, t);
  drawStand(sc, g);
  drawBody(sc, g);
  drawNeck(sc, g);
  drawStrings(sc, g, t);
  var i;
  for (i = 0; i < EVENTS.length; i++) drawGesture(sc, g, EVENTS[i], t);
  ctx.restore();
  if (!isPhone) {
    ctx.strokeStyle = rgba(AMBER, 0.25);
    ctx.lineWidth = 1;
    ctx.strokeRect(sc.x + 0.5, sc.y + 0.5, sc.w - 1, sc.h - 1);
  }
  drawPlates();
}
/* ---- frame one: fixed phase t = 37.0 s of a 48 s loop ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % LOOP_LEN;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
