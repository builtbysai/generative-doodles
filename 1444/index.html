<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annual Stripe, Year by Year</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2ede2; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  // Annual Stripe, Year by Year — kathe-kruse KK5.
  // A life as an uneditable barcode: one hand-painted stripe per year,
  // accumulating from the top, oldest scrolling off when the field fills.
  // No visible text. Silent. Drag down to scroll through the years;
  // drag a stripe sideways to stretch it; it snaps back, wobble intact.
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var PAPER = '#f2ede2';
  var LINE = '#2a2a2a';
  var PALETTE = ['#1a8a7a', '#7a8a2a', '#6a2a6a', '#b84a1a', '#3a5a8a', '#c88a2a',
                 '#5a7a3a', '#8a5a7a', '#2a9aaa', '#d89a1a', '#7a1a2a', '#7aaa6a'];
  var SEED = 1444000;
  var INITIAL = 14;      // stripes already on the field at frame one
  var ACCUM = 3;         // seconds per new stripe
  var GROW = 0.6;        // seconds a new stripe takes to grow in
  var STRIPE_H = 34;     // stripe height in px
  var GAP = 6;           // gap between stripes

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Per-stripe hand data, stable for the life of the stripe.
  function stripeData(i) {
    var rnd = mulberry32(SEED + i * 7919);
    var seg = [];
    for (var s = 0; s < 9; s++) seg.push((rnd() - 0.5) * 5);
    var segB = [];
    for (var j = 0; j < 9; j++) segB.push((rnd() - 0.5) * 5);
    return {
      color: PALETTE[i % 12],
      top: seg, bottom: segB,
      dragSide: rnd() < 0.5 ? -1 : 1,   // which end the brush drag sits on
      dragLen: 10 + rnd() * 22,
      dragY: (rnd() - 0.5) * 8
    };
  }
  var cache = {};
  function dataFor(i) {
    if (!cache[i]) cache[i] = stripeData(i);
    return cache[i];
  }

  function isPhone() {
    var m = 99999;
    try {
      if (window.screen) {
        m = Math.min(window.screen.width, window.screen.height);
      }
    } catch (e) {}
    if (m < 700) return true;
    var w = window.innerWidth || 0, h = window.innerHeight || 0;
    return h > w * 1.15;
  }

  var W = 0, H = 0;
  function size() {
    var vw = 0, vh = 0;
    try {
      if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
    } catch (e) {}
    if (!vw) { vw = window.innerWidth; vh = window.innerHeight; }
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  size();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', size);
  }
  window.addEventListener('resize', size);

  // Interaction state: closed-form functions of recorded events and t.
  var dragShift = 0;       // persistent scroll shift from vertical drags
  var drag = null;         // active drag: {x0,y0,dy,dx,stripe}
  var stretch = null;      // {stripe, amt, releasedAt}
  var RELEASE_DECAY = 1.2; // seconds for a released stretch to snap back

  function onDown(e) {
    var x = e.clientX !== undefined ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
    var y = e.clientY !== undefined ? e.clientY : (e.touches ? e.touches[0].clientY : 0);
    drag = { x0: x, y0: y, dx: 0, dy: 0, stripe: stripeAt(x, y, lastT) };
  }
  function onMove(e) {
    if (!drag) return;
    var x = e.clientX !== undefined ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
    var y = e.clientY !== undefined ? e.clientY : (e.touches ? e.touches[0].clientY : 0);
    drag.dx = x - drag.x0;
    drag.dy = y - drag.y0;
  }
  function onUp() {
    if (!drag) return;
    dragShift += -drag.dy; // finger down moves content down, revealing older years
    if (drag.stripe !== null && Math.abs(drag.dx) > 4) {
      stretch = { stripe: drag.stripe, amt: drag.dx, releasedAt: lastT };
    }
    drag = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // Field geometry for a given time, without drag.
  function fieldGeom() {
    var phone = isPhone();
    var fw = phone ? W : Math.round(W * 0.6);
    var fx = phone ? 0 : Math.round((W - fw) / 2);
    return { fx: fx, fw: fw };
  }
  // Which stripe index sits under (x, y) at time t, or null.
  var lastT = 0;
  function stripeAt(x, y, t) {
    var g = fieldGeom();
    if (x < g.fx || x > g.fx + g.fw) return null;
    var info = layout(t);
    var yy = y + info.offset;
    var slot = STRIPE_H + GAP;
    var idx = Math.floor(yy / slot);
    if (idx < 0 || idx >= info.count) return null;
    var top = idx * slot;
    if (yy > top + STRIPE_H) return null;
    return idx;
  }
  // Layout at time t: how many stripes, and the auto scroll offset.
  function layout(t) {
    var slots = Math.floor(t / ACCUM);
    var frac = (t - slots * ACCUM) / ACCUM;
    var grow = frac < (GROW / ACCUM) ? frac / (GROW / ACCUM) : 1;
    // ease the grow-in
    grow = grow * grow * (3 - 2 * grow);
    var count = INITIAL + slots;
    var totalH = count * (STRIPE_H + GAP) + grow * STRIPE_H;
    var offset = totalH > H ? totalH - H : 0;
    return { count: count, grow: grow, offset: offset, totalH: totalH };
  }

  function round4(a) {
    return Math.round(a * 10000) / 10000;
  }

  function drawStripe(x, y, w, h, d, stretchAmt) {
    var cx = x + w / 2;
    var x0 = x - stretchAmt / 2, x1 = x + w + stretchAmt / 2;
    var segs = 8;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.moveTo(x0, y + d.top[0]);
    for (var s = 1; s <= segs; s++) {
      var xx = x0 + (x1 - x0) * (s / segs);
      ctx.lineTo(xx, y + d.top[s]);
    }
    for (var s2 = segs; s2 >= 0; s2--) {
      var xx2 = x0 + (x1 - x0) * (s2 / segs);
      ctx.lineTo(xx2, y + h + d.bottom[s2]);
    }
    ctx.closePath();
    ctx.fill();
    // Brush drag at one end: a few short strokes past the field edge.
    // Skipped while a stripe is still growing in, so a zero-height
    // newcomer does not leak stray strokes onto the field.
    if (h < 4) return;
    var bx = d.dragSide < 0 ? x0 : x1;
    var dir = d.dragSide;
    for (var k = 0; k < 3; k++) {
      var a = round4(0.55 - k * 0.15);
      ctx.fillStyle = hexA(d.color, a);
      var len = d.dragLen * (1 - k * 0.25);
      var sy = y + h / 2 + d.dragY + (k - 1) * 3;
      ctx.fillRect(dir < 0 ? bx - len : bx, sy, len, 2);
    }
    void cx;
  }

  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + round4(a) + ')';
  }

  function draw(t) {
    lastT = t;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    var g = fieldGeom();
    var info = layout(t);
    var slot = STRIPE_H + GAP;
    var shift = dragShift;
    if (drag) shift += -drag.dy;
    var offset = info.offset + shift;
    var maxOff = Math.max(0, info.totalH - H);
    if (offset < 0) offset = 0;
    if (offset > maxOff) offset = maxOff;

    // Year-line at the field's left edge, ticking down with the stripes.
    var lx = g.fx - 8;
    if (lx < 6) lx = g.fx + 4;
    ctx.fillStyle = LINE;
    ctx.fillRect(lx, 0, 2, H);
    for (var i = 0; i < info.count; i++) {
      var ty = i * slot - offset;
      if (ty >= -STRIPE_H && ty <= H) {
        ctx.fillRect(lx - 4, ty, 6, 2);
      }
    }

    // Stripes.
    for (var j = 0; j < info.count; j++) {
      var sy = j * slot - offset;
      if (sy > H || sy + STRIPE_H < 0) continue;
      var d = dataFor(j);
      var amt = 0;
      if (drag && drag.stripe === j) amt = drag.dx * 0.35;
      if (stretch && stretch.stripe === j) {
        var dt = t - stretch.releasedAt;
        var k = dt >= 0 ? Math.exp(-dt / 0.35) : 1;
        amt = stretch.amt * 0.35 * k;
        if (k < 0.01) amt = 0;
      }
      if (amt > 40) amt = 40;
      if (amt < -40) amt = -40;
      drawStripe(g.fx, sy, g.fw, STRIPE_H, d, amt);
    }
    // Growing stripe at the bottom. Skipped while it is still a sliver:
    // the wobble offsets would otherwise paint a thin band at height 0.
    if (info.grow < 1 && info.grow * STRIPE_H >= 4) {
      var gy = info.count * slot - offset;
      if (gy < H) {
        var gd = dataFor(info.count);
        drawStripe(g.fx, gy, g.fw, STRIPE_H * info.grow, gd, 0);
      }
    }
  }

  // Frame one: constant phase, drawn synchronously at load.
  draw(0);

  var startTime = null;
  function loop(ts) {
    if (startTime === null) startTime = ts;
    var t = (ts - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
