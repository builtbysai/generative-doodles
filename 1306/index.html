<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Composite</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2B2F36; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var PAL = ['#7A1020', '#C4551F', '#D9A441', '#2B2F36', '#E8E2D4', '#1F3A3A'];
  var CRIMSON = '#7A1020', ORANGE = '#C4551F', OCHRE = '#D9A441';
  var SLATE = '#2B2F36', BONE = '#E8E2D4', TEAL = '#1F3A3A';

  function viewport() {
    var w, h;
    if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.width) {
      w = visualViewport.width; h = visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1280; h = 900; }
    return { w: w, h: h };
  }

  function isPhone(w, h) {
    var scr = null;
    try { scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null; } catch (e) { scr = null; }
    if (scr && scr.width && scr.height) {
      var m = Math.min(scr.width, scr.height);
      if (m < 700) return true;
    }
    return h > w * 1.15;
  }

  var W = 0, H = 0, panel = null, phone = false;

  function size() {
    var v = viewport();
    W = v.w; H = v.h;
    phone = isPhone(W, H);
    if (phone) {
      panel = { x: 0, y: 0, w: W, h: H };
    } else {
      var ph = Math.floor(H * 0.92);
      var pw = Math.floor(ph * 0.72);
      if (pw > W * 0.8) { pw = Math.floor(W * 0.8); ph = Math.floor(pw / 0.72); }
      panel = { x: Math.floor((W - pw) / 2), y: Math.floor((H - ph) / 2), w: pw, h: ph };
    }
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }

  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI);
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, Math.PI, Math.PI * 2);
    ctx.fill();
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  function poly(points, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    ctx.fill();
  }

  function ring(x, y, r, color, lw) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI);
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, Math.PI, Math.PI * 2);
    ctx.stroke();
  }

  // Debris layout for one loop, from a seeded PRNG. 9 layers max.
  var debrisCache = null, debrisLoop = -1;
  function debrisFor(loop) {
    if (debrisCache && debrisLoop === loop) return debrisCache;
    var rnd = mulberry32(1306000 + loop * 7919);
    var layers = [];
    for (var L = 0; L < 9; L++) {
      var items = [];
      var n = 8 + Math.floor(rnd() * 6);
      for (var i = 0; i < n; i++) {
        var t = Math.floor(rnd() * 6);
        items.push({
          type: t,
          u: (rnd() * 2 - 1),
          v: rnd(),
          s: 0.03 + rnd() * 0.075,
          rot: rnd() * Math.PI * 2,
          col: PAL[Math.floor(rnd() * PAL.length)],
          a: 0.30 + rnd() * 0.30
        });
      }
      layers.push(items);
    }
    debrisCache = layers; debrisLoop = loop;
    return layers;
  }

  function drawDebrisItem(it, cx, cy, R, angle, jit, alphaScale) {
    var ca = Math.cos(angle), sa = Math.sin(angle);
    var lx = it.u * R * 1.05, ly = (it.v - 0.35) * R * 1.5;
    var rx = lx * ca - ly * sa, ry = lx * sa + ly * ca;
    var x = cx + rx + jit * it.u * 6, y = cy + ry + jit * it.v * 6;
    var s = it.s * R * 2;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(it.rot + angle * 0.3);
    ctx.globalAlpha = it.a * alphaScale;
    if (it.type === 0) {
      // vinyl record: disc with hole and grooves
      ctx.fillStyle = it.col;
      ctx.beginPath();
      ctx.moveTo(s, 0); ctx.arc(0, 0, s, 0, Math.PI);
      ctx.moveTo(s, 0); ctx.arc(0, 0, s, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = it.a * alphaScale;
      dot(0, 0, Math.max(2, s * 0.16), BONE);
      ctx.globalAlpha = it.a * alphaScale * 0.8;
      ring(0, 0, s * 0.55, BONE, 1);
      ring(0, 0, s * 0.8, BONE, 1);
    } else if (it.type === 1) {
      // plate: flat ellipse
      ctx.fillStyle = it.col;
      ctx.beginPath();
      ctx.moveTo(s, 0); ctx.arc(0, 0, s, 0, Math.PI);
      ctx.moveTo(s, 0); ctx.arc(0, 0, s, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = it.a * alphaScale * 0.7;
      ring(0, 0, s * 0.6, BONE, 1);
    } else if (it.type === 2) {
      // tool bar
      rect(-s, -s * 0.22, s * 2, s * 0.44, it.col);
      ctx.globalAlpha = it.a * alphaScale;
      dot(s, 0, s * 0.35, BONE);
    } else if (it.type === 3) {
      // doorknob
      dot(0, 0, s * 0.55, it.col);
      ctx.globalAlpha = it.a * alphaScale * 0.8;
      dot(-s * 0.2, -s * 0.2, s * 0.18, BONE);
    } else if (it.type === 4) {
      // plain paper slip (unbranded)
      rect(-s, -s * 0.6, s * 2, s * 1.2, it.col);
    } else {
      // shard polygon
      var p = [];
      var k = 5 + Math.floor(it.rot * 2) % 3;
      for (var j = 0; j < k; j++) {
        var a = (j / k) * Math.PI * 2;
        var rr = s * (0.6 + 0.4 * Math.abs(Math.sin(a * 2 + it.rot)));
        p.push([Math.cos(a) * rr, Math.sin(a) * rr]);
      }
      poly(p, it.col);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawLayerSet(layers, cx, cy, R, angle, jit, alphaScale) {
    for (var L = 0; L < layers.length; L++) {
      var items = layers[L];
      for (var i = 0; i < items.length; i++) {
        drawDebrisItem(items[i], cx, cy, R, angle, jit, alphaScale);
      }
    }
  }

  function drawRecord(cx, cy, R, alpha) {
    var s = R * 0.52;
    var y = cy + R * 0.78;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#14100E';
    ctx.beginPath();
    ctx.moveTo(cx + s, y); ctx.arc(cx, y, s, 0, Math.PI);
    ctx.moveTo(cx + s, y); ctx.arc(cx, y, s, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = alpha * 0.9;
    ring(cx, y, s * 0.35, BONE, 1);
    ring(cx, y, s * 0.55, BONE, 1);
    ring(cx, y, s * 0.75, BONE, 1);
    ring(cx, y, s * 0.92, BONE, 1);
    dot(cx, y, Math.max(2, s * 0.08), BONE);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawThumbs(px, py, pw, ph, current, resolveView) {
    var n = 12;
    var tw = Math.max(14, pw * 0.055);
    var th = tw * 0.75;
    for (var i = 0; i < n; i++) {
      var f = i / (n - 1);
      var x = px + 6 + Math.sin(f * Math.PI) * pw * 0.03;
      var y = py + ph * 0.08 + f * (ph * 0.84);
      var active = (i === current) || (resolveView >= 0 && i === resolveView);
      ctx.globalAlpha = active ? 0.95 : 0.45;
      rect(x, y, tw, th, active ? BONE : '#3A3A38');
      ctx.globalAlpha = active ? 0.9 : 0.4;
      rect(x + 2, y + 2, tw - 4, th - 4, i % 2 ? CRIMSON : TEAL);
      ctx.globalAlpha = 1;
      if (active) {
        ctx.strokeStyle = BONE; ctx.lineWidth = 1;
        ctx.strokeRect(x - 1, y - 1, tw + 2, th + 2);
      }
    }
  }

  function smooth(f) { return f * f * (3 - 2 * f); }

  function draw(t) {
    ctx.globalAlpha = 1;
    rect(0, 0, W, H, SLATE);
    var p = panel;
    rect(p.x, p.y, p.w, p.h, SLATE);
    var cx = p.x + p.w / 2, cy = p.y + p.h * 0.46;
    var R = Math.min(p.w, p.h) * 0.36;

    var LOOP = 72, VIEW = 5, RESOLVE = 6, DISSOLVE = 6;
    var loop = Math.floor(t / LOOP);
    var lt = t - loop * LOOP;
    var layers = debrisFor(loop);
    var rnd = mulberry32(1306000 + loop * 7919 + 77);
    var resolveView = Math.floor(rnd() * 12);

    var current = 0, angleA = 0, angleB = 0, blend = 0, jit = 1, alphaScale = 1, recAlpha = 0.45;
    if (lt < 60) {
      var vi = Math.floor(lt / VIEW);
      var vf = (lt - vi * VIEW) / VIEW;
      current = vi;
      angleA = vi * (Math.PI * 2 / 12);
      angleB = ((vi + 1) % 12) * (Math.PI * 2 / 12);
      if (vi === 11) angleB = Math.PI * 2;
      blend = smooth(vf);
      jit = 1; alphaScale = 1; recAlpha = 0.45;
    } else if (lt < 66) {
      // resolve beat: one crisp view
      current = resolveView;
      angleA = resolveView * (Math.PI * 2 / 12);
      angleB = angleA; blend = 0;
      jit = 0; alphaScale = 1.6; recAlpha = 0.85;
    } else {
      // dissolve back into layered abstraction
      var df = (lt - 66) / DISSOLVE;
      current = resolveView;
      angleA = resolveView * (Math.PI * 2 / 12);
      angleB = angleA; blend = 0;
      jit = df; alphaScale = 1.6 - 0.6 * df; recAlpha = 0.85 - 0.4 * df;
    }

    // record trapdoor under the mound, hazy
    drawRecord(cx, cy, R, recAlpha);
    // crossfaded layer sets
    if (blend > 0) {
      drawLayerSet(layers, cx, cy, R, angleA, jit, alphaScale * (1 - blend));
      drawLayerSet(layers, cx, cy, R, angleB, jit, alphaScale * blend);
    } else {
      drawLayerSet(layers, cx, cy, R, angleA, jit, alphaScale);
    }
    // faint record outline over the pile bottom
    ctx.globalAlpha = 0.25;
    ring(cx, cy + R * 0.78, R * 0.52, BONE, 1);
    ctx.globalAlpha = 1;

    // perspective thumbnails arc along the left edge
    drawThumbs(p.x, p.y, p.w, p.h, current, (lt >= 60 && lt < 66) ? resolveView : -1);

    // faint grain flecks, seeded per loop
    var gr = mulberry32(1306000 + loop * 7919 + 5);
    ctx.globalAlpha = 0.05;
    for (var g = 0; g < 120; g++) {
      rect(p.x + gr() * p.w, p.y + gr() * p.h, 2, 1, BONE);
    }
    ctx.globalAlpha = 1;
  }

  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    size();
    draw(0);
  }

  size();
  boot();

  var start = 0, started = false;
  function loop() {
    if (!started) { started = true; start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0; }
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var t = (now - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { size(); draw(0); });
  }
  if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
    visualViewport.addEventListener('resize', function () { size(); draw(0); });
  }
})();
</script>
</body>
</html>
