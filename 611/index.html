<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1927 Revisited in a New Light</title>
<style>
  html, body { margin: 0; padding: 0; background: #171208; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/lauren-kinsella.md does not exist in the repo, so these
  // hex values are chosen from the prompt's own color names.
  var DIM_BG = '#171208';    // dim room, candlelit dusk
  var NOON_BG = '#f6efdc';   // noon-bright room, warm paper
  var GOLD = '#d9a441';      // voice, candle gold
  var GOLD_LT = '#eec27a';   // voice glow, lighter gold
  var PIANO = '#141414';     // piano, near black
  var SAGE = '#8a9a7b';      // arranger color, sage
  var RUST = '#b4552d';      // arranger color, rust
  var INDIGO = '#3d4a7a';    // arranger color, indigo
  var COPPER = '#b87333';    // arranger color, copper
  var INK_DARK = '#241d12';  // plate ink on bright ground
  var INK_LT = '#ece6d8';    // plate ink on dim ground

  // Fixed-phase first frame: t = 48 s. The arc is 120 s: duo for 15 s,
  // growth from 15 to 75 s, full thirty-piece hold to 90 s, thinning
  // from 90 to 105 s, duo again to 120 s. At t = 48 about sixteen
  // ensemble lines have joined, the headcount is near seventeen of
  // thirty, and the light is mid-bright, so the growth reads at frame
  // one. Frame one is byte-reproducible: every line and dot is a pure
  // function of t and the seeded PRNG.
  var FIRST_T = 48;
  var CYCLE = 120;
  var GROW_START = 15, GROW_END = 75, HOLD_END = 90, THIN_END = 105;
  var N_LAYERS = 28; // duo plus 28 joining lines makes thirty

  // Seeded PRNG, mulberry32. A fresh instance is built per draw from the
  // piece number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The ensemble layers, fixed at load from the seed: each has an
  // arranger color, a stack offset above or below the melody, a wave
  // frequency and phase, and note-dot positions. Nothing here moves with
  // time except the layer's fade and a small shimmer.
  var ARRANGER = [SAGE, RUST, INDIGO, COPPER];
  var LAYERS = [];
  (function buildLayers() {
    var rng = mulberry32(1927);
    for (var i = 0; i < N_LAYERS; i++) {
      var side = (i % 2 === 0) ? -1 : 1;
      var rank = Math.floor(i / 2) + 1;
      var dots = [];
      for (var d = 0; d < 5; d++) { dots.push(0.08 + rng() * 0.84); }
      LAYERS.push({
        color: ARRANGER[i % ARRANGER.length],
        offset: side * rank,
        freq: 0.8 + rng() * 2.2,
        phase: rng() * Math.PI * 2,
        amp: 0.008 + rng() * 0.010,
        dots: dots,
        join: GROW_START + i * (GROW_END - GROW_START) / N_LAYERS,
        leave: THIN_END - (N_LAYERS - 1 - i) * (THIN_END - HOLD_END) / N_LAYERS
      });
    }
  })();

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function mixHex(h1, h2, t) {
    var r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
    var r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
    var r = Math.round(lerp(r1, r2, t)), g = Math.round(lerp(g1, g2, t)), b = Math.round(lerp(b1, b2, t));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function smooth(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The melody: one fixed path, a pure function of x only. It never
  // changes shape at any headcount; only the light and the stacked lines
  // around it change.
  function melodyY(x) {
    var u = x / W;
    return H * 0.52
      + Math.sin(u * Math.PI * 2 * 1.2 + 0.6) * H * 0.020
      + Math.sin(u * Math.PI * 2 * 3.1 + 2.0) * H * 0.010;
  }

  // A layer's line: the melody's shape carried to its stack offset, with
  // its own gentle wave and a small slow shimmer. The offset and wave are
  // fixed per layer; the shimmer is a pure function of t.
  function layerY(L, x, t) {
    var u = x / W;
    return melodyY(x) + L.offset * H * 0.022
      + Math.sin(u * Math.PI * 2 * L.freq + L.phase) * H * L.amp
      + Math.sin(t * 0.20 + L.phase) * H * 0.003;
  }

  // A layer's presence at time t: 0 before it joins, fading in over 2 s
  // after its join time, 1 while it plays, fading out over 1.5 s as the
  // ensemble thins. The thinning order is the reverse of the join order.
  function layerAlpha(L, t) {
    var aIn = smooth(L.join, L.join + 2, t);
    var aOut = 1 - smooth(L.leave, L.leave + 1.5, t);
    return clamp(Math.min(aIn, aOut), 0, 1);
  }

  // Phase word for the headcount line, top right.
  function phaseWord(t) {
    if (t < GROW_START) { return 'the duo'; }
    if (t < GROW_END) { return 'the room brightens'; }
    if (t < HOLD_END) { return 'thirty voices'; }
    if (t < THIN_END) { return 'the room dims'; }
    return 'the duo, again';
  }

  function drawLine(fn, t, color, width, alpha) {
    ctx.strokeStyle = hexA(color, a4(alpha));
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    var step = Math.max(2, W / 180);
    for (var x = 0; x <= W; x += step) {
      if (x === 0) { ctx.moveTo(x, fn(x, t)); }
      else { ctx.lineTo(x, fn(x, t)); }
    }
    ctx.stroke();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var ph = t - Math.floor(t / CYCLE) * CYCLE;

    // Headcount and light: the light is a global wash mapped to the
    // active layer count, counting partial fades, so it moves smoothly
    // with the headcount instead of stepping.
    var active = 0;
    var alphas = [];
    for (var i = 0; i < N_LAYERS; i++) {
      var al = layerAlpha(LAYERS[i], ph);
      alphas.push(al);
      active += al;
    }
    var headcount = 2 + active;
    // The light rises faster than the headcount: a few joining lines
    // already lift the room well out of the dark, and thirty voices
    // bring full noon.
    var light = 0.18 + 0.82 * Math.pow(active / N_LAYERS, 0.6);

    // Room ground: dim candlelit brown at duo, noon-bright warm paper
    // at thirty voices, back to dusk as the ensemble thins.
    ctx.fillStyle = mixHex(DIM_BG, NOON_BG, light);
    ctx.fillRect(0, 0, W, H);

    // Sun glow, upper right, strengthening with the light.
    var sg = ctx.createRadialGradient(W * 0.78, H * 0.16, 0, W * 0.78, H * 0.16, Math.min(W, H) * 0.55);
    sg.addColorStop(0, hexA(GOLD_LT, a4(0.06 + 0.26 * light)));
    sg.addColorStop(1, hexA(GOLD_LT, 0));
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, H);

    // Faint room walls: two vertical seams that the light reveals.
    ctx.strokeStyle = hexA(light > 0.5 ? INK_DARK : INK_LT, a4(0.05 + 0.08 * light));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W * 0.06, H * 0.08); ctx.lineTo(W * 0.06, H * 0.92);
    ctx.moveTo(W * 0.94, H * 0.08); ctx.lineTo(W * 0.94, H * 0.92);
    ctx.stroke();

    // Ensemble lines, stacked above and below the melody, each in its
    // arranger's handwriting color, with note dots along the line.
    for (var li = 0; li < N_LAYERS; li++) {
      var L = LAYERS[li];
      var a = alphas[li];
      if (a <= 0.01) { continue; }
      (function (LL, aa) {
        drawLine(function (x, tt) { return layerY(LL, x, tt); }, ph, LL.color, Math.max(1.2, H * 0.0022), 0.85 * aa);
        var r = Math.max(1.6, H * 0.0038);
        ctx.fillStyle = hexA(LL.color, a4(0.9 * aa));
        for (var d = 0; d < LL.dots.length; d++) {
          var dx = LL.dots[d] * W;
          var dy = layerY(LL, dx, ph);
          ctx.beginPath(); ctx.moveTo(dx + r, dy); ctx.arc(dx, dy, r, 0, Math.PI * 2); ctx.fill();
        }
      })(L, a);
    }

    // Piano: a second fixed line just below the melody, drawn as a dark
    // core over a thin gold under-stroke so it reads on dim ground and
    // on noon-bright ground alike. It never moves with the headcount.
    drawLine(function (x) { return melodyY(x) + H * 0.030; }, ph, GOLD, Math.max(2, H * 0.004), 0.55);
    drawLine(function (x) { return melodyY(x) + H * 0.030; }, ph, PIANO, Math.max(1.2, H * 0.0022), 0.9);

    // The melody itself, in candle gold with a soft glow pass: the same
    // fixed path at every headcount, drawn last so it stays on top.
    drawLine(melodyY, ph, GOLD, Math.max(4, H * 0.012), 0.22);
    drawLine(melodyY, ph, GOLD_LT, Math.max(1.8, H * 0.0042), 0.95);

    // Gold note dots riding the melody, fixed positions from the seed.
    var rng = mulberry32(1927);
    var mr = Math.max(2, H * 0.005);
    ctx.fillStyle = hexA(GOLD_LT, 0.95);
    for (var m = 0; m < 7; m++) {
      var mx = (0.07 + rng() * 0.86) * W;
      var my = melodyY(mx);
      ctx.beginPath(); ctx.moveTo(mx + mr, my); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    }

    // Plates: ink flips with the light so it stays legible in the dim
    // room and at noon. Title plate top-left, headcount top-right.
    var ink = (light > 0.5) ? INK_DARK : INK_LT;
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = ink;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Revisited in a New Light', 18, 34);
    ctx.fillStyle = hexA(ink, 0.75);
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1927 · 2007 · 04 · 22', 18, 34 + fs2 + 8);

    ctx.textAlign = 'right';
    ctx.fillStyle = ink;
    ctx.font = '600 ' + fs2 + 'px Georgia, "Times New Roman", serif';
    var countText = Math.round(headcount) + ' of 30';
    ctx.fillText(countText, W - 18, 34);
    ctx.fillStyle = hexA(ink, 0.75);
    ctx.font = 'italic ' + fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(phaseWord(ph), W - 18, 34 + fs2 + 8);
    ctx.textAlign = 'left';

    // Hint, centered at the bottom.
    ctx.fillStyle = hexA(ink, 0.85);
    ctx.textAlign = 'center';
    var hint = 'Watch the same song grow large.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    if (W < 560) {
      ctx.fillText('Watch the same song', W / 2, H - 34);
      ctx.fillText('grow large.', W / 2, H - 16);
    } else {
      ctx.fillText(hint, W / 2, H - 20);
    }
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs under 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
