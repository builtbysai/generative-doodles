<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Body as Lightning</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2EDE3; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var PAPER = '#F2EDE3';
  var COLORS = ['#C8461F', '#2B3A67', '#D9A441']; // vermilion, indigo, ochre

  // ---- seeded RNG: mulberry32 ----
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // deterministic per-(seed, index) value in [0,1)
  function hash01(seed, idx) {
    var r = mulberry32((seed ^ Math.imul(idx + 1, 0x9E3779B1)) >>> 0);
    return r();
  }

  // ---- dance poses ----
  // joints in dancer space: hip at (0,0), y grows downward, full figure ~ y in [-1.1, 0.95]
  // keys: neck, head, eA/hA (arm A elbow/hand), eB/hB, kA/fA (leg A knee/foot), kB/fB
  var POSES = [
    { name: 'leap',   neck: [0.05, -0.85], head: [0.08, -1.06],
      eA: [-0.45, -1.15], hA: [-0.78, -0.95], eB: [0.50, -1.20], hB: [0.82, -1.46],
      kA: [-0.35, 0.35], fA: [-0.62, 0.78], kB: [0.40, 0.30], fB: [0.78, 0.08] },
    { name: 'turn',   neck: [-0.05, -0.85], head: [-0.08, -1.06],
      eA: [-0.55, -0.80], hA: [-0.88, -0.55], eB: [0.45, -0.95], hB: [0.72, -0.68],
      kA: [-0.15, 0.45], fA: [-0.20, 0.92], kB: [0.35, 0.25], fB: [0.58, 0.55] },
    { name: 'crouch', neck: [0.15, -0.55], head: [0.24, -0.74],
      eA: [-0.30, -0.35], hA: [-0.48, 0.06], eB: [0.55, -0.40], hB: [0.78, -0.04],
      kA: [-0.45, 0.25], fA: [-0.52, 0.62], kB: [0.50, 0.30], fB: [0.68, 0.56] },
    { name: 'reach',  neck: [0.00, -0.90], head: [0.02, -1.11],
      eA: [0.35, -1.25], hA: [0.62, -1.56], eB: [-0.30, -1.10], hB: [-0.52, -1.36],
      kA: [-0.10, 0.45], fA: [-0.12, 0.92], kB: [0.25, 0.40], fB: [0.32, 0.88] },
    { name: 'split',  neck: [0.00, -0.70], head: [0.00, -0.92],
      eA: [-0.50, -0.95], hA: [-0.82, -0.80], eB: [0.50, -0.95], hB: [0.82, -0.80],
      kA: [-0.55, 0.05], fA: [-0.98, 0.10], kB: [0.55, 0.05], fB: [0.98, 0.10] }
  ];
  var JOINTS = ['neck', 'head', 'eA', 'hA', 'eB', 'hB', 'kA', 'fA', 'kB', 'fB'];

  function smootherstep(x) { return x * x * x * (x * (x * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ---- dancers ----
  var N = 14;
  var dancers = [];
  (function buildDancers() {
    var master = mulberry32(611074);
    // jittered 5x3 anchor grid: guarantees edge-to-edge coverage,
    // rows weighted above center per the prompt's density rule
    var cells = [];
    var rows = [0.20, 0.46, 0.72];
    var cols = [0.08, 0.28, 0.48, 0.68, 0.88];
    for (var ri = 0; ri < rows.length; ri++)
      for (var ci = 0; ci < cols.length; ci++)
        cells.push([cols[ci], rows[ri]]);
    // seeded shuffle, take 14 of 15
    for (var s = cells.length - 1; s > 0; s--) {
      var sw = Math.floor(master() * (s + 1));
      var tmp = cells[s]; cells[s] = cells[sw]; cells[sw] = tmp;
    }
    for (var i = 0; i < N; i++) {
      var seed = 1000 + i * 7919;
      var r = mulberry32(seed ^ 0x51ab);
      var d = {
        seed: seed,
        ax: cells[i][0] + (r() * 2 - 1) * 0.05,    // anchor x (fraction of width)
        ay: cells[i][1] + (r() * 2 - 1) * 0.05,    // anchor y
        scale: 0.62 + r() * 0.63,                  // relative figure size (layered depths)
        color: COLORS[Math.floor(r() * 3) % 3],
        mirror: r() < 0.45 ? -1 : 1,
        vx: (r() * 2 - 1) * 0.011,                 // slow drift, fraction of width / sec
        bobAmp: 0.008 + r() * 0.014,
        bobPer: 3.2 + r() * 2.6,
        cycleDur: 6 + hash01(seed, 991) * 3,       // 6-9 s leap cycles
        cycleOff: hash01(seed, 992) * 40,
        lifePer: 42 + r() * 30,                    // slow alpha breathing period
        lifeOff: (r() * 2 - 1) * 0.4,              // keeps frame-one alpha near full
        leanSeed: r() * Math.PI * 2,
        jit: []
      };
      if (Math.abs(d.vx) < 0.003) d.vx = d.vx < 0 ? -0.004 : 0.004;
      // static per-limb jitter for the washy strokes (5 limbs x 4 passes x 2 axes)
      var jr = mulberry32(seed ^ 0x77c1);
      for (var j = 0; j < 40; j++) d.jit.push((jr() * 2 - 1));
      dancers.push(d);
    }
  })();

  function poseIndexAt(d, cycle) {
    var idx = Math.floor(hash01(d.seed, cycle * 7 + 13) * POSES.length) % POSES.length;
    return idx;
  }

  // interpolated joint set for dancer d at time t
  function jointsAt(d, t) {
    var ct = (t + d.cycleOff) / d.cycleDur;
    var cycle = Math.floor(ct);
    var frac = ct - cycle;
    var e = smootherstep(frac);
    var pa = POSES[poseIndexAt(d, cycle)];
    var pb = POSES[poseIndexAt(d, cycle + 1)];
    var out = {};
    for (var i = 0; i < JOINTS.length; i++) {
      var k = JOINTS[i];
      out[k] = [lerp(pa[k][0], pb[k][0], e), lerp(pa[k][1], pb[k][1], e)];
    }
    return out;
  }

  function alphaAt(d, t, edgeFade) {
    var life = 0.68 + 0.32 * Math.sin((Math.PI * 2 * t) / d.lifePer + Math.PI / 2 + d.lifeOff);
    return life * edgeFade;
  }

  // ---- canvas / viewport ----
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var minDim = Math.min(sw || W, sh || H);
    if (minDim && minDim < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if (!w || !h) {
      w = (typeof window !== 'undefined' && window.innerWidth) || 300;
      h = (typeof window !== 'undefined' && window.innerHeight) || 300;
    }
    W = Math.round(w); H = Math.round(h);
    canvas.width = W; canvas.height = H;
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }

  // ---- gust state (interaction only; never part of frame one) ----
  var gust = { x: 0, y: 0, vx: 0, vy: 0, strength: 0, active: false, lastX: 0, lastY: 0, lastMove: 0 };

  function pointerPos(ev) {
    if (ev.touches && ev.touches.length) return [ev.touches[0].clientX, ev.touches[0].clientY];
    return [ev.clientX, ev.clientY];
  }
  function onDown(ev) {
    var p = pointerPos(ev);
    gust.lastX = p[0]; gust.lastY = p[1]; gust.active = true;
  }
  function onMove(ev) {
    if (!gust.active) return;
    var p = pointerPos(ev);
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var dt = Math.max(8, now - gust.lastMove || 16);
    var dx = p[0] - gust.lastX, dy = p[1] - gust.lastY;
    gust.x = p[0]; gust.y = p[1];
    gust.vx = dx / dt * 16.7; gust.vy = dy / dt * 16.7;
    var speed = Math.sqrt(gust.vx * gust.vx + gust.vy * gust.vy);
    gust.strength = Math.min(1.4, gust.strength + speed * 0.012);
    gust.lastX = p[0]; gust.lastY = p[1]; gust.lastMove = now;
  }
  function onUp() { gust.active = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    canvas.addEventListener('touchmove', onMove, { passive: true });
    canvas.addEventListener('touchend', onUp);
  }

  // ---- drawing ----
  // Filled silhouette bodies: each dancer is ONE path per pass (tapered torso
  // mass, tapered limbs, neck bridge, head, rounded hand/foot caps), filled
  // once per pass, so overlaps inside a dancer never stack into joint dots.
  // ws are half-widths as fractions of the figure unit; wf scales a pass.
  function stripInto(pts, ws, unit, wf) {
    var n = pts.length, left = [], right = [], i, dx, dy, len, nx, ny, w;
    for (i = 0; i < n; i++) {
      if (i === 0) { dx = pts[1][0] - pts[0][0]; dy = pts[1][1] - pts[0][1]; }
      else if (i === n - 1) { dx = pts[n - 1][0] - pts[n - 2][0]; dy = pts[n - 1][1] - pts[n - 2][1]; }
      else { dx = pts[i + 1][0] - pts[i - 1][0]; dy = pts[i + 1][1] - pts[i - 1][1]; }
      len = Math.sqrt(dx * dx + dy * dy) || 1;
      nx = -dy / len; ny = dx / len;
      w = ws[i] * unit * wf;
      left.push([pts[i][0] + nx * w, pts[i][1] + ny * w]);
      right.push([pts[i][0] - nx * w, pts[i][1] - ny * w]);
    }
    ctx.moveTo(left[0][0], left[0][1]);
    for (i = 1; i < n; i++) ctx.lineTo(left[i][0], left[i][1]);
    for (i = n - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
    ctx.closePath();
  }
  function capCircle(pt, wFrac, unit, wf) {
    var r = wFrac * unit * wf;
    ctx.moveTo(pt[0] + r, pt[1]);
    ctx.arc(pt[0], pt[1], r, 0, Math.PI * 2);
  }
  function silhouette(hip, neck, head, eA, hA, eB, hB, kA, fA, kB, fB, unit, wf) {
    var mid = [hip[0] + (neck[0] - hip[0]) * 0.45, hip[1] + (neck[1] - hip[1]) * 0.45];
    ctx.beginPath();
    stripInto([hip, mid, neck], [0.155, 0.120, 0.180], unit, wf); // torso mass: hips, waist, shoulders
    stripInto([neck, head], [0.060, 0.052], unit, wf);            // neck bridge
    stripInto([neck, eA, hA], [0.068, 0.046, 0.028], unit, wf);   // arm A, tapered
    stripInto([neck, eB, hB], [0.068, 0.046, 0.028], unit, wf);   // arm B, tapered
    stripInto([hip, kA, fA], [0.095, 0.060, 0.034], unit, wf);    // leg A, tapered
    stripInto([hip, kB, fB], [0.095, 0.060, 0.034], unit, wf);    // leg B, tapered
    capCircle(hA, 0.028, unit, wf);                               // rounded hands
    capCircle(hB, 0.028, unit, wf);
    capCircle(fA, 0.034, unit, wf);                               // rounded feet
    capCircle(fB, 0.034, unit, wf);
    capCircle(head, 0.120, unit, wf);                             // head, merged into the neck
  }

  function drawDancer(d, t) {
    var minDim = Math.min(W, H);
    var unit = minDim * 0.168 * d.scale; // half-height scale

    // horizontal drift with wrap into [-0.3, 1.3]
    var span = 1.6;
    var xf = d.ax + d.vx * t;
    var wrapped = ((xf + 0.3) % span + span) % span - 0.3;
    // edge fade near the wrap boundaries so figures dissolve at the edges
    var edgeFade = 1;
    var edgeZone = 0.16;
    if (wrapped < -0.3 + edgeZone) edgeFade = Math.max(0, (wrapped + 0.3) / edgeZone);
    if (wrapped > 1.3 - edgeZone) edgeFade = Math.max(0, (1.3 - wrapped) / edgeZone);
    edgeFade = Math.min(1, edgeFade * 1.6);

    var bob = Math.sin((Math.PI * 2 * t) / d.bobPer + d.leanSeed) * d.bobAmp;
    var cx = wrapped * W;
    var cy = (d.ay + bob) * H;

    // gust: lean and swirl fall off with distance from the pointer
    var gx = 0, gy = 0, lean = 0;
    if (gust.strength > 0.003) {
      var dx = cx - gust.x, dy = cy - gust.y;
      var dist = Math.sqrt(dx * dx + dy * dy) + 1;
      var R = minDim * 0.55;
      var fall = Math.max(0, 1 - dist / R);
      fall = fall * fall;
      var sw = gust.strength * fall;
      gx = (-dy / dist) * sw * minDim * 0.05 + gust.vx * sw * 2.2;
      gy = (dx / dist) * sw * minDim * 0.05 + gust.vy * sw * 2.2;
      lean = sw * 0.38 * (gust.vx >= 0 ? 1 : -1);
    }

    var alpha = alphaAt(d, t, edgeFade) * 0.62;
    if (alpha <= 0.01) return;

    var J = jointsAt(d, t);
    function P(pt) {
      var x = pt[0] * d.mirror;
      var y = pt[1];
      // lean rotates the figure slightly around the hip
      var rx = x * Math.cos(lean) - y * Math.sin(lean);
      var ry = x * Math.sin(lean) + y * Math.cos(lean);
      return [cx + gx + rx * unit, cy + gy + ry * unit];
    }
    var hip = [cx + gx, cy + gy];
    var neck = P(J.neck), head = P(J.head);
    var eA = P(J.eA), hA = P(J.hA), eB = P(J.eB), hB = P(J.hB);
    var kA = P(J.kA), fA = P(J.fA), kB = P(J.kB), fB = P(J.fB);

    ctx.fillStyle = d.color;
    var j = d.jit;
    // 4 jittered translucent passes, widths stepping down: washy rim, solid core
    var WF = [1.35, 1.15, 0.97, 0.82];
    for (var p = 0; p < 4; p++) {
      ctx.save();
      ctx.translate(j[p * 2] * unit * 0.022, j[p * 2 + 1] * unit * 0.022);
      silhouette(hip, neck, head, eA, hA, eB, hB, kA, fA, kB, fB, unit, WF[p]);
      ctx.globalAlpha = alpha * 0.30;
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  var lastT = 0;
  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    // dancers deepen where they cross: multiply over the paper
    try { ctx.globalCompositeOperation = 'multiply'; } catch (e) { /* fall back to source-over */ }
    for (var i = 0; i < dancers.length; i++) drawDancer(dancers[i], t);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  // ---- run ----
  resize();
  draw(0); // deterministic first frame at phase 0, always synchronous

  var startStamp = null;
  if (typeof performance !== 'undefined' && performance.now) startStamp = performance.now();
  function frame(now) {
    if (startStamp === null) startStamp = now;
    var t = (now - startStamp) / 1000;
    gust.strength *= Math.exp(-(1 / 60) / 1.15); // momentum decay
    if (gust.strength < 0.003) gust.strength = 0;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
