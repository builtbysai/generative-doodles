<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrapuntos</title>
<style>
html, body { margin: 0; padding: 0; background: #F4EDDC; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F4EDDC';
var INDIGO = '#2C3E6B';
var OXBLOOD = '#6E1F24';
var FOREST = '#2F5233';
var GOLD = '#A67C1A';
var SEED = 1636007;
/* Frame one is at t = 12 s into the fugue: the voices are already
   mid-phrase, trails are developed, and at least one coincidence knot
   is blooming. PHASE was chosen by scanning the closed-form orbits
   for a frame with a live knot. */
var PHASE = 12;
var MEASURE = 4; /* seconds: one measure, the lifetime of a knot */
var TRAIL_N = 360, TRAIL_DT = 1 / 30; /* 12 s of trail: the weave, not stubs */
var KNOT_R = 32; /* coincidence threshold in px */
var ENVELOPE_P = 48; /* seconds: the slow shared harmonic envelope */
/* Four ink voices. Each has its own period, phase, orbit size and
   drift period, and a small fixed imperfection offset on the shared
   envelope, so no two voices ever move in unison. The forest voice
   runs counter to the others, which guarantees crossings without
   any mirroring of paths. */
var VOICES = [
  { color: INDIGO,  P: 11.3, phi: -0.19, ax: 0.40, ay: 0.38, dir:  1, pd: 31, psi: 0.6, imp:  0.00 },
  { color: OXBLOOD, P: 14.7, phi: 2.95, ax: 0.44, ay: 0.34, dir:  1, pd: 37, psi: 2.4, imp:  0.05 },
  { color: FOREST,  P: 18.9, phi: 1.11, ax: 0.37, ay: 0.42, dir: -1, pd: 43, psi: 4.1, imp: -0.04 },
  { color: GOLD,    P: 23.1, phi: 1.64, ax: 0.42, ay: 0.36, dir:  1, pd: 29, psi: 5.5, imp:  0.03 }
];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mixRgb(a, b) {
  return [Math.round((a[0] + b[0]) / 2), Math.round((a[1] + b[1]) / 2), Math.round((a[2] + b[2]) / 2)];
}
var VOICE_RGB = [hexRgb(INDIGO), hexRgb(OXBLOOD), hexRgb(FOREST), hexRgb(GOLD)];
var PAPER_RGB = hexRgb(PAPER);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Wide field: full-bleed on phones, a centred wide band on desktop
   with the page ground the piece's own warm paper. */
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var h = VH * 0.80;
  var w = Math.min(VW * 0.94, h * 1.6);
  return { x: (VW - w) / 2, y: (VH - h) / 2, w: w, h: h };
}
/* The shared harmonic envelope: a slow sine all four voices obey,
   each with its own small imperfection offset. It swells the orbits
   outward toward the edges and draws them back toward the centre. */
function envelope(t, imp) {
  return 0.5 + 0.5 * Math.sin(TAU * t / ENVELOPE_P + 0.8 + imp);
}
/* Voice position in canvas pixels at time t. Pure closed form, so
   frame one is reproducible and pausing freezes the phrase exactly. */
function voicePos(i, t, rect) {
  var v = VOICES[i];
  var E = envelope(t, v.imp);
  var th = v.dir * TAU * t / v.P + v.phi;
  var f = 0.95 - 0.55 * E;
  var rx = rect.w * v.ax * f;
  var ry = rect.h * v.ay * f;
  var cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
  var x = cx + rx * Math.cos(th) + rect.w * 0.02 * Math.sin(TAU * t / v.pd + v.psi);
  var y = cy + ry * Math.sin(th) + rect.h * 0.03 * Math.sin(TAU * t / (v.pd + 7) + v.psi * 1.7);
  return [x, y];
}
function dist(a, b) {
  var dx = a[0] - b[0], dy = a[1] - b[1];
  return Math.sqrt(dx * dx + dy * dy);
}
/* Coincidence knots: for each pair of voices, scan the last measure
   for the latest local minimum of their separation below the
   threshold. Each knot is drawn at the meeting point and fades over
   the measure. Pure function of t, so knots are deterministic and
   freeze exactly while paused. */
function findKnots(t, rect) {
  var knots = [], i, j, k, tt, d0, d1, d2;
  var step = 0.05;
  var nSteps = Math.round(MEASURE / step);
  for (i = 0; i < 4; i++) {
    for (j = i + 1; j < 4; j++) {
      var best = null;
      for (k = 0; k <= nSteps; k++) {
        tt = t - k * step;
        d1 = dist(voicePos(i, tt, rect), voicePos(j, tt, rect));
        if (d1 >= KNOT_R) continue;
        d0 = dist(voicePos(i, tt - step, rect), voicePos(j, tt - step, rect));
        d2 = dist(voicePos(i, tt + step, rect), voicePos(j, tt + step, rect));
        if (d1 <= d0 && d1 <= d2) { best = tt; break; }
      }
      if (best !== null) {
        var pa = voicePos(i, best, rect), pb = voicePos(j, best, rect);
        var age = t - best;
        knots.push({
          x: (pa[0] + pb[0]) / 2, y: (pa[1] + pb[1]) / 2,
          age: age, alpha: 0.9 * (1 - age / MEASURE),
          i: i, j: j
        });
      }
    }
  }
  return knots;
}
/* ---- pause: tap toggles a frozen state; the clock simply stops
   advancing, so the frozen frame is pixel-identical while paused,
   and resume continues the same phrase. Never a restart. ---- */
var paused = false;
var clockT = PHASE, lastTs = null;
function togglePause() {
  paused = !paused;
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', togglePause);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function drawTrails(t, rect) {
  var i, k, p0, p1, a, w;
  ctx.lineCap = 'round';
  for (i = 0; i < 4; i++) {
    for (k = TRAIL_N; k >= 1; k--) {
      p0 = voicePos(i, t - k * TRAIL_DT, rect);
      p1 = voicePos(i, t - (k - 1) * TRAIL_DT, rect);
      a = 0.9 * Math.pow(1 - k / TRAIL_N, 1.3);
      w = 0.8 + 1.6 * (1 - k / TRAIL_N);
      ctx.strokeStyle = rgba(VOICE_RGB[i], a);
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p1[0], p1[1]);
      ctx.stroke();
    }
  }
}
function drawKnots(t, rect) {
  var knots = findKnots(t, rect);
  var n, kn, mixed, r, a, ang, tx, ty, m;
  for (n = 0; n < knots.length; n++) {
    kn = knots[n];
    mixed = mixRgb(VOICE_RGB[kn.i], VOICE_RGB[kn.j]);
    a = kn.alpha;
    /* Bloom: a filled mixed-ink disc. */
    ctx.fillStyle = rgba(mixed, a);
    ctx.beginPath();
    ctx.moveTo(kn.x + 7, kn.y);
    ctx.arc(kn.x, kn.y, 7, 0, TAU);
    ctx.fill();
    /* Ring in the second voice's ink. */
    ctx.strokeStyle = rgba(VOICE_RGB[kn.j], a * 0.7);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(kn.x + 11.5, kn.y);
    ctx.arc(kn.x, kn.y, 11.5, 0, TAU);
    ctx.stroke();
    /* Four short diagonal ticks, the knot's cross-stitch. */
    ctx.strokeStyle = rgba(mixed, a * 0.85);
    ctx.lineWidth = 1.6;
    for (m = 0; m < 4; m++) {
      ang = Math.PI / 4 + m * Math.PI / 2;
      tx = Math.cos(ang); ty = Math.sin(ang);
      ctx.beginPath();
      ctx.moveTo(kn.x + tx * 14, kn.y + ty * 14);
      ctx.lineTo(kn.x + tx * 19, kn.y + ty * 19);
      ctx.stroke();
    }
  }
}
function drawHeads(t, rect) {
  var i, p;
  for (i = 0; i < 4; i++) {
    p = voicePos(i, t, rect);
    ctx.fillStyle = rgba(VOICE_RGB[i], 0.95);
    ctx.beginPath();
    ctx.moveTo(p[0] + 4.5, p[1]);
    ctx.arc(p[0], p[1], 4.5, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = rgba(PAPER_RGB, 0.9);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(p[0] + 7, p[1]);
    ctx.arc(p[0], p[1], 7, 0, TAU);
    ctx.stroke();
  }
}
function drawText(rect) {
  var titlePx = isPhone ? 18 : 20;
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var titleW = ctx.measureText('Contrapuntos').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 05').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = cxm - plateW / 2, plateY = rect.y + 10;
  ctx.fillStyle = PAPER;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(VOICE_RGB[0], 0.25);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INDIGO;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Contrapuntos', cxm, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(VOICE_RGB[0], 0.75);
  ctx.fillText('2006 · 07 · 05', cxm, plateY + 7 + titlePx + 3);
  var hint = paused ? 'Paused. Tap to resume.' : 'Tap to pause.';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = rect.y + rect.h - hintPlateH - 10;
  ctx.fillStyle = PAPER;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(VOICE_RGB[0], 0.25);
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(VOICE_RGB[0], 0.85);
  ctx.fillText(hint, cxm, hintPlateY + 7);
}
var lastT = PHASE;
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  if (!isPhone) {
    ctx.strokeStyle = rgba(VOICE_RGB[0], 0.35);
    ctx.lineWidth = 1;
    ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);
  }
  /* Faint centre mark the voices migrate toward and away from. */
  ctx.fillStyle = rgba(VOICE_RGB[0], 0.18);
  ctx.beginPath();
  ctx.moveTo(rect.x + rect.w / 2 + 3, rect.y + rect.h / 2);
  ctx.arc(rect.x + rect.w / 2, rect.y + rect.h / 2, 3, 0, TAU);
  ctx.fill();
  drawTrails(t, rect);
  drawKnots(t, rect);
  drawHeads(t, rect);
  drawText(rect);
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    voiceCount: function () { return VOICES.length; },
    voice: function (i, t) { return voicePos(i, t, compRect()); },
    knots: function (t) { return findKnots(t, compRect()); },
    knotCount: function (t) { return findKnots(t, compRect()).length; },
    isPaused: function () { return paused; },
    togglePause: function () { togglePause(); },
    clock: function () { return clockT; },
    drawAt: function (t) { draw(t); }
  };
}
/* ---- frame one: fixed phase, fixed seed, no wall clock ---- */
size();
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;
    if (!paused) clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
