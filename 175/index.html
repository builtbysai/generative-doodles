<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No.175 Plastic Spiral Moth</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #08080A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.175 Plastic Spiral Moth. A black field of interlocking
// logarithmic spirals whose radius multiplies by the plastic number
// rho = 1.3247... every quarter turn. At the centre of the largest
// spiral a moth fades in: forewings and hindwings as bezier shapes,
// filled with stippled dust (dense at the wing cores, thinning at
// the edges until it dissolves into the spiral field), with small
// plastic spirals traced in shadow across each wing. The moth
// appears; it does not move. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#08080A', SPIRAL = '#3E5C8A', WING = '#D8CFAF',
    SHADOW = '#8A7F63', COPPER = '#B87333';
var RHO = 1.324717957;
var W = 0, H = 0;
var T = 36000, OFFSET = 17000;
var seed = 20240705;
(function () {
  var m = /seed=(\d+)/.exec(location.search || '');
  if (m) seed = parseInt(m[1], 10) >>> 0;
})();

function rng(seedIn) {
  var a = seedIn >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function easeInOut(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }

// ---------- spirals -----------------------------------------------------
// arm: {cx, cy (unit frame coords), phase, a0, thMax, color, start, dur}
// radius r(th) = a0 * RHO^(th / (pi/2)); points precomputed in unit space.
var arms = [];
(function () {
  var rand = rng(seed * 7 + 1);
  function addArm(cx, cy, phase, rEnd, color, start, dur) {
    var thMax = Math.PI * 2 * 3.25;
    var a0 = rEnd / Math.pow(RHO, thMax / (Math.PI / 2));
    var pts = [], cum = [0];
    var steps = 190;
    for (var i = 0; i <= steps; i++) {
      var th = thMax * i / steps;
      var r = a0 * Math.pow(RHO, th / (Math.PI / 2));
      pts.push([cx + r * Math.cos(th + phase), cy + r * Math.sin(th + phase)]);
      if (i > 0) {
        var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
        cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
      }
    }
    arms.push({ pts: pts, cum: cum, len: cum[cum.length - 1], color: color, start: start, dur: dur });
  }
  var MC = [0.5, 0.58]; // moth / main spiral centre, unit coords
  var k;
  for (k = 0; k < 3; k++)
    addArm(MC[0], MC[1], k * 2 * Math.PI / 3 + 0.4, 0.86, SPIRAL, k * 0.5, 7.5);
  // satellite centres
  var sats = [[0.16, 0.16], [0.85, 0.14], [0.12, 0.86], [0.88, 0.84], [0.30, 0.34], [0.72, 0.40]];
  sats.forEach(function (c, ci) {
    var n = 2;
    for (k = 0; k < n; k++) {
      var col = (ci === 4 && k === 0) ? COPPER : SPIRAL;
      addArm(c[0], c[1], rand() * Math.PI * 2 + k * Math.PI, 0.20 + rand() * 0.08, col, 1 + ci * 0.9 + k * 0.4, 6.5);
    }
  });
})();

// ---------- moth -----------------------------------------------------------
// Local moth space: x right, y down, unit = S (half wingspan).
// Wing outlines as flattened bezier polygons (right side), mirrored.
function cubic(p0, p1, p2, p3, n, out) {
  for (var i = 1; i <= n; i++) {
    var t = i / n, u = 1 - t;
    out.push([
      u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]
    ]);
  }
}
function foreWing() {
  var pts = [[0.03, -0.30]];
  cubic(pts[0], [0.38, -0.52], [0.72, -0.55], [1.02, -0.46], 12, pts);
  cubic([1.02, -0.46], [0.99, -0.22], [0.94, -0.02], [0.80, 0.06], 10, pts);
  cubic([0.80, 0.06], [0.55, 0.13], [0.25, 0.11], [0.05, 0.05], 10, pts);
  return pts;
}
function hindWing() {
  var pts = [[0.04, 0.0]];
  cubic(pts[0], [0.30, 0.10], [0.55, 0.18], [0.64, 0.30], 10, pts);
  cubic([0.64, 0.30], [0.60, 0.44], [0.48, 0.50], [0.40, 0.46], 8, pts);
  cubic([0.40, 0.46], [0.30, 0.56], [0.15, 0.50], [0.05, 0.38], 10, pts);
  return pts;
}
function mirror(pts) { return pts.map(function (p) { return [-p[0], p[1]]; }).reverse(); }
var wingPolys = [
  { pts: foreWing(), core: [0.45, -0.18], fore: true },
  { pts: hindWing(), core: [0.30, 0.26], fore: false }
];
wingPolys.push({ pts: mirror(wingPolys[0].pts), core: [-0.45, -0.18], fore: true });
wingPolys.push({ pts: mirror(wingPolys[1].pts), core: [-0.30, 0.26], fore: false });

function inPoly(pts, x, y) {
  var inside = false;
  for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function distToPoly(pts, x, y) {
  var best = 1e9;
  for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    var ax = pts[j][0], ay = pts[j][1], bx = pts[i][0], by = pts[i][1];
    var dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    var tt = L2 > 0 ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L2)) : 0;
    var ex = ax + tt * dx - x, ey = ay + tt * dy - y;
    best = Math.min(best, ex * ex + ey * ey);
  }
  return Math.sqrt(best);
}

// dust per wing: {x, y, r, base, phase} plus shadow spiral tracery dots
var dust = [], tracery = [];
(function () {
  var rand = rng(seed * 13 + 5);
  wingPolys.forEach(function (wp) {
    var xs = wp.pts.map(function (p) { return p[0]; }), ys = wp.pts.map(function (p) { return p[1]; });
    var mnx = Math.min.apply(null, xs), mxx = Math.max.apply(null, xs);
    var mny = Math.min.apply(null, ys), mxy = Math.max.apply(null, ys);
    var placed = 0, guard = 0;
    while (placed < 1500 && guard++ < 30000) {
      var x = mnx + rand() * (mxx - mnx), y = mny + rand() * (mxy - mny);
      var inside = inPoly(wp.pts, x, y);
      var dc = Math.hypot(x - wp.core[0], y - wp.core[1]);
      if (inside) {
        var pa = 0.22 + 0.78 * Math.max(0, 1 - dc / 0.85);
        if (rand() < pa) {
          dust.push({ x: x, y: y, r: 0.0022 + rand() * 0.0042, base: 0.35 + 0.65 * (1 - dc / 0.9), phase: rand() * 6.28 });
          placed++;
        }
      } else {
        var dd = distToPoly(wp.pts, x, y);
        if (dd < 0.13 && rand() < 0.5 * (1 - dd / 0.13)) {
          dust.push({ x: x, y: y, r: 0.0016 + rand() * 0.003, base: 0.3 * (1 - dd / 0.13) + 0.05, phase: rand() * 6.28 });
          placed++;
        }
      }
    }
    // tracery: two small plastic spirals per wing, kept as polylines
    for (var s = 0; s < 2; s++) {
      var cc = s === 0 ? wp.core : [wp.core[0] * 0.55, wp.core[1] * 0.4 + (wp.fore ? -0.05 : 0.08)];
      var ph = rand() * 6.28;
      var line = [];
      for (var i = 0; i <= 60; i++) {
        var th = i / 60 * Math.PI * 2 * 2.2;
        var r = 0.012 * Math.pow(RHO, th / (Math.PI / 2));
        var x2 = cc[0] + r * Math.cos(th + ph), y2 = cc[1] + r * Math.sin(th + ph);
        if (inPoly(wp.pts, x2, y2)) line.push([x2, y2]);
      }
      if (line.length > 4) tracery.push(line);
    }
  });
})();

// ---------- layout ---------------------------------------------------------
var view = { u: 100, ox: 0, oy: 0, mothS: 100, mx: 0, my: 0 };
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  view.u = Math.min(W, H); // unit frame: spirals in a min-dimension square, centred
  view.ox = (W - view.u) / 2; view.oy = (H - view.u) / 2;
  view.mothS = view.u * 0.30;
  view.mx = view.ox + 0.5 * view.u; // moth sits on the main spiral centre
  view.my = view.oy + 0.58 * view.u;
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function drawArm(arm, frac) {
  if (frac <= 0) return;
  var upto = arm.len * frac;
  ctx.beginPath();
  var started = false;
  for (var i = 0; i < arm.pts.length; i++) {
    if (arm.cum[i] > upto) {
      if (started && i > 0) {
        var f = (upto - arm.cum[i - 1]) / ((arm.cum[i] - arm.cum[i - 1]) || 1);
        var px = arm.pts[i - 1][0] + (arm.pts[i][0] - arm.pts[i - 1][0]) * f;
        var py = arm.pts[i - 1][1] + (arm.pts[i][1] - arm.pts[i - 1][1]) * f;
        ctx.lineTo(view.ox + px * view.u, view.oy + py * view.u);
      }
      break;
    }
    var X = view.ox + arm.pts[i][0] * view.u, Y = view.oy + arm.pts[i][1] * view.u;
    if (!started) { ctx.moveTo(X, Y); started = true; } else ctx.lineTo(X, Y);
  }
  ctx.strokeStyle = arm.color;
  ctx.stroke();
}

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var ts = ((now + OFFSET) % T) / 1000;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  // envelope: dim to black 24-28, dark until wrap
  var env = 1;
  if (ts >= 24 && ts < 28) env = 1 - easeInOut((ts - 24) / 4);
  else if (ts >= 28) env = 0;
  if (env <= 0) return;

  ctx.globalAlpha = env;
  ctx.lineWidth = Math.max(1.1, view.u * 0.0016);
  ctx.lineCap = 'round';
  var i;
  for (i = 0; i < arms.length; i++) {
    var arm = arms[i];
    var f = clamp01((ts - arm.start) / arm.dur);
    drawArm(arm, easeInOut(f));
  }

  // moth envelopes
  var wingA = clamp01((ts - 10) / 3.5);
  var bodyA = clamp01((ts - 11) / 3);
  var shimmer = ts >= 14 && ts < 24 ? (ts - 14) / 10 : (ts >= 24 ? 1 : 0);
  if (wingA > 0) {
    ctx.save();
    ctx.translate(view.mx, view.my);
    ctx.scale(view.mothS, view.mothS);
    // wing shadow fill
    ctx.globalAlpha = env * wingA * 0.85;
    ctx.fillStyle = SHADOW;
    wingPolys.forEach(function (wp) {
      ctx.beginPath();
      wp.pts.forEach(function (p, ix) { if (ix === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
      ctx.closePath();
      ctx.fill();
    });
    // body
    if (bodyA > 0) {
      ctx.globalAlpha = env * bodyA;
      ctx.beginPath();
      ctx.moveTo(0, -0.42);
      ctx.bezierCurveTo(0.075, -0.30, 0.06, 0.1, 0.028, 0.34);
      ctx.bezierCurveTo(0.015, 0.46, 0.008, 0.52, 0, 0.54);
      ctx.bezierCurveTo(-0.008, 0.52, -0.015, 0.46, -0.028, 0.34);
      ctx.bezierCurveTo(-0.06, 0.1, -0.075, -0.30, 0, -0.42);
      ctx.fillStyle = SHADOW;
      ctx.fill();
      // antennae
      ctx.strokeStyle = SHADOW;
      ctx.lineWidth = 0.012;
      ctx.beginPath();
      ctx.moveTo(0.01, -0.40);
      ctx.quadraticCurveTo(0.16, -0.58, 0.34, -0.62);
      ctx.moveTo(-0.01, -0.40);
      ctx.quadraticCurveTo(-0.16, -0.58, -0.34, -0.62);
      ctx.stroke();
    }
    // dust
    ctx.fillStyle = WING;
    for (i = 0; i < dust.length; i++) {
      var d = dust[i];
      var tw = 1 - shimmer * 0.3 * (0.5 + 0.5 * Math.sin(ts * 1.7 + d.phase));
      ctx.globalAlpha = env * wingA * d.base * tw;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
    // tracery: shadow spiral lines over the dust
    ctx.strokeStyle = SHADOW;
    ctx.lineWidth = 0.007;
    ctx.globalAlpha = env * wingA * 0.6;
    for (i = 0; i < tracery.length; i++) {
      var line = tracery[i];
      ctx.beginPath();
      line.forEach(function (p, ix) { if (ix === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
