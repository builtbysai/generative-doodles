<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.224 Blue Atlas Scroll</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4F1E8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.224 Blue Atlas Scroll (Kathy McTavish). A long horizontal scroll
// of thin vector-line drawings on paper white: coastline contours, a
// railway with its stations, a small bird with a suitcase (her
// broken-hero tale), equations and text fragments that dissolve as
// they pass. Thin lines only, no fills, no shading: deliberately
// low-bandwidth, an atlas of a fictional journey. The scroll drifts
// slowly left and wraps seamlessly; drag scrubs through it. All
// content is precomputed JS data, drawn directly; no offscreen canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#F4F1E8', BLUE = '#1A3A5C', RED = '#C0392B';
var W = 0, H = 0, phone = false;
var seed = 224224;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
var rand = rng(seed);
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

var SW = 2400, SH = 800;          // abstract scroll space
var T = 13.7;                     // clock offset: frame one is mid-journey
var scrollX = 72;                 // tuned so the bird rides in frame one
var SC = 1, OY = 0;

// ---- precomputed content ------------------------------------------------------------
// island contour rings from a seeded wobble field
var islands = [];
[350, 1180, 1980].forEach(function (cx, ii) {
  var cy = 225 + ii * 18, rings = [];
  [44, 82, 126].forEach(function (r) {
    var pts = [], ph1 = rand() * 6.28, ph2 = rand() * 6.28;
    for (var a = 0; a <= 40; a++) {
      var th = a / 40 * Math.PI * 2;
      var rad = r * (1 + 0.15 * Math.sin(th * 3 + ph1) + 0.09 * Math.sin(th * 5 + ph2));
      pts.push([cx + Math.cos(th) * rad * 1.25, cy + Math.sin(th) * rad * 0.78]);
    }
    rings.push(pts);
  });
  islands.push(rings);
});
// open coastlines: sums of sines with integer cycles over SW (seamless)
function coastY(x, base, a1, a2, a3, p) {
  return base + a1 * Math.sin(2 * Math.PI * 2 * x / SW + p)
             + a2 * Math.sin(2 * Math.PI * 5 * x / SW + p * 2.1)
             + a3 * Math.sin(2 * Math.PI * 11 * x / SW + p * 0.7);
}
var coastTop = [], coastBot = [];
for (var cx = 0; cx <= SW; cx += 30) {
  coastTop.push([cx, coastY(cx, 118, 48, 24, 10, 1.0)]);
  coastBot.push([cx, coastY(cx, 655, 40, 26, 12, 2.6)]);
}
// the railway: periodic ruled curve + stations
function railY(x) {
  return 438 + 40 * Math.sin(2 * Math.PI * 3 * x / SW + 0.6) + 15 * Math.sin(2 * Math.PI * 7 * x / SW);
}
var rail = [];
for (var rx = 0; rx <= SW; rx += 24) rail.push([rx, railY(rx)]);
var stations = [];
for (var si = 0; si < 8; si++) stations.push(190 + si * 295);
// the bird with a suitcase, a simple line glyph riding above the line
var BIRDX = 520;
function drawBird(bx, by) {
  ctx.beginPath();
  ctx.moveTo(bx - 30, by + 6);                       // tail
  ctx.lineTo(bx - 12, by - 2);
  ctx.quadraticCurveTo(bx + 2, by - 16, bx + 20, by - 10); // back
  ctx.quadraticCurveTo(bx + 30, by - 6, bx + 34, by - 12); // head rise
  ctx.lineTo(bx + 44, by - 8);                       // beak
  ctx.lineTo(bx + 33, by - 3);
  ctx.quadraticCurveTo(bx + 26, by + 8, bx + 8, by + 10);  // breast/belly
  ctx.quadraticCurveTo(bx - 8, by + 12, bx - 18, by + 4);
  ctx.stroke();
  ctx.beginPath();                                  // wing
  ctx.moveTo(bx - 6, by - 4);
  ctx.quadraticCurveTo(bx + 6, by - 18, bx + 18, by - 6);
  ctx.stroke();
  ctx.beginPath();                                  // eye
  ctx.arc(bx + 31, by - 8, 1.4, 0, 6.3);
  ctx.stroke();
  ctx.beginPath();                                  // leg down to the suitcase
  ctx.moveTo(bx + 10, by + 10);
  ctx.lineTo(bx + 12, by + 26);
  ctx.stroke();
  ctx.strokeRect(bx + 0, by + 26, 27, 19);           // suitcase
  ctx.beginPath();
  ctx.moveTo(bx + 7, by + 26);
  ctx.quadraticCurveTo(bx + 13.5, by + 19, bx + 20, by + 26); // handle
  ctx.moveTo(bx + 4, by + 45); ctx.lineTo(bx + 4, by + 49);   // wheels
  ctx.moveTo(bx + 23, by + 45); ctx.lineTo(bx + 23, by + 49);
  ctx.stroke();
}
// text fragments that dissolve as they pass (phase tuned for frame one)
var fragments = [
  { x: 830,  y: 176, text: 'x = counts + probabilities',   phase: 0.332 },
  { x: 1500, y: 566, text: 'p(hero departs) = 0.37',       phase: 0.0 },
  { x: 2060, y: 306, text: 'field note: the line dissolves', phase: 0.15 },
  { x: 250,  y: 596, text: 'sum of chances = 1',           phase: 0.55 },
  { x: 1760, y: 150, text: 'north is a rumour',            phase: 0.75 }
];
function hashN(n) { var s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
// sparse red annotations: content, kept solid
var notes = [
  { x: 1120, y: 330, text: 'here the coast gives up', ax: 1150, ay: 292 },
  { x: 700,  y: 520, text: 'station of the broken hero', ax: 778, ay: 470 },
  { x: 1560, y: 610, text: 'unverified', ax: 1540, ay: 580 }
];

function strokePts(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function drawContent() {
  ctx.strokeStyle = BLUE;
  ctx.lineWidth = 1.3;
  islands.forEach(function (rings) { rings.forEach(strokePts); });
  strokePts(coastTop);
  strokePts(coastBot);
  // railway + stations
  ctx.lineWidth = 1.5;
  strokePts(rail);
  ctx.lineWidth = 1.2;
  stations.forEach(function (sx) {
    var sy = railY(sx);
    ctx.beginPath();
    ctx.moveTo(sx, sy - 11); ctx.lineTo(sx, sy + 11);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(sx, sy, 4.2, 0, 6.3);
    ctx.stroke();
  });
  // bird, bobbing a breath
  ctx.lineWidth = 1.6;
  drawBird(BIRDX, railY(BIRDX) - 64 + Math.sin(T * 0.8) * 3);
  // dissolving text fragments
  ctx.fillStyle = BLUE;
  ctx.font = '16px monospace';
  fragments.forEach(function (f, fi) {
    var cyc = (T * 0.04 + f.phase) % 1;
    if (cyc > 0.8) { // dissolving: letters scatter into dots and drop
      var p = (cyc - 0.8) / 0.2;
      ctx.globalAlpha = 1;
      for (var i = 0; i < f.text.length; i++) {
        var hx = hashN(fi * 57 + i * 3 + 1), hy = hashN(fi * 91 + i * 7 + 2);
        ctx.globalAlpha = clamp(1 - p * 0.9, 0.1, 1);
        ctx.fillText(f.text[i], f.x + i * 9.6 + (hx - 0.5) * 34 * p, f.y + (hy - 0.5) * 20 * p + p * p * 16);
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.fillText(f.text, f.x, f.y);
    }
  });
  // red annotations with small pointer ticks
  ctx.strokeStyle = RED;
  ctx.fillStyle = RED;
  ctx.lineWidth = 1.1;
  ctx.font = '13px monospace';
  notes.forEach(function (n) {
    ctx.fillText(n.text, n.x, n.y);
    ctx.beginPath();
    ctx.moveTo(n.x + 4, n.y + 5);
    ctx.lineTo(n.ax, n.ay);
    ctx.stroke();
  });
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var mod = ((scrollX % SW) + SW) % SW;
  ctx.save();
  ctx.translate(0, OY);
  ctx.scale(SC, SC);
  ctx.translate(-mod, 0);
  drawContent();
  ctx.translate(SW, 0);
  drawContent();
  ctx.restore();
}

// ---- interaction: drag scrubs the scroll ----------------------------------------------
var dragging = false, lastX = 0;
canvas.addEventListener('pointerdown', function (e) { dragging = true; lastX = e.clientX || 0; });
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var x = e.clientX || 0;
  scrollX -= (x - lastX) / SC;
  lastX = x;
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  SC = W / (phone ? 500 : 1180);
  OY = (H - SH * SC) / 2;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
var lastNow = -1;
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  if (!dragging) scrollX += 13 * dt; // slow drift, about thirteen units a second
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
