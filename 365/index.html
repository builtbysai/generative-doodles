<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.365 Sandpiper Pair</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#B26A35; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.365 Sandpiper Pair (jmarie.creates).
// After Julianne Haness's "White Bedding Sandpiper": cream
// sandpipers standing in conversing pairs on a warm caramel
// ground, hand-inked in dark umber with stippled feather
// texture. The bird is one hand-authored vector (long legs,
// plump body, small head, long probing beak), drawn twice per
// pair, the two birds facing each other at tabled angles and
// scales. The stipple is a fixed seeded dot field held as JS
// data below and clipped to the body path (canvas clip, never
// an offscreen canvas). The ground carries a faint woven-line
// texture: broad flat umber thread bands whose crossings step
// darker like a plain weave, drawn in world space so
// it pans with the repeat. The only motion is the peck: in
// each pair exactly one bird dips its head, on a fixed
// staggered schedule inside the 24s master loop (dip windows
// 2s long, asserted non-overlapping), the head group rotating
// about the neck base. Frame one is drawn at the constant
// phase T = 4.6s, 0.6s into pair 0's dip, so exactly one head
// is mid-dip; the animation clock is anchored to that constant
// plus elapsed time, never a wall-clock offset. Drag pans the
// oversized repeat and the position persists on release.
// Double-tap advances the pair arrangement in a fixed table
// of three. Flat colour only: cream, umber, caramel.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CREAM = '#F1E7D2', UMBER = '#5A3A22', CARAMEL = '#B26A35';
var DW = 1280, DH = 900;
var XPERIOD = 1040, YPERIOD = 920;      // repeat tile holding 3 pairs
var LOOP = 24, DIPDUR = 2.0, MAXDIP = 0.45;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 4.6, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var arrIdx = 0;
var userPanX = 0, userPanY = 0;

// ---- fixed stipple fields (offline seeded, written as data) ---
// Body dots live in bird-local coords (body ellipse centre
// (98,-128)); head dots in head-group coords (disc centre
// (14,-28)). Drawn clipped to the body / head paths.
var STIP_A = [
    [123,-143,1.9], [123,-174,2.1], [133,-128,2.8], [44,-140,1.9], [42,-90,1.9], [79,-133,2],
    [23,-112,2.4], [110,-91,1.7], [118,-144,2.7], [143,-83,2.7], [63,-119,2.8], [165,-145,1.9],

    [163,-152,1.5], [94,-114,2.6], [15,-147,1.6], [72,-99,1.7], [143,-155,1.7], [152,-148,1.7],
    [159,-123,2.6], [26,-127,2.6], [155,-142,2], [123,-116,1.8], [41,-165,2.5], [133,-172,1.8],
    [143,-95,2.1], [105,-82,2], [116,-92,1.5], [60,-167,2.5], [117,-164,2.4], [174,-115,2.2],
    [23,-114,1.7], [117,-120,2.3], [153,-87,2.4], [69,-169,2.5], [115,-140,2.6], [35,-166,1.5],

    [161,-139,2.6], [99,-165,2.7], [63,-163,1.7], [165,-155,1.9]
  ];
var STIP_B = [
    [152,-126,2.4], [102,-111,1.9], [130,-154,2.2], [55,-167,2], [80,-157,2], [25,-100,2.3],
    [32,-134,2.1], [140,-108,2.2], [88,-97,2.6], [62,-174,1.8], [131,-103,1.9], [86,-97,2.4],
    [161,-111,2.7], [56,-145,2.1], [26,-163,2.3], [179,-119,2.4], [46,-159,2.7], [30,-118,1.8],
    [155,-87,2.4], [159,-128,2.4], [116,-135,2.4], [134,-173,2.3], [81,-146,2.4], [27,-102,1.7],
    [109,-153,1.9], [69,-160,2.1], [107,-175,1.9], [48,-125,2.5], [118,-128,1.8], [24,-124,1.8],
    [75,-149,2.3], [102,-135,2.5], [147,-116,2.7], [6,-137,2], [106,-137,2.3], [87,-81,2.2],
    [142,-105,2.4], [178,-110,2.3], [176,-152,1.6], [86,-157,1.7], [155,-124,2.6], [41,-111,2.5],
    [134,-140,2.4], [39,-112,1.6], [182,-154,2.5], [112,-108,2], [70,-112,2.8], [79,-162,2.7],
    [131,-101,1.6], [134,-105,2.7], [4,-131,2.1], [113,-84,2.4], [133,-170,2.1], [87,-115,1.8],
    [159,-161,2.5], [184,-121,1.9], [153,-106,1.9], [110,-177,2.4], [63,-169,2.2], [11,-143,2.3],
    [97,-129,2.6], [165,-111,2.3], [66,-119,2.4], [171,-123,2.6], [162,-100,2.8], [21,-124,1.6],
    [111,-100,2.5], [60,-119,1.8], [95,-121,2.2], [189,-145,2.8], [155,-93,2.1], [158,-166,2.7],
    [46,-85,2.7], [146,-127,2.3], [174,-138,1.9], [190,-121,2.7], [101,-149,2], [143,-166,2.2],
    [26,-118,2.4], [19,-157,2.1], [126,-164,1.9], [69,-99,2], [121,-144,1.5], [58,-94,1.8],
    [145,-111,2.6], [75,-175,2.6], [135,-100,1.9], [142,-101,1.9], [77,-94,2.4], [90,-131,2.3],
    [71,-176,1.5], [100,-135,2.7], [61,-109,2], [189,-128,1.8], [107,-110,1.6], [77,-89,2.5],
    [143,-171,1.5], [103,-177,2], [92,-136,2], [129,-80,2.4], [77,-92,1.8], [182,-126,1.8],
    [53,-140,2], [99,-106,1.8], [35,-124,1.8], [2,-136,2.6], [79,-170,2.6], [138,-92,2.3],
    [158,-167,2.2], [132,-126,1.8], [75,-168,2.2], [165,-133,1.9], [112,-120,2.3], [75,-152,2.5],
    [142,-108,2.3], [116,-87,2.5], [185,-109,1.7], [137,-82,2.4]
  ];
var STIP_H1 = [
    [15,-13,2], [-4,-32,2.1], [7,-32,1.6], [-3,-28,1.5], [20,-44,2.1], [25,-42,1.4],
    [8,-36,1.6], [12,-39,1.8], [0,-31,2], [16,-14,1.9], [7,-43,1.9], [14,-43,2],
    [11,-18,1.3]
  ];
var STIP_H2 = [
    [12,-41,1.4], [16,-46,2], [-3,-31,1.4], [15,-15,1.9], [20,-41,1.4], [0,-25,1.6],
    [-1,-32,1.7], [9,-15,1.7], [5,-17,2], [14,-38,1.2], [13,-16,1.3], [3,-31,1.4],
    [26,-44,1.4]
  ];

// ---- pair arrangements: 3 authored tables ---------------------
// Per pair: anchor (x, y = ground line) in tile coords, scale,
// pair tilt, gap to the second bird, its dy and the two body
// tilts, which bird dips (0 or 1) and its dip slot in the loop.
var ARR = [
  { pairs: [
    { x: 40,  y: 300, s: 0.98, tilt: 0.02,  gap: 604, dyB: 6,  tiltA: 0.03,  tiltB: -0.02, dipBird: 0, dipAt: 4.0 },
    { x: 560, y: 560, s: 0.86, tilt: -0.03, gap: 592, dyB: -4, tiltA: -0.04, tiltB: 0.03,  dipBird: 1, dipAt: 10.8 },
    { x: 180, y: 830, s: 1.06, tilt: 0.0,   gap: 618, dyB: 8,  tiltA: 0.02,  tiltB: 0.04,  dipBird: 0, dipAt: 17.6 }
  ] },
  { pairs: [
    { x: 300, y: 280, s: 0.90, tilt: -0.02, gap: 598, dyB: -6, tiltA: -0.03, tiltB: 0.02,  dipBird: 1, dipAt: 2.2 },
    { x: 60,  y: 590, s: 1.02, tilt: 0.03,  gap: 610, dyB: 5,  tiltA: 0.04,  tiltB: -0.03, dipBird: 0, dipAt: 9.4 },
    { x: 520, y: 845, s: 0.92, tilt: -0.01, gap: 590, dyB: -8, tiltA: -0.02, tiltB: -0.04, dipBird: 1, dipAt: 16.2 }
  ] },
  { pairs: [
    { x: 120, y: 340, s: 1.10, tilt: 0.03,  gap: 622, dyB: 4,  tiltA: -0.02, tiltB: 0.03,  dipBird: 0, dipAt: 6.5 },
    { x: 620, y: 610, s: 0.94, tilt: -0.02, gap: 600, dyB: -6, tiltA: 0.03,  tiltB: -0.02, dipBird: 1, dipAt: 13.9 },
    { x: 240, y: 860, s: 0.88, tilt: 0.01,  gap: 588, dyB: 6,  tiltA: -0.04, tiltB: 0.02,  dipBird: 0, dipAt: 20.3 }
  ] }
];
(function () {
  var a, i, pr;
  if (ARR.length !== 3) throw new Error('need exactly 3 arrangements');
  if (STIP_A.length !== 118 || STIP_B.length !== 118) throw new Error('body stipple must hold 118 dots per set');
  if (STIP_H1.length !== 13 || STIP_H2.length !== 13) throw new Error('head stipple must hold 13 dots per set');
  for (a = 0; a < ARR.length; a++) {
    if (ARR[a].pairs.length !== 3) throw new Error('each arrangement must hold exactly 3 pairs');
    for (i = 0; i < 3; i++) {
      pr = ARR[a].pairs[i];
      if (pr.dipBird !== 0 && pr.dipBird !== 1) throw new Error('exactly one bird dips per pair');
      if (pr.dipAt < 0 || pr.dipAt + DIPDUR > LOOP) throw new Error('dip window must sit inside the loop');
      if (i > 0 && pr.dipAt < ARR[a].pairs[i - 1].dipAt + DIPDUR) throw new Error('dip windows must not overlap');
    }
  }
})();

// ---- the peck ---------------------------------------------------
// Smooth sine bump over the pair's 2s window, zero elsewhere.
function dipAngle(dipAt) {
  var u = ((T - dipAt) % LOOP + LOOP) % LOOP;
  if (u >= DIPDUR) return 0;
  return MAXDIP * Math.sin(Math.PI * u / DIPDUR);
}

// ---- the bird ---------------------------------------------------
// Local coords: feet at y = 0, bird faces +x. Long legs, plump
// stippled body, small head on a neck wedge, long probing beak.
function bodyPath() {
  ctx.beginPath();
  ctx.moveTo(-16, -130);
  ctx.quadraticCurveTo(8, -176, 74, -182);
  ctx.quadraticCurveTo(150, -188, 198, -138);
  ctx.quadraticCurveTo(216, -102, 150, -84);
  ctx.quadraticCurveTo(80, -66, 18, -96);
  ctx.quadraticCurveTo(-2, -106, -10, -112);
  ctx.closePath();
}
function dots(list) {
  var i;
  ctx.fillStyle = UMBER;
  for (i = 0; i < list.length; i++) {
    ctx.beginPath();
    ctx.arc(list[i][0], list[i][1], list[i][2], 0, Math.PI * 2);
    ctx.fill();
  }
}
function leg(x0, kneeX, footX) {
  ctx.strokeStyle = UMBER;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, -84);
  ctx.lineTo(kneeX, -44);
  ctx.lineTo(footX, -4);
  ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(footX, -1);
  ctx.lineTo(footX - 16, 0);
  ctx.moveTo(footX, -1);
  ctx.lineTo(footX + 16, 0);
  ctx.moveTo(footX, -1);
  ctx.lineTo(footX + 3, -6);
  ctx.stroke();
}
function drawBird(sign, tilt, dip, bodySet, headSet) {
  ctx.save();
  ctx.scale(sign, 1);
  ctx.rotate(tilt);
  // legs first, their tops hide under the body
  leg(86, 80, 90);
  leg(128, 138, 130);
  // tail wedge behind the body, pointing back and slightly down
  ctx.fillStyle = CREAM;
  ctx.strokeStyle = UMBER;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(2, -148);
  ctx.lineTo(-40, -126);
  ctx.lineTo(-2, -110);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // body: cream fill, stipple clipped inside, umber outline
  bodyPath();
  ctx.fillStyle = CREAM;
  ctx.fill();
  ctx.save();
  bodyPath();
  ctx.clip();
  ctx.globalAlpha = 0.5;
  dots(bodySet);
  ctx.restore();
  ctx.globalAlpha = 1;
  bodyPath();
  ctx.strokeStyle = UMBER;
  ctx.lineWidth = 2.6;
  ctx.stroke();
  // wing lens with two scallop ticks
  ctx.strokeStyle = UMBER;
  ctx.lineWidth = 2.2;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  ctx.moveTo(28, -152);
  ctx.quadraticCurveTo(96, -166, 158, -138);
  ctx.quadraticCurveTo(120, -102, 52, -104);
  ctx.quadraticCurveTo(28, -122, 28, -152);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(56, -118);
  ctx.quadraticCurveTo(74, -108, 92, -114);
  ctx.moveTo(96, -112);
  ctx.quadraticCurveTo(112, -104, 128, -110);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // head group: neck wedge, head, beak; rotates about the neck
  // base (184,-142) by the dip angle, beak swinging down to peck
  ctx.save();
  ctx.translate(184, -142);
  ctx.rotate(dip);
  ctx.fillStyle = CREAM;
  ctx.beginPath();
  ctx.moveTo(-16, -14);
  ctx.lineTo(28, -16);
  ctx.lineTo(20, 18);
  ctx.lineTo(-6, 22);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(14, -28, 26, 24, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(14, -28, 26, 24, 0, 0, Math.PI * 2);
  ctx.clip();
  ctx.globalAlpha = 0.5;
  dots(headSet);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = UMBER;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.ellipse(14, -28, 26, 24, 0, 0, Math.PI * 2);
  ctx.stroke();
  // crown line and eye
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.arc(14, -28, 23.5, Math.PI * 1.12, Math.PI * 1.72);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = UMBER;
  ctx.beginPath();
  ctx.arc(22, -32, 3.6, 0, Math.PI * 2);
  ctx.fill();
  // the long probing beak, slanting gently down
  ctx.beginPath();
  ctx.moveTo(36, -34);
  ctx.lineTo(100, -18);
  ctx.lineTo(37, -24);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.restore();
}
// ---- drawing ------------------------------------------------------
function drawWeave(px, py) {
  // Woven ground: broad flat umber thread bands, horizontal at
  // alpha 0.05 and vertical at 0.04, so the crossings step
  // darker like a plain weave. Offsets wrap on the 40px pitch,
  // so the texture pans with the world and never seams.
  var step = 40, half = 20, k;
  ctx.fillStyle = UMBER;
  ctx.globalAlpha = 0.05;
  for (k = -1; k * step - (py % step) < DH + step; k++) {
    ctx.fillRect(0, k * step - (py % step), DW, half);
  }
  ctx.globalAlpha = 0.04;
  for (k = -1; k * step - (px % step) < DW + step; k++) {
    ctx.fillRect(k * step - (px % step), 0, half, DH);
  }
  ctx.globalAlpha = 1;
}
function draw() {
  var px = userPanX, py = userPanY;
  var tab = ARR[arrIdx];
  var tx, ty, i, pr, sx, sy;
  ctx.fillStyle = CARAMEL;
  ctx.fillRect(0, 0, DW, DH);
  drawWeave(px, py);
  var txMin = Math.floor((px - 820) / XPERIOD), txMax = Math.floor((px + DW + 100) / XPERIOD);
  var tyMin = Math.floor((py - 300) / YPERIOD), tyMax = Math.floor((py + DH + 300) / YPERIOD);
  for (ty = tyMin; ty <= tyMax; ty++) {
    for (tx = txMin; tx <= txMax; tx++) {
      for (i = 0; i < tab.pairs.length; i++) {
        pr = tab.pairs[i];
        sx = tx * XPERIOD + pr.x - px;
        sy = ty * YPERIOD + pr.y - py;
        if (sx < -820 || sx > DW + 100 || sy < -60 || sy > DH + 300) continue;
        ctx.save();
        ctx.translate(sx, sy);
        drawPair(pr, i);
        ctx.restore();
      }
    }
  }
}
// Draws one pair with the context already translated so the pair
// anchor (feet of bird A) sits at the origin of pair space.
function drawPair(pr, slot) {
  var dipA = pr.dipBird === 0 ? dipAngle(pr.dipAt) : 0;
  var dipB = pr.dipBird === 1 ? dipAngle(pr.dipAt) : 0;
  var bodyA = (slot + arrIdx) % 2 === 0 ? STIP_A : STIP_B;
  var bodyB = (slot + 1 + arrIdx) % 2 === 0 ? STIP_A : STIP_B;
  var headS = (slot + arrIdx) % 2 === 0 ? STIP_H1 : STIP_H2;
  ctx.save();
  ctx.scale(pr.s, pr.s);
  ctx.rotate(pr.tilt);
  ctx.fillStyle = UMBER;
  ctx.globalAlpha = 0.13;
  ctx.beginPath();
  ctx.ellipse(100, 3, 118, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(pr.gap - 96, pr.dyB + 3, 118, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  drawBird(1, pr.tiltA, dipA, bodyA, headS);
  ctx.save();
  ctx.translate(pr.gap, pr.dyB);
  drawBird(-1, pr.tiltB, dipB, bodyB, headS);
  ctx.restore();
  ctx.restore();
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag pans (persists); double-tap advances the arrangement -
var dragging = false, dragMoved = false, downX = 0, downY = 0, lastDX = 0, lastDY = 0;
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true; dragMoved = false;
  downX = p.x; downY = p.y; lastDX = p.x; lastDY = p.y;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p.x - lastDX, dy = p.y - lastDY;
  lastDX = p.x; lastDY = p.y;
  if (Math.abs(p.x - downX) + Math.abs(p.y - downY) > 8) dragMoved = true;
  if (dragMoved) {
    userPanX -= dx; userPanY -= dy;
    if (userPanX > XPERIOD) userPanX = XPERIOD;
    if (userPanX < -XPERIOD) userPanX = -XPERIOD;
    if (userPanY > YPERIOD) userPanY = YPERIOD;
    if (userPanY < -YPERIOD) userPanY = -YPERIOD;
  }
});
canvas.addEventListener('pointerup', function (e) {
  if (!dragging) return;
  dragging = false;
  if (dragMoved) return;
  var p = toDesign(e);
  var nearLast = Math.abs(p.x - lastTapX) + Math.abs(p.y - lastTapY) < 60;
  if (T - lastTapT < 0.38 && nearLast) {
    arrIdx = (arrIdx + 1) % ARR.length;
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = p.x; lastTapY = p.y;
  }
});
canvas.addEventListener('pointercancel', function () { dragging = false; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK;
