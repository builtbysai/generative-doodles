<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zippo Season</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0605; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var GROUND = '#0A0605', FLAME = '#FF7A1A', EMBER = '#8A5A33',
      GLOW = '#FFB347', LINE = '#2A1D12', CAPTION = '#9B8B7A';
  var DAYS = 240, DAY_SECONDS = 2.5, LOOP_SECONDS = DAYS * DAY_SECONDS; // 600
  var START_DAY = 50;                       // frame one: playhead at day 50
  var START_SECONDS = START_DAY * DAY_SECONDS;
  var TOTAL_FIRES = 6600, HUMAN_P = 0.40;
  var SEED = 9226600;

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- dataset: 6,600 synthesized fires over 240 days ----------
  // Daily weight: low April base, broad July peak, a mid-August front bump
  // and a June shoulder, all jittered by the seeded stream. Weights are
  // normalised and rounded so the season sums to exactly 6,600 fires.
  var rng = mulberry32(SEED);
  var weights = [], wSum = 0, d;
  for (d = 0; d < DAYS; d++) {
    var g1 = Math.exp(-Math.pow((d - 105) / 38, 2));
    var g2 = Math.exp(-Math.pow((d - 150) / 16, 2));
    var g3 = Math.exp(-Math.pow((d - 62) / 20, 2));
    var w = (0.35 + 2.8 * g1 + 0.9 * g2 + 0.5 * g3) * (0.75 + 0.5 * rng());
    weights.push(w); wSum += w;
  }
  var dayCounts = [], assigned = 0, fracs = [];
  for (d = 0; d < DAYS; d++) {
    var exact = weights[d] / wSum * TOTAL_FIRES;
    var base = Math.floor(exact);
    dayCounts.push(base); assigned += base;
    fracs.push({ day: d, frac: exact - base });
  }
  fracs.sort(function (a, b) { return (b.frac - a.frac) || (a.day - b.day); });
  for (var r = 0; r < TOTAL_FIRES - assigned; r++) dayCounts[fracs[r].day]++;

  var NF = TOTAL_FIRES;
  var evDay = new Float32Array(NF);     // ignition moment in days (float)
  var evY = new Float32Array(NF);       // band-relative vertical jitter, -1..1
  var evHuman = new Uint8Array(NF);
  var evIdx = [], k = 0;
  for (d = 0; d < DAYS; d++) {
    for (var j = 0; j < dayCounts[d]; j++) {
      evDay[k] = d + rng();
      evY[k] = ((rng() + rng() + rng()) / 3) * 2 - 1;
      evHuman[k] = rng() < HUMAN_P ? 1 : 0;
      evIdx.push(k); k++;
    }
  }
  evIdx.sort(function (a, b) { return evDay[a] - evDay[b]; });
  var maxDayCount = 0;
  for (d = 0; d < DAYS; d++) if (dayCounts[d] > maxDayCount) maxDayCount = dayCounts[d];

  var MONTHS = [
    { name: 'APR', start: 0 }, { name: 'MAY', start: 30 },
    { name: 'JUN', start: 61 }, { name: 'JUL', start: 91 },
    { name: 'AUG', start: 122 }, { name: 'SEP', start: 153 },
    { name: 'OCT', start: 183 }, { name: 'NOV', start: 214 }
  ];

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : (window.innerWidth || 800);
    var h = vv ? vv.height : (window.innerHeight || 600);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(lastS); });
  }
  window.addEventListener('resize', function () { resize(); draw(lastS); });

  function layout() {
    var phone = isPhone();
    var mx = Math.max(16, W * 0.035);
    var bandH = Math.max(46, Math.min(H * 0.17, 128));
    return {
      phone: phone, mx: mx, x0: mx, x1: W - mx,
      bandY: H * 0.52, bandH: bandH,
      unit: Math.max(0.62, Math.min(1.25, Math.min(W, H) / 720)),
      legendFont: phone ? 10 : 11.5, monthFont: phone ? 9 : 10.5
    };
  }
  function dayToX(L, dayFloat) { return L.x0 + dayFloat / DAYS * (L.x1 - L.x0); }
  function xToDay(L, x) {
    var df = (x - L.x0) / (L.x1 - L.x0) * DAYS;
    return Math.max(0, Math.min(DAYS - 0.001, df));
  }

  // ---------- interaction state: recorded events only ----------
  var candidates = [];        // raw tap candidates {t, nx, ny}
  var wind = { x: 0, y: 0, t: -10, active: false };
  var drag = null;            // {nx, ny, t, moved}
  var lastS = 0;

  // Classify raw candidates into strikes (single taps, maturing after the
  // double-tap window) and pauses (double taps on a day). Pure function of
  // the recorded candidate list.
  function classify() {
    var strikes = [], pauses = [], i = 0;
    while (i < candidates.length) {
      var c = candidates[i], n = candidates[i + 1];
      if (n && (n.t - c.t) <= 0.35 &&
          Math.abs(n.nx - c.nx) < 0.09 && Math.abs(n.ny - c.ny) < 0.09) {
        pauses.push({ t: n.t, until: n.t + 4, nx: n.nx, ny: n.ny });
        i += 2;
      } else {
        strikes.push({ t: c.t + 0.35, nx: c.nx, ny: c.ny, ord: strikes.length });
        i += 1;
      }
    }
    return { strikes: strikes, pauses: pauses };
  }

  // Loop position (seconds into the 600 s season) at piece time S, with
  // double-tap pauses subtracted. Closed-form over recorded pauses.
  function loopPos(S, pauses) {
    var pos = START_SECONDS + S;
    for (var i = 0; i < pauses.length; i++) {
      var p = pauses[i];
      if (S >= p.until) pos -= (p.until - p.t);
      else if (S > p.t) { pos -= (S - p.t); break; }
      else break;
    }
    pos = pos % LOOP_SECONDS;
    if (pos < 0) pos += LOOP_SECONDS;
    return pos;
  }

  function windAt(S) {
    if (wind.active) return { x: wind.x, y: wind.y };
    var dt = S - wind.t;
    if (dt < 0) dt = 0;
    var decay = Math.exp(-dt / 1.8);
    return { x: wind.x * decay, y: wind.y * decay };
  }

  // Strike cluster layout: deterministic per strike ordinal.
  function strikeCluster(strike) {
    var r = mulberry32((SEED ^ Math.imul(strike.ord + 1, 0x9E37)) >>> 0);
    var count = 6 + Math.floor(r() * 5); // 6..10
    var glyphs = [];
    for (var i = 0; i < count; i++) {
      glyphs.push({ dx: (r() * 2 - 1) * 15, dy: (r() * 2 - 1) * 0.55, s: 0.8 + r() * 0.45 });
    }
    return glyphs;
  }

  // ---------- audio (lazy, gesture-gated, guarded) ----------
  var AC = null, masterGain = null, noiseBuf = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext :
               (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      masterGain = AC.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(AC.destination);
      var len = AC.sampleRate;
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      var data = noiseBuf.getChannelData(0);
      var ar = mulberry32(4242);
      for (var i = 0; i < len; i++) data[i] = ar() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function ting() {
    if (!AC) return;
    var t = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = 2200;
    g.gain.setValueAtTime(0.11, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.09);
  }
  function crackle() {
    if (!AC || !noiseBuf) return;
    var t = AC.currentTime;
    var src = AC.createBufferSource(); src.buffer = noiseBuf;
    src.playbackRate.value = 0.7 + Math.random() * 0.7;
    var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 0.8;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.10, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06 + Math.random() * 0.03);
    src.connect(f); f.connect(g); g.connect(masterGain);
    src.start(t, Math.random() * 0.5, 0.12); src.stop(t + 0.13);
  }
  // Schedule ignition sounds for events whose ignition moment was crossed
  // between two loop positions. Thinned: at most ~10 scheduled per call,
  // sampled evenly through dense crossings (a July front = a crackle bed).
  var lastAudioPos = START_SECONDS;
  function scheduleAudio(pos, pausesFrozen) {
    if (!AC) { lastAudioPos = pos; return; }
    var from = lastAudioPos, to = pos;
    lastAudioPos = pos;
    if (pausesFrozen || from === to) return;
    var crossed = [], i, ev;
    if (to > from) {
      for (i = 0; i < NF; i++) { ev = evIdx[i]; var it = evDay[ev] * DAY_SECONDS; if (it > from && it <= to) crossed.push(ev); }
    } else { // wrapped
      for (i = 0; i < NF; i++) { ev = evIdx[i]; var it2 = evDay[ev] * DAY_SECONDS; if (it2 > from || it2 <= to) crossed.push(ev); }
    }
    var cap = 10, step = Math.max(1, Math.floor(crossed.length / cap));
    for (i = 0; i < crossed.length; i += step) {
      if (evHuman[crossed[i]]) ting(); else crackle();
    }
    if (crossed.length > 40) { crackle(); crackle(); }
  }

  // ---------- pointer handling ----------
  function evtPos(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    var p = evtPos(e);
    drag = { nx: p.x / W, ny: p.y / H, px: p.x, py: p.y, t: lastS, moved: false, lx: p.x, ly: p.y, lt: lastS };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = evtPos(e);
    var dx = p.x - drag.px, dy = p.y - drag.py;
    if (Math.abs(p.x - drag.lx) + Math.abs(p.y - drag.ly) > 2) {
      var dt = Math.max(0.016, lastS - drag.lt);
      wind.x = Math.max(-900, Math.min(900, (p.x - drag.lx) / dt));
      wind.y = Math.max(-900, Math.min(900, (p.y - drag.ly) / dt));
      wind.t = lastS; wind.active = true;
      drag.lx = p.x; drag.ly = p.y; drag.lt = lastS;
    }
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) drag.moved = true;
  });
  function endPointer(e) {
    if (!drag) return;
    var wasDrag = drag.moved;
    if (!wasDrag && (lastS - drag.t) < 0.45) {
      candidates.push({ t: lastS, nx: drag.nx, ny: drag.ny });
    }
    wind.active = false; wind.t = lastS;
    drag = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- drawing ----------
  function flamePath(x, y, h) {
    var w = h * 0.52;
    ctx.moveTo(x, y - h);
    ctx.bezierCurveTo(x + w * 0.9, y - h * 0.45, x + w * 0.75, y - h * 0.05, x + w * 0.42, y + h * 0.18);
    ctx.quadraticCurveTo(x, y + h * 0.34, x - w * 0.42, y + h * 0.18);
    ctx.bezierCurveTo(x - w * 0.75, y - h * 0.05, x - w * 0.55, y - h * 0.5, x, y - h);
  }

  function draw(S) {
    lastS = S;
    if (!W) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var L = layout();
    var cls = classify();
    var pauses = cls.pauses;
    var pos = loopPos(S, pauses);
    var dayFloat = pos / DAY_SECONDS;
    var wv = windAt(S);
    var windMag = Math.min(1, Math.sqrt(wv.x * wv.x + wv.y * wv.y) / 650);
    var i, x, y;

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // ----- band ground and season line -----
    ctx.fillStyle = 'rgba(42,29,18,0.20)';
    ctx.fillRect(L.x0, L.bandY - L.bandH / 2, L.x1 - L.x0, L.bandH);
    ctx.strokeStyle = 'rgba(42,29,18,0.85)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(L.x0, L.bandY - L.bandH / 2); ctx.lineTo(L.x1, L.bandY - L.bandH / 2);
    ctx.moveTo(L.x0, L.bandY + L.bandH / 2); ctx.lineTo(L.x1, L.bandY + L.bandH / 2);
    ctx.moveTo(L.x0, L.bandY); ctx.lineTo(L.x1, L.bandY);
    ctx.stroke();

    // ----- density glow pools (ignited days only) -----
    var ash = pos > LOOP_SECONDS - 6 ? (LOOP_SECONDS - pos) / 6 : 1;
    ctx.fillStyle = GLOW;
    for (d = 0; d < DAYS; d++) {
      if (d >= dayFloat || dayCounts[d] < 6) continue;
      var dens = dayCounts[d] / maxDayCount;
      var rx = (L.x1 - L.x0) / DAYS * (1.1 + dens * 2.4) * (1 + windMag * 0.7);
      ctx.globalAlpha = (0.045 + 0.10 * dens) * ash;
      ctx.beginPath();
      ctx.ellipse(dayToX(L, d + 0.5) + wv.x * 0.016, L.bandY + wv.y * 0.01,
                  rx, L.bandH * 0.40, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ----- settled marks: ember pass, then flame pass -----
    var flameH = 5.4 * L.unit, embW = 4.6 * L.unit, embH = 1.7 * L.unit;
    ctx.fillStyle = EMBER;
    ctx.globalAlpha = 0.72 * ash;
    ctx.beginPath();
    for (i = 0; i < NF; i++) {
      var ign = evDay[i] * DAY_SECONDS;
      if (ign > pos || pos - ign < 0.9) continue;
      if (evHuman[i]) continue;
      x = dayToX(L, evDay[i]); y = L.bandY + evY[i] * L.bandH * 0.44;
      ctx.rect(x - embW / 2, y - embH / 2, embW, embH);
    }
    ctx.fill();
    ctx.fillStyle = FLAME;
    ctx.globalAlpha = 0.88 * ash;
    ctx.beginPath();
    for (i = 0; i < NF; i++) {
      var ign2 = evDay[i] * DAY_SECONDS;
      if (ign2 > pos || pos - ign2 < 0.9) continue;
      if (!evHuman[i]) continue;
      flamePath(dayToX(L, evDay[i]), L.bandY + evY[i] * L.bandH * 0.44, flameH);
    }
    ctx.fill();
    ctx.globalAlpha = 1;

    // ----- fresh ignitions: flare + lean -----
    for (i = 0; i < NF; i++) {
      var ign3 = evDay[i] * DAY_SECONDS;
      var age = pos - ign3;
      if (age < 0 || age >= 0.9) continue;
      var f = 1 - age / 0.9;
      x = dayToX(L, evDay[i]) + wv.x * 0.014 * f;
      y = L.bandY + evY[i] * L.bandH * 0.44;
      ctx.fillStyle = GLOW;
      ctx.globalAlpha = 0.20 * f * ash;
      ctx.beginPath();
      ctx.arc(x, y, flameH * (1.1 + f * 0.9), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = ash;
      ctx.fillStyle = evHuman[i] ? FLAME : EMBER;
      ctx.beginPath();
      if (evHuman[i]) flamePath(x, y, flameH * (1 + f * 0.7));
      else ctx.rect(x - embW * (0.5 + f * 0.5), y - embH / 2, embW * (1 + f), embH);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ----- strike clusters (visitor arson) -----
    var arson = 0;
    for (i = 0; i < cls.strikes.length; i++) {
      var st = cls.strikes[i];
      var glyphs = strikeCluster(st);
      if (st.t > S) continue;                     // not yet matured
      arson += glyphs.length;
      var stPos = loopPos(st.t, pauses);
      if (pos < stPos) continue;                  // loop has wrapped past it
      var sx = st.nx * W; // cluster glyphs ride on the band around the tap x
      var sAge = S - st.t;
      ctx.fillStyle = FLAME;
      for (var gi = 0; gi < glyphs.length; gi++) {
        var g = glyphs[gi];
        var gx = sx + g.dx * L.unit + wv.x * 0.01, gy = L.bandY + g.dy * L.bandH * 0.6;
        if (sAge < 0.9) {
          var sf = 1 - sAge / 0.9;
          ctx.fillStyle = GLOW; ctx.globalAlpha = 0.3 * sf;
          ctx.beginPath(); ctx.arc(gx, gy, flameH * 2.2 * sf + 2, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = FLAME; ctx.globalAlpha = 0.95;
          ctx.beginPath(); flamePath(gx, gy, flameH * g.s * (1 + sf * 0.6)); ctx.fill();
        } else {
          ctx.globalAlpha = 0.9 * ash;
          ctx.beginPath(); flamePath(gx, gy, flameH * g.s); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      if (sAge < 0.5) { // the Zippo spark at birth
        var spf = 1 - sAge / 0.5;
        ctx.strokeStyle = GLOW; ctx.globalAlpha = spf; ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (var ray = 0; ray < 4; ray++) {
          var a = ray * Math.PI / 2 + 0.4, rl = (4 + 7 * spf) * L.unit;
          ctx.moveTo(sx, L.bandY); ctx.lineTo(sx + Math.cos(a) * rl, L.bandY + Math.sin(a) * rl);
        }
        ctx.stroke(); ctx.globalAlpha = 1;
      }
    }

    // ----- playhead -----
    ctx.strokeStyle = 'rgba(255,179,71,0.30)';
    ctx.lineWidth = 1;
    x = dayToX(L, dayFloat);
    ctx.beginPath();
    ctx.moveTo(x, L.bandY - L.bandH / 2 - 6);
    ctx.lineTo(x, L.bandY + L.bandH / 2 + 6);
    ctx.stroke();

    // ----- months -----
    ctx.fillStyle = CAPTION;
    ctx.font = L.monthFont + 'px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (i = 0; i < MONTHS.length; i++) {
      var mend = (i + 1 < MONTHS.length) ? MONTHS[i + 1].start : DAYS;
      ctx.fillText(MONTHS[i].name, dayToX(L, (MONTHS[i].start + mend) / 2), L.bandY + L.bandH / 2 + 10);
    }

    // ----- legend (top-left) -----
    var lx = L.mx, ly = Math.max(16, H * 0.045);
    var lh = L.legendFont + 7;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = L.legendFont + 'px system-ui, sans-serif';
    ctx.fillStyle = FLAME;
    ctx.beginPath(); flamePath(lx + 5 * L.unit, ly, 5.2 * L.unit); ctx.fill();
    ctx.fillStyle = CAPTION;
    ctx.fillText('human · ting', lx + 14 * L.unit, ly);
    ctx.fillStyle = EMBER;
    ctx.fillRect(lx + 5 * L.unit - embW / 2, ly + lh - embH / 2, embW, embH);
    ctx.fillStyle = CAPTION;
    ctx.fillText('natural · crackle', lx + 14 * L.unit, ly + lh);
    ctx.fillText('1 day = 2.5 seconds', lx, ly + lh * 2);
    ctx.fillText('your fires: ' + arson, lx, ly + lh * 3);

    // ----- double-tap day count overlay -----
    for (i = 0; i < pauses.length; i++) {
      var pz = pauses[i];
      if (S >= pz.t && S < pz.until) {
        var pDay = Math.floor(xToDay(L, pz.nx * W));
        ctx.fillStyle = 'rgba(10,6,5,0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = GLOW;
        ctx.globalAlpha = 0.94;
        ctx.font = '700 ' + Math.round(Math.min(W, H) * 0.24) + 'px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(dayCounts[pDay]), W / 2, H / 2 - Math.min(W, H) * 0.03);
        ctx.globalAlpha = 1;
        ctx.fillStyle = CAPTION;
        ctx.font = L.legendFont + 2 + 'px system-ui, sans-serif';
        ctx.fillText('fires in one day', W / 2, H / 2 + Math.min(W, H) * 0.115);
      }
    }
  }

  // ---------- main loop ----------
  var tStart = null, prevPos = START_SECONDS, prevFrozen = false;
  function frame(now) {
    if (tStart === null) tStart = now;
    var S = (now - tStart) / 1000;
    var cls = classify();
    var frozen = false;
    for (var i = 0; i < cls.pauses.length; i++) {
      if (S >= cls.pauses[i].t && S < cls.pauses[i].until) frozen = true;
    }
    var pos = loopPos(S, cls.pauses);
    draw(S);
    // strike-maturation sounds
    if (AC) {
      for (var j = 0; j < cls.strikes.length; j++) {
        var st = cls.strikes[j];
        if (!st.sounded && st.t <= S) { st.sounded = true; ting(); crackle(); }
        if (st.t > S) st.sounded = false;
      }
    }
    scheduleAudio(pos, frozen);
    prevPos = pos; prevFrozen = frozen;
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  }

  resize();
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
