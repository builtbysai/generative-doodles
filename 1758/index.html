<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A System to Improvise Within</title>
<style>
html, body { margin: 0; padding: 0; background: #F4F1EA; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F4F1EA';
var PLATE = '#EAE5D8';
var PLATE_LINE = 'rgba(122,90,58,0.55)';
var TITLE_INK = '#3A3630';
var HINT_INK = '#6B6257';
var FRAME_LINE = 'rgba(138,133,128,0.6)';
var TAPE = '#7A5A3A';
var GRAPHITE = '#4A4A48';
var OXIDE = '#8A8580';
var RUST = '#A65A3C';
var JOIN_STAGGER = 6.0;
var TRAVEL = 3.0;
var HOLD = 13.0;
var EMPTY = 4.0;
var FRAME_T = 21.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function a4(v) { return Math.round(v * 10000) / 10000; }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a4(a).toFixed(4) + ')';
}
/* ---- driver: the session itself. Instruments arrive one by one from
   the margins, play together in a loose circle, then leave in reverse
   until the frame is empty again. Each instrument carries its own
   oscillator period, so the overlapping traces at the open center
   never repeat the same figure twice within a session. ---- */
var ROSTERS = [
  /* R0: the opening toolset, five instruments */
  [
    { type: 'tape',   hue: TAPE,     ang: -2.20, rad: 0.30, per: 7.3,  ph: 0.4 },
    { type: 'pulse',  hue: GRAPHITE, ang: -1.15, rad: 0.27, per: 5.1,  ph: 1.9 },
    { type: 'ribbon', hue: RUST,     ang: -0.10, rad: 0.32, per: 9.7,  ph: 3.1 },
    { type: 'coil',   hue: OXIDE,    ang: 0.95,  rad: 0.28, per: 6.4,  ph: 2.2 },
    { type: 'needle', hue: TAPE,     ang: 2.00,  rad: 0.31, per: 8.2,  ph: 0.8 }
  ],
  /* R1: four instruments, tape and ribbon lead */
  [
    { type: 'ribbon', hue: RUST,     ang: -2.40, rad: 0.29, per: 8.8,  ph: 1.1 },
    { type: 'tape',   hue: TAPE,     ang: -0.90, rad: 0.31, per: 6.9,  ph: 2.7 },
    { type: 'pulse',  hue: OXIDE,    ang: 0.60,  rad: 0.26, per: 5.7,  ph: 0.2 },
    { type: 'coil',   hue: GRAPHITE, ang: 2.10,  rad: 0.30, per: 7.9,  ph: 4.0 }
  ],
  /* R2: six instruments, the fullest set */
  [
    { type: 'pulse',  hue: GRAPHITE, ang: -2.60, rad: 0.27, per: 5.3,  ph: 0.6 },
    { type: 'tape',   hue: TAPE,     ang: -1.55, rad: 0.31, per: 7.1,  ph: 2.9 },
    { type: 'needle', hue: RUST,     ang: -0.50, rad: 0.28, per: 8.6,  ph: 1.4 },
    { type: 'ribbon', hue: OXIDE,    ang: 0.55,  rad: 0.32, per: 9.2,  ph: 3.8 },
    { type: 'coil',   hue: TAPE,     ang: 1.60,  rad: 0.26, per: 6.1,  ph: 0.9 },
    { type: 'pulse',  hue: RUST,     ang: 2.65,  rad: 0.30, per: 5.9,  ph: 2.4 }
  ],
  /* R3: five instruments, rust and graphite lead */
  [
    { type: 'coil',   hue: RUST,     ang: -2.30, rad: 0.30, per: 6.7,  ph: 1.8 },
    { type: 'needle', hue: GRAPHITE, ang: -1.20, rad: 0.27, per: 8.1,  ph: 0.3 },
    { type: 'tape',   hue: OXIDE,    ang: -0.10, rad: 0.31, per: 7.6,  ph: 2.6 },
    { type: 'pulse',  hue: TAPE,     ang: 1.00,  rad: 0.28, per: 5.4,  ph: 4.2 },
    { type: 'ribbon', hue: GRAPHITE, ang: 2.10,  rad: 0.29, per: 9.9,  ph: 1.0 }
  ],
  /* R4: four instruments, the quietest set */
  [
    { type: 'tape',   hue: OXIDE,    ang: -2.50, rad: 0.29, per: 7.8,  ph: 2.0 },
    { type: 'ribbon', hue: TAPE,     ang: -0.80, rad: 0.30, per: 9.4,  ph: 0.7 },
    { type: 'pulse',  hue: RUST,     ang: 0.90,  rad: 0.27, per: 5.6,  ph: 3.3 },
    { type: 'needle', hue: GRAPHITE, ang: 2.40,  rad: 0.31, per: 8.4,  ph: 1.6 }
  ]
];
var rosterIdx = 0;
function roster() { return ROSTERS[rosterIdx]; }
function cycleLen(n) {
  return (n - 1) * JOIN_STAGGER + TRAVEL + HOLD + (n - 1) * JOIN_STAGGER + TRAVEL + EMPTY;
}
function joinStart(i) { return i * JOIN_STAGGER; }
function leaveStart(i, n) {
  return (n - 1) * JOIN_STAGGER + TRAVEL + HOLD + (n - 1 - i) * JOIN_STAGGER;
}
/* presence 0..1 and travel progress for instrument i at session time t */
function presence(i, n, t) {
  var js = joinStart(i), ls = leaveStart(i, n);
  if (t < js) return 0;
  if (t < js + TRAVEL) return smooth((t - js) / TRAVEL);
  if (t < ls) return 1;
  if (t < ls + TRAVEL) return 1 - smooth((t - ls) / TRAVEL);
  return 0;
}
function travelPos(i, n, t) {
  var js = joinStart(i), ls = leaveStart(i, n);
  if (t < js) return 0;
  if (t < js + TRAVEL) return smooth((t - js) / TRAVEL);
  if (t < ls) return 1;
  if (t < ls + TRAVEL) return 1 - smooth((t - ls) / TRAVEL);
  return 0;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var sessionT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function center() { return { x: VW * 0.5, y: VH * 0.52 }; }
function stationPos(inst, pos, t) {
  var c = center();
  var s = Math.min(VW, VH);
  var R = inst.rad * s;
  var dx = Math.cos(inst.ang), dy = Math.sin(inst.ang);
  var edge = Math.max(VW, VH) * 0.72;
  var mx = c.x + dx * edge, my = c.y + dy * edge;
  var sx = c.x + dx * R, sy = c.y + dy * R;
  return { x: mx + (sx - mx) * pos, y: my + (sy - my) * pos, sx: sx, sy: sy };
}
function drawFrame() {
  var s = Math.min(VW, VH);
  var m = Math.round(s * 0.035);
  ctx.strokeStyle = FRAME_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(m + 0.5, m + 0.5, VW - 2 * m - 1, VH - 2 * m - 1);
}
function drawTrace(inst, st, p, t) {
  var c = center();
  var s = Math.min(VW, VH);
  var osc = Math.sin(TAU * (t / inst.per) + inst.ph);
  var osc2 = Math.cos(TAU * (t / (inst.per * 0.618)) + inst.ph * 1.7);
  var ax = st.sx, ay = st.sy;
  var mx = (ax + c.x) / 2, my = (ay + c.y) / 2;
  var al = 0.55 * p;
  ctx.strokeStyle = rgba(inst.hue, al);
  ctx.fillStyle = rgba(inst.hue, al);
  if (inst.type === 'tape') {
    var rx = s * 0.085 * (1 + 0.18 * osc);
    var ry = s * 0.055 * (1 + 0.22 * osc2);
    ctx.lineWidth = Math.max(s * 0.002, 1);
    ctx.beginPath();
    ctx.moveTo(mx + rx, my);
    ctx.ellipse(mx, my, rx, ry, 0.3 * osc, 0, TAU);
    ctx.stroke();
    ctx.lineWidth = Math.max(s * 0.0012, 0.7);
    ctx.beginPath();
    ctx.moveTo(mx + rx * 0.55, my);
    ctx.ellipse(mx, my, rx * 0.55, ry * 0.55, 0.3 * osc, 0, TAU);
    ctx.stroke();
  } else if (inst.type === 'pulse') {
    var px = c.x + (ax - c.x) * 0.28, py = c.y + (ay - c.y) * 0.28;
    var ph = ((t / inst.per) + inst.ph / TAU) % 1;
    var rr = s * (0.02 + 0.075 * ph);
    ctx.lineWidth = Math.max(s * 0.002, 1);
    ctx.beginPath();
    ctx.moveTo(px + rr, py);
    ctx.arc(px, py, rr, 0, TAU);
    ctx.stroke();
    var dot = s * 0.008 * (1 + 0.35 * osc);
    ctx.beginPath();
    ctx.moveTo(px + dot, py);
    ctx.arc(px, py, dot, 0, TAU);
    ctx.fill();
  } else if (inst.type === 'ribbon') {
    var steps = 24, i, fx, fy, bx, by;
    ctx.lineWidth = Math.max(s * 0.0022, 1);
    ctx.beginPath();
    for (i = 0; i <= steps; i++) {
      var u = i / steps;
      bx = ax + (c.x - ax) * u;
      by = ay + (c.y - ay) * u;
      var wob = Math.sin(u * Math.PI * 2.5 + TAU * (t / inst.per) + inst.ph) * s * 0.02 * (1 + 0.4 * osc2) * Math.sin(u * Math.PI);
      var nx = -(c.y - ay), ny = (c.x - ax);
      var nl = Math.sqrt(nx * nx + ny * ny) || 1;
      fx = bx + (nx / nl) * wob;
      fy = by + (ny / nl) * wob;
      if (i === 0) ctx.moveTo(fx, fy); else ctx.lineTo(fx, fy);
    }
    ctx.stroke();
  } else if (inst.type === 'coil') {
    var turns = 2.5, seg = 40, j, ca, cr;
    ctx.lineWidth = Math.max(s * 0.0018, 0.9);
    ctx.beginPath();
    for (j = 0; j <= seg; j++) {
      var v = j / seg;
      ca = v * turns * TAU + TAU * (t / (inst.per * 1.9)) + inst.ph;
      cr = s * 0.008 + v * s * 0.05;
      var cxp = mx + Math.cos(ca) * cr, cyp = my + Math.sin(ca) * cr;
      if (j === 0) ctx.moveTo(cxp, cyp); else ctx.lineTo(cxp, cyp);
    }
    ctx.stroke();
  } else if (inst.type === 'needle') {
    var sweep = Math.sin(TAU * (t / inst.per) + inst.ph) * 0.9;
    var base = Math.atan2(c.y - ay, c.x - ax);
    var len = s * 0.16;
    var tipX = ax + Math.cos(base + sweep) * len;
    var tipY = ay + Math.sin(base + sweep) * len;
    ctx.lineWidth = Math.max(s * 0.002, 1);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(tipX, tipY);
    ctx.stroke();
    var nd = s * 0.006;
    ctx.beginPath();
    ctx.moveTo(tipX + nd, tipY);
    ctx.arc(tipX, tipY, nd, 0, TAU);
    ctx.fill();
  }
}
function drawInstrument(inst, st, p, t) {
  var s = Math.min(VW, VH);
  var r = s * 0.016;
  ctx.fillStyle = rgba(inst.hue, 0.92 * p);
  ctx.beginPath();
  ctx.moveTo(st.x + r, st.y);
  ctx.arc(st.x, st.y, r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(GROUND, 0.7 * p);
  ctx.lineWidth = Math.max(s * 0.0015, 0.8);
  ctx.beginPath();
  ctx.moveTo(st.x + r * 0.55, st.y);
  ctx.arc(st.x, st.y, r * 0.55, 0, TAU);
  ctx.stroke();
  /* small type mark under the body */
  ctx.fillStyle = rgba(inst.hue, 0.75 * p);
  var my = st.y + r + s * 0.012;
  if (inst.type === 'tape') {
    ctx.beginPath();
    ctx.moveTo(st.x + r * 0.5, my);
    ctx.ellipse(st.x, my, r * 0.5, r * 0.28, 0, 0, TAU);
    ctx.fill();
  } else if (inst.type === 'pulse') {
    var pd = r * 0.22;
    ctx.beginPath();
    ctx.moveTo(st.x + pd, my);
    ctx.arc(st.x, my, pd, 0, TAU);
    ctx.fill();
  } else if (inst.type === 'ribbon') {
    ctx.fillRect(st.x - r * 0.55, my - r * 0.08, r * 1.1, r * 0.16);
  } else if (inst.type === 'coil') {
    ctx.beginPath();
    ctx.moveTo(st.x + r * 0.3, my);
    ctx.arc(st.x, my, r * 0.3, 0, TAU);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(st.x, my - r * 0.4);
    ctx.lineTo(st.x, my + r * 0.4);
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('A System to Improvise Within').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('A System to Improvise Within').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 04').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('A System to Improvise Within', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 04', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap for a new session.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawFrame();
  var insts = roster();
  var n = insts.length;
  var i, inst, p, pos, st;
  for (i = 0; i < n; i++) {
    inst = insts[i];
    p = presence(i, n, sessionT);
    if (p <= 0) continue;
    pos = travelPos(i, n, sessionT);
    st = stationPos(inst, pos, sessionT);
    drawTrace(inst, st, p, sessionT);
  }
  for (i = 0; i < n; i++) {
    inst = insts[i];
    p = presence(i, n, sessionT);
    if (p <= 0) continue;
    pos = travelPos(i, n, sessionT);
    st = stationPos(inst, pos, sessionT);
    drawInstrument(inst, st, p, sessionT);
  }
  drawPlates();
}
function newSession() {
  rosterIdx = (rosterIdx + 1) % ROSTERS.length;
  sessionT = 0;
  phaseT = 0;
  draw();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { sessionT = t; phaseT = t; draw(); },
    rosterSize: function () { return roster().length; },
    cycleLen: function () { return cycleLen(roster().length); },
    presence: function (i, t) { return presence(i, roster().length, t); },
    sessionT: function () { return sessionT; }
  };
}
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (canvas.addEventListener) {
  /* pointerdown only: adding click as well would advance two rosters per tap */
  canvas.addEventListener('pointerdown', newSession);
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      var n = roster().length;
      var cyc = cycleLen(n);
      sessionT = (FRAME_T + clockT) % cyc;
      phaseT = sessionT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
