<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№8981 · Own Lines - Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #f3ecdc;
    overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #c { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  #cap {
    position: fixed; left: 18px; bottom: 14px;
    color: #8d8171; font-size: 13px; font-style: italic;
    letter-spacing: 0.04em; user-select: none; pointer-events: none;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  #cap b { color: #6b5f4c; font-weight: normal; }
  @media (max-width: 480px) {
    #cap { font-size: 11px; left: 12px; bottom: 10px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap"></div>
<script>
"use strict";
/* ============================================================
   №8981 · OWN LINES — a Cytographia-derived line study.
   Every stroke is a hand-built vertex-shaded triangle strip:
   width is shaped per vertex by calligraphic pressure
   (taper, curvature pooling, noise rhythm). No lineWidth calls.
   One subject per seed: grass tuft, heron, wave, or bamboo.
   Ink on pale warm paper, drawn on with a gentle reveal.
   ============================================================ */

// ---------- seeded RNG ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- 1D rhythm noise (the hand's breathing) ----------
// Broad strokes get a smoother hand: high harmonics damp with width,
// the way a loaded brush moves more deliberately than a needle tip.
function makeRhythm(rand) {
  const p1 = rand() * TAU, p2 = rand() * TAU, p3 = rand() * TAU;
  // smooth=true: fundamental only — drives WIDTH (a real brush swells
  // smoothly); smooth=false: full texture — drives COLOR (ink tone varies).
  // Keeping the two decoupled stops width scallops and color bands from
  // lining up into a mechanical ribbed texture.
  return function (t, freq, w, smooth) {
    const damp = clamp(9 / (w || 6), 0.12, 1);
    let a1, a2, a3;
    if (smooth) { a1 = 0.88; a2 = 0.12 * damp; a3 = 0; }
    else { a1 = 0.62; a2 = 0.26 * damp; a3 = 0.12 * damp * damp; }
    const norm = a1 + a2 + a3;
    const s = a1 * Math.sin(t * freq * TAU + p1)
            + a2 * Math.sin(t * freq * 2.63 * TAU + p2)
            + a3 * Math.sin(t * freq * 6.17 * TAU + p3);
    return 0.5 + 0.5 * (s / norm); // 0..1
  };
}

// ---------- path helpers ----------
function bezier(p0, p1, p2, p3, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([
      u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0],
      u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]
    ]);
  }
  return pts;
}
function catmull(pts, n) { // smooth through control points
  if (pts.length < 2) return pts.slice();
  const P = [pts[0]].concat(pts, [pts[pts.length - 1]]);
  const out = [];
  for (let i = 1; i < P.length - 2; i++) {
    for (let j = 0; j < n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * (2*P[i][0] + (-P[i-1][0]+P[i+1][0])*t + (2*P[i-1][0]-5*P[i][0]+4*P[i+1][0]-P[i+2][0])*t2 + (-P[i-1][0]+3*P[i][0]-3*P[i+1][0]+P[i+2][0])*t3),
        0.5 * (2*P[i][1] + (-P[i-1][1]+P[i+1][1])*t + (2*P[i-1][1]-5*P[i][1]+4*P[i+1][1]-P[i+2][1])*t2 + (-P[i-1][1]+3*P[i][1]-3*P[i+1][1]+P[i+2][1])*t3)
      ]);
    }
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}
// resample polyline to ~step spacing
function resample(pts, step) {
  if (pts.length < 2) return pts.map(p => p.slice());
  const out = [pts[0].slice()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    let [ax, ay] = pts[i - 1], [bx, by] = pts[i];
    let d = Math.hypot(bx - ax, by - ay);
    while (acc + d >= step) {
      const need = step - acc, t = need / d;
      ax = ax + (bx - ax) * t; ay = ay + (by - ay) * t;
      out.push([ax, ay]); d = Math.hypot(bx - ax, by - ay); acc = 0;
    }
    acc += d;
  }
  const last = pts[pts.length - 1];
  if (Math.hypot(last[0] - out[out.length-1][0], last[1] - out[out.length-1][1]) > step * 0.25)
    out.push(last.slice());
  return out;
}

/* ============================================================
   STROKE ENGINE — builds vertex-shaded triangle strips.
   A stroke spec: { pts, w, taperExp, startFat, endNeedle,
                    rhythmFreq, poolGain, touchdown, ink }
   Output: { segs: [...], blobs: [...] }
   seg = { x1,y1, x2,y2, x3,y3, x4,y4, halo:[r,g,b,a], core:[r,g,b,a] }
   drawn left->right: (L_i, R_i, L_i+1, R_i+1).
   ============================================================ */
const INK = [38, 32, 26]; // warm black

function buildStrip(spec, rhythm) {
  const pts = resample(spec.pts, Math.max(1.6, (spec.w || 6) * 0.35));
  const n = pts.length;
  if (n < 2) return { segs: [], blobs: [] };
  const w0 = spec.w || 6;
  const taperExp = spec.taperExp != null ? spec.taperExp : 0.7;
  const freq = spec.rhythmFreq != null ? spec.rhythmFreq : 1.6;
  const poolGain = spec.poolGain != null ? spec.poolGain : 1.0;

  // tangents + curvature
  const tx = new Float64Array(n), ty = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    const d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    tx[i] = (b[0] - a[0]) / d; ty[i] = (b[1] - a[1]) / d;
  }
  let curv = new Float64Array(n);
  for (let i = 1; i < n - 1; i++) {
    const dth = Math.atan2(tx[i]*ty[i-1] - ty[i]*tx[i-1], tx[i]*tx[i-1] + ty[i]*ty[i-1]);
    const ds = Math.hypot(pts[i+1][0]-pts[i-1][0], pts[i+1][1]-pts[i-1][1]) || 1;
    curv[i] = Math.abs(dth) / ds;
  }
  // smooth curvature twice (box)
  for (let pass = 0; pass < 2; pass++) {
    const c2 = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0, k = 0;
      for (let j = -2; j <= 2; j++) { const m = clamp(i + j, 0, n - 1); s += curv[m]; k++; }
      c2[i] = s / k;
    }
    curv = c2;
  }

  const ink = spec.ink || INK;
  const wv = new Float64Array(n), pv = new Float64Array(n), dv = new Float64Array(n);
  const rcv = new Float64Array(n);
  const colA = new Array(n), halA = new Array(n);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    // taper: swell mid, hairline at ends
    let taper = Math.pow(Math.sin(Math.PI * clamp(t, 0.0001, 0.9999)), taperExp);
    if (spec.endNeedle) taper *= Math.pow(1 - t, 0.55) * 1.9 + 0.05;
    if (spec.startFat) taper *= 1 + 1.7 * Math.exp(-t * 8);
    const rw = rhythm(t, freq, w0, true);            // smooth: shapes the width
    const rc = rhythm(t, freq, w0, false);           // textured: shades the ink
    const pool = 1 + Math.min(1.9, curv[i] * w0 * 2.2 * poolGain); // ink gathers in bends
    const pressure = taper * (0.60 + 0.62 * rw);
    wv[i] = Math.max(0.45, w0 * pressure * pool);
    pv[i] = pressure * pool;
    rcv[i] = rc;
    dv[i] = clamp(curv[i] * w0 * 2.2 * poolGain, 0, 1); // darkness from pooling
    // vertex-shaded color: pale where thin, deep where pressured/pooled,
    // with its own ink-tone texture decoupled from the width swell
    const dd = clamp(pv[i] * 0.75 + dv[i] * 0.6 + (rc - 0.5) * 0.4, 0, 1.25) / 1.25;
    const cr = lerp(ink[0] + 62, ink[0] * 0.82, dd);
    const cg = lerp(ink[1] + 56, ink[1] * 0.82, dd);
    const cb = lerp(ink[2] + 48, ink[2] * 0.82, dd);
    const ca = lerp(0.42, 0.96, clamp(pv[i], 0, 1)) * (0.75 + 0.25 * dv[i]) * (0.84 + 0.32 * rc);
    colA[i] = [cr, cg, cb, clamp(ca, 0, 1)];
    halA[i] = [cr, cg, cb, clamp(ca * 0.16, 0, 1)];
  }

  // per-vertex frames: each vertex gets ONE averaged normal and ONE pair
  // of edge points, shared exactly by its two adjacent segments — this is
  // what keeps segment joints seamless (per-segment normals leave wedge
  // gaps/overlaps that read as ribbed striping).
  const segs = [];
  const Lx = new Float64Array(n), Ly = new Float64Array(n);
  const Rx = new Float64Array(n), Ry = new Float64Array(n);
  const Hx = new Float64Array(n), Hy = new Float64Array(n);
  const Jx = new Float64Array(n), Jy = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const nx = -ty, ny = tx;
    const hw = wv[i] / 2, hh = wv[i] * 1.05;
    Lx[i] = pts[i][0] + nx * hw; Ly[i] = pts[i][1] + ny * hw;
    Rx[i] = pts[i][0] - nx * hw; Ry[i] = pts[i][1] - ny * hw;
    Hx[i] = pts[i][0] + nx * hh; Hy[i] = pts[i][1] + ny * hh;
    Jx[i] = pts[i][0] - nx * hh; Jy[i] = pts[i][1] - ny * hh;
  }
  for (let i = 0; i < n - 1; i++) {
    segs.push({
      x1: Lx[i], y1: Ly[i], x2: Rx[i], y2: Ry[i],
      x3: Lx[i+1], y3: Ly[i+1], x4: Rx[i+1], y4: Ry[i+1],
      hx1: Hx[i], hy1: Hy[i], hx2: Jx[i], hy2: Jy[i],
      hx3: Hx[i+1], hy3: Hy[i+1], hx4: Jx[i+1], hy4: Jy[i+1],
      c0: colA[i], c1: colA[i + 1], h0: halA[i], h1: halA[i + 1]
    });
  }

  // ink-pooling blobs at tight bends (suppressed with spec.noBlobs)
  const blobs = [];
  let lastBlob = -10;
  for (let i = 3; i < n - 3; i++) {
    if (!spec.noBlobs && dv[i] > 0.58 && dv[i] >= dv[i-1] && dv[i] >= dv[i+1] && i - lastBlob > 5) {
      blobs.push({ x: pts[i][0], y: pts[i][1], r: wv[i] * 0.5,
                   col: [ink[0]*0.7, ink[1]*0.7, ink[2]*0.7, 0.62] });
      lastBlob = i;
    }
  }
  if (spec.touchdown && !spec.noBlobs) {
    blobs.push({ x: pts[0][0], y: pts[0][1], r: w0 * 0.6,
                 col: [ink[0]*0.75, ink[1]*0.75, ink[2]*0.75, 0.6] });
  }
  // explicit round ink blobs (heads, eyes): bypass the taper model,
  // which pinches 2-point paths to nothing
  if (spec.headBlob) {
    const list = Array.isArray(spec.headBlob[0]) ? spec.headBlob : [spec.headBlob];
    for (const hb of list) {
      blobs.push({ x: hb[0], y: hb[1], r: hb[2], round: true,
                   col: [ink[0]*0.66, ink[1]*0.66, ink[2]*0.66, 0.93] });
    }
  }
  return { segs, blobs, spec };
}

function rgba(c) { return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${c[3].toFixed(3)})`; }
function drawSeg(ctx, s, coreOnly) {
  if (!coreOnly) {
  // halo: soft ink-bleed, gradient along the segment
  let g = ctx.createLinearGradient((s.hx1+s.hx2)/2, (s.hy1+s.hy2)/2,
                                   (s.hx3+s.hx4)/2, (s.hy3+s.hy4)/2);
  g.addColorStop(0, rgba(s.h0)); g.addColorStop(1, rgba(s.h1));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(s.hx1, s.hy1); ctx.lineTo(s.hx2, s.hy2);
  ctx.lineTo(s.hx4, s.hy4); ctx.lineTo(s.hx3, s.hy3);
  ctx.closePath(); ctx.fill();
  }
  // core: gradient from vertex i color to vertex i+1 color — no banding
  // (drawn a second time by the caller to heal antialiased joint seams)
  let g = ctx.createLinearGradient((s.x1+s.x2)/2, (s.y1+s.y2)/2,
                               (s.x3+s.x4)/2, (s.y3+s.y4)/2);
  g.addColorStop(0, rgba(s.c0)); g.addColorStop(1, rgba(s.c1));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2);
  ctx.lineTo(s.x4, s.y4); ctx.lineTo(s.x3, s.y3);
  ctx.closePath(); ctx.fill();
}
function drawBlob(ctx, b) {
  ctx.fillStyle = `rgba(${b.col[0]|0},${b.col[1]|0},${b.col[2]|0},${b.col[3]})`;
  ctx.beginPath();
  ctx.ellipse(b.x, b.y, b.r, b.round ? b.r : b.r * 0.82, 0, 0, TAU);
  ctx.fill();
}
/* ============================================================
   SUBJECTS — one flowing composition per piece.
   All coordinates in a 1000x1000 design box; scaled at draw.
   S() pushes a stroke spec into the strokes list.
   ============================================================ */
function composeGrass(strokes, rand, rhythm) {
  const tufts = 1 + (rand() < 0.55 ? 1 : 0);
  const wind = (rand() * 2 - 1);            // -1..1 wind direction
  const windAmt = 0.25 + rand() * 0.55;
  for (let k = 0; k < tufts; k++) {
    const bx = 500 + (k === 0 ? 0 : (rand() - 0.5) * 420);
    const by = 830 - k * 60 - rand() * 40;
    const blades = 13 + (rand() * 8 | 0);
    for (let i = 0; i < blades; i++) {
      const h = (0.42 + rand() * 0.5) * 620 * (k === 0 ? 1 : 0.66);
      const lean = wind * windAmt * h * (0.35 + rand() * 0.5) + (rand() - 0.5) * 130;
      const ox = bx + (rand() - 0.5) * 46;
      const p0 = [ox, by];
      const p3 = [ox + lean, by - h];
      const p1 = [ox + lean * 0.12 + (rand() - 0.5) * 30, by - h * 0.38];
      const p2 = [ox + lean * 0.62, by - h * 0.78];
      const w = (5.5 + rand() * 4.5) * (k === 0 ? 1 : 0.8);
      strokes.push({ pts: bezier(p0, p1, p2, p3, 26), w,
        taperExp: 0.62, endNeedle: true, startFat: true,
        touchdown: rand() < 0.45,
        rhythmFreq: 1.1 + rand() * 1.2, poolGain: 0.9 });
      // seed head on some tall blades
      if (rand() < 0.4 && h > 380) {
        const tip = p3, n = 3 + (rand() * 3 | 0);
        for (let g = 0; g < n; g++) {
          const a = -Math.PI / 2 + lean * 0.001 + (g - n / 2) * 0.34 + (rand() - 0.5) * 0.2;
          const L = 26 + rand() * 22;
          const gp = [tip[0] + Math.cos(a) * 8, tip[1] + Math.sin(a) * 8];
          strokes.push({ pts: [[gp[0], gp[1]],
            [gp[0] + Math.cos(a) * L * 0.55, gp[1] + Math.sin(a) * L * 0.55 - 6],
            [gp[0] + Math.cos(a) * L, gp[1] + Math.sin(a) * L - 12]],
            w: 3.2, taperExp: 0.9, endNeedle: true, rhythmFreq: 2.2, poolGain: 0.5 });
        }
      }
    }
    // ground ticks
    const gt = 5 + (rand() * 4 | 0);
    for (let i = 0; i < gt; i++) {
      const gx = bx + (rand() - 0.5) * 300, gy = by + 6 + rand() * 22;
      const L = 30 + rand() * 60;
      strokes.push({ pts: [[gx - L/2, gy], [gx, gy - 3], [gx + L/2, gy + 1]],
        w: 2.6, taperExp: 1.0, rhythmFreq: 2.5, poolGain: 0.4 });
    }
  }
  // a few wind-borne seed strokes drifting off
  const drift = 2 + (rand() * 3 | 0);
  for (let i = 0; i < drift; i++) {
    const sx = 150 + rand() * 700, sy = 180 + rand() * 320;
    const L = 40 + rand() * 60, a = wind * 0.5 + (rand() - 0.5) * 0.4;
    strokes.push({ pts: [[sx, sy], [sx + Math.cos(a)*L, sy + Math.sin(a)*L - 10]],
      w: 2.2, taperExp: 1.1, rhythmFreq: 3, poolGain: 0.3 });
  }
}

function composeHeron(strokes, rand, rhythm) {
  const cx = 500, wy = 800;                       // water line
  const pose = rand();                            // <0.4 alert, <0.75 rest, else fishing
  const dir = rand() < 0.5 ? 1 : -1;              // facing
  const X = v => cx + dir * v;                    // mirror helper
  const bodyLen = 200 + rand() * 60, bodyH = 120 + rand() * 30;
  const bx0 = -bodyLen / 2, bx1 = bodyLen / 2;    // tail .. breast (local)

  // body: one broad confident stroke, tail to breast
  const byy = wy - bodyH;
  const bp = catmull([[X(bx0 - 30), byy - 14], [X(bx0 * 0.4), byy - 30],
                      [X(bx1 * 0.5), byy - 26], [X(bx1), byy - 6]], 10);
  strokes.push({ pts: bp, w: 34 + rand() * 8, taperExp: 0.55,
    rhythmFreq: 0.9, poolGain: 1.1 });

  // tail flicks
  const tf = 2 + (rand() * 2 | 0);
  for (let i = 0; i < tf; i++) {
    const tx0 = X(bx0 - 20), ty0 = byy - 20 - i * 10;
    strokes.push({ pts: [[tx0, ty0],
      [tx0 - dir * (40 + rand()*20), ty0 - 26 - rand()*14],
      [tx0 - dir * (80 + rand()*30), ty0 - 30 - rand()*22]],
      w: 7 - i, taperExp: 0.8, endNeedle: true, rhythmFreq: 1.8, poolGain: 0.7 });
  }

  // wing feathers: layered strokes along the back
  const wf = 3 + (rand() * 2 | 0);
  for (let i = 0; i < wf; i++) {
    const f = i / wf;
    const wx0 = X(lerp(bx0 + 10, bx1 - 30, f)), wy0 = byy - 44 + i * 9;
    strokes.push({ pts: catmull([[wx0, wy0],
      [X(lerp(bx0 + 40, bx1 + 6, f)), wy0 - 12], [X(bx1 + 26 - i * 8), wy0 + 6]], 8),
      w: 9 - i * 1.6, taperExp: 0.7, endNeedle: true,
      rhythmFreq: 1.4, poolGain: 0.9 });
  }

  // neck: the S-curve, pose decides its shape (no blob dots — bends
  // swell in width instead, so pooling reads as pressure, not spots)
  let neck;
  const nb = [X(bx1 - 34), byy - 14];             // neck base buried in the breast
  if (pose < 0.4) {                              // alert: tall sine-S neck,
    // built from a sine so the curve can never kink
    const neckBase = byy - 14, neckTop = byy - 200 - rand() * 70;
    const bulge = 30 + rand() * 16;
    neck = [];
    const NN = 26;
    for (let i = 0; i <= NN; i++) {
      const f = i / NN;
      neck.push([X(bx1 - 30 + f * 52 - Math.sin(f * Math.PI) * bulge),
                 lerp(neckBase, neckTop, f)]);
    }
  } else if (pose < 0.75) {                      // resting: coiled low
    neck = catmull([nb, [X(bx1 + 60), byy - 70],
      [X(bx1 + 78), byy - 130], [X(bx1 + 30), byy - 150]], 12);
  } else {                                       // fishing: reaching down-forward
    neck = catmull([nb, [X(bx1 + 44), byy - 60],
      [X(bx1 + 96), byy - 40], [X(bx1 + 130), wy - 120]], 12);
  }
  strokes.push({ pts: neck, w: 11, taperExp: 0.62, startFat: true,
    rhythmFreq: 1.1, poolGain: 1.25, noBlobs: true });

  // head: a round ink blob where the neck ends; the beak a thin needle
  // flicked from inside it, so the joint can never notch or fork
  const hn = neck.length, hTip = neck[hn - 1], hPrev = neck[hn - 6];
  let ha = Math.atan2(hTip[1] - hPrev[1], hTip[0] - hPrev[0]);
  const headC = [hTip[0] + Math.cos(ha) * 6, hTip[1] + Math.sin(ha) * 6];
  // beak angle: follow the head, but ease back toward the facing horizontal
  // so it never stabs straight up like a party hat
  const fwd = dir > 0 ? 0 : Math.PI;
  const hd = ((ha - fwd + Math.PI * 3) % TAU) - Math.PI;
  const ba = fwd + hd * 0.45 + (rand() - 0.5) * 0.14 + 0.06 + (pose >= 0.75 ? 0.38 : 0);
  const bl = 72 + rand() * 26;
  const bTip = [headC[0] + Math.cos(ba) * bl, headC[1] + Math.sin(ba) * bl - 6];
  const ex = headC[0] + Math.cos(ba) * 5 - Math.sin(ba) * 2.5 * dir;
  const ey = headC[1] + Math.sin(ba) * 5 + Math.cos(ba) * 2.5 * dir;
  strokes.push({ pts: [headC, [(headC[0]+bTip[0])/2, (headC[1]+bTip[1])/2 - 2], bTip],
    w: 4.2, taperExp: 0.75, startFat: true, endNeedle: true,
    rhythmFreq: 2.0, poolGain: 0.4, noBlobs: true,
    headBlob: [[headC[0], headC[1], 10.5], [ex, ey, 3.2]] });

  // legs: two thin strokes to the water
  const legs = 2;
  for (let i = 0; i < legs; i++) {
    const lx = X(bx1 * 0.15 - i * 26);
    const knee = [lx + dir * (6 + rand() * 8), byy + 66 + rand() * 10];
    strokes.push({ pts: catmull([[lx, byy + 8], knee, [lx - dir * 4, wy + 4]], 8),
      w: 4.6, taperExp: 0.75, rhythmFreq: 1.3, poolGain: 1.0 });
    // toes
    for (let tI = -1; tI <= 1; tI++) {
      const fx = lx - dir * 4 + tI * 12, fy = wy + 4;
      strokes.push({ pts: [[fx, fy], [fx + tI * 10, fy + 2], [fx + tI * 20, fy + 5]],
        w: 2.6, taperExp: 1.0, endNeedle: true, rhythmFreq: 3, poolGain: 0.4 });
    }
  }

  // water: calm horizontal strokes
  const wl = 4 + (rand() * 3 | 0);
  for (let i = 0; i < wl; i++) {
    const wyy = wy + 26 + i * 30 + rand() * 12;
    const ww = 130 + rand() * 220, wx0 = cx + (rand() - 0.5) * 320;
    strokes.push({ pts: [[wx0 - ww/2, wyy], [wx0, wyy - 5], [wx0 + ww/2, wyy + 2]],
      w: 3.4, taperExp: 1.0, rhythmFreq: 1.8, poolGain: 0.5 });
  }
}

function composeWave(strokes, rand, rhythm) {
  const cx = 500, cy = 590;
  const dir = rand() < 0.5 ? 1 : -1;
  const X = v => cx + dir * v;
  const amp = 0.9 + rand() * 0.35;

  // One plunging breaker: water rises from the back, the face steepens,
  // the lip throws forward and curls down. The lip's tight bend gathers ink.
  const rise = bezier(
    [X(-440 * amp), cy + 210],
    [X(-240 * amp), cy + 190],
    [X(-40 * amp), cy + 110],
    [X(150 * amp), cy - 40 * amp], 36);
  const lip = bezier(
    [X(150 * amp), cy - 40 * amp],
    [X(300 * amp), cy - 130 * amp],
    [X(330 * amp), cy - 220 * amp],
    [X(210 * amp), cy - 205 * amp], 22);
  const throat = bezier(
    [X(210 * amp), cy - 205 * amp],
    [X(120 * amp), cy - 190 * amp],
    [X(90 * amp), cy - 130 * amp],
    [X(120 * amp), cy - 60 * amp], 18);
  strokes.push({ pts: rise.concat(lip.slice(1), throat.slice(1)), w: 16,
    taperExp: 0.55, rhythmFreq: 0.8, poolGain: 1.15, noBlobs: true });

  // inner tube echo: follows inside the curl
  const inner = bezier(
    [X(150 * amp), cy - 10 * amp],
    [X(250 * amp), cy - 110 * amp],
    [X(240 * amp), cy - 175 * amp],
    [X(150 * amp), cy - 150 * amp], 20);
  strokes.push({ pts: inner, w: 7.5, taperExp: 0.7, endNeedle: true,
    rhythmFreq: 1.2, poolGain: 1.2, noBlobs: true });

  // two swell lines behind, echoing the same curve family
  for (let e = 0; e < 2; e++) {
    const off = 95 + e * 75, wob = (rand() - 0.5) * 30;
    const p = bezier(
      [X(-420 * amp) + dir * e * 46, cy + 230 + e * 30],
      [X(-220 * amp), cy + 200 - off * 0.5 + wob],
      [X(-20 * amp), cy + 110 - off * 0.9],
      [X(140 * amp), cy - 30 * amp - off * 0.75], 30);
    strokes.push({ pts: p, w: 8.5 - e * 2.6, taperExp: 0.62,
      rhythmFreq: 1.0 + e * 0.3, poolGain: 0.8 });
  }

  // spray thrown off the lip, arcing back over the curl
  const lipTip = [X(210 * amp), cy - 205 * amp];
  const sp = 7 + (rand() * 4 | 0);
  for (let i = 0; i < sp; i++) {
    const back = dir > 0 ? 1 : -1;   // spray flies back over the wave
    const a = Math.PI + back * (0.5 + rand() * 0.7);
    const L = 45 + rand() * 85;
    const sx = lipTip[0] + (rand() - 0.5) * 70, sy = lipTip[1] + (rand() - 0.5) * 44;
    strokes.push({ pts: [[sx, sy],
      [sx + Math.cos(a) * L * 0.5, sy + Math.sin(a) * L * 0.5 - 14],
      [sx + Math.cos(a) * L, sy + Math.sin(a) * L - 30]],
      w: 4.2, taperExp: 0.9, endNeedle: true, rhythmFreq: 2.4, poolGain: 0.5 });
  }
  // droplets hung in the air off the lip: tiny comma flicks
  const dp = 9 + (rand() * 6 | 0);
  for (let i = 0; i < dp; i++) {
    const dx = lipTip[0] - dir * rand() * 200 + (rand() - 0.5) * 60;
    const dy = lipTip[1] - rand() * 150 - 10;
    strokes.push({ pts: [[dx, dy], [dx + 2.5, dy - 4], [dx + 5, dy - 1.5]],
      w: 3.6, taperExp: 1.1, rhythmFreq: 3, poolGain: 0.3, noBlobs: true });
  }
  // foam wash at the base
  const fb = 3 + (rand() * 2 | 0);
  for (let i = 0; i < fb; i++) {
    const fy = cy + 260 + i * 32 + rand() * 10;
    const fw = 220 + rand() * 240, fx = cx + (rand() - 0.5) * 200;
    strokes.push({ pts: [[fx - fw/2, fy], [fx, fy - 7], [fx + fw/2, fy + 3]],
      w: 4, taperExp: 1.0, rhythmFreq: 1.6, poolGain: 0.5 });
  }
}

function composeBamboo(strokes, rand, rhythm) {
  const bx = 460 + (rand() - 0.5) * 120, base = 880;
  const lean = (rand() - 0.5) * 120;
  const segsN = 3 + (rand() * 2 | 0);
  const segH = (560 + rand() * 80) / segsN;
  let px = bx, py = base;

  for (let s = 0; s < segsN; s++) {
    const nx = px + lean / segsN + (rand() - 0.5) * 14;
    const ny = py - segH;
    const midx = (px + nx) / 2 + (rand() - 0.5) * 10;
    strokes.push({ pts: [[px, py], [midx, (py + ny) / 2], [nx, ny]],
      w: 12.5 - s * 1.2, taperExp: 0.28, rhythmFreq: 1.1, poolGain: 0.7 });
    // joint ring
    strokes.push({ pts: [[nx - 17, ny + 2], [nx, ny - 2], [nx + 17, ny + 2]],
      w: 4.2, taperExp: 1.0, rhythmFreq: 2.6, poolGain: 0.6 });
    strokes.push({ pts: [[nx - 17, ny + 9], [nx, ny + 5], [nx + 17, ny + 9]],
      w: 2.8, taperExp: 1.0, rhythmFreq: 2.6, poolGain: 0.5 });
    // leaf clusters at the top two joints
    if (s >= segsN - 2) {
      const leaves = 4 + (rand() * 3 | 0);
      for (let l = 0; l < leaves; l++) {
        const a = -Math.PI / 2 + (l - leaves / 2) * 0.42 + (rand() - 0.5) * 0.24;
        const L = 90 + rand() * 110;
        const lx = nx + (rand() - 0.5) * 10, ly = ny + (rand() - 0.5) * 8;
        const txp = lx + Math.cos(a) * L, typ = ly + Math.sin(a) * L * 0.9 - 14;
        strokes.push({ pts: catmull([[lx, ly],
          [lx + Math.cos(a) * L * 0.45, ly + Math.sin(a) * L * 0.4 - 6],
          [txp, typ]], 6),
          w: 9.5, taperExp: 0.6, endNeedle: true, startFat: true,
          rhythmFreq: 1.5, poolGain: 1.0 });
      }
    }
    px = nx; py = ny;
  }
  // a thinner companion stalk
  if (rand() < 0.7) {
    const cx2 = bx + 130 + rand() * 60, b2 = base + 10;
    const h2 = 260 + rand() * 120, lean2 = lean * 0.4 + 40;
    strokes.push({ pts: [[cx2, b2], [cx2 + lean2 * 0.4, b2 - h2 * 0.5],
      [cx2 + lean2, b2 - h2]], w: 7.5, taperExp: 0.8,
      rhythmFreq: 1.3, poolGain: 0.7 });
    const lv = 3 + (rand() * 2 | 0);
    for (let l = 0; l < lv; l++) {
      const a = -Math.PI / 2 + (l - lv / 2) * 0.5 + (rand() - 0.5) * 0.2;
      const L = 60 + rand() * 60;
      const lx = cx2 + lean2, ly = b2 - h2;
      strokes.push({ pts: [[lx, ly],
        [lx + Math.cos(a) * L * 0.6, ly + Math.sin(a) * L * 0.55 - 8]],
        w: 6, taperExp: 0.7, endNeedle: true, rhythmFreq: 1.8, poolGain: 0.8 });
    }
  }
  // ground tick
  strokes.push({ pts: [[bx - 130, base + 14], [bx + 40, base + 8], [bx + 170, base + 16]],
    w: 3, taperExp: 1.0, rhythmFreq: 2.2, poolGain: 0.4 });
}

// small vermilion seal, bottom-right — a nod to the form
function composeSeal(strokes, rand, cx, cy, s) {
  // seal body drawn as four thin strokes (outline) so it stays "lines"
  const x0 = cx - s/2, y0 = cy - s/2, x1 = cx + s/2, y1 = cy + s/2;
  const red = [178, 62, 40];
  const mk = (p0, p1) => ({ pts: [p0, [(p0[0]+p1[0])/2, (p0[1]+p1[1])/2], p1],
    w: 4.5, taperExp: 1.4, rhythmFreq: 2.8, poolGain: 0.2, ink: red });
  strokes.push(mk([x0, y0], [x1, y0]), mk([x1, y0], [x1, y1]),
               mk([x1, y1], [x0, y1]), mk([x0, y1], [x0, y0]));
  // two asemic glyph strokes inside, in paper color
  const pc = [243, 236, 220];
  strokes.push({ pts: [[cx - s*0.2, cy - s*0.22], [cx + s*0.18, cy - s*0.05], [cx - s*0.1, cy + s*0.24]],
    w: 4, taperExp: 1.0, rhythmFreq: 2.2, poolGain: 0.6, ink: pc });
  strokes.push({ pts: [[cx + s*0.24, cy - s*0.2], [cx + s*0.05, cy + s*0.02], [cx + s*0.22, cy + s*0.22]],
    w: 3.6, taperExp: 1.0, rhythmFreq: 2.6, poolGain: 0.6, ink: pc });
}
/* ============================================================
   PAPER + COMPOSITION + REVEAL
   ============================================================ */
const canvas = document.getElementById('c');
const cap = document.getElementById('cap');
const dctx = canvas.getContext('2d');
const paper = document.createElement('canvas');
const pctx = paper.getContext('2d');

let W = 0, H = 0, DPR = 1;
let built = [];          // { strip, delay, dur, drawn, blobDrawn }
let revealStart = 0, rafId = 0, done = false;
let seed = 8981;
let subjectName = '';

function makeGrain(rand) {
  const t = document.createElement('canvas');
  t.width = t.height = 320;
  const g = t.getContext('2d');
  // paper fibers: tiny filled parallelograms, never stroked lines
  for (let i = 0; i < 1500; i++) {
    const x = rand() * 320, y = rand() * 320, a = rand() * TAU, l = 2 + rand() * 5;
    const wdt = 0.7 + rand() * 0.9;
    const dx = Math.cos(a) * l / 2, dy = Math.sin(a) * l / 2;
    const px = -dy / l * wdt, py = dx / l * wdt;
    g.fillStyle = rand() < 0.5 ? 'rgba(120,100,70,0.055)' : 'rgba(255,255,250,0.06)';
    g.beginPath();
    g.moveTo(x - dx + px, y - dy + py); g.lineTo(x + dx + px, y + dy + py);
    g.lineTo(x + dx - px, y + dy - py); g.lineTo(x - dx - px, y - dy - py);
    g.closePath(); g.fill();
  }
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = rand() < 0.5 ? 'rgba(110,90,60,0.05)' : 'rgba(255,255,255,0.05)';
    g.fillRect(rand() * 320, rand() * 320, 1, 1);
  }
  return t;
}
let grainTile = null;

function paintPaper(rand) {
  pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  pctx.fillStyle = '#f3ecdc';
  pctx.fillRect(0, 0, W, H);
  // warm blotches: a few huge soft radial washes
  for (let i = 0; i < 7; i++) {
    const x = rand() * W, y = rand() * H, r = (0.25 + rand() * 0.4) * Math.max(W, H);
    const gr = pctx.createRadialGradient(x, y, 0, x, y, r);
    const warm = rand() < 0.5;
    gr.addColorStop(0, warm ? 'rgba(214,188,140,0.10)' : 'rgba(200,190,170,0.08)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    pctx.fillStyle = gr;
    pctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // grain
  if (!grainTile) grainTile = makeGrain(mulberry32(1234567));
  const pat = pctx.createPattern(grainTile, 'repeat');
  pctx.globalAlpha = 0.9;
  pctx.fillStyle = pat;
  pctx.fillRect(0, 0, W, H);
  pctx.globalAlpha = 1;
  // vignette
  const vg = pctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.42, W/2, H/2, Math.max(W,H)*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(112,84,48,0.13)');
  pctx.fillStyle = vg;
  pctx.fillRect(0, 0, W, H);
}

function build(newSeed) {
  seed = newSeed >>> 0;
  const rand = mulberry32(seed);
  const rhythm = makeRhythm(mulberry32(seed ^ 0x9e3779b9));
  const specs = [];
  const pick = rand();
  const names = ['grass', 'heron', 'wave', 'bamboo'];
  subjectName = names[(pick * 4) | 0];
  if (subjectName === 'grass') composeGrass(specs, rand, rhythm);
  else if (subjectName === 'heron') composeHeron(specs, rand, rhythm);
  else if (subjectName === 'wave') composeWave(specs, rand, rhythm);
  else composeBamboo(specs, rand, rhythm);

  // scale design box (1000x1000) into the viewport
  const S = Math.min(W, H) * 0.9;
  const ox = (W - 1000 * (S / 1000)) / 2, oy = (H - 1000 * (S / 1000)) / 2;
  const k = S / 1000;
  for (const sp of specs) {
    for (const p of sp.pts) { p[0] = ox + p[0] * k; p[1] = oy + p[1] * k; }
    sp.w *= k * 1.15;
    if (sp.headBlob) {
      const list = Array.isArray(sp.headBlob[0]) ? sp.headBlob : [sp.headBlob];
      for (const hb of list) {
        hb[0] = ox + hb[0] * k; hb[1] = oy + hb[1] * k; hb[2] *= k * 1.15;
      }
    }
  }
  // seal, bottom-right of the viewport
  const sealS = Math.min(W, H) * 0.052;
  const sealSpecs = [];
  composeSeal(sealSpecs, rand, W - sealS * 1.5, H - sealS * 1.6, sealS);
  specs.push(...sealSpecs);

  // build strips, assign reveal timing (longer strokes get more time)
  built = [];
  let t = 0;
  for (const sp of specs) {
    const strip = buildStrip(sp, rhythm);
    const len = strip.segs.length;
    if (!len && !strip.blobs.length) continue;
    const dur = 0.35 + Math.min(1.1, len / 90);
    built.push({ strip, delay: t, dur, drawn: 0, blobsDone: false });
    t += 0.028 + Math.min(0.09, len / 2400);
  }
  paintPaper(mulberry32(seed ^ 0x51ed));
  revealStart = performance.now();
  done = false;
  cap.innerHTML = '<b>№8981 · Own Lines</b> — ' + subjectName +
    ' study, seed ' + seed + ' · click for a new study';
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(frame);
}

function frame(now) {
  const el = (now - revealStart) / 1000;
  pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  let allDone = true;
  for (const b of built) {
    const local = clamp((el - b.delay) / b.dur, 0, 1);
    if (local <= 0) { allDone = false; continue; }
    const target = Math.floor(local * b.strip.segs.length);
    // two passes: halo+core, then core again — the second core pass heals
    // the antialiased light seams at segment joints (each joint pixel is
    // only half-covered by each adjacent quad, so one pass leaves a line)
    for (let i = b.drawn; i < target; i++) drawSeg(pctx, b.strip.segs[i], false);
    for (let i = b.drawn; i < target; i++) drawSeg(pctx, b.strip.segs[i], true);
    b.drawn = target;
    if (local >= 1 && !b.blobsDone) {
      for (const bl of b.strip.blobs) drawBlob(pctx, bl);
      b.blobsDone = true;
    }
    if (local < 1) allDone = false;
  }
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.clearRect(0, 0, canvas.width, canvas.height);
  dctx.drawImage(paper, 0, 0);
  if (!allDone) rafId = requestAnimationFrame(frame);
  else { done = true; window.__done = true; }
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  paper.width = canvas.width; paper.height = canvas.height;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
let rsT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => { resize(); build(seed); }, 220);
});
canvas.addEventListener('click', () => {
  build((Math.random() * 0xFFFFFFFF) >>> 0);
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); build((Math.random() * 0xFFFFFFFF) >>> 0); }
});

// seed override for study: ?seed=1234
const qs = new URLSearchParams(location.search);
const qseed = parseInt(qs.get('seed') || '', 10);

resize();
build(Number.isFinite(qseed) ? qseed : 2);
window.__build = build;
</script>
