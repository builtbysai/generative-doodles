<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horse, Rabbit, Ghost, Smoke</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #E8442E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  var GROUND = '#E8442E', HORSE = '#8E1F1F', INK = '#111111',
      PINK = '#F0438F', YELLOW = '#FFD400', WHITE = '#FFFFFF';

  var PHASE0 = 10.0;    // constant first-frame phase (2 blob flips already done)
  var LOOP = 28;        // shared loop clock, seconds
  var SPEED = 60;       // procession ground speed, design units / s
  var TRACK = SPEED * LOOP; // 1680: positions wrap seamlessly over one loop
  var BASE = 905;       // baseline y in the 1080 design space

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(551066);

  function mod(a, n) { return ((a % n) + n) % n; }
  // screen x of a procession slot at time t (design space)
  function trackX(slot, t) { return mod(slot - SPEED * t, TRACK) - 300; }

  // Procession slots (front to back): horse leads on the left.
  var SLOT_HORSE = 1080, SLOT_RABBIT = 1370, SLOT_GHOST = 1620;

  // ---- small canvas helpers ----
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fillStroke(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
  }
  function fatLine(x1, y1, x2, y2, wOuter, wInner, innerColor) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = wOuter;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = innerColor; ctx.lineWidth = wInner;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  // ---- rabbit kinematics (shared by the drawing and the drip schedule) ----
  function rabbitLift(t) {
    var s = Math.sin(2 * Math.PI * t); // 1 s hop period, 28 hops per loop
    return s > 0 ? 46 * Math.pow(s, 0.9) : 0;
  }
  function rabbitMouth(t) {
    return { x: trackX(SLOT_RABBIT, t) - 66, y: BASE - 56 - rabbitLift(t) };
  }

  // ---- the blob pool along the baseline ----
  var BLOBS = [];
  (function () {
    var xs = [];
    var guard = 0;
    while (xs.length < 14 && guard < 4000) {
      guard++;
      var x = 46 + rng() * 988;
      var ok = true;
      for (var i = 0; i < xs.length; i++) if (Math.abs(xs[i] - x) < 58) { ok = false; break; }
      if (ok) xs.push(x);
    }
    xs.sort(function (a, b) { return a - b; });
    for (var j = 0; j < xs.length; j++) {
      var rx = 13 + rng() * 9;
      BLOBS.push({ x: xs[j], y: BASE + 6 + rng() * 12, rx: rx, ry: rx * 0.55, flipT: -1 });
    }
  })();

  // Drip schedule: a drip lands every 4 s (7 per loop) at tc = 3.4 in its
  // cycle; each landing flips the nearest not-yet-flipped blob to white.
  // Precomputed from the analytic rabbit path, so state is a pure
  // function of t and frame one is deterministic.
  (function () {
    for (var k = 0; k < 7; k++) {
      var tLand = k * 4 + 3.4;
      if (tLand >= LOOP) break;
      var sx = rabbitMouth(k * 4 + 2.2).x;
      var best = -1, bestD = 1e9;
      for (var i = 0; i < BLOBS.length; i++) {
        if (BLOBS[i].flipT >= 0) continue;
        var d = Math.abs(BLOBS[i].x - sx);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0) BLOBS[best].flipT = tLand;
    }
  })();

  // ---- gust state (pointer-driven; 0 in frame one and in the renderer) ----
  var gust = 0;

  // ---- the horse: self-esteem, head high, never sad ----
  function drawHorse(t) {
    var phi = 2 * Math.PI * t / 1.4; // stride, 20 per loop
    ctx.save();
    ctx.scale(0.86, 0.86);
    var bob = 3 * Math.sin(2 * phi);
    // tail: black, flowing behind (rear is +x, the horse faces -x)
    ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineWidth = 17;
    ctx.beginPath();
    ctx.moveTo(92, -148 + bob);
    ctx.quadraticCurveTo(128 + 6 * Math.sin(phi * 0.5), -120 + bob, 118, -66 + bob);
    ctx.stroke();
    // far legs (diagonal pairs share phase)
    drawLeg(66, phi + Math.PI, bob);
    drawLeg(-62, phi, bob);
    // neck: a clean quad rising steeply from the chest to the high head
    ctx.beginPath();
    ctx.moveTo(-38, -148 + bob); ctx.lineTo(-90, -198 + bob);
    ctx.lineTo(-120, -170 + bob); ctx.lineTo(-76, -112 + bob);
    ctx.closePath(); fillStroke(HORSE, 6);
    // mane: a bold black crest stroked along the neck's back edge
    ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineWidth = 16;
    ctx.beginPath();
    ctx.moveTo(-97, -205 + bob);
    ctx.quadraticCurveTo(-76, -182 + bob, -44, -154 + bob);
    ctx.stroke();
    // body
    ell(0, -128 + bob, 100, 52); fillStroke(HORSE, 6);
    // near legs
    drawLeg(66, phi, bob);
    drawLeg(-62, phi + Math.PI, bob);
    // head, held high
    ctx.save();
    ctx.translate(-116, -188 + bob);
    ctx.rotate(-0.16 + 0.03 * Math.sin(phi * 0.5));
    ell(0, 0, 46, 20); fillStroke(HORSE, 6);
    ctx.beginPath(); // ear
    ctx.moveTo(15, -15); ctx.lineTo(26, -35); ctx.lineTo(32, -13);
    ctx.closePath(); fillStroke(HORSE, 5);
    ctx.beginPath(); // forelock
    ctx.moveTo(0, -17); ctx.lineTo(14, -33); ctx.lineTo(25, -15);
    ctx.closePath(); fillStroke(INK, 4);
    circ(-15, -4, 4.4); ctx.fillStyle = INK; ctx.fill(); // eye
    circ(-36, 5, 3.2); ctx.fillStyle = INK; ctx.fill();  // nostril
    ctx.restore();
    ctx.restore();
  }
  function drawLeg(pivotX, phase, bob) {
    var a = 0.55 * Math.sin(phase);
    var hx = pivotX + Math.sin(a) * 58;
    var hy = -4 - 9 * Math.max(0, Math.cos(a)) + bob * 0.4;
    fatLine(pivotX, -86 + bob, hx, hy, 15, 8.5, HORSE);
    circ(hx, hy, 6); ctx.fillStyle = INK; ctx.fill();
  }

  // ---- the rabbit: tenderness, hopping and drooling ----
  function drawRabbit(t) {
    var hop = 2 * Math.PI * t;
    var s = Math.sin(hop);
    var lift = rabbitLift(t);
    var squash = s < 0 ? 1 + 0.13 * s : 1;
    var flop = 0.38 * Math.sin(hop - 0.7);
    ctx.save();
    // hind foot
    ell(20, -8, 26, 9); fillStroke(PINK, 5);
    // tail
    circ(56, -56 - lift, 13); fillStroke(WHITE, 5);
    // body
    ctx.save();
    ctx.translate(4, -44 - lift); ctx.scale(1, squash);
    ell(0, 0, 54, 36); fillStroke(PINK, 6);
    ctx.restore();
    // front paw
    ell(-28, -16 - lift * 0.35, 13, 7); fillStroke(PINK, 4);
    // ears: long, flopping back (+x) with the hop
    ear(-38, -92 - lift, -0.55 + flop);
    ear(-52, -94 - lift, -0.85 + flop);
    // head
    circ(-46, -72 - lift, 25); fillStroke(PINK, 6);
    circ(-55, -76 - lift, 4); ctx.fillStyle = INK; ctx.fill(); // eye
    circ(-69, -66 - lift, 3); ctx.fillStyle = INK; ctx.fill(); // nose
    ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-68, -62 - lift); ctx.lineTo(-60, -58 - lift); ctx.stroke();
    ctx.restore();
  }
  function ear(bx, by, ang) {
    ctx.save();
    ctx.translate(bx, by); ctx.rotate(ang);
    ell(0, -22, 9, 24); fillStroke(PINK, 5);
    ctx.restore();
  }

  // ---- the ghost: funny sadness, always smiling, cigarette in hand ----
  function ghostBob(t) { return 9 * Math.sin(2 * Math.PI * t / 3.5 + 1); }
  function drawGhost(t) {
    var B = ghostBob(t);
    ctx.save();
    ctx.translate(0, B);
    // arm out front (faces -x), holding the cigarette low
    fatLine(-36, -52, -68, -34, 19, 12, YELLOW);
    // body: dome with a scalloped hem, floating well above the baseline
    ctx.beginPath();
    ctx.moveTo(-54, -34);
    ctx.lineTo(-54, -84);
    ctx.arc(0, -84, 54, Math.PI, 0);
    ctx.lineTo(54, -34);
    ctx.arc(36, -34, 18, 0, Math.PI, false);
    ctx.arc(0, -34, 18, 0, Math.PI, false);
    ctx.arc(-36, -34, 18, 0, Math.PI, false);
    ctx.closePath(); fillStroke(YELLOW, 6);
    // face: dot eyes and the grin that never leaves
    circ(-19, -94, 5.5); ctx.fillStyle = INK; ctx.fill();
    circ(17, -94, 5.5); ctx.fillStyle = INK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-1, -82, 17, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    // hand
    circ(-70, -32, 8.5); fillStroke(YELLOW, 5);
    // cigarette: small white cylinder pointing forward-down
    ctx.save();
    ctx.translate(-76, -28); ctx.rotate(0.18);
    ctx.fillStyle = WHITE; ctx.fillRect(-30, -3.5, 30, 7);
    ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.strokeRect(-30, -3.5, 30, 7);
    circ(-31, 0, 3); ctx.fillStyle = INK; ctx.fill();
    ctx.restore();
    ctx.restore();
  }
  // cigarette smoke: four white puffs on a 2.8 s cycle (10 per loop)
  function drawCigSmoke(t, gx) {
    var B = ghostBob(t);
    var tipX = gx - 106, tipY = BASE - 30 + B;
    for (var i = 0; i < 4; i++) {
      var age = mod(t / 2.8 + i / 4, 1);
      var swirl = 4 + gust * 22;
      var px = tipX + age * 38 + Math.sin(age * 6.5 + i) * swirl * age;
      var py = tipY - age * 74 + Math.cos(age * 5.2 + i * 1.7) * swirl * 0.6 * age;
      circ(px, py, 4.5 + age * 8.5);
      ctx.fillStyle = WHITE; ctx.fill();
    }
  }

  // ---- smoke itself: a thick white ribbon trailing behind everything ----
  function drawRibbon(t, gx) {
    var cy = BASE - 128 + ghostBob(t) * 0.5;
    var ruffle = 5 + gust * 24;
    ctx.fillStyle = WHITE;
    for (var s = 0; s <= 940; s += 18) {
      var y = cy
        + Math.sin(s * 0.016 - 2 * Math.PI * 3 * t / LOOP) * 15
        + Math.sin(s * 0.045 + 2 * Math.PI * 11 * t / LOOP) * ruffle * 0.45
        + Math.sin(s * 0.06 - 2 * Math.PI * 13 * t / LOOP) * gust * 9;
      circ(gx + 46 + s, y, 23);
      ctx.fill();
    }
  }

  // ---- blobs and the rabbit's drips ----
  function drawBlobs(t) {
    for (var i = 0; i < BLOBS.length; i++) {
      var b = BLOBS[i];
      var good = b.flipT >= 0 && t >= b.flipT;
      var sc = 1;
      if (b.flipT >= 0 && t - b.flipT >= 0 && t - b.flipT < 0.35)
        sc = 1 + 0.45 * Math.sin(Math.PI * (t - b.flipT) / 0.35);
      ctx.save();
      ctx.translate(b.x, b.y); ctx.scale(sc, sc);
      ell(0, 0, b.rx, b.ry); fillStroke(good ? WHITE : INK, 5);
      // eyes: white dots on evil black, ink dots on good white
      ctx.fillStyle = good ? INK : WHITE;
      circ(-b.rx * 0.34, -b.ry * 0.18, 2.6); ctx.fill();
      circ(b.rx * 0.34, -b.ry * 0.18, 2.6); ctx.fill();
      ctx.restore();
    }
  }
  function drawDrip(t) {
    var cyc = mod(t, 4), cycStart = t - cyc;
    var m = rabbitMouth(t);
    ctx.strokeStyle = WHITE; ctx.fillStyle = WHITE; ctx.lineCap = 'round';
    if (cyc < 2.2) {
      // bead growing on the rabbit's mouth, on a thin strand of drool
      var r = 2 + 3.5 * (cyc / 2.2);
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(m.x, m.y + 3); ctx.lineTo(m.x, m.y + 6 + r); ctx.stroke();
      circ(m.x, m.y + 7 + r, r); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    } else if (cyc < 3.4) {
      // falling, world-locked to where the mouth was when it let go
      var f0 = rabbitMouth(cycStart + 2.2);
      var p = (cyc - 2.2) / 1.2;
      var y = (f0.y + 8) + (BASE - 4 - (f0.y + 8)) * p * p;
      ell(f0.x, y, 5, 7); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
    } else if (cyc < 3.75) {
      // the landing splash, flat on the baseline
      var f1 = rabbitMouth(cycStart + 2.2);
      var q = (cyc - 3.4) / 0.35;
      ell(f1.x, BASE + 2, 12 - 4 * q, 4); ctx.fill();
    }
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is the pink-red) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      S = W;
      OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H);
      OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);
    ctx.lineJoin = 'round';

    var hx = trackX(SLOT_HORSE, t);
    var rx = trackX(SLOT_RABBIT, t);
    var gx = trackX(SLOT_GHOST, t);

    // smoke ribbon first: it trails behind everything
    drawRibbon(t, gx);

    // thin black baseline
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, BASE); ctx.lineTo(1080, BASE); ctx.stroke();

    drawBlobs(t);

    ctx.save(); ctx.translate(hx, BASE); drawHorse(t); ctx.restore();
    ctx.save(); ctx.translate(rx, BASE); drawRabbit(t); ctx.restore();
    ctx.save(); ctx.translate(gx, BASE); drawGhost(t); ctx.restore();

    drawDrip(t);
    drawCigSmoke(t, gx);

    // hint
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = WHITE;
    ctx.font = '26px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('drag', 1062, 1064);
    ctx.restore();

    ctx.restore();
  }

  // ---- drag to stir: pointer velocity becomes a gust, settling in ~2 s ----
  var dragging = false, lastPX = null, lastPT = 0;
  function onDown(e) {
    dragging = true;
    lastPX = e.clientX; lastPT = e.timeStamp || 0;
  }
  function onMove(e) {
    if (!dragging || lastPX === null) return;
    var now = e.timeStamp || 0;
    var dt = (now - lastPT) / 1000;
    if (dt > 0.005) {
      var vx = Math.abs((e.clientX - lastPX) / dt); // px per second
      gust = Math.min(1.6, gust + vx / 1400);
      lastPX = e.clientX; lastPT = now;
    }
  }
  function onUp() { dragging = false; lastPX = null; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null, prevStamp = null;
  function frame(ts) {
    if (startStamp === null) { startStamp = ts; prevStamp = ts; }
    var dt = Math.min((ts - prevStamp) / 1000, 0.1);
    prevStamp = ts;
    gust *= Math.pow(0.35, dt); // settles over about two seconds
    if (gust < 0.001) gust = 0;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
