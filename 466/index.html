<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expectations</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #E8DCC8; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32). Fixed seeds: all load-time layout derives from them.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Interaction stream: advanced only by gestures, so the squeeze/reseed
  // sequence is itself deterministic.
  var fxRand = mulberry32(46677);

  // Palette, exactly the prompt set. Nothing else.
  var GROUND = '#E8DCC8';
  var SWEATER = '#2A2A30';
  var TROUSERS = '#3A3A40';
  var SKIN = '#E8B88A';
  var ORANGE = '#E8912D';
  var PEEL = '#D97E1F';
  var LEAF = '#5A7A3A';
  var GLASS = 'rgba(245,242,234,0.6)';
  var GLASS_EDGE = 'rgba(245,242,234,0.95)';
  var JUICE = '#F2A93B';

  // Portrait frames get a denser pile: the same mound occupies more pixels.
  var BASE_COUNT = (window.innerHeight > window.innerWidth * 1.15) ? 118 : 92;
  var pileSeed = 46602;
  var pile = [];          // normalized halves: {nx, ny, rN, type, rot, leaf, seg}
  var addedCount = 0;
  var juice = 0.07;       // fraction of glass height: one finger, caps at 0.12
  var JUICE_STEP = 0.005;
  var JUICE_CAP = 0.12;
  var falling = null;     // {sx, sy, tx, ty, r, rot, t0} in pixels while animating
  var elapsed = 0;        // seconds since load, advanced only by the rAF loop

  // Mound surface (fraction of frame height) at normalized x.
  function surfFrac(nx) {
    var d = (nx - 0.48) / 0.30;
    return 0.995 - 0.19 * Math.exp(-d * d) - 0.02 * Math.exp(-Math.pow((nx - 0.85) / 0.16, 2));
  }

  function makeHalf(rand, nx, ny) {
    return {
      nx: nx,
      ny: ny,
      rN: 0.028 + rand() * 0.017,
      type: rand() < 0.62 ? 'cut' : 'dome',
      rot: rand() * Math.PI * 2,
      leaf: rand() < 0.35,
      seg: rand() * Math.PI
    };
  }

  function buildPile(seed, count) {
    var rand = mulberry32(seed);
    pile = [];
    for (var i = 0; i < count; i++) {
      var nx = 0.03 + rand() * 0.94;
      var s = surfFrac(nx);
      var ny = s + (0.992 - s) * Math.pow(rand(), 2.4);
      pile.push(makeHalf(rand, nx, ny));
    }
    pile.sort(function (a, b) { return a.ny - b.ny; });
  }
  buildPile(pileSeed, BASE_COUNT);

  // --- Drawing ------------------------------------------------------------

  function drawLeaf(x, y, r, ang) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.ellipse(r * 0.55, 0, r * 0.62, r * 0.24, 0, 0, Math.PI * 2);
    ctx.fillStyle = LEAF;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-r * 0.1, 0);
    ctx.lineTo(r * 1.05, 0);
    ctx.strokeStyle = LEAF;
    ctx.lineWidth = Math.max(1, r * 0.09);
    ctx.stroke();
    ctx.restore();
  }

  function drawHalf(hf, w, h, S) {
    var x = hf.nx * w, y = hf.ny * h, r = hf.rN * S;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(hf.rot);
    ctx.scale(1, 0.85);
    if (hf.type === 'cut') {
      // Peel rim.
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = PEEL;
      ctx.fill();
      // Flesh.
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2);
      ctx.fillStyle = ORANGE;
      ctx.fill();
      // Radial segments.
      ctx.strokeStyle = 'rgba(217,126,31,0.55)';
      ctx.lineWidth = Math.max(1, r * 0.07);
      for (var i = 0; i < 6; i++) {
        var a = hf.seg + i * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.14, Math.sin(a) * r * 0.14);
        ctx.lineTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.13, 0, Math.PI * 2);
      ctx.fillStyle = PEEL;
      ctx.fill();
      // Squeezed dent: a peel crescent pinched into one side of the rim.
      ctx.beginPath();
      ctx.arc(r * 0.62, -r * 0.52, r * 0.34, 0, Math.PI * 2);
      ctx.fillStyle = PEEL;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(r * 0.62, -r * 0.52, r * 0.20, 0, Math.PI * 2);
      ctx.fillStyle = ORANGE;
      ctx.fill();
    } else {
      // Peel dome, face down.
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = PEEL;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-r * 0.18, -r * 0.2, r * 0.55, Math.PI * 0.9, Math.PI * 1.7);
      ctx.strokeStyle = ORANGE;
      ctx.lineWidth = Math.max(1.2, r * 0.13);
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    ctx.restore();
    if (hf.leaf) drawLeaf(x + r * 0.4, y - r * 0.85, r * 0.8, -0.5 + hf.seg);
  }

  // Figure geometry helper: design coords are fractions of figure height H,
  // origin at the feet, +x forward (the man faces right).
  function P(fx, gy, H, dx, dy) { return { x: fx + dx * H, y: gy - dy * H }; }

  function limb(pts, width, color) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  function drawFigure(w, h) {
    var H = 0.70 * h;
    var fx = 0.47 * w;
    var gy = 0.86 * h;

    // Far arm (juicer arm), behind the torso.
    limb([P(fx, gy, H, 0.02, 0.815), P(fx, gy, H, 0.13, 0.63), P(fx, gy, H, 0.298, 0.572)], H * 0.058, SWEATER);
    // Legs.
    limb([P(fx, gy, H, 0.0, 0.50), P(fx, gy, H, -0.035, 0.26), P(fx, gy, H, -0.045, 0.035)], H * 0.072, TROUSERS);
    limb([P(fx, gy, H, 0.0, 0.50), P(fx, gy, H, 0.045, 0.27), P(fx, gy, H, 0.055, 0.035)], H * 0.072, TROUSERS);
    // Shoes.
    var s1 = P(fx, gy, H, -0.02, 0.014), s2 = P(fx, gy, H, 0.08, 0.014);
    ctx.fillStyle = SWEATER;
    ctx.beginPath(); ctx.ellipse(s1.x, s1.y, H * 0.052, H * 0.016, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s2.x, s2.y, H * 0.052, H * 0.016, 0, 0, Math.PI * 2); ctx.fill();
    // Torso: flat sweater polygon.
    var torso = [
      P(fx, gy, H, -0.055, 0.83), P(fx, gy, H, 0.035, 0.855),
      P(fx, gy, H, 0.095, 0.66), P(fx, gy, H, 0.065, 0.50),
      P(fx, gy, H, -0.06, 0.50)
    ];
    ctx.beginPath();
    ctx.moveTo(torso[0].x, torso[0].y);
    for (var i = 1; i < torso.length; i++) ctx.lineTo(torso[i].x, torso[i].y);
    ctx.closePath();
    ctx.fillStyle = SWEATER;
    ctx.fill();
    ctx.strokeStyle = SWEATER;
    ctx.lineWidth = H * 0.02;
    ctx.lineJoin = 'round';
    ctx.stroke();
    // Neck and head (profile, facing right).
    var nk = P(fx, gy, H, 0.005, 0.83), nk2 = P(fx, gy, H, 0.045, 0.888);
    ctx.fillStyle = SKIN;
    ctx.fillRect(nk.x, nk2.y, nk2.x - nk.x, nk.y - nk2.y);
    var hc = P(fx, gy, H, 0.03, 0.935), hr = H * 0.072;
    ctx.beginPath(); ctx.arc(hc.x, hc.y, hr, 0, Math.PI * 2); ctx.fill();
    // Nose bump.
    var ns = P(fx, gy, H, 0.098, 0.918);
    ctx.beginPath(); ctx.arc(ns.x, ns.y, H * 0.018, 0, Math.PI * 2); ctx.fill();
    // Hair cap.
    ctx.beginPath();
    ctx.arc(hc.x - H * 0.006, hc.y - H * 0.004, hr * 0.99, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = SWEATER;
    ctx.fill();
    // Eye dot.
    var ey = P(fx, gy, H, 0.062, 0.952);
    ctx.beginPath(); ctx.arc(ey.x, ey.y, H * 0.0065, 0, Math.PI * 2); ctx.fill();

    drawJuicer(fx, gy, H);
    // Far hand over the juicer handle.
    var fh = P(fx, gy, H, 0.298, 0.572);
    ctx.beginPath(); ctx.arc(fh.x, fh.y, H * 0.027, 0, Math.PI * 2);
    ctx.fillStyle = SKIN; ctx.fill();

    drawGlass(fx, gy, H);
    // Near arm (glass arm), over the torso, hand gripping the glass.
    limb([P(fx, gy, H, 0.035, 0.82), P(fx, gy, H, 0.105, 0.655), P(fx, gy, H, 0.163, 0.745)], H * 0.06, SWEATER);
    var nh = P(fx, gy, H, 0.163, 0.745);
    ctx.beginPath(); ctx.arc(nh.x, nh.y, H * 0.028, 0, Math.PI * 2);
    ctx.fillStyle = SKIN; ctx.fill();
  }

  function drawJuicer(fx, gy, H) {
    var jx = fx + 0.235 * H, jy = gy - 0.565 * H;
    // Handle, out to the far hand.
    ctx.beginPath();
    ctx.moveTo(jx + H * 0.055, jy);
    ctx.lineTo(jx + H * 0.082, jy - H * 0.007);
    ctx.strokeStyle = '#F5F2EA';
    ctx.lineWidth = H * 0.014;
    ctx.lineCap = 'round';
    ctx.stroke();
    // Bowl.
    ctx.beginPath();
    ctx.ellipse(jx, jy, H * 0.06, H * 0.018, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#F5F2EA';
    ctx.fill();
    // Ribbed cone.
    ctx.beginPath();
    ctx.moveTo(jx - H * 0.03, jy - H * 0.004);
    ctx.quadraticCurveTo(jx - H * 0.026, jy - H * 0.042, jx, jy - H * 0.058);
    ctx.quadraticCurveTo(jx + H * 0.026, jy - H * 0.042, jx + H * 0.03, jy - H * 0.004);
    ctx.closePath();
    ctx.fillStyle = '#F5F2EA';
    ctx.fill();
    ctx.strokeStyle = 'rgba(217,126,31,0.6)';
    ctx.lineWidth = Math.max(1, H * 0.0035);
    for (var i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(jx + i * H * 0.016, jy - H * 0.006);
      ctx.quadraticCurveTo(jx + i * H * 0.013, jy - H * 0.034, jx + i * H * 0.005, jy - H * 0.052);
      ctx.stroke();
    }
    // A squeezed half riding the cone.
    ctx.save();
    ctx.translate(jx - H * 0.013, jy - H * 0.052);
    ctx.rotate(-0.5);
    ctx.scale(1, 0.85);
    var r = H * 0.03;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = PEEL; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2); ctx.fillStyle = ORANGE; ctx.fill();
    ctx.strokeStyle = 'rgba(217,126,31,0.55)';
    ctx.lineWidth = Math.max(1, r * 0.09);
    for (var k = 0; k < 6; k++) {
      var a = k * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.16, Math.sin(a) * r * 0.16);
      ctx.lineTo(Math.cos(a) * r * 0.68, Math.sin(a) * r * 0.68);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGlass(fx, gy, H) {
    var gx = fx + 0.175 * H;
    var topY = gy - 0.885 * H, botY = gy - 0.705 * H;
    var hTop = H * 0.047, hBot = H * 0.037;
    var gh = botY - topY;
    // Juice: trapezoid slice at the bottom, width interpolated along the taper.
    var jh = juice * gh;
    var tAt = function (y) { return (y - topY) / gh; };
    var halfAt = function (y) { return hTop + (hBot - hTop) * tAt(y); };
    ctx.beginPath();
    ctx.moveTo(gx - halfAt(botY - 1), botY - 1);
    ctx.lineTo(gx + halfAt(botY - 1), botY - 1);
    ctx.lineTo(gx + halfAt(botY - jh), botY - jh);
    ctx.lineTo(gx - halfAt(botY - jh), botY - jh);
    ctx.closePath();
    ctx.fillStyle = JUICE;
    ctx.fill();
    // Glass body over the juice.
    ctx.beginPath();
    ctx.moveTo(gx - hTop, topY);
    ctx.lineTo(gx + hTop, topY);
    ctx.lineTo(gx + hBot, botY);
    ctx.lineTo(gx - hBot, botY);
    ctx.closePath();
    ctx.fillStyle = GLASS;
    ctx.fill();
    ctx.strokeStyle = GLASS_EDGE;
    ctx.lineWidth = Math.max(1.2, H * 0.0035);
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  function drawFalling(S) {
    if (!falling) return;
    var t = elapsed - falling.t0;
    var DUR = 0.55, BOUNCE = 0.3;
    var x, y, squash = 1;
    if (t < DUR) {
      var k = t / DUR;
      x = falling.sx + (falling.tx - falling.sx) * k;
      y = falling.sy + (falling.ty - falling.sy) * k * k;
    } else if (t < DUR + BOUNCE) {
      var b = (t - DUR) / BOUNCE;
      x = falling.tx;
      y = falling.ty - Math.sin(b * Math.PI) * falling.r * 0.35 * (1 - b);
      squash = 1 - 0.28 * Math.sin(b * Math.PI);
    } else {
      // Landed: join the pile, raise the juice by its barely-visible step.
      pile.push(falling.data);
      pile.sort(function (a, b2) { return a.ny - b2.ny; });
      juice = Math.min(JUICE_CAP, juice + JUICE_STEP);
      falling = null;
      return;
    }
    var hf = {
      nx: x / (W || 1), ny: y / (Hpx || 1), rN: falling.r / S,
      type: 'cut', rot: falling.rot, leaf: falling.leaf, seg: falling.seg
    };
    ctx.save();
    var saveSquash = squash;
    drawHalfScaled(hf, x, y, falling.r, saveSquash);
    ctx.restore();
  }

  // Draw one half at an explicit pixel position (used by the falling half).
  function drawHalfScaled(hf, x, y, r, squash) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(hf.rot);
    ctx.scale(1, 0.85 * squash);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = PEEL; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2); ctx.fillStyle = ORANGE; ctx.fill();
    ctx.strokeStyle = 'rgba(217,126,31,0.55)';
    ctx.lineWidth = Math.max(1, r * 0.07);
    for (var i = 0; i < 6; i++) {
      var a = hf.seg + i * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.14, Math.sin(a) * r * 0.14);
      ctx.lineTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.13, 0, Math.PI * 2); ctx.fillStyle = PEEL; ctx.fill();
    ctx.restore();
    if (hf.leaf) drawLeaf(x + r * 0.4, y - r * 0.85, r * 0.8, -0.5 + hf.seg);
  }

  var W = 0, Hpx = 0;
  function draw() {
    var w = W, h = Hpx;
    var S = Math.min(w, h);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, w, h);
    var feetY = 0.86 * h;
    var i, hf;
    // Pile behind the figure (centres above the feet line).
    for (i = 0; i < pile.length; i++) {
      hf = pile[i];
      if (hf.ny * h < feetY) drawHalf(hf, w, h, S);
    }
    drawFigure(w, h);
    // Pile in front of the figure (centres at or below the feet line).
    for (i = 0; i < pile.length; i++) {
      hf = pile[i];
      if (hf.ny * h >= feetY) drawHalf(hf, w, h, S);
    }
    drawFalling(S);
    // Hint: one lowercase word, peel colour, top-left (the pile owns the bottom).
    ctx.fillStyle = 'rgba(217,126,31,0.65)';
    ctx.font = '600 ' + Math.max(12, Math.round(S * 0.02)) + 'px "Helvetica Neue", Arial, sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag', Math.round(S * 0.022), Math.round(S * 0.04));
  }

  function resize() {
    var vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    Hpx = Math.round(vv ? vv.height : window.innerHeight);
    // Phone detection per house rules (centered composition: recorded, layout keeps its shape).
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || Hpx;
    var isPhone = Math.min(sw, sh) < 700 || Hpx > W * 1.15;
    canvas.__phone = isPhone;
    canvas.width = W;
    canvas.height = Hpx;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  function frame() {
    canvas.style.width = W + 'px';
    canvas.style.height = Hpx + 'px';
    draw();
  }

  // Synchronous first frame: seeded pile fully scattered, glass at its
  // one-finger level, figure at rest. Constant state, never clock-derived.
  frame();

  if (typeof requestAnimationFrame === 'function') {
    var startStamp = null;
    var tick = function (ts) {
      if (startStamp === null) startStamp = ts;
      elapsed = (ts - startStamp) / 1000;
      frame();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // --- Interaction ----------------------------------------------------------
  // Drag stroke (travel >= 10 px), on release: squeeze one more orange.
  // Tap/double-tap (or dblclick): reseed the pile arrangement.
  var downAt = null, downT = 0, lastTapT = -1000;

  function squeeze() {
    if (falling) return;
    var H = 0.70 * Hpx;
    var fx = 0.47 * W;
    var gy = 0.86 * Hpx;
    var S = Math.min(W, Hpx);
    var rand = fxRand;
    var tnx = 0.15 + rand() * 0.7;
    var rN = 0.028 + rand() * 0.017;
    var r = rN * S;
    var tny = surfFrac(tnx) - (r / Hpx) * 0.3 + rand() * 0.006;
    var data = makeHalf(rand, tnx, tny);
    data.rN = rN;
    falling = {
      sx: fx + 0.222 * H, sy: gy - 0.63 * H,
      tx: tnx * W, ty: tny * Hpx,
      r: r, rot: data.rot, leaf: data.leaf, seg: data.seg,
      t0: elapsed, data: data
    };
    addedCount++;
  }

  function reseed() {
    pileSeed += 131;
    falling = null;
    buildPile(pileSeed, BASE_COUNT + addedCount);
    frame();
  }

  function evtPos(e) {
    return { x: e.clientX || 0, y: e.clientY || 0 };
  }
  canvas.addEventListener('pointerdown', function (e) {
    downAt = evtPos(e);
    downT = elapsed;
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!downAt) return;
    var p = evtPos(e);
    var dx = p.x - downAt.x, dy = p.y - downAt.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    downAt = null;
    if (dist >= 10) {
      squeeze();
    } else if (elapsed - downT < 0.35) {
      if (elapsed - lastTapT < 0.35) {
        lastTapT = -1000;
        reseed();
      } else {
        lastTapT = elapsed;
      }
    }
  });
  canvas.addEventListener('dblclick', function () { reseed(); });
})();
</script>
</body>
</html>
