<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This Is Not a Triangle of Pascal</title>
<style>
html, body { margin: 0; padding: 0; background: #f7f5f0; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FRAME_T = 75.0; /* fixed phase: t = 75 s, the shimmer wave peaks at rows 5-6, tripod 0 pulses */
var WAVE_PERIOD = 120.0; /* one slow air-current cycle, two minutes */
var ROWS = 12; /* rows of 1, 2, 3, ... 12 discs = 78 discs total */
var HALL = '#F7F5F0'; /* white hall, daylight */
var WALL_SHADE = '#EDEAE3';
var COLUMN = '#E3DFD6';
var FLOOR = '#D9D4C9';
var FLOOR_LINE = '#C9C3B4';
var STRING = '#8A8578';
var METAL = '#2B2B2E'; /* tripod dark metal */
var METAL_HI = '#55555A';
var PLATE_FILL = '#232326';
var PLATE_LINE = 'rgba(247,245,240,0.30)';
var PLATE_INK = '#F7F5F0';
/* Saturated primaries and secondaries, diagonal cycle by (row + col). */
var DISC_COLORS = ['#D7263D', '#F07F13', '#F2C200', '#2E9E5B', '#1D4ED8', '#7B2FBE'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- disc layout, seed 1815 ----
   Row r (0-based) holds r + 1 discs, rows 1..12, 78 discs total.
   Each disc carries a small fixed sway seed so strings hang at
   slightly different phases; the wave itself is closed-form. */
var DISCS = [];
(function buildDiscs() {
  var rng = mulberry32(1815);
  var r, k;
  for (r = 0; r < ROWS; r++) {
    for (k = 0; k <= r; k++) {
      DISCS.push({
        row: r, col: k,
        color: DISC_COLORS[(r + k) % DISC_COLORS.length],
        seed: rng() * TAU, /* sway phase seed */
        seed2: rng() * TAU
      });
    }
  }
})();
/* Five tripods in a loose arc below the triangle base. */
var TRIPODS = [];
(function buildTripods() {
  var rng = mulberry32(1815 + 7);
  var j;
  for (j = 0; j < 5; j++) {
    TRIPODS.push({
      fx: 0.16 + j * 0.17 + (rng() - 0.5) * 0.03, /* fraction of field width */
      fy: 0.845 + (rng() - 0.5) * 0.02, /* fraction of field height, feet on the floor */
      lean: (rng() - 0.5) * 0.10
    });
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* Geometry of the triangle, all fractions of the field. */
function triGeom() {
  var apexY = F.y + 0.14 * F.h;
  var rowGap = 0.052 * F.h; /* 11 gaps span 0.572 of the height */
  var colGap = (isPhone ? 0.080 : 0.062) * F.w; /* widest row spans 0.88 of the width on phones, 0.682 on desktop */
  var discR = Math.min(colGap, rowGap) * 0.44;
  var floorY = F.y + 0.88 * F.h;
  return { apexY: apexY, rowGap: rowGap, colGap: colGap, discR: discR, floorY: floorY };
}
/* Sway of one disc: two incommensurate slow sines, phase offset
   growing down the rows so waves travel through the triangle. */
function sway(d, t, g) {
  var a = 0.10 * g.discR;
  return a * Math.sin(TAU * t / 47 - d.row * 0.22 + d.seed)
       + 0.6 * a * Math.sin(TAU * t / 83 - d.row * 0.13 + d.seed2);
}
/* Flash: a disc turns to catch the light as the wave passes its row.
   At t = 75 s the wave peaks at row 5.2, mid-triangle. */
function flash(row, t) {
  var s = Math.sin(TAU * t / WAVE_PERIOD - row * 0.45);
  return 0.30 + 0.70 * Math.pow(Math.max(0, s), 2);
}
/* Tripod pulse: fires on a delay after the wave passes the base row.
   Tripod 0 peaks at frame one (t = 75 s). */
function pulse(j, t) {
  var s = Math.sin(TAU * t / WAVE_PERIOD - 0.45 * (ROWS - 1) - j * 0.35 + Math.PI);
  return Math.pow(Math.max(0, s), 3);
}
function drawHall(t, g) {
  /* wall: white hall with a faint daylight gradient from the skylights */
  var wg = ctx.createLinearGradient(0, F.y, 0, g.floorY);
  wg.addColorStop(0, '#FBFAF7');
  wg.addColorStop(1, HALL);
  ctx.fillStyle = wg;
  ctx.fillRect(F.x, F.y, F.w, g.floorY - F.y);
  /* skylight band at the top */
  ctx.fillStyle = rgba('#FFFFFF', 0.55);
  ctx.fillRect(F.x, F.y, F.w, 0.045 * F.h);
  ctx.fillStyle = rgba('#E8E4D8', 0.6);
  ctx.fillRect(F.x, F.y + 0.045 * F.h, F.w, Math.max(1, 0.004 * F.h));
  /* side columns framing the hall */
  ctx.fillStyle = COLUMN;
  ctx.fillRect(F.x, F.y, 0.018 * F.w, g.floorY - F.y);
  ctx.fillRect(F.x + F.w - 0.018 * F.w, F.y, 0.018 * F.w, g.floorY - F.y);
  ctx.fillStyle = rgba('#FFFFFF', 0.35);
  ctx.fillRect(F.x + 0.018 * F.w, F.y, Math.max(1, 0.004 * F.w), g.floorY - F.y);
  ctx.fillRect(F.x + F.w - 0.022 * F.w, F.y, Math.max(1, 0.004 * F.w), g.floorY - F.y);
  /* floor */
  ctx.fillStyle = FLOOR;
  ctx.fillRect(F.x, g.floorY, F.w, F.y + F.h - g.floorY);
  ctx.fillStyle = FLOOR_LINE;
  ctx.fillRect(F.x, g.floorY, F.w, Math.max(1, 0.003 * F.h));
}
function drawDisc(d, t, g) {
  var cx = F.x + F.w / 2 + (d.col - d.row / 2) * g.colGap + sway(d, t, g);
  var cy = g.apexY + d.row * g.rowGap;
  var r = g.discR;
  var fl = flash(d.row, t);
  /* string: near-invisible, a faint catenary from the ceiling */
  ctx.strokeStyle = rgba(STRING, 0.28);
  ctx.lineWidth = Math.max(0.6, F.w * 0.0009);
  ctx.beginPath();
  ctx.moveTo(cx - sway(d, t, g) * 0.4, F.y);
  ctx.quadraticCurveTo(cx - sway(d, t, g) * 0.9, (F.y + cy) / 2, cx, cy - r * 0.6);
  ctx.stroke();
  /* disc body */
  ctx.fillStyle = d.color;
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fill();
  /* rim shadow on the far side */
  ctx.strokeStyle = rgba('#000000', 0.18);
  ctx.lineWidth = Math.max(0.7, r * 0.08);
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r * 0.96, 0, TAU);
  ctx.stroke();
  /* the disc turns to catch the light: a bright crescent that grows
     with the wave, plus a soft halo at full flash */
  if (fl > 0.45) {
    var halo = (fl - 0.45) / 0.55;
    ctx.fillStyle = rgba('#FFFFFF', 0.28 * halo);
    ctx.beginPath();
    ctx.moveTo(cx + r * 1.35, cy);
    ctx.arc(cx, cy, r * 1.35, 0, TAU);
    ctx.fill();
    ctx.fillStyle = rgba('#FFFFFF', 0.55 * halo);
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.28, cy - r * 0.72);
    ctx.ellipse(cx, cy, r * 0.52, r * 0.30, -0.5, 0, TAU);
    ctx.fill();
  }
}
function drawTripod(tp, t, g) {
  var bx = F.x + tp.fx * F.w;
  var by = F.y + tp.fy * F.h;
  var hgt = 0.075 * F.h; /* resonator head height above the floor */
  var hx = bx + tp.lean * F.w;
  var hy = by - hgt;
  var legSpread = 0.030 * F.w;
  /* soft shadow on the floor */
  ctx.fillStyle = rgba('#000000', 0.10);
  ctx.beginPath();
  ctx.moveTo(bx + legSpread * 1.2, by);
  ctx.ellipse(bx, by, legSpread * 1.2, Math.max(1.5, 0.006 * F.h), 0, 0, TAU);
  ctx.fill();
  /* three legs */
  ctx.strokeStyle = METAL;
  ctx.lineWidth = Math.max(1.2, F.w * 0.0022);
  ctx.lineCap = 'round';
  var legs = [[bx - legSpread, by], [bx + legSpread, by], [bx, by + 0.004 * F.h]];
  var i;
  for (i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(legs[i][0], legs[i][1]);
    ctx.stroke();
  }
  /* resonator head, a small box tilted up at the discs */
  ctx.fillStyle = METAL;
  ctx.beginPath();
  ctx.moveTo(hx - 0.012 * F.w, hy);
  ctx.lineTo(hx + 0.012 * F.w, hy - 0.008 * F.h);
  ctx.lineTo(hx + 0.012 * F.w, hy - 0.020 * F.h);
  ctx.lineTo(hx - 0.012 * F.w, hy - 0.020 * F.h);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = METAL_HI;
  ctx.fillRect(hx - 0.012 * F.w, hy - 0.020 * F.h, 0.024 * F.w, Math.max(1, 0.002 * F.h));
  /* pulse: a small ring of light above the resonator when the wave
     has just passed */
  var p = pulse(TRIPODS.indexOf(tp), t);
  if (p > 0.05) {
    ctx.strokeStyle = rgba('#F2C200', 0.85 * p);
    ctx.lineWidth = Math.max(1, F.w * 0.002);
    ctx.beginPath();
    ctx.moveTo(hx + 0.016 * F.w, hy - 0.026 * F.h);
    ctx.arc(hx, hy - 0.026 * F.h, 0.016 * F.w, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = rgba('#F2C200', 0.55 * p);
    ctx.beginPath();
    ctx.moveTo(hx + 0.005 * F.w, hy - 0.026 * F.h);
    ctx.arc(hx, hy - 0.026 * F.h, 0.005 * F.w, 0, TAU);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  var title = 'This Is Not a Triangle of Pascal';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(title).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 31').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(title, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2006 · 12 · 31', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = HALL;
  ctx.fillRect(0, 0, VW, VH);
  var g = triGeom();
  drawHall(phaseT, g);
  var i;
  for (i = 0; i < DISCS.length; i++) drawDisc(DISCS[i], phaseT, g);
  for (i = 0; i < TRIPODS.length; i++) drawTripod(TRIPODS[i], phaseT, g);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    discRows: function () {
      var counts = [], i;
      for (i = 0; i < ROWS; i++) counts.push(0);
      for (i = 0; i < DISCS.length; i++) counts[DISCS[i].row]++;
      return { rows: ROWS, perRow: counts, total: DISCS.length };
    },
    flashAt: function (row, t) { return flash(row, t); },
    pulseAt: function (j, t) { return pulse(j, t); },
    tripods: function () { return TRIPODS.length; }
  };
}
/* ---- frame one: fixed phase t = 75 s ----
   No wall clock is read for frame one. No pointer or keyboard
   handlers are registered: watch-only by design, nothing the
   viewer does changes anything. */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  /* True time: phase is computed from a wall-clock start captured after
     the fixed first frame, so dropped frames never lose time. */
  var startMs = Date.now();
  (function loop() {
    function step() {
      phaseT = FRAME_T + (Date.now() - startMs) / 1000;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
