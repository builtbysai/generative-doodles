<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№100 · Oscillator Drift</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#A98B5F; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(26,21,18,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to set the modulation</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

// No.100 Oscillator Drift: three sine oscillators as horizontal waveforms, their sum below
// at twice the line weight. Seeded frequencies and phases (cycles across the frame, cycles
// per loop): osc1 f=3, drift 1; osc2 f=5, drift -2; osc3 f=8, drift 1. FM cross-modulation:
// each oscillator's phase is bent by the next one's slow value, all on wrapped 30s time,
// so the loop is exact. Drag: fingertip height sets the modulation depth while pressed;
// release eases back to the resting depth.
const LOOP=30;
const OSC=[
  { f:3, drift:1, ph:0.0 },
  { f:5, drift:-2, ph:2.1 },
  { f:8, drift:1, ph:4.2 }
];
const REST_DEPTH=1.0;
let pressing=false, pressDepth=REST_DEPTH, depth=REST_DEPTH, lastMs=null;
function oscY(o, xi, u, d){
  const mod=o===OSC[0] ? Math.sin(2*Math.PI*(2*xi) + 2*Math.PI*1*u + 1.3)
            : o===OSC[1] ? Math.sin(2*Math.PI*(3*xi) + 2*Math.PI*(-1)*u + 0.5)
            : Math.sin(2*Math.PI*(1*xi) + 2*Math.PI*2*u + 2.6);
  return Math.sin(2*Math.PI*o.f*xi + o.ph + 2*Math.PI*o.drift*u + d*1.15*mod);
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(dt>0){ const target=pressing?pressDepth:REST_DEPTH; depth+=(target-depth)*Math.min(1,dt*4); }
  ctx.fillStyle='#A98B5F'; ctx.fillRect(0,0,w,h);
  const phone=isPhone();
  let ox=0, oy=0, dw=w, dh=h;
  if(!phone){ const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; dw=S; dh=S; }
  const mx=dw*0.06, my=dh*0.07;
  const gx0=ox+mx, gw=dw-2*mx, gy0=oy+my, gh=dh-2*my;
  const bandH=gh/4;
  const u=((nowMs/1000)%LOOP)/LOOP;
  const baseLW=Math.max(1, Math.min(w,h)*0.0016);
  ctx.strokeStyle='#1A1512';
  ctx.lineJoin='round';
  const STEPS=240;
  // three oscillator bands
  for(let b=0;b<3;b++){
    const cy=gy0+bandH*(b+0.5);
    const amp=bandH*0.34;
    ctx.lineWidth=baseLW;
    ctx.beginPath();
    for(let i=0;i<=STEPS;i++){
      const xi=i/STEPS;
      const x=gx0+xi*gw;
      const y=cy+amp*oscY(OSC[b], xi, u, depth);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  // sum band at twice the weight
  const cy=gy0+bandH*3.5;
  const amp=bandH*0.40;
  ctx.lineWidth=baseLW*2;
  ctx.beginPath();
  for(let i=0;i<=STEPS;i++){
    const xi=i/STEPS;
    const x=gx0+xi*gw;
    const s=(oscY(OSC[0],xi,u,depth)+oscY(OSC[1],xi,u,depth)+oscY(OSC[2],xi,u,depth))/3;
    const y=cy+amp*s;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  return {};
}
canvas.addEventListener('pointerdown',e=>{ pressing=true; pressDepth=clamp(e.clientY/viewportWH()[1],0,1)*2.2; });
canvas.addEventListener('pointermove',e=>{ if(pressing) pressDepth=clamp(e.clientY/viewportWH()[1],0,1)*2.2; });
function endP(){ pressing=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(9000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
