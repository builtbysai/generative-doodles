<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.302 Panther Tatt-Tour</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#D8D2C4; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.302 Panther Tatt-Tour (Ali Fisher).
// A cream ceramic panther prowling left to right, its body a
// tattoo sleeve in underglaze cobalt: heart, collar, cherries,
// dice, swallows, mermaid, dragon, skulls and tiger stripes,
// each painted three times with small offsets for saturation.
// Below are its two companions, a dog and a cat. Dragging
// dollies the camera along the body; tapping a motif re-inks
// it in three passes. Tapping never reloads.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CREAM = '#F2EAD8', C1 = '#2B5EA7', C2 = '#1E4680', C3 = '#16335E';
var INK = '#141414', GROUND = '#D8D2C4';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

var PASSES = [
  { dx: -0.5, dy: -0.5, col: C1 },
  { dx: 0, dy: 0, col: C2 },
  { dx: 0.5, dy: 0.5, col: C3 }
];

// Hand lettered glyphs as stroke paths in a unit box, y down.
// No loaded fonts and no text calls anywhere in this piece.
function glyphPath(ch, x, y, w, h) {
  var i, px, py;
  ctx.beginPath();
  if (ch === 'M') {
    ctx.moveTo(x, y + h); ctx.lineTo(x, y); ctx.lineTo(x + w * 0.5, y + h * 0.58);
    ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h);
  } else if (ch === 'U') {
    ctx.moveTo(x, y); ctx.lineTo(x, y + h * 0.62);
    for (i = 0; i <= 6; i++) { px = x + w * (i / 6); py = y + h * 0.62 + Math.sin((i / 6) * Math.PI) * h * 0.38; ctx.lineTo(px, py); }
    ctx.lineTo(x + w, y);
  } else if (ch === 'L') {
    ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h);
  } else if (ch === 'O') {
    ctx.ellipse(x + w * 0.5, y + h * 0.5, w * 0.46, h * 0.48, 0, 0, Math.PI * 2);
  } else if (ch === 'V') {
    ctx.moveTo(x, y); ctx.lineTo(x + w * 0.5, y + h); ctx.lineTo(x + w, y);
  } else if (ch === 'E') {
    ctx.moveTo(x + w, y); ctx.lineTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h);
    ctx.moveTo(x, y + h * 0.5); ctx.lineTo(x + w * 0.78, y + h * 0.5);
  }
}
function drawWord(word, x, y, w, h, col, lw) {
  var cw = w / word.length, i;
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (i = 0; i < word.length; i++) { glyphPath(word[i], x + i * cw + cw * 0.14, y, cw * 0.72, h); ctx.stroke(); }
}

// ---- motifs ---------------------------------------------------------
function heartPath(x, y, w, h) {
  ctx.beginPath();
  ctx.moveTo(x, y + h * 0.34);
  ctx.bezierCurveTo(x, y, x + w * 0.42, y, x + w * 0.5, y + h * 0.28);
  ctx.bezierCurveTo(x + w * 0.58, y, x + w, y, x + w, y + h * 0.34);
  ctx.bezierCurveTo(x + w, y + h * 0.68, x + w * 0.62, y + h * 0.86, x + w * 0.5, y + h);
  ctx.bezierCurveTo(x + w * 0.38, y + h * 0.86, x, y + h * 0.68, x, y + h * 0.34);
  ctx.closePath();
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }

var DRAW = {
  mum: function (col, ox, oy) {
    heartPath(778 + ox, 338 + oy, 108, 102);
    ctx.fillStyle = col; ctx.fill(); st(col, 4); ctx.stroke();
    drawWord('MUM', 796 + ox, 372 + oy, 72, 30, CREAM, 4);
  },
  collar: function (col, ox, oy) {
    st(col, 5);
    // two collar bands slanting across the neck
    line(902 + ox, 322 + oy, 946 + ox, 442 + oy);
    line(920 + ox, 318 + oy, 964 + ox, 438 + oy);
    // barbs: small crosses along both bands
    var i, t, x, y;
    for (i = 0; i < 5; i++) {
      t = i / 4; x = 902 + 44 * t + ox; y = 328 + 106 * t + oy;
      line(x - 9, y - 9, x + 9, y + 9); line(x + 9, y - 9, x - 9, y + 9);
      x += 18; line(x - 9, y - 9, x + 9, y + 9); line(x + 9, y - 9, x - 9, y + 9);
    }
  },
  cherries: function (col, ox, oy) {
    st(col, 4.5);
    ctx.beginPath(); ctx.moveTo(252 + ox, 162 + oy);
    ctx.quadraticCurveTo(238 + ox, 186 + oy, 234 + ox, 198 + oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(252 + ox, 162 + oy);
    ctx.quadraticCurveTo(272 + ox, 182 + oy, 282 + ox, 194 + oy); ctx.stroke();
    line(252 + ox, 162 + oy, 276 + ox, 150 + oy);
    ctx.fillStyle = col;
    circ(230 + ox, 218 + oy, 21, true); circ(288 + ox, 212 + oy, 18, true);
    ctx.fillStyle = CREAM;
    circ(223 + ox, 211 + oy, 5, true); circ(282 + ox, 205 + oy, 4, true);
  },
  dice: function (col, ox, oy) {
    st(col, 4.5);
    ctx.save(); ctx.translate(212 + ox, 268 + oy); ctx.rotate(-0.22);
    ctx.strokeRect(-30, -30, 60, 60); ctx.restore();
    ctx.save(); ctx.translate(258 + ox, 302 + oy); ctx.rotate(0.3);
    ctx.strokeRect(-24, -24, 48, 48); ctx.restore();
    ctx.fillStyle = col;
    circ(198 + ox, 254 + oy, 5, true); circ(226 + ox, 282 + oy, 5, true); circ(212 + ox, 268 + oy, 5, true);
    circ(246 + ox, 290 + oy, 4.5, true); circ(270 + ox, 314 + oy, 4.5, true);
  },
  swallows: function (col, ox, oy) {
    st(col, 4.5);
    var birds = [[612, 342, 1], [686, 322, -1]], b, x, y, f;
    for (b = 0; b < 2; b++) {
      x = birds[b][0] + ox; y = birds[b][1] + oy; f = birds[b][2];
      ctx.beginPath(); ctx.moveTo(x - 26, y); ctx.quadraticCurveTo(x - 8, y - 18, x + 4, y - 2);
      ctx.quadraticCurveTo(x + 16, y - 16, x + 28, y - 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 4, y - 2); ctx.quadraticCurveTo(x + 2, y + 12, x - 8, y + 18); ctx.stroke();
      line(x - 8, y + 18, x - 20, y + 26); line(x - 8, y + 18, x + 2, y + 27);
      ctx.fillStyle = col; circ(x + 6, y - 6, 3, true);
    }
  },
  mermaid: function (col, ox, oy) {
    st(col, 5);
    // filled tail from the waist down to the fluke
    ctx.beginPath();
    ctx.moveTo(636 + ox, 402 + oy);
    ctx.bezierCurveTo(642 + ox, 428 + oy, 652 + ox, 438 + oy, 650 + ox, 456 + oy);
    ctx.lineTo(628 + ox, 474 + oy); ctx.lineTo(650 + ox, 470 + oy);
    ctx.lineTo(668 + ox, 478 + oy); ctx.lineTo(664 + ox, 456 + oy);
    ctx.bezierCurveTo(668 + ox, 436 + oy, 660 + ox, 426 + oy, 660 + ox, 402 + oy);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    // head, hair and torso
    circ(648 + ox, 368 + oy, 14, false);
    ctx.beginPath(); ctx.arc(648 + ox, 366 + oy, 17, Math.PI * 1.02, Math.PI * 1.98); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(632 + ox, 362 + oy);
    ctx.quadraticCurveTo(624 + ox, 388 + oy, 634 + ox, 402 + oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(664 + ox, 362 + oy);
    ctx.quadraticCurveTo(672 + ox, 388 + oy, 662 + ox, 402 + oy); ctx.stroke();
    line(648 + ox, 382 + oy, 648 + ox, 404 + oy);
    // arms reaching out
    ctx.beginPath(); ctx.moveTo(642 + ox, 390 + oy); ctx.quadraticCurveTo(622 + ox, 392 + oy, 614 + ox, 380 + oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(654 + ox, 390 + oy); ctx.quadraticCurveTo(674 + ox, 392 + oy, 682 + ox, 380 + oy); ctx.stroke();
    // scale arcs on the tail
    st(CREAM, 2.6);
    ctx.beginPath(); ctx.arc(648 + ox, 424 + oy, 8, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(650 + ox, 442 + oy, 8, 0.2, Math.PI - 0.2); ctx.stroke();
  },
  dragon: function (col, ox, oy) {
    st(col, 6);
    // serpent body in a rising S
    ctx.beginPath();
    ctx.moveTo(424 + ox, 446 + oy);
    ctx.bezierCurveTo(458 + ox, 388 + oy, 492 + ox, 458 + oy, 518 + ox, 404 + oy);
    ctx.stroke();
    // triangular head at the top of the S, eye punched in cream
    ctx.beginPath();
    ctx.moveTo(512 + ox, 378 + oy); ctx.lineTo(548 + ox, 384 + oy);
    ctx.lineTo(560 + ox, 402 + oy); ctx.lineTo(528 + ox, 410 + oy);
    ctx.lineTo(508 + ox, 396 + oy); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.fillStyle = CREAM; circ(534 + ox, 394 + oy, 3.5, true);
    st(col, 4.5);
    line(518 + ox, 380 + oy, 506 + ox, 362 + oy);
    line(558 + ox, 402 + oy, 572 + ox, 410 + oy);
    // filled wing above the middle coil
    ctx.beginPath(); ctx.moveTo(482 + ox, 402 + oy);
    ctx.quadraticCurveTo(458 + ox, 362 + oy, 428 + ox, 368 + oy);
    ctx.quadraticCurveTo(448 + ox, 386 + oy, 456 + ox, 410 + oy);
    ctx.quadraticCurveTo(470 + ox, 402 + oy, 482 + ox, 402 + oy); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    // belly ticks and a spiked tail
    var i; for (i = 0; i < 4; i++) line(446 + i * 18 + ox, 428 - (i % 2) * 14 + oy, 452 + i * 18 + ox, 440 - (i % 2) * 14 + oy);
    line(424 + ox, 446 + oy, 408 + ox, 460 + oy); line(424 + ox, 446 + oy, 410 + ox, 434 + oy);
  },
  skulls: function (col, ox, oy) {
    var pts = [[714, 396, 27], [752, 434, 20]], s, x, y, r;
    for (s = 0; s < 2; s++) {
      x = pts[s][0] + ox; y = pts[s][1] + oy; r = pts[s][2];
      st(col, 4.5);
      ctx.beginPath(); ctx.arc(x, y, r, Math.PI * 0.95, Math.PI * 2.05); ctx.stroke();
      line(x - r, y + 2, x - r * 0.72, y + r * 0.9); line(x + r, y + 2, x + r * 0.72, y + r * 0.9);
      line(x - r * 0.72, y + r * 0.9, x + r * 0.72, y + r * 0.9);
      ctx.fillStyle = col;
      circ(x - r * 0.38, y, r * 0.2, true); circ(x + r * 0.38, y, r * 0.2, true);
      line(x, y + r * 0.34, x - 4, y + r * 0.58); line(x, y + r * 0.34, x + 4, y + r * 0.58);
      line(x - 10, y + r * 0.9, x - 10, y + r * 1.12); line(x + 10, y + r * 0.9, x + 10, y + r * 1.12);
    }
  },
  stripes: function (col, ox, oy) {
    st(col, 9);
    // tiger stripes laid across the forward hind leg, following its slant
    var rows = [[486, 506, 530, 496], [498, 552, 542, 542], [510, 596, 554, 586]], i;
    for (i = 0; i < rows.length; i++) {
      ctx.beginPath(); ctx.moveTo(rows[i][0] + ox, rows[i][1] + oy);
      ctx.quadraticCurveTo((rows[i][0] + rows[i][2]) / 2 + ox, rows[i][1] - 10 + oy, rows[i][2] + ox, rows[i][3] + oy); ctx.stroke();
    }
    st(col, 7);
    line(482 + ox, 476 + oy, 516 + ox, 468 + oy);
  }
};

var MOTIFS = [
  { id: 'mum', x: 832, y: 389, r: 62 },
  { id: 'collar', x: 933, y: 380, r: 52 },
  { id: 'cherries', x: 258, y: 198, r: 52 },
  { id: 'dice', x: 235, y: 285, r: 50 },
  { id: 'swallows', x: 650, y: 332, r: 56 },
  { id: 'mermaid', x: 650, y: 415, r: 58 },
  { id: 'dragon', x: 478, y: 398, r: 62 },
  { id: 'skulls', x: 732, y: 412, r: 54 },
  { id: 'stripes', x: 520, y: 545, r: 54 }
];
if (MOTIFS.length !== 9) throw new Error('Panther Tatt-Tour needs exactly 9 motif groups');
var COMPANIONS = ['dog', 'cat'];
if (COMPANIONS.length !== 2) throw new Error('Panther Tatt-Tour needs exactly 2 companions');
MOTIFS.forEach(function (m) { m.prevX = null; m.pulse = -9; });

var camX = -120, camTarget = -120;
var animId = null, animT0 = 0;

// ---- panther ----------------------------------------------------------
function leg(x1, y1, x2, y2) {
  ctx.strokeStyle = INK; ctx.lineWidth = 54; ctx.lineCap = 'round';
  line(x1, y1, x2, y2);
  ctx.strokeStyle = CREAM; ctx.lineWidth = 38;
  line(x1, y1, x2, y2);
  ctx.beginPath(); ctx.ellipse(x2 + 10, y2 + 4, 30, 15, 0, 0, Math.PI * 2);
  ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
}
function drawPanther() {
  // tail, curving up behind the rear
  ctx.strokeStyle = INK; ctx.lineWidth = 46; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(372, 372);
  ctx.bezierCurveTo(272, 352, 208, 292, 214, 208); ctx.stroke();
  ctx.strokeStyle = CREAM; ctx.lineWidth = 31;
  ctx.beginPath(); ctx.moveTo(372, 372);
  ctx.bezierCurveTo(272, 352, 208, 292, 214, 208); ctx.stroke();
  // legs in a prowling stride, far pair first
  leg(492, 462, 548, 606);
  leg(842, 462, 782, 606);
  leg(424, 462, 362, 606);
  leg(884, 458, 950, 606);
  // body
  ctx.beginPath();
  ctx.moveTo(368, 332);
  ctx.bezierCurveTo(500, 256, 762, 256, 902, 324);
  ctx.bezierCurveTo(962, 348, 968, 436, 908, 472);
  ctx.bezierCurveTo(758, 528, 522, 528, 394, 478);
  ctx.bezierCurveTo(330, 452, 328, 376, 368, 332);
  ctx.closePath();
  ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
  // ear then head, nose to the right
  ctx.beginPath(); ctx.moveTo(934, 328); ctx.lineTo(952, 284); ctx.lineTo(986, 318); ctx.closePath();
  ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(918, 332);
  ctx.bezierCurveTo(972, 298, 1036, 312, 1068, 350);
  ctx.bezierCurveTo(1082, 368, 1076, 392, 1052, 404);
  ctx.bezierCurveTo(1020, 438, 956, 448, 924, 420);
  ctx.bezierCurveTo(902, 398, 902, 356, 918, 332);
  ctx.closePath();
  ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
  // eye, nose, mouth, whisker dots
  ctx.fillStyle = INK; circ(1002, 356, 7, true);
  ctx.beginPath(); ctx.moveTo(1052, 378); ctx.lineTo(1072, 388); ctx.lineTo(1054, 400); ctx.closePath(); ctx.fill();
  st(INK, 4); line(1052, 404, 1028, 416);
  ctx.fillStyle = C2; circ(1032, 392, 3, true); circ(1044, 398, 3, true);
}

function drawMotif(m) {
  var sx = m.x + camX;
  // pulse once as the motif crosses centre frame
  if (m.prevX !== null && ((m.prevX - 640) < 0) !== ((sx - 640) < 0)) m.pulse = T;
  m.prevX = sx;
  var scale = 1, pa = T - m.pulse;
  if (pa >= 0 && pa < 0.6) scale = 1 + Math.sin(pa / 0.6 * Math.PI) * 0.14;
  var passes = PASSES;
  if (animId === m.id) {
    var el = T - animT0;
    if (el >= 1.35) { animId = null; }
    else passes = PASSES.slice(0, Math.min(3, Math.floor(el / 0.42) + 1));
  }
  ctx.save();
  ctx.translate(m.x, m.y); ctx.scale(scale, scale); ctx.translate(-m.x, -m.y);
  for (var i = 0; i < passes.length; i++) DRAW[m.id](passes[i].col, passes[i].dx, passes[i].dy);
  ctx.restore();
}

// ---- companions ---------------------------------------------------------
function drawDog() {
  var bx = 330, by = 738;
  st(INK, 6);
  ctx.beginPath(); ctx.moveTo(bx + 96, by - 28); ctx.quadraticCurveTo(bx + 132, by - 48, bx + 124, by - 74); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(bx, by, 112, 54, 0, 0, Math.PI * 2);
  ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
  st(INK, 15); line(bx - 72, by + 44, bx - 72, by + 92); line(bx + 70, by + 44, bx + 70, by + 92);
  st(CREAM, 8); line(bx - 72, by + 44, bx - 72, by + 90); line(bx + 70, by + 44, bx + 70, by + 90);
  ctx.beginPath(); ctx.arc(bx - 128, by - 38, 44, 0, Math.PI * 2);
  ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx - 156, by - 70); ctx.lineTo(bx - 138, by - 112); ctx.lineTo(bx - 112, by - 76); ctx.closePath();
  ctx.fillStyle = CREAM; ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; circ(bx - 142, by - 42, 5, true);
  ctx.beginPath(); ctx.arc(bx - 168, by - 28, 9, 0, Math.PI * 2); ctx.fill();
  // LOVE lettered across the flank above the front leg
  drawWord('LOVE', bx - 6, by - 20, 92, 26, C2, 4);
}
function drawCat() {
  var bx = 950, by = 736;
  st(INK, 6);
  ctx.beginPath(); ctx.moveTo(bx + 62, by + 66);
  ctx.bezierCurveTo(bx + 128, by + 66, bx + 132, by - 6, bx + 92, by - 12); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(bx - 62, by + 78);
  ctx.bezierCurveTo(bx - 70, by + 6, bx - 44, by - 44, bx, by - 48);
  ctx.bezierCurveTo(bx + 44, by - 44, bx + 70, by + 6, bx + 62, by + 78);
  ctx.closePath();
  ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
  ctx.beginPath(); ctx.arc(bx, by - 78, 40, 0, Math.PI * 2);
  ctx.fillStyle = CREAM; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx - 34, by - 104); ctx.lineTo(bx - 28, by - 140); ctx.lineTo(bx - 6, by - 114); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx + 34, by - 104); ctx.lineTo(bx + 28, by - 140); ctx.lineTo(bx + 6, by - 114); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; circ(bx - 14, by - 78, 4.5, true); circ(bx + 14, by - 78, 4.5, true);
  st(INK, 3.5); line(bx - 6, by - 62, bx + 6, by - 62);
  // heart with MUM on the chest
  heartPath(bx - 25, by - 28, 50, 47);
  ctx.fillStyle = C1; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
  drawWord('MUM', bx - 17, by - 14, 34, 15, CREAM, 2.6);
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  // studio floor line
  ctx.globalAlpha = 0.35; st(INK, 3); line(60, 838, 1220, 838); ctx.globalAlpha = 1;
  ctx.save(); ctx.translate(camX * 0.45, 0);
  drawDog(); drawCat();
  ctx.restore();
  ctx.save(); ctx.translate(camX, 0);
  drawPanther();
  var i; for (i = 0; i < MOTIFS.length; i++) drawMotif(MOTIFS[i]);
  ctx.restore();
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
var drag = null;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  drag = { x: p[0], cam: camTarget, moved: 0, hit: null };
  for (var i = 0; i < MOTIFS.length; i++) {
    var m = MOTIFS[i], dx = p[0] - (m.x + camX), dy = p[1] - m.y;
    if (dx * dx + dy * dy < (m.r + 14) * (m.r + 14)) drag.hit = m.id;
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = toDesign(e), dx = p[0] - drag.x;
  drag.moved = Math.max(drag.moved, Math.abs(dx));
  camTarget = Math.max(-280, Math.min(140, drag.cam + dx));
});
canvas.addEventListener('pointerup', function () {
  if (drag && drag.moved < 8 && drag.hit) { animId = drag.hit; animT0 = T; }
  drag = null;
});
canvas.addEventListener('pointercancel', function () { drag = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  camX += (camTarget - camX) * 0.14;
  if (Math.abs(camTarget - camX) < 0.05) camX = camTarget;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
