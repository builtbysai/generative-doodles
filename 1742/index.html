<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collapsed for Half-Speed</title>
<style>
html, body { margin: 0; padding: 0; background: #141518; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a melody decaying a little with every half-tempo pass, never quite
   gone, with fragments occasionally remembering themselves brighter. */
var TAU = Math.PI * 2;
var GROUND = '#141518';
var PLATE = '#1E2022';
var PLATE_LINE = 'rgba(237,237,232,0.35)';
var TITLE_INK = '#EDEDE8';
var HINT_INK = '#E8D9B8';
var PERIOD = 24;
var FRAME_T = 52.0;
var FRAGMENTS = 9;
var CHALK = '#EDEDE8';
var GREY = '#B9BCB8';
var WARM = '#FFF6E6';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1742);
var phaseT = FRAME_T;
/* ---- crack texture: seeded ridged-noise polylines, fixed at build time ---- */
var CRACKS = [];
var SPECKS = [];
(function () {
  var i, j, x, y, ang, len, segs, pts;
  for (i = 0; i < 30; i++) {
    x = rng() * 1.1 - 0.05;
    y = rng() * 1.1 - 0.05;
    ang = rng() * TAU;
    segs = 5 + Math.floor(rng() * 9);
    pts = [[x, y]];
    for (j = 0; j < segs; j++) {
      ang += (rng() - 0.5) * 1.1;
      len = 0.03 + rng() * 0.07;
      x += Math.cos(ang) * len;
      y += Math.sin(ang) * len * 0.8;
      pts.push([x, y]);
    }
    CRACKS.push({
      pts: pts,
      light: rng() < 0.5,
      alpha: 0.25 + rng() * 0.45,
      width: 0.7 + rng() * 1.3
    });
  }
  for (i = 0; i < 320; i++) {
    SPECKS.push({
      x: rng(), y: rng(),
      r: 0.4 + rng() * 1.4,
      alpha: 0.04 + rng() * 0.10,
      light: rng() < 0.6
    });
  }
})();
/* ---- trace layers: 5 harmonics, strongest first ---- */
var LAYERS = [
  { freq: 1.5, amp: 1.00, weight: 1.00, width: 2.2, color: CHALK, phase: 0.4 },
  { freq: 2.5, amp: 0.50, weight: 0.60, width: 1.6, color: CHALK, phase: 2.1 },
  { freq: 3.5, amp: 0.30, weight: 0.40, width: 1.2, color: GREY, phase: 4.0 },
  { freq: 5.0, amp: 0.18, weight: 0.28, width: 1.0, color: GREY, phase: 1.2 },
  { freq: 6.0, amp: 0.10, weight: 0.18, width: 0.8, color: GREY, phase: 5.3 }
];
function loopIndex(t) { return Math.floor(t / PERIOD); }
function decayAt(t) {
  return Math.max(0.45, Math.pow(0.86, loopIndex(t)));
}
function harmonicsAt(t) {
  return Math.max(3, 5 - Math.floor(loopIndex(t) / 2));
}
function bloomAt(j, t) {
  var v = Math.sin(TAU * (t / 53 + j * 0.6180339));
  return Math.pow(Math.max(0, v), 8);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: full-bleed on phones, centered square on desktop ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function drawTexture(st) {
  var i, j, p;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  for (i = 0; i < SPECKS.length; i++) {
    p = SPECKS[i];
    ctx.fillStyle = p.light ? rgba('#2A2D30', p.alpha) : rgba('#08090A', p.alpha);
    ctx.beginPath();
    ctx.moveTo(p.x * VW + p.r, p.y * VH);
    ctx.arc(p.x * VW, p.y * VH, p.r, 0, TAU);
    ctx.fill();
  }
  for (i = 0; i < CRACKS.length; i++) {
    var c = CRACKS[i];
    ctx.beginPath();
    ctx.moveTo(c.pts[0][0] * VW, c.pts[0][1] * VH);
    for (j = 1; j < c.pts.length; j++) {
      ctx.lineTo(c.pts[j][0] * VW, c.pts[j][1] * VH);
    }
    ctx.strokeStyle = c.light ? rgba('#2E3236', c.alpha) : rgba('#08090A', c.alpha);
    ctx.lineWidth = c.width;
    ctx.stroke();
  }
}
function traceY(layer, x, st, u, t) {
  var nx = (x - st.x) / st.w;
  var drift = u * TAU * 0.5;
  var y = Math.sin(TAU * layer.freq * nx + layer.phase + drift) * layer.amp;
  y += 0.12 * Math.sin(TAU * layer.freq * 2.7 * nx + layer.phase * 2.0 + drift * 0.5);
  return y;
}
function drawLayer(layer, st, u, t, alpha, x0, x1, widthMul, color) {
  var bandH = st.h * 0.34;
  var cy = st.y + st.h / 2 + Math.sin(u * TAU) * bandH * 0.03;
  var scale = Math.min(VW, VH) / 720;
  var x, y;
  ctx.beginPath();
  ctx.moveTo(x0, cy + traceY(layer, x0, st, u, t) * bandH * 0.5);
  for (x = x0 + 6; x <= x1; x += 6) {
    y = cy + traceY(layer, x, st, u, t) * bandH * 0.5;
    ctx.lineTo(x, y);
  }
  ctx.strokeStyle = rgba(color || layer.color, alpha);
  ctx.lineWidth = layer.width * scale * (widthMul || 1);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();
}
function drawTrace(st) {
  var k = loopIndex(phaseT);
  var u = (phaseT % PERIOD) / PERIOD;
  var decay = decayAt(phaseT);
  var n = harmonicsAt(phaseT);
  var i, j;
  var base = 0.8 * decay;
  for (i = 0; i < n; i++) {
    var L = LAYERS[i];
    drawLayer(L, st, u, phaseT, base * L.weight, st.x, st.x + st.w);
  }
  /* resurfacing fragments: slow undertow pulls one back, warm white bloom */
  var fragW = st.w / FRAGMENTS;
  for (j = 0; j < FRAGMENTS; j++) {
    var b = bloomAt(j, phaseT);
    if (b <= 0.02) continue;
    var fx0 = st.x + j * fragW, fx1 = fx0 + fragW;
    drawLayer(LAYERS[0], st, u, phaseT, b * 0.16, fx0, fx1, 4.5, WARM);
    drawLayer(LAYERS[0], st, u, phaseT, b * 0.85, fx0, fx1, 1.6, WARM);
    drawLayer(LAYERS[1], st, u, phaseT, b * 0.55, fx0, fx1, 1.4, WARM);
  }
}
function draw() {
  size();
  var st = stageRect();
  drawTexture(st);
  drawTrace(st);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Collapsed for Half-Speed').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Collapsed for Half-Speed').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 19').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Collapsed for Half-Speed', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 19', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    loopIndex: function () { return loopIndex(phaseT); },
    decay: function () { return decayAt(phaseT); },
    harmonics: function () { return harmonicsAt(phaseT); },
    bloom: function (j) { return bloomAt(j, phaseT); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: t = 52 s, loop 2 of a 24 s cycle, trace already thinned
   to 0.74 of full strength with 4 of 5 harmonics, fragments 2 and 7
   mid-resurface ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
