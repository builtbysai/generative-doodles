<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peripheral Score</title>
<style>
html, body { margin: 0; padding: 0; background: #5A564A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Peripheral Score: an extreme close-up of weathered rock fills the frame.
   A thin reading head, a vertical hairline, drifts across the surface;
   wherever it passes, dark pits and pale veins turn into score marks
   (dots, slurs, dynamic wedges) on a translucent staff that follows the
   head. The marks shiver as if just played, then settle back into rock.
   New texture scrolls in from the right as the head advances. Drag
   horizontally to steer the reading head; release and it drifts on. */
var TAU = Math.PI * 2;
var GROUND = '#5A564A';
var ROCK_A = '#7A7568';
var ROCK_B = '#8A8578';
var ROCK_DARK = '#55524A';
var ROCK_PALE = '#B8B2A4';
var PIT = '#3A372F';
var VEIN = '#C9C2B0';
var LICHEN_GREEN = '#A8B08A';
var LICHEN_RUST = '#A96A45';
var MARK = '#1A1815';
var HAIR = '#F5F2EA';
var PLATE = '#1A1815';
var PLATE_LINE = 'rgba(245,242,234,0.25)';
var TITLE_INK = '#F5F2EA';
var HINT_INK = '#CFC8B8';
var FRAME_T = 9.0;        /* fixed phase: head mid frame, marks already sounding */
var DRIFT = 22;           /* head advance, world units per second */
var TILE_W = 160;         /* world units per texture tile */
var HEAD_W0 = 1600;       /* head world position at frame one */
var K = 1;                /* world units to screen px scale, set per frame */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mixHex(h1, h2, f) {
  var a = hexRgb(h1), b = hexRgb(h2);
  var r = Math.round(lerp(a[0], b[0], f));
  var g = Math.round(lerp(a[1], b[1], f));
  var bl = Math.round(lerp(a[2], b[2], f));
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var headW = HEAD_W0;      /* head world position */
var prevHeadW = HEAD_W0;
var headFrac = 0.42;      /* head screen position as fraction of field width */
var dragging = false;
var glyphs = [];          /* {wx, wy, kind, size, birth, ph} */
/* ---- procedural rock: one tile's features, seeded by absolute tile index ---- */
var tileCache = {};
function tileFeatures(ti) {
  if (tileCache[ti]) return tileCache[ti];
  var rng = mulberry32(1877 + ti * 7919);
  var f = { base: rng(), blotches: [], pits: [], veins: [], lichen: [], speckle: [] };
  var i, j;
  for (i = 0; i < 16; i++) {
    f.blotches.push({ x: rng() * TILE_W, y: rng() * 900, rx: 18 + rng() * 55, ry: 12 + rng() * 40, tone: rng(), a: 0.06 + rng() * 0.10 });
  }
  for (i = 0; i < 26; i++) {
    f.speckle.push({ x: rng() * TILE_W, y: rng() * 900, r: 0.6 + rng() * 1.6, dark: rng() < 0.5, a: 0.08 + rng() * 0.10 });
  }
  for (i = 0; i < 9; i++) {
    f.pits.push({ x: rng() * TILE_W, y: rng() * 900, rx: 2 + rng() * 7, ry: 1.5 + rng() * 5, a: 0.45 + rng() * 0.35 });
  }
  for (i = 0; i < 3; i++) {
    var pts = [];
    var vx = rng() * TILE_W, vy = rng() * 900;
    for (j = 0; j < 5; j++) { pts.push({ x: vx, y: vy }); vx += (rng() - 0.35) * 46; vy += (rng() - 0.5) * 60; }
    f.veins.push({ pts: pts, w: 0.8 + rng() * 1.4, a: 0.35 + rng() * 0.25 });
  }
  for (i = 0; i < 4; i++) {
    f.lichen.push({ x: rng() * TILE_W, y: rng() * 900, r: 8 + rng() * 16, green: rng() < 0.55, a: 0.28 + rng() * 0.16 });
  }
  tileCache[ti] = f;
  return f;
}
/* A feature's world x and y (y in world units where the field height is 900). */
function featureList(ti) {
  var f = tileFeatures(ti);
  var out = [], i;
  for (i = 0; i < f.pits.length; i++) out.push({ wx: ti * TILE_W + f.pits[i].x, wy: f.pits[i].y, kind: 'dot', size: 3 + f.pits[i].rx * 0.9 });
  for (i = 0; i < f.veins.length; i++) {
    var mid = f.veins[i].pts[2];
    out.push({ wx: ti * TILE_W + mid.x, wy: mid.y, kind: 'slur', size: 14 + f.veins[i].w * 8 });
  }
  for (i = 0; i < f.lichen.length; i++) out.push({ wx: ti * TILE_W + f.lichen[i].x, wy: f.lichen[i].y, kind: 'wedge', size: 10 + f.lichen[i].r });
  return out;
}
function staffY(wy, ph) {
  /* Score marks sit on the staff: quantize the feature height to the
     nearest of the three staff lines (450 +/- 46 units) with a small
     deterministic offset, so every mark reads as notation, not rock. */
  var line = 450 + clamp(Math.round((wy - 450) / 46), -1, 1) * 46;
  return line + Math.sin(ph) * 6;
}
function emitGlyph(feat, birth) {
  var ph = (feat.wx * 0.37 + feat.wy * 0.11) % TAU;
  glyphs.push({ wx: feat.wx, wy: staffY(feat.wy, ph), kind: feat.kind, size: feat.size, birth: birth, ph: ph });
  playGlyph(feat.kind);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- audio: Karplus-Strong ticks and scrapes, lazily inside the first drag ---- */
var audioCtx = null, masterGain = null;
function ensureAudio() {
  if (audioCtx) return true;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.22;
    masterGain.connect(audioCtx.destination);
    return true;
  } catch (e) { return false; }
}
function ksPluck(freq, dur, bright) {
  if (!audioCtx) return;
  try {
    var sr = audioCtx.sampleRate;
    var n = Math.floor(sr * dur);
    var period = Math.max(2, Math.round(sr / freq));
    var buf = audioCtx.createBuffer(1, n, sr);
    var d = buf.getChannelData(0);
    var ring = new Float32Array(period);
    var i;
    for (i = 0; i < period; i++) ring[i] = Math.random() * 2 - 1;
    var idx = 0;
    for (i = 0; i < n; i++) {
      var cur = ring[idx];
      var nxt = ring[(idx + 1) % period];
      d[i] = cur * (1 - i / n);
      ring[idx] = (cur + nxt) * 0.5 * bright;
      idx = (idx + 1) % period;
    }
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(masterGain);
    src.start();
  } catch (e) { /* audio is decorative; never break the visual */ }
}
function playGlyph(kind) {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (kind === 'dot') ksPluck(620 + (headW % 90), 0.18, 0.996);
    else if (kind === 'slur') ksPluck(330 + (headW % 70), 0.42, 0.992);
    else ksPluck(180 + (headW % 50), 0.55, 0.985);
  } catch (e) { /* ignore */ }
}
/* ---- interaction: drag steers the head; release resumes its own drift ---- */
function pointerFrac(ev) {
  var sc = fieldRect();
  var x = 0;
  if (typeof ev.clientX !== 'undefined') x = ev.clientX;
  else if (ev.touches && ev.touches[0]) x = ev.touches[0].clientX;
  return clamp((x - sc.x) / sc.w, 0.12, 0.88);
}
function onDown(ev) {
  dragging = true;
  ensureAudio();
  headFrac = pointerFrac(ev);
  if (ev.preventDefault) ev.preventDefault();
}
function onMove(ev) {
  if (!dragging) return;
  headFrac = pointerFrac(ev);
  if (ev.preventDefault) ev.preventDefault();
}
function onUp() { dragging = false; }
try {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown);
  canvas.addEventListener('touchmove', onMove);
  canvas.addEventListener('touchend', onUp);
} catch (e) { /* node-canvas shim keeps listeners; no-op here */ }
function drawTile(ti, sc) {
  var f = tileFeatures(ti);
  var x0 = sc.x + (ti * TILE_W - scrollUnits()) * K;
  var w = TILE_W * K;
  var h = sc.h;
  var i, j;
  /* One uniform base for every tile: per-tile tints left faint straight
     seams at tile edges. All variation comes from the blotches. */
  ctx.fillStyle = mixHex(ROCK_A, ROCK_B, 0.5);
  ctx.fillRect(x0, sc.y, w + 1, h);
  var by, bx;
  for (i = 0; i < f.speckle.length; i++) {
    var sp = f.speckle[i];
    ctx.fillStyle = rgba(sp.dark ? ROCK_DARK : ROCK_PALE, sp.a);
    ctx.beginPath();
    ctx.moveTo(x0 + (sp.x + sp.r) * K, sc.y + (sp.y / 900) * h);
    ctx.arc(x0 + sp.x * K, sc.y + (sp.y / 900) * h, Math.max(0.5, sp.r * K), 0, TAU);
    ctx.fill();
  }
  for (i = 0; i < f.blotches.length; i++) {
    var b = f.blotches[i];
    bx = x0 + b.x * K; by = sc.y + (b.y / 900) * h;
    ctx.fillStyle = b.tone < 0.5 ? rgba(ROCK_DARK, b.a) : rgba(ROCK_PALE, b.a);
    ctx.beginPath();
    ctx.moveTo(bx + b.rx * K, by);
    ctx.ellipse(bx, by, Math.max(1, b.rx * K), Math.max(1, b.ry * K), 0, 0, TAU);
    ctx.fill();
  }
  for (i = 0; i < f.pits.length; i++) {
    var p = f.pits[i];
    bx = x0 + p.x * K; by = sc.y + (p.y / 900) * h;
    ctx.fillStyle = rgba(PIT, p.a);
    ctx.beginPath();
    ctx.moveTo(bx + p.rx * K, by);
    ctx.ellipse(bx, by, Math.max(0.6, p.rx * K), Math.max(0.6, p.ry * K), 0, 0, TAU);
    ctx.fill();
  }
  for (i = 0; i < f.veins.length; i++) {
    var v = f.veins[i];
    ctx.strokeStyle = rgba(VEIN, v.a);
    ctx.lineWidth = Math.max(0.75, v.w * K);
    ctx.beginPath();
    ctx.moveTo(x0 + v.pts[0].x * K, sc.y + (v.pts[0].y / 900) * h);
    for (j = 1; j < v.pts.length; j++) ctx.lineTo(x0 + v.pts[j].x * K, sc.y + (v.pts[j].y / 900) * h);
    ctx.stroke();
  }
  for (i = 0; i < f.lichen.length; i++) {
    var l = f.lichen[i];
    bx = x0 + l.x * K; by = sc.y + (l.y / 900) * h;
    ctx.fillStyle = rgba(l.green ? LICHEN_GREEN : LICHEN_RUST, l.a);
    var q;
    for (q = 0; q < 3; q++) {
      var ox = (q - 1) * l.r * 0.5 * K, oy = (q % 2 ? 1 : -1) * l.r * 0.3 * K;
      ctx.beginPath();
      ctx.moveTo(bx + ox + l.r * K * 0.7, by + oy);
      ctx.ellipse(bx + ox, by + oy, Math.max(1, l.r * K * 0.7), Math.max(1, l.r * K * 0.5), 0, 0, TAU);
      ctx.fill();
    }
  }
}
function scrollUnits() { return headW - headFrac * (fieldRect().w / K); }
function drawGlyph(g, sc, t) {
  var x = sc.x + (g.wx - scrollUnits()) * K;
  var y = sc.y + (g.wy / 900) * sc.h;
  var age = t - g.birth;
  if (age < 0 || age > 3.0) return;
  var decay = clamp(1 - age / 1.2, 0, 1);
  var shiver = reduced ? 0 : decay;
  var dx = shiver * 1.6 * K * Math.sin(t * 7.0 + g.ph);
  var dy = shiver * 1.1 * K * Math.cos(t * 6.3 + g.ph * 1.7);
  var alpha = age < 2.2 ? 0.92 : 0.92 * (1 - (age - 2.2) / 0.8);
  var s = g.size * K;
  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.translate(x + dx, y + dy);
  if (g.kind === 'dot') {
    ctx.fillStyle = MARK;
    ctx.beginPath();
    ctx.moveTo(s, 0);
    ctx.arc(0, 0, Math.max(1, s), 0, TAU);
    ctx.fill();
  } else if (g.kind === 'slur') {
    ctx.strokeStyle = MARK;
    ctx.lineWidth = Math.max(1, 1.6 * K);
    ctx.beginPath();
    ctx.moveTo(-s, -s * 0.3);
    ctx.arc(0, s * 0.5, s, Math.PI * 1.15, Math.PI * 1.85, false);
    ctx.stroke();
  } else {
    ctx.fillStyle = MARK;
    ctx.beginPath();
    ctx.moveTo(-s, -s * 0.45);
    ctx.lineTo(s, 0);
    ctx.lineTo(-s, s * 0.45);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Peripheral Score').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Peripheral Score').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 03').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Peripheral Score', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 03', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to steer the reading head.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  K = Math.min(sc.w, sc.h) / 900;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.beginPath();
  ctx.rect(sc.x, sc.y, sc.w, sc.h);
  ctx.clip();
  /* rock tiles covering the field, scrolling in from the right */
  var firstTi = Math.floor(scrollUnits() / TILE_W) - 1;
  var lastTi = Math.ceil((scrollUnits() + sc.w / K) / TILE_W) + 1;
  var ti;
  for (ti = firstTi; ti <= lastTi; ti++) drawTile(ti, sc);
  /* translucent staff following the head */
  var hx = sc.x + headFrac * sc.w;
  var cy = sc.y + sc.h * 0.5;
  var staffHalf = 190 * K + sc.w * 0.05;
  ctx.fillStyle = rgba(HAIR, 0.05);
  ctx.fillRect(hx - staffHalf, sc.y + (380 / 900) * sc.h, staffHalf * 2, (140 / 900) * sc.h);
  ctx.strokeStyle = rgba(HAIR, 0.28);
  ctx.lineWidth = Math.max(0.75, 1 * K);
  var ln, ly;
  for (ln = -1; ln <= 1; ln++) {
    ly = sc.y + ((450 + ln * 46) / 900) * sc.h;
    ctx.beginPath();
    ctx.moveTo(hx - staffHalf, ly);
    ctx.lineTo(hx + staffHalf, ly);
    ctx.stroke();
  }
  /* score marks: shiver, then settle back into rock */
  var i;
  for (i = glyphs.length - 1; i >= 0; i--) {
    if (t - glyphs[i].birth > 3.0) glyphs.splice(i, 1);
  }
  for (i = 0; i < glyphs.length; i++) drawGlyph(glyphs[i], sc, t);
  /* the reading head: the only vertical element */
  ctx.strokeStyle = rgba(HAIR, 0.95);
  ctx.lineWidth = Math.max(1, 1.4 * K);
  ctx.beginPath();
  ctx.moveTo(hx, sc.y);
  ctx.lineTo(hx, sc.y + sc.h);
  ctx.stroke();
  ctx.fillStyle = rgba(HAIR, 0.9);
  ctx.beginPath();
  ctx.moveTo(hx - 5 * K, sc.y + 8 * K);
  ctx.lineTo(hx + 5 * K, sc.y + 8 * K);
  ctx.lineTo(hx, sc.y + 16 * K);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  drawPlates();
}
/* ---- frame one: fixed phase, head at 0.42, marks already sounding ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
/* Pre-seed glyphs from features the head has just passed, fixed ages so
   frame one is reproducible: no Date.now, no Math.random in the visual. */
(function seedFrameOne() {
  var feats = [];
  var ti;
  for (ti = Math.floor((HEAD_W0 - 240) / TILE_W); ti <= Math.floor(HEAD_W0 / TILE_W); ti++) {
    var fl = featureList(ti);
    var j;
    for (j = 0; j < fl.length; j++) if (fl[j].wx <= HEAD_W0 && fl[j].wx >= HEAD_W0 - 240) feats.push(fl[j]);
  }
  feats.sort(function (a, b) { return a.wx - b.wx; });
  var k;
  for (k = 0; k < feats.length && k < 8; k++) {
    var f = feats[k];
    var ph = (f.wx * 0.37 + f.wy * 0.11) % TAU;
    glyphs.push({ wx: f.wx, wy: staffY(f.wy, ph), kind: f.kind, size: f.size, birth: FRAME_T - (0.3 + k * 0.22), ph: ph });
  }
})();
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      prevHeadW = headW;
      headW += DRIFT * dt;
      if (!dragging) {
        var target = 0.42 + 0.10 * Math.sin(phaseT * 0.05);
        headFrac += (target - headFrac) * Math.min(1, dt * 0.8);
      }
      /* emit glyphs for features the head has just crossed */
      var ti, fl, j;
      var lo = Math.floor(prevHeadW / TILE_W) - 1, hi = Math.floor(headW / TILE_W) + 1;
      for (ti = lo; ti <= hi; ti++) {
        fl = featureList(ti);
        for (j = 0; j < fl.length; j++) {
          if (fl[j].wx > prevHeadW && fl[j].wx <= headW) emitGlyph(fl[j], phaseT);
        }
      }
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
