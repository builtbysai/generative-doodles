<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rêve Parisien</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0C0D10; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// Reve Parisien - EXPANSION #100 rhys-chatham, PP7.
// Two foggy silver panels (the Kassay silver engine borrowed: layered
// flat silver tones, seeded weave speckle, per-cell oxidation field,
// soft reflection patches). A thin bright trace, the trumpet line,
// arcs across both panels as a bezier phrase; a new phrase is drawn
// every 8 s. Drag is the viewer's passage: the reflection field on
// both panels shifts and the trace bends toward the drag, then both
// relax home. Double-tap reseeds the phrase sequence.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function parseC(h) {
  if (h.charAt(0) === "#") return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  var m = h.match(/\d+/g);
  return [Number(m[0]), Number(m[1]), Number(m[2])];
}
function mix(h1, h2, f) {
  var a = parseC(h1);
  var b = parseC(h2);
  return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * f) + "," +
                  Math.round(a[1] + (b[1] - a[1]) * f) + "," +
                  Math.round(a[2] + (b[2] - a[2]) * f) + ")";
}

// Palette (strict). Silver tones are mixes of SILVER toward the ground;
// the single lighter mix goes toward the trace tone (the brightest
// reflection), recorded in process.md.
var GROUND = "#0C0D10";
var SILVER = "#B9BEC4";
var SILVER_LT = mix(SILVER, "#F5F2E8", 0.30);
var SILVER_DIM = mix(SILVER, GROUND, 0.22);
var SILVER_DEEP = mix(SILVER, GROUND, 0.48);
var WEAVE = mix(SILVER, GROUND, 0.16);
var OX = "#8A5A2A";
var OX_DEEP = mix(OX, GROUND, 0.45);
var TRACE = "#F5F2E8";
var WARM = mix(SILVER, OX, 0.18); // warm reflection patch

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
  DPR = window.devicePixelRatio || 1;
  W = Math.round(w); H = Math.round(h);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", function () { resize(); draw(now()); });
window.addEventListener("resize", function () { resize(); draw(now()); });

// ---------- per-panel seeded data (panel-relative units, 0..1) ----------
function makePanel(seed, mirror) {
  var rng = mulberry32(seed);
  function makeJit(layers, amt) {
    var arr = [];
    for (var i = 0; i < layers; i++) arr.push({ x: (rng() * 2 - 1) * amt, y: (rng() * 2 - 1) * amt });
    return arr;
  }
  var p = {};
  // Clouding in the silver itself. depth = parallax under reflection shift.
  p.clouds = [];
  for (var i = 0; i < 18; i++) {
    p.clouds.push({
      x: rng(), y: rng(), r: 0.18 + rng() * 0.30,
      tone: rng() < 0.5 ? SILVER_LT : SILVER_DIM, a: 0.05 + rng() * 0.05, depth: 0.10,
      jit: makeJit(12, 0.03)
    });
  }
  // Reflection field: bright and dim patches that shift with the viewer.
  p.patches = [
    { kind: "rect", x: 0.16, y: 0.10, w: 0.40, h: 0.34, tone: SILVER_LT, a: 0.40, layers: 16, depth: 1.00 },
    { kind: "blob", x: 0.72, y: 0.22, rx: 0.30, ry: 0.13, tone: WARM, a: 0.28, layers: 15, depth: 0.65 },
    { kind: "blob", x: 0.30, y: 0.78, rx: 0.30, ry: 0.15, tone: SILVER_DEEP, a: 0.30, layers: 15, depth: 0.58 },
    { kind: "rect", x: 0.60, y: 0.52, w: 0.26, h: 0.40, tone: SILVER_DEEP, a: 0.24, layers: 16, depth: 0.50 }
  ];
  if (mirror) {
    for (var mi = 0; mi < p.patches.length; mi++) {
      var mp = p.patches[mi];
      if (mp.kind === "rect") mp.x = 1 - mp.x - mp.w; else mp.x = 1 - mp.x;
    }
  }
  for (var r = 0; r < p.patches.length; r++) p.patches[r].jit = makeJit(p.patches[r].layers, 0.012);
  // Weave speckle.
  p.weave = [];
  for (var j = 0; j < 1500; j++) {
    p.weave.push({ x: rng(), y: rng(), s: 0.6 + rng() * 1.1, tone: rng() < 0.6 ? WEAVE : SILVER_DIM, a: 0.06 + rng() * 0.06, depth: 0.15 });
  }
  // Oxidation: per-cell threshold field on the edge bands (the No.808/809
  // construction). Alpha = seeded low-frequency noise x inward falloff;
  // cells are small overlapping rects at low alpha, so the stain reads
  // as one continuous creep with no round units.
  var noiseGrid = [];
  for (var ng = 0; ng < 32 * 32; ng++) noiseGrid.push(rng());
  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
    function gv(ii, jj) { return noiseGrid[((jj & 31) << 5) + (ii & 31)]; }
    var na = gv(xi, yi), nb = gv(xi + 1, yi), nc = gv(xi, yi + 1), nd = gv(xi + 1, yi + 1);
    return na + (nb - na) * sx + (nc - na) * sy + (na - nb - nc + nd) * sx * sy;
  }
  p.stain = [];
  function stainBand(edge, depth, seedOff) {
    var passes = [
      { step: 0.030, aMax: 0.32, frontMul: 1.00 },
      { step: 0.014, aMax: 0.17, frontMul: 1.07 }
    ];
    for (var pi = 0; pi < passes.length; pi++) {
      var P = passes[pi];
      var cols = Math.ceil(1 / P.step), rows = Math.ceil(depth / P.step);
      for (var i2 = 0; i2 < cols; i2++) {
        for (var j2 = 0; j2 < rows; j2++) {
          var u = (i2 + 0.5) * P.step, d = (j2 + 0.5) * P.step;
          var reach = depth * (0.55 + 0.75 * vnoise(u * 5 + seedOff, seedOff * 3.1)) * P.frontMul;
          if (d > reach) continue;
          var inten = 1 - d / reach;
          var mott = 0.55 + 0.65 * vnoise(u * 9 + seedOff * 7.3, d * 12 + seedOff);
          var a = P.aMax * Math.pow(inten, 1.35) * mott * (0.8 + 0.4 * rng());
          if (a < 0.015) continue;
          var ju = (rng() * 2 - 1) * P.step * 0.45, jd = (rng() * 2 - 1) * P.step * 0.45;
          var cell = { tone: mix(OX, OX_DEEP, Math.min(1, inten * 1.15)), a: a, s: P.step * 2.0 };
          if (edge === "top") { cell.x = u + ju; cell.y = d + jd; }
          else if (edge === "bottom") { cell.x = u + ju; cell.y = 1 - d + jd; }
          else if (edge === "left") { cell.x = d + jd; cell.y = u + ju; }
          else { cell.x = 1 - d + jd; cell.y = u + ju; }
          p.stain.push(cell);
        }
      }
    }
  }
  stainBand("top", 0.20, seed * 0.001);
  stainBand("bottom", 0.18, seed * 0.001 + 11.7);
  return p;
}
var panels = [makePanel(822101, false), makePanel(822202, true)];
// Outer vertical edges get the deeper creep, inner edges a lighter one.
panels[0].edgeDepths = { left: 0.17, right: 0.09 };
panels[1].edgeDepths = { left: 0.09, right: 0.17 };
(function addVerticalStains() {
  // Rebuild stain bands for the vertical edges with per-panel depths by
  // regenerating panels' stain lists is overkill; instead the horizontal
  // bands above carry the creep and thin vertical strips are added here
  // from each panel's own seeded stream.
  for (var pi = 0; pi < 2; pi++) {
    var rng = mulberry32(822310 + pi * 77);
    var p = panels[pi];
    var edges = ["left", "right"];
    for (var ei = 0; ei < 2; ei++) {
      var depth = p.edgeDepths[edges[ei]];
      var step = 0.016;
      var cols = Math.ceil(depth / step), rows = Math.ceil(1 / step);
      for (var i2 = 0; i2 < rows; i2++) {
        for (var j2 = 0; j2 < cols; j2++) {
          var u = (i2 + 0.5) * step, d = (j2 + 0.5) * step;
          var reach = depth * (0.5 + 0.8 * rng());
          if (d > reach) continue;
          var inten = 1 - d / reach;
          var a = 0.24 * Math.pow(inten, 1.4) * (0.5 + 0.7 * rng());
          if (a < 0.015) continue;
          var ju = (rng() * 2 - 1) * step * 0.45, jd = (rng() * 2 - 1) * step * 0.45;
          var cell = { tone: mix(OX, OX_DEEP, Math.min(1, inten * 1.15)), a: a, s: step * 2.0 };
          if (edges[ei] === "left") { cell.x = d + jd; cell.y = u + ju; }
          else { cell.x = 1 - d + jd; cell.y = u + ju; }
          p.stain.push(cell);
        }
      }
    }
  }
})();

// ---------- phrases: seeded function of (seed, phrase index) ----------
var PHRASE_LEN = 8, DRAW_IN = 1.5;
var BASE_SEED = 822001;
var segments = [{ tStart: -2, seed: BASE_SEED }]; // clock anchored at -2: phrase 0 is complete at t=0
var reseeds = 0;

function phraseAnchors(seed, k) {
  var rng = mulberry32(seed + k * 7919);
  var m = 5;
  var flip = rng() < 0.4 ? -1 : 1; // some phrases dip instead of arc
  var lift = 0.20 + rng() * 0.14;
  var base = 0.46 + (rng() * 2 - 1) * 0.08;
  var anchors = [];
  for (var i = 0; i < m; i++) {
    var f = i / (m - 1);
    var x = 0.05 + 0.90 * f + (rng() * 2 - 1) * 0.03;
    var y = base - flip * lift * Math.sin(Math.PI * f) + (rng() * 2 - 1) * 0.13;
    y = Math.max(0.10, Math.min(0.90, y));
    anchors.push({ x: x, y: y });
  }
  return anchors;
}
// Catmull-Rom sampling of the anchors into a polyline (composition units).
function samplePhrase(anchors, bendX, bendY) {
  var m = anchors.length;
  var pts = [];
  function A(i) {
    var a = anchors[Math.max(0, Math.min(m - 1, i))];
    var wgt = Math.sin(Math.PI * (Math.max(0, Math.min(m - 1, i)) / (m - 1)));
    return { x: a.x + bendX * wgt, y: a.y + bendY * wgt * 0.7 };
  }
  var STEPS = 28;
  for (var s = 0; s < m - 1; s++) {
    var p0 = A(s - 1), p1 = A(s), p2 = A(s + 1), p3 = A(s + 2);
    for (var j = 0; j < STEPS; j++) {
      var t = j / STEPS, t2 = t * t, t3 = t2 * t;
      pts.push({
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
      });
    }
  }
  var last = A(m - 1);
  pts.push({ x: last.x, y: last.y });
  return pts;
}
function phraseState(t) {
  var seg = segments[0];
  for (var i = 0; i < segments.length; i++) if (t >= segments[i].tStart) seg = segments[i];
  var local = t - seg.tStart;
  var k = Math.floor(local / PHRASE_LEN);
  var inPhrase = local - k * PHRASE_LEN;
  return { seed: seg.seed, k: k, progress: Math.min(1, inPhrase / DRAW_IN), fading: inPhrase < DRAW_IN && k > 0 };
}

// ---------- drag state: closed form of (drag samples, t) ----------
var drags = []; // {t0, t1, dx, dy} in CSS px deltas
var active = null;
var T0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
function now() { return (((typeof performance !== "undefined" && performance.now) ? performance.now() : 0) - T0) / 1000; }

function dragOffset(t) {
  var ox = 0, oy = 0;
  for (var i = 0; i < drags.length; i++) {
    var d = drags[i];
    if (t < d.t0) continue;
    if (d.t1 === null || t <= d.t1) { ox += d.dx; oy += d.dy; }
    else {
      var k = Math.exp(-(t - d.t1) / 1.6);
      ox += d.dx * k; oy += d.dy * k;
    }
  }
  return { x: ox, y: oy };
}
// Idle sway of the reflection field: zero at t=0 (settled at center),
// never still afterwards - the panels are never frozen flat grey.
function sway(t) {
  return {
    x: (Math.sin(t * 0.10) + 0.6 * Math.sin(t * 0.043)) * 0.016,
    y: Math.sin(t * 0.073) * 0.010
  };
}

function softRect(x, y, w, h, tone, alpha, layers, jit) {
  ctx.fillStyle = tone;
  for (var i = 0; i < layers; i++) {
    var f = i / layers;
    var inset = f * 0.34;
    var jx = jit ? jit[i].x * w : 0, jy = jit ? jit[i].y * h : 0;
    ctx.globalAlpha = alpha / layers * 1.9;
    ctx.fillRect(x + w * inset * 0.5 + jx, y + h * inset * 0.5 + jy, w * (1 - inset), h * (1 - inset));
  }
  ctx.globalAlpha = 1;
}
function softBlob(cx, cy, rx, ry, tone, alpha, layers, jit) {
  ctx.fillStyle = tone;
  for (var i = 0; i < layers; i++) {
    var f = i / layers;
    var jx = jit ? jit[i].x * rx * 2 : 0, jy = jit ? jit[i].y * ry * 2 : 0;
    ctx.globalAlpha = (alpha / layers) * 1.9;
    ctx.beginPath();
    ctx.ellipse(cx + jx, cy + jy, rx * (1 - f * 0.55), ry * (1 - f * 0.55), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPanel(p, px, py, pw, ph, shiftX, shiftY) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(px, py, pw, ph);
  ctx.clip();
  ctx.fillStyle = mix(SILVER, SILVER_DIM, 0.45);
  ctx.fillRect(px, py, pw, ph);
  var i, sh;
  for (i = 0; i < p.clouds.length; i++) {
    sh = p.clouds[i];
    softBlob(px + (sh.x + shiftX * sh.depth) * pw, py + (sh.y + shiftY * sh.depth) * ph,
             sh.r * pw, sh.r * pw, sh.tone, sh.a, 12, sh.jit);
  }
  for (i = 0; i < p.patches.length; i++) {
    sh = p.patches[i];
    var ox = shiftX * sh.depth, oy = shiftY * sh.depth;
    if (sh.kind === "rect") {
      softRect(px + (sh.x + ox) * pw, py + (sh.y + oy) * ph, sh.w * pw, sh.h * ph, sh.tone, sh.a, sh.layers, sh.jit);
    } else {
      softBlob(px + (sh.x + ox) * pw, py + (sh.y + oy) * ph, sh.rx * pw, sh.ry * ph, sh.tone, sh.a, sh.layers, sh.jit);
    }
  }
  for (i = 0; i < p.weave.length; i++) {
    var wv = p.weave[i];
    ctx.globalAlpha = wv.a;
    ctx.fillStyle = wv.tone;
    ctx.fillRect(px + (wv.x + shiftX * wv.depth) * pw, py + (wv.y + shiftY * wv.depth) * ph, wv.s, wv.s * 0.6);
  }
  ctx.globalAlpha = 1;
  for (i = 0; i < p.stain.length; i++) {
    var sc = p.stain[i];
    ctx.globalAlpha = sc.a;
    ctx.fillStyle = sc.tone;
    ctx.fillRect(px + sc.x * pw, py + sc.y * ph, sc.s * pw, sc.s * pw);
  }
  ctx.globalAlpha = 1;
  for (var b = 0; b < 7; b++) {
    ctx.globalAlpha = 0.028;
    ctx.fillStyle = b % 2 ? SILVER_DIM : SILVER_LT;
    ctx.fillRect(px, py + (ph * b) / 7, pw, ph / 7 + 1);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.strokeStyle = mix(SILVER_DEEP, GROUND, 0.3);
  ctx.globalAlpha = 0.6;
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
  ctx.globalAlpha = 1;
}

function strokeTrace(pts, comp, progress, alphaMul) {
  if (progress <= 0 || alphaMul <= 0) return;
  var n = Math.max(2, Math.floor(pts.length * Math.min(1, progress)));
  var passes = [
    { w: 7, a: 0.10 }, { w: 3.2, a: 0.22 }, { w: 1.4, a: 0.95 }
  ];
  ctx.strokeStyle = TRACE;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  for (var pi = 0; pi < passes.length; pi++) {
    ctx.globalAlpha = passes[pi].a * alphaMul;
    ctx.lineWidth = passes[pi].w;
    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var X = comp.x + pts[i].x * comp.w, Y = comp.y + pts[i].y * comp.h;
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function draw(t) {
  if (W === 0) resize();
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  var isPhone = (window.screen && Math.min(window.screen.width, window.screen.height) < 700) || H > W * 1.15;
  // Two tall panels side by side, centered. On phones they shrink and
  // stay paired (recorded in process.md): the dialogue is horizontal.
  var total = Math.min(W * (isPhone ? 0.90 : 0.62), H * (isPhone ? 0.72 : 1.02));
  var gap = total * 0.05;
  var pw = (total - gap) / 2;
  var ph = pw / 0.62;
  if (ph > H * (isPhone ? 0.60 : 0.80)) { ph = H * (isPhone ? 0.60 : 0.80); pw = ph * 0.62; total = pw * 2 + gap; }
  var x0 = (W - total) / 2, y0 = (H - ph) / 2;
  var comp = { x: x0, y: y0, w: total, h: ph };

  // Viewer state: drag offset (decays home after release) + idle sway.
  var d = dragOffset(t);
  var sw = sway(t);
  var shiftX = Math.max(-0.11, Math.min(0.11, d.x / Math.max(total, 1) * 0.55 + sw.x));
  var shiftY = Math.max(-0.08, Math.min(0.08, d.y / Math.max(ph, 1) * 0.4 + sw.y));
  var bendX = Math.max(-0.16, Math.min(0.16, d.x / Math.max(total, 1) * 0.5));
  var bendY = Math.max(-0.12, Math.min(0.12, d.y / Math.max(ph, 1) * 0.45));

  // Float shadows.
  for (var s = 6; s >= 1; s--) {
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = "#000000";
    ctx.fillRect(x0 + s * 2.2, y0 + s * 3.0, total, ph);
  }
  ctx.globalAlpha = 1;

  drawPanel(panels[0], x0, y0, pw, ph, shiftX, shiftY);
  drawPanel(panels[1], x0 + pw + gap, y0, pw, ph, shiftX * 0.85, shiftY);

  // The trumpet line: current phrase (drawing in), previous fading out.
  var st = phraseState(t);
  if (st.fading) {
    strokeTrace(samplePhrase(phraseAnchors(st.seed, st.k - 1), bendX, bendY), comp, 1, 1 - st.progress);
  }
  strokeTrace(samplePhrase(phraseAnchors(st.seed, st.k), bendX, bendY), comp, st.progress, 1);
}

// ---------- pointer: drag is the viewer's passage; double-tap reseeds ----------
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
function ptr(e) { return { x: e.clientX, y: e.clientY }; }
canvas.addEventListener("pointerdown", function (e) {
  var p = ptr(e), t = now();
  if (t - lastTapT < 0.35 && Math.abs(p.x - lastTapX) < 40 && Math.abs(p.y - lastTapY) < 40) {
    // Double-tap: reseed the phrase sequence from now.
    reseeds++;
    segments.push({ tStart: t, seed: BASE_SEED + reseeds * 104729 });
    lastTapT = -10;
    return;
  }
  lastTapT = t; lastTapX = p.x; lastTapY = p.y;
  active = { t0: t, t1: null, dx: 0, dy: 0, lx: p.x, ly: p.y };
  drags.push(active);
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener("pointermove", function (e) {
  if (!active) return;
  var p = ptr(e);
  active.dx += (p.x - active.lx);
  active.dy += (p.y - active.ly);
  active.lx = p.x; active.ly = p.y;
});
function endDrag() { if (active) { active.t1 = now(); active = null; } }
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

resize();
draw(0);
if (typeof requestAnimationFrame !== "undefined") {
  var loop = function () { draw(now()); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
