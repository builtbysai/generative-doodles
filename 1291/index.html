<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suspended Canopy</title>
<style>
  html, body { margin: 0; padding: 0; background: #101F36; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (no Math.random anywhere) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1291);

  // ---------- palette (ST4, verbatim) ----------
  var INDIGO = '#1E3A5F', GHOST = '#B9C8DA', FOLD = '#101F36';
  var MIRROR = '#E8EEF4', COTTON = '#E7DCC6', CABLE = '#14161A';

  // ---------- sizing (Visual Viewport API, never innerWidth alone) ----------
  var W = 0, H = 0;
  function viewport() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width && window.visualViewport.height) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: w, h: h };
  }
  function isPhone() {
    if (typeof window !== 'undefined' && window.screen &&
        window.screen.width && window.screen.height) {
      return Math.min(window.screen.width, window.screen.height) < 700;
    }
    return H > W * 1.15;
  }
  function size() {
    var vp = viewport();
    W = vp.w; H = vp.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---------- cloth geometry (rebuilt on resize, seeded) ----------
  var COLS = 8, ROWS = 24;
  var cloths = [];
  var suspY = 0, floorY = 0;

  function build() {
    var phone = isPhone();
    suspY = Math.floor(H * 0.15);
    floorY = Math.floor(H * 0.84);
    var drop = floorY - suspY;
    var margin = phone ? Math.floor(W * 0.03) : Math.floor(W * 0.07);
    var avail = W - margin * 2;
    // width units: one cloth double-width (units 1, 2, 1, 1.2), gaps 0.35 units
    var units = [1, 2, 1, 1.2];
    var gapU = 0.35;
    var totalU = units[0] + units[1] + units[2] + units[3] + gapU * 3;
    var unit = avail / totalU;
    var gap = gapU * unit;
    cloths = [];
    var x = margin;
    for (var ci = 0; ci < 4; ci++) {
      var wdt = units[ci] * unit;
      var phase = rnd() * Math.PI * 2;
      var lean = (rnd() - 0.5) * 14;
      var foldDir = rnd() < 0.5 ? -1 : 1;
      var totalLen = drop * 1.18;
      var colStep = wdt / (COLS - 1);
      var rowStep = totalLen / (ROWS - 1);
      var pts = [];
      for (var r = 0; r < ROWS; r++) {
        var s = r * rowStep;
        var row = [];
        for (var c = 0; c < COLS; c++) {
          var v = r / (ROWS - 1);
          var sway = Math.sin(v * 2.6 + phase) * (3 + v * 9) + lean * v;
          var px, py;
          if (s <= drop) {
            px = x + c * colStep + sway;
            py = suspY + s;
          } else {
            // pooled tail: lies along the floor, folding outward with ripples
            var ex = s - drop;
            px = x + c * colStep + sway + foldDir * ex * 0.5;
            py = floorY + 2.5 * Math.sin(ex * 0.35) + 1.5 * Math.sin(ex * 0.8) - ex * 0.05;
          }
          row.push({ x: px, y: py, px: px, py: py });
        }
        pts.push(row);
      }
      // ghost-resist marks, parented to the mesh in (u, v) coords
      var marks = [];
      var nMarks = 10 + Math.floor(rnd() * 6);
      for (var mi = 0; mi < nMarks; mi++) {
        marks.push({
          u: 0.08 + rnd() * 0.84,
          v: 0.06 + rnd() * 0.80,
          type: Math.floor(rnd() * 4),
          size: 5 + rnd() * 10,
          rot: (rnd() - 0.5) * 0.9,
          alpha: 0.22 + rnd() * 0.20
        });
      }
      // mirror dots, 2-4 per cloth
      var mirrors = [];
      var nMir = 2 + Math.floor(rnd() * 3);
      for (var mi2 = 0; mi2 < nMir; mi2++) {
        mirrors.push({
          u: 0.12 + rnd() * 0.76,
          v: 0.10 + rnd() * 0.72,
          size: 6 + rnd() * 6
        });
      }
      cloths.push({
        left: x, width: wdt, phase: phase, points: pts,
        colStep: colStep, rowStep: rowStep, drop: drop,
        totalLen: totalLen, marks: marks, mirrors: mirrors,
        hem: (ci === 0 || ci === 2)
      });
      x += wdt + gap;
    }
  }

  // bilinear mesh lookup for marks parented to the cloth
  function meshAt(cl, u, v) {
    var cf = u * (COLS - 1), rf = v * (ROWS - 1);
    var c0 = Math.floor(cf), r0 = Math.floor(rf);
    if (c0 >= COLS - 1) c0 = COLS - 2;
    if (r0 >= ROWS - 1) r0 = ROWS - 2;
    var fu = cf - c0, fv = rf - r0;
    var p00 = cl.points[r0][c0], p10 = cl.points[r0][c0 + 1];
    var p01 = cl.points[r0 + 1][c0], p11 = cl.points[r0 + 1][c0 + 1];
    var tx = p00.x * (1 - fu) * (1 - fv) + p10.x * fu * (1 - fv) +
             p01.x * (1 - fu) * fv + p11.x * fu * fv;
    var ty = p00.y * (1 - fu) * (1 - fv) + p10.y * fu * (1 - fv) +
             p01.y * (1 - fu) * fv + p11.y * fu * fv;
    return { x: tx, y: ty };
  }

  // ---------- draw ----------
  function drawDot(x, y, r, fill) {
    // paired arcs with moveTo first (node-canvas batched-arc quirk)
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function drawCloth(cl) {
    var pts = cl.points;
    // body polygon: left edge down, bottom row right, right edge up
    ctx.beginPath();
    ctx.moveTo(pts[0][0].x, pts[0][0].y);
    for (var r = 1; r < ROWS; r++) ctx.lineTo(pts[r][0].x, pts[r][0].y);
    for (var c = 1; c < COLS; c++) ctx.lineTo(pts[ROWS - 1][c].x, pts[ROWS - 1][c].y);
    for (var r2 = ROWS - 2; r2 >= 0; r2--) ctx.lineTo(pts[r2][COLS - 1].x, pts[r2][COLS - 1].y);
    ctx.closePath();
    ctx.fillStyle = INDIGO;
    ctx.fill();
    // fold shading: translucent dark strips following interior columns
    ctx.strokeStyle = FOLD;
    ctx.globalAlpha = 0.18;
    ctx.lineWidth = Math.max(3, cl.colStep * 0.45);
    ctx.lineJoin = 'round';
    for (var cj = 2; cj < COLS - 1; cj += 2) {
      ctx.beginPath();
      ctx.moveTo(pts[0][cj].x, pts[0][cj].y);
      for (var rr = 1; rr < ROWS; rr++) ctx.lineTo(pts[rr][cj].x, pts[rr][cj].y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // outline
    ctx.strokeStyle = FOLD;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pts[0][0].x, pts[0][0].y);
    for (var r3 = 1; r3 < ROWS; r3++) ctx.lineTo(pts[r3][0].x, pts[r3][0].y);
    for (var c3 = 1; c3 < COLS; c3++) ctx.lineTo(pts[ROWS - 1][c3].x, pts[ROWS - 1][c3].y);
    for (var r4 = ROWS - 2; r4 >= 0; r4--) ctx.lineTo(pts[r4][COLS - 1].x, pts[r4][COLS - 1].y);
    ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 1;
    // ghost-resist marks (deform with the mesh)
    for (var mi = 0; mi < cl.marks.length; mi++) {
      var m = cl.marks[mi];
      var p = meshAt(cl, m.u, m.v);
      var s = m.size;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(m.rot);
      ctx.globalAlpha = m.alpha;
      ctx.strokeStyle = GHOST;
      ctx.lineWidth = 1.2;
      if (m.type === 0) {
        // diamond outline
        ctx.beginPath();
        ctx.moveTo(0, -s); ctx.lineTo(s * 0.7, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.7, 0);
        ctx.closePath(); ctx.stroke();
      } else if (m.type === 1) {
        // cross dashes
        ctx.beginPath();
        ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
        ctx.moveTo(0, -s); ctx.lineTo(0, s);
        ctx.stroke();
      } else if (m.type === 2) {
        // dash cluster
        ctx.beginPath();
        ctx.moveTo(-s, -s * 0.4); ctx.lineTo(-s * 0.2, -s * 0.4);
        ctx.moveTo(s * 0.2, s * 0.3); ctx.lineTo(s, s * 0.3);
        ctx.moveTo(-s * 0.6, s * 0.6); ctx.lineTo(s * 0.4, s * 0.6);
        ctx.stroke();
      } else {
        // small ring (single arc, moveTo first)
        ctx.beginPath();
        ctx.moveTo(s, 0);
        ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // mirror dots: flat diamonds, dark edge
    for (var mi2 = 0; mi2 < cl.mirrors.length; mi2++) {
      var mr = cl.mirrors[mi2];
      var mp = meshAt(cl, mr.u, mr.v);
      var ms = mr.size;
      ctx.beginPath();
      ctx.moveTo(mp.x, mp.y - ms); ctx.lineTo(mp.x + ms * 0.7, mp.y);
      ctx.lineTo(mp.x, mp.y + ms); ctx.lineTo(mp.x - ms * 0.7, mp.y);
      ctx.closePath();
      ctx.fillStyle = MIRROR;
      ctx.fill();
      ctx.strokeStyle = FOLD;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // raw cotton hem on some cloths (last mesh row)
    if (cl.hem) {
      ctx.beginPath();
      ctx.moveTo(pts[ROWS - 1][0].x, pts[ROWS - 1][0].y);
      for (var ch = 1; ch < COLS; ch++) ctx.lineTo(pts[ROWS - 1][ch].x, pts[ROWS - 1][ch].y);
      ctx.strokeStyle = COTTON;
      ctx.globalAlpha = 0.8;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function draw(t) {
    // wall
    ctx.fillStyle = FOLD;
    ctx.fillRect(0, 0, W, H);
    // floor band (matte deep indigo under a dark veil)
    ctx.fillStyle = INDIGO;
    ctx.fillRect(0, floorY, W, H - floorY);
    ctx.fillStyle = FOLD;
    ctx.globalAlpha = 0.45;
    ctx.fillRect(0, floorY, W, H - floorY);
    ctx.globalAlpha = 1;
    // faint floor line
    ctx.fillStyle = COTTON;
    ctx.globalAlpha = 0.12;
    ctx.fillRect(0, floorY, W, 1);
    ctx.globalAlpha = 1;
    // suspension line + cables to the frame top
    ctx.strokeStyle = CABLE;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cloths.length ? cloths[0].left : 0, suspY);
    ctx.lineTo(cloths.length ? cloths[cloths.length - 1].left + cloths[cloths.length - 1].width : W, suspY);
    ctx.stroke();
    ctx.lineWidth = 1.5;
    for (var ci = 0; ci < cloths.length; ci++) {
      var cl = cloths[ci];
      ctx.beginPath();
      ctx.moveTo(cl.left, 0); ctx.lineTo(cl.left, suspY);
      ctx.moveTo(cl.left + cl.width, 0); ctx.lineTo(cl.left + cl.width, suspY);
      ctx.stroke();
    }
    // cloths
    for (var ci2 = 0; ci2 < cloths.length; ci2++) drawCloth(cloths[ci2]);
    // pooled-tail fold shadows: shallow ellipses hugging the floor line
    ctx.fillStyle = FOLD;
    ctx.globalAlpha = 0.30;
    for (var ci3 = 0; ci3 < cloths.length; ci3++) {
      var cl3 = cloths[ci3];
      var tail = cl3.points[ROWS - 1];
      var mid = tail[Math.floor(COLS / 2)];
      ctx.save();
      ctx.translate(mid.x, floorY + 6);
      ctx.scale(1, 0.08);
      ctx.beginPath();
      ctx.moveTo(cl3.width * 0.40, 0);
      ctx.arc(0, 0, cl3.width * 0.40, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- physics: fixed-timestep verlet, seeded initial state ----------
  var STEP = 1 / 60;
  var simT = 0;
  var windEvents = []; // { t, imp } horizontal drag impulses, exp decay tau 1.5 s
  var lastPX = 0, dragging = false;

  function windAt(t, phase) {
    var w = 6 * Math.sin(t * 0.5 + phase); // slow idle sway
    for (var i = 0; i < windEvents.length; i++) {
      var e = windEvents[i];
      if (t >= e.t) w += e.imp * Math.exp(-(t - e.t) / 1.5);
    }
    return w;
  }

  function step(dt) {
    for (var ci = 0; ci < cloths.length; ci++) {
      var cl = cloths[ci];
      var pts = cl.points;
      var wind = windAt(simT, cl.phase);
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          if (r === 0) continue; // pinned to the suspension line
          var p = pts[r][c];
          var vx = (p.x - p.px) * 0.985;
          var vy = (p.y - p.py) * 0.985;
          p.px = p.x; p.py = p.y;
          p.x += vx + wind * dt * dt * 60;
          p.y += vy + 1400 * dt * dt;
        }
      }
      // constraints, 3 passes
      for (var it = 0; it < 3; it++) {
        for (var r2 = 0; r2 < ROWS; r2++) {
          for (var c2 = 0; c2 < COLS; c2++) {
            var a = pts[r2][c2];
            if (c2 + 1 < COLS) satisfy(a, pts[r2][c2 + 1], cl.colStep, r2 === 0, r2 === 0);
            if (r2 + 1 < ROWS) satisfy(a, pts[r2 + 1][c2], cl.rowStep, r2 === 0, false);
          }
        }
        // re-pin top row to its rest positions
        for (var c3 = 0; c3 < COLS; c3++) {
          var top = pts[0][c3];
          top.x = top.px; top.y = top.py;
        }
      }
      // floor collision: pooled tails rest on the floor line
      for (var r3 = 0; r3 < ROWS; r3++) {
        for (var c4 = 0; c4 < COLS; c4++) {
          var q = pts[r3][c4];
          if (q.y > floorY + 4) {
            q.y = floorY + 4;
            q.px += (q.x - q.px) * 0.5;
          }
        }
      }
    }
  }

  function satisfy(a, b, rest, aPinned, bPinned) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
    var diff = (d - rest) / d * 0.5;
    var ox = dx * diff, oy = dy * diff;
    if (!aPinned) { a.x += ox; a.y += oy; }
    if (!bPinned) { b.x -= ox; b.y -= oy; }
  }

  // ---------- pointer: drag horizontally to stir air ----------
  function pointerPos(e) {
    if (e.clientX !== undefined) return e.clientX;
    if (e.touches && e.touches[0]) return e.touches[0].clientX;
    return 0;
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    lastPX = pointerPos(e);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var x = pointerPos(e);
    var dx = x - lastPX;
    lastPX = x;
    if (dx !== 0) windEvents.push({ t: simT, imp: dx * 0.9 });
    if (windEvents.length > 60) windEvents.splice(0, windEvents.length - 60);
  });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  // ---------- boot: frame one at exactly t = 0 ----------
  size();
  build();
  draw(0);

  // ---------- rAF loop (typeof-guarded; clock starts with the loop) ----------
  if (typeof window !== 'undefined' && window.visualViewport &&
      window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { size(); build(); draw(0); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { size(); build(); draw(0); });
  }
  if (typeof requestAnimationFrame === 'function') {
    var lastPerf = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var acc = 0;
    (function loop() {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
      var dtReal = (now - lastPerf) / 1000;
      lastPerf = now;
      if (dtReal > 0.1) dtReal = 0.1;
      if (dtReal < 0) dtReal = 0;
      acc += dtReal;
      while (acc >= STEP) {
        step(STEP);
        simT += STEP;
        acc -= STEP;
      }
      draw(simT);
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
