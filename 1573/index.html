<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flesh and Bone</title>
<style>
html, body { margin: 0; padding: 0; background: #F7F4EE; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F7F4EE';
var CRIMSON = '#B83A4A';
var ROSE = '#D4697E';
var OCHRE = '#C98A3A';
var MAROON = '#6E2430';
var FLESH = [CRIMSON, ROSE, OCHRE, MAROON];
var LOOP = 12;                     // breathing loop, seconds
var NARMS = 26;
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var seed = 1573;
var arms = [];                     // per arm: {ang, color, phase, phase2, pts:[{r,a}]}
var att = { a: 1.4, b: -2.3, c: 2.4, d: -2.1 };
var placedW = 0, placedH = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// De Jong attractor, iterated from a seeded start, mapped to polar arms:
// each attractor point falls into the wedge of one arm; per arm the
// angular deviation from the arm's center angle is binned by radius and
// smoothed, so each tentacle is a smooth wavy path that follows the
// attractor's structure instead of a jagged point-to-point polyline.
// Deterministic from the seed.
var NBIN = 24;
function buildArms() {
  var rnd = mulberry32(seed);
  att.a = 1.2 + rnd() * 0.6;
  att.b = -2.6 + rnd() * 0.8;
  att.c = 2.0 + rnd() * 0.8;
  att.d = -2.4 + rnd() * 0.8;
  var pts = [];
  var x = 0.1, y = 0.1, nx, ny, i;
  for (i = 0; i < 16000; i++) {
    nx = Math.sin(att.a * y) - Math.cos(att.b * x);
    ny = Math.sin(att.c * x) - Math.cos(att.d * y);
    x = nx; y = ny;
    if (i < 100) continue;
    pts.push({ x: x, y: y });
  }
  var maxR = 0.0001, p;
  for (i = 0; i < pts.length; i++) {
    var r = Math.sqrt(pts[i].x * pts[i].x + pts[i].y * pts[i].y);
    if (r > maxR) maxR = r;
  }
  // bins[arm][bin] = {sum, n} of angular offsets from the arm center.
  var bins = [], sums = [], ns = [];
  for (i = 0; i < NARMS; i++) {
    bins.push([]);
    sums.push([]); ns.push([]);
    for (var b = 0; b < NBIN; b++) { sums[i].push(0); ns[i].push(0); }
  }
  var halfWedge = TAU / NARMS / 2;
  for (i = 0; i < pts.length; i++) {
    p = pts[i];
    var ang = Math.atan2(p.y, p.x);
    if (ang < 0) ang += TAU;
    var arm = Math.floor(ang / TAU * NARMS) % NARMS;
    var rr = Math.sqrt(p.x * p.x + p.y * p.y) / maxR;
    var bin = Math.min(NBIN - 1, Math.floor(rr * NBIN));
    var center = (arm + 0.5) * TAU / NARMS;
    var off = ang - center;
    while (off > Math.PI) off -= TAU;
    while (off < -Math.PI) off += TAU;
    sums[arm][bin] += off;
    ns[arm][bin]++;
  }
  arms = [];
  for (i = 0; i < NARMS; i++) {
    // Mean offset per bin; empty bins inherit the nearest filled bin.
    var raw = [];
    var last = 0, b2;
    for (b2 = 0; b2 < NBIN; b2++) {
      if (ns[i][b2] > 0) last = sums[i][b2] / ns[i][b2];
      raw.push(last);
    }
    // Fill leading empty bins from the first filled one.
    var first = 0;
    for (b2 = 0; b2 < NBIN; b2++) if (ns[i][b2] > 0) { first = sums[i][b2] / ns[i][b2]; break; }
    for (b2 = 0; b2 < NBIN; b2++) {
      if (ns[i][b2] === 0 && b2 < NBIN && raw[b2] === 0) raw[b2] = first;
      else break;
    }
    // Three-bin moving average, amplified so the attractor's signature
    // waviness reads, then clamped inside the wedge.
    var offs = [];
    for (b2 = 0; b2 < NBIN; b2++) {
      var a0 = raw[Math.max(0, b2 - 1)], a1 = raw[b2], a2 = raw[Math.min(NBIN - 1, b2 + 1)];
      var v = (a0 + a1 + a2) / 3 * 1.8;
      if (v > halfWedge * 0.95) v = halfWedge * 0.95;
      if (v < -halfWedge * 0.95) v = -halfWedge * 0.95;
      offs.push(v);
    }
    arms.push({
      ang: (i + 0.5) * TAU / NARMS,
      color: FLESH[Math.floor(rnd() * FLESH.length)],
      phase: rnd() * TAU,
      phase2: rnd() * TAU,
      offs: offs
    });
  }
  placedW = VW; placedH = VH;
}
// Smoothed attractor angle of one arm at radius fraction f (0..1).
function armAngleAt(arm, f) {
  var pos = f * (NBIN - 1);
  var b0 = Math.floor(pos), b1 = Math.min(NBIN - 1, b0 + 1);
  var ft = pos - b0;
  return arm.ang + arm.offs[b0] * (1 - ft) + arm.offs[b1] * ft;
}
// Sway of one arm at time t: a Lissajous pair, both frequencies whole
// cycles of the 12 s loop, so the breathing is seamless. Scaled by (r/R)^2
// so the base stays glued to the core and only the tips sway.
function sway(arm, t) {
  var sx = Math.sin(TAU * t / LOOP + arm.phase);
  var sy = Math.sin(2 * TAU * t / LOOP + arm.phase2);
  return { x: sx, y: sy };
}
function armPoint(arm, pt, t, R, cx, cy, swayAmp) {
  var f = pt.r;
  var sw = sway(arm, t);
  var w = f * f * swayAmp;
  var rr = f * R;
  var px = cx + Math.cos(pt.a) * rr + sw.x * w;
  var py = cy + Math.sin(pt.a) * rr + sw.y * w;
  return { x: px, y: py, f: f };
}
function draw(t) {
  lastT = t;
  size();
  if (arms.length === 0 || placedW !== VW || placedH !== VH) buildArms();
  var minDim = Math.min(VW, VH);
  var u = minDim / 900;
  var cx = VW / 2, cy = VH / 2;
  var R = minDim * 0.30;           // organism diameter ~60% of frame
  var swayAmp = minDim * 0.022;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  // Thin dark frame line, her presentation habit.
  ctx.strokeStyle = MAROON;
  ctx.lineWidth = Math.max(1, 1.5 * u);
  var fm = 14 * u;
  ctx.strokeRect(fm, fm, VW - 2 * fm, VH - 2 * fm);
  // Membrane webs first, behind the tentacles: low-alpha quads between
  // adjacent arms at three radii, pulsing with the breath.
  var ai, fi, f;
  var fracs = [0.35, 0.6, 0.85];
  for (ai = 0; ai < NARMS; ai++) {
    var a1 = arms[ai], a2 = arms[(ai + 1) % NARMS];
    for (fi = 0; fi < fracs.length; fi++) {
      f = fracs[fi];
      var p1a = armPoint(a1, { r: f * 0.97, a: armAngleAt(a1, f * 0.97) }, t, R, cx, cy, swayAmp);
      var p1b = armPoint(a1, { r: f, a: armAngleAt(a1, f) }, t, R, cx, cy, swayAmp);
      var p2b = armPoint(a2, { r: f, a: armAngleAt(a2, f) }, t, R, cx, cy, swayAmp);
      var p2a = armPoint(a2, { r: f * 0.97, a: armAngleAt(a2, f * 0.97) }, t, R, cx, cy, swayAmp);
      var pulse = 0.6 + 0.4 * Math.sin(TAU * t / LOOP + a1.phase);
      var ma = 0.05 * pulse;
      ctx.globalAlpha = Number(ma.toFixed(4));
      ctx.fillStyle = ROSE;
      ctx.beginPath();
      ctx.moveTo(p1a.x, p1a.y);
      ctx.lineTo(p1b.x, p1b.y);
      ctx.lineTo(p2b.x, p2b.y);
      ctx.lineTo(p2a.x, p2a.y);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  // Tentacle strokes: each arm a tapered polyline through its attractor
  // points, plus two faint parallel lines for the thicket of fine lines.
  for (ai = 0; ai < NARMS; ai++) {
    var arm = arms[ai];
    var base = armPoint(arm, { r: 0.06, a: arm.ang }, t, R, cx, cy, swayAmp);
    var pathPts = [base];
    for (var k = 0; k < NBIN; k++) {
      var fr = 0.06 + (k / (NBIN - 1)) * 0.94;
      pathPts.push(armPoint(arm, { r: fr, a: armAngleAt(arm, fr) }, t, R, cx, cy, swayAmp));
    }
    var passes = [
      { off: 0, alpha: 0.85, wMul: 1.0 },
      { off: 1.8 * u, alpha: 0.28, wMul: 0.45 },
      { off: -1.8 * u, alpha: 0.28, wMul: 0.45 }
    ];
    for (var ps = 0; ps < passes.length; ps++) {
      var pass = passes[ps];
      ctx.strokeStyle = arm.color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (var s = 0; s < pathPts.length - 1; s++) {
        var q0 = pathPts[s], q1 = pathPts[s + 1];
        var dx = q1.x - q0.x, dy = q1.y - q0.y;
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var nx = -dy / len * pass.off, ny = dx / len * pass.off;
        var taper = 1 - 0.75 * q1.f;
        ctx.globalAlpha = Number(pass.alpha.toFixed(4));
        ctx.lineWidth = Math.max(0.6, 4.0 * u * taper * pass.wMul);
        ctx.beginPath();
        ctx.moveTo(q0.x + nx, q0.y + ny);
        ctx.lineTo(q1.x + nx, q1.y + ny);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
  // Dense core: maroon disc, darker heart, ring of small dots.
  var coreR = R * 0.11;
  ctx.fillStyle = MAROON;
  ctx.beginPath(); ctx.moveTo(cx + coreR, cy); ctx.arc(cx, cy, coreR, 0, TAU); ctx.fill();
  ctx.fillStyle = CRIMSON;
  ctx.beginPath(); ctx.moveTo(cx + coreR * 0.55, cy); ctx.arc(cx, cy, coreR * 0.55, 0, TAU); ctx.fill();
  ctx.fillStyle = PAPER;
  for (var d = 0; d < 10; d++) {
    var da = d * TAU / 10 + 0.31;
    var dx = cx + Math.cos(da) * coreR * 0.78, dy = cy + Math.sin(da) * coreR * 0.78;
    var dr = Math.max(0.8, coreR * 0.09);
    ctx.beginPath(); ctx.moveTo(dx + dr, dy); ctx.arc(dx, dy, dr, 0, TAU); ctx.fill();
  }
  // Caption: title, formula date, watch-only cue. Maroon chip, paper text.
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'Flesh and Bone  ·  2006 · 05 · 03  ·  Watch it breathe.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = MAROON;
  ctx.fillRect(bx - pad, by, Math.ceil(tw) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = PAPER;
  ctx.textBaseline = 'top';
  ctx.fillText(label, bx, by + pad);
  if (typeof window !== 'undefined') {
    window.__p1573 = {
      t: t, seed: seed, arms: arms.length, bins: NBIN,
      att: att, phone: isPhone()
    };
  }
}
// Watch-only: no pointer interaction of any kind.
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
