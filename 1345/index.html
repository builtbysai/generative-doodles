<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Strongman's Mirror</title>
<style>
  html, body { margin: 0; padding: 0; background: #14161B; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). No unseeded randomness anywhere.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function lerpColor(a, b, t) {
    var ca = hexRgb(a), cb = hexRgb(b);
    var r = Math.round(ca[0] + (cb[0] - ca[0]) * t);
    var g = Math.round(ca[1] + (cb[1] - ca[1]) * t);
    var bl = Math.round(ca[2] + (cb[2] - ca[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(v) { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }

  var DARK = '#23262E', SASH = '#A02C2C', PALE = '#EDE8DA', PALE_SHADOW = '#8A8474';
  var GROUND = '#14161B', LINE = '#C9D2D8';

  var W = 0, H = 0;
  function size() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    var w = vv ? vv.width : ((typeof window !== 'undefined' && window.innerWidth) ? window.innerWidth : 1280);
    var h = vv ? vv.height : ((typeof window !== 'undefined' && window.innerHeight) ? window.innerHeight : 900);
    W = w; H = h;
    canvas.width = Math.round(w); canvas.height = Math.round(h);
    canvas.style.width = Math.round(w) + 'px';
    canvas.style.height = Math.round(h) + 'px';
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.addEventListener) {
      window.addEventListener('resize', function () { size(); draw(currentT); });
      if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
        visualViewport.addEventListener('resize', function () { size(); draw(currentT); });
      }
    }
  }

  // ONE skeleton path traced on the context, shared by both figures.
  // Bust: neck cropped above the frame top, shoulders, torso to 62% height.
  function traceBust(cx, w, h, topY) {
    var nw = w * 0.20;
    ctx.beginPath();
    ctx.moveTo(cx - nw / 2, topY);
    ctx.lineTo(cx - nw / 2, topY + h * 0.10);
    ctx.bezierCurveTo(cx - w * 0.28, topY + h * 0.13, cx - w * 0.50, topY + h * 0.20, cx - w * 0.50, topY + h * 0.34);
    ctx.lineTo(cx - w * 0.44, topY + h);
    ctx.lineTo(cx + w * 0.44, topY + h);
    ctx.lineTo(cx + w * 0.50, topY + h * 0.34);
    ctx.bezierCurveTo(cx + w * 0.50, topY + h * 0.20, cx + w * 0.28, topY + h * 0.13, cx + nw / 2, topY + h * 0.10);
    ctx.lineTo(cx + nw / 2, topY);
    ctx.closePath();
  }

  // Drag state for the mirror line. Closed-form: offset decays after release.
  var drag = { active: false, startX: 0, startOff: 0, off: 0, releasedAt: -1e9 };
  var currentT = 0;

  function pointerPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    return x - r.left;
  }
  function boundaryX(t) {
    var maxOff = W * 0.30;
    var off = drag.off;
    if (!drag.active && drag.releasedAt < 1e8) {
      var age = t - drag.releasedAt;
      if (age >= 0) off = drag.off * Math.exp(-age / 0.8);
    }
    return W * 0.5 + clamp(off, -maxOff, maxOff);
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      var x = pointerPos(e);
      var bx = boundaryX(currentT);
      if (Math.abs(x - bx) <= 60) {
        drag.active = true; drag.startX = x; drag.startOff = drag.off;
      }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!drag.active) return;
      var x = pointerPos(e);
      drag.off = clamp(drag.startOff + (x - drag.startX), -W * 0.30, W * 0.30);
    });
    function endDrag() {
      if (drag.active) { drag.active = false; drag.releasedAt = currentT; }
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
  }

  function draw(t) {
    currentT = t;
    if (!W || !H) size();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Faint horizontal band: the colonel's mirror scene, nothing else.
    ctx.fillStyle = 'rgba(201,210,216,0.05)';
    ctx.fillRect(0, H * 0.30, W, H * 0.10);

    // 18s loop: stable 0-5, brighten 5-7, crossfade 7-13, held swapped 13-16, back 16-18.
    var ph = ((t % 18) + 18) % 18;
    var swap = 0, bright = 0.15, waveX = -1;
    if (ph < 5) { swap = 0; bright = 0.15; }
    else if (ph < 7) { swap = 0; bright = 0.15 + 0.85 * ((ph - 5) / 2); }
    else if (ph < 13) {
      swap = smooth((ph - 7) / 6); bright = 1;
      waveX = -W * 0.1 + (W * 1.2) * ((ph - 7) / 6);
    }
    else if (ph < 16) { swap = 1; bright = 0.6; }
    else { swap = 1 - smooth((ph - 16) / 2); bright = 0.6; waveX = W * 1.1 - (W * 1.2) * ((ph - 16) / 2); }

    // Wave stagger: left figure swaps slightly ahead of the right.
    var leftAmt = smooth(clamp(swap * 1.5, 0, 1));
    var rightAmt = smooth(clamp(swap * 1.5 - 0.5, 0, 1));

    var bx = boundaryX(t);
    var fw = W * 0.30, fh = H * 0.62, topY = -H * 0.02;
    var leftCx = W * 0.5 - fw * 0.52, rightCx = W * 0.5 + fw * 0.52;

    function drawFigure(cx, fill, sashAlpha, shadow) {
      traceBust(cx, fw, fh, topY);
      ctx.fillStyle = fill;
      ctx.fill();
      if (shadow) {
        traceBust(cx, fw, fh, topY);
        ctx.strokeStyle = PALE_SHADOW;
        ctx.lineWidth = Math.max(1, W * 0.002);
        ctx.stroke();
      }
      if (sashAlpha > 0.01) {
        ctx.save();
        traceBust(cx, fw, fh, topY);
        ctx.clip();
        ctx.globalAlpha = sashAlpha;
        ctx.fillStyle = SASH;
        ctx.beginPath();
        ctx.moveTo(cx - fw * 0.52, topY + fh * 0.52);
        ctx.lineTo(cx + fw * 0.52, topY + fh * 0.24);
        ctx.lineTo(cx + fw * 0.52, topY + fh * 0.24 + fh * 0.13);
        ctx.lineTo(cx - fw * 0.52, topY + fh * 0.52 + fh * 0.13);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }

    var leftFill = lerpColor(DARK, PALE, leftAmt);
    var rightFill = lerpColor(PALE, DARK, rightAmt);
    drawFigure(leftCx, leftFill, 1 - leftAmt, leftAmt > 0.5);
    drawFigure(rightCx, rightFill, rightAmt, rightAmt < 0.5);

    // Drag dissolve: the minority figure dissolves into horizontal static scanlines.
    var maxOff = W * 0.30;
    var offNow = bx - W * 0.5;
    var diss = Math.abs(offNow) / maxOff;
    if (diss > 0.02) {
      var minorityCx = (offNow > 0) ? rightCx : leftCx;
      var rng = mulberry32(1345000);
      ctx.save();
      traceBust(minorityCx, fw, fh, topY);
      ctx.clip();
      var rows = Math.floor(fh / 6);
      for (var i = 0; i < rows; i++) {
        if (rng() > diss) continue;
        var y = topY + i * 6 + rng() * 3;
        var x0 = W * 0.5 - fw * 0.6 + rng() * fw * 0.4;
        var len = fw * (0.1 + rng() * 0.8);
        ctx.fillStyle = 'rgba(201,210,216,' + (0.25 + diss * 0.6).toFixed(3) + ')';
        ctx.fillRect(x0, y, len, 1);
      }
      ctx.restore();
    }

    // Mirror line: never vanishes. Glow at swap instant as flat-alpha bands.
    var glowA = 0.10 * bright;
    ctx.fillStyle = 'rgba(201,210,216,' + (glowA * 0.5).toFixed(3) + ')';
    ctx.fillRect(bx - 14, 0, 28, H);
    ctx.fillStyle = 'rgba(201,210,216,' + (glowA).toFixed(3) + ')';
    ctx.fillRect(bx - 7, 0, 14, H);
    ctx.fillStyle = LINE;
    ctx.globalAlpha = 0.35 + 0.65 * bright;
    ctx.fillRect(bx - 1.5, 0, 3, H);
    ctx.globalAlpha = 1;

    // 1px traveling wave during crossfades.
    if (waveX >= 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(waveX - 0.5, 0, 1, H);
    }
  }

  // Frame one: synchronous, exactly t = 0. Clock starts with the rAF loop.
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    var start = null;
    function loop(ts) {
      if (start === null) start = ts;
      var el = (ts - start) / 1000;
      draw(el);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
