<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cover Is the Data</title>
<style>
html, body { margin: 0; padding: 0; background: #A9DDB8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#A9DDB8';
var PLATE = '#FFFFFF';
var PLATE_LINE = 'rgba(20,20,20,0.25)';
var TITLE_INK = '#141414';
var DATE_INK = '#1E5C38';
var BAR = '#FFFFFF';
var HAIRLINE = 'rgba(255,255,255,0.9)';
var NUMERAL = '#141414';
var STEP_SECONDS = 10;
var STEP_EASE = 1.2;
var N_STEPS = 8;
var N_BARS = 12;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function frac01(x) {
  var s = Math.sin(x) * 43758.5453;
  return s - Math.floor(s);
}
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
/* Closed-form dataset: pure functions of (bar, step). No wall clock, no RNG. */
function barWidthFrac(i, step) {
  return 0.34 + 0.52 * frac01(i * 12.9898 + step * 78.233);
}
function barHeightFrac(i, step) {
  return 0.30 + 0.62 * frac01(i * 7.233 + step * 39.346 + 3.7);
}
function barValue(i, step) {
  return Math.floor(frac01(i * 12.9898 + step * 78.233) * 90) + 10;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var simTime = 0;
var cover = { x: 0, y: 0, w: 0, h: 0 };
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    cover = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) * 0.94;
    cover = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
function stepIndex(t) {
  return Math.floor(t / STEP_SECONDS) % N_STEPS;
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* cover frame: a printed cover edge, inset on phones, square on desktop */
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 1;
  if (isPhone) {
    ctx.strokeRect(10.5, 10.5, VW - 21, VH - 21);
  } else {
    ctx.strokeRect(cover.x + 0.5, cover.y + 0.5, cover.w - 1, cover.h - 1);
  }
  var step = stepIndex(simTime);
  var next = (step + 1) % N_STEPS;
  var p = smooth(((simTime % STEP_SECONDS) / STEP_EASE));
  var x0 = cover.x + cover.w * 0.36;
  var x1 = cover.x + cover.w * 0.93;
  var regionW = x1 - x0;
  var pitch = regionW / N_BARS;
  var baseY = cover.y + cover.h * 0.78;
  var topY = cover.y + cover.h * 0.20;
  var areaH = baseY - topY;
  var i, w0, w1, h0, h1, bw, bh, bx, by;
  var tops = [];
  /* bars, massed center-right, generous mint margin left */
  for (i = 0; i < N_BARS; i++) {
    w0 = barWidthFrac(i, step); w1 = barWidthFrac(i, next);
    h0 = barHeightFrac(i, step); h1 = barHeightFrac(i, next);
    bw = pitch * (w0 + (w1 - w0) * p);
    bh = areaH * (h0 + (h1 - h0) * p);
    bx = x0 + i * pitch + (pitch - bw) / 2;
    by = baseY - bh;
    tops.push({ x: bx + bw / 2, y: by });
    ctx.fillStyle = BAR;
    ctx.fillRect(bx, by, bw, bh);
  }
  /* baseline rule under the bars */
  ctx.strokeStyle = HAIRLINE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0 - 6, baseY + 0.5);
  ctx.lineTo(x1 + 6, baseY + 0.5);
  ctx.stroke();
  /* thin white connecting lines threading the bars */
  ctx.strokeStyle = HAIRLINE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(tops[0].x, tops[0].y);
  for (i = 1; i < N_BARS; i++) {
    ctx.lineTo(tops[i].x, tops[i].y);
  }
  ctx.stroke();
  var hairY;
  for (var h = 1; h <= 2; h++) {
    hairY = topY + areaH * h / 3;
    ctx.beginPath();
    ctx.moveTo(x0 - 6, hairY + 0.5);
    ctx.lineTo(x1 + 6, hairY + 0.5);
    ctx.stroke();
  }
  /* tiny black monospace numerals: each bar's dataset value, below the baseline */
  var numPx = isPhone ? 10 : 11;
  ctx.font = numPx + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = NUMERAL;
  for (i = 0; i < N_BARS; i++) {
    var v = barValue(i, step);
    ctx.fillText((v < 10 ? '0' : '') + v, tops[i].x, baseY + 8);
  }
  /* dataset step marker, small, top right of the bar field */
  var stepPx = isPhone ? 10 : 11;
  ctx.font = stepPx + 'px monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = NUMERAL;
  var stepLabel = 'DATASET ' + (step < 9 ? '0' : '') + (step + 1) + ' / 08';
  ctx.fillText(stepLabel, x1 + 6, topY - stepPx - 8);
  /* cover caption in the left margin */
  ctx.textAlign = 'left';
  ctx.font = stepPx + 'px monospace';
  ctx.fillStyle = 'rgba(20,20,20,0.55)';
  ctx.fillText('PP980', cover.x + 16, baseY + 8);
  ctx.fillText('GREYFADE', cover.x + 16, baseY + 8 + stepPx + 4);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Cover Is the Data').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Cover Is the Data').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 10').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = cover.x + 12, plateY = cover.y + 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Cover Is the Data', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = DATE_INK;
  ctx.fillText('2006 · 10 · 10', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. A new page every ten seconds.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cover.x + 12;
  var hintPlateY = cover.y + cover.h - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = DATE_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { simTime = t; draw(); },
    stepIndex: function () { return stepIndex(simTime); },
    barCount: function () { return N_BARS; },
    stepCount: function () { return N_STEPS; },
    simTime: function () { return simTime; }
  };
}
/* ---- frame one: fixed phase, simTime 0, dataset step 1 of 8 fully settled ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      simTime += dt;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) { draw(); }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
