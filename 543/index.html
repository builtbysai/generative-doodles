<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Pools</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #A8C8CC; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: two phase grounds, one object tone, white, and the black of the
  // pools. Nothing else. Flat fills only, no gradients, no blur, no texture.
  var PINK = '#F2B3C0', BLUE = '#A8C8CC', INK = '#111111', WHITE = '#FFFFFF';

  var LOOP = 30;        // seconds per seamless loop (light makes one full orbit)
  var PHASE0 = 22.5;    // constant first-frame phase: light at its lowest, pools at full stretch

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(543065);

  // The fixed seed picks the phase once, forever: first draw 0.9858 (>= 0.5)
  // lands on the blue phase. Ground BLUE, objects in PINK + WHITE, pools INK.
  var PHASE_BLUE = rng() >= 0.5;
  var GROUND = PHASE_BLUE ? BLUE : PINK;
  var TONE = PHASE_BLUE ? PINK : BLUE;

  // ---- still life: five flat objects on an invisible grid (1080 design space) ----
  // x, y = base point the shadow pool is anchored to; s = object scale;
  // len0 / halfW0 = pool reach and half-width before the light factor.
  var OBJECTS = [
    { kind: 'bottle', x: 225, y: 415, s: 0.92, len0: 250, halfW0: 52 },
    { kind: 'cup',    x: 545, y: 415, s: 0.90, len0: 265, halfW0: 68 },
    { kind: 'shoe',   x: 855, y: 415, s: 0.92, len0: 300, halfW0: 80 },
    { kind: 'book',   x: 330, y: 745, s: 1.05, len0: 300, halfW0: 92 },
    { kind: 'chair',  x: 720, y: 745, s: 1.05, len0: 295, halfW0: 88 }
  ];
  // Seeded edge wobble per pool (fixed forever; the pools are graphic blobs,
  // not ellipses, but their wobble never animates, only scale and swing do).
  for (var i = 0; i < OBJECTS.length; i++) {
    var wob = [];
    for (var k = 0; k < 8; k++) wob.push(0.88 + rng() * 0.24);
    OBJECTS[i].wob = wob;
  }

  // ---- the pool: a hard-edged blob anchored at the object's base ----
  // Drawn in local space: +x is the shadow direction, the blob reaches from
  // -0.16*len (tucked under the object) to +1.0*len.
  function poolPath(len, halfW, wob) {
    var pts = [];
    for (var k = 0; k < 8; k++) {
      var a = k / 8 * Math.PI * 2;
      pts.push([
        (0.42 + 0.58 * Math.cos(a)) * len * wob[k],
        Math.sin(a) * halfW * wob[k]
      ]);
    }
    ctx.beginPath();
    var mx = (pts[7][0] + pts[0][0]) / 2, my = (pts[7][1] + pts[0][1]) / 2;
    ctx.moveTo(mx, my);
    for (var j = 0; j < 8; j++) {
      var p = pts[j], q = pts[(j + 1) % 8];
      ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
    }
    ctx.closePath();
  }

  // ---- objects: flat shapes around (0,0), base at y = 0, drawn in TONE + WHITE ----
  // INK appears only as the specced pool black: thin outlines, the coffee
  // surface, the shoe sole. No other colours anywhere.

  function outline(lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw || 3.5; ctx.stroke(); }

  function drawBottle() {
    ctx.fillStyle = TONE;
    ctx.beginPath();
    ctx.moveTo(-34, 0); ctx.lineTo(-34, -148);
    ctx.quadraticCurveTo(-34, -168, -11, -178);
    ctx.lineTo(-11, -196); ctx.lineTo(11, -196); ctx.lineTo(11, -178);
    ctx.quadraticCurveTo(34, -168, 34, -148);
    ctx.lineTo(34, 0); ctx.closePath();
    ctx.fill(); outline();
    // lip
    ctx.fillStyle = TONE;
    ctx.beginPath(); ctx.rect(-15, -206, 30, 11); ctx.fill(); outline(3);
    // label
    ctx.fillStyle = WHITE;
    ctx.fillRect(-26, -110, 52, 50);
  }

  function drawCup() {
    // saucer
    ctx.fillStyle = WHITE;
    ctx.beginPath(); ctx.ellipse(0, 2, 68, 11, 0, 0, Math.PI * 2); ctx.fill(); outline(3);
    // body: trapezoid
    ctx.fillStyle = TONE;
    ctx.beginPath();
    ctx.moveTo(-54, -74); ctx.lineTo(54, -74); ctx.lineTo(38, -4); ctx.lineTo(-38, -4);
    ctx.closePath(); ctx.fill(); outline();
    // coffee surface
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(0, -74, 45, 8, 0, 0, Math.PI * 2); ctx.fill();
    // white band following the slant
    ctx.fillStyle = WHITE;
    ctx.beginPath();
    ctx.moveTo(-48.5, -54); ctx.lineTo(48.5, -54); ctx.lineTo(45.5, -41); ctx.lineTo(-45.5, -41);
    ctx.closePath(); ctx.fill();
    // handle
    ctx.strokeStyle = INK;
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(59, -40, 17, -1.1, 1.1); ctx.stroke();
  }

  function shoeUpperPath() {
    ctx.beginPath();
    ctx.moveTo(-92, -12);
    ctx.quadraticCurveTo(-94, -44, -76, -54);
    ctx.lineTo(-30, -58);
    ctx.quadraticCurveTo(2, -56, 14, -42);
    ctx.quadraticCurveTo(44, -26, 88, -17);
    ctx.lineTo(96, -12);
    ctx.closePath();
  }
  function drawShoe() {
    shoeUpperPath();
    ctx.fillStyle = TONE; ctx.fill(); outline();
    // white toe cap, clipped to the upper
    ctx.save();
    shoeUpperPath(); ctx.clip();
    ctx.fillStyle = WHITE;
    ctx.beginPath(); ctx.ellipse(84, -14, 26, 20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    shoeUpperPath(); outline();
    // laces
    ctx.strokeStyle = WHITE;
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-16 + i * 13, -47 + i * 4);
      ctx.lineTo(-6 + i * 13, -37 + i * 4);
      ctx.stroke();
    }
    // sole
    ctx.fillStyle = INK;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-94, -12, 192, 12, 5); else ctx.rect(-94, -12, 192, 12);
    ctx.fill();
  }

  function drawBook() {
    // cover
    ctx.fillStyle = TONE;
    ctx.beginPath(); ctx.rect(-74, -106, 148, 106); ctx.fill(); outline();
    // spine
    ctx.fillStyle = INK;
    ctx.fillRect(-74, -106, 13, 106);
    // pages
    ctx.fillStyle = WHITE;
    ctx.fillRect(-54, -94, 114, 82);
    // text lines
    ctx.fillStyle = INK;
    for (var i = 0; i < 4; i++) ctx.fillRect(-42, -80 + i * 19, 88 - (i % 2) * 22, 5);
    // bookmark ribbon
    ctx.beginPath();
    ctx.moveTo(28, -106); ctx.lineTo(42, -106); ctx.lineTo(42, -64); ctx.lineTo(35, -74); ctx.lineTo(28, -64);
    ctx.closePath(); ctx.fill();
  }

  function drawChair() {
    ctx.fillStyle = TONE;
    // back leg + backrest post
    ctx.beginPath(); ctx.rect(-54, -198, 16, 198); ctx.fill(); outline(3);
    // front leg
    ctx.beginPath(); ctx.rect(44, -80, 15, 80); ctx.fill(); outline(3);
    // backrest panel
    ctx.beginPath(); ctx.rect(-54, -198, 74, 62); ctx.fill(); outline();
    // white rail stripe on the backrest
    ctx.fillStyle = WHITE;
    ctx.fillRect(-54, -198, 74, 14);
    // seat cushion
    ctx.beginPath(); ctx.rect(-58, -94, 118, 16); ctx.fill(); outline();
  }

  var DRAWERS = { bottle: drawBottle, cup: drawCup, shoe: drawShoe, book: drawBook, chair: drawChair };

  // ---- scene ----
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    // One unseen light, one full orbit per loop. Elevation rides the same
    // cycle (integer ratio, seamless): high light -> short wide puddles,
    // low light -> long narrow rakes.
    var swing = 2 * Math.PI * (t % LOOP) / LOOP;
    var elev = 0.5 + 0.5 * Math.sin(swing);
    var dirAng = swing + 2.2;
    var lenF = 1.5 - 0.95 * elev;
    var widF = 0.72 + 0.5 * elev;

    // pools first, all five, then the objects that never move
    var i, o;
    ctx.fillStyle = INK;
    for (i = 0; i < OBJECTS.length; i++) {
      o = OBJECTS[i];
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(dirAng);
      poolPath(o.len0 * o.s * lenF, o.halfW0 * o.s * widF, o.wob);
      ctx.fill();
      ctx.restore();
    }
    for (i = 0; i < OBJECTS.length; i++) {
      o = OBJECTS[i];
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.scale(o.s, o.s);
      DRAWERS[o.kind]();
      ctx.restore();
    }

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is the phase ground) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      // the still life keeps its shape and spans the full phone width;
      // the ground colour fills the rest, so the letterbox is invisible
      S = W;
      OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H);
      OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
