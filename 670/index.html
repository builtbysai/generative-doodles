<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mujerave</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #14161C; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.670 "Mujerave" (EXPANSION #81 jose-perez-de-arce, block 6).
  // LA MUJER CHAMANA: "con su vestido de aire colorido, vuela
  // enlazando mundos." A small robed woman crosses a vast night on a
  // slow course, in no hurry. Her dress is not cloth: it is four
  // streams of colored air, hundreds of particles pouring from her
  // hem and braiding through a curl-noise field across the lower
  // frame. A drag tears the airflow; it always re-settles. A tap
  // gives her a new route. No wings, no mesh, no sparkles: moving air.

  // Palette (strict, nothing else).
  var NIGHT = '#14161C';
  var SKIN = '#E8DCC3';
  var AIR = ['#7FC4BD', '#E2725B', '#D9A441', '#8E7CC3']; // turquoise, coral, gold, violet

  // Composition space: FW x FH abstract units, contain-fit onto the
  // viewport. Chosen once at boot (phone gets the tall field).
  var FW = 1.6, FH = 1.0;

  var ROUTE_SEED0 = 670001;
  var PART_SEED0 = 670501;

  // Sim: fixed-step particles on an anchored clock.
  var DT = 1 / 30;
  var PREROLL = 22;           // seconds of air history behind frame one
  var LOOP = 50;              // her course period, seconds

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { return t * t * (3 - 2 * t); }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Forced-state hook for QA renders: ?seed=tNN draws at time NN.
  var forcedT = -1;
  try {
    var sm = /seed=t(\d+(?:\.\d+)?)/.exec((typeof location !== 'undefined' && location.search) || '');
    if (sm) forcedT = parseFloat(sm[1]);
  } catch (err) { forcedT = -1; }

  // ------------------------------------------------------------------
  // Anchored clock. Frame one never derives from Date.now(); it is
  // drawn synchronously after a fixed pre-roll at figure time 0.
  // ------------------------------------------------------------------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }

  // ------------------------------------------------------------------
  // Value noise (seeded integer lattice hash) and its curl.
  // ------------------------------------------------------------------
  function hash2(ix, iy) {
    var h = Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    var a = hash2(ix, iy), b = hash2(ix + 1, iy);
    var c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
    return lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
  }
  var noiseT = 0; // field clock (runs ahead by the pre-roll)
  function psi(x, y) {
    return vnoise(x * 1.7 + noiseT * 0.042, y * 1.7 - noiseT * 0.026) * 0.6
         + vnoise(x * 3.9 - noiseT * 0.055, y * 3.9 + noiseT * 0.034) * 0.4;
  }
  var cv = { x: 0, y: 0 };
  function curl(x, y, out) {
    var e = 0.02;
    var dpy = psi(x, y + e) - psi(x, y - e);
    var dpx = psi(x + e, y) - psi(x - e, y);
    var vx = dpy / (2 * e), vy = -dpx / (2 * e);
    vx *= 0.045; vy *= 0.045;
    var sp = Math.sqrt(vx * vx + vy * vy);
    if (sp > 0.10) { vx = vx / sp * 0.10; vy = vy / sp * 0.10; }
    out.x = vx; out.y = vy;
  }

  // ------------------------------------------------------------------
  // Her route: a slow Lissajous course across the upper region. A tap
  // appends a new route (seeded phases and amplitudes); the figure
  // glides from the old course to the new one over 2.5 s, so she never
  // jumps. Position is a pure function of figure time and the route
  // list, which keeps every state reproducible.
  // ------------------------------------------------------------------
  var routeSeed = ROUTE_SEED0;
  var routes = []; // {ta, phx, phy, axm, aym, dir}
  function rollRoute(ta, seed) {
    var rng = mulberry32(seed);
    return {
      ta: ta,
      phx: rng() * Math.PI * 2,
      phy: rng() * Math.PI * 2,
      axm: 0.85 + rng() * 0.30,
      aym: 0.80 + rng() * 0.45,
      dir: rng() < 0.5 ? -1 : 1
    };
  }
  function liss(r, t) {
    var cx = FW * 0.5, cy = FH * 0.27;
    var ax = FW * 0.30 * r.axm, ay = FH * 0.085 * r.aym;
    var w = 2 * Math.PI / LOOP;
    var x = cx + r.dir * ax * Math.sin(w * t + r.phx);
    var y = cy + ay * Math.sin(2 * w * t + r.phy);
    y += FH * 0.006 * Math.sin(2 * Math.PI * t / 3.7); // her gentle bob
    return [x, y];
  }
  function figPos(t) {
    var r = routes[0], prev = null;
    for (var i = 0; i < routes.length; i++) {
      if (routes[i].ta <= t) { prev = r; r = routes[i]; }
    }
    var p = liss(r, t);
    if (prev && prev !== r && t - r.ta < 2.5) {
      var q = liss(prev, t);
      var k = smooth(clamp((t - r.ta) / 2.5, 0, 1));
      p = [lerp(q[0], p[0], k), lerp(q[1], p[1], k)];
    }
    return p;
  }
  function figVel(t) {
    var a = figPos(t - 0.05), b = figPos(t + 0.05);
    return [(b[0] - a[0]) / 0.1, (b[1] - a[1]) / 0.1];
  }

  // ------------------------------------------------------------------
  // The air: particles spawned at her trailing hem, stream id cycling
  // by spawn index, advected by the curl field plus a breath of
  // downward drift and any drag disturbance velocity (which decays,
  // so a tear settles in about four seconds).
  // ------------------------------------------------------------------
  var NPART = 800;
  var parts = [];
  var spawnIdx = 0;
  var partRng = null;
  var figT = 0;               // figure clock; frozen during the pre-roll

  function hemPoint(fp, tilt) {
    // A point along the robe's hem, in composition coords.
    var Hf = FH * 0.17;
    var lx = (partRng() * 2 - 1) * 0.26 * Hf;
    var ly = 0.18 * Hf + Math.sin(lx / Hf * 5.0) * 0.012 * Hf;
    var c = Math.cos(tilt), s = Math.sin(tilt);
    return [fp[0] + lx * c - ly * s, fp[1] + lx * s + ly * c];
  }
  function spawn(p, randomAge) {
    var fp = figPos(figT), fv = figVel(figT);
    var tilt = clamp(fv[0] * 1.2, -0.2, 0.2);
    var hp = hemPoint(fp, tilt);
    p.x = hp[0]; p.y = hp[1];
    // Each particle rides its own offset copy of the field, so the
    // four streams disperse and braid across the lower frame instead
    // of following one laminar ribbon out of her hem.
    p.ox = (partRng() * 2 - 1) * 0.85;
    p.oy = (partRng() * 2 - 1) * 0.85;
    curl(p.x + p.ox, p.y + p.oy, cv);
    p.vx = cv.x * 0.4 + fv[0] * 0.2 + (partRng() * 2 - 1) * 0.02;
    p.vy = cv.y * 0.4 + fv[1] * 0.2 + 0.03 + (partRng() * 2 - 1) * 0.02;
    p.dvx = 0; p.dvy = 0;
    p.life = 9 + partRng() * 8;
    p.age = randomAge ? partRng() * p.life : 0;
    p.stream = spawnIdx % 4; spawnIdx++;
  }
  function initParts(seed) {
    partRng = mulberry32(seed);
    spawnIdx = 0;
    parts = [];
    for (var i = 0; i < NPART; i++) {
      var p = { x: 0, y: 0, vx: 0, vy: 0, dvx: 0, dvy: 0, ox: 0, oy: 0, age: 0, life: 1, stream: 0 };
      spawn(p, true);
      parts.push(p);
    }
  }

  // Drag samples recorded with anchored (figure-clock) times; each is
  // applied exactly once, at the first sim step at or after its time.
  var dragSamples = [];       // {ta, x, y, done}

  function stepSim(freezeFig) {
    var i, p;
    if (!freezeFig) figT += DT;
    noiseT += DT;

    for (i = 0; i < dragSamples.length; i++) {
      var s = dragSamples[i];
      if (s.done || s.ta > figT) continue;
      s.done = true;
      for (var j = 0; j < NPART; j++) {
        p = parts[j];
        var dx = p.x - s.x, dy = p.y - s.y;
        var d2 = dx * dx + dy * dy, R = 0.17;
        if (d2 < R * R) {
          var d = Math.sqrt(d2) || 0.001;
          var f = 1 - d / R;
          var ux = dx / d, uy = dy / d;
          p.dvx += (ux * 0.55 - uy * 0.40) * f;
          p.dvy += (uy * 0.55 + ux * 0.40) * f;
        }
      }
    }

    for (i = 0; i < NPART; i++) {
      p = parts[i];
      p.age += DT;
      if (p.age >= p.life) { spawn(p, false); continue; }
      curl(p.x + p.ox, p.y + p.oy, cv);
      p.vx = cv.x + p.dvx;
      p.vy = cv.y + 0.028 + p.dvy; // the air settles downward from her
      p.x += p.vx * DT;
      p.y += p.vy * DT;
      p.dvx *= 0.93; p.dvy *= 0.93;
      if (p.x < -0.08 || p.x > FW + 0.08 || p.y < -0.08 || p.y > FH + 0.08) spawn(p, false);
    }
  }

  // ------------------------------------------------------------------
  // Viewport.
  // ------------------------------------------------------------------
  var W = 0, H = 0, SCALE = 1, ORGX = 0, ORGY = 0, DPR = 1;
  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    var mn = Math.min(sw || 1e9, sh || 1e9);
    if (mn < 700) return true;
    return H > 0 && W > 0 && H > W * 1.15;
  }
  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : ((typeof window !== 'undefined' && window.innerWidth) || 300);
    var h = vv ? vv.height : ((typeof window !== 'undefined' && window.innerHeight) || 300);
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    SCALE = Math.min(w / FW, h / FH);
    ORGX = (w - FW * SCALE) / 2;
    ORGY = (h - FH * SCALE) / 2;
  }
  function PX(x) { return ORGX + x * SCALE; }
  function PY(y) { return ORGY + y * SCALE; }

  // ------------------------------------------------------------------
  // Pointer: drag tears the airflow; a tap (short, near-still press)
  // reseeds her route. Never click-to-reload.
  // ------------------------------------------------------------------
  var dragging = false;
  var downT = -10, downX = 0, downY = 0, downMoved = 0;

  function pointerComp(e) {
    if (!e || typeof e.clientX !== 'number') return null;
    var r = null;
    try { r = canvas.getBoundingClientRect(); } catch (err) { r = null; }
    var px = e.clientX - (r ? r.left : 0), py = e.clientY - (r ? r.top : 0);
    return [(px - ORGX) / SCALE, (py - ORGY) / SCALE];
  }
  function onDown(e) {
    var u = pointerComp(e);
    if (!u) return;
    dragging = true;
    downT = elapsed(); downX = u[0]; downY = u[1]; downMoved = 0;
    dragSamples.push({ ta: figT, x: clamp(u[0], 0, FW), y: clamp(u[1], 0, FH), done: false });
  }
  function onMove(e) {
    if (!dragging) return;
    var u = pointerComp(e);
    if (!u) return;
    var dx = u[0] - downX, dy = u[1] - downY;
    downMoved = Math.max(downMoved, Math.sqrt(dx * dx + dy * dy));
    dragSamples.push({ ta: figT, x: clamp(u[0], 0, FW), y: clamp(u[1], 0, FH), done: false });
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var now = elapsed();
    if (now - downT < 0.32 && downMoved < 0.035) {
      // A tap: a new route, seeded afresh; she glides onto it.
      routeSeed = (routeSeed + 7919) | 0;
      routes.push(rollRoute(figT, routeSeed));
    }
  }

  // ------------------------------------------------------------------
  // Draw.
  // ------------------------------------------------------------------
  function drawFigure(fp, fv) {
    var Hf = FH * 0.17;
    var tilt = clamp(fv[0] * 1.2, -0.2, 0.2);
    ctx.save();
    ctx.translate(PX(fp[0]), PY(fp[1]));
    ctx.rotate(tilt);
    ctx.scale(SCALE * Hf, SCALE * Hf);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // One arm, extended down and out in a tapered sleeve, with a
    // small hand. Drawn first so the robe overlaps its root.
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(0.10, -0.20);
    ctx.lineTo(0.36, 0.06);
    ctx.lineTo(0.33, 0.13);
    ctx.lineTo(0.13, -0.06);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0.365, 0.095, 0.032, 0.026, 0.5, 0, Math.PI * 2);
    ctx.fill();

    // The robe: shoulders narrowing from the neck, sides falling to
    // a scalloped hem that trails in the air.
    ctx.globalAlpha = 0.92;
    ctx.beginPath();
    ctx.moveTo(-0.10, -0.30);
    ctx.quadraticCurveTo(-0.22, -0.18, -0.26, 0.02);
    ctx.quadraticCurveTo(-0.30, 0.14, -0.27, 0.20);
    ctx.quadraticCurveTo(-0.18, 0.26, -0.12, 0.185);
    ctx.quadraticCurveTo(-0.06, 0.27, 0.0, 0.195);
    ctx.quadraticCurveTo(0.06, 0.27, 0.12, 0.185);
    ctx.quadraticCurveTo(0.18, 0.26, 0.27, 0.20);
    ctx.quadraticCurveTo(0.30, 0.14, 0.26, 0.02);
    ctx.quadraticCurveTo(0.22, -0.18, 0.10, -0.30);
    ctx.quadraticCurveTo(0.0, -0.335, -0.10, -0.30);
    ctx.fill();

    // Drape folds: two quiet night lines down the robe.
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = NIGHT;
    ctx.lineWidth = 0.016;
    ctx.beginPath();
    ctx.moveTo(-0.09, -0.22);
    ctx.quadraticCurveTo(-0.13, 0.0, -0.10, 0.17);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0.07, -0.24);
    ctx.quadraticCurveTo(0.11, -0.02, 0.08, 0.16);
    ctx.stroke();

    // Face: a small paper disc, a dark hair cap (she is old, the cap
    // reads as her covered head), and two eye dots.
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.ellipse(0, -0.42, 0.105, 0.115, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = NIGHT;
    ctx.beginPath();
    ctx.ellipse(0, -0.465, 0.105, 0.075, 0, Math.PI * 1.02, Math.PI * 1.98);
    ctx.lineTo(0, -0.465);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.ellipse(-0.038, -0.415, 0.013, 0.017, 0, 0, Math.PI * 2);
    ctx.ellipse(0.038, -0.415, 0.013, 0.017, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function draw(forceTarget) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // Advance the sim, in fixed steps, to the anchored clock. The boot
    // draw passes an explicit target of 0 so frame one never depends
    // on how much wall time the pre-roll happened to take.
    var target;
    if (typeof forceTarget === 'number') target = forceTarget;
    else if (forcedT >= 0) target = forcedT;
    else target = elapsed();
    var guard = 0;
    while (figT < target - 1e-9 && guard < 60 * 120) { stepSim(false); guard++; }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = NIGHT;
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // The air: short fading streaks along each particle's velocity,
    // colored by stream. Alpha breathes in at birth and out at death.
    ctx.lineWidth = Math.max(1, 0.0038 * SCALE);
    var lastStream = -1;
    for (var i = 0; i < NPART; i++) {
      var p = parts[i];
      var fin = clamp(p.age / 0.6, 0, 1);
      var fout = clamp((p.life - p.age) / 1.8, 0, 1);
      if (fin * fout <= 0.01) continue;
      if (p.stream !== lastStream) { ctx.strokeStyle = AIR[p.stream]; lastStream = p.stream; }
      ctx.globalAlpha = 0.55 * fin * fout;
      ctx.beginPath();
      ctx.moveTo(PX(p.x - p.vx * 0.16), PY(p.y - p.vy * 0.16));
      ctx.lineTo(PX(p.x), PY(p.y));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Her, small in the upper dark.
    var fp = figPos(figT), fv = figVel(figT);
    drawFigure(fp, fv);
  }

  // ------------------------------------------------------------------
  // Boot: pick the field for the device, size, seed the first route
  // and the air, pre-roll the air a fixed number of steps with her
  // held at her course start, and draw frame one synchronously.
  // ------------------------------------------------------------------
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  resize();
  if (isPhone()) { FW = 0.95; FH = 1.5; NPART = 560; resize(); }
  routes = [rollRoute(0, routeSeed)];
  initParts(PART_SEED0);
  for (var b = 0; b < PREROLL / DT; b++) stepSim(true);
  // Frame one: synchronous, her at course start, the air established.
  draw(forcedT >= 0 ? forcedT : 0);

  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
