<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№ 670 — Prime Petals</title>
<!-- phantom-fill-8951 -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0a0f0c;
    color: #e6ece3;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; display: block; }
  header {
    position: fixed; top: 28px; left: 32px; z-index: 2; pointer-events: none;
  }
  header .no {
    font-size: 11px; letter-spacing: .35em; text-transform: uppercase;
    color: #8fb996; margin-bottom: 8px;
  }
  header h1 {
    font-size: 30px; font-weight: normal; letter-spacing: .02em; color: #f2f6ef;
  }
  header .sub {
    margin-top: 8px; font-size: 13px; font-style: italic; color: #93a094;
    max-width: 340px; line-height: 1.5;
  }
  footer {
    position: fixed; right: 32px; bottom: 24px; z-index: 2;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: #67766a; pointer-events: none; text-align: right; line-height: 1.9;
  }
  footer .primes { color: #c9d8cb; letter-spacing: .28em; font-size: 12px; }
  @media (max-width: 640px) {
    header { top: 18px; left: 20px; }
    header h1 { font-size: 23px; }
    header .sub { font-size: 12px; max-width: 250px; }
    footer { right: 20px; bottom: 16px; }
  }
</style>
</head>
<body>
<canvas id="rosette"></canvas>
<header>
  <div class="no">№ 670</div>
  <h1>Prime Petals</h1>
  <div class="sub">A rosette in prime-numbered hues only. Each prime family
  grows exactly <i>p</i> petals — no composite count, no composite hue.</div>
</header>
<footer>
  <div class="primes">2 &middot; 3 &middot; 5 &middot; 7 &middot; 11 &middot; 13 &middot; 17 &middot; 19 &middot; 23</div>
  <div>nine prime families &middot; watch only</div>
</footer>
<script>
(function () {
  'use strict';
  // DRIVER: A rosette grown from primes alone — each prime p contributes one
  // family of exactly p petals, and every hue is a prime number of degrees
  // on the colour wheel, so no composite count or colour appears anywhere.
  var PRIMES = [2, 3, 5, 7, 11, 13, 17, 19, 23];

  // Primes up to 360 (hue degrees).
  function primesUpTo(n) {
    var sieve = [], out = [], i, j;
    for (i = 2; i <= n; i++) {
      if (!sieve[i]) { out.push(i); for (j = i * i; j <= n; j += i) sieve[j] = 1; }
    }
    return out;
  }
  var HUE_PRIMES = primesUpTo(360);
  function nearestPrimeHue(h) {
    var best = HUE_PRIMES[0], bd = 1e9, i, d;
    for (i = 0; i < HUE_PRIMES.length; i++) {
      d = Math.abs(HUE_PRIMES[i] - h);
      if (d < bd) { bd = d; best = HUE_PRIMES[i]; }
    }
    return best;
  }
  // Golden-angle spread, snapped to a prime number of degrees.
  function hueOf(p) {
    return nearestPrimeHue((p * 137.508) % 360);
  }

  var canvas = document.getElementById('rosette');
  var ctx = canvas.getContext('2d');
  var W, H, CX, CY, UNIT, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2; CY = H / 2 + 12;
    // Outermost petal tip (p=23) lands near 0.42 * min dimension.
    UNIT = Math.min(W, H) * 0.42 / 330;
  }
  window.addEventListener('resize', resize);
  resize();

  function petal(len, wid) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * 0.28, -wid / 2, len * 0.72, -wid / 2, len, 0);
    ctx.bezierCurveTo(len * 0.72, wid / 2, len * 0.28, wid / 2, 0, 0);
    ctx.closePath();
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    var breathe = 1 + 0.022 * Math.sin(now * 0.00045);
    var rot = now * 0.000028;

    for (var f = 0; f < PRIMES.length; f++) {
      var p = PRIMES[f];
      var hue = hueOf(p);
      // Families nest outward by prime size; each family offset so its
      // petals interleave with its neighbours.
      var radius = (30 + p * 11.5) * UNIT * breathe;
      var len = (14 + p * 2.1) * UNIT * breathe;
      var wid = len * 0.46;
      var off = rot + f * 0.31;
      for (var k = 0; k < p; k++) {
        var a = off + (k / p) * Math.PI * 2;
        ctx.save();
        ctx.translate(CX + Math.cos(a) * radius, CY + Math.sin(a) * radius);
        ctx.rotate(a);
        petal(len, wid);
        ctx.fillStyle = 'hsla(' + hue + ', 58%, 63%, 0.52)';
        ctx.fill();
        ctx.strokeStyle = 'hsla(' + hue + ', 70%, 78%, 0.55)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }
      // One small prime numeral riding the family's top petal.
      var la = off;
      var lx = CX + Math.cos(la) * (radius + len + 14 * UNIT);
      var ly = CY + Math.sin(la) * (radius + len + 14 * UNIT);
      ctx.fillStyle = 'hsla(' + hue + ', 60%, 72%, 0.85)';
      ctx.font = 'italic ' + Math.max(10, Math.round(13 * Math.min(W, H) / 800)) + 'px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(p), lx, ly);
    }

    // Centre: the seed all families grow from.
    var s = Math.min(W, H) / 800;
    ctx.beginPath();
    ctx.arc(CX, CY, 4 * s, 0, Math.PI * 2);
    ctx.fillStyle = '#e8ddc0';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(CX, CY, 9 * s, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(232,221,192,0.35)';
    ctx.stroke();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
