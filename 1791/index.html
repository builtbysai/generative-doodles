<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stencil, Ink, Repeat</title>
<style>
html, body { margin: 0; padding: 0; background: #8f8d86; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#8f8d86'; /* table grey at the frame edges */
var PAPER = '#f6f2e9';
var INK = '#B4552D'; /* rust-orange ink */
var INK_DARK = '#8a3a1c';
var INK_DEEP = '#7a3318';
var GRAPHITE = '#4a4a46';
var HEAD_BODY = '#3f3f3c';
var HEAD_FACE = '#262624';
var HEAD_ARM = '#55554f';
var PLATE_FILL = '#ffffff';
var PLATE_LINE = 'rgba(0,0,0,0.28)';
var PLATE_INK = '#2b2b28';
var HINT_INK = '#2b2b28';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, mid-sheet, press 13 landing exactly at 60 */
var COLS = 4, ROWS = 8, CELLS = 32;
var FILL_END = 150; /* sheet fills by ~140 s, holds, then swaps */
var SWAP_START = 150, SWAP_END = 168, CYCLE = 168;
var ANCHOR = 13; /* press index landing exactly at t = 60 s */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- fixed press schedule, seed 1791 ----
   Gaps 3.2-5.6 s (steady but never metronomic). Prefix gaps are scaled
   so press 13 lands exactly at t = 60 s (head down at frame one);
   suffix gaps are scaled so the last press lands at t = 140 s.
   ~16% of presses are doubles (ink pooling, darker). */
var PRESSES = [];
var ANCHOR_T = 60;
(function buildPresses() {
  var rng = mulberry32(1791);
  var gaps = [], i;
  for (i = 0; i < CELLS; i++) gaps.push(3.2 + rng() * 2.4);
  var pre = 0, suf = 0;
  for (i = 0; i <= ANCHOR; i++) pre += gaps[i];
  for (i = ANCHOR + 1; i < CELLS; i++) suf += gaps[i];
  var fPre = ANCHOR_T / pre, fSuf = 80 / suf;
  var t = 0;
  for (i = 0; i < CELLS; i++) {
    t += gaps[i] * (i <= ANCHOR ? fPre : fSuf);
    PRESSES.push({
      t: t,
      row: Math.floor(i / COLS), col: i % COLS,
      rot: (rng() - 0.5) * 0.55,
      scale: 0.90 + rng() * 0.20,
      alpha: 0.72 + rng() * 0.23,
      spikes: 9 + Math.floor(rng() * 5),
      dbl: rng() < 0.16,
      jx: (rng() - 0.5) * 0.18, jy: (rng() - 0.5) * 0.18,
      j: [rng(), rng(), rng(), rng(), rng(), rng()]
    });
  }
  /* guarantee a darker double is visible at frame one */
  var hasDbl = false;
  for (i = 0; i <= ANCHOR; i++) if (PRESSES[i].dbl) hasDbl = true;
  if (!hasDbl) PRESSES[Math.max(0, ANCHOR - 2)].dbl = true;
})();
function pressedCount(t) {
  var n = 0, i;
  for (i = 0; i < CELLS; i++) if (PRESSES[i].t <= t) n++;
  return n;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var S = { x: 0, y: 0, side: 0, gx: 0, gy: 0, gw: 0, gh: 0, cw: 0, ch: 0 }; /* sheet + grid geometry */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    S.x = 0; S.y = 0; S.side = Math.min(VW, VH);
    /* full-bleed sheet on phones: sheet is the whole viewport */
    S.x = 0; S.y = 0; S.side = 0;
    S.gx = 0; S.gy = 0; S.gw = VW; S.gh = VH;
  } else {
    var side = Math.min(VW, VH) - 40;
    S.x = (VW - side) / 2; S.y = (VH - side) / 2; S.side = side;
    S.gx = S.x; S.gy = S.y; S.gw = side; S.gh = side;
  }
  var m = Math.min(S.gw, S.gh) * 0.07;
  S.gx = S.gx + m; S.gy = S.gy + m;
  S.gw = S.gw - 2 * m; S.gh = S.gh - 2 * m;
  S.cw = S.gw / COLS; S.ch = S.gh / ROWS;
}
function cellCenter(pr) {
  return {
    x: S.gx + (pr.col + 0.5 + pr.jx) * S.cw,
    y: S.gy + (pr.row + 0.5 + pr.jy) * S.ch
  };
}
/* head state at sheet-clock t: position + press factor 0..1 (1 = fully down).
   k is the next press at or after t, so at t exactly on a press time the
   head is down on that cell; the dwell after a press keeps the head over
   the cell it just pressed until the lift finishes. */
function headState(t) {
  var k = CELLS, i;
  for (i = 0; i < CELLS; i++) { if (PRESSES[i].t >= t) { k = i; break; } }
  function pressFactor(pk) {
    if (!pk) return 0;
    if (t >= pk.t - 0.05 && t <= pk.t + 0.55) return 1;
    if (t > pk.t - 0.45 && t < pk.t - 0.05) return smooth((t - (pk.t - 0.45)) / 0.4);
    if (t > pk.t + 0.55 && t < pk.t + 0.95) return 1 - smooth((t - (pk.t + 0.55)) / 0.4);
    return 0;
  }
  var down = Math.max(
    pressFactor(k < CELLS ? PRESSES[k] : null),
    pressFactor(k > 0 ? PRESSES[k - 1] : null)
  );
  if (k >= CELLS) {
    /* sheet full, head rests lifted above the last cell */
    var last = cellCenter(PRESSES[CELLS - 1]);
    return { x: last.x, y: last.y - 100, press: 0, k: CELLS };
  }
  var pk = PRESSES[k];
  var ck = cellCenter(pk);
  var x = ck.x, y = ck.y;
  if (k > 0) {
    var prev = PRESSES[k - 1], cp = cellCenter(prev);
    if (t < prev.t + 0.95) {
      /* still dwelling over the cell just pressed */
      x = cp.x; y = cp.y;
    } else {
      var u = smooth((t - (prev.t + 0.95)) / Math.max(0.01, (pk.t - 0.45) - (prev.t + 0.95)));
      x = cp.x + (ck.x - cp.x) * u;
      y = cp.y + (ck.y - cp.y) * u;
    }
  }
  var drop = -100 + 98 * down;
  return { x: x, y: y + drop, press: down, k: k };
}
function drawBurst(pr, t) {
  var c = cellCenter(pr);
  var age = t - pr.t;
  var settle = age < 0.25 ? 0.85 + 0.6 * age : 1.0;
  var R = Math.min(S.cw, S.ch) * 0.40 * pr.scale * settle;
  var n = pr.spikes, i;
  function star(cx, cy, r, rot) {
    ctx.beginPath();
    for (i = 0; i < n * 2; i++) {
      var a = rot + (i / (n * 2)) * TAU;
      var rr = (i % 2 === 0) ? r : r * 0.42;
      var px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }
  if (pr.dbl) {
    /* second impression, offset and darker: the ink pool */
    star(c.x + 2.5, c.y + 2, R * 1.04, pr.rot + 0.06);
    ctx.fillStyle = rgba(INK_DEEP, 0.55 * pr.alpha);
    ctx.fill();
  }
  star(c.x, c.y, R, pr.rot);
  ctx.fillStyle = rgba(INK, pr.alpha);
  ctx.fill();
  /* darker core where the stamp bit hardest */
  ctx.beginPath();
  ctx.arc(c.x, c.y, R * 0.30, 0, TAU);
  ctx.fillStyle = rgba(INK_DARK, 0.45 * pr.alpha);
  ctx.fill();
  /* ink specks thrown off the stamp */
  ctx.fillStyle = rgba(INK, 0.5 * pr.alpha);
  for (i = 0; i < 6; i++) {
    var a = pr.j[i] * TAU;
    var d = R * (1.05 + pr.j[(i + 2) % 6] * 0.35);
    ctx.fillRect(c.x + Math.cos(a) * d, c.y + Math.sin(a) * d, 1.4, 1.4);
  }
}
function drawSheet(sheetClock, offY) {
  ctx.save();
  ctx.translate(0, offY);
  /* soft shadow on the table (desktop only: sheet is inset) */
  if (!isPhone) {
    ctx.fillStyle = 'rgba(30,28,25,0.18)';
    ctx.fillRect(S.x + 6, S.y + 8, S.side, S.side);
  }
  ctx.fillStyle = PAPER;
  if (isPhone) ctx.fillRect(0, 0, VW, VH);
  else ctx.fillRect(S.x, S.y, S.side, S.side);
  /* faint paper grain, fixed seeded specks */
  var rng = mulberry32(1791);
  ctx.fillStyle = 'rgba(43,41,38,0.05)';
  var i;
  for (i = 0; i < 90; i++) {
    var px = isPhone ? rng() * VW : S.x + rng() * S.side;
    var py = isPhone ? rng() * VH : S.y + rng() * S.side;
    ctx.fillRect(px, py, 1.3, 1.3);
  }
  /* graphite grid: clear borders between loose rows and columns */
  ctx.strokeStyle = 'rgba(74,74,70,0.5)';
  ctx.lineWidth = 1;
  for (i = 1; i < COLS; i++) {
    var vx = S.gx + i * S.cw;
    ctx.beginPath(); ctx.moveTo(vx, S.gy); ctx.lineTo(vx, S.gy + S.gh); ctx.stroke();
  }
  for (i = 1; i < ROWS; i++) {
    var hy = S.gy + i * S.ch;
    ctx.beginPath(); ctx.moveTo(S.gx, hy); ctx.lineTo(S.gx + S.gw, hy); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(74,74,70,0.65)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(S.gx + 0.5, S.gy + 0.5, S.gw - 1, S.gh - 1);
  /* pressed bursts */
  if (sheetClock !== null) {
    for (i = 0; i < CELLS; i++) {
      if (PRESSES[i].t <= sheetClock) drawBurst(PRESSES[i], sheetClock);
    }
  }
  /* sheet edge */
  ctx.strokeStyle = 'rgba(43,41,38,0.35)';
  ctx.lineWidth = 1.5;
  if (isPhone) ctx.strokeRect(0.75, 0.75, VW - 1.5, VH - 1.5);
  else ctx.strokeRect(S.x + 0.75, S.y + 0.75, S.side - 1.5, S.side - 1.5);
  ctx.restore();
}
function drawHead(hs) {
  var bw = S.cw * 0.62, bh = 44;
  var top = hs.y - bh, bot = hs.y;
  /* soft shadow on the paper under the head */
  ctx.fillStyle = 'rgba(30,28,25,' + (0.06 + 0.10 * hs.press).toFixed(4) + ')';
  ctx.beginPath();
  ctx.ellipse(hs.x, bot + 6, S.cw * 0.45, 7, 0, 0, TAU);
  ctx.fill();
  /* arm entering from the top edge */
  ctx.fillStyle = HEAD_ARM;
  ctx.fillRect(hs.x - 8, -10, 16, top + 10);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(hs.x - 8, -10, 3, top + 10);
  /* collar */
  ctx.fillStyle = HEAD_BODY;
  ctx.fillRect(hs.x - bw * 0.32, top - 8, bw * 0.64, 10);
  /* head block */
  ctx.fillStyle = HEAD_BODY;
  ctx.fillRect(hs.x - bw / 2, top, bw, bh);
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(hs.x - bw / 2, top, bw, 3);
  /* stamp face */
  ctx.fillStyle = HEAD_FACE;
  ctx.fillRect(hs.x - bw * 0.52, bot - 8, bw * 1.04, 8);
  ctx.fillStyle = 'rgba(180,85,45,0.55)';
  ctx.fillRect(hs.x - bw * 0.52, bot - 2, bw * 1.04, 2);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Stencil, Ink, Repeat').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Stencil, Ink, Repeat').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 07').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Stencil, Ink, Repeat', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 07', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* faint table streaks */
  var rng = mulberry32(1791);
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  var i;
  for (i = 0; i < 5; i++) {
    ctx.fillRect(0, rng() * VH, VW, 2);
  }
  var cycleT = ((phaseT % CYCLE) + CYCLE) % CYCLE;
  if (cycleT < SWAP_START) {
    drawSheet(cycleT, 0);
    drawHead(headState(cycleT));
  } else {
    /* sheet swap: full sheet slides down, fresh blank sheet slides in */
    var p = (cycleT - SWAP_START) / (SWAP_END - SWAP_START);
    var travel = (isPhone ? VH : S.side) + 120;
    drawSheet(null, travel * (p - 1)); /* fresh blank sheet, sliding in from top */
    drawSheet(FILL_END, travel * p); /* finished sheet, sliding out below */
  }
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    pressedCount: function (t) { return pressedCount(t); },
    pressTimes: function () {
      var out = [], i;
      for (i = 0; i < CELLS; i++) out.push(PRESSES[i].t);
      return out;
    },
    anchorIndex: function () { return ANCHOR; },
    grid: function () { return { cols: COLS, rows: ROWS, cells: CELLS }; },
    headState: function (t) { return headState(t); }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
