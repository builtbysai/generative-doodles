<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.260 Nambu Tide</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#2A2118; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.260 Nambu Tide (Stanzin Tsepel). After Where
// Mountains Meet the Sea (Fremantle Biennale 2025):
// hand-woven nambu wool cones, off-white with bold black
// stripes, hang over a warm sand floor with white salt
// mounds. The cones sway almost imperceptibly, breathing
// tidal; their shadows ripple outward across the sand in
// slow concentric rings. Shadow is the second artwork.
// A seamless 30 second loop. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var WOOL = '#E9E3D4', STRIPE = '#141414', SAND = '#C7A15E', SALT = '#FFFFFF', SHADOW = '#2A2118';
var DW = 1280, DH = 900, FLOOR = 470; // sand begins here
var W = 0, H = 0, phone = false;
var T = 7.3, lastNow = -1; // frame one: cones hung, a ring already expanding

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- the cones: seeded cluster hanging from the top edge -----------------------
var cones = [];
(function () {
  var r = rng(26011);
  var xs = [235, 415, 590, 745, 905, 1055];
  for (var i = 0; i < xs.length; i++) {
    var len = 235 + r() * 160;
    cones.push({
      x: xs[i] + (r() - 0.5) * 36,
      len: len,
      topHW: 76 + r() * 30,               // half width at the mouth
      stripes: 4 + Math.floor(r() * 3),   // bold black bands
      ph1: r() * Math.PI * 2,            // sway phase, axis one
      ph2: r() * Math.PI * 2,            // sway phase, axis two
      shX: xs[i] + 66 + (r() - 0.5) * 30, // shadow centroid on the sand
      shY: FLOOR + 128 + r() * 150,
      shR: 74 + r() * 34,
      ringOff: r() * 10
    });
  }
})();
// ---- salt mounds in a receding diagonal, and sand grain ---------------------------
var mounds = [], grain = [];
(function () {
  var r = rng(26023);
  for (var i = 0; i < 8; i++) {
    var f = i / 7;
    mounds.push({ x: 170 + f * 900 + (r() - 0.5) * 40, y: 852 - f * 218, s: 1 - f * 0.55 });
  }
  var r2 = rng(26031);
  for (var j = 0; j < 1500; j++) grain.push({ x: r2() * DW, y: FLOOR + r2() * (DH - FLOOR), s: 0.8 + r2() * 1.6, a: 0.04 + r2() * 0.07, dark: r2() < 0.55 });
})();

function conePath(c, tipX, tipY) {
  // a hanging cone: wide mouth at the cord, point down
  ctx.beginPath();
  ctx.moveTo(c.x - c.topHW, 0);
  ctx.quadraticCurveTo(c.x - c.topHW * 0.66, c.len * 0.52, tipX, tipY);
  ctx.quadraticCurveTo(c.x + c.topHW * 0.66, c.len * 0.52, c.x + c.topHW, 0);
  ctx.closePath();
}

function draw() {
  // the dark room above, the sand below
  ctx.fillStyle = SHADOW;
  ctx.fillRect(0, 0, DW, DH);
  ctx.fillStyle = SAND;
  ctx.fillRect(0, FLOOR, DW, DH - FLOOR);
  // the sand darkens with depth, in flat bands
  ctx.fillStyle = rgba(SHADOW, 0.13);
  ctx.fillRect(0, FLOOR, DW, 10);
  ctx.fillStyle = rgba(SHADOW, 0.06);
  ctx.fillRect(0, FLOOR + 10, DW, 26);
  ctx.fillStyle = rgba('#FFFFFF', 0.05);
  ctx.fillRect(0, DH - 60, DW, 60);
  for (var g = 0; g < grain.length; g++) {
    var gr = grain[g];
    ctx.fillStyle = gr.dark ? rgba(SHADOW, gr.a) : rgba(SALT, gr.a);
    ctx.fillRect(gr.x, gr.y, gr.s, gr.s);
  }

  var TWO_PI = Math.PI * 2;
  // sway stays a whisper: a few px at the tip, periods dividing 30s
  function swayOf(c) {
    return {
      x: Math.sin(T * TWO_PI / 15 + c.ph1) * 5.5 + Math.sin(T * TWO_PI / 30 + c.ph2) * 3.5,
      y: Math.sin(T * TWO_PI / 30 + c.ph1) * 2.2
    };
  }

  // ---- shadows and their ripple rings, under everything -------------------------
  for (var i = 0; i < cones.length; i++) {
    var c = cones[i];
    var sw = swayOf(c);
    var cxp = c.shX + sw.x * 1.7, cyp = c.shY + sw.y * 1.2;
    // soft-edged shadow: three nested flat ellipses
    var layers = [[1.0, 0.10], [0.78, 0.12], [0.55, 0.14]];
    for (var l = 0; l < 3; l++) {
      ctx.fillStyle = rgba(SHADOW, layers[l][1]);
      ctx.beginPath();
      ctx.ellipse(cxp, cyp, c.shR * layers[l][0], c.shR * 0.34 * layers[l][0], 0, 0, TWO_PI);
      ctx.fill();
    }
    // rings: two per cone, expanding and fading, driven by the sway phase
    for (var q = 0; q < 2; q++) {
      var rp = ((T * 3.4 + c.ringOff + q * 5) % 10) / 10;   // 0..1 over ~2.9s.. staggered
      var rr = 14 + rp * c.shR * 1.75;
      ctx.strokeStyle = rgba(SHADOW, 0.20 * (1 - rp));
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.ellipse(cxp, cyp, rr, rr * 0.34, 0, 0, TWO_PI);
      ctx.stroke();
    }
  }
  // ---- salt mounds ---------------------------------------------------------------
  for (var m = 0; m < mounds.length; m++) {
    var md = mounds[m];
    var mw = 30 * md.s, mh = 21 * md.s;
    ctx.fillStyle = rgba(SHADOW, 0.16);
    ctx.beginPath(); ctx.ellipse(md.x, md.y + mh * 0.32, mw * 0.9, mh * 0.26, 0, 0, TWO_PI); ctx.fill();
    ctx.fillStyle = SALT;
    ctx.beginPath();
    ctx.moveTo(md.x - mw, md.y + mh * 0.4);
    ctx.quadraticCurveTo(md.x - mw * 0.3, md.y - mh * 0.4, md.x, md.y - mh);
    ctx.quadraticCurveTo(md.x + mw * 0.3, md.y - mh * 0.4, md.x + mw, md.y + mh * 0.4);
    ctx.closePath(); ctx.fill();
    // one lit edge
    ctx.strokeStyle = rgba('#FFFFFF', 0.9);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(md.x, md.y - mh);
    ctx.quadraticCurveTo(md.x + mw * 0.3, md.y - mh * 0.4, md.x + mw, md.y + mh * 0.4);
    ctx.stroke();
  }
  // ---- the cones themselves ---------------------------------------------------------
  for (var j = 0; j < cones.length; j++) {
    var cn = cones[j];
    var sw2 = swayOf(cn);
    var tipX = cn.x + sw2.x, tipY = cn.len + sw2.y;
    // the cord
    ctx.strokeStyle = rgba(WOOL, 0.35);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cn.x, -4); ctx.lineTo(cn.x, 4); ctx.stroke();
    // wool body, stripes clipped inside the cone's own path
    ctx.save();
    conePath(cn, tipX, tipY);
    ctx.clip();
    ctx.fillStyle = WOOL;
    ctx.fillRect(cn.x - cn.topHW - 4, 0, cn.topHW * 2 + 8, cn.len + 12);
    // bold horizontal bands, following the cone's taper in width only
    ctx.fillStyle = STRIPE;
    var bandH = cn.len / (cn.stripes * 2 - 0.4);
    for (var b = 0; b < cn.stripes; b++) {
      var by = bandH * (0.6 + b * 2);
      ctx.fillRect(cn.x - cn.topHW - 4, by, cn.topHW * 2 + 8, bandH * 0.92);
    }
    // woven shading: one flank in the deep shadow tone, a lit sliver on the other
    ctx.fillStyle = rgba(SHADOW, 0.11);
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.quadraticCurveTo(cn.x + cn.topHW * 0.62, cn.len * 0.52, cn.x + cn.topHW, 0);
    ctx.lineTo(cn.x + cn.topHW * 0.45, 0);
    ctx.quadraticCurveTo(cn.x + cn.topHW * 0.34, cn.len * 0.52, tipX, tipY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = rgba('#FFFFFF', 0.13);
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.quadraticCurveTo(cn.x - cn.topHW * 0.62, cn.len * 0.52, cn.x - cn.topHW, 0);
    ctx.lineTo(cn.x - cn.topHW * 0.78, 0);
    ctx.quadraticCurveTo(cn.x - cn.topHW * 0.4, cn.len * 0.52, tipX, tipY);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // the cone's outline, so the weave holds its shape against the dark
    conePath(cn, tipX, tipY);
    ctx.strokeStyle = rgba(SHADOW, 0.35);
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = SHADOW;
  ctx.fillRect(0, 0, W, H);
  // contain-fit: the hanging cluster keeps its shape, centred
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
