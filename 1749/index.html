<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Inventory Title</title>
<style>
html, body { margin: 0; padding: 0; background: #FFFFFF; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#FFFFFF';
var KRAFT = '#C49A6C';
var KRAFT_DARK = '#A67C4E';
var INK = '#111111';
var TYPE = '#444444';
var PLATE = '#F4F1EC';
var PLATE_LINE = 'rgba(68,68,68,0.55)';
var TITLE_INK = '#222222';
var HINT_INK = '#555555';
var FRAME_T = 60.0;
var POOL_N = 312;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1749);
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
size();
/* ---- the unit pool: 312 slots, each with a fixed lifespan and gap.
   A slot is alive when (t + offset) mod period < lifespan, so the live
   census is a closed-form function of piece time: no frame-integrated
   state, no randomness after load, frame one is reproducible. ---- */
var UNITS = [];
(function () {
  var i, ux, uy;
  var zone = plateRects();
  for (i = 0; i < POOL_N; i++) {
    var life = 6 + rng() * 12;
    var gap = 1 + rng() * 3.5;
    /* rejection-sample positions out of the bottom-left plate corner,
       so every live unit is drawn and the census stays honest */
    do {
      ux = 0.04 + rng() * 0.92;
      uy = 0.36 + rng() * 0.58;
    } while (ux * VW < zone.titleW + 28 && uy * VH > zone.titleY - 12);
    UNITS.push({
      x: ux,
      y: uy,
      life: life,
      period: life + gap,
      offset: rng() * (life + gap),
      size: 0.0055 + rng() * 0.0045,
      tick: 0.6 + rng() * 1.8,
      tickPhase: rng() * TAU,
      dark: rng() < 0.5
    });
  }
})();
function unitStateAt(u, t) {
  var tt = t + u.offset;
  var f = tt % u.period;
  if (f < 0) f += u.period;
  if (f >= u.life) return null;
  var a = 1;
  if (f < 0.9) a = f / 0.9;
  else if (f > u.life - 0.9) a = (u.life - f) / 0.9;
  return { alpha: clamp(a, 0, 1), age: f };
}
function liveCountAt(t) {
  var i, n = 0;
  for (i = 0; i < UNITS.length; i++) {
    if (unitStateAt(UNITS[i], t) !== null) n++;
  }
  return n;
}
function inventoryTextAt(t) {
  return liveCountAt(t) + ' prepared oscillators, cotton balls, cardboard box 70x70x70cm';
}
/* ---- plates sit stacked in the bottom-left corner, clear of the
   inventory line at the top; units keep out of that corner. ---- */
function plateRects() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var titleW = ctx.measureText('The Inventory Title').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 26').width;
  var titlePlateW = Math.max(titleW, dateW) + 28;
  var titlePlateH = titlePx + smallPx + 20;
  var hint = 'Watch only.';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintY = VH - hintPlateH - 12;
  var titleY = hintY - 8 - titlePlateH;
  return {
    smallPx: smallPx, titlePx: titlePx,
    titleW: titlePlateW, titleH: titlePlateH, titleX: 12, titleY: titleY,
    hintW: hintPlateW, hintH: hintPlateH, hintX: 12, hintY: hintY
  };
}
function drawUnits(t) {
  var s = Math.min(VW, VH);
  var i, u, st, cx, cy, half, ang, tx, ty;
  for (i = 0; i < UNITS.length; i++) {
    u = UNITS[i];
    st = unitStateAt(u, t);
    if (st === null) continue;
    cx = u.x * VW;
    cy = u.y * VH;
    half = Math.max(u.size * s, 2.5);
    ctx.fillStyle = rgba(u.dark ? KRAFT_DARK : KRAFT, st.alpha);
    ctx.fillRect(cx - half, cy - half, half * 2, half * 2);
    ctx.strokeStyle = rgba(INK, st.alpha);
    ctx.lineWidth = Math.max(s * 0.0016, 0.8);
    ang = u.tickPhase + t * u.tick;
    tx = cx + Math.cos(ang) * half * 1.35;
    ty = cy + Math.sin(ang) * half * 1.35;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.fillStyle = rgba(INK, st.alpha);
    ctx.beginPath();
    ctx.moveTo(cx + Math.max(s * 0.0016, 1), cy);
    ctx.arc(cx, cy, Math.max(s * 0.0016, 1), 0, TAU);
    ctx.fill();
  }
}
function drawInventory(t) {
  var text = inventoryTextAt(t);
  var px = isPhone ? 12 : 14;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = px + 'px monospace';
  while (px > 8 && ctx.measureText(text).width > VW - 24) {
    px -= 1;
    ctx.font = px + 'px monospace';
  }
  ctx.fillStyle = TYPE;
  ctx.fillText(text, VW / 2, isPhone ? 12 : 18);
}
function drawPlates() {
  var r = plateRects();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = PLATE;
  ctx.fillRect(r.titleX, r.titleY, r.titleW, r.titleH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(r.titleX + 0.5, r.titleY + 0.5, r.titleW - 1, r.titleH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + r.titlePx + 'px monospace';
  ctx.fillText('The Inventory Title', r.titleX + 14, r.titleY + 7);
  ctx.font = r.smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 26', r.titleX + 14, r.titleY + 7 + r.titlePx + 3);
  ctx.fillStyle = PLATE;
  ctx.fillRect(r.hintX, r.hintY, r.hintW, r.hintH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(r.hintX + 0.5, r.hintY + 0.5, r.hintW - 1, r.hintH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.font = r.smallPx + 'px monospace';
  ctx.fillText('Watch only.', r.hintX + 12, r.hintY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawUnits(phaseT);
  drawInventory(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    liveCountAt: function (t) { return liveCountAt(t); },
    poolSize: function () { return POOL_N; },
    inventoryTextAt: function (t) { return inventoryTextAt(t); },
    unitStateAt: function (i, t) { return unitStateAt(UNITS[i], t); },
    drawnCountAt: function (t) { return liveCountAt(t); },
    unitsInPlateZone: function () {
      var r = plateRects(), i, n = 0;
      for (i = 0; i < UNITS.length; i++) {
        if (UNITS[i].x * VW < r.titleW + 28 && UNITS[i].y * VH > r.titleY - 12) n++;
      }
      return n;
    },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, field already populated ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
