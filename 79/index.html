<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№79 · Refraction Wedge</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F3EDE1; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(20,20,20,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to aim the wedge</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const GROUND='#F3EDE1', INK='#141414', PAL=['#1F4ED8','#2E9E5B','#E03A1F','#D9A02B'];

// No.79 Refraction Wedge: 8 rings x 24 wedges = 192
const RINGS=8, SEGS=24;
let dragTheta=null, holdUntil=-1, dragging=false;
function getTheta(t){
  if(dragging && dragTheta!==null) return dragTheta;
  if(dragTheta!==null && t<holdUntil) return dragTheta;
  return 2*Math.PI*t/24;
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const t=nowMs/1000;
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h);
  const cx=w/2, cy=h/2, R=Math.min(w,h)*0.40, rw=R/RINGS;
  const theta=getTheta(t);
  let count=0;
  for(let ring=0;ring<RINGS;ring++){
    const r0=ring*rw, r1=(ring+1)*rw;
    for(let i=0;i<SEGS;i++){
      const a0=i*2*Math.PI/SEGS, a1=(i+1)*2*Math.PI/SEGS, mid=(a0+a1)/2;
      let rel=((mid-theta)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
      const inWedge = rel < Math.PI/2;
      let idx = inWedge ? ((ring - i)%4+4)%4 : ((i+ring)%4);
      ctx.beginPath();
      ctx.arc(cx,cy,r1,a0,a1); ctx.arc(cx,cy,Math.max(r0,0.1),a1,a0,true); ctx.closePath();
      ctx.fillStyle=PAL[idx]; ctx.fill();
      count++;
    }
  }
  if(count!==192) console.assert(false,'count',count);
  ctx.strokeStyle=INK; ctx.lineWidth=2;
  for(const s of [0, Math.PI/2]){
    const a=theta+s;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); ctx.stroke();
  }
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; const [w,h]=viewportWH(); dragTheta=Math.atan2(e.clientY-h/2,e.clientX-w/2); });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const [w,h]=viewportWH(); dragTheta=Math.atan2(e.clientY-h/2,e.clientX-w/2); });
function endP(){ if(dragging){ dragging=false; holdUntil=performance.now()/1000+4; } }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
