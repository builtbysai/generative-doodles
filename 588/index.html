<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manivela</title>
<style>
  html, body { margin: 0; padding: 0; background: #F5F0E6; overflow: hidden; }
  canvas { display: block; cursor: grab; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var TAU = Math.PI * 2;
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function mod(n, m) { return ((n % m) + m) % m; }

// ---------- palette (strict, julia-barata block 4) ----------
var INK = "#1A1A1A";    // ink black: figure, outlines, sprockets
var PAPER = "#F5F0E6";  // translucent tracing paper; also the page ground
var RED = "#D42B1E";    // flat red: birds and phone screens ONLY
var KRAFT = "#C8A97E";  // Cinegraf viewer body

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone() {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0 && mn < 700) return true;
  return H > W * 1.15;
}

function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  draw();
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
}
window.addEventListener("resize", resize);

// ---------- stage ----------
// The scene is composed in a 1000x1000 stage, scaled to fit and centered.
function stageTransform() {
  var s = Math.min(W, H) / 1000;
  return { s: s, ox: (W - 1000 * s) / 2, oy: (H - 1000 * s) / 2 };
}
function toStage(px, py) {
  var t = stageTransform();
  return { x: (px - t.ox) / t.s, y: (py - t.oy) / t.s };
}

// ---------- paper grain (precomputed seeded speckles, drawn directly) ----------
var grain = [];
(function () {
  var rnd = mulberry32(588001);
  for (var i = 0; i < 260; i++) {
    grain.push({ x: rnd() * 1000, y: rnd() * 1000, r: 0.8 + rnd() * 1.6, a: 0.03 + rnd() * 0.05 });
  }
})();
// per-frame hand-drawn wobble, deterministic per frame index
var frameJitter = [];
(function () {
  var rnd = mulberry32(588002);
  for (var i = 0; i < 9; i++) {
    frameJitter.push({ dx: (rnd() - 0.5) * 3, dy: (rnd() - 0.5) * 3, rot: (rnd() - 0.5) * 0.02 });
  }
})();

// ---------- the film: 9 hand-drawn frames (Tindergraf) ----------
// A figure swipes through phones; the phones turn into birds and fly off.
// morph: 0 = phone in hand, 1 = phone sprouting bird parts, 2 = bird gone.
// birds: loose birds already in flight [{x, y, s, flap}] in frame units.
// arm: angle of the phone arm; headTilt: radians; wave: free arm raised.
var FRAMES = [
  { arm: -0.5, headTilt: 0.10, morph: 0, morphT: 0, birds: [], wave: false, swipe: 0 },
  { arm: -0.9, headTilt: 0.14, morph: 0, morphT: 0, birds: [], wave: false, swipe: 1 },
  { arm: -0.7, headTilt: 0.08, morph: 1, morphT: 0.45, birds: [], wave: false, swipe: 0 },
  { arm: -0.6, headTilt: 0.02, morph: 1, morphT: 0.8, birds: [], wave: false, swipe: 0 },
  { arm: -1.1, headTilt: -0.08, morph: 2, morphT: 1, birds: [{ x: 18, y: -92, s: 1.0, flap: 0 }], wave: false, swipe: 0 },
  { arm: -1.2, headTilt: -0.16, morph: 2, morphT: 1, birds: [{ x: 52, y: -116, s: 1.0, flap: 1 }], wave: false, swipe: 0 },
  { arm: -1.9, headTilt: -0.18, morph: 2, morphT: 1, birds: [{ x: 30, y: -110, s: 0.95, flap: 0 }, { x: 74, y: -80, s: 0.7, flap: 1 }], wave: true, swipe: 0 },
  { arm: -1.9, headTilt: -0.20, morph: 2, morphT: 1, birds: [{ x: -6, y: -124, s: 0.8, flap: 1 }, { x: 48, y: -106, s: 0.9, flap: 0 }, { x: 88, y: -126, s: 0.65, flap: 1 }], wave: true, swipe: 0 },
  { arm: -2.6, headTilt: -0.14, morph: 2, morphT: 1, birds: [{ x: 92, y: -128, s: 0.45, flap: 0 }], wave: true, swipe: 0 }
];
var NFRAMES = FRAMES.length;
var PITCH = 240;              // frame pitch in stage units
var FRAMES_PER_REV = 3;       // one full crank turn advances 3 frames

// ---------- interaction state ----------
// The film NEVER autoplays. Its position is pure drag state: crankAngle is
// accumulated from circular pointer drags around the crank hub, and the
// displayed frame is that angle, quantized. No time enters the picture.
var crankAngle = 0;           // radians; 0 = rest, knob up, film at frame 0
var cranking = false;
var lastPointerAngle = 0;
var CRANK = { x: 740, y: 630, hubR: 26, armR: 58, grabR: 150 };

function displayedFrame() {
  var f = Math.round(crankAngle / TAU * FRAMES_PER_REV);
  return f; // unbounded; slots resolve it with mod()
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function line(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function circle(x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  if (fill) ctx.fill(); else ctx.stroke();
}

// A loose red bird, punk ink-and-red style. flap 0 = wings up, 1 = wings down.
function drawBird(x, y, s, flap) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = RED; ctx.fillStyle = RED;
  ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
  // body
  ctx.beginPath();
  ctx.moveTo(-20, 4);
  ctx.quadraticCurveTo(0, -8, 20, 2);
  ctx.quadraticCurveTo(6, 10, -12, 10);
  ctx.closePath(); ctx.fill();
  // head + beak
  circle(22, -2, 7, true);
  ctx.beginPath();
  ctx.moveTo(28, -3); ctx.lineTo(38, 0); ctx.lineTo(28, 3); ctx.closePath(); ctx.fill();
  // wing
  var wy = flap ? 12 : -18;
  ctx.beginPath();
  ctx.moveTo(-2, 0);
  ctx.quadraticCurveTo(-8, wy - 6, -22, wy);
  ctx.quadraticCurveTo(-8, 4, 2, 4);
  ctx.closePath(); ctx.fill();
  // tail
  ctx.beginPath();
  ctx.moveTo(-18, 6); ctx.lineTo(-30, 12); ctx.lineTo(-26, 2); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// The phone, mid-morph. t: 0 = plain phone, 1 = fully bird (body only;
// free-flying birds are drawn from the frame's bird list).
function drawPhone(x, y, rot, t) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.lineWidth = 4.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (t < 0.9) {
    // phone body (ink) shrinking as the bird takes over
    var w = 30 * (1 - t * 0.35), h = 46 * (1 - t * 0.3);
    ctx.fillStyle = INK;
    rr(-w / 2, -h / 2, w, h, 6); ctx.fill();
    // screen: the one red surface
    ctx.fillStyle = RED;
    rr(-w / 2 + 5, -h / 2 + 6, w - 10, h - 16, 3); ctx.fill();
    if (t > 0.05) {
      // white heart-ish spark cracking into a bird silhouette
      ctx.fillStyle = PAPER;
      var hs = 4 + t * 5;
      ctx.beginPath();
      ctx.arc(-hs * 0.45, -2, hs * 0.55, 0, TAU);
      ctx.arc(hs * 0.45, -2, hs * 0.55, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-hs, 0); ctx.lineTo(hs, 0); ctx.lineTo(0, hs * 1.1); ctx.closePath(); ctx.fill();
    }
  }
  if (t > 0.25) {
    // bird parts sprouting from the phone: wing, head, beak, tail
    var g = (t - 0.25) / 0.75;
    ctx.strokeStyle = RED; ctx.fillStyle = RED;
    ctx.lineWidth = 5;
    ctx.beginPath(); // wing sweeping up
    ctx.moveTo(-4, -6);
    ctx.quadraticCurveTo(-14, -18 - 14 * g, -30 * g - 6, -26 * g - 4);
    ctx.quadraticCurveTo(-12, -6, 0, 2);
    ctx.closePath(); ctx.fill();
    circle(14 * g + 4, -14 * g - 2, 6.5, true); // head
    ctx.beginPath(); // beak
    ctx.moveTo(19 * g + 8, -15 * g - 3); ctx.lineTo(28 * g + 12, -13 * g); ctx.lineTo(19 * g + 8, -11 * g + 2);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); // tail fanning out below
    ctx.moveTo(-8, 12);
    ctx.lineTo(-18 * g - 4, 20 * g + 10); ctx.lineTo(-4, 16);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// One film frame, drawn centered at (cx, cy) in stage units.
function drawFilmFrame(idx, cx, cy) {
  var spec = FRAMES[mod(idx, NFRAMES)];
  var j = frameJitter[mod(idx, NFRAMES)];
  ctx.save();
  ctx.translate(cx + j.dx, cy + j.dy);
  ctx.rotate(j.rot);
  ctx.strokeStyle = INK; ctx.fillStyle = INK;
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  // ground line
  ctx.lineWidth = 4;
  line(-95, 118, 95, 118);

  // loose birds already in flight
  for (var i = 0; i < spec.birds.length; i++) {
    var b = spec.birds[i];
    drawBird(b.x, b.y, b.s, b.flap);
  }

  // the figure: loose punk line, feet at y=118, head center near y=-52
  var hipY = 34, shoulderY = -18, headY = -56;
  ctx.lineWidth = 6;
  line(-8, hipY, -16, 118);          // back leg
  line(-8, hipY, 12, 118);           // front leg
  ctx.beginPath();                   // torso, slight lean
  ctx.moveTo(-8, hipY);
  ctx.quadraticCurveTo(-2, 6, 2, shoulderY);
  ctx.stroke();
  // head with tilt
  ctx.save();
  ctx.translate(4, headY); ctx.rotate(spec.headTilt);
  ctx.lineWidth = 5;
  circle(0, 0, 17, false);
  ctx.fillStyle = INK;
  circle(-6, -2, 2.2, true);         // eye
  ctx.beginPath();                   // hair tuft
  ctx.moveTo(-12, -13); ctx.lineTo(-4, -22); ctx.lineTo(2, -14);
  ctx.stroke();
  ctx.restore();
  line(2, shoulderY, 4, headY + 14); // neck

  // free arm: down, or raised in a wave
  ctx.lineWidth = 6;
  if (spec.wave) {
    ctx.beginPath();
    ctx.moveTo(2, shoulderY);
    ctx.quadraticCurveTo(-16, -34, -24, -52);
    ctx.stroke();
    line(-24, -52, -34, -62);        // waving hand flick
  } else {
    ctx.beginPath();
    ctx.moveTo(2, shoulderY);
    ctx.quadraticCurveTo(-14, 8, -18, 34);
    ctx.stroke();
  }

  // phone arm, reaching up-forward to the hand point
  var handX = 44, handY = -34;
  ctx.beginPath();
  ctx.moveTo(2, shoulderY);
  ctx.quadraticCurveTo(22, shoulderY + 12, handX, handY);
  ctx.stroke();

  // swipe motion lines on the swipe frame
  if (spec.swipe) {
    ctx.lineWidth = 3.5;
    line(24, -58, 52, -58);
    line(18, -46, 40, -46);
  }

  // the phone / morph / departed bird at the hand
  if (spec.morph < 2) {
    drawPhone(handX + 12, handY - 8, spec.arm * 0.25, spec.morphT);
  } else if (idx === 4 || mod(idx, NFRAMES) === 4) {
    // frame 4: the bird is just leaving the hand (also in birds list is fine)
  }
  ctx.restore();
}

// The film strip: translucent paper band, sprocket holes, ghost frames.
// dispF is the integer frame parked in the gate.
function drawStrip(dispF) {
  var stripY = 352, stripH = 296, midY = stripY + stripH / 2;
  // band
  ctx.fillStyle = PAPER;
  ctx.fillRect(-60, stripY, 1120, stripH);
  // soft edge shading from palette only: thin ink lines bound the band
  ctx.strokeStyle = INK; ctx.globalAlpha = 0.55; ctx.lineWidth = 3;
  line(-60, stripY, 1060, stripY);
  line(-60, stripY + stripH, 1060, stripY + stripH);
  ctx.globalAlpha = 1;
  // sprocket holes, top and bottom rows (scroll with the film, mod pitch/4)
  var sp = 60;
  var off = mod(-dispF * PITCH, sp);
  ctx.fillStyle = INK;
  for (var x = -60 + off - sp; x < 1060; x += sp) {
    ctx.globalAlpha = 0.16;
    rr(x, stripY + 14, 28, 15, 5); ctx.fill();
    rr(x, stripY + stripH - 29, 28, 15, 5); ctx.fill();
    ctx.globalAlpha = 0.4;
    rr(x, stripY + 14, 28, 15, 5); ctx.stroke();
    rr(x, stripY + stripH - 29, 28, 15, 5); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // frames: slot 0 sits in the gate; every slot is a 25% onion-skin ghost
  for (var s = -3; s <= 3; s++) {
    var cx = 500 + s * PITCH;
    // frame divider ticks
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.3; ctx.lineWidth = 2.5;
    line(cx - PITCH / 2, stripY + 40, cx - PITCH / 2, stripY + stripH - 40);
    ctx.globalAlpha = 0.25;
    drawFilmFrame(dispF + s, cx, midY);
    ctx.globalAlpha = 1;
  }
}

// The kraft viewer body, drawn around the gate (gate: x 386..614, y 376..624).
function drawViewer() {
  var vx = 292, vy = 282, vw = 416, vh = 436;
  var gx = 386, gy = 376, gw = 228, gh = 248;
  ctx.fillStyle = KRAFT;
  // four panels around the gate opening
  ctx.fillRect(vx, vy, vw, gy - vy);                       // top
  ctx.fillRect(vx, gy + gh, vw, vy + vh - (gy + gh));      // bottom
  ctx.fillRect(vx, gy, gx - vx, gh);                       // left
  ctx.fillRect(gx + gw, gy, vx + vw - (gx + gw), gh);      // right
  // viewer outline + gate frame
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineJoin = "round";
  ctx.strokeRect(vx, vy, vw, vh);
  ctx.lineWidth = 7;
  ctx.strokeRect(gx, gy, gw, gh);
  // corner screws
  ctx.fillStyle = INK;
  var screws = [[vx + 24, vy + 24], [vx + vw - 24, vy + 24], [vx + 24, vy + vh - 24], [vx + vw - 24, vy + vh - 24]];
  for (var i = 0; i < screws.length; i++) {
    circle(screws[i][0], screws[i][1], 7, true);
    ctx.strokeStyle = PAPER; ctx.lineWidth = 2.5;
    line(screws[i][0] - 4, screws[i][1], screws[i][0] + 4, screws[i][1]);
  }
  // name, hand-set on the top panel
  ctx.fillStyle = INK;
  ctx.font = "700 34px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("C I N E G R A F", 500, vy + 48);
  // little feet
  ctx.fillStyle = INK;
  ctx.fillRect(vx + 36, vy + vh, 54, 18);
  ctx.fillRect(vx + vw - 90, vy + vh, 54, 18);
}

// The current frame, opaque, inside the gate (clipped).
function drawGateFrame(dispF) {
  var gx = 386, gy = 376, gw = 228, gh = 248;
  ctx.save();
  ctx.beginPath(); ctx.rect(gx, gy, gw, gh); ctx.clip();
  ctx.fillStyle = PAPER;
  ctx.fillRect(gx, gy, gw, gh);
  drawFilmFrame(dispF, 500, 500);
  ctx.restore();
}

// The crank: hub on the viewer's right side, arm, handle knob.
function drawCrank() {
  var a = crankAngle - Math.PI / 2; // rest position: knob up
  var kx = CRANK.x + Math.cos(a) * CRANK.armR;
  var ky = CRANK.y + Math.sin(a) * CRANK.armR;
  // mount plate (overlaps the viewer's right edge: the crank is bolted on)
  ctx.fillStyle = KRAFT;
  ctx.strokeStyle = INK; ctx.lineWidth = 5;
  circle(CRANK.x, CRANK.y, CRANK.hubR + 14, true);
  circle(CRANK.x, CRANK.y, CRANK.hubR + 14, false);
  // arm
  ctx.lineWidth = 11; ctx.lineCap = "round";
  line(CRANK.x, CRANK.y, kx, ky);
  // hub
  ctx.fillStyle = INK;
  circle(CRANK.x, CRANK.y, 11, true);
  // handle knob (kraft barrel on an ink pin)
  ctx.strokeStyle = INK; ctx.lineWidth = 5;
  line(kx, ky, kx + 16, ky - 4);
  ctx.fillStyle = KRAFT;
  ctx.save();
  ctx.translate(kx + 26, ky - 6); ctx.rotate(a + Math.PI / 2);
  rr(-11, -20, 22, 40, 9); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// ---------- main draw ----------
function draw() {
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // page ground: the tracing-paper tone
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  var t = stageTransform();
  ctx.translate(t.ox, t.oy);
  ctx.scale(t.s, t.s);

  // grain under everything
  ctx.fillStyle = INK;
  for (var i = 0; i < grain.length; i++) {
    var g = grain[i];
    ctx.globalAlpha = g.a;
    circle(g.x, g.y, g.r, true);
  }
  ctx.globalAlpha = 1;

  var dispF = displayedFrame();
  drawStrip(dispF);       // strip + ghost frames slide under the viewer
  drawViewer();           // kraft body covers all but the gate
  drawGateFrame(dispF);   // current frame, opaque, in the gate
  drawCrank();            // crank rides on the viewer's right side

  // small hint near the crank
  ctx.fillStyle = INK;
  ctx.globalAlpha = 0.45;
  ctx.font = "17px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillText("drag", CRANK.x, CRANK.y + 128);
  ctx.globalAlpha = 1;
}

// ---------- pointer: crank only ----------
function pointerAngle(e) {
  var r = canvas.getBoundingClientRect();
  var p = toStage(e.clientX - r.left, e.clientY - r.top);
  return { a: Math.atan2(p.y - CRANK.y, p.x - CRANK.x), d: Math.hypot(p.x - CRANK.x, p.y - CRANK.y) };
}
canvas.addEventListener("pointerdown", function (e) {
  var p = pointerAngle(e);
  var grab = isPhone() ? CRANK.grabR + 30 : CRANK.grabR;
  if (p.d <= grab) {
    cranking = true;
    lastPointerAngle = p.a;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
    canvas.style.cursor = "grabbing";
  }
});
canvas.addEventListener("pointermove", function (e) {
  if (!cranking) return;
  var p = pointerAngle(e);
  var d = p.a - lastPointerAngle;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  lastPointerAngle = p.a;
  crankAngle += d;
  draw();
});
function endPointer() {
  cranking = false;
  canvas.style.cursor = "grab";
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

// ---------- run ----------
// Synchronous, deterministic first frame: film parked on frame 0 in the
// gate, ghost neighbours either side, crank at rest with the knob up.
resize();

if (typeof requestAnimationFrame === "function") {
  var loop = function () {
    draw();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
