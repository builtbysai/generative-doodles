<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.229 Never the Same Twice</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0F5B57; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.229 Never the Same Twice (Matthew Kluber). Teal, dark teal and
// chartreuse stripes stand perfectly still in three zones, with a
// dark teal interrupt band on the right third, after the 2021 Split
// Infinitives paintings. Over the paint, four independent light
// layers play on prime-number clocks: a warm wash drifting sideways
// (37s), a cool wash rising and sinking (53s), a narrow light
// rectangle travelling and reversing (61s), a slow scanline flicker
// (89s). No composite state recurs in any realistic sitting, and no
// layer is ever fast enough to strobe. The painting never moves.
// Watch only, no controls: Kluber's works have none.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var TEAL = '#2AA198', DARK = '#0F5B57', CHART = '#D4E41A';
var WARM = '255,217,160', COOL = '160,232,255';
var W = 0, H = 0, phone = false;
var T = 17, lastNow = -1; // frame one: a genuine composite, all four layers live

function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- painted stripes: precomputed per zone, fixed seed, never re-derived -------
var DH = 300;
function buildZone(seed) {
  var rand = rng(seed), bands = [], y = 0;
  while (y < DH) {
    var h = 3 + rand() * 8;
    var r = rand();
    var color = r < 0.40 ? TEAL : (r < 0.75 ? DARK : CHART);
    bands.push({ y: y, h: h, color: color });
    y += h;
  }
  return bands;
}
var zones = [buildZone(229101), buildZone(229202), buildZone(229303)];

function panel() {
  var pw = W * (phone ? 1 : 0.94);
  var ph = pw / 2;
  if (ph > H * 0.94) { ph = H * 0.94; pw = ph * 2; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
}

function draw() {
  ctx.fillStyle = DARK;
  ctx.fillRect(0, 0, W, H);
  var p = panel();
  var sy = p.h / DH;
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
  // painted layer
  for (var z = 0; z < 3; z++) {
    var zx = p.x + p.w * z / 3, zw = p.w / 3 + 1;
    var list = zones[z];
    for (var i = 0; i < list.length; i++) {
      ctx.fillStyle = list[i].color;
      ctx.fillRect(zx, p.y + list[i].y * sy, zw, Math.max(1, list[i].h * sy) + 0.5);
    }
  }
  // interrupt band: solid dark teal standing in the right third
  ctx.fillStyle = DARK;
  ctx.fillRect(p.x + p.w * 0.80, p.y, p.w * 0.055, p.h);
  // light layers, all additive
  ctx.globalCompositeOperation = 'lighter';
  var cx = p.x + p.w / 2, cy = p.y + p.h / 2, g;
  // (a) warm wash drifting horizontally, 37s
  var wx = cx + Math.sin(2 * Math.PI * T / 37 + 0.7) * p.w * 0.38;
  var bwA = p.w * 0.30;
  g = ctx.createLinearGradient(wx - bwA, 0, wx + bwA, 0);
  g.addColorStop(0, 'rgba(' + WARM + ',0)');
  g.addColorStop(0.5, 'rgba(' + WARM + ',0.16)');
  g.addColorStop(1, 'rgba(' + WARM + ',0)');
  ctx.fillStyle = g;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  // (b) cool wash rising and sinking, 53s
  var wy = cy + Math.sin(2 * Math.PI * T / 53 + 2.1) * p.h * 0.36;
  var bhB = p.h * 0.36;
  g = ctx.createLinearGradient(0, wy - bhB, 0, wy + bhB);
  g.addColorStop(0, 'rgba(' + COOL + ',0)');
  g.addColorStop(0.5, 'rgba(' + COOL + ',0.12)');
  g.addColorStop(1, 'rgba(' + COOL + ',0)');
  ctx.fillStyle = g;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  // (c) narrow light rectangle travelling and reversing, 61s
  var rx = cx + Math.sin(2 * Math.PI * T / 61 + 4.0) * p.w * 0.42;
  var rw = p.w * 0.045;
  g = ctx.createLinearGradient(rx - rw, 0, rx + rw, 0);
  g.addColorStop(0, 'rgba(255,238,196,0)');
  g.addColorStop(0.5, 'rgba(255,238,196,0.17)');
  g.addColorStop(1, 'rgba(255,238,196,0)');
  ctx.fillStyle = g;
  ctx.fillRect(rx - rw, p.y, rw * 2, p.h);
  // (d) slow scanline flicker, 89s: a whisper of light lines breathing
  var fa = 0.032 * (0.5 + 0.5 * Math.sin(2 * Math.PI * T / 89));
  ctx.fillStyle = 'rgba(255,255,255,' + fa.toFixed(3) + ')';
  for (var ly = p.y; ly < p.y + p.h; ly += 4) ctx.fillRect(p.x, ly, p.w, 1);
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only, no controls.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
