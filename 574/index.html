<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tengo Gripe</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F5F0E0; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- strict palette (PP6) ---------- */
var TABLE = '#E8B93C', RED = '#D93A2B', NAVY = '#2A3A5A',
    TEAR = '#BFD8E8', WHITE = '#FFFFFF', GREEN = '#5A9A5A',
    SKIN = '#E8B88A', SUN = '#F5D90A', PLANT = '#5A8A4A', PAPER = '#F5F0E0';

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry32(574069);

function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mixHex(h1, h2, t){
  var a = hexRgb(h1), b = hexRgb(h2), i, out = [];
  for (i=0;i<3;i++) out.push(Math.round(a[i] + (b[i]-a[i])*t));
  return 'rgb(' + out[0] + ',' + out[1] + ',' + out[2] + ')';
}

/* ---------- precomputed paper speckle (seeded data, drawn directly) ---------- */
var speckles = [];
for (var si = 0; si < 320; si++){
  speckles.push({ x: rng()*1000, y: rng()*1000, r: 0.7 + rng()*1.5, a: 0.025 + rng()*0.05, warm: rng() < 0.5 });
}

/* ---------- geometry helpers ---------- */
function jit(pts, amt){
  var out = [], i;
  for (i=0;i<pts.length;i++) out.push([pts[i][0] + (rng()*2-1)*amt, pts[i][1] + (rng()*2-1)*amt]);
  return out;
}
function pathOf(pts, close){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function fillStroke(pts, fill, stroke, w){
  pathOf(pts, true);
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = w || 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
}
function ell(cx, cy, rx, ry, fill, stroke, w){
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = w || 3; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, w){
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();
}
function tearDrop(x, y, r, fill){
  ctx.beginPath();
  ctx.moveTo(x, y - r*1.5);
  ctx.bezierCurveTo(x + r*0.95, y - r*0.25, x + r*0.8, y + r*0.35, x + r*0.62, y + r*0.72);
  ctx.arc(x, y + r*0.55, r*0.62, 0.25, Math.PI - 0.25, false);
  ctx.bezierCurveTo(x - r*0.8, y + r*0.35, x - r*0.95, y - r*0.25, x, y - r*1.5);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke();
}
function rrectPath(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function qbez(p0, p1, p2, u){
  var v = 1 - u;
  return [v*v*p0[0] + 2*v*u*p1[0] + u*u*p2[0], v*v*p0[1] + 2*v*u*p1[1] + u*u*p2[1]];
}

/* ---------- state ---------- */
var PHASE0 = 2.35;
var timeSec = PHASE0;
var cryMode = 0;              // 0 = heart cries harder, 1 = eyes cry harder
var cryMix = 0;               // smoothed 0..1 toward cryMode
var lightT = 0;               // 0 = morning, 1 = dusk (drag on window)
var lightTarget = 0;

/* ---------- precomputed shapes ---------- */
// spiky hair: zigzag band over the top of the head (head centre 360,322, rx 94, ry 102)
var hairPts = (function(){
  var pts = [], i, a, r;
  for (i=0;i<=14;i++){
    a = Math.PI * (0.97 - i/14 * 0.94);            // sweep across the top only
    r = (i % 2 === 0) ? 116 : 97;                   // spike out / valley in
    pts.push([360 + Math.cos(a)*r*0.98, 318 - Math.sin(a)*r*0.92 + (i%2===0 ? -13 : 5)]);
  }
  for (i=14;i>=0;i--){
    a = Math.PI * (0.97 - i/14 * 0.94);
    pts.push([360 + Math.cos(a)*94, 322 - Math.sin(a)*100]);
  }
  return jit(pts, 2.2);
})();
// heart outline (parametric), drawn centred via translate
var heartPts = (function(){
  var pts = [], i, a, x, y;
  for (i=0;i<40;i++){
    a = i/40 * Math.PI * 2;
    x = 16 * Math.pow(Math.sin(a), 3);
    y = 13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a);
    pts.push([x*2.6, -y*2.6]);
  }
  return pts;
})();
// caption letters with precomputed hand jitter
var CAPTION = 'No estoy llorando, tengo gripe.';
var capJit = [];
for (var ci = 0; ci < CAPTION.length; ci++) capJit.push({ dx: (rng()*2-1)*1.6, dy: (rng()*2-1)*2.2, rot: (rng()*2-1)*0.03 });

var handFont = function(size, weight){ return (weight||600) + ' ' + size + 'px "Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif'; };

/* ---------- jittered outlines, precomputed once (stable hand line) ---------- */
var BODY_PTS   = jit([[252,472],[468,472],[508,706],[212,706]], 2.5);
var COLLAR_PTS = jit([[312,438],[408,438],[404,486],[316,486]], 1.6);
var TABLE_PTS  = jit([[66,664],[934,664],[982,906],[18,906]], 2.5);
var PAGE_L     = jit([[252,706],[498,690],[498,868],[258,884]], 1.6);
var PAGE_R     = jit([[502,690],[748,706],[742,884],[502,868]], 1.6);
var POT_PTS    = jit([[-24,-26],[24,-26],[17,0],[-17,0]], 1.2);   // relative to pot centre/sill

/* ---------- tear streams ---------- */
// A stream: drops fall along a quadratic path; intensity 0..1 sets count/size/speed.
function drawStream(p0, p1, p2, intensity, tOff, baseR){
  var n = 2 + Math.round(intensity * 3);            // 2..5 drops
  var speed = 0.30 + intensity * 0.22;              // cycles per second
  var i, u, pos, r;
  for (i=0;i<n;i++){
    u = (timeSec * speed + i / n + tOff) % 1;
    pos = qbez(p0, p1, p2, u);
    r = baseR * (0.55 + intensity * 0.6) * (0.75 + u * 0.45);
    ctx.save();
    ctx.globalAlpha = u < 0.12 ? u/0.12 : (u > 0.88 ? (1-u)/0.12 : 1);
    tearDrop(pos[0], pos[1], r, i % 2 === 0 ? TEAR : WHITE);
    ctx.restore();
  }
}

/* ---------- the window (upper right) ---------- */
var WIN = { x: 612, y: 64, w: 344, h: 342 };
function drawWindow(){
  var t = lightT;
  // sky: three flat bands, morning -> dusk, palette colours only
  var bands = [
    [TEAR, NAVY], [WHITE, RED], [WHITE, TABLE]
  ];
  var i, bh = WIN.h / 3;
  ctx.save();
  ctx.beginPath(); ctx.rect(WIN.x, WIN.y, WIN.w, WIN.h); ctx.clip();
  for (i=0;i<3;i++){
    ctx.fillStyle = mixHex(bands[i][0], bands[i][1], t);
    ctx.fillRect(WIN.x, WIN.y + i*bh, WIN.w, bh + 1);
  }
  // sun disc lowers as light shifts to dusk
  var sunX = WIN.x + 218, sunY = WIN.y + 66 + t * 168;
  ell(sunX, sunY, 36, 36, mixHex(SUN, RED, t), NAVY, 3);
  // balcony railing
  ctx.strokeStyle = NAVY; ctx.lineWidth = 5; ctx.lineCap = 'round';
  line(WIN.x + 6, WIN.y + 238, WIN.x + WIN.w - 6, WIN.y + 238, NAVY, 6);
  for (i=0;i<7;i++) line(WIN.x + 34 + i*48, WIN.y + 238, WIN.x + 34 + i*48, WIN.y + 300, NAVY, 4);
  line(WIN.x + 6, WIN.y + 300, WIN.x + WIN.w - 6, WIN.y + 300, NAVY, 5);
  // sill
  ctx.fillStyle = NAVY; ctx.fillRect(WIN.x - 4, WIN.y + WIN.h - 42, WIN.w + 8, 10);
  // potted plants on the sill
  drawPlant(WIN.x + 62, WIN.y + WIN.h - 42);
  drawPlant(WIN.x + WIN.w - 62, WIN.y + WIN.h - 42);
  ctx.restore();
  // frame + mullion
  ctx.strokeStyle = NAVY; ctx.lineWidth = 10; ctx.lineJoin = 'round';
  ctx.strokeRect(WIN.x, WIN.y, WIN.w, WIN.h);
  line(WIN.x + WIN.w/2, WIN.y, WIN.x + WIN.w/2, WIN.y + WIN.h, NAVY, 7);
  // light bands cast on the wall (flat, palette colour, shift with t)
  ctx.save();
  ctx.globalAlpha = 0.13 - t * 0.04;
  ctx.fillStyle = mixHex(SUN, RED, t);
  ctx.beginPath();
  ctx.moveTo(WIN.x, 150); ctx.lineTo(WIN.x, 250); ctx.lineTo(318, 372); ctx.lineTo(318, 262); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(WIN.x, 286); ctx.lineTo(WIN.x, 348); ctx.lineTo(360, 448); ctx.lineTo(360, 380); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawPlant(cx, sillY){
  // pot
  var pot = [], pi;
  for (pi=0; pi<POT_PTS.length; pi++) pot.push([cx + POT_PTS[pi][0], sillY + POT_PTS[pi][1]]);
  fillStroke(pot, RED, NAVY, 3);
  // leaves
  var leaves = [[-20,-58],[-6,-72],[10,-66],[22,-50],[-30,-40]];
  ctx.strokeStyle = PLANT; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (var i=0;i<leaves.length;i++) line(cx, sillY - 24, cx + leaves[i][0], sillY + leaves[i][1] + 26, PLANT, 4);
  for (i=0;i<leaves.length;i++) ell(cx + leaves[i][0], sillY + leaves[i][1] + 22, 10, 6, PLANT, null);
}

/* ---------- the figure ---------- */
function drawFigure(){
  // turtleneck body
  fillStroke(BODY_PTS, NAVY, NAVY, 3);
  ctx.save(); ctx.globalAlpha = 0.16; ctx.strokeStyle = PAPER; ctx.lineWidth = 2;
  for (var i=0;i<5;i++) line(286 + i*38, 486, 274 + i*44, 694, PAPER, 2);
  ctx.restore();
  // collar
  fillStroke(COLLAR_PTS, NAVY, PAPER, 2.5);
  // resting arm (left, down to the table)
  line(258, 516, 296, 676, NAVY, 30);
  ell(300, 688, 17, 13, SKIN, NAVY, 2.5);
  // ears + face
  ell(266, 330, 15, 20, SKIN, NAVY, 2.5);
  ell(454, 330, 15, 20, SKIN, NAVY, 2.5);
  ell(360, 322, 94, 102, SKIN, NAVY, 3.2);
  // spiky light hair
  fillStroke(hairPts, SUN, NAVY, 3.2);
  // squeezed-shut crying eyes: downward arcs
  ctx.strokeStyle = NAVY; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(322, 330, 19, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  ctx.beginPath(); ctx.arc(398, 330, 19, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  // sad brows, raised toward the middle
  line(300, 300, 336, 288, NAVY, 4.5);
  line(420, 300, 384, 288, NAVY, 4.5);
  // nose + trembling mouth
  line(362, 352, 354, 376, NAVY, 3.2);
  ctx.beginPath();
  ctx.moveTo(336, 404);
  ctx.quadraticCurveTo(348, 396, 360, 404);
  ctx.quadraticCurveTo(372, 412, 384, 404);
  ctx.strokeStyle = NAVY; ctx.lineWidth = 3.6; ctx.stroke();
  // tear streaks on the cheeks (flat wavy bands)
  ctx.save(); ctx.globalAlpha = 0.75; ctx.strokeStyle = TEAR; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(318, 356); ctx.quadraticCurveTo(310, 396, 318, 438); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(402, 356); ctx.quadraticCurveTo(410, 396, 402, 438); ctx.stroke();
  ctx.restore();
  // falling tears: eye -> cheek -> onto the shirt
  drawStream([318, 352], [306, 402], [322, 486], 1, 0.0, 10);
  drawStream([402, 352], [414, 402], [398, 486], 1, 0.47, 10);
  // splashes where tears land on the turtleneck
  var sp = (timeSec * 0.9) % 1;
  ctx.save(); ctx.globalAlpha = 0.35 + 0.4 * Math.sin(sp * Math.PI);
  tearDrop(322, 512, 6.5, TEAR); tearDrop(398, 528, 5.5, WHITE); tearDrop(360, 548, 5, TEAR);
  ctx.restore();
}

/* ---------- table + sketchbook + phone + jar ---------- */
var BOOK = { x: 238, y: 688, w: 524, h: 202 };
function drawTable(){
  // table surface (perspective trapezoid)
  fillStroke(TABLE_PTS, TABLE, NAVY, 3.5);
  // red stripes radiating from under the sketchbook
  ctx.save();
  pathOf([[66,664],[934,664],[982,906],[18,906]], true); ctx.clip();
  ctx.strokeStyle = RED; ctx.lineCap = 'round';
  var vx = 500, vy = 928, angles = [-1.35,-1.05,-0.75,-0.45,-0.15,0.15,0.45,0.75,1.05,1.35], i;
  for (i=0;i<angles.length;i++){
    ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(vx, vy);
    ctx.lineTo(vx + Math.sin(angles[i]) * 620, vy - Math.cos(angles[i]) * 300); ctx.stroke();
  }
  ctx.restore();
  pathOf(TABLE_PTS, true);
  ctx.strokeStyle = NAVY; ctx.lineWidth = 3.5; ctx.stroke();
}
function drawSketchbook(){
  // pages
  fillStroke(PAGE_L, PAPER, NAVY, 3.2);
  fillStroke(PAGE_R, PAPER, NAVY, 3.2);
  line(500, 692, 500, 866, NAVY, 3.5);
  // left page: red heart
  ctx.save(); ctx.translate(374, 776); ctx.fillStyle = RED;
  pathOf(heartPts, true); ctx.fill();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
  // right page: two green crying eyes
  drawPageEye(590, 764); drawPageEye(672, 764);
  // page tears: heart vs eyes, intensity swaps with cryMix
  var heartI = 1 - cryMix, eyesI = cryMix;
  drawStream([374, 812], [368, 838], [376, 872], heartI, 0.2, 7.5);
  drawStream([590, 786], [586, 812], [592, 848], eyesI, 0.55, 6.5);
  drawStream([672, 786], [676, 812], [670, 848], eyesI, 0.8, 6.5);
}
function drawPageEye(cx, cy){
  ctx.beginPath(); ctx.ellipse(cx, cy, 27, 15, 0, 0, Math.PI * 2);
  ctx.fillStyle = WHITE; ctx.fill();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 3; ctx.stroke();
  ell(cx, cy, 10.5, 10.5, GREEN, NAVY, 2.2);
  ell(cx, cy, 4, 4, NAVY, null);
}
function drawPhoneAndJar(){
  // arm out to the phone (sleeve + hand)
  line(452, 540, 566, 636, NAVY, 28);
  ell(572, 644, 16, 12, SKIN, NAVY, 2.5);
  // smartphone
  ctx.save(); ctx.translate(592, 640); ctx.rotate(-0.18);
  ctx.fillStyle = NAVY;
  rrectPath(-17, -34, 34, 68, 7); ctx.fill();
  ctx.fillStyle = TEAR; ctx.fillRect(-12, -26, 24, 44);
  line(-12, -8, 12, -8, NAVY, 2.4); line(-12, 4, 8, 4, NAVY, 2.4);
  ctx.restore();
  // jar with paintbrush
  ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = TEAR;
  rrectPath(806, 716, 66, 78, 8); ctx.fill(); ctx.restore();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 3;
  rrectPath(806, 716, 66, 78, 8); ctx.stroke();
  line(806, 740, 872, 740, NAVY, 2.4);
  // brush: handle + bristles
  line(842, 722, 866, 660, RED, 8);
  fillStroke([[858,664],[874,662],[870,634],[862,638]], NAVY, NAVY, 2);
}

/* ---------- caption + hint ---------- */
function drawCaption(){
  ctx.save();
  ctx.fillStyle = NAVY; ctx.font = handFont(45, 600); ctx.textBaseline = 'alphabetic';
  var widths = [], total = 0, i, ch;
  for (i=0;i<CAPTION.length;i++){ var w = ctx.measureText(CAPTION[i]).width; widths.push(w); total += w; }
  var x = 500 - total/2;
  for (i=0;i<CAPTION.length;i++){
    ch = CAPTION[i];
    ctx.save(); ctx.translate(x + capJit[i].dx, 962 + capJit[i].dy); ctx.rotate(capJit[i].rot);
    ctx.textAlign = 'left'; ctx.fillText(ch, 0, 0); ctx.restore();
    x += widths[i];
  }
  ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = NAVY;
  ctx.font = handFont(21, 600); ctx.textAlign = 'right';
  ctx.fillText('tap · drag', 972, 972);
  ctx.restore();
}

/* ---------- layout / draw ---------- */
var viewW = 300, viewH = 300, dpr = 1;
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : { width: 300, height: 300 };
var isPhone = Math.min(scr.width, scr.height) < 700;
if (!isPhone && viewH > viewW * 1.15 && Math.min(viewW, viewH) < 700) isPhone = true;

function stageTransform(){
  var s = Math.min(viewW, viewH) / 1000;
  return { s: s, ox: (viewW - 1000 * s) / 2, oy: (viewH - 1000 * s) / 2 };
}

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var tr = stageTransform();
  ctx.setTransform(dpr * tr.s, 0, 0, dpr * tr.s, dpr * tr.ox, dpr * tr.oy);
  // paper speckle texture
  for (var i=0;i<speckles.length;i++){
    var sp = speckles[i];
    ctx.globalAlpha = sp.a; ctx.fillStyle = sp.warm ? TABLE : NAVY;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawWindow();
  drawFigure();
  drawTable();
  drawSketchbook();
  drawPhoneAndJar();
  drawCaption();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : (window.innerWidth || 300);
  viewH = vv ? vv.height : (window.innerHeight || 300);
  dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

/* ---------- interaction ---------- */
var pdown = null;
function toStage(e){
  var tr = stageTransform();
  return [ (e.clientX - tr.ox) / tr.s, (e.clientY - tr.oy) / tr.s ];
}
function inRect(p, r){ return p[0] >= r.x && p[0] <= r.x + r.w && p[1] >= r.y && p[1] <= r.y + r.h; }
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e);
  pdown = { x: p[0], y: p[1], moved: false, inWin: inRect(p, WIN), light0: lightTarget };
});
canvas.addEventListener('pointermove', function(e){
  if (!pdown) return;
  var p = toStage(e);
  if (Math.abs(p[0] - pdown.x) + Math.abs(p[1] - pdown.y) > 9) pdown.moved = true;
  if (pdown.inWin && pdown.moved){
    lightTarget = Math.max(0, Math.min(1, pdown.light0 + (p[1] - pdown.y) / 260));
  }
});
function endPointer(e){
  if (!pdown) return;
  var p = toStage(e);
  if (!pdown.moved && inRect(p, BOOK)) cryMode = 1 - cryMode;
  pdown = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ pdown = null; });

/* ---------- loop (anchored: PHASE0 + elapsed; frame one is PHASE0) ---------- */
var startTs = null, lastTs = null;
function tick(ts){
  if (startTs === null){ startTs = ts; lastTs = ts; }
  var dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000)); lastTs = ts;
  timeSec = PHASE0 + (ts - startTs) / 1000;
  cryMix += ((cryMode ? 1 : 0) - cryMix) * Math.min(1, dt * 5);
  lightT += (lightTarget - lightT) * Math.min(1, dt * 7);
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
}
resize();   // draws frame one synchronously at PHASE0
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
</script>
</body>
</html>
