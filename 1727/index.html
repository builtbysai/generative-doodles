<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea Glass Grid</title>
<style>
html, body { margin: 0; padding: 0; background: #202624; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#202624';
var PLATE = '#333D39';
var PLATE_LINE = 'rgba(111,195,165,0.55)';
var TITLE_INK = '#E8F0EC';
var HINT_INK = '#E8C887';
var PERIOD = 20;
var FRAME_T = 10.0;
var COLS = 3, ROWS = 4, COUNT = 12;
var GREENS = ['#3E8F74', '#57B08F', '#6FC3A5'];
var BLUES = ['#7FA8BC', '#93BCCD', '#A8CBD8'];
var AMBERS = ['#C9A25E', '#D9B36C', '#E8C887'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mixWhite(h, f) {
  var c = hexRgb(h);
  var r = Math.round(c[0] + (255 - c[0]) * f);
  var g = Math.round(c[1] + (255 - c[1]) * f);
  var b = Math.round(c[2] + (255 - c[2]) * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1727);
var phaseT = FRAME_T;
/* ---- seeded pieces: 12 distinct, 3x4 grid, no two alike ---- */
var PIECES = [];
(function () {
  var i, j, k, fam, famPick;
  for (i = 0; i < COUNT; i++) {
    famPick = rng();
    fam = famPick < 0.45 ? GREENS : (famPick < 0.8 ? BLUES : AMBERS);
    var col = i % COLS, row = Math.floor(i / COLS);
    var piece = {
      col: col, row: row,
      jx: (rng() - 0.5) * 0.10,
      jy: (rng() - 0.5) * 0.10,
      size: 0.30 + rng() * 0.14,
      rot: (rng() - 0.5) * 0.9,
      blobs: [],
      facets: []
    };
    var nBlobs = 3 + Math.floor(rng() * 3);
    for (j = 0; j < nBlobs; j++) {
      var blobFam = rng() < 0.75 ? fam : (rng() < 0.5 ? GREENS : (rng() < 0.5 ? BLUES : AMBERS));
      var pts = [];
      var nPts = 6 + Math.floor(rng() * 3);
      for (k = 0; k < nPts; k++) {
        var ang = (k / nPts) * TAU + (rng() - 0.5) * 0.35;
        var rad = 0.55 + rng() * 0.55;
        pts.push([Math.cos(ang) * rad, Math.sin(ang) * rad]);
      }
      piece.blobs.push({
        color: blobFam[Math.floor(rng() * blobFam.length)],
        alpha: 0.26 + rng() * 0.20,
        ox: (rng() - 0.5) * 0.55,
        oy: (rng() - 0.5) * 0.55,
        r: 0.45 + rng() * 0.32,
        pts: pts
      });
    }
    var nFacets = 1 + Math.floor(rng() * 2);
    for (j = 0; j < nFacets; j++) {
      piece.facets.push({
        ox: (rng() - 0.5) * 0.5,
        oy: (rng() - 0.5) * 0.5,
        side: 0.30 + rng() * 0.30,
        rot: (rng() - 0.5) * 1.2,
        alpha: 0.16 + rng() * 0.14,
        warm: rng() < 0.5
      });
    }
    PIECES.push(piece);
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: centered square grid on both desktop and phone ---- */
function stageRect() {
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function sweepPos(t) {
  /* front travels from -0.30 to 1.30 over 20 s; off-grid at both ends, so the wrap is invisible */
  var u = (t % PERIOD) / PERIOD;
  return -0.30 + 1.60 * u;
}
function glowAt(u, front) {
  var d = (u - front) / 0.13;
  return Math.exp(-d * d);
}
function drawBlobPath(cx, cy, r, pts) {
  var n = pts.length, i;
  var mx = cx + (pts[n - 1][0] + pts[0][0]) / 2 * r;
  var my = cy + (pts[n - 1][1] + pts[0][1]) / 2 * r;
  ctx.beginPath();
  ctx.moveTo(mx, my);
  for (i = 0; i < n; i++) {
    var p = pts[i];
    var q = pts[(i + 1) % n];
    var px = cx + p[0] * r, py = cy + p[1] * r;
    var qx = cx + (p[0] + q[0]) / 2 * r, qy = cy + (p[1] + q[1]) / 2 * r;
    ctx.quadraticCurveTo(px, py, qx, qy);
  }
  ctx.closePath();
}
function drawPiece(piece, cellW, cellH, gx, gy, front) {
  var cx = gx + (piece.col + 0.5 + piece.jx) * cellW;
  var cy = gy + (piece.row + 0.5 + piece.jy) * cellH;
  var s = Math.min(cellW, cellH) * piece.size;
  /* diagonal coordinate of the piece center, 0 at top-left, 1 at bottom-right */
  var u = ((piece.col + 0.5) / COLS + (piece.row + 0.5) / ROWS) / 2;
  var glow = glowAt(u, front);
  var b, f, i;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(piece.rot);
  ctx.translate(-cx, -cy);
  for (i = 0; i < piece.blobs.length; i++) {
    b = piece.blobs[i];
    drawBlobPath(cx + b.ox * s, cy + b.oy * s, b.r * s, b.pts);
    ctx.fillStyle = rgba(b.color, b.alpha);
    ctx.fill();
  }
  for (i = 0; i < piece.facets.length; i++) {
    f = piece.facets[i];
    var half = f.side * s / 2;
    var fx = cx + f.ox * s, fy = cy + f.oy * s;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(f.rot);
    ctx.beginPath();
    ctx.moveTo(-half, -half);
    ctx.lineTo(half, -half);
    ctx.lineTo(half, half);
    ctx.lineTo(-half, half);
    ctx.closePath();
    ctx.fillStyle = f.warm ? rgba('#E8C887', f.alpha) : rgba('#DCEEF2', f.alpha);
    ctx.fill();
    ctx.strokeStyle = rgba('#FFFFFF', f.alpha * 0.9);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  /* sweep brightening: same blobs redrawn lighter, scaled by the glow */
  if (glow > 0.02) {
    for (i = 0; i < piece.blobs.length; i++) {
      b = piece.blobs[i];
      drawBlobPath(cx + b.ox * s, cy + b.oy * s, b.r * s, b.pts);
      ctx.fillStyle = mixWhite(b.color, 0.45 * glow);
      ctx.globalAlpha = (b.alpha + 0.22 * glow) * glow;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}
function drawSweepBand(gx, gy, gw, gh, front) {
  /* diagonal stripe across the grid at the front position, clipped to the grid */
  var diag = Math.hypot(gw, gh) / 2;
  var w = gw * 0.055;
  var fx = gx + front * gw, fy = gy + front * gh;
  ctx.save();
  ctx.beginPath();
  ctx.rect(gx, gy, gw, gh);
  ctx.clip();
  ctx.translate(fx, fy);
  ctx.rotate(-Math.PI / 4);
  ctx.fillStyle = 'rgba(255,250,235,0.05)';
  ctx.fillRect(-w, -diag, w * 2, diag * 2);
  ctx.fillStyle = 'rgba(255,250,235,0.09)';
  ctx.fillRect(-w * 0.35, -diag, w * 0.7, diag * 2);
  ctx.restore();
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var margin = st.w * 0.13;
  var gx = st.x + margin, gy = st.y + margin;
  var gw = st.w - margin * 2, gh = st.h - margin * 2;
  var cellW = gw / COLS, cellH = gh / ROWS;
  var front = sweepPos(phaseT);
  var i;
  for (i = 0; i < COUNT; i++) drawPiece(PIECES[i], cellW, cellH, gx, gy, front);
  drawSweepBand(gx, gy, gw, gh, front);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Sea Glass Grid').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Sea Glass Grid').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 04').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Sea Glass Grid', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 04', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the light sweep the grid.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    pieceCount: function () { return COUNT; },
    sweepPos: function () { return sweepPos(phaseT); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 10.0 s of a 20 s cycle, sweep front mid-grid ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
