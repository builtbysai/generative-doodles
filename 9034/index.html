<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9034 · Silk Study</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0908; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// №9034 · Silk Study (from seed 339, after lammetje_nl's dark red
// luminous flow piece). Long-exposure dotted trails follow a smooth
// curl-noise flow on near-black. Dots, not lines: the flow reads as
// textile grain. Dot color maps to curvature: white-hot where the
// flow bends hardest, deep red on the straights.
"use strict";

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seedMatch = /[?&]seed=(-?\d+)/.exec(location.search);
let SEED = seedMatch ? (parseInt(seedMatch[1], 10) >>> 0) : 9034;
let rng = mulberry32(SEED);

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
// accumulation layer: trails live here and fade very slowly
const acc = document.createElement("canvas");
const actx = acc.getContext("2d");
let W = 0, H = 0, DPR = 1;

// ---------- value noise (seeded) ----------
let perm = new Uint8Array(512);
function buildPerm() {
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = (rng() * (i + 1)) | 0;
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
}
function hash2(ix, iy) { return perm[(perm[ix & 255] + iy) & 255] / 255; }
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y) {
  return vnoise(x, y) * 0.55 + vnoise(x * 2.13 + 7.7, y * 2.13 + 3.1) * 0.28 +
         vnoise(x * 4.41 + 13.7, y * 4.41 + 9.2) * 0.17;
}
// curl of the noise field: divergence-free flow
function flow(x, y, out) {
  const s = 0.0016, e = 0.35;
  const nx = x * s, ny = y * s;
  const dy = (fbm(nx, ny + e * s) - fbm(nx, ny - e * s));
  const dx = (fbm(nx + e * s, ny) - fbm(nx - e * s, ny));
  const m = Math.hypot(dx, dy) || 1;
  out[0] = dy / m; out[1] = -dx / m;
}

// ---------- particles ----------
let parts = [];
const FV = [0, 0];
function spawn(anywhere) {
  // bias spawn toward edges so threads enter the frame
  const edge = rng();
  let x, y;
  if (!anywhere || edge < 0.7) {
    const side = (rng() * 4) | 0;
    if (side === 0) { x = rng() * W; y = -10; }
    else if (side === 1) { x = W + 10; y = rng() * H; }
    else if (side === 2) { x = rng() * W; y = H + 10; }
    else { x = -10; y = rng() * H; }
  } else { x = rng() * W; y = rng() * H; }
  return { x, y, px: x, py: y, life: 300 + rng() * 700, age: 0, curv: 0, tick: (rng() * 3) | 0 };
}
function initParts() {
  const n = Math.max(600, Math.min(1100, Math.floor((W * H) / 1100)));
  parts = [];
  for (let i = 0; i < n; i++) parts.push(spawn(true));
}

// curvature -> color: deep red straights, white-hot bends
function dotColor(c) {
  const t = Math.min(1, c * 9);
  // deep red (122,31,31) -> ember (230,90,60) -> near-white (255,244,230)
  let r, g, b;
  if (t < 0.5) {
    const k = t / 0.5;
    r = 122 + (230 - 122) * k; g = 31 + (90 - 31) * k; b = 31 + (60 - 31) * k;
  } else {
    const k = (t - 0.5) / 0.5;
    r = 230 + (255 - 230) * k; g = 90 + (244 - 90) * k; b = 60 + (230 - 60) * k;
  }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function step() {
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.px = p.x; p.py = p.y;
    flow(p.x, p.y, FV);
    const sp = 2.0;
    p.x += FV[0] * sp; p.y += FV[1] * sp;
    p.age++;
    // curvature from heading change
    const h1 = Math.atan2(p.y - p.py, p.x - p.px);
    const h0 = p.h === undefined ? h1 : p.h;
    let dh = h1 - h0;
    while (dh > Math.PI) dh -= Math.PI * 2;
    while (dh < -Math.PI) dh += Math.PI * 2;
    p.h = h1;
    p.curv = p.curv * 0.92 + Math.abs(dh) * 0.08;
    // draw a dot every other step: dotted trail, not a line
    if ((p.tick = (p.tick + 1) % 2) === 0) {
      actx.fillStyle = dotColor(p.curv);
      actx.beginPath();
      actx.arc(p.x, p.y, 1.3 + Math.min(1.6, p.curv * 16), 0, Math.PI * 2);
      actx.fill();
    }
    if (p.age > p.life || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
      parts[i] = spawn(false);
    }
  }
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.floor(window.innerWidth); H = Math.floor(window.innerHeight);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  acc.width = W * DPR; acc.height = H * DPR;
  actx.setTransform(DPR, 0, 0, DPR, 0, 0);
  actx.fillStyle = "#0a0908";
  actx.fillRect(0, 0, W, H);
  initParts();
}
window.addEventListener("resize", resize);

function newFlow() {
  SEED = (Math.random() * 1e9) | 0;
  rng = mulberry32(SEED);
  buildPerm();
  actx.fillStyle = "#0a0908";
  actx.fillRect(0, 0, W, H);
  initParts();
  try {
    history.replaceState(null, "", "?seed=" + SEED);
  } catch (e) { /* file:// */ }
}
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); newFlow(); });

buildPerm();
resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const n = dt > 0.025 ? 2 : 1;
  // long exposure: fade the accumulation layer very slowly
  actx.fillStyle = "rgba(10,9,8,0.008)";
  actx.fillRect(0, 0, W, H);
  for (let i = 0; i < n; i++) step();
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(acc, 0, 0, W, H);
  ctx.fillStyle = "rgba(235,228,220,0.6)";
  ctx.font = "13px Georgia, serif";
  ctx.fillText("№9034 · Silk Study", 18, H - 18);
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(235,228,220,0.38)";
  ctx.font = "italic 13px Georgia, serif";
  ctx.fillText("click for a new flow", W - 18, H - 18);
  ctx.textAlign = "left";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
