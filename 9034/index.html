<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9034 · Sides II</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#060608; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function smooth(u){ return u*u*(3 - 2*u); }

// Sides: a dot becomes a line, a triangle, a square,
// keeps gaining sides until it is a circle,
// then the circle shrinks back to a dot. Repeat.

const CYCLE = 26;        // seconds per loop
const ROT = 0.12;        // slow rotation, radians per second
const M = 360;           // boundary samples
const N_MAX = 64;        // side count at the circle stage

// polar radius of a regular integer n-gon, circumradius R, vertex at angle 0
// (n=2 is treated as an ultra-thin eye: visually a line, but 2PI-periodic)
function polyR(theta, n, R){
  const nn = Math.max(n, 2.001);
  const seg = Math.PI * 2 / nn;
  const m = (((theta % seg) + seg) % seg) - Math.PI / nn;
  return R * Math.cos(Math.PI / nn) / Math.cos(m);
}
// seam-free continuous sides: blend integer neighbours so r stays 2PI-periodic
function radiusAt(theta, n, R){
  const k = Math.floor(n), f = n - k;
  if (f < 0.001) return polyR(theta, k, R);
  if (f > 0.999) return polyR(theta, k + 1, R);
  const e = f * f * (3 - 2 * f);
  return polyR(theta, k, R) * (1 - e) + polyR(theta, k + 1, R) * e;
}

function draw(){
  const [w, h] = viewportWH(); prep(w, h);
  ctx.fillStyle = '#060608'; ctx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const maxR = Math.min(w, h) * 0.32;
  const rot = clock * ROT;

  const phase = (clock / CYCLE) % 1;
  let R = maxR, n = 2, mode = 'poly';

  if (phase < 0.08){
    // dot -> line: the segment grows
    R = maxR * smooth(phase / 0.08);
    n = 2.001; mode = 'poly';
  } else if (phase < 0.70){
    // line -> triangle -> square -> ... -> circle
    const p = (phase - 0.08) / 0.62;
    if (p < 0.7){ n = 2.001 + (12 - 2.001) * Math.pow(p / 0.7, 3); }
    else { n = 12 + (N_MAX - 12) * smooth((p - 0.7) / 0.3); }
    R = maxR; mode = 'poly';
  } else if (phase < 0.78){
    // circle holds
    n = N_MAX; R = maxR; mode = 'poly';
  } else if (phase < 0.93){
    // circle -> dot
    n = N_MAX; R = maxR * (1 - smooth((phase - 0.78) / 0.15)); mode = 'poly';
  } else {
    // dot rests
    R = 0; mode = 'dot';
  }

  const bright = 232;
  ctx.strokeStyle = 'rgba(' + bright + ',' + (bright-2) + ',' + (bright-8) + ',1)';
  ctx.fillStyle = 'rgba(' + bright + ',' + (bright-2) + ',' + (bright-8) + ',1)';
  ctx.lineWidth = 1.5;

  if (mode === 'dot' || R < 1.5){
    ctx.beginPath(); ctx.arc(cx, cy, 1.8, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath();
    for (let i = 0; i <= M; i++){
      const th = (i / M) * Math.PI * 2;
      const r = radiusAt(th, n, R);
      const x = cx + r * Math.cos(th + rot);
      const y = cy + r * Math.sin(th + rot);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
  }
}

let clock = 0, lastT = -1;
function loop(nowMs){
  const t = nowMs / 1000;
  if (lastT < 0) lastT = t;
  clock += Math.min(t - lastT, 0.1); lastT = t;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('resize', () => draw());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => draw());
</script>
</body>
</html>
