<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.318 Three Architectures</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#171412; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.318 Three Architectures (Coral Cockatoo).
// Three Australian flower architectures side by side on a dark
// ground, each a distinct generative grammar: a banksia cone of
// spikelets placed by phyllotaxis on a cone, a bottlebrush of
// filaments radiating from a central rachis, and wattle pom-pom
// clusters tipped on a recursive branch. Flat screen-print fills,
// one canvas only, no offscreen canvases, no text anywhere.
// Idle is a 26s seamless loop: filaments sway, poms tremble and
// spikelets shimmer in a traveling wave, so frame 26s matches
// frame 0. Tapping a panel advances only that panel to its next
// authored variant (4 per panel) with a grow-in; the other two
// panels keep their phase untouched. Frame one is fully grown.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#171412';
var BANK_GOLD = '#C9A227', LEAF = '#7A8B6F';
var VERM = '#C73E1D';
var WATTLE_GOLD = '#D9A441', STEM = '#6B4A35';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 0, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var LOOP = 26;

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash1(n) {
  var a = (Math.floor(n) * 2654435761) >>> 0;
  a ^= a >>> 15; a = Math.imul(a, 2246822519); a ^= a >>> 13;
  return (a >>> 0) / 4294967296;
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function easeOut(p) { return 1 - Math.pow(1 - p, 3); }

// ---- panels: exactly 3 vertical panels, thin ground gutters ----
var PANELS = [
  { x: 36, y: 50, w: 392, h: 800, cx: 232 },
  { x: 444, y: 50, w: 392, h: 800, cx: 640 },
  { x: 852, y: 50, w: 392, h: 800, cx: 1048 }
];
if (PANELS.length !== 3) throw new Error('Three Architectures needs exactly 3 panels');
var PHASE_OFF = [0, 8.667, 17.333];

// ---- authored variant tables: exactly 4 variants per panel -----
var BANK_VAR = [
  { div: 2.39996, count: 260, coneW: 208, coneH: 556, spike: 22, seed: 31811 },
  { div: 2.21, count: 208, coneW: 176, coneH: 596, spike: 25, seed: 31812 },
  { div: 2.64, count: 318, coneW: 238, coneH: 516, spike: 19, seed: 31813 },
  { div: 2.39996, count: 232, coneW: 192, coneH: 578, spike: 24, seed: 31814 }
];
var BOTTLE_VAR = [
  { count: 122, len: 116, brushH: 402, seed: 31821 },
  { count: 92, len: 140, brushH: 344, seed: 31822 },
  { count: 152, len: 100, brushH: 444, seed: 31823 },
  { count: 108, len: 128, brushH: 380, seed: 31824 }
];
var WATTLE_VAR = [
  { spread: 0.42, len: 104, pomR: 16, seed: 31831 },
  { spread: 0.36, len: 92, pomR: 20, seed: 31832 },
  { spread: 0.50, len: 112, pomR: 13, seed: 31833 },
  { spread: 0.40, len: 98, pomR: 18, seed: 31834 }
];
if (BANK_VAR.length !== 4 || BOTTLE_VAR.length !== 4 || WATTLE_VAR.length !== 4) {
  throw new Error('Three Architectures needs exactly 4 variants per panel');
}
var curVar = [0, 0, 0];
var growT0 = [-100, -100, -100];
function growOf(pi) {
  var p = clamp01((T - growT0[pi]) / 1.6);
  return easeOut(p);
}

// ---- banksia: phyllotaxis spikelets on a cone -------------------
function drawBanksia(pi) {
  var v = BANK_VAR[curVar[pi]];
  var cx = PANELS[pi].cx;
  var baseY = 768, topY = baseY - v.coneH;
  var grow = growOf(pi);
  var phase = (T + PHASE_OFF[pi]) / LOOP * Math.PI * 2;
  var r = rng(v.seed);
  var pts = [], i, t, ang, rad, depth;
  for (i = 0; i < v.count; i++) {
    t = v.count === 1 ? 0 : i / (v.count - 1);
    ang = i * v.div;
    rad = (0.16 + 0.84 * t) * v.coneW / 2;
    depth = Math.sin(ang);
    pts.push({
      t: t,
      x: cx + Math.cos(ang) * rad,
      y: topY + t * v.coneH,
      depth: depth,
      side: Math.cos(ang),
      jit: r()
    });
  }
  pts.sort(function (a, b) { return a.depth - b.depth; });
  ctx.save();
  // Cone silhouette, flat gold wash under the spikelets.
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = BANK_GOLD;
  ctx.beginPath();
  ctx.moveTo(cx - v.coneW * 0.14, topY);
  ctx.lineTo(cx + v.coneW * 0.14, topY);
  ctx.lineTo(cx + v.coneW / 2, baseY);
  ctx.lineTo(cx - v.coneW / 2, baseY);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  // Leaves at the base, leaf green.
  ctx.fillStyle = LEAF;
  var leafLen = 120 * grow, leafWid = 30;
  var leafDirs = [-1, 1], li, sgn;
  for (li = 0; li < 2; li++) {
    sgn = leafDirs[li];
    ctx.save();
    ctx.translate(cx + sgn * 26, baseY + 6);
    ctx.rotate(sgn * 0.55);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(sgn * leafLen * 0.5, -leafWid, sgn * leafLen, 0);
    ctx.quadraticCurveTo(sgn * leafLen * 0.5, leafWid * 0.7, 0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  // Stem.
  st(LEAF, 7);
  ctx.beginPath(); ctx.moveTo(cx, baseY); ctx.lineTo(cx, 838); ctx.stroke();
  // Spikelets: small elongated diamonds, shimmering in a wave
  // that travels from tip to base, two full waves per loop.
  ctx.fillStyle = BANK_GOLD;
  for (i = 0; i < pts.length; i++) {
    var p = pts[i];
    if (p.t > grow * 1.04) continue;
    var shim = 0.5 + 0.5 * Math.sin(phase * 2 - p.t * Math.PI * 4 + p.jit * 0.7);
    var sc = (0.85 + 0.30 * p.depth) * (0.78 + 0.34 * shim);
    var len = v.spike * sc * (0.55 + 0.45 * grow);
    var wid = len * 0.42;
    var dx = p.side * len, dy = -len * 0.22;
    ctx.globalAlpha = 0.55 + 0.45 * (0.5 + 0.5 * p.depth) * (0.7 + 0.3 * shim);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - wid);
    ctx.lineTo(p.x + dx, p.y + dy);
    ctx.lineTo(p.x, p.y + wid);
    ctx.lineTo(p.x - dx * 0.35, p.y - dy * 0.4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---- bottlebrush: filaments from a central rachis ---------------
function drawBottlebrush(pi) {
  var v = BOTTLE_VAR[curVar[pi]];
  var cx = PANELS[pi].cx;
  var topY = 196, brushBot = topY + v.brushH;
  var grow = growOf(pi);
  var phase = (T + PHASE_OFF[pi]) / LOOP * Math.PI * 2;
  var r = rng(v.seed);
  var fils = [], i, t, a;
  for (i = 0; i < v.count; i++) {
    t = i / (v.count - 1);
    a = i * 2.39996 + r() * 0.5;
    fils.push({
      t: t,
      y: topY + t * v.brushH,
      cos: Math.cos(a),
      sin: Math.sin(a),
      lenJit: 0.72 + r() * 0.5,
      ph: r() * Math.PI * 2
    });
  }
  ctx.save();
  // Stem below the brush, then the rachis through it.
  st(VERM, 5);
  ctx.beginPath(); ctx.moveTo(cx, brushBot); ctx.lineTo(cx, Math.min(838, brushBot + 110)); ctx.stroke();
  st(VERM, 7);
  ctx.beginPath(); ctx.moveTo(cx, topY - 8); ctx.lineTo(cx, brushBot + 8); ctx.stroke();
  // Filaments: lines out from the rachis, tips swaying.
  for (i = 0; i < fils.length; i++) {
    var f = fils[i];
    var fg = clamp01(grow * 1.25 - f.t * 0.25);
    if (fg <= 0) continue;
    var swayX = Math.sin(phase * 2 + f.ph) * 7;
    var swayY = Math.cos(phase * 2 + f.ph * 1.3) * 3.2;
    var len = v.len * f.lenJit * fg * (0.80 + 0.25 * Math.sin(Math.PI * f.t));
    var tx = cx + f.cos * len + swayX * (0.4 + 0.6 * Math.abs(f.cos));
    var ty = f.y + f.sin * len * 0.38 + swayY;
    st(VERM, 2.4);
    ctx.globalAlpha = 0.88;
    ctx.beginPath(); ctx.moveTo(cx, f.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = VERM;
    circ(tx, ty, 3.1 * fg + 0.6, true);
  }
  ctx.restore();
}

// ---- wattle: recursive branch tipped with pom clusters ----------
var pomCounter = 0;
function drawPom(x, y, pomR, seedMix, phase) {
  var dx = Math.sin(phase * 2 + seedMix * 12.9) * 2.0;
  var dy = Math.cos(phase * 3 + seedMix * 7.7) * 1.4;
  var cxp = x + dx, cyp = y + dy;
  ctx.fillStyle = WATTLE_GOLD;
  circ(cxp, cyp, pomR * 0.44, true);
  var k, a, d;
  for (k = 0; k < 8; k++) {
    a = k / 8 * Math.PI * 2 + seedMix * 2.1;
    d = pomR * 0.62;
    circ(cxp + Math.cos(a) * d, cyp + Math.sin(a) * d, pomR * 0.40, true);
  }
  for (k = 0; k < 5; k++) {
    a = k / 5 * Math.PI * 2 + seedMix * 4.3 + 0.5;
    d = pomR * 1.05;
    circ(cxp + Math.cos(a) * d, cyp + Math.sin(a) * d, pomR * 0.30, true);
  }
}
function drawBranch(x, y, ang, len, wid, depth, v, grow, phase, seedMix) {
  var ex = x + Math.cos(ang) * len * grow;
  var ey = y + Math.sin(ang) * len * grow;
  st(STEM, wid);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
  if (depth === 0) {
    if (grow > 0.45) drawPom(ex, ey, v.pomR * clamp01((grow - 0.45) / 0.55 + 0.25), seedMix, phase);
    return;
  }
  var j1 = (hash1(seedMix * 91.7) - 0.5) * 0.22;
  var j2 = (hash1(seedMix * 57.3 + 4) - 0.5) * 0.22;
  drawBranch(ex, ey, ang - v.spread + j1, len * 0.68, Math.max(1.6, wid * 0.62), depth - 1, v, grow, phase, seedMix * 2 + 1);
  drawBranch(ex, ey, ang + v.spread + j2, len * 0.68, Math.max(1.6, wid * 0.62), depth - 1, v, grow, phase, seedMix * 2 + 2);
  if (depth === 2) {
    drawBranch(ex, ey, ang + (hash1(seedMix * 31.1 + 9) - 0.5) * 0.3, len * 0.55, Math.max(1.6, wid * 0.55), depth - 1, v, grow, phase, seedMix * 2 + 3);
  }
}
function drawWattle(pi) {
  var v = WATTLE_VAR[curVar[pi]];
  var cx = PANELS[pi].cx;
  var grow = growOf(pi);
  var phase = (T + PHASE_OFF[pi]) / LOOP * Math.PI * 2;
  ctx.save();
  pomCounter = 0;
  // Trunk from the ground line up, then two levels of branching.
  st(STEM, 8);
  ctx.beginPath(); ctx.moveTo(cx, 842); ctx.lineTo(cx, 842 - 190 * grow); ctx.stroke();
  if (grow > 0.05) {
    drawBranch(cx, 652, -Math.PI / 2 - v.spread * 0.7, v.len, 5.5, 2, v, grow, phase, v.seed * 0.01 + 1);
    drawBranch(cx, 652, -Math.PI / 2 + v.spread * 0.7, v.len, 5.5, 2, v, grow, phase, v.seed * 0.01 + 2);
    drawBranch(cx, 690, -Math.PI / 2, v.len * 0.82, 5, 2, v, grow, phase, v.seed * 0.01 + 3);
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  drawBanksia(0);
  drawBottlebrush(1);
  drawWattle(2);
}

// ---- interaction: tap a panel to regrow only that panel ---------
var tapStart = null;
function panelAt(p) {
  var i;
  for (i = 0; i < PANELS.length; i++) {
    if (p[0] >= PANELS[i].x && p[0] <= PANELS[i].x + PANELS[i].w &&
        p[1] >= PANELS[i].y && p[1] <= PANELS[i].y + PANELS[i].h) return i;
  }
  return -1;
}
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  tapStart = { x: p[0], y: p[1] };
});
canvas.addEventListener('pointerup', function (e) {
  if (!tapStart) return;
  var p = toDesign(e);
  var moved = Math.max(Math.abs(p[0] - tapStart.x), Math.abs(p[1] - tapStart.y));
  tapStart = null;
  if (moved >= 9) return;
  var pi = panelAt(p);
  if (pi < 0) return;
  curVar[pi] = (curVar[pi] + 1) % 4;
  growT0[pi] = T;
});
canvas.addEventListener('pointercancel', function () { tapStart = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
