<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.245 Stoically Itself</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F6F6F4; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.245 Stoically Itself (Avantika Bawa). After #FFFFFF at
// Ditch Projects: a white scaffold, five bays wide, standing in
// a white gallery room, drawn so pale it nearly dissolves into
// the walls. The subject is its shadows: long interlacing webs
// thrown across the floor and the back wall by a single stage
// light orbiting on a thirty second loop. The scaffold never
// moves; as the shadows lengthen, the structure fades a touch
// more, its weight dissolving while the shadows grow present.
// Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var ROOM = '#F6F6F4', SH1 = '#9A9A9A', SH2 = '#C9C9C9', CONTACT = '#1A1A1A';
var W = 0, H = 0, phone = false;
var T = 0, lastNow = -1; // light phase is baked in, off to the left at frame one

var COLS = 5, BAYW = 144, X0 = 190;
var LEVY = [520, 400, 280, 160];
var FLOOR = 520;

// Nodes and edges of the scaffold, built once.
var NODES = [], EDGES = [];
(function () {
  var c, l;
  for (l = 0; l < LEVY.length; l++)
    for (c = 0; c <= COLS; c++)
      NODES.push({ x: X0 + c * BAYW, y: LEVY[l] });
  function idx(c2, l2) { return l2 * (COLS + 1) + c2; }
  for (c = 0; c <= COLS; c++)
    for (l = 0; l < 3; l++)
      EDGES.push([idx(c, l), idx(c, l + 1)]);
  for (l = 0; l < LEVY.length; l++)
    for (c = 0; c < COLS; c++)
      EDGES.push([idx(c, l), idx(c + 1, l)]);
  for (c = 0; c < COLS; c++)
    for (l = 0; l < 3; l++) {
      if ((c + l) % 2 === 0) EDGES.push([idx(c, l), idx(c + 1, l + 1)]);
      else EDGES.push([idx(c + 1, l), idx(c, l + 1)]);
    }
})();

function draw() {
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, W, H);
  var s = phone ? W / 1100 : Math.min(W / 1100, H / 850);
  ctx.save();
  ctx.translate((W - 1100 * s) / 2, (H - 850 * s) / 2);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.rect(0, 0, 1100, 850);
  ctx.clip();

  // the orbiting stage light, riding high above the scaffold
  // so its shadows fall down the wall and across the floor
  var th = 2.4 + 2 * Math.PI * T / 30;
  var L = { x: 550 + 400 * Math.cos(th), y: 78 + 30 * Math.sin(th) };

  // one light, two surfaces: the wall throw is a projection
  // from the light, clipped where the wall ends at the floor
  // seam; the floor cast leans away from wherever the light
  // actually is and lengthens the further it swings sideways,
  // so the webs interlace across the floor and stretch and
  // swing as the light orbits
  var away = (550 - L.x) / 400; // -1..1, sign = away from light
  var skew = 0.55 * away;
  var stretch = 0.25 + 0.50 * Math.abs(away);
  var wallP = [], floorP = [];
  for (var i = 0; i < NODES.length; i++) {
    var P = NODES[i];
    var dx = P.x - L.x, dy = P.y - L.y;
    wallP.push({ x: L.x + dx * 1.45, y: L.y + dy * 1.45 });
    var hgt = FLOOR - P.y;
    floorP.push({ x: P.x + skew * hgt, y: FLOOR + hgt * stretch });
  }
  var lenScore = (stretch / 0.75) * 0.6 + (Math.abs(skew) / 0.55) * 0.4;
  if (lenScore > 1) lenScore = 1;
  var structA = 0.90 - 0.28 * lenScore; // the dissolve trick

  // wall base seam
  ctx.strokeStyle = 'rgba(154,154,154,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, FLOOR);
  ctx.lineTo(1100, FLOOR);
  ctx.stroke();

  // shadow webs: wall first in the pale grey, then the floor
  // webs darker and thicker than anything structural
  ctx.lineCap = 'round';
  function web(pts, col, wdt, alpha) {
    ctx.strokeStyle = col;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = wdt;
    ctx.beginPath();
    for (var e = 0; e < EDGES.length; e++) {
      var a = pts[EDGES[e][0]], b2 = pts[EDGES[e][1]];
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b2.x, b2.y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, 1100, FLOOR);
  ctx.clip();
  web(wallP, SH2, 3, 0.7);
  ctx.restore();
  web(floorP, SH1, 4.5, 0.8);

  // contact shadows where the poles meet the floor
  ctx.fillStyle = 'rgba(26,26,26,0.5)';
  for (var c = 0; c <= COLS; c++) {
    ctx.save();
    ctx.translate(X0 + c * BAYW, FLOOR + 5);
    ctx.scale(1, 0.24);
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // the structure itself: a whisper of edge so it registers at
  // all, then white on white at the dissolving alpha. It is
  // never darker than its shadows.
  web(NODES, SH2, 5.5, 0.20);
  web(NODES, '#FFFFFF', 3.5, structA);
  ctx.fillStyle = 'rgba(255,255,255,' + structA.toFixed(3) + ')';
  for (var n = 0; n < NODES.length; n++) {
    ctx.beginPath();
    ctx.arc(NODES[n].x, NODES[n].y, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
