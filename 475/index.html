<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Capsule</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EFE3C8; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var GROUND = '#EFE3C8';
  var RED = '#D61F26';
  var GLASS = '#F7F4EC';
  var DRESS = '#D9A03F';
  var HAIR = '#3B2A24';
  var SKIN = '#EBC9A8';

  var PHASE = 0; // constant first frame: resting tilt, woman at her seeded start

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(475003);

  // ---- seeded constants: resting tilt and her starting place ----
  var REST = -0.10 - rng() * 0.08;              // gentle diagonal, left end high
  var herBase = 0.30 + rng() * 0.25;            // 0 = seam, 1 = far cap of white half

  // ---- seeded grain: precomputed dots, drawn identically every frame ----
  var grain = [];
  for (var i = 0; i < 1100; i++) {
    grain.push({
      x: rng(), y: rng(),
      r: 0.5 + rng() * 1.1,
      a: 0.025 + rng() * 0.05,
      light: rng() < 0.35
    });
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ---- capsule geometry ----
  function geom() {
    var len = Math.min(0.82 * W, 1.55 * H);
    var rad = len * 0.185;
    return { cx: W * 0.5, cy: H * 0.52, len: len, rad: rad };
  }

  function stadiumPath(g) {
    var hl = g.len / 2, r = g.rad;
    ctx.beginPath();
    ctx.arc(-(hl - r), 0, r, Math.PI / 2, Math.PI * 1.5);
    ctx.arc(hl - r, 0, r, -Math.PI / 2, Math.PI / 2);
    ctx.closePath();
  }

  // ---- the woman: seated, knees drawn up, eyes closed ----
  // Drawn in capsule-local coords. h = her full height; she sits on the
  // inner floor of the white half at axis position hx.
  function drawWoman(g, hx, h, lean) {
    var floorY = g.rad * 0.86;                 // inner floor line
    var baseY = floorY;                        // her seat rests here
    var topY = baseY - h;
    ctx.save();
    ctx.translate(hx, 0);
    ctx.rotate(lean);
    ctx.translate(-hx, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    var cxp = hx;                              // her centre line
    var shY = topY + 0.30 * h;                 // shoulders
    var headR = 0.155 * h;
    var headY = topY + headR;
    var kneeY = baseY - 0.46 * h;              // knees drawn up, high and proud

    // hair mass behind: falls from the crown past the shoulders
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.ellipse(cxp, topY + 0.31 * h, 0.225 * h, 0.325 * h, 0, 0, Math.PI * 2);
    ctx.fill();

    // dress: one flaring shape, shoulders to a wide seated base
    ctx.fillStyle = DRESS;
    ctx.beginPath();
    ctx.moveTo(cxp - 0.115 * h, shY);
    ctx.quadraticCurveTo(cxp - 0.24 * h, baseY - 0.42 * h, cxp - 0.355 * h, baseY);
    ctx.lineTo(cxp + 0.355 * h, baseY);
    ctx.quadraticCurveTo(cxp + 0.24 * h, baseY - 0.42 * h, cxp + 0.115 * h, shY);
    ctx.quadraticCurveTo(cxp, shY - 0.07 * h, cxp - 0.115 * h, shY);
    ctx.closePath();
    ctx.fill();

    // soft seat shadow where she meets the floor
    ctx.fillStyle = 'rgba(59,42,36,0.18)';
    ctx.beginPath();
    ctx.ellipse(cxp, baseY - 0.008 * h, 0.36 * h, 0.035 * h, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = DRESS;

    // knees drawn up: two proud mounds rising well above the dress hem,
    // separated from the torso by a shaded crease so the tuck reads
    ctx.beginPath();
    ctx.ellipse(cxp - 0.165 * h, kneeY, 0.150 * h, 0.195 * h, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cxp + 0.165 * h, kneeY, 0.150 * h, 0.195 * h, 0, 0, Math.PI * 2);
    ctx.fill();
    // crease shade outlining the lower half of each knee and the cleft
    ctx.strokeStyle = 'rgba(59,42,36,0.38)';
    ctx.lineWidth = 0.022 * h;
    ctx.beginPath();
    ctx.ellipse(cxp - 0.165 * h, kneeY, 0.150 * h, 0.195 * h, 0, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cxp + 0.165 * h, kneeY, 0.150 * h, 0.195 * h, 0, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cxp, kneeY - 0.16 * h);
    ctx.quadraticCurveTo(cxp + 0.014 * h, kneeY, cxp, kneeY + 0.16 * h);
    ctx.stroke();

    // short shins tucked down from the knees to bare feet flat on the floor
    ctx.strokeStyle = SKIN;
    ctx.lineWidth = 0.078 * h;
    ctx.beginPath();
    ctx.moveTo(cxp - 0.155 * h, kneeY + 0.15 * h);
    ctx.lineTo(cxp - 0.145 * h, baseY - 0.01 * h);
    ctx.moveTo(cxp + 0.155 * h, kneeY + 0.15 * h);
    ctx.lineTo(cxp + 0.145 * h, baseY - 0.01 * h);
    ctx.stroke();
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.ellipse(cxp - 0.180 * h, baseY - 0.004 * h, 0.068 * h, 0.027 * h, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cxp + 0.180 * h, baseY - 0.004 * h, 0.068 * h, 0.027 * h, 0, 0, Math.PI * 2);
    ctx.fill();

    // arms curving out and down, hands resting on top of the knees
    ctx.strokeStyle = DRESS;
    ctx.lineWidth = 0.095 * h;
    ctx.beginPath();
    ctx.moveTo(cxp - 0.12 * h, shY + 0.05 * h);
    ctx.quadraticCurveTo(cxp - 0.325 * h, baseY - 0.52 * h, cxp - 0.175 * h, kneeY - 0.14 * h);
    ctx.moveTo(cxp + 0.12 * h, shY + 0.05 * h);
    ctx.quadraticCurveTo(cxp + 0.325 * h, baseY - 0.52 * h, cxp + 0.175 * h, kneeY - 0.14 * h);
    ctx.stroke();
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.ellipse(cxp - 0.165 * h, kneeY - 0.165 * h, 0.052 * h, 0.038 * h, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cxp + 0.165 * h, kneeY - 0.165 * h, 0.052 * h, 0.038 * h, 0, 0, Math.PI * 2);
    ctx.fill();

    // head: skin face, hair cap over the crown
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.arc(cxp, headY, headR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.arc(cxp, headY - 0.018 * h, headR * 1.01, Math.PI * 1.02, Math.PI * 1.98);
    ctx.quadraticCurveTo(cxp, headY - headR * 0.28, cxp - headR * 1.01, headY - 0.018 * h);
    ctx.closePath();
    ctx.fill();
    // hair strands falling in front of the shoulders, framing the face
    ctx.beginPath();
    ctx.ellipse(cxp - 0.148 * h, headY + 0.115 * h, 0.042 * h, 0.125 * h, 0.10, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cxp + 0.148 * h, headY + 0.115 * h, 0.042 * h, 0.125 * h, -0.10, 0, Math.PI * 2);
    ctx.fill();

    // closed eyes: two short downward strokes, nothing more
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = Math.max(1, 0.016 * h);
    ctx.beginPath();
    ctx.moveTo(cxp - 0.075 * h, headY + 0.028 * h);
    ctx.quadraticCurveTo(cxp - 0.045 * h, headY + 0.048 * h, cxp - 0.015 * h, headY + 0.028 * h);
    ctx.moveTo(cxp + 0.015 * h, headY + 0.028 * h);
    ctx.quadraticCurveTo(cxp + 0.045 * h, headY + 0.048 * h, cxp + 0.075 * h, headY + 0.028 * h);
    ctx.stroke();

    ctx.restore();
  }

  // ---- physics state ----
  var angle = REST, angleVel = 0;
  var herPos = herBase, herVel = 0;
  var dragging = false, dragStartX = 0, dragBase = REST, dragTarget = REST;
  var downAt = 0, downX = 0, downY = 0, lastTapAt = -1e9, reseedCount = 0;

  function stepPhysics(dt) {
    if (dt <= 0) return;
    if (dt > 0.05) dt = 0.05;
    var target = dragging ? dragTarget : REST;
    var acc = (target - angle) * 30 - angleVel * 7.5;   // soft spring
    angleVel += acc * dt;
    angle += angleVel * dt;

    // she settles toward the low end: slide follows sin of the tilt
    var slide = herBase + Math.sin(angle - REST) * 1.55;
    if (slide < 0.04) slide = 0.04;
    if (slide > 0.96) slide = 0.96;
    var hAcc = (slide - herPos) * 14 - herVel * 6.5;    // softer, slower ease
    herVel += hAcc * dt;
    herPos += herVel * dt;
  }

  function reseed() {
    reseedCount++;
    var r2 = mulberry32(475003 + reseedCount * 7919);
    r2(); r2(); // step past the draws used for REST at load
    herBase = 0.15 + r2() * 0.65;
  }

  function draw(t) {
    if (!W || !H) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var g = geom();
    var U = Math.min(W, H);

    // ---- ground ----
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // ---- soft shadows under the capsule, following its axis ----
    var cosA = Math.cos(angle), sinA = Math.sin(angle);
    ctx.save();
    for (var s = -1; s <= 1; s++) {
      var lx = s * g.len * 0.27;
      var wx = g.cx + lx * cosA;
      var wy = g.cy + lx * sinA + g.rad * 1.28;
      var sw = g.len * (s === 0 ? 0.20 : 0.155);
      var shad = ctx.createRadialGradient(wx, wy, 0, wx, wy, sw);
      shad.addColorStop(0, 'rgba(105,84,48,0.20)');
      shad.addColorStop(1, 'rgba(105,84,48,0)');
      ctx.fillStyle = shad;
      ctx.beginPath();
      ctx.ellipse(wx, wy, sw, sw * 0.30, angle * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // ---- the capsule (breathes almost imperceptibly) ----
    var breathe = 1 + 0.005 * Math.sin(t * (Math.PI * 2 / 7));
    ctx.save();
    ctx.translate(g.cx, g.cy);
    ctx.rotate(angle);
    ctx.scale(breathe, breathe);

    // body backing
    stadiumPath(g);
    ctx.fillStyle = GLASS;
    ctx.fill();

    // red half, opaque
    ctx.save();
    stadiumPath(g);
    ctx.clip();
    ctx.fillStyle = RED;
    ctx.fillRect(-g.len / 2 - 2, -g.rad - 2, g.len / 2 + 2, g.rad * 2 + 4);
    ctx.restore();

    // the woman, clipped inside the capsule walls
    var h = Math.min(0.25 * H, 0.68 * g.rad * 2);
    if (isPhone()) h *= 1.22;
    var whiteSpan = g.len / 2 - g.rad * 0.55;         // usable axis run in white half
    var hx = g.rad * 0.30 + herPos * (whiteSpan - g.rad * 0.30);
    var lean = (herBase + Math.sin(angle - REST) * 1.55 - herPos) * 0.22; // trailing lean
    ctx.save();
    stadiumPath(g);
    ctx.clip();
    drawWoman(g, hx, h, lean);
    ctx.restore();

    // glass over the white half: she is seen through it
    ctx.save();
    stadiumPath(g);
    ctx.clip();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = GLASS;
    ctx.fillRect(0, -g.rad - 2, g.len / 2 + 2, g.rad * 2 + 4);
    ctx.globalAlpha = 1;
    // highlight stripe along the top
    var hl = ctx.createLinearGradient(0, -g.rad, 0, g.rad * 0.25);
    hl.addColorStop(0, 'rgba(255,255,255,0.55)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.fillRect(-g.len / 2, -g.rad, g.len, g.rad * 1.25);
    ctx.restore();

    // seam band where the halves meet
    ctx.fillStyle = 'rgba(90,58,40,0.13)';
    ctx.fillRect(-g.len * 0.009, -g.rad, g.len * 0.018, g.rad * 2);

    // outline
    stadiumPath(g);
    ctx.strokeStyle = 'rgba(74,48,36,0.30)';
    ctx.lineWidth = Math.max(1.2, 0.0035 * U);
    ctx.stroke();

    ctx.restore();

    // ---- grain over everything ----
    for (var gi = 0; gi < grain.length; gi++) {
      var d = grain[gi];
      ctx.fillStyle = d.light ? 'rgba(255,252,240,' + d.a + ')' : 'rgba(112,84,44,' + d.a + ')';
      ctx.beginPath();
      ctx.arc(d.x * W, d.y * H, d.r * U / 720 + 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- hint ----
    ctx.fillStyle = RED;
    ctx.globalAlpha = 0.42;
    ctx.font = '13px sans-serif';
    ctx.fillText('drag', 14, H - 14);
    ctx.globalAlpha = 1;
  }

  // ---- interaction: drag tilts, tap/double-tap reseeds her place ----
  function ptrX(e) { return (typeof e.clientX === 'number') ? e.clientX : W / 2; }
  function ptrY(e) { return (typeof e.clientY === 'number') ? e.clientY : H / 2; }

  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragStartX = ptrX(e);
    dragBase = angle;
    dragTarget = angle;
    downAt = performance.now();
    downX = ptrX(e); downY = ptrY(e);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = (ptrX(e) - dragStartX) / Math.max(1, W);
    var off = dx * 1.05;
    var MAXT = 0.436; // 25 degrees
    if (off > MAXT) off = MAXT;
    if (off < -MAXT) off = -MAXT;
    dragTarget = dragBase + off;
  });
  function endPtr(e) {
    if (!dragging) return;
    dragging = false;
    var moved = Math.abs(ptrX(e) - downX) + Math.abs(ptrY(e) - downY);
    var dt = performance.now() - downAt;
    if (moved < 8 && dt < 350) {
      var now = performance.now();
      if (now - lastTapAt < 350) { reseed(); lastTapAt = -1e9; }
      else lastTapAt = now;
    }
  }
  canvas.addEventListener('pointerup', endPtr);
  canvas.addEventListener('pointercancel', function () { dragging = false; });
  canvas.addEventListener('dblclick', function () { reseed(); });

  // ---- run ----
  resize();
  draw(PHASE);

  var startStamp = null, lastStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) { startStamp = stamp; lastStamp = stamp; }
      var elapsed = (stamp - startStamp) / 1000;
      var dt = (stamp - lastStamp) / 1000;
      lastStamp = stamp;
      stepPhysics(dt);
      draw(PHASE + elapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
