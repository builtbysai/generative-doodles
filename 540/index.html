<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Mass</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F2B3C0; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: four colors, nothing else. Flat fills only, no gradients.
  var GROUND = '#F2B3C0';   // pink ground
  var PINK = '#EFA8B6';     // figure pink
  var GRAY = '#CFCFCF';     // the one gray figure
  var INK = '#161616';      // outlines and the shared shadow pool

  var PHASE0 = 1.3;         // constant first-frame phase (fixed sway, no pointer)
  var BREATH = 8;           // seconds per breath cycle; gray rides the same
                            // cycle on its own phase (integer ratio, seamless)

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(540065);

  // ---- crowd layout (1080 x 1080 design space, cover-fit so it bleeds) ----
  // Three depth rows, smaller toward the top. One parametric figure, tiled.
  var ROWS = [
    { F: 350, base: 395, step: 72,  x0: -36 },   // back:  17 figures
    { F: 420, base: 680, step: 94,  x0: -28 },   // mid:   13 figures
    { F: 550, base: 940, step: 116, x0: -50 }    // front: 11 figures
  ];
  var GRAY_ROW = 1, GRAY_IDX = 6;                // mid row, x = 536

  var FIGS = [];
  for (var r = 0; r < ROWS.length; r++) {
    var row = ROWS[r];
    for (var x = row.x0; x <= 1080 + row.step * 0.5; x += row.step) {
      FIGS.push({
        x: x, base: row.base, F: row.F, row: r,
        gray: false,               // resolved by per-row index just below
        resp: 0.9 + rng() * 0.2,   // per-figure lean response (interaction only)
        hx: 0, vx: 0               // spring state: head shift + velocity
      });
    }
  }
  // resolve the gray flag by per-row index
  (function fixGray() {
    var seen = [0, 0, 0];
    for (var i = 0; i < FIGS.length; i++) {
      var f = FIGS[i];
      f.gray = f.row === GRAY_ROW && seen[f.row] === GRAY_IDX;
      seen[f.row]++;
    }
  })();
  var GRAY_FIG = null;
  for (var gi = 0; gi < FIGS.length; gi++) if (FIGS[gi].gray) GRAY_FIG = FIGS[gi];

  // ---- one figure, local coords: origin at baseline centre, up is -y ----
  // Blank face always: a head is a plain disc, no features, ever.
  function drawFigure(f, lean, bobY, headAngle) {
    var F = f.F;
    ctx.save();
    ctx.translate(f.x + f.hx * 0.35, f.base + bobY);
    ctx.rotate(lean);
    ctx.fillStyle = f.gray ? GRAY : PINK;
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(2, F * 0.014);
    ctx.lineJoin = 'round';
    // body: rounded-shoulder trapezoid
    ctx.beginPath();
    ctx.moveTo(-0.235 * F, 0);
    ctx.lineTo(-0.205 * F, -0.70 * F);
    ctx.quadraticCurveTo(-0.20 * F, -0.78 * F, -0.11 * F, -0.79 * F);
    ctx.lineTo(0.11 * F, -0.79 * F);
    ctx.quadraticCurveTo(0.20 * F, -0.78 * F, 0.205 * F, -0.70 * F);
    ctx.lineTo(0.235 * F, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // head: plain disc; the gray head is narrower (slightly turned) and turns
    var hr = 0.10 * F;
    var hcy = -0.885 * F;
    ctx.save();
    ctx.translate(0, -0.79 * F);
    ctx.rotate(headAngle);
    ctx.beginPath();
    if (f.gray) ctx.ellipse(0, hcy + 0.79 * F, hr * 0.86, hr, 0, 0, Math.PI * 2);
    else ctx.arc(0, hcy + 0.79 * F, hr, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  // ---- pointer / drag state (stage coords) ----
  var pointer = { x: 0, y: 0, down: false, seen: false };
  var grayHead = 0.16;              // current gray head turn (rad)
  var GRAY_REST = 0.16;             // its resting slight turn

  function stagePoint(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var sx = (clientX - rect.left - OX) / (S / 1080);
    var sy = (clientY - rect.top - OY) / (S / 1080);
    return { x: sx, y: sy };
  }
  function onDown(e) {
    var p = stagePoint(e.clientX, e.clientY);
    pointer.x = p.x; pointer.y = p.y; pointer.down = true; pointer.seen = true;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!pointer.down) return;
    var p = stagePoint(e.clientX, e.clientY);
    pointer.x = p.x; pointer.y = p.y;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() { pointer.down = false; }
  canvas.addEventListener('pointerdown', onDown);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  canvas.addEventListener('touchstart', function (e) {
    if (e.touches && e.touches[0]) onDown(e.touches[0]);
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches[0]) onMove(e.touches[0]);
  }, { passive: false });
  canvas.addEventListener('touchend', onUp);

  // ---- physics: lean-away springs, ~3s settle, lean and part, never scatter ----
  function step(dt, t) {
    for (var i = 0; i < FIGS.length; i++) {
      var f = FIGS[i];
      var target = 0;
      if (pointer.down) {
        var headY = f.base - 0.885 * f.F;
        var dx = f.x - pointer.x, dy = headY - pointer.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        var fall = Math.max(0, 1 - d / 300);
        fall *= fall;
        var dir = dx >= 0 ? 1 : -1;
        target = dir * fall * 30 * f.resp;
      }
      var acc = (target - f.hx) * 11 - f.vx * 4.6;
      f.vx += acc * dt;
      f.hx += f.vx * dt;
    }
    // gray head: look at the pointer while it drags, drift back to rest after
    var gTarget = GRAY_REST;
    if (pointer.down && GRAY_FIG) {
      gTarget = Math.max(-0.5, Math.min(0.5, (pointer.x - GRAY_FIG.x) / 280));
    }
    grayHead += (gTarget - grayHead) * Math.min(1, dt * 3);
  }

  // ---- scene ----
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    var ph = 2 * Math.PI * t / BREATH;
    var massLean = 0.014 * Math.sin(ph);
    var massBob = 2.2 * Math.sin(ph + 0.6);
    var grayLean = 0.022 * Math.sin(ph + 2.4);
    var grayBob = 3.0 * Math.sin(ph + 3.1);

    for (var i = 0; i < FIGS.length; i++) {
      var f = FIGS[i];
      var lean = (f.gray ? grayLean : massLean) + f.hx / f.F;
      var bob = f.gray ? grayBob : massBob;
      drawFigure(f, lean, bob, f.gray ? grayHead : 0);
    }

    // one shared black shadow pool stretched under the crowd, at the
    // front row's feet; drawn last so the front figures stand in it
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.ellipse(540, 925, 660, 80, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // hint, screen space, always in the corner; ink on the pink ground,
    // pink on the black pool (wide screens crop the pool into that corner)
    var hxS = (W - 30 - OX) / (S / 1080), hyS = (H - 16 - OY) / (S / 1080);
    var inPool = Math.pow((hxS - 540) / 660, 2) + Math.pow((hyS - 925) / 80, 2) < 1;
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = inPool ? GROUND : INK;
    ctx.font = (isPhone() ? 15 : 13) + 'px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('drag', W - 14, H - 12);
    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; cover-fit square stage, full-bleed) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw(simT);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null, lastStamp = null;
  function frame(ts) {
    if (startStamp === null) { startStamp = ts; lastStamp = ts; }
    var dt = Math.min(0.05, (ts - lastStamp) / 1000);
    lastStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    step(dt, simT);
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
