<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tambura</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0C; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var SC = [201, 201, 207];       // string #C9C9CF
  var AC = [217, 150, 44];        // interference amber #D9962C
  var STRING_RGB = 'rgb(201,201,207)';
  var AMBER_RGB = 'rgb(217,150,44)';
  var BG = '#0A0A0C';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- viewport sizing (Visual Viewport API) ----------
  function viewSize() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    return { w: w, h: h };
  }
  function isPhone(w, h) {
    var sw = 9999;
    if (window.screen) sw = Math.min(window.screen.width, window.screen.height);
    return sw < 700 || h > w * 1.15;
  }

  var W = 0, H = 0, DPR = 1, PHONE = false;
  function resize() {
    var s = viewSize();
    W = Math.max(1, Math.round(s.w));
    H = Math.max(1, Math.round(s.h));
    DPR = window.devicePixelRatio || 1;
    PHONE = isPhone(W, H);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  // ---------- detune sets: 3 curated, cycling per 32s loop ----------
  // Ratios against the common fundamental (the all-E guitar).
  var SETS = [
    [1.000, 1.001, 0.999, 1.002, 1.0005, 0.9985],   // A: the prompt's base set
    [1.000, 1.0025, 0.998, 1.004, 1.0015, 0.997],   // B: wider, more restless
    [1.0005, 0.9995, 1.0015, 0.999, 1.000, 1.002]   // C: narrow, asymmetric
  ];
  var PERIOD = 32;          // seconds per loop
  var PHASE0 = 10;          // frame one sits in the drift section
  // Interference model. Each string carries a phase measured against the
  // ensemble: deviation e_i = ratio_i - mean(ratios) of the active set,
  //   psi_i(x,t) = 2PI * (e_i * detuneScale * (RATE * t - SPAN * x/W)
  //                       + kappa_i * x/W * (0.35 + 0.65 * detuneScale))
  //                + phi_i,
  // with kappa_i / phi_i fixed per-string seeds (the string's spatial
  // character), so each string's bands sit at different places. The
  // shimmer is read two ways and the stronger shows:
  //   coherence R_i = | mean_j!=i exp(i * (psi_j - psi_i)) | (ensemble
  //     phase alignment: 0 scattered, 1 unison), and
  //   the string's own beat against the fundamental, sin(psi_i).
  // RATE and SPAN amplify the micro-detunes to visible scale: bands
  // travel at RATE/SPAN = 0.058 widths per second (crossing in ~17 s).
  var RATE = 22;
  var SPAN = 380;
  var KAPPA = [0.62, -0.48, 0.85, -0.70, 0.30, -0.88];
  var PHI = [0.7, 2.6, 4.4, 1.5, 5.5, 3.3];

  function smooth(a, b, x) {
    if (x <= a) return 0;
    if (x >= b) return 1;
    var u = (x - a) / (b - a);
    return u * u * (3 - 2 * u);
  }
  function lerp(a, b, u) { return a + (b - a) * u; }

  // Loop-phase envelopes, tau in [0, 32). Values match at the wrap so the
  // loop is seamless: brightness 0.35 and detuneScale 0.25 at tau = 0.
  function envelopes(tau) {
    var bright, dScale, amp;
    if (tau < 4) bright = lerp(0.35, 1.0, smooth(0, 4, tau));        // struck
    else if (tau < 26) bright = 1.0;                                 // drift
    else if (tau < 30) bright = lerp(1.0, 0.95, smooth(26, 30, tau)); // settle
    else bright = lerp(0.95, 0.35, smooth(30, 32, tau));             // fade
    if (tau < 4) dScale = lerp(0.25, 1.0, smooth(0, 4, tau));
    else if (tau < 26) dScale = 1.0;
    else if (tau < 30) dScale = lerp(1.0, 0.06, smooth(26, 30, tau)); // near-unison
    else dScale = lerp(0.06, 0.25, smooth(30, 32, tau));
    if (tau < 0.4) amp = lerp(0.55, 1.0, smooth(0, 0.4, tau));
    else if (tau < 26) amp = lerp(1.0, 0.8, smooth(0.4, 26, tau));
    else if (tau < 30) amp = lerp(0.8, 0.5, smooth(26, 30, tau));
    else amp = lerp(0.5, 0.55, smooth(30, 32, tau));
    return { bright: bright, dScale: dScale, amp: amp };
  }

  function mixStr(a, b, u) {
    var r = Math.round(lerp(a[0], b[0], u));
    var g = Math.round(lerp(a[1], b[1], u));
    var bl = Math.round(lerp(a[2], b[2], u));
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  // ---------- main draw: pure function of t ----------
  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.globalAlpha = 1;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var loopIdx = Math.floor(t / PERIOD);
    var tau = t - loopIdx * PERIOD;
    var set = SETS[((loopIdx % 3) + 3) % 3];
    var env = envelopes(tau);

    var minD = Math.min(W, H);
    var coreW = Math.max(1.4, Math.min(3, minD * 0.004));
    var glowW = coreW * 3.6;
    var vibAmp = minD * 0.011 * env.amp * (PHONE ? 1.25 : 1);
    var step = Math.max(3, Math.round(W / 320));
    var TWO_PI = Math.PI * 2;
    var nSeg = Math.ceil(W / step);

    var mean = 0;
    for (var m = 0; m < 6; m++) mean += set[m];
    mean /= 6;
    var kScale = 0.35 + 0.65 * env.dScale;
    function psi(i, xFrac) {
      var e = (set[i] - mean) * env.dScale;
      return TWO_PI * (e * (RATE * t - SPAN * xFrac) + KAPPA[i] * xFrac * kScale) + PHI[i];
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (var i = 0; i < 6; i++) {
      var y0 = H * (i + 0.5) / 6;

      // sample the string once: displaced points + coherence per sample
      var pts = [];
      for (var sIdx = 0; sIdx <= nSeg; sIdx++) {
        var x = Math.min(W, sIdx * step);
        var xf = W > 0 ? x / W : 0;
        var pi = psi(i, xf);
        var re = 0, im = 0;
        for (var j = 0; j < 6; j++) {
          if (j === i) continue;
          var dp = psi(j, xf) - pi;
          re += Math.cos(dp);
          im += Math.sin(dp);
        }
        var R = Math.sqrt(re * re + im * im) / 5;      // 0..1 coherence
        var beat = Math.pow(0.5 + 0.5 * Math.sin(pi), 2.4); // beat vs fundamental
        var bloom = Math.max(smooth(0.55, 0.95, R), 0.9 * beat);
        var y = y0 + vibAmp * Math.sin(TWO_PI * (2.2 * xf - 0.9 * t) + 0.35 * Math.sin(pi));
        pts.push({ x: x, y: y, bloom: bloom, R: R });
      }

      // pass 1: the plain string, always present along the same path
      ctx.strokeStyle = STRING_RGB;
      ctx.globalAlpha = 0.38 * env.bright;
      ctx.lineWidth = coreW;
      ctx.beginPath();
      for (sIdx = 0; sIdx < pts.length; sIdx++) {
        if (sIdx === 0) ctx.moveTo(pts[sIdx].x, pts[sIdx].y);
        else ctx.lineTo(pts[sIdx].x, pts[sIdx].y);
      }
      ctx.stroke();

      // pass 2: amber glow, only where the phases align
      ctx.strokeStyle = AMBER_RGB;
      ctx.lineWidth = glowW;
      for (sIdx = 1; sIdx < pts.length; sIdx++) {
        var bm = (pts[sIdx].bloom + pts[sIdx - 1].bloom) / 2;
        if (bm <= 0.01) continue;
        ctx.globalAlpha = Math.min(1, 0.42 * bm * bm * env.bright);
        ctx.beginPath();
        ctx.moveTo(pts[sIdx - 1].x, pts[sIdx - 1].y);
        ctx.lineTo(pts[sIdx].x, pts[sIdx].y);
        ctx.stroke();
      }

      // pass 3: core, tinted toward amber and brightened inside the bloom
      ctx.lineWidth = coreW;
      for (sIdx = 1; sIdx < pts.length; sIdx++) {
        var b2 = (pts[sIdx].bloom + pts[sIdx - 1].bloom) / 2;
        var r2 = (pts[sIdx].R + pts[sIdx - 1].R) / 2;
        ctx.strokeStyle = mixStr(SC, AC, 0.95 * b2 + 0.15 * r2);
        ctx.globalAlpha = Math.min(1, (0.30 + 0.45 * r2 + 0.45 * b2) * env.bright);
        ctx.beginPath();
        ctx.moveTo(pts[sIdx - 1].x, pts[sIdx - 1].y);
        ctx.lineTo(pts[sIdx].x, pts[sIdx].y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- run ----------
  function nowSec() { return performance.now() / 1000; }
  var startTime = nowSec();

  resize();
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  draw(PHASE0); // frame one: synchronous, fixed phase in the drift section

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(PHASE0 + (nowSec() - startTime));
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
