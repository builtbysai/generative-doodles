<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Credits Without Hierarchy</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #2a2a30; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (NR6 only, no other color).
  var FIELD = '#2a2a30';
  var BLOCK = '#55565e';
  // Signature colors as RGB triples (for alpha fades): cream, gold, teal, brick.
  var SIG_COLORS = [
    [232, 224, 208],
    [217, 164, 65],
    [46, 111, 106],
    [168, 103, 74]
  ];

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Rows: each a flowing line-signature (pure polyline, no letterforms)
  // plus a shorter, heavier surname block. Same stroke width for every
  // row: no hierarchy among the signatures.
  var NROWS = 5;
  var NPTS = 25;
  var rows = [];
  var i, j;
  for (i = 0; i < NROWS; i++) {
    var rng = mulberry32(1493000 + i * 7919);
    var ph1 = rng() * Math.PI * 2;
    var ph2 = rng() * Math.PI * 2;
    var a1 = 0.015 + rng() * 0.010;
    var a2 = 0.008 + rng() * 0.006;
    var pts = [];
    for (j = 0; j < NPTS; j++) {
      var u = j / (NPTS - 1);
      pts.push([
        0.14 + u * 0.46,
        a1 * Math.sin(u * Math.PI * 3 + ph1) + a2 * Math.sin(u * Math.PI * 7 + ph2)
      ]);
    }
    rows.push({
      pts: pts,
      color: SIG_COLORS[i % SIG_COLORS.length],
      baseY: 0.50 + (i - 2) * 0.11,
      phase: rng() * Math.PI * 2,
      shedStart: 2 + i * 5,   // one row at a time, 5 s apart
      freeAt: 2 + i * 5 + 1.5 // block drop takes 1.5 s
    });
  }

  var LOOP = 48;       // seconds
  var DROP_DUR = 1.5;  // block fall duration
  var FADE_START = 44; // signatures fade out over the last 4 s

  // Drag state: closed-form integral of shed rate over recorded segments.
  // Downward drag (dy > 20 px) slows the shed to rate 0.3; otherwise rate 1.
  var drags = [];      // {start, end (null while active), rate}
  var activeDrag = null;

  function shedTime(t) {
    var total = 0, prev = 0, k, seg, segEnd;
    for (k = 0; k < drags.length; k++) {
      seg = drags[k];
      if (t <= seg.start) { total += (t - prev); return total; }
      total += (seg.start - prev);
      segEnd = (seg.end === null) ? t : Math.min(t, seg.end);
      total += seg.rate * (segEnd - seg.start);
      prev = (seg.end === null) ? t : seg.end;
      if (seg.end !== null && t <= seg.end) return total;
    }
    total += (t - prev);
    return total;
  }

  function onDown(e) {
    var x = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
    var y = (e.clientY !== undefined) ? e.clientY : e.touches[0].clientY;
    activeDrag = { start: lastT, x0: x, y0: y, rate: 1, end: null };
    drags.push(activeDrag);
  }
  function onMove(e) {
    if (!activeDrag) return;
    var y = (e.clientY !== undefined) ? e.clientY : e.touches[0].clientY;
    var slow = (y - activeDrag.y0) > 20;
    var want = slow ? 0.3 : 1;
    if (want !== activeDrag.rate) {
      activeDrag.end = lastT;
      activeDrag = { start: lastT, x0: activeDrag.x0, y0: activeDrag.y0, rate: want, end: null };
      drags.push(activeDrag);
    }
  }
  function onUp() {
    if (!activeDrag) return;
    activeDrag.end = lastT;
    activeDrag = null;
  }

  var lastT = 0;
  var W = 0, H = 0;

  function size() {
    var vw = (typeof window !== 'undefined' && window.visualViewport)
      ? window.visualViewport.width : window.innerWidth;
    var vh = (typeof window !== 'undefined' && window.visualViewport)
      ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function round4(a) {
    return Math.round(a * 10000) / 10000;
  }

  function draw(t) {
    lastT = t;
    size();
    var lt = shedTime(t) % LOOP;
    var slowing = activeDrag !== null && activeDrag.rate === 0.3;

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    var width = Math.max(2, W * 0.004);
    var blockW = 0.14 * W;
    var blockH = Math.max(6, H * 0.045);
    var blockX = 0.64 * W;

    // Fade multiplier over the last 4 s of the loop (rounded to 4 decimals
    // so node-canvas never sees a scientific-notation alpha).
    var fade = 1;
    if (lt >= FADE_START) fade = round4((LOOP - lt) / (LOOP - FADE_START));

    var r, k, p, sx, sy, alpha;
    for (r = 0; r < NROWS; r++) {
      var row = rows[r];

      // Signature vertical position: base row, then a bounded rise once
      // freed, plus a gentle bob. Rise asymptotes so freed signatures stay
      // on the field; sway is horizontal. Bob (12 s) and sway (24 s)
      // periods both divide the 48 s loop, so the loop closes exactly.
      var yOff = 0, xSway = 0;
      if (lt >= row.freeAt) {
        var elapsed = lt - row.freeAt;
        yOff = -0.16 * H * (1 - Math.exp(-elapsed / 8));
        yOff += 0.008 * H * Math.sin(2 * Math.PI * lt / 12 + row.phase);
        xSway = 0.02 * W * Math.sin(2 * Math.PI * lt / 24 + row.phase);
      }
      var cy = row.baseY * H + yOff;

      // Flowing line-signature: one fixed seeded polyline, never mutated.
      alpha = round4(fade);
      if (alpha > 0) {
        ctx.strokeStyle = 'rgba(' + row.color[0] + ',' + row.color[1] + ',' + row.color[2] + ',' + alpha + ')';
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        for (k = 0; k < NPTS; k++) {
          p = row.pts[k];
          sx = p[0] * W + xSway;
          sy = cy + p[1] * H;
          if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        ctx.stroke();
      }

      // Surname block: present until its shed, then drops like a leaf and
      // dissolves. While a downward drag slows the shed, not-yet-dropped
      // blocks wobble in place.
      if (lt < row.shedStart) {
        var wob = slowing ? Math.sin(lastT * 9) * 0.006 * W : 0;
        ctx.fillStyle = BLOCK;
        ctx.fillRect(blockX + wob, row.baseY * H - blockH / 2, blockW, blockH);
      } else if (lt < row.shedStart + DROP_DUR) {
        var dp = (lt - row.shedStart) / DROP_DUR;
        var fall = dp * dp * 0.25 * H;
        var sway = Math.sin(dp * 9) * 0.008 * W;
        var balpha = 1;
        if (dp > 0.4) balpha = round4(1 - (dp - 0.4) / 0.6);
        if (balpha > 0) {
          ctx.fillStyle = 'rgba(85,86,94,' + balpha + ')';
          ctx.fillRect(blockX + sway, row.baseY * H - blockH / 2 + fall, blockW, blockH);
        }
      }
      // After the drop the block is gone for good: a drag never restores it.
    }
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(lastT); });
    }
    window.addEventListener('resize', function () { draw(lastT); });
  }

  // Frame one at a constant phase; clock starts only with the rAF loop.
  draw(0);
  if (typeof window !== 'undefined' && typeof window.__piece === 'undefined') {
    window.__piece = {
      draw: draw,
      down: function (x, y) { onDown({ clientX: x, clientY: y }); },
      move: function (x, y) { onMove({ clientX: x, clientY: y }); },
      up: function () { onUp(); },
      setTime: function (t) { lastT = t; }
    };
  }
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
