<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Scenes, One Turn</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F5F0E6; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var PAPER='#F5F0E6', INK='#1A1A1A', GRAY='#9A9A98', PINK='#F2D8D5', ORANGE='#E09A5A';
var SW=1000, SH=700;
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var vw=SW, vh=SH, dpr=1;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng=mulberry32(602073);

/* ---------- precomputed paper grain (seeded, never in draw) ---------- */
var grain=[];
for(var g=0; g<300; g++) grain.push([rng()*SW, rng()*SH, 0.5+rng()*1.2]);
var fibers=[];
for(var f=0; f<46; f++) fibers.push([rng()*SW, rng()*SH, (rng()*2-1)*9, (rng()*2-1)*2.4]);

/* ---------- carousel geometry ---------- */
var CX=500, BASE=528, PH=344, PW=262, R=196;
var STEP=Math.PI*2/5;
/* small handmade tilt per panel, fixed at load */
var panelTilt=[];
for(var pt=0; pt<5; pt++) panelTilt.push((rng()*2-1)*0.012);

/* ---------- drawing helpers ---------- */
function poly(pts, fill, stroke, lw){
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||2; ctx.stroke(); }
}
function ellipse(cx, cy, rx, ry, fill, stroke, lw){
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||2; ctx.stroke(); }
}
function circle(cx, cy, r, fill, stroke, lw){ ellipse(cx, cy, r, r, fill, stroke, lw); }
function hole(cx, cy, r){ /* a punched perforation: page shows through, tiny lip shadow */
  ctx.beginPath(); ctx.ellipse(cx, cy+0.9, r, r*0.82, 0, 0, Math.PI*2);
  ctx.fillStyle='rgba(26,26,26,0.20)'; ctx.fill();
  circle(cx, cy, r, PAPER, null);
}
function sparkle(cx, cy, r, fill){
  poly([[cx,cy-r],[cx+r*0.28,cy-r*0.28],[cx+r,cy],[cx+r*0.28,cy+r*0.28],
        [cx,cy+r],[cx-r*0.28,cy+r*0.28],[cx-r,cy],[cx-r*0.28,cy-r*0.28]], fill, null);
}

/* ---------- the five scenes ----------
   Local space: origin at panel bottom-center, x in [-PW/2, PW/2], y up is negative.
   pass 0 = contact-shadow pass (every fill becomes translucent ink, offset down-right)
   pass 1 = true colors. Perforations only on pass 1. */
function sceneShadow(pass){ return pass===0; }
function col(pass, c){ return pass===0 ? 'rgba(26,26,26,0.16)' : c; }

function sceneHedgehog(pass){
  /* hill */
  ctx.beginPath();
  ctx.moveTo(-116, 0); ctx.quadraticCurveTo(0, -34, 116, 0); ctx.closePath();
  ctx.fillStyle=col(pass,'rgba(154,154,152,0.55)'); ctx.fill();
  /* bush behind */
  circle(-52, -108, 30, col(pass,'rgba(154,154,152,0.75)'));
  circle(-18, -122, 36, col(pass,'rgba(154,154,152,0.75)'));
  circle(16, -106, 27, col(pass,'rgba(154,154,152,0.75)'));
  /* hedgehog body: dome with a zigzag spine top */
  var pts=[], n=14, i, a, rr;
  for(i=0;i<=n;i++){
    a=Math.PI - (i/n)*Math.PI;
    rr=(i%2===0)? 62:50;
    pts.push([8+Math.cos(a)*rr*1.28, -34+Math.sin(a)*-rr]);
  }
  pts.push([8+80, 0]); pts.push([8-80, 0]);
  poly(pts, col(pass, INK), null);
  if(pass===1){
    /* face */
    circle(66, -36, 21, PAPER, null);
    circle(61, -40, 2.6, INK, null);            /* eye */
    circle(86, -32, 3.4, INK, null);            /* nose */
    ctx.strokeStyle=INK; ctx.lineWidth=2.2;     /* feet */
    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-30, 6); ctx.moveTo(28, 0); ctx.lineTo(28, 6); ctx.stroke();
    /* perforations punched along the hill */
    for(i=0;i<5;i++) hole(-76+i*38, -7-Math.sin(i/4*Math.PI)*7, 3.4);
  }
}
function sceneBird(pass){
  /* branch */
  ctx.strokeStyle=col(pass, INK); ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-112, -64); ctx.quadraticCurveTo(0, -92, 104, -118); ctx.stroke();
  ctx.lineWidth=2;
  /* leaves */
  var lx=[-84,-38,22,74], i;
  for(i=0;i<4;i++){
    ctx.save(); ctx.translate(lx[i], -76-i*11); ctx.rotate(-0.5+i*0.22);
    ellipse(0, 0, 13, 6, col(pass,'rgba(154,154,152,0.85)'));
    ctx.restore();
  }
  /* tail */
  ctx.save(); ctx.translate(-16, -104); ctx.rotate(0.6);
  poly([[-6,-16],[8,-16],[13,20],[-1,20]], col(pass, INK), null);
  ctx.restore();
  /* body + head */
  ctx.save(); ctx.translate(14, -128); ctx.rotate(-0.18);
  ellipse(0, 0, 36, 27, col(pass, INK), null);
  ctx.restore();
  circle(44, -152, 17, col(pass, INK), null);
  if(pass===1){
    poly([[56,-158],[80,-150],[56,-142]], ORANGE, null);   /* the one orange beak */
    ellipse(6, -130, 15, 10, PAPER, null);                  /* cut wing window */
    circle(48, -156, 2.6, PAPER, null);                     /* eye */
    ctx.strokeStyle=INK; ctx.lineWidth=2.2;                 /* legs */
    ctx.beginPath(); ctx.moveTo(6, -102); ctx.lineTo(2, -88); ctx.moveTo(24, -104); ctx.lineTo(24, -90); ctx.stroke();
    for(i=0;i<4;i++) hole(-70+i*44, -58-i*8, 3.2);          /* perforations under the branch */
  }
}
function sceneGarden(pass){
  var px=[-72, 0, 72], i, j;
  /* ground line */
  ctx.strokeStyle=col(pass, INK); ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(-112, 0); ctx.lineTo(112, 0); ctx.stroke();
  for(i=0;i<3;i++){
    /* pot */
    poly([[px[i]-20,-30],[px[i]+20,-30],[px[i]+14,0],[px[i]-14,0]], col(pass,'rgba(154,154,152,0.9)'), null);
    /* stem */
    ctx.strokeStyle=col(pass, INK); ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(px[i], -30); ctx.quadraticCurveTo(px[i]+(i-1)*7, -78, px[i], -108); ctx.stroke();
    ctx.lineWidth=2;
    /* leaves */
    ellipse(px[i]-11, -66, 10, 5, col(pass,'rgba(154,154,152,0.85)'));
    ellipse(px[i]+11, -82, 10, 5, col(pass,'rgba(154,154,152,0.85)'));
    /* seed pod */
    ellipse(px[i], -128, 17, 23, col(pass, i===1?INK:'rgba(154,154,152,0.95)'), null);
    if(pass===1){ for(j=0;j<3;j++) hole(px[i]-6+j*6, -136+j*7, 2.7); }  /* punched pod holes */
  }
}
function sceneMoon(pass){
  if(pass===1){ ctx.fillStyle=INK; ctx.fillRect(-116, -302, 232, 302); }  /* the dark panel */
  /* hill */
  ctx.beginPath();
  ctx.moveTo(-116, 0); ctx.quadraticCurveTo(10, -26, 116, 0); ctx.closePath();
  ctx.fillStyle= pass===0 ? 'rgba(26,26,26,0.16)' : 'rgba(154,154,152,0.8)'; ctx.fill();
  /* crescent */
  circle(-6, -186, 66, col(pass, PAPER), null);
  circle(24, -206, 56, pass===0 ? 'rgba(26,26,26,0.16)' : INK, null);
  if(pass===1){
    sparkle(-66, -238, 10, PAPER); sparkle(62, -120, 8, PAPER); sparkle(-84, -128, 7, PAPER);
    circle(74, -232, 3, PAPER, null); circle(-40, -96, 2.6, PAPER, null); circle(30, -262, 2.6, PAPER, null);
    /* perforations along the crescent edge */
    var angs=[2.5, 2.95, 3.4, 3.85, 4.3], i;
    for(i=0;i<5;i++) hole(-6+Math.cos(angs[i])*57, -186+Math.sin(angs[i])*57, 3.1);
  }
}
function sceneHouse(pass){
  /* body */
  ctx.fillStyle=col(pass,'rgba(154,154,152,0.9)');
  ctx.fillRect(-58, -148, 116, 148);
  /* chimney */
  ctx.fillStyle=col(pass, INK); ctx.fillRect(30, -196, 16, 34);
  /* roof: the one pink in the piece */
  poly([[-80,-146],[0,-208],[80,-146]], col(pass, PINK), null);
  if(pass===1){
    /* door + window */
    ctx.fillStyle=INK; ctx.fillRect(-13, -62, 26, 62);
    ctx.fillStyle=PAPER; ctx.fillRect(-44, -118, 26, 26);
    ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.strokeRect(-44, -118, 26, 26);
    ctx.beginPath(); ctx.moveTo(-31, -118); ctx.lineTo(-31, -92); ctx.moveTo(-44, -105); ctx.lineTo(-18, -105); ctx.stroke();
    circle(7, -30, 2.4, PAPER, null);
    /* perforations punched along the roofline, just under the slope */
    for(var i=0;i<5;i++){
      var hx=-52+i*26;
      var hy=-146 - (80-Math.abs(hx))/80*62 + 11;
      hole(hx, hy, 3.2);
    }
    /* path */
    ctx.strokeStyle='rgba(26,26,26,0.5)';
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.quadraticCurveTo(-2, 4, 4, 0); ctx.stroke();
  }
}
var SCENES=[sceneHedgehog, sceneBird, sceneGarden, sceneMoon, sceneHouse];

/* ---------- one panel, in local space (origin bottom-center) ---------- */
function drawPanelFace(i, gap){
  /* stacked card edges behind the face: the paper thickness */
  ctx.fillStyle=GRAY;  ctx.fillRect(-PW/2+7, -PH+9, PW, PH);
  ctx.fillStyle='#E3DAC6'; ctx.fillRect(-PW/2+3.5, -PH+4.5, PW, PH);
  /* face */
  ctx.fillStyle=PAPER; ctx.fillRect(-PW/2, -PH, PW, PH);
  ctx.strokeStyle=INK; ctx.lineWidth=2.4; ctx.strokeRect(-PW/2, -PH, PW, PH);
  /* inner window */
  ctx.save();
  ctx.beginPath(); ctx.rect(-PW/2+13, -PH+13, PW-26, PH-26); ctx.clip();
  ctx.translate(0, -20); ctx.scale(1.15, 1.15);
  /* shadow pass, then true pass; gap separates the planes when the panel swings */
  ctx.save(); ctx.translate(3+gap*0.7, 4); SCENES[i](0); ctx.restore();
  ctx.save(); ctx.translate(-gap, -gap*0.5); SCENES[i](1); ctx.restore();
  ctx.restore();
  /* fold crease down the inner edge */
  ctx.strokeStyle='rgba(26,26,26,0.18)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-PW/2+7, -PH+5); ctx.lineTo(-PW/2+7, -5); ctx.stroke();
}
function drawPanelBack(){
  ctx.fillStyle=GRAY;  ctx.fillRect(-PW/2+7, -PH+9, PW, PH);
  ctx.fillStyle='#E3DAC6'; ctx.fillRect(-PW/2+3.5, -PH+4.5, PW, PH);
  ctx.fillStyle='#EFE8D8'; ctx.fillRect(-PW/2, -PH, PW, PH);
  ctx.strokeStyle=INK; ctx.lineWidth=2.4; ctx.strokeRect(-PW/2, -PH, PW, PH);
  ellipse(0, -PH/2, 52, 66, 'rgba(154,154,152,0.35)', null);
  ctx.strokeStyle='rgba(26,26,26,0.25)';
  ctx.beginPath(); ctx.moveTo(0, -PH+10); ctx.lineTo(0, -10); ctx.stroke();
}

/* ---------- interaction state ---------- */
var PHASE0=0;
var rot=0, mode='idle', vel=0;
var settleFrom=0, settleTo=0, settleT=0;
var lastAct=-10, dragging=false, dragX=0, dragMoved=0, downT=0, downX=0, lastMoveT=0;
var swingIdx=-1, swingT0=-9;
var nowT=0;
function q(x, steps){ return Math.floor(x*steps)/steps; }
function nearestStep(r){
  var k=Math.round(r/STEP);
  return k*STEP;
}

/* ---------- layout / resize ---------- */
var viewS=1, viewOX=0, viewOY=0;
function isPhone(){
  var sw=window.screen?Math.min(window.screen.width, window.screen.height):9999;
  if(sw<700) return true;
  return vh>vw*1.15;
}
function resize(){
  var w=SW, h=SH;
  if(window.visualViewport){ w=window.visualViewport.width; h=window.visualViewport.height; }
  else if(window.innerWidth){ w=window.innerWidth; h=window.innerHeight; }
  vw=w; vh=h; dpr=Math.min(window.devicePixelRatio||1, 2.5);
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  viewS=Math.min(vw/SW, vh/SH);
  viewOX=(vw-SW*viewS)/2; viewOY=(vh-SH*viewS)/2;
}
if(window.visualViewport){ window.visualViewport.addEventListener('resize', resize); }
window.addEventListener('resize', resize);
resize();

/* ---------- pointer ---------- */
function toStage(e){
  var r=canvas.getBoundingClientRect();
  return [ (e.clientX-r.left-viewOX)/viewS, (e.clientY-r.top-viewOY)/viewS ];
}
canvas.addEventListener('pointerdown', function(e){
  var p=toStage(e);
  dragging=true; dragX=p[0]; dragMoved=0; downX=p[0]; downT=nowT; lastMoveT=nowT; vel=0;
  mode='drag'; lastAct=nowT;
  if(canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
});
canvas.addEventListener('pointermove', function(e){
  if(!dragging) return;
  var p=toStage(e);
  var dx=p[0]-dragX;
  dragX=p[0]; dragMoved+=Math.abs(dx);
  var dRot=dx*0.0046;
  rot+=dRot;
  var dt=Math.max(0.008, nowT-lastMoveT); lastMoveT=nowT;
  vel=vel*0.6 + (dRot/dt)*0.4;
  lastAct=nowT;
});
function endPointer(e){
  if(!dragging) return;
  dragging=false; lastAct=nowT;
  var p=toStage(e);
  if(dragMoved<9 && (nowT-downT)<0.45){
    /* tap: swing the front-most panel under the point */
    var best=-1, bestZ=-2, i, a, px, z, f, hw;
    for(i=0;i<5;i++){
      a=rot+i*STEP; px=CX+Math.sin(a)*R; z=Math.cos(a); f=Math.max(0.06, Math.abs(z)); hw=PW/2*f;
      if(p[0]>px-hw-6 && p[0]<px+hw+6 && p[1]>BASE-PH && p[1]<BASE+16 && z>bestZ){ best=i; bestZ=z; }
    }
    if(best>=0){ swingIdx=best; swingT0=nowT; }
    mode='idle';
  } else {
    vel=Math.max(-1.5, Math.min(1.5, vel));
    mode='spin';
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- animation state per frame ---------- */
function update(dt){
  if(mode==='spin'){
    rot+=vel*dt;
    vel*=Math.exp(-2.1*dt);
    if(Math.abs(vel)<0.22){ mode='settle'; settleFrom=rot; settleTo=nearestStep(rot); settleT=0; }
  } else if(mode==='settle'){
    settleT+=dt/0.5;
    if(settleT>=1){ rot=settleTo; mode='idle'; }
    else {
      var e=1-Math.pow(1-settleT, 2);
      rot=settleFrom + (settleTo-settleFrom)*q(e, 6);   /* stepped, stopmotion grammar */
    }
  } else if(mode==='idle'){
    if(nowT-lastAct>6) rot+=dt*0.045;                   /* very slow idle turn */
  }
}

/* ---------- draw ---------- */
function draw(t){
  canvas.style.width=vw+'px'; canvas.style.height=vh+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,vw,vh);
  ctx.translate(viewOX, viewOY); ctx.scale(viewS, viewS);

  /* grain + fibers */
  ctx.fillStyle=INK; ctx.globalAlpha=0.045;
  for(var gi=0; gi<grain.length; gi++) ctx.fillRect(grain[gi][0], grain[gi][1], grain[gi][2], grain[gi][2]);
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(154,154,152,0.35)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(var fi=0; fi<fibers.length; fi++){ ctx.moveTo(fibers[fi][0], fibers[fi][1]); ctx.lineTo(fibers[fi][0]+fibers[fi][2], fibers[fi][1]+fibers[fi][3]); }
  ctx.stroke();

  /* base platform: the book opened into its star */
  ellipse(CX, BASE+26, R+92, 52, 'rgba(154,154,152,0.4)', null);
  ellipse(CX, BASE+16, R+92, 52, PAPER, INK, 2.2);
  ellipse(CX, BASE+16, R+40, 34, 'rgba(154,154,152,0.22)', null);

  /* panels in depth order */
  var order=[0,1,2,3,4].sort(function(a,b){
    return Math.cos(rot+a*STEP)-Math.cos(rot+b*STEP);
  });
  var spineDrawn=false;
  for(var oi=0; oi<5; oi++){
    var i=order[oi];
    var a=rot+i*STEP;
    var z=Math.cos(a);
    if(z>=0 && !spineDrawn){
      /* center spine + hub, between the back panels and the front panels */
      ctx.fillStyle=GRAY; ctx.fillRect(CX-9, BASE-PH-14, 18, PH+14);
      ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.strokeRect(CX-9, BASE-PH-14, 18, PH+14);
      spineDrawn=true;
    }
    var px=CX+Math.sin(a)*R;
    var f=Math.max(0.06, Math.abs(z));
    var hw=PW/2*f;
    var lift=(1-z)*5;                       /* top-down tilt: far panels ride a touch higher */
    /* contact shadow on the platform */
    ellipse(px, BASE+18, hw*0.95+8, 11, 'rgba(26,26,26,0.13)', null);
    /* swing: this panel opens a few degrees and falls back */
    var open=0;
    if(i===swingIdx){
      var sp=(t-swingT0)/0.75;
      if(sp>=1){ swingIdx=-1; }
      else open=Math.sin(Math.PI*q(sp,5))*0.9;
    }
    ctx.save();
    ctx.translate(px, BASE-lift);
    ctx.rotate(panelTilt[i] + open*0.05*(px>=CX? -1:1));
    ctx.scale(f, 1);
    if(z>=0) drawPanelFace(i, open*16);
    else drawPanelBack();
    ctx.restore();
  }
  if(!spineDrawn){
    ctx.fillStyle=GRAY; ctx.fillRect(CX-9, BASE-PH-14, 18, PH+14);
    ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.strokeRect(CX-9, BASE-PH-14, 18, PH+14);
  }
  /* top ring + finial: the fold geometry from above */
  ctx.beginPath(); ctx.ellipse(CX, BASE-PH-16, R*0.99, 19, 0, 0, Math.PI*2);
  ctx.strokeStyle='rgba(26,26,26,0.45)'; ctx.lineWidth=2; ctx.stroke();
  circle(CX, BASE-PH-22, 8, INK, null);
  circle(CX, BASE-PH-22, 3, PAPER, null);

  /* hint */
  ctx.globalAlpha=0.42; ctx.fillStyle=INK;
  ctx.font=(isPhone()?17:15)+'px "Segoe Print","Bradley Hand","Comic Sans MS",cursive';
  ctx.textAlign='right'; ctx.fillText('drag · tap', SW-26, SH-20);
  ctx.globalAlpha=1;
}

var t0=null, lastTs=0;
function frame(ts){
  if(t0===null){ t0=ts; lastTs=ts; }
  nowT=PHASE0+(ts-t0)/1000;
  var dt=Math.min(0.05, (ts-lastTs)/1000); lastTs=ts;
  update(dt);
  draw(nowT);
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}
draw(PHASE0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
