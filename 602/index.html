<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine Sound-Paintings</title>
<style>
html, body { margin: 0; padding: 0; background: #111111; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Nine Sound-Paintings: nine short vignettes play in sequence, each
   about forty seconds, each with its own visual rule set. One is a
   drifting charcoal texture, one a set of rotating letterforms, one a
   field of small pulsing dots, one a slow zoom through ink clouds,
   and five more of the same spirit. Each vignette dissolves fully
   before the next begins. Together they form one piece; no vignette
   is a song, each is a painting that makes sound. Watch only. */
var TAU = Math.PI * 2;
var BG = '#111111';
var BONE = '#EDE6D6';
var PLATE = '#101315';
var PLATE_LINE = 'rgba(237,230,214,0.45)';
var TITLE_INK = '#EDE6D2';
var HINT_INK = '#EDE6D6';
var SEED0 = 1892;
var FRAME_T = 12.0;      /* fixed phase: 12 s into vignette I, drift underway */
var VIG_LEN = 40;        /* seconds per vignette */
var VIG_N = 9;
var TOTAL = VIG_LEN * VIG_N;  /* 360 s, then hold on the final painting */
var ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX'];
var ACCENT = ['#C07A1F', '#B4552D', '#2E7F7A', '#EDE6D6', '#7D3C98',
              '#6B7A2A', '#B87333', '#A8C4D4', '#A93226'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* QA hook only: ?t=172 or ?v=4 jumps the sequencer; ?seed=N is read
   as a time in seconds. No link in the piece uses these. */
try {
  var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
  var mt = qs.match(/[?&]t=([0-9.]+)/);
  var mv = qs.match(/[?&]v=([0-9]+)/);
  var ms = qs.match(/[?&]seed=([0-9.]+)/);
  if (mt) phaseT = parseFloat(mt[1]);
  else if (mv) phaseT = parseInt(mv[1], 10) * VIG_LEN + 12;
  else if (ms) phaseT = parseFloat(ms[1]);
} catch (e) { /* keep FRAME_T */ }
FRAME_T = phaseT;
/* ---- deterministic geometry, all seeded from 1892 ---- */
var charcoal = [];   /* {x,y,r,grey,ph,dx,dy} soft drifting smudges */
var specks = [];     /* {x,y,r,ph} ochre grain */
var glyphs = [];     /* {x,y,s,rot,sp,strokes:[{k,x1,y1,x2,y2,r}]} pseudo-script */
var dots = [];       /* {x,y,ph} pulsing dot field */
var clouds = [];     /* {x,y,r,ph,sp} ink clouds */
var dashes = [];     /* {x,y,len,sp,ph} falling violet dashes */
var rings = [];      /* {x,y,off,sp,maxR} copper ring centers */
var cells = [];      /* {x,y,ph} pale blue grid cells */
var blooms = [];     /* {x,y,r,ph,sp} crimson breathing blooms */
(function buildGeometry() {
  var rng = mulberry32(SEED0);
  var i, j, k;
  for (i = 0; i < 220; i++) {
    charcoal.push({
      x: rng(), y: rng(),
      r: 0.02 + rng() * 0.07,
      grey: 0.16 + rng() * 0.30,
      ph: rng() * TAU,
      dx: (rng() * 2 - 1) * 0.02,
      dy: (rng() * 2 - 1) * 0.012
    });
  }
  for (i = 0; i < 70; i++) {
    specks.push({ x: rng(), y: rng(), r: 0.0012 + rng() * 0.0022, ph: rng() * TAU });
  }
  /* twelve pseudo-script glyphs: each a cluster of short strokes and
     hooks, abstract by construction, never readable words */
  for (i = 0; i < 12; i++) {
    var strokes = [];
    var nSt = 3 + Math.floor(rng() * 3);
    for (j = 0; j < nSt; j++) {
      strokes.push({
        k: rng() < 0.5 ? 0 : 1,  /* 0 line, 1 arc */
        x1: (rng() * 2 - 1) * 0.05, y1: (rng() * 2 - 1) * 0.05,
        x2: (rng() * 2 - 1) * 0.05, y2: (rng() * 2 - 1) * 0.05,
        r: 0.015 + rng() * 0.03
      });
    }
    glyphs.push({
      x: 0.14 + (i % 4) * 0.24 + (rng() * 2 - 1) * 0.04,
      y: 0.20 + Math.floor(i / 4) * 0.26 + (rng() * 2 - 1) * 0.04,
      s: 0.8 + rng() * 0.5,
      rot: rng() * TAU,
      sp: (rng() * 2 - 1) * 0.05,
      strokes: strokes
    });
  }
  for (i = 0; i < 16; i++) for (j = 0; j < 16; j++) {
    dots.push({ x: (i + 0.5) / 16, y: (j + 0.5) / 16, ph: (i * 0.7 + j * 1.1) });
  }
  for (i = 0; i < 14; i++) {
    clouds.push({
      x: 0.5 + (rng() * 2 - 1) * 0.45,
      y: 0.5 + (rng() * 2 - 1) * 0.45,
      r: 0.10 + rng() * 0.22,
      ph: rng() * TAU,
      sp: 0.6 + rng() * 0.8
    });
  }
  for (i = 0; i < 90; i++) {
    dashes.push({
      x: rng(), y: rng(),
      len: 0.015 + rng() * 0.05,
      sp: 0.02 + rng() * 0.05,
      ph: rng() * TAU
    });
  }
  for (i = 0; i < 8; i++) {
    rings.push({
      x: 0.2 + rng() * 0.6, y: 0.2 + rng() * 0.6,
      off: rng(), sp: 0.10 + rng() * 0.12,
      maxR: 0.12 + rng() * 0.16
    });
  }
  for (i = 0; i < 8; i++) for (j = 0; j < 8; j++) {
    cells.push({ x: (i + 0.5) / 8, y: (j + 0.5) / 8, ph: (i + j) * 0.55 });
  }
  for (i = 0; i < 5; i++) {
    blooms.push({
      x: 0.25 + rng() * 0.5, y: 0.25 + rng() * 0.5,
      r: 0.16 + rng() * 0.14,
      ph: rng() * TAU,
      sp: 0.10 + rng() * 0.08
    });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The piece rect: full-bleed on phones, a centered square on desktop.
   The page ground is the same near-black, so the square reads as the
   paintings filling the frame. Returns {ox, oy, s, w, h}. */
function pieceRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, s: s, w: s, h: s };
}
/* ---- the nine vignettes: nine genuinely distinct mechanisms ---- */
function vigCharcoal(R, u, t) {
  var i, b;
  for (i = 0; i < charcoal.length; i++) {
    b = charcoal[i];
    var bx = R.ox + (b.x + Math.sin(t * 0.05 + b.ph) * 0.03 + b.dx * u * 0.1) * R.w;
    var by = R.oy + (b.y + Math.cos(t * 0.04 + b.ph) * 0.02 + b.dy * u * 0.1) * R.h;
    var br = b.r * R.s;
    ctx.fillStyle = rgba('#3A3A3A', 0.10 + b.grey * 0.25);
    ctx.beginPath();
    ctx.moveTo(bx + br, by);
    ctx.arc(bx, by, br, 0, TAU);
    ctx.fill();
  }
  for (i = 0; i < specks.length; i++) {
    var sp = specks[i];
    var sa = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(t * 0.30 + sp.ph));
    ctx.fillStyle = rgba(ACCENT[0], sa);
    var sx = R.ox + sp.x * R.w, sy = R.oy + sp.y * R.h;
    var sr = Math.max(1, sp.r * R.s);
    ctx.beginPath();
    ctx.moveTo(sx + sr, sy);
    ctx.arc(sx, sy, sr, 0, TAU);
    ctx.fill();
  }
}
function vigLetters(R, u, t) {
  var i, j, g;
  ctx.lineCap = 'round';
  for (i = 0; i < glyphs.length; i++) {
    g = glyphs[i];
    var gx = R.ox + g.x * R.w, gy = R.oy + g.y * R.h;
    var rot = g.rot + t * g.sp;
    ctx.save();
    ctx.translate(gx, gy);
    ctx.rotate(rot);
    ctx.strokeStyle = rgba(ACCENT[1], 0.75);
    ctx.lineWidth = Math.max(1, R.s * 0.0035 * g.s);
    for (j = 0; j < g.strokes.length; j++) {
      var st = g.strokes[j];
      ctx.beginPath();
      if (st.k === 0) {
        ctx.moveTo(st.x1 * R.s * g.s, st.y1 * R.s * g.s);
        ctx.lineTo(st.x2 * R.s * g.s, st.y2 * R.s * g.s);
      } else {
        ctx.moveTo(st.x1 * R.s * g.s + st.r * R.s * g.s, st.y1 * R.s * g.s);
        ctx.arc(st.x1 * R.s * g.s, st.y1 * R.s * g.s, st.r * R.s * g.s, 0, Math.PI * (0.6 + 0.9 * Math.sin(st.x2 * 40)));
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  /* a faint rust baseline the glyphs drift above */
  ctx.strokeStyle = rgba(ACCENT[1], 0.18);
  ctx.lineWidth = Math.max(1, R.s * 0.0015);
  for (i = 0; i < 3; i++) {
    var ly = R.oy + (0.20 + i * 0.26) * R.h + Math.sin(t * 0.10 + i * 2.1) * R.s * 0.01;
    ctx.beginPath();
    ctx.moveTo(R.ox + R.w * 0.08, ly);
    ctx.lineTo(R.ox + R.w * 0.92, ly);
    ctx.stroke();
  }
}
function vigDots(R, u, t) {
  var i, d;
  for (i = 0; i < dots.length; i++) {
    d = dots[i];
    var wave = 0.5 + 0.5 * Math.sin(t * 0.45 - d.ph);
    var rr = Math.max(1, (1.2 + 3.4 * wave) * (R.s / 720));
    ctx.fillStyle = rgba(ACCENT[2], 0.25 + 0.55 * wave);
    var dx = R.ox + d.x * R.w, dy = R.oy + d.y * R.h;
    ctx.beginPath();
    ctx.moveTo(dx + rr, dy);
    ctx.arc(dx, dy, rr, 0, TAU);
    ctx.fill();
  }
}
function vigClouds(R, u, t) {
  var i, c;
  var zoom = 1 + u * 0.012;  /* slow zoom through the ink */
  for (i = 0; i < clouds.length; i++) {
    c = clouds[i];
    var cx = R.ox + (0.5 + (c.x - 0.5) * zoom) * R.w;
    var cy = R.oy + (0.5 + (c.y - 0.5) * zoom) * R.h;
    var cr = c.r * zoom * R.s * (1 + 0.08 * Math.sin(t * 0.07 * c.sp + c.ph));
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
    var a = 0.20 + 0.10 * Math.sin(t * 0.05 + c.ph);
    g.addColorStop(0, rgba(BONE, a));
    g.addColorStop(0.6, rgba('#5A5A58', a * 0.45));
    g.addColorStop(1, rgba(BG, 0));
    ctx.fillStyle = g;
    ctx.fillRect(cx - cr, cy - cr, cr * 2, cr * 2);
  }
  /* bone dust motes drifting through the clouds */
  ctx.fillStyle = rgba(BONE, 0.35);
  for (i = 0; i < 24; i++) {
    var mx = R.ox + ((i * 0.37 + t * 0.002) % 1) * R.w;
    var my = R.oy + ((i * 0.53 + Math.sin(t * 0.03 + i) * 0.05) % 1) * R.h;
    ctx.beginPath();
    ctx.moveTo(mx + 1.5, my);
    ctx.arc(mx, my, 1.5, 0, TAU);
    ctx.fill();
  }
}
function vigDashes(R, u, t) {
  var i, d;
  ctx.lineCap = 'round';
  for (i = 0; i < dashes.length; i++) {
    d = dashes[i];
    var fy = (d.y + t * d.sp * 0.12) % 1;
    var fx = d.x + Math.sin(t * 0.20 + d.ph) * 0.008;
    var fa = 0.20 + 0.55 * (0.5 + 0.5 * Math.sin(t * 0.5 + d.ph));
    ctx.strokeStyle = rgba(ACCENT[4], fa);
    ctx.lineWidth = Math.max(1, R.s * 0.002);
    var lx = R.ox + fx * R.w, ly = R.oy + fy * R.h;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(lx, ly + d.len * R.h);
    ctx.stroke();
  }
}
function vigTides(R, u, t) {
  var i, x;
  for (i = 0; i < 9; i++) {
    var baseY = 0.10 + i * 0.10;
    ctx.strokeStyle = rgba(ACCENT[5], 0.30 + 0.25 * (0.5 + 0.5 * Math.sin(t * 0.12 + i * 0.9)));
    ctx.lineWidth = Math.max(1, R.s * 0.002);
    ctx.beginPath();
    for (x = 0; x <= 60; x++) {
      var fx = x / 60;
      var fy = baseY + 0.022 * Math.sin(fx * 6.0 + t * 0.15 + i * 0.8) +
               0.010 * Math.sin(fx * 13.0 - t * 0.09 + i * 1.7);
      var px = R.ox + fx * R.w, py = R.oy + fy * R.h;
      if (x === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
}
function vigRings(R, u, t) {
  var i, r;
  for (i = 0; i < rings.length; i++) {
    r = rings[i];
    var frac = (u * r.sp + r.off) % 1;
    var rr = frac * r.maxR * R.s;
    ctx.strokeStyle = rgba(ACCENT[6], (1 - frac) * 0.65);
    ctx.lineWidth = Math.max(1, R.s * 0.0025);
    var rx = R.ox + r.x * R.w, ry = R.oy + r.y * R.h;
    ctx.beginPath();
    ctx.moveTo(rx + rr, ry);
    ctx.arc(rx, ry, Math.max(0.5, rr), 0, TAU);
    ctx.stroke();
  }
}
function vigGrid(R, u, t) {
  var i, c;
  for (i = 0; i < cells.length; i++) {
    c = cells[i];
    var ang = 0.5 * Math.sin(t * 0.35 - c.ph);
    var half = R.s * 0.045;
    var cx = R.ox + c.x * R.w, cy = R.oy + c.y * R.h;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.strokeStyle = rgba(ACCENT[7], 0.55);
    ctx.lineWidth = Math.max(1, R.s * 0.0018);
    ctx.strokeRect(-half, -half, half * 2, half * 2);
    if (Math.sin(t * 0.35 - c.ph) > 0.55) {
      ctx.fillStyle = rgba(ACCENT[7], 0.30);
      ctx.fillRect(-half * 0.5, -half * 0.5, half, half);
    }
    ctx.restore();
  }
}
function vigBlooms(R, u, t) {
  var i, b;
  for (i = 0; i < blooms.length; i++) {
    b = blooms[i];
    var br = b.r * R.s * (1 + 0.22 * Math.sin(t * b.sp + b.ph));
    var bx = R.ox + b.x * R.w, by = R.oy + b.y * R.h;
    var g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    g.addColorStop(0, rgba(ACCENT[8], 0.30));
    g.addColorStop(0.55, rgba(ACCENT[8], 0.12));
    g.addColorStop(1, rgba(BG, 0));
    ctx.fillStyle = g;
    ctx.fillRect(bx - br, by - br, br * 2, br * 2);
  }
}
var VIGS = [vigCharcoal, vigLetters, vigDots, vigClouds, vigDashes,
            vigTides, vigRings, vigGrid, vigBlooms];
/* Fade envelope: fade in over the first 2 s, hold, dissolve over the
   last 4 s to full black before the next painting begins. */
function vigAlpha(u) {
  if (u < 0) return 0;
  if (u > VIG_LEN) return 0;
  return smooth(u / 2) * (1 - smooth((u - (VIG_LEN - 4)) / 4));
}
function drawPlates(R) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Nine Sound-Paintings').width > R.w - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Nine Sound-Paintings').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 18').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = R.ox + 12, plateY = R.oy + 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Nine Sound-Paintings', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 18', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch nine paintings pass.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = R.ox + 12;
  var hintPlateY = R.oy + R.h - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function drawNumeral(R, idx, u) {
  /* small roman numeral in the top right corner, fading in with the
     painting and out before the dissolve */
  var na = smooth(u / 2) * (1 - smooth((u - 30) / 4));
  if (na <= 0.01) return;
  var px = isPhone ? 15 : 18;
  ctx.save();
  ctx.globalAlpha = na;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.font = px + 'px monospace';
  ctx.fillStyle = BONE;
  ctx.fillText(ROMAN[idx], R.ox + R.w - 16, R.oy + 16);
  ctx.restore();
}
function draw() {
  size();
  var R = pieceRect();
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, VW, VH);
  var t = phaseT;
  if (t >= TOTAL) {
    /* hold on the final painting, fully present */
    ctx.save();
    ctx.globalAlpha = 1;
    VIGS[VIG_N - 1](R, VIG_LEN, TOTAL);
    ctx.restore();
    drawNumeral(R, VIG_N - 1, 20);
  } else {
    var idx = Math.floor(t / VIG_LEN);
    var u = t - idx * VIG_LEN;
    ctx.save();
    ctx.globalAlpha = vigAlpha(u);
    VIGS[idx](R, u, t);
    ctx.restore();
    drawNumeral(R, idx, u);
  }
  drawPlates(R);
}
/* ---- frame one: fixed phase t = 12 s, vignette I underway, seed 1892 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
