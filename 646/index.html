<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1987 The Wash Does the Story</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a1630; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1987 The Wash Does the Story, MC4 / PP1234, study #259
  // mateo-villanueva-brandt.
  // A staged interior, desk, mirror, fringed chair, flattened
  // by grade into a single deep-blue field. Objects survive as
  // shapes in the wash, edges soft, shadows deep. The room sits
  // in loose thirds, the mirror is the brightest plane. Dust
  // drifts through the light shaft, almost still. Tap re-lights
  // the room: the wash jumps to a new monochrome field, deep
  // blue to ember to bone white to bottle green, never a
  // reseed, always a wash. The set itself never changes.
  // Study ref: M4 monochrome colour wash.

  // Fixed-phase first frame: FIRST_T = 6 s. The dust is
  // mid-drift at frame one, the wash is deep blue, the
  // crossfade is at rest. No wall clock or Date enters the
  // animation state, all randomness is seeded.
  var FIRST_T = 6;
  var SEED = 1987;
  var FADE_S = 2.5; // slow crossfade between washes, seconds

  // The wash list, fixed order, cycled by tap. Each wash is
  // one monochrome ramp: a dark end and a light end. The
  // scene is drawn in luminance, 0 to 1, and the grade
  // function maps every luminance through the current ramp,
  // so one colour-grade pass covers the whole picture.
  var WASHES = [
    { name: 'deep blue',    dark: [10, 22, 48],   light: [150, 180, 230] },
    { name: 'ember',        dark: [48, 18, 8],    light: [250, 170, 90]  },
    { name: 'bone white',   dark: [52, 48, 42],   light: [245, 240, 228] },
    { name: 'bottle green', dark: [8, 34, 24],    light: [140, 200, 160] }
  ];
  var washIndex = 0;          // current wash
  var washFrom = 0;           // wash the crossfade started from
  var washFadeStart = -100;   // virtual time the fade began

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function mix3(a, b, f) {
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // ---- Colour grade ----------------------------------------------
  // Current wash ramp at virtual time t: crossfades from
  // washFrom to washIndex over FADE_S seconds, smooth.
  function washRamp(t) {
    var f = smooth((t - washFadeStart) / FADE_S);
    var a = WASHES[washFrom], b = WASHES[washIndex];
    return { dark: mix3(a.dark, b.dark, f), light: mix3(a.light, b.light, f) };
  }
  // Grade a luminance value through the current ramp.
  function grade(lum, t, ramp) {
    var r = ramp || washRamp(t);
    var l = clamp(lum, 0, 1);
    l = Math.pow(l, 0.92);
    return mix3(r.dark, r.light, l);
  }
  // Ink for the caption and hint: the light end on dark
  // washes, the dark end on the bone-white wash, so the copy
  // stays readable on every wash.
  function inkColor(t, ramp) {
    var r = ramp || washRamp(t);
    var lum = 0.299 * r.light[0] + 0.587 * r.light[1] + 0.114 * r.light[2];
    var darkLum = 0.299 * r.dark[0] + 0.587 * r.dark[1] + 0.114 * r.dark[2];
    var light = lum > 200 && darkLum < 90;
    return light ? mix3(r.dark, [0, 0, 0], 0.25) : mix3(r.light, [255, 255, 255], 0.12);
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    // Room in loose thirds. Desk left, mirror centre right,
    // fringed chair far right. Floor line at 0.68 of height.
    L.floorY = H * 0.68;
    L.deskX = W * 0.06; L.deskW = W * 0.30;
    L.deskY = H * 0.52; L.deskH = H * 0.03;
    L.mirX = W * 0.44; L.mirW = W * 0.24;
    L.mirY = H * 0.16; L.mirH = H * 0.44;
    L.chairX = W * 0.76; L.chairW = W * 0.19;
    L.chairY = H * 0.44; L.chairH = H * 0.16;
    // Light shaft: a diagonal band from the top right, where
    // the unseen window stands, down to the floor left of
    // the chair.
    L.shaftTopX = W * 0.98; L.shaftTopW = W * 0.16;
    L.shaftBotX = W * 0.52; L.shaftBotW = W * 0.30;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Room ------------------------------------------------------
  // Everything is drawn in luminance and graded through the
  // current wash ramp. Soft edges come from gradients and
  // layered translucent shapes, never hard outlines.
  function drawRoom(t, ramp) {
    // Wall: soft vertical wash, lighter toward the top where
    // the light falls, darker toward the floor.
    var wg = ctx.createLinearGradient(0, 0, 0, L.floorY);
    wg.addColorStop(0, rgb(grade(0.46, t, ramp)));
    wg.addColorStop(0.6, rgb(grade(0.38, t, ramp)));
    wg.addColorStop(1, rgb(grade(0.30, t, ramp)));
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, W, L.floorY + 1);

    // Floor: deep, with a soft sheen where the shaft lands.
    var fg = ctx.createLinearGradient(0, L.floorY, 0, H);
    fg.addColorStop(0, rgb(grade(0.20, t, ramp)));
    fg.addColorStop(1, rgb(grade(0.10, t, ramp)));
    ctx.fillStyle = fg;
    ctx.fillRect(0, L.floorY, W, H - L.floorY);

    // Skirting line, a soft dark band where wall meets floor.
    ctx.fillStyle = rgba(grade(0.14, t, ramp), a4(0.8));
    ctx.fillRect(0, L.floorY - H * 0.006, W, H * 0.012);

    // Light shaft: a diagonal band of pale wash from the top
    // right down to the floor, two soft translucent passes so
    // the edges melt into the wall instead of cutting it.
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(L.shaftTopX - L.shaftTopW, 0);
    ctx.lineTo(L.shaftTopX, 0);
    ctx.lineTo(L.shaftBotX + L.shaftBotW, L.floorY);
    ctx.lineTo(L.shaftBotX, L.floorY);
    ctx.closePath();
    ctx.clip();
    var sg = ctx.createLinearGradient(L.shaftTopX, 0, L.shaftBotX, L.floorY);
    sg.addColorStop(0, rgba(grade(0.85, t, ramp), a4(0.34)));
    sg.addColorStop(1, rgba(grade(0.55, t, ramp), a4(0.16)));
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, L.floorY);
    // Inner core of the shaft, brighter and narrower.
    ctx.beginPath();
    ctx.moveTo(L.shaftTopX - L.shaftTopW * 0.45, 0);
    ctx.lineTo(L.shaftTopX - L.shaftTopW * 0.05, 0);
    ctx.lineTo(L.shaftBotX + L.shaftBotW * 0.62, L.floorY);
    ctx.lineTo(L.shaftBotX + L.shaftBotW * 0.28, L.floorY);
    ctx.closePath();
    ctx.fillStyle = rgba(grade(0.9, t, ramp), a4(0.18));
    ctx.fill();
    ctx.restore();

    // Pool of light on the floor where the shaft lands.
    var pg = ctx.createRadialGradient(
      L.shaftBotX + L.shaftBotW * 0.5, L.floorY + H * 0.10, 0,
      L.shaftBotX + L.shaftBotW * 0.5, L.floorY + H * 0.10, W * 0.22);
    pg.addColorStop(0, rgba(grade(0.62, t, ramp), a4(0.5)));
    pg.addColorStop(1, rgba(grade(0.62, t, ramp), 0));
    ctx.fillStyle = pg;
    ctx.fillRect(L.shaftBotX - W * 0.05, L.floorY, W * 0.5, H - L.floorY);

    // Deep shadows under the furniture, soft ellipses.
    ctx.fillStyle = rgba(grade(0.05, t, ramp), a4(0.55));
    ctx.beginPath();
    ctx.moveTo(L.deskX + L.deskW * 1.05, L.floorY + H * 0.02);
    ctx.ellipse(L.deskX + L.deskW * 0.5, L.floorY + H * 0.02, L.deskW * 0.55, H * 0.018, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(L.chairX + L.chairW * 1.02, L.floorY + H * 0.025);
    ctx.ellipse(L.chairX + L.chairW * 0.5, L.floorY + H * 0.025, L.chairW * 0.55, H * 0.02, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- Desk ------------------------------------------------------
  function drawDesk(t, ramp) {
    // Legs, darker than the top, sunk into shadow.
    ctx.fillStyle = rgb(grade(0.20, t, ramp));
    var legW = W * 0.012;
    ctx.fillRect(L.deskX + W * 0.015, L.deskY + L.deskH, legW, L.floorY - L.deskY - L.deskH);
    ctx.fillRect(L.deskX + L.deskW - W * 0.027, L.deskY + L.deskH, legW, L.floorY - L.deskY - L.deskH);
    // Top: a soft slab, lighter where the shaft catches it.
    var dg = ctx.createLinearGradient(L.deskX, 0, L.deskX + L.deskW, 0);
    dg.addColorStop(0, rgb(grade(0.42, t, ramp)));
    dg.addColorStop(0.7, rgb(grade(0.48, t, ramp)));
    dg.addColorStop(1, rgb(grade(0.55, t, ramp)));
    ctx.fillStyle = dg;
    ctx.fillRect(L.deskX, L.deskY, L.deskW, L.deskH);
    // Soft front edge under the top.
    ctx.fillStyle = rgba(grade(0.30, t, ramp), a4(0.9));
    ctx.fillRect(L.deskX, L.deskY + L.deskH, L.deskW, H * 0.008);

    // Books: a low stack on the left of the desk, three
    // pale slabs with darker gaps.
    var bx = L.deskX + W * 0.02, by = L.deskY;
    var bw = W * 0.11, bh = H * 0.018;
    var i;
    for (i = 0; i < 3; i++) {
      ctx.fillStyle = rgb(grade(0.58 - i * 0.07, t, ramp));
      ctx.fillRect(bx + i * W * 0.004, by - bh * (i + 1), bw - i * W * 0.008, bh);
    }
    // A jug on the right of the desk: a soft silhouette,
    // neck, shoulder, body, no hard outline.
    var jx = L.deskX + L.deskW * 0.74, jy = L.deskY;
    var jw = W * 0.035, jh = H * 0.075;
    ctx.fillStyle = rgb(grade(0.60, t, ramp));
    ctx.beginPath();
    ctx.moveTo(jx - jw * 0.28, jy);
    ctx.quadraticCurveTo(jx - jw * 0.55, jy - jh * 0.55, jx - jw * 0.18, jy - jh * 0.78);
    ctx.lineTo(jx + jw * 0.18, jy - jh * 0.78);
    ctx.quadraticCurveTo(jx + jw * 0.55, jy - jh * 0.55, jx + jw * 0.28, jy);
    ctx.closePath();
    ctx.fill();
    // Neck and rim.
    ctx.fillStyle = rgb(grade(0.66, t, ramp));
    ctx.fillRect(jx - jw * 0.16, jy - jh * 0.98, jw * 0.32, jh * 0.22);
    // Catchlight on the jug, the shaft touching it.
    ctx.fillStyle = rgba(grade(0.92, t, ramp), a4(0.55));
    ctx.beginPath();
    ctx.moveTo(jx + jw * 0.30, jy - jh * 0.18);
    ctx.ellipse(jx + jw * 0.12, jy - jh * 0.45, jw * 0.10, jh * 0.22, 0.2, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- Mirror ----------------------------------------------------
  // The brightest plane in the room: a tall rectangle of pale
  // wash in a dark frame, holding a soft reflection of the
  // desk and the shaft, never a realistic picture.
  function drawMirror(t, ramp) {
    // Frame, dark and soft.
    ctx.fillStyle = rgb(grade(0.16, t, ramp));
    ctx.fillRect(L.mirX - W * 0.008, L.mirY - H * 0.01, L.mirW + W * 0.016, L.mirH + H * 0.02);
    // Glass: the brightest plane, a pale vertical gradient.
    var mg = ctx.createLinearGradient(0, L.mirY, 0, L.mirY + L.mirH);
    mg.addColorStop(0, rgb(grade(0.95, t, ramp)));
    mg.addColorStop(0.55, rgb(grade(0.88, t, ramp)));
    mg.addColorStop(1, rgb(grade(0.74, t, ramp)));
    ctx.fillStyle = mg;
    ctx.fillRect(L.mirX, L.mirY, L.mirW, L.mirH);
    // Reflection of the shaft: a soft diagonal band across
    // the glass, slightly dimmer than the glass itself.
    ctx.save();
    ctx.beginPath();
    ctx.rect(L.mirX, L.mirY, L.mirW, L.mirH);
    ctx.clip();
    ctx.fillStyle = rgba(grade(0.98, t, ramp), a4(0.5));
    ctx.beginPath();
    ctx.moveTo(L.mirX + L.mirW * 0.55, L.mirY);
    ctx.lineTo(L.mirX + L.mirW * 0.95, L.mirY);
    ctx.lineTo(L.mirX + L.mirW * 0.45, L.mirY + L.mirH);
    ctx.lineTo(L.mirX + L.mirW * 0.05, L.mirY + L.mirH);
    ctx.closePath();
    ctx.fill();
    // Reflection of the desk: a low dark slab at the bottom
    // of the glass, soft and unreadable.
    ctx.fillStyle = rgba(grade(0.45, t, ramp), a4(0.55));
    ctx.fillRect(L.mirX, L.mirY + L.mirH * 0.82, L.mirW, L.mirH * 0.18);
    // Reflection of the chair fringe: faint vertical ticks
    // along the lower right of the glass.
    ctx.strokeStyle = rgba(grade(0.55, t, ramp), a4(0.5));
    ctx.lineWidth = Math.max(1, W * 0.0016);
    var k;
    for (k = 0; k < 7; k++) {
      var fx = L.mirX + L.mirW * (0.62 + k * 0.05);
      ctx.beginPath();
      ctx.moveTo(fx, L.mirY + L.mirH * 0.86);
      ctx.lineTo(fx, L.mirY + L.mirH * 0.97);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- Fringed chair ---------------------------------------------
  function drawChair(t, ramp) {
    var cx = L.chairX, cw = L.chairW, cy = L.chairY, ch = L.chairH;
    // Back: a tall soft slab, slightly lighter toward the
    // shaft side.
    var bg = ctx.createLinearGradient(cx, 0, cx + cw, 0);
    bg.addColorStop(0, rgb(grade(0.30, t, ramp)));
    bg.addColorStop(1, rgb(grade(0.40, t, ramp)));
    ctx.fillStyle = bg;
    ctx.fillRect(cx, cy, cw, ch);
    // Seat cushion: a pale slab jutting toward the viewer.
    ctx.fillStyle = rgb(grade(0.50, t, ramp));
    ctx.fillRect(cx - W * 0.01, cy + ch, cw + W * 0.02, H * 0.035);
    // Front legs, short and dark.
    ctx.fillStyle = rgb(grade(0.18, t, ramp));
    ctx.fillRect(cx + W * 0.008, cy + ch + H * 0.035, W * 0.010, L.floorY - cy - ch - H * 0.035);
    ctx.fillRect(cx + cw - W * 0.018, cy + ch + H * 0.035, W * 0.010, L.floorY - cy - ch - H * 0.035);
    // Fringe: a row of short vertical strokes hanging from
    // the seat edge, the chair's signature, catching light.
    ctx.strokeStyle = rgba(grade(0.68, t, ramp), a4(0.85));
    ctx.lineWidth = Math.max(1, W * 0.0018);
    var f;
    for (f = 0; f < 26; f++) {
      var fx = cx - W * 0.008 + f * ((cw + W * 0.016) / 25);
      var fl = H * (0.018 + hash1(f * 3.3) * 0.016);
      ctx.beginPath();
      ctx.moveTo(fx, cy + ch + H * 0.035);
      ctx.lineTo(fx + (hash1(f * 7.7) - 0.5) * W * 0.004, cy + ch + H * 0.035 + fl);
      ctx.stroke();
    }
    // Fringe shadow on the floor below it.
    ctx.fillStyle = rgba(grade(0.08, t, ramp), a4(0.4));
    ctx.fillRect(cx - W * 0.008, L.floorY - H * 0.004, cw + W * 0.016, H * 0.008);
  }

  // ---- Dust ------------------------------------------------------
  // Dust drifts through the light shaft, almost still. Each
  // mote is a pure function of t: a slow fall down the shaft
  // with a gentle sideways sway, wrapping at the floor. The
  // twinkle is a slow sine, about 0.3 Hz, far below any
  // flicker limit.
  var DUST_N = 42;
  function dustPos(i, t) {
    var speed = 0.012 + hash1(i * 3.1) * 0.020; // shaft fraction per second
    var p = (hash1(i * 7.3) + t * speed) % 1;
    var sway = Math.sin(t * 0.25 + i * 1.7) * 0.02;
    var x = L.shaftTopX - L.shaftTopW * 0.5 + (L.shaftBotX + L.shaftBotW * 0.5 - (L.shaftTopX - L.shaftTopW * 0.5)) * p + sway * W;
    var y = p * L.floorY;
    return { x: x, y: y, p: p };
  }
  function drawDust(t, ramp) {
    var i;
    for (i = 0; i < DUST_N; i++) {
      var d = dustPos(i, t);
      var r = Math.max(0.7, W * (0.0010 + hash1(i * 5.9) * 0.0018));
      var tw = 0.45 + 0.55 * Math.sin(t * 1.9 + i * 2.3);
      var a = 0.28 + 0.5 * tw * (0.4 + 0.6 * (1 - d.p));
      ctx.fillStyle = rgba(grade(0.96, t, ramp), a4(a));
      ctx.beginPath();
      ctx.moveTo(d.x + r, d.y);
      ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Draw ------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var ramp = washRamp(t);
    // Ground is the wash dark end; the stage is the whole image.
    var ground = rgb(ramp.dark);
    try { if (typeof document !== 'undefined' && document.body) { document.body.style.background = ground; } } catch (e) {}
    ctx.fillStyle = ground;
    ctx.fillRect(0, 0, W, H);

    drawRoom(t, ramp);
    drawDesk(t, ramp);
    drawMirror(t, ramp);
    drawChair(t, ramp);
    drawDust(t, ramp);

    // Caption, top left, and the hint, bottom center. Ink is
    // chosen per wash so the copy stays readable.
    var ink = inkColor(t, ramp);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(ink, a4(0.92));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1987 · The Wash Does the Story', W * 0.04, H * 0.055);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(ink, a4(0.95));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Tap to re-light the room.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // ---- Interaction -----------------------------------------------
  // Tap re-lights the room: advance one wash in the fixed
  // order, crossfading slowly. Never a reseed, never a
  // reload, the set never changes.
  function tap(t) {
    var now = (typeof t === 'number') ? t : lastT;
    washFrom = washIndex;
    washIndex = (washIndex + 1) % WASHES.length;
    washFadeStart = now;
    draw(now);
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', function () { tap(lastT); });
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1987 exposes the wash state and the tap.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1987 = {
      firstT: FIRST_T,
      washes: WASHES.map(function (w) { return w.name; }),
      washIndex: function () { return washIndex; },
      washName: function () { return WASHES[washIndex].name; },
      washAt: function (t) { return washRamp(t); },
      tap: function (t) { tap(t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: dust drifts, almost still. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
