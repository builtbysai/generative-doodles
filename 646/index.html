<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Apacheta</title>
<style>
  html, body { margin: 0; padding: 0; background: #0C0F0A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SEEDBASE = 646078;        // fixed launch seed for the cairn
  var genCounter = 0;           // counts cairn generations (reseed / rebuild)
  var FORCED = null;
  // QA hooks via ?seed=: "midrebuild" forces a mid-rebuild pose at t=0,
  // a bare number reseeds the launch cairn. No effect in normal viewing.
  (function parseQuery() {
    var q = (typeof location !== 'undefined' && location.search) || '';
    var m = q.match(/seed=([^&]+)/);
    if (!m) return;
    var v = m[1];
    if (v === 'midrebuild') { FORCED = 'midrebuild'; return; }
    var n = parseInt(v, 10);
    if (!isNaN(n)) SEEDBASE = n;
  })();

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette (strict, no other hues) ----------
  var GROUND = '#0C0F0A';                       // near-black ground
  var GRAYS = ['#3A3F45', '#565C64', '#7A8189']; // the three stone grays
  var AMBER = '#E8A33D';                        // top-stone dot only
  var SHADOW = '#060807';                       // the one shadow ellipse

  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function angLerp(a, b, t) {
    var d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  }

  // ---------- sizing (Visual Viewport API) ----------
  var W = 0, H = 0, lastElapsed = 0;
  function resize() {
    var vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildLayout();
    draw(lastElapsed);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  function isPhone(w, h) {
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  // ---------- cairn generation (seeded arrangement, pure data) ----------
  // A cairn is a list of stones, bottom first. Each stone carries a chunky
  // unit outline (flat top and bottom bearing faces, near-vertical sides,
  // seeded dents) normalised to span exactly [-1,1] x [-1,1], plus width and
  // height as fractions of the stack's base width / total height, a small
  // rotation, a gray, and a centre offset. Because the outline box is exact,
  // the drawn width and height are the stone's w and h. Stability is
  // enforced at build: every stone's centre stays well inside the horizontal
  // span of the stone below, and widths strictly decrease.
  function genCairn(seed) {
    var rng = mulberry32(seed);
    var count = 5 + Math.floor(rng() * 5);              // 5..9 stones
    var stones = [];
    var wFrac = 1;
    var off = 0;
    var prevGray = -1;
    // raw heights, gently decreasing with jitter, normalised later
    var rawH = [];
    var sumH = 0;
    for (var i = 0; i < count; i++) {
      var hf = (1.18 - 0.09 * i) * (0.82 + rng() * 0.36);
      rawH.push(hf); sumH += hf;
    }
    for (i = 0; i < count; i++) {
      if (i > 0) {
        wFrac *= 0.80 + rng() * 0.07;                   // strictly smaller
        var maxOff = stones[i - 1].wFrac * 0.20;
        off = off * 0.5 + (rng() * 2 - 1) * maxOff;     // centre over the span below
        off = clamp(off, -0.30, 0.30);
      }
      // Chunky rock outline, built edge by edge in perimeter order: a flat
      // bottom face the stone sits on, near-vertical sides, a flat top
      // bearing face, with seeded dents and bulges. A small jitter is added
      // to every point, then the outline is normalised so its bounding box
      // is exactly [-1,1] x [-1,1] - so the drawn stone really is w wide
      // and h tall, widths narrow monotonically as wFrac says, and stacked
      // faces meet instead of hovering.
      var bwL = 0.44 + rng() * 0.26;   // bottom flat half-spans
      var bwR = 0.44 + rng() * 0.26;
      var twL = 0.32 + rng() * 0.28;   // top flat half-spans
      var twR = 0.32 + rng() * 0.28;
      var raw = [];
      raw.push({ x: -bwL, y: 1 });                                    // bottom face
      if (rng() < 0.55) raw.push({ x: (rng() * 2 - 1) * 0.30, y: 0.97 + rng() * 0.03 });
      raw.push({ x: bwR, y: 1 });
      if (rng() < 0.85) raw.push({ x: 1, y: 0.38 + rng() * 0.26 });   // right side
      if (rng() < 0.50) raw.push({ x: 0.90 + rng() * 0.10, y: -0.10 + rng() * 0.22 });
      raw.push({ x: twR, y: -1 });                                    // top face
      if (rng() < 0.50) raw.push({ x: (rng() * 2 - 1) * 0.28, y: -1 + rng() * 0.05 });
      raw.push({ x: -twL, y: -1 });
      if (rng() < 0.85) raw.push({ x: -1, y: -0.38 - rng() * 0.26 }); // left side
      if (rng() < 0.50) raw.push({ x: -0.90 - rng() * 0.10, y: 0.10 + rng() * 0.22 });
      var mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9, j2;
      for (j2 = 0; j2 < raw.length; j2++) {
        raw[j2].x += (rng() * 2 - 1) * 0.03;
        raw[j2].y += (rng() * 2 - 1) * 0.03;
        if (raw[j2].x < mnx) mnx = raw[j2].x;
        if (raw[j2].x > mxx) mxx = raw[j2].x;
        if (raw[j2].y < mny) mny = raw[j2].y;
        if (raw[j2].y > mxy) mxy = raw[j2].y;
      }
      var verts = [];
      for (j2 = 0; j2 < raw.length; j2++) {
        verts.push({
          x: (raw[j2].x - (mnx + mxx) / 2) / ((mxx - mnx) / 2),
          y: (raw[j2].y - (mny + mxy) / 2) / ((mxy - mny) / 2)
        });
      }
      var gray = Math.floor(rng() * 3);
      if (gray === prevGray) gray = (gray + 1 + Math.floor(rng() * 2)) % 3;
      prevGray = gray;
      stones.push({
        verts: verts,
        wFrac: wFrac,
        hFrac: rawH[i] / sumH,
        rot: (rng() * 2 - 1) * 0.15,
        gray: gray,
        off: off
      });
    }
    return stones;
  }

  // Lay a generated cairn out in pixels for the current frame.
  // Outlines span their full w x h box, so stacking is done on true faces:
  // the base stone's flat bottom rests on the ground line, and every stone
  // above it sinks 22 percent of its own height into the stone below - its
  // bottom face lands below the top face of the stone underneath, so the
  // stack is in contact across the shared span, never hovering.
  function layoutCairn(gen, w, h) {
    var phone = isPhone(w, h);
    var baseW = Math.min((phone ? 0.60 : 0.44) * w, 0.58 * h);
    var totalH = 0.76 * h;
    var groundY = 0.80 * h;
    var cx = w / 2;
    var out = [];
    var topY = groundY;   // top face of whatever is below (the ground first)
    for (var i = 0; i < gen.length; i++) {
      var g = gen[i];
      var sh = g.hFrac * totalH;
      var sw = g.wFrac * baseW;
      var bottom = i === 0 ? groundY : topY + sh * 0.22;
      var cy = bottom - sh / 2;
      topY = bottom - sh;
      out.push({
        gen: g,
        cx: cx + g.off * baseW,
        cy: cy,
        w: sw, h: sh,
        rot: g.rot,
        gray: g.gray,
        top: i === gen.length - 1
      });
    }
    return { stones: out, baseW: baseW, totalH: totalH, groundY: groundY, cx: cx };
  }

  // ---------- state machine ----------
  // Modes: 'rest' (stacked, swaying), 'sim' (disturbance physics),
  // 'rebuild' (stones glide one by one into a new arrangement),
  // 'build' (double-tap reseed: a fresh cairn placed stone by stone).
  // Physics runs on the anchored clock in fixed steps from recorded drag
  // events; rebuild/build poses are pure functions of elapsed time given
  // the captured start poses, so the machine is deterministic throughout.
  var mode = 'rest';
  var curGen = genCairn(SEEDBASE);       // current target arrangement (data)
  var layout = null;                     // pixel layout of curGen
  var sim = null;                        // live bodies during 'sim'
  var simClock = 0;                      // anchored time the sim has reached
  var plan = null;                       // rebuild/build plan

  function buildLayout() {
    layout = layoutCairn(curGen, W, H);
    if (plan) retargetPlan();
    if (sim) rescaleSim();
  }

  // ----- disturbance simulation (fixed-step, anchored clock) -----
  // Bodies are the stones in pixel space. A dragged stone takes a horizontal
  // shove; when a stone's centre passes the edge of the span below it, it and
  // everything above it topple: gravity, a short tumble, a flat landing.
  var GRAV = 1700;                       // px / s^2
  function startSim(bodies, tNow) {
    sim = bodies; simClock = tNow; mode = 'sim';
  }
  function stepSim(dt) {
    var i, b;
    for (i = 0; i < sim.length; i++) {
      b = sim[i];
      if (b.state !== 'fall') continue;
      b.vy += GRAV * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.ang += b.va * dt;
      b.vx *= (1 - 0.6 * dt);
      b.va *= (1 - 1.8 * dt);
      // support: the ground, or the top face of a resting stone below
      var floor = layout.groundY - b.h / 2;
      for (var j = 0; j < sim.length; j++) {
        if (j === i) continue;
        var o = sim[j];
        if (o.state !== 'down' && o.state !== 'stack') continue;
        if (Math.abs(b.x - o.x) < (b.w + o.w) * 0.32 && o.y - o.h / 2 < b.y + b.h / 2 + 40) {
          var f = o.y - o.h / 2 - b.h / 2;
          if (f < floor) floor = f;
        }
      }
      if (b.y >= floor) {
        b.y = floor;
        b.state = 'down';
        b.vx = 0; b.vy = 0; b.va = 0;
        b.angTarget = Math.round(b.ang / Math.PI) * Math.PI + b.settleJit;
      }
    }
    // landing angle settle
    for (i = 0; i < sim.length; i++) {
      b = sim[i];
      if (b.state === 'down' && Math.abs(b.ang - b.angTarget) > 0.001) {
        b.ang = angLerp(b.ang, b.angTarget, clamp(dt * 7, 0, 1));
      }
    }
  }
  function simSettled() {
    for (var i = 0; i < sim.length; i++) if (sim[i].state === 'fall') return false;
    return true;
  }
  function rescaleSim() {
    // On resize mid-sim, rebuild bodies from the current layout and restart
    // the clock segment cleanly (a resize is a viewing change, not an event).
    if (!sim || !layout) return;
    for (var i = 0; i < sim.length; i++) {
      var L = layout.stones[i];
      if (sim[i].state === 'stack') { sim[i].x = L.cx; sim[i].y = L.cy; sim[i].ang = L.rot; }
    }
  }

  // ----- rebuild / build plans -----
  // A plan places stones one at a time, bottom first. Each stone eases from
  // its captured start pose up to an apex above its slot, then settles down
  // onto the target. Poses are closed-form in (t - plan.t0).
  function makePlan(kind, fromPoses, t0) {
    var per = kind === 'build' ? 0.52 : 2.1;
    var gap = kind === 'build' ? 0.10 : 0.35;
    return {
      kind: kind, t0: t0, per: per, gap: gap,
      from: fromPoses,                 // [{x,y,ang,gray,gen,wFrac...}] index-aligned with layout
      done: false
    };
  }
  function retargetPlan() { /* targets are read live from layout each frame */ }
  function planPose(p, i, t) {
    var start = p.t0 + i * (p.per + p.gap);
    var local = (t - start) / p.per;
    var T = layout.stones[i];
    var F = p.from[i];
    if (local <= 0) return { x: F.x, y: F.y, ang: F.ang, state: 'wait' };
    if (local >= 1) return { x: T.cx, y: T.cy, ang: T.rot, state: 'in' };
    var apexX = (F.x + T.cx) / 2;
    var apexY = Math.min(F.y, T.cy) - layout.totalH * 0.30 - 30;
    var x, y;
    if (local < 0.45) {
      var u = smooth(local / 0.45);
      x = lerp(F.x, apexX, u); y = lerp(F.y, apexY, u);
    } else {
      var v = smooth((local - 0.45) / 0.55);
      x = lerp(apexX, T.cx, v); y = lerp(apexY, T.cy, v);
    }
    return { x: x, y: y, ang: angLerp(F.ang, T.rot, smooth(local)), state: 'fly' };
  }
  function planEnd(p) {
    return p.t0 + layout.stones.length * (p.per + p.gap);
  }

  // ----- events: drag to disturb, double-tap to reseed -----
  var dragging = false, dragMoved = 0, lastPX = 0, lastPY = 0;
  var shove = null;                      // accumulated shove per stone while dragging at rest
  var lastTapT = -10, lastTapX = 0, lastTapY = 0;
  var downT = 0, downX = 0, downY = 0;

  function ptrPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function onDown(e) {
    var p = ptrPos(e);
    dragging = true; dragMoved = 0;
    lastPX = p.x; lastPY = p.y; downT = lastElapsed; downX = p.x; downY = p.y;
    if (mode === 'rest') {
      shove = [];
      for (var i = 0; i < layout.stones.length; i++) shove.push(0);
    }
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = ptrPos(e);
    var dx = p.x - lastPX, dy = p.y - lastPY;
    lastPX = p.x; lastPY = p.y;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    if (!layout) return;
    if (mode === 'rest' && shove) {
      // stones near the drag path take the shove
      for (var i = 0; i < layout.stones.length; i++) {
        var L = layout.stones[i];
        var d = Math.hypot(p.x - L.cx, p.y - L.cy);
        var reach = Math.max(L.w, L.h) * 0.75 + 26;
        if (d < reach) shove[i] += dx * (1 - d / reach) * 1.6;
      }
      maybeTopple();
    } else if (mode === 'sim' && sim) {
      for (var k = 0; k < sim.length; k++) {
        var b = sim[k];
        if (b.state !== 'stack') continue;
        var dd = Math.hypot(p.x - b.x, p.y - b.y);
        var rr = Math.max(b.w, b.h) * 0.75 + 26;
        if (dd < rr) { b.x += dx * (1 - dd / rr) * 1.4; }
      }
      maybeTopple();
    }
  }
  function maybeTopple() {
    if (!layout) return;
    var disp = currentDisplacements();
    for (var i = 1; i < disp.length; i++) {
      var below = layout.stones[i - 1];
      var rel = disp[i] - disp[i - 1];
      if (Math.abs(rel) > below.w * 0.30) { beginTopple(i, rel); return; }
    }
  }
  function currentDisplacements() {
    // horizontal displacement of each stone from its layout pose
    var d = [];
    var i;
    if (mode === 'sim' && sim) {
      for (i = 0; i < sim.length; i++) d.push(sim[i].state === 'stack' ? sim[i].x - layout.stones[i].cx : 0);
    } else if (shove) {
      for (i = 0; i < layout.stones.length; i++) d.push(shove[i]);
    } else {
      for (i = 0; i < layout.stones.length; i++) d.push(0);
    }
    return d;
  }
  function beginTopple(idx, rel) {
    var bodies = [];
    var rng = mulberry32(SEEDBASE + 977 * (genCounter + 1) + idx);
    for (var i = 0; i < layout.stones.length; i++) {
      var L = layout.stones[i];
      var dx = 0;
      if (mode === 'sim' && sim && sim[i].state === 'stack') dx = sim[i].x - L.cx;
      else if (shove) dx = shove[i];
      var b = {
        gen: L.gen, x: L.cx + dx, y: L.cy, w: L.w, h: L.h,
        ang: L.rot, gray: L.gray, top: L.top,
        vx: 0, vy: 0, va: 0, state: 'stack', settleJit: (rng() * 2 - 1) * 0.2, angTarget: L.rot
      };
      if (i >= idx) {
        b.state = 'fall';
        b.vx = (rel > 0 ? 1 : -1) * (90 + (i - idx) * 46 + rng() * 60);
        b.va = (rel > 0 ? 1 : -1) * (1.1 + rng() * 1.3);
      }
      bodies.push(b);
    }
    shove = null;
    startSim(bodies, lastElapsed);
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var quick = (lastElapsed - downT) < 0.32 && dragMoved < 12;
    if (quick) {
      if (lastElapsed - lastTapT < 0.34 && Math.hypot(downX - lastTapX, downY - lastTapY) < 44) {
        lastTapT = -10;
        reseed();
        return;
      }
      lastTapT = lastElapsed; lastTapX = downX; lastTapY = downY;
    }
    if (mode === 'rest' && shove) {
      // a shove that displaced stones but toppled none still disturbs the
      // cairn: it settles, then rebuilds into a fresh arrangement
      var moved = false;
      for (var i = 0; i < shove.length; i++) if (Math.abs(shove[i]) > 2) moved = true;
      if (moved) {
        var bodies = [];
        for (var j = 0; j < layout.stones.length; j++) {
          var L = layout.stones[j];
          bodies.push({
            gen: L.gen, x: L.cx + shove[j], y: L.cy, w: L.w, h: L.h,
            ang: L.rot, gray: L.gray, top: L.top,
            vx: 0, vy: 0, va: 0, state: 'stack', settleJit: 0, angTarget: L.rot
          });
        }
        shove = null;
        startSim(bodies, lastElapsed);
      } else shove = null;
    }
  }
  function reseed() {
    genCounter++;
    curGen = genCairn(SEEDBASE + 7919 * genCounter);
    sim = null; shove = null;
    buildLayout();
    // stones fly in from above the frame, one by one, about 4 s in all
    var from = [];
    var rng = mulberry32(SEEDBASE + 331 * genCounter);
    for (var i = 0; i < layout.stones.length; i++) {
      var L = layout.stones[i];
      from.push({
        x: L.cx + (rng() * 2 - 1) * layout.baseW * 0.24,
        y: -L.h - i * 8,
        ang: (rng() * 2 - 1) * 0.7, gray: L.gray, gen: L.gen
      });
    }
    plan = makePlan('build', from, lastElapsed);
    mode = 'build';
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ----- transitions driven by the clock -----
  var simRestSince = -1;
  function update(t) {
    if (mode === 'sim' && sim) {
      var step = 1 / 120;
      var guard = 0;
      while (simClock < t - 1e-6 && guard < 480) { stepSim(step); simClock += step; guard++; }
      if (simSettled()) {
        if (simRestSince < 0) simRestSince = t;
        if (t - simRestSince > 0.7) {
          // rebuild into a NEW arrangement, same stones, bottom first,
          // spread over about twenty seconds
          var from = [];
          for (var i = 0; i < sim.length; i++) {
            from.push({ x: sim[i].x, y: sim[i].y, ang: sim[i].ang, gray: sim[i].gray, gen: sim[i].gen });
          }
          genCounter++;
          curGen = genCairn(SEEDBASE + 7919 * genCounter);
          sim = null;
          buildLayout();
          // from-poses are index-aligned by stone identity: match by gen ref
          var aligned = [];
          for (var j = 0; j < layout.stones.length; j++) {
            var f = from[j] || { x: layout.stones[j].cx, y: layout.stones[j].cy, ang: 0 };
            aligned.push({ x: f.x, y: f.y, ang: f.ang, gray: layout.stones[j].gray, gen: layout.stones[j].gen });
          }
          plan = makePlan('rebuild', aligned, t);
          plan.per = clamp(17 / layout.stones.length, 1.5, 3.0);
          plan.gap = clamp(3 / layout.stones.length, 0.25, 0.5);
          mode = 'rebuild';
          simRestSince = -1;
        }
      } else simRestSince = -1;
    } else if ((mode === 'rebuild' || mode === 'build') && plan) {
      if (t >= planEnd(plan)) { plan = null; mode = 'rest'; }
    }
  }

  // ---------- drawing ----------
  function swayX(levelFrac, t) {
    // zero at t = 0; tops lean a little more than the base
    return (Math.sin(t * 0.50) * 1.6 + Math.sin(t * 0.83) * 0.5) * levelFrac;
  }
  function drawStone(x, y, w, h, rot, gen, gray, isTop) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    var v = gen.verts, n = v.length;
    var pts = [];
    for (var i = 0; i < n; i++) pts.push({ x: v[i].x * w / 2, y: v[i].y * h / 2 });
    // Chunky polygon: straight runs between corners, each corner cut by a
    // short quadratic (14 percent of each neighbouring edge). Faces stay
    // flat, corners read as rock, and the outline keeps the full extent of
    // its w x h box (the old midpoint smoothing shrank every stone well
    // inside its box, which is what made the stack hover).
    var CUT = 0.14;
    for (i = 0; i < n; i++) {
      var p = pts[i];
      var pv = pts[(i + n - 1) % n], nx = pts[(i + 1) % n];
      var ax = p.x + (pv.x - p.x) * CUT, ay = p.y + (pv.y - p.y) * CUT;
      var bx = p.x + (nx.x - p.x) * CUT, by = p.y + (nx.y - p.y) * CUT;
      if (i === 0) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
      ctx.quadraticCurveTo(p.x, p.y, bx, by);
    }
    ctx.closePath();
    ctx.fillStyle = GRAYS[gray];
    ctx.fill();
    ctx.restore();
    if (isTop) {
      // the single amber dot rides near the top stone's crown
      var c = Math.cos(rot), s = Math.sin(rot);
      var lx = 0.16 * w, ly = -0.20 * h;
      ctx.beginPath();
      ctx.arc(x + lx * c - ly * s, y + lx * s + ly * c, Math.max(2.2, w * 0.040), 0, Math.PI * 2);
      ctx.fillStyle = AMBER;
      ctx.fill();
    }
  }
  function drawShadow(t, lift) {
    // one faint flat ellipse under the base stone
    var sw = swayX(0.12, t);
    ctx.beginPath();
    ctx.ellipse(layout.cx + sw, layout.groundY + H * 0.012,
      layout.baseW * 0.62 * (1 - lift * 0.2), H * 0.017, 0, 0, Math.PI * 2);
    ctx.fillStyle = SHADOW;
    ctx.globalAlpha = 0.55 - lift * 0.25;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function draw(t) {
    lastElapsed = t;
    if (!layout) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    update(t);
    var i, L;
    if (mode === 'rest') {
      drawShadow(t, 0);
      var disp = (dragging && shove) ? shove : null;
      for (i = 0; i < layout.stones.length; i++) {
        L = layout.stones[i];
        var lf = (layout.groundY - L.cy) / layout.totalH;
        drawStone(L.cx + swayX(lf, t) + (disp ? disp[i] : 0), L.cy, L.w, L.h, L.rot, L.gen, L.gray, L.top);
      }
    } else if (mode === 'sim' && sim) {
      drawShadow(t, 0);
      for (i = 0; i < sim.length; i++) {
        var b = sim[i];
        drawStone(b.x, b.y, b.w, b.h, b.ang, b.gen, b.gray, b.top);
      }
    } else if ((mode === 'rebuild' || mode === 'build') && plan) {
      var anyFly = false;
      var poses = [];
      for (i = 0; i < layout.stones.length; i++) {
        poses.push(planPose(plan, i, t));
        if (poses[i].state === 'fly') anyFly = true;
      }
      drawShadow(t, anyFly ? 0.5 : 0);
      // waiting stones first, placed stones next, the flying stone last
      for (i = 0; i < layout.stones.length; i++) if (poses[i].state === 'wait') {
        L = layout.stones[i];
        drawStone(poses[i].x, poses[i].y, L.w, L.h, poses[i].ang, L.gen, L.gray, false);
      }
      for (i = 0; i < layout.stones.length; i++) if (poses[i].state === 'in') {
        L = layout.stones[i];
        var lf2 = (layout.groundY - L.cy) / layout.totalH;
        drawStone(poses[i].x + swayX(lf2, t), poses[i].y, L.w, L.h, poses[i].ang, L.gen, L.gray, L.top);
      }
      for (i = 0; i < layout.stones.length; i++) if (poses[i].state === 'fly') {
        L = layout.stones[i];
        drawStone(poses[i].x, poses[i].y, L.w, L.h, poses[i].ang, L.gen, L.gray, L.top);
      }
    }
  }

  // ---------- QA hook: force a mid-rebuild pose at load ----------
  // Runs after the boot resize so the scattered poses use the real layout:
  // the previous generation lies on the ground beside the cairn, the rebuild
  // clock is wound back so two stones are placed and the third is mid-flight.
  function setupMidRebuild() {
    mode = 'rebuild';
    var rngF = mulberry32(SEEDBASE + 4242);
    var fromF = [];
    for (var fi = 0; fi < layout.stones.length; fi++) {
      var FL = layout.stones[fi];
      var side = fi % 2 === 0 ? -1 : 1;
      fromF.push({
        x: layout.cx + side * (layout.baseW * 0.58 + FL.w * 0.30),
        y: layout.groundY - FL.h / 2 - (fi % 3) * 4,
        ang: (rngF() * 2 - 1) * 1.1, gray: FL.gray, gen: FL.gen
      });
    }
    plan = makePlan('rebuild', fromF, 0);
    plan.per = 2.1; plan.gap = 0.35;
    plan.t0 = -(2 * (plan.per + plan.gap) + plan.per * 0.7); // third stone mid-flight at t=0
  }

  // ---------- boot + loop (rAF typeof-guarded; frame one is synchronous) ----------
  resize();
  if (FORCED === 'midrebuild') setupMidRebuild();
  draw(0);
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (now) {
      draw((now - t0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
