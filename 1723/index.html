<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Intrusion</title>
<style>
html, body { margin: 0; padding: 0; background: #F5A623; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
/* ---- driver: a flat marigold calm holds against a block of fBm turbulence
   entering from the right; the hard mask boundary is the tension, and tap
   moves where the intrusion originates. ---- */
var MARIGOLD = '#F5A623';
var PLATE = '#17120F';
var PLATE_LINE = 'rgba(255,166,35,0.55)';
var TITLE_INK = '#FFFDF8';
var HINT_INK = '#F5A623';
var PERIOD = 24;
var FRAME_T = 3.0;
var OCTAVES = 5;
var GRID = 120;
var COVERAGE = 0.34;
var FEATHER = 0.022;
var RAMP = [
  [0.00, '#3A0500'],
  [0.18, '#7A0C02'],
  [0.38, '#A81300'],
  [0.55, '#D93A0B'],
  [0.72, '#F2620F'],
  [0.86, '#FF8C1A'],
  [0.95, '#FFB347'],
  [1.00, '#FFE9A3']
];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
/* ---- fixed reseed table: 8 origins, derived once from mulberry32(1723) ---- */
var ORIGINS = [];
(function () {
  var r = mulberry32(1723), i;
  for (i = 0; i < 8; i++) ORIGINS.push({ x: 0.70 + r() * 0.22, y: 0.15 + r() * 0.70, seed: 1723 * 1000 + i * 7919 });
})();
var originIdx = 0;
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- value-noise lattice, rebuilt from the active origin seed ---- */
var LAT = 64, lat = new Float32Array((LAT + 1) * (LAT + 1));
function buildLattice(seed) {
  var r = mulberry32(seed), i;
  for (i = 0; i < lat.length; i++) lat[i] = r();
}
buildLattice(ORIGINS[0].seed);
function fade(t) { return t * t * (3 - 2 * t); }
function vnoise(u, v) {
  var x = u * LAT, y = v * LAT;
  var xi = Math.floor(x), yi = Math.floor(y);
  var xf = x - xi, yf = y - yi;
  var s = fade(xf), t2 = fade(yf);
  var x0 = xi % LAT, x1 = (xi + 1) % LAT;
  var y0 = yi % LAT, y1 = (yi + 1) % LAT;
  var a = lat[y0 * (LAT + 1) + x0], b = lat[y0 * (LAT + 1) + x1];
  var c = lat[y1 * (LAT + 1) + x0], d = lat[y1 * (LAT + 1) + x1];
  var ab = a + (b - a) * s, cd = c + (d - c) * s;
  return ab + (cd - ab) * t2;
}
function fbm(u, v) {
  var sum = 0, amp = 0.5, freq = 1, norm = 0, o;
  for (o = 0; o < OCTAVES; o++) {
    sum += amp * vnoise(u * freq, v * freq);
    norm += amp;
    amp *= 0.4;
    freq *= 2;
  }
  return sum / norm;
}
function rampColor(v) {
  var i;
  for (i = 0; i < RAMP.length - 1; i++) {
    if (v <= RAMP[i + 1][0]) {
      var t = (v - RAMP[i][0]) / (RAMP[i + 1][0] - RAMP[i][0]);
      var a = hexRgb(RAMP[i][1]), b = hexRgb(RAMP[i + 1][1]);
      return [
        Math.round(a[0] + (b[0] - a[0]) * t),
        Math.round(a[1] + (b[1] - a[1]) * t),
        Math.round(a[2] + (b[2] - a[2]) * t)
      ];
    }
  }
  return hexRgb(RAMP[RAMP.length - 1][1]);
}
function fbmWarp(u, v, driftU, driftV, o) {
  /* domain warp: low-frequency noise bends the sample coords into billows */
  var wu = vnoise(u * 2.0 + o.x * 3.0, v * 2.0 + o.y * 3.0) - 0.5;
  var wv = vnoise(u * 2.0 + 7.3, v * 2.0 + 3.1) - 0.5;
  return fbm(u * 1.8 + wu * 0.55 + driftU + o.x * 0.35,
             v * 1.8 + wv * 0.55 + driftV + o.y * 0.35);
}
/* ---- mask boundary: mostly vertical, slow wobble, anchored at the origin ---- */
function boundaryX(v, t) {
  var o = ORIGINS[originIdx];
  return (1 - COVERAGE) + 0.012 * Math.sin(TAU * (v * 2.1 + t / PERIOD) + o.y * 6.0)
    + 0.008 * Math.sin(TAU * (v * 5.3 - t / (PERIOD * 0.75)) + o.x * 6.0);
}
function maskAlpha(u, v, t) {
  var bx = boundaryX(v, t);
  return clamp((u - (bx - FEATHER)) / (2 * FEATHER), 0, 1);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
var off = null, offCtx = null;
try {
  off = document.createElement('canvas');
  off.width = GRID; off.height = GRID;
  offCtx = off.getContext('2d');
} catch (e) { off = null; }
function drawTurbulence(st, t) {
  var o = ORIGINS[originIdx];
  var driftU = 0.06 * Math.sin(TAU * t / PERIOD + o.x * 4.0);
  var driftV = 0.06 * Math.cos(TAU * t / (PERIOD * 0.9) + o.y * 4.0);
  var i, j;
  if (!offCtx) {
    /* fallback: no offscreen canvas available (node-canvas QA shim) */
    var cw = st.w / GRID, ch = st.h / GRID;
    for (j = 0; j < GRID; j++) {
      var v0 = j / (GRID - 1);
      for (i = 0; i < GRID; i++) {
        var u0 = i / (GRID - 1);
        var a0 = maskAlpha(u0, v0, t);
        if (a0 <= 0) continue;
        var n0 = fbmWarp(u0, v0, driftU, driftV, o);
        n0 = clamp(0.5 + (n0 - 0.5) * 1.6, 0, 1);
        var c0 = rampColor(n0);
        ctx.fillStyle = 'rgba(' + c0[0] + ',' + c0[1] + ',' + c0[2] + ',' + a0.toFixed(4) + ')';
        ctx.fillRect(st.x + i * cw, st.y + j * ch, cw + 0.5, ch + 0.5);
      }
    }
    drawBoundary(st, t);
    return;
  }
  var img = offCtx.createImageData(GRID, GRID);
  var data = img.data;
  var idx = 0;
  for (j = 0; j < GRID; j++) {
    var v = j / (GRID - 1);
    for (i = 0; i < GRID; i++) {
      var u = i / (GRID - 1);
      var a = maskAlpha(u, v, t);
      if (a <= 0) { data[idx + 3] = 0; idx += 4; continue; }
      var n = fbmWarp(u, v, driftU, driftV, o);
      n = clamp(0.5 + (n - 0.5) * 1.6, 0, 1);
      var c = rampColor(n);
      data[idx] = c[0]; data[idx + 1] = c[1]; data[idx + 2] = c[2];
      data[idx + 3] = Math.round(a * 255);
      idx += 4;
    }
  }
  offCtx.putImageData(img, 0, 0);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, st.x, st.y, st.w, st.h);
  ctx.restore();
  drawBoundary(st, t);
}
function drawBoundary(st, t) {
  /* crisp ember line along the boundary curve */
  ctx.beginPath();
  var y, first = true;
  for (y = 0; y <= 60; y++) {
    var vv = y / 60;
    var px = st.x + boundaryX(vv, t) * st.w;
    var py = st.y + vv * st.h;
    if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = 'rgba(58,5,0,0.55)';
  ctx.lineWidth = Math.max(1.5, st.w * 0.003);
  ctx.stroke();
}
function draw() {
  size();
  ctx.fillStyle = MARIGOLD;
  ctx.fillRect(0, 0, VW, VH);
  /* turbulence is anchored to the FRAME, not the centered square stage:
     the block always spans from its wobbling boundary to the right edge of
     the viewport, occupying about a third of the full frame width. */
  var fr = { x: 0, y: 0, w: VW, h: VH };
  drawTurbulence(fr, phaseT);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Intrusion').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Intrusion').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 30').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Intrusion', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 30', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap to reseed the intrusion.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function onTap(e) {
  originIdx = (originIdx + 1) % ORIGINS.length;
  buildLattice(ORIGINS[originIdx].seed);
  draw();
  if (e && e.preventDefault) e.preventDefault();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    coverage: function () { return COVERAGE; },
    octaves: function () { return OCTAVES; },
    origin: function () { return originIdx; },
    reseed: function () { onTap(null); return originIdx; },
    phaseT: function () { return phaseT; }
  };
  canvas.addEventListener('pointerdown', onTap);
}
/* ---- frame one: fixed phase t = 3.0s of a 24s period, origin 0 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
