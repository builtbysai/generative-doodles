<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scale Loom · №8958</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #171310;
    overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 70vw;
    font: 400 13px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(232, 222, 200, 0.62); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 ui-rounded, system-ui, sans-serif;
    color: rgba(232, 222, 200, 0.35);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cap">One generator walks through unfamiliar tunings; every rung of the ladder re-segments as it passes. Drag up or down to turn the generator yourself. Tap for new colors.</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   Scale Loom - No.8958 (2026-07-21)
   Seed 261 (MOS Weaving): the Moments of Symmetry ladder as a
   loom. Each horizontal band is one rung of the ladder (a fixed
   step count); segment widths come from the L/s step pattern of
   a single generator stacked through the octave. The generator
   is animated through unfamiliar values, never the plain 3/2,
   and every band re-segments live, boundaries easing toward
   their new places. The bands never look like any known scale.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 895801;
document.getElementById("seedtag").textContent = "seed " + seed;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

const BG = "#171310";
const HUES = [18, 38, 96, 152, 205, 268, 318]; // ochre rust moss teal indigo plum rose

let W = 0, H = 0, DPR = 1;
let bands = [];
let genT = 0;          // generator animation clock
let manualG = null, manualT = 0;
let rand = null;

const L_W = 1.62, S_W = 1.0; // segment width units

function build() {
  rand = mulberry32(seed);
  bands = [];
  const NB = 15;
  const hue0 = HUES[Math.floor(rand() * HUES.length)];
  for (let i = 0; i < NB; i++) {
    const k = 7 + Math.floor(rand() * 13); // rung step count 7..19
    const hue = (hue0 + i * (137.5 / 3) + rand() * 14) % 360;
    const phase = rand();
    bands.push({
      k, hue, phase,
      cur: null,      // eased boundary positions 0..1
      light: 44 + rand() * 14
    });
  }
}

// Sturmian word: the L/s pattern for generator g, k steps
function pattern(g, k, phase) {
  const bits = [];
  for (let j = 0; j < k; j++) {
    bits.push(Math.floor((j + 1) * g + phase) - Math.floor(j * g + phase) > 0 ? 1 : 0);
  }
  return bits;
}

function targetsFor(b, g, w) {
  const bits = pattern(g, b.k, b.phase);
  const widths = bits.map(bt => bt ? L_W : S_W);
  const total = widths.reduce((a, x) => a + x, 0);
  const t = [0];
  let acc = 0;
  for (const wd of widths) { acc += wd / total; t.push(acc); }
  return { t, bits };
}

function generatorAt(time) {
  // walks 0.60..0.71, never the plain 3/2 (0.585)
  return 0.655 + 0.055 * Math.sin(time * 0.21) + 0.012 * Math.sin(time * 0.53 + 1.7);
}

function layout() {
  const m = Math.min(W, H) * 0.05;
  const top = H * 0.10, bottom = H - (W < 520 ? 104 : Math.max(m * 1.6, 66));
  const bh = (bottom - top) / bands.length;
  const labelW = Math.min(W * 0.24, 132);
  bands.forEach((b, i) => {
    b.x = m + labelW; b.y = top + i * bh + 2;
    b.w = W - (m + labelW) - m; b.h = bh - 4;
    if (!b.cur) {
      b.cur = [];
      for (let j = 0; j <= b.k; j++) b.cur.push(j / b.k);
    } else if (b.cur.length !== b.k + 1) {
      const nc = [];
      for (let j = 0; j <= b.k; j++) nc.push(j / b.k);
      b.cur = nc;
    }
  });
}

function draw(time) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  const g = manualG !== null ? manualG : generatorAt(time);

  // weft: faint vertical threads across the whole field
  ctx.fillStyle = "rgba(232,222,200,0.045)";
  const step = Math.max(18, W / 64);
  for (let x = bands.length ? bands[0].x : 0; x < W; x += step) ctx.fillRect(x, 0, 1, H);

  const fs = Math.max(10, Math.min(W, H) / 52);
  ctx.textBaseline = "middle"; ctx.textAlign = "left";

  for (const b of bands) {
    const { t, bits } = targetsFor(b, g, b.w);
    for (let j = 0; j <= b.k; j++) b.cur[j] += (t[j] - b.cur[j]) * 0.09;
    let nL = 0;
    for (let j = 0; j < b.k; j++) {
      const x0 = b.x + b.cur[j] * b.w, x1 = b.x + b.cur[j + 1] * b.w;
      const isL = bits[j] === 1;
      if (isL) nL++;
      ctx.fillStyle = isL
        ? "hsl(" + b.hue + ",58%," + b.light + "%)"
        : "hsl(" + b.hue + ",42%," + Math.max(14, b.light - 24) + "%)";
      ctx.fillRect(x0 + 0.5, b.y, Math.max(1, x1 - x0 - 1), b.h);
    }
    // rung label
    ctx.fillStyle = "rgba(232,222,200,0.5)";
    ctx.font = "400 " + fs + "px ui-rounded, system-ui, sans-serif";
    ctx.fillText(b.k + ": " + nL + "L " + (b.k - nL) + "s", 14, b.y + b.h / 2);
  }

  // title + generator readout
  const ts = Math.max(18, Math.min(W, H) / 24);
  ctx.fillStyle = "rgba(232,222,200,0.92)";
  ctx.font = "700 " + ts + "px ui-rounded, system-ui, sans-serif";
  ctx.fillText("SCALE LOOM", 14, 34);
  const titleW = ctx.measureText("SCALE LOOM").width;
  ctx.font = "400 " + ts * 0.55 + "px ui-rounded, system-ui, sans-serif";
  ctx.fillStyle = "rgba(232,222,200,0.55)";
  ctx.fillText("generator " + g.toFixed(4) + " of octave", 14 + titleW + 18, 34);
}

let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  if (manualG !== null && performance.now() - manualT > 4000) manualG = null;
  genT += dt;
  draw(genT);
}

let dragY = null;
canvas.addEventListener("pointerdown", function (e) {
  dragY = e.clientY;
  manualT = performance.now();
});
canvas.addEventListener("pointermove", function (e) {
  if (dragY === null) return;
  const dy = (e.clientY - dragY) / H;
  const g0 = manualG !== null ? manualG : generatorAt(genT);
  manualG = Math.min(0.72, Math.max(0.59, g0 - dy * 0.35));
  dragY = e.clientY;
  manualT = performance.now();
});
canvas.addEventListener("pointerup", function (e) {
  const wasDrag = dragY !== null && Math.abs(e.clientY - dragY) > 4;
  dragY = null;
  if (!wasDrag && manualG === null) {
    seed = (seed + 1) >>> 0;
    document.getElementById("seedtag").textContent = "seed " + seed;
    build(); layout();
  }
  manualT = performance.now();
});
canvas.addEventListener("pointercancel", function () { dragY = null; });

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
window.addEventListener("resize", resize);
build();
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
