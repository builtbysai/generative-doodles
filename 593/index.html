<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>31. Mamá</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #FAF7F0; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.593 "31. Mamá" — EXPANSION #72 clara-lagos, block 1 "Treinta y Un Días".
   Her numbered-vignette engine: 31 small cards, one micro-moment per day of
   a child staying over, in order, no skipping. Drag to walk the month,
   tap a card to flip it and see where it was drawn. */

var INK = '#1A1A1A', PAPER = '#FAF7F0', BLUE = '#3E6FA8', CARD = '#FFFEFA';
var HAND = '"Segoe Print","Bradley Hand","Comic Sans MS",cursive';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- seeded RNG ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- viewport ---------- */
var vw = 300, vh = 300, dpr = 1;
function isPhone(){
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0) return mn < 700;
  return vh > vw * 1.15;
}
function resize(){
  var vv = window.visualViewport;
  vw = vv ? vv.width : window.innerWidth;
  vh = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);
resize();

/* ---------- the 31 days (fixed, in order) ---------- */
var PLACES = ['plaza', 'sala de espera', 'café', 'cocina', 'en el colectivo'];
var DAYS = [
  ['Llegada',    'Llegó con la valijita.'],
  ['Limones',    'Limones paraguayos del fondo.'],
  ['Gato',       'El gato vino a saludar.'],
  ['Silencio',   'A veces no hace falta hablar.'],
  ['Escuchar',   'Escuchar también es un juego.'],
  ['Devolver',   'La pelota volvió sola.'],
  ['Desayuno',   'Desayuno sin apuro.'],
  ['Plaza',      'La plaza de siempre.'],
  ['Cartas',     'Me ganó dos veces.'],
  ['Lluvia',     'Llovió y miramos.'],
  ['Cocina',     'Ayudó a revolver.'],
  ['Siesta',     'Siesta corta.'],
  ['Bici',       'Sin rueditas, casi.'],
  ['Mar',        'El mar estaba bravo.'],
  ['Kiosco',     'Una moneda, una golosina.'],
  ['Dibujo',     'Dibujó la casa.'],
  ['Vecinos',    'Saludaron como siempre.'],
  ['Perro',      'El perro de la esquina.'],
  ['Mercado',    'Compramos de más.'],
  ['Cuento',     'El mismo cuento otra vez.'],
  ['Fotos',      'Sacó fotos borrosas.'],
  ['Jardín',     'Plantó algo y esperó.'],
  ['Mate',       'Probó y puso cara.'],
  ['Noche',      'Contamos estrellas.'],
  ['Cumpleaños', 'Cumple del abuelo.'],
  ['Río',        'Tiró piedritas.'],
  ['Cine',       'Se durmió a la mitad.'],
  ['Escribir',   'Escribió una carta.'],
  ['Valija',     'Armó la valija sola.'],
  ['Víspera',    'Mañana viene mamá.'],
  ['Mamá',       'Mamá.']
];

/* ---------- band layout (precomputed) ---------- */
var CARD_W = 150, CARD_H = 198, BIG_W = 196, BIG_H = 252, BAND_Y = 428;
var cards = [];
(function(){
  var rng = mulberry32(593071);
  var x = 0;
  for (var i = 0; i < 31; i++){
    var big = (i === 30);
    if (i > 0) x += 172 + rng() * 26 + (big ? 26 : 0);
    cards.push({
      x: x,
      y: BAND_Y + Math.sin(i * 0.52) * 24 + (rng() - 0.5) * 14,
      rot: Math.sin(i * 0.7) * 0.028 + (rng() - 0.5) * 0.02,
      w: big ? BIG_W : CARD_W,
      h: big ? BIG_H : CARD_H,
      wob: rng() * 10,
      flip: 0, flipT: 0,
      place: PLACES[i % PLACES.length]
    });
  }
})();
var X_MIN = cards[0].x, X_MAX = cards[30].x;

/* ---------- tiny drawing primitives (scene box: x -50..50, y -43..43) ---------- */
function L(x1, y1, x2, y2, w){ ctx.lineWidth = w || 3; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function C(x, y, r, fill){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function A(x, y, r, a0, a1){ ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke(); }
function E(x, y, rx, ry, fill){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function R(x, y, w, h){ ctx.strokeRect(x, y, w, h); }
function W3(y, amp, ph){ /* wavy line across the box */
  ctx.beginPath();
  for (var x = -46; x <= 46; x += 4){
    var yy = y + Math.sin(x * 0.16 + ph) * amp;
    if (x === -46) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
  }
  ctx.stroke();
}
function fig(x, y, s, pose){ /* simple standing figure, feet at y+30*s */
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  C(0, -22, 7.5);
  L(0, -14, 0, 12);
  if (pose === 'open'){ L(0, -6, -15, -16); L(0, -6, 15, -16); }
  else if (pose === 'wave'){ L(0, -6, -10, 4); L(0, -6, 13, -18); }
  else if (pose === 'run'){ L(0, -6, -13, 0); L(0, -6, 12, -2); }
  else { L(0, -6, -10, 6); L(0, -6, 10, 6); }
  if (pose === 'run'){ L(0, 12, -11, 26); L(0, 12, 13, 22); }
  else { L(0, 12, -7, 30); L(0, 12, 7, 30); }
  ctx.restore();
}
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

/* ---------- the 31 tiny scenes ---------- */
function drawScene(i){
  ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  switch (i){
    case 0: /* Llegada: door + child + suitcase */
      R(-46, -38, 42, 78); C(-11, 2, 2.4, true);
      fig(18, -2, 0.92, 'stand');
      R(28, 22, 21, 14); A(38, 22, 6, Math.PI, Math.PI * 2);
      break;
    case 1: /* Limones: one whole, one cut */
      E(-17, 4, 16, 11.5); C(-25, -3, 1.8, true);
      C(19, 3, 12.5); C(19, 3, 8.5);
      L(19, -5.5, 19, 11.5, 2); L(11.5, 3, 26.5, 3, 2); L(13.5, -2.5, 24.5, 8.5, 2); L(24.5, -2.5, 13.5, 8.5, 2);
      break;
    case 2: /* Gato */
      E(2, 15, 19, 11.5);
      C(-13, -3, 9.5);
      ctx.beginPath(); ctx.moveTo(-20, -9); ctx.lineTo(-19, -19); ctx.lineTo(-12, -12); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-7, -11); ctx.lineTo(-4, -20); ctx.lineTo(0, -11); ctx.closePath(); ctx.stroke();
      A(24, 2, 12, -0.4, 1.7);
      L(-22, 0, -30, -2, 2); L(-22, 4, -30, 5, 2);
      C(-16, -4, 1.5, true); C(-9, -4, 1.5, true);
      break;
    case 3: /* Silencio: two figures on a step */
      L(-47, 24, 47, 24); L(-47, 38, 47, 38); L(47, 24, 47, 38, 2);
      C(-17, -6, 7.5); L(-17, 2, -17, 16); L(-17, 16, -4, 24); L(-17, 16, -28, 24);
      C(15, -6, 7.5); L(15, 2, 15, 16); L(15, 16, 28, 24); L(15, 16, 4, 24);
      L(-17, 6, -8, 14, 2.4); L(15, 6, 7, 14, 2.4);
      break;
    case 4: /* Escuchar: head, ear, shell */
      C(-14, -2, 20);
      A(-8, -2, 6, -1.2, 1.2);
      ctx.beginPath(); ctx.moveTo(2, 12); ctx.quadraticCurveTo(18, 20, 28, 12); ctx.stroke();
      A(35, 2, 10, Math.PI * 0.75, Math.PI * 1.9); A(35, 2, 6.5, Math.PI * 0.75, Math.PI * 1.9); A(35, 2, 3, Math.PI * 0.75, Math.PI * 1.9);
      L(25, 10, 45, 10, 2.4); L(28, 4, 44, 0, 2);
      break;
    case 5: /* Devolver: fence + blue ball over it */
      L(-47, 10, 47, 10); L(-47, 26, 47, 26);
      L(-36, 0, -36, 40); L(-2, 0, -2, 40); L(32, 0, 32, 40);
      ctx.strokeStyle = BLUE; C(-4, -24, 7.5); ctx.strokeStyle = INK;
      ctx.setLineDash([3, 5]); A(6, 6, 34, Math.PI * 1.15, Math.PI * 1.75); ctx.setLineDash([]);
      break;
    case 6: /* Desayuno: cup + medialuna */
      R(-38, -6, 32, 20); A(-3, 4, 7, -Math.PI / 2, Math.PI / 2);
      L(-44, 22, 2, 22); L(-30, -14, -30, -20, 2.4); L(-18, -14, -16, -21, 2.4);
      A(24, 8, 13, Math.PI * 0.15, Math.PI * 1.05); A(24, 13, 13, Math.PI * 1.15, Math.PI * 0.1);
      break;
    case 7: /* Plaza: slide */
      L(-34, -28, -34, 38); L(-22, -28, -22, 38); L(-34, -16, -22, -16, 2.4); L(-34, -2, -22, -2, 2.4);
      L(-34, -28, 38, 26, 4); L(38, 26, 44, 26, 3);
      L(-47, 38, 47, 38);
      break;
    case 8: /* Cartas: two playing cards */
      ctx.save(); ctx.translate(-14, 0); ctx.rotate(-0.12); R(-15, -20, 30, 40);
      C(-5, -8, 2.6, true); C(5, 8, 2.6, true); ctx.restore();
      ctx.save(); ctx.translate(15, 2); ctx.rotate(0.14); R(-15, -20, 30, 40);
      ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(6, 0); ctx.lineTo(0, 9); ctx.lineTo(-6, 0); ctx.closePath(); ctx.stroke(); ctx.restore();
      break;
    case 9: /* Lluvia: window + rain */
      R(-27, -32, 54, 48); L(0, -32, 0, 16, 2.4); L(-27, -8, 27, -8, 2.4);
      L(-36, 26, -30, 36, 2.2); L(-16, 26, -10, 36, 2.2); L(4, 26, 10, 36, 2.2); L(24, 26, 30, 36, 2.2);
      break;
    case 10: /* Cocina: pot + steam */
      R(-25, 0, 50, 25); L(-31, 0, 31, 0, 3.6);
      L(-25, 8, -33, 8, 3); L(25, 8, 33, 8, 3);
      ctx.beginPath(); ctx.moveTo(-12, -10); ctx.quadraticCurveTo(-17, -18, -12, -27); ctx.quadraticCurveTo(-8, -34, -12, -38); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, -10); ctx.quadraticCurveTo(5, -18, 10, -27); ctx.quadraticCurveTo(14, -34, 10, -38); ctx.stroke();
      L(-31, 34, 31, 34, 2.4);
      break;
    case 11: /* Siesta: hammock */
      L(-40, -32, -40, 38); L(40, -32, 40, 38); L(-47, 38, 47, 38);
      ctx.beginPath(); ctx.moveTo(-40, -26); ctx.quadraticCurveTo(0, 26, 40, -26); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-40, -18); ctx.quadraticCurveTo(0, 30, 40, -18); ctx.stroke();
      C(-6, -4, 6.5);
      break;
    case 12: /* Bici */
      C(-22, 16, 11.5); C(24, 16, 11.5);
      L(-22, 16, -2, -8); L(-2, -8, 24, 16); L(-2, -8, 2, 16); L(2, 16, -22, 16); L(2, 16, 24, 16, 2.2);
      L(-6, -13, 4, -13); L(20, -12, 27, -8, 2.4); L(24, 16, 22, -10, 2.4);
      L(-47, 34, 47, 34, 2.2);
      break;
    case 13: /* Mar: waves + blue bucket */
      ctx.lineWidth = 3; W3(-24, 3.4, 0); W3(-8, 3.4, 2); W3(8, 3.4, 4);
      ctx.strokeStyle = BLUE;
      ctx.beginPath(); ctx.moveTo(12, 18); ctx.lineTo(36, 18); ctx.lineTo(33, 36); ctx.lineTo(15, 36); ctx.closePath(); ctx.stroke();
      A(24, 18, 10, Math.PI, Math.PI * 2);
      ctx.strokeStyle = INK;
      break;
    case 14: /* Kiosco: candy jar */
      rr(-17, -24, 34, 46, 7); ctx.stroke();
      L(-20, -24, 20, -24, 3.6); L(-12, -31, 12, -31, 3);
      C(-7, 8, 4.4); C(6, 2, 4.4); C(-2, 15, 4.4); C(9, 13, 4); C(-10, -3, 4);
      L(-24, 30, 24, 30, 2.4);
      break;
    case 15: /* Dibujo: pencil + scribble */
      ctx.save(); ctx.translate(-6, -4); ctx.rotate(0.7);
      R(-6, -26, 12, 38); ctx.beginPath(); ctx.moveTo(-6, 12); ctx.lineTo(0, 24); ctx.lineTo(6, 12); ctx.closePath(); ctx.stroke();
      L(-6, -18, 6, -18, 2.2); ctx.restore();
      ctx.beginPath(); ctx.moveTo(-38, 30); ctx.quadraticCurveTo(-20, 18, -6, 29); ctx.quadraticCurveTo(8, 39, 22, 27); ctx.quadraticCurveTo(32, 20, 40, 28); ctx.stroke();
      break;
    case 16: /* Vecinos: hands over a fence */
      L(-47, 14, 47, 14); L(-47, 28, 47, 28);
      L(-30, -2, -30, 14); L(-30, -2, -38, -8, 2.6); L(-30, -2, -30, -12, 2.6); L(-30, -2, -22, -9, 2.6);
      L(28, 0, 28, 14); L(28, 0, 20, -10, 2.6); L(28, 0, 28, -14, 2.6); L(28, 0, 36, -11, 2.6);
      A(-30, -20, 8, Math.PI * 1.1, Math.PI * 1.7); A(28, -22, 8, Math.PI * 1.3, Math.PI * 1.9);
      break;
    case 17: /* Perro */
      E(-4, 6, 20, 10.5);
      C(17, -4, 8.5);
      ctx.beginPath(); ctx.moveTo(13, -10); ctx.lineTo(10, -19); ctx.lineTo(19, -13); ctx.closePath(); ctx.stroke();
      A(-25, -2, 9, Math.PI * 0.9, Math.PI * 1.8);
      L(-16, 14, -16, 28); L(-6, 15, -6, 28); L(6, 15, 6, 28); L(15, 13, 15, 28);
      C(20, -5, 1.5, true);
      break;
    case 18: /* Mercado: bag with greens */
      ctx.beginPath(); ctx.moveTo(-19, -4); ctx.lineTo(19, -4); ctx.lineTo(15, 34); ctx.lineTo(-15, 34); ctx.closePath(); ctx.stroke();
      A(-10, -10, 8, Math.PI * 0.9, Math.PI * 1.95); A(2, -13, 9, Math.PI * 1.0, Math.PI * 2.0); A(13, -9, 7.5, Math.PI * 0.95, Math.PI * 1.9);
      L(-8, 10, 8, 10, 2.2);
      break;
    case 19: /* Cuento: open book */
      ctx.beginPath(); ctx.moveTo(0, -16); ctx.quadraticCurveTo(-24, -24, -42, -16); ctx.lineTo(-42, 20); ctx.quadraticCurveTo(-24, 12, 0, 20); ctx.quadraticCurveTo(24, 12, 42, 20); ctx.lineTo(42, -16); ctx.quadraticCurveTo(24, -24, 0, -16); ctx.stroke();
      L(0, -16, 0, 20, 2.2);
      L(-34, -6, -10, -10, 2); L(-34, 4, -10, 0, 2); L(10, -10, 34, -6, 2); L(10, 0, 34, 4, 2);
      break;
    case 20: /* Fotos: camera */
      R(-27, -13, 54, 30); R(-8, -21, 16, 8);
      C(0, 2, 10); C(0, 2, 5.5);
      C(19, -7, 2.2, true); L(-27, 24, 27, 24, 2.2);
      break;
    case 21: /* Jardín: seedling */
      L(-44, 26, 44, 26); A(0, 34, 20, Math.PI * 1.15, Math.PI * 1.85);
      L(0, 26, 0, -2);
      ctx.beginPath(); ctx.moveTo(0, -2); ctx.quadraticCurveTo(-16, -6, -17, -20); ctx.quadraticCurveTo(-4, -18, 0, -6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.quadraticCurveTo(15, -13, 16, -26); ctx.quadraticCurveTo(3, -23, 0, -11); ctx.stroke();
      break;
    case 22: /* Mate */
      ctx.beginPath(); ctx.moveTo(-15, -8); ctx.lineTo(15, -8); ctx.lineTo(11, 20); ctx.quadraticCurveTo(0, 27, -11, 20); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, -8, 15, 4.4, 0, 0, Math.PI * 2); ctx.stroke();
      L(4, -6, 20, -30, 3.4); C(21, -32, 2.6);
      L(-18, 33, 18, 33, 2.2);
      break;
    case 23: /* Noche: moon + star */
      A(-10, 0, 19, Math.PI * 0.32, Math.PI * 1.68); A(-3, -3, 15, Math.PI * 1.55, Math.PI * 0.45);
      ctx.beginPath(); ctx.moveTo(28, -22); ctx.lineTo(31, -13); ctx.lineTo(40, -10); ctx.lineTo(31, -7); ctx.lineTo(28, 2); ctx.lineTo(25, -7); ctx.lineTo(16, -10); ctx.lineTo(25, -13); ctx.closePath(); ctx.stroke();
      C(30, 22, 1.8, true); C(-32, -24, 1.8, true);
      break;
    case 24: /* Cumpleaños: cake + one candle */
      R(-25, 4, 50, 20); L(-25, 12, 25, 12, 2.2);
      L(0, 4, 0, -12, 3);
      ctx.beginPath(); ctx.moveTo(0, -24); ctx.quadraticCurveTo(5, -16, 0, -12); ctx.quadraticCurveTo(-5, -16, 0, -24); ctx.stroke();
      L(-33, 32, 33, 32, 2.2);
      break;
    case 25: /* Río: waves + stone */
      ctx.lineWidth = 3; W3(-18, 3.2, 1); W3(-2, 3.2, 3); W3(14, 3.2, 5);
      E(17, 22, 10, 5.5);
      ctx.setLineDash([3, 5]); A(-2, 26, 26, Math.PI * 1.2, Math.PI * 1.65); ctx.setLineDash([]);
      break;
    case 26: /* Cine: two tickets */
      ctx.save(); ctx.translate(-13, 0); ctx.rotate(-0.1); R(-16, -12, 32, 24);
      L(-6, -12, -6, 12, 2); ctx.setLineDash([2, 4]); L(-6, -12, -6, 12, 2); ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(6, -5); ctx.lineTo(8, -1); ctx.lineTo(12, -1); ctx.lineTo(9, 2); ctx.lineTo(10, 6); ctx.lineTo(6, 3.4); ctx.lineTo(2, 6); ctx.lineTo(3, 2); ctx.lineTo(0, -1); ctx.lineTo(4, -1); ctx.closePath(); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.translate(16, 4); ctx.rotate(0.16); R(-15, -11, 30, 22); L(-5, -11, -5, 11, 2); ctx.restore();
      break;
    case 27: /* Escribir: envelope */
      R(-27, -16, 54, 33);
      ctx.beginPath(); ctx.moveTo(-27, -16); ctx.lineTo(0, 4); ctx.lineTo(27, -16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-27, 17); ctx.lineTo(-6, 0); ctx.moveTo(27, 17); ctx.lineTo(6, 0); ctx.stroke();
      break;
    case 28: /* Valija: closed suitcase */
      R(-27, -12, 54, 29); A(0, -12, 8, Math.PI, Math.PI * 2);
      L(-12, -12, -12, 17, 2.6); L(12, -12, 12, 17, 2.6);
      L(-27, 25, 27, 25, 2.2);
      break;
    case 29: /* Víspera: the door, evening */
      R(-18, -34, 40, 68); C(15, 2, 2.4, true);
      A(33, -26, 7, Math.PI * 0.35, Math.PI * 1.65); A(36, -28, 5.4, Math.PI * 1.55, Math.PI * 0.45);
      C(-32, -20, 1.7, true); C(-26, 22, 1.7, true);
      L(-30, 40, 36, 40, 2.4);
      break;
    case 30: /* Mamá: mother arms open, child running to her */
      fig(-20, -4, 1.18, 'open');
      fig(26, 8, 0.8, 'run');
      L(-2, -18, 4, -22, 2.2); L(0, -8, 7, -11, 2.2);
      break;
  }
}

/* ---------- card painting ---------- */
function paintCardFront(cd, i){
  ctx.fillStyle = CARD;
  rr(-cd.w / 2, -cd.h / 2, cd.w, cd.h, 7); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.stroke();
  /* number, prominent, top-left */
  ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.save();
  ctx.translate(-cd.w / 2 + 13, -cd.h / 2 + 40);
  ctx.rotate(-0.04 + cd.wob * 0.004);
  ctx.font = '700 35px ' + HAND;
  var numStr = String(i + 1) + '.';
  ctx.fillText(numStr, 0, 0);
  var numW = ctx.measureText(numStr).width;
  ctx.restore();
  /* title word, set after the number however wide it runs */
  var word = DAYS[i][0];
  ctx.font = (word.length > 8 ? 16 : 18.5) + 'px ' + HAND;
  ctx.fillText(word, -cd.w / 2 + 22 + numW, -cd.h / 2 + 39);
  /* divider tick */
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
  L(-cd.w / 2 + 12, -cd.h / 2 + 52, cd.w / 2 - 12, -cd.h / 2 + 52, 1.6);
  /* the tiny scene */
  ctx.save();
  ctx.translate(0, cd.h * 0.13);
  var sc = (cd.w - 26) / 100;
  ctx.scale(sc, sc);
  drawScene(i);
  ctx.restore();
}
function paintCardBack(cd, i){
  ctx.fillStyle = PAPER;
  rr(-cd.w / 2, -cd.h / 2, cd.w, cd.h, 7); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.strokeStyle = 'rgba(26,26,26,0.22)'; ctx.lineWidth = 1.2;
  for (var y = -cd.h / 2 + 34; y < cd.h / 2 - 16; y += 21) L(-cd.w / 2 + 12, y, cd.w / 2 - 12, y, 1.2);
  ctx.fillStyle = INK; ctx.textAlign = 'center';
  ctx.font = '15px ' + HAND;
  ctx.fillText('dibujada en', 0, -cd.h / 2 + 62);
  ctx.font = '700 21px ' + HAND;
  ctx.fillText(cd.place, 0, -cd.h / 2 + 94);
  ctx.font = '15px ' + HAND;
  ctx.fillText('día ' + (i + 1) + ' de 31', 0, cd.h / 2 - 24);
  ctx.textAlign = 'left';
}
function paintCard(cd, i, viewX, lift){
  var sx = 500 + (cd.x - viewX);
  if (sx < -cd.w || sx > 1000 + cd.w) return;
  var prox = Math.max(0, 1 - Math.abs(sx - 500) / 210);
  var sc = 1 + 0.07 * prox;
  ctx.save();
  ctx.translate(sx, cd.y - 13 * prox + lift);
  ctx.rotate(cd.rot);
  ctx.scale(sc, sc);
  /* shadow */
  ctx.fillStyle = 'rgba(26,26,26,' + (0.10 + 0.10 * prox) + ')';
  rr(-cd.w / 2 + 6, -cd.h / 2 + 9, cd.w, cd.h, 7); ctx.fill();
  /* flip: width follows |cos|; the back is drawn unmirrored once past halfway */
  var cosv = Math.cos(cd.flip * Math.PI);
  var fx = Math.abs(cosv); if (fx < 0.02) fx = 0.02;
  ctx.scale(fx, 1);
  if (cosv >= 0) paintCardFront(cd, i); else paintCardBack(cd, i);
  ctx.restore();
}

/* ---------- state ---------- */
var PHASE0 = 0;
var viewX = X_MIN, viewTarget = X_MIN;
var centerIdx = 0, typeStart = -1e9;
var lastInteract = -1e9, driftDir = 1;
var dragging = false, dragMoved = 0, downX = 0, downT = 0, startTarget = X_MIN, lastFrameT = 0;

function nowMs(){ return (typeof performance !== 'undefined' && performance.now) ? performance.now() - t0ref() : 0; }
var _t0 = null;
function t0ref(){ if (_t0 === null) _t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0; return _t0; }

/* ---------- main draw ---------- */
function draw(now){
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, vw, vh);
  var scale = Math.min(vw, vh) / 1000;
  var ox = (vw - 1000 * scale) / 2, oy = (vh - 1000 * scale) / 2;
  ctx.translate(ox, oy); ctx.scale(scale, scale);

  /* notebook ground: faint ruled lines + margin line */
  ctx.strokeStyle = 'rgba(26,26,26,0.055)'; ctx.lineWidth = 1.4;
  for (var y = 66; y < 1000; y += 46){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1000, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(62,111,168,0.10)';
  ctx.beginPath(); ctx.moveTo(0, 856); ctx.lineTo(1000, 856); ctx.stroke();

  /* header */
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '26px ' + HAND;
  ctx.globalAlpha = 0.75;
  ctx.fillText('treinta y un días, una visita', 500, 108);
  ctx.globalAlpha = 1;

  /* the band: far cards first so the centered one sits on top */
  var order = cards.map(function(_, i){ return i; });
  order.sort(function(a, b){ return Math.abs(cards[b].x - viewX) - Math.abs(cards[a].x - viewX); });
  for (var k = 0; k < order.length; k++) paintCard(cards[order[k]], order[k], viewX, 0);

  /* caption of the centered card, typewriter */
  var cap = DAYS[centerIdx][1];
  var n = Math.max(0, Math.min(cap.length, Math.floor((now - typeStart) / 30)));
  ctx.font = '25px ' + HAND;
  ctx.fillStyle = INK;
  ctx.fillText(cap.substring(0, n), 500, 792);
  ctx.font = '16.5px ' + HAND;
  ctx.globalAlpha = 0.62;
  ctx.fillText((centerIdx + 1) + '. ' + DAYS[centerIdx][0], 500, 758);
  ctx.globalAlpha = 1;

  /* hint */
  ctx.font = '16px ' + HAND;
  ctx.fillStyle = INK; ctx.globalAlpha = 0.45; ctx.textAlign = 'right';
  ctx.fillText('drag · tap', 978, 962);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

function frame(){
  var now = nowMs();
  var dt = Math.min(0.05, Math.max(0.001, (now - lastFrameT) / 1000 || 0.016));
  lastFrameT = now;
  /* idle auto-drift through the month, ping-pong at the ends */
  if (!dragging && now - lastInteract > 4000){
    viewTarget += driftDir * 26 * dt;
    if (viewTarget >= X_MAX){ viewTarget = X_MAX; driftDir = -1; }
    if (viewTarget <= X_MIN){ viewTarget = X_MIN; driftDir = 1; }
  }
  viewTarget = Math.max(X_MIN - 60, Math.min(X_MAX + 60, viewTarget));
  viewX += (viewTarget - viewX) * Math.min(1, dt * 7);
  if (Math.abs(viewTarget - viewX) < 0.05) viewX = viewTarget;
  /* centered card + typewriter restart */
  var best = 0, bd = 1e9;
  for (var i = 0; i < 31; i++){ var d = Math.abs(cards[i].x - viewX); if (d < bd){ bd = d; best = i; } }
  if (best !== centerIdx){ centerIdx = best; typeStart = now; }
  /* flips ease */
  for (i = 0; i < 31; i++){
    var cd = cards[i];
    if (cd.flip !== cd.flipT){
      var step = dt * 2.6;
      cd.flip = cd.flip < cd.flipT ? Math.min(cd.flipT, cd.flip + step) : Math.max(cd.flipT, cd.flip - step);
    }
  }
  draw(PHASE0 + now);
}
draw(PHASE0);   /* synchronous first frame: day 1 centered, caption complete */
if (typeof requestAnimationFrame === 'function'){
  var loop = function(){ frame(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

/* ---------- interaction ---------- */
function toStage(px, py){
  var scale = Math.min(vw, vh) / 1000;
  return [ (px - (vw - 1000 * scale) / 2) / scale, (py - (vh - 1000 * scale) / 2) / scale ];
}
canvas.addEventListener('pointerdown', function(e){
  dragging = true; dragMoved = 0;
  downX = e.clientX; downT = nowMs(); startTarget = viewTarget;
  lastInteract = nowMs();
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch(_){} }
});
canvas.addEventListener('pointermove', function(e){
  if (!dragging) return;
  var scale = Math.min(vw, vh) / 1000;
  var dxs = (e.clientX - downX) / scale;
  dragMoved = Math.max(dragMoved, Math.abs(dxs));
  viewTarget = Math.max(X_MIN - 60, Math.min(X_MAX + 60, startTarget - dxs));
  lastInteract = nowMs();
  if (typeof requestAnimationFrame !== 'function') frame();
});
function endPointer(e){
  if (!dragging) return;
  dragging = false;
  lastInteract = nowMs();
  var quick = nowMs() - downT < 450;
  if (quick && dragMoved < 9){
    var p = toStage(e.clientX, e.clientY);
    /* nearest card whose box contains the tap */
    var hit = -1;
    for (var i = 0; i < 31; i++){
      var cd = cards[i];
      var sx = 500 + (cd.x - viewX);
      if (Math.abs(p[0] - sx) <= cd.w / 2 + 6 && Math.abs(p[1] - cd.y) <= cd.h / 2 + 6) hit = i;
    }
    if (hit >= 0){
      cards[hit].flipT = cards[hit].flipT > 0.5 ? 0 : 1;
      viewTarget = cards[hit].x;   /* and bring it to the center */
      if (typeof requestAnimationFrame !== 'function') frame();
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ dragging = false; });
</script>
</body>
