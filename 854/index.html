<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№854 Paradise Plot</title>
<style>
  html, body { margin: 0; padding: 0; background: #a9c48d; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №854 Paradise Plot, IA8 / PP1254, study #261 iso-attrill.
  // A small garden plot at the center of the frame. Plants grow
  // slowly; foraged objects (fungus, shells, seeds) appear and
  // arrange themselves around the bed. No human figure: the plot
  // is the portrait. Watch-only, with gentle DRAG to move the sun
  // across the plot. Growth is slow and continuous.
  var GROUND = '#a9c48d'; // page ground, the soft out-of-focus green

  // Fixed-phase first frame: FIRST_T = 15 s into a 120 s cycle.
  // Growth, object drift and the sun's loop path are all closed-form
  // functions of t, so frame one is fully deterministic. Drag adds an
  // offset to the sun; on release it eases back to the loop path.
  var FIRST_T = 15;
  var CYCLE = 120;
  var SEED = 854;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: soil brown, leaf green, flower accents, daylight.
  var SOIL = [96, 66, 42];
  var SOIL_DARK = [70, 46, 28];
  var SOIL_LIGHT = [124, 90, 58];
  var LEAF = [74, 122, 52];
  var LEAF_DARK = [52, 92, 38];
  var LEAF_LIGHT = [110, 160, 76];
  var STEM = [58, 96, 40];
  var BLOOM_PINK = [226, 138, 158];
  var BLOOM_YELLOW = [240, 196, 84];
  var BLOOM_WHITE = [244, 238, 224];
  var BLOOM_ORANGE = [228, 138, 62];
  var SUN_CORE = [252, 226, 130];
  var SUN_GLOW = [246, 200, 90];
  var MUSH_CAP = [176, 92, 62];
  var MUSH_CREAM = [238, 222, 196];
  var SHELL = [232, 214, 182];
  var SHELL_LINE = [178, 142, 108];
  var SEED = [88, 60, 36];
  var CAPTION = [46, 58, 34];
  var HINT = [46, 58, 34];
  var BLUR_DARK = [92, 128, 66];
  var BLUR_LIGHT = [178, 204, 140];
  var BLUR_MID = [132, 168, 96];

  // ---- Fixed plant table: 9 plants in three rows on the bed -------
  // x,y are bed fractions (bed spans 0.20-0.80 x, 0.50-0.84 y);
  // kind: 0 leafy stem, 1 flower; ph staggers the growth cycle.
  var plantRng = mulberry32(SEED * 17 + 3);
  var PLANTS = [];
  var PLANT_SPOTS = [
    { bx: 0.28, by: 0.14, kind: 1, bloom: BLOOM_PINK },
    { bx: 0.44, by: 0.10, kind: 0 },
    { bx: 0.60, by: 0.15, kind: 1, bloom: BLOOM_YELLOW },
    { bx: 0.72, by: 0.11, kind: 0 },
    { bx: 0.35, by: 0.48, kind: 0 },
    { bx: 0.52, by: 0.44, kind: 1, bloom: BLOOM_WHITE },
    { bx: 0.66, by: 0.50, kind: 0 },
    { bx: 0.24, by: 0.72, kind: 1, bloom: BLOOM_ORANGE },
    { bx: 0.58, by: 0.74, kind: 1, bloom: BLOOM_PINK }
  ];
  var pi;
  for (pi = 0; pi < PLANT_SPOTS.length; pi++) {
    var s = PLANT_SPOTS[pi];
    PLANTS.push({
      bx: s.bx, by: s.by, kind: s.kind, bloom: s.bloom || null,
      ph: plantRng() * Math.PI * 2,
      lean: (plantRng() - 0.5) * 0.10,
      hMax: 0.10 + plantRng() * 0.07,
      leaves: 3 + Math.floor(plantRng() * 3)
    });
  }

  // Growth factor for plant i at time t: slow sine over the 120 s
  // cycle, between 0.55 and 1.0, staggered by phase.
  function growthOf(p, t) {
    return 0.775 + 0.225 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE + p.ph);
  }

  // ---- Fixed foraged-object table: 8 objects around the bed -------
  // kind: 0 mushroom, 1 shell, 2 seed. drift is the slow-drift
  // amplitude in stage fractions; appear staggers their arrival.
  var objRng = mulberry32(SEED * 31 + 7);
  var OBJECTS = [];
  var OBJ_SPOTS = [
    { x: 0.155, y: 0.60, kind: 0, s: 1.00 },
    { x: 0.845, y: 0.56, kind: 0, s: 0.85 },
    { x: 0.120, y: 0.78, kind: 1, s: 1.00 },
    { x: 0.875, y: 0.74, kind: 1, s: 1.15 },
    { x: 0.220, y: 0.90, kind: 2, s: 1.00 },
    { x: 0.790, y: 0.90, kind: 2, s: 1.00 },
    { x: 0.500, y: 0.905, kind: 2, s: 0.85 },
    { x: 0.860, y: 0.40, kind: 2, s: 0.9 }
  ];
  var oi;
  for (oi = 0; oi < OBJ_SPOTS.length; oi++) {
    var o = OBJ_SPOTS[oi];
    OBJECTS.push({
      x: o.x, y: o.y, kind: o.kind, s: o.s,
      ph: objRng() * Math.PI * 2,
      drift: 0.008 + objRng() * 0.012,
      rot: (objRng() - 0.5) * 0.6
    });
  }

  // Object presence at time t: fades in and out slowly, staggered.
  function appearOf(o, t) {
    return smooth(0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE + o.ph));
  }
  function driftOf(o, t) {
    return {
      x: o.x + o.drift * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE + o.ph),
      y: o.y + o.drift * 0.6 * Math.cos(2 * Math.PI * (t - FIRST_T) / CYCLE + o.ph * 1.3)
    };
  }

  // ---- Soft out-of-focus green blobs for the surround --------------
  var blobRng = mulberry32(SEED * 7 + 1);
  var BLOBS = [];
  var bi;
  for (bi = 0; bi < 14; bi++) {
    BLOBS.push({
      x: blobRng(), y: blobRng(),
      r: 0.10 + blobRng() * 0.16,
      c: blobRng() > 0.5 ? BLUR_LIGHT : BLUR_MID,
      a: 0.25 + blobRng() * 0.30,
      ph: blobRng() * Math.PI * 2
    });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Bed geometry in stage fractions. On phones the bed widens to
  // fill the full-bleed stage; on desktop it stays a centered plot.
  function bedRect() {
    return isPhone
      ? { x0: 0.07, y0: 0.50, x1: 0.93, y1: 0.86 }
      : { x0: 0.20, y0: 0.50, x1: 0.80, y1: 0.86 };
  }
  function X(f) { return f * W; }
  function Y(f) { return f * H; }

  // ---- Sun: loop path plus drag offset ------------------------------
  // Loop path: a slow arc across the top of the frame, 120 s cycle.
  var dragX = 0, dragY = 0;       // stage fractions, eased to 0 on release
  var dragging = false;
  var dragLastX = 0, dragLastY = 0;
  function sunBase(t) {
    var u = (t - FIRST_T) / CYCLE;
    return {
      x: 0.50 + 0.30 * Math.sin(2 * Math.PI * u),
      y: 0.15 + 0.035 * Math.cos(2 * Math.PI * u)
    };
  }
  function sunPos(t) {
    var b = sunBase(t);
    return {
      x: clamp(b.x + dragX, 0.06, 0.94),
      y: clamp(b.y + dragY, 0.06, 0.42)
    };
  }

  // ---- Surround: soft out-of-focus green ---------------------------
  function drawSurround(t) {
    // Base daylight green.
    ctx.fillStyle = rgb(BLUR_MID);
    ctx.fillRect(0, 0, W, H);
    // Big soft blobs, drifting almost imperceptibly with the cycle.
    var i, b, bx, by;
    for (i = 0; i < BLOBS.length; i++) {
      b = BLOBS[i];
      bx = X(b.x + 0.008 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE + b.ph));
      by = Y(b.y + 0.006 * Math.cos(2 * Math.PI * (t - FIRST_T) / CYCLE + b.ph));
      var r = b.r * W;
      var g = ctx.createRadialGradient(bx, by, 0, bx, by, r);
      g.addColorStop(0, rgba(b.c, a4(b.a)));
      g.addColorStop(1, rgba(b.c, 0));
      ctx.fillStyle = g;
      ctx.fillRect(bx - r, by - r, r * 2, r * 2);
    }
    // A darker soft band low in the frame, like near grass in shade.
    var dg = ctx.createLinearGradient(0, Y(0.86), 0, H);
    dg.addColorStop(0, rgba(BLUR_DARK, 0));
    dg.addColorStop(1, rgba(BLUR_DARK, a4(0.35)));
    ctx.fillStyle = dg;
    ctx.fillRect(0, Y(0.86), W, H - Y(0.86));
  }

  // ---- Sun and daylight ---------------------------------------------
  function drawSun(t) {
    var s = sunPos(t);
    var sx = X(s.x), sy = Y(s.y);
    var sr = 0.038 * W;
    var glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 5);
    glow.addColorStop(0, rgba(SUN_GLOW, a4(0.5)));
    glow.addColorStop(0.5, rgba(SUN_GLOW, a4(0.16)));
    glow.addColorStop(1, rgba(SUN_GLOW, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(sx - sr * 5, sy - sr * 5, sr * 10, sr * 10);
    ctx.fillStyle = rgb(SUN_CORE);
    ctx.beginPath();
    ctx.moveTo(sx + sr, sy);
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
    // Daylight wash over the whole frame, strongest near the sun.
    var wash = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * 0.9);
    wash.addColorStop(0, rgba([255, 244, 200], a4(0.10)));
    wash.addColorStop(1, rgba([255, 244, 200], 0));
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- The bed -------------------------------------------------------
  function drawBed() {
    var BED = bedRect();
    var bx0 = X(BED.x0), by0 = Y(BED.y0), bx1 = X(BED.x1), by1 = Y(BED.y1);
    var bw = bx1 - bx0, bh = by1 - by0;
    // Soft shadow under the bed, then the soil slab with a rounded top.
    ctx.fillStyle = rgba(SOIL_DARK, a4(0.35));
    ctx.beginPath();
    ctx.moveTo(bx0 + W * 0.008, by1 + H * 0.008);
    ctx.lineTo(bx1 + W * 0.008, by1 + H * 0.008);
    ctx.lineTo(bx1 + W * 0.008, by0 + bh * 0.35);
    ctx.lineTo(bx0 + W * 0.008, by0 + bh * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb(SOIL);
    ctx.beginPath();
    ctx.moveTo(bx0, by1);
    ctx.lineTo(bx0, by0 + bh * 0.30);
    ctx.quadraticCurveTo(bx0 + bw / 2, by0 - bh * 0.06, bx1, by0 + bh * 0.30);
    ctx.lineTo(bx1, by1);
    ctx.closePath();
    ctx.fill();
    // Furrows: three soft darker rows across the bed.
    var r;
    for (r = 0; r < 3; r++) {
      var fy = by0 + bh * (0.30 + r * 0.26);
      ctx.fillStyle = rgba(SOIL_DARK, a4(0.30));
      ctx.beginPath();
      ctx.moveTo(bx0 + bw * 0.03, fy);
      ctx.quadraticCurveTo(bx0 + bw / 2, fy + bh * 0.05, bx1 - bw * 0.03, fy);
      ctx.lineTo(bx1 - bw * 0.03, fy + bh * 0.045);
      ctx.quadraticCurveTo(bx0 + bw / 2, fy + bh * 0.095, bx0 + bw * 0.03, fy + bh * 0.045);
      ctx.closePath();
      ctx.fill();
    }
    // Light soil speckle: fixed dots from the plant seed stream.
    ctx.fillStyle = rgba(SOIL_LIGHT, a4(0.5));
    var speckRng = mulberry32(SEED * 41 + 13);
    var si;
    for (si = 0; si < 40; si++) {
      var sx = bx0 + bw * (0.04 + speckRng() * 0.92);
      var sy = by0 + bh * (0.28 + speckRng() * 0.68);
      ctx.fillRect(sx, sy, Math.max(1, W * 0.002), Math.max(1, W * 0.002));
    }
  }

  // ---- Plants ---------------------------------------------------------
  function drawPlant(p, t, sunXf) {
    var BED = bedRect();
    var bx0 = X(BED.x0), by0 = Y(BED.y0);
    var bw = X(BED.x1) - bx0, bh = Y(BED.y1) - by0;
    var px = bx0 + bw * p.bx;
    var py = by0 + bh * p.by;
    var g = growthOf(p, t);
    var h = p.hMax * H * g;
    var lean = p.lean * W * g;
    // Shadow leans away from the sun.
    var shLen = (0.5 - sunXf) * W * 0.10 * g;
    ctx.fillStyle = rgba(SOIL_DARK, a4(0.30));
    ctx.beginPath();
    ctx.moveTo(px - W * 0.004, py);
    ctx.lineTo(px + W * 0.004, py);
    ctx.lineTo(px + W * 0.004 + shLen, py + H * 0.006);
    ctx.lineTo(px - W * 0.004 + shLen, py + H * 0.006);
    ctx.closePath();
    ctx.fill();
    // Stem, curving gently toward the lean.
    ctx.strokeStyle = rgb(STEM);
    ctx.lineWidth = Math.max(1.5, W * 0.004);
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.quadraticCurveTo(px + lean * 0.4, py - h * 0.6, px + lean, py - h);
    ctx.stroke();
    // Leaves along the stem, alternating sides.
    var li;
    for (li = 0; li < p.leaves; li++) {
      var f = (li + 1) / (p.leaves + 1);
      var lx = px + lean * f;
      var ly = py - h * f;
      var lw = W * 0.016 * g * (1 - f * 0.35);
      var lh = H * 0.010 * g;
      var dir = (li % 2 === 0) ? 1 : -1;
      ctx.fillStyle = rgb(li % 3 === 0 ? LEAF_LIGHT : LEAF);
      ctx.beginPath();
      ctx.moveTo(lx + dir * lw, ly);
      ctx.ellipse(lx + dir * lw * 0.7, ly - lh * 0.4, lw, lh, dir * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // Flower head on blooming plants: petals around a warm centre.
    if (p.kind === 1 && p.bloom) {
      var hx = px + lean, hy = py - h;
      var pr = W * 0.014 * g;
      var pet;
      for (pet = 0; pet < 6; pet++) {
        var ang = pet * Math.PI / 3 + 0.3;
        var pcx = hx + Math.cos(ang) * pr * 1.1;
        var pcy = hy + Math.sin(ang) * pr * 1.1;
        ctx.fillStyle = rgb(p.bloom);
        ctx.beginPath();
        ctx.moveTo(pcx + pr, pcy);
        ctx.arc(pcx, pcy, pr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = rgb(BLOOM_YELLOW);
      ctx.beginPath();
      ctx.moveTo(hx + pr * 0.7, hy);
      ctx.arc(hx, hy, pr * 0.7, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Leafy top: a small crown of leaves.
      var tx = px + lean, ty = py - h;
      ctx.fillStyle = rgb(LEAF_DARK);
      ctx.beginPath();
      ctx.moveTo(tx + W * 0.012, ty);
      ctx.ellipse(tx, ty - H * 0.008, W * 0.012, H * 0.008, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgb(LEAF_LIGHT);
      ctx.beginPath();
      ctx.moveTo(tx - W * 0.012, ty);
      ctx.ellipse(tx, ty - H * 0.008, W * 0.012, H * 0.008, 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Foraged objects -------------------------------------------------
  function drawMushroom(x, y, s, rot, alpha) {
    var r = W * 0.020 * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = a4(alpha);
    // Stem.
    ctx.fillStyle = rgb(MUSH_CREAM);
    ctx.beginPath();
    ctx.moveTo(-r * 0.28, 0);
    ctx.lineTo(r * 0.28, 0);
    ctx.lineTo(r * 0.20, -r * 0.9);
    ctx.lineTo(-r * 0.20, -r * 0.9);
    ctx.closePath();
    ctx.fill();
    // Cap: a half dome with pale spots.
    ctx.fillStyle = rgb(MUSH_CAP);
    ctx.beginPath();
    ctx.moveTo(-r, -r * 0.8);
    ctx.arc(0, -r * 0.8, r, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgba(MUSH_CREAM, a4(0.85));
    ctx.beginPath();
    ctx.moveTo(-r * 0.45 + r * 0.10, -r * 1.25);
    ctx.arc(-r * 0.45, -r * 1.25, r * 0.10, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r * 0.30 + r * 0.08, -r * 1.45);
    ctx.arc(r * 0.30, -r * 1.45, r * 0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function drawShell(x, y, s, rot, alpha) {
    var r = W * 0.022 * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = a4(alpha);
    ctx.fillStyle = rgb(SHELL);
    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.arc(0, 0, r, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba(SHELL_LINE, a4(0.7));
    ctx.lineWidth = Math.max(1, W * 0.0012);
    var i;
    for (i = -2; i <= 2; i++) {
      var a = i * Math.PI / 8;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.sin(a) * r * 0.92, -Math.cos(a) * r * 0.92);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawSeed(x, y, s, rot, alpha) {
    var r = W * 0.010 * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = a4(alpha);
    ctx.fillStyle = rgb(SEED);
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.ellipse(0, 0, r, r * 0.62, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(BLOOM_WHITE, a4(0.7));
    ctx.beginPath();
    ctx.moveTo(-r * 0.2 + r * 0.22, -r * 0.15);
    ctx.arc(-r * 0.2, -r * 0.15, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function drawObjects(t) {
    var i, o, pos, a;
    for (i = 0; i < OBJECTS.length; i++) {
      o = OBJECTS[i];
      a = appearOf(o, t);
      if (a < 0.03) { continue; }
      pos = driftOf(o, t);
      var x = X(pos.x), y = Y(pos.y);
      if (o.kind === 0) { drawMushroom(x, y, o.s, o.rot, a); }
      else if (o.kind === 1) { drawShell(x, y, o.s, o.rot, a); }
      else { drawSeed(x, y, o.s, o.rot, a); }
    }
  }

  // ---- Caption and hint, in the template's place ----------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.85));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№854 · Paradise Plot', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CAPTION, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 14', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(HINT, a4(0.85));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to move the sun.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawSurround(t);
    drawSun(t);
    drawBed();
    var s = sunPos(t);
    var i;
    for (i = 0; i < PLANTS.length; i++) { drawPlant(PLANTS[i], t, s.x); }
    drawObjects(t);
    // Soft vignette, daylight, never HDR.
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45,
      W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, rgba([60, 80, 40], 0));
    vg.addColorStop(1, rgba([60, 80, 40], a4(0.12)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    drawText();
  }

  // ---- Drag: moves the sun; release eases back to the loop path -----
  function pointerPos(e) {
    var rect = { left: stageX, top: stageY };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    var cx = (e.clientX - rect.left) / (rect.width || W);
    var cy = (e.clientY - rect.top) / (rect.height || H);
    return { x: clamp(cx, 0, 1), y: clamp(cy, 0, 1) };
  }
  function applyDrag(p) {
    var b = sunBase(lastT);
    dragX = clamp(p.x - b.x, -0.4, 0.4);
    dragY = clamp(p.y - b.y, -0.1, 0.25);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      try { if (e && typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      dragging = true;
      var p = pointerPos(e);
      dragLastX = p.x; dragLastY = p.y;
      applyDrag(p);
      draw(lastT);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var p = pointerPos(e);
      dragLastX = p.x; dragLastY = p.y;
      applyDrag(p);
      draw(lastT);
    });
    var endDrag = function () {
      if (!dragging) { return; }
      dragging = false;
      // Release: the loop eases dragX/dragY back to zero.
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', endDrag);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece854 exposes growth, sun and drag state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece854 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      plants: PLANTS.length,
      objects: OBJECTS.length,
      growth: function (i, t) { return growthOf(PLANTS[i], t); },
      appear: function (i, t) { return appearOf(OBJECTS[i], t); },
      sun: function (t) { return sunPos(t); },
      drag: function (dx, dy) { dragX = dx; dragY = dy; },
      release: function () { dragging = false; },
      dragOffset: function () { return { x: dragX, y: dragY }; },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 120 s growth/drift cycle, closed-form. The drag
  // offset eases back to zero after release. Guarded so node-canvas
  // QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var prevNow = start;
    requestAnimationFrame(function loop(now) {
      var dt = (now - prevNow) / 1000;
      prevNow = now;
      var t = FIRST_T + (now - start) / 1000;
      if (!dragging) {
        var k = Math.exp(-dt / 0.9);
        dragX *= k; dragY *= k;
      }
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
