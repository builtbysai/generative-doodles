<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ventriloquist's Violin</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var WOOD  = '#7A4A28';  // machine violin wood
  var CONE  = '#3A3A3A';  // speaker cone grey
  var AMBER = '#C98A2B';  // pulse amber
  var CHALK = '#F0EDE4';  // user violin chalk
  var BG    = '#0A0A0A';  // stage black

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- layout ----------
  var W = 0, H = 0, DPR = 1, isPhone = false;
  var L = 0;                    // violin total length in px
  var mCX = 0, mCY = 0;         // machine violin center
  var uCX = 0, uCY = 0;         // user violin center

  function viewSize() {
    var vv = window.visualViewport;
    if (vv && vv.width) return { w: vv.width, h: vv.height };
    return { w: window.innerWidth || 0, h: window.innerHeight || 0 };
  }

  function layout() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var sw = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || H > W * 1.15;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    L = Math.min(H * 0.86, W * 1.02);
    mCX = W * 0.27; mCY = H * 0.52;
    uCX = W * 0.73; uCY = H * 0.52;
  }

  // ---------- music model ----------
  var STEP_DUR = 0.42;
  var STEPS = 16;
  var LOOP_DUR = STEP_DUR * STEPS;
  var LOOPS_PER_KEY = 16;
  var PHASE0 = STEP_DUR * 0.5;        // frame one sits mid-pulse on step 0
  var BASE_FREQ = 196;                // G3
  var SCALE = [0, 2, 3, 5, 7, 8, 10]; // natural minor
  var KEY_INTERVALS = [2, -3, 4, -2, 5, -4];
  var BASE_SEED = 85415;

  function degreeToSemis(d) {
    var oct = Math.floor(d / 7);
    var idx = d - oct * 7;
    return SCALE[idx] + 12 * oct;
  }
  function degreeToSemisFloat(d) {
    var lo = Math.floor(d), hi = lo + 1, f = d - lo;
    return degreeToSemis(lo) * (1 - f) + degreeToSemis(hi) * f;
  }
  function keyTranspose(keyIdx) {
    var sum = 0, n = KEY_INTERVALS.length, i, k;
    if (keyIdx >= 0) { for (i = 0; i < keyIdx; i++) sum += KEY_INTERVALS[i % n]; }
    else { for (k = keyIdx; k < 0; k++) sum -= KEY_INTERVALS[((k % n) + n) % n]; }
    return sum;
  }
  function freqFor(degreeFloat, transpose) {
    return BASE_FREQ * Math.pow(2, (degreeToSemisFloat(degreeFloat) + transpose) / 12);
  }

  // machine phrase: 16 steps, -1 = rest, else scale degree
  var epoch = 0;
  var phrase = [];
  function genPhrase(ep) {
    var rnd = mulberry32(BASE_SEED + ep * 1013);
    var out = [], deg = 4, i, r, step;
    for (i = 0; i < STEPS; i++) {
      if (i === 0) { out.push(deg); continue; }
      r = rnd();
      if (r < 0.16) { out.push(-1); continue; }
      step = [-2, -1, -1, 0, 0, 1, 1, 2, 3][Math.floor(rnd() * 9)];
      deg += step;
      if (deg < 0) deg = 0; if (deg > 11) deg = 11;
      out.push(deg);
    }
    return out;
  }
  phrase = genPhrase(0);

  function stepInfo(mt) {
    var stepIdx = Math.floor(mt / STEP_DUR);
    var inLoop = ((stepIdx % STEPS) + STEPS) % STEPS;
    var loopIdx = Math.floor(stepIdx / STEPS);
    var keyIdx = Math.floor(loopIdx / LOOPS_PER_KEY);
    return { stepIdx: stepIdx, inLoop: inLoop, loopIdx: loopIdx, transpose: keyTranspose(keyIdx) };
  }

  // ---------- interaction state (recorded events) ----------
  var samples = [];        // bow samples {t, x, y, speed, clash}
  var dragging = false;
  var strokeNotes = [];    // notes of the current stroke {deg, dur}
  var strokeDeg = null, strokeDegT = 0;
  var lastPhrase = [];     // last completed stroke's notes
  var quotes = [];         // fired quotes {start, dur, notes:[{off, dur, deg}]}
  var pendingQuote = null; // {notes, dur} waiting for the scheduler's next step boundary
  var tapTimer = null, lastTapT = -10;

  function nowSec() {
    var n = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    return n / 1000;
  }
  var T0 = nowSec();
  function clock() { return nowSec() - T0; }

  // machine time: advances with the clock, frozen during quotes
  function machineTime(t) {
    var mt = t + PHASE0, i, q;
    for (i = 0; i < quotes.length; i++) {
      q = quotes[i];
      if (t >= q.start + q.dur) mt -= q.dur;
      else if (t >= q.start) mt -= (t - q.start);
    }
    return mt;
  }

  // ---------- audio (lazy, gesture started, fully guarded) ----------
  var AC = null, master = null, userOsc = null, userGain = null, userFilter = null;
  var schedStep = null, schedTime = 0;   // machine audio scheduler state
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    var Ctor = (typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext)) || null;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      var comp = AC.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 8;
      master = AC.createGain(); master.gain.value = 0.5;
      master.connect(comp); comp.connect(AC.destination);
      // user voice: one persistent filtered saw
      userOsc = AC.createOscillator(); userOsc.type = 'sawtooth';
      userFilter = AC.createBiquadFilter(); userFilter.type = 'lowpass';
      userFilter.frequency.value = 1100; userFilter.Q.value = 0.6;
      userGain = AC.createGain(); userGain.gain.value = 0;
      userOsc.connect(userFilter); userFilter.connect(userGain); userGain.connect(master);
      userOsc.start();
      // init machine scheduler at the current step
      var t = clock(), info = stepInfo(machineTime(t));
      schedStep = info.stepIdx;
      schedTime = t - (machineTime(t) - info.stepIdx * STEP_DUR) + 0.05;
      if (schedTime < t) schedTime = t + 0.05;
    } catch (e) { AC = null; }
  }
  function ctxTimeFor(visualT) { return AC.currentTime + (visualT - clock()); }

  function scheduleMachineNote(visualOnset, degree, transpose, dur) {
    if (!AC) return;
    var t0 = ctxTimeFor(visualOnset);
    if (t0 < AC.currentTime - 0.05) return;
    var f = freqFor(degree, transpose);
    var o1 = AC.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f;
    var o2 = AC.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = f; o2.detune.value = 5;
    var fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 950; fl.Q.value = 0.8;
    var g = AC.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.14, t0 + 0.03);
    g.gain.setTargetAtTime(0.055, t0 + 0.05, dur * 0.35);
    g.gain.setTargetAtTime(0, t0 + dur * 0.9, 0.05);
    var g2 = AC.createGain(); g2.gain.value = 0.5;
    o1.connect(fl); o2.connect(g2); g2.connect(fl); fl.connect(g); g.connect(master);
    o1.start(t0); o2.start(t0);
    o1.stop(t0 + dur + 0.3); o2.stop(t0 + dur + 0.3);
  }

  function audioTick(t) {
    if (!AC) return;
    // machine scheduler: phrase steps, with quote insertions at step boundaries
    while (schedTime < t + 0.25) {
      if (pendingQuote) {
        var q = { start: schedTime, dur: pendingQuote.dur, notes: pendingQuote.notes };
        quotes.push(q);
        for (var i = 0; i < q.notes.length; i++) {
          var qn = q.notes[i];
          scheduleMachineNote(q.start + qn.off, qn.deg, stepInfo(machineTime(q.start)).transpose, Math.min(qn.dur, STEP_DUR * 1.6));
        }
        schedTime += q.dur;
        pendingQuote = null;
        continue;
      }
      var info = stepInfo(schedStep * STEP_DUR + 0.001);
      var deg = phrase[info.inLoop];
      if (deg >= 0) scheduleMachineNote(schedTime, deg, info.transpose, STEP_DUR * 0.92);
      schedStep++;
      schedTime += STEP_DUR;
    }
    // user voice follows the bow
    if (userOsc) {
      var ct = AC.currentTime;
      if (dragging && samples.length) {
        var s = samples[samples.length - 1];
        var pf = userPitch(s, t);
        userOsc.frequency.setTargetAtTime(pf.freq, ct, 0.03);
        var vol = Math.min(0.20, pf.speed / (2.2 * Math.min(W, H)) + (pf.speed > 0 ? 0.02 : 0));
        userGain.gain.setTargetAtTime(vol, ct, 0.05);
      } else {
        userGain.gain.setTargetAtTime(0, ct, 0.06);
      }
    }
  }

  // ---------- user pitch from a bow sample ----------
  function userPitch(s, t) {
    var yn = (s.y - uCY) / L;                       // position along the body
    var degF = (0.40 - yn) / 0.50 * 14;             // top of body = high pitch
    if (degF < 0) degF = 0; if (degF > 14) degF = 14;
    var transpose = stepInfo(machineTime(t)).transpose;
    if (s.clash) return { freq: freqFor(degF, transpose), deg: degF, speed: s.speed };
    var dq = Math.round(degF);
    return { freq: freqFor(dq, transpose), deg: dq, speed: s.speed };
  }

  // ---------- pointer handling ----------
  function ptrPos(e) {
    return { x: e.clientX || 0, y: e.clientY || 0 };
  }
  var downT = 0, downX = 0, downY = 0, downMoved = 0;

  function onDown(e) {
    ensureAudio();
    var p = ptrPos(e), t = clock();
    dragging = true; downMoved = 0;
    downT = t; downX = p.x; downY = p.y;
    strokeNotes = []; strokeDeg = null;
    samples.push({ t: t, x: p.x, y: p.y, speed: 0, clash: false });
  }
  function onMove(e) {
    if (!dragging) return;
    var p = ptrPos(e), t = clock();
    var prev = samples[samples.length - 1];
    var dt = Math.max(0.008, t - prev.t);
    var dist = Math.sqrt((p.x - prev.x) * (p.x - prev.x) + (p.y - prev.y) * (p.y - prev.y));
    var speed = dist / dt;
    downMoved += dist;
    var clash = speed > 1.1 * Math.min(W, H);
    var s = { t: t, x: p.x, y: p.y, speed: speed, clash: clash };
    samples.push(s);
    // record phrase notes from quantized degree changes while bowing
    var pf = userPitch(s, t);
    if (!s.clash && speed > 12) {
      if (strokeDeg === null) { strokeDeg = pf.deg; strokeDegT = t; }
      else if (pf.deg !== strokeDeg) {
        var dur = t - strokeDegT;
        if (dur > 0.07) strokeNotes.push({ deg: strokeDeg, dur: dur });
        strokeDeg = pf.deg; strokeDegT = t;
      }
    }
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var t = clock();
    if (strokeDeg !== null) {
      var dur = t - strokeDegT;
      if (dur > 0.07) strokeNotes.push({ deg: strokeDeg, dur: dur });
      strokeDeg = null;
    }
    if (strokeNotes.length) lastPhrase = strokeNotes.slice(0, 16);
    strokeNotes = [];
    // tap / double-tap detection (short, nearly still)
    if (t - downT < 0.3 && downMoved < 8) {
      if (t - lastTapT < 0.35 && tapTimer !== null) {
        // double tap: reseed the machine phrase
        if (typeof clearTimeout === 'function') clearTimeout(tapTimer);
        tapTimer = null; lastTapT = -10;
        epoch++; phrase = genPhrase(epoch);
      } else {
        lastTapT = t;
        if (typeof setTimeout === 'function') {
          tapTimer = setTimeout(function () { tapTimer = null; fireQuote(); }, 360);
        } else { fireQuote(); }
      }
    }
  }

  function fireQuote() {
    if (pendingQuote) return;
    var src = lastPhrase, i;
    if (!src.length) {
      // nothing bowed yet: the dummy quotes the machine's own recent steps
      src = [];
      var info = stepInfo(machineTime(clock()));
      for (i = 1; i <= 4; i++) {
        var d = phrase[((info.inLoop - i) % STEPS + STEPS) % STEPS];
        if (d >= 0) src.unshift({ deg: d, dur: STEP_DUR });
      }
      if (!src.length) return;
    }
    var notes = [], total = 0;
    for (i = 0; i < src.length; i++) {
      var nd = Math.min(0.9, Math.max(0.12, src[i].dur));
      notes.push({ off: total, dur: nd, deg: src[i].deg + 2 });  // transposed quote
      total += nd;
    }
    if (total > 5) { var k = 5 / total; for (i = 0; i < notes.length; i++) { notes[i].off *= k; notes[i].dur *= k; } total = 5; }
    if (total < 1) { var k2 = 1 / total; for (i = 0; i < notes.length; i++) { notes[i].off *= k2; notes[i].dur *= k2; } total = 1; }
    pendingQuote = { notes: notes, dur: total };
    // if audio is unavailable, still register the quote for the visuals
    if (!AC) {
      quotes.push({ start: clock() + 0.05, dur: total, notes: notes });
      pendingQuote = null;
    }
  }

  canvas.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  // ---------- violin geometry ----------
  function halfWidth(y) {
    // body spans y in [-0.20, 0.43] in unit coords (fraction of L)
    var wu = 0.172, yu = -0.060, ryu = 0.160;
    var wl = 0.222, yl = 0.220, ryl = 0.210;
    var a = 0, b = 0, dy;
    dy = (y - yu) / ryu; if (Math.abs(dy) < 1) a = wu * Math.sqrt(1 - dy * dy);
    dy = (y - yl) / ryl; if (Math.abs(dy) < 1) b = wl * Math.sqrt(1 - dy * dy);
    var w = Math.max(a, b);
    var pinch = 1 - 0.24 * Math.exp(-Math.pow((y - 0.055) / 0.060, 2));
    return w * pinch;
  }
  function bodyPath() {
    var y, pts = [], i;
    for (y = -0.22; y <= 0.431; y += 0.012) pts.push([halfWidth(y), y]);
    ctx.beginPath();
    ctx.moveTo(0, -0.22);
    for (i = 0; i < pts.length; i++) ctx.lineTo(pts[i][0] * L, pts[i][1] * L);
    for (i = pts.length - 1; i >= 0; i--) ctx.lineTo(-pts[i][0] * L, pts[i][1] * L);
    ctx.closePath();
  }
  function drawViolin(cx, cy, tilt, machine, t, mt) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt);
    // neck + scroll
    if (machine) { ctx.fillStyle = WOOD; } else { ctx.fillStyle = BG; }
    ctx.fillRect(-0.028 * L, -0.44 * L, 0.056 * L, 0.27 * L);
    ctx.beginPath(); ctx.arc(0, -0.462 * L, 0.034 * L, 0, Math.PI * 2);
    if (machine) ctx.fill(); else ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -0.462 * L, 0.016 * L, 0, Math.PI * 2);
    if (machine) { ctx.fillStyle = BG; ctx.fill(); } else { ctx.stroke(); }
    // body
    bodyPath();
    if (machine) { ctx.fillStyle = WOOD; ctx.fill(); }
    else {
      ctx.fillStyle = 'rgba(240,237,228,0.07)'; ctx.fill();
      ctx.strokeStyle = CHALK; ctx.lineWidth = Math.max(1.6, L * 0.004); ctx.stroke();
    }
    if (machine) { ctx.strokeStyle = 'rgba(10,10,10,0.55)'; ctx.lineWidth = Math.max(1.2, L * 0.003); ctx.stroke(); }
    // fingerboard
    ctx.beginPath();
    ctx.moveTo(-0.017 * L, -0.42 * L); ctx.lineTo(0.017 * L, -0.42 * L);
    ctx.lineTo(0.034 * L, 0.0 * L); ctx.lineTo(-0.034 * L, 0.0 * L);
    ctx.closePath();
    if (machine) { ctx.fillStyle = CONE; ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(240,237,228,0.75)'; ctx.lineWidth = Math.max(1, L * 0.0022); ctx.stroke(); }
    // strings
    ctx.strokeStyle = machine ? 'rgba(10,10,10,0.6)' : 'rgba(240,237,228,0.8)';
    ctx.lineWidth = Math.max(1, L * 0.002);
    [-0.011, 0.011].forEach(function (sx) {
      ctx.beginPath(); ctx.moveTo(sx * L, -0.44 * L); ctx.lineTo(sx * L, 0.30 * L); ctx.stroke();
    });
    // tailpiece
    ctx.beginPath();
    ctx.moveTo(-0.016 * L, 0.24 * L); ctx.lineTo(0.016 * L, 0.24 * L);
    ctx.lineTo(0.042 * L, 0.37 * L); ctx.lineTo(-0.042 * L, 0.37 * L);
    ctx.closePath();
    if (machine) { ctx.fillStyle = CONE; ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(240,237,228,0.75)'; ctx.stroke(); }
    // f-hole hints
    ctx.strokeStyle = machine ? 'rgba(10,10,10,0.5)' : 'rgba(240,237,228,0.55)';
    ctx.lineWidth = Math.max(1, L * 0.0026);
    [-1, 1].forEach(function (sgn) {
      ctx.beginPath();
      ctx.arc(sgn * 0.105 * L, 0.10 * L, 0.030 * L, sgn > 0 ? -0.6 : Math.PI - 0.9, sgn > 0 ? 0.9 : Math.PI + 0.6);
      ctx.stroke();
    });

    if (machine) drawMachineHeart(t, mt);
    ctx.restore();
  }

  // speaker cone, pulse rings, phrase dots: all inside the machine transform
  function drawMachineHeart(t, mt) {
    var info = stepInfo(mt);
    var ages = [], i, stepIdx, onsetMt, age;
    // recent phrase onsets in machine-time domain
    var cur = Math.floor(mt / STEP_DUR);
    for (stepIdx = cur; stepIdx > cur - 4; stepIdx--) {
      if (phrase[((stepIdx % STEPS) + STEPS) % STEPS] >= 0) {
        age = mt - stepIdx * STEP_DUR;
        if (age >= 0 && age < 0.95) ages.push(age);
      }
    }
    // quote onsets in real time while a quote is sounding
    for (i = 0; i < quotes.length; i++) {
      var q = quotes[i];
      if (t >= q.start && t <= q.start + q.dur + 0.95) {
        for (var j = 0; j < q.notes.length; j++) {
          var qa = t - (q.start + q.notes[j].off);
          if (qa >= 0 && qa < 0.95) ages.push(qa);
        }
      }
    }
    var cxp = 0, cyp = 0.10 * L;
    // radiating rings first (under the cone)
    for (i = 0; i < ages.length; i++) {
      var r = 0.085 * L + ages[i] * 0.16 * L;
      ctx.beginPath(); ctx.arc(cxp, cyp, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(201,138,43,' + (0.45 * (1 - ages[i] / 0.95)).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, L * 0.003);
      ctx.stroke();
    }
    // cone disc with pulse scale from the freshest onset
    var fresh = ages.length ? Math.min.apply(null, ages) : 99;
    var pulse = fresh < 99 ? Math.exp(-fresh * 5.5) : 0;
    var cr = 0.085 * L * (1 + 0.20 * pulse);
    ctx.beginPath(); ctx.arc(cxp, cyp, cr, 0, Math.PI * 2);
    ctx.fillStyle = CONE; ctx.fill();
    ctx.beginPath(); ctx.arc(cxp, cyp, cr * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = BG; ctx.fill();
    ctx.beginPath(); ctx.arc(cxp, cyp, cr, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,138,43,' + (0.35 + 0.65 * pulse).toFixed(3) + ')';
    ctx.lineWidth = Math.max(1.2, L * 0.004);
    ctx.stroke();
    // phrase dots along the top edge: 16 steps, current lit, rests hollow
    var dotY = -0.545 * L, dotR = Math.max(2.2, L * 0.0075);
    for (i = 0; i < STEPS; i++) {
      var dx = (i - (STEPS - 1) / 2) * L * 0.023;
      ctx.beginPath(); ctx.arc(dx, dotY, dotR, 0, Math.PI * 2);
      if (phrase[i] < 0) {
        ctx.strokeStyle = 'rgba(201,138,43,0.4)'; ctx.lineWidth = 1; ctx.stroke();
      } else if (i === info.inLoop) {
        ctx.fillStyle = AMBER; ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(201,138,43,0.28)'; ctx.fill();
      }
    }
  }

  // bow trail and bow stick for the user violin
  function drawBow(t) {
    var i, a, b, age, alpha;
    ctx.lineCap = 'round';
    for (i = 1; i < samples.length; i++) {
      a = samples[i - 1]; b = samples[i];
      age = t - b.t;
      if (age > 2) continue;
      if (b.t - a.t > 0.25) continue;   // do not bridge separate strokes
      alpha = 0.5 * (1 - age / 2);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = b.clash
        ? 'rgba(201,138,43,' + alpha.toFixed(3) + ')'
        : 'rgba(240,237,228,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = Math.max(1.2, L * 0.0035);
      ctx.stroke();
    }
    // bow stick at the newest sample while dragging
    if (dragging && samples.length) {
      var s = samples[samples.length - 1];
      var vx = 1, vy = 0;
      if (samples.length > 1) {
        var p = samples[samples.length - 2];
        vx = s.x - p.x; vy = s.y - p.y;
        var m = Math.sqrt(vx * vx + vy * vy);
        if (m > 0.5) { vx /= m; vy /= m; } else { vx = 1; vy = 0; }
      }
      var bl = L * 0.30;
      ctx.beginPath();
      ctx.moveTo(s.x - vy * bl, s.y + vx * bl);
      ctx.lineTo(s.x + vy * bl, s.y - vx * bl);
      ctx.strokeStyle = s.clash ? 'rgba(201,138,43,0.9)' : 'rgba(240,237,228,0.9)';
      ctx.lineWidth = Math.max(1.4, L * 0.004);
      ctx.stroke();
    }
  }

  // ---------- draw ----------
  function draw(t) {
    layout();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    var mt = machineTime(t);
    drawViolin(mCX, mCY, 0.10, true, t, mt);
    drawViolin(uCX, uCY, -0.10, false, t, mt);
    drawBow(t);
  }

  draw(0);

  // ---------- main loop ----------
  var raf = (typeof requestAnimationFrame === 'function') ? requestAnimationFrame : null;
  if (raf) {
    var loop = function () {
      var t = clock();
      // prune old bow samples beyond the trail window
      while (samples.length && t - samples[0].t > 2.2) samples.shift();
      audioTick(t);
      draw(t);
      raf(loop);
    };
    raf(loop);
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(clock()); });
  }
  window.addEventListener('resize', function () { draw(clock()); });
})();
</script>
</body>
</html>
