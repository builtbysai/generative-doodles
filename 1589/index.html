<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace, Split, Vanish</title>
<style>
html, body { margin: 0; padding: 0; background: #060608; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BG = [6, 6, 8];
var DISC = [245, 245, 242];
var GOLD = [217, 164, 65];
var SUN = [217, 40, 58];
var NAVY = [30, 58, 138];
var ORANGE = [232, 100, 30];
var YELLOW = [245, 216, 30];
var WHITE = [255, 255, 255];
var PHASE = 12.0;
var DT = 1 / 60;
var MAXP = 420;
var ROWS = 25;
var SEED_BASE = 1589001;
var SEED_TABLE = [1589001, 1589137, 1589271, 1589403, 1589557, 1589689, 1589821, 1589963];
var SPAWN_EVERY = [0.10, 0.09, 0.07];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var prevVW = 0;
var particles = [];
var rng = mulberry32(SEED_BASE);
var simT = 0;
var nextSpawn = [0, 0, 0];
var pulse = [0, 0];
var b0 = [], b1 = [];
var tapCount = 0;
var dragging = -1;
var downX = 0, downY = 0, moved = 0;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  if (prevVW > 0 && vw !== prevVW) {
    var s = vw / prevVW;
    for (var i = 0; i < ROWS; i++) { b0[i] *= s; b1[i] *= s; }
  }
  VW = vw; VH = vh; prevVW = vw;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function minDim() { return Math.min(VW, VH); }
function discPos() { return { x: VW / 6, y: VH * 0.45, r: 0.085 * minDim() }; }
function sunPos() {
  var r = 0.075 * minDim();
  var x = VW / 3 + Math.max(VW / 18, r * 1.6 + 10);
  return { x: x, y: VH * 0.55, r: r };
}
function defaultBounds() {
  b0 = []; b1 = [];
  for (var i = 0; i < ROWS; i++) { b0[i] = VW / 3; b1[i] = 2 * VW / 3; }
}
function boundAt(b, y) {
  var f = clamp01(y / VH) * (ROWS - 1);
  var i = Math.floor(f);
  if (i >= ROWS - 1) return b[ROWS - 1];
  var fr = f - i;
  return b[i] * (1 - fr) + b[i + 1] * fr;
}
function regionAt(x, y) {
  if (x < boundAt(b0, y)) return 0;
  if (x < boundAt(b1, y)) return 1;
  return 2;
}
function lifeFor(region) {
  if (region === 0) return 4 + rng() * 3;
  if (region === 1) return 3 + rng() * 2;
  return 0.7 + rng() * 0.8;
}
function makeParticle(region, x, y, vx, vy, age) {
  var life = lifeFor(region);
  return {
    x: x, y: y, vx: vx, vy: vy,
    age: age, life: life, region: region, id: Math.floor(rng() * 1000000),
    gen: 0, trail: [[x, y]]
  };
}
function spawnIn(region) {
  var md = minDim();
  var S = md / 900;
  var d = discPos(), s = sunPos();
  if (region === 0) {
    var a0 = rng() * TAU;
    var r0 = md * (0.12 + rng() * 0.16);
    var x0 = d.x + Math.cos(a0) * r0, y0 = d.y + Math.sin(a0) * r0;
    var sp0 = 90 * S * (0.8 + rng() * 0.4);
    return makeParticle(0, x0, y0, -Math.sin(a0) * sp0, Math.cos(a0) * sp0, 0);
  }
  if (region === 1) {
    var a1 = rng() * TAU;
    var r1 = s.r * (1.1 + rng() * 0.8);
    var x1 = s.x + Math.cos(a1) * r1, y1 = s.y + Math.sin(a1) * r1;
    var sp1 = (100 + rng() * 80) * S;
    return makeParticle(1, x1, y1, Math.cos(a1) * sp1, Math.sin(a1) * sp1, 0);
  }
  var x2 = (2 * VW / 3 + 10) + rng() * (VW / 3 - 20);
  var y2 = 10 + rng() * (VH - 20);
  var a2 = rng() * TAU;
  var sp2 = (180 + rng() * 220) * S;
  return makeParticle(2, x2, y2, Math.cos(a2) * sp2, Math.sin(a2) * sp2, 0);
}
function buildField(seed) {
  rng = mulberry32(seed);
  particles = [];
  var counts = [55, 55, 45];
  for (var r = 0; r < 3; r++) {
    for (var i = 0; i < counts[r]; i++) {
      var p = spawnIn(r);
      p.age = rng() * p.life * 0.6;
      particles.push(p);
    }
  }
  nextSpawn = [0.05, 0.05, 0.05];
  pulse = [0, 0];
}
function splitParticle(p, newRegion) {
  var md = minDim();
  var S = md / 900;
  var MAXV = 420 * S;
  var sp = Math.hypot(p.vx, p.vy) || 1;
  var ux = p.vx / sp, uy = p.vy / sp;
  var pxv = -uy, pyv = ux;
  var kick = 42 * S;
  var kids = [];
  for (var k = 0; k < 2; k++) {
    var sign = k === 0 ? 1 : -1;
    var ang = sign * 0.96;
    var ca = Math.cos(ang), sa = Math.sin(ang);
    var vx = (ux * ca - uy * sa) * sp * 1.15 + pxv * kick * sign;
    var vy = (ux * sa + uy * ca) * sp * 1.15 + pyv * kick * sign;
    var mag = Math.hypot(vx, vy);
    if (mag > MAXV) { vx *= MAXV / mag; vy *= MAXV / mag; }
    var life = Math.max(0.5, (p.life - p.age) * 0.6);
    var kid = {
      x: p.x, y: p.y, vx: vx, vy: vy,
      age: 0, life: life, region: newRegion, id: Math.floor(rng() * 1000000),
      gen: p.gen + 1, trail: [[p.x, p.y]]
    };
    kids.push(kid);
  }
  return kids;
}
function step(dt) {
  var md = minDim();
  var S = md / 900;
  var d = discPos(), s = sunPos();
  for (var r = 0; r < 3; r++) {
    while (simT >= nextSpawn[r]) {
      if (particles.length < MAXP) particles.push(spawnIn(r));
      nextSpawn[r] += SPAWN_EVERY[r];
    }
  }
  var births = [];
  var alive = [];
  var TRAIL_LEN = [26, 18, 8];
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var oldRegion = regionAt(p.x, p.y);
    if (p.region === 0) {
      var dx = p.x - d.x, dy = p.y - d.y;
      var rr = Math.hypot(dx, dy) + 0.0001;
      var tx = -dy / rr, ty = dx / rr;
      var spd = 90 * S;
      var vr = Math.max(-80, Math.min(80, (0.20 * md - rr) * 1.5)) * S;
      var k = Math.min(1, 2.5 * dt);
      p.vx += ((tx * spd + (dx / rr) * vr) - p.vx) * k;
      p.vy += ((ty * spd + (dy / rr) * vr) - p.vy) * k;
    } else if (p.region === 1) {
      var sx = p.x - s.x, sy = p.y - s.y;
      var sr = Math.hypot(sx, sy) + 0.0001;
      var rx = sx / sr, ry = sy / sr;
      var sp1 = 140 * S;
      var dvx = rx * sp1 + (-ry) * sp1 * 0.35;
      var dvy = ry * sp1 + (rx) * sp1 * 0.35;
      var k1 = Math.min(1, 2.0 * dt);
      p.vx += (dvx - p.vx) * k1;
      p.vy += (dvy - p.vy) * k1;
    } else {
      var drag = 1 - 0.10 * dt;
      p.vx *= drag; p.vy *= drag;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.age += dt;
    var newRegion = regionAt(p.x, p.y);
    if (newRegion !== oldRegion) {
      var bi = Math.min(oldRegion, newRegion);
      pulse[bi] = 1;
      if (p.gen < 3 && particles.length + births.length < MAXP - 2) {
        var kids = splitParticle(p, newRegion);
        births.push(kids[0]); births.push(kids[1]);
      }
      continue;
    }
    if (p.age >= p.life) continue;
    if (p.x < -40 || p.x > VW + 40 || p.y < -40 || p.y > VH + 40) continue;
    p.region = newRegion;
    p.trail.push([p.x, p.y]);
    var tl = TRAIL_LEN[p.region];
    while (p.trail.length > tl) p.trail.shift();
    alive.push(p);
  }
  for (var b = 0; b < births.length; b++) alive.push(births[b]);
  particles = alive;
  pulse[0] *= Math.exp(-dt * 1.8);
  pulse[1] *= Math.exp(-dt * 1.8);
  simT += dt;
}
function advance(toT) {
  var guard = 0;
  while (simT < toT - 0.000001 && guard < 20000) {
    step(DT);
    guard++;
  }
}
function colorFor(p) {
  if (p.region === 0) return GOLD;
  if (p.region === 1) return (p.id % 5 === 0) ? NAVY : ORANGE;
  return (p.id % 2 === 0) ? YELLOW : WHITE;
}
function draw(t) {
  lastT = t;
  size();
  if (b0.length === 0) defaultBounds();
  if (t < simT - 0.001) {
    simT = 0;
    buildField(SEED_BASE);
  }
  advance(t);
  ctx.fillStyle = 'rgb(' + BG[0] + ',' + BG[1] + ',' + BG[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var md = minDim();
  var S = md / 900;
  var d = discPos(), s = sunPos();
  ctx.strokeStyle = rgba(NAVY, 0.55);
  ctx.lineWidth = 2 * (isPhone ? 1.3 : 1.0) * (S + 0.4);
  ctx.beginPath();
  ctx.moveTo(s.x + s.r * 1.6, s.y);
  ctx.arc(s.x, s.y, s.r * 1.6, 0, TAU);
  ctx.stroke();
  ctx.fillStyle = 'rgb(' + SUN[0] + ',' + SUN[1] + ',' + SUN[2] + ')';
  ctx.beginPath();
  ctx.moveTo(s.x + s.r, s.y);
  ctx.arc(s.x, s.y, s.r, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgb(' + DISC[0] + ',' + DISC[1] + ',' + DISC[2] + ')';
  ctx.beginPath();
  ctx.moveTo(d.x + d.r, d.y);
  ctx.arc(d.x, d.y, d.r, 0, TAU);
  ctx.fill();
  var bounds = [b0, b1];
  for (var bi = 0; bi < 2; bi++) {
    var a = 0.14 + pulse[bi] * 0.45;
    ctx.strokeStyle = rgba(WHITE, a);
    ctx.lineWidth = 1 * (isPhone ? 1.3 : 1.0) * (S + 0.4);
    ctx.beginPath();
    for (var ri = 0; ri < ROWS; ri++) {
      var yy = (ri / (ROWS - 1)) * VH;
      if (ri === 0) ctx.moveTo(bounds[bi][ri], yy);
      else ctx.lineTo(bounds[bi][ri], yy);
    }
    ctx.stroke();
  }
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var fadeIn = Math.min(1, p.age / 0.15);
    var fadeOut = p.age < p.life * 0.7 ? 1 : 1 - (p.age - p.life * 0.7) / (p.life * 0.3);
    var a = 0.85 * fadeIn * Math.max(0, fadeOut);
    if (a < 0.01) continue;
    var col = colorFor(p);
    var lw = (p.region === 2 ? 1.4 : 1.8) * (isPhone ? 1.3 : 1.0) * (S + 0.4);
    var tr = p.trail;
    var nSeg = tr.length - 1;
    for (var si = 0; si < nSeg; si++) {
      var segA = a * (0.25 + 0.75 * (si + 1) / nSeg);
      if (segA < 0.01) continue;
      ctx.strokeStyle = rgba(col, segA);
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(tr[si][0], tr[si][1]);
      ctx.lineTo(tr[si + 1][0], tr[si + 1][1]);
      ctx.stroke();
    }
    if (p.region === 2) {
      ctx.fillStyle = rgba(col, a);
      ctx.beginPath();
      ctx.moveTo(p.x + 1.6 * (S + 0.4), p.y);
      ctx.arc(p.x, p.y, 1.6 * (S + 0.4), 0, TAU);
      ctx.fill();
    }
  }
}
function reseed() {
  tapCount++;
  buildField(SEED_TABLE[tapCount % SEED_TABLE.length]);
  simT = lastT;
}
function onDown(e) {
  downX = e.clientX; downY = e.clientY; moved = 0;
  var y = e.clientY;
  var g = 24 * (isPhone ? 1.5 : 1.0);
  var d0 = Math.abs(e.clientX - boundAt(b0, y));
  var d1 = Math.abs(e.clientX - boundAt(b1, y));
  if (d0 < g && d0 <= d1) dragging = 0;
  else if (d1 < g) dragging = 1;
  else dragging = -1;
}
function onMove(e) {
  if (dragging < 0) return;
  moved += Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
  downX = e.clientX; downY = e.clientY;
  var b = dragging === 0 ? b0 : b1;
  var lo = dragging === 0 ? 0.06 * VW : b0[0] + 0.05 * VW;
  var hi = dragging === 0 ? b1[0] - 0.05 * VW : 0.94 * VW;
  var rowF = clamp01(e.clientY / VH) * (ROWS - 1);
  for (var ri = 0; ri < ROWS; ri++) {
    var dist = Math.abs(ri - rowF);
    var w = Math.exp(-(dist * dist) / (2 * 3 * 3));
    if (w < 0.02) continue;
    var target = Math.max(lo, Math.min(hi, e.clientX));
    b[ri] = b[ri] * (1 - w * 0.7) + target * w * 0.7;
  }
}
function onUp(e) {
  if (dragging >= 0 && moved > 10) { dragging = -1; return; }
  dragging = -1;
  reseed();
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
size();
defaultBounds();
buildField(SEED_BASE);
draw(PHASE);
var startT = null;
function loop(ts) {
  if (startT === null) startT = ts;
  var t = PHASE + (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
