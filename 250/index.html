<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.250 Sets of Three</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#8A8378; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.250 Sets of Three (Avantika Bawa). After her Blue
// Scaffolds in Zbayul: a climbable scaffold structure on a
// Ladakhi hillside, built by her sets-of-three rule, modules
// grouped in threes and each trio smaller than the last as
// they ascend, deep blue against pale rock. The topmost trio
// sways gently in the wind. Drag across the structure and the
// poles bend aside on their springs and settle back; the
// system is the toy. Double tap reseeds the trio layout. The
// poles never detach or break.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BLUE = '#1450C8', PALE = '#7FB2F0', ROCK = '#8A8378', GROUND = '#141210';
var W = 0, H = 0, phone = false;
var T = 1.3, lastNow = -1; // frame one: full staircase built, top trio mid sway
var seedIdx = 0;
var nodes = [], edges = [], baseNodes = [];

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function slopeY(x) { return 648 - (x / 1200) * 330; }

// ---- layout: trios of scaffold towers stepping up the slope ---------------------------
function buildLayout() {
  nodes = []; edges = []; baseNodes = [];
  var r = rng(25013 + seedIdx * 104729);
  var trioCount = 3 + (r() < 0.45 ? 1 : 0);
  var patterns = [[2, 2, 3, 3], [1, 2, 3, 3], [2, 3, 3, 4], [2, 3, 4, 4], [1, 2, 2, 3]];
  var x = 64;
  for (var g = 0; g < trioCount; g++) {
    var s = Math.pow(0.82, g); // each trio smaller than the last
    var cw = 104 * s, lvlH = 88 * s;
    var pat = patterns[Math.floor(r() * patterns.length)];
    var isTop = (g === trioCount - 1);
    var cols = [];
    for (var j = 0; j < 4; j++) {
      var lv = pat[j];
      var bx = x + j * cw, by = slopeY(bx);
      var col = [];
      for (var l = 0; l <= lv; l++) {
        var nd = {
          hx: bx, hy: by - l * lvlH, x: bx, y: by - l * lvlH, vx: 0, vy: 0,
          top: isTop ? l / Math.max(1, lv) : 0
        };
        nodes.push(nd); col.push(nd);
        if (l === 0) baseNodes.push(nd);
      }
      cols.push(col);
      for (var l2 = 0; l2 < lv; l2++) edges.push({ a: col[l2], b: col[l2 + 1], kind: 'v' });
    }
    for (var j2 = 0; j2 < 3; j2++) {
      var maxL = Math.min(cols[j2].length, cols[j2 + 1].length) - 1;
      edges.push({ a: cols[j2][0], b: cols[j2 + 1][0], kind: 'h' });
      for (var l3 = 1; l3 <= maxL; l3++) edges.push({ a: cols[j2][l3], b: cols[j2 + 1][l3], kind: 'h' });
      for (var l4 = 0; l4 < maxL; l4++) {
        if ((j2 + l4 + g) % 2 === 0) edges.push({ a: cols[j2][l4], b: cols[j2 + 1][l4 + 1], kind: 'd' });
        else edges.push({ a: cols[j2 + 1][l4], b: cols[j2][l4 + 1], kind: 'd' });
      }
    }
    x += 3 * cw + 52 * s + 20;
  }
}

// ---- spring physics: poles bend, never detach ------------------------------------------
function stepPhysics(dt) {
  var sway = Math.sin(T * Math.PI * 2 / 7);
  for (var i = 0; i < nodes.length; i++) {
    var nd = nodes[i];
    var tx = nd.hx + (nd.top > 0 ? 9 * nd.top * sway : 0);
    nd.vx += ((tx - nd.x) * 55 - nd.vx * 7.5) * dt;
    nd.vy += ((nd.hy - nd.y) * 55 - nd.vy * 7.5) * dt;
    nd.x += nd.vx * dt;
    nd.y += nd.vy * dt;
    var dx = nd.x - nd.hx, dy = nd.y - nd.hy;
    var d = Math.hypot(dx, dy);
    if (d > 115) { nd.x = nd.hx + dx / d * 115; nd.y = nd.hy + dy / d * 115; }
  }
}

function draw() {
  ctx.fillStyle = ROCK;
  ctx.fillRect(0, 0, W, H);
  var s = Math.min(W / 1200, H / 800);
  ctx.save();
  ctx.translate((W - 1200 * s) / 2, (H - 800 * s) / 2);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.rect(0, 0, 1200, 800);
  ctx.clip();

  // sky: flat pale rock tone, no gradient
  ctx.fillStyle = ROCK;
  ctx.fillRect(0, 0, 1200, 800);
  // the hillside, diagonal lower left to upper right
  ctx.fillStyle = mix(ROCK, GROUND, 0.30);
  ctx.beginPath();
  ctx.moveTo(0, slopeY(0)); ctx.lineTo(1200, slopeY(1200)); ctx.lineTo(1200, 800); ctx.lineTo(0, 800);
  ctx.closePath(); ctx.fill();
  // crest line
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, slopeY(0)); ctx.lineTo(1200, slopeY(1200));
  ctx.stroke();
  // feet pads at the column bases
  ctx.fillStyle = GROUND;
  baseNodes.forEach(function (nd) { ctx.fillRect(nd.hx - 15, nd.hy - 1, 30, 6); });

  ctx.lineCap = 'round';
  // diagonals in the pale blue
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = PALE;
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  edges.forEach(function (e) {
    if (e.kind === 'd') { ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); }
  });
  ctx.stroke();
  ctx.restore();
  // rails
  ctx.strokeStyle = BLUE;
  ctx.lineWidth = 4;
  ctx.beginPath();
  edges.forEach(function (e) {
    if (e.kind === 'h') { ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); }
  });
  ctx.stroke();
  // poles
  ctx.lineWidth = 5;
  ctx.beginPath();
  edges.forEach(function (e) {
    if (e.kind === 'v') { ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); }
  });
  ctx.stroke();
  // couplers
  ctx.fillStyle = PALE;
  nodes.forEach(function (nd) {
    ctx.beginPath();
    ctx.arc(nd.x, nd.y, 3.2, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

// ---- interaction: drag to disturb, double tap to reseed --------------------------------
var dragging = false, lastPX = 0, lastPY = 0, lastDown = -1e9;
function toScene(e) {
  var s = Math.min(W / 1200, H / 800);
  return {
    x: (e.clientX - (W - 1200 * s) / 2) / s,
    y: (e.clientY - (H - 800 * s) / 2) / s
  };
}
function poke(x, y, dx, dy) {
  var speed = Math.hypot(dx, dy);
  for (var i = 0; i < nodes.length; i++) {
    var nd = nodes[i];
    var ddx = nd.x - x, ddy = nd.y - y;
    var d = Math.hypot(ddx, ddy);
    if (d < 190) {
      var f = 1 - d / 190;
      nd.vx += dx * 1.9 * f + (ddx / Math.max(d, 1)) * speed * 0.85 * f;
      nd.vy += dy * 1.9 * f + (ddy / Math.max(d, 1)) * speed * 0.85 * f;
    }
  }
}
canvas.addEventListener('pointerdown', function (e) {
  if (e.timeStamp - lastDown < 320) {
    seedIdx++;
    buildLayout();
    lastDown = -1e9;
  } else {
    lastDown = e.timeStamp;
  }
  dragging = true;
  var p = toScene(e);
  lastPX = p.x; lastPY = p.y;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toScene(e);
  poke(p.x, p.y, p.x - lastPX, p.y - lastPY);
  lastPX = p.x; lastPY = p.y;
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.033, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  if (dt > 0) stepPhysics(dt);
  draw();
}
buildLayout();
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
