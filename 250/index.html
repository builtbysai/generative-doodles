<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.250 Sets of Three</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#8A8378; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.250 Sets of Three (Avantika Bawa). After her Blue
// Scaffolds in Zbayul: a climbable scaffold structure on a
// Ladakhi hillside, built by her sets-of-three rule. Three
// trios of three towers climb the slope, each trio smaller
// than the last, deep blue against pale rock. Transformed
// 2026: the rule is now the composition. Towers stand true,
// poles vertical and rails level, feet stilted down to the
// slope the way hillside scaffolding really stands; each
// trio runs a rhythm of three (towers of two, three and
// four levels); and a slow gust travels up the staircase,
// trio by trio, so the whole structure breathes instead of
// only the top. The layout is built from the viewport, no
// letterbox: the staircase fills a phone screen as fully
// as a desktop one. Drag across the structure and the poles
// bend aside on their springs and settle back; the system
// is the toy. Double tap reseeds the rhythms. The poles
// never detach or break.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BLUE = '#1450C8', PALE = '#7FB2F0', ROCK = '#8A8378', GROUND = '#141210';
var W = 0, H = 0, phone = false;
var T = 1.3, lastNow = -1; // frame one: staircase built, gust mid climb
var seedIdx = 0;
var nodes = [], edges = [], groundNodes = [];
var LH = 100; // level height of the first trio, set by layout

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// The hillside: a single straight crest running up to the right.
function slopeY(x) {
  var y0 = H * (phone ? 0.90 : 0.86), y1 = H * (phone ? 0.40 : 0.32);
  return y0 + (y1 - y0) * (W > 0 ? x / W : 0);
}

// ---- layout: three trios of three towers, each trio smaller -----------------------------
function buildLayout() {
  nodes = []; edges = []; groundNodes = [];
  if (W === 0 || H === 0) return;
  var r = rng(25013 + seedIdx * 104729);
  var ratio = 0.76 + r() * 0.08; // each trio smaller than the last
  var scales = [1, ratio, ratio * ratio];
  // rhythms of three: the level counts of a trio's three towers
  var rhythms = [[2, 3, 4], [4, 3, 2], [3, 4, 3], [2, 4, 3], [3, 2, 4], [4, 2, 3]];
  LH = H * (phone ? 0.088 : 0.126);
  var bayWanted = LH * 1.16;
  var gapU = 0.55; // inter-trio gap, in first-trio bays
  var totalW = 3 * bayWanted * (scales[0] + scales[1] + scales[2])
             + bayWanted * gapU * (scales[0] + scales[1]);
  var margin = W * 0.06;
  var bay = bayWanted;
  if (totalW > W - margin * 2) bay = bayWanted * (W - margin * 2) / totalW;
  var usedW = 3 * bay * (scales[0] + scales[1] + scales[2]) + bay * gapU * (scales[0] + scales[1]);
  var x = margin + Math.max(0, (W - margin * 2 - usedW) / 2);

  for (var g = 0; g < 3; g++) {
    var sc = scales[g];
    var bw = bay * sc, lvl = LH * sc;
    var pat = rhythms[Math.floor(r() * rhythms.length)];
    var colLevels = [pat[0], Math.max(pat[0], pat[1]), Math.max(pat[1], pat[2]), pat[2]];
    var colsX = [x, x + bw, x + 2 * bw, x + 3 * bw];
    // the trio's platform sits at its highest ground point; poles
    // stilt down from it to wherever the slope actually is
    var platY = Math.min(slopeY(colsX[0]), slopeY(colsX[1]), slopeY(colsX[2]), slopeY(colsX[3]));
    var amp = LH * (0.06 + 0.05 * g); // the gust lands hardest on the top trio
    var cols = [];
    for (var j = 0; j < 4; j++) {
      var cx = colsX[j];
      var col = [];
      var gn = { hx: cx, hy: slopeY(cx), x: cx, y: slopeY(cx), vx: 0, vy: 0, pin: true, w: 0, ph: 0, amp: 0 };
      nodes.push(gn); groundNodes.push(gn); col.push(gn);
      for (var l = 0; l <= colLevels[j]; l++) {
        var hy = platY - l * lvl;
        var nd = {
          hx: cx, hy: hy, x: cx, y: hy, vx: 0, vy: 0, pin: false,
          w: (l * lvl) / (4 * lvl), ph: g * 1.65 + j * 0.55, amp: amp
        };
        nodes.push(nd); col.push(nd);
        edges.push({ a: col[col.length - 2], b: nd, kind: 'v' });
      }
      cols.push(col);
    }
    // level rails between neighbouring columns, platform rail included
    for (var j2 = 0; j2 < 3; j2++) {
      var topRail = Math.min(colLevels[j2], colLevels[j2 + 1]);
      for (var l2 = 0; l2 <= topRail; l2++) {
        edges.push({ a: cols[j2][l2 + 1], b: cols[j2 + 1][l2 + 1], kind: 'h' });
      }
      // one diagonal per bay per level, alternating
      var segTop = Math.min(colLevels[j2], colLevels[j2 + 1]);
      for (var l3 = 0; l3 < segTop; l3++) {
        if ((j2 + l3 + g) % 2 === 0) edges.push({ a: cols[j2][l3 + 1], b: cols[j2 + 1][l3 + 2], kind: 'd' });
        else edges.push({ a: cols[j2 + 1][l3 + 1], b: cols[j2][l3 + 2], kind: 'd' });
      }
    }
    x += 3 * bw + bay * gapU * sc;
  }
}

// ---- spring physics: poles bend, never detach ------------------------------------------
function stepPhysics(dt) {
  var gust = T * Math.PI * 2 / 9.5; // one gust climbs the staircase every 9.5s
  for (var i = 0; i < nodes.length; i++) {
    var nd = nodes[i];
    if (nd.pin) continue;
    var tx = nd.hx + nd.amp * nd.w * nd.w * Math.sin(gust - nd.ph * 1.2);
    nd.vx += ((tx - nd.x) * 55 - nd.vx * 7.5) * dt;
    nd.vy += ((nd.hy - nd.y) * 55 - nd.vy * 7.5) * dt;
    nd.x += nd.vx * dt;
    nd.y += nd.vy * dt;
    var dx = nd.x - nd.hx, dy = nd.y - nd.hy;
    var d = Math.hypot(dx, dy);
    var maxD = LH * 1.7;
    if (d > maxD) { nd.x = nd.hx + dx / d * maxD; nd.y = nd.hy + dy / d * maxD; }
  }
}

function strokeKind(kind, style, width) {
  ctx.strokeStyle = style;
  ctx.lineWidth = width;
  ctx.beginPath();
  for (var i = 0; i < edges.length; i++) {
    var e = edges[i];
    if (e.kind === kind) { ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); }
  }
  ctx.stroke();
}

function draw() {
  ctx.fillStyle = ROCK;
  ctx.fillRect(0, 0, W, H);
  // the hillside below the crest, flat darker rock
  ctx.fillStyle = mix(ROCK, GROUND, 0.30);
  ctx.beginPath();
  ctx.moveTo(0, slopeY(0)); ctx.lineTo(W, slopeY(W)); ctx.lineTo(W, H); ctx.lineTo(0, H);
  ctx.closePath(); ctx.fill();
  // crest line
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = Math.max(2, LH * 0.03);
  ctx.beginPath();
  ctx.moveTo(0, slopeY(0)); ctx.lineTo(W, slopeY(W));
  ctx.stroke();

  ctx.lineCap = 'round';
  // the shadow the structure throws on the hill: the same drawing,
  // shifted down-slope, one flat dark tone, no blur, and clipped
  // to the hillside so it only ever falls on the hill
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, slopeY(0)); ctx.lineTo(W, slopeY(W)); ctx.lineTo(W, H); ctx.lineTo(0, H);
  ctx.closePath(); ctx.clip();
  ctx.translate(LH * 0.10, LH * 0.15);
  ctx.globalAlpha = 0.14;
  strokeKind('d', GROUND, LH * 0.05);
  strokeKind('h', GROUND, LH * 0.05);
  strokeKind('v', GROUND, LH * 0.062);
  ctx.restore();
  // feet pads where the stilts meet the slope
  ctx.fillStyle = GROUND;
  for (var i = 0; i < groundNodes.length; i++) {
    var gn = groundNodes[i];
    ctx.fillRect(gn.hx - LH * 0.13, gn.hy - 1, LH * 0.26, Math.max(3, LH * 0.05));
  }
  // diagonals in the pale blue
  ctx.save();
  ctx.globalAlpha = 0.9;
  strokeKind('d', PALE, Math.max(1.8, LH * 0.042));
  ctx.restore();
  // rails, then poles, in the deep blue
  strokeKind('h', BLUE, Math.max(2.4, LH * 0.055));
  strokeKind('v', BLUE, Math.max(3, LH * 0.068));
  // couplers
  ctx.fillStyle = PALE;
  var cr = Math.max(2, LH * 0.045);
  for (var j = 0; j < nodes.length; j++) {
    var nd = nodes[j];
    if (nd.pin) continue;
    ctx.beginPath();
    ctx.arc(nd.x, nd.y, cr, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---- interaction: drag to disturb, double tap to reseed --------------------------------
var dragging = false, lastPX = 0, lastPY = 0, lastDown = -1e9;
function poke(x, y, dx, dy) {
  var speed = Math.hypot(dx, dy);
  var radius = Math.max(120, LH * 2.1);
  for (var i = 0; i < nodes.length; i++) {
    var nd = nodes[i];
    if (nd.pin) continue;
    var ddx = nd.x - x, ddy = nd.y - y;
    var d = Math.hypot(ddx, ddy);
    if (d < radius) {
      var f = 1 - d / radius;
      nd.vx += dx * 1.9 * f + (ddx / Math.max(d, 1)) * speed * 0.85 * f;
      nd.vy += dy * 1.9 * f + (ddy / Math.max(d, 1)) * speed * 0.85 * f;
    }
  }
}
canvas.addEventListener('pointerdown', function (e) {
  if (e.timeStamp - lastDown < 320) {
    seedIdx++;
    buildLayout();
    lastDown = -1e9;
  } else {
    lastDown = e.timeStamp;
  }
  dragging = true;
  lastPX = e.clientX; lastPY = e.clientY;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  poke(e.clientX, e.clientY, e.clientX - lastPX, e.clientY - lastPY);
  lastPX = e.clientX; lastPY = e.clientY;
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  buildLayout();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.033, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  if (dt > 0) stepPhysics(dt);
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
