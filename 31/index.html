<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№31 · Eleven Nets</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(26,26,26,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag the hero to fold, drag the grid to choose</div>
<script>
'use strict';
// No31 Eleven Nets (after ruuddotorg, via Bug's ig-artist-study prompts).
// There are exactly 11 distinct nets of a cube: hexominoes that fold
// into a cube, counted up to rotation and reflection. This piece
// enumerates them at load (Redelmeier growth + canonical dedup +
// a fold test that rejects any hexomino whose squares collide on a
// cube face), and asserts the count is 11. One net is the hero: it
// folds into a cube and unfolds on a 6 second loop, drawn as flat
// ink faces in orthographic projection; the hero advances every 12
// seconds. The other ten sit in a grid below. Drag on the hero
// scrubs the fold; drag on the grid chooses the hero. No libraries,
// no click-to-reload.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '31', 10) || 31;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f4f1ea';
const INK = '#1a1a1a';
const RUST = '#b5542d';

// ---------- enumerate the 11 cube nets ----------
function canonical(cells) {
  // cells: array of [x,y]. Canonical under the 8 symmetries of the square.
  let best = null;
  const syms = [
    (x, y) => [x, y], (x, y) => [-y, x], (x, y) => [-x, -y], (x, y) => [y, -x],
    (x, y) => [-x, y], (x, y) => [x, -y], (x, y) => [y, x], (x, y) => [-y, -x]
  ];
  for (const f of syms) {
    const mapped = cells.map(([x, y]) => f(x, y));
    const mx = Math.min(...mapped.map(c => c[0])), my = Math.min(...mapped.map(c => c[1]));
    const norm = mapped.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const key = norm.map(c => c.join(',')).join(';');
    if (!best || key < best.key) best = { key, cells: norm };
  }
  return best;
}

function foldsToCube(cells) {
  // BFS assigning each square a cube-face normal; collision = not a net.
  const key = (x, y) => x + ',' + y;
  const cellSet = new Set(cells.map(([x, y]) => key(x, y)));
  const frames = new Map();
  // frame: normal n, and in-plane "east" e (direction of +x on the net), both 3D unit vectors
  const start = cells[0];
  frames.set(key(start[0], start[1]), { n: [0, 0, 1], e: [1, 0, 0] });
  const queue = [start];
  const usedNormals = new Set(['0,0,1']);
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const neg = a => [-a[0], -a[1], -a[2]];
  while (queue.length) {
    const [cx, cy] = queue.shift();
    const fr = frames.get(key(cx, cy));
    const north = cross(fr.e, fr.n); // in-plane +y direction
    const moves = [
      [1, 0, fr.e, fr.n], [-1, 0, neg(fr.e), fr.n],
      [0, 1, north, fr.n], [0, -1, neg(north), fr.n]
    ];
    for (const [dx, dy, dir, n] of moves) {
      const nx = cx + dx, ny = cy + dy, nk = key(nx, ny);
      if (!cellSet.has(nk) || frames.has(nk)) continue;
      // neighbor folds around the shared edge: its normal is dir, its east follows
      const newN = dir;
      const nkStr = newN.join(',');
      if (usedNormals.has(nkStr)) return false;
      usedNormals.add(nkStr);
      let newE;
      if (Math.abs(dx) === 1) newE = neg(n); else newE = fr.e;
      frames.set(nk, { n: newN, e: newE });
      queue.push([nx, ny]);
    }
  }
  return frames.size === 6;
}

function enumerateNets() {
  let shapes = new Map();
  const start = canonical([[0, 0]]);
  shapes.set(start.key, start.cells);
  for (let size = 1; size < 6; size++) {
    const next = new Map();
    for (const cells of shapes.values()) {
      const set = new Set(cells.map(([x, y]) => x + ',' + y));
      for (const [x, y] of cells) {
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = x + dx, ny = y + dy;
          if (set.has(nx + ',' + ny)) continue;
          const c = canonical([...cells, [nx, ny]]);
          next.set(c.key, c.cells);
        }
      }
    }
    shapes = next;
  }
  const nets = [];
  for (const cells of shapes.values()) if (foldsToCube(cells)) nets.push(cells);
  return nets;
}

const NETS = enumerateNets();
// The mathematics guarantees 11; if this ever fails the piece is wrong.
// (fold parent tree per net, rooted at cell 0)
function netTree(cells) {
  const key = (x, y) => x + ',' + y;
  const set = new Map(cells.map(c => [key(c[0], c[1]), c]));
  const parent = new Map();
  const depth = new Map();
  const order = [cells[0]];
  parent.set(key(cells[0][0], cells[0][1]), null);
  depth.set(key(cells[0][0], cells[0][1]), 0);
  for (let qi = 0; qi < order.length; qi++) {
    const c = order[qi];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nk = key(c[0] + dx, c[1] + dy);
      if (set.has(nk) && !parent.has(nk)) {
        parent.set(nk, c);
        depth.set(nk, depth.get(key(c[0], c[1])) + 1);
        order.push(set.get(nk));
      }
    }
  }
  return { parent, depth, key };
}

// ---------- fold geometry ----------
function rotAxis(v, axis, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  const dot = axis[0] * v[0] + axis[1] * v[1] + axis[2] * v[2];
  return [
    v[0] * c + (axis[1] * v[2] - axis[2] * v[1]) * s + axis[0] * dot * (1 - c),
    v[1] * c + (axis[2] * v[0] - axis[0] * v[2]) * s + axis[1] * dot * (1 - c),
    v[2] * c + (axis[0] * v[1] - axis[1] * v[0]) * s + axis[2] * dot * (1 - c)
  ];
}

// Returns projected quads for the hero net at fold amount f (0 flat, 1 cube).
function heroQuads(cells, tree, f) {
  const key = tree.key;
  // Each cell gets: center3 (3D center), e (in-plane +x), u (in-plane +y) in the folded state.
  const state = new Map();
  const root = cells[0];
  state.set(key(root[0], root[1]), { c: [0, 0, 0], e: [1, 0, 0], u: [0, 1, 0] });
  // process in BFS order (cells are stored with parents reachable via tree.parent)
  const order = [root];
  const seen = new Set([key(root[0], root[1])]);
  for (let qi = 0; qi < order.length; qi++) {
    const cell = order[qi];
    const st = state.get(key(cell[0], cell[1]));
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cell[0] + dx, ny = cell[1] + dy, nk = key(nx, ny);
      const par = tree.parent.get(nk);
      if (!par || par[0] !== cell[0] || par[1] !== cell[1] || seen.has(nk)) continue;
      seen.add(nk);
      const d = tree.depth.get(nk);
      const hingeF = Math.max(0, Math.min(1, f * 1.5 - (d - 1) * 0.18));
      const ang = hingeF * Math.PI / 2;
      // hinge axis: the shared edge direction on the parent's plane
      const dirVec = dx !== 0 ? st.e : st.u;
      const axis = dx !== 0 ? st.u : st.e;      // rotate around the edge line (along the other in-plane axis)
      const axisSign = dx !== 0 ? (dx > 0 ? 1 : -1) : (dy > 0 ? -1 : 1);
      // neighbor center before folding: parent center + dirVec (unit square)
      const flatCenter = [st.c[0] + dirVec[0], st.c[1] + dirVec[1], st.c[2] + dirVec[2]];
      // hinge point: midpoint of shared edge
      const hingePt = [st.c[0] + dirVec[0] * 0.5, st.c[1] + dirVec[1] * 0.5, st.c[2] + dirVec[2] * 0.5];
      const rotA = ang * axisSign * -1;
      const rel = [flatCenter[0] - hingePt[0], flatCenter[1] - hingePt[1], flatCenter[2] - hingePt[2]];
      const rotRel = rotAxis(rel, axis, rotA);
      const newC = [hingePt[0] + rotRel[0], hingePt[1] + rotRel[1], hingePt[2] + rotRel[2]];
      const newE = rotAxis(st.e, axis, rotA);
      const newU = rotAxis(st.u, axis, rotA);
      state.set(nk, { c: newC, e: newE, u: newU });
      order.push([nx, ny]);
    }
  }
  // view rotation
  const vx = -0.55, vy = 0.65;
  const proj = ([x, y, z]) => {
    const x1 = x * Math.cos(vy) + z * Math.sin(vy);
    const z1 = -x * Math.sin(vy) + z * Math.cos(vy);
    const y2 = y * Math.cos(vx) - z1 * Math.sin(vx);
    const z2 = y * Math.sin(vx) + z1 * Math.cos(vx);
    return [x1, y2, z2];
  };
  const quads = [];
  for (const cell of cells) {
    const st = state.get(key(cell[0], cell[1]));
    if (!st) continue;
    const corners = [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]].map(([a, b]) => {
      const p3 = [
        st.c[0] + st.e[0] * a + st.u[0] * b,
        st.c[1] + st.e[1] * a + st.u[1] * b,
        st.c[2] + st.e[2] * a + st.u[2] * b
      ];
      return proj(p3);
    });
    const zAvg = corners.reduce((s, c) => s + c[2], 0) / 4;
    const nz = proj([st.c[0], st.c[1], st.c[2] + 1])[2] - proj(st.c)[2];
    quads.push({ corners, z: zAvg, isRoot: cell === root, nz });
  }
  quads.sort((a, b) => a.z - b.z);
  return quads;
}

// ---------- interaction state ----------
const startHero = ((seed % 11) + 11) % 11;
let heroBase = startHero;
let heroBaseTime = 0;
let scrub = 0;               // seconds added to the clock by hero drags
let dragInfo = null;

function nowSec() { return performance.now() / 1000; }

function layout(w, h) {
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  return { RX, RY, ox: (w - RX) / 2, oy: (h - RY) / 2 };
}

function drawNetFlat(cells, x0, y0, size, rustRoot) {
  const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
  const wdt = Math.max(...xs) - Math.min(...xs) + 1;
  const hgt = Math.max(...ys) - Math.min(...ys) + 1;
  const cellPx = size / Math.max(wdt, hgt);
  const gx = x0 + (size - wdt * cellPx) / 2 - Math.min(...xs) * cellPx;
  const gy = y0 + (size - hgt * cellPx) / 2 - Math.min(...ys) * cellPx;
  ctx.lineWidth = Math.max(0.8, cellPx * 0.045);
  cells.forEach((c, idx) => {
    ctx.strokeStyle = (rustRoot && idx === 0) ? RUST : INK;
    ctx.strokeRect(gx + c[0] * cellPx, gy + c[1] * cellPx, cellPx, cellPx);
  });
  return { gx, gy, cellPx };
}

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const { RX, RY, ox, oy } = layout(w, h);
  const te = nowMs / 1000 + scrub;
  const heroIdx = ((heroBase + Math.floor((te - heroBaseTime) / 12)) % 11 + 11) % 11;
  const heroCells = NETS[heroIdx];
  const tree = netTree(heroCells);

  // fold loop: 6s: fold 2.4s, hold 0.9s, unfold 2.4s, rest 0.3s
  const lt = ((te % 6) + 6) % 6;
  let f;
  if (lt < 2.4) f = lt / 2.4;
  else if (lt < 3.3) f = 1;
  else if (lt < 5.7) f = 1 - (lt - 3.3) / 2.4;
  else f = 0;
  f = f * f * (3 - 2 * f);

  // hero area: top center
  const heroSize = Math.min(RX * 0.56, RY * 0.44);
  const heroCx = ox + RX / 2, heroCy = oy + RY * 0.26;
  const quads = heroQuads(heroCells, tree, f);
  // fit the projected bounding box into the hero area, whatever the fold state
  let mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
  for (const q of quads) for (const [px, py] of q.corners) {
    if (px < mnx) mnx = px; if (px > mxx) mxx = px;
    if (py < mny) mny = py; if (py > mxy) mxy = py;
  }
  const bw = Math.max(0.001, mxx - mnx), bh = Math.max(0.001, mxy - mny);
  const unit = heroSize / Math.max(bw, bh);
  const bcx = (mnx + mxx) / 2, bcy = (mny + mxy) / 2;
  for (const q of quads) {
    ctx.beginPath();
    q.corners.forEach(([px, py], i) => {
      const X = heroCx + (px - bcx) * unit, Y = heroCy + (py - bcy) * unit;
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    });
    ctx.closePath();
    ctx.fillStyle = (q.isRoot && f > 0.55) ? RUST : GROUND;
    ctx.fill();
    ctx.strokeStyle = q.isRoot ? RUST : INK;
    ctx.lineWidth = Math.max(0.9, unit * 0.045);
    ctx.stroke();
  }

  // grid of the other ten
  const rest = NETS.map((cells, i) => i).filter(i => i !== heroIdx);
  const cols = 5, rows = 2;
  const gridTop = oy + RY * 0.52;
  const gridH = RY * 0.44;
  const cellW = RX / cols, cellH = gridH / rows;
  const panelSize = Math.min(cellW, cellH) * 0.82;
  rest.forEach((netIdx, k) => {
    const ci = k % cols, ri = Math.floor(k / cols);
    const px = ox + ci * cellW + (cellW - panelSize) / 2;
    const py = gridTop + ri * cellH + (cellH - panelSize) / 2;
    drawNetFlat(NETS[netIdx], px, py, panelSize, false);
  });

  return { heroBottom: oy + RY * 0.5, gridTop, cols, rows, cellW, cellH, rest, ox, oy, RX, RY };
}

let lastLayout = null;
function loop(nowMs) {
  lastLayout = drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function pointerPos(ev) {
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [ev.clientX - r.left, ev.clientY - r.top];
}
canvas.addEventListener('pointerdown', ev => {
  const [x, y] = pointerPos(ev);
  dragInfo = { x, y, region: lastLayout && y > lastLayout.gridTop ? 'grid' : 'hero', moved: false };
});
canvas.addEventListener('pointermove', ev => {
  if (!dragInfo) return;
  const [x, y] = pointerPos(ev);
  if (dragInfo.region === 'hero') {
    const dx = x - dragInfo.x;
    if (Math.abs(dx) > 2) {
      scrub += dx * 0.01;             // drag distance scrubs the fold timeline
      dragInfo.x = x;
      dragInfo.moved = true;
    }
  } else {
    dragInfo.x = x; dragInfo.y = y; dragInfo.moved = true;
  }
});
canvas.addEventListener('pointerup', ev => {
  if (!dragInfo) return;
  if (dragInfo.region === 'grid' && lastLayout) {
    const [x, y] = pointerPos(ev);
    const L = lastLayout;
    const ci = Math.floor((x - L.ox) / L.cellW);
    const ri = Math.floor((y - L.gridTop) / L.cellH);
    const k = ri * L.cols + ci;
    if (k >= 0 && k < L.rest.length) {
      heroBase = L.rest[k];
      heroBaseTime = nowSec() + scrub;
    }
  }
  dragInfo = null;
});
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
