<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.270 Interlock</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#E4DCCB; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.270 Interlock (Shupiwe Chongwe). After her interlocking
// raku sculpture: two matte ceramic forms holding each other
// on a plain warm ground, one raku black with tan crackle
// veining, one warm stoneware with sparse darker veins. The
// unit is the couple, never the single hero object. Drag
// horizontally to pull the pair apart along their embrace;
// release and they settle back together with a slow,
// critically damped ease and no bounce. At rest the pair
// breathes faintly, about one percent on a slow sine.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BLACK = '#1C1A17', TAN = '#C9A876', STONE = '#8A5A3B', GROUND = '#E4DCCB', SHADOW = '#8B8172';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 1.4, lastNow = -1; // frame one: nested, breathing mid-cycle
var q = 1, qVel = 0; // interlock parameter: 1 nested, 0 separated
var dragging = false, dragStartX = 0, dragStartQ = 1;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- the two forms -------------------------------------------------------------------
// Smooth closed blob in local coords: seeded polar points
// joined by midpoint quadratic curves, so each silhouette
// is a soft ceramic lump rather than a polygon.
function makeBlob(seed, rx, ry, n, dir) {
  var r = rng(seed), pts = [];
  for (var i = 0; i < n; i++) {
    var a = i / n * Math.PI * 2;
    var v = 0.93 + r() * 0.13;
    var x = Math.cos(a) * rx * v, y = Math.sin(a) * ry * v;
    x *= 0.91 + 0.13 * ((Math.sin(a) + 1) / 2); // narrower shoulder, wider base: a vessel, not an egg
    if (x * dir > 0) x *= 1.06; // a gentle bulge toward the partner on the contact side
    pts.push({ x: x, y: y });
  }
  return pts;
}
function blobPath(pts) {
  var n = pts.length;
  var mx = (pts[n - 1].x + pts[0].x) / 2, my = (pts[n - 1].y + pts[0].y) / 2;
  ctx.beginPath();
  ctx.moveTo(mx, my);
  for (var i = 0; i < n; i++) {
    var p = pts[i], q2 = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p.x, p.y, (p.x + q2.x) / 2, (p.y + q2.y) / 2);
  }
  ctx.closePath();
}
// Crackle veins: seeded wandering polylines in local coords,
// clipped to the silhouette at draw time.
function makeVeins(seed, count, rx, ry, longEvery) {
  var r = rng(seed), veins = [];
  for (var i = 0; i < count; i++) {
    var x = 0, y = 0, tries = 0;
    do {
      x = (r() * 2 - 1) * rx * 0.88;
      y = (r() * 2 - 1) * ry * 0.88;
      tries++;
    } while ((x * x) / (rx * rx) + (y * y) / (ry * ry) > 0.78 && tries < 12);
    var segs = (i % longEvery === 0) ? 6 : 3 + Math.floor(r() * 3);
    var ang = r() * Math.PI * 2, pts = [{ x: x, y: y }];
    for (var k = 0; k < segs; k++) {
      ang += (r() - 0.5) * 1.5;
      var len = 13 + r() * 20;
      x += Math.cos(ang) * len;
      y += Math.sin(ang) * len;
      pts.push({ x: x, y: y });
    }
    veins.push({ pts: pts, x0: pts[0].x, a: 0.34 + r() * 0.42, w: 1.1 + r() * 0.9 });
  }
  return veins;
}
var leftPts = makeBlob(27011, 138, 192, 11, 1);
var rightPts = makeBlob(27023, 132, 184, 11, -1);
var leftVeins = makeVeins(27037, 27, 138, 192, 5);
var rightVeins = makeVeins(27049, 10, 132, 184, 4);

function drawForm(cx, cy, tilt, breathe, pts, fill, veins, veinHex, isLeft) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  ctx.scale(breathe, breathe);
  // body
  blobPath(pts);
  ctx.fillStyle = fill;
  ctx.fill();
  // matte surface shading, clipped to the silhouette:
  // a faint lightening high on the form, a soft darkening low
  ctx.save();
  blobPath(pts);
  ctx.clip();
  ctx.fillStyle = rgba(TAN, isLeft ? 0.05 : 0.07);
  ctx.beginPath(); ctx.ellipse(-54, -124, 122, 94, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(BLACK, isLeft ? 0.07 : 0.10);
  ctx.beginPath(); ctx.ellipse(48, 150, 140, 96, 0.2, 0, Math.PI * 2); ctx.fill();
  // crackle veining, clipped to the same path
  for (var i = 0; i < veins.length; i++) {
    var v = veins[i], a = v.a;
    if (isLeft && v.x0 > 22) a *= (0.18 + 0.82 * q);       // denser at the contact as q nears 1
    if (!isLeft && v.x0 < -22) a *= (0.28 + 0.72 * q);
    ctx.strokeStyle = rgba(veinHex, a);
    ctx.lineWidth = v.w;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(v.pts[0].x, v.pts[0].y);
    for (var k = 1; k < v.pts.length; k++) ctx.lineTo(v.pts[k].x, v.pts[k].y);
    ctx.stroke();
  }
  ctx.restore();
  // a quiet defining edge
  blobPath(pts);
  ctx.strokeStyle = rgba(BLACK, 0.16);
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var breathe = 1 + 0.01 * Math.sin(T * Math.PI * 2 / 8.5);
  var sep = (1 - q) * 150;
  var leftCx = 532 - sep, rightCx = 748 + sep;
  var leftCy = 448, rightCy = 456;
  // ---- soft contact shadow under the pair -------------------------------------------
  var shY = 656;
  ctx.fillStyle = rgba(SHADOW, 0.16);
  ctx.beginPath(); ctx.ellipse(640, shY, 252 + sep * 0.9, 27, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(SHADOW, 0.15);
  ctx.beginPath(); ctx.ellipse(leftCx, shY - 2, 148, 21, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(rightCx, shY, 142, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(mix(SHADOW, BLACK, 0.3), 0.10);
  ctx.beginPath(); ctx.ellipse(640, shY - 3, 168 + sep * 0.6, 15, 0, 0, Math.PI * 2); ctx.fill();
  // ---- the pair: stoneware behind, raku black in front -------------------------------
  drawForm(rightCx, rightCy, -0.07, breathe, rightPts, STONE, rightVeins, BLACK, false);
  drawForm(leftCx, leftCy, 0.07, breathe, leftPts, BLACK, leftVeins, TAN, true);
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag to separate ---------------------------------------------------------------------
function toDesign(e) { return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S }; }
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true;
  dragStartX = p.x;
  dragStartQ = q;
  qVel = 0;
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
  if (e.preventDefault) e.preventDefault();
});
window.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  q = clamp01(dragStartQ - Math.abs(p.x - dragStartX) / 320);
  qVel = 0;
});
function endDrag() { dragging = false; }
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the shaped pair keeps its proportions,
  // page ground is the piece ground colour
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2;
  OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  if (!dragging && q < 1) {
    // critically damped return: stiffness 1, damping 2, no bounce
    var acc = 1.0 * (1 - q) - 2.0 * qVel;
    qVel += acc * dt;
    q += qVel * dt;
    if (q > 1 || (q > 0.998 && Math.abs(qVel) < 0.01)) { q = 1; qVel = 0; }
    if (q < 0) { q = 0; qVel = 0; }
  }
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
