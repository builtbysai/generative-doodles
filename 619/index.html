<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№619 The Knock Counts</title>
<style>
  html, body { margin: 0; padding: 0; background: #17100a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // The Knock Counts, CW1 / PP1207, study #256 caius-williams.
  // A dark close view of wooden surface, scarred like a double
  // bass body, with a contact mic clamped near the bridge point.
  // Drones roll low while the surface is worked: bow strokes
  // rasp across as pale streaks, palm knocks land as expanding
  // rings, finger slides smear into the grain. The noise IS the
  // music, per Gwannach. No realistic bass model, no melody.
  // Visual only: the prompt's WebAudio is not built. The sound
  // runs as a closed-form model, no autoplay audio anywhere.
  var WOOD = '#8a5a28';     // wood amber, mid
  var WOOD_DK = '#5a3a1c';  // wood amber, dark grain
  var WOOD_LT = '#b07a3a';  // wood amber, light
  var SHADOW = '#0d0906';   // shadow black
  var GROUND = '#17100a';   // page ground, deep wood shadow
  var RING = '#f5ead6';     // knock rings, warm white
  var ASH = '#d8cfc0';      // bow streaks, pale ash
  var BRASS = '#c9a35a';    // mic brass
  var METAL = '#2a2a2e';    // mic body, dark metal
  var BREATH = '#f2ede1';   // plate white

  // Fixed-phase first frame: FIRST_T = 18.5 s. At t = 18.5 the
  // second bow stroke (12 to 20 s) is three quarters through,
  // so a long pale streak already crosses the wood, and the
  // knock at 18 s is half a second old, its warm white ring
  // just opening. Frame one already shows the surface worked.
  var FIRST_T = 18.5;
  var SEED = 1960;
  var CYCLE = 48; // one working cycle, in seconds

  // QA probe hooks, read at load only.
  // ?t=<seconds> or ?seed=<seconds> sets the virtual clock.
  // ?tap=x,y (fractions of stage) lands a palm knock at load.
  // ?bow=x0,y0,x1,y1 (fractions of stage) draws a bow stroke
  // at load. Both let the render tool verify that touch input
  // changes the scene.
  var probeT = null, probeTap = null, probeBow = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var mk = qs.match(/[?&]tap=([0-9.]+),([0-9.]+)/);
    if (mk) { probeTap = { x: parseFloat(mk[1]), y: parseFloat(mk[2]) }; }
    var mb = qs.match(/[?&]bow=([0-9.]+),([0-9.]+),([0-9.]+),([0-9.]+)/);
    if (mb) {
      probeBow = {
        x0: parseFloat(mb[1]), y0: parseFloat(mb[2]),
        x1: parseFloat(mb[3]), y1: parseFloat(mb[4])
      };
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and fixed salts, so every frame is a pure
  // function of t plus the recorded touch events.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // Touch events recorded live. Each knock is a point and the
  // virtual time it landed; each bow stroke is a polyline and
  // the time it finished, with a rasp value from drag speed.
  var knocks = [];
  var strokes = [];
  var curStroke = null; // stroke in progress while dragging
  var downAt = 0, downX = 0, downY = 0, downT = 0, moved = 0;

  // The working template, one 48 second cycle. Bow strokes
  // rasp across the wood; knocks land near the mic and the
  // lower grain where the hand works.
  var STROKES = [
    { s: 2, d: 6 },
    { s: 12, d: 8 },
    { s: 26, d: 5 },
    { s: 36, d: 8 }
  ];
  var KNOCK_T = [6, 10, 18, 24, 33, 41, 46];

  // Stroke path for a scheduled stroke: seeded per cycle and
  // index, a long diagonal across the wood with a slight bow.
  function strokePath(cycle, i) {
    var rng = mulberry32(SEED * 17 + cycle * 613 + i * 197 + 3);
    var x0 = W * (0.08 + rng() * 0.18);
    var y0 = H * (0.55 + rng() * 0.30);
    var x1 = W * (0.72 + rng() * 0.20);
    var y1 = H * (0.15 + rng() * 0.30);
    var cx = (x0 + x1) / 2 + (rng() - 0.5) * W * 0.22;
    var cy = (y0 + y1) / 2 + (rng() - 0.5) * H * 0.22;
    return { x0: x0, y0: y0, x1: x1, y1: y1, cx: cx, cy: cy };
  }

  // Knock point for a scheduled knock: seeded per cycle and
  // index, biased toward the mic and the lower working grain.
  function knockPoint(cycle, i) {
    var rng = mulberry32(SEED * 23 + cycle * 419 + i * 173 + 11);
    var near = rng() < 0.5;
    if (near) {
      return {
        x: W * 0.618 + (rng() - 0.5) * W * 0.30,
        y: H * 0.382 + (rng() - 0.5) * H * 0.30
      };
    }
    return {
      x: W * (0.15 + rng() * 0.70),
      y: H * (0.55 + rng() * 0.35)
    };
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function lerp(a, b, f) { return a + (b - a) * f; }
  function qpoint(p, s) {
    var mx = lerp(lerp(p.x0, p.cx, s), lerp(p.cx, p.x1, s), s);
    var my = lerp(lerp(p.y0, p.cy, s), lerp(p.cy, p.y1, s), s);
    return { x: mx, y: my };
  }

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    L.micX = W * 0.618;
    L.micY = H * 0.382;
    L.micR = Math.max(13, u * 0.030);
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The wood: amber ground, long wavy grain lines, a few pale
  // scars, two dark knots, and a vignette that deepens the
  // edges into shadow black. Grain and scars are seeded and
  // static, so the wood itself never flickers.
  function drawWood(t) {
    var grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, WOOD_LT);
    grad.addColorStop(0.5, WOOD);
    grad.addColorStop(1, WOOD_DK);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    var rng = mulberry32(SEED * 7 + 5);
    var i, j;
    // Grain lines: long, gently waving, darker than the ground.
    for (i = 0; i < 26; i++) {
      var gy = (i + 0.5) / 26 * H + (rng() - 0.5) * H * 0.02;
      var amp = (2 + rng() * 7) * (L.u / 560);
      var ph = rng() * Math.PI * 2;
      var wl = 0.7 + rng() * 0.7;
      ctx.strokeStyle = hexA(WOOD_DK, a4(0.16 + rng() * 0.16));
      ctx.lineWidth = 0.8 + rng() * 1.6;
      ctx.beginPath();
      for (j = 0; j <= 40; j++) {
        var gx = (j / 40) * W;
        var yy = gy + Math.sin(j / 40 * Math.PI * 2 * wl + ph) * amp;
        if (j === 0) { ctx.moveTo(gx, yy); } else { ctx.lineTo(gx, yy); }
      }
      ctx.stroke();
    }
    // Pale grain highlights, fewer and fainter.
    for (i = 0; i < 9; i++) {
      var hy = rng() * H;
      var hamp = (2 + rng() * 5) * (L.u / 560);
      var hph = rng() * Math.PI * 2;
      ctx.strokeStyle = hexA(WOOD_LT, a4(0.10 + rng() * 0.10));
      ctx.lineWidth = 0.8 + rng() * 1.2;
      ctx.beginPath();
      for (j = 0; j <= 40; j++) {
        var hx = (j / 40) * W;
        var hyy = hy + Math.sin(j / 40 * Math.PI * 2 * 0.9 + hph) * hamp;
        if (j === 0) { ctx.moveTo(hx, hyy); } else { ctx.lineTo(hx, hyy); }
      }
      ctx.stroke();
    }
    // Scars: short pale arcs where the bow has bitten before.
    for (i = 0; i < 5; i++) {
      var sx = rng() * W, sy = rng() * H;
      var sa = rng() * Math.PI * 2;
      var sl = (0.06 + rng() * 0.10) * L.u;
      ctx.strokeStyle = hexA(ASH, a4(0.14 + rng() * 0.10));
      ctx.lineWidth = 1 + rng() * 1.4;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(
        sx + Math.cos(sa) * sl * 0.5, sy + Math.sin(sa) * sl * 0.5 + (rng() - 0.5) * 8,
        sx + Math.cos(sa) * sl, sy + Math.sin(sa) * sl
      );
      ctx.stroke();
    }
    // Two knots: dark ellipses ringed with grain.
    var knots = [
      { x: 0.24, y: 0.72, r: 0.045 },
      { x: 0.82, y: 0.62, r: 0.032 }
    ];
    for (i = 0; i < knots.length; i++) {
      var k = knots[i];
      var kx = k.x * W, ky = k.y * H, kr = k.r * L.u;
      var ki;
      for (ki = 3; ki >= 1; ki--) {
        ctx.strokeStyle = hexA(WOOD_DK, a4(0.20 + ki * 0.06));
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(kx + kr * ki * 0.6, ky);
        ctx.ellipse(kx, ky, kr * ki * 0.6, kr * ki * 0.4, 0.3, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = hexA(SHADOW, a4(0.55));
      ctx.beginPath();
      ctx.moveTo(kx + kr * 0.35, ky);
      ctx.ellipse(kx, ky, kr * 0.35, kr * 0.22, 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    // Vignette: edges fall into shadow black.
    var vg = ctx.createRadialGradient(
      W / 2, H / 2, L.u * 0.35, W / 2, H / 2, L.u * 0.78
    );
    vg.addColorStop(0, hexA(SHADOW, a4(0)));
    vg.addColorStop(1, hexA(SHADOW, a4(0.55)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // The contact mic at the golden-ratio point: a dark puck
  // with a brass rim, a clamp arm, and a cable snaking off
  // the lower edge. A slow breathing glow shows it listening.
  function drawMic(t) {
    var breathe = 0.5 + 0.5 * Math.sin(t * 0.6);
    var glowR = L.micR * (4.2 + breathe * 0.8);
    var gg = ctx.createRadialGradient(L.micX, L.micY, L.micR * 0.4, L.micX, L.micY, glowR);
    gg.addColorStop(0, hexA(RING, a4(0.10 + 0.05 * breathe)));
    gg.addColorStop(1, hexA(RING, a4(0)));
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.moveTo(L.micX + glowR, L.micY);
    ctx.arc(L.micX, L.micY, glowR, 0, Math.PI * 2);
    ctx.fill();

    // Cable: a dark curve from the mic to the bottom edge.
    ctx.strokeStyle = hexA(SHADOW, a4(0.75));
    ctx.lineWidth = Math.max(2, L.u * 0.006);
    ctx.beginPath();
    ctx.moveTo(L.micX, L.micY + L.micR * 0.6);
    ctx.bezierCurveTo(
      L.micX + L.u * 0.10, L.micY + L.u * 0.16,
      L.micX - L.u * 0.06, L.micY + L.u * 0.28,
      L.micX + L.u * 0.02, H + 4
    );
    ctx.stroke();

    // Clamp arm up to the top edge.
    ctx.strokeStyle = hexA(METAL, a4(0.9));
    ctx.lineWidth = Math.max(3, L.u * 0.009);
    ctx.beginPath();
    ctx.moveTo(L.micX, L.micY - L.micR);
    ctx.lineTo(L.micX - L.u * 0.02, L.micY - L.u * 0.10);
    ctx.stroke();

    // Puck body and brass rim.
    ctx.fillStyle = hexA(METAL, a4(0.95));
    ctx.beginPath();
    ctx.moveTo(L.micX + L.micR, L.micY);
    ctx.arc(L.micX, L.micY, L.micR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = hexA(BRASS, a4(0.9));
    ctx.lineWidth = Math.max(1.6, L.u * 0.004);
    ctx.beginPath();
    ctx.moveTo(L.micX + L.micR, L.micY);
    ctx.arc(L.micX, L.micY, L.micR, 0, Math.PI * 2);
    ctx.stroke();
    // Inner disc and centre dot.
    ctx.fillStyle = hexA(BRASS, a4(0.55));
    ctx.beginPath();
    ctx.moveTo(L.micX + L.micR * 0.55, L.micY);
    ctx.arc(L.micX, L.micY, L.micR * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = hexA(SHADOW, a4(0.8));
    ctx.beginPath();
    ctx.moveTo(L.micX + L.micR * 0.18, L.micY);
    ctx.arc(L.micX, L.micY, L.micR * 0.18, 0, Math.PI * 2);
    ctx.fill();
  }

  // One bow stroke: pale ash streaks along the path up to the
  // played fraction, rasp shown as short cross ticks whose
  // density follows the envelope. A finished stroke lingers
  // as a fading smear for 6 seconds.
  function drawBowStroke(path, p, alpha, salt) {
    if (p <= 0.001 || alpha <= 0.01) { return; }
    var env = Math.sin(Math.PI * clamp(p, 0, 1));
    var a = alpha * (0.35 + 0.65 * env);
    var steps = 28, i;
    var offs = [-3, 0, 3];
    for (var o = 0; o < offs.length; o++) {
      var off = offs[o] * (L.u / 560);
      ctx.strokeStyle = hexA(ASH, a4(a * (o === 1 ? 0.85 : 0.5)));
      ctx.lineWidth = (o === 1 ? 2.2 : 1.2) * (L.u / 560);
      ctx.beginPath();
      for (i = 0; i <= steps; i++) {
        var s = (i / steps) * p;
        var pt = qpoint(path, s);
        var nx = pt.x + off, ny = pt.y + off * 0.4;
        if (i === 0) { ctx.moveTo(nx, ny); } else { ctx.lineTo(nx, ny); }
      }
      ctx.stroke();
    }
    // Rasp ticks: short cross marks along the played streak.
    var rng = mulberry32(salt);
    var ticks = Math.floor(10 * env) + 2;
    ctx.strokeStyle = hexA(ASH, a4(a * 0.7));
    ctx.lineWidth = 1;
    for (i = 0; i < ticks; i++) {
      var ts = rng() * p;
      var tp = qpoint(path, ts);
      var tl = (3 + rng() * 6) * (L.u / 560);
      var ta = rng() * Math.PI;
      ctx.beginPath();
      ctx.moveTo(tp.x - Math.cos(ta) * tl, tp.y - Math.sin(ta) * tl);
      ctx.lineTo(tp.x + Math.cos(ta) * tl, tp.y + Math.sin(ta) * tl);
      ctx.stroke();
    }
    // Bright head where the bow is now.
    if (p < 1) {
      var hp = qpoint(path, p);
      var hr = Math.max(4, L.u * 0.010);
      ctx.fillStyle = hexA(RING, a4(0.85 * a));
      ctx.beginPath();
      ctx.moveTo(hp.x + hr, hp.y);
      ctx.arc(hp.x, hp.y, hr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // One palm knock: warm white rings expanding from the
  // landing point over 2.5 seconds, plus a dark impact dot.
  function drawKnock(x, y, age) {
    if (age < 0 || age > 2.5) { return; }
    var f = age / 2.5;
    var fade = 1 - f;
    var rmax = L.u * 0.16;
    var r = Math.pow(f, 0.7) * rmax;
    ctx.strokeStyle = hexA(RING, a4(0.9 * fade));
    ctx.lineWidth = Math.max(1.6, L.u * 0.005) * (1 - f * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    if (r * 0.6 > 1) {
      ctx.strokeStyle = hexA(RING, a4(0.5 * fade));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + r * 0.6, y);
      ctx.arc(x, y, r * 0.6, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = hexA(SHADOW, a4(0.5 * fade));
    ctx.beginPath();
    ctx.moveTo(x + L.u * 0.012, y);
    ctx.arc(x, y, L.u * 0.012, 0, Math.PI * 2);
    ctx.fill();
  }

  // A recorded touch bow stroke: the visitor's own polyline,
  // fading over 5 seconds after it was drawn.
  function drawUserStroke(st, t) {
    var age = t - st.t0;
    if (age < 0 || age > 5 || st.pts.length < 2) { return; }
    var a = (1 - age / 5) * clamp(st.rasp, 0.4, 1);
    ctx.strokeStyle = hexA(ASH, a4(0.8 * a));
    ctx.lineWidth = 2.2 * (L.u / 560);
    ctx.beginPath();
    ctx.moveTo(st.pts[0].x, st.pts[0].y);
    var i;
    for (i = 1; i < st.pts.length; i++) { ctx.lineTo(st.pts[i].x, st.pts[i].y); }
    ctx.stroke();
    ctx.strokeStyle = hexA(ASH, a4(0.35 * a));
    ctx.lineWidth = 5 * (L.u / 560);
    ctx.beginPath();
    ctx.moveTo(st.pts[0].x, st.pts[0].y);
    for (i = 1; i < st.pts.length; i++) { ctx.lineTo(st.pts[i].x, st.pts[i].y); }
    ctx.stroke();
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    drawWood(t);
    drawMic(t);

    // Scheduled bow strokes: this cycle and the previous one,
    // so a stroke fading across the cycle boundary still shows.
    var cycle = Math.floor(t / CYCLE);
    var ci, i;
    for (ci = cycle - 1; ci <= cycle; ci++) {
      for (i = 0; i < STROKES.length; i++) {
        var st = STROKES[i];
        var start = ci * CYCLE + st.s;
        var end = start + st.d;
        if (t < start) { continue; }
        var path = strokePath(ci, i);
        var salt = SEED * 29 + ci * 701 + i * 113;
        if (t <= end) {
          drawBowStroke(path, (t - start) / st.d, 1, salt);
        } else if (t <= end + 6) {
          drawBowStroke(path, 1, 1 - (t - end) / 6, salt);
        }
      }
      for (i = 0; i < KNOCK_T.length; i++) {
        var kt = ci * CYCLE + KNOCK_T[i];
        if (t < kt || t > kt + 2.5) { continue; }
        var kp = knockPoint(ci, i);
        drawKnock(kp.x, kp.y, t - kt);
      }
    }

    // Visitor strokes and knocks, newest first so the freshest
    // mark sits on top.
    var j;
    for (j = strokes.length - 1; j >= 0; j--) { drawUserStroke(strokes[j], t); }
    if (curStroke && curStroke.pts.length >= 2) {
      drawUserStroke({ pts: curStroke.pts, t0: t, rasp: curStroke.rasp }, t);
    }
    for (j = knocks.length - 1; j >= 0; j--) {
      drawKnock(knocks[j].x, knocks[j].y, t - knocks[j].t0);
    }

    // ---- Plates: title top-left, number and date below it,
    // a short descriptor top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = BREATH;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Knock Counts', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(BREATH, 0.8);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№619 · 2003 · 09 · 22', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(BREATH, 0.65);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('scarred wood, one contact mic', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom, breath white on a
    // faint dark pill so it stays legible over the wood.
    var hint = 'Drag to bow the wood. Tap to knock.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(SHADOW, a4(0.45));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(BREATH, a4(0.25));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = hexA(BREATH, a4(0.9));
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function posOf(e) {
    var r = { left: 0, top: 0 };
    try {
      if (typeof canvas.getBoundingClientRect === 'function') {
        r = canvas.getBoundingClientRect();
      }
    } catch (err) {}
    var cx = (typeof e.clientX === 'number') ? e.clientX : 0;
    var cy = (typeof e.clientY === 'number') ? e.clientY : 0;
    return { x: cx - r.left, y: cy - r.top };
  }

  function onDown(e) {
    var p = posOf(e);
    downAt = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    downX = p.x; downY = p.y; downT = lastT; moved = 0;
    curStroke = { pts: [{ x: p.x, y: p.y }], rasp: 0.6 };
    if (typeof e.preventDefault === 'function') { e.preventDefault(); }
  }
  function onMove(e) {
    if (!curStroke) { return; }
    var p = posOf(e);
    var last = curStroke.pts[curStroke.pts.length - 1];
    var dx = p.x - last.x, dy = p.y - last.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 2) { return; }
    moved += dist;
    // Drag speed sets the rasp: quick bowing rasps harder.
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var dt = Math.max(1, now - downAt);
    curStroke.rasp = clamp(0.35 + (moved / Math.max(dt, 1)) * 0.9, 0.35, 1);
    curStroke.pts.push({ x: p.x, y: p.y });
    if (curStroke.pts.length > 120) { curStroke.pts.shift(); }
    if (typeof e.preventDefault === 'function') { e.preventDefault(); }
  }
  function onUp(e) {
    if (!curStroke) { return; }
    var p = posOf(e);
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var quick = (now - downAt) < 250;
    if (quick && moved < 12) {
      // A quick tap lands a palm knock where the hand fell.
      knocks.push({ x: p.x, y: p.y, t0: lastT });
      if (knocks.length > 12) { knocks.shift(); }
    } else if (curStroke.pts.length >= 2) {
      strokes.push({ pts: curStroke.pts.slice(), t0: lastT, rasp: curStroke.rasp });
      if (strokes.length > 8) { strokes.shift(); }
    }
    curStroke = null;
    if (typeof e.preventDefault === 'function') { e.preventDefault(); }
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { curStroke = null; });
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1960 exposes the cycle and the first frame.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1960 = {
      cycle: CYCLE,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T,
      knock: function (fx, fy) { knocks.push({ x: fx * W, y: fy * H, t0: lastT }); },
      bow: function (fx0, fy0, fx1, fy1) {
        strokes.push({
          pts: [{ x: fx0 * W, y: fy0 * H }, { x: fx1 * W, y: fy1 * H }],
          t0: lastT, rasp: 0.9
        });
      }
    };
  } catch (e) {}

  resize();

  // Seeded QA probes at load: a knock and a bow stroke placed
  // by query params, so the render tool can verify touch input
  // changes the scene without a live pointer.
  if (probeTap) {
    knocks.push({ x: probeTap.x * W, y: probeTap.y * H, t0: FIRST_T });
  }
  if (probeBow) {
    strokes.push({
      pts: [
        { x: probeBow.x0 * W, y: probeBow.y0 * H },
        { x: (probeBow.x0 + probeBow.x1) / 2 * W, y: (probeBow.y0 + probeBow.y1) / 2 * H },
        { x: probeBow.x1 * W, y: probeBow.y1 * H }
      ],
      t0: FIRST_T, rasp: 0.9
    });
  }

  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the mic glow breathes at about 0.1 Hz and the
  // working cycle advances through its 48 s round, all well
  // under the 14 Hz ceiling. Guarded so node-canvas QA (no
  // requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
