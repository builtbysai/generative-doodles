<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Mirror Is the Law</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5F1E8; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var PAPER = '#F5F1E8';
  var LEAF = '#5C8A4D';
  var DEEP = '#3E6B35';
  var PINK = '#E87B9C';
  var SUN = '#E8B93B';
  var BARK = '#6B4A2E';

  // ---------- seeded rng ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(619075);      // tree generation stream (fixed)
  var rngFx = mulberry32(619331);    // flourish scheduling stream (fixed)

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300;

  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && typeof window.innerWidth === 'number') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = W; h = H; }
    return { w: Math.max(50, Math.floor(w)), h: Math.max(50, Math.floor(h)) };
  }

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999; sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  // layout metrics, recomputed on resize
  var CX = 0, BASE = 0, S = 100, PHONE = false;
  function layout() {
    PHONE = isPhone();
    CX = W / 2;
    // fit: crown half-width 0.41*S (plus leaf reach), crown height 0.97*S
    S = Math.min(0.94 * W / 0.90, 0.82 * H / 0.97);
    BASE = (H - 1.05 * S) / 2 + 0.97 * S; // vertically centered, sunflower below
  }

  function resize() {
    var s = viewSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    layout();
  }

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }

  // ---------- tree generation: LEFT half only, normalized coords ----------
  // Origin at trunk base, y grows downward-negative (up = negative), tree height ~1.
  var branches = [];   // {x1,y1,x2,y2,depth,w}
  var nodes = [];      // attach points {x,y,depth,ang} for leaves / blossoms / flourishes
  var MAXD = 6;

  function grow(x, y, ang, len, depth) {
    var x2 = x + Math.sin(ang) * len;
    var y2 = y - Math.cos(ang) * len;
    branches.push({ x1: x, y1: y, x2: x2, y2: y2, depth: depth, w: len });
    if (depth >= 3) nodes.push({ x: x2, y: y2, depth: depth, ang: ang });
    if (depth >= MAXD || len < 0.02) return;
    var kids = depth < 2 ? 2 : (rng() < 0.82 ? 2 : 1);
    for (var i = 0; i < kids; i++) {
      var spread = 0.28 + rng() * 0.38;
      var na = ang + (i === 0 ? -spread : spread * (0.55 + rng() * 0.5));
      // keep the half a half: never lean across the mirror line
      if (na > 0.02) na = 0.02 - rng() * 0.18;
      grow(x2, y2, na, len * (0.72 + rng() * 0.14), depth + 1);
    }
    if (depth >= 2 && rng() < 0.4) { // an extra side twig, still leftward
      grow(x2, y2, ang - (0.5 + rng() * 0.4), len * 0.55, depth + 1);
    }
  }

  // trunk top at (0,-0.30); main limbs fan left and up
  grow(0, -0.30, -0.55, 0.20, 1);
  grow(0, -0.30, -0.18, 0.22, 1);
  grow(0, -0.34, -0.95, 0.16, 1);

  // normalize: crown half-width -> 0.41, crown height -> 0.97, whatever the seed grew
  (function normalize() {
    var mx = 0.0001, my = 0.0001, i, b;
    for (i = 0; i < branches.length; i++) {
      b = branches[i];
      mx = Math.max(mx, Math.abs(b.x1), Math.abs(b.x2));
      my = Math.max(my, -b.y1, -b.y2);
    }
    var sx = mx > 0.41 ? 0.41 / mx : 1;
    var sy = my > 0.97 ? 0.97 / my : 1;
    function fix(o) { o.x *= sx; o.y = -0.30 + (o.y + 0.30) * sy; }
    for (i = 0; i < branches.length; i++) {
      b = branches[i];
      var p1 = { x: b.x1, y: b.y1 }, p2 = { x: b.x2, y: b.y2 };
      fix(p1); fix(p2);
      b.x1 = p1.x; b.y1 = p1.y; b.x2 = p2.x; b.y2 = p2.y;
    }
    for (i = 0; i < nodes.length; i++) fix(nodes[i]);
  })();

  // leaves and blossoms riding the nodes
  var leaves = [], blooms = [];
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var lr = rng();
    if (lr < 0.78) {
      leaves.push({ x: n.x, y: n.y, depth: n.depth, ang: n.ang - 0.7 + rng() * 1.4,
                    sz: 0.020 + rng() * 0.016, deep: rng() < 0.45, ph: rng() * 6.283 });
      if (rng() < 0.5) {
        leaves.push({ x: n.x, y: n.y, depth: n.depth, ang: n.ang + 0.9 + rng() * 0.8,
                      sz: 0.016 + rng() * 0.013, deep: rng() < 0.5, ph: rng() * 6.283 });
      }
    }
    if (n.depth >= 3 && rng() < 0.34) {
      blooms.push({ x: n.x, y: n.y, depth: n.depth, r: 0.011 + rng() * 0.008, ph: rng() * 6.283 });
    }
  }

  // ---------- flourishes: the asymmetric events ----------
  // state: 'linger' (fully present, one side) -> 'correct' (twin fades in over 4 s) -> settled pair
  var flourishes = [];
  var settled = [];  // corrected pairs, now part of the tree, drawn on both sides
  var nextAuto = 14; // first spontaneous flourish at ~14 s

  function pickNode() {
    var idx = Math.floor(rngFx() * nodes.length);
    return nodes[idx];
  }

  function addFlourish(kind, node, side, linger, now) {
    flourishes.push({
      x: node.x, y: node.y, depth: node.depth, kind: kind,
      side: side, born: now, linger: linger,
      sz: kind === 'flower' ? 0.016 + rngFx() * 0.008 : 0.020 + rngFx() * 0.012,
      ang: -0.8 + rngFx() * 1.6, ph: rngFx() * 6.283
    });
  }

  // gust state
  var gustAmp = 0, gustStart = -10;

  // ---------- point transform: sway + gust, zero at t = 0 ----------
  function swayX(nx, ny, depth, t) {
    var ph = depth * 0.85;
    var s = (Math.sin(0.7 * t + ph) - Math.sin(ph)) * 0.014 * (-ny);
    var g = gustAmp * Math.max(0, 1 - (t - gustStart) / 2.8) * (-ny) * 0.05;
    return s + g;
  }
  function px(nx, ny, depth, t) { return CX + (nx + swayX(nx, ny, depth, t)) * S; }
  function py(ny) { return BASE + ny * S; }

  // ---------- drawing helpers ----------
  function leafShape(x, y, ang, sz, color) {
    var c = Math.cos(ang), s = Math.sin(ang);
    var tipX = x + c * sz, tipY = y + s * sz;
    var mx = x + c * sz * 0.5, my = y + s * sz * 0.5;
    var nx = -s * sz * 0.30, ny = c * sz * 0.30;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(mx + nx, my + ny, tipX, tipY);
    ctx.quadraticCurveTo(mx - nx, my - ny, x, y);
    ctx.fill();
  }

  function bloomShape(x, y, r, pulse) {
    var rr = r * pulse;
    ctx.fillStyle = PINK;
    for (var i = 0; i < 5; i++) {
      var a = (i / 5) * 6.283 + 0.5;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * rr * 0.62, y + Math.sin(a) * rr * 0.62, rr * 0.55, 0, 6.283);
      ctx.fill();
    }
    ctx.fillStyle = SUN;
    ctx.beginPath(); ctx.arc(x, y, rr * 0.34, 0, 6.283); ctx.fill();
  }

  function budShape(x, y, sz, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y - sz * 0.3, sz * 0.34, sz * 0.55, 0, 0, 6.283);
    ctx.fill();
  }

  function drawFlourishMark(f, alpha, scale, t) {
    var X = px(f.x, f.y, f.depth, t), Y = py(f.y);
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    if (f.kind === 'flower') {
      bloomShape(X, Y, f.sz * S * scale, 1);
    } else if (f.kind === 'leaf') {
      leafShape(X, Y, f.ang, f.sz * S * scale, f.deep ? DEEP : LEAF);
    } else {
      budShape(X, Y, f.sz * S * scale, DEEP);
    }
    ctx.restore();
  }

  // draw the whole left half; caller sets the mirror transform when needed
  function drawHalf(t) {
    var i, b;
    ctx.strokeStyle = BARK;
    ctx.lineCap = 'round';
    for (i = 0; i < branches.length; i++) {
      b = branches[i];
      var x1 = px(b.x1, b.y1, b.depth, t), y1 = py(b.y1);
      var x2 = px(b.x2, b.y2, b.depth, t), y2 = py(b.y2);
      var mx = (x1 + x2) / 2 + (y2 - y1) * 0.08, my = (y1 + y2) / 2;
      ctx.lineWidth = Math.max(0.7, (0.014 - b.depth * 0.0018) * S);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(mx, my, x2, y2);
      ctx.stroke();
    }
    for (i = 0; i < leaves.length; i++) {
      var L = leaves[i];
      var tilt = (Math.sin(0.9 * t + L.ph) - Math.sin(L.ph)) * 0.18;
      leafShape(px(L.x, L.y, L.depth, t), py(L.y), L.ang + tilt, L.sz * S, L.deep ? DEEP : LEAF);
    }
    for (i = 0; i < blooms.length; i++) {
      var B = blooms[i];
      var pulse = 1 + 0.10 * (Math.sin(1.3 * t + B.ph) - Math.sin(B.ph));
      bloomShape(px(B.x, B.y, B.depth, t), py(B.y), B.r * S, pulse);
    }
    // settled flourish pairs belong to the tree now: drawn identically in both halves
    for (i = 0; i < settled.length; i++) {
      drawFlourishMark(settled[i], 1, 1, t);
    }
  }

  function drawTrunkAndSun(t) {
    // trunk, exactly on the mirror line, drawn once
    var sway0 = (Math.sin(0.7 * t) - 0) * 0.004 * S;
    var bx = CX, by = BASE;
    var tx = CX + sway0 * 0.3, ty = py(-0.30);
    ctx.strokeStyle = BARK;
    ctx.lineCap = 'round';
    ctx.lineWidth = 0.030 * S;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx, (by + ty) / 2, tx, ty); ctx.stroke();
    ctx.lineWidth = 0.020 * S;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(CX + swayX(0, -0.36, 1, t) * S, py(-0.36)); ctx.stroke();

    // sunflower base at the roots
    var r = 0.052 * S;
    var cxp = CX, cyp = BASE - r * 0.35;
    ctx.fillStyle = SUN;
    for (var i = 0; i < 12; i++) {
      var a = (i / 12) * 6.283;
      ctx.save();
      ctx.translate(cxp, cyp);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(r * 1.25, 0, r * 0.52, r * 0.20, 0, 0, 6.283);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = BARK;
    ctx.beginPath(); ctx.arc(cxp, cyp, r * 0.78, 0, 6.283); ctx.fill();
    ctx.fillStyle = SUN;
    ctx.beginPath(); ctx.arc(cxp, cyp, r * 0.08, 0, 6.283); ctx.fill();
    for (var j = 0; j < 6; j++) { // seed ring at 60-degree steps: mirror-symmetric
      var aa = j * 1.0472 + 0.5236;
      ctx.beginPath(); ctx.arc(cxp + Math.cos(aa) * r * 0.42, cyp + Math.sin(aa) * r * 0.42, r * 0.07, 0, 6.283); ctx.fill();
    }
  }

  // ---------- flourish lifecycle ----------
  function updateFlourishes(t) {
    if (t >= nextAuto) {
      var n = pickNode();
      addFlourish(rngFx() < 0.45 ? 'flower' : (rngFx() < 0.5 ? 'leaf' : 'bud'),
                  n, rngFx() < 0.5 ? 1 : -1, 2.5 + rngFx() * 2, t);
      nextAuto = t + 12 + rngFx() * 5;
    }
    for (var i = flourishes.length - 1; i >= 0; i--) {
      var f = flourishes[i];
      var age = t - f.born;
      if (age > f.linger + 4) { // correction complete: the pair joins the tree
        settled.push(f);
        flourishes.splice(i, 1);
      }
    }
  }

  function drawFlourishes(t) {
    for (var i = 0; i < flourishes.length; i++) {
      var f = flourishes[i];
      var age = t - f.born;
      var grow = Math.min(1, age / 0.7);
      var corr = age <= f.linger ? 0 : Math.min(1, (age - f.linger) / 4);
      // original side
      ctx.save();
      if (f.side < 0) { ctx.translate(CX, 0); ctx.scale(-1, 1); ctx.translate(-CX, 0); }
      drawFlourishMark(f, grow, 0.5 + 0.5 * grow, t);
      ctx.restore();
      // mirrored twin fades in while the mirror corrects
      if (corr > 0) {
        ctx.save();
        if (f.side > 0) { ctx.translate(CX, 0); ctx.scale(-1, 1); ctx.translate(-CX, 0); }
        drawFlourishMark(f, corr, 0.5 + 0.5 * corr, t);
        ctx.restore();
      }
    }
  }

  // ---------- main draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    updateFlourishes(t);

    drawHalf(t); // left
    ctx.save();
    ctx.translate(CX, 0); ctx.scale(-1, 1); ctx.translate(-CX, 0);
    drawHalf(t); // right, the mirror
    ctx.restore();

    drawTrunkAndSun(t);
    drawFlourishes(t);
  }

  // ---------- interaction ----------
  var downAt = 0, downX = 0, downY = 0, dragging = false, lastX = 0;

  function evPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: CX, y: H / 2 };
  }

  function nearestNode(x, y) {
    var best = null, bd = 1e18;
    for (var i = 0; i < nodes.length; i++) {
      var nx = px(nodes[i].x, nodes[i].y, nodes[i].depth, lastT);
      var ny = py(nodes[i].y);
      var d1 = (nx - x) * (nx - x) + (ny - y) * (ny - y);
      var mx = 2 * CX - nx;
      var d2 = (mx - x) * (mx - x) + (ny - y) * (ny - y);
      if (d1 < bd) { bd = d1; best = { node: nodes[i], side: 1 }; }
      if (d2 < bd) { bd = d2; best = { node: nodes[i], side: -1 }; }
    }
    return best;
  }

  var lastT = 0;
  function onDown(e) {
    var p = evPos(e);
    downAt = lastT; downX = p.x; downY = p.y; lastX = p.x; dragging = false;
  }
  function onMove(e) {
    if (downAt < 0) return;
    var p = evPos(e);
    if (Math.abs(p.x - downX) + Math.abs(p.y - downY) > 14) dragging = true;
    if (dragging) {
      gustAmp = Math.min(1, gustAmp + Math.abs(p.x - lastX) / 160 + 0.08);
      gustStart = lastT;
      lastX = p.x;
    }
  }
  function onUp(e) {
    var p = evPos(e);
    if (dragging) {
      // a gust leaves a few asymmetric buds behind for the mirror to correct
      var k = 2 + Math.floor(rngFx() * 2);
      for (var i = 0; i < k; i++) {
        addFlourish(rngFx() < 0.5 ? 'bud' : 'leaf', pickNode(), rngFx() < 0.5 ? 1 : -1, 2 + rngFx() * 2, lastT);
      }
    } else {
      // tap: one deliberate asymmetric flower, snapped to the nearest branch point
      var hit = nearestNode(p.x, p.y);
      if (hit) addFlourish('flower', hit.node, hit.side, 5, lastT);
    }
    downAt = -1; dragging = false;
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown);
    canvas.addEventListener('touchend', onUp);
  }

  // ---------- run ----------
  resize();
  draw(0); // frame one: perfect symmetry, sway phase 0, no flourish
  var startTs = null;
  function tick(ts) {
    if (startTs === null) startTs = ts;
    lastT = (ts - startTs) / 1000;
    if (gustAmp > 0 && lastT - gustStart > 2.8) gustAmp = Math.max(0, gustAmp - 0.02);
    draw(lastT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
</body>
</html>
