<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Type Is the Face</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2B705; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var DW = 1080, DH = 1080;              // design stage, square logic
  var PHASE0 = 1.7;                      // constant first-frame phase, seconds
  var YELLOW = '#F2B705';                // ground
  var INK = '#141414';                   // dot ink / eyes / mouth
  var CREAM = '#F7F2E4';                 // cloud
  var BLUE = '#2B4FB0';                  // letter line-work
  var RED = '#E63E1B';                   // ring
  var PINK = '#F0608E';                  // bottom strip
  var STRIP_H = 40;

  var CX = DW / 2, CY = 515;             // cloud centre
  var CR = 297;                          // cloud base radius (diameter ~55% of stage)

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- hand-drawn glyph alphabet ----------
  // Each glyph: list of strokes; each stroke a list of [x, y] in a 100x100 box
  // (y down, 0 = cap top, 100 = baseline). Arcs are pre-flattened polylines.
  function arcPts(cx, cy, rx, ry, a0, a1, n) {
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var a = a0 + (a1 - a0) * (i / n);
      pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
    }
    return pts;
  }
  var GLYPHS = {
    A: [[[6, 96], [50, 6], [94, 96]], [[27, 62], [73, 62]]],
    B: [[[24, 6], [24, 96]],
        arcPts(24, 28, 30, 22, -Math.PI / 2, Math.PI / 2, 10),
        arcPts(24, 68, 34, 26, -Math.PI / 2, Math.PI / 2, 10)],
    C: [arcPts(54, 50, 42, 46, 0.96, Math.PI * 2 - 0.96, 20)],
    D: [[[24, 6], [24, 96]], arcPts(24, 50, 52, 46, -Math.PI / 2, Math.PI / 2, 14)],
    E: [[[76, 8], [24, 8], [24, 96], [78, 96]], [[24, 50], [64, 50]]],
    F: [[[78, 8], [24, 8], [24, 96]], [[24, 48], [62, 48]]],
    G: [arcPts(54, 50, 42, 46, 0.96, Math.PI * 2 - 0.96, 20),
        [[58, 56], [94, 56], [94, 82]]],
    H: [[[22, 6], [22, 96]], [[78, 6], [78, 96]], [[22, 51], [78, 51]]],
    K: [[[24, 6], [24, 96]], [[76, 8], [26, 52]], [[34, 44], [78, 96]]],
    L: [[[26, 6], [26, 94], [78, 94]]],
    M: [[[10, 96], [10, 8], [50, 58], [90, 8], [90, 96]]],
    N: [[[14, 96], [14, 8], [86, 96], [86, 8]]],
    O: [arcPts(50, 50, 40, 46, 0, Math.PI * 2, 24)],
    P: [[[24, 96], [24, 6]], arcPts(24, 28, 32, 22, -Math.PI / 2, Math.PI / 2, 10)],
    R: [[[24, 96], [24, 6]], arcPts(24, 28, 32, 22, -Math.PI / 2, Math.PI / 2, 10),
        [[44, 48], [78, 96]]],
    S: [[[80, 20], [62, 6], [36, 8], [20, 22], [26, 38], [48, 47],
         [70, 55], [82, 70], [72, 88], [46, 96], [22, 86]]],
    T: [[[8, 10], [92, 10]], [[50, 10], [50, 96]]],
    U: [[[16, 6], [15, 50], [22, 78], [38, 93], [50, 95], [62, 93],
         [78, 78], [85, 50], [84, 6]]],
    V: [[[8, 6], [50, 96], [92, 6]]],
    Z: [[[14, 10], [86, 10], [14, 92], [88, 92]]]
  };
  var POOL = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'K', 'L',
              'M', 'N', 'O', 'P', 'R', 'S', 'T', 'U', 'V', 'Z'];
  // Face-feature slots inside the cloud (offsets from cloud centre), filled
  // in this order so partial rows stay balanced: top row, middle row, then
  // the bottom row centre-first.
  var SLOTS = [[-112, -140], [0, -140], [112, -140],
               [-112, -56], [0, -56], [112, -56],
               [0, 20], [-112, 20], [112, 20]];

  // ---------- cloud geometry (fixed composition) ----------
  function cloudRadius(th) {
    return CR * (1 + 0.045 * Math.sin(3 * th + 1.7)
                   + 0.035 * Math.sin(6 * th + 0.4)
                   + 0.025 * Math.sin(9 * th + 2.9));
  }
  function cloudPath() {
    ctx.beginPath();
    for (var d = 0; d <= 360; d += 3) {
      var th = d * Math.PI / 180;
      var r = cloudRadius(th);
      var x = CX + r * Math.cos(th), y = CY + r * Math.sin(th);
      if (d === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
  function insideCloud(x, y, margin) {
    var dx = x - CX, dy = y - CY;
    var d = Math.sqrt(dx * dx + dy * dy);
    var th = Math.atan2(dy, dx);
    return d < cloudRadius(th) - margin;
  }

  // ---------- scene ----------
  var seed = 514003;
  try {
    var m = /[?&]seed=(\d+)/.exec(location.search || '');
    if (m) seed = parseInt(m[1], 10) >>> 0;
  } catch (e) { /* fixed seed stands */ }

  var scene = null;
  function buildScene(s) {
    var rng = mulberry32(s);

    // polka-dot field: seeded grid, uniform pitch with jitter
    var pitch = 92 + Math.floor(rng() * 22);            // 92..113
    var dots = [];
    for (var gy = pitch * 0.55; gy < DH - STRIP_H - 14; gy += pitch) {
      for (var gx = pitch * 0.55; gx < DW - 10; gx += pitch) {
        var jx = gx + (rng() * 2 - 1) * pitch * 0.18;
        var jy = gy + (rng() * 2 - 1) * pitch * 0.18;
        if (insideCloud(jx, jy, -34)) continue;         // dots never under the cloud/ring
        if (jx < 150 && jy < 90) continue;              // keep the hint corner clear
        dots.push([jx, jy]);
      }
    }

    // crayon specks: ground layer + cloud interior layer, precomputed
    var groundSpecks = [];
    for (var i = 0; i < 420; i++) {
      groundSpecks.push([rng() * DW, rng() * DH, 1.2 + rng() * 2.0]);
    }
    var cloudSpecks = [];
    var guard = 0;
    while (cloudSpecks.length < 260 && guard++ < 4000) {
      var sx = CX + (rng() * 2 - 1) * CR;
      var sy = CY + (rng() * 2 - 1) * CR;
      if (insideCloud(sx, sy, 26)) {
        cloudSpecks.push([sx, sy, 1.1 + rng() * 1.9, rng() < 0.5 ? 0 : 1]);
      }
    }

    // letters: shuffled pool, 6-9 of them, at the face-feature slots
    var count = 6 + Math.floor(rng() * 4);
    var order = POOL.slice();
    for (var k = order.length - 1; k > 0; k--) {
      var j = Math.floor(rng() * (k + 1));
      var tmp = order[k]; order[k] = order[j]; order[j] = tmp;
    }
    var letters = [];
    for (var n = 0; n < count; n++) {
      var ch = order[n];
      var slot = SLOTS[n];
      var passes = 2 + Math.floor(rng() * 3);           // traced 2-4 times
      var offs = [];
      for (var p = 0; p < passes; p++) {
        offs.push([(rng() * 2 - 1) * 3.4, (rng() * 2 - 1) * 3.4]);
      }
      // hand wobble baked into this instance's points
      var strokes = GLYPHS[ch].map(function (stroke) {
        return stroke.map(function (pt) {
          return [pt[0] + (rng() * 2 - 1) * 1.6, pt[1] + (rng() * 2 - 1) * 1.6];
        });
      });
      letters.push({
        ch: ch,
        hx: CX + slot[0] + (rng() * 2 - 1) * 15,
        hy: CY + slot[1] + (rng() * 2 - 1) * 12,
        size: 68 + rng() * 14,                          // glyph box edge, stage px
        rot: (rng() * 2 - 1) * 0.05,
        offs: offs,
        strokes: strokes,
        phase: rng() * Math.PI * 2,
        period: 3.2 + rng() * 0.9
      });
    }
    return { pitch: pitch, dots: dots, groundSpecks: groundSpecks,
             cloudSpecks: cloudSpecks, letters: letters };
  }

  // per-letter spring state (offsets from home), reset on reseed
  var states = [];
  function resetStates() {
    states = scene.letters.map(function () {
      return { ox: 0, oy: 0, vx: 0, vy: 0 };
    });
  }
  scene = buildScene(seed);
  resetStates();

  // ---------- viewport ----------
  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    return [w, h];
  }
  function isPhone() {
    var sz = viewSize(), w = sz[0], h = sz[1];
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }
  var lastScale = 1, lastOx = 0, lastOy = 0;

  // ---------- drawing ----------
  function drawLetter(L, st, t) {
    var breathe = 1 + 0.02 * Math.sin(Math.PI * 2 * t / L.period + L.phase);
    var sc = (L.size / 100) * breathe;
    ctx.save();
    ctx.translate(L.hx + st.ox, L.hy + st.oy);
    ctx.rotate(L.rot);
    ctx.scale(sc, sc);
    ctx.translate(-50, -50);
    ctx.strokeStyle = BLUE;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var p = 0; p < L.offs.length; p++) {
      ctx.save();
      ctx.translate(L.offs[p][0], L.offs[p][1]);
      for (var s = 0; s < L.strokes.length; s++) {
        var stroke = L.strokes[s];
        ctx.beginPath();
        for (var i = 0; i < stroke.length; i++) {
          if (i === 0) ctx.moveTo(stroke[i][0], stroke[i][1]);
          else ctx.lineTo(stroke[i][0], stroke[i][1]);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function draw(t) {
    var sz = viewSize(), w = sz[0], h = sz[1];
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var phone = isPhone(); // square stage letterboxes on phones; ground stays the yellow
    void phone;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = YELLOW;
    ctx.fillRect(0, 0, w, h);

    var s = Math.min(w / DW, h / DH);
    var ox = (w - DW * s) / 2, oy = (h - DH * s) / 2;
    lastScale = s; lastOx = ox; lastOy = oy;
    ctx.setTransform(s, 0, 0, s, ox, oy);

    // pink anchor strip along the bottom of the stage
    ctx.fillStyle = PINK;
    ctx.fillRect(0, DH - STRIP_H, DW, STRIP_H);

    // polka dots, ground only
    ctx.fillStyle = INK;
    for (var i = 0; i < scene.dots.length; i++) {
      ctx.beginPath();
      ctx.arc(scene.dots[i][0], scene.dots[i][1], 7.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // crayon grain on the ground
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = INK;
    for (i = 0; i < scene.groundSpecks.length; i++) {
      var g = scene.groundSpecks[i];
      ctx.fillRect(g[0], g[1], g[2], g[2]);
    }
    ctx.globalAlpha = 1;

    // scalloped cloud, cream fill
    cloudPath();
    ctx.fillStyle = CREAM;
    ctx.fill();

    // crayon grain inside the cloud, clipped to it
    ctx.save();
    cloudPath();
    ctx.clip();
    for (i = 0; i < scene.cloudSpecks.length; i++) {
      var c = scene.cloudSpecks[i];
      ctx.globalAlpha = c[3] === 0 ? 0.05 : 0.04;
      ctx.fillStyle = c[3] === 0 ? BLUE : INK;
      ctx.fillRect(c[0], c[1], c[2], c[2]);
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // thick red ring framing the cloud
    cloudPath();
    ctx.strokeStyle = RED;
    ctx.lineWidth = 30;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // the letters: the face, breathing
    for (i = 0; i < scene.letters.length; i++) {
      drawLetter(scene.letters[i], states[i], t);
    }

    // two plain dot eyes below the letters
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(CX - 58, CY + 88, 11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(CX + 58, CY + 88, 11, 0, Math.PI * 2); ctx.fill();

    // one wavy nose-mouth line, drawn last
    ctx.strokeStyle = INK;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var mx = -54; mx <= 54; mx += 6) {
      var my = CY + 142 + Math.sin(mx / 54 * Math.PI * 2.2) * 6.5;
      if (mx === -54) ctx.moveTo(CX + mx, my); else ctx.lineTo(CX + mx, my);
    }
    ctx.stroke();

    // hint
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = INK;
    ctx.font = '600 ' + Math.round(25 * s) + 'px "Comic Sans MS", "Segoe Print", cursive, sans-serif';
    ctx.fillText('drag', ox + 26 * s, oy + 44 * s);
    ctx.globalAlpha = 1;
  }

  // ---------- springs ----------
  function stepSprings(dt) {
    var maxD = CR * 0.58;
    for (var i = 0; i < states.length; i++) {
      if (drag && drag.index === i) continue;
      var st = states[i], L = scene.letters[i];
      var steps = Math.max(1, Math.ceil(dt / (1 / 240)));
      var h = dt / steps;
      for (var q = 0; q < steps; q++) {
        st.vx += (-110 * st.ox - 13 * st.vx) * h;
        st.vy += (-110 * st.oy - 13 * st.vy) * h;
        st.ox += st.vx * h;
        st.oy += st.vy * h;
      }
      // a letter never leaves the cloud, even mid-spring
      var cxp = L.hx + st.ox - CX, cyp = L.hy + st.oy - CY;
      var d = Math.sqrt(cxp * cxp + cyp * cyp);
      if (d > maxD) {
        st.ox = CX + cxp / d * maxD - L.hx;
        st.oy = CY + cyp / d * maxD - L.hy;
      }
      if (Math.abs(st.ox) < 0.01 && Math.abs(st.vx) < 0.01) { st.ox = 0; st.vx = 0; }
      if (Math.abs(st.oy) < 0.01 && Math.abs(st.vy) < 0.01) { st.oy = 0; st.vy = 0; }
    }
  }

  // ---------- interaction: drag a letter, double-tap reseeds ----------
  var drag = null;
  var lastTap = -1;
  var elapsed = 0;

  function toStage(ev) {
    var x = 0, y = 0;
    try {
      var r = canvas.getBoundingClientRect();
      x = ev.clientX - r.left; y = ev.clientY - r.top;
    } catch (e) {
      x = ev.clientX || 0; y = ev.clientY || 0;
    }
    return [(x - lastOx) / lastScale, (y - lastOy) / lastScale];
  }
  function reseed() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    scene = buildScene(seed);
    resetStates();
    draw(PHASE0 + elapsed);
  }
  canvas.addEventListener('pointerdown', function (ev) {
    var now = ev && typeof ev.timeStamp === 'number' ? ev.timeStamp : 0;
    if (lastTap >= 0 && now - lastTap < 350) { lastTap = -1; drag = null; reseed(); return; }
    lastTap = now;
    var p = toStage(ev);
    for (var i = scene.letters.length - 1; i >= 0; i--) {
      var L = scene.letters[i], st = states[i];
      var dx = p[0] - (L.hx + st.ox), dy = p[1] - (L.hy + st.oy);
      if (Math.sqrt(dx * dx + dy * dy) < L.size * 0.62) {
        drag = { index: i, sx: p[0], sy: p[1], ox0: st.ox, oy0: st.oy };
        st.vx = 0; st.vy = 0;
        try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* not vital */ }
        return;
      }
    }
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    var p = toStage(ev);
    var L = scene.letters[drag.index], st = states[drag.index];
    st.ox = drag.ox0 + (p[0] - drag.sx);
    st.oy = drag.oy0 + (p[1] - drag.sy);
    var cxp = L.hx + st.ox - CX, cyp = L.hy + st.oy - CY;
    var maxD = CR * 0.58;
    var d = Math.sqrt(cxp * cxp + cyp * cyp);
    if (d > maxD) {
      st.ox = CX + cxp / d * maxD - L.hx;
      st.oy = CY + cyp / d * maxD - L.hy;
    }
    draw(PHASE0 + elapsed);
  });
  function endDrag() { drag = null; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('dblclick', function () { lastTap = -1; drag = null; reseed(); });

  // ---------- resize + loop ----------
  function onResize() { draw(PHASE0 + elapsed); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    window.addEventListener('resize', onResize);
  }

  draw(PHASE0); // synchronous deterministic first frame

  var startStamp = null;
  var lastStamp = null;
  function tick(now) {
    if (startStamp === null) { startStamp = now; lastStamp = now; }
    elapsed = (now - startStamp) / 1000;
    var dt = Math.min(0.05, (now - lastStamp) / 1000);
    lastStamp = now;
    stepSprings(dt);
    draw(PHASE0 + elapsed);
    requestAnimationFrame(tick);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
</body>
</html>
