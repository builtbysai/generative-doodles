<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1942 Wind Pressure</title>
<style>
  html, body { margin: 0; padding: 0; background: #241608; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Wind Pressure, KD7 / PP1189, study #253 kit-downes.
  // A forest of square wooden organ pipes seen from inside the case.
  // One control exists: wind. Drag vertically to raise the pressure
  // and the forest trembles, the shadows shift, a few pipes overblow
  // into thin pale blue screams. Ease off and the forest settles
  // back into its idle hum.
  var WOOD = '#b07a3a';     // pipe wood amber, mid tone
  var WOOD_L = '#c99a55';   // pipe wood, sunlit face
  var WOOD_D = '#7a4e22';   // pipe wood, shadow face
  var SHADOW = '#3a2415';   // deep shadow brown
  var GROUND = '#241608';   // case ground
  var SUN = '#f7e8c8';      // slanting sunlight, warm white
  var SCREAM = '#a8c8e0';   // overblow streaks, pale blue
  var SCREAM_CORE = '#d6e8f5';
  var INK = '#f2e6cc';      // plate ink, warm white
  var GAUGE_RIM = '#c99a55';
  var GAUGE_RED = '#c25a3a';

  // Fixed-phase first frame: FIRST_T = 8 s. At t = 8 the wind is at
  // idle, the pipes are nearly still, no pipe has overblown yet, and
  // the sunlight sits mid-slant, so frame one is a calm forest and
  // the first drag is the discovery.
  var FIRST_T = 8;
  var IDLE_WIND = 0.12;
  var OVERBLOW_DUR = 0.35; // fraction of each overblow cycle

  // Seeded PRNG, mulberry32. Fresh instances per draw from the piece
  // number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // QA probe hooks: ?seed= varies the pipe field, ?sx=/?sy= place a
  // drag at load (vertical position sets wind: top is full pressure).
  var probe = { seed: 1942, sx: null, sy: null };
  try {
    var locSearch = '';
    if (typeof location !== 'undefined' && location.search) { locSearch = location.search; }
    var q = new URLSearchParams(locSearch);
    var s = q.get('seed');
    if (s !== null && !isNaN(parseInt(s, 10))) { probe.seed = parseInt(s, 10); }
    var px = q.get('sx'), py = q.get('sy');
    if (px !== null && !isNaN(parseFloat(px))) { probe.sx = parseFloat(px); }
    if (py !== null && !isNaN(parseFloat(py))) { probe.sy = parseFloat(py); }
  } catch (e) {}

  // Pipe field, fixed at load from the seed. Six receding ranks, back
  // to front; each pipe carries its own tremble phase and frequency,
  // its own overblow threshold and overblow phase, and its own wood
  // shade. Nothing here depends on t.
  var RANKS = [];
  (function buildField() {
    var rng = mulberry32(probe.seed);
    var r, i;
    for (r = 0; r < 6; r++) {
      var count = 9 + r;
      var pipes = [];
      for (i = 0; i < count; i++) {
        pipes.push({
          x: (i + 0.5) / count + (rng() - 0.5) * 0.02,
          shade: 0.82 + rng() * 0.36,
          phase: rng() * Math.PI * 2,
          freq: 2.2 + rng() * 1.6,          // Hz, under the 14 Hz ceiling
          thresh: 0.72 + rng() * 0.20,     // overblow pressure threshold
          obPhase: rng(),                  // overblow cycle phase
          grain: rng()
        });
      }
      RANKS.push({ count: count, pipes: pipes });
    }
  })();

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var dragging = false;
  var wind = IDLE_WIND, windTarget = IDLE_WIND;
  var probeHold = false;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function shadeHex(h, f) {
    var r = Math.round(parseInt(h.slice(1, 3), 16) * f);
    var g = Math.round(parseInt(h.slice(3, 5), 16) * f);
    var b = Math.round(parseInt(h.slice(5, 7), 16) * f);
    r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // Layout, recomputed in resize() and read by draw().
  var L = {};
  function layout() {
    var sc = Math.min(W, H) / 720;
    var headerH = Math.round(H * 0.115);
    var hintH = Math.round(H * 0.055);
    var gaugeR = Math.round(30 * clamp(sc, 0.8, 1.25));
    L = {
      headerH: headerH, hintH: hintH,
      gaugeX: W - gaugeR - 16, gaugeY: gaugeR + 16, gaugeR: gaugeR,
      sc: sc
    };
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
    layout();
  }

  // Wind state: while dragging, the wind chases the drag position
  // fast; on release it settles slowly back to idle. The probe holds
  // the wind where ?sy= put it so a probe render shows the pressure.
  function stepWind(t) {
    var dt = clamp(t - lastT, 0, 2);
    lastT = t;
    if (probeHold) { return; }
    var rate = dragging ? 6 : 0.35;
    wind += (windTarget - wind) * Math.min(1, dt * rate);
    if (!dragging) { wind += (IDLE_WIND - wind) * Math.min(1, dt * 0.35); }
    wind = clamp(wind, 0, 1);
  }

  function windFromY(y) {
    // Top of the frame is full pressure, bottom is idle.
    return clamp(1 - y / H, 0, 1) * 0.88 + IDLE_WIND;
  }

  // ---- The pipe forest, back rank to front.
  function drawPipes(t) {
    var r, i;
    for (r = 0; r < RANKS.length; r++) {
      var rank = RANKS[r];
      var yBase = H * (0.20 + r * 0.144);
      var ph = H * (0.085 + r * 0.048);
      var pw = (W / rank.count) * 0.78;
      var depth = 1 - r * 0.09; // back ranks darker, smaller
      for (i = 0; i < rank.pipes.length; i++) {
        var p = rank.pipes[i];
        var tremble = Math.sin(t * p.freq * Math.PI * 2 + p.phase) * wind * pw * 0.055;
        var shiver = Math.cos(t * p.freq * Math.PI * 2 * 0.5 + p.phase) * wind * ph * 0.02;
        var cx = p.x * W + tremble;
        var x0 = cx - pw / 2, y0 = yBase - ph + shiver;
        var body = shadeHex(WOOD, p.shade * depth);
        var light = shadeHex(WOOD_L, p.shade * depth);
        var dark = shadeHex(WOOD_D, p.shade * depth);
        // Body.
        ctx.fillStyle = body;
        ctx.fillRect(x0, y0, pw, ph);
        // Sunlit left face, shadow right face.
        ctx.fillStyle = hexA(WOOD_L, a4(0.35 * depth));
        ctx.fillRect(x0, y0, pw * 0.18, ph);
        ctx.fillStyle = hexA(SHADOW, a4(0.45));
        ctx.fillRect(x0 + pw * 0.78, y0, pw * 0.22, ph);
        // Wood grain, one seeded vertical line per pipe.
        ctx.strokeStyle = hexA(SHADOW, a4(0.25 * depth));
        ctx.lineWidth = 1;
        ctx.beginPath();
        var gx = x0 + pw * (0.3 + p.grain * 0.4);
        ctx.moveTo(gx, y0 + ph * 0.08);
        ctx.lineTo(gx + tremble * 0.3, y0 + ph * 0.94);
        ctx.stroke();
        // Mouth: dark slot at the top with a pale lip.
        var over = wind > p.thresh;
        ctx.fillStyle = over ? hexA('#1a2a3a', 0.95) : hexA('#160d05', 0.95);
        ctx.fillRect(x0 + pw * 0.08, y0, pw * 0.84, Math.max(3, ph * 0.07));
        ctx.fillStyle = over ? hexA(SCREAM_CORE, 0.7) : hexA(SUN, 0.55);
        ctx.fillRect(x0 + pw * 0.08, y0 + Math.max(3, ph * 0.07), pw * 0.84, 2);
        // Base shadow under each pipe, grounding the rank.
        ctx.fillStyle = hexA(SHADOW, a4(0.30));
        ctx.fillRect(x0, yBase, pw, Math.max(2, ph * 0.05));
      }
    }
  }

  // ---- Slanting sunlight, warm white bands from the top left.
  // The whole slant drifts with the wind.
  function drawSunlight(t) {
    var shift = wind * 46 * Math.sin(t * 0.4 + 1);
    var k;
    for (k = 0; k < 4; k++) {
      var x0 = W * (0.02 + k * 0.27) + shift * (0.6 + k * 0.2);
      var bw = W * 0.085;
      var slant = H * 0.48;
      ctx.fillStyle = hexA(SUN, a4(0.10 + wind * 0.05));
      ctx.beginPath();
      ctx.moveTo(x0, -20);
      ctx.lineTo(x0 + bw, -20);
      ctx.lineTo(x0 + bw + slant, H + 20);
      ctx.lineTo(x0 + slant, H + 20);
      ctx.closePath();
      ctx.fill();
    }
    // Soft glow where the light enters, top left.
    var glow = ctx.createRadialGradient(W * 0.08, H * 0.04, 0, W * 0.08, H * 0.04, W * 0.55);
    glow.addColorStop(0, hexA(SUN, a4(0.22 + wind * 0.08)));
    glow.addColorStop(1, hexA(SUN, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- Carved screen shadow: a diagonal lattice crossing the lower
  // right. Its displacement scales with the wind.
  function drawScreenShadow(t) {
    var dx = wind * 34 * Math.sin(t * 0.5 + 0.6);
    var dy = wind * 18 * Math.cos(t * 0.34);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(W * 0.42, H);
    ctx.lineTo(W, H * 0.52);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.clip();
    ctx.strokeStyle = hexA(SHADOW, 0.42);
    ctx.lineWidth = Math.max(6, W * 0.012);
    ctx.beginPath();
    var i, x;
    for (i = -8; i < 24; i++) {
      x = i * W * 0.055 + dx;
      ctx.moveTo(x, H * 0.5 + dy);
      ctx.lineTo(x + H * 0.55, H + dy);
    }
    ctx.stroke();
    ctx.strokeStyle = hexA(SHADOW, 0.26);
    ctx.lineWidth = Math.max(4, W * 0.008);
    ctx.beginPath();
    for (i = -8; i < 24; i++) {
      x = i * W * 0.055 - dx * 0.7;
      ctx.moveTo(x, H + dy);
      ctx.lineTo(x + H * 0.55, H * 0.5 + dy);
    }
    ctx.stroke();
    ctx.restore();
  }

  // ---- Air shimmer: faint wavy lines whose amplitude follows wind.
  function drawShimmer(t) {
    var amp = wind * 7;
    if (amp < 0.4) { return; }
    var i, x;
    ctx.lineWidth = 1.5;
    for (i = 0; i < 5; i++) {
      var y = H * (0.28 + i * 0.11);
      ctx.strokeStyle = hexA(SUN, a4(0.05 + wind * 0.12));
      ctx.beginPath();
      for (x = 0; x <= W; x += 16) {
        var yy = y + Math.sin(x * 0.02 + t * 2.2 + i * 1.7) * amp;
        if (x === 0) { ctx.moveTo(x, yy); } else { ctx.lineTo(x, yy); }
      }
      ctx.stroke();
    }
  }

  // ---- Overblow screams: above its threshold, a pipe sings thin
  // and pale blue for part of each cycle, then rests. The cycle is a
  // pure function of t, so a high-wind probe shows screams.
  function drawOverblows(t) {
    var r, i;
    for (r = 0; r < RANKS.length; r++) {
      var rank = RANKS[r];
      var yBase = H * (0.20 + r * 0.144);
      var ph = H * (0.085 + r * 0.048);
      var pw = (W / rank.count) * 0.78;
      for (i = 0; i < rank.pipes.length; i++) {
        var p = rank.pipes[i];
        if (wind <= p.thresh) { continue; }
        var cyc = (t * 0.5 + p.obPhase) % 1;
        if (cyc >= OVERBLOW_DUR) { continue; }
        var fade = 1 - cyc / OVERBLOW_DUR;
        var tremble = Math.sin(t * p.freq * Math.PI * 2 + p.phase) * wind * pw * 0.055;
        var cx = p.x * W + tremble;
        var y0 = yBase - ph;
        var len = ph * (0.7 + 0.5 * fade);
        var wig = 3 + wind * 6;
        ctx.strokeStyle = hexA(SCREAM, a4(0.75 * fade));
        ctx.lineWidth = Math.max(2, pw * 0.09);
        ctx.beginPath();
        var yy;
        for (yy = 0; yy <= len; yy += 8) {
          var xx = cx + Math.sin(yy * 0.09 + t * 6 + p.phase) * wig * (yy / len);
          if (yy === 0) { ctx.moveTo(xx, y0 - yy); } else { ctx.lineTo(xx, y0 - yy); }
        }
        ctx.stroke();
        ctx.strokeStyle = hexA(SCREAM_CORE, a4(0.85 * fade));
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (yy = 0; yy <= len; yy += 8) {
          var xx2 = cx + Math.sin(yy * 0.09 + t * 6 + p.phase) * wig * (yy / len);
          if (yy === 0) { ctx.moveTo(xx2, y0 - yy); } else { ctx.lineTo(xx2, y0 - yy); }
        }
        ctx.stroke();
      }
    }
  }

  // ---- Wind gauge, the only instrument on screen, top right.
  function drawGauge() {
    var gx = L.gaugeX, gy = L.gaugeY, gr = L.gaugeR;
    ctx.fillStyle = hexA('#1c1006', 0.85);
    ctx.beginPath(); ctx.moveTo(gx + gr, gy); ctx.arc(gx, gy, gr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(GAUGE_RIM, 0.9);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(gx + gr, gy); ctx.arc(gx, gy, gr, 0, Math.PI * 2); ctx.stroke();
    // Red zone arc, wind 0.75 to 1.0, over the top of the dial.
    ctx.strokeStyle = hexA(GAUGE_RED, 0.9);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(gx, gy, gr - 5, -Math.PI * 0.25, 0);
    ctx.stroke();
    // Ticks at 0, 0.25, 0.5, 0.75, 1.0.
    var k;
    for (k = 0; k <= 4; k++) {
      var wv = k / 4;
      var a = Math.PI - wv * Math.PI;
      var x1 = gx + Math.cos(a) * (gr - 4), y1 = gy - Math.sin(a) * (gr - 4);
      var x2 = gx + Math.cos(a) * (gr - 11), y2 = gy - Math.sin(a) * (gr - 11);
      ctx.strokeStyle = hexA(INK, 0.8);
      ctx.lineWidth = k === 0 || k === 4 ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    // Needle: wind 0 points left, wind 1 points right, over the top.
    var na = Math.PI - clamp(wind, 0, 1) * Math.PI;
    var nx = gx + Math.cos(na) * (gr - 13), ny = gy - Math.sin(na) * (gr - 13);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.fillStyle = GAUGE_RIM;
    ctx.beginPath(); ctx.moveTo(gx + 4, gy); ctx.arc(gx, gy, 4, 0, Math.PI * 2); ctx.fill();
    // Label under the dial.
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.textAlign = 'center';
    ctx.font = '600 ' + Math.round(11 * clamp(L.sc, 0.85, 1.1)) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('WIND', gx, gy + gr + 14);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stepWind(t);

    // Ground.
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#2e1d0e');
    grad.addColorStop(1, GROUND);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    drawPipes(t);
    drawSunlight(t);
    drawScreenShadow(t);
    drawShimmer(t);
    drawOverblows(t);

    // Top scrim so the plate and gauge stay legible over the pipes.
    var scrim = ctx.createLinearGradient(0, 0, 0, L.headerH + 14);
    scrim.addColorStop(0, hexA('#160d05', 0.55));
    scrim.addColorStop(1, hexA('#160d05', 0));
    ctx.fillStyle = scrim;
    ctx.fillRect(0, 0, W, L.headerH + 14);

    // Bottom scrim for the hint.
    var bscrim = ctx.createLinearGradient(0, H - 44, 0, H);
    bscrim.addColorStop(0, hexA('#160d05', 0));
    bscrim.addColorStop(1, hexA('#160d05', 0.55));
    ctx.fillStyle = bscrim;
    ctx.fillRect(0, H - 44, W, 44);

    // ---- Plates: title top-left, number and date below it.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Wind Pressure', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1942 · 2007 · 05 · 07', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    drawGauge();

    // ---- Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK, 0.9);
    ctx.textAlign = 'center';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag vertically to raise the wind.', W / 2, H - 14);
    ctx.textAlign = 'left';
  }

  // Drag: vertical position sets wind pressure. The drag is the
  // organ's breath: hold high and pipes overblow, let go and the
  // pressure settles slowly back to idle.
  function dragTo(clientX, clientY) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var y = clientY - rect.top;
    windTarget = windFromY(y);
    draw(reduced ? FIRST_T : lastT);
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      probeHold = false;
      try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      dragTo(e.clientX, e.clientY);
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (dragging) { dragTo(e.clientX, e.clientY); }
    });
    window.addEventListener('pointerup', function () { dragging = false; windTarget = IDLE_WIND; });
    window.addEventListener('pointercancel', function () { dragging = false; windTarget = IDLE_WIND; });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: ?seed=, ?sx=, ?sy= read from location.search at load;
  // window.__draw drives draw() with a virtual clock.
  if (probe.sy !== null) {
    // sy is a fraction of the frame height; top is full pressure.
    // Computed here, before resize(), so it cannot depend on H.
    wind = clamp(1 - probe.sy, 0, 1) * 0.88 + IDLE_WIND;
    windTarget = wind;
    probeHold = true;
  }
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1942 = {
      wind: function () { return wind; },
      setWind: function (v) { wind = clamp(v, 0, 1); windTarget = wind; probeHold = true; },
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: pipes tremble at 2.2 to 3.8 Hz, shadows breathe
  // under 1 Hz, all motion well under the 14 Hz ceiling. Guarded so
  // node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
