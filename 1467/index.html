<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Masks, Worn in Full View</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#e8dcc4}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CW = 0, CH = 0, now = 0, startT = null;
var taps = [];
var HOLD = 5;
var SKIN = '#f2ead8', BLACK = '#1c1c22', SILVER = '#c8c8c8', GOLD = '#d9a441', WHITE = '#f5f0e2';
var BGS = ['#e8dcc4', '#2f4636', '#1e2e22', '#e8c9a8'];

function isPhone() {
  try {
    var s = window.screen;
    if (s && Math.min(s.width, s.height) < 700) return true;
  } catch (e) {}
  return CH > CW * 1.15;
}

function size() {
  var w, h;
  if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
  else { w = window.innerWidth; h = window.innerHeight; }
  CW = w; CH = h;
  canvas.width = w; canvas.height = h;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
}

function stateAt(t) {
  var segStart = 0, idx = 0;
  for (var k = 0; k < taps.length; k++) {
    var tt = taps[k];
    if (tt > t) break;
    while (segStart + HOLD <= tt) { segStart += HOLD; idx = (idx + 1) % 4; }
    segStart = tt; idx = (idx + 1) % 4;
  }
  while (segStart + HOLD <= t) { segStart += HOLD; idx = (idx + 1) % 4; }
  return { idx: idx, segStart: segStart };
}

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function dot(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function tri(x1, y1, x2, y2, x3, y3, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x3, y3);
  ctx.closePath();
  ctx.fill();
}

function quad(x1, y1, x2, y2, x3, y3, x4, y4, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x3, y3);
  ctx.lineTo(x4, y4);
  ctx.closePath();
  ctx.fill();
}

function draw(t) {
  now = t;
  var st = stateAt(t);
  var idx = st.idx;
  var bg = BGS[idx];
  if (typeof document !== 'undefined' && document.body && document.body.style) {
    document.body.style.background = bg;
  }
  rect(0, 0, CW, CH, bg);
  var m = Math.min(CW, CH);
  var cx = CW / 2;
  var top = CH * 0.10, feet = CH * 0.88;
  var fh = feet - top;
  var headR = fh * 0.11;
  var headCy = top + headR;
  var shoulderY = headCy + headR + fh * 0.03;

  // Background props, flat panels and minimal props only.
  if (idx === 0) {
    // Ballroom: tall windows, chandelier, floor line.
    rect(CW * 0.08, CH * 0.14, CW * 0.10, CH * 0.42, WHITE);
    rect(CW * 0.82, CH * 0.14, CW * 0.10, CH * 0.42, WHITE);
    rect(cx - 1, CH * 0.04, 2, CH * 0.08, GOLD);
    dot(cx, CH * 0.14, m * 0.02, GOLD);
    rect(CW * 0.05, feet + fh * 0.02, CW * 0.90, 2, GOLD);
  } else if (idx === 1) {
    // Garden: path strip and bench.
    rect(cx - m * 0.05, feet + fh * 0.02, m * 0.10, CH - feet, GOLD);
    rect(CW * 0.10, CH * 0.62, CW * 0.14, CH * 0.03, SILVER);
    rect(CW * 0.76, CH * 0.62, CW * 0.14, CH * 0.03, SILVER);
  } else if (idx === 2) {
    // Forest: black silhouette trees and a gold moon.
    tri(CW * 0.10, CH * 0.30, CW * 0.16, CH * 0.10, CW * 0.22, CH * 0.30, BLACK);
    tri(CW * 0.78, CH * 0.34, CW * 0.84, CH * 0.14, CW * 0.90, CH * 0.34, BLACK);
    dot(CW * 0.86, CH * 0.12, m * 0.03, GOLD);
  } else {
    // Festival square: dais and bunting line.
    rect(cx - m * 0.22, feet + fh * 0.02, m * 0.44, CH * 0.03, BLACK);
    rect(0, CH * 0.06, CW, 2, GOLD);
    dot(CW * 0.15, CH * 0.06, m * 0.012, GOLD);
    dot(CW * 0.50, CH * 0.06, m * 0.012, GOLD);
    dot(CW * 0.85, CH * 0.06, m * 0.012, GOLD);
  }

  // Figure: body constant, costume layers per state. Face and stance never change.
  var shoulderW = m * 0.20;
  var armW = m * 0.045;

  if (idx === 0) {
    // Black evening dress: trapezoid gown, one path so no seam shows.
    quad(cx - shoulderW / 2, shoulderY, cx + shoulderW / 2, shoulderY, cx + shoulderW * 0.75, feet, cx - shoulderW * 0.75, feet, BLACK);
  } else if (idx === 1) {
    // Silver sheath with a feather boa.
    rect(cx - shoulderW * 0.32, shoulderY, shoulderW * 0.64, feet - shoulderY, SILVER);
    var boaR = m * 0.022;
    for (var b = 0; b < 9; b++) {
      var ang = Math.PI + (b / 8) * Math.PI;
      var bx = cx + Math.cos(ang) * shoulderW * 0.55;
      var by = shoulderY + fh * 0.02 + Math.sin(ang) * fh * 0.03;
      dot(bx, by, boaR, b % 2 === 0 ? WHITE : GOLD);
    }
  } else if (idx === 2) {
    // Fairy-tale gown: wide gold bell with puff sleeves, one path so no seam shows.
    quad(cx - shoulderW / 2, shoulderY, cx + shoulderW / 2, shoulderY, cx + shoulderW * 0.95, feet, cx - shoulderW * 0.95, feet, GOLD);
    dot(cx - shoulderW / 2, shoulderY + fh * 0.03, m * 0.035, GOLD);
    dot(cx + shoulderW / 2, shoulderY + fh * 0.03, m * 0.035, GOLD);
  } else {
    // Bunny costume with a trophy: white body, long ears, gold cup in hand.
    rect(cx - shoulderW * 0.36, shoulderY, shoulderW * 0.72, feet - shoulderY, WHITE);
    rect(cx - headR * 0.55, headCy - headR - fh * 0.16, headR * 0.42, fh * 0.16, WHITE);
    rect(cx + headR * 0.13, headCy - headR - fh * 0.16, headR * 0.42, fh * 0.16, WHITE);
    var tx = cx + shoulderW / 2 + armW + m * 0.02;
    rect(tx, shoulderY + fh * 0.22, m * 0.05, fh * 0.07, GOLD);
    rect(tx + m * 0.01, shoulderY + fh * 0.29, m * 0.03, fh * 0.02, GOLD);
    rect(tx - m * 0.005, shoulderY + fh * 0.31, m * 0.06, fh * 0.015, GOLD);
  }

  // Arms, ivory, at the sides, drawn over the costume so they stay visible.
  rect(cx - shoulderW / 2 - armW, shoulderY, armW, fh * 0.34, SKIN);
  rect(cx + shoulderW / 2, shoulderY, armW, fh * 0.34, SKIN);

  // Head: constant in every state.
  dot(cx, headCy, headR, SKIN);
  ctx.fillStyle = BLACK;
  ctx.beginPath();
  ctx.moveTo(cx - headR, headCy);
  ctx.arc(cx, headCy, headR, Math.PI, Math.PI * 2);
  ctx.closePath();
  ctx.fill();
  rect(cx - headR * 0.45, headCy + headR * 0.05, headR * 0.12, headR * 0.12, BLACK);
  rect(cx + headR * 0.33, headCy + headR * 0.05, headR * 0.12, headR * 0.12, BLACK);
  rect(cx - headR * 0.28, headCy + headR * 0.55, headR * 0.56, headR * 0.08, BLACK);
  // Shoes.
  rect(cx - shoulderW * 0.30, feet - fh * 0.02, shoulderW * 0.22, fh * 0.02, BLACK);
  rect(cx + shoulderW * 0.08, feet - fh * 0.02, shoulderW * 0.22, fh * 0.02, BLACK);

  // One-frame white flash at each swap.
  if (st.segStart > 0 && (t - st.segStart) < 1 / 60) {
    rect(0, 0, CW, CH, '#ffffff');
  }
}

if (typeof window !== 'undefined') {
  window.__piece = {
    draw: draw,
    tap: function () { taps.push(now); },
    stateAt: stateAt,
    getTaps: function () { return taps.slice(); }
  };
}

canvas.addEventListener('pointerdown', function () { taps.push(now); });

function onResize() { size(); draw(now); }
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', onResize);
}
if (window.addEventListener) {
  window.addEventListener('resize', onResize);
}

function loop(ts) {
  if (startT === null) startT = ts;
  draw((ts - startT) / 1000);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}

size();
draw(0);
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
