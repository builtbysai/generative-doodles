<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Wipe Pan</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #ddd3bd; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1472000);

  var WALL = '#ddd3bd', FLOOR = '#8a6a48', GOLD = '#d9a441';
  var CLOTHES = ['#4a5a7a', '#6b4a3a', '#2f4636', '#7a6a8a'];
  var SKINS = ['#f2ead8', '#e0c4a0', '#c49a6a'];

  var N = 9;
  var DWELL = 3.5;
  var figures = [];
  for (var i = 0; i < N; i++) {
    figures.push({
      cloth: CLOTHES[Math.floor(rng() * CLOTHES.length)],
      skin: SKINS[Math.floor(rng() * SKINS.length)],
      hair: '#2f4636'
    });
  }
  // Hair caps use only palette tones: #2f4636 / #6b4a3a.
  for (var j = 0; j < N; j++) {
    figures[j].hair = (j % 2 === 0) ? '#2f4636' : '#6b4a3a';
  }

  var W = 0, H = 0, sceneW = 0, maxCam = 0, V = 0, floorY = 0;
  function layout() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    sceneW = W * 2.6;
    maxCam = W * 1.6;
    V = W * 0.12;
    floorY = H * 0.80;
  }
  layout();

  // Camera centers: speaker i sits at scene x 0.5W + i*0.2W, so its
  // centered camera position is i*0.2W. All nine centers are distinct.
  function camCenter(i) { return i * 0.2 * W; }
  function speakerSceneX(i) { return 0.5 * W + i * 0.2 * W; }
  function nearestSpeaker(cam) {
    var best = 0, bd = 1e9;
    for (var i = 0; i < N; i++) {
      var d = Math.abs(camCenter(i) - cam);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  // Anchor: {cam, dir, time}. Initial anchor dwells on speaker 0.
  var anchor = { cam: 0, dir: 1, time: 0 };
  var dragging = false, dragStartX = 0, dragStartCam = 0, dragCam = 0;
  var dragSpeaker = 0, dragDir = 1, lastT = 0;

  function clampCam(c) { return Math.max(0, Math.min(maxCam, c)); }

  // Closed-form camera + speaker timeline from an anchor. Never mutates anchor.
  function stateAt(t) {
    var elapsed = Math.max(0, t - anchor.time);
    var cam = anchor.cam, dir = anchor.dir;
    var s = nearestSpeaker(cam);
    var cur;
    if (Math.abs(cam - camCenter(s)) < 1) {
      if (elapsed < DWELL) return { cam: camCenter(s), speaker: s };
      elapsed -= DWELL; cur = s; cam = camCenter(s);
    } else {
      var nxt = s + dir;
      if (nxt < 0 || nxt >= N) { dir = -dir; nxt = s + dir; }
      var d = Math.abs(camCenter(nxt) - cam) / V;
      if (elapsed < d) return { cam: cam + dir * V * elapsed, speaker: s };
      elapsed -= d; cam = camCenter(nxt); cur = nxt;
      if (elapsed < DWELL) return { cam: cam, speaker: cur };
      elapsed -= DWELL;
    }
    while (true) {
      var m = cur + dir;
      if (m < 0 || m >= N) { dir = -dir; m = cur + dir; }
      var dd = Math.abs(camCenter(m) - cam) / V;
      if (elapsed < dd) return { cam: cam + dir * V * elapsed, speaker: cur };
      elapsed -= dd; cam = camCenter(m); cur = m;
      if (elapsed < DWELL) return { cam: cam, speaker: cur };
      elapsed -= DWELL;
    }
  }

  function drawFigure(f, sx, t, isSpeaker, speakerX) {
    // Figure height bounded by row spacing (0.2W) so neighbours never
    // overlap on narrow portrait phones, where H alone would oversize them.
    var fh = Math.min(H * 0.40, W * 0.36);
    var baseY = floorY;
    var hipY = baseY - fh * 0.42;
    var shY = baseY - fh * 0.88;
    var headR = fh * 0.115;
    var neckX = sx, neckY = shY;
    // Chair: back + seat, drawn behind the figure.
    ctx.fillStyle = FLOOR;
    ctx.fillRect(sx - fh * 0.16, hipY - fh * 0.34, fh * 0.055, fh * 0.40);
    ctx.fillRect(sx - fh * 0.16, hipY - fh * 0.02, fh * 0.30, fh * 0.05);
    // Seated legs: thigh horizontal, shin vertical, facing right.
    ctx.fillStyle = f.cloth;
    ctx.fillRect(sx - fh * 0.02, hipY - fh * 0.06, fh * 0.30, fh * 0.075);
    ctx.fillRect(sx + fh * 0.24, hipY - fh * 0.06, fh * 0.075, fh * 0.40);
    // Torso.
    ctx.fillStyle = f.cloth;
    ctx.fillRect(sx - fh * 0.10, shY, fh * 0.20, hipY - shY);
    // Arm resting forward.
    ctx.fillStyle = f.skin;
    ctx.fillRect(sx + fh * 0.02, shY + fh * 0.10, fh * 0.16, fh * 0.045);
    // Head group, rotated a few degrees: speaker tilts gently, listeners
    // tilt toward the speaker.
    var tilt = 0;
    if (isSpeaker) {
      tilt = 0.06 * Math.sin(t * 1.4);
    } else {
      tilt = (speakerX > sx ? 1 : -1) * 0.05;
    }
    var hx = neckX + fh * 0.02, hy = neckY - headR - fh * 0.02;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(tilt);
    // Head disc.
    ctx.fillStyle = f.skin;
    ctx.beginPath();
    ctx.moveTo(headR, 0);
    ctx.arc(0, 0, headR, 0, Math.PI * 2);
    ctx.fill();
    // Profile nose bump on the right (all face the same way).
    ctx.fillStyle = f.skin;
    ctx.fillRect(headR * 0.82, -headR * 0.10, headR * 0.30, headR * 0.18);
    // Hair cap.
    ctx.fillStyle = f.hair;
    ctx.beginPath();
    ctx.moveTo(-headR, -headR * 0.10);
    ctx.arc(0, 0, headR, Math.PI, Math.PI * 2);
    ctx.fill();
    // Eye dot.
    ctx.fillStyle = '#2f4636';
    ctx.fillRect(headR * 0.30, -headR * 0.10, headR * 0.14, headR * 0.14);
    // Mouth line: speakers shift it with time, listeners hold still.
    var mo = isSpeaker ? Math.sin(t * 6) * headR * 0.10 : 0;
    ctx.fillStyle = '#2f4636';
    ctx.fillRect(headR * 0.28, headR * 0.42 + mo, headR * 0.42, headR * 0.07);
    ctx.restore();
    return { mouthX: sx + fh * 0.02 + headR * 0.49, mouthY: hy + headR * 0.42 };
  }

  function drawVoiceLine(mx, my, t) {
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = Math.max(2, W * 0.002);
    ctx.beginPath();
    ctx.moveTo(mx, my);
    var segs = 5;
    for (var k = 1; k <= segs; k++) {
      var yy = my - (my * 0.0) - (k * (H * 0.028));
      var xx = mx + Math.sin(t * 2.2 + k * 1.3) * W * 0.006 + k * W * 0.004;
      ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  }

  function draw(t) {
    lastT = t;
    var st, cam;
    if (dragging) {
      cam = dragCam;
      st = { cam: cam, speaker: dragSpeaker };
    } else {
      st = stateAt(t);
      cam = st.cam;
    }
    // Wall + floor.
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, floorY, W, H - floorY);
    // Wall/floor boundary line.
    ctx.fillStyle = '#2f4636';
    ctx.fillRect(0, floorY - 1, W, 2);

    var sp = st.speaker;
    var spSceneX = speakerSceneX(sp);
    var mouth = null;
    for (var i = 0; i < N; i++) {
      var sx = speakerSceneX(i) - cam;
      if (sx < -W * 0.25 || sx > W * 1.25) continue;
      var m = drawFigure(figures[i], sx, t, i === sp, spSceneX - cam);
      if (i === sp) mouth = m;
    }
    if (mouth) drawVoiceLine(mouth.mouthX, mouth.mouthY, t);
  }

  // Pointer: drag sideways pans the camera; release resumes the auto pan.
  function pDown(x, t) {
    if (typeof t === 'number') lastT = t;
    var st = stateAt(lastT);
    dragging = true;
    dragStartX = x;
    dragStartCam = st.cam;
    dragCam = st.cam;
    dragSpeaker = st.speaker;
    dragDir = anchor.dir;
  }
  function pMove(x) {
    if (!dragging) return;
    var nc = clampCam(dragStartCam - (x - dragStartX));
    if (nc > dragCam) dragDir = 1;
    else if (nc < dragCam) dragDir = -1;
    dragCam = nc;
  }
  function pUp(x, t) {
    if (!dragging) return;
    if (typeof t === 'number') lastT = t;
    pMove(x);
    dragging = false;
    anchor = { cam: clampCam(dragCam), dir: dragDir, time: lastT };
  }
  function onPointer(e, fn) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    fn(e.clientX - r.left, lastT);
  }
  canvas.addEventListener('pointerdown', function (e) { onPointer(e, pDown); });
  canvas.addEventListener('pointermove', function (e) { onPointer(e, pMove); });
  canvas.addEventListener('pointerup', function (e) { onPointer(e, pUp); });
  canvas.addEventListener('pointercancel', function (e) { onPointer(e, pUp); });

  function onResize() {
    layout();
    anchor.cam = clampCam(anchor.cam);
    draw(lastT);
  }
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', onResize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
  }

  // Probe + harness interface.
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      stateAt: stateAt,
      pointerDown: pDown,
      pointerMove: pMove,
      pointerUp: pUp,
      getCam: function (t) { return stateAt(t).cam; },
      getSpeaker: function (t) { return stateAt(t).speaker; }
    };
  }

  // Frame one = draw(0); the clock starts only with the rAF loop.
  draw(0);
  var startTs = null;
  function loop(ts) {
    if (startTs === null) startTs = ts;
    draw((ts - startTs) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
