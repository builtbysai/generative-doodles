<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewind Until It Collapses</title>
<style>
  html, body { margin: 0; padding: 0; background: #2e6f6a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // №1488 "Rewind Until It Collapses" (nadja-ringart NR1, PP735).
  // A broadcast panel of suited figures; one centered figure speaks a short
  // gold sentence polyline. Each replay trims the sentence and jerks the
  // gesture, until it collapses to a single scarlet dot and the figure stops.
  // The full sentence then restores at the loop boundary and it begins again.
  // Drag along the rewind bar scrubs the collapse; release resumes the loop.
  // Fully silent. No visible text except <title>.

  var GREY = '#b8bcc0';
  var CHAR = '#2a2a30';
  var TEAL = '#2e6f6a';
  var GOLD = '#d9a441';
  var SCAR = '#c1272d';
  var CREAM = '#e8e0d0';

  var LOOP = 27;          // 5 repeats x 5 s + 2 s collapse hold
  var REPEATS = 5;
  var SEG = 5;
  var HOLD = 2;
  var PHASE = 1.75;       // frame one: midway through repeat 0's first play

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var loopOffset = 0;
  var scrubbing = false;
  var scrubT = 0;
  var lastElapsed = 0;
  var startStamp = null;

  function viewportSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width && window.visualViewport.height) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth && window.innerHeight) {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1280; h = 900; }
    return { w: w, h: h };
  }

  function setup() {
    var s = viewportSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var minDim = 1e9;
    if (typeof window !== 'undefined' && window.screen &&
        window.screen.width && window.screen.height) {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
    isPhone = (minDim < 700) || (H > W * 1.15);
    if (typeof document !== 'undefined' && document.body) {
      document.body.style.background = TEAL;
    }
  }

  // Seeded sentence polyline, relative coords (fractions of a unit box).
  var rng = mulberry32(1488000);
  var SENT = [];
  (function () {
    var i, x = 0, y = 0.5;
    for (i = 0; i < 9; i++) {
      SENT.push([x, y]);
      x += 0.125;
      y = 0.5 + (rng() - 0.5) * 0.55;
    }
  })();

  // Seeded edge-figure height jitter (small, keeps rows orderly).
  var edgeJitter = [];
  (function () {
    var i;
    for (i = 0; i < 8; i++) edgeJitter.push(0.92 + rng() * 0.16);
  })();

  function loopTime(t) {
    var lt = t % LOOP;
    if (lt < 0) lt += LOOP;
    return lt;
  }

  // Pure state for a loop-local time lt. Every value derives from lt only,
  // and every periodic function uses an integer number of cycles per segment,
  // so stateAt(LOOP) === stateAt(0) exactly (the №1482 lesson).
  function stateAt(lt) {
    lt = loopTime(lt);
    var st = { k: 0, prog: 0, collapsed: false, mouth: 0, tilt: 0, arm: 0, bar: 0 };
    if (lt >= REPEATS * SEG) { // collapse hold
      st.k = REPEATS - 1;
      st.prog = 0;
      st.collapsed = true;
      st.mouth = 0; st.tilt = 0; st.arm = 0;
      st.bar = 1;
      return st;
    }
    var k = Math.floor(lt / SEG);
    var s = lt - k * SEG;
    var playDur = 3.5 - 0.2 * k;
    var rewindDur = SEG - playDur;
    var trim = 1 - 0.2 * k;
    var cycles = 2 + k; // jerkier with each repeat
    var prog, segFrac;
    if (s < playDur) {
      var p = s / playDur;
      prog = p * trim;
      segFrac = s / SEG;
      st.mouth = 0.5 + 0.5 * Math.sin(2 * Math.PI * p * 2);
      st.tilt = Math.sin(2 * Math.PI * p * cycles) * (0.05 + 0.02 * k);
      st.arm = Math.sin(2 * Math.PI * p * cycles) * (0.35 + 0.1 * k);
    } else {
      var q = (s - playDur) / rewindDur;
      prog = trim * (1 - q);
      segFrac = s / SEG;
      st.mouth = 0.5 * (1 - q);
      st.tilt = Math.sin(2 * Math.PI * q * cycles) * (0.05 + 0.02 * k);
      st.arm = Math.sin(2 * Math.PI * q * cycles) * (0.35 + 0.1 * k);
    }
    st.k = k;
    st.prog = prog;
    st.bar = (k + segFrac) / REPEATS;
    return st;
  }

  function polyLen(pts) {
    var L = 0, i;
    for (i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[0][0] - (pts[i - 1][0] - pts[0][0]);
      var dy = pts[i][1] - pts[i - 1][1];
      L += Math.sqrt(dx * dx + dy * dy);
    }
    return L;
  }

  // Draw pts (absolute coords) up to fraction f of total polyline length.
  function drawPartialPolyline(pts, f) {
    var total = 0, i;
    var segs = [];
    for (i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0];
      var dy = pts[i][1] - pts[i - 1][1];
      var L = Math.sqrt(dx * dx + dy * dy);
      segs.push(L); total += L;
    }
    var target = f * total;
    var acc = 0;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length; i++) {
      if (acc + segs[i - 1] <= target) {
        ctx.lineTo(pts[i][0], pts[i][1]);
        acc += segs[i - 1];
      } else {
        var rem = target - acc;
        var r = segs[i - 1] > 0 ? rem / segs[i - 1] : 0;
        ctx.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * r,
                   pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * r);
        break;
      }
    }
    ctx.stroke();
  }

  function drawFigure(cx, cy, w, h, opts) {
    // opts: {head: color, mouth: 0..1 open, tilt, arm, armColor}
    var torsoW = w, torsoH = h * 0.62;
    var headR = w * 0.30;
    var hx = cx + (opts.tilt || 0) * w;
    var hy = cy - torsoH / 2 - headR * 0.9;
    ctx.fillStyle = CHAR;
    ctx.fillRect(cx - torsoW / 2, cy - torsoH / 2, torsoW, torsoH);
    ctx.beginPath();
    ctx.moveTo(hx + headR, hy);
    ctx.arc(hx, hy, headR, 0, 2 * Math.PI);
    ctx.fillStyle = CHAR;
    ctx.fill();
    // mouth line: width opens with opts.mouth
    var mw = headR * (0.3 + 0.7 * (opts.mouth || 0));
    ctx.fillStyle = CREAM;
    ctx.fillRect(hx - mw / 2, hy + headR * 0.25, mw, Math.max(2, headR * 0.10));
    if (opts.arm) {
      ctx.strokeStyle = CHAR;
      ctx.lineWidth = Math.max(2, w * 0.10);
      ctx.beginPath();
      ctx.moveTo(cx - torsoW / 2, cy - torsoH * 0.2);
      ctx.lineTo(cx - torsoW / 2 - w * 0.35, cy - torsoH * 0.2 - opts.arm * h * 0.25);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + torsoW / 2, cy - torsoH * 0.2);
      ctx.lineTo(cx + torsoW / 2 + w * 0.35, cy - torsoH * 0.2 + opts.arm * h * 0.25);
      ctx.stroke();
    }
  }

  function renderAt(lt) {
    var st = stateAt(lt);
    var m = isPhone ? 0.03 : 0.06;
    var px = W * m, py = H * 0.05;
    var pw = W * (1 - 2 * m), ph = H * 0.63;
    var frame = Math.max(6, W * 0.012);

    // ground
    ctx.fillStyle = TEAL;
    ctx.fillRect(0, 0, W, H);
    // panel frame + broadcast ground
    ctx.fillStyle = CREAM;
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = GREY;
    ctx.fillRect(px + frame, py + frame, pw - 2 * frame, ph - 2 * frame);

    var ix = px + frame, iy = py + frame;
    var iw = pw - 2 * frame, ih = ph - 2 * frame;

    // edge figures: two rows of four, still, at the panel edges
    var fw = Math.min(iw * 0.075, ih * 0.16);
    var fh = fw * 2.4;
    var topY = iy + ih * 0.20, botY = iy + ih * 0.80;
    var xs = [0.10, 0.28, 0.72, 0.90];
    var r, c;
    for (r = 0; r < 2; r++) {
      for (c = 0; c < 4; c++) {
        var j = edgeJitter[r * 4 + c];
        drawFigure(ix + iw * xs[c], (r === 0 ? topY : botY), fw, fh * j,
          { mouth: 0.15, tilt: 0, arm: 0 });
      }
    }

    // speaking figure, centered, larger
    var sw = Math.min(iw * 0.13, ih * 0.26);
    var sh = sw * 2.4;
    var scx = ix + iw * 0.5, scy = iy + ih * 0.50;
    drawFigure(scx, scy, sw, sh,
      { mouth: st.collapsed ? 0 : st.mouth, tilt: st.tilt, arm: st.arm });

    // sentence: gold polyline from the speaker's mouth, upper right
    var ox = scx + sw * 0.45;
    var oy = scy - sh * 0.55;
    var uw = Math.min(iw * 0.24, W * 0.24);
    var uh = uw * 0.45;
    var pts = [];
    var i;
    for (i = 0; i < SENT.length; i++) {
      pts.push([ox + SENT[i][0] * uw, oy + (SENT[i][1] - 0.5) * uh]);
    }
    if (st.collapsed) {
      // single scarlet dot at the sentence origin; figure stops, stays put
      ctx.beginPath();
      ctx.moveTo(ox + Math.max(3, uw * 0.03), oy);
      ctx.arc(ox, oy, Math.max(3, uw * 0.03), 0, 2 * Math.PI);
      ctx.fillStyle = SCAR;
      ctx.fill();
    } else if (st.prog > 0.001) {
      ctx.strokeStyle = GOLD;
      ctx.lineWidth = Math.max(2, W * 0.004);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      drawPartialPolyline(pts, st.prog);
      // tip dot at the leading end
      var tip = tipPoint(pts, st.prog);
      ctx.beginPath();
      ctx.moveTo(tip[0] + Math.max(2, W * 0.003), tip[1]);
      ctx.arc(tip[0], tip[1], Math.max(2, W * 0.003), 0, 2 * Math.PI);
      ctx.fillStyle = GOLD;
      ctx.fill();
    }

    // rewind bar: thin strip across the lower third
    var bx = W * 0.10, bw = W * 0.80;
    var by = H * 0.74, bh = Math.max(8, H * 0.022);
    ctx.fillStyle = GREY;
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = GOLD;
    ctx.fillRect(bx, by, bw * st.bar, bh);
    var hx2 = bx + bw * st.bar;
    ctx.fillStyle = st.collapsed ? SCAR : CHAR;
    ctx.fillRect(hx2 - Math.max(3, W * 0.004), by - Math.max(2, bh * 0.25),
      Math.max(6, W * 0.008), bh + Math.max(4, bh * 0.5));
  }

  function tipPoint(pts, f) {
    var total = 0, i;
    var segs = [];
    for (i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0];
      var dy = pts[i][1] - pts[i - 1][1];
      var L = Math.sqrt(dx * dx + dy * dy);
      segs.push(L); total += L;
    }
    var target = f * total, acc = 0;
    for (i = 1; i < pts.length; i++) {
      if (acc + segs[i - 1] <= target) { acc += segs[i - 1]; }
      else {
        var r = segs[i - 1] > 0 ? (target - acc) / segs[i - 1] : 0;
        return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * r,
                pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * r];
      }
    }
    return pts[pts.length - 1];
  }

  function drawFrame(elapsed) {
    lastElapsed = elapsed;
    var lt;
    if (scrubbing) { lt = scrubT; }
    else { lt = loopTime(elapsed + PHASE + loopOffset); }
    renderAt(lt);
  }

  // pointer -> canvas coords
  function evtXY(ev) {
    var x = ev.clientX, y = ev.clientY;
    if (canvas.getBoundingClientRect) {
      var r = canvas.getBoundingClientRect();
      x = ev.clientX - r.left; y = ev.clientY - r.top;
      if (r.width && canvas.width) {
        x = x * canvas.width / r.width;
        y = y * canvas.height / r.height;
      }
    }
    return { x: x, y: y };
  }

  function barRect() {
    return { x: W * 0.10, w: W * 0.80, y: H * 0.74 - H * 0.02, h: H * 0.022 + H * 0.04 };
  }

  function onDown(ev) {
    var p = evtXY(ev);
    var b = barRect();
    if (p.x >= b.x - 10 && p.x <= b.x + b.w + 10 && p.y >= b.y && p.y <= b.y + b.h) {
      scrubbing = true;
      var f = (p.x - b.x) / b.w;
      if (f < 0) f = 0; if (f > 1) f = 1;
      scrubT = f * LOOP;
      drawFrame(lastElapsed);
    }
  }
  function onMove(ev) {
    if (!scrubbing) return;
    var p = evtXY(ev);
    var b = barRect();
    var f = (p.x - b.x) / b.w;
    if (f < 0) f = 0; if (f > 1) f = 1;
    scrubT = f * LOOP;
    drawFrame(lastElapsed);
  }
  function onUp() {
    if (!scrubbing) return;
    scrubbing = false;
    loopOffset = loopTime(scrubT - lastElapsed - PHASE);
    drawFrame(lastElapsed);
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  function onResize() {
    setup();
    drawFrame(lastElapsed);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) {
      window.addEventListener('resize', onResize);
    }
  }

  // rAF loop (plain function declaration; typeof-guarded for node-canvas).
  function loop(ts) {
    if (startStamp === null) { startStamp = ts; }
    var elapsed = (ts - startStamp) / 1000;
    drawFrame(elapsed);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }

  setup();
  drawFrame(0); // frame one = stateAt(PHASE), constant phase
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }

  // Probe API: draw(t) renders loop-local time t; frame(e) renders the
  // browser-path frame for elapsed e; down/move/up drive the bar drag.
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: function (t) { renderAt(loopTime(t)); },
      frame: function (e) { drawFrame(e); },
      down: function (x, y) { onDown({ clientX: x, clientY: y }); },
      move: function (x, y) { onMove({ clientX: x, clientY: y }); },
      up: function () { onUp(); },
      LOOP: LOOP,
      PHASE: PHASE
    };
  }
})();
</script>
</body>
</html>
