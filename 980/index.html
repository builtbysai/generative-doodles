<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before You Move</title>
<style>
  html, body { margin: 0; padding: 0; background: #07080C; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* No.980 "Before You Move" (PP141 Zero Latency, daito-manabe study)
   A braided river of signal/movement line pairs. The cyan SIGNAL leads;
   the white MOVEMENT traces the identical path one LEAD (120 ms) later.
   Muscle-nodes flare when a signal spike passes them: light and sound
   are triggered by the cause, never the effect.
   Everything drawn is a closed-form function of piece time t and the
   recorded gesture events. Frame one is the synchronous draw at T0. */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

var T0 = 7.0;                 // fixed frame-one offset (seconds of piece time)
var L  = 1600;                // period of the s-space the river flows through (px)
var NPAIRS = 12;

var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var W = 0, H = 0;

function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  if (window.visualViewport){ w = window.visualViewport.width; h = window.visualViewport.height; }
  W = w; H = h;
  cv.width = Math.round(w); cv.height = Math.round(h);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);
resize();

function isPhone(){
  var sw = (window.screen && window.screen.width)  || W;
  var sh = (window.screen && window.screen.height) || H;
  if (Math.min(sw, sh) < 700) return true;
  return H > W * 1.15;
}

/* ---------------- generation (seeded river) ---------------- */

var gen = null;        // {seed, lead, startT, pairs:[...]}
var tapSpikes = [];    // visitor spikes: {pair, s, h, t0}
var stamps = [];       // drag stamps:   {pair, x, y, t}
var lastTap = null;    // {t, spike} for double-tap detection

function buildGen(seed, lead, startT){
  var rnd = mulberry32(seed);
  var pairs = [];
  for (var i = 0; i < NPAIRS; i++){
    var v = 46 + rnd() * 44;                       // flow speed px/s (rightward)
    var k1 = 2 + Math.floor(rnd() * 3);            // integer cycles per L: periodic wander
    var k2 = 5 + Math.floor(rnd() * 5);
    var p = {
      v: v,
      k1: k1, k2: k2,
      ph1: rnd() * Math.PI * 2,
      ph2: rnd() * Math.PI * 2,
      a1: 0.42 + rnd() * 0.2,                      // wander amplitudes (fraction of band amp)
      a2: 0.16 + rnd() * 0.14,
      spikes: [], nodes: []
    };
    var ns = 5 + Math.floor(rnd() * 4);            // 5-8 spikes per pair
    for (var j = 0; j < ns; j++){
      p.spikes.push({
        s: rnd() * L,
        h: (0.55 + rnd() * 0.5) * (rnd() < 0.78 ? 1 : -1),  // mostly upward spikes
        sig: 11 + rnd() * 8
      });
    }
    var nn = 2 + Math.floor(rnd() * 2);            // 2-3 muscle-nodes per pair
    for (var m = 0; m < nn; m++){
      p.nodes.push({ xf: 0.08 + rnd() * 0.84, thresh: 0.55 + rnd() * 0.2, lastEnv: 0, lastH: 0 });
    }
    pairs.push(p);
  }
  return { seed: seed, lead: lead, startT: startT, pairs: pairs };
}
gen = buildGen(980141, 0.120, 0);

/* ---------------- signal mathematics ---------------- */

function wrapL(x){ x = x % L; return x < 0 ? x + L : x; }
function wrapDist(d){ d = wrapL(d); return d > L / 2 ? d - L : d; }

function bandGeom(i){
  var top = H * 0.035, span = H * 0.90;
  var step = span / NPAIRS;
  var cy = top + (i + 0.5) * step;
  var amp = Math.min(step * 0.40, isPhone() ? 20 : 30);
  return { cy: cy, amp: amp };
}

/* The seeded signal shape of pair i at s-space position s (px units). */
function shapeAt(i, s){
  var p = gen.pairs[i];
  var amp = bandGeom(i).amp;
  var y = p.a1 * Math.sin(2 * Math.PI * p.k1 * s / L + p.ph1)
        + p.a2 * Math.sin(2 * Math.PI * p.k2 * s / L + p.ph2);
  y *= amp;
  var list = p.spikes;
  for (var j = 0; j < list.length; j++){
    var sp = list[j];
    var d = wrapDist(s - sp.s);
    var g = d / sp.sig;
    y += sp.h * amp * 1.45 * Math.exp(-g * g);
  }
  return y;
}

/* Full signal value (shape + visitor spikes + drag overlay) at screen x, piece time t. */
function signalAt(i, x, t){
  var p = gen.pairs[i];
  var s = wrapL(x - p.v * (t - gen.startT));
  var y = shapeAt(i, s);
  var amp = bandGeom(i).amp;
  for (var j = 0; j < tapSpikes.length; j++){
    var ts = tapSpikes[j];
    if (ts.pair !== i || t < ts.t0) continue;
    var d = wrapDist(s - ts.s);
    var g = d / 13;
    y += ts.h * amp * 1.6 * Math.exp(-g * g);
  }
  y += overlayAt(i, x, t);
  return y;
}

/* Drag overlay: stamps pull the signal toward the visitor's drawn y.
   Evaluated at (t - lead) by the movement line, so the white line
   visibly chases the drawn signal one lead later. */
function overlayAt(i, x, t){
  var add = 0;
  for (var j = 0; j < stamps.length; j++){
    var st = stamps[j];
    if (st.pair !== i) continue;
    var age = t - st.t;
    if (age < 0 || age > 3.2) continue;
    var dx = (x - st.x) / 38;
    var w = Math.exp(-dx * dx) * Math.exp(-age / 2.6);
    if (w < 0.01) continue;
    var base = bandGeom(i).cy + shapeAt(i, wrapL(x - gen.pairs[i].v * (t - gen.startT)));
    add += (st.y - base) * w * 0.85;
  }
  return add;
}

/* Movement: the same signal, sampled one lead earlier, lightly smoothed. */
function movementAt(i, x, t){
  var tm = t - gen.lead;
  var a = signalAt(i, x - 3, tm), b = signalAt(i, x, tm), c = signalAt(i, x + 3, tm);
  return (a + 2 * b + c) / 4;
}

/* Node flare: a spike (seeded or visitor) aligns with the node's screen x
   at times t_a with s_spike + v*t_a = x_node (mod L). Envelope decays after.
   Trigger source is the SIGNAL's spike train only. */
function flareAt(i, node, t){
  var p = gen.pairs[i];
  var xn = node.xf * W;
  var best = 0, bestH = 0;
  function consider(spS, spH, t0){
    if (Math.abs(spH) < node.thresh) return;
    var period = L / p.v;
    var base = (xn - spS) / p.v + gen.startT;
    var k = Math.floor((t - base) / period);
    var ta = base + k * period;
    if (ta < t0) return;
    var age = t - ta;
    if (age < 0 || age > 1.5) return;
    var env = Math.exp(-age / 0.38);
    if (env > best){ best = env; bestH = spH; bestAge = age; }
  }
  var bestAge = 99;
  for (var j = 0; j < p.spikes.length; j++) consider(p.spikes[j].s, p.spikes[j].h, -Infinity);
  for (var m = 0; m < tapSpikes.length; m++)
    if (tapSpikes[m].pair === i) consider(tapSpikes[m].s, tapSpikes[m].h, tapSpikes[m].t0);
  return { env: best, h: bestH, age: bestAge };
}

/* ---------------- audio (lazy, guarded) ---------------- */

var AC = null, washGain = null;
function ensureAudio(){
  if (AC) return;
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    var master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    AC._master = master;
    // movement wash: looped noise through a lowpass, gain follows movement energy
    var len = AC.sampleRate * 2;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    var r = mulberry32(4141);
    for (var i = 0; i < len; i++) d[i] = r() * 2 - 1;
    var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
    washGain = AC.createGain(); washGain.gain.value = 0.0;
    src.connect(lp); lp.connect(washGain); washGain.connect(master);
    src.start();
  } catch (e) { AC = null; }
}
function nodeTone(h){
  if (!AC) return;
  try {
    var f = 220 + 660 * Math.min(1, Math.abs(h));
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    var t = AC.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.20, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    o.connect(g); g.connect(AC._master);
    o.start(t); o.stop(t + 0.6);
  } catch (e) {}
}

/* ---------------- drawing ---------------- */

var COL = {
  field: '#07080C', signal: '#4FD6FF', move: '#F5F2EA',
  node: '#FFC44F', flare: '#7DF9C6', read: '#8A8D84'
};

function draw(t){
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.fillStyle = COL.field;
  ctx.fillRect(0, 0, W, H);

  var stepX = 4;
  var i, x;

  /* movement lines first (thicker, warm white, one lead behind) */
  ctx.lineWidth = 2.6;
  ctx.strokeStyle = COL.move;
  ctx.globalAlpha = 0.8;
  ctx.lineJoin = 'round';
  for (i = 0; i < NPAIRS; i++){
    var gm = bandGeom(i);
    ctx.beginPath();
    for (x = 0; x <= W; x += stepX){
      var ym = gm.cy + movementAt(i, x, t);
      if (x === 0) ctx.moveTo(x, ym); else ctx.lineTo(x, ym);
    }
    ctx.stroke();
  }

  /* signal lines (thin cyan, leading) */
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = COL.signal;
  ctx.globalAlpha = 1;
  for (i = 0; i < NPAIRS; i++){
    var gs = bandGeom(i);
    ctx.beginPath();
    for (x = 0; x <= W; x += stepX){
      var ys = gs.cy + signalAt(i, x, t);
      if (x === 0) ctx.moveTo(x, ys); else ctx.lineTo(x, ys);
    }
    ctx.stroke();
  }

  /* muscle-nodes riding the signal line; flare on spike alignment */
  for (i = 0; i < NPAIRS; i++){
    var p = gen.pairs[i];
    var gb = bandGeom(i);
    for (var m = 0; m < p.nodes.length; m++){
      var nd = p.nodes[m];
      var xn = nd.xf * W;
      var yn = gb.cy + signalAt(i, xn, t);
      var fl = flareAt(i, nd, t);
      /* audio: fire on the flare's rising edge (signal-caused) */
      if (fl.env > 0.55 && nd.lastEnv <= 0.55) nodeTone(fl.h);
      nd.lastEnv = fl.env;
      if (fl.age < 1.0){
        ctx.globalAlpha = Math.exp(-fl.age / 0.30) * 0.95;
        ctx.strokeStyle = COL.flare;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(xn, yn, 5 + fl.age * 20, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = COL.node;
      ctx.lineWidth = 1.4 + fl.env * 1.2;
      ctx.beginPath();
      ctx.arc(xn, yn, 4, 0, Math.PI * 2);
      ctx.stroke();
      if (fl.env > 0.05){
        ctx.globalAlpha = fl.env;
        ctx.fillStyle = COL.node;
        ctx.beginPath();
        ctx.arc(xn, yn, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  /* the one tiny readout */
  ctx.fillStyle = COL.read;
  ctx.font = '11px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('lead: ' + Math.round(gen.lead * 1000) + 'ms', W - 12, H - 12);
  ctx.textAlign = 'left';
}

/* ---------------- time + interaction ---------------- */

var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
function pieceT(){
  if (typeof performance !== 'undefined' && performance.now)
    return T0 + (performance.now() - startStamp) / 1000;
  return T0;
}

function nearestPair(y){
  var best = 0, bd = 1e9;
  for (var i = 0; i < NPAIRS; i++){
    var d = Math.abs(bandGeom(i).cy - y);
    if (d < bd){ bd = d; best = i; }
  }
  return best;
}

var dragState = null;

function onDown(e){
  ensureAudio();
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (err) {} }
  dragState = { x: e.clientX, y: e.clientY, moved: false, pair: nearestPair(e.clientY) };
}
function onMove(e){
  if (!dragState) return;
  var dx = e.clientX - dragState.x, dy = e.clientY - dragState.y;
  if (dx * dx + dy * dy > 36) dragState.moved = true;
  if (dragState.moved){
    stamps.push({ pair: dragState.pair, x: e.clientX, y: e.clientY, t: pieceT() });
    if (stamps.length > 240) stamps.splice(0, stamps.length - 240);
  }
}
function onUp(e){
  if (!dragState) return;
  var wasDrag = dragState.moved;
  dragState = null;
  if (wasDrag) return;
  var t = pieceT();
  var i = nearestPair(e.clientY);
  /* double-tap: rewire (reseed pairs, new lead 60-200 ms) */
  if (lastTap && (t - lastTap.t) < 0.35){
    var idx = tapSpikes.indexOf(lastTap.spike);
    if (idx >= 0) tapSpikes.splice(idx, 1);
    var seed = 980141 + Math.floor(t * 1000) % 89999 + 17;
    var lead = (60 + Math.floor(mulberry32(seed)() * 141)) / 1000;
    gen = buildGen(seed, lead, t);
    tapSpikes = tapSpikes.filter(function(s){ return s.t0 >= t; });
    stamps = [];
    lastTap = null;
    return;
  }
  /* tap: flex. Inject a spike into the signal at the tap point. */
  var p = gen.pairs[i];
  var spike = { pair: i, s: wrapL(e.clientX - p.v * (t - gen.startT)), h: 1.0, t0: t };
  tapSpikes.push(spike);
  lastTap = { t: t, spike: spike };
}

cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', function(){ dragState = null; });

/* frame one: synchronous draw at the fixed offset */
draw(T0);

var washLevel = 0;
function frame(){
  var t = pieceT();
  draw(t);
  if (AC && washGain){
    /* wash gain follows the movement lines' total energy */
    var eSum = 0;
    for (var i = 0; i < NPAIRS; i += 2){
      var a = movementAt(i, W * 0.3, t), b = movementAt(i, W * 0.32, t);
      eSum += Math.abs(b - a);
    }
    var target = Math.min(0.05, eSum * 0.004);
    washLevel += (target - washLevel) * 0.05;
    try { washGain.gain.setTargetAtTime(washLevel, AC.currentTime, 0.1); } catch (e) {}
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
</script>
</body>
</html>
