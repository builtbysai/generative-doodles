<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>How to Fly (ombré)</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #F27BA7; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1325000);

  // Piece palette.
  var PINK = [242, 123, 167], GOLD = [244, 201, 93], TEAL = [63, 167, 160];
  var PRINT = '#FAF6EC', INK = '#2A2A28', RHINE = '#F5D76E', GLITTER = '#F8E9B8';

  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix3(c1, c2, t) {
    return 'rgb(' + Math.round(lerp(c1[0], c2[0], t)) + ',' +
      Math.round(lerp(c1[1], c2[1], t)) + ',' + Math.round(lerp(c1[2], c2[2], t)) + ')';
  }
  // Ombré as layered flat-alpha bands, never a gradient. 90 bands: pink to
  // gold across the top half, gold to teal across the bottom half.
  function drawOmbre(W, H) {
    var bands = 90, bh = H / bands;
    for (var i = 0; i < bands; i++) {
      var u = (i + 0.5) / bands, col;
      if (u < 0.5) col = mix3(PINK, GOLD, u / 0.5);
      else col = mix3(GOLD, TEAL, (u - 0.5) / 0.5);
      ctx.fillStyle = col;
      ctx.fillRect(0, i * bh, W, bh + 1);
    }
  }

  // Photo-rects: 8 rects at three scale tiers, seeded layout, generous air.
  // tier widths are fractions of field width: large 0.25, medium 0.12, small 0.06
  // (small tier widened to 0.11 on narrow fields so glyphs stay legible).
  var rectDefs = [
    { tier: 'L', gx: 0.30, gy: 0.20, kind: 'cake' },
    { tier: 'L', gx: 0.68, gy: 0.58, kind: 'car' },
    { tier: 'M', gx: 0.16, gy: 0.55, kind: 'book' },
    { tier: 'M', gx: 0.78, gy: 0.24, kind: 'plant' },
    { tier: 'M', gx: 0.50, gy: 0.82, kind: 'cake' },
    { tier: 'S', gx: 0.14, gy: 0.30, kind: 'plant' },
    { tier: 'S', gx: 0.86, gy: 0.78, kind: 'book' },
    { tier: 'S', gx: 0.55, gy: 0.44, kind: 'car' }
  ];
  var rects = [];
  for (var i = 0; i < rectDefs.length; i++) {
    var d = rectDefs[i];
    rects.push({
      gx: d.gx, gy: d.gy, kind: d.kind, tier: d.tier,
      rot: (rnd() - 0.5) * 0.16,
      bobPeriod: 9 + rnd() * 7,
      bobPhase: rnd() * Math.PI * 2,
      bobAmp: 6 + rnd() * 10,
      jx: (rnd() - 0.5) * 0.04, jy: (rnd() - 0.5) * 0.04
    });
  }

  // Rhinestones: seeded glints on a slow traveling wave.
  var rhines = [];
  for (var r = 0; r < 46; r++) {
    rhines.push({
      x: rnd(), y: rnd(),
      phase: rnd() * Math.PI * 2,
      speed: 0.25 + rnd() * 0.35,
      size: 2 + rnd() * 3.5
    });
  }
  // Glitter: gold dots drifting upward, closed-form wrap over piece time.
  var glitters = [];
  for (var g = 0; g < 90; g++) {
    glitters.push({
      x: rnd(), y0: rnd(),
      speed: 0.008 + rnd() * 0.02,
      size: 1 + rnd() * 2,
      phase: rnd() * Math.PI * 2
    });
  }

  // Drag pan: recorded segments, closed-form decay (tau 2.5 s).
  var drags = [], dragging = false, lastX = 0, lastY = 0;
  function panAt(t) {
    var px = 0, py = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i], age = t - d.t;
      if (age < 0) age = 0;
      var w = Math.exp(-age / 2.5);
      px += d.dx * w; py += d.dy * w;
    }
    if (px > 40) px = 40; if (px < -40) px = -40;
    if (py > 30) py = 30; if (py < -30) py = -30;
    return { x: px, y: py };
  }
  function onDown(e) {
    dragging = true;
    lastX = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
    lastY = (e.clientY !== undefined) ? e.clientY : e.touches[0].clientY;
  }
  function onMove(e) {
    if (!dragging) return;
    var x = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
    var y = (e.clientY !== undefined) ? e.clientY : e.touches[0].clientY;
    drags.push({ dx: x - lastX, dy: y - lastY, t: pieceTime() });
    lastX = x; lastY = y;
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // Glyphs: clean outlines, never photographic, never faces.
  function drawCake(cx, cy, s) {
    ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = Math.max(1, s * 0.02);
    ctx.strokeRect(cx - s * 0.42, cy - s * 0.10, s * 0.84, s * 0.28);
    ctx.strokeRect(cx - s * 0.30, cy - s * 0.34, s * 0.60, s * 0.24);
    for (var i = 0; i < 3; i++) {
      var x = cx - s * 0.22 + i * s * 0.22;
      ctx.beginPath(); ctx.moveTo(x, cy - s * 0.34); ctx.lineTo(x, cy - s * 0.48); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, cy - s * 0.54); ctx.arc(x, cy - s * 0.54, s * 0.03, 0, Math.PI * 2); ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(cx - s * 0.42, cy + s * 0.04); ctx.lineTo(cx + s * 0.42, cy + s * 0.04); ctx.stroke();
  }
  function drawBook(cx, cy, s) {
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.02);
    ctx.strokeRect(cx - s * 0.34, cy - s * 0.42, s * 0.68, s * 0.84);
    ctx.beginPath(); ctx.moveTo(cx - s * 0.14, cy - s * 0.42); ctx.lineTo(cx - s * 0.14, cy + s * 0.42); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.font = 'bold ' + Math.max(6, Math.round(s * 0.14)) + 'px Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save();
    ctx.translate(cx + s * 0.10, cy);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('JAZZ', 0, 0);
    ctx.restore();
  }
  function drawCar(cx, cy, s) {
    ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = Math.max(1, s * 0.02);
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.48, cy + s * 0.22);
    ctx.lineTo(cx - s * 0.40, cy - s * 0.02);
    ctx.lineTo(cx - s * 0.18, cy - s * 0.18);
    ctx.lineTo(cx + s * 0.20, cy - s * 0.18);
    ctx.lineTo(cx + s * 0.42, cy - s * 0.02);
    ctx.lineTo(cx + s * 0.48, cy + s * 0.22);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - s * 0.28, cy + s * 0.22); ctx.arc(cx - s * 0.28, cy + s * 0.22, s * 0.09, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + s * 0.28, cy + s * 0.22); ctx.arc(cx + s * 0.28, cy + s * 0.22, s * 0.09, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - s * 0.18, cy - s * 0.02); ctx.lineTo(cx + s * 0.20, cy - s * 0.02); ctx.stroke();
  }
  function drawPlant(cx, cy, s) {
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.02);
    for (var i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(cx, cy + s * 0.40);
      ctx.bezierCurveTo(cx + i * s * 0.10, cy + s * 0.10, cx + i * s * 0.28, cy - s * 0.10, cx + i * s * 0.30, cy - s * 0.38);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(cx - s * 0.10, cy + s * 0.40); ctx.lineTo(cx + s * 0.10, cy + s * 0.40); ctx.stroke();
  }
  function drawGlyph(kind, cx, cy, s) {
    if (kind === 'cake') drawCake(cx, cy, s);
    else if (kind === 'book') drawBook(cx, cy, s);
    else if (kind === 'car') drawCar(cx, cy, s);
    else drawPlant(cx, cy, s);
  }

  var W = 0, H = 0, startTime = 0, booted = false;
  function pieceTime() {
    if (!booted) return 0;
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - startTime) / 1000;
    return 0;
  }
  function size() {
    var vw = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.width : window.innerWidth;
    var vh = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
  }
  function isPhone() {
    var minDim = Math.min(window.screen.width, window.screen.height);
    if (minDim < 700) return true;
    return H > W * 1.15;
  }

  function draw(t) {
    size();
    var phone = isPhone();
    var ground = mix3(PINK, GOLD, 0.25);
    ctx.fillStyle = ground;
    ctx.fillRect(0, 0, W, H);
    drawOmbre(W, H);
    var pan = panAt(t);
    var minD = Math.min(W, H);

    // Rhinestone glints: slow traveling wave, closed-form.
    for (var i = 0; i < rhines.length; i++) {
      var rh = rhines[i];
      var wave = 0.5 + 0.5 * Math.sin(t * rh.speed * 2 + rh.x * 6.0 + rh.phase);
      var a = 0.25 + 0.75 * wave;
      var rx = rh.x * W + pan.x * 0.4, ry = rh.y * H + pan.y * 0.4;
      ctx.fillStyle = 'rgba(245,215,110,' + a.toFixed(3) + ')';
      var s = rh.size;
      ctx.beginPath(); ctx.moveTo(rx, ry - s); ctx.lineTo(rx + s * 0.35, ry - s * 0.35);
      ctx.lineTo(rx + s, ry); ctx.lineTo(rx + s * 0.35, ry + s * 0.35);
      ctx.lineTo(rx, ry + s); ctx.lineTo(rx - s * 0.35, ry + s * 0.35);
      ctx.lineTo(rx - s, ry); ctx.lineTo(rx - s * 0.35, ry - s * 0.35);
      ctx.closePath(); ctx.fill();
    }

    // Gold glitter drifting upward, closed-form wrap.
    for (var j = 0; j < glitters.length; j++) {
      var gl = glitters[j];
      var gy = ((gl.y0 - gl.speed * t) % 1 + 1) % 1;
      var gx = gl.x * W + Math.sin(t * 0.5 + gl.phase) * 4 + pan.x * 0.6;
      var gyy = gy * H + pan.y * 0.6;
      ctx.fillStyle = GLITTER;
      ctx.globalAlpha = 0.55 + 0.35 * Math.sin(t * 1.2 + gl.phase);
      ctx.beginPath(); ctx.moveTo(gx, gyy); ctx.arc(gx, gyy, gl.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Photo-rects: white print borders, slight rotations, slow vertical bob.
    for (var k = 0; k < rects.length; k++) {
      var rc = rects[k];
      var frac = rc.tier === 'L' ? 0.25 : (rc.tier === 'M' ? 0.12 : (phone ? 0.11 : 0.06));
      var rw = W * frac, rh2 = rw * 1.25;
      var bob = Math.sin(t * (Math.PI * 2 / rc.bobPeriod) + rc.bobPhase) * rc.bobAmp;
      var cx = (rc.gx + rc.jx) * W + pan.x;
      var cy = (rc.gy + rc.jy) * H + bob + pan.y;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rc.rot);
      ctx.fillStyle = PRINT;
      ctx.fillRect(-rw / 2, -rh2 / 2, rw, rh2);
      var pad = Math.max(4, rw * 0.08);
      ctx.fillStyle = mix3(GOLD, TEAL, (rc.gy + 0.3) % 1);
      ctx.globalAlpha = 0.16;
      ctx.fillRect(-rw / 2 + pad, -rh2 / 2 + pad, rw - pad * 2, rh2 - pad * 2);
      ctx.globalAlpha = 1;
      drawGlyph(rc.kind, 0, 0, Math.min(rw, rh2) * 0.55);
      ctx.restore();
    }
  }

  function loop() {
    draw(pieceTime());
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }

  // Boot: frame one is exactly t = 0, drawn synchronously at load.
  draw(0);
  booted = true;
  if (typeof performance !== 'undefined' && performance.now) startTime = performance.now();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(pieceTime()); });
    }
    window.addEventListener('resize', function () { draw(pieceTime()); });
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
