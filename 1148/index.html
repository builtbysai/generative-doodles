<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Impossible Rainbow</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- constants ----------
  var LOOP = 16;                    // seamless loop, seconds
  var T0 = 1.6;                     // fixed first-frame phase: calm, no anomaly
  var BG = '#050505';
  var BANDS = ['#FF003C', '#FF7A00', '#FFD800', '#00E53C', '#00C8FF', '#7A00FF'];
  var UNNAMED = '#555555';
  var N_BANDS = 6;
  var BETA = 18 * Math.PI / 180;    // arc spring angle from the horizontal ends
  var SEG = 160;                    // polyline steps per band arc

  // Flicker: precomputed brightness-step table, 32 steps of 0.5 s (= the 16 s
  // loop exactly), one row per band, values 0.86..1.00. Brightness steps only;
  // a step lasts 0.5 s, so nothing here can strobe.
  var FLICK_STEPS = 32;
  var flicker = [];
  (function buildFlicker() {
    var rnd = mulberry32(11483051);
    for (var b = 0; b < N_BANDS; b++) {
      var row = [];
      for (var s = 0; s < FLICK_STEPS; s++) row.push(0.86 + rnd() * 0.14);
      flicker.push(row);
    }
    // Frame one (t = 1.6 s -> step 3): exactly one band visibly a step dimmer
    // (band 5, the cyan), the rest near full.
    var step0 = Math.floor(T0 / (LOOP / FLICK_STEPS));
    for (var b2 = 0; b2 < N_BANDS; b2++) {
      flicker[b2][step0] = (b2 === 4) ? 0.83 : Math.max(flicker[b2][step0], 0.95);
    }
  })();

  // Dropout jitter: seeded vertical offsets, one per 0.25 s slot of the
  // 3 s dropout window, -2..+2 px (scaled by unit at draw time).
  var jitter = [];
  (function buildJitter() {
    var rnd = mulberry32(11480707);
    for (var i = 0; i < 12; i++) jitter.push(Math.round(rnd() * 4) - 2);
  })();

  // Fixed anomaly schedule (loop seconds). Max one anomaly at a time.
  var DROP_T0 = 4, DROP_T1 = 7, DROP_BAND = 2;        // yellow -> unnamed gray
  var SWAP_T0 = 10, SWAP_T1 = 12, SWAP_A = 1, SWAP_B = 4; // orange <-> cyan

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, U = 1;
  var PHONE = false;

  function fit() {
    var vw = (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) || window.innerWidth || 720;
    var vh = (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.height) || window.innerHeight || 720;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(vw); H = Math.round(vh);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
    U = Math.min(W, H) / 720;   // unit scale vs the 720 reference frame
    if (U <= 0) U = 1;
  }

  function bandColor(i, t) {
    if (t >= SWAP_T0 && t < SWAP_T1) {
      if (i === SWAP_A) return BANDS[SWAP_B];
      if (i === SWAP_B) return BANDS[SWAP_A];
    }
    if (i === DROP_BAND && t >= DROP_T0 && t < DROP_T1) return UNNAMED;
    return BANDS[i];
  }

  function drawBand(cx, cy, rx, ry, yOff) {
    ctx.beginPath();
    for (var s = 0; s <= SEG; s++) {
      var th = Math.PI + BETA + (Math.PI - 2 * BETA) * (s / SEG);
      var x = cx + rx * Math.cos(th);
      var y = cy + ry * Math.sin(th) + yOff;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var lt = ((t % LOOP) + LOOP) % LOOP;
    var step = Math.floor(lt / (LOOP / FLICK_STEPS)) % FLICK_STEPS;

    // Geometry: outer ellipse springs from near the bottom corners.
    // Half-span = rx0 * cos(BETA) = 0.40 * W  ->  arc spans 80% of width.
    // Crown at 0.16 * H, spring points at ~0.93 * H.
    var rx0 = 0.40 * W / Math.cos(BETA);
    var ry0 = 1.114 * H;
    var cx = W / 2;
    var cy = 0.16 * H + ry0;
    var T = 0.045 * Math.min(W, H);          // band thickness, px
    if (PHONE) T = 0.05 * Math.min(W, H);

    var dropping = (lt >= DROP_T0 && lt < DROP_T1);
    var jOff = 0;
    if (dropping) {
      var jslot = clamp(Math.floor((lt - DROP_T0) / 0.25), 0, jitter.length - 1);
      jOff = jitter[jslot] * Math.max(1, U);
    }

    ctx.lineCap = 'butt';
    for (var i = 0; i < N_BANDS; i++) {
      var rx = rx0 - (i + 0.5) * T;
      var ry = ry0 - (i + 0.5) * T;
      ctx.globalAlpha = flicker[i][step];
      ctx.strokeStyle = bandColor(i, lt);
      ctx.lineWidth = Math.max(1, T - 2);    // 2 px of black between bands
      drawBand(cx, cy, rx, ry, (i === DROP_BAND && dropping) ? jOff : 0);
    }
    ctx.globalAlpha = 1;
  }

  fit();
  draw(T0);

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(T0); });
    }
    window.addEventListener('resize', function () { fit(); draw(T0); });
  }

  if (typeof requestAnimationFrame === 'function') {
    var startTs = null;
    var tick = function (ts) {
      if (startTs === null) startTs = ts;
      draw(T0 + (ts - startTs) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
