<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hace 7.000 Años</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ECE5D3; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.667 "Hace 7.000 Años" (EXPANSION #81 jose-perez-de-arce, block 3).
  // His reconstruction practice as a generator. One parametric figure,
  // caught mid-gesture in deep time, drawn in graphite hatch on paper:
  // a Chinchorro kneeling over a harpoon, an Aconcagua hunter waiting
  // with a bow, a Diaguita bent over a digging stick, a Mapochoe
  // raising the antara. Bottom-left, the caption engine writes its two
  // lines, his own caption habit: how long ago, and one dry remark.
  // Tap excavates the next era; double-tap reseeds the dig.

  var PAPER = '#ECE5D3';
  var GRAPHITE = '#2A2A2E';
  var SEA = '#3E6B6B';
  var OCHRE = '#C08A3E';

  // Composition space: FW x FH abstract units, mapped onto the viewport.
  var FW = 1.6, FH = 1.0;
  var HORIZON = 0.667; // comp y of the horizon line (2/3 down)

  var BASE_SEED = 667001;
  var SCENE_LOOP = 30;   // the subtle inside-scene loop, seconds
  var FADE_T = 1.2;      // era crossfade, seconds
  var TAP_DELAY = 0.35;  // single tap is confirmed after this long
  var DBL_GAP = 0.32;    // two taps closer than this are a double-tap

  // The caption's second line names the present year: the prompt's
  // "hoy". It is read once from the system date at load and is the
  // ONLY date-derived element in the piece; every drawn shape is a
  // function of the seeds and the anchored clock. See process.md.
  var YEAR = new Date().getFullYear();

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function fract(v) { return v - Math.floor(v); }

  // ------------------------------------------------------------------
  // THE FOUR ERAS. gx/gy = the figure's ground point in comp units;
  // S = figure size (local unit height in comp units); line1 = the
  // caption's first line, his "hace ..." formula.
  // ------------------------------------------------------------------
  var ERAS = [
    { key: 'chinchorro', gx: 0.74, gy: 0.815, S: 0.46, line1: 'hace unos 7.000 años.' },
    { key: 'aconcagua',  gx: 0.78, gy: 0.825, S: 0.44, line1: 'hace unos 500 años.' },
    { key: 'diaguita',   gx: 0.76, gy: 0.825, S: 0.46, line1: 'hace unos 600 años.' },
    { key: 'mapochoe',   gx: 0.78, gy: 0.825, S: 0.44, line1: 'hace unos 300 años.' }
  ];
  // The dry second lines. Index 0 is the launch line; later scenes
  // draw from the list by seed.
  var LINE2 = [
    'Diferente a hoy, ' + YEAR + '.',
    'Sin prisa, todavía.',
    'El oficio era el mismo.',
    'Nadie miraba el reloj.',
    'Trabajo lento, bien hecho.',
    'La herramienta alcanzaba.'
  ];

  // ------------------------------------------------------------------
  // Era sequence. seq[0] is always the Chinchorro (the launch scene);
  // the rest is filled from seeded shuffled bags of the four eras,
  // never repeating an era back to back.
  // ------------------------------------------------------------------
  function buildSequence(seed) {
    var rng = mulberry32(seed);
    var seq = [0], last = 0, guard = 0;
    while (seq.length < 96 && guard++ < 500) {
      var bag = [0, 1, 2, 3];
      for (var i = 3; i > 0; i--) {
        var j = Math.floor(rng() * (i + 1));
        var tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
      }
      for (var k = 0; k < 4 && seq.length < 96; k++) {
        if (bag[k] === last) continue;
        seq.push(bag[k]); last = bag[k];
      }
    }
    return seq;
  }

  // ------------------------------------------------------------------
  // Per-era precomputed decor: backdrop marks, ground hatch, contact
  // ticks and particles. All seeded, all static geometry; only the
  // particle positions and the figure move, as functions of time.
  // ------------------------------------------------------------------
  function buildDecor(eraIdx) {
    var rng = mulberry32(BASE_SEED + eraIdx * 100003);
    var d = { waves: [], ridges: [], furrows: [], rows: [], river: [],
              hatch: [], contact: [], particles: [] };
    var i, x, y;
    if (eraIdx === 0) {
      // Sea marks: short horizontal wavelets above the horizon.
      for (i = 0; i < 30; i++) {
        x = 0.04 + rng() * 1.5;
        y = 0.545 + rng() * 0.105;
        d.waves.push({ x: x, y: y, len: 0.035 + rng() * 0.05, ph: rng() * 6.28 });
      }
    } else if (eraIdx === 1) {
      // Two hill ridges above the horizon.
      for (var r = 0; r < 2; r++) {
        var pts = [], base = r === 0 ? 0.585 : 0.63, amp = r === 0 ? 0.035 : 0.02;
        for (i = 0; i <= 24; i++) {
          x = -0.05 + (1.7 * i) / 24;
          y = base - Math.abs(Math.sin(i * (1.3 + r * 0.7) + r * 2.1)) * amp - rng() * 0.006;
          pts.push([x, y]);
        }
        d.ridges.push(pts);
      }
    } else if (eraIdx === 2) {
      // Field rows: furrows converging on a vanishing point at the
      // horizon, plus three cross rows curving over the field.
      var vx = 0.52;
      for (i = 0; i < 11; i++) {
        x = 0.02 + i * 0.155;
        d.furrows.push([[vx, HORIZON + 0.004], [x, 1.01]]);
      }
      var rowY = [0.725, 0.80, 0.885];
      for (i = 0; i < 3; i++) {
        var rp = [];
        for (var s2 = 0; s2 <= 16; s2++) {
          x = -0.05 + (1.7 * s2) / 16;
          rp.push([x, rowY[i] + Math.sin((s2 / 16) * Math.PI) * 0.008]);
        }
        d.rows.push(rp);
      }
    } else if (eraIdx === 3) {
      // River marks: three wavy bands in the ground, left and centre.
      for (var b = 0; b < 3; b++) {
        var bp = [], by = 0.735 + b * 0.055;
        for (i = 0; i <= 20; i++) {
          x = 0.03 + (1.02 * i) / 20;
          bp.push([x, by + Math.sin(i * 1.7 + b * 2.3) * 0.006]);
        }
        d.river.push(bp);
      }
    }
    // Ground hatch: sparse diagonal ticks below the horizon.
    for (i = 0; i < 44; i++) {
      x = 0.03 + rng() * 1.54;
      y = HORIZON + 0.02 + rng() * 0.30;
      d.hatch.push({ x: x, y: y, len: 0.012 + rng() * 0.02, ang: 0.5 + rng() * 0.35 });
    }
    // Contact ticks under the figure's ground point.
    var era = ERAS[eraIdx];
    for (i = 0; i < 9; i++) {
      d.contact.push({ x: era.gx - 0.16 + rng() * 0.36, y: era.gy + 0.004 + rng() * 0.012,
                       len: 0.014 + rng() * 0.024 });
    }
    // Particles: shavings, dust or breath motes, per era.
    var NP = 16;
    for (i = 0; i < NP; i++) {
      d.particles.push({
        ph0: rng(), vx: (rng() - 0.5), vy: rng(), grav: 0.6 + rng() * 0.7,
        size: 0.6 + rng() * 1.1, spread: rng()
      });
    }
    return d;
  }
  var DECOR = [buildDecor(0), buildDecor(1), buildDecor(2), buildDecor(3)];

  // ------------------------------------------------------------------
  // FIGURE RIGS. Each era computes its joints in composition coords
  // from the scene-local time t. Local space: x to the right (the
  // facing direction), yUp up from the ground point, scaled by S.
  // The gesture phase offsets are chosen so that at t = 0 every
  // figure is already mid-gesture, never at a rest pose.
  // ------------------------------------------------------------------
  function joints(eraIdx, t) {
    var era = ERAS[eraIdx], S = era.S, gx = era.gx, gy = era.gy;
    function P(x, yUp) { return [gx + x * S, gy - yUp * S]; }
    var J = {};
    if (eraIdx === 0) {
      // CHINCHORRO, kneeling, hafting a harpoon. The working hand
      // wraps the binding in a small ellipse; the shoulders rock.
      var w1 = Math.sin(2 * Math.PI * t / 2.6 + 0.9);
      var w2 = Math.sin(2 * Math.PI * t / 1.3 + 1.5);
      var lean = 0.012 * Math.sin(2 * Math.PI * t / 5.2 + 0.4);
      J.kneeF = P(0.14, 0.05); J.ankleF = P(-0.20, 0.03); J.toeF = P(-0.27, 0.0);
      J.kneeB = P(0.02, 0.035); J.ankleB = P(-0.24, 0.015);
      J.hip = P(0.0, 0.34);
      J.shoulder = P(0.10 + lean, 0.66);
      J.headC = P(0.17 + lean * 1.4, 0.78); J.headR = 0.082 * S;
      J.elbowF = P(0.26, 0.47); J.handF = P(0.47, 0.36);
      J.elbowW = P(0.31, 0.45);
      J.handW = P(0.52 + 0.022 * w1, 0.42 + 0.026 * w2);
      J.toolA = J.handW;
      J.toolB = P(0.52 + 0.022 * w1 + 0.075, 0.42 + 0.026 * w2 + 0.05);
      J.shaftA = P(0.33, 0.02); J.shaftB = P(0.66, 0.68);
      J.bind = P(0.50, 0.395); // particle origin: the binding point
    } else if (eraIdx === 1) {
      // ACONCAGUA HUNTER, standing, waiting with a bow. The bow arm
      // sways as he scans; the head turns a little; nothing hurries.
      var sway = 0.030 * Math.sin(2 * Math.PI * t / 6.5 + 1.1);
      var turn = 0.014 * Math.sin(2 * Math.PI * t / 11 + 0.3);
      var sh = P(0.02, 0.86);
      var hand = P(0.375, 0.72);
      var dx = hand[0] - sh[0], dy = hand[1] - sh[1];
      var ca = Math.cos(sway), sa = Math.sin(sway);
      var hRot = [sh[0] + dx * ca - dy * sa, sh[1] + dx * sa + dy * ca];
      J.foot1 = P(0.07, 0); J.knee1 = P(0.05, 0.26);
      J.foot2 = P(-0.11, 0); J.knee2 = P(-0.07, 0.27);
      J.hip = P(0.0, 0.50); J.shoulder = sh;
      J.headC = P(0.05 + turn, 0.97); J.headR = 0.080 * S;
      J.elbowB = P(0.22, 0.77); J.handB = hRot;
      J.bowTop = P(0.39, 1.06); J.bowBot = P(0.39, 0.38);
      J.bowOut = P(0.475, 0.72);
      // Bow tips follow the sway rotation about the shoulder too.
      J.bowTop = rotAbout(J.bowTop, sh, sway); J.bowBot = rotAbout(J.bowBot, sh, sway);
      J.bowOut = rotAbout(J.bowOut, sh, sway);
      J.elbowF = P(-0.13, 0.68); J.handF = P(-0.18, 0.50);
      J.quivA = P(-0.05, 0.85); J.quivB = P(-0.14, 0.60);
      J.bind = hRot; // dust drifts from the bow hand
    } else if (eraIdx === 2) {
      // DIAGUITA, bent over a digging stick. A 3.4 s dig cycle:
      // press down, lift, press again.
      var gd = fract(t / 3.4);
      var press = Math.pow(0.5 - 0.5 * Math.cos(2 * Math.PI * gd), 1.4);
      var bob = -0.034 * press;
      J.footF = P(0.15, 0); J.kneeF = P(0.12, 0.20);
      J.footB = P(-0.20, 0); J.kneeB = P(-0.13, 0.19);
      J.hip = P(0.0, 0.40);
      J.shoulder = P(0.24, 0.58 + bob);
      J.headC = P(0.335, 0.625 + bob * 1.15); J.headR = 0.080 * S;
      J.elbow = P(0.34, 0.33 + bob * 0.8);
      J.elbow2 = P(0.295, 0.355 + bob * 0.8);
      J.hands = P(0.44, 0.17 + bob * 0.55);
      J.stickTop = P(0.42, 0.30 + bob * 0.55);
      J.stickTip = P(0.50, -0.005);
      J.bind = J.stickTip; // soil bursts at the tip
    } else {
      // MAPOCHOE, standing, raising the antara. A slow sway rotates
      // the whole upper body about the hips; the pipes tilt with it.
      var a = 0.030 * Math.sin(2 * Math.PI * t / 7.5 + 0.8);
      var hip = P(0.0, 0.48);
      function R(p) { return rotAbout(p, hip, a); }
      J.foot1 = P(0.07, 0); J.knee1 = P(0.05, 0.25);
      J.foot2 = P(-0.11, 0); J.knee2 = P(-0.07, 0.26);
      J.hip = hip;
      J.shoulder = R(P(0.02, 0.84));
      J.headC = R(P(0.06, 0.955)); J.headR = 0.080 * S;
      J.elbowL = R(P(0.21, 0.64)); J.handL = R(P(0.205, 0.83));
      J.elbowR = R(P(-0.09, 0.62)); J.handR = R(P(0.055, 0.84));
      J.hub = R(P(0.13, 0.885));
      J.tubes = [];
      for (var i = 0; i < 7; i++) {
        var tx = 0.045 + i * 0.028, len = 0.195 - i * 0.018;
        J.tubes.push([R(P(tx, 0.878)), R(P(tx, 0.878 - len))]);
      }
      J.bind = R(P(0.13, 0.68)); // breath motes leave the tube ends
    }
    return J;
  }
  function rotAbout(p, c, a) {
    var dx = p[0] - c[0], dy = p[1] - c[1];
    var ca = Math.cos(a), sa = Math.sin(a);
    return [c[0] + dx * ca - dy * sa, c[1] + dx * sa + dy * ca];
  }

  // Hatch texture parameters per era: ticks riding on body segments,
  // given as (segment key pair, position along, offset, length).
  var HATCH = [
    [ ['hip', 'shoulder', 0.3, 0.016, 0.030], ['hip', 'shoulder', 0.55, 0.02, 0.034],
      ['hip', 'shoulder', 0.78, 0.014, 0.026], ['kneeF', 'hip', 0.45, 0.014, 0.028] ],
    [ ['hip', 'shoulder', 0.35, 0.016, 0.032], ['hip', 'shoulder', 0.62, 0.02, 0.03],
      ['knee1', 'hip', 0.5, 0.014, 0.028], ['knee2', 'hip', 0.4, -0.014, 0.026] ],
    [ ['hip', 'shoulder', 0.35, 0.018, 0.034], ['hip', 'shoulder', 0.65, 0.02, 0.03],
      ['kneeF', 'hip', 0.5, 0.015, 0.028] ],
    [ ['hip', 'shoulder', 0.35, 0.016, 0.032], ['hip', 'shoulder', 0.6, 0.02, 0.03],
      ['knee1', 'hip', 0.5, 0.014, 0.028], ['knee2', 'hip', 0.45, -0.014, 0.026] ]
  ];

  // ------------------------------------------------------------------
  // Layout (Visual Viewport API, resize listeners on both)
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var scale = 1, orgX = 0, orgY = 0;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    scale = Math.min(W / FW, H / FH) * 0.97;
    orgX = (W - FW * scale) / 2;
    orgY = (H - FH * scale) / 2;
  }
  function px(x) { return orgX + x * scale; }
  function py(y) { return orgY + y * scale; }

  // ------------------------------------------------------------------
  // Drawing helpers. All strokes are graphite unless noted; a limb is
  // one round-capped polyline plus a fainter offset twin, the pencil
  // grain. Widths are in composition units, scaled here.
  // ------------------------------------------------------------------
  function strokePts(pts, wComp, color, alpha) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(0.7, wComp * scale);
    ctx.beginPath();
    ctx.moveTo(px(pts[0][0]), py(pts[0][1]));
    for (var i = 1; i < pts.length; i++) ctx.lineTo(px(pts[i][0]), py(pts[i][1]));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function limb(a, b, wComp, alpha) {
    strokePts([a, b], wComp, GRAPHITE, alpha);
    strokePts([[a[0] + 0.0022, a[1] + 0.0016], [b[0] + 0.0022, b[1] + 0.0016]],
              wComp * 0.45, GRAPHITE, alpha * 0.4);
  }
  function drawHead(J, alpha) {
    // A short neck joins the head to the shoulder, then the outline
    // circle as a 20-gon, a hair cap over the top, one nose tick on
    // the facing side.
    var c = J.headC, r = J.headR, pts = [], i, a;
    if (J.shoulder) {
      strokePts([J.shoulder, [c[0] - r * 0.15, c[1] + r * 0.82]], 0.0042, GRAPHITE, alpha * 0.9);
    }
    for (i = 0; i <= 20; i++) {
      a = (i / 20) * Math.PI * 2;
      pts.push([c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r * 1.08]);
    }
    strokePts(pts, 0.0038, GRAPHITE, alpha * 0.92);
    var hair = [];
    for (i = 0; i <= 8; i++) {
      a = Math.PI * (1.08 + (i / 8) * 0.95);
      hair.push([c[0] + Math.cos(a) * r * 1.13, c[1] + Math.sin(a) * r * 1.2]);
    }
    strokePts(hair, 0.0044, GRAPHITE, alpha * 0.9);
    strokePts([[c[0] + r * 0.92, c[1] + r * 0.1], [c[0] + r * 1.12, c[1] + r * 0.28]],
              0.0032, GRAPHITE, alpha * 0.85);
  }
  function drawHatch(eraIdx, J, alpha) {
    var list = HATCH[eraIdx];
    ctx.strokeStyle = GRAPHITE;
    ctx.lineCap = 'round';
    for (var i = 0; i < list.length; i++) {
      var h = list[i], A = J[h[0]], B = J[h[1]];
      if (!A || !B) continue;
      var cxp = lerp(A[0], B[0], h[2]), cyp = lerp(A[1], B[1], h[2]);
      var dx = B[0] - A[0], dy = B[1] - A[1], L = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / L, ny = dx / L;
      var sx = cxp + nx * h[3], sy = cyp + ny * h[3];
      ctx.globalAlpha = alpha * 0.5;
      ctx.lineWidth = Math.max(0.6, 0.0022 * scale);
      ctx.beginPath();
      ctx.moveTo(px(sx - dx / L * h[4] / 2), py(sy - dy / L * h[4] / 2));
      ctx.lineTo(px(sx + dx / L * h[4] / 2), py(sy + dy / L * h[4] / 2));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // The four figures, drawn from their joints. LW = limb width.
  // ------------------------------------------------------------------
  var LW = 0.0052;
  function drawFigure(eraIdx, J, t, alpha) {
    ctx.save();
    if (eraIdx === 0) {
      // Legs folded under: thigh to the front knee, shin folded back.
      limb(J.hip, J.kneeF, LW, alpha * 0.95);
      limb(J.kneeF, J.ankleF, LW * 0.9, alpha * 0.95);
      limb(J.ankleF, J.toeF, LW * 0.7, alpha * 0.9);
      limb(J.hip, J.kneeB, LW * 0.85, alpha * 0.55);
      limb(J.kneeB, J.ankleB, LW * 0.8, alpha * 0.55);
      // Torso, leaning into the work, with a slight mid-spine bend.
      var spine = [(J.hip[0] + J.shoulder[0]) / 2 - 0.010, (J.hip[1] + J.shoulder[1]) / 2];
      limb(J.hip, spine, LW * 1.25, alpha);
      limb(spine, J.shoulder, LW * 1.25, alpha);
      // Far arm holds the shaft; working arm wraps the binding.
      limb(J.shoulder, J.elbowF, LW * 0.85, alpha * 0.6);
      limb(J.elbowF, J.handF, LW * 0.8, alpha * 0.6);
      limb(J.shoulder, J.elbowW, LW * 0.9, alpha * 0.95);
      limb(J.elbowW, J.handW, LW * 0.85, alpha * 0.95);
      // The harpoon: ochre shaft, graphite barb, binding ticks where
      // the hands work. The one ochre prop of the scene.
      strokePts([J.shaftA, J.shaftB], 0.0042, OCHRE, alpha * 0.95);
      strokePts([[J.shaftB[0], J.shaftB[1]], [J.shaftB[0] + 0.018, J.shaftB[1] + 0.015]], 0.0034, GRAPHITE, alpha);
      strokePts([[J.shaftB[0], J.shaftB[1]], [J.shaftB[0] - 0.006, J.shaftB[1] + 0.026]], 0.0034, GRAPHITE, alpha);
      for (var i = 0; i < 3; i++) {
        var bx = lerp(J.shaftA[0], J.shaftB[0], 0.60 + i * 0.045);
        var by = lerp(J.shaftA[1], J.shaftB[1], 0.60 + i * 0.045);
        strokePts([[bx - 0.011, by + 0.007], [bx + 0.011, by - 0.007]], 0.0028, GRAPHITE, alpha * 0.85);
      }
      // The binding tool in the working hand.
      limb(J.toolA, J.toolB, LW * 0.6, alpha * 0.9);
      drawHead(J, alpha);
    } else if (eraIdx === 1) {
      limb(J.hip, J.knee1, LW, alpha * 0.95); limb(J.knee1, J.foot1, LW * 0.9, alpha * 0.95);
      limb(J.hip, J.knee2, LW * 0.9, alpha * 0.7); limb(J.knee2, J.foot2, LW * 0.85, alpha * 0.7);
      limb(J.hip, J.shoulder, LW * 1.25, alpha);
      // Quiver on the back, two arrow ticks above it.
      limb(J.quivA, J.quivB, LW * 0.7, alpha * 0.55);
      strokePts([[J.quivA[0], J.quivA[1]], [J.quivA[0] - 0.012, J.quivA[1] - 0.03]], 0.0026, GRAPHITE, alpha * 0.55);
      strokePts([[J.quivA[0] + 0.012, J.quivA[1] + 0.004], [J.quivA[0] + 0.006, J.quivA[1] - 0.028]], 0.0026, GRAPHITE, alpha * 0.55);
      // Free arm hangs; bow arm extends.
      limb(J.shoulder, J.elbowF, LW * 0.85, alpha * 0.65);
      limb(J.elbowF, J.handF, LW * 0.8, alpha * 0.65);
      limb(J.shoulder, J.elbowB, LW * 0.9, alpha * 0.95);
      limb(J.elbowB, J.handB, LW * 0.85, alpha * 0.95);
      // The bow: one ochre arc, one graphite string.
      var bowPts = [];
      for (var b = 0; b <= 12; b++) {
        var f = b / 12;
        var bx2 = lerp(J.bowTop[0], J.bowBot[0], f) + (J.bowOut[0] - (J.bowTop[0] + J.bowBot[0]) / 2) * Math.sin(Math.PI * f) * 1.0;
        var by2 = lerp(J.bowTop[1], J.bowBot[1], f) + (J.bowOut[1] - (J.bowTop[1] + J.bowBot[1]) / 2) * Math.sin(Math.PI * f);
        bowPts.push([bx2, by2]);
      }
      strokePts(bowPts, 0.0042, OCHRE, alpha * 0.95);
      strokePts([J.bowTop, J.bowBot], 0.0022, GRAPHITE, alpha * 0.75);
      drawHead(J, alpha);
    } else if (eraIdx === 2) {
      limb(J.hip, J.kneeF, LW, alpha * 0.95); limb(J.kneeF, J.footF, LW * 0.9, alpha * 0.95);
      limb(J.hip, J.kneeB, LW * 0.9, alpha * 0.7); limb(J.kneeB, J.footB, LW * 0.85, alpha * 0.7);
      limb(J.hip, J.shoulder, LW * 1.25, alpha);
      limb(J.shoulder, J.elbow2, LW * 0.85, alpha * 0.55);
      limb(J.elbow2, J.hands, LW * 0.8, alpha * 0.55);
      limb(J.shoulder, J.elbow, LW * 0.9, alpha * 0.95);
      limb(J.elbow, J.hands, LW * 0.85, alpha * 0.95);
      // The digging stick: ochre shaft into the ground, graphite
      // foot-piece and tip. The one ochre prop of the scene.
      strokePts([J.stickTop, J.stickTip], 0.0046, OCHRE, alpha * 0.95);
      strokePts([[J.stickTip[0] - 0.02, J.stickTip[1] - 0.045], [J.stickTip[0] + 0.008, J.stickTip[1] - 0.038]], 0.003, GRAPHITE, alpha * 0.8);
      strokePts([[J.stickTip[0], J.stickTip[1]], [J.stickTip[0] + 0.006, J.stickTip[1] + 0.018]], 0.0034, GRAPHITE, alpha * 0.9);
      drawHead(J, alpha);
    } else {
      limb(J.hip, J.knee1, LW, alpha * 0.95); limb(J.knee1, J.foot1, LW * 0.9, alpha * 0.95);
      limb(J.hip, J.knee2, LW * 0.9, alpha * 0.7); limb(J.knee2, J.foot2, LW * 0.85, alpha * 0.7);
      limb(J.hip, J.shoulder, LW * 1.25, alpha);
      limb(J.shoulder, J.elbowR, LW * 0.85, alpha * 0.6);
      limb(J.elbowR, J.handR, LW * 0.8, alpha * 0.6);
      limb(J.shoulder, J.elbowL, LW * 0.9, alpha * 0.95);
      limb(J.elbowL, J.handL, LW * 0.85, alpha * 0.95);
      // The antara: a graphite bar at the lips, six ochre tubes of
      // descending length hanging from it. The one ochre prop.
      strokePts([J.tubes[0][0], J.tubes[J.tubes.length - 1][0]], 0.0032, GRAPHITE, alpha * 0.9);
      for (var q = 0; q < J.tubes.length; q++) {
        strokePts(J.tubes[q], 0.0036, OCHRE, alpha * 0.95);
        strokePts([[J.tubes[q][1][0] - 0.006, J.tubes[q][1][1]], [J.tubes[q][1][0] + 0.006, J.tubes[q][1][1]]],
                  0.0024, GRAPHITE, alpha * 0.7);
      }
      drawHead(J, alpha);
    }
    drawHatch(eraIdx, J, alpha);
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // Particles. Origins ride on the figure's work point (J.bind):
  // harpoon shavings, bow-hand dust, soil at the stick tip, breath
  // motes at the antara. All graphite specks.
  // ------------------------------------------------------------------
  function drawParticles(eraIdx, J, t, alpha) {
    var d = DECOR[eraIdx];
    ctx.fillStyle = GRAPHITE;
    for (var i = 0; i < d.particles.length; i++) {
      var p = d.particles[i], ph, lt, x, y, a2;
      if (eraIdx === 0) {
        ph = fract(t / 1.7 + p.ph0); lt = ph * 1.7;
        x = J.bind[0] + p.vx * 0.05 * lt + (p.spread - 0.5) * 0.012;
        y = J.bind[1] + 0.02 * lt + 0.055 * p.grav * lt * lt;
        a2 = (1 - ph) * 0.75;
      } else if (eraIdx === 1) {
        ph = fract(t / 3.4 + p.ph0); lt = ph * 3.4;
        x = J.bind[0] + p.vx * 0.03 * lt + (p.spread - 0.5) * 0.02;
        y = J.bind[1] + 0.012 * lt + 0.02 * p.grav * lt * lt;
        a2 = (1 - ph) * 0.4;
      } else if (eraIdx === 2) {
        ph = fract(t / 3.4 + p.ph0 * 0.10);
        if (ph > 0.42) continue;
        lt = ph * 3.4;
        x = J.bind[0] + p.vx * 0.11 * lt;
        y = J.bind[1] - (0.10 + 0.09 * p.vy) * lt + 0.16 * p.grav * lt * lt;
        a2 = (1 - ph / 0.42) * 0.8;
      } else {
        ph = fract(t / 3.0 + p.ph0); lt = ph * 3.0;
        x = J.bind[0] + (0.02 + 0.035 * p.vy) * lt + (p.spread - 0.5) * 0.01;
        y = J.bind[1] + 0.008 * lt + Math.sin(lt * 2.2 + p.ph0 * 9) * 0.004;
        a2 = (1 - ph) * 0.32;
      }
      if (a2 <= 0.01) continue;
      ctx.globalAlpha = alpha * a2;
      ctx.beginPath();
      ctx.arc(px(x), py(y), Math.max(0.5, p.size * 0.0016 * scale), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Backdrop, horizon, ground and caption for one scene.
  // ------------------------------------------------------------------
  function drawScene(eraIdx, t, alpha, line2) {
    var d = DECOR[eraIdx], i;
    // Backdrop marks, behind everything.
    if (eraIdx === 0) {
      ctx.strokeStyle = SEA;
      ctx.lineCap = 'round';
      for (i = 0; i < d.waves.length; i++) {
        var w = d.waves[i];
        var lift = Math.sin(t * 0.7 + w.ph) * 0.0018;
        ctx.globalAlpha = alpha * 0.75;
        ctx.lineWidth = Math.max(0.6, 0.0026 * scale);
        ctx.beginPath();
        for (var s = 0; s <= 6; s++) {
          var wx = w.x + (w.len * s) / 6;
          var wy = w.y + lift + Math.sin((s / 6) * Math.PI * 2 + w.ph) * 0.0028;
          if (s === 0) ctx.moveTo(px(wx), py(wy)); else ctx.lineTo(px(wx), py(wy));
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (eraIdx === 1) {
      for (i = 0; i < d.ridges.length; i++) strokePts(d.ridges[i], 0.0028, GRAPHITE, alpha * 0.6);
    } else if (eraIdx === 2) {
      for (i = 0; i < d.furrows.length; i++) strokePts(d.furrows[i], 0.0022, GRAPHITE, alpha * 0.30);
      for (i = 0; i < d.rows.length; i++) strokePts(d.rows[i], 0.0022, GRAPHITE, alpha * 0.28);
    } else {
      for (i = 0; i < d.river.length; i++) strokePts(d.river[i], 0.0026, SEA, alpha * 0.65);
    }
    // Horizon: one hand line, faintly doubled.
    var hz = [];
    for (i = 0; i <= 32; i++) {
      var hx = -0.04 + (1.68 * i) / 32;
      hz.push([hx, HORIZON + Math.sin(i * 1.93) * 0.0012]);
    }
    strokePts(hz, 0.0028, GRAPHITE, alpha * 0.8);
    // Ground hatch and contact ticks.
    ctx.strokeStyle = GRAPHITE;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(0.6, 0.002 * scale);
    for (i = 0; i < d.hatch.length; i++) {
      var g = d.hatch[i];
      ctx.globalAlpha = alpha * 0.32;
      ctx.beginPath();
      ctx.moveTo(px(g.x), py(g.y));
      ctx.lineTo(px(g.x + Math.cos(g.ang) * g.len), py(g.y + Math.sin(g.ang) * g.len * 0.45));
      ctx.stroke();
    }
    for (i = 0; i < d.contact.length; i++) {
      var c2 = d.contact[i];
      ctx.globalAlpha = alpha * 0.55;
      ctx.beginPath();
      ctx.moveTo(px(c2.x), py(c2.y));
      ctx.lineTo(px(c2.x + c2.len), py(c2.y));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // Figure and its particles.
    var J = joints(eraIdx, t);
    drawFigure(eraIdx, J, t, alpha);
    drawParticles(eraIdx, J, t, alpha);
    // The caption: two lines, bottom-left, small plain sans. This is
    // the prompt's own text, part of the piece, and nothing else in
    // the frame is text.
    var fs = clamp(0.021 * scale, 11, 20);
    ctx.font = Math.round(fs) + 'px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = GRAPHITE;
    ctx.globalAlpha = alpha * 0.9;
    ctx.fillText(ERAS[eraIdx].line1, px(0.07), py(0.905));
    ctx.globalAlpha = alpha * 0.62;
    ctx.fillText(line2, px(0.07), py(0.905) + fs * 1.45);
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Scene state and taps. Tap excavates the next era in the seeded
  // sequence; double-tap reseeds the whole dig (new sequence). Tap
  // times are recorded on the anchored clock and decided inside
  // draw(), so the state at any clock reading is deterministic:
  // a lone tap takes effect TAP_DELAY after it lands (long enough to
  // hear a second tap), two taps within DBL_GAP reseed instead.
  // ------------------------------------------------------------------
  var seedRound = 0;
  var eraSeq = buildSequence(BASE_SEED);
  var tapCount = 0;
  var cur = { idx: eraSeq[0], start: 0, line2: LINE2[0] };
  var prev = null;
  var tapQueue = [];

  function line2For(seed, n) {
    if (n === 0) return LINE2[0];
    var rng = mulberry32(seed * 31 + n * 7919);
    return LINE2[1 + Math.floor(rng() * (LINE2.length - 1))];
  }
  function advance(now) {
    prev = cur;
    tapCount++;
    var idx = eraSeq[tapCount % eraSeq.length];
    cur = { idx: idx, start: now, line2: line2For(BASE_SEED + seedRound * 104729, tapCount) };
  }
  function reseed(now) {
    seedRound++;
    eraSeq = buildSequence(BASE_SEED + seedRound * 104729);
    tapCount = 0;
    prev = cur;
    cur = { idx: eraSeq[0], start: now, line2: line2For(BASE_SEED + seedRound * 104729, 0 + seedRound) };
  }
  function processTaps(now) {
    while (tapQueue.length > 0) {
      if (tapQueue.length >= 2 && tapQueue[1] - tapQueue[0] < DBL_GAP) {
        tapQueue.splice(0, 2);
        reseed(now);
        continue;
      }
      if (now - tapQueue[0] >= TAP_DELAY) {
        tapQueue.shift();
        advance(now);
        continue;
      }
      break;
    }
  }

  // QA hook: location.search "seed=tNN" freezes the clock at NN
  // seconds into the launch scene.
  var forcedT = -1;
  try {
    var qs = String((typeof location !== 'undefined' && location.search) || '');
    var mt = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(qs);
    if (mt) forcedT = parseFloat(mt[1]);
  } catch (e) { forcedT = -1; }

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }

  function draw(nowOverride) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    // The synchronous first frame passes an explicit 0, so frame one
    // is always the launch scene at its loop start, never a live
    // clock reading.
    var now;
    if (forcedT >= 0) now = forcedT;
    else if (typeof nowOverride === 'number') now = nowOverride;
    else now = elapsed();
    processTaps(now);
    if (prev) {
      var fp = clamp((now - cur.start) / FADE_T, 0, 1);
      if (fp >= 1) prev = null;
      else {
        drawScene(prev.idx, now - prev.start, 1 - fp, prev.line2);
        drawScene(cur.idx, now - cur.start, fp, cur.line2);
        return;
      }
    }
    drawScene(cur.idx, now - cur.start, 1, cur.line2);
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function () {
      if (forcedT >= 0) return;
      tapQueue.push(elapsed());
    });
  }

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  resize();
  draw(0); // frame one: synchronous draw at the constant phase

  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
