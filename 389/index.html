<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.389 Too Small to Matter</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#123F4C; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.389 Too Small to Matter (maryna-lagereva).
// After Maryna Lagereva's @forplanetocean micro-
// fiction: a pale sea spirit kneels on a dark seabed
// beside a tiny glowing flabellina, and her four-line
// dialogue runs as caption cards along the bottom.
// TAP advances the beat (four beats, then back to
// the first); the beats change ONLY on tap, with a
// fade, and the scene itself never reloads. Under
// the stillness an ambient 50s loop runs on whole
// cycles: the spirit's hair sways, the cerata wave,
// the light rays shift, and exactly forty plankton
// motes rise, each completing whole rises per loop.
// The flabellina's glow is stepped flat alpha
// ellipses, never a blur. Palette is closed at the
// five specced hexes. The caption text is the
// artwork (the batch's designed-text exception) and
// is drawn on this ONE canvas in a serif face, the
// only text in the piece. All scatter is fixed
// seeded data baked at load; no offscreen canvas,
// no gradients, no filters, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var SEA = '#123F4C', RAY = '#2A6B7A', PALE = '#EAF4F0';
var FLAB = '#8E5FA8', GLOW = '#C9A0DC', SAND = '#3A5A5E';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 50;
if (LOOP !== 50) throw new Error('Too Small to Matter loop must be 50s');
var HAIR_P = 25; // 2 whole sway cycles per loop
if (LOOP % HAIR_P !== 0) throw new Error('hair sway must complete whole cycles per loop');
var CER_P = 10; // 5 whole cerata waves per loop
if (LOOP % CER_P !== 0) throw new Error('cerata wave must complete whole cycles per loop');
var TICK = 1 / 60;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-
// looking value is baked from this at load and never
// changes between frames or renders.
var seed = 389;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- the dialogue --------------------------------------
// Exactly her four beats, verbatim, in order. The
// beat index changes only on tap; after beat 4 the
// conversation loops back to beat 1.
var BEATS = [
  'Who are you?',
  "I'm no one important... I'm too small to matter.",
  'You shimmer like sunlight in deep water.',
  'For the first time, it believed her.'
];
if (BEATS.length !== 4) throw new Error('Too Small to Matter needs exactly 4 beats');
var beat = 0, beatPrev = 0, fade = 1; // fade: 0..1 crossfade progress
var FADE_LEN = 0.7;

// ---- light rays ----------------------------------------
// Five soft shafts from the top, flat alpha 0.3,
// shifting slowly on the whole 50s cycle.
var RAYS = [];
(function () {
  var spec = [
    { x: 170, w: 120, lean: 90 },
    { x: 420, w: 80, lean: 70 },
    { x: 640, w: 150, lean: 110 },
    { x: 880, w: 90, lean: 80 },
    { x: 1090, w: 130, lean: 100 }
  ];
  var i;
  for (i = 0; i < spec.length; i++) {
    RAYS.push({ x: spec[i].x, w: spec[i].w, lean: spec[i].lean, ph: rnd() * Math.PI * 2 });
  }
  if (RAYS.length !== 5) throw new Error('Too Small to Matter needs exactly 5 rays');
})();

function drawRays() {
  ctx.fillStyle = RAY;
  ctx.globalAlpha = 0.3;
  for (var i = 0; i < RAYS.length; i++) {
    var r = RAYS[i];
    var shift = 26 * Math.sin(Math.PI * 2 * T / LOOP + r.ph);
    var top = r.x + shift;
    ctx.beginPath();
    ctx.moveTo(top, -20);
    ctx.lineTo(top + r.w, -20);
    ctx.lineTo(top + r.w + r.lean, 760);
    ctx.lineTo(top + r.lean, 760);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- the spirit ----------------------------------------
// Kneeling silhouette in the left third: head at
// (348, 292), a soft bezier body sweeping down to a
// knee mound resting on the sand at y 724, one arm
// reaching gently toward the flabellina. Hair is 7
// strands rooted on the head, each a quadratic curve
// whose tip and control sway on the 25s whole cycle.
var HEAD = { x: 348, y: 292, r: 36 };
var HAIR = [];
(function () {
  var i;
  for (i = 0; i < 7; i++) {
    var a = Math.PI * (0.55 + i * 0.16); // roots fan over the back of the head
    HAIR.push({
      rx: HEAD.x + Math.cos(a) * HEAD.r * 0.92,
      ry: HEAD.y + Math.sin(a) * HEAD.r * 0.82 - 4,
      // Tips cascade: strands rooted lower hang shorter
      // and closer; strands rooted higher trail longer
      // and further back, so the fall fans instead of
      // bunching into one ribbon.
      len: 185 + i * 24 + rnd() * 30,
      drift: 26 + rnd() * 30 + (6 - i) * 5,
      ph: rnd() * Math.PI * 2,
      w: 5 + rnd() * 4.5
    });
  }
  if (HAIR.length !== 7) throw new Error('spirit hair needs exactly 7 strands');
})();

function drawSpirit() {
  var i, sway, h, tipX, tipY, cX, cY;
  // Hair behind the body.
  ctx.strokeStyle = PALE;
  ctx.lineCap = 'round';
  for (i = 0; i < HAIR.length; i++) {
    h = HAIR[i];
    sway = Math.sin(Math.PI * 2 * T / HAIR_P + h.ph);
    tipX = h.rx - h.drift + sway * 16;
    tipY = h.ry + h.len;
    cX = h.rx - h.drift * 0.3 + sway * 8;
    cY = h.ry + h.len * 0.55;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = h.w;
    ctx.beginPath();
    ctx.moveTo(h.rx, h.ry);
    ctx.quadraticCurveTo(cX, cY, tipX, tipY);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // Body: kneeling form, back curving from the neck
  // down to a folded knee mound on the sand.
  ctx.fillStyle = PALE;
  ctx.beginPath();
  ctx.moveTo(HEAD.x - 6, HEAD.y + 26);
  ctx.bezierCurveTo(300, 360, 288, 470, 302, 580);
  ctx.bezierCurveTo(310, 650, 292, 690, 268, 712);
  ctx.bezierCurveTo(330, 738, 436, 740, 500, 716);
  ctx.bezierCurveTo(472, 694, 448, 668, 438, 612); // the folded knee bulges forward
  ctx.bezierCurveTo(428, 520, 404, 424, 384, 356);
  ctx.bezierCurveTo(376, 322, 366, 300, 356, 282);
  ctx.closePath();
  ctx.fill();
  // A crease where the legs fold beneath her.
  ctx.strokeStyle = SEA;
  ctx.globalAlpha = 0.22;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(322, 694);
  ctx.quadraticCurveTo(400, 716, 478, 692);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // The reaching arm, sagging in one soft curve
  // from the shoulder toward the flabellina.
  ctx.strokeStyle = PALE;
  ctx.lineCap = 'round';
  ctx.lineWidth = 16;
  ctx.beginPath();
  ctx.moveTo(388, 438);
  ctx.quadraticCurveTo(466, 496, 530, 578);
  ctx.stroke();
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(530, 578);
  ctx.quadraticCurveTo(568, 624, 606, 642);
  ctx.stroke();
  // Head.
  ctx.beginPath();
  ctx.arc(HEAD.x, HEAD.y, HEAD.r, 0, Math.PI * 2);
  ctx.fill();
  // Face: two closed-eye arcs and a small serene
  // mouth, inked in the deep sea tone.
  ctx.strokeStyle = SEA;
  ctx.lineWidth = 2.4;
  ctx.beginPath(); // left closed eye
  ctx.arc(HEAD.x - 13, HEAD.y + 1, 6.5, Math.PI * 1.12, Math.PI * 1.88);
  ctx.stroke();
  ctx.beginPath(); // right closed eye
  ctx.arc(HEAD.x + 14, HEAD.y + 1, 6.5, Math.PI * 1.12, Math.PI * 1.88);
  ctx.stroke();
  ctx.beginPath(); // mouth
  ctx.arc(HEAD.x + 1, HEAD.y + 13, 4.5, Math.PI * 0.15, Math.PI * 0.85);
  ctx.stroke();
}

// ---- the flabellina ------------------------------------
// Right third, resting on the sand at (908, 706).
// Glow = three stepped flat alpha ellipses. Body =
// a tapered ellipse. Cerata = exactly 8 curved
// spikes along the back, waving on the 10s cycle.
var FLAB_POS = { x: 908, y: 706 };
var CERATA = [];
(function () {
  var i;
  for (i = 0; i < 8; i++) {
    CERATA.push({ t: i / 7, ph: i * 0.8, len: 26 + rnd() * 12 });
  }
  if (CERATA.length !== 8) throw new Error('flabellina needs exactly 8 cerata');
})();

function drawFlabellina() {
  var i, c, bx, by, wob, tipX, tipY;
  // Stepped glow, wide and faint to tight and stronger.
  var steps = [ [190, 74, 0.07], [140, 54, 0.13], [98, 38, 0.2] ];
  ctx.fillStyle = GLOW;
  for (i = 0; i < steps.length; i++) {
    ctx.globalAlpha = steps[i][2];
    ctx.beginPath();
    ctx.ellipse(FLAB_POS.x, FLAB_POS.y - 6, steps[i][0], steps[i][1], 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Cerata behind the body line.
  ctx.strokeStyle = FLAB;
  ctx.lineCap = 'round';
  for (i = 0; i < CERATA.length; i++) {
    c = CERATA[i];
    bx = FLAB_POS.x - 62 + c.t * 116;
    by = FLAB_POS.y - 16 - Math.sin(c.t * Math.PI) * 7;
    wob = Math.sin(Math.PI * 2 * T / CER_P + c.ph) * 7;
    tipX = bx - 7 + wob;
    tipY = by - c.len;
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx - 3 + wob * 0.5, by - c.len * 0.6, tipX, tipY);
    ctx.stroke();
    ctx.fillStyle = GLOW;
    ctx.beginPath();
    ctx.arc(tipX, tipY, 3.4, 0, Math.PI * 2);
    ctx.fill();
  }
  // Body: tapered ellipse, tail trailing left.
  ctx.fillStyle = FLAB;
  ctx.beginPath();
  ctx.moveTo(FLAB_POS.x - 84, FLAB_POS.y + 2);
  ctx.quadraticCurveTo(FLAB_POS.x - 40, FLAB_POS.y - 24, FLAB_POS.x + 30, FLAB_POS.y - 20);
  ctx.quadraticCurveTo(FLAB_POS.x + 82, FLAB_POS.y - 14, FLAB_POS.x + 86, FLAB_POS.y + 2);
  ctx.quadraticCurveTo(FLAB_POS.x + 40, FLAB_POS.y + 16, FLAB_POS.x - 30, FLAB_POS.y + 13);
  ctx.quadraticCurveTo(FLAB_POS.x - 70, FLAB_POS.y + 10, FLAB_POS.x - 84, FLAB_POS.y + 2);
  ctx.closePath();
  ctx.fill();
  // Two sensory rhinophores at the head end.
  ctx.strokeStyle = FLAB;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(FLAB_POS.x + 66, FLAB_POS.y - 14);
  ctx.quadraticCurveTo(FLAB_POS.x + 74, FLAB_POS.y - 30, FLAB_POS.x + 82, FLAB_POS.y - 34);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(FLAB_POS.x + 54, FLAB_POS.y - 16);
  ctx.quadraticCurveTo(FLAB_POS.x + 60, FLAB_POS.y - 31, FLAB_POS.x + 67, FLAB_POS.y - 36);
  ctx.stroke();
}

// ---- plankton motes ------------------------------------
// Exactly 40 motes asserted. Each mote owns a whole
// rise count per loop (1 or 2) and a phase, so over
// the 50s loop every mote makes only complete rises
// and wraps seamlessly. Sideways wobble runs on the
// same whole-cycle count.
var MOTES = [];
(function () {
  var i;
  for (i = 0; i < 40; i++) {
    MOTES.push({
      x: 40 + rnd() * 1200,
      p: rnd(),
      c: rnd() < 0.5 ? 1 : 2,
      r: 1.4 + rnd() * 1.7,
      amp: 4 + rnd() * 7,
      a: 0.3 + rnd() * 0.35
    });
  }
  if (MOTES.length !== 40) throw new Error('Too Small to Matter needs exactly 40 motes');
})();

function drawMotes() {
  ctx.fillStyle = PALE;
  for (var i = 0; i < MOTES.length; i++) {
    var m = MOTES[i];
    var f = (m.p + m.c * T / LOOP) % 1;
    var y = 800 - f * 760; // rises from near the sand toward the rays
    var x = m.x + m.amp * Math.sin(Math.PI * 2 * (m.c * T / LOOP + m.p));
    ctx.globalAlpha = m.a;
    ctx.beginPath();
    ctx.arc(x, y, m.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- the seabed ----------------------------------------
function drawSand() {
  ctx.fillStyle = SAND;
  ctx.beginPath();
  ctx.moveTo(-60, 742);
  ctx.bezierCurveTo(300, 706, 620, 752, 940, 722);
  ctx.bezierCurveTo(1120, 706, 1260, 724, 1340, 716);
  ctx.lineTo(1340, DH + 60);
  ctx.lineTo(-60, DH + 60);
  ctx.closePath();
  ctx.fill();
  // A few still pebbles and shell arcs resting on it.
  ctx.fillStyle = SEA;
  ctx.globalAlpha = 0.35;
  var peb = [ [180, 792, 16], [520, 812, 11], [724, 776, 9], [1062, 800, 14], [1188, 768, 8] ];
  for (var i = 0; i < peb.length; i++) {
    ctx.beginPath();
    ctx.ellipse(peb[i][0], peb[i][1], peb[i][2], peb[i][2] * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- the caption card ----------------------------------
// One line at the bottom, large readable serif,
// centred. During a tap fade the outgoing line and
// the incoming line crossfade. The card behind is a
// flat translucent panel in the ray tone.
function drawCaption() {
  ctx.fillStyle = RAY;
  ctx.globalAlpha = 0.28;
  ctx.beginPath();
  var cx = 90, cy = 806, cw = DW - 180, ch = 66, cr = 14;
  ctx.moveTo(cx + cr, cy);
  ctx.lineTo(cx + cw - cr, cy);
  ctx.quadraticCurveTo(cx + cw, cy, cx + cw, cy + cr);
  ctx.lineTo(cx + cw, cy + ch - cr);
  ctx.quadraticCurveTo(cx + cw, cy + ch, cx + cw - cr, cy + ch);
  ctx.lineTo(cx + cr, cy + ch);
  ctx.quadraticCurveTo(cx, cy + ch, cx, cy + ch - cr);
  ctx.lineTo(cx, cy + cr);
  ctx.quadraticCurveTo(cx, cy, cx + cr, cy);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = PALE;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var midY = cy + ch / 2 + 2;
  function captionLine(text, alpha) {
    var size = 40;
    ctx.font = size + 'px Georgia, "Times New Roman", serif';
    var wdt = ctx.measureText(text).width;
    if (wdt > cw - 60) {
      size = Math.floor(size * (cw - 60) / wdt);
      ctx.font = size + 'px Georgia, "Times New Roman", serif';
    }
    ctx.globalAlpha = alpha;
    ctx.fillText(text, DW / 2, midY);
  }
  if (fade < 1 && beatPrev !== beat) captionLine(BEATS[beatPrev], (1 - fade) * 0.95);
  captionLine(BEATS[beat], 0.15 + fade * 0.8);
  ctx.globalAlpha = 1;
}

// ---- motion state --------------------------------------
// Constant first-frame phase: T = 13.75s into the 50s
// loop (hair mid-sway, rays mid-shift, motes spread
// through their rises), beat 1 showing at full fade.
// Frame one is drawn synchronously at this constant;
// the rAF loop advances T from the same anchor in
// fixed ticks. Frame one never reads a wall clock.
var T = 13.75;
var lastNow = -1, acc = 0;

function step() {
  if (fade < 1) {
    fade = Math.min(1, fade + TICK / FADE_LEN);
    if (fade >= 1) beatPrev = beat;
  }
}

function draw() {
  ctx.fillStyle = SEA;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  drawRays();
  drawSand();
  drawMotes();
  drawSpirit();
  drawFlabellina();
  drawCaption();
}

// ---- tap: advance the beat ------------------------------
// A tap is a press and release close together in
// design space. Only the beat changes; the scene,
// the clock and the layout never reload.
var downX = -1, downY = -1, downT = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
canvas.addEventListener('pointerup', function (e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved < 28 && held < 0.8) {
    beatPrev = beat;
    beat = (beat + 1) % BEATS.length;
    fade = 0;
  }
});

// ---- sizing: centred fit, page ground = deep sea -------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
