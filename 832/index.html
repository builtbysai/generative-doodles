<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three-String Drone</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var COL = {
    bg: '#0A0A0A',
    one: '#EDEDED',
    two: '#9A9A9A',
    three: '#D98E2B',
    glyph: '#6B6B6B'
  };
  var LINE_COL = [COL.one, COL.two, COL.three];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- sizing: Visual Viewport API ----------
  var W = 0, H = 0, DPR = 1;
  function resize() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  function isPhone() {
    var s = (typeof window !== 'undefined') ? window.screen : null;
    if (s && typeof s.width === 'number' && typeof s.height === 'number') {
      return Math.min(s.width, s.height) < 700;
    }
    return H > W * 1.15;
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }

  // ---------- piece clock (never Date.now) ----------
  var startMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function nowT() {
    return (typeof performance !== 'undefined' && performance.now)
      ? (performance.now() - startMs) / 1000 : 0;
  }

  // ---------- bridge parameter b: recorded piecewise-linear points ----------
  var bPts = [{ t: 0, b: 0 }];
  function bAt(t) {
    var n = bPts.length, i, a, bb;
    if (t <= bPts[0].t) return bPts[0].b;
    for (i = 1; i < n; i++) {
      if (t <= bPts[i].t) {
        a = bPts[i - 1]; bb = bPts[i];
        if (bb.t === a.t) return bb.b;
        return a.b + (bb.b - a.b) * ((t - a.t) / (bb.t - a.t));
      }
    }
    return bPts[n - 1].b;
  }
  // integral of b from 0 to t (trapezoids over the linear pieces) in b-seconds
  function bInt(t) {
    var n = bPts.length, i, a, bb, acc = 0, bt;
    if (t <= 0) return 0;
    for (i = 1; i < n; i++) {
      a = bPts[i - 1]; bb = bPts[i];
      if (t >= bb.t) {
        acc += 0.5 * (a.b + bb.b) * (bb.t - a.t);
      } else {
        bt = a.b + (bb.b - a.b) * ((t - a.t) / (bb.t - a.t));
        acc += 0.5 * (a.b + bt) * (t - a.t);
        return acc;
      }
    }
    acc += bPts[n - 1].b * (t - bPts[n - 1].t);
    return acc;
  }
  function pushB(t, b) {
    var last = bPts[bPts.length - 1];
    if (t < last.t) t = last.t;
    if (t === last.t) { last.b = b; return; }
    bPts.push({ t: t, b: b });
  }

  // ---------- pitch epochs (double-tap reseeds) ----------
  var BASE_SEED = 832102;
  var reseedCount = 0;
  var epochs = [];
  function makeEpoch(t0, seed, basePhase) {
    var rnd = mulberry32(seed);
    var roots = [98.0, 110.0, 116.54, 130.81, 146.83, 164.81];
    var root = roots[Math.floor(rnd() * roots.length)];
    var offs = [0, 14 + rnd() * 21, -(14 + rnd() * 21)]; // cents at b = 1, max spread +/-35
    var driftAmp = [], driftW = [], driftP = [], i;
    for (i = 0; i < 3; i++) {
      driftAmp.push(1.2 + rnd() * 1.8);          // +/-3 cents max
      driftW.push(0.05 + rnd() * 0.11);          // slow: ~40-125 s periods
      driftP.push(rnd() * Math.PI * 2);
    }
    return {
      t0: t0, seed: seed, root: root, offs: offs,
      driftAmp: driftAmp, driftW: driftW, driftP: driftP,
      basePhase: basePhase || [0, 0, 0]
    };
  }
  epochs.push(makeEpoch(0, BASE_SEED, [0, 0, 0]));

  function epochAt(t) {
    var e = epochs[0], i;
    for (i = 1; i < epochs.length; i++) {
      if (epochs[i].t0 <= t) e = epochs[i]; else break;
    }
    return e;
  }
  var K = Math.LN2 / 1200;
  function driftCents(e, i, t) {
    return e.driftAmp[i] * Math.sin(e.driftW[i] * t + e.driftP[i]);
  }
  function centsAt(e, i, t) {
    return e.offs[i] * bAt(t) + driftCents(e, i, t);
  }
  function freqAt(i, t) {
    var e = epochAt(t);
    return e.root * Math.pow(2, centsAt(e, i, t) / 1200);
  }
  // voice phase in cycles: closed-form integral of the (linearised) frequency.
  // f ~= root * (1 + K * cents(t)); integral of cents splits into offs * int(b)
  // plus the exact integral of each drift sine.
  function phaseCycles(i, t) {
    var e = epochAt(t), te = e.t0;
    var dInt = (e.driftAmp[i] / e.driftW[i]) *
      (Math.cos(e.driftW[i] * te + e.driftP[i]) - Math.cos(e.driftW[i] * t + e.driftP[i]));
    var centsInt = e.offs[i] * (bInt(t) - bInt(te)) + dInt;
    return e.basePhase[i] + e.root * ((t - te) + K * centsInt);
  }
  function reseed(t) {
    var base = [phaseCycles(0, t), phaseCycles(1, t), phaseCycles(2, t)];
    reseedCount++;
    epochs.push(makeEpoch(t, (BASE_SEED + reseedCount * 1013904223) | 0, base));
  }

  // ---------- audio (lazy, first tap only, fully guarded) ----------
  var AC = null, oscNodes = null;
  function ensureAudio() {
    if (AC) {
      if (AC.resume) { try { AC.resume(); } catch (e) { /* noop */ } }
      return;
    }
    var Ctor = null;
    if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
    else if (typeof window !== 'undefined' && window.webkitAudioContext) Ctor = window.webkitAudioContext;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      var comp = AC.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 18; comp.ratio.value = 20;
      comp.attack.value = 0.003; comp.release.value = 0.24;
      var master = AC.createGain();
      master.gain.value = 0.14;
      master.connect(comp); comp.connect(AC.destination);
      oscNodes = [];
      var gains = [0.5, 0.42, 0.42], i, g, gs, o1, o2, f;
      for (i = 0; i < 3; i++) {
        g = AC.createGain(); g.gain.value = gains[i];
        gs = AC.createGain(); gs.gain.value = 0.16;
        o1 = AC.createOscillator(); o1.type = 'sine';
        o2 = AC.createOscillator(); o2.type = 'sawtooth';
        f = freqAt(i, nowT());
        o1.frequency.value = f; o2.frequency.value = f;
        o1.connect(g); o2.connect(gs); gs.connect(g); g.connect(master);
        o1.start(); o2.start();
        oscNodes.push({ o1: o1, o2: o2 });
      }
    } catch (e) {
      AC = null; oscNodes = null;
    }
  }
  function updateAudio(t) {
    if (!AC || !oscNodes) return;
    try {
      for (var i = 0; i < 3; i++) {
        var f = freqAt(i, t);
        oscNodes[i].o1.frequency.value = f;
        oscNodes[i].o2.frequency.value = f;
      }
    } catch (e) { /* noop */ }
  }

  // ---------- pointer: vertical drag files the bridge; double-tap reseeds ----------
  var dragging = false, dragY0 = 0, dragB0 = 0, lastTapT = -10, lastTapX = 0, lastTapY = 0;
  function evtPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e && e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: 0, y: 0 };
  }
  function onDown(e) {
    var t = nowT(), p = evtPos(e);
    ensureAudio();
    var dx = p.x - lastTapX, dy = p.y - lastTapY;
    if (t - lastTapT < 0.35 && (dx * dx + dy * dy) < 1600) {
      reseed(t);
      lastTapT = -10;
    } else {
      lastTapT = t; lastTapX = p.x; lastTapY = p.y;
    }
    dragging = true; dragY0 = p.y; dragB0 = bAt(t);
    if (e && e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var t = nowT(), p = evtPos(e);
    var range = Math.max(120, H * 0.55);
    var b = dragB0 + (p.y - dragY0) / range;
    if (b < 0) b = 0; if (b > 1) b = 1;
    var last = bPts[bPts.length - 1];
    if (t - last.t > 0.016 || Math.abs(b - last.b) > 0.002) pushB(t, b);
    if (e && e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var t = nowT(), p = evtPos(e);
    var range = Math.max(120, H * 0.55);
    var b = dragB0 + (p.y - dragY0) / range;
    if (b < 0) b = 0; if (b > 1) b = 1;
    pushB(t, b);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
  }

  // ---------- draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, W, H);

    var phone = isPhone();
    var beamY = H * 0.5;
    var b = bAt(t);
    var e = epochAt(t);

    // sample the summed waveform along the beam
    var N = Math.max(160, Math.min(560, Math.floor(W / 3)));
    var phases = [phaseCycles(0, t), phaseCycles(1, t), phaseCycles(2, t)];
    var freqs = [freqAt(0, t), freqAt(1, t), freqAt(2, t)];
    var maxSep = Math.min(H * (phone ? 0.13 : 0.16), 140);
    var seps = [0, 0, 0], i, j, x, y;
    for (i = 0; i < 3; i++) seps[i] = (e.offs[i] / 35) * maxSep * b;
    var wig = 3 + 5 * b;
    var waves = [[], [], []], sums = [], ampSum = 0, sVal, wv;
    for (j = 0; j <= N; j++) {
      x = (j / N) * W;
      sVal = 0;
      for (i = 0; i < 3; i++) {
        wv = Math.sin(2 * Math.PI * (phases[i] - (freqs[i] / 110) * (x / 120)));
        waves[i].push(wv);
        sVal += wv;
      }
      sums.push(sVal);
      ampSum += Math.abs(sVal) / 3;
    }
    var avgAmp = ampSum / (N + 1);

    // beam
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = COL.glyph;
    ctx.fillRect(0, beamY - 1, W, 2);
    ctx.globalAlpha = 1;

    // voice lines, drawn back to front so voice one (white) sits on top
    var order = [2, 1, 0], chunk = 8, a, vis, g;
    ctx.lineWidth = phone ? 2.4 : 2;
    ctx.lineCap = 'round';
    for (var oi = 0; oi < 3; oi++) {
      i = order[oi];
      vis = (i === 0) ? 1 : Math.min(1, Math.abs(seps[i]) / 7);
      if (vis <= 0.01) continue;
      ctx.strokeStyle = LINE_COL[i];
      for (j = 0; j < N; j += chunk) {
        var end = Math.min(N, j + chunk);
        var mid = Math.floor((j + end) / 2);
        g = Math.pow(Math.abs(sums[mid]) / 3, 1.4);
        a = (0.22 + 0.78 * g) * vis;
        ctx.globalAlpha = a;
        ctx.beginPath();
        for (var k = j; k <= end; k++) {
          x = (k / N) * W;
          y = beamY + seps[i] + waves[i][k] * wig;
          if (k === j) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // pickup glyph: brightness follows total amplitude
    var gw = phone ? 34 : 30, gh = phone ? 13 : 11;
    var gx = W * 0.63 - gw / 2, gy = beamY - gh / 2;
    ctx.globalAlpha = 0.3 + 0.7 * avgAmp;
    ctx.fillStyle = COL.glyph;
    ctx.fillRect(gx, gy, gw, gh);
    ctx.globalAlpha = avgAmp * avgAmp * 0.65;
    ctx.fillStyle = COL.one;
    ctx.fillRect(gx + 3, beamY - 1, gw - 6, 2);
    ctx.globalAlpha = 1;

    // bridge-height readout (luthier's caliper)
    var mm = 12 - 8 * b;
    ctx.fillStyle = COL.two;
    ctx.font = (phone ? 13 : 12) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('BRIDGE ' + mm.toFixed(1) + ' MM', W / 2, H - 18);
  }

  // ---------- run ----------
  resize();
  draw(0);
  function frame() {
    var t = nowT();
    draw(t);
    updateAudio(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
