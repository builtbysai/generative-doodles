<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MicroMonotaur</title>
<style>
  html, body { margin: 0; padding: 0; background: #101014; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- MicroMonotaur — Jon Satrom study JS6 ----------
  // A lab bench for storage media. Three devices — floppy disk, hard drive,
  // USB stick — are read in turn by one shared read head. Each 10 s read runs
  // the same state machine: READING (clean, 0-3 s) -> DEGRADING (3-8 s:
  // dropouts, bit-flips and speed wobble grow in ten hard steps while the
  // device illustration glitches in sympathy) -> FAILED (8-10 s: the readout
  // names the failure and everything freezes mid-glitch). Inactive devices
  // sit IDLE. The bench framing is explicit — title, card labels, readout
  // strip — so the failures always read as a staged illustration, never as
  // an error on the viewer's own machine. Tapping a device card re-anchors
  // the cycle: that device starts reading immediately and the rotation
  // continues from there. Everything is closed-form in piece time T plus
  // the tap anchor; the first frame is fixed at T0 = 16 s (HDD, p = 6,
  // degradation step 0.6). Silent by design.

  var BENCH = '#101014';
  var CARD = '#1A1A1E';
  var CARD_EDGE = '#2C2C33';
  var INK = '#E8E8E8';
  var DIM = '#7A7A84';
  var WAVE = '#00FFC2';
  var YELLOW = '#FFE14D';
  var RED = '#FF3B30';
  var PANEL = '#0A0A0C';

  var T0 = 16;                // first-frame phase: HDD at p=6, d=0.6
  var DEV_NAMES = ['FLOPPY', 'HDD', 'USB'];
  var DEV_LABELS = ['FLOPPY 1.44MB', 'HDD 5400RPM', 'USB FLASH'];
  var DEV_FAIL = ['SECTOR NOT FOUND', 'HEAD CRASH (SIMULATED)', 'BIT ROT'];
  var NB = 8;                 // horizontal bands per illustration

  // ---------- seeded rng / hash ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function ihash(n) {
    n = (n ^ 61) ^ (n >>> 16);
    n = (n + (n << 3)) | 0;
    n = n ^ (n >>> 4);
    n = Math.imul(n, 0x27d4eb2d);
    n = n ^ (n >>> 15);
    return ((n >>> 0) % 10000) / 10000;
  }

  // Per-device seeded degradation tables, fixed at load.
  var DEV = [];
  for (var di = 0; di < 3; di++) {
    var rng = mulberry32(1173 * 1000 + di * 77 + 5);
    var drop = [], flip = [], band = [];
    for (var a = 0; a < 48; a++) drop.push(rng());
    for (var b = 0; b < 96; b++) flip.push(rng());
    for (var c = 0; c < NB; c++) band.push(rng() * 2 - 1);
    DEV.push({ drop: drop, flip: flip, band: band, wob: rng() * 6.2832 });
  }

  // ---------- cycle state ----------
  var anchor = { t0: 0, dev: 0 };   // tap re-anchor: at time t0, device dev starts at p=0
  function cycleAt(T) {
    var ct = (T - anchor.t0) + anchor.dev * 10;
    if (ct < 0) ct = 0;
    var idx = Math.floor(ct / 10) % 3;
    var p = ct - Math.floor(ct / 10) * 10;
    var phase, d;
    if (p < 3) { phase = 0; d = 0; }
    else if (p < 8) { phase = 1; d = Math.floor(((p - 3) / 5) * 10) / 10; }
    else { phase = 2; d = 1; }
    return { idx: idx, p: p, phase: phase, d: d, peff: Math.min(p, 8) };
  }

  // ---------- view / canvas ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var lastT = T0;
  var cardGeom = null;        // card rects from the latest draw, for taps

  function viewW() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vv && vv.width) return vv.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vv && vv.height) return vv.height;
    return window.innerHeight || 800;
  }
  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw || 9999, sh || 9999);
    if (mn < 700) return true;
    return H > W * 1.15;
  }
  function fit() {
    W = viewW(); H = viewH();
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(lastT); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(lastT); });
  }

  // ---------- layout ----------
  function layout() {
    var phone = isPhone();
    var pad = phone ? 14 : 24;
    var titleH = phone ? 58 : 66;
    var waveH = phone ? 84 : 112;
    var readH = 46;
    var wireGap = phone ? 30 : 52;
    var foot = 14;
    var cardsTop = titleH;
    var waveY = H - foot - readH - 12 - waveH;
    var cardsBot = waveY - wireGap;
    var cardsH = cardsBot - cardsTop;
    var cards = [];
    if (phone) {
      var gap = 10;
      var ch = (cardsH - gap * 2) / 3;
      for (var i = 0; i < 3; i++) {
        cards.push({ x: pad, y: cardsTop + i * (ch + gap), w: W - pad * 2, h: ch });
      }
    } else {
      var gapD = 18;
      var cw = Math.min((W - pad * 2 - gapD * 2) / 3, 360);
      var chh = Math.min(cw * 0.82, cardsH);
      var totalW = cw * 3 + gapD * 2;
      var x0 = (W - totalW) / 2;
      var y0 = cardsTop + Math.min(20, (cardsH - chh) / 2);
      for (var j = 0; j < 3; j++) {
        cards.push({ x: x0 + j * (cw + gapD), y: y0, w: cw, h: chh });
      }
    }
    return {
      phone: phone, pad: pad, cards: cards,
      wave: { x: pad, y: waveY, w: W - pad * 2, h: waveH },
      readout: { x: pad, y: H - foot - readH, w: W - pad * 2, h: readH }
    };
  }

  // ---------- device illustrations ----------
  // Each illustration is drawn whole, but the caller clips it into NB
  // horizontal bands and offsets each band, so the active device's line art
  // shears in sympathy with the degradation. P = {d, peff, active, failed}.
  function drawDevice(kind, bx, by, bw, bh, P) {
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.4, bw * 0.014);
    ctx.fillStyle = INK;
    var cx = bx + bw / 2, cy = by + bh / 2;
    if (kind === 0) {
      // floppy disk: square body, metal shutter, paper label
      var s = Math.min(bw, bh) * 0.92;
      var x = cx - s / 2, y = cy - s / 2;
      ctx.strokeRect(x, y, s, s);
      ctx.fillStyle = '#2A2A32';
      ctx.fillRect(x + s * 0.30, y + s * 0.06, s * 0.40, s * 0.30);
      ctx.strokeRect(x + s * 0.30, y + s * 0.06, s * 0.40, s * 0.30);
      ctx.fillStyle = INK;
      ctx.fillRect(x + s * 0.40, y + s * 0.11, s * 0.14, s * 0.20);
      // label
      var lx = x + s * 0.14, ly = y + s * 0.48, lw = s * 0.72, lh = s * 0.42;
      ctx.fillStyle = '#24242A';
      ctx.fillRect(lx, ly, lw, lh);
      ctx.strokeRect(lx, ly, lw, lh);
      ctx.strokeStyle = 'rgba(232,232,232,0.55)';
      ctx.lineWidth = 1.2;
      for (var i = 0; i < 3; i++) {
        var lyy = ly + lh * (0.28 + i * 0.24);
        ctx.beginPath(); ctx.moveTo(lx + lw * 0.10, lyy); ctx.lineTo(lx + lw * (0.88 - i * 0.14), lyy); ctx.stroke();
      }
      // label smear: streaks drag right out of the label as d grows
      if (P.d > 0) {
        ctx.fillStyle = 'rgba(232,232,232,0.30)';
        var n = Math.floor(P.d * 6);
        for (var k = 0; k < n; k++) {
          var sy = ly + 4 + ihash(k * 13 + 7) * (lh - 8);
          var len = (0.3 + 0.7 * ihash(k * 29 + 3)) * P.d * lw * 0.95;
          ctx.fillRect(lx + lw - 2, sy, len, 2.4);
        }
      }
      ctx.strokeStyle = INK;
      ctx.lineWidth = Math.max(1.4, bw * 0.014);
      ctx.strokeRect(x + s * 0.80, y + s * 0.06, s * 0.11, s * 0.11);
    } else if (kind === 1) {
      // hard drive: chassis, platter with stuttering rotation, actuator arm
      var w = Math.min(bw * 0.96, bh * 1.40), h = w * 0.68;
      var x2 = cx - w / 2, y2 = cy - h / 2;
      ctx.strokeRect(x2, y2, w, h);
      var pcx = x2 + w * 0.34, pcy = y2 + h * 0.52, pr = h * 0.34;
      ctx.beginPath(); ctx.moveTo(pcx + pr, pcy); ctx.arc(pcx, pcy, pr, 0, 6.2832); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pcx + pr * 0.30, pcy); ctx.arc(pcx, pcy, pr * 0.30, 0, 6.2832); ctx.stroke();
      // platter marker: rotation angle quantised harder as d grows (stutter)
      var raw = P.peff * 2.4;
      var q = P.d > 0 ? 0.15 + P.d * 1.5 : 0.0001;
      var ang = Math.floor(raw / q) * q;
      ctx.beginPath();
      ctx.moveTo(pcx, pcy);
      ctx.lineTo(pcx + Math.cos(ang) * pr, pcy + Math.sin(ang) * pr);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pcx + Math.cos(ang + 2.6) * pr * 0.82, pcy + Math.sin(ang + 2.6) * pr * 0.82);
      ctx.arc(pcx + Math.cos(ang + 2.6) * pr * 0.82, pcy + Math.sin(ang + 2.6) * pr * 0.82, 2.2, 0, 6.2832);
      ctx.fill();
      // actuator arm from the top-right pivot
      var ax = x2 + w * 0.90, ay = y2 + h * 0.14;
      ctx.beginPath(); ctx.moveTo(pcx + pr * 0.55, pcy - pr * 0.30); ctx.arc(pcx + pr * 0.55, pcy - pr * 0.30, 2.2, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(pcx + pr * 0.55, pcy - pr * 0.30); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax + 4, ay); ctx.arc(ax, ay, 4, 0, 6.2832); ctx.stroke();
      // corner screws
      var sc = [[0.07, 0.12], [0.93, 0.88], [0.07, 0.88]];
      for (var s2 = 0; s2 < 3; s2++) {
        ctx.beginPath();
        ctx.moveTo(x2 + w * sc[s2][0] + 3, y2 + h * sc[s2][1]);
        ctx.arc(x2 + w * sc[s2][0], y2 + h * sc[s2][1], 3, 0, 6.2832);
        ctx.stroke();
      }
    } else {
      // USB stick: connector teeth, body, cap line, body LED
      var w3 = bw * 0.96, h3 = w3 * 0.30;
      var x3 = cx - w3 / 2, y3 = cy - h3 / 2;
      var connW = w3 * 0.30;
      ctx.strokeRect(x3, y3 + h3 * 0.14, connW, h3 * 0.72);
      ctx.beginPath();
      ctx.moveTo(x3 + connW * 0.18, y3 + h3 * 0.14); ctx.lineTo(x3 + connW * 0.18, y3 + h3 * 0.86);
      ctx.moveTo(x3 + connW * 0.50, y3 + h3 * 0.14); ctx.lineTo(x3 + connW * 0.50, y3 + h3 * 0.86);
      ctx.moveTo(x3 + connW * 0.82, y3 + h3 * 0.14); ctx.lineTo(x3 + connW * 0.82, y3 + h3 * 0.86);
      ctx.stroke();
      ctx.strokeRect(x3 + connW, y3, w3 - connW, h3);
      ctx.beginPath();
      ctx.moveTo(x3 + connW + (w3 - connW) * 0.16, y3); ctx.lineTo(x3 + connW + (w3 - connW) * 0.16, y3 + h3);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(232,232,232,0.55)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x3 + connW + (w3 - connW) * 0.34, y3 + h3 * 0.52);
      ctx.lineTo(x3 + w3 * 0.92, y3 + h3 * 0.52);
      ctx.stroke();
      ctx.strokeStyle = INK;
      ctx.lineWidth = Math.max(1.4, bw * 0.014);
    }
  }

  function ledColor(dev, active, cy2) {
    if (!active) return '#3A3A40';
    if (cy2.phase === 2) return RED;
    if (cy2.phase === 1 && dev === 2) {
      // USB stick's LED flickers in seeded steps while it rots
      return ihash(Math.floor(cy2.peff * 5) * 7 + 3) > 0.35 ? WAVE : '#123B33';
    }
    return WAVE;
  }

  function drawCard(L, i, cy2) {
    var c = L.cards[i];
    var active = (i === cy2.idx);
    ctx.fillStyle = CARD;
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.strokeStyle = active ? (cy2.phase === 2 ? RED : YELLOW) : CARD_EDGE;
    ctx.lineWidth = active ? 2 : 1;
    ctx.strokeRect(c.x + 0.5, c.y + 0.5, c.w - 1, c.h - 1);
    // header: label left, state + LED right
    ctx.font = '600 11px monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = active ? INK : DIM;
    ctx.fillText(DEV_LABELS[i], c.x + 10, c.y + 18);
    var stateTxt = !active ? 'IDLE' : (cy2.phase === 0 ? 'READING' : (cy2.phase === 1 ? 'DEGRADING' : 'FAILED'));
    ctx.font = '11px monospace';
    var stW = ctx.measureText(stateTxt).width;
    ctx.fillStyle = !active ? DIM : (cy2.phase === 0 ? WAVE : (cy2.phase === 1 ? YELLOW : RED));
    ctx.fillText(stateTxt, c.x + c.w - 10 - stW - 14, c.y + 18);
    ctx.fillStyle = ledColor(i, active, cy2);
    ctx.beginPath();
    ctx.moveTo(c.x + c.w - 13 + 3.5, c.y + 14.5);
    ctx.arc(c.x + c.w - 13, c.y + 14.5, 3.5, 0, 6.2832);
    ctx.fill();
    // illustration, band-sliced for the active device
    var iw = Math.min(c.w * 0.72, (c.h - 34) * 1.35);
    var ih = iw * 0.72;
    var ix = c.x + (c.w - iw) / 2, iy = c.y + 24 + (c.h - 30 - ih) / 2;
    var P = { d: active ? cy2.d : 0, peff: active ? cy2.peff : 0, active: active, failed: active && cy2.phase === 2 };
    for (var bnd = 0; bnd < NB; bnd++) {
      var yA = iy + ih * bnd / NB, yB = iy + ih * (bnd + 1) / NB;
      var off = active ? Math.round(DEV[i].band[bnd] * 16 * cy2.d) : 0;
      ctx.save();
      ctx.beginPath(); ctx.rect(ix - 34, yA, iw + 68, yB - yA); ctx.clip();
      ctx.translate(off, 0);
      drawDevice(i, ix, iy, iw, ih, P);
      ctx.restore();
    }
    // USB body LED (drawn unsliced, on the stick itself)
    if (i === 2) {
      ctx.fillStyle = ledColor(2, active, cy2);
      ctx.beginPath();
      var lx = ix + iw * 0.86, ly2 = iy + ih * 0.30;
      ctx.moveTo(lx + 3, ly2); ctx.arc(lx, ly2, 3, 0, 6.2832);
      ctx.fill();
    }
  }

  // ---------- wires ----------
  function drawWires(L, cy2) {
    var wv = L.wave;
    ctx.lineWidth = 1.2;
    for (var i = 0; i < 3; i++) {
      var c = L.cards[i];
      ctx.strokeStyle = (i === cy2.idx) ? WAVE : '#33333A';
      ctx.beginPath();
      if (L.phone) {
        // stacked cards: only the active device is wired — a stub from its
        // left edge drops down the margin bus into the read head
        if (i !== cy2.idx) continue;
        var midY = c.y + c.h / 2;
        var busX = 5;
        ctx.moveTo(c.x, midY);
        ctx.lineTo(busX, midY);
        ctx.lineTo(busX, wv.y + wv.h * 0.5);
        ctx.lineTo(wv.x + 6, wv.y + wv.h * 0.5);
      } else {
        var cxp = c.x + c.w / 2;
        ctx.moveTo(cxp, c.y + c.h);
        ctx.lineTo(cxp, wv.y - 12);
        ctx.lineTo(cxp + (i - 1) * 26, wv.y - 12);
        ctx.lineTo(cxp + (i - 1) * 26, wv.y);
      }
      ctx.stroke();
    }
  }

  // ---------- waveform ----------
  function drawWave(L, cy2) {
    var wv = L.wave;
    var dev = cy2.idx;
    ctx.fillStyle = PANEL;
    ctx.fillRect(wv.x, wv.y, wv.w, wv.h);
    ctx.strokeStyle = CARD_EDGE; ctx.lineWidth = 1;
    ctx.strokeRect(wv.x + 0.5, wv.y + 0.5, wv.w - 1, wv.h - 1);
    ctx.font = '10px monospace';
    ctx.fillStyle = DIM;
    ctx.fillText('READ HEAD — ' + DEV_NAMES[dev], wv.x + 10, wv.y + 15);
    var midY = wv.y + wv.h * 0.58;
    var amp = wv.h * 0.30;
    ctx.strokeStyle = 'rgba(232,232,232,0.14)';
    ctx.beginPath(); ctx.moveTo(wv.x + 6, midY); ctx.lineTo(wv.x + wv.w - 6, midY); ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.rect(wv.x + 2, wv.y + 2, wv.w - 4, wv.h - 4); ctx.clip();
    ctx.strokeStyle = WAVE;
    ctx.globalAlpha = cy2.phase === 2 ? 0.55 : 1;
    ctx.lineWidth = 1.8;
    var N = 160, x0 = wv.x + 8, x1 = wv.x + wv.w - 8;
    if (cy2.phase === 2) {
      // failed: flatline with sparse frozen noise ticks
      ctx.beginPath();
      for (var k = 0; k <= 120; k++) {
        var fx = x0 + (x1 - x0) * k / 120;
        var tick = ihash(k * 7 + dev * 131);
        var fy = midY + (tick > 0.86 ? (ihash(k * 13 + dev) - 0.5) * 1.7 * amp : (ihash(k * 3 + 1) - 0.5) * 0.06 * amp);
        if (k === 0) ctx.moveTo(fx, fy); else ctx.lineTo(fx, fy);
      }
      ctx.stroke();
    } else {
      ctx.beginPath();
      for (var s = 0; s <= N; s++) {
        var xx = s / N;
        var px = x0 + (x1 - x0) * xx;
        var u = xx + cy2.p * 0.35;
        var su = u + 0.05 * cy2.d * Math.sin(6.2832 * 3 * xx + DEV[dev].wob);
        var val = 0.62 * Math.sin(6.2832 * 2 * su) + 0.38 * Math.sin(6.2832 * 5 * su + 0.7);
        var seg = Math.floor(xx * 48);
        if (DEV[dev].drop[seg] < 0.6 * cy2.d) val = 0;
        var samp = Math.floor(xx * 96);
        if (DEV[dev].flip[samp] < 0.35 * cy2.d) val = -val;
        var py = midY - val * amp;
        if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---------- readout ----------
  function drawReadout(L, cy2) {
    var r = L.readout;
    ctx.fillStyle = PANEL;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = CARD_EDGE; ctx.lineWidth = 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    ctx.font = '600 12px monospace';
    ctx.fillStyle = YELLOW;
    ctx.fillText('READOUT', r.x + 12, r.y + r.h / 2 + 4);
    var msg, col;
    if (cy2.phase === 0) { msg = DEV_NAMES[cy2.idx] + ' — READING…'; col = INK; }
    else if (cy2.phase === 1) { msg = DEV_NAMES[cy2.idx] + ' — DEGRADING'; col = YELLOW; }
    else { msg = DEV_FAIL[cy2.idx]; col = RED; }
    ctx.font = '600 14px monospace';
    var mw = ctx.measureText(msg).width;
    ctx.fillStyle = col;
    ctx.fillText(msg, r.x + (r.w - mw) / 2, r.y + r.h / 2 + 5);
    var sig = cy2.phase === 2 ? 'SIGNAL LOST' : 'SIGNAL ' + Math.round((1 - cy2.d) * 100) + '%';
    ctx.font = '11px monospace';
    var sw2 = ctx.measureText(sig).width;
    ctx.fillStyle = cy2.phase === 2 ? RED : DIM;
    ctx.fillText(sig, r.x + r.w - 12 - sw2, r.y + r.h / 2 + 4);
  }

  // ---------- draw ----------
  function draw(T) {
    lastT = T;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BENCH;
    ctx.fillRect(0, 0, W, H);
    var L = layout();
    cardGeom = L.cards;
    var cy2 = cycleAt(T);
    // bench title — the stage framing, always on screen
    ctx.font = '600 ' + (L.phone ? 12.5 : 15) + 'px monospace';
    ctx.fillStyle = INK;
    ctx.fillText('MICROMONOTAUR — STORAGE FAILURE BENCH', L.pad, 30);
    ctx.font = '11px monospace';
    ctx.fillStyle = DIM;
    ctx.fillText('three devices · one reader · tap a card to read it', L.pad, 50);
    for (var i = 0; i < 3; i++) drawCard(L, i, cy2);
    drawWires(L, cy2);
    drawWave(L, cy2);
    drawReadout(L, cy2);
  }

  // ---------- interaction: tap a card, read that device now ----------
  function onTap(px, py) {
    if (!cardGeom) return;
    for (var i = 0; i < 3; i++) {
      var c = cardGeom[i];
      if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) {
        anchor = { t0: lastT, dev: i };
        draw(lastT);
        return;
      }
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onTap(e.clientX || 0, e.clientY || 0); });
    canvas.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches[0]) onTap(e.touches[0].clientX || 0, e.touches[0].clientY || 0);
    });
    canvas.addEventListener('mousedown', function (e) { onTap(e.clientX || 0, e.clientY || 0); });
  }

  // ---------- run ----------
  function clockNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return Date.now() / 1000;
  }
