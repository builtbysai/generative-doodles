<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Códice Perdido</title>
<style>
  html, body { margin: 0; padding: 0; background: #E3D3AE; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var PAPER = '#E3D3AE';
  var TERRA = '#B4552D';
  var OCHRE = '#D9A441';
  var CHAR  = '#23211E';
  var BONE  = '#EDE6D6';
  var BLUE  = '#4E7D7A'; // one stripe, in one panel only

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300, DPR = 1, isPhone = false;

  function computeSize() {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth || 300;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 300;
    W = vw; H = vh;
    DPR = window.devicePixelRatio || 1;
    if (window.screen && window.screen.width) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = H > W * 1.15;
    }
  }
  function resize() {
    computeSize();
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(state.t); });
  }
  window.addEventListener('resize', function () { resize(); draw(state.t); });

  // ---------- paper grain (seeded speckle data, drawn directly) ----------
  var grain = [];
  (function buildGrain() {
    var rng = mulberry32(672555);
    for (var i = 0; i < 1500; i++) {
      grain.push({
        x: rng(), y: rng(),
        r: 0.4 + rng() * 1.1,
        a: 0.03 + rng() * 0.06,
        terra: rng() < 0.3
      });
    }
  })();

  // ---------- glyph dust in the margins (seeded, drifts on slow noise paths) ----------
  var dust = [];
  (function buildDust() {
    var rng = mulberry32(672777);
    for (var i = 0; i < 30; i++) {
      var top = rng() < 0.5;
      dust.push({
        x: rng(),
        y: top ? 0.03 + rng() * 0.24 : 0.73 + rng() * 0.24,
        kind: Math.floor(rng() * 3), // 0 dot, 1 hook, 2 mini-fret
        ph: rng() * Math.PI * 2,
        sp: 0.05 + rng() * 0.08,
        amp: 0.004 + rng() * 0.010,
        terra: rng() < 0.45,
        s: 0.6 + rng() * 0.9
      });
    }
  })();

  // ---------- codex sequence ----------
  var KINDS = ['fret', 'head', 'bird', 'serpent', 'dancer', 'sun', 'water'];
  var generation = 0;
  var panels = [];
  var blueIndex = -1;

  function genSequence() {
    var rng = mulberry32(672001 + generation * 7919);
    var bag = KINDS.slice();
    // shuffle the seven kinds, then add two more draws: 9 panels, every kind present
    for (var i = bag.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
    }
    bag.push(KINDS[Math.floor(rng() * KINDS.length)]);
    bag.push(KINDS[Math.floor(rng() * KINDS.length)]);
    panels = [];
    for (var k = 0; k < bag.length; k++) {
      panels.push({
        kind: bag[k],
        phase: rng() * Math.PI * 2,
        flip: rng() < 0.5,
        alt: rng() < 0.5,
        jitter: rng()
      });
    }
    blueIndex = Math.floor(rng() * panels.length);
  }
  genSequence();

  // ---------- state ----------
  var state = {
    t: 0,
    offset: 0,       // scroll position in px (grows as codex moves left)
    vel: 0,          // inertia velocity px/s
    dragging: false,
    lastX: 0,
    lastTapT: -10,
    lastTapX: 0,
    lastTapY: 0
  };

  // ---------- drawing helpers ----------
  function outline(lw) { ctx.strokeStyle = CHAR; ctx.lineWidth = lw; ctx.stroke(); }
  function pathFrom(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  // All vignettes draw inside a unit box mapped to (x, y, u): unit coords 0..1.
  function drawFret(x, y, u, p, t) {
    var pts = [
      [0.16, 0.84], [0.16, 0.16], [0.84, 0.16], [0.84, 0.64],
      [0.36, 0.64], [0.36, 0.36], [0.64, 0.36], [0.64, 0.50]
    ];
    var i, px = [], py = [];
    for (i = 0; i < pts.length; i++) { px.push(x + pts[i][0] * u); py.push(y + pts[i][1] * u); }
    ctx.lineJoin = 'miter'; ctx.lineCap = 'square';
    ctx.beginPath();
    ctx.moveTo(px[0], py[0]);
    for (i = 1; i < pts.length; i++) ctx.lineTo(px[i], py[i]);
    ctx.strokeStyle = CHAR; ctx.lineWidth = u * 0.115; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px[0], py[0]);
    for (i = 1; i < pts.length; i++) ctx.lineTo(px[i], py[i]);
    ctx.strokeStyle = p.alt ? OCHRE : TERRA; ctx.lineWidth = u * 0.072; ctx.stroke();
    // a bone bead steps along the fret path
    var segLen = [], total = 0;
    for (i = 1; i < pts.length; i++) {
      var d = Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);
      segLen.push(d); total += d;
    }
    var s = ((t * 0.11 + p.phase) % 1) * total, bx = px[0], by = py[0];
    for (i = 0; i < segLen.length; i++) {
      if (s <= segLen[i]) {
        var f = segLen[i] === 0 ? 0 : s / segLen[i];
        bx = px[i] + (px[i + 1] - px[i]) * f;
        by = py[i] + (py[i + 1] - py[i]) * f;
        break;
      }
      s -= segLen[i]; bx = px[i + 1]; by = py[i + 1];
    }
    ctx.beginPath(); ctx.arc(bx, by, u * 0.045, 0, Math.PI * 2);
    ctx.fillStyle = BONE; ctx.fill(); outline(u * 0.014);
  }

  function drawHead(x, y, u, p, t) {
    ctx.save();
    ctx.translate(x + u * 0.5, y + u * 0.52);
    ctx.rotate(0.05 * Math.sin(t * 0.5 + p.phase)); // gentle nod
    if (p.flip) ctx.scale(-1, 1);
    ctx.translate(-u * 0.5, -u * 0.52);
    // local coords: the transform above maps vignette (0,0) to (x, y)
    var X = function (v) { return v * u; }, Y = function (v) { return v * u; };
    // headdress: stacked bars and a disc
    ctx.fillStyle = TERRA;
    ctx.fillRect(X(0.20), Y(0.06), u * 0.42, u * 0.07);
    ctx.strokeStyle = CHAR; ctx.lineWidth = u * 0.016;
    ctx.strokeRect(X(0.20), Y(0.06), u * 0.42, u * 0.07);
    ctx.fillStyle = OCHRE;
    ctx.fillRect(X(0.26), Y(0.14), u * 0.32, u * 0.06);
    ctx.strokeRect(X(0.26), Y(0.14), u * 0.32, u * 0.06);
    ctx.beginPath(); ctx.arc(X(0.66), Y(0.10), u * 0.055, 0, Math.PI * 2);
    ctx.fillStyle = BONE; ctx.fill(); outline(u * 0.016);
    // profile head, facing right
    ctx.beginPath();
    ctx.moveTo(X(0.34), Y(0.20));
    ctx.quadraticCurveTo(X(0.58), Y(0.18), X(0.62), Y(0.32)); // brow
    ctx.quadraticCurveTo(X(0.72), Y(0.44), X(0.70), Y(0.50)); // nose out
    ctx.quadraticCurveTo(X(0.60), Y(0.54), X(0.62), Y(0.60)); // nose base to lips
    ctx.quadraticCurveTo(X(0.66), Y(0.66), X(0.58), Y(0.70)); // lips
    ctx.quadraticCurveTo(X(0.62), Y(0.78), X(0.50), Y(0.84)); // chin
    ctx.quadraticCurveTo(X(0.38), Y(0.88), X(0.38), Y(0.98)); // jaw to neck front
    ctx.lineTo(X(0.24), Y(0.98));
    ctx.quadraticCurveTo(X(0.20), Y(0.70), X(0.20), Y(0.48)); // back of head
    ctx.quadraticCurveTo(X(0.20), Y(0.26), X(0.34), Y(0.20));
    ctx.closePath();
    ctx.fillStyle = BONE; ctx.fill(); outline(u * 0.02);
    // eye and earflare
    ctx.beginPath(); ctx.arc(X(0.50), Y(0.42), u * 0.022, 0, Math.PI * 2);
    ctx.fillStyle = CHAR; ctx.fill();
    ctx.beginPath(); ctx.arc(X(0.33), Y(0.60), u * 0.065, 0, Math.PI * 2);
    ctx.fillStyle = OCHRE; ctx.fill(); outline(u * 0.016);
    ctx.beginPath(); ctx.arc(X(0.33), Y(0.60), u * 0.028, 0, Math.PI * 2);
    ctx.fillStyle = CHAR; ctx.fill();
    ctx.restore();
  }

  function drawBird(x, y, u, p, t) {
    var X = function (v) { return x + v * u; }, Y = function (v) { return y + v * u; };
    ctx.save();
    if (p.flip) { ctx.translate(x + u, y); ctx.scale(-1, 1); ctx.translate(-x, -y); }
    // perch
    ctx.beginPath(); ctx.moveTo(X(0.08), Y(0.86)); ctx.lineTo(X(0.92), Y(0.86));
    ctx.strokeStyle = CHAR; ctx.lineWidth = u * 0.03; ctx.stroke();
    // tail feathers
    ctx.fillStyle = TERRA;
    pathFrom([[X(0.30), Y(0.58)], [X(0.10), Y(0.84)], [X(0.20), Y(0.86)], [X(0.36), Y(0.62)]]);
    ctx.fill(); outline(u * 0.016);
    pathFrom([[X(0.38), Y(0.60)], [X(0.24), Y(0.85)], [X(0.33), Y(0.86)], [X(0.44), Y(0.63)]]);
    ctx.fill(); outline(u * 0.016);
    // body
    ctx.beginPath();
    ctx.ellipse(X(0.46), Y(0.52), u * 0.27, u * 0.155, -0.18, 0, Math.PI * 2);
    ctx.fillStyle = OCHRE; ctx.fill(); outline(u * 0.02);
    // wing
    ctx.beginPath();
    ctx.ellipse(X(0.42), Y(0.52), u * 0.17, u * 0.09, -0.25, 0, Math.PI * 2);
    ctx.fillStyle = TERRA; ctx.fill(); outline(u * 0.016);
    // head group: turns in a three-position cycle
    var step = Math.floor(((t * 0.45 + p.phase) % 3) + 3) % 3;
    var ang = [-0.38, 0.02, 0.42][step];
    ctx.save();
    ctx.translate(X(0.64), Y(0.44));
    ctx.rotate(ang);
    ctx.beginPath(); ctx.arc(u * 0.05, -u * 0.05, u * 0.105, 0, Math.PI * 2);
    ctx.fillStyle = BONE; ctx.fill(); outline(u * 0.018);
    pathFrom([[u * 0.13, -u * 0.09], [u * 0.26, -u * 0.03], [u * 0.12, -u * 0.005]]);
    ctx.fillStyle = TERRA; ctx.fill(); outline(u * 0.014);
    ctx.beginPath(); ctx.arc(u * 0.08, -u * 0.07, u * 0.02, 0, Math.PI * 2);
    ctx.fillStyle = CHAR; ctx.fill();
    // crest ticks
    ctx.strokeStyle = CHAR; ctx.lineWidth = u * 0.016;
    for (var i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(u * (0.0 - i * 0.02), -u * 0.14);
      ctx.lineTo(u * (-0.03 - i * 0.03), -u * (0.20 + i * 0.015));
      ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }

  function drawSerpent(x, y, u, p, t) {
    var X = function (v) { return x + v * u; };
    var waveY = function (fx) {
      return y + (0.52 + 0.17 * Math.sin(fx * Math.PI * 3 + t * 1.25 + p.phase)) * u;
    };
    var i, fx, pts = [];
    for (i = 0; i <= 24; i++) { fx = 0.08 + (i / 24) * 0.74; pts.push([X(fx), waveY(fx)]); }
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = CHAR; ctx.lineWidth = u * 0.105; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = p.alt ? OCHRE : TERRA; ctx.lineWidth = u * 0.07; ctx.stroke();
    // bone diamonds along the back
    for (i = 0; i < 5; i++) {
      fx = 0.16 + i * 0.15;
      var cx = X(fx), cy = waveY(fx), r = u * 0.038;
      pathFrom([[cx, cy - r], [cx + r, cy], [cx, cy + r], [cx - r, cy]]);
      ctx.fillStyle = BONE; ctx.fill(); outline(u * 0.012);
    }
    // head at the right end
    var hx = X(0.86), hy = waveY(0.84);
    pathFrom([[hx - u * 0.05, hy - u * 0.07], [hx + u * 0.09, hy - u * 0.015], [hx + u * 0.085, hy + u * 0.05], [hx - u * 0.04, hy + u * 0.075]]);
    ctx.fillStyle = BONE; ctx.fill(); outline(u * 0.018);
    ctx.beginPath(); ctx.arc(hx + u * 0.035, hy - u * 0.02, u * 0.018, 0, Math.PI * 2);
    ctx.fillStyle = CHAR; ctx.fill();
    // forked tongue
    ctx.strokeStyle = TERRA; ctx.lineWidth = u * 0.014;
    ctx.beginPath();
    ctx.moveTo(hx + u * 0.09, hy + u * 0.015);
    ctx.lineTo(hx + u * 0.15, hy + u * 0.03);
    ctx.moveTo(hx + u * 0.09, hy + u * 0.015);
    ctx.lineTo(hx + u * 0.145, hy - u * 0.02);
    ctx.stroke();
    // rattle tip at the tail
    ctx.beginPath(); ctx.arc(pts[0][0] - u * 0.03, pts[0][1], u * 0.032, 0, Math.PI * 2);
    ctx.fillStyle = OCHRE; ctx.fill(); outline(u * 0.013);
  }

  function drawDancer(x, y, u, p, t) {
    var X = function (v) { return x + v * u; }, Y = function (v) { return y + v * u; };
    var beat = 0.5 + 0.5 * Math.sin(t * 1.35 + p.phase);
    beat = beat * beat * (3 - 2 * beat); // smoothstep: two leg poses, alternating
    var hipY = Y(0.66);
    var lerp = function (a, b) { return a + (b - a) * beat; };
    // legs (behind skirt hem)
    ctx.lineCap = 'round';
    ctx.strokeStyle = CHAR; ctx.lineWidth = u * 0.05;
    var a1 = lerp(-0.55, 0.5, beat), a2 = lerp(0.6, -0.45, beat);
    ctx.beginPath();
    ctx.moveTo(X(0.46), hipY); ctx.lineTo(X(0.46) + Math.sin(a1) * u * 0.26, hipY + Math.cos(a1) * u * 0.26);
    ctx.moveTo(X(0.54), hipY); ctx.lineTo(X(0.54) + Math.sin(a2) * u * 0.26, hipY + Math.cos(a2) * u * 0.26);
    ctx.stroke();
    // skirt
    pathFrom([[X(0.36), Y(0.44)], [X(0.64), Y(0.44)], [X(0.70), Y(0.68)], [X(0.30), Y(0.68)]]);
    ctx.fillStyle = OCHRE; ctx.fill(); outline(u * 0.018);
    ctx.fillStyle = BONE;
    for (var i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.arc(X(0.40 + i * 0.067), Y(0.60), u * 0.016, 0, Math.PI * 2); ctx.fill();
    }
    // torso
    pathFrom([[X(0.43), Y(0.28)], [X(0.57), Y(0.28)], [X(0.62), Y(0.45)], [X(0.38), Y(0.45)]]);
    ctx.fillStyle = TERRA; ctx.fill(); outline(u * 0.018);
    // arms raised
    ctx.strokeStyle = CHAR; ctx.lineWidth = u * 0.042;
    ctx.beginPath();
    ctx.moveTo(X(0.44), Y(0.31)); ctx.lineTo(X(0.30), Y(0.18));
    ctx.moveTo(X(0.56), Y(0.31)); ctx.lineTo(X(0.71), Y(0.20));
    ctx.stroke();
    // head with a bun
    ctx.beginPath(); ctx.arc(X(0.5), Y(0.19), u * 0.085, 0, Math.PI * 2);
    ctx.fillStyle = BONE; ctx.fill(); outline(u * 0.018);
    ctx.beginPath(); ctx.arc(X(0.5), Y(0.095), u * 0.038, 0, Math.PI * 2);
    ctx.fillStyle = TERRA; ctx.fill(); outline(u * 0.014);
  }

  function drawSun(x, y, u, p, t) {
    var cx = x + u * 0.5, cy = y + u * 0.5;
    var cyc = ((t * 0.22 + p.phase) % 2 + 2) % 2;
    var k = cyc < 1 ? cyc : 2 - cyc;
    k = k * k * (3 - 2 * k);
    var ang = k * Math.PI / 2; // quarter turn, and back
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(ang);
    for (var i = 0; i < 12; i++) {
      var a = (i / 12) * Math.PI * 2;
      var r0 = u * 0.235, r1 = u * (i % 2 === 0 ? 0.40 : 0.33);
      var px = Math.cos(a), py = Math.sin(a), nx = -py, ny = px, bw = u * 0.05;
      pathFrom([
        [px * r0 + nx * bw, py * r0 + ny * bw],
        [px * r1, py * r1],
        [px * r0 - nx * bw, py * r0 - ny * bw]
      ]);
      ctx.fillStyle = TERRA; ctx.fill(); outline(u * 0.014);
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, u * 0.235, 0, Math.PI * 2);
    ctx.fillStyle = OCHRE; ctx.fill(); outline(u * 0.02);
    ctx.beginPath(); ctx.arc(cx, cy, u * 0.185, 0, Math.PI * 2);
    ctx.strokeStyle = CHAR; ctx.lineWidth = u * 0.013; ctx.stroke();
    // face
    ctx.beginPath(); ctx.arc(cx - u * 0.065, cy - u * 0.03, u * 0.02, 0, Math.PI * 2);
    ctx.fillStyle = CHAR; ctx.fill();
    ctx.beginPath(); ctx.arc(cx + u * 0.065, cy - u * 0.03, u * 0.02, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy + u * 0.03, u * 0.07, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.strokeStyle = CHAR; ctx.lineWidth = u * 0.016; ctx.stroke();
  }

  function drawWater(x, y, u, p, t) {
    var cols = [BONE, TERRA, OCHRE, BONE];
    for (var i = 0; i < 4; i++) {
      var baseY = y + (0.20 + i * 0.17) * u, hh = u * 0.085, ph = t * 0.8 + p.phase + i * 1.1;
      ctx.beginPath();
      var fx;
      for (var s = 0; s <= 20; s++) {
        fx = 0.10 + (s / 20) * 0.80;
        var wy = baseY + Math.sin(fx * Math.PI * 4 - ph) * u * 0.02;
        if (s === 0) ctx.moveTo(x + fx * u, wy); else ctx.lineTo(x + fx * u, wy);
      }
      for (var s2 = 20; s2 >= 0; s2--) {
        fx = 0.10 + (s2 / 20) * 0.80;
        var wy2 = baseY + hh + Math.sin(fx * Math.PI * 4 - ph) * u * 0.02;
        ctx.lineTo(x + fx * u, wy2);
      }
      ctx.closePath();
      ctx.fillStyle = cols[i]; ctx.fill(); outline(u * 0.015);
    }
    // a droplet bobs above the stack
    var dy = y + (0.10 + 0.02 * Math.sin(t * 1.1 + p.phase)) * u;
    ctx.beginPath();
    ctx.moveTo(x + u * 0.5, dy - u * 0.045);
    ctx.quadraticCurveTo(x + u * 0.545, dy + u * 0.03, x + u * 0.5, dy + u * 0.045);
    ctx.quadraticCurveTo(x + u * 0.455, dy + u * 0.03, x + u * 0.5, dy - u * 0.045);
    ctx.fillStyle = BONE; ctx.fill(); outline(u * 0.013);
  }

  var DRAW = { fret: drawFret, head: drawHead, bird: drawBird, serpent: drawSerpent, dancer: drawDancer, sun: drawSun, water: drawWater };

  // ---------- dust marks ----------
  function drawDustMark(m, t) {
    var dx = (m.x + Math.sin(t * m.sp + m.ph) * m.amp) * W;
    var dy = (m.y + Math.cos(t * m.sp * 0.8 + m.ph * 1.7) * m.amp) * H;
    var s = m.s * Math.max(5, H * 0.012);
    ctx.strokeStyle = m.terra ? TERRA : CHAR;
    ctx.fillStyle = m.terra ? TERRA : CHAR;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = Math.max(1, s * 0.22);
    if (m.kind === 0) {
      ctx.beginPath(); ctx.arc(dx, dy, s * 0.32, 0, Math.PI * 2); ctx.fill();
    } else if (m.kind === 1) {
      ctx.beginPath(); ctx.arc(dx, dy, s * 0.5, Math.PI * 0.15, Math.PI * 1.25); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(dx - s * 0.6, dy + s * 0.5);
      ctx.lineTo(dx - s * 0.6, dy - s * 0.5);
      ctx.lineTo(dx + s * 0.6, dy - s * 0.5);
      ctx.lineTo(dx + s * 0.6, dy + s * 0.1);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- main draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // ground
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    // grain
    var i, g;
    for (i = 0; i < grain.length; i++) {
      g = grain[i];
      ctx.globalAlpha = g.a;
      ctx.fillStyle = g.terra ? TERRA : CHAR;
      ctx.fillRect(g.x * W, g.y * H, g.r, g.r);
    }
    ctx.globalAlpha = 1;

    var bandY = H / 3, bandH = H / 3;
    var panelW = bandH * (isPhone ? 0.74 : 0.82);
    var n = panels.length;
    var period = n * panelW;
    var off = ((state.offset % period) + period) % period;

    // band edge rules
    ctx.strokeStyle = CHAR;
    ctx.lineWidth = Math.max(1.5, bandH * 0.012);
    ctx.beginPath();
    ctx.moveTo(0, bandY); ctx.lineTo(W, bandY);
    ctx.moveTo(0, bandY + bandH); ctx.lineTo(W, bandY + bandH);
    ctx.stroke();

    // panels, wrapped modulo the sequence length
    var startK = Math.floor(off / panelW) - 1;
    var count = Math.ceil(W / panelW) + 3;
    for (var k = startK; k < startK + count; k++) {
      var idx = ((k % n) + n) % n;
      var slotX = k * panelW - off;
      var p = panels[idx];
      ctx.save();
      ctx.beginPath();
      ctx.rect(slotX, bandY, panelW, bandH);
      ctx.clip();
      // the single Maya-blue stripe, in this panel only
      if (idx === blueIndex) {
        ctx.fillStyle = BLUE;
        ctx.fillRect(slotX, bandY + bandH * 0.40, panelW, bandH * 0.20);
        ctx.strokeStyle = CHAR; ctx.lineWidth = Math.max(1, bandH * 0.008);
        ctx.beginPath();
        ctx.moveTo(slotX, bandY + bandH * 0.40); ctx.lineTo(slotX + panelW, bandY + bandH * 0.40);
        ctx.moveTo(slotX, bandY + bandH * 0.60); ctx.lineTo(slotX + panelW, bandY + bandH * 0.60);
        ctx.stroke();
      }
      var pad = panelW * 0.13;
      var u = Math.min(panelW - pad * 2, bandH * 0.80);
      var vx = slotX + (panelW - u) / 2;
      var vy = bandY + (bandH - u) / 2;
      DRAW[p.kind](vx, vy, u, p, t);
      ctx.restore();
      // vertical rule at the slot's left edge
      ctx.strokeStyle = CHAR;
      ctx.lineWidth = Math.max(1.2, bandH * 0.009);
      ctx.beginPath();
      ctx.moveTo(slotX, bandY); ctx.lineTo(slotX, bandY + bandH);
      ctx.stroke();
    }

    // margin dust, above and below the band
    for (i = 0; i < dust.length; i++) drawDustMark(dust[i], t);
  }

  // ---------- interaction: drag to scroll, double-tap to reseed ----------
  function nowAnchored() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : state.t;
  }
  var lastMoveT = 0;
  canvas.addEventListener('pointerdown', function (e) {
    var tt = nowAnchored();
    state.dragging = true;
    state.lastX = e.clientX;
    lastMoveT = tt;
    state.vel = 0;
    var dx = Math.abs(e.clientX - state.lastTapX), dy = Math.abs(e.clientY - state.lastTapY);
    if (tt - state.lastTapT < 0.35 && dx < 24 && dy < 24) {
      generation++;
      genSequence();
      state.lastTapT = -10;
    } else {
      state.lastTapT = tt; state.lastTapX = e.clientX; state.lastTapY = e.clientY;
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!state.dragging) return;
    var tt = nowAnchored();
    var dx = e.clientX - state.lastX;
    state.lastX = e.clientX;
    state.offset -= dx;
    var dt = Math.max(tt - lastMoveT, 0.001);
    state.vel = state.vel * 0.6 + (-dx / dt) * 0.4;
    lastMoveT = tt;
  });
  function endDrag() { state.dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', endDrag);

  // ---------- run ----------
  resize();
  draw(0); // frame one: synchronous, offset 0, phase-0 poses

  var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var lastT = 0;
  function tick() {
    var t = (((typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp) - startStamp) / 1000;
    var dt = Math.min(t - lastT, 0.05);
    lastT = t;
    state.t = t;
    if (!state.dragging && state.vel !== 0) {
      state.offset += state.vel * dt;
      state.vel *= Math.pow(0.08, dt); // inertia decay
      if (Math.abs(state.vel) < 0.5) state.vel = 0;
    }
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
</body>
