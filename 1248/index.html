<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Archive of Things</title>
<style>
  html, body { margin: 0; padding: 0; background: #2B2B30; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1248 "Archive of Things" - Jenna Maurice study block JM1.
   After Maurice's The Archive of Things (2023-ongoing): objects laid on
   darkroom paper and exposed to sunlight for hours - "the sunlight
   penetrates any part of the object that is not entirely opaque" - the
   B&W emulsion blooming into color wherever the sun lingered.
   A lumen print in code: a lemon, a grape cluster, green beans, two
   leaves and a seed pod rest on dark paper as near-black silhouettes.
   A pale sun crosses the frame on a four-minute arc, out and back;
   exposure accumulates part by part and each part blooms toward its
   interior color once its threshold is crossed - the lemon's pulp
   wedges into orange and acid green, the grapes into magenta, the
   beans into green. Nothing ever un-blooms. The print accumulates
   over an eight-minute master cycle, rests a minute fully bloomed,
   then a fresh sheet replaces it. Drag sideways to change the sun's
   speed (slower = deeper bloom, never paused); tap to freeze the sun
   mid-arc (a specimen hold); double-tap reseeds the still life.
   HOUSE ADAPTATION: the prompt's per-pixel exposure buffer cannot run
   in the QA renderer, so exposure is kept as DATA per object part -
   each part carries a translucency and a threshold, its exposure is
   the closed-form accumulation of sun proximity over time (fixed 1 s
   steps over the deterministic sun path), and the bloom is drawn as
   flat layered shapes. Silent. Seeded hashes only. */

var T0 = 150;                  // fixed first-frame phase: print in progress
var T_TR = 240;                // one sun traverse, seconds
var MASTER = 480;              // accumulating part of the cycle (2 traverses)
var NCYC = 540;                // master + 60 s fully-bloomed rest
var SIG_U = 0.24;              // sun-proximity falloff, unit coords
var BLOOM_W = 36;              // exposure width of the bloom transition

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

var PAL = {
  paper: '#2B2B30', paperEdge: '#3A3A40', silver: '#8E8E93',
  silh: '#17171A', rim: '#8E8E93', sun: '#F5E6C8', arc: '#F5E6C8',
  lemonRind: '#E8B820', lemonA: '#E8862E', lemonB: '#C9D42E', lemonCore: '#F2D06B',
  grape: '#B13E7C', grapeHi: '#D270A8', stem: '#4A3A28',
  beanA: '#5DAE62', beanB: '#3E7D44',
  leafA: '#4E7A3A', leafB: '#79A24B',
  podShell: '#7A4A2E', podCh: '#A8743C', podSeed: '#D9B96A'
};

/* ---------- seeded hash (integer, deterministic) ---------- */
function ih(a, b) {
  var x = ((a | 0) * 374761393 + (b | 0) * 668265263) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function smooth(a, b, x) { var u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); }

/* ---------- time ---------- */
function perfNow() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
}
var startPerf = perfNow();
var booted = false;
function pieceNow() { return booted ? T0 + (perfNow() - startPerf) : T0; }

/* ---------- the still life: objects as exposure parts ----------
   Unit coords: x right, y down, frame = [0,1]x[0,1]; shapes are drawn
   scaled by S = min(W,H) around the still-life centre. Each part:
   {obj, kind, cx, cy, r, rot, tr (translucency), hc (hardness),
    thr (exposure threshold), col (interior color), seed}            */
var salt = 0;
var parts = [];
var shadows = [];
var CEN = { x: 0.46, y: 0.54 };                 // still life centre
var SPREAD = 1.18, SRAD = 1.15;                 // layout spread / size lift
function rankOf(x, y) {                          // distance rank from the sun's home
  var dx = x - 0.5, dy = y - 0.30;
  return clamp(Math.sqrt(dx * dx + dy * dy) / 0.62, 0, 1);
}
function addPart(obj, kind, cx, cy, r, rot, tr, hc, col, seed) {
  cx = CEN.x + (cx - CEN.x) * SPREAD; cy = CEN.y + (cy - CEN.y) * SPREAD; r *= SRAD;
  var rank = rankOf(cx, cy);
  var thr = (34 - 8 * tr + 10 * hc) * (0.7 + 0.5 * rank) * 1.62;
  parts.push({ obj: obj, kind: kind, cx: cx, cy: cy, r: r, rot: rot || 0,
               tr: tr, hc: hc, thr: thr, col: col, seed: seed });
}
function buildObjects() {
  parts = [];
  var s = salt * 1000, jx, jy, i, k;
  /* lemon: rind ring + 8 pulp wedges + core, nub ends in the outline */
  jx = (ih(s, 11) - 0.5) * 0.03; jy = (ih(s, 12) - 0.5) * 0.03;
  var lx = 0.40 + jx, ly = 0.60 + jy, lr = 0.135, lrot = -0.35 + ih(s, 13) * 0.3;
  addPart('lemon', 'rind', lx, ly, lr, lrot, 0.36, 0.35, PAL.lemonRind, s + 100);
  for (i = 0; i < 8; i++)
    addPart('lemon', 'wedge', lx, ly, lr * 0.80, lrot + i * Math.PI / 4, 0.88, 0.05,
            i % 2 ? PAL.lemonB : PAL.lemonA, s + 110 + i);
  addPart('lemon', 'core', lx, ly, lr * 0.16, 0, 0.9, 0.1, PAL.lemonCore, s + 120);
  /* grape cluster: stem + 15 grapes in a tapering triangle */
  jx = (ih(s, 21) - 0.5) * 0.03; jy = (ih(s, 22) - 0.5) * 0.03;
  var gx = 0.60 + jx, gy = 0.44 + jy;
  addPart('grapes', 'stem', gx, gy - 0.105, 0.05, 0.5, 0.3, 0.6, PAL.stem, s + 200);
  var rows = [2, 3, 4, 3, 2, 1], gi = 0;
  for (var rI = 0; rI < rows.length; rI++)
    for (i = 0; i < rows[rI]; i++) {
      addPart('grapes', 'grape',
        gx + (i - (rows[rI] - 1) / 2) * 0.052 + (ih(s + gi, 31) - 0.5) * 0.012,
        gy - 0.075 + rI * 0.037 + (ih(s + gi, 32) - 0.5) * 0.008,
        0.030 + ih(s + gi, 33) * 0.006, 0, 0.70, 0.2, PAL.grape, s + 210 + gi);
      gi++;
    }
  /* green beans: 3 curved pods, 4 segments each; segments sit on the
     pod's curve, aligned to its local tangent, overlapping so the pod
     reads as one bent body whose parts bloom one by one */
  jx = (ih(s, 41) - 0.5) * 0.03; jy = (ih(s, 42) - 0.5) * 0.03;
  var bx = 0.635 + jx, by = 0.675 + jy;
  for (var p = 0; p < 3; p++) {
    var ba = -0.35 + p * 0.35 + (ih(s + p, 43) - 0.5) * 0.15;
    var bcx = bx + (p - 1) * 0.045, bcy = by + (p - 1) * 0.014;
    for (k = 0; k < 4; k++) {
      var u = 0.125 + k * 0.25, bend = Math.sin(u * Math.PI) * 0.030;
      addPart('beans', 'beanseg',
        bcx + Math.sin(ba) * (u - 0.5) * 0.19 - Math.cos(ba) * bend,
        bcy - Math.cos(ba) * (u - 0.5) * 0.19 - Math.sin(ba) * bend,
        0.025 - Math.abs(u - 0.5) * 0.009, ba - Math.PI / 2 + Math.cos(u * Math.PI) * 0.30, 1.0, 0.05,
        (k + p) % 2 ? PAL.beanB : PAL.beanA, s + 300 + p * 10 + k);
    }
  }
  /* two leaves: blade + 3 zones each */
  var leafAt = function (cx, cy, rot, sd) {
    addPart('leaf', 'blade', cx, cy, 0.082, rot, 0.55, 0.3, PAL.leafA, sd);
    for (var z = 0; z < 3; z++) {
      var uu = -0.5 + z * 0.5;
      addPart('leaf', 'zone',
        cx - Math.sin(rot) * uu * 0.10, cy + Math.cos(rot) * uu * 0.10,
        0.052, rot, 0.62, 0.2, z % 2 ? PAL.leafB : PAL.leafA, sd + 10 + z);
    }
  };
  leafAt(0.30 + (ih(s, 51) - 0.5) * 0.03, 0.42 + (ih(s, 52) - 0.5) * 0.03, 0.7, s + 400);
  leafAt(0.345 + (ih(s, 53) - 0.5) * 0.03, 0.475 + (ih(s, 54) - 0.5) * 0.03, 2.4, s + 420);
  /* seed pod: shell + 3 chambers + seeds */
  jx = (ih(s, 61) - 0.5) * 0.03; jy = (ih(s, 62) - 0.5) * 0.03;
  var px = 0.475 + jx, py = 0.70 + jy, prot = 0.25;
  addPart('pod', 'shell', px, py, 0.062, prot, 0.75, 0.3, PAL.podShell, s + 500);
  for (i = 0; i < 3; i++) {
    var off = (i - 1) * 0.036;
    var chx = px - Math.sin(prot) * off, chy = py + Math.cos(prot) * off;
    addPart('pod', 'chamber', chx, chy, 0.024, prot, 1.0, 0.2, PAL.podCh, s + 510 + i);
    addPart('pod', 'seedp', chx, chy, 0.012, prot, 0.85, 0.4, PAL.podSeed, s + 520 + i);
  }
  shadows = [
    { x: lx, y: ly, rx: lr * 1.3, ry: lr * 1.05 },
    { x: gx, y: gy + 0.005, rx: 0.115, ry: 0.10 },
    { x: bx, y: by, rx: 0.115, ry: 0.085 },
    { x: 0.30, y: 0.42, rx: 0.085, ry: 0.075 },
    { x: 0.345, y: 0.475, rx: 0.085, ry: 0.075 },
    { x: px, y: py, rx: 0.075, ry: 0.06 }
  ];
  for (i = 0; i < shadows.length; i++) {
    shadows[i].x = CEN.x + (shadows[i].x - CEN.x) * SPREAD;
    shadows[i].y = CEN.y + (shadows[i].y - CEN.y) * SPREAD;
    shadows[i].rx *= SRAD; shadows[i].ry *= SRAD;
  }
}
buildObjects();

/* ---------- sun path + visitor events ----------
   The sun's cycle position is kept in SECONDS (phase). With no events
   it advances 1:1 with piece time, which is exactly the absolute law
   (cycle = phase mod NCYC; traverses out and back; parked in rest).
   Events (speed segments, specimen holds) are recorded with their
   piece time and folded in by walking fixed 1 s steps - the same walk
   yields per-part exposure, so state at any t is one deterministic
   derivation from the event list. Reseed re-anchors exposure at zero
   for the new arrangement. */
var evList = [];               // {t, type:'speed', f} | {t, type:'hold'} | {t, type:'unhold'}
var holdOn = false, curSpeed = 1;
var anchorT = 0;               // exposure re-anchor time (reseed)
var phaseRows = null, expRows = null, rowsBuilt = -1;
function sunPosFromPhase(ph) {
  var cyc = ((ph % NCYC) + NCYC) % NCYC;
  if (cyc >= MASTER) return null;                       // set: rest
  var tt = cyc % T_TR, p = tt / T_TR;
  if (Math.floor(cyc / T_TR) % 2 === 1) p = 1 - p;      // return traverse
  return { x: -0.08 + 1.16 * p, y: 0.52 - 0.22 * Math.sin(Math.PI * p), p: p };
}
function speedAt(tm) {
  var f = 1;
  for (var i = 0; i < evList.length; i++)
    if (evList[i].type === 'speed' && evList[i].t <= tm) f = evList[i].f;
  return f;
}
function heldAt(tm) {
  var h = false;
  for (var i = 0; i < evList.length; i++) {
    if (evList[i].t > tm) continue;
    if (evList[i].type === 'hold') h = true;
    else if (evList[i].type === 'unhold') h = false;
  }
  return h;
}
function rateOf(idx, ph) {
  var sp = sunPosFromPhase(ph);
  if (!sp) return 0;
  var pt = parts[idx], dx = pt.cx - sp.x, dy = pt.cy - sp.y;
  var g = Math.exp(-(dx * dx + dy * dy) / (2 * SIG_U * SIG_U));
  return pt.tr * (0.20 + 0.80 * g);
}
function ensureRows(t) {
  var need = Math.max(0, Math.ceil(t - anchorT));
  if (!phaseRows) { phaseRows = [anchorT]; expRows = [parts.map(function () { return 0; })]; rowsBuilt = 0; }
  while (rowsBuilt < need) {
    var a = anchorT + rowsBuilt, mid = a + 0.5;
    var adv = heldAt(mid) ? 0 : speedAt(mid);
    var phMid = phaseRows[rowsBuilt] + adv * 0.5;
    var row = new Array(parts.length);
    /* sheet replacement: when the sun's cycle wraps, a fresh sheet
       replaces the finished print - exposure restarts from this step */
    var fresh = Math.floor((phaseRows[rowsBuilt] + adv) / NCYC) > Math.floor(phaseRows[rowsBuilt] / NCYC);
    for (var i = 0; i < parts.length; i++)
      row[i] = (fresh ? 0 : expRows[rowsBuilt][i]) + rateOf(i, phMid);
    phaseRows.push(phaseRows[rowsBuilt] + adv);
    expRows.push(row);
    rowsBuilt++;
  }
}
function exposureAt(idx, t) {
  if (t <= anchorT) return 0;
  ensureRows(t);
  var n = Math.floor(t - anchorT), fr = t - anchorT - n;
  if (n >= rowsBuilt) return expRows[rowsBuilt][idx];
  return expRows[n][idx] + fr * (expRows[n + 1][idx] - expRows[n][idx]);
}
function phaseAt(t) {
  if (t <= anchorT) return t;
  ensureRows(t);
  var n = Math.floor(t - anchorT), fr = t - anchorT - n;
  if (n >= rowsBuilt) return phaseRows[rowsBuilt];
  return phaseRows[n] + fr * (phaseRows[n + 1] - phaseRows[n]);
}
function bloomOf(idx, t) {
  var e = exposureAt(idx, t);
  return 0.97 * smooth(0, 1, (e - parts[idx].thr) / BLOOM_W);
}

/* ---------- interaction ---------- */
var dragging = false, downX = 0, downY = 0, curX = 0, downT = 0, lastTapT = -10, dragMoved = false;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; dragMoved = false;
  downX = curX = e.clientX; downY = curY = e.clientY; downT = perfNow();
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  curX = e.clientX; curY = e.clientY;
  if (Math.abs(curX - downX) > 10) {
    dragMoved = true;
    var ns = clamp(curSpeed + (curX - downX) / 240, 0.4, 2.5);
    if (Math.abs(ns - curSpeed) > 0.03) {
      curSpeed = ns;
      evList.push({ t: pieceNow(), type: 'speed', f: ns });
      downX = curX;
    }
  }
});
function endPointer() {
  if (!dragging) return; dragging = false;
  var now = perfNow();
  if (dragMoved) { lastTapT = -10; return; }
  if (now - downT < 0.4) {
    if (now - lastTapT < 0.32) {                        // double-tap: reseed
      salt++;
      buildObjects();
      anchorT = pieceNow();
      phaseRows = null; expRows = null; rowsBuilt = -1;
      evList = []; holdOn = false; curSpeed = 1;
      lastTapT = -10;
    } else {                                            // tap: specimen hold toggle
      holdOn = !holdOn;
      evList.push({ t: pieceNow(), type: holdOn ? 'hold' : 'unhold' });
      lastTapT = now;
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- layout ---------- */
function isPhone() {
  var s = window.screen;
  if (s && Math.min(s.width, s.height) < 700) return true;
  return H > W * 1.15;
}
function resize() {
  var vv = window.visualViewport;
  W = Math.floor(vv ? vv.width : window.innerWidth);
  H = Math.floor(vv ? vv.height : window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
window.addEventListener('resize', function () { resize(); draw(pieceNow()); });

/* unit -> px: the still life lives in a square of side S centred on CEN */
var S = 0, OX = 0, OY = 0;
function ux(u) { return OX + u * S; }
function uy(u) { return OY + u * S; }

/* ---------- drawing helpers ---------- */
function blob(cx, cy, r, seed, lobes, wob) {
  ctx.beginPath();
  var N = 26, i, th, rr2, px, py;
  for (i = 0; i <= N; i++) {
    th = i / N * Math.PI * 2;
    rr2 = r * (1 + wob * Math.sin(lobes * th + seed) + wob * 0.6 * Math.sin((lobes + 3) * th + seed * 1.7));
    px = cx + Math.cos(th) * rr2; py = cy + Math.sin(th) * rr2;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function partShape(pt) {
  var x = ux(pt.cx), y = uy(pt.cy), r = pt.r * S, sd = pt.seed;
  if (pt.kind === 'rind' || pt.kind === 'wedge' || pt.kind === 'core') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(pt.kind === 'rind' ? pt.rot : 0);
    if (pt.kind === 'wedge') {
      /* one pulp wedge: the lemon outline clipped to a 45-degree sector */
      var lr = parts[0].r * S;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, pt.rot - Math.PI / 8, pt.rot + Math.PI / 8);
      ctx.closePath();
      ctx.restore();
      return;
    }
    blob(0, 0, r, sd, 5, 0.045);
    /* nub ends */
    ctx.moveTo(-r * 0.90, 0); ctx.arc(-r * 0.90, 0, r * 0.10, 0, Math.PI * 2);
    ctx.moveTo(r * 0.90, 0); ctx.arc(r * 0.90, 0, r * 0.10, 0, Math.PI * 2);
    ctx.restore();
    return;
  }
  if (pt.kind === 'beanseg') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(pt.rot);
    ctx.beginPath();
    ctx.moveTo(-r * 1.7, 0);
    ctx.quadraticCurveTo(0, -r * 1.5, r * 1.7, 0);
    ctx.quadraticCurveTo(0, r * 1.5, -r * 1.7, 0);
    ctx.closePath(); ctx.restore();
    return;
  }
  if (pt.kind === 'blade' || pt.kind === 'zone') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(pt.rot);
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(r * 0.62, -r * 0.2, 0, r);
    ctx.quadraticCurveTo(-r * 0.62, -r * 0.2, 0, -r);
    ctx.closePath(); ctx.restore();
    return;
  }
  blob(x, y, r, sd, pt.kind === 'grape' ? 6 : 5, pt.kind === 'grape' ? 0.05 : 0.09);
}
function fillPart(pt, style, alpha) {
  ctx.globalAlpha = alpha; ctx.fillStyle = style;
  partShape(pt); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------- draw ---------- */
function draw(t) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  S = Math.min(W, H);
  OX = CEN.x * W - 0.5 * S; OY = CEN.y * H - 0.5 * S;
  var i, pt, b, oi;
  /* paper */
  ctx.fillStyle = PAL.paper; ctx.fillRect(0, 0, W, H);
  for (i = 0; i < 900; i++) {                            // paper grain, hashed speckle
    ctx.fillStyle = ih(i, 7919) > 0.5 ? '#34343A' : '#232328';
    ctx.globalAlpha = 0.16;
    ctx.fillRect(ih(i, 104729) * W, ih(i, 1299709) * H, 1.4, 1.4);
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.paperEdge; ctx.globalAlpha = 0.55; ctx.lineWidth = 2;
  ctx.strokeRect(5, 5, W - 10, H - 10); ctx.globalAlpha = 1;
  /* sun-path arc (hairline) + the sun */
  var sp = sunPosFromPhase(phaseAt(t));
  ctx.strokeStyle = PAL.arc; ctx.globalAlpha = 0.20; ctx.lineWidth = 1;
  ctx.beginPath();
  for (i = 0; i <= 40; i++) {
    var pp = i / 40, ax = ux(-0.08 + 1.16 * pp), ay = uy(0.52 - 0.22 * Math.sin(Math.PI * pp));
    if (i === 0) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
  }
  ctx.stroke(); ctx.globalAlpha = 1;
  if (sp) {
    ctx.fillStyle = PAL.sun;
    var gr = [0.30, 0.245, 0.195, 0.15, 0.11, 0.075], ga = [0.02, 0.022, 0.024, 0.026, 0.028, 0.03], gi2;
    for (gi2 = 0; gi2 < 6; gi2++) {
      ctx.globalAlpha = ga[gi2];
      ctx.beginPath(); ctx.arc(ux(sp.x), uy(sp.y), gr[gi2] * S, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  /* contact shadows */
  ctx.fillStyle = '#101013';
  for (i = 0; i < shadows.length; i++) {
    ctx.globalAlpha = 0.22;
    ctx.beginPath();
    ctx.ellipse(ux(shadows[i].x) + 0.010 * S, uy(shadows[i].y) + 0.014 * S,
                shadows[i].rx * S, shadows[i].ry * S, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* objects, back to front */
  var order = ['leaf', 'lemon', 'pod', 'beans', 'grapes'];
  for (oi = 0; oi < order.length; oi++)
    for (i = 0; i < parts.length; i++) {
      pt = parts[i];
      if (pt.obj !== order[oi]) continue;
      if (pt.kind === 'stem') {
        ctx.strokeStyle = PAL.silh; ctx.lineWidth = Math.max(1.5, 0.005 * S);
        ctx.beginPath(); ctx.moveTo(ux(pt.cx - 0.015), uy(pt.cy + 0.04));
        ctx.quadraticCurveTo(ux(pt.cx + 0.005), uy(pt.cy), ux(pt.cx + 0.02), uy(pt.cy - 0.022)); ctx.stroke();
        continue;
      }
      b = bloomOf(i, t);
      fillPart(pt, PAL.silh, 1);
      fillPart(pt, PAL.silver, (1 - b) * (pt.kind === 'rind' ? 0.30 : 0.55));
      if (b > 0.01) fillPart(pt, pt.col, b);
      /* rim light: the unbloomed edge */
      ctx.strokeStyle = PAL.rim; ctx.globalAlpha = 0.30 + 0.25 * (1 - b); ctx.lineWidth = 1.1;
      partShape(pt); ctx.stroke(); ctx.globalAlpha = 1;
      /* interior detail, fading in with the bloom */
      if (b > 0.05) {
        ctx.globalAlpha = b;
        var x = ux(pt.cx), y = uy(pt.cy), r = pt.r * S;
        if (pt.kind === 'wedge') {
          ctx.strokeStyle = '#F5E6C8'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(ux(parts[0].cx), uy(parts[0].cy));
          ctx.lineTo(x + Math.cos(pt.rot) * r * 0.4, y + Math.sin(pt.rot) * r * 0.4); ctx.stroke();
        } else if (pt.kind === 'grape') {
          ctx.fillStyle = PAL.grapeHi;
          ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, Math.max(1.2, r * 0.16), 0, Math.PI * 2); ctx.fill();
        } else if (pt.kind === 'beanseg') {
          ctx.fillStyle = PAL.beanB;
          ctx.beginPath(); ctx.ellipse(x, y, r * 0.5, r * 0.3, pt.rot, 0, Math.PI * 2); ctx.fill();
        } else if (pt.kind === 'zone') {
          ctx.strokeStyle = PAL.leafB; ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + Math.sin(pt.rot) * r * 0.7, y - Math.cos(pt.rot) * r * 0.7);
          ctx.lineTo(x - Math.sin(pt.rot) * r * 0.7, y + Math.cos(pt.rot) * r * 0.7);
          ctx.stroke();
        } else if (pt.kind === 'seedp') {
          ctx.fillStyle = PAL.podShell;
          ctx.beginPath(); ctx.arc(x, y, Math.max(1, r * 0.35), 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }
  /* the sun disc itself */
  if (sp) {
    ctx.fillStyle = PAL.sun; ctx.globalAlpha = 0.18;
    ctx.beginPath(); ctx.arc(ux(sp.x), uy(sp.y), 0.052 * S, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.arc(ux(sp.x), uy(sp.y), 0.030 * S, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  /* specimen hold: corner registration brackets around the sheet */
  if (holdOn) {
    ctx.strokeStyle = PAL.sun; ctx.globalAlpha = 0.6; ctx.lineWidth = 2;
    var m = 14, L = 22;
    ctx.beginPath();
    ctx.moveTo(m, m + L); ctx.lineTo(m, m); ctx.lineTo(m + L, m);
    ctx.moveTo(W - m - L, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + L);
    ctx.moveTo(W - m, H - m - L); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m - L, H - m);
    ctx.moveTo(m + L, H - m); ctx.lineTo(m, H - m); ctx.lineTo(m, H - m - L);
    ctx.stroke(); ctx.globalAlpha = 1;
  }
}

resize();
draw(pieceNow());
if (typeof requestAnimationFrame === 'function') {
  startPerf = perfNow(); booted = true;      // clock starts with the loop; frame one was exactly T0
  var loop = function () { draw(pieceNow()); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
