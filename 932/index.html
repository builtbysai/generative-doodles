<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What the Biobank Sees</title>
<style>
  html, body { margin: 0; padding: 0; background: #F7F3E8; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var PAPER = '#F7F3E8';
  var BLUE = '#2471A3';        // the person, intact
  var ZSTRUCT = '#C0392B';     // structured
  var ZUNSTRUCT = '#7D3C98';   // unstructured
  var ZSTORED = '#B9770E';     // stored samples
  var THREAD = '#8A8578';
  var INK = '#1A1A1A';

  var ZONE_COLORS = [ZSTRUCT, ZUNSTRUCT, ZSTORED]; // 0 structured, 1 unstructured, 2 stored
  var LOOP = 120;              // seconds: person 10, explode 45, hold 15, regather 50
  var N = 312;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var viewW = 300, viewH = 300, dpr = 1, isPhone = false;

  function measure() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    }
    if (!w) { w = 300; h = 300; }
    viewW = w; viewH = h;
    dpr = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (dpr < 1) dpr = 1; if (dpr > 3) dpr = 3;
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    isPhone = (Math.min(sw, sh) > 0 && Math.min(sw, sh) < 700) || (viewH > viewW * 1.15);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
  }
  measure();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', function () { measure(); draw(elapsed()); });
    if (window.addEventListener) window.addEventListener('resize', function () { measure(); draw(elapsed()); });
  }

  // Seeded RNG (mulberry32). All drawn data comes from this one stream, in a fixed order.
  var rngState = 93293;
  function rng() {
    rngState |= 0; rngState = (rngState + 0x6D2B79F5) | 0;
    var t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rngSeeded(seed) { // independent stream for perspective shuffles
    var s = seed | 0;
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Clock: elapsed seconds since load. Frame one is drawn at t = 0 synchronously.
  function rawNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return 0;
  }
  var startT = rawNow();
  function elapsed() { return Math.max(0, rawNow() - startT); }

  // ----- The person: a standing silhouette built from ellipses (normalized coords) -----
  var ELLIPSES = [
    { cx: 0.500, cy: 0.229, rx: 0.055, ry: 0.063, rot: 0 },     // head
    { cx: 0.500, cy: 0.449, rx: 0.086, ry: 0.167, rot: 0 },     // torso
    { cx: 0.346, cy: 0.480, rx: 0.026, ry: 0.145, rot: -0.38 }, // left arm, angled out
    { cx: 0.654, cy: 0.480, rx: 0.026, ry: 0.145, rot: 0.38 },  // right arm, angled out
    { cx: 0.443, cy: 0.761, rx: 0.035, ry: 0.158, rot: 0.03 },  // left leg
    { cx: 0.557, cy: 0.761, rx: 0.035, ry: 0.158, rot: -0.03 }  // right leg
  ];
  function insidePerson(x, y) {
    for (var i = 0; i < ELLIPSES.length; i++) {
      var e = ELLIPSES[i];
      var dx = x - e.cx, dy = y - e.cy;
      var c = Math.cos(-e.rot), s = Math.sin(-e.rot);
      var lx = dx * c - dy * s, ly = dx * s + dy * c;
      var q = (lx * lx) / (e.rx * e.rx) + (ly * ly) / (e.ry * e.ry);
      if (q <= 1) return true;
    }
    return false;
  }

  // ----- Provenance tags -----
  var TAGPOOL = ['blood pressure', 'ECG trace', 'survey answer', 'urine sample',
    'consent form', 'sleep hours', 'genome panel', 'MRI slice',
    'step count', 'diet diary', 'blood sample', 'voice note'];
  function tagFor(i) {
    var base = TAGPOOL[i % TAGPOOL.length];
    if (base === 'survey answer') return base + ' ' + (3 + (i * 7) % 40);
    if (base === 'blood sample') return base + ' ' + 'ABC'[i % 3];
    return base;
  }

  // ----- Zone targets -----
  // Structured: a neat grid on the left.
  var GRID = { x0: 0.035, y0: 0.295, cols: 10, rows: 14, cw: 0.020, ch: 0.029 };
  // Stored: stacked rows along the bottom, like vials on a shelf.
  var ROWS_Y = [0.852, 0.882, 0.912, 0.942];

  // ----- Points -----
  var points = [];
  (function buildPoints() {
    // Exact zone quotas, shuffled: 140 structured, 94 unstructured, 78 stored.
    var zones = [];
    var zi, k;
    for (k = 0; k < 140; k++) zones.push(0);
    for (k = 0; k < 94; k++) zones.push(1);
    for (k = 0; k < 78; k++) zones.push(2);
    for (zi = zones.length - 1; zi > 0; zi--) {
      var j = Math.floor(rng() * (zi + 1));
      var tmp = zones[zi]; zones[zi] = zones[j]; zones[j] = tmp;
    }
    // Structured grid slots, shuffled so neighbours in the person land apart.
    var slots = [];
    for (k = 0; k < GRID.cols * GRID.rows; k++) slots.push(k);
    for (zi = slots.length - 1; zi > 0; zi--) {
      var j2 = Math.floor(rng() * (zi + 1));
      var t2 = slots[zi]; slots[zi] = slots[j2]; slots[j2] = t2;
    }
    var slotCursor = 0, storedCursor = 0;
    for (var i = 0; i < N; i++) {
      // Rejection-sample a home inside the silhouette.
      var hx = 0, hy = 0, tries = 0;
      do {
        hx = 0.30 + rng() * 0.40;
        hy = 0.15 + rng() * 0.79;
        tries++;
      } while (!insidePerson(hx, hy) && tries < 400);
      var zone = zones[i];
      var tx = 0, ty = 0;
      if (zone === 0) {
        var sIdx = slots[slotCursor++];
        var col = sIdx % GRID.cols, row = Math.floor(sIdx / GRID.cols);
        tx = GRID.x0 + (col + 0.5) * GRID.cw;
        ty = GRID.y0 + (row + 0.5) * GRID.ch;
      } else if (zone === 1) {
        tx = 0.755 + rng() * 0.20;
        ty = 0.240 + rng() * 0.50;
      } else {
        var per = [20, 20, 19, 19];
        var acc = 0, rIdx = 0, cIdx = 0;
        for (var r = 0; r < 4; r++) {
          if (storedCursor < acc + per[r]) { rIdx = r; cIdx = storedCursor - acc; break; }
          acc += per[r];
        }
        tx = 0.315 + (cIdx + 0.5) * (0.37 / per[rIdx]) + (rng() - 0.5) * 0.004;
        ty = ROWS_Y[rIdx];
        storedCursor++;
      }
      points.push({
        hx: hx, hy: hy, tx: tx, ty: ty, zone: zone,
        tag: tagFor(i),
        size: 0.85 + rng() * 0.6,
        large: false,
        wobAmp: 0.005 + rng() * 0.008,
        wobFx: 0.05 + rng() * 0.05,
        wobFy: 0.04 + rng() * 0.05,
        wobPx: rng() * Math.PI * 2,
        wobPy: rng() * Math.PI * 2
      });
    }
    // Twelve large points carry the visible micro-labels: a fixed stride through the set.
    for (var m = 0; m < 12; m++) {
      var p = points[Math.floor((m + 0.5) * N / 12)];
      p.large = true; p.size = 1.75;
    }
  })();

  // ----- Perspectives: each one re-seeds the detach order -----
  var PERSPECTIVES = ['PI', 'nurse', 'participant', 'manager', 'lab tech', 'data manager', 'researcher', 'funder'];
  var perspectiveIdx = 2; // participant
  var orders = []; // orders[perspective][pointIndex] = normalized rank 0..1
  (function buildOrders() {
    for (var p = 0; p < PERSPECTIVES.length; p++) {
      var rand = rngSeeded(932930 + p * 7919);
      var idx = [];
      for (var i = 0; i < N; i++) idx.push(i);
      for (var k = idx.length - 1; k > 0; k--) {
        var j = Math.floor(rand() * (k + 1));
        var t = idx[k]; idx[k] = idx[j]; idx[j] = t;
      }
      var rank = new Array(N);
      for (var q = 0; q < N; q++) rank[idx[q]] = q / (N - 1);
      orders.push(rank);
    }
  })();

  // ----- Recorded interaction state (everything drawn is a closed-form function of t + these) -----
  var pendingTap = null;    // {t, x, y}
  var isolateT0 = -100;     // double-tap start time
  var dragSamples = [];     // {t, x, y} in normalized coords, newest last
  var pointerDown = null;   // {t, x, y, moved}

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function smoother(x) { x = clamp01(x); return x * x * x * (x * (x * 6 - 15) + 10); }

  // Global explosion amount over the 120 s loop.
  function globalProgress(lt) {
    if (lt < 10) return 0;
    if (lt < 55) { var e = (lt - 10) / 45; return e * e * (3 - 2 * e); }
    if (lt < 70) return 1;
    var e2 = 1 - (lt - 70) / 50; return e2 * e2 * (3 - 2 * e2);
  }
  function isolateAmt(t) {
    var a = Math.min((t - isolateT0) / 0.5, (isolateT0 + 8 - t) / 0.5);
    return clamp01(a);
  }

  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  var BLUE_RGB = hexRgb(BLUE);
  var ZONE_RGB = [hexRgb(ZSTRUCT), hexRgb(ZUNSTRUCT), hexRgb(ZSTORED)];
  function mixStr(a, b, f, alpha) {
    var r = Math.round(a[0] + (b[0] - a[0]) * f);
    var g = Math.round(a[1] + (b[1] - a[1]) * f);
    var bl = Math.round(a[2] + (b[2] - a[2]) * f);
    return 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha + ')';
  }

  // Position of point i at loop time lt (pure; also writes its progress into scratch).
  var scratchP = 0;
  function pointPos(i, lt, tAbs) {
    var p = points[i];
    var rank = orders[perspectiveIdx][i];
    var gp = globalProgress(lt);
    var prog = clamp01(gp * 1.35 - rank * 0.35);
    var e = smoother(prog);
    scratchP = e;
    var tx = p.tx, ty = p.ty;
    if (p.zone === 1 && e > 0) { // unstructured points keep wandering at their targets
      tx += Math.sin(2 * Math.PI * p.wobFx * tAbs + p.wobPx) * p.wobAmp * e;
      ty += Math.sin(2 * Math.PI * p.wobFy * tAbs + p.wobPy) * p.wobAmp * e;
    }
    var x = p.hx + (tx - p.hx) * e;
    var y = p.hy + (ty - p.hy) * e;
    // Drag disturbance: decaying offset field over recorded drag samples.
    var ox = 0, oy = 0;
    for (var s = 0; s < dragSamples.length; s++) {
      var sm = dragSamples[s];
      var age = tAbs - sm.t;
      if (age < 0 || age > 3) continue;
      var dx = x - sm.x, dy = y - sm.y;
      var d2 = dx * dx + dy * dy;
      var fall = Math.exp(-d2 / (0.09 * 0.09)) * Math.exp(-age / 1.1);
      if (fall < 0.003) continue;
      var d = Math.sqrt(d2) || 0.001;
      ox += (dx / d) * fall * 0.05;
      oy += (dy / d) * fall * 0.05;
    }
    var om = Math.sqrt(ox * ox + oy * oy);
    if (om > 0.08) { ox *= 0.08 / om; oy *= 0.08 / om; }
    return { x: x + ox, y: y + oy, e: e, prog: prog };
  }

  function draw(t) {
    // Resolve a matured single tap into a perspective change.
    if (pendingTap && t - pendingTap.t > 0.38) {
      perspectiveIdx = (perspectiveIdx + 1) % PERSPECTIVES.length;
      pendingTap = null;
    }
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var S = Math.min(viewW, viewH);
    var ox = (viewW - S) / 2, oy = (viewH - S) / 2;
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, viewW, viewH);

    var iso = isolateAmt(t);
    var gp = globalProgress(lt);
    var labelAlpha = 0.35 + 0.6 * gp;

    function X(u) { return ox + u * S; }
    function Y(v) { return oy + v * S; }

    // Custody threads: dotted lines from home to zone target, strongest mid-transit.
    ctx.strokeStyle = THREAD;
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 3]);
    var i, pos;
    for (i = 0; i < N; i++) {
      pos = pointPos(i, lt, t);
      var p = points[i];
      if (pos.prog <= 0.001) continue;
      var ta = (0.10 + 0.20 * Math.sin(Math.PI * Math.min(pos.prog, 1))) * (1 - iso);
      if (pos.prog >= 1) ta = 0.10 * (1 - iso);
      if (ta <= 0.004) continue;
      ctx.globalAlpha = ta;
      ctx.beginPath();
      ctx.moveTo(X(p.hx), Y(p.hy));
      ctx.lineTo(X(p.tx), Y(p.ty));
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;

    // Zone labels.
    var zoneFont = Math.max(9, S * 0.015);
    ctx.font = '600 ' + zoneFont + 'px "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = labelAlpha * (1 - iso);
    ctx.fillStyle = ZSTRUCT;
    ctx.fillText('STRUCTURED', X(0.135), Y(0.272));
    ctx.fillStyle = ZSTORED;
    ctx.fillText('STORED', X(0.5), Y(0.978));
    ctx.globalAlpha = labelAlpha;
    ctx.fillStyle = ZUNSTRUCT;
    ctx.fillText('UNSTRUCTURED', X(0.855), Y(0.208));
    ctx.globalAlpha = 1;

    // Points.
    var baseR = Math.max(1.5, S * 0.0042);
    for (i = 0; i < N; i++) {
      pos = pointPos(i, lt, t);
      var pt = points[i];
      var alpha = 0.92;
      if (iso > 0 && pt.zone !== 1) alpha *= (1 - 0.94 * iso);
      ctx.fillStyle = mixStr(BLUE_RGB, ZONE_RGB[pt.zone], pos.e, alpha);
      ctx.beginPath();
      ctx.arc(X(pos.x), Y(pos.y), baseR * pt.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Micro-labels beside the twelve large points.
    var labFont = Math.max(8, S * 0.0125);
    ctx.font = labFont + 'px "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive';
    ctx.fillStyle = INK;
    ctx.textBaseline = 'middle';
    for (i = 0; i < N; i++) {
      var lp = points[i];
      if (!lp.large) continue;
      pos = pointPos(i, lt, t);
      var la = 0.8;
      if (iso > 0 && lp.zone !== 1) la *= (1 - 0.94 * iso);
      var px = X(pos.x), py = Y(pos.y);
      var tw = ctx.measureText(lp.tag).width;
      var bx = pos.x > 0.78 ? px - 8 - tw : px + 8;
      // A small paper tag behind the label keeps it legible inside the dot field.
      ctx.globalAlpha = la * 0.72;
      ctx.fillStyle = PAPER;
      ctx.fillRect(bx - 2, py - labFont * 0.62, tw + 4, labFont * 1.24);
      ctx.globalAlpha = la;
      ctx.fillStyle = INK;
      if (pos.x > 0.78) { ctx.textAlign = 'right'; ctx.fillText(lp.tag, px - 8, py); }
      else { ctx.textAlign = 'left'; ctx.fillText(lp.tag, px + 8, py); }
    }
    ctx.globalAlpha = 1;

    // Perspective line.
    var perFont = Math.max(9, S * 0.016);
    ctx.font = perFont + 'px "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 0.78;
    ctx.fillStyle = INK;
    ctx.fillText('perspective: ' + PERSPECTIVES[perspectiveIdx], X(0.035), Y(0.052));
    ctx.globalAlpha = 1;
  }

  // ----- Audio: lazy, gesture-gated, typeof-guarded. Sound only, never drawn state. -----
  var AC = null, rustleGain = null, lastClickAt = 0, prevProg = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) { try { AC.resume(); } catch (e) {} } return; }
    try {
      var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext :
        ((typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null);
      if (!Ctor) return;
      AC = new Ctor();
      var len = AC.sampleRate * 1.5;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0);
      var r = rngSeeded(4141);
      for (var i = 0; i < len; i++) data[i] = r() * 2 - 1;
      var src = AC.createBufferSource();
      src.buffer = buf; src.loop = true;
      var filt = AC.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = 500;
      rustleGain = AC.createGain();
      rustleGain.gain.value = 0;
      src.connect(filt); filt.connect(rustleGain); rustleGain.connect(AC.destination);
      src.start();
    } catch (e) { AC = null; }
  }
  function pipetteClick(vol, freq) {
    if (!AC) return;
    try {
      var t0 = AC.currentTime;
      var o = AC.createOscillator();
      var g = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, t0);
      o.frequency.exponentialRampToValueAtTime(freq * 0.55, t0 + 0.045);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
      o.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0 + 0.06);
    } catch (e) {}
  }

  // ----- Interaction -----
  function toNorm(cx, cy) {
    var S = Math.min(viewW, viewH);
    return { x: (cx - (viewW - S) / 2) / S, y: (cy - (viewH - S) / 2) / S };
  }
  function onDown(e) {
    ensureAudio();
    var n = toNorm(e.clientX, e.clientY);
    pointerDown = { t: elapsed(), x: n.x, y: n.y, moved: false };
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!pointerDown) return;
    var n = toNorm(e.clientX, e.clientY);
    var dx = n.x - pointerDown.x, dy = n.y - pointerDown.y;
    if (Math.sqrt(dx * dx + dy * dy) > 0.012) pointerDown.moved = true;
    if (pointerDown.moved) {
      var t = elapsed();
      dragSamples.push({ t: t, x: n.x, y: n.y });
      if (dragSamples.length > 60) dragSamples.splice(0, dragSamples.length - 60);
      if (AC && t - lastClickAt > 0.07) { lastClickAt = t; pipetteClick(0.012, 2600); }
    }
  }
  function onUp(e) {
    if (!pointerDown) return;
    var t = elapsed();
    var wasDrag = pointerDown.moved;
    var downT = pointerDown.t;
    pointerDown = null;
    if (wasDrag) return;
    if (t - downT > 0.45) return;
    // A tap: pair it with a pending one to make a double-tap.
    if (pendingTap && t - pendingTap.t < 0.38) {
      pendingTap = null;
      isolateT0 = t;
    } else {
      var n = toNorm(e.clientX, e.clientY);
      pendingTap = { t: t, x: n.x, y: n.y };
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { pointerDown = null; });
  }

  // ----- Animation tick (audio side-effects live here, never in draw) -----
  function tick() {
    var t = elapsed();
    draw(t);
    if (AC) {
      var lt = ((t % LOOP) + LOOP) % LOOP;
      var gp = globalProgress(lt);
      // Pipette clicks: count points newly in transit.
      if (!prevProg) prevProg = new Float32Array(N);
      var moving = 0;
      var rank = orders[perspectiveIdx];
      for (var i = 0; i < N; i++) {
        var prog = clamp01(gp * 1.35 - rank[i] * 0.35);
        if (prog > 0.01 && prog < 0.99 && Math.abs(prog - prevProg[i]) > 0.0004) moving++;
        prevProg[i] = prog;
      }
      if (moving > 2 && t - lastClickAt > 0.09) {
        lastClickAt = t;
        pipetteClick(Math.min(0.05, 0.015 + moving * 0.0006), 1500 + (moving % 5) * 160);
      }
      // Paper rustle while the person re-gathers.
      if (rustleGain) {
        var target = (lt >= 70 && lt < 120) ? 0.012 : 0;
        try { rustleGain.gain.setTargetAtTime(target, AC.currentTime, 0.4); } catch (e) {}
      }
    }
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
  }

  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
</body>
</html>
