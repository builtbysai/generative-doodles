<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitter Black</title>
<style>
  html, body { margin: 0; padding: 0; background: #050506; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- Palette (strict) ----
  var FIELD = '#0A0A0C';       // black glitter field
  var GLINT = '#F4F1E8';       // warm white glints
  var AMBER = '#E8D9B8';       // amber cores / pool warmth
  var SQUARE = '#F5F4F0';      // flanking white squares
  var WALL = '#050506';        // deep shadow wall / page ground

  // ---- Seeded RNG: mulberry32 ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- Glints: precomputed seeded data (position in field units) ----
  var N_GLINTS = 5200;
  var glints = [];
  (function buildGlints() {
    var rnd = mulberry32(77000193);
    for (var i = 0; i < N_GLINTS; i++) {
      glints.push({
        u: rnd(),
        v: rnd(),
        size: 1 + rnd() * 2,            // 1..3 px at reference scale
        phase: rnd() * Math.PI * 2,
        freq: 0.5 + rnd() * 1.6,        // twinkle speed, rad/s
        warm: rnd(),                    // amber-core tendency
        flare: rnd() < 0.025            // a few get a tiny cross flare
      });
    }
  })();

  // ---- Viewport sizing (Visual Viewport API) ----
  var W = 0, H = 0;
  function measure() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 0);
    var h = vv ? vv.height : (window.innerHeight || 0);
    if (w > 0 && h > 0 && (w !== W || h !== H)) {
      W = w; H = h;
      canvas.width = W; canvas.height = H;
    }
  }
  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return H > W * 1.15;
  }

  // ---- Pool drift: closed-form lissajous, centred at t = 0 ----
  function driftPos(t) {
    var M = Math.min(W, H);
    return {
      x: W / 2 + 0.17 * M * Math.sin(t * Math.PI * 2 / 53),
      y: H / 2 + 0.14 * M * Math.sin(t * Math.PI * 2 / 37)
    };
  }

  // ---- Drag state (recorded events; offset is closed-form in t) ----
  var dragging = false;
  var dragX = 0, dragY = 0;       // current pointer position while dragging
  var grabDX = 0, grabDY = 0;     // poolPos - pointerPos at grab (no jump)
  var relT = -1, relOX = 0, relOY = 0; // released offset and its time

  function poolPos(t) {
    var d = driftPos(t);
    if (dragging) {
      return { x: dragX + grabDX, y: dragY + grabDY };
    }
    if (relT >= 0) {
      var k = Math.exp(-(t - relT) / 3.0); // ease back to the drift path
      if (k > 0.001) return { x: d.x + relOX * k, y: d.y + relOY * k };
    }
    return d;
  }

  var nowT = 0;
  function pointerPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: cx - r.left, y: cy - r.top };
  }
  function onDown(e) {
    var p = pointerPos(e);
    var pool = poolPos(nowT);
    dragging = true;
    dragX = p.x; dragY = p.y;
    grabDX = pool.x - p.x; grabDY = pool.y - p.y;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pointerPos(e);
    dragX = p.x; dragY = p.y;
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    var pool = poolPos(nowT), d = driftPos(nowT);
    relOX = pool.x - d.x; relOY = pool.y - d.y; relT = nowT;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
  }

  // ---- Draw one frame at time t (seconds). Frame one is draw(0). ----
  function draw(t) {
    measure();
    if (W <= 0 || H <= 0) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var phone = isPhone();
    var M = Math.min(W, H);

    // Wall / page ground
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    // Black field: centred square, ~75% of frame (a touch larger on phones)
    var side = (phone ? 0.78 : 0.75) * M;
    var fx = (W - side) / 2, fy = (H - side) / 2;
    ctx.fillStyle = FIELD;
    ctx.fillRect(fx, fy, side, side);

    var pool = poolPos(t);
    var R = 0.38 * M; // pool radius ~35% of frame

    ctx.save();
    ctx.beginPath();
    ctx.rect(fx, fy, side, side);
    ctx.clip();

    // Warm pool of light: many fine layered alpha discs, clipped to the
    // field. Kept faint: the pool is carried by the glints, this is haze.
    var layers = 18;
    for (var li = layers - 1; li >= 0; li--) {
      var lr = R * Math.pow((li + 1) / layers, 1.4);
      ctx.globalAlpha = 0.012;
      ctx.fillStyle = (li % 3 === 2) ? GLINT : AMBER;
      ctx.beginPath();
      ctx.arc(pool.x, pool.y, lr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Glints: brightness = 0.05 base + twinkle * pool proximity.
    // The twinkle is always scaled by the pool: no light, no sparkle.
    var scale = side / 720;
    for (var i = 0; i < N_GLINTS; i++) {
      var g = glints[i];
      var x = fx + g.u * side;
      var y = fy + g.v * side;
      var dx = x - pool.x, dy = y - pool.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var prox = 1 - dist / R;
      if (prox < 0) prox = 0;
      prox = Math.pow(prox, 1.6);
      var tw = 0.5 + 0.5 * Math.sin(g.phase + g.freq * t);
      var b = 0.05 + tw * prox;
      if (b <= 0.055 && prox === 0) {
        // Outside the pool: near-invisible, but the 0.05 base remains.
        ctx.globalAlpha = b;
        ctx.fillStyle = GLINT;
        ctx.fillRect(x, y, 1, 1);
        continue;
      }
      var s = Math.max(1, g.size * scale);
      ctx.globalAlpha = Math.min(1, b);
      ctx.fillStyle = GLINT;
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
      if (g.warm > 0.45) {
        var cs = Math.max(1, s * 0.55);
        ctx.globalAlpha = Math.min(1, b * 0.85);
        ctx.fillStyle = AMBER;
        ctx.fillRect(x - cs / 2, y - cs / 2, cs, cs);
      }
      if (g.flare && b > 0.72) {
        var fa = (b - 0.72) * 2.2;
        var fl = s + 2 * scale + 1;
        ctx.globalAlpha = Math.min(1, fa);
        ctx.fillStyle = GLINT;
        ctx.fillRect(x - fl, y - 0.5, fl * 2, 1);
        ctx.fillRect(x - 0.5, y - fl, 1, fl * 2);
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // Six white squares flanking the field, E-pattern: three per side
    var sq = 0.08 * M;
    var lx = (W - side) / 4 - sq / 2;
    var rx = W - (W - side) / 4 - sq / 2;
    var rows = [0.2, 0.5, 0.8];
    ctx.fillStyle = SQUARE;
    for (var ri = 0; ri < 3; ri++) {
      var sy = fy + side * rows[ri] - sq / 2;
      ctx.fillRect(lx, sy, sq, sq);
      ctx.fillRect(rx, sy, sq, sq);
    }
  }

  // ---- Run: synchronous first frame at t = 0, then rAF if available ----
  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var loop = function (ts) {
      if (t0 === null) t0 = ts;
      nowT = (ts - t0) / 1000;
      draw(nowT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  function onResize() { draw(nowT); }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', onResize);
  }
})();
</script>
</body>
</html>
