<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Anniversary Monument</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#000000';
var BLACK = '#000000';
var WHITE = '#ffffff';
var FRAME_T = 60.0; /* fixed phase: split, hairline and cropped type in place, line absent */
var CYCLE = 43200.0; /* seconds; 12 hours, the line's irregular cycle */
var DRAW_LEN = 60.0; /* seconds; one minute for the line to draw itself across */
/* fixed authored birth times inside each 12 h cycle; gaps 10800, 11100, 11700, 9600 s:
   irregular across hours, never a visible period */
var BIRTHS = [4200, 15000, 26100, 37800];
var LINE_Y = 0.36; /* the drawn line crosses the split at this height of the field */
var TYPE_LETTERS = 'RC'; /* fixed authored letters; the prompt names no letters */
var PLATE_INK = '#ffffff';
var PLATE_LINE = 'rgba(255,255,255,0.45)';
var HINT_INK = '#ffffff';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* line draw progress: 0..1 while a birth is drawing, -1 when the line is absent.
   Closed-form function of piece time; no state, no randomness. */
function lineProgress(t) {
  var tt = ((t % CYCLE) + CYCLE) % CYCLE;
  var i, b;
  for (i = 0; i < BIRTHS.length; i++) {
    b = BIRTHS[i];
    if (tt >= b && tt < b + DRAW_LEN) return (tt - b) / DRAW_LEN;
  }
  return -1;
}
function drawSplit() {
  var mid = F.x + F.w / 2;
  ctx.fillStyle = BLACK;
  ctx.fillRect(F.x, F.y, F.w / 2, F.h);
  ctx.fillStyle = WHITE;
  ctx.fillRect(mid, F.y, F.w - F.w / 2, F.h);
  /* hairline rule down the middle: a 2 px white stroke centred on the boundary */
  ctx.fillStyle = WHITE;
  ctx.fillRect(mid - 1, F.y, 2, F.h);
}
function drawType() {
  var S = Math.min(F.w, F.h);
  var text = '—' + TYPE_LETTERS;
  var px = Math.round(0.42 * S);
  var tx = F.x + 0.04 * F.w;
  var ty = F.y + 0.60 * F.h;
  var mid = F.x + F.w / 2;
  ctx.save();
  ctx.beginPath();
  ctx.rect(F.x, F.y, F.w, F.h);
  ctx.clip();
  ctx.font = 'bold ' + px + 'px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  /* white type over the black half */
  ctx.save();
  ctx.beginPath();
  ctx.rect(F.x, F.y, F.w / 2, F.h);
  ctx.clip();
  ctx.fillStyle = WHITE;
  ctx.fillText(text, tx, ty);
  ctx.restore();
  /* black type over the white half, so the glyph reads across the split */
  ctx.save();
  ctx.beginPath();
  ctx.rect(mid, F.y, F.w - F.w / 2, F.h);
  ctx.clip();
  ctx.fillStyle = BLACK;
  ctx.fillText(text, tx, ty);
  ctx.restore();
  ctx.restore();
}
function drawLine() {
  var p = lineProgress(phaseT);
  if (p < 0) return;
  var S = Math.min(F.w, F.h);
  var y = F.y + LINE_Y * F.h;
  var x0 = F.x;
  var x1 = F.x + p * F.w;
  var mid = F.x + F.w / 2;
  var lw = Math.max(2, 0.003 * S);
  ctx.lineWidth = lw;
  /* one stroke across the split; it inverts at the boundary so it stays
     visible on both halves while the palette stays black and white only */
  ctx.save();
  ctx.beginPath();
  ctx.rect(F.x, F.y, F.w / 2, F.h);
  ctx.clip();
  ctx.strokeStyle = WHITE;
  ctx.beginPath();
  ctx.moveTo(x0, y);
  ctx.lineTo(x1, y);
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.beginPath();
  ctx.rect(mid, F.y, F.w - F.w / 2, F.h);
  ctx.clip();
  ctx.strokeStyle = BLACK;
  ctx.beginPath();
  ctx.moveTo(x0, y);
  ctx.lineTo(x1, y);
  ctx.stroke();
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Anniversary Monument').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Anniversary Monument').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 21').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = BLACK;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Anniversary Monument', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 21', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = BLACK;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawSplit();
  drawType();
  drawLine();
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    lineProgress: function () { return lineProgress(phaseT); }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
