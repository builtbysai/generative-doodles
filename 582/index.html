<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Más Íntimo Que la Ropa Interior</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#EFE7D8; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- palette (strict, from the prompt) ---------- */
var WOOD = '#8A6A4A', WALL = '#EFE7D8', CREAM = '#F4EEDC', INK = '#1A1A1A';
var FAMILIES = [
  ['#C0392B', '#C93A72'],   /* reds */
  ['#2C5FA8', '#4A7AB8'],   /* blues */
  ['#E8B93C'],              /* yellows */
  ['#5A8A4A'],              /* greens */
  [CREAM, INK]              /* neutrals: paper-cream and ink */
];

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- color helpers ---------- */
function hexRGB(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mix(h1, h2, t){
  var a = hexRGB(h1), b = hexRGB(h2), i, out = '#';
  for (i = 0; i < 3; i++){ var v = Math.round(a[i] + (b[i] - a[i]) * t); out += ('0' + v.toString(16)).slice(-2); }
  return out;
}
function lum(h){ var c = hexRGB(h); return (0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2]) / 255; }
var WOOD_DARK = mix(WOOD, INK, 0.38), WOOD_MID = mix(WOOD, INK, 0.18), WOOD_LIT = mix(WOOD, CREAM, 0.22);

/* ---------- phone detection: window.screen physical size, aspect fallback only ---------- */
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
var isPhone;
if (scr && scr.width && scr.height) isPhone = Math.min(scr.width, scr.height) < 700;
else { var iw = (typeof window !== 'undefined' && window.innerWidth) || 1000, ih = (typeof window !== 'undefined' && window.innerHeight) || 1000; isPhone = ih > iw * 1.15 && Math.min(iw, ih) < 700; }

/* ---------- shelf geometry (stage 1000x1000) ---------- */
var CASE_X = isPhone ? 30 : 64, CASE_W = 1000 - CASE_X * 2;      /* outer silhouette */
var IN_L = isPhone ? 88 : 122, IN_R = 1000 - IN_L;               /* interior cavity */
var IN_T = 88, IN_B = 918, ROWS = 5, PITCH = (IN_B - IN_T) / ROWS; /* 166 */
var BOARD = 14;
function rowTop(r){ return IN_T + r * PITCH; }
function rowBase(r){ return rowTop(r) + PITCH - BOARD; }        /* where books stand */

/* ---------- the generative spine/cover recipe ---------- */
/* Every book is invented from its own seed stream: base tint, one of nine
   design grammars, one of nine motifs, an accent. A signature set with a
   deterministic re-roll guarantees no two books in the library repeat. */
var seenSig = {};
function makeRecipe(seed, famIdx, r){
  var salt = 0, rec, sig;
  do {
    var q = mulberry32(seed + salt * 131);
    var fam = FAMILIES[famIdx];
    var base = fam[Math.floor(q() * fam.length)];
    if (famIdx < 4 && q() < 0.14) base = q() < 0.6 ? CREAM : INK;          /* cream/ink guests inside a family band */
    if (famIdx === 4 && q() < 0.22) { var f2 = Math.floor(q() * 4); base = FAMILIES[f2][Math.floor(q() * FAMILIES[f2].length)]; }
    var tintPick = q(), tintAmt = tintPick < 0.5 ? 0 : (tintPick < 0.78 ? 0.22 : 0.45);
    base = mix(base, q() < 0.62 ? CREAM : INK, tintAmt);
    var accent;
    var ap = q();
    if (ap < 0.45) accent = lum(base) > 0.55 ? INK : CREAM;
    else if (ap < 0.75) accent = fam[Math.floor(q() * fam.length)];
    else { var f3 = Math.floor(q() * 5); accent = FAMILIES[f3][Math.floor(q() * FAMILIES[f3].length)]; }
    if (accent === base) accent = lum(base) > 0.55 ? INK : CREAM;
    rec = {
      base: base, accent: accent,
      design: Math.floor(q() * 9),          /* 0 bands, 1 stripes, 2 motif, 3 dots, 4 split, 5 frame, 6 diagonal, 7 dashes, 8 checker */
      motif: Math.floor(q() * 9),           /* circle, ring, diamond, triangle, sparkle, plus, half-disc, eye, crescent */
      p1: 2 + Math.floor(q() * 4),          /* bands/stripes/dashes count or dot rows */
      p2: q()                                 /* placement jitter */
    };
    sig = [rec.base, rec.design, rec.motif, rec.accent, rec.p1, Math.round(rec.p2 * 20)].join('|');
    salt++;
  } while (seenSig[sig]);
  seenSig[sig] = true;
  return rec;
}

/* ---------- build the library: five family-banded rows ---------- */
var books = [];
(function buildLibrary(){
  var idx = 0, r, i;
  for (r = 0; r < ROWS; r++){
    var rng = mulberry32(582100 + r * 977);
    var x = IN_L + 4, limit = IN_R - 4, base = rowBase(r);
    while (true){
      var w = 30 + rng() * 24;
      if (x + w > limit) break;
      var h = 116 + rng() * 32;
      books.push({ row: r, x: x, w: w, h: h, base: base, horiz: false, lean: 0,
                   rec: makeRecipe(582000 + idx * 7919, r, rng), out: 0, target: 0, _rect: null });
      idx++;
      x += w + 2 + rng() * 3;
    }
    /* one book per some rows leans into its neighbour gap */
    if (rng() < 0.55){
      for (i = books.length - 1; i >= 0; i--){
        if (books[i].row === r){ books[i].lean = 0.10 + rng() * 0.06; break; }
      }
    }
    /* leftover room at the row's end becomes a small flat stack, also invented books */
    var left = limit - x;
    if (left >= 46){
      var k = 2 + Math.floor(rng() * 2), sy = base, j;
      for (j = 0; j < k; j++){
        var sh = 15 + rng() * 4;
        sy -= sh;
        books.push({ row: r, x: x + 2, w: left - 4, h: sh, base: base, horiz: true, lean: 0, stackY: sy,
                     rec: makeRecipe(582000 + idx * 7919, r, rng), out: 0, target: 0, _rect: null });
        idx++; sy -= 2;
      }
    }
  }
  for (i = 0; i < books.length; i++){
    var b = books[i];
    b.coverW = Math.max(150, Math.min(320, b.w * (b.horiz ? 2.1 : 5.0)));
    b.coverH = b.horiz ? 178 : Math.max(150, Math.min(215, b.h * 1.42));
    b.cx = b.x + b.w / 2;
    b.anchor = b.horiz ? b.stackY + b.h : b.base;   /* the edge the pulled cover grows from */
  }
})();

/* ---------- precomputed paper speckle (seeded data, drawn directly) ---------- */
var speckles = [];
(function(){ var q = mulberry32(582555), i; for (i = 0; i < 220; i++) speckles.push({ x: q() * 1000, y: q() * 1000, r: 0.8 + q() * 1.3, a: 0.025 + q() * 0.05, g: q() < 0.5 }); })();

/* ---------- drawing helpers ---------- */
function handFont(size, weight){ return 'italic ' + (weight || 600) + ' ' + size + 'px "Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif'; }
function motifPath(type, cx, cy, r){
  var i, a;
  ctx.beginPath();
  if (type === 0){ ctx.arc(cx, cy, r, 0, Math.PI * 2); }
  else if (type === 1){ ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.moveTo(cx + r * 0.55, cy); ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2, true); }
  else if (type === 2){ ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy); ctx.closePath(); }
  else if (type === 3){ ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r * 0.9, cy + r * 0.8); ctx.lineTo(cx - r * 0.9, cy + r * 0.8); ctx.closePath(); }
  else if (type === 4){ for (i = 0; i < 4; i++){ a = i * Math.PI / 2; ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a - 0.32) * r, cy + Math.sin(a - 0.32) * r); ctx.lineTo(cx + Math.cos(a) * r * 1.25, cy + Math.sin(a) * r * 1.25); ctx.lineTo(cx + Math.cos(a + 0.32) * r, cy + Math.sin(a + 0.32) * r); ctx.closePath(); } }
  else if (type === 5){ var w2 = r * 0.34; ctx.rect(cx - w2, cy - r, w2 * 2, r * 2); ctx.rect(cx - r, cy - w2, r * 2, w2 * 2); }
  else if (type === 6){ ctx.arc(cx, cy, r, Math.PI, 0); ctx.closePath(); }
  else if (type === 7){ ctx.moveTo(cx - r, cy); ctx.quadraticCurveTo(cx, cy - r * 1.15, cx + r, cy); ctx.quadraticCurveTo(cx, cy + r * 0.8, cx - r, cy); ctx.closePath(); ctx.moveTo(cx + r * 0.32, cy); ctx.arc(cx, cy, r * 0.32, 0, Math.PI * 2, true); }
  else { ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.moveTo(cx + r * 1.05, cy - r * 0.45); ctx.arc(cx + r * 0.42, cy - r * 0.42, r * 0.82, 0, Math.PI * 2, true); }
}
/* one recipe, two readings: the narrow spine on the shelf, the full cover when pulled */
function drawDesign(rec, x, y, w, h, cover){
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = rec.base; ctx.fillRect(x, y, w, h);
  var A = rec.accent, u = Math.min(w, h);
  ctx.fillStyle = A; ctx.strokeStyle = A;
  if (rec.design === 0){
    var bh = Math.max(3, h * 0.055), i;
    for (i = 0; i < rec.p1 - 1; i++){ var by = y + h * (0.10 + i * 0.09); ctx.fillRect(x, by, w, bh); }
    ctx.fillRect(x, y + h * 0.86, w, bh);
  } else if (rec.design === 1){
    var sh = h * 0.5 / rec.p1, j;
    for (j = 0; j < rec.p1; j++) ctx.fillRect(x, y + h * 0.25 + j * (h * 0.5 / rec.p1) + sh * 0.25, w, sh * 0.5);
  } else if (rec.design === 2){
    ctx.fillRect(x, y + h * 0.08, w, Math.max(2, h * 0.03));
    motifPath(rec.motif, x + w / 2, y + h * (0.42 + rec.p2 * 0.16), u * (cover ? 0.30 : 0.34)); ctx.fill();
  } else if (rec.design === 3){
    var cols = Math.max(1, Math.floor(w / (cover ? 34 : 13))), rows = rec.p1 + 2, ci, ri;
    for (ri = 0; ri < rows; ri++) for (ci = 0; ci < cols; ci++){
      ctx.beginPath(); ctx.arc(x + (ci + 0.5) * (w / cols), y + (ri + 0.5) * (h / rows), Math.max(1.4, u * 0.055), 0, Math.PI * 2); ctx.fill();
    }
  } else if (rec.design === 4){
    ctx.fillRect(x + w * 0.55, y, w * 0.45, h);
    ctx.fillStyle = lum(rec.base) > 0.55 ? INK : CREAM; ctx.fillRect(x + w * 0.55 - 1, y, 2, h);
  } else if (rec.design === 5){
    var m = Math.max(3, w * 0.16);
    ctx.lineWidth = Math.max(2, u * 0.05); ctx.strokeRect(x + m, y + h * 0.09, w - m * 2, h * 0.82);
    motifPath(rec.motif, x + w / 2, y + h / 2, u * (cover ? 0.20 : 0.24)); ctx.fill();
  } else if (rec.design === 6){
    ctx.beginPath(); ctx.moveTo(x, y + h * 0.30); ctx.lineTo(x + w, y + h * 0.08); ctx.lineTo(x + w, y + h * 0.30); ctx.lineTo(x, y + h * 0.52); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w * (0.3 + rec.p2 * 0.4), y + h * 0.74, Math.max(1.6, u * 0.07), 0, Math.PI * 2); ctx.fill();
  } else if (rec.design === 7){
    var dl = lum(rec.base) > 0.55 ? INK : CREAM; ctx.fillStyle = dl;
    var n = rec.p1, di;
    for (di = 0; di < n; di++) ctx.fillRect(x + w * 0.16, y + h * (0.13 + di * 0.075), w * (0.68 - (di % 2) * 0.18), Math.max(2, h * 0.028));
    motifPath(rec.motif, x + w / 2, y + h * 0.68, u * (cover ? 0.17 : 0.22)); ctx.fill();
  } else {
    var cr = 3 + (rec.p1 % 2), cc = Math.max(2, Math.floor(w / (cover ? 52 : 16))), cx2, cy2;
    var cw = w * 0.84 / cc, chh = h * 0.44 / cr;
    for (cy2 = 0; cy2 < cr; cy2++) for (cx2 = 0; cx2 < cc; cx2++){
      if ((cx2 + cy2) % 2 === 0) ctx.fillRect(x + w * 0.08 + cx2 * cw, y + h * 0.28 + cy2 * chh, cw, chh);
    }
  }
  ctx.restore();
  ctx.save(); ctx.strokeStyle = 'rgba(26,26,26,0.35)'; ctx.lineWidth = 1.4; ctx.strokeRect(x + 0.7, y + 0.7, w - 1.4, h - 1.4); ctx.restore();
}
function drawSpine(b){
  var top = b.horiz ? b.stackY : b.base - b.h;
  ctx.save();
  if (b.lean && b.out <= 0.01){
    ctx.translate(b.cx, b.base); ctx.rotate(b.lean); ctx.translate(-b.cx, -b.base);
  }
  drawDesign(b.rec, b.x, top, b.w, b.h, false);
  ctx.fillStyle = 'rgba(26,26,26,0.16)'; ctx.fillRect(b.x, top, 2.4, b.h);
  ctx.fillStyle = 'rgba(244,238,220,0.20)'; ctx.fillRect(b.x + b.w - 2.4, top, 2.4, b.h);
  ctx.restore();
  b._rect = { x: b.x, y: top, w: b.w, h: b.h };
}
function drawPulled(b){
  var o = b.out, ease = o * o * (3 - 2 * o);
  /* the empty slot it left behind */
  ctx.fillStyle = 'rgba(26,26,26,0.30)';
  if (b.horiz) ctx.fillRect(b.x, b.stackY, b.w, b.h); else ctx.fillRect(b.x, b.base - b.h, b.w, b.h);
  var curW = b.w + (b.coverW - b.w) * ease, curH = b.h + (b.coverH - b.h) * ease;
  var cx = Math.max(24 + curW / 2, Math.min(976 - curW / 2, b.cx));
  var x = cx - curW / 2, top = b.anchor - curH;
  ctx.fillStyle = 'rgba(26,26,26,' + (0.22 * ease).toFixed(3) + ')';
  ctx.fillRect(x + 10 * ease, top + 10 * ease, curW, curH);
  var pagesW = curW * 0.07 * ease;
  drawDesign(b.rec, x, top, curW - pagesW, curH, true);
  if (pagesW > 2){
    ctx.fillStyle = CREAM; ctx.fillRect(x + curW - pagesW, top, pagesW, curH);
    ctx.strokeStyle = 'rgba(26,26,26,0.30)'; ctx.lineWidth = 1;
    var i; for (i = 1; i < 5; i++){ ctx.beginPath(); ctx.moveTo(x + curW - pagesW, top + curH * i / 5); ctx.lineTo(x + curW, top + curH * i / 5); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(26,26,26,0.35)'; ctx.strokeRect(x + curW - pagesW, top, pagesW, curH);
  }
  b._rect = { x: x, y: top, w: curW, h: curH };
}
function drawShelf(){
  /* outer case with a slightly narrower crown: the frontal hint of perspective */
  ctx.fillStyle = WOOD;
  ctx.beginPath();
  ctx.moveTo(CASE_X + 14, 40); ctx.lineTo(1000 - CASE_X - 14, 40);
  ctx.lineTo(1000 - CASE_X, IN_B + 34); ctx.lineTo(CASE_X, IN_B + 34); ctx.closePath(); ctx.fill();
  ctx.fillStyle = WOOD_DARK; ctx.fillRect(CASE_X, IN_B + 30, CASE_W, 10);
  /* cavity back */
  ctx.fillStyle = WOOD_DARK; ctx.fillRect(IN_L - 10, IN_T - 12, IN_R - IN_L + 20, IN_B - IN_T + 24);
  var r, i;
  for (r = 0; r < ROWS; r++){
    var top = rowTop(r), base = rowBase(r);
    ctx.fillStyle = 'rgba(26,26,26,0.13)'; ctx.fillRect(IN_L - 10, top - 2, IN_R - IN_L + 20, 12);   /* row shadow line */
    for (i = 0; i < books.length; i++) if (books[i].row === r && books[i].out <= 0.01) drawSpine(books[i]);
    /* shelf board */
    ctx.fillStyle = WOOD; ctx.fillRect(IN_L - 12, base, IN_R - IN_L + 24, BOARD);
    ctx.fillStyle = WOOD_LIT; ctx.fillRect(IN_L - 12, base, IN_R - IN_L + 24, 3);
    ctx.fillStyle = WOOD_MID; ctx.fillRect(IN_L - 12, base + BOARD - 3, IN_R - IN_L + 24, 3);
  }
  /* side posts + crown face over the cavity edges */
  ctx.fillStyle = WOOD;
  ctx.fillRect(IN_L - 34, IN_T - 34, 24, IN_B - IN_T + 68);
  ctx.fillRect(IN_R + 10, IN_T - 34, 24, IN_B - IN_T + 68);
  ctx.fillRect(IN_L - 34, IN_T - 34, IN_R - IN_L + 68, 22);
  ctx.fillStyle = WOOD_LIT; ctx.fillRect(IN_L - 34, IN_T - 34, IN_R - IN_L + 68, 3);
  for (i = 0; i < books.length; i++) if (books[i].out > 0.01) drawPulled(books[i]);
}

/* ---------- state ---------- */
var curT = 0, lastT = 0;
function tick(t){
  var dt = Math.min(0.05, Math.max(0, t - lastT)); lastT = t; curT = t;
  var i;
  for (i = 0; i < books.length; i++){
    var b = books[i];
    if (drag && drag.book === b) continue;
    if (b.out !== b.target){
      var k = 1 - Math.exp(-dt * 9);
      b.out += (b.target - b.out) * k;
      if (Math.abs(b.target - b.out) < 0.005) b.out = b.target;
    }
  }
}

/* ---------- sizing (Visual Viewport API) ---------- */
var viewW = 300, viewH = 300, dpr = 1;
function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = WALL; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var s = Math.min(viewW / 1000, viewH / 1000);
  var ox = (viewW - 1000 * s) / 2, oy = (viewH - 1000 * s) / 2;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
  var i;
  for (i = 0; i < speckles.length; i++){ var sp = speckles[i]; ctx.save(); ctx.globalAlpha = sp.a; ctx.fillStyle = sp.g ? WOOD : INK; ctx.fillRect(sp.x, sp.y, sp.r, sp.r); ctx.restore(); }
  drawShelf();
  ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = INK; ctx.font = handFont(20, 600);
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillText('drag · tap', 972, 978); ctx.restore();
}

/* ---------- interaction: drag a book out toward you; tap a pulled book to hold it; tap again to reshelve ---------- */
function toStage(e){
  var r = { left: 0, top: 0 };
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var s = Math.min(viewW / 1000, viewH / 1000);
  return { x: ((e.clientX - r.left) - (viewW - 1000 * s) / 2) / s, y: ((e.clientY - r.top) - (viewH - 1000 * s) / 2) / s };
}
function hitBook(p){
  var i;
  for (i = books.length - 1; i >= 0; i--){ var b = books[i]; if (b.out > 0.5 && b._rect && p.x >= b._rect.x && p.x <= b._rect.x + b._rect.w && p.y >= b._rect.y && p.y <= b._rect.y + b._rect.h) return b; }
  for (i = books.length - 1; i >= 0; i--){ var c = books[i]; if (c._rect && p.x >= c._rect.x && p.x <= c._rect.x + c._rect.w && p.y >= c._rect.y && p.y <= c._rect.y + c._rect.h) return c; }
  return null;
}
var drag = null;
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e), b = hitBook(p), i;
  if (b){ for (i = 0; i < books.length; i++) if (books[i] !== b && books[i].target === 1) books[i].target = 0; }
  drag = { book: b, x: p.x, y: p.y, moved: false, wasHeld: b ? b.target === 1 : false, startOut: b ? b.out : 0 };
});
canvas.addEventListener('pointermove', function(e){
  if (!drag || !drag.book) return;
  var p = toStage(e), d = Math.hypot(p.x - drag.x, p.y - drag.y);
  if (d > 7) drag.moved = true;
  if (drag.moved) drag.book.out = Math.max(0, Math.min(1, drag.startOut + (d - 7) / 130));
  draw();
});
function endPointer(){
  if (!drag) return;
  var b = drag.book, wasDrag = drag.moved, wasHeld = drag.wasHeld;
  drag = null;
  if (!b){ var i; for (i = 0; i < books.length; i++) books[i].target = 0; draw(); return; }  /* tap on the wall reshelves */
  if (!wasDrag){ b.target = wasHeld ? 0 : 1; }
  else if (!wasHeld){ b.target = b.out >= 0.55 ? 1 : 0; }
  else { b.target = b.out <= 0.3 ? 0 : 1; }
  draw();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ drag = null; });
if (typeof window !== 'undefined') window.addEventListener('pointerup', function(){ drag = null; });

/* ---------- go: synchronous first frame at rest, then the loop ---------- */
resize();
var baseTs = null;
function loop(ts){
  if (baseTs === null){ baseTs = ts; lastT = 0; curT = 0; }
  tick((ts - baseTs) / 1000);
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
</script>
</body>
</html>
