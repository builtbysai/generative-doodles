<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Flag Held, Not Waved</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0d10; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- sizing (Visual Viewport API, pinned canvas) ----------
  var W = 720, H = 720;
  function size() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 720; h = 720; }
    if (w !== W || h !== H) { W = w; H = h; canvas.width = w; canvas.height = h; }
  }
  function isPhone() {
    if (typeof window !== 'undefined' && window.screen && window.screen.width) {
      if (Math.min(window.screen.width, window.screen.height) < 700) return true;
    }
    return H > W * 1.15;
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
    if (window.addEventListener) window.addEventListener('resize', size);
  }
  size();

  // ---------- seeded PRNG (mulberry32), never unseeded randomness ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1528000);

  // ---------- palette ----------
  var FIELD = '#0e0d10', TOWER = '#232028', MARK = '#b9b2a4';
  // Silhouette = the mark colour at flat low alpha: dim against the field,
  // clearly darker than a lit mark, never invisible. (Thin lines in the
  // tower colour #232028 vanish against #0e0d10; the silhouette treatment
  // is a dimming, not a second colour.)
  var SIL = 'rgba(185,178,164,0.3800)';
  var FLAG = '#c23b2a', PLAT = '#3a3540';
  var POOL_RGB = '232,176,75';

  // ---------- towers: one row, flat rects, no windows ----------
  var towers = [];
  (function () {
    var n = 9, gap = 0.012, x0 = 0.04, span = 0.92;
    var tw = (span - gap * (n - 1)) / n;
    for (var i = 0; i < n; i++) {
      towers.push({ x: x0 + i * (tw + gap), w: tw, top: 0.14 + rand() * 0.18 });
    }
  })();

  // ---------- figure-marks: torso + 2 arms + 2 legs, no heads ----------
  // Pose params per mark: lean, armL, armR (angle from straight-down, +outward),
  // legL, legR, crouch (0..1), sx (x-scale: 1 front, <1 half-turned).
  // Mark 0 = platform + flag arm; 1 = crouching; 2 = half-turned; 3 = arms out; 4 = standing.
  var POSES = [
    [ // pose 0: the described tableau
      { lean: 0.05, aL: 0.30, aR: 2.98, lL: 0.15, lR: -0.15, crouch: 0, sx: 1 },
      { lean: 0.25, aL: 0.50, aR: 0.40, lL: 0.60, lR: -0.60, crouch: 0.80, sx: 1 },
      { lean: -0.10, aL: 0.20, aR: 0.90, lL: 0.10, lR: -0.10, crouch: 0, sx: 0.55 },
      { lean: 0, aL: 1.5708, aR: 1.5708, lL: 0.12, lR: -0.12, crouch: 0, sx: 1 },
      { lean: 0.02, aL: 0.15, aR: 0.20, lL: 0.10, lR: -0.10, crouch: 0, sx: 1 }
    ],
    [ // pose 1: second frozen tableau
      { lean: -0.05, aL: 0.20, aR: 2.51, lL: 0.10, lR: -0.20, crouch: 0, sx: 1 },
      { lean: 0.10, aL: 2.80, aR: 0.30, lL: 0.30, lR: -0.30, crouch: 0.30, sx: 1 },
      { lean: 0.15, aL: 0.90, aR: 0.20, lL: -0.10, lR: 0.10, crouch: 0, sx: 0.55 },
      { lean: 0, aL: 1.5708, aR: 0.25, lL: 0.12, lR: -0.12, crouch: 0, sx: 1 },
      { lean: -0.03, aL: -0.60, aR: -0.60, lL: 0.10, lR: -0.10, crouch: 0, sx: 1 }
    ],
    [ // pose 2: third frozen tableau
      { lean: 0.10, aL: 0.35, aR: 3.1416, lL: 0.20, lR: -0.10, crouch: 0, sx: 1 },
      { lean: 0.30, aL: 0.60, aR: 0.55, lL: -0.60, lR: 0.60, crouch: 0.85, sx: 1 },
      { lean: 0, aL: 1.20, aR: 1.20, lL: 0.10, lR: -0.10, crouch: 0, sx: 1 },
      { lean: 0, aL: 3.1416, aR: 3.1416, lL: 0.12, lR: -0.12, crouch: 0, sx: 1 },
      { lean: 0.05, aL: 2.90, aR: 0.20, lL: 0.10, lR: -0.10, crouch: 0, sx: 1 }
    ]
  ];
  var HOLD = 7, LOOP = 21;
  var MARK_X = [0.30, 0.41, 0.52, 0.63, 0.74];
  var GROUND = 0.80;

  // ---------- interaction state: closed-form over recorded events ----------
  var lastT = 0;
  var earlyEvents = [[], [], [], [], []]; // per-mark list of piece times
  var sessions = []; // pool drag sessions
  var curSession = null;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function loopU(t) { var u = t % LOOP; if (u < 0) u += LOOP; return u; }

  function basePool(u) {
    return {
      x: 0.68 + 0.05 * Math.sin(2 * Math.PI * u / LOOP),
      y: 0.74 + 0.03 * Math.cos(2 * Math.PI * u / LOOP)
    };
  }
  // Displayed pool centre in fractions, as a pure function of t + drag log.
  function poolCenter(t) {
    var u = loopU(t), base = basePool(u);
    var s = null;
    for (var i = 0; i < sessions.length; i++) { if (sessions[i].start <= t) s = sessions[i]; }
    if (!s) return { x: base.x, y: base.y };
    if (!s.end || t <= s.end.t) {
      var mx = s.grabX, my = s.grabY;
      for (var j = 0; j < s.moves.length; j++) {
        if (s.moves[j].t <= t) { mx = s.moves[j].x; my = s.moves[j].y; }
      }
      return {
        x: clamp(s.grabCX + (mx - s.grabX), 0.08, 0.92),
        y: clamp(s.grabCY + (my - s.grabY), 0.08, 0.92)
      };
    }
    var bEnd = basePool(loopU(s.end.t));
    return {
      x: clamp(base.x + (s.end.cx - bEnd.x), 0.08, 0.92),
      y: clamp(base.y + (s.end.cy - bEnd.y), 0.08, 0.92)
    };
  }
  function markPose(i, t) {
    var u = loopU(t), g = Math.floor(u / HOLD) % 3;
    var holdStart = t - (u - Math.floor(u / HOLD) * HOLD);
    var evs = earlyEvents[i];
    for (var k = evs.length - 1; k >= 0; k--) {
      if (evs[k] > holdStart && evs[k] <= t) return (g + 1) % 3;
    }
    return g;
  }

  function toFrac(e) { return { x: e.clientX / W, y: e.clientY / H }; }

  function onDown(e) {
    size();
    var f = toFrac(e);
    var U = Math.min(W, H);
    // Marks first: nearest mark within hit radius gets an early pose nudge.
    var best = -1, bestD = 1e9;
    for (var i = 0; i < 5; i++) {
      var mx = MARK_X[i] * W, my = GROUND * H - 0.12 * U;
      var d = Math.hypot(f.x * W - mx, f.y * H - my);
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0 && bestD < 0.10 * U) {
      earlyEvents[best].push(lastT);
      if (e.preventDefault) e.preventDefault();
      return;
    }
    // Else inside the light pool: start a pool drag.
    var pc = poolCenter(lastT);
    var px = pc.x * W, py = pc.y * H, pr = 0.36 * U;
    if (Math.hypot(f.x * W - px, f.y * H - py) < pr * 1.15) {
      curSession = { start: lastT, grabX: f.x, grabY: f.y, grabCX: pc.x, grabCY: pc.y, moves: [], end: null };
      sessions.push(curSession);
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (curSession) { var f = toFrac(e); curSession.moves.push({ t: lastT, x: f.x, y: f.y }); }
  }
  function onUp() {
    if (curSession) {
      var pc = poolCenter(lastT);
      curSession.end = { t: lastT, cx: pc.x, cy: pc.y };
      curSession = null;
    }
  }
  canvas.addEventListener('pointerdown', onDown);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  function draw(t) {
    size();
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var U = Math.min(W, H);
    var u = loopU(t), g = Math.floor(u / HOLD) % 3;
    var pc = poolCenter(t);
    var pcx = pc.x * W, pcy = pc.y * H, pr = 0.36 * U;
    var legLen = 0.12 * U, torsoLen = 0.10 * U, armLen = 0.085 * U;
    var groundY = GROUND * H;
    var lineW = Math.max(2, U * 0.008);

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    // Towers across the upper third.
    ctx.fillStyle = TOWER;
    for (var i = 0; i < towers.length; i++) {
      var tw = towers[i];
      ctx.fillRect(tw.x * W, tw.top * H, tw.w * W, 0.35 * H - tw.top * H);
    }

    // Ground line + platform under mark 0.
    ctx.strokeStyle = TOWER;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0.06 * W, groundY);
    ctx.lineTo(0.94 * W, groundY);
    ctx.stroke();
    var platW = 0.11 * W, platH = 0.028 * H, platX = MARK_X[0] * W - platW / 2;
    ctx.fillStyle = TOWER;
    ctx.fillRect(platX, groundY - platH, platW, platH);
    ctx.strokeStyle = PLAT;
    ctx.beginPath();
    ctx.moveTo(platX, groundY - platH);
    ctx.lineTo(platX + platW, groundY - platH);
    ctx.stroke();

    // Light pool: layered flat-alpha discs, never a smooth blend.
    var discs = [[1, 0.04], [0.72, 0.06], [0.45, 0.08]];
    for (var d = 0; d < discs.length; d++) {
      ctx.fillStyle = 'rgba(' + POOL_RGB + ',' + discs[d][1].toFixed(4) + ')';
      ctx.beginPath();
      ctx.moveTo(pcx + discs[d][0] * pr, pcy);
      ctx.arc(pcx, pcy, discs[d][0] * pr, 0, 2 * Math.PI);
      ctx.fill();
    }

    // Figure-marks.
    ctx.lineCap = 'round';
    ctx.lineWidth = lineW;
    var hookMarks = [];
    for (var m = 0; m < 5; m++) {
      var p = POSES[markPose(m, t)][m];
      var mx = MARK_X[m] * W;
      var feetY = groundY - (m === 0 ? platH : 0);
      var ll = legLen * (1 - p.crouch * 0.35);
      var hipY = feetY - ll;
      var hipX = mx;
      var shX = hipX + Math.sin(p.lean) * torsoLen * p.sx;
      var shY = hipY - Math.cos(p.lean) * torsoLen * (1 - p.crouch * 0.2);
      var midX = (hipX + shX) / 2, midY = (hipY + shY) / 2;
      var lit = Math.hypot(midX - pcx, midY - pcy) < 0.8 * pr;
      ctx.strokeStyle = lit ? MARK : SIL;
      ctx.beginPath();
      // Torso.
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(shX, shY);
      // Arms from shoulder: angle from straight-down, outward.
      ctx.moveTo(shX, shY);
      ctx.lineTo(shX - Math.sin(p.aL) * armLen * p.sx, shY + Math.cos(p.aL) * armLen);
      ctx.moveTo(shX, shY);
      ctx.lineTo(shX + Math.sin(p.aR) * armLen * p.sx, shY + Math.cos(p.aR) * armLen);
      // Legs from hip.
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(hipX - Math.sin(p.lL) * ll * p.sx, hipY + Math.cos(p.lL) * ll);
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(hipX + Math.sin(p.lR) * ll * p.sx, hipY + Math.cos(p.lR) * ll);
      ctx.stroke();
      // Flag: small bright rectangle at mark 0's raised right hand.
      if (m === 0) {
        var hx = shX + Math.sin(p.aR) * armLen * p.sx;
        var hy = shY + Math.cos(p.aR) * armLen;
        ctx.fillStyle = FLAG;
        ctx.fillRect(hx - 0.0225 * U, hy - 0.030 * U, 0.045 * U, 0.060 * U);
      }
      hookMarks.push({ x: mx, y: midY, pose: markPose(m, t), lit: lit });
    }

    if (typeof window !== 'undefined') {
      window.__t28 = {
        pool: { x: pcx, y: pcy, r: pr },
        globalPose: g, loop: LOOP, marks: hookMarks
      };
    }
  }

  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    draw((ts - startT) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
