<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Knot</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#B8C4BC; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  // Palette: exactly the prompt colors. Back stems use the thorn-tip dark
  // green (a palette color) for depth; grain uses palette colors at alpha.
  var GROUND = '#B8C4BC';  // sage field
  var STEM   = '#4E6B3A';  // vine green stems
  var DARK   = '#33482A';  // thorn tips, back stems, grain shadow
  var ROSE   = '#D61F26';  // the few red roses
  var DRESS  = '#D9A03F';  // mustard dress
  var COLLAR = '#F5F0E4';  // white peter-pan collar
  var HAIR   = '#3B2A24';  // dark brown hair, also the closed-eye strokes
  var SKIN   = '#EBC9A8';  // skin

  // Seeded RNG (mulberry32). Every layout in the piece derives from it, so
  // every load and every QA render agree byte for byte.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Scene state.
  // tight: 0 loose .. 1 tight, clamped to [0.08, 0.92]: the knot never
  // fully untangles and never fully strangles. Starts mid at 0.45.
  var tight = 0.45, tightTarget = 0.45;
  var dragging = false;
  var knotSeed = 473;              // tap reseeds: knotSeed += 1
  var stems = [], roses = [], grain = [];

  // Geometry, all derived from the frame so phones and desktops agree in
  // proportion. The knot is sized from H (not from min(W,H)) so it still
  // towers on a tall narrow phone.
  function knotCenter() { return { x: W * 0.5, y: H * 0.655 }; }
  function knotRx() { return Math.min(W * 0.40, H * 0.46); }
  function knotRy() { return H * 0.27; }
  function womanFeetY() { return H * 0.93; }
  function womanH() { return H * 0.35; }
  // The clear zone the knot may never enter: an ellipse enclosing the
  // woman's whole silhouette (dress, arms, legs) with a small margin.
  function clearZone() {
    return { x: W * 0.5, y: H * 0.755, rx: H * 0.115, ry: H * 0.20 };
  }

  function buildKnot(seed) {
    var rng = mulberry32(seed);
    stems = []; roses = [];
    var N = 14;
    for (var i = 0; i < N; i++) {
      var arc = i >= 10;           // last four are open arcs, rest loops
      var st = {
        baseR: 0.60 + rng() * 0.38,
        startA: rng() * Math.PI * 2,
        dir: rng() < 0.5 ? 1 : -1,
        sweep: arc ? (3.4 + rng() * 1.2) : (5.6 + rng() * 1.0),
        a1: 0.15 + rng() * 0.16, f1: 2 + Math.floor(rng() * 2), p1: rng() * 6.28,
        a2: 0.07 + rng() * 0.10, f2: 4 + Math.floor(rng() * 3), p2: rng() * 6.28,
        hug: 1.05 + rng() * 0.13,          // how close this stem may wrap her
        hugVar: 0.04 + rng() * 0.07,       // and how much that varies along it
        wdt: 0.0055 + rng() * 0.0055,
        back: i < 7,               // first seven pass behind the woman
        swayP: rng() * 6.28,
        thorns: []
      };
      var ts = 0.03 + rng() * 0.04;
      while (ts < 0.98) { st.thorns.push(ts); ts += 0.055 + rng() * 0.05; }
      stems.push(st);
    }
    // A few roses, each pinned to a seeded point on a seeded stem.
    for (var k = 0; k < 7; k++) {
      roses.push({
        stem: Math.floor(rng() * N),
        s: 0.15 + rng() * 0.7,
        size: 0.016 + rng() * 0.009
      });
    }
    // Soft procedural grain: a precomputed seeded dot array, drawn
    // identically every frame. Fractions, so it survives resize.
    grain = [];
    var GN = 750;
    for (var g = 0; g < GN; g++) {
      grain.push({
        x: rng(), y: rng(),
        r: 0.6 + rng() * 1.3,
        light: rng() < 0.5,
        a: 0.025 + rng() * 0.03
      });
    }
  }

  // One point on a stem at parameter s. The path is a curling loop (or
  // arc) around the knot center whose radius breathes through two seeded
  // harmonics, so stems wander between hugging the woman and flaring to
  // the edge of the mass: that wandering is what makes it read as a knot
  // rather than a ring or a bush. Sway, tightness, and the clear-zone
  // projection are applied in that order.
  function stemPoint(st, s, phase) {
    var C = knotCenter();
    var ang = st.startA + st.dir * st.sweep * s;
    var rad = st.baseR * (1
      + st.a1 * Math.sin(6.2832 * st.f1 * s + st.p1)
      + st.a2 * Math.sin(6.2832 * st.f2 * s + st.p2));
    if (rad < 0.36) rad = 0.36;
    if (rad > 1.08) rad = 1.08;
    var px = C.x + Math.cos(ang) * rad * knotRx();
    var py = C.y + Math.sin(ang) * rad * knotRy();
    // Tightness: drag the whole tangle toward or away from the center.
    var ts = 1.10 - 0.28 * tight;
    px = C.x + (px - C.x) * ts;
    py = C.y + (py - C.y) * ts;
    // Breathing sway: a small rotation about the knot center plus a
    // radial swell, 6s period, per-stem phase.
    var sw = Math.sin(6.2832 * phase / 6 + st.swayP);
    var ca = Math.cos(sw * 0.012), sa = Math.sin(sw * 0.012);
    var dx = px - C.x, dy = py - C.y;
    var swell = 1 + 0.01 * Math.sin(6.2832 * phase / 6 + st.swayP * 1.7);
    px = C.x + (dx * ca - dy * sa) * swell;
    py = C.y + (dx * sa + dy * ca) * swell;
    // Clear zone: project out of the ellipse around the woman, but to a
    // target that varies per stem and along the stem, so wrapping stems
    // hug her at uneven distances and never form a clean oval, and never
    // touch her.
    var Z = clearZone();
    var ex = (px - Z.x) / Z.rx, ey = (py - Z.y) / Z.ry;
    var e = Math.sqrt(ex * ex + ey * ey);
    if (e < 1 && e > 0.0001) {
      var f = st.hug + st.hugVar * Math.sin(6.2832 * 3 * s + st.p1);
      if (f < 1.03) f = 1.03;
      px = Z.x + (px - Z.x) / e * f;
      py = Z.y + (py - Z.y) / e * f;
    }
    return { x: px, y: py };
  }

  function stemPath(st, phase) {
    var SEG = 120;
    var pts = [];
    for (var i = 0; i <= SEG; i++) pts.push(stemPoint(st, i / SEG, phase));
    return pts;
  }

  function tracePath(pts) {
    var SEG = pts.length - 1;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var j = 1; j < SEG; j++) {
      var mx = (pts[j].x + pts[j + 1].x) / 2, my = (pts[j].y + pts[j + 1].y) / 2;
      ctx.quadraticCurveTo(pts[j].x, pts[j].y, mx, my);
    }
    ctx.lineTo(pts[SEG].x, pts[SEG].y);
  }

  function drawStem(st, phase) {
    var U = Math.min(W, H);
    var pts = stemPath(st, phase);
    var lw = Math.max(1.2, st.wdt * U);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (!st.back) {
      // Weave: front stems first cut a thin sage halo through whatever
      // lies beneath, so crossings read as over and under, not as a blob.
      ctx.strokeStyle = GROUND;
      ctx.lineWidth = lw + Math.max(2.5, U * 0.006);
      tracePath(pts); ctx.stroke();
    }
    ctx.strokeStyle = st.back ? DARK : STEM;
    ctx.lineWidth = lw;
    tracePath(pts); ctx.stroke();
    // Thorns: small dark triangles at the stem's seeded stations. Each
    // starts perpendicular to the stem on its outward side and rotates
    // toward the center as the knot tightens: they angle inward, but the
    // clear zone keeps them off her.
    var C = knotCenter();
    ctx.fillStyle = DARK;
    for (var k = 0; k < st.thorns.length; k++) {
      var idx = Math.round(st.thorns[k] * (pts.length - 1));
      if (idx < 1 || idx >= pts.length - 1) continue;
      var p = pts[idx];
      var tx = pts[idx + 1].x - pts[idx - 1].x, ty = pts[idx + 1].y - pts[idx - 1].y;
      var ta = Math.atan2(ty, tx);
      var ra = Math.atan2(p.y - C.y, p.x - C.x);
      var perp = ta + Math.PI / 2;
      if (Math.cos(perp - ra) < 0) perp -= Math.PI;      // outward side
      var inward = ra + Math.PI;
      var d = inward - perp;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      var fa = perp + d * tight * 0.85;
      var len = U * 0.017, hw = U * 0.0075;
      var tipX = p.x + Math.cos(fa) * len, tipY = p.y + Math.sin(fa) * len;
      var bx = Math.cos(fa + Math.PI / 2) * hw, by = Math.sin(fa + Math.PI / 2) * hw;
      ctx.beginPath();
      ctx.moveTo(p.x + bx, p.y + by);
      ctx.lineTo(p.x - bx, p.y - by);
      ctx.lineTo(tipX, tipY);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawRose(ro, phase) {
    var U = Math.min(W, H);
    var p = stemPoint(stems[ro.stem], ro.s, phase);
    var bloom = 0.70 + 0.50 * (1 - tight);       // loosened knot: roses open
    var r = ro.size * U * bloom;
    ctx.fillStyle = ROSE;
    ctx.globalAlpha = 0.88;
    for (var k = 0; k < 5; k++) {                // outer petal bumps
      var a = k * 1.2566 + ro.s * 9.0;
      ctx.beginPath();
      ctx.arc(p.x + Math.cos(a) * r * 0.48, p.y + Math.sin(a) * r * 0.48, r * 0.52, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.beginPath();                             // heart of the rose
    ctx.arc(p.x, p.y, r * 0.58, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = DARK;                      // a hint of spiral, at alpha
    ctx.globalAlpha = 0.20;
    ctx.lineWidth = Math.max(1, r * 0.16);
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 0.30, ro.s * 7.0, ro.s * 7.0 + 4.2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }

  // The recurring woman: dark brown hair, closed eyes, mustard dress with
  // a white peter-pan collar, arms at her sides, perfectly calm. Drawn
  // from feetY up; wh is her full height (35% of frame height).
  function drawWoman(cx, feetY, wh) {
    var headR = wh * 0.105;
    var headCy = feetY - wh + headR * 1.05;
    var shoulderY = feetY - wh * 0.78;
    var hemY = feetY - wh * 0.16;
    // Legs and feet (skin).
    ctx.strokeStyle = SKIN;
    ctx.lineCap = 'round';
    ctx.lineWidth = wh * 0.058;
    ctx.beginPath();
    ctx.moveTo(cx - wh * 0.085, hemY); ctx.lineTo(cx - wh * 0.085, feetY - wh * 0.02);
    ctx.moveTo(cx + wh * 0.085, hemY); ctx.lineTo(cx + wh * 0.085, feetY - wh * 0.02);
    ctx.stroke();
    ctx.fillStyle = SKIN;
    ctx.beginPath(); ctx.ellipse(cx - wh * 0.075, feetY - wh * 0.012, wh * 0.052, wh * 0.02, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + wh * 0.095, feetY - wh * 0.012, wh * 0.052, wh * 0.02, 0, 0, Math.PI * 2); ctx.fill();
    // Hair falling behind the shoulders.
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.ellipse(cx, (headCy + shoulderY) / 2 + wh * 0.01, headR * 1.18, (shoulderY - headCy) * 0.72, 0, 0, Math.PI * 2);
    ctx.fill();
    // Dress: a soft A-line from shoulders to below the knees.
    ctx.fillStyle = DRESS;
    ctx.beginPath();
    ctx.moveTo(cx - wh * 0.125, shoulderY);
    ctx.quadraticCurveTo(cx - wh * 0.20, (shoulderY + hemY) / 2, cx - wh * 0.26, hemY);
    ctx.quadraticCurveTo(cx, hemY + wh * 0.025, cx + wh * 0.26, hemY);
    ctx.quadraticCurveTo(cx + wh * 0.20, (shoulderY + hemY) / 2, cx + wh * 0.125, shoulderY);
    ctx.quadraticCurveTo(cx, shoulderY - wh * 0.03, cx - wh * 0.125, shoulderY);
    ctx.fill();
    // Arms at her sides: mustard sleeves, small skin hands.
    ctx.strokeStyle = DRESS;
    ctx.lineWidth = wh * 0.072;
    ctx.beginPath();
    ctx.moveTo(cx - wh * 0.135, shoulderY + wh * 0.02); ctx.lineTo(cx - wh * 0.265, feetY - wh * 0.315);
    ctx.moveTo(cx + wh * 0.135, shoulderY + wh * 0.02); ctx.lineTo(cx + wh * 0.265, feetY - wh * 0.315);
    ctx.stroke();
    ctx.fillStyle = SKIN;
    circle(cx - wh * 0.27, feetY - wh * 0.30, wh * 0.033); ctx.fill();
    circle(cx + wh * 0.27, feetY - wh * 0.30, wh * 0.033); ctx.fill();
    // Neck and face.
    ctx.fillStyle = SKIN;
    ctx.fillRect(cx - wh * 0.035, headCy + headR * 0.6, wh * 0.07, wh * 0.09);
    circle(cx, headCy + headR * 0.10, headR * 0.94); ctx.fill();
    // Hair cap over the top of the head.
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = headR * 0.55;
    ctx.beginPath();
    ctx.arc(cx, headCy + headR * 0.10, headR * 0.88, Math.PI * 1.02, Math.PI * 1.98);
    ctx.stroke();
    // Peter-pan collar: two white rounded halves at the neck.
    ctx.fillStyle = COLLAR;
    ctx.beginPath(); ctx.ellipse(cx - wh * 0.058, shoulderY + wh * 0.012, wh * 0.062, wh * 0.028, 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + wh * 0.058, shoulderY + wh * 0.012, wh * 0.062, wh * 0.028, -0.35, 0, Math.PI * 2); ctx.fill();
    // Closed eyes: two short, calm strokes. No nose, no mouth.
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = Math.max(1.2, wh * 0.008);
    ctx.beginPath();
    var ew = wh * 0.038, ey = headCy + headR * 0.22;
    ctx.moveTo(cx - headR * 0.40 - ew / 2, ey);
    ctx.quadraticCurveTo(cx - headR * 0.40, ey + ew * 0.38, cx - headR * 0.40 + ew / 2, ey);
    ctx.moveTo(cx + headR * 0.40 - ew / 2, ey);
    ctx.quadraticCurveTo(cx + headR * 0.40, ey + ew * 0.38, cx + headR * 0.40 + ew / 2, ey);
    ctx.stroke();
  }

  function draw(phase) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var i;
    for (i = 0; i < stems.length; i++) if (stems[i].back) drawStem(stems[i], phase);
    for (i = 0; i < roses.length; i++) if (stems[roses[i].stem].back) drawRose(roses[i], phase);
    drawWoman(W * 0.5, womanFeetY(), womanH());
    for (i = 0; i < stems.length; i++) if (!stems[i].back) drawStem(stems[i], phase);
    for (i = 0; i < roses.length; i++) if (!stems[roses[i].stem].back) drawRose(roses[i], phase);
    // Grain over everything, identical every frame.
    for (i = 0; i < grain.length; i++) {
      var g = grain[i];
      ctx.fillStyle = g.light ? COLLAR : DARK;
      ctx.globalAlpha = g.a;
      ctx.fillRect(g.x * W, g.y * H, g.r, g.r);
    }
    ctx.globalAlpha = 1;
    // The one word of instruction, quiet in the corner.
    var U = Math.min(W, H);
    ctx.fillStyle = STEM;
    ctx.globalAlpha = 0.55;
    ctx.font = '600 ' + Math.round(U * 0.030) + 'px system-ui, sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag', U * 0.035, H - U * 0.032);
    ctx.globalAlpha = 1;
  }

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }

  // One synchronous, constant first frame: the knot fully formed at mid
  // tightness, sway pre-rolled to a fixed phase of 7s. Never derived
  // from the clock.
  var PHASE0 = 7.0;
  buildKnot(knotSeed);
  resize();
  draw(PHASE0);

  // ---- Motion: the sway clock is anchored as the fixed offset plus
  // elapsed time since load; tightness eases toward its target.
  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  }
  var t0 = nowMs();
  function step() {
    var phase = PHASE0 + (nowMs() - t0) / 1000;
    tight += (tightTarget - tight) * 0.06;    // slowly, always slowly
    draw(phase);
  }
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () { step(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(PHASE0); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(PHASE0); });
    }
  }

  // ---- Interaction: drag toward the center and the knot tightens around
  // her; drag outward and it loosens, roses opening. Release and it stays
  // where it was left. A tap reseeds the tangle. Never click-to-reload.
  var downAt = 0, downX = 0, downY = 0, moved = false;
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function onDown(e) {
    var p = pos(e);
    downAt = Date.now(); downX = p.x; downY = p.y; moved = false;
    dragging = true;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pos(e);
    if (Math.abs(p.x - downX) + Math.abs(p.y - downY) > 9) moved = true;
    var C = knotCenter();
    var U = Math.min(W, H);
    var d = Math.sqrt((p.x - C.x) * (p.x - C.x) + (p.y - C.y) * (p.y - C.y)) / U;
    tightTarget = 1.05 - d * 1.15;
    if (tightTarget < 0.08) tightTarget = 0.08;
    if (tightTarget > 0.92) tightTarget = 0.92;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    var wasTap = !moved && (Date.now() - downAt) < 350;
    dragging = false;
    if (wasTap) {
      knotSeed += 1;
      buildKnot(knotSeed);
      draw(PHASE0 + (nowMs() - t0) / 1000);
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { dragging = false; });
  }
})();
</script>
</body>
</html>
