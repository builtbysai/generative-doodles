<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layered Testimony</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0B0A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0B0B0A';
var PANEL_A = '#F2EEE3';
var PANEL_B = '#EDE8DB';
var PANEL_C = '#E4DFD0';
var PANEL_D = '#DCD6C4';
var PANEL_E = '#D2CCB9';
var INK_DARK = '#5A5348';
var INK_MID = '#6E675C';
var INK_PALE = '#8A8172';
var SHADOW_INK = '#050504';
var PLATE = '#171713';
var PLATE_LINE = 'rgba(210,204,185,0.45)';
var TITLE_INK = '#F2EEE3';
var HINT_INK = '#D2CCB9';
var FRAME_T = 60;          /* fixed phase: t = 60 s into the 240 s shadow cycle, shadow still off frame */
var CYCLE = 240;           /* shadow cycle, seconds */
var SHADOW_START = 100;    /* shadow enters at t = 100 s */
var SHADOW_END = 140;      /* shadow leaves at t = 140 s */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1822);
var phaseT = FRAME_T;
/* ---- abstract glyph fragments only: consonant clusters and single
   letters, never real words, names, dates or sentences ---- */
var FRAGS = ['kth', 'zrm', 'plv', 'nqk', 'thl', 'vrz', 'mkn', 'spt', 'grd', 'bln', 'qst', 'wrx', 'fjd', 'hng', 'cpl', 'dvm', 'kr', 'zt', 'mn', 'vl', 'qk', 'th', 'rz', 'np', 'a', 'e', 'o', 'u', 'm', 'n', 'r', 'l', 'k', 's', 't'];
var INKS = [INK_DARK, INK_MID, INK_PALE];
/* five panels in a receding row: center largest and brightest, outer
   panels smaller and dimmer. Fractions of layout width W2 / height S. */
var PANELS = [
  { off: -0.42, w: 0.150, h: 0.46, fill: PANEL_E, depth: 0.80, drift: 0.005 },
  { off: -0.21, w: 0.175, h: 0.55, fill: PANEL_D, depth: 0.90, drift: 0.008 },
  { off:  0.00, w: 0.215, h: 0.64, fill: PANEL_A, depth: 1.00, drift: 0.011 },
  { off:  0.21, w: 0.175, h: 0.55, fill: PANEL_B, depth: 0.90, drift: 0.008 },
  { off:  0.42, w: 0.150, h: 0.46, fill: PANEL_C, depth: 0.80, drift: 0.005 }
];
/* precompute the text strata per panel: 6 layers, each a set of rows of
   fragments with fixed jitter, rotation and alpha. Seeded, so the first
   frame is identical on every render. */
var STRATA = [];
(function () {
  var p, l, r, rows, row, frags, f, x;
  for (p = 0; p < PANELS.length; p++) {
    var layers = [];
    for (l = 0; l < 6; l++) {
      rows = [];
      var nRows = 9 + Math.floor(rng() * 3);
      for (r = 0; r < nRows; r++) {
        frags = [];
        x = 0.03 + rng() * 0.05;
        while (x < 0.95) {
          var frag = FRAGS[Math.floor(rng() * FRAGS.length)];
          frags.push({ x: x, text: frag, rot: (rng() - 0.5) * 0.14, ink: INKS[Math.floor(rng() * INKS.length)] });
          x += frag.length * 0.055 + 0.03 + rng() * 0.05;
        }
        rows.push({ y: 0.05 + (r + 0.5) / nRows * 0.90, frags: frags, dy: (rng() - 0.5) * 0.012, phase: rng() * TAU });
      }
      layers.push({ rows: rows, alpha: 0.14 + rng() * 0.20, dxPhase: rng() * TAU, speed: 0.05 + rng() * 0.07 });
    }
    STRATA.push(layers);
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function S() { return Math.min(VW, VH); }
/* panel geometry scale: on portrait phones the viewport is tall and
   narrow, so size the panels from the width instead of the short side,
   or the row would read as a thin band in a tall black field */
function PS() { return isPhone ? Math.min(VH * 0.62, VW * 1.6) : S(); }
function layoutW() { return Math.min(VW * 0.94, PS() * 1.18); }
function panelRect(p, t) {
  var s = PS(), w2 = layoutW();
  var pw = PANELS[p].w * w2;
  var ph = PANELS[p].h * s;
  var cx = VW / 2 + PANELS[p].off * w2 + Math.sin(t * 0.05 + p * 1.3) * PANELS[p].drift * s;
  var cy = VH / 2 + Math.sin(t * 0.037 + p * 2.1) * 0.006 * s;
  return { x: cx - pw / 2, y: cy - ph / 2, w: pw, h: ph, cx: cx, cy: cy };
}
function shadowX(t) {
  /* hand-shaped shadow crosses the row once per 240 s cycle, entering
     at t = 100 s and leaving at t = 140 s; outside that window it is
     parked off frame left. */
  var tc = ((t % CYCLE) + CYCLE) % CYCLE;
  if (tc < SHADOW_START || tc > SHADOW_END) return -0.35 * VW;
  var u = (tc - SHADOW_START) / (SHADOW_END - SHADOW_START);
  return (-0.15 + u * 1.30) * VW;
}
function drawHandShadow(x, y, s) {
  /* soft hand silhouette: palm, four fingers, thumb. Drawn three times
     at growing scale and falling alpha so the edge stays soft even
     where blur filters are unavailable. */
  var pass, k;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.28);
  for (pass = 0; pass < 3; pass++) {
    k = 1 + pass * 0.03;
    var a = 0.20 - pass * 0.07;
    ctx.fillStyle = rgba(SHADOW_INK, a);
    /* palm, taller than wide */
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.050 * s * k, 0.065 * s * k, 0, 0, TAU);
    ctx.fill();
    /* four long fingers, fanned, bases sunk well into the palm */
    var fx, flen, fan;
    for (fx = 0; fx < 4; fx++) {
      var fxx = (-0.033 + fx * 0.022) * s * k;
      flen = (0.098 - Math.abs(fx - 1.5) * 0.014) * s * k;
      fan = (-0.13 + fx * 0.085);
      ctx.save();
      ctx.translate(fxx, -0.058 * s * k);
      ctx.rotate(fan);
      ctx.beginPath();
      ctx.ellipse(0, -flen / 2 + 0.022 * s * k, 0.011 * s * k, flen / 2, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    /* thumb, rooted inside the palm, angled out to the left */
    ctx.save();
    ctx.translate(-0.042 * s * k, 0.012 * s * k);
    ctx.rotate(0.85);
    ctx.beginPath();
    ctx.ellipse(0, -0.028 * s * k, 0.0125 * s * k, 0.042 * s * k, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function drawPanel(p, t, sx) {
  var s = PS();
  var r = panelRect(p, t);
  /* slow light modulation: each panel breathes on its own slow phase */
  var breathe = 0.86 + 0.14 * Math.sin(t * 0.11 + p * 1.9);
  /* backlit glow behind the panel */
  var glow = ctx.createRadialGradient(r.cx, r.cy, 0, r.cx, r.cy, Math.max(r.w, r.h) * 0.85);
  glow.addColorStop(0, rgba(PANEL_A, 0.16 * breathe));
  glow.addColorStop(1, rgba(PANEL_A, 0));
  ctx.fillStyle = glow;
  ctx.fillRect(r.x - r.w * 0.6, r.y - r.h * 0.6, r.w * 2.2, r.h * 2.2);
  /* panel body */
  ctx.fillStyle = PANELS[p].fill;
  ctx.fillRect(r.x, r.y, r.w, r.h);
  /* faint frame edge */
  ctx.strokeStyle = rgba(INK_DARK, 0.35);
  ctx.lineWidth = Math.max(s * 0.0015, 0.75);
  ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
  /* overprinted text strata, clipped to the panel */
  ctx.save();
  ctx.beginPath();
  ctx.rect(r.x, r.y, r.w, r.h);
  ctx.clip();
  var layers = STRATA[p];
  var li, ri, fi, row, frag;
  var fs = Math.max(r.w / 15, 6);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (li = 0; li < layers.length; li++) {
    var layer = layers[li];
    var dx = Math.sin(t * layer.speed + layer.dxPhase) * r.w * 0.02;
    ctx.font = fs + 'px monospace';
    for (ri = 0; ri < layer.rows.length; ri++) {
      row = layer.rows[ri];
      var yy = r.y + (row.y + row.dy * Math.sin(t * 0.06 + row.phase)) * r.h;
      for (fi = 0; fi < row.frags.length; fi++) {
        frag = row.frags[fi];
        ctx.save();
        ctx.translate(r.x + frag.x * r.w + dx, yy);
        ctx.rotate(frag.rot);
        ctx.globalAlpha = layer.alpha * PANELS[p].depth;
        ctx.fillStyle = frag.ink;
        ctx.fillText(frag.text, 0, 0);
        ctx.restore();
      }
    }
  }
  ctx.restore();
  /* top light edge, bottom shade edge */
  ctx.fillStyle = rgba(PANEL_A, 0.35 * breathe);
  ctx.fillRect(r.x, r.y, r.w, Math.max(s * 0.004, 1));
  ctx.fillStyle = rgba(INK_DARK, 0.18);
  ctx.fillRect(r.x, r.y + r.h - Math.max(s * 0.004, 1), r.w, Math.max(s * 0.004, 1));
}
function draw() {
  size();
  var s = PS();
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* faint room wash: a dim pool of light behind the row, darkness at the edges */
  var wash = ctx.createRadialGradient(VW / 2, VH / 2, 0, VW / 2, VH / 2, Math.max(VW, VH) * 0.62);
  wash.addColorStop(0, rgba(PANEL_A, 0.05));
  wash.addColorStop(0.7, rgba(PANEL_A, 0.015));
  wash.addColorStop(1, rgba(PANEL_A, 0));
  ctx.fillStyle = wash;
  ctx.fillRect(0, 0, VW, VH);
  /* floor line under the row */
  ctx.fillStyle = rgba(PANEL_A, 0.07);
  ctx.fillRect(VW * 0.06, VH / 2 + s * 0.36, VW * 0.88, Math.max(s * 0.002, 1));
  /* outer panels first, center panel last, so the receding row overlaps correctly */
  var order = [0, 4, 1, 3, 2];
  var i;
  for (i = 0; i < order.length; i++) drawPanel(order[i], t, s);
  /* the hand-shaped shadow passes across the row on its long timer */
  var sx = shadowX(t);
  if (sx > -0.3 * VW && sx < 1.3 * VW) drawHandShadow(sx, VH / 2 + s * 0.02, s);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Layered Testimony').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Layered Testimony').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 07').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Layered Testimony', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 07', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    shadowX: function () { return shadowX(phaseT); },
    panelCount: function () { return PANELS.length; }
  };
}
/* ---- frame one: fixed phase t = 60 s, shadow still off frame ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
