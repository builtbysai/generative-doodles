<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Painter</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0F3B2E; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var GREEN = '#0F3B2E';   // deep green ground / surround
  var PANEL = '#0D3227';   // panel face, same green family a shade deeper
  var CREAM = '#F2E8C9';   // hand-painted cream lettering
  var GOLD  = '#C9A227';   // muted gold keyline

  var PHASE = 13.0;        // fixed pre-roll: the light sweep is off-panel
  var LOOP = 20.0;         // one soft sweep every 20s

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ------------------------------------------------------------------
  // Parametric flared-serif glyphs.
  // Unit space: cap top y=0, baseline y=1, x from 0 to the advance width.
  // Every glyph is a list of simple polygon subpaths (point arrays),
  // filled with the nonzero rule, so stems, bars and bowl bands union
  // cleanly. Stems and bars carry flared wedge serifs whose size is
  // scaled by a per-letter flare multiplier: the hand-cut wobble.
  // ------------------------------------------------------------------
  var SW = 0.17;    // stem width
  var TW = 0.078;   // thin stroke (mid bars, crossbars)
  var FL = 0.052;   // wedge serif flare

  function stem(cx, y0, y1, w, f) {
    var l = cx - w / 2, r = cx + w / 2;
    return [
      [l - f, y0], [l, y0 + f * 1.25],
      [l, y1 - f * 1.25], [l - f, y1],
      [r + f, y1], [r, y1 - f * 1.25],
      [r, y0 + f * 1.25], [r + f, y0]
    ];
  }

  // Horizontal bar: a plain slab. The serif character lives in the
  // stems' flared ends; bars stay clean-cut, as a painter's arm would.
  function bar(cy, x0, x1, t, f) {
    var t0 = cy - t / 2, t1 = cy + t / 2;
    return [
      [x0, t0], [x1, t0],
      [x1, t1], [x0, t1]
    ];
  }

  function diag(x0, y0, x1, y1, w) {
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy);
    var nx = (-dy / len) * (w / 2), ny = (dx / len) * (w / 2);
    return [
      [x0 + nx, y0 + ny], [x1 + nx, y1 + ny],
      [x1 - nx, y1 - ny], [x0 - nx, y0 - ny]
    ];
  }

  // Diagonal stroke with wedge-flared ends, the stem flare carried
  // along the stroke axis: tips widen at each end, then step back to
  // the stroke width a short way in. One polygon, no separate caps.
  function diagF(x0, y0, x1, y1, w, f) {
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / len, uy = dy / len;
    var nx = -uy, ny = ux;
    var hw = w / 2, fw = hw + f, d = f * 1.35;
    var c0x = x0 + ux * d, c0y = y0 + uy * d;
    var c1x = x1 - ux * d, c1y = y1 - uy * d;
    return [
      [x0 + nx * fw, y0 + ny * fw], [c0x + nx * hw, c0y + ny * hw],
      [c1x + nx * hw, c1y + ny * hw], [x1 + nx * fw, y1 + ny * fw],
      [x1 - nx * fw, y1 - ny * fw], [c1x - nx * hw, c1y - ny * hw],
      [c0x - nx * hw, c0y - ny * hw], [x0 - nx * fw, y0 - ny * fw]
    ];
  }

  // Curved band between an outer and an inner ellipse, angles in radians,
  // y-down (increasing angle runs clockwise on screen). One simple polygon.
  function band(cx, cy, rx, ry, irx, iry, a0, a1) {
    var pts = [];
    var steps = Math.max(12, Math.ceil(Math.abs(a1 - a0) / (Math.PI / 16)));
    var i, a;
    for (i = 0; i <= steps; i++) {
      a = a0 + (a1 - a0) * (i / steps);
      pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
    }
    for (i = steps; i >= 0; i--) {
      a = a0 + (a1 - a0) * (i / steps);
      pts.push([cx + irx * Math.cos(a), cy + iry * Math.sin(a)]);
    }
    return pts;
  }

  var GLYPHS = {
    'A': function (f) {
      return { w: 0.66, paths: [
        diagF(0.045, 1.0, 0.33, 0.02, 0.15, f * 0.6),
        diagF(0.615, 1.0, 0.33, 0.02, 0.15, f * 0.6),
        bar(0.665, 0.175, 0.485, TW, f * 0.7)
      ] };
    },
    'D': function (f) {
      return { w: 0.66, paths: [
        stem(0.148, 0, 1, SW, f),
        band(0.148, 0.5, 0.50, 0.495, 0.345, 0.335, -Math.PI / 2, Math.PI / 2)
      ] };
    },
    'E': function (f) {
      return { w: 0.56, paths: [
        stem(0.152, 0, 1, SW, f),
        bar(0.048, 0.018, 0.545, 0.096, f),
        bar(0.5, 0.03, 0.465, TW, f * 0.7),
        bar(0.952, 0.018, 0.55, 0.096, f)
      ] };
    },
    'I': function (f) {
      return { w: 0.32, paths: [
        stem(0.16, 0, 1, SW, f),
        bar(0.048, 0.012, 0.308, 0.096, f),
        bar(0.952, 0.012, 0.308, 0.096, f)
      ] };
    },
    'L': function (f) {
      return { w: 0.52, paths: [
        stem(0.152, 0, 1, SW, f),
        bar(0.95, 0.018, 0.505, 0.10, f)
      ] };
    },
    'N': function (f) {
      return { w: 0.70, paths: [
        stem(0.148, 0, 1, SW, f),
        stem(0.552, 0, 1, SW, f),
        diag(0.148, 0.07, 0.552, 0.93, 0.125)
      ] };
    },
    'O': function (f) {
      return { w: 0.76, paths: [
        band(0.38, 0.5, 0.365, 0.498, 0.205, 0.338, 0, Math.PI * 2)
      ] };
    },
    'P': function (f) {
      return { w: 0.60, paths: [
        stem(0.148, 0, 1, SW, f),
        band(0.148, 0.26, 0.425, 0.255, 0.268, 0.115, -Math.PI / 2, Math.PI / 2),
        bar(0.515, 0.03, 0.47, 0.082, f * 0.7)
      ] };
    },
    'R': function (f) {
      return { w: 0.62, paths: [
        stem(0.148, 0, 1, SW, f),
        band(0.148, 0.26, 0.435, 0.255, 0.278, 0.115, -Math.PI / 2, Math.PI / 2),
        bar(0.515, 0.03, 0.48, 0.082, f * 0.7),
        diagF(0.335, 0.53, 0.585, 0.99, 0.128, f * 0.9)
      ] };
    },
    'S': function (f) {
      return { w: 0.56, paths: [
        band(0.28, 0.25, 0.245, 0.225, 0.125, 0.105, -0.95, -3.95),
        band(0.28, 0.75, 0.245, 0.225, 0.125, 0.105, -0.81, 2.19),
        diag(0.135, 0.415, 0.425, 0.60, 0.115)
      ] };
    },
    'T': function (f) {
      return { w: 0.62, paths: [
        bar(0.048, 0.012, 0.608, 0.096, f),
        stem(0.31, 0.04, 1, SW, f)
      ] };
    },
    'V': function (f) {
      return { w: 0.66, paths: [
        diagF(0.045, 0.0, 0.33, 1.0, 0.15, f * 0.9),
        diagF(0.615, 0.0, 0.33, 1.0, 0.15, f * 0.9)
      ] };
    },
    ' ': function (f) { return { w: 0.30, paths: [] }; }
  };

  // Winding-number point test across all subpaths of a glyph: nonzero
  // winding means the point sits on paint. Used to seed brush grain
  // along the strokes only.
  function winding(px, py, paths) {
    var wn = 0, s, i, x0, y0, x1, y1, isLeft;
    for (s = 0; s < paths.length; s++) {
      var poly = paths[s];
      for (i = 0; i < poly.length; i++) {
        x0 = poly[i][0]; y0 = poly[i][1];
        x1 = poly[(i + 1) % poly.length][0]; y1 = poly[(i + 1) % poly.length][1];
        isLeft = (x1 - x0) * (py - y0) - (px - x0) * (y1 - y0);
        if (y0 <= py) { if (y1 > py && isLeft > 0) wn++; }
        else { if (y1 <= py && isLeft < 0) wn--; }
      }
    }
    return wn;
  }

  // One letter instance: glyph geometry, seeded hand wobble, seeded grain.
  function makeLetter(ch, rng, wobbleAmt, grainCount, flareScale) {
    var flareMul = (0.85 + rng() * 0.35) * flareScale;
    var g = GLYPHS[ch](FL * flareMul);
    var grain = [];
    if (g.paths.length && grainCount > 0) {
      var tries = 0;
      while (grain.length < grainCount && tries < grainCount * 8) {
        tries++;
        var gx = rng() * g.w;
        var gy = 0.03 + rng() * 0.94;
        if (winding(gx, gy, g.paths) !== 0) {
          grain.push({
            x: gx, y: gy,
            len: 0.018 + rng() * 0.03,
            a: 0.04 + rng() * 0.05
          });
        }
      }
    }
    return {
      ch: ch, w: g.w, paths: g.paths, grain: grain,
      wob: {
        rot: (rng() - 0.5) * 0.016 * wobbleAmt,
        dy: (rng() - 0.5) * 0.012 * wobbleAmt,
        shear: (rng() - 0.5) * 0.03 * wobbleAmt,
        sy: 0.99 + rng() * 0.02
      }
    };
  }

  function makeWord(str, rng, wobbleAmt, grainCount, flareScale) {
    var letters = [];
    for (var i = 0; i < str.length; i++) letters.push(makeLetter(str[i], rng, wobbleAmt, grainCount, flareScale));
    return letters;
  }

  function wordUnits(letters, tracking) {
    var u = 0;
    for (var i = 0; i < letters.length; i++) u += letters[i].w + (i > 0 ? tracking : 0);
    return u;
  }

  var rng = mulberry32(496059);
  var wordmark = makeWord('SELVANO', rng, 1.0, 14, 1.0);          // invented shop name
  var descriptor = makeWord('OSTERIA DI PAESE', rng, 0.6, 5, 0.55); // condensed caps line

  var WORD_TRACK = 0.07;   // wordmark tracking, in cap-height units
  var DESC_TRACK = 0.14;   // descriptor tracking (before condensing)
  var DESC_COND = 0.72;    // descriptor condense factor

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  function drawLetter(L, x, baseY, capH, condense) {
    var adv = L.w * condense * capH;
    ctx.save();
    ctx.translate(x + adv / 2, baseY + L.wob.dy * capH);
    ctx.rotate(L.wob.rot);
    ctx.transform(1, 0, L.wob.shear, 1, 0, 0);
    ctx.translate(-adv / 2, 0);
    ctx.scale(condense * capH, capH * L.wob.sy);
    ctx.translate(0, -1);
    ctx.beginPath();
    for (var s = 0; s < L.paths.length; s++) {
      var poly = L.paths[s];
      if (!poly.length) continue;
      ctx.moveTo(poly[0][0], poly[0][1]);
      for (var i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
      ctx.closePath();
    }
    ctx.fillStyle = CREAM;
    ctx.fill();
    // brush grain: short horizontal dashes of the green showing through
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.15 / capH;
    for (var g = 0; g < L.grain.length; g++) {
      var d = L.grain[g];
      ctx.strokeStyle = 'rgba(15,59,46,' + d.a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.len, d.y);
      ctx.stroke();
    }
    ctx.restore();
    return adv;
  }

  function drawWord(letters, cx, baseY, capH, condense, tracking) {
    var total = wordUnits(letters, tracking) * condense * capH;
    var x = cx - total / 2;
    for (var i = 0; i < letters.length; i++) {
      if (i > 0) x += tracking * condense * capH;
      x += drawLetter(letters[i], x, baseY, capH, condense);
    }
    return total;
  }

  function draw(t) {
    if (!W || !H) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // ---- surround: the deep green continues to the frame edges ----
    ctx.fillStyle = GREEN;
    ctx.fillRect(0, 0, W, H);

    // ---- the panel: 3:1 shop-sign board, centred ----
    var pw = Math.min(W * 0.97, H * 2.9);
    var ph = pw / 3;
    if (ph > H * 0.96) { ph = H * 0.96; pw = ph * 3; }
    var px = (W - pw) / 2, py = (H - ph) / 2;
    ctx.fillStyle = PANEL;
    ctx.fillRect(px, py, pw, ph);

    // ---- gold keyline, inset from the panel edge ----
    var inset = Math.min(pw * 0.06, ph * 0.16);
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = Math.max(1.6, ph * 0.0075);
    ctx.strokeRect(px + inset, py + inset, pw - inset * 2, ph - inset * 2);

    // ---- lettering: wordmark over descriptor, block centred ----
    var wUnits = wordUnits(wordmark, WORD_TRACK);
    var capW = (0.60 * pw) / wUnits;         // wordmark cap height
    var capD = capW * 0.38;                  // descriptor at ~40% of wordmark size
    var gap = capW * 0.30;
    var blockH = capW + gap + capD;
    var blockTop = py + (ph - blockH) / 2;
    var wordBase = blockTop + capW;
    var descBase = wordBase + gap + capD;
    var cx = px + pw / 2;

    drawWord(wordmark, cx, wordBase, capW, 1, WORD_TRACK);
    drawWord(descriptor, cx, descBase, capD, DESC_COND, DESC_TRACK);

    // ---- soft light sweep: one brightness wave, like a cloud passing ----
    var p = ((t % LOOP) + LOOP) % LOOP;
    var u = (p < 8) ? (-0.55 + (p / 8) * 2.1) : 1.55; // band centre, panel widths
    if (u > -0.6 && u < 1.6) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(px, py, pw, ph);
      ctx.clip();
      var gx0 = px + (u - 0.5) * pw, gx1 = px + (u + 0.5) * pw;
      var sweep = ctx.createLinearGradient(gx0, 0, gx1, 0);
      sweep.addColorStop(0, 'rgba(255,255,255,0)');
      sweep.addColorStop(0.5, 'rgba(255,255,255,0.055)');
      sweep.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sweep;
      ctx.fillRect(px, py, pw, ph);
      ctx.restore();
    }
  }

  // ---- run: watch-only, no interaction ----
  resize();
  draw(PHASE);

  var startStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) startStamp = stamp;
      var elapsed = (stamp - startStamp) / 1000;
      draw(PHASE + elapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
