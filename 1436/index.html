<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forty-Four Frozen Moments</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1436000);
  function r4(x) { return Math.round(x * 10000) / 10000; }
  function sstep(a, b, x) {
    if (x <= a) return 0;
    if (x >= b) return 1;
    var u = (x - a) / (b - a);
    return u * u * (3 - 2 * u);
  }

  // Viewport sizing (Visual Viewport API first).
  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    canvas.style.width = Math.round(W) + 'px';
    canvas.style.height = Math.round(H) + 'px';
    var minDim = 1e9;
    try {
      if (window.screen && window.screen.width && window.screen.height) {
        minDim = Math.min(window.screen.width, window.screen.height);
      }
    } catch (e) { /* ignore */ }
    phone = (minDim < 700) || (H > W * 1.15);
  }
  size();
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', size);
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', size);
    }
  }

  // ---- The set: 44 panels, one two-second shot, frozen ----
  var N = 44;
  var WORDS = ['SEHEN', 'UNS', 'LAUFEN', 'IN', 'GRÖSSTER', 'EILE…'];
  var PRISM = ['#c01818', '#d4a24e', '#2e7a74', '#6a4a8a', '#141210', '#ece8dc'];
  // Seeded static speckle for the panel grounds (one draw, never animated).
  var speckles = [];
  for (var s = 0; s < 220; s++) {
    speckles.push({ x: rnd(), y: rnd(), a: 0.05 + rnd() * 0.08 });
  }

  function grid() {
    var margin = phone ? 8 : 24;
    var cols = phone ? 4 : 11;
    var rows = phone ? 11 : 4;
    var gw = W - margin * 2, gh = H - margin * 2;
    var cw = gw / cols, ch = gh / rows;
    var titleH = phone ? 14 : 18;
    var pad = phone ? 2 : 3;
    return { margin: margin, cols: cols, rows: rows, cw: cw, ch: ch,
             titleH: titleH, pad: pad };
  }
  function cellRect(g, i) {
    var col = i % g.cols, row = Math.floor(i / g.cols);
    var x = g.margin + col * g.cw;
    var y = g.margin + row * g.ch;
    return { x: x + g.pad, y: y + g.pad,
             w: g.cw - g.pad * 2, h: g.ch - g.titleH - g.pad * 2,
             tx: x, ty: y + g.ch - g.titleH, tw: g.cw, th: g.titleH };
  }

  // ---- Helpers ----
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }
  // Flat-alpha fill for hex colours: build an rgba string from hex + alpha.
  function hexA(hex, alpha) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + r4(alpha) + ')';
  }
  function diamond(cx, cy, rx, ry, color) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - ry);
    ctx.lineTo(cx + rx, cy);
    ctx.lineTo(cx, cy + ry);
    ctx.lineTo(cx - rx, cy);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
  function dot(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  // One kaleidoscope motif at frame i, drawn at (cx, cy) with radius R.
  // Phase p = i/43 drives the whole two-second shot:
  //   p 0-0.35: shapes gather from the edges toward the centre;
  //   p 0.45-0.70: the single ornament breaks into two shapes;
  //   p 0.80-1: the shapes disappear.
  function drawMotif(cx, cy, R, i) {
    var p = i / (N - 1);
    var theta = p * Math.PI * 3;
    var gather = sstep(0, 0.35, p);
    var split = sstep(0.45, 0.70, p);
    var fade = 1 - sstep(0.80, 1.0, p);
    if (fade <= 0.01) return;
    var mirror = (i % 2 === 0) ? 1 : -1;
    var centres = split > 0.01
      ? [[-split * 0.30 * R, 0], [split * 0.30 * R, 0]]
      : [[0, 0]];
    var sc = split > 0.01 ? 0.7 : 1;
    for (var m = 0; m < centres.length; m++) {
      var mx = cx + centres[m][0], my = cy + centres[m][1];
      var r = R * sc;
      var ring = r * (0.88 - 0.55 * gather);
      for (var k = 0; k < 8; k++) {
        var a = theta + mirror * k * Math.PI / 4;
        var dx = mx + Math.cos(a) * ring;
        var dy = my + Math.sin(a) * ring;
        var dr = r * 0.17;
        diamond(dx, dy, dr, dr * 0.72, hexA(PRISM[k % 6], fade));
        // Lacquer-bright tip dot on each diamond.
        rect(dx - 1, dy - dr * 0.72 - 2, 2, 2, hexA('#ece8dc', fade));
      }
      // Centre star, filling only as the shapes gather.
      var cr = r * 0.24 * gather;
      if (cr > 0.5) {
        for (var q = 0; q < 4; q++) {
          var sa = theta + q * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(mx, my);
          ctx.lineTo(mx + Math.cos(sa - 0.35) * cr, my + Math.sin(sa - 0.35) * cr);
          ctx.lineTo(mx + Math.cos(sa) * cr * 1.5, my + Math.sin(sa) * cr * 1.5);
          ctx.lineTo(mx + Math.cos(sa + 0.35) * cr, my + Math.sin(sa + 0.35) * cr);
          ctx.closePath();
          ctx.fillStyle = hexA(PRISM[(q + 2) % 6], fade);
          ctx.fill();
        }
        dot(mx, my, Math.max(1.5, r * 0.05), hexA('#ece8dc', fade));
      }
    }
  }

  function drawPanel(g, i, expanded) {
    var c = cellRect(g, i);
    var x = c.x, y = c.y, w = c.w, h = c.h;
    if (expanded) {
      var ex = w * 0.03, ey = h * 0.03;
      x -= ex; y -= ey; w += ex * 2; h += ey * 2;
    }
    // Parchment card: ornament area + title strip, so the dark title ink
    // reads against parchment instead of vanishing on the black ground.
    var cardH = (c.ty + c.th) - y;
    rect(x, y, w, cardH, '#e8e2d4');
    // Seeded speckle, static.
    for (var s = 0; s < speckles.length; s++) {
      var sp = speckles[s];
      var sx = x + sp.x * w, sy = y + sp.y * cardH;
      if (sx >= x && sx < x + w && sy >= y && sy < y + cardH) {
        rect(sx, sy, 1, 1, 'rgba(42,36,30,' + r4(sp.a) + ')');
      }
    }
    var R = Math.min(w, h) * 0.44;
    drawMotif(x + w / 2, y + h / 2, R, i);
    // Panel border.
    ctx.strokeStyle = '#141210';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    if (expanded) {
      ctx.strokeStyle = '#d4a24e';
      ctx.lineWidth = 3;
      ctx.strokeRect(x - 1.5, y - 1.5, w + 3, h + 3);
    }
    // One-word title beneath the panel: the prompt's own sentence words,
    // cycling so the titles read as a sentence as the frames pass.
    var fs = Math.max(7, Math.round(g.cw * 0.13));
    ctx.fillStyle = '#1a1712';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + fs + 'px Arial, sans-serif';
    ctx.fillText(WORDS[i % WORDS.length], c.tx + c.tw / 2, c.ty + c.th / 2 + 1);
  }

  // ---- Interaction state: closed-form over recorded events ----
  // The sequence advances ONLY by viewer travel (drag) or by the slow
  // ambient drift of the current-panel highlight (one frame per 6 s).
  // The frames themselves never move; the shot freezes when travel stops.
  var DRIFT_STEP = 6;
  var CYCLE = N * DRIFT_STEP; // 264 s: drift wraps exactly at the cycle edge.
  var driftBase = 0, driftStart = 0;
  var dragging = false, dragIdx = 0;
  var nowT = 0;

  function currentIndex(t) {
    if (dragging) return dragIdx;
    var dt = t - driftStart;
    if (dt < 0) dt += CYCLE;
    return (driftBase + Math.floor(dt / DRIFT_STEP)) % N;
  }
  function indexAt(p) {
    var g = grid();
    var col = Math.floor((p.x - g.margin) / g.cw);
    var row = Math.floor((p.y - g.margin) / g.ch);
    if (col < 0) col = 0; if (col >= g.cols) col = g.cols - 1;
    if (row < 0) row = 0; if (row >= g.rows) row = g.rows - 1;
    var idx = row * g.cols + col;
    if (idx >= N) idx = N - 1;
    return idx;
  }
  function canvasPos(e) {
    var r = canvas.getBoundingClientRect();
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0].clientY);
    return { x: cx - r.left, y: cy - r.top };
  }
  function onDown(e) {
    var p = canvasPos(e);
    dragIdx = indexAt(p);
    dragging = true;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    dragIdx = indexAt(canvasPos(e));
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    // Re-anchor the drift at the scrubbed frame; the shot stays frozen
    // until the next 6 s drift step.
    driftBase = dragIdx;
    driftStart = nowT;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---- Main draw (t = piece time in seconds) ----
  function draw(t) {
    nowT = t;
    var g = grid();
    rect(0, 0, W, H, '#141210');
    var cur = currentIndex(t);
    for (var i = 0; i < N; i++) {
      if (i !== cur) drawPanel(g, i, false);
    }
    // Current frame drawn last, slightly larger, gold-framed.
    drawPanel(g, cur, true);
    // Pin canvas size (house rule).
    canvas.style.width = Math.round(W) + 'px';
    canvas.style.height = Math.round(H) + 'px';
  }

  // ---- Clock: frame one = draw(0) via boot flag ----
  var startTime = 0, started = false;
  draw(0);
  function loop(ts) {
    if (!started) { started = true; startTime = ts; }
    var t = ((ts - startTime) / 1000) % CYCLE;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
