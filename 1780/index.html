<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-Playing Pendulum</title>
<style>
html, body { margin: 0; padding: 0; background: #0a0a0c; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0a0a0c';
var WIRE = 'rgba(178,178,190,0.55)';
var ORB = '#050506';
var ORB_RIM = 'rgba(205,205,215,0.38)';
var ORB_GLOW = 'rgba(120,120,135,0.16)';
var CONE_OUT = '#c9c9c4';
var CONE_IN = '#b2b2ac';
var DOME = '#8f8f89';
var RING = '167,139,250'; /* faint violet interference rings */
var FRAME_T = 60.0; /* fixed phase: orb at the bottom of its swing, closest to the speaker, rings at full bloom */
var PERIOD = 8.0; /* seconds; one slow swing */
var THETA_MAX = 0.35; /* radians; about 20 degrees */
var PRECESS = TAU / 600.0; /* radians per second; the swing plane turns once in 10 minutes */
var PIVOT_Y = 0.06; /* pivot height as a fraction of the field height */
var WIRE_LEN = 0.58; /* wire length as a fraction of the field height */
var SPEAKER_Y = 0.84; /* speaker cone centre as a fraction of the field height */
var RING_NEAR = 0.28; /* rings begin when orb-to-speaker distance drops below this, as a fraction of field height */
var RING_MIN = 0.20; /* closest approach distance, as a fraction of field height */
var PLATE_FILL = '#101013';
var PLATE_LINE = 'rgba(255,255,255,0.28)';
var PLATE_INK = '#edebe6';
var HINT_INK = '#edebe6';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var taps = []; /* piece times of taps; each adds one fixed authored nudge, frame one is pre-tap */
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* Swing angle: closed-form function of piece time. At t = 60 s,
   sin(TAU * 60 / 8) = sin(15 * PI) = 0, so the orb hangs straight down,
   at its closest approach to the speaker. */
function swingAngle(t) {
  var a = THETA_MAX * Math.sin(TAU * t / PERIOD);
  var i;
  for (i = 0; i < taps.length; i++) {
    var dt = t - taps[i];
    if (dt > 0) a += 0.06 * Math.sin(TAU * dt / PERIOD) * Math.exp(-dt / 8.0);
  }
  return a;
}
/* Precession angle of the swing plane: closed form, one full turn in 600 s. */
function precessionAngle(t) {
  return PRECESS * t;
}
/* Orb centre: closed form of piece time. The swing plane rotates about the
   vertical axis, so the horizontal displacement is foreshortened by cos(psi)
   while the vertical drop follows cos(theta). */
function orbPos(t) {
  var th = swingAngle(t);
  var psi = precessionAngle(t);
  var px = F.x + F.w / 2;
  var py = F.y + PIVOT_Y * F.h;
  var L = WIRE_LEN * F.h;
  return {
    x: px + L * Math.sin(th) * Math.cos(psi),
    y: py + L * Math.cos(th),
    px: px, py: py
  };
}
function speakerPos() {
  return { x: F.x + F.w / 2, y: F.y + SPEAKER_Y * F.h };
}
/* Proximity factor 0..1: 0 when the orb is far from the speaker, 1 at
   closest approach. Closed form of piece time through the orb position. */
function proximity(t) {
  var o = orbPos(t);
  var s = speakerPos();
  var d = Math.sqrt((o.x - s.x) * (o.x - s.x) + (o.y - s.y) * (o.y - s.y)) / F.h;
  return clamp((RING_NEAR - d) / (RING_NEAR - RING_MIN), 0, 1);
}
function drawWireAndOrb(t) {
  var o = orbPos(t);
  var S = Math.min(F.w, F.h);
  var r = 0.05 * S;
  /* pivot mount */
  ctx.fillStyle = 'rgba(200,200,210,0.7)';
  ctx.beginPath();
  ctx.arc(o.px, o.py, Math.max(2, 0.006 * S), 0, TAU);
  ctx.fill();
  /* wire */
  ctx.strokeStyle = WIRE;
  ctx.lineWidth = Math.max(1, 0.002 * S);
  ctx.beginPath();
  ctx.moveTo(o.px, o.py);
  ctx.lineTo(o.x, o.y);
  ctx.stroke();
  /* faint halo so the matte black orb reads against the near-black void */
  ctx.fillStyle = ORB_GLOW;
  ctx.beginPath();
  ctx.arc(o.x, o.y, r * 1.9, 0, TAU);
  ctx.fill();
  /* orb */
  ctx.fillStyle = ORB;
  ctx.beginPath();
  ctx.arc(o.x, o.y, r, 0, TAU);
  ctx.fill();
  /* thin rim light on the upper-left edge */
  ctx.strokeStyle = ORB_RIM;
  ctx.lineWidth = Math.max(1, 0.003 * S);
  ctx.beginPath();
  ctx.arc(o.x, o.y, r, Math.PI * 0.75, Math.PI * 1.45);
  ctx.stroke();
}
function drawSpeaker() {
  var s = speakerPos();
  var S = Math.min(F.w, F.h);
  var rOut = 0.13 * S, rIn = 0.095 * S, rDome = 0.042 * S;
  /* outer cone */
  ctx.fillStyle = CONE_OUT;
  ctx.beginPath();
  ctx.arc(s.x, s.y, rOut, 0, TAU);
  ctx.fill();
  /* inner cone */
  ctx.fillStyle = CONE_IN;
  ctx.beginPath();
  ctx.arc(s.x, s.y, rIn, 0, TAU);
  ctx.fill();
  /* centre dome */
  ctx.fillStyle = DOME;
  ctx.beginPath();
  ctx.arc(s.x, s.y, rDome, 0, TAU);
  ctx.fill();
  /* thin dark ring between cone and dome */
  ctx.strokeStyle = 'rgba(60,60,60,0.6)';
  ctx.lineWidth = Math.max(1, 0.002 * S);
  ctx.beginPath();
  ctx.arc(s.x, s.y, rIn, 0, TAU);
  ctx.stroke();
}
function drawRings(t) {
  var p = proximity(t);
  if (p <= 0) return;
  var o = orbPos(t);
  var s = speakerPos();
  var mx = (o.x + s.x) / 2, my = (o.y + s.y) / 2;
  var S = Math.min(F.w, F.h);
  var maxR = 0.30 * S;
  var k, frac, r, a;
  for (k = 0; k < 4; k++) {
    frac = (t * 0.045 + k * 0.25) % 1;
    r = frac * maxR;
    a = p * (1 - frac) * 0.55;
    ctx.strokeStyle = 'rgba(' + RING + ',' + a.toFixed(4) + ')';
    ctx.lineWidth = Math.max(1, 0.004 * S);
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, TAU);
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Self-Playing Pendulum').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Self-Playing Pendulum').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 26').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Self-Playing Pendulum', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 26', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap for a gentle nudge.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawSpeaker();
  drawRings(phaseT);
  drawWireAndOrb(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    swingAngle: function () { return swingAngle(phaseT); },
    proximity: function () { return proximity(phaseT); }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('pointerdown', function () {
    taps.push(phaseT);
    /* lazy feedback tone, only inside the visitor gesture, gain kept low */
    try {
      if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
        var AC = typeof AudioContext !== 'undefined' ? AudioContext : webkitAudioContext;
        var ac = new AC();
        var osc = ac.createOscillator();
        var gain = ac.createGain();
        var d = proximity(phaseT);
        osc.frequency.value = 90 + 220 * (1 - d);
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.03, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start();
        osc.stop(ac.currentTime + 1.3);
      }
    } catch (e) { /* audio is optional; the piece works fully muted */ }
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
