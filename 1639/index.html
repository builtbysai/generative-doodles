<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identity Studies, After Himself</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EDE3; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F2EDE3';
var INK = '#2B2B28';
var CRIMSON = '#B03040';
var OCHRE = '#C08A2D';
var COBALT = '#2E4A8F';
var DREAM_BG = '#A9A4B8';
var SEEDS = [1639001, 1639007, 1639013, 1639021];
/* The 90 s cycle: 0-30 crisp polycircles, 30-60 dream wash, 60-90
   resolved self, then a new seed. Frame one is at t = 12 s, inside
   the crisp polycircle phase, already developed. */
var CYCLE = 90, PHASE = 12;
var N_CIRCLES = 26, N_SMALL = 40;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function lerpRgb(a, b, f) {
  return [Math.round(a[0] + (b[0] - a[0]) * f), Math.round(a[1] + (b[1] - a[1]) * f), Math.round(a[2] + (b[2] - a[2]) * f)];
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var PAPER_RGB = hexRgb(PAPER);
var INK_RGB = hexRgb(INK);
var DREAM_BG_RGB = hexRgb(DREAM_BG);
var CRISP_COLS = [hexRgb(CRIMSON), hexRgb(OCHRE), hexRgb(COBALT), INK_RGB];
var DREAM_COLS = [hexRgb('#8A6A80'), hexRgb('#9A8A7A'), hexRgb('#6A6E8A'), hexRgb('#6E6A7A')];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Square centred composition on desktop and phones; the page ground
   is the piece's own cream, so the square keeps its shape everywhere. */
function compRect() {
  var side = Math.min(VW, VH) * (isPhone ? 0.94 : 0.86);
  return { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
}
/* ---- cycle phase: pure functions of piece time ---- */
function cycleT(t) { return ((t % CYCLE) + CYCLE) % CYCLE; }
function dreaminess(ct) {
  if (ct < 28) return 0;
  if (ct < 32) return smooth((ct - 28) / 4);
  if (ct < 58) return 1;
  if (ct < 62) return 1 - smooth((ct - 58) / 4);
  return 0;
}
function resolvedness(ct) {
  if (ct < 60) return 0;
  if (ct < 64) return smooth((ct - 60) / 4);
  if (ct < 88) return 1;
  if (ct < 90) return 1 - smooth((ct - 88) / 2);
  return 0;
}
function seedFor(t) {
  var ci = Math.floor(t / CYCLE);
  var ct = cycleT(t);
  if (ct >= 60) return SEEDS[(ci + 1) % SEEDS.length];
  return SEEDS[((ci % SEEDS.length) + SEEDS.length) % SEEDS.length];
}
/* ---- seeded polycircle field: 26 main circles, 40 small ones ---- */
var fieldCache = {};
function buildField(seed) {
  var rng = mulberry32(seed);
  var circles = [], small = [], i, ci;
  for (i = 0; i < N_CIRCLES; i++) {
    ci = Math.floor(rng() * 4);
    circles.push({
      x: 0.08 + rng() * 0.84,
      y: 0.10 + rng() * 0.80,
      r: 0.05 + rng() * 0.16,
      ci: ci,
      lw: 1 + rng() * 2.2,
      alpha: 0.55 + rng() * 0.40,
      fill: rng() < 0.30,
      fillA: 0.05 + rng() * 0.10,
      jx: rng() * 2 - 1, jy: rng() * 2 - 1,
      jamp: 0.010 + rng() * 0.030
    });
  }
  for (i = 0; i < N_SMALL; i++) {
    small.push({
      x: 0.06 + rng() * 0.88,
      y: 0.08 + rng() * 0.84,
      r: 0.012 + rng() * 0.035,
      ci: Math.floor(rng() * 4),
      alpha: 0.35 + rng() * 0.45
    });
  }
  return { circles: circles, small: small };
}
function fieldFor(seed) {
  if (!fieldCache[seed]) fieldCache[seed] = buildField(seed);
  return fieldCache[seed];
}
/* Quadrant offsets for the resolved phase: each quarter of the field
   shifts a little, a fragmented perspective of the same system. */
function quadOffset(x, y, s) {
  var ox = 0, oy = 0;
  if (x < 0.5 && y < 0.5) { ox = 0.012; oy = -0.009; }
  else if (x >= 0.5 && y < 0.5) { ox = -0.009; oy = -0.012; }
  else if (x < 0.5 && y >= 0.5) { ox = 0.009; oy = 0.012; }
  else { ox = -0.012; oy = 0.009; }
  return [ox * s, oy * s];
}
function drawCircle(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function drawField(t, rect) {
  var ct = cycleT(t);
  var dream = dreaminess(ct);
  var res = resolvedness(ct);
  var seed = seedFor(t);
  var f = fieldFor(seed);
  var i, c, s, cx, cy, r, col, q;
  /* Field ground: cream crisp, desaturated violet-grey in the dream. */
  ctx.fillStyle = rgb(lerpRgb(PAPER_RGB, DREAM_BG_RGB, dream));
  ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
  /* Circles stay inside the square: the composition is the square. */
  ctx.save();
  ctx.beginPath();
  ctx.rect(rect.x, rect.y, rect.w, rect.h);
  ctx.clip();
  for (i = 0; i < f.circles.length; i++) {
    c = f.circles[i];
    col = lerpRgb(CRISP_COLS[c.ci], DREAM_COLS[c.ci], dream);
    cx = rect.x + c.x * rect.w + dream * c.jamp * c.jx * rect.w;
    cy = rect.y + c.y * rect.h + dream * c.jamp * c.jy * rect.h;
    if (res > 0) {
      q = quadOffset(c.x, c.y, rect.w);
      cx += q[0] * res; cy += q[1] * res;
    }
    r = c.r * rect.w * (1 + dream * 0.08);
    if (c.fill) {
      ctx.fillStyle = rgba(col, c.fillA * (1 - dream * 0.5));
      drawCircle(cx, cy, r);
      ctx.fill();
    }
    /* Smear: the dream re-draws each circle a few times at small
       offsets with low alpha, edges going soft. */
    if (dream > 0.05) {
      ctx.strokeStyle = rgba(col, c.alpha * 0.22 * dream);
      ctx.lineWidth = c.lw * (1 + dream * 1.5);
      drawCircle(cx + dream * 7 * c.jx, cy + dream * 5 * c.jy, r);
      ctx.stroke();
      drawCircle(cx - dream * 6 * c.jy, cy + dream * 6 * c.jx, r);
      ctx.stroke();
    }
    ctx.strokeStyle = rgba(col, c.alpha * (1 - dream * 0.35));
    ctx.lineWidth = c.lw * (1 + dream * 1.5);
    drawCircle(cx, cy, r);
    ctx.stroke();
  }
  /* Resolved phase: a finer layer of small circles, the shifting
     resolution, plus faint quadrant split lines. */
  if (res > 0.05) {
    for (i = 0; i < f.small.length; i++) {
      s = f.small[i];
      col = CRISP_COLS[s.ci];
      cx = rect.x + s.x * rect.w;
      cy = rect.y + s.y * rect.h;
      q = quadOffset(s.x, s.y, rect.w);
      cx += q[0] * res; cy += q[1] * res;
      ctx.strokeStyle = rgba(col, s.alpha * res);
      ctx.lineWidth = 1;
      drawCircle(cx, cy, s.r * rect.w);
      ctx.stroke();
    }
    ctx.strokeStyle = rgba(INK_RGB, 0.18 * res);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(rect.x + rect.w / 2, rect.y);
    ctx.lineTo(rect.x + rect.w / 2, rect.y + rect.h);
    ctx.moveTo(rect.x, rect.y + rect.h / 2);
    ctx.lineTo(rect.x + rect.w, rect.y + rect.h / 2);
    ctx.stroke();
  }
  ctx.restore();
}
function drawText(rect, holding) {
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  /* Title sized to fit the square: shrink until it fits. */
  var titlePx = isPhone ? 16 : 20;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Identity Studies, After Himself').width > rect.w - 40) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Identity Studies, After Himself').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 08').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = cxm - plateW / 2, plateY = rect.y + 10;
  ctx.fillStyle = PAPER;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.25);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Identity Studies, After Himself', cxm, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.75);
  ctx.fillText('2006 · 07 · 08', cxm, plateY + 7 + titlePx + 3);
  var hint = 'Hold to slow the dream.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = rect.y + rect.h - hintPlateH - 10;
  ctx.fillStyle = PAPER;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  /* While held, the hint plate border turns violet: the dream lingers. */
  ctx.strokeStyle = holding ? '#7A7390' : rgba(INK_RGB, 0.25);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(INK_RGB, 0.85);
  ctx.fillText(hint, cxm, hintPlateY + 7);
}
/* ---- hold to influence: while held the phase timer runs at a
   quarter speed, so the dream lingers; release resumes the cycle's
   own tempo. Shared transformation, not control. ---- */
var holding = false;
function onPointerDown(e) {
  holding = true;
  if (e && e.preventDefault) e.preventDefault();
}
function onPointerUp() { holding = false; }
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('pointerleave', onPointerUp);
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mouseup', onPointerUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function draw(t) {
  size();
  var rect = compRect();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  drawField(t, rect);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);
  drawText(rect, holding);
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    circleCount: function () { return N_CIRCLES; },
    smallCount: function () { return N_SMALL; },
    phaseAt: function (t) { var ct = cycleT(t); return ct < 30 ? 0 : (ct < 60 ? 1 : 2); },
    dreamAt: function (t) { return dreaminess(cycleT(t)); },
    resolvedAt: function (t) { return resolvedness(cycleT(t)); },
    seedAt: function (t) { return seedFor(t); },
    holding: function () { return holding; },
    drawAt: function (t) { draw(t); }
  };
}
/* ---- frame one: fixed phase, fixed seed, no wall clock ---- */
size();
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt * (holding ? 0.25 : 1);
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
