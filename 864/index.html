<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sound Is the Image</title>
<style>
  html, body { margin: 0; padding: 0; background: #020203; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var BG      = '#020203';        // black
  var TERRAIN = [30, 77, 92];     // drone terrain #1E4D5C
  var GONG    = [232, 160, 32];   // gong shock #E8A020
  var THREAD  = [242, 237, 228];  // voice thread #F2EDE4
  var BLOOM   = [92, 30, 46];     // sub-bass bloom #5C1E2E

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- layout ----------
  var W = 0, H = 0, DPR = 1, S = 1, isPhone = false;

  function viewSize() {
    var vv = window.visualViewport;
    if (vv && vv.width) return { w: vv.width, h: vv.height };
    return { w: window.innerWidth || 0, h: window.innerHeight || 0 };
  }

  function layout() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var sw = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || H > W * 1.15;
    S = Math.min(W, H) || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // =====================================================================
  // THE SIGNAL MODEL
  // One closed-form state drives both the image and (once enabled) the
  // WebAudio graph. Everything drawn is a function of:
  //   epochs[]    reseed records { t, seed, params }
  //   pitchPts[]  drag pitch control points { t, m }
  //   gongs[]     gong events { t0, x, y } (seeded schedule + taps)
  //   t           seconds since load
  // =====================================================================

  var BASE_TONES = [55.0, 49.0, 61.74, 65.41];  // A1, G1, B1, C2
  var TWIN = 7.0;                               // waveform window, seconds

  function epochParams(seed) {
    var rng = mulberry32(seed);
    var p = {};
    p.baseIdx = Math.floor(rng() * BASE_TONES.length);
    p.fv = 0.85 * (BASE_TONES[p.baseIdx] / 55.0);       // visual drone rate at m = 1
    // filtered-noise approximation: slow random-phase components (spatial + temporal)
    p.noise = [];
    for (var k = 0; k < 4; k++) {
      p.noise.push({
        a: 0.16 + rng() * 0.14,
        g: 0.6 + rng() * 1.8,          // spatial cycles across the frame
        h: (rng() - 0.5) * 0.22,       // temporal drift, cycles per second
        psi: rng() * Math.PI * 2
      });
    }
    // voice-thread wander components
    p.thread = [];
    for (var j = 0; j < 3; j++) {
      p.thread.push({
        b: [0.55, 0.30, 0.15][j],
        pk: 0.7 + rng() * 1.1,
        qk: (rng() - 0.5) * 0.16,
        psi: rng() * Math.PI * 2
      });
    }
    // seeded gong schedule (gaps and strike points), relative to epoch start
    p.gongGaps = [];
    p.gongPos = [];
    var acc = 4.5 + rng() * 4.0;
    for (var i = 0; i < 140; i++) {
      p.gongGaps.push(acc);
      p.gongPos.push({ x: 0.15 + rng() * 0.7, y: 0.14 + rng() * 0.48 });
      acc += 6.5 + rng() * 7.0;
    }
    return p;
  }

  var epochs = [{ t: 0, seed: 864106, params: null }];
  epochs[0].params = epochParams(epochs[0].seed);
  var seedCounter = 0;

  function epochAt(tau) {
    var e = epochs[0];
    for (var i = 0; i < epochs.length; i++) {
      if (epochs[i].t <= tau) e = epochs[i]; else break;
    }
    return e;
  }

  // ---------- pitch state from drags ----------
  // m(t): 1 before the first control point, linear between points,
  // exponential decay back to 1 after the last point.
  var pitchPts = [];
  var TAU_DECAY = 2.2;

  function pitchAt(t) {
    var n = pitchPts.length;
    if (n === 0 || t <= pitchPts[0].t) return n === 0 ? 1 : pitchPts[0].m;
    for (var i = 1; i < n; i++) {
      if (t <= pitchPts[i].t) {
        var a = pitchPts[i - 1], b = pitchPts[i];
        var k = (t - a.t) / Math.max(1e-6, b.t - a.t);
        return a.m + (b.m - a.m) * k;
      }
    }
    var last = pitchPts[n - 1];
    return 1 + (last.m - 1) * Math.exp(-(t - last.t) / TAU_DECAY);
  }

  // M(tau) = integral of m from 0 to tau (m = 1 for tau < 0 handled by caller sign)
  function pitchIntegral(tau) {
    if (tau <= 0) return tau; // m = 1 before load
    var n = pitchPts.length;
    if (n === 0) return tau;
    var acc = 0, prevT = 0, prevM = 1;
    for (var i = 0; i < n; i++) {
      var p = pitchPts[i];
      if (tau <= p.t) {
        var k = (tau - prevT) / Math.max(1e-6, p.t - prevT);
        var mTau = prevM + (p.m - prevM) * k;
        acc += (prevM + mTau) * 0.5 * (tau - prevT);
        return acc;
      }
      acc += (prevM + p.m) * 0.5 * (p.t - prevT);
      prevT = p.t; prevM = p.m;
    }
    // decay tail
    var dt = tau - prevT;
    acc += dt + (prevM - 1) * TAU_DECAY * (1 - Math.exp(-dt / TAU_DECAY));
    return acc;
  }

  // Phase integral of the visual drone rate: integral of fv(epoch) * m over [0, tau].
  // For tau < 0, fv of epoch 0 and m = 1.
  function phaseIntegral(tau) {
    if (tau <= 0) return epochs[0].params.fv * tau;
    var acc = 0;
    for (var i = 0; i < epochs.length; i++) {
      var e0 = epochs[i].t;
      var e1 = (i + 1 < epochs.length) ? epochs[i + 1].t : Infinity;
      if (tau <= e0) break;
      var hi = Math.min(tau, e1);
      acc += epochs[i].params.fv * (pitchIntegral(hi) - pitchIntegral(e0));
      if (tau <= e1) break;
    }
    return acc;
  }

  // ---------- the waveform (drone body) ----------
  function waveAt(u, tau, ep) {
    var ph = phaseIntegral(tau);
    var s = 0.62 * Math.sin(2 * Math.PI * ph + 0.4)
          + 0.38 * Math.sin(2 * Math.PI * ph * 1.03 + 2.1);
    var nz = 0;
    for (var k = 0; k < ep.noise.length; k++) {
      var c = ep.noise[k];
      nz += c.a * Math.sin(2 * Math.PI * (c.g * u + c.h * tau) + c.psi);
    }
    return s * 0.78 + nz;
  }

  // high-frequency energy estimate, from the same model (fast component + gongs)
  function hfEnergy(t) {
    var fast = Math.sin(2 * Math.PI * phaseIntegral(t) * 7.4 + 1.3);
    var e = 0.30 + 0.34 * fast * fast;
    for (var i = 0; i < gongs.length; i++) {
      var age = t - gongs[i].t0;
      if (age > 0 && age < 1.5) e += 0.45 * Math.exp(-age * 2.2);
    }
    return clamp01(e);
  }

  // low envelope: slow beating of the drone + gong pulses
  function lowEnv(t) {
    var e = 0.52 + 0.26 * Math.sin(2 * Math.PI * 0.13 * t + 1.1)
                  + 0.18 * Math.sin(2 * Math.PI * 0.041 * t + 0.5);
    for (var i = 0; i < gongs.length; i++) {
      var age = t - gongs[i].t0;
      if (age > 0 && age < 3.2) e += 0.5 * (1 - age / 3.2) * Math.exp(-age * 0.7);
    }
    return clamp(e, 0.08, 1.25);
  }

  // ---------- gongs ----------
  // The initial epoch carries one pre-gong just before t = 0 so frame one
  // already shows a ring expanding.
  var gongs = [{ t0: -0.8, x: 0.63, y: 0.40 }];
  var seededGongsDone = {}; // epoch index -> count materialised

  function materialiseGongs(uptoT) {
    for (var ei = 0; ei < epochs.length; ei++) {
      var ep = epochs[ei];
      var done = seededGongsDone[ei] || 0;
      var gaps = ep.params.gongGaps, pos = ep.params.gongPos;
      while (done < gaps.length && ep.t + gaps[done] <= uptoT) {
        gongs.push({ t0: ep.t + gaps[done], x: pos[done].x, y: pos[done].y });
        done++;
      }
      seededGongsDone[ei] = done;
    }
  }

  function gongFreq(yNorm) {
    return 320 * Math.pow(2, (0.5 - yNorm) * 1.2);
  }

  // =====================================================================
  // AUDIO (lazy, guarded; plays the same model the image draws)
  // =====================================================================
  var AC = null, master = null, droneOsc = [], noiseGain = null, audioOn = false;
  var lastAudioT = -1;

  function initAudio() {
    if (audioOn) return;
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
    try {
      var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext : webkitAudioContext;
      AC = new Ctor();
      var comp = AC.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 8;
      master = AC.createGain();
      master.gain.value = 0.14;
      master.connect(comp); comp.connect(AC.destination);

      var ep = epochs[epochs.length - 1];
      var f = BASE_TONES[ep.params.baseIdx];
      var mk = function (freq, gain) {
        var o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
        var g = AC.createGain(); g.gain.value = gain;
        o.connect(g); g.connect(master); o.start();
        return o;
      };
      droneOsc = [mk(f, 0.5), mk(f * 1.03, 0.32)];

      // looped noise bed through a lowpass (the model's noise body)
      var len = AC.sampleRate * 2;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      var rng = mulberry32(4242);
      var lp = 0;
      for (var i = 0; i < len; i++) { lp = lp * 0.98 + (rng() * 2 - 1) * 0.02; d[i] = lp * 3.2; }
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var filt = AC.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 320;
      noiseGain = AC.createGain(); noiseGain.gain.value = 0.16;
      src.connect(filt); filt.connect(noiseGain); noiseGain.connect(master);
      src.start();
      audioOn = true;
    } catch (err) { AC = null; audioOn = false; }
  }

  function playGong(freq) {
    if (!audioOn || !AC) return;
    try {
      var t0 = AC.currentTime;
      var o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
      var o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.76;
      var g = AC.createGain();
      g.gain.setValueAtTime(0.5, t0);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + 3.4);
      var g2 = AC.createGain();
      g2.gain.setValueAtTime(0.10, t0);
      g2.gain.exponentialRampToValueAtTime(0.0008, t0 + 1.1);
      o.connect(g); o2.connect(g2); g.connect(master); g2.connect(master);
      o.start(t0); o.stop(t0 + 3.5); o2.start(t0); o2.stop(t0 + 1.2);
    } catch (err) { /* silent */ }
  }

  function audioFrame(t) {
    if (!audioOn || !AC) return;
    var ep = epochs[epochs.length - 1];
    var f = BASE_TONES[ep.params.baseIdx] * pitchAt(t);
    var ct = AC.currentTime;
    droneOsc[0].frequency.setTargetAtTime(f, ct, 0.08);
    droneOsc[1].frequency.setTargetAtTime(f * 1.03, ct, 0.08);
    // fire seeded gongs whose moment has arrived
    if (lastAudioT < 0) lastAudioT = t;
    for (var i = 0; i < gongs.length; i++) {
      if (gongs[i].t0 > lastAudioT && gongs[i].t0 <= t) playGong(gongFreq(gongs[i].y));
    }
    lastAudioT = t;
  }

  // =====================================================================
  // INTERACTION (recorded; the draw is a closed-form function of it + t)
  // =====================================================================
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function nowT() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - T0) / 1000;
    return 0;
  }

  var pDown = null;       // { t, x, y, id }
  var dragging = false;
  var dragStartX = 0;
  var lastTap = null;     // { t }
  var pendingTap = null;  // { fireT, x, y }

  function flushPendingTap(t) {
    if (pendingTap && t >= pendingTap.fireT) {
      gongs.push({ t0: pendingTap.fireT, x: pendingTap.x / W, y: pendingTap.y / H });
      if (audioOn) playGong(gongFreq(pendingTap.y / H));
      pendingTap = null;
    }
  }

  function onDown(e) {
    initAudio();
    if (AC && AC.state === 'suspended' && AC.resume) AC.resume();
    var t = nowT();
    pDown = { t: t, x: e.clientX, y: e.clientY, id: e.pointerId };
    dragging = false;
    dragStartX = e.clientX;
    // anchor the pitch curve so a new drag continues from the current m
    pitchPts.push({ t: t, m: pitchAt(t) });
    if (pitchPts.length > 400) pitchPts.splice(0, pitchPts.length - 400);
  }

  function onMove(e) {
    if (!pDown || e.pointerId !== pDown.id) return;
    var dx = e.clientX - dragStartX;
    var dy = e.clientY - pDown.y;
    if (!dragging && Math.sqrt(dx * dx + dy * dy) > 10) dragging = true;
    if (dragging) {
      var t = nowT();
      var target = 1 + clamp(dx / (W * 0.45), -0.75, 1.5);
      var last = pitchPts[pitchPts.length - 1];
      if (!last || t - last.t > 0.03 || Math.abs(target - last.m) > 0.02) {
        pitchPts.push({ t: t, m: target });
      }
    }
  }

  function onUp(e) {
    if (!pDown || e.pointerId !== pDown.id) return;
    var t = nowT();
    if (dragging) {
      pitchPts.push({ t: t, m: pitchAt(t) });
    } else if (t - pDown.t < 0.35) {
      // tap: defer briefly so a double-tap can cancel it into a reseed
      if (lastTap && t - lastTap.t < 0.38) {
        pendingTap = null;
        lastTap = null;
        seedCounter++;
        var seed = 864106 + seedCounter * 7919;
        var ep = { t: t, seed: seed, params: epochParams(seed) };
        epochs.push(ep);
        if (audioOn && AC) {
          var f = BASE_TONES[ep.params.baseIdx] * pitchAt(t);
          droneOsc[0].frequency.setTargetAtTime(f, AC.currentTime, 0.15);
          droneOsc[1].frequency.setTargetAtTime(f * 1.03, AC.currentTime, 0.15);
        }
      } else {
        pendingTap = { fireT: t + 0.30, x: pDown.x, y: pDown.y };
        lastTap = { t: t };
      }
    }
    pDown = null;
    dragging = false;
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // =====================================================================
  // DRAW
  // =====================================================================
  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    materialiseGongs(t + 0.01);
    flushPendingTap(t);
    var ep = epochAt(t).params;

    // ---- drone terrain: successive traces of the one waveform ----
    var layers = 5;
    for (var j = layers - 1; j >= 0; j--) {
      var baseY = H * (0.40 + j * 0.115);
      var amp = S * (0.045 + j * 0.013);
      var lag = j * 0.55;
      var step = Math.max(4, Math.round(W / 160));
      ctx.beginPath();
      var first = true;
      for (var x = 0; x <= W; x += step) {
        var u = x / W;
        var tau = t - (1 - u) * TWIN - lag;
        var y = baseY - waveAt(u, tau, epochAt(Math.max(tau, 0)).params) * amp;
        if (first) { ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
      ctx.fillStyle = rgba(TERRAIN, 0.10 + (layers - j) * 0.012);
      ctx.fill();
      ctx.beginPath();
      first = true;
      for (var x2 = 0; x2 <= W; x2 += step) {
        var u2 = x2 / W;
        var tau2 = t - (1 - u2) * TWIN - lag;
        var y2 = baseY - waveAt(u2, tau2, epochAt(Math.max(tau2, 0)).params) * amp;
        if (first) { ctx.moveTo(x2, y2); first = false; } else { ctx.lineTo(x2, y2); }
      }
      ctx.strokeStyle = rgba(TERRAIN, 0.34 + (layers - 1 - j) * 0.10);
      ctx.lineWidth = (j === 0 ? 2 : 1.2);
      ctx.stroke();
    }

    // ---- sub-bass bloom (low; laid over the terrain fills so the
    // crimson reads, at very low alpha: felt more than seen) ----
    var env = lowEnv(t);
    var bx = W * 0.5, by = H * 0.90;
    var br = S * (0.30 + 0.22 * env);
    var bloomA = 0.06 + 0.06 * clamp01(env - 0.35);
    ctx.fillStyle = rgba(BLOOM, bloomA * 0.6);
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(BLOOM, bloomA * 0.85);
    ctx.beginPath(); ctx.arc(bx, by, br * 0.66, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(BLOOM, bloomA);
    ctx.beginPath(); ctx.arc(bx, by, br * 0.38, 0, Math.PI * 2); ctx.fill();

    // ---- gong rings ----
    for (var gi = 0; gi < gongs.length; gi++) {
      var g = gongs[gi];
      var age = t - g.t0;
      if (age < 0 || age > 4.5) continue;
      var gx = g.x * W, gy = g.y * H;
      var fade = 1 - age / 4.5;
      for (var k = 2; k >= 0; k--) {
        var r = (age * 0.16 + k * 0.05) * S;
        if (r <= 0.5) continue;
        ctx.beginPath(); ctx.arc(gx, gy, r, 0, Math.PI * 2);
        ctx.strokeStyle = rgba(GONG, 0.62 * fade / (1 + k * 0.9));
        ctx.lineWidth = k === 0 ? 2 : 1.2;
        ctx.stroke();
      }
      if (age < 0.35) {
        ctx.fillStyle = rgba(GONG, 0.5 * (1 - age / 0.35));
        ctx.beginPath(); ctx.arc(gx, gy, S * 0.012, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ---- voice thread (upper third) ----
    var hf = hfEnergy(t);
    var threadBase = H * (isPhone ? 0.17 : 0.20);
    var threadAmp = S * 0.075;
    ctx.beginPath();
    var steps = 90;
    for (var i2 = 0; i2 <= steps; i2++) {
      var uu = i2 / steps;
      var wob = 0;
      for (var c2 = 0; c2 < ep.thread.length; c2++) {
        var tc = ep.thread[c2];
        wob += tc.b * Math.sin(2 * Math.PI * (tc.pk * uu + tc.qk * t) + tc.psi);
      }
      var px = uu * W;
      var py = threadBase + wob * threadAmp + Math.sin(uu * 9.0 + t * 0.7) * threadAmp * 0.12;
      if (i2 === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = rgba(THREAD, 0.16 + 0.62 * hf);
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.strokeStyle = rgba(THREAD, 0.05 + 0.16 * hf);
    ctx.lineWidth = 3.2;
    ctx.stroke();
  }

  // ---------- boot ----------
  layout();
  draw(0);

  function frame() {
    var t = nowT();
    draw(t);
    audioFrame(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

  function onResize() {
    layout();
    draw(nowT());
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  if (window.addEventListener) window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
