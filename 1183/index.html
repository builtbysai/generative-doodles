<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Asemic Score</title>
<style>
  html, body { margin:0; padding:0; background:#26221C; height:100%; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

// ---------- Asemic Score — Jason Soliday study SD8 ----------
// A page of meaningless glyphs in six staves. A scan line descends the page
// (one staff per 8 s, 48 s per page) and PERFORMS what it crosses: each glyph
// lights red and fires a visual event shaped by its own primary primitive —
// arc -> expanding arc, dot -> pulse, vertical -> falling line,
// spiral -> expanding ring, cross -> scatter of four ticks.
// Fired glyphs stay lit for the rest of the page; tapping a glyph fires it
// early (reading ahead). At the bottom the page wipes and a fresh page is
// generated from the next seed — the score is never the same twice.
// Everything is a closed-form function of piece time t; taps are recorded
// events. No text is drawn anywhere on the page: the writing is asemic.

var PAPER = '#F2EDE3';
var STAFF = '#D8D0BF';
var INK   = '#2B2B30';
var LIT   = '#C33E3E';
var SCAN  = '#2E7D7B';
var EVT_COLORS = ['#2E7D7B', '#C33E3E', '#E8A93D'];
var DESK  = '#26221C';

var SEED = 1183007;         // master seed
var PAGE_T = 48;            // seconds per page
var STAFF_T = 8;            // seconds per staff
var SWEEP_T = 6;            // glyphs fire left-to-right across most of the staff's 8 s window
var EVT_T = 2.2;            // event lifetime
var T0 = 21;                // fixed first-frame phase: page 0, staff 3 crossing

// ---------- seeded hash / rng ----------
function hash2(a, b){
  var h = (a * 374761393 + b * 668265263 + SEED * 974634) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function glyphHash(p, s, i, k){ return hash2((p * 131 + s * 17 + i) | 0, k | 0); }

// ---------- view / canvas ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, lastT = T0;

function viewW(){
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  if (vv && vv.width) return vv.width;
  return window.innerWidth || 800;
}
function viewH(){
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  if (vv && vv.height) return vv.height;
  return window.innerHeight || 800;
}
function isPhone(){
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw || 9999, sh || 9999);
  if (mn < 700) return true;
  return H > W * 1.15;
}
function fit(){
  W = viewW(); H = viewH();
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
if (window.visualViewport && window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize', function(){ fit(); draw(lastT); });
}
if (window.addEventListener){
  window.addEventListener('resize', function(){ fit(); draw(lastT); });
}

// ---------- page geometry ----------
function geom(){
  var phone = isPhone();
  var mx = phone ? W * 0.045 : Math.min(W * 0.07, 90);
  var my = phone ? H * 0.035 : Math.min(H * 0.06, 56);
  var px = mx, py = my, pw = W - mx * 2, ph = H - my * 2;
  var padX = pw * 0.075;
  var headerH = ph * 0.10;
  var stavesTop = py + headerH + ph * 0.045;
  var stavesBot = py + ph - ph * 0.075;
  return {
    phone: phone, px: px, py: py, pw: pw, ph: ph,
    left: px + padX, right: px + pw - padX,
    headerY: py + headerH * 0.58,
    stavesTop: stavesTop, stavesBot: stavesBot,
    staffH: (stavesBot - stavesTop) / 6
  };
}

// ---------- glyph model ----------
// primitives: 0 arc, 1 dot, 2 vertical, 3 spiral, 4 cross
function glyphCount(p, s){ return 12 + Math.floor(glyphHash(p, s, 999, 1) * 9); } // 12..20

function glyphAt(g, p, s, i){
  var n = glyphCount(p, s);
  var slot = (g.right - g.left) / n;
  var jx = (glyphHash(p, s, i, 2) - 0.5) * slot * 0.22;
  var x = g.left + slot * (i + 0.5) + jx;
  var base = g.stavesTop + g.staffH * (s + 0.62);
  var yjit = (glyphHash(p, s, i, 3) - 0.5) * g.staffH * 0.10;
  var nPrim = 1 + Math.floor(glyphHash(p, s, i, 4) * 3); // 1..3
  var prims = [];
  for (var k = 0; k < nPrim; k++){
    prims.push(Math.floor(glyphHash(p, s, i, 10 + k) * 5));
  }
  var size = Math.min(g.staffH * (0.30 + glyphHash(p, s, i, 5) * 0.10), slot * 0.55);
  return {
    x: x, y: base + yjit, size: size, prims: prims,
    xFrac: (x - g.left) / (g.right - g.left),
    colorIdx: Math.floor(glyphHash(p, s, i, 6) * 3),
    staff: s, idx: i
  };
}
function scanFireTime(pageStart, gl){
  return pageStart + gl.staff * STAFF_T + gl.xFrac * SWEEP_T;
}

// taps: map "page:staff:idx" -> tapped fire time (piece time)
var taps = {};

// ---------- primitive drawing ----------
// All arcs drawn as standalone paths with a moveTo first (node-canvas lesson).
function primPath(kind, x, y, r, seedv){
  var rot = seedv * Math.PI * 2;
  ctx.beginPath();
  if (kind === 0){ // arc: half-ish circle stroke
    var a0 = rot, a1 = rot + Math.PI * (0.9 + seedv * 0.7);
    ctx.moveTo(x + r * Math.cos(a0), y + r * Math.sin(a0));
    ctx.arc(x, y, r, a0, a1);
  } else if (kind === 1){ // dot
    ctx.moveTo(x + r * 0.34, y);
    ctx.arc(x, y, r * 0.34, 0, Math.PI * 2);
  } else if (kind === 2){ // vertical with serif ticks
    ctx.moveTo(x, y - r);
    ctx.lineTo(x, y + r);
    ctx.moveTo(x - r * 0.45, y - r);
    ctx.lineTo(x + r * 0.45, y - r);
    ctx.moveTo(x - r * 0.45, y + r);
    ctx.lineTo(x + r * 0.45, y + r);
  } else if (kind === 3){ // spiral: 1.5-turn polyline
    var steps = 14;
    for (var k = 0; k <= steps; k++){
      var f = k / steps, ang = rot + f * Math.PI * 3, rr = r * (0.12 + 0.88 * f);
      var sx = x + rr * Math.cos(ang), sy = y + rr * Math.sin(ang);
      if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
  } else { // cross
    ctx.moveTo(x - r * 0.8, y); ctx.lineTo(x + r * 0.8, y);
    ctx.moveTo(x, y - r * 0.8); ctx.lineTo(x, y + r * 0.8);
  }
}

function drawGlyph(gl, p, lit){
  var r = gl.size;
  ctx.strokeStyle = lit ? LIT : INK;
  ctx.fillStyle = lit ? LIT : INK;
  ctx.lineWidth = lit ? 2.4 : 1.7;
  ctx.lineCap = 'round';
  for (var k = 0; k < gl.prims.length; k++){
    var kind = gl.prims[k];
    var ox = (k - (gl.prims.length - 1) / 2) * r * 0.85;
    var oy = (k % 2 === 0 ? 0 : -r * 0.18);
    primPath(kind, gl.x + ox, gl.y + oy, r * 0.62, glyphHash(p, gl.staff, gl.idx, 20 + k));
    if (kind === 1) ctx.fill(); else ctx.stroke();
  }
}

// ---------- events ----------
function drawEvent(gl, p, age){
  var f = age / EVT_T;                       // 0..1
  var step = Math.floor(f * 5);              // 5 alpha steps
  var alpha = 1 - step * 0.18;
  var col = EVT_COLORS[gl.colorIdx];
  var kind = gl.prims[0];
  var x = gl.x, y = gl.y, R = gl.size * (1.2 + f * 3.4);
  ctx.save();
  ctx.globalAlpha = Math.max(0.12, alpha);
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  if (kind === 0){ // expanding arc
    var a0 = glyphHash(p, gl.staff, gl.idx, 30) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(x + R * Math.cos(a0), y + R * Math.sin(a0));
    ctx.arc(x, y, R, a0, a0 + Math.PI * 1.35);
    ctx.stroke();
  } else if (kind === 1){ // pulse: ring + core
    ctx.beginPath();
    ctx.moveTo(x + R * 0.7, y);
    ctx.arc(x, y, R * 0.7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + gl.size * 0.3, y);
    ctx.arc(x, y, gl.size * 0.3 * (1 - f * 0.5), 0, Math.PI * 2);
    ctx.fill();
  } else if (kind === 2){ // falling line
    var len = gl.size * 1.1;
    var y0 = y + f * gl.size * 7;
    ctx.beginPath();
    ctx.moveTo(x, y0 - len); ctx.lineTo(x, y0);
    ctx.moveTo(x - gl.size * 0.3, y0); ctx.lineTo(x + gl.size * 0.3, y0);
    ctx.stroke();
  } else if (kind === 3){ // expanding ring
    ctx.beginPath();
    ctx.moveTo(x + R, y);
    ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + R * 0.55, y);
    ctx.arc(x, y, R * 0.55, 0, Math.PI * 2);
    ctx.stroke();
  } else { // cross: scatter of four ticks
    var d = gl.size * (0.5 + f * 2.6);
    var tl = gl.size * 0.42;
    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    ctx.beginPath();
    for (var k = 0; k < 4; k++){
      var cx = x + dirs[k][0] * d, cy = y + dirs[k][1] * d;
      if (dirs[k][0] !== 0){ ctx.moveTo(cx - tl, cy); ctx.lineTo(cx + tl, cy); }
      else { ctx.moveTo(cx, cy - tl); ctx.lineTo(cx, cy + tl); }
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- header: a row of larger decorative glyphs (not letters) ----------
function drawHeader(g, p){
  var n = 7;
  for (var i = 0; i < n; i++){
    var kind = Math.floor(glyphHash(p, 77, i, 40) * 5);
    var x = g.left + (g.right - g.left) * (i + 0.5) / n;
    var r = g.staffH * 0.30;
    ctx.strokeStyle = INK; ctx.fillStyle = INK;
    ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    primPath(kind, x, g.headerY, r, glyphHash(p, 77, i, 41));
    if (kind === 1) ctx.fill(); else ctx.stroke();
  }
  // header rule
  ctx.strokeStyle = STAFF; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(g.left, g.headerY + g.staffH * 0.52);
  ctx.lineTo(g.right, g.headerY + g.staffH * 0.52);
  ctx.stroke();
}

// page number as dots (count = page index + 1, capped pattern)
function drawPageDots(g, p){
  var n = (p % 9) + 1;
  ctx.fillStyle = INK;
  for (var i = 0; i < n; i++){
    var x = g.right - i * 13, y = g.py + g.ph - g.staffH * 0.28;
    ctx.beginPath();
    ctx.moveTo(x + 3, y);
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- draw ----------
function draw(t){
  lastT = t;
  var g = geom();
  // desk
  ctx.fillStyle = DESK;
  ctx.fillRect(0, 0, W, H);
  // paper
  ctx.fillStyle = PAPER;
  ctx.fillRect(g.px, g.py, g.pw, g.ph);

  var page = Math.floor(t / PAGE_T);
  var pageStart = page * PAGE_T;
  var pageTime = t - pageStart;

  drawHeader(g, page);
  drawPageDots(g, page);

  // staff rules
  ctx.strokeStyle = STAFF; ctx.lineWidth = 1.2;
  for (var s = 0; s < 6; s++){
    var by = g.stavesTop + g.staffH * (s + 0.62);
    ctx.beginPath();
    ctx.moveTo(g.left, by + g.staffH * 0.30);
    ctx.lineTo(g.right, by + g.staffH * 0.30);
    ctx.stroke();
  }

  // page wipe: for the first 0.4 s a soft sweep band crosses the new page
  var wipeF = pageTime < 0.4 ? pageTime / 0.4 : 1;

  // glyphs + events
  for (var st = 0; st < 6; st++){
    var n = glyphCount(page, st);
    for (var i = 0; i < n; i++){
      var gl = glyphAt(g, page, st, i);
      if (wipeF < 1 && gl.xFrac > wipeF) continue;   // not yet revealed by the wipe
      var ft = scanFireTime(pageStart, gl);
      var key = page + ':' + st + ':' + i;
      if (taps[key] !== undefined && taps[key] < ft) ft = taps[key];
      var fired = t >= ft;
      drawGlyph(gl, page, fired);
      if (fired){
        var age = t - ft;
        if (age < EVT_T) drawEvent(gl, page, age);
      }
    }
  }

  // wipe sweep edge
  if (wipeF < 1){
    var wx = g.left + (g.right - g.left) * wipeF;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(wx - 3, g.py + 4, 6, g.ph - 8);
    ctx.restore();
  }

  // scan line
  var scanY = g.stavesTop + (pageTime / PAGE_T) * (g.stavesBot - g.stavesTop);
  ctx.save();
  ctx.globalAlpha = 0.6;
  ctx.strokeStyle = SCAN; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(g.left - g.pw * 0.02, scanY);
  ctx.lineTo(g.right + g.pw * 0.02, scanY);
  ctx.stroke();
  ctx.restore();
}

// ---------- interaction: tap a glyph to fire it early ----------
function onTap(cx, cy){
  var g = geom();
  var page = Math.floor(lastT / PAGE_T);
  var best = null, bestD = 1e9;
  for (var st = 0; st < 6; st++){
    var n = glyphCount(page, st);
    for (var i = 0; i < n; i++){
      var gl = glyphAt(g, page, st, i);
      var dx = cx - gl.x, dy = cy - gl.y;
      var d = dx * dx + dy * dy;
      if (d < bestD){ bestD = d; best = { gl: gl, st: st, i: i }; }
    }
  }
  if (!best) return;
  var ft = scanFireTime(page * PAGE_T, best.gl);
  var key = page + ':' + best.st + ':' + best.i;
  if (lastT < ft && bestD < Math.pow(g.staffH * 0.75, 2)){
    taps[key] = lastT;
    draw(lastT);
  }
}
if (canvas.addEventListener){
  canvas.addEventListener('pointerdown', function(e){ onTap(e.clientX || 0, e.clientY || 0); });
  canvas.addEventListener('mousedown', function(e){ onTap(e.clientX || 0, e.clientY || 0); });
  canvas.addEventListener('touchstart', function(e){
    if (e.touches && e.touches[0]) onTap(e.touches[0].clientX || 0, e.touches[0].clientY || 0);
  });
}

// ---------- run ----------
function clockNow(){
  if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
  return Date.now() / 1000;
}
fit();
draw(T0);
var boot = clockNow();
function frame(){
  draw(T0 + (clockNow() - boot));
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
