<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wallpaper Museum</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #8a7a64; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG: mulberry32, never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1443000);

  // Pure deterministic displacement for a work's re-hang in a given cycle.
  function cycleDisp(work, cycle) {
    var r = mulberry32(1443000 + work * 7919 + cycle * 131);
    return { dx: (r() - 0.5) * 52, dy: (r() - 0.5) * 36 };
  }

  var W = 0, H = 0, T = 0;
  var pan = 0;
  var bays = [];
  var works = [];
  var userDelta = {}; // work index -> {dx, dy} from visitor re-hanging
  var drag = null; // {kind, ...}

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
    return H > W * 1.15;
  }

  function size() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width && window.visualViewport.height) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth && window.innerHeight) {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1280; h = 900; }
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    buildWall();
    draw(T);
  }

  // Wall layout, generated once per size in a fixed order (deterministic).
  function buildWall() {
    var r = mulberry32(1443000 + 77);
    var types = ['floral', 'geometric', 'stripe', 'dot'];
    var widths = [0.62, 0.30, 0.55, 0.42, 0.58, 0.33, 0.50, 0.40];
    bays = [];
    var x = 0, i = 0;
    while (x < W * 4.2) {
      var bw = widths[i % widths.length] * W * (0.96 + r() * 0.08);
      bays.push({ type: types[i % types.length], x: x, w: bw });
      x += bw; i++;
    }
    var wallW = x;
    var base = Math.max(W, H) * 0.11;
    var kinds = ['painting', 'pillow', 'lamp', 'costume', 'photo'];
    works = [];
    for (var k = 0; k < 16; k++) {
      var wx = wallW * (k + 0.5) / 16 + (r() - 0.5) * 70;
      var wy = H * (0.16 + r() * 0.52);
      var ww = base * (0.85 + r() * 0.45);
      var wh = ww * (0.75 + r() * 0.5);
      works.push({
        kind: kinds[k % kinds.length],
        bx: wx, by: wy, w: ww, h: wh,
        rot: (r() - 0.5) * 0.07,
        tone: k % 3
      });
    }
    // One work deliberately overlaps a bay seam: straddle the seam of bay 2.
    if (bays.length > 2 && works.length > 5) {
      var seam = bays[2].x;
      works[5].bx = seam - works[5].w * 0.45;
      works[5].by = H * 0.42;
    }
    // Clamp pan to the new wall.
    var maxPan = Math.max(0, wallW - W);
    if (pan > maxPan) pan = maxPan;
    if (pan < 0) pan = 0;
  }

  function wallW() {
    if (!bays.length) return W;
    var last = bays[bays.length - 1];
    return last.x + last.w;
  }

  // Position of a work at time t (seconds), including re-hangs and visitor moves.
  function workPosAt(t, i, includeUser) {
    var wk = works[i];
    var cycle = Math.floor(t / 10);
    var p = (t % 10) / 10;
    var dx = 0, dy = 0;
    // Completed re-hangs: this work re-hangs in cycles c where c % 16 === i.
    for (var c = i; c < cycle; c += 16) {
      var d = cycleDisp(i, c);
      dx += d.dx; dy += d.dy;
    }
    var lift = 0, frac = 0;
    if (cycle % 16 === i) {
      var cd = cycleDisp(i, cycle);
      if (p < 0.25) { lift = Math.sin(p / 0.25 * Math.PI) * 16; frac = 0; }
      else if (p < 0.75) { lift = 16; frac = (p - 0.25) / 0.5; }
      else { lift = Math.sin((1 - p) / 0.25 * Math.PI) * 16; frac = 1; }
      dx += cd.dx * frac; dy += cd.dy * frac;
    }
    if (includeUser && userDelta[i]) { dx += userDelta[i].dx; dy += userDelta[i].dy; }
    return { x: wk.bx + dx, y: wk.by + dy - lift, lift: lift };
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  function dot(x, y, s, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }

  function disc(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBay(b, t) {
    var x0 = b.x - pan, x1 = x0 + b.w;
    if (x1 < 0 || x0 > W) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(Math.max(0, x0), 0, Math.min(W, x1) - Math.max(0, x0), H);
    ctx.clip();
    var tile = Math.min(W, H) * 0.22;
    if (b.type === 'floral') {
      rect(x0, 0, b.w, H, '#f2e8d8');
      var step = tile;
      for (var gx = Math.floor(x0 / step) * step; gx < x1 + step; gx += step) {
        for (var gy = 0; gy < H + step; gy += step) {
          var sway = Math.sin(t * 0.4 + gx * 0.01 + gy * 0.013) * 3;
          var fx = gx + step * 0.5 + sway, fy = gy + step * 0.5;
          // Leaf: small green rect, slightly rotated.
          ctx.save();
          ctx.translate(fx + step * 0.28, fy + step * 0.3);
          ctx.rotate(0.5);
          rect(-step * 0.09, -step * 0.03, step * 0.18, step * 0.06, '#4a7a2a');
          ctx.restore();
          // Rose: four petal rects + centre dot.
          var ps = step * 0.13;
          rect(fx - ps, fy - ps, ps, ps, '#c83a5a');
          rect(fx, fy - ps, ps, ps, '#c83a5a');
          rect(fx - ps, fy, ps, ps, '#c83a5a');
          rect(fx, fy, ps, ps, '#c83a5a');
          dot(fx, fy, step * 0.07, '#e8b83a');
        }
      }
    } else if (b.type === 'geometric') {
      rect(x0, 0, b.w, H, '#1a2a5a');
      var gs = tile * 0.62;
      for (var gx2 = Math.floor(x0 / gs) * gs; gx2 < x1 + gs; gx2 += gs) {
        for (var gy2 = 0; gy2 < H + gs; gy2 += gs) {
          var ox = ((Math.floor(gy2 / gs) % 2) === 0) ? 0 : gs / 2;
          var cx = gx2 + ox + gs / 2, cy = gy2 + gs / 2;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(Math.PI / 4);
          rect(-gs * 0.22, -gs * 0.22, gs * 0.44, gs * 0.44, '#e8b83a');
          ctx.restore();
          dot(cx, cy, gs * 0.08, '#1a2a5a');
        }
      }
    } else if (b.type === 'stripe') {
      rect(x0, 0, b.w, H, '#1a7a6a');
      var sw = tile * 0.42 * (1 + 0.06 * Math.sin(t * 0.5));
      var gap = tile * 0.42;
      for (var sx = Math.floor(x0 / (sw + gap)) * (sw + gap); sx < x1 + sw + gap; sx += sw + gap) {
        rect(sx, 0, sw, H, '#f2ead8');
      }
    } else { // dot
      rect(x0, 0, b.w, H, '#e86a4a');
      var ds = tile * 0.5;
      for (var dx2 = Math.floor(x0 / ds) * ds; dx2 < x1 + ds; dx2 += ds) {
        for (var dy2 = 0; dy2 < H + ds; dy2 += ds) {
          var wob = Math.sin(t * 0.3 + dx2 * 0.02 + dy2 * 0.017) * 2;
          dot(dx2 + ds / 2 + wob, dy2 + ds / 2, ds * 0.28, '#ffffff');
        }
      }
    }
    // Bay seam: thin shadow line at the right edge.
    rect(x1 - 2, 0, 2, H, '#8a7a64');
    ctx.restore();
  }

  function drawWork(wk, pos, t, lifted) {
    var cx = pos.x - pan, cy = pos.y;
    ctx.save();
    ctx.translate(cx + wk.w / 2, cy + wk.h / 2);
    ctx.rotate(wk.rot);
    ctx.translate(-wk.w / 2, -wk.h / 2);
    if (lifted) {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(-4, wk.h + 8, wk.w + 8, 6);
    }
    var tones = ['#c88a2a', '#5a3418', '#5a6a7a'];
    var tone = tones[wk.tone];
    if (wk.kind === 'painting') {
      rect(-4, -4, wk.w + 8, wk.h + 8, '#5a3418');
      rect(0, 0, wk.w, wk.h, tone);
      rect(wk.w * 0.12, wk.h * 0.15, wk.w * 0.4, wk.h * 0.35, '#e8b83a');
      disc(wk.w * 0.68, wk.h * 0.6, wk.w * 0.16, '#f2ead8');
    } else if (wk.kind === 'pillow') {
      rect(0, 0, wk.w, wk.h, tone);
      // Stitching dashes around the edge.
      ctx.fillStyle = '#e8d8b8';
      for (var sx = 6; sx < wk.w - 6; sx += 14) {
        ctx.fillRect(sx, 5, 7, 2);
        ctx.fillRect(sx, wk.h - 7, 7, 2);
      }
      disc(wk.w * 0.5, wk.h * 0.5, wk.w * 0.12, '#e8d8b8');
    } else if (wk.kind === 'lamp') {
      rect(wk.w * 0.46, wk.h * 0.55, wk.w * 0.08, wk.h * 0.4, '#5a3418');
      rect(wk.w * 0.3, wk.h * 0.92, wk.w * 0.4, wk.h * 0.08, '#5a3418');
      ctx.fillStyle = tone;
      ctx.beginPath();
      ctx.moveTo(wk.w * 0.18, wk.h * 0.55);
      ctx.lineTo(wk.w * 0.82, wk.h * 0.55);
      ctx.lineTo(wk.w * 0.68, wk.h * 0.08);
      ctx.lineTo(wk.w * 0.32, wk.h * 0.08);
      ctx.closePath();
      ctx.fill();
    } else if (wk.kind === 'costume') {
      ctx.fillStyle = tone;
      ctx.beginPath();
      ctx.moveTo(wk.w * 0.38, 0);
      ctx.lineTo(wk.w * 0.62, 0);
      ctx.lineTo(wk.w * 0.58, wk.h * 0.35);
      ctx.lineTo(wk.w * 0.85, wk.h);
      ctx.lineTo(wk.w * 0.15, wk.h);
      ctx.lineTo(wk.w * 0.42, wk.h * 0.35);
      ctx.closePath();
      ctx.fill();
      rect(wk.w * 0.3, wk.h * 0.32, wk.w * 0.4, wk.h * 0.06, '#e8d8b8');
    } else { // photo
      rect(-3, -3, wk.w + 6, wk.h + 6, '#f2f2ee');
      rect(wk.w * 0.08, wk.h * 0.08, wk.w * 0.84, wk.h * 0.68, '#5a6a7a');
      disc(wk.w * 0.62, wk.h * 0.34, wk.w * 0.1, '#e8b83a');
      rect(wk.w * 0.08, wk.h * 0.62, wk.w * 0.84, wk.h * 0.14, '#8a7a64');
    }
    ctx.restore();
  }

  function draw(t) {
    T = t;
    if (!W || !H) return;
    ctx.fillStyle = '#8a7a64';
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < bays.length; i++) drawBay(bays[i], t);
    // Works in order; the dragged work (if any) draws last, on top.
    var order = [];
    for (var k = 0; k < works.length; k++) order.push(k);
    if (drag && drag.kind === 'work') {
      var di = order.indexOf(drag.index);
      if (di >= 0) { order.splice(di, 1); order.push(drag.index); }
    }
    for (var j = 0; j < order.length; j++) {
      var wi = order[j];
      var pos = workPosAt(t, wi, true);
      drawWork(works[wi], pos, t, drag && drag.kind === 'work' && drag.index === wi);
    }
  }

  function canvasPos(ev) {
    var r = { left: 0, top: 0 };
    if (canvas.getBoundingClientRect) {
      try { r = canvas.getBoundingClientRect(); } catch (e) { /* shim: no rect */ }
    }
    var x = (ev.clientX !== undefined ? ev.clientX : 0) - (r.left || 0);
    var y = (ev.clientY !== undefined ? ev.clientY : 0) - (r.top || 0);
    return { x: x, y: y };
  }

  function hitWork(wx, wy) {
    // wx, wy in wall coordinates; test works topmost-first.
    for (var i = works.length - 1; i >= 0; i--) {
      var pos = workPosAt(T, i, true);
      if (wx >= pos.x - 10 && wx <= pos.x + works[i].w + 10 &&
          wy >= pos.y - 10 && wy <= pos.y + works[i].h + 10) return i;
    }
    return -1;
  }

  function onDown(ev) {
    var p = canvasPos(ev);
    var wx = p.x + pan;
    var idx = hitWork(wx, p.y);
    if (idx >= 0) {
      var pos = workPosAt(T, idx, true);
      drag = { kind: 'work', index: idx, grabX: wx - pos.x, grabY: p.y - pos.y };
    } else {
      drag = { kind: 'pan', startX: p.x, startPan: pan };
    }
    if (ev.preventDefault) ev.preventDefault();
  }

  function onMove(ev) {
    if (!drag) return;
    var p = canvasPos(ev);
    if (drag.kind === 'pan') {
      var maxPan = Math.max(0, wallW() - W);
      pan = drag.startPan - (p.x - drag.startX);
      if (pan < 0) pan = 0;
      if (pan > maxPan) pan = maxPan;
    } else {
      var wx = p.x + pan;
      var pos = workPosAt(T, drag.index, false);
      userDelta[drag.index] = {
        dx: (wx - drag.grabX) - pos.x,
        dy: (p.y - drag.grabY) - pos.y
      };
    }
    draw(T);
    if (ev.preventDefault) ev.preventDefault();
  }

  function onUp() { drag = null; }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', size);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', size);
    }
  }

  // Probe hook (no visible effect): lets QA drive time and inspect state.
  if (typeof window !== 'undefined') {
    window.__wallpaperMuseum = {
      draw: draw,
      getPan: function () { return pan; },
      getBays: function () { return bays.map(function (b) { return { type: b.type, x: b.x, w: b.w }; }); },
      getWorks: function (t) {
        var out = [];
        for (var i = 0; i < works.length; i++) {
          var pos = workPosAt(t, i, true);
          out.push({ kind: works[i].kind, x: pos.x, y: pos.y, w: works[i].w, h: works[i].h });
        }
        return out;
      },
      getWallW: wallW,
      listeners: { down: onDown, move: onMove, up: onUp }
    };
  }

  size();
  draw(0);

  // rAF loop, plain function declaration, typeof-guarded (node-canvas has none).
  var started = false;
  var startMs = 0;
  function loop(now) {
    if (!started) { started = true; startMs = now; }
    draw((now - startMs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
