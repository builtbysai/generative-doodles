<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtitle Inversion</title>
<style>
  html, body { margin: 0; padding: 0; background: #6B7683; overflow: hidden; width: 100%; height: 100%; }
  canvas { display: block; background: #6B7683; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Deterministic integer hash -> [0,1), for grain keyed by (dot, time index).
  function hash2(x, y) {
    var h = (x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = h ^ (h >>> 16);
    return (h >>> 0) / 4294967296;
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var RAIN = '#6B7683', CEDAR = '#2E4A38', RIVER = '#3E5A6B',
      BONE = '#D9D2C2', BARK = '#1E1A16';

  var W = 0, H = 0;
  var isPhone = false;
  var lastT = 0;

  function sizeFromViewport() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (typeof window !== 'undefined' ? window.innerWidth : 800);
    var h = vv ? vv.height : (typeof window !== 'undefined' ? window.innerHeight : 600);
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width; sh = window.screen.height; }
    var minDim = Math.min(sw || w, sh || h);
    isPhone = (sw > 0 && minDim < 700) || (h > w * 1.15);
  }

  // ---- Seeded glyph vocabularies (no atlas buffer; drawn per glyph) ----
  var rng = mulberry32(1368000);
  function buildScript(count) {
    var arr = [], i;
    for (i = 0; i < count; i++) {
      arr.push({ type: Math.floor(rng() * 6), w: 0.9 + rng() * 0.7, seed: 1368000 + i * 7919 });
    }
    return arr;
  }
  var HAND = buildScript(64);   // invented hand-drawn glyph script
  var GEO = buildScript(64);    // plain geometric pseudo-script
  function streamWidth(script, s) {
    var total = 0, i;
    for (i = 0; i < script.length; i++) total += script[i].w * s + s * 0.55;
    return total;
  }

  function drawGlyph(script, type, x, y, s, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1.5, s * 0.07);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var w = s;
    if (script === 0) { // hand-drawn script: curves, loops, hooks, dots
      if (type === 0) { // wavy line
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.lineTo(x + w * 0.33, y - s * 0.22); ctx.lineTo(x + w * 0.66, y + s * 0.18); ctx.lineTo(x + w, y - s * 0.1);
        ctx.stroke();
      } else if (type === 1) { // loop
        ctx.beginPath(); ctx.moveTo(x + s * 0.42, y - s * 0.1);
        ctx.arc(x + s * 0.42, y - s * 0.1, s * 0.32, 0, Math.PI * 2); ctx.stroke();
      } else if (type === 2) { // hook
        ctx.beginPath(); ctx.moveTo(x + w * 0.2, y - s * 0.5); ctx.lineTo(x + w * 0.2, y + s * 0.2);
        ctx.beginPath(); ctx.moveTo(x + w * 0.2, y + s * 0.2);
        ctx.arc(x + w * 0.45, y + s * 0.2, s * 0.25, Math.PI * 0.5, Math.PI * 1.5, true); ctx.stroke();
      } else if (type === 3) { // dot cluster
        var dx, dy, k;
        for (k = 0; k < 3; k++) {
          dx = x + w * (0.15 + k * 0.32); dy = y - s * 0.15 * (k % 2);
          ctx.beginPath(); ctx.moveTo(dx + s * 0.09, dy);
          ctx.arc(dx, dy, s * 0.09, 0, Math.PI * 2); ctx.fill();
        }
      } else if (type === 4) { // vertical stroke with dot
        ctx.beginPath(); ctx.moveTo(x + w * 0.5, y - s * 0.55); ctx.lineTo(x + w * 0.5, y + s * 0.25); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + w * 0.5 + s * 0.08, y - s * 0.7);
        ctx.arc(x + w * 0.5, y - s * 0.7, s * 0.08, 0, Math.PI * 2); ctx.fill();
      } else { // double arc
        ctx.beginPath(); ctx.moveTo(x + w * 0.45, y - s * 0.3);
        ctx.arc(x + w * 0.45, y - s * 0.05, s * 0.25, Math.PI, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + w * 0.45, y + s * 0.15);
        ctx.arc(x + w * 0.45, y + s * 0.4, s * 0.25, Math.PI, Math.PI * 2); ctx.stroke();
      }
    } else { // geometric pseudo-script: triangles, squares, bars, crosses, chevrons, diamonds
      if (type === 0) { // triangle
        ctx.beginPath(); ctx.moveTo(x + w * 0.5, y - s * 0.5); ctx.lineTo(x + w, y + s * 0.25); ctx.lineTo(x, y + s * 0.25); ctx.closePath(); ctx.stroke();
      } else if (type === 1) { // square
        ctx.strokeRect(x + w * 0.1, y - s * 0.4, s * 0.6, s * 0.6);
      } else if (type === 2) { // bar
        ctx.fillRect(x, y - s * 0.08, w, s * 0.16);
      } else if (type === 3) { // cross
        ctx.beginPath(); ctx.moveTo(x + w * 0.5, y - s * 0.5); ctx.lineTo(x + w * 0.5, y + s * 0.25); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y - s * 0.12); ctx.lineTo(x + w, y - s * 0.12); ctx.stroke();
      } else if (type === 4) { // chevron
        ctx.beginPath(); ctx.moveTo(x, y + s * 0.2); ctx.lineTo(x + w * 0.5, y - s * 0.4); ctx.lineTo(x + w, y + s * 0.2); ctx.stroke();
      } else { // diamond
        ctx.beginPath(); ctx.moveTo(x + w * 0.5, y - s * 0.5); ctx.lineTo(x + w, y - s * 0.05); ctx.lineTo(x + w * 0.5, y + s * 0.4); ctx.lineTo(x, y - s * 0.05); ctx.closePath(); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawStream(script, scriptId, offset, y, s, color, alpha) {
    var total = streamWidth(script, s);
    var start = -(((offset % total) + total) % total);
    var x = start, i = 0, g, gw;
    while (x < W + s * 2) {
      g = script[i % script.length];
      gw = g.w * s;
      drawGlyph(scriptId, g.type, x, y, s, color, alpha);
      x += gw + s * 0.55;
      i++;
    }
  }

  // ---- Drag state: recorded samples, closed-form over piece time ----
  var drags = [];       // {x0, dx, t, v}
  var activePointer = null;
  function dragOffset(t) {
    var sum = 0, i, d;
    for (i = 0; i < drags.length; i++) {
      d = drags[i];
      sum += d.dx * Math.exp(-(t - d.t) / 3);
    }
    if (sum > 320) sum = 320; if (sum < -320) sum = -320;
    return sum;
  }
  function slowBonus() {
    var total = 0, i, d;
    for (i = 0; i < drags.length; i++) {
      d = drags[i];
      if (Math.abs(d.v) < 120) total += Math.abs(d.dx);
    }
    if (total > 400) total = 400;
    return total / 50; // 0..8 s added to the swap cadence
  }

  function onDown(e) {
    activePointer = { id: e.pointerId, x: e.clientX, y: e.clientY, t: lastT };
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!activePointer || e.pointerId !== activePointer.id) return;
    var dx = e.clientX - activePointer.x;
    var dt = Math.max(0.05, lastT - activePointer.t);
    drags.push({ dx: dx, t: lastT, v: dx / dt });
    if (drags.length > 200) drags.shift();
    activePointer.x = e.clientX; activePointer.y = e.clientY; activePointer.t = lastT;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (activePointer && e.pointerId === activePointer.id) activePointer = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---- Landscape: periodic in world x, so the pan never wraps visibly ----
  var CELL = 90;
  function cellRand(cell, salt) { return hash2(cell * 7919 + salt, 1368); }
  function drawLandscape(t, pan) {
    var horizon = H * 0.55, groundH = H - horizon, x, i;
    // Sky
    ctx.fillStyle = RAIN; ctx.fillRect(0, 0, W, horizon);
    // Clouds at 0.3 parallax, flat alpha ellipses (own path + moveTo each).
    for (i = 0; i < 6; i++) {
      var cx = ((cellRand(i, 11) * (W + 500) - pan * 0.3) % (W + 500) + (W + 500)) % (W + 500) - 250;
      var cy = H * (0.06 + cellRand(i, 12) * 0.3), cw = 60 + cellRand(i, 13) * 120;
      ctx.globalAlpha = 0.12; ctx.fillStyle = BONE;
      ctx.beginPath(); ctx.moveTo(cx + cw * 0.5, cy);
      ctx.ellipse(cx, cy, cw * 0.5, cw * 0.14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // Distant ridge along the horizon (sine sums of world x).
    ctx.fillStyle = CEDAR; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.moveTo(0, horizon);
    for (x = 0; x <= W; x += 20) {
      var wx = x + pan;
      ctx.lineTo(x, horizon - (Math.sin(wx * 0.004) * 0.5 + Math.sin(wx * 0.011 + 2) * 0.5 + 1) * H * 0.045);
    }
    ctx.lineTo(W, horizon); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    // Ground
    ctx.fillStyle = CEDAR; ctx.fillRect(0, horizon, W, groundH);
    // River: meandering band through the ground, function of world x.
    ctx.fillStyle = RIVER;
    ctx.beginPath();
    for (x = 0; x <= W; x += 20) {
      var wx2 = x + pan;
      var cy2 = horizon + groundH * 0.5 + (Math.sin(wx2 * 0.003) * 0.6 + Math.sin(wx2 * 0.009 + 1) * 0.4) * groundH * 0.18;
      if (x === 0) ctx.moveTo(x, cy2 - groundH * 0.10); else ctx.lineTo(x, cy2 - groundH * 0.10);
    }
    for (x = W; x >= 0; x -= 20) {
      var wx3 = x + pan;
      var cy3 = horizon + groundH * 0.5 + (Math.sin(wx3 * 0.003) * 0.6 + Math.sin(wx3 * 0.009 + 1) * 0.4) * groundH * 0.18;
      ctx.lineTo(x, cy3 + groundH * 0.10);
    }
    ctx.closePath(); ctx.fill();
    // Trees: one seeded tree per 90 px world cell, depth-scaled.
    var firstCell = Math.floor(pan / CELL) - 1;
    var lastCell = Math.floor((pan + W) / CELL) + 1;
    var cell, tx, depth, th, tw, baseY;
    for (cell = firstCell; cell <= lastCell; cell++) {
      if (cellRand(cell, 21) < 0.3) continue;
      tx = cell * CELL + cellRand(cell, 22) * CELL - pan;
      depth = cellRand(cell, 23); // 0 far .. 1 near
      baseY = horizon + groundH * (0.25 + depth * 0.7);
      th = H * (0.10 + depth * 0.22);
      tw = th * 0.42;
      ctx.fillStyle = BARK;
      ctx.fillRect(tx - tw * 0.08, baseY - th * 0.45, tw * 0.16, th * 0.45);
      // Canopy a lighter cedar shade so foliage reads against the ground.
      ctx.fillStyle = '#3D5A49';
      ctx.beginPath(); ctx.moveTo(tx, baseY - th);
      ctx.lineTo(tx - tw * 0.55, baseY - th * 0.45); ctx.lineTo(tx + tw * 0.55, baseY - th * 0.45);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(tx, baseY - th * 0.8);
      ctx.lineTo(tx - tw * 0.45, baseY - th * 0.35); ctx.lineTo(tx + tw * 0.45, baseY - th * 0.35);
      ctx.closePath(); ctx.fill();
    }
  }

  function smoothstep(a) { return a <= 0 ? 0 : (a >= 1 ? 1 : a * a * (3 - 2 * a)); }

  function draw(t) {
    lastT = t;
    sizeFromViewport();
    var PAN_SPEED = 12; // px/s, right-to-left
    var pan = PAN_SPEED * t + dragOffset(t);
    drawLandscape(t, pan);

    // Swap clock: streams trade thirds every 40 s (+ slow-drag bonus up to 8 s).
    var phaseLen = 40 + slowBonus();
    var phaseIndex = Math.floor(t / phaseLen) % 2;
    var phaseT = t % phaseLen;
    var yLower = H * 0.72, yUpper = H * 0.22;
    var yTarget = phaseIndex === 0 ? yLower : yUpper;
    var yPair = yTarget;
    if (t >= phaseLen && phaseT < 3) {
      var yPrev = phaseIndex === 0 ? yUpper : yLower;
      yPair = yPrev + (yTarget - yPrev) * smoothstep(phaseT / 3);
    }
    // Lead script alternates each swap; subtitle is small beneath the lead.
    var leadIsHand = phaseIndex === 0;
    var leadScript = leadIsHand ? HAND : GEO;
    var leadId = leadIsHand ? 0 : 1;
    var subScript = leadIsHand ? GEO : HAND;
    var subId = leadIsHand ? 1 : 0;
    var leadSize = Math.max(22, Math.min(38, H * 0.05));
    var subSize = leadSize * 0.5;
    // Active subtitle scrolls LEFT at exactly the pan speed (woven into the
    // landscape); the lead scrolls right, floating.
    drawStream(leadScript, leadId, -t * 6, yPair, leadSize, BONE, 1);
    drawStream(subScript, subId, pan, yPair + leadSize * 0.95, subSize, BONE, 0.85);

    // Film grain: seeded dots, alpha a function of (dot, quantized 2 s index).
    var qi = Math.floor(t / 2), i, gx, gy, ga;
    ctx.fillStyle = BONE;
    for (i = 0; i < 240; i++) {
      gx = hash2(i, 31) * W; gy = hash2(i, 32) * H;
      ga = 0.02 + 0.05 * hash2(i * 7 + 1, qi);
      ctx.globalAlpha = ga;
      ctx.fillRect(gx, gy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  function onResize() { draw(lastT); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }

  draw(0); // frame one: constant phase, before the clock starts.
  var startMs = null;
  function loop(ms) {
    if (startMs === null) startMs = ms;
    draw((ms - startMs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
