<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Life, Stitched</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2EDE2; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var PAPER = '#F2EDE2';
  var DAY = '#FFFFFF';            // day stitches, near-invisible thread
  var ACHIEVE = '#E8B62D';        // achievement, yellow straight stitch
  var TRAVEL = '#2C3E70';         // travel, dark blue straight stitch
  var LOVE = '#C0392B';           // love, red straight stitch; break-up is the same red as an X
  var LOSS = '#1A1A1A';           // loss, black X
  var INK = '#23211C';            // legend ink, needle, fold shading

  var TYPE_COLOR = { achieve: ACHIEVE, travel: TRAVEL, love: LOVE, breakup: LOVE, loss: LOSS };
  var TYPE_LABEL = { achieve: 'achievement', travel: 'travel', love: 'love', breakup: 'break-up', loss: 'loss' };
  var TYPE_ORDER = ['achieve', 'travel', 'love', 'breakup', 'loss'];

  // Loop timing (seconds): sew 90, hold 10, fold shut 3, reopen 2.
  var SEW = 90, HOLD = 10, FOLD = 3, UNFOLD = 2;
  var LOOP = SEW + HOLD + FOLD + UNFOLD; // 105
  // Frame one opens mid-sew: page 1 fully sewn, needle 45 percent through
  // page 2, at any page count (0.3625 of the sew phase on desktop).
  function phase0() { return ((1 + 0.45) / pages()) * SEW; }

  var ROWS = 24, COLS = 25; // per page: 600 day stitches per page

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var viewW = 300, viewH = 300, dpr = 1, isPhone = false;

  function measure() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    }
    if (!w) { w = 300; h = 300; }
    viewW = w; viewH = h;
    dpr = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (dpr < 1) dpr = 1; if (dpr > 3) dpr = 3;
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    isPhone = (Math.min(sw, sh) > 0 && Math.min(sw, sh) < 700) || (viewH > viewW * 1.15);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
  }
  measure();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', function () { measure(); draw(elapsed()); });
    if (window.addEventListener) window.addEventListener('resize', function () { measure(); draw(elapsed()); });
  }

  // Seeded RNG (mulberry32), one independent stream per life.
  function rngStream(seed) {
    var s = seed | 0;
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function pages() { return isPhone ? 3 : 4; }
  function totalStitches() { return pages() * ROWS * COLS; }

  // ---- Life synthesis -------------------------------------------------------
  // The first five events are placed by hand so frame one always opens on a
  // yellow, two blues, a red and a black cross already glowing in the sewn
  // field. The rest are drawn from age-plausible windows by the seeded stream.
  var FIXED_EVENTS = [
    { type: 'achieve', name: 'a first word', u: 0.06 },
    { type: 'travel', name: 'first train alone', u: 0.16 },
    { type: 'travel', name: 'the island year', u: 0.24 },
    { type: 'love', name: 'a first love', u: 0.30 },
    { type: 'loss', name: 'grandfather', u: 0.345 }
  ];
  var EVENT_POOL = [
    { type: 'achieve', name: 'the scholarship', w: [0.40, 0.46] },
    { type: 'achieve', name: 'her own studio', w: [0.52, 0.60] },
    { type: 'achieve', name: 'a prize in milan', w: [0.60, 0.68] },
    { type: 'achieve', name: 'the book, printed', w: [0.68, 0.76] },
    { type: 'achieve', name: 'head of the studio', w: [0.76, 0.84] },
    { type: 'achieve', name: 'fifty years of work', w: [0.86, 0.95] },
    { type: 'travel', name: 'the night train north', w: [0.42, 0.50] },
    { type: 'travel', name: 'a winter in lisbon', w: [0.55, 0.63] },
    { type: 'travel', name: 'three weeks at sea', w: [0.66, 0.74] },
    { type: 'travel', name: 'the long way home', w: [0.80, 0.90] },
    { type: 'love', name: 'met under the clock', w: [0.44, 0.52] },
    { type: 'love', name: 'the wedding in june', w: [0.50, 0.58] },
    { type: 'love', name: 'letters every sunday', w: [0.62, 0.72] },
    { type: 'love', name: 'the second spring', w: [0.78, 0.88] },
    { type: 'breakup', name: 'a break-up', w: [0.46, 0.54] },
    { type: 'breakup', name: 'the quiet ending', w: [0.58, 0.66] },
    { type: 'breakup', name: 'the last postcard', w: [0.70, 0.80] },
    { type: 'loss', name: 'the house fire', w: [0.48, 0.56] },
    { type: 'loss', name: 'mother', w: [0.64, 0.74] },
    { type: 'loss', name: 'the empty chair', w: [0.74, 0.84] },
    { type: 'loss', name: 'a friend, too soon', w: [0.84, 0.94] },
    { type: 'travel', name: 'the year of the storm', w: [0.56, 0.64] }
  ];

  var lifeCache = {}; // gen -> life
  function buildLife(gen) {
    if (lifeCache[gen]) return lifeCache[gen];
    var rng = rngStream(937000 + gen * 1013);
    var total = totalStitches();
    // Per-stitch hand jitter: vertical wobble and a whisper of rotation.
    var jitY = new Float32Array(total);
    var jitR = new Float32Array(total);
    for (var i = 0; i < total; i++) {
      jitY[i] = (rng() - 0.5) * 2.2;
      jitR[i] = (rng() - 0.5) * 0.14;
    }
    var events = [];
    var i2, e;
    for (i2 = 0; i2 < FIXED_EVENTS.length; i2++) {
      e = FIXED_EVENTS[i2];
      events.push({ type: e.type, name: e.name, idx: Math.round(e.u * (total - 1)), rot: (rng() - 0.5) * 0.2 });
    }
    for (i2 = 0; i2 < EVENT_POOL.length; i2++) {
      e = EVENT_POOL[i2];
      var u = e.w[0] + rng() * (e.w[1] - e.w[0]);
      events.push({ type: e.type, name: e.name, idx: Math.round(u * (total - 1)), rot: (rng() - 0.5) * 0.2 });
    }
    events.sort(function (a, b) { return a.idx - b.idx; });
    var life = { jitY: jitY, jitR: jitR, events: events };
    lifeCache = {}; lifeCache[gen] = life;
    return life;
  }

  // ---- Layout ---------------------------------------------------------------
  function layout() {
    var mx = viewW * 0.045;
    var legendW = isPhone ? 96 : 132;
    var gap = viewW * 0.02;
    var bandX = mx + legendW + gap;
    var bandW = viewW - mx - bandX;
    var bandY = viewH * 0.15;
    var bandH = viewH * 0.68;
    var P = pages();
    return {
      mx: mx, legendX: mx, legendW: legendW,
      bandX: bandX, bandW: bandW, bandY: bandY, bandH: bandH,
      pageW: bandW / P, P: P,
      cellW: (bandW / P) / COLS, cellH: bandH / ROWS
    };
  }

  // Stitch position (before fold / drag transforms), sewing order is
  // page by page, row by row inside a page, left to right.
  function stitchPos(L, idx) {
    var per = ROWS * COLS;
    var page = Math.floor(idx / per);
    var rem = idx - page * per;
    var row = Math.floor(rem / COLS);
    var col = rem - row * COLS;
    return {
      x: L.bandX + page * L.pageW + (col + 0.5) * L.cellW,
      y: L.bandY + (row + 0.5) * L.cellH,
      page: page, row: row, col: col
    };
  }

  // ---- Interaction state (recorded events; drawing is closed-form in t) -----
  var genOffset = 0;        // added to the cycle count to get the generation
  var startT = 0;           // piece-clock time at which the current offset began
  var focusEv = null;       // {gen, evIdx, t} from a tap
  var drag = null;          // {x, y, dx, dy, t, active}
  var lastTapT = -10, lastTapX = 0, lastTapY = 0;

  function clockAt(t) {
    var total = phase0() + (t - startT);
    var cycles = Math.floor(total / LOOP);
    return { gen: genOffset + cycles, loopT: total - cycles * LOOP, cycles: cycles };
  }

  function sewIndex(loopT, total) {
    if (loopT < SEW) return (loopT / SEW) * (total - 1);
    return total - 1; // hold, fold and reopen all show the finished field
  }

  function foldScale(loopT) {
    if (loopT < SEW + HOLD) return 1;
    if (loopT < SEW + HOLD + FOLD) {
      var f = (loopT - SEW - HOLD) / FOLD;
      var e = f * f * (3 - 2 * f);
      return 1 - 0.95 * e;
    }
    var u = (loopT - SEW - HOLD - FOLD) / UNFOLD;
    var e2 = u * u * (3 - 2 * u);
    return 0.05 + 0.95 * e2;
  }

  // Drag pull: stitches near the pointer path lean along the drag vector and
  // spring back with a closed-form exponential release.
  function dragOffset(x, y, t) {
    if (!drag) return null;
    var ddx = x - drag.x, ddy = y - drag.y;
    var d2 = ddx * ddx + ddy * ddy;
    var R = 110;
    if (d2 > R * R) return null;
    var fall = Math.exp(-Math.sqrt(d2) / 62);
    var env = drag.active ? 1 : Math.exp(-(t - drag.t) / 0.8);
    if (env < 0.01) return null;
    var m = Math.min(16, Math.sqrt(drag.dx * drag.dx + drag.dy * drag.dy));
    if (m < 0.5) return null;
    var s = fall * env;
    return { x: (drag.dx) * s * 0.9, y: (drag.dy) * s * 0.9 };
  }

  // ---- Audio (lazy, first gesture only) --------------------------------------
  var AC = null, audioOn = false, lastTickIdx = -1, lastCreakT = -9, foldSndCycle = -1;
  function ensureAudio() {
    if (audioOn) return;
    try {
      var Ctor = (typeof window !== 'undefined') ? (window.AudioContext || window.webkitAudioContext) : null;
      if (!Ctor) return;
      AC = new Ctor();
      audioOn = true;
    } catch (e) { AC = null; audioOn = false; }
  }
  function thump(freq, gain, dur) {
    if (!audioOn || !AC) return;
    try {
      var t0 = AC.currentTime;
      var o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = freq;
      o.type = 'sine'; o.frequency.value = freq * 0.5;
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(f); f.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  function noiseBurst(freq, gain, dur) {
    if (!audioOn || !AC) return;
    try {
      var t0 = AC.currentTime;
      var len = Math.max(1, Math.floor(AC.sampleRate * dur));
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = AC.createBufferSource(); src.buffer = buf;
      var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
      var g = AC.createGain(); g.gain.value = gain;
      src.connect(f); f.connect(g); g.connect(AC.destination);
      src.start(t0);
    } catch (e) {}
  }

  // ---- Drawing ----------------------------------------------------------------
  function draw(t) {
    var L = layout();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, viewW, viewH);

    var ck = clockAt(t);
    var life = buildLife(ck.gen);
    var total = totalStitches();
    var idxNow = sewIndex(ck.loopT, total);
    var fs = foldScale(ck.loopT);
    var folding = fs < 0.999;

    function fx(x) { return L.bandX + (x - L.bandX) * fs; }

    // Accordion shading: alternate pages a whisper darker, fold seams.
    var p, i;
    for (p = 0; p < L.P; p++) {
      if (p % 2 === 1) {
        ctx.fillStyle = 'rgba(35,33,28,0.03)';
        ctx.fillRect(fx(L.bandX + p * L.pageW), L.bandY, L.pageW * fs, L.bandH);
      }
    }
    ctx.strokeStyle = 'rgba(35,33,28,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (p = 0; p <= L.P; p++) {
      var sx = fx(L.bandX + p * L.pageW);
      ctx.moveTo(sx, L.bandY); ctx.lineTo(sx, L.bandY + L.bandH);
    }
    ctx.stroke();
    // Faint notebook rules on every row, sewn or not.
    ctx.strokeStyle = 'rgba(35,33,28,0.05)';
    ctx.beginPath();
    for (i = 0; i < ROWS; i++) {
      var ry = L.bandY + (i + 0.5) * L.cellH;
      ctx.moveTo(fx(L.bandX), ry); ctx.lineTo(fx(L.bandX + L.bandW), ry);
    }
    ctx.stroke();

    // Day stitches: sewn ones only, in sewing order. White thread at low
    // alpha over a hair of ink shadow so the field reads as faint texture.
    var dashLen = Math.min(L.cellW * 0.58, 12);
    var sewn = Math.floor(idxNow);
    ctx.lineWidth = Math.max(1.4, L.cellH * 0.09);
    ctx.lineCap = 'round';
    for (i = 0; i <= sewn && i < total; i++) {
      var sp = stitchPos(L, i);
      var x = fx(sp.x), y = sp.y + life.jitY[i];
      var off = dragOffset(sp.x, sp.y, t);
      if (off) { x += off.x; y += off.y; }
      var r = life.jitR[i];
      var c = Math.cos(r) * dashLen * 0.5, s = Math.sin(r) * dashLen * 0.5;
      ctx.strokeStyle = 'rgba(35,33,28,0.05)';
      ctx.beginPath(); ctx.moveTo(x - c, y - s + 0.8); ctx.lineTo(x + c, y + s + 0.8); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.52)';
      ctx.beginPath(); ctx.moveTo(x - c, y - s); ctx.lineTo(x + c, y + s); ctx.stroke();
    }

    // Event over-stitches, popping in as the needle passes their day.
    for (i = 0; i < life.events.length; i++) {
      var ev = life.events[i];
      if (ev.idx > idxNow) continue;
      var ep = stitchPos(L, ev.idx);
      var ex = fx(ep.x), ey = ep.y;
      var eoff = dragOffset(ep.x, ep.y, t);
      if (eoff) { ex += eoff.x; ey += eoff.y; }
      var pop = Math.min(1, (idxNow - ev.idx) / 10);
      pop = 1 - (1 - pop) * (1 - pop);
      var pulse = 0;
      var focused = focusEv && focusEv.gen === ck.gen && focusEv.evIdx === i && (t - focusEv.t) < 3;
      if (focused) pulse = Math.exp(-(t - focusEv.t) / 1.4) * (0.5 + 0.5 * Math.sin((t - focusEv.t) * 7));
      var size = Math.min(L.cellW * 0.85, 13) * pop * (1 + 0.45 * pulse);
      ctx.strokeStyle = TYPE_COLOR[ev.type];
      ctx.lineWidth = 2.6;
      ctx.save();
      ctx.translate(ex, ey); ctx.rotate(ev.rot);
      ctx.beginPath();
      if (ev.type === 'breakup' || ev.type === 'loss') {
        ctx.moveTo(-size, -size * 0.62); ctx.lineTo(size, size * 0.62);
        ctx.moveTo(-size, size * 0.62); ctx.lineTo(size, -size * 0.62);
      } else {
        ctx.moveTo(-size, 0); ctx.lineTo(size, 0);
      }
      ctx.stroke();
      ctx.restore();
      if (focused) {
        ctx.strokeStyle = TYPE_COLOR[ev.type];
        ctx.globalAlpha = 0.55 * Math.exp(-(t - focusEv.t) / 1.4);
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(ex, ey, size + 9 + 3 * Math.sin((t - focusEv.t) * 7), 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // Needle: a small dark dot with a short white thread trail along the last
    // sewn stitches. While a tapped event pulses, the needle rests there.
    var needleIdx = idxNow;
    var nPos;
    if (focusEv && focusEv.gen === ck.gen && (t - focusEv.t) < 3) {
      var fev = life.events[focusEv.evIdx];
      nPos = stitchPos(L, fev.idx);
    } else {
      var i0 = Math.floor(needleIdx), frac = needleIdx - i0;
      var pa = stitchPos(L, Math.min(i0, total - 1));
      var pb = stitchPos(L, Math.min(i0 + 1, total - 1));
      nPos = { x: pa.x + (pb.x - pa.x) * frac, y: pa.y + (pb.y - pa.y) * frac };
      // Thread trail through the last dozen stitches.
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      var started = false, prevX = 0, prevY = 0;
      for (i = Math.max(0, i0 - 11); i <= i0; i++) {
        var tp = stitchPos(L, i);
        var tx = fx(tp.x), ty = tp.y + life.jitY[i];
        // Break the thread where the needle hops a row or a page boundary;
        // a straight jump line across the accordion is not a thread.
        var jump = started && ((tx - prevX) * (tx - prevX) + (ty - prevY) * (ty - prevY) > (L.cellW * 2.2) * (L.cellW * 2.2));
        if (!started || jump) { ctx.moveTo(tx, ty); started = true; } else ctx.lineTo(tx, ty);
        prevX = tx; prevY = ty;
      }
      if (started) {
        var nx2 = fx(nPos.x);
        if ((nx2 - prevX) * (nx2 - prevX) + (nPos.y - prevY) * (nPos.y - prevY) > (L.cellW * 2.2) * (L.cellW * 2.2)) ctx.moveTo(nx2, nPos.y);
        else ctx.lineTo(nx2, nPos.y);
      }
      ctx.stroke();
    }
    if (ck.loopT < SEW + HOLD) {
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(fx(nPos.x), nPos.y, 3.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(fx(nPos.x) - 1, nPos.y - 1, 1.1, 0, Math.PI * 2);
      ctx.fill();
    }

    // Legend strip at the left fold: a sample stitch and its name, always.
    var lgX = L.legendX + 6;
    var lgTop = L.bandY + L.bandH * 0.08;
    var lgStep = (L.bandH * 0.84) / TYPE_ORDER.length;
    var sampleLen = Math.min(L.legendW * 0.26, 15);
    ctx.fillStyle = INK;
    ctx.textBaseline = 'middle';
    for (i = 0; i < TYPE_ORDER.length; i++) {
      var ty2 = lgTop + i * lgStep + lgStep * 0.5;
      var tpName = TYPE_ORDER[i];
      ctx.strokeStyle = TYPE_COLOR[tpName];
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      if (tpName === 'breakup' || tpName === 'loss') {
        ctx.moveTo(lgX - sampleLen * 0.6, ty2 - sampleLen * 0.4); ctx.lineTo(lgX + sampleLen * 0.6, ty2 + sampleLen * 0.4);
        ctx.moveTo(lgX - sampleLen * 0.6, ty2 + sampleLen * 0.4); ctx.lineTo(lgX + sampleLen * 0.6, ty2 - sampleLen * 0.4);
      } else {
        ctx.moveTo(lgX - sampleLen * 0.6, ty2); ctx.lineTo(lgX + sampleLen * 0.6, ty2);
      }
      ctx.stroke();
      ctx.font = (isPhone ? 10 : 12) + 'px "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive';
      ctx.fillText(TYPE_LABEL[tpName], lgX + sampleLen * 0.6 + 7, ty2 + 1);
    }
    // Legend fold seam.
    ctx.strokeStyle = 'rgba(35,33,28,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(L.legendX + L.legendW + L.mx * 0.2, L.bandY);
    ctx.lineTo(L.legendX + L.legendW + L.mx * 0.2, L.bandY + L.bandH);
    ctx.stroke();

    // Caption card for the tapped event.
    if (focusEv && focusEv.gen === ck.gen && (t - focusEv.t) < 3) {
      var ev2 = life.events[focusEv.evIdx];
      var age = t - focusEv.t;
      var aIn = Math.min(1, age / 0.25), aOut = Math.min(1, (3 - age) / 0.5);
      var alpha = Math.max(0, Math.min(aIn, aOut));
      ctx.font = (isPhone ? 14 : 16) + 'px "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive';
      var tw = ctx.measureText(ev2.name).width;
      var cw = tw + 34, chh = 34;
      var cxp = (viewW - cw) / 2, cyp = viewH * 0.885;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(cxp, cyp, cw, chh);
      ctx.strokeStyle = 'rgba(35,33,28,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(cxp, cyp, cw, chh);
      ctx.fillStyle = TYPE_COLOR[ev2.type];
      ctx.beginPath();
      if (ev2.type === 'breakup' || ev2.type === 'loss') {
        ctx.moveTo(cxp + 12, cyp + chh / 2 - 5); ctx.lineTo(cxp + 22, cyp + chh / 2 + 5);
        ctx.moveTo(cxp + 12, cyp + chh / 2 + 5); ctx.lineTo(cxp + 22, cyp + chh / 2 - 5);
        ctx.stroke();
      } else {
        ctx.fillRect(cxp + 11, cyp + chh / 2 - 1.6, 12, 3.2);
      }
      ctx.fillStyle = INK;
      ctx.fillText(ev2.name, cxp + 29, cyp + chh / 2 + 1);
      ctx.globalAlpha = 1;
    }

    // Audio side effects (browser only, silent in the QA renderer).
    if (audioOn) {
      if (ck.loopT < SEW && idxNow - lastTickIdx >= 26) {
        lastTickIdx = idxNow;
        thump(340 + Math.random() * 60, 0.05, 0.07);
      }
      if (ck.loopT >= SEW + HOLD && ck.loopT < SEW + HOLD + 0.1 && foldSndCycle !== ck.cycles) {
        foldSndCycle = ck.cycles;
        noiseBurst(500, 0.06, 0.5);
      }
    }
  }

  // ---- Clock / loop ------------------------------------------------------------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    var loopFn = function () {
      draw(elapsed());
      requestAnimationFrame(loopFn);
    };
    requestAnimationFrame(loopFn);
  }

  // ---- Pointer interaction -------------------------------------------------------
  function evtPos(e) {
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  var downInfo = null;
  function onDown(e) {
    ensureAudio();
    if (AC && AC.resume) { try { AC.resume(); } catch (err) {} }
    var p = evtPos(e);
    downInfo = { x: p.x, y: p.y, t: elapsed(), moved: false };
    drag = { x: p.x, y: p.y, dx: 0, dy: 0, t: elapsed(), active: true };
  }
  function onMove(e) {
    if (!downInfo) return;
    var p = evtPos(e);
    var mdx = p.x - downInfo.x, mdy = p.y - downInfo.y;
    if (Math.abs(mdx) + Math.abs(mdy) > 6) downInfo.moved = true;
    if (drag) {
      drag.dx = p.x - drag.x; drag.dy = p.y - drag.y;
      // Keep a smoothed pull vector.
      drag.dx = drag.dx * 1.6; drag.dy = drag.dy * 1.6;
      drag.x = p.x; drag.y = p.y; drag.t = elapsed(); drag.active = true;
      var now = elapsed();
      if (audioOn && now - lastCreakT > 0.22 && (Math.abs(drag.dx) + Math.abs(drag.dy)) > 6) {
        lastCreakT = now;
        noiseBurst(220, 0.035, 0.16);
      }
    }
    if (typeof e.preventDefault === 'function') e.preventDefault();
  }
  function onUp(e) {
    var now = elapsed();
    if (drag) { drag.active = false; drag.t = now; }
    if (!downInfo) return;
    var wasDrag = downInfo.moved;
    var px = downInfo.x, py = downInfo.y;
    downInfo = null;
    if (wasDrag) return;
    // Tap. A second tap within 350 ms is a double-tap: a new life.
    if (now - lastTapT < 0.35 && Math.abs(px - lastTapX) + Math.abs(py - lastTapY) < 40) {
      var ck = clockAt(now);
      genOffset = ck.gen + 1 - ck.cycles;
      startT = now;
      focusEv = null;
      lastTapT = -10;
      if (audioOn) noiseBurst(500, 0.06, 0.4);
      return;
    }
    lastTapT = now; lastTapX = px; lastTapY = py;
    // Nearest sewn event stitch.
    var ck2 = clockAt(now);
    var life = buildLife(ck2.gen);
    var L = layout();
    var total = totalStitches();
    var idxNow = sewIndex(ck2.loopT, total);
    var fs = foldScale(ck2.loopT);
    var best = -1, bestD = 120 * 120;
    for (var i = 0; i < life.events.length; i++) {
      var ev = life.events[i];
      if (ev.idx > idxNow) continue;
      var sp = stitchPos(L, ev.idx);
      var sx = L.bandX + (sp.x - L.bandX) * fs;
      var ddx = sx - px, ddy = sp.y - py;
      var d2 = ddx * ddx + ddy * ddy;
      if (d2 < bestD) { bestD = d2; best = i; }
    }
    if (best >= 0) {
      focusEv = { gen: ck2.gen, evIdx: best, t: now };
      if (audioOn) thump(520, 0.06, 0.09);
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
  }
})();
</script>
</body>
</html>
