<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manet Duerme la Siesta</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F0E6D2; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- strict palette (ML3 "Momentitos") ---------- */
var GREEN = '#5A7A5A',   // sofa
    LAMP  = '#E8B93C',   // lamp glow yellow
    CREAM = '#F0E6D2',   // room cream / page ground
    NIGHT = '#1A2A4A';   // night window

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry32(579070);

function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mixHex(h1, h2, t){
  var a = hexRgb(h1), b = hexRgb(h2), i, out = [];
  for (i=0;i<3;i++) out.push(Math.round(a[i] + (b[i]-a[i])*t));
  return 'rgb(' + out[0] + ',' + out[1] + ',' + out[2] + ')';
}

/* derived tones: everything is a mix of the four palette hexes */
var INK       = mixHex(NIGHT, CREAM, 0.14);   // soft dark for outlines / beard base
var FLOOR     = mixHex(LAMP,  CREAM, 0.60);   // warm floorboards
var WOOD      = mixHex(LAMP,  NIGHT, 0.48);   // window frame / table wood
var SKIN      = mixHex(LAMP,  CREAM, 0.74);   // warm pale skin
var GREEN_D   = mixHex(GREEN, NIGHT, 0.28);   // sofa shadow
var GREEN_L   = mixHex(GREEN, CREAM, 0.30);   // sofa light
var BLANKET   = mixHex(NIGHT, CREAM, 0.52);   // muted blue-grey blanket
var JACKET    = mixHex(NIGHT, CREAM, 0.20);   // dark jacket
var TROUSER   = mixHex(NIGHT, CREAM, 0.38);   // trousers
var CAT       = mixHex(NIGHT, CREAM, 0.52);   // grey-blue cat
var RUG       = mixHex(GREEN, CREAM, 0.48);   // rug field
var CV_BLUE   = mixHex(NIGHT, CREAM, 0.38);   // canvas: muted blue
var CV_OCHRE  = mixHex(LAMP,  CREAM, 0.34);   // canvas: pale ochre
var CV_GREEN  = mixHex(GREEN, CREAM, 0.30);   // canvas: muted green
var CV_DARK   = mixHex(NIGHT, CREAM, 0.12);   // canvas: dark figures

/* ---------- precomputed paper grain (seeded, drawn directly) ---------- */
var speckles = [];
for (var si = 0; si < 340; si++){
  speckles.push({ x: rng()*1000, y: rng()*1000, r: 0.7 + rng()*1.6, a: 0.02 + rng()*0.05, warm: rng() < 0.55 });
}

/* ---------- precomputed window stars ---------- */
var stars = [];
for (var wi = 0; wi < 30; wi++){
  stars.push({ x: 656 + rng()*248, y: 122 + rng()*256, r: 1.2 + rng()*2.0, a: 0.35 + rng()*0.6 });
}

/* ---------- precomputed dabs on the leaning canvas (abstract touches) ---------- */
var dabs = [];
(function(){
  var tones = [CV_BLUE, CV_OCHRE, CV_GREEN, CREAM];
  for (var di = 0; di < 26; di++){
    dabs.push({ x: 128 + rng()*176, y: 356 + rng()*330, rx: 6 + rng()*16, ry: 4 + rng()*9, c: tones[(rng()*tones.length)|0], a: 0.25 + rng()*0.4 });
  }
})();

/* ---------- geometry helpers ---------- */
function ell(cx, cy, rx, ry, fill, stroke, w){
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = w || 3; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, w){
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke(); }
function curve(pts, color, w){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  ctx.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]);
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke(); }
function rrectPath(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function rrect(x, y, w, h, r, fill, stroke, lw){
  rrectPath(x, y, w, h, r);
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function poly(pts, fill, stroke, w){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = w || 3; ctx.lineJoin = 'round'; ctx.stroke(); }
}

/* ---------- state ---------- */
var PHASE0 = 0;                 // frame one: breath at rest, lamp steady, tail still
var timeSec = PHASE0;
var parTarget = { x: 0, y: 0 }; // drag parallax target (stage units)
var parCur    = { x: 0, y: 0 }; // smoothed parallax

/* ---------- scene pieces (stage space: 1000 x 1000) ---------- */

function drawFloor(){
  ctx.fillStyle = FLOOR; ctx.fillRect(-60, 712, 1120, 348);
  ctx.fillStyle = mixHex(CREAM, NIGHT, 0.10); ctx.fillRect(-60, 698, 1120, 15); // baseboard
  ctx.globalAlpha = 0.35; ctx.strokeStyle = mixHex(FLOOR, NIGHT, 0.30); ctx.lineWidth = 2.5;
  var ys = [790, 872, 952], i;
  for (i=0;i<ys.length;i++){ ctx.beginPath(); ctx.moveTo(-60, ys[i]); ctx.lineTo(1060, ys[i]); ctx.stroke(); }
  ctx.globalAlpha = 1;
}

function drawWindow(){
  // frame
  rrect(632, 100, 296, 300, 8, WOOD, INK, 3);
  // night
  ctx.fillStyle = NIGHT; ctx.fillRect(650, 118, 260, 264);
  // stars
  for (var i=0;i<stars.length;i++){
    var st = stars[i];
    ctx.globalAlpha = st.a; ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // crescent moon
  ell(716, 178, 31, 31, CREAM, null);
  ell(730, 168, 27, 27, NIGHT, null);
  // muntins
  ctx.fillStyle = WOOD;
  ctx.fillRect(773, 118, 13, 264);
  ctx.fillRect(650, 242, 260, 12);
  // sill
  rrect(620, 398, 320, 16, 5, WOOD, INK, 2.5);
}

function drawLeaningCanvas(){
  ctx.save();
  ctx.translate(214, 726); ctx.rotate(-0.055); ctx.translate(-214, -726);
  // frame + ground
  rrect(90, 316, 248, 410, 4, WOOD, INK, 3);
  ctx.fillStyle = mixHex(CREAM, LAMP, 0.10); ctx.fillRect(104, 330, 220, 382);
  ctx.save();
  rrectPath(104, 330, 220, 382, 2); ctx.clip();
  // abstract modern-life scene: bands and silhouette figures, no copied composition
  ctx.fillStyle = CV_BLUE;  ctx.fillRect(104, 330, 220, 74);        // high band
  ctx.fillStyle = CV_OCHRE; ctx.fillRect(104, 470, 220, 40);        // counter band
  ctx.fillStyle = CV_GREEN; ctx.fillRect(104, 610, 96, 102);        // low green mass
  // figures: dark verticals with pale heads
  var figs = [ [140,486], [188,478], [238,490], [284,482] ], i, f;
  for (i=0;i<figs.length;i++){
    f = figs[i];
    rrect(f[0]-13, f[1], 26, 92, 11, CV_DARK, null);
    ell(f[0], f[1]-14, 10, 11, mixHex(CREAM, LAMP, 0.25), null);
  }
  // loose dabs over everything
  for (i=0;i<dabs.length;i++){
    var d = dabs[i];
    ctx.globalAlpha = d.a; ell(d.x, d.y, d.rx, d.ry, d.c, null);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.restore();
}

function drawLampGlow(t){
  var flick = 0.115 + 0.022 * Math.sin(t * 0.8 + 1.0);   // almost imperceptible
  ctx.globalAlpha = flick;       ell(852, 498, 138, 138, LAMP, null);
  ctx.globalAlpha = flick + 0.07; ell(852, 498, 66, 66, LAMP, null);
  ctx.globalAlpha = 1;
}

function drawTableLamp(){
  // side table
  rrect(800, 606, 104, 16, 5, WOOD, INK, 2.5);
  line(816, 622, 808, 768, WOOD, 9);
  line(888, 622, 896, 768, WOOD, 9);
  line(812, 736, 892, 736, WOOD, 6);
  // lamp stem + shade
  line(852, 606, 852, 528, INK, 6);
  ell(852, 610, 20, 7, INK, null);
  poly([[852-26, 462], [852+26, 462], [852+42, 530], [852-42, 530]], LAMP, INK, 3);
  ell(852, 530, 42, 8, mixHex(LAMP, CREAM, 0.35), INK, 2);
}

function drawSofaAndManet(t){
  var breath = Math.sin(t * (Math.PI * 2 / 5.2));       // ~5.2 s breath
  var lift = breath * 3.6;                              // chest rise (px, stage units)

  // sofa body
  rrect(304, 536, 462, 168, 26, GREEN, INK, 3.5);                    // back
  rrect(322, 566, 426, 60, 18, GREEN_L, null);                       // back cushions sheen
  line(535, 548, 535, 690, GREEN_D, 4);                              // back seam
  rrect(330, 656, 196, 62, 14, GREEN_L, INK, 2.5);                   // seat cushion L
  rrect(540, 656, 196, 62, 14, GREEN_L, INK, 2.5);                   // seat cushion R
  rrect(282, 592, 58, 160, 20, GREEN, INK, 3.5);                     // arm L
  rrect(730, 592, 58, 160, 20, GREEN, INK, 3.5);                     // arm R
  rrect(300, 726, 470, 26, 8, GREEN_D, null);                        // base
  line(330, 752, 330, 776, INK, 8); line(740, 752, 740, 776, INK, 8); // legs

  // pillow under his head
  ctx.save(); ctx.translate(392, 636); ctx.rotate(-0.10);
  rrect(-58, -26, 116, 52, 16, mixHex(CREAM, LAMP, 0.16), INK, 2.5); ctx.restore();

  // legs + blanket (still)
  poly([[520, 640], [706, 652], [712, 692], [540, 696], [512, 672]], TROUSER, INK, 3);
  ell(716, 678, 20, 12, INK, null);                                   // shoe
  poly([[486, 620], [640, 630], [648, 690], [520, 700], [478, 664]], BLANKET, INK, 2.5);
  line(520, 632, 528, 694, mixHex(BLANKET, NIGHT, 0.25), 3);          // blanket fold
  line(584, 636, 590, 694, mixHex(BLANKET, NIGHT, 0.25), 3);

  // breathing group: chest + draped arm ride the breath
  ctx.save(); ctx.translate(0, -lift);
  ell(462, 632, 66, 30, JACKET, INK, 3);                              // chest / torso
  curve([[420, 618], [478, 600], [540, 626]], mixHex(JACKET, CREAM, 0.30), 13); // arm over chest
  ell(548, 630, 11, 9, SKIN, INK, 2);                                 // hand
  ctx.restore();

  // neck + head (simple, distant; the moment, not the portrait)
  poly([[398, 606], [424, 600], [428, 626], [402, 630]], SKIN, null);
  ell(392, 592, 31, 29, SKIN, INK, 3);
  // hair cap
  ctx.beginPath(); ctx.ellipse(392, 592, 31, 29, 0, Math.PI * 1.02, Math.PI * 1.98); ctx.strokeStyle = INK; ctx.lineWidth = 11; ctx.stroke();
  // beard: dark shape over the lower face
  ctx.beginPath(); ctx.ellipse(394, 604, 24, 17, 0, Math.PI * 0.08, Math.PI * 0.92);
  ctx.quadraticCurveTo(394, 626, 370, 604); ctx.closePath();
  ctx.fillStyle = INK; ctx.fill();
  // closed eye + brow: quiet lines only
  curve([[376, 588], [384, 592], [392, 588]], INK, 2.5);
  line(404, 596, 410, 602, INK, 2);                                   // nose hint
}

function drawRugCat(t){
  // rug
  rrect(326, 802, 470, 128, 18, RUG, GREEN, 5);
  rrect(352, 824, 418, 84, 12, null, GREEN, 2.5);
  // small diamonds
  var cx = [430, 520, 610], i;
  ctx.save(); ctx.globalAlpha = 0.55; ctx.strokeStyle = GREEN; ctx.lineWidth = 2.5;
  for (i=0;i<cx.length;i++){
    ctx.beginPath();
    ctx.moveTo(cx[i], 848); ctx.lineTo(cx[i]+16, 866); ctx.lineTo(cx[i], 884); ctx.lineTo(cx[i]-16, 866); ctx.closePath(); ctx.stroke();
  }
  ctx.restore();

  // cat, asleep in a curl
  var cyc = (t % 5.2) / 5.2;                                          // tail flicks once per breath loop
  var fe = Math.max(0, Math.sin((cyc - 0.78) / 0.22 * Math.PI));      // 0 except a brief window
  var flick = fe * fe;
  ell(688, 872, 58, 27, CAT, INK, 3);                                 // body
  ell(664, 880, 30, 15, mixHex(CAT, CREAM, 0.18), null);              // haunch light
  ell(640, 862, 21, 19, CAT, INK, 3);                                 // head
  poly([[626, 848], [622, 830], [638, 840]], CAT, INK, 2);            // ear L
  poly([[648, 842], [652, 826], [660, 842]], CAT, INK, 2);            // ear R
  curve([[632, 862], [639, 865], [646, 862]], INK, 2.2);              // closed eye
  line(628, 872, 636, 872, INK, 2);                                   // mouth hint
  ell(652, 884, 12, 7, mixHex(CAT, CREAM, 0.30), INK, 2);             // paw
  // tail wraps the body; the tip lifts during the flick
  var tipX = 742 - flick * 8, tipY = 892 - flick * 13;
  ctx.beginPath(); ctx.moveTo(724, 852);
  ctx.quadraticCurveTo(762, 884, tipX, tipY);
  ctx.strokeStyle = CAT; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(724, 852);
  ctx.quadraticCurveTo(762, 884, tipX, tipY);
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
  ell(tipX, tipY, 8, 6.5, CAT, INK, 2);
}

/* ---------- layout / draw ---------- */
var viewW = 300, viewH = 300, dpr = 1;
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : { width: 300, height: 300 };
var isPhone = Math.min(scr.width, scr.height) < 700;

function stageTransform(){
  var s = Math.min(viewW, viewH) / 1000;
  return { s: s, ox: (viewW - 1000 * s) / 2, oy: (viewH - 1000 * s) / 2 };
}

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = CREAM; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var tr = stageTransform();
  ctx.setTransform(dpr * tr.s, 0, 0, dpr * tr.s, dpr * tr.ox, dpr * tr.oy);
  var t = timeSec, i, sp;

  // paper grain over the whole room
  for (i=0;i<speckles.length;i++){
    sp = speckles[i];
    ctx.globalAlpha = sp.a; ctx.fillStyle = sp.warm ? LAMP : NIGHT;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // floor (barely parallaxes)
  ctx.save(); ctx.translate(parCur.x * 0.15, parCur.y * 0.08); drawFloor(); ctx.restore();

  // far layer: window + leaning canvas
  ctx.save(); ctx.translate(parCur.x * 0.35, parCur.y * 0.18);
  drawWindow(); drawLeaningCanvas(); ctx.restore();

  // mid layer: lamp glow, table + lamp, sofa + sleeper
  ctx.save(); ctx.translate(parCur.x * 0.70, parCur.y * 0.36);
  drawLampGlow(t); drawTableLamp(); drawSofaAndManet(t); ctx.restore();

  // near layer: rug + cat
  ctx.save(); ctx.translate(parCur.x, parCur.y * 0.5); drawRugCat(t); ctx.restore();

  // the only text in the piece: a whisper of a hint
  ctx.globalAlpha = 0.42; ctx.fillStyle = INK;
  ctx.font = '600 ' + (isPhone ? 21 : 17) + 'px sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('drag', 966, 968);
  ctx.globalAlpha = 1;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : (window.innerWidth || 300);
  viewH = vv ? vv.height : (window.innerHeight || 300);
  dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
  if (!isPhone && viewH > viewW * 1.15 && Math.min(viewW, viewH) < 700) isPhone = true; // aspect fallback
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

/* ---------- interaction: drag = gentle parallax only. No tap action. ---------- */
var pdown = null;
function toStage(e){
  var tr = stageTransform();
  return [ (e.clientX - tr.ox) / tr.s, (e.clientY - tr.oy) / tr.s ];
}
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e);
  pdown = { x: p[0], y: p[1], bx: parTarget.x, by: parTarget.y };
});
canvas.addEventListener('pointermove', function(e){
  if (!pdown) return;
  var p = toStage(e);
  parTarget.x = Math.max(-30, Math.min(30, pdown.bx + (p[0] - pdown.x) * 0.16));
  parTarget.y = Math.max(-18, Math.min(18, pdown.by + (p[1] - pdown.y) * 0.16));
});
canvas.addEventListener('pointerup', function(){ pdown = null; });
canvas.addEventListener('pointercancel', function(){ pdown = null; });

/* ---------- loop (anchored: PHASE0 + elapsed; frame one is PHASE0) ---------- */
var startTs = null, lastTs = null;
function tick(ts){
  if (startTs === null){ startTs = ts; lastTs = ts; }
  var dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000)); lastTs = ts;
  timeSec = PHASE0 + (ts - startTs) / 1000;
  var k = Math.min(1, dt * 5);
  parCur.x += (parTarget.x - parCur.x) * k;
  parCur.y += (parTarget.y - parCur.y) * k;
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
}
resize();
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
</script>
</body>
</html>
