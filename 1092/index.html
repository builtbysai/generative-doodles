<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Dust</title>
<style>
  html, body { margin: 0; padding: 0; background: #050508; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  // No.1092 "Hand Dust" — Marco Tempest study block MT5.
  // Particle-sim piece (sanctioned exception): fixed-timestep simulation
  // (dt = 1/60) from a seeded deterministic initial state. Frame one is the
  // state after a fixed synchronous pre-roll of 18 s, so the thumb is
  // reproducible byte-for-byte. Three systems on a 60 s scored loop:
  // (a) global gold dust drifting inside the silhouette's depth-field,
  // (b) bright hand emitters trailing cream dust on choreographed paths,
  // (c) act-3 burst cues only — typography, one fireball, bullet streaks,
  //     a single burst family per cue. Silent; no audio is specced.
  var LOOP = 60;
  var DT = 1 / 60;
  var PREROLL = 18; // simulated seconds before frame one
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var vw = 0, vh = 0, dpr = 1;

  // ---- seeded RNG (mulberry32) ----
  var rngState = 0x9E3779B9;
  function rnd() {
    rngState |= 0; rngState = (rngState + 0x6D2B79F5) | 0;
    var t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rr(a, b) { return a + rnd() * (b - a); }

  function isPhone() {
    try {
      var s = window.screen;
      if (s && Math.min(s.width, s.height) < 700) return true;
    } catch (e) {}
    return vh > vw * 1.15;
  }

  // ---- silhouette: soft procedural body (NOT a skeleton) ----
  // Right-half outline: [half-width, vertical fraction] from crown to crotch.
  var HALF = [
    [0.000, 0.000], [0.045, 0.012], [0.066, 0.045], [0.068, 0.085],
    [0.046, 0.125], [0.036, 0.152], [0.104, 0.188], [0.124, 0.270],
    [0.116, 0.410], [0.096, 0.525], [0.086, 0.565], [0.078, 0.690],
    [0.066, 0.850], [0.064, 0.965], [0.088, 1.000], [0.028, 1.000],
    [0.024, 0.820], [0.000, 0.615]
  ];
  var SIL_X = 0.5, SIL_Y = 0.20, SIL_H = 0.60;
  var silPoly = [];
  (function buildSil() {
    var i, p;
    for (i = 0; i < HALF.length; i++) {
      p = HALF[i];
      silPoly.push([SIL_X + p[0], SIL_Y + p[1] * SIL_H]);
    }
    for (i = HALF.length - 2; i >= 1; i--) {
      p = HALF[i];
      silPoly.push([SIL_X - p[0], SIL_Y + p[1] * SIL_H]);
    }
  })();
  function inSil(x, y) {
    // ray-cast point-in-polygon over the silhouette outline
    var inside = false;
    for (var i = 0, j = silPoly.length - 1; i < silPoly.length; j = i++) {
      var xi = silPoly[i][0], yi = silPoly[i][1];
      var xj = silPoly[j][0], yj = silPoly[j][1];
      if (((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function silPath(scale) {
    // smooth closed path through the outline, scaled about the centroid
    var cx = SIL_X, cy = SIL_Y + SIL_H * 0.52;
    var pts = silPoly.map(function (p) {
      return [cx + (p[0] - cx) * scale, cy + (p[1] - cy) * scale];
    });
    var n = pts.length;
    ctx.beginPath();
    var mx = (pts[n - 1][0] + pts[0][0]) / 2, my = (pts[n - 1][1] + pts[0][1]) / 2;
    ctx.moveTo(mx, my);
    for (var i = 0; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n];
      ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
    }
    ctx.closePath();
  }

  // ---- choreographed hand paths (closed over the 60 s loop) ----
  var TAU = Math.PI * 2;
  function handTarget(hand, T) {
    var amp = sim.amp;
    if (hand === 0) { // left
      return [
        0.365 + amp * (0.080 * Math.sin(TAU * 4 * T / 60 + 2.2) + 0.030 * Math.sin(TAU * 9 * T / 60 + 0.6)),
        0.485 + amp * (0.070 * Math.sin(TAU * 6 * T / 60 + 2.6) + 0.026 * Math.sin(TAU * 13 * T / 60 + 1.9))
      ];
    }
    return [ // right
      0.635 + amp * (0.085 * Math.sin(TAU * 3 * T / 60 + 0.4) + 0.035 * Math.sin(TAU * 8 * T / 60 + 1.7)),
      0.475 + amp * (0.075 * Math.sin(TAU * 5 * T / 60 + 1.1) + 0.028 * Math.sin(TAU * 12 * T / 60 + 0.3))
    ];
  }

  // ---- particle pool ----
  var POOL = 760;
  var pool = [];
  for (var pi = 0; pi < POOL; pi++) {
    pool.push({ alive: false, type: 0, x: 0, y: 0, vx: 0, vy: 0,
                age: 0, life: 1, size: 1, ph: 0, ch: '', rot: 0, vr: 0 });
  }
  var poolCursor = 0;
  function spawn(type) {
    for (var k = 0; k < POOL; k++) {
      poolCursor = (poolCursor + 1) % POOL;
      if (!pool[poolCursor].alive) {
        var p = pool[poolCursor];
        p.alive = true; p.type = type; p.age = 0;
        p.ch = ''; p.rot = 0; p.vr = 0;
        return p;
      }
    }
    return null;
  }

  var GLYPHS = 'AEGMRSTacefglmnorst&†§';
  var CUES = [
    { t: 43.5, type: 'glyph', hand: 1 },
    { t: 49.5, type: 'fire', hand: 0 },
    { t: 55.5, type: 'bullet', hand: 1 }
  ];

  // ---- simulation state ----
  var sim = {
    t: 0,
    amp: 0.55,
    hands: [
      { x: 0.365, y: 0.485, vx: 0, vy: 0 },
      { x: 0.635, y: 0.475, vx: 0, vy: 0 }
    ],
    drag: false, dragX: 0, dragY: 0,
    dustAcc: 0, trailAcc: [0, 0],
    dustAlive: 0
  };
  function actOf(T) { return T < 20 ? 0 : (T < 40 ? 1 : 2); }
  var DUST_TARGET = [300, 215, 255];
  var TRAIL_RATE = [38, 90, 58];

  function fireBurst(cue, hx, hy) {
    var i, p, a, sp;
    if (cue.type === 'glyph') {
      for (i = 0; i < 16; i++) {
        p = spawn(3); if (!p) return;
        p.x = hx + rr(-0.012, 0.012); p.y = hy + rr(-0.012, 0.012);
        a = rnd() * TAU; sp = rr(0.008, 0.045);
        p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - 0.012;
        p.life = rr(1.4, 2.0); p.size = rr(11, 22);
        p.ch = GLYPHS.charAt(Math.floor(rnd() * GLYPHS.length));
        p.rot = rr(-0.6, 0.6); p.vr = rr(-0.5, 0.5);
      }
    } else if (cue.type === 'fire') {
      for (i = 0; i < 42; i++) {
        p = spawn(4); if (!p) return;
        p.x = hx; p.y = hy;
        a = rnd() * TAU; sp = rr(0.06, 0.30);
        p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
        p.life = rr(0.7, 1.1); p.size = rr(1.5, 3.5);
      }
    } else { // bullet streaks, fanned upward from the hand
      for (i = 0; i < 12; i++) {
        p = spawn(5); if (!p) return;
        p.x = hx; p.y = hy;
        a = -Math.PI / 2 + rr(-0.65, 0.65); sp = rr(0.55, 0.80);
        p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
        p.life = rr(0.5, 0.7); p.size = 1.6;
      }
    }
  }

  function step(dt) {
    var T = sim.t % LOOP;
    var act = actOf(T);
    var prevT = T;
    sim.t += dt;
    var newT = sim.t % LOOP;

    // burst cues (act 3 only; cue times sit inside the act, no wrap inside a step)
    if (act === 2) {
      for (var ci = 0; ci < CUES.length; ci++) {
        var cue = CUES[ci];
        if (prevT < cue.t && newT >= cue.t) {
          var h = sim.hands[cue.hand];
          fireBurst(cue, h.x, h.y);
        }
      }
    }

    // hand amplitude envelope eases toward the act's scale
    var ampTarget = [0.55, 1.15, 0.9][act];
    sim.amp += (ampTarget - sim.amp) * (1 - Math.exp(-0.8 * dt));

    // hands: damped springs toward choreographed targets (drag overrides right)
    for (var hi = 0; hi < 2; hi++) {
      var hd = sim.hands[hi];
      var tgt = handTarget(hi, newT);
      if (hi === 1 && sim.drag) tgt = [sim.dragX, sim.dragY];
      var ax = 42 * (tgt[0] - hd.x) - 11 * hd.vx;
      var ay = 42 * (tgt[1] - hd.y) - 11 * hd.vy;
      hd.vx += ax * dt; hd.vy += ay * dt;
      hd.x += hd.vx * dt; hd.y += hd.vy * dt;
    }

    // dust spawn: seeded, masked to the silhouette
    sim.dustAcc += (sim.dustAlive < DUST_TARGET[act] ? 46 : 6) * dt;
    while (sim.dustAcc >= 1) {
      sim.dustAcc -= 1;
      var dp = null, tries = 0, dx = 0, dy = 0;
      while (tries < 8) {
        dx = SIL_X + rr(-0.14, 0.14);
        dy = SIL_Y + rnd() * SIL_H;
        if (inSil(dx, dy)) break;
        tries++;
      }
      if (tries < 8) {
        dp = spawn(1);
        if (dp) {
          dp.x = dx; dp.y = dy; dp.vx = 0; dp.vy = 0;
          dp.life = rr(6, 11); dp.size = rr(0.8, 1.8);
          dp.ph = rnd() * TAU;
        }
      }
    }

    // hand emitter trails
    for (hi = 0; hi < 2; hi++) {
      sim.trailAcc[hi] += TRAIL_RATE[act] * dt;
      while (sim.trailAcc[hi] >= 1) {
        sim.trailAcc[hi] -= 1;
        var tp = spawn(2);
        if (tp) {
          var hh = sim.hands[hi];
          tp.x = hh.x + rr(-0.004, 0.004);
          tp.y = hh.y + rr(-0.004, 0.004);
          tp.vx = hh.vx * 0.35 + rr(-0.02, 0.02);
          tp.vy = hh.vy * 0.35 + rr(-0.02, 0.02);
          tp.life = rr(1.1, 1.9); tp.size = rr(1.2, 2.6);
        }
      }
    }

    // particle updates
    sim.dustAlive = 0;
    for (var i = 0; i < POOL; i++) {
      var p = pool[i];
      if (!p.alive) continue;
      p.age += dt;
      if (p.age >= p.life) { p.alive = false; continue; }
      if (p.type === 1) { // dust: seeded curl-ish flow inside the depth-field
        sim.dustAlive++;
        p.vx = 0.010 * Math.sin(TAU * (1.7 * p.y + 0.11 * p.x) + p.ph + sim.t * 0.35);
        p.vy = 0.008 * Math.cos(TAU * (1.3 * p.x - 0.9 * p.y) + p.ph * 1.7 + sim.t * 0.28) - 0.002;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (!inSil(p.x, p.y)) p.life = Math.min(p.life, p.age + 0.8);
      } else if (p.type === 2) { // emitter trail
        var dr = Math.exp(-1.4 * dt);
        p.vx *= dr; p.vy *= dr;
        p.x += p.vx * dt; p.y += p.vy * dt;
      } else if (p.type === 3) { // typographic fragment
        var dg = Math.exp(-0.7 * dt);
        p.vx *= dg; p.vy *= dg;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt;
      } else if (p.type === 4) { // fireball
        var df = Math.exp(-2.0 * dt);
        p.vx *= df; p.vy *= df;
        p.x += p.vx * dt; p.y += p.vy * dt;
      } else { // bullet streak: constant velocity
        p.x += p.vx * dt; p.y += p.vy * dt;
      }
    }
  }

  // pre-roll: frame one is the developed state at t = 18 s (act 1, dust
  // field full, both emitters trailing on their choreographed paths)
  (function preroll() {
    var steps = Math.round(PREROLL / DT);
    for (var i = 0; i < steps; i++) step(DT);
  })();

  // ---- drawing ----
  function draw() {
    if (!vw || !vh) return;
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';

    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, vw, vh);

    var S = Math.min(vw, vh);
    var ox = (vw - S) / 2, oy = (vh - S) / 2;
    var u = S / 720; // px scale relative to the 720 reference
    function X(x) { return ox + x * S; }
    function Y(y) { return oy + y * S; }

    var T = sim.t % LOOP;
    var act = actOf(T);

    // silhouette: soft halo pass + body
    ctx.save();
    ctx.translate(ox, oy); ctx.scale(S, S);
    ctx.globalAlpha = 0.22; ctx.fillStyle = '#141419';
    silPath(1.045); ctx.fill();
    ctx.globalAlpha = 0.6;
    silPath(1.0); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;

    var i, p, a;
    // global dust (gold, at most 0.5 alpha)
    ctx.fillStyle = '#E8C77D';
    for (i = 0; i < POOL; i++) {
      p = pool[i];
      if (!p.alive || p.type !== 1) continue;
      var lf = p.age / p.life;
      a = Math.min(p.age / 1.2, 1) * Math.min((p.life - p.age) / 1.6, 1);
      if (a <= 0) continue;
      ctx.globalAlpha = 0.5 * a;
      ctx.beginPath();
      ctx.arc(X(p.x), Y(p.y), p.size * u, 0, TAU);
      ctx.fill();
    }
    // fireball blooms (orange)
    ctx.fillStyle = '#FF9B4A';
    for (i = 0; i < POOL; i++) {
      p = pool[i];
      if (!p.alive || p.type !== 4) continue;
      ctx.globalAlpha = 0.9 * (1 - p.age / p.life);
      ctx.beginPath();
      ctx.arc(X(p.x), Y(p.y), p.size * (1 - 0.6 * p.age / p.life) * u, 0, TAU);
      ctx.fill();
    }
    // bullet streaks (pale blue segments along velocity)
    ctx.strokeStyle = '#BFE3FF';
    ctx.lineWidth = Math.max(1, 1.6 * u);
    ctx.lineCap = 'round';
    for (i = 0; i < POOL; i++) {
      p = pool[i];
      if (!p.alive || p.type !== 5) continue;
      ctx.globalAlpha = 0.95 * (1 - p.age / p.life);
      ctx.beginPath();
      ctx.moveTo(X(p.x), Y(p.y));
      ctx.lineTo(X(p.x - p.vx * 0.035), Y(p.y - p.vy * 0.035));
      ctx.stroke();
    }
    // emitter trails (cream)
    ctx.fillStyle = '#F5E6C8';
    for (i = 0; i < POOL; i++) {
      p = pool[i];
      if (!p.alive || p.type !== 2) continue;
      var lt = 1 - p.age / p.life;
      ctx.globalAlpha = 0.9 * lt * lt;
      ctx.beginPath();
      ctx.arc(X(p.x), Y(p.y), p.size * (0.4 + 0.6 * lt) * u, 0, TAU);
      ctx.fill();
    }
    // typographic fragments (dissolve within 2 s; the only text-like marks)
    ctx.fillStyle = '#F5E6C8';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (i = 0; i < POOL; i++) {
      p = pool[i];
      if (!p.alive || p.type !== 3) continue;
      var ga = Math.min(p.age / 0.15, 1) * (1 - p.age / p.life);
      if (ga <= 0) continue;
      ctx.save();
      ctx.translate(X(p.x), Y(p.y));
      ctx.rotate(p.rot);
      ctx.globalAlpha = 0.9 * ga;
      ctx.font = p.size * u + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(p.ch, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // hand emitters: layered flat-alpha glow + white core
    for (i = 0; i < 2; i++) {
      var h = sim.hands[i];
      ctx.fillStyle = '#FFFFFF';
      ctx.globalAlpha = 0.10;
      ctx.beginPath(); ctx.arc(X(h.x), Y(h.y), 11 * u, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.18;
      ctx.beginPath(); ctx.arc(X(h.x), Y(h.y), 6.5 * u, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(X(h.x), Y(h.y), 3.2 * u, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(X(h.x), Y(h.y), 1.7 * u, 0, TAU); ctx.fill();
    }

    // cue marker: diamond at top-center, flashes at act boundaries
    var flash = 0;
    var bounds = [0, 20, 40];
    for (i = 0; i < 3; i++) {
      var b = bounds[i];
      if (T >= b && T < b + 0.9) flash = Math.max(flash, 1 - (T - b) / 0.9);
    }
    var cxp = X(0.5), cyp = Y(0.055), cr = 0.009 * S;
    ctx.strokeStyle = '#F5E6C8';
    ctx.lineWidth = Math.max(1, 1.2 * u);
    ctx.globalAlpha = 0.14 + 0.8 * flash;
    ctx.beginPath();
    ctx.moveTo(cxp, cyp - cr); ctx.lineTo(cxp + cr, cyp);
    ctx.lineTo(cxp, cyp + cr); ctx.lineTo(cxp - cr, cyp);
    ctx.closePath(); ctx.stroke();
    if (flash > 0.03) {
      ctx.globalAlpha = flash;
      ctx.fillStyle = '#F5E6C8';
      ctx.beginPath(); ctx.arc(cxp, cyp, 1.8 * u, 0, TAU); ctx.fill();
    }
    // act pips, top-left of the stage
    for (i = 0; i < 3; i++) {
      ctx.globalAlpha = (i === act) ? 0.55 : 0.16;
      ctx.fillStyle = '#F5E6C8';
      var ps = 0.009 * S;
      ctx.fillRect(X(0.045 + i * 0.022) - ps / 2, Y(0.05) - ps / 2, ps, ps);
    }
    ctx.globalAlpha = 1;
  }

  function resize() {
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    } else {
      vw = window.innerWidth;
      vh = window.innerHeight;
    }
    dpr = window.devicePixelRatio || 1;
    if (dpr > 2) dpr = 2;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) window.addEventListener('resize', resize);

  // drag = conduct: the right hand follows the pointer with spring lag
  function pointerPos(e) {
    var S = Math.min(vw, vh);
    var ox = (vw - S) / 2, oy = (vh - S) / 2;
    var x = (e.clientX - ox) / S, y = (e.clientY - oy) / S;
    if (x < 0.03) x = 0.03; if (x > 0.97) x = 0.97;
    if (y < 0.03) y = 0.03; if (y > 0.97) y = 0.97;
    return [x, y];
  }
  function onDown(e) {
    var p = pointerPos(e);
    sim.drag = true; sim.dragX = p[0]; sim.dragY = p[1];
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!sim.drag) return;
    var p = pointerPos(e);
    sim.dragX = p[0]; sim.dragY = p[1];
  }
  function onUp() { sim.drag = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
  }
  if (window.addEventListener) window.addEventListener('pointerup', onUp);

  resize();
  draw();

  // motion loop: fixed-timestep steps driven by real elapsed time
  if (typeof requestAnimationFrame === 'function') {
    var last = null, acc = 0;
    var loop = function (now) {
      if (last === null) last = now;
      acc += Math.min(0.1, (now - last) / 1000);
      last = now;
      while (acc >= DT) { step(DT); acc -= DT; }
      draw();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
