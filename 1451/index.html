<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Bone Band, Unfolding</title>
<style>html,body{margin:0;padding:0;background:#cfc8bc;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd = mulberry32(1451000);
var panelJitter = [];
for (var k = 0; k < 5; k++) { panelJitter.push((rnd() - 0.5) * 6); }

function ra(a){ var r = Math.round(a * 10000) / 10000; return r; }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function mod(n, m){ return ((n % m) + m) % m; }

function vp(){
  var v = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  if (v && v.width && v.height) return { w: v.width, h: v.height };
  return { w: window.innerWidth, h: window.innerHeight };
}
function isPhone(w, h){
  if (typeof window !== 'undefined' && window.screen) {
    var m = Math.min(window.screen.width, window.screen.height);
    if (m < 700) return true;
  }
  return h > w * 1.15;
}

var INK = '#1a1a1a', PAPER = '#f2ead8', FOLD = '#c8b898', GROUND = '#cfc8bc';
var BONE = '#efe8d8', INDIGO = '#2a3a7a', RUST = '#b84a1a', FOLKRED = '#c81a2a',
    GOLD = '#e8a81a', TEAL = '#1a7a6a';

function dot(x, y, r, color){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}
function line(x1, y1, x2, y2, w, color){
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.stroke();
}
function box(x, y, w, h, color){
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}
function head(cx, cy, r, skin){
  dot(cx, cy, r, skin);
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.stroke();
}
function eyes(cx, cy, r, gap){
  box(cx - gap - 3, cy - 3, 6, 6, INK);
  box(cx + gap - 3, cy - 3, 6, 6, INK);
}

// --- scene figures; (cx, feetY, s, t, active) ---
function singer(cx, feetY, s, t, active, phase){
  var mouth = active ? (3 + 5 * (0.5 + 0.5 * Math.sin(t * 3.5 + phase))) : 3;
  line(cx - 12 * s, feetY - 88 * s, cx - 24 * s, feetY - 118 * s, 3 * s, INK);
  line(cx + 12 * s, feetY - 88 * s, cx + 24 * s, feetY - 118 * s, 3 * s, INK);
  box(cx - 15 * s, feetY - 92 * s, 30 * s, 60 * s, BONE);
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.strokeRect(cx - 15 * s, feetY - 92 * s, 30 * s, 60 * s);
  line(cx - 15 * s, feetY - 72 * s, cx + 15 * s, feetY - 72 * s, 1.5, INK);
  line(cx - 15 * s, feetY - 54 * s, cx + 15 * s, feetY - 54 * s, 1.5, INK);
  line(cx - 15 * s, feetY - 36 * s, cx + 15 * s, feetY - 36 * s, 1.5, INK);
  line(cx - 8 * s, feetY - 32 * s, cx - 8 * s, feetY, 3 * s, INK);
  line(cx + 8 * s, feetY - 32 * s, cx + 8 * s, feetY, 3 * s, INK);
  head(cx, feetY - 108 * s, 17 * s, BONE);
  eyes(cx, feetY - 112 * s, 17 * s, 7 * s);
  box(cx - 5 * s, feetY - 100 * s, 10 * s, mouth * s, INK);
}
function dancer(cx, feetY, s, t, active){
  var tap = active ? Math.sin(t * 5) * 3 * s : 0;
  line(cx, feetY - 90 * s, cx - 20 * s, feetY - 60 * s, 3 * s, INK);
  line(cx, feetY - 90 * s, cx + 20 * s, feetY - 70 * s, 3 * s, INK);
  box(cx - 13 * s, feetY - 92 * s, 26 * s, 58 * s, INDIGO);
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.strokeRect(cx - 13 * s, feetY - 92 * s, 26 * s, 58 * s);
  box(cx - 10 * s, feetY - 80 * s, 7 * s, 7 * s, RUST);
  box(cx + 3 * s, feetY - 62 * s, 7 * s, 7 * s, RUST);
  line(cx - 8 * s, feetY - 34 * s, cx - 14 * s, feetY + tap, 3 * s, INK);
  line(cx + 8 * s, feetY - 34 * s, cx + 14 * s, feetY, 3 * s, INK);
  head(cx, feetY - 106 * s, 15 * s, INDIGO);
  eyes(cx, feetY - 109 * s, 15 * s, 6 * s);
  box(cx - 12 * s, feetY - 118 * s, 24 * s, 4 * s, GOLD);
}
function folkPlayer(cx, feetY, s, t, active, kind){
  var bounce = active ? Math.sin(t * 4) * 2 * s : 0;
  var y = feetY + bounce;
  if (kind === 0) {
    dot(cx, y - 60 * s, 20 * s, FOLKRED);
    ctx.beginPath(); ctx.arc(cx, y - 60 * s, 20 * s, 0, Math.PI * 2);
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    dot(cx, y - 60 * s, 8 * s, GOLD);
    line(cx - 16 * s, y - 40 * s, cx - 16 * s, y, 3 * s, INK);
    line(cx + 16 * s, y - 40 * s, cx + 16 * s, y, 3 * s, INK);
  } else {
    ctx.beginPath();
    ctx.moveTo(cx - 18 * s, y - 70 * s);
    ctx.lineTo(cx + 6 * s, y - 62 * s);
    ctx.lineTo(cx + 6 * s, y - 46 * s);
    ctx.closePath();
    ctx.fillStyle = GOLD; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    line(cx - 18 * s, y - 62 * s, cx - 30 * s, y - 58 * s, 3 * s, INK);
    line(cx - 4 * s, y - 40 * s, cx - 4 * s, y, 3 * s, INK);
    line(cx + 12 * s, y - 40 * s, cx + 12 * s, y, 3 * s, INK);
  }
  box(cx - 12 * s, y - 108 * s, 24 * s, 34 * s, kind === 0 ? FOLKRED : TEAL);
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.strokeRect(cx - 12 * s, y - 108 * s, 24 * s, 34 * s);
  head(cx, y - 122 * s, 13 * s, '#e8c8a8');
  eyes(cx, y - 125 * s, 13 * s, 5 * s);
}
function tangoPair(cx, feetY, s, t, active){
  var sway = active ? Math.sin(t * 2) * 3 * s : 0;
  var ax = cx - 22 * s + sway, bx = cx + 22 * s - sway;
  line(ax, feetY - 84 * s, ax + 14 * s, feetY - 40 * s, 3 * s, INK);
  line(ax, feetY - 84 * s, ax - 16 * s, feetY, 3 * s, INK);
  box(ax - 12 * s, feetY - 108 * s, 24 * s, 46 * s, INDIGO);
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.strokeRect(ax - 12 * s, feetY - 108 * s, 24 * s, 46 * s);
  head(ax, feetY - 122 * s, 13 * s, '#e8c8a8');
  eyes(ax, feetY - 125 * s, 13 * s, 5 * s);
  line(bx, feetY - 84 * s, bx - 14 * s, feetY - 40 * s, 3 * s, INK);
  line(bx, feetY - 84 * s, bx + 16 * s, feetY, 3 * s, INK);
  box(bx - 12 * s, feetY - 108 * s, 24 * s, 46 * s, FOLKRED);
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.strokeRect(bx - 12 * s, feetY - 108 * s, 24 * s, 46 * s);
  head(bx, feetY - 122 * s, 13 * s, '#e8c8a8');
  eyes(bx, feetY - 125 * s, 13 * s, 5 * s);
  line(ax + 10 * s, feetY - 92 * s, bx - 10 * s, feetY - 92 * s, 3 * s, INK);
}
function scene(k, cx, feetY, s, t, active){
  if (k === 0) {
    singer(cx - 26 * s, feetY, s, t, active, 0);
    singer(cx + 26 * s, feetY, s, t, active, 1.7);
  } else if (k === 1) {
    dancer(cx, feetY, s, t, active);
  } else if (k === 2) {
    folkPlayer(cx - 30 * s, feetY, s, t, active, 0);
    folkPlayer(cx + 30 * s, feetY, s, t, active, 1);
  } else if (k === 3) {
    tangoPair(cx, feetY, s, t, active);
  } else {
    singer(cx - 40 * s, feetY, s * 0.72, t, active, 0.6);
    dancer(cx + 4 * s, feetY, s * 0.72, t, active);
    folkPlayer(cx + 44 * s, feetY, s * 0.72, t, active, 0);
  }
}

// --- loop state ---
var LOOP = 34, UNFOLD = 15, HOLD = 4;
var timeShift = 0, dragging = false, dragP = 0, lastP = 0, dragStartX = 0, dragBase = 0;

function progressAt(t){
  var lt = mod(t + timeShift, LOOP);
  if (lt < UNFOLD) return lt / UNFOLD;
  if (lt < UNFOLD + HOLD) return 1;
  return 1 - (lt - UNFOLD - HOLD) / UNFOLD;
}

function draw(t){
  var size = vp();
  var W = size.w, H = size.h;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  var phone = isPhone(W, H);
  var p = dragging ? dragP : progressAt(t);
  lastP = p;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  var stripH = phone ? Math.max(170, Math.min(H * 0.34, 300)) : Math.max(200, Math.min(H * 0.44, 420));
  var stripY = (H - stripH) / 2;
  var fullW = Math.min(W * 0.96, 1240);
  var foldedW = W * 0.70;
  var pw = fullW / 5, cw = foldedW / 5;

  var widths = [], xs = [];
  var total = 0;
  for (var k = 0; k < 5; k++) {
    var f = clamp(p * 5 - k, 0, 1);
    widths.push(cw + (pw - cw) * f);
    total += widths[k];
  }
  var x0 = (W - total) / 2;
  var acc = x0;
  for (var k2 = 0; k2 < 5; k2++) { xs.push(acc); acc += widths[k2]; }

  for (var k3 = 0; k3 < 5; k3++) {
    var f3 = clamp(p * 5 - k3, 0, 1);
    var px = xs[k3], pwk = widths[k3];
    var skew = (f3 > 0 && f3 < 1) ? (1 - f3) * 10 : 0;
    var j = panelJitter[k3];
    ctx.beginPath();
    ctx.moveTo(px + skew, stripY + j);
    ctx.lineTo(px + pwk, stripY + j);
    ctx.lineTo(px + pwk, stripY + stripH + j);
    ctx.lineTo(px, stripY + stripH + j);
    ctx.closePath();
    ctx.fillStyle = PAPER;
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    ctx.stroke();
    // fold shading on the left edge of panels 1..4
    if (k3 > 0) {
      ctx.fillStyle = 'rgba(200,184,152,0.5)';
      ctx.fillRect(px, stripY, 6, stripH);
    }
    // figure: visible only once the panel is more than half open
    if (f3 > 0.55) {
      var fa = ra((f3 - 0.55) / 0.45);
      var active = f3 >= 0.99;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(px + skew, stripY + j);
      ctx.lineTo(px + pwk, stripY + j);
      ctx.lineTo(px + pwk, stripY + stripH + j);
      ctx.lineTo(px, stripY + stripH + j);
      ctx.closePath();
      ctx.clip();
      ctx.globalAlpha = fa;
      var s = (stripH / 380) * (0.62 + 0.38 * f3);
      scene(k3, px + pwk / 2, stripY + stripH * 0.84, s, t, active);
      ctx.restore();
    }
  }
}

draw(0);

var startStamp = null, lastElapsed = 0;
function loop(ts){
  if (startStamp === null) startStamp = ts;
  var el = (ts - startStamp) / 1000;
  lastElapsed = el;
  draw(el);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function pos(e){ return e.clientX; }
canvas.addEventListener('pointerdown', function(e){
  dragging = true;
  dragStartX = pos(e);
  dragBase = lastP;
  dragP = lastP;
});
canvas.addEventListener('pointermove', function(e){
  if (!dragging) return;
  var size = vp();
  dragP = clamp(dragBase + (pos(e) - dragStartX) / (size.w * 0.14), 0, 1);
  draw(lastElapsed);
});
canvas.addEventListener('pointerup', function(e){
  if (!dragging) return;
  dragging = false;
  timeShift = mod(dragP * UNFOLD - lastElapsed, LOOP);
});
canvas.addEventListener('pointercancel', function(e){
  if (!dragging) return;
  dragging = false;
  timeShift = mod(dragP * UNFOLD - lastElapsed, LOOP);
});

if (typeof window !== 'undefined') {
  window.__piece = {
    draw: draw,
    progress: function(){ return lastP; },
    setDrag: function(p){ dragging = true; dragP = clamp(p, 0, 1); lastP = dragP; },
    release: function(p, tNow){ dragging = false; dragP = clamp(p, 0, 1); timeShift = mod(dragP * UNFOLD - tNow, LOOP); },
    loopSeconds: LOOP
  };
}
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', function(){ draw(lastElapsed); });
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('resize', function(){ draw(lastElapsed); });
}
</script>
</body>
</html>
