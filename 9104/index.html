<style>

  #mute .slash { display: none; }
  #mute.off .slash { display: block; }

  #switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; gap: 14px; z-index: 5; }
  #switcher .dot { width: 16px; height: 16px; border-radius: 50%; padding: 0;
    border: 2px solid rgba(242,234,216,.85); background: transparent; cursor: pointer; }
  #switcher .dot.on { background: #f2c200; }
  #enginelog { display: none; }
</style>

<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="sound toggle"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path class="waves" d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13"/><line class="slash" x1="2" y1="2" x2="22" y2="22" stroke="#f2ead8" stroke-width="2"/></svg></button>
<div id="switcher"><button id="dot0" class="dot on"></button><button id="dot1" class="dot"></button></div>
<div id="enginelog"></div>
<script>
(function () {
  "use strict";

  // №9104 — MARBLE-MACHINE ENGINE, v2 (ENGINE-V2).
  // A general, deterministic 2D physics core plus a parts library.
  // A machine is DATA: channels, segments, domino rows, trapdoor cups,
  // spinner gates, seesaws, gap trays, end boxes. The stepper below
  // knows nothing about any one machine: adding or rearranging a part
  // means editing the description, not the physics.
  // Two machines ship on the same engine: A "Two Tables, One Marble"
  // (the original 9104 chain) and B "The Long Way Round" (same parts,
  // different route and part order). One continuous take, follow-cam
  // with eased lookahead, no cuts. Watch-first; drag nudges the marble
  // or tips the seesaw early. Nothing restarts, nothing reloads, no
  // legible text. The two dots below (or a horizontal swipe) choose a
  // machine; choosing a machine is not restarting a chain.

  var WORLD_W = 1600, WORLD_H = 2300;
  var GRAV = 1400, DT = 1 / 240, BALL_R = 16;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var logEl = document.getElementById('enginelog');

  function mulberry(s) {
    var a = s >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry(9104);

  // ---------- stage logging (headless tests read this) ----------
  function logStage(name) {
    if (!R || R.stages.indexOf(name) !== -1) return;
    R.stages.push(name);
    try { console.log('ENGINE-STAGE:' + name); } catch (e) {}
    logEl.textContent = R.idx + ':' + R.stages.join(',');
    if (name === 'DONE' && window.__ENGINE) window.__ENGINE.done = true;
  }

  // ---------- audio ----------
  var AC = null, master = null, rollGain = null, rollFilter = null, muted = false;
  var lastKnock = 0;
  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
      var len = AC.sampleRate, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      rollFilter = AC.createBiquadFilter(); rollFilter.type = 'lowpass'; rollFilter.frequency.value = 420;
      rollGain = AC.createGain(); rollGain.gain.value = 0;
      src.connect(rollFilter); rollFilter.connect(rollGain); rollGain.connect(master);
      src.start();
    } catch (e) { AC = null; }
  }
  function knock(freq, vol, dur) {
    if (!AC || muted) return;
    var now = AC.currentTime;
    if (now - lastKnock < 0.045) return;
    lastKnock = now;
    var o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
    o.type = 'triangle'; o.frequency.setValueAtTime(freq, now);
    o.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.4), now + dur);
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(now); o.stop(now + dur + 0.02);
  }
  function click(vol) {
    if (!AC || muted) return;
    var now = AC.currentTime, len = Math.floor(AC.sampleRate * 0.03);
    var buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var s = AC.createBufferSource(); s.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2800;
    var g = AC.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start(now);
  }
  document.getElementById('mute').addEventListener('click', function (e) {
    e.stopPropagation(); ensureAudio(); muted = !muted;
    this.classList.toggle('off', muted);
    if (rollGain) rollGain.gain.value = 0;
  });
  window.addEventListener('pointerdown', ensureAudio, { once: false });

  // ================= PHYSICS CORE =================
  // Circle vs segment collision. Returns impact speed along normal (or 0).
  var contact = false;
  function collide(b, s) {
    var dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    var len2 = dx * dx + dy * dy;
    var t = len2 === 0 ? 0 : ((b.x - s.x1) * dx + (b.y - s.y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    var cx = s.x1 + dx * t, cy = s.y1 + dy * t;
    var nx = b.x - cx, ny = b.y - cy;
    var d = Math.sqrt(nx * nx + ny * ny), min = BALL_R + s.thick;
    if (d >= min) return 0;
    if (d === 0) { nx = 0; ny = -1; d = 1; } else { nx /= d; ny /= d; }
    b.x = cx + nx * min; b.y = cy + ny * min;
    var vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      b.vx -= (1 + s.e) * vn * nx; b.vy -= (1 + s.e) * vn * ny;
      b.vx *= 0.9995; b.vy *= 0.9995;
      contact = true;
      return -vn;
    }
    return 0;
  }

  // A plank (domino or seesaw) as the segment it currently occupies.
  function plankSeg(p) {
    if (p.kind === 'domino') {
      var s = Math.sin(p.th), c = Math.cos(p.th);
      return { x1: p.x, y1: p.base, x2: p.x + p.dir * p.h * s, y2: p.base - p.h * c,
               e: 0.1, thick: 8, kind: 'domino' };
    }
    var c2 = Math.cos(p.ang), s2 = Math.sin(p.ang);
    return { x1: p.pivotX - p.half * c2, y1: p.pivotY - p.half * s2,
             x2: p.pivotX + p.half * c2, y2: p.pivotY + p.half * s2,
             e: 0.10, thick: 9, kind: 'plank' };
  }

  // ================= PARTS LIBRARY =================
  // Channel: two continuous rails offset +-40 from a center polyline.
  // Each rail is one polyline with mitered vertices (vertex normal =
  // average of adjacent segment normals), so joints are sealed with no
  // crossing extensions for the ball to wedge in.
  // skipFirstSide: omit one side's rail on the first segment only, for
  // an open-top drop-in entry (a ball falling in from above must not
  // meet a top rail across its fall path).
  function buildChannel(pts, e, skipFirstSide) {
    var out = [], n = pts.length, normals = [];
    for (var i = 0; i < n - 1; i++) {
      var dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1];
      var len = Math.sqrt(dx * dx + dy * dy);
      normals.push([-dy / len, dx / len]);
    }
    function vnormal(i) {
      if (i === 0) return normals[0];
      if (i === n - 1) return normals[n - 2];
      var nx = normals[i - 1][0] + normals[i][0], ny = normals[i - 1][1] + normals[i][1];
      var l = Math.sqrt(nx * nx + ny * ny) || 1;
      return [nx / l, ny / l];
    }
    for (var side = -1; side <= 1; side += 2) {
      for (var j = 0; j < n - 1; j++) {
        if (j === 0 && side === skipFirstSide) continue;
        var vn1 = vnormal(j), vn2 = vnormal(j + 1);
        out.push({ x1: pts[j][0] + vn1[0] * 40 * side, y1: pts[j][1] + vn1[1] * 40 * side,
                   x2: pts[j + 1][0] + vn2[0] * 40 * side, y2: pts[j + 1][1] + vn2[1] * 40 * side,
                   e: e, thick: 6, kind: 'rail' });
      }
    }
    return out;
  }

  var DOM_COLORS = ['#f2c200', '#e23b2e', '#f07f13', '#2b6cb0', '#38a169', '#ed64a6', '#805ad5'];

  // ================= MACHINE DESCRIPTIONS (data only) =================
  // Segment spec: [x1, y1, x2, y2, restitution, thickness, kind].
  var MACHINES = [
    {
      // A: the original 9104 chain, unchanged in look or grammar.
      ballStart: [262, 237],
      channels: [
        { pts: [[250, 250], [520, 340], [850, 390], [1150, 420], [1360, 470], [1400, 580], [1330, 700]], e: 0.15 },
        { pts: [[1330, 700], [1100, 790], [800, 850], [500, 880], [370, 930]], e: 0.15 },
        { pts: [[370, 930], [330, 960], [330, 1000], [345, 1025], [385, 1038], [440, 1041], [500, 1041]], e: 0.15 },
        { pts: [[680, 1120], [820, 1130], [1060, 1150], [1180, 1160]], e: 0.15 },
        { pts: [[1250, 1210], [1250, 1330], [1150, 1380], [950, 1400], [800, 1420], [660, 1480], [660, 1500]], e: 0.15 },
        { pts: [[800, 1630], [1050, 1730], [1180, 1760]], e: 0.15 },
        { pts: [[1360, 1960], [1200, 1965], [1000, 1975], [850, 1990]], e: 0.15, skip: 1 }
      ],
      segments: [
        [440, 1075, 600, 1075, 0.10, 6, 'floor'],
        [664, 1075, 1200, 1075, 0.10, 6, 'floor'],
        [664, 1025, 664, 1075, 0.20, 6, 'wall'],
        [600, 1135, 700, 1135, 0.10, 6, 'floor'],
        [1180, 1200, 1210, 1200, 0.10, 6, 'floor'],
        [1290, 1200, 1300, 1200, 0.10, 6, 'floor'],
        [1300, 1140, 1300, 1200, 0.20, 6, 'wall'],
        [1350, 1925, 1560, 1905, 0.12, 6, 'floor'],
        [1560, 1820, 1560, 1905, 0.20, 6, 'wall'],
        [700, 2070, 700, 2240, 0.15, 6, 'wall'],
        [840, 2070, 840, 2240, 0.15, 6, 'wall'],
        [700, 2240, 840, 2240, 0.05, 6, 'floor']
      ],
      trap: { seg: [600, 1075, 664, 1075], pivot: [600, 1075],
              capture: { x1: 620, x2: 672, yMin: 1000, maxSpeed: 200 } },
      dominoes: { x0: 640, count: 15, spacing: 36, base: 1075, h: 66, dir: 1 },
      spinner: { x: 1250, y: 1090, arm: 78, capture: { x: 1250, y: 1178, r: 60, yMin: 1140 },
                 releaseRot: 3 * Math.PI, releaseVel: [0, 250] },
      seesaw: { pivotX: 620, pivotY: 1570, half: 150 },
      gapSlot: [1190, 1850, 150, 75],
      box: { x1: 700, x2: 840, yTop: 2070, yFloor: 2240 },
      milestones: [
        { n: 'TRACK_A', x1: 1300, x2: 1600, y1: 0, y2: 750 },
        { n: 'RETURN', x1: 0, x2: 400, y1: 900, y2: 1000 },
        { n: 'DOMINO_ROW', x1: 440, x2: 1300, y1: 1040, y2: 1080 },
        { n: 'CHUTE', x1: 600, x2: 1350, y1: 1200, y2: 1400 },
        { n: 'SEESAW', x1: 470, x2: 770, y1: 1510, y2: 1630 },
        { n: 'SEESAW_EXIT', x1: 800, x2: 1180, y1: 1600, y2: 1800 },
        { n: 'GAP_FLIGHT', x1: 1180, x2: 1350, y1: 1760, y2: 1900 },
        { n: 'TRAY', x1: 1350, x2: 1560, y1: 1850, y2: 2000 },
        { n: 'FINAL', x1: 0, x2: 1000, y1: 1950, y2: 2010 },
        { n: 'BOX', x1: 700, x2: 840, y1: 2070, y2: 2300 }
      ]
    },
    {
      // B: same parts, different route — release top-right, one long
      // winding descent down the light table to the domino floor (no
      // U-turn: the ball stays moving right all the way), a shorter
      // domino row, a spinner gate on the dark table, a lower seesaw,
      // a wider end box at bottom-left. The cup mirrors A's structure:
      // the trapdoor sits where the ball bounces back to after the row,
      // the first domino stands just inside it, and the capture zone
      // covers the bounce-back rest position — so the cup works by
      // construction, not by a lucky corner ratchet.
      ballStart: [1388, 237],
      channels: [
        { pts: [[1400, 250], [1150, 330], [850, 390], [550, 440], [350, 500], [310, 560], [280, 620], [260, 780], [300, 900], [420, 970], [460, 1010], [480, 1050]], e: 0.15 },
        { pts: [[560, 1120], [700, 1130], [900, 1150], [1150, 1200], [1330, 1240], [1340, 1300]], e: 0.15 },
        { pts: [[1350, 1400], [1350, 1500], [1280, 1540], [1150, 1570], [1050, 1600], [1050, 1630]], e: 0.15 },
        { pts: [[900, 1740], [700, 1790], [500, 1820]], e: 0.15 },
        { pts: [[350, 1990], [450, 2040], [480, 2050]], e: 0.15, skip: -1 }
      ],
      segments: [
        [450, 1075, 480, 1075, 0.10, 6, 'floor'],
        [574, 1075, 950, 1075, 0.10, 6, 'floor'],
        [574, 1025, 574, 1075, 0.20, 6, 'wall'],
        [480, 1135, 580, 1135, 0.10, 6, 'floor'],
        [1280, 1390, 1310, 1390, 0.10, 6, 'floor'],
        [1390, 1390, 1400, 1390, 0.10, 6, 'floor'],
        [1400, 1330, 1400, 1390, 0.20, 6, 'wall'],
        [140, 1930, 350, 1950, 0.12, 6, 'floor'],
        [140, 1845, 140, 1930, 0.20, 6, 'wall'],
        [480, 2120, 480, 2240, 0.15, 6, 'wall'],
        [700, 2120, 700, 2240, 0.15, 6, 'wall'],
        [480, 2240, 700, 2240, 0.05, 6, 'floor']
      ],
      trap: { seg: [480, 1075, 574, 1075], pivot: [480, 1075],
              capture: { x1: 490, x2: 540, yMin: 1000, maxSpeed: 200 } },
      dominoes: { x0: 540, count: 10, spacing: 36, base: 1075, h: 66, dir: 1 },
      spinner: { x: 1350, y: 1280, arm: 78, capture: { x: 1350, y: 1368, r: 60, yMin: 1330 },
                 releaseRot: 3 * Math.PI, releaseVel: [0, 250] },
      seesaw: { pivotX: 1100, pivotY: 1680, half: 150 },
      gapSlot: [350, 1870, 150, 80],
      box: { x1: 480, x2: 700, yTop: 2120, yFloor: 2240 },
      milestones: [
        { n: 'CURVE', x1: 0, x2: 400, y1: 400, y2: 600 },
        { n: 'SWEEP', x1: 260, x2: 500, y1: 780, y2: 1050 },
        { n: 'DOMINO_ROW', x1: 490, x2: 950, y1: 1040, y2: 1080 },
        { n: 'CHUTE', x1: 1150, x2: 1350, y1: 1400, y2: 1580 },
        { n: 'SEESAW', x1: 950, x2: 1250, y1: 1620, y2: 1760 },
        { n: 'SEESAW_EXIT', x1: 500, x2: 900, y1: 1740, y2: 1820 },
        { n: 'GAP_FLIGHT', x1: 350, x2: 500, y1: 1820, y2: 1920 },
        { n: 'TRAY', x1: 140, x2: 350, y1: 1900, y2: 1990 },
        { n: 'FINAL', x1: 350, x2: 500, y1: 1990, y2: 2070 },
        { n: 'BOX', x1: 480, x2: 700, y1: 2120, y2: 2300 }
      ]
    }
  ];

  // ================= RUNTIME: build a machine from its description =================
  var R = null, doneSound = false;
  function updateDots() {
    var d0 = document.getElementById('dot0'), d1 = document.getElementById('dot1');
    if (d0 && d0.classList) d0.classList.toggle('on', R.idx === 0);
    if (d1 && d1.classList) d1.classList.toggle('on', R.idx === 1);
  }
  function loadMachine(idx) {
    var d = MACHINES[idx];
    var segs = [];
    d.channels.forEach(function (ch) { segs = segs.concat(buildChannel(ch.pts, ch.e, ch.skip)); });
    d.segments.forEach(function (s) {
      segs.push({ x1: s[0], y1: s[1], x2: s[2], y2: s[3], e: s[4], thick: s[5] || 6, kind: s[6] || 'wood' });
    });
    var dominoes = [];
    for (var i = 0; i < d.dominoes.count; i++) {
      dominoes.push({ kind: 'domino', x: d.dominoes.x0 + i * d.dominoes.spacing, base: d.dominoes.base,
        h: d.dominoes.h, w: 16, th: 0, om: 0, color: DOM_COLORS[i % DOM_COLORS.length],
        ticked: false, falling: false, dir: d.dominoes.dir || 1 });
    }
    R = {
      idx: idx, desc: d, segs: segs,
      trapSeg: { x1: d.trap.seg[0], y1: d.trap.seg[1], x2: d.trap.seg[2], y2: d.trap.seg[3],
                 e: 0.10, thick: 6, kind: 'floor' },
      trapOpen: 0, trapOpened: false, cupDone: false,
      dominoes: dominoes,
      spin: { x: d.spinner.x, y: d.spinner.y, arm: d.spinner.arm, phi: 0, om: 0, rot: 0, released: false },
      seesaw: { kind: 'seesaw', pivotX: d.seesaw.pivotX, pivotY: d.seesaw.pivotY, half: d.seesaw.half, ang: 0 },
      ball: { x: d.ballStart[0], y: d.ballStart[1], vx: 0, vy: 0, state: 'HELD_HAND' },
      simTime: 0, handT: 0, settleT: 0, escaped: false, stalled: false, stallT: 0,
      stages: []
    };
    contact = false; doneSound = false;
    window.__ENGINE.stages = R.stages; window.__ENGINE.machine = idx; window.__ENGINE.done = false;
    logStage('HAND');
    updateDots();
  }

  // World mechanisms that advance even while the ball is held: the
  // trapdoor swing and the domino chain. Held states must not freeze
  // the world, or a ball captured before the last domino falls waits
  // forever for a trapdoor that can never open.
  function updateMechanisms() {
    if (R.trapOpened && R.trapOpen < 1) R.trapOpen = Math.min(1, R.trapOpen + DT / 0.4);
    var doms = R.dominoes;
    var lastIdx = doms[0].dir === 1 ? doms.length - 1 : 0;
    for (var k = 0; k < doms.length; k++) {
      var dd = doms[k];
      if (!dd.falling) continue;
      dd.om += (3 * GRAV / (2 * dd.h)) * Math.sin(dd.th) * DT;
      dd.th += dd.om * DT;
      if (!dd.ticked && Math.abs(dd.th) > 0.3) { dd.ticked = true; knock(800 + k * 8, 0.12, 0.05); }
      var nxt = k + dd.dir;
      if (Math.abs(dd.th) > 0.45 && nxt >= 0 && nxt < doms.length && !doms[nxt].falling) {
        doms[nxt].falling = true;
        doms[nxt].om = doms[nxt].dir * Math.max(Math.abs(doms[nxt].om), 1.5);
        knock(800 + k * 8, 0.12, 0.05);
      }
      if (Math.abs(dd.th) >= 1.35) { dd.th = dd.dir * 1.35; dd.om = 0; }
      if (k === lastIdx && Math.abs(dd.th) > 1.0 && !R.trapOpened) {
        R.trapOpened = true; logStage('DOMINO_LAST');
      }
    }
  }

  // ================= STEPPER: knows parts, not machines =================
  function step() {
    var d = R.desc, b = R.ball;
    R.simTime += DT;

    // Hand phase: ball waits while the hand lifts away.
    if (b.state === 'HELD_HAND') {
      R.handT += DT;
      if (R.handT > 0.6) { b.state = 'ROLL'; logStage('RAMP_ROLL'); }
      return;
    }
    if (b.state === 'HELD_CUP') {
      updateMechanisms();
      if (R.trapOpened && R.trapOpen > 0.9) {
        // One-shot release: without this the ball is recaptured every
        // step (it is still slow and still inside the zone) and only
        // inches out by flicker. The cup, like the spinner gate, fires once.
        R.cupDone = true;
        b.state = 'ROLL'; b.vx = 60; b.vy = 20; logStage('TRAPDOOR');
      }
      return;
    }
    if (b.state === 'HELD_SPINNER') {
      updateMechanisms();
      var sp = R.spin;
      sp.om *= Math.exp(-0.6 * DT);
      sp.phi += sp.om * DT;
      sp.rot += Math.abs(sp.om) * DT;
      // The gate settles the ball to the cup's center while it spins.
      var settle = 1 - Math.exp(-4 * DT);
      b.x += (d.spinner.capture.x - b.x) * settle;
      b.y += (d.spinner.capture.y - b.y) * settle;
      if (!sp.released && sp.rot >= d.spinner.releaseRot) {
        sp.released = true;
        b.state = 'ROLL'; b.vx = d.spinner.releaseVel[0]; b.vy = d.spinner.releaseVel[1];
        logStage('SPINNER_RELEASE');
      }
      return;
    }
    if (b.state === 'DONE') return;

    // Seesaw angle follows the ball's offset from the pivot, eased.
    // (A torque-driven plank would stall here: the ball is light and the
    // plank is long, so the eased-follow keeps the crossing reliable by
    // construction while the plank still behaves as a pivoting part.)
    var ss = R.seesaw;
    var onPlank = (b.x > ss.pivotX - ss.half - 20 && b.x < ss.pivotX + ss.half + 20 &&
                   Math.abs(b.y - ss.pivotY) < 60);
    var target = 0;
    if (onPlank) target = Math.max(-0.38, Math.min(0.38, (b.x - ss.pivotX) * 0.0022));
    ss.ang += (target - ss.ang) * (1 - Math.exp(-6 * DT));

    updateMechanisms();

    contact = false;
    b.vy += GRAV * DT;
    var drag = Math.exp(-0.05 * DT);
    b.vx *= drag; b.vy *= drag;
    b.x += b.vx * DT; b.y += b.vy * DT;

    // Static segments (trapdoor removed once open).
    for (var i = 0; i < R.segs.length; i++) {
      var s = R.segs[i];
      var imp = collide(b, s);
      if (imp > 120) {
        if (s.kind === 'rail' || s.kind === 'floor') knock(700 + imp * 0.4, Math.min(0.25, imp / 4000), 0.08);
        else knock(500, Math.min(0.2, imp / 5000), 0.07);
      }
    }
    if (R.trapOpen <= 0.5) {
      var timp = collide(b, R.trapSeg);
      if (timp > 120) knock(600, 0.15, 0.08);
    }
    // Seesaw plank.
    var pl = plankSeg(ss);
    var pimp = collide(b, pl);
    if (pimp > 120) knock(600, 0.15, 0.08);

    // Dominoes: ball impact starts the fall (angular physics + chain
    // live in updateMechanisms, so the row also falls while held).
    var doms = R.dominoes, firstIdx = doms[0].dir === 1 ? 0 : doms.length - 1;
    for (var j = 0; j < doms.length; j++) {
      var dm = doms[j];
      if (Math.abs(dm.th) > 1.2) continue; // lying flat: the ball rolls on past
      var ds = plankSeg(dm);
      var dimp = collide(b, ds);
      if (dimp > 0 && !dm.falling) {
        dm.falling = true;
        dm.om = dm.dir * Math.max(Math.abs(dm.om), dimp * 0.006);
        b.vx *= 0.3; b.vy *= 0.5;
        knock(900, 0.2, 0.06);
        if (j === firstIdx) logStage('DOMINO_FIRST');
      }
    }

    // Captures.
    if (b.state === 'ROLL') {
      var cz = d.trap.capture;
      var spd0 = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (!R.cupDone && b.x > cz.x1 && b.x < cz.x2 && b.y > cz.yMin && spd0 < cz.maxSpeed) {
        b.state = 'HELD_CUP'; b.vx = 0; b.vy = 0; logStage('CUP_HELD');
      } else {
        var sc = d.spinner.capture;
        var dxs = b.x - sc.x, dys = b.y - sc.y;
        if (dxs * dxs + dys * dys < sc.r * sc.r && b.y > sc.yMin && !R.spin.released) {
          b.state = 'HELD_SPINNER'; b.vx = 0; b.vy = 0;
          R.spin.om = 8; R.spin.rot = 0; logStage('SPINNER_CAPTURE');
        }
      }
    }

    // Progress milestones (position rects from the description).
    if (b.state === 'ROLL') {
      for (var m = 0; m < d.milestones.length; m++) {
        var ms = d.milestones[m];
        if (b.x >= ms.x1 && b.x <= ms.x2 && b.y >= ms.y1 && b.y <= ms.y2) logStage(ms.n);
      }
    }

    // Settle in the box = the end. No payoff after this, just rest.
    var bx = d.box;
    if (b.x > bx.x1 && b.x < bx.x2 && b.y > bx.yTop) {
      var sp2 = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (sp2 < 30) { R.settleT += DT; if (R.settleT > 0.5) { b.state = 'DONE'; logStage('DONE'); } }
      else R.settleT = 0;
    } else R.settleT = 0;

    // Failure monitors (test assertions read these).
    if (b.x < -50 || b.x > WORLD_W + 50 || b.y > WORLD_H + 50) {
      if (!R.escaped) { R.escaped = true; logStage('ESCAPE'); }
    }
    var spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (b.state === 'ROLL' && spd < 5) { R.stallT += DT; if (R.stallT > 3 && !R.stalled) { R.stalled = true; logStage('STALL'); } }
    else R.stallT = 0;
  }

  // ---------- interaction: drag to nudge only; dots / swipe choose a machine ----------
  var dragMode = null, dragId = null, downX = 0, downY = 0;
  function toWorld(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / view.scale + view.x,
             y: (e.clientY - r.top) / view.scale + view.y };
  }
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    var w = toWorld(e);
    var ss = R.seesaw;
    var db = Math.sqrt((w.x - R.ball.x) * (w.x - R.ball.x) + (w.y - R.ball.y) * (w.y - R.ball.y));
    if (db < 80 && R.ball.state === 'ROLL') dragMode = 'ball';
    else if (Math.abs(w.x - ss.pivotX) < 190 && Math.abs(w.y - ss.pivotY) < 120) dragMode = 'seesaw';
    else dragMode = null;
    dragId = e.pointerId; downX = e.clientX; downY = e.clientY;
    try { canvas.setPointerCapture(dragId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (e.pointerId !== dragId || !dragMode) return;
    var w = toWorld(e);
    if (dragMode === 'ball' && R.ball.state === 'ROLL') {
      var dx = w.x - R.ball.x, dy = w.y - R.ball.y;
      var dd = Math.sqrt(dx * dx + dy * dy);
      if (dd > 4) {
        R.ball.vx += (dx / dd) * 260 * DT * 60 * 0.016;
        R.ball.vy += (dy / dd) * 260 * DT * 60 * 0.016;
        var s = Math.sqrt(R.ball.vx * R.ball.vx + R.ball.vy * R.ball.vy);
        if (s > 320) { R.ball.vx *= 320 / s; R.ball.vy *= 320 / s; }
      }
    } else if (dragMode === 'seesaw') {
      R.seesaw.ang = Math.max(-0.38, Math.min(0.38, (w.x - R.seesaw.pivotX) * 0.0022));
    }
  });
  function endDrag(e) {
    if (e.pointerId === dragId) {
      // A horizontal swipe with no part grabbed chooses the other machine.
      if (!dragMode && Math.abs(e.clientX - downX) > 80 && Math.abs(e.clientY - downY) < 100) {
        loadMachine(1 - R.idx);
      }
      dragMode = null; dragId = null;
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  document.getElementById('dot0').addEventListener('click', function (e) { e.stopPropagation(); loadMachine(0); });
  document.getElementById('dot1').addEventListener('click', function (e) { e.stopPropagation(); loadMachine(1); });

  // ---------- rendering ----------
  var view = { x: 0, y: 0, scale: 1, w: 1600, h: 1350 };
  var DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(window.innerWidth * DPR);
    canvas.height = Math.floor(window.innerHeight * DPR);
    view.scale = window.innerHeight / 1350;
    view.w = window.innerWidth / view.scale;
    view.h = 1350;
  }
  window.addEventListener('resize', resize);
  resize();

  var grainLight = [], grainDark = [];
  for (var gi = 0; gi < 90; gi++) grainLight.push([rng() * 1600, rng() * 1200, 100 + rng() * 400, 2 + rng() * 2, (rng() - 0.5) * 6]);
  for (var gj = 0; gj < 70; gj++) grainDark.push([rng() * 1600, 1200 + rng() * 800, 100 + rng() * 400, 2 + rng() * 2, (rng() - 0.5) * 6]);

  function starPath(cx, cy, r) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rad = i % 2 === 0 ? r : r * 0.45;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var px = cx + rad * Math.cos(a), py = cy + rad * Math.sin(a);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function drawSeg(s) {
    ctx.strokeStyle = s.kind === 'rail' ? '#b98a5a' : (s.kind === 'floor' ? '#a87c4e' : '#8a5a32');
    ctx.lineWidth = s.kind === 'rail' ? 14 : 12;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }

  function draw() {
    var d = R.desc, dpr = DPR, sc = view.scale;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#6f6152'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * sc, 0, 0, dpr * sc, -view.x * dpr * sc, -view.y * dpr * sc);

    // Floor planks.
    ctx.fillStyle = '#6f6152'; ctx.fillRect(0, 2000, 1600, 300);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 2;
    for (var fy = 2110; fy < 2300; fy += 110) {
      ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(1600, fy); ctx.stroke();
    }
    // Tables.
    ctx.fillStyle = '#d9b98a'; ctx.fillRect(0, 0, 1600, 1200);
    ctx.strokeStyle = 'rgba(196,160,110,0.25)';
    for (var i = 0; i < grainLight.length; i++) {
      var g = grainLight[i];
      ctx.lineWidth = g[3];
      ctx.beginPath(); ctx.moveTo(g[0], g[1]); ctx.lineTo(g[0] + g[2], g[1] + g[4]); ctx.stroke();
    }
    ctx.fillStyle = '#5a3a22'; ctx.fillRect(0, 1200, 1600, 800);
    ctx.strokeStyle = 'rgba(40,25,12,0.35)';
    for (var j = 0; j < grainDark.length; j++) {
      var gd = grainDark[j];
      ctx.lineWidth = gd[3];
      ctx.beginPath(); ctx.moveTo(gd[0], gd[1]); ctx.lineTo(gd[0] + gd[2], gd[1] + gd[4]); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.30)'; ctx.fillRect(0, 1196, 1600, 5); ctx.fillRect(0, 1996, 1600, 5);
    // Gap slot (the void the marble flies over).
    var gs = d.gapSlot;
    ctx.fillStyle = '#241407'; ctx.fillRect(gs[0], gs[1], gs[2], gs[3]);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 3;
    ctx.strokeRect(gs[0], gs[1], gs[2], gs[3]);

    // Track rails, walls, floors.
    for (var si = 0; si < R.segs.length; si++) drawSeg(R.segs[si]);
    // Trapdoor plank (swings down when the last domino falls).
    var tp = d.trap.pivot;
    ctx.save();
    ctx.translate(tp[0], tp[1]); ctx.rotate(R.trapOpen * 1.2);
    ctx.fillStyle = '#b98a5a'; ctx.fillRect(0, -6, R.trapSeg.x2 - R.trapSeg.x1, 12);
    ctx.restore();

    // Dominoes.
    for (var di = 0; di < R.dominoes.length; di++) {
      var dm = R.dominoes[di];
      ctx.save(); ctx.translate(dm.x, dm.base); ctx.rotate(dm.th * dm.dir);
      ctx.fillStyle = dm.color;
      ctx.fillRect(-8, -dm.h, 16, dm.h);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(-8, -dm.h, 4, dm.h);
      ctx.restore();
    }

    // Spinner gate (blue, three arms).
    var SP = R.spin;
    ctx.save(); ctx.translate(SP.x, SP.y); ctx.rotate(SP.phi);
    ctx.strokeStyle = '#2b6cb0'; ctx.lineWidth = 26; ctx.lineCap = 'round';
    for (var a = 0; a < 3; a++) {
      var ang = a * Math.PI * 2 / 3;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * SP.arm, Math.sin(ang) * SP.arm); ctx.stroke();
      ctx.fillStyle = '#b8bec6';
      ctx.beginPath(); ctx.arc(Math.cos(ang) * 68, Math.sin(ang) * 68, 11, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#b8bec6';
    ctx.beginPath(); ctx.arc(SP.x, SP.y, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a3a22';
    ctx.beginPath(); ctx.arc(SP.x, SP.y, 6, 0, Math.PI * 2); ctx.fill();

    // Seesaw.
    var SS = R.seesaw;
    ctx.fillStyle = '#8a5a32';
    ctx.beginPath(); ctx.moveTo(SS.pivotX - 20, SS.pivotY + 50); ctx.lineTo(SS.pivotX + 20, SS.pivotY + 50); ctx.lineTo(SS.pivotX, SS.pivotY); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.translate(SS.pivotX, SS.pivotY); ctx.rotate(SS.ang);
    ctx.fillStyle = '#b98a5a'; ctx.fillRect(-SS.half, -9, SS.half * 2, 18);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(-SS.half, -9, SS.half * 2, 5);
    ctx.restore();

    // Box (open, seen from above) with a star mark on its rim.
    var bx = d.box, bw = bx.x2 - bx.x1;
    ctx.fillStyle = '#8a5a32'; ctx.fillRect(bx.x1 - 6, bx.yTop - 6, bw + 12, bx.yFloor - bx.yTop + 12);
    ctx.fillStyle = '#3a2716'; ctx.fillRect(bx.x1 + 6, bx.yTop + 6, bw - 12, bx.yFloor - bx.yTop - 12);
    ctx.fillStyle = '#8a5a32'; ctx.fillRect(bx.x1, bx.yFloor + 6, bw, 24);
    ctx.fillStyle = '#f2c200'; starPath((bx.x1 + bx.x2) / 2, bx.yFloor + 18, 10); ctx.fill();

    // Hand: releases the marble, then leaves frame.
    var hx = d.ballStart[0];
    if (R.handT < 1.3) {
      var hy = 185 - Math.min(1, R.handT / 1.1) * 345;
      ctx.fillStyle = '#e8b48c';
      ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(hx, hy, 48, 36, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      var fx = [-38, -18, 2, 26];
      for (var fi = 0; fi < 4; fi++) {
        ctx.beginPath(); ctx.ellipse(hx + fx[fi], hy + 48, 9, 26, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      ctx.beginPath(); ctx.ellipse(hx - 48, hy + 18, 22, 10, -0.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    // The marble.
    ctx.fillStyle = '#d92b2e';
    ctx.beginPath(); ctx.arc(R.ball.x, R.ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#a81f22'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(R.ball.x - 5, R.ball.y - 6, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    ctx.beginPath(); ctx.arc(R.ball.x + 4, R.ball.y + 7, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- audio follow ----------
  var whir = null;
  function updateAudio() {
    if (!AC) return;
    var spd = Math.sqrt(R.ball.vx * R.ball.vx + R.ball.vy * R.ball.vy);
    if (rollGain) rollGain.gain.value = (!muted && R.ball.state === 'ROLL' && contact) ? Math.min(0.14, spd / 1500 * 0.14) : 0;
    if (R.spin.om > 0.3 && !muted) {
      if (!whir) {
        var len = AC.sampleRate, buf = AC.createBuffer(1, len, AC.sampleRate), dd = buf.getChannelData(0);
        for (var i = 0; i < len; i++) dd[i] = Math.random() * 2 - 1;
        var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
        var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2;
        var g = AC.createGain(); g.gain.value = 0;
        src.connect(f); f.connect(g); g.connect(master); src.start();
        whir = { f: f, g: g };
      }
      whir.f.frequency.value = 250 + R.spin.om * 130;
      whir.g.gain.value = Math.min(0.12, R.spin.om * 0.015);
    } else if (whir) whir.g.gain.value = 0;
    if (R.ball.state === 'DONE' && !doneSound) {
      doneSound = true; knock(180, 0.25, 0.15); click(0.15);
    }
  }

  // ---------- camera + main loop ----------
  var qs = new URLSearchParams(location.search);
  var freezeT = qs.get('t') !== null ? parseFloat(qs.get('t')) : null;
  var manual = qs.get('manual') !== null;
  var startM = qs.get('m');
  var startIdx = (startM === '1' || startM === 'B' || startM === 'b') ? 1 : 0;
  window.__ENGINE = { stages: [], machine: startIdx, done: false, pos: null };
  loadMachine(startIdx);
  view.x = 0; view.y = 0;
  var acc = 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var el = (now - last) / 1000; last = now;
    if (el > 0.1) el = 0.1;
    acc += el;
    var n = 0;
    while (acc >= DT && n < 4000) {
      if (freezeT !== null && R.simTime >= freezeT) break;
      step(); acc -= DT; n++;
    }
    if (n >= 4000) acc = 0;
    if (window.__ENGINE) {
      window.__ENGINE.pos = { x: Math.round(R.ball.x), y: Math.round(R.ball.y),
        vx: Math.round(R.ball.vx), vy: Math.round(R.ball.vy), state: R.ball.state,
        t: Math.round(R.simTime * 10) / 10 };
    }
    // Follow-cam with eased lookahead.
    var tx = R.ball.x + R.ball.vx * 0.35 - view.w / 2;
    var ty = R.ball.y + R.ball.vy * 0.35 - 675;
    var k = 1 - Math.exp(-3 * el);
    view.x += (tx - view.x) * k;
    view.y += (ty - view.y) * k;
    if (view.w >= WORLD_W) view.x = (WORLD_W - view.w) / 2;
    else view.x = Math.max(0, Math.min(WORLD_W - view.w, view.x));
    view.y = Math.max(0, Math.min(WORLD_H - 1350, view.y));
    updateAudio();
    draw();
  }
  // Debug hooks for headless testing (read-only state exposure).
  window.__ENGINE_STEP = step;
  window.__ENGINE_LOAD = loadMachine;
  window.__ENGINE_STATE = function () {
    return { machine: R.idx, stages: R.stages.slice(), simTime: R.simTime,
             ball: { x: R.ball.x, y: R.ball.y, vx: R.ball.vx, vy: R.ball.vy, state: R.ball.state } };
  };
  if (!manual) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
