// 9104 from-scratch rigid-body simulation.
// One unified impulse-based engine, fixed timestep, deterministic (no randomness).
// No DOM dependency: usable from Node tests and from the browser renderer.
// Rules enforced by construction (no exceptions anywhere in this file):
//  - no capture zones, no lerping to centers, no fixed release velocities
//  - no angle-threshold triggers for behavior (logging only)

      inertia: 0.5 * m * r * r, invInertia: 1 / (0.5 * m * r * r),
      cat: cat, mask: mask, fric: fric, rest: rest,
      fixtures: [fixture(0, 0, 0, 0, 0, cat, mask, fric, rest, 'circle')] };
  }
  // Box fixture: local center (cx,cy), size (w,h), local angle a.

  // Pinned body: rotates about `anchor`, position derived from angle.

  // Numerical safety rails only: they engage solely on pathological

  function staticBox(id, cx, cy, w, h, angle, mask) {

    var best = { pen: Infinity, nx: 0, ny: 0 };

  // ---------------- solver ----------------

  // ---------------- machine ----------------

// Camera director for 9104 (CAMERA-V5 + MORE-V6 + LOOP-V7: generalized to generated maps). Research-grounded, no engine dependency:
//  - Unity Cinemachine Target Group: frame a weighted GROUP of targets, not one
//    object; the group's bounding box sets the framing (Unity docs, "Follow and
//    frame a group", Cinemachine 3.1). Here the group is dynamic: whatever is
//    actually moving right now.
//  - Cinemachine Composer: lookahead along motion, a dead zone that ignores
//    small movement, and damping so the camera never jitters or hunts
//    (CinemachineAimComposer docs: lookahead time/smoothing, dead zone, damping).
//  - One-shot Rube Goldberg filming (Fischli & Weiss "The Way Things Go", OK Go's
//    one-shot machine): the camera walks with the action in one continuous move
//    instead of cutting between close-ups, so the transfer of energy stays visible.
// Rules: the camera frames the bounding box of all currently-moving bodies

// fallen row, and the dominoes about to fall are always in one shot). It only
// zooms out as far as the action needs and drifts back in slowly. When nothing
// No hard cuts, no snapping.
// MORE-V6: lookahead 0.5 s (was 0.35), mechanism pre-frame radius 420

      if (bb.minY + Math.min(0, ly) < minY) minY = bb.minY + Math.min(0, ly);
      if (bb.maxY + Math.max(0, ly) > maxY) maxY = bb.maxY + Math.max(0, ly);

    // on it, so the landing is already in shot.

    });
    ctx.restore();
    ctx.beginPath(); ctx.arc(w.map.crankX, w.map.crankY, 8, 0, Math.PI * 2); ctx.fillStyle = '#2a1a0c'; ctx.fill();
    // pendulum: bracket on the tray wall, rod + brass bob (may be absent)
    if (w.pendulum) {
      ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(w.map.pendX + 110, w.map.pendY); ctx.lineTo(w.map.pendX, w.map.pendY); ctx.stroke();
      ctx.beginPath(); ctx.arc(w.map.pendX, w.map.pendY, 5, 0, Math.PI * 2); ctx.fillStyle = '#2a1a0c'; ctx.fill();
      w.pendulum.fixtures.forEach(function (f) {
        poly(SIM.fixtureCorners(w.pendulum, f));
        ctx.fillStyle = f.name === 'bob' ? '#c9a227' : '#6b4a2f'; ctx.fill();
      });
    }
    // box-star flash: bursts over the ball on a real box impact (MORE-V6)
    if (starFlash > 0.02) {
      ctx.save(); ctx.translate(w.map.boxX, w.map.boxFloorY - 25); ctx.scale(1 + 0.35 * starFlash, 1 + 0.35 * starFlash);
      ctx.shadowColor = 'rgba(242,193,78,0.9)'; ctx.shadowBlur = 16 + 60 * starFlash;
      ctx.fillStyle = 'rgba(242,193,78,' + (0.4 + 0.6 * starFlash) + ')';
      star(0, 0, 18); ctx.fill(); ctx.restore();
    }
    // hand: holds ball 1, then leaves frame after release
    if (w.t < 1.5) {
      var ha = w.t < 0.6 ? 1 : Math.max(0, 1 - (w.t - 0.6) / 0.9);
      var hy = w.t < 0.6 ? 0 : -(w.t - 0.6) * 250;
      if (ha > 0) {
        ctx.save(); ctx.globalAlpha = ha; ctx.translate(0, hy);
        ctx.fillStyle = '#e8b48c';
        var hb = w.balls[0];
        ctx.beginPath(); ctx.ellipse(hb.x - 28.7, hb.y - 39.8, 38, 26, -0.35, 0, Math.PI * 2); ctx.fill();
        for (var fi = 0; fi < 4; fi++) {
          ctx.beginPath(); ctx.ellipse(hb.x - 2.7 + fi * 3, hb.y - 25.8 + fi * 9, 10, 20, 0.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
    }
    ctx.restore();
    // quiet vignette: keeps the eye on the machine, never fights the pieces
    var vcx = viewW / 2, vcy = viewH / 2;
    var vg = ctx.createRadialGradient(vcx, vcy, Math.min(viewW, viewH) * 0.35, vcx, vcy, Math.max(viewW, viewH) * 0.75);
    vg.addColorStop(0, 'rgba(20,10,4,0)'); vg.addColorStop(1, 'rgba(20,10,4,0.20)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, viewW, viewH);
  }

  // ---- camera + endless loop: the director frames the moving group, not
  // one ball; when a map finishes (or jams) it dissolves into a fresh
  // generated map, forever. No click, no tap, no reload, ever. ----
  var fadePhase = 'run', fadeT = 0;
  function frame(now) {
    if (freezeT === null) {
      if (fadePhase === 'out') {
        fadeT += 1 / 60;
        if (fadeT >= 0.9) {
          w = SIM.buildWorld(nextSeed());
          camSt = CAM9104.createState(w.balls[0].x, w.balls[0].y); camSt.scale = baseScale;
          camX = w.balls[0].x; camY = w.balls[0].y; scale = baseScale;
          starFlash = 0; lastSoundAt = {};
          fadePhase = 'in'; fadeT = 0;
        }
      } else {
        // step sim in real time (DT = 1/480, up to 24 steps/frame catch-up)
        var target = w.t + 1 / 60;
        var n = 0;
        while (w.t < target && n < 24 && !w.done) { SIM.stepWorld(w); n++; }
        if (fadePhase === 'in') { fadeT += 1 / 60; if (fadeT >= 0.9) fadePhase = 'run'; }
      }
      audioStep();
      if (w.lastContacts) {
        for (var ci2 = 0; ci2 < w.lastContacts.length; ci2++) {
          var c2 = w.lastContacts[ci2];
          if (Math.abs(c2.jn || 0) < 200) continue;
          var aId = c2.a.id || '', bId = c2.b.id || '';
          var isBall = function (b) { return w.balls.indexOf(b) >= 0; };
          if ((aId.indexOf('box') === 0 && isBall(c2.b)) ||
              (bId.indexOf('box') === 0 && isBall(c2.a))) starFlash = 1;
        }
      }
      starFlash *= Math.exp(-1.5 / 60);
      var tgt = CAM9104.targetFor(w, vw, vh, baseScale, camSt, 1 / 60);
      if (tgt) CAM9104.stepCam(camSt, tgt, 1 / 60);
      camX = camSt.x; camY = camSt.y; scale = camSt.scale;
      var viewW = vw / scale, viewH = vh / scale;
      camX = viewW >= 1400 ? 700 : Math.max(viewW / 2, Math.min(1400 - viewW / 2, camX));
      camY = viewH >= 2000 ? 1000 : Math.max(viewH / 2, Math.min(2000 - viewH / 2, camY));
      camSt.x = camX; camSt.y = camY;
      draw();
      // dissolve overlay between maps (rendering only, never physics)
      if (fadePhase === 'out' || fadePhase === 'in') {
        var fa = fadePhase === 'out' ? Math.min(1, fadeT / 0.9) : Math.max(0, 1 - fadeT / 0.9);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.fillStyle = 'rgba(26,18,11,' + fa.toFixed(3) + ')';
        ctx.fillRect(0, 0, vw, vh);
      }
      if ((w.done || w.jammed) && fadePhase === 'run') { fadePhase = 'out'; fadeT = 0; }
      requestAnimationFrame(frame);
    }
  }
  if (freezeT !== null) {
    while (w.t < freezeT && !w.done) SIM.stepWorld(w);
    var fst = CAM9104.createState(w.balls[0].x, w.balls[0].y); fst.scale = baseScale;
    for (var fi = 0; fi < 400; fi++) {
      var ft = CAM9104.targetFor(w, vw, vh, baseScale, fst, 1 / 60);
      if (ft) CAM9104.stepCam(fst, ft, 1 / 60);
    }
    camX = fst.x; camY = fst.y; scale = fst.scale;
    var viewW = vw / scale, viewH = vh / scale;
    camX = viewW >= 1400 ? 700 : Math.max(viewW / 2, Math.min(1400 - viewW / 2, camX));
    camY = viewH >= 2000 ? 1000 : Math.max(viewH / 2, Math.min(2000 - viewH / 2, camY));
    draw();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
