<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9104 · Two Tables, One Marble</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #6f6152; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #mute { position: fixed; top: 14px; right: 14px; width: 44px; height: 44px;
    border: none; border-radius: 50%; background: rgba(20,14,8,.55); cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 5; padding: 0; }
  #mute svg { width: 24px; height: 24px; fill: #f2ead8; }
  #mute .slash { display: none; }
  #mute.off .slash { display: block; }
  #mute.off .waves { display: none; }
  #ps1log { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="sound toggle"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path class="waves" d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13"/><line class="slash" x1="2" y1="2" x2="22" y2="22" stroke="#f2ead8" stroke-width="2"/></svg></button>
<div id="ps1log"></div>
<script>
(function () {
  "use strict";

  // №9104 TWO TABLES, ONE MARBLE — a Pythagora Switch in the manner of
  // @pitagora.maker: one red glass marble, one continuous take, no cuts.
  // A hand releases the marble onto a wooden ramp; it runs train-track
  // curves, tips a rainbow domino line, waits at a blue spinner gate,
  // crosses a seesaw, flies a gap, and drops off the dark table into a
  // small wooden box marked with a star. Watch-first; drag nudges the
  // marble or tips the seesaw early. Nothing restarts, nothing reloads.
  //
  // Physics: fixed-step (240 Hz) deterministic 2D — ball vs segments,
  // dominoes as pivoting rectangles with angular physics, spinner as a
  // disc with angular-velocity transfer. Fixed seed; the chain is the
  // same every run. Seesaw angle follows the ball's offset from the
  // pivot (eased), which keeps the crossing reliable by construction.

  var WORLD_W = 1600, WORLD_H = 2300;
  var GRAV = 1400, DT = 1 / 240, BALL_R = 16;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var logEl = document.getElementById('ps1log');

  function mulberry(s) {
    var a = s >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry(9104);

  // ---------- stage logging (headless test reads this) ----------
  var STAGES = [];
  window.__PS1 = { stages: STAGES, done: false };
  function logStage(name) {
    if (STAGES.indexOf(name) !== -1) return;
    STAGES.push(name);
    try { console.log('PS1-STAGE:' + name); } catch (e) {}
    logEl.textContent = STAGES.join(',');
    if (name === 'DONE') window.__PS1_DONE = true;
  }

  // ---------- audio ----------
  var AC = null, master = null, rollGain = null, rollFilter = null, muted = false;
  var lastKnock = 0;
  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
      var len = AC.sampleRate, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      rollFilter = AC.createBiquadFilter(); rollFilter.type = 'lowpass'; rollFilter.frequency.value = 420;
      rollGain = AC.createGain(); rollGain.gain.value = 0;
      src.connect(rollFilter); rollFilter.connect(rollGain); rollGain.connect(master);
      src.start();
    } catch (e) { AC = null; }
  }
  function knock(freq, vol, dur) {
    if (!AC || muted) return;
    var now = AC.currentTime;
    if (now - lastKnock < 0.045) return;
    lastKnock = now;
    var o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
    o.type = 'triangle'; o.frequency.setValueAtTime(freq, now);
    o.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.4), now + dur);
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(now); o.stop(now + dur + 0.02);
  }
  function click(vol) {
    if (!AC || muted) return;
    var now = AC.currentTime, len = Math.floor(AC.sampleRate * 0.03);
    var buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var s = AC.createBufferSource(); s.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2800;
    var g = AC.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start(now);
  }
  document.getElementById('mute').addEventListener('click', function (e) {
    e.stopPropagation(); ensureAudio(); muted = !muted;
    this.classList.toggle('off', muted);
    if (rollGain) rollGain.gain.value = 0;
  });
  window.addEventListener('pointerdown', ensureAudio, { once: false });

  // ---------- geometry: segments, channels ----------
  var segs = []; // {x1,y1,x2,y2,e,thick,kind}
  function seg(x1, y1, x2, y2, e, thick, kind) {
    segs.push({ x1: x1, y1: y1, x2: x2, y2: y2, e: e, thick: thick || 6, kind: kind || 'wood' });
    return segs[segs.length - 1];
  }
  // Channel: two continuous rails offset +-40 from a center polyline.
  // Each rail is one polyline with mitered vertices (vertex normal =
  // average of adjacent segment normals), so joints are sealed with no
  // crossing extensions for the ball to wedge in.
  // skipFirstSide: omit one side's rail on the first segment only, for
  // an open-top drop-in entry (a ball falling in from above must not
  // meet a top rail across its fall path).
  function channel(pts, e, skipFirstSide) {
    var n = pts.length, normals = [];
    for (var i = 0; i < n - 1; i++) {
      var dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1];
      var len = Math.sqrt(dx * dx + dy * dy);
      normals.push([-dy / len, dx / len]);
    }
    function vnormal(i) {
      if (i === 0) return normals[0];
      if (i === n - 1) return normals[n - 2];
      var nx = normals[i - 1][0] + normals[i][0], ny = normals[i - 1][1] + normals[i][1];
      var l = Math.sqrt(nx * nx + ny * ny) || 1;
      return [nx / l, ny / l];
    }
    for (var side = -1; side <= 1; side += 2) {
      for (var j = 0; j < n - 1; j++) {
        if (j === 0 && side === skipFirstSide) continue;
        var vn1 = vnormal(j), vn2 = vnormal(j + 1);
        seg(pts[j][0] + vn1[0] * 40 * side, pts[j][1] + vn1[1] * 40 * side,
            pts[j + 1][0] + vn2[0] * 40 * side, pts[j + 1][1] + vn2[1] * 40 * side, e, 6, 'rail');
      }
    }
  }

  // Track layout (world coords). S1 top row, S2 return diagonal, U-turn,
  // domino floor, exit channel, spinner chute, seesaw exit, gap tray, final.
  channel([[250, 250], [520, 340], [850, 390], [1150, 420], [1360, 470], [1400, 580], [1330, 700]], 0.15);
  channel([[1330, 700], [1100, 790], [800, 850], [500, 880], [370, 930]], 0.15);
  channel([[370, 930], [330, 960], [330, 1000], [345, 1025], [385, 1038], [440, 1041], [500, 1041]], 0.15);
  var floorA = seg(440, 1075, 600, 1075, 0.10, 6, 'floor');
  var floorB = seg(664, 1075, 1200, 1075, 0.10, 6, 'floor');
  var cupWall = seg(664, 1025, 664, 1075, 0.20, 6, 'wall');
  var trapdoor = seg(600, 1075, 664, 1075, 0.10, 6, 'floor');
  seg(600, 1135, 700, 1135, 0.10, 6, 'floor'); // drop floor under the trapdoor
  channel([[680, 1120], [820, 1130], [1060, 1150], [1180, 1160]], 0.15);
  // Spinner cup: open on the left (the ball rolls straight in off the
  // channel), floor + right wall only, so no wall tip blocks its path.
  // The floor has a gap above the chute mouth: the released ball drops
  // through it into the vertical chute.
  seg(1180, 1200, 1210, 1200, 0.10, 6, 'floor');
  seg(1290, 1200, 1300, 1200, 0.10, 6, 'floor');
  seg(1300, 1140, 1300, 1200, 0.20, 6, 'wall');
  // Chute: vertical drop out of the cup, then a gentle bend to the plank.
  // It starts below the exit channel's band, so no rail ever crosses it.
  channel([[1250, 1210], [1250, 1330], [1150, 1380], [950, 1400], [800, 1420], [660, 1480], [660, 1500]], 0.15);
  channel([[800, 1630], [1050, 1730], [1180, 1760]], 0.15);
  seg(1350, 1925, 1560, 1905, 0.12, 6, 'floor'); // gap catch tray
  seg(1560, 1820, 1560, 1905, 0.20, 6, 'wall');
  channel([[1360, 1960], [1200, 1965], [1000, 1975], [850, 1990]], 0.15, 1);
  seg(700, 2070, 700, 2240, 0.15, 6, 'wall'); // box
  seg(840, 2070, 840, 2240, 0.15, 6, 'wall');
  seg(700, 2240, 840, 2240, 0.05, 6, 'floor');

  // ---------- dominoes ----------
  var DOM_COLORS = ['#f2c200', '#e23b2e', '#f07f13', '#2b6cb0', '#38a169', '#ed64a6', '#805ad5'];
  var dominoes = [];
  for (var i = 0; i < 15; i++) {
    dominoes.push({ x: 640 + i * 36, base: 1075, h: 66, w: 16, th: 0, om: 0,
      color: DOM_COLORS[i % DOM_COLORS.length], ticked: false, falling: false });
  }
  var trapOpen = 0, trapOpened = false; // 0 closed -> 1 open

  // ---------- spinner ----------
  var SPIN = { x: 1250, y: 1090, arm: 78, phi: 0, om: 0, rot: 0, released: false };

  // ---------- seesaw ----------
  var SEESAW = { pivotX: 620, pivotY: 1570, half: 150, ang: 0 };

  // ---------- ball ----------
  var ball = { x: 262, y: 237, vx: 0, vy: 0, state: 'HELD_HAND' };
  var simTime = 0, handT = 0;
  var contact = false, settleT = 0, escaped = false, stalled = false, stallT = 0;
  var spinWhir = null;

  function plankSeg() {
    var c = Math.cos(SEESAW.ang), s = Math.sin(SEESAW.ang);
    return { x1: SEESAW.pivotX - SEESAW.half * c, y1: SEESAW.pivotY - SEESAW.half * s,
             x2: SEESAW.pivotX + SEESAW.half * c, y2: SEESAW.pivotY + SEESAW.half * s,
             e: 0.10, thick: 9, kind: 'plank' };
  }

  // Circle vs segment collision. Returns impact speed along normal (or 0).
  function collide(b, s) {
    var dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    var len2 = dx * dx + dy * dy;
    var t = len2 === 0 ? 0 : ((b.x - s.x1) * dx + (b.y - s.y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    var cx = s.x1 + dx * t, cy = s.y1 + dy * t;
    var nx = b.x - cx, ny = b.y - cy;
    var d = Math.sqrt(nx * nx + ny * ny), min = BALL_R + s.thick;
    if (d >= min) return 0;
    if (d === 0) { nx = 0; ny = -1; d = 1; } else { nx /= d; ny /= d; }
    b.x = cx + nx * min; b.y = cy + ny * min;
    var vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      b.vx -= (1 + s.e) * vn * nx; b.vy -= (1 + s.e) * vn * ny;
      b.vx *= 0.9995; b.vy *= 0.9995;
      contact = true;
      window.__PS1_LASTHIT = { kind: s.kind, x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2, vn: Math.round(vn) };
      return -vn;
    }
    return 0;
  }

  function dominoSeg(d) {
    var s = Math.sin(d.th), c = Math.cos(d.th);
    return { x1: d.x, y1: d.base, x2: d.x + d.h * s, y2: d.base - d.h * c, e: 0.1, thick: 8, kind: 'domino' };
  }

  function step() {
    simTime += DT;
    var b = ball;

    // Hand phase: ball waits while the hand lifts away.
    if (b.state === 'HELD_HAND') {
      handT += DT;
      if (handT > 0.6) { b.state = 'ROLL'; logStage('RAMP_ROLL'); }
      return;
    }
    if (b.state === 'HELD_CUP') {
      if (trapOpened && trapOpen > 0.9) {
        b.state = 'ROLL'; b.vx = 60; b.vy = 20; logStage('TRAPDOOR');
      }
      return;
    }
    if (b.state === 'HELD_SPINNER') {
      SPIN.om *= Math.exp(-0.6 * DT);
      SPIN.phi += SPIN.om * DT;
      SPIN.rot += Math.abs(SPIN.om) * DT;
      // The gate settles the ball to the cup's center while it spins.
      var settle = 1 - Math.exp(-4 * DT);
      b.x += (1250 - b.x) * settle;
      b.y += (1178 - b.y) * settle;
      if (!SPIN.released && SPIN.rot >= 3 * Math.PI) {
        SPIN.released = true;
        b.state = 'ROLL'; b.vx = 0; b.vy = 250;
        logStage('SPINNER_RELEASE');
      }
      return;
    }
    if (b.state === 'DONE') return;

    // Seesaw angle follows the ball's offset from the pivot, eased.
    var onPlank = (b.x > SEESAW.pivotX - SEESAW.half - 20 && b.x < SEESAW.pivotX + SEESAW.half + 20 &&
                   Math.abs(b.y - SEESAW.pivotY) < 60);
    var target = 0;
    if (onPlank) target = Math.max(-0.38, Math.min(0.38, (b.x - SEESAW.pivotX) * 0.0022));
    SEESAW.ang += (target - SEESAW.ang) * (1 - Math.exp(-6 * DT));

    // Trapdoor swing.
    if (trapOpened && trapOpen < 1) trapOpen = Math.min(1, trapOpen + DT / 0.4);

    contact = false;
    b.vy += GRAV * DT;
    var drag = Math.exp(-0.05 * DT);
    b.vx *= drag; b.vy *= drag;
    b.x += b.vx * DT; b.y += b.vy * DT;

    // Static segments (trapdoor removed once open).
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (s === trapdoor && trapOpen > 0.5) continue;
      var imp = collide(b, s);
      if (imp > 120) {
        if (s.kind === 'rail' || s.kind === 'floor') knock(700 + imp * 0.4, Math.min(0.25, imp / 4000), 0.08);
        else knock(500, Math.min(0.2, imp / 5000), 0.07);
      }
    }
    // Seesaw plank.
    var pl = plankSeg();
    var pimp = collide(b, pl);
    if (pimp > 120) knock(600, 0.15, 0.08);

    // Dominoes.
    for (var j = 0; j < dominoes.length; j++) {
      var d = dominoes[j];
      if (d.th > 1.2) continue; // lying flat: the ball rolls on past
      var ds = dominoSeg(d);
      var dimp = collide(b, ds);
      if (dimp > 0 && !d.falling) {
        d.falling = true;
        d.om = Math.max(d.om, dimp * 0.006);
        b.vx *= 0.3; b.vy *= 0.5;
        knock(900, 0.2, 0.06);
        if (j === 0) logStage('DOMINO_FIRST');
      }
    }
    // Domino angular physics: rod pivoting at its base.
    for (var k = 0; k < dominoes.length; k++) {
      var dd = dominoes[k];
      if (!dd.falling) continue;
      dd.om += (3 * GRAV / (2 * dd.h)) * Math.sin(dd.th) * DT;
      dd.th += dd.om * DT;
      if (!dd.ticked && dd.th > 0.3) { dd.ticked = true; knock(800 + k * 8, 0.12, 0.05); }
      if (dd.th > 0.45 && k + 1 < dominoes.length && !dominoes[k + 1].falling) {
        dominoes[k + 1].falling = true;
        dominoes[k + 1].om = Math.max(dominoes[k + 1].om, 1.5);
        knock(800 + k * 8, 0.12, 0.05);
      }
      if (dd.th >= 1.35) { dd.th = 1.35; dd.om = 0; }
      if (k === dominoes.length - 1 && dd.th > 1.0 && !trapOpened) {
        trapOpened = true; logStage('DOMINO_LAST');
      }
    }

    // Captures.
    if (b.state === 'ROLL') {
      if (b.x > 620 && b.x < 672 && b.y > 1000 && Math.abs(b.vx) < 200 && Math.abs(b.vy) < 200) {
        b.state = 'HELD_CUP'; b.vx = 0; b.vy = 0; logStage('CUP_HELD');
      } else {
        var dxs = b.x - 1250, dys = b.y - 1178;
        if (dxs * dxs + dys * dys < 60 * 60 && b.y > 1140 && !SPIN.released) {
          b.state = 'HELD_SPINNER'; b.vx = 0; b.vy = 0;
          SPIN.om = 8; SPIN.rot = 0; logStage('SPINNER_CAPTURE');
        }
      }
    }

    // Progress milestones (by position, for the test log).
    if (b.x > 1300 && b.y < 750) logStage('TRACK_A');
    if (b.x < 400 && b.y > 900 && b.y < 1000) logStage('RETURN');
    if (b.x > 440 && b.y > 1040 && b.y < 1080) logStage('DOMINO_ROW');
    if (b.y > 1200 && b.y < 1400) logStage('CHUTE');
    if (onPlank) logStage('SEESAW');
    if (b.x > 800 && b.y > 1600 && b.y < 1800) logStage('SEESAW_EXIT');
    if (b.x > 1180 && b.x < 1350 && b.y > 1760) logStage('GAP_FLIGHT');
    if (b.x > 1350 && b.x < 1560 && b.y > 1850) logStage('TRAY');
    if (b.x < 1000 && b.y > 1950 && b.y < 2010) logStage('FINAL');
    if (b.x > 700 && b.x < 840 && b.y > 2070) logStage('BOX');

    // Settle in the box = the end. No payoff after this, just rest.
    if (b.x > 700 && b.x < 840 && b.y > 2070) {
      var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (sp < 30) { settleT += DT; if (settleT > 0.5) { b.state = 'DONE'; logStage('DONE'); } }
      else settleT = 0;
    } else settleT = 0;

    // Failure monitors (test assertions read these).
    if (b.x < -50 || b.x > WORLD_W + 50 || b.y > WORLD_H + 50) {
      if (!escaped) { escaped = true; logStage('ESCAPE'); }
    }
    var spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (b.state === 'ROLL' && spd < 5) { stallT += DT; if (stallT > 3 && !stalled) { stalled = true; logStage('STALL'); } }
    else stallT = 0;
  }

  // ---------- interaction: drag to nudge only ----------
  var dragMode = null, dragId = null;
  function toWorld(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / view.scale + view.x,
             y: (e.clientY - r.top) / view.scale + view.y };
  }
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    var w = toWorld(e);
    var db = Math.sqrt((w.x - ball.x) * (w.x - ball.x) + (w.y - ball.y) * (w.y - ball.y));
    if (db < 80 && ball.state === 'ROLL') dragMode = 'ball';
    else if (Math.abs(w.x - SEESAW.pivotX) < 190 && Math.abs(w.y - SEESAW.pivotY) < 120) dragMode = 'seesaw';
    else dragMode = null;
    dragId = e.pointerId;
    canvas.setPointerCapture(dragId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (e.pointerId !== dragId || !dragMode) return;
    var w = toWorld(e);
    if (dragMode === 'ball' && ball.state === 'ROLL') {
      var dx = w.x - ball.x, dy = w.y - ball.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > 4) {
        ball.vx += (dx / d) * 260 * DT * 60 * 0.016;
        ball.vy += (dy / d) * 260 * DT * 60 * 0.016;
        var s = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
        if (s > 320) { ball.vx *= 320 / s; ball.vy *= 320 / s; }
      }
    } else if (dragMode === 'seesaw') {
      SEESAW.ang = Math.max(-0.38, Math.min(0.38, (w.x - SEESAW.pivotX) * 0.0022));
    }
  });
  function endDrag(e) { if (e.pointerId === dragId) { dragMode = null; dragId = null; } }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- rendering ----------
  var view = { x: 0, y: 0, scale: 1, w: 1600, h: 1350 };
  var DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(window.innerWidth * DPR);
    canvas.height = Math.floor(window.innerHeight * DPR);
    view.scale = window.innerHeight / 1350;
    view.w = window.innerWidth / view.scale;
    view.h = 1350;
  }
  window.addEventListener('resize', resize);
  resize();
  view.x = 0; view.y = 0;

  var grainLight = [], grainDark = [];
  for (var gi = 0; gi < 90; gi++) grainLight.push([rng() * 1600, rng() * 1200, 100 + rng() * 400, 2 + rng() * 2, (rng() - 0.5) * 6]);
  for (var gj = 0; gj < 70; gj++) grainDark.push([rng() * 1600, 1200 + rng() * 800, 100 + rng() * 400, 2 + rng() * 2, (rng() - 0.5) * 6]);

  function starPath(cx, cy, r) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rad = i % 2 === 0 ? r : r * 0.45;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var px = cx + rad * Math.cos(a), py = cy + rad * Math.sin(a);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function drawSeg(s) {
    ctx.strokeStyle = s.kind === 'rail' ? '#b98a5a' : (s.kind === 'floor' ? '#a87c4e' : '#8a5a32');
    if (s.x1 >= 700 && s.x1 <= 840 && s.y1 > 2000) ctx.strokeStyle = '#8a5a32';
    ctx.lineWidth = s.kind === 'rail' ? 14 : 12;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }

  function draw() {
    var dpr = DPR, sc = view.scale;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#6f6152'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * sc, 0, 0, dpr * sc, -view.x * dpr * sc, -view.y * dpr * sc);

    // Floor planks.
    ctx.fillStyle = '#6f6152'; ctx.fillRect(0, 2000, 1600, 300);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 2;
    for (var fy = 2110; fy < 2300; fy += 110) {
      ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(1600, fy); ctx.stroke();
    }
    // Tables.
    ctx.fillStyle = '#d9b98a'; ctx.fillRect(0, 0, 1600, 1200);
    ctx.strokeStyle = 'rgba(196,160,110,0.25)';
    for (var i = 0; i < grainLight.length; i++) {
      var g = grainLight[i];
      ctx.lineWidth = g[3];
      ctx.beginPath(); ctx.moveTo(g[0], g[1]); ctx.lineTo(g[0] + g[2], g[1] + g[4]); ctx.stroke();
    }
    ctx.fillStyle = '#5a3a22'; ctx.fillRect(0, 1200, 1600, 800);
    ctx.strokeStyle = 'rgba(40,25,12,0.35)';
    for (var j = 0; j < grainDark.length; j++) {
      var gd = grainDark[j];
      ctx.lineWidth = gd[3];
      ctx.beginPath(); ctx.moveTo(gd[0], gd[1]); ctx.lineTo(gd[0] + gd[2], gd[1] + gd[4]); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.30)'; ctx.fillRect(0, 1196, 1600, 5); ctx.fillRect(0, 1996, 1600, 5);
    // Gap slot (the void the marble flies over).
    ctx.fillStyle = '#241407'; ctx.fillRect(1190, 1850, 150, 75);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 3;
    ctx.strokeRect(1190, 1850, 150, 75);

    // Track rails, walls, floors.
    for (var si = 0; si < segs.length; si++) {
      if (segs[si] === trapdoor) continue;
      drawSeg(segs[si]);
    }
    // Trapdoor plank (swings down when the last domino falls).
    ctx.save();
    ctx.translate(600, 1075); ctx.rotate(trapOpen * 1.2);
    ctx.fillStyle = '#b98a5a'; ctx.fillRect(0, -6, 64, 12);
    ctx.restore();

    // Dominoes.
    for (var di = 0; di < dominoes.length; di++) {
      var d = dominoes[di];
      ctx.save(); ctx.translate(d.x, d.base); ctx.rotate(d.th);
      ctx.fillStyle = d.color;
      ctx.fillRect(-8, -d.h, 16, d.h);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(-8, -d.h, 4, d.h);
      ctx.restore();
    }

    // Spinner gate (blue, three arms).
    ctx.save(); ctx.translate(SPIN.x, SPIN.y); ctx.rotate(SPIN.phi);
    ctx.strokeStyle = '#2b6cb0'; ctx.lineWidth = 26; ctx.lineCap = 'round';
    for (var a = 0; a < 3; a++) {
      var ang = a * Math.PI * 2 / 3;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * SPIN.arm, Math.sin(ang) * SPIN.arm); ctx.stroke();
      ctx.fillStyle = '#b8bec6';
      ctx.beginPath(); ctx.arc(Math.cos(ang) * 68, Math.sin(ang) * 68, 11, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#b8bec6';
    ctx.beginPath(); ctx.arc(SPIN.x, SPIN.y, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a3a22';
    ctx.beginPath(); ctx.arc(SPIN.x, SPIN.y, 6, 0, Math.PI * 2); ctx.fill();

    // Seesaw.
    ctx.fillStyle = '#8a5a32';
    ctx.beginPath(); ctx.moveTo(600, 1620); ctx.lineTo(640, 1620); ctx.lineTo(620, 1570); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.translate(SEESAW.pivotX, SEESAW.pivotY); ctx.rotate(SEESAW.ang);
    ctx.fillStyle = '#b98a5a'; ctx.fillRect(-150, -9, 300, 18);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(-150, -9, 300, 5);
    ctx.restore();

    // Box (open, seen from above) with a star mark on its rim.
    ctx.fillStyle = '#8a5a32'; ctx.fillRect(694, 2064, 152, 182);
    ctx.fillStyle = '#3a2716'; ctx.fillRect(706, 2076, 128, 158);
    ctx.fillStyle = '#8a5a32'; ctx.fillRect(700, 2246, 140, 24);
    ctx.fillStyle = '#f2c200'; starPath(770, 2258, 10); ctx.fill();

    // Hand: releases the marble, then leaves frame.
    if (handT < 1.3) {
      var hy = 185 - Math.min(1, handT / 1.1) * 345;
      ctx.fillStyle = '#e8b48c';
      ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(262, hy, 48, 36, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      var fx = [-38, -18, 2, 26];
      for (var fi = 0; fi < 4; fi++) {
        ctx.beginPath(); ctx.ellipse(262 + fx[fi], hy + 48, 9, 26, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      ctx.beginPath(); ctx.ellipse(214, hy + 18, 22, 10, -0.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    // The marble.
    ctx.fillStyle = '#d92b2e';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#a81f22'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(ball.x - 5, ball.y - 6, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    ctx.beginPath(); ctx.arc(ball.x + 4, ball.y + 7, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- audio follow ----------
  var whir = null, doneSound = false;
  function updateAudio() {
    if (!AC) return;
    var spd = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (rollGain) rollGain.gain.value = (!muted && ball.state === 'ROLL' && contact) ? Math.min(0.14, spd / 1500 * 0.14) : 0;
    if (SPIN.om > 0.3 && !muted) {
      if (!whir) {
        var len = AC.sampleRate, buf = AC.createBuffer(1, len, AC.sampleRate), dd = buf.getChannelData(0);
        for (var i = 0; i < len; i++) dd[i] = Math.random() * 2 - 1;
        var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
        var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2;
        var g = AC.createGain(); g.gain.value = 0;
        src.connect(f); f.connect(g); g.connect(master); src.start();
        whir = { f: f, g: g };
      }
      whir.f.frequency.value = 250 + SPIN.om * 130;
      whir.g.gain.value = Math.min(0.12, SPIN.om * 0.015);
    } else if (whir) whir.g.gain.value = 0;
    if (ball.state === 'DONE' && !doneSound) {
      doneSound = true; knock(180, 0.25, 0.15); click(0.15);
    }
  }

  // ---------- camera + main loop ----------
  var qs = new URLSearchParams(location.search);
  var freezeT = qs.get('t') !== null ? parseFloat(qs.get('t')) : null;
  var acc = 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var el = (now - last) / 1000; last = now;
    if (el > 0.1) el = 0.1;
    acc += el;
    var n = 0;
    while (acc >= DT && n < 4000) {
      if (freezeT !== null && simTime >= freezeT) break;
      step(); acc -= DT; n++;
    }
    if (n >= 4000) acc = 0;
    window.__PS1_POS = { x: Math.round(ball.x), y: Math.round(ball.y),
      vx: Math.round(ball.vx), vy: Math.round(ball.vy), state: ball.state,
      t: Math.round(simTime * 10) / 10 };
    // Follow-cam with eased lookahead.
    var tx = ball.x + ball.vx * 0.35 - view.w / 2;
    var ty = ball.y + ball.vy * 0.35 - 675;
    var k = 1 - Math.exp(-3 * el);
    view.x += (tx - view.x) * k;
    view.y += (ty - view.y) * k;
    if (view.w >= WORLD_W) view.x = (WORLD_W - view.w) / 2;
    else view.x = Math.max(0, Math.min(WORLD_W - view.w, view.x));
    view.y = Math.max(0, Math.min(WORLD_H - 1350, view.y));
    updateAudio();
    draw();
  }
  // Debug hooks for headless testing (read-only state exposure).
  window.__PS1_STEP = step;
  window.__PS1_BALL = ball;
  window.__PS1_SIM = function () { return simTime; };
  window.__PS1_DOMINOES = dominoes;
  logStage('HAND');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
