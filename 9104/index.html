<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="sound"></button>
<script>
// 9104 from-scratch rigid-body simulation.
// One unified impulse-based engine, fixed timestep, deterministic (no randomness).
// No DOM dependency: usable from Node tests and from the browser renderer.
// Rules enforced by construction (no exceptions anywhere in this file):
//  - no capture zones, no lerping to centers, no fixed release velocities
//  - no angle-threshold triggers for behavior (logging only)
//  - no scripted stage state machine driving motion; motion comes only from
//    gravity, contact impulses, friction, and pinned-body torques.
// A "hand block" static segment holds ball 1 on the ramp until t = 0.6 s and
// is then removed: a release, not a velocity preset.
(function (global) {
  'use strict';
  var GRAV = 2000;
  var DT = 1 / 480;
  var CAT = { BALL: 1, DOMINO: 2, STATIC: 4, ROTOR: 8, SEESAW: 16, CRANK: 32 };
  var ALL = 0xFFFF;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rotX(x, y, c, s) { return x * c - y * s; }
  function rotY(x, y, c, s) { return x * s + y * c; }

  // ---------------- bodies ----------------
  // Circle body: {kind:'circle', x,y,vx,vy,angle,omega,mass,invMass,inertia,invInertia,...}
  function circleBody(id, x, y, r, density, cat, mask, fric, rest) {
    var m = Math.PI * r * r * density / 100;
    // Dummy fixture (never used for shape, only for mask checks) so the
    // body-vs-static-box loop processes circles: without it, balls fell
    // straight through the shelf, housing, and box floor.
    return { id: id, kind: 'circle', type: 'dyn', x: x, y: y, vx: 0, vy: 0,
      angle: 0, omega: 0, r: r, mass: m, invMass: 1 / m,
      inertia: 0.5 * m * r * r, invInertia: 1 / (0.5 * m * r * r),
      cat: cat, mask: mask, fric: fric, rest: rest,
      fixtures: [fixture(0, 0, 0, 0, 0, cat, mask, fric, rest, 'circle')] };
  }
  // Box fixture: local center (cx,cy), size (w,h), local angle a.
  function fixture(cx, cy, w, h, a, cat, mask, fric, rest, name) {
    return { cx: cx, cy: cy, w: w, h: h, a: a || 0, cat: cat, mask: mask,
      fric: fric, rest: rest, name: name || '' };
  }
  // Dynamic single/multi-fixture box body.
  function polyBody(id, x, y, angle, fixtures, density) {
    var m = 0, ix = 0, iy = 0;
    for (var i = 0; i < fixtures.length; i++) {
      var f = fixtures[i], fm = f.w * f.h * density / 100;
      m += fm; ix += fm * f.cx; iy += fm * f.cy;
    }
    var comX = ix / m, comY = iy / m, inertia = 0;
    for (var j = 0; j < fixtures.length; j++) {
      var g = fixtures[j], gm = g.w * g.h * density / 100;
      var dx = g.cx - comX, dy = g.cy - comY;
      inertia += gm * (g.w * g.w + g.h * g.h) / 12 + gm * (dx * dx + dy * dy);
    }
    return { id: id, kind: 'poly', type: 'dyn', x: x, y: y, vx: 0, vy: 0,
      angle: angle, omega: 0, mass: m, invMass: 1 / m, inertia: inertia,
      invInertia: 1 / inertia, comX: comX, comY: comY, fixtures: fixtures };
  }
  // Pinned body: rotates about `anchor`, position derived from angle.
  // Fixture centers are local to the pivot. A torsional spring (k) and
  // angular damping (c) may be supplied; both are physical torques.
  function pinnedBody(id, anchorX, anchorY, fixtures, density, springK, dampC) {
    var b = polyBody(id, anchorX, anchorY, 0, fixtures, density);
    b.type = 'pinned'; b.invMass = 0;
    b.anchorX = anchorX; b.anchorY = anchorY;
    b.springK = springK || 0; b.springA0 = 0; b.dampC = dampC || 0;
    return b;
  }
  // Numerical safety rails only: they engage solely on pathological
  // penetration/velocity (vise cases), never in normal operation.
  function clampVelocity(b) {
    if (b.type !== 'dyn') return;
    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (sp > 5000) { b.vx *= 5000 / sp; b.vy *= 5000 / sp; }
    if (Math.abs(b.omega) > 50) b.omega = 50 * Math.sign(b.omega);
  }
  function staticBox(id, cx, cy, w, h, angle, mask) {
    return { id: id, kind: 'poly', type: 'static', x: cx, y: cy, vx: 0, vy: 0,
      angle: angle || 0, omega: 0, mass: Infinity, invMass: 0, inertia: Infinity,
      invInertia: 0, comX: 0, comY: 0,
      fixtures: [fixture(0, 0, w, h, 0, CAT.STATIC, mask, 0.8, 0, 'static')] };
  }
  // Pinned-body hinge limits are mechanical stops, not scripted motion.
  function applyHingeLimits(b) {
    if (b.type !== 'pinned') return;
    if (b.angleMin !== undefined && b.angle < b.angleMin) { b.angle = b.angleMin; if (b.omega < 0) b.omega = 0; }
    if (b.angleMax !== undefined && b.angle > b.angleMax) { b.angle = b.angleMax; if (b.omega > 0) b.omega = 0; }
  }
  function staticSeg(id, x1, y1, x2, y2, mask, fric, rest) {
    return { id: id, kind: 'seg', type: 'static', x1: x1, y1: y1, x2: x2, y2: y2,
      x: (x1 + x2) / 2, y: (y1 + y2) / 2, vx: 0, vy: 0, angle: 0, omega: 0,
      mass: Infinity, invMass: 0, inertia: Infinity, invInertia: 0,
      cat: CAT.STATIC, mask: mask, fric: fric || 0.5, rest: rest || 0.1 };
  }

  // World-space corners of a fixture of a poly body.
  function fixtureCorners(b, f) {
    var c = Math.cos(b.angle), s = Math.sin(b.angle);
    var cc = Math.cos(b.angle + f.a), ss = Math.sin(b.angle + f.a);
    var wx = b.x + rotX(f.cx, f.cy, c, s), wy = b.y + rotY(f.cx, f.cy, c, s);
    var hw = f.w / 2, hh = f.h / 2;
    var pts = [[hw, -hh], [hw, hh], [-hw, hh], [-hw, -hh]];
    var out = [];
    for (var i = 0; i < 4; i++) {
      out.push([wx + rotX(pts[i][0], pts[i][1], cc, ss),
                wy + rotY(pts[i][0], pts[i][1], cc, ss)]);
    }
    return out;
  }
  function bodyPoint(b, lx, ly) {
    var c = Math.cos(b.angle), s = Math.sin(b.angle);
    return [b.x + rotX(lx, ly, c, s), b.y + rotY(lx, ly, c, s)];
  }

  // ---------------- contact detection ----------------
  // Contact: {a, b, px, py, nx, ny, pen, fric, rest} with normal from A to B.
  function project(corners, ax, ay) {
    var mn = Infinity, mx = -Infinity;
    for (var i = 0; i < corners.length; i++) {
      var d = corners[i][0] * ax + corners[i][1] * ay;
      if (d < mn) mn = d; if (d > mx) mx = d;
    }
    return [mn, mx];
  }
  function faceNormal(corners, i) {
    var p1 = corners[i], p2 = corners[(i + 1) % 4];
    var ex = p2[0] - p1[0], ey = p2[1] - p1[1];
    var mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
    var cx = (corners[0][0] + corners[2][0]) / 2, cy = (corners[0][1] + corners[2][1]) / 2;
    var nx = ey, ny = -ex, len = Math.sqrt(nx * nx + ny * ny) || 1;
    nx /= len; ny /= len;
    if (nx * (mx - cx) + ny * (my - cy) < 0) { nx = -nx; ny = -ny; }
    return [nx, ny];
  }
  function clipSegment(p1, p2, nx, ny, offset) {
    var d1 = p1[0] * nx + p1[1] * ny - offset;
    var d2 = p2[0] * nx + p2[1] * ny - offset;
    var out = [];
    if (d1 <= 0) out.push(p1);
    if (d2 <= 0) out.push(p2);
    if (d1 * d2 < 0) {
      var t = d1 / (d1 - d2);
      out.push([p1[0] + (p2[0] - p1[0]) * t, p1[1] + (p2[1] - p1[1]) * t]);
    }
    return out;
  }
  // Box-box via SAT + reference/incident face clipping. Returns contacts (0..2).
  function collideBoxBox(bA, fA, bB, fB) {
    var cA = fixtureCorners(bA, fA), cB = fixtureCorners(bB, fB);
    var best = { sep: -Infinity, ref: null, refFace: -1, nx: 0, ny: 0 };
    function testFaces(cornersRef, cornersInc, refIsA) {
      for (var i = 0; i < 4; i++) {
        var n = faceNormal(cornersRef, i);
        var p = cornersRef[i];
        var minSep = Infinity;
        for (var j = 0; j < 4; j++) {
          var sep = (cornersInc[j][0] - p[0]) * n[0] + (cornersInc[j][1] - p[1]) * n[1];
          if (sep < minSep) minSep = sep;
        }
        // Separation of the incident box from the reference face plane:
        // positive means fully outside on that side. We track the LARGEST
        // (least penetrating) separation; collision needs all <= 0.
        if (minSep > best.sep) {
          best.sep = minSep; best.refIsA = refIsA; best.refFace = i;
          best.nx = n[0]; best.ny = n[1];
        }
      }
    }
    testFaces(cA, cB, true);
    testFaces(cB, cA, false);
    if (best.sep > 0) return [];
    // Reference face / incident face.
    var refC, incC, nRef;
    if (best.refIsA) {
      refC = cA; incC = cB;
      var nA = faceNormal(cA, best.refFace);
      nRef = nA;
    } else {
      refC = cB; incC = cA;
      var nB = faceNormal(cB, best.refFace);
      nRef = nB;
    }
    // Incident face: most anti-parallel to nRef.
    var incFace = -1, minDot = Infinity;
    for (var k = 0; k < 4; k++) {
      var nn = faceNormal(incC, k);
      var d = nn[0] * nRef[0] + nn[1] * nRef[1];
      if (d < minDot) { minDot = d; incFace = k; }
    }
    var r1 = refC[best.refFace], r2 = refC[(best.refFace + 1) % 4];
    var i1 = incC[incFace], i2 = incC[(incFace + 1) % 4];
    var tx = r2[0] - r1[0], ty = r2[1] - r1[1];
    var tl = Math.sqrt(tx * tx + ty * ty) || 1; tx /= tl; ty /= tl;
    var seg = clipSegment(i1, i2, -tx, -ty, -(r1[0] * tx + r1[1] * ty));
    seg = clipSegment(seg[0], seg[1], tx, ty, r2[0] * tx + r2[1] * ty);
    var out = [];
    var refOff = r1[0] * nRef[0] + r1[1] * nRef[1];
    for (var m = 0; m < seg.length; m++) {
      var sep = seg[m][0] * nRef[0] + seg[m][1] * nRef[1] - refOff;
      if (sep <= 0.5) {
        // Solver normal points from A to B.
        var nx = best.refIsA ? nRef[0] : -nRef[0];
        var ny = best.refIsA ? nRef[1] : -nRef[1];
        out.push({ px: seg[m][0], py: seg[m][1], nx: nx, ny: ny, pen: -sep });
      }
    }
    return out;
  }
  function collideCircleSeg(c, s) {
    var dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    var len2 = dx * dx + dy * dy || 1;
    var t = clamp(((c.x - s.x1) * dx + (c.y - s.y1) * dy) / len2, 0, 1);
    var qx = s.x1 + dx * t, qy = s.y1 + dy * t;
    var nx = c.x - qx, ny = c.y - qy;
    var d = Math.sqrt(nx * nx + ny * ny);
    if (d >= c.r) return null;
    if (d < 1e-6) { nx = -dy / Math.sqrt(len2); ny = dx / Math.sqrt(len2); d = 1; }
    else { nx /= d; ny /= d; }
    return { px: qx, py: qy, nx: nx, ny: ny, pen: c.r - d };
  }
  function collideCircleBox(c, b, f) {
    var corners = fixtureCorners(b, f);
    var cx = (corners[0][0] + corners[2][0]) / 2, cy = (corners[0][1] + corners[2][1]) / 2;
    var best = { pen: Infinity, nx: 0, ny: 0 };
    for (var i = 0; i < 2; i++) {
      var n = faceNormal(corners, i); // faces 0,1 = the two DISTINCT axes
      var pr = project(corners, n[0], n[1]);
      var cc = c.x * n[0] + c.y * n[1];
      var ov = Math.min(pr[1], cc + c.r) - Math.max(pr[0], cc - c.r);
      if (ov < 0) return null;
      if (ov < best.pen) {
        var sgn = (cc - (pr[0] + pr[1]) / 2) >= 0 ? 1 : -1;
        best = { pen: ov, nx: n[0] * sgn, ny: n[1] * sgn };
      }
    }
    // Axis from box center to circle center.
    var ax = c.x - cx, ay = c.y - cy, al = Math.sqrt(ax * ax + ay * ay);
    if (al > 1e-6) {
      ax /= al; ay /= al;
      var pr2 = project(corners, ax, ay);
      var cc2 = c.x * ax + c.y * ay;
      var ov2 = Math.min(pr2[1], cc2 + c.r) - Math.max(pr2[0], cc2 - c.r);
      if (ov2 < 0) return null;
      if (ov2 < best.pen) best = { pen: ov2, nx: ax, ny: ay };
    }
    // Contact point: circle surface toward the box, pulled halfway into overlap.
    var px = c.x - best.nx * (c.r - best.pen / 2);
    var py = c.y - best.ny * (c.r - best.pen / 2);
    return { px: px, py: py, nx: best.nx, ny: best.ny, pen: best.pen };
  }
  function collideCircleCircle(a, b) {
    var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy);
    var rr = a.r + b.r;
    if (d >= rr) return null;
    if (d < 1e-6) { dx = 1; dy = 0; d = 1; }
    return { px: a.x + dx / d * a.r, py: a.y + dy / d * a.r,
      nx: dx / d, ny: dy / d, pen: rr - d };
  }

  // ---------------- solver ----------------
  function velAtPoint(b, px, py) {
    if (b.type === 'static') return [0, 0];
    if (b.type === 'pinned') {
      var rx = px - b.anchorX, ry = py - b.anchorY;
      return [-b.omega * ry, b.omega * rx];
    }
    var rx2 = px - b.x, ry2 = py - b.y;
    return [b.vx - b.omega * ry2, b.vy + b.omega * rx2];
  }
  function refPoint(b, px, py) {
    if (b.type === 'pinned') return [b.anchorX, b.anchorY];
    return [b.x, b.y];
  }
  function applyImpulse(b, jx, jy, px, py) {
    if (b.type === 'static') return;
    if (b.type === 'pinned') {
      var rx = px - b.anchorX, ry = py - b.anchorY;
      b.omega += b.invInertia * (rx * jy - ry * jx);
      return;
    }
    b.vx += b.invMass * jx; b.vy += b.invMass * jy;
    var rx2 = px - b.x, ry2 = py - b.y;
    b.omega += b.invInertia * (rx2 * jy - ry2 * jx);
  }
  function solveContacts(contacts, dt) {
    var SLOP = 0.01, BETA = 0.2, REST_VEL = 100;
    for (var i = 0; i < contacts.length; i++) {
      var c = contacts[i];
      var va = velAtPoint(c.a, c.px, c.py), vb = velAtPoint(c.b, c.px, c.py);
      var vn0 = (vb[0] - va[0]) * c.nx + (vb[1] - va[1]) * c.ny;
      c.restBias = vn0 < -REST_VEL ? -c.rest * vn0 : 0;
      c.jn = 0; c.jt = 0;
    }
    for (var it = 0; it < 20; it++) {
      for (var k = 0; k < contacts.length; k++) {
        var c2 = contacts[k];
        var va2 = velAtPoint(c2.a, c2.px, c2.py), vb2 = velAtPoint(c2.b, c2.px, c2.py);
        var rvx = vb2[0] - va2[0], rvy = vb2[1] - va2[1];
        var ra = refPoint(c2.a, c2.px, c2.py), rb = refPoint(c2.b, c2.px, c2.py);
        var rax = c2.px - ra[0], ray = c2.py - ra[1];
        var rbx = c2.px - rb[0], rby = c2.py - rb[1];
        var cnx = rax * c2.ny - ray * c2.nx, cnbx = rbx * c2.ny - rby * c2.nx;
        var kn = c2.a.invMass + c2.b.invMass + cnx * cnx * c2.a.invInertia + cnbx * cnbx * c2.b.invInertia;
        if (kn <= 0) continue;
        var vn = rvx * c2.nx + rvy * c2.ny;
        var bias = Math.min(Math.max(BETA / dt * Math.max(0, c2.pen - SLOP), c2.restBias), 300);
        var dl = (bias - vn) / kn;
        var oldJn = c2.jn;
        c2.jn = Math.max(0, oldJn + dl);
        dl = c2.jn - oldJn;
        applyImpulse(c2.b, c2.nx * dl, c2.ny * dl, c2.px, c2.py);
        applyImpulse(c2.a, -c2.nx * dl, -c2.ny * dl, c2.px, c2.py);
        // Friction.
        var tx = -c2.ny, ty = c2.nx;
        va2 = velAtPoint(c2.a, c2.px, c2.py); vb2 = velAtPoint(c2.b, c2.px, c2.py);
        rvx = vb2[0] - va2[0]; rvy = vb2[1] - va2[1];
        var ctx = rax * ty - ray * tx, cty = rbx * ty - rby * tx;
        var kt = c2.a.invMass + c2.b.invMass + ctx * ctx * c2.a.invInertia + cty * cty * c2.b.invInertia;
        if (kt <= 0) continue;
        var vt = rvx * tx + rvy * ty;
        var dlt = -vt / kt;
        var maxF = c2.fric * c2.jn;
        var oldJt = c2.jt;
        c2.jt = clamp(oldJt + dlt, -maxF, maxF);
        dlt = c2.jt - oldJt;
        applyImpulse(c2.b, tx * dlt, ty * dlt, c2.px, c2.py);
        applyImpulse(c2.a, -tx * dlt, -ty * dlt, c2.px, c2.py);
      }
    }
  }

  // ---------------- machine ----------------
  var WORLD_W = 1400, WORLD_H = 2000;
  var DOM_COLORS = ['#f2c200', '#e23b2e', '#f07f13', '#2b6cb0', '#38a169', '#ed64a6', '#805ad5'];
  function rail(x1, y1, x2, y2) { return staticSeg('rail', x1, y1, x2, y2, CAT.BALL, 0.5, 0.1); }

  function buildWorld() {
    var bodies = [], statics = [], segs = [];
    function addB(b) { bodies.push(b); return b; }
    function addS(s) { statics.push(s); return s; }
    function addSeg(s) { segs.push(s); return s; }

    // Ball 1: red glass, starts on the ramp held by the hand block.
    // Approach ends so ball 1 strikes domino 0 MID-HEIGHT (r ~43 px from
    // its base, center y ~477): a pivoted domino's effective mass is
    // I_pivot/r^2, which equals the ball's mass at r ~43, so ball 1 stops
    // dead instead of ramming the rotating face (high strike) or bouncing
    // back off the shelf (low strike). It then sits clear of domino 0's
    // fall while the wave runs. A catch wall at x 760..780 stops it if
    // the retention is slightly negative.
    var ball1 = addB(circleBody('ball1', 290.7, 307.8, 14, 1, CAT.BALL, ALL, 0.5, 0.1));
    // Ball 2: ivory, waits against the gate arm.
    var ball2 = addB(circleBody('ball2', 1227, 586.4, 14, 1, CAT.BALL, ALL, 0.5, 0.1));
    // Ball 1 path: ramp + approach slope.
    addSeg(rail(170, 280, 560, 418));
    addSeg(rail(560, 418, 800, 490));
    // Hand block: removed at t = 0.6 s (a release, not a velocity).
    var handBlock = addSeg(staticSeg('hand', 299, 293, 311, 325, CAT.BALL, 0.5, 0));
    // Domino shelf (static box, top y = 520), extended left to hold the
    // catch wall and ball 1's rest spot.
    addS(staticBox('shelf', 1030, 535, 540, 30, 0, CAT.BALL | CAT.DOMINO));
    // Catch wall: ball 1 only (dominoes never touch it).
    addS(staticBox('catchWall', 770, 511, 20, 18, 0, CAT.BALL));
    // Domino row: 9 dominoes, centers 828 + i*50, base y = 520.
    // Real-domino proportions (thickness 12, spacing 50): the shingled stack
    // settles at arccos(t/s) = arccos(12/50) = 76 deg from vertical, matching
    // a real toppled row, instead of the chunky 68 deg of 16/42.
    var dominoes = [];
    for (var i = 0; i < 9; i++) {
      var d = addB(polyBody('dom' + i, 828 + i * 50, 487, 0,
        [fixture(0, 0, 12, 66, 0, CAT.DOMINO, CAT.STATIC | CAT.BALL | CAT.DOMINO | CAT.CRANK, 0.15, 0, 'dom' + i)], 1));
      d.domIndex = i;
      dominoes.push(d);
    }
    // Bell crank: pivot (1265, 510). Arm A (trigger, left, y 498..510) is
    // struck by the falling last domino and then pressed down by the lying
    // domino's weight (lying top y = 508 overlaps arm A by 2 px), holding
    // the gate open; it clears ball 1's path (ball top y = 492) by 6 px.
    // Arm B (gate, down) blocks ball 2's track. The crank's center of mass
    // sits slightly right of the pivot, so gravity supplies a closing
    // torque (~212k) that ball 2's push alone (~140k) cannot overcome:
    // the gate stays shut until domino 8 presses it, then opens fully.
    // (A balanced crank let ball 2 push the gate open by itself.)
    // Note: the last two dominoes rest on arm A at ~66 deg (they hold the
    // gate open by their weight, as a real trigger lever works); the row
    // proper (dom 0-6) lies flat at ~76 deg.
    var crank = addB(pinnedBody('crank', 1265, 510, [
      fixture(-13.5, -6, 27, 12, 0, CAT.CRANK, CAT.DOMINO | CAT.BALL, 0.4, 0, 'crankA'),

    // dominoes
    w.dominoes.forEach(function (d, i) {
      poly(SIM.fixtureCorners(d, d.fixtures[0]));
      ctx.fillStyle = RAINBOW[i % RAINBOW.length]; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1; ctx.stroke();
    });
    // balls (rotation mark turns with the body's angle: rolling, not sliding)
    function ball(b, fill, dot) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x + Math.cos(b.angle) * b.r * 0.55, b.y + Math.sin(b.angle) * b.r * 0.55, b.r * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = dot; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
    }
    ball(w.ball1, '#d9281c', '#7d130a');
    ball(w.ball2, '#f5ead2', '#c9b48a');
    // crank (in front: the gate visibly blocks ball 2)
    w.crank.fixtures.forEach(function (f) {
      poly(SIM.fixtureCorners(w.crank, f)); ctx.fillStyle = '#c9a227'; ctx.fill();
    });
    ctx.beginPath(); ctx.arc(1265, 510, 8, 0, Math.PI * 2); ctx.fillStyle = '#2a1a0c'; ctx.fill();
    // hand: holds ball 1, then leaves frame after release
    if (w.t < 1.5) {
      var ha = w.t < 0.6 ? 1 : Math.max(0, 1 - (w.t - 0.6) / 0.9);
      var hy = w.t < 0.6 ? 0 : -(w.t - 0.6) * 250;
      if (ha > 0) {
        ctx.save(); ctx.globalAlpha = ha; ctx.translate(0, hy);
        ctx.fillStyle = '#e8b48c';
        ctx.beginPath(); ctx.ellipse(262, 268, 38, 26, -0.35, 0, Math.PI * 2); ctx.fill();
        for (var fi = 0; fi < 4; fi++) {
          ctx.beginPath(); ctx.ellipse(288 + fi * 3, 282 + fi * 9, 10, 20, 0.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
    }
    ctx.restore();
  }

  // ---- camera + loop ----
  function followTarget() {
    if (w.gateOpenedAt || w.ball2.x > 1260) return w.ball2;
    return w.ball1;
  }
  function frame(now) {
    if (freezeT === null) {
      // step sim in real time (DT = 1/480, up to 24 steps/frame catch-up)
      var target = w.t + 1 / 60;
      var n = 0;
      while (w.t < target && n < 24 && !w.done) { SIM.stepWorld(w); n++; }
      audioStep();
      var b = followTarget();
      var look = 0.25;
      camTX = b.x + b.vx * look; camTY = b.y + b.vy * look;
      var k = 1 - Math.exp(-5 / 60);
      camX += (camTX - camX) * k; camY += (camTY - camY) * k;
      var viewW = vw / scale, viewH = vh / scale;
      camX = viewW >= 1400 ? 700 : Math.max(viewW / 2, Math.min(1400 - viewW / 2, camX));
      camY = viewH >= 2000 ? 1000 : Math.max(viewH / 2, Math.min(2000 - viewH / 2, camY));
      draw();
      requestAnimationFrame(frame);
    }
  }
  if (freezeT !== null) {
    while (w.t < freezeT && !w.done) SIM.stepWorld(w);
    var fb = (w.ball2.x > 1260 || w.gateOpenedAt) ? w.ball2 : w.ball1;
    camX = fb.x; camY = fb.y;
    var viewW = vw / scale, viewH = vh / scale;
    camX = viewW >= 1400 ? 700 : Math.max(viewW / 2, Math.min(1400 - viewW / 2, camX));
    camY = viewH >= 2000 ? 1000 : Math.max(viewH / 2, Math.min(2000 - viewH / 2, camY));
    draw();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
