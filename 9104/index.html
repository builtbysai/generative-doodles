    if (Math.abs(dx) < 25 && Math.abs(dy) < 25 && ds < 0.04) return; // dead zone

    st.x += dx * kc; st.y += dy * kc;
    var lam = tgt.scale < st.scale ? 5.0 : 1.1; // zoom out fast, drift back in slow
    var ks = 1 - Math.exp(-lam * dt);
    st.scale += (tgt.scale - st.scale) * ks;
    // Endless world: never clamp y. Keep only the center x in the field.
    if (st.x < 0) st.x = 0;
    if (st.x > 1400) st.x = 1400;
  }
  return { createState: createState, targetFor: targetFor, stepCam: stepCam };
})();

</script>
<script>
(function () {
  var SIM = window.SIM9104;
  var MARKER = '9104-NEVERLAND-V8';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var params = new URLSearchParams(location.search);
  var freezeT = params.has('t') ? parseFloat(params.get('t')) : null;
  var seedParam = params.has('seed') ? parseInt(params.get('seed'), 10) : null;
  var nextSeed = function () { return (Math.random() * 0x7fffffff) | 0; };
  var firstSeed = (seedParam !== null && !isNaN(seedParam)) ? seedParam : (freezeT !== null ? 1 : nextSeed());
  var w = SIM.buildEndless(firstSeed);
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var vw = 0, vh = 0, scale = 1, baseScale = 1;
  var camX = w.ball.x, camY = w.ball.y;
  var camSt = CAM9104.createState(w.ball.x, w.ball.y);
  var muted = false, actx = null, lastSoundAt = {};
  function resize() {
    vw = window.innerWidth; vh = window.innerHeight;
    canvas.width = Math.round(vw * DPR); canvas.height = Math.round(vh * DPR);
    baseScale = vh / 1300;
    if (!camSt.scale) camSt.scale = baseScale;
    scale = camSt.scale;
  }
  window.addEventListener('resize', resize); resize();

  // ---- audio: knocks/clicks from real collision impulses ----
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function knock(jn, woody) {
    if (!actx || muted) return;
    var t = actx.currentTime;
    var vol = Math.min(0.4, jn / 3000);
    if (vol < 0.02) return;
    var dur = woody ? 0.09 : 0.05;
    var buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    var src = actx.createBufferSource(); src.buffer = buf;
    var f = actx.createBiquadFilter();
    f.type = woody ? 'lowpass' : 'bandpass';
    f.frequency.value = woody ? 900 : 3200;
    var g = actx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(actx.destination);
    src.start(t);
  }
  function audioStep() {
    if (!actx || muted || !w.lastContacts) return;
    var now = performance.now(), n = 0;
    for (var i = 0; i < w.lastContacts.length && n < 8; i++) {
      var c = w.lastContacts[i];
      var jn = Math.abs(c.jn || 0);
      if (jn < 120) continue;
      var key = (c.a.id || 's') + '|' + (c.b.id || 's');
      if (now - (lastSoundAt[key] || 0) < 40) continue;
      lastSoundAt[key] = now;
      var woody = /dom|rail|shelf|plank/.test(key);
      knock(jn, woody); n++;
    }
  }

  // ---- pointer: drag to nudge (physical spring force in the sim) ----
  function toWorld(e) {
    var r = canvas.getBoundingClientRect();
    var sx = (e.clientX - r.left) * DPR, sy = (e.clientY - r.top) * DPR;
    var viewW = vw / scale, viewH = vh / scale;
    return { x: camX - viewW / 2 + sx / DPR / scale, y: camY - viewH / 2 + sy / DPR / scale };
  }
  var dragging = false;
  canvas.addEventListener('pointerdown', function (e) { ensureAudio(); dragging = true; var p = toWorld(e); w.nudge = p; });
  window.addEventListener('pointermove', function (e) { if (dragging) w.nudge = toWorld(e); });
  window.addEventListener('pointerup', function () { dragging = false; w.nudge = null; });

  // ---- mute toggle (text-free SVG) ----
  var muteBtn = document.getElementById('mute');
  function muteIcon() {
    var waves = muted ? '' : '<path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14" stroke="#f5ead2" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
    var slash = muted ? '<line x1="4" y1="4" x2="22" y2="20" stroke="#f5ead2" stroke-width="2" stroke-linecap="round"/>' : '';
    muteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/>' + waves + slash + '</svg>';
  }
  muteBtn.addEventListener('click', function () { ensureAudio(); muted = !muted; muteIcon(); });
  muteIcon();

  // ---- drawing ----
  var RAINBOW = ['#e5484d', '#f76b15', '#ffb224', '#eab308', '#84cc16', '#22a35c', '#00b8a0', '#0090c0', '#0077e6', '#6e56cf', '#d6409f', '#ff5c7a'];
  function shade(hex, amt) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    var t = amt > 0 ? 255 : 0, a = Math.abs(amt);
    return 'rgb(' + Math.round(r + (t - r) * a) + ',' + Math.round(g + (t - g) * a) + ',' + Math.round(b + (t - b) * a) + ')';
  }
  function poly(corners) {
    ctx.beginPath();
    ctx.moveTo(corners[0][0], corners[0][1]);
    for (var i = 1; i < corners.length; i++) ctx.lineTo(corners[i][0], corners[i][1]);
    ctx.closePath();
  }
  function draw() {
    var viewW = vw / scale, viewH = vh / scale;
    var left = camX - viewW / 2, top = camY - viewH / 2;
    ctx.setTransform(DPR * scale, 0, 0, DPR * scale, 0, 0);
    ctx.clearRect(0, 0, viewW, viewH);
    ctx.save();
    ctx.translate(-left, -top);
    // backdrop: warm light above, deep below, tied to the view so the
    // endless descent never changes the room's feel
    var bg = ctx.createLinearGradient(0, top, 0, top + viewH);
    bg.addColorStop(0, '#e9cf9f'); bg.addColorStop(0.5, '#cda878'); bg.addColorStop(1, '#5d3d24');
    ctx.fillStyle = bg; ctx.fillRect(left, top, viewW, viewH);
    // quiet wood grain, in world coords so it scrolls with the machine
    ctx.strokeStyle = 'rgba(90,60,25,0.12)'; ctx.lineWidth = 1.5;
    var gy0 = Math.floor(top / 200) * 200;
    for (var gy = gy0; gy < top + viewH + 200; gy += 200) {
      ctx.beginPath(); ctx.moveTo(left, gy);
      for (var gx = Math.floor(left / 100) * 100; gx <= left + viewW + 100; gx += 100)
        ctx.lineTo(gx, gy + Math.sin(gx / 260) * 4);
      ctx.stroke();
    }
    // warm glow behind the ball
    var glow = ctx.createRadialGradient(w.ball.x, w.ball.y, 50, w.ball.x, w.ball.y, 700);
    glow.addColorStop(0, 'rgba(255,200,120,0.12)'); glow.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = glow; ctx.fillRect(left, top, viewW, viewH);
    // statics: shelf, housing, posts (ids carry the s<idx>- prefix)
    w.statics.forEach(function (sb) {
      sb.fixtures.forEach(function (f) {
        poly(SIM.fixtureCorners(sb, f));
        if (sb.id.indexOf('shelf') >= 0) ctx.fillStyle = '#c4a06a';
        else if (sb.id.indexOf('hous') >= 0) ctx.fillStyle = '#33415a';
        else ctx.fillStyle = '#3a2a1a';
        ctx.fill();
      });
    });
    // rails, guides, walls, scoops: the whole endless machine
    ctx.strokeStyle = '#6b4a2f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    w.segs.forEach(function (sg) {
      ctx.beginPath(); ctx.moveTo(sg.x1, sg.y1); ctx.lineTo(sg.x2, sg.y2); ctx.stroke();
    });
    // pinned mechanisms, drawn generically: rotors, seesaws, pendulums, trippers
    w.bodies.forEach(function (b) {
      if (b.type !== 'pinned') return;
      var isRotor = b.id.indexOf('rotor') >= 0, isSeesaw = b.id.indexOf('seesaw') >= 0;
      b.fixtures.forEach(function (f) {
        poly(SIM.fixtureCorners(b, f));
        if (isRotor) {
          var rg = ctx.createLinearGradient(b.anchorX, b.anchorY - 115, b.anchorX, b.anchorY + 115);
          rg.addColorStop(0, shade('#2f7de1', 0.35)); rg.addColorStop(0.5, '#2f7de1'); rg.addColorStop(1, shade('#2f7de1', -0.25));
          ctx.fillStyle = rg;
        } else if (isSeesaw) ctx.fillStyle = '#7a5230';
        else if (f.name && f.name.indexOf('bob') >= 0) ctx.fillStyle = '#c9a227';
        else if (f.name && f.name.indexOf('ham') >= 0) ctx.fillStyle = '#c9a227';
        else if (f.name && f.name.indexOf('plate') >= 0) ctx.fillStyle = '#8a6a42';
        else ctx.fillStyle = '#6b4a2f';
        ctx.fill();
      });
      // bright paddle-tip caps so the spin speed reads at a glance
      if (isRotor && b.paddleDegs) {
        var ca = Math.cos(b.angle), sa = Math.sin(b.angle);
        b.paddleDegs.forEach(function (deg) {
          var r = deg * Math.PI / 180, lx = Math.cos(r), ly = Math.sin(r);
          var tx = b.anchorX + (b.spinR - 17) * (lx * ca - ly * sa);
          var ty = b.anchorY + (b.spinR - 17) * (lx * sa + ly * ca);
          ctx.beginPath(); ctx.arc(tx, ty, 6, 0, Math.PI * 2); ctx.fillStyle = '#ffe9a8'; ctx.fill();
        });
      }
      ctx.beginPath(); ctx.arc(b.anchorX, b.anchorY, 7, 0, Math.PI * 2); ctx.fillStyle = '#2a1a0c'; ctx.fill();
    });
    // dominoes: lit face, soft shadow, quiet pip highlight
    w.dominoes.forEach(function (d, i) {
      var cs = SIM.fixtureCorners(d, d.fixtures[0]);
      var base = d.color || RAINBOW[i % RAINBOW.length];
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
      poly(cs);
      var dg = ctx.createLinearGradient(cs[0][0], cs[0][1], cs[2][0], cs[2][1]);
      dg.addColorStop(0, shade(base, 0.35)); dg.addColorStop(1, base);
      ctx.fillStyle = dg; ctx.fill(); ctx.restore();
      poly(cs); ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath(); ctx.arc(d.x, d.y, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.30)'; ctx.fill();
    });
    // the one ball: radial-lit, rotation mark turns with rolling
    (function () {
      var b = w.ball, fill = b.fill || '#d9281c', dot = b.dot || '#7d130a';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      var rg = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.15, b.x, b.y, b.r);
      rg.addColorStop(0, shade(fill, 0.55)); rg.addColorStop(0.6, fill); rg.addColorStop(1, shade(fill, -0.25));
      ctx.fillStyle = rg; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x + Math.cos(b.angle) * b.r * 0.55, b.y + Math.sin(b.angle) * b.r * 0.55, b.r * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = dot; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
    })();
    // hand: holds the ball, then leaves frame after release
    if (w.t < 1.5) {
      var ha = w.t < 0.6 ? 1 : Math.max(0, 1 - (w.t - 0.6) / 0.9);
      var hy = w.t < 0.6 ? 0 : -(w.t - 0.6) * 250;
      if (ha > 0) {
        ctx.save(); ctx.globalAlpha = ha; ctx.translate(0, hy);
        ctx.fillStyle = '#e8b48c';
        var hb = w.ball;
        ctx.beginPath(); ctx.ellipse(hb.x - 28.7, hb.y - 39.8, 38, 26, -0.35, 0, Math.PI * 2); ctx.fill();
        for (var fi = 0; fi < 4; fi++) {
          ctx.beginPath(); ctx.ellipse(hb.x - 2.7 + fi * 3, hb.y - 25.8 + fi * 9, 10, 20, 0.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
    }
    ctx.restore();
    // quiet vignette: keeps the eye on the machine, never fights the pieces
    var vcx = viewW / 2, vcy = viewH / 2;
    var vg = ctx.createRadialGradient(vcx, vcy, Math.min(viewW, viewH) * 0.35, vcx, vcy, Math.max(viewW, viewH) * 0.75);
    vg.addColorStop(0, 'rgba(20,10,4,0)'); vg.addColorStop(1, 'rgba(20,10,4,0.20)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, viewW, viewH);
  }

  // ---- camera + endless loop: one continuous run, no finish, no reset ----
  function frame() {
    if (freezeT === null) {
      var target = w.t + 1 / 60;
      var n = 0;
      while (w.t < target && n < 24) { SIM.stepWorld(w); n++; }
      audioStep();
      var tgt = CAM9104.targetFor(w, vw, vh, baseScale, camSt, 1 / 60);
      if (tgt) CAM9104.stepCam(camSt, tgt, 1 / 60);
      camX = camSt.x; camY = camSt.y; scale = camSt.scale;
      var viewW = vw / scale;
      camX = viewW >= 1400 ? 700 : Math.max(viewW / 2, Math.min(1400 - viewW / 2, camX));
      camSt.x = camX; camSt.y = camY;
      draw();
      requestAnimationFrame(frame);
    }
  }
  if (freezeT !== null) {
    while (w.t < freezeT) SIM.stepWorld(w);
    var fst = CAM9104.createState(w.ball.x, w.ball.y); fst.scale = baseScale;
    for (var fi = 0; fi < 400; fi++) {
      var ft = CAM9104.targetFor(w, vw, vh, baseScale, fst, 1 / 60);
      if (ft) CAM9104.stepCam(fst, ft, 1 / 60);
    }
    camX = fst.x; camY = fst.y; scale = fst.scale;
    var viewW2 = vw / scale;
    camX = viewW2 >= 1400 ? 700 : Math.max(viewW2 / 2, Math.min(1400 - viewW2 / 2, camX));
    draw();
  } else {
    requestAnimationFrame(frame);
  }
})();

</script>
