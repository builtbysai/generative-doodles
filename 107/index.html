<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№107 · Tessellate</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E2A24; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(216,203,178,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to add a point</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.107 Tessellate: seeded PRNG "Tessellate". Exactly 40 seed points wander on
// integer-cycle Lissajous paths (seamless 14s loop); CPU voronoi by half-plane
// clipping. Cells above the 80th percentile of area fill rust; stroke 1px bone.
const WATER='#0E2A24', BONE='#D8CBB2', RUST='#8A4A2E';
const LOOP=14, N=40;
const rnd=mulberry(hashStr('Tessellate'));
const SEEDS=[];
for(let i=0;i<N;i++){
  SEEDS.push({
    bx:0.07+rnd()*0.86, by:0.07+rnd()*0.86,
    ax:0.02+rnd()*0.035, ay:0.02+rnd()*0.035,
    fx:1+Math.floor(rnd()*3), fy:1+Math.floor(rnd()*3),
    px:rnd()*Math.PI*2, py:rnd()*Math.PI*2
  });
}
if(SEEDS.length!==40) console.assert(false,'seeds',SEEDS.length);
let dragPt=null;

function clipHalf(poly, mx, my, nx, ny){
  // keep the side of the bisector where (p - m) . n <= 0
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    const da=(a[0]-mx)*nx+(a[1]-my)*ny, db=(b[0]-mx)*nx+(b[1]-my)*ny;
    if(da<=0) out.push(a);
    if((da<0&&db>0)||(da>0&&db<0)){
      const t=da/(da-db);
      out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]);
    }
  }
  return out;
}
function cellArea(poly){ let a=0; for(let i=0;i<poly.length;i++){ const p=poly[i], q=poly[(i+1)%poly.length]; a+=p[0]*q[1]-q[0]*p[1]; } return Math.abs(a/2); }

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle=WATER; ctx.fillRect(0,0,w,h);
  const ph=((nowMs/1000)%LOOP)/LOOP;
  const pts=SEEDS.map(s=>[
    (s.bx + s.ax*Math.sin(ph*Math.PI*2*s.fx+s.px))*w,
    (s.by + s.ay*Math.sin(ph*Math.PI*2*s.fy+s.py))*h
  ]);
  if(dragPt) pts.push([dragPt[0], dragPt[1]]);
  const n=pts.length;
  const polys=[], areas=[];
  for(let i=0;i<n;i++){
    let poly=[[0,0],[w,0],[w,h],[0,h]];
    for(let j=0;j<n && poly.length;j++){
      if(j===i) continue;
      const mx=(pts[i][0]+pts[j][0])/2, my=(pts[i][1]+pts[j][1])/2;
      poly=clipHalf(poly, mx, my, pts[j][0]-pts[i][0], pts[j][1]-pts[i][1]);
    }
    polys.push(poly); areas.push(poly.length?cellArea(poly):0);
  }
  const sorted=areas.slice().sort((a,b)=>a-b);
  const thresh=sorted[Math.floor(0.8*n)];
  ctx.lineWidth=1;
  for(let i=0;i<n;i++){
    const poly=polys[i];
    if(!poly.length) continue;
    ctx.beginPath();
    poly.forEach((p,k)=>{ if(k===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); });
    ctx.closePath();
    if(areas[i]>thresh){ ctx.fillStyle=RUST; ctx.fill(); }
    ctx.strokeStyle=BONE; ctx.stroke();
  }
  return {};
}

function ptr(e){ const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{left:0,top:0}; return [e.clientX-r.left, e.clientY-r.top]; }
canvas.addEventListener('pointerdown',e=>{ dragPt=ptr(e); });
canvas.addEventListener('pointermove',e=>{ if(dragPt) dragPt=ptr(e); });
function endP(){ dragPt=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(4000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
