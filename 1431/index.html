<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closed Mon–Sun</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a241e; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1431000);
  function r4(x) { return Math.round(x * 10000) / 10000; }

  // Viewport sizing (Visual Viewport API first).
  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    canvas.style.width = Math.round(W) + 'px';
    canvas.style.height = Math.round(H) + 'px';
    var minDim = 1e9;
    try {
      if (window.screen && window.screen.width && window.screen.height) {
        minDim = Math.min(window.screen.width, window.screen.height);
      }
    } catch (e) { /* ignore */ }
    phone = (minDim < 700) || (H > W * 1.15);
  }
  size();
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', size);
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', size);
    }
  }

  // ---- Geometry (recomputed per frame from W/H) ----
  function geom() {
    var dw = phone ? Math.min(W * 0.86, 560) : Math.min(W * 0.52, 620);
    var dh = Math.min(H * 0.82, dw * 1.55);
    var dx = (W - dw) / 2;
    var dy = Math.max(8, (H - dh - 90) / 2);
    var inset = dw * 0.07;
    var gx = dx + inset, gw = dw - inset * 2;
    var gy = dy + dh * 0.05, gh = dh * 0.44;
    var sx = dx + dw * 0.16, sw = dw * 0.68;
    var sy = dy + dh * 0.545, sh = dh * 0.115;
    return { dw: dw, dh: dh, dx: dx, dy: dy, gx: gx, gw: gw, gy: gy, gh: gh,
             sx: sx, sw: sw, sy: sy, sh: sh };
  }

  // ---- Seeded static dressing for the prop room ----
  var speckles = [];
  for (var i = 0; i < 90; i++) {
    speckles.push({ x: rnd(), y: rnd(), r: 1 + rnd() * 1.6 });
  }
  var bottleGlints = [];
  for (var j = 0; j < 4; j++) bottleGlints.push(rnd() * Math.PI * 2);
  var costumePhases = [0, 2.1, 4.2];
  var shadowPhases = [];
  for (var k = 0; k < 5; k++) shadowPhases.push(rnd() * Math.PI * 2);

  // ---- Interaction state: closed-form over recorded events ----
  var wipes = [];   // {x, y, t} in glass-relative coords (0..1)
  var glows = [];   // {t} door-drag events
  var dragging = null; // 'glass' | 'door'

  function canvasPos(e) {
    var r = canvas.getBoundingClientRect();
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0].clientY);
    return { x: cx - r.left, y: cy - r.top };
  }
  function hitTest(p) {
    var g = geom();
    if (p.x >= g.gx && p.x <= g.gx + g.gw && p.y >= g.gy && p.y <= g.gy + g.gh) return 'glass';
    if (p.x >= g.dx && p.x <= g.dx + g.dw && p.y >= g.dy && p.y <= g.dy + g.dh) return 'door';
    return null;
  }
  function onDown(e) {
    var p = canvasPos(e);
    var h = hitTest(p);
    if (!h) return;
    dragging = h;
    if (h === 'glass') {
      var g = geom();
      wipes.push({ x: (p.x - g.gx) / g.gw, y: (p.y - g.gy) / g.gh, t: nowT });
    } else {
      glows.push({ t: nowT });
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = canvasPos(e);
    if (dragging === 'glass') {
      var g = geom();
      wipes.push({ x: (p.x - g.gx) / g.gw, y: (p.y - g.gy) / g.gh, t: nowT });
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() { dragging = null; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---- Helpers ----
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }
  function dot(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function ellipse(x, y, rx, ry, color) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function fogLevel(cx, cy, t) {
    // 1 = fully fogged; wipes clear cells, fog regrows with tau 8 s.
    var level = 1;
    for (var i = 0; i < wipes.length; i++) {
      var w = wipes[i];
      var ddx = cx - w.x, ddy = cy - w.y;
      var d = Math.sqrt(ddx * ddx + ddy * ddy);
      if (d < 0.14) {
        var age = t - w.t;
        var cleared = 1 - Math.min(1, age / 8);
        var strength = 1 - d / 0.14;
        level = Math.min(level, 1 - cleared * strength);
      }
    }
    return level;
  }

  // ---- Prop room (drawn inside the glass clip) ----
  function drawProps(g, t) {
    var gx = g.gx, gy = g.gy, gw = g.gw, gh = g.gh;
    ctx.save();
    ctx.beginPath();
    ctx.rect(gx, gy, gw, gh);
    ctx.clip();
    // Room wall and floor.
    rect(gx, gy, gw, gh, '#3a332a');
    rect(gx, gy + gh * 0.72, gw, gh * 0.28, '#2e2820');
    // Seeded dust on the wall.
    for (var i = 0; i < speckles.length; i++) {
      var s = speckles[i];
      rect(gx + s.x * gw, gy + s.y * gh * 0.7, s.r, s.r, 'rgba(232,226,212,' + r4(0.12) + ')');
    }
    // Rail across the back with three costumes, swaying almost imperceptibly.
    var railY = gy + gh * 0.16;
    rect(gx, railY, gw, Math.max(2, gh * 0.012), '#6a5138');
    var costumeColors = ['#c89a3e', '#e6ddc8', '#8a2a24'];
    for (var c = 0; c < 3; c++) {
      var ccx = gx + gw * (0.2 + c * 0.3);
      var sway = Math.sin(t * Math.PI * 2 / 30 + costumePhases[c]) * gw * 0.008;
      var cw = gw * 0.11, ch = gh * 0.30;
      rect(ccx + sway - cw / 2, railY + gh * 0.02, cw, ch, costumeColors[c]);
      rect(ccx + sway - cw * 0.28, railY + gh * 0.02, cw * 0.56, ch * 0.5, 'rgba(20,18,12,' + r4(0.35) + ')');
    }
    // Stack of books, left.
    var bx = gx + gw * 0.10, by = gy + gh * 0.74;
    var bookCols = ['#8a2a24', '#e8e2d4', '#6a5138'];
    for (var b = 0; b < 3; b++) {
      rect(bx - gw * 0.01, by - (b + 1) * gh * 0.045, gw * 0.16, gh * 0.04, bookCols[b]);
    }
    // Doll-record player, centre-left.
    var px = gx + gw * 0.32, py = gy + gh * 0.62;
    var pw = gw * 0.20, ph = gh * 0.16;
    rect(px, py, pw, ph, '#b8352a');
    dot(px + pw * 0.5, py + ph * 0.5, pw * 0.28, '#1a1712');
    dot(px + pw * 0.5, py + ph * 0.5, pw * 0.12, '#e8e2d4');
    rect(px + pw * 0.72, py - ph * 0.12, pw * 0.05, ph * 0.5, '#8a8f94');
    // Bird model on a stand, centre-right.
    var birdX = gx + gw * 0.66, birdY = gy + gh * 0.58;
    rect(birdX - gw * 0.01, birdY + gh * 0.10, gw * 0.02, gh * 0.14, '#6a5138');
    ellipse(birdX, birdY, gw * 0.05, gh * 0.07, '#b89a78');
    dot(birdX + gw * 0.035, birdY - gh * 0.045, gw * 0.018, '#b89a78');
    rect(birdX - gw * 0.055, birdY - gh * 0.02, gw * 0.05, gh * 0.015, '#e8e2d4');
    // Bottles, right.
    for (var bi = 0; bi < 4; bi++) {
      var botX = gx + gw * (0.80 + bi * 0.045);
      var botY = gy + gh * 0.74 - gh * 0.13;
      rect(botX, botY, gw * 0.032, gh * 0.13, '#c8d4b8');
      rect(botX + gw * 0.008, botY - gh * 0.025, gw * 0.016, gh * 0.025, '#c8d4b8');
      var glint = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 / 20 + bottleGlints[bi]);
      rect(botX + gw * 0.006, botY + gh * 0.02, gw * 0.008, gh * 0.05,
           'rgba(242,239,232,' + r4(0.25 + 0.45 * glint) + ')');
    }
    // Feather drifting slowly.
    var fx = gx + gw * (0.5 + 0.06 * Math.sin(t * Math.PI * 2 / 60));
    var fy = gy + gh * (0.30 + 0.04 * Math.sin(t * Math.PI * 2 / 30 + 1.3));
    ellipse(fx, fy, gw * 0.022, gh * 0.012, '#e8e2d4');
    ctx.restore();
  }

  // ---- Fog layer over the glass (cell grid, wipe buffer) ----
  function drawFog(g, t) {
    var cols = 24, rows = 16;
    var cw = g.gw / cols, ch = g.gh / rows;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var level = fogLevel((c + 0.5) / cols, (r + 0.5) / rows, t);
        if (level <= 0.01) continue;
        var a = r4(0.52 * level);
        rect(g.gx + c * cw, g.gy + r * ch, cw + 0.5, ch + 0.5,
             'rgba(122,138,148,' + a + ')');
      }
    }
  }

  // ---- Waiting shadows along the bottom edge ----
  function drawShadows(t) {
    var n = 5;
    for (var i = 0; i < n; i++) {
      var sx = W * (0.14 + i * 0.18);
      var shift = Math.sin(t * Math.PI * 2 / 30 + shadowPhases[i]) * 3;
      var sw = Math.min(W * 0.07, 56), sh = 62;
      var sy = H - 14 - sh;
      ellipse(sx + shift, sy + sh * 0.32, sw * 0.32, sh * 0.30, '#4a4a44');
      rect(sx + shift - sw * 0.42, sy + sh * 0.45, sw * 0.84, sh * 0.55, '#4a4a44');
    }
  }

  // ---- Main draw (t = piece time in seconds) ----
  var nowT = 0;
  function draw(t) {
    nowT = t;
    var g = geom();
    // Exterior: wall above, pavement below.
    rect(0, 0, W, H, '#2a241e');
    rect(0, H - 90, W, 90, '#8a8578');
    // Door frame and slab.
    rect(g.dx - 8, g.dy - 8, g.dw + 16, g.dh + 16, '#241a10');
    rect(g.dx, g.dy, g.dw, g.dh, '#3a2a1a');
    // Wood panels below the sign.
    rect(g.dx + g.dw * 0.10, g.dy + g.dh * 0.70, g.dw * 0.80, g.dh * 0.24, '#2e2115');
    // Glass pane + prop room + fog.
    rect(g.gx - 4, g.gy - 4, g.gw + 8, g.gh + 8, '#1a1712');
    drawProps(g, t);
    drawFog(g, t);
    // Door knob.
    dot(g.dx + g.dw * 0.88, g.dy + g.dh * 0.60, Math.max(4, g.dw * 0.018), '#c89a3e');
    // Sign glow from door drags (decays tau 2 s).
    var glow = 0;
    for (var i = 0; i < glows.length; i++) {
      var age = t - glows[i].t;
      if (age >= 0) glow = Math.max(glow, Math.exp(-age / 2));
    }
    // Brass sign at eye height, legible.
    var brass = glow > 0.01
      ? 'rgb(' + Math.round(200 + 42 * glow) + ',' + Math.round(154 + 46 * glow) + ',' + Math.round(62 + 60 * glow) + ')'
      : '#c89a3e';
    if (glow > 0.01) {
      rect(g.sx - 6, g.sy - 6, g.sw + 12, g.sh + 12,
           'rgba(242,200,121,' + r4(0.35 * glow) + ')');
    }
    rect(g.sx, g.sy, g.sw, g.sh, brass);
    ctx.fillStyle = '#241a10';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var fs = Math.max(13, Math.round(g.sw * 0.085));
    ctx.font = '700 ' + fs + 'px Georgia, serif';
    ctx.fillText('CLOSED MON–SUN', g.sx + g.sw / 2, g.sy + g.sh / 2 + 1);
    // Waiting shadows.
    drawShadows(t);
    // Pin canvas size (house rule).
    canvas.style.width = Math.round(W) + 'px';
    canvas.style.height = Math.round(H) + 'px';
  }

  // ---- Clock: frame one = draw(0) via boot flag ----
  var startTime = 0, started = false;
  draw(0);
  function loop(ts) {
    if (!started) { started = true; startTime = ts; }
    var t = ((ts - startTime) / 1000) % 60;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
