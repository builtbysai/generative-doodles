<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hombre de Alto Valor</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F5F0E6; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict B/W + protein tan, gym grey, shirt red. Flat fills only.
  var INK = '#141414', PAPER = '#F5F0E6', TAN = '#D9B98C',
      GREY = '#B9B9B9', RED = '#D93A2B';

  var PHASE0 = 0.9; // constant first-frame phase

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var seedRnd = mulberry32(562068);
  // stable per-element jitter, independent of frame count
  function jit(id, i) {
    var x = Math.sin(id * 127.1 + i * 311.7) * 43758.5453;
    return (x - Math.floor(x)) * 2 - 1;
  }

  // ---------------- state ----------------
  var cur = 0;              // 0 = caption card, 1..10 = panels
  var transT = -100;        // sim-time of last advance
  var dragDark = 0;         // panel-7 drag-down darkness, 0..1
  var dragBackT = -100;     // sim-time a failed drag-down was released
  var pDown = null;         // pointer-down record
  var simT = PHASE0;

  // ---------------- copy (verbatim from the prompt unless noted) ----------------
  var CAPTION = 'Estoicismo 🗿, fuerza 💪🏼, individualidad 🐺, trabajar 24 horas y 8 días a la semana 📈, lamer bota 👅👢';
  var PANELS = [
    null,
    'ME LLAMO PACHECO. SOY UN HOMBRE DE ALTO VALOR. VOY AL GYM TODOS LOS DÍAS.',
    'LA ATENCIÓN MASCULINA LO ES TODO. NO SOY GAY, EH!',
    'MI PADRE JAMÁS ME ABRAZÓ. LLORÉ UNA VEZ Y ME MANDÓ AL GYM.', // written for this piece, his voice (see process.md)
    'ESCAPADO DE LA MATRIX',
    'CAMARERO DE ELON MUSK Y DONALD TRUMP',
    'MORIRÉ EN UNA PUTA CUNETA! COMO UN HOMBRE!',
    'EL DOLOR ES TEMPORAL. EL VALOR ES ETERNO.', // written for this piece, his voice (see process.md)
    'ESTOY TAN SOLO',
    null, // panel 9 is silent
    'SI DEJO DE IR AL GIMNASIO... ¿DEJO DE TENER VALOR COMO SER HUMANO?'
  ];

  function scaleFor(n) { return 0.60 + (n - 1) * 0.105; }
  function fontFor(n) { return 30 + (n - 1) * 3.5; }

  // ---------------- text helpers ----------------
  function wrap(text, maxW) {
    var words = text.split(' '), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }
  function drawLines(lines, cx, cy, lh) {
    for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], cx, cy + i * lh);
  }

  // wobbly hand-drawn rectangle path
  function wobRect(x, y, w, h, id, amt) {
    var pts = [], N = 5, i, t;
    for (i = 0; i <= N; i++) { t = i / N; pts.push([x + t * w + jit(id, i) * amt, y + jit(id, 20 + i) * amt]); }
    for (i = 1; i <= N; i++) { t = i / N; pts.push([x + w + jit(id, 40 + i) * amt, y + t * h + jit(id, 60 + i) * amt]); }
    for (i = 1; i <= N; i++) { t = i / N; pts.push([x + (1 - t) * w + jit(id, 80 + i) * amt, y + h + jit(id, 100 + i) * amt]); }
    for (i = 1; i < N; i++) { t = i / N; pts.push([x + jit(id, 120 + i) * amt, y + (1 - t) * h + jit(id, 140 + i) * amt]); }
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r); ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h); ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }

  // speech bubble with its tail in one combined path (no seam), flat offset shadow
  function bubblePath(x, y, w, h, r, tL, tTip, tR, tLen) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(tR, y + h);
    ctx.lineTo(tTip, y + h + tLen);
    ctx.lineTo(tL, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function bubble(text, cx, topY, maxW, fontPx, id) {
    ctx.font = '900 ' + fontPx + 'px "Arial Black", "Helvetica Neue", sans-serif';
    var lines = wrap(text, maxW - 56);
    var maxLW = 0, i;
    for (i = 0; i < lines.length; i++) maxLW = Math.max(maxLW, ctx.measureText(lines[i]).width);
    var bw = maxLW + 56, bh = lines.length * fontPx * 1.22 + 40;
    var bx = cx - bw / 2, by = topY;
    var tL = cx - 18 + jit(id, 3) * 4, tR = cx + 24 + jit(id, 3) * 4, tTip = cx + 2;
    ctx.fillStyle = INK;
    bubblePath(bx + 9, by + 9, bw, bh, 26, tL + 9, tTip + 9, tR + 9, 44); ctx.fill();
    ctx.fillStyle = PAPER;
    bubblePath(bx, by, bw, bh, 26, tL, tTip, tR, 44); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
    ctx.fillStyle = INK;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    drawLines(lines, cx, by + 22 + fontPx * 0.61, fontPx * 1.22);
    return by + bh;
  }

  // ---------------- Pacheco ----------------
  // Local space: feet at (0,0), up is negative y, full height ~470 units at scale 1.
  function limb(x1, y1, x2, y2, wOut, wIn) {
    ctx.strokeStyle = INK; ctx.lineWidth = wOut; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = PAPER; ctx.lineWidth = wIn;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function shaker(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(-20, -30); ctx.lineTo(20, -30); ctx.lineTo(15, 26); ctx.lineTo(-15, 26);
    ctx.closePath();
    ctx.fillStyle = TAN; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    ctx.fillStyle = GREY; ctx.fillRect(-22, -42, 44, 13);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.strokeRect(-22, -42, 44, 13);
    ctx.beginPath(); ctx.moveTo(-18, -4); ctx.lineTo(18, -4); ctx.stroke();
    ctx.restore();
  }
  function drawPacheco(o) {
    var s = o.s, breathe = 1 + Math.sin(simT * 2 * Math.PI / 3.2) * 0.004;
    ctx.save();
    ctx.translate(o.x, o.feetY);
    ctx.scale(s, s * breathe);
    // legs
    limb(-34, -168, -46, -8, 36, 23);
    limb(34, -168, 46, -8, 36, 23);
    // shoes
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(-52, -4, 27, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(52, -4, 27, 10, 0, 0, Math.PI * 2); ctx.fill();
    // shorts
    ctx.beginPath();
    ctx.moveTo(-64, -238); ctx.lineTo(64, -238); ctx.lineTo(56, -152); ctx.lineTo(-56, -152);
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    // arms behind torso for flex/down poses
    if (o.pose === 'flex') {
      limb(-84, -372, -152, -348, 54, 39);
      limb(-152, -348, -140, -448, 54, 39);
      limb(84, -372, 152, -348, 54, 39);
      limb(152, -348, 140, -448, 54, 39);
      // bicep bulges
      ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(-128, -392, 27, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(128, -392, 27, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (o.pose === 'down') {
      limb(-84, -372, -108, -292, 48, 34);
      limb(-108, -292, -102, -208, 48, 34);
      limb(84, -372, 108, -292, 48, 34);
      limb(108, -292, 102, -208, 48, 34);
    }
    // torso (the shirt)
    ctx.beginPath();
    ctx.moveTo(-90, -388); ctx.lineTo(90, -388); ctx.lineTo(58, -228); ctx.lineTo(-58, -228);
    ctx.closePath();
    ctx.fillStyle = RED; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
    // pec lines
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(-34, -352, 24, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(34, -352, 24, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    if (o.shirtText) {
      ctx.fillStyle = PAPER;
      ctx.font = '900 30px "Arial Black", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('JUST DOO', 0, -308);
      ctx.fillText('DOO', 0, -272);
    }
    // crossed arms over the shirt (panel 9)
    if (o.pose === 'cross') {
      limb(-70, -330, 62, -268, 50, 36);
      limb(70, -330, -62, -268, 50, 36);
    }
    // fists / hands
    ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 6;
    if (o.pose === 'flex') {
      ctx.beginPath(); ctx.arc(140, -452, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      shaker(-140, -478, 1); // left fist grips the shaker
    } else if (o.pose === 'down') {
      ctx.beginPath(); ctx.arc(-102, -204, 21, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(102, -204, 21, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (o.lowShaker) shaker(102, -178, 0.9);
    }
    // neck + head
    ctx.fillStyle = PAPER; ctx.fillRect(-17, -416, 34, 32);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.strokeRect(-17, -416, 34, 32);
    rr(-43, -502, 86, 96, 17);
    ctx.fillStyle = PAPER; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
    // hair cap
    ctx.beginPath();
    ctx.moveTo(-43, -478); ctx.lineTo(-43, -502); ctx.lineTo(43, -502); ctx.lineTo(43, -478);
    ctx.quadraticCurveTo(0, -462, -43, -478);
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    // sunglasses
    ctx.fillStyle = INK;
    rr(-41, -470, 82, 25, 9); ctx.fill();
    ctx.fillStyle = PAPER;
    ctx.fillRect(-30, -462, 16, 5); ctx.fillRect(14, -462, 16, 5);
    // mouth
    ctx.fillStyle = INK;
    if (o.mouth === 'shout') {
      ctx.beginPath(); ctx.ellipse(0, -428, 11, 14, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillRect(-13, -430, 26, 5);
    }
    ctx.restore();
  }

  function dumbbell(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = GREY; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.fillRect(-34, -6, 68, 12); ctx.strokeRect(-34, -6, 68, 12);
    ctx.fillRect(-46, -20, 14, 40); ctx.strokeRect(-46, -20, 14, 40);
    ctx.fillRect(32, -20, 14, 40); ctx.strokeRect(32, -20, 14, 40);
    ctx.fillRect(-58, -14, 10, 28); ctx.strokeRect(-58, -14, 10, 28);
    ctx.fillRect(48, -14, 10, 28); ctx.strokeRect(48, -14, 10, 28);
    ctx.restore();
  }

  // ---------------- scenes (design space 1000x1000) ----------------
  var FX = 30, FY = 30, FW = 940, FH = 940; // frame

  function frame(id) {
    wobRect(FX, FY, FW, FH, id, 3.2);
    ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
  }
  function clipFrame() {
    ctx.save();
    ctx.beginPath(); ctx.rect(FX + 5, FY + 5, FW - 10, FH - 10); ctx.clip();
  }

  function drawCard0(p) {
    clipFrame();
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, 1000, 1000);
    ctx.save();
    ctx.globalAlpha = 0.3 + 0.7 * p;
    ctx.translate((1 - p) * 26, 0);
    ctx.fillStyle = INK;
    ctx.font = '900 53px "Arial Black", "Helvetica Neue", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var lines = wrap(CAPTION, 800);
    drawLines(lines, 500, 500 - (lines.length - 1) * 40, 80);
    // a dumbbell under the words, drawn shapes only
    dumbbell(500, 816, 1.15);
    ctx.restore();
    ctx.restore();
    frame(900);
  }

  function drawGym(n, sOverride, darkAlpha) {
    clipFrame();
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, 1000, 1000);
    var s = sOverride || scaleFor(n);
    // escalation starburst, count grows with the panel
    ctx.strokeStyle = GREY; ctx.lineWidth = 5; ctx.globalAlpha = 0.55;
    var rays = n + 3, i, a, cx = 500, cy = 640;
    for (i = 0; i < rays; i++) {
      a = (i / rays) * Math.PI * 2 + jit(50 + n, i) * 0.14;
      var r1 = 268 * s + 26, r2 = r1 + 34 + jit(70 + n, i) * 10;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.92);
      ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2 * 0.92);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // floor
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(70, 940); ctx.lineTo(930, 940); ctx.stroke();
    ctx.fillStyle = GREY; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.ellipse(500, 948, 250 * s, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (n >= 3) { dumbbell(228, 922, 0.9); }
    drawPacheco({ x: 500, feetY: 938, s: s, pose: 'flex', mouth: 'shout' });
    bubble(PANELS[n], 500, 66, 850, fontFor(n), 100 + n);
    if (darkAlpha > 0) {
      ctx.fillStyle = INK; ctx.globalAlpha = darkAlpha;
      ctx.fillRect(0, 0, 1000, 1000);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    frame(900 + n);
  }

  function drawPanel8(p) {
    clipFrame();
    ctx.fillStyle = INK; ctx.fillRect(0, 0, 1000, 1000);
    // night: one small grey moon, one pool of grey around him
    ctx.fillStyle = GREY;
    ctx.beginPath(); ctx.arc(806, 168, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(822, 156, 29, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = GREY; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(500, 946, 210, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    drawPacheco({ x: 500, feetY: 940, s: 0.5, pose: 'down', mouth: 'flat', shirtText: true });
    if (p > 0.05) {
      ctx.save(); ctx.globalAlpha = Math.min(1, p * 1.4);
      bubble(PANELS[8], 500, 96, 430, 27, 108);
      ctx.restore();
    }
    ctx.restore();
    frame(908);
  }

  function drawPanel9(p) {
    clipFrame();
    ctx.fillStyle = INK; ctx.fillRect(0, 0, 1000, 1000);
    // spotlight: one flat grey cone, no gradient
    ctx.fillStyle = GREY;
    ctx.beginPath();
    ctx.moveTo(452, 40); ctx.lineTo(548, 40); ctx.lineTo(806, 946); ctx.lineTo(194, 946);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(500, 946, 306, 20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.globalAlpha = 0.25 + 0.75 * p;
    drawPacheco({ x: 500, feetY: 940, s: 0.82, pose: 'cross', mouth: 'flat' });
    ctx.restore();
    ctx.restore();
    frame(909);
  }

  function drawPanel10(p) {
    clipFrame();
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, 1000, 1000);
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(70, 940); ctx.lineTo(930, 940); ctx.stroke();
    ctx.fillStyle = GREY; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.ellipse(500, 948, 190, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.save(); ctx.globalAlpha = 0.3 + 0.7 * p;
    drawPacheco({ x: 500, feetY: 938, s: 0.68, pose: 'down', mouth: 'flat', lowShaker: true });
    ctx.restore();
    bubble(PANELS[10], 500, 66, 850, 33, 110);
    ctx.restore();
    frame(910);
  }

  // ---------------- main draw ----------------
  var VW = 0, VH = 0, S = 0, OX = 0, OY = 0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return VH > VW * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    VW = vv ? vv.width : window.innerWidth;
    VH = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(VW * dpr);
    canvas.height = Math.round(VH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) { S = VW; OX = 0; OY = (VH - S) / 2; }
    else { S = Math.min(VW, VH); OX = (VW - S) / 2; OY = (VH - S) / 2; }
    draw(simT);
  }

  function ease(t) { return t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t); }

  function draw(t) {
    canvas.style.width = VW + 'px';
    canvas.style.height = VH + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, VW, VH);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1000, S / 1000);
    ctx.lineJoin = 'round';

    var p = ease((t - transT) / 0.28); // entry progress of the current state
    if (cur === 0) drawCard0(p);
    else if (cur >= 1 && cur <= 6) drawGym(cur, null, 0);
    else if (cur === 7) {
      var dd = dragDark;
      if (dragBackT > 0) dd = dragDark * Math.max(0, 1 - (t - dragBackT) / 0.3);
      var s7 = 1.23 + (0.52 - 1.23) * dd;
      drawGym(7, s7, dd * 0.92);
    }
    else if (cur === 8) {
      var p8 = ease((t - transT) / 0.9);
      if (p8 < 1) {
        // the collapse, still in progress: panel 7 shrinking under darkness
        drawGym(7, 1.23 + (0.52 - 1.23) * p8, p8 * 0.97);
      } else drawPanel8(ease((t - transT - 0.9) / 0.5));
    }
    else if (cur === 9) drawPanel9(p);
    else if (cur === 10) drawPanel10(p);

    // panel counter: a small paper tag inside the bottom-left of the frame
    if (cur >= 1) {
      ctx.fillStyle = PAPER;
      rr(48, 908, 108, 40, 10); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
      ctx.fillStyle = INK;
      ctx.font = '700 24px "Helvetica Neue", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(cur + ' / 10', 102, 929);
    }
    // hint inside the bottom-right of the frame, scene-colored
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = (cur === 8 || cur === 9) ? PAPER : INK;
    ctx.font = '700 23px "Helvetica Neue", sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('tap', 944, 934);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------------- interaction ----------------
  function advance() {
    cur = (cur + 1) % 11;
    transT = simT;
    dragDark = 0; dragBackT = -100;
    draw(simT);
  }
  function toStage(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX - rect.left - OX) / S * 1000, y: (e.clientY - rect.top - OY) / S * 1000 };
  }
  function onDown(e) {
    var pt = toStage(e);
    pDown = { x: pt.x, y: pt.y, moved: false };
  }
  function onMove(e) {
    if (!pDown) return;
    var pt = toStage(e);
    if (Math.abs(pt.x - pDown.x) > 10 || Math.abs(pt.y - pDown.y) > 10) pDown.moved = true;
    if (cur === 7 && pt.y > pDown.y) {
      dragDark = Math.min(1, (pt.y - pDown.y) / 300);
      dragBackT = -100;
      draw(simT);
    }
  }
  function onUp(e) {
    if (!pDown) return;
    var wasDrag = pDown.moved;
    if (cur === 7 && dragDark > 0) {
      if (dragDark >= 0.55) { advance(); pDown = null; return; }
      dragBackT = simT; // darkness springs back
      draw(simT);
      pDown = null;
      return;
    }
    pDown = null;
    if (!wasDrag) advance();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { pDown = null; });
  }

  // ---------------- loop ----------------
  var startStamp = null;
  function frameLoop(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frameLoop);
  }
  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize(); // draws frame one synchronously at PHASE0
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
