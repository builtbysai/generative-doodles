<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Finding the Truth in the World Among Us</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0C0E; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- №1226 "Finding the Truth in the World Among Us" — Leslie Supnet study block LS3 ----
  // After her 2013 EVP spirit-summoning piece (sound by Clint Enns): a dark
  // field of AM-radio static, and pale chalk summon forms — rings, triangles,
  // eyes, waveforms — flickering half-heard out of the noise. A form locks
  // for a beat in dark red, then shatters into twelve line fragments and is
  // gone. Drag tunes the band; what can emerge depends on where you listen.
  // Double-tap reseeds the static.
  //
  // AUDIO ADAPTATION (house rule): the prompt specs WebAudio noise driving
  // the spawns, sound on by default. This piece ships SILENT. The spawn
  // driver is a closed-form signal-strength model S(t) — three summed slow
  // band components — and forms spawn when S crosses 0.72 upward at a
  // 12 fps step boundary, exactly as an amplitude envelope would drive
  // them. The piece is complete with no audio at all.

  var T0 = 22.5; // fixed phase of the synchronous first frame:
                 // wave (seq 1) is IN LOCK (age 6.08 of lockAge 5.70, red
                 // accent showing), wave (seq 2) holds at age 1.25.

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;

  function isPhone(w, h) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return sw < 700 || h > w * 1.15;
  }

  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function frac(v) { return v - Math.floor(v); }

  // ==MODEL START==
  function hashN(n) {
    n = n >>> 0;
    n = Math.imul(n ^ (n >>> 16), 2246822507);
    n = Math.imul(n ^ (n >>> 13), 3266489909);
    n = n ^ (n >>> 16);
    return (n >>> 0) / 4294967296;
  }
  function hash2(a, b) { return hashN((Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0); }
  // Signal model S(t): three slow summed band components, range clamped [0,1].
  var S_PERIODS = [7, 13, 29];
  var S_AMPS = [0.32, 0.26, 0.20];
  var S_PHASES = [hashN(233) * 6.283185307, hashN(234) * 6.283185307, hashN(235) * 6.283185307];
  var S_PERIOD = 2639; // lcm(7,13,29)
  function signalS(t) {
    var s = 0.5;
    for (var k = 0; k < 3; k++) s += S_AMPS[k] * Math.sin(6.283185307 * t / S_PERIODS[k] + S_PHASES[k]);
    return s < 0 ? 0 : (s > 1 ? 1 : s);
  }
  var SPAWN_THRESH = 0.72;
  var STEP = 1 / 12;
  // Upward threshold crossings within one S period, at step boundaries.
  function periodCrossings() {
    var out = [], prev = signalS(0), n = Math.floor(S_PERIOD * 12);
    for (var i = 1; i <= n; i++) {
      var cur = signalS(i * STEP);
      if (prev < SPAWN_THRESH && cur >= SPAWN_THRESH) out.push(i * STEP);
      prev = cur;
    }
    return out;
  }
  var CROSSINGS = periodCrossings();
  // Golden-ratio lattice points, shuffled by seed.
  function latticePoints() {
    var pts = [], i, x, y;
    for (i = 0; i < 24; i++) {
      x = ((i + 1) * 0.6180339887498949) % 1;
      y = ((i + 1) * 0.7548776662466927) % 1;
      pts.push({ gx: x, gy: y });
    }
    var a = 987654321 >>> 0;
    function rnd() { a = (Math.imul(a, 1664525) + 1013904223) >>> 0; return a / 4294967296; }
    for (i = pts.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var tmp = pts[i]; pts[i] = pts[j]; pts[j] = tmp; }
    return pts;
  }
  var LATTICE = latticePoints();
  var FORM_TYPES = ['ring', 'triangle', 'eye', 'wave', 'diamond'];
  var LOCK_SPAN = 0.8, SHATTER_SPAN = 1.2;
  function formLife(f) { return f.lockAge + LOCK_SPAN + SHATTER_SPAN; }
  // phiAt(t): tuning at time t; saltAt(t): reseed count at time t.
  // Returns all spawns with birth <= tEnd, in order.
  function computeSpawns(tEnd, phiAt, saltAt) {
    var forms = [], ptr = 0, lastPt = -1, seq = 0;
    var m, k, tc;
    for (m = 0; ; m++) {
      var base = m * S_PERIOD, done = false;
      for (k = 0; k < CROSSINGS.length; k++) {
        tc = base + CROSSINGS[k];
        if (tc > tEnd) { done = true; break; }
        var alive = 0;
        for (var q = 0; q < forms.length; q++) if (tc - forms[q].birth < formLife(forms[q])) alive++;
        if (alive >= 4) continue;
        var phi = phiAt(tc), chosen = -1;
        for (var s = 0; s < LATTICE.length; s++) {
          var idx = (ptr + s) % LATTICE.length;
          if (idx === lastPt && s === 0) continue;
          if (Math.abs(LATTICE[idx].gy - phi) <= 0.20) { chosen = idx; break; }
        }
        if (chosen < 0) continue; // missed: static swallows the crossing
        var salt = saltAt(tc);
        var f = {
          seq: seq, birth: tc, pt: chosen,
          gx: LATTICE[chosen].gx, gy: LATTICE[chosen].gy,
          type: FORM_TYPES[Math.floor(hash2(seq * 13 + salt * 101, 7) * 5) % 5],
          lockAge: 4 + 3 * hash2(seq * 29 + salt * 57, 77),
          rScale: 0.055 + 0.05 * hash2(seq * 41 + salt * 13, 31)
        };
        seq++;
        forms.push(f);
        ptr = (chosen + 1) % LATTICE.length;
        lastPt = chosen;
      }
      if (done) break;
    }
    return forms;
  }
  // ==MODEL END==

  function hash4(a, b, c, d) {
    return hashN((Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663) ^ Math.imul(c | 0, 83492791) ^ Math.imul(d | 0, 2971215073)) | 0);
  }

  // ---- interaction state: everything replays from these recorded events ----
  var nowT = T0;
  var dragEvents = [];   // {t0, t1(null while active), dPhi, dxNow}
  var reseeds = [];      // piece-times of double-taps
  var PHI_PER_PX = 0.0016;

  function phiAt(t) {
    var phi = 0.5, i, ev, f;
    for (i = 0; i < dragEvents.length; i++) {
      ev = dragEvents[i];
      if (t <= ev.t0) continue;
      if (ev.t1 !== null) {
        f = t >= ev.t1 ? 1 : (t - ev.t0) / Math.max(0.001, ev.t1 - ev.t0);
        phi += ev.dPhi * f;
      } else {
        f = clamp((t - ev.t0) / Math.max(0.05, nowT - ev.t0), 0, 1);
        phi += (ev.dxNow * PHI_PER_PX) * f;
      }
    }
    return clamp(phi, 0.04, 0.96);
  }
  function saltAt(t) {
    var n = 0, i;
    for (i = 0; i < reseeds.length; i++) if (reseeds[i] <= t) n++;
    return n;
  }

  var activeDrag = null, lastTapT = -10;
  function evPos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    return r;
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = evPos(e);
    activeDrag = { t0: nowT, t1: null, dPhi: 0, dxNow: 0, x0: p.x, y0: p.y, moved: 0 };
    dragEvents.push(activeDrag);
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', function (e) {
      if (!activeDrag) return;
      var p = evPos(e);
      activeDrag.dxNow = p.x - activeDrag.x0;
      var dy = p.y - activeDrag.y0;
      activeDrag.moved = Math.max(activeDrag.moved, Math.abs(activeDrag.dxNow), Math.abs(dy));
    });
    window.addEventListener('pointerup', function (e) {
      if (!activeDrag) return;
      activeDrag.t1 = nowT;
      activeDrag.dPhi = activeDrag.dxNow * PHI_PER_PX;
      var dur = nowT - activeDrag.t0;
      var wasTap = dur < 0.3 && activeDrag.moved < 12;
      activeDrag = null;
      if (wasTap) {
        if (nowT - lastTapT < 0.4) { reseeds.push(nowT); lastTapT = -10; }
        else lastTapT = nowT;
      }
    });
  }

  // ---- static field ----
  var GRAYS = ['#14171D', '#1E2228', '#232932', '#2C333E', '#39424F'];
  function bandProfile(y, t) {
    var s = 0, k, c, d;
    for (k = 0; k < 4; k++) {
      c = frac(0.16 + 0.24 * k + t * (0.004 + 0.0027 * k) * (k % 2 ? -1 : 1));
      d = Math.abs(y - c); if (d > 0.5) d = 1 - d;
      s += Math.exp(-(d * d) / 0.0128) * 0.55;
    }
    return s;
  }
  function loud(y, phi) {
    var d = y - phi;
    return Math.exp(-(d * d) / 0.045);
  }

  function drawStatic(t, step, phi, salt) {
    var cell = isPhone(W, H) ? 6 : 7;
    var cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
    var stepT = step * STEP;
    var r, c, yn, dens, h1;
    // faint band tints under the speckle
    ctx.fillStyle = '#0B0C0E';
    ctx.fillRect(0, 0, W, H);
    var strips = 18, si, sy, sb;
    for (si = 0; si < strips; si++) {
      sy = si / strips; sb = bandProfile(sy + 0.5 / strips, stepT);
      if (sb > 0.04) {
        ctx.fillStyle = 'rgba(38,45,56,' + (0.10 * sb).toFixed(3) + ')';
        ctx.fillRect(0, sy * H, W, H / strips + 1);
      }
    }
    for (r = 0; r < rows; r++) {
      yn = (r + 0.5) / rows;
      var base = 0.085 + 0.17 * bandProfile(yn, stepT) + 0.40 * loud(yn, phi);
      for (c = 0; c < cols; c++) {
        h1 = hash4(c, r, step, salt * 131 + 7);
        if (h1 >= base) continue;
        var h2 = hash4(c, r, step, salt * 131 + 8);
        var gi = Math.floor(h2 * 4.2);
        if (loud(yn, phi) > 0.55 && h2 > 0.6) gi = 4;
        var h3 = hash4(c, r, step, salt * 131 + 9);
        ctx.globalAlpha = 0.35 + 0.65 * h3;
        ctx.fillStyle = GRAYS[gi];
        ctx.fillRect(c * cell, r * cell, cell * 0.84, cell * 0.84);
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---- faint signal-blue waveform traces ----
  function drawTraces(step) {
    var stepT = step * STEP, j, x, y;
    ctx.lineWidth = 1.5;
    for (j = 0; j < 2; j++) {
      var yb = H * (0.30 + 0.36 * j) + 8 * Math.sin(stepT * 0.11 + j * 2.1);
      ctx.strokeStyle = j ? 'rgba(46,74,90,0.13)' : 'rgba(46,74,90,0.22)';
      ctx.beginPath();
      for (x = 0; x <= W; x += 8) {
        y = yb + (11 + 6 * j) * Math.sin(x * 0.018 + stepT * 1.7 + j * 2.4)
               + 4 * Math.sin(x * 0.057 - stepT * 2.3 + j * 1.3);
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  // ---- summon form geometry (unit coords, radius 1) ----
  function outline(f) {
    var lines = [], i, s, pts;
    var jit = function (idx) { return (hash2(f.seq * 53 + 19, idx) - 0.5) * 0.05; };
    if (f.type === 'ring') {
      pts = [];
      for (i = 0; i < 36; i++) { s = i / 36 * 6.283185307; pts.push([Math.cos(s) * (1 + jit(i)), Math.sin(s) * (1 + jit(i + 40))]); }
      pts.push(pts[0].slice()); lines.push(pts);
    } else if (f.type === 'triangle') {
      pts = [];
      var angs = [-1.5708, 2.618, 0.5236];
      for (i = 0; i < 3; i++) { var rr = 1.05 + jit(i * 3); pts.push([Math.cos(angs[i]) * rr, Math.sin(angs[i]) * rr]); }
      pts.push(pts[0].slice()); lines.push(pts);
    } else if (f.type === 'eye') {
      pts = [];
      for (i = 0; i <= 16; i++) { s = i / 16; pts.push([-1.1 + 2.2 * s, -0.62 * Math.sin(3.14159265 * s)]); }
      lines.push(pts);
      pts = [];
      for (i = 0; i <= 16; i++) { s = i / 16; pts.push([-1.1 + 2.2 * s, 0.62 * Math.sin(3.14159265 * s)]); }
      lines.push(pts);
      pts = [];
      for (i = 0; i < 20; i++) { s = i / 20 * 6.283185307; pts.push([Math.cos(s) * 0.34, Math.sin(s) * 0.34]); }
      pts.push(pts[0].slice()); lines.push(pts);
    } else if (f.type === 'wave') {
      pts = [];
      for (i = 0; i <= 32; i++) { s = i / 32; pts.push([-1.15 + 2.3 * s, 0.5 * Math.sin(s * 9.424778) + jit(i)]); }
      lines.push(pts);
    } else { // diamond
      pts = [[0, -1.15], [0.85, 0], [0, 1.15], [-0.85, 0]];
      pts.push(pts[0].slice()); lines.push(pts);
    }
    return lines;
  }

  function strokeLines(lines, cx, cy, R, scale, ox, oy) {
    var li, pi, pts;
    ctx.beginPath();
    for (li = 0; li < lines.length; li++) {
      pts = lines[li];
      for (pi = 0; pi < pts.length; pi++) {
        var X = cx + pts[pi][0] * R * scale + ox, Y = cy + pts[pi][1] * R * scale + oy;
        if (pi === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
    }
    ctx.stroke();
  }

  function drawForm(f, t, step) {
    var a = t - f.birth;
    if (a < 0 || a >= formLife(f)) return;
    var cx = (0.08 + 0.84 * f.gx) * W, cy = (0.10 + 0.80 * f.gy) * H;
    var R = f.rScale * Math.min(W, H);
    var lines = outline(f);
    // stepped chalk flicker — hash steps, never a smooth fade
    var fl = 0.55 + 0.45 * hash2(f.seq * 7 + 3, step);
    if (hash2(f.seq * 11 + 5, step) < 0.10) fl *= 0.2; // dropout
    var ox = (hash2(f.seq, step) - 0.5) * 2, oy = (hash2(f.seq + 999, step) - 0.5) * 2;
    var i, pts;
    if (a >= f.lockAge + LOCK_SPAN) {
      // SHATTER: the outline in 12 chunks, flying outward, stepped fade
      var sa = a - f.lockAge - LOCK_SPAN;
      var flat = [];
      for (i = 0; i < lines.length; i++) for (var p = 0; p < lines[i].length; p++) flat.push(lines[i][p]);
      var fade = 1 - Math.floor(sa / 0.24) / 5;
      if (fade <= 0) return;
      var per = Math.ceil(flat.length / 12);
      ctx.strokeStyle = '#D8D4C4';
      ctx.lineWidth = 1.4;
      for (var g = 0; g < 12; g++) {
        var ang = hash2(f.seq * 23, g) * 6.283185307;
        var spd = 26 + 70 * hash2(f.seq * 29, g);
        var vx = Math.cos(ang) * spd * sa, vy = Math.sin(ang) * spd * sa;
        ctx.globalAlpha = Math.max(0, fl * fade);
        ctx.beginPath();
        for (i = g * per; i < Math.min(flat.length, (g + 1) * per); i++) {
          var X = cx + flat[i][0] * R * 1.05 + vx, Y = cy + flat[i][1] * R * 1.05 + vy;
          if (i === g * per) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      return;
    }
    var scale = 1, alpha = fl;
    if (a < 0.5) { // flicker-in: stuttering appearance over 0.5 s
      var gate = hash2(f.seq * 17 + 1, Math.floor(a * 12)) > 0.35 ? 1 : 0.12;
      alpha = fl * gate * 0.9; scale = 0.94;
    }
    if (a >= f.lockAge) { // LOCK: dark red accent under chalk, +10% scale
      scale = 1.1;
      ctx.strokeStyle = '#7A1F1F';
      ctx.globalAlpha = 0.55 + 0.35 * hash2(f.seq * 31, step);
      ctx.lineWidth = 3.5;
      strokeLines(lines, cx, cy, R, scale, 0, 0);
      alpha = Math.min(1, fl + 0.25);
    }
    // chalk: two passes, the first a faint ±1px hash-offset ghost
    ctx.strokeStyle = '#D8D4C4';
    ctx.globalAlpha = alpha * 0.35;
    ctx.lineWidth = 2.2;
    strokeLines(lines, cx, cy, R, scale, ox, oy);
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 1.4;
    strokeLines(lines, cx, cy, R, scale, 0, 0);
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var step = Math.floor(t * 12);
    var phi = phiAt(t);
    var salt = saltAt(t);
    drawStatic(t, step, phi, salt);
    drawTraces(step);
    var forms = computeSpawns(t, phiAt, saltAt);
    for (var i = 0; i < forms.length; i++) drawForm(forms[i], t, step);
  }

  resize();
  nowT = T0;
  draw(T0);

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(nowT); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(nowT); });
  }

  var anchorTs = null;
  function loop(ts) {
    if (anchorTs === null) anchorTs = ts;
    nowT = T0 + (ts - anchorTs) / 1000;
    draw(nowT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
