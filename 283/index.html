<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.283 Salt Worn</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101014; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.283 Salt Worn (Sophia Golovanevskaya).
// A cream porcelain vessel on a dark ground. The lower half is
// porous matte bone, pitted and cratered by salt; the upper half
// holds a smooth teal glaze tide. Between them a ragged shoreline
// breathes on a 30 second loop, rising and falling a few percent,
// while the erosion pits deepen and refill and a slow specular
// sweep crosses the glaze. Watch-only, no reload.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#101014', BONE = '#EFE9DB', PIT = '#D8D2C2', TEAL = '#2E7E7B', DEEP = '#1F5B5E', BARN = '#C9C2B0';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0; // stored centred-fit transform
var LOOP = 30;
var T = 8; // frame one: loop at about 8s, tide partway down, pits developed
var lastNow = -1;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function smooth(a, b, x) { var u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); }

// ---- vessel profile ---------------------------------------------------------
// Lathe profile: half width as a function of t (0 at the rim, 1 at
// the foot), through control points for a flared rim, a narrow neck,
// a swelling shoulder and belly, and a tucked foot. The vessel is
// 675px tall, 75 percent of the 900px frame height, centred.
var CX = 640, VTOP = 112, VH = 675, VBOT = VTOP + VH;
var PROF = [
  [0.00, 118], [0.04, 132], [0.09, 109], [0.16, 100], [0.26, 120],
  [0.38, 162], [0.52, 190], [0.66, 188], [0.78, 168], [0.88, 138],
  [0.95, 106], [1.00, 80]
];
function radiusAt(t) {
  t = clamp(t, 0, 1);
  for (var i = 0; i < PROF.length - 1; i++) {
    var a = PROF[i], b = PROF[i + 1];
    if (t >= a[0] && t <= b[0]) {
      var p0 = PROF[Math.max(0, i - 1)][1], p1 = a[1], p2 = b[1], p3 = PROF[Math.min(PROF.length - 1, i + 2)][1];
      var u = (t - a[0]) / (b[0] - a[0]);
      // Catmull-Rom spline through the control radii, so the lathe
      // profile flows without steps or wobbles at the control points
      return 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
    }
  }
  return PROF[PROF.length - 1][1];
}
function vesselPath() {
  ctx.beginPath();
  var i, t, r;
  for (i = 0; i <= 40; i++) {
    t = i / 40; r = radiusAt(t);
    var x = CX - r, y = VTOP + t * VH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  // foot: a shallow curve under the base
  ctx.quadraticCurveTo(CX, VBOT + 10, CX + radiusAt(1), VBOT);
  for (i = 40; i >= 0; i--) {
    t = i / 40; r = radiusAt(t);
    ctx.lineTo(CX + r, VTOP + t * VH);
  }
  ctx.closePath();
}

// ---- seeded fbm data ----------------------------------------------------------
// One dimensional value noise: a fixed table of seeded values,
// smoothly interpolated, summed at two octaves for the shoreline.
function makeNoise(seed, n) {
  var r = rng(seed), tab = [];
  for (var i = 0; i < n; i++) tab.push(r() * 2 - 1);
  return {
    at: function (x) {
      var xi = Math.floor(x), u = x - xi;
      u = u * u * (3 - 2 * u);
      var a = tab[((xi % n) + n) % n], b = tab[(((xi + 1) % n) + n) % n];
      return a + (b - a) * u;
    }
  };
}
var shoreA = makeNoise(283011, 16), shoreB = makeNoise(283047, 16);
function fbm(noise, x) { return noise.at(x) * 0.7 + noise.at(x * 2.7 + 5.3) * 0.3; }

// Tide line: base level breathes a few percent of the vessel height
// on the loop; the ragged edge crossfades between two shoreline
// seeds over the same loop, so the seam at the loop point is exact.
function shoreY(x, phase, breathe) {
  var cross = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
  var u = (x - (CX - 200)) / 400;
  var n = fbm(shoreA, u * 5.1) * (1 - cross) + fbm(shoreB, u * 5.1) * cross;
  var base = VTOP + VH * (0.47 + breathe);
  return base + n * 24;
}

// ---- erosion pits: seeded cellular data --------------------------------------
// Craters and fine pores held purely as data. Each pit knows its
// place in the vessel (t down the profile, u across the width),
// its size and its own deepen phase. Pits are drawn only as flat
// bone and pitted shadow marks: no gradients on the matte zone.
var craters = [], pores = [];
(function () {
  var r = rng(283101);
  var i, t, u;
  for (i = 0; i < 230; i++) {
    t = 0.50 + Math.pow(r(), 0.8) * 0.48;
    u = (r() * 2 - 1) * 0.90;
    craters.push({ t: t, u: u, rad: 3.4 + Math.pow(r(), 1.4) * 10.5, ph: r() * Math.PI * 2, wob: 0.75 + r() * 0.4 });
  }
  // a few tight clusters, so the erosion reads as eaten patches
  for (var ci = 0; ci < 14; ci++) {
    var ct = 0.52 + r() * 0.44, cu = (r() * 2 - 1) * 0.78;
    for (var cj = 0; cj < 6; cj++) {
      craters.push({ t: clamp(ct + (r() * 2 - 1) * 0.035, 0.5, 0.99), u: clamp(cu + (r() * 2 - 1) * 0.14, -0.92, 0.92), rad: 2.6 + r() * 5.5, ph: r() * Math.PI * 2, wob: 0.75 + r() * 0.4 });
    }
  }
  for (i = 0; i < 900; i++) {
    t = 0.485 + r() * 0.50;
    u = (r() * 2 - 1) * 0.94;
    pores.push({ t: t, u: u, rad: 0.9 + r() * 1.5, dark: r() < 0.72 });
  }
})();

// ---- barnacles ------------------------------------------------------------------
// Clusters anchored along the shoreline band, denser toward the
// middle of the vessel with falloff toward the edges. Each cluster
// is a handful of small ellipses with a shadowed centre.
var barnacles = [];
(function () {
  var r = rng(283202);
  for (var c = 0; c < 34; c++) {
    var u = (r() * 2 - 1);
    if (Math.abs(u) > 0.94) continue;
    var fall = 1 - Math.abs(u) * 0.55;
    var n = Math.max(3, Math.round((4 + r() * 5) * fall));
    var cl = { u: u, dy: (r() * 2 - 1) * 13, items: [] };
    for (var i = 0; i < n; i++) {
      cl.items.push({
        dx: (r() * 2 - 1) * 16, dy: (r() * 2 - 1) * 9,
        rx: 4.0 + r() * 5.5, ry: 0, ph: r() * Math.PI * 2
      });
      cl.items[i].ry = cl.items[i].rx * (0.62 + r() * 0.2);
    }
    barnacles.push(cl);
  }
})();

// ---- drawing ---------------------------------------------------------------------
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-80, -80, DW + 160, DH + 160);

  var phase = (T % LOOP) / LOOP;
  var breathe = 0.032 * Math.sin(phase * Math.PI * 2); // tide rises and falls a few percent
  var pitGlobal = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2); // pits deepen then refill on the loop

  // soft contact shadow under the foot, layered translucency only
  ctx.fillStyle = rgba(PIT, 0.10);
  ctx.beginPath(); ctx.ellipse(CX, VBOT + 14, 150, 15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(PIT, 0.08);
  ctx.beginPath(); ctx.ellipse(CX, VBOT + 14, 105, 10, 0, 0, Math.PI * 2); ctx.fill();

  // vessel base: flat matte bone over the whole silhouette
  vesselPath();
  ctx.fillStyle = BONE;
  ctx.fill();

  ctx.save();
  vesselPath();
  ctx.clip();

  // glaze zone: everything above the ragged shoreline
  ctx.beginPath();
  ctx.moveTo(CX - 210, VTOP - 6);
  var x, y;
  for (x = CX - 210; x <= CX + 210; x += 10) ctx.lineTo(x, shoreY(x, phase, breathe));
  ctx.lineTo(CX + 210, VTOP - 6);
  ctx.closePath();
  ctx.fillStyle = TEAL;
  ctx.fill();

  // glaze modelling: flat translucent deep teal bands at the sides
  // and under the shoulder, layered translucency only, no gradients
  ctx.fillStyle = rgba(DEEP, 0.30);
  ctx.beginPath(); ctx.ellipse(CX - 158, 262, 34, 118, 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(DEEP, 0.38);
  ctx.beginPath(); ctx.ellipse(CX + 160, 262, 36, 118, -0.16, 0, Math.PI * 2); ctx.fill();


  // specular sweep: a low alpha bone band crossing the glaze on the
  // loop, clipped to the glaze zone, fading in and out at the ends
  var sweepP = phase;
  var sweepX = CX - 240 + sweepP * 480;
  var sweepA = 0.13 * Math.sin(Math.PI * clamp(sweepP, 0, 1));
  if (sweepA > 0.004) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(CX - 210, VTOP - 6);
    for (x = CX - 210; x <= CX + 210; x += 10) ctx.lineTo(x, shoreY(x, phase, breathe));
    ctx.lineTo(CX + 210, VTOP - 6);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = rgba(BONE, sweepA);
    ctx.beginPath();
    ctx.moveTo(sweepX - 20, VTOP - 20);
    ctx.lineTo(sweepX + 18, VTOP - 20);
    ctx.lineTo(sweepX + 2, VTOP + VH * 0.52);
    ctx.lineTo(sweepX - 36, VTOP + VH * 0.52);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgba(BONE, sweepA * 0.55);
    ctx.beginPath();
    ctx.moveTo(sweepX + 30, VTOP - 20);
    ctx.lineTo(sweepX + 42, VTOP - 20);
    ctx.lineTo(sweepX + 26, VTOP + VH * 0.52);
    ctx.lineTo(sweepX + 14, VTOP + VH * 0.52);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // matte modelling without gradients: a flat translucent shadow
  // crescent low on the right of the belly, in pitted shadow only
  ctx.fillStyle = rgba(PIT, 0.20);
  ctx.beginPath(); ctx.ellipse(CX + 148, 650, 34, 105, -0.14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(PIT, 0.13);
  ctx.beginPath(); ctx.ellipse(CX - 152, 655, 26, 95, 0.14, 0, Math.PI * 2); ctx.fill();

  // fine pores: flat marks only, below the current shoreline
  var i, p, px, py;
  ctx.fillStyle = rgba(PIT, 0.75);
  ctx.beginPath();
  for (i = 0; i < pores.length; i++) {
    p = pores[i];
    if (!p.dark) continue;
    px = CX + p.u * radiusAt(p.t) * 0.96;
    py = VTOP + p.t * VH;
    if (py < shoreY(px, phase, breathe) + 4) continue;
    ctx.moveTo(px + p.rad, py);
    ctx.ellipse(px, py, p.rad, p.rad * 0.78, 0, 0, Math.PI * 2);
  }
  ctx.fill();
  ctx.fillStyle = rgba(BONE, 0.9);
  ctx.beginPath();
  for (i = 0; i < pores.length; i++) {
    p = pores[i];
    if (p.dark) continue;
    px = CX + p.u * radiusAt(p.t) * 0.96;
    py = VTOP + p.t * VH;
    if (py < shoreY(px, phase, breathe) + 4) continue;
    ctx.moveTo(px + p.rad, py);
    ctx.ellipse(px, py, p.rad, p.rad * 0.78, 0, 0, Math.PI * 2);
  }
  ctx.fill();

  // craters: a pitted shadow bowl that deepens and refills on the
  // loop, each on its own phase, with a small flat bone lip low
  for (i = 0; i < craters.length; i++) {
    var c = craters[i];
    px = CX + c.u * radiusAt(c.t) * 0.94;
    py = VTOP + c.t * VH;
    if (py < shoreY(px, phase, breathe) + 5) continue;
    var depth = clamp(0.35 + 0.65 * pitGlobal * (0.65 + 0.35 * Math.sin(phase * Math.PI * 2 + c.ph)), 0, 1);
    var rr = c.rad * (0.78 + 0.30 * depth);
    ctx.fillStyle = rgba(PIT, 0.55 + 0.45 * depth);
    ctx.beginPath(); ctx.ellipse(px, py, rr, rr * 0.72 * c.wob, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(PIT, 0.95);
    ctx.beginPath(); ctx.ellipse(px, py + rr * 0.10, rr * 0.55, rr * 0.38 * c.wob, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(BONE, 0.50);
    ctx.beginPath(); ctx.ellipse(px, py + rr * 0.78, rr * 0.62, rr * 0.16, 0, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();

  // rim and opening: a gentle three quarter view, the mouth tipped
  // toward the viewer, deep teal pooled inside
  ctx.fillStyle = DEEP;
  ctx.beginPath(); ctx.ellipse(CX + 6, VTOP + 4, radiusAt(0) - 6, 21, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(BONE, 0.20);
  ctx.beginPath(); ctx.ellipse(CX - 28, VTOP + 1, 52, 8, -0.06, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = rgba(TEAL, 0.95);
  ctx.lineWidth = 7;
  ctx.beginPath(); ctx.ellipse(CX + 6, VTOP + 4, radiusAt(0), 23, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = rgba(BONE, 0.35);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(CX + 6, VTOP + 4, radiusAt(0) + 5, 25, 0, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();

  // silhouette edge against the dark ground: the two side profiles
  // stroked separately, so no chord line crosses the mouth
  ctx.strokeStyle = rgba(BONE, 0.22);
  ctx.lineWidth = 2;
  var si, st;
  ctx.beginPath();
  for (si = 0; si <= 40; si++) { st = si / 40; var sx = CX - radiusAt(st), sy = VTOP + st * VH; if (si === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); }
  ctx.stroke();
  ctx.beginPath();
  for (si = 0; si <= 40; si++) { st = si / 40; var sx2 = CX + radiusAt(st), sy2 = VTOP + st * VH; if (si === 0) ctx.moveTo(sx2, sy2); else ctx.lineTo(sx2, sy2); }
  ctx.stroke();

  // barnacles along the shoreline, riding the breathing line
  for (var b = 0; b < barnacles.length; b++) {
    var cl2 = barnacles[b];
    var bx = CX + cl2.u * 178;
    var by = shoreY(bx, phase, breathe) + cl2.dy;
    for (var k = 0; k < cl2.items.length; k++) {
      var it = cl2.items[k];
      var ix = bx + it.dx, iy = by + it.dy;
      ctx.fillStyle = rgba(BARN, 0.96);
      ctx.beginPath(); ctx.ellipse(ix, iy, it.rx, it.ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba(PIT, 0.85);
      ctx.beginPath(); ctx.ellipse(ix, iy, it.rx * 0.42, it.ry * 0.42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba(GROUND, 0.55);
      ctx.beginPath(); ctx.ellipse(ix, iy, it.rx * 0.16, it.ry * 0.16, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ---- resize ------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame -----------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the shaped vessel keeps its proportions, page
  // ground is the piece ground colour
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  if (lastNow >= 0 && time > 0) {
    var dt = Math.min(0.05, (time - lastNow) / 1000);
    T += dt;
  }
  lastNow = time;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
