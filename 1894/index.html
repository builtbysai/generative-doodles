<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Journeys at Once</title>
<style>
html, body { margin: 0; padding: 0; background: #D8D2C4; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Two Journeys at Once: two generative timelines run in parallel around
   one shared theme. One is a mountain route traced in slow ink, a hiking
   path with switchbacks. The other is a resistance-history trace in red
   chalk, years and place words appearing and fading. The piece intercuts
   between them: the mountain timeline dominates for a stretch, then
   dissolves into the history timeline, then back. Both timelines keep
   their own clock; the intercut points are cued by shared words.
   Watch only. */
var TAU = Math.PI * 2;
var GROUND = '#D8D2C4';
var INDIGO = '#2E3A67';
var CHALK = '#B03A2E';
var BLACK = '#141414';
var SEED0 = 1894;
var FRAME_T = 9.0;       /* fixed phase: mountain dominant, cue word mid-fade */
var CYCLE = 48;          /* seconds: mountain holds, crossfade, history holds, crossfade */
var CUE_WORDS = ['pass', 'ridge', 'night', 'road'];
var YEARS = ['1943', '1944', '1945'];
var PLACES = ['valley', 'ridge', 'pass', 'village'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* QA hook only: ?t=SECONDS or ?seed=N jumps the clock. No link in the
   piece uses these. */
try {
  var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
  var mt = qs.match(/[?&]t=([0-9.]+)/);
  var ms = qs.match(/[?&]seed=([0-9.]+)/);
  if (mt) phaseT = parseFloat(mt[1]);
  else if (ms) phaseT = parseFloat(ms[1]);
} catch (e) { /* keep FRAME_T */ }
FRAME_T = phaseT;
/* ---- deterministic geometry, all seeded from 1894 ---- */
/* Mountain route: switchbacks down the panel, normalized coords. */
var route = [];
var contours = [];   /* faint contour arcs the route crosses */
(function buildMountain() {
  var rng = mulberry32(SEED0);
  var rows = 7, i;
  var x = 0.12, y = 0.10;
  route.push({ x: x, y: y });
  for (i = 0; i < rows; i++) {
    var dir = (i % 2 === 0) ? 1 : -1;
    x = dir > 0 ? 0.86 + (rng() * 2 - 1) * 0.04 : 0.14 + (rng() * 2 - 1) * 0.04;
    y = 0.10 + (i + 1) * 0.115 + (rng() * 2 - 1) * 0.015;
    route.push({ x: x, y: y });
  }
  route.push({ x: 0.5 + (rng() * 2 - 1) * 0.2, y: 0.94 });
  for (i = 0; i < 9; i++) {
    contours.push({
      x: 0.1 + rng() * 0.8, y: 0.08 + rng() * 0.84,
      r: 0.05 + rng() * 0.10, a0: rng() * TAU, a1: rng() * 1.2 + 0.8
    });
  }
})();
/* History trace: fourteen events, each a year and a generic place word,
   one per cell of a jittered 4 by 4 grid so labels never pile up. */
var events = [];
(function buildHistory() {
  var rng = mulberry32(SEED0 + 7);
  var i;
  for (i = 0; i < 14; i++) {
    var col = i % 4, row = Math.floor(i / 4);
    events.push({
      x: 0.19 + col * 0.21 + (rng() * 2 - 1) * 0.05,
      y: 0.17 + row * 0.21 + (rng() * 2 - 1) * 0.05,
      year: YEARS[i % 3],
      place: PLACES[Math.floor(rng() * PLACES.length)],
      ph: rng() * TAU,
      slot: i / 14
    });
  }
})();
/* Polyline helpers in panel space. */
function routeLength() {
  var L = 0, i;
  for (i = 1; i < route.length; i++) {
    var dx = route[i].x - route[i - 1].x, dy = route[i].y - route[i - 1].y;
    L += Math.sqrt(dx * dx + dy * dy);
  }
  return L;
}
var ROUTE_LEN = routeLength();
function routePointAt(frac) {
  var target = clamp(frac, 0, 1) * ROUTE_LEN, i;
  for (i = 1; i < route.length; i++) {
    var dx = route[i].x - route[i - 1].x, dy = route[i].y - route[i - 1].y;
    var seg = Math.sqrt(dx * dx + dy * dy);
    if (target <= seg) {
      var f = seg > 0 ? target / seg : 0;
      return { x: route[i - 1].x + dx * f, y: route[i - 1].y + dy * f, seg: i };
    }
    target -= seg;
  }
  return { x: route[route.length - 1].x, y: route[route.length - 1].y, seg: route.length - 1 };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The piece rect: full-bleed on phones, a centered square on desktop.
   The page ground is the piece's own paper-warm grey. */
function pieceRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, s: s, w: s, h: s };
}
/* Intercut weight: 1 means the mountain timeline holds the frame,
   0 means the history timeline does. 48 s cycle: mountain holds
   0 to 14, dissolves 14 to 22, history holds 22 to 38, returns
   38 to 46. Each dissolve is centered on a cue-word peak (t = 18
   and t = 42), so the shared word is the cut between them. */
function mountainWeight(t) {
  var u = ((t % CYCLE) + CYCLE) % CYCLE;
  if (u < 14) return 1;
  if (u < 22) return 1 - smooth((u - 14) / 8);
  if (u < 38) return 0;
  if (u < 46) return smooth((u - 38) / 8);
  return 1;
}
/* ---- the mountain engine: path walker on its own clock ---- */
function drawMountain(R, tM, alpha) {
  if (alpha <= 0.01) return;
  var i;
  ctx.save();
  ctx.globalAlpha = alpha;
  /* faint contour arcs, crossed by the route */
  ctx.strokeStyle = rgba(INDIGO, 0.16);
  ctx.lineWidth = Math.max(1, R.s * 0.0012);
  for (i = 0; i < contours.length; i++) {
    var c = contours[i];
    var cx = R.ox + c.x * R.w, cy = R.oy + c.y * R.h;
    var cr = Math.max(1, c.r * R.s);
    ctx.beginPath();
    ctx.moveTo(cx + cr * Math.cos(c.a0), cy + cr * Math.sin(c.a0));
    ctx.arc(cx, cy, cr, c.a0, c.a0 + c.a1);
    ctx.stroke();
  }
  /* ghost of the whole route, then the ink drawn so far */
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = rgba(INDIGO, 0.18);
  ctx.lineWidth = Math.max(1, R.s * 0.002);
  ctx.beginPath();
  for (i = 0; i < route.length; i++) {
    var gx = R.ox + route[i].x * R.w, gy = R.oy + route[i].y * R.h;
    if (i === 0) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
  }
  ctx.stroke();
  var prog = (tM * 0.022) % 1;   /* one full traverse about every 45 s */
  var wp = routePointAt(prog);
  ctx.strokeStyle = rgba(INDIGO, 0.92);
  ctx.lineWidth = Math.max(1.5, R.s * 0.004);
  ctx.beginPath();
  for (i = 0; i <= wp.seg; i++) {
    var px = R.ox + route[i].x * R.w, py = R.oy + route[i].y * R.h;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.lineTo(R.ox + wp.x * R.w, R.oy + wp.y * R.h);
  ctx.stroke();
  /* the walker: a filled ink dot with a thin ring */
  var wx = R.ox + wp.x * R.w, wy = R.oy + wp.y * R.h;
  var wr = Math.max(3, R.s * 0.009);
  ctx.fillStyle = rgba(INDIGO, 0.95);
  ctx.beginPath();
  ctx.moveTo(wx + wr, wy);
  ctx.arc(wx, wy, wr, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(INDIGO, 0.5);
  ctx.lineWidth = Math.max(1, R.s * 0.0015);
  ctx.beginPath();
  ctx.moveTo(wx + wr * 2, wy);
  ctx.arc(wx, wy, wr * 2, 0, TAU);
  ctx.stroke();
  ctx.restore();
}
/* ---- the history engine: event scatter on its own clock ---- */
function drawHistory(R, tH, alpha) {
  if (alpha <= 0.01) return;
  var i;
  ctx.save();
  ctx.globalAlpha = alpha;
  /* faint red trace joining the events in order, drawn progressively */
  var hProg = (tH * 0.03) % 1;   /* one full trace about every 33 s */
  var upto = Math.floor(hProg * events.length);
  ctx.strokeStyle = rgba(CHALK, 0.35);
  ctx.lineWidth = Math.max(1, R.s * 0.0018);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (i = 0; i <= upto && i < events.length; i++) {
    var tx = R.ox + events[i].x * R.w, ty = R.oy + events[i].y * R.h;
    if (i === 0) ctx.moveTo(tx, ty); else ctx.lineTo(tx, ty);
  }
  ctx.stroke();
  /* events appear and fade on their own slow pulse */
  var yearPx = Math.max(11, Math.round(R.s * 0.020));
  var placePx = Math.max(10, Math.round(R.s * 0.016));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (i = 0; i < events.length; i++) {
    var e = events[i];
    var pulse = 0.5 + 0.5 * Math.sin(tH * 0.35 + e.ph);
    var ea = 0.25 + 0.65 * pulse;
    var ex = R.ox + e.x * R.w, ey = R.oy + e.y * R.h;
    var er = Math.max(2.5, R.s * 0.006);
    ctx.fillStyle = rgba(CHALK, ea);
    ctx.beginPath();
    ctx.moveTo(ex + er, ey);
    ctx.arc(ex, ey, er, 0, TAU);
    ctx.fill();
    ctx.font = 'bold ' + yearPx + 'px monospace';
    ctx.fillText(e.year, ex, ey - yearPx * 0.95);
    ctx.font = placePx + 'px monospace';
    ctx.fillText(e.place, ex, ey + placePx * 1.05);
  }
  ctx.restore();
}
/* ---- the cue-word bus: one shared word on the seam ---- */
function drawCue(R, seamX, seamY, vertical, t) {
  var idx = Math.floor(t / 12) % CUE_WORDS.length;
  var frac = (t % 12) / 12;
  var a = Math.sin(Math.PI * frac);   /* fades in, peaks, fades out */
  if (a <= 0.02) return;
  var word = CUE_WORDS[idx];
  var px = Math.max(20, Math.round(R.s * 0.042));
  ctx.save();
  ctx.globalAlpha = 0.15 + 0.80 * a;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + px + 'px monospace';
  var ww = ctx.measureText(word).width;
  var pad = 14;
  var bx = seamX - ww / 2 - pad, by = seamY - px / 2 - pad;
  ctx.fillStyle = rgba(GROUND, 0.88);
  ctx.fillRect(bx, by, ww + pad * 2, px + pad * 2);
  ctx.fillStyle = rgba(BLACK, 0.95);
  ctx.fillText(word, seamX, seamY);
  ctx.restore();
}
function drawPlates(R) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Two Journeys at Once').width > R.w - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Two Journeys at Once').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 20').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = R.ox + 12, plateY = R.oy + 12;
  ctx.fillStyle = BLACK;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(INDIGO, 0.9);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = GROUND;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Two Journeys at Once', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2007 · 03 · 20', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch two timelines share one theme.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = R.ox + 12;
  var hintPlateY = R.oy + R.h - hintPlateH - 12;
  ctx.fillStyle = BLACK;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(INDIGO, 0.9);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = GROUND;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var R = pieceRect();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var t = phaseT;
  var mW = mountainWeight(t);          /* 1 mountain holds, 0 history holds */
  var tM = t;                          /* mountain clock: real time */
  var tH = t * 0.85 + 3;               /* history clock: slower, offset */
  var vertical = R.w >= R.h;
  /* dominant panel takes two thirds, the other a third */
  var mFrac = 1 / 3 + mW / 3;
  var seam = vertical ? R.ox + R.w * mFrac : R.oy + R.h * mFrac;
  var mRect, hRect;
  if (vertical) {
    mRect = { ox: R.ox, oy: R.oy, s: R.s, w: seam - R.ox, h: R.h };
    hRect = { ox: seam, oy: R.oy, s: R.s, w: R.ox + R.w - seam, h: R.h };
  } else {
    mRect = { ox: R.ox, oy: R.oy, s: R.s, w: R.w, h: seam - R.oy };
    hRect = { ox: R.ox, oy: seam, s: R.s, w: R.w, h: R.oy + R.h - seam };
  }
  /* the minor timeline stays visible, dimmed, in its third */
  ctx.save();
  ctx.beginPath();
  ctx.rect(mRect.ox, mRect.oy, mRect.w, mRect.h);
  ctx.clip();
  drawMountain(mRect, tM, 0.45 + 0.55 * mW);
  ctx.restore();
  ctx.save();
  ctx.beginPath();
  ctx.rect(hRect.ox, hRect.oy, hRect.w, hRect.h);
  ctx.clip();
  drawHistory(hRect, tH, 0.45 + 0.55 * (1 - mW));
  ctx.restore();
  /* soft seam: a black band fading out on both sides */
  var seamW = Math.max(18, R.s * 0.05);
  var g;
  if (vertical) {
    g = ctx.createLinearGradient(seam - seamW, 0, seam + seamW, 0);
    g.addColorStop(0, rgba(BLACK, 0));
    g.addColorStop(0.5, rgba(BLACK, 0.10));
    g.addColorStop(1, rgba(BLACK, 0));
    ctx.fillStyle = g;
    ctx.fillRect(seam - seamW, R.oy, seamW * 2, R.h);
  } else {
    g = ctx.createLinearGradient(0, seam - seamW, 0, seam + seamW);
    g.addColorStop(0, rgba(BLACK, 0));
    g.addColorStop(0.5, rgba(BLACK, 0.10));
    g.addColorStop(1, rgba(BLACK, 0));
    ctx.fillStyle = g;
    ctx.fillRect(R.ox, seam - seamW, R.w, seamW * 2);
  }
  var seamX = vertical ? seam : R.ox + R.w / 2;
  var seamY = vertical ? R.oy + R.h / 2 : seam;
  drawCue(R, seamX, seamY, vertical, t);
  drawPlates(R);
}
/* ---- frame one: fixed phase t = 9 s, mountain dominant at two thirds,
   cue word "pass" fading out at alpha about 0.7, seed 1894 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
