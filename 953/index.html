<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 Agents, Straight Lines</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E0F12; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="doodle"></canvas>
<script>
'use strict';
/* No.953 "100 Agents, Straight Lines" - study #117 reas, PP114 "The Score".
   100 agents walk straight on a toroidal square. When an agent's path crosses
   another agent's trail, both turn by the stage's angle: the younger turns
   left, the older turns right. The score advances every 180 s:
   90 deg cool -> 60 deg warm -> 90 deg + trail avoidance -> repeat.
   Fixed-timestep sim (120 Hz), 3600 pre-roll steps, deterministic per seed. */

var WORLD = 1000;          // virtual square, mapped onto the viewport
var DT = 1 / 120;          // fixed timestep
var PREROLL = 3600;        // 30 s of performance before frame one
var TRAIL_FADE = 30;       // seconds a walked segment stays visible
var REC_EVERY = 8;         // record a trail segment every 8 steps (15 / s)
var CELL = 24;             // spatial hash cell size (world units)
var GRID = Math.ceil(WORLD / CELL);
var BASE_SEED = 953114;

/* ---------------- seeded rng ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------- palette ---------------- */
function hx(c) {
  return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
}
var CHALK = hx('#F2EFE6'), OCHRE = hx('#E8A013'), RUST = hx('#B34A1E'), SLATE = hx('#5C7FA3');
var STAGES = [
  { turn: Math.PI / 2, pal: [CHALK, SLATE, OCHRE], avoid: false, tune: 1.0 },
  { turn: Math.PI / 3, pal: [OCHRE, RUST, CHALK], avoid: false, tune: 1.122 },
  { turn: Math.PI / 2, pal: [RUST, OCHRE, SLATE], avoid: true, tune: 0.891 }
];

/* ---------------- canvas / viewport ---------------- */
var canvas = document.getElementById('doodle');
var ctx = canvas.getContext('2d');
var viewW = 800, viewH = 800, DPR = 1;

function isPhone() {
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen && window.screen.width) {
    sw = window.screen.width; sh = window.screen.height;
    return Math.min(sw, sh) < 700;
  }
  return viewH > viewW * 1.15; // aspect fallback only
}
function fit() {
  var w = 0, h = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    w = window.visualViewport.width; h = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    w = window.innerWidth; h = window.innerHeight;
  }
  if (!w || !h) { w = 800; h = 800; }
  viewW = w; viewH = h;
  DPR = 1;
  if (typeof window !== 'undefined' && window.devicePixelRatio) {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
  }
  canvas.width = Math.round(viewW * DPR);
  canvas.height = Math.round(viewH * DPR);
}
fit();
var PHONE = isPhone();
var AGENT_COUNT = PHONE ? 70 : 100;

/* ---------------- state ---------------- */
var simT = 0;              // sim time in seconds
var stepCount = 0;
var generation = 0;
var stageStartT = 0;
var lastStageIdx = 0;
var lastCycleIdx = 0;
var agents = [];
var segments = [];         // walked trail segments, birth order
var segHead = 0;           // culling pointer into segments
var blooms = [];           // intersection flashes {x,y,t}
var walls = [];            // drag walls {segs:[[x1,y1,x2,y2]...], deathT}
var events = [];           // recorded interaction events {step, kind, x, y}
var pendingTap = null;     // {step, x, y} waiting out the double-tap window
var hash = new Map();      // cellKey -> Set of segments

function cellKey(cx, cy) {
  cx = ((cx % GRID) + GRID) % GRID;
  cy = ((cy % GRID) + GRID) % GRID;
  return cx + cy * 4096;
}
function hashAdd(seg) {
  var k = cellKey(Math.floor(seg.mx / CELL), Math.floor(seg.my / CELL));
  seg.key = k;
  var s = hash.get(k);
  if (!s) { s = new Set(); hash.set(k, s); }
  s.add(seg);
}
function hashRemove(seg) {
  var s = hash.get(seg.key);
  if (s) { s.delete(seg); if (s.size === 0) hash.delete(seg.key); }
}
function forSegsNear(x, y, fn) {
  var cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
  var done = false;
  for (var i = -1; i <= 1 && !done; i++) {
    for (var j = -1; j <= 1 && !done; j++) {
      var s = hash.get(cellKey(cx + i, cy + j));
      if (!s) continue;
      s.forEach(function (seg) {
        if (!done && fn(seg)) done = true;
      });
    }
  }
  return done;
}

/* ---------------- geometry ---------------- */
function segInt(ax, ay, bx, by, cx, cy, dx, dy) {
  var d = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx);
  if (d === 0) return null;
  var t = ((cx - ax) * (dy - cy) - (cy - ay) * (dx - cx)) / d;
  var u = ((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) / d;
  if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
    return { x: ax + t * (bx - ax), y: ay + t * (by - ay) };
  }
  return null;
}
function wrap(v) {
  v = v % WORLD;
  return v < 0 ? v + WORLD : v;
}
function torusDelta(a, b) { // shortest signed delta from a to b on the torus
  var d = b - a;
  if (d > WORLD / 2) d -= WORLD;
  if (d < -WORLD / 2) d += WORLD;
  return d;
}

/* ---------------- agents ---------------- */
function stageIdxAt(t) { return Math.floor((t - stageStartT) / 180) % 3; }
function cycleIdxAt(t) { return Math.floor((t - stageStartT) / 540); }

function spawnAgents(gen) {
  var rng = mulberry32(BASE_SEED + gen * 7919);
  var stage = STAGES[stageIdxAt(simT)];
  var list = [];
  for (var i = 0; i < AGENT_COUNT; i++) {
    var edge = Math.floor(rng() * 4);
    var along = rng() * WORLD;
    var x, y, inward;
    if (edge === 0) { x = along; y = 2; inward = Math.PI / 2; }
    else if (edge === 1) { x = WORLD - 2; y = along; inward = Math.PI; }
    else if (edge === 2) { x = along; y = WORLD - 2; inward = -Math.PI / 2; }
    else { x = 2; y = along; inward = 0; }
    var heading = inward + (rng() - 0.5) * 0.5; // biased deep inward: seeds the center
    if (rng() < 0.65) { // snap to a compass/diagonal bearing: axis variety
      heading = Math.round(heading / (Math.PI / 4)) * (Math.PI / 4) + (rng() - 0.5) * 0.1;
    }
    var palIdx = Math.floor(rng() * 3);
    var col = stage.pal[palIdx].slice();
    list.push({
      birth: i, x: x, y: y, heading: heading,
      speed: 22 + rng() * 8,
      recX: x, recY: y,
      colR: col[0], colG: col[1], colB: col[2],
      fromR: col[0], fromG: col[1], fromB: col[2],
      toR: col[0], toG: col[1], toB: col[2], lerpStart: -100,
      coolUntil: 0, frozenUntil: 0, dead: false
    });
  }
  return list;
}

function retargetColors(stage, rng) {
  for (var i = 0; i < agents.length; i++) {
    var a = agents[i];
    a.fromR = a.colR; a.fromG = a.colG; a.fromB = a.colB;
    var c = stage.pal[Math.floor(rng() * 3)];
    a.toR = c[0]; a.toG = c[1]; a.toB = c[2];
    a.lerpStart = simT;
  }
}
function agentColor(a) {
  var p = (simT - a.lerpStart) / 10; // 10 s palette crossfade
  if (p >= 1) { a.colR = a.toR; a.colG = a.toG; a.colB = a.toB; return; }
  if (p < 0) p = 0;
  var e = p * p * (3 - 2 * p);
  a.colR = a.fromR + (a.toR - a.fromR) * e;
  a.colG = a.fromG + (a.toG - a.fromG) * e;
  a.colB = a.fromB + (a.toB - a.fromB) * e;
}

/* ---------------- audio (lazy, guarded) ---------------- */
var AC = null, tickTimes = [];
function ensureAudio() {
  if (AC) { if (AC.resume) AC.resume(); return; }
  var Ctor = null;
  if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
  else if (typeof webkitAudioContext !== 'undefined') Ctor = webkitAudioContext;
  if (!Ctor) return;
  try { AC = new Ctor(); } catch (e) { AC = null; }
}
function playTick(heading, tune) {
  if (!AC) return;
  while (tickTimes.length && tickTimes[0] < simT - 1) tickTimes.shift();
  if (tickTimes.length >= 8) return; // sparse: at most 8 ticks per second
  tickTimes.push(simT);
  try {
    var deg = ((heading * 180 / Math.PI) % 360 + 360) % 360;
    var f = (240 + deg / 360 * 520) * tune;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    var now = AC.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.06, now + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
    o.connect(g); g.connect(AC.destination);
    o.start(now); o.stop(now + 0.09);
  } catch (e) { /* audio is decoration only */ }
}
function playStruck(tune) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; o.frequency.value = 98 * tune;
    var now = AC.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.12, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
    o.connect(g); g.connect(AC.destination);
    o.start(now); o.stop(now + 0.75);
  } catch (e) { /* ignore */ }
}

/* ---------------- the score ---------------- */
function applyCrossing(a, other, px, py) {
  var stage = STAGES[stageIdxAt(simT)];
  // younger turns left, older turns right (seniority = birth order)
  var younger = a.birth > other.birth ? a : other;
  var older = younger === a ? other : a;
  younger.heading -= stage.turn;
  older.heading += stage.turn;
  // After a turn an agent runs straight for ~3.2 s (~83 units): the cooldown
  // sets the city-block scale and lets agents escape tight trail pockets.
  a.coolUntil = simT + 3.2;
  other.coolUntil = simT + 3.2;
  blooms.push({ x: px, y: py, t: simT });
  if (blooms.length > 400) blooms.splice(0, blooms.length - 400);
  playTick(a.heading, stage.tune);
}

function stepAgent(a) {
  if (simT < a.frozenUntil) return; // interrupted: frozen mid-walk
  var stage = STAGES[stageIdxAt(simT)];

  if (stage.avoid) { // stage 3: steer slightly off other agents' fresh trails
    var rx = 0, ry = 0, found = false;
    forSegsNear(a.x, a.y, function (s) {
      if (s.agent === a || simT - s.t > 6) return false;
      var dx = torusDelta(s.mx, a.x), dy = torusDelta(s.my, a.y);
      var d2 = dx * dx + dy * dy;
      if (d2 > 1 && d2 < 900) { rx += dx / d2; ry += dy / d2; found = true; }
      return false;
    });
    if (found) {
      var hx = Math.cos(a.heading), hy = Math.sin(a.heading);
      var bx = hx + rx * 260, by = hy + ry * 260;
      var want = Math.atan2(by, bx);
      var diff = want - a.heading;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      var maxTurn = 2.2 * DT;
      if (diff > maxTurn) diff = maxTurn;
      if (diff < -maxTurn) diff = -maxTurn;
      a.heading += diff;
    }
  }

  var ox = a.x, oy = a.y;
  var nx = a.x + Math.cos(a.heading) * a.speed * DT;
  var ny = a.y + Math.sin(a.heading) * a.speed * DT;
  var wx = wrap(nx), wy = wrap(ny);
  var wrapped = Math.abs(nx - wx) > 0.001 || Math.abs(ny - wy) > 0.001;
  a.x = wx; a.y = wy;
  if (wrapped) { a.recX = wx; a.recY = wy; return; } // trail breaks at the seam

  // wall bounce (drag disturbance)
  for (var wi = 0; wi < walls.length; wi++) {
    var w = walls[wi];
    if (simT > w.deathT) continue;
    var hit = false;
    for (var si = 0; si < w.segs.length; si++) {
      var sg = w.segs[si];
      var p = segInt(ox, oy, nx, ny, sg[0], sg[1], sg[2], sg[3]);
      if (p) {
        var ex = sg[2] - sg[0], ey = sg[3] - sg[1];
        var el = Math.sqrt(ex * ex + ey * ey) || 1;
        ex /= el; ey /= el;
        var nnx = -ey, nny = ex; // wall normal
        var dx = Math.cos(a.heading), dy = Math.sin(a.heading);
        var dot = dx * nnx + dy * nny;
        dx -= 2 * dot * nnx; dy -= 2 * dot * nny;
        a.heading = Math.atan2(dy, dx);
        a.x = wrap(p.x + nnx * (dot > 0 ? -0.7 : 0.7));
        a.y = wrap(p.y + nny * (dot > 0 ? -0.7 : 0.7));
        hit = true;
        break;
      }
    }
    if (hit) { a.recX = a.x; a.recY = a.y; return; }
  }

  // crossing: my walked step vs other agents' recorded trails
  if (simT >= a.coolUntil) {
    var crossed = false;
    forSegsNear((ox + nx) / 2, (oy + ny) / 2, function (s) {
      if (s.agent === a) return false;
      if (simT - s.t < 0.25) return false; // not the segment at the other's head
      if (simT >= s.agent.coolUntil || s.agent === a) {
        var p = segInt(ox, oy, nx, ny, s.x1, s.y1, s.x2, s.y2);
        if (p) { applyCrossing(a, s.agent, p.x, p.y); crossed = true; return true; }
      }
      return false;
    });
    if (crossed) { /* heading changed; position already advanced */ }
  }

  // record the walked path
  if ((stepCount + a.birth) % REC_EVERY === 0) {
    var seg = {
      x1: a.recX, y1: a.recY, x2: a.x, y2: a.y,
      mx: (a.recX + a.x) / 2, my: (a.recY + a.y) / 2,
      t: simT, r: a.colR, g: a.colG, b: a.colB,
      agent: a, forceFade: -1, key: 0
    };
    // skip degenerate or seam-crossing segments
    var ddx = Math.abs(seg.x2 - seg.x1), ddy = Math.abs(seg.y2 - seg.y1);
    if ((ddx > 0.01 || ddy > 0.01) && ddx < 100 && ddy < 100) {
      segments.push(seg);
      hashAdd(seg);
    }
    a.recX = a.x; a.recY = a.y;
  }
}

function cullSegments() {
  while (segHead < segments.length) {
    var s = segments[segHead];
    var dead = simT - s.t > TRAIL_FADE || (s.forceFade >= 0 && simT > s.forceFade);
    if (!dead) break;
    hashRemove(s);
    segHead++;
  }
  if (segHead > 4000 && segHead * 2 > segments.length) {
    segments.splice(0, segHead);
    segHead = 0;
  }
  while (blooms.length && simT - blooms[0].t > 2) blooms.shift();
  for (var i = walls.length - 1; i >= 0; i--) {
    if (simT > walls[i].deathT + 1) walls.splice(i, 1);
  }
}

/* ---------------- events (recorded, consumed in step order) ---------------- */
function doFreeze(x, y) {
  var best = [];
  for (var i = 0; i < agents.length; i++) {
    var a = agents[i];
    var dx = torusDelta(a.x, x), dy = torusDelta(a.y, y);
    best.push({ a: a, d: dx * dx + dy * dy });
  }
  best.sort(function (p, q) { return p.d - q.d; });
  for (var j = 0; j < Math.min(3, best.length); j++) {
    best[j].a.frozenUntil = simT + 4; // interruption: 4 s freeze, heading kept
  }
}
function doReseed() {
  generation++;
  for (var i = segHead; i < segments.length; i++) {
    segments[i].forceFade = simT + 2; // old traces wash out over 2 s, no cut
  }
  for (var j = 0; j < agents.length; j++) agents[j].dead = true;
  stageStartT = simT;
  lastStageIdx = 0;
  lastCycleIdx = 0;
  agents = spawnAgents(generation);
  blooms.length = 0;
}
function consumeEvents() {
  for (var i = events.length - 1; i >= 0; i--) {
    if (events[i].step <= stepCount) {
      var ev = events[i];
      events.splice(i, 1);
      if (ev.kind === 'freeze') doFreeze(ev.x, ev.y);
      else if (ev.kind === 'reseed') doReseed();
      else if (ev.kind === 'wall') walls.push(ev.wall);
    }
  }
  // a tap that survived the double-tap window becomes a freeze
  if (pendingTap && stepCount >= pendingTap.step + 42) {
    doFreeze(pendingTap.x, pendingTap.y);
    pendingTap = null;
  }
}

function step() {
  consumeEvents();
  var sIdx = stageIdxAt(simT);
  if (sIdx !== lastStageIdx) { // the score advances
    lastStageIdx = sIdx;
    var rng = mulberry32(BASE_SEED + generation * 131 + Math.floor((simT - stageStartT) / 180) * 17);
    retargetColors(STAGES[sIdx], rng);
    playStruck(STAGES[sIdx].tune);
  }
  var cIdx = cycleIdxAt(simT);
  if (cIdx !== lastCycleIdx) { // full cycle repeats with a new seeded rotation
    lastCycleIdx = cIdx;
    var rr = mulberry32(BASE_SEED + generation * 733 + cIdx * 29);
    var rot = (rr() - 0.5) * Math.PI / 6;
    for (var i = 0; i < agents.length; i++) agents[i].heading += rot;
  }
  for (var j = 0; j < agents.length; j++) {
    agentColor(agents[j]);
    stepAgent(agents[j]);
  }
  cullSegments();
  stepCount++;
  simT = stepCount * DT;
}

/* ---------------- draw ---------------- */
function draw() {
  canvas.style.width = viewW + 'px';
  canvas.style.height = viewH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0E0F12';
  ctx.fillRect(0, 0, viewW, viewH);
  var kx = viewW / WORLD, ky = viewH / WORLD;
  var lw = Math.max(1, Math.min(viewW, viewH) / 850);
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';

  // trails, bucketed by quantized color + alpha for fast stroking
  var buckets = new Map();
  for (var i = segHead; i < segments.length; i++) {
    var s = segments[i];
    var age = simT - s.t;
    var alpha = 0.85 * (1 - age / TRAIL_FADE);
    if (s.forceFade >= 0) {
      var ff = 1 - (simT - (s.forceFade - 2)) / 2;
      if (ff < alpha) alpha = ff;
    }
    if (alpha <= 0.01) continue;
    if (simT < s.agent.frozenUntil) alpha = Math.min(1, alpha * 1.7); // frozen trails brighten
    var ab = Math.round(alpha * 20);
    var key = ((s.r >> 4) << 12) | ((s.g >> 4) << 8) | ((s.b >> 4) << 4) | ab;
    var path = buckets.get(key);
    if (!path) {
      path = { r: s.r, g: s.g, b: s.b, a: ab / 20, pts: [] };
      buckets.set(key, path);
    }
    path.pts.push(s.x1 * kx, s.y1 * ky, s.x2 * kx, s.y2 * ky);
  }
  buckets.forEach(function (path) {
    ctx.strokeStyle = 'rgba(' + (path.r | 0) + ',' + (path.g | 0) + ',' + (path.b | 0) + ',' + path.a.toFixed(3) + ')';
    ctx.beginPath();
    var p = path.pts;
    for (var i = 0; i < p.length; i += 4) {
      ctx.moveTo(p[i], p[i + 1]);
      ctx.lineTo(p[i + 2], p[i + 3]);
    }
    ctx.stroke();
  });

  // live walls (drag disturbance), drawn faintly in chalk
  ctx.strokeStyle = 'rgba(242,239,230,0.28)';
  ctx.lineWidth = lw * 1.6;
  for (var wi = 0; wi < walls.length; wi++) {
    var w = walls[wi];
    if (simT > w.deathT) continue;
    ctx.beginPath();
    for (var si = 0; si < w.segs.length; si++) {
      ctx.moveTo(w.segs[si][0] * kx, w.segs[si][1] * ky);
      ctx.lineTo(w.segs[si][2] * kx, w.segs[si][3] * ky);
    }
    ctx.stroke();
  }
  ctx.lineWidth = lw;

  // intersection blooms: 1 px white flashes, gone in 2 s
  for (var bi = 0; bi < blooms.length; bi++) {
    var b = blooms[bi];
    var ba = 1 - (simT - b.t) / 2;
    if (ba <= 0) continue;
    ctx.fillStyle = 'rgba(255,255,255,' + ba.toFixed(3) + ')';
    ctx.fillRect(b.x * kx - lw * 0.6, b.y * ky - lw * 0.6, lw * 1.2, lw * 1.2);
  }

  // agent heads: brighter squares at the ends of the trails
  for (var ai = 0; ai < agents.length; ai++) {
    var a = agents[ai];
    ctx.fillStyle = 'rgb(' + (a.colR | 0) + ',' + (a.colG | 0) + ',' + (a.colB | 0) + ')';
    var hs = (simT < a.frozenUntil) ? lw * 2.6 : lw * 1.9;
    ctx.fillRect(a.x * kx - hs / 2, a.y * ky - hs / 2, hs, hs);
  }
}

/* ---------------- interaction ---------------- */
function toWorld(cx, cy) {
  var rx = 0, ry = 0;
  if (canvas.getBoundingClientRect) {
    var r = canvas.getBoundingClientRect();
    rx = r.left; ry = r.top;
  }
  return { x: (cx - rx) / viewW * WORLD, y: (cy - ry) / viewH * WORLD };
}
var pDown = null, dragPts = null, lastTapStep = -1000, lastTapPos = null;

function onDown(e) {
  ensureAudio();
  var p = toWorld(e.clientX, e.clientY);
  pDown = { x: p.x, y: p.y, step: stepCount };
  dragPts = [p];
}
function onMove(e) {
  if (!pDown || !dragPts) return;
  var p = toWorld(e.clientX, e.clientY);
  var last = dragPts[dragPts.length - 1];
  var dx = p.x - last.x, dy = p.y - last.y;
  if (dx * dx + dy * dy > 64) dragPts.push(p); // wall points every ~8 units
}
function onUp(e) {
  if (!pDown) return;
  var p = toWorld(e.clientX, e.clientY);
  var moved = Math.sqrt((p.x - pDown.x) * (p.x - pDown.x) + (p.y - pDown.y) * (p.y - pDown.y));
  if (dragPts && dragPts.length > 2 && moved > 24) {
    // a drag lays a temporary wall that lives 20 s of sim time
    var segs = [];
    for (var i = 1; i < dragPts.length; i++) {
      segs.push([dragPts[i - 1].x, dragPts[i - 1].y, dragPts[i].x, dragPts[i].y]);
    }
    segs.push([dragPts[dragPts.length - 1].x, dragPts[dragPts.length - 1].y, p.x, p.y]);
    events.push({ step: stepCount, kind: 'wall', wall: { segs: segs, deathT: simT + 20 } });
  } else if (moved <= 24) {
    // tap / double-tap
    if (stepCount - lastTapStep < 42 && lastTapPos) {
      pendingTap = null; // second tap cancels the pending freeze
      events.push({ step: stepCount, kind: 'reseed' });
      lastTapStep = -1000; lastTapPos = null;
    } else {
      pendingTap = { step: stepCount, x: p.x, y: p.y };
      lastTapStep = stepCount; lastTapPos = p;
    }
  }
  pDown = null; dragPts = null;
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { pDown = null; dragPts = null; });
}
function onResize() { fit(); draw(); }
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('resize', onResize);
}
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', onResize);
}

/* ---------------- run: pre-roll, frame one, live loop ---------------- */
agents = spawnAgents(0);
for (var s = 0; s < PREROLL; s++) step();
draw();

if (typeof requestAnimationFrame === 'function') {
  var lastTs = -1, acc = 0;
  var frame = function (ts) {
    if (lastTs < 0) lastTs = ts;
    var el = (ts - lastTs) / 1000;
    lastTs = ts;
    if (el > 0.1) el = 0.1; // cap: never spiral after a stall
    acc += el;
    var n = Math.floor(acc / DT);
    if (n > 30) n = 30;
    acc -= n * DT;
    for (var i = 0; i < n; i++) step();
    draw();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
</script>
