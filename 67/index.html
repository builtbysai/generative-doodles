<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№67 · Ink Circuitry</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ede3; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(20,20,20,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to pinch the flow</div>
<script>
'use strict';

const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi; const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf); const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y){ return vnoise(x,y)*0.6+vnoise(x*2.13+5.2,y*2.13+1.3)*0.28+vnoise(x*4.7+9.1,y*4.7+3.7)*0.12; }
let pointer=null, pointerDown=false;
canvas.addEventListener('pointerdown',e=>{ pointer={x:e.clientX,y:e.clientY}; pointerDown=true; if(onDown) onDown(e.clientX,e.clientY); });
canvas.addEventListener('pointermove',e=>{ if(pointer){ pointer.x=e.clientX; pointer.y=e.clientY; } if(onMove) onMove(e.clientX,e.clientY,pointerDown); });
function endP(){ pointerDown=false; if(onUp) onUp(); }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

let onDown=null,onMove=null,onUp=null;
let pinch=null, pinchHome=null, pinchAt=0;
onDown=function(x,y){ pinch={x:x,y:y}; pinchHome={x:x,y:y}; pinchAt=performance.now(); };
onMove=function(x,y,down){ if(down&&pinch){ pinch.x=x; pinch.y=y; pinchAt=performance.now(); } };
onUp=function(){ pinchAt=performance.now(); };
const TRACES=48;
function traceColor(i){ const r=mulberry(6700)(); let rnd=mulberry(6700+i*13)(); return (i%5===4)?'#b5542d':'#141414'; }
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#f2ede3'; ctx.fillRect(0,0,w,h);
  const phone=isPhone(); let ox,oy,fw,fh;
  if(phone){ ox=0; oy=0; fw=w; fh=h; } else { const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; fw=S; fh=S; }
  const t=nowMs/1000; const z=t*0.033;
  if(pinch&&!pointerDown&&performance.now()-pinchAt>0){ /* drift home */ }
  ctx.lineWidth=1.2; ctx.lineJoin='round';
  const steps=130;
  for(let i=0;i<TRACES;i++){
    const y0=oy+fh*(i+0.5)/TRACES;
    let x=ox-fw*0.02, y=y0;
    ctx.strokeStyle=traceColor(i); ctx.beginPath(); ctx.moveTo(x,y);
    for(let s=0;s<steps;s++){
      let ang=(fbm(x*0.0035, y*0.0035+z*3)-0.5)*2.4;
      // channel pinches: three seeded pinch centers in field space
      if(pinch){ const dx=pinch.x-x, dy=pinch.y-y; const d=Math.sqrt(dx*dx+dy*dy); if(d<fw*0.30){ ang+= Math.atan2(dy,dx)*0.0; y+=(dy)*0.002*(1-d/(fw*0.30)); } }
      x+= (fw*1.04)/steps; y+= Math.sin(ang)* (fh*0.006);
      y += (fbm(x*0.001,y0*0.01+z)-0.5)*0.6;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(12000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));

</script>
</body>
</html>
