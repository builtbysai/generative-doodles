<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind Organ Sessions</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0A09; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0B0A09';
var BRONZE = '#6B4E2E';
var BRONZE_LIGHT = '#8A6A3C';
var BRONZE_DARK = '#3D2C1A';
var SHADOW_GREY = '#3A3A38';
var SHADOW_GREY_LIGHT = '#555550';
var CHALK = '#D8D2C4';
var PLATE = '#171310';
var PLATE_LINE = 'rgba(138,106,60,0.7)';
var TITLE_INK = '#D8D2C4';
var HINT_INK = '#9A8F7A';
var FRAME_T = 1500.0;
var MARK_INTERVAL = 600.0;
var MARK_BASE = 3;
var MARK_CAP = 22;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1750);
var phaseT = FRAME_T;
/* ---- the machine: three vane rings plus a hub, turning on
   incommensurate periods. The periods are hours-scale ratios
   compressed to watchable drift: 997, 631, 401 and 271 seconds,
   so no two rings ever line up twice the same way. ---- */
var RINGS = [
  { n: 24, r0: 0.66, r1: 0.97, period: 997, dir: 1,  w: 0.055, base: 0.00, fill: BRONZE,       edge: BRONZE_DARK },
  { n: 16, r0: 0.38, r1: 0.62, period: 631, dir: -1, w: 0.075, base: 0.31, fill: BRONZE_LIGHT, edge: BRONZE },
  { n: 10, r0: 0.16, r1: 0.34, period: 401, dir: 1,  w: 0.110, base: 0.62, fill: SHADOW_GREY,  edge: SHADOW_GREY_LIGHT }
];
var HUB = { n: 6, r: 0.13, period: 271, dir: -1, base: 0.17 };
var MACHINE_CX = 0.56, MACHINE_CY = 0.54, MACHINE_R = 0.34;
/* per-vane seeded shade so the ring reads as separate blades */
var VANE_SHADE = [];
(function () {
  var i, j;
  for (i = 0; i < RINGS.length; i++) {
    VANE_SHADE.push([]);
    for (j = 0; j < RINGS[i].n; j++) VANE_SHADE[i].push(0.55 + rng() * 0.45);
  }
})();
function machineCenter() {
  return { x: MACHINE_CX * VW, y: MACHINE_CY * VH, r: MACHINE_R * Math.min(VW, VH) };
}
/* ---- session marks: pencil-like chalk strokes in a quiet column
   at the left edge. Each mark has seeded length and tilt jitter.
   Three marks are pre-rolled and one more is added every 600 s of
   piece time, so frame one shows five and the column keeps growing
   across a long session. ---- */
var MARKS = [];
(function () {
  var i;
  for (i = 0; i < MARK_CAP; i++) {
    MARKS.push({
      len: 0.55 + rng() * 0.9,
      tilt: (rng() - 0.5) * 0.10,
      a: 0.30 + rng() * 0.35,
      w: 0.9 + rng() * 0.9
    });
  }
})();
function markCountAt(t) {
  return Math.min(MARK_BASE + Math.floor(t / MARK_INTERVAL), MARK_CAP);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function drawRingCircle(cx, cy, r, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.stroke();
}
function drawVane(cx, cy, ang, r0, r1, w, shade, fill, edge) {
  /* a vent blade: a tapered quad pitched off the radial line,
     drawn in a rotated frame so every blade keeps its skew */
  var x0 = cx + Math.cos(ang) * r0, y0 = cy + Math.sin(ang) * r0;
  var x1 = cx + Math.cos(ang) * r1, y1 = cy + Math.sin(ang) * r1;
  var px = -Math.sin(ang), py = Math.cos(ang);
  var hw0 = w * 0.5, hw1 = w * 0.28;
  var pitch = w * 0.55;
  ctx.fillStyle = rgba(fill, shade);
  ctx.strokeStyle = rgba(edge, 0.85);
  ctx.lineWidth = Math.max(w * 0.06, 0.7);
  ctx.beginPath();
  ctx.moveTo(x0 - px * hw0, y0 - py * hw0);
  ctx.lineTo(x1 - px * hw1 + px * pitch, y1 - py * hw1 + py * pitch);
  ctx.lineTo(x1 + px * hw1 + px * pitch, y1 + py * hw1 + py * pitch);
  ctx.lineTo(x0 + px * hw0, y0 + py * hw0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}
function drawMachine(t) {
  var mc = machineCenter();
  var s = Math.min(VW, VH);
  var R = mc.r, cx = mc.x, cy = mc.y;
  var i, j, ring, ang;
  /* faint housing: two thin circles and a soft outer glow */
  var glow = ctx.createRadialGradient(cx, cy, R * 0.55, cx, cy, R * 1.12);
  glow.addColorStop(0, rgba(BRONZE, 0.10));
  glow.addColorStop(0.8, rgba(BRONZE, 0.05));
  glow.addColorStop(1, rgba(BRONZE, 0));
  ctx.fillStyle = glow;
  ctx.fillRect(cx - R * 1.12, cy - R * 1.12, R * 2.24, R * 2.24);
  drawRingCircle(cx, cy, R * 1.0, rgba(SHADOW_GREY_LIGHT, 0.55), Math.max(s * 0.004, 1));
  drawRingCircle(cx, cy, R * 0.645, rgba(SHADOW_GREY_LIGHT, 0.35), Math.max(s * 0.0025, 0.8));
  drawRingCircle(cx, cy, R * 0.36, rgba(SHADOW_GREY_LIGHT, 0.35), Math.max(s * 0.0025, 0.8));
  /* tick marks between the housing and the outer ring */
  for (i = 0; i < 48; i++) {
    ang = (i / 48) * TAU;
    var tx0 = cx + Math.cos(ang) * R * 0.985, ty0 = cy + Math.sin(ang) * R * 0.985;
    var tx1 = cx + Math.cos(ang) * R * 0.965, ty1 = cy + Math.sin(ang) * R * 0.965;
    ctx.strokeStyle = rgba(SHADOW_GREY_LIGHT, i % 4 === 0 ? 0.5 : 0.22);
    ctx.lineWidth = Math.max(s * 0.002, 0.7);
    ctx.beginPath();
    ctx.moveTo(tx0, ty0);
    ctx.lineTo(tx1, ty1);
    ctx.stroke();
  }
  /* the three vane rings, outer to inner */
  for (i = 0; i < RINGS.length; i++) {
    ring = RINGS[i];
    for (j = 0; j < ring.n; j++) {
      ang = ring.base + ring.dir * TAU * (t / ring.period) + (j / ring.n) * TAU;
      drawVane(cx, cy, ang, ring.r0 * R, ring.r1 * R, ring.w * R,
        VANE_SHADE[i][j], ring.fill, ring.edge);
    }
  }
  /* hub: small bronze disc with six slow spokes */
  ctx.fillStyle = BRONZE_DARK;
  ctx.beginPath();
  ctx.moveTo(cx + HUB.r * R, cy);
  ctx.arc(cx, cy, HUB.r * R, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(BRONZE_LIGHT, 0.8);
  ctx.lineWidth = Math.max(s * 0.003, 0.9);
  ctx.beginPath();
  ctx.moveTo(cx + HUB.r * R, cy);
  ctx.arc(cx, cy, HUB.r * R, 0, TAU);
  ctx.stroke();
  for (i = 0; i < HUB.n; i++) {
    ang = HUB.base + HUB.dir * TAU * (t / HUB.period) + (i / HUB.n) * TAU;
    var hx0 = cx + Math.cos(ang) * R * 0.03, hy0 = cy + Math.sin(ang) * R * 0.03;
    var hx1 = cx + Math.cos(ang) * R * 0.115, hy1 = cy + Math.sin(ang) * R * 0.115;
    ctx.strokeStyle = rgba(BRONZE_LIGHT, 0.75);
    ctx.lineWidth = Math.max(s * 0.004, 1);
    ctx.beginPath();
    ctx.moveTo(hx0, hy0);
    ctx.lineTo(hx1, hy1);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(CHALK, 0.5);
  ctx.beginPath();
  ctx.moveTo(cx + Math.max(s * 0.005, 1.4), cy);
  ctx.arc(cx, cy, Math.max(s * 0.005, 1.4), 0, TAU);
  ctx.fill();
}
function drawMarks(t) {
  var n = markCountAt(t);
  var s = Math.min(VW, VH);
  var x = 0.045 * VW;
  var y0 = 0.20 * VH;
  var gap = Math.max(s * 0.032, 22);
  var i, m, len, y;
  for (i = 0; i < n; i++) {
    m = MARKS[i];
    len = m.len * Math.max(s * 0.035, 18);
    y = y0 + i * gap;
    ctx.strokeStyle = rgba(CHALK, m.a);
    ctx.lineWidth = m.w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len * Math.cos(m.tilt), y + len * Math.sin(m.tilt));
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Wind Organ Sessions').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Wind Organ Sessions').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 27').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Wind Organ Sessions', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 27', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawMachine(phaseT);
  drawMarks(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    markCountAt: function (t) { return markCountAt(t); },
    vanePeriods: function () {
      return RINGS.map(function (r) { return r.period; }).concat([HUB.period]);
    },
    vaneAngles: function (t) {
      var out = [], i, j, ring;
      for (i = 0; i < RINGS.length; i++) {
        ring = RINGS[i];
        for (j = 0; j < ring.n; j++) {
          out.push(ring.base + ring.dir * TAU * (t / ring.period) + (j / ring.n) * TAU);
        }
      }
      return out;
    },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 1500 s, five session marks already on the wall ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
