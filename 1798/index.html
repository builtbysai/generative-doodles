<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Audition Portraits</title>
<style>
html, body { margin: 0; padding: 0; background: #0d0b09; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0d0b09';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, hat figure settled at spot 2 mid head-tilt, mic figure mid-entrance */
var CYCLE = 240.0; /* seconds per full rotation of listeners */
var SIL = '#070605'; /* near-black silhouette */
var RIM_COL = 'rgba(240,200,130,0.60)'; /* pale amber rim light */
var PLATE_FILL = '#12100d';
var PLATE_LINE = 'rgba(232,226,210,0.25)';
var PLATE_INK = '#E8E2D2';
var HINT_INK = '#E8E2D2';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(p) { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); }
/* bump: rise a->b, hold b->c, fall c->d, closed form */
function bump(t, a, b, c, d) {
  if (t < a || t > d) return 0;
  if (t < b) return smooth((t - a) / (b - a));
  if (t <= c) return 1;
  return 1 - smooth((t - c) / (d - c));
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* stage rect */
var FLOORY = 0, HF = 0; /* floor line y, figure height */
var DOOR = { x: 0, w: 0, top: 0 }; /* doorway rect */
var SPOTS = [0.40, 0.58, 0.76]; /* listening spots, fractions of stage width */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
  FLOORY = F.y + 0.80 * F.h;
  HF = 0.40 * F.h;
  DOOR = { x: F.x + 0.015 * F.w, w: 0.09 * F.w, top: F.y + 0.26 * F.h };
}
/* ---- fixed arrival schedule, seconds within one 240 s cycle ----
   Hat:    enters 8, walks 14 s to spot 2, listens, exits 108-128.
   Mic:    enters 54, walks 16 s to spot 1, listens, exits 168-188.
   Piano:  enters 140, walks 14 s to spot 3, listens, exits 216-232.
   Never more than two figures present. At t = 60: hat is settled at
   spot 2 mid head-tilt; mic is 6 s into its 16 s walk, mid-entrance. */
var FIGS = [
  { type: 'hat', spot: SPOTS[1], t0: 8, walk: 14, exit0: 108, exitDur: 20,
    tilts: [ { a: 50, b: 56, c: 66, d: 72, amp: 0.32 }, { a: 84, b: 90, c: 96, d: 102, amp: -0.22 } ] },
  { type: 'mic', spot: SPOTS[0], t0: 54, walk: 16, exit0: 168, exitDur: 20,
    tilts: [ { a: 96, b: 102, c: 110, d: 116, amp: -0.25 }, { a: 132, b: 138, c: 144, d: 150, amp: 0.22 } ] },
  { type: 'piano', spot: SPOTS[2], t0: 140, walk: 14, exit0: 216, exitDur: 16,
    tilts: [ { a: 168, b: 174, c: 180, d: 186, amp: 0.26 }, { a: 192, b: 198, c: 202, d: 208, amp: -0.20 } ] }
];
function figState(fg, t) {
  var tt = ((t % CYCLE) + CYCLE) % CYCLE;
  var doorX = DOOR.x + DOOR.w * 0.5;
  var spotX = F.x + fg.spot * F.w;
  var st = { present: false, x: spotX, tilt: 0, swing: 0, bob: 0, walking: false };
  var p, i;
  if (tt >= fg.t0 && tt < fg.t0 + fg.walk) {
    p = (tt - fg.t0) / fg.walk;
    st.present = true; st.walking = true;
    st.x = doorX + (spotX - doorX) * smooth(p);
    st.swing = Math.sin(p * Math.PI * 5) * 0.38;
    st.bob = Math.abs(Math.sin(p * Math.PI * 5)) * 0.012 * HF;
  } else if (tt >= fg.t0 + fg.walk && tt < fg.exit0) {
    st.present = true;
    for (i = 0; i < fg.tilts.length; i++) {
      var tl = fg.tilts[i];
      st.tilt += tl.amp * bump(tt, tl.a, tl.b, tl.c, tl.d);
    }
  } else if (tt >= fg.exit0 && tt < fg.exit0 + fg.exitDur) {
    p = (tt - fg.exit0) / fg.exitDur;
    st.present = true; st.walking = true;
    st.x = spotX + (doorX - spotX) * smooth(p);
    st.swing = Math.sin(p * Math.PI * 5) * 0.38;
    st.bob = Math.abs(Math.sin(p * Math.PI * 5)) * 0.012 * HF;
  }
  return st;
}
/* ---- silhouette rig ----
   Drawn twice: once shifted right by RIM in pale amber, once at origin
   in near-black, so a thin amber sliver shows on the right edge only,
   the lit edge facing the sound off-frame right. Figures face right in
   profile and never face the viewer. All parts are drawn in one color. */
function drawRig(type, st, C) {
  var H = HF;
  var hipY = -0.52 * H, shY = -0.88 * H, neckY = -0.92 * H;
  var headR = 0.068 * H, headCY = -0.99 * H;
  var sw = st.swing;
  ctx.fillStyle = C;
  ctx.strokeStyle = C;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  function limb(x1, y1, x2, y2, x3, y3, w) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineWidth = w;
    ctx.stroke();
  }
  /* legs: two tapered strokes, swinging while walking */
  limb(-0.03 * H, hipY, -0.035 * H + Math.sin(sw) * 0.15 * H, -0.26 * H, -0.04 * H + Math.sin(sw) * 0.16 * H, 0, 0.045 * H);
  limb(0.03 * H, hipY, 0.035 * H - Math.sin(sw) * 0.15 * H, -0.26 * H, 0.04 * H - Math.sin(sw) * 0.16 * H, 0, 0.045 * H);
  /* torso: long coat for the hat figure, plain torso otherwise */
  ctx.beginPath();
  if (type === 'hat') {
    ctx.moveTo(-0.085 * H, shY);
    ctx.lineTo(0.085 * H, shY);
    ctx.lineTo(0.11 * H, hipY);
    ctx.lineTo(0.13 * H, -0.16 * H);
    ctx.lineTo(-0.13 * H, -0.16 * H);
    ctx.lineTo(-0.11 * H, hipY);
  } else {
    ctx.moveTo(-0.085 * H, shY);
    ctx.lineTo(0.085 * H, shY);
    ctx.lineTo(0.11 * H, hipY);
    ctx.lineTo(-0.11 * H, hipY);
  }
  ctx.closePath();
  ctx.fill();
  /* arms, by figure type */
  if (type === 'hat') {
    /* relaxed at the sides, far arm slightly behind */
    limb(0.045 * H, shY + 0.03 * H, 0.06 * H, -0.60 * H, 0.05 * H, -0.44 * H, 0.038 * H);
    limb(0.075 * H, shY + 0.03 * H, 0.09 * H, -0.60 * H, 0.085 * H, -0.44 * H, 0.038 * H);
  } else if (type === 'mic') {
    /* both arms forward, holding the parabolic dish up like a lantern */
    limb(0.05 * H, shY + 0.03 * H, 0.13 * H, -0.70 * H, 0.17 * H, -0.66 * H, 0.036 * H);
    limb(0.08 * H, shY + 0.03 * H, 0.15 * H, -0.70 * H, 0.18 * H, -0.66 * H, 0.036 * H);
    /* dish handle and dish, facing right */
    ctx.beginPath();
    ctx.moveTo(0.17 * H, -0.66 * H);
    ctx.lineTo(0.24 * H, -0.64 * H);
    ctx.lineWidth = 0.02 * H;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0.27 * H, -0.63 * H, 0.075 * H, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0.27 * H, -0.63 * H, 0.05 * H, 0, TAU);
    ctx.fillStyle = GROUND;
    ctx.fill();
    ctx.fillStyle = C;
  } else if (type === 'piano') {
    /* arms extended forward and down to the keys */
    limb(0.05 * H, shY + 0.03 * H, 0.14 * H, -0.70 * H, 0.22 * H, -0.56 * H, 0.036 * H);
    limb(0.08 * H, shY + 0.03 * H, 0.16 * H, -0.70 * H, 0.23 * H, -0.56 * H, 0.036 * H);
    /* hands at the keys */
    ctx.beginPath();
    ctx.arc(0.225 * H, -0.56 * H, 0.02 * H, 0, TAU);
    ctx.fill();
  }
  /* neck, bridging head and shoulders so the head never floats */
  limb(0.01 * H, -0.93 * H, 0.01 * H, -0.87 * H, 0.01 * H, -0.86 * H, 0.05 * H);
  /* head group: rotates around the neck for the listening tilt */
  ctx.save();
  ctx.translate(0, neckY);
  ctx.rotate(st.tilt);
  ctx.translate(0, -neckY);
  ctx.beginPath();
  ctx.arc(0.02 * H, headCY, headR, 0, TAU);
  ctx.fill();
  if (type === 'hat') {
    /* wide brim and dome */
    ctx.beginPath();
    ctx.ellipse(0.02 * H, headCY - 0.015 * H, 0.072 * H, 0.058 * H, 0, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0.02 * H, headCY + 0.015 * H, 0.13 * H, 0.02 * H, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}
function drawFigure(type, st) {
  var H = HF;
  var x = st.x, fy = FLOORY - st.bob;
  var rim = Math.max(1.2, H * 0.005);
  /* faint warm glow toward the sound, off-frame right */
  var g = ctx.createRadialGradient(x + 0.22 * H, fy - 0.55 * H, 0, x + 0.22 * H, fy - 0.55 * H, 0.55 * H);
  g.addColorStop(0, 'rgba(240,200,130,0.06)');
  g.addColorStop(1, 'rgba(240,200,130,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x + 0.22 * H, fy - 0.55 * H, 0.55 * H, 0, TAU);
  ctx.fill();
  ctx.save();
  ctx.translate(x + rim, fy);
  drawRig(type, st, RIM_COL);
  ctx.restore();
  ctx.save();
  ctx.translate(x, fy);
  drawRig(type, st, SIL);
  ctx.restore();
}
function drawRoom() {
  /* back wall: warm black, faintly lighter at the top */
  var wg = ctx.createLinearGradient(0, F.y, 0, FLOORY);
  wg.addColorStop(0, '#191411');
  wg.addColorStop(1, '#0e0c0a');
  ctx.fillStyle = wg;
  ctx.fillRect(F.x, F.y, F.w, FLOORY - F.y);
  /* floor */
  ctx.fillStyle = '#0f0c09';
  ctx.fillRect(F.x, FLOORY, F.w, F.y + F.h - FLOORY);
  /* faint pool of light on the floor toward the sound */
  var pg = ctx.createRadialGradient(F.x + 0.62 * F.w, FLOORY + 0.06 * F.h, 0, F.x + 0.62 * F.w, FLOORY + 0.06 * F.h, 0.30 * F.w);
  pg.addColorStop(0, 'rgba(240,200,130,0.05)');
  pg.addColorStop(1, 'rgba(240,200,130,0)');
  ctx.fillStyle = pg;
  ctx.fillRect(F.x, FLOORY, F.w, F.y + F.h - FLOORY);
  /* doorway at the left, barely lit from within */
  var dg = ctx.createLinearGradient(0, DOOR.top, 0, FLOORY);
  dg.addColorStop(0, 'rgba(88,64,38,0.50)');
  dg.addColorStop(1, 'rgba(40,28,16,0.25)');
  ctx.fillStyle = dg;
  ctx.fillRect(DOOR.x, DOOR.top, DOOR.w, FLOORY - DOOR.top);
  ctx.strokeStyle = 'rgba(230,190,130,0.18)';
  ctx.lineWidth = 1;
  ctx.strokeRect(DOOR.x + 0.5, DOOR.top + 0.5, DOOR.w - 1, FLOORY - DOOR.top - 1);
  /* floor line */
  ctx.strokeStyle = 'rgba(220,190,140,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(F.x, FLOORY + 0.5);
  ctx.lineTo(F.x + F.w, FLOORY + 0.5);
  ctx.stroke();
  /* three marked listening spots */
  var i;
  for (i = 0; i < SPOTS.length; i++) {
    var sx = F.x + SPOTS[i] * F.w;
    ctx.strokeStyle = 'rgba(230,190,130,0.28)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx - 0.02 * F.w, FLOORY + 0.015 * F.h);
    ctx.lineTo(sx + 0.02 * F.w, FLOORY + 0.015 * F.h);
    ctx.stroke();
  }
  /* piano furniture at spot 3: a low upright, very dim, keys faintly lit */
  var px = F.x + SPOTS[2] * F.w + 0.04 * HF;
  var pw = 0.20 * HF;
  var ptop = FLOORY - 0.56 * HF;
  ctx.fillStyle = '#0c0a08';
  ctx.fillRect(px, ptop, pw, FLOORY - ptop);
  ctx.fillStyle = 'rgba(240,220,180,0.22)';
  ctx.fillRect(px, ptop, pw, Math.max(1.5, 0.012 * HF));
  ctx.strokeStyle = 'rgba(230,190,130,0.14)';
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 0.5, ptop + 0.5, pw - 1, FLOORY - ptop - 1);
}
function drawField(t) {
  drawRoom();
  var i;
  for (i = 0; i < FIGS.length; i++) {
    var st = figState(FIGS[i], t);
    if (st.present) drawFigure(FIGS[i].type, st);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Audition Portraits').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Audition Portraits').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 14').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Audition Portraits', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 14', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawField(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    statesAt: function (t) {
      var out = [], i;
      for (i = 0; i < FIGS.length; i++) {
        var s = figState(FIGS[i], t);
        out.push({ type: FIGS[i].type, present: s.present, x: s.x, tilt: s.tilt });
      }
      return out;
    }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
