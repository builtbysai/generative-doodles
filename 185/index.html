  Object.keys(edgeMap).forEach(function (k) {
    var L = edgeMap[k];
    for (var i = 0; i < L.length; i++) for (var j = 0; j < L.length; j++) {
      if (i !== j) adj[L[i]][L[j]] = 1;
    }
  });
})();
function shellsFrom(root) {
  var dist = tiles.map(function () { return -1; });
  dist[root] = 0;
  var queue = [root], maxD = 0;
  while (queue.length) {
    var cur = queue.shift();
    Object.keys(adj[cur]).forEach(function (n) {
      n = Number(n);
      if (dist[n] < 0) { dist[n] = dist[cur] + 1; if (dist[n] > maxD) maxD = dist[n]; queue.push(n); }
    });
  }
  return { dist: dist, maxD: Math.max(1, maxD) };
}

// ---- variants: distinct crops / orientations of the family --------
var cropCandidates = [];
tiles.forEach(function (t, i) {
  if (Math.sqrt(t.cx * t.cx + t.cy * t.cy) < 5.5) cropCandidates.push(i);
});
var usedVariants = {};
var curVariant = null;
function applyVariant(v) {
  var ct = tiles[v.crop];
  var th = v.rot * Math.PI / 6, co = Math.cos(th), si = Math.sin(th);
  function T(x, y) {
    if (v.flip) x = -x;
    return [co * x - si * y, si * x + co * y];
  }
  var o = T(ct.cx, ct.cy);
  tiles.forEach(function (t) {
    t.disp = t.pts.map(function (p) {
      var q = T(p[0], p[1]);
      return [q[0] - o[0], q[1] - o[1]];
    });
    var c = T(t.cx, t.cy);
    t.dcx = c[0] - o[0]; t.dcy = c[1] - o[1];
  });
  var sh = shellsFrom(v.crop);
  tiles.forEach(function (t, i) {
    var d = sh.dist[i] < 0 ? sh.maxD : sh.dist[i];
    t.round = Math.min(3, Math.floor(d / (sh.maxD + 1) * 4));
  });
  curVariant = v;
}
function pickVariant(r) {
  for (var tries = 0; tries < 60; tries++) {
    var v = {
      crop: cropCandidates[Math.floor(r() * cropCandidates.length)],
      rot: [0, 2, 4, 6, 8, 10][Math.floor(r() * 6)],
      flip: r() < 0.5 ? 1 : 0
    };
    var k = v.crop + '/' + v.rot + '/' + v.flip;
    if (!usedVariants[k]) { usedVariants[k] = 1; return v; }
  }
  var v2 = { crop: cropCandidates[0], rot: 0, flip: 0 };
  usedVariants[v2.crop + '/0/0'] = 1;
  return v2;
}

function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// growth cycle: 4 rounds x 3s blooming, then a 10s held breath; 22s total
var CYCLE = 22, anchor = -16000; // first frame lands in the hold
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var lt = ((now - anchor) / 1000) % CYCLE;
  var breathe = 1 + 0.004 * Math.sin((now / 1000) * Math.PI * 2 / 5);
  var unit = Math.max(W, H) / 30 * breathe;
  var cx0 = W / 2, cy0 = H / 2;
  for (var ti = 0; ti < tiles.length; ti++) {
    var t = tiles[ti];
    var p = (lt - t.round * 3) / 3;
    if (p <= 0) continue;
    if (p > 1) p = 1;
    var ease = 1 - Math.pow(1 - p, 3);
    var sc = 0.55 + 0.45 * ease;
    var tcx = cx0 + t.dcx * unit, tcy = cy0 + t.dcy * unit;
    ctx.globalAlpha = p;
    ctx.beginPath();
    for (var vi = 0; vi < t.disp.length; vi++) {
      var q = t.disp[vi];
      var x = tcx + (q[0] - t.dcx) * unit * sc, y = tcy + (q[1] - t.dcy) * unit * sc;
      if (vi === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = t.col;
    ctx.fill();
    ctx.strokeStyle = GROUND;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

var downAt = 0, downX = 0, downY = 0;
canvas.addEventListener('pointerdown', function (e) { downAt = e.timeStamp; downX = e.clientX; downY = e.clientY; });
canvas.addEventListener('pointerup', function (e) {
  var moved = Math.sqrt((e.clientX - downX) * (e.clientX - downX) + (e.clientY - downY) * (e.clientY - downY));
  if (e.timeStamp - downAt < 400 && moved < 10) {
    seed = (seed * 1103515245 + 12345) >>> 0;
    applyVariant(pickVariant(rng(seed)));
    anchor = e.timeStamp; // regrow from the single central hat
  }
});

applyVariant(pickVariant(rng(seed)));
resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
