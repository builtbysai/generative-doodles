<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Underfloor — №9132</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07090d;}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%;}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,.58) 100%);}
  .cap{position:fixed;left:14px;bottom:12px;color:#cfd6dd;opacity:.45;
    font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif;letter-spacing:.14em;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="cap">№9132 · THE UNDERFLOOR</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x07090d);
scene.fog=new THREE.Fog(0x07090d,9,22);

var camera=new THREE.PerspectiveCamera(50,1,0.1,80);
camera.position.set(0.3,1.7,6.1);
camera.lookAt(0,-0.3,-1.2);

function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  if(camera.aspect<0.8){camera.position.set(0.3,3.4,11.5);camera.fov=58;}
  else{camera.position.set(0.3,1.7,6.1);camera.fov=50;}
  camera.lookAt(0,-0.3,-1.2);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

/* ---------- stone texture (procedural) ---------- */
function makeStone(){
  var c=document.createElement('canvas');c.width=c.height=256;
  var g=c.getContext('2d');
  g.fillStyle='#7e7a74';g.fillRect(0,0,256,256);
  var i,x,y,r,gr,v,col;
  for(i=0;i<46;i++){
    x=Math.random()*256;y=Math.random()*256;r=18+Math.random()*55;
    v=Math.random()<0.5;
    col=v?'136,132,126':'162,158,150';
    gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba('+col+',0.32)');
    gr.addColorStop(1,'rgba('+col+',0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  }
  var img=g.getImageData(0,0,256,256),d=img.data,n;
  for(i=0;i<d.length;i+=4){
    n=(Math.random()-0.5)*22;
    d[i]+=n;d[i+1]+=n;d[i+2]+=n;
  }
  g.putImageData(img,0,0);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}
var stoneTex=makeStone();
function stoneMat(){
  var tx=stoneTex.clone();tx.needsUpdate=true;
  tx.offset.set(Math.random(),Math.random());
  return new THREE.MeshStandardMaterial({map:tx,bumpMap:tx,bumpScale:0.03,roughness:0.93,metalness:0.02});
}
var variants=[stoneMat(),stoneMat(),stoneMat(),stoneMat()];

/* ---------- floor slabs ---------- */
var PITCH=4.2,SLAB=3.2;
var slabGeo=new THREE.BoxGeometry(SLAB,0.7,SLAB);
var i,j,m,vi=0;
for(i=-2;i<=2;i++)for(j=-2;j<=2;j++){
  m=new THREE.Mesh(slabGeo,variants[(vi++)%4]);
  m.position.set(i*PITCH,-0.35,j*PITCH);
  m.castShadow=true;m.receiveShadow=true;
  scene.add(m);
}

/* ---------- blue glow from below ---------- */
function makeGlow(){
  var c=document.createElement('canvas');c.width=c.height=256;
  var g=c.getContext('2d');
  var gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(48,104,255,0.9)');
  gr.addColorStop(0.45,'rgba(30,70,220,0.38)');
  gr.addColorStop(1,'rgba(20,40,160,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
var glow=new THREE.Mesh(new THREE.PlaneGeometry(26,26),
  new THREE.MeshBasicMaterial({map:makeGlow(),transparent:true,depthWrite:false}));
glow.rotation.x=-Math.PI/2;glow.position.y=-2.3;scene.add(glow);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x33415c,0x05070a,0.38));
var sun=new THREE.DirectionalLight(0xffe2c4,0.9);
sun.position.set(5,9,4);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-9;sun.shadow.camera.right=9;
sun.shadow.camera.top=9;sun.shadow.camera.bottom=-9;
sun.shadow.camera.far=30;sun.shadow.bias=-0.0005;
scene.add(sun);

/* ---------- rolling cubes ---------- */
var LOOP=8,ROLL_T=1.7,REST_T=2.2;
function easeIO(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
var cubeGeo=new THREE.BoxGeometry(0.92,0.92,0.92);
var rollers=[];
function addRoller(px,pz,yaw,phase){
  var outer=new THREE.Group();outer.position.set(px,0,pz);outer.rotation.y=yaw;
  var inner=new THREE.Group();outer.add(inner);
  var mesh=new THREE.Mesh(cubeGeo,stoneMat());
  mesh.position.set(-0.46,-0.46,0);
  mesh.castShadow=true;mesh.receiveShadow=true;
  inner.add(mesh);
  var dx=-Math.cos(yaw),dz=Math.sin(yaw);
  var light=new THREE.PointLight(0x2f6bff,0.5,7,2);
  light.position.set(px+dx*0.96,-1.15,pz+dz*0.96);
  scene.add(light);scene.add(outer);
  rollers.push({outer:outer,inner:inner,light:light,phase:phase});
}
addRoller( 2.6, 0.3, 0,           0   );  /* rolls toward -x */
addRoller(-1.2, 2.6, -Math.PI/2,  2.67);  /* rolls toward -z */
addRoller(-2.6,-1.5,  Math.PI,    5.33);  /* rolls toward +x */

/* ---------- black anchor cube (still) ---------- */
var anchor=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.42,0.42),
  new THREE.MeshStandardMaterial({color:0x0b0b0d,roughness:0.85,metalness:0.1}));
anchor.position.set(-0.7,0.21,1.0);anchor.castShadow=true;scene.add(anchor);

/* ---------- loop ---------- */
function animate(){
  requestAnimationFrame(animate);
  var t=(performance.now()*0.001)%LOOP;
  for(var k=0;k<rollers.length;k++){
    var r=rollers[k];
    var lt=(t-r.phase)%LOOP;if(lt<0)lt+=LOOP;
    var out;
    if(lt<ROLL_T)out=easeIO(lt/ROLL_T);
    else if(lt<ROLL_T+REST_T)out=1;
    else if(lt<2*ROLL_T+REST_T)out=1-easeIO((lt-ROLL_T-REST_T)/ROLL_T);
    else out=0;
    r.inner.rotation.z=-out*Math.PI/2;
    r.outer.position.y=-1.7*(1-out);
    r.light.intensity=0.45+2.0*out;
  }
  renderer.render(scene,camera);
}
animate();
})();
</script>
</body>
</html>
