<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>9132 — The Floor Breathes</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a10; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// THE-FLOOR-BREATHES-9132
// After @ophoelia's stone tile loop: a stone floor that breathes.
// Tiles shift, a central block rises from blue-lit depths, everything settles.
// Seamless 8s loop. Tap to nudge the rhythm (disturbance, not reload).
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- stone texture ----------
function makeStoneTexture() {
  const s = 256;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  // base: warm gray-pink
  g.fillStyle = '#9a8f96'; g.fillRect(0, 0, s, s);
  // large soft mottling
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * s, y = Math.random() * s, r = 20 + Math.random() * 50;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const tone = Math.random() < 0.5 ? '138,125,135' : '165,152,160';
    gr.addColorStop(0, `rgba(${tone},0.25)`); gr.addColorStop(1, `rgba(${tone},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  }
  // fine speckle
  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * s, y = Math.random() * s;
    const v = Math.random();
    g.fillStyle = v < 0.5 ? 'rgba(60,52,60,0.35)' : 'rgba(210,200,210,0.28)';
    g.fillRect(x, y, 1.3, 1.3);
  }
  // a few darker pits
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * s, y = Math.random() * s, r = 1 + Math.random() * 3;
    g.fillStyle = 'rgba(50,44,52,0.4)';
    g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill();
  }
  return c;
}
const stoneTex = makeStoneTexture();

// ---------- 3D projection ----------
// Camera: low and close, looking across the floor at a shallow angle
// (like the reference: dramatic oblique view, foreground tiles large).
const CAM = { x: 0, y: 6.5, z: 10, f: 1000 };
function project(px, py, pz) {
  const dx = px - CAM.x, dy = py - CAM.y, dz = pz - CAM.z;
  const pitch = 0.62; // looking down at the floor
  const cy = Math.cos(pitch), sy = Math.sin(pitch);
  const ry = dy * cy - dz * sy;
  const rz = dy * sy + dz * cy;
  const dist = -rz;
  if (dist < 0.1) return null;
  const s = CAM.f / dist;
  return {
    x: W / 2 + dx * s,
    y: H * 0.55 + ry * s,
    s: s
  };
}

// ---------- tiles ----------
// 5x5 grid of stone tiles, each a box. Center tile (2,2) is the riser.
const GRID = 5, TILE = 2.0, GAP = 0.12, TILE_H = 0.55;
const tiles = [];
for (let ix = 0; ix < GRID; ix++) {
  for (let iz = 0; iz < GRID; iz++) {
    const cx = (ix - (GRID - 1) / 2) * (TILE + GAP);
    const cz = (iz - (GRID - 1) / 2) * (TILE + GAP);
    const isCenter = (ix === 2 && iz === 2);
    const distC = Math.hypot(ix - 2, iz - 2);
    tiles.push({ ix, iz, cx, cz, isCenter, distC, phase: Math.random() * 6.28 });
  }
}
// black cube sits on tile (1,1)
const cubeTile = tiles.find(t => t.ix === 1 && t.iz === 1);

// ---------- animation ----------
// 8s seamless loop. t in [0,1).
const LOOP = 8;
let simT = 0, nudgeT = 99;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function smoothPulse(t, start, end) {
  // 0 before start, rises to 1, falls back to 0 at end. Seamless.
  if (t < start || t > end) return 0;
  const x = (t - start) / (end - start);
  return Math.sin(x * Math.PI);
}
// Tile lift amount for a given tile at time t
function tileLift(tile, t) {
  if (tile.isCenter) {
    // the riser: rises toward the camera in the middle of the loop
    return 1.6 * smoothPulse(t, 0.25, 0.75);
  }
  // neighbors shift subtly, staggered by distance
  const stagger = tile.distC * 0.06;
  return 0.28 * smoothPulse(t, 0.1 + stagger, 0.9 - stagger * 0.5);
}
// Crack openness (drives blue glow)
function crackOpen(t) {
  return smoothPulse(t, 0.08, 0.92);
}
// Nudge: tap adds a temporary extra lift wave
function nudgeAmp() {
  if (nudgeT > 1.5) return 0;
  return Math.sin((nudgeT / 1.5) * Math.PI) * 0.5;
}

// ---------- drawing ----------
function drawBox(cx, cy, cz, w, h, d, topFill, sideShade) {
  // cx,cy,cz = center of the box BASE. w,h,d = width, height, depth. +Y is up.
  const hw = w / 2, hd = d / 2;
  const yBot = cy, yTop = cy + h;
  // 8 corners: bottom 4, then top 4
  const corners = [
    project(cx - hw, yBot, cz - hd), project(cx + hw, yBot, cz - hd),
    project(cx + hw, yBot, cz + hd), project(cx - hw, yBot, cz + hd),
    project(cx - hw, yTop, cz - hd), project(cx + hw, yTop, cz - hd),
    project(cx + hw, yTop, cz + hd), project(cx - hw, yTop, cz + hd),
  ];
  if (corners.some(c => !c)) return;
  const [b0, b1, b2, b3, t0, t1, t2, t3] = corners;
  // side faces (front and right, the visible ones)
  // front face: b2, b3, t3, t2 (z+ side)
  ctx.fillStyle = sideShade;
  ctx.beginPath();
  ctx.moveTo(b2.x, b2.y); ctx.lineTo(b3.x, b3.y);
  ctx.lineTo(t3.x, t3.y); ctx.lineTo(t2.x, t2.y);
  ctx.closePath(); ctx.fill();
  // right face: b1, b2, t2, t1 (x+ side)
  ctx.fillStyle = shade(sideShade, -18);
  ctx.beginPath();
  ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
  ctx.lineTo(t2.x, t2.y); ctx.lineTo(t1.x, t1.y);
  ctx.closePath(); ctx.fill();
  // top face with stone texture
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y);
  ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
  ctx.closePath(); ctx.clip();
  // draw texture mapped to the top face bounds
  const minX = Math.min(t0.x, t1.x, t2.x, t3.x), maxX = Math.max(t0.x, t1.x, t2.x, t3.x);
  const minY = Math.min(t0.y, t1.y, t2.y, t3.y), maxY = Math.max(t0.y, t1.y, t2.y, t3.y);
  ctx.fillStyle = topFill;
  ctx.fillRect(minX, minY, maxX - minX, maxY - minY);
  // overlay stone texture with multiply-ish alpha
  ctx.globalAlpha = 0.55;
  ctx.drawImage(stoneTex, minX, minY, maxX - minX, maxY - minY);
  ctx.globalAlpha = 1;
  // subtle top highlight
  const hg = ctx.createLinearGradient(minX, minY, maxX, maxY);
  hg.addColorStop(0, 'rgba(255,245,255,0.10)');
  hg.addColorStop(0.5, 'rgba(255,245,255,0)');
  hg.addColorStop(1, 'rgba(20,10,25,0.14)');
  ctx.fillStyle = hg; ctx.fillRect(minX, minY, maxX - minX, maxY - minY);
  ctx.restore();
  // top edge stroke
  ctx.strokeStyle = 'rgba(30,22,32,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y);
  ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
  ctx.closePath(); ctx.stroke();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return `rgb(${r},${g},${b})`;
}

function render(t) {
  // bg: deep dark
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#06060c'); bg.addColorStop(1, '#0e0a14');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  const open = crackOpen(t);
  const nudge = nudgeAmp();

  // blue glow from below: draw first (behind tiles)
  // positioned at the center gap
  const glowC = project(0, -0.3, 0);
  if (glowC) {
    const gr = Math.min(W, H) * (0.28 + open * 0.22);
    const gg = ctx.createRadialGradient(glowC.x, glowC.y, 0, glowC.x, glowC.y, gr);
    const alpha = 0.25 + open * 0.55;
    gg.addColorStop(0, `rgba(40,120,255,${alpha})`);
    gg.addColorStop(0.4, `rgba(30,80,220,${alpha * 0.5})`);
    gg.addColorStop(1, 'rgba(20,40,120,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(glowC.x - gr, glowC.y - gr, gr * 2, gr * 2);
  }

  // sort tiles back-to-front by z-depth; the lifted riser always draws last (on top)
  const riser = tiles.find(t => t.isCenter);
  const riserLift = tileLift(riser, t);
  const others = tiles.filter(t => !t.isCenter).sort((a, b) => b.cz - a.cz);
  const sorted = riserLift > 0.05 ? [...others, riser] : tiles.slice().sort((a, b) => b.cz - a.cz);

  for (const tile of sorted) {
    const lift = tileLift(tile, t) + nudge * (1 - tile.distC / 4);
    const y = lift; // tile base rises
    // tile color shifts slightly blue when lifted (catching the glow)
    const glowTint = open * (1 - tile.distC / 5) * 0.5;
    const topFill = glowTint > 0.05
      ? `rgb(${154 + glowTint * 30},${143 + glowTint * 20},${150 + glowTint * 60})`
      : '#9a8f96';
    drawBox(tile.cx, y, tile.cz, TILE, TILE_H, TILE, topFill, '#5e5462');
  }

  // black cube on its tile (the focal point)
  const cl = tileLift(cubeTile, t) + nudge * 0.7;
  const cs = 0.55; // cube size
  const cubeY = cl + TILE_H; // sits on top of the tile
  drawBox(cubeTile.cx, cubeY, cubeTile.cz, cs, cs, cs, '#17141a', '#0a090c');
}

let lastTs = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  simT = (simT + dt) % LOOP;
  nudgeT += dt;
  render(simT / LOOP);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// tap = nudge the floor (disturbance, not reload)
cv.addEventListener('pointerdown', (e) => {
  nudgeT = 0;
});

// debug hook
window.__floor = {
  get t() { return simT / LOOP; },
  setT(x) { simT = x * LOOP; },
  nudge() { nudgeT = 0; }
};
</script>
</body>
</html>
