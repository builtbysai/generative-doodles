<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Underfloor — №9132</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07090d;}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%;}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,.58) 100%);}
  .cap{position:fixed;left:14px;bottom:12px;color:#cfd6dd;opacity:.45;
    font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif;letter-spacing:.14em;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="cap">№9132 · THE UNDERFLOOR — frame one</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x07090d);
scene.fog=new THREE.Fog(0x07090d,10,30);

var camera=new THREE.PerspectiveCamera(55,1,0.1,120);
var basePos=new THREE.Vector3(1.5,0.75,11.0);
var lookTarget=new THREE.Vector3(1.0,-0.6,1.0);
var viewDir=basePos.clone().sub(lookTarget).normalize();
var baseDist=basePos.distanceTo(lookTarget);

function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  var pull=camera.aspect<0.9?(1+(0.9/camera.aspect-1)*0.55):1;
  basePos.copy(lookTarget).addScaledVector(viewDir,baseDist*pull);
  camera.position.copy(basePos);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

/* ---------- stone texture ---------- */
function makeStone(){
  var c=document.createElement('canvas');c.width=c.height=512;
  var g=c.getContext('2d');
  g.fillStyle='#6f645c';g.fillRect(0,0,512,512);
  var i,x,y,r,gr,v,col;
  for(i=0;i<140;i++){
    x=Math.random()*512;y=Math.random()*512;r=8+Math.random()*70;
    v=Math.random();
    col=v<0.4?'88,80,76':(v<0.7?'140,132,124':'105,98,94');
    gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba('+col+',0.55)');
    gr.addColorStop(1,'rgba('+col+',0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  }
  /* pitting */
  for(i=0;i<220;i++){
    x=Math.random()*512;y=Math.random()*512;r=1+Math.random()*4;
    g.fillStyle='rgba(40,36,34,'+(0.15+Math.random()*0.25)+')';
    g.beginPath();g.arc(x,y,r,0,7);g.fill();
  }
  /* cracks */
  g.strokeStyle='rgba(45,40,38,0.5)';g.lineWidth=1.2;
  for(i=0;i<22;i++){
    x=Math.random()*512;y=Math.random()*512;
    g.beginPath();g.moveTo(x,y);
    var a=Math.random()*6.28;
    for(var s=0;s<6;s++){a+=(Math.random()-0.5)*1.2;x+=Math.cos(a)*14;y+=Math.sin(a)*14;g.lineTo(x,y);}
    g.stroke();
  }
  var img=g.getImageData(0,0,512,512),d=img.data,n;
  for(i=0;i<d.length;i+=4){
    n=(Math.random()-0.5)*22;
    d[i]+=n;d[i+1]+=n*0.96;d[i+2]+=n*0.94;
  }
  g.putImageData(img,0,0);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}
var stoneTex=makeStone();
function stoneMat(opaque){
  var tx=stoneTex.clone();tx.needsUpdate=true;
  tx.offset.set(Math.random(),Math.random());
  var m=new THREE.MeshStandardMaterial({map:tx,bumpMap:tx,bumpScale:0.12,roughness:0.95,metalness:0.02});
  if(!opaque){m.transparent=true;}
  return m;
}
var variants=[stoneMat(true),stoneMat(true),stoneMat(true),stoneMat(true)];

/* ---------- floor slabs (grid shifted so a channel meets the dive) ---------- */
var PITCH=4.2,SLAB=3.2,OX=-0.63,OZ=4.63;
var slabGeo=new THREE.BoxGeometry(SLAB,0.7,SLAB);
var i,j,m,vi=0;
for(i=-4;i<=4;i++)for(j=-4;j<=4;j++){
  m=new THREE.Mesh(slabGeo,variants[(vi++)%4]);
  m.position.set(OX+i*PITCH,-0.35,OZ+j*PITCH);
  m.castShadow=true;m.receiveShadow=true;
  scene.add(m);
}

/* ---------- blue glow from below ---------- */
function makeGlow(){
  var c=document.createElement('canvas');c.width=c.height=256;
  var g=c.getContext('2d');
  var gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(60,130,255,1.0)');
  gr.addColorStop(0.45,'rgba(36,80,255,0.55)');
  gr.addColorStop(1,'rgba(20,40,160,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
var glow=new THREE.Mesh(new THREE.PlaneGeometry(30,30),
  new THREE.MeshBasicMaterial({map:makeGlow(),transparent:true,depthWrite:false}));
glow.rotation.x=-Math.PI/2;glow.position.set(1.47,-2.3,6.73);scene.add(glow);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x2a3550,0x04060a,0.14));
var sun=new THREE.DirectionalLight(0xffd9b0,1.15);
sun.position.set(6,9,14);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-10;sun.shadow.camera.right=10;
sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;
sun.shadow.camera.far=40;sun.shadow.bias=-0.0005;
scene.add(sun);

/* dive-gap blue light */
var gapLight=new THREE.PointLight(0x2f6bff,1.6,10,2);
gapLight.position.set(1.47,-1.15,6.73);
scene.add(gapLight);

/* ---------- hero cube: rotoscoped path [t,x,z,yOff,opacity] ---------- */
var WP=[[0.0,3.43,3.36,0.89,0.35,0.997],[0.33,3.09,4.19,0.69,0.65,1.011],[0.66,2.57,4.89,0.29,1,1.122],[0.99,2.24,5.56,0.07,1,1.095],[1.32,1.82,6.72,0,1,0.902],[1.65,1.6,7.91,0,1,0.676],[1.98,1.39,8.76,0,1,0.508],[2.31,1.25,9.15,0,1,0.433],[2.64,1.15,9.35,0,1,0.399],[2.97,1.05,9.43,0,1,0.393],[3.3,1.0,9.58,0,1,0.368],[3.63,0.95,9.7,0,1,0.358],[3.96,0.92,9.76,0,1,0.357],[4.29,0.94,9.7,0,1,0.368],[4.62,1.04,9.58,0,1,0.399],[4.95,1.17,9.43,0,1,0.444],[5.28,1.33,9.34,0,1,0.482],[5.61,1.45,9.41,0,1,0.471],[5.94,1.51,8.73,-0.2,1,0.693],[6.27,1.55,7.8,-0.6,0.9,1.025],[6.6,1.51,7.45,-0.9,0.65,1.195],[6.93,1.47,7.13,-1.1,0.35,1.345],[7.26,1.47,6.86,-1.25,0.12,1.444],[7.59,1.47,6.73,-1.3,0,1.489]];
var LOOP=7.93,S=0.8,R=S/2;
var heroMat=stoneMat(false);
heroMat.fog=false;
var hero=new THREE.Mesh(new THREE.BoxGeometry(S,S,S),heroMat);
hero.castShadow=true;hero.receiveShadow=true;
scene.add(hero);

function cr(p0,p1,p2,p3,t){
  var t2=t*t,t3=t2*t;
  return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);
}
function sampleWP(t){
  var n=WP.length,ii=0;
  while(ii<n-2&&t>=WP[ii+1][0])ii++;
  var p0=WP[Math.max(0,ii-1)],p1=WP[ii],p2=WP[ii+1],p3=WP[Math.min(n-1,ii+2)];
  var u=(t-p1[0])/Math.max(1e-6,(p2[0]-p1[0]));u=Math.max(0,Math.min(1,u));
  return{
    x:cr(p0[1],p1[1],p2[1],p3[1],u),
    z:cr(p0[2],p1[2],p2[2],p3[2],u),
    yOff:cr(p0[3],p1[3],p2[3],p3[3],u),
    op:p1[4]+(p2[4]-p1[4])*u,
    sc:cr(p0[5],p1[5],p2[5],p3[5],u)
  };
}
var prevT=-1,prevPos=new THREE.Vector3();
function updateHero(t){
  var s=sampleWP(t);
  var px=s.x,py=R+s.yOff,pz=s.z;
  if(prevT<0||t<prevT){hero.quaternion.identity();}
  else{
    var dx=px-prevPos.x,dy=py-prevPos.y,dz=pz-prevPos.z;
    var dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(dist>1e-5){
      var axis=new THREE.Vector3(dz,0,-dx);
      if(axis.lengthSq()>1e-8){
        axis.normalize();
        var q=new THREE.Quaternion().setFromAxisAngle(axis,dist/(R*Math.max(0.001,s.sc)));
        hero.quaternion.premultiply(q);
      }
    }
  }
  hero.position.set(px,py,pz);
  hero.scale.setScalar(Math.max(0.001,s.sc));
  heroMat.opacity=s.op;
  hero.visible=s.op>0.01;
  hero.castShadow=s.op>0.85;
  prevT=t;prevPos.set(px,py,pz);
  return s;
}

/* ---------- black anchor cube ---------- */
var anchor=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.42,0.42),
  new THREE.MeshStandardMaterial({color:0x0b0b0d,roughness:0.85,metalness:0.1}));
anchor.position.set(-1.0,0.21,4.0);anchor.castShadow=true;scene.add(anchor);

/* ---------- loop ---------- */
function animate(){
  var t=0; /* frozen on the first frame */
  var s=updateHero(t);
  var flare=Math.max(0,Math.min(1,-s.yOff/1.3));
  gapLight.intensity=1.6+2.6*flare+0.3*Math.sin(t*2.1);

  camera.position.copy(basePos);
  camera.lookAt(lookTarget);
  renderer.render(scene,camera);
}
animate();
})();
</script>
</body>
</html>
