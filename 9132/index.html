<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Underfloor — №9132</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07090d;}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%;}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,.58) 100%);}
  .cap{position:fixed;left:14px;bottom:12px;color:#cfd6dd;opacity:.45;
    font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif;letter-spacing:.14em;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="cap">№9132 · THE UNDERFLOOR</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x07090d);
scene.fog=new THREE.Fog(0x07090d,9,22);

var camera=new THREE.PerspectiveCamera(52,1,0.1,80);
var basePos=new THREE.Vector3(1.6,1.05,4.8);
var lookTarget=new THREE.Vector3(1.2,-0.3,-1.0);

function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  if(camera.aspect<0.8){basePos.set(1.6,2.7,8.8);camera.fov=58;}
  else{basePos.set(1.6,1.05,4.8);camera.fov=52;}
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

/* ---------- stone texture (procedural, dark rough) ---------- */
function makeStone(){
  var c=document.createElement('canvas');c.width=c.height=256;
  var g=c.getContext('2d');
  g.fillStyle='#6e6963';g.fillRect(0,0,256,256);
  var i,x,y,r,gr,v,col;
  for(i=0;i<60;i++){
    x=Math.random()*256;y=Math.random()*256;r=14+Math.random()*50;
    v=Math.random()<0.5;
    col=v?'100,95,90':'130,122,112';
    gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba('+col+',0.4)');
    gr.addColorStop(1,'rgba('+col+',0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  }
  var img=g.getImageData(0,0,256,256),d=img.data,n;
  for(i=0;i<d.length;i+=4){
    n=(Math.random()-0.5)*30;
    d[i]+=n;d[i+1]+=n;d[i+2]+=n;
  }
  g.putImageData(img,0,0);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}
var stoneTex=makeStone();
function stoneMat(opaque){
  var tx=stoneTex.clone();tx.needsUpdate=true;
  tx.offset.set(Math.random(),Math.random());
  var m=new THREE.MeshStandardMaterial({map:tx,bumpMap:tx,bumpScale:0.04,roughness:0.95,metalness:0.02});
  if(!opaque){m.transparent=true;}
  return m;
}
var variants=[stoneMat(true),stoneMat(true),stoneMat(true),stoneMat(true)];

/* ---------- floor slabs ---------- */
var PITCH=4.2,SLAB=3.2;
var slabGeo=new THREE.BoxGeometry(SLAB,0.7,SLAB);
var i,j,m,vi=0;
for(i=-2;i<=2;i++)for(j=-2;j<=2;j++){
  m=new THREE.Mesh(slabGeo,variants[(vi++)%4]);
  m.position.set(i*PITCH,-0.35,j*PITCH);
  m.castShadow=true;m.receiveShadow=true;
  scene.add(m);
}

/* ---------- blue glow from below ---------- */
function makeGlow(){
  var c=document.createElement('canvas');c.width=c.height=256;
  var g=c.getContext('2d');
  var gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(52,112,255,0.95)');
  gr.addColorStop(0.45,'rgba(32,72,225,0.42)');
  gr.addColorStop(1,'rgba(20,40,160,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
var glow=new THREE.Mesh(new THREE.PlaneGeometry(26,26),
  new THREE.MeshBasicMaterial({map:makeGlow(),transparent:true,depthWrite:false}));
glow.rotation.x=-Math.PI/2;glow.position.y=-2.3;scene.add(glow);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x33415c,0x05070a,0.35));
var sun=new THREE.DirectionalLight(0xffe2c4,0.85);
sun.position.set(5,9,4);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-9;sun.shadow.camera.right=9;
sun.shadow.camera.top=9;sun.shadow.camera.bottom=-9;
sun.shadow.camera.far=30;sun.shadow.bias=-0.0005;
scene.add(sun);

/* hero gap blue light */
var GAPX=2.1,GAPZ=0.3;
var gapLight=new THREE.PointLight(0x2a5fff,1.2,8,2);
gapLight.position.set(GAPX,-1.15,GAPZ);
scene.add(gapLight);

/* ---------- hero cube: materialize -> roll -> dive -> dissolve ---------- */
var LOOP=8;
var S=0.8,R=S/2,HX0=4.6,HX1=2.02;
var heroMat=stoneMat(false);
var hero=new THREE.Mesh(new THREE.BoxGeometry(S,S,S),heroMat);
hero.castShadow=true;hero.receiveShadow=true;
scene.add(hero);

function heroState(t){
  var st={x:HX0,y:R,rot:0,op:0};
  if(t<1.2){st.op=t/1.2;}
  else if(t<4.6){
    var u=(t-1.2)/3.4,e=u*u*(3-2*u),d=(HX0-HX1)*e;
    st.x=HX0-d;st.op=1;st.rot=d/R;
  }
  else if(t<5.6){
    var u2=(t-4.6),e2=u2*u2;
    st.x=HX1-0.1*e2;st.y=R-1.36*e2;st.op=1;
    st.rot=(HX0-HX1)/R+e2*2.4;
  }
  else if(t<6.8){
    var u3=(t-5.6)/1.2;
    st.x=HX1-0.1;st.y=(R-1.36)-0.7*u3;st.op=1-u3;
    st.rot=(HX0-HX1)/R+2.4+u3*1.4;
  }
  else{st.x=HX1-0.1;st.y=R-2.06;st.op=0;st.rot=(HX0-HX1)/R+3.8;}
  return st;
}

/* ---------- black anchor cube (still) ---------- */
var anchor=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.42,0.42),
  new THREE.MeshStandardMaterial({color:0x0b0b0d,roughness:0.85,metalness:0.1}));
anchor.position.set(0.2,0.21,1.6);anchor.castShadow=true;scene.add(anchor);

/* ---------- loop ---------- */
function animate(){
  requestAnimationFrame(animate);
  var t=(performance.now()*0.001)%LOOP;

  var st=heroState(t);
  hero.position.set(st.x,st.y,GAPZ);
  hero.rotation.z=st.rot;
  heroMat.opacity=st.op;
  hero.visible=st.op>0.01;
  hero.castShadow=st.op>0.85;

  var dive=t<4.6?0:t<5.0?(t-4.6)/0.4:t<6.4?1:t<6.8?1-(t-6.4)/0.4:0;
  gapLight.intensity=1.2+1.6*dive+0.25*Math.sin(t*2.1);

  /* slow drift — never sits still, always loops shut */
  var w2=Math.PI*2*t/LOOP;
  camera.position.set(
    basePos.x+0.3*Math.sin(w2),
    basePos.y+0.1*Math.sin(w2+1.3),
    basePos.z+0.25*Math.cos(w2)
  );
  camera.lookAt(lookTarget);

  renderer.render(scene,camera);
}
animate();
})();
</script>
</body>
</html>
