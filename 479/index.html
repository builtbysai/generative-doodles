<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loupe Snow</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #93A3AD; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var GROUND = '#93A3AD';
  var GLASS = 'rgba(232,240,244,0.5)';
  var RIM = '#3B2A24';
  var SNOW = '#FFFFFF';
  var MUSTARD = '#D9A03F';
  var HAIR = '#3B2A24';
  var SKIN = '#EBC9A8';

  var FIXED_T = 9; // constant pre-roll, seconds; frame one never comes from a clock

  var W = 800, H = 600;
  var isPhone = false;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var seedBase = 479071;
  var flakes = [];   // field flakes, stored as data
  var stream = [];   // poured band of flakes, stored as data
  var grain = [];    // precomputed seeded dot array, identical every frame

  function build(seed) {
    var rng = mulberry32(seed);
    var i, f;
    flakes = [];
    for (i = 0; i < 150; i++) {
      f = {
        x: rng(), y: rng(),
        r: 2.6 + rng() * 3.6,
        rot: rng() * Math.PI,
        phase: rng() * Math.PI * 2,
        fall: 0.004 + rng() * 0.007,
        sway: 5 + rng() * 9
      };
      flakes.push(f);
    }
    stream = [];
    for (i = 0; i < 95; i++) {
      stream.push({
        s: rng(),
        perp: (rng() * 2 - 1),
        r: 2.4 + rng() * 3.4,
        rot: rng() * Math.PI,
        phase: rng() * Math.PI * 2,
        speed: 0.010 + rng() * 0.010
      });
    }
    grain = [];
    for (i = 0; i < 850; i++) {
      grain.push({
        x: rng(), y: rng(),
        r: 0.6 + rng() * 1.1,
        dark: rng() > 0.5,
        a: 0.03 + rng() * 0.05
      });
    }
  }

  // --- loupe state -------------------------------------------------------
  var loupeX = 0, loupeY = 0, targetX = 0, targetY = 0;
  var homeX = 0, homeY = 0, loupeR = 100;
  var dragging = false, dragDX = 0, dragDY = 0;
  var loopT = FIXED_T;
  var lastTapT = -10, tapCount = 0;

  function layout() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var sw = window.screen ? window.screen.width : W;
    var sh = window.screen ? window.screen.height : H;
    isPhone = Math.min(sw, sh) < 700;
    if (!isPhone && H > W * 1.15) isPhone = true; // aspect fallback only
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var m = Math.min(W, H);
    loupeR = isPhone ? W * 0.32 : m * 0.27;
    homeX = isPhone ? W * 0.60 : W * 0.56;
    homeY = isPhone ? H * 0.33 : H * 0.47;
    if (isPhone) { DIRX = -0.55; DIRY = 0.835; } else { DIRX = -0.816; DIRY = 0.578; }
    PERPX = -DIRY; PERPY = DIRX;
    if (!dragging) {
      // keep the loupe inside the field
      loupeX = Math.max(loupeR * 0.7, Math.min(W - loupeR * 0.55, loupeX || homeX));
      loupeY = Math.max(loupeR * 0.7, Math.min(H - loupeR * 0.55, loupeY || homeY));
      if (!loupeX && !loupeY) { loupeX = homeX; loupeY = homeY; }
      targetX = loupeX; targetY = loupeY;
    }
  }

  function resize() {
    var wasX = loupeX, wasY = loupeY;
    layout();
    if (!wasX && !wasY) { loupeX = homeX; loupeY = homeY; targetX = homeX; targetY = homeY; }
    draw(loopT);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  // --- flakes ------------------------------------------------------------
  function flakePos(f, t) {
    var yFrac = f.y + t * f.fall;
    yFrac = yFrac - Math.floor(yFrac);
    return {
      x: f.x * W + Math.sin(t * 0.22 + f.phase) * f.sway,
      y: yFrac * H,
      rot: f.rot + Math.sin(t * 0.18 + f.phase) * 0.35
    };
  }

  function drawFlake(x, y, r, rot, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = SNOW;
    ctx.lineWidth = Math.max(0.8, r * 0.20);
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var k = 0; k < 6; k++) {
      var a = (Math.PI / 3) * k;
      var ca = Math.cos(a), sa = Math.sin(a);
      ctx.moveTo(0, 0);
      ctx.lineTo(ca * r, sa * r);
      // small branch near the tip of each arm
      var bx = ca * r * 0.62, by = sa * r * 0.62;
      var b1 = a + 0.65, b2 = a - 0.65;
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.cos(b1) * r * 0.34, by + Math.sin(b1) * r * 0.34);
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.cos(b2) * r * 0.34, by + Math.sin(b2) * r * 0.34);
    }
    ctx.stroke();
    ctx.restore();
  }

  // stream: a dense band trailing from the lens rim toward lower-left,
  // positions are a pure function of loop time (s advances, then wraps)
  var DIRX = -0.816, DIRY = 0.578;    // toward lower-left
  var PERPX = -DIRY, PERPY = DIRX;
  function streamPos(s, t) {
    var frac = s.s + t * s.speed;
    frac = frac - Math.floor(frac);
    var sx = loupeX + DIRX * loupeR * 0.96;
    var sy = loupeY + DIRY * loupeR * 0.96;
    // keep the whole poured band inside the frame: cap the trail at the
    // first edge it would cross, so flakes spread along the visible ground
    var maxX = DIRX < 0 ? (sx - 8) / -DIRX : (W - 8 - sx) / DIRX;
    var maxY = DIRY > 0 ? (H - 10 - sy) / DIRY : 1e9;
    var trail = Math.min(Math.min(W, H) * 0.88, maxX, maxY);
    var spread = 7 + frac * 34;
    var x = sx + DIRX * frac * trail + PERPX * s.perp * spread + Math.sin(t * 0.4 + s.phase) * 2.2;
    var y = sy + DIRY * frac * trail + PERPY * s.perp * spread;
    return { x: x, y: y, frac: frac, rot: s.rot + t * 0.05 + s.phase };
  }

  // --- tiny figure: closed-eye profile at the left edge, facing right ---
  function drawFigure() {
    var fh = H * 0.12;                 // about 12 percent of frame height
    var fx = W * 0.018;
    var base = isPhone ? H * 0.44 : H * 0.60; // on phones she stands clear of the steeper snow stream
    var headR = fh * 0.17;
    var headX = fx + fh * 0.30;
    var headY = base - fh * 0.80;

    ctx.save();
    // dress, mustard, a soft triangle from neck to hem
    ctx.fillStyle = MUSTARD;
    ctx.beginPath();
    ctx.moveTo(headX - fh * 0.03, headY + headR * 0.85);
    ctx.lineTo(fx + fh * 0.58, base);
    ctx.lineTo(fx + fh * 0.02, base);
    ctx.closePath();
    ctx.fill();
    // hair, behind the face: a dark mass at the back and top of the head
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.arc(headX - fh * 0.055, headY - fh * 0.02, headR * 1.04, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath(); // small bun
    ctx.arc(headX - fh * 0.20, headY - fh * 0.10, headR * 0.48, 0, Math.PI * 2);
    ctx.fill();
    // face, skin, offset forward so the hair stays at the back
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.arc(headX + fh * 0.03, headY, headR * 0.92, 0, Math.PI * 2);
    ctx.fill();
    // nose, a tiny step on the profile edge
    ctx.beginPath();
    ctx.moveTo(headX + fh * 0.175, headY - fh * 0.01);
    ctx.lineTo(headX + fh * 0.225, headY + fh * 0.045);
    ctx.lineTo(headX + fh * 0.165, headY + fh * 0.075);
    ctx.closePath();
    ctx.fill();
    // closed eye: one short curved line
    ctx.strokeStyle = RIM;
    ctx.lineWidth = Math.max(1.1, fh * 0.016);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(headX + fh * 0.075, headY - fh * 0.015, fh * 0.045, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    // mouth, small and round, blowing gently toward the loupe
    ctx.beginPath();
    ctx.arc(headX + fh * 0.185, headY + fh * 0.115, fh * 0.026, 0, Math.PI * 2);
    ctx.stroke();
    // one soft breath curl drifting right from her mouth
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.arc(headX + fh * 0.34, headY + fh * 0.11, fh * 0.05, Math.PI * 0.9, Math.PI * 1.9);
    ctx.stroke();
    ctx.restore();
  }

  // --- main draw ---------------------------------------------------------
  function draw(t) {
    loopT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // ground, full bleed
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // soft grain, same precomputed dots every frame
    var i, g;
    for (i = 0; i < grain.length; i++) {
      g = grain[i];
      ctx.globalAlpha = g.a;
      ctx.fillStyle = g.dark ? '#5E707C' : '#C7D2D9';
      ctx.beginPath();
      ctx.arc(g.x * W, g.y * H, g.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // positions for this frame
    var pos = [];
    for (i = 0; i < flakes.length; i++) pos.push(flakePos(flakes[i], t));

    // field flakes outside the lens, at base size
    for (i = 0; i < flakes.length; i++) {
      var dx = pos[i].x - loupeX, dy = pos[i].y - loupeY;
      if (dx * dx + dy * dy > loupeR * loupeR) {
        drawFlake(pos[i].x, pos[i].y, flakes[i].r, pos[i].rot, 0.92);
      }
    }

    // snow stream pouring from the lens edge toward lower-left
    for (i = 0; i < stream.length; i++) {
      var sp = streamPos(stream[i], t);
      var sdx = sp.x - loupeX, sdy = sp.y - loupeY;
      var underLens = sdx * sdx + sdy * sdy < loupeR * loupeR * 0.9;
      if (!underLens) {
        drawFlake(sp.x, sp.y, stream[i].r * (0.85 + sp.frac * 0.3), sp.rot, 0.95 - sp.frac * 0.30);
      }
    }

    // handle stub, flat on the ground plane, lower-right of the rim
    ctx.save();
    ctx.strokeStyle = RIM;
    ctx.lineWidth = loupeR * 0.17;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(loupeX + loupeR * 0.78, loupeY + loupeR * 0.78);
    ctx.lineTo(loupeX + loupeR * 1.24, loupeY + loupeR * 1.24);
    ctx.stroke();
    ctx.restore();

    // lens glass
    ctx.fillStyle = GLASS;
    ctx.beginPath();
    ctx.arc(loupeX, loupeY, loupeR, 0, Math.PI * 2);
    ctx.fill();

    // magnified flakes: anything inside the lens, drawn again at 2.2x, clipped to the glass
    ctx.save();
    ctx.beginPath();
    ctx.arc(loupeX, loupeY, loupeR, 0, Math.PI * 2);
    ctx.clip();
    for (i = 0; i < flakes.length; i++) {
      var mx = pos[i].x - loupeX, my = pos[i].y - loupeY;
      if (mx * mx + my * my < loupeR * loupeR) {
        drawFlake(pos[i].x, pos[i].y, flakes[i].r * 2.2, pos[i].rot, 1);
      }
    }
    // a soft sheen across the glass
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.ellipse(loupeX - loupeR * 0.30, loupeY - loupeR * 0.38, loupeR * 0.46, loupeR * 0.20, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;

    // rim
    ctx.strokeStyle = RIM;
    ctx.lineWidth = Math.max(5, loupeR * 0.085);
    ctx.beginPath();
    ctx.arc(loupeX, loupeY, loupeR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.30)';
    ctx.lineWidth = Math.max(1.5, loupeR * 0.02);
    ctx.beginPath();
    ctx.arc(loupeX, loupeY, loupeR * 0.955, Math.PI * 1.05, Math.PI * 1.55);
    ctx.stroke();

    drawFigure();

    // hint, one lowercase word in a corner
    ctx.fillStyle = 'rgba(59,42,36,0.42)';
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('drag', W - 16, H - 14);
    ctx.textAlign = 'left';
  }

  // --- interaction -------------------------------------------------------
  function pointFromEvent(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    return { x: homeX, y: homeY };
  }
  function onDown(e) {
    var p = pointFromEvent(e);
    // double tap reseeds the snowfall
    if (loopT - lastTapT < 0.35) tapCount++; else tapCount = 1;
    lastTapT = loopT;
    if (tapCount >= 2) {
      tapCount = 0;
      seedBase += 1013;
      build(seedBase);
      draw(loopT);
      return;
    }
    var dx = p.x - loupeX, dy = p.y - loupeY;
    if (dx * dx + dy * dy < (loupeR * 1.45) * (loupeR * 1.45)) {
      dragging = true;
      dragDX = loupeX - p.x;
      dragDY = loupeY - p.y;
      targetX = loupeX; targetY = loupeY;
    }
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pointFromEvent(e);
    targetX = Math.max(loupeR * 0.55, Math.min(W - loupeR * 0.55, p.x + dragDX));
    targetY = Math.max(loupeR * 0.55, Math.min(H - loupeR * 0.55, p.y + dragDY));
  }
  function onUp() { dragging = false; }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('dblclick', function () {
    seedBase += 1013;
    build(seedBase);
    draw(loopT);
  });

  // --- run ---------------------------------------------------------------
  build(seedBase);
  layout();
  loupeX = homeX; loupeY = homeY; targetX = homeX; targetY = homeY;
  draw(FIXED_T); // one synchronous first frame

  var firstTs = null;
  function loop(ts) {
    if (firstTs === null) firstTs = ts;
    var elapsed = (ts - firstTs) / 1000;
    var t = FIXED_T + elapsed;
    if (dragging) {
      loupeX += (targetX - loupeX) * 0.20;
      loupeY += (targetY - loupeY) * 0.20;
    } else {
      var swayX = homeX + Math.sin(t * 0.30) * Math.min(W, H) * 0.012;
      var swayY = homeY + Math.cos(t * 0.23) * Math.min(W, H) * 0.010;
      // drift home, then sway gently around it
      loupeX += (swayX - loupeX) * 0.03;
      loupeY += (swayY - loupeY) * 0.03;
    }
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
