<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№72 · Twenty-Two Stripes</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0e; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(240,240,240,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scrub the glitch</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const RAMP=[]; for(let i=0;i<11;i++){ const v=Math.round(16+(240-16)*i/10); RAMP.push('rgb('+v+','+v+','+v+')'); }
const NSTRIPES=22;
const rnd=mulberry(7202);
const STRIPES=[];
(function(){
  let weights=[], total=0;
  for(let i=0;i<NSTRIPES;i++){ const wt=0.85+rnd()*0.30; weights.push(wt); total+=wt; }
  let base=[]; for(let i=0;i<NSTRIPES;i++) base.push(Math.round(i/(NSTRIPES-1)*10));
  for(let s=0;s<4;s++){ const i=2+Math.floor(rnd()*18); const tmp=base[i]; base[i]=base[i+1]; base[i+1]=tmp; }
  let acc=0;
  for(let i=0;i<NSTRIPES;i++){ const frac=weights[i]/total; STRIPES.push({x0:acc, frac:frac, base:base[i], dir:rnd()<0.5?-1:1}); acc+=frac; }
})();
let manual=null, dragging=false, releaseAt=-10, baseOffset=0;
function bandCenter(t,fw){
  const span=fw*1.35, speed=span/16;
  if(dragging&&manual!==null) return manual;
  if(manual!==null&&t-releaseAt<4) return manual;
  if(manual!==null){ baseOffset=manual-((t*speed)%span); manual=null; }
  let p=(t*speed+baseOffset)%span; if(p<0)p+=span;
  return p-fw*0.175;
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#0b0b0e'; ctx.fillRect(0,0,w,h);
  const t=nowMs/1000;
  const bx=bandCenter(t,w);
  const bandW=w*3/NSTRIPES*1.6;
  for(const s of STRIPES){
    const x=s.x0*w, swd=s.frac*w, cx=x+swd/2;
    let d=Math.abs(cx-bx); d=Math.min(d,Math.abs(cx-bx-w),Math.abs(cx-bx+w));
    let idx=s.base; if(d<bandW/2) idx=Math.max(0,Math.min(10,s.base+s.dir));
    ctx.fillStyle=RAMP[idx]; ctx.fillRect(x,0,swd+1,h);
  }
  return {count:NSTRIPES};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(4000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',e=>{ dragging=true; manual=e.clientX; });
canvas.addEventListener('pointermove',e=>{ if(dragging) manual=e.clientX; });
function endP(){ if(dragging){ dragging=false; releaseAt=performance.now()/1000; } }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
