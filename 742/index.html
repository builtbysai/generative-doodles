<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rose Window</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0B0D; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var GROUND = "#0A0B0D";
  var HUB = "#14161A";

  // Color families. A tube never leaves its family when it retunes.
  var FAMILIES = {
    blue:   ["#2E5FA3", "#4A7DBE", "#6BA3D8", "#1E3E73", "#8FB8E8"],
    yellow: ["#E8C547", "#D9A441", "#F2D878"],
    red:    ["#C0392B", "#E06A5A"],
    pink:   ["#E8A0B4"]
  };
  var FAMILY_KEYS = ["blue", "yellow", "red", "pink"];

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  window.addEventListener("resize", resize);
  resize();

  // mulberry32 seeded RNG: builds the whole mandala arrangement at load.
  var seed = 742005;
  function rng() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // Twelve tubes: 5 blue, 3 yellow, 2 red, 1 pink, 1 spare. The spare takes
  // a seeded family and a seeded tone inside it. The family order around the
  // wheel is a seeded shuffle, so the wheel is ordered but not mechanical.
  var slots = ["blue", "blue", "blue", "blue", "blue",
               "yellow", "yellow", "yellow",
               "red", "red", "pink", "spare"];
  var spareFamily = FAMILY_KEYS[Math.floor(rng() * FAMILY_KEYS.length)];
  for (var i = 0; i < slots.length; i++) {
    if (slots[i] === "spare") slots[i] = spareFamily;
  }
  for (var j = slots.length - 1; j > 0; j--) {
    var k = Math.floor(rng() * (j + 1));
    var tmp = slots[j]; slots[j] = slots[k]; slots[k] = tmp;
  }

  var tubes = [];
  for (var n = 0; n < 12; n++) {
    var fam = slots[n];
    var tones = FAMILIES[fam];
    tubes.push({
      family: fam,
      step: Math.floor(rng() * tones.length),   // current tone index in family
      lenJitter: 0.975 + rng() * 0.05,          // near-equal lengths, hand-set feel
      pulseAt: -10                               // last tap time; -10 = never
    });
  }

  function tubeColor(tube) {
    var tones = FAMILIES[tube.family];
    return tones[tube.step % tones.length];
  }

  // Rotation control: a list of easing segments. Each drag sample opens a
  // new segment {t0, rot0, target}; rot(t) is evaluated in closed form as
  // target + (rot0 - target) * exp(-(t - t0) / TAU). No integration.
  var TAU = 0.45;
  var segments = [{ t0: 0, rot0: 0, target: 0 }];
  function rotationAt(t) {
    var s = segments[0];
    for (var i = segments.length - 1; i >= 0; i--) {
      if (segments[i].t0 <= t) { s = segments[i]; break; }
    }
    return s.target + (s.rot0 - s.target) * Math.exp(-(t - s.t0) / TAU);
  }
  function pushTarget(t, target) {
    segments.push({ t0: t, rot0: rotationAt(t), target: target });
    if (segments.length > 400) segments.splice(1, segments.length - 400);
  }
  function currentTarget() { return segments[segments.length - 1].target; }

  // Breathing: barely-there, one slow sine. Phase 0 at t=0.
  function breathe(t) { return 1 + 0.045 * Math.sin(2 * Math.PI * t / 11); }

  function pulse(tube, t) {
    var d = t - tube.pulseAt;
    if (d < 0) return 0;
    return Math.exp(-d / 0.6);
  }

  function draw(t) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.globalAlpha = 1;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var mn = Math.min(W, H);
    var cx = W / 2, cy = H / 2;
    var R = 0.425 * mn;              // mandala diameter = 85% of smaller side
    var hubR = 0.052 * mn;
    var coreW = Math.max(3, 0.017 * mn);
    var rot = rotationAt(t);
    var b = breathe(t);

    // Wall wash: layered alpha discs in each tube's color, strung along the
    // tube's direction and rotated with the mandala. Drawn first, behind
    // everything, at low alpha so the colors blend on the "wall".
    var washFracs = [0.5, 0.78, 1.04];
    var washRadii = [0.34, 0.24, 0.15];
    var washAlphas = [0.030, 0.042, 0.055];
    for (var i = 0; i < 12; i++) {
      var a = rot + i * Math.PI / 6;
      var col = tubeColor(tubes[i]);
      ctx.fillStyle = col;
      for (var f = 0; f < washFracs.length; f++) {
        var wx = cx + Math.cos(a) * R * washFracs[f];
        var wy = cy + Math.sin(a) * R * washFracs[f];
        for (var r = 0; r < washRadii.length; r++) {
          ctx.globalAlpha = washAlphas[r] * b;
          ctx.beginPath();
          ctx.arc(wx, wy, washRadii[r] * mn * (1 - f * 0.12), 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Tubes: layered alpha strokes, widening passes first, bright core last.
    var passes = [
      { w: 6.0, a: 0.045 },
      { w: 3.6, a: 0.085 },
      { w: 2.2, a: 0.15 },
      { w: 1.35, a: 0.30 },
      { w: 1.0, a: 0.96 }
    ];
    ctx.lineCap = "round";
    for (var p = 0; p < passes.length; p++) {
      for (var m = 0; m < 12; m++) {
        var tube = tubes[m];
        var ang = rot + m * Math.PI / 6 - Math.PI / 2;
        var pu = pulse(tube, t);
        var bright = b * (1 + 0.9 * pu);
        var r0 = hubR * 0.5;
        var r1 = R * tube.lenJitter;
        ctx.strokeStyle = tubeColor(tube);
        ctx.globalAlpha = Math.min(1, passes[p].a * bright);
        ctx.lineWidth = coreW * passes[p].w * (1 + 0.30 * pu);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
        ctx.lineTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
        ctx.stroke();
      }
    }

    // Hub: a plain dark disc capping the tube roots. No leading, no ornament.
    ctx.globalAlpha = 1;
    ctx.fillStyle = HUB;
    ctx.beginPath();
    ctx.arc(cx, cy, hubR, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = HUB;
    ctx.lineWidth = Math.max(1.5, 0.006 * mn);
    ctx.beginPath();
    ctx.arc(cx, cy, hubR * 1.18, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Piece clock: elapsed seconds from the first rAF timestamp. The
  // synchronous first frame is draw(0), a pure function of the seed.
  var startStamp = null;
  var lastTime = 0;
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    lastTime = (stamp - startStamp) / 1000;
    draw(lastTime);
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
  }
  draw(0);
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);

  // Interaction: drag rotates, tap on a tube pulses and retunes it.
  var dragging = false;
  var dragMoved = 0;
  var downX = 0, downY = 0, downT = 0;
  var lastPointerAngle = 0;

  function pointerAngle(x, y) {
    return Math.atan2(y - H / 2, x - W / 2);
  }
  function wrapPi(a) {
    while (a > Math.PI) a -= 2 * Math.PI;
    while (a < -Math.PI) a += 2 * Math.PI;
    return a;
  }
  function eventPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener("pointerdown", function (e) {
    var pos = eventPos(e);
    dragging = true;
    dragMoved = 0;
    downX = pos.x; downY = pos.y; downT = lastTime;
    lastPointerAngle = pointerAngle(pos.x, pos.y);
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var pos = eventPos(e);
    dragMoved += Math.abs(pos.x - downX) + Math.abs(pos.y - downY);
    downX = pos.x; downY = pos.y;
    var a = pointerAngle(pos.x, pos.y);
    var d = wrapPi(a - lastPointerAngle);
    lastPointerAngle = a;
    // Dragging near the hub gives wild angles; only trust a sane radius.
    var rr = Math.sqrt(Math.pow(pos.x - W / 2, 2) + Math.pow(pos.y - H / 2, 2));
    if (rr > 0.08 * Math.min(W, H)) pushTarget(lastTime, currentTarget() + d);
  });

  canvas.addEventListener("pointerup", function (e) {
    if (!dragging) return;
    dragging = false;
    var pos = eventPos(e);
    var quick = (lastTime - downT) < 0.35;
    var still = dragMoved < 12;
    if (!quick || !still) return;
    // Tap: hit-test against tubes at current rotation.
    var mn = Math.min(W, H);
    var R = 0.425 * mn, hubR = 0.052 * mn;
    var dx = pos.x - W / 2, dy = pos.y - H / 2;
    var r = Math.sqrt(dx * dx + dy * dy);
    if (r < hubR * 0.8 || r > R * 1.10) return;
    var local = wrapPi(Math.atan2(dy, dx) + Math.PI / 2 - rotationAt(lastTime));
    var idx = Math.round(local / (Math.PI / 6));
    var diff = Math.abs(wrapPi(local - idx * Math.PI / 6));
    if (diff > Math.PI / 12) return;
    var tube = tubes[((idx % 12) + 12) % 12];
    var tones = FAMILIES[tube.family];
    tube.step = (tube.step + 1) % tones.length;   // retune inside the family
    tube.pulseAt = lastTime;                       // pulse starts now
    draw(lastTime);
  });

  canvas.addEventListener("pointercancel", function () { dragging = false; });
})();
</script>
</body>
</html>
