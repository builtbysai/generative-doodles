<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.303 Swan Quartet</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#C9CFC0; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.303 Swan Quartet (Ali Fisher).
// A tall porcelain vase carrying one swan motif repeated four
// times at ninety degree intervals in cobalt underglaze, with
// sparse sage reeds between the swans. The swans sit on a
// virtual cylinder: drag horizontally to turn the vessel and
// each motif foreshortens by the cosine of its angle, drawn
// back to front by depth. Release eases to the nearest
// quarter turn with no inertia. Every nine seconds one swan
// bows its neck, rotating deterministically through the four.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PORCELAIN = '#FAF8F2', COBALT = '#2B5EA7', SAGE = '#7A8B6F', GROUND = '#C9CFC0';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 2.25, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var CX = 640;

var SWANS = [0, 1, 2, 3];
if (SWANS.length !== 4) throw new Error('Swan Quartet needs exactly 4 swans');
var REEDS = [0, 1, 2, 3];
if (REEDS.length !== 4) throw new Error('Swan Quartet needs exactly 4 reed groups');

var rot = 0;
var targetRot = 0;
var dragging = false;
var dragStartX = 0;
var dragStartRot = 0;

function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function oval(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }

// ---- vase -----------------------------------------------------------
// Lathe silhouette: flared lip, narrow neck, swelling shoulder,
// broad body tapering to a small foot. Centred, full height.
function vasePath() {
  ctx.beginPath();
  ctx.moveTo(CX - 62, 78);
  ctx.bezierCurveTo(CX - 78, 104, CX - 70, 128, CX - 52, 146);
  ctx.bezierCurveTo(CX - 44, 178, CX - 48, 204, CX - 66, 232);
  ctx.bezierCurveTo(CX - 132, 282, CX - 188, 368, CX - 192, 486);
  ctx.bezierCurveTo(CX - 195, 604, CX - 150, 714, CX - 92, 776);
  ctx.bezierCurveTo(CX - 80, 792, CX - 78, 806, CX - 84, 822);
  ctx.lineTo(CX + 84, 822);
  ctx.bezierCurveTo(CX + 78, 806, CX + 80, 792, CX + 92, 776);
  ctx.bezierCurveTo(CX + 150, 714, CX + 195, 604, CX + 192, 486);
  ctx.bezierCurveTo(CX + 188, 368, CX + 132, 282, CX + 66, 232);
  ctx.bezierCurveTo(CX + 48, 204, CX + 44, 178, CX + 52, 146);
  ctx.bezierCurveTo(CX + 70, 128, CX + 78, 104, CX + 62, 78);
  ctx.closePath();
}
function drawVaseBase() {
  vasePath();
  ctx.fillStyle = PORCELAIN; ctx.fill();
}
function drawVaseTrim() {
  // cobalt underglaze bands at lip, neck, shoulder and foot,
  // clipped inside the silhouette so they follow its curve
  ctx.save();
  vasePath(); ctx.clip();
  ctx.strokeStyle = COBALT; ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(CX - 90, 112); ctx.lineTo(CX + 90, 112); ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(CX - 90, 126); ctx.lineTo(CX + 90, 126); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(CX - 110, 196); ctx.lineTo(CX + 110, 196); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX - 130, 210); ctx.lineTo(CX + 130, 210); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(CX - 220, 742); ctx.lineTo(CX + 220, 742); ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(CX - 220, 756); ctx.lineTo(CX + 220, 756); ctx.stroke();
  // faint vertical curvature lines at the silhouette edges
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = COBALT;
  ctx.beginPath(); ctx.moveTo(CX - 168, 360); ctx.bezierCurveTo(CX - 178, 480, CX - 158, 620, CX - 108, 730); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX + 168, 360); ctx.bezierCurveTo(CX + 178, 480, CX + 158, 620, CX + 108, 730); ctx.stroke();
  ctx.restore();
  vasePath();
  ctx.strokeStyle = COBALT; ctx.lineWidth = 4.5; ctx.stroke();
}

// ---- swan motif -------------------------------------------------------
// One motif in local coordinates, origin at the body centre.
// Body with layered wing arcs, a tail flick, an S curve neck
// drawn as two parallel lines and a small head. Bow amount b
// in 0..1 lowers the head and deepens the S by moving the
// neck control points down and forward.
function drawSwan(b) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // tail flick at the back of the body
  ctx.strokeStyle = COBALT; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-70, -8); ctx.bezierCurveTo(-102, -28, -106, -56, -90, -72); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-62, 4); ctx.bezierCurveTo(-88, -12, -92, -34, -82, -50); ctx.stroke();
  // body outline
  ctx.beginPath();
  ctx.moveTo(-88, 12);
  ctx.bezierCurveTo(-86, -34, -42, -54, 8, -52);
  ctx.bezierCurveTo(58, -50, 92, -24, 94, 10);
  ctx.bezierCurveTo(95, 44, 50, 64, -8, 64);
  ctx.bezierCurveTo(-58, 64, -86, 44, -88, 12);
  ctx.closePath();
  ctx.fillStyle = PORCELAIN; ctx.fill();
  ctx.strokeStyle = COBALT; ctx.lineWidth = 5; ctx.stroke();
  // layered wing arcs: nested domes inside the body
  ctx.lineWidth = 3.6;
  var radii = [58, 44, 30];
  for (var i = 0; i < radii.length; i++) {
    ctx.beginPath();
    ctx.arc(-6, 34, radii[i], Math.PI * 1.12, Math.PI * 1.88);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(-52, 40); ctx.bezierCurveTo(-16, 24, 24, 24, 58, 36); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-40, 50); ctx.bezierCurveTo(-10, 38, 20, 38, 46, 46); ctx.stroke();
  // neck: S curve, two parallel strokes offset sideways
  var hx = 60 + b * 12, hy = -168 + b * 38;
  var c1x = 88, c1y = -52 + b * 10;
  var c2x = 34, c2y = -108 + b * 22;
  var offs = [-11, 11];
  ctx.lineWidth = 4.2;
  for (var o = 0; o < offs.length; o++) {
    var dx = offs[o];
    ctx.beginPath();
    ctx.moveTo(44 + dx, -24);
    ctx.bezierCurveTo(c1x + dx, c1y, c2x + dx, c2y, hx + dx * 0.6, hy + 10);
    ctx.stroke();
  }
  // head: a small oval tilted along the neck, an eye, a beak
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(0.45 + b * 0.5);
  oval(0, 0, 24, 14);
  ctx.fillStyle = PORCELAIN; ctx.fill();
  ctx.strokeStyle = COBALT; ctx.lineWidth = 4.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16, 3); ctx.lineTo(36, 12); ctx.lineTo(14, 12); ctx.closePath();
  ctx.fillStyle = COBALT; ctx.fill();
  ctx.restore();
  oval(hx - 5, hy - 3, 3.2, 3.2);
  ctx.fillStyle = COBALT; ctx.fill();
}

// ---- reeds ------------------------------------------------------------
// A sparse group of three sage stems with small leaf ticks.
function drawReeds(seed) {
  ctx.strokeStyle = SAGE; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var stems = [[-22, 10], [0, -8], [22, 6]];
  for (var i = 0; i < stems.length; i++) {
    var x = stems[i][0], sway = stems[i][1] + (seed % 3) * 2;
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(x, 78);
    ctx.bezierCurveTo(x + sway * 0.4, 30, x - sway * 0.4, -30, x + sway, -78);
    ctx.stroke();
    // leaf ticks
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(x + sway * 0.2, 18); ctx.lineTo(x + sway * 0.2 - 14, 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - sway * 0.1, -22); ctx.lineTo(x - sway * 0.1 + 14, -36); ctx.stroke();
    // seed head: a short cluster of ticks at the tip
    ctx.beginPath(); ctx.moveTo(x + sway, -78); ctx.lineTo(x + sway - 6, -92); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + sway, -78); ctx.lineTo(x + sway + 6, -92); ctx.stroke();
  }
}

// ---- cylinder projection ----------------------------------------------
// Items are placed by angle around the vase. Projected x is
// the sine of the angle times the cylinder radius, width is
// scaled by the cosine, and depth is the cosine for draw
// order. Items on the back half are hidden by the vessel.
function project(angle) {
  var c = Math.cos(angle), s = Math.sin(angle);
  return { x: CX + s * 178, cos: c, sin: s, depth: c };
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  // soft ground shadow line under the foot, flat colour only
  ctx.fillStyle = SAGE;
  ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.ellipse(CX, 834, 150, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  drawVaseBase();

  // bow state: one swan per nine second beat, in order
  var beat = Math.floor(T / 9);
  var bowIdx = ((beat % 4) + 4) % 4;
  var phase = (T - beat * 9) / 9;
  var bowEnv = Math.sin(phase * Math.PI);

  // Build the full ring: swans at quarter turns, reeds between.
  var items = [];
  var i, p;
  for (i = 0; i < SWANS.length; i++) {
    p = project(rot + i * Math.PI / 2);
    items.push({ kind: 'swan', idx: i, proj: p, bow: (i === bowIdx ? bowEnv : 0) });
  }
  for (i = 0; i < REEDS.length; i++) {
    p = project(rot + i * Math.PI / 2 + Math.PI / 4);
    items.push({ kind: 'reed', idx: i, proj: p, bow: 0 });
  }
  // draw order by depth, back first
  items.sort(function (a, b2) { return a.proj.depth - b2.proj.depth; });

  ctx.save();
  vasePath(); ctx.clip();
  for (i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.proj.cos < -0.22) continue;
    var sx = Math.max(0.06, it.proj.cos);
    ctx.save();
    ctx.translate(it.proj.x, it.kind === 'swan' ? 452 : 452);
    ctx.scale(sx, 1);
    if (it.kind === 'swan') drawSwan(it.bow); else drawReeds(it.idx);
    ctx.restore();
  }
  ctx.restore();

  drawVaseTrim();
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  dragging = true;
  dragStartX = toDesign(e)[0];
  dragStartRot = rot;
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var dx = toDesign(e)[0] - dragStartX;
  rot = dragStartRot + dx * 0.0052;
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  targetRot = Math.round(rot / (Math.PI / 2)) * (Math.PI / 2);
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK; acc -= TICK; guard++;
    if (!dragging) {
      // ease to the nearest quarter turn, no inertia
      var diff = targetRot - rot;
      if (Math.abs(diff) < 0.0008) rot = targetRot;
      else rot += diff * 0.07;
    }
  }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
