<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mill Owners, Repeating</title>
<style>
  html, body { margin: 0; padding: 0; background: #A63A2A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: madder red field, black architectural triangles, brighter applique.
  var GROUND = '#A63A2A', WASH = '#7E2A1F', INK = '#1E1A16',
      PATCH = '#C0503A', STITCH = '#E5D9C4', MISS = '#5A4640';

  // Seeded PRNG (mulberry32). No Math.random anywhere: every loop reseeds
  // deterministically from the loop index, so repeated loads replay the same
  // sequence of mis-registration maps.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, cell = 84, margin = 12;
  var motifs = [];   // boustrophedon order: {x,y,rot,dx,dy,miss,mx,my}
  var patches = [];  // {x,y,w,h} placed over regular (non-misregistered) cells
  var washes = [];   // {x,y,rx,ry,a,ph}
  var cols = 0, rows = 0, count = 0;
  var curLoop = 0;

  var STAMP_STEP = 0.06, PATCH_STEP = 1.2, HOLD_DUR = 6;
  function stampDur() { return count * STAMP_STEP; }
  function patchDur() { return patches.length * PATCH_STEP; }
  function loopDur() { return stampDur() + patchDur() + HOLD_DUR; }
  // Frame one sits at the start of the hold phase: the field complete, the
  // patches stitched on, breathing. After the hold the loop reseeds and
  // stamping begins again.
  function loopIndexAt(t) {
    return Math.floor((t + stampDur() + patchDur()) / loopDur());
  }
  function phaseAt(t) {
    var L = loopDur();
    var p = (t + stampDur() + patchDur()) % L;
    if (p < 0) p += L;
    return p;
  }

  function build() {
    var rng = mulberry32((20260701 + curLoop * 2654435761) >>> 0);
    cols = Math.max(1, Math.floor((W - margin * 2) / cell));
    rows = Math.max(1, Math.floor((H - margin * 2) / cell));
    var ox = margin + ((W - margin * 2) - cols * cell) / 2;
    var oy = margin + ((H - margin * 2) - rows * cell) / 2;
    motifs = [];
    var order = [];
    for (var r = 0; r < rows; r++) {
      if (r % 2 === 0) { for (var c = 0; c < cols; c++) order.push([c, r]); }
      else { for (var c2 = cols - 1; c2 >= 0; c2--) order.push([c2, r]); }
    }
    for (var i = 0; i < order.length; i++) {
      var c = order[i][0], r2 = order[i][1];
      // Every 5th motif mis-registers: an offset double-stamp.
      var miss = (i % 5 === 4);
      motifs.push({
        x: ox + c * cell + cell / 2, y: oy + r2 * cell + cell / 2,
        rot: (rng() - 0.5) * 2 * 2.5 * Math.PI / 180,
        dx: (rng() - 0.5) * 6, dy: (rng() - 0.5) * 6,
        miss: miss, mx: 4 + rng() * 2, my: 3 + rng() * 2
      });
    }
    count = motifs.length;
    // Applique patches: 3-4 stitched rectangles over the most regular areas,
    // i.e. cells that are NOT misregistered, so they interrupt, not decorate.
    var regular = [];
    for (var j = 0; j < motifs.length; j++) if (!motifs[j].miss) regular.push(j);
    var np = 3 + Math.floor(rng() * 2);
    patches = [];
    for (var k = 0; k < np && regular.length; k++) {
      var placed = false;
      for (var attempt = 0; attempt < 12 && !placed && regular.length; attempt++) {
        var ri = Math.floor(rng() * regular.length);
        var pick = regular[ri];
        var m = motifs[pick];
        var pw = W * (0.08 + rng() * 0.07);
        var ph = pw * 1.3;
        // Clamp inside the frame so no patch is ever cut at an edge.
        var px = Math.max(8, Math.min(W - pw - 8, m.x - pw / 2));
        var py = Math.max(8, Math.min(H - ph - 8, m.y - ph / 2));
        var clash = false;
        for (var q = 0; q < patches.length; q++) {
          var op = patches[q];
          if (px < op.x + op.w + 24 && px + pw + 24 > op.x &&
              py < op.y + op.h + 24 && py + ph + 24 > op.y) { clash = true; break; }
        }
        if (!clash) {
          patches.push({ x: px, y: py, w: pw, h: ph });
          regular.splice(ri, 1);
          placed = true;
        }
      }
    }
    // Wash variation blobs: large flat-alpha darker madder pools.
    washes = [];
    for (var w2 = 0; w2 < 6; w2++) {
      washes.push({
        x: rng() * W, y: rng() * H,
        rx: W * (0.12 + rng() * 0.18), ry: H * (0.10 + rng() * 0.16),
        a: 0.07 + rng() * 0.07, ph: rng() * Math.PI * 2
      });
    }
  }

  function size() {
    var vv = window.visualViewport;
    var vw = (vv && vv.width) ? vv.width : window.innerWidth;
    var vh = (vv && vv.height) ? vv.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    var phone = Math.min(window.screen.width, window.screen.height) < 700 ||
      (H > W * 1.15 && Math.min(W, H) < 700);
    cell = phone ? 58 : 76;
    if (W < 500) cell = 56;
    build();
  }

  // One architectural triangle: a right triangle with a separate diagonal
  // brise-soleil fin floating parallel to its hypotenuse, split from the
  // triangle by a gap of ground color so the fin reads on its own.
  function triangle(cx, cy, s, rot) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(-s * 0.55, s * 0.5);
    ctx.lineTo(s * 0.55, s * 0.5);
    ctx.lineTo(s * 0.55, -s * 0.5);
    ctx.closePath();
    ctx.fill();
    // Fin: hypotenuse endpoints P1(-0.55, 0.5) and P2(0.55, -0.5); outward
    // normal (-1.0, -1.1)/1.486; bar from gap 0.10s to 0.18s outward.
    var nx = -1.0 / 1.486, ny = -1.1 / 1.486;
    var g1 = 0.10 * s, g2 = 0.18 * s;
    ctx.beginPath();
    ctx.moveTo(-s * 0.55 + nx * g1, s * 0.5 + ny * g1);
    ctx.lineTo(s * 0.55 + nx * g1, -s * 0.5 + ny * g1);
    ctx.lineTo(s * 0.55 + nx * g2, -s * 0.5 + ny * g2);
    ctx.lineTo(-s * 0.55 + nx * g2, s * 0.5 + ny * g2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Dashed rectangle drawn by hand (no setLineDash dependency): dashes
  // appear progressively up to `prog` (0..1) of the perimeter, walking the
  // whole perimeter as one polyline so the border is complete at prog = 1.
  function dashedRect(x, y, w, h, prog) {
    var pts = [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]];
    var target = 2 * (w + h) * prog;
    var pos = 0, si = 0, st = 0;
    ctx.strokeStyle = STITCH;
    ctx.lineWidth = 2;
    while (pos < target && si < pts.length - 1) {
      var ax = pts[si][0], ay = pts[si][1];
      var bx = pts[si + 1][0], by = pts[si + 1][1];
      var segLen = Math.abs(bx - ax) + Math.abs(by - ay);
      var dash = Math.min(6, segLen - st, target - pos);
      var f1 = st / segLen, f2 = (st + dash) / segLen;
      ctx.beginPath();
      ctx.moveTo(ax + (bx - ax) * f1, ay + (by - ay) * f1);
      ctx.lineTo(ax + (bx - ax) * f2, ay + (by - ay) * f2);
      ctx.stroke();
      var adv = dash + 5;
      pos += adv; st += adv;
      while (st >= segLen && si < pts.length - 1) { st -= segLen; si++; }
    }
  }

  function draw(t) {
    var li = loopIndexAt(t);
    if (li !== curLoop) { curLoop = li; build(); }
    var ph = phaseAt(t);
    var sd = stampDur(), pd = patchDur();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Wash variation, breathing almost imperceptibly in the hold.
    for (var i = 0; i < washes.length; i++) {
      var wsh = washes[i];
      ctx.fillStyle = WASH;
      ctx.globalAlpha = wsh.a + 0.02 * Math.sin(2 * Math.PI * t / 7 + wsh.ph);
      ctx.beginPath();
      ctx.ellipse(wsh.x, wsh.y, wsh.rx, wsh.ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Stamping phase: motifs appear one at a time, boustrophedon order.
    var shown = count;
    if (ph < sd) shown = Math.floor(ph / STAMP_STEP);
    var s = cell * 0.62;
    for (var j = 0; j < shown && j < motifs.length; j++) {
      var m = motifs[j];
      if (m.miss) {
        ctx.fillStyle = MISS;
        ctx.globalAlpha = 0.55;
        triangle(m.x + m.mx + m.dx, m.y + m.my + m.dy, s, m.rot);
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = INK;
      triangle(m.x + m.dx, m.y + m.dy, s, m.rot);
    }

    // Patch phase: applique rectangles stitch on one at a time.
    if (ph >= sd) {
      var pp = (ph - sd) / PATCH_STEP;
      for (var k = 0; k < patches.length; k++) {
        if (k > pp) break;
        var p = patches[k];
        var prog = Math.min(1, pp - k);
        ctx.globalAlpha = Math.min(1, prog * 2);
        ctx.fillStyle = PATCH;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.globalAlpha = 1;
        dashedRect(p.x + 6, p.y + 6, p.w - 12, p.h - 12, prog);
      }
    }
  }

  function onResize() { size(); draw(0); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  size();
  // Boot flag (the N1275 rule): the synchronous first frame draws at exactly
  // t = 0. The clock starts only with the rAF loop below.
  draw(0);

  var T0 = (typeof performance !== 'undefined' && performance.now)
    ? performance.now() : 0;
  function now() {
    if (typeof performance !== 'undefined' && performance.now)
      return (performance.now() - T0) / 1000;
    return 0;
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    (function loop() {
      draw(now());
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
