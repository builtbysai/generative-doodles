<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- piece-9120-swell-line -->
<title>Swell Line</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
               background: #0d0a14; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ---- driver (pure; mirrors work/9120/driver.js) ----
function surfPulse(t, T) { return Math.sin((2 * Math.PI * t) / T); }
function meltDy(y, h, w, A, phase) {
  const d = (y - h) / w;
  return A * Math.exp(-d * d) * phase;
}
function sunStretch(phase) { return 1 + 0.2 * phase; }
function bandParams(H) {
  return { h: 0.52 * H, w: 0.026 * H, A: 0.028 * H, k: 0.006 };
}
function sunStretchOffset(y, sunY, sunR, phase) {
  const d = (y - sunY) / (2 * sunR);
  return (y - sunY) * (sunStretch(phase) - 1) * Math.exp(-d * d);
}
function reflectWobble(depthPx, phase, k) { return k * depthPx * phase; }
function swellLight(phase) { return 0.5 + 0.5 * phase; }
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function layout(seed, W, H) {
  const r = rng(seed);
  const n = 3 + Math.floor(r() * 3);
  const clusters = [];
  for (let i = 0; i < n; i++) {
    let x = 0.04 + 0.92 * r();
    if (Math.abs(x - 0.62) < 0.18) {
      x += (x < 0.62 ? -0.22 : 0.22);
      x = Math.min(0.96, Math.max(0.04, x));
    }
    clusters.push({
      x: x,
      baseY: 0.42 + 0.10 * r(),
      stems: 5 + Math.floor(r() * 6),
      lean: -0.35 + 0.7 * r(),
      height: (0.10 + 0.09 * r()) * H,
      seed2: Math.floor(r() * 1e9)
    });
  }
  return clusters;
}
const PALETTES = [
  { sky: ['#141238','#241b4d','#3d2560','#6b2f5e','#a84a52','#e0704a','#ff9a52'],
    sea: ['#5a2f52','#33244a','#1c1c3e','#12122a'], sun: '#ffd9a0', halo: '#ff8a4a', ink: '#0d0a14' },
  { sky: ['#0e0c22','#1d1440','#322058','#54295e','#7d3a66','#b45a6e','#e8847c'],
    sea: ['#4a2c56','#2a1e44','#181834','#0e0e22'], sun: '#ffe6c8', halo: '#e0708a', ink: '#0b0812' },
  { sky: ['#181420','#2a1e2e','#4a2a34','#7a3a38','#b05a40','#e08a4e','#f7b05e'],
    sea: ['#5a3440','#3a2434','#201c2c','#121018'], sun: '#fff0c0', halo: '#e09a4a', ink: '#0e0a10' }
];
function paletteFor(seed) { return PALETTES[seed % PALETTES.length]; }
function periodFor(seed) { return 7 + (seed % 5000) / 5000 * 5; }

// ---- scene ----
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const scene = document.createElement('canvas');
const sctx = scene.getContext('2d');
let W = 0, H = 0, horizon = 0;
let seed = (Date.now() % 100000) | 0;
let T = periodFor(seed), pal = paletteFor(seed);
let clusters = [], sunX = 0, sunY = 0, sunR = 0, shimmer = [];

const noiseTile = document.createElement('canvas');
noiseTile.width = noiseTile.height = 128;
(function () {
  const nctx = noiseTile.getContext('2d');
  const img = nctx.createImageData(128, 128);
  const rr = rng(4242);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = (rr() * 255) | 0;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 22;
  }
  nctx.putImageData(img, 0, 0);
})();

function drawReed(g, x, yBase, lean, stemH, ink, r2) {
  // one tapered blade curving upward
  const tipX = x + lean * stemH, tipY = yBase - stemH;
  const cx = x + lean * stemH * 0.25, cy = yBase - stemH * 0.6;
  g.strokeStyle = ink;
  g.lineWidth = Math.max(1.5, stemH * 0.035);
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(x, yBase);
  g.quadraticCurveTo(cx, cy, tipX, tipY);
  g.stroke();
  // frond blades fanning upward from the tip (narrow fan: reeds, not branches)
  const rr = rng(r2);
  const blades = 4 + Math.floor(rr() * 3);
  for (let b = 0; b < blades; b++) {
    const a = -Math.PI / 2 + (b / (blades - 1) - 0.5) * 1.1 + lean * 0.5;
    const len = stemH * (0.32 + rr() * 0.35);
    const ex = tipX + Math.cos(a) * len, ey = tipY + Math.sin(a) * len;
    g.lineWidth = Math.max(1, stemH * 0.016);
    g.beginPath();
    g.moveTo(tipX, tipY);
    g.quadraticCurveTo(tipX + Math.cos(a) * len * 0.5,
                       tipY + Math.sin(a) * len * 0.5 - len * 0.22, ex, ey);
    g.stroke();
  }
}

function lerpHex(a, b, f) {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  const m = pa.map((v, i) => Math.round(v + (pb[i] - v) * f));
  return '#' + m.map(v => v.toString(16).padStart(2, '0')).join('');
}
function ramp(colors, steps) {
  const out = [];
  for (let i = 0; i < steps; i++) {
    const pos = i / (steps - 1) * (colors.length - 1);
    const j = Math.min(colors.length - 2, Math.floor(pos));
    out.push(lerpHex(colors[j], colors[j + 1], pos - j));
  }
  return out;
}

function buildScene() {
  pal = paletteFor(seed);
  T = periodFor(seed);
  clusters = layout(seed, W, H);
  scene.width = W; scene.height = H;
  const g = sctx;
  const bp0 = bandParams(H);
  horizon = Math.round(bp0.h);

  // sky bands (interpolated ramp: dusk with visible banding, grain on top)
  const skyRamp = ramp(pal.sky, 18);
  const nSky = skyRamp.length;
  for (let i = 0; i < nSky; i++) {
    g.fillStyle = skyRamp[i];
    g.fillRect(0, Math.floor(horizon * i / nSky), W, Math.ceil(horizon / nSky) + 1);
  }
  // sea bands
  const seaH = H - horizon, nSea = pal.sea.length;
  for (let i = 0; i < nSea; i++) {
    g.fillStyle = pal.sea[i];
    g.fillRect(0, horizon + Math.floor(seaH * i / nSea), W, Math.ceil(seaH / nSea) + 1);
  }

  // sun + halo
  sunX = W * 0.62; sunY = horizon - H * 0.035; sunR = Math.max(14, H * 0.045);
  g.fillStyle = pal.halo; g.globalAlpha = 0.28;
  for (let i = 3; i >= 1; i--) {
    g.beginPath();
    g.ellipse(sunX, sunY, sunR * (1 + i * 0.55), sunR * (1 + i * 0.4), 0, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = pal.sun;
  g.beginPath(); g.arc(sunX, sunY, sunR, 0, Math.PI * 2); g.fill();

  // sun reflection column (painted dashes in the scene; shear animates them)
  g.fillStyle = pal.sun;
  const rr = rng(seed ^ 0x9e37);
  for (let i = 0; i < 14; i++) {
    const y = horizon + 6 + (seaH - 12) * (i / 14);
    const fade = 1 - i / 14;
    g.globalAlpha = 0.28 * fade;
    const half = sunR * (0.5 + rr() * 0.9) * fade + 2;
    g.fillRect(sunX - half, y, half * 2, Math.max(1.5, seaH * 0.006));
  }
  g.globalAlpha = 1;

  // silhouette clusters + painted reflections
  const ink = pal.ink;
  for (const c of clusters) {
    const bx = c.x * W, by = c.baseY * H;
    const r2 = rng(c.seed2);
    for (let s = 0; s < c.stems; s++) {
      const sx = bx + (r2() - 0.5) * W * 0.05;
      const sh = c.height * (0.6 + r2() * 0.7);
      const ln = c.lean + (r2() - 0.5) * 0.5;
      drawReed(g, sx, by, ln, sh, ink, (r2() * 1e9) | 0);
      // reflection: mirrored below horizon, squashed, translucent
      g.save();
      g.globalAlpha = 0.34;
      g.translate(0, horizon);
      g.scale(1, -0.62);
      g.translate(0, -horizon);
      drawReed(g, sx, by, ln, sh, ink, (r2() * 1e9) | 0);
      g.restore();
      g.globalAlpha = 1;
    }
  }

  // seeded shimmer streak positions (animated per-frame)
  shimmer = [];
  const rs = rng(seed ^ 0x51ab);
  for (let i = 0; i < 26; i++) {
    shimmer.push({
      y: horizon + seaH * (0.04 + 0.9 * rs()),
      x: rs(), len: 0.02 + rs() * 0.09, sp: 0.2 + rs() * 0.8
    });
  }
}

function frame(nowMs) {
  const t = nowMs / 1000;
  const phase = surfPulse(t, T);
  const bp = bandParams(H);
  const w = bp.w, A = bp.A, k = bp.k;

  // clear so slice steps never leave torn gaps, then slice the scene:
  // melt displacement + sun stretch + water shear (overlapping slices, no rounding)
  ctx.fillStyle = pal.sea[pal.sea.length - 1];
  ctx.fillRect(0, 0, W, H);
  const slice = 2;
  for (let y = 0; y < H; y += slice) {
    const yc = y + slice / 2;
    const dy = meltDy(yc, horizon, w, A, phase)
             + sunStretchOffset(yc, sunY, sunR, phase);
    let dx = 0;
    if (yc > horizon) dx = reflectWobble(yc - horizon, phase, k);
    ctx.drawImage(scene, 0, y, W, slice, dx, y + dy, W, slice + 3);
  }

  // swell light: brighten the melt band with the pulse
  const v = swellLight(phase);
  ctx.globalAlpha = 0.12 * v;
  ctx.fillStyle = pal.sun;
  ctx.fillRect(0, horizon - w, W, w * 2);
  ctx.globalAlpha = 1;

  // animated shimmer streaks on the water
  ctx.fillStyle = pal.sun;
  for (const s of shimmer) {
    const depth = s.y - horizon;
    const x = (s.x * W + reflectWobble(depth, phase, k) * s.sp) % W;
    ctx.globalAlpha = 0.10 + 0.25 * v * (1 - depth / (H - horizon));
    ctx.fillRect(x - s.len * W / 2, s.y, s.len * W, 2);
  }
  ctx.globalAlpha = 1;

  // grain
  const pat = ctx.createPattern(noiseTile, 'repeat');
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = pat;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.floor(window.innerWidth * dpr);
  H = Math.floor(window.innerHeight * dpr);
  cv.width = W; cv.height = H;
  buildScene();
}

let rt = null;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(resize, 150);
});
window.addEventListener('pointerdown', () => {
  seed = (Date.now() % 1000000) | 0;
  buildScene();
});

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
