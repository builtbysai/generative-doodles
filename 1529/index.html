<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Channels, Two Times</title>
<style>
html, body { margin: 0; padding: 0; background: #1a1d22; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, fieldX = 0, fieldY = 0, fieldW = 0, fieldH = 0;
var lastT = 0;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rnd4(v) { return Math.round(v * 10000) / 10000; }

// Seeded PRNG (mulberry32), seed 1529000. Fixed for the piece lifetime.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(1529000);

// Loop: 72 s. Left cycle: 8 decorations, one attached every 6 s (0-48 s),
// then fading one by one every 3 s (48-72 s). Parade period 8 s, so 9 full
// rotations per loop; the two clocks close jointly at t = 72.
var LOOP = 72;
var DEC_N = 8;
var DEC_COLORS = ['#c23b2a', '#c9a86a', '#d8d8d8'];
var DEC_RGB = [[194, 59, 42], [201, 168, 106], [216, 216, 216]];

// Decoration slots around the left central mark: fixed seeded angles/radii.
var slots = [];
for (var i = 0; i < DEC_N; i++) {
  slots.push({
    ang: rand() * Math.PI * 2,
    rad: 1.7 + rand() * 0.6,
    type: i % 3,
    col: i % 3
  });
}
// Four preparer marks around the central mark (seeded panel fractions).
var preps = [];
for (var j = 0; j < 4; j++) {
  preps.push({ fx: 0.16 + rand() * 0.68, fy: 0.18 + rand() * 0.64 });
}
// Five parade marks; each carries two decorations (seeded colors/offsets).
var parade = [];
for (var k = 0; k < 5; k++) {
  parade.push({
    base: k * Math.PI * 2 / 5,
    d1: Math.floor(rand() * 3), o1: -0.35 + rand() * 0.7, t1: Math.floor(rand() * 3),
    d2: Math.floor(rand() * 3), o2: -0.35 + rand() * 0.7, t2: Math.floor(rand() * 3)
  });
}

// ---- Recorded drag events (all motion is a closed-form function of these
// ---- plus piece time; nothing is frame-integrated) ----
var divSessions = [];   // {t0, moves:[{t,x}], t1, finalX}
var divDrag = null;
var leftPresses = [];   // {t}
var paradeSessions = []; // {t0, x0, moves:[{t,x}], t1}
var paradeDrag = null;

function size() {
  var vw = 720, vh = 720;
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.width) {
      vw = window.visualViewport.width; vh = window.visualViewport.height;
    } else if (window.innerWidth) {
      vw = window.innerWidth; vh = window.innerHeight;
    }
  }
  W = vw; H = vh;
  var phone = false;
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) phone = true;
  }
  if (!phone && H > W * 1.15) phone = true;
  if (phone) { fieldX = 0; fieldY = 0; fieldW = W; fieldH = H; }
  else {
    var side = Math.min(W, H);
    fieldX = (W - side) / 2; fieldY = (H - side) / 2; fieldW = side; fieldH = side;
  }
  canvas.width = W; canvas.height = H;
}

function dividerAt(t) {
  var d = 0.5;
  for (var i = 0; i < divSessions.length; i++) {
    var s = divSessions[i];
    if (s.t0 > t) break;
    if (s.t1 === null) d = s.moves.length ? s.moves[s.moves.length - 1].x : s.x0;
    else d = s.finalX;
  }
  return clamp(d, 0.25, 0.75);
}
function hurryCount(t) {
  var n = 0;
  for (var i = 0; i < leftPresses.length; i++) if (leftPresses[i].t <= t) n++;
  return n;
}
// Extra parade rotations accumulated from recorded right-panel drags.
// During a drag the rate shift is clamp((x - x0)/300, -0.5, 1.0), applied
// piecewise-constantly between recorded move events.
function paradeOffset(t) {
  var off = 0;
  for (var i = 0; i < paradeSessions.length; i++) {
    var s = paradeSessions[i];
    if (s.t0 > t) break;
    var end = (s.t1 === null) ? t : Math.min(s.t1, t);
    if (end <= s.t0) continue;
    var prevT = s.t0, prevX = s.x0;
    for (var j = 0; j < s.moves.length; j++) {
      var m = s.moves[j];
      if (m.t > end) break;
      off += clamp((prevX - s.x0) / 300, -0.5, 1.0) / 8 * (m.t - prevT);
      prevT = m.t; prevX = m.x;
    }
    off += clamp((prevX - s.x0) / 300, -0.5, 1.0) / 8 * (end - prevT);
  }
  return off;
}

function toFrac(clientX) { return (clientX - fieldX) / fieldW; }
function onDown(e) {
  size();
  var f = toFrac(e.clientX);
  var d = dividerAt(lastT);
  var divX = fieldX + d * fieldW;
  if (Math.abs(e.clientX - divX) <= 18) {
    divDrag = { t0: lastT, moves: [], t1: null, x0: f, finalX: f };
    divSessions.push(divDrag);
  } else if (f < d) {
    leftPresses.push({ t: lastT });
  } else {
    paradeDrag = { t0: lastT, x0: e.clientX, moves: [], t1: null };
    paradeSessions.push(paradeDrag);
  }
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (divDrag) { size(); divDrag.moves.push({ t: lastT, x: toFrac(e.clientX) }); }
  if (paradeDrag) { paradeDrag.moves.push({ t: lastT, x: e.clientX }); }
}
function onUp() {
  if (divDrag) {
    divDrag.t1 = lastT;
    divDrag.finalX = divDrag.moves.length ? divDrag.moves[divDrag.moves.length - 1].x : divDrag.x0;
    divDrag = null;
  }
  if (paradeDrag) { paradeDrag.t1 = lastT; paradeDrag = null; }
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', size);
  }
  if (window.addEventListener) window.addEventListener('resize', size);
}

function glyph(x, y, s, color, arm, step) {
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2, s * 0.14);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.lineTo(x, y + s);
  ctx.moveTo(x, y - s * 0.6);
  ctx.lineTo(x - s * 0.8, y - s * 0.2 + arm * s * 0.35);
  ctx.moveTo(x, y - s * 0.6);
  ctx.lineTo(x + s * 0.8, y - s * 0.2 - arm * s * 0.35);
  ctx.moveTo(x, y + s);
  ctx.lineTo(x - s * 0.55, y + s * 1.9 - Math.max(0, step) * s * 0.45);
  ctx.moveTo(x, y + s);
  ctx.lineTo(x + s * 0.55, y + s * 1.9 - Math.max(0, -step) * s * 0.45);
  ctx.stroke();
}
function disc(x, y, r, rgb, a) {
  if (a <= 0) return;
  ctx.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + rnd4(a).toFixed(4) + ')';
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
function rosette(x, y, r, rgb, a) {
  if (a <= 0) return;
  ctx.strokeStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + rnd4(a).toFixed(4) + ')';
  ctx.lineWidth = Math.max(1, r * 0.28);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r);
  ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
  ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
  ctx.stroke();
}
function streamer(x, y, r, rgb, a) {
  if (a <= 0) return;
  ctx.strokeStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + rnd4(a).toFixed(4) + ')';
  ctx.lineWidth = Math.max(1, r * 0.3);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r, y - r * 0.4);
  ctx.lineTo(x - r * 0.2, y + r * 0.5);
  ctx.lineTo(x + r * 0.6, y - r * 0.3);
  ctx.lineTo(x + r, y + r * 0.6);
  ctx.stroke();
}
function decoration(type, x, y, r, rgb, a) {
  if (type === 0) disc(x, y, r, rgb, a);
  else if (type === 1) rosette(x, y, r, rgb, a);
  else streamer(x, y, r, rgb, a);
}
// Left-cycle alpha for decoration i: attach ramp 1 s at i*6, hold, fade
// ramp 1 s at 48 + i*3. Never permanently finished: after fading one by
// one the work restarts at the loop boundary.
function decAlpha(cyc, i) {
  var a = i * 6, f = 48 + i * 3;
  if (cyc < a) return 0;
  if (cyc < a + 1) return rnd4(cyc - a);
  if (cyc < f) return 1;
  if (cyc < f + 1) return rnd4(1 - (cyc - f));
  return 0;
}

function draw(t) {
  size();
  lastT = t;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  ctx.fillStyle = '#1a1d22';
  ctx.fillRect(0, 0, W, H);

  var d = dividerAt(t);
  var divX = fieldX + d * fieldW;
  var leftW = divX - fieldX;
  var rightW = fieldX + fieldW - divX;
  var lt = ((t + 3 * hurryCount(t)) % LOOP + LOOP) % LOOP;

  // ---- Left panel: slow preparation ----
  var cxL = fieldX + leftW / 2;
  var cyL = fieldY + fieldH * 0.5;
  var uL = Math.min(leftW, fieldH);
  var sC = uL * 0.09;
  var sway = Math.sin(2 * Math.PI * (lt / LOOP));
  var step = Math.sin(2 * Math.PI * (lt / LOOP) + 1.1);
  glyph(cxL, cyL, sC, '#cfc8b8', sway * 0.4, step * 0.4);
  var leftMarks = [{ x: cxL, y: cyL }];
  for (var i = 0; i < preps.length; i++) {
    var px = fieldX + preps[i].fx * leftW;
    var py = fieldY + preps[i].fy * fieldH;
    glyph(px, py, uL * 0.05, '#cfc8b8',
      Math.sin(2 * Math.PI * (lt / LOOP) + i * 1.7) * 0.5,
      Math.sin(2 * Math.PI * (lt / LOOP) + i * 2.3) * 0.5);
    leftMarks.push({ x: px, y: py });
  }
  var decAlphas = [];
  var attachedFull = 0;
  for (var di = 0; di < DEC_N; di++) {
    var sl = slots[di];
    var a = decAlpha(lt, di);
    decAlphas.push(a);
    if (a >= 0.99) attachedFull++;
    var dx = cxL + Math.cos(sl.ang) * sl.rad * sC;
    var dy = cyL + Math.sin(sl.ang) * sl.rad * sC;
    decoration(sl.type, dx, dy, Math.max(3, sC * 0.3), DEC_RGB[sl.col], a);
  }

  // ---- Right panel: fast parade ----
  var cxR = divX + rightW / 2;
  var cyR = fieldY + fieldH * 0.5;
  var uR = Math.min(rightW, fieldH);
  var R = uR * 0.32;
  ctx.strokeStyle = '#3a3f45';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cxR + R, cyR);
  ctx.arc(cxR, cyR, R, 0, Math.PI * 2);
  ctx.stroke();
  var rot = Math.PI * 2 * (t / 8 + paradeOffset(t));
  var topAng = -Math.PI / 2;
  var rightMarks = [];
  var maxFlash = 0;
  for (var mi = 0; mi < parade.length; mi++) {
    var pm = parade[mi];
    var ang = rot + pm.base;
    var mx = cxR + Math.cos(ang) * R;
    var my = cyR + Math.sin(ang) * R;
    glyph(mx, my, uR * 0.05, '#e8e0d0',
      Math.sin(2 * Math.PI * (t / 8) + mi) * 0.6,
      Math.sin(2 * Math.PI * (t / 8) + mi * 1.3) * 0.6);
    rightMarks.push({ x: mx, y: my });
    var flash = Math.pow(Math.max(0, Math.cos(ang - topAng)), 8);
    var fal = rnd4(0.45 + 0.55 * flash);
    if (fal > maxFlash) maxFlash = fal;
    var dr = Math.max(3, uR * 0.05 * 0.3);
    decoration(pm.t1, mx + Math.cos(ang + pm.o1) * uR * 0.05 * 1.4, my + Math.sin(ang + pm.o1) * uR * 0.05 * 1.4, dr, DEC_RGB[pm.d1], fal);
    decoration(pm.t2, mx + Math.cos(ang + pm.o2) * uR * 0.05 * 1.4, my + Math.sin(ang + pm.o2) * uR * 0.05 * 1.4, dr, DEC_RGB[pm.d2], fal);
  }

  // ---- Divider ----
  ctx.fillStyle = '#3a3f45';
  ctx.fillRect(divX - 1, fieldY, 2, fieldH);

  if (typeof window !== 'undefined') {
    window.__t29 = {
      t: t, divider: d, divX: divX, cycle: lt,
      decAlphas: decAlphas, attachedFull: attachedFull,
      paradeRot: rot, maxFlash: maxFlash,
      field: { x: fieldX, y: fieldY, w: fieldW, h: fieldH },
      left: { x: fieldX, w: leftW, marks: leftMarks },
      right: { x: divX, w: rightW, marks: rightMarks }
    };
  }
}

var startT = null;
function loop(ts) {
  if (startT === null) startT = ts;
  draw((ts - startT) / 1000);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
draw(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
