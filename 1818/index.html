<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twenty Slots</title>
<style>
html, body { margin: 0; padding: 0; background: #232326; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FRAME_T = 63.0; /* fixed phase: t = 63 s, chord born at 60 s aged 3 s, all its slots lit and fading */
var CHORD_EVERY = 6.0; /* seconds between chord births */
var CHORD_LIFE = 6.0; /* seconds a chord stays lit, fading to zero */
var SHIFT_EVERY = 48.0; /* seconds between wheel shifts to a new root slot */
var SHIFT_LEN = 4.0; /* seconds the wheel takes to step to the new root */
var BG = '#232326'; /* charcoal background, also the page ground */
var IVORY = '#EFE8D6'; /* ivory wheel */
var IVORY_DIM = '#D8D0BC';
var CHAR = '#232326'; /* charcoal dividers and figures */
var CHAR_SOFT = '#3A3A3E';
var AMBER = '#E8A33D'; /* slot lights */
var AMBER_DEEP = '#C77F1F';
var INK = '#EFE8D6'; /* plate ink on charcoal */
var PLATE_FILL = '#1B1B1E';
var PLATE_LINE = 'rgba(239,232,214,0.30)';
/* ---- twenty slots from the overtone series ----
   Slot widths are the just-intonation steps between successive
   partials 16 through 36: width i is proportional to log2((16+i+1) /
   (16+i)), the step from one harmonic to the next. The twenty steps
   are normalized so they fill the whole wheel. Because the steps
   shrink as the partials rise, the angular widths are unequal: the
   first slot spans about 26.8 degrees and the last about 12.5
   degrees. No 12-slot equal-temperament grid anywhere: 20 slots,
   none equal. The root label names the partial at the slot's start. */
var N_SLOTS = 20;
var SLOT_START = []; /* start angle of each slot, radians, -PI/2 is top */
var SLOT_END = [];
(function buildSlots() {
  var widths = [], total = 0, i;
  for (i = 0; i < N_SLOTS; i++) {
    var w = Math.log((16 + i + 1) / (16 + i)) / Math.log(2);
    widths.push(w);
    total += w;
  }
  var a = -Math.PI / 2;
  for (i = 0; i < N_SLOTS; i++) {
    SLOT_START.push(a);
    a += TAU * widths[i] / total;
    SLOT_END.push(a);
  }
})();
function slotMid(i) { return (SLOT_START[i] + SLOT_END[i]) / 2; }
function slotWidth(i) { return SLOT_END[i] - SLOT_START[i]; }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth01(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* Deterministic hash: no Math.random anywhere, so every load plays
   the same chords in the same order. */
function hash01(n) {
  var x = (n * 2654435761) >>> 0;
  x ^= x >>> 15; x = (x * 2246822519) >>> 0; x ^= x >>> 13;
  return (x >>> 0) / 4294967296;
}
/* Root slot: the wheel steps one slot every SHIFT_EVERY seconds, so a
   new slot becomes the root at the top pointer. The fundamental pitch
   never moves: the root is always the slot under the fixed top pointer,
   and chords are built as offsets from that root. */
function rootIndex(t) {
  return Math.floor(t / SHIFT_EVERY) % N_SLOTS;
}
/* Chord at time t: born at the last multiple of CHORD_EVERY, 3 to 5
   slots, chosen as harmonic offsets from the current root. Offsets
   come from the first eleven partials folded into the wheel. */
var CHORD_OFFSETS = [0, 3, 4, 7, 9, 10, 12, 14, 16, 17, 19];
function chordAt(t) {
  var k = Math.floor(t / CHORD_EVERY);
  var birth = k * CHORD_EVERY;
  var age = t - birth;
  var root = rootIndex(birth);
  var size = 3 + Math.floor(hash01(k * 7 + 1) * 3); /* 3, 4 or 5 */
  var slots = [];
  var used = {};
  var j;
  for (j = 0; j < size; j++) {
    var off = CHORD_OFFSETS[Math.floor(hash01(k * 13 + j * 5 + 2) * CHORD_OFFSETS.length)];
    var s = (root + off) % N_SLOTS;
    if (used[s]) { /* keep the chord to distinct slots */
      var m;
      for (m = 1; m < N_SLOTS; m++) {
        var cand = (s + m) % N_SLOTS;
        if (!used[cand]) { s = cand; break; }
      }
    }
    used[s] = true;
    slots.push({ slot: s, delay: j * 0.5 }); /* slots light in turn */
  }
  return { birth: birth, age: age, root: root, slots: slots };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  /* Centered geometric piece: keep the square field on phone and
     desktop alike, page ground is the charcoal background. */
  var side = Math.min(VW, VH) - (isPhone ? 24 : 40);
  F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
}
function wheelCx() { return F.x + 0.5 * F.w; }
function wheelCy() { return F.y + 0.42 * F.h; }
function wheelR() { return 0.36 * F.w; }
/* Rotation offset in radians at time t: the wheel steps so the new
   root slot arrives under the fixed top pointer. Slot s sits at
   angle SLOT_START[s] - steps * (its own width is not uniform, so
   the step is measured from the root slot's start angle). */
function wheelAngle(t) {
  var shift = Math.floor(t / SHIFT_EVERY);
  var within = t - shift * SHIFT_EVERY;
  var curRoot = rootIndex(t);
  var aCur = -Math.PI / 2 - SLOT_START[curRoot];
  if (shift === 0) return aCur; /* no shift has happened yet */
  var prevRoot = (shift - 1 + N_SLOTS) % N_SLOTS;
  var aPrev = -Math.PI / 2 - SLOT_START[prevRoot];
  var delta = aCur - aPrev;
  /* shortest-path step between successive roots */
  while (delta > Math.PI) delta -= TAU;
  while (delta < -Math.PI) delta += TAU;
  if (within < SHIFT_LEN) {
    return aPrev + delta * smooth01(within / SHIFT_LEN);
  }
  return aCur;
}
function drawWheel(t) {
  var cx = wheelCx(), cy = wheelCy(), R = wheelR();
  var rot = wheelAngle(t);
  var chord = chordAt(t);
  var i;
  /* Ivory disc. */
  ctx.fillStyle = IVORY;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.fill();
  /* Lit slots: amber wedges, fading with chord age, each slot
     lighting after its small delay. */
  for (i = 0; i < chord.slots.length; i++) {
    var s = chord.slots[i];
    var localAge = chord.age - s.delay;
    if (localAge < 0) continue;
    var fade = 1 - chord.age / CHORD_LIFE;
    var rise = clamp(localAge / 0.6, 0, 1);
    var al = 0.85 * fade * rise;
    if (al <= 0.01) continue;
    ctx.fillStyle = rgba(AMBER, al);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R * 0.97, rot + SLOT_START[s.slot], rot + SLOT_END[s.slot]);
    ctx.closePath();
    ctx.fill();
    /* bright core near the rim of the lit slot */
    ctx.fillStyle = rgba('#F7C96A', al * 0.7);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R * 0.97, rot + SLOT_START[s.slot] + slotWidth(s.slot) * 0.25, rot + SLOT_END[s.slot] - slotWidth(s.slot) * 0.25);
    ctx.closePath();
    ctx.fill();
  }
  /* Slot dividers: charcoal radii at every slot boundary. */
  ctx.strokeStyle = CHAR;
  ctx.lineWidth = Math.max(1.2, F.w * 0.002);
  for (i = 0; i < N_SLOTS; i++) {
    var a = rot + SLOT_START[i];
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * R * 0.14, cy + Math.sin(a) * R * 0.14);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.stroke();
  }
  /* Hub: small charcoal disc with an amber center. */
  ctx.fillStyle = CHAR;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.14, 0, TAU);
  ctx.fill();
  ctx.fillStyle = AMBER;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.05, 0, TAU);
  ctx.fill();
  /* Rim. */
  ctx.strokeStyle = CHAR;
  ctx.lineWidth = Math.max(2, F.w * 0.004);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.stroke();
  /* Root pointer: a fixed amber triangle at the top, pointing at the
     root slot. The wheel moves under it; the pointer never moves. */
  var px = cx, py = cy - R - F.h * 0.012;
  ctx.fillStyle = AMBER;
  ctx.beginPath();
  ctx.moveTo(px - F.w * 0.014, py - F.h * 0.014);
  ctx.lineTo(px + F.w * 0.014, py - F.h * 0.014);
  ctx.lineTo(px, py + F.h * 0.006);
  ctx.closePath();
  ctx.fill();
  /* Root label: the partial at the slot under the pointer, in amber
     so it reads against the charcoal ground above the wheel. */
  var root = rootIndex(t);
  var ratioText = 'P' + (16 + root);
  ctx.fillStyle = AMBER;
  ctx.font = 'bold ' + Math.max(10, Math.round(F.w * 0.02)) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ratioText, cx, cy - R - F.h * 0.038);
}
/* Five small players in a semicircle in front of the wheel, below it.
   Each is a charcoal figure with an ivory face dot; the figure under
   a lit chord slot raises its arm. No faces, no keyboard, no score. */
function drawPlayers(t) {
  var cx = wheelCx(), cy = wheelCy(), R = wheelR();
  var baseY = cy + R * 1.12; /* players stand clear below the wheel rim */
  var chord = chordAt(t);
  var litPlayers = {};
  var i;
  for (i = 0; i < chord.slots.length; i++) {
    litPlayers[chord.slots[i].slot % 5] = true;
  }
  for (i = 0; i < 5; i++) {
    var u = (i - 2) / 2; /* -1 to 1 across the semicircle */
    var px = cx + u * R * 1.05;
    var py = baseY + Math.abs(u) * R * 0.18;
    var bob = Math.sin(TAU * t / 4 + i * 1.3) * F.h * 0.004;
    py += bob;
    var h = F.h * 0.075; /* figure height */
    var w = F.w * 0.028;
    var raised = !!litPlayers[i];
    /* body: a simple charcoal robe */
    ctx.fillStyle = CHAR_SOFT;
    ctx.beginPath();
    ctx.moveTo(px - w, py);
    ctx.lineTo(px - w * 0.55, py - h * 0.62);
    ctx.lineTo(px + w * 0.55, py - h * 0.62);
    ctx.lineTo(px + w, py);
    ctx.closePath();
    ctx.fill();
    /* head: ivory dot */
    ctx.fillStyle = IVORY;
    ctx.beginPath();
    ctx.arc(px, py - h * 0.78, h * 0.16, 0, TAU);
    ctx.fill();
    /* arm: a thin line, raised toward the wheel when this player
       is sounding, resting otherwise. Bow, pluck and strike are
       suggested by the arm angle, not by instruments drawn large. */
    var armA = raised ? -Math.PI / 2 - 0.5 : -Math.PI / 2 + 0.9;
    var ax = px + Math.cos(armA) * h * 0.55;
    var ay = py - h * 0.62 + Math.sin(armA) * h * 0.55;
    ctx.strokeStyle = raised ? AMBER : IVORY_DIM;
    ctx.lineWidth = Math.max(1.5, F.w * 0.003);
    ctx.beginPath();
    ctx.moveTo(px, py - h * 0.62);
    ctx.lineTo(ax, ay);
    ctx.stroke();
    /* bow stick for the two outer players, a short line past the hand */
    if (i === 0 || i === 4) {
      ctx.strokeStyle = IVORY_DIM;
      ctx.lineWidth = Math.max(1, F.w * 0.0016);
      ctx.beginPath();
      ctx.moveTo(ax - h * 0.18, ay - h * 0.12);
      ctx.lineTo(ax + h * 0.18, ay + h * 0.12);
      ctx.stroke();
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Twenty Slots').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Twenty Slots').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 03').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Twenty Slots', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2007 · 01 · 03', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, VW, VH);
  drawWheel(phaseT);
  drawPlayers(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    slotCount: function () { return N_SLOTS; },
    slotWidths: function () { var out = [], i; for (i = 0; i < N_SLOTS; i++) out.push(slotWidth(i)); return out; },
    chordAt: chordAt,
    rootIndex: rootIndex
  };
}
/* ---- frame one: fixed phase t = 63 s ----
   No wall clock is read for frame one. Chord born at 60 s is 3 s old:
   all its slots have lit and are fading together. The wheel has
   completed its shift to root slot 1 (16/16 was root until 48 s, then
   the wheel stepped so slot 1 sits under the pointer). No pointer or
   keyboard handlers are registered: input does nothing by design. */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  var startMs = Date.now();
  (function loop() {
    function step() {
      phaseT = FRAME_T + (Date.now() - startMs) / 1000;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
