<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Path</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5E9C8; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var SKY = '#F5E9C8';
  var OLIVE = '#7A8A4A';
  var SAGE = '#A8B87A';
  var PATH = '#D9C9A3';
  var CHURCH = '#FAF6EC';
  var DOME = '#D9A441';
  var FIGURE = '#2A2320';

  var LOOP_MS = 90000;            // one full pilgrimage
  var PHASE0 = LOOP_MS * 0.33;    // constant first-frame phase: walker a third along

  // mulberry32 seeded RNG
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return H > W * 1.15;
  }

  function fit() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    DPR = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) {
      DPR = Math.min(window.devicePixelRatio, 2);
    }
    W = Math.round(w); H = Math.round(h);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  // ---------- scene generation (all load-time layout from the seeded stream) ----------

  var rng = mulberry32(46408);
  var scene = null;

  function ridgeF(r, x) {   // ridge surface as a fraction of height (size-independent)
    return r.base + Math.sin(x * r.f1 + r.p1) * r.a1 + Math.sin(x * r.f2 + r.p2) * r.a2;
  }
  function ridgeY(r, x) { return ridgeF(r, x) * H; }

  function genScene() {
    var swapped = rng() < 0.5;
    var farCol = swapped ? OLIVE : SAGE;
    var midCol = swapped ? SAGE : OLIVE;

    function mkRidge(base) {
      return {
        base: base,
        f1: 1.6 + rng() * 1.8, p1: rng() * 6.283,
        a1: 0.02 + rng() * 0.028,
        f2: 4.0 + rng() * 3.0, p2: rng() * 6.283,
        a2: 0.008 + rng() * 0.012
      };
    }
    var far = mkRidge(0.47), mid = mkRidge(0.60), near = mkRidge(0.74);
    far.col = farCol; mid.col = midCol; near.col = farCol;

    var churchX = 0.845;
    var churchBaseFrac = ridgeF(far, churchX) + 0.004;

    function j(v, amt) { return v + (rng() * 2 - 1) * amt; }
    // chained cubic beziers: panel 1 start -> seam crossing -> church door.
    // one continuous chain, so panel-1 path end == panel-2 path start by construction.
    var segs = [
      { p0: [-0.02, 0.82], c1: [j(0.12, 0.02), j(0.70, 0.025)], c2: [j(0.22, 0.02), j(0.90, 0.025)], p1: [j(0.36, 0.012), j(0.73, 0.015)] },
      { p0: null, c1: [j(0.44, 0.02), j(0.62, 0.025)], c2: [j(0.47, 0.02), j(0.76, 0.025)], p1: [j(0.57, 0.012), j(0.61, 0.015)] },
      { p0: null, c1: [j(0.65, 0.02), j(0.50, 0.025)], c2: [j(0.73, 0.02), j(0.60, 0.025)], p1: [churchX, churchBaseFrac] }
    ];
    segs[1].p0 = segs[0].p1; segs[2].p0 = segs[1].p1;

    var clouds = [];
    for (var i = 0; i < 4; i++) {
      clouds.push({
        bx: rng() * 1.2 - 0.1,
        y: 0.07 + rng() * 0.17,
        s: 0.55 + rng() * 0.8,
        v: 0.004 + rng() * 0.005   // fraction of width per second, slow drift
      });
    }
    return { far: far, mid: mid, near: near, segs: segs, clouds: clouds, churchX: churchX, churchBaseFrac: churchBaseFrac };
  }

  scene = genScene();

  // ---------- path geometry ----------

  function cubic(s, t) {
    var u = 1 - t;
    return [
      u * u * u * s.p0[0] + 3 * u * u * t * s.c1[0] + 3 * u * t * t * s.c2[0] + t * t * t * s.p1[0],
      u * u * u * s.p0[1] + 3 * u * u * t * s.c1[1] + 3 * u * t * t * s.c2[1] + t * t * t * s.p1[1]
    ];
  }

  function pathPoint(u) {
    var n = scene.segs.length;
    var f = Math.min(u, 0.99999) * n;
    var i = Math.floor(f);
    var pt = cubic(scene.segs[i], f - i);
    return [pt[0] * W, pt[1] * H];
  }

  // ---------- drawing ----------

  function drawRidge(r) {
    ctx.fillStyle = r.col;
    ctx.beginPath();
    var step = Math.max(6, W / 90);
    ctx.moveTo(-4, ridgeY(r, 0));
    for (var x = 0; x <= 1.001; x += step / W) ctx.lineTo(x * W, ridgeY(r, x));
    ctx.lineTo(W + 4, H + 4); ctx.lineTo(-4, H + 4);
    ctx.closePath(); ctx.fill();
  }

  function drawCloud(cl, tSec) {
    var span = 1.3;
    var fx = ((cl.bx + cl.v * tSec) % span + span) % span - 0.15;
    var x = fx * W, y = cl.y * H, s = cl.s * Math.min(W, H) * 0.055;
    ctx.fillStyle = CHURCH;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.ellipse(x, y, s * 1.5, s * 0.52, 0, 0, 6.2832);
    ctx.ellipse(x - s * 0.8, y + s * 0.12, s * 0.85, s * 0.38, 0, 0, 6.2832);
    ctx.ellipse(x + s * 0.85, y + s * 0.1, s * 0.95, s * 0.42, 0, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawChurch() {
    var x = scene.churchX * W, base = scene.churchBaseFrac * H;
    var u = Math.min(W, H);
    var nw = u * 0.085, nh = u * 0.062;      // nave
    var tw = u * 0.034, th = u * 0.105;      // tower
    ctx.fillStyle = CHURCH;
    ctx.fillRect(x - nw / 2, base - nh, nw, nh);
    ctx.beginPath();                        // nave roof
    ctx.moveTo(x - nw / 2 - u * 0.006, base - nh);
    ctx.lineTo(x, base - nh - u * 0.032);
    ctx.lineTo(x + nw / 2 + u * 0.006, base - nh);
    ctx.closePath(); ctx.fill();
    var tx = x - nw / 2 + tw * 0.28;
    ctx.fillRect(tx - tw / 2, base - th, tw, th);
    ctx.fillStyle = DOME;                   // golden dome
    ctx.beginPath();
    ctx.arc(tx, base - th, tw * 0.62, Math.PI, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = DOME;                 // tiny spire
    ctx.lineWidth = Math.max(1.2, u * 0.003);
    ctx.beginPath();
    ctx.moveTo(tx, base - th - tw * 0.62);
    ctx.lineTo(tx, base - th - tw * 0.62 - u * 0.02);
    ctx.stroke();
    ctx.fillStyle = FIGURE;                 // door, where the path arrives
    var dw = u * 0.013, dh = u * 0.026;
    ctx.fillRect(x + nw * 0.16 - dw / 2, base - dh, dw, dh);
  }

  function drawPath() {
    ctx.strokeStyle = PATH;
    ctx.lineWidth = Math.max(5, Math.min(W, H) * (isPhone() ? 0.021 : 0.017));
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    var N = 180;
    for (var i = 0; i <= N; i++) {
      var pt = pathPoint(i / N);
      if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
    }
    ctx.stroke();
  }

  function drawWalker(u, tSec) {
    var pt = pathPoint(u);
    var x = pt[0], ground = pt[1];
    var figH = Math.max(22, Math.min(H * 0.072, 56));
    var phase = u * 110 * Math.PI;          // steps tied to distance walked
    var bob = Math.abs(Math.sin(phase)) * figH * 0.045;
    var hipY = ground - figH * 0.46 - bob;
    var shY = ground - figH * 0.82 - bob;
    var fadeIn = Math.min(1, u / 0.03);
    var fadeOut = Math.min(1, (1 - u) / 0.045);
    ctx.globalAlpha = Math.max(0, Math.min(fadeIn, fadeOut));
    ctx.strokeStyle = FIGURE; ctx.fillStyle = FIGURE;
    ctx.lineWidth = Math.max(2, figH * 0.075);
    ctx.lineCap = 'round';
    var L = figH * 0.24;
    var s1 = Math.sin(phase), s2 = Math.sin(phase + Math.PI);
    ctx.beginPath();                        // legs
    ctx.moveTo(x, hipY);
    ctx.lineTo(x + s1 * L, ground - Math.max(0, -Math.cos(phase)) * figH * 0.09 - bob * 0.4);
    ctx.moveTo(x, hipY);
    ctx.lineTo(x + s2 * L, ground - Math.max(0, Math.cos(phase)) * figH * 0.09 - bob * 0.4);
    ctx.stroke();
    ctx.beginPath();                        // torso, slight forward lean
    ctx.moveTo(x, hipY); ctx.lineTo(x + figH * 0.05, shY);
    ctx.stroke();
    ctx.beginPath();                        // arm swinging against the legs
    ctx.moveTo(x + figH * 0.05, shY + figH * 0.05);
    ctx.lineTo(x + figH * 0.05 - s1 * L * 0.6, shY + figH * 0.34);
    ctx.stroke();
    ctx.beginPath();                        // head
    ctx.arc(x + figH * 0.07, shY - figH * 0.1, figH * 0.105, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function draw(tMs) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var tSec = tMs / 1000;
    var u = (tMs % LOOP_MS) / LOOP_MS;

    ctx.fillStyle = SKY;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < scene.clouds.length; i++) drawCloud(scene.clouds[i], tSec);

    drawRidge(scene.far);
    drawChurch();
    drawRidge(scene.mid);
    drawPath();
    drawRidge(scene.near);
    // re-draw the path over the near ridge so the ribbon stays unbroken to the eye
    drawPath();
    drawWalker(u, tSec);

    // diptych seam
    ctx.strokeStyle = 'rgba(42,35,32,0.20)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H);
    ctx.stroke();

    // hint
    ctx.fillStyle = 'rgba(42,35,32,0.45)';
    ctx.font = '13px -apple-system, "Helvetica Neue", Arial, sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag', 14, H - 14);
  }

  // ---------- clock: anchored as fixed offset + elapsed since load ----------

  var startStamp = Date.now();
  function frame() {
    draw(PHASE0 + (Date.now() - startStamp));
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  }
  // the synchronous first frame is drawn at exactly PHASE0, never at PHASE0 + a
  // few live milliseconds, so headless renders of frame one are byte-identical

  // ---------- interaction ----------

  var drag = null;
  function evtPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return [cx - r.left, cy - r.top];
  }
  function scrubTo(px) {
    var u = Math.max(0, Math.min(1, px / W));
    // clock is PHASE0 + elapsed; solve elapsed so the walker lands on u, then it walks on from there
    startStamp = Date.now() - ((u * LOOP_MS - PHASE0 + LOOP_MS) % LOOP_MS);
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = evtPos(e);
    drag = { x: p[0], y: p[1], t: Date.now(), moved: false };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = evtPos(e);
    if (Math.abs(p[0] - drag.x) > 6 || Math.abs(p[1] - drag.y) > 6) drag.moved = true;
    if (drag.moved) scrubTo(p[0]);
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!drag) return;
    var wasTap = !drag.moved && (Date.now() - drag.t < 400);
    drag = null;
    if (wasTap) {                 // tap: reseed route + hill colorway from the same stream
      scene = genScene();
      draw(PHASE0 + (Date.now() - startStamp));
    }
  });

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(PHASE0 + (Date.now() - startStamp)); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(PHASE0 + (Date.now() - startStamp)); });
  }

  fit();
  draw(PHASE0);
  if (typeof requestAnimationFrame !== 'undefined') {
    startStamp = Date.now();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
