<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reality Lens</title>
<style>
html, body { margin: 0; padding: 0; background: #08080C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#08080C';
// Palette: orange, green, cyan-blue, magenta, warm white highlights.
var PAL = [
  [0.00, 232, 100, 30],
  [0.24, 63, 209, 74],
  [0.46, 46, 168, 232],
  [0.68, 232, 46, 168],
  [0.82, 245, 240, 232],
  [0.88, 232, 46, 168],
  [1.00, 232, 100, 30]
];
var NPOINTS = 15;
var NTABLE = 4;
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var cell = 8, cols = 0, rows = 0;
var tableIndex = 0;
var points = [];      // {bx, by, ox, oy, w, ph, s0, R} — fractions of minDim for radii
var pointer = null;   // {x, y} px while pressed: the sixteenth point
var downX = 0, downY = 0, downMoved = 0;
var lat = [];         // 16x16 fixed value-noise lattice
var placedW = 0, placedH = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// Build the fixed value-noise lattice once.
function buildLattice() {
  var rnd = mulberry32(1586);
  lat = [];
  for (var i = 0; i < 256; i++) lat.push(rnd());
}
// Bilinear value noise over the 16x16 lattice, wrapping toroidally.
function vnoise(x, y) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var tx = x - xi, ty = y - yi;
  var sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  var x0 = ((xi % 16) + 16) % 16, x1 = (x0 + 1) % 16;
  var y0 = ((yi % 16) + 16) % 16, y1 = (y0 + 1) % 16;
  var a = lat[y0 * 16 + x0], b = lat[y0 * 16 + x1];
  var c = lat[y1 * 16 + x0], d = lat[y1 * 16 + x1];
  return (a * (1 - sx) + b * sx) * (1 - sy) + (c * (1 - sx) + d * sx) * sy;
}
// Fixed authored orbit table. Fifteen points, one per cell of a 4x4
// sector grid (one sector empty, a different one per table entry), so
// no two points ever share a sector and the swirl centers stay spread
// across the whole field. Orbit radius, speed, phase, swirl strength
// and swirl radius come from a fixed-seed LCG per entry, so every
// respawn is reproducible.
function buildPoints(entry) {
  var rnd = mulberry32(158600 + entry * 17);
  var empty = [15, 6, 10, 3][entry];
  var sectors = [];
  for (var s = 0; s < 16; s++) {
    if (s === empty) continue;
    sectors.push(s);
  }
  points = [];
  for (var i = 0; i < NPOINTS; i++) {
    var sidx = sectors[i];
    var sx = (sidx % 4) * 0.25 + 0.125;
    var sy = Math.floor(sidx / 4) * 0.25 + 0.125;
    var bx = sx + (rnd() - 0.5) * 0.07;
    var by = sy + (rnd() - 0.5) * 0.07;
    var sign = rnd() < 0.5 ? -1 : 1;
    points.push({
      bx: bx, by: by,
      ox: (0.015 + rnd() * 0.030) * sign,
      oy: (0.015 + rnd() * 0.030) * sign,
      w: (0.12 + rnd() * 0.35) * sign,
      ph: rnd() * TAU,
      s0: (0.70 + rnd() * 0.50) * (rnd() < 0.5 ? -1 : 1),
      R: 0.15 + rnd() * 0.07
    });
  }
}
// Current centre of point i at loop time t (fractions of the frame).
function pointCentre(p, t) {
  var a = p.w * t + p.ph;
  return [p.bx + p.ox * Math.cos(a), p.by + p.oy * Math.sin(a)];
}
// Palette ramp: smooth blends between the authored stops.
function pal(m, out) {
  var i;
  for (i = 0; i < PAL.length - 1; i++) {
    var a = PAL[i], b = PAL[i + 1];
    if (m >= a[0] && m <= b[0]) {
      var f = (m - a[0]) / (b[0] - a[0]);
      f = f * f * (3 - 2 * f);
      out[0] = Math.round(a[1] + (b[1] - a[1]) * f);
      out[1] = Math.round(a[2] + (b[2] - a[2]) * f);
      out[2] = Math.round(a[3] + (b[3] - a[3]) * f);
      return out;
    }
  }
  out[0] = 232; out[1] = 100; out[2] = 30;
  return out;
}
var rgb = [0, 0, 0];
function draw(t) {
  lastT = t;
  size();
  if (placedW !== VW || placedH !== VH) {
    // Coarse CPU grid: one cell per ~1% of the short side, clamped.
    cell = Math.max(6, Math.min(12, Math.min(VW, VH) / 100));
    if (isPhone()) cell = Math.max(6, cell - 1);
    cols = Math.ceil(VW / cell);
    rows = Math.ceil(VH / cell);
    placedW = VW; placedH = VH;
  }
  var minDim = Math.min(VW, VH);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  // Precompute this frame's point centres and strengths once.
  var cx = [], cy = [], cs = [], cr = [];
  var i;
  for (i = 0; i < NPOINTS; i++) {
    var p = points[i];
    var c = pointCentre(p, t);
    cx.push(c[0] * VW);
    cy.push(c[1] * VH);
    cs.push(p.s0 * (0.8 + 0.2 * Math.sin(p.w * 0.7 * t + p.ph * 2)));
    cr.push(p.R * minDim);
  }
  var dragX = -1, dragY = -1, dragS = 0, dragR = 0;
  if (pointer) {
    dragX = pointer.x; dragY = pointer.y;
    dragS = 0.9;
    dragR = 0.16 * minDim;
  }
  var x, y;
  for (y = 0; y < rows; y++) {
    var py = (y + 0.5) * cell;
    for (x = 0; x < cols; x++) {
      var px = (x + 0.5) * cell;
      // Domain warp: each invisible point drags local pixels
      // tangentially around itself, with a smooth 1/(1+(r/R)^2)
      // falloff, so the field churns continuously and never tears.
      var wx = px, wy = py;
      var j;
      for (j = 0; j < NPOINTS; j++) {
        var dx = wx - cx[j], dy = wy - cy[j];
        var R = cr[j];
        var r2 = dx * dx + dy * dy;
        if (r2 > 6.25 * R * R) continue;
        var r = Math.sqrt(r2);
        if (r < 0.001) continue;
        var k = cs[j] * R / (1 + r2 / (R * R));
        if (r < 2) k *= r / 2;
        wx += -dy / r * k;
        wy += dx / r * k;
      }
      if (pointer) {
        var ddx = wx - dragX, ddy = wy - dragY;
        var dr2 = ddx * ddx + ddy * ddy;
        if (dr2 <= 6.25 * dragR * dragR) {
          var dr = Math.sqrt(dr2);
          if (dr >= 0.001) {
            var dk = dragS * dragR / (1 + dr2 / (dragR * dragR));
            if (dr < 2) dk *= dr / 2;
            wx += -ddy / dr * dk;
            wy += ddx / dr * dk;
          }
        }
      }
      // Marbled source field, sampled at the warped coordinate:
      // folded sine bands over two octaves of bilinear value noise.
      var u = wx / VW, v = wy / VH;
      var n1 = vnoise(u * 5 + 11.3, v * 5 + 7.7);
      var n2 = vnoise(u * 11 + 3.1, v * 11 + 9.4);
      var fold = u * 1.2 + v * 0.8 + 1.6 * (n1 - 0.5) + 0.7 * (n2 - 0.5);
      var s = 0.5 + 0.5 * Math.sin(TAU * fold +
        0.5 * Math.sin(TAU * (v * 2.1 + n1)) +
        0.25 * Math.sin(TAU * (u * 3.0)));
      pal(s, rgb);
      // Thin warm-white veins where a second folded band crosses zero.
      var vein = Math.abs(Math.sin(TAU * (fold * 1.2 + n2 * 1.0)));
      if (vein < 0.05) {
        var vm = (1 - vein / 0.05) * 0.5;
        rgb[0] = Math.round(rgb[0] + (245 - rgb[0]) * vm);
        rgb[1] = Math.round(rgb[1] + (240 - rgb[1]) * vm);
        rgb[2] = Math.round(rgb[2] + (232 - rgb[2]) * vm);
      }
      ctx.fillStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
      ctx.fillRect(x * cell, y * cell, cell + 0.6, cell + 0.6);
    }
  }
  if (typeof window !== 'undefined') {
    window.__p1586 = {
      t: t, table: tableIndex, cols: cols, rows: rows, cell: cell,
      drag: !!pointer, phone: isPhone(),
      centres: cx.map(function (v, k) {
        return [Math.round(v), Math.round(cy[k])];
      })
    };
  }
}
function onDown(e) {
  pointer = { x: e.clientX, y: e.clientY };
  downX = e.clientX; downY = e.clientY; downMoved = 0;
  draw(lastT);
}
function onMove(e) {
  if (!pointer) return;
  var dx = e.clientX - downX, dy = e.clientY - downY;
  var m = Math.sqrt(dx * dx + dy * dy);
  if (m > downMoved) downMoved = m;
  pointer = { x: e.clientX, y: e.clientY };
  draw(lastT);
}
function onUp() {
  if (!pointer) return;
  pointer = null;
  // A press that barely moved is a tap: respawn the fifteen points
  // from the next entry in the fixed orbit table.
  if (downMoved < 12) {
    tableIndex = (tableIndex + 1) % NTABLE;
    buildPoints(tableIndex);
  }
  draw(lastT);
}
buildLattice();
buildPoints(0);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof document !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
