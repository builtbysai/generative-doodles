<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>&#8470;8942 &middot; Lattice Choir</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #050505;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: block; cursor: crosshair; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
  }
  .ui {
    position: fixed; z-index: 3; pointer-events: none;
    color: rgba(240, 235, 230, 0.62);
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }
  .ui .num { color: rgba(255, 110, 110, 0.9); }
  #title { top: 18px; left: 20px; }
  #title .sub { display: block; margin-top: 6px; font-size: 9px; letter-spacing: 0.18em; color: rgba(240,235,230,0.36); }
  #hint { bottom: 16px; right: 20px; text-align: right; font-size: 9px; color: rgba(240,235,230,0.36); }
  #seedline { bottom: 16px; left: 20px; font-size: 9px; color: rgba(240,235,230,0.30); }
  #chordline { top: 18px; right: 20px; text-align: right; font-size: 10px; color: rgba(255,220,180,0.55); }
  #fade {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: #050505; opacity: 1; transition: opacity 0.6s ease;
  }
  @media (max-width: 620px) {
    #seedline { bottom: 38px; }
    #hint { font-size: 8px; }
    #title { font-size: 10px; }
    #chordline { display: none; }
  }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="ui" id="title"><span class="num">&#8470;8942</span> &middot; Lattice Choir<span class="sub">seed 239 &middot; every chord consonant by construction, in a scale nobody can name</span></div>
<div class="ui" id="chordline"></div>
<div class="ui" id="hint">tap left: drone &middot; tap right: new choir</div>
<div class="ui" id="seedline"></div>
<div id="fade"></div>
<script>
"use strict";
/* Seed 239: Pierce 1966. Partials live on a shared fractional-octave
   lattice; no two partials may sit closer than 150 cents. Chords are
   chosen as lattice offsets, so every chord is consonant by
   construction. The gaps between partials are the actual instrument. */
let seed = 239001;
let rng;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const SPAN = 7;            /* lattice half-extent in 300-cent steps: 15x15 */
const VOICES = 3;          /* simultaneous chord voices */
const MAXPART = 72;        /* cap on live partials */
const RULE_CENTS = 150;    /* minimum separation, in cents */
let W=0, H=0, cx=0, cy=0, cell=0;
let chords = [];           /* active chords: {ri,rj,hue,born,partials[]} */
let rejects = [];          /* rule-rejection flickers: {i,j,at} */
let chordTimer = 0;
let gapPt = {i:0, j:0};
let audioOn=false, actx=null, droneNodes=[];
let palette;
let spawnQueue = [];       /* staggered chord spawns: frame numbers */
let voiceCount = 0;

function setup(){
  const c = createCanvas(windowWidth, windowHeight);
  c.id('stage');
  rng = mulberry32(seed);
  palette = {
    dotA: [205, 64, 64], dotB: [120, 42, 46],
    sub: [86, 108, 128],
    gap: [120, 220, 235],
    hues: [
      [255, 214, 160],  /* gold */
      [255, 170, 178],  /* rose */
      [255, 238, 205]   /* pale amber */
    ]
  };
  layout();
  spawnQueue = [frameCount+2, frameCount+22, frameCount+44];
  chordTimer = 0;
  document.getElementById('fade').style.opacity = '0';
  updateSeedline();
}

function layout(){
  W = width; H = height;
  cx = W/2; cy = H/2;
  cell = Math.min(W, H) * 0.078;
}

function windowResized(){ resizeCanvas(windowWidth, windowHeight); layout(); }

function latticeXY(i, j, layer){
  /* layer 0 = main lattice, layer 1 = 150-cent offset sublattice.
     The sublattice drifts a touch differently for parallax depth. */
  let drift, drift2;
  if(layer === 0){
    drift = Math.sin(frameCount*0.0035)*cell*0.30;
    drift2 = Math.cos(frameCount*0.0028)*cell*0.30;
  } else {
    drift = Math.sin(frameCount*0.0022 + 1.7)*cell*0.55;
    drift2 = Math.cos(frameCount*0.0026 + 0.6)*cell*0.55;
  }
  return {x: cx + i*cell + drift, y: cy + j*cell + drift2};
}

function livePartials(){
  const out = [];
  for(const ch of chords) for(const p of ch.partials) out.push(p);
  return out;
}

function newChord(){
  voiceCount++;
  /* spread voices across the frame: keep each new root well clear of
     the other active voices so the choir covers the lattice */
  let ri = 0, rj = 0, placed = false;
  for(let attempt = 0; attempt < 14 && !placed; attempt++){
    ri = Math.floor(rng()*9)-4; rj = Math.floor(rng()*9)-4;
    placed = true;
    for(const ch of chords){
      let cxp = 0, cyp = 0;
      for(const p of ch.partials){ cxp += p.i; cyp += p.j; }
      if(ch.partials.length){ cxp /= ch.partials.length; cyp /= ch.partials.length; }
      if(Math.hypot(cxp-ri, cyp-rj) < 4.2){ placed = false; break; }
    }
  }
  const n = 5 + Math.floor(rng()*4);   /* 5-8 partials per voice */
  const hue = palette.hues[(voiceCount-1) % palette.hues.length];
  const chord = {ri: ri, rj: rj, hue: hue, born: frameCount, partials: []};
  const live = livePartials();
  const cand = [];
  for(let di=-2; di<=2; di++) for(let dj=-2; dj<=2; dj++){
    const i = ri+di, j = rj+dj;
    if(Math.abs(i) > SPAN || Math.abs(j) > SPAN) continue;
    cand.push([i, j]);
  }
  /* shuffle so the rule, not the scan order, picks the survivors */
  for(let k=cand.length-1;k>0;k--){ const m=Math.floor(rng()*(k+1)); const t=cand[k]; cand[k]=cand[m]; cand[m]=t; }
  for(const [i,j] of cand){
    if(chord.partials.length >= n) break;
    /* 150-cent rule: no partial may sit closer than 150 cents to a
       still-sounding one. Rejected candidates flicker visibly. */
    let tooClose = null;
    for(const p of live){
      if(p.e < 0.25) continue;
      if(Math.hypot(p.i-i, p.j-j)*300 < RULE_CENTS){ tooClose = p; break; }
    }
    if(tooClose){
      rejects.push({i:i, j:j, at:frameCount});
      if(rejects.length > 16) rejects.splice(0, rejects.length-16);
      continue;
    }
    chord.partials.push({i:i, j:j, e:0.001, peak: 0.8+rng()*0.2, ch: chord});
  }
  if(chord.partials.length > 0) chords.push(chord);
  trimPartials();
  /* the gap: lattice point farthest from any strong partial */
  let best=null, bestD=-1;
  for(let i=-SPAN;i<=SPAN;i++) for(let j=-SPAN;j<=SPAN;j++){
    let md=1e9;
    for(const p of livePartials()){ if(p.e<0.2) continue; md=Math.min(md, Math.hypot(p.i-i,p.j-j)); }
    if(md>bestD){ bestD=md; best={i:i,j:j}; }
  }
  if(best) gapPt = best;
  const el = document.getElementById('chordline');
  el.innerHTML = 'choir · ' + chords.length + ' voices<br>' + livePartials().length + ' partials';
  if(audioOn) rebuildDrone();
  updateSeedline();
}

function trimPartials(){
  let total = livePartials().length;
  while(total > MAXPART){
    /* drop the oldest partial of the oldest voice */
    const ch = chords[0];
    if(!ch) break;
    ch.partials.shift();
    total--;
    if(ch.partials.length === 0) chords.shift();
  }
}

function draw(){
  background(5,5,5);
  /* staggered opening spawns */
  for(let s=spawnQueue.length-1; s>=0; s--){
    if(frameCount >= spawnQueue[s]){ spawnQueue.splice(s,1); newChord(); }
  }
  /* keep the choir at full strength: replace faded voices */
  chordTimer += deltaTime/1000;
  if(chordTimer > 4.5){
    chordTimer = 0;
    if(chords.length < VOICES) newChord();
  }
  drawGap();
  drawLattice();
  drawChordPools();
  drawPartials();
  drawRejects();
  if(frameCount % 20 === 0) updateSeedline();
}

/* Layered background: main lattice with connecting lines, plus a dimmer
   150-cent offset sublattice drifting on its own phase for depth. */
function drawLattice(){
  /* connective tissue of the main lattice */
  stroke(150, 60, 60, 16);
  strokeWeight(1);
  for(let i=-SPAN;i<SPAN;i++){
    for(let j=-SPAN;j<=SPAN;j++){
      const a = latticeXY(i, j, 0), b = latticeXY(i+1, j, 0);
      if(a.x < -40 || a.x > W+40 || a.y < -40 || a.y > H+40) continue;
      line(a.x, a.y, b.x, b.y);
      const c2 = latticeXY(i, j, 0), d2 = latticeXY(i, j+1, 0);
      if(d2.y < H+40) line(c2.x, c2.y, d2.x, d2.y);
    }
  }
  noStroke();
  /* offset sublattice: 150-cent points between the main ones */
  for(let i=-SPAN;i<SPAN;i++){
    for(let j=-SPAN;j<SPAN;j++){
      const p = latticeXY(i+0.5, j+0.5, 1);
      if(p.x < -20 || p.x > W+20 || p.y < -20 || p.y > H+20) continue;
      fill(palette.sub[0], palette.sub[1], palette.sub[2], 70);
      circle(p.x, p.y, 2.2);
    }
  }
  /* main lattice points */
  for(let i=-SPAN;i<=SPAN;i++){
    for(let j=-SPAN;j<=SPAN;j++){
      const p = latticeXY(i,j,0);
      if(p.x < -20 || p.x > W+20 || p.y < -20 || p.y > H+20) continue;
      const even = ((i+j)%2+2)%2 === 0;
      const c = even ? palette.dotA : palette.dotB;
      fill(c[0], c[1], c[2], even ? 170 : 105);
      circle(p.x, p.y, even ? 5.5 : 3.5);
    }
  }
}

/* Each voice pools its glow: multi-voice light accumulation. */
function drawChordPools(){
  const ctx = drawingContext;
  for(const ch of chords){
    let e = 0, sx = 0, sy = 0, n = 0, maxD = 0;
    for(const p of ch.partials){
      if(p.e < 0.15) continue;
      const q = latticeXY(p.i, p.j, 0);
      sx += q.x; sy += q.y; n++; e = Math.max(e, p.e);
    }
    if(n === 0) continue;
    const cxp = sx/n, cyp = sy/n;
    for(const p of ch.partials){
      const q = latticeXY(p.i, p.j, 0);
      maxD = Math.max(maxD, Math.hypot(q.x-cxp, q.y-cyp));
    }
    const R = maxD + cell*1.6;
    const g = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, R);
    const h = ch.hue;
    g.addColorStop(0, 'rgba(' + h[0] + ',' + h[1] + ',' + h[2] + ',' + (0.10*e).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + h[0] + ',' + h[1] + ',' + h[2] + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cxp, cyp, R, 0, 6.2832); ctx.fill();
  }
}

function drawGap(){
  const p = latticeXY(gapPt.i, gapPt.j, 0);
  const pulse = 0.75 + 0.25*Math.sin(frameCount*0.02);
  const R = cell*2.6*pulse;
  const ctx = drawingContext;
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
  g.addColorStop(0, 'rgba(120,220,235,0.16)');
  g.addColorStop(1, 'rgba(120,220,235,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 6.2832); ctx.fill();
  noStroke(); fill(120,220,235,90);
  textAlign(CENTER, CENTER); textSize(9);
  text('the gap', constrain(p.x, 56, W-56), constrain(p.y - 14, 96, H-24));
}

function drawPartials(){
  const ruleR = cell*0.5;   /* 150 cents = half a 300-cent lattice step */
  for(const ch of chords){
    for(let k=ch.partials.length-1;k>=0;k--){
      const p = ch.partials[k];
      p.e += (p.peak - p.e)*0.03;
      p.peak *= 0.996;
      if(p.peak < 0.05 && p.e < 0.06){ ch.partials.splice(k,1); continue; }
      const q = latticeXY(p.i, p.j, 0);
      /* the 150-cent rule, made visible: every sounding partial wears
         its exclusion ring, and rings never overlap */
      if(p.e > 0.18){
        noFill();
        stroke(ch.hue[0], ch.hue[1], ch.hue[2], 34*p.e);
        strokeWeight(1);
        circle(q.x, q.y, ruleR*2);
      }
      /* bloom: pooled multi-layer glow */
      const r = (3 + p.e*cell*0.34);
      for(let g=5; g>=1; g--){
        noStroke();
        fill(ch.hue[0], ch.hue[1], ch.hue[2], 11*g*p.e);
        circle(q.x, q.y, r*g*0.85);
      }
      noStroke();
      fill(255, 246, 232, 230*p.e);
      circle(q.x, q.y, 5.5);
      /* lattice coordinate tag on the brightest */
      if(p.e > 0.6){
        fill(ch.hue[0], ch.hue[1], ch.hue[2], 120); textAlign(LEFT, CENTER); textSize(9);
        text(p.i+','+p.j, q.x+11, q.y-11);
      }
    }
  }
  /* prune dead voices */
  for(let c=chords.length-1;c>=0;c--){
    if(chords[c].partials.length === 0) chords.splice(c,1);
  }
}

/* Candidates the 150-cent rule rejected: brief struck marks. */
function drawRejects(){
  for(let k=rejects.length-1;k>=0;k--){
    const rj = rejects[k];
    const age = frameCount - rj.at;
    if(age > 70){ rejects.splice(k,1); continue; }
    const p = latticeXY(rj.i, rj.j, 0);
    const a = 130*(1 - age/70);
    stroke(255, 120, 120, a); strokeWeight(1.5);
    const s = 5;
    line(p.x-s, p.y-s, p.x+s, p.y+s);
    line(p.x-s, p.y+s, p.x+s, p.y-s);
  }
}

function updateSeedline(){
  document.getElementById('seedline').textContent =
    'seed ' + seed + ' · ' + livePartials().length + ' partials · 150 cent rings: minimum separation · ' + (audioOn ? 'drone on' : 'drone off');
}

function mousePressed(){ userTap(); return false; }
function touchStarted(){ userTap(); return false; }

function userTap(){
  if(mouseX < W/2){
    /* left half: toggle the drone */
    if(!audioOn){
      try{
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        if(actx.state === 'suspended') actx.resume();
        audioOn = true;
        rebuildDrone();
      }catch(e){ audioOn = false; }
    } else {
      audioOn = false;
      for(const n of droneNodes){
        try{
          n.master.gain.cancelScheduledValues(actx.currentTime);
          n.master.gain.setValueAtTime(n.master.gain.value, actx.currentTime);
          n.master.gain.linearRampToValueAtTime(0.0001, actx.currentTime+1);
          const oscs = n.oscs;
          setTimeout(()=>{ for(const o of oscs){ try{ o.stop(); }catch(e){} } }, 1200);
        }catch(e){}
      }
      droneNodes = [];
    }
  } else {
    reseed();
  }
  updateSeedline();
}

function reseed(){
  seed = (seed*9301+49297) % 233280 + 11;
  rng = mulberry32(seed);
  chords = [];
  rejects = [];
  voiceCount = 0; chordTimer = 0;
  spawnQueue = [frameCount+2, frameCount+22, frameCount+44];
  updateSeedline();
}

function keyPressed(){
  if(key==='r' || key==='R') reseed();
}

function rebuildDrone(){
  if(!actx) return;
  /* fade out the previous chord's master instead of cutting it */
  for(const n of droneNodes){
    try{
      n.master.gain.cancelScheduledValues(actx.currentTime);
      n.master.gain.setValueAtTime(n.master.gain.value, actx.currentTime);
      n.master.gain.linearRampToValueAtTime(0.0001, actx.currentTime+3);
      const oscs = n.oscs;
      setTimeout(()=>{ for(const o of oscs){ try{ o.stop(); }catch(e){} } }, 3500);
    }catch(e){}
  }
  droneNodes = [];
  const mg = actx.createGain();
  mg.gain.value = 0.0001;
  mg.connect(actx.destination);
  mg.gain.linearRampToValueAtTime(0.06, actx.currentTime+2.5);
  const oscs = [];
  for(const p of livePartials()){
    if(p.e < 0.3) continue;
    const cents = (p.i*300 + p.j*173);
    const f = 110 * Math.pow(2, cents/1200);
    if(f < 40 || f > 2400) continue;
    const o = actx.createOscillator();
    o.type = 'sine'; o.frequency.value = f;
    const g = actx.createGain();
    g.gain.value = 0.25 + p.e*0.5;
    o.connect(g); g.connect(mg);
    o.start();
    oscs.push(o);
  }
  droneNodes.push({master: mg, oscs: oscs});
}
</script>
</body>
</html>
