<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.207 Twisted Landscape</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#060606; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.207 Twisted Landscape (Asia Ward). A dreamscape diorama of
// seven stacked aluminum sheets: a cave hollow, a flying ridge, a
// river cut, grass in fine strokes, each sheet twisted, fanned or
// pinched differently so the landscape reads from several
// viewpoints at once. Drag sideways to fan the stack like a deck,
// drag down to pinch it shut. On release it settles into a new
// distortion, never exactly the original. Light drifts across the
// relief on a thirty second loop. Double-tap deals another
// dreamscape from the four variants.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#060606';
var SHEET = '#8A8F96', EDGE = '#D8DCE0', SHADOWF = '#2A2D32';
var RIVER = '#1E4A5A', GRASS = '#4E6B4A', CAVE = '#000000';
var W = 0, H = 0, phone = false;
var seed = 207207;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mixc(h1, h2, k) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], k)) + ',' + Math.round(lerp(a[1], b[1], k)) + ',' + Math.round(lerp(a[2], b[2], k)) + ')';
}

// ---- the four dreamscapes -----------------------------------------------------
// Each variant is seven layer recipes. A layer has a terrain profile
// (two sine bumps), a depth tone, and at most one feature.
function makeVariant(kind, r) {
  var layers = [];
  for (var i = 0; i < 7; i++) {
    layers.push({
      a1: 0.5 + r() * 0.9, f1: 1.2 + r() * 1.6, p1: r() * 6.283,
      a2: 0.2 + r() * 0.5, f2: 2.6 + r() * 2.6, p2: r() * 6.283,
      tone: i / 6, feat: null, grass: 0
    });
  }
  if (kind === 0) { // cave
    layers[2].feat = 'cave'; layers[3].feat = 'cave';
    layers[5].grass = 0.5; layers[6].grass = 0.8;
    layers[1].a1 = 1.3;
  } else if (kind === 1) { // flying ridge
    for (var j = 0; j < 7; j++) { layers[j].a1 = 1.1 + r() * 0.7; layers[j].f1 = 0.9 + r() * 0.7; }
    layers[4].grass = 0.6; layers[6].grass = 0.4;
  } else if (kind === 2) { // river cut
    layers[1].feat = 'river'; layers[2].feat = 'river'; layers[3].feat = 'river';
    layers[4].feat = 'river'; layers[5].feat = 'river';
    layers[6].grass = 0.7;
  } else { // grass field
    for (var k = 0; k < 7; k++) layers[k].grass = 0.35 + r() * 0.65;
    layers[3].feat = 'cave';
  }
  return layers;
}
var variants = [makeVariant(0, rand), makeVariant(1, rand), makeVariant(2, rand), makeVariant(3, rand)];
var variantIx = 0;

// ---- twist state ----------------------------------------------------------------
// fan and pinch spring toward targets; per layer settle rotations
// keep every released arrangement a little different from the last.
var fanCur = 0.55, fanTgt = 0.55, pinchCur = -0.16, pinchTgt = -0.16;
var settleRot = [], settleY = [];
for (var si = 0; si < 7; si++) { settleRot.push((rand() - 0.5) * 0.03); settleY.push((rand() - 0.5) * 6); }
var T = 0, lastNow = -1;

function layerProfileY(L, x, amp) {
  return (Math.sin(x * L.f1 * 3.1416 + L.p1) * L.a1 + Math.sin(x * L.f2 * 3.1416 + L.p2) * L.a2) * amp;
}

// ---- input ----------------------------------------------------------------------
var dragging = false, dragId = null, startX = 0, startY = 0, fan0 = 0, pinch0 = 0;
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; dragId = e.pointerId;
  startX = e.clientX; startY = e.clientY; fan0 = fanTgt; pinch0 = pinchTgt;
  var now = performance.now() / 1000;
  if (now - lastTapT < 0.34 && Math.abs(e.clientX - lastTapX) < 60 && Math.abs(e.clientY - lastTapY) < 60) {
    variantIx = (variantIx + 1 + ((rand() * 2) | 0)) % 4;
    fanTgt = 0.3 + rand() * 0.5; pinchTgt = -0.25 + rand() * 0.4;
    lastTapT = -10;
  } else { lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY; }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging || e.pointerId !== dragId) return;
  fanTgt = clamp(fan0 + (e.clientX - startX) / (W * 0.45), -1.2, 1.2);
  pinchTgt = clamp(pinch0 + (e.clientY - startY) / (H * 0.45), -1.2, 1.2);
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  // settle: keep most of the twist, relax a little, nudge each sheet
  fanTgt = fanTgt * (0.5 + rand() * 0.25);
  pinchTgt = pinchTgt * (0.5 + rand() * 0.25);
  for (var i = 0; i < 7; i++) {
    settleRot[i] = clamp(settleRot[i] + (rand() - 0.5) * 0.035, -0.05, 0.05);
    settleY[i] = clamp(settleY[i] + (rand() - 0.5) * 7, -9, 9);
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- resize -----------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing ------------------------------------------------------------------------
function drawLayer(L, ix, geo, lightX) {
  var slabW = geo.w, slabH = geo.h, cx = geo.cx, cy = geo.cy;
  var bandH = slabH / 7;
  var rel = ix - 3;
  var rot = settleRot[ix] + fanCur * rel * 0.055 + Math.sin(T * 0.11 + ix * 0.9) * 0.004;
  var dx = fanCur * rel * slabW * 0.028;
  var dy = settleY[ix] + pinchCur * Math.abs(rel) * bandH * 0.16 - pinchCur * bandH * 0.1;
  var squash = 1 - Math.max(0, pinchCur) * 0.13 * (1 - Math.abs(rel) / 4);
  var topY = -slabH / 2 + ix * bandH * 0.92;
  ctx.save();
  ctx.translate(cx + dx, cy + dy);
  ctx.rotate(rot);
  ctx.scale(1, squash);
  var amp = bandH * 0.30;
  // face: sheet tone deepens toward the back of the stack
  ctx.beginPath();
  var N = 26, px, py;
  for (var i = 0; i <= N; i++) {
    var x = i / N;
    px = -slabW / 2 + x * slabW;
    py = topY + layerProfileY(L, x, amp);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.lineTo(slabW / 2, topY + bandH * 1.75);
  ctx.lineTo(-slabW / 2, topY + bandH * 1.75);
  ctx.closePath();
  ctx.fillStyle = mixc(SHADOWF, SHEET, 0.25 + (1 - L.tone) * 0.75);
  ctx.fill();
  ctx.clip();
  // river cut: a teal channel meandering down the face
  if (L.feat === 'river') {
    ctx.strokeStyle = RIVER;
    ctx.lineWidth = bandH * 0.34;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var r2 = 0; r2 <= 10; r2++) {
      var rx = -slabW / 2 + (0.30 + 0.14 * Math.sin(r2 * 1.2 + ix * 2.0)) * slabW + (r2 / 10) * slabW * 0.28;
      var ry = topY - bandH * 0.2 + (r2 / 10) * bandH * 1.9;
      if (r2 === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
    }
    ctx.stroke();
  }
  // cave hollow: black arch cut into the face
  if (L.feat === 'cave') {
    var cvx = slabW * (ix === 2 ? 0.08 : -0.14), cvy = topY + bandH * 0.95;
    ctx.fillStyle = CAVE;
    ctx.beginPath();
    ctx.ellipse(cvx, cvy, slabW * 0.13, bandH * 0.62, 0, 3.1416, 0);
    ctx.lineTo(cvx + slabW * 0.13, cvy + bandH * 0.5);
    ctx.lineTo(cvx - slabW * 0.13, cvy + bandH * 0.5);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  // lit top edge, brightest where the drifting light is passing
  ctx.save();
  ctx.translate(cx + dx, cy + dy);
  ctx.rotate(rot);
  ctx.scale(1, squash);
  // grass: fine vertical strokes standing on the profile, drawn
  // unclipped so the blades rise above the sheet edge
  if (L.grass > 0) {
    ctx.strokeStyle = GRASS;
    ctx.lineWidth = Math.max(1, slabW * 0.0016);
    ctx.beginPath();
    var gn = Math.floor(90 * L.grass);
    for (var g2 = 0; g2 < gn; g2++) {
      var gx = ((g2 * 0.61803 + ix * 0.37) % 1);
      var gxp = -slabW / 2 + gx * slabW;
      var gyp = topY + layerProfileY(L, gx, amp);
      var gl = bandH * (0.3 + ((g2 * 0.318) % 1) * 0.35);
      ctx.moveTo(gxp, gyp);
      ctx.lineTo(gxp + Math.sin(g2 * 2.3) * 2, gyp - gl);
    }
    ctx.stroke();
  }
  ctx.lineWidth = Math.max(1.1, slabW * 0.0022);
  ctx.lineCap = 'round';
  for (var s2 = 0; s2 < N; s2++) {
    var x0 = s2 / N, x1 = (s2 + 1) / N;
    var lx = (x0 + x1) / 2;
    var glow = Math.max(0, 1 - Math.abs(lx - lightX) * 3.2);
    ctx.strokeStyle = EDGE;
    ctx.globalAlpha = 0.14 + glow * 0.8;
    ctx.beginPath();
    ctx.moveTo(-slabW / 2 + x0 * slabW, topY + layerProfileY(L, x0, amp));
    ctx.lineTo(-slabW / 2 + x1 * slabW, topY + layerProfileY(L, x1, amp));
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && time > 0) T += Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  // springs run on a fixed small step count so frame one is settled
  var steps = lastNow > 0 ? 3 : 40;
  for (var q = 0; q < steps; q++) {
    fanCur += (fanTgt - fanCur) * 0.045;
    pinchCur += (pinchTgt - pinchCur) * 0.045;
  }
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var geo = {
    cx: W / 2, cy: H * 0.54,
    w: (phone ? 0.86 : 0.80) * W,
    h: Math.min(H * 0.56, W * 0.62)
  };
  // soft shadow under the floating slab
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath();
  ctx.ellipse(geo.cx, geo.cy + geo.h * 0.62, geo.w * 0.46, geo.h * 0.07, 0, 0, 6.2832);
  ctx.fill();
  var lightX = ((T % 30) / 30 + 0.45) % 1;
  var layers = variants[variantIx];
  for (var i = 0; i < 7; i++) drawLayer(layers[i], i, geo, lightX);
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
