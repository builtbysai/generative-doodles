<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonfire Nightmare</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0E14; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var GROUND = '#0B0E14';
  var HAZE = '201,143,61';      // rgb of #C98F3D, used with low alpha
  var SKYLINE = '#141A24';
  var WAVE = '#5B7A99';
  var RIPPLE = '232,220,200';   // rgb of #E8DCC8, used with low alpha
  var TEXT = '#7A8A99';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- data: 365 synthesized daily particulate values ----------
  // Winter-smog baseline (seasonal cosine peaking mid-January), spring
  // thinning into a low summer, autumn rise, a sharp bonfire-night spike at
  // day 309 (Nov 5), a small New Year bump, and five minor seeded episodes.
  // Values are normalized so the bonfire peak is 1.0.
  var DATA_SEED = 92485;
  var daily = (function () {
    var rng = mulberry32(DATA_SEED);
    var episodes = [];
    for (var i = 0; i < 5; i++) {
      episodes.push({
        day: 20 + Math.floor(rng() * 320),
        amp: 0.10 + rng() * 0.10,
        width: 3 + rng() * 3.5
      });
    }
    var raw = new Array(365);
    var max = 0;
    for (var d = 0; d < 365; d++) {
      var seasonal = 0.5 + 0.5 * Math.cos((Math.PI * 2 * (d - 15)) / 365);
      var v = 0.22 + 0.38 * seasonal + (rng() - 0.5) * 0.16;
      var db = (d - 309) / 2.2;
      v += 0.62 * Math.exp(-db * db);                       // bonfire night
      var dn = Math.min(Math.abs(d), 365 - Math.abs(d)) / 3.0;
      v += 0.22 * Math.exp(-dn * dn);                       // new year
      for (var e = 0; e < episodes.length; e++) {
        var de = (d - episodes[e].day) / episodes[e].width;
        v += episodes[e].amp * Math.exp(-de * de);
      }
      if (v < 0.03) v = 0.03;
      raw[d] = v;
      if (v > max) max = v;
    }
    for (var k = 0; k < 365; k++) raw[k] = raw[k] / max;
    return raw;
  })();

  function dailyAt(dayF) {
    var d = ((dayF % 365) + 365) % 365;
    var i = Math.floor(d);
    var f = d - i;
    return daily[i] * (1 - f) + daily[(i + 1) % 365] * f;
  }

  // Pollution value smoothed over about 10 days (circular).
  function smoothedAt(dayF) {
    var s = 0;
    for (var o = -5; o <= 5; o++) s += dailyAt(dayF + o);
    return s / 11;
  }

  // ---------- playback ----------
  var LOOP = 240;          // seconds per year
  var START_DAY = 250;     // frame one: early autumn
  function dayAt(t) {
    return (START_DAY + (t / LOOP) * 365) % 365;
  }
  function loopTimeOfDay(day) {
    return ((((day - START_DAY) % 365) + 365) % 365) / 365 * LOOP;
  }

  // ---------- haze peaks: local maxima of the smoothed curve ----------
  // Each peak throws one echo ripple per loop at a fixed seeded position.
  var peaks = (function () {
    var rng = mulberry32(5177);
    var list = [];
    var step = 0.25;
    var prevDay = -100;
    for (var d = 0; d < 365; d += step) {
      var v = smoothedAt(d);
      if (v > 0.55 && v >= smoothedAt(d - step) && v > smoothedAt(d + step) && d - prevDay >= 15) {
        list.push({
          day: d,
          fx: 0.15 + rng() * 0.70,
          fy: 0.20 + rng() * 0.40,
          tPeak: loopTimeOfDay(d)
        });
        prevDay = d;
      }
    }
    return list;
  })();

  // ---------- haze blobs: seeded shapes, closed-form drift ----------
  // Drift frequencies are whole cycles per 240 s loop, so the field loops
  // seamlessly. A blob appears as the smoothed value passes its threshold.
  var blobs = (function () {
    var rng = mulberry32(31337);
    var list = [];
    for (var i = 0; i < 95; i++) {
      list.push({
        fx: rng(),
        fy: 0.05 + 0.60 * Math.pow(rng(), 1.1),
        rFrac: 0.05 + rng() * 0.11,
        thresh: Math.pow(rng(), 1.3) * 0.85,
        kx: 1 + Math.floor(rng() * 3),
        ky: 1 + Math.floor(rng() * 2),
        px: rng() * Math.PI * 2,
        py: rng() * Math.PI * 2,
        driftAmp: 0.012 + rng() * 0.02
      });
    }
    return list;
  })();

  // ---------- skyline: seeded silhouette in fraction space ----------
  var skyline = (function () {
    var rng = mulberry32(777);
    var list = [];
    var x = -0.01;
    while (x < 1.0) {
      var w = 0.03 + rng() * 0.06;
      var b = {
        fx: x,
        fw: w,
        fh: 0.05 + rng() * 0.12,
        chimney: rng() < 0.4,
        roof: rng() < 0.3,
        windows: []
      };
      var nw = Math.floor(rng() * 4);
      for (var i = 0; i < nw; i++) {
        b.windows.push({
          wx: 0.15 + rng() * 0.7,
          wy: 0.2 + rng() * 0.65,
          a: 0.16 + rng() * 0.2
        });
      }
      list.push(b);
      x += w + 0.002 + rng() * 0.008;
    }
    return list;
  })();

  // ---------- canvas / sizing ----------
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;

  function fit() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(50, Math.floor(w));
    H = Math.max(50, Math.floor(h));
    canvas.width = W;
    canvas.height = H;
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    isPhone = Math.min(sw, sh) < 700 || (Math.min(W, H) < 700 && H > W * 1.15);
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', fit);
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- interaction state (recorded events only) ----------
  var clearSamples = [];   // {x, y, t} along drag paths
  var tapRipples = [];     // {x, y, t}
  var pointerDown = false;
  var downX = 0, downY = 0, downT = 0, dragging = false;
  var lastSX = -999, lastSY = -999;

  function nowT() {
    return (typeof performance !== 'undefined' && performance.now)
      ? performance.now() / 1000 - T0 : 0;
  }

  // Clearing suppression at a point: closed form over recorded samples.
  // Full strength while fresh, recovering linearly over about 6 s.
  function suppressionAt(x, y, t) {
    var R = 0.22 * Math.min(W, H);
    var s = 0;
    for (var i = 0; i < clearSamples.length; i++) {
      var sm = clearSamples[i];
      var age = t - sm.t;
      if (age < 0 || age > 6.5) continue;
      var dx = x - sm.x, dy = y - sm.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var infl = 1 - dist / R;
      if (infl <= 0) continue;
      var v = infl * (1 - age / 6);
      if (v > s) s = v;
    }
    return s > 1 ? 1 : s;
  }

  // Overall recent clearing activity, used to dip the drone gain.
  function clearLevel(t) {
    var s = 0;
    for (var i = 0; i < clearSamples.length; i++) {
      var age = t - clearSamples[i].t;
      if (age < 0 || age > 6.5) continue;
      var v = 1 - age / 6;
      if (v > s) s = v;
    }
    return s;
  }

  // ---------- audio (lazy, first gesture only, typeof-guarded) ----------
  var AC = null, droneGain = null, droneFilter = null, delaySend = null, noiseBuf = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    var Ctor = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!Ctor) return;
    try {
      AC = new Ctor();
      var master = AC.createGain();
      master.gain.value = 0.9;
      master.connect(AC.destination);

      droneFilter = AC.createBiquadFilter();
      droneFilter.type = 'lowpass';
      droneFilter.frequency.value = 400;
      droneFilter.Q.value = 0.4;
      droneGain = AC.createGain();
      droneGain.gain.value = 0;
      var o1 = AC.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55;
      var o2 = AC.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 58;
      o1.connect(droneFilter); o2.connect(droneFilter);
      droneFilter.connect(droneGain); droneGain.connect(master);
      o1.start(); o2.start();

      var delay = AC.createDelay(1.0);
      delay.delayTime.value = 0.27;
      var fb = AC.createGain(); fb.gain.value = 0.35;
      var wet = AC.createGain(); wet.gain.value = 0.5;
      delay.connect(fb); fb.connect(delay);
      delay.connect(wet); wet.connect(master);
      delaySend = AC.createGain(); delaySend.gain.value = 1;
      delaySend.connect(delay);

      var len = Math.floor(AC.sampleRate * 0.12);
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      var ch = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    } catch (e) {
      AC = null;
    }
  }

  function playSlap() {
    if (!AC || !noiseBuf) return;
    try {
      var src = AC.createBufferSource(); src.buffer = noiseBuf;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
      var g = AC.createGain(); g.gain.value = 0.25;
      src.connect(bp); bp.connect(g); g.connect(AC.destination);
      var send = AC.createGain(); send.gain.value = 0.8;
      g.connect(send); send.connect(delaySend);
      src.start();
    } catch (e) { /* audio is garnish; the picture stands alone */ }
  }

  function audioUpdate(v, t) {
    if (!AC || !droneGain || !droneFilter) return;
    var tc = AC.currentTime;
    var cut = 200 + 1800 * Math.pow(v, 1.6);
    var g = (0.015 + 0.085 * v) * (1 - 0.55 * clearLevel(t));
    try {
      droneFilter.frequency.setTargetAtTime(cut, tc, 0.2);
      droneGain.gain.setTargetAtTime(g, tc, 0.2);
    } catch (e) { /* ignore */ }
  }

  // ---------- pointer handling ----------
  function pos(e) {
    return { x: e.clientX || 0, y: e.clientY || 0 };
  }
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    var p = pos(e);
    pointerDown = true; dragging = false;
    downX = p.x; downY = p.y; downT = nowT();
    lastSX = p.x; lastSY = p.y;
    clearSamples.push({ x: p.x, y: p.y, t: downT });
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pointerDown) return;
    var p = pos(e);
    var dx = p.x - downX, dy = p.y - downY;
    if (dx * dx + dy * dy > 16) dragging = true;
    if (dragging) {
      var sx = p.x - lastSX, sy = p.y - lastSY;
      if (sx * sx + sy * sy > 25) {
        clearSamples.push({ x: p.x, y: p.y, t: nowT() });
        lastSX = p.x; lastSY = p.y;
        // prune old samples
        var t = nowT();
        while (clearSamples.length && t - clearSamples[0].t > 8) clearSamples.shift();
        if (clearSamples.length > 400) clearSamples.splice(0, clearSamples.length - 400);
      }
    }
  });
  function endPointer(e) {
    if (!pointerDown) return;
    pointerDown = false;
    var t = nowT();
    if (!dragging && t - downT < 0.4) {
      var p = pos(e);
      tapRipples.push({ x: p.x, y: p.y, t: t });
      if (tapRipples.length > 12) tapRipples.shift();
      playSlap();
    }
    dragging = false;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- drawing ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var minDim = Math.min(W, H);
    var day = dayAt(t);
    var v = smoothedAt(day);

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var horizon = H * 0.90;

    // haze field: layered concentric circles, density follows the data
    var i, b, s;
    for (i = 0; i < blobs.length; i++) {
      b = blobs[i];
      s = (v - b.thresh) / 0.25;
      if (s <= 0) continue;
      if (s > 1) s = 1;
      var cx = (b.fx + b.driftAmp * Math.sin((Math.PI * 2 * b.kx * t) / LOOP + b.px)) * W;
      var cy = (b.fy + b.driftAmp * 0.6 * Math.sin((Math.PI * 2 * b.ky * t) / LOOP + b.py)) * H;
      var sup = suppressionAt(cx, cy, t);
      var a = 0.075 * s * (1 - 0.92 * sup);
      if (a < 0.004) continue;
      var r = b.rFrac * minDim * (0.8 + 0.45 * s);
      ctx.fillStyle = 'rgba(' + HAZE + ',' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(' + HAZE + ',' + (a * 1.4).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.66, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(' + HAZE + ',' + (a * 1.8).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.4, 0, Math.PI * 2); ctx.fill();
    }

    // echo ripples from haze peaks (the dub delay made visible)
    ctx.lineWidth = 1.5;
    for (i = 0; i < peaks.length; i++) {
      var pk = peaks[i];
      var age = (((t - pk.tPeak) % LOOP) + LOOP) % LOOP;
      drawRipple(pk.fx * W, pk.fy * H, age, minDim, 0.20);
      drawRipple(pk.fx * W, pk.fy * H, age - 0.5, minDim, 0.12);
    }
    // tap ripples: three concentric rings
    for (i = 0; i < tapRipples.length; i++) {
      var tr = tapRipples[i];
      var tage = t - tr.t;
      if (tage < 0 || tage > 5) continue;
      drawRipple(tr.x, tr.y, tage, minDim, 0.28);
      drawRipple(tr.x, tr.y, tage - 0.4, minDim, 0.20);
      drawRipple(tr.x, tr.y, tage - 0.8, minDim, 0.13);
    }

    // skyline silhouette
    ctx.fillStyle = SKYLINE;
    for (i = 0; i < skyline.length; i++) {
      b = skyline[i];
      var bx = b.fx * W, bw = b.fw * W, bh = b.fh * H;
      var by = horizon - bh;
      ctx.fillRect(bx, by, bw, bh);
      if (b.roof) {
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + bw / 2, by - bh * 0.28);
        ctx.lineTo(bx + bw, by);
        ctx.closePath(); ctx.fill();
      }
      if (b.chimney) ctx.fillRect(bx + bw * 0.62, by - bh * 0.22, bw * 0.14, bh * 0.22);
    }
    // lit windows, in the haze tone at low alpha
    for (i = 0; i < skyline.length; i++) {
      b = skyline[i];
      var bx2 = b.fx * W, bw2 = b.fw * W, bh2 = b.fh * H, by2 = horizon - bh2;
      for (var wi = 0; wi < b.windows.length; wi++) {
        var wn = b.windows[wi];
        ctx.fillStyle = 'rgba(' + HAZE + ',' + wn.a.toFixed(3) + ')';
        ctx.fillRect(bx2 + wn.wx * bw2, by2 + wn.wy * bh2, Math.max(2, W * 0.003), Math.max(3, H * 0.004));
      }
    }

    // drone waveform strip: scrolling amplitude trace of the same curve
    var stripTop = H * 0.915, stripBot = H * 0.985, mid = (stripTop + stripBot) / 2;
    var half = (stripBot - stripTop) / 2;
    ctx.strokeStyle = WAVE;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(1.5, W * 0.0016);
    ctx.beginPath();
    var step = isPhone ? 4 : 3;
    for (var x = 0; x <= W; x += step) {
      var back = (1 - x / W) * 55;
      var vv = smoothedAt(day - back);
      var amp = vv * half * (0.72 + 0.28 * Math.sin(t * 7 + x * 0.22));
      ctx.moveTo(x, mid - amp);
      ctx.lineTo(x, mid + amp);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // legend (top margin) and caption (near the skyline)
    ctx.fillStyle = TEXT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var legendSize = isPhone ? 10.5 : 12;
    ctx.font = legendSize + 'px monospace';
    var legend = 'haze = particulate · waveform height = drone volume · cutoff = filter';
    if (ctx.measureText(legend).width > W - 28) {
      ctx.fillText('haze = particulate · waveform height = drone volume', 14, 8 + legendSize);
      ctx.fillText('cutoff = filter', 14, 10 + legendSize * 2);
    } else {
      ctx.fillText(legend, 14, 8 + legendSize);
    }
    var capSize = isPhone ? 10.5 : 12;
    ctx.font = capSize + 'px sans-serif';
    ctx.fillText('a year of Bristol air, gathered by citizen scientists', 14, horizon - 8);
  }

  function drawRipple(cx, cy, age, minDim, aMax) {
    if (age < 0 || age > 5) return;
    var r = 12 + age * 0.16 * minDim;
    var a = aMax * (1 - age / 5);
    if (a <= 0.004) return;
    ctx.strokeStyle = 'rgba(' + RIPPLE + ',' + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // ---------- main loop ----------
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
  draw(0);
  function frame() {
    var t = nowT();
    draw(t);
    audioUpdate(smoothedAt(dayAt(t)), t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
