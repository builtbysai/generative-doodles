<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Heads, One Flower</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (flat fills only, no gradients anywhere)
  var BROWN = '#3B1F16', FLAME = '#E6392B', LEAF = '#3FA34D',
      GOLD = '#D9A441', WHITE = '#FFFFFF';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var PHASE0 = 1.6;                 // fixed first-frame phase (determinism)
  var simT = PHASE0;

  // ---- precomputed grain (seeded speck arrays, drawn directly) ----
  var groundGrain = [], headGrain = [];
  (function buildGrain() {
    var rng = mulberry32(523063);
    var i;
    for (i = 0; i < 700; i++) {                 // faint warm dust on the white ground
      groundGrain.push({ x: rng(), y: rng(), r: 0.0009 + rng() * 0.0016, a: 0.025 + rng() * 0.035 });
    }
    for (i = 0; i < 300; i++) {                 // gouache tooth inside the head silhouette
      headGrain.push({
        x: 0.07 + rng() * 0.38, y: 0.30 + rng() * 0.67,
        r: 0.0009 + rng() * 0.0018, light: rng() < 0.5, a: 0.04 + rng() * 0.05
      });
    }
  })();

  // ---- scalp swirls (tattoo spirals, clipped to the head) ----
  var SWIRLS = [
    { x: 0.155, y: 0.440, r: 0.042, col: WHITE, dir: 1,  ph: 0.0 },
    { x: 0.228, y: 0.378, r: 0.033, col: FLAME, dir: -1, ph: 1.7 },
    { x: 0.292, y: 0.452, r: 0.027, col: WHITE, dir: 1,  ph: 3.1 },
    { x: 0.140, y: 0.585, r: 0.036, col: FLAME, dir: -1, ph: 4.4 },
    { x: 0.212, y: 0.520, r: 0.023, col: WHITE, dir: 1,  ph: 5.6 }
  ];

  // ---- flame-flower crown ----
  var PETALS = [
    { ang: -0.55, h: 0.335, w: 0.060, ph: 0.0 },
    { ang: -0.28, h: 0.400, w: 0.066, ph: 0.8 },
    { ang:  0.00, h: 0.445, w: 0.070, ph: 1.6 },
    { ang:  0.28, h: 0.400, w: 0.066, ph: 2.4 },
    { ang:  0.55, h: 0.335, w: 0.060, ph: 3.2 }
  ];
  var LEAVES = [
    { ang: -0.85, len: 0.195, wid: 0.052 },
    { ang: -0.15, len: 0.235, wid: 0.058 },
    { ang:  0.70, len: 0.185, wid: 0.050 }
  ];

  // ---- interaction state ----
  var lean = 0, leanV = 0, leanTarget = 0;      // head lean (springed)
  var flag = 0, flagV = 0;                      // flower lag (looser spring)
  var dragging = false, dragStartX = 0;

  var W = 0, H = 0, S = 0, OX = 0, OY = 0, LWF = 1;

  function isPhone() {
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    if (sw < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw();
  }

  // ---- path builders ----

  function headPath() {
    ctx.beginPath();
    ctx.moveTo(0.144, 0.960);
    ctx.bezierCurveTo(0.109, 0.800, 0.089, 0.660, 0.099, 0.520);   // back of head
    ctx.bezierCurveTo(0.109, 0.400, 0.164, 0.335, 0.249, 0.315);   // skull top
    ctx.bezierCurveTo(0.314, 0.300, 0.352, 0.330, 0.368, 0.390);   // forehead
    ctx.bezierCurveTo(0.378, 0.425, 0.372, 0.450, 0.358, 0.472);   // brow hollow
    ctx.bezierCurveTo(0.385, 0.495, 0.432, 0.508, 0.440, 0.530);   // nose
    ctx.bezierCurveTo(0.438, 0.548, 0.415, 0.556, 0.400, 0.560);   // under nose
    ctx.bezierCurveTo(0.409, 0.578, 0.424, 0.585, 0.439, 0.592);   // philtrum
    ctx.bezierCurveTo(0.464, 0.598, 0.466, 0.608, 0.449, 0.614);   // upper lip
    ctx.bezierCurveTo(0.439, 0.618, 0.439, 0.622, 0.452, 0.628);   // mouth notch
    ctx.bezierCurveTo(0.466, 0.636, 0.459, 0.648, 0.434, 0.652);   // lower lip
    ctx.bezierCurveTo(0.414, 0.660, 0.412, 0.672, 0.429, 0.682);   // under lip
    ctx.bezierCurveTo(0.449, 0.695, 0.434, 0.715, 0.399, 0.725);   // chin
    ctx.bezierCurveTo(0.359, 0.738, 0.329, 0.775, 0.314, 0.830);   // jaw
    ctx.bezierCurveTo(0.309, 0.885, 0.314, 0.925, 0.319, 0.960);   // neck front
    ctx.closePath();
  }

  function petalPath(h, w) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-w * 0.90, -h * 0.22, -w * 0.75, -h * 0.55, -w * 0.12, -h * 0.82);
    ctx.bezierCurveTo(-w * 0.02, -h * 0.92,  w * 0.10, -h * 0.97,  w * 0.16, -h);
    ctx.bezierCurveTo( w * 0.55, -h * 0.72,  w * 0.85, -h * 0.42,  w * 0.55, -h * 0.16);
    ctx.bezierCurveTo( w * 0.38, -h * 0.05,  w * 0.18, 0, 0, 0);
    ctx.closePath();
  }

  function leafPath(len, wid) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-wid, -len * 0.30, -wid * 0.80, -len * 0.75, 0, -len);
    ctx.bezierCurveTo( wid * 0.80, -len * 0.75,  wid, -len * 0.30, 0, 0);
    ctx.closePath();
  }

  function spiralPath(r) {
    var turns = 2.2, steps = 44, i, a, rr;
    ctx.beginPath();
    for (i = 0; i <= steps; i++) {
      a = (i / steps) * turns * Math.PI * 2;
      rr = r * (i / steps);
      if (i === 0) ctx.moveTo(0, 0);
      else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
  }

  function drawFlower(t) {
    var sway = Math.sin(t * 0.8) * 0.035 + (flag - lean) * 0.9;
    ctx.save();
    ctx.translate(0.249, 0.330);                    // flower base on the scalp
    ctx.rotate(sway);
    var i, p, l;
    ctx.fillStyle = FLAME;
    for (i = 0; i < PETALS.length; i++) {           // petals first (behind)
      p = PETALS[i];
      ctx.save();
      ctx.rotate(p.ang + Math.sin(t * 1.05 + p.ph) * 0.045);
      petalPath(p.h, p.w);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = LEAF;
    for (i = 0; i < LEAVES.length; i++) {           // leaves in front, lower
      l = LEAVES[i];
      ctx.save();
      ctx.rotate(l.ang + Math.sin(t * 0.9 + i * 1.3) * 0.03);
      leafPath(l.len, l.wid);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawSide(t, mirror) {
    ctx.save();
    if (mirror) { ctx.translate(1, 0); ctx.scale(-1, 1); }
    ctx.translate(0.270, 0.970);                    // lean pivot at the neck base
    ctx.rotate(lean);
    ctx.translate(-0.270, -0.970);

    drawFlower(t);

    headPath();
    ctx.fillStyle = BROWN;
    ctx.fill();

    ctx.save();
    headPath();
    ctx.clip();
    var i, g;
    for (i = 0; i < headGrain.length; i++) {        // grain tooth on the brown
      g = headGrain[i];
      ctx.fillStyle = g.light ? 'rgba(255,255,255,' + g.a + ')' : 'rgba(0,0,0,' + g.a + ')';
      ctx.fillRect(g.x - g.r, g.y - g.r, g.r * 2, g.r * 2);
    }
    ctx.lineCap = 'round';
    for (i = 0; i < SWIRLS.length; i++) {           // tattoo swirls, slowly rotating
      var sw = SWIRLS[i];
      ctx.save();
      ctx.translate(sw.x, sw.y);
      ctx.rotate(sw.dir * t * 0.22 + sw.ph);
      ctx.strokeStyle = sw.col;
      ctx.lineWidth = 0.0055 * LWF;
      spiralPath(sw.r);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // gold hoop earring: the only small detail
    ctx.beginPath();
    ctx.arc(0.219, 0.605, 0.006, 0, Math.PI * 2);
    ctx.fillStyle = GOLD;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0.219, 0.650, 0.020, 0, Math.PI * 2);
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = 0.0075 * LWF;
    ctx.stroke();

    ctx.restore();
  }

  function draw() {
    canvas.style.width = W + 'px';                 // pin the element in draw()
    canvas.style.height = H + 'px';
    ctx.fillStyle = WHITE;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S, S);

    var i, g;
    for (i = 0; i < groundGrain.length; i++) {      // faint grain on the ground
      g = groundGrain[i];
      ctx.fillStyle = 'rgba(59,31,22,' + g.a + ')';
      ctx.fillRect(g.x - g.r, g.y - g.r, g.r * 2, g.r * 2);
    }

    LWF = isPhone() ? 1.25 : 1;
    drawSide(simT, false);
    drawSide(simT, true);
    ctx.restore();

    ctx.fillStyle = 'rgba(59,31,22,0.38)';
    ctx.font = '600 ' + Math.max(11, Math.round(S * 0.022)) + 'px system-ui, sans-serif';
    ctx.fillText('drag', OX + S * 0.024, OY + S - S * 0.030);
  }

  // ---- animation loop (guarded; frame one is the synchronous draw above) ----
  var lastTs = null;
  function frame(ts) {
    var dt = 0;
    if (lastTs !== null && typeof ts === 'number') dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
    lastTs = ts;
    if (dt > 0) {
      simT += dt;
      leanV += (110 * (leanTarget - lean) - 15 * leanV) * dt;
      lean += leanV * dt;
      flagV += (42 * (lean - flag) - 8.5 * flagV) * dt;
      flag += flagV * dt;
    }
    draw();
    if (typeof window.requestAnimationFrame === 'function') {
      window.requestAnimationFrame(frame);
    }
  }

  // ---- pointer: drag horizontally to lean the heads ----
  function ptrX(e) {
    if (e && typeof e.clientX === 'number') return e.clientX;
    if (e && e.touches && e.touches.length) return e.touches[0].clientX;
    return 0;
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragStartX = ptrX(e);
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = (ptrX(e) - dragStartX) / (S || 1);
    leanTarget = Math.max(-0.13, Math.min(0.13, dx * 1.1));
  });
  function endDrag() { dragging = false; leanTarget = 0; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  function onResize() { resize(); }
  window.addEventListener('resize', onResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

  resize();                                          // synchronous first frame at PHASE0
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
