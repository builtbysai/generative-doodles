<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cast an Audible Shadow</title>
<style>
html, body { margin: 0; padding: 0; background: #6f6a62; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
/* Palette: warm dim grey wall, dark dish interiors, soft shadow grey,
   flutter ripples in deep indigo, neon bar in pale red. */
var WALL_DIM = [87, 82, 76];    /* #57524c, deep in the light cycle */
var WALL_LIT = [141, 132, 120]; /* #8d8478, bright in the light cycle */
var DISH_OUT = '#55504a';
var DISH_MID = '#2e2a26';
var DISH_IN = '#171512';
var BOWL_IN = '#0d0c0b';
var BOWL_OUT = '#262220';
var HUB = '#3d3833';
var RIM_HI = 'rgba(230,220,205,0.35)';
var SHADOW_RGB = '30,28,26';
var RIPPLE_RGB = '43,36,96'; /* deep indigo */
var NEON = '#e9a8a4'; /* pale red */
var NEON_DIM = 'rgba(120,90,88,0.55)';
var CONE_LINE = 'rgba(220,210,195,0.10)';
var CONE_GLOW = 'rgba(255,245,230,0.03)';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, NO pointer present (pre-visitor state) */
var DAY_PERIOD = 600.0; /* seconds; one slow daylight drift */
var SHIMMER_HZ = 120.0; /* faint 120-cycle shimmer on top of the drift */
var NEON_PERIOD = 24.0; /* seconds; slow neon blink cycle */
var DISH_Y = 0.55; /* dish centre height as a fraction of the field height */
var DISH_XL = 0.30; /* left dish centre as a fraction of the field width */
var DISH_XR = 0.70; /* right dish centre as a fraction of the field width */
var DISH_R = 0.13; /* dish radius as a fraction of the field size */
var CONE_R = 0.30; /* vision-cone radius as a fraction of the field size */
var CONE_HALF = 0.70; /* vision-cone half-angle, radians (~40 deg from vertical) */
var CONE_LEN = 0.34; /* vision-cone boundary line length, fraction of field height */
var SHADOW_R = 0.085; /* shadow blob radius as a fraction of the field size */
var SHADOW_DX = 0.06; /* shadow offset right of the pointer, fraction of field size */
var SHADOW_DY = 0.10; /* shadow offset below the pointer, fraction of field size */
var NEON_Y = 0.10; /* neon bar height as a fraction of the field height */
var PLATE_FILL = '#33302c';
var PLATE_LINE = 'rgba(255,255,255,0.28)';
var PLATE_INK = '#efece6';
var HINT_INK = '#efece6';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
/* Seeded RNG (mulberry32) for the static wall grain only; frame one is
   identical on every load because the seed is fixed. */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var pointer = { seen: false, x: 0, y: 0 };
var ripples = []; /* { dish: 0|1, birth: piece time, strength: 0..1 }; empty at frame one */
var lastRipple = [-1e9, -1e9];
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
/* Static wall grain: 240 speckles in field-relative coords, fixed seed. */
var GRAIN_N = 240;
var grain = [];
(function () {
  var rnd = mulberry32(1783);
  var i;
  for (i = 0; i < GRAIN_N; i++) {
    grain.push({ x: rnd(), y: rnd(), r: 0.0006 + rnd() * 0.0016, a: 0.03 + rnd() * 0.05 });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* Daylight drift 0..1, closed form of piece time. At t = 60 s:
   D = 0.5 + 0.5*sin(0) = 0.5, rising: the light is mid-drift, warming. */
function daylight(t) {
  return 0.5 + 0.5 * Math.sin(TAU * (t - FRAME_T) / DAY_PERIOD);
}
/* Faint 120-cycle shimmer, closed form. At 60 fps display it samples near a
   constant, so it reads as a faint lift, never a strobe. */
function shimmer(t) {
  return 0.02 * Math.sin(TAU * SHIMMER_HZ * t);
}
/* Overall light level 0..1: daylight drift plus shimmer. At t = 60 s:
   0.5 + 0.02*sin(TAU*7200) = 0.5 exactly. */
function lightLevel(t) {
  return clamp(daylight(t) + shimmer(t), 0, 1);
}
function wallColor(t) {
  var L = lightLevel(t);
  var r = Math.round(lerp(WALL_DIM[0], WALL_LIT[0], L));
  var g = Math.round(lerp(WALL_DIM[1], WALL_LIT[1], L));
  var b = Math.round(lerp(WALL_DIM[2], WALL_LIT[2], L));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
/* Neon level 0..1, closed form of piece time. Cycle of 24 s: on 0-16 s with
   a brief double-blink at the start (on 0-0.4, dip 0.4-0.7, on 0.7-16),
   off 16-24 s at a dim 0.08. At t = 60 s: 60 mod 24 = 12, steady on, 1. */
function neonLevel(t) {
  var p = t % NEON_PERIOD;
  if (p < 0.4) return 1;
  if (p < 0.7) return 0.15;
  if (p < 16) return 1;
  return 0.08;
}
function dishPos(i) {
  return {
    x: F.x + (i === 0 ? DISH_XL : DISH_XR) * F.w,
    y: F.y + DISH_Y * F.h
  };
}
/* Shadow centre: the pointer plus a fixed light-direction offset (light from
   the upper left, so the shadow falls down and right). No pointer at frame
   one, so no shadow and no ripples in frame one. */
function shadowPos() {
  var S = Math.min(F.w, F.h);
  return {
    x: pointer.x + SHADOW_DX * S,
    y: pointer.y + SHADOW_DY * S,
    r: SHADOW_R * S
  };
}
/* Shadow overlap with dish i's vision cone, 0..1. The cone is the disc of
   radius CONE_R around the dish centre; overlap grows as the shadow blob
   sinks into it. Closed form of pointer position; 0 with no pointer. */
function coneOverlap(i) {
  if (!pointer.seen) return 0;
  var d = dishPos(i);
  var s = shadowPos();
  var dist = Math.sqrt((s.x - d.x) * (s.x - d.x) + (s.y - d.y) * (s.y - d.y));
  var S = Math.min(F.w, F.h);
  var R = CONE_R * S;
  if (dist >= R + s.r) return 0;
  return clamp((R + s.r - dist) / (2 * s.r), 0, 1);
}
function drawWall(t) {
  ctx.fillStyle = wallColor(t);
  ctx.fillRect(0, 0, VW, VH);
  /* faint skirting line near the bottom of the field */
  ctx.strokeStyle = 'rgba(20,18,16,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(F.x, F.y + 0.88 * F.h);
  ctx.lineTo(F.x + F.w, F.y + 0.88 * F.h);
  ctx.stroke();
  /* static grain */
  var i, g;
  for (i = 0; i < grain.length; i++) {
    g = grain[i];
    ctx.fillStyle = 'rgba(20,18,16,' + g.a.toFixed(4) + ')';
    ctx.beginPath();
    ctx.arc(F.x + g.x * F.w, F.y + g.y * F.h, Math.max(0.5, g.r * Math.min(F.w, F.h)), 0, TAU);
    ctx.fill();
  }
}
function drawNeon(t) {
  var S = Math.min(F.w, F.h);
  var y = F.y + NEON_Y * F.h;
  var x0 = F.x + 0.28 * F.w, x1 = F.x + 0.72 * F.w;
  var h = Math.max(2, 0.008 * S);
  var lvl = neonLevel(t);
  if (lvl > 0.5) {
    /* glow wash behind the bar while it is on */
    ctx.fillStyle = 'rgba(233,168,164,0.10)';
    ctx.fillRect(x0 - 6, y - 8, (x1 - x0) + 12, h + 16);
    ctx.fillStyle = NEON;
    ctx.fillRect(x0, y, x1 - x0, h);
    ctx.fillStyle = 'rgba(255,235,230,0.85)';
    ctx.fillRect(x0, y, x1 - x0, Math.max(1, h * 0.4));
  } else {
    ctx.fillStyle = NEON_DIM;
    ctx.fillRect(x0, y, x1 - x0, h);
  }
}
/* Vision cone: a faint radial glow disc around the dish plus two boundary
   lines fanning upward at +-CONE_HALF from vertical, length CONE_LEN. The
   cone is a zone on the wall; it is drawn faint on purpose so the wall
   stays generous and quiet. */
function drawCone(i) {
  var d = dishPos(i);
  var S = Math.min(F.w, F.h);
  ctx.fillStyle = CONE_GLOW;
  ctx.beginPath();
  ctx.arc(d.x, d.y, CONE_R * S, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = CONE_LINE;
  ctx.lineWidth = 1;
  var len = CONE_LEN * F.h;
  var a;
  for (a = -1; a <= 1; a += 2) {
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + a * Math.sin(CONE_HALF) * len, d.y - Math.cos(CONE_HALF) * len);
    ctx.stroke();
  }
}
function drawDish(i) {
  var d = dishPos(i);
  var S = Math.min(F.w, F.h);
  var r = DISH_R * S;
  var g;
  /* outer rim */
  g = ctx.createRadialGradient(d.x - r * 0.25, d.y - r * 0.3, r * 0.1, d.x, d.y, r);
  g.addColorStop(0, DISH_MID);
  g.addColorStop(0.75, DISH_MID);
  g.addColorStop(1, DISH_OUT);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(d.x, d.y, r, 0, TAU);
  ctx.fill();
  /* inner bowl, darker toward the centre */
  g = ctx.createRadialGradient(d.x, d.y, r * 0.05, d.x, d.y, r * 0.72);
  g.addColorStop(0, BOWL_IN);
  g.addColorStop(1, BOWL_OUT);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(d.x, d.y, r * 0.72, 0, TAU);
  ctx.fill();
  /* feed hub at the centre */
  ctx.fillStyle = HUB;
  ctx.beginPath();
  ctx.arc(d.x, d.y, Math.max(2, r * 0.10), 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(230,220,205,0.5)';
  ctx.beginPath();
  ctx.arc(d.x, d.y, Math.max(1, r * 0.035), 0, TAU);
  ctx.fill();
  /* rim light on the upper-left edge */
  ctx.strokeStyle = RIM_HI;
  ctx.lineWidth = Math.max(1, 0.006 * S);
  ctx.beginPath();
  ctx.arc(d.x, d.y, r * 0.97, Math.PI * 0.75, Math.PI * 1.45);
  ctx.stroke();
}
/* The visitor's shadow: a soft radial-gradient blob. Drawn after the
   dishes so it darkens dish and wall alike where it falls. */
function drawShadow() {
  if (!pointer.seen) return;
  var s = shadowPos();
  var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
  g.addColorStop(0, 'rgba(' + SHADOW_RGB + ',0.42)');
  g.addColorStop(0.7, 'rgba(' + SHADOW_RGB + ',0.22)');
  g.addColorStop(1, 'rgba(' + SHADOW_RGB + ',0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.r, 0, TAU);
  ctx.fill();
}
/* Flutter ripples: quick deep-indigo rings expanding from a dish. A ripple
   is a closed-form function of its birth time and strength; births happen
   only while a shadow overlaps that dish's cone. When the neon is on, the
   neon cycle co-opts the rhythm: ring radius takes a small term synced to
   the neon phase. */
function drawRipples(t) {
  var S = Math.min(F.w, F.h);
  var i, rp, age, frac, r, a, k;
  for (i = 0; i < ripples.length; i++) {
    rp = ripples[i];
    age = t - rp.birth;
    if (age < 0 || age > 1.6) continue;
    var d = dishPos(rp.dish);
    var neonSync = neonLevel(t) > 0.5 ? 0.012 * S * Math.sin(TAU * ((t % NEON_PERIOD) / NEON_PERIOD)) : 0;
    for (k = 0; k < 2; k++) {
      frac = clamp((age / 1.6) * 1.25 - k * 0.35, 0, 1);
      if (frac <= 0 || frac >= 1) continue;
      r = (0.05 + frac * 0.25) * S + neonSync * frac;
      a = rp.strength * (1 - frac) * 0.55;
      ctx.strokeStyle = 'rgba(' + RIPPLE_RGB + ',' + a.toFixed(4) + ')';
      ctx.lineWidth = Math.max(1, 0.005 * S * (1 - frac * 0.5));
      ctx.beginPath();
      ctx.arc(d.x, d.y, r, 0, TAU);
      ctx.stroke();
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Cast an Audible Shadow').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Cast an Audible Shadow').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 29').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Cast an Audible Shadow', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 29', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Move to cast a shadow.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  drawWall(phaseT);
  drawNeon(phaseT);
  drawCone(0);
  drawCone(1);
  drawDish(0);
  drawDish(1);
  drawShadow();
  drawRipples(phaseT);
  drawPlates();
}
/* Ripple births: while the shadow overlaps a dish's cone, a ripple is born
   at an interval that shortens with overlap (0.9 s at a graze, 0.22 s deep
   in the cone; 15 percent shorter while the neon is on, the neon co-opting
   the rhythm). No pointer means no overlap and no births. */
function updateRipples(t) {
  var i, ov, interval;
  for (i = 0; i < 2; i++) {
    ov = coneOverlap(i);
    if (ov <= 0.12) continue;
    interval = lerp(0.9, 0.22, ov);
    if (neonLevel(t) > 0.5) interval *= 0.85;
    if (t - lastRipple[i] >= interval) {
      ripples.push({ dish: i, birth: t, strength: clamp(0.35 + ov * 0.65, 0, 1) });
      lastRipple[i] = t;
      thump(ov);
    }
  }
  /* prune spent ripples */
  var kept = [], j;
  for (j = 0; j < ripples.length; j++) {
    if (t - ripples[j].birth <= 1.6) kept.push(ripples[j]);
  }
  ripples = kept;
}
/* Optional short filtered thump, only ever inside a visitor gesture. */
function thump(ov) {
  try {
    if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
      var AC = typeof AudioContext !== 'undefined' ? AudioContext : webkitAudioContext;
      var ac = new AC();
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.frequency.value = 70 + 60 * ov;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.02, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + 0.55);
    }
  } catch (e) { /* audio is optional; the piece works fully muted */ }
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    lightLevel: function () { return lightLevel(phaseT); },
    neonLevel: function () { return neonLevel(phaseT); },
    coneOverlap: function (i) { return coneOverlap(i); }
  };
}
/* ---- frame one: fixed phase t = 60 s, no pointer ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) {
  /* The pointer is the visitor: moving it casts the shadow. Tap toggles
     nothing; there is no click-to-reload anywhere in this piece. */
  window.addEventListener('pointermove', function (ev) {
    pointer.seen = true;
    pointer.x = ev.clientX;
    pointer.y = ev.clientY;
  });
  window.addEventListener('pointerdown', function (ev) {
    pointer.seen = true;
    pointer.x = ev.clientX;
    pointer.y = ev.clientY;
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) {
        updateRipples(phaseT);
        draw();
      }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
