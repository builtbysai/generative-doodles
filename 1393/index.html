<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vertical Montage</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0f14; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1393000);

  // One seeded value-noise field, sampled at different scales per band.
  // Lattice values are fixed at load from the seeded PRNG.
  var LW = 256, LH = 256;
  var lattice = new Float32Array(LW * LH);
  for (var i = 0; i < LW * LH; i++) lattice[i] = rng();
  function hash2(ix, iy) {
    var x = ((ix % LW) + LW) % LW;
    var y = ((iy % LH) + LH) % LH;
    return lattice[y * LW + x];
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  // Value noise in [0,1). nx, ny in lattice units.
  function noise(nx, ny) {
    var ix = Math.floor(nx), iy = Math.floor(ny);
    var fx = nx - ix, fy = ny - iy;
    var a = hash2(ix, iy), b = hash2(ix + 1, iy);
    var c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
    var u = smooth(fx), v = smooth(fy);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  // Fractal sum over octaves, still in [0,1) roughly.
  function fbm(nx, ny, oct) {
    var sum = 0, amp = 1, tot = 0, f = 1;
    for (var o = 0; o < oct; o++) {
      sum += amp * noise(nx * f, ny * f);
      tot += amp; amp *= 0.5; f *= 2;
    }
    return sum / tot;
  }

  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W; canvas.height = H;
    var minDim = Math.min(window.screen.width, window.screen.height);
    phone = minDim < 700 || (H > W * 1.15 && minDim < 900);
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(clockT); });
    }
    window.addEventListener('resize', function () { size(); draw(clockT); });
  }

  // Strata: base fractions, unequal. Drag re-weights them (closed-form decay).
  var drags = []; // {t0, dy}
  var DRAG_TAU = 3.0;
  function dragOffset(t) {
    var off = 0;
    for (var i = 0; i < drags.length; i++) {
      var dt = t - drags[i].t0;
      if (dt >= 0) off += drags[i].dy * Math.exp(-dt / DRAG_TAU);
    }
    return off;
  }
  function strata(t) {
    // Drag down expands the top band, drag up expands the bottom band.
    var shift = dragOffset(t) * 0.0009; // fraction per px, decaying
    if (shift > 0.12) shift = 0.12;
    if (shift < -0.12) shift = -0.12;
    var top = 0.30 + shift;
    var mid = 0.42 - shift * 0.5;
    var bot = 1 - top - mid;
    return { top: top * H, mid: mid * H, bot: bot * H };
  }

  // Short-circuit: every 40 s, a ~2.4 s window where all bands sync.
  // The sync modulates drift RATE, not position: effective drift is the
  // closed-form integral of the rate, so positions stay continuous and
  // the bands genuinely converge to one shared rate, then drift apart.
  // syncEnv: 0 outside the window, smooth ramps at its edges.
  function syncEnv(t) {
    var cyc = t % 40;
    if (cyc < 1.2) { var u = cyc / 1.2; return u * u * (3 - 2 * u); }
    if (cyc > 38.8) { var v = (cyc - 38.8) / 1.2; return 1 - v * v * (3 - 2 * v); }
    return 0;
  }
  // Closed-form integral of syncEnv from 0 to t.
  function syncIntegral(t) {
    var cycles = Math.floor(t / 40);
    var cyc = t - cycles * 40;
    var part = 0.6;
    if (cyc < 1.2) {
      var x = cyc / 1.2;
      part = 1.2 * (x * x * x - 0.5 * x * x * x * x);
    } else if (cyc > 38.8) {
      var y = (cyc - 38.8) / 1.2;
      part = 0.6 + 1.2 * (y - (y * y * y - 0.5 * y * y * y * y));
    }
    return cycles * 1.2 + part;
  }
  // Drift offsets per band (px-equivalent phase). Stars slowest, veins fastest.
  // During the sync window every band's rate converges to the common 12.
  function drift(bandRate, t) {
    return bandRate * t + (12 - bandRate) * syncIntegral(t);
  }

  function disc(x, y, r, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function rect(x, y, w, h, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 1;
  }

  // Star band: jittered grid of stars, brightness from the shared noise field.
  function drawStars(t, y0, y1, bleedBelow) {
    var d = drift(6, t); // slow
    var step = phone ? 34 : 46;
    var yBottom = y1 + bleedBelow;
    for (var gx = 0; gx * step < W + step; gx++) {
      for (var gy = 0; gy * step < (y1 - y0) + bleedBelow + step; gy++) {
        var jx = hash2(gx * 3 + 11, gy * 7 + 5) * step * 0.8;
        var jy = hash2(gx * 5 + 2, gy * 3 + 9) * step * 0.8;
        var x = gx * step + jx + (d % step);
        var y = y0 + gy * step + jy;
        if (y > yBottom) continue;
        var n = fbm((x - d) / 260, y / 260, 3);
        if (n < 0.42) continue;
        var bleed = 1;
        if (y > y1) bleed = Math.max(0, 1 - (y - y1) / bleedBelow);
        var r = 0.7 + (n - 0.42) * 3.2;
        if (r > 2.6) r = 2.6;
        disc(x, y, r, '#e8e6dc', 0.25 + (n - 0.42) * 1.2 * bleed);
        if (n > 0.78) disc(x, y, r * 2.6, '#e8e6dc', 0.10 * bleed);
      }
    }
  }

  // Canopy band: leaf blobs + bark trunks from the shared noise field.
  function drawCanopy(t, y0, y1, bleedAbove, bleedBelow) {
    var d = drift(18, t);
    var step = phone ? 26 : 34;
    var yTop = y0 - bleedAbove, yBottom = y1 + bleedBelow;
    // Trunks: vertical bark strokes, seeded columns.
    for (var tx = 0; tx < W + 60; tx += 90) {
      var col = Math.floor(tx / 90);
      var tn = hash2(col * 7 + 3, 41);
      if (tn < 0.35) continue;
      var tw = 3 + tn * 7;
      var th = (y1 - y0) * (0.55 + tn * 0.45);
      var sway = Math.sin(t * 0.25 + col) * 6;
      rect(tx + sway, y1 - th, tw, th, '#4a3826', 0.9);
    }
    for (var gx = 0; gx * step < W + step; gx++) {
      for (var gy = 0; gy * step < (y1 - y0) + bleedAbove + bleedBelow + step; gy++) {
        var y = yTop + gy * step + hash2(gx * 2 + 17, gy * 5 + 1) * step * 0.7;
        if (y > yBottom) continue;
        var x = gx * step + hash2(gx * 4 + 8, gy * 3 + 13) * step * 0.7 + (d % step);
        var n = fbm((x - d) / 150, y / 150, 4);
        if (n < 0.48) continue;
        var bleed = 1;
        if (y < y0) bleed = Math.max(0, 1 - (y0 - y) / bleedAbove);
        if (y > y1) bleed = Math.max(0, 1 - (y - y1) / bleedBelow);
        var r = 3 + (n - 0.48) * 14;
        disc(x, y, r, '#2f6b3a', 0.35 + (n - 0.48) * 0.9 * bleed);
        if (n > 0.66) disc(x, y, r * 0.45, '#5a8a4a', 0.5 * bleed);
      }
    }
  }

  // Vein band: amber network. Nodes live on a grid keyed by the shared
  // noise field; passing nodes connect to passing right/down neighbors,
  // so the band reads as a network, not a scatter.
  function drawVeins(t, y0, y1, bleedAbove) {
    var d = drift(42, t); // fastest
    var step = phone ? 30 : 40;
    var yTop = y0 - bleedAbove;
    var cols = Math.ceil((W + step) / step);
    var rows = Math.ceil(((y1 - y0) + bleedAbove + step) / step);
    var gstep = d / step; // drift in grid units
    function vpass(gx, gy) {
      var n = fbm((gx - gstep) * 0.32, gy * 0.32, 4);
      return (n >= 0.50 && n <= 0.74) ? n : 0;
    }
    function vpos(gx, gy) {
      return {
        x: gx * step + hash2(gx * 3 + 29, gy * 7 + 6) * step * 0.6,
        y: yTop + gy * step + hash2(gx * 6 + 4, gy * 2 + 21) * step * 0.6
      };
    }
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = '#e0962a';
    for (var gx = 0; gx < cols; gx++) {
      for (var gy = 0; gy < rows; gy++) {
        var n = vpass(gx, gy);
        if (!n) continue;
        var p = vpos(gx, gy);
        if (p.y > y1) continue;
        var bleed = 1;
        if (p.y < y0) bleed = Math.max(0, 1 - (y0 - p.y) / bleedAbove);
        // Connect to passing right and down neighbors.
        var nb = [[gx + 1, gy], [gx, gy + 1]];
        for (var k = 0; k < 2; k++) {
          if (!vpass(nb[k][0], nb[k][1])) continue;
          var q = vpos(nb[k][0], nb[k][1]);
          if (q.y > y1) continue;
          ctx.globalAlpha = 0.55 * bleed;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        disc(p.x, p.y, 2.2, '#e0962a', 0.8 * bleed);
        if (n > 0.66) disc(p.x, p.y, 4.5, '#e0962a', 0.18 * bleed);
      }
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var s = strata(t);
    var yTop = 0, yMid = s.top, yBot = yTop + s.top + s.mid;
    var bleed = phone ? 18 : 28;
    // Backgrounds.
    rect(0, 0, W, s.top, '#0d0f14', 1);
    rect(0, s.top, W, s.mid, '#12240f', 1);
    rect(0, yBot, W, H - yBot, '#1c0d0d', 1);
    // Bands, drawn in order so bleed zones overlap naturally.
    drawStars(t, 0, s.top, bleed);
    drawCanopy(t, s.top, yBot, bleed, bleed);
    drawVeins(t, yBot, H, bleed);
    // Seeded dither bleed: sparse dots of the neighboring band's color
    // scattered across each seam, flat-alpha, never a gradient.
    for (var i = 0; i < 240; i++) {
      var seam = (i % 2 === 0) ? s.top : yBot;
      var dx = hash2(i * 13 + 1, 77) * W;
      var dy = seam + (hash2(i * 7 + 3, 78) - 0.5) * bleed * 2;
      var col = (i % 2 === 0)
        ? (hash2(i, 79) > 0.5 ? '#e8e6dc' : '#2f6b3a')
        : (hash2(i, 80) > 0.5 ? '#2f6b3a' : '#e0962a');
      disc(dx, dy, 1.2, col, 0.5);
    }
  }

  // Pointer: vertical drag re-weights the strata.
  var dragging = false, lastY = 0;
  function onDown(e) {
    dragging = true;
    lastY = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0].clientY);
  }
  function onMove(e) {
    if (!dragging) return;
    var y = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0].clientY);
    if (y === undefined) return;
    drags.push({ t0: clockT, dy: y - lastY });
    lastY = y;
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // Determinism: frame one is draw(0) via boot flag; the clock starts
  // only with the rAF loop.
  var clockT = 0;
  var booted = false;
  draw(0);
  booted = true;
  var startMs = 0;
  function loop(ms) {
    if (!booted) return;
    if (startMs === 0) startMs = ms;
    clockT = (ms - startMs) / 1000;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
