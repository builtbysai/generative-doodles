<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1903 Slow Sound Exploration</title>
<style>
  html, body { margin: 0; padding: 0; background: #fdfdfb; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var ROOM = '#fdfdfb';       // bright white room
  var FOG = '#dfe3e6';        // translucent pale grey fog
  var FOG_DEEP = '#c9ced2';
  var ORANGE = '#e8825a';     // soft orange gesture
  var ORANGE_SOFT = '#f2a988';
  var TEAL = '#5f8f8a';       // muted teal gesture
  var TEAL_SOFT = '#8fb3ae';
  var CHARCOAL = '#3a3d40';   // faint charcoal clock face and plate
  var CHARCOAL_DIM = '#7a7f84';
  var FIGURE = '#a8adb2';     // soft grey figures
  var FIGURE_DARK = '#6e7378';

  // Fixed-phase first frame: t = 30 s, an orange gesture halfway across
  // from the left figure, a fading teal trail behind it, clock showing 30 s.
  // The whole state is a pure function of t, so frame one is byte-reproducible.
  var FIRST_T = 30;
  var TRANSIT = 60;           // one full minute per crossing
  var CYCLE = 120;            // orange left to right, then teal right to left

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(u) { return u * u * (3 - 2 * u); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha

  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      // Wide field composition: a wide centered stage, page ground is the
      // piece's own bright white.
      stageH = vh * 0.88;
      stageW = Math.min(vw * 0.94, stageH * 1.78);
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  // Gesture state as a pure function of t. Gesture k starts at k * 60 s.
  // Even k: orange, left to right. Odd k: teal, right to left.
  function gestureAt(t, k) {
    var start = k * TRANSIT;
    var u = clamp((t - start) / TRANSIT, 0, 1);
    var fromLeft = (k % 2 === 0);
    return { u: u, fromLeft: fromLeft, color: fromLeft ? ORANGE : TEAL,
             soft: fromLeft ? ORANGE_SOFT : TEAL_SOFT, done: u >= 1 };
  }

  function drawFigure(x, baseY, s, facing, accent, t, phase) {
    // A simple facing figure: head, torso, one arm reaching toward the
    // crossing space. Breathing is slow, about 0.05 Hz.
    var breathe = 1 + 0.012 * Math.sin(t * 0.3 + phase);
    var headR = 13 * s * breathe;
    var headY = baseY - 118 * s;
    var shoulderY = baseY - 96 * s;
    var hipY = baseY - 18 * s;

    // Body: a soft tapered column.
    ctx.fillStyle = FIGURE;
    ctx.beginPath();
    ctx.moveTo(x - 20 * s, shoulderY);
    ctx.quadraticCurveTo(x - 26 * s, (shoulderY + hipY) / 2, x - 22 * s, hipY);
    ctx.lineTo(x + 22 * s, hipY);
    ctx.quadraticCurveTo(x + 26 * s, (shoulderY + hipY) / 2, x + 20 * s, shoulderY);
    ctx.quadraticCurveTo(x, shoulderY - 12 * s, x - 20 * s, shoulderY);
    ctx.closePath();
    ctx.fill();

    // Head.
    ctx.fillStyle = FIGURE_DARK;
    ctx.beginPath();
    ctx.moveTo(x + headR, headY);
    ctx.arc(x, headY, headR, 0, Math.PI * 2);
    ctx.fill();

    // Reaching arm toward the center, the hand where gestures leave and arrive.
    var handX = x + facing * 44 * s;
    var handY = shoulderY + 26 * s;
    ctx.strokeStyle = FIGURE_DARK;
    ctx.lineWidth = 5 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + facing * 14 * s, shoulderY + 10 * s);
    ctx.quadraticCurveTo(x + facing * 34 * s, shoulderY + 14 * s, handX, handY);
    ctx.stroke();

    // A small accent at the chest: the figure's own color, held quietly.
    ctx.fillStyle = hexA(accent, 0.55);
    ctx.beginPath();
    ctx.moveTo(x + 5 * s, shoulderY + 22 * s);
    ctx.arc(x, shoulderY + 26 * s, 5 * s, 0, Math.PI * 2);
    ctx.fill();

    return { handX: handX, handY: handY };
  }

  function drawClock(cx, cy, r, t) {
    // The wall clock. Second hand advances once per second, quantized.
    // Minute hand advances once per minute. No smooth sweep anywhere.
    var sec = Math.floor(t) % 60;
    var min = Math.floor(t / 60) % 60;

    ctx.fillStyle = ROOM;
    ctx.beginPath();
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = hexA(CHARCOAL, 0.55);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    // Tick marks.
    var i, a, x1, y1, x2, y2;
    for (i = 0; i < 60; i++) {
      a = i * Math.PI / 30 - Math.PI / 2;
      var long = (i % 5 === 0);
      x1 = cx + Math.cos(a) * r * (long ? 0.82 : 0.9);
      y1 = cy + Math.sin(a) * r * (long ? 0.82 : 0.9);
      x2 = cx + Math.cos(a) * r * 0.96;
      y2 = cy + Math.sin(a) * r * 0.96;
      ctx.strokeStyle = hexA(CHARCOAL, long ? 0.6 : 0.3);
      ctx.lineWidth = long ? 1.6 : 1;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // Minute hand.
    var ma = min * Math.PI / 30 - Math.PI / 2;
    ctx.strokeStyle = hexA(CHARCOAL, 0.7);
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ma) * r * 0.62, cy + Math.sin(ma) * r * 0.62);
    ctx.stroke();

    // Second hand, quantized to whole seconds.
    var sa = sec * Math.PI / 30 - Math.PI / 2;
    ctx.strokeStyle = hexA(ORANGE, 0.85);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx - Math.cos(sa) * r * 0.14, cy - Math.sin(sa) * r * 0.14);
    ctx.lineTo(cx + Math.cos(sa) * r * 0.8, cy + Math.sin(sa) * r * 0.8);
    ctx.stroke();

    // Hub.
    ctx.fillStyle = CHARCOAL;
    ctx.beginPath();
    ctx.moveTo(cx + 3, cy);
    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFog(t) {
    // Layered translucent fog: slow deterministic blobs drifting at
    // about 0.01 Hz, well under the flicker ceiling.
    var i, bx, by, br, drift;
    for (i = 0; i < 42; i++) {
      bx = hash(i * 3 + 1) * W;
      by = hash(i * 7 + 2) * H;
      drift = Math.sin(t * 0.012 + i * 1.7) * 14;
      bx += drift;
      by += Math.cos(t * 0.009 + i * 2.3) * 10;
      br = (60 + hash(i * 11 + 3) * 130) * clamp(Math.min(W, H) / 600, 0.7, 1.2);
      var g = ctx.createRadialGradient(bx, by, 2, bx, by, br);
      g.addColorStop(0, hexA(FOG, a4(0.10 + 0.06 * hash(i * 5 + 4))));
      g.addColorStop(1, hexA(FOG, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(bx + br, by);
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }
    // A pale wash across the floor of the room.
    var floor = ctx.createLinearGradient(0, H * 0.72, 0, H);
    floor.addColorStop(0, hexA(FOG_DEEP, 0));
    floor.addColorStop(1, hexA(FOG_DEEP, 0.16));
    ctx.fillStyle = floor;
    ctx.fillRect(0, H * 0.72, W, H * 0.28);
  }

  function drawTrail(fromX, toX, crossY, color, soft, u, alphaScale) {
    // The fog's record of a gesture: a ribbon of fading dots from the
    // sender's hand to the gesture's current head, denser near the head.
    if (u <= 0) { return; }
    var steps = 26;
    var i, s, px, py, rr, al;
    for (i = 0; i <= steps; i++) {
      s = (i / steps) * u;
      var e = smooth(s);
      px = lerp(fromX, toX, e);
      py = crossY - Math.sin(e * Math.PI) * H * 0.06;
      rr = 2 + 7 * (s / u) * (1 - 0.35 * (s / u));
      al = a4(0.05 + 0.22 * (s / u) * alphaScale);
      ctx.fillStyle = hexA(i % 2 === 0 ? color : soft, al);
      ctx.beginPath();
      ctx.moveTo(px + rr, py);
      ctx.arc(px, py, rr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Bright white room.
    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, W, H);

    var s = clamp(Math.min(W, H) / 560, 0.6, 1.25);
    var baseY = H * 0.78;
    var leftX = W / 3;
    var rightX = W * 2 / 3;
    var crossY = H * 0.52;

    // Wall clock, centered above the crossing space.
    var clockR = clamp(Math.min(W, H) * 0.085, 26, 62);
    drawClock(W / 2, H * 0.17, clockR, t);

    // The two figures, facing each other across the room.
    var left = drawFigure(leftX, baseY, s, 1, ORANGE, t, 0);
    var right = drawFigure(rightX, baseY, s, -1, TEAL, t, 2.1);

    // Fading records of the gestures that already crossed. Each completed
    // gesture leaves a trail that fades over a long envelope, 180 s.
    var k = Math.floor(t / TRANSIT);
    var j, g, age, fade;
    for (j = k - 3; j < k; j++) {
      if (j < 0) { continue; }
      g = gestureAt(t, j);
      age = t - (j + 1) * TRANSIT;
      fade = clamp(1 - age / 180, 0, 1);
      if (fade <= 0) { continue; }
      var fx = g.fromLeft ? left.handX : right.handX;
      var tx = g.fromLeft ? right.handX : left.handX;
      drawTrail(fx, tx, crossY, g.color, g.soft, 1, fade * 0.5);
    }

    // The gesture now crossing, with its fresh trail behind it.
    var cur = gestureAt(t, k);
    var cFrom = cur.fromLeft ? left.handX : right.handX;
    var cTo = cur.fromLeft ? right.handX : left.handX;
    drawTrail(cFrom, cTo, crossY, cur.color, cur.soft, cur.u, 1);

    // The gesture head itself: a soft glowing shape, mid-crossing.
    var eu = smooth(cur.u);
    var hx = lerp(cFrom, cTo, eu);
    var hy = crossY - Math.sin(eu * Math.PI) * H * 0.06;
    var hr = 15 * s;
    var halo = ctx.createRadialGradient(hx, hy, 2, hx, hy, hr * 3.2);
    halo.addColorStop(0, hexA(cur.color, 0.30));
    halo.addColorStop(0.6, hexA(cur.color, 0.08));
    halo.addColorStop(1, hexA(cur.color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.moveTo(hx + hr * 3.2, hy);
    ctx.arc(hx, hy, hr * 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = hexA(cur.color, 0.9);
    ctx.beginPath();
    ctx.moveTo(hx + hr, hy);
    ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = hexA(cur.soft, 0.85);
    ctx.beginPath();
    ctx.moveTo(hx + hr * 0.55, hy - hr * 0.15);
    ctx.arc(hx, hy - hr * 0.15, hr * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // Fog drifts over everything, softening the room.
    drawFog(t);

    // Title plate, drawn on the canvas, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 640, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = CHARCOAL;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Slow Sound Exploration', 18, 34);
    ctx.fillStyle = CHARCOAL_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1903 · 2007 · 03 · 29', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(CHARCOAL_DIM, 0.9);
    ctx.fillText('Watch the fog keep the time.', 18, H - 20);
  }

  // Watch only: no pointer, touch, or key handlers. Nothing speeds,
  // scrubs, or triggers a gesture.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
