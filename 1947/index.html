<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1947 The Cathedral Keeps Time</title>
<style>
  html, body { margin: 0; padding: 0; background: #8f8a7c; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // The Cathedral Keeps Time, LR4 / PP1194, study #254 lucy-railton.
  // One cello phrase played in four rooms. The phrase never changes;
  // the room is the oscillator. Each room answers with a reverb tail,
  // drawn as fading gold ribbons that hang in the air and drift up.
  // The cathedral tail is long and harmonic; the parking structure
  // tail is short and brutal. The rooms take turns on a slow clock.
  // Visual only: the sound is a closed-form model, no WebAudio.

  // ---- The phrase. Fixed, identical in every room. Eight notes,
  // one cello line, 12 seconds, then it repeats, unchanged.
  var PHRASE_DUR = 12;
  var NOTES = [
    { dt: 0.0, hz: 220.0, name: 'A3' },
    { dt: 1.8, hz: 196.0, name: 'G3' },
    { dt: 3.1, hz: 261.6, name: 'C4' },
    { dt: 5.0, hz: 233.1, name: 'Bb3' },
    { dt: 6.4, hz: 293.7, name: 'D4' },
    { dt: 8.2, hz: 220.0, name: 'A3' },
    { dt: 9.6, hz: 174.6, name: 'F3' },
    { dt: 11.0, hz: 196.0, name: 'G3' }
  ];
  var PHRASE_LABEL = 'A3 G3 C4 Bb3 D4 A3 F3 G3';

  // ---- The four rooms. tail is the reverb tail in seconds, harmonics
  // the number of ribbon strands per note, decay the envelope time.
  var ROOMS = [
    {
      name: 'The Stone Cathedral', roman: 'I', bg: '#8f8a7c', arch: '#6f6a5c',
      archSoft: '#7d7868', ink: '#2b2721', inkSoft: '#4a443a',
      tail: 5.2, harmonics: 7, decay: 1.6, ribbonW: 1.0, sway: 6, drift: 26,
      gold: '#e8b64c', note: 'long and harmonic, the stone sings back'
    },
    {
      name: 'A Paris Church', roman: 'II', bg: '#2e2113', arch: '#241a0e',
      archSoft: '#3d2c17', ink: '#f2e3c2', inkSoft: '#c9b183',
      tail: 3.4, harmonics: 5, decay: 1.1, ribbonW: 1.15, sway: 7, drift: 24,
      gold: '#f0c25e', note: 'warm and close, candle amber'
    },
    {
      name: 'The Triangular Church', roman: 'III', bg: '#3b4066', arch: '#2c3050',
      archSoft: '#4a5080', ink: '#e6e4f2', inkSoft: '#b3b0d4',
      tail: 2.6, harmonics: 4, decay: 0.85, ribbonW: 1.3, sway: 8, drift: 22,
      gold: '#eec25a', note: 'concrete angles in blue-violet haze'
    },
    {
      name: 'The Parking Structure', roman: 'IV', bg: '#45413c', arch: '#33302b',
      archSoft: '#57524a', ink: '#e8e2d4', inkSoft: '#b5ad9c',
      tail: 1.15, harmonics: 2, decay: 0.4, ribbonW: 2.2, sway: 11, drift: 18,
      gold: '#d9a83c', note: 'short and brutal, the tail dies on concrete'
    }
  ];
  var ROOM_DUR = 150, FADE = 6;
  var CYCLE = ROOM_DUR * 4; // 600 s, room to room every few minutes

  // Fixed-phase first frame: FIRST_T = 22 s. Mid first room (the
  // cathedral, 0 to 150 s), phrase cycle position 10 s, four notes
  // of the phrase already ringing with visible tails.
  var FIRST_T = 22;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash01(n) {
    var h = Math.imul(n | 0, 2654435761) ^ 1947;
    h = Math.imul(h ^ (h >>> 13), 0x5bd1e995);
    h ^= h >>> 15;
    return ((h >>> 0) % 10000) / 10000;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // Timeline: which room, and how far into the crossfade.
  function roomAt(t) {
    var tt = ((t % CYCLE) + CYCLE) % CYCLE;
    var i = Math.floor(tt / ROOM_DUR);
    var local = tt - i * ROOM_DUR;
    var fade = local < FADE ? local / FADE : 1;
    return { room: i, local: local, fade: fade, prev: (i + 3) % 4, tInCycle: tt };
  }

  // Ribbon geometry, shared by draw() and the probe metrics.
  function ribbonLenPx(room, h) { return room.tail * 0.072 * h; }
  function noteX(hz) {
    // Pitch to horizontal position, low left to high right.
    var lo = 174.6, hi = 293.7;
    var f = (hz - lo) / (hi - lo);
    return W * (0.16 + 0.68 * clamp(f, 0, 1));
  }
  // A note's home height depends on its pitch, so the two A3s and
  // the two G3s in the phrase share one home each, not two.
  function noteBaseY(hz) {
    var j = hash01(Math.round(hz * 10) + 3);
    return H * (0.78 + 0.06 * j);
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Room architecture, drawn faint behind the ribbons.
  function drawRoomBg(room, alpha) {
    var i, x, y;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (room === 0) {
      // Cathedral: two pointed arches and a rose window, stone grey.
      ctx.strokeStyle = ROOMS[0].arch; ctx.lineWidth = 3;
      var archW = W * 0.20, archH = H * 0.62, baseY = H * 0.86;
      for (i = 0; i < 2; i++) {
        x = W * (0.12 + i * 0.56);
        ctx.beginPath();
        ctx.moveTo(x, baseY);
        ctx.lineTo(x, baseY - archH * 0.55);
        ctx.quadraticCurveTo(x, baseY - archH, x + archW / 2, baseY - archH * 1.02);
        ctx.quadraticCurveTo(x + archW, baseY - archH, x + archW, baseY - archH * 0.55);
        ctx.lineTo(x + archW, baseY);
        ctx.stroke();
      }
      // Rose window, faint.
      var rcx = W * 0.5, rcy = H * 0.20, rr = W * 0.075;
      ctx.strokeStyle = hexA(ROOMS[0].arch, 0.8); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(rcx + rr, rcy); ctx.arc(rcx, rcy, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1;
      for (i = 0; i < 8; i++) {
        var a = i * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(rcx, rcy);
        ctx.lineTo(rcx + Math.cos(a) * rr, rcy + Math.sin(a) * rr);
        ctx.stroke();
      }
      // Floor line.
      ctx.strokeStyle = hexA(ROOMS[0].archSoft, 0.9); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(W * 0.06, baseY); ctx.lineTo(W * 0.94, baseY); ctx.stroke();
    } else if (room === 1) {
      // Paris church: candle glows along the base, warm dark.
      var rng = mulberry32(1947 * 3 + 11);
      for (i = 0; i < 26; i++) {
        x = W * (0.06 + rng() * 0.88);
        y = H * (0.82 + rng() * 0.10);
        var r = 1.5 + rng() * 3.5;
        var g = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
        g.addColorStop(0, hexA('#f0c25e', 0.5));
        g.addColorStop(1, hexA('#f0c25e', 0));
        ctx.fillStyle = g;
        ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
        ctx.fillStyle = hexA('#f7d98a', 0.9);
        ctx.beginPath(); ctx.moveTo(x + 1.6, y); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
      }
      // One tall arch, barely visible in the dark, its edge candle-lit.
      ctx.strokeStyle = hexA('#c9a45a', 0.5); ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(W * 0.30, H * 0.86);
      ctx.lineTo(W * 0.30, H * 0.34);
      ctx.quadraticCurveTo(W * 0.30, H * 0.16, W * 0.5, H * 0.14);
      ctx.quadraticCurveTo(W * 0.70, H * 0.16, W * 0.70, H * 0.34);
      ctx.lineTo(W * 0.70, H * 0.86);
      ctx.stroke();
    } else if (room === 2) {
      // Triangular modernist church: one great concrete triangle,
      // blue-violet haze bands.
      for (i = 0; i < 4; i++) {
        ctx.fillStyle = hexA(ROOMS[2].archSoft, a4(0.10 + i * 0.05));
        ctx.fillRect(0, H * (0.12 + i * 0.18), W, H * 0.10);
      }
      ctx.strokeStyle = ROOMS[2].arch; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(W * 0.14, H * 0.86);
      ctx.lineTo(W * 0.5, H * 0.12);
      ctx.lineTo(W * 0.86, H * 0.86);
      ctx.closePath();
      ctx.stroke();
      // Inner triangle, the light slot.
      ctx.strokeStyle = hexA(ROOMS[2].ink, 0.55); ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(W * 0.34, H * 0.86);
      ctx.lineTo(W * 0.5, H * 0.34);
      ctx.lineTo(W * 0.66, H * 0.86);
      ctx.closePath();
      ctx.stroke();
      // Slit of light at the apex.
      ctx.fillStyle = hexA('#e8e4ff', 0.85);
      ctx.fillRect(W * 0.5 - 2, H * 0.12, 4, H * 0.10);
    } else {
      // Parking structure: raw concrete slabs, horizontal, brutal.
      ctx.strokeStyle = hexA(ROOMS[3].arch, 0.95); ctx.lineWidth = 5;
      var slabY;
      for (i = 0; i < 4; i++) {
        slabY = H * (0.22 + i * 0.17);
        ctx.beginPath(); ctx.moveTo(0, slabY); ctx.lineTo(W, slabY); ctx.stroke();
      }
      ctx.lineWidth = 8;
      for (i = 0; i < 3; i++) {
        x = W * (0.22 + i * 0.28);
        ctx.beginPath(); ctx.moveTo(x, H * 0.16); ctx.lineTo(x, H * 0.88); ctx.stroke();
      }
      // Low sodium light, one harsh bar.
      ctx.fillStyle = hexA('#e8c25a', 0.28);
      ctx.fillRect(W * 0.60, H * 0.30, W * 0.24, 6);
      ctx.fillStyle = hexA('#e8c25a', 0.8);
      ctx.fillRect(W * 0.60, H * 0.30, W * 0.24, 2);
    }
    ctx.restore();
  }

  // ---- One ribbon: the reverb tail of one note, in one room.
  function drawRibbon(room, noteIdx, onsetAge, nx, yBase) {
    var env = Math.exp(-onsetAge / room.decay);
    if (env < 0.015) { return; }
    var scale = H / 828;
    var len = ribbonLenPx(room, H);
    var growth = clamp(onsetAge / (room.tail * 0.5), 0, 1);
    var rise = room.drift * scale * onsetAge;
    var top = yBase - len * growth - rise;
    var bottom = yBase - rise;
    if (bottom < -20) { return; }
    var h, s, px, py, swayX;
    for (h = 0; h < room.harmonics; h++) {
      var off = (h - (room.harmonics - 1) / 2) * 8 * scale;
      var strandAlpha = env * (1 - (h / room.harmonics) * 0.7) * 0.85;
      var strandW = Math.max(1, room.ribbonW * scale * (1.9 - h * 0.18));
      ctx.strokeStyle = hexA(room.gold, a4(strandAlpha));
      ctx.lineWidth = strandW;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (s = 0; s <= 16; s++) {
        var f = s / 16;
        py = top + f * (bottom - top);
        // Parking structure ribbons are jagged, the others sway smooth.
        if (room === ROOMS[3]) {
          swayX = Math.sin(onsetAge * 2.2 + noteIdx * 1.7 + f * 9 + h * 0.8) * room.sway * scale * f;
        } else {
          swayX = Math.sin(onsetAge * 0.6 + noteIdx * 1.7 + f * 2.2 + h * 0.8) * room.sway * scale * f;
        }
        px = nx + off + swayX;
        if (s === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
      }
      ctx.stroke();
    }
    // A small bright head where the note still sounds.
    ctx.fillStyle = hexA(room.gold, a4(env * 0.6));
    ctx.beginPath(); ctx.moveTo(nx + 3 * scale, top); ctx.arc(nx, top, 3 * scale, 0, Math.PI * 2); ctx.fill();
  }

  // ---- The phrase's note dots on the baseline.
  function drawNoteDots(t, room, roomStart) {
    var i;
    for (i = 0; i < NOTES.length; i++) {
      var nx = noteX(NOTES[i].hz);
      var yBase = noteBaseY(NOTES[i].hz);
      // Age since this note last sounded on the global phrase clock.
      var phraseStart = Math.floor(t / PHRASE_DUR) * PHRASE_DUR;
      var age = t - (phraseStart + NOTES[i].dt);
      if (age < 0) { age += PHRASE_DUR; }
      var glow = age < 1.2 ? 0.9 : 0.35;
      ctx.fillStyle = hexA(room.gold, a4(glow));
      ctx.beginPath(); ctx.moveTo(nx + 3, yBase); ctx.arc(nx, yBase, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = hexA(room.ink, 0.75);
      ctx.font = 'italic 11px Georgia, "Times New Roman", serif';
      ctx.textAlign = 'center';
      ctx.fillText(NOTES[i].name, nx, yBase + 18);
      ctx.textAlign = 'left';
    }
  }

  function draw(t) {
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Reset persistent context state drawRibbon changes, so every
    // frame, including the first, draws identically.
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'miter';
    ctx.globalAlpha = 1;
    lastT = t;

    var st = roomAt(t);
    var room = ROOMS[st.room];
    var roomStart = t - st.local;

    // Ground: previous room during the crossfade, then the current one.
    ctx.fillStyle = ROOMS[st.prev].bg;
    ctx.fillRect(0, 0, W, H);
    if (st.fade < 1) {
      drawRoomBg(st.prev, 1 - st.fade);
      ctx.fillStyle = hexA(room.bg, a4(st.fade));
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.fillStyle = room.bg;
      ctx.fillRect(0, 0, W, H);
    }
    drawRoomBg(st.room, st.fade);

    // ---- Plates: title top-left, room name top-right on desktop,
    // stacked under the title on phones, where the row would collide.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    var fsRoom = Math.round(14 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = room.ink;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Cathedral Keeps Time', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(room.ink, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1947 · 2007 · 05 · 12', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    var roomY = 18 + fsTitle * 0.8 + 2;
    if (isPhone) {
      // Room label on its own line, left aligned, under the date.
      roomY = 18 + fsTitle * 0.8 + fsSub + 8 + fsRoom + 10;
      ctx.fillStyle = room.ink;
      ctx.font = 'italic 600 ' + fsRoom + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(room.roman + ' · ' + room.name, 18, roomY);
      ctx.fillStyle = hexA(room.ink, 0.8);
      ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(room.note, 18, roomY + fsSmall + 8);
      var d;
      for (d = 0; d < 4; d++) {
        var dotX = 18 + d * 16;
        ctx.fillStyle = d === st.room ? room.ink : hexA(room.ink, 0.35);
        ctx.beginPath(); ctx.moveTo(dotX + 4, roomY + fsSmall + 22); ctx.arc(dotX, roomY + fsSmall + 22, 4, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      ctx.textAlign = 'right';
      ctx.fillStyle = room.ink;
      ctx.font = 'italic 600 ' + fsRoom + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(room.roman + ' · ' + room.name, W - 18, roomY);
      ctx.fillStyle = hexA(room.ink, 0.8);
      ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(room.note, W - 18, roomY + fsSmall + 10);
      var d2;
      for (d2 = 0; d2 < 4; d2++) {
        var dotX2 = W - 18 - d2 * 16;
        ctx.fillStyle = d2 === st.room ? room.ink : hexA(room.ink, 0.35);
        ctx.beginPath(); ctx.moveTo(dotX2 + 4, roomY + fsSmall + 24); ctx.arc(dotX2, roomY + fsSmall + 24, 4, 0, Math.PI * 2); ctx.fill();
      }
      ctx.textAlign = 'left';
    }

    // ---- Ribbons: every note onset still ringing in this room.
    // The phrase is a global metronome (onsets at k * 12 s); a room
    // only keeps the tails of notes that sounded inside it.
    var maxAge = room.tail * 1.3 + 1;
    var k = Math.max(0, Math.floor(roomStart / PHRASE_DUR));
    var ni;
    for (; ; k++) {
      var phraseStart = k * PHRASE_DUR;
      if (phraseStart > t) { break; }
      for (ni = 0; ni < NOTES.length; ni++) {
        var onset = phraseStart + NOTES[ni].dt;
        if (onset < roomStart) { continue; }
        var age = t - onset;
        if (age < 0 || age > maxAge) { continue; }
        drawRibbon(room, ni, age, noteX(NOTES[ni].hz), noteBaseY(NOTES[ni].hz));
      }
      if (k > 200) { break; }
    }

    // Baseline and note dots.
    ctx.strokeStyle = hexA(room.ink, 0.28);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W * 0.08, H * 0.90); ctx.lineTo(W * 0.92, H * 0.90); ctx.stroke();
    drawNoteDots(t, room, roomStart);

    // ---- Hint, centered at the bottom.
    ctx.fillStyle = hexA(room.ink, 0.85);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fsSmall * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the rooms answer one phrase.', W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // Probe metrics for QA: same numbers draw() uses.
  function metrics(t) {
    var st = roomAt(t);
    var room = ROOMS[st.room];
    return {
      t: t,
      room: st.room,
      roomName: room.name,
      tail: room.tail,
      harmonics: room.harmonics,
      decay: room.decay,
      ribbonLenPx: Math.round(ribbonLenPx(room, H) * 100) / 100,
      phrase: PHRASE_LABEL,
      fade: Math.round(st.fade * 100) / 100
    };
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1947 = { roomAt: roomAt, metrics: metrics, firstT: FIRST_T, redraw: function (t) { draw(t); } };
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: slow room cycle, ribbons drift and fade. All motion
  // is slow, well under the 14 Hz ceiling. Guarded so node-canvas QA
  // (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
