<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Turning Away</title>
<style>
html, body { margin: 0; padding: 0; background: #121014; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FIELD = [18, 16, 20];
var COLD = [90, 90, 98];
var OCHRE = [201, 143, 61];
var BRICK = [163, 74, 46];
var BONE = [224, 214, 192];
var GOLD = [201, 168, 106];
var MRED = [163, 74, 46];
var LOOP = 240;
var CYCLE = 60;
var NBARS = 7;
var NDOTS = 9;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1551000);
// One seeded convert per cycle, drawn from the remaining bars so the four
// converts are always distinct: cycle k ends with k+1 bars latched. Exactly
// one stream draw per cycle, so every later seeded value is unchanged.
var converts = [];
var remainingBars = [];
for (var ri = 0; ri < NBARS; ri++) remainingBars.push(ri);
for (var ci = 0; ci < 4; ci++) {
  var pick = Math.floor(rng() * remainingBars.length);
  converts.push(remainingBars[pick]);
  remainingBars.splice(pick, 1);
}
var dotPeriod = [30, 40, 48, 60, 80, 120, 240, 60, 40];
var dotRadial = [60, 80, 120, 240, 60, 80, 120, 240, 60];
var dotBase = [], dotSize = [], dotCol = [], dotPh = [], dotPh2 = [];
for (var di = 0; di < NDOTS; di++) {
  dotBase.push(di * TAU / NDOTS + 0.3);
  dotSize.push(0.010 + rng() * 0.012);
  dotCol.push([BONE, GOLD, MRED][di % 3]);
  dotPh.push(rng() * TAU);
  dotPh2.push(rng() * TAU);
}
var barWarm = [];
for (var bi = 0; bi < NBARS; bi++) barWarm.push(bi % 2 === 0 ? OCHRE : BRICK);
var barDanceP = [30, 40, 60, 80, 120, 240, 60];
var barDancePh = [];
for (var bj = 0; bj < NBARS; bj++) barDancePh.push(rng() * TAU);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var holds = [];
var earlyConverts = [];
var drag = null;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mix(a, b, t) {
  return [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t)];
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (Math.round(a * 10000) / 10000) + ')'; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function bandClock(t) {
  var off = 0;
  for (var i = 0; i < holds.length; i++) {
    var h = holds[i];
    if (h.start > t) continue;
    var e = (h.end === null) ? t : Math.min(h.end, t);
    off += Math.max(0, e - h.start);
  }
  return t - off;
}
function stateAt(t) {
  var bt = bandClock(t);
  var cycle = Math.floor(bt / CYCLE) % 4;
  if (cycle < 0) cycle += 4;
  var cycleT = bt - Math.floor(bt / CYCLE) * CYCLE;
  var bw = 0.18 * VW;
  var bandCenter = -bw + (VW + 2 * bw) * (cycleT / CYCLE);
  var baseline = 0.84 * VH;
  var BH = 0.62 * VH;
  var barW = Math.max(6, 0.022 * VW);
  var tick = 1 + 0.05 * Math.sin(TAU * t / 8);
  var minDim = Math.min(VW, VH);
  var ccx = 0.78 * VW, ccy = 0.50 * VH, CR = 0.15 * minDim;
  var bars = [];
  for (var i = 0; i < NBARS; i++) {
    var bx = 0.04 * VW + i * (0.26 * VW / (NBARS - 1));
    var halfW = bw / 2 + barW;
    var d = Math.abs(bx - bandCenter);
    var o = clamp(1 - d / halfW, 0, 1);
    o = o * o * (3 - 2 * o);
    // Converts accumulate within the super-loop: a bar latched in an earlier
    // cycle stays latched (the band swept past it in its own cycle), and the
    // current cycle's convert latches once the band passes it. At the
    // super-loop boundary cycle wraps to 0 and the set resets, so t=240 = t=0.
    var latched = 0;
    for (var c = 0; c <= cycle; c++) {
      if (converts[c] === i && (c < cycle || bandCenter > bx)) { latched = 1; break; }
    }
    // Drag converts persist for the remainder of their super-loop pass.
    var pass = Math.floor(bt / LOOP);
    var early = 0;
    for (var e = 0; e < earlyConverts.length; e++) {
      if (earlyConverts[e].pass === pass && earlyConverts[e].cycle <= cycle && earlyConverts[e].bar === i) early = 1;
    }
    var s = Math.max(o, latched, early);
    var h = BH * tick * (1 - 0.45 * s);
    var tilt = 0.30 * s;
    var sa = (i / NBARS) * TAU - 0.6;
    var slotX = ccx + 0.9 * CR * Math.cos(sa);
    var slotY = ccy + 0.9 * CR * Math.sin(sa);
    var bobX = 0.02 * minDim * Math.sin(TAU * t / barDanceP[i] + barDancePh[i]) * s;
    var bobY = 0.02 * minDim * Math.cos(TAU * t / barDanceP[i] + barDancePh[i]) * s;
    var x = bx + (slotX - bx) * 0.55 * s + bobX;
    var baseY = baseline + (slotY - baseline) * 0.55 * s + bobY;
    bars.push({ homeX: bx, x: x, baseY: baseY, h: h, tilt: tilt, soft: s, color: mix(COLD, barWarm[i], s) });
  }
  var dots = [];
  for (var j = 0; j < NDOTS; j++) {
    var ang = dotBase[j] + TAU * t / dotPeriod[j];
    var rad = CR * (0.8 + 0.2 * Math.sin(TAU * t / dotRadial[j] + dotPh2[j]));
    dots.push([ccx + rad * Math.cos(ang), ccy + rad * Math.sin(ang)]);
  }
  return { cycle: cycle, cycleT: cycleT, bandCenter: bandCenter, bandW: bw, bars: bars, dots: dots, converts: converts.slice() };
}
function publishHook(st) {
  if (typeof window !== 'undefined') {
    window.__p1551 = {
      loop: LOOP, cycle: st.cycle, cycleT: st.cycleT,
      bandCenter: st.bandCenter, bandW: st.bandW,
      bars: st.bars, dots: st.dots, converts: st.converts,
      dragKind: drag ? drag.kind : null
    };
  }
}
function draw(t) {
  lastT = t;
  size();
  var st = stateAt(t);
  ctx.fillStyle = rgb(FIELD);
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = rgba(GOLD, 0.18);
  ctx.fillRect(st.bandCenter - st.bandW / 2, 0, st.bandW, VH);
  for (var i = 0; i < NBARS; i++) {
    var b = st.bars[i];
    var barW = Math.max(6, 0.022 * VW);
    ctx.save();
    ctx.translate(b.x, b.baseY);
    ctx.rotate(b.tilt);
    ctx.fillStyle = rgb(b.color);
    ctx.fillRect(-barW / 2, -b.h, barW, b.h);
    ctx.restore();
  }
  var minDim = Math.min(VW, VH);
  for (var j = 0; j < NDOTS; j++) {
    var r = dotSize[j] * minDim;
    ctx.fillStyle = rgb(dotCol[j]);
    ctx.beginPath();
    ctx.moveTo(st.dots[j][0] + r, st.dots[j][1]);
    ctx.arc(st.dots[j][0], st.dots[j][1], r, 0, TAU);
    ctx.fill();
  }
  publishHook(st);
}
function barHit(x, y) {
  var baseline = 0.84 * VH;
  var BH = 0.62 * VH;
  var barW = Math.max(6, 0.022 * VW);
  for (var i = 0; i < NBARS; i++) {
    var bx = 0.04 * VW + i * (0.26 * VW / (NBARS - 1));
    if (Math.abs(x - bx) <= barW * 1.5 && y >= baseline - BH * 1.15 && y <= baseline + 10) return i;
  }
  return -1;
}
function onDown(e) {
  var x = e.clientX, y = e.clientY;
  var bi = barHit(x, y);
  if (bi >= 0) {
    drag = { kind: 'bar', bar: bi, startX: x, converted: false };
  } else {
    var st = stateAt(lastT);
    if (Math.abs(x - st.bandCenter) <= st.bandW / 2 + 8) {
      drag = { kind: 'band' };
      holds.push({ start: lastT, end: null });
    } else {
      drag = null;
    }
  }
  publishHook(stateAt(lastT));
}
function onMove(e) {
  if (!drag) return;
  if (drag.kind === 'bar' && !drag.converted) {
    if (e.clientX - drag.startX > 0.06 * VW) {
      var bt = bandClock(lastT);
      var cycle = Math.floor(bt / CYCLE) % 4;
      if (cycle < 0) cycle += 4;
      earlyConverts.push({ cycle: cycle, bar: drag.bar, pass: Math.floor(bt / LOOP) });
      drag.converted = true;
    }
  }
  publishHook(stateAt(lastT));
}
function onUp(e) {
  if (drag && drag.kind === 'band') {
    for (var i = holds.length - 1; i >= 0; i--) {
      if (holds[i].end === null) { holds[i].end = lastT; break; }
    }
  }
  drag = null;
  publishHook(stateAt(lastT));
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
