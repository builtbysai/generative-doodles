<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painting, Pixel 48000</title>
<style>
html, body { margin: 0; padding: 0; background: #f6f3ea; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#f6f3ea';
var GREY = [138, 138, 134];
var MAROON = [122, 46, 46];
var OCHRE = [201, 154, 60];
var PLATE = '#211f1b';
var PLATE_LINE = 'rgba(201,154,60,0.55)';
var TITLE_INK = '#f2efe6';
var HINT_INK = '#d9b45b';
var FIRST_T = 30.0;
var BUILD = 75.0;
var HOLD = 8.0;
var FADE = 10.0;
var CYCLE = BUILD + HOLD + FADE;
var SEGS = 9;
/* Jos Vromans, 2023 Math Painting method as performance. A white canvas
   is addressed pixel by pixel and where the pixels land, strokes grow:
   a vertical herringbone of ragged brushstrokes in muted grey, maroon
   and ochre. Two mirrored directional fields (left half leans left,
   right half leans right) make the chevron. Strokes are placed in
   row-major order from the top down, so the painting builds itself and
   frame one is a fixed developed state: the top 40 percent already
   painted. When the canvas fills it holds, fades to white, and a new
   herringbone with different parameters begins. Stroke geometry is
   precomputed per cycle from a seeded RNG, so every frame is a pure
   function of piece time. No gradients, no texture images, no
   interaction: watch only. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Paper speckle, fixed. */
var speckleRng = mulberry32(1669);
var speckles = [];
var si;
for (si = 0; si < 320; si++) {
  speckles.push({
    x: speckleRng(), y: speckleRng(),
    r: 0.4 + speckleRng() * 1.1, a: 0.02 + speckleRng() * 0.04
  });
}
/* One herringbone field per cycle, cached. Coordinates are fractions of
   the painting area (x of VW, y of paintH) so the field scales. */
var fieldCache = {};
function buildField(cycle) {
  if (fieldCache[cycle]) return fieldCache[cycle];
  var rng = mulberry32(1669 * 1000 + cycle * 7919);
  var angle = (23 + rng() * 7) * Math.PI / 180;
  var colGap = 0.024 + rng() * 0.006;
  var rowGap = 0.026 + rng() * 0.006;
  var greyW = 0.50 + rng() * 0.10;
  var maroonW = 0.22 + rng() * 0.06;
  var strokes = [];
  var cols = Math.floor(1 / colGap) + 2;
  var rows = Math.floor(1 / rowGap) + 2;
  var r, c, j, pick, col, edge;
  for (r = 0; r < rows; r++) {
    for (c = 0; c < cols; c++) {
      pick = rng();
      col = pick < greyW ? GREY : (pick < greyW + maroonW ? MAROON : OCHRE);
      edge = [];
      for (j = 0; j <= SEGS; j++) {
        edge.push((rng() - 0.5) * 0.9);
      }
      strokes.push({
        x: (c + 0.5 + (rng() - 0.5) * 0.5) * colGap,
        y: (r + 0.5 + (rng() - 0.5) * 0.4) * rowGap,
        len: rowGap * (3.0 + rng() * 1.0),
        wid: colGap * (0.30 + rng() * 0.18),
        col: col,
        alpha: 0.80 + rng() * 0.15,
        edge: edge
      });
    }
  }
  var field = { angle: angle, strokes: strokes };
  fieldCache[cycle] = field;
  return field;
}
function drawStroke(s, cx, cy, lenFrac, paintH, angle) {
  var tilt = (s.x < 0.5 ? -angle : angle);
  var dx = Math.sin(tilt), dy = Math.cos(tilt);
  var px = Math.cos(tilt), py = -Math.sin(tilt);
  var halfLen = (s.len * paintH * lenFrac) / 2;
  var halfWid = (s.wid * VW) / 2;
  var j, f, taper, off, ex, ey;
  ctx.beginPath();
  for (j = 0; j <= SEGS; j++) {
    f = j / SEGS;
    taper = 0.6 + 0.4 * Math.sin(Math.PI * clamp(f, 0.06, 0.94));
    off = s.edge[j] * halfWid * (0.35 + 0.65 * taper);
    ex = cx + dx * (f - 0.5) * 2 * halfLen + px * (halfWid * taper + off);
    ey = cy + dy * (f - 0.5) * 2 * halfLen + py * (halfWid * taper + off);
    if (j === 0) ctx.moveTo(ex, ey); else ctx.lineTo(ex, ey);
  }
  for (j = SEGS; j >= 0; j--) {
    f = j / SEGS;
    taper = 0.6 + 0.4 * Math.sin(Math.PI * clamp(f, 0.06, 0.94));
    off = s.edge[j] * halfWid * (0.35 + 0.65 * taper);
    ex = cx + dx * (f - 0.5) * 2 * halfLen - px * (halfWid * taper + off);
    ey = cy + dy * (f - 0.5) * 2 * halfLen - py * (halfWid * taper + off);
    ctx.lineTo(ex, ey);
  }
  ctx.closePath();
  ctx.fillStyle = rgba(s.col, s.alpha);
  ctx.fill();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  var title = 'Painting, Pixel 48000';
  var date = '2006 · 08 · 07';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(title).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText(date).width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(title, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText(date, plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var paintH = VH * 0.80;
  var cycle = Math.floor(t / CYCLE);
  var pt = t - cycle * CYCLE;
  var field = buildField(cycle);
  var strokes = field.strokes;
  var total = strokes.length;
  var i, s, revealed, frac;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  for (i = 0; i < speckles.length; i++) {
    var sp = speckles[i];
    ctx.fillStyle = rgba(GREY, sp.a);
    ctx.beginPath();
    ctx.moveTo(sp.x * VW + sp.r, sp.y * paintH);
    ctx.arc(sp.x * VW, sp.y * paintH, sp.r, 0, TAU);
    ctx.fill();
  }
  if (pt < BUILD) {
    revealed = (pt / BUILD) * total;
  } else {
    revealed = total;
  }
  var whole = Math.floor(revealed);
  for (i = 0; i < whole && i < total; i++) {
    s = strokes[i];
    drawStroke(s, s.x * VW, s.y * paintH, 1, paintH, field.angle);
  }
  if (pt < BUILD && whole < total) {
    frac = revealed - whole;
    if (frac > 0.02) {
      s = strokes[whole];
      drawStroke(s, s.x * VW, s.y * paintH, frac, paintH, field.angle);
    }
  }
  if (pt >= BUILD + HOLD) {
    var fa = clamp((pt - BUILD - HOLD) / FADE, 0, 1);
    ctx.fillStyle = rgba([246, 243, 234], fa);
    ctx.fillRect(0, 0, VW, paintH);
  }
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    strokeCount: function () { return buildField(0).strokes.length; }
  };
}
/* ---- frame one: t = FIRST_T, 40 percent painted ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
