<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real to Synthetic</title>
<style>
html, body { margin: 0; padding: 0; background: #7FA8C9; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var SKY = '#7FA8C9';
var CLOUD = '#F2F0EA';
var ROCK = '#8A6A4F';
var TAN = '#C9A87A';
var GROUND = '#7FA8C9';
var PLATE = '#141210';
var PLATE_LINE = 'rgba(242,237,226,0.45)';
var TITLE_INK = '#F2EDE2';
var HINT_INK = '#F2EDE2';
var FIRST_T = 15;
/* DRIVER: a photograph dissolving into the vector field that was always
   hiding in its own contours, then condensing back. A seeded procedural
   Joshua Tree landscape (blue sky, white clouds, brown rock) dissolves
   over 30 s into ribbons advected along the flow field derived from the
   photo's own luminance gradients, holds as simulation for a minute, then
   the photo bleeds back through over 30 s. The dissolve is a
   left-to-right wavefront, so source and simulation share the frame
   mid-transition. Watch-only. */
var CYCLE = 120, DISSOLVE = 30, HOLD = 60, BACK = 30;
var HORIZON = 0.618;
var TRAJ = 48, STREAK = 12, RIBBONS = 240;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mix3(a, b, f) {
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
var SKY_RGB = hexRgb(SKY), CLOUD_RGB = hexRgb(CLOUD);
var ROCK_RGB = hexRgb(ROCK), TAN_RGB = hexRgb(TAN);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Field-like composition: square frame on desktop, full-bleed on phones.
   Inside the field, the landscape scene is 1.6:1, centered; the bands
   above and below it take the sky and tan of the scene edges. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function sceneRect(fr) {
  /* On phones the scene fills the whole viewport; on desktop it keeps
     its 1.6:1 landscape framing inside the square field. */
  if (isPhone) return { x: fr.x, y: fr.y, w: fr.w, h: fr.h };
  var sw = fr.w, sh = sw / 1.6;
  if (sh > fr.h) { sh = fr.h; sw = sh * 1.6; }
  return { x: fr.x + (fr.w - sw) / 2, y: fr.y + (fr.h - sh) / 2, w: sw, h: sh };
}
/* ---- the procedural photograph (seed 940, PP940) ---- */
var rng = mulberry32(940);
var CLOUDS = [];
(function () {
  var i;
  for (i = 0; i < 6; i++) {
    CLOUDS.push({
      cx: 0.08 + rng() * 0.84,
      cy: 0.06 + rng() * 0.34,
      rx: 0.09 + rng() * 0.11,
      ry: 0.03 + rng() * 0.045,
      a: 0.55 + rng() * 0.45
    });
  }
})();
var BOULDERS = [
  { cx: 0.22, cy: HORIZON + 0.03, rx: 0.10, ry: 0.055 },
  { cx: 0.58, cy: HORIZON + 0.05, rx: 0.075, ry: 0.045 },
  { cx: 0.86, cy: HORIZON + 0.02, rx: 0.06, ry: 0.035 }
];
/* Ridgeline: gentle sines plus a flat-topped mesa near u = 0.68. */
function ridge(u) {
  var r = HORIZON
    + 0.028 * Math.sin(TAU * 1.3 * u + 0.7)
    + 0.018 * Math.sin(TAU * 2.9 * u + 2.1)
    - 0.05 * Math.exp(-((u - 0.68) * (u - 0.68)) / 0.004);
  return clamp(r, HORIZON - 0.06, HORIZON + 0.06);
}
/* The photograph, sampled at scene coords (u, v) in [0, 1]. Only the
   four palette colors, mixed with each other, are ever used. */
function photoColor(u, v) {
  var i, c, e;
  if (v < ridge(u)) {
    /* Sky: blue deepening toward the top, hazed toward cloud white at
       the horizon; cloud blobs drift across it. */
    var t = clamp(v / HORIZON, 0, 1);
    c = mix3(SKY_RGB, CLOUD_RGB, 0.32 * t);
    var sum = 0;
    for (i = 0; i < CLOUDS.length; i++) {
      var cl = CLOUDS[i];
      var du = (u - cl.cx) / cl.rx, dv = (v - cl.cy) / cl.ry;
      sum += cl.a * Math.exp(-(du * du + dv * dv));
    }
    c = mix3(c, CLOUD_RGB, clamp(sum, 0, 1) * 0.95);
    return c;
  }
  /* Rock and foreground: brown rock at the ridgeline grading down
     through tan, with dune bands in the foreground and darker boulder
     masses straddling the horizon. */
  var d = clamp((v - ridge(u)) / 0.16, 0, 1);
  c = mix3(ROCK_RGB, TAN_RGB, d);
  if (v > HORIZON + 0.16) {
    var band = 0.5 + 0.5 * Math.sin(TAU * 5 * v + 2 * Math.sin(TAU * 3 * u));
    c = mix3(c, ROCK_RGB, 0.18 * band);
  }
  for (i = 0; i < BOULDERS.length; i++) {
    var b = BOULDERS[i];
    var bu = (u - b.cx) / b.rx, bv = (v - b.cy) / b.ry;
    e = Math.exp(-(bu * bu + bv * bv));
    c = [c[0] * (1 - 0.25 * e), c[1] * (1 - 0.25 * e), c[2] * (1 - 0.25 * e)];
  }
  var shade = 0.94 + 0.06 * Math.sin(TAU * (3 * u + 2 * v));
  return [c[0] * shade, c[1] * shade, c[2] * shade];
}
function luminance(u, v) {
  var c = photoColor(u, v);
  return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
}
/* Flow field: perpendicular to the photo's luminance gradient, so
   ribbons trace the original cloud and rock contours. Where the photo
   is flat, the field drifts gently rightward. */
function flowAt(u, v) {
  var e = 0.005;
  var gx = (luminance(u + e, v) - luminance(u - e, v)) / (2 * e);
  var gy = (luminance(u, v + e) - luminance(u, v - e)) / (2 * e);
  var mag = Math.sqrt(gx * gx + gy * gy);
  if (mag < 0.02) return [1, 0.08];
  return [-gy / mag, gx / mag];
}
/* ---- ribbons: seeded particles advected along the flow field ---- */
var RIBBON_LIST = [];
(function () {
  var i, k;
  for (i = 0; i < RIBBONS; i++) {
    /* Bias seeds so both readings get ribbons: sky and rock alike. */
    var u0, v0;
    if (rng() < 0.55) { u0 = rng(); v0 = rng() * 0.55; }
    else { u0 = rng(); v0 = 0.55 + rng() * 0.45; }
    var pts = [];
    var pu = u0, pv = v0;
    for (k = 0; k < TRAJ; k++) {
      pts.push([pu, pv]);
      var f = flowAt(pu, pv);
      /* Damp the flow toward the wall as the particle nears a scene
         edge, so ribbons turn parallel to the frame instead of piling
         up and sliding along it. */
      var mx = Math.min(pu - 0.02, 0.98 - pu) / 0.06;
      var my = Math.min(pv - 0.02, 0.98 - pv) / 0.06;
      pu += f[0] * smooth(mx) * 0.012;
      pv += f[1] * smooth(my) * 0.012;
      if (pu < 0.02) pu = 0.02; if (pu > 0.98) pu = 0.98;
      if (pv < 0.02) pv = 0.02; if (pv > 0.98) pv = 0.98;
    }
    var col = photoColor(u0, v0);
    RIBBON_LIST.push({
      pts: pts,
      col: 'rgb(' + (col[0] | 0) + ',' + (col[1] | 0) + ',' + (col[2] | 0) + ')',
      phase: rng() * (TRAJ - STREAK)
    });
  }
})();
/* Wavefront position in [0, 1]: 0 = all photo, 1 = all simulation.
   0-30 s dissolve left to right, 30-90 s hold, 90-120 s bleed back. */
function wavefront(t) {
  var p = ((t % CYCLE) + CYCLE) % CYCLE;
  if (p < DISSOLVE) return p / DISSOLVE;
  if (p < DISSOLVE + HOLD) return 1;
  return 1 - (p - DISSOLVE - HOLD) / BACK;
}
/* Photo alpha at scene x: 1 where the photo still stands, 0 where the
   simulation has taken over, soft across a 0.10 band at the front. */
function photoAlphaAt(u, front) {
  return smooth((u - front) / 0.10);
}
/* ---- the photo, precomputed once per scene size ----
   The photograph is static, so its cell colors are computed once and
   reused every frame; only the blend weights move with the wavefront.
   Each cell is drawn twice: a dimmed version (0.55 brightness) that is
   the simulation's ground, and the full photo on top of it with the
   wavefront alpha. Ribbons, drawn at full sampled color, then read
   against the dimmed ground instead of vanishing into it. */
var PHOTO_GRID = null;
function ensurePhotoGrid(sc) {
  if (PHOTO_GRID && PHOTO_GRID.w === sc.w && PHOTO_GRID.h === sc.h) return;
  var cols = Math.round(Math.sqrt(26000 * sc.w / sc.h));
  cols = clamp(cols, 10, 220);
  var rows = Math.max(10, Math.round(cols * sc.h / sc.w));
  var colors = new Array(cols * rows);
  var i, j;
  for (j = 0; j < rows; j++) {
    var v = (j + 0.5) / rows;
    for (i = 0; i < cols; i++) {
      var u = (i + 0.5) / cols;
      colors[j * cols + i] = photoColor(u, v);
    }
  }
  PHOTO_GRID = { w: sc.w, h: sc.h, cols: cols, rows: rows, colors: colors };
}
function drawPhoto(sc, front) {
  ensurePhotoGrid(sc);
  var cols = PHOTO_GRID.cols, rows = PHOTO_GRID.rows;
  var cw = sc.w / cols, ch = sc.h / rows;
  var i, j;
  for (j = 0; j < rows; j++) {
    var v = (j + 0.5) / rows;
    /* Snap cell rects to integer pixel edges so antialiased fractional
       seams can never let the dimmed layer show through. */
    var y0 = Math.floor(sc.y + j * ch), y1 = Math.ceil(sc.y + (j + 1) * ch);
    for (i = 0; i < cols; i++) {
      var u = (i + 0.5) / cols;
      var a = photoAlphaAt(u, front);
      var c = PHOTO_GRID.colors[j * cols + i];
      var x0 = Math.floor(sc.x + i * cw), x1 = Math.ceil(sc.x + (i + 1) * cw);
      ctx.fillStyle = 'rgb(' + ((c[0] * 0.55) | 0) + ',' + ((c[1] * 0.55) | 0) + ',' + ((c[2] * 0.55) | 0) + ')';
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      if (a <= 0) continue;
      ctx.fillStyle = 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
      if (a < 1) ctx.globalAlpha = Number(a.toFixed(4));
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      if (a < 1) ctx.globalAlpha = 1;
    }
  }
}
function drawRibbons(sc, front, t) {
  var lw = Math.max(1.4, sc.w / 420);
  var i, j;
  ctx.lineCap = 'round';
  for (i = 0; i < RIBBON_LIST.length; i++) {
    var rb = RIBBON_LIST[i];
    var k = Math.floor((t * 0.5 + rb.phase) % (TRAJ - STREAK));
    /* Fade the streak out near the wrap so its teleport never shows. */
    var wrap = clamp(Math.min(k, (TRAJ - STREAK) - k) / 4, 0, 1);
    if (wrap <= 0) continue;
    var head = rb.pts[k];
    var base = (1 - photoAlphaAt(head[0], front)) * 0.9 * wrap;
    if (base <= 0.01) continue;
    ctx.strokeStyle = rb.col;
    ctx.lineWidth = lw;
    for (j = 0; j < STREAK - 1; j++) {
      var p0 = rb.pts[k + j], p1 = rb.pts[k + j + 1];
      var segA = base * (1 - (j / STREAK) * 0.7);
      ctx.globalAlpha = Number(segA.toFixed(4));
      ctx.beginPath();
      ctx.moveTo(sc.x + p0[0] * sc.w, sc.y + p0[1] * sc.h);
      ctx.lineTo(sc.x + p1[0] * sc.w, sc.y + p1[1] * sc.h);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  /* The wavefront itself: a thin pale seam where the two readings meet. */
  if (front > 0 && front < 1) {
    ctx.strokeStyle = CLOUD;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sc.x + front * sc.w, sc.y);
    ctx.lineTo(sc.x + front * sc.w, sc.y + sc.h);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Real to Synthetic').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Real to Synthetic').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 31').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Real to Synthetic', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 31', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var fr = fieldRect();
  var sc = sceneRect(fr);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* Bands above and below the scene take the colors at its edges. */
  ctx.fillStyle = TAN;
  ctx.fillRect(fr.x, sc.y + sc.h, fr.w, fr.y + fr.h - (sc.y + sc.h));
  var front = wavefront(t);
  drawPhoto(sc, front);
  drawRibbons(sc, front, t);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    wavefront: function (t) { return wavefront(t); },
    ribbonCount: function () { return RIBBON_LIST.length; },
    cloudCount: function () { return CLOUDS.length; },
    cycle: function () { return CYCLE; }
  };
}
/* ---- frame one: t = 15, mid-dissolve, wavefront mid-frame ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null, lastDrawn = -1;
draw(FIRST_T);
lastDrawn = FIRST_T;
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    /* The photo grid is expensive; the dissolve is slow, so redraw at
       most every 0.2 s. */
    if (clockT - lastDrawn >= 0.2) {
      draw(clockT);
      lastDrawn = clockT;
    }
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
