<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9033 · Flux</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#040407; }
#stage { position:fixed; inset:0; display:block; }
#begin {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:#040407; color:#8a8f9e; font:14px/1.4 system-ui, sans-serif;
  letter-spacing:0.2em; text-transform:uppercase; cursor:pointer; z-index:10;
  transition:opacity 0.8s ease; user-select:none; -webkit-user-select:none;
}
#begin.gone { opacity:0; pointer-events:none; }
#begin span { border:1px solid #2a2e3a; padding:14px 28px; border-radius:2px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="begin"><span>tap to begin</span></div>
<script>
'use strict';
/* №9033 · Flux — generative audio visualizer.
   A flow-field particle system driven by live-synthesized ambient audio.
   Bass steers large currents, mids stir turbulence, highs scatter sparks.
   Beat pulses send a shockwave through the field. Drag to stir. */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const beginEl = document.getElementById('begin');

function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
let W = 0, H = 0, DPR = 1;
function prep(){
  const [w,h] = viewportWH();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = w; H = h;
  canvas.width = Math.round(w*DPR); canvas.height = Math.round(h*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
prep();
window.addEventListener('resize', prep);

/* ---------------- Audio: generative ambient ---------------- */
let AC = null, analyser = null, freqData = null;
let audioStarted = false;

const PENTA = [0, 3, 5, 7, 10, 12, 15]; // minor pentatonic
const ROOTS = [110, 87.31, 130.81, 98]; // A2, F2, C3, G2
let chordIdx = 0;

function midiHz(m){ return 440 * Math.pow(2, (m-69)/12); }

function startAudio(){
  if (audioStarted) return;
  audioStarted = true;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  analyser = AC.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.82;
  freqData = new Uint8Array(analyser.frequencyBinCount);

  const master = AC.createGain();
  master.gain.value = 0.55;
  master.connect(analyser);
  analyser.connect(AC.destination);

  // gentle lowpass to keep it warm
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 3200; lp.Q.value = 0.4;
  lp.connect(master);

  // delay for plucks
  const delay = AC.createDelay(1.0);
  delay.delayTime.value = 0.42;
  const fb = AC.createGain(); fb.gain.value = 0.38;
  const wet = AC.createGain(); wet.gain.value = 0.3;
  delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(lp);

  // pad chord every 8s
  function padChord(){
    if (!AC) return;
    const root = ROOTS[chordIdx % ROOTS.length];
    chordIdx++;
    const t = AC.currentTime + 0.05;
    [0, 3, 7, 10].forEach(iv => {
      const f = root * Math.pow(2, iv/12);
      [-4, 4].forEach(det => {
        const o = AC.createOscillator();
        o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
        const g = AC.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.035, t+2.5);
        g.gain.setValueAtTime(0.035, t+6);
        g.gain.linearRampToValueAtTime(0, t+9);
        const fl = AC.createBiquadFilter();
        fl.type='lowpass'; fl.frequency.value = 900;
        o.connect(fl); fl.connect(g); g.connect(lp);
        o.start(t); o.stop(t+9.5);
      });
    });
    setTimeout(padChord, 8000);
  }

  // bass pulse
  function bass(){
    if (!AC) return;
    const root = ROOTS[(chordIdx-1+ROOTS.length)%ROOTS.length] / 2;
    const t = AC.currentTime + 0.05;
    const o = AC.createOscillator();
    o.type='sine'; o.frequency.value = root;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.22, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+1.8);
    o.connect(g); g.connect(lp);
    o.start(t); o.stop(t+2);
    setTimeout(bass, 2000);
  }

  // sparse pluck melody
  let melIdx = 3;
  function pluck(){
    if (!AC) return;
    const t = AC.currentTime + 0.05;
    melIdx += [ -2,-1,1,2 ][Math.floor(Math.random()*4)];
    melIdx = Math.max(0, Math.min(PENTA.length-1, melIdx));
    const root = ROOTS[(chordIdx-1+ROOTS.length)%ROOTS.length];
    const semis = PENTA[melIdx] + 12;
    const f = root * Math.pow(2, semis/12) * 2;
    const o = AC.createOscillator();
    o.type='triangle'; o.frequency.value = f;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+1.4);
    o.connect(g); g.connect(lp); g.connect(delay);
    o.start(t); o.stop(t+1.6);
    setTimeout(pluck, 700 + Math.random()*2200);
  }

  padChord(); bass(); pluck();
  beginEl.classList.add('gone');
}

beginEl.addEventListener('click', () => {
  startAudio();
  if (AC && AC.state === 'suspended') AC.resume();
});

/* ---------------- Particles ---------------- */
const COUNT = 2200;
const parts = [];
let cx = 0, cy = 0;

function resetParticle(p, randomPos){
  p.x = randomPos ? Math.random()*W : cx + (Math.random()-0.5)*40;
  p.y = randomPos ? Math.random()*H : cy + (Math.random()-0.5)*40;
  p.vx = 0; p.vy = 0;
  p.life = 0;
  p.maxLife = 200 + Math.random()*400;
  p.hue = Math.random();
  p.size = 0.6 + Math.random()*1.6;
}

function initParticles(){
  parts.length = 0;
  cx = W/2; cy = H/2;
  for (let i=0;i<COUNT;i++){
    const p = {};
    resetParticle(p, true);
    parts.push(p);
  }
}
initParticles();

// simple pseudo-noise
function noise2(x, y){
  const s = Math.sin(x*1.7 + Math.sin(y*1.3)*2.1) + Math.sin(y*2.3 + Math.sin(x*0.9)*1.7);
  return s * 0.5;
}

// audio bands (filled each frame)
let bassE=0, midE=0, highE=0, beat=0, beatDecay=0;
let lastBass = 0;

function readAudio(){
  if (!analyser || !freqData) return;
  analyser.getByteFrequencyData(freqData);
  const n = freqData.length;
  let b=0, m=0, h=0;
  const bN = Math.floor(n*0.08), mN = Math.floor(n*0.35);
  for (let i=0;i<bN;i++) b += freqData[i];
  for (let i=bN;i<mN;i++) m += freqData[i];
  for (let i=mN;i<n;i++) h += freqData[i];
  bassE = (b/bN)/255; midE = (m/(mN-bN))/255; highE = (h/(n-mN))/255;
  // beat: bass energy spike
  if (bassE > lastBass*1.35 && bassE > 0.25) beat = 1;
  lastBass += (bassE - lastBass)*0.25;
  beatDecay += (beat - beatDecay)*0.12;
  beat *= 0.94;
}

// touch stir
const stirs = [];
function addStir(x, y){
  stirs.push({x, y, life: 1});
  if (stirs.length > 6) stirs.shift();
}
let dragging = false;
canvas.addEventListener('pointerdown', e => { dragging = true; addStir(e.clientX, e.clientY); });
canvas.addEventListener('pointermove', e => { if (dragging) addStir(e.clientX, e.clientY); });
window.addEventListener('pointerup', () => dragging = false);

let t = 0;
function frame(){
  t += 0.008;
  readAudio();

  // fade trails
  ctx.fillStyle = 'rgba(4,4,7,0.10)';
  ctx.fillRect(0,0,W,H);

  // shockwave from beat
  const shock = beatDecay;

  for (let i=0;i<parts.length;i++){
    const p = parts[i];
    p.life++;

    // flow field: base curl + audio modulation
    const nx = p.x*0.0022, ny = p.y*0.0022;
    let ang = noise2(nx + t*0.25, ny - t*0.18) * Math.PI * 2.2;
    ang += bassE * 2.4 * Math.sin(t*1.3 + p.y*0.004);      // bass: big swells
    ang += midE * 1.8 * noise2(nx*3 - t*0.6, ny*3);          // mids: turbulence
    ang += (highE-0.2) * 3.0 * Math.sin(p.x*0.05 + t*7);     // highs: shimmer

    // beat shockwave: radial push from center
    if (shock > 0.03){
      const dx = p.x - cx, dy = p.y - cy;
      const d = Math.hypot(dx,dy) + 1;
      const wave = Math.sin(d*0.02 - t*22) * shock;
      p.vx += (dx/d) * wave * 2.4;
      p.vy += (dy/d) * wave * 2.4;
    }

    // touch stir vortices
    for (let s=0;s<stirs.length;s++){
      const st = stirs[s];
      const dx = p.x - st.x, dy = p.y - st.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < 32400){
        const d = Math.sqrt(d2)+1;
        const f = st.life * 900 / d2;
        p.vx += (-dy/d) * f;
        p.vy += (dx/d) * f;
      }
    }

    const sp = 0.7 + bassE*2.2 + midE*1.1;
    p.vx += Math.cos(ang) * 0.14 * sp;
    p.vy += Math.sin(ang) * 0.14 * sp;
    p.vx *= 0.985; p.vy *= 0.985;
    p.x += p.vx; p.y += p.vy;

    // respawn at edges or end of life
    if (p.x < -20 || p.x > W+20 || p.y < -20 || p.y > H+20 || p.life > p.maxLife){
      resetParticle(p, Math.random() < 0.7);
      continue;
    }

    // color: duotone by local energy — cyan for calm, magenta for excited
    const excite = Math.min(1, (Math.hypot(p.vx,p.vy)*0.35) + midE*0.6 + shock*0.5);
    const r = Math.round(20 + excite*235);
    const g = Math.round(240 - excite*150);
    const b = Math.round(255 - excite*110);
    const a = Math.min(1, p.life/30) * Math.min(1, (p.maxLife-p.life)/60) * 0.85;

    ctx.fillStyle = `rgba(${r},${g},${b},${a.toFixed(3)})`;
    const sz = p.size * (1 + highE*0.9 + shock*0.7);
    ctx.fillRect(p.x, p.y, sz, sz);
  }

  // decay stirs
  for (let i=stirs.length-1;i>=0;i--){
    stirs[i].life *= 0.965;
    if (stirs[i].life < 0.02) stirs.splice(i,1);
  }

  requestAnimationFrame(frame);
}

// seed background
ctx.fillStyle = '#040407';
ctx.fillRect(0,0,W,H);
frame();
</script>
</body>
</html>
