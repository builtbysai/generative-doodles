<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solarpunk Haussmann</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#BFD9E8; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  function RNG(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var STONE = '#E8DCC8', ZINC = '#8A9BA8', IVY = '#4A7C3A', DEEP = '#2D5A27';
  var SKY = '#BFD9E8', BUS = '#E8B83A', AWN = '#B5584A', CREAM = '#E8DCC8';
  var PHASE0 = 1.5;
  var currentT = PHASE0;
  var seeds = [];

  // Fixed building layout: left row (3) and right row (3), fractions of W.
  // Each building: x0, x1 (fractions), floors, windows per floor, ivy patches.
  var buildings = [];
  (function () {
    var r = RNG(449001);
    var left = [[0.00, 0.11], [0.11, 0.21], [0.21, 0.30]];
    var right = [[0.38, 0.50], [0.50, 0.66], [0.66, 0.82], [0.82, 1.00]];
    var i, j, patches;
    function mk(span, side) {
      patches = [];
      for (j = 0; j < 4; j++) {
        patches.push({ fx: 0.15 + r() * 0.7, fy: 0.15 + r() * 0.55, s: 0.05 + r() * 0.06, ph: r() * Math.PI * 2 });
      }
      return { x0: span[0], x1: span[1], floors: 3 + Math.floor(r() * 2), side: side, patches: patches };
    }
    for (i = 0; i < left.length; i++) buildings.push(mk(left[i], 'L'));
    for (i = 0; i < right.length; i++) buildings.push(mk(right[i], 'R'));
  })();

  var trees = [];
  (function () {
    var r = RNG(449002);
    var xs = [0.06, 0.16, 0.26, 0.44, 0.58, 0.74, 0.90];
    for (var i = 0; i < xs.length; i++) {
      trees.push({ fx: xs[i], s: 0.05 + r() * 0.025, ph: r() * Math.PI * 2 });
    }
  })();

  function drawBuilding(b, t) {
    var x0 = b.x0 * W, x1 = b.x1 * W, bw = x1 - x0;
    var top = H * 0.16, bot = H * 0.74;
    // stone body
    ctx.fillStyle = STONE;
    ctx.fillRect(x0, top, bw, bot - top);
    // mansard roof: zinc trapezoid with dormers
    ctx.fillStyle = ZINC;
    ctx.beginPath();
    ctx.moveTo(x0 - 2, top);
    ctx.lineTo(x0 + bw * 0.12, top - H * 0.055);
    ctx.lineTo(x1 - bw * 0.12, top - H * 0.055);
    ctx.lineTo(x1 + 2, top);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = STONE;
    var nd = Math.max(2, Math.floor(bw / (W * 0.045)));
    for (var d = 0; d < nd; d++) {
      var dx = x0 + bw * (d + 0.5) / nd;
      ctx.fillRect(dx - bw * 0.035, top - H * 0.045, bw * 0.07, H * 0.045);
    }
    // windows: grid with arched tops, wrought-iron balcony rails on floor 2
    var fh = (bot - top) / b.floors;
    var cols = Math.max(2, Math.floor(bw / (W * 0.045)));
    for (var f = 0; f < b.floors; f++) {
      var wy = top + f * fh + fh * 0.22;
      for (var c = 0; c < cols; c++) {
        var wx = x0 + bw * (c + 0.5) / cols;
        var ww = bw * 0.10, wh = fh * 0.42;
        ctx.fillStyle = '#5A6A72';
        ctx.beginPath();
        ctx.moveTo(wx - ww, wy + wh);
        ctx.lineTo(wx - ww, wy);
        ctx.arc(wx, wy, ww, Math.PI, 0);
        ctx.lineTo(wx + ww, wy + wh);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(90,90,80,0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx, wy + wh); ctx.stroke();
        if (f === 1) {
          ctx.strokeStyle = '#3A3A34'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(wx - ww - 2, wy + wh + 2); ctx.lineTo(wx + ww + 2, wy + wh + 2); ctx.stroke();
          for (var k = -1; k <= 1; k++) {
            ctx.beginPath(); ctx.moveTo(wx + k * ww * 0.5, wy + wh + 2); ctx.lineTo(wx + k * ww * 0.5, wy + wh + 7); ctx.stroke();
          }
        }
      }
    }
    // ground-floor shopfront with striped awning
    var gy = bot - H * 0.10;
    ctx.fillStyle = '#6E6A66';
    ctx.fillRect(x0 + 2, gy, bw - 4, H * 0.10);
    ctx.fillStyle = CREAM;
    ctx.fillRect(x0 + bw * 0.1, gy + H * 0.015, bw * 0.8, H * 0.07);
    var stripes = Math.floor(bw / 14);
    ctx.fillStyle = AWN;
    for (var s = 0; s < stripes; s += 2) {
      ctx.fillRect(x0 + bw * 0.1 + s * 14, gy - H * 0.028, 14, H * 0.028);
    }
    // ivy curtains with 40s growth pulse
    for (var p = 0; p < b.patches.length; p++) {
      var pt = b.patches[p];
      var pulse = 0.75 + 0.25 * Math.sin((t / 40) * Math.PI * 2 + pt.ph);
      var ix = x0 + pt.fx * bw, iy = top + pt.fy * (bot - top);
      var ir = pt.s * Math.min(W, H) * 0.35 * pulse;
      ctx.fillStyle = IVY;
      ctx.beginPath(); ctx.arc(ix, iy, ir, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ix + ir * 0.7, iy + ir * 0.4, ir * 0.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = DEEP;
      ctx.beginPath(); ctx.arc(ix - ir * 0.4, iy + ir * 0.5, ir * 0.45, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawFigure(x, y, s, t, ph, kind) {
    ctx.strokeStyle = '#3A2E24'; ctx.lineWidth = Math.max(1.5, s * 0.05); ctx.lineCap = 'round';
    var legSwing = Math.sin(t * 3 + ph) * s * 0.12;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - s * 0.08, y + s * 0.34 + legSwing * 0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s * 0.08, y + s * 0.34 - legSwing * 0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - s * 0.32); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = '#3A2E24';
    ctx.beginPath(); ctx.arc(x, y - s * 0.42, s * 0.11, 0, Math.PI * 2); ctx.fill();
    if (kind === 'bike') {
      ctx.strokeStyle = '#2A2A28'; ctx.lineWidth = Math.max(1.5, s * 0.04);
      ctx.beginPath(); ctx.arc(x - s * 0.22, y + s * 0.34, s * 0.16, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + s * 0.22, y + s * 0.34, s * 0.16, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - s * 0.22, y + s * 0.34); ctx.lineTo(x, y + s * 0.05); ctx.lineTo(x + s * 0.22, y + s * 0.34); ctx.stroke();
    }
  }

  function drawBus(bx, by, s) {
    ctx.fillStyle = BUS;
    ctx.fillRect(bx, by, s * 3.2, s * 0.95);
    ctx.fillStyle = '#3A3A34';
    ctx.fillRect(bx + s * 0.15, by + s * 0.12, s * 2.9, s * 0.42);
    ctx.fillStyle = SKY;
    for (var i = 0; i < 4; i++) ctx.fillRect(bx + s * (0.3 + i * 0.7), by + s * 0.18, s * 0.5, s * 0.3);
    ctx.fillStyle = '#2A2A28';
    ctx.beginPath(); ctx.arc(bx + s * 0.6, by + s * 0.95, s * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + s * 2.6, by + s * 0.95, s * 0.22, 0, Math.PI * 2); ctx.fill();
    // pantograph line to the sky
    ctx.strokeStyle = '#2A2A28'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx + s * 1.6, by); ctx.lineTo(bx + s * 1.9, by - s * 0.5); ctx.stroke();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // sky, top quarter
    ctx.fillStyle = SKY;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.ellipse(W * 0.2, H * 0.08, W * 0.09, H * 0.025, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(W * 0.72, H * 0.05, W * 0.12, H * 0.03, 0, 0, Math.PI * 2); ctx.fill();

    for (var b = 0; b < buildings.length; b++) drawBuilding(buildings[b], t);

    // ground band below the facades, then the cobbled street trapezoid
    // receding to a vanishing point near 1/3 width
    var vy = H * 0.70, vxl = W * 0.30, vxr = W * 0.38;
    ctx.fillStyle = '#B0A694';
    ctx.fillRect(0, vy, W, H - vy);
    ctx.fillStyle = '#9A8F80';
    ctx.beginPath();
    ctx.moveTo(vxl, vy); ctx.lineTo(vxr, vy); ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(60,55,48,0.35)'; ctx.lineWidth = 1;
    for (var r0 = 0; r0 < 8; r0++) {
      var ry = vy + (H - vy) * (r0 / 8);
      var f = (ry - vy) / (H - vy);
      var lx = vxl + (0 - vxl) * f, rx = vxr + (W - vxr) * f;
      ctx.beginPath(); ctx.moveTo(lx, ry); ctx.lineTo(rx, ry); ctx.stroke();
    }
    // trees and planters along the street edges
    for (var ti = 0; ti < trees.length; ti++) {
      var tr = trees[ti];
      var tx = tr.fx * W, ty = H * 0.78 + (tr.fx > 0.5 ? H * 0.06 : 0);
      var sway = Math.sin(t * 0.8 + tr.ph) * 3;
      ctx.strokeStyle = '#5C4632'; ctx.lineWidth = Math.max(2, W * 0.004);
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + sway, ty - H * 0.10); ctx.stroke();
      ctx.fillStyle = IVY;
      ctx.beginPath(); ctx.arc(tx + sway, ty - H * 0.13, tr.s * Math.min(W, H) * 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = DEEP;
      ctx.beginPath(); ctx.arc(tx + sway - tr.s * Math.min(W, H) * 0.4, ty - H * 0.11, tr.s * Math.min(W, H) * 0.48, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#B46A4A';
      ctx.fillRect(tx - W * 0.012, ty - H * 0.012, W * 0.024, H * 0.012);
    }
    // pedestrians and cyclists looping the street
    var walkers = [
      { off: 0.0, sp: 0.045, y: 0.80, s: 46, ph: 0, kind: 'walk' },
      { off: 0.4, sp: 0.035, y: 0.86, s: 58, ph: 2, kind: 'walk' },
      { off: 0.7, sp: 0.055, y: 0.90, s: 64, ph: 4, kind: 'walk' },
      { off: 0.2, sp: 0.09, y: 0.84, s: 52, ph: 1, kind: 'bike' },
      { off: 0.6, sp: 0.11, y: 0.93, s: 60, ph: 3, kind: 'bike' }
    ];
    for (var wi = 0; wi < walkers.length; wi++) {
      var wk = walkers[wi];
      var span = W + 160;
      var wx = ((wk.off * span + t * wk.sp * W) % span) - 80;
      drawFigure(wx, H * wk.y, wk.s * (H / 900 + 0.6), t, wk.ph, wk.kind);
    }
    // trolleybus every 60s, crossing over 14s
    var bt = t % 60;
    if (bt < 14) {
      var bx = -W * 0.32 + (bt / 14) * (W * 1.32);
      drawBus(bx, H * 0.82, Math.max(36, W * 0.05));
    }
    // drag-planted seeds sprouting where the pointer moved
    for (var si = 0; si < seeds.length; si++) {
      var sd = seeds[si];
      var age = t - sd.born;
      if (age < 0) continue;
      var g = Math.min(1, age / 4);
      ctx.strokeStyle = DEEP; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sd.x, sd.y); ctx.lineTo(sd.x, sd.y - 26 * g); ctx.stroke();
      ctx.fillStyle = IVY;
      ctx.beginPath(); ctx.arc(sd.x, sd.y - 26 * g, 4 + 10 * g, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(sd.x + 8 * g, sd.y - 16 * g, 3 + 6 * g, 0, Math.PI * 2); ctx.fill();
    }
  }

  var dragging = false;
  function addSeed(e) {
    if (typeof canvas.getBoundingClientRect !== 'function') return;
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    seeds.push({ x: x, y: y, born: currentT });
    if (seeds.length > 200) seeds.shift();
  }
  canvas.addEventListener('pointerdown', function (e) { dragging = true; addSeed(e); });
  canvas.addEventListener('pointermove', function (e) { if (dragging) addSeed(e); });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });

  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    var loop = function (now) {
      currentT = PHASE0 + (now - start) / 1000;
      draw(currentT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
