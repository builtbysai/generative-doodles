<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electric Light</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #141416; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): room, slab core, slab edge, halo, floor.
  var ROOM = '#141416';
  var CORE = '#FBFBF7';
  var EDGE = '#CFCFC8';
  var HALO = '#E8E8E2';
  var FLOOR = '#1A1A1C';

  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(a, b, t) {
    var A = hexRGB(a), B = hexRGB(b);
    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' +
                    Math.round(A[1] + (B[1] - A[1]) * t) + ',' +
                    Math.round(A[2] + (B[2] - A[2]) * t) + ')';
  }

  // Seeded RNG, used once to build the fixed flicker walk table.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Mains flicker: precomputed smoothed random walk, 194 samples over 97 s,
  // looped. Values in [-1, 1]. Fully deterministic; no runtime randomness.
  var WALK_N = 194, WALK_PERIOD = 97;
  var walk = (function () {
    var rng = mulberry32(7711968);
    var raw = [], v = 0, i;
    for (i = 0; i < WALK_N; i++) {
      v += (rng() - 0.5) * 0.55;
      v *= 0.94; // gentle pull back toward zero
      if (v > 1) v = 1; if (v < -1) v = -1;
      raw.push(v);
    }
    // Smooth with a wrap-around moving average so the loop closes cleanly.
    var out = [];
    for (i = 0; i < WALK_N; i++) {
      var s = 0;
      for (var k = -3; k <= 3; k++) s += raw[(i + k + WALK_N) % WALK_N];
      out.push(s / 7);
    }
    return out;
  })();
  function walkAt(t) {
    var x = (t % WALK_PERIOD) / WALK_PERIOD * WALK_N;
    var i0 = Math.floor(x) % WALK_N, i1 = (i0 + 1) % WALK_N, f = x - Math.floor(x);
    var s = f * f * (3 - 2 * f);
    return walk[i0] + (walk[i1] - walk[i0]) * s;
  }

  // Breath: 45 s ease between 0.85 and 1.0; phase 0 is mid-intensity (0.925).
  function breathAt(t) {
    return 0.925 + 0.075 * Math.sin(2 * Math.PI * t / 45);
  }

  // Drag state: vertical drag sets a brightness offset; on release it eases
  // back to zero in closed form (exponential decay from the release state).
  var drag = { active: false, startY: 0, base: 0, cur: 0, relT: 0, relVal: 0 };
  function dragOffsetAt(t) {
    if (drag.active) return drag.cur;
    if (drag.relT === 0) return 0;
    var dt = t - drag.relT;
    if (dt < 0) return drag.relVal;
    return drag.relVal * Math.exp(-dt / 1.2);
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  window.addEventListener('resize', function () { resize(); draw(lastT); });

  function isPhone() {
    var s = window.screen;
    if (s && Math.min(s.width, s.height) < 700) return true;
    return H > W * 1.15;
  }

  function intensityAt(t) {
    var v = breathAt(t) * (1 + 0.02 * walkAt(t)) + dragOffsetAt(t);
    if (v > 1) v = 1;
    if (v < 0.5) v = 0.5;
    return v;
  }

  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var inten = intensityAt(t);

    // Room and floor.
    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, W, H);
    var floorY = H * 0.865;
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, floorY, W, H - floorY);
    ctx.fillStyle = HALO;
    ctx.globalAlpha = 0.05;
    ctx.fillRect(0, floorY, W, 1);
    ctx.globalAlpha = 1;

    // Slab geometry: portrait, centered, keeps its proportion on phones.
    var portrait = H > W;
    var slabW = portrait ? W * 0.55 : W * 0.40;
    var slabH = slabW * 1.42;
    if (slabH > H * 0.78) { slabH = H * 0.78; slabW = slabH / 1.42; }
    var cx = W / 2, cy = H * 0.47;
    var x0 = cx - slabW / 2, y0 = cy - slabH / 2;

    // Halo: layered alpha ellipses bleeding onto the wall behind the slab.
    var layers = 26;
    for (var i = layers - 1; i >= 0; i--) {
      var f = i / (layers - 1); // 0 inner .. 1 outer
      var rx = slabW * (0.52 + 0.55 * f);
      var ry = slabH * (0.52 + 0.42 * f);
      ctx.fillStyle = HALO;
      ctx.globalAlpha = 0.034 * Math.pow(1 - f, 1.4) * (0.35 + 0.65 * inten);
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Slab: layered inset rects stepping edge tone to core, drawn
    // largest (edge tone) first, each next smaller and brighter.
    var steps = 9;
    for (var sIdx = 0; sIdx < steps; sIdx++) {
      var u = sIdx / (steps - 1); // 0 outer .. 1 inner
      var ix = u * slabW * 0.30, iy = u * slabH * 0.30;
      ctx.fillStyle = mix(EDGE, CORE, Math.pow(u, 1.25));
      ctx.fillRect(x0 + ix, y0 + iy, slabW - 2 * ix, slabH - 2 * iy);
    }
    // Bright heart: a few soft core ellipses so the center is hottest.
    for (var j = 3; j >= 0; j--) {
      var g = j / 3;
      ctx.fillStyle = CORE;
      ctx.globalAlpha = 0.16 * (1 - g) + 0.05;
      ctx.beginPath();
      ctx.ellipse(cx, cy, slabW * (0.16 + 0.20 * g), slabH * (0.14 + 0.18 * g), 0, 0, 2 * Math.PI);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Monofilament threads: three 1 px lines, slab top to frame top.
    ctx.fillStyle = HALO;
    ctx.globalAlpha = 0.06;
    var tx = [0.28, 0.5, 0.72];
    for (var k = 0; k < tx.length; k++) {
      ctx.fillRect(Math.round(x0 + slabW * tx[k]), 0, 1, y0);
    }
    ctx.globalAlpha = 1;

    // Overall intensity: dim the whole scene toward the room tone.
    var dim = (1 - inten) * 0.72;
    if (dim > 0.003) {
      ctx.fillStyle = ROOM;
      ctx.globalAlpha = dim;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  var lastT = 0;
  var t0 = null;
  function frame(ts) {
    if (t0 === null) t0 = ts;
    lastT = (ts - t0) / 1000;
    draw(lastT);
    window.requestAnimationFrame(frame);
  }

  // Pointer drag: vertical movement brightens (up) or dims (down).
  function nowT() { return lastT; }
  canvas.addEventListener('pointerdown', function (e) {
    drag.active = true;
    drag.startY = e.clientY;
    drag.base = dragOffsetAt(nowT());
    drag.cur = drag.base;
    drag.relT = 0;
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag.active) return;
    var off = drag.base + (drag.startY - e.clientY) / (0.55 * H);
    if (off > 0.18) off = 0.18;
    if (off < -0.30) off = -0.30;
    drag.cur = off;
    draw(nowT());
  });
  function endDrag() {
    if (!drag.active) return;
    drag.active = false;
    drag.relT = nowT();
    drag.relVal = drag.cur;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  resize();
  draw(0);
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
