<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Borrowed Voice</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e2d4; overflow: hidden; }
  canvas { display: block; background: #e8e2d4; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1413000);
  // Course harmonics (seeded phases).
  var p1 = rnd() * 6.2832, p2 = rnd() * 6.2832, p3 = rnd() * 6.2832;
  var q1 = rnd() * 6.2832, q2 = rnd() * 6.2832, q3 = rnd() * 6.2832;
  var smudges = [];
  var si;
  for (si = 0; si < 14; si++) {
    smudges.push({ x: rnd(), y: rnd(), rx: 20 + rnd() * 70, ry: 8 + rnd() * 22, a: 0.04 + rnd() * 0.05, rot: rnd() * 3.1416 });
  }

  var W = 0, H = 0, phone = false;
  function isPhone() {
    if (typeof window !== 'undefined' && window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m > 0) return m < 700;
    }
    return H > W * 1.15;
  }
  function sizeCanvas() {
    var w = W, h = H;
    if (typeof window !== 'undefined') {
      if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.width) {
        w = visualViewport.width; h = visualViewport.height;
      } else if (window.innerWidth) { w = window.innerWidth; h = window.innerHeight; }
    }
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    phone = isPhone();
  }
  sizeCanvas();
  if (typeof window !== 'undefined') {
    if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
      visualViewport.addEventListener('resize', sizeCanvas);
    }
    if (window.addEventListener) window.addEventListener('resize', sizeCanvas);
  }

  function a4(v) { return Math.round(v * 10000) / 10000; }
  function rgba(r, g, b, a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')'; }

  var CYCLE = 36;      // seconds per full loop of the leader course
  var LAG = 2.5;       // follower time lag in seconds
  var TRAIL = 10;      // seconds of trail drawn

  // Closed parametric course, u in [0,1).
  function course(u) {
    u = ((u % 1) + 1) % 1;
    var t = u * 6.2832;
    var x = 0.5 + 0.30 * Math.sin(t + p1) + 0.10 * Math.sin(2 * t + p2) + 0.05 * Math.sin(3 * t + p3);
    var y = 0.5 + 0.27 * Math.sin(t + q1) + 0.09 * Math.cos(2 * t + q2) + 0.04 * Math.sin(3 * t + q3);
    return { x: 0.08 * W + x * 0.84 * W, y: 0.10 * H + y * 0.72 * H };
  }
  function courseAtTime(t) { return course(t / CYCLE); }

  // ---- Drag state (recorded events; everything closed-form over them) ----
  var drag = null; // {samples:[{t,x,y}], releaseT, releaseOff:{x,y}, active}
  var lastT = 0;
  function dragOffsetAt(t) {
    if (!drag) return { x: 0, y: 0 };
    var s = drag.samples;
    if (t < s[0].t) return { x: 0, y: 0 };
    if (drag.active) {
      // Interpolate between recorded pointer samples.
      var i;
      for (i = 0; i < s.length - 1; i++) {
        if (t >= s[i].t && t <= s[i + 1].t) {
          var f = (s[i + 1].t - s[i].t) > 0 ? (t - s[i].t) / (s[i + 1].t - s[i].t) : 0;
          return { x: s[i].x + (s[i + 1].x - s[i].x) * f - courseAtTime(t).x,
                   y: s[i].y + (s[i + 1].y - s[i].y) * f - courseAtTime(t).y };
        }
      }
      var last = s[s.length - 1];
      return { x: last.x - courseAtTime(t).x, y: last.y - courseAtTime(t).y };
    }
    if (t <= drag.releaseT) {
      var last2 = s[s.length - 1];
      return { x: last2.x - courseAtTime(t).x, y: last2.y - courseAtTime(t).y };
    }
    var d = Math.exp(-(t - drag.releaseT) / 4);
    return { x: drag.releaseOff.x * d, y: drag.releaseOff.y * d };
  }
  function errorBoostAt(t) {
    if (!drag) return 1;
    if (drag.active) return 3;
    if (t < drag.releaseT) return 3;
    return 1 + 2.5 * Math.exp(-(t - drag.releaseT) / 2.5);
  }
  function addPt(p, dx, dy) { return { x: p.x + dx, y: p.y + dy }; }

  function leaderAt(t) { return addPt(courseAtTime(t), dragOffsetAt(t).x, dragOffsetAt(t).y); }
  function followerBaseAt(t) {
    var ts = t - LAG;
    var o = dragOffsetAt(ts);
    return addPt(courseAtTime(ts), o.x, o.y);
  }
  function followerAt(t) {
    var ts = t - LAG;
    var base = followerBaseAt(t);
    // Tangent / normal from the course at the source time.
    var e = 0.05;
    var pa = courseAtTime(ts - e), pb = courseAtTime(ts + e);
    var tx = pb.x - pa.x, ty = pb.y - pa.y;
    var tl = Math.sqrt(tx * tx + ty * ty) || 1;
    tx /= tl; ty /= tl;
    var nx = -ty, ny = tx;
    // Corner overshoot: curvature proxy from the angle between neighbouring tangents.
    var pa2 = courseAtTime(ts - 2 * e), pb2 = courseAtTime(ts + 2 * e);
    var t1x = pa.x - pa2.x, t1y = pa.y - pa2.y, t2x = pb2.x - pb.x, t2y = pb2.y - pb.y;
    var l1 = Math.sqrt(t1x * t1x + t1y * t1y) || 1, l2 = Math.sqrt(t2x * t2x + t2y * t2y) || 1;
    var dot = (t1x * t2x + t1y * t2y) / (l1 * l2);
    if (dot > 1) dot = 1; if (dot < -1) dot = -1;
    var bend = Math.acos(dot); // 0 on straights, large at corners
    var boost = errorBoostAt(t);
    var wob = (6 + 10 * bend) * boost * Math.sin(ts * 5.6 + 1.3);
    var over = 26 * bend * bend * boost;
    return { x: base.x + nx * wob + tx * over, y: base.y + ny * wob + ty * over };
  }
  function dropSeg(idx) {
    // Deterministic per-segment hash: ~15% of follower segments are dropped.
    var h = Math.sin(idx * 12.9898) * 43758.5453;
    return (h - Math.floor(h)) < 0.15;
  }

  function drawDot(x, y, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function drawTrail(fn, isFollower) {
    var step = 0.1, t0 = lastT - TRAIL;
    var prev = null, prevIdx = -1;
    var k;
    for (k = 0; k <= TRAIL / step; k++) {
      var tt = t0 + k * step;
      var pt = fn(tt);
      var age = lastT - tt;
      var al = 0.85 * (1 - age / TRAIL);
      if (al < 0.02) al = 0.02;
      if (prev) {
        if (isFollower && dropSeg(Math.floor(tt / 0.25))) { prev = null; prevIdx = -1; continue; }
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(pt.x, pt.y);
        ctx.strokeStyle = isFollower ? rgba(176, 30, 36, al) : rgba(26, 26, 24, al);
        ctx.lineWidth = isFollower ? 2 : 2.5;
        ctx.stroke();
      }
      prev = pt; prevIdx = k;
    }
  }

  function draw(t) {
    lastT = t;
    ctx.fillStyle = '#e8e2d4';
    ctx.fillRect(0, 0, W, H);
    // Smudges (flat alpha, each ellipse on its own path).
    var i;
    for (i = 0; i < smudges.length; i++) {
      var s = smudges[i];
      ctx.beginPath();
      ctx.ellipse(s.x * W, s.y * H, s.rx, s.ry, s.rot, 0, 6.2832);
      ctx.fillStyle = rgba(74, 74, 68, s.a);
      ctx.fill();
    }
    // Faint full course ghost so the looping course reads.
    ctx.beginPath();
    var g;
    for (g = 0; g <= 120; g++) {
      var gp = course(g / 120);
      if (g === 0) ctx.moveTo(gp.x, gp.y); else ctx.lineTo(gp.x, gp.y);
    }
    ctx.strokeStyle = rgba(138, 143, 148, 0.10);
    ctx.lineWidth = 1;
    ctx.stroke();
    // Trails.
    drawTrail(leaderAt, false);
    drawTrail(followerAt, true);
    // Ghost line between the two hands.
    var lp = leaderAt(t), fp = followerAt(t);
    ctx.beginPath();
    ctx.moveTo(lp.x, lp.y);
    ctx.lineTo(fp.x, fp.y);
    ctx.strokeStyle = rgba(138, 143, 148, 0.45);
    ctx.lineWidth = 1;
    ctx.stroke();
    // Hands: leader (ink with gold rim), follower (red).
    drawDot(lp.x, lp.y, 10, '#d4a24e');
    drawDot(lp.x, lp.y, 7, '#1a1a18');
    drawDot(fp.x, fp.y, 8, '#b01e24');
    // Lag gauge (gap gauge, not text): bottom-left track + gold fill = current gap.
    var gap = Math.sqrt((lp.x - fp.x) * (lp.x - fp.x) + (lp.y - fp.y) * (lp.y - fp.y));
    var maxGap = 0.30 * Math.min(W, H);
    var gw = Math.max(60, 0.20 * W), gh = 10;
    var gx = 0.06 * W, gy = H - 0.07 * H;
    ctx.beginPath();
    ctx.rect(gx, gy, gw, gh);
    ctx.strokeStyle = '#8a8f94';
    ctx.lineWidth = 1;
    ctx.stroke();
    var fw = gw * Math.min(1, gap / maxGap);
    ctx.fillStyle = '#d4a24e';
    ctx.fillRect(gx, gy, fw, gh);
    drawDot(gx + fw, gy + gh / 2, 3, '#1a1a18');
    drawDot(gx + fw, gy + gh / 2, 2, '#b01e24');
    // Pin canvas size in draw (phone house rule).
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // Pointer: drag the leader's hand to re-route the course.
  function evPos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }
  function onDown(e) {
    var p = evPos(e);
    var lp = leaderAt(lastT);
    var d = Math.sqrt((p.x - lp.x) * (p.x - lp.x) + (p.y - lp.y) * (p.y - lp.y));
    if (d <= 44) {
      drag = { samples: [{ t: lastT, x: p.x, y: p.y }], releaseT: 0, releaseOff: { x: 0, y: 0 }, active: true };
    }
  }
  function onMove(e) {
    if (!drag || !drag.active) return;
    var p = evPos(e);
    drag.samples.push({ t: lastT, x: p.x, y: p.y });
  }
  function onUp(e) {
    if (!drag || !drag.active) return;
    var p = evPos(e);
    drag.samples.push({ t: lastT, x: p.x, y: p.y });
    drag.active = false;
    drag.releaseT = lastT;
    var o = dragOffsetAt(lastT);
    drag.releaseOff = o;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
  }

  // Deterministic first frame, then the rAF loop owns the clock.
  draw(0);
  var clockStart = null;
  function loop(ts) {
    if (clockStart === null) clockStart = ts;
    draw((ts - clockStart) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
