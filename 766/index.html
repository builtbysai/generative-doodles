<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas on a Puddle</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #3A3D40;
    overflow: hidden;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Strict palette. Nothing else is ever drawn.
  var BASE    = [30, 34, 38];     // #1E2226 film dark base
  var VIOLET  = [122, 111, 168];  // #7A6FA8 interference violet
  var GOLD    = [216, 180, 106];  // #D8B46A gas gold
  var TEAL    = [95, 168, 163];   // #5FA8A3 teal
  var MAGENTA = [168, 111, 142];  // #A86F8E magenta shift
  var ASPHALT = [58, 61, 64];     // #3A3D40 background

  var BREATH_PERIOD = 40;         // seconds, slow spread and contract cycle
  var RIPPLE_LIFE = 8;            // seconds for a touch ripple to settle

  function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }
  function rgba(c, a) {
    return 'rgba(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ',' + a + ')';
  }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function mix(c1, c2, u) {
    return [lerp(c1[0], c2[0], u), lerp(c1[1], c2[1], u), lerp(c1[2], c2[2], u)];
  }

  // Seeded RNG (mulberry32). All blob geometry comes from this stream,
  // precomputed once; nothing at draw time is random.
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var z = s;
      z = Math.imul(z ^ (z >>> 15), z | 1);
      z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
      return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Blob shape ---------------------------------------------------------
  // Five seeded control harmonics stand in for the metaball control points:
  // a polar radius function R(theta) = 1 + sum a_k sin(k theta + p_k), with
  // slow phase drift per harmonic so the stain's edge wanders organically.
  // Amplitudes sum to about 0.30, so the outline stays a single blobby loop,
  // never a star.
  var rng = mulberry32(7661979);
  var HARMONICS = [];
  (function () {
    var ks = [2, 3, 4, 5, 6];
    var amps = [0.11, 0.085, 0.06, 0.038, 0.022];
    for (var i = 0; i < ks.length; i++) {
      HARMONICS.push({
        k: ks[i],
        a: amps[i] * (0.8 + rng() * 0.45),
        p: rng() * Math.PI * 2,
        drift: (rng() - 0.5) * 0.05   // radians per second, very slow
      });
    }
  })();

  function shapeAt(theta, t) {
    var s = 1;
    for (var i = 0; i < HARMONICS.length; i++) {
      var h = HARMONICS[i];
      s += h.a * Math.sin(h.k * theta + h.p + h.drift * t);
    }
    return s;
  }

  // ---- Interference LUT ---------------------------------------------------
  // Narrow-band thin-film cycle: dark base, violet, gold, teal, one magenta
  // passage, violet again, back to dark. Bands are thin slices of this cycle.
  var LUT = [
    { u: 0.00, c: BASE },
    { u: 0.16, c: VIOLET },
    { u: 0.34, c: GOLD },
    { u: 0.50, c: TEAL },
    { u: 0.64, c: MAGENTA },
    { u: 0.78, c: VIOLET },
    { u: 1.00, c: BASE }
  ];
  function lutColor(u) {
    u = u - Math.floor(u);
    for (var i = 0; i < LUT.length - 1; i++) {
      var a = LUT[i], b = LUT[i + 1];
      if (u >= a.u && u <= b.u) {
        return mix(a.c, b.c, (u - a.u) / (b.u - a.u));
      }
    }
    return BASE;
  }

  // ---- Visitor events -----------------------------------------------------
  // Everything interactive is a recorded event; the frame at time t is a
  // closed-form function of this list plus t. Frame one (empty list, t = 0)
  // is therefore identical on every load and in the QA renderer.
  var ripples = [];        // {x, y, t0} in CSS pixels
  var dragTrail = [];      // {x, y, t} samples while dragging
  var dragging = false;

  function nowSec() {
    return (typeof performance !== 'undefined' && performance.now)
      ? performance.now() / 1000 : 0;
  }
  var T0 = nowSec();

  function elapsed() { return nowSec() - T0; }

  // Ripple displacement at point (x, y) and time t: each tap sends a ring
  // wave outward that decays over RIPPLE_LIFE seconds. Displacing ring radii
  // by this field is what scatters the band pattern locally.
  function rippleDisp(x, y, t, scale) {
    var d = 0;
    for (var i = 0; i < ripples.length; i++) {
      var r = ripples[i];
      var age = t - r.t0;
      if (age < 0 || age > RIPPLE_LIFE) continue;
      var dx = x - r.x, dy = y - r.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var front = age * scale * 0.55;                    // wavefront speed
      var env = Math.exp(-age / 2.6) *
                Math.exp(-Math.abs(dist - front) / (scale * 0.16));
      d += Math.sin((dist - front) * 0.11) * env;
    }
    return d * scale * 0.045;
  }

  // Drag smear: the blob's centre leans toward the recent drag trail,
  // weighted toward the freshest samples, and relaxes when the drag ends.
  function smearAt(t) {
    var sx = 0, sy = 0, wsum = 0;
    for (var i = 0; i < dragTrail.length; i++) {
      var s = dragTrail[i];
      var age = t - s.t;
      if (age < 0 || age > 2.5) continue;
      var w = Math.exp(-age / 0.8);
      sx += s.x * w; sy += s.y * w; wsum += w;
    }
    if (wsum <= 0) return null;
    return { x: sx / wsum, y: sy / wsum, w: Math.min(1, wsum) };
  }

  // ---- Layout -------------------------------------------------------------
  var W = 0, H = 0, isPhone = false;

  function fit() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) || null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    var minScreen = sw ? Math.min(sw.width, sw.height) : Math.min(W, H);
    isPhone = (minScreen < 700) || (H > W * 1.15);
  }

  // ---- Drawing ------------------------------------------------------------
  var SEG = 144;      // angular samples per ring
  var RINGS = 120;    // concentric band slices

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = rgba(ASPHALT, 1);
    ctx.fillRect(0, 0, W, H);

    var minDim = Math.min(W, H);
    var cx = W / 2, cy = H / 2;

    // Drag smear leans the centre a little toward the trail (never far:
    // the stain is disturbed, not chased).
    var sm = smearAt(t);
    if (sm) {
      cx += (sm.x - cx) * 0.10 * sm.w;
      cy += (sm.y - cy) * 0.10 * sm.w;
    }

    // Breath: radius swells and settles on a 40 s closed-form cycle.
    // Phase 0 is the mid-radius point of the cycle.
    var breath = Math.sin((t / BREATH_PERIOD) * Math.PI * 2);
    var R0 = minDim * 0.30 * (1 + 0.085 * breath);

    // Band phase: tied to the breath so the rings ripple inward while the
    // film spreads and drift back as it contracts, plus a slow steady creep.
    var phase = breath * 1.9 - t * 0.045;

    function blobPoint(theta, frac) {
      var r = frac * R0 * shapeAt(theta, t);
      var x = cx + Math.cos(theta) * r;
      var y = cy + Math.sin(theta) * r;
      return { x: x, y: y, r: r };
    }

    function blobPath(frac) {
      ctx.beginPath();
      for (var j = 0; j <= SEG; j++) {
        var th = (j / SEG) * Math.PI * 2;
        var p = blobPoint(th, frac);
        if (j === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
    }

    // Soft edge: a few concentric shells of the dark base at falling alpha,
    // then the solid base fill.
    blobPath(1.045); ctx.fillStyle = rgba(BASE, 0.10); ctx.fill();
    blobPath(1.022); ctx.fillStyle = rgba(BASE, 0.22); ctx.fill();
    blobPath(1.000); ctx.fillStyle = rgba(BASE, 1); ctx.fill();

    // Thin-film bands: concentric rings following the blob outline. Each
    // ring's colour comes from sin(distance * k + phase) run through the
    // narrow LUT; alpha rides the same sine so bands crest bright and sink
    // soft into the dark base instead of ending in hard lines.
    var ringStep = R0 / RINGS;
    ctx.lineWidth = ringStep * 1.7;
    for (var i = 1; i <= RINGS; i++) {
      var f = i / RINGS;
      var s = Math.sin(f * Math.PI * 2 * 9 + phase);
      var col = lutColor(f * 9 * 0.5 + phase / (Math.PI * 2) + 0.02 * s);
      var edgeFade = 1 - Math.pow(Math.max(0, f - 0.86) / 0.14, 2);
      var alpha = (0.16 + 0.84 * Math.pow(0.5 + 0.5 * s, 1.6)) * edgeFade;
      if (alpha <= 0.01) continue;
      ctx.beginPath();
      for (var j = 0; j <= SEG; j++) {
        var th2 = (j / SEG) * Math.PI * 2;
        var p2 = blobPoint(th2, f);
        var rd = rippleDisp(p2.x, p2.y, t, minDim);
        var rr = Math.max(0, p2.r + rd);
        var x2 = cx + Math.cos(th2) * rr;
        var y2 = cy + Math.sin(th2) * rr;
        if (j === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
      }
      ctx.closePath();
      ctx.strokeStyle = rgba(col, alpha);
      ctx.stroke();
    }

    // Centre cap so the innermost rings resolve into the dark base.
    blobPath(0.012);
    ctx.fillStyle = rgba(BASE, 0.9);
    ctx.fill();
  }

  // ---- Wiring ---------------------------------------------------------------
  fit();
  draw(0);

  if (typeof window !== 'undefined' && window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(elapsed()); });
  }
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', function () { fit(); draw(elapsed()); });
  }

  function evtPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var src = (e.touches && e.touches[0]) || e;
    return { x: src.clientX - r.left, y: src.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', function (e) {
    var p = evtPos(e);
    var t = elapsed();
    ripples.push({ x: p.x, y: p.y, t0: t });
    dragTrail.push({ x: p.x, y: p.y, t: t });
    dragging = true;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = evtPos(e);
    dragTrail.push({ x: p.x, y: p.y, t: elapsed() });
    if (dragTrail.length > 240) dragTrail.splice(0, dragTrail.length - 240);
  });
  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', endDrag);

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(elapsed());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
