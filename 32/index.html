<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№32 · Sixteen Trees</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// No32 Sixteen Trees (after ruuddotorg, via Bug's ig-artist-study prompts).
// Four dots have exactly 16 spanning trees (Cayley: 4^(4-2)). This
// piece generates all of them at load from Pruefer sequences of
// length 2 over 4 nodes, which map one to one onto the trees, and
// asserts the count: 16 trees, 3 edges each, all acyclic. One tree
// fills the frame; the 3 edges draw in sequence, pen on paper, then
// the next tree takes its place. Dots sit in diamond positions (two
// filled, two open). Drag horizontally to scrub the sequence;
// release and it resumes after 4 idle seconds. No labels, no borders,
// no click-to-reload.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '32', 10) || 32;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f4f1ea';
const INK = '#1a1a1a';

// Pruefer sequences of length 2 over nodes 0..3 -> 16 spanning trees.
function allTrees() {
  const trees = [];
  for (let a = 0; a < 4; a++) {
    for (let b = 0; b < 4; b++) {
      const seq = [a, b];
      const deg = [1, 1, 1, 1];
      for (const s of seq) deg[s]++;
      const d = deg.slice();
      const edges = [];
      const remaining = seq.slice();
      for (let k = 0; k < 2; k++) {
        let leaf = 0;
        while (d[leaf] !== 1) leaf++;
        edges.push([leaf, remaining[0]]);
        d[leaf]--;
        d[remaining[0]]--;
        remaining.shift();
      }
      let l1 = 0; while (d[l1] !== 1) l1++;
      let l2 = l1 + 1; while (d[l2] !== 1) l2++;
      edges.push([l1, l2]);
      trees.push(edges);
    }
  }
  return trees;
}
const TREES = allTrees();
const SWEEP_PER = 1.6;   // seconds per panel (3 edges at ~300ms + settle)

let scrub = 0;
let dragInfo = null;      // {x, startSweep, sweepPos}
let holdPos = null;       // sweep position held after release
let holdUntil = 0;        // performance seconds

function layout(w, h) {
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  return { RX, RY, ox: (w - RX) / 2, oy: (h - RY) / 2 };
}

// dot positions inside a panel, unit box: diamond, nodes 0..3
const DOTS = [[0.5, 0.12], [0.88, 0.5], [0.5, 0.88], [0.12, 0.5]];
const FILLED = [true, false, true, false];

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const { RX, RY, ox, oy } = layout(w, h);
  const te = nowMs / 1000 + scrub;
  let sweepPos;
  if (dragInfo) sweepPos = dragInfo.sweepPos;
  else if (holdPos != null && performance.now() / 1000 < holdUntil) sweepPos = holdPos;
  else sweepPos = (te / SWEEP_PER) % 16;
  const active = Math.floor(sweepPos);
  const activePhase = sweepPos - active;

  // single tree, large and centered
  const size = Math.min(RX, RY) * 0.72;
  const px = ox + (RX - size) / 2, py = oy + (RY - size) / 2;
  const pts = DOTS.map(([ux, uy]) => [px + ux * size, py + uy * size]);
  const dotR = size * 0.055;

  ctx.lineWidth = Math.max(1, size * 0.012);
  TREES[active].forEach(([a, b], ei) => {
    const edgePhase = activePhase * 1.25;
    const frac = Math.max(0, Math.min(1, edgePhase * 3 - ei * 0.9));
    const alpha = 0.55 + 0.45 * Math.min(1, frac + 0.3);
    if (frac <= 0) return;
    ctx.strokeStyle = 'rgba(26,26,26,' + alpha.toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(pts[a][0], pts[a][1]);
    ctx.lineTo(pts[a][0] + (pts[b][0] - pts[a][0]) * frac, pts[a][1] + (pts[b][1] - pts[a][1]) * frac);
    ctx.stroke();
  });
  pts.forEach(([x, y], di) => {
    ctx.beginPath();
    ctx.arc(x, y, dotR, 0, Math.PI * 2);
    if (FILLED[di]) { ctx.fillStyle = INK; ctx.fill(); }
    else { ctx.fillStyle = GROUND; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, dotR * 0.28); ctx.stroke(); }
  });
  return { RX, ox };
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(2500);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function pointerX(ev) {
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0 };
  return ev.clientX - r.left;
}
function currentSweep() {
  if (dragInfo) return dragInfo.sweepPos;
  return ((performance.now() / 1000 + scrub) / SWEEP_PER) % 16;
}
canvas.addEventListener('pointerdown', ev => {
  dragInfo = { x: pointerX(ev), startSweep: currentSweep(), sweepPos: currentSweep() };
  holdPos = null;
});
canvas.addEventListener('pointermove', ev => {
  if (!dragInfo) return;
  const [w, h] = viewportWH();
  const L = layout(w, h);
  const dx = pointerX(ev) - dragInfo.x;
  dragInfo.sweepPos = (((dragInfo.startSweep + (dx / L.RX) * 16) % 16) + 16) % 16;
});
function endDrag() {
  if (!dragInfo) return;
  // resume the clock from the scrubbed position after 4 idle seconds
  holdPos = dragInfo.sweepPos;
  holdUntil = performance.now() / 1000 + 4;
  scrub = dragInfo.sweepPos * SWEEP_PER - performance.now() / 1000;
  dragInfo = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
