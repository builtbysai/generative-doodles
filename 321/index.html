<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.321 Scallop Field</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#E8DCC3; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.321 Scallop Field (meohmy_graphics).
// A full field of scalloped cells on sand, 8 columns by 6 rows,
// exactly 48 cells, exactly one motif per cell. Gingko fans and
// tiny 6-petal daisies alternate in a strict checkerboard. A slow
// wave of cell rotation passes diagonally as a traveling phase
// bump over a 30s seamless loop: each cell rises to 180 degrees
// at the peak of the bump and returns to 0 behind it, so the
// frame at 30s is identical to frame 0. Tap a cell to flip its
// base orientation by 180 degrees with a soft settle; the wave
// adds on top of the base, so tapped orientations survive the
// wave. All marks are data drawn each frame on one canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var TAN = '#C8963E', PALM = '#3E6B4F', TERRA = '#B4552D', SAND = '#E8DCC3', TEAL = '#1E4D4A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30;
var T = 13.0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }

// ---- field: exactly 48 cells, exactly 1 motif per cell --------
var COLS = 8, ROWS = 6;
var CELLS = [];
(function () {
  var r = rng(32101);
  var cw = DW / COLS, ch = DH / ROWS;
  for (var row = 0; row < ROWS; row++) {
    for (var col = 0; col < COLS; col++) {
      var isFan = ((col + row) % 2 === 0);
      CELLS.push({
        col: col, row: row,
        x: col * cw + cw / 2, y: row * ch + ch / 2,
        w: cw, h: ch,
        diag: (col + row) / (COLS - 1 + ROWS - 1),
        motif: isFan ? 'fan' : 'daisy',
        motifs: 1,
        scale: 0.92 + r() * 0.14,
        wob: r() * Math.PI * 2,
        baseState: 0,
        baseFrom: 0, baseTo: 0, flipT0: -10
      });
    }
  }
})();
if (CELLS.length !== 48) throw new Error('Scallop Field needs exactly 48 cells');
(function () {
  var fans = 0, daisies = 0, totalMotifs = 0, i;
  for (i = 0; i < CELLS.length; i++) {
    if (CELLS[i].motifs !== 1) throw new Error('Scallop Field needs exactly 1 motif per cell');
    totalMotifs += CELLS[i].motifs;
    if (CELLS[i].motif === 'fan') fans++; else if (CELLS[i].motif === 'daisy') daisies++; else throw new Error('unknown motif');
  }
  if (totalMotifs !== 48 || fans !== 24 || daisies !== 24) throw new Error('Scallop Field motif count mismatch');
})();

function waveAngle(cell, t) {
  var phase = (t % LOOP) / LOOP;
  var centre = -0.35 + 1.7 * phase;
  var d = cell.diag - centre;
  var width = 0.30;
  if (Math.abs(d) >= width) return 0;
  var bump = 0.5 + 0.5 * Math.cos(Math.PI * d / width);
  bump = bump * bump * (3 - 2 * bump);
  return 180 * bump;
}
function baseAngle(cell, t) {
  var p = (t - cell.flipT0) / 0.6;
  if (p >= 1) return cell.baseTo;
  if (p <= 0) return cell.baseFrom;
  var e = 1 - Math.pow(1 - p, 3);
  e = e * (0.94 + 0.06 * Math.sin(p * Math.PI));
  return cell.baseFrom + (cell.baseTo - cell.baseFrom) * e;
}

// Scalloped disc: a tile whose edge is two overlapping circle
// arcs repeated around the rim, drawn as sampled polar data.
function scallopPath(R, bumps, amp) {
  var i, steps = 96, a, rr, x, y;
  ctx.beginPath();
  for (i = 0; i <= steps; i++) {
    a = i / steps * Math.PI * 2;
    rr = R + amp * Math.cos(bumps * a);
    x = Math.cos(a) * rr; y = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawFan(scale) {
  // Gingko fan: two lobes fanning from one stem base, with a
  // notch at the top centre and veins radiating from the base.
  var R = 40 * scale, bx = 0, by = 20 * scale;
  var i, a, x, y;
  ctx.fillStyle = TAN;
  ctx.beginPath();
  ctx.moveTo(bx, by);
  for (i = 0; i <= 12; i++) {
    a = Math.PI * (1.06 + 0.44 * (i / 12));
    x = bx + Math.cos(a) * R; y = by + Math.sin(a) * R;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(bx, by - R * 0.50);
  for (i = 0; i <= 12; i++) {
    a = Math.PI * (1.50 + 0.44 * (i / 12));
    x = bx + Math.cos(a) * R; y = by + Math.sin(a) * R;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  st(TEAL, 2.4);
  for (i = 0; i < 7; i++) {
    a = Math.PI * (1.12 + 0.76 * (i / 6));
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.cos(a) * R * 0.86, by + Math.sin(a) * R * 0.86);
    ctx.stroke();
  }
  st(TEAL, 3.2);
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by + 22 * scale); ctx.stroke();
}
function drawDaisy(scale) {
  // Tiny daisy: exactly 6 petals around a filled centre.
  var k, a;
  ctx.fillStyle = SAND;
  for (k = 0; k < 6; k++) {
    a = k / 6 * Math.PI * 2 - Math.PI / 2;
    var px = Math.cos(a) * 21 * scale, py = Math.sin(a) * 21 * scale;
    ctx.save();
    ctx.translate(px, py); ctx.rotate(a);
    ctx.beginPath();
    ctx.ellipse(0, 0, 15 * scale, 8.2 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = TAN; circ(0, 0, 9.5 * scale, true);
  ctx.fillStyle = TEAL; circ(0, 0, 4.2 * scale, true);
}

function draw() {
  ctx.fillStyle = SAND;
  ctx.fillRect(0, 0, DW, DH);
  var i, cell, total, isFan;
  for (i = 0; i < CELLS.length; i++) {
    cell = CELLS[i];
    isFan = cell.motif === 'fan';
    total = baseAngle(cell, T) + waveAngle(cell, T);
    ctx.save();
    ctx.translate(cell.x, cell.y);
    ctx.rotate(total * Math.PI / 180);
    ctx.scale(cell.scale, cell.scale);
    // Deep teal shadow tile, offset down and right.
    ctx.save();
    ctx.translate(4, 5);
    ctx.fillStyle = TEAL;
    scallopPath(66, 12, 5); ctx.fill();
    ctx.restore();
    // Main scallop tile.
    ctx.fillStyle = isFan ? PALM : TERRA;
    scallopPath(66, 12, 5); ctx.fill();
    // Inner ring line in a contrasting palette colour.
    st(isFan ? TERRA : PALM, 2.2);
    scallopPath(56, 12, 4); ctx.stroke();
    if (isFan) drawFan(1); else drawDaisy(1);
    ctx.restore();
  }
}

// ---- interaction: tap a cell to flip its base orientation -----
var tap = null;
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  tap = { x: p[0], y: p[1], sx: p[0], sy: p[1], moved: 0 };
});
canvas.addEventListener('pointermove', function (e) {
  if (!tap) return;
  var p = toDesign(e);
  tap.moved = Math.max(tap.moved, Math.abs(p[0] - tap.sx), Math.abs(p[1] - tap.sy));
});
canvas.addEventListener('pointerup', function (e) {
  if (tap && tap.moved < 9) {
    var p = toDesign(e);
    var col = Math.floor(p[0] / (DW / COLS));
    var row = Math.floor(p[1] / (DH / ROWS));
    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
      var cell = CELLS[row * COLS + col];
      cell.baseFrom = baseAngle(cell, T);
      cell.baseState = cell.baseState === 0 ? 1 : 0;
      cell.baseTo = cell.baseFrom + 180;
      cell.flipT0 = T;
    }
  }
  tap = null;
});
canvas.addEventListener('pointercancel', function () { tap = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = SAND;
  ctx.fillRect(0, 0, W, H);
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
