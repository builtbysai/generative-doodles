<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disremembered</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E0D0C; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var WALL = '#0E0D0C';
  var SILK = '#B8A88A';
  var NEEDLE = '#1F1F1F';
  var GLINT = '#F2EFE8';
  var NAIL = '#3A3A3A';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32). No Math.random anywhere.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var epoch = 0;
  var BASE_SEED = 70285;

  // Garment-local data, all in normalized coordinates so resize is free.
  // v: 0 at neck, 1 at hem. u: -1..1 across the width profile at that v.
  var threads = [];   // {v, sag, alpha}
  var needles = [];   // {u, v, ang, len}
  var glints = [];    // {idx, start, dur} over SCHEDULE_PERIOD seconds
  var SCHEDULE_PERIOD = 90;
  var SWAY_PERIOD = 9;

  // Width profile: half-width fraction of the garment at depth v.
  function halfW(v) {
    if (v < 0.055) {
      var k = v / 0.055;
      return 0.10 + 0.90 * k * k * (3 - 2 * k); // neck to shoulder slope
    }
    return 1.0 - 0.045 * (v - 0.055); // near-straight body, slight taper
  }

  function buildLayout() {
    var rng = mulberry32(BASE_SEED + epoch * 7919);

    // Silk threads: 90-120 horizontal lines.
    threads = [];
    var nThreads = 104 + Math.floor(rng() * 14);
    for (var i = 0; i < nThreads; i++) {
      var v = 0.045 + (i / (nThreads - 1)) * 0.945;
      threads.push({
        v: v,
        sag: 0.4 + rng() * 0.9,
        alpha: 0.34 + rng() * 0.26
      });
    }

    // Needle clusters: a few dense patches, seeded centers with falloff.
    var nClusters = 6 + Math.floor(rng() * 3);
    var clusters = [];
    for (var ci = 0; ci < nClusters; ci++) {
      clusters.push({
        u: (rng() * 2 - 1) * 0.68,
        v: 0.14 + rng() * 0.74,
        r: 0.07 + rng() * 0.13,
        w: 0.6 + rng() * 0.9
      });
    }
    var totalW = 0;
    for (var cw = 0; cw < clusters.length; cw++) totalW += clusters[cw].w;

    needles = [];
    var N_NEEDLES = 2500;
    for (var n = 0; n < N_NEEDLES; n++) {
      var u, v;
      if (rng() < 0.72) {
        // Clustered: pick a cluster by weight, sample with soft falloff.
        var pick = rng() * totalW, cl = clusters[0];
        for (var k = 0; k < clusters.length; k++) {
          pick -= clusters[k].w;
          if (pick <= 0) { cl = clusters[k]; break; }
        }
        var placed = false;
        for (var tries = 0; tries < 8 && !placed; tries++) {
          var gu = (rng() + rng() + rng() - 1.5) / 1.5;
          var gv = (rng() + rng() + rng() - 1.5) / 1.5;
          u = cl.u + gu * cl.r * 2.4;
          v = cl.v + gv * cl.r * 2.4;
          if (u >= -0.96 && u <= 0.96 && v >= 0.05 && v <= 0.985) placed = true;
        }
        if (!placed) { u = cl.u; v = cl.v; }
      } else {
        // Sparse scatter across the whole garment.
        u = (rng() * 2 - 1) * 0.95;
        v = 0.05 + rng() * 0.935;
      }
      needles.push({
        u: u,
        v: v,
        ang: rng() * Math.PI * 2,
        len: 3 + rng() * 2
      });
    }

    // Glint schedule: a pure function of the epoch seed. A few events per
    // second, acceptance weighted by sway speed |cos(2*pi*t/9)| so glints
    // gather while the garment is actually moving. First event starts
    // after t=0.4 so frame one is dark.
    glints = [];
    var t = 0.4;
    while (t < SCHEDULE_PERIOD) {
      t += 0.12 + rng() * 0.55;
      var speed = Math.abs(Math.cos((2 * Math.PI * t) / SWAY_PERIOD));
      var p = 0.30 + 0.70 * speed;
      if (rng() < p) {
        glints.push({
          idx: Math.floor(rng() * needles.length),
          start: t,
          dur: 0.10 + rng() * 0.06
        });
      }
    }
  }

  function isPhone(w, h) {
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  function viewSize() {
    var vv = window.visualViewport;
    var w = vv && vv.width ? vv.width : (window.innerWidth || 0);
    var h = vv && vv.height ? vv.height : (window.innerHeight || 0);
    return { w: Math.round(w), h: Math.round(h) };
  }

  function draw(t) {
    var size = viewSize();
    var w = size.w, h = size.h;
    if (w <= 0 || h <= 0) return;
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    var phone = isPhone(w, h);
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, w, h);

    // Geometry.
    var nailX = w / 2;
    var nailY = Math.round(h * 0.09);
    var gH = h * 0.55;                                  // garment height
    var gW = Math.min(gH * 0.66, w * (phone ? 0.78 : 0.6));
    var s = Math.max(0.7, Math.min(1.3, Math.min(w, h) / 700)); // needle scale
    var topY = nailY + gH * 0.035;                      // neck just below nail

    function pt(u, v) {
      return {
        x: nailX + u * halfW(v) * (gW / 2),
        y: topY + v * gH
      };
    }

    // Sway: whole garment group rotates about the nail, heavy and small.
    var ang = (1.5 * Math.PI / 180) * Math.sin((2 * Math.PI * t) / SWAY_PERIOD);
    ctx.save();
    ctx.translate(nailX, nailY);
    ctx.rotate(ang);
    ctx.translate(-nailX, -nailY);

    // Faint body of the cloth so the needles sit in a pale field.
    ctx.beginPath();
    var steps = 24, i, p;
    p = pt(-1, 0.02); ctx.moveTo(nailX, topY - 2);
    for (i = 0; i <= steps; i++) { p = pt(1, 0.02 + (i / steps) * 0.98); ctx.lineTo(p.x, p.y); }
    for (i = steps; i >= 0; i--) { p = pt(-1, 0.02 + (i / steps) * 0.98); ctx.lineTo(p.x, p.y); }
    ctx.closePath();
    ctx.fillStyle = SILK;
    ctx.globalAlpha = 0.10;
    ctx.fill();
    ctx.globalAlpha = 1;

    // Silk threads: simple horizontal lines with a slight sag.
    ctx.strokeStyle = SILK;
    ctx.lineWidth = 1;
    for (i = 0; i < threads.length; i++) {
      var th = threads[i];
      var a = pt(-1, th.v), b = pt(1, th.v);
      ctx.globalAlpha = th.alpha;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(nailX, a.y + th.sag * s + gH * 0.004, b.x, b.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Needles: short blackened dashes.
    ctx.strokeStyle = NEEDLE;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.92;
    ctx.beginPath();
    for (i = 0; i < needles.length; i++) {
      var nd = needles[i];
      var c = pt(nd.u, nd.v);
      var dx = Math.cos(nd.ang) * nd.len * s * 0.5;
      var dy = Math.sin(nd.ang) * nd.len * s * 0.5;
      ctx.moveTo(c.x - dx, c.y - dy);
      ctx.lineTo(c.x + dx, c.y + dy);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Glints: scheduled needles flash pale, envelope evaluated per frame.
    var tt = t % SCHEDULE_PERIOD;
    ctx.strokeStyle = GLINT;
    ctx.lineWidth = 1.2;
    for (i = 0; i < glints.length; i++) {
      var g = glints[i];
      if (tt < g.start || tt > g.start + g.dur) continue;
      var env = Math.sin(Math.PI * (tt - g.start) / g.dur);
      var gn = needles[g.idx];
      var gc = pt(gn.u, gn.v);
      var gdx = Math.cos(gn.ang) * gn.len * s * 0.5;
      var gdy = Math.sin(gn.ang) * gn.len * s * 0.5;
      ctx.globalAlpha = env * 0.95;
      ctx.beginPath();
      ctx.moveTo(gc.x - gdx, gc.y - gdy);
      ctx.lineTo(gc.x + gdx, gc.y + gdy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Hanging loop from nail to neck.
    ctx.strokeStyle = SILK;
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(nailX - gW * 0.05, nailY);
    ctx.lineTo(nailX, topY + 2);
    ctx.lineTo(nailX + gW * 0.05, nailY);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.restore();

    // The nail itself: static, a small dark pin with a head.
    ctx.strokeStyle = NAIL;
    ctx.fillStyle = NAIL;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(nailX - 5, nailY + 5);
    ctx.lineTo(nailX + 2, nailY - 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(nailX + 3, nailY - 3, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }

  buildLayout();

  // Frame one: synchronous draw at sway phase 0. Deterministic.
  draw(0);

  var start = null;
  function frame(now) {
    if (start === null) start = now;
    draw((now - start) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

  function onResize() { draw(0); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  // Tap reseeds the needle clusters (new epoch). Never a reload.
  canvas.addEventListener('pointerdown', function () {
    epoch++;
    buildLayout();
  });
})();
</script>
</body>
</html>
