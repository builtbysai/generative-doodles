<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Five States of Freedom</title>
<style>
  html, body { margin:0; padding:0; background:#0E0F12; overflow:hidden; height:100%; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
"use strict";

/* ---------- seeded hash (no Math.random anywhere) ---------- */
function hash(n){
  var x = (n >>> 0) ^ 0x9E3779B9;
  x = Math.imul(x ^ (x >>> 16), 0x21F0AAAD);
  x = Math.imul(x ^ (x >>> 15), 0x735A2D97);
  x = x ^ (x >>> 15);
  return (x >>> 0) / 4294967296;
}
function hash2(a, b){ return hash((Math.imul(a|0, 374761393) + Math.imul(b|0, 668265263)) | 0); }

/* ---------- palette ---------- */
var NIGHT   = "#0E0F12";
var GROUND  = "#14161B";
var CONC    = "#6E6F72";
var CONC_D  = "#43444A";
var CONC_DD = "#2B2C31";
var AMBER   = "#E08A2E";
var SCORCH  = "#050505";
var CHALK   = "#D8D4C8";
var WHITE   = "#FFFFFF";
var BLACK   = "#000000";

function hexRGB(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mix(h1, h2, k){
  var a = hexRGB(h1), b = hexRGB(h2);
  return "rgb(" + Math.round(a[0]+(b[0]-a[0])*k) + "," + Math.round(a[1]+(b[1]-a[1])*k) + "," + Math.round(a[2]+(b[2]-a[2])*k) + ")";
}
function rgba(h, a){
  var c = hexRGB(h);
  return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
}

/* ---------- sites & histories ---------- */
var SITE_NAMES = ["SITE 1","SITE 2","SITE 3","SITE 4","SITE 5"];
var PRIMARY = [
  "FBI raid, 1987",
  "decommissioned, 1991",
  "listening post, cold war",
  "wildlife refuge, 2005",
  "subdivisions at the fence line"
];
var ALTERNATES = [
  "burned once, on purpose",
  "the aquifer remembers",
  "sold for one dollar"
];
var seed = 0; /* double-tap increments; histories rotate deterministically */
function historyFor(siteIdx){
  if (seed === 0) return PRIMARY[siteIdx];
  /* rotate: some sites swap to alternates, keyed by seed */
  var r = hash2(9000 + seed, siteIdx);
  if (r < 0.45) return ALTERNATES[Math.floor(hash2(9100 + seed, siteIdx) * ALTERNATES.length) % ALTERNATES.length];
  var shift = 1 + Math.floor(hash2(9200 + seed, siteIdx) * 4);
  return PRIMARY[(siteIdx + shift) % PRIMARY.length];
}

/* ---------- state ---------- */
var canvas = document.getElementById("cv");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;
var pan = 0;                 /* world px offset */
var taps = [];               /* {site, x (world), t} — bursts derive from these */
var dragState = null;
var lastTapTime = -10, lastTapX = 0;
var startPerf = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;

function nowSec(){
  if (typeof performance !== "undefined" && performance.now) return (performance.now() - startPerf) / 1000;
  return 0;
}
function isPhone(){
  try{
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    if (sw < 700) return true;
  }catch(e){}
  return H > W * 1.15;
}
function siteW(){ return Math.max(260, Math.round(W * 0.70)); }
function worldW(){ return siteW() * 5; }
function groundY(){ return Math.round(H * 0.78); }

function resize(){
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.round(w); H = Math.round(h);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  var maxPan = Math.max(0, worldW() - W);
  if (pan > maxPan) pan = maxPan;
  if (pan < 0) pan = 0;
  draw(nowSec());
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
window.addEventListener("resize", resize);

/* ---------- flash pattern: hashed per burst, flash-discipline bound ----------
   gaps 0.30–0.90 s, durations 0.06–0.11 s (1–2 frames), max 9 flashes,
   worst-case rate ~2.7 flashes/sec — never a sustained >3 Hz train.       */
function flashPattern(burstSeed){
  var flashes = [];
  var t = 0.12 + hash2(burstSeed, 1) * 0.25;
  var i = 0;
  while (t < 3.75 && i < 9){
    var dur = 0.06 + hash2(burstSeed, 100 + i) * 0.05;
    if (t + dur > 3.9) break;
    flashes.push({ start: t, dur: dur });
    var gap = 0.30 + hash2(burstSeed, 200 + i) * 0.60;
    t += dur + gap;
    i++;
  }
  return flashes;
}
function burstAt(site, t){
  /* latest tap on this site that is in its 4 s burst window at time t */
  var found = null;
  for (var i = 0; i < taps.length; i++){
    var tp = taps[i];
    if (tp.site !== site) continue;
    if (t >= tp.t && t <= tp.t + 4.0) found = tp;
  }
  return found;
}
function illumination(site, t){
  var b = burstAt(site, t);
  if (!b) return { L: 0, flashIdx: -1, burst: null };
  var local = t - b.t;
  var pat = flashPattern(b.seed);
  for (var i = 0; i < pat.length; i++){
    if (local >= pat[i].start && local <= pat[i].start + pat[i].dur) return { L: 1, flashIdx: i, burst: b };
  }
  return { L: 0, flashIdx: -1, burst: b };
}
function scorchList(t){
  /* pre-seeded evidence + one mark per completed burst; pure function of taps & t */
  var list = [{ site: 0, x: siteW() * 0.44, seed: 777, old: true }];
  for (var i = 0; i < taps.length; i++){
    if (t >= taps[i].t + 4.0) list.push({ site: taps[i].site, x: taps[i].x, seed: taps[i].seed, old: false });
  }
  return list;
}

/* ---------- drawing helpers ---------- */
function rect(x, y, w, h, col){ ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function line(x1, y1, x2, y2, col, lw){
  ctx.strokeStyle = col; ctx.lineWidth = lw || 1;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function ellipsePath(cx, cy, rx, ry){
  ctx.beginPath();
  var steps = 24;
  for (var i = 0; i <= steps; i++){
    var a = (i / steps) * Math.PI * 2;
    var px = cx + Math.cos(a) * rx, py = cy + Math.sin(a) * ry;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

/* ---------- structure painters (sx = site left in screen px, lit = 0/1) ---------- */
function concCol(lit, dark){
  if (lit) return mix(dark ? CONC_D : CONC, WHITE, dark ? 0.55 : 0.85);
  return dark ? CONC_D : CONC;
}
function drawBunker(sx, gy, sw, lit, t){
  var c = concCol(lit, false), cd = concCol(lit, true);
  var mw = sw * 0.56, mh = gy * 0.16, mx = sx + (sw - mw) / 2, my = gy - mh;
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(mx, gy);
  ctx.lineTo(mx, my + mh * 0.45);
  ctx.lineTo(mx + mw * 0.18, my);
  ctx.lineTo(mx + mw * 0.82, my);
  ctx.lineTo(mx + mw, my + mh * 0.45);
  ctx.lineTo(mx + mw, gy);
  ctx.closePath(); ctx.fill();
  /* mouth */
  var mwid = mw * 0.20, mhgt = mh * 0.72, mxp = sx + sw / 2 - mwid / 2;
  rect(mxp - 3, gy - mhgt - 3, mwid + 6, mhgt + 3, cd);
  rect(mxp, gy - mhgt, mwid, mhgt, lit ? "#3A3A3A" : BLACK);
  /* vent pipe */
  rect(mx + mw * 0.72, my - mh * 0.28, 5, mh * 0.30, cd);
}
function drawSilo(sx, gy, sw, lit){
  var c = concCol(lit, false), cd = concCol(lit, true);
  var dw = sw * 0.52, dx = sx + (sw - dw) / 2, dh = gy * 0.045;
  rect(dx, gy - dh, dw, dh, cd);
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(dx, gy - dh);
  var steps = 20;
  for (var i = 0; i <= steps; i++){
    var a = Math.PI - (i / steps) * Math.PI;
    ctx.lineTo(dx + dw / 2 + Math.cos(a) * dw / 2, gy - dh - Math.sin(a) * gy * 0.075);
  }
  ctx.lineTo(dx + dw, gy - dh);
  ctx.closePath(); ctx.fill();
  /* hatch + vents */
  rect(dx + dw * 0.44, gy - dh - gy * 0.085, dw * 0.12, gy * 0.028, cd);
  rect(dx + dw * 0.16, gy - dh - gy * 0.038, 7, gy * 0.030, cd);
  rect(dx + dw * 0.80, gy - dh - gy * 0.038, 7, gy * 0.030, cd);
  line(dx + dw * 0.5, gy - dh, dx + dw * 0.5, gy, rgba(lit ? WHITE : BLACK, 0.18), 1);
}
function drawRadar(sx, gy, sw, lit){
  var c = concCol(lit, false), cd = concCol(lit, true);
  var cx = sx + sw * 0.5, baseW = sw * 0.30, th = gy * 0.34;
  line(cx - baseW / 2, gy, cx - baseW * 0.16, gy - th, c, 4);
  line(cx + baseW / 2, gy, cx + baseW * 0.16, gy - th, c, 4);
  line(cx - baseW * 0.38, gy - th * 0.45, cx + baseW * 0.38, gy - th * 0.45, cd, 2);
  rect(cx - baseW * 0.20, gy - th - 6, baseW * 0.40, 8, cd);
  /* dish skeleton: arc + struts */
  var dcx = cx, dcy = gy - th - gy * 0.10, dr = sw * 0.21;
  ctx.strokeStyle = c; ctx.lineWidth = 3;
  ctx.beginPath();
  for (var i = 0; i <= 20; i++){
    var a = Math.PI * 1.12 + (i / 20) * Math.PI * 0.76;
    var px = dcx + Math.cos(a) * dr, py = dcy + Math.sin(a) * dr * 0.62;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  for (var s = 0; s < 4; s++){
    var aa = Math.PI * 1.2 + s * (Math.PI * 0.6 / 3);
    line(dcx, dcy + 4, dcx + Math.cos(aa) * dr, dcy + Math.sin(aa) * dr * 0.62, cd, 1.5);
  }
  line(dcx, dcy + 4, dcx, gy - th - 4, cd, 2);
  /* equipment shed */
  rect(cx + baseW * 0.55, gy - gy * 0.07, sw * 0.13, gy * 0.07, cd);
}
function drawCompound(sx, gy, sw, lit){
  var c = concCol(lit, false), cd = concCol(lit, true);
  /* low block building */
  var bw = sw * 0.34, bh = gy * 0.13, bx = sx + sw * 0.36;
  rect(bx, gy - bh, bw, bh, c);
  rect(bx + bw * 0.08, gy - bh * 0.62, bw * 0.14, bh * 0.34, lit ? "#4A4A4A" : BLACK);
  rect(bx + bw * 0.62, gy - bh * 0.62, bw * 0.14, bh * 0.34, lit ? "#4A4A4A" : BLACK);
  rect(bx, gy - bh - 4, bw, 4, cd);
  /* fence: posts + two rails, both sides */
  var fy = gy - gy * 0.085;
  line(sx + sw * 0.04, fy, sx + sw * 0.96, fy, cd, 1.5);
  line(sx + sw * 0.04, fy + gy * 0.045, sx + sw * 0.96, fy + gy * 0.045, cd, 1.5);
  for (var i = 0; i <= 10; i++){
    var px = sx + sw * 0.04 + (sw * 0.92) * (i / 10);
    line(px, fy - 4, px, gy, cd, 2);
  }
  /* gate gap hint */
  rect(sx + sw * 0.465, fy - 1, sw * 0.07, 2, rgba(NIGHT, 0.0));
}
function drawWatchtower(sx, gy, sw, lit){
  var c = concCol(lit, false), cd = concCol(lit, true);
  var cx = sx + sw * 0.5, tw = sw * 0.16, th = gy * 0.36;
  line(cx - tw * 0.55, gy, cx - tw * 0.28, gy - th, c, 4);
  line(cx + tw * 0.55, gy, cx + tw * 0.28, gy - th, c, 4);
  line(cx - tw * 0.50, gy - th * 0.45, cx + tw * 0.30, gy - th * 0.72, cd, 2);
  line(cx + tw * 0.50, gy - th * 0.45, cx - tw * 0.30, gy - th * 0.72, cd, 2);
  /* cab */
  var cw = tw * 1.25, chh = gy * 0.10, cxp = cx - cw / 2, cyp = gy - th - chh;
  rect(cxp, cyp, cw, chh, c);
  rect(cxp + cw * 0.14, cyp + chh * 0.22, cw * 0.72, chh * 0.42, lit ? "#555555" : BLACK);
  rect(cxp - 3, cyp - 4, cw + 6, 4, cd);
  /* small stair block */
  rect(cx + tw * 0.62, gy - gy * 0.05, sw * 0.07, gy * 0.05, cd);
}
var PAINTERS = [drawBunker, drawSilo, drawRadar, drawCompound, drawWatchtower];

/* ---------- main draw ---------- */
function draw(t){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  var sw = siteW(), gy = groundY();
  var phone = isPhone();

  rect(0, 0, W, H, NIGHT);

  /* stars (world space) */
  var starStep = Math.floor(t * 2);
  for (var si = 0; si < 220; si++){
    var wx = hash2(si, 41) * worldW();
    var sy = hash2(si, 42) * gy * 0.72;
    var spx = wx - pan;
    if (spx < -2 || spx > W + 2) continue;
    var tw = 0.35 + 0.65 * hash2(si, 500 + starStep);
    ctx.fillStyle = rgba(CHALK, 0.55 * tw);
    ctx.fillRect(spx, sy, hash2(si, 43) < 0.12 ? 2 : 1, 1);
  }

  /* ground */
  rect(0, gy, W, H - gy, GROUND);
  line(0, gy, W, gy, "#23252C", 1);

  /* scorch marks (under structures, on the ground) */
  var scorches = scorchList(t);
  var counts = {};
  for (var qi = 0; qi < scorches.length; qi++){
    var sc = scorches[qi];
    counts[sc.site] = (counts[sc.site] || 0) + 1;
  }
  for (var mi = 0; mi < scorches.length; mi++){
    var m = scorches[mi];
    var msx = m.site * sw + m.x - pan;
    if (msx < -90 || msx > W + 90) continue;
    var stackA = Math.min(0.85, 0.40 + 0.13 * ((counts[m.site] || 1) - 1));
    ctx.fillStyle = rgba(SCORCH, m.old ? 0.45 : stackA);
    ellipsePath(msx, gy + 7, 26 + hash2(m.seed, 1) * 22, 4.5 + hash2(m.seed, 2) * 3);
    ctx.fill();
    for (var b = 0; b < 5; b++){
      var bx = msx + (hash2(m.seed, 10 + b) - 0.5) * 56;
      var by = gy + 4 + hash2(m.seed, 20 + b) * 9;
      ctx.fillStyle = rgba(SCORCH, (m.old ? 0.35 : 0.6) * (0.5 + hash2(m.seed, 30 + b) * 0.5));
      ellipsePath(bx, by, 4 + hash2(m.seed, 40 + b) * 9, 1.6 + hash2(m.seed, 50 + b) * 1.6);
      ctx.fill();
    }
  }

  /* sites */
  for (var sIdx = 0; sIdx < 5; sIdx++){
    var sx = sIdx * sw - pan;
    if (sx + sw < -10 || sx > W + 10) continue;
    var ill = illumination(sIdx, t);
    var lit = ill.L;

    /* ground flash ellipse + lit ground wash */
    if (lit && ill.burst){
      var gxp = sIdx * sw + ill.burst.x - pan; /* burst.x is within-site world px */
      ctx.fillStyle = rgba(WHITE, 0.90);
      ellipsePath(gxp, gy + 6, sw * 0.30, 10);
      ctx.fill();
      rect(sx, gy, sw, H - gy, rgba(WHITE, 0.20));
      rect(sx, 0, sw, gy, rgba(WHITE, 0.10));
      /* sparks, closed-form from flash index */
      ctx.strokeStyle = rgba(WHITE, 0.95); ctx.lineWidth = 1.5;
      for (var sp = 0; sp < 7; sp++){
        var sa = hash2(ill.burst.seed, 300 + ill.flashIdx * 7 + sp) * Math.PI - Math.PI;
        var sl = 18 + hash2(ill.burst.seed, 400 + ill.flashIdx * 7 + sp) * 46;
        line(gxp, gy + 2, gxp + Math.cos(sa) * sl, gy + 2 + Math.sin(sa) * sl * 0.45, rgba(WHITE, 0.9), 1.5);
      }
    }

    PAINTERS[sIdx](sx, gy, sw, lit, t);

    /* sodium edge lights: two tiny lamps per site; one lamp in the whole strip
       flickers rarely and subtly (hash on slow step, NOT a strobe) */
    var lampStep = Math.floor(t * 3);
    for (var li = 0; li < 2; li++){
      var lx = sx + sw * (0.16 + li * 0.68);
      var la = 0.85;
      if (sIdx === 2 && li === 0){
        var fv = hash2(77, lampStep);
        la = fv < 0.06 ? 0.25 : 0.85; /* rare dip */
      }
      ctx.fillStyle = rgba(AMBER, la);
      ctx.fillRect(lx, gy - gy * 0.055, 3, 3);
      ctx.fillStyle = rgba(AMBER, 0.10 * la);
      ellipsePath(lx + 1, gy - gy * 0.055 + 1, 9, 5);
      ctx.fill();
      line(lx + 1, gy - gy * 0.055 + 3, lx + 1, gy, concCol(lit, true), 1.5);
    }

    /* site divider tick */
    line(sx + sw, gy * 0.30, sx + sw, gy, "#1D1F24", 1);

    /* placard */
    var pfs = phone ? 10 : 12;
    ctx.font = pfs + "px ui-monospace, Menlo, Consolas, monospace";
    ctx.fillStyle = rgba(CHALK, 0.92);
    ctx.textBaseline = "alphabetic";
    var label = SITE_NAMES[sIdx] + " \u2014 " + historyFor(sIdx);
    ctx.fillText(label, sx + 10, H - (phone ? 12 : 16));
    /* small placard post line above text */
    line(sx + 10, H - (phone ? 22 : 27), sx + 10 + Math.min(sw * 0.4, ctx.measureText(label).width), H - (phone ? 22 : 27), rgba(CHALK, 0.25), 1);
  }

  /* vignette: darken extreme edges slightly with flat translucent bands (no gradients) */
  rect(0, 0, W, 6, rgba(BLACK, 0.25));
  rect(0, H - 4, W, 4, rgba(BLACK, 0.25));
}

/* ---------- interaction: drag pans; tap fires a site; double-tap reseeds ---------- */
function canvasPos(e){
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener("pointerdown", function(e){
  var p = canvasPos(e);
  dragState = { sx: p.x, sy: p.y, pan0: pan, moved: 0, t0: nowSec() };
  if (canvas.setPointerCapture) { try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
});
canvas.addEventListener("pointermove", function(e){
  if (!dragState) return;
  var p = canvasPos(e);
  var dx = p.x - dragState.sx;
  dragState.moved = Math.max(dragState.moved, Math.abs(dx) + Math.abs(p.y - dragState.sy));
  pan = dragState.pan0 - dx;
  var maxPan = Math.max(0, worldW() - W);
  if (pan > maxPan) pan = maxPan;
  if (pan < 0) pan = 0;
  draw(nowSec());
});
function endPointer(e){
  if (!dragState) return;
  var t = nowSec();
  var wasTap = dragState.moved < 7 && (t - dragState.t0) < 0.45;
  var p = canvasPos(e);
  dragState = null;
  if (!wasTap) return;
  /* double-tap? */
  if (t - lastTapTime < 0.35 && Math.abs(p.x - lastTapX) < 40){
    seed += 1;
    lastTapTime = -10;
    draw(t);
    return;
  }
  lastTapTime = t; lastTapX = p.x;
  var worldX = p.x + pan;
  var sw = siteW();
  var site = Math.floor(worldX / sw);
  if (site < 0 || site > 4) return;
  /* cooldown: one burst per tap, 5 s per site (from burst start) */
  for (var i = 0; i < taps.length; i++){
    if (taps[i].site === site && t - taps[i].t < 5.0) return;
  }
  taps.push({ site: site, x: worldX - site * sw, t: t, seed: 5000 + taps.length * 131 + site * 17 });
  draw(t);
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", function(){ dragState = null; });

/* ---------- boot: synchronous fixed-phase first frame, then guarded rAF ---------- */
resize();
draw(0); /* T0 = 0: rest state, quiet night, sites 1–2, one old scorch under the bunker */
if (typeof requestAnimationFrame === "function"){
  var loop = function(){
    draw(nowSec());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
