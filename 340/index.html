<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.340 Click-In Grammar</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#121417; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.340 Click-In Grammar (myclayco).
// After their Click n Clay Multi Jig demo: a multi-jig as a
// composition engine. Exactly 6 cells in a 2 x 3 grid, asserted,
// each cell a rainbow arch jig in six flat bands (red, orange,
// yellow, green, blue, violet) holding one cream insert motif.
// Inserts stay strictly inside the four-motif set (star, heart,
// flower, dot); there is never a fifth motif. Tap a cell and
// that cell advances to the next motif in its own fixed seeded
// order table; the incoming motif clicks in with a small scale
// spring on the motif only, the arch bands never move. Double
// tap anywhere (350ms window) and the whole board advances to
// the next authored deal in a fixed deal table; every state is
// reproducible, never a runtime random deal. Idle, a slow
// brightness step travels cell to cell in fixed reading order
// and returns to cell 1: 1.25s per cell, a 7.5s loop, asserted.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#121417', CREAM = '#F2EBD8';
var BANDS = ['#D64545', '#E08A3C', '#E8C547', '#4F9D69', '#3E7CB1', '#7B5EA7'];
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 3.4, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- the fixed motif set: star, heart, flower, dot -----------
var MOTIF_NAMES = ['star', 'heart', 'flower', 'dot'];
if (MOTIF_NAMES.length !== 4) throw new Error('Click-In Grammar needs exactly 4 motifs');

// ---- per-cell seeded order tables (fixed data) ---------------
// Each cell cycles its own order of the four motif indices;
// every order is 8 long and holds each motif exactly twice.
var ORDERS = [
  [0, 2, 1, 3, 2, 0, 3, 1],
  [3, 1, 0, 2, 1, 3, 2, 0],
  [2, 0, 3, 1, 0, 2, 1, 3],
  [1, 3, 2, 0, 3, 1, 0, 2],
  [0, 3, 1, 2, 3, 0, 2, 1],
  [2, 1, 3, 0, 1, 2, 0, 3]
];
(function () {
  var i, j, seen;
  if (ORDERS.length !== 6) throw new Error('Click-In Grammar needs 6 order tables');
  for (i = 0; i < 6; i++) {
    if (ORDERS[i].length !== 8) throw new Error('each order table is 8 long');
    seen = [0, 0, 0, 0];
    for (j = 0; j < 8; j++) {
      if (ORDERS[i][j] < 0 || ORDERS[i][j] > 3) throw new Error('order entry outside the motif set');
      seen[ORDERS[i][j]]++;
    }
    for (j = 0; j < 4; j++) if (seen[j] !== 2) throw new Error('each motif appears twice per order');
  }
})();

// ---- authored deal table (fixed data) ------------------------
// Each deal is 6 pointers, one per cell, into that cell's order
// table. Double-tap advances the board to the next deal.
var DEALS = [
  [0, 0, 0, 0, 0, 0],
  [2, 3, 1, 4, 5, 2],
  [5, 1, 4, 2, 7, 6],
  [3, 6, 7, 5, 2, 4]
];
(function () {
  var i, j;
  if (DEALS.length !== 4) throw new Error('Click-In Grammar needs 4 authored deals');
  for (i = 0; i < DEALS.length; i++) {
    if (DEALS[i].length !== 6) throw new Error('each deal covers all 6 cells');
    for (j = 0; j < 6; j++) if (DEALS[i][j] < 0 || DEALS[i][j] > 7) throw new Error('deal pointer out of range');
  }
})();

// ---- board state ----------------------------------------------
var dealIdx = 0;
var ptrs = DEALS[0].slice();
var pops = [-100, -100, -100, -100, -100, -100]; // pop start times

function advanceCell(i) {
  ptrs[i] = (ptrs[i] + 1) % ORDERS[i].length;
  pops[i] = T;
}
function advanceDeal() {
  dealIdx = (dealIdx + 1) % DEALS.length;
  for (var i = 0; i < 6; i++) { ptrs[i] = DEALS[dealIdx][i]; pops[i] = T; }
}

// ---- grid geometry: exactly 6 cells, 2 rows x 3 cols ---------
var BAND_R = [172, 146.5, 121, 95.5, 70, 44.5];
var BAND_W = 24;
var MOTIF_R = 31;
if (BANDS.length !== 6 || BAND_R.length !== 6) throw new Error('Click-In Grammar needs 6 arch bands');
var CELLS = [];
(function () {
  var M = 16, G = 16;
  var cw = (DW - 2 * M - 2 * G) / 3, ch = (DH - 2 * M - G) / 2;
  for (var i = 0; i < 6; i++) {
    var col = i % 3, row = Math.floor(i / 3);
    var x0 = M + col * (cw + G), y0 = M + row * (ch + G);
    CELLS.push({
      x: x0, y: y0, w: cw, h: ch,
      cx: x0 + cw / 2, cy: y0 + 232, baseY: y0 + ch - 14,
      mx: x0 + cw / 2, my: y0 + 310
    });
  }
})();
if (CELLS.length !== 6) throw new Error('Click-In Grammar needs exactly 6 cells');
(function () {
  if (!(CELLS[1].x > CELLS[0].x && CELLS[3].y > CELLS[0].y && CELLS[5].x > CELLS[4].x)) {
    throw new Error('cells must form a 2 x 3 grid');
  }
})();

// ---- idle shimmer: 1.25s per cell, 7.5s loop, asserted -------
var SHIM_STEP = 1.25, SHIM_LOOP = 7.5;
if (Math.abs(SHIM_LOOP - 6 * SHIM_STEP) > 1e-9) throw new Error('shimmer loop must be 6 steps');
function shimmerLift(i) {
  var pos = (T % SHIM_LOOP) / SHIM_STEP;
  var idx = Math.floor(pos), frac = pos - idx;
  if (i !== idx) return 0;
  var e = Math.min(frac / 0.18, (1 - frac) / 0.18, 1);
  if (e < 0) e = 0;
  return 0.34 * e;
}
function shade(hex, f) {
  var n = parseInt(hex.slice(1), 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r + (255 - r) * f);
  g = Math.round(g + (255 - g) * f);
  b = Math.round(b + (255 - b) * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// ---- pop settle: scale spring on the incoming motif only -----
function popScale(i) {
  var age = T - pops[i];
  if (age < 0 || age > 0.55) return 1;
  return 1 - 0.45 * Math.cos(age * 22) * Math.exp(-age * 7);
}

// ---- motif paths (unit data, radius R) ------------------------
function starPath(R) {
  ctx.beginPath();
  for (var k = 0; k < 10; k++) {
    var a = -Math.PI / 2 + k * Math.PI / 5;
    var r = (k % 2 === 0) ? R : R * 0.48;
    if (k === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
}
function heartPath(R) {
  ctx.beginPath();
  ctx.moveTo(0, 0.86 * R);
  ctx.bezierCurveTo(-1.02 * R, 0.22 * R, -0.80 * R, -0.66 * R, 0, -0.30 * R);
  ctx.bezierCurveTo(0.80 * R, -0.66 * R, 1.02 * R, 0.22 * R, 0, 0.86 * R);
  ctx.closePath();
}
function drawMotif(m, R) {
  var k, a;
  if (m === 0) { starPath(R); ctx.fill(); }
  else if (m === 1) { heartPath(R); ctx.fill(); }
  else if (m === 2) {
    for (k = 0; k < 6; k++) {
      a = k * Math.PI / 3;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * 0.48 * R, Math.sin(a) * 0.48 * R, 0.50 * R, 0.29 * R, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, 0.30 * R, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, 0.62 * R, 0, Math.PI * 2); ctx.fill();
  }
}

// ---- arch: concentric band strokes as path data ---------------
function archPath(cx, cy, r, baseY) {
  ctx.beginPath();
  ctx.moveTo(cx - r, baseY);
  ctx.lineTo(cx - r, cy);
  ctx.arc(cx, cy, r, Math.PI, 0, false);
  ctx.lineTo(cx + r, baseY);
}

function drawCell(i) {
  var c = CELLS[i], lift = shimmerLift(i), k;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (k = 0; k < 6; k++) {
    ctx.strokeStyle = lift > 0 ? shade(BANDS[k], lift) : BANDS[k];
    ctx.lineWidth = BAND_W;
    archPath(c.cx, c.cy, BAND_R[k], c.baseY);
    ctx.stroke();
  }
  var m = ORDERS[i][ptrs[i]];
  ctx.save();
  ctx.translate(c.mx, c.my);
  ctx.scale(popScale(i), popScale(i));
  ctx.fillStyle = CREAM;
  drawMotif(m, MOTIF_R);
  ctx.restore();
  if (lift > 0) {
    ctx.save();
    ctx.globalAlpha = lift * 0.35;
    ctx.translate(c.mx, c.my);
    ctx.fillStyle = '#FFFFFF';
    drawMotif(m, MOTIF_R);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  for (var i = 0; i < 6; i++) drawCell(i);
}

// ---- sizing: full-bleed field, cover-fit ----------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- tap / double-tap, hit-tested in design coords ------------
// A tap is held for the 350ms double-tap window so a double-tap
// never half-advances one cell before the re-deal lands; if no
// second tap arrives the held tap fires on its own.
var lastDownT = -10, pendingTap = null;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function hitCell(x, y) {
  for (var i = 0; i < 6; i++) {
    var c = CELLS[i];
    if (x >= c.x && x < c.x + c.w && y >= c.y && y < c.y + c.h) return i;
  }
  return -1;
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  var cell = hitCell(p[0], p[1]);
  if (T - lastDownT <= 0.35) {
    pendingTap = null;
    advanceDeal();
    lastDownT = -10;
  } else {
    lastDownT = T;
    if (cell >= 0) pendingTap = { cell: cell, at: T + 0.35 };
  }
});

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  if (pendingTap && T >= pendingTap.at) { advanceCell(pendingTap.cell); pendingTap = null; }
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
