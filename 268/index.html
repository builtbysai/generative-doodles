<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.268 Nduku</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4F2EC; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.268 Nduku (Shupiwe Chongwe). After her Bedforms
// wall sculpture: a wide horizontal rhythm of ceramic
// shards, matte black spheres and ovoids, and curved
// brown panels on a stark white gallery wall. One
// shield fragment carries tan raku veining beside a
// smooth black ovoid. The forms hang from invisible
// pivots above the band. Drag through them and they
// swing, shadows swinging with them, settling slowly.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var WHITE = '#F4F2EC', BLACK = '#1C1A17', BROWN = '#7A4E2E', TAN = '#C9A876', GREY = '#B9B4A8';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 0, lastNow = -1;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- shield veining, seeded (local coords, clipped at draw) ----------------
var veins = [];
(function () {
  var r = rng(26851);
  for (var i = 0; i < 5; i++) {
    var pts = [], x = -38 + i * 19 + (r() - 0.5) * 6, y = -44;
    pts.push({ x: x, y: y });
    var n = 5 + Math.floor(r() * 2);
    for (var j = 0; j < n; j++) { x += (r() - 0.5) * 15; y += 13 + r() * 9; pts.push({ x: x, y: y }); }
    veins.push(pts);
  }
})();
// ---- shard outlines (hand set angular fragments, local coords) --------------
function shardPts(which) {
  if (which === 1) return [{x:-50,y:-26},{x:14,y:-52},{x:54,y:-4},{x:30,y:46},{x:-24,y:54},{x:-54,y:12}];
  if (which === 2) return [{x:-16,y:-56},{x:40,y:-30},{x:52,y:20},{x:10,y:54},{x:-42,y:34},{x:-50,y:-20}];
  return [{x:-48,y:-38},{x:30,y:-48},{x:54,y:8},{x:22,y:52},{x:-36,y:44},{x:-54,y:-6}];
}

// ---- the eleven forms --------------------------------------------------------
// kind: shard | sphere | ovoid | panel | shield
// pivotY is above the band; length reaches the form centre in the middle third.
var PIVOT_Y = 150;
var forms = [
  { kind: 'shard',  x: 118,  cy: 452, col: BLACK, pts: shardPts(1), angle: 0,     vel: 0, k: 3.6 },
  { kind: 'sphere', x: 232,  cy: 486, r: 37, col: BLACK, angle: 0.07,  vel: 0, k: 4.1 },
  { kind: 'panel',  x: 342,  cy: 438, w: 82, h: 116, col: BROWN, angle: 0,     vel: 0, k: 3.2 },
  { kind: 'shard',  x: 452,  cy: 492, col: BROWN, pts: shardPts(2), angle: 0,     vel: 0, k: 3.9 },
  { kind: 'ovoid',  x: 548,  cy: 452, rx: 34, ry: 52, col: BLACK, angle: 0,     vel: 0, k: 3.4 },
  { kind: 'shield', x: 662,  cy: 470, w: 96, h: 122, col: BROWN, angle: 0,     vel: 0, k: 3.0 },
  { kind: 'ovoid',  x: 782,  cy: 462, rx: 42, ry: 56, col: BLACK, angle: -0.06, vel: 0, k: 3.3 },
  { kind: 'panel',  x: 892,  cy: 496, w: 74, h: 104, col: BROWN, angle: 0,     vel: 0, k: 3.7 },
  { kind: 'sphere', x: 992,  cy: 444, r: 32, col: BLACK, angle: 0,     vel: 0, k: 4.3 },
  { kind: 'shard',  x: 1082, cy: 486, col: BLACK, pts: shardPts(3), angle: 0,     vel: 0, k: 3.5 },
  { kind: 'panel',  x: 1180, cy: 456, w: 66, h: 96,  col: BROWN, angle: 0,     vel: 0, k: 3.8 }
];
for (var fi = 0; fi < forms.length; fi++) forms[fi].len = forms[fi].cy - PIVOT_Y;

function centre(f) {
  return { x: f.x + Math.sin(f.angle) * f.len, y: PIVOT_Y + Math.cos(f.angle) * f.len };
}

// ---- shape paths (centred on origin, local coords) ---------------------------
function pathForm(f) {
  var i, p;
  ctx.beginPath();
  if (f.kind === 'sphere') {
    ctx.arc(0, 0, f.r, 0, Math.PI * 2);
  } else if (f.kind === 'ovoid') {
    ctx.ellipse(0, 0, f.rx, f.ry, 0, 0, Math.PI * 2);
  } else if (f.kind === 'shard') {
    for (i = 0; i < f.pts.length; i++) { p = f.pts[i]; if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
    ctx.closePath();
  } else if (f.kind === 'panel') {
    var w = f.w / 2, h = f.h / 2;
    ctx.moveTo(-w, -h);
    ctx.bezierCurveTo(-w * 0.3, -h - 5, w * 0.3, -h - 5, w, -h);
    ctx.bezierCurveTo(w + 4, -h * 0.3, w + 4, h * 0.3, w, h);
    ctx.bezierCurveTo(w * 0.3, h + 5, -w * 0.3, h + 5, -w, h);
    ctx.bezierCurveTo(-w - 4, h * 0.3, -w - 4, -h * 0.3, -w, -h);
    ctx.closePath();
  } else if (f.kind === 'shield') {
    var sw = f.w / 2, sh = f.h / 2;
    ctx.moveTo(-sw, -sh * 0.78);
    ctx.bezierCurveTo(-sw * 0.3, -sh * 0.94, sw * 0.3, -sh * 0.94, sw, -sh * 0.78);
    ctx.bezierCurveTo(sw * 0.96, -sh * 0.1, sw * 0.82, sh * 0.38, sw * 0.42, sh * 0.68);
    ctx.bezierCurveTo(sw * 0.2, sh * 0.86, sw * 0.08, sh * 0.94, 0, sh);
    ctx.bezierCurveTo(-sw * 0.08, sh * 0.94, -sw * 0.2, sh * 0.86, -sw * 0.42, sh * 0.68);
    ctx.bezierCurveTo(-sw * 0.82, sh * 0.38, -sw * 0.96, -sh * 0.1, -sw, -sh * 0.78);
    ctx.closePath();
  }
}

function draw() {
  ctx.fillStyle = WHITE;
  ctx.fillRect(0, 0, DW, DH);
  var i, f, c;
  // shadows first: offset silhouettes swinging with their forms
  for (i = 0; i < forms.length; i++) {
    f = forms[i]; c = centre(f);
    ctx.save();
    ctx.translate(c.x + 26 + Math.sin(f.angle) * 14, c.y + 22);
    ctx.rotate(f.angle);
    ctx.fillStyle = rgba(GREY, 0.55);
    pathForm(f); ctx.fill();
    ctx.restore();
  }
  // the forms themselves
  for (i = 0; i < forms.length; i++) {
    f = forms[i]; c = centre(f);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(f.angle);
    ctx.fillStyle = f.col;
    pathForm(f); ctx.fill();
    if (f.kind === 'panel') {
      // a quiet inner curve so the panel reads as bent, not flat
      ctx.strokeStyle = rgba(BLACK, 0.18);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-f.w * 0.28, -f.h * 0.42);
      ctx.bezierCurveTo(-f.w * 0.12, 0, -f.w * 0.12, f.h * 0.2, -f.w * 0.26, f.h * 0.42);
      ctx.stroke();
    }
    if (f.kind === 'shield') {
      ctx.save();
      pathForm(f); ctx.clip();
      ctx.strokeStyle = rgba(TAN, 0.9);
      ctx.lineWidth = 2.2;
      for (var v = 0; v < veins.length; v++) {
        var pts = veins[v];
        ctx.beginPath();
        for (var j = 0; j < pts.length; j++) { if (j === 0) ctx.moveTo(pts[j].x, pts[j].y); else ctx.lineTo(pts[j].x, pts[j].y); }
        ctx.stroke();
      }
      ctx.restore();
    }
    if (f.kind === 'sphere' || f.kind === 'ovoid') {
      // matte sheen kept inside the palette: a faint grey crescent
      ctx.fillStyle = rgba(GREY, 0.10);
      ctx.beginPath();
      if (f.kind === 'sphere') ctx.ellipse(-f.r * 0.28, -f.r * 0.3, f.r * 0.52, f.r * 0.34, -0.6, 0, Math.PI * 2);
      else ctx.ellipse(-f.rx * 0.26, -f.ry * 0.32, f.rx * 0.54, f.ry * 0.3, -0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ---- pendulum integration ------------------------------------------------------
function step(dt) {
  if (dt <= 0) return;
  var damp = Math.pow(0.995, dt * 60);
  for (var i = 0; i < forms.length; i++) {
    var f = forms[i];
    var acc = -f.k * Math.sin(f.angle);
    f.vel = (f.vel + acc * dt) * damp;
    f.angle += f.vel * dt;
  }
}

// ---- drag to disturb -------------------------------------------------------------
var dragging = false, lastDX = 0, lastDY = 0, lastStamp = 0;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
function disturb(px, py, vx) {
  for (var i = 0; i < forms.length; i++) {
    var f = forms[i], c = centre(f);
    var ddx = c.x - px, ddy = c.y - py;
    var d = Math.sqrt(ddx * ddx + ddy * ddy);
    var R = 185;
    if (d < R) {
      var fall = 1 - d / R;
      f.vel += vx * 0.0011 * fall * fall * (f.len / 300);
    }
  }
}
canvas.addEventListener('pointerdown', function (e) {
  dragging = true;
  var p = toDesign(e); lastDX = p.x; lastDY = p.y; lastStamp = e.timeStamp || 0;
  if (canvas.setPointerCapture && e.pointerId !== undefined) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var stamp = e.timeStamp || 0;
  var dt = Math.max(8, stamp - lastStamp) / 1000;
  var vx = (p.x - lastDX) / dt;
  disturb(p.x, p.y, vx);
  lastDX = p.x; lastDY = p.y; lastStamp = stamp;
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- resize -----------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = WHITE;
  ctx.fillRect(0, 0, W, H);
  // centred fit: shaped composition, page ground is the gallery white
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  step(dt);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
