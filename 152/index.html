<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Topkapi Correction</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0D0F; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function mixc(c1, c2, f) {
  function ch(c, i) { return parseInt(c.substr(i, 2), 16); }
  var r = Math.round(ch(c1, 1) + (ch(c2, 1) - ch(c1, 1)) * f);
  var g = Math.round(ch(c1, 3) + (ch(c2, 3) - ch(c1, 3)) * f);
  var b = Math.round(ch(c1, 5) + (ch(c2, 5) - ch(c1, 5)) * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function polar(cx, cy, r, deg) {
  var a = deg * Math.PI / 180;
  return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
}

// Three curated corrections: which two of the twelve petals the old
// publication got wrong, and by how much. Petal angles are degrees
// off true; tipOff is a fractional length error on the same petals.
var SEEDS = [
  { off: { 2: 5, 7: -4 }, tip: {} },
  { off: { 5: 3.5, 10: -5.5 }, tip: { 10: -0.06 } },
  { off: { 0: -4, 4: 4.5 }, tip: { 4: 0.04 } }
];
var seedIdx = 0;
var interacted = false, dragging = false;
var val = 0.55, startX = 0, startVal = 0.55, nowMs = 0;
var lastDown = -1000, lastX = 0, lastY = 0;

function idleVal(now) { return 0.55 + 0.33 * Math.sin(now / 1000 * Math.PI * 2 / 26); }
function curVal(now) { return interacted ? val : idleVal(now); }

function drawRosette(cx, cy, R, s, seed, color, alpha, ghost) {
  ctx.strokeStyle = color;
  ctx.globalAlpha = alpha;
  ctx.lineWidth = ghost ? 1.1 : 1.7;
  ctx.lineJoin = 'round';
  var i, th, off, tipR;
  // outer rings
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.86, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.10, 0, Math.PI * 2); ctx.stroke();
  // twelve petals, each a pointed leaf with a midrib
  for (i = 0; i < 12; i++) {
    th = -90 + i * 30;
    off = (seed.off[i] || 0) * (1 - s);
    tipR = R * 0.78 * (1 + (seed.tip[i] || 0) * (1 - s));
    var S = polar(cx, cy, R * 0.30, th + off);
    var T = polar(cx, cy, tipR, th + off);
    var CL = polar(cx, cy, R * 0.58, th + off - 17);
    var CR = polar(cx, cy, R * 0.58, th + off + 17);
    ctx.beginPath();
    ctx.moveTo(S[0], S[1]);
    ctx.quadraticCurveTo(CL[0], CL[1], T[0], T[1]);
    ctx.quadraticCurveTo(CR[0], CR[1], S[0], S[1]);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(S[0], S[1]); ctx.lineTo(T[0], T[1]);
    ctx.stroke();
  }
  // inner {12/5} star, its points riding the same petal angles
  ctx.beginPath();
  for (i = 0; i <= 12; i++) {
    var k = (i * 5) % 12;
    th = -90 + k * 30;
    off = (seed.off[k] || 0) * (1 - s);
    var P = polar(cx, cy, R * 0.27, th + off);
    if (i === 0) ctx.moveTo(P[0], P[1]); else ctx.lineTo(P[0], P[1]);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function draw(now) {
  nowMs = now;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#0D0D0F'; ctx.fillRect(0, 0, W, H);
  var s = curVal(now);
  var seed = SEEDS[seedIdx];
  var PS = Math.min(W, H) * 0.84;
  var cx = W / 2, cy = H / 2, R = PS * 0.40;
  // the archive page: one paper panel on the dark ground
  ctx.fillStyle = '#F6F1E4';
  ctx.fillRect(cx - PS / 2, cy - PS / 2, PS, PS);
  ctx.strokeStyle = 'rgba(176,165,140,0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(cx - PS / 2 + 0.5, cy - PS / 2 + 0.5, PS - 1, PS - 1);

  // the published version, underneath, fading as the correction lands
  if (s < 0.985) drawRosette(cx, cy, R, 0, seed, '#B0A58C', 0.55 * (1 - s) + 0.08, true);
  // the working rosette: its colour travels from tan to indigo with s
  drawRosette(cx, cy, R, s, seed, mixc('#B0A58C', '#1F2A44', s), 0.96, false);

  // her construction, in red: the circles and true spokes the petals
  // are pulled to, plus an arc across each corrected petal's error
  var ca = 0.15 + 0.80 * s, i, th;
  ctx.strokeStyle = '#C0392B';
  ctx.globalAlpha = ca;
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.78, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.30, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  for (i = 0; i < 12; i++) {
    th = -90 + i * 30;
    var A = polar(cx, cy, R * 0.12, th), B = polar(cx, cy, R * 0.97, th);
    ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = 2;
  Object.keys(seed.off).forEach(function (k) {
    th = -90 + (+k) * 30;
    var a0 = (th + seed.off[k] * (1 - s)) * Math.PI / 180, a1 = th * Math.PI / 180;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.90, Math.min(a0, a1), Math.max(a0, a1)); ctx.stroke();
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(246,241,228,0.55)';
  ctx.font = '12.5px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('drag to scrub the correction', W / 2, H - 16);
}

function ptr(e) { return [e.clientX, e.clientY]; }
canvas.addEventListener('pointerdown', function (e) {
  var p = ptr(e);
  if (nowMs - lastDown < 380 && Math.hypot(p[0] - lastX, p[1] - lastY) < 48) {
    seedIdx = (seedIdx + 1) % SEEDS.length;      // double-tap: another panel
    lastDown = -1000;
  } else { lastDown = nowMs; }
  lastX = p[0]; lastY = p[1];
  if (!interacted) { val = idleVal(nowMs); interacted = true; }
  dragging = true; startX = p[0]; startVal = val;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = ptr(e);
  val = clamp01(startVal + (p[0] - startX) / (0.55 * Math.min(W, H)));
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('pointerup', endDrag);

resize();
draw(0);
function frame(ts) {
  draw(ts || 0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
