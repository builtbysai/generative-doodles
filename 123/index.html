<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№123 · Hashed Arcs</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5F2EA; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(17,17,16,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">tap a cell to break it</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.123 Hashed Arcs: strict 8x8 grid of arc cells, exactly one disruption, in red
const PAPER='#F5F2EA', INK='#111110', RED='#C22E1F';
const GN=8, NCELL=GN*GN;
const KINDS=['rot','double','missing'];
const rnd=mulberry(hashStr('Hashed Arcs'));
const SWEEPS=[Math.PI/2, Math.PI, Math.PI*1.5];
const cells=[];
for(let i=0;i<NCELL;i++) cells.push({sweep:SWEEPS[(rnd()*3)|0], rot:(rnd()*4)|0});
const seq=[];
for(let i=0;i<NCELL;i++) seq.push((rnd()*NCELL)|0);
// disruption schedule: migrates every 20s; tap override holds 20s
let tapCell=-1, tapT=-1e9, tapCount=0, downPt=null, downCell=-1;
function disruptionAt(t){
  if(tapCell>=0 && t-tapT<20) return {cell:tapCell, kind:KINDS[tapCount%3], wipe:clamp((t-tapT)/0.7,0,1)};
  const mig=Math.floor(t/20);
  return {cell:seq[mig%NCELL], kind:KINDS[mig%3], wipe:clamp((t-mig*20)/0.7,0,1)};
}
function gridGeom(w,h){ const S=Math.min(w,h)*0.84; return {S:S, cell:S/GN, ox:(w-S)/2, oy:(h-S)/2}; }
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const t=nowMs/1000;
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,w,h);
  const g=gridGeom(w,h);
  const dis=disruptionAt(t);
  const breathe=1+0.006*Math.sin(t*0.7);
  ctx.lineCap='butt';
  ctx.lineWidth=Math.max(1.2, g.cell*0.062);
  for(let i=0;i<NCELL;i++){
    const c=cells[i];
    const cx=g.ox+(i%GN+0.5)*g.cell, cy=g.oy+(((i/GN)|0)+0.5)*g.cell;
    const r=g.cell*0.36*breathe;
    const a0=c.rot*Math.PI/2;
    const sw=c.sweep*dis.wipe;
    if(i===dis.cell){
      if(dis.kind==='missing'){
        // the missing arc leaves only a faint red ghost of itself
        ctx.strokeStyle=RED; ctx.globalAlpha=0.18;
        ctx.beginPath(); ctx.arc(cx,cy,r,a0,a0+c.sweep); ctx.stroke();
        ctx.globalAlpha=1;
      } else if(dis.kind==='double'){
        ctx.strokeStyle=INK; ctx.globalAlpha=1;
        ctx.beginPath(); ctx.arc(cx,cy,r,a0,a0+sw); ctx.stroke();
        ctx.strokeStyle=RED;
        ctx.beginPath(); ctx.arc(cx,cy,r,a0+Math.PI/2,a0+Math.PI/2+sw); ctx.stroke();
      } else { // rot: rotated one quarter turn wrong, in red
        ctx.strokeStyle=RED; ctx.globalAlpha=1;
        ctx.beginPath(); ctx.arc(cx,cy,r,a0+Math.PI/2,a0+Math.PI/2+sw); ctx.stroke();
      }
    } else if(dis.wipe>0){
      ctx.strokeStyle=INK; ctx.globalAlpha=1;
      ctx.beginPath(); ctx.arc(cx,cy,r,a0,a0+sw); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}
function cellAt(x,y){ const [w,h]=viewportWH(); const g=gridGeom(w,h); const cx=Math.floor((x-g.ox)/g.cell), cy=Math.floor((y-g.oy)/g.cell); if(cx<0||cy<0||cx>=GN||cy>=GN) return -1; return cy*GN+cx; }
canvas.addEventListener('pointerdown',e=>{ downPt=[e.clientX,e.clientY]; downCell=cellAt(e.clientX,e.clientY); });
canvas.addEventListener('pointerup',e=>{
  if(downPt && downCell>=0){
    const dx=e.clientX-downPt[0], dy=e.clientY-downPt[1];
    if(dx*dx+dy*dy<64 && cellAt(e.clientX,e.clientY)===downCell){ tapCell=downCell; tapT=e.timeStamp/1000; tapCount++; }
  }
  downPt=null; downCell=-1;
});
canvas.addEventListener('pointercancel',()=>{ downPt=null; downCell=-1; });

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(14000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
