<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Mano Dibuja Sola</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FAF6EA; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var INK = '#141414', PAPER = '#FAF6EA', WASH = '#B9B4A6';

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry32(584070);

/* QA/preset hook: when true, the piece opens with every passage already drawn.
   Always false in the shipped piece; used only by a throwaway QA copy. */
var PRESET_ALL = false;

/* ---------- precomputed paper speckle (seeded data, drawn directly) ---------- */
var speckles = [];
for (var si = 0; si < 260; si++){
  speckles.push({ x: rng()*1000, y: rng()*1000, r: 0.8 + rng()*1.5, a: 0.03 + rng()*0.05 });
}

/* ---------- geometry helpers ---------- */
function seg(x1,y1,x2,y2,n){ var p=[],i; n = n || Math.max(2, Math.round(Math.hypot(x2-x1, y2-y1)/11)); for(i=0;i<=n;i++) p.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n]); return p; }
function rectP(x,y,w,h){ return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]]; }
function circP(cx,cy,r,n){ var p=[],i,a; n=n||24; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function ellP(cx,cy,rx,ry,n){ var p=[],i,a; n=n||28; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); } return p; }
function arcP(cx,cy,r,a0,a1,n){ var p=[],i,a; n=n||12; for(i=0;i<=n;i++){ a=a0+(a1-a0)*i/n; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function bez(p0,p1,p2,p3,n){ var p=[],i,t,u; n=n||18; for(i=0;i<=n;i++){ t=i/n; u=1-t; p.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0], u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]); } return p; }
function wavyH(x1,x2,y,amp,per){ var p=[],x; for(x=x1;x<=x2;x+=7) p.push([x, y+Math.sin((x-x1)/per*Math.PI*2)*amp]); p.push([x2, y+Math.sin((x2-x1)/per*Math.PI*2)*amp]); return p; }
function leafP(bx,by,angDeg,len,wid){ var a=angDeg*Math.PI/180, dx=Math.cos(a), dy=Math.sin(a), px=-dy, py=dx, p=[],i,t,w; for(i=0;i<=6;i++){ t=i/6; w=Math.sin(t*Math.PI)*wid; p.push([bx+dx*len*t+px*w, by+dy*len*t+py*w]); } for(i=6;i>=0;i--){ t=i/6; w=Math.sin(t*Math.PI)*wid; p.push([bx+dx*len*t-px*w, by+dy*len*t-py*w]); } return p; }
/* an illegible handwriting gesture: little rises, falls and dots, never letters */
function scribble(x, y, len, step){
  var p = [[x, y]], cx = x, dir = 1, i;
  while (cx < x + len){
    var w = step * (0.7 + rng()*0.7);
    cx += w;
    var lift = (rng()*10 - 4) * dir;
    p.push([cx - w*0.45, y + lift - 4]);
    p.push([cx, y + (rng()*4 - 2)]);
    if (rng() < 0.3) dir = -dir;
  }
  return p;
}
function jit(pts, amt){ var out=[],i; for(i=0;i<pts.length;i++) out.push([pts[i][0]+(rng()*2-1)*amt, pts[i][1]+(rng()*2-1)*amt]); return out; }
function S(pts, o){ o = o || {}; var p = jit(pts, o.j !== undefined ? o.j : 1.5); var len=0,i; var n=p.length, lim = o.close ? n : n-1; for(i=1;i<=lim;i++){ var a=p[i-1], b=p[i%n]; len += Math.hypot(b[0]-a[0], b[1]-a[1]); } return { pts:p, w:o.w||3, color:o.color||null, close:!!o.close, len:len }; }

/* ---------- the eight passages, drawn in fixed order on a 1000x1000 sheet ---------- */
var passages = [];
function addPassage(strokes){
  var total=0,i; for(i=0;i<strokes.length;i++) total += strokes[i].len;
  passages.push({ strokes:strokes, total:total, dur: Math.max(0.8, Math.min(2.6, total/1250)) });
}

/* 1 — the table, at the center */
addPassage([
  S(seg(295,515, 705,500), { w:3.6 }),
  S(seg(298,533, 702,518), { w:2.4 }),
  S(seg(330,530, 322,656), { w:3.2 }),
  S(seg(672,519, 681,651), { w:3.2 }),
  S(seg(326,612, 677,602), { w:2.4 }),
  S([[512,478],[541,478],[537,500],[516,500]], { close:true, w:2.6 }),
  S(seg(540,484, 552,489), { w:2.2 }),
  S(arcP(612,499,20,Math.PI,Math.PI*2,10), { w:2.6 }),
  S(seg(592,499, 632,499), { w:2.6 })
]);

/* 2 — tiny figures around the table */
addPassage([
  /* chair + seated figure, left */
  S(seg(232,468, 229,560), { w:2.8 }),
  S(seg(229,560, 232,738), { w:2.4 }),
  S(seg(284,556, 287,732), { w:2.4 }),
  S(seg(229,560, 288,556), { w:2.8 }),
  S(circP(263,429,20), { close:true, w:2.8 }),
  S(seg(259,451, 253,540), { w:3 }),
  S(seg(257,494, 302,511), { w:2.6 }),
  S(seg(253,556, 297,562), { w:2.8 }),
  S(seg(297,562, 300,688), { w:2.8 }),
  S(seg(300,688, 316,690), { w:2.4 }),
  /* chair + seated figure, right */
  S(seg(773,466, 777,556), { w:2.8 }),
  S(seg(777,556, 780,734), { w:2.4 }),
  S(seg(721,552, 718,730), { w:2.4 }),
  S(seg(718,552, 777,556), { w:2.8 }),
  S(circP(743,427,20), { close:true, w:2.8 }),
  S(seg(747,449, 752,538), { w:3 }),
  S(seg(749,492, 706,505), { w:2.6 }),
  S(seg(752,552, 709,558), { w:2.8 }),
  S(seg(709,558, 706,686), { w:2.8 }),
  S(seg(706,686, 690,688), { w:2.4 }),
  /* standing figure behind the table, serving */
  S(circP(441,331,19), { close:true, w:2.8 }),
  S(seg(441,352, 439,442), { w:3 }),
  S(seg(440,386, 480,428), { w:2.6 }),
  S(seg(440,392, 414,424), { w:2.6 }),
  S(seg(439,442, 429,503), { w:2.8 }),
  S(seg(439,442, 453,502), { w:2.8 })
]);

/* 3 — the window, upper right */
addPassage([
  S(rectP(690,140,215,270), { close:true, w:3.4 }),
  S(rectP(703,153,189,244), { close:true, w:2.2 }),
  S(seg(797,153, 797,397), { w:2.2 }),
  S(seg(703,275, 892,275), { w:2.2 }),
  S(wavyH(706,795,178,5,52), { w:2.2 }),
  S(wavyH(800,889,178,5,52), { w:2.2 }),
  S(circP(752,214,23), { close:true, w:2.4 }),
  S(arcP(761,206,15,-0.5,1.9,10), { w:2 }),
  S(seg(845,176, 845,196), { w:2 }),
  S(seg(835,186, 855,186), { w:2 }),
  S(seg(864,318, 864,334), { w:2 }),
  S(seg(856,326, 872,326), { w:2 }),
  S(seg(681,410, 914,410), { w:3 })
]);

/* 4 — the plant, on the floor at right */
addPassage([
  S(seg(792,634, 884,634), { w:3.2 }),
  S([[800,646],[876,646],[866,726],[810,726]], { close:true, w:3.2 }),
  S(wavyH(806,870,652,3,30), { w:2 }),
  S(bez([838,640],[830,580],[822,540],[816,492]), { w:2.6 }),
  S(bez([838,640],[840,566],[842,520],[846,466]), { w:2.6 }),
  S(bez([838,640],[852,584],[862,548],[872,506]), { w:2.6 }),
  S(leafP(816,492,-118,34,11), { close:true, w:2.4 }),
  S(leafP(846,466,-84,38,12), { close:true, w:2.4 }),
  S(leafP(872,506,-48,32,10), { close:true, w:2.4 }),
  S(leafP(828,540,-140,26,9), { close:true, w:2.2 }),
  S(leafP(856,548,-30,26,9), { close:true, w:2.2 })
]);

/* 5 — the floor, more figures, and a cat */
addPassage([
  S(seg(96,742, 912,742,60), { w:2.6 }),
  /* tall standing figure, left */
  S(circP(150,468,18), { close:true, w:2.8 }),
  S(seg(150,488, 150,612), { w:3 }),
  S(seg(150,520, 122,576), { w:2.6 }),
  S(seg(150,520, 178,570), { w:2.6 }),
  S(seg(150,612, 137,736), { w:2.8 }),
  S(seg(150,612, 165,736), { w:2.8 }),
  /* small child, right of the table */
  S(circP(764,588,14), { close:true, w:2.6 }),
  S(seg(764,603, 764,664), { w:2.8 }),
  S(seg(764,624, 742,650), { w:2.4 }),
  S(seg(764,624, 784,646), { w:2.4 }),
  S(seg(764,664, 755,738), { w:2.6 }),
  S(seg(764,664, 775,738), { w:2.6 }),
  /* the cat, asleep in the middle of the floor */
  S(ellP(532,719,54,20), { close:true, w:2.8 }),
  S(circP(594,707,16), { close:true, w:2.6 }),
  S([[584,695],[580,680],[592,688]], { close:true, w:2.2 }),
  S([[598,691],[600,676],[608,687]], { close:true, w:2.2 }),
  S(bez([480,714],[452,706],[446,684],[462,670]), { w:2.6 }),
  S(seg(588,707, 600,707), { w:1.8 }),
  S(seg(476,730, 588,730), { w:2 })
]);

/* 6 — the shelf with books, upper left */
addPassage([
  S(seg(105,250, 405,242), { w:3.6 }),
  S(seg(108,262, 402,254), { w:2 }),
  S(seg(140,262, 140,282), { w:2.4 }),
  S(seg(368,256, 368,276), { w:2.4 }),
  S(rectP(122,158,26,90), { close:true, w:2.6 }),
  S(rectP(154,146,30,102), { close:true, w:2.6 }),
  S(seg(154,168, 184,168), { w:1.8 }),
  S(rectP(190,166,22,82), { close:true, w:2.6 }),
  S([[218,248],[240,240],[252,158],[230,166]], { close:true, w:2.6 }),
  S(rectP(258,152,28,96), { close:true, w:2.6 }),
  S(seg(258,176, 286,176), { w:1.8 }),
  S(rectP(292,170,22,78), { close:true, w:2.6 }),
  S(rectP(320,160,26,88), { close:true, w:2.6 }),
  S([[362,242],[388,242],[384,214],[366,214]], { close:true, w:2.4 }),
  S(arcP(375,214,9,Math.PI,Math.PI*2,8), { w:2.2 })
]);

/* 7 — hanging frames and a lamp */
addPassage([
  S(rectP(448,150,108,96), { close:true, w:3 }),
  S(rectP(459,161,86,74), { close:true, w:1.8 }),
  S([[468,222],[492,190],[508,208],[524,182],[538,222]], { w:2.2 }),
  S(circP(524,180,7), { close:true, w:1.8 }),
  S(rectP(452,282,84,70), { close:true, w:3 }),
  S(rectP(462,292,64,50), { close:true, w:1.8 }),
  S(wavyH(468,520,312,4,26), { w:2 }),
  S(wavyH(468,520,328,4,26), { w:2 }),
  S(seg(612,108, 612,196), { w:2.6 }),
  S([[578,196],[646,196],[628,233],[596,233]], { close:true, w:3 }),
  S(arcP(612,233,15,0.15*Math.PI,0.85*Math.PI,10), { w:2.2 }),
  S(seg(588,248, 583,264), { w:2 }),
  S(seg(612,252, 612,270), { w:2 }),
  S(seg(636,248, 641,264), { w:2 })
]);

/* 8 — grey wash: one shadow passage, and the date scribble that says nothing */
addPassage([
  S(wavyH(332,676,672,3,64), { w:6, color:WASH, j:1 }),
  S(wavyH(348,664,688,3,58), { w:6, color:WASH, j:1 }),
  S(wavyH(366,650,704,3,52), { w:5, color:WASH, j:1 }),
  S(scribble(684, 898, 218, 13), { w:3, color:WASH, j:0.8 }),
  S(scribble(684, 924, 158, 13), { w:3, color:WASH, j:0.8 }),
  S(scribble(684, 949, 192, 13), { w:3, color:WASH, j:0.8 }),
  S(seg(684,966, 838,962), { w:2.4, color:WASH, j:0.8 })
]);

/* ---------- state ---------- */
var PHASE0 = 0;                 /* fixed phase anchor: frame one never comes from a clock */
var curT = PHASE0;
var drawnCount = PRESET_ALL ? passages.length : 0;
var drawingIdx = -1, drawingT0 = 0;
var panX = 0, panY = 0;

/* ---------- sizing ---------- */
var viewW = 300, viewH = 300, dpr = 1;
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : { width:300, height:300 };
var isPhone = Math.min(scr.width, scr.height) < 700; // aspect fallback below only if screen lies
if (!isPhone && viewH > viewW * 1.15 && Math.min(viewW, viewH) < 700) isPhone = true;

/* ---------- drawing ---------- */
function handFont(size, weight){ return 'italic ' + (weight||600) + ' ' + size + 'px "Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif'; }

function pathOf(pts, close){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function strokePartial(pts, close, budget){
  var n = pts.length, lim = close ? n : n-1, b = budget, i, a, c, dx, dy, L;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(i=1;i<=lim;i++){
    a = pts[i-1]; c = pts[i%n]; dx = c[0]-a[0]; dy = c[1]-a[1]; L = Math.hypot(dx,dy);
    if (b >= L){ ctx.lineTo(c[0], c[1]); b -= L; }
    else { var f = L ? b/L : 0; ctx.lineTo(a[0]+dx*f, a[1]+dy*f); b = 0; break; }
  }
  ctx.stroke();
  return b;
}
function drawPassage(pg, p){
  var budget = p * pg.total, i, st;
  for(i=0;i<pg.strokes.length;i++){
    st = pg.strokes[i];
    if (budget <= 0) break;
    ctx.strokeStyle = st.color || INK; ctx.lineWidth = st.w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (budget >= st.len){ pathOf(st.pts, st.close); ctx.stroke(); budget -= st.len; }
    else { strokePartial(st.pts, st.close, budget); budget = 0; }
  }
}

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var s = Math.min(viewW/1000, viewH/1000);
  var ox = (viewW - 1000*s)/2, oy = (viewH - 1000*s)/2;
  ctx.setTransform(dpr*s, 0, 0, dpr*s, dpr*(ox + panX*s), dpr*(oy + panY*s));
  var i;
  for(i=0;i<speckles.length;i++){ var sp = speckles[i]; ctx.save(); ctx.globalAlpha = sp.a; ctx.fillStyle = INK; ctx.fillRect(sp.x, sp.y, sp.r, sp.r); ctx.restore(); }
  for(i=0;i<passages.length;i++){
    if (i < drawnCount) drawPassage(passages[i], 1);
    else if (i === drawingIdx) drawPassage(passages[i], Math.max(0, Math.min(1, (curT - drawingT0)/passages[i].dur)));
  }
  if (drawnCount === 0 && drawingIdx < 0){
    ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = INK; ctx.font = handFont(21, 600);
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillText('tap', 972, 952); ctx.restore();
  }
}

/* ---------- sizing listeners (Visual Viewport API + window) ---------- */
function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

/* ---------- interaction: tap asks the hand to continue; drag pans the sheet ---------- */
function toStage(e){
  var r = { left:0, top:0 };
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var cx = (e.clientX - r.left), cy = (e.clientY - r.top);
  var s = Math.min(viewW/1000, viewH/1000);
  return { x: (cx - (viewW - 1000*s)/2)/s, y: (cy - (viewH - 1000*s)/2)/s };
}
var pdown = null;
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e);
  pdown = { x:p.x, y:p.y, moved:false, opx: panX, opy: panY };
});
canvas.addEventListener('pointermove', function(e){
  if (!pdown) return;
  var p = toStage(e), dx = p.x - pdown.x, dy = p.y - pdown.y;
  if (Math.abs(dx) > 7 || Math.abs(dy) > 7) pdown.moved = true;
  if (pdown.moved){
    panX = Math.max(-70, Math.min(70, pdown.opx + dx));
    panY = Math.max(-70, Math.min(70, pdown.opy + dy));
    draw();
  }
});
function endPointer(e){
  if (!pdown) return;
  var wasDrag = pdown.moved;
  pdown = null;
  if (wasDrag) { draw(); return; }
  if (drawingIdx >= 0) return;                        /* the hand is mid-passage; it does not hurry */
  if (drawnCount < passages.length){ drawingIdx = drawnCount; drawingT0 = curT; }
  draw();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ pdown = null; });
if (typeof window !== 'undefined') window.addEventListener('pointerup', function(){ pdown = null; });

/* ---------- tick: advance a passage being drawn ---------- */
function tick(t){
  curT = t;
  if (drawingIdx >= 0){
    var pg = passages[drawingIdx];
    if ((t - drawingT0) >= pg.dur){ drawnCount++; drawingIdx = -1; }
  }
}

/* ---------- go: synchronous first frame (the blank sheet), then the loop ---------- */
resize();
var baseTs = null;
function loop(ts){
  if (baseTs === null){ baseTs = ts; curT = PHASE0; }
  tick(PHASE0 + (ts - baseTs)/1000);
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
</script>
</body>
</html>
