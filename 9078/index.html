<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9078 · Shimmer</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#efe9da; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(32,29,23,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another shimmer</div>
<script>
'use strict';
// No9078 Shimmer.
// Concentric rings drawn as broken circles. Each ring is cut into
// dashes, and the dash duty cycle alternates from ring to ring while
// the phase steps by a fixed turn, so neighbouring rings interfere
// and the field appears to move when it does not. One ring, somewhere
// in the middle third, is vermilion and a touch heavier: the single
// warm note the eye keeps returning to. Ring radii carry a small
// seeded jitter, enough to feel machined by hand rather than plotted
// by default. Bone ground, charcoal ink.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9078', 10) || 9078;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#efe9da';
const INK = '#201d17';
const VERM = '#c65a34';

function compose(s) {
  const rnd = mulberry32(s);
  return {
    rings: 26 + Math.floor(rnd() * 8),          // 26..33 rings
    jitter: 0.012 + rnd() * 0.012,             // radius jitter as share of spacing
    phaseStep: 0.35 + rnd() * 0.45,            // dash phase step per ring (turns)
    dutyA: 0.52 + rnd() * 0.12,                // dash duty cycle, even rings
    dutyB: 0.30 + rnd() * 0.12,                // dash duty cycle, odd rings
    vermAt: 0.38 + rnd() * 0.24,               // vermilion ring position (0..1 of radius)
    baseRot: rnd() * Math.PI * 2,
    thick: 1.5 + rnd() * 0.9,                  // vermilion ring weight multiplier
  };
}

function renderPiece(c, W, H, p) {
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) * 0.46;
  const n = p.rings;
  const spacing = R / n;
  const rnd = mulberry32(seed ^ 0x5f3759df);
  const jitters = [];
  for (let i = 0; i < n; i++) jitters.push((rnd() * 2 - 1) * p.jitter * spacing);

  const vermIdx = Math.round(p.vermAt * (n - 1));

  c.fillStyle = GROUND;
  c.fillRect(0, 0, W, H);
  c.lineCap = 'butt';

  for (let i = 0; i < n; i++) {
    const r = spacing * (i + 0.75) + jitters[i];
    if (r <= 0) continue;
    const circ = 2 * Math.PI * r;
    const duty = (i % 2 === 0) ? p.dutyA : p.dutyB;
    // Dash count grows with radius so dash arc-length stays roughly constant.
    const count = Math.max(8, Math.round(circ / (spacing * 1.15)));
    const period = (Math.PI * 2) / count;
    const dash = period * duty;
    const rot = p.baseRot + i * p.phaseStep * Math.PI * 2;
    const isVerm = (i === vermIdx);
    c.strokeStyle = isVerm ? VERM : INK;
    c.globalAlpha = isVerm ? 0.92 : 0.86;
    c.lineWidth = Math.max(1, spacing * 0.16) * (isVerm ? p.thick : 1);
    c.beginPath();
    for (let k = 0; k < count; k++) {
      const a0 = rot + k * period;
      const a1 = a0 + dash;
      c.moveTo(cx + Math.cos(a0) * r, cy + Math.sin(a0) * r);
      // subdivide the arc so dashes follow the curve
      const steps = Math.max(2, Math.ceil(dash / 0.05));
      for (let s = 1; s <= steps; s++) {
        const a = a0 + (dash * s) / steps;
        c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      }
    }
    c.stroke();
  }
  c.globalAlpha = 1;
}

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  // Centered piece: the ground IS the page color, so the piece simply
  // centers in the viewport at any size.
  const p = compose(seed);
  renderPiece(ctx, w, h, p);
}

window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  draw();
});
draw();
</script>
</body>
</html>
