<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9060 · Hundred</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #171310; }
  #stage { position: fixed; inset: 0; display: block; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 28px;
    color: rgba(232, 220, 196, 0.38);
    font: 12px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.14em; pointer-events: none; user-select: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
  }
  .hint .n { color: rgba(232, 220, 196, 0.62); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint"><span>click for the next in the edition</span><span class="n" id="ednum"></span></div>
<script>
/* Mobile viewport fix: the visual viewport (not window.innerWidth/Height)
   tracks the truly visible area when the mobile URL bar shows/hides, which
   does not reliably fire window.resize. Size from it, and re-fire resize. */
function viewportWH(){
  var vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function(){
  window.dispatchEvent(new Event('resize'));
});

'use strict';
/* №9060 · Hundred
   After Hobbs's long-form thinking: the edition is the work. A good
   algorithm should produce a wide range of outputs that each hold, so this
   piece is a fixed edition of exactly one hundred prints. Click walks the
   edition in order; ?seed=N jumps to print N. The grammar is strict on
   purpose: one anchor shape on a jittered third-point, two to five
   satellites placed with collision checks and real margins, one
   probabilistic four-color palette on paper, rare traits (a vermilion
   thread-line, a single dot) the way a trait table has rare rows. */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const EDITION = 100;
const qs = new URLSearchParams(location.search);
let n = parseInt(qs.get('seed') || '1', 10) || 1;
n = ((n - 1) % EDITION + EDITION) % EDITION + 1; // 1..100
document.getElementById('ednum').textContent = n + ' / ' + EDITION;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = viewportWH()[0]; H = viewportWH()[1];
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  draw();
}
window.addEventListener('resize', resize);
canvas.addEventListener('click', () => {
  n = n % EDITION + 1;
  history.replaceState(null, '', '?seed=' + n);
  document.getElementById('ednum').textContent = n + ' / ' + EDITION;
  draw();
});

function pickWeighted(rnd, pairs) {
  let r = rnd(), acc = 0;
  for (const [v, w] of pairs) { acc += w; if (r <= acc) return v; }
  return pairs[pairs.length - 1][0];
}
const TAU = Math.PI * 2;

function draw() {
  const rnd = mulberry32(9060000 + n); // the edition is fixed and reproducible

  ctx.fillStyle = '#171310';
  ctx.fillRect(0, 0, W, H);

  const S = Math.min(W, H) * 0.92;
  const ox = (W - S) / 2, oy = (H - S) / 2;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.beginPath(); ctx.rect(0, 0, S, S); ctx.clip();

  // paper ground
  ctx.fillStyle = '#ece3cf';
  ctx.fillRect(0, 0, S, S);

  const M = S * 0.09; // real margins: the print breathes

  // probabilistic palette: hand-picked, weighted
  const PAL = [
    ['#211b14', 0.34], // ink
    ['#b23a24', 0.24], // vermilion
    ['#cf9433', 0.22], // ochre
    ['#3f5a76', 0.20], // slate
  ];

  // placed shapes, as bounding circles for collision
  const placed = [];
  function collides(x, y, r) {
    const pad = S * 0.022;
    for (const p of placed) {
      if (Math.hypot(x - p.x, y - p.y) < r + p.r + pad) return true;
    }
    return false;
  }

  function drawShape(sh) {
    const { kind, x, y, r, rot, color, filled, thick } = sh;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    if (filled) ctx.fillStyle = color; else { ctx.strokeStyle = color; ctx.lineWidth = thick; }
    const P = (fn) => { ctx.beginPath(); fn(); filled ? ctx.fill() : ctx.stroke(); };
    if (kind === 'disc') {
      P(() => ctx.arc(0, 0, r, 0, TAU));
    } else if (kind === 'arc') {
      // thick quarter ring
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, sh.arcLen);
      ctx.strokeStyle = color; ctx.lineWidth = r * 0.52; ctx.lineCap = 'butt';
      ctx.stroke();
    } else if (kind === 'bar') {
      const w = r * 2, h = r * (0.42 + rnd() * 0.2), rad = h / 2;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-w / 2, -h / 2, w, h, rad);
      else ctx.rect(-w / 2, -h / 2, w, h);
      filled ? ctx.fill() : ctx.stroke();
    } else if (kind === 'half') {
      P(() => { ctx.arc(0, 0, r, 0, Math.PI); ctx.closePath(); });
    }
    ctx.restore();
  }

  function makeShape(x, y, r, anchor) {
    const kind = pickWeighted(rnd, anchor
      ? [['arc', 0.34], ['disc', 0.24], ['bar', 0.22], ['half', 0.20]]
      : [['disc', 0.32], ['arc', 0.26], ['bar', 0.24], ['half', 0.18]]);
    const color = pickWeighted(rnd, PAL);
    const filled = rnd() < (anchor ? 0.72 : 0.6);
    // bounding radius accounts for stroke extent, so thick arcs can't
    // visually overlap a neighbor their circle-test cleared
    const br = kind === 'arc' ? r * 1.32 : kind === 'bar' ? r * 1.06 : r;
    return {
      kind, x, y, r, br,
      rot: rnd() * TAU,
      arcLen: (Math.PI / 2) * (0.85 + rnd() * 0.7),
      color, filled,
      thick: Math.max(2, S * 0.011),
    };
  }

  // the anchor: large, on a jittered third-point
  const ax = S * (rnd() < 0.5 ? 0.36 : 0.64) + (rnd() - 0.5) * S * 0.10;
  const ay = S * (rnd() < 0.5 ? 0.38 : 0.62) + (rnd() - 0.5) * S * 0.10;
  const ar = S * (0.15 + rnd() * 0.075);
  const anchor = makeShape(ax, ay, ar, true);
  drawShape(anchor);
  placed.push({ x: ax, y: ay, r: anchor.br * 1.02 });

  // satellites: two to five, collision-checked, shrinking tiers on failure
  const target = 2 + Math.floor(rnd() * 4);
  let want = target, tier = 0;
  const tiers = [0.13, 0.095, 0.062];
  while (want > 0 && tier < 3) {
    const r = S * tiers[tier] * (0.8 + rnd() * 0.45);
    let ok = false;
    for (let t = 0; t < 60 && !ok; t++) {
      const sh = makeShape(0, 0, r, false); // kind first: br depends on kind
      const x = M + sh.br + rnd() * (S - 2 * M - 2 * sh.br);
      const y = M + sh.br + rnd() * (S - 2 * M - 2 * sh.br);
      if (!collides(x, y, sh.br)) {
        sh.x = x; sh.y = y;
        drawShape(sh);
        placed.push({ x, y, r: sh.br });
        ok = true; want--;
      }
    }
    if (!ok) tier++;
  }

  // rare traits, the way a trait table has rare rows
  if (rnd() < 0.10) {
    // a vermilion thread-line straight across the print
    ctx.save();
    ctx.strokeStyle = '#b23a24';
    ctx.lineWidth = Math.max(1.2, S * 0.0035);
    ctx.beginPath();
    if (rnd() < 0.5) { const y = M + rnd() * (S - 2 * M); ctx.moveTo(M * 0.6, y); ctx.lineTo(S - M * 0.6, y); }
    else { const x = M + rnd() * (S - 2 * M); ctx.moveTo(x, M * 0.6); ctx.lineTo(x, S - M * 0.6); }
    ctx.stroke();
    ctx.restore();
  }
  if (rnd() < 0.08) {
    // one small dot in a contrasting color
    const dc = pickWeighted(rnd, PAL);
    const dr = S * (0.008 + rnd() * 0.008);
    let dx = 0, dy = 0, ok = false;
    for (let t = 0; t < 60 && !ok; t++) {
      dx = M + rnd() * (S - 2 * M); dy = M + rnd() * (S - 2 * M);
      if (!collides(dx, dy, dr)) ok = true;
    }
    if (ok) {
      ctx.fillStyle = dc;
      ctx.beginPath(); ctx.arc(dx, dy, dr, 0, TAU); ctx.fill();
    }
  }

  // paper grain: restrained
  for (let i = 0; i < 2500; i++) {
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(60,45,25,0.045)' : 'rgba(255,252,240,0.05)';
    ctx.fillRect(rnd() * S, rnd() * S, 1.4, 1.4);
  }

  ctx.restore();
}

resize();
</script>
</body>
</html>
