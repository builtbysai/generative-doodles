<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fifty Instruments, No Solo</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0B0B0C; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.683 "Fifty Instruments, No Solo" (EXPANSION #83 lachimuchina,
  // block 3). The ensemble's no-protagonism rule as a swarm: fifty
  // small agents on a black field, ten in each of five motion
  // families, nobody larger or brighter than anyone else, nobody in
  // white. The families breathe in staggered phases on a 60 s master
  // cycle, like sections of an ensemble entering and leaving, and the
  // texture is the piece. Watch-only; a drag is weather passing
  // through the swarm, which parts around it and rejoins. Nothing is
  // selectable, nothing reloads, there is no text and no sound.

  var EMBER = '#E08A4C';  // blowers
  var CLAY  = '#A4552F';  // strikers
  var MAUVE = '#A66A6B';  // rattlers
  var WATER = '#5B8FA6';  // shakers
  var BONE  = '#E4D3B8';  // singers
  var GROUND = '#0B0B0C';

  var FAM_COLORS = [EMBER, CLAY, MAUVE, WATER, BONE];
  // Trail history lengths in seconds, per family. Rattlers tremor in
  // place and get a three-ghost smear instead of a trail.
  var FAM_TRAIL = [1.2, 0.45, 0.0, 1.0, 3.0];
  var TRAIL_STEP = 0.06;
  var MASTER = 60;            // master breathing cycle, seconds
  var BASE_SEED = 683001;

  var FAM = { BLOWER: 0, STRIKER: 1, RATTLER: 2, SHAKER: 3, SINGER: 4 };

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function rgba(h, a) {
    var c = hexRGB(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  var CX = 0.5, CY = 0.5;

  // ------------------------------------------------------------------
  // AGENTS. Fifty, ten per family. Homes are center-weighted (radius
  // to the power 1.6) so the mass gathers mid-field and thins to the
  // edges; that distribution, plus bounded excursions, is the weak
  // cohesion that keeps the swarm one body. Every position is a pure
  // function of time, so frame one and every trail behind it are
  // exact, with no integration state to drift.
  // ------------------------------------------------------------------
  var agents = [];
  (function buildAgents() {
    var rng = mulberry32(BASE_SEED);
    for (var f = 0; f < 5; f++) {
      for (var i = 0; i < 10; i++) {
        var ang = rng() * Math.PI * 2;
        var rad = 0.44 * Math.pow(rng(), 1.6);
        var hx = CX + Math.cos(ang) * rad;
        var hy = CY + Math.sin(ang) * rad;
        var a = {
          fam: f, hx: hx, hy: hy,
          p1: rng() * Math.PI * 2, p2: rng() * Math.PI * 2,
          p3: rng() * Math.PI * 2, p4: rng() * Math.PI * 2,
          s1: 0.7 + rng() * 0.6, s2: 0.7 + rng() * 0.6,
          dir: rng() < 0.5 ? -1 : 1
        };
        if (f === FAM.BLOWER) {
          a.orbit = 0.018 + rng() * 0.030;        // orbit radius
          a.omega = (0.45 + rng() * 0.5) * a.dir; // slow
        } else if (f === FAM.STRIKER) {
          var ux = hx - CX, uy = hy - CY;
          var ul = Math.sqrt(ux * ux + uy * uy) || 1;
          a.ux = ux / ul; a.uy = uy / ul;         // radial direction
          a.d0 = rad;
          a.amp = 0.030 + rng() * 0.040;          // dart throw
          a.omega = 2.2 + rng() * 1.6;            // quick
        } else if (f === FAM.RATTLER) {
          a.ja = 0.0035 + rng() * 0.0025;         // tremor amplitude
          a.f1 = 7 + rng() * 6; a.f2 = 9 + rng() * 6;
        } else if (f === FAM.SHAKER) {
          a.pend = 0.042 + rng() * 0.020;         // pendulum arm
          a.swing = 0.75 + rng() * 0.35;          // swing amplitude
          a.omega = 1.5 + rng() * 0.7;
        } else { // SINGER
          a.drift = 0.020 + rng() * 0.016;        // slow base drift
          a.omega = 0.30 + rng() * 0.22;
          a.weave = 0.010 + rng() * 0.006;        // sine bob
          a.wfreq = 1.6 + rng() * 0.7;
        }
        agents.push(a);
      }
    }
  })();

  // ------------------------------------------------------------------
  // MASTER BREATH. Family f runs on its own warped clock: the
  // integral of a rate that swells and recedes on the 60 s cycle,
  // phase-staggered by family so sections enter and leave in turn.
  // Activity also sets the family's brightness.
  // ------------------------------------------------------------------
  var OMEGA_M = Math.PI * 2 / MASTER;
  function famPhase(f) { return f * (Math.PI * 2 / 5); }
  function famTime(f, t) {
    var amp = 0.45, ph = famPhase(f);
    // integral of (1 + amp*sin(OMEGA_M*t - ph)) dt, zero at t = 0
    return t + (amp / OMEGA_M) * (Math.cos(OMEGA_M * t - ph) - Math.cos(ph)) * -1;
  }
  function famActivity(f, t) {
    return 0.62 + 0.38 * Math.sin(OMEGA_M * t - famPhase(f) + Math.PI / 2);
  }

  // Position of an agent at absolute time t (before drag weather).
  function agentPos(a, t, out) {
    var tau = famTime(a.fam, t);
    var x, y;
    if (a.fam === FAM.BLOWER) {
      var th = a.p1 + a.omega * tau;
      x = a.hx + Math.cos(th) * a.orbit;
      y = a.hy + Math.sin(th) * a.orbit * 0.82;
    } else if (a.fam === FAM.STRIKER) {
      var d = a.d0 + a.amp * Math.sin(a.omega * tau + a.p1);
      x = CX + a.ux * d;
      y = CY + a.uy * d;
    } else if (a.fam === FAM.RATTLER) {
      x = a.hx + a.ja * (Math.sin(a.f1 * tau + a.p1) + 0.6 * Math.sin(a.f2 * tau + a.p2));
      y = a.hy + a.ja * (Math.sin(a.f1 * 1.13 * tau + a.p3) + 0.6 * Math.sin(a.f2 * 0.87 * tau + a.p4));
    } else if (a.fam === FAM.SHAKER) {
      var psi = a.swing * Math.sin(a.omega * tau + a.p1);
      x = a.hx + Math.sin(psi) * a.pend;
      y = a.hy - (1 - Math.cos(psi)) * a.pend;
    } else { // SINGER
      var bx = a.hx + Math.cos(a.p1 + a.omega * tau * a.dir) * a.drift;
      var by = a.hy + Math.sin(a.p1 + a.omega * tau * a.dir) * a.drift;
      var hd = a.p2 + a.omega * tau * a.dir;      // local heading
      var wob = a.weave * Math.sin(a.wfreq * tau + a.p3);
      x = bx + Math.cos(hd + Math.PI / 2) * wob;
      y = by + Math.sin(hd + Math.PI / 2) * wob;
    }
    out.x = x; out.y = y;
    return out;
  }

  // ------------------------------------------------------------------
  // DRAG WEATHER. Pointer events are recorded with anchored times;
  // the displacement at time t is a pure function of that record.
  // While dragging, strength is 1 at the pointer; on release it
  // decays over about a second and the swarm rejoins.
  // ------------------------------------------------------------------
  var drag = { active: false, x: 0, y: 0, downT: 0, upT: -1 };
  var INFL = 0.30;   // influence radius in composition units
  function dragStrength(t) {
    if (drag.active) return 1;
    if (drag.upT < 0) return 0;
    var dt = t - drag.upT;
    if (dt < 0 || dt > 2.5) return 0;
    return Math.exp(-dt / 0.8);
  }
  var tmpP = { x: 0, y: 0 };
  function finalPos(a, t, out) {
    agentPos(a, t, out);
    var s = dragStrength(t);
    if (s <= 0) return out;
    var vx = out.x - drag.x, vy = out.y - drag.y;
    var d = Math.sqrt(vx * vx + vy * vy);
    if (d >= INFL || d < 1e-6) return out;
    var push = (INFL - d) * 0.42 * s;
    out.x += (vx / d) * push;
    out.y += (vy / d) * push;
    return out;
  }

  // ------------------------------------------------------------------
  // VIEW. Canvas sized from the Visual Viewport API. Desktop: the
  // square composition letterboxes, centered. Phones: the field goes
  // full-bleed, the unit square stretched over the whole viewport.
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, scale = 1, orgX = 0, orgY = 0, isPhone = false, fullBleed = false;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    fullBleed = isPhone;
    if (fullBleed) {
      scale = 0; orgX = 0; orgY = 0;   // anisotropic map, handled in px()
    } else {
      scale = Math.min(W, H);
      orgX = (W - scale) / 2;
      orgY = (H - scale) / 2;
    }
  }
  function pxX(x) { return fullBleed ? x * W : orgX + x * scale; }
  function pxY(y) { return fullBleed ? y * H : orgY + y * scale; }
  function unit() { return fullBleed ? Math.min(W, H) : scale; }  // size reference
  function toComp(cx, cy) {
    if (fullBleed) return { x: cx / W, y: cy / H };
    return { x: (cx - orgX) / scale, y: (cy - orgY) / scale };
  }

  // ------------------------------------------------------------------
  // DRAW. Trails are short per-agent histories recomputed from the
  // position function at past times and stroked with falling alpha,
  // so the texture stays readable and nothing accumulates.
  // ------------------------------------------------------------------
  function drawAgent(a, t) {
    var col = FAM_COLORS[a.fam];
    var act = famActivity(a.fam, t);
    var headA = 0.50 + 0.38 * act;
    var u = unit();
    var rHead = 0.0032 * u;

    var trail = FAM_TRAIL[a.fam];
    if (trail > 0) {
      var steps = Math.round(trail / TRAIL_STEP);
      ctx.lineWidth = Math.max(1, 0.0016 * u);
      ctx.lineCap = 'round';
      for (var k = steps; k >= 1; k--) {
        var t0 = t - k * TRAIL_STEP, t1 = t - (k - 1) * TRAIL_STEP;
        finalPos(a, t0, tmpP); var x0 = pxX(tmpP.x), y0 = pxY(tmpP.y);
        finalPos(a, t1, tmpP); var x1 = pxX(tmpP.x), y1 = pxY(tmpP.y);
        var fade = 1 - k / (steps + 1);
        ctx.strokeStyle = rgba(col, 0.34 * fade * (0.4 + 0.6 * act));
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      }
    }
    finalPos(a, t, tmpP);
    var hx = pxX(tmpP.x), hy = pxY(tmpP.y);

    if (a.fam === FAM.BLOWER) {
      // a short arc riding the orbit, tangent to travel
      var tau = famTime(a.fam, t);
      var th = a.p1 + a.omega * tau;
      var tang = th + (a.omega >= 0 ? Math.PI / 2 : -Math.PI / 2);
      ctx.strokeStyle = rgba(col, headA);
      ctx.lineWidth = Math.max(1.1, 0.0022 * u);
      ctx.beginPath();
      ctx.arc(hx, hy, 0.0075 * u, tang - 0.95, tang + 0.95);
      ctx.stroke();
    } else if (a.fam === FAM.STRIKER) {
      // a short radial dart, length with the dart's speed
      var tau2 = famTime(a.fam, t);
      var sp = Math.abs(Math.cos(a.omega * tau2 + a.p1));
      var len = (0.006 + 0.011 * sp) * u;
      var ux = pxX(a.hx + a.ux * 0.01) - pxX(a.hx);
      var uy = pxY(a.hy + a.uy * 0.01) - pxY(a.hy);
      var ul = Math.sqrt(ux * ux + uy * uy) || 1;
      ux /= ul; uy /= ul;
      ctx.strokeStyle = rgba(col, headA);
      ctx.lineWidth = Math.max(1.1, 0.0022 * u);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hx - ux * len * 0.5, hy - uy * len * 0.5);
      ctx.lineTo(hx + ux * len * 0.5, hy + uy * len * 0.5);
      ctx.stroke();
    } else if (a.fam === FAM.RATTLER) {
      // the tremor itself: one dot now, two ghosts a breath behind
      ctx.fillStyle = rgba(col, headA * 0.45);
      finalPos(a, t - 0.09, tmpP);
      ctx.beginPath(); ctx.arc(pxX(tmpP.x), pxY(tmpP.y), rHead * 0.8, 0, Math.PI * 2); ctx.fill();
      finalPos(a, t - 0.045, tmpP);
      ctx.beginPath(); ctx.arc(pxX(tmpP.x), pxY(tmpP.y), rHead * 0.9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba(col, headA);
      ctx.beginPath(); ctx.arc(hx, hy, rHead, 0, Math.PI * 2); ctx.fill();
    } else if (a.fam === FAM.SHAKER) {
      // a dot on its swing, with a faint arc of the swing's path
      var tau4 = famTime(a.fam, t);
      var psi = a.swing * Math.sin(a.omega * tau4 + a.p1);
      var pivX = pxX(a.hx), pivY = pxY(a.hy - a.pend);
      ctx.strokeStyle = rgba(col, headA * 0.16);
      ctx.lineWidth = Math.max(1, 0.0014 * u);
      ctx.beginPath();
      ctx.arc(pivX, pivY, a.pend * u, Math.PI / 2 - a.swing, Math.PI / 2 + a.swing);
      ctx.stroke();
      ctx.fillStyle = rgba(col, headA);
      ctx.beginPath(); ctx.arc(hx, hy, rHead, 0, Math.PI * 2); ctx.fill();
    } else { // SINGER: the weave is in the trail; the head is a plain dot
      ctx.fillStyle = rgba(col, headA);
      ctx.beginPath(); ctx.arc(hx, hy, rHead, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < agents.length; i++) drawAgent(agents[i], t);
  }

  // ------------------------------------------------------------------
  // CLOCK + EVENTS. The loop clock anchors at load; frame one is the
  // synchronous draw at t = 0 below. Nothing reads Date.now().
  // ------------------------------------------------------------------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - t0) / 1000;
    }
    return 0;
  }
  function evPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return toComp(cx - r.left, cy - r.top);
  }
  function onDown(e) {
    var p = evPos(e);
    drag.active = true; drag.x = p.x; drag.y = p.y;
    drag.downT = elapsed(); drag.upT = -1;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!drag.active) return;
    var p = evPos(e);
    drag.x = p.x; drag.y = p.y;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() {
    if (!drag.active) return;
    drag.active = false;
    drag.upT = elapsed();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('touchstart', onDown);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onUp);
    window.addEventListener('resize', function () { resize(); draw(elapsed()); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(elapsed()); });
    }
  }

  // QA hook: ?seed=t<seconds> forces a fixed frame time so later
  // master phases can be rendered headlessly.
  var forcedT = -1;
  try {
    var m = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(
      (typeof location !== 'undefined' && location.search) || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (err) { forcedT = -1; }

  resize();
  draw(forcedT >= 0 ? forcedT : 0);
  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () { draw(elapsed()); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
