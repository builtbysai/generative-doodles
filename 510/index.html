<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evasion</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1E5FC0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (flat fills only)
  var BLUE = '#1E5FC0', BARS = '#E8541A', FIG = '#F2F0EA', HAIR = '#F2C41C', INK = '#1A3A6B';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var BASE_SEED = 510001;
  var seed = BASE_SEED;
  var cfg = null;

  function buildConfig(s) {
    var rng = mulberry32(s);
    var barCount = 9 + Math.floor(rng() * 5);       // 9..13
    var prop = Math.floor(rng() * 3);               // 0 key, 1 coin, 2 match
    var pose = Math.floor(rng() * 3);               // 0 crouch, 1 sit, 2 stand
    var hairSway = (rng() - 0.5) * 0.01;
    var headTilt = (rng() - 0.5) * 0.05;
    return { barCount: barCount, prop: prop, pose: pose, hairSway: hairSway, headTilt: headTilt };
  }
  cfg = buildConfig(seed);

  // Interaction / physics state
  var part = 0;            // how far the bars have parted, in stage px
  var partVel = 0;
  var dragging = false;
  var dragStartX = 0, dragStartPart = 0;
  var eyesOpen = false;
  var propState = 'mouth'; // mouth | falling | dropped
  var propY = 0, propVY = 0, propX = 0, propRot = 0;

  var W = 0, H = 0, S = 0, OX = 0, OY = 0;

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw();
  }

  function isPhone() {
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    if (sw < 700) return true;
    return H > W * 1.15;
  }

  // ---- figure geometry per pose (stage units, origin at stage top-left) ----
  function poseGeom() {
    if (cfg.pose === 1) { // sit
      return { head: { x: 0.50, y: 0.335, r: 0.082 }, floorY: 0.80 };
    }
    if (cfg.pose === 2) { // stand
      return { head: { x: 0.50, y: 0.225, r: 0.080 }, floorY: 0.86 };
    }
    return { head: { x: 0.50, y: 0.44, r: 0.086 }, floorY: 0.80 }; // crouch
  }

  function ellipse(x, y, rx, ry, rot, fill, stroke, lw) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line(x1, y1, x2, y2, col, lw) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
  }

  function drawFigure(u) {
    var g = poseGeom();
    var hx = g.head.x * u, hy = g.head.y * u, hr = g.head.r * u;
    var lw = Math.max(1.2, 0.0038 * u);
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(cfg.headTilt); ctx.translate(-hx, -hy);

    if (cfg.pose === 0) {
      // crouch: hunched torso mass, knees up, feet flat
      ellipse(0.50 * u, 0.635 * u, 0.155 * u, 0.125 * u, 0, FIG, INK, lw);          // torso
      ellipse(0.375 * u, 0.615 * u, 0.048 * u, 0.058 * u, 0.2, FIG, INK, lw);       // near knee
      ellipse(0.615 * u, 0.63 * u, 0.042 * u, 0.05 * u, -0.2, FIG, INK, lw);        // far knee
      ellipse(0.40 * u, 0.565 * u, 0.085 * u, 0.028 * u, 0.55, FIG, INK, lw);       // arm reaching down
      // feet: near foot bare, far foot with striped sock
      ellipse(0.345 * u, 0.775 * u, 0.038 * u, 0.016 * u, 0, FIG, INK, lw);
      drawSock(0.635 * u, 0.775 * u, u, lw);
    } else if (cfg.pose === 1) {
      // sit: upright torso, legs stretched forward
      ellipse(0.50 * u, 0.52 * u, 0.105 * u, 0.155 * u, 0, FIG, INK, lw);           // torso
      ellipse(0.615 * u, 0.715 * u, 0.115 * u, 0.032 * u, 0.06, FIG, INK, lw);      // legs forward
      ellipse(0.60 * u, 0.475 * u, 0.08 * u, 0.026 * u, 0.7, FIG, INK, lw);         // arm
      ellipse(0.715 * u, 0.745 * u, 0.034 * u, 0.015 * u, 0, FIG, INK, lw);         // bare foot
      drawSock(0.36 * u, 0.745 * u, u, lw);
    } else {
      // stand: tall torso, straight legs
      ellipse(0.50 * u, 0.485 * u, 0.10 * u, 0.21 * u, 0, FIG, INK, lw);            // torso
      ellipse(0.465 * u, 0.755 * u, 0.03 * u, 0.085 * u, 0.03, FIG, INK, lw);       // leg
      ellipse(0.54 * u, 0.755 * u, 0.03 * u, 0.085 * u, -0.03, FIG, INK, lw);       // leg
      ellipse(0.595 * u, 0.44 * u, 0.075 * u, 0.024 * u, 0.9, FIG, INK, lw);        // arm
      ellipse(0.445 * u, 0.845 * u, 0.036 * u, 0.015 * u, 0, FIG, INK, lw);         // bare foot
      drawSock(0.555 * u, 0.845 * u, u, lw);
    }

    // head (white) + blonde hair cap and side strand
    ellipse(hx, hy, hr, hr * 0.94, 0, FIG, null, 0);
    ctx.beginPath(); // hair: top cap
    ctx.ellipse(hx, hy - hr * 0.16, hr * 1.02, hr * 0.82, 0, Math.PI * 1.02, Math.PI * 1.98);
    ctx.quadraticCurveTo(hx + hr * 0.4, hy - hr * 0.28, hx, hy - hr * 0.22);
    ctx.quadraticCurveTo(hx - hr * 0.4, hy - hr * 0.28, hx - hr * 1.02, hy - hr * 0.16 + hr * 0.82 * 0);
    ctx.closePath(); ctx.fillStyle = HAIR; ctx.fill();
    ellipse(hx - hr * 0.92, hy + hr * 0.28, hr * 0.20, hr * 0.52, 0.12, HAIR, null, 0); // side strand
    ellipse(hx, hy, hr, hr * 0.94, 0, null, INK, lw);                                // head outline

    drawFace(hx, hy, hr, u, lw);
    ctx.restore();

    // mouth prop (may be falling / dropped)
    var mp = mouthPos(u);
    if (propState === 'mouth') {
      drawProp(mp.x, mp.y, 0, u);
    } else {
      drawProp(propX, propY, propRot, u);
    }
  }

  function drawSock(x, y, u, lw) {
    // white foot with blue stripes at the ankle
    ellipse(x, y, 0.038 * u, 0.016 * u, 0, FIG, INK, lw);
    ctx.save();
    ctx.beginPath(); ctx.ellipse(x, y, 0.038 * u, 0.016 * u, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = BLUE;
    ctx.fillRect(x - 0.030 * u, y - 0.018 * u, 0.008 * u, 0.036 * u);
    ctx.fillRect(x - 0.016 * u, y - 0.018 * u, 0.008 * u, 0.036 * u);
    ctx.restore();
  }

  function mouthPos(u) {
    var g = poseGeom();
    return { x: (g.head.x + 0.012) * u, y: (g.head.y + g.head.r * 0.52) * u };
  }

  function drawFace(hx, hy, hr, u, lw) {
    var ex = hr * 0.34, ey = hy + hr * 0.02;
    ctx.lineCap = 'round';
    if (eyesOpen) {
      // open: upward arc eyes with pupils
      ctx.beginPath(); ctx.arc(hx - ex, ey, hr * 0.16, Math.PI * 1.08, Math.PI * 1.92); ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
      ctx.beginPath(); ctx.arc(hx + ex, ey, hr * 0.16, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx - ex, ey + hr * 0.03, hr * 0.055, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill();
      ctx.beginPath(); ctx.arc(hx + ex, ey + hr * 0.03, hr * 0.055, 0, Math.PI * 2); ctx.fill();
    } else {
      // closed: gentle downward curves
      ctx.beginPath(); ctx.arc(hx - ex, ey - hr * 0.05, hr * 0.15, Math.PI * 0.15, Math.PI * 0.85); ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
      ctx.beginPath(); ctx.arc(hx + ex, ey - hr * 0.05, hr * 0.15, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    }
    // L-nose
    ctx.beginPath();
    ctx.moveTo(hx + hr * 0.05, ey + hr * 0.10);
    ctx.lineTo(hx - hr * 0.02, ey + hr * 0.34);
    ctx.lineTo(hx + hr * 0.10, ey + hr * 0.36);
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
    // small mouth
    var mp = mouthPos(1);
    ctx.beginPath();
    ctx.arc(hx + hr * 0.10, hy + hr * 0.47, hr * 0.09, Math.PI * 0.1, Math.PI * 0.9);
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
  }

  function drawProp(x, y, rot, u) {
    var lw = Math.max(1.1, 0.0032 * u);
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    if (cfg.prop === 0) {
      // key: stem from mouth, bow circle, two teeth. Brightest element.
      // Kept compact so the whole glyph stays inside the central bar gap.
      ctx.strokeStyle = HAIR; ctx.lineWidth = 0.009 * u; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-0.006 * u, 0); ctx.lineTo(0.014 * u, 0.003 * u); ctx.stroke();
      ctx.beginPath(); ctx.arc(0.023 * u, 0.004 * u, 0.0085 * u, 0, Math.PI * 2);
      ctx.fillStyle = HAIR; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
      ctx.strokeStyle = HAIR; ctx.lineWidth = 0.007 * u;
      ctx.beginPath(); ctx.moveTo(0.008 * u, 0.003 * u); ctx.lineTo(0.008 * u, 0.013 * u); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0.015 * u, 0.004 * u); ctx.lineTo(0.015 * u, 0.011 * u); ctx.stroke();
    } else if (cfg.prop === 1) {
      // coin
      ctx.beginPath(); ctx.arc(0.012 * u, 0.004 * u, 0.013 * u, 0, Math.PI * 2);
      ctx.fillStyle = HAIR; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
      ctx.beginPath(); ctx.arc(0.012 * u, 0.004 * u, 0.007 * u, 0, Math.PI * 2);
      ctx.strokeStyle = INK; ctx.lineWidth = lw * 0.7; ctx.stroke();
    } else {
      // match: stick with bright head
      ctx.strokeStyle = FIG; ctx.lineWidth = 0.007 * u; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-0.010 * u, 0.006 * u); ctx.lineTo(0.020 * u, -0.002 * u); ctx.stroke();
      ctx.beginPath(); ctx.arc(0.026 * u, -0.004 * u, 0.009 * u, 0, Math.PI * 2);
      ctx.fillStyle = BARS; ctx.fill();
    }
    ctx.restore();
  }

  function drawBars(u) {
    var n = cfg.barCount;
    var pitch = u / n;
    var bw = 0.04 * u;
    // shift the layer so a gap (not a bar) is centred on the face at 0.5u
    var delta = 0.5 * u - Math.round((0.5 * u) / pitch) * pitch;
    ctx.fillStyle = BARS;
    for (var i = -1; i <= n; i++) {
      var home = delta + i * pitch + (pitch - bw) / 2;
      var center = home + bw / 2;
      var off = (center < u / 2) ? -part : part;
      ctx.fillRect(home + off, 0, bw, u);
    }
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = BLUE;
    ctx.fillRect(0, 0, W, H);
    if (S <= 0) return;
    ctx.save();
    ctx.translate(OX, OY);
    ctx.beginPath(); ctx.rect(0, 0, S, S); ctx.clip();
    // ground inside stage
    ctx.fillStyle = BLUE; ctx.fillRect(0, 0, S, S);
    // soft floor band (flat, darker blue line work only, no gradient)
    drawFigure(S);
    drawBars(S);
    ctx.restore();
    // hint
    ctx.fillStyle = 'rgba(242,240,234,0.55)';
    ctx.font = Math.max(11, S * 0.022) + 'px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag', OX + S * 0.025, OY + S * 0.965);
  }

  // ---- animation / physics ----
  var lastT = null;
  function frame(t) {
    if (lastT === null) lastT = t;
    var dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
    if (!dragging) {
      // spring back to closed
      var k = 90, c = 13;
      partVel += (-k * part - c * partVel) * dt;
      part += partVel * dt;
      if (Math.abs(part) < 0.05 && Math.abs(partVel) < 0.5) { part = 0; partVel = 0; }
    }
    var reveal = part / (0.16 * S || 1);
    var wasOpen = eyesOpen;
    eyesOpen = reveal > 0.4;
    if (eyesOpen && !wasOpen && propState === 'mouth') {
      var mp = mouthPos(S);
      propState = 'falling'; propX = mp.x; propY = mp.y; propVY = 0; propRot = 0;
    }
    if (!eyesOpen && propState !== 'mouth') {
      propState = 'mouth';
    }
    if (propState === 'falling') {
      var g = poseGeom();
      var floor = g.floorY * S + 0.03 * S;
      propVY += 1500 * (S / 720) * dt;
      propY += propVY * dt;
      propRot += dt * 3;
      if (propY >= floor) {
        propY = floor;
        propVY = -propVY * 0.42;
        propRot = 0.3;
        if (Math.abs(propVY) < 60) { propState = 'dropped'; propVY = 0; }
      }
    }
    draw();
    if (typeof window.requestAnimationFrame === 'function') {
      window.requestAnimationFrame(frame);
    }
  }

  // NOTE: prop falling coordinates are in stage space; drawFigure draws inside
  // the stage transform, so propX/propY are stage-space. Fixed in drawProp call.

  // ---- input ----
  var lastTapT = 0, lastTapX = 0, lastTapY = 0, downX = 0, downY = 0, moved = false;

  function ptr(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  function onDown(e) {
    var p = ptr(e);
    downX = p.x; downY = p.y; moved = false;
    dragging = true; dragStartX = p.x; dragStartPart = part; partVel = 0;
  }
  function onMove(e) {
    if (!dragging) return;
    var p = ptr(e);
    if (Math.abs(p.x - downX) > 4 || Math.abs(p.y - downY) > 4) moved = true;
    part = Math.max(0, Math.min(0.30 * S, dragStartPart + Math.abs(p.x - dragStartX) * 0.9));
    draw();
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var now = performance.now ? performance.now() : 0;
    var p = ptr(e.changedTouches && e.changedTouches.length ? { touches: e.changedTouches } : e);
    if (!moved && now - lastTapT < 320 && Math.abs(p.x - lastTapX) < 30 && Math.abs(p.y - lastTapY) < 30) {
      // double-tap reseed
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      cfg = buildConfig(seed);
      part = 0; partVel = 0; propState = 'mouth'; eyesOpen = false;
      lastTapT = 0;
    } else if (!moved) {
      lastTapT = now; lastTapX = p.x; lastTapY = p.y;
    }
    draw();
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  function onResize() { resize(); }
  window.addEventListener('resize', onResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

  resize();
  draw(); // synchronous first frame at rest: bars closed, eyes closed, prop in mouth
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
