<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yo Organizo el Caos</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF7F0; overflow: hidden; }
  canvas { display: block; cursor: grab; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var TAU = Math.PI * 2;
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, u) { return a + (b - a) * u; }

// ---------- palette (strict, julia-barata block 3) ----------
var INK = "#1A1A1A";
var PAPER = "#FAF7F0";
var RED = "#D42B1E";    // one figure's garment + the tiny pipe in the band. Nothing else.
var KRAFT = "#C8A97E";  // title band only

var HAND = "'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive";

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone() {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0 && mn < 700) return true;
  return H > W * 1.15;
}

function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  draw(currentPhase());
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
}
window.addEventListener("resize", resize);

// ---------- animation state ----------
// All motion is anchored to a fixed phase offset (PHASE0 + elapsed since
// load), never to the wall clock: the first frame is a composed still
// with every element resting exactly on its ghost-grid slot.
var PHASE0 = 1.35;
var startStamp = null;

function currentPhase() {
  if (startStamp === null) return PHASE0;
  var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  return PHASE0 + (now - startStamp) / 1000;
}

// ---------- the ghost grid ----------
// Her architect's grid under the punk scatter: 4 x 4 slots below the band.
// Every element's home is a slot center. Nothing ever rests off-grid.
var GRID_X = 36, GRID_Y = 140, GRID_W = 928, GRID_H = 832;
var COLS = 4, ROWS = 4;
var CELL_W = GRID_W / COLS, CELL_H = GRID_H / ROWS;
function slotCenter(i) {
  var c = i % COLS, r = Math.floor(i / COLS);
  return { x: GRID_X + (c + 0.5) * CELL_W, y: GRID_Y + (r + 0.5) * CELL_H };
}
var gridA = 0.10, gridTarget = 0.10;   // tap the background: 0.10 <-> 0.35

// ---------- the elements ----------
// type, slot, base rotation, hit radius. Poses are hand-placed: composed
// chaos, every element deliberate, nothing decorative.
var DEFS = [
  { type: "tumble",  slot: 0,  rot: 0.50,  hit: 84 },
  { type: "speech",  slot: 1,  rot: -0.07, hit: 78, text: "¡ay!" },
  { type: "pipe",    slot: 2,  rot: 0.12,  hit: 76 },
  { type: "fall",    slot: 3,  rot: 2.75,  hit: 84 },
  { type: "suitcase",slot: 4,  rot: -0.04, hit: 88 },
  { type: "chair",   slot: 5,  rot: -0.95, hit: 82 },
  { type: "speech",  slot: 6,  rot: 0.09,  hit: 78, text: "¿eh?" },
  { type: "kettle",  slot: 7,  rot: 0.05,  hit: 78 },
  { type: "speech",  slot: 8,  rot: -0.10, hit: 74, text: "uff" },
  { type: "redfig",  slot: 9,  rot: -0.06, hit: 82 },
  { type: "umbrella",slot: 10, rot: 0.35,  hit: 84 },
  { type: "speech",  slot: 11, rot: 0.06,  hit: 78, text: "m..." },
  { type: "wave",    slot: 12, rot: 0.10,  hit: 82 },
  { type: "crouch",  slot: 14, rot: -0.12, hit: 82 }
];
var elements = [];
(function () {
  var rng = mulberry32(587001);
  for (var i = 0; i < DEFS.length; i++) {
    var d = DEFS[i], home = slotCenter(d.slot);
    elements.push({
      def: d, hx: home.x, hy: home.y,
      x: home.x, y: home.y, vx: 0, vy: 0,
      phase: rng() * TAU,          // breathing-jitter phase, fixed by seed
      dragging: false
    });
  }
})();

// faint paper speckle, seeded
var speckle = [];
(function () {
  var r = mulberry32(587002);
  for (var i = 0; i < 220; i++) {
    speckle.push({ x: r() * 1000, y: r() * 1000, a: 0.02 + r() * 0.035, l: 3 + r() * 4 });
  }
})();

// per-letter wobble for the band title, fixed by seed
function charWobble(str, i) {
  var r = mulberry32(587100 + i * 41 + str.length);
  return { dx: (r() - 0.5) * 2.4, dy: (r() - 0.5) * 3.2, rot: (r() - 0.5) * 0.06, s: 0.95 + r() * 0.1 };
}

// ---------- physics ----------
// Spring per element. While dragged, the spring chases the pointer
// (stiff, slightly underdamped: lag and overshoot, the fling feel).
// Released, a softer underdamped spring carries it home to its slot.
var lastPhase = PHASE0;
function stepPhysics(phase) {
  var dt = clamp(phase - lastPhase, 0, 0.05);
  lastPhase = phase;
  if (dt <= 0) return;
  var n = Math.max(1, Math.ceil(dt / (1 / 240)));
  var h = dt / n, s, i, e, tx, ty, k, c, ax, ay;
  for (s = 0; s < n; s++) {
    for (i = 0; i < elements.length; i++) {
      e = elements[i];
      if (e.dragging) { tx = pointer.x; ty = pointer.y; k = 110; c = 16; }
      else { tx = e.hx; ty = e.hy; k = 60; c = 10; }
      ax = k * (tx - e.x) - c * e.vx;
      ay = k * (ty - e.y) - c * e.vy;
      e.vx += ax * h; e.vy += ay * h;
      e.x += e.vx * h; e.y += e.vy * h;
      // no sprawl: the stage walls hold the chaos in
      if (e.x < 44) { e.x = 44; e.vx = 0; }
      if (e.x > 956) { e.x = 956; e.vx = 0; }
      if (e.y < 150) { e.y = 150; e.vy = 0; }
      if (e.y > 968) { e.y = 968; e.vy = 0; }
    }
  }
  // grid visibility eases toward its target
  gridA += (gridTarget - gridA) * Math.min(1, dt * 5);
}

// ---------- pointer ----------
var pointer = { x: 500, y: 500 };
var dragEl = null;
var downInfo = null;

function stagePoint(e) {
  var S = Math.min(W, H) / 1000;
  return { x: (e.clientX - W / 2) / S + 500, y: (e.clientY - H / 2) / S + 500 };
}
function pickElement(p) {
  for (var i = elements.length - 1; i >= 0; i--) {
    var e = elements[i];
    var dx = p.x - e.x, dy = p.y - e.y, hr = e.def.hit * 1.22;
    if (dx * dx + dy * dy <= hr * hr) return e;
  }
  return null;
}
canvas.addEventListener("pointerdown", function (e) {
  var p = stagePoint(e);
  pointer.x = p.x; pointer.y = p.y;
  downInfo = { x: e.clientX, y: e.clientY, hit: false };
  var el = pickElement(p);
  if (el) {
    dragEl = el; el.dragging = true; downInfo.hit = true;
    el.vx = 0; el.vy = 0;
  }
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener("pointermove", function (e) {
  if (!dragEl) return;
  var p = stagePoint(e);
  pointer.x = p.x; pointer.y = p.y;
});
function endPointer(e) {
  if (dragEl) { dragEl.dragging = false; dragEl = null; downInfo = null; return; }
  if (downInfo && e && typeof e.clientX === "number") {
    var moved = Math.abs(e.clientX - downInfo.x) + Math.abs(e.clientY - downInfo.y);
    if (!downInfo.hit && moved < 7) {
      // tap on the background: her architect past shows through, or fades
      gridTarget = (gridTarget < 0.2) ? 0.35 : 0.10;
    }
  }
  downInfo = null;
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", function () {
  if (dragEl) { dragEl.dragging = false; dragEl = null; }
  downInfo = null;
});

// ---------- drawing helpers ----------
function seg(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function head(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = PAPER; ctx.fill(); ctx.stroke();
}

// loose ink figures, drawn around a local origin at the slot center
function drawFigure(kind) {
  ctx.strokeStyle = INK;
  ctx.lineWidth = 6.5;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (kind === "tumble") {
    head(-34, -36, 15);
    poly([[-24, -22], [-6, 2], [14, 16]]);            // torso, pitched over
    poly([[-14, -10], [-52, -34]]);                   // arm flung up-back
    poly([[-10, -2], [40, -30]]);                     // arm flung forward
    poly([[14, 16], [-18, 50]]);                      // leg trailing
    poly([[14, 16], [50, 38]]);                       // leg kicked out
  } else if (kind === "fall" || kind === "wave" || kind === "redfig") {
    // standing figure (fall = same body, slot rotation turns it over)
    if (kind === "redfig") {
      // the ONE red garment: a filled torso
      ctx.beginPath();
      ctx.moveTo(-15, -30); ctx.lineTo(15, -30); ctx.lineTo(12, 20); ctx.lineTo(-12, 20);
      ctx.closePath();
      ctx.fillStyle = RED; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 5.5; ctx.stroke();
      ctx.lineWidth = 6.5;
    } else {
      seg(0, -28, 0, 18);
    }
    head(0, -46, 15);
    if (kind === "wave") {
      poly([[0, -18], [34, -50]]);                    // arm waved high
      poly([[0, -18], [-30, 4]]);
    } else {
      poly([[0, -18], [-30, 6]]);
      poly([[0, -18], [30, -4]]);
    }
    poly([[0, 18], [-20, 54]]);
    poly([[0, 18], [22, 54]]);
  } else if (kind === "crouch") {
    head(10, -26, 14);
    poly([[4, -12], [-6, 12], [-2, 26]]);             // bent torso
    poly([[-4, 2], [-30, 30]]);                       // arm reaching down
    poly([[0, 8], [28, 26]]);                         // arm braced forward
    poly([[-2, 26], [-28, 38], [-26, 56]]);           // folded leg
    poly([[-2, 26], [24, 40], [30, 56]]);             // folded leg
  }
}

function drawPipe(color, lw) {
  ctx.strokeStyle = color;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  var path = function () {
    ctx.beginPath();
    ctx.moveTo(-50, 34);
    ctx.lineTo(-50, -24);
    ctx.quadraticCurveTo(-50, -38, -36, -38);
    ctx.lineTo(8, -38);
    ctx.quadraticCurveTo(22, -38, 22, -24);
    ctx.lineTo(22, 8);
  };
  ctx.lineWidth = lw + 8; path(); ctx.stroke();       // pipe wall
  ctx.strokeStyle = PAPER; ctx.lineWidth = lw; path(); ctx.stroke(); // hollow bore line
  ctx.strokeStyle = color; ctx.lineWidth = 3;
  seg(-58, 34, -42, 34);                              // flange ticks
  seg(14, 8, 30, 8);
}

function drawSuitcase() {
  ctx.strokeStyle = INK; ctx.lineWidth = 5.5;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  // lid, swung open above the hinge
  ctx.save();
  ctx.translate(-56, -6); ctx.rotate(-0.42); ctx.translate(56, 6);
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-58, -60, 116, 54, 8); else ctx.rect(-58, -60, 116, 54);
  ctx.fillStyle = PAPER; ctx.fill(); ctx.stroke();
  seg(-58, -34, 58, -34);                             // lid strap line
  ctx.restore();
  // base
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-58, -6, 116, 44, 8); else ctx.rect(-58, -6, 116, 44);
  ctx.fillStyle = PAPER; ctx.fill(); ctx.stroke();
  seg(-20, -6, -20, 38); seg(24, -6, 24, 38);         // straps
  seg(-12, 48, 16, 48);                               // handle below
  ctx.beginPath(); ctx.arc(40, 20, 4, 0, TAU); ctx.fillStyle = INK; ctx.fill(); // clasp
}

function drawChair() {
  ctx.strokeStyle = INK; ctx.lineWidth = 6;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  poly([[-42, -58], [-42, 6]]);                       // back post
  seg(-42, -58, 30, -58);                             // top rail
  poly([[30, -58], [34, -8]]);                        // far post, raked
  seg(-42, -34, 32, -34);                             // mid rail
  ctx.beginPath();                                    // seat
  ctx.moveTo(-46, 4); ctx.lineTo(44, 4); ctx.lineTo(38, 16); ctx.lineTo(-40, 16);
  ctx.closePath(); ctx.fillStyle = PAPER; ctx.fill(); ctx.stroke();
  poly([[-38, 16], [-42, 52]]);                       // legs splayed by the fall
  poly([[36, 16], [46, 50]]);
  // two small motion ticks: it is mid-fall, not resting
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(-64, -30, 12, -0.6, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(-72, 6, 10, -0.6, 0.9); ctx.stroke();
}

function drawKettle() {
  ctx.strokeStyle = INK; ctx.lineWidth = 5.5;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();                                    // handle arc
  ctx.arc(0, -14, 30, Math.PI * 1.08, Math.PI * 1.92);
  ctx.stroke();
  ctx.beginPath();                                    // body
  ctx.moveTo(-36, 34);
  ctx.quadraticCurveTo(-42, -6, -18, -22);
  ctx.lineTo(20, -22);
  ctx.quadraticCurveTo(42, -4, 36, 34);
  ctx.closePath();
  ctx.fillStyle = PAPER; ctx.fill(); ctx.stroke();
  poly([[-32, -8], [-56, -26], [-50, -12]]);          // spout
  seg(-16, -22, 22, -22);                             // lid line
  ctx.beginPath(); ctx.arc(3, -28, 5, 0, TAU); ctx.fillStyle = INK; ctx.fill(); // knob
  seg(-30, 42, 32, 42);                               // base
}

function drawUmbrella() {
  ctx.strokeStyle = INK; ctx.lineWidth = 5.5;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  seg(0, -52, 0, 30);                                 // shaft
  ctx.beginPath();                                    // J handle
  ctx.arc(-8, 34, 8, 0, Math.PI, false);
  ctx.stroke();
  ctx.beginPath();                                    // canopy with scalloped rim
  ctx.moveTo(-60, 2);
  ctx.quadraticCurveTo(-58, -38, 0, -44);
  ctx.quadraticCurveTo(58, -38, 60, 2);
  ctx.quadraticCurveTo(45, -8, 30, 2);
  ctx.quadraticCurveTo(15, -8, 0, 2);
  ctx.quadraticCurveTo(-15, -8, -30, 2);
  ctx.quadraticCurveTo(-45, -8, -60, 2);
  ctx.closePath();
  ctx.fillStyle = PAPER; ctx.fill(); ctx.stroke();
  seg(0, -44, -30, 0); seg(0, -44, 30, 0);            // ribs
  seg(0, -44, 0, -56);                                // tip
}

function drawSpeech(text) {
  ctx.font = "700 31px " + HAND;
  var tw = ctx.measureText(text).width;
  var w = tw + 42, h = 58;
  ctx.strokeStyle = INK; ctx.lineWidth = 5;
  ctx.lineJoin = "round";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-w / 2, -h / 2, w, h, 14); else ctx.rect(-w / 2, -h / 2, w, h);
  ctx.fillStyle = PAPER; ctx.fill(); ctx.stroke();
  poly([[-w / 2 + 16, h / 2 - 2], [-w / 2 + 30, h / 2 - 2], [-w / 2 + 20, h / 2 + 16]]); // tail
  ctx.fillStyle = INK;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, 0, 2);
}

function drawElement(e, t) {
  var d = e.def;
  // breathing jitter: tiny, seeded per element, never fully still.
  // Render-only; the physics position underneath stays honest.
  var jAmp = e.dragging ? 1.1 : 2.3;
  var jx = Math.sin(t * 1.25 + e.phase) * jAmp;
  var jy = Math.cos(t * 1.05 + e.phase * 1.63) * jAmp * 0.9;
  var rj = Math.sin(t * 0.85 + e.phase) * 0.028;
  var spin = clamp(e.vx * 0.00035, -0.3, 0.3);        // fling lean
  ctx.save();
  ctx.translate(e.x + jx, e.y + jy);
  ctx.rotate(d.rot + rj + spin);
  ctx.scale(1.22, 1.22);   // drawn large in their slots: dense, not sparse
  switch (d.type) {
    case "tumble": drawFigure("tumble"); break;
    case "fall": drawFigure("fall"); break;
    case "wave": drawFigure("wave"); break;
    case "redfig": drawFigure("redfig"); break;
    case "crouch": drawFigure("crouch"); break;
    case "pipe": drawPipe(INK, 6); break;
    case "suitcase": drawSuitcase(); break;
    case "chair": drawChair(); break;
    case "kettle": drawKettle(); break;
    case "umbrella": drawUmbrella(); break;
    case "speech": drawSpeech(d.text); break;
  }
  ctx.restore();
}

// ---------- the band ----------
function drawBand() {
  ctx.fillStyle = KRAFT;
  ctx.fillRect(0, 0, 1000, 104);
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
  seg(0, 104, 1000, 104);
  // hand-lettered title, per-letter seeded wobble
  var title = "YO ORGANIZO EL CAOS";
  ctx.fillStyle = INK;
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.font = "700 45px " + HAND;
  var widths = [], total = 0, i;
  for (i = 0; i < title.length; i++) { var w = ctx.measureText(title[i]).width + 2.5; widths.push(w); total += w; }
  var x = 38;
  for (i = 0; i < title.length; i++) {
    var wob = charWobble(title, i);
    ctx.save();
    ctx.translate(x + widths[i] / 2 + wob.dx, 54 + wob.dy);
    ctx.rotate(wob.rot);
    ctx.scale(wob.s, wob.s);
    ctx.fillText(title[i], -widths[i] / 2, 0);
    ctx.restore();
    x += widths[i];
  }
  // the tiny red bent pipe, her Familia-cover doodle: the band's only red
  ctx.save();
  ctx.translate(928, 52);
  ctx.scale(0.52, 0.52);
  drawPipe(RED, 7);
  ctx.restore();
}

// ---------- draw ----------
function draw(phase) {
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  stepPhysics(phase);

  var S = Math.min(W, H) / 1000;
  ctx.translate(W / 2, H / 2);
  ctx.scale(S, S);
  ctx.translate(-500, -500);

  // paper speckle
  ctx.strokeStyle = INK; ctx.lineCap = "round"; ctx.lineWidth = 2;
  var i, j;
  for (i = 0; i < speckle.length; i++) {
    ctx.globalAlpha = speckle[i].a;
    ctx.beginPath();
    ctx.moveTo(speckle[i].x, speckle[i].y);
    ctx.lineTo(speckle[i].x + speckle[i].l, speckle[i].y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // the ghost grid: slots first, then the lines over the field
  ctx.strokeStyle = INK;
  ctx.globalAlpha = gridA;
  ctx.lineWidth = 2;
  for (i = 0; i <= COLS; i++) seg(GRID_X + i * CELL_W, GRID_Y, GRID_X + i * CELL_W, GRID_Y + GRID_H);
  for (j = 0; j <= ROWS; j++) seg(GRID_X, GRID_Y + j * CELL_H, GRID_X + GRID_W, GRID_Y + j * CELL_H);
  ctx.lineWidth = 2.5;
  for (i = 0; i < COLS * ROWS; i++) {
    var c = slotCenter(i);
    seg(c.x - 7, c.y, c.x + 7, c.y);
    seg(c.x, c.y - 7, c.x, c.y + 7);
  }
  ctx.globalAlpha = 1;

  drawBand();

  for (i = 0; i < elements.length; i++) drawElement(elements[i], phase);

  // hint
  ctx.fillStyle = INK;
  ctx.globalAlpha = 0.45;
  ctx.font = (isPhone() ? 19 : 16) + "px sans-serif";
  ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
  ctx.fillText("drag · tap", 966, 992);
  ctx.globalAlpha = 1;
}

// ---------- run ----------
// synchronous, deterministic first frame: chaos at rest, on its slots
resize();

if (typeof requestAnimationFrame === "function") {
  startStamp = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  var loop = function () {
    draw(currentPhase());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
