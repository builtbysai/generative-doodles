<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№8991 · Off Register - Generative Doodles</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#ece1c9; }
  #stage { position:fixed; inset:0; display:block; touch-action:none; cursor:pointer; }
  .label {
    position:fixed; z-index:2; pointer-events:none;
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color:#23231f; user-select:none; -webkit-user-select:none;
  }
  #title { top:14px; left:16px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.85; }
  #hint {
    bottom:18px; left:0; right:0; text-align:center;
    font-size:12px; letter-spacing:.06em; line-height:1.9; opacity:.8; padding:0 12px;
  }
  #hint .sub { font-size:10px; opacity:.65; letter-spacing:.1em; }
  #hint .mob { display:none; }
  @media (max-width:560px) {
    #hint .desk, #hint .sub, #hint br { display:none; }
    #hint .mob { display:inline; }
  }
  #snd {
    position:fixed; z-index:3; bottom:14px; right:14px;
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:10px; letter-spacing:.1em; color:#23231f; background:none;
    border:1px solid currentColor; border-radius:20px; padding:6px 12px; cursor:pointer; opacity:.7;
  }
  #snd:hover { opacity:1; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="title" class="label">№8991 · Off Register</div>
<div id="hint" class="label"><span class="desk">press keys A through L, or tap</span><span class="mob">tap the page to play</span><br><span class="sub">space changes the inks &nbsp;·&nbsp; M toggles sound</span></div>
<button id="snd">sound on</button>
<script>
"use strict";
/* Off Register: a small playable print-shop instrument.
   Twelve one-gesture motifs under one trigger contract
   (start on press, clear on re-press, update each frame, resize rebuilds).
   All timing derives from one shared duration unit. Every press re-rolls
   the pose: rotation, distance, quadrant, lobe count. Nothing prints twice. */

// ---------- utils ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const qs = new URLSearchParams(location.search);
const seed = parseInt(qs.get("seed") || "8991", 10) || 8991;
const demoMode = qs.get("demo") === "1";
let rng = mulberry32(seed);
const rr = (a, b) => a + rng() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];

function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
const css = c => "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")";
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

// ---------- palette roles: paper, ink, ghost, accent ----------
const SETS = [
  { name: "newsprint", paper: "#ece1c9", ink: "#23231f", ghost: "#c23b22", accent: "#2b5aa6" },
  { name: "blueprint", paper: "#27436e", ink: "#f0e9d4", ghost: "#e0862f", accent: "#9fc2e8" },
  { name: "rose",      paper: "#f3dcd6", ink: "#43232b", ghost: "#2e7d64", accent: "#c23b22" },
  { name: "night",     paper: "#22252a", ink: "#e7dfc9", ghost: "#c8552e", accent: "#7ba889" }
];
let setIdx = (parseInt(qs.get("set") || "0", 10) || 0) % SETS.length;
const cur = {}, tgt = {}, palFrom = {};
for (const r of ["paper", "ink", "ghost", "accent"]) {
  cur[r] = hexRgb(SETS[setIdx][r]); tgt[r] = cur[r].slice(); palFrom[r] = cur[r].slice();
}
let palT0 = -1e9;
function reink() {
  setIdx = (setIdx + 1) % SETS.length;
  for (const r of ["paper", "ink", "ghost", "accent"]) {
    palFrom[r] = cur[r].slice();
    tgt[r] = hexRgb(SETS[setIdx][r]);
  }
  palT0 = performance.now();
  paintLabels();
}
function stepPalette(now) {
  const k = easeInOut(clamp((now - palT0) / 600, 0, 1));
  for (const r of ["paper", "ink", "ghost", "accent"]) cur[r] = mix3(palFrom[r], tgt[r], k);
}
function paintLabels() {
  const c = css(tgt.ink);
  document.getElementById("title").style.color = c;
  document.getElementById("hint").style.color = c;
  const b = document.getElementById("snd");
  b.style.color = c; b.style.borderColor = c;
  document.body.style.background = css(tgt.paper);
}

// ---------- canvas ----------
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
let W = 0, H = 0, m = 0, grainPat = null, ghostMark = null;
let bgCache = null, bgCtx = null, bgDirty = true;

function buildGrain() {
  const t = document.createElement("canvas");
  t.width = t.height = 128;
  const g = t.getContext("2d");
  const img = g.createImageData(128, 128);
  const gr = mulberry32(1234);
  for (let i = 0; i < img.data.length; i += 4) {
    img.data[i] = img.data[i + 1] = img.data[i + 2] = 0;
    img.data[i + 3] = gr() < 0.5 ? 0 : 16;
  }
  g.putImageData(img, 0, 0);
  grainPat = ctx.createPattern(t, "repeat");
}
function resize() {
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight; m = Math.min(W, H);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildGrain();
  const g2 = mulberry32(seed + 7);
  ghostMark = { x: W * (0.3 + g2() * 0.4), y: H * (0.3 + g2() * 0.4), r: m * (0.16 + g2() * 0.1), rot: g2() * TAU };
  bgCache = document.createElement("canvas");
  bgCache.width = Math.round(W * DPR); bgCache.height = Math.round(H * DPR);
  bgCtx = bgCache.getContext("2d");
  bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgDirty = true;
  clearAll();
}
window.addEventListener("resize", resize);

// ---------- backdrop: paper, grain, registration furniture ----------
// baked to an offscreen canvas; re-baked on resize and while the palette crossfades
function renderBackdrop() {
  const b = bgCtx;
  b.fillStyle = css(cur.paper);
  b.fillRect(0, 0, W, H);
  b.globalAlpha = 0.55;
  b.fillStyle = grainPat;
  b.fillRect(0, 0, W, H);
  b.globalAlpha = 1;

  // faint ghost of a register mark, baked from the seed: the rest state is deliberate
  b.save();
  b.globalAlpha = 0.06;
  b.strokeStyle = css(cur.ink);
  b.lineWidth = Math.max(1, m * 0.004);
  b.translate(ghostMark.x, ghostMark.y);
  b.rotate(ghostMark.rot);
  b.beginPath(); b.arc(0, 0, ghostMark.r, 0, TAU); b.stroke();
  b.beginPath(); b.arc(0, 0, ghostMark.r * 0.62, 0, TAU); b.stroke();
  b.beginPath();
  b.moveTo(-ghostMark.r * 1.25, 0); b.lineTo(ghostMark.r * 1.25, 0);
  b.moveTo(0, -ghostMark.r * 1.25); b.lineTo(0, ghostMark.r * 1.25);
  b.stroke();
  b.restore();

  // corner registration marks, quiet
  const ins = 30, L = 16;
  b.save();
  b.globalAlpha = 0.35;
  b.strokeStyle = css(cur.ink);
  b.lineWidth = Math.max(1, m * 0.003);
  for (const [cx, cy] of [[ins, ins], [W - ins, ins], [ins, H - ins], [W - ins, H - ins]]) {
    b.beginPath(); b.arc(cx, cy, 7, 0, TAU); b.stroke();
    b.beginPath();
    b.moveTo(cx - L, cy); b.lineTo(cx + L, cy);
    b.moveTo(cx, cy - L); b.lineTo(cx, cy + L);
    b.stroke();
  }
  b.restore();
  bgDirty = false;
}

// ---------- audio: small synthesized kit, subtle, mutable ----------
let AC = null, master = null, noiseBuf = null, muted = false;
function audio() {
  if (muted) return null;
  try {
    if (!AC) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      AC = new Ctor();
      master = AC.createGain();
      master.gain.value = 0.14;
      master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === "suspended") AC.resume();
    return AC;
  } catch (e) { return null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function hiss(dur, freq, type, vol, delay) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (delay || 0);
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = 0.8;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.05);
}
const sndBtn = document.getElementById("snd");
function setMuted(v) {
  muted = v;
  sndBtn.textContent = muted ? "sound off" : "sound on";
}
sndBtn.addEventListener("click", e => { e.stopPropagation(); audio(); setMuted(!muted); });

// ---------- motif helpers ----------
// split a 0..1 life into draw-on progress and fade-out multiplier
function split(p, atk) {
  const qi = easeOutCubic(clamp(p / atk, 0, 1));
  const qo = clamp((p - atk) / (1 - atk), 0, 1);
  return [qi, qo, 1 - easeInOut(qo)];
}
function anchor(ax, ay) {
  if (ax === undefined) return { x: rr(W * 0.22, W * 0.78), y: rr(H * 0.28, H * 0.72) };
  return { x: ax, y: ay };
}
function misreg() { return { x: rr(-1, 1) * m * 0.009, y: rr(-1, 1) * m * 0.009 }; }
function leadInk() { return pick(["ink", "ink", "ink", "accent"]); }
// two passes: the ghost print first (offset, softer), then the lead ink
function passes(pose, fn) {
  fn("ghost", pose.mis.x, pose.mis.y, 0.55);
  fn(pose.lead, 0, 0, 1);
}

// ---------- the twelve motifs ----------
// a: RULE, a thick press rule swept across at a random angle
function poseRule(ax, ay) {
  const c = anchor(ax, ay);
  return { x: c.x, y: c.y, ang: rr(0, TAU), len: rr(0.32, 0.62) * m, w: rr(0.018, 0.045) * m, lead: leadInk(), mis: misreg() };
}
function drawRule(pose, p, atk) {
  const r = split(p, atk), qi = r[0], fade = r[2];
  const dx = Math.cos(pose.ang), dy = Math.sin(pose.ang);
  const L = pose.len * qi, drift = (1 - fade) * m * 0.02;
  passes(pose, (role, ox, oy, a) => {
    ctx.save();
    ctx.globalAlpha = fade * a;
    ctx.strokeStyle = css(cur[role]);
    ctx.lineWidth = pose.w; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(pose.x - dx * L - dy * drift + ox, pose.y - dy * L + dx * drift + oy);
    ctx.lineTo(pose.x + dx * L - dy * drift + ox, pose.y + dy * L + dx * drift + oy);
    ctx.stroke(); ctx.restore();
  });
}

// b: HALFTONE, a patch of dots blooming from a point
function poseHalftone(ax, ay) {
  const c = anchor(ax, ay);
  return { x: c.x, y: c.y, r: rr(0.10, 0.19) * m, s: 0.030 * m, lead: leadInk(), mis: misreg() };
}
function drawHalftone(pose, p, atk) {
  const r = split(p, atk), q0 = clamp(p / atk, 0, 1), fade = r[2];
  const R = pose.r * q0;
  if (R < 1) return;
  const n = Math.ceil(R / pose.s);
  passes(pose, (role, ox, oy, a) => {
    ctx.save();
    ctx.fillStyle = css(cur[role]);
    ctx.globalAlpha = fade * a;
    for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
      const px = i * pose.s, py = j * pose.s;
      const d = Math.hypot(px, py);
      if (d < R) {
        const dot = pose.s * 0.40 * (0.25 + 0.75 * (1 - d / R)) * fade;
        if (dot > 0.4) { ctx.beginPath(); ctx.arc(pose.x + px + ox, pose.y + py + oy, dot, 0, TAU); ctx.fill(); }
      }
    }
    ctx.restore();
  });
}

// c: CROPMARKS, registration corners drawn around a point
function poseCrop(ax, ay) {
  const c = anchor(ax, ay);
  return { x: c.x, y: c.y, s: rr(0.10, 0.17) * m, lead: leadInk(), mis: misreg() };
}
function drawCrop(pose, p, atk) {
  const r = split(p, atk), q0 = clamp(p / atk, 0, 1), fade = r[2];
  const s = pose.s, a = s * 0.34;
  passes(pose, (role, ox, oy, al) => {
    ctx.save();
    ctx.globalAlpha = fade * al;
    ctx.strokeStyle = css(cur[role]);
    ctx.lineWidth = Math.max(1, m * 0.005); ctx.lineCap = "round";
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      const cx = pose.x + sx * s / 2, cy = pose.y + sy * s / 2;
      ctx.beginPath();
      ctx.moveTo(cx + ox, cy + oy);
      ctx.lineTo(cx - sx * a * q0 + ox, cy + oy);
      ctx.moveTo(cx + ox, cy + oy);
      ctx.lineTo(cx + ox, cy - sy * a * q0 + oy);
      ctx.stroke();
    }
    const ch = s * 0.30 * q0;
    ctx.beginPath();
    ctx.moveTo(pose.x - ch + ox, pose.y + oy); ctx.lineTo(pose.x + ch + ox, pose.y + oy);
    ctx.moveTo(pose.x + ox, pose.y - ch + oy); ctx.lineTo(pose.x + ox, pose.y + ch + oy);
    ctx.stroke();
    if (q0 > 0.05) { ctx.beginPath(); ctx.arc(pose.x + ox, pose.y + oy, s * 0.10, 0, q0 * TAU); ctx.stroke(); }
    ctx.restore();
  });
}

// d: PUNCH, a punch-card column knocked out in rhythm
function posePunch(ax, ay) {
  const c = anchor(ax, ay);
  const n = ri(7, 11);
  return { x: c.x, y: c.y, n: n, gap: 0.052 * m, r: 0.016 * m, lead: leadInk(), mis: misreg() };
}
function drawPunch(pose, p, atk) {
  const r = split(p, atk), q0 = clamp(p / atk, 0, 1), fade = r[2];
  passes(pose, (role, ox, oy, al) => {
    ctx.save();
    ctx.globalAlpha = fade * al;
    for (let i = 0; i < pose.n; i++) {
      const ai = clamp((q0 * (pose.n + 2) - i) / 2, 0, 1);
      if (ai <= 0) continue;
      const sc = easeOutBack(ai);
      const y = pose.y + (i - (pose.n - 1) / 2) * pose.gap;
      ctx.fillStyle = css(cur[role]);
      ctx.beginPath(); ctx.arc(pose.x + ox, y + oy, pose.r * sc, 0, TAU); ctx.fill();
      ctx.fillStyle = css(cur.paper);
      ctx.beginPath(); ctx.arc(pose.x + ox, y + oy, pose.r * 0.55 * sc, 0, TAU); ctx.fill();
    }
    ctx.restore();
  });
}

// e: BRAYER, a roller passes and lays a band of ink
function poseBrayer(ax, ay) {
  const c = anchor(ax, ay);
  return { ang: rr(0, TAU), off: rr(-0.15, 0.15) * m, len: 0.24 * m, w: 0.075 * m, lead: leadInk(), mis: misreg(), cx: c.x, cy: c.y };
}
function drawBrayer(pose, p, atk) {
  const r = split(p, atk), qi = r[0], fade = r[2];
  const ext = m * 0.85, pos = lerp(-ext, ext, qi);
  const bandW = pose.w * 2.4;
  ctx.save();
  ctx.translate(pose.cx, pose.cy); ctx.rotate(pose.ang);
  ctx.translate(0, pose.off);
  // laid band: ghost under, ink over
  ctx.globalAlpha = 0.20 * fade;
  ctx.fillStyle = css(cur.ghost);
  ctx.fillRect(-ext + pose.mis.x, -bandW / 2 + pose.mis.y, pos + ext, bandW);
  ctx.globalAlpha = 0.12 * fade;
  ctx.fillStyle = css(cur[pose.lead]);
  ctx.fillRect(-ext, -bandW / 2, pos + ext, bandW);
  // roller, gone once the pass is done
  if (p < atk) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = css(cur[pose.lead]);
    ctx.fillRect(pos - pose.len / 2, -pose.w / 2, pose.len, pose.w);
    ctx.strokeStyle = css(cur[pose.lead]);
    ctx.lineWidth = Math.max(1.5, m * 0.006); ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(pos + pose.len / 2, 0);
    ctx.lineTo(pos + pose.len / 2 + pose.w * 1.7, 0);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(pos + pose.len / 2 + pose.w * 2.1, 0, pose.w * 0.32, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// f: SCORE, a crease line and the paper folding away from it
function poseScore(ax, ay) {
  const c = anchor(ax, ay);
  return { x: c.x, y: c.y, ang: rr(0, TAU), lead: leadInk(), mis: misreg() };
}
function drawScore(pose, p, atk) {
  const r = split(p, atk), qi = r[0], fade = r[2];
  const dx = Math.cos(pose.ang), dy = Math.sin(pose.ang), L = m * 0.7 * qi;
  passes(pose, (role, ox, oy, a) => {
    ctx.save();
    ctx.globalAlpha = fade * a;
    ctx.strokeStyle = css(cur[role === "ghost" ? "ghost" : "accent"]);
    ctx.lineWidth = Math.max(1, m * 0.005); ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(pose.x - dx * L + ox, pose.y - dy * L + oy);
    ctx.lineTo(pose.x + dx * L + ox, pose.y + dy * L + oy);
    ctx.stroke(); ctx.restore();
  });
  // one side of the paper takes a breath of ink, then lets it go
  ctx.save();
  ctx.translate(pose.x, pose.y); ctx.rotate(pose.ang);
  ctx.globalAlpha = 0.08 * fade;
  ctx.fillStyle = css(cur.ink);
  ctx.fillRect(-m, 0, 2 * m, m);
  ctx.restore();
}

// g: REGISTER, concentric target rings locking on
function poseRegister(ax, ay) {
  const c = anchor(ax, ay);
  return { x: c.x, y: c.y, r: rr(0.06, 0.12) * m, n: ri(2, 4), rot: rr(0, TAU), spin: rr(-0.6, 0.6), lead: leadInk(), mis: misreg() };
}
function drawRegister(pose, p, atk) {
  const r = split(p, atk), q0 = clamp(p / atk, 0, 1), qo = r[1], fade = r[2];
  passes(pose, (role, ox, oy, a) => {
    ctx.save();
    ctx.translate(pose.x + ox, pose.y + oy);
    ctx.rotate(pose.rot + pose.spin * qo);
    ctx.globalAlpha = fade * a;
    ctx.strokeStyle = css(cur[role]);
    ctx.lineWidth = Math.max(1, m * 0.006); ctx.lineCap = "round";
    for (let j = 0; j < pose.n; j++) {
      const rev = clamp(q0 * 1.3 - j * 0.14, 0, 1);
      if (rev <= 0) continue;
      ctx.beginPath();
      ctx.arc(0, 0, pose.r * (j + 1) / pose.n, 0, rev * TAU);
      ctx.stroke();
    }
    const ch = pose.r * 0.32 * q0;
    ctx.beginPath();
    ctx.moveTo(-ch, 0); ctx.lineTo(ch, 0);
    ctx.moveTo(0, -ch); ctx.lineTo(0, ch);
    ctx.stroke();
    ctx.fillStyle = css(cur[role]);
    ctx.beginPath(); ctx.arc(0, 0, pose.r * 0.07 * q0, 0, TAU); ctx.fill();
    ctx.restore();
  });
}

// h: PERFORATION, a tear line drawn, then a strip peels away
function posePerf(ax, ay) {
  const c = anchor(ax, ay);
  return { x: c.x, y: c.y, ang: rr(0, TAU), n: 18, len: 1.15 * m, lead: leadInk(), mis: misreg() };
}
function drawPerf(pose, p, atk) {
  const r = split(p, atk), q0 = clamp(p / atk, 0, 1), qo = r[1], fade = r[2];
  const dx = Math.cos(pose.ang), dy = Math.sin(pose.ang), half = pose.len / 2;
  passes(pose, (role, ox, oy, a) => {
    ctx.save();
    ctx.globalAlpha = fade * a;
    ctx.strokeStyle = css(cur[role]);
    ctx.lineWidth = Math.max(1.5, m * 0.008); ctx.lineCap = "round";
    for (let i = 0; i < pose.n; i++) {
      if (q0 * pose.n <= i) break;
      const t0 = i / pose.n, t1 = (i + 0.55) / pose.n;
      ctx.beginPath();
      ctx.moveTo(pose.x + dx * lerp(-half, half, t0) + ox, pose.y + dy * lerp(-half, half, t0) + oy);
      ctx.lineTo(pose.x + dx * lerp(-half, half, t1) + ox, pose.y + dy * lerp(-half, half, t1) + oy);
      ctx.stroke();
    }
    ctx.restore();
  });
  // the strip lifts off one side as the tear completes
  if (qo > 0) {
    const stripW = m * 0.055, lift = qo * m * 0.06;
    ctx.save();
    ctx.translate(pose.x, pose.y); ctx.rotate(pose.ang);
    ctx.globalAlpha = 0.22 * fade;
    ctx.fillStyle = css(cur.ink);
    ctx.fillRect(-half, lift * 0.4, pose.len, m * 0.006);
    ctx.globalAlpha = fade;
    ctx.fillStyle = css(mix3(cur.paper, cur.ink, 0.16));
    ctx.fillRect(-half, -stripW + lift, pose.len, stripW);
    ctx.globalAlpha = 0.35 * fade;
    ctx.strokeStyle = css(cur.ink);
    ctx.lineWidth = Math.max(1, m * 0.003);
    ctx.beginPath(); ctx.moveTo(-half, lift); ctx.lineTo(half, lift); ctx.stroke();
    ctx.restore();
  }
}

// i: STAMP, slammed down hard, ghost printed twice as hard
function poseStamp(ax, ay) {
  const c = anchor(ax, ay);
  const k = ri(5, 9), dots = [];
  const sr = mulberry32((seed ^ 0x5f3d) + ((ax | 0) * 31 + (ay | 0)) >>> 0 || 1);
  for (let i = 0; i < k; i++) dots.push({ a: sr() * TAU, d: 0.25 + sr() * 0.65, s: 0.5 + sr() });
  return { x: c.x, y: c.y, s: rr(0.08, 0.13) * m, rot: rr(0, TAU), dots: dots, lead: leadInk(), mis: misreg() };
}
function drawStamp(pose, p, atk) {
  const r = split(p, atk), q0 = clamp(p / atk, 0, 1), fade = r[2];
  const slam = easeOutCubic(q0), scale = 1.45 - 0.45 * slam;
  const big = { x: pose.mis.x * 2.2, y: pose.mis.y * 2.2 };
  const one = (role, ox, oy, a) => {
    ctx.save();
    ctx.translate(pose.x + ox, pose.y + oy); ctx.rotate(pose.rot);
    ctx.globalAlpha = (0.35 + 0.65 * slam) * fade * a;
    ctx.strokeStyle = css(cur[role]);
    ctx.lineWidth = Math.max(2, m * 0.02);
    ctx.beginPath(); ctx.arc(0, 0, pose.s * scale, 0, TAU); ctx.stroke();
    ctx.fillStyle = css(cur[role]);
    const sa = easeOutBack(clamp(q0 * 1.5 - 0.25, 0, 1));
    for (const d of pose.dots) {
      ctx.beginPath();
      ctx.arc(Math.cos(d.a) * d.d * pose.s * scale, Math.sin(d.a) * d.d * pose.s * scale, pose.s * 0.10 * d.s * sa, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  };
  one("ghost", big.x, big.y, 0.55);
  one(pose.lead, 0, 0, 1);
  if (q0 < 1) {
    ctx.save();
    ctx.globalAlpha = (1 - q0) * 0.4;
    ctx.strokeStyle = css(cur[pose.lead]);
    ctx.lineWidth = Math.max(1, m * 0.004);
    ctx.beginPath(); ctx.arc(pose.x, pose.y, pose.s * (1 + q0 * 1.4), 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

// j: SLUGS, letterpress type falling into a line
function poseSlugs(ax, ay) {
  const c = anchor(ax, ay);
  return {
    x: c.x, y: c.y,
    ang: pick([rr(-0.25, 0.25), Math.PI / 2 + rr(-0.25, 0.25)]),
    n: ri(6, 10), lead: leadInk(), mis: misreg()
  };
}
function drawSlugs(pose, p, atk) {
  const r = split(p, atk), q0 = clamp(p / atk, 0, 1), fade = r[2];
  const sw = 0.042 * m, totalW = pose.n * sw;
  passes(pose, (role, ox, oy, a) => {
    ctx.save();
    ctx.translate(pose.x + ox, pose.y + oy); ctx.rotate(pose.ang);
    ctx.globalAlpha = fade * a;
    ctx.fillStyle = css(cur[role]);
    for (let i = 0; i < pose.n; i++) {
      const ai = clamp((q0 * (pose.n + 2) - i) / 2, 0, 1);
      if (ai <= 0) continue;
      const drop = (1 - easeOutCubic(ai)) * -m * 0.08;
      const h = (i % 2 ? 0.056 : 0.040) * m;
      ctx.fillRect(-totalW / 2 + i * sw + sw * 0.12, -h / 2 + drop, sw * 0.76, h);
    }
    ctx.restore();
  });
}

// k: SQUEEGEE, a full-bleed wash pulled across the sheet
function poseSqueegee() {
  return { ang: rr(0, TAU), bw: 0.10 * m, lead: leadInk(), mis: misreg() };
}
function drawSqueegee(pose, p, atk) {
  const r = split(p, atk), qi = r[0], fade = r[2];
  const diag = Math.hypot(W, H) / 2 + m * 0.1;
  const c = lerp(-diag, diag, qi);
  const bandA = p < atk ? 1 : clamp(1 - (p - atk) / 0.1, 0, 1);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.rotate(pose.ang);
  ctx.globalAlpha = 0.045 * fade;
  ctx.fillStyle = css(cur.ink);
  ctx.fillRect(-diag, -pose.bw * 3, c + diag, pose.bw * 6);
  if (bandA > 0) {
    ctx.globalAlpha = 0.17 * bandA;
    ctx.fillStyle = css(cur.ghost);
    ctx.fillRect(c - pose.bw / 2 + pose.mis.x, -pose.bw * 3, pose.bw, pose.bw * 6);
    ctx.globalAlpha = 0.10 * bandA;
    ctx.fillStyle = css(cur[pose.lead]);
    ctx.fillRect(c - pose.bw / 2, -pose.bw * 3, pose.bw, pose.bw * 6);
    ctx.globalAlpha = bandA;
    ctx.fillRect(c - pose.bw * 0.06, -pose.bw * 3, pose.bw * 0.12, pose.bw * 6);
  }
  ctx.restore();
}

// l: SPECKS, a mist of ink thrown from a nozzle point
function poseSpecks(ax, ay) {
  const c = anchor(ax, ay);
  const n = ri(40, 70), parts = [];
  for (let i = 0; i < n; i++) {
    parts.push({ a: rr(0, TAU), sp: rr(0.06, 0.35) * m, sz: rr(0.003, 0.010) * m, gh: i % 3 === 0 });
  }
  return { x: c.x, y: c.y, parts: parts, lead: leadInk(), mis: misreg() };
}
function drawSpecks(pose, p, atk) {
  const r = split(p, atk), q0 = clamp(p / atk, 0, 1), qo = r[1], fade = r[2];
  const fling = easeOutCubic(q0);
  ctx.save();
  for (const pt of pose.parts) {
    const d = pt.sp * fling + pt.sp * 0.25 * qo;
    ctx.globalAlpha = fade * (1 - q0 * 0.25);
    ctx.fillStyle = css(cur[pt.gh ? "ghost" : pose.lead]);
    const ox = pt.gh ? pose.mis.x : 0, oy = pt.gh ? pose.mis.y : 0;
    ctx.beginPath();
    ctx.arc(pose.x + Math.cos(pt.a) * d + ox, pose.y + Math.sin(pt.a) * d + oy, Math.max(0.4, pt.sz * (1 - qo * 0.4)), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

// ---------- voices: one small synthesized sound per motif ----------
const V = {
  a: () => { hiss(0.25, 900, "bandpass", 0.16); tone(170, 80, 0.22, "sine", 0.14); },
  b: () => { tone(520, 860, 0.16, "triangle", 0.09); tone(780, 1180, 0.14, "triangle", 0.06, 0.05); },
  c: () => { tone(660, 660, 0.05, "square", 0.045); tone(660, 660, 0.05, "square", 0.045, 0.09); },
  d: () => { for (let i = 0; i < 3; i++) tone(320, 140, 0.05, "square", 0.06, i * 0.07); },
  e: () => { hiss(0.5, 320, "lowpass", 0.15); },
  f: () => { hiss(0.18, 2600, "highpass", 0.06); },
  g: () => { tone(440, 440, 0.28, "sine", 0.09); tone(880, 880, 0.2, "sine", 0.045, 0.02); },
  h: () => { hiss(0.14, 4200, "highpass", 0.08); },
  i: () => { tone(120, 42, 0.28, "sine", 0.26); },
  j: () => { for (let i = 0; i < 5; i++) tone(240 + i * 60, 180, 0.04, "square", 0.045, i * 0.05); },
  k: () => { hiss(0.7, 480, "lowpass", 0.09); },
  l: () => { for (let i = 0; i < 6; i++) tone(1200 + i * 220, 1600 + i * 220, 0.05, "sine", 0.035, i * 0.04); }
};

// ---------- the instrument: one shared duration unit, strict contract ----------
const D = 1100;
const DEFS = [
  { key: "a", name: "rule",   mult: 1,    atk: 0.30, pose: poseRule,     draw: drawRule,     voice: V.a },
  { key: "b", name: "halftone", mult: 1.5, atk: 0.35, pose: poseHalftone, draw: drawHalftone, voice: V.b },
  { key: "c", name: "cropmarks", mult: 1,  atk: 0.30, pose: poseCrop,     draw: drawCrop,     voice: V.c },
  { key: "d", name: "punch",  mult: 1.25,  atk: 0.45, pose: posePunch,    draw: drawPunch,    voice: V.d },
  { key: "e", name: "brayer", mult: 1.5,   atk: 0.55, pose: poseBrayer,   draw: drawBrayer,   voice: V.e },
  { key: "f", name: "score",  mult: 1,     atk: 0.30, pose: poseScore,    draw: drawScore,    voice: V.f },
  { key: "g", name: "register", mult: 1.25, atk: 0.35, pose: poseRegister, draw: drawRegister, voice: V.g },
  { key: "h", name: "perforation", mult: 1.5, atk: 0.40, pose: posePerf,  draw: drawPerf,     voice: V.h },
  { key: "i", name: "stamp",  mult: 1,     atk: 0.18, pose: poseStamp,    draw: drawStamp,    voice: V.i },
  { key: "j", name: "slugs",  mult: 1.25,  atk: 0.45, pose: poseSlugs,    draw: drawSlugs,    voice: V.j },
  { key: "k", name: "squeegee", mult: 1.25, atk: 0.35, pose: poseSqueegee, draw: drawSqueegee, voice: V.k },
  { key: "l", name: "specks", mult: 1.25,  atk: 0.40, pose: poseSpecks,   draw: drawSpecks,   voice: V.l }
];
const DEFMAP = {};
DEFS.forEach(d => { DEFMAP[d.key] = d; });

// live instances, one slot per key: re-pressing clears first, never overlaps
const live = {};
function clearAll() { for (const k in live) delete live[k]; }
function trigger(key, ax, ay) {
  const def = DEFMAP[key];
  if (!def) return;
  delete live[key];
  live[key] = { def: def, pose: def.pose(ax, ay), t0: performance.now(), dur: D * def.mult };
  try { def.voice(); } catch (e) { /* silent is fine */ }
}

// ---------- input ----------
window.addEventListener("keydown", e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); reink(); return; }
  if (k === "m") { audio(); setMuted(!muted); return; }
  if (k.length === 1 && k >= "a" && k <= "l") trigger(k);
});
cv.addEventListener("pointerdown", e => {
  const ks = Object.keys(DEFMAP);
  trigger(ks[Math.floor(Math.random() * ks.length)], e.clientX, e.clientY);
});

// ---------- demo mode: plays a short phrase for thumbnails ----------
// big washes first so they clear; small motifs last so the capture catches them
if (demoMode) {
  const seq = ["k", "e", "a", "d", "g", "j", "l", "b", "c", "f", "h", "i"];
  seq.forEach((k, i) => setTimeout(() => trigger(k), 500 + i * 360));
  setTimeout(reink, 500 + seq.length * 360 + 900);
}

// ---------- main loop ----------
function frame(now) {
  stepPalette(now);
  if (bgDirty || now - palT0 < 650) renderBackdrop();
  ctx.drawImage(bgCache, 0, 0, W, H);
  for (const k of Object.keys(live)) {
    const s = live[k];
    const p = (now - s.t0) / s.dur;
    if (p >= 1) { delete live[k]; continue; }
    s.def.draw(s.pose, p, s.def.atk);
  }
  requestAnimationFrame(frame);
}

resize();
paintLabels();
requestAnimationFrame(frame);
</script>
