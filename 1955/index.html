<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1955 Plug In, Plug Out</title>
<style>
  html, body { margin: 0; padding: 0; background: #0c0b0e; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Plug In, Plug Out, TC4 / PP1202, study #255 tom-challenger.
  // A rack of brass sockets in a row; a small set of motifs
  // ("suitable music") loops as notation cards above them. Voices
  // (tenor, trumpet, bass, drums) plug into sockets: each plug
  // re-voices the motif in a new timbre. The pattern persists; the
  // players change. Drag a voice cable from one socket to another,
  // or drag a voice out to silence its seat. The motif keeps
  // looping through whoever is plugged in. The band is a patch-bay.
  var INK = '#f2ead6';      // plate ink, card cream
  var INK_DIM = '#9a938a';  // muted cream ink
  var ROOM_TOP = '#17161a'; // patch-bay black, top
  var ROOM_BOT = '#0c0b0e'; // patch-bay black, bottom
  var PANEL = '#201f24';    // rack and module panel
  var PANEL_LINE = '#35343a'; // panel edge line
  var BRASS = '#c9a85a';    // brass
  var BRASS_DK = '#8a6d2f'; // dark brass
  var BRASS_LT = '#e8cf8f'; // bright brass
  var CARD = '#f2ead6';     // card cream
  var CARD_INK = '#2a2620'; // card ink
  var RED = '#d92b1f';      // tenor cable
  var YELLOW = '#e8b90a';   // trumpet cable
  var GREEN = '#1f9e4d';    // bass cable
  var HINT_PILL = '#f2ead6';// hint pill, card cream
  var HINT_INK = '#221f1a'; // hint ink

  // Fixed-phase first frame: FIRST_T = 8 s. The 8 s loop is at
  // its start, so card I is active, and the patch is tenor in
  // socket 1, trumpet in socket 2, bass in socket 4, drums in
  // socket 5, with sockets 3 and 6 empty. The motif reads at once
  // and the empty seats show the patch is changeable.
  var FIRST_T = 8;
  var SEED = 1955;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load,
  // ?plug=<voice>:<socket> plugs a voice into a socket (1 to 6)
  // at load, ?unplug=<voice> unplugs a voice at load.
  // ?seed= varies the texture seed. Read at load only.
  var seedParam = 0, probeT = null, probePlug = null, probeUnplug = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = qs.match(/[?&]seed=(-?\d+)/); if (m) { seedParam = parseInt(m[1], 10) || 0; }
    var mt = qs.match(/[?&]t=([0-9.]+)/); if (mt) { probeT = parseFloat(mt[1]); }
    var mp = qs.match(/[?&]plug=([a-z]+):([1-6])/); if (mp) { probePlug = { name: mp[1], socket: parseInt(mp[2], 10) - 1 }; }
    var mu = qs.match(/[?&]unplug=([a-z]+)/); if (mu) { probeUnplug = mu[1]; }
  } catch (e) {}
  var FIELD_SEED = seedParam ? (SEED + seedParam * 101) : SEED;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and a fixed salt, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Layout, in normalized coordinates. Six sockets in a row on the
  // rack at center; four motif cards above; four voice modules
  // below, aligned under the cards.
  var NSOCKETS = 6;
  var RACK_Y0 = 0.40, RACK_Y1 = 0.62, SOCKET_Y = 0.50;
  var CARD_Y = 0.145, CARD_H = 0.15, CARD_W = 0.19;
  var MOD_Y = 0.715, MOD_H = 0.095, MOD_W = 0.19;
  var CARD_X = [0.16, 0.38, 0.60, 0.82];
  var CARD_LABEL = ['I', 'II', 'III', 'IV'];
  var LOOP = 8; // the motif loop, seconds; one card per 2 s

  function socketX(i) { return 0.14 + i * 0.144; }

  // State. The patch is the only state, and it only changes
  // through interaction (or the ?plug= / ?unplug= hooks at load),
  // so frame one is a pure function of FIRST_T and the fixed
  // opening patch. Voices keep their identity; only their seat
  // changes. An empty seat is a rest, never a stop: the loop
  // keeps running through whoever is plugged in.
  var voices = [
    { name: 'tenor', label: 'TENOR', color: RED, socket: 0 },
    { name: 'trumpet', label: 'TRUMPET', color: YELLOW, socket: 1 },
    { name: 'bass', label: 'BASS', color: GREEN, socket: 3 },
    { name: 'drums', label: 'DRUMS', color: BRASS, socket: 4 }
  ];
  function voiceByName(name) {
    var i;
    for (i = 0; i < voices.length; i++) {
      if (voices[i].name === name) { return voices[i]; }
    }
    return null;
  }
  function voiceInSocket(i) {
    var v;
    for (v = 0; v < voices.length; v++) {
      if (voices[v].socket === i) { return voices[v]; }
    }
    return null;
  }
  function pluggedCount() {
    var n = 0, i;
    for (i = 0; i < voices.length; i++) { if (voices[i].socket !== null) { n++; } }
    return n;
  }

  // Patching, shared by pointer drag, the ?plug= / ?unplug=
  // hooks, and the probe API. Dropping on a socket plugs the
  // voice there; dropping on an occupied socket swaps the two
  // voices; dropping anywhere else unplugs the voice and silences
  // its seat. Returns true when the patch changed.
  function plugVoice(name, socketIdx) {
    var v = voiceByName(name);
    if (!v) { return false; }
    if (socketIdx < 0 || socketIdx >= NSOCKETS) { return false; }
    if (v.socket === socketIdx) { return false; }
    var other = voiceInSocket(socketIdx);
    var old = v.socket;
    if (other) { other.socket = old; }
    v.socket = socketIdx;
    return true;
  }
  function unplugVoice(name) {
    var v = voiceByName(name);
    if (!v) { return false; }
    if (v.socket === null) { return false; }
    v.socket = null;
    return true;
  }
  function placeVoice(name, nx, ny) {
    var i, best = -1, bestD = 0.065;
    for (i = 0; i < NSOCKETS; i++) {
      var d = Math.sqrt((nx - socketX(i)) * (nx - socketX(i)) + (ny - SOCKET_Y) * (ny - SOCKET_Y));
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0) { return plugVoice(name, best); }
    return unplugVoice(name);
  }

  function activeCard(t) {
    var k = Math.floor(t / 2) % 4;
    if (k < 0) { k += 4; }
    return k;
  }

  // Interaction state: the voice cable being dragged, if any.
  var dragging = null; // { name, x, y } in normalized coords
  var dragMoved = false;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The room: patch-bay black, darker toward the bottom.
  function drawRoom() {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, ROOM_TOP);
    grad.addColorStop(1, ROOM_BOT);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // One motif card: cream, three staff lines, six note heads,
  // one per socket seat, colored by the voice plugged into that
  // seat, hollow when the seat is a rest. The notes never move;
  // only their colors follow the patch, so the pattern persists
  // while the players change. The active card wears a brass
  // border and a small play triangle below it.
  function drawCard(ci, t) {
    var cx = CARD_X[ci] * W, cy = (CARD_Y + CARD_H / 2) * H;
    var cw = CARD_W * W, ch = CARD_H * H;
    var x0 = cx - cw / 2, y0 = cy - ch / 2;
    var active = (ci === activeCard(t));
    var pulse = active ? 0.5 + 0.5 * Math.sin(t * 2.2) : 0;
    ctx.fillStyle = CARD;
    ctx.fillRect(x0, y0, cw, ch);
    // Staff lines.
    var li;
    ctx.strokeStyle = hexA(CARD_INK, a4(0.45));
    ctx.lineWidth = 1;
    for (li = 0; li < 3; li++) {
      var ly = y0 + ch * (0.34 + li * 0.16);
      ctx.beginPath(); ctx.moveTo(x0 + 8, ly); ctx.lineTo(x0 + cw - 8, ly); ctx.stroke();
    }
    // Note heads, one per seat.
    var rng = mulberry32(FIELD_SEED * 31 + ci * 7 + 5);
    var si;
    for (si = 0; si < NSOCKETS; si++) {
      var nx = x0 + cw * ((si + 0.5) / NSOCKETS);
      var ny = y0 + ch * (0.30 + rng() * 0.36);
      var v = voiceInSocket(si);
      var r = 4.5 * clamp(W / 560, 0.8, 1.2);
      if (v) {
        ctx.fillStyle = v.color;
        if (active) {
          var pr = r * (1 + 0.18 * pulse);
          ctx.beginPath(); ctx.moveTo(nx + pr, ny); ctx.arc(nx, ny, pr, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.beginPath(); ctx.moveTo(nx + r, ny); ctx.arc(nx, ny, r, 0, Math.PI * 2); ctx.fill();
        }
        // Stem.
        ctx.strokeStyle = v.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(nx + r - 0.5, ny); ctx.lineTo(nx + r - 0.5, ny - 13); ctx.stroke();
      } else {
        // A rest: a hollow circle, the seat silent but present.
        ctx.strokeStyle = hexA(CARD_INK, a4(0.55));
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(nx + r, ny); ctx.arc(nx, ny, r, 0, Math.PI * 2); ctx.stroke();
      }
    }
    // Roman numeral, top-left.
    ctx.fillStyle = hexA(CARD_INK, a4(0.75));
    ctx.font = '600 ' + Math.round(11 * clamp(W / 560, 0.85, 1.1)) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(CARD_LABEL[ci], x0 + 8, y0 + 15);
    // Border: brass when active, muted otherwise.
    ctx.strokeStyle = active ? BRASS : hexA(CARD_INK, a4(0.25));
    ctx.lineWidth = active ? 3 : 1;
    ctx.strokeRect(x0, y0, cw, ch);
    if (active) {
      // Play triangle below the active card.
      var tx = cx, ty = y0 + ch + 12;
      ctx.fillStyle = BRASS;
      ctx.beginPath();
      ctx.moveTo(tx - 5, ty - 4); ctx.lineTo(tx + 5, ty); ctx.lineTo(tx - 5, ty + 4);
      ctx.closePath(); ctx.fill();
    }
  }

  // Loop progress: a thin brass bar under the cards, filling
  // across the 8 s loop.
  function drawLoopBar(t) {
    var bw = W * 0.5, bx = (W - bw) / 2, by = (CARD_Y + CARD_H) * H + 22;
    var f = ((t % LOOP) + LOOP) % LOOP / LOOP;
    ctx.strokeStyle = hexA(INK_DIM, a4(0.4));
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, 3);
    ctx.fillStyle = BRASS;
    ctx.fillRect(bx, by, bw * f, 3);
  }

  // The rack: a dark panel with a brass frame and corner screws.
  function drawRack() {
    var x0 = 0.05 * W, x1 = 0.95 * W, y0 = RACK_Y0 * H, y1 = RACK_Y1 * H;
    ctx.fillStyle = PANEL;
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.strokeStyle = BRASS;
    ctx.lineWidth = 3;
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    ctx.strokeStyle = PANEL_LINE;
    ctx.lineWidth = 1;
    ctx.strokeRect(x0 + 6, y0 + 6, x1 - x0 - 12, y1 - y0 - 12);
    // Corner screws.
    var corners = [[x0 + 12, y0 + 12], [x1 - 12, y0 + 12], [x0 + 12, y1 - 12], [x1 - 12, y1 - 12]];
    var i;
    for (i = 0; i < corners.length; i++) {
      ctx.fillStyle = BRASS_DK;
      ctx.beginPath(); ctx.moveTo(corners[i][0] + 3.5, corners[i][1]); ctx.arc(corners[i][0], corners[i][1], 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = BRASS_LT;
      ctx.beginPath(); ctx.moveTo(corners[i][0] + 1.2, corners[i][1]); ctx.arc(corners[i][0], corners[i][1], 1.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  // One socket: a brass ring around a dark hole, with a small
  // LED above it lit in the plugged voice's color, and a seat
  // number below it. When plugged, the plug body is drawn on top
  // by drawPlug.
  function drawSocket(i) {
    var sx = socketX(i) * W, sy = SOCKET_Y * H;
    var s = clamp(W / 560, 0.8, 1.2);
    var R = 17 * s;
    var v = voiceInSocket(i);
    // LED.
    ctx.fillStyle = v ? v.color : hexA(INK_DIM, a4(0.35));
    ctx.beginPath(); ctx.moveTo(sx + 3, sy - R - 12); ctx.arc(sx, sy - R - 12, 3, 0, Math.PI * 2); ctx.fill();
    // Brass ring.
    ctx.fillStyle = BRASS;
    ctx.beginPath(); ctx.moveTo(sx + R, sy); ctx.arc(sx, sy, R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BRASS_DK;
    ctx.beginPath(); ctx.moveTo(sx + R * 0.82, sy); ctx.arc(sx, sy, R * 0.82, 0, Math.PI * 2); ctx.fill();
    // Dark hole.
    ctx.fillStyle = '#0a090b';
    ctx.beginPath(); ctx.moveTo(sx + R * 0.55, sy); ctx.arc(sx, sy, R * 0.55, 0, Math.PI * 2); ctx.fill();
    // Seat number.
    ctx.fillStyle = hexA(INK, a4(0.6));
    ctx.font = Math.round(11 * clamp(W / 560, 0.85, 1.1)) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(String(i + 1), sx, RACK_Y1 * H - 10);
    ctx.textAlign = 'left';
  }

  // The plug in a socket: a brass collar with a colored ring in
  // the plugged voice's color.
  function drawPlug(v) {
    var sx = socketX(v.socket) * W, sy = SOCKET_Y * H;
    var s = clamp(W / 560, 0.8, 1.2);
    var R = 17 * s;
    ctx.fillStyle = BRASS_LT;
    ctx.beginPath(); ctx.moveTo(sx + R * 0.5, sy); ctx.arc(sx, sy, R * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = v.color;
    ctx.beginPath(); ctx.moveTo(sx + R * 0.32, sy); ctx.arc(sx, sy, R * 0.32, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hexA('#ffffff', a4(0.35));
    ctx.beginPath(); ctx.moveTo(sx - 2, sy - 3); ctx.arc(sx - 3, sy - 3, 1.8, 0, Math.PI * 2); ctx.fill();
  }

  // A cable arc from a voice module up to its socket plug. The
  // control point bows sideways so the cable reads as a hanging
  // patch cord, not a straight wire.
  function drawCable(v) {
    if (v.socket === null) { return; }
    var mx = CARD_X[voices.indexOf(v)] * W, my = MOD_Y * H;
    var sx = socketX(v.socket) * W, sy = (SOCKET_Y + 0.035) * H;
    var s = clamp(W / 560, 0.8, 1.2);
    var bow = (v.socket % 2 === 0 ? -1 : 1) * 26 * s;
    ctx.strokeStyle = v.color;
    ctx.lineWidth = 4 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.quadraticCurveTo((mx + sx) / 2 + bow, (my + sy) / 2 + 14, sx, sy);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // The loose cable of an unplugged voice: it droops from the
  // module and ends in a dangling plug just below the rack.
  function drawLooseCable(v) {
    var mx = CARD_X[voices.indexOf(v)] * W, my = MOD_Y * H;
    var ex = mx + 22, ey = (RACK_Y1 + 0.045) * H;
    var s = clamp(W / 560, 0.8, 1.2);
    ctx.strokeStyle = v.color;
    ctx.lineWidth = 4 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.quadraticCurveTo(mx + 34, my - 26, ex, ey);
    ctx.stroke();
    ctx.lineCap = 'butt';
    // Dangling plug.
    ctx.fillStyle = BRASS_LT;
    ctx.beginPath(); ctx.moveTo(ex + 6, ey); ctx.arc(ex, ey, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = v.color;
    ctx.beginPath(); ctx.moveTo(ex + 3.5, ey); ctx.arc(ex, ey, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  // One voice module: a dark plate with the voice name and a
  // colored dot. Plugged voices read bright; an unplugged voice
  // reads dim, its dot hollow, its seat silent. The dot sits at
  // the top-left corner and the name and seat tag are centered, so
  // the longest name still fits the narrow phone module.
  function drawModule(v) {
    var vi = voices.indexOf(v);
    var cx = CARD_X[vi] * W, cy = (MOD_Y + MOD_H / 2) * H;
    var mw = MOD_W * W, mh = MOD_H * H;
    var x0 = cx - mw / 2, y0 = cy - mh / 2;
    ctx.fillStyle = PANEL;
    ctx.fillRect(x0, y0, mw, mh);
    ctx.strokeStyle = v.socket !== null ? hexA(BRASS, a4(0.8)) : hexA(PANEL_LINE, a4(0.9));
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x0, y0, mw, mh);
    var dx = x0 + 12, dy = y0 + 13;
    if (v.socket !== null) {
      ctx.fillStyle = v.color;
      ctx.beginPath(); ctx.moveTo(dx + 5, dy); ctx.arc(dx, dy, 5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = hexA(INK_DIM, a4(0.6));
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(dx + 5, dy); ctx.arc(dx, dy, 5, 0, Math.PI * 2); ctx.stroke();
    }
    var fsLabel = Math.round(clamp(mw / 9.5, 9, 13));
    ctx.fillStyle = v.socket !== null ? INK : hexA(INK_DIM, a4(0.7));
    ctx.font = '600 ' + fsLabel + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(v.label, cx, cy + 2);
    // Seat tag under the name: which socket, or SILENT.
    ctx.fillStyle = hexA(INK_DIM, a4(0.75));
    ctx.font = Math.round(10 * clamp(W / 560, 0.85, 1.1)) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(v.socket !== null ? 'seat ' + (v.socket + 1) : 'silent', cx, cy + 17);
    ctx.textAlign = 'left';
  }

  // The cable currently being dragged: from its voice module to
  // the pointer, with the plug at the pointer.
  function drawDragged() {
    if (!dragging) { return; }
    var v = voiceByName(dragging.name);
    if (!v) { return; }
    var vi = voices.indexOf(v);
    var mx = CARD_X[vi] * W, my = MOD_Y * H;
    var px = dragging.x * W, py = dragging.y * H;
    var s = clamp(W / 560, 0.8, 1.2);
    ctx.strokeStyle = v.color;
    ctx.lineWidth = 4 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.quadraticCurveTo((mx + px) / 2 + 20, (my + py) / 2 + 16, px, py);
    ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = BRASS_LT;
    ctx.beginPath(); ctx.moveTo(px + 8, py); ctx.arc(px, py, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = v.color;
    ctx.beginPath(); ctx.moveTo(px + 4.5, py); ctx.arc(px, py, 4.5, 0, Math.PI * 2); ctx.fill();
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawRoom();
    var ci;
    for (ci = 0; ci < 4; ci++) { drawCard(ci, t); }
    drawLoopBar(t);
    drawRack();
    var i, v;
    for (i = 0; i < NSOCKETS; i++) { drawSocket(i); }
    for (i = 0; i < voices.length; i++) {
      v = voices[i];
      if (v.socket !== null && !(dragging && dragging.name === v.name)) { drawCable(v); }
    }
    for (i = 0; i < voices.length; i++) {
      v = voices[i];
      if (v.socket !== null && !(dragging && dragging.name === v.name)) { drawPlug(v); }
      if (v.socket === null && !(dragging && dragging.name === v.name)) { drawLooseCable(v); }
    }
    for (i = 0; i < voices.length; i++) { drawModule(voices[i]); }
    drawDragged();

    // ---- Plates: title top-left, number and date below it, a
    // short descriptor top-right. The plates sit on the dark
    // patch-bay, so they use the cream plate ink; the hint pill
    // sits at the bottom and keeps dark ink on cream.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Plug In, Plug Out', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.8);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1955 · 2007 · 05 · 20', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(INK, 0.65);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('the band is a patch-bay', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.fillStyle = hexA(INK, 0.8);
    ctx.font = fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(pluggedCount() + ' of 4 voices plugged', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8 + fsSmall + 6);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom on a cream pill.
    var hint = 'Drag a voice cable to another socket.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(HINT_PILL, a4(0.9));
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = HINT_INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function canvasPos(e) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function toNorm(p) { return { x: p.x / W, y: p.y / H }; }

  // The nearest draggable voice within reach of a pointer point,
  // in normalized coordinates: a plugged voice can be picked up
  // from its socket plug or its module; an unplugged voice from
  // its module.
  function pickAt(nx, ny) {
    var best = null, bestD = 0.065;
    var i, v;
    for (i = 0; i < voices.length; i++) {
      v = voices[i];
      if (v.socket !== null) {
        var d = Math.sqrt((nx - socketX(v.socket)) * (nx - socketX(v.socket)) + (ny - SOCKET_Y) * (ny - SOCKET_Y));
        if (d < bestD) { bestD = d; best = v.name; }
      }
      var mx = CARD_X[i], my = MOD_Y + MOD_H / 2;
      var dm = Math.sqrt((nx - mx) * (nx - mx) + (ny - my) * (ny - my));
      if (dm < 0.09 && dm < bestD + 0.03) { best = v.name; bestD = dm; }
    }
    return best;
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      var p = toNorm(canvasPos(e));
      var name = pickAt(p.x, p.y);
      if (!name) { return; }
      dragging = { name: name, x: p.x, y: p.y };
      dragMoved = false;
      try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      draw(reduced ? FIRST_T : lastT);
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var p = toNorm(canvasPos(e));
      dragging.x = p.x; dragging.y = p.y;
      dragMoved = true;
      draw(reduced ? FIRST_T : lastT);
    });
    window.addEventListener('pointerup', function () {
      if (!dragging) { return; }
      if (dragMoved) { placeVoice(dragging.name, dragging.x, dragging.y); }
      dragging = null;
      draw(reduced ? FIRST_T : lastT);
    });
    window.addEventListener('pointercancel', function () { dragging = null; });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1955 exposes patching, the active card, and state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1955 = {
      plug: plugVoice,
      unplug: unplugVoice,
      place: placeVoice,
      socketOf: function (name) { var v = voiceByName(name); return v ? v.socket : null; },
      pluggedCount: pluggedCount,
      activeCard: activeCard,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  // Apply the ?plug= / ?unplug= hooks after resize(), so the
  // socket geometry is real, and before the first frame either way.
  if (probePlug) { plugVoice(probePlug.name, probePlug.socket); }
  if (probeUnplug) { unplugVoice(probeUnplug); }
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the motif loop advances one card every 2 s and
  // the active card's notes pulse gently, all well under the
  // 14 Hz ceiling. Guarded so node-canvas QA (no
  // requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
