<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime / Uncal</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: two concentric step-sequencer rings on black. The outer ring
   PRIME steps every 0.29 s, the inner ring UNCAL every 0.31 s, a ratio of
   the primes 29 and 31. Their steps disagree most of the time; on the rare
   steps where both fire together the coincidence flashes white. The viewer
   only watches. Audio is described in process.md; the visuals carry the
   piece and nothing here plays sound. */
var TAU = Math.PI * 2;
var GROUND = '#000000';
var AMBER = '#FFB000';
var PALE_GREEN = '#A9E6A1';
var RED_LED = '#FF2A18';
var WHITE = '#FFFFFF';
var PLATE = '#101013';
var PLATE_LINE = 'rgba(237,237,232,0.30)';
var TITLE_INK = '#EDEDE8';
var HINT_INK = '#9AA3AD';
var FRAME_T = 60.0;        /* fixed phase: t = 60 s, no coincidence flashing */
var PRIME_N = 29;          /* outer ring steps per revolution, prime */
var PRIME_DUR = 0.29;      /* outer step duration, seconds (29 x 0.01) */
var UNCAL_N = 31;          /* inner ring steps per revolution, prime */
var UNCAL_DUR = 0.31;      /* inner step duration, seconds (31 x 0.01) */
var COIN_PERIOD = 8.99;    /* LCM(0.29, 0.31): coincidence every 8.99 s */
var FLASH_DUR = 0.6;       /* coincidence flash decay, seconds */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- ring state: closed-form functions of piece time ---- */
function stepIndex(t, dur, n) {
  return Math.floor(t / dur) % n;
}
function flashAt(t) {
  var last = Math.floor(t / COIN_PERIOD) * COIN_PERIOD;
  var dt = t - last;
  if (dt < 0 || dt >= FLASH_DUR) return 0;
  return 1 - dt / FLASH_DUR;
}
function ringState(t) {
  return {
    p: stepIndex(t, PRIME_DUR, PRIME_N),
    u: stepIndex(t, UNCAL_DUR, UNCAL_N),
    flash: flashAt(t)
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function dotXY(cx, cy, R, i, n) {
  var a = -Math.PI / 2 + i * TAU / n;
  return { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R };
}
function drawRing(cx, cy, R, n, idx, color, dotR, flash) {
  var i, p, r;
  /* faint track circle */
  ctx.strokeStyle = rgba(color, 0.18);
  ctx.lineWidth = Math.max(1, dotR * 0.18);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.stroke();
  for (i = 0; i < n; i++) {
    p = dotXY(cx, cy, R, i, n);
    if (i === idx) {
      /* active step: bright core, glow ring, white during a flash */
      r = dotR * 1.9;
      ctx.fillStyle = flash > 0 ? rgba(WHITE, 0.35 + 0.65 * flash) : rgba(color, 0.25);
      ctx.beginPath();
      ctx.moveTo(p.x + r, p.y);
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.fill();
      ctx.fillStyle = flash > 0 ? WHITE : color;
      ctx.beginPath();
      ctx.moveTo(p.x + dotR * 1.15, p.y);
      ctx.arc(p.x, p.y, dotR * 1.15, 0, TAU);
      ctx.fill();
    } else {
      ctx.fillStyle = rgba(color, 0.55);
      ctx.beginPath();
      ctx.moveTo(p.x + dotR, p.y);
      ctx.arc(p.x, p.y, dotR, 0, TAU);
      ctx.fill();
    }
  }
}
function drawFlash(sc, flash) {
  if (flash <= 0) return;
  var cx = sc.x + sc.w / 2, cy = sc.y + sc.h / 2;
  var R = Math.min(sc.w, sc.h) * 0.43;
  var a = Math.round(flash * 10000) / 10000;
  /* white halo just outside the outer ring */
  ctx.strokeStyle = rgba(WHITE, 0.9 * a);
  ctx.lineWidth = Math.max(2, sc.w * 0.006);
  ctx.beginPath();
  ctx.arc(cx, cy, R + sc.w * 0.018, 0, TAU);
  ctx.stroke();
  /* white star marker at the centre of the rings */
  var r1 = sc.w * 0.028, r2 = sc.w * 0.010, i, ang, rr, px, py;
  ctx.fillStyle = rgba(WHITE, a);
  ctx.beginPath();
  for (i = 0; i < 16; i++) {
    ang = i * TAU / 16;
    rr = (i % 2 === 0) ? r1 : r2;
    px = cx + Math.cos(ang) * rr;
    py = cy + Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}
function drawLabels(sc) {
  var cx = sc.x + sc.w / 2, cy = sc.y + sc.h / 2;
  var m = Math.min(sc.w, sc.h);
  var rOuter = m * 0.43, rInner = m * 0.27;
  var labelPx = Math.max(13, Math.round(m * 0.028));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  /* PRIME in red LED letters, in the band between the rings at the top */
  var py = cy - (rOuter + rInner) / 2;
  ctx.font = 'bold ' + labelPx + 'px monospace';
  ctx.fillStyle = rgba(RED_LED, 0.35);
  ctx.fillText('P R I M E', cx + 2, py + 2);
  ctx.fillStyle = RED_LED;
  ctx.fillText('P R I M E', cx, py);
  /* UNCAL in pale green at the centre of the rings */
  ctx.fillStyle = rgba(PALE_GREEN, 0.35);
  ctx.fillText('U N C A L', cx + 2, cy + 2);
  ctx.fillStyle = PALE_GREEN;
  ctx.fillText('U N C A L', cx, cy);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Prime / Uncal').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Prime / Uncal').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 29').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Prime / Uncal', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 29', plateX + 14, plateY + 7 + titlePx + 3);
  /* hint plate, wrapped to fit the viewport width */
  var hint = 'Two rings slip past each other; when they agree, the flash lands. Watch only.';
  ctx.font = smallPx + 'px monospace';
  var maxW = VW - 48;
  var words = hint.split(' ');
  var lines = [''], li = 0;
  var w, test;
  for (w = 0; w < words.length; w++) {
    test = lines[li] === '' ? words[w] : lines[li] + ' ' + words[w];
    if (ctx.measureText(test).width > maxW && lines[li] !== '') { li++; lines[li] = words[w]; }
    else lines[li] = test;
  }
  var hintW = 0;
  for (w = 0; w < lines.length; w++) hintW = Math.max(hintW, ctx.measureText(lines[w]).width);
  var hintPlateW = hintW + 24;
  var hintPlateH = lines.length * (smallPx + 3) + 11;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  for (w = 0; w < lines.length; w++) {
    ctx.fillText(lines[w], hintPlateX + 12, hintPlateY + 7 + w * (smallPx + 3));
  }
}
function draw() {
  size();
  var sc = sceneRect();
  var t = phaseT;
  var st = ringState(t);
  var cx = sc.x + sc.w / 2, cy = sc.y + sc.h / 2;
  var m = Math.min(sc.w, sc.h);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawRing(cx, cy, m * 0.43, PRIME_N, st.p, AMBER, Math.max(4, m * 0.008), st.flash);
  drawRing(cx, cy, m * 0.27, UNCAL_N, st.u, PALE_GREEN, Math.max(3.5, m * 0.007), st.flash);
  drawFlash(sc, st.flash);
  drawLabels(sc);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    stateAt: function (t) { return ringState(t); }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, PRIME step 3, UNCAL step 7, no flash ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
