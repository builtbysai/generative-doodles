<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Between Two Points</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#000000';
var INK = '#f2f2f0';
var ORANGE = '#e56b1f';
var FOOTER_DATE = '2006 · 11 · 19';
var FRAME_T = 60.0; /* fixed phase: first entry fully legible, orange footer in place */
var ENTRY_PERIOD = 600.0; /* seconds per entry: ten minutes in practice */
var FADE = 20.0; /* seconds of cross-fade at each entry boundary */
var FOOTER_H = 64; /* px, desktop; phone uses 56 */
/* Fixed authored entry table: station name, date, color word per entry.
   Indexed as a pure function of piece time; never fetched, never random. */
var ENTRIES = [
  ['shinjuku', '2006 · 11 · 19', 'orange'],
  ['berlin hauptbahnhof', '2006 · 12 · 19', 'grey'],
  ['hiroshima', '2007 · 01 · 19', 'white'],
  ['graz hauptbahnhof', '2007 · 02 · 19', 'blue'],
  ['tokyo', '2007 · 03 · 19', 'black'],
  ['kyoto', '2007 · 04 · 19', 'red'],
  ['vienna westbahnhof', '2007 · 05 · 19', 'amber'],
  ['osaka', '2007 · 06 · 19', 'pale']
];
var PLATE_BG = 'rgba(255,255,255,0.08)';
var PLATE_LINE = 'rgba(255,255,255,0.25)';
var PLATE_INK = '#d8d8d8';
var HINT_INK = '#b8b8b8';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* Entry state at piece time t: index of the incoming entry, alpha of the
   incoming entry (0 to 1 over FADE seconds), and alpha of the outgoing
   entry (1 to 0 over the same ramp). Closed form, no state. */
function entryState(t) {
  var n = ENTRIES.length;
  var idx = Math.floor(t / ENTRY_PERIOD) % n;
  var local = t - Math.floor(t / ENTRY_PERIOD) * ENTRY_PERIOD;
  var a = 1;
  if (local < FADE) a = local / FADE;
  var prev = (idx + n - 1) % n;
  return { idx: idx, prev: prev, a: a, prevA: 1 - a };
}
function drawEntry(lines, alpha, cx, cy, stationPx, datePx) {
  if (alpha <= 0.0005) return;
  var lead = stationPx * 1.9;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = rgba(INK, alpha);
  ctx.font = '300 ' + stationPx + 'px Helvetica, Arial, sans-serif';
  ctx.fillText(lines[0], cx, cy - lead);
  ctx.font = '300 ' + datePx + 'px Helvetica, Arial, sans-serif';
  ctx.fillText(lines[1], cx, cy);
  ctx.font = '300 ' + stationPx + 'px Helvetica, Arial, sans-serif';
  ctx.fillText(lines[2], cx, cy + lead);
}
function drawStack() {
  var stationPx = isPhone ? 22 : 28;
  var datePx = isPhone ? 16 : 20;
  var footerH = isPhone ? 56 : FOOTER_H;
  var cx = VW / 2;
  var cy = (VH - footerH) / 2;
  var st = entryState(phaseT);
  /* outgoing entry first so the incoming entry paints over it */
  drawEntry(ENTRIES[st.prev], st.prevA, cx, cy, stationPx, datePx);
  drawEntry(ENTRIES[st.idx], st.a, cx, cy, stationPx, datePx);
}
function drawFooter() {
  var footerH = isPhone ? 56 : FOOTER_H;
  var w = Math.min(420, VW * 0.62);
  var x = (VW - w) / 2;
  var y = VH - footerH;
  ctx.fillStyle = ORANGE;
  ctx.fillRect(x, y, w, footerH);
  var datePx = isPhone ? 15 : 18;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '300 ' + datePx + 'px Helvetica, Arial, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(FOOTER_DATE, VW / 2, y + footerH / 2);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Between Two Points').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Between Two Points').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 19').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_BG;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Between Two Points', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 19', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var footerH = isPhone ? 56 : FOOTER_H;
  var hintPlateY = VH - footerH - hintPlateH - 12;
  ctx.fillStyle = PLATE_BG;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawStack();
  drawFooter();
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    entryState: function () { var s = entryState(phaseT); return [s.idx, +s.a.toFixed(3), s.prev, +s.prevA.toFixed(3)]; }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
