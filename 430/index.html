<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.430 Golden City</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#A8D8F0; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.430 Golden City (yaelhofri, EXPANSION #46).
// After Yael Hofri's "Golden City - Warsaw" travel-poster
// puzzle: a city square at spring noon under one big flat
// sun. A tall column stands centre-left at full height,
// stacked rects and a capital carrying a statue silhouette
// that holds a cross. Behind it, red-tiled roofs and green
// domes layer across the horizon in depth bands; on the
// plaza in front, six tiny strollers amble at an eighth
// of the height: a woman carrying a teddy bear, a couple
// with a camera raised, men in scarves and coats.
//
// The master loop is 180s, chosen so every beat of the
// prompt lands on a whole count: the sun glows (scale
// 1.0 to 1.03) on 15 whole 12s cycles; the couple's camera
// flashes at 20 fixed slots, one every 9s, a flat cream
// dot pop at the camera; bird flocks cross the sky on 6
// fixed 30s slots (the prompt's 25s cadence resolved to
// fixed slots so the seam is exact); clouds drift across
// the sun a whole number of field widths per loop; every
// stroller bobs and strides on whole cycles per loop.
// DRAG horizontally shifts the three depth bands (sky
// 0.2x, roofs and domes 0.5x, plaza and figures 1.0x),
// clamped so no band edge ever shows, and on release the
// pan springs back to exactly zero. Frame one is drawn
// synchronously at the constant phase T = 71.15s (sun
// glowing, a bird flock mid-crossing, figures mid-stride);
// the clock is anchored there and advances in fixed 1/60
// ticks, never from a wall clock. Flat colour only, one
// canvas, no offscreen canvas, no gradients, no
// shadowBlur, no text or signage anywhere.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Closed set from the prompt, nothing else: flat sky blue,
// sun gold, roof red, dome green, two facade tones, column
// stone, figure skin, three coat colours, street cream.
// The camera flash takes the pale facade cream: it reads
// as a white pop and stays inside the palette. Bird
// silhouettes take the darkest coat brown.
var SKY = '#A8D8F0', SUN = '#F5A623', ROOF = '#C0392B';
var DOME = '#4E7A3A', FACE_A = '#F6EDE3', FACE_B = '#EFD9A7';
var COLUMN = '#D9C9A8', SKIN = '#F2C49B';
var COAT_BLUE = '#3E7CB1', COAT_PINK = '#D94F6B', COAT_BROWN = '#5B3A29';
var STREET = '#E8DCC8';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 180;
if (LOOP !== 180) throw new Error('Golden City loop must be 180s');
var TICK = 1 / 60;
var PAN_MAX = 150;

// ---- small draw helpers ---------------------------------
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function ell(x, y, rx, ry, fill) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function rect(x, y, w, h, fill) {
  if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
}
function line(x0, y0, x1, y1, col, lw) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function poly(pts, fill) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}

// ---- sky band data ---------------------------------------
// The sun: one flat disc, top-right, with two stepped
// flat-alpha halo discs. Its glow is a pure scale pulse,
// 1.0 to 1.03 on a 12s period, 15 whole cycles per loop.
var SUN_X = 1025, SUN_Y = 175, SUN_R = 118;
// Clouds: pale facade cream puffs drifting a whole number
// of wrap widths per loop, so each returns exactly to its
// start at the seam. wrapW covers the design plus margins.
var WRAP_W = DW + 480;
var CLOUDS = [
  { x0: 180,  y: 120, s: 1.00, k: 1 },
  { x0: 760,  y: 84,  s: 0.72, k: 2 },
  { x0: 1240, y: 268, s: 0.85, k: 1 },
  { x0: 420,  y: 300, s: 0.60, k: 2 }
];
// Bird flocks: 6 crossings on fixed 30s slots, each
// crossing taking the first 14s of its slot, alternating
// direction, the rest of the slot empty sky.
var BIRD_SLOTS = [
  { y: 150, s: 1.00, dir: 1 },
  { y: 215, s: 0.80, dir: -1 },
  { y: 125, s: 1.10, dir: 1 },
  { y: 245, s: 0.90, dir: -1 },
  { y: 180, s: 1.00, dir: 1 },
  { y: 140, s: 0.85, dir: -1 }
];
if (BIRD_SLOTS.length !== 6) throw new Error('Golden City needs exactly 6 bird slots');

// ---- mid band data: buildings -----------------------------
// Authored row along the horizon (baseline y = 692),
// spanning well past both design edges so the 0.5x
// parallax shift never shows an edge. kind: gable (red
// triangle roof), dome (green dome on a drum), tower
// (narrow, domed), flat (red slab roof).
var BASE_Y = 692;
var BUILDINGS = [
  { x: -280, w: 190, h: 210, f: FACE_B, kind: 'gable' },
  { x: -110, w: 150, h: 160, f: FACE_A, kind: 'dome' },
  { x: 30,   w: 210, h: 250, f: FACE_A, kind: 'gable' },
  { x: 230,  w: 90,  h: 330, f: FACE_B, kind: 'tower' },
  { x: 330,  w: 200, h: 190, f: FACE_B, kind: 'flat' },
  { x: 520,  w: 170, h: 270, f: FACE_A, kind: 'dome' },
  { x: 680,  w: 220, h: 215, f: FACE_B, kind: 'gable' },
  { x: 890,  w: 150, h: 300, f: FACE_A, kind: 'tower' },
  { x: 1030, w: 200, h: 180, f: FACE_B, kind: 'dome' },
  { x: 1220, w: 180, h: 240, f: FACE_A, kind: 'gable' },
  { x: 1390, w: 190, h: 170, f: FACE_B, kind: 'flat' }
];
if (BUILDINGS.length !== 11) throw new Error('Golden City building row must hold 11');

// ---- near band data: the six strollers --------------------
// Exactly 6 authored figures, about 112 tall (an eighth
// of the height). cyc = stride cycles per loop (whole),
// stroll = lateral amble cycles per loop (whole), range
// = amble half-width. The camera couple barely ambles.
var FIGURES = [
  { x: 520, y: 838, coat: COAT_PINK,  scarf: COAT_BLUE,  cyc: 90, stroll: 3, range: 16, ph: 0.0, teddy: true },
  { x: 700, y: 826, coat: COAT_BLUE,  scarf: COAT_PINK,  cyc: 90, stroll: 1, range: 5,  ph: 1.7, camera: true },
  { x: 742, y: 830, coat: COAT_PINK,  scarf: COAT_BROWN, cyc: 84, stroll: 1, range: 5,  ph: 3.9 },
  { x: 905, y: 852, coat: COAT_BROWN, scarf: COAT_PINK,  cyc: 96, stroll: 2, range: 14, ph: 2.6, hat: true },
  { x: 1085, y: 820, coat: COAT_BLUE, scarf: COAT_BROWN, cyc: 90, stroll: 3, range: 18, ph: 5.1, hat: true },
  { x: 180, y: 856, coat: COAT_PINK,  scarf: COAT_BLUE,  cyc: 78, stroll: 2, range: 12, ph: 4.4 }
];
if (FIGURES.length !== 6) throw new Error('Golden City needs exactly 6 strollers');

// ---- sky band drawing --------------------------------------
function drawSun(lt, off) {
  var g = 1 + 0.03 * (0.5 - 0.5 * Math.cos(2 * Math.PI * lt / 12));
  ctx.save();
  ctx.translate(SUN_X + off, SUN_Y);
  ctx.scale(g, g);
  ctx.globalAlpha = 0.07; circ(0, 0, 182, SUN);
  ctx.globalAlpha = 0.15; circ(0, 0, 150, SUN);
  ctx.globalAlpha = 1;
  circ(0, 0, SUN_R, SUN);
  ctx.restore();
}
function drawCloud(cl, lt, off) {
  var x = ((cl.x0 + cl.k * WRAP_W * lt / LOOP) % WRAP_W) - 240 + off;
  var y = cl.y, s = cl.s;
  ell(x, y, 48 * s, 21 * s, FACE_A);
  ell(x - 36 * s, y + 7 * s, 31 * s, 14 * s, FACE_A);
  ell(x + 38 * s, y + 7 * s, 33 * s, 15 * s, FACE_A);
  rect(x - 48 * s, y, 96 * s, 12 * s, FACE_A);
}
function drawBird(x, y, flap, s) {
  ctx.beginPath();
  ctx.moveTo(x - 13 * s, y + 2 * s);
  ctx.quadraticCurveTo(x - 6 * s, y - (6 + flap * 5) * s, x, y);
  ctx.quadraticCurveTo(x + 6 * s, y - (6 + flap * 5) * s, x + 13 * s, y + 2 * s);
  ctx.strokeStyle = COAT_BROWN; ctx.lineWidth = 3 * s; ctx.lineCap = 'round'; ctx.stroke();
}
function drawBirds(lt, off) {
  var slot = Math.floor(lt / 30);
  var local = lt - slot * 30;
  if (local >= 14) return;
  var b = BIRD_SLOTS[slot];
  var p = local / 14;
  var bx = b.dir > 0 ? -170 + p * 1620 : DW + 170 - p * 1620;
  var flap = Math.sin(2 * Math.PI * lt * 3);
  drawBird(bx + off, b.y, flap, b.s);
  drawBird(bx - b.dir * 48 * b.s + off, b.y + 20 * b.s, Math.sin(2 * Math.PI * lt * 3 + 1.3), b.s * 0.8);
  drawBird(bx - b.dir * 92 * b.s + off, b.y - 8 * b.s, Math.sin(2 * Math.PI * lt * 3 + 2.6), b.s * 0.9);
}

// ---- mid band drawing --------------------------------------
function drawBuilding(b, bi, off) {
  var x = b.x + off, top = BASE_Y - b.h;
  rect(x, top, b.w, b.h, b.f);
  // windows: sky-blue panes on a fixed grid, a fixed
  // skip pattern per building so the row never twinkles
  var cols = Math.max(1, Math.floor(b.w / 44));
  var rows = Math.max(1, Math.floor(b.h / 52));
  var cw = b.w / cols, rh = b.h / (rows + 0.6);
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      if ((r * 7 + c * 3 + bi * 5) % 4 === 0) continue;
      rect(x + c * cw + cw * 0.32, top + 14 + r * rh, 15, 21, SKY);
    }
  }
  if (b.kind === 'gable') {
    poly([x - 5, top, x + b.w + 5, top, x + b.w / 2, top - b.w * 0.34], ROOF);
  } else if (b.kind === 'flat') {
    rect(x - 5, top - 10, b.w + 10, 12, ROOF);
  } else {
    // dome or tower top: a drum, a semicircle dome in
    // green, and a finial spike with a ball
    var dw = b.kind === 'tower' ? b.w * 0.86 : b.w * 0.66;
    var dx = x + (b.w - dw) / 2;
    rect(dx, top - 16, dw, 16, b.f);
    ctx.beginPath(); ctx.arc(x + b.w / 2, top - 16, dw / 2, Math.PI, 0); ctx.closePath();
    ctx.fillStyle = DOME; ctx.fill();
    line(x + b.w / 2, top - 16 - dw / 2, x + b.w / 2, top - 16 - dw / 2 - 15, DOME, 5);
    circ(x + b.w / 2, top - 16 - dw / 2 - 19, 4.5, DOME);
  }
}

// ---- near band drawing -------------------------------------
function drawStreet(off) {
  rect(-420 + off, BASE_Y, DW + 840, DH - BASE_Y + 60, STREET);
  rect(-420 + off, BASE_Y - 8, DW + 840, 10, COLUMN);
}
function drawColumn(off) {
  var cx = 345 + off;
  // soft flat shadow pool on the plaza
  ctx.globalAlpha = 0.30; ell(cx + 8, 792, 92, 13, COLUMN); ctx.globalAlpha = 1;
  // pedestal: ground step, slab, block
  rect(cx - 73, 772, 146, 16, COLUMN);
  rect(cx - 61, 748, 122, 26, COLUMN);
  rect(cx - 49, 680, 98, 70, COLUMN);
  // base flare, tapered shaft, capital flare, capital slab
  rect(cx - 39, 658, 78, 24, COLUMN);
  poly([cx - 31, 204, cx + 31, 204, cx + 26, 658, cx - 26, 658], COLUMN);
  rect(cx - 31, 190, 62, 16, COLUMN);
  rect(cx - 43, 172, 86, 20, COLUMN);
  // statue silhouette: head, capsule body, one arm raised
  // holding a cross (vertical and horizontal bars)
  circ(cx - 2, 114, 10, COLUMN);
  line(cx - 2, 124, cx - 2, 172, COLUMN, 19);
  line(cx, 138, cx + 25, 110, COLUMN, 8);
  line(cx + 27, 82, cx + 27, 138, COLUMN, 7);
  line(cx + 13, 100, cx + 41, 100, COLUMN, 7);
}
var CAM = { x: 0, y: 0 };
function drawFigure(f, lt) {
  var ph = 2 * Math.PI * (lt * f.cyc / LOOP) + f.ph;
  var sway = Math.sin(2 * Math.PI * (lt * f.stroll / LOOP) + f.ph);
  var x = f.x + sway * f.range;
  var baseY = f.y;
  var bob = Math.abs(Math.sin(ph)) * 3;
  var hipY = baseY - 46 - bob;
  var topY = baseY - 92 - bob;
  var s = Math.sin(ph);
  // legs in coat brown, alternating stride
  line(x, hipY + 4, x + s * 15, baseY, COAT_BROWN, 7);
  line(x, hipY + 4, x - s * 15, baseY, COAT_BROWN, 7);
  // torso: a thick round-capped line reads as a capsule
  line(x, hipY, x, topY, f.coat, 30);
  // scarf: a band at the neck and a tail that flutters
  rect(x - 11, topY - 3, 22, 8, f.scarf);
  poly([x - 11, topY + 3, x - 20 - s * 2, topY + 20, x - 8, topY + 16], f.scarf);
  // head
  circ(x, topY - 14, 11, SKIN);
  if (f.hat) {
    rect(x - 14, topY - 24, 28, 5, COAT_BROWN);
    ctx.beginPath(); ctx.arc(x, topY - 24, 9, Math.PI, 0); ctx.closePath();
    ctx.fillStyle = COAT_BROWN; ctx.fill();
  }
  // arm forward-down
  line(x + 4, topY + 8, x + 17, topY + 32, f.coat, 8);
  if (f.teddy) {
    // tiny teddy bear held at her other side: brown body,
    // head, ears, a pale muzzle
    var tx = x - 26, ty = baseY - 62 - bob;
    line(x - 4, topY + 8, tx + 6, ty + 2, f.coat, 8);
    ell(tx, ty + 10, 9, 12, COAT_BROWN);
    circ(tx, ty - 6, 7.5, COAT_BROWN);
    circ(tx - 6, ty - 12, 3.2, COAT_BROWN);
    circ(tx + 6, ty - 12, 3.2, COAT_BROWN);
    ell(tx, ty - 4, 3.6, 2.8, SKIN);
  }
  if (f.camera) {
    // both arms up, a small brown camera box at the face
    line(x + 4, topY + 8, x + 20, topY - 12, f.coat, 8);
    line(x - 4, topY + 8, x + 15, topY - 10, f.coat, 8);
    rect(x + 13, topY - 21, 18, 12, COAT_BROWN);
    CAM.x = x + 33; CAM.y = topY - 15;
  }
}
function drawFlash(lt) {
  var ft = lt % 9;
  if (ft >= 0.35) return;
  var a = 1 - ft / 0.35;
  ctx.globalAlpha = 0.20 * a; circ(CAM.x, CAM.y, 26, FACE_A);
  ctx.globalAlpha = 0.45 * a; circ(CAM.x, CAM.y, 15, FACE_A);
  ctx.globalAlpha = 0.95 * a; circ(CAM.x, CAM.y, 6.5, FACE_A);
  ctx.globalAlpha = 1;
}

function draw(lt, pan) {
  var skyOff = pan * 0.2, midOff = pan * 0.5, nearOff = pan;
  drawSun(lt, skyOff);
  var i;
  for (i = 0; i < CLOUDS.length; i++) drawCloud(CLOUDS[i], lt, skyOff);
  drawBirds(lt, skyOff);
  for (i = 0; i < BUILDINGS.length; i++) drawBuilding(BUILDINGS[i], i, midOff);
  drawStreet(nearOff);
  drawColumn(nearOff);
  for (i = 0; i < FIGURES.length; i++) drawFigure(FIGURES[i], lt);
  drawFlash(lt);
}

// ---- piece state ---------------------------------------------------
// Constant first-frame phase: T = 71.15s into the 180s
// loop (sun glowing mid-cycle, the third bird flock mid-
// crossing, every stroller mid-stride). The clock advances
// in fixed 1/60 ticks from there.
var T = 71.15;
var lastNow = -1, acc = 0;
// The pan: while dragging it eases toward the clamped
// target; on release a spring in step() drives it back
// and snaps to exactly zero.
var pan = 0, panVel = 0, panTarget = 0, dragging = false;

function step() {
  if (dragging) {
    pan += (panTarget - pan) * 0.35;
    panVel = 0;
  } else if (pan !== 0 || panVel !== 0) {
    panVel += -pan * 0.010;
    panVel *= 0.90;
    pan += panVel;
    if (Math.abs(pan) < 0.05 && Math.abs(panVel) < 0.05) { pan = 0; panVel = 0; }
  }
  T += TICK;
}

// ---- pointer: drag horizontally to shift the depth bands -----------
function toDesign(ev) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cx = (ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0)) - r.left;
  var cy = (ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0)) - r.top;
  return { x: (cx - OX) / S, y: (cy - OY) / S };
}
var dragStartX = 0, dragStartPan = 0;
function onDown(ev) {
  dragging = true;
  dragStartX = toDesign(ev).x;
  dragStartPan = panTarget;
  if (ev.preventDefault) ev.preventDefault();
}
function onMove(ev) {
  if (!dragging) return;
  var dx = toDesign(ev).x - dragStartX;
  panTarget = Math.max(-PAN_MAX, Math.min(PAN_MAX, dragStartPan + dx));
  if (ev.preventDefault) ev.preventDefault();
}
function onUp() { dragging = false; }
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('touchcancel', onUp);
}

// ---- sizing ----------------------------------------------------------
// Full-bleed field: cover fit on every screen.
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T % LOOP, pan);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
