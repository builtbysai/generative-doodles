<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№92 · Flourish Field</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E7C7B; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,255,255,0.85); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to spin the field</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.92 Flourish Field: seeded PRNG "Flourish Field", 64 bars, static poster with drag-only spin, one coral bar
const BARS=64;
const frnd=mulberry(hashStr('Flourish Field'));
let rawLens=[]; for(let i=0;i<BARS;i++) rawLens.push(frnd());
let sm=[]; for(let i=0;i<BARS;i++){ const a=rawLens[(i-1+BARS)%BARS], b=rawLens[i], c=rawLens[(i+1)%BARS]; sm.push(a*0.25+b*0.5+c*0.25); } const smin=Math.min(...sm), smax=Math.max(...sm); let lens=sm.map(v=>0.40+0.60*((v-smin)/Math.max(0.0001,smax-smin)));
const GOLDEN=2.399963229728653;
const coralIdx=((Math.round((((-Math.PI/2+GOLDEN)%(Math.PI*2)+Math.PI*2)%(Math.PI*2))/(Math.PI*2)*BARS))%BARS+BARS)%BARS;
let spin=0, dragging=false, lastAng=null;
function discCentre(w,h){ const phone=isPhone(); let ox=0, oy=0, dw=w, dh=h; if(!phone){ const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; dw=S; dh=S; } return [ox+dw*0.38, oy+dh*0.44, ox, oy, dw, dh]; }
function drawBar(cx,cy,a,len,S,col){
  const wb=S*0.0055, wt=S*0.0012;
  const dx=Math.cos(a), dy=Math.sin(a), px=-dy, py=dx;
  const r0=S*0.105;
  const x0=cx+dx*r0, y0=cy+dy*r0, x1=cx+dx*len, y1=cy+dy*len;
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(x0+px*wb, y0+py*wb); ctx.lineTo(x1+px*wt, y1+py*wt); ctx.lineTo(x1-px*wt, y1-py*wt); ctx.lineTo(x0-px*wb, y0-py*wb); ctx.closePath(); ctx.fill();
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#0E7C7B'; ctx.fillRect(0,0,w,h);
  const [cx,cy,ox,oy,dw,dh]=discCentre(w,h);
  const S=Math.min(dw,dh);
  const maxR=S*0.50;
  for(let i=0;i<BARS;i++){ if(i===coralIdx) continue; const a=(i/BARS)*Math.PI*2+spin; drawBar(cx,cy,a,maxR*lens[i],S,'#0D0D0D'); }
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(cx,cy,S*0.11,0,Math.PI*2); ctx.fill();
  const ca=(coralIdx/BARS)*Math.PI*2+spin; drawBar(cx,cy,ca,maxR*lens[coralIdx],S,'#FF6B4A');
  if(BARS!==64) console.assert(false,'bars',BARS);
  return {};
}
function angAt(e){ const [w,h]=viewportWH(); const c=discCentre(w,h); return Math.atan2(e.clientY-c[1], e.clientX-c[0]); }
canvas.addEventListener('pointerdown',e=>{ dragging=true; lastAng=angAt(e); });
canvas.addEventListener('pointermove',e=>{ if(!dragging||lastAng===null) return; const a=angAt(e); let d=a-lastAng; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; spin+=d; lastAng=a; });
function endP(){ dragging=false; lastAng=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
