<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Tunnel</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0908; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // Palette: strict, nothing else.
  var STONE = "#2A2622";   // tunnel stone
  var LINE  = "#1A1815";   // course lines
  var PALE  = "#D8D2C4";   // Image Stone
  var SUN   = "#FFB347";   // sun image
  var MOON  = "#8AA8C8";   // moon image
  var VOID  = "#0A0908";   // void

  var STONE_RGB = [42, 38, 34];
  var LINE_RGB  = [26, 24, 21];
  var PALE_RGB  = [216, 210, 196];
  var SUN_RGB   = [255, 179, 71];
  var MOON_RGB  = [138, 168, 200];

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  window.addEventListener("resize", resize);
  resize();

  // mulberry32: seeded stream for the dust motes.
  function makeRng(seed) {
    var s = seed | 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function css(c, a) {
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
  }

  // QA hook only: ?seed=dYYYY-MM-DD forces the program date (inert otherwise).
  function dateOverride() {
    try {
      var search = "";
      try { search = window.location.search || ""; } catch (e1) {}
      if (!search) { try { search = location.search || ""; } catch (e2) {} }
      var m = /[?&]seed=([^&]*)/.exec(search);
      if (!m) return null;
      var t = /^d(\d{4})-(\d{2})-(\d{2})$/.exec(decodeURIComponent(m[1]));
      if (!t) return null;
      return { year: parseInt(t[1], 10), month: parseInt(t[2], 10) - 1, day: parseInt(t[3], 10) };
    } catch (e) { return null; }
  }
  var OVERRIDE = dateOverride();

  // The date program reads Date only at (year, month, day) resolution:
  // the state is identical all day, so frame one is reproducible.
  function programDate() {
    if (OVERRIDE) return OVERRIDE;
    var now = new Date();
    return { year: now.getFullYear(), month: now.getMonth(), day: now.getDate() };
  }

  function dayOfYear(y, m, d) {
    return Math.floor((Date.UTC(y, m, d) - Date.UTC(y, 0, 0)) / 86400000);
  }

  // Solar declination in degrees for the date.
  function declination(y, m, d) {
    var doy = dayOfYear(y, m, d);
    return -23.44 * Math.cos(2 * Math.PI * (doy + 10) / 365);
  }

  // Years from the nearest major lunar standstill (2006, 2025, 2043, ...
  // on an 18.6-year cycle anchored at 2006.0). Small means near a standstill.
  function standstillDistance(y, m) {
    var t = (y - 2006) + m / 12;
    var cyc = t / 18.6;
    var frac = cyc - Math.floor(cyc);
    var dist = Math.min(frac, 1 - frac);
    return dist * 18.6;
  }

  // Which image the stone carries today.
  // Sun: Dec 11-31, the southernmost-sunset window. Moon: within 0.8 years
  // of a major standstill. Otherwise the stone stays near-dark.
  function branchFor(date) {
    if (date.month === 11 && date.day >= 11) return "sun";
    if (standstillDistance(date.year, date.month) < 0.8) return "moon";
    return "dark";
  }

  // Dust motes: fixed by seed in shaft coordinates (u along the shaft from
  // stone to mouth, v across it). Drift is a closed form of loop time.
  var motes = [];
  (function buildMotes() {
    var rng = makeRng(74903117);
    for (var i = 0; i < 90; i++) {
      motes.push({
        u: rng(), v: rng() * 2 - 1,
        r: 0.7 + rng() * 1.5,
        a: 0.10 + rng() * 0.22,
        phU: rng() * Math.PI * 2, phV: rng() * Math.PI * 2,
        perU: 90 + rng() * 140, perV: 60 + rng() * 110,
        ampU: 0.012 + rng() * 0.03, ampV: 0.05 + rng() * 0.10
      });
    }
  })();

  function draw(t) {
    if (W <= 0 || H <= 0) return;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "source-over";

    var date = programDate();
    var branch = branchFor(date);
    var decl = declination(date.year, date.month, date.day);
    var dn = decl / 23.44; // -1..1

    var M = Math.min(W, H);
    var vpx = W * 0.5;
    var vpy = H * (isPhone() ? 0.44 : 0.42); // vanishing point, above center
    var stoneRx = M * 0.085, stoneRy = M * 0.068;

    // Void.
    ctx.fillStyle = VOID;
    ctx.fillRect(0, 0, W, H);

    // Stone courses: concentric rectangles shrinking geometrically toward
    // the vanishing point, drawn largest first so the bands appear between
    // them. The largest ring runs off every edge: the mouth is the frame.
    var Q = 1.42;
    var scales = [];
    var s = 1;
    var diag = Math.sqrt(W * W + H * H);
    while (stoneRx * 1.3 * s < diag) { scales.push(s); s *= Q; }
    var i, k;
    for (i = scales.length - 1; i >= 0; i--) {
      var hw = stoneRx * 1.3 * scales[i];
      var hh = stoneRy * 1.45 * scales[i];
      ctx.fillStyle = STONE;
      ctx.fillRect(vpx - hw, vpy - hh, hw * 2, hh * 2);
      if (i % 2 === 1) { // alternate courses sit a shade darker
        ctx.fillStyle = css(LINE_RGB, 0.38);
        ctx.fillRect(vpx - hw, vpy - hh, hw * 2, hh * 2);
      }
      // Bevel: light catch on the top inner edge, shadow on the bottom.
      ctx.fillStyle = css(PALE_RGB, 0.055);
      ctx.fillRect(vpx - hw, vpy - hh, hw * 2, Math.max(1, hh * 0.05));
      ctx.fillStyle = css(LINE_RGB, 0.55);
      ctx.fillRect(vpx - hw, vpy + hh - Math.max(1, hh * 0.06), hw * 2, Math.max(1, hh * 0.06));
      // Course line at the ring boundary.
      ctx.strokeStyle = css(LINE_RGB, 0.9);
      ctx.lineWidth = Math.max(1, M * 0.0022);
      ctx.strokeRect(vpx - hw, vpy - hh, hw * 2, hh * 2);
    }

    // End wall immediately around the stone: a dim wash so the pale stone
    // reads against it.
    ctx.fillStyle = css(LINE_RGB, 0.45);
    ctx.fillRect(vpx - stoneRx * 1.3, vpy - stoneRy * 1.45, stoneRx * 2.6, stoneRy * 2.9);

    // Light shaft: nested translucent quads from the mouth (bottom edge)
    // converging on the stone, summed additively. It breathes by a few
    // percent on a slow closed-form cycle.
    var breathe = 1 + 0.05 * Math.sin(2 * Math.PI * t / 47);
    var shaftBase = branch === "sun" ? 0.085 : (branch === "moon" ? 0.06 : 0.045);
    var mouthHW = W * 0.46, mouthY = H + 2;
    function shaftQuad(shrink, alpha, rgb) {
      var tx = vpx, ty = vpy + stoneRy * 0.4;
      var bx = vpx, by = mouthY;
      var thw = stoneRx * (0.4 + 0.6 * shrink);
      var bhw = mouthHW * (0.35 + 0.65 * shrink);
      ctx.fillStyle = css(rgb, alpha);
      ctx.beginPath();
      ctx.moveTo(tx - thw, ty);
      ctx.lineTo(tx + thw, ty);
      ctx.lineTo(bx + bhw, by);
      ctx.lineTo(bx - bhw, by);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = "lighter";
    shaftQuad(1.0, shaftBase * 0.55 * breathe, PALE_RGB);
    shaftQuad(0.62, shaftBase * 0.75 * breathe, PALE_RGB);
    shaftQuad(0.34, shaftBase * breathe, branch === "sun" ? SUN_RGB : PALE_RGB);
    ctx.globalCompositeOperation = "source-over";

    // The Image Stone.
    var stoneAlpha = branch === "sun" ? 0.92 : (branch === "moon" ? 0.55 : 0.30);
    ctx.beginPath();
    ctx.ellipse(vpx, vpy, stoneRx, stoneRy, 0, 0, Math.PI * 2);
    ctx.fillStyle = css(PALE_RGB, stoneAlpha);
    ctx.fill();
    ctx.strokeStyle = css(PALE_RGB, branch === "dark" ? 0.38 : 0.6);
    ctx.lineWidth = Math.max(1, M * 0.0018);
    ctx.stroke();

    if (branch === "sun") {
      // The sun image, positioned on the stone by the declination: the
      // camera obscura inverts, so a southern (negative) declination puts
      // the image low and to the side on the stone.
      var sx = vpx + 0.25 * dn * stoneRx;
      var sy = vpy - 0.55 * dn * stoneRy;
      var sr = stoneRy * 0.34;
      ctx.globalCompositeOperation = "lighter";
      var glow = [[2.3, 0.10], [1.65, 0.16], [1.28, 0.26]];
      for (k = 0; k < glow.length; k++) {
        ctx.beginPath();
        ctx.arc(sx, sy, sr * glow[k][0], 0, Math.PI * 2);
        ctx.fillStyle = css(SUN_RGB, glow[k][1]);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fillStyle = css(SUN_RGB, 0.97);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(sx, sy, sr * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = css(PALE_RGB, 0.30);
      ctx.fill();
    } else if (branch === "moon") {
      var mx = vpx - 0.15 * dn * stoneRx;
      var my = vpy - 0.3 * dn * stoneRy;
      var mr = stoneRy * 0.42;
      ctx.globalCompositeOperation = "lighter";
      ctx.beginPath();
      ctx.arc(mx, my, mr * 1.6, 0, Math.PI * 2);
      ctx.fillStyle = css(MOON_RGB, 0.08);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.beginPath();
      ctx.arc(mx, my, mr, 0, Math.PI * 2);
      ctx.fillStyle = css(MOON_RGB, 0.5);
      ctx.fill();
    }
    // Dark branch: the stone keeps only its faint outline, as specced.

    // Dust motes inside the shaft, clipped to the shaft quad.
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(vpx - stoneRx * 0.9, vpy + stoneRy * 0.4);
    ctx.lineTo(vpx + stoneRx * 0.9, vpy + stoneRy * 0.4);
    ctx.lineTo(vpx + mouthHW, mouthY);
    ctx.lineTo(vpx - mouthHW, mouthY);
    ctx.closePath();
    ctx.clip();
    ctx.globalCompositeOperation = "lighter";
    for (i = 0; i < motes.length; i++) {
      var mo = motes[i];
      var u = mo.u + mo.ampU * Math.sin(2 * Math.PI * t / mo.perU + mo.phU);
      var v = mo.v + mo.ampV * Math.sin(2 * Math.PI * t / mo.perV + mo.phV);
      var my2 = (vpy + stoneRy * 0.4) + u * (mouthY - vpy);
      var halfW = stoneRx * 0.9 + u * (mouthHW - stoneRx * 0.9);
      var mx2 = vpx + v * halfW * 0.92;
      var tw = 0.75 + 0.25 * Math.sin(2 * Math.PI * t / (mo.perV * 0.7) + mo.phU);
      ctx.beginPath();
      ctx.arc(mx2, my2, mo.r * (0.6 + u * 0.9), 0, Math.PI * 2);
      ctx.fillStyle = css(PALE_RGB, mo.a * tw * (branch === "dark" ? 0.7 : 1));
      ctx.fill();
    }
    ctx.restore();
    ctx.globalCompositeOperation = "source-over";
  }

  draw(0);

  if (typeof requestAnimationFrame === "function") {
    var start = null;
    var loop = function (ts) {
      if (start === null) start = ts;
      draw((ts - start) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
