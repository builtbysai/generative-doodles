<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Tape, Afternoon Screen</title>
<style>
html,body{margin:0;padding:0;background:#e8e0d0;overflow:hidden;height:100%}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
// Palette only: interior cream, exterior brick, monitors charcoal/pale,
// clothes blue and brown, skin ivory, crowd slate, splice white. No other colour.
var CREAM = '#e8e0d0', BRICK = '#a8674a', CHARCOAL = '#2a2a30',
    PALE = '#d8d2c4', BLUE = '#4a5a7a', BROWN = '#6b4a3a',
    SKIN = '#f2ead8', SLATE = '#6b7686', WHITE = '#ffffff';
var W = 0, H = 0, tNow = 0, booted = false;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rnd(seed){var r = mulberry32(seed); return r();}
function size(){
  var w, h;
  if (typeof visualViewport !== 'undefined' && visualViewport) { w = visualViewport.width; h = visualViewport.height; }
  else { w = window.innerWidth; h = window.innerHeight; }
  W = w; H = h;
  canvas.width = Math.round(w); canvas.height = Math.round(h);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
}
function isPhone(){
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    return Math.min(window.screen.width, window.screen.height) < 700;
  }
  return H > W * 1.15;
}
function rect(x, y, w, h, col){ ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function mod(a, n){ var r = a % n; return r < 0 ? r + n : r; }
// Day loop: 60 s. Record 0-30, select 30-32, playback 32-60.
var DAY = 60, RECORD_LEN = 30, SELECT_LEN = 2;
// Seeded speaker schedule: 4 figures, durations 3-6 s, cycling.
var DUR = [];
for (var i = 0; i < 4; i++) DUR.push(3 + rnd(1473000 + i * 7919) * 3);
var CYCLE = DUR[0] + DUR[1] + DUR[2] + DUR[3];
function speakerAt(tau){
  var t = mod(tau, CYCLE), acc = 0;
  for (var i = 0; i < 4; i++){
    if (t < acc + DUR[i]) return {idx: i, local: t - acc, dur: DUR[i]};
    acc += DUR[i];
  }
  return {idx: 3, local: 0, dur: DUR[3]};
}
// Scrub state: drag on the lower panel during playback scrubs the playback
// position; release resumes advance from the scrubbed point. Closed-form:
// playback position is a pure function of piece time and recorded events.
var drag = null; // {offset} while a lower-panel drag is held
var release = null; // {day, t, offset} of the last release
function dayOf(t){ return Math.floor(t / DAY); }
function dayTime(t){ return t - dayOf(t) * DAY; }
function phaseAt(t){
  var dt = dayTime(t);
  if (dt < RECORD_LEN) return 'record';
  if (dt < RECORD_LEN + SELECT_LEN) return 'playback-select';
  return 'playback';
}
function playbackPos(t){
  var day = dayOf(t), dt = dayTime(t);
  if (drag) return drag.offset;
  if (release && release.day === day) return mod(release.offset + (t - release.t), RECORD_LEN);
  return mod(dt - (RECORD_LEN + SELECT_LEN), RECORD_LEN);
}
function lowerPanelY(){ return H * 2 / 3; }
function scrubOffsetForX(x){ return mod(x / Math.max(W, 1), 1) * RECORD_LEN; }
function pointerDownAt(x, y, t){
  if (phaseAt(t) === 'playback' && y >= lowerPanelY()){
    drag = {offset: scrubOffsetForX(x)};
  }
}
function pointerMoveAt(x, y, t){
  if (drag && y >= lowerPanelY() - 4){
    drag.offset = scrubOffsetForX(x);
  }
}
function pointerUpAt(t){
  if (drag){
    release = {day: dayOf(t), t: t, offset: drag.offset};
    drag = null;
  }
}
// ---- drawing helpers ----
function voiceLine(x, yTop, len, seed, col, lw){
  // Thin rising polyline with seeded wobble; drawn as segments, never Path2D.
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
  ctx.moveTo(x, yTop + len);
  var steps = 5;
  for (var s = 1; s <= steps; s++){
    var yy = yTop + len - (len * s / steps);
    var xx = x + (rnd(seed + s * 7919) - 0.5) * len * 0.22;
    ctx.lineTo(xx, yy);
  }
  ctx.stroke();
}
function drawFigure(x, baseY, h, clothes, skin, tilt, mouthShift, speaking, seed, scale){
  // Abstracted figure: head disc + body rect, own-beginPath arcs only.
  var hr = h * 0.16;
  var hy = baseY - h + hr;
  ctx.save();
  ctx.translate(x, hy);
  ctx.rotate(tilt);
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.moveTo(hr, 0); ctx.arc(0, 0, hr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = CHARCOAL;
  ctx.fillRect(-hr * 0.55 + mouthShift, hr * 0.18, hr * 1.1, Math.max(1, hr * 0.08));
  ctx.restore();
  rect(x - h * 0.16, baseY - h + hr * 2, h * 0.32, h - hr * 2, clothes);
  if (speaking){
    voiceLine(x, baseY - h - h * 0.02, h * 0.55, seed, BLUE, Math.max(1.5, h * 0.02 * scale));
  }
}
function draw(t){
  tNow = t;
  var ph = phaseAt(t);
  var dt = dayTime(t);
  var upH = lowerPanelY(), loH = H - upH;
  // Upper panel: interior room, cream wall.
  rect(0, 0, W, upH, CREAM);
  // Lower panel: exterior brick wall.
  rect(0, upH, W, loH, BRICK);
  var s = Math.min(W, H);
  // ---- upper room ----
  var figH = upH * 0.42;
  var baseY = upH * 0.92;
  var groundY = baseY + 1;
  rect(0, groundY, W, Math.max(1, s * 0.004), BROWN);
  var xs = [0.16, 0.38, 0.60, 0.82];
  var clothes = [BLUE, BROWN, BLUE, BROWN];
  // Live speaker during record; frozen end-of-record speaker during select;
  // idle figures (no speaker) during playback.
  var live = null;
  if (ph === 'record') live = speakerAt(dt);
  else if (ph === 'playback-select') live = speakerAt(RECORD_LEN - 0.01);
  for (var i = 0; i < 4; i++){
    var speaking = (live && live.idx === i);
    var tilt = 0;
    if (live){
      if (speaking) tilt = Math.sin(dt * 1.6) * 0.05;
      else tilt = (xs[live.idx] > xs[i] ? 1 : -1) * 0.06;
    }
    var mouth = speaking ? Math.sin(dt * 5) * figH * 0.012 : 0;
    drawFigure(xs[i] * W, baseY, figH, clothes[i], SKIN, tilt, mouth, speaking, 1473000 + i * 7919, 1);
  }
  // ---- monitors on the exterior wall ----
  var monW = Math.min(W * 0.22, loH * 1.5), monH = loH * 0.52;
  var monY = upH + loH * 0.10;
  var mxs = [W * (1/6), W * (3/6), W * (5/6)];
  var pos = playbackPos(t);
  for (var m = 0; m < 3; m++){
    var mx = mxs[m] - monW / 2;
    rect(mx - 3, monY - 3, monW + 6, monH + 6, CHARCOAL);
    if (ph === 'playback'){
      // Pale screen playing the recording; monitor m lags m*2 s behind.
      rect(mx, monY, monW, monH, PALE);
      var sp = speakerAt(pos - m * 2);
      var miniH = monH * 0.62, miniBase = monY + monH * 0.88;
      for (var j = 0; j < 4; j++){
        var jx = mx + monW * (0.18 + j * 0.22);
        var jspk = (sp.idx === j);
        var jtilt = jspk ? Math.sin(dt * 1.6) * 0.05 : (j < sp.idx ? 0.06 : -0.06);
        drawFigure(jx, miniBase, miniH, clothes[j], SKIN, jtilt, jspk ? Math.sin(dt * 5) * 1 : 0, jspk, 1473000 + j * 7919 + m * 131, 0.5);
      }
    } else {
      // Dark screen: charcoal fill with a thin pale border so it reads.
      rect(mx, monY, monW, monH, CHARCOAL);
      rect(mx, monY, monW, 2, PALE);
      rect(mx, monY + monH - 2, monW, 2, PALE);
      rect(mx, monY, 2, monH, PALE);
      rect(mx + monW - 2, monY, 2, monH, PALE);
    }
    // Splice mark: brief white tick on the monitor frame during select.
    if (ph === 'playback-select' && (dt - RECORD_LEN) < 0.5){
      rect(mx + monW - 10, monY - 3, 6, 3, WHITE);
    }
  }
  // ---- crowd below the monitors ----
  var crowdY = upH + loH * 0.86;
  var crowdH = loH * 0.12;
  for (var c = 0; c < 6; c++){
    var cx = W * (0.10 + c * 0.16);
    var nod = 0, ctilt = 0;
    if (ph === 'playback'){
      nod = Math.sin(dt * 1.2 + c * 0.9) * crowdH * 0.12;
      ctilt = (c % 2 === 0 ? 1 : -1) * 0.04;
    }
    var chr = crowdH * 0.45;
    ctx.save();
    ctx.translate(cx, crowdY + nod);
    ctx.rotate(ctilt);
    ctx.fillStyle = SLATE;
    ctx.beginPath(); ctx.moveTo(chr, 0); ctx.arc(0, 0, chr, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    rect(cx - crowdH * 0.5, crowdY + chr + nod, crowdH, crowdH * 0.5, SLATE);
  }
}
function loop(ts){
  var t = ts / 1000;
  draw(t);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof window !== 'undefined'){
  window.__piece = {
    draw: draw,
    phaseAt: phaseAt,
    playbackPos: playbackPos,
    speakerAt: speakerAt,
    getPhase: function(){ return phaseAt(tNow); },
    getPlaybackPos: function(){ return playbackPos(tNow); },
    getRecordSpeaker: function(){ return speakerAt(dayTime(tNow)).idx; },
    getMonitorSpeaker: function(m){ return speakerAt(playbackPos(tNow) - m * 2).idx; },
    down: function(x, y){ pointerDownAt(x, y, tNow); },
    move: function(x, y){ pointerMoveAt(x, y, tNow); },
    up: function(){ pointerUpAt(tNow); }
  };
  canvas.addEventListener('pointerdown', function(e){
    var r = canvas.getBoundingClientRect();
    pointerDownAt(e.clientX - r.left, e.clientY - r.top, tNow);
  });
  canvas.addEventListener('pointermove', function(e){
    var r = canvas.getBoundingClientRect();
    pointerMoveAt(e.clientX - r.left, e.clientY - r.top, tNow);
  });
  canvas.addEventListener('pointerup', function(){
    pointerUpAt(tNow);
  });
  window.addEventListener('resize', size);
  if (typeof visualViewport !== 'undefined' && visualViewport) visualViewport.addEventListener('resize', size);
}
size();
draw(0);
booted = true;
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
