<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Header System</title>
<style>
html, body { margin: 0; padding: 0; background: #dfe7ec; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var WHITE = '#ffffff';
var INK = '#111111';
var GREY_INK = '#5a5a5a';
var GROUND = '#dfe7ec';
var ICE_TOP = '#eef3f6';
var ICE_BOT = '#c7d3da';
var ICE_A = '#e7edf1';
var ICE_B = '#b4c3cd';
var ICE_C = '#d2dce1';
var RED = '#c8102e';
var FRAME_T = 60.0; /* fixed phase: one minute in at frame one */
var NAMES = ['Richard Chartier', 'Ryoji Ikeda', 'Alva Noto', 'Taylor Deupree', 'William Basinski', 'Mika Vainio', 'Tim Hecker', 'Mark Fell'];
var LINE_POINTS = 9;
var WALK_JITTER = 0.006; /* field-height units per 1/30 s step */
var WALK_PULL = 0.002; /* mean reversion per step, keeps the line in the field */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixRgb(a, b, t) {
  var ca = hexRgb(a), cb = hexRgb(b);
  return 'rgb(' + Math.round(ca[0] + (cb[0] - ca[0]) * t) + ',' + Math.round(ca[1] + (cb[1] - ca[1]) * t) + ',' + Math.round(ca[2] + (cb[2] - ca[2]) * t) + ')';
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* seeded 2D value noise for the perlin-advected field */
var prng = mulberry32(1771);
var PERM = new Array(512);
(function () {
  var p = [], i, j, t;
  for (i = 0; i < 256; i++) p[i] = i;
  for (i = 255; i > 0; i--) { j = Math.floor(prng() * (i + 1)); t = p[i]; p[i] = p[j]; p[j] = t; }
  for (i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function hash2(ix, iy) { return PERM[(PERM[ix & 255] + iy) & 255] / 255; }
function smooth(u) { return u * u * (3 - 2 * u); }
function vnoise(x, y) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  var u = smooth(fx), v = smooth(fy);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) {
  return vnoise(x, y) * 0.6 + vnoise(x * 2.13 + 7.7, y * 2.13 + 3.1) * 0.28 + vnoise(x * 4.31 + 13.7, y * 4.31 + 9.4) * 0.12;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect below the header band */
/* red hairline control-point offsets, seeded random walk in field-height units */
var walkRng = mulberry32(1771 + 7);
var offsets = [];
(function () {
  var k;
  for (k = 0; k < LINE_POINTS; k++) offsets[k] = (walkRng() - 0.5) * 0.08;
})();
function stepWalk() {
  var k;
  for (k = 0; k < LINE_POINTS; k++) {
    offsets[k] += (walkRng() - 0.5) * WALK_JITTER;
    offsets[k] += -offsets[k] * WALK_PULL;
    offsets[k] = clamp(offsets[k], -0.20, 0.20);
  }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  var headerH = VH * 0.2;
  if (isPhone) {
    F = { x: 0, y: headerH, w: VW, h: VH - headerH };
  } else {
    var side = Math.min(VW, VH - headerH);
    F = { x: (VW - side) / 2, y: headerH + (VH - headerH - side) / 2, w: side, h: side };
  }
}
function drawField() {
  var g = ctx.createLinearGradient(0, F.y, 0, F.y + F.h);
  g.addColorStop(0, ICE_TOP);
  g.addColorStop(1, ICE_BOT);
  ctx.fillStyle = g;
  ctx.fillRect(F.x, F.y, F.w, F.h);
  /* slow horizontal bands, advected by the noise field */
  var STRIPS = 90;
  var sh = F.h / STRIPS;
  var i, v;
  for (i = 0; i < STRIPS; i++) {
    v = fbm(i * 0.05 + 0.3 * Math.sin(phaseT * 0.01), phaseT * 0.006);
    v = clamp(v, 0, 1);
    ctx.fillStyle = mixRgb(ICE_A, ICE_B, v);
    ctx.fillRect(F.x, F.y + i * sh, F.w, sh + 1);
  }
  /* three large soft washes drifting across the ice */
  var washes = [
    { u: 0.30 + 0.18 * Math.sin(phaseT * 0.004 + 2.0), v: 0.30 + 0.12 * Math.sin(phaseT * 0.003 + 0.5), r: 0.48, c: ICE_C, a: 0.10 },
    { u: 0.72 + 0.14 * Math.sin(phaseT * 0.003 + 4.0), v: 0.62 + 0.10 * Math.sin(phaseT * 0.005 + 1.0), r: 0.42, c: WHITE, a: 0.08 },
    { u: 0.50 + 0.20 * Math.sin(phaseT * 0.002 + 5.5), v: 0.85 + 0.08 * Math.sin(phaseT * 0.004 + 3.0), r: 0.40, c: ICE_B, a: 0.07 }
  ];
  for (i = 0; i < washes.length; i++) {
    var w = washes[i];
    var cx = F.x + w.u * F.w, cy = F.y + w.v * F.h, cr = w.r * F.w;
    var rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
    rg.addColorStop(0, rgba(w.c, w.a));
    rg.addColorStop(1, rgba(w.c, 0));
    ctx.fillStyle = rg;
    ctx.fillRect(F.x, F.y, F.w, F.h);
  }
  drawRedLine();
}
function linePoint(k) {
  var u = k / (LINE_POINTS - 1);
  var base = 0.52 + 0.10 * Math.sin(k * 0.9 + 1.2);
  return { x: F.x + u * F.w, y: F.y + (base + offsets[k]) * F.h };
}
function drawRedLine() {
  var k, p, q, mx, my;
  ctx.strokeStyle = RED;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  p = linePoint(0);
  ctx.moveTo(p.x, p.y);
  for (k = 1; k < LINE_POINTS; k++) {
    p = linePoint(k - 1);
    q = linePoint(k);
    mx = (p.x + q.x) / 2;
    my = (p.y + q.y) / 2;
    ctx.quadraticCurveTo(p.x, p.y, mx, my);
  }
  p = linePoint(LINE_POINTS - 1);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
}
function drawHeader() {
  var hh = VH * 0.2;
  var pad = isPhone ? 16 : 24;
  ctx.fillStyle = WHITE;
  ctx.fillRect(0, 0, VW, hh);
  /* the changing artist name, black sans-serif, left */
  var nameIdx = Math.floor(phaseT / 3600) % NAMES.length;
  var name = NAMES[nameIdx];
  var namePx = Math.round(hh * 0.26);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + namePx + 'px sans-serif';
  while (namePx > 10 && ctx.measureText(name).width > VW * 0.55) {
    namePx -= 1;
    ctx.font = 'bold ' + namePx + 'px sans-serif';
  }
  ctx.fillText(name, pad, hh * 0.45);
  /* thin rule at the foot of the band */
  ctx.fillStyle = INK;
  ctx.fillRect(0, hh - 1, VW, 1);
  /* title, formula date and hint, small type at the right end */
  var smallPx = Math.max(11, Math.round(hh * 0.085));
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.font = smallPx + 'px sans-serif';
  ctx.fillStyle = INK;
  ctx.fillText('The Header System', VW - pad, hh * 0.28);
  ctx.fillStyle = GREY_INK;
  ctx.fillText('2006 · 11 · 17', VW - pad, hh * 0.52);
  ctx.fillText('Watch only.', VW - pad, hh * 0.76);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawField();
  drawHeader();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    nameIndex: function () { return Math.floor(phaseT / 3600) % NAMES.length; }
  };
}
/* ---- frame one: fixed phase t = 60 s, red-line walk pre-run 0 to 60 s in 1/30 s steps ---- */
size();
(function () {
  var steps = Math.round(FRAME_T * 30);
  var s;
  for (s = 0; s < steps; s++) stepWalk();
  phaseT = FRAME_T;
})();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0, acc = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      acc += dt;
      while (acc >= 1 / 30) { stepWalk(); acc -= 1 / 30; }
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
