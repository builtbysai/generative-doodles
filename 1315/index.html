<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chromatic Ground</title>
<style>
  html, body { margin: 0; padding: 0; background: #111111; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, booted = false, startTime = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Seeded static data (one stream, fixed layout per loop via loop seed).
  function buildData(seed) {
    var r = mulberry32(seed), d = { grain: [], wash: [], leak: [], check: [] };
    var i;
    for (i = 0; i < 260; i++) d.grain.push([r(), r(), 1 + r() * 2]);
    for (i = 0; i < 9; i++) d.wash.push([0.12 + r() * 0.76, 0.10 + r() * 0.80, 0.10 + r() * 0.30, 0.05 + r() * 0.10, r() * 6.28]);
    for (i = 0; i < 7; i++) d.leak.push([r(), 0.06 + r() * 0.10, 0.05 + r() * 0.08]);
    for (i = 0; i < 26; i++) d.check.push([r(), r()]);
    return d;
  }
  var DATA = buildData(1315000);

  function isPhone() {
    try {
      var s = window.screen;
      if (s && Math.min(s.width, s.height) < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function size() {
    var vw = window.innerWidth, vh = window.innerHeight;
    try {
      if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
    } catch (e) {}
    W = Math.round(vw); H = Math.round(vh);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }

  // Drag state: closed-form seam offset from recorded events.
  var dragging = false, dragStartX = 0, dragOffset = 0;
  var releaseOffset = 0, releaseTime = 0, hasRelease = false;
  function seamOffset(t) {
    if (dragging) return dragOffset;
    if (hasRelease) return releaseOffset * Math.exp(-(t - releaseTime) / 1.2);
    return 0;
  }
  function onDown(x) { dragging = true; dragStartX = x; }
  function onMove(x) { if (dragging) dragOffset = Math.max(-W * 0.18, Math.min(W * 0.18, x - dragStartX)); }
  function onUp(t) {
    if (!dragging) return;
    dragging = false; releaseOffset = dragOffset; releaseTime = t; hasRelease = true; dragOffset = 0;
  }
  canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX); });
  canvas.addEventListener('pointermove', function (e) { onMove(e.clientX); });
  canvas.addEventListener('pointerup', function (e) { onUp(pieceTime()); });
  canvas.addEventListener('pointercancel', function (e) { onUp(pieceTime()); });

  function pieceTime() {
    if (!booted) return 0;
    return (performance.now() - startTime) / 1000;
  }

  function ellipse(x, y, rx, ry) {
    ctx.beginPath(); ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function rect(x, y, w, h) { ctx.fillRect(x, y, w, h); }

  function drawLeft(t, seamX) {
    var pw = seamX, ph = H;
    ctx.fillStyle = '#111111'; rect(0, 0, pw, ph);
    // Stack area: 60% of panel, centered.
    var sw = pw * (pw < 300 ? 0.85 : 0.60), sh = Math.min(ph * 0.72, sw * 1.05);
    var sx = (pw - sw) / 2, sy = (ph - sh) / 2;
    // Wood floor (grayscale): base + grain streaks + knots.
    ctx.fillStyle = '#4A4A48'; rect(sx, sy, sw, sh);
    ctx.fillStyle = '#111111';
    var gy, r = mulberry32(1315001);
    for (gy = 0; gy < 14; gy++) {
      var yy = sy + (gy + 0.5) * sh / 14 + (r() - 0.5) * 4;
      ctx.globalAlpha = 0.25 + r() * 0.2;
      rect(sx, yy, sw, 1 + r() * 2);
    }
    ctx.globalAlpha = 0.5;
    ellipse(sx + sw * 0.3, sy + sh * 0.6, 9, 5);
    ellipse(sx + sw * 0.75, sy + sh * 0.25, 7, 4);
    ctx.globalAlpha = 1;
    // Document, rotated ~4 degrees, with drop shadow from height offset.
    ctx.save();
    ctx.translate(sx + sw / 2, sy + sh / 2); ctx.rotate(0.07);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; rect(-sw * 0.42 + 8, -sh * 0.40 + 10, sw * 0.84, sh * 0.80);
    ctx.fillStyle = '#D8D4C8'; rect(-sw * 0.42, -sh * 0.40, sw * 0.84, sh * 0.80);
    // Torn edge: jagged strip along right side.
    ctx.fillStyle = '#8A8A86';
    ctx.beginPath(); ctx.moveTo(sw * 0.42, -sh * 0.40);
    var ty, rr = mulberry32(1315002);
    for (ty = 0; ty <= 8; ty++) ctx.lineTo(sw * 0.42 - 3 - rr() * 8, -sh * 0.40 + ty * sh * 0.10);
    ctx.lineTo(sw * 0.42, sh * 0.40); ctx.closePath(); ctx.fill();
    // Fold line + ink scrawl doodles.
    ctx.strokeStyle = '#8A8A86'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-sw * 0.42, sh * 0.28); ctx.lineTo(sw * 0.42, sh * 0.22); ctx.stroke();
    ctx.strokeStyle = '#2A241C'; ctx.lineWidth = 1.5;
    var si, sr = mulberry32(1315003);
    for (si = 0; si < 4; si++) {
      var bx = -sw * 0.32 + sr() * sw * 0.5, by = -sh * 0.28 + sr() * sh * 0.4;
      ctx.beginPath(); ctx.moveTo(bx, by);
      ctx.lineTo(bx + 14 + sr() * 20, by - 4 + sr() * 8);
      ctx.lineTo(bx + 26 + sr() * 20, by + 2 + sr() * 8); ctx.stroke();
    }
    // Snapshot, rotated -7 degrees from the document, white border, soft blobs.
    ctx.rotate(-0.19);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; rect(-sw * 0.20 + 6, -sh * 0.26 + 8, sw * 0.40, sh * 0.42);
    ctx.fillStyle = '#F0EBDD'; rect(-sw * 0.20, -sh * 0.26, sw * 0.40, sh * 0.42);
    var ix = -sw * 0.20 + sw * 0.03, iy = -sh * 0.26 + sh * 0.03, iw = sw * 0.34, ih = sh * 0.36;
    ctx.fillStyle = '#4A4A48'; rect(ix, iy, iw, ih);
    ctx.fillStyle = '#8A8A86'; ellipse(ix + iw * 0.35, iy + ih * 0.4, iw * 0.22, ih * 0.20);
    ctx.fillStyle = '#D8D4C8'; ellipse(ix + iw * 0.65, iy + ih * 0.55, iw * 0.18, ih * 0.16);
    ctx.fillStyle = '#111111'; ellipse(ix + iw * 0.5, iy + ih * 0.75, iw * 0.28, ih * 0.10);
    ctx.restore();
    // Grain shimmer: seeded flecks, alpha breathing slowly with t.
    var shimmer = 0.10 + 0.05 * Math.sin(t * 0.6);
    ctx.fillStyle = '#D8D4C8';
    var gi;
    for (gi = 0; gi < DATA.grain.length; gi++) {
      var g = DATA.grain[gi];
      if (g[0] * pw > pw) continue;
      ctx.globalAlpha = shimmer * (0.5 + g[2] * 0.25);
      rect(g[0] * pw, g[1] * ph, g[2], g[2]);
    }
    ctx.globalAlpha = 1;
  }

  function drawRight(t, seamX) {
    var rx = seamX, rw = W - seamX;
    ctx.fillStyle = '#7A5A1E'; rect(rx, 0, rw, H);
    // Clip all washes, leaks, and checks to the right panel so nothing bleeds over the seam.
    ctx.save();
    ctx.beginPath(); ctx.rect(rx, 0, rw, H); ctx.clip();
    // Deep amber field patches.
    ctx.fillStyle = '#C9A227';
    var wi;
    for (wi = 0; wi < DATA.wash.length; wi++) {
      var wsh = DATA.wash[wi];
      var drift = Math.sin(t * 0.25 + wsh[4]) * rw * 0.03;
      ctx.globalAlpha = wsh[3] + 0.03 * Math.sin(t * 0.3 + wsh[4]);
      ellipse(rx + wsh[0] * rw + drift, wsh[1] * H, wsh[2] * rw, wsh[2] * H * 0.7);
    }
    // Paper cream washes.
    ctx.fillStyle = '#F2EBD4';
    ctx.globalAlpha = 0.10 + 0.03 * Math.sin(t * 0.2 + 1.3);
    ellipse(rx + rw * 0.30, H * 0.30, rw * 0.22, H * 0.18);
    ellipse(rx + rw * 0.72, H * 0.68, rw * 0.26, H * 0.20);
    ctx.globalAlpha = 1;
    // Checked / gingham interference pattern: 75 s envelope.
    var cyc = t % 75;
    var cAlpha = 0;
    if (cyc < 25) cAlpha = 0.16 * (cyc / 25);
    else if (cyc < 50) cAlpha = 0.16;
    else cAlpha = 0.16 * (1 - (cyc - 50) / 25);
    var cell = Math.max(28, rw / 14);
    ctx.fillStyle = '#F2EBD4';
    var cx, cy;
    for (cx = 0; cx < rw / cell + 1; cx++) {
      for (cy = 0; cy < H / cell + 1; cy++) {
        if ((cx + cy) % 2 === 0) { ctx.globalAlpha = cAlpha; rect(rx + cx * cell, cy * cell, cell, cell); }
      }
    }
    ctx.fillStyle = '#C9A227';
    for (cx = 0; cx < rw / cell + 1; cx++) {
      ctx.globalAlpha = cAlpha * 0.7;
      rect(rx + cx * cell, 0, 2, H);
    }
    ctx.globalAlpha = 1;
    // Light leaks at edges: flat alpha bands.
    ctx.fillStyle = '#F2EBD4';
    ctx.globalAlpha = 0.14; rect(rx, 0, rw * 0.06, H); rect(rx + rw * 0.94, 0, rw * 0.06, H);
    ctx.globalAlpha = 0.10; rect(rx, 0, rw, H * 0.05); rect(rx, H * 0.95, rw, H * 0.05);
    // Vignette: near-black flat edge bands (no gradient).
    ctx.fillStyle = '#14110B';
    ctx.globalAlpha = 0.35; rect(rx, 0, 3, H); rect(rx + rw - 3, 0, 3, H);
    ctx.globalAlpha = 0.22; rect(rx, 0, rw, 10); rect(rx, H - 10, rw, 10);
    ctx.globalAlpha = 1;
    // Paper edge: thin cream frame inset inside the panel.
    ctx.strokeStyle = '#F2EBD4'; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
    ctx.strokeRect(rx + 10, 10, rw - 20, H - 20);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#111111'; rect(0, 0, W, H);
    var seamX = W / 2 + seamOffset(t);
    seamX = Math.max(W * 0.32, Math.min(W * 0.68, seamX));
    drawLeft(t, seamX);
    drawRight(t, seamX);
    // Hairline seam stays visible.
    ctx.fillStyle = '#D8D4C8'; rect(seamX - 0.5, 0, 1, H);
  }

  function loop() {
    draw(pieceTime());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }

  function boot() {
    size();
    draw(0);
    booted = true;
    try { startTime = performance.now(); } catch (e) { startTime = 0; }
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  window.addEventListener('resize', function () { size(); draw(pieceTime()); });
  try {
    window.visualViewport.addEventListener('resize', function () { size(); draw(pieceTime()); });
  } catch (e) {}
  boot();
})();
</script>
</body>
</html>
