<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№23 · Wedge</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ecdc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(60,54,44,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(242,236,220,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another wedge</div>
<script>
'use strict';
// No23 Wedge.
// Stippling by rejection: points are thrown uniformly at the page and
// kept with a probability given by one diagonal gradient, so the dots
// thin to nothing at one corner and pack solid at the opposite one,
// a wedge of tone with no drawn edge anywhere. Kept dots also grow
// slightly as the gradient rises. A seed is gated on its kept share
// and its empty corner: the wedge must reach solid, and the empty
// corner must be truly empty, else the gradient is lying.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '23', 10) || 23;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f2ecdc';

function grad(p, u, v) {
  const g = (u * p.wu + v * p.wv) * p.steep + p.off;
  return Math.max(0, Math.min(1, g));
}

function compose(s) {
  const rnd = mulberry32(s);
  const ang = rnd() * Math.PI * 2;
  const p = {
    wu: Math.cos(ang), wv: Math.sin(ang),
    steep: 1.5 + rnd() * 0.5,
    off: -0.42 - rnd() * 0.2
  };
  // expected kept share and far-corner density, sampled
  let kept = 0, corner = 0, cornerN = 0;
  const srnd = mulberry32((s ^ 0x9e3779) >>> 0);
  for (let i = 0; i < 3000; i++) {
    const u = srnd(), v = srnd();
    const g = grad(p, u, v);
    if (srnd() < g) kept++;
    if (u < 0.14 && v < 0.14) { cornerN++; if (g > 0.02) corner++; }
  }
  p.share = kept / 3000;
  p.ok = p.share > 0.24 && p.share < 0.5 && corner === 0;
  return p;
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const drnd = mulberry32((seed ^ 0x51ed27) >>> 0);
  const THROWS = 26000;
  ctx.fillStyle = '#2e2a24';
  for (let i = 0; i < THROWS; i++) {
    const u = drnd(), v = drnd();
    const g = grad(p, u, v);
    if (drnd() >= g) continue;
    const r = Math.min(RX, RY) * (0.0016 + g * 0.0022);
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(ox + u * RX, oy + v * RY, Math.max(0.5, r), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
