<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№108 · Intangible Mass</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#08070A; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,224,208,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to aim the light</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function hash2(x,y){ let h=Math.imul(x,374761393)+Math.imul(y,668265263); h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function vnoise(x,y){ const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy; const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy); const a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1); return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy; }
function fbm(x,y,oct){ let v=0, amp=0.5, f=1, tot=0; for(let o=0;o<oct;o++){ v+=amp*vnoise(x*f,y*f); tot+=amp; amp*=0.5; f*=2.03; } return v/tot; }
function ridge(x,y,oct){ return 1-Math.abs(2*fbm(x,y,oct)-1); }
function mixc(c1,c2,t){ return [c1[0]+(c2[0]-c1[0])*t, c1[1]+(c2[1]-c1[1])*t, c1[2]+(c2[2]-c1[2])*t]; }

// No.108 Intangible Mass (after mulf). Software-shader route: ridged fbm mass
// computed per cell on a reduced-resolution field and drawn as soft cells.
// Seamless 24s loop: beam sweeps on wrapped sine time, warp breathes with it.
// Mass fills the lower three quarters; black void above. Drag aims the beam.
const ABYSS=[8,7,10], STONE=[46,42,51], LIT=[107,95,110], BEAM=[232,224,208];
const LOOP=24;
let dragU=null, beamOff=0, lastSine=0.5;

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#08070A'; ctx.fillRect(0,0,w,h);
  const t=(nowMs/1000)%LOOP, ph=t/LOOP;
  const sineU=0.5+0.38*Math.sin(ph*Math.PI*2);
  beamOff*=0.995;
  let beamU = dragU!==null ? dragU : sineU+beamOff;
  lastSine=sineU;
  const breath=Math.sin(ph*Math.PI*2)*0.05;
  const step=clamp(Math.round(Math.sqrt(w*h/52000)),3,7);
  const cols=Math.ceil(w/step), rows=Math.ceil(h/step);
  // surface height per column (normalised y of the mass top edge)
  const surf=new Float32Array(cols);
  for(let i=0;i<cols;i++){
    const u=(i+0.5)/cols;
    surf[i]=0.20+0.22*ridge(u*3.1+breath, 4.7, 3)+0.07*ridge(u*9.3, 11.2, 2);
  }
  for(let j=0;j<rows;j++){
    const v=(j+0.5)/rows;
    for(let i=0;i<cols;i++){
      const u=(i+0.5)/cols;
      const s=surf[i];
      if(v<s) continue; // void stays abyss
      const depth=(v-s)/Math.max(0.001,1-s);
      const warp=breath*1.6;
      let r=ridge(u*4.3+warp, v*3.4+depth*0.7, 3);
      r=0.55*r+0.45*ridge(u*11.0, v*9.0+warp, 2);
      r*= 0.82+0.36*ridge(u*24.0, v*1.8, 2);
      let c=mixc(STONE, LIT, clamp(Math.pow(r,1.4)*(1-depth*0.35)+0.06,0,1));
      const bd=(u-beamU)/0.145;
      const mask=Math.exp(-bd*bd)*(0.30+0.70*(1-v));
      const li=clamp(0.34+1.25*mask*(0.45+0.55*r),0,1.4);
      c=[c[0]*li, c[1]*li, c[2]*li];
      if(mask>0.45) c=mixc(c, BEAM, (mask-0.45)*0.5*clamp(r,0,1));
      const cr=clamp(c[0],3,255), cg=clamp(c[1],3,255), cb=clamp(c[2],3,255);
      ctx.fillStyle='rgb('+(cr|0)+','+(cg|0)+','+(cb|0)+')';
      ctx.fillRect(i*step-0.5, j*step-0.5, step+1, step+1);
    }
  }
  return {};
}

function ptrU(e){ const [w,h]=viewportWH(); const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{left:0}; return clamp((e.clientX-r.left)/w,0,1); }
canvas.addEventListener('pointerdown',e=>{ dragU=ptrU(e); });
canvas.addEventListener('pointermove',e=>{ if(dragU!==null) dragU=ptrU(e); });
function endP(){ if(dragU!==null){ beamOff=dragU-lastSine; dragU=null; } }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(9000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
