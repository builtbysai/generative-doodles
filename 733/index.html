<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wrong Bell</title>
<style>
  html, body { margin: 0; padding: 0; background: #101828; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// The Wrong Bell (EXPANSION #89 paul-ramirez-jonas, block 6)
// After Let Freedom Ring (2023): an arched bell tower at night holds
// seven brass bells that ring the opening phrase of "My Country,
// 'Tis of Thee" in sequence, each swinging and flashing in turn. The
// phrase never finishes itself. To the right, on its own post, stands
// a larger copper bell, out of place, banded with short inscriptions
// celebrating freedom. When the seven are done it sways and glows,
// offered. Tap it and it swings harder than any of the others and
// sounds the final note deliberately out of tune, a detuned sine with
// a slow beating partner. Hold the tap and the wrong ring comes back
// prouder. The finale never rings on its own: the viewer completes
// the anthem, flaw and all, and then the loop restarts.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  sky: '#101828',
  tower: '#05070D',
  brass: '#C9A227',
  flash: '#F0D878',
  copper: '#B87333',
  inscr: '#F5F1E6',
  ground: '#1A2233'
};

// The seven phrase notes: 1 1 2 3 3 2 3 in C, the familiar contour,
// no exact transcription claimed. Each bell carries a small seeded
// intonation offset in cents: pleasant, never concert perfect.
var FREQS = [261.63, 261.63, 293.66, 329.63, 329.63, 293.66, 329.63];
var RING_T = [1.2, 2.75, 4.3, 5.85, 7.4, 8.95, 10.5];
var OFFER_T = 13.0;
var N_BELLS = 7;

var bellSeed = mulberry32(73301);
var BELLS = [];
for (var bi = 0; bi < N_BELLS; bi++) {
  BELLS.push({
    cents: (bellSeed() * 2 - 1) * 8,
    sizeF: 0.92 + bellSeed() * 0.16 - (FREQS[bi] - 261.63) / 900
  });
}

// The big bell's expected final pitch is F3, the note the phrase
// leans toward, sized down for the larger bell. It sounds at -35
// cents with a beating partner a few cents above it.
var BIG_FREQ = 174.61;
var BIG_DETUNE_CENTS = -35;

var INSCRIPTIONS = [
  'LET FREEDOM RING',
  'LAND OF LIBERTY',
  'FROM EVERY MOUNTAINSIDE',
  'LET IT RESOUND'
];

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, isPhone = false;

// ---------------------------------------------------------------------------
// Time and state. Frame one is cycle 0 at t=0, drawn synchronously
// before any loop runs. The cycle is a closed-form function of the
// time since cycleStart plus two recorded events: the finale tap and
// the proud hold. Nothing else is integrated or accumulated.
// ---------------------------------------------------------------------------
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
var loopStarted = false;
var state = {
  cycleStart: 0,
  finaleT: -1,
  proudT: -1,
  downAbs: -1,
  downOnBell: false
};
var prevCycleT = 0;

var forcedT = -1;
(function () {
  try {
    var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(location.search || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (e) { /* inert hook, QA only */ }
})();

function nowSec() {
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
  return Math.max(0, (now - startStamp) / 1000);
}

function clamp01(v) { return Math.max(0, Math.min(1, v)); }

// Layout: the arch spans the frame with its spring line at 30% of
// height; the seven bells hang from its beam across the left two
// thirds; the big bell hangs from its own post at the right.
function layout() {
  var groundY = 0.88 * H;
  var springY = 0.30 * H;
  var beamY = springY + 0.012 * H;
  var archL = 0.035 * W, archR = 0.715 * W;
  var bellX0 = 0.13 * W, bellX1 = 0.63 * W;
  var spacing = (bellX1 - bellX0) / (N_BELLS - 1);
  var bigX = 0.855 * W;
  return {
    groundY: groundY,
    springY: springY,
    beamY: beamY,
    beamH: 0.018 * H,
    archL: archL,
    archR: archR,
    archMid: (archL + archR) / 2,
    bellX0: bellX0,
    spacing: spacing,
    pivotY: beamY + 0.018 * H,
    bigX: bigX,
    bigPivotY: 0.155 * H,
    bigU: Math.min(0.075 * W, 0.30 * H)
  };
}
function bellCenterX(L, i) { return L.bellX0 + i * L.spacing; }
function bellU(L, i) { return L.spacing * 0.40 * BELLS[i].sizeF; }

// Bell profile in local units: pivot at the origin, u is the skirt
// half width, the bell hangs downward to about 2.12u plus clapper.
function traceBell(u) {
  ctx.beginPath();
  ctx.moveTo(-0.52 * u, 1.95 * u);
  ctx.bezierCurveTo(-0.55 * u, 1.45 * u, -0.40 * u, 1.05 * u, -0.38 * u, 0.62 * u);
  ctx.bezierCurveTo(-0.36 * u, 0.30 * u, -0.20 * u, 0.14 * u, 0, 0.14 * u);
  ctx.bezierCurveTo(0.20 * u, 0.14 * u, 0.36 * u, 0.30 * u, 0.38 * u, 0.62 * u);
  ctx.bezierCurveTo(0.40 * u, 1.05 * u, 0.55 * u, 1.45 * u, 0.52 * u, 1.95 * u);
  ctx.quadraticCurveTo(0, 2.12 * u, -0.52 * u, 1.95 * u);
  ctx.closePath();
}

function drawBellShape(cx, pivotY, u, angle, color) {
  ctx.save();
  ctx.translate(cx, pivotY);
  ctx.rotate(angle);
  // Headstock block the bell hangs from.
  ctx.fillStyle = COL.tower;
  ctx.fillRect(-0.55 * u, -0.16 * u, 1.10 * u, 0.18 * u);
  ctx.fillStyle = color;
  traceBell(u);
  ctx.fill();
  // Clapper, swinging with the bell, in tower black.
  ctx.fillStyle = COL.tower;
  ctx.beginPath();
  ctx.arc(0, 2.06 * u, 0.10 * u, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function glow(cx, cy, r, alpha) {
  if (alpha <= 0.004) return;
  var steps = [1.0, 0.72, 0.48];
  var alphas = [0.05, 0.08, 0.12];
  ctx.fillStyle = COL.flash;
  for (var i = 0; i < steps.length; i++) {
    ctx.globalAlpha = alphas[i] * alpha;
    ctx.beginPath();
    ctx.arc(cx, cy, r * steps[i], 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Swing of phrase bell i at cycle time t: still until its ring time,
// then a decaying pendulum. Closed form.
function bellAngle(i, t) {
  var dt = t - RING_T[i];
  if (dt < 0) return 0;
  return 0.30 * Math.exp(-dt / 3.0) * Math.sin(2 * Math.PI * 0.85 * dt);
}
function bellFlash(i, t) {
  var dt = t - RING_T[i];
  if (dt < 0) return 0;
  return Math.exp(-dt / 0.9);
}

// Big bell angle across its three states: still before the offer,
// a gentle inviting sway while offered, and the hard finale swing
// (plus the proud second swing) once tapped.
function bigAngle(cycleT, absT, offering) {
  if (state.finaleT >= 0) {
    var dt = absT - state.finaleT;
    var a = 0.48 * Math.exp(-dt / 3.4) * Math.sin(2 * Math.PI * 0.75 * dt);
    if (state.proudT >= 0) {
      var dp = absT - state.proudT;
      if (dp >= 0) a += 0.30 * Math.exp(-dp / 3.4) * Math.sin(2 * Math.PI * 0.75 * dp);
    }
    return a;
  }
  if (offering) return 0.05 * Math.sin(2 * Math.PI * cycleT / 2.6 + 1.0);
  return 0;
}
function bigFlash(absT) {
  if (state.finaleT < 0) return 0;
  var f = Math.exp(-(absT - state.finaleT) / 1.1);
  if (state.proudT >= 0) f = Math.max(f, Math.exp(-(absT - state.proudT) / 1.1));
  return f;
}

function drawTower(L) {
  ctx.fillStyle = COL.tower;
  // Pillars.
  var pw = 0.045 * W;
  ctx.fillRect(L.archL - pw / 2, L.springY, pw, L.groundY - L.springY);
  ctx.fillRect(L.archR - pw / 2, L.springY, pw, L.groundY - L.springY);
  // Arch band: a thick stroked quadratic over the spring line.
  ctx.strokeStyle = COL.tower;
  ctx.lineWidth = 0.045 * H;
  ctx.beginPath();
  ctx.moveTo(L.archL, L.springY);
  ctx.quadraticCurveTo(L.archMid, -0.10 * H, L.archR, L.springY);
  ctx.stroke();
  // Beam the seven bells hang from.
  ctx.fillRect(L.archL - pw / 2, L.beamY, (L.archR - L.archL) + pw, L.beamH);
  // The big bell's own post: a separate upright and arm at the right.
  var postW = 0.020 * W;
  ctx.fillRect(L.bigX - postW / 2, 0.105 * H, postW, L.groundY - 0.105 * H);
  ctx.fillRect(L.bigX - 0.085 * W, 0.085 * H, 0.17 * W, 0.022 * H);
  ctx.fillRect(L.bigX - postW / 2, 0.105 * H, postW, L.bigPivotY - 0.105 * H);
}

function drawBigBell(L, cycleT, absT, offering) {
  var u = L.bigU;
  var ang = bigAngle(cycleT, absT, offering);
  var cx = L.bigX, py = L.bigPivotY;
  // Offer glow: a soft pulse behind the bell while it waits.
  if (offering && state.finaleT < 0) {
    var pulse = 0.55 + 0.45 * Math.sin(2 * Math.PI * cycleT / 1.8);
    glow(cx, py + 1.05 * u, 2.6 * u, pulse);
  }
  var fl = bigFlash(absT);
  if (fl > 0.01) glow(cx, py + 1.05 * u, 2.8 * u, fl);
  ctx.save();
  ctx.translate(cx, py);
  ctx.rotate(ang);
  ctx.fillStyle = COL.tower;
  ctx.fillRect(-0.55 * u, -0.16 * u, 1.10 * u, 0.18 * u);
  ctx.fillStyle = fl > 0.5 ? COL.flash : COL.copper;
  traceBell(u);
  ctx.fill();
  // Inscription bands: four short phrases across the bell body,
  // lettered in the inscription tone, shrunk to fit the local width.
  ctx.fillStyle = COL.inscr;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var lineY = [0.72, 1.02, 1.32, 1.62];
  for (var i = 0; i < INSCRIPTIONS.length; i++) {
    var fs = 0.155 * u;
    ctx.font = '600 ' + fs + 'px system-ui, sans-serif';
    var maxW = 2 * u * (0.52 + 0.30 * (lineY[i] / 1.95)) * 0.92;
    var tw = ctx.measureText(INSCRIPTIONS[i]).width;
    if (tw > maxW) {
      fs = fs * maxW / tw;
      ctx.font = '600 ' + fs + 'px system-ui, sans-serif';
    }
    ctx.fillText(INSCRIPTIONS[i], 0, lineY[i] * u);
  }
  ctx.fillStyle = COL.tower;
  ctx.beginPath();
  ctx.arc(0, 2.06 * u, 0.10 * u, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function draw(absT) {
  var L = layout();
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  // Finale housekeeping: once the wrong ring has decayed, the next
  // cycle starts from this instant.
  if (state.finaleT >= 0 && absT - state.finaleT > 5.5) {
    state.cycleStart = absT;
    state.finaleT = -1;
    state.proudT = -1;
    prevCycleT = 0;
  }
  var cycleT = absT - state.cycleStart;
  var offering = state.finaleT < 0 && cycleT >= OFFER_T;

  // Sky and ground.
  ctx.fillStyle = COL.sky;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, L.groundY, W, H - L.groundY);

  drawTower(L);

  // The seven phrase bells: glow behind the one sounding, then the
  // bell itself, brass unless the flash is at full strength.
  for (var i = 0; i < N_BELLS; i++) {
    var cx = bellCenterX(L, i);
    var u = bellU(L, i);
    var fl = bellFlash(i, cycleT);
    if (fl > 0.01 && state.finaleT < 0) glow(cx, L.pivotY + 1.05 * u, 2.5 * u, fl);
    drawBellShape(cx, L.pivotY, u, state.finaleT < 0 ? bellAngle(i, cycleT) : bellAngle(i, Math.min(cycleT, OFFER_T + 3)), fl > 0.5 ? COL.flash : COL.brass);
  }

  drawBigBell(L, cycleT, absT, offering);
}

// ---------------------------------------------------------------------------
// Audio. The AudioContext is created lazily inside the visitor's
// first gesture and nowhere else. Until a gesture unlocks it, the
// seven bells ring as silent flashes; after the unlock, later cycles
// sound. The big bell's own tap is a gesture, so the wrong note
// always sounds. Everything is guarded: no AudioContext, no sound,
// and the piece runs visually regardless.
// ---------------------------------------------------------------------------
var AC = null;
var audioUnlocked = false;

function ensureAudio() {
  try {
    if (typeof window === 'undefined') return null;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    if (!AC) AC = new Ctor();
    if (AC.state === 'suspended' && AC.resume) AC.resume();
    audioUnlocked = true;
    return AC;
  } catch (e) {
    return null;
  }
}

function tone(freq, t0, dur, gain, type) {
  var o = AC.createOscillator();
  var g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(AC.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.05);
}

function playBell(i) {
  if (!audioUnlocked || !AC) return;
  try {
    var f = FREQS[i] * Math.pow(2, BELLS[i].cents / 1200);
    var t0 = AC.currentTime + 0.01;
    tone(f, t0, 2.6, 0.16);
    tone(f * 2.02, t0, 1.7, 0.055);
    tone(f * 2.74, t0, 1.1, 0.035);
    tone(f * 5.40, t0, 0.5, 0.012);
  } catch (e) { /* sound is garnish; the swing is the piece */ }
}

function playWrong(proud) {
  var ac = ensureAudio();
  if (!ac) return;
  try {
    var base = BIG_FREQ * Math.pow(2, BIG_DETUNE_CENTS / 1200);
    var beat = base * Math.pow(2, 9 / 1200);
    var t0 = ac.currentTime + 0.01;
    var dur = proud ? 7.0 : 5.0;
    var g0 = proud ? 0.30 : 0.22;
    tone(base, t0, dur, g0);
    tone(beat, t0, dur, g0 * 0.8);
    tone(base * 2.0, t0, dur * 0.6, g0 * 0.30);
    tone(base * 2.74, t0, dur * 0.4, g0 * 0.18);
  } catch (e) { /* guarded */ }
}

// Ring scheduling for the seven: when the loop crosses a ring time
// and audio is unlocked, strike that bell.
function pumpAudio(cycleT) {
  if (state.finaleT >= 0) { prevCycleT = cycleT; return; }
  for (var i = 0; i < N_BELLS; i++) {
    if (prevCycleT < RING_T[i] && cycleT >= RING_T[i]) playBell(i);
  }
  prevCycleT = cycleT;
}

function bigBellHit(x, y) {
  var L = layout();
  var u = L.bigU;
  var cx = L.bigX, cy = L.bigPivotY + 1.05 * u;
  var dx = (x - cx) / (1.25 * u), dy = (y - cy) / (1.45 * u);
  return dx * dx + dy * dy <= 1;
}

function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = Math.round(vw);
  H = Math.round(vh);
  canvas.width = W;
  canvas.height = H;
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  if (forcedT >= 0) {
    draw(forcedT);
  } else if (loopStarted) {
    draw(nowSec());
  } else {
    draw(0);
  }
}

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    if (forcedT >= 0) return;
    ensureAudio();
    var absT = nowSec();
    var x = e.clientX, y = e.clientY;
    if (typeof x !== 'number' || typeof y !== 'number') return;
    state.downAbs = absT;
    state.downOnBell = bigBellHit(x, y);
    var cycleT = absT - state.cycleStart;
    if (state.downOnBell && state.finaleT < 0 && cycleT >= OFFER_T) {
      state.finaleT = absT;
      state.proudT = -1;
      playWrong(false);
    }
    draw(absT);
  });
  canvas.addEventListener('pointerup', function () { state.downOnBell = false; });
  canvas.addEventListener('pointercancel', function () { state.downOnBell = false; });
}

resize();

if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
  loopStarted = true;
  var loop = function () {
    var absT = nowSec();
    // Proud hold: still holding the big bell 0.45 s into the finale
    // brings the wrong ring back, louder and longer.
    if (state.downOnBell && state.finaleT >= 0 && state.proudT < 0 &&
        absT - state.downAbs >= 0.45) {
      state.proudT = absT;
      playWrong(true);
    }
    pumpAudio(absT - state.cycleStart);
    draw(absT);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
