<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.383 Palm Springs Fever</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4A259; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.383 Palm Springs Fever (jenkbdoodles).
// After Jen K's Palm Springs fever dream: her MCM happy
// accident made into a composition rule. A clean streamlined
// desert base, flat banded sunset sky, a low sun, a distant
// mountain ridge, two dune bands and one palm silhouette,
// with TWO translucent textured motif strata drifting over
// the whole scene at increasing scale. The mid stratum is
// small teal cacti and stars at 0.5 alpha; the top stratum
// is large purple paisleys and sunburst fragments at 0.3
// alpha. The strata never go opaque and never sit still.
// The prompt's 2x-wide stratum canvases are tileable motif
// DATA here: each stratum is one authored tile of motifs in
// design coords, drawn at wrapped offsets on the single
// canvas. The mid tile is 640 wide and makes one full pass
// per 24s; the top tile is 1280 wide and makes one pass per
// 48s; both periods divide the 48s master loop (LOOP)
// exactly, so the wrap is seamless and frame 48s is
// pixel-identical to frame 0. The sun pulses on 2 whole
// cycles per loop, radius +-2 percent, almost imperceptible.
// WATCH-ONLY: no pointer handlers at all.
// Sky is FLAT BANDS, five authored steps from #F4A259 to
// #E86A6A, never a gradient. Flat colour only, one canvas.
// Determinism: the first frame is drawn synchronously at
// the constant phase T = 13.7 (strata mid-drift, sun
// mid-pulse), never Date.now() minus an offset, and the
// animation advances from that anchor in fixed 1/60 ticks.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 48;
var TAU = Math.PI * 2;
var PAGE = '#F4A259';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 13.7, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- palette ----------------------------------------------------------
// Sky bands: five flat steps interpolated between the two
// specced endpoints, authored as literals.
var SKY = ['#F4A259', '#F1945D', '#EE8662', '#EB7866', '#E86A6A'];
var DUNE_DARK = '#7A4E2E';
var DUNE_LIGHT = '#A9713F';
var SUN = '#FFD166';
var PALM = '#1E1E1E';
var MID = '#5BA3C4';
var TOP = '#B565A7';
var MID_ALPHA = 0.5, TOP_ALPHA = 0.3;

// ---- seeded rng ---------------------------------------------------------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(0x383F);

// ---- strata motif data ---------------------------------------------------
// Mid tile: 640 wide, small cacti and stars scattered over the
// full height (the stratum is full-bleed above the base).
var MID_TILE = 640;
var MID_MOTIFS = [];
(function () {
  var i, x, y;
  for (i = 0; i < 8; i++) {
    x = 20 + rng() * (MID_TILE - 40);
    y = 50 + rng() * (DH - 100);
    MID_MOTIFS.push({ kind: 'cactus', x: x, y: y, s: 30 + rng() * 26, flip: rng() < 0.5 ? -1 : 1 });
  }
  for (i = 0; i < 11; i++) {
    x = 14 + rng() * (MID_TILE - 28);
    y = 30 + rng() * (DH - 60);
    MID_MOTIFS.push({ kind: 'star', x: x, y: y, s: 9 + rng() * 9 });
  }
})();

// Top tile: 1280 wide, large paisleys and sunburst fragments.
var TOP_TILE = 1280;
var TOP_MOTIFS = [];
(function () {
  var i, x, y;
  for (i = 0; i < 4; i++) {
    x = 130 + rng() * (TOP_TILE - 260);
    y = 150 + rng() * (DH - 300);
    TOP_MOTIFS.push({ kind: 'paisley', x: x, y: y, s: 105 + rng() * 70, rot: (rng() - 0.5) * 1.1 });
  }
  for (i = 0; i < 3; i++) {
    x = 110 + rng() * (TOP_TILE - 220);
    y = 120 + rng() * (DH - 240);
    TOP_MOTIFS.push({ kind: 'sun', x: x, y: y, s: 85 + rng() * 55, rot: rng() * TAU });
  }
})();

if (MID_MOTIFS.length !== 19) throw new Error('Palm Springs Fever needs exactly 19 mid motifs per tile');
if (TOP_MOTIFS.length !== 7) throw new Error('Palm Springs Fever needs exactly 7 top motifs per tile');

// ---- motif painters ----------------------------------------------------------

function sparkle4(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x + r * 0.16, y - r * 0.16, x + r, y);
  ctx.quadraticCurveTo(x + r * 0.16, y + r * 0.16, x, y + r);
  ctx.quadraticCurveTo(x - r * 0.16, y + r * 0.16, x - r, y);
  ctx.quadraticCurveTo(x - r * 0.16, y - r * 0.16, x, y - r);
  ctx.closePath();
  ctx.fill();
}

// Saguaro: rounded-top trunk with one or two round-capped arms,
// drawn as thick strokes so the silhouette stays print-flat.
function cactus(m) {
  var s = m.s;
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.scale(m.flip, 1);
  ctx.strokeStyle = MID;
  ctx.lineCap = 'round';
  ctx.lineWidth = s * 0.30;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.55);
  ctx.lineTo(0, -s * 0.55);
  ctx.stroke();
  ctx.lineWidth = s * 0.22;
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.05);
  ctx.lineTo(s * 0.42, -s * 0.05);
  ctx.lineTo(s * 0.42, -s * 0.42);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, s * 0.18);
  ctx.lineTo(-s * 0.36, s * 0.18);
  ctx.lineTo(-s * 0.36, -s * 0.14);
  ctx.stroke();
  ctx.restore();
}

// Paisley (boteh): a filled teardrop whose tip curls over,
// with an inner outline teardrop and a dot for texture.
function paisley(m) {
  var s = m.s;
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.rot);
  ctx.fillStyle = TOP;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.95);
  ctx.bezierCurveTo(-s * 0.98, s * 0.35, -s * 0.82, -s * 0.62, -s * 0.10, -s * 0.88);
  ctx.bezierCurveTo(s * 0.38, -s * 1.02, s * 0.62, -s * 0.66, s * 0.40, -s * 0.38);
  ctx.bezierCurveTo(s * 0.24, -s * 0.20, s * 0.02, -s * 0.30, s * 0.06, -s * 0.48);
  ctx.bezierCurveTo(s * 0.08, -s * 0.60, s * 0.30, -s * 0.58, s * 0.30, -s * 0.42);
  ctx.bezierCurveTo(s * 0.30, -s * 0.16, s * 0.62, s * 0.30, 0, s * 0.95);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = TOP;
  ctx.lineWidth = s * 0.055;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.62);
  ctx.bezierCurveTo(-s * 0.55, s * 0.18, -s * 0.48, -s * 0.38, -s * 0.06, -s * 0.55);
  ctx.bezierCurveTo(s * 0.30, -s * 0.66, s * 0.42, -s * 0.30, s * 0.30, -s * 0.02);
  ctx.bezierCurveTo(s * 0.20, s * 0.20, s * 0.34, s * 0.30, 0, s * 0.62);
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(-s * 0.02, s * 0.05, s * 0.075, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// Sunburst fragment: a hub disc with alternating triangular
// rays fanning over about 220 degrees.
function sunburst(m) {
  var s = m.s, i, a, r;
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.rot);
  ctx.fillStyle = TOP;
  for (i = 0; i < 11; i++) {
    a = (i / 10 - 0.5) * (Math.PI * 1.22);
    r = s * (i % 2 === 0 ? 1.0 : 0.68);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.085) * s * 0.24, Math.sin(a - 0.085) * s * 0.24);
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a + 0.085) * s * 0.24, Math.sin(a + 0.085) * s * 0.24);
    ctx.closePath();
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.30, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// ---- the base -----------------------------------------------------------------

// A tapered frond: a quadratic spine sampled into a filled
// leaf shape whose width shrinks to the tip.
function frond(x, y, ang, len, wid, droop) {
  var ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len + droop;
  var cx = x + Math.cos(ang) * len * 0.5, cy = y + Math.sin(ang) * len * 0.5 + droop * 0.25;
  var N = 12, i, s, px, py, qx, qy, nx, ny, left = [], right = [];
  for (i = 0; i <= N; i++) {
    s = i / N;
    qx = (1 - s) * (1 - s) * x + 2 * (1 - s) * s * cx + s * s * ex;
    qy = (1 - s) * (1 - s) * y + 2 * (1 - s) * s * cy + s * s * ey;
    px = 2 * (1 - s) * (cx - x) + 2 * s * (ex - cx);
    py = 2 * (1 - s) * (cy - y) + 2 * s * (ey - cy);
    var L = Math.hypot(px, py) || 1;
    nx = -py / L; ny = px / L;
    var hw = wid * Math.pow(1 - s, 1.3) + 0.5;
    left.push([qx + nx * hw, qy + ny * hw]);
    right.push([qx - nx * hw, qy - ny * hw]);
  }
  ctx.beginPath();
  ctx.moveTo(left[0][0], left[0][1]);
  for (i = 1; i <= N; i++) ctx.lineTo(left[i][0], left[i][1]);
  for (i = N; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
  ctx.closePath();
  ctx.fill();
}

function drawPalm() {
  var bx = 905, by = 632;          // base, sunk in the front dune
  var tx = 838, ty = 392;          // crown
  var cx = 892, cy = 505;          // trunk curve control
  ctx.fillStyle = PALM;
  // tapered trunk along a quadratic spine
  var N = 14, i, s, qx, qy, px, py, nx, ny, left = [], right = [];
  for (i = 0; i <= N; i++) {
    s = i / N;
    qx = (1 - s) * (1 - s) * bx + 2 * (1 - s) * s * cx + s * s * tx;
    qy = (1 - s) * (1 - s) * by + 2 * (1 - s) * s * cy + s * s * ty;
    px = 2 * (1 - s) * (cx - bx) + 2 * s * (tx - cx);
    py = 2 * (1 - s) * (cy - by) + 2 * s * (ty - cy);
    var L = Math.hypot(px, py) || 1;
    nx = -py / L; ny = px / L;
    var hw = 13 * (1 - s) + 4.5;
    left.push([qx + nx * hw, qy + ny * hw]);
    right.push([qx - nx * hw, qy - ny * hw]);
  }
  ctx.beginPath();
  ctx.moveTo(left[0][0], left[0][1]);
  for (i = 1; i <= N; i++) ctx.lineTo(left[i][0], left[i][1]);
  for (i = N; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
  ctx.closePath();
  ctx.fill();
  // fronds radiating from the crown
  var angs = [-2.95, -2.55, -2.15, -1.80, -1.45, -1.10, -0.72, -0.35];
  for (i = 0; i < angs.length; i++) {
    var a = angs[i];
    var len = 118 + 34 * Math.sin((i / (angs.length - 1)) * Math.PI);
    frond(tx, ty, a, len, 12, 46 + 30 * Math.abs(Math.sin(a)));
  }
  // two coconuts at the crown
  ctx.beginPath();
  ctx.arc(tx - 9, ty + 10, 10, 0, TAU);
  ctx.arc(tx + 10, ty + 13, 8.5, 0, TAU);
  ctx.fill();
}

function drawBase(t) {
  var i;
  // sky: five flat bands, 0..400, with the lowest band carried
  // down as a horizon undercoat so no gap can open between the
  // ridge and the dunes
  for (i = 0; i < 5; i++) {
    ctx.fillStyle = SKY[i];
    ctx.fillRect(0, i * 80, DW, 80);
  }
  ctx.fillStyle = SKY[4];
  ctx.fillRect(0, 400, DW, DH - 400);
  // low sun, pulsing on 2 whole cycles per loop
  var pulse = 1 + 0.02 * Math.sin(TAU * 2 * (t / LOOP));
  ctx.fillStyle = SUN;
  ctx.beginPath();
  ctx.arc(428, 352, 96 * pulse, 0, TAU);
  ctx.fill();
  // distant mountain ridge in the dark dune tone
  ctx.fillStyle = DUNE_DARK;
  ctx.beginPath();
  ctx.moveTo(0, 402);
  ctx.lineTo(120, 342);
  ctx.lineTo(238, 388);
  ctx.lineTo(356, 322);
  ctx.lineTo(470, 382);
  ctx.lineTo(592, 336);
  ctx.lineTo(724, 394);
  ctx.lineTo(852, 330);
  ctx.lineTo(978, 386);
  ctx.lineTo(1104, 344);
  ctx.lineTo(1212, 390);
  ctx.lineTo(1280, 366);
  ctx.lineTo(1280, 430);
  ctx.lineTo(0, 430);
  ctx.closePath();
  ctx.fill();
  // back dune, light
  ctx.fillStyle = DUNE_LIGHT;
  ctx.beginPath();
  ctx.moveTo(0, 486);
  ctx.bezierCurveTo(300, 428, 560, 512, 840, 472);
  ctx.bezierCurveTo(1040, 446, 1180, 492, 1280, 470);
  ctx.lineTo(1280, DH);
  ctx.lineTo(0, DH);
  ctx.closePath();
  ctx.fill();
  // front dune, dark
  ctx.fillStyle = DUNE_DARK;
  ctx.beginPath();
  ctx.moveTo(0, 648);
  ctx.bezierCurveTo(300, 590, 540, 664, 810, 628);
  ctx.bezierCurveTo(1030, 600, 1160, 652, 1280, 622);
  ctx.lineTo(1280, DH);
  ctx.lineTo(0, DH);
  ctx.closePath();
  ctx.fill();
  drawPalm();
}

// ---- draw ------------------------------------------------------------------------

function draw(t) {
  var i, k, off, m;
  drawBase(t);
  // mid stratum: teal at 0.5, tile 640, one pass per 24s
  off = -(((t % 24) / 24) * MID_TILE);
  ctx.globalAlpha = MID_ALPHA;
  ctx.fillStyle = MID;
  for (k = 0; k < 3; k++) {
    for (i = 0; i < MID_MOTIFS.length; i++) {
      m = MID_MOTIFS[i];
      if (m.kind === 'cactus') {
        ctx.save();
        ctx.translate(off + k * MID_TILE, 0);
        cactus(m);
        ctx.restore();
      } else {
        sparkle4(off + k * MID_TILE + m.x, m.y, m.s);
      }
    }
  }
  // top stratum: purple at 0.3, tile 1280, one pass per 48s
  off = -(((t % LOOP) / LOOP) * TOP_TILE);
  ctx.globalAlpha = TOP_ALPHA;
  ctx.fillStyle = TOP;
  for (k = 0; k < 2; k++) {
    for (i = 0; i < TOP_MOTIFS.length; i++) {
      m = TOP_MOTIFS[i];
      ctx.save();
      ctx.translate(off + k * TOP_TILE, 0);
      if (m.kind === 'paisley') paisley(m); else sunburst(m);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

// ---- sizing ------------------------------------------------------------------------

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame ---------------------------------------------------------------------------

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Cover-fit: the scene fills every screen, cropped, never boxed.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAGE;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
})();
</script>
</body>
</html>
