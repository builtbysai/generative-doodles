<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alone Beside the River</title>
<style>
html, body { margin: 0; padding: 0; background: #8FA0B0; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PHASE = 2.0;
var SEED = 1612007;
/* palette: nothing else */
var SKY = [143, 160, 176];
var GLASS = [242, 245, 247];
var WATER = [168, 184, 196];
var INK = [44, 52, 64];
/* reflection glass: glass pulled toward the water, lower contrast */
var REFL = [196, 209, 218];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}

/* ---- the subject: five glass-white pagodas on the horizon ----
   Fixed authored table: relative centre, width and height fractions.
   The row spans 36% of frame width, centred, base on the horizon. */
var PAGODAS = [
  { x: -0.155, w: 0.058, h: 0.085 },
  { x: -0.082, w: 0.075, h: 0.115 },
  { x: 0.0,    w: 0.068, h: 0.135 },
  { x: 0.082,  w: 0.072, h: 0.105 },
  { x: 0.152,  w: 0.055, h: 0.075 }
];
/* grain: fixed seeded stipple, drifts like dust as a closed form of t */
var GRAIN = (function () {
  var rng = mulberry32(SEED);
  var dots = [], i, n = 1400;
  for (i = 0; i < n; i++) {
    dots.push({
      x: rng(), y: rng(),
      ph: rng() * TAU,
      ph2: rng() * TAU,
      s: 0.7 + rng() * 0.8
    });
  }
  return dots;
})();

/* one pagoda: stacked tiers, each a body rect under an upturned-eave
   roof trapezoid, plus a spire. flip mirrors it below the horizon for
   the reflection, with a per-tier sine ripple offset. */
function drawPagoda(p, baseY, t, flip, col, edgeA, fillA) {
  var cx = VW / 2 + p.x * VW;
  var w = p.w * VW, h = p.h * Math.min(VW * 1.4, VH);
  var spireH = 0.18 * h;
  var tierH = (h - spireH) / 3;
  var bodyW = [0.56, 0.46, 0.35], roofW = [0.84, 0.70, 0.54];
  var i, yTop, yBot, bw, rw, rh, yMid, off;
  function mapY(y) {
    if (!flip) return y;
    return baseY + (baseY - y) * 0.92;
  }
  function ripple(y) {
    if (!flip) return 0;
    return 3 * Math.sin(TAU * y / 26 + TAU * t / 36 + p.x * 9);
  }
  ctx.fillStyle = rgba(col, fillA);
  ctx.strokeStyle = rgba(INK, edgeA);
  ctx.lineWidth = Math.max(0.6, VW * 0.0008);
  for (i = 0; i < 3; i++) {
    yBot = baseY - i * tierH;
    yTop = baseY - (i + 1) * tierH;
    bw = bodyW[i] * w; rw = roofW[i] * w; rh = 0.46 * tierH;
    yMid = (yTop + yBot) / 2;
    off = ripple(yMid);
    /* body */
    ctx.beginPath();
    ctx.moveTo(cx - bw / 2 + off, mapY(yBot));
    ctx.lineTo(cx + bw / 2 + off, mapY(yBot));
    ctx.lineTo(cx + bw / 2 + off, mapY(yTop + rh));
    ctx.lineTo(cx - bw / 2 + off, mapY(yTop + rh));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    /* roof: trapezoid with eave tips kicked up */
    var rTop = yTop, rBot = yTop + rh;
    var o2 = ripple((rTop + rBot) / 2);
    ctx.beginPath();
    ctx.moveTo(cx - rw / 2 + o2, mapY(rBot) + (flip ? -rh * 0.28 : rh * 0.28));
    ctx.lineTo(cx - bw * 0.32 + o2, mapY(rTop));
    ctx.lineTo(cx + bw * 0.32 + o2, mapY(rTop));
    ctx.lineTo(cx + rw / 2 + o2, mapY(rBot) + (flip ? -rh * 0.28 : rh * 0.28));
    ctx.lineTo(cx + bw * 0.30 + o2, mapY(rBot));
    ctx.lineTo(cx - bw * 0.30 + o2, mapY(rBot));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  /* spire: thin triangle and finial dot */
  var sBot = baseY - h, sTop = baseY - h + spireH;
  var o3 = ripple((sBot + sTop) / 2);
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.035 + o3, mapY(sBot));
  ctx.lineTo(cx + w * 0.035 + o3, mapY(sBot));
  ctx.lineTo(cx + o3, mapY(sTop));
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + o3, mapY(sTop) - (flip ? -1 : 1) * Math.max(1, VW * 0.0016), Math.max(1, VW * 0.0016), 0, TAU);
  ctx.fill();
}

function label(text, cx, y, font, px, color, baseline) {
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = baseline;
  ctx.fillStyle = color;
  ctx.fillText(text, cx, y);
}

function draw(t) {
  lastT = t;
  size();
  var horizon = 0.65 * VH;
  var baseY = 0.68 * VH;
  var i, y;
  /* sky: flat field, very subtle vertical luminance variation as
     flat-alpha bands only, never a canvas gradient */
  ctx.fillStyle = rgb(SKY);
  ctx.fillRect(0, 0, VW, horizon);
  for (i = 0; i < 12; i++) {
    var bandY = (i / 12) * horizon, bandH = horizon / 12;
    var a = 0.012 + 0.009 * Math.sin(i * 1.3 + 0.6);
    ctx.fillStyle = a > 0 ? rgba([255, 255, 255], a) : rgba(INK, -a);
    ctx.fillRect(0, bandY, VW, bandH);
  }
  /* water: flat field with the same faint banding, slightly stronger */
  ctx.fillStyle = rgb(WATER);
  ctx.fillRect(0, horizon, VW, VH - horizon);
  for (i = 0; i < 8; i++) {
    var wBandY = horizon + (i / 8) * (VH - horizon);
    var wBandH = (VH - horizon) / 8;
    var wa = 0.011 + 0.008 * Math.sin(i * 1.7 + 2.1);
    ctx.fillStyle = wa > 0 ? rgba([255, 255, 255], wa) : rgba(INK, -wa);
    ctx.fillRect(0, wBandY, VW, wBandH);
  }
  /* horizon line, faint ink */
  ctx.fillStyle = rgba(INK, 0.35);
  ctx.fillRect(0, horizon - 0.5, VW, 1);
  /* stippled treeline: a low row of tiny glass triangles behind the
     pagodas, the second half of the prompt's "pagoda forms or treeline" */
  var treeY = baseY;
  ctx.fillStyle = rgba(GLASS, 0.55);
  var rngT = mulberry32(SEED + 41);
  var tx = 0.31;
  while (tx < 0.69) {
    var tw = (0.004 + rngT() * 0.006) * VW;
    var th = (0.006 + rngT() * 0.010) * VH;
    var txx = tx * VW;
    ctx.beginPath();
    ctx.moveTo(txx - tw / 2, treeY);
    ctx.lineTo(txx, treeY - th);
    ctx.lineTo(txx + tw / 2, treeY);
    ctx.closePath();
    ctx.fill();
    tx += 0.006 + rngT() * 0.008;
  }
  /* the subject, glass-white with faint etched edges */
  for (i = 0; i < PAGODAS.length; i++) {
    drawPagoda(PAGODAS[i], baseY, t, false, GLASS, 0.28, 1.0);
  }
  /* the reflection: mirrored, ripple-displaced, reduced contrast */
  for (i = 0; i < PAGODAS.length; i++) {
    drawPagoda(PAGODAS[i], baseY, t, true, REFL, 0.16, 0.62);
  }
  /* water shimmer: a few faint horizontal lines drifting almost
     imperceptibly, closed form of t */
  for (i = 0; i < 12; i++) {
    y = horizon + 0.04 * VH + (i / 12) * (VH - horizon - 0.06 * VH);
    var sa = 0.028 + 0.018 * Math.sin(TAU * t / 47 + i * 1.9);
    ctx.fillStyle = rgba([255, 255, 255], Math.max(0.004, sa));
    ctx.fillRect(0.30 * VW, y, 0.40 * VW, 1);
  }
  /* grain: animated stipple at ~3% opacity, drifting like dust */
  ctx.fillStyle = rgba(INK, 0.03);
  var gx, gy, gd;
  for (i = 0; i < GRAIN.length; i++) {
    gd = GRAIN[i];
    gx = (gd.x * VW + 2.2 * Math.sin(TAU * t / 53 + gd.ph)) % VW;
    gy = (gd.y * VH + 1.6 * Math.cos(TAU * t / 71 + gd.ph2)) % VH;
    if (gx < 0) gx += VW;
    if (gy < 0) gy += VH;
    ctx.fillRect(gx, gy, gd.s, gd.s);
  }
  /* labels: ink on the flat fields, no plates needed */
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  label('Alone Beside the River', VW / 2, Math.max(8, 0.03 * VH),
    'bold ' + titlePx + 'px monospace', titlePx, rgba(INK, 0.85), 'top');
  label('2006 · 06 · 11', VW / 2, Math.max(8, 0.03 * VH) + titlePx + 6,
    smallPx + 'px monospace', smallPx, rgba(INK, 0.65), 'top');
  label('Watch only.', VW / 2, VH - 12,
    smallPx + 'px monospace', smallPx, rgba(INK, 0.7), 'bottom');
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
