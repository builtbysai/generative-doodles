<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.429 Vintage Hobby Room</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F6EDE3; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.429 Vintage Hobby Room (yaelhofri, EXPANSION #46).
// After Yael Hofri's puzzle-grammar showcase: a woman
// lying diagonal across a magenta fringe rug reading a
// book, a cream cat playing with orange yarn, a mint
// portable record player spinning a black vinyl,
// houseplants in the corners, a blue mug steaming near
// the book, decorative pillows. Exactly TEN discoverable
// micro-details are asserted below: the spinning vinyl
// label, the yarn ball, the cat's batting paw, the mug
// steam, the book's two pages, the blue hair clip, the
// rug fringe, the pillow patterns, the plant leaf
// overlaps and the player's carry handle. Ambient 30s
// loop: the vinyl turns at its base spin (33 1/3 rpm),
// the cat bats the yarn ball at fixed 6s slots (5 per
// loop), the yarn trail runs a triangle wave over the
// loop (unwinds 15s, rewinds 15s, the prompt's one-way
// unwind made loopable), the mug steam rises on whole
// cycles. DRAG anywhere spins the vinyl faster: the
// added velocity follows the pointer and decays until
// the spin is exactly the base rate again. DOUBLE-TAP
// advances a table of exactly THREE AUTHORED layouts
// (cat, yarn ball, mug and plant positions re-laid, the
// room grammar kept), never a runtime reseed. No text
// anywhere. Frame one is layout 1 complete at the
// constant phase T = 7.3s with the spin state at its
// anchored start angle; the clock is anchored there
// and advances in fixed 1/60 ticks, never from a wall
// clock. Flat colour only, one canvas, no offscreen
// canvas, no gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette (closed) -----------------------------------
var WALL = '#F6EDE3';    // walls, book pages
var RUG = '#E84393';     // rug magenta
var FRINGE = '#F6D7DE';  // rug fringe, pillow 2 dots
var CAT = '#EFE3CC';     // cat cream; also the woman's skin
var YARN = '#F08C3C';    // yarn orange
var MINT = '#9AD6C2';    // record player; also the woman's top
var INK = '#1E1E1E';     // vinyl; also the woman's hair
var LABEL = '#F5A623';   // vinyl label
var LEAF = '#4E7A3A';    // plants
var BLUE = '#3E7CB1';    // mug; also the hair clip and her trousers
var PIL1 = '#D94F6B';    // pillow 1; also a plant pot
var PIL2 = '#F7D354';    // pillow 2

// Palette resolutions (documented in process.md): the
// prompt calls for wavy brown hair and a blue clip but
// the set palette holds no brown; hair takes the
// palette's near-black INK, the clip takes the mug
// BLUE, and her skin takes the warm CAT cream.

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30;
if (LOOP !== 30) throw new Error('Vintage Hobby Room ambient loop must be 30s');
var TICK = 1 / 60;
var T0 = 7.3;
var T = T0;

// ---- the ten micro-details, asserted --------------------
var DETAILS = ['vinyl label spinning', 'yarn ball',
  'cat batting paw', 'mug steam', 'book pages',
  'blue hair clip', 'rug fringe', 'pillow patterns',
  'plant leaf overlaps', 'player carry handle'];
if (DETAILS.length !== 10) throw new Error('exactly 10 micro-details');

// ---- layout table: 3 authored, room grammar kept --------
// cat/ball re-laid together, mug moves, the two plants
// swap corners and sizes. flip mirrors the yarn trail.
var LAYOUTS = [
  { cat: [452, 470], ball: [560, 528], flip: 1, mug: [1002, 556],
    plants: [[1136, 168, 1.0], [150, 776, 0.72]] },
  { cat: [1006, 462], ball: [1114, 520], flip: -1, mug: [296, 540],
    plants: [[1136, 168, 0.72], [1176, 782, 1.0]] },
  { cat: [628, 392], ball: [528, 442], flip: 1, mug: [1096, 428],
    plants: [[150, 776, 1.0], [1176, 782, 0.72]] }
];
if (LAYOUTS.length !== 3) throw new Error('exactly 3 authored layouts');
var lay = 0;

// ---- spin state ------------------------------------------
// Integrated in fixed ticks inside step(): the angle
// starts at the anchored ANGLE0, the rate is BASE plus
// a drag-fed extra that decays to exactly zero, so the
// vinyl always settles back to exactly the base spin.
var BASE_SPIN = 3.4907;  // 33 1/3 rpm in rad/s
var ANGLE0 = 2.1;
var spinAngle = ANGLE0;
var spinExtra = 0;
var dragging = false;
var dragTarget = 0;

// ---- pointer state ---------------------------------------
var lastTapT = -10, lastTapX = -999, lastTapY = -999;
var downX = -1, downY = -1, lastPX = 0, lastPY = 0, lastPT = 0;

// QA hooks via the renderer's query string (?seed=...):
// layout=N starts the piece on layout N, settled.
// Default play is unaffected.
var QS = (typeof location !== 'undefined' && location.search) || '';
var lm = QS.match(/layout=(\d+)/);
if (lm) lay = ((parseInt(lm[1], 10) % 3) + 3) % 3;

// ---- small helpers ---------------------------------------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function ell(x, y, rx, ry, rot, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function circ(x, y, r, col) { ell(x, y, r, r, 0, col); }
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function rr(x, y, w, h, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath(); ctx.fill();
}
function outl(lw, col) { ctx.strokeStyle = col || INK; ctx.lineWidth = lw || 5; ctx.lineJoin = 'round'; ctx.stroke(); }
function ellO(x, y, rx, ry, rot, col, lw) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fillStyle = col; ctx.fill(); outl(lw);
}
function seg(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function curve(x1, y1, cx, cy, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}
function pathOf(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
}

// ---- room: walls, rug, fringe ------------------------------
function drawRoom() {
  rect(-2400, -2400, DW + 4800, DH + 4800, WALL);
  ctx.save();
  ctx.translate(640, 602); ctx.rotate(-0.03); ctx.translate(-640, -602);
  rr(84, 322, 1112, 556, 26, RUG);
  // fringe (detail 7): short strokes along both short
  // edges of the rug, in rug-local space
  ctx.strokeStyle = FRINGE; ctx.lineWidth = 6; ctx.lineCap = 'round';
  var i, y;
  for (i = 0; i < 13; i++) {
    y = 348 + i * 42;
    ctx.beginPath(); ctx.moveTo(84, y); ctx.lineTo(58, y + 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1196, y); ctx.lineTo(1222, y - 5); ctx.stroke();
  }
  ctx.restore();
}

// ---- pillows with patterns (detail 8) ----------------------
function drawPillow(x, y, w, h, rot, base, kind) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  rr(-w / 2, -h / 2, w, h, 20, base);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-w / 2 + 20, -h / 2);
  ctx.lineTo(w / 2 - 20, -h / 2); ctx.arcTo(w / 2, -h / 2, w / 2, -h / 2 + 20, 20);
  ctx.lineTo(w / 2, h / 2 - 20); ctx.arcTo(w / 2, h / 2, w / 2 - 20, h / 2, 20);
  ctx.lineTo(-w / 2 + 20, h / 2); ctx.arcTo(-w / 2, h / 2, -w / 2, h / 2 - 20, 20);
  ctx.lineTo(-w / 2, -h / 2 + 20); ctx.arcTo(-w / 2, -h / 2, -w / 2 + 20, -h / 2, 20);
  ctx.closePath(); ctx.clip();
  var i, j;
  if (kind === 'stripes') {
    for (i = -3; i < 4; i++) rect(i * 34 - 8, -h / 2 - 4, 15, h + 8, RUG);
  } else {
    for (i = 0; i < 4; i++) for (j = 0; j < 3; j++)
      circ(-w / 2 + 28 + i * 38 + (j % 2) * 17, -h / 2 + 26 + j * 36, 7, FRINGE);
  }
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(-w / 2 + 20, -h / 2);
  ctx.lineTo(w / 2 - 20, -h / 2); ctx.arcTo(w / 2, -h / 2, w / 2, -h / 2 + 20, 20);
  ctx.lineTo(w / 2, h / 2 - 20); ctx.arcTo(w / 2, h / 2, w / 2 - 20, h / 2, 20);
  ctx.lineTo(-w / 2 + 20, h / 2); ctx.arcTo(-w / 2, h / 2, -w / 2, h / 2 - 20, 20);
  ctx.lineTo(-w / 2, -h / 2 + 20); ctx.arcTo(-w / 2, -h / 2, -w / 2 + 20, -h / 2, 20);
  ctx.closePath(); outl(4);
  ctx.restore();
}

// ---- potted plant; leaves overlap (detail 9) ----------------
function drawPlant(x, y, s, potCol) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  var leaves = [
    [0, -88, 17, 46, 0], [-38, -74, 15, 40, -0.55], [38, -74, 15, 40, 0.55],
    [-64, -50, 13, 34, -1.0], [64, -50, 13, 34, 1.0], [-20, -96, 14, 42, -0.25],
    [22, -98, 14, 42, 0.3]
  ];
  var i;
  for (i = 0; i < leaves.length; i++)
    ellO(leaves[i][0], leaves[i][1], leaves[i][2], leaves[i][3], leaves[i][4], LEAF, 3.5);
  // pot: trapezoid with a rim
  pathOf([-30, -18, 30, -18, 22, 42, -22, 42]); ctx.fillStyle = potCol; ctx.fill(); outl(4);
  rr(-36, -32, 72, 18, 6, potCol); outl(4);
  ctx.restore();
}

// ---- record player + vinyl -----------------------------------
function drawPlayer(lt) {
  // carry handle (detail 10): a strap arc over the case
  curve(150, 92, 262, 30, 374, 92, 9, INK);
  rr(104, 88, 316, 238, 18, MINT); outl(5);
  rr(122, 106, 280, 120, 12, MINT); // lid sheen panel, flat
  ctx.strokeStyle = 'rgba(246,237,227,0.55)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(126, 226); ctx.lineTo(398, 226); ctx.stroke();
  // controls: two small knobs and a speaker dot grid
  circ(140, 296, 11, INK); circ(172, 296, 11, INK);
  var i, j;
  ctx.fillStyle = INK;
  for (i = 0; i < 4; i++) for (j = 0; j < 2; j++) circ(352 + i * 14, 288 + j * 14, 3, INK);
  // vinyl: black disc, grooves, orange label, marker
  var vx = 262, vy = 168, vr = 74;
  // the player sits top-left; the vinyl rides high in
  // the case so the label reads at a glance
  circ(vx, vy, vr, INK);
  ctx.strokeStyle = 'rgba(246,237,227,0.20)'; ctx.lineWidth = 3;
  var gr;
  for (gr = 0; gr < 3; gr++) {
    ctx.beginPath(); ctx.arc(vx, vy, 62 - gr * 9, 0, Math.PI * 2); ctx.stroke();
  }
  // stepped flat sheen arc (the prompt's sheen, flat)
  ctx.strokeStyle = 'rgba(246,237,227,0.28)'; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.arc(vx, vy, 58, Math.PI * 1.15, Math.PI * 1.55); ctx.stroke();
  ctx.save();
  ctx.translate(vx, vy); ctx.rotate(spinAngle);
  circ(0, 0, 30, LABEL); outl(3.5);
  // label marker + print arcs ride the spin (detail 1)
  seg(0, -30, 0, -16, 7, INK);
  ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 21, 0.4, 2.0); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 21, Math.PI + 0.4, Math.PI + 2.0); ctx.stroke();
  circ(0, 0, 4.5, INK);
  ctx.restore();
  // tonearm resting at the record's edge
  circ(392, 118, 12, INK);
  seg(392, 118, 330, 158, 7, INK);
  circ(330, 158, 6, LABEL);
}

// ---- yarn: ball (detail 2) + trail on a triangle wave --------
// Trail offsets from the ball, snaking across the rug;
// the drawn length follows the loop's triangle wave.
var TRAIL = [[0, 0], [58, -22], [124, -6], [176, -38], [238, -20], [292, -50], [356, -28], [404, -54]];
function trailPoint(frac, bx, by, flip) {
  var total = 0, cum = [0], i;
  for (i = 1; i < TRAIL.length; i++) {
    var dx = TRAIL[i][0] - TRAIL[i - 1][0], dy = TRAIL[i][1] - TRAIL[i - 1][1];
    total += Math.sqrt(dx * dx + dy * dy); cum.push(total);
  }
  var want = frac * total, pts = [[bx, by]];
  for (i = 1; i < TRAIL.length; i++) {
    if (cum[i] <= want) { pts.push([bx + flip * TRAIL[i][0], by + TRAIL[i][1]]); continue; }
    var f = (want - cum[i - 1]) / (cum[i] - cum[i - 1]);
    pts.push([bx + flip * (TRAIL[i - 1][0] + (TRAIL[i][0] - TRAIL[i - 1][0]) * f),
              by + TRAIL[i - 1][1] + (TRAIL[i][1] - TRAIL[i - 1][1]) * f]);
    break;
  }
  return pts;
}
function drawYarn(lt, L) {
  var tri = lt < 15 ? lt / 15 : (30 - lt) / 15;   // unwind 15s, rewind 15s
  var frac = 0.18 + 0.82 * tri;
  var bx = L.ball[0], by = L.ball[1];
  var pts = trailPoint(frac, bx, by, L.flip);
  if (pts.length > 1) {
    ctx.strokeStyle = YARN; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    var i;
    for (i = 1; i < pts.length - 1; i++) {
      var mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]); ctx.stroke();
    // loose curl at the free end
    var e = pts[pts.length - 1];
    ctx.beginPath(); ctx.arc(e[0] + 8 * L.flip, e[1] + 6, 10, 0.3, Math.PI * 1.7); ctx.stroke();
  }
  // the ball itself: wound arcs over an orange disc;
  // it shrinks a touch as the trail lengthens
  var br = 31 - 8 * frac;
  circ(bx, by, br, YARN); outl(4);
  ctx.save();
  ctx.translate(bx, by); ctx.rotate(frac * 2.4);
  ctx.strokeStyle = 'rgba(30,30,30,0.22)'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(0, 0, br * 0.66, 0.2, 2.4); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, br * 0.66, Math.PI + 0.2, Math.PI + 2.4); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, br * 0.38, 1.2, 4.2); ctx.stroke();
  ctx.restore();
}

// ---- the cat, batting at fixed 6s slots -----------------------
function drawCat(lt, L) {
  var cx = L.cat[0], cy = L.cat[1];
  var slot = lt % 6;
  var raise = 0;
  if (slot < 0.45) raise = slot / 0.45;
  else if (slot < 0.95) raise = 1 - (slot - 0.45) / 0.5;
  raise = raise * raise * (3 - 2 * raise);         // smoothstep bat
  var flick = Math.sin((lt / LOOP) * Math.PI * 2 * 5) * 7 + raise * 12;
  // tail: an arc curling up behind, tip swaying
  ctx.save(); ctx.translate(cx - 48, cy + 16); ctx.rotate((-24 - flick * 0.4) * Math.PI / 180);
  ctx.beginPath(); ctx.arc(0, 0, 46, Math.PI * 0.95, Math.PI * 1.95);
  ctx.strokeStyle = INK; ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 46, Math.PI * 0.95, Math.PI * 1.95);
  ctx.strokeStyle = CAT; ctx.lineWidth = 15; ctx.stroke();
  ctx.restore();
  // haunch + body
  ellO(cx - 34, cy + 22, 34, 26, 0.3, CAT, 4);
  ellO(cx, cy, 66, 45, 0, CAT, 4.5);
  // resting front paw
  ellO(cx + 34, cy + 40, 20, 10, 0.1, CAT, 3.5);
  // batting paw (detail 3): rises toward the ball
  ctx.save();
  ctx.translate(cx + 44, cy + 2); ctx.rotate(-raise * 0.95);
  seg(0, 0, 30, 16, 15, CAT);
  ellO(36, 20, 13, 10, 0.5, CAT, 3.5);
  ctx.restore();
  // head with ears, closed happy eyes
  ctx.beginPath(); // ears
  ctx.moveTo(cx + 28, cy - 58); ctx.lineTo(cx + 40, cy - 84); ctx.lineTo(cx + 54, cy - 60); ctx.closePath();
  ctx.moveTo(cx + 66, cy - 62); ctx.lineTo(cx + 84, cy - 82); ctx.lineTo(cx + 90, cy - 54); ctx.closePath();
  ctx.fillStyle = CAT; ctx.fill(); outl(3.5);
  circ(cx + 58, cy - 34, 37, CAT); outl(4.5);
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx + 44, cy - 36, 7, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 74, cy - 36, 7, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  ell(cx + 59, cy - 24, 4.5, 3.2, 0, PIL1);
  curve(cx + 59, cy - 20, cx + 62, cy - 16, cx + 67, cy - 19, 3, INK);
  // whiskers
  seg(cx + 84, cy - 26, cx + 104, cy - 30, 2.5, INK);
  seg(cx + 84, cy - 20, cx + 103, cy - 18, 2.5, INK);
}

// ---- the woman, reading, and her book --------------------------
// Diagonal across the lower half: feet bottom-left,
// head top-right, book open before her face.
function drawWoman(lt) {
  var breathe = Math.sin((lt / LOOP) * Math.PI * 2 * 2) * 3;
  // legs in blue trousers, bent at the knees, feet up
  seg(588, 628, 452, 716, 46, BLUE);
  seg(452, 716, 330, 788, 40, BLUE);
  seg(600, 652, 478, 748, 44, BLUE);
  seg(478, 748, 372, 812, 38, BLUE);
  ellO(322, 792, 24, 13, -0.5, CAT, 4);   // feet (skin cream)
  ellO(364, 816, 24, 13, -0.4, CAT, 4);
  // neck bridging torso and head
  seg(826, 502, 866, 468, 36, CAT);
  // torso: mint top, a capsule along the diagonal
  seg(592, 636, 806, 508 + breathe * 0.4, 92, MINT);
  circ(806, 508 + breathe * 0.4, 46, MINT);
  circ(592, 636, 46, MINT);
  // arms propping her: mint sleeves, skin forearms
  // cradling the book from either side
  seg(800, 516, 852, 596, 34, MINT);
  seg(852, 596, 800, 628, 26, CAT);
  seg(784, 552, 742, 606, 34, MINT);
  seg(742, 606, 770, 632, 26, CAT);
  // hair: a wavy mass of scalloped circles over the head
  var hx = 892, hy = 452 + breathe * 0.4;
  var bumps = [[-38, -28, 30], [-8, -44, 32], [24, -40, 30], [46, -16, 27],
               [40, 14, 25], [-44, 4, 26], [-24, -46, 24], [8, -52, 25]];
  var i;
  for (i = 0; i < bumps.length; i++) circ(hx + bumps[i][0], hy + bumps[i][1], bumps[i][2], INK);
  circ(hx, hy - 8, 47, INK);
  // face, looking down at the book
  circ(hx + 4, hy + 14, 43, CAT);
  for (i = 0; i < 4; i++) circ(hx - 34 + i * 6, hy - 34 + (i % 2) * 7, 15, INK); // fringe scallops
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(hx - 8, hy + 18, 8, Math.PI * 1.05, Math.PI * 1.85); ctx.stroke(); // closed eye
  curve(hx - 2, hy + 34, hx + 3, hy + 40, hx + 10, hy + 35, 3, INK);                        // small smile
  ell(hx + 18, hy + 28, 8, 5, 0, PIL1);                                                       // cheek
  // blue hair clip (detail 6)
  ctx.save(); ctx.translate(hx - 40, hy - 40); ctx.rotate(-0.5);
  rr(-6, -20, 12, 40, 6, BLUE); outl(3);
  circ(0, -20, 6, BLUE);
  ctx.restore();
  drawBook(lt);
}
// the open book (detail 5): two page quads and their
// print lines, held before her face
function drawBook(lt) {
  ctx.save(); ctx.translate(788, 622); ctx.rotate(-0.10);
  // cover peeking out under the pages
  pathOf([-96, -52, 0, -30, 96, -52, 104, 44, 0, 64, -104, 44]);
  ctx.fillStyle = PIL1; ctx.fill(); outl(4.5);
  // left and right pages
  pathOf([-92, -46, 0, -26, 0, 56, -98, 38]); ctx.fillStyle = WALL; ctx.fill(); outl(3.5);
  pathOf([92, -46, 0, -26, 0, 56, 98, 38]); ctx.fillStyle = WALL; ctx.fill(); outl(3.5);
  // print lines
  ctx.strokeStyle = 'rgba(30,30,30,0.45)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  var rows = [[-80, -28, -14, -14], [-82, -8, -13, 4], [-83, 12, -13, 24], [-80, 30, -20, 40]];
  var i;
  for (i = 0; i < rows.length; i++) {
    ctx.beginPath(); ctx.moveTo(rows[i][0], rows[i][1]); ctx.lineTo(rows[i][2], rows[i][3]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-rows[i][0], rows[i][1]); ctx.lineTo(-rows[i][2], rows[i][3]); ctx.stroke();
  }
  // the page she is turning lifts on a whole cycle
  var lift = (Math.sin((lt / LOOP) * Math.PI * 2) + 1) / 2;
  ctx.save(); ctx.translate(0, -26); ctx.rotate(-lift * 0.16); ctx.translate(0, 26);
  pathOf([2, -24, 84, -42, 90, 34, 2, 52]); ctx.fillStyle = WALL; ctx.fill();
  ctx.strokeStyle = 'rgba(30,30,30,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(14, -12); ctx.lineTo(76, -26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14, 6); ctx.lineTo(78, -6); ctx.stroke();
  ctx.restore();
  // spine
  seg(0, -26, 0, 56, 4, INK);
  ctx.restore();
}

// ---- the mug and its steam (detail 4) -------------------------
function drawMug(lt, L) {
  var mx = L.mug[0], my = L.mug[1];
  // steam first, behind the mug rim: two curls rising
  // on whole cycles, in the mug's own blue, flat alpha
  var i;
  for (i = 0; i < 2; i++) {
    var cyc = i === 0 ? 3 : 2;
    var ph = ((lt / LOOP) * cyc + i * 0.45) % 1;
    var sx = mx - 14 + i * 28 + Math.sin(ph * Math.PI * 2) * 6;
    var sy = my - 44 - ph * 58;
    ctx.globalAlpha = 0.45 * Math.sin(ph * Math.PI);
    curve(sx, sy + 26, sx + 12, sy + 8, sx, sy - 12, 8, BLUE);
    ctx.globalAlpha = 1;
  }
  // body, handle, coffee
  rr(mx - 34, my - 30, 68, 62, 10, BLUE); outl(4.5);
  ctx.beginPath(); ctx.arc(mx + 44, my + 2, 17, -Math.PI / 2, Math.PI / 2); outl(6, BLUE);
  ell(mx, my - 30, 34, 9, 0, INK);
  ell(mx, my - 30.5, 27, 6, 0, BLUE);
}

function draw() {
  var lt = T % LOOP;
  var L = LAYOUTS[lay];
  drawRoom();
  drawPillow(178, 428, 158, 112, -0.16, PIL2, 'stripes');
  drawPillow(1086, 686, 158, 112, 0.13, PIL1, 'dots');
  drawPlant(L.plants[0][0], L.plants[0][1], L.plants[0][2], BLUE);
  drawPlant(L.plants[1][0], L.plants[1][1], L.plants[1][2], PIL1);
  drawPlayer(lt);
  drawYarn(lt, L);
  drawCat(lt, L);
  drawWoman(lt);
  drawMug(lt, L);
}

// ---- step ---------------------------------------------------
function step() {
  // The vinyl integrates in fixed ticks: base rate plus
  // the drag extra, which decays toward zero; when it
  // falls below a hair it snaps to exactly zero, so the
  // spin settles to exactly the base rate.
  if (!dragging) {
    spinExtra *= Math.exp(-1.5 * TICK);
    if (spinExtra < 0.002) spinExtra = 0;
  }
  spinAngle += (BASE_SPIN + spinExtra) * TICK;
}

// ---- pointer: drag spins, double-tap re-lays ------------------
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y;
  lastPX = p.x; lastPY = p.y; lastPT = T;
  dragging = true; dragTarget = 0;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dt = Math.max(T - lastPT, TICK);
  var dx = p.x - lastPX, dy = p.y - lastPY;
  var speed = Math.sqrt(dx * dx + dy * dy) / dt;      // design px per second
  dragTarget = clamp(speed * 0.006, 0, 13);
  spinExtra += (dragTarget - spinExtra) * 0.35;
  lastPX = p.x; lastPY = p.y; lastPT = T;
});
function endPointer(e) {
  if (!dragging) return;
  dragging = false;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  downX = -1;
  if (moved >= 28) { lastTapT = -10; return; }        // it was a drag
  // a tap: two close together advance the layout table
  if (T - lastTapT < 0.38 && Math.abs(p.x - lastTapX) < 90 && Math.abs(p.y - lastTapY) < 90) {
    lay = (lay + 1) % LAYOUTS.length;
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = p.x; lastTapY = p.y;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { dragging = false; downX = -1; });

// ---- sizing: full-bleed cover fit ---------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  rect(0, 0, W, H, WALL);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
var lastNow = -1, acc = 0;
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
