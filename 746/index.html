<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afrum Corner</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0D0F; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var ROOM = "#0D0D0F";
  var FACE = "#FFF4E0";
  var FALLOFF = "#E8D8B8";
  var SPILL = "#3A3428";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  window.addEventListener("resize", resize);
  resize();

  // mulberry32 seeded RNG factory. One stream generates the whole
  // configuration sequence, in tap order, so the piece is a pure function
  // of the seed plus the recorded tap times.
  function makeRng(seedStart) {
    var s = seedStart | 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = makeRng(746013);

  // A configuration is the room corner placement plus the virtual
  // projector's position, aim target, and beam half-size. Ranges are
  // constrained so the beam square always straddles the corner line:
  // |tgtX| stays well under half, so both walls always catch half the
  // square and the cube read never collapses into a one-wall kite.
  function genCfg() {
    return {
      cornerShift: (rng() * 2 - 1) * 0.06,   // fraction of frame width
      projX: (rng() * 2 - 1) * 0.70,
      projY: 0.45 - rng() * 0.55,
      projZ: -5.60 + rng() * 0.60,
      tgtX: (rng() * 2 - 1) * 0.18,
      tgtY: 0.28 - rng() * 0.33,
      half: 0.66 + rng() * 0.29
    };
  }
  var cfgs = [];
  function getCfg(i) {
    while (cfgs.length <= i) cfgs.push(genCfg());
    return cfgs[i];
  }

  // Re-aim transitions: each tap appends {t0, from, to}; the live
  // parameters are a closed-form eased lerp, never integrated.
  var transitions = [];
  var cfgIndex = 0;
  function lerp(a, b, e) { return a + (b - a) * e; }
  function lerpParams(a, b, e) {
    return {
      cornerShift: lerp(a.cornerShift, b.cornerShift, e),
      projX: lerp(a.projX, b.projX, e),
      projY: lerp(a.projY, b.projY, e),
      projZ: lerp(a.projZ, b.projZ, e),
      tgtX: lerp(a.tgtX, b.tgtX, e),
      tgtY: lerp(a.tgtY, b.tgtY, e),
      half: lerp(a.half, b.half, e)
    };
  }
  function easeInOut(u) {
    return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  }
  var AIM_TIME = 0.8;
  function paramsAt(t) {
    var tr = null;
    for (var i = transitions.length - 1; i >= 0; i--) {
      if (transitions[i].t0 <= t) { tr = transitions[i]; break; }
    }
    if (!tr) return getCfg(0);
    var u = (t - tr.t0) / AIM_TIME;
    if (u >= 1) return tr.to;
    if (u <= 0) return tr.from;
    return lerpParams(tr.from, tr.to, easeInOut(u));
  }

  // ---- 3D model -------------------------------------------------------
  // The corner line is the world y axis. The left wall is the plane
  // x + z = 0 (x <= 0 half), the right wall is -x + z = 0 (x >= 0 half):
  // a true 90 degree room corner. The camera is a pinhole at (0,0,-4.5).
  // The projector sits in the room and casts a square beam; each boundary
  // sample of the square sends a ray that is intersected with both wall
  // planes, and the valid hit (the one on the correct half-plane, first
  // along the ray) is the light's landing point. Walking the square's
  // boundary gives a polygon that lives on the two walls and kinks
  // exactly where the edges cross the corner line.
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function mul(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1],
            a[2] * b[0] - a[0] * b[2],
            a[0] * b[1] - a[1] * b[0]];
  }
  function norm(a) {
    var l = Math.sqrt(dot(a, a)) || 1;
    return [a[0] / l, a[1] / l, a[2] / l];
  }
  function lerp3(a, b, s) {
    return [a[0] + (b[0] - a[0]) * s,
            a[1] + (b[1] - a[1]) * s,
            a[2] + (b[2] - a[2]) * s];
  }

  // Intersect ray P + lambda*(b - P) with both wall planes (extended).
  // Returns the left-plane point; its x sign says which wall the ray
  // truly lands on, and it varies continuously along the beam boundary.
  function leftPlanePoint(P, b) {
    var d = sub(b, P);
    var lam = -(P[0] + P[2]) / (d[0] + d[2]);
    return add(P, mul(d, lam));
  }
  function rightPlanePoint(P, b) {
    var d = sub(b, P);
    var lam = (P[0] - P[2]) / (d[2] - d[0]);
    return add(P, mul(d, lam));
  }
  function castRay(P, b) {
    var d = sub(b, P);
    var lamL = -(P[0] + P[2]) / (d[0] + d[2]);
    var pL = add(P, mul(d, lamL));
    if (lamL > 0 && pL[0] <= 0) return { p: pL, side: "L" };
    var lamR = (P[0] - P[2]) / (d[2] - d[0]);
    var pR = add(P, mul(d, lamR));
    if (lamR > 0 && pR[0] >= 0) return { p: pR, side: "R" };
    // Defensive fallback; the constrained configs never reach this.
    if (lamL > 0 && (lamR <= 0 || lamL <= lamR)) return { p: pL, side: pL[0] <= 0 ? "L" : "R" };
    return { p: pR, side: pR[0] >= 0 ? "R" : "L" };
  }

  // Where the beam boundary crosses the corner line, between two
  // same-edge samples of opposite sides: bisect on the sign of the
  // left-plane intersection's x. At the crossing both plane hits agree
  // on the corner line itself.
  function cornerCrossing(P, e0, e1, sA, sideA, sB) {
    var lo = sA, hi = sB;
    for (var i = 0; i < 24; i++) {
      var mid = (lo + hi) / 2;
      var b = lerp3(e0, e1, mid);
      var x = leftPlanePoint(P, b)[0];
      var side = x <= 0 ? "L" : "R";
      if (side === sideA) lo = mid; else hi = mid;
    }
    var bEnd = lerp3(e0, e1, (lo + hi) / 2);
    var pL = leftPlanePoint(P, bEnd);
    var pR = rightPlanePoint(P, bEnd);
    return [(pL[0] + pR[0]) / 2, (pL[1] + pR[1]) / 2, (pL[2] + pR[2]) / 2];
  }

  // Build the full boundary loop in 3D: samples around the beam square,
  // with the two exact corner-line crossings inserted and flagged.
  function buildLoop(P, T, half) {
    var d = norm(sub(T, P));
    var r = norm(cross(d, [0, 1, 0]));
    var u = cross(r, d);
    var rp = mul(r, half), up = mul(u, half);
    var corners = [
      add(T, add(rp, up)),
      add(T, add(mul(rp, -1), up)),
      add(T, add(mul(rp, -1), mul(up, -1))),
      add(T, add(rp, mul(up, -1)))
    ];
    var samples = [];
    var STEPS = 20;
    for (var e = 0; e < 4; e++) {
      var e0 = corners[e], e1 = corners[(e + 1) % 4];
      for (var j = 0; j <= STEPS; j++) {
        var s = j / STEPS;
        var b = lerp3(e0, e1, s);
        var hit = castRay(P, b);
        samples.push({ p3: hit.p, side: hit.side, e0: e0, e1: e1, s: s });
      }
    }
    var loop = [];
    var n = samples.length;
    for (var i = 0; i < n; i++) {
      var cur = samples[i];
      loop.push({ p3: cur.p3, side: cur.side, corner: false });
      var nxt = samples[(i + 1) % n];
      if (nxt.side !== cur.side) {
        var cp;
        if (nxt.e0 === cur.e0) {
          cp = cornerCrossing(P, cur.e0, cur.e1, cur.s, cur.side, nxt.s);
        } else {
          cp = cur.p3; // shared square corner; defensive only
        }
        loop.push({ p3: cp, side: "C", corner: true });
      }
    }
    return loop;
  }

  // Projector lamp breathing: plus or minus 2 percent, phase 0 at t=0.
  function breathe(t) { return 1 + 0.02 * Math.sin(2 * Math.PI * t / 7.0); }

  function draw(t) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var par = paramsAt(t);
    var Xc = W / 2 + par.cornerShift * W;
    var eyeY = H * 0.5;
    var f = 0.88 * Math.min(W, H);
    var lum = breathe(t);
    var phone = isPhone();

    // ---- room -------------------------------------------------------
    ctx.globalAlpha = 1;
    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, W, H);

    var ceilY = H * 0.085, floorY = H * 0.915;
    var ceilEdge = H * 0.02, floorEdge = H * 0.98;

    function poly(pts) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
    }

    // Ceiling and floor planes catch a little more of the spill tone so
    // the two walls separate from them and from each other.
    ctx.fillStyle = SPILL;
    ctx.globalAlpha = 0.05;
    poly([[0, 0], [W, 0], [W, ceilEdge], [Xc, ceilY], [0, ceilEdge]]);
    ctx.fill();
    ctx.globalAlpha = 0.085;
    poly([[0, H], [W, H], [W, floorEdge], [Xc, floorY], [0, floorEdge]]);
    ctx.fill();
    ctx.globalAlpha = 0.015;
    poly([[0, ceilEdge], [Xc, ceilY], [Xc, floorY], [0, floorEdge]]);
    ctx.fill();
    ctx.globalAlpha = 0.04;
    poly([[W, ceilEdge], [Xc, ceilY], [Xc, floorY], [W, floorEdge]]);
    ctx.fill();

    // Ceiling and floor edge lines, then the corner seam itself.
    ctx.strokeStyle = SPILL;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.14;
    ctx.beginPath();
    ctx.moveTo(0, ceilEdge); ctx.lineTo(Xc, ceilY); ctx.lineTo(W, ceilEdge);
    ctx.moveTo(0, floorEdge); ctx.lineTo(Xc, floorY); ctx.lineTo(W, floorEdge);
    ctx.stroke();
    ctx.strokeStyle = FALLOFF;
    ctx.globalAlpha = 0.045;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(Xc, ceilY); ctx.lineTo(Xc, floorY);
    ctx.stroke();
    ctx.strokeStyle = SPILL;
    ctx.globalAlpha = 0.30;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Xc, ceilY); ctx.lineTo(Xc, floorY);
    ctx.stroke();

    // ---- projection ---------------------------------------------------
    var P = [par.projX, par.projY, par.projZ];
    var T = [par.tgtX, par.tgtY, 0];
    var loop = buildLoop(P, T, par.half);

    // To screen. Points keep their side and corner flags.
    var scr = [];
    var cornerPts = [];
    for (var i = 0; i < loop.length; i++) {
      var p = loop[i].p3;
      var den = p[2] + 4.5;
      var pt = {
        x: Xc + f * p[0] / den,
        y: eyeY - f * p[1] / den,
        side: loop[i].side,
        corner: loop[i].corner
      };
      scr.push(pt);
      if (pt.corner) cornerPts.push(pt);
    }
    var left = [], right = [];
    for (var k = 0; k < scr.length; k++) {
      if (scr[k].side === "L" || scr[k].corner) left.push(scr[k]);
      if (scr[k].side === "R" || scr[k].corner) right.push(scr[k]);
    }

    // Per-face brightness from incidence: the face turned more squarely
    // to the projector sits a little brighter, as in the real room.
    function faceMult(pts3, nx, nz) {
      var cx = 0, cy = 0, cz = 0;
      for (var i = 0; i < pts3.length; i++) { cx += pts3[i][0]; cy += pts3[i][1]; cz += pts3[i][2]; }
      cx /= pts3.length; cy /= pts3.length; cz /= pts3.length;
      var v = norm([P[0] - cx, P[1] - cy, P[2] - cz]);
      var cosI = Math.max(0, v[0] * nx + v[2] * nz);
      var m = 0.74 + 0.34 * cosI;
      return Math.max(0.80, Math.min(1.0, m));
    }
    var left3 = [], right3 = [];
    for (var q = 0; q < loop.length; q++) {
      if (loop[q].side === "L" || loop[q].corner) left3.push(loop[q].p3);
      if (loop[q].side === "R" || loop[q].corner) right3.push(loop[q].p3);
    }
    var SQ = Math.SQRT1_2;
    var multL = faceMult(left3, -SQ, -SQ);
    var multR = faceMult(right3, SQ, -SQ);

    // The shared corner segment's midpoint anchors the corner vertices
    // during inset passes, so the kink never leaves the corner line.
    var cornerMid = null;
    if (cornerPts.length >= 2) {
      cornerMid = {
        x: (cornerPts[0].x + cornerPts[1].x) / 2,
        y: (cornerPts[0].y + cornerPts[1].y) / 2
      };
    }

    // Layered alpha falloff: wide faint spill first, then nested insets
    // rising in alpha toward the core. No gradients, no shadowBlur.
    var passes = [
      { f: 1.34, col: SPILL, a: 0.030 },
      { f: 1.18, col: SPILL, a: 0.045 },
      { f: 1.08, col: FALLOFF, a: 0.060 },
      { f: 1.00, col: FALLOFF, a: 0.140 },
      { f: 0.97, col: FACE, a: 0.20 },
      { f: 0.935, col: FACE, a: 0.30 },
      { f: 0.895, col: FACE, a: 0.44 },
      { f: 0.845, col: FACE, a: 0.60 },
      { f: 0.79, col: FACE, a: 0.80 },
      { f: 0.72, col: FACE, a: 0.97 }
    ];

    function drawFace(pts, mult) {
      if (pts.length < 3) return;
      var cx = 0, cy = 0;
      for (var i = 0; i < pts.length; i++) { cx += pts[i].x; cy += pts[i].y; }
      cx /= pts.length; cy /= pts.length;
      for (var p = 0; p < passes.length; p++) {
        var ps = passes[p];
        ctx.fillStyle = ps.col;
        ctx.globalAlpha = Math.min(1, ps.a * lum * mult);
        ctx.beginPath();
        for (var v = 0; v < pts.length; v++) {
          var pt = pts[v];
          var ax = pt.corner && cornerMid ? cornerMid.x : cx;
          var ay = pt.corner && cornerMid ? cornerMid.y : cy;
          var x = ax + (pt.x - ax) * ps.f;
          var y = ay + (pt.y - ay) * ps.f;
          if (v === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      }
    }

    if (left.length >= 3 && right.length >= 3 && cornerMid) {
      drawFace(left, multL);
      drawFace(right, multR);
    } else {
      // Defensive: a non-straddling aim still draws as one flat wash.
      drawFace(scr, 1);
    }

    ctx.globalAlpha = 1;
  }

  // Piece clock: elapsed seconds from the first rAF timestamp. The
  // synchronous first frame is draw(0), a pure function of the seed.
  var startStamp = null;
  var lastTime = 0;
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    lastTime = (stamp - startStamp) / 1000;
    draw(lastTime);
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
  }
  draw(0);
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);

  // Interaction: a tap re-aims the projector. The next seeded
  // configuration takes over through a 0.8 s eased pan of the corner
  // placement and the beam. Drags do nothing; nothing ever reloads.
  var downX = 0, downY = 0, downT = 0, dragMoved = 0, dragging = false;

  function eventPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener("pointerdown", function (e) {
    var pos = eventPos(e);
    dragging = true;
    dragMoved = 0;
    downX = pos.x; downY = pos.y; downT = lastTime;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var pos = eventPos(e);
    dragMoved += Math.abs(pos.x - downX) + Math.abs(pos.y - downY);
    downX = pos.x; downY = pos.y;
  });

  canvas.addEventListener("pointerup", function (e) {
    if (!dragging) return;
    dragging = false;
    var quick = (lastTime - downT) < 0.4;
    var still = dragMoved < 14;
    if (!quick || !still) return;
    cfgIndex++;
    transitions.push({ t0: lastTime, from: paramsAt(lastTime), to: getCfg(cfgIndex) });
    if (transitions.length > 64) transitions.splice(0, transitions.length - 64);
    draw(lastTime);
  });

  canvas.addEventListener("pointercancel", function () { dragging = false; });
})();
</script>
</body>
</html>
