<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Skin Suitcase</title>
<style>
  html, body { margin: 0; padding: 0; background: #171412; overflow: hidden; }
  canvas { display: block; background: #171412; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- deterministic seeded values (integer hash, no Math.random) ----
  function hash(n) {
    var x = Math.imul(n ^ 0x9E3779B9, 0x85EBCA6B);
    x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35);
    x = x ^ (x >>> 16);
    return (x >>> 0) / 4294967296;
  }
  function rr(a, b, n) { return a + (b - a) * hash(n); }

  // ---- sizing: Visual Viewport API, resize on visualViewport + window ----
  var W = 0, H = 0;
  function size() {
    var w, h;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      w = visualViewport.width; h = visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    if (canvas.style) { canvas.style.width = w + 'px'; canvas.style.height = h + 'px'; }
  }
  size();
  if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
    visualViewport.addEventListener('resize', function () { size(); draw(bootT); });
  }
  window.addEventListener('resize', function () { size(); draw(bootT); });

  // ---- phone detection: window.screen physical size, aspect fallback ----
  function isPhone() {
    try {
      if (window.screen) {
        var m = Math.min(window.screen.width, window.screen.height);
        if (m > 0 && m < 700) return true;
      }
    } catch (e) {}
    return H > W * 1.15;
  }

  // ---- palette ----
  var LEATHER = '#2E2620', LEATHER_D = '#241D18', HANJI = '#E8DFC8',
      AMBER = '#B07A2E', STITCH = '#A03A2E', GROUND = '#171412',
      SKIN_LINE = '#C9BFA4';

  // ---- phase cycle: 60 s loop, frame one (t = 0) is FELT ----
  // order: felt 0-12, soak 12-24, beat 24-36, crumple 36-48, wring 48-60
  var PHASES = ['felt', 'soak', 'beat', 'crumple', 'wring'];
  function phaseAt(eff) {
    var pt = ((eff % 60) + 60) % 60;
    var idx = Math.floor(pt / 12);
    return { name: PHASES[idx], p: (pt - idx * 12) / 12, idx: idx };
  }
  // mist events restart the phase active at the mist moment (closed-form shift)
  var mists = []; // {t, x, y}
  function effectiveTime(t) {
    var shift = 0;
    for (var i = 0; i < mists.length; i++) {
      var m = mists[i];
      if (m.t > t) break;
      var effM = m.t + shift;
      var ps = Math.floor((((effM % 60) + 60) % 60) / 12) * 12;
      var base = effM - (((effM % 60) + 60) % 60);
      shift = (base + ps) - m.t;
    }
    return t + shift;
  }

  // ---- drag state: closed-form over recorded events ----
  var drags = []; // {sx, sy, moves:[{x,y,t}], end: t|null, ex, ey}
  var activeDrag = null;
  function tightnessAt(t) {
    var tight = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (d.end === null) {
        var last = d.moves[d.moves.length - 1];
        var pull = Math.sqrt((last.x - d.sx) * (last.x - d.sx) + (last.y - d.sy) * (last.y - d.sy));
        var pn = Math.min(pull / 220, 1);
        // resist then yield: shallow response below 0.4, steep after
        tight = pn < 0.4 ? pn * 0.3 : 0.12 + (pn - 0.4) * 1.47;
        if (tight > 1) tight = 1;
      } else if (t - d.end < 3) {
        var last2 = d.moves[d.moves.length - 1];
        var pull2 = Math.sqrt((last2.x - d.sx) * (last2.x - d.sx) + (last2.y - d.sy) * (last2.y - d.sy));
        var pn2 = Math.min(pull2 / 220, 1);
        var peak = pn2 < 0.4 ? pn2 * 0.3 : 0.12 + (pn2 - 0.4) * 1.47;
        if (peak > 1) peak = 1;
        tight = peak * Math.exp(-(t - d.end) / 1.2);
      }
    }
    return tight;
  }

  // ---- pointer input ----
  var holdTimer = null, holdFired = false, downPos = null, downTime = 0;
  function pos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function layout() {
    var s = Math.min(W, H);
    var cw = s * 0.62, ch = s * 0.44;
    var cx = W / 2, cy = H * 0.56;
    return { cw: cw, ch: ch, x: cx - cw / 2, y: cy - ch / 2, cx: cx, cy: cy, s: s };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e);
    var L = layout();
    downPos = p; downTime = bootNow();
    holdFired = false;
    // corner handle zone: bottom-right corner of the skin
    var hx = L.x + L.cw, hy = L.y + L.ch;
    if (Math.sqrt((p.x - hx) * (p.x - hx) + (p.y - hy) * (p.y - hy)) < L.s * 0.12) {
      activeDrag = { sx: p.x, sy: p.y, moves: [{ x: p.x, y: p.y, t: downTime }], end: null };
      drags.push(activeDrag);
    }
    var self = this;
    holdTimer = setTimeout(function () {
      if (!activeDrag) {
        holdFired = true;
        mists.push({ t: bootNow(), x: p.x, y: p.y });
      }
    }, 500);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (activeDrag) {
      var p = pos(e);
      activeDrag.moves.push({ x: p.x, y: p.y, t: bootNow() });
    }
  });
  function endPointer() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (activeDrag) { activeDrag.end = bootNow(); activeDrag = null; }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---- time base: frame one is exactly t = 0 ----
  var startMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var bootT = 0;
  function bootNow() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - startMs) / 1000;
    return bootT;
  }

  // ---- drawing helpers (flat shapes only; moveTo before every batched arc) ----
  function dot(x, y, r, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function rrPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function dashedLine(x1, y1, x2, y2, dash, gap, col, lw) {
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    var n = Math.floor(len / (dash + gap));
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var t0 = (i * (dash + gap)) / len, t1 = Math.min(t0 + dash / len, 1);
      ctx.moveTo(x1 + dx * t0, y1 + dy * t0);
      ctx.lineTo(x1 + dx * t1, y1 + dy * t1);
    }
    ctx.stroke();
  }

  // ---- suitcase (3/4 view): front face + side face, latches, seams ----
  function drawSuitcase(L) {
    var x = L.x, y = L.y, w = L.cw, h = L.ch, s = L.s;
    var side = w * 0.14;
    // side face (right, darker)
    ctx.fillStyle = LEATHER_D;
    ctx.beginPath();
    ctx.moveTo(x + w, y + h * 0.06);
    ctx.lineTo(x + w + side, y);
    ctx.lineTo(x + w + side, y + h * 0.94);
    ctx.lineTo(x + w, y + h);
    ctx.closePath(); ctx.fill();
    // front face
    ctx.fillStyle = LEATHER;
    rrPath(x, y, w, h, s * 0.03); ctx.fill();
    // scuffs (flat alpha marks)
    for (var i = 0; i < 14; i++) {
      var sx = x + rr(0.06, 0.94, 100 + i) * w;
      var sy = y + rr(0.08, 0.92, 200 + i) * h;
      ctx.fillStyle = 'rgba(232,223,200,' + (0.03 + hash(300 + i) * 0.05).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + rr(4, 22, 400 + i), sy + rr(-3, 3, 500 + i));
      ctx.lineTo(sx + rr(2, 10, 600 + i), sy + rr(2, 8, 700 + i));
      ctx.closePath(); ctx.fill();
    }
    // stitched seams (red dashes) near edges
    dashedLine(x + w * 0.04, y + h * 0.08, x + w * 0.04, y + h * 0.92, 7, 6, STITCH, Math.max(1.5, s * 0.002));
    dashedLine(x + w * 0.96, y + h * 0.08, x + w * 0.96, y + h * 0.92, 7, 6, STITCH, Math.max(1.5, s * 0.002));
    // handle on top
    ctx.strokeStyle = LEATHER_D; ctx.lineWidth = Math.max(3, s * 0.008);
    ctx.beginPath();
    ctx.moveTo(x + w * 0.38, y);
    ctx.lineTo(x + w * 0.38, y - h * 0.10);
    ctx.lineTo(x + w * 0.62, y - h * 0.10);
    ctx.lineTo(x + w * 0.62, y);
    ctx.stroke();
    // latches (amber) + latch seams
    var lw = w * 0.07, lh = h * 0.16;
    [0.24, 0.70].forEach(function (fx) {
      var lx = x + w * fx, ly = y + h * 0.02;
      ctx.fillStyle = AMBER;
      ctx.fillRect(lx, ly, lw, lh);
      ctx.fillStyle = LEATHER_D;
      ctx.fillRect(lx + lw * 0.3, ly + lh * 0.35, lw * 0.4, lh * 0.3);
    });
    // corner protectors
    ctx.fillStyle = AMBER;
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(function (c) {
      var px = c[0] ? x + w - w * 0.05 : x;
      var py = c[1] ? y + h - h * 0.08 : y;
      ctx.fillRect(px, py, w * 0.05, h * 0.08);
    });
    // side-face latch hint + vertical seam
    ctx.fillStyle = AMBER;
    ctx.fillRect(x + w + side * 0.3, y + h * 0.30, side * 0.4, h * 0.12);
    dashedLine(x + w + side * 0.5, y + h * 0.06, x + w + side * 0.5, y + h * 0.90, 6, 5, STITCH, Math.max(1.5, s * 0.002));
  }

  // ---- paper skin, phase-specific, clipped to a skin region ----
  function skinRegion(L, tight, slack) {
    var pad = L.s * 0.045 * (1 - tight * 0.55) + slack;
    return { x: L.x - pad, y: L.y - pad, w: L.cw + pad * 2, h: L.ch + pad * 2 };
  }
  function drawSkin(L, ph, tight, t) {
    var R = skinRegion(L, tight, 0);
    var s = L.s;
    ctx.save();
    rrPath(R.x, R.y, R.w, R.h, s * 0.035);
    ctx.clip();
    if (ph.name === 'soak') {
      // translucent slack sheet, wavy slack bottom edge
      ctx.fillStyle = 'rgba(232,223,200,0.42)';
      ctx.beginPath();
      ctx.moveTo(R.x, R.y);
      ctx.lineTo(R.x + R.w, R.y);
      ctx.lineTo(R.x + R.w, R.y + R.h * 0.86);
      for (var i = 8; i >= 0; i--) {
        var fx = R.x + (i / 8) * R.w;
        var fy = R.y + R.h * (0.86 + Math.sin(i * 1.7 + ph.p * 2) * 0.05 + ph.p * 0.04);
        ctx.lineTo(fx, fy);
      }
      ctx.closePath(); ctx.fill();
      // slack wrinkles: long soft lines
      ctx.strokeStyle = 'rgba(176,122,46,0.25)'; ctx.lineWidth = Math.max(1, s * 0.002);
      for (var j = 0; j < 7; j++) {
        var wy = R.y + R.h * (0.15 + j * 0.12);
        ctx.beginPath();
        ctx.moveTo(R.x + R.w * 0.05, wy);
        for (var k = 1; k <= 8; k++) {
          ctx.lineTo(R.x + R.w * (0.05 + k * 0.11), wy + Math.sin(k * 1.3 + j + ph.p * 3) * s * 0.012);
        }
        ctx.stroke();
      }
    } else if (ph.name === 'beat') {
      ctx.fillStyle = 'rgba(232,223,200,0.58)';
      ctx.fillRect(R.x, R.y, R.w, R.h);
      // violent noise ripples: expanding arcs from seeded beat points
      for (var b = 0; b < 3; b++) {
        var bx = R.x + rr(0.2, 0.8, 1000 + b) * R.w;
        var by = R.y + rr(0.25, 0.75, 2000 + b) * R.h;
        for (var ring = 0; ring < 5; ring++) {
          var rad = (ph.p * 1.6 + ring * 0.22) * s * 0.09 * (1 + hash(3000 + b * 10 + ring) * 0.4);
          ctx.strokeStyle = 'rgba(60,50,38,' + (0.35 - ring * 0.05).toFixed(3) + ')';
          ctx.lineWidth = Math.max(1, s * 0.002);
          ctx.beginPath();
          ctx.moveTo(bx + rad, by);
          ctx.arc(bx, by, rad, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      // jagged displacement ticks along the skin edge
      ctx.strokeStyle = 'rgba(60,50,38,0.4)'; ctx.lineWidth = Math.max(1, s * 0.002);
      ctx.beginPath();
      for (var e = 0; e < 26; e++) {
        var ex = R.x + (e / 25) * R.w;
        var ey = R.y + (hash(4000 + e) - 0.5) * s * 0.03;
        if (e === 0) ctx.moveTo(ex, ey); else ctx.lineTo(ex, ey);
      }
      ctx.stroke();
    } else if (ph.name === 'crumple') {
      ctx.fillStyle = 'rgba(232,223,200,0.70)';
      ctx.fillRect(R.x, R.y, R.w, R.h);
      // sharp fold facets: alternating alpha polygons
      for (var f = 0; f < 22; f++) {
        var fx = R.x + rr(0.02, 0.95, 5000 + f) * R.w;
        var fy = R.y + rr(0.05, 0.9, 6000 + f) * R.h;
        var fw = rr(0.04, 0.16, 7000 + f) * R.w;
        var fh = rr(0.03, 0.12, 8000 + f) * R.h;
        var ang = hash(9000 + f) * Math.PI;
        ctx.fillStyle = f % 2 ? 'rgba(120,100,70,0.28)' : 'rgba(255,250,235,0.30)';
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(fx + Math.cos(ang) * fw, fy + Math.sin(ang) * fh);
        ctx.lineTo(fx + Math.cos(ang + 1.1) * fw * 0.7, fy + Math.sin(ang + 1.1) * fh * 0.7);
        ctx.closePath(); ctx.fill();
      }
      // hard fold lines
      ctx.strokeStyle = 'rgba(60,50,38,0.55)'; ctx.lineWidth = Math.max(1, s * 0.0025);
      for (var g = 0; g < 16; g++) {
        var gx = R.x + rr(0.05, 0.9, 10000 + g) * R.w;
        var gy = R.y + rr(0.05, 0.9, 11000 + g) * R.h;
        var gl = rr(0.05, 0.2, 12000 + g) * R.w;
        var ga = hash(13000 + g) * Math.PI;
        ctx.beginPath();
        ctx.moveTo(gx, gy);
        ctx.lineTo(gx + Math.cos(ga) * gl, gy + Math.sin(ga) * gl * 0.4);
        ctx.stroke();
      }
    } else if (ph.name === 'wring') {
      ctx.fillStyle = 'rgba(232,223,200,0.66)';
      ctx.fillRect(R.x, R.y, R.w, R.h);
      // twist: diagonal bands whose offset grows with phase progress
      var tw = ph.p * s * 0.10;
      ctx.save();
      ctx.beginPath(); ctx.rect(R.x, R.y, R.w, R.h); ctx.clip();
      for (var d = -4; d < 14; d++) {
        ctx.fillStyle = d % 2 ? 'rgba(120,100,70,0.20)' : 'rgba(255,250,235,0.16)';
        ctx.beginPath();
        var ox = R.x + d * s * 0.07 + tw;
        ctx.moveTo(ox, R.y + R.h);
        ctx.lineTo(ox + s * 0.10, R.y);
        ctx.lineTo(ox + s * 0.10 + s * 0.05, R.y);
        ctx.lineTo(ox + s * 0.05, R.y + R.h);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      // pulled corner triangles
      ctx.fillStyle = 'rgba(232,223,200,0.5)';
      ctx.beginPath();
      ctx.moveTo(R.x + R.w, R.y);
      ctx.lineTo(R.x + R.w + tw, R.y + R.h * 0.2);
      ctx.lineTo(R.x + R.w, R.y + R.h * 0.35);
      ctx.closePath(); ctx.fill();
    } else { // felt: tight hide-like skin, stippled, frottage
      var inset = L.s * 0.012 * (1 - tight * 0.5);
      ctx.fillStyle = 'rgba(232,223,200,0.86)';
      rrPath(R.x + inset, R.y + inset, R.w - inset * 2, R.h - inset * 2, s * 0.03);
      ctx.fill();
      // stipple texture (paired arcs with moveTo)
      for (var q = 0; q < 240; q++) {
        var qx = R.x + hash(20000 + q) * R.w;
        var qy = R.y + hash(21000 + q) * R.h;
        dot(qx, qy, Math.max(0.8, s * 0.0016), 'rgba(120,100,70,' + (0.10 + hash(22000 + q) * 0.18).toFixed(3) + ')');
      }
      // frottage: latches and seams press through the skin
      ctx.fillStyle = 'rgba(46,38,32,0.55)';
      [0.24, 0.70].forEach(function (fx) {
        var lx = L.x + L.cw * fx, ly = L.y + L.ch * 0.02;
        ctx.fillRect(lx, ly, L.cw * 0.07, L.ch * 0.16);
      });
      ctx.strokeStyle = 'rgba(160,58,46,0.45)'; ctx.lineWidth = Math.max(1, s * 0.002);
      ctx.beginPath();
      ctx.moveTo(L.x + L.cw * 0.04, L.y + L.ch * 0.08);
      ctx.lineTo(L.x + L.cw * 0.04, L.y + L.ch * 0.92);
      ctx.moveTo(L.x + L.cw * 0.96, L.y + L.ch * 0.08);
      ctx.lineTo(L.x + L.cw * 0.96, L.y + L.ch * 0.92);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- mist spray (closed-form fade over 2 s after each mist) ----
  function drawMist(t) {
    for (var i = 0; i < mists.length; i++) {
      var m = mists[i];
      var age = t - m.t;
      if (age < 0 || age > 2) continue;
      var a = 1 - age / 2;
      for (var d = 0; d < 26; d++) {
        var dx = m.x + (hash(30000 + i * 50 + d) - 0.5) * 90;
        var dy = m.y + (hash(31000 + i * 50 + d) - 0.5) * 90;
        dot(dx, dy, Math.max(0.8, L0 * 0.002), 'rgba(232,223,200,' + (0.5 * a).toFixed(3) + ')');
      }
    }
  }
  var L0 = 100;

  // ---- corner handle ----
  function drawHandle(L, tight) {
    var hx = L.x + L.cw, hy = L.y + L.ch;
    var pull = tight * L.s * 0.06;
    ctx.strokeStyle = AMBER; ctx.lineWidth = Math.max(2, L.s * 0.005);
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(hx + pull + L.s * 0.03, hy + pull);
    ctx.stroke();
    ctx.fillStyle = AMBER;
    ctx.beginPath();
    ctx.moveTo(hx + pull + L.s * 0.045, hy + pull);
    ctx.arc(hx + pull + L.s * 0.03, hy + pull, L.s * 0.016, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- main draw: frame one is exactly t = 0 ----
  function draw(t) {
    bootT = t;
    var L = layout();
    L0 = L.s;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    if (canvas.style) { canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; }
    // soft floor sheen band (flat alpha)
    ctx.fillStyle = 'rgba(176,122,46,0.06)';
    ctx.fillRect(0, L.y + L.ch + L.s * 0.02, W, H - (L.y + L.ch + L.s * 0.02));
    var eff = effectiveTime(t);
    var ph = phaseAt(eff);
    var tight = tightnessAt(t);
    drawSuitcase(L);
    drawSkin(L, ph, tight, t);
    drawHandle(L, tight);
    drawMist(t);
  }

  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    (function loop() {
      var t = bootNow();
      draw(t);
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
