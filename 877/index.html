<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lockdown Mixer</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.877 "Lockdown Mixer" - a circuit-bent dirty video mixer.
   The feed is abstract: drifting phosphor bands and a pulsing circle.
   The breakage is the subject: hold slip, sync roll, chroma smear, tears.
   The mixer dirties itself again, always. Clean is the exception. */

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var COL = {
  black: '#050505',
  green: '#33FF66',
  amber: '#FFB000',
  magenta: '#FF2E88',
  white: '#E8E8E0'
};

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(87738);

/* ---------- seeded value-noise lattice ---------- */
var LAT = [];
for (var li = 0; li < 256; li++) LAT.push(rng());
function lat(i) { return LAT[((i % 256) + 256) % 256]; }
function smooth(f) { return f * f * (3 - 2 * f); }
function vnoise1(x) {
  var i = Math.floor(x), f = x - i;
  return lat(i) + (lat(i + 1) - lat(i)) * smooth(f);
}
function vnoise2(x, y) {
  var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  var a = lat(ix + iy * 57), b = lat(ix + 1 + iy * 57);
  var c = lat(ix + (iy + 1) * 57), d = lat(ix + 1 + (iy + 1) * 57);
  var ux = smooth(fx), uy = smooth(fy);
  return (a + (b - a) * ux) + ((c + (d - c) * ux) - (a + (b - a) * ux)) * uy;
}

/* ---------- viewport / sizing ---------- */
var W = 720, H = 720, PHONE = false;
function computeSize() {
  var w = 0, h = 0;
  if (typeof window !== 'undefined' && window.visualViewport) {
    w = window.visualViewport.width; h = window.visualViewport.height;
  }
  if (!w || !h) { w = window.innerWidth || 720; h = window.innerHeight || 720; }
  W = Math.max(50, Math.round(w)); H = Math.max(50, Math.round(h));
  var sw = 9999, sh = 9999;
  if (window.screen) { sw = window.screen.width || 9999; sh = window.screen.height || 9999; }
  PHONE = (Math.min(sw, sh) < 700) || (H > W * 1.15);
  canvas.width = W; canvas.height = H;
}
function onResize() { computeSize(); }
if (typeof window !== 'undefined') {
  window.addEventListener('resize', onResize);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
}
computeSize();

/* ---------- the feed: bands + pulsing circle (analytic, H-periodic) ---------- */
var BANDS = [];
(function buildBands() {
  var cols = [COL.green, COL.amber];
  var y = -0.04;
  for (var i = 0; i < 10; i++) {
    var bh = 0.05 + rng() * 0.11;
    BANDS.push({
      y0: y,
      h: bh,
      color: cols[i % 2],
      alpha: 0.22 + rng() * 0.5,
      speed: (rng() - 0.5) * 0.016,
      swayAmp: 0.004 + rng() * 0.01,
      swayPh: rng() * 6.2832
    });
    y += bh + 0.02 + rng() * 0.075;
  }
})();
function bandY(b, t) {
  var y = b.y0 + b.speed * t + b.swayAmp * Math.sin(t * 0.3 + b.swayPh);
  y = y % 1; if (y < 0) y += 1;
  return y;
}
/* Draw the whole feed in local coords; feed repeats every H vertically. */
function drawFeed(t, magentaPass, smearAlpha) {
  var i, b, yy, k;
  for (i = 0; i < BANDS.length; i++) {
    b = BANDS[i];
    if (magentaPass && b.alpha < 0.45) continue; /* chroma only from hot signal */
    yy = bandY(b, t) * H;
    ctx.globalAlpha = magentaPass ? smearAlpha : b.alpha;
    ctx.fillStyle = magentaPass ? COL.magenta : b.color;
    for (k = -1; k <= 1; k++) {
      ctx.fillRect(-0.4 * W, yy + k * H, 1.8 * W, b.h * H);
    }
  }
  /* pulsing circle at center */
  var cx = W * 0.5, cy = H * 0.46;
  var R = Math.min(W, H) * 0.16 * (1 + 0.07 * Math.sin(t * 1.7));
  for (k = -1; k <= 1; k++) {
    var cyy = cy + k * H;
    ctx.beginPath();
    ctx.arc(cx, cyy, R, 0, 6.2832);
    if (magentaPass) {
      ctx.globalAlpha = smearAlpha;
      ctx.strokeStyle = COL.magenta;
      ctx.lineWidth = Math.max(2, R * 0.16);
      ctx.stroke();
    } else {
      ctx.globalAlpha = 0.42;
      ctx.fillStyle = COL.green;
      ctx.fill();
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = COL.amber;
      ctx.lineWidth = Math.max(1.5, R * 0.07);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------- the dirt: autonomous schedule + recorded events ---------- */
/* events: {kind:'slap'|'loss'|'release', t, dx, dy} */
var events = [];
var drag = null; /* live drag state while pointer is down */

function dirtLevel(t) {
  var d = 0.16 + 0.62 * vnoise1(t * 0.045 + 3.1);
  for (var i = 0; i < events.length; i++) {
    var e = events[i];
    if (e.kind === 'slap' && t >= e.t) d += 0.25 * Math.exp(-(t - e.t) / 1.4);
    if (e.kind === 'loss' && t >= e.t) d += 0.35 * Math.exp(-(t - e.t) / 3.0);
  }
  if (drag) d += 0.22;
  return Math.max(0.05, Math.min(1, d));
}
/* sync-loss roll: one event rolls the frame free for ~5 s, then crashes to lock */
function lossRoll(t, u) {
  var total = 0;
  for (var i = 0; i < events.length; i++) {
    var e = events[i];
    if (e.kind !== 'loss' || t < e.t) continue;
    var rate = H * 0.55; /* px per second of free roll */
    var dur = 5;
    var dt = t - e.t;
    var rolled;
    if (dt <= dur) {
      var p = dt / dur;
      var ease = p * p * (3 - 2 * p);
      rolled = rate * dur * (0.25 * p + 0.75 * ease * p); /* eased travel */
      rolled = rate * dur * p * (0.3 + 0.7 * ease);
    } else {
      rolled = rate * dur;
      var nearest = Math.round(rolled / H) * H;
      var back = 1 - Math.exp(-(dt - dur) / 0.35);
      rolled = rolled + (nearest - rolled) * back;
    }
    total += rolled;
  }
  return total;
}
function inLoss(t) {
  for (var i = 0; i < events.length; i++) {
    var e = events[i];
    if (e.kind === 'loss' && t >= e.t && t < e.t + 5) return true;
  }
  return false;
}
/* seeded tear schedule: first tear is live at t=0 near the top */
var TEARS = [];
(function buildTears() {
  TEARS.push({ t: -0.25, dur: 1.5, y: 0.14, dir: 1 });
  var tt = 1.4;
  for (var i = 0; i < 400; i++) {
    tt += 2.2 + rng() * 4.3;
    TEARS.push({ t: tt, dur: 0.35 + rng() * 0.75, y: 0.05 + rng() * 0.9, dir: rng() < 0.5 ? -1 : 1 });
  }
})();

/* ---------- audio: the mixer's electrical voice (lazy, gesture-only) ---------- */
var AC = null, noiseFilter = null, noiseGain = null;
function ensureAudio() {
  if (AC) { if (AC.resume) { try { AC.resume(); } catch (e) {} } return; }
  if (typeof window === 'undefined') return;
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  try {
    AC = new Ctor();
    var master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
    /* CRT whine ~15.7 kHz, very quiet */
    var whine = AC.createOscillator(); whine.type = 'sine'; whine.frequency.value = 15680;
    var wg = AC.createGain(); wg.gain.value = 0.0035;
    whine.connect(wg); wg.connect(master); whine.start();
    /* soft mains buzz */
    var buzz = AC.createOscillator(); buzz.type = 'sine'; buzz.frequency.value = 60;
    var bg = AC.createGain(); bg.gain.value = 0.005;
    buzz.connect(bg); bg.connect(master); buzz.start();
    var buzz2 = AC.createOscillator(); buzz2.type = 'sine'; buzz2.frequency.value = 120;
    var bg2 = AC.createGain(); bg2.gain.value = 0.0022;
    buzz2.connect(bg2); bg2.connect(master); buzz2.start();
    /* bend noise */
    var len = 2 * AC.sampleRate;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var data = buf.getChannelData(0);
    var nr = mulberry32(4242);
    for (var i = 0; i < len; i++) data[i] = nr() * 2 - 1;
    var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    noiseFilter = AC.createBiquadFilter(); noiseFilter.type = 'lowpass';
    noiseFilter.frequency.value = 700; noiseFilter.Q.value = 0.6;
    noiseGain = AC.createGain(); noiseGain.gain.value = 0.03;
    src.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(master);
    src.start();
  } catch (e) { AC = null; }
}
function thump() {
  if (!AC) return;
  try {
    var o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = 64;
    var g = AC.createGain();
    var now = AC.currentTime;
    g.gain.setValueAtTime(0.22, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    o.connect(g); g.connect(AC.destination);
    o.start(now); o.stop(now + 0.4);
  } catch (e) {}
}

/* ---------- pointer interaction ---------- */
var nowT = 0; /* piece clock, seconds */
var downInfo = null;
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
function pieceXY(ev) {
  var r = { left: 0, top: 0 };
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var x = (ev.clientX || 0) - r.left, y = (ev.clientY || 0) - r.top;
  return { x: x, y: y };
}
canvas.addEventListener('pointerdown', function (ev) {
  ensureAudio();
  var p = pieceXY(ev);
  drag = { x0: p.x, y0: p.y, dx: 0, dy: 0, speed: 0, lastX: p.x, lastY: p.y, lastT: nowT };
  downInfo = { x: p.x, y: p.y, t: nowT };
  if (canvas.setPointerCapture && ev.pointerId !== undefined) {
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
  }
});
canvas.addEventListener('pointermove', function (ev) {
  if (!drag) return;
  var p = pieceXY(ev);
  var ddx = p.x - drag.lastX, ddy = p.y - drag.lastY;
  drag.dx += ddx; drag.dy += ddy;
  var dt = Math.max(0.001, nowT - drag.lastT);
  drag.speed = 0.75 * drag.speed + 0.25 * (Math.sqrt(ddx * ddx + ddy * ddy) / dt);
  drag.lastX = p.x; drag.lastY = p.y; drag.lastT = nowT;
});
function endPointer(ev) {
  if (downInfo) {
    var p = pieceXY(ev);
    var moved = Math.sqrt(Math.pow(p.x - downInfo.x, 2) + Math.pow(p.y - downInfo.y, 2));
    var quick = (nowT - downInfo.t) < 0.3;
    if (quick && moved < 12) {
      /* tap or double-tap */
      if (nowT - lastTapT < 0.38 && Math.abs(p.x - lastTapX) < 40 && Math.abs(p.y - lastTapY) < 40) {
        events.push({ kind: 'loss', t: nowT });
        lastTapT = -10;
      } else {
        events.push({ kind: 'slap', t: nowT });
        lastTapT = nowT; lastTapX = p.x; lastTapY = p.y;
      }
    }
  }
  if (drag) {
    events.push({ kind: 'release', t: nowT, dx: drag.dx, dy: drag.dy });
    drag = null;
  }
  downInfo = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- draw ---------- */
function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var u = Math.min(W, H) / 720; if (u <= 0) u = 1;
  var D = dirtLevel(t);
  var i, e;

  /* drag-derived offsets (live + decaying releases), closed form in events */
  var dragSlip = 0, dragRoll = 0, dragAct = 0;
  if (drag) { dragSlip = drag.dx * 0.6; dragRoll = drag.dy * 0.8; dragAct = Math.min(1, drag.speed / 900); }
  for (i = 0; i < events.length; i++) {
    e = events[i];
    if (e.kind === 'release' && t >= e.t) {
      var k = Math.exp(-(t - e.t) / 1.5);
      dragSlip += e.dx * 0.6 * k;
      dragRoll += e.dy * 0.8 * k;
    }
  }
  var smearBoost = 0;
  for (i = 0; i < events.length; i++) {
    e = events[i];
    if (e.kind === 'slap' && t >= e.t) smearBoost += Math.exp(-(t - e.t) / 0.7);
  }
  var smear = Math.min(1.6, 0.25 + 0.75 * D + smearBoost);

  /* roll: idle drift + drag + sync-loss travel */
  var roll = D * D * 14 * u * Math.sin(t * 0.13) + dragRoll + lossRoll(t, u);
  roll = ((roll % H) + H) % H;

  var slipAmp = (14 + 130 * D * D) * u + Math.abs(dragSlip);
  var SLICES = PHONE ? 40 : 48;
  var sh = H / SLICES;

  ctx.fillStyle = COL.black;
  ctx.fillRect(0, 0, W, H);

  /* sliced feed with per-group hold slip */
  for (i = 0; i < SLICES; i++) {
    var g = Math.floor(i / 5);
    var goff = slipAmp * (vnoise2(g * 1.93 + 7.7, t * 0.22) - 0.5) * 2 + dragSlip;
    var sy = i * sh;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, sy, W, sh + 1); ctx.clip();
    ctx.translate(goff, roll);
    drawFeed(t, false, 0);
    ctx.restore();
    /* chroma smear: hot signal redrawn in magenta at small offsets, additive */
    if (smear > 0.03) {
      var smx = (2 + 9 * smear) * u;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath(); ctx.rect(0, sy, W, sh + 1); ctx.clip();
      ctx.translate(goff + smx, roll);
      drawFeed(t, true, 0.16 * smear);
      ctx.translate(-2 * smx, 0);
      drawFeed(t, true, 0.11 * smear);
      ctx.restore();
    }
  }

  /* tear line: a thin band of the feed displaced hard, edged in sync white */
  for (i = 0; i < TEARS.length; i++) {
    var tr = TEARS[i];
    if (t < tr.t || t > tr.t + tr.dur) continue;
    var pr = (t - tr.t) / tr.dur;
    var strength = Math.sin(Math.PI * pr);
    var ty = tr.y * H;
    var th = Math.max(3, 7 * u);
    var tshift = tr.dir * (90 + 130 * D) * u * strength;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, ty, W, th); ctx.clip();
    ctx.translate(tshift, roll);
    drawFeed(t, false, 0);
    ctx.restore();
    ctx.globalAlpha = 0.85 * strength;
    ctx.fillStyle = COL.white;
    ctx.fillRect(0, ty, W, Math.max(1.2, 1.6 * u));
    ctx.globalAlpha = 1;
  }

  /* scanlines: deterministic overlay pattern */
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#000000';
  for (var yy2 = 1; yy2 < H; yy2 += 3) ctx.fillRect(0, yy2, W, 1);
  ctx.globalAlpha = 1;

  /* vignette: layered flat-alpha dark rects toward the edges and corners */
  ctx.fillStyle = '#000000';
  var step = Math.min(W, H) * 0.022;
  for (i = 0; i < 8; i++) {
    ctx.globalAlpha = 0.05;
    var inset = i * step;
    ctx.fillRect(0, inset, W, step);
    ctx.fillRect(0, H - inset - step, W, step);
    ctx.fillRect(inset, 0, step, H);
    ctx.fillRect(W - inset - step, 0, step, H);
  }
  ctx.globalAlpha = 0.07;
  var cw = W * 0.3, chh = H * 0.3;
  ctx.fillRect(0, 0, cw, chh); ctx.fillRect(W - cw, 0, cw, chh);
  ctx.fillRect(0, H - chh, cw, chh); ctx.fillRect(W - cw, H - chh, cw, chh);
  ctx.globalAlpha = 1;

  /* audio follows the same dirt state */
  if (AC && noiseFilter && noiseGain) {
    try {
      noiseFilter.frequency.value = 350 + 2400 * dragAct + 900 * D;
      noiseGain.gain.value = 0.02 + 0.05 * D + 0.03 * dragAct;
    } catch (e2) {}
  }
  /* re-lock thump: watch the loss window close */
  var il = inLoss(t);
  if (draw._wasLoss && !il) thump();
  draw._wasLoss = il;
}

/* ---------- main loop ---------- */
draw(0);
var clockStart = null, frameCount = 0;
function nowSeconds() {
  if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
  return frameCount / 60; /* frame-counter fallback clock; frame one is draw(0) regardless */
}
if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    frameCount++;
    if (clockStart === null) clockStart = nowSeconds();
    nowT = nowSeconds() - clockStart;
    draw(nowT);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
