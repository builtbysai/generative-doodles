<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marea Roja</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0D1517; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.687 "Marea Roja" (EXPANSION #83 lachimuchina, block 7).
  // A red tide bloom on a dark sea: thousands of tiny plankton dots
  // held in slow gyres, clustering into swirling patches that grow,
  // glow, dim and disperse on a sixty-second master cycle, all of
  // them breathing together on a twenty-second pulse. Planktonic
  // and luminous, never a wound: no fish, no boats, no horizon,
  // no text. Watch-only; dragging stirs the water, the cells
  // scatter, and the bloom reforms around the disturbance.

  var DEEP  = '#7A1F14';  // bloom deep
  var RED   = '#C8321E';  // bloom red
  var EMBER = '#E0602A';  // bloom ember
  var GLOW  = '#F2A35E';  // bloom glow
  var SEA   = '#0D1517';  // sea night / page ground
  var DEPTH = '#16211F';  // sea depth

  var BASE_SEED = 687001;
  var CYCLE = 60;         // master bloom cycle, seconds
  var OFFSET = 21;        // loop anchor: t=0 sits at cycle u=0.35
  var NGYRES = 7;
  var NMAIN = 2900;       // gyre-bound cells
  var NDRIFT = 300;       // free drifters
  var N = NMAIN + NDRIFT;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  var TAU = Math.PI * 2;

  // ------------------------------------------------------------------
  // BLOOM CYCLE. Envelope keyframes over the cycle phase u: seeding,
  // growth, peak glow, dispersal, dark water. First and last values
  // match so the loop is seamless. A twenty-second breath (three
  // per cycle) pulses every patch together. The spread factor pulls
  // cells toward the gyre cores while the bloom gathers and lets
  // them drift wide as it disperses; it is a pure sine over the
  // cycle, so it is periodic by construction.
  // ------------------------------------------------------------------
  var E_KEYS = [
    [0.00, 0.12], [0.15, 0.35], [0.45, 0.95], [0.52, 1.00],
    [0.62, 0.92], [0.85, 0.15], [1.00, 0.12]
  ];
  function keyLerp(keys, u) {
    for (var i = 0; i < keys.length - 1; i++) {
      var a = keys[i], b = keys[i + 1];
      if (u >= a[0] && u <= b[0]) {
        var f = clamp((u - a[0]) / (b[0] - a[0]), 0, 1);
        f = f * f * (3 - 2 * f);
        return lerp(a[1], b[1], f);
      }
    }
    return keys[keys.length - 1][1];
  }
  function envelope(u) { return keyLerp(E_KEYS, u); }
  function spread(u) { return 1 + 0.30 * Math.sin(TAU * (u - 0.50)); }
  function breath(tc) { return 0.78 + 0.22 * Math.sin(TAU * tc / 20); }

  // ------------------------------------------------------------------
  // FIELD LAYOUT. Field space is isotropic: one unit is the smaller
  // viewport dimension, and the field rectangle covers the whole
  // viewport, so the sea is full-bleed at any aspect. Gyre centers
  // are seeded fractions of the field rectangle with a minimum
  // separation, so the layout is a deterministic function of the
  // aspect and rebuilds identically on resize.
  // ------------------------------------------------------------------
  var FW = 0, FH = 0;
  var gyres = [];
  function buildGyres() {
    gyres = [];
    var rnd = mulberry32(BASE_SEED + 11);
    var tries = 0;
    while (gyres.length < NGYRES && tries < 400) {
      tries++;
      var cx = (0.10 + 0.80 * rnd()) * FW;
      var cy = (0.10 + 0.80 * rnd()) * FH;
      var ok = true;
      for (var i = 0; i < gyres.length; i++) {
        var dx = cx - gyres[i].cx, dy = cy - gyres[i].cy;
        if (dx * dx + dy * dy < 0.44 * 0.44) { ok = false; break; }
      }
      if (!ok) continue;
      gyres.push({
        cx: cx, cy: cy,
        R: 0.17 + 0.13 * rnd(),
        dir: rnd() < 0.5 ? -1 : 1,
        revs: 2 + Math.floor(rnd() * 2),       // whole turns per cycle
        act: 0.85 + 0.15 * rnd()               // per-gyre light level
      });
    }
  }

  // ------------------------------------------------------------------
  // CELLS. Every position is a closed-form function of the cycle
  // time tc. A cell orbits its gyre: the angular speed is a whole
  // number of revolutions per cycle, larger toward the core, so
  // the patch shears into a swirl and every orbit closes exactly
  // at the cycle wrap. Radius breathes on whole-cycle frequencies
  // and a small epicycle wobbles the path. A seeded vigor sets the
  // envelope threshold at which the cell appears and fades, which
  // is what makes patches grow and disperse instead of merely
  // dimming. Drifters ride slow Lissajous paths, whole-cycle
  // frequencies again, and stay dim.
  // ------------------------------------------------------------------
  var cells = [];
  function buildCells() {
    cells = [];
    var rnd = mulberry32(BASE_SEED + 101);
    var weights = [], wsum = 0, i, g;
    for (g = 0; g < gyres.length; g++) {
      var w = gyres[g].R * gyres[g].R;
      weights.push(w); wsum += w;
    }
    function pickGyre() {
      var r = rnd() * wsum;
      for (var j = 0; j < weights.length; j++) { r -= weights[j]; if (r <= 0) return j; }
      return weights.length - 1;
    }
    for (i = 0; i < NMAIN; i++) {
      g = pickGyre();
      var G = gyres[g];
      var core = rnd() < 0.55;
      var frac = core ? Math.pow(rnd(), 1.6) * 0.55 : 0.40 + 0.60 * Math.pow(rnd(), 0.7);
      var r0 = G.R * frac;
      var speedF = 1.20 - 0.60 * frac;
      var revs = Math.max(1, Math.round(G.revs * speedF * (0.85 + 0.30 * rnd())));
      cells.push({
        gyre: g,
        r0: r0,
        th0: rnd() * TAU,
        revs: revs * G.dir,
        radFreq: 1 + Math.floor(rnd() * 3),
        radPhase: rnd() * TAU,
        radAmp: 0.05 + 0.11 * rnd(),
        epiAmp: 0.004 + 0.009 * rnd(),
        epiFreq: 1 + Math.floor(rnd() * 4),
        epiPhase: rnd() * TAU,
        vigor: Math.pow(rnd(), 1.4),
        size: 0.8 + 0.5 * rnd()
      });
    }
    for (i = 0; i < NDRIFT; i++) {
      cells.push({
        gyre: -1,
        bx: rnd() * FW, by: rnd() * FH,
        ax: 0.02 + 0.05 * rnd(), ay: 0.02 + 0.05 * rnd(),
        fx: 1 + Math.floor(rnd() * 2), fy: 1 + Math.floor(rnd() * 2),
        px: rnd() * TAU, py: rnd() * TAU,
        vigor: Math.pow(rnd(), 1.8) * 0.8,
        size: 0.75 + 0.4 * rnd()
      });
    }
  }
  function buildField() { buildGyres(); buildCells(); }

  // Per-frame scratch for positions and light levels.
  var posX = new Float32Array(N), posY = new Float32Array(N);
  var lumA = new Float32Array(N), presA = new Float32Array(N), sizeA = new Float32Array(N);

  function computeCells(tc, u, E, B, S) {
    for (var i = 0; i < N; i++) {
      var c = cells[i];
      var th = (1 - c.vigor) * 0.82;
      var pres = smooth(th - 0.10, th + 0.10, E);
      presA[i] = pres;
      if (pres <= 0.003) { lumA[i] = 0; continue; }
      var x, y, dens, act;
      if (c.gyre >= 0) {
        var G = gyres[c.gyre];
        var r = c.r0 * S * (1 + c.radAmp * Math.sin(TAU * c.radFreq * tc / CYCLE + c.radPhase));
        var ang = c.th0 + TAU * c.revs * tc / CYCLE;
        var ca = Math.cos(ang), sa = Math.sin(ang);
        x = G.cx + r * ca + c.epiAmp * Math.cos(TAU * c.epiFreq * tc / CYCLE + c.epiPhase);
        y = G.cy + r * sa + c.epiAmp * Math.sin(TAU * c.epiFreq * tc / CYCLE + c.epiPhase * 1.7);
        var q = r / (0.60 * G.R);
        dens = Math.exp(-q * q);
        act = G.act;
      } else {
        x = c.bx + c.ax * Math.sin(TAU * c.fx * tc / CYCLE + c.px);
        y = c.by + c.ay * Math.sin(TAU * c.fy * tc / CYCLE + c.py);
        dens = 0.30;
        act = 0.55;
      }
      posX[i] = x; posY[i] = y;
      lumA[i] = clamp(act * dens * (0.35 + 0.65 * B) * (0.45 + 0.55 * c.vigor), 0, 1);
      sizeA[i] = c.size;
    }
  }

  // ------------------------------------------------------------------
  // STIRS. A drag records stir points with anchored elapsed times.
  // A stir displaces nearby cells radially with a tangential lean;
  // the displacement envelope rises and falls over five seconds,
  // so the cells return exactly to their gyre paths and the bloom
  // reforms around where the water was stirred.
  // ------------------------------------------------------------------
  var stirs = [];
  var lastStirT = -1, lastStirX = 0, lastStirY = 0;
  function addStir(fx, fy, t) {
    var dx = fx - lastStirX, dy = fy - lastStirY;
    if (t - lastStirT < 0.045 && dx * dx + dy * dy < 0.03 * 0.03) return;
    lastStirT = t; lastStirX = fx; lastStirY = fy;
    stirs.push({ x: fx, y: fy, t0: t });
    if (stirs.length > 18) stirs.splice(0, stirs.length - 18);
  }
  function stirOffset(x, y, t) {
    var ox = 0, oy = 0;
    for (var i = 0; i < stirs.length; i++) {
      var s = stirs[i];
      var age = t - s.t0;
      if (age < 0 || age > 5) continue;
      var env = Math.sin(Math.PI * age / 5);
      var dx = x - s.x, dy = y - s.y;
      var d2 = dx * dx + dy * dy;
      var fall = Math.exp(-d2 / (0.22 * 0.22));
      if (fall < 0.01) continue;
      var d = Math.sqrt(d2) || 1e-5;
      var rx = dx / d, ry = dy / d;
      var mag = env * 0.16 * fall;
      ox += (rx * 0.75 - ry * 0.45) * mag;
      oy += (ry * 0.75 + rx * 0.45) * mag;
    }
    return { x: ox, y: oy };
  }

  // ------------------------------------------------------------------
  // Canvas, sizing, house rules.
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var unit = 1;
  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    unit = Math.min(W, H);
    var nfw = W / unit, nfh = H / unit;
    if (Math.abs(nfw - FW) > 1e-6 || Math.abs(nfh - FH) > 1e-6) {
      FW = nfw; FH = nfh;
      buildField();
    }
  }

  // ------------------------------------------------------------------
  // Drawing. Brightness is carried by color tiers and alpha only:
  // deep, red, ember, glow, with a wide faint halo dot under the
  // brightest cells. No blur, no shadow, no gradient anywhere.
  // ------------------------------------------------------------------
  function drawDepth() {
    for (var i = 0; i < gyres.length; i++) {
      var G = gyres[i];
      ctx.fillStyle = DEPTH;
      var rings = [[1.50, 0.10], [1.15, 0.14], [0.80, 0.18]];
      for (var k = 0; k < rings.length; k++) {
        ctx.globalAlpha = rings[k][1];
        ctx.beginPath();
        ctx.arc(G.cx * unit, G.cy * unit, G.R * rings[k][0] * unit, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  function drawCells(t) {
    var dot = Math.max(1, 0.0016 * unit) * (isPhone ? 1.25 : 1);
    var tierCol = [DEEP, RED, EMBER, GLOW];
    for (var tier = 0; tier < 4; tier++) {
      ctx.fillStyle = tierCol[tier];
      for (var i = 0; i < N; i++) {
        var pres = presA[i];
        if (pres <= 0.003) continue;
        var lum = lumA[i];
        var ti = lum < 0.28 ? 0 : (lum < 0.55 ? 1 : (lum < 0.80 ? 2 : 3));
        if (ti !== tier) continue;
        var off = stirs.length ? stirOffset(posX[i], posY[i], t) : { x: 0, y: 0 };
        var X = (posX[i] + off.x) * unit;
        var Y = (posY[i] + off.y) * unit;
        var r = dot * sizeA[i] * (tier === 0 ? 0.9 : (tier === 1 ? 1.0 : (tier === 2 ? 1.15 : 1.3)));
        if (tier === 3) {
          ctx.globalAlpha = pres * 0.16;
          ctx.beginPath();
          ctx.arc(X, Y, r * 2.4, 0, TAU);
          ctx.fill();
          ctx.globalAlpha = pres * 0.95;
          ctx.beginPath();
          ctx.arc(X, Y, r, 0, TAU);
          ctx.fill();
        } else {
          var base = tier === 0 ? 0.35 : (tier === 1 ? 0.50 : 0.60);
          ctx.globalAlpha = pres * (base + (tier === 0 ? 0.40 : 0.45) * lum);
          ctx.beginPath();
          ctx.arc(X, Y, r, 0, TAU);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Interaction: drag stirs the water. Gestures are recorded with
  // anchored elapsed times; nothing here reloads or resets.
  // ------------------------------------------------------------------
  var dragging = false;
  function evtPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e && e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return null;
  }
  function stirFromEvent(e, force) {
    var pos = evtPos(e);
    if (!pos) return;
    if (force) { lastStirT = -1; }
    addStir(pos.x / unit, pos.y / unit, elapsed());
  }
  function onDown(e) { dragging = true; stirFromEvent(e, true); if (e && e.preventDefault) e.preventDefault(); }
  function onMove(e) { if (dragging) stirFromEvent(e, false); }
  function onUp() { dragging = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('touchstart', onDown);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onUp);
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  // ------------------------------------------------------------------
  // Clock and main draw. Frame one is an explicit synchronous draw
  // at t = 0, which the loop anchor places at cycle u = 0.35: a
  // developed bloom mid-rise, patches out and softly lit, the sea
  // still dark around them. Every position is a pure function of
  // the anchored elapsed time; nothing reads Date.now().
  // ------------------------------------------------------------------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - t0) / 1000;
    }
    return 0;
  }
  function draw(tOverride) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var t = (typeof tOverride === 'number') ? tOverride : elapsed();
    if (typeof tOverride !== 'number') {
      for (var i = stirs.length - 1; i >= 0; i--) {
        if (t - stirs[i].t0 > 5.5) stirs.splice(i, 1);
      }
    }
    var tc = (((t + OFFSET) % CYCLE) + CYCLE) % CYCLE;
    var u = tc / CYCLE;
    var E = envelope(u);
    var B = breath(tc);
    var S = spread(u);
    ctx.fillStyle = SEA;
    ctx.fillRect(0, 0, W, H);
    drawDepth();
    computeCells(tc, u, E, B, S);
    drawCells(t);
  }

  // QA hook: ?seed=t<seconds> forces a fixed elapsed time so later
  // stages of the cycle can be rendered headlessly.
  var forcedT = -1;
  try {
    var m = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(
      (typeof location !== 'undefined' && location.search) || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (err) { forcedT = -1; }

  resize();
  draw(forcedT >= 0 ? forcedT : 0);
  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
