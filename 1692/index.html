<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relief, 7KB</title>
<style>
html, body { margin: 0; padding: 0; background: #0D0B08; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0D0B08';
var BRONZE_LIT = '#8A5A33';
var BRONZE_SHADOW = '#2E1E10';
var STEEL_LIT = '#5A6672';
var STEEL_SHADOW = '#1B2126';
var LIGHT_WARM = '#FFF2DF';
var LIGHT_COOL = '#EAF2F8';
var PLATE = '#141210';
var PLATE_LINE = 'rgba(242,237,226,0.45)';
var TITLE_INK = '#F2EDE2';
var HINT_INK = '#F2EDE2';
var FIRST_T = 12;
/* DRIVER: a small dense SDF-style relief, lit like a Rodin bronze.
   A raking light moves slowly across a heightfield of merged
   Gaussian blobs and sharp crease ridges, throwing long soft shadows
   into the crevices. One blob merges into another every 20-30
   seconds by interpolating blob parameters; never a hard cut.
   Pure math, no textures, no models. Watch-only. */
var MORPH_PERIOD = 50;
var STEEL_PERIOD = 210, STEEL_LEN = 30;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Centered geometric piece: square frame on desktop, full-bleed on phones. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, s: s, w: s, h: s };
}
/* ---- blobs: two anchor sets, fixed seed 939 (PP939) ---- */
var rng = mulberry32(939);
function makeBlobs() {
  var arr = [], i;
  for (i = 0; i < 9; i++) {
    arr.push({
      x: (rng() - 0.5) * 0.62,
      y: (rng() - 0.5) * 0.62,
      r: 0.10 + rng() * 0.16,
      a: 0.55 + rng() * 0.45
    });
  }
  return arr;
}
var BLOBS_A = makeBlobs();
var BLOBS_B = makeBlobs();
var RIDGES = [
  { x: -0.18, y: 0.10, ang: 0.6, len: 0.55, w: 0.045, a: 0.42 },
  { x: 0.22, y: -0.16, ang: -0.9, len: 0.45, w: 0.035, a: 0.34 },
  { x: 0.02, y: 0.28, ang: 2.4, len: 0.40, w: 0.030, a: 0.30 }
];
/* Morph weight: 0 to 1 and back over 50 s, smooth, never a cut. */
function morphWeight(t) {
  return 0.5 - 0.5 * Math.cos(TAU * t / MORPH_PERIOD);
}
function steelAt(t) {
  return (((t % STEEL_PERIOD) + STEEL_PERIOD) % STEEL_PERIOD) >= (STEEL_PERIOD - STEEL_LEN);
}
/* Torn boundary radius as a function of angle. */
function edgeRadius(th) {
  return 0.4 * (1
    + 0.10 * Math.sin(3 * th + 1.3)
    + 0.06 * Math.sin(7 * th + 0.5)
    + 0.04 * Math.sin(11 * th + 2.1)
    + 0.02 * Math.sin(23 * th + 4.4));
}
/* Heightfield value and analytic gradient at (x, y), frame coords
   in [-0.5, 0.5]. w is the morph weight; ridgeAng is the slow
   ridge rotation. Returns [h, dhdx, dhdy]. */
function heightAt(x, y, w, ridgeAng) {
  var h = 0, gx = 0, gy = 0, i, b, cx, cy, r, a, dx, dy, e;
  for (i = 0; i < 9; i++) {
    b = BLOBS_A[i];
    var b2 = BLOBS_B[i];
    cx = b.x + (b2.x - b.x) * w;
    cy = b.y + (b2.y - b.y) * w;
    r = b.r + (b2.r - b.r) * w;
    a = b.a + (b2.a - b.a) * w;
    dx = x - cx; dy = y - cy;
    e = a * Math.exp(-(dx * dx + dy * dy) / (r * r));
    h += e;
    var k = -2 * e / (r * r);
    gx += k * dx;
    gy += k * dy;
  }
  for (i = 0; i < RIDGES.length; i++) {
    var rg = RIDGES[i];
    var ang = rg.ang + ridgeAng;
    var ca = Math.cos(ang), sa = Math.sin(ang);
    var rx = x - rg.x, ry = y - rg.y;
    var along = rx * ca + ry * sa;
    var perp = -rx * sa + ry * ca;
    var fall = Math.exp(-(along * along) / (rg.len * rg.len));
    var prof = Math.exp(-(perp * perp) / (rg.w * rg.w));
    e = rg.a * fall * prof;
    h += e;
    gx += e * (-2 * along / (rg.len * rg.len) * ca - 2 * perp / (rg.w * rg.w) * -sa);
    gy += e * (-2 * along / (rg.len * rg.len) * sa - 2 * perp / (rg.w * rg.w) * ca);
  }
  return [h, gx, gy];
}
var GRID = 240;
function drawRelief(t, fr) {
  var w = morphWeight(t);
  var ridgeAng = 0.18 * Math.sin(TAU * t / 170);
  /* Raking light: low elevation, azimuth drifting slowly. */
  var az = -2.2 + 0.55 * Math.sin(TAU * t / 90);
  var lx = Math.cos(az) * 0.92, ly = Math.sin(az) * 0.92, lz = 0.50;
  var ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
  lx /= ll; ly /= ll; lz /= ll;
  var steel = steelAt(t);
  var litC = steel ? hexRgb(STEEL_LIT) : hexRgb(BRONZE_LIT);
  var shC = steel ? hexRgb(STEEL_SHADOW) : hexRgb(BRONZE_SHADOW);
  var hiC = steel ? hexRgb(LIGHT_COOL) : hexRgb(LIGHT_WARM);
  var cell = fr.s / GRID;
  var i, j;
  for (j = 0; j < GRID; j++) {
    var y = (j + 0.5) / GRID - 0.5;
    for (i = 0; i < GRID; i++) {
      var x = (i + 0.5) / GRID - 0.5;
      var rr = Math.sqrt(x * x + y * y);
      if (rr > 0.55) continue;
      var th = Math.atan2(y, x);
      var edge = edgeRadius(th);
      var mask = clamp((edge - rr) / 0.02, 0, 1);
      if (mask <= 0) continue;
      var hv = heightAt(x, y, w, ridgeAng);
      var h = hv[0], gx = hv[1], gy = hv[2];
      /* Normal from the gradient; height is in frame units. */
      var nx = -gx, ny = -gy, nz = 1.0;
      var nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx /= nl; ny /= nl; nz /= nl;
      var diff = clamp(nx * lx + ny * ly + nz * lz, 0, 1);
      /* Soft shadow in the crevices: low ground darkens. A 0.30
         ambient floor keeps shadowed blob flanks readable. */
      var ao = clamp(0.55 + 0.45 * (h / 1.6), 0, 1);
      var f = (0.30 + 0.70 * diff) * ao;
      var r = shC[0] + (litC[0] - shC[0]) * f;
      var g = shC[1] + (litC[1] - shC[1]) * f;
      var b = shC[2] + (litC[2] - shC[2]) * f;
      var hl = Math.pow(diff, 3) * 0.35;
      r += (hiC[0] - r) * hl;
      g += (hiC[1] - g) * hl;
      b += (hiC[2] - b) * hl;
      ctx.fillStyle = 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
      if (mask < 1) ctx.globalAlpha = Number(mask.toFixed(4));
      ctx.fillRect(fr.x + i * cell, fr.y + j * cell, cell + 0.6, cell + 0.6);
      if (mask < 1) ctx.globalAlpha = 1;
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Relief, 7KB').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Relief, 7KB').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 30').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Relief, 7KB', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 30', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var fr = fieldRect();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawRelief(t, fr);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    morphWeight: function (t) { return morphWeight(t); },
    steelAt: function (t) { return steelAt(t); },
    blobCount: function () { return BLOBS_A.length; },
    ridgeCount: function () { return RIDGES.length; }
  };
}
/* ---- frame one: t = 12, mid-morph, raking light at a readable angle ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null, lastDrawn = -1;
draw(FIRST_T);
lastDrawn = FIRST_T;
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    /* Motion is slow by design; redraw at most every 0.08 s. */
    if (clockT - lastDrawn >= 0.08) {
      draw(clockT);
      lastDrawn = clockT;
    }
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
