<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>gains + losses (A Letter)</title>
<style>
  html, body { margin: 0; padding: 0; background: #E8E0CC; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- No.1230 "gains + losses (A Letter)" -- Leslie Supnet study block LS7 ----
  // After her 2011 letter film: a small ink figure walks an empty landscape
  // while fragments of an unfinished letter drift past at different depths.
  // The figure walks, pauses, sits. Vignettes from old drawings surface at
  // the frame edges and dissolve. Day and night alternate every 40 seconds.
  // Drag scrolls the world (the letter unscrolling) -- the walker keeps its
  // own pace regardless. Double-tap starts a new letter. No narration: the
  // text is the voice.

  var PAPER = [232, 224, 204];   // #E8E0CC
  var NIGHT = [26, 26, 34];      // #1A1A22
  var INK = [35, 32, 27];        // #23201B
  var BONE = [217, 210, 190];    // night ink
  var FADE = [106, 98, 88];      // #6A6258 drifting text, day
  var FADE_N = [167, 158, 140];  // bone-faded text, night
  var SCARF = '#A63A2E';

  var FRAGMENTS = [
    'respect their need for privacy',
    'i am writing this slowly',
    'the house is quiet in the mornings',
    'you would have laughed at the garden',
    'some things keep, some things go',
    'i kept the blue cup',
    'write back when you can',
    'the train still passes at six',
    'i am learning to leave space',
    'forgive the short letters',
    'the light here does something kind',
    'yours, still'
  ];
  // per-fragment staging: depth (parallax), y fraction, base position as a
  // fraction of the wrap span. Hand-set so frame one (T0 = 8s, day) holds
  // fragments 0, 1 and 2 in frame at three depths.
  var FDEPTH = [1.00, 0.80, 0.55, 0.90, 0.65, 1.00, 0.75, 0.55, 0.95, 0.70, 0.85, 0.60];
  var FYF = [0.30, 0.20, 0.52, 0.26, 0.48, 0.18, 0.36, 0.24, 0.44, 0.32, 0.13, 0.40];
  var FBASE = [0.5585, 0.4357, 0.6456, 0.0773, 0.8763, 0.2319, 0.7474, 0.3222, 0.9278, 0.1418, 0.5284, 0.8119];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;          // viewport CSS px
  var LW = 1280, LH = 800;   // logical drawing space
  var SCALE = 1;

  var T0 = 8;                // fixed first-frame phase (seconds, day, mid-walk)

  function isPhone(w, h) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return sw < 700 || h > w * 1.15;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function mixc(c1, c2, k) {
    return 'rgb(' + Math.round(lerp(c1[0], c2[0], k)) + ',' +
           Math.round(lerp(c1[1], c2[1], k)) + ',' +
           Math.round(lerp(c1[2], c2[2], k)) + ')';
  }

  // ---- deterministic integer hash -> [0,1) ----
  function ihash(n) {
    n = n | 0;
    n = Math.imul(n ^ (n >>> 16), 2246822507);
    n = Math.imul(n ^ (n >>> 13), 3266489909);
    n = n ^ (n >>> 16);
    return (n >>> 0) / 4294967296;
  }

  // ---- seeded rng (mulberry32), generation only ----
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(n, seed) {
    var r = rng(seed), a = [], i, j, tmp;
    for (i = 0; i < n; i++) a.push(i);
    for (i = n - 1; i > 0; i--) {
      j = (r() * (i + 1)) | 0; tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // 1-D value noise from the hash, for the hill lines
  function vnoise(wx, cell, seed) {
    var i = Math.floor(wx / cell), f = (wx - i * cell) / cell;
    var s = f * f * (3 - 2 * f);
    return lerp(ihash(i * 1013 + seed), ihash((i + 1) * 1013 + seed), s);
  }

  // ================= interaction state =================
  var dragOff = 0;           // visitor scroll, logical px (world units)
  var reseed = 0;            // double-tap count: a new letter
  var dragging = false, lastPX = 0;
  var downT = -10, downX = 0, downY = 0, lastTapT = -10, lastTapX = 0, lastTapY = 0;

  function nowSec() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return Date.now() / 1000;
  }

  function onDown(e) {
    dragging = true; lastPX = e.clientX;
    var t = nowSec();
    if (t - lastTapT < 0.32 && Math.abs(e.clientX - lastTapX) < 44 && Math.abs(e.clientY - lastTapY) < 44) {
      reseed++;              // double-tap: a new letter begins
      lastTapT = -10;
    } else {
      lastTapT = t; lastTapX = e.clientX; lastTapY = e.clientY;
    }
    downT = t; downX = e.clientX; downY = e.clientY;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    dragOff -= (e.clientX - lastPX) / SCALE;   // pull the world with the finger
    lastPX = e.clientX;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ================= the walk =================
  // Narrative cycle of 48s: walk 0-20, pause 20-26, sit 26-34, walk 34-48.
  var CYCLE = 48, WALK_SPEED = 26;   // logical px per second

  function walkSeconds(t) {
    var cycles = Math.floor(t / CYCLE), c = t - cycles * CYCLE;
    var within = c < 20 ? c : (c < 34 ? 20 : 20 + (c - 34));
    return cycles * 34 + within;
  }
  function walkDist(t) { return WALK_SPEED * walkSeconds(t); }

  function behavior(t) {
    var c = t % CYCLE;
    if (c < 20) return 'walk';
    if (c < 26) return 'pause';
    if (c < 34) return 'sit';
    return 'walk';
  }

  // day/night: alternate every 40s, 2s crossfade each way
  function nightK(t) {
    var p = t % 80;
    if (p < 38) return 0;
    if (p < 40) return (p - 38) / 2;
    if (p < 78) return 1;
    return 1 - (p - 78) / 2;
  }

  // ================= drawing helpers =================
  // jittered hand-drawn polyline; jitter re-hashed per 6fps step so lines boil
  function jline(pts, seed, step, color, width, alpha) {
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = width;
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var jx = (ihash(seed * 7919 + step * 131 + i * 17) - 0.5) * 2.2;
      var jy = (ihash(seed * 104729 + step * 197 + i * 29) - 0.5) * 2.2;
      if (i === 0) ctx.moveTo(pts[i][0] + jx, pts[i][1] + jy);
      else ctx.lineTo(pts[i][0] + jx, pts[i][1] + jy);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function jcircle(cx, cy, r, seed, step, color, width, alpha) {
    var pts = [];
    for (var i = 0; i <= 10; i++) {
      var a = (i / 10) * Math.PI * 2;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    jline(pts, seed, step, color, width, alpha);
  }

  // ================= vignettes =================
  // small ink sketches from old drawings: cup, train, garden gate,
  // window with light, empty chair. Drawn at (x, y) with size s.
  function drawVignette(kind, x, y, s, step, ink, alpha) {
    var u = s / 12;   // grid unit
    if (kind === 0) {            // the blue cup (drawn in ink; only the scarf is red)
      jline([[x, y + 3 * u], [x + 0.4 * u, y + 8.6 * u], [x + 7.6 * u, y + 8.6 * u], [x + 8 * u, y + 3 * u]], 501, step, ink, 2, alpha);
      jline([[x, y + 3 * u], [x + 8 * u, y + 3 * u]], 502, step, ink, 2, alpha);
      jline([[x + 8 * u, y + 4 * u], [x + 10.4 * u, y + 4.6 * u], [x + 10.2 * u, y + 7 * u], [x + 8 * u, y + 7.4 * u]], 503, step, ink, 2, alpha);
      jline([[x - 0.6 * u, y + 10.2 * u], [x + 8.6 * u, y + 10.2 * u]], 504, step, ink, 2, alpha);
      jline([[x + 3 * u, y + 1.8 * u], [x + 3.4 * u, y + 0.6 * u], [x + 3 * u, y - 0.4 * u]], 505, step, ink, 1.6, alpha * 0.7);
      jline([[x + 5 * u, y + 1.8 * u], [x + 5.4 * u, y + 0.6 * u], [x + 5 * u, y - 0.4 * u]], 506, step, ink, 1.6, alpha * 0.7);
    } else if (kind === 1) {     // the train that still passes at six
      jline([[x, y + 9 * u], [x, y + 3.4 * u], [x + 10 * u, y + 3.4 * u], [x + 10 * u, y + 9 * u], [x, y + 9 * u]], 511, step, ink, 2, alpha);
      jline([[x + 1 * u, y + 6.4 * u], [x + 9 * u, y + 6.4 * u]], 512, step, ink, 1.6, alpha);
      jline([[x + 1.6 * u, y + 5.4 * u], [x + 3 * u, y + 5.4 * u]], 513, step, ink, 1.6, alpha);
      jline([[x + 4.2 * u, y + 5.4 * u], [x + 5.6 * u, y + 5.4 * u]], 514, step, ink, 1.6, alpha);
      jline([[x + 6.8 * u, y + 5.4 * u], [x + 8.2 * u, y + 5.4 * u]], 515, step, ink, 1.6, alpha);
      jline([[x + 7.6 * u, y + 3.4 * u], [x + 7.6 * u, y + 1.8 * u], [x + 9 * u, y + 1.8 * u], [x + 9 * u, y + 3.4 * u]], 516, step, ink, 1.8, alpha);
      jcircle(x + 2.4 * u, y + 9.8 * u, 0.85 * u, 517, step, ink, 1.8, alpha);
      jcircle(x + 7.4 * u, y + 9.8 * u, 0.85 * u, 518, step, ink, 1.8, alpha);
      jline([[x - 0.8 * u, y + 11.2 * u], [x + 10.8 * u, y + 11.2 * u]], 519, step, ink, 1.6, alpha);
    } else if (kind === 2) {     // a garden gate
      jline([[x + 1 * u, y + 11 * u], [x + 1 * u, y + 1 * u]], 521, step, ink, 2.2, alpha);
      jline([[x + 9 * u, y + 11 * u], [x + 9 * u, y + 1 * u]], 522, step, ink, 2.2, alpha);
      jline([[x + 1 * u, y + 3.4 * u], [x + 5 * u, y + 1.2 * u], [x + 9 * u, y + 3.4 * u]], 523, step, ink, 2, alpha);
      jline([[x + 1 * u, y + 9.6 * u], [x + 9 * u, y + 9.6 * u]], 524, step, ink, 1.8, alpha);
      for (var p = 0; p < 4; p++) {
        jline([[x + (2.6 + p * 1.6) * u, y + 9.6 * u], [x + (2.6 + p * 1.6) * u, y + (3.4 - Math.abs(1.5 - p) * 0.5) * u]], 525 + p, step, ink, 1.5, alpha);
      }
      jcircle(x + 7.9 * u, y + 6.4 * u, 0.45 * u, 530, step, ink, 1.6, alpha);
    } else if (kind === 3) {     // a window with light
      jline([[x + 1.4 * u, y + 1 * u], [x + 8.6 * u, y + 1 * u], [x + 8.6 * u, y + 11 * u], [x + 1.4 * u, y + 11 * u], [x + 1.4 * u, y + 1 * u]], 531, step, ink, 2.2, alpha);
      jline([[x + 5 * u, y + 1 * u], [x + 5 * u, y + 11 * u]], 532, step, ink, 1.6, alpha);
      jline([[x + 1.4 * u, y + 6 * u], [x + 8.6 * u, y + 6 * u]], 533, step, ink, 1.6, alpha);
      jline([[x + 0.2 * u, y + 12 * u], [x + 9.8 * u, y + 12 * u]], 534, step, ink, 2, alpha);
      jline([[x + 2.6 * u, y + 4.6 * u], [x + 3.4 * u, y + 3.4 * u]], 535, step, ink, 1.4, alpha * 0.8);
      jline([[x + 7.4 * u, y + 4.6 * u], [x + 6.6 * u, y + 3.4 * u]], 536, step, ink, 1.4, alpha * 0.8);
    } else {                     // an empty chair
      jline([[x + 2.6 * u, y + 6.4 * u], [x + 2.6 * u, y + 0.8 * u]], 541, step, ink, 2.2, alpha);
      jline([[x + 2.6 * u, y + 3 * u], [x + 6.4 * u, y + 3 * u]], 542, step, ink, 1.8, alpha);
      jline([[x + 2.2 * u, y + 6.4 * u], [x + 8.6 * u, y + 6.4 * u]], 543, step, ink, 2.2, alpha);
      jline([[x + 2.8 * u, y + 6.4 * u], [x + 2.8 * u, y + 11.4 * u]], 544, step, ink, 2, alpha);
      jline([[x + 8.2 * u, y + 6.4 * u], [x + 8.2 * u, y + 11.4 * u]], 545, step, ink, 2, alpha);
      jline([[x + 2.8 * u, y + 9.4 * u], [x + 8.2 * u, y + 9.4 * u]], 546, step, ink, 1.5, alpha);
    }
  }

  // ================= sparse mid-ground marks =================
  function drawMark(kind, x, gy, s, step, ink, alpha) {
    if (kind === 0) {            // fence posts
      for (var p = 0; p < 3; p++) {
        jline([[x + p * s * 0.4, gy], [x + p * s * 0.4, gy - s * 0.34]], 601 + p, step, ink, 2, alpha);
      }
      jline([[x - s * 0.06, gy - s * 0.24], [x + s * 0.86, gy - s * 0.24]], 604, step, ink, 1.6, alpha);
    } else if (kind === 1) {     // a bare tree
      jline([[x, gy], [x + s * 0.03, gy - s * 0.62]], 611, step, ink, 2.4, alpha);
      jline([[x + s * 0.02, gy - s * 0.44], [x - s * 0.26, gy - s * 0.72]], 612, step, ink, 1.8, alpha);
      jline([[x + s * 0.02, gy - s * 0.5], [x + s * 0.3, gy - s * 0.8]], 613, step, ink, 1.8, alpha);
      jline([[x + s * 0.3, gy - s * 0.8], [x + s * 0.44, gy - s * 0.92]], 614, step, ink, 1.4, alpha);
      jline([[x - s * 0.26, gy - s * 0.72], [x - s * 0.4, gy - s * 0.84]], 615, step, ink, 1.4, alpha);
    } else {                     // a distant house outline
      jline([[x, gy], [x, gy - s * 0.4], [x + s * 0.85, gy - s * 0.4], [x + s * 0.85, gy]], 621, step, ink, 2, alpha);
      jline([[x - s * 0.1, gy - s * 0.4], [x + s * 0.42, gy - s * 0.66], [x + s * 0.95, gy - s * 0.4]], 622, step, ink, 2, alpha);
      jline([[x + s * 0.36, gy], [x + s * 0.36, gy - s * 0.24], [x + s * 0.52, gy - s * 0.24], [x + s * 0.52, gy]], 623, step, ink, 1.6, alpha);
    }
  }

  // ================= the figure =================
  function drawFigure(fx, gy, t, step, beh, ink) {
    var fh = LH / 8;                       // figure is 1/8 of frame height
    ctx.lineCap = 'round';
    var pose = Math.floor(t * 6) % 4;      // 6 fps walk cycle
    var wave = Math.floor(t * 6) % 3;      // scarf wave steps
    var hip, headC, neck;
    var scarfPts = [];
    ctx.strokeStyle = ink;

    if (beh === 'walk') {
      var bob = (pose % 2 === 0) ? 0 : -0.014 * fh;
      hip = [fx, gy - 0.52 * fh + bob];
      headC = [fx + 0.012 * fh, gy - 0.90 * fh + bob];
      neck = [fx + 0.006 * fh, gy - 0.80 * fh + bob];
      var ax = [0.20, 0.03, -0.20, -0.03][pose] * fh;
      var bx = [-0.18, -0.03, 0.18, 0.03][pose] * fh;
      var liftA = (pose === 1) ? 0.045 * fh : 0.008 * fh;
      var liftB = (pose === 3) ? 0.045 * fh : 0.008 * fh;
      jline([hip, [fx + ax, gy - liftA]], 701, step, ink, 2.6, 1);
      jline([hip, [fx + bx, gy - liftB]], 702, step, ink, 2.6, 1);
      jline([neck, [fx - ax * 0.62, gy - 0.44 * fh + bob]], 703, step, ink, 2.4, 1);   // arm swings against the legs
      var wob = [0, -0.028, 0.012][wave] * fh;
      scarfPts = [neck,
        [neck[0] - 0.15 * fh, neck[1] + 0.02 * fh + wob],
        [neck[0] - 0.29 * fh, neck[1] + 0.05 * fh - wob * 0.6]];
    } else if (beh === 'pause') {
      hip = [fx, gy - 0.52 * fh];
      headC = [fx, gy - 0.90 * fh];
      neck = [fx, gy - 0.80 * fh];
      jline([hip, [fx - 0.035 * fh, gy]], 704, step, ink, 2.6, 1);
      jline([hip, [fx + 0.035 * fh, gy]], 705, step, ink, 2.6, 1);
      jline([neck, [fx + 0.06 * fh, gy - 0.42 * fh]], 706, step, ink, 2.4, 1);
      scarfPts = [neck,
        [neck[0] - 0.09 * fh, neck[1] + 0.09 * fh],
        [neck[0] - 0.065 * fh, neck[1] + 0.19 * fh]];   // settled, hanging
    } else {   // sit
      hip = [fx, gy - 0.30 * fh];
      headC = [fx + 0.035 * fh, gy - 0.63 * fh];           // bowed a little
      neck = [fx + 0.02 * fh, gy - 0.545 * fh];
      jline([hip, [fx + 0.23 * fh, gy - 0.15 * fh], [fx + 0.06 * fh, gy - 0.012 * fh]], 707, step, ink, 2.6, 1);
      jline([hip, [fx + 0.17 * fh, gy - 0.13 * fh], [fx - 0.02 * fh, gy - 0.012 * fh]], 708, step, ink, 2.6, 1);
      jline([neck, [fx + 0.20 * fh, gy - 0.20 * fh]], 709, step, ink, 2.4, 1);        // hand resting toward the knee
      scarfPts = [neck,
        [neck[0] - 0.08 * fh, neck[1] + 0.08 * fh],
        [neck[0] - 0.05 * fh, neck[1] + 0.17 * fh]];
    }
    jline([neck, hip], 710, step, ink, 2.8, 1);            // torso
    jcircle(headC[0], headC[1], 0.088 * fh, 711, step, ink, 2.6, 1);
    // the one red thing in the world
    ctx.strokeStyle = SCARF;
    ctx.globalAlpha = 1;
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    for (var i = 0; i < scarfPts.length; i++) {
      var jx = (ihash(720 + step * 131 + i * 17) - 0.5) * 1.6;
      var jy = (ihash(721 + step * 197 + i * 29) - 0.5) * 1.6;
      if (i === 0) ctx.moveTo(scarfPts[i][0] + jx, scarfPts[i][1] + jy);
      else ctx.lineTo(scarfPts[i][0] + jx, scarfPts[i][1] + jy);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ================= main draw =================
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);

    var nk = nightK(t);
    var step = Math.floor(t * 6);
    var ink = mixc(INK, BONE, nk);
    var fade = mixc(FADE, FADE_N, nk);
    var worldX = walkDist(t) + dragOff;

    // paper / night ground
    ctx.fillStyle = mixc(PAPER, NIGHT, nk);
    ctx.fillRect(0, 0, LW, LH);

    // paper grain, boiling gently
    ctx.fillStyle = ink;
    for (var g = 0; g < 200; g++) {
      ctx.globalAlpha = 0.045;
      ctx.fillRect(ihash(g * 37 + step * 11) * LW, ihash(g * 91 + step * 23) * LH, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;

    // stars, only at night
    if (nk > 0.02) {
      ctx.fillStyle = '#D9D2BE';
      for (var s2 = 0; s2 < 46; s2++) {
        ctx.globalAlpha = nk * (0.25 + 0.65 * ihash(s2 * 57 + 900));
        ctx.fillRect(ihash(s2 * 57 + 901) * LW, ihash(s2 * 57 + 902) * LH * 0.4, 1.7, 1.7);
      }
      ctx.globalAlpha = 1;
    }

    var farY = 0.585 * LH, midY = 0.638 * LH, nearY = 0.688 * LH;

    // far hill line (parallax 0.25)
    var farPts = [];
    for (var x = -20; x <= LW + 20; x += 22) {
      var wx = x + worldX * 0.25;
      farPts.push([x, farY - vnoise(wx, 300, 41) * 0.055 * LH - vnoise(wx, 67, 97) * 0.013 * LH]);
    }
    jline(farPts, 801, step, ink, 1.8, 0.75);

    // mid ground line + sparse marks (parallax 0.55)
    var midPts = [];
    for (var x2 = -20; x2 <= LW + 20; x2 += 26) {
      var wx2 = x2 + worldX * 0.55;
      midPts.push([x2, midY - vnoise(wx2, 210, 131) * 0.012 * LH]);
    }
    jline(midPts, 802, step, ink, 2, 0.9);
    var cell = 320;
    var c0 = Math.floor((worldX * 0.55 - 200) / cell), c1 = Math.floor((worldX * 0.55 + LW + 200) / cell);
    for (var ci = c0; ci <= c1; ci++) {
      var hcell = ihash(ci * 7717 + 55);
      if (hcell < 0.52) {
        var mx = ci * cell - worldX * 0.55 + hcell * 120;
        drawMark((ihash(ci * 331 + 7) * 3) | 0, mx, midY + 2, 74, step, ink, 0.85);
      }
    }

    // near ground line + texture strokes (parallax 1)
    var nearPts = [];
    for (var x3 = -20; x3 <= LW + 20; x3 += 30) {
      var wx3 = x3 + worldX;
      nearPts.push([x3, nearY - vnoise(wx3, 160, 171) * 0.008 * LH]);
    }
    jline(nearPts, 803, step, ink, 2.2, 1);
    var ncell = 54;
    var n0 = Math.floor((worldX - 60) / ncell), n1 = Math.floor((worldX + LW + 60) / ncell);
    for (var ni = n0; ni <= n1; ni++) {
      var hn = ihash(ni * 613 + 23);
      if (hn > 0.42) {
        var nx = ni * ncell - worldX + hn * 26;
        var ny = nearY + 8 + ihash(ni * 977 + 31) * 0.10 * LH;
        jline([[nx, ny], [nx + 7 + hn * 9, ny - 1.5]], 810 + (ni % 7), step, ink, 1.5, 0.5);
      }
    }

    // the letter fragments, drifting at their own depths
    var order = shuffle(FRAGMENTS.length, 1237 + reseed * 997);
    var span = LW + 2600;
    var delta = (walkDist(t) + dragOff) * 0.9 + t * 5;
    ctx.textBaseline = 'middle';
    for (var fi = 0; fi < FRAGMENTS.length; fi++) {
      var p = FDEPTH[fi];
      var rel = ((FBASE[fi] * span - delta * p) % span + span) % span;
      var sx = rel - 1300;
      var sy = FYF[fi] * LH;
      var size = 14 + p * 15;
      ctx.font = size + 'px "Segoe Script", "Bradley Hand", cursive';
      var tw = ctx.measureText(FRAGMENTS[order[fi]]).width;
      if (sx + tw < -40 || sx > LW + 40) continue;
      var centreFade = clamp(1.18 - Math.abs(sx + tw / 2 - LW / 2) / (LW * 0.60), 0, 1);
      var a = (0.34 + p * 0.48) * centreFade;
      if (a <= 0.01) continue;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate((ihash(fi * 449 + 17) - 0.5) * 0.035);
      ctx.fillStyle = fade;
      ctx.globalAlpha = a;
      ctx.fillText(FRAGMENTS[order[fi]], 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // vignettes at the frame edges, surfacing and dissolving
    var vorder = shuffle(5, 733 + reseed * 331);
    for (var vk = 0; vk < 5; vk++) {
      var start = 2 + vk * 19.5 + ihash(vk * 31 + reseed * 7 + 3) * 4;
      var age = ((t - start) % 100 + 100) % 100;
      if (age > 8) continue;
      var va = Math.sin(Math.PI * age / 8) * 0.45;
      if (va <= 0.01) continue;
      var vs = Math.min(120, LW * 0.11);
      var vx = (vk % 2 === 0) ? (LW - vs - 26) : 26;
      var vy = 0.30 * LH + ihash(vk * 87 + 5) * 0.10 * LH;
      drawVignette(vorder[vk], vx, vy, vs, step, ink, va);
    }

    // the walker, small against the empty world
    var fx = (isPhone(W, H) ? 0.27 : 0.30) * LW;
    drawFigure(fx, nearY, t, step, behavior(t), ink);
  }

  // ================= sizing / loop =================
  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    LW = isPhone(w, h) ? 900 : 1280;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    SCALE = (w * dpr) / LW;
    LH = (h * dpr) / SCALE;
  }

  var startTs = null, elapsedNow = 0;
  function frame(ts) {
    if (startTs === null) startTs = ts;
    elapsedNow = (ts - startTs) / 1000;
    draw(T0 + elapsedNow);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  resize();
  draw(T0);   // synchronous first frame: fixed phase, day, mid-walk
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(T0 + elapsedNow); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(T0 + elapsedNow); });
  }
})();
</script>
</body>
</html>
