<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№110 · Grid Rule</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F7F4EC; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(26,26,24,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to move the bloom</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

// No.110 Grid Rule (nathanmoore). STATIC. A 20 by 20 grid; each cell holds one
// mark, and each mark is a pure function of its indices alone: the angle is
// (i*3 + j*5) mod 180 degrees, the length grows with distance from the bloom
// centre. Exactly 400 marks, one per cell. The rule is the whole piece; there
// is no chance anywhere in this file. While pressed, the bloom
// centre follows the fingertip and the marks recompute by the same function;
// release restores the frame-centre bloom.
const PAPER='#F7F4EC', INK='#1A1A18';
const COLS=20, ROWS=20;
let bloomPt=null;

function gridRect(w,h){
  const phone=isPhone();
  const side=phone? w*0.88 : Math.min(w,h)*0.76;
  return { x:(w-side)/2, y:(h-side)/2, side, cx:w/2, cy:h/2 };
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,w,h);
  const G=gridRect(w,h);
  const cell=G.side/COLS;
  const bx=bloomPt?bloomPt[0]:G.cx, by=bloomPt?bloomPt[1]:G.cy;
  let maxD=0;
  for(const cxp of [G.x, G.x+G.side]) for(const cyp of [G.y, G.y+G.side]) maxD=Math.max(maxD, Math.hypot(cxp-bx, cyp-by));
  ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1.1, cell*0.05); ctx.lineCap='round';
  let count=0;
  ctx.beginPath();
  for(let j=0;j<ROWS;j++){
    for(let i=0;i<COLS;i++){
      const cx=G.x+(i+0.5)*cell, cy=G.y+(j+0.5)*cell;
      const ang=((i*3+j*5)%180)*Math.PI/180;
      const d=Math.hypot(cx-bx, cy-by)/maxD;
      const len=cell*(0.22+1.05*d);
      const dx=Math.cos(ang)*len/2, dy=Math.sin(ang)*len/2;
      ctx.moveTo(cx-dx, cy-dy); ctx.lineTo(cx+dx, cy+dy);
      count++;
    }
  }
  ctx.stroke();
  if(count!==400) console.assert(false,'marks',count);
  return {};
}
function ptr(e){ const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{left:0,top:0}; return [e.clientX-r.left, e.clientY-r.top]; }
canvas.addEventListener('pointerdown',e=>{ bloomPt=ptr(e); });
canvas.addEventListener('pointermove',e=>{ if(bloomPt) bloomPt=ptr(e); });
function endP(){ bloomPt=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(1000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
