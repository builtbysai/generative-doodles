<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Future</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAFAF8; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  No.914 "The Future" (study #112 duncan_geere, PP75 "The Green Disc").
  A large disc on paper fills edge to edge with tiny ink tree glyphs:
  canopy circles on trunks (~70%) and grassy tufts (~30%), planted one
  by one along a spiral out of two hub circles. The hubs stay paper
  knockout with ink marks inside (propeller above, building blocks
  below). The only green in the piece is the accent that pulses inside
  the hubs during the double-tap survey, beside the tiny census line.
  Frame one is the synchronous draw at t = 0, planting phase offset so
  the disc is ~55% planted. Everything drawn is a closed-form function
  of (t, recorded pointer events); sites and glyphs are seeded data.
  Sound starts on the first gesture only.
*/

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- palette ---------- */
var PAPER = '#FAFAF8';
var INK = '#111111';
var GREEN = '#1F6F43';

/* ---------- viewport ---------- */
var W = 0, H = 0, DPR = 1, isPhone = false;

function viewportSize() {
  var w, h;
  if (typeof window !== 'undefined' && window.visualViewport &&
      typeof window.visualViewport.width === 'number') {
    w = window.visualViewport.width; h = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && typeof window.innerWidth === 'number') {
    w = window.innerWidth; h = window.innerHeight;
  } else {
    w = 1280; h = 900;
  }
  return { w: Math.max(50, Math.round(w)), h: Math.max(50, Math.round(h)) };
}

function resize() {
  var s = viewportSize();
  W = s.w; H = s.h;
  DPR = 1;
  if (typeof window !== 'undefined' && typeof window.devicePixelRatio === 'number') {
    DPR = Math.min(2, Math.max(1, window.devicePixelRatio));
  }
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen) {
    sw = window.screen.width || 0; sh = window.screen.height || 0;
  }
  isPhone = (sw > 0 && sh > 0 && Math.min(sw, sh) < 700) || (H > W * 1.15);
  ensureGenerations();
  if (started) draw(currentT);
}

/* layout in pixels, derived per draw */
function layout() {
  var S = Math.min(W, H);
  return { cx: W / 2, cy: H / 2, R: 0.44 * S, S: S };
}
function toDisc(px, py) {
  var L = layout();
  return { x: (px - L.cx) / L.R, y: (py - L.cy) / L.R };
}

/* ---------- forest generation (seeded, per generation) ---------- */
var PLANT_T = 30;        /* seconds to plant the whole disc */
var HOLD_T = 5;          /* full disc hold */
var FADE_T = 2.5;        /* fade out, then replant */
var CYCLE = PLANT_T + HOLD_T + FADE_T;
var PHASE0 = 0.55 * PLANT_T;  /* frame one: ~55% planted */

var generations = [];    /* cached generation data by index */
var builtForPhone = null;

function genForest(genIndex) {
  var target = isPhone ? 650 : 1000;
  var rng = mulberry32(91475 + genIndex * 100003);
  /* hubs: A smaller near the top, B larger near the bottom (disc units) */
  var aA = -Math.PI / 2 + (rng() - 0.5) * 1.1;
  var dA = 0.38 + rng() * 0.18;
  var aB = Math.PI / 2 + (rng() - 0.5) * 1.1;
  var dB = 0.40 + rng() * 0.18;
  var hubA = { x: Math.cos(aA) * dA, y: Math.sin(aA) * dA, r: 0.16 };
  var hubB = { x: Math.cos(aB) * dB, y: Math.sin(aB) * dB, r: 0.24 };
  /* propeller blades in hub A */
  var prop = [];
  var pBase = rng() * Math.PI * 2;
  for (var i = 0; i < 3; i++) prop.push(pBase + i * (Math.PI * 2 / 3) + (rng() - 0.5) * 0.3);
  /* building blocks in hub B: rects in disc units */
  var blocks = [];
  var nb = 5 + Math.floor(rng() * 2);
  for (var j = 0; j < nb; j++) {
    blocks.push({
      x: hubB.x + (rng() - 0.5) * hubB.r * 1.1,
      y: hubB.y + (rng() - 0.5) * hubB.r * 1.1,
      w: 0.035 + rng() * 0.05, h: 0.035 + rng() * 0.05
    });
  }
  /* jittered grid sites clipped to the disc, kept out of the hubs */
  var sites = [];
  var spacing = Math.sqrt(Math.PI * 0.90 / target);
  for (var attempt = 0; attempt < 4; attempt++) {
    sites = [];
    var n = Math.ceil(2 / spacing);
    for (var gy = 0; gy <= n; gy++) {
      for (var gx = 0; gx <= n; gx++) {
        var x = -1 + (gx + (gy % 2 ? 0.5 : 0)) * spacing + (rng() - 0.5) * spacing * 0.8;
        var y = -1 + gy * spacing + (rng() - 0.5) * spacing * 0.8;
        if (x < -1 || x > 1) continue;
        var d = Math.sqrt(x * x + y * y);
        if (d > 0.985) continue;
        var da = Math.sqrt((x - hubA.x) * (x - hubA.x) + (y - hubA.y) * (y - hubA.y));
        var db = Math.sqrt((x - hubB.x) * (x - hubB.x) + (y - hubB.y) * (y - hubB.y));
        if (da < hubA.r + spacing * 0.55 || db < hubB.r + spacing * 0.55) continue;
        var type = rng() < 0.70 ? 0 : 1;   /* 0 canopy, 1 tuft */
        var site = {
          x: x, y: y, type: type,
          tilt: (rng() - 0.5) * 0.5,
          cr: 0.20 + rng() * 0.10,          /* canopy radius, in spacing units */
          wob: [],                          /* canopy rim jitter */
          fan: [],                          /* tuft stroke angles */
          phase: rng() * Math.PI * 2,
          key: 0, appear: 0
        };
        for (var wI = 0; wI < 7; wI++) site.wob.push(0.82 + rng() * 0.36);
        var nFan = 3 + Math.floor(rng() * 2);
        for (var fI = 0; fI < nFan; fI++) {
          site.fan.push({ a: -Math.PI / 2 + (fI - (nFan - 1) / 2) * 0.42 + (rng() - 0.5) * 0.2,
                          l: 0.34 + rng() * 0.22, bend: (rng() - 0.5) * 0.3 });
        }
        /* spiral key: distance to nearer hub plus an angular sweep term */
        var hub = da <= db ? hubA : hubB;
        var dd = Math.min(da, db);
        var th = Math.atan2(y - hub.y, x - hub.x) / (Math.PI * 2);
        if (th < 0) th += 1;
        site.key = dd + 0.085 * th;
        sites.push(site);
      }
    }
    if (Math.abs(sites.length - target) <= target * 0.08 || attempt === 3) break;
    spacing *= Math.sqrt(sites.length / target);
  }
  /* planting order along the spiral keys */
  sites.sort(function (p, q) { return p.key - q.key; });
  for (var sI = 0; sI < sites.length; sI++) {
    sites[sI].appear = ((sI + 0.5) / sites.length) * PLANT_T;
  }
  return { hubA: hubA, hubB: hubB, prop: prop, blocks: blocks,
           sites: sites, count: sites.length, spacing: spacing };
}

function ensureGenerations() {
  if (builtForPhone !== isPhone) { generations = []; builtForPhone = isPhone; }
}
function getGen(g) {
  ensureGenerations();
  while (generations.length <= g) generations.push(genForest(generations.length));
  return generations[g];
}

/* ---------- recorded pointer events ----------
   taps:     {t} released quick taps (mature into reseeds or, paired, a survey)
   surveys:  {t} survey start times
   windPts:  {x, y, t, vx, vy} drag samples in disc units            */
var taps = [];
var surveys = [];
var windPts = [];
var downInfo = null;

function maturedReseeds(t) {
  /* a tap becomes a reseed 0.35s after release unless a second tap
     lands inside that window, which turns the pair into a survey */
  var out = [];
  var used = {};
  for (var i = 0; i < taps.length; i++) {
    if (used[i]) continue;
    var paired = false;
    for (var j = i + 1; j < taps.length; j++) {
      if (!used[j] && taps[j].t - taps[i].t <= 0.35) { paired = true; used[j] = true; break; }
    }
    if (paired) continue;
    if (t >= taps[i].t + 0.35) out.push(taps[i].t + 0.35);
  }
  return out;
}
function surveyStarts() {
  var out = [];
  var used = {};
  for (var i = 0; i < taps.length; i++) {
    if (used[i]) continue;
    for (var j = i + 1; j < taps.length; j++) {
      if (!used[j] && taps[j].t - taps[i].t <= 0.35) {
        out.push(taps[j].t); used[i] = true; used[j] = true; break;
      }
    }
  }
  return out;
}
function stateAt(t) {
  var rs = maturedReseeds(t);
  var gen = rs.length;                       /* generation index */
  var start = rs.length ? rs[rs.length - 1] : -PHASE0;
  var tau = (t - start) % CYCLE;
  if (tau < 0) tau += CYCLE;
  var sv = surveyStarts();
  var surveyT = -1;
  for (var i = 0; i < sv.length; i++) if (sv[i] <= t) surveyT = sv[i];
  var surveyAge = surveyT >= 0 ? t - surveyT : -1;
  return { gen: gen, tau: tau, surveyAge: surveyAge };
}

/* wind lean at a disc-unit point, closed-form over recorded drag samples */
function windAt(x, y, t) {
  var lx = 0, ly = 0, mag = 0;
  var SIG = 0.20;
  for (var i = 0; i < windPts.length; i++) {
    var p = windPts[i];
    var age = t - p.t;
    if (age < 0 || age > 2.2) continue;
    var dx = x - p.x, dy = y - p.y;
    var fall = Math.exp(-(dx * dx + dy * dy) / (2 * SIG * SIG));
    var dec = Math.exp(-age / 0.9);
    var w = fall * dec;
    lx += p.vx * w; ly += p.vy * w; mag += w * Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  }
  return { x: lx, y: ly, mag: mag };
}

/* ---------- audio (lazy, first gesture, guarded) ---------- */
var AC = null, windGain = null, windFilter = null, audioOn = false, tickSeed = 777;
function initAudio() {
  if (audioOn) return;
  audioOn = true;
  try {
    var Ctor = null;
    if (typeof window !== 'undefined') Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    var len = AC.sampleRate * 2;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    var r = mulberry32(4242);
    var last = 0;
    for (var i = 0; i < len; i++) { var wht = r() * 2 - 1; last = (last + 0.02 * wht) / 1.02; d[i] = last * 3; }
    var src = AC.createBufferSource();
    src.buffer = buf; src.loop = true;
    windFilter = AC.createBiquadFilter();
    windFilter.type = 'bandpass'; windFilter.frequency.value = 500; windFilter.Q.value = 0.6;
    windGain = AC.createGain(); windGain.gain.value = 0;
    src.connect(windFilter); windFilter.connect(windGain); windGain.connect(AC.destination);
    src.start();
  } catch (e) { AC = null; }
}
function stampTick(canopy) {
  if (!AC) return;
  try {
    var t0 = AC.currentTime;
    var src = AC.createBufferSource();
    var len = Math.floor(AC.sampleRate * 0.03);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    tickSeed = (tickSeed + 1013904223) >>> 0;
    var r = mulberry32(tickSeed);
    for (var i = 0; i < len; i++) d[i] = (r() * 2 - 1) * (1 - i / len);
    src.buffer = buf;
    src.playbackRate.value = canopy ? 0.85 : 1.5;
    var f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1200;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04);
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t0);
  } catch (e) {}
}
function censusTone() {
  if (!AC) return;
  try {
    var t0 = AC.currentTime;
    var o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = 98;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + 1.5);
  } catch (e) {}
}

/* ---------- drawing ---------- */
function fmtCount(n) {
  var s = String(n), out = '';
  while (s.length > 3) { out = ',' + s.slice(-3) + out; s = s.slice(0, -3); }
  return s + out;
}

var plantedSeen = -1, plantedGenSeen = -1, lastTickAt = -1, lastSurveySeen = -1;

function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  var L = layout();
  var st = stateAt(t);
  var gen = getGen(st.gen);
  var tau = st.tau;
  var cycleAlpha = 1;
  if (tau >= PLANT_T + HOLD_T) cycleAlpha = 1 - (tau - PLANT_T - HOLD_T) / FADE_T;
  var inSurvey = st.surveyAge >= 0 && st.surveyAge < 6;
  var unit = L.R;                    /* disc radius in px */
  var gPx = gen.spacing * unit;      /* grid spacing in px */
  ctx.strokeStyle = INK;
  ctx.fillStyle = INK;

  /* disc boundary, plotter thin */
  ctx.lineWidth = Math.max(1, unit * 0.0035);
  ctx.beginPath();
  ctx.arc(L.cx, L.cy, unit * 0.995, 0, Math.PI * 2);
  ctx.stroke();

  /* glyphs */
  var planted = 0;
  ctx.lineWidth = Math.max(0.8, gPx * 0.05);
  ctx.lineCap = 'round';
  for (var i = 0; i < gen.sites.length; i++) {
    var s = gen.sites[i];
    if (tau < s.appear) continue;
    planted++;
    var aIn = Math.min(1, (tau - s.appear) / 0.25);
    var sc = 0.6 + 0.4 * aIn;
    var alpha = aIn * cycleAlpha;
    if (alpha <= 0.01) continue;
    var bx = L.cx + s.x * unit;
    var by = L.cy + s.y * unit;
    var baseY = by + 0.30 * gPx;
    var w = windAt(s.x, s.y, t);
    var lean = Math.max(-0.5, Math.min(0.5, w.x * 0.10));
    var shiver = w.mag > 0.02 ? Math.sin(t * 40 + s.phase) * Math.min(1.2, w.mag * 0.5) : 0;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(bx + w.x * 0.012 * unit + shiver, baseY);
    ctx.rotate(lean + s.tilt * 0.15);
    ctx.scale(sc, sc);
    ctx.translate(0, -0.30 * gPx);
    if (s.type === 0) {
      /* canopy: trunk then a wobbled circle */
      ctx.beginPath();
      ctx.moveTo(0, 0.30 * gPx);
      ctx.lineTo(s.tilt * gPx * 0.35, -0.02 * gPx);
      ctx.stroke();
      var ccx = s.tilt * gPx * 0.35, ccy = -0.02 * gPx - s.cr * gPx * 0.95;
      ctx.beginPath();
      for (var k = 0; k < 7; k++) {
        var ang = (k / 7) * Math.PI * 2;
        var rr = s.cr * gPx * s.wob[k];
        var px = ccx + Math.cos(ang) * rr, py = ccy + Math.sin(ang) * rr;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    } else {
      /* tuft: short grass strokes fanning up from the base;
         fan angle a is stored around -PI/2, so aUp is the tilt from straight up */
      for (var f = 0; f < s.fan.length; f++) {
        var st2 = s.fan[f];
        var aUp = st2.a + Math.PI / 2;
        var dx = Math.sin(aUp) * st2.l * gPx;
        var dy = -Math.cos(aUp) * st2.l * gPx;
        ctx.beginPath();
        ctx.moveTo(0, 0.30 * gPx);
        ctx.quadraticCurveTo(dx * 0.5 + st2.bend * gPx * 0.25, 0.30 * gPx + dy * 0.55,
                             dx, 0.30 * gPx + dy);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /* hubs (always drawn): green pulse in survey, paper knockout, ink marks */
  var hubs = [gen.hubA, gen.hubB];
  for (var hI = 0; hI < 2; hI++) {
    var hb = hubs[hI];
    var hx = L.cx + hb.x * unit, hy = L.cy + hb.y * unit, hr = hb.r * unit;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.fillStyle = PAPER;
    ctx.fill();
    if (inSurvey) {
      ctx.globalAlpha = 0.35 + 0.30 * (0.5 + 0.5 * Math.sin(t * 3.2 + hI * 1.4));
      ctx.fillStyle = GREEN;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1, unit * 0.004);
    ctx.stroke();
    ctx.fillStyle = INK;
    if (hI === 0) {
      /* propeller: three fan blades from the center */
      for (var pI = 0; pI < gen.prop.length; pI++) {
        var pa = gen.prop[pI];
        var tx = hx + Math.cos(pa) * hr * 0.78, ty = hy + Math.sin(pa) * hr * 0.78;
        var pxn = Math.cos(pa + Math.PI / 2), pyn = Math.sin(pa + Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(tx + pxn * hr * 0.16, ty + pyn * hr * 0.16);
        ctx.lineTo(tx - pxn * hr * 0.16, ty - pyn * hr * 0.16);
        ctx.closePath();
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(hx, hy, Math.max(1.2, hr * 0.07), 0, Math.PI * 2);
      ctx.fill();
    } else {
      for (var bI = 0; bI < gen.blocks.length; bI++) {
        var bl = gen.blocks[bI];
        ctx.fillRect(L.cx + (bl.x - bl.w / 2) * unit, L.cy + (bl.y - bl.h / 2) * unit,
                     bl.w * unit, bl.h * unit);
      }
    }
    ctx.restore();
  }

  /* census line during the survey */
  if (inSurvey) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, st.surveyAge / 0.4) * Math.min(1, (6 - st.surveyAge) / 0.6);
    ctx.fillStyle = INK;
    var fs = Math.max(10, Math.round(L.S * 0.016));
    ctx.font = fs + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(fmtCount(gen.count) + ' trees, 2 hubs', L.cx, L.cy + unit + fs * 2.1);
    ctx.restore();
    var svs = surveyStarts();
    var curSurveyStart = -1;
    for (var q = 0; q < svs.length; q++) if (svs[q] <= t) curSurveyStart = svs[q];
    if (curSurveyStart >= 0 && lastSurveySeen !== curSurveyStart) {
      lastSurveySeen = curSurveyStart;
      censusTone();
    }
  }

  /* stamp ticks, thinned to ~8/s */
  if (plantedGenSeen !== st.gen) { plantedGenSeen = st.gen; plantedSeen = planted; }
  else if (planted > plantedSeen) {
    if (t - lastTickAt > 0.12) {
      lastTickAt = t;
      var newest = gen.sites[planted - 1];
      stampTick(newest && newest.type === 0);
    }
    plantedSeen = planted;
  }
  lastWindMag = windEnergy(t);
}
var lastWindMag = 0;
function windEnergy(t) {
  var e = 0;
  for (var i = 0; i < windPts.length; i++) {
    var age = t - windPts[i].t;
    if (age >= 0 && age < 2.2) e += Math.exp(-age / 0.9) * Math.sqrt(windPts[i].vx * windPts[i].vx + windPts[i].vy * windPts[i].vy);
  }
  return e;
}

/* ---------- pointer handling ---------- */
var started = false, currentT = 0;
function nowT() { return currentT; }

function onDown(e) {
  initAudio();
  if (AC && AC.resume) { try { AC.resume(); } catch (err) {} }
  var p = evPos(e);
  downInfo = { x: p.x, y: p.y, t: nowT(), moved: false, lastX: p.x, lastY: p.y, lastT: nowT() };
}
function onMove(e) {
  if (!downInfo) return;
  var p = evPos(e);
  var t = nowT();
  var dx = p.x - downInfo.x, dy = p.y - downInfo.y;
  if (Math.sqrt(dx * dx + dy * dy) > 8) downInfo.moved = true;
  var dt = Math.max(0.008, t - downInfo.lastT);
  var a = toDisc(downInfo.lastX, downInfo.lastY), b = toDisc(p.x, p.y);
  windPts.push({ x: b.x, y: b.y, t: t, vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt });
  if (windPts.length > 90) windPts.splice(0, windPts.length - 90);
  downInfo.lastX = p.x; downInfo.lastY = p.y; downInfo.lastT = t;
}
function onUp(e) {
  if (!downInfo) return;
  var t = nowT();
  if (!downInfo.moved && t - downInfo.t <= 0.3) taps.push({ t: t });
  downInfo = null;
}
function evPos(e) {
  if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
  if (e && e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e && e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: 0, y: 0 };
}
try {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { downInfo = null; });
} catch (e) {}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('resize', resize);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
}

/* ---------- run ---------- */
resize();
draw(0);
started = true;
if (typeof requestAnimationFrame === 'function') {
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var loop = function () {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    currentT = (now - t0) / 1000;
    draw(currentT);
    if (windGain) {
      try { windGain.gain.value = Math.min(0.30, lastWindMag * 0.10); } catch (e) {}
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
