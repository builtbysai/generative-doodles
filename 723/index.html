<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eight-Spoke Cipher</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAFAF7; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var PAPER = '#FAFAF7';
  var INK = '#141414';
  var ACCENT_RED = '#E63946';
  var ACCENT_BLUE = '#1D6FE0';

  var COLS = 4, ROWS = 7, N = COLS * ROWS;
  var LOOP = 50;              // seconds per reconfiguration loop
  var FLIP_START = 6;         // first flip at 6s
  var FLIP_STEP = 1.0;        // one sign per second, reading order
  var FLIP_FADE = 0.5;        // segment fade duration

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var viewW = 0, viewH = 0, isPhone = false;

  // ---------- seeded RNG ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function popcount(x) { var n = 0; while (x) { n += x & 1; x >>= 1; } return n; }

  // ---------- chart generation ----------
  // A sign = { arcs: 8-bit mask, spokes: 8-bit mask }.
  // Scaffold: 8 arc segments of 45 degrees + 8 radial spokes.
  function genSigns(rng) {
    var used = {};
    var signs = [];
    var guard = 0;
    while (signs.length < N && guard++ < 20000) {
      var arcs = Math.floor(rng() * 256);
      var spokes = Math.floor(rng() * 256);
      var total = popcount(arcs) + popcount(spokes);
      if (total < 5 || total > 11) continue;          // keep signs abstract, never sparse like a letter
      if (popcount(arcs) < 2) continue;               // spokes-only subsets can read as letters (e.g. K); arcs keep the scaffold circular
      var key = (arcs << 8) | spokes;
      if (used[key]) continue;                        // no two signs share a mask pair
      used[key] = true;
      signs.push({ arcs: arcs, spokes: spokes });
    }
    return signs;
  }

  // Choose the flip bit for each sign for one cycle: toggling it must not
  // create a duplicate mask pair among the post-flip set.
  function genFlipPlan(rng, signs) {
    var plan = new Array(N);
    var current = signs.map(function (s) { return (s.arcs << 8) | s.spokes; });
    for (var i = 0; i < N; i++) {
      var order = [];
      for (var b = 0; b < 16; b++) order.push(b);
      // seeded shuffle
      for (var j = order.length - 1; j > 0; j--) {
        var k = Math.floor(rng() * (j + 1));
        var tmp = order[j]; order[j] = order[k]; order[k] = tmp;
      }
      var chosen = -1;
      for (var o = 0; o < order.length; o++) {
        var bit = order[o];
        var cand = current[i] ^ (1 << bit);
        var total = popcount((cand >> 8) & 255) + popcount(cand & 255);
        if (total < 4 || total > 12) continue;
        if (popcount((cand >> 8) & 255) < 2) continue; // never flip a sign into a spokes-only letter shape
        var dup = false;
        for (var m = 0; m < N; m++) {
          if (m !== i && current[m] === cand) { dup = true; break; }
        }
        if (!dup) { chosen = bit; current[i] = cand; break; }
      }
      if (chosen < 0) chosen = 0; // extremely unlikely fallback; toggle arc 0
      plan[i] = chosen;
    }
    return plan;
  }

  function applyPlan(signs, plan) {
    return signs.map(function (s, i) {
      var key = ((s.arcs << 8) | s.spokes) ^ (1 << plan[i]);
      return { arcs: (key >> 8) & 255, spokes: key & 255 };
    });
  }

  // Accent rule: exactly 4 signs, in 4 distinct rows, carry exactly one
  // accent segment (drawn red or blue instead of ink).
  function genAccents(rng, signs) {
    var rows = [0, 1, 2, 3, 4, 5, 6];
    for (var j = rows.length - 1; j > 0; j--) {
      var k = Math.floor(rng() * (j + 1));
      var tmp = rows[j]; rows[j] = rows[k]; rows[k] = tmp;
    }
    var accents = {}; // signIndex -> {bit: 0..15, color}
    for (var r = 0; r < 4; r++) {
      var row = rows[r];
      var idx = row * COLS + Math.floor(rng() * COLS);
      var s = signs[idx];
      var present = [];
      for (var b = 0; b < 16; b++) {
        var mask = b < 8 ? s.arcs : s.spokes;
        if (mask & (1 << (b & 7))) present.push(b);
      }
      if (!present.length) continue;
      var bit = present[Math.floor(rng() * present.length)];
      accents[idx] = { bit: bit, color: (r % 2 === 0) ? ACCENT_RED : ACCENT_BLUE };
    }
    return accents;
  }

  // Faint dotted construction circles under 3 signs.
  function genDotted(rng) {
    var set = {};
    while (Object.keys(set).length < 3) {
      set[Math.floor(rng() * N)] = true;
    }
    return set;
  }

  // Epoch state: everything derives from the epoch seed.
  var epoch = 0;
  var epochData = null;
  function buildEpoch(ep) {
    var rng = mulberry32(0xE5167 + ep * 7919);
    var baseSigns = genSigns(rng);
    var accents = genAccents(rng, baseSigns);
    var dotted = genDotted(rng);
    return {
      rng: rng,
      baseSigns: baseSigns,
      accents: accents,
      dotted: dotted,
      cycleCache: {} // cycleIndex -> { signs, plan }
    };
  }

  function cycleState(ep, cycle) {
    var cache = epochData.cycleCache;
    if (cache[cycle]) return cache[cycle];
    // build forward from the highest cached cycle
    var start = 0;
    var signs = epochData.baseSigns;
    for (var c = cycle; c >= 0; c--) {
      if (cache[c]) { start = c; signs = cache[c].signs; break; }
    }
    for (var k = start; k <= cycle; k++) {
      if (!cache[k]) {
        var plan = genFlipPlan(epochData.rng, signs);
        cache[k] = { signs: signs, plan: plan };
      }
      if (k < cycle) signs = applyPlan(cache[k].signs, cache[k].plan);
    }
    return cache[cycle];
  }

  epochData = buildEpoch(0);

  // ---------- sizing ----------
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    viewW = Math.max(1, Math.floor(w));
    viewH = Math.max(1, Math.floor(h));
    canvas.width = viewW;
    canvas.height = viewH;
    var sw = (window.screen && window.screen.width) || 9999;
    var sh = (window.screen && window.screen.height) || 9999;
    isPhone = Math.min(sw, sh) < 700 || viewH > viewW * 1.15;
    draw(currentT);
  }

  // ---------- drawing ----------
  function drawSegment(cx, cy, R, lw, bit, color, alpha) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (bit < 8) {
      var a0 = bit * Math.PI / 4 + 0.035;
      var a1 = (bit + 1) * Math.PI / 4 - 0.035;
      ctx.arc(cx, cy, R, a0, a1);
    } else {
      var a = (bit - 8) * Math.PI / 4;
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawSign(cx, cy, R, lw, sign, flipBit, flipAlpha, accent, showDotted) {
    if (showDotted) {
      ctx.save();
      ctx.fillStyle = INK;
      ctx.globalAlpha = 0.22;
      var dots = 28;
      for (var d = 0; d < dots; d++) {
        var da = d / dots * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(cx + R * Math.cos(da), cy + R * Math.sin(da), Math.max(0.8, lw * 0.22), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    for (var b = 0; b < 16; b++) {
      var mask = b < 8 ? sign.arcs : sign.spokes;
      var present = (mask & (1 << (b & 7))) !== 0;
      var alpha = 1;
      if (b === flipBit && flipAlpha !== null) {
        // this segment is mid-flip: fading in if turning on, out if turning off
        alpha = present ? (1 - flipAlpha) : flipAlpha;
        if (!present && flipAlpha <= 0) continue;
        if (present && flipAlpha >= 1) continue;
        present = true; // draw during the transition either way
      }
      if (!present) continue;
      var color = INK;
      if (accent && accent.bit === b) color = accent.color;
      drawSegment(cx, cy, R, lw, b, color, alpha);
    }
  }

  var currentT = 0;

  function draw(t) {
    currentT = t;
    if (!viewW || !viewH) return;
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, viewW, viewH);

    var cycle = Math.floor(t / LOOP);
    var local = t - cycle * LOOP;
    var state = cycleState(epoch, cycle);
    var signs = state.signs;
    var plan = state.plan;

    // chart geometry: generous margins, square cells, centered
    var margin = Math.min(viewW, viewH) * 0.07;
    var cell = Math.min((viewW - margin * 2) / COLS, (viewH - margin * 2) / ROWS);
    var gridW = cell * COLS, gridH = cell * ROWS;
    var ox = (viewW - gridW) / 2, oy = (viewH - gridH) / 2;
    var R = cell * 0.275;            // sign diameter ~55% of cell
    var lw = Math.max(1.2, cell * 0.042);

    for (var i = 0; i < N; i++) {
      var col = i % COLS, row = Math.floor(i / COLS);
      var cx = ox + (col + 0.5) * cell;
      var cy = oy + (row + 0.5) * cell;
      var flipBit = -1, flipAlpha = null;
      var ft = FLIP_START + i * FLIP_STEP;
      if (local >= ft && local < ft + FLIP_FADE) {
        flipBit = plan[i];
        flipAlpha = (local - ft) / FLIP_FADE; // 0..1 progress
      } else if (local >= ft + FLIP_FADE) {
        // flip fully applied: draw from the post-flip masks
        var key = ((signs[i].arcs << 8) | signs[i].spokes) ^ (1 << plan[i]);
        drawSignApplied(cx, cy, R, lw, key, signs, i, state);
        continue;
      }
      drawSign(cx, cy, R, lw, signs[i], flipBit, flipAlpha, epochData.accents[i], !!epochData.dotted[i]);
    }
  }

  // helper for the fully-flipped case (accent bit may have flipped too;
  // accent follows the segment identity, so if the accented segment was
  // flipped off it simply is not drawn this cycle)
  function drawSignApplied(cx, cy, R, lw, key, signs, i, state) {
    var s = { arcs: (key >> 8) & 255, spokes: key & 255 };
    drawSign(cx, cy, R, lw, s, -1, null, epochData.accents[i], !!epochData.dotted[i]);
  }

  // ---------- interaction: tap reseeds ----------
  function reseed() {
    epoch += 1;
    epochData = buildEpoch(epoch);
    startStamp = null; // re-anchor the loop clock at the next frame
    draw(0);
  }
  canvas.addEventListener('pointerdown', function () { reseed(); });

  // ---------- boot + loop ----------
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    draw((ts - startStamp) / 1000);
    requestAnimationFrame(frame);
  }

  function onResize() { resize(); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  resize();
  draw(0); // frame one: synchronous, loop t = 0, never clock-derived

  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
