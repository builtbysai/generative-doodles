<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Body Mnemonics</title>
<style>
  html, body { margin: 0; padding: 0; background: #080A0D; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1133);

  // ---------- palette ----------
  var FIELD = '#080A0D';
  var RING = '#E8EDF5';
  var ANCHOR = '#2A3340';
  // four color families, extended with tints -> 10 orbs
  var ORB_COLORS = [
    '#35E0FF', // cyan
    '#FFB84D', // amber
    '#E04DFF', // magenta
    '#4DFF88', // green
    '#8AEBFF', // cyan tint (light)
    '#FFD08A', // amber tint (light)
    '#F08AFF', // magenta tint (light)
    '#8AFFB0', // green tint (light)
    '#1FA8CC', // cyan shade (deep)
    '#E08E1F'  // amber shade (deep)
  ];
  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function mixWhite(rgb, f) {
    return [Math.round(rgb[0] + (255 - rgb[0]) * f),
            Math.round(rgb[1] + (255 - rgb[1]) * f),
            Math.round(rgb[2] + (255 - rgb[2]) * f)];
  }
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function fit() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', fit);
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- zones (fractions of viewport): the implied standing figure ----------
  // head top, left hand, right hand, chest center-low, feet bottom
  var ZONES = [
    { fx: 0.50, fy: 0.085 }, // head
    { fx: 0.095, fy: 0.46 }, // left hand
    { fx: 0.905, fy: 0.46 }, // right hand
    { fx: 0.50, fy: 0.615 }, // chest
    { fx: 0.50, fy: 0.925 }  // feet
  ];
  function zonePx(z) { return [z.fx * W, z.fy * H]; }
  function ringR() { return Math.max(20, Math.min(W, H) * 0.052); }
  function fanOffset(slot, r) {
    if (slot === 0) return [0, 0];
    var a = slot * 2.39996; // golden angle spread
    var d = r * 0.48;
    return [Math.cos(a) * d, Math.sin(a) * d];
  }

  // ---------- orbs ----------
  function makeDrift() {
    return {
      ax1: 6 + rng() * 14, wx1: 0.11 + rng() * 0.16, px1: rng() * 6.2832,
      ax2: 3 + rng() * 8,  wx2: 0.23 + rng() * 0.3,  px2: rng() * 6.2832,
      ay1: 6 + rng() * 14, wy1: 0.09 + rng() * 0.15, py1: rng() * 6.2832,
      ay2: 3 + rng() * 8,  wy2: 0.19 + rng() * 0.3,  py2: rng() * 6.2832
    };
  }
  function driftPos(d, fx, fy, t, scale) {
    var x = fx * W + (d.ax1 * Math.sin(d.wx1 * t + d.px1) + d.ax2 * Math.sin(d.wx2 * t + d.px2)) * scale;
    var y = fy * H + (d.ay1 * Math.sin(d.wy1 * t + d.py1) + d.ay2 * Math.sin(d.wy2 * t + d.py2)) * scale;
    return [x, y];
  }

  var N_ORBS = 10;
  var orbs = [];
  for (var i = 0; i < N_ORBS; i++) {
    // seeded home in a loose central constellation
    var ang = (i / N_ORBS) * Math.PI * 2 + (rng() - 0.5) * 0.7;
    var rad = 0.35 + rng() * 0.65;
    var hfx = 0.50 + Math.cos(ang) * rad * 0.155;
    var hfy = 0.44 + Math.sin(ang) * rad * 0.165;
    var col = ORB_COLORS[i];
    orbs.push({
      idx: i,
      rgb: hexRgb(col),
      homeFx: hfx, homeFy: hfy,
      drift: makeDrift(),
      base: null,        // {type:'drift', fx, fy} or {type:'anchor', zone, x, y}
      trans: null,       // {t0, fx, fy, dur}
      drag: null,        // {x, y}
      memory: -1         // zone index or -1
    });
    orbs[i].base = { type: 'drift', fx: hfx, fy: hfy };
  }

  // pulses: {x, y, t0, rgb}
  var pulses = [];

  var PHASE = 37.0; // fixed phase offset so frame one is mid-drift, deterministic

  function springEase(u) {
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    return 1 - Math.exp(-4.5 * u) * (Math.cos(7 * u) + (4.5 / 7) * Math.sin(7 * u));
  }

  function basePos(o, t, scale) {
    if (o.base.type === 'anchor') return [o.base.x, o.base.y];
    return driftPos(o.drift, o.base.fx, o.base.fy, t, scale);
  }
  function orbPos(o, t, scale) {
    if (o.drag) return [o.drag.x, o.drag.y];
    var p = basePos(o, t, scale);
    var tr = o.trans;
    if (tr && t < tr.t0 + tr.dur) {
      var e = springEase((t - tr.t0) / tr.dur);
      p = [tr.fx + (p[0] - tr.fx) * e, tr.fy + (p[1] - tr.fy) * e];
    }
    return p;
  }
  function startTrans(o, t, scale, dur) {
    var p = orbPos(o, t, scale);
    o.trans = { t0: t, fx: p[0], fy: p[1], dur: dur || 0.9 };
  }

  function dockOrb(o, zoneIdx, slot, t, scale) {
    var zp = zonePx(ZONES[zoneIdx]);
    var off = fanOffset(slot, ringR());
    startTrans(o, t, scale, 0.85);
    o.base = { type: 'anchor', zone: zoneIdx, x: zp[0] + off[0], y: zp[1] + off[1] };
    o.memory = zoneIdx;
    pulses.push({ x: zp[0], y: zp[1], t0: t, rgb: o.rgb });
  }
  function countAnchored(zoneIdx, except) {
    var n = 0;
    for (var j = 0; j < orbs.length; j++) {
      var q = orbs[j];
      if (q !== except && q.base.type === 'anchor' && q.base.zone === zoneIdx) n++;
    }
    return n;
  }

  // frame-one state: two orbs already docked (head, left hand), pulses just fired
  (function seedDocks() {
    var scale = 1;
    var a = orbs[0], b = orbs[4];
    var zh = zonePx(ZONES[0]); a.base = { type: 'anchor', zone: 0, x: zh[0], y: zh[1] }; a.memory = 0;
    var zl = zonePx(ZONES[1]); b.base = { type: 'anchor', zone: 1, x: zl[0], y: zl[1] }; b.memory = 1;
    pulses.push({ x: zh[0], y: zh[1], t0: PHASE - 0.30, rgb: a.rgb });
    pulses.push({ x: zl[0], y: zl[1], t0: PHASE - 0.18, rgb: b.rgb });
    void scale;
  })();

  function recallAll(t, scale) {
    var counters = [0, 0, 0, 0, 0];
    var pulsed = {};
    for (var j = 0; j < orbs.length; j++) {
      var o = orbs[j];
      if (o.drag) continue;
      if (o.memory >= 0) {
        var z = o.memory;
        var slot = counters[z]++;
        var zp = zonePx(ZONES[z]);
        var off = fanOffset(slot, ringR());
        startTrans(o, t, scale, 1.0);
        o.base = { type: 'anchor', zone: z, x: zp[0] + off[0], y: zp[1] + off[1] };
        if (!pulsed[z]) { pulses.push({ x: zp[0], y: zp[1], t0: t, rgb: o.rgb }); pulsed[z] = true; }
      } else {
        startTrans(o, t, scale, 1.0);
        o.base = { type: 'drift', fx: o.homeFx, fy: o.homeFy };
      }
    }
  }

  // ---------- interaction ----------
  var pointer = { x: -1, y: -1, down: false };
  var dragOrb = null;
  var downInfo = null; // {t, x, y, moved}
  var lastTap = null;  // {t, x, y}

  function clockNow() {
    return PHASE + perfElapsed();
  }
  var startStamp = null;
  function perfElapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      var n = performance.now() / 1000;
      if (startStamp === null) startStamp = n;
      return n - startStamp;
    }
    return 0;
  }

  function evtPos(e) {
    if (e.clientX !== undefined) return [e.clientX, e.clientY];
    if (e.touches && e.touches.length) return [e.touches[0].clientX, e.touches[0].clientY];
    if (e.changedTouches && e.changedTouches.length) return [e.changedTouches[0].clientX, e.changedTouches[0].clientY];
    return [0, 0];
  }
  function orbRadius() {
    var base = Math.max(7, Math.min(15, Math.min(W, H) * 0.017));
    return isPhone() ? base * 1.2 : base;
  }

  function onDown(e) {
    var p = evtPos(e);
    var t = clockNow();
    var scale = Math.min(W, H) / 720;
    // double-tap?
    if (lastTap && (t - lastTap.t) < 0.38 && Math.hypot(p[0] - lastTap.x, p[1] - lastTap.y) < 48) {
      lastTap = null;
      recallAll(t, scale);
      downInfo = { t: t, x: p[0], y: p[1], moved: true, consumed: true };
      pointer.down = true; pointer.x = p[0]; pointer.y = p[1];
      return;
    }
    downInfo = { t: t, x: p[0], y: p[1], moved: false, consumed: false };
    pointer.down = true; pointer.x = p[0]; pointer.y = p[1];
    // pick an orb (topmost = last drawn)
    var R = orbRadius();
    for (var j = orbs.length - 1; j >= 0; j--) {
      var o = orbs[j];
      var op = orbPos(o, t, scale);
      if (Math.hypot(p[0] - op[0], p[1] - op[1]) < R * 2.3) {
        dragOrb = o;
        o.drag = { x: p[0], y: p[1] };
        o.trans = null;
        break;
      }
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    var p = evtPos(e);
    pointer.x = p[0]; pointer.y = p[1];
    if (downInfo && Math.hypot(p[0] - downInfo.x, p[1] - downInfo.y) > 6) downInfo.moved = true;
    if (dragOrb) dragOrb.drag = { x: p[0], y: p[1] };
  }
  function onUp(e) {
    var p = evtPos(e);
    var t = clockNow();
    var scale = Math.min(W, H) / 720;
    pointer.down = false;
    if (dragOrb) {
      var o = dragOrb;
      o.drag = null;
      dragOrb = null;
      // released inside a zone ring?
      var r = ringR();
      var docked = false;
      for (var z = 0; z < ZONES.length; z++) {
        var zp = zonePx(ZONES[z]);
        if (Math.hypot(p[0] - zp[0], p[1] - zp[1]) < r * 1.55) {
          dockOrb(o, z, countAnchored(z, o), t, scale);
          docked = true;
          break;
        }
      }
      if (!docked) {
        // freed: drift around the release point; memory is kept
        o.trans = { t0: t, fx: p[0], fy: p[1], dur: 0.6 };
        o.base = { type: 'drift', fx: p[0] / W, fy: p[1] / H };
      }
    }
    if (downInfo && !downInfo.consumed && !downInfo.moved && (t - downInfo.t) < 0.35) {
      lastTap = { t: t, x: p[0], y: p[1] };
    } else if (downInfo && downInfo.moved) {
      lastTap = null;
    }
    downInfo = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  canvas.addEventListener('dblclick', function () { recallAll(clockNow(), Math.min(W, H) / 720); });

  // ---------- drawing ----------
  function drawCircle(x, y, r, style) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 6.283185307179586);
    ctx.fillStyle = style;
    ctx.fill();
  }
  function strokeCircle(x, y, r, style, lw) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 6.283185307179586);
    ctx.strokeStyle = style;
    ctx.lineWidth = lw;
    ctx.stroke();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var scale = Math.min(W, H) / 720;
    var R = orbRadius();
    var r = ringR();

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    // zone highlight while dragging near a zone
    var hotZone = -1;
    if (dragOrb) {
      for (var z = 0; z < ZONES.length; z++) {
        var zp0 = zonePx(ZONES[z]);
        if (Math.hypot(pointer.x - zp0[0], pointer.y - zp0[1]) < r * 1.55) { hotZone = z; break; }
      }
    }

    // zones: dim anchor dot + faint ring
    for (var zi = 0; zi < ZONES.length; zi++) {
      var zp = zonePx(ZONES[zi]);
      var occupied = countAnchored(zi, null) > 0;
      drawCircle(zp[0], zp[1], 3, rgba([42, 51, 64], 0.9));
      var a = zi === hotZone ? 0.5 : (occupied ? 0.26 : 0.13);
      strokeCircle(zp[0], zp[1], r, rgba([232, 237, 245], a), zi === hotZone ? 2 : 1.25);
      if (zi === hotZone) strokeCircle(zp[0], zp[1], r * 1.18, rgba([232, 237, 245], 0.18), 1);
    }

    // pulses
    pulses = pulses.filter(function (pu) { return t - pu.t0 < 1.4; });
    for (var pi = 0; pi < pulses.length; pi++) {
      var pu = pulses[pi];
      var age = (t - pu.t0) / 1.4;
      if (age < 0) continue;
      var pr = r * (0.45 + 1.5 * age);
      strokeCircle(pu.x, pu.y, pr, rgba(pu.rgb, 0.4 * (1 - age)), 2);
      strokeCircle(pu.x, pu.y, pr * 0.7, rgba([232, 237, 245], 0.25 * (1 - age)), 1.25);
    }

    // orbs
    for (var j = 0; j < orbs.length; j++) {
      var o = orbs[j];
      var p = orbPos(o, t, scale);
      var core = mixWhite(o.rgb, 0.75);
      var rr = o.drag ? R * 1.12 : R;
      drawCircle(p[0], p[1], rr * 2.7, rgba(o.rgb, 0.05));
      drawCircle(p[0], p[1], rr * 1.75, rgba(o.rgb, 0.10));
      drawCircle(p[0], p[1], rr * 1.15, rgba(o.rgb, 0.28));
      drawCircle(p[0], p[1], rr, rgba(o.rgb, 0.9));
      drawCircle(p[0], p[1], rr * 0.45, rgba(core, 0.95));
    }
  }

  // ---------- run ----------
  draw(PHASE); // synchronous fixed-phase first frame
  function frame() {
    draw(clockNow());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
