<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.368 Salt Air</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#E8DCC8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.368 Salt Air (jmarie.creates).
// After Julianne Haness's "Salt Air" (Faded Resort challenge):
// a dreamy coastal repeat of wave-scallop rows in washed-out
// resort tones, with gull silhouettes and soft blossom sprays
// scattered through the field. The scallops are seigaiha
// discs: rows of radius-90 discs on a 90px vertical pitch,
// each row overpainting the lower half of the row above, with
// two flat concentric arc rings inside every disc. Rows fall
// into three families by index mod 3 and drift horizontally
// at three gentle speeds: over the 48s master loop, family f
// travels exactly (f+1) whole motif periods (Q = 720px, also
// a whole multiple of the 180px disc spacing), so the field
// is seamless at rest. The 16 motifs (9 gulls, 7 blossom
// sprays) are fixed table data, tiled every Q and riding
// their own family's drift, with a small whole-cycle bob or
// sway. Double-tap changes the song: a fixed table of four
// authored entries, each a palette variant kept inside the
// muted sun-faded family (no hard blacks, ever) plus a motif
// density (8, 11, 14, then all 16). Drag pans the oversized
// repeat, clamped, and the position persists on release.
// Frame one is drawn at the constant phase T = 13.7s, rows
// mid-drift; the animation clock is anchored to that constant
// plus elapsed time, never a wall-clock offset. Flat colour
// only, one canvas, no gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var R = 90;                 // scallop disc radius; spacing 2R, row pitch R
var Q = 720;                // motif tiling period; Q % (2R) === 0
var LOOP = 48;              // seconds, seamless master loop
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 13.7, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var songIdx = 0;
var userPanX = 0, userPanY = 0;
var PANX = 260, PANY = 180;

// ---- songs: 4 authored palette variants + densities ------------
// ground: page and field ground. tints: the three row fills
// (sea, sand, coral roles). line: scallop arc ink. petal,
// centre, leaf: blossom spray colours. gull: gull ink.
// density: how many of the 16 ranked motifs show.
var SONGS = [
  { ground: '#E8DCC8', tints: ['#A8C8C0', '#E8DCC8', '#E8A68C'], line: '#3E5A72', gull: '#3E5A72', petal: '#E8A68C', centre: '#E8DCC8', leaf: '#A8C8C0', density: 8 },
  { ground: '#EFE3CC', tints: ['#9FBFAE', '#EFE3CC', '#E29A80'], line: '#466578', gull: '#466578', petal: '#E29A80', centre: '#EFE3CC', leaf: '#9FBFAE', density: 11 },
  { ground: '#E6E6DA', tints: ['#B7D3CB', '#E6E6DA', '#EFC0AB'], line: '#57707F', gull: '#57707F', petal: '#EFC0AB', centre: '#E6E6DA', leaf: '#B7D3CB', density: 14 },
  { ground: '#DFD2BC', tints: ['#8FB4AC', '#DFD2BC', '#D98F74'], line: '#38506A', gull: '#38506A', petal: '#D98F74', centre: '#DFD2BC', leaf: '#8FB4AC', density: 16 }
];
var SONG = SONGS[0];

// Row tint pattern over a 12-row cycle: sea-heavy, sand
// breathing rows, a coral accent every few rows.
var ROWTINT = [0, 1, 0, 0, 2, 0, 1, 0, 2, 0, 1, 0];

// ---- motifs: 16 fixed entries ----------------------------------
// [family, x in Q tile, y, type (0 gull, 1 blossom), scale,
//  phase, rank]. Rank orders the density reveal, so each song
// shows a spread across the field, never a clump.
var MOTIFS = [
  [0,  90, 120, 0, 1.15, 0.0,  0],
  [1, 380, 210, 0, 0.90, 1.7,  3],
  [2, 590,  90, 0, 1.30, 3.1,  6],
  [0, 520, 330, 0, 1.00, 2.2,  9],
  [1, 150, 470, 0, 1.25, 4.0, 12],
  [2, 300, 560, 0, 0.85, 5.3,  2],
  [0, 660, 640, 0, 1.05, 0.9, 14],
  [1,  60, 760, 0, 1.20, 2.8,  5],
  [2, 470, 800, 0, 0.95, 4.6, 10],
  [1, 250, 300, 1, 1.10, 1.1,  1],
  [2, 640, 420, 1, 0.95, 2.9,  4],
  [0, 330, 700, 1, 1.20, 5.8,  7],
  [1, 560, 180, 1, 0.90, 3.7,  8],
  [2, 120, 620, 1, 1.05, 0.4, 11],
  [0, 200, 830, 1, 1.00, 4.9, 13],
  [1, 690, 730, 1, 1.15, 2.0, 15]
];
(function () {
  var i, m, famCount = [0, 0, 0], rankSeen = {}, gulls = 0, sprays = 0;
  if (SONGS.length !== 4) throw new Error('need exactly 4 songs');
  if (Q % (2 * R) !== 0) throw new Error('motif period must be a whole multiple of the disc spacing');
  for (i = 1; i < SONGS.length; i++) {
    if (SONGS[i].density <= SONGS[i - 1].density) throw new Error('song densities must strictly increase');
  }
  if (SONGS[SONGS.length - 1].density !== MOTIFS.length) throw new Error('the last song must show every motif');
  if (MOTIFS.length !== 16) throw new Error('need exactly 16 motifs');
  for (i = 0; i < MOTIFS.length; i++) {
    m = MOTIFS[i];
    if (m[0] < 0 || m[0] > 2) throw new Error('motif family must be 0, 1 or 2');
    famCount[m[0]]++;
    if (m[1] < 0 || m[1] >= Q) throw new Error('motif x must sit inside the Q tile');
    if (rankSeen[m[6]]) throw new Error('motif ranks must be unique');
    rankSeen[m[6]] = true;
    if (m[3] === 0) gulls++; else if (m[3] === 1) sprays++; else throw new Error('motif type must be 0 or 1');
  }
  if (famCount[0] < 4 || famCount[1] < 4 || famCount[2] < 4) throw new Error('each family needs at least 4 motifs');
  if (gulls !== 9 || sprays !== 7) throw new Error('need exactly 9 gulls and 7 blossom sprays');
})();

// ---- drift ------------------------------------------------------
// Phase in the master loop; family f travels (f+1) whole
// motif periods per loop.
function phase() { return ((T % LOOP) + LOOP) % LOOP / LOOP; }
function driftOf(fam) { return phase() * Q * (fam + 1); }

// ---- scallop rows ----------------------------------------------
function disc(x, y, tint) {
  ctx.fillStyle = tint;
  ctx.beginPath();
  ctx.arc(x, y, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = SONG.line;
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x, y, R * 0.97, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, R * 0.66, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, R * 0.36, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawRows() {
  var jMin = Math.floor((-userPanY - 2 * R) / R);
  var jMax = Math.ceil((DH - userPanY + 2 * R) / R);
  var j, cy, fam, tint, shift, base, x;
  for (j = jMin; j <= jMax; j++) {
    cy = j * R + userPanY;
    fam = ((j % 3) + 3) % 3;
    tint = SONG.tints[ROWTINT[((j % 12) + 12) % 12]];
    shift = -driftOf(fam) + userPanX + (((j % 2) + 2) % 2 !== 0 ? R : 0);
    base = ((shift % (2 * R)) + 2 * R) % (2 * R);
    for (x = base - 2 * R; x <= DW + 2 * R; x += 2 * R) {
      disc(x, cy, tint);
    }
  }
}

// ---- motifs ------------------------------------------------------
// Gull: one stroked double-arc glyph with a small body mass,
// drawn in local coords around the origin.
function drawGull() {
  ctx.strokeStyle = SONG.gull;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-30, 3);
  ctx.quadraticCurveTo(-16, -13, 0, -3);
  ctx.quadraticCurveTo(16, -13, 30, 3);
  ctx.stroke();
  ctx.fillStyle = SONG.gull;
  ctx.beginPath();
  ctx.ellipse(0, -2, 6, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();
}
function blossomHead(x, y, r) {
  var k, a, px, py;
  ctx.fillStyle = SONG.petal;
  for (k = 0; k < 5; k++) {
    a = k * Math.PI * 2 / 5 - Math.PI / 2;
    px = x + Math.cos(a) * r * 0.52;
    py = y + Math.sin(a) * r * 0.52;
    ctx.beginPath();
    ctx.arc(px, py, r * 0.55, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = SONG.centre;
  ctx.beginPath();
  ctx.arc(x, y, r * 0.34, 0, Math.PI * 2);
  ctx.fill();
}
function leafShape(x, y, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = SONG.leaf;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(7, -4, 15, 0);
  ctx.quadraticCurveTo(7, 4, 0, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
// Blossom spray: a curved stem growing up from the origin,
// two leaves, three blossom heads and one bud.
function drawSpray() {
  ctx.strokeStyle = SONG.leaf;
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-7, -32, 12, -66);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-2, -20);
  ctx.quadraticCurveTo(-14, -30, -18, -40);
  ctx.stroke();
  leafShape(-6, -26, -0.7);
  leafShape(4, -44, 0.6);
  blossomHead(12, -72, 15);
  blossomHead(-20, -47, 11.5);
  blossomHead(3, -33, 10);
  ctx.fillStyle = SONG.petal;
  ctx.beginPath();
  ctx.arc(17, -54, 5, 0, Math.PI * 2);
  ctx.fill();
}
function drawMotifs() {
  var ph = phase();
  var i, m, drift, bobY, sway, bx, x, y;
  for (i = 0; i < MOTIFS.length; i++) {
    m = MOTIFS[i];
    if (m[6] >= SONG.density) continue;
    drift = driftOf(m[0]);
    if (m[3] === 0) {
      bobY = 4 * Math.sin(Math.PI * 2 * 3 * ph + m[5]);
      sway = 0.02 * Math.sin(Math.PI * 2 * 3 * ph + m[5]);
    } else {
      bobY = 0;
      sway = 0.05 * Math.sin(Math.PI * 2 * 2 * ph + m[5]);
    }
    bx = m[1] - drift + userPanX;
    y = m[2] + userPanY + bobY;
    if (y < -140 || y > DH + 140) continue;
    for (x = bx - 3 * Q; x <= bx + 3 * Q; x += Q) {
      if (x < -160 || x > DW + 160) continue;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(sway);
      ctx.scale(m[4], m[4]);
      if (m[3] === 0) drawGull(); else drawSpray();
      ctx.restore();
    }
  }
}

// ---- drawing -----------------------------------------------------
function draw() {
  SONG = SONGS[songIdx];
  ctx.fillStyle = SONG.ground;
  ctx.fillRect(0, 0, DW, DH);
  drawRows();
  drawMotifs();
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag pans (persists); double-tap changes the song ---------
var dragging = false, dragMoved = false, downX = 0, downY = 0, lastDX = 0, lastDY = 0;
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true; dragMoved = false;
  downX = p.x; downY = p.y; lastDX = p.x; lastDY = p.y;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p.x - lastDX, dy = p.y - lastDY;
  lastDX = p.x; lastDY = p.y;
  if (Math.abs(p.x - downX) + Math.abs(p.y - downY) > 8) dragMoved = true;
  if (dragMoved) {
    userPanX += dx; userPanY += dy;
    if (userPanX > PANX) userPanX = PANX;
    if (userPanX < -PANX) userPanX = -PANX;
    if (userPanY > PANY) userPanY = PANY;
    if (userPanY < -PANY) userPanY = -PANY;
  }
});
canvas.addEventListener('pointerup', function (e) {
  if (!dragging) return;
  dragging = false;
  if (dragMoved) return;
  var p = toDesign(e);
  var nearLast = Math.abs(p.x - lastTapX) + Math.abs(p.y - lastTapY) < 60;
  if (T - lastTapT < 0.38 && nearLast) {
    songIdx = (songIdx + 1) % SONGS.length;
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = p.x; lastTapY = p.y;
  }
});
canvas.addEventListener('pointercancel', function () { dragging = false; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK;
    acc -= TICK; guard++;
  }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
