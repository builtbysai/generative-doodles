<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oblong Tiger</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1A1A2E; overflow: hidden; }
  canvas { display: block; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (flat fills only, no gradients anywhere, ever)
  var RED = '#E53B2C', LIME = '#9ACD32', YELLOW = '#FFD400',
      NIGHT = '#1A1A2E', EGG = '#F5E9C8', WHITE = '#FFFFFF';
  var INK = NIGHT; // smiley features drawn in the night colour

  var PHASE0 = 2.6; // constant first-frame loop phase

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---- seeded static fields: stars + grain (precomputed speckle/stroke arrays) ----
  var rng = mulberry32(521063);
  var stars = [];
  for (var i = 0; i < 130; i++) {
    stars.push({
      x: rng() * 1080, y: rng() * 470,
      r: 1.2 + rng() * 2.4, tw: rng() * Math.PI * 2,
      cross: rng() < 0.22
    });
  }
  var GRAIN_COLORS = [RED, LIME, YELLOW, EGG, WHITE, NIGHT];
  var grain = [];
  for (i = 0; i < 620; i++) {
    grain.push({
      x: rng() * 1080, y: rng() * 1080,
      len: 3 + rng() * 7, ang: rng() * Math.PI,
      col: GRAIN_COLORS[Math.floor(rng() * GRAIN_COLORS.length)],
      a: 0.05 + rng() * 0.10
    });
  }

  // ---- sizing ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw(simT);
  }

  // ---- tiger body: one big bezier silhouette (head at right, rear at left) ----
  function bodyPath() {
    ctx.beginPath();
    ctx.moveTo(118, 486);                                   // rump top
    ctx.quadraticCurveTo(316, 428, 560, 438);               // long back
    ctx.quadraticCurveTo(716, 444, 792, 428);               // shoulder rise
    ctx.quadraticCurveTo(806, 372, 836, 362);               // ear one (soft bump)
    ctx.quadraticCurveTo(862, 356, 876, 420);               // ear one down
    ctx.quadraticCurveTo(906, 404, 934, 366);               // ear two
    ctx.quadraticCurveTo(962, 356, 972, 428);               // ear two down
    ctx.quadraticCurveTo(1014, 470, 1018, 552);             // forehead to nose
    ctx.quadraticCurveTo(1020, 592, 986, 612);              // nose tip round
    ctx.lineTo(884, 646);                                   // upper jaw, mouth roof
    ctx.lineTo(922, 700);                                   // mouth back corner
    ctx.lineTo(972, 742);                                   // lower jaw front
    ctx.quadraticCurveTo(956, 806, 876, 826);               // jaw underside
    ctx.quadraticCurveTo(800, 846, 726, 838);               // chest to belly
    ctx.lineTo(690, 838);                                   // hind leg bump
    ctx.quadraticCurveTo(680, 892, 646, 894);
    ctx.quadraticCurveTo(612, 892, 606, 842);
    ctx.quadraticCurveTo(470, 862, 372, 846);               // belly
    ctx.lineTo(336, 850);                                   // front leg bump
    ctx.quadraticCurveTo(326, 900, 292, 902);
    ctx.quadraticCurveTo(258, 900, 252, 846);
    ctx.quadraticCurveTo(150, 824, 112, 730);               // rear underside
    ctx.quadraticCurveTo(84, 600, 118, 486);                // rump round
    ctx.closePath();
  }

  // ---- tail: spine points, base bottom-left rear, tip curling at top-right ----
  var TAIL_BASE = [
    [150, 742], [92, 596], [104, 428], [196, 292], [368, 200],
    [566, 162], [742, 172], [852, 214], [902, 268], [892, 316], [852, 328]
  ];
  function tailPoint(t, idx) {
    var p = TAIL_BASE[idx];
    var f = idx / (TAIL_BASE.length - 1);                   // sway grows toward the tip
    var dx = Math.sin(t * 0.55 + idx * 0.62) * 15 * f;
    var dy = Math.cos(t * 0.44 + idx * 0.5) * 11 * f;
    return [p[0] + dx, p[1] + dy];
  }
  function drawTail(t) {
    var base = [], i, j, k;
    for (i = 0; i < TAIL_BASE.length; i++) base.push(tailPoint(t, i));
    // smooth the spine: Catmull-Rom through the swayed base points
    var pts = [];
    var SUB = 5;
    for (i = 0; i < base.length - 1; i++) {
      var p0 = base[Math.max(0, i - 1)], p1 = base[i], p2 = base[i + 1],
          p3 = base[Math.min(base.length - 1, i + 2)];
      for (k = 0; k < SUB; k++) {
        var u = k / SUB, u2 = u * u, u3 = u2 * u;
        pts.push([
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)
        ]);
      }
    }
    pts.push(base[base.length - 1].slice());
    function widthAt(f) { return 56 - 30 * f; }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // tapering body: short round strokes along the smooth spine
    for (i = 0; i < pts.length - 1; i++) {
      var f = i / (pts.length - 1);
      ctx.strokeStyle = RED; ctx.lineWidth = widthAt(f);
      ctx.beginPath();
      ctx.moveTo(pts[i][0], pts[i][1]);
      ctx.lineTo(pts[i + 1][0], pts[i + 1][1]);
      ctx.stroke();
    }
    // lime bands: short spine segments stroked at the local tail width
    var bandF = [0.14, 0.36, 0.58, 0.79];
    for (i = 0; i < bandF.length; i++) {
      var bf = bandF[i];
      j = Math.round(bf * (pts.length - 1));
      ctx.strokeStyle = LIME; ctx.lineWidth = widthAt(bf) + 2;
      ctx.beginPath();
      ctx.moveTo(pts[j - 1][0], pts[j - 1][1]);
      ctx.lineTo(pts[j + 1][0], pts[j + 1][1]);
      ctx.stroke();
    }
    return base;
  }

  function drawStripes() {
    ctx.save();
    bodyPath();
    ctx.clip();
    ctx.strokeStyle = LIME;
    ctx.lineCap = 'round';
    // broad curved bands following the body, top edge to bottom edge
    var bands = [
      [238, 20], [352, 34], [468, 26], [584, 38], [694, 28],
      [788, 22], [872, 18], [958, 14]
    ];
    for (var i = 0; i < bands.length; i++) {
      var x = bands[i][0];
      ctx.lineWidth = bands[i][1];
      ctx.beginPath();
      ctx.moveTo(x - 30, 400);
      ctx.quadraticCurveTo(x + 26, 640, x - 14, 880);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSmiley(cx, cy, r) {
    ctx.fillStyle = YELLOW;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(cx - r * 0.36, cy - r * 0.16, r * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.36, cy - r * 0.16, r * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = r * 0.13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy + r * 0.08, r * 0.52, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
  }

  function drawFace() {
    // nose patch at the snout tip
    ctx.fillStyle = EGG;
    ctx.beginPath(); ctx.ellipse(998, 576, 17, 24, 0.25, 0, Math.PI * 2); ctx.fill();
    // fangs: two down from the jaw roof, two up from the lower jaw
    ctx.fillStyle = WHITE;
    var down = [[918, 640, 22, 44], [962, 632, 18, 36]];
    var up = [[934, 706, 18, 34], [968, 716, 15, 28]];
    var i, f;
    for (i = 0; i < down.length; i++) {
      f = down[i];
      ctx.beginPath();
      ctx.moveTo(f[0] - f[2] / 2, f[1]); ctx.lineTo(f[0] + f[2] / 2, f[1]); ctx.lineTo(f[0], f[1] + f[3]);
      ctx.closePath(); ctx.fill();
    }
    for (i = 0; i < up.length; i++) {
      f = up[i];
      ctx.beginPath();
      ctx.moveTo(f[0] - f[2] / 2, f[1]); ctx.lineTo(f[0] + f[2] / 2, f[1]); ctx.lineTo(f[0], f[1] - f[3]);
      ctx.closePath(); ctx.fill();
    }
    // eyes are symbols: two yellow smiley faces
    drawSmiley(838, 520, 41);
    drawSmiley(938, 502, 37);
  }

  function drawArches() {
    ctx.strokeStyle = EGG; ctx.lineWidth = 11; ctx.lineCap = 'round';
    var xs = [86, 424, 762], w = 232, top = 66, base = 244;
    for (var i = 0; i < 3; i++) {
      var x = xs[i];
      ctx.beginPath();
      ctx.moveTo(x, base);
      ctx.lineTo(x, top + w / 2);
      ctx.arc(x + w / 2, top + w / 2, w / 2, Math.PI, 0);
      ctx.lineTo(x + w, base);
      ctx.stroke();
    }
  }

  function drawCandle(cx, cy, s, t, ph) {
    // melting U-shaped candle: thick cream stroke bent into a U
    ctx.strokeStyle = EGG; ctx.lineCap = 'round'; ctx.lineWidth = 17 * s;
    ctx.beginPath();
    ctx.moveTo(cx - 26 * s, cy - 34 * s);
    ctx.quadraticCurveTo(cx - 28 * s, cy + 26 * s, cx, cy + 30 * s);
    ctx.quadraticCurveTo(cx + 28 * s, cy + 26 * s, cx + 24 * s, cy - 22 * s);
    ctx.stroke();
    // wax drips
    ctx.fillStyle = EGG;
    ctx.beginPath(); ctx.ellipse(cx - 27 * s, cy + 2 * s, 5 * s, 10 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 25 * s, cy + 10 * s, 4 * s, 8 * s, 0, 0, Math.PI * 2); ctx.fill();
    // flame at the taller tip, flickering
    var fl = 1 + Math.sin(t * 7.3 + ph) * 0.16 + Math.sin(t * 13.1 + ph * 2) * 0.07;
    var fx = cx - 26 * s + Math.sin(t * 5.1 + ph) * 2.4 * s, fy = cy - 34 * s;
    ctx.fillStyle = YELLOW;
    ctx.beginPath();
    ctx.moveTo(fx, fy - 26 * s * fl);
    ctx.quadraticCurveTo(fx + 9 * s, fy - 8 * s, fx, fy);
    ctx.quadraticCurveTo(fx - 9 * s, fy - 8 * s, fx, fy - 26 * s * fl);
    ctx.fill();
    ctx.fillStyle = WHITE;
    ctx.beginPath(); ctx.ellipse(fx, fy - 8 * s, 2.6 * s, 4.6 * s * fl, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawStopwatch(cx, cy, r, t) {
    ctx.fillStyle = EGG;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = NIGHT; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(cx, cy, r - 3, 0, Math.PI * 2); ctx.stroke();
    // crown + ring on top (the impossible part: it floats, so it tilts)
    ctx.save();
    ctx.translate(cx, cy - r);
    ctx.rotate(Math.sin(t * 0.7) * 0.1);
    ctx.fillStyle = EGG;
    ctx.fillRect(-9, -13, 18, 10);
    ctx.strokeStyle = EGG; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, -24, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    // dots for numerals
    ctx.fillStyle = NIGHT;
    for (var i = 0; i < 12; i++) {
      var a = i / 12 * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * r * 0.74, cy + Math.sin(a) * r * 0.74, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
    // three hands at impossible angles
    ctx.lineCap = 'round';
    var hands = [
      { a: -2.2 + Math.sin(t * 0.9) * 0.06, l: 0.62, w: 5, c: NIGHT },
      { a: 0.7, l: 0.8, w: 4, c: RED },
      { a: 2.6 + t * 0.25, l: 0.88, w: 2.5, c: NIGHT }
    ];
    for (i = 0; i < hands.length; i++) {
      var h = hands[i];
      ctx.strokeStyle = h.c; ctx.lineWidth = h.w;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(h.a) * r * h.l, cy + Math.sin(h.a) * r * h.l);
      ctx.stroke();
    }
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = NIGHT;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    // stars: slow drift + twinkle, some as four-point sparkles
    var drift = (t * 4) % 1080;
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var sx = (st.x + drift) % 1080;
      var al = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.7 + st.tw));
      ctx.globalAlpha = al;
      ctx.fillStyle = EGG;
      if (st.cross) {
        ctx.save();
        ctx.translate(sx, st.y);
        ctx.beginPath();
        ctx.moveTo(0, -st.r * 2.6); ctx.lineTo(st.r * 0.7, -st.r * 0.7);
        ctx.lineTo(st.r * 2.6, 0); ctx.lineTo(st.r * 0.7, st.r * 0.7);
        ctx.lineTo(0, st.r * 2.6); ctx.lineTo(-st.r * 0.7, st.r * 0.7);
        ctx.lineTo(-st.r * 2.6, 0); ctx.lineTo(-st.r * 0.7, -st.r * 0.7);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(sx, st.y, st.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // tail behind the body, sweeping bottom-left to top-right
    var pts = drawTail(t);
    var tip = pts[pts.length - 1];

    // tiger body + clipped stripes + face
    ctx.fillStyle = RED;
    bodyPath();
    ctx.fill();
    drawStripes();
    drawFace();

    // arch band across the top, in front of the tail for depth
    drawArches();

    // floating sky objects
    drawCandle(268, 356, 1.0, t, 0.0);
    drawCandle(474, 318, 0.8, t, 2.1);
    drawStopwatch(668, 330, 46, t);

    // moon-egg cradled in the tail curl, bobbing with the tip
    var ex = 872 + (tip[0] - TAIL_BASE[TAIL_BASE.length - 1][0]) * 0.7;
    var ey = 282 + (tip[1] - TAIL_BASE[TAIL_BASE.length - 1][1]) * 0.7 + Math.sin(t * 0.9) * 5;
    ctx.fillStyle = EGG;
    ctx.beginPath(); ctx.ellipse(ex, ey, 52, 62, 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = YELLOW;
    var craters = [[-16, -14, 8], [14, 6, 6], [-4, 22, 5]];
    for (i = 0; i < craters.length; i++) {
      ctx.beginPath();
      ctx.arc(ex + craters[i][0], ey + craters[i][1], craters[i][2], 0, Math.PI * 2);
      ctx.fill();
    }
    // tail tip curling over the egg base: the cradle
    ctx.strokeStyle = RED; ctx.lineCap = 'round'; ctx.lineWidth = 25;
    ctx.beginPath();
    ctx.moveTo(tip[0], tip[1]);
    ctx.quadraticCurveTo(ex - 8, ey + 62, ex + 30, ey + 44);
    ctx.stroke();
    ctx.strokeStyle = LIME; ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(tip[0] + 3, tip[1] + 2);
    ctx.quadraticCurveTo(ex - 4, ey + 62, ex + 24, ey + 48);
    ctx.stroke();

    // gouache grain: precomputed sparse short strokes over the fills
    ctx.lineCap = 'round';
    for (i = 0; i < grain.length; i++) {
      var g = grain[i];
      ctx.globalAlpha = g.a;
      ctx.strokeStyle = g.col;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x + Math.cos(g.ang) * g.len, g.y + Math.sin(g.ang) * g.len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
