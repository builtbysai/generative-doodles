<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9,500 Kilometers</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; height: 100%; }
  canvas { display: block; position: fixed; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Seeded RNG, mulberry32. No live randomness, no wall clock anywhere in drawn state.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  black: '#0A0A0A',
  tpDark: '#1A1410',
  amber: '#FFB000',
  chDark: '#0E1418',
  ice: '#7FD8E8',
  white: '#E8E8E0'
};
var TAU = Math.PI * 2;
var TRAVEL = 4.0; // seconds across. The distance is fixed and never shortened.

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 720, H = 720, phone = false;

function fit() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  W = vv ? vv.width : (window.innerWidth || 720);
  H = vv ? vv.height : (window.innerHeight || 720);
  if (canvas.width !== W) canvas.width = W;
  if (canvas.height !== H) canvas.height = H;
  var sw = (window.screen && window.screen.width) ? window.screen.width : W;
  var sh = (window.screen && window.screen.height) ? window.screen.height : H;
  phone = (Math.min(sw, sh) < 700) || (H > W * 1.15);
}
fit();

// ---------- Seeded fields ----------

var rngField = mulberry32(950107);

// Taipei: dense warm particle weather.
var MOTES = [];
for (var i = 0; i < 150; i++) {
  MOTES.push({
    bx: 0.015 + rngField() * 0.465,
    by: 0.02 + rngField() * 0.96,
    ax: 0.004 + rngField() * 0.013,
    ay: 0.005 + rngField() * 0.016,
    wx: TAU / (9 + rngField() * 17),
    wy: TAU / (11 + rngField() * 19),
    px: rngField() * TAU,
    py: rngField() * TAU,
    r: 0.8 + rngField() * 1.7,
    a: 0.22 + rngField() * 0.6,
    halo: rngField() < 0.16
  });
}

// Switzerland: sparse cold filaments.
var FILS = [];
for (var j = 0; j < 26; j++) {
  FILS.push({
    cx: 0.535 + rngField() * 0.435,
    cy: 0.05 + rngField() * 0.9,
    len: 0.035 + rngField() * 0.06,
    a0: rngField() * TAU,
    wa: TAU / (14 + rngField() * 18),
    pa: rngField() * TAU,
    wob: 0.1 + rngField() * 0.16,
    ax: 0.003 + rngField() * 0.008,
    wx: TAU / (16 + rngField() * 20),
    px: rngField() * TAU,
    a: 0.16 + rngField() * 0.34,
    head: rngField() < 0.4
  });
}

// ---------- Pulses ----------

var seedCounter = 1000;
var pulses = [];
var rngAuto = mulberry32(4451);
var rngLive = mulberry32(20261);

function makePulse(t0, fromL, ox, oy, rngS) {
  var ax = fromL ? 0.60 + rngS() * 0.34 : 0.06 + rngS() * 0.34;
  var ay = oy + (rngS() - 0.5) * 0.26;
  if (ay < 0.05) ay = 0.05;
  if (ay > 0.95) ay = 0.95;
  seedCounter += 7;
  return { t0: t0, fromL: fromL, ox: ox, oy: oy, ax: ax, ay: ay,
           seed: seedCounter, answered: false, emitted: false, fx: null };
}

// Frame one pulse: left Taipei at t = -2.0, so at t = 0 it is mid-crossing.
pulses.push({ t0: -2.0, fromL: true, ox: 0.34, oy: 0.46, ax: 0.72, ay: 0.44,
              seed: 777, answered: true, emitted: true, fx: null });

// Autonomous exchange: slow seeded cadence, alternating sides, 14 to 22 s apart.
(function () {
  var t = 7.5, fromL = false;
  while (t < 3600) {
    var ox = fromL ? 0.06 + rngAuto() * 0.38 : 0.56 + rngAuto() * 0.38;
    var oy = 0.08 + rngAuto() * 0.84;
    pulses.push(makePulse(t, fromL, ox, oy, rngAuto));
    t += 14 + rngAuto() * 8;
    fromL = !fromL;
  }
})();

var silences = []; // start times of double-tap holds, each 3 s

function dimAt(t) {
  var d = 1;
  for (var i = 0; i < silences.length; i++) {
    var s = silences[i];
    if (t >= s && t <= s + 3) {
      var f;
      if (t < s + 0.4) f = (t - s) / 0.4;
      else if (t > s + 2.4) f = (s + 3 - t) / 0.6;
      else f = 1;
      var cand = 1 - 0.88 * f;
      if (cand < d) d = cand;
    }
  }
  return d;
}

function posAt(p, pr) {
  var e = pr * 0.75 + 0.25 * (pr * pr * (3 - 2 * pr));
  return {
    x: p.ox + (p.ax - p.ox) * e,
    y: p.oy + (p.ay - p.oy) * e + 0.012 * Math.sin(pr * TAU + p.seed)
  };
}

// Arrival transformation parameters, derived deterministically from the pulse seed.
function arrivalFx(p) {
  if (p.fx) return p.fx;
  var r = mulberry32((p.seed * 31 + 12345) >>> 0);
  var fx = { fils: [], motes: [] };
  var nf = 2 + Math.floor(r() * 2); // 2 to 3 cold filaments
  for (var i = 0; i < nf; i++) {
    fx.fils.push({
      ang: r() * TAU,
      len: 0.03 + r() * 0.045,
      off: (r() - 0.5) * 0.03,
      drift: 0.004 + r() * 0.008,
      bow: (r() - 0.5) * 0.02
    });
  }
  var nm = 10 + Math.floor(r() * 5); // 10 to 14 warm motes
  for (var k = 0; k < nm; k++) {
    fx.motes.push({
      ang: r() * TAU,
      spd: 0.02 + r() * 0.045,
      r: 0.9 + r() * 1.3,
      a: 0.4 + r() * 0.4
    });
  }
  p.fx = fx;
  return fx;
}

// ---------- Audio (lazy, first gesture only, fully guarded) ----------

var AC = null, pulseBus = null;

function ensureAudio() {
  if (AC) {
    try { if (AC.resume) AC.resume(); } catch (err) {}
    return;
  }
  var Ctor = null;
  if (typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext)) {
    Ctor = window.AudioContext || window.webkitAudioContext;
  } else if (typeof AudioContext !== 'undefined') {
    Ctor = AudioContext;
  }
  if (!Ctor) return;
  try {
    AC = new Ctor();
    var master = AC.createGain();
    master.gain.value = 0.9;
    var limiter = AC.createDynamicsCompressor();
    limiter.threshold.value = -14;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.002;
    limiter.release.value = 0.3;
    master.connect(limiter);
    limiter.connect(AC.destination);

    // Taipei warm bed: looped noise through a low filter.
    var nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    var nd = nb.getChannelData(0);
    var lr = mulberry32(8181);
    for (var i = 0; i < nd.length; i++) nd[i] = lr() * 2 - 1;
    var noise = AC.createBufferSource();
    noise.buffer = nb;
    noise.loop = true;
    var warmLP = AC.createBiquadFilter();
    warmLP.type = 'lowpass';
    warmLP.frequency.value = 360;
    var warmGain = AC.createGain();
    warmGain.gain.value = 0.045;
    noise.connect(warmLP);
    warmLP.connect(warmGain);
    warmGain.connect(master);
    noise.start();

    // The 9,500 km line: a real 4.0 s delay whose feedback path transforms the signal.
    var delay = AC.createDelay(5.0);
    delay.delayTime.value = TRAVEL;
    var loopLP = AC.createBiquadFilter();
    loopLP.type = 'lowpass';
    loopLP.frequency.value = 950; // warmth thins as it crosses
    var fb = AC.createGain();
    fb.gain.value = 0.34;
    delay.connect(loopLP);
    loopLP.connect(fb);
    fb.connect(delay);
    // Cold return tap (toward Switzerland's thin air).
    var coldHP = AC.createBiquadFilter();
    coldHP.type = 'highpass';
    coldHP.frequency.value = 2000;
    var coldGain = AC.createGain();
    coldGain.gain.value = 0.06;
    delay.connect(coldHP);
    coldHP.connect(coldGain);
    coldGain.connect(master);
    // Warm return tap (toward Taipei).
    var warmTapLP = AC.createBiquadFilter();
    warmTapLP.type = 'lowpass';
    warmTapLP.frequency.value = 480;
    var warmTapGain = AC.createGain();
    warmTapGain.gain.value = 0.1;
    delay.connect(warmTapLP);
    warmTapLP.connect(warmTapGain);
    warmTapGain.connect(master);
    // The warm bed also feeds the line, so the loop is always carrying something.
    var sendGain = AC.createGain();
    sendGain.gain.value = 0.5;
    warmGain.connect(sendGain);
    sendGain.connect(delay);

    // Pulse bus: what a performer plays enters both the room and the line.
    pulseBus = AC.createGain();
    pulseBus.gain.value = 1;
    pulseBus.connect(master);
    pulseBus.connect(delay);
  } catch (err) {
    AC = null;
    pulseBus = null;
  }
}

function tone(freq, dur, gain, type) {
  if (!AC || !pulseBus) return;
  try {
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(gain, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g);
    g.connect(pulseBus);
    o.start();
    o.stop(AC.currentTime + dur + 0.05);
  } catch (err) {}
}

// ---------- Events over time (answers + audio triggers) ----------

function stepEvents(a, b) {
  var allowAudio = (b - a) < 1.0; // skip sound bursts after a long hidden gap
  for (var i = 0; i < pulses.length; i++) {
    var p = pulses[i];
    if (!p.emitted && p.t0 > a && p.t0 <= b) {
      p.emitted = true;
      if (allowAudio) {
        if (p.fromL) tone(196, 0.8, 0.1, 'triangle');
        else tone(1244, 0.5, 0.04, 'sine');
      }
    }
    var arrT = p.t0 + TRAVEL;
    if (!p.answered && arrT > a && arrT <= b) {
      p.answered = true;
      if (allowAudio) {
        if (p.fromL) { tone(1568, 0.9, 0.045, 'sine'); tone(2093, 0.7, 0.03, 'sine'); }
        else tone(165, 1.1, 0.1, 'triangle');
      }
      // The far side answers after a short dwell, most of the time.
      if (rngLive() < 0.62) {
        var dwell = 2 + rngLive() * 2.5;
        var ox2 = p.ax + (rngLive() - 0.5) * 0.06;
        var oy2 = p.ay + (rngLive() - 0.5) * 0.1;
        if (oy2 < 0.05) oy2 = 0.05;
        if (oy2 > 0.95) oy2 = 0.95;
        pulses.push(makePulse(arrT + dwell, !p.fromL, ox2, oy2, rngLive));
      }
    }
  }
}

// ---------- Draw ----------

function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var u = Math.min(W, H);
  var seamX = W * 0.5;
  var D = dimAt(t);
  var sizeF = (u / 720) * (phone ? 1.3 : 1);
  var i, p, pos;

  ctx.globalAlpha = 1;
  ctx.fillStyle = COL.black;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = COL.tpDark;
  ctx.fillRect(0, 0, seamX, H);
  ctx.fillStyle = COL.chDark;
  ctx.fillRect(seamX, 0, W - seamX, H);

  // Taipei motes: thick, warm, humid.
  ctx.fillStyle = COL.amber;
  for (i = 0; i < MOTES.length; i++) {
    var m = MOTES[i];
    var mx = (m.bx + m.ax * Math.sin(m.wx * t + m.px)) * W;
    var my = (m.by + m.ay * Math.sin(m.wy * t + m.py)) * H;
    if (m.halo) {
      ctx.globalAlpha = m.a * 0.1 * D;
      ctx.beginPath();
      ctx.arc(mx, my, m.r * 3 * sizeF, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = m.a * D;
    ctx.beginPath();
    ctx.arc(mx, my, Math.max(0.6, m.r * sizeF), 0, TAU);
    ctx.fill();
  }

  // Swiss filaments: sparse, thin, cold.
  ctx.strokeStyle = COL.ice;
  ctx.fillStyle = COL.ice;
  for (i = 0; i < FILS.length; i++) {
    var f = FILS[i];
    var fx0 = (f.cx + f.ax * Math.sin(f.wx * t + f.px)) * W;
    var fy0 = (f.cy + f.ax * 0.8 * Math.cos(f.wx * 0.8 * t + f.px)) * H;
    var ang = f.a0 + 0.4 * Math.sin(f.wa * t + f.pa);
    var dx = Math.cos(ang), dy = Math.sin(ang);
    var pxn = -dy, pyn = dx;
    var L = f.len * u;
    ctx.globalAlpha = f.a * D;
    ctx.lineWidth = phone ? 1.4 : 1.1;
    ctx.beginPath();
    for (var s = 0; s <= 3; s++) {
      var g = s / 3 - 0.5;
      var bx = fx0 + dx * L * g + pxn * Math.sin(g * Math.PI) * f.wob * L * 0.3;
      var by = fy0 + dy * L * g + pyn * Math.sin(g * Math.PI) * f.wob * L * 0.3;
      if (s === 0) ctx.moveTo(bx, by); else ctx.lineTo(bx, by);
    }
    ctx.stroke();
    if (f.head) {
      ctx.globalAlpha = f.a * 0.9 * D;
      ctx.beginPath();
      ctx.arc(fx0 + dx * L * 0.5, fy0 + dy * L * 0.5, Math.max(0.7, 1.1 * sizeF), 0, TAU);
      ctx.fill();
    }
  }

  // Arrival transformations: flares and spawned matter.
  var fxA = 0.35 + 0.65 * D;
  for (i = 0; i < pulses.length; i++) {
    p = pulses[i];
    var dt = t - (p.t0 + TRAVEL);
    if (dt < 0 || dt > 7) continue;
    var arrCol = p.fromL ? COL.ice : COL.amber; // transformed by the crossing
    var axp = p.ax * W, ayp = p.ay * H;
    var fx = arrivalFx(p);
    if (dt <= 2.6) {
      var fr = dt / 2.6;
      var ringR = (0.006 + 0.055 * (1 - Math.pow(1 - fr, 2))) * u;
      ctx.globalAlpha = 0.5 * (1 - fr) * fxA;
      ctx.strokeStyle = arrCol;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(axp, ayp, ringR, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 0.16 * (1 - fr) * fxA;
      ctx.fillStyle = arrCol;
      ctx.beginPath();
      ctx.arc(axp, ayp, 0.02 * u, 0, TAU);
      ctx.fill();
    }
    if (p.fromL) {
      // Cooled and thinned: a few new cold filaments near the arrival point.
      ctx.strokeStyle = COL.ice;
      ctx.lineWidth = phone ? 1.4 : 1.1;
      for (var fi = 0; fi < fx.fils.length; fi++) {
        var sf = fx.fils[fi];
        var env = dt < 0.6 ? dt / 0.6 : (dt > 5.5 ? Math.max(0, (7 - dt) / 1.5) : 1);
        if (env <= 0) continue;
        var sx = axp + Math.cos(sf.ang) * sf.drift * dt * u + sf.off * u;
        var sy = ayp + Math.sin(sf.ang) * sf.drift * dt * u + sf.off * u * 0.6;
        var sl = sf.len * u * Math.min(1, dt / 0.8);
        var sdx = Math.cos(sf.ang), sdy = Math.sin(sf.ang);
        ctx.globalAlpha = 0.5 * env * fxA;
        ctx.beginPath();
        ctx.moveTo(sx - sdx * sl * 0.5, sy - sdy * sl * 0.5);
        ctx.quadraticCurveTo(sx + (-sdy) * sf.bow * u, sy + sdx * sf.bow * u,
                             sx + sdx * sl * 0.5, sy + sdy * sl * 0.5);
        ctx.stroke();
      }
    } else {
      // Warmed and densified: a burst of warm motes.
      ctx.fillStyle = COL.amber;
      for (var mi = 0; mi < fx.motes.length; mi++) {
        var sm = fx.motes[mi];
        var env2 = dt < 0.3 ? dt / 0.3 : (dt > 3.5 ? Math.max(0, (5 - dt) / 1.5) : 1);
        if (env2 <= 0 || dt > 5) continue;
        var dist = sm.spd * (1 - Math.exp(-1.3 * dt)) / 1.3 * u;
        var smx = axp + Math.cos(sm.ang) * dist;
        var smy = ayp + Math.sin(sm.ang) * dist;
        ctx.globalAlpha = sm.a * env2 * fxA;
        ctx.beginPath();
        ctx.arc(smx, smy, Math.max(0.6, sm.r * sizeF), 0, TAU);
        ctx.fill();
      }
    }
  }

  // The seam: a faint line, lit where a pulse is crossing.
  ctx.strokeStyle = COL.white;
  ctx.globalAlpha = 0.13 * D;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(seamX, 0);
  ctx.lineTo(seamX, H);
  ctx.stroke();

  // Pulses on their 4 second journey.
  var pA = 0.3 + 0.7 * D;
  for (i = 0; i < pulses.length; i++) {
    p = pulses[i];
    var pr = (t - p.t0) / TRAVEL;
    if (pr < 0 || pr > 1) continue;
    pos = posAt(p, pr);
    var haloCol = p.fromL ? COL.amber : COL.ice;
    // Seam light at the crossing height.
    var seamDist = Math.abs(pos.x - 0.5);
    if (seamDist < 0.035) {
      ctx.globalAlpha = 0.45 * (1 - seamDist / 0.035) * pA;
      ctx.strokeStyle = COL.white;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(seamX, (pos.y - 0.085) * H);
      ctx.lineTo(seamX, (pos.y + 0.085) * H);
      ctx.stroke();
    }
    // Trail.
    ctx.fillStyle = haloCol;
    for (var k = 1; k <= 3; k++) {
      var tp = pr - 0.028 * k;
      if (tp < 0) continue;
      var tpos = posAt(p, tp);
      ctx.globalAlpha = 0.28 * (1 - k / 4) * pA;
      ctx.beginPath();
      ctx.arc(tpos.x * W, tpos.y * H, Math.max(0.8, 2 * sizeF), 0, TAU);
      ctx.fill();
    }
    // Glow: layered flat discs in the origin side's colour.
    ctx.fillStyle = haloCol;
    ctx.globalAlpha = 0.05 * pA;
    ctx.beginPath();
    ctx.arc(pos.x * W, pos.y * H, 0.021 * u, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 0.09 * pA;
    ctx.beginPath();
    ctx.arc(pos.x * W, pos.y * H, 0.013 * u, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 0.5 * pA;
    ctx.beginPath();
    ctx.arc(pos.x * W, pos.y * H, Math.max(1.6, 0.0075 * u), 0, TAU);
    ctx.fill();
    // White core.
    ctx.fillStyle = COL.white;
    ctx.globalAlpha = 0.95 * pA;
    ctx.beginPath();
    ctx.arc(pos.x * W, pos.y * H, Math.max(2.2, 0.0055 * u), 0, TAU);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

// ---------- Interaction ----------

var tNow = 0;
var downInfo = null;
var lastInjectT = -10;
var lastInjectPt = null;
var pendingTap = null;

function evtPos(e) {
  var r = (canvas.getBoundingClientRect)
    ? canvas.getBoundingClientRect()
    : { left: 0, top: 0 };
  return { x: (e.clientX - r.left) / W, y: (e.clientY - r.top) / H };
}

function injectPulse(pt) {
  var fromL = pt.x < 0.5;
  var ox = Math.max(0.02, Math.min(0.98, pt.x));
  var oy = Math.max(0.03, Math.min(0.97, pt.y));
  pulses.push(makePulse(tNow, fromL, ox, oy, rngLive));
}

if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    var pt = evtPos(e);
    downInfo = { x: pt.x, y: pt.y, t: tNow, moved: false };
  });
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('pointermove', function (e) {
    if (!downInfo) return;
    var pt = evtPos(e);
    var d0 = Math.sqrt((pt.x - downInfo.x) * (pt.x - downInfo.x) +
                       (pt.y - downInfo.y) * (pt.y - downInfo.y));
    if (d0 > 0.008) downInfo.moved = true;
    if (downInfo.moved && tNow - lastInjectT > 0.8) {
      var dl = lastInjectPt
        ? Math.sqrt((pt.x - lastInjectPt.x) * (pt.x - lastInjectPt.x) +
                    (pt.y - lastInjectPt.y) * (pt.y - lastInjectPt.y))
        : 1;
      if (dl > 0.03) {
        injectPulse(pt);
        lastInjectT = tNow;
        lastInjectPt = pt;
      }
    }
  });
  window.addEventListener('pointerup', function (e) {
    if (!downInfo) return;
    var wasDrag = downInfo.moved;
    var dur = tNow - downInfo.t;
    var pt = evtPos(e);
    downInfo = null;
    if (!wasDrag && dur < 0.45) {
      // Tap. A second tap within the window is a double-tap: hold the silence.
      if (pendingTap && (tNow - pendingTap.t) < 0.35) {
        pendingTap = null;
        silences.push(tNow);
      } else {
        pendingTap = { x: pt.x, y: pt.y, t: tNow, fire: tNow + 0.33 };
      }
    }
  });
  window.addEventListener('resize', function () { fit(); draw(tNow); });
}
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', function () { fit(); draw(tNow); });
}

// ---------- Main loop ----------

var prevT = 0;
var startTs = null;

function frame(ts) {
  if (startTs === null) startTs = ts;
  tNow = (ts - startTs) / 1000;
  if (pendingTap && tNow >= pendingTap.fire) {
    injectPulse(pendingTap);
    pendingTap = null;
  }
  stepEvents(prevT, tNow);
  draw(tNow);
  prevT = tNow;
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}

draw(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
</script>
</body>
</html>
