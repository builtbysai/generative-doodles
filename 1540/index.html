<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Black Ocean</title>
<style>
html, body { margin: 0; padding: 0; background: #2a1e12; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var LOOP = 240;
var SEED = 1540000;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(SEED);
var P1 = rand() * Math.PI * 2;
var P2 = rand() * Math.PI * 2;
var P3 = rand() * Math.PI * 2;

var STREAKS = (function () {
  var list = [];
  var t = 3 + rand() * 5;
  while (t < LOOP) {
    list.push({
      t0: t,
      dur: 2.5 + rand() * 1.5,
      x: 0.08 + rand() * 0.84,
      y: 0.58 + rand() * 0.34,
      len: 0.03 + rand() * 0.09
    });
    t += 4 + rand() * 7;
  }
  return list;
})();

var W = 0, H = 0, fieldX = 0, fieldY = 0, fieldW = 0, fieldH = 0;
var lastT = 0;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function smoothstep(a, b, x) {
  var t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}
function r4(v) { return Math.round(v * 10000) / 10000; }

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  } else { vw = 720; vh = 720; }
  W = vw; H = vh;
  var phone = false;
  if (typeof window !== 'undefined' && window.screen) {
    var m = Math.min(window.screen.width, window.screen.height);
    if (m < 700) phone = true;
  }
  if (!phone && H > W * 1.15) phone = true;
  // Gate fix: the field is full-frame on all sizes. The prompt specs the
  // ocean fills the lower two-thirds and the horizon runs across the
  // middle; the old centered-square desktop field inset the ocean with
  // sky-colored side margins. Phone detection above still runs unchanged.
  fieldX = 0; fieldY = 0; fieldW = W; fieldH = H;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}

function loopLocal(t) {
  var u = t % LOOP;
  if (u < 0) u += LOOP;
  return u;
}

function env(u) {
  if (u < 40) return 0.08;
  if (u < 140) return 0.08 + 0.92 * smoothstep(40, 140, u);
  if (u < 170) return 1;
  return 1 - 0.92 * smoothstep(170, 240, u);
}

function sunDim(u) {
  return u >= 170 ? 0.6 : 1;
}

function noiseAt(xFrac, u) {
  return Math.sin(2 * Math.PI * 2 * xFrac + P1 + 2 * Math.PI * 1 * u / LOOP) * 0.5
    + Math.sin(2 * Math.PI * 5 * xFrac + P2 + 2 * Math.PI * 2 * u / LOOP) * 0.3
    + Math.sin(2 * Math.PI * 11 * xFrac + P3 + 2 * Math.PI * 3 * u / LOOP) * 0.2;
}

function bumpAt(xFrac) {
  var d = (xFrac - 0.5) / 0.16;
  return Math.exp(-d * d);
}

function dispAt(xFrac, u) {
  var b = bumpAt(xFrac);
  return env(u) * (0.34 * b + 0.08 * noiseAt(xFrac, u) * (1 - b));
}

var oceanSessions = [];
var sunSessions = [];
var curOcean = null;
var curSun = null;

function dragCenterAt(session, t) {
  var pts = session.points;
  if (pts.length === 1) return pts[0].x;
  for (var i = 1; i < pts.length; i++) {
    if (t <= pts[i].t) {
      var a = pts[i - 1], b = pts[i];
      if (b.t === a.t) return b.x;
      var f = (t - a.t) / (b.t - a.t);
      return a.x + (b.x - a.x) * f;
    }
  }
  return pts[pts.length - 1].x;
}

function dragAmpAt(session, t) {
  if (t < session.t0) return 0;
  if (session.t1 === null || t <= session.t1) {
    return 1 - Math.exp(-(t - session.t0) / 0.3);
  }
  var peak = 1 - Math.exp(-(session.t1 - session.t0) / 0.3);
  return peak * Math.exp(-(t - session.t1) / 1.2);
}

function dragBumpAt(xFrac, t) {
  var total = 0;
  for (var i = 0; i < oceanSessions.length; i++) {
    var s = oceanSessions[i];
    var cx = dragCenterAt(s, t);
    var d = (xFrac - cx) / 0.10;
    total += dragAmpAt(s, t) * Math.exp(-d * d);
  }
  return total * 0.10;
}

function sunOffsetAt(t) {
  var total = 0;
  for (var i = 0; i < sunSessions.length; i++) {
    var s = sunSessions[i];
    if (t < s.t0) continue;
    if (s.t1 === null || t <= s.t1) {
      total += s.offset;
    } else {
      total += s.offset * Math.exp(-(t - s.t1) / 1.2);
    }
  }
  return clamp(total, -0.25, 0.25);
}

function horizonYAt(xFrac, t) {
  var u = loopLocal(t);
  return fieldY + (0.45 - dispAt(xFrac, u)) * fieldH - dragBumpAt(xFrac, t) * fieldH;
}

function toFrac(clientX) { return (clientX - fieldX) / fieldW; }

function onDown(e) {
  size();
  var f = toFrac(e.clientX);
  var yFrac = (e.clientY - fieldY) / fieldH;
  var sunR = 0.055 * Math.min(fieldW, fieldH);
  var sunCx = fieldX + 0.5 * fieldW;
  var sunCy = fieldY + 0.22 * fieldH;
  var dx = e.clientX - sunCx, dy = e.clientY - sunCy;
  if (dx * dx + dy * dy <= (sunR * 1.6) * (sunR * 1.6)) {
    curSun = { t0: lastT, t1: null, startY: e.clientY, offset: 0 };
    sunSessions.push(curSun);
  } else if (yFrac > 0.45) {
    curOcean = { t0: lastT, t1: null, points: [{ t: lastT, x: f }] };
    oceanSessions.push(curOcean);
  }
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (curOcean) {
    curOcean.points.push({ t: lastT, x: toFrac(e.clientX) });
  }
  if (curSun) {
    curSun.offset = clamp(-(e.clientY - curSun.startY) * 0.002, -0.25, 0.25);
  }
}
function onUp() {
  if (curOcean) { curOcean.t1 = lastT; curOcean = null; }
  if (curSun) { curSun.t1 = lastT; curSun = null; }
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', size);
  }
  if (window.addEventListener) window.addEventListener('resize', size);
}

function draw(t) {
  size();
  lastT = t;
  var u = loopLocal(t);
  var e = env(u);
  var sunR = 0.055 * Math.min(fieldW, fieldH);
  var sunCx = fieldX + 0.5 * fieldW;
  var sunCy = fieldY + 0.22 * fieldH;
  var sunMult = clamp(sunDim(u) + sunOffsetAt(t), 0.2, 1.25);

  ctx.fillStyle = '#2a1e12';
  ctx.fillRect(0, 0, W, H);

  var halo = [
    { r: 3.4, a: 0.05 },
    { r: 2.5, a: 0.08 },
    { r: 1.7, a: 0.14 }
  ];
  for (var h = 0; h < halo.length; h++) {
    ctx.fillStyle = 'rgba(90,69,38,' + r4(halo[h].a * sunMult) + ')';
    ctx.beginPath();
    ctx.moveTo(sunCx + sunR * halo[h].r, sunCy);
    ctx.arc(sunCx, sunCy, sunR * halo[h].r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(201,143,61,' + r4(0.55 * sunMult) + ')';
  ctx.beginPath();
  ctx.moveTo(sunCx + sunR, sunCy);
  ctx.arc(sunCx, sunCy, sunR, 0, Math.PI * 2);
  ctx.fill();

  var step = Math.max(6, fieldW / 160);
  ctx.beginPath();
  ctx.moveTo(fieldX, horizonYAt(0, t));
  for (var x = step; x <= fieldW; x += step) {
    ctx.lineTo(fieldX + x, horizonYAt(x / fieldW, t));
  }
  ctx.lineTo(fieldX + fieldW, fieldY + fieldH);
  ctx.lineTo(fieldX, fieldY + fieldH);
  ctx.closePath();
  ctx.fillStyle = '#0d0c10';
  ctx.fill();

  ctx.lineCap = 'butt';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#26221e';
  ctx.beginPath();
  ctx.moveTo(fieldX, horizonYAt(0, t));
  for (var x2 = step; x2 <= fieldW; x2 += step) {
    ctx.lineTo(fieldX + x2, horizonYAt(x2 / fieldW, t));
  }
  ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#3a352e';
  ctx.beginPath();
  ctx.moveTo(fieldX, horizonYAt(0, t));
  for (var x3 = step; x3 <= fieldW; x3 += step) {
    ctx.lineTo(fieldX + x3, horizonYAt(x3 / fieldW, t));
  }
  ctx.stroke();

  var active = 0;
  var streakNow = [];
  for (var s = 0; s < STREAKS.length; s++) {
    var st = STREAKS[s];
    var p = (u - st.t0) / st.dur;
    if (p < 0 || p > 1) continue;
    active++;
    var a;
    if (p < 0.2) a = p / 0.2;
    else if (p > 0.6) a = (1 - p) / 0.4;
    else a = 1;
    streakNow.push({ x: st.x, y: st.y, a: r4(a) });
    ctx.lineCap = 'butt';
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(143,136,120,' + r4(0.85 * a) + ')';
    ctx.beginPath();
    ctx.moveTo(fieldX + st.x * fieldW, fieldY + st.y * fieldH);
    ctx.lineTo(fieldX + (st.x + st.len) * fieldW, fieldY + st.y * fieldH);
    ctx.stroke();
  }

  if (typeof window !== 'undefined') {
    window.__t40 = {
      u: u, env: e,
      crestYSun: horizonYAt(0.5, t),
      sunTop: sunCy - sunR, sunBottom: sunCy + sunR,
      sunAlpha: r4(0.55 * sunMult), sunX: sunCx, sunY: sunCy, sunR: sunR,
      streaksActive: active, streakNow: streakNow, sunCount: 1,
      field: { x: fieldX, y: fieldY, w: fieldW, h: fieldH }
    };
  }
}

var startT = null;
function loop(ts) {
  if (startT === null) startT = ts;
  draw((ts - startT) / 1000);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
draw(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
