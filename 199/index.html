<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.199 Peroxide</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#070707; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.199 Peroxide (Amanda Willshire). A chemistry instrument: one
// plasma-cut steel carp tail, and a peroxide brush. Painting the
// peroxide mix on the steel forces the reaction the way she forces
// rust on the Carp Slam trophies: drag the brush and rust blooms
// along the stroke, spreading and darkening over the next minute,
// bloom to mature rust to deep umber. The rust field is a real
// reaction-diffusion sim on a low grid, diffusing, growing where
// peroxide was laid, deepening everywhere it already lives. The
// rust history is the composition. Double-tap deals the next
// trophy: a fresh, un-rusted tail.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#070707';
var STEEL = [107, 114, 128], BLOOM = [196, 85, 27], MATURE = [139, 37, 0], UMBER = [59, 31, 14];
var W = 0, H = 0, phone = false;
var seed = 199199;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }

// ---- carp tail silhouette (local space: x along axis, fork at +x) ----
var TAIL = [[-0.58, 0], [-0.52, -0.06], [-0.36, -0.12], [-0.14, -0.22], [0.08, -0.35],
            [0.32, -0.50], [0.62, -0.62], [0.42, -0.28], [0.16, -0.03], [0.16, 0.03],
            [0.42, 0.28], [0.62, 0.62], [0.32, 0.50], [0.08, 0.35], [-0.14, 0.22],
            [-0.36, 0.12], [-0.52, 0.06]];
var variant = 0;
function tailGeom() {
  var th = H * 0.40;
  var ang = -0.30 + (variant % 3 - 1) * 0.10;
  var flip = (variant % 2 === 0) ? 1 : -1;
  return { cx: W / 2, cy: H * 0.50, s: th, ang: ang, flip: flip };
}
function tailPoint(g, lx, ly) {
  var x = lx * g.s, y = ly * g.s * g.flip;
  var ca = Math.cos(g.ang), sa = Math.sin(g.ang);
  return [g.cx + x * ca - y * sa, g.cy + x * sa + y * ca];
}
function tailPath(g) {
  ctx.beginPath();
  for (var i = 0; i < TAIL.length; i++) {
    var p = tailPoint(g, TAIL[i][0], TAIL[i][1]);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
}
function inTail(g, px, py) {
  // inverse-transform into local space, then point-in-polygon
  var dx = px - g.cx, dy = py - g.cy;
  var ca = Math.cos(-g.ang), sa = Math.sin(-g.ang);
  var lx = (dx * ca - dy * sa) / g.s;
  var ly = (dx * sa + dy * ca) / g.s / g.flip;
  var inside = false;
  for (var i = 0, j = TAIL.length - 1; i < TAIL.length; j = i++) {
    var xi = TAIL[i][0], yi = TAIL[i][1], xj = TAIL[j][0], yj = TAIL[j][1];
    if ((yi > ly) !== (yj > ly) && lx < (xj - xi) * (ly - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// ---- rust field ---------------------------------------------------------
var GW = 128, GH = 96;
var rust = new Float32Array(GW * GH);
var mask = new Float32Array(GW * GH);
var inside = new Uint8Array(GW * GH);
var noise = new Float32Array(GW * GH);
var cellW = 0, cellH = 0, gridX = 0, gridY = 0;
function buildField() {
  var g = tailGeom();
  cellW = (g.s * 1.85) / GW;
  cellH = (g.s * 1.85) / GH;
  gridX = g.cx - cellW * GW / 2;
  gridY = g.cy - cellH * GH / 2;
  var r = rng(seed ^ 0xBEEF);
  for (var j = 0; j < GH; j++) {
    for (var i = 0; i < GW; i++) {
      var idx = j * GW + i;
      inside[idx] = inTail(g, gridX + (i + 0.5) * cellW, gridY + (j + 0.5) * cellH) ? 1 : 0;
      noise[idx] = r();
    }
  }
}
function brushAt(px, py, strength) {
  var rad = (phone ? 30 : 24) / cellW;
  var gi = (px - gridX) / cellW, gj = (py - gridY) / cellH;
  var rC = Math.ceil(rad);
  for (var j = Math.max(0, Math.floor(gj - rC)); j <= Math.min(GH - 1, gj + rC); j++) {
    for (var i = Math.max(0, Math.floor(gi - rC)); i <= Math.min(GW - 1, gi + rC); i++) {
      var d = Math.sqrt((i - gi) * (i - gi) + (j - gj) * (j - gj) * (cellH / cellW) * (cellH / cellW));
      if (d > rad) continue;
      var idx = j * GW + i;
      if (!inside[idx]) continue;
      var fall = 1 - d / rad;
      mask[idx] = Math.min(1, mask[idx] + strength * fall * fall);
    }
  }
}
function simStep(dt) {
  // diffuse: blend each rusted cell toward its neighbourhood mean
  var src = rust, dst = new Float32Array(GW * GH);
  for (var j = 0; j < GH; j++) {
    for (var i = 0; i < GW; i++) {
      var idx = j * GW + i;
      if (!inside[idx]) continue;
      var sum = src[idx] * 4, cnt = 4;
      if (i > 0 && inside[idx - 1]) { sum += src[idx - 1]; cnt++; }
      if (i < GW - 1 && inside[idx + 1]) { sum += src[idx + 1]; cnt++; }
      if (j > 0 && inside[idx - GW]) { sum += src[idx - GW]; cnt++; }
      if (j < GH - 1 && inside[idx + GW]) { sum += src[idx + GW]; cnt++; }
      dst[idx] = src[idx] + (sum / cnt - src[idx]) * 0.16;
    }
  }
  rust = dst;
  for (var k = 0; k < GW * GH; k++) {
    if (!inside[k]) continue;
    if (mask[k] > 0.01) {
      // growth where peroxide lies, mottled by the cell noise
      rust[k] += mask[k] * dt * 0.075 * (0.55 + 0.8 * noise[k]);
      mask[k] *= Math.exp(-dt / 25);            // the mix is consumed
    }
    if (rust[k] > 0.02) rust[k] += rust[k] * dt * 0.012;  // deepening
    if (rust[k] > 1) rust[k] = 1;
  }
}
function preAge() {
  // two strokes laid before the viewer arrives: one old and twice
  // dosed, gone umber at its heart; one fresh, still blooming
  var g = tailGeom();
  function stroke(pts, steps) {
    for (var sIdx = 0; sIdx <= steps; sIdx++) {
      var t = sIdx / steps * (pts.length - 1);
      var i0 = Math.floor(t), ft = t - i0;
      var a = pts[i0], b = pts[Math.min(i0 + 1, pts.length - 1)];
      var p = tailPoint(g, lerp(a[0], b[0], ft), lerp(a[1], b[1], ft));
      brushAt(p[0], p[1], 0.8);
    }
  }
  var oldStroke = [[-0.34, -0.08], [-0.05, 0.02], [0.22, 0.16]];
  stroke(oldStroke, 16);
  for (var a = 0; a < 260; a++) simStep(1 / 30);
  stroke(oldStroke, 16);
  for (var b = 0; b < 260; b++) simStep(1 / 30);
  mask = new Float32Array(GW * GH);
  stroke([[-0.02, 0.26], [0.22, 0.42]], 10);
  for (var c = 0; c < 130; c++) simStep(1 / 30);
  mask = new Float32Array(GW * GH);
}

// ---- colour ramp ------------------------------------------------------------
function ramp(v, n) {
  var a, b, k;
  var vv = clamp(v + (n - 0.5) * 0.08, 0, 1);
  if (vv < 0.12) {
    // clean steel, shaded only by the cell noise: plasma-cut plate
    var sh = 0.88 + n * 0.24;
    return 'rgb(' + Math.round(STEEL[0] * sh) + ',' + Math.round(STEEL[1] * sh) + ',' + Math.round(STEEL[2] * sh) + ')';
  }
  if (vv < 0.32) { a = STEEL; b = BLOOM; k = (vv - 0.12) / 0.20; }
  else if (vv < 0.58) { a = BLOOM; b = MATURE; k = (vv - 0.32) / 0.26; }
  else if (vv < 0.88) { a = MATURE; b = UMBER; k = (vv - 0.58) / 0.30; }
  else { a = UMBER; b = UMBER; k = 0; }
  return 'rgb(' + Math.round(lerp(a[0], b[0], k)) + ',' + Math.round(lerp(a[1], b[1], k)) + ',' + Math.round(lerp(a[2], b[2], k)) + ')';
}

// ---- input ---------------------------------------------------------------------
var dragging = false, hoverX = -1, hoverY = -1;
var lastTapT = -9, lastTapX = 0, lastTapY = 0, downX = 0, downY = 0;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; downX = e.clientX; downY = e.clientY;
  hoverX = e.clientX; hoverY = e.clientY;
  brushAt(e.clientX, e.clientY, 0.5);
});
canvas.addEventListener('pointermove', function (e) {
  hoverX = e.clientX; hoverY = e.clientY;
  if (!dragging) return;
  brushAt(e.clientX, e.clientY, 0.42);
});
function endPointer(e) {
  if (!dragging) return;
  dragging = false;
  var moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  var now = (e.timeStamp || 0) / 1000;
  if (moved < 10) {
    if (Math.abs(e.clientX - lastTapX) < 60 && Math.abs(e.clientY - lastTapY) < 60 && now - lastTapT < 0.34) {
      variant++;
      rust = new Float32Array(GW * GH);
      mask = new Float32Array(GW * GH);
      buildField();
      lastTapT = -9;
    } else {
      lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- resize ------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
  buildField();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- draw -------------------------------------------------------------------------------
var lastNow = -1, simAcc = 0;
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && now > 0) {
    var dt = Math.min(0.05, (now - lastNow) / 1000);
    simAcc += dt;
    while (simAcc > 1 / 30) { simStep(1 / 30); simAcc -= 1 / 30; }
  }
  lastNow = now;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var g = tailGeom();
  // plate shadow, then the field itself clipped to the tail
  ctx.save();
  tailPath(g);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.translate(4, 6);
  ctx.fill();
  ctx.translate(-4, -6);
  ctx.clip();
  for (var j = 0; j < GH; j++) {
    for (var i = 0; i < GW; i++) {
      var idx = j * GW + i;
      if (!inside[idx]) continue;
      ctx.fillStyle = ramp(rust[idx], noise[idx]);
      ctx.fillRect(gridX + i * cellW - 0.5, gridY + j * cellH - 0.5, cellW + 1, cellH + 1);
    }
  }
  ctx.restore();
  // plasma-cut edge
  tailPath(g);
  ctx.strokeStyle = '#23262B';
  ctx.lineWidth = 2;
  ctx.stroke();
  tailPath(g);
  ctx.strokeStyle = 'rgba(232,228,218,0.16)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // the brush, when the hand is on the piece
  if (hoverX >= 0 && dragging) {
    ctx.beginPath();
    ctx.arc(hoverX, hoverY, phone ? 30 : 24, 0, 6.284);
    ctx.strokeStyle = 'rgba(232,228,218,0.40)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

resize();
preAge();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
