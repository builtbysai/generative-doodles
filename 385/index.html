<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.385 Toile, But Make It Yoga</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F7F1E3; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.385 Toile, But Make It Yoga (maryna-lagereva, ML1).
// Her signature subversion: classic Toile de Jouy vignette
// tiling, but the scenes inside the cartouches are yoga
// poses, and the palette is LOUD. Exactly eight vignettes:
// warrior II, tree, downward dog, dancer's, lotus, cobra,
// child's, crescent moon. Each is a bezier figure with
// volume (capsule limbs, round head, curved spine) drawn
// as path data directly on this ONE canvas every frame;
// the prompt's sprite pre-render is forbidden by house
// rule, so nothing is cached offscreen.
// Palette: ground #F7F1E3 (warm paper). The eight poses
// split across four loud colours, two each: warrior and
// tree in coral #E4572E, downward dog and dancer in teal
// #2E8B8B, lotus and cobra in mustard #E8A93D, child's
// and crescent in plum #7A4E8C. Under every vignette a
// thin ink underdrawing in #3A2E2A at 0.35 alpha, offset
// a breath, and a faint oval guide stroke in the same ink
// at 0.2 alpha frames each cartouche. Nothing else.
// Figures are authored in a local box (floor at y=+42,
// crown at y=-46) with 2.5px round-cap strokes and a
// fixed 1.5px hand wobble baked into the data, then
// scaled x2 so each vignette stands ~180px tall, about
// 1/5 of the canvas height. Tiling is half-drop on a
// 256x180 cell, each instance rotated within +-12
// degrees, non-directional, bleeding past every edge.
// Loop: a seamless 40s master loop (LOOP). Each vignette
// breathes (scale 0.97-1.03) on a staggered cycle that
// is a whole divisor of the loop (40, 20, 10, 8 or 5s,
// like held breaths), and its colour line pulses opacity
// 0.75-1.0 on a second whole-divisor cycle; the ink lines
// redraw themselves faintly, a wallpaper being inked.
// Interaction: NONE. Watch-only. No text, no UI, no
// click-to-reload.
// Determinism: the first frame is drawn synchronously at
// the constant phase T = 17.3 (field complete, breaths
// mid-cycle), never Date.now() minus an offset, and the
// animation advances from that anchor in fixed 1/60
// ticks.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 40;
var TAU = Math.PI * 2;
var PAGE = '#F7F1E3';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 17.3, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- palette ---------------------------------------------------------------
var GROUND = '#F7F1E3';
var INK = '#3A2E2A';
var CORAL = '#E4572E', TEAL = '#2E8B8B', MUSTARD = '#E8A93D', PLUM = '#7A4E8C';

// ---- seeded rng --------------------------------------------------------------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- the eight poses -----------------------------------------------------------
// Authored in local units, y down, floor at +42. Each pose:
// a head circle and a set of strokes, each stroke a list of
// points drawn as a smooth bezier-flavoured curve with round
// caps at 2.5px. Colour is fixed per pose: two poses share
// each loud colour, asserted below.
var POSES = [
  { name: 'warrior II', col: CORAL, head: [1, -33, 6.5], strokes: [
    [[0, -4], [1, -14], [0, -24]],                                  // spine
    [[0, -22], [-13, -21], [-27, -20]],                             // back arm, level
    [[0, -22], [13, -21], [27, -20]],                               // front arm, level
    [[0, -4], [14, 4], [23, 16], [24, 30], [27, 42]],               // front leg, bent
    [[0, -4], [-12, 6], [-22, 20], [-28, 42]],                      // back leg, straight
    [[-34, 44], [-10, 42.5], [14, 43.5], [34, 42.5]]                // ground flourish
  ]},
  { name: 'tree', col: CORAL, head: [0, -33, 6.5], strokes: [
    [[-3, 42], [-3, 24], [-2, 6], [0, -4]],                         // standing leg
    [[0, -4], [10, 2], [15, 10], [6, 16], [1, 12]],                 // bent leg, foot to thigh
    [[0, -4], [0, -14], [0, -24]],                                  // spine
    [[0, -22], [-8, -30], [-5, -38], [0, -43]],                     // left arm rising
    [[0, -22], [8, -30], [5, -38], [0, -43]],                       // right arm, palms meet
    [[-20, 44], [-3, 43], [16, 44]]                                 // ground flourish
  ]},
  { name: 'downward dog', col: TEAL, head: [-12, 6, 5.5], strokes: [
    [[-32, 42], [-22, 24], [-12, 8], [-6, 0]],                      // arms pressing down
    [[-6, 1], [-11, 5]],                                            // neck
    [[-6, 0], [2, -10], [10, -16]],                                 // spine rising to hips
    [[10, -16], [20, 0], [26, 20], [29, 42]],                       // near leg
    [[10, -16], [15, 0], [18, 20], [20, 42]],                       // far leg
    [[-38, 44], [-10, 43], [16, 44], [36, 43]]                      // ground flourish
  ]},
  { name: "dancer's", col: TEAL, head: [4, -32, 6.5], strokes: [
    [[-3, 42], [-3, 22], [-2, 4], [0, -4]],                         // standing leg
    [[0, -4], [9, -3], [17, -8], [23, -20], [24, -28]],             // lifted leg, back and up
    [[0, -4], [1, -14], [2, -23]],                                  // arched spine
    [[2, -21], [10, -18], [17, -21], [23, -27]],                    // back arm holding the foot
    [[2, -21], [-6, -27], [-14, -33]],                              // front arm reaching
    [[-18, 44], [-3, 43], [12, 44]]                                 // ground flourish
  ]},
  { name: 'lotus', col: MUSTARD, head: [0, -9, 7], strokes: [
    [[0, 30], [0, 16], [0, 2]],                                     // torso
    [[0, 4], [-9, 14], [-17, 24], [-23, 33]],                       // left arm to knee
    [[0, 4], [9, 14], [17, 24], [23, 33]],                          // right arm to knee
    [[-27, 38], [-14, 33], [0, 36], [14, 39], [26, 37]],            // crossed legs, first sweep
    [[-24, 40], [-8, 37], [6, 34], [22, 40]],                       // crossed legs, second sweep
    [[-32, 43], [-10, 42], [12, 42.5], [32, 43]]                    // ground flourish
  ]},
  { name: 'cobra', col: MUSTARD, head: [18, 3, 6], strokes: [
    [[-36, 41], [-20, 39], [-4, 37], [6, 32], [12, 22], [15, 13]], // back rising off the floor
    [[15, 13], [17, 8]],                                            // neck
    [[15, 13], [19, 24], [21, 34], [22, 42]],                       // arm pressing down
    [[-38, 43], [-20, 42.5], [-2, 42], [8, 39]],                    // legs along the floor
    [[-40, 45], [-12, 44], [16, 44.5], [30, 44]]                    // ground flourish
  ]},
  { name: "child's", col: PLUM, head: [-24, 30, 6], strokes: [
    [[30, 42], [24, 34], [16, 28], [4, 20], [-8, 20], [-18, 26]],  // folded back, hips to shoulders
    [[-14, 24], [-24, 32], [-34, 40]],                              // near arm reaching forward
    [[-10, 26], [-20, 35], [-29, 42]],                              // far arm alongside
    [[-38, 44], [-8, 43], [18, 43.5], [36, 44]]                     // ground flourish
  ]},
  { name: 'crescent moon', col: PLUM, head: [-13, -31, 6.5], strokes: [
    [[-1, 42], [-1, 24], [-1, 6], [0, -2]],                         // legs together
    [[0, -2], [-3, -14], [-8, -24]],                                // spine arcing over
    [[-8, -23], [-14, -30], [-19, -37]],                            // outer arm overhead
    [[-8, -23], [-11, -31], [-15, -39]],                            // inner arm, fingertips meet
    [[-16, 44], [-1, 43], [14, 44]]                                 // ground flourish
  ]}
];
if (POSES.length !== 8) throw new Error('Toile needs exactly 8 poses');
// Two poses per loud colour, asserted.
var perColour = {};
for (var pi = 0; pi < POSES.length; pi++) perColour[POSES[pi].col] = (perColour[POSES[pi].col] || 0) + 1;
if (perColour[CORAL] !== 2 || perColour[TEAL] !== 2 || perColour[MUSTARD] !== 2 || perColour[PLUM] !== 2) {
  throw new Error('each loud colour must carry exactly two poses');
}

// ---- hand wobble, baked into the data ----------------------------------------------
// Fixed 1.5px wobble at design scale = 0.75 local units,
// drawn once from a seeded stream per pose, so the line is
// hand-drawn but identical on every frame and every load.
function wobblePose(pose, seed) {
  var rng = mulberry32(seed);
  function wob(p) {
    return [p[0] + (rng() * 2 - 1) * 0.75, p[1] + (rng() * 2 - 1) * 0.75];
  }
  var out = { name: pose.name, col: pose.col, head: null, strokes: [] };
  out.head = wob([pose.head[0], pose.head[1]]).concat([pose.head[2]]);
  for (var i = 0; i < pose.strokes.length; i++) {
    var st = [];
    for (var j = 0; j < pose.strokes[i].length; j++) st.push(wob(pose.strokes[i][j]));
    out.strokes.push(st);
  }
  return out;
}
var FIGURES = [];
for (pi = 0; pi < POSES.length; pi++) FIGURES.push(wobblePose(POSES[pi], 38511 + pi * 7));

// ---- the half-drop field -------------------------------------------------------------
// Cells of 256x180; odd columns drop half a cell. One figure
// per cell from a seeded stream; rotation within +-12
// degrees; breath and line-pulse periods are whole divisors
// of the 40s loop (40, 20, 10, 8, 5), staggered by phase.
// Instances bleed one cell past every design edge so the
// cover-fit crop never opens a gap.
var CELLW = 256, CELLH = 180, VSCALE = 2;
var PERIODS = [40, 20, 10, 8, 5];
var INSTANCES = [];
(function buildField() {
  var rng = mulberry32(38517);
  for (var col = -1; col <= 5; col++) {
    var odd = ((col % 2) + 2) % 2 === 1;
    for (var row = -1; row <= 5; row++) {
      INSTANCES.push({
        cx: col * CELLW + CELLW / 2,
        cy: row * CELLH + CELLH / 2 + (odd ? CELLH / 2 : 0),
        pose: Math.floor(rng() * 8),
        rot: (rng() * 2 - 1) * 12 * Math.PI / 180,
        bPeriod: PERIODS[Math.floor(rng() * PERIODS.length)],
        bPhase: rng() * TAU,
        pPeriod: PERIODS[Math.floor(rng() * PERIODS.length)],
        pPhase: rng() * TAU
      });
    }
  }
})();
if (INSTANCES.length !== 49) throw new Error('Toile field needs exactly 49 vignettes');

// ---- drawing -----------------------------------------------------------------------------

function strokePath(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  if (pts.length === 2) { ctx.lineTo(pts[1][0], pts[1][1]); return; }
  for (var i = 1; i < pts.length - 1; i++) {
    var mx = (pts[i][0] + pts[i + 1][0]) / 2;
    var my = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
}

function drawFigure(fig, lw) {
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var i = 0; i < fig.strokes.length; i++) { strokePath(fig.strokes[i]); ctx.stroke(); }
  // The head is filled with the ground first, so arm lines
  // passing behind it (tree's meeting palms, crescent's
  // overhead arc) occlude cleanly instead of scribbling
  // through the face.
  ctx.beginPath();
  ctx.arc(fig.head[0], fig.head[1], fig.head[2], 0, TAU);
  ctx.fillStyle = GROUND;
  ctx.fill();
  ctx.stroke();
}

function draw(t) {
  var i, inst, fig, breath, pulse;
  for (i = 0; i < INSTANCES.length; i++) {
    inst = INSTANCES[i];
    fig = FIGURES[inst.pose];
    breath = 1 + 0.03 * Math.sin(TAU * (t / inst.bPeriod) + inst.bPhase);
    pulse = 0.875 + 0.125 * Math.sin(TAU * (t / inst.pPeriod) + inst.pPhase);
    ctx.save();
    ctx.translate(inst.cx, inst.cy);
    ctx.rotate(inst.rot);
    ctx.scale(breath * VSCALE, breath * VSCALE);
    // Faint oval guide stroke framing the cartouche.
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.ellipse(0, 0, 54, 45, 0, 0, TAU);
    ctx.stroke();
    ctx.restore();
    // Thin ink underdrawing, offset a breath, at 0.35 alpha.
    ctx.save();
    ctx.translate(0.5, 0.5);
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = INK;
    drawFigure(fig, 1.5);
    ctx.restore();
    // The loud colour line, pulsing 0.75-1.0.
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = fig.col;
    drawFigure(fig, 2.5);
    ctx.restore();
    ctx.restore();
  }
}

// ---- sizing ------------------------------------------------------------------------------

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame ---------------------------------------------------------------------------------

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Cover-fit: the field fills any viewport, full-bleed.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAGE;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  ctx.fillStyle = GROUND;
  ctx.fillRect(-60, -60, DW + 120, DH + 120);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
})();
</script>
</body>
</html>
