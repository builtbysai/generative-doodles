<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Resonating Wire</title>
<style>
html, body { margin: 0; padding: 0; background: #D8DDDB; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#D8DDDB';
var STEEL = '#33393D';
var POST = '#2B3134';
var AMBER = [216, 164, 65];
var PLATE = '#E9EDEB';
var PLATE_LINE = 'rgba(43,49,52,0.35)';
var TITLE_INK = '#2B3134';
var HINT_INK = '#5A6165';
var FRAME_T = 60.0;
var CYCLE = 90.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smoothstep(a, b, x) {
  var u = clamp((x - a) / (b - a), 0, 1);
  return u * u * (3 - 2 * u);
}
function mix(a, b, u) { return a + (b - a) * u; }
function gauss(x, c, w) {
  var d = (x - c) / w;
  return Math.exp(-d * d);
}
/* small deterministic noise for the gust fronts: sum of sines, no RNG */
function noise1(x) {
  return (Math.sin(1.7 * x) + 0.5 * Math.sin(3.1 * x + 1.3) +
    0.25 * Math.sin(5.3 * x + 2.1)) / 1.75;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- driver: a bare wire held taut between two posts. Gusts cross
   the frame at fixed times; where a gust touches the wire the wire
   hums, its segments standing-wave vibrating with amplitude that
   follows the gust, then decaying as the gust passes. Between gusts
   the wire keeps only a low sympathetic tremor. ---- */
/* frame geometry: full-bleed on phones, a centred square on desktop */
var FX = 0, FY = 0, FW = 0, FH = 0;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) { FX = 0; FY = 0; FW = VW; FH = VH; }
  else {
    var s = Math.min(VW, VH);
    FW = s; FH = s; FX = (VW - s) / 2; FY = (VH - s) / 2;
  }
}
/* gusts: fixed schedule on the 90 s cycle. t0: arrival time,
   v: speed as fraction of frame width per second, s: strength. */
var GUSTS = [
  { t0: 14.0, v: 0.055, s: 0.55 },
  { t0: 48.0, v: 0.070, s: 0.95 },
  { t0: 74.0, v: 0.060, s: 0.70 }
];
var BAND_W = 0.20; /* band width, fraction of frame width */
function cycleT(t) {
  var c = t % CYCLE;
  return c < 0 ? c + CYCLE : c;
}
/* front x of a gust at cycle time c, or -1 when off frame */
function gustFront(g, c) {
  var dt = c - g.t0;
  if (dt < 0) return -1;
  var front = FX - BAND_W * FW + dt * g.v * FW;
  if (front > FX + FW + BAND_W * FW) return -1;
  return front;
}
function gustCenter(g, c) {
  var f = gustFront(g, c);
  if (f < 0) return -1;
  return f - (BAND_W * FW) / 2;
}
function wireY() { return FY + 0.52 * FH; }
var SEG = 180;
function ampAt(u, x, c, t) {
  var s = Math.min(FW, FH);
  var amp = 0.0016 * s; /* low constant sympathetic tremor */
  var k;
  for (k = 0; k < GUSTS.length; k++) {
    var gc = gustCenter(GUSTS[k], c);
    if (gc < 0) continue;
    var g = gauss(x, gc, 0.085 * FW);
    amp += GUSTS[k].s * g * 0.014 * s;
  }
  return amp * Math.sin(Math.PI * u); /* pinned at the posts */
}
function dispAt(u, c, t) {
  var w = 2.2; /* standing-wave frequency, Hz, well under 14 Hz */
  var ph = TAU * w * t;
  return Math.sin(3 * Math.PI * u + ph) * 0.6 + Math.sin(7 * Math.PI * u + ph * 1.0 + 0.9) * 0.4;
}
function drawGust(g, c) {
  var front = gustFront(g, c);
  if (front < 0) return;
  var bandW = BAND_W * FW;
  var top = FY + 0.06 * FH, bot = FY + 0.94 * FH;
  var y, step = 9;
  /* main band: translucent white, noise-shaped front edge */
  ctx.beginPath();
  ctx.moveTo(front - bandW, bot);
  ctx.lineTo(front - bandW, top);
  ctx.lineTo(front + noise1(top * 0.02) * 0.012 * FW, top);
  for (y = top + step; y <= bot; y += step) {
    ctx.lineTo(front + noise1(y * 0.02) * 0.012 * FW, y);
  }
  ctx.lineTo(front + noise1(bot * 0.02) * 0.012 * FW, bot);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,' + (0.10 * g.s + 0.04).toFixed(4) + ')';
  ctx.fill();
  /* inner core: a narrower, slightly brighter band near the front */
  var coreW = bandW * 0.45;
  ctx.beginPath();
  ctx.moveTo(front - coreW, bot);
  ctx.lineTo(front - coreW, top);
  ctx.lineTo(front + noise1(top * 0.02) * 0.012 * FW, top);
  for (y = top + step; y <= bot; y += step) {
    ctx.lineTo(front + noise1(y * 0.02) * 0.012 * FW, y);
  }
  ctx.lineTo(front + noise1(bot * 0.02) * 0.012 * FW, bot);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,' + (0.08 * g.s + 0.03).toFixed(4) + ')';
  ctx.fill();
  /* pressure streaks inside the band */
  var i, sy;
  for (i = 0; i < 5; i++) {
    sy = top + (bot - top) * (0.12 + i * 0.19);
    var sx0 = front - bandW * (0.55 + 0.09 * i);
    var sx1 = front - bandW * 0.08;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.10 + 0.05 * g.s).toFixed(4) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx0, sy);
    ctx.lineTo(sx1, sy + noise1(sy * 0.05 + i) * 6);
    ctx.stroke();
  }
}
function drawPosts() {
  var s = Math.min(FW, FH);
  var w = clamp(0.008 * FW, 3, 9);
  var top = FY + 0.16 * FH, bot = FY + 0.84 * FH;
  var x0 = FX + 0.045 * FW, x1 = FX + 0.955 * FW;
  var i, px;
  for (i = 0; i < 2; i++) {
    px = i === 0 ? x0 : x1;
    ctx.fillStyle = POST;
    ctx.fillRect(px - w / 2, top, w, bot - top);
    /* cap and foot */
    ctx.fillRect(px - w * 1.1, top - w * 0.7, w * 2.2, w * 0.7);
    ctx.fillRect(px - w * 1.4, bot, w * 2.8, w * 0.8);
  }
}
function drawWire(c, t) {
  var s = Math.min(FW, FH);
  var x0 = FX + 0.045 * FW, x1 = FX + 0.955 * FW;
  var wy = wireY();
  var i, u, x, y, amp, d;
  var xs = [], ys = [], amps = [];
  for (i = 0; i <= SEG; i++) {
    u = i / SEG;
    x = x0 + u * (x1 - x0);
    amp = ampAt(u, x, c, t);
    d = dispAt(u, c, t);
    xs.push(x); ys.push(wy + amp * d); amps.push(amp);
  }
  var maxAmp = 0.014 * s + 0.0016 * s;
  /* amber shimmer: per-segment glow, alpha tied to local amplitude */
  for (i = 0; i < SEG; i++) {
    var aN = clamp(amps[i] / maxAmp, 0, 1);
    var a = (0.05 + 0.50 * aN).toFixed(4);
    ctx.strokeStyle = 'rgba(' + AMBER[0] + ',' + AMBER[1] + ',' + AMBER[2] + ',' + a + ')';
    ctx.lineWidth = 2 + aN * 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(xs[i], ys[i]);
    ctx.lineTo(xs[i + 1], ys[i + 1]);
    ctx.stroke();
  }
  /* the steel wire itself */
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(xs[0], ys[0]);
  for (i = 1; i <= SEG; i++) ctx.lineTo(xs[i], ys[i]);
  ctx.stroke();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Resonating Wire').width > FW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Resonating Wire').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 07').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = FX + 12, plateY = FY + 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Resonating Wire', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 07', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = FX + 12;
  var hintPlateY = FY + FH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var t = phaseT;
  var c = cycleT(t);
  var k;
  for (k = 0; k < GUSTS.length; k++) drawGust(GUSTS[k], c);
  drawWire(c, t);
  drawPosts();
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    gustCenter: function (i, t) { return gustCenter(GUSTS[i], cycleT(t)); },
    ampAt: function (u, t) { var x = FX + 0.045 * FW + u * 0.91 * FW; return ampAt(u, x, cycleT(t), t); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, the second gust
   mid-crossing, the wire humming where it passes ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
