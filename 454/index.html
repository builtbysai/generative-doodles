<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pattern Facade</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F0EAE0; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  function RNG(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var BLUE = '#5A7AC8', BLUE_DARK = '#46649E', CREAM = '#F0EAE0',
      SHADE = '#D8D0C0', DARK = '#2A2E38', LIT = '#F2C86A',
      SUN = '#F2A87A', GHOST = '#6E7688', SIDEWALK = '#E4DCCF';

  var PHASE0 = 1.5;
  var T0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;

  /* Facade geometry, recomputed per frame from W/H so all sizes stay correct. */
  function geom() {
    var fx0 = 0.15 * W, fx1 = 0.85 * W, fw = fx1 - fx0;
    return {
      fx0: fx0, fx1: fx1, fw: fw,
      roofY: 0.14 * H, baseY: 0.86 * H,
      bw: fw * 1.6,            /* building content wider than the facade window */
      sideW: 0.09 * fw          /* shaded side return, fixed at the right edge */
    };
  }

  /* Spiral field, precomputed once from a fixed seed: archimedean spirals with
     jitter on a fixed grid, drawn directly each frame. No bitmap, no offscreen. */
  var spirals = [];
  (function () {
    var r = RNG(454001);
    var cols = 16, rows = 12, i, j, k, seg = 26, pts, a, rad, jx, jy;
    for (j = 0; j < rows; j++) {
      for (i = 0; i < cols; i++) {
        pts = [];
        for (k = 0; k <= seg; k++) {
          a = (k / seg) * Math.PI * 3;
          rad = 0.3 + (k / seg) * 1.3;
          jx = (r() - 0.5) * 0.22;
          jy = (r() - 0.5) * 0.22;
          pts.push([Math.cos(a) * rad + jx, Math.sin(a) * rad + jy]);
        }
        spirals.push({
          gx: (i + 0.5) / cols, gy: (j + 0.5) / rows,
          ph: r() * Math.PI * 2, unit: 1, pts: pts
        });
      }
    }
  })();

  /* Windows: 8 bays x 4 floors in building coordinates. Fixed lit order. */
  var LIT_ORDER = [5, 18, 27, 9, 22, 13, 30, 2, 16, 25, 7, 20, 11, 28, 4, 24,
                   15, 0, 19, 29, 8, 23, 12, 26, 3, 17, 31, 6, 21, 14, 1, 10];

  /* Ghosts: fixed authored tables, index 0 at load. */
  var ghosts = [
    { off: 0.00, speed: 0.055, dir: 1,  size: 1.00 },
    { off: 0.42, speed: 0.042, dir: -1, size: 0.86 },
    { off: 0.71, speed: 0.063, dir: 1,  size: 0.74 }
  ];

  /* Drag state: pan offset in px, clamped to the building overhang, eased back
     toward center when released. */
  var pan = 0, panTarget = 0, dragging = false, dragX = 0, dragPan = 0;
  function onDown(x) { dragging = true; dragX = x; dragPan = pan; }
  function onMove(x) { if (dragging) panTarget = dragPan + (x - dragX); }
  function onUp() { dragging = false; panTarget = 0; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX); });
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX); });
    canvas.addEventListener('pointerup', function () { onUp(); });
    canvas.addEventListener('pointercancel', function () { onUp(); });
  }

  function drawSpiralField(g, t, clipX0, clipX1, clipY0, clipY1, cell, color, lw, stride) {
    var s, i, p, cx, cy, sc;
    stride = stride || 1;
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (i = 0; i < spirals.length; i += stride) {
      s = spirals[i];
      cx = clipX0 + s.gx * (clipX1 - clipX0) + Math.sin(t * 0.10 + s.ph) * cell * 0.22;
      cy = clipY0 + s.gy * (clipY1 - clipY0) + Math.cos(t * 0.08 + s.ph) * cell * 0.22;
      sc = cell * (1 + 0.05 * Math.sin(t * 0.12 + s.ph));
      for (p = 0; p < s.pts.length; p++) {
        if (p === 0) ctx.moveTo(cx + s.pts[p][0] * sc, cy + s.pts[p][1] * sc);
        else ctx.lineTo(cx + s.pts[p][0] * sc, cy + s.pts[p][1] * sc);
      }
    }
    ctx.stroke();
  }

  function draw(t) {
    var elapsed = t - PHASE0;
    var g = geom();
    var maxPan = (g.bw - g.fw) / 2;
    if (panTarget > maxPan) panTarget = maxPan;
    if (panTarget < -maxPan) panTarget = -maxPan;
    if (dragging) pan = panTarget;
    else pan += (panTarget - pan) * 0.08;
    if (pan > maxPan) pan = maxPan;
    if (pan < -maxPan) pan = -maxPan;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    /* Ground: cream page, sidewalk band at the bottom. */
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = SIDEWALK;
    ctx.fillRect(0, g.baseY, W, H - g.baseY);

    /* Sun: apricot disc top-right, drawn before the facade so the roofline
       occludes its lower part. */
    ctx.fillStyle = SUN;
    ctx.beginPath();
    ctx.arc(0.80 * W, 0.10 * H, 0.11 * W, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = SUN;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0.80 * W, 0.10 * H, 0.14 * W, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    /* Facade window: clip all panning content to the 70% frame. */
    ctx.save();
    ctx.beginPath();
    ctx.rect(g.fx0, g.roofY, g.fw, g.baseY - g.roofY);
    ctx.clip();

    /* Building content, wider than the window, panned by drag. */
    var bx0 = g.fx0 + g.fw / 2 - g.bw / 2 + pan;
    var bx1 = bx0 + g.bw;
    ctx.fillStyle = CREAM;
    ctx.fillRect(bx0, g.roofY, g.bw, g.baseY - g.roofY);

    var cell = g.fw / 16;
    drawSpiralField(g, t, bx0, bx1, g.roofY, g.baseY, cell, BLUE, Math.max(1, W * 0.0012));

    /* Windows over the pattern: 8 bays x 4 floors. */
    var bays = 8, floors = 4, bi, fi;
    var bayW = g.bw / bays, flH = (g.baseY - g.roofY) / floors;
    var winW = bayW * 0.42, winH = flH * 0.38;
    var litIdx = LIT_ORDER[Math.floor(elapsed / 20) % LIT_ORDER.length];
    for (fi = 0; fi < floors; fi++) {
      for (bi = 0; bi < bays; bi++) {
        var wx = bx0 + bi * bayW + (bayW - winW) / 2;
        var wy = g.roofY + fi * flH + (flH - winH) / 2 + flH * 0.08;
        var wi = fi * bays + bi;
        ctx.fillStyle = (wi === litIdx) ? LIT : DARK;
        ctx.fillRect(wx, wy, winW, winH);
        ctx.strokeStyle = CREAM;
        ctx.lineWidth = Math.max(1, W * 0.001);
        ctx.strokeRect(wx, wy, winW, winH);
        if (wi === litIdx) {
          ctx.fillStyle = 'rgba(255, 240, 200, 0.55)';
          ctx.fillRect(wx, wy, winW, winH * 0.5);
        }
      }
    }

    /* Door, centered in building coordinates, at the ground floor. */
    var doorW = bayW * 0.5, doorH = flH * 0.62;
    ctx.fillStyle = DARK;
    ctx.fillRect(bx0 + g.bw / 2 - doorW / 2, g.baseY - doorH, doorW, doorH);
    ctx.strokeStyle = CREAM;
    ctx.lineWidth = Math.max(1, W * 0.001);
    ctx.strokeRect(bx0 + g.bw / 2 - doorW / 2, g.baseY - doorH, doorW, doorH);

    ctx.restore();

    /* Cornice and roofline over the facade window. */
    ctx.fillStyle = SHADE;
    ctx.fillRect(g.fx0 - 2, g.roofY - 0.012 * H, g.fw + 4, 0.012 * H);
    ctx.fillStyle = CREAM;
    ctx.fillRect(g.fx0, g.roofY - 0.02 * H, g.fw, 0.008 * H);

    /* Side return: narrow shaded strip fixed at the right edge, same pattern
       at lower value over the facade shade. */
    ctx.save();
    ctx.beginPath();
    ctx.rect(g.fx1 - g.sideW, g.roofY, g.sideW, g.baseY - g.roofY);
    ctx.clip();
    ctx.fillStyle = SHADE;
    ctx.fillRect(g.fx1 - g.sideW, g.roofY, g.sideW, g.baseY - g.roofY);
    drawSpiralField(g, t, g.fx1 - g.sideW, g.fx1, g.roofY, g.baseY,
                    g.sideW * 0.55, BLUE_DARK, Math.max(1, W * 0.001), 8);
    ctx.restore();
    ctx.strokeStyle = SHADE;
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.strokeRect(g.fx1 - g.sideW, g.roofY, g.sideW, g.baseY - g.roofY);

    /* Ghosts: translucent silhouettes crossing the bottom foreground. */
    var gi, gg, travel = W + 420, gx, fade, gs, gy;
    for (gi = 0; gi < ghosts.length; gi++) {
      gg = ghosts[gi];
      gx = ((gg.off * travel + elapsed * gg.speed * travel) % travel) - 210;
      if (gg.dir < 0) gx = W + 210 - ((gg.off * travel + elapsed * gg.speed * travel) % travel);
      gs = gg.size * W * 0.055;
      gy = g.baseY + (H - g.baseY) * 0.45;
      fade = Math.min(1, Math.min(gx + 210, W + 210 - gx) / 160);
      if (fade < 0) fade = 0;
      ctx.globalAlpha = 0.40 * fade;
      ctx.fillStyle = GHOST;
      ctx.beginPath();
      ctx.arc(gx, gy - gs * 1.9, gs * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(gx - gs * 0.7, gy);
      ctx.quadraticCurveTo(gx - gs * 0.8, gy - gs * 1.5, gx, gy - gs * 1.45);
      ctx.quadraticCurveTo(gx + gs * 0.8, gy - gs * 1.5, gx + gs * 0.7, gy);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    (function loop() {
      var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
      draw(PHASE0 + (now - T0) / 1000);
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
