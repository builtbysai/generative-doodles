<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№872 The Meet-Up</title>
<style>
  html, body { margin: 0; padding: 0; background: #2e2620; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №872 The Meet-Up, SOA2 / PP1272, study #264 sheldon-omar-abba.
  // The driver is the wait: a recurring civic ceremony in a
  // parking lot at golden hour. Cars ring the lot nose-in, hoods
  // open, kids leaning out of windows, a man scrolling his phone
  // on the hood of a mint-green Caprice. Nothing is posed that was
  // not already happening. The meet-up runs its evening loop:
  // arrivals, a door slamming, one car slow-circling the ring, the
  // long wait held in the frame. TAP earned: tap to jump to next
  // year's meet-up. Same lot, same ritual, slightly different
  // cars, the kids taller. The recurrence is the mechanism, so
  // advancing the recurrence is a faithful control.
  var GROUND = '#2e2620'; // page ground, warm dark asphalt edge

  // Fixed-phase first frame: FIRST_T = 6 s into a 60 s cycle.
  // All motion is a pure function of (t - FIRST_T) / CYCLE, so the
  // frame at FIRST_T + 60 equals the frame at FIRST_T exactly.
  var FIRST_T = 6;
  var CYCLE = 60;
  var SEED = 872;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // ?year=<0..4> selects the meet-up year at load. Read at load only.
  var probeT = null;
  var probeYear = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var my = qs.match(/[?&]year=([0-9]+)/);
    if (my) { probeYear = parseInt(my[1], 10) % 5; }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;
  var yearIndex = (probeYear !== null) ? probeYear : 0;
  var YEARS = [2023, 2024, 2025, 2026, 2027];
  var transStart = -100; // virtual time a year transition began
  var TRANS = 0.8; // sweep duration in seconds

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipsePath(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Palette: golden-hour parking lot. Warm asphalt, chrome glints,
  // faded lot paint, phone-screen blue as the one cool accent.
  var ASPHALT = [74, 62, 52];
  var ASPHALT_LOT = [92, 78, 64];
  var ASPHALT_DARK = [56, 47, 40];
  var PAINT = [214, 196, 158];
  var GRASS = [96, 104, 58];
  var CREAM = [246, 236, 216];
  var SHADOW = [24, 18, 14];
  var PHONE_BLUE = [96, 158, 232];
  var CAPRICE = [168, 216, 196]; // mint green, the constant car
  var CAPRICE_DARK = [110, 168, 146];

  // Car colours the years cycle through, seeded per year.
  var CAR_COLOURS = [
    [196, 182, 150], [128, 44, 40], [52, 72, 96], [178, 178, 172],
    [64, 112, 104], [168, 96, 52], [58, 58, 62], [196, 150, 64],
    [140, 120, 96], [88, 96, 120], [150, 60, 70], [110, 128, 110]
  ];

  // ---- Seeded tables, fixed at load -------------------------------
  // Oil stains and cracks on the lot.
  var oilRng = mulberry32(SEED * 7 + 3);
  var OIL = [];
  var oi;
  for (oi = 0; oi < 9; oi++) {
    OIL.push({ x: 0.08 + oilRng() * 0.84, y: 0.10 + oilRng() * 0.80,
      rx: 0.015 + oilRng() * 0.03, ry: 0.010 + oilRng() * 0.018,
      rot: oilRng() * Math.PI, a: 0.10 + oilRng() * 0.12 });
  }
  // Gravel speckle on the grass verge.
  var gravRng = mulberry32(SEED * 13 + 5);
  var GRAVEL = [];
  var gi;
  for (gi = 0; gi < 180; gi++) {
    GRAVEL.push({ x: gravRng(), y: gravRng(), r: 0.001 + gravRng() * 0.002,
      l: gravRng() > 0.5 });
  }
  // Per-year car assignments: colours and body style for the seven
  // ring cars plus the circling car. The Caprice never changes.
  // Kid height factor grows with the year: the kids get taller.
  var YEAR_CARS = [];
  var yi, ci;
  for (yi = 0; yi < 5; yi++) {
    var yr = mulberry32(SEED * 101 + yi * 37 + 11);
    var cars = [];
    for (ci = 0; ci < 8; ci++) {
      cars.push({
        col: Math.floor(yr() * CAR_COLOURS.length),
        hatch: yr() > 0.62, // hatchback: shorter hood, taller roof
        hub: yr() > 0.5
      });
    }
    YEAR_CARS.push({ cars: cars, kidH: 0.72 + 0.09 * yi });
  }
  // Which ring slots have a kid leaning out of a window. Fixed
  // slots; the kid's height is the year parameter.
  var KID_SLOTS = [1, 4, 6];

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.fsYear = Math.round(clamp(W * 0.026, 13, 19));
    // The lot ring, centred a little above middle so the Caprice
    // at the front has room below it.
    L.cx = W * 0.5;
    L.cy = H * 0.50;
    L.rx = W * 0.40;
    L.ry = H * 0.30;
    L.carL = Math.min(W, H) * 0.155; // car length
    L.carW = Math.min(W, H) * 0.078; // car width
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // u is 0..1 across the 60 s evening cycle.
  function phaseU(t) {
    return (((t - FIRST_T) / CYCLE) % 1 + 1) % 1;
  }
  // Golden-hour sun: low from the west, shadows long to the east,
  // stretching a little as the evening wears on. Returned in units
  // of car length, so the shadow hugs the car it belongs to.
  function shadowVec(t) {
    var u = phaseU(t);
    var len = 1.0 + 0.30 * Math.sin(2 * Math.PI * u + 0.6);
    return { dx: 0.18 * len, dy: 0.10 * len };
  }
  function sunWarmth(t) {
    var u = phaseU(t);
    return 0.05 + 0.035 * (0.5 + 0.5 * Math.sin(2 * Math.PI * u - 0.9));
  }

  // ---- Lot ground --------------------------------------------------
  function drawLot(t) {
    var i, x, y;
    // Asphalt fills the frame; grass verge outside the lot.
    ctx.fillStyle = rgb(ASPHALT);
    ctx.fillRect(0, 0, W, H);
    // Grass verge along the top edge and a dirt strip at the bottom.
    ctx.fillStyle = rgb(GRASS);
    ctx.fillRect(0, 0, W, H * 0.045);
    ctx.fillStyle = rgb([120, 100, 72]);
    ctx.fillRect(0, H * 0.955, W, H * 0.045);
    for (i = 0; i < GRAVEL.length; i++) {
      ctx.fillStyle = GRAVEL[i].l ? rgba([140, 146, 96], a4(0.5)) : rgba([70, 78, 44], a4(0.5));
      circle(W * GRAVEL[i].x, H * 0.045 * GRAVEL[i].y, W * GRAVEL[i].r);
      ctx.fill();
    }
    // The lot proper: a lighter asphalt ellipse, ringed by a kerb.
    ctx.fillStyle = rgb(ASPHALT_LOT);
    ellipsePath(L.cx, L.cy, L.rx * 1.10, L.ry * 1.10, 0);
    ctx.fill();
    ctx.strokeStyle = rgba(PAINT, a4(0.5));
    ctx.lineWidth = Math.max(1.5, W * 0.004);
    ellipsePath(L.cx, L.cy, L.rx * 1.10, L.ry * 1.10, 0);
    ctx.stroke();
    // Faded painted ring line for the parking bays.
    ctx.strokeStyle = rgba(PAINT, a4(0.35));
    ctx.lineWidth = Math.max(1, W * 0.003);
    ellipsePath(L.cx, L.cy, L.rx * 0.86, L.ry * 0.86, 0);
    ctx.stroke();
    // Bay divider ticks around the ring.
    ctx.beginPath();
    for (i = 0; i < 16; i++) {
      var a = i * Math.PI * 2 / 16;
      var x1 = L.cx + Math.cos(a) * L.rx * 0.86;
      var y1 = L.cy + Math.sin(a) * L.ry * 0.86;
      var x2 = L.cx + Math.cos(a) * L.rx * 0.97;
      var y2 = L.cy + Math.sin(a) * L.ry * 0.97;
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    }
    ctx.stroke();
    // Oil stains and cracks.
    for (i = 0; i < OIL.length; i++) {
      ctx.fillStyle = rgba([28, 24, 20], a4(OIL[i].a));
      ellipsePath(W * OIL[i].x, H * OIL[i].y, W * OIL[i].rx, H * OIL[i].ry, OIL[i].rot);
      ctx.fill();
    }
    // A manhole and a drain grate in the driving lane.
    ctx.fillStyle = rgba(ASPHALT_DARK, a4(0.85));
    circle(W * 0.78, H * 0.82, W * 0.020);
    ctx.fill();
    ctx.strokeStyle = rgba([36, 32, 28], a4(0.9));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.strokeRect(W * 0.14, H * 0.80, W * 0.06, H * 0.018);
  }

  // ---- Cars ---------------------------------------------------------
  // Local frame: nose points toward -y (toward the ring centre).
  // colour: [r,g,b]. hatch: shorter hood, taller roof.
  function drawCarBody(x, y, ang, colour, hatch, scale, opts) {
    var l = L.carL * scale, w = L.carW * scale;
    var sv = shadowVec(lastT);
    var sdx = sv.dx * l, sdy = sv.dy * l;
    ctx.save();
    ctx.translate(x + sdx, y + sdy);
    ctx.rotate(ang);
    ctx.fillStyle = rgba(SHADOW, a4(0.30));
    rr(-w / 2, -l / 2, w, l, w * 0.22);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    // Wheels: four dark blocks at the sides.
    ctx.fillStyle = rgb([22, 20, 20]);
    ctx.fillRect(-w / 2 - w * 0.06, -l * 0.30, w * 0.10, l * 0.14);
    ctx.fillRect(w / 2 - w * 0.04, -l * 0.30, w * 0.10, l * 0.14);
    ctx.fillRect(-w / 2 - w * 0.06, l * 0.16, w * 0.10, l * 0.14);
    ctx.fillRect(w / 2 - w * 0.04, l * 0.16, w * 0.10, l * 0.14);
    // Body.
    ctx.fillStyle = rgb(colour);
    rr(-w / 2, -l / 2, w, l, w * 0.22);
    ctx.fill();
    // Chrome trim along the flanks.
    ctx.strokeStyle = rgba([230, 230, 226], a4(0.55));
    ctx.lineWidth = Math.max(1, w * 0.03);
    ctx.beginPath();
    ctx.moveTo(-w / 2 + w * 0.08, -l * 0.42); ctx.lineTo(-w / 2 + w * 0.08, l * 0.42);
    ctx.moveTo(w / 2 - w * 0.08, -l * 0.42); ctx.lineTo(w / 2 - w * 0.08, l * 0.42);
    ctx.stroke();
    // Hood: the front section, a shade lighter.
    var hoodL = hatch ? l * 0.16 : l * 0.28;
    ctx.fillStyle = rgba([255, 255, 255], a4(0.14));
    rr(-w / 2 + w * 0.06, -l / 2 + l * 0.02, w - w * 0.12, hoodL, w * 0.10);
    ctx.fill();
    // Windshield: dark glass band.
    ctx.fillStyle = rgb([38, 44, 50]);
    rr(-w / 2 + w * 0.08, -l / 2 + hoodL + l * 0.03, w - w * 0.16, l * 0.10, w * 0.06);
    ctx.fill();
    // Roof.
    ctx.fillStyle = rgba([255, 255, 255], a4(0.10));
    rr(-w / 2 + w * 0.10, -l / 2 + hoodL + l * 0.15, w - w * 0.20, l * (hatch ? 0.34 : 0.26), w * 0.08);
    ctx.fill();
    // Rear window.
    ctx.fillStyle = rgb([38, 44, 50]);
    rr(-w / 2 + w * 0.08, l / 2 - l * 0.16, w - w * 0.16, l * 0.08, w * 0.05);
    ctx.fill();
    // Headlights: two pale dots at the nose.
    ctx.fillStyle = rgb([250, 232, 180]);
    circle(-w * 0.28, -l / 2 + l * 0.02, w * 0.055);
    ctx.fill();
    circle(w * 0.28, -l / 2 + l * 0.02, w * 0.055);
    ctx.fill();
    if (opts && opts.headlightsOn) {
      // Soft light cones ahead of the nose.
      ctx.fillStyle = rgba([250, 232, 180], a4(0.10));
      ctx.beginPath();
      ctx.moveTo(-w * 0.28, -l / 2);
      ctx.lineTo(-w * 0.55, -l * 1.05);
      ctx.lineTo(w * 0.05, -l * 1.05);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(w * 0.28, -l / 2);
      ctx.lineTo(-w * 0.05, -l * 1.05);
      ctx.lineTo(w * 0.55, -l * 1.05);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // A kid leaning out of a side window: head and shoulders above
  // the car's flank, bobbing gently with the cycle.
  function drawKid(x, y, ang, hF, bobPhase) {
    var l = L.carL, w = L.carW;
    var bob = Math.sin(2 * Math.PI * phaseU(lastT) * 2 + bobPhase) * l * 0.02;
    var s = Math.min(W, H) * 0.018 * hF;
    // Window position: left flank, just behind the windshield.
    var lx = -w * 0.55, ly = -l * 0.16 + bob;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    // Arm resting on the door frame.
    ctx.strokeStyle = rgb([196, 150, 120]);
    ctx.lineWidth = Math.max(1.5, s * 0.22);
    ctx.beginPath();
    ctx.moveTo(lx, ly + s * 0.4);
    ctx.lineTo(lx - s * 0.9, ly + s * 1.1);
    ctx.stroke();
    // Shoulders and head leaning out.
    ctx.fillStyle = rgb([210, 90, 80]);
    rr(lx - s * 0.7, ly - s * 0.2, s * 1.4, s * 0.9, s * 0.4);
    ctx.fill();
    ctx.fillStyle = rgb([196, 150, 120]);
    circle(lx, ly - s * 0.7, s * 0.62);
    ctx.fill();
    // Hair cap.
    ctx.fillStyle = rgb([40, 30, 24]);
    ctx.beginPath();
    ctx.moveTo(lx - s * 0.62, ly - s * 0.7);
    ctx.arc(lx, ly - s * 0.7, s * 0.62, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // The mint-green Caprice at the front of the ring, hood open, a
  // man scrolling his phone on the hood. The constant car.
  function drawCaprice(t) {
    var x = L.cx, y = L.cy + L.ry * 0.92;
    var ang = 0; // nose points up, toward the ring centre
    drawCarBody(x, y, ang, CAPRICE, false, 1.12, null);
    var l = L.carL * 1.12, w = L.carW * 1.12;
    // Open hood: a raised flap hinged at the windshield, drawn as
    // a foreshortened panel standing above the nose.
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.fillStyle = rgb(CAPRICE_DARK);
    rr(-w / 2 + w * 0.06, -l / 2 - l * 0.16, w - w * 0.12, l * 0.20, w * 0.08);
    ctx.fill();
    ctx.strokeStyle = rgba([230, 230, 226], a4(0.5));
    ctx.lineWidth = Math.max(1, w * 0.03);
    ctx.strokeRect(-w / 2 + w * 0.06, -l / 2 - l * 0.16, w - w * 0.12, l * 0.20);
    ctx.restore();
    // The man, seated on the hood edge, legs dangling toward the
    // nose, phone in hand. Small front pictogram, drawn over the
    // car in screen space.
    var s = Math.min(W, H) * 0.020;
    var mx = x, my = y - l * 0.30;
    var lean = Math.sin(2 * Math.PI * phaseU(t) * 1 + 1.2) * s * 0.06;
    // Legs dangling down the nose.
    ctx.strokeStyle = rgb([52, 58, 72]);
    ctx.lineWidth = Math.max(2, s * 0.34);
    ctx.beginPath();
    ctx.moveTo(mx - s * 0.45, my + s * 0.9);
    ctx.lineTo(mx - s * 0.55, my + s * 2.3);
    ctx.moveTo(mx + s * 0.45, my + s * 0.9);
    ctx.lineTo(mx + s * 0.55, my + s * 2.3);
    ctx.stroke();
    // Torso, leaning slightly over the phone.
    ctx.fillStyle = rgb([232, 226, 214]);
    rr(mx - s * 0.75 + lean, my - s * 0.5, s * 1.5, s * 1.5, s * 0.5);
    ctx.fill();
    // Head.
    ctx.fillStyle = rgb([196, 150, 120]);
    circle(mx + lean, my - s * 1.05, s * 0.55);
    ctx.fill();
    ctx.fillStyle = rgb([40, 30, 24]);
    ctx.beginPath();
    ctx.moveTo(mx + lean - s * 0.55, my - s * 1.05);
    ctx.arc(mx + lean, my - s * 1.05, s * 0.55, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
    // Phone held up, screen glowing blue.
    var px = mx + s * 0.75 + lean, py = my - s * 0.55;
    ctx.fillStyle = rgb([24, 28, 34]);
    rr(px - s * 0.22, py - s * 0.45, s * 0.44, s * 0.9, s * 0.08);
    ctx.fill();
    ctx.fillStyle = rgb(PHONE_BLUE);
    rr(px - s * 0.15, py - s * 0.38, s * 0.30, s * 0.76, s * 0.05);
    ctx.fill();
    // The blue glow on his face and shirt.
    ctx.fillStyle = rgba(PHONE_BLUE, a4(0.18));
    ellipsePath(mx + lean + s * 0.3, my - s * 0.6, s * 0.9, s * 0.7, 0);
    ctx.fill();
  }

  // ---- Ring cars, centre, circling car ------------------------------
  function drawRing(t) {
    var u = phaseU(t);
    var yc = YEAR_CARS[yearIndex];
    var i, a, x, y, ang;
    // The circling car is drawn first, so when its lap takes it
    // behind a parked car the parked car occludes it: depth, not
    // a collision. One slow lap of the driving lane per cycle,
    // headlights on, never stopping.
    var phi = Math.PI / 2 + 2 * Math.PI * u + 0.5;
    var ox = L.cx + Math.cos(phi) * L.rx * 1.24;
    var oy = L.cy + Math.sin(phi) * L.ry * 1.24;
    var tang = Math.atan2(
      -Math.sin(phi) * L.ry * 1.24, Math.cos(phi) * L.rx * 1.24);
    var circ = yc.cars[7];
    drawCarBody(ox, oy, tang + Math.PI / 2, CAR_COLOURS[circ.col], circ.hatch, 0.95,
      { headlightsOn: true });
    // A second kid leaning out of the circling car, waving slowly.
    drawKid(ox, oy, tang + Math.PI / 2, yc.kidH, 4.1);
    // Seven parked ring cars. Slot 0 is the front, held by the
    // Caprice, so slots run 1..7 around the ring.
    for (i = 1; i <= 7; i++) {
      a = Math.PI / 2 + i * (Math.PI * 2 / 8);
      x = L.cx + Math.cos(a) * L.rx;
      y = L.cy + Math.sin(a) * L.ry;
      // Nose points toward the centre.
      ang = Math.atan2(L.cy - y, L.cx - x) + Math.PI / 2;
      var spec = yc.cars[i - 1];
      drawCarBody(x, y, ang, CAR_COLOURS[spec.col], spec.hatch, 1.0, null);
      if (KID_SLOTS.indexOf(i) !== -1) {
        drawKid(x, y, ang, yc.kidH, i * 1.7);
      }
    }
    // Door slam: slot 3's driver door swings open and shuts once
    // per cycle, a quick slam at the end of the swing.
    var doorA = 0;
    if (u > 0.30 && u < 0.345) { doorA = smooth(0.30, 0.345, u) * 1.15; }
    else if (u >= 0.345 && u < 0.40) { doorA = 1.15; }
    else if (u >= 0.40 && u < 0.43) { doorA = (1 - smooth(0.40, 0.43, u)) * 1.15; }
    if (doorA > 0.01) {
      a = Math.PI / 2 + 3 * (Math.PI * 2 / 8);
      x = L.cx + Math.cos(a) * L.rx;
      y = L.cy + Math.sin(a) * L.ry;
      ang = Math.atan2(L.cy - y, L.cx - x) + Math.PI / 2;
      var l = L.carL, w = L.carW;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      // Hinge at the front door's leading edge, left flank.
      ctx.translate(-w / 2, -l * 0.10);
      ctx.rotate(-doorA);
      ctx.fillStyle = rgb(CAR_COLOURS[yc.cars[2].col]);
      ctx.fillRect(-w * 0.05, -l * 0.16, w * 0.10, l * 0.32);
      ctx.strokeStyle = rgba([230, 230, 226], a4(0.4));
      ctx.lineWidth = Math.max(1, w * 0.02);
      ctx.strokeRect(-w * 0.05, -l * 0.16, w * 0.10, l * 0.32);
      ctx.restore();
    }
  }

  // ---- Centre of the ring --------------------------------------------
  function drawCentre(t) {
    var u = phaseU(t);
    var s = Math.min(W, H) * 0.020;
    var cx = L.cx, cy = L.cy;
    // Two figures talking in the middle, small and still.
    var fig;
    for (fig = 0; fig < 2; fig++) {
      var fx = cx + (fig === 0 ? -s * 2.2 : s * 2.2);
      var fy = cy - s * 0.4 + (fig === 0 ? 0 : s * 0.5);
      var sway = Math.sin(2 * Math.PI * u + fig * 2.1) * s * 0.08;
      ctx.fillStyle = rgb(fig === 0 ? [168, 96, 60] : [70, 96, 120]);
      rr(fx - s * 0.6 + sway, fy - s * 1.1, s * 1.2, s * 1.7, s * 0.4);
      ctx.fill();
      ctx.fillStyle = rgb([196, 150, 120]);
      circle(fx + sway, fy - s * 1.6, s * 0.5);
      ctx.fill();
      ctx.fillStyle = rgb([40, 30, 24]);
      ctx.beginPath();
      ctx.moveTo(fx + sway - s * 0.5, fy - s * 1.6);
      ctx.arc(fx + sway, fy - s * 1.6, s * 0.5, Math.PI, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      // Legs.
      ctx.strokeStyle = rgb([52, 50, 48]);
      ctx.lineWidth = Math.max(1.5, s * 0.28);
      ctx.beginPath();
      ctx.moveTo(fx - s * 0.25 + sway, fy + s * 0.6);
      ctx.lineTo(fx - s * 0.3 + sway, fy + s * 1.7);
      ctx.moveTo(fx + s * 0.25 + sway, fy + s * 0.6);
      ctx.lineTo(fx + s * 0.3 + sway, fy + s * 1.7);
      ctx.stroke();
    }
    // Cooler and folding chair between them.
    ctx.fillStyle = rgb([214, 60, 50]);
    rr(cx - s * 0.9, cy + s * 2.4, s * 1.8, s * 1.1, s * 0.2);
    ctx.fill();
    ctx.fillStyle = rgb([240, 236, 226]);
    rr(cx - s * 0.9, cy + s * 2.4, s * 1.8, s * 0.35, s * 0.15);
    ctx.fill();
    // Folding chair, a simple X frame with a seat.
    var chx = cx + s * 3.4, chy = cy + s * 2.2;
    ctx.strokeStyle = rgb([120, 120, 116]);
    ctx.lineWidth = Math.max(1.5, s * 0.22);
    ctx.beginPath();
    ctx.moveTo(chx - s * 0.7, chy); ctx.lineTo(chx + s * 0.7, chy + s * 1.4);
    ctx.moveTo(chx + s * 0.7, chy); ctx.lineTo(chx - s * 0.7, chy + s * 1.4);
    ctx.stroke();
    ctx.fillStyle = rgb([52, 96, 120]);
    ctx.fillRect(chx - s * 0.8, chy + s * 0.4, s * 1.6, s * 0.35);
    // Grill with a slow smoke wisp, rising on the cycle phase.
    var gx = cx - s * 4.2, gy = cy + s * 2.6;
    ctx.fillStyle = rgb([36, 36, 38]);
    circle(gx, gy, s * 0.55);
    ctx.fill();
    ctx.fillStyle = rgb([70, 70, 72]);
    ctx.fillRect(gx - s * 0.5, gy - s * 0.9, s * 1.0, s * 0.3);
    var k;
    for (k = 0; k < 3; k++) {
      var sp = ((u * 3 + k / 3) % 1);
      var sa = (1 - sp) * 0.28;
      ctx.fillStyle = rgba([220, 220, 214], a4(sa));
      circle(gx + Math.sin(sp * 9 + k) * s * 0.25, gy - s * (1.2 + sp * 2.6), s * (0.25 + sp * 0.35));
      ctx.fill();
    }
  }

  // ---- Year banner ----------------------------------------------------
  // A small sign at the top of the lot carries the meet-up year,
  // so the tap's effect is legible in the frame itself.
  function drawBanner() {
    var s = Math.min(W, H) * 0.020;
    var bw = W * 0.34, bh = L.fsYear * 1.9;
    var bx = L.cx - bw / 2, by = H * 0.075;
    ctx.fillStyle = rgba([30, 26, 22], a4(0.72));
    rr(bx, by, bw, bh, 6);
    ctx.fill();
    ctx.strokeStyle = rgba(PAINT, a4(0.6));
    ctx.lineWidth = Math.max(1, W * 0.002);
    rr(bx, by, bw, bh, 6);
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CREAM, a4(0.94));
    ctx.font = '600 ' + L.fsYear + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('MEET-UP ' + YEARS[yearIndex], L.cx, by + bh / 2 + L.fsYear * 0.36);
    ctx.textAlign = 'left';
  }

  // ---- Golden-hour wash ------------------------------------------------
  function drawWarmth(t) {
    var a = sunWarmth(t);
    ctx.fillStyle = rgba([255, 176, 96], a4(a));
    ctx.fillRect(0, 0, W, H);
  }

  // ---- Caption and hint, on dark scrim plates --------------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var padX = W * 0.018, padY = L.fsCap * 0.55;
    var capW = W * 0.30, capH = L.fsCap + L.fsDate + padY * 2 + 8;
    ctx.fillStyle = rgba([10, 10, 10], a4(0.45));
    rr(W * 0.04 - padX, H * 0.04 - padY, capW, capH, 6);
    ctx.fill();
    ctx.fillStyle = rgba(CREAM, a4(0.92));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№872 · The Meet-Up', W * 0.04, H * 0.04 + L.fsCap * 0.8);
    ctx.fillStyle = rgba(CREAM, a4(0.62));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 06 · 01', W * 0.04, H * 0.04 + L.fsCap + L.fsDate + 8);
    // Hint pill, centred at the bottom.
    var hint = "Tap for next year's meet-up.";
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var pillW = hw + L.fsHint * 1.6, pillH = L.fsHint * 2.1;
    ctx.fillStyle = rgba([10, 10, 10], a4(0.45));
    rr(W / 2 - pillW / 2, H - pillH - L.fsHint * 0.7, pillW, pillH, pillH / 2);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CREAM, a4(0.88));
    ctx.fillText(hint, W / 2, H - L.fsHint * 0.7 - pillH / 2 + L.fsHint * 0.38);
    ctx.textAlign = 'left';
  }

  // ---- Year transition sweep -------------------------------------------
  function drawSweep(t) {
    var p = (t - transStart) / TRANS;
    if (p < 0 || p > 1) { return; }
    var x = -W * 0.12 + p * W * 1.24;
    ctx.fillStyle = rgba([255, 190, 110], a4(0.55 * (1 - Math.abs(p - 0.5) * 1.2)));
    ctx.fillRect(x - W * 0.05, 0, W * 0.10, H);
    ctx.fillStyle = rgba([255, 220, 160], a4(0.35));
    ctx.fillRect(x - W * 0.015, 0, W * 0.03, H);
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawLot(t);
    drawRing(t);
    drawCaprice(t);
    drawCentre(t);
    drawWarmth(t);
    drawBanner();
    drawSweep(t);
    drawText();
  }

  // Tap jumps to next year's meet-up, in order, wrapping from 2027
  // back to 2023. Taps during the 0.8 s sweep are ignored.
  function onTap() {
    if (lastT - transStart < TRANS) { return; }
    yearIndex = (yearIndex + 1) % 5;
    transStart = lastT;
    draw(lastT);
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', onTap);
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece872 exposes the clock, the cycle, the year list
  // and the tap cycle.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece872 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      year: function () { return YEARS[yearIndex]; },
      yearIndex: function () { return yearIndex; },
      tap: function () { onTap(); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 60 s cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
