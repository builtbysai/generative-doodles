<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Input</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(872033);

  // ---------- palette ----------
  var COL_BG = '#0A0A0A';
  var COL_GREEN = '#33FF66';
  var COL_RED = '#FF2200';
  var COL_AMBER = '#FFB000';
  var COL_WHITE = '#E8E8E0';

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return H > W * 1.15;
  }

  function resize() {
    var w = W, h = H;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    }
    W = Math.max(50, Math.floor(w)); H = Math.max(50, Math.floor(h));
    canvas.width = W; canvas.height = H;
    draw(0);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }

  // ---------- the self-feeding field ----------
  // A 48x48 energy field. Particles stream through it, deposit energy where
  // they pass, and are steered and re-energized by the field itself. The
  // field diffuses and decays. Nothing enters from outside except recorded
  // visitor disturbances, which the loop then owns.
  var N = 48;
  var field = new Float32Array(N * N);
  var fieldNext = new Float32Array(N * N);

  function fidx(cx, cy) { return cy * N + cx; }

  function sampleField(u, v) { // u,v in 0..1, bilinear
    var x = u * (N - 1), y = v * (N - 1);
    var x0 = Math.floor(x), y0 = Math.floor(y);
    var x1 = Math.min(N - 1, x0 + 1), y1 = Math.min(N - 1, y0 + 1);
    var fx = x - x0, fy = y - y0;
    var a = field[fidx(x0, y0)], b = field[fidx(x1, y0)];
    var c = field[fidx(x0, y1)], d = field[fidx(x1, y1)];
    return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
  }

  function fieldStats() {
    var sum = 0, flare = 0, i, e;
    for (i = 0; i < N * N; i++) {
      e = field[i]; sum += e;
      if (e > 1.15) flare++;
    }
    return { mean: sum / (N * N), flareFrac: flare / (N * N) };
  }

  // The three river bands, shared by the field seed and the particle seed.
  var BANDS = [
    { y: 0.28, amp: 0.055, ph: 1.7, en: 0.92 },
    { y: 0.52, amp: 0.075, ph: 4.2, en: 0.88 },
    { y: 0.75, amp: 0.05, ph: 2.6, en: 0.95 }
  ];
  function bandCenter(band, u) {
    return band.y + band.amp * Math.sin(u * 5.1 + band.ph) + 0.02 * Math.sin(u * 11.0 + band.ph * 2.0);
  }

  // Seed the field with structure: three winding river bands plus one
  // hotspot on the right edge where a flare is just beginning.
  (function seedField() {
    var cx, cy, u, v, e, band, d, i;
    for (cy = 0; cy < N; cy++) {
      for (cx = 0; cx < N; cx++) {
        u = cx / (N - 1); v = cy / (N - 1);
        e = 0.05 + rng() * 0.05; // residual noise floor, the desk's own hiss
        for (i = 0; i < BANDS.length; i++) {
          band = BANDS[i];
          d = Math.abs(v - bandCenter(band, u));
          e += band.en * Math.exp(-(d * d) / (2 * 0.045 * 0.045));
        }
        // hotspot: right edge, mid height, a flare being born
        var hx = u - 0.985, hy = v - 0.44;
        var hd = Math.sqrt(hx * hx * 3.2 + hy * hy);
        e += 1.15 * Math.exp(-(hd * hd) / (2 * 0.06 * 0.06));
        field[fidx(cx, cy)] = Math.min(2.2, e);
      }
    }
  })();

  // ---------- particles ----------
  var P_COUNT = isPhone() ? 520 : 820;
  var parts = [];
  (function seedParticles() {
    for (var i = 0; i < P_COUNT; i++) {
      var inBand = rng() < 0.82;
      var u = rng();
      var v;
      if (inBand) {
        var band = BANDS[Math.floor(rng() * 3)];
        v = bandCenter(band, u) + (rng() - 0.5) * 0.11;
      } else {
        v = rng();
      }
      var ang = (rng() - 0.5) * 0.5;
      parts.push({
        x: u, y: Math.max(0.01, Math.min(0.99, v)),
        vx: Math.cos(ang), vy: Math.sin(ang) * 0.4,
        seed: rng() * 1000
      });
    }
  })();

  // ---------- recorded disturbances ----------
  // Injections are stored as events and applied by the fixed-step sim, so
  // the loop digests the visitor on its own schedule, never instantly.
  var injections = []; // {cx, cy, amount, radius, born}
  var dragState = null; // {x, y, sx, sy, speed, trail:[{x,y,t}]}
  var simTime = 0;
  var drainAt = -1; // sim time of a fader pull
  var rebootRamp = 0; // 0..1 after a drain

  function addInjection(u, v, amount, radius) {
    injections.push({ u: u, v: v, amount: amount, radius: radius });
    if (injections.length > 40) injections.shift();
  }

  function applyInjections() {
    for (var k = 0; k < injections.length; k++) {
      var inj = injections[k];
      var r = inj.radius;
      var cx = Math.floor(inj.u * (N - 1)), cy = Math.floor(inj.v * (N - 1));
      var R = Math.ceil(r * N);
      for (var y = Math.max(0, cy - R); y <= Math.min(N - 1, cy + R); y++) {
        for (var x = Math.max(0, cx - R); x <= Math.min(N - 1, cx + R); x++) {
          var du = x / (N - 1) - inj.u, dv = y / (N - 1) - inj.v;
          var d2 = du * du + dv * dv;
          var g = Math.exp(-d2 / (2 * r * r));
          var i = fidx(x, y);
          field[i] = Math.min(2.2, field[i] + inj.amount * g);
        }
      }
    }
    injections.length = 0;
  }

  // ---------- fixed-timestep simulation ----------
  var DT = 1 / 60;
  var stepCount = 0;

  function stepSim() {
    stepCount++;
    simTime = stepCount * DT;

    // drain (fader pull) and reboot from the noise floor
    if (drainAt >= 0 && simTime >= drainAt) {
      for (var i = 0; i < N * N; i++) field[i] *= 0.05;
      drainAt = -1; rebootRamp = 0.0001;
    }
    if (rebootRamp > 0 && rebootRamp < 1) {
      rebootRamp = Math.min(1, rebootRamp + DT / 5.0);
      var add = 0.006 * rebootRamp;
      for (var j = 0; j < N * N; j++) {
        field[j] += add * (0.4 + rng() * 0.6) * 0.14;
        if (field[j] > 0.35) field[j] = 0.35;
      }
    }

    // drag injection with lag: the smoothed fader position trails the hand,
    // and the gain it adds is inertial, so the desk answers late.
    if (dragState) {
      dragState.sx += (dragState.x - dragState.sx) * 0.055;
      dragState.sy += (dragState.y - dragState.sy) * 0.055;
      dragState.trail.push({ x: dragState.sx, y: dragState.sy, t: simTime });
      while (dragState.trail.length && simTime - dragState.trail[0].t > 1.6) dragState.trail.shift();
      var amt = 0.05 + Math.min(0.16, dragState.speed * 0.10);
      addInjection(dragState.sx, dragState.sy, amt, 0.055);
    }

    applyInjections();

    // field diffusion + decay. Hot cells damp harder: the desk tames its
    // own howls, slowly.
    var meanE = 0;
    for (var m = 0; m < N * N; m++) meanE += field[m];
    meanE /= (N * N);
    for (var cy = 0; cy < N; cy++) {
      for (var cx = 0; cx < N; cx++) {
        var i2 = fidx(cx, cy);
        var c = field[i2];
        var l = field[fidx(Math.max(0, cx - 1), cy)];
        var r = field[fidx(Math.min(N - 1, cx + 1), cy)];
        var u2 = field[fidx(cx, Math.max(0, cy - 1))];
        var d2v = field[fidx(cx, Math.min(N - 1, cy + 1))];
        var avg = (l + r + u2 + d2v) * 0.25;
        var v = c + (avg - c) * 0.16;
        var decay = c > 1.15 ? 0.972 : 0.9965;
        v *= decay;
        fieldNext[i2] = v < 0.015 ? 0.015 : v; // the floor is the desk's own hiss
      }
    }
    var tmp = field; field = fieldNext; fieldNext = tmp;

    // particles: a base stream flows left to right; the field's vertical
    // gradient pulls streams toward the energy ridges, so they hug the
    // river bands, and local energy sets their speed. They deposit a
    // little energy as they pass: the stream feeds the field it rides.
    var eps = 1 / N;
    for (var p = 0; p < parts.length; p++) {
      var pt = parts[p];
      var e = sampleField(pt.x, pt.y);
      var gy = sampleField(pt.x, Math.min(1, pt.y + eps)) - sampleField(pt.x, Math.max(0, pt.y - eps));
      pt.vy += gy * 0.13;
      pt.vy *= 0.86;
      // a slow internal wander so quiet regions still breathe
      pt.vy += Math.sin(simTime * 0.6 + pt.seed) * 0.00004;
      var target = 0.0016 + e * 0.0034;
      var vyMax = target * 0.55;
      if (pt.vy > vyMax) pt.vy = vyMax;
      if (pt.vy < -vyMax) pt.vy = -vyMax;
      pt.vx = target;
      pt.x += pt.vx; pt.y += pt.vy;
      // wrap around: the loop has no outside
      if (pt.x < 0) pt.x += 1; if (pt.x > 1) pt.x -= 1;
      if (pt.y < 0) pt.y += 1; if (pt.y > 1) pt.y -= 1;
      // deposit: the stream feeds the field it rides
      var cell = fidx(Math.min(N - 1, Math.floor(pt.x * N)), Math.min(N - 1, Math.floor(pt.y * N)));
      field[cell] = Math.min(2.2, field[cell] + 0.0012);
    }
  }

  // Pre-roll so frame one is already mid-breath: rivers developed. The
  // edge flare is then seeded back in at its birth size: at frame one it
  // is just beginning, and the hot-cell damping will tame it from here.
  (function preRoll() {
    for (var i = 0; i < 40; i++) stepSim();
    var cx, cy, u, v, hx, hy, hd;
    for (cy = 0; cy < N; cy++) {
      for (cx = 0; cx < N; cx++) {
        u = cx / (N - 1); v = cy / (N - 1);
        hx = u - 0.985; hy = v - 0.44;
        hd = Math.sqrt(hx * hx * 3.2 + hy * hy);
        var i2 = fidx(cx, cy);
        field[i2] = Math.min(2.2, field[i2] + 1.15 * Math.exp(-(hd * hd) / (2 * 0.04 * 0.04)));
      }
    }
    simTime = 0; stepCount = 0;
  })();

  // ---------- drawing ----------
  function colorFor(e, alphaScale) {
    if (e > 1.8) return 'rgba(232,232,224,' + (0.9 * alphaScale) + ')';
    if (e > 1.15) return 'rgba(255,34,0,' + (Math.min(1, 0.35 + (e - 1.15) * 0.9) * alphaScale) + ')';
    return 'rgba(51,255,102,' + (Math.min(1, 0.16 + e * 0.70) * alphaScale) + ')';
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = COL_BG;
    ctx.fillRect(0, 0, W, H);

    // flare body: flat alpha cells where the loop is howling, so a young
    // flare reads even before the streams find it
    var cw = W / N, ch = H / N;
    var cx, cy, e, i;
    for (cy = 0; cy < N; cy++) {
      for (cx = 0; cx < N; cx++) {
        e = field[fidx(cx, cy)];
        if (e > 1.15) {
          ctx.fillStyle = e > 1.8
            ? 'rgba(232,232,224,' + Math.min(0.10, (e - 1.8) * 0.3 + 0.04) + ')'
            : 'rgba(255,34,0,' + Math.min(0.16, (e - 1.15) * 0.20) + ')';
          ctx.beginPath();
          ctx.arc((cx + 0.5) * cw, (cy + 0.5) * ch, cw * 0.78, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // filaments: one short streak per particle, colored and weighted by
    // the local energy it rides. A wide faint pass under a thin bright
    // pass gives each river its body.
    ctx.lineCap = 'round';
    for (var pass = 0; pass < 2; pass++) {
      for (i = 0; i < parts.length; i++) {
        var s = parts[i];
        var se = sampleField(s.x, s.y);
        if (pass === 0 && se < 0.30) continue;
        ctx.strokeStyle = colorFor(se, pass === 0 ? 0.15 : 1);
        ctx.lineWidth = pass === 0 ? Math.max(3, W / 190) : (se > 1.15 ? Math.max(1.2, W / 520) : Math.max(1, W / 620));
        var svl = Math.sqrt(s.vx * s.vx + s.vy * s.vy) || 1;
        var len = 7 + se * 9;
        var sx0 = s.x * W, sy0 = s.y * H;
        ctx.beginPath();
        ctx.moveTo(sx0 - (s.vx / svl) * len * (W / 720), sy0 - (s.vy / svl) * len * (H / 720));
        ctx.lineTo(sx0, sy0);
        ctx.stroke();
      }
    }

    // the amber fader: a lagging line that follows the drag, then dissolves
    if (dragState && dragState.trail.length > 1) {
      ctx.strokeStyle = COL_AMBER;
      ctx.lineWidth = Math.max(1.4, W / 480);
      ctx.lineCap = 'round';
      for (i = 1; i < dragState.trail.length; i++) {
        var a = dragState.trail[i - 1], b2 = dragState.trail[i];
        var age = simTime - b2.t;
        ctx.globalAlpha = Math.max(0, 0.85 * (1 - age / 1.6));
        ctx.beginPath();
        ctx.moveTo(a.x * W, a.y * H);
        ctx.lineTo(b2.x * W, b2.y * H);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = COL_AMBER;
      ctx.beginPath();
      ctx.arc(dragState.sx * W, dragState.sy * H, Math.max(2.4, W / 260), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- audio: a real self-feeding network, driven by the field ----------
  var AC = null, audioNodes = null;
  function ensureAudio() {
    if (AC || typeof window === 'undefined') return;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (typeof Ctor !== 'function') return;
    try {
      AC = new Ctor();
      var master = AC.createGain(); master.gain.value = 0.0;
      var comp = AC.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 20;
      comp.attack.value = 0.003; comp.release.value = 0.24;
      master.connect(comp); comp.connect(AC.destination);

      var len = 2 * AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0);
      var r = mulberry32(4451);
      for (var i = 0; i < len; i++) data[i] = r() * 2 - 1;
      var noise = AC.createBufferSource(); noise.buffer = buf; noise.loop = true;
      var noiseGain = AC.createGain(); noiseGain.gain.value = 0.5;

      var osc = AC.createOscillator(); osc.type = 'sine'; osc.frequency.value = 58;
      var oscGain = AC.createGain(); oscGain.gain.value = 0.30;

      var filter = AC.createBiquadFilter(); filter.type = 'bandpass';
      filter.frequency.value = 620; filter.Q.value = 5.5;
      var loopGain = AC.createGain(); loopGain.gain.value = 0.62;
      var delay = AC.createDelay(1.0); delay.delayTime.value = 0.23;
      var fbGain = AC.createGain(); fbGain.gain.value = 0.5;
      var wet = AC.createGain(); wet.gain.value = 0.8;

      noise.connect(noiseGain); noiseGain.connect(filter);
      osc.connect(oscGain); oscGain.connect(filter);
      filter.connect(loopGain); loopGain.connect(delay);
      delay.connect(fbGain); fbGain.connect(filter); // the desk eats its own output
      delay.connect(wet); wet.connect(master);
      filter.connect(master);
      noise.start(); osc.start();
      audioNodes = { master: master, filter: filter, fbGain: fbGain, osc: osc };
    } catch (err) {
      AC = null; audioNodes = null;
    }
  }
  var audioTick = 0;
  function updateAudio() {
    if (!AC || !audioNodes) return;
    if ((audioTick++ & 7) !== 0) return;
    var st = fieldStats();
    var t = AC.currentTime;
    var freq = 240 + st.mean * 1100 + st.flareFrac * 2600;
    audioNodes.filter.frequency.setTargetAtTime(Math.min(5200, freq), t, 0.25);
    audioNodes.fbGain.gain.setTargetAtTime(Math.min(0.78, 0.42 + st.flareFrac * 1.6 + st.mean * 0.22), t, 0.4);
    audioNodes.osc.frequency.setTargetAtTime(46 + st.mean * 60, t, 0.5);
    audioNodes.master.gain.setTargetAtTime(0.05 + Math.min(0.10, st.mean * 0.10 + st.flareFrac * 0.25), t, 0.3);
  }

  // ---------- pointer: recorded disturbances ----------
  function posOf(ev) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: W, height: H };
    var x = (ev.clientX - r.left) / (r.width || W);
    var y = (ev.clientY - r.top) / (r.height || H);
    return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
  }
  var downInfo = null;
  var lastTap = { t: -10, x: 0, y: 0 };

  function onDown(ev) {
    ensureAudio();
    if (AC && AC.state === 'suspended' && AC.resume) AC.resume();
    var p = posOf(ev);
    downInfo = { x: p.x, y: p.y, t: simTime, moved: 0, lastX: p.x, lastY: p.y };
    dragState = null;
  }
  function onMove(ev) {
    if (!downInfo) return;
    var p = posOf(ev);
    var dx = p.x - downInfo.lastX, dy = p.y - downInfo.lastY;
    var d = Math.sqrt(dx * dx + dy * dy);
    downInfo.moved += d;
    downInfo.lastX = p.x; downInfo.lastY = p.y;
    if (downInfo.moved > 0.012) {
      if (!dragState) {
        dragState = { x: p.x, y: p.y, sx: downInfo.x, sy: downInfo.y, speed: 0, trail: [] };
      }
      dragState.x = p.x; dragState.y = p.y;
      dragState.speed = dragState.speed * 0.8 + (d * 60) * 0.2;
    }
  }
  function onUp(ev) {
    if (!downInfo) return;
    var p = posOf(ev);
    var quick = simTime - downInfo.t < 0.45;
    var still = downInfo.moved <= 0.012;
    dragState = null;
    if (quick && still) {
      var dtap = simTime - lastTap.t;
      var dpos = Math.sqrt((p.x - lastTap.x) * (p.x - lastTap.x) + (p.y - lastTap.y) * (p.y - lastTap.y));
      if (dtap < 0.4 && dpos < 0.08) {
        drainAt = simTime + 0.05; // fader pull: drain, then reboot from the floor
        lastTap.t = -10;
      } else {
        addInjection(p.x, p.y, 0.85, 0.075); // fader push: one clean pulse
        lastTap = { t: simTime, x: p.x, y: p.y };
      }
    }
    downInfo = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---------- main loop: fixed timestep, frame one is the gate ----------
  resize();
  draw(); // frame one: synchronous, from the seeded pre-rolled state

  var lastTs = -1, acc = 0;
  function frame(ts) {
    if (lastTs < 0) lastTs = ts;
    var elapsed = (ts - lastTs) / 1000;
    lastTs = ts;
    if (elapsed > 0.25) elapsed = 0.25;
    acc += elapsed;
    var n = 0;
    while (acc >= DT && n < 8) { stepSim(); acc -= DT; n++; }
    if (n === 8) acc = 0;
    draw();
    updateAudio();
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
