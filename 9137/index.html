<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bend</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0b0e; overflow: hidden; height: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .caption {
    position: fixed; bottom: 18px; left: 22px; color: rgba(220,215,200,0.42);
    font: 11px/1.5 -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.14em;
    text-transform: uppercase; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption">The Bend &middot; after Gadamer</div>
<script>
/*
 * THE BEND
 * Pure abstraction on Gadamer's hermeneutics. A precise grid —
 * what was said, clear and ordered — bent by invisible currents
 * of interpretation. The grid never breaks. It only bends.
 * Where it bends most, it burns warm.
 */
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  // distortion field: sum of moving radial vortices + slow drift
  const VORT = [];
  let seed = 9137;
  function rnd() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  function buildVort() {
    VORT.length = 0; seed = 9137;
    for (let i = 0; i < 7; i++) {
      VORT.push({
        bx: rnd(), by: rnd(),
        r: 0.10 + rnd() * 0.16,
        str: (rnd() < 0.5 ? -1 : 1) * (0.25 + rnd() * 0.4),
        sp: 0.05 + rnd() * 0.10,
        ph: rnd() * Math.PI * 2
      });
    }
  }
  // displacement at normalized (x,y), time t -> {dx, dy, bend}
  function displace(nx, ny, t) {
    let dx = 0, dy = 0;
    for (const v of VORT) {
      const vx = v.bx + Math.cos(t * v.sp + v.ph) * 0.12;
      const vy = v.by + Math.sin(t * v.sp * 0.8 + v.ph) * 0.12;
      let ox = nx - vx, oy = ny - vy;
      const d = Math.hypot(ox, oy) + 1e-4;
      if (d > v.r * 2.2) continue;
      const fall = Math.exp(-(d * d) / (v.r * v.r));
      // tangential swirl
      const s = v.str * fall / d;
      dx += -oy * s * 0.22;
      dy += ox * s * 0.22;
    }
    // slow global drift
    dx += Math.sin(ny * 4 + t * 0.15) * 0.012;
    dy += Math.cos(nx * 3 - t * 0.12) * 0.012;
    const bend = Math.hypot(dx, dy);
    return { dx, dy, bend };
  }

  let grain = null;
  function makeGrain() {
    grain = document.createElement('canvas');
    grain.width = 128; grain.height = 128;
    const g = grain.getContext('2d');
    const d = g.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      d.data[i] = d.data[i+1] = d.data[i+2] = v;
      d.data[i+3] = 11;
    }
    g.putImageData(d, 0, 0);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildVort();
    ctx.fillStyle = '#0a0b0e';
    ctx.fillRect(0, 0, W, H);
  }

  // color by bend: true grid = cool slate, bent = warm amber
  function lineColor(bend) {
    const k = Math.min(1, bend * 14);
    const r = 110 + 130 * k;
    const g = 150 - 40 * k;
    const b = 180 - 110 * k;
    const a = 0.28 + 0.55 * k;
    return 'rgba('+(r|0)+','+(g|0)+','+(b|0)+','+a.toFixed(2)+')';
  }

  let T = 0;
  const GAP = 34;      // grid spacing px
  const SEG = 14;      // segments per cell for smooth curves

  function drawGridLine(x0, y0, x1, y1) {
    // subdivide and displace each point
    let prevX = null, prevY = null, prevB = 0;
    const steps = Math.max(8, Math.hypot(x1 - x0, y1 - y0) / SEG);
    for (let i = 0; i <= steps; i++) {
      const f = i / steps;
      const gx = x0 + (x1 - x0) * f;
      const gy = y0 + (y1 - y0) * f;
      const d = displace(gx / W, gy / H, T);
      const px = gx + d.dx * W * 0.38;
      const py = gy + d.dy * H * 0.38;
      if (prevX !== null) {
        const b = (prevB + d.bend) / 2;
        ctx.strokeStyle = lineColor(b);
        ctx.lineWidth = 0.7 + b * 7;
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(px, py);
        ctx.stroke();
      }
      prevX = px; prevY = py; prevB = d.bend;
    }
  }

  function frame() {
    T += 0.016;
    ctx.fillStyle = 'rgba(10,11,14,0.22)';
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round';
    // vertical lines
    for (let gx = -GAP; gx <= W + GAP; gx += GAP) {
      drawGridLine(gx, -GAP, gx, H + GAP);
    }
    // horizontal lines
    for (let gy = -GAP; gy <= H + GAP; gy += GAP) {
      drawGridLine(-GAP, gy, W + GAP, gy);
    }
    if (grain) {
      ctx.save(); ctx.globalAlpha = 0.5;
      ctx.fillStyle = ctx.createPattern(grain, 'repeat');
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }

  let running = true;
  function setRunning(v) {
    if (v === running) return;
    running = v;
    if (v) requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => setRunning(!document.hidden));
  window.addEventListener('blur', () => setRunning(false));
  window.addEventListener('focus', () => setRunning(true));
  window.addEventListener('resize', resize);
  makeGrain();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
