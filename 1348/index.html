<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Have You Lost?</title>
<style>
html,body{margin:0;padding:0;background:#2E2A24;overflow:hidden}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

var W=0,H=0;
var flyers=[],center=null,edgeFlyers=[];
var events=[];
var drag=null;
var audioCtx=null;
var fw=110,fh=148;

function vpSize(){
  var w,h;
  try{
    if(typeof window!=='undefined'&&window.visualViewport&&window.visualViewport.width){w=window.visualViewport.width;h=window.visualViewport.height;}
    else{w=window.innerWidth;h=window.innerHeight;}
  }catch(e){w=window.innerWidth;h=window.innerHeight;}
  return [w,h];
}

function buildLayout(){
  var wh=vpSize();W=wh[0];H=wh[1];
  var minD=Math.min(W,H);
  fw=Math.max(64,Math.min(130,minD*0.16));
  fh=fw*1.35;
  var cw=fw*2.2,ch=fh*2.2;
  center={x:W/2,y:H/2,w:cw,h:ch,rot:0.02};
  var rng=mulberry32(1348000);
  var cell=Math.sqrt(W*H/44);
  var cols=Math.max(4,Math.round(W/cell));
  var rows=Math.max(4,Math.round(H/cell));
  var cells=[];
  for(var i=0;i<cols;i++){for(var j=0;j<rows;j++){cells.push([i,j]);}}
  for(var k=cells.length-1;k>0;k--){var m2=Math.floor(rng()*(k+1));var tmp=cells[k];cells[k]=cells[m2];cells[m2]=tmp;}
  flyers=[];
  var cw2=W/cols,ch2=H/rows;
  var margin=14;
  function hitsCenter(x,y,w,h){
    return !(x+w/2<center.x-cw/2-margin||x-w/2>center.x+cw/2+margin||y+h/2<center.y-ch/2-margin||y-h/2>center.y+ch/2+margin);
  }
  var ci=0;
  for(var c=0;c<cells.length&&flyers.length<36;c++){
    var gx=cells[c][0],gy=cells[c][1];
    var x=gx*cw2+cw2/2+(rng()-0.5)*cw2*0.36;
    var y=gy*ch2+ch2/2+(rng()-0.5)*ch2*0.36;
    if(hitsCenter(x,y,fw,fh)){continue;}
    flyers.push(makeFlyer(x,y,ci++));
  }
  edgeFlyers=[
    makeFlyer(-fw*0.35,H*0.16,900),
    makeFlyer(W+fw*0.35,H*0.68,901),
    makeFlyer(W*0.28,-fh*0.35,902),
    makeFlyer(W*0.82,H+fh*0.30,903)
  ];
  events=[];
}

function makeFlyer(x,y,idx){
  var r=mulberry32(1348000+idx*7919);
  var marks=[];
  var nm=2+Math.floor(r()*2);
  for(var i=0;i<nm;i++){
    var kind=Math.floor(r()*3);
    marks.push({kind:kind,ox:(r()-0.5)*0.45,oy:-0.18+(r()-0.5)*0.5,rs:0.10+r()*0.14,rot:r()*6.283});
  }
  return {x:x,y:y,w:fw,h:fh,rot:(r()-0.5)*0.22,idx:idx,marks:marks,dx:0,dy:0,corner:Math.floor(r()*4)};
}

function size(){
  var wh=vpSize();
  canvas.width=wh[0];canvas.height=wh[1];
  canvas.style.width=wh[0]+'px';canvas.style.height=wh[1]+'px';
  try{document.body.style.background='#2E2A24';}catch(e){}
  buildLayout();
}

function tornRectPath(x,y,w,h,corner){
  var cut=Math.min(w,h)*0.22;
  ctx.beginPath();
  if(corner===0){
    ctx.moveTo(x-w/2+cut,y-h/2);ctx.lineTo(x+w/2,y-h/2);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x-w/2,y+h/2);ctx.lineTo(x-w/2,y-h/2+cut);ctx.closePath();
  }else if(corner===1){
    ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x+w/2-cut,y-h/2);ctx.lineTo(x+w/2,y-h/2+cut);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x-w/2,y+h/2);ctx.closePath();
  }else if(corner===2){
    ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x+w/2,y-h/2);ctx.lineTo(x+w/2,y+h/2-cut);ctx.lineTo(x+w/2-cut,y+h/2);ctx.lineTo(x-w/2,y+h/2);ctx.closePath();
  }else{
    ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x+w/2,y-h/2);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x-w/2+cut,y+h/2);ctx.lineTo(x-w/2,y+h/2-cut);ctx.closePath();
  }
}

function dot(x,y,r,fill){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,6.2832);ctx.fillStyle=fill;ctx.fill();
}

function drawMark(f,mk){
  var cx=f.x+f.dx+mk.ox*f.w, cy=f.y+f.dy+mk.oy*f.h;
  var s=mk.rs*Math.min(f.w,f.h);
  ctx.save();
  ctx.translate(cx,cy);ctx.rotate(mk.rot);
  if(mk.kind===0){
    ctx.fillStyle='#7A6B52';
    dot(-s*0.4,0,s*0.55,'#7A6B52');
    dot(s*0.35,-s*0.15,s*0.45,'#7A6B52');
    dot(0,s*0.35,s*0.4,'#8A7A5C');
  }else if(mk.kind===1){
    ctx.strokeStyle='#6B5C44';ctx.lineWidth=Math.max(1.5,s*0.12);
    ctx.beginPath();ctx.moveTo(0,-s);ctx.arc(0,0,s,Math.PI*0.9,Math.PI*1.9);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*0.95,s*0.3);ctx.lineTo(s*0.95,s*1.1);ctx.stroke();
  }else{
    ctx.strokeStyle='#7A6B52';ctx.lineWidth=Math.max(1.5,s*0.14);
    ctx.beginPath();ctx.moveTo(s,0);ctx.arc(0,0,s,0,6.2832);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*0.4,0);ctx.arc(0,0,s*0.4,0,6.2832);ctx.stroke();
  }
  ctx.restore();
}

function drawFlyer(f){
  var x=f.x+f.dx,y=f.y+f.dy;
  ctx.save();
  ctx.translate(x,y);ctx.rotate(f.rot);
  ctx.fillStyle='#C9BFA4';
  tornRectPath(3,-3,f.w,f.h,f.corner);ctx.fill();
  ctx.fillStyle='#E8E0CC';
  tornRectPath(0,0,f.w,f.h,f.corner);ctx.fill();
  ctx.strokeStyle='#C9BFA4';ctx.lineWidth=1;
  tornRectPath(0,0,f.w,f.h,f.corner);ctx.stroke();
  ctx.restore();
  for(var i=0;i<f.marks.length;i++){drawMark(f,f.marks[i]);}
  ctx.save();
  ctx.translate(x,y);ctx.rotate(f.rot);
  ctx.fillStyle='#A02C2C';
  ctx.beginPath();
  var sw=f.w*0.42,sh=Math.max(8,f.h*0.07);
  ctx.moveTo(-sw/2,f.h/2-sh);ctx.lineTo(sw/2,f.h/2-sh);ctx.lineTo(sw/2-3,f.h/2);ctx.lineTo(sw/2-8,f.h/2-2);ctx.lineTo(-sw/2+4,f.h/2);ctx.closePath();
  ctx.fill();
  ctx.restore();
  dot(x,y-f.h/2+10,4,'#3A3428');
  dot(x-1,y-f.h/2+9,1.4,'#8A8474');
  var r=mulberry32(1348000+f.idx*7919+77);
  ctx.fillStyle='rgba(201,191,164,0.25)';
  for(var g=0;g<14;g++){
    var gx=x+(r()-0.5)*f.w*0.9, gy=y+(r()-0.5)*f.h*0.9;
    ctx.fillRect(gx,gy,1.4,1.4);
  }
}

function boardActivity(t){
  var a=0;
  for(var i=0;i<events.length;i++){
    var age=t-events[i].t;
    if(age>=0&&age<6){a=Math.max(a,Math.exp(-age/4));}
  }
  return a;
}

function draw(t){
  curT=t;
  ctx.fillStyle='#2E2A24';
  ctx.fillRect(0,0,W,H);
  var br=mulberry32(99);
  ctx.fillStyle='rgba(0,0,0,0.10)';
  for(var b=0;b<120;b++){ctx.fillRect(br()*W,br()*H,2,2);}
  var dragged=(drag&&drag.flyer)?drag.flyer:null;
  for(var i=0;i<edgeFlyers.length;i++){drawFlyer(edgeFlyers[i]);}
  for(var j=0;j<flyers.length;j++){if(flyers[j]!==dragged){drawFlyer(flyers[j]);}}
  if(dragged){drawFlyer(dragged);}
  ctx.save();
  ctx.translate(center.x,center.y);ctx.rotate(center.rot);
  ctx.fillStyle='#C9BFA4';
  tornRectPath(4,-4,center.w,center.h,1);ctx.fill();
  ctx.fillStyle='#E8E0CC';
  tornRectPath(0,0,center.w,center.h,1);ctx.fill();
  ctx.strokeStyle='#C9BFA4';ctx.lineWidth=1;
  tornRectPath(0,0,center.w,center.h,1);ctx.stroke();
  ctx.restore();
  dot(center.x,center.y-center.h/2+12,5,'#3A3428');
  dot(center.x-1,center.y-center.h/2+11,1.6,'#8A8474');
  var act=boardActivity(t);
  var period=act>0.05?2.5:5.5;
  var ph=(t%period)/period;
  var pulse=0.5+0.5*Math.sin(ph*6.2832);
  var rr=Math.min(center.w,center.h)*0.20*(1+0.08*pulse);
  ctx.strokeStyle='rgba(245,200,110,'+(0.45+0.45*pulse)+')';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(center.x+rr,center.y);ctx.arc(center.x,center.y,rr,0,6.2832);ctx.stroke();
  ctx.strokeStyle='rgba(245,200,110,'+(0.10+0.10*pulse)+')';
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(center.x+rr*1.5,center.y);ctx.arc(center.x,center.y,rr*1.5,0,6.2832);ctx.stroke();
  for(var e=0;e<events.length;e++){
    var ev=events[e];
    drawRipple(ev.flyer,ev.t,t,1.0);
    for(var c=0;c<ev.chorus.length;c++){
      var ch=ev.chorus[c];
      drawRipple(ch.flyer,ev.t+ch.delay,t,ch.vol);
    }
  }
}

function drawRipple(f,startT,t,vol){
  var age=t-startT;
  if(age<0||age>0.6){return;}
  var p=age/0.6;
  var maxR=Math.max(60,Math.min(W,H)*0.12);
  var x=f.x+f.dx,y=f.y+f.dy;
  ctx.strokeStyle='rgba(245,200,110,'+((1-p)*0.9*vol).toFixed(3)+')';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x+maxR*p,y);ctx.arc(x,y,Math.max(1,maxR*p),0,6.2832);ctx.stroke();
  if(p<0.5){
    dot(x,y,3+2*p,'rgba(245,200,110,'+(0.8*(1-p*2)).toFixed(3)+')');
  }
}

function playTone(freq,vol,delayMs){
  try{
    if(typeof AudioContext==='undefined'&&typeof webkitAudioContext==='undefined'){return;}
    if(!audioCtx){audioCtx=new (AudioContext||webkitAudioContext)();}
    var t0=audioCtx.currentTime+(delayMs||0)/1000;
    var osc=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    osc.type='sine';osc.frequency.value=freq;
    g.gain.setValueAtTime(Math.min(0.25,vol),t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+1.2);
    osc.connect(g);g.connect(audioCtx.destination);
    osc.start(t0);osc.stop(t0+1.25);
  }catch(err){}
}

function speak(f,t){
  var list=[];
  for(var i=0;i<flyers.length;i++){
    if(flyers[i]===f){continue;}
    var dx=flyers[i].x-(f.x+f.dx);
    var dy=flyers[i].y-(f.y+f.dy);
    list.push({flyer:flyers[i],d:Math.sqrt(dx*dx+dy*dy)});
  }
  list.sort(function(a,b){return a.d-b.d;});
  var bandStep=1.8*Math.sqrt(fw*fw+fh*fh);
  var chorus=[];
  for(var k=0;k<list.length&&chorus.length<18;k++){
    var band=Math.floor(list[k].d/bandStep);
    if(band>2){break;}
    chorus.push({flyer:list[k].flyer,delay:0.09*(chorus.length+1),vol:Math.max(0.25,1-list[k].d/(bandStep*3))});
  }
  var ev={t:t,flyer:f,chorus:chorus};
  events.push(ev);
  var freq=180+((f.idx%25)*20);
  playTone(freq,0.22,0);
  for(var c=0;c<chorus.length;c++){
    var cf=180+((chorus[c].flyer.idx%25)*20);
    playTone(cf,0.22*chorus[c].vol,chorus[c].delay*1000);
  }
}

function localPoint(f,px,py){
  var x=px-(f.x+f.dx),y=py-(f.y+f.dy);
  var co=Math.cos(-f.rot),si=Math.sin(-f.rot);
  return [x*co-y*si,x*si+y*co];
}

function hitFlyer(px,py){
  for(var i=flyers.length-1;i>=0;i--){
    var f=flyers[i];
    var lp=localPoint(f,px,py);
    if(Math.abs(lp[0])<f.w/2&&Math.abs(lp[1])<f.h/2){return f;}
  }
  for(var j=edgeFlyers.length-1;j>=0;j--){
    var e2=edgeFlyers[j];
    var lp2=localPoint(e2,px,py);
    if(Math.abs(lp2[0])<e2.w/2&&Math.abs(lp2[1])<e2.h/2){return e2;}
  }
  return null;
}

function hitCenter(px,py){
  var lp=localPoint(center,px,py);
  return Math.abs(lp[0])<center.w/2&&Math.abs(lp[1])<center.h/2;
}

function evPos(ev){
  if(typeof ev.offsetX!=='undefined'){return [ev.offsetX,ev.offsetY];}
  var r={left:0,top:0};
  try{r=canvas.getBoundingClientRect();}catch(err){}
  return [ev.clientX-r.left,ev.clientY-r.top];
}

var t0base=0,loopStarted=false,curT=0;
function onDown(ev){
  try{if(ev.preventDefault){ev.preventDefault();}}catch(err){}
  var p=evPos(ev);
  if(hitCenter(p[0],p[1])){drag=null;return;}
  var f=hitFlyer(p[0],p[1]);
  if(f){drag={flyer:f,startX:p[0],startY:p[1],grabDX:f.dx,grabDY:f.dy,moved:false};}
}
function onMove(ev){
  if(!drag){return;}
  var p=evPos(ev);
  var dx=p[0]-drag.startX,dy=p[1]-drag.startY;
  if(Math.abs(dx)>8||Math.abs(dy)>8){drag.moved=true;}
  if(drag.moved){
    drag.flyer.dx=drag.grabDX+dx;
    drag.flyer.dy=drag.grabDY+dy;
  }
  if(loopStarted){draw(curT);}
}
function onUp(ev){
  if(!drag){return;}
  var d=drag;drag=null;
  if(!d.moved){
    speak(d.flyer,curT);
    if(loopStarted){draw(curT);}
  }
}

try{canvas.addEventListener('pointerdown',onDown);}catch(err){}
try{window.addEventListener('pointermove',onMove);}catch(err){}
try{window.addEventListener('pointerup',onUp);}catch(err){}
try{
  if(window.visualViewport&&window.visualViewport.addEventListener){window.visualViewport.addEventListener('resize',size);}
  window.addEventListener('resize',size);
}catch(err){}

size();
draw(0);
if(typeof requestAnimationFrame!=='undefined'){
  loopStarted=true;
  var rafStart=null;
  var loopFn=function(ts){
    if(rafStart===null){rafStart=ts;t0base=ts/1000;}
    draw(ts/1000-t0base);
    requestAnimationFrame(loopFn);
  };
  requestAnimationFrame(loopFn);
}
})();
</script>
</body>
</html>
