<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Panther</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #E63312; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (flat fills only, no gradients anywhere, no shading)
  var RED = '#E63312', BLACK = '#111111', YELLOW = '#FFC400',
      BLUE = '#2B4FE0', WHITE = '#FFFFFF';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---- precomputed gouache grain (seeded speck array, drawn directly;
  // the QA renderer has no offscreen canvas) ----
  var grain = [];
  (function buildGrain() {
    var rng = mulberry32(522063);
    for (var i = 0; i < 900; i++) {
      var white = rng() < 0.55;
      grain.push({
        x: rng(), y: rng(),
        r: 0.0012 + rng() * 0.0021,
        col: white ? '255,255,255' : '0,0,0',
        a: 0.045 + rng() * 0.05
      });
    }
  })();

  // ---- whisker set, in half-face coords (u = distance from the centre
  // axis, v = stage y). Mirrored for the right side. ----
  var WHISKERS = [
    { bu: 0.118, bv: 0.472, cu: 0.300, cv: 0.415, tu: 0.452, tv: 0.352 },
    { bu: 0.128, bv: 0.502, cu: 0.315, cv: 0.478, tu: 0.470, tv: 0.452 },
    { bu: 0.130, bv: 0.532, cu: 0.320, cv: 0.540, tu: 0.478, tv: 0.545 },
    { bu: 0.124, bv: 0.560, cu: 0.305, cv: 0.600, tu: 0.462, tv: 0.632 },
    { bu: 0.112, bv: 0.585, cu: 0.280, cv: 0.655, tu: 0.428, tv: 0.700 }
  ];

  var BREATH_PERIOD = 3.8;              // jaw breath cycle, seconds
  var BLINK_PERIOD = 4.6;               // blink cycle, seconds
  var PHASE0 = 3.8;                     // frame one: jaw at rest (drop 0),
                                        // eyes open (blink window is
                                        // 3.9..4.12 of the blink cycle)

  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw(simT);
  }

  function isPhone() {
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    if (sw < 700) return true;
    return H > W * 1.15;
  }

  function circle(x, y, r, fill) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
  }

  // jaw drop: 0 at rest, up to ~0.0075 stage units at full breath
  function jawDrop(t) {
    return 0.0075 * (0.5 - 0.5 * Math.cos(2 * Math.PI * t / BREATH_PERIOD));
  }

  // eyelid scale: 1 open, dips to ~0.08 during the blink window
  function blinkScale(t) {
    var p = ((t % BLINK_PERIOD) + BLINK_PERIOD) % BLINK_PERIOD;
    if (p < 3.9 || p > 4.12) return 1;
    var k = (p - 3.9) / 0.22;
    return 1 - 0.92 * Math.sin(Math.PI * k);
  }

  // ---- head silhouette: one half traced, then mirrored. The two fills
  // share the centre axis, so the seam is invisible and the outline is
  // symmetric to the pixel. s = +1 left, -1 right; X(u) maps a distance
  // from the axis to a stage x. ----
  function drawHeadHalf(s) {
    function X(u) { return 0.5 - s * u; }
    ctx.beginPath();
    ctx.moveTo(X(0), 0.150);
    // forehead out to the ear's inner base
    ctx.bezierCurveTo(X(0.100), 0.148, X(0.175), 0.150, X(0.225), 0.180);
    // pointed ear
    ctx.lineTo(X(0.315), 0.082);
    ctx.lineTo(X(0.262), 0.232);
    // side of the head down to the cheek (widest at v = 0.50)
    ctx.bezierCurveTo(X(0.335), 0.300, X(0.352), 0.400, X(0.352), 0.500);
    // jowl tuck, then chin sweeping to the bottom of the axis
    ctx.bezierCurveTo(X(0.350), 0.600, X(0.300), 0.685, X(0.215), 0.745);
    ctx.bezierCurveTo(X(0.140), 0.795, X(0.070), 0.815, X(0), 0.818);
    ctx.closePath();
    ctx.fillStyle = BLACK; ctx.fill();
  }

  // ---- one ringed eye, blink applied as a vertical squash ----
  function drawEyeHalf(s, bScale) {
    var cx = 0.5 - s * 0.125, cy = 0.362;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, bScale);
    ctx.translate(-cx, -cy);
    circle(cx, cy, 0.0540, YELLOW);
    circle(cx, cy, 0.0400, BLACK);
    circle(cx, cy, 0.0275, YELLOW);
    circle(cx, cy, 0.0150, BLACK);
    ctx.restore();
  }

  // ---- one tapered whisker: a filled sliver from base through a bowed
  // control point to a sharp tip. Tremble moves the control point. ----
  function drawWhiskerHalf(s, w, t, idx) {
    function X(u) { return 0.5 - s * u; }
    var tremble = 0.0016 * Math.sin(2 * Math.PI * t / 1.7 + idx * 0.9);
    var bx = X(w.bu), by = w.bv;
    var cx = X(w.cu), cy = w.cv + tremble;
    var tx = X(w.tu), ty = w.tv;
    var dx = cx - bx, dy = cy - by;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var px = (-dy / len) * 0.0042, py = (dx / len) * 0.0042;
    ctx.beginPath();
    ctx.moveTo(bx + px, by + py);
    ctx.quadraticCurveTo(cx, cy, tx, ty);
    ctx.lineTo(bx - px, by - py);
    ctx.closePath();
    ctx.fillStyle = WHITE; ctx.fill();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = RED;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S, S);

    var d = jawDrop(t);
    var bScale = blinkScale(t);
    var s, i;

    // head silhouette, both halves
    drawHeadHalf(1);
    drawHeadHalf(-1);

    // blue muzzle: one symmetric shape, two lobes with a centre dip
    ctx.beginPath();
    ctx.moveTo(0.500, 0.432);
    ctx.bezierCurveTo(0.545, 0.425, 0.600, 0.435, 0.628, 0.475);
    ctx.bezierCurveTo(0.652, 0.515, 0.645, 0.555, 0.605, 0.578);
    ctx.bezierCurveTo(0.565, 0.598, 0.530, 0.585, 0.500, 0.588);
    ctx.bezierCurveTo(0.470, 0.585, 0.435, 0.598, 0.395, 0.578);
    ctx.bezierCurveTo(0.355, 0.555, 0.348, 0.515, 0.372, 0.475);
    ctx.bezierCurveTo(0.400, 0.435, 0.455, 0.425, 0.500, 0.432);
    ctx.closePath();
    ctx.fillStyle = BLUE; ctx.fill();

    // black nose, centred on the vertical middle of the face
    ctx.beginPath();
    ctx.moveTo(0.500, 0.512);
    ctx.bezierCurveTo(0.475, 0.492, 0.455, 0.478, 0.457, 0.464);
    ctx.bezierCurveTo(0.459, 0.450, 0.478, 0.446, 0.500, 0.446);
    ctx.bezierCurveTo(0.522, 0.446, 0.541, 0.450, 0.543, 0.464);
    ctx.bezierCurveTo(0.545, 0.478, 0.525, 0.492, 0.500, 0.512);
    ctx.closePath();
    ctx.fillStyle = BLACK; ctx.fill();

    // philtrum line from nose to mouth
    ctx.beginPath();
    ctx.moveTo(0.500, 0.514);
    ctx.lineTo(0.500, 0.548);
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = 0.0055;
    ctx.lineCap = 'round';
    ctx.stroke();

    // open roaring mouth: cavity in the ground red (a poster cut-out),
    // its floor riding the breath drop
    ctx.beginPath();
    ctx.moveTo(0.352, 0.578);
    ctx.bezierCurveTo(0.430, 0.596, 0.570, 0.596, 0.648, 0.578);
    ctx.bezierCurveTo(0.640, 0.660, 0.585, 0.735 + d, 0.500, 0.748 + d);
    ctx.bezierCurveTo(0.415, 0.735 + d, 0.360, 0.660, 0.352, 0.578);
    ctx.closePath();
    ctx.fillStyle = RED; ctx.fill();

    // upper teeth: two big fangs and a row of small teeth, hanging
    // from the jaw line
    ctx.fillStyle = WHITE;
    ctx.beginPath();                                    // left fang
    ctx.moveTo(0.380, 0.580); ctx.lineTo(0.414, 0.586); ctx.lineTo(0.397, 0.680);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();                                    // right fang
    ctx.moveTo(0.586, 0.586); ctx.lineTo(0.620, 0.580); ctx.lineTo(0.603, 0.680);
    ctx.closePath(); ctx.fill();
    var upTeeth = [0.438, 0.469, 0.500, 0.531, 0.562];
    for (i = 0; i < upTeeth.length; i++) {
      var ux = upTeeth[i];
      ctx.beginPath();
      ctx.moveTo(ux - 0.0085, 0.586);
      ctx.lineTo(ux + 0.0085, 0.586);
      ctx.lineTo(ux, 0.616);
      ctx.closePath(); ctx.fill();
    }
    // lower teeth: two fangs and small teeth, rising with the jaw floor
    ctx.beginPath();
    ctx.moveTo(0.440, 0.744 + d); ctx.lineTo(0.466, 0.744 + d); ctx.lineTo(0.453, 0.664 + d);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.534, 0.744 + d); ctx.lineTo(0.560, 0.744 + d); ctx.lineTo(0.547, 0.664 + d);
    ctx.closePath(); ctx.fill();
    var lowTeeth = [0.478, 0.500, 0.522];
    for (i = 0; i < lowTeeth.length; i++) {
      var lx = lowTeeth[i];
      ctx.beginPath();
      ctx.moveTo(lx - 0.0075, 0.748 + d);
      ctx.lineTo(lx + 0.0075, 0.748 + d);
      ctx.lineTo(lx, 0.724 + d);
      ctx.closePath(); ctx.fill();
    }

    // ringed eyes, both halves
    drawEyeHalf(1, bScale);
    drawEyeHalf(-1, bScale);

    // whiskers radiating past the silhouette edge, both halves
    for (s = 1; s >= -1; s -= 2) {
      for (i = 0; i < WHISKERS.length; i++) {
        drawWhiskerHalf(s, WHISKERS[i], t, i);
      }
    }

    // gouache grain over every fill
    for (i = 0; i < grain.length; i++) {
      var g = grain[i];
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + g.col + ',' + g.a + ')';
      ctx.fill();
    }

    ctx.restore();
  }

  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    simT = PHASE0 + (now - startStamp) / 1000;
    draw(simT);
    if (typeof window.requestAnimationFrame === 'function') {
      window.requestAnimationFrame(frame);
    }
  }

  function onResize() { resize(); }
  window.addEventListener('resize', onResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

  resize();          // sets size and draws frame one via draw(simT = PHASE0)
  draw(PHASE0);      // frame one: synchronous, constant phase, jaw at
                     // rest, eyes open
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
