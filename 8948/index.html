<!DOCTYPE html>
<!-- phantom-fill-8948 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Exactness Gate — №8948</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0b0b09;color:#e8e2d4;font-family:"Courier New",monospace;overflow:hidden}
  #stage{position:fixed;inset:0}
  .hud{position:absolute;z-index:2;pointer-events:none}
  #title{top:22px;left:26px}
  #title h1{font-size:15px;letter-spacing:.35em;font-weight:400}
  #title p{font-size:11px;letter-spacing:.18em;color:#8a8371;margin-top:6px}
  #num{top:22px;right:26px;text-align:right;font-size:11px;letter-spacing:.25em;color:#8a8371}
  #meterBox{right:26px;top:50%;transform:translateY(-50%);width:150px;text-align:right}
  #meterBox .lab{font-size:10px;letter-spacing:.3em;color:#8a8371}
  #songness{font-size:44px;color:#ffd84d;margin:4px 0 2px}
  #state{font-size:11px;letter-spacing:.25em;color:#7fe3c0}
  #bar{width:150px;height:5px;background:#26261f;margin-top:10px}
  #fill{height:100%;background:#ffd84d;width:100%;transition:width .15s}
  #gate{left:26px;top:50%;transform:translateY(-50%);width:120px;pointer-events:auto;cursor:ns-resize;text-align:center}
  #gate .lab{font-size:10px;letter-spacing:.3em;color:#8a8371}
  #cents{font-size:30px;color:#ffd84d;margin:6px 0}
  #rail{width:6px;height:220px;background:#26261f;margin:10px auto;position:relative}
  #handle{position:absolute;left:50%;transform:translate(-50%,-50%);width:34px;height:14px;background:#ffd84d;top:0}
  #gate .hint{font-size:10px;color:#8a8371;letter-spacing:.12em;line-height:1.7}
  #start{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:3;background:none;border:1px solid #ffd84d;color:#ffd84d;font:inherit;font-size:12px;letter-spacing:.35em;padding:12px 26px;cursor:pointer}
  #start:hover{background:#ffd84d;color:#0b0b09}
  #note{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:#8a8371;z-index:2}
  @media(max-width:640px){#meterBox{width:110px}#songness{font-size:32px}#gate{width:90px}#rail{height:150px}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud" id="title"><h1>THE EXACTNESS GATE</h1><p>№8948 — DETUNE THE LOOP. WATCH SONG-NESS COLLAPSE.</p></div>
<div class="hud" id="num">GENERATIVE<br>DOODLES<br>8948</div>
<div class="hud" id="meterBox">
  <div class="lab">SONG-NESS</div>
  <div id="songness">100</div>
  <div id="state">IN TUNE</div>
  <div id="bar"><div id="fill"></div></div>
</div>
<div class="hud" id="gate">
  <div class="lab">DETUNE</div>
  <div id="cents">+0¢</div>
  <div id="rail"><div id="handle"></div></div>
  <div class="hint">DRAG THE RAIL<br>0 → 100 CENTS<br>= ONE SEMITONE</div>
</div>
<div id="note">EIGHT NOTES. ONE LOOP. EXACTNESS IS THE GAME.</div>
<button id="start">BEGIN THE LOOP</button>
<script>
(function(){
  "use strict";
  var cv=document.getElementById('stage'),ctx=cv.getContext('2d'),W,H;
  function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
  size();addEventListener('resize',size);
  // --- the loop: 8 steps, pentatonic over a drone ---
  var SCALE=[0,3,5,7,10,12,15,12,10,7,5,3];
  var MEL=[0,2,4,7,4,2,5,3], step=0, detune=0, playing=false, muted=false;
  var AC, master, droneOsc, timer=null;
  var centsEl=document.getElementById('cents'), songEl=document.getElementById('songness'),
      stateEl=document.getElementById('state'), fillEl=document.getElementById('fill'),
      handle=document.getElementById('handle'), rail=document.getElementById('rail');
  function freq(semi,base){return base*Math.pow(2,semi/12);}
  function songness(){return Math.round(100*Math.exp(-Math.pow(detune/32,2)));}
  function updateHUD(){
    centsEl.textContent=(detune>=0?'+':'')+Math.round(detune)+'¢';
    var s=songness();songEl.textContent=s;fillEl.style.width=s+'%';
    var st, col;
    if(s>85){st='IN TUNE';col='#7fe3c0';}
    else if(s>45){st='DRIFTING';col='#ffd84d';}
    else if(s>12){st='COLLAPSING';col='#ff9a3d';}
    else{st='NOISE';col='#ff5a4d';}
    stateEl.textContent=st;stateEl.style.color=col;fillEl.style.background=col;
    handle.style.top=(detune/100*100)+'%';
    handle.style.background=col;
  }
  function note(semi,t,dur,vol){
    var o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';
    // per-note detune: each voice drifts by its own fraction of the gate
    var spread=(Math.random()*2-1)*detune;
    o.frequency.value=freq(SCALE[semi%SCALE.length],220);
    o.detune.value=spread;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
  }
  function tick(){
    if(!playing)return;
    var t=AC.currentTime+0.05;
    note(MEL[step],t,0.42,0.5);
    if(step%4===0)note(0,t,0.9,0.18);
    step=(step+1)%MEL.length;
  }
  function startAudio(){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.8;master.connect(AC.destination);
    droneOsc=AC.createOscillator();droneOsc.type='sine';
    var dg=AC.createGain();dg.gain.value=0.07;
    droneOsc.frequency.value=110;droneOsc.connect(dg);dg.connect(master);droneOsc.start();
    playing=true;timer=setInterval(tick,340);tick();
  }
  document.getElementById('start').addEventListener('click',function(){
    if(!AC){startAudio();this.textContent='MUTE';}
    else if(muted){master.gain.value=0.8;muted=false;this.textContent='MUTE';AC.resume();}
    else{master.gain.value=0;this.textContent='UNMUTE';muted=true;}
  });
  // --- drag the detune rail ---
  var dragging=false;
  function setFromY(y){
    var r=rail.getBoundingClientRect();
    detune=Math.max(0,Math.min(100,(y-r.top)/r.height*100));
    updateHUD();
  }
  rail.addEventListener('pointerdown',function(e){dragging=true;rail.setPointerCapture(e.pointerId);setFromY(e.clientY);});
  rail.addEventListener('pointermove',function(e){if(dragging)setFromY(e.clientY);});
  rail.addEventListener('pointerup',function(){dragging=false;});
  // --- AudioContext lifecycle: suspend on hide/blur/close ---
  function suspend(){if(AC&&AC.state==='running')AC.suspend();}
  function resume(){if(AC&&AC.state==='suspended'&&!muted)AC.resume();}
  document.addEventListener('visibilitychange',function(){document.hidden?suspend():resume();});
  addEventListener('blur',suspend);addEventListener('focus',resume);
  addEventListener('pagehide',suspend);addEventListener('beforeunload',suspend);
  // --- render: the loop as a ring of 8 notes; detune scatters them ---
  function draw(){
    ctx.clearRect(0,0,W,H);
    var cx=W/2,cy=H/2,R=Math.min(W,H)*0.26;
    var s=songness()/100, scatter=(1-s)*R*0.55;
    ctx.strokeStyle='rgba(232,226,212,0.18)';ctx.lineWidth=1*devicePixelRatio;
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
    for(var i=0;i<8;i++){
      var a=i/8*Math.PI*2-Math.PI/2;
      var jx=(Math.sin(i*12.9898)*43758.5453%1)*scatter;
      var jy=(Math.cos(i*78.233)*43758.5453%1)*scatter;
      var x=cx+Math.cos(a)*R+jx, y=cy+Math.sin(a)*R+jy;
      var active=(i===((step+7)%8));
      ctx.beginPath();ctx.arc(x,y,(active?9:5)*devicePixelRatio,0,Math.PI*2);
      ctx.fillStyle=active?'#ffd84d':'rgba(232,226,212,0.75)';ctx.fill();
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);
      ctx.strokeStyle=active?'rgba(255,216,77,0.5)':'rgba(232,226,212,0.12)';ctx.stroke();
    }
    ctx.fillStyle='rgba(232,226,212,0.9)';ctx.textAlign='center';
    ctx.font=(13*devicePixelRatio)+'px "Courier New",monospace';
    ctx.fillText('STEP '+(((step+7)%8)+1)+' / 8',cx,cy+4*devicePixelRatio);
    requestAnimationFrame(draw);
  }
  updateHUD();draw();
})();
</script>
</body>
</html>
