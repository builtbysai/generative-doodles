<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Exactness Gate · №8948</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #141318; overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 70vw;
    font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(232, 228, 240, 0.62); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 system-ui, sans-serif;
    color: rgba(232, 228, 240, 0.38);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #ui {
    position: fixed; left: 14px; top: 108px; z-index: 5;
    display: flex; flex-direction: column; gap: 10px;
    font: 400 13px/1.5 system-ui, sans-serif; color: #e8e4f0;
  }
  #ui label { display: flex; align-items: center; gap: 8px; }
  #detune { width: 200px; accent-color: #c9a86a; }
  .btn {
    font: 500 13px/1.4 system-ui, sans-serif; color: #141318;
    background: #c9a86a; border: none; border-radius: 8px;
    padding: 8px 14px; cursor: pointer; width: fit-content;
  }
  .btn.ghost { background: transparent; color: #c9a86a; border: 1px solid #c9a86a; }
  #readout { font-variant-numeric: tabular-nums; color: rgba(232,228,240,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui">
  <button class="btn" id="play">play the loop</button>
  <label>detune <input type="range" id="detune" min="-150" max="150" value="0" step="1"></label>
  <div id="readout">+0 cents</div>
  <button class="btn ghost" id="shuffle">shuffle the syllables</button>
  <button class="btn ghost" id="reveal">reveal the measured edge</button>
  <div id="edge" style="max-width:230px;color:rgba(232,228,240,0.75);display:none"></div>
</div>
<div id="cap">Detune the loop by fractions of a semitone. There is a cliff where the song dies. Find it by ear first.</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   The Exactness Gate — №8948 (2026-07-11), seed 245
   From the speech-to-song study's brutal gate: a 2/3 semitone
   transposition, or shuffled syllables, blocks the song percept
   entirely. One speech-like motif rendered to a buffer. The player
   detunes each loop with a slider (cents) or shuffles the syllable
   order, and watches a song-ness meter collapse past the known
   edge. Exactness is a playable parameter with a measured cliff.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 245;
const rnd = mulberry32(seed);
document.getElementById("seedtag").textContent = "seed " + seed;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize); resize();

const SYL = 8;
const prosody = [0, 2, 4, 1, -1, -3, -2, -5];
const formants = [
  [700, 1220], [500, 1500], [600, 1800], [800, 1100],
  [500, 1700], [650, 1300], [450, 2000], [700, 1000]
];
const F0 = 140, SYL_DUR = 0.19;

async function renderMotif(order) {
  const sr = 44100, dur = SYL * SYL_DUR + 0.05;
  const off = new OfflineAudioContext(1, Math.ceil(sr * dur), sr);
  for (let k = 0; k < SYL; k++) {
    const s = order[k];
    const t0 = k * SYL_DUR;
    const f0a = F0 * Math.pow(2, prosody[s] / 12);
    const osc = off.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(f0a, t0);
    osc.frequency.linearRampToValueAtTime(f0a * 1.01, t0 + SYL_DUR);
    const g = off.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.025);
    g.gain.setValueAtTime(0.5, t0 + SYL_DUR - 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + SYL_DUR);
    const bp1 = off.createBiquadFilter(); bp1.type = "bandpass";
    bp1.frequency.value = formants[s][0]; bp1.Q.value = 6;
    const bp2 = off.createBiquadFilter(); bp2.type = "bandpass";
    bp2.frequency.value = formants[s][1]; bp2.Q.value = 8;
    const g2 = off.createGain(); g2.gain.value = 0.6;
    osc.connect(g); g.connect(bp1); g.connect(bp2);
    bp1.connect(off.destination); bp2.connect(g2); g2.connect(off.destination);
    osc.start(t0); osc.stop(t0 + SYL_DUR + 0.01);
  }
  return await off.startRendering();
}

let audioCtx = null, motifBuf = null, src = null, playing = false;
let detuneCents = 0, shuffled = false;
let order = [0, 1, 2, 3, 4, 5, 6, 7];

async function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    motifBuf = await renderMotif(order);
  }
  if (audioCtx.state === "suspended") await audioCtx.resume();
}

function songness() {
  const a = Math.abs(detuneCents);
  let m;
  if (a <= 50) m = 1;
  else if (a >= 67) m = 0;
  else m = 1 - (a - 50) / 17;
  if (shuffled) m = Math.min(m, 0.08);
  return m;
}

const playBtn = document.getElementById("play");
playBtn.addEventListener("click", async () => {
  await ensureAudio();
  if (playing) {
    src.stop(); playing = false; playBtn.textContent = "play the loop";
  } else {
    src = audioCtx.createBufferSource();
    src.buffer = motifBuf; src.loop = true;
    src.playbackRate.value = Math.pow(2, detuneCents / 1200);
    src.connect(audioCtx.destination); src.start();
    playing = true; playBtn.textContent = "stop";
  }
});
document.getElementById("detune").addEventListener("input", (e) => {
  detuneCents = parseInt(e.target.value, 10);
  document.getElementById("readout").textContent =
    (detuneCents >= 0 ? "+" : "") + detuneCents + " cents";
  if (src) src.playbackRate.value = Math.pow(2, detuneCents / 1200);
});
document.getElementById("shuffle").addEventListener("click", async (e) => {
  await ensureAudio();
  shuffled = !shuffled;
  e.target.textContent = shuffled ? "restore the syllables" : "shuffle the syllables";
  if (shuffled) {
    const r = mulberry32(seed + 7);
    order = [0, 1, 2, 3, 4, 5, 6, 7];
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  } else order = [0, 1, 2, 3, 4, 5, 6, 7];
  const wasPlaying = playing;
  if (playing) { src.stop(); playing = false; }
  motifBuf = await renderMotif(order);
  if (wasPlaying) playBtn.click();
});
document.getElementById("reveal").addEventListener("click", (e) => {
  const d = document.getElementById("edge");
  d.style.display = "block";
  d.textContent = "Measured edge: the song percept collapses at 2/3 semitone (67 cents) of transposition, or with shuffled syllables. Deutsch et al. 2011.";
  e.target.style.display = "none";
});

/* ---------- visuals: stretched contour + song-ness gauge ---------- */
const CONTOUR_N = 160;
const contour = [];
for (let i = 0; i < CONTOUR_N; i++) {
  const x = i / (CONTOUR_N - 1) * SYL;
  const s = Math.min(SYL - 1, Math.floor(x)), f = x - s;
  contour.push(prosody[s] * (1 - f) + prosody[Math.min(SYL - 1, s + 1)] * f);
}
const CMIN = -7, CMAX = 6;

function drawFrame() {
  ctx.clearRect(0, 0, W, H);
  const pad = Math.min(W, H) * 0.06;
  ctx.fillStyle = "rgba(232,228,240,0.92)";
  ctx.font = "600 " + Math.round(Math.min(W, H) * 0.032) + "px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("№8948 · The Exactness Gate", pad, pad * 1.7);

  // contour, horizontally stretched by detune for visibility
  const stretch = Math.pow(2, detuneCents / 1200);
  const narrow = W <= 700;
  const cx0 = pad * 1.4, cx1 = narrow ? W * 0.60 : W * 0.68;
  const midY = narrow ? H * 0.58 : H * 0.52, amp = H * 0.2;
  ctx.lineWidth = Math.max(1.5, Math.min(W, H) * 0.004);
  ctx.strokeStyle = shuffled ? "rgba(150,150,170,0.55)" : "rgba(201,168,106,0.9)";
  ctx.beginPath();
  for (let i = 0; i < CONTOUR_N; i++) {
    const x = cx0 + (cx1 - cx0) * i / (CONTOUR_N - 1);
    const y = midY - (contour[i] - CMIN) / (CMAX - CMIN) * amp + amp / 2;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  // syllable ticks
  ctx.fillStyle = "rgba(232,228,240,0.5)";
  for (let s = 0; s < SYL; s++) {
    const x = cx0 + (cx1 - cx0) * (s + 0.5) / SYL;
    ctx.fillRect(x - 1, midY + amp / 2 + 8, 2, 12);
  }

  // song-ness gauge
  const m = songness();
  const gw = Math.min(46, W * 0.1);
  const gx = narrow ? W - gw - 18 : W * 0.8;
  const gy0 = H * 0.3, gy1 = H * 0.7;
  ctx.strokeStyle = "rgba(232,228,240,0.3)";
  ctx.strokeRect(gx, gy0, gw, gy1 - gy0);
  const grad = ctx.createLinearGradient(0, gy1, 0, gy0);
  grad.addColorStop(0, "#8a4a3a"); grad.addColorStop(0.6, "#c9a86a"); grad.addColorStop(1, "#e8d9a8");
  ctx.fillStyle = grad;
  const mh = (gy1 - gy0) * m;
  ctx.fillRect(gx, gy1 - mh, gw, mh);
  ctx.fillStyle = "rgba(232,228,240,0.85)";
  ctx.font = "400 " + Math.round(Math.min(W, H) * 0.024) + "px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("song-ness", gx + gw / 2, gy1 + 24);
  ctx.font = "700 " + Math.round(Math.min(W, H) * 0.03) + "px system-ui, sans-serif";
  ctx.fillText(m.toFixed(2), gx + gw / 2, gy0 - 12);
  ctx.textAlign = "left";
  // edge marker at 0.0 (67 cents)
  ctx.strokeStyle = "rgba(230,120,110,0.7)";
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(gx - 8, gy1); ctx.lineTo(gx + gw + 8, gy1); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "rgba(230,120,110,0.85)";
  ctx.font = "400 " + Math.round(Math.min(W, H) * 0.02) + "px system-ui, sans-serif";
  if (narrow) {
    ctx.textAlign = "right";
    ctx.fillText("the cliff", gx - 8, gy1 + 4);
    ctx.textAlign = "left";
  } else {
    ctx.fillText("the cliff", gx + gw + 12, gy1 + 4);
  }

  // detune stretch note
  ctx.fillStyle = "rgba(232,228,240,0.55)";
  ctx.font = "400 " + Math.round(Math.min(W, H) * 0.022) + "px system-ui, sans-serif";
  ctx.fillText("playback " + stretch.toFixed(4) + "x" + (shuffled ? " · syllables shuffled" : ""), pad * 1.4, midY + amp / 2 + 44);

  requestAnimationFrame(drawFrame);
}
ensureAudio();
requestAnimationFrame(drawFrame);
</script>
</body>
</html>
