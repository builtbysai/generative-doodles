<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.327 Cheater Quilt</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EBD8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.327 Cheater Quilt (meohmy_graphics).
// A 5 by 5 grid of exactly 25 squares pretending to be sewn,
// each holding one mini pattern at a time: buffalo plaid,
// daisy-scallop, starburst or berry stripes, in five flat inks.
// Idle, one square at a time re-sews itself in a fixed authored
// rotation covering all 25 squares, its pattern drawing in
// stroke by stroke over 3s, so 10 re-sews run in a 30s loop and
// the pattern types at 30s are the same as at frame 0. Tapping
// a square advances it through the authored cycle plaid,
// daisy-scallop, starburst, berry stripes, plaid, with the same
// draw-in; a tap on a square mid-draw-in is ignored for that
// square. Frame one has all squares sewn, one mid-draw-in.
// All marks are data drawn each frame on one canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var RED = '#B33A2B', INDIGO = '#2E4057', MUSTARD = '#D9A441', CREAM = '#F2EBD8', SAGE = '#8A9B7E';
var GROUND = CREAM;
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30, SEW = 3;
var T = 1.5, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- quilt geometry and authored state -------------------------
var SQ = 148, GAP = 6, GRID = 5;
var QW = GRID * SQ + (GRID - 1) * GAP;
var QX = (DW - QW) / 2, QY = (DH - QW) / 2;
// Authored cycle of types: 0 plaid, 1 daisy-scallop,
// 2 starburst, 3 berry stripes, then back to plaid.
var SQUARES = [];
(function () {
  var r, c, i;
  for (r = 0; r < GRID; r++) {
    for (c = 0; c < GRID; c++) {
      i = r * GRID + c;
      SQUARES.push({
        x: QX + c * (SQ + GAP), y: QY + r * (SQ + GAP),
        type: (i + (r % 2)) % 4, tapStart: -10
      });
    }
  }
})();
if (SQUARES.length !== 25) throw new Error('Cheater Quilt needs exactly 25 squares');
// Fixed authored rotation for the idle re-sew: a stride walk
// that visits every one of the 25 squares before repeating.
var ROT = [0, 7, 14, 21, 3, 10, 17, 24, 6, 13, 20, 2, 9, 16, 23, 5, 12, 19, 1, 8, 15, 22, 4, 11, 18];
if (ROT.length !== 25) throw new Error('Cheater Quilt rotation must cover 25 squares');
(function () {
  var seen = {}, i;
  for (i = 0; i < ROT.length; i++) {
    if (seen[ROT[i]]) throw new Error('Cheater Quilt rotation repeats a square');
    seen[ROT[i]] = true;
  }
})();

function seg(p, idx, total) {
  var v = p * total - idx;
  return v < 0 ? 0 : (v > 1 ? 1 : v);
}
function idleSlot() { return Math.floor(T / SEW); }
function idleIndex() { return ROT[idleSlot() % ROT.length]; }
function idleProg() { return (T - idleSlot() * SEW) / SEW; }
// Draw-in progress for one square: its tap animation if one is
// running, else the idle progress if it is the sewing square,
// else fully sewn.
function squareProg(i) {
  var sq = SQUARES[i];
  var tp = (T - sq.tapStart) / SEW;
  if (tp >= 0 && tp < 1) return tp;
  if (i === idleIndex()) return idleProg();
  return 1;
}
function isSewing(i) { return squareProg(i) < 1; }

function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function pLine(x1, y1, x2, y2, f) {
  if (f <= 0) return;
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 + (x2 - x1) * f, y1 + (y2 - y1) * f); ctx.stroke();
}

// ---- four mini pattern generators ------------------------------
// Each takes the square origin and a draw-in progress 0..1 and
// draws its strokes in a fixed order, step by step.
function drawPlaid(x, y, p) {
  var cell = SQ / 4, i, r, c, f;
  ctx.fillStyle = CREAM; ctx.fillRect(x, y, SQ, SQ);
  for (i = 0; i < 16; i++) {
    f = seg(p, i, 16);
    if (f <= 0) continue;
    r = Math.floor(i / 4); c = i % 4;
    if ((r + c) % 2 === 0) ctx.fillStyle = (r % 2 === 0) ? RED : INDIGO;
    else ctx.fillStyle = CREAM;
    ctx.fillRect(x + c * cell, y + r * cell, cell * f, cell);
  }
}
function drawDaisyScallop(x, y, p) {
  var i, r, c, f, cx, cy, rad = SQ / 8, k, a;
  ctx.fillStyle = SAGE; ctx.fillRect(x, y, SQ, SQ);
  st(CREAM, 3.2);
  for (i = 0; i < 16; i++) {
    f = seg(p, i, 20);
    if (f <= 0) continue;
    r = Math.floor(i / 4); c = i % 4;
    cx = x + rad + c * rad * 2; cy = y + rad + r * rad * 2;
    ctx.beginPath(); ctx.arc(cx, cy, rad * 0.92, Math.PI, Math.PI + Math.PI * f); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, rad * 0.92, 0, Math.PI * f); ctx.stroke();
  }
  // Daisy at the centre, petals appearing in the last steps.
  cx = x + SQ / 2; cy = y + SQ / 2;
  for (k = 0; k < 8; k++) {
    f = seg(p, 16, 20) ;
    if (k >= 4) f = seg(p, 17, 20);
    if (k >= 6) f = seg(p, 18, 20);
    if (f <= 0) continue;
    a = k / 8 * Math.PI * 2 - Math.PI / 2;
    ctx.fillStyle = CREAM;
    circ(cx + Math.cos(a) * 17 * f, cy + Math.sin(a) * 17 * f, 8.5 * f, true);
  }
  f = seg(p, 19, 20);
  if (f > 0) { ctx.fillStyle = MUSTARD; circ(cx, cy, 7 * f, true); }
}
function drawStarburst(x, y, p) {
  var cx = x + SQ / 2, cy = y + SQ / 2, i, f, a;
  ctx.fillStyle = INDIGO; ctx.fillRect(x, y, SQ, SQ);
  for (i = 0; i < 12; i++) {
    f = seg(p, i, 13);
    if (f <= 0) continue;
    a = i / 12 * Math.PI * 2 - Math.PI / 2;
    st(i % 2 === 0 ? MUSTARD : CREAM, i % 2 === 0 ? 6 : 3.4);
    pLine(cx, cy, cx + Math.cos(a) * SQ * 0.46, cy + Math.sin(a) * SQ * 0.46, f);
  }
  f = seg(p, 12, 13);
  if (f > 0) { ctx.fillStyle = RED; circ(cx, cy, 13 * f, true); }
}
var BERRIES = [
  { x: 0.22, y: 0.28 }, { x: 0.52, y: 0.18 }, { x: 0.80, y: 0.34 },
  { x: 0.34, y: 0.62 }, { x: 0.66, y: 0.56 }, { x: 0.48, y: 0.84 }
];
function drawBerryStripes(x, y, p) {
  var cols = [MUSTARD, SAGE, MUSTARD, SAGE, MUSTARD];
  var bw = SQ / 5, i, f, b, j, a;
  ctx.fillStyle = CREAM; ctx.fillRect(x, y, SQ, SQ);
  for (i = 0; i < 5; i++) {
    f = seg(p, i, 11);
    if (f <= 0) continue;
    ctx.fillStyle = cols[i];
    ctx.fillRect(x + i * bw, y, bw, SQ * f);
  }
  for (i = 0; i < BERRIES.length; i++) {
    f = seg(p, 5 + i, 11);
    if (f <= 0) continue;
    b = BERRIES[i];
    for (j = 0; j < 3; j++) {
      a = j / 3 * Math.PI * 2;
      ctx.fillStyle = RED;
      circ(x + b.x * SQ + Math.cos(a) * 9 * f, y + b.y * SQ + Math.sin(a) * 9 * f, 7.5 * f, true);
    }
    ctx.fillStyle = SAGE;
    circ(x + b.x * SQ, y + b.y * SQ - 13 * f, 4.5 * f, true);
  }
}
var DRAWERS = [drawPlaid, drawDaisyScallop, drawStarburst, drawBerryStripes];

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var i, sq;
  // Outer quilt edge.
  st(INDIGO, 3);
  ctx.setLineDash([7, 5]);
  ctx.strokeRect(QX - 12, QY - 12, QW + 24, QW + 24);
  ctx.setLineDash([]);
  for (i = 0; i < SQUARES.length; i++) {
    sq = SQUARES[i];
    ctx.save();
    ctx.beginPath(); ctx.rect(sq.x, sq.y, SQ, SQ); ctx.clip();
    DRAWERS[sq.type](sq.x, sq.y, squareProg(i));
    ctx.restore();
    // Stitched-look border, a dashed stroke rect per square.
    st(INDIGO, 2.2);
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(sq.x + 3, sq.y + 3, SQ - 6, SQ - 6);
    ctx.setLineDash([]);
    st(RED, 1.4);
    ctx.strokeRect(sq.x + 0.75, sq.y + 0.75, SQ - 1.5, SQ - 1.5);
  }
}

// ---- interaction: tap a square to swap its pattern -------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e), i, sq;
  for (i = 0; i < SQUARES.length; i++) {
    sq = SQUARES[i];
    if (p[0] >= sq.x && p[0] < sq.x + SQ && p[1] >= sq.y && p[1] < sq.y + SQ) {
      if (isSewing(i)) return;
      sq.type = (sq.type + 1) % 4;
      sq.tapStart = T;
      return;
    }
  }
});

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // Centred fit: the quilt keeps its square shape on any screen.
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
