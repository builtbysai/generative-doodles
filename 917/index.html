<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The End of the Road</title>
<style>
  html, body { margin:0; padding:0; background:#080808; height:100%; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');

/* ---------- palette (strict) ---------- */
var GROUND = '#080808';
var MARKER = '#1F1F1F';
var BIG = '#C9A227';    /* big insects: low, amber */
var SMALL = '#E8E0C8';  /* small insects: high, pale */
var BELL = '#E8E0C8';   /* bell flash ring */

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a+0x6D2B79F5|0; var t = Math.imul(a^a>>>15, 1|a); t = t + Math.imul(t^t>>>7, 61|t) ^ t; return ((t^t>>>14)>>>0)/4294967296; }; }
var rng = mulberry32(91778);
function gauss(){ var u=0, v=0; while(!u) u=rng(); while(!v) v=rng(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

/* ---------- synthesized dataset: twenty years of insects, thinning ----------
   count(year y) = round(340 * exp(-0.21*y) * (0.85 + 0.30*rng())), min 4.
   Year 1 holds a few hundred; year 20 holds a handful. The decay IS the piece.
   Per insect: size01 from a lognormal (gaussian through a logistic),
   1 = biggest. Big insects sit low in the column and sound low;
   small insects sit high and sound high. Each insect carries a fixed
   flutter phase/rate/amplitude and an offset f within its year. */
var YEARS = 20, YEAR_SEC = 6;
var yearsData = [];
(function buildData(){
  for(var y=0; y<YEARS; y++){
    var n = Math.round(340*Math.exp(-0.21*y)*(0.85 + rng()*0.30));
    if(n < 4) n = 4;
    var arr = [];
    for(var i=0; i<n; i++){
      var size01 = 1/(1 + Math.exp(-1.1*gauss()));
      var yFrac = 0.16 + 0.68*size01 + (rng()-0.5)*0.22;
      if(yFrac < 0.04) yFrac = 0.04; if(yFrac > 0.96) yFrac = 0.96;
      arr.push({
        rx: 0.12 + 0.76*rng(),
        yFrac: yFrac,
        size01: size01,
        f: rng(),
        ph: rng()*Math.PI*2,
        rate: 0.5 + rng()*0.9,
        amp: 1.2 + rng()*2.2
      });
    }
    arr.sort(function(p,q){ return p.f - q.f; });
    yearsData.push(arr);
  }
})();

/* ---------- playback state: closed-form over recorded events ----------
   pos is measured in year units (float). Modes:
   'play':   posU = anchorPosU + rate*(t - anchorT), display wraps mod 20.
   'replay': one year loops: display = repYear + frac((t-repStart)/YEAR_SEC).
   'return': year 0 loops from retStart for 10 s, then play resumes from
             unwrapped pos 10/YEAR_SEC at rate 1.
   Dragging takes manual control: it anchors to 'play' at the current
   displayed position and sets rate = clamp(1 - dist/380, 0.25, 1),
   quantized to 0.05 steps (a new anchor is recorded when the step changes).
   Release restores rate 1. Frame one is draw(0): pos 0.45, inside year 1. */
var PHASE0 = 0.45;
var mode = 'play', anchorT = 0, anchorPosU = PHASE0, rate = 1;
var repYear = 0, repStart = 0;
var retStart = 0;
var RETURN_HOLD = 10;
function posUAt(t){
  if(mode === 'replay') return repYear + (t - repStart)/YEAR_SEC;
  if(mode === 'return'){
    if(t < retStart + RETURN_HOLD) return (t - retStart)/YEAR_SEC;
    return RETURN_HOLD/YEAR_SEC + (t - (retStart + RETURN_HOLD));
  }
  return anchorPosU + rate*(t - anchorT);
}
function displayPosAt(t){
  if(mode === 'replay'){
    var ph = ((t - repStart)/YEAR_SEC) % 1;
    if(ph < 0) ph += 1;
    return repYear + ph;
  }
  var u = posUAt(t) % YEARS;
  if(u < 0) u += YEARS;
  return u;
}
function anchorPlay(t, posU, r){
  mode = 'play'; anchorT = t; anchorPosU = posU; rate = r;
}

/* ---------- clock ---------- */
var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
function nowT(){ return (typeof performance !== 'undefined' && performance.now) ? (performance.now()-T0)/1000 : 0; }

/* ---------- bell rings: recorded crossings, drawn closed-form ---------- */
var rings = []; /* {t, year} : year = index of the year just entered */
function noteCrossing(t, yearIdx){
  rings.push({ t: t, year: yearIdx });
  if(rings.length > 6) rings.shift();
}

/* ---------- audio (lazy, gesture-gated, typeof-guarded) ----------
   Per-insect flutter grains: short sine bursts, pitch by size
   (big = 200 Hz low, small = 2000 Hz high), 30-80 ms.
   Bell: 110 Hz sine with a 4 s decay at each year boundary. */
var AC = null;
function initAudio(){
  if(AC){ try{ if(AC.resume) AC.resume(); }catch(e){} return; }
  try{
    var Ctor = (typeof window !== 'undefined') ? (window.AudioContext || window.webkitAudioContext) : null;
    if(!Ctor) return;
    AC = new Ctor();
  }catch(e){ AC = null; }
}
function sndGrain(ins){
  if(!AC) return;
  try{
    var dur = 0.03 + ins.size01*0.05;
    var freq = 200*Math.pow(10, 1 - ins.size01);
    var t = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }catch(e){}
}
function sndBell(){
  if(!AC) return;
  try{
    var t = AC.currentTime;
    var parts = [[110, 0.22], [221, 0.07]];
    for(var i=0; i<parts.length; i++){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = parts[i][0];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(parts[i][1], t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 4);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + 4.2);
    }
  }catch(e){}
}

/* audio scheduling derives from playhead crossings; visuals never depend on it */
var audPrevU = null, audPrevMode = null, audPrevPhase = null;
function fireRange(yearIdx, f0, f1, budget){
  var arr = yearsData[yearIdx], played = 0;
  for(var i=0; i<arr.length; i++){
    if(arr[i].f > f0 && arr[i].f <= f1 && played < budget){ sndGrain(arr[i]); played++; }
  }
  return played;
}
function audioTick(t){
  if(!AC) return;
  if(mode === 'replay'){
    var ph = ((t - repStart)/YEAR_SEC) % 1;
    if(ph < 0) ph += 1;
    if(audPrevMode === 'replay' && audPrevPhase !== null){
      var played = 0;
      if(ph < audPrevPhase){
        played += fireRange(repYear, audPrevPhase, 1, 8);
        sndBell(); noteCrossing(t, repYear);
        played += fireRange(repYear, 0, ph, 8 - played);
      } else {
        fireRange(repYear, audPrevPhase, ph, 8);
      }
    }
    audPrevPhase = ph; audPrevMode = 'replay'; audPrevU = null;
    return;
  }
  audPrevPhase = null;
  var u = posUAt(t);
  if(audPrevMode === mode && audPrevU !== null && u >= audPrevU && u - audPrevU <= 3){
    var played = 0;
    var p = audPrevU;
    while(p < u){
      var fl = Math.floor(p);
      var segEnd = Math.min(u, fl + 1);
      var yi = fl % YEARS; if(yi < 0) yi += YEARS;
      played += fireRange(yi, p - fl, segEnd - fl, 8 - played);
      p = segEnd;
      if(segEnd === fl + 1){
        /* crossed the boundary at segEnd into a new year */
        var ny = Math.floor(segEnd) % YEARS; if(ny < 0) ny += YEARS;
        sndBell(); noteCrossing(t, ny);
      }
    }
  }
  audPrevU = u; audPrevMode = mode;
}

/* ---------- layout + draw ---------- */
function viewSize(){
  var w = 0, h = 0;
  try{ if(window.visualViewport){ w = window.visualViewport.width; h = window.visualViewport.height; } }catch(e){}
  if(!w || !h){ w = window.innerWidth || 720; h = window.innerHeight || 720; }
  return [w, h];
}
function draw(t){
  var s = viewSize(), W = s[0], H = s[1];
  if(cv.width !== W) cv.width = W;
  if(cv.height !== H) cv.height = H;
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  var scrMin = 0;
  try{ scrMin = Math.min(window.screen.width, window.screen.height); }catch(e){}
  var phone = (scrMin > 0 && scrMin < 700) || (H > W*1.15);

  var dp = displayPosAt(t);
  var curYear = Math.min(YEARS-1, Math.floor(dp));
  var phase = dp - Math.floor(dp);

  var mX = W*0.04, plotL = mX, plotW = W - 2*mX, colW = plotW/YEARS;
  var top = H*0.12, bot = H*0.88, fieldH = bot - top, midY = (top + bot)/2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  /* lit column behind the current year */
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = MARKER;
  ctx.fillRect(plotL + curYear*colW, top, colW, fieldH);
  ctx.globalAlpha = 1;

  /* year markers: faint verticals at each column edge */
  ctx.fillStyle = MARKER;
  for(var y=0; y<=YEARS; y++){
    ctx.fillRect(plotL + y*colW, top, 1, fieldH);
  }

  /* insects: current year lit, past years embers, future years ghosts */
  var tickW = phone ? 1.2 : 1.6;
  for(var yy=0; yy<YEARS; yy++){
    var arr = yearsData[yy];
    var baseAlpha;
    if(yy === curYear) baseAlpha = 1;
    else if(yy < curYear) baseAlpha = 0.30;
    else baseAlpha = 0.10;
    var cx0 = plotL + yy*colW;
    for(var i=0; i<arr.length; i++){
      var ins = arr[i];
      var a = baseAlpha;
      if(yy === curYear && ins.f > phase) a = 0.45;
      var fx = ins.amp*Math.sin(2*Math.PI*ins.rate*t + ins.ph);
      var fy = ins.amp*0.7*Math.sin(2*Math.PI*ins.rate*0.83*t + ins.ph*1.7);
      var th = (2 + 4.5*ins.size01)*(phone ? 0.85 : 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = ins.size01 > 0.5 ? BIG : SMALL;
      ctx.fillRect(cx0 + ins.rx*colW + fx - tickW/2, top + ins.yFrac*fieldH + fy - th/2, tickW, th);
    }
  }
  ctx.globalAlpha = 1;

  /* playhead */
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = SMALL;
  ctx.fillRect(plotL + dp*colW, top, 1, fieldH);
  ctx.globalAlpha = 1;

  /* bell rings at year boundaries */
  ctx.strokeStyle = BELL;
  ctx.lineWidth = 1;
  for(var r=0; r<rings.length; r++){
    var age = t - rings[r].t;
    if(age < 0 || age > 2.5) continue;
    var rr = 4 + (colW*2.2 - 4)*(age/2.5);
    ctx.globalAlpha = 0.55*(1 - age/2.5);
    ctx.beginPath();
    ctx.arc(plotL + rings[r].year*colW, midY, rr, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ---------- interaction ---------- */
var pDown = null, lastTapT = -10;
function colAtX(x){
  var s = viewSize(), W = s[0];
  var mX = W*0.04, plotW = W - 2*mX;
  var y = Math.floor((x - mX)/plotW*YEARS);
  return y < 0 ? 0 : (y > YEARS-1 ? YEARS-1 : y);
}
function onDown(e){
  initAudio();
  var t = nowT();
  var x = (typeof e.clientX === 'number') ? e.clientX : 0;
  var y = (typeof e.clientY === 'number') ? e.clientY : 0;
  pDown = { t: t, x: x, y: y, drag: false, lastQRate: null };
}
function onMove(e){
  if(!pDown) return;
  var x = (typeof e.clientX === 'number') ? e.clientX : 0;
  var y = (typeof e.clientY === 'number') ? e.clientY : 0;
  var dist = Math.sqrt((x-pDown.x)*(x-pDown.x) + (y-pDown.y)*(y-pDown.y));
  if(!pDown.drag && dist > 7){
    /* take manual control: anchor to play at the displayed position */
    var t0 = nowT();
    var u0 = displayPosAt(t0);
    anchorPlay(t0, u0, rate);
    pDown.drag = true;
  }
  if(pDown.drag){
    var r = 1 - dist/380;
    if(r < 0.25) r = 0.25; if(r > 1) r = 1;
    var q = Math.round(r/0.05)*0.05;
    if(q !== pDown.lastQRate){
      var t = nowT();
      anchorPosU = posUAt(t); anchorT = t; rate = q;
      pDown.lastQRate = q;
    }
  }
}
function onUp(e){
  if(!pDown) return;
  var t = nowT();
  if(pDown.drag){
    anchorPosU = posUAt(t); anchorT = t; rate = 1;
  } else if(t - pDown.t < 0.5){
    var x = (typeof e.clientX === 'number') ? e.clientX : pDown.x;
    if(t - lastTapT < 0.35){
      mode = 'return'; retStart = t; lastTapT = -10;
    } else {
      mode = 'replay'; repYear = colAtX(x); repStart = t; lastTapT = t;
    }
    audPrevU = null; audPrevPhase = null; audPrevMode = null;
  }
  pDown = null;
}
if(cv.addEventListener){
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointerleave', onUp);
}

/* ---------- run ---------- */
draw(0);
function onResize(){ draw(nowT()); }
try{ if(window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', onResize); }catch(e){}
try{ if(window.addEventListener) window.addEventListener('resize', onResize); }catch(e){}
if(typeof requestAnimationFrame !== 'undefined'){
  var step = function(){
    var t = nowT();
    draw(t);
    audioTick(t);
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
})();
</script>
</body>
</html>
