<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.367 Poe Traits</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#221828; }
  canvas { display:block; touch-action:none; cursor:grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.367 Poe Traits (jmarie.creates).
// After Julianne Haness's "Poe-traits" series: portrait
// medallions of Edgar Allan Poe, dark hair mass,
// moustache wedge and high collar, drawn in parchment
// and ink on a deep plum-ink ground, in a diamond grid,
// with ravens, keyholes, quills and skull-moths filling
// the interstices. The only motion is a candle-flicker:
// a flat ink overlay whose alpha breathes sinusoidally
// by plus or minus 3 percent on whole cycles of one 24s
// master loop. Double-tap advances the interstitial
// motifs through three authored arrangement tables.
// Drag pans the oversized repeat and the explored
// position persists on release. Nothing here is runtime
// random: the grid, the portrait, the motif tables and
// the flicker curve are all fixed data below.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#221828', PARCH = '#EDE3D0', INK = '#2A2230', RAVEN = '#14101A', OXBLOOD = '#7A2E35';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;
if (LOOP !== 24) throw new Error('Poe Traits loop must be 24s');
var TICK = 1 / 60;

// ---- the medallion grid: diamond lattice ----------------
// Centres step 300 x 320 with alternate rows dropped by
// half a column, so the medallions sit on a diamond
// grid. The world is authored oversized (centres span
// x -1200..1200, y -1120..1120) so the field covers the
// frame at every clamped pan.
var GX = 300, GY = 320;
var MEDALS = [];
for (var r = 0; r < 8; r++) {
  var xoff = (r % 2 === 1) ? GX / 2 : 0;
  for (var c = 0; c < 9; c++) {
    MEDALS.push([-1200 + xoff + c * GX, -1120 + r * GY]);
  }
}
if (MEDALS.length !== 72) throw new Error('Poe Traits needs 72 medallions, got ' + MEDALS.length);

// ---- interstitial sites ----------------------------------
// One small motif sits in each diamond gap between four
// medallions: 8 columns x 7 rows of sites, offset half a
// step from the medallion centres.
var SITES = [];
for (var sr = 0; sr < 7; sr++) {
  for (var sc = 0; sc < 8; sc++) {
    SITES.push([-1050 + sc * GX, -960 + sr * GY, sr, sc]);
  }
}
if (SITES.length !== 56) throw new Error('Poe Traits needs 56 interstitial sites, got ' + SITES.length);

// ---- interstitial arrangements ---------------------------
// The motif library is exactly four: 0 raven, 1 keyhole,
// 2 quill, 3 skull-moth. Three authored arrangement
// tables, each a literal string of 56 digits (site order
// row by row), each holding every motif exactly 14
// times. Double-tap advances to the next table. Nothing
// is reseeded at runtime; only the table index changes.
var TABLES = [
  '01000033300210323001222120322311231012121203333111031322',
  '21330000333220300121220033111331003302131111221122300222',
  '11312020300033011120123123003213233102110022332233010122'
];
var tableIdx = 0;
(function () {
  for (var t = 0; t < TABLES.length; t++) {
    if (TABLES[t].length !== 56) throw new Error('arrangement table ' + t + ' must hold 56 sites');
    var counts = [0, 0, 0, 0];
    for (var i = 0; i < 56; i++) counts[TABLES[t].charCodeAt(i) - 48]++;
    for (var m = 0; m < 4; m++) {
      if (counts[m] !== 14) throw new Error('table ' + t + ' must hold motif ' + m + ' exactly 14 times');
    }
  }
})();
// Small fixed presentation variants per site: a slight
// rotation so the interstitials sit hand-placed.
var VARIANTS = [-0.14, 0.09, 0.0, 0.17];

function motifAt(siteIdx) {
  return TABLES[tableIdx].charCodeAt(siteIdx) - 48;
}

// ---- candle flicker ---------------------------------------
// One ink-coloured rect over the whole field; its alpha
// is the mean 0.03 plus two sinusoidal components, both
// completing whole cycles inside the 24s loop, so the
// flicker is seamless and the luminance swings stay
// within plus or minus 3 percent. Flat only.
function flickerAlpha(tm) {
  var a = 0.03
    + 0.017 * Math.sin(Math.PI * 2 * (tm / LOOP))
    + 0.011 * Math.sin(Math.PI * 2 * 3 * (tm / LOOP) + 1.3);
  if (a < 0) a = 0;
  if (a > 0.06) a = 0.06;
  return a;
}
// Constant first-frame phase: 11.0s into the loop, where
// the combined flicker sits near its mean and moving,
// so frame one is developed mid-breath. Frame one is
// drawn synchronously at this constant; the rAF loop
// advances T from the same anchor in fixed ticks. Frame
// one never reads a wall clock.
var T = 11.0;
var lastNow = -1, acc = 0;

// ---- drawing: the portrait medallion -----------------------
// ONE hand-authored Poe portrait, authored bilaterally
// about its local vertical axis, replayed at every grid
// centre: a parchment cameo plaque with an oxblood ring,
// a plum field inside, and the bust in parchment, ink
// and raven black. High forehead, hair mass swept back,
// heavy brows, a bold moustache wedge, high collar and
// cravat. Stylised flat ink, never photoreal.
function drawPortrait(cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  // cameo plaque and rings
  ctx.fillStyle = PARCH;
  ctx.beginPath(); ctx.ellipse(0, 0, 97, 117, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = OXBLOOD;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0, 0, 92, 112, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = GROUND;
  ctx.beginPath(); ctx.ellipse(0, 0, 88, 108, 0, 0, Math.PI * 2); ctx.fill();
  // small oxblood diamond riding the top of the ring
  ctx.fillStyle = OXBLOOD;
  ctx.save();
  ctx.translate(0, -114);
  ctx.rotate(Math.PI / 4);
  ctx.fillRect(-5, -5, 10, 10);
  ctx.restore();
  // bust, clipped to the inner field
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 0, 88, 108, 0, 0, Math.PI * 2); ctx.clip();
  // coat and shoulders in raven black
  ctx.fillStyle = RAVEN;
  ctx.beginPath();
  ctx.moveTo(-90, 110);
  ctx.lineTo(-90, 60);
  ctx.quadraticCurveTo(-64, 34, -30, 27);
  ctx.lineTo(30, 27);
  ctx.quadraticCurveTo(64, 34, 90, 60);
  ctx.lineTo(90, 110);
  ctx.closePath();
  ctx.fill();
  // high collar: two parchment points flanking the neck
  ctx.fillStyle = PARCH;
  ctx.beginPath();
  ctx.moveTo(-13, 24); ctx.lineTo(-36, 62); ctx.lineTo(-5, 52);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(13, 24); ctx.lineTo(36, 62); ctx.lineTo(5, 52);
  ctx.closePath(); ctx.fill();
  // shirt front
  ctx.beginPath();
  ctx.moveTo(-10, 30); ctx.lineTo(10, 30); ctx.lineTo(0, 60);
  ctx.closePath(); ctx.fill();
  // cravat band in ink with an oxblood pin
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(-14, 22); ctx.lineTo(14, 22); ctx.lineTo(10, 36); ctx.lineTo(-10, 36);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = OXBLOOD;
  ctx.beginPath(); ctx.arc(0, 30, 3.2, 0, Math.PI * 2); ctx.fill();
  // neck
  ctx.fillStyle = PARCH;
  ctx.beginPath();
  ctx.moveTo(-11, 2); ctx.lineTo(11, 2); ctx.lineTo(9, 26); ctx.lineTo(-9, 26);
  ctx.closePath(); ctx.fill();
  // hair mass silhouette: the face path grown and lifted,
  // so ink shows as swept-back hair at top and sides
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(0, -92);
  ctx.bezierCurveTo(34, -92, 41, -62, 39, -30);
  ctx.bezierCurveTo(37, -2, 28, 30, 14, 46);
  ctx.bezierCurveTo(7, 53, -7, 53, -14, 46);
  ctx.bezierCurveTo(-28, 30, -37, -2, -39, -30);
  ctx.bezierCurveTo(-41, -62, -34, -92, 0, -92);
  ctx.closePath();
  ctx.fill();
  // face: high forehead, tapering to the chin
  ctx.fillStyle = PARCH;
  ctx.beginPath();
  ctx.moveTo(0, -80);
  ctx.bezierCurveTo(29, -80, 35, -55, 33, -28);
  ctx.bezierCurveTo(31, -2, 23, 27, 12, 41);
  ctx.bezierCurveTo(6, 48, -6, 48, -12, 41);
  ctx.bezierCurveTo(-23, 27, -31, -2, -33, -28);
  ctx.bezierCurveTo(-35, -55, -29, -80, 0, -80);
  ctx.closePath();
  ctx.fill();
  // side locks in front of the ears
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(-34, -14); ctx.lineTo(-27, -10); ctx.lineTo(-29, 14); ctx.lineTo(-35, 10);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(34, -14); ctx.lineTo(27, -10); ctx.lineTo(29, 14); ctx.lineTo(35, 10);
  ctx.closePath(); ctx.fill();
  // brows: heavy straight strokes
  ctx.strokeStyle = INK;
  ctx.lineWidth = 3.6;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-25, -28); ctx.lineTo(-8, -25); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(25, -28); ctx.lineTo(8, -25); ctx.stroke();
  // eyes: ink almonds under the brows
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(-16, -18, 4.6, 2.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16, -18, 4.6, 2.7, 0, 0, Math.PI * 2); ctx.fill();
  // nose: one ink line
  ctx.lineWidth = 2.1;
  ctx.beginPath();
  ctx.moveTo(1, -13);
  ctx.bezierCurveTo(3, -4, 4, 2, 1, 7);
  ctx.bezierCurveTo(0, 9, -3, 9, -4.5, 7);
  ctx.stroke();
  // moustache: the bold ink wedge under the nose
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.moveTo(0, 13);
  ctx.bezierCurveTo(-7, 8, -23, 8, -31, 13);
  ctx.bezierCurveTo(-23, 19, -10, 20, 0, 17);
  ctx.bezierCurveTo(10, 20, 23, 19, 31, 13);
  ctx.bezierCurveTo(23, 8, 7, 8, 0, 13);
  ctx.closePath();
  ctx.fill();
  // mouth: a short line in the moustache's shadow
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-6, 23); ctx.lineTo(6, 23); ctx.stroke();
  ctx.restore(); // unclip bust
  ctx.restore();
}

// ---- drawing: the four interstitial motifs -----------------
// Each authored about its local origin at pocket scale.
function drawRaven() {
  ctx.fillStyle = RAVEN;
  // tail wedge
  ctx.beginPath();
  ctx.moveTo(-12, 3); ctx.lineTo(-27, 11); ctx.lineTo(-25, 15); ctx.lineTo(-9, 9);
  ctx.closePath(); ctx.fill();
  // body
  ctx.save();
  ctx.rotate(-0.42);
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 9.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // head and beak
  ctx.beginPath(); ctx.arc(13, -8, 6.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(18, -10); ctx.lineTo(28, -6); ctx.lineTo(18, -3);
  ctx.closePath(); ctx.fill();
  // perch
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.6;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-18, 17); ctx.lineTo(18, 17); ctx.stroke();
  // legs
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(2, 8); ctx.lineTo(3, 17); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, 7); ctx.lineTo(9, 17); ctx.stroke();
  // parchment eye
  ctx.fillStyle = PARCH;
  ctx.beginPath(); ctx.arc(14.5, -9.5, 1.5, 0, Math.PI * 2); ctx.fill();
}
function drawKeyhole() {
  ctx.fillStyle = PARCH;
  ctx.beginPath(); ctx.arc(0, -6, 8.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-5.5, -1); ctx.lineTo(5.5, -1); ctx.lineTo(8.5, 17); ctx.lineTo(-8.5, 17);
  ctx.closePath(); ctx.fill();
  // the hole punched back to ground
  ctx.fillStyle = GROUND;
  ctx.beginPath(); ctx.arc(0, -6, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-2.4, -2); ctx.lineTo(2.4, -2); ctx.lineTo(4.2, 13); ctx.lineTo(-4.2, 13);
  ctx.closePath(); ctx.fill();
  // oxblood collar dot above
  ctx.fillStyle = OXBLOOD;
  ctx.beginPath(); ctx.arc(0, -19, 2.4, 0, Math.PI * 2); ctx.fill();
}
function drawQuill() {
  // feather blade in parchment
  ctx.fillStyle = PARCH;
  ctx.beginPath();
  ctx.moveTo(0, 19);
  ctx.bezierCurveTo(-13, 7, -15, -8, -6, -21);
  ctx.bezierCurveTo(10, -17, 15, -3, 7, 10);
  ctx.bezierCurveTo(4, 15, 1, 17, 0, 19);
  ctx.closePath();
  ctx.fill();
  // ink spine and barb ticks
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.9;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 21);
  ctx.bezierCurveTo(1, 6, -1, -6, -5, -19);
  ctx.stroke();
  ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(-2, 2); ctx.lineTo(-9, -3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1, -6); ctx.lineTo(7, -11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(8, 3); ctx.stroke();
}
function drawSkullMoth() {
  // wings in parchment
  ctx.fillStyle = PARCH;
  for (var s = -1; s <= 1; s += 2) {
    ctx.save();
    ctx.translate(s * 11, -3);
    ctx.rotate(s * 0.5);
    ctx.beginPath(); ctx.ellipse(0, 0, 12.5, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(s * 8, 8);
    ctx.rotate(s * -0.35);
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 5.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // oxblood wingtip dots
  ctx.fillStyle = OXBLOOD;
  ctx.beginPath(); ctx.arc(-20, -6, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(20, -6, 1.8, 0, Math.PI * 2); ctx.fill();
  // body in ink
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(0, 2, 3.6, 11, 0, 0, Math.PI * 2); ctx.fill();
  // antennae
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-2, -8); ctx.quadraticCurveTo(-8, -15, -13, -16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2, -8); ctx.quadraticCurveTo(8, -15, 13, -16); ctx.stroke();
  // the skull: parchment head with ink eyes
  ctx.fillStyle = PARCH;
  ctx.beginPath(); ctx.arc(0, -4, 5.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(-2.1, -4.6, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(2.1, -4.6, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, -2.6); ctx.lineTo(1.1, -0.8); ctx.lineTo(-1.1, -0.8);
  ctx.closePath(); ctx.fill();
}
var MOTIFS = [drawRaven, drawKeyhole, drawQuill, drawSkullMoth];

// ---- view: drag pan state -----------------------------------
// Drag pans grab-style; the repeat is authored across an
// oversized world so it always covers the frame, the pan
// clamps to the authored margin, and the explored
// position persists on release. No snap home, no reload.
var panX = 0, panY = 0;
function clampPan() {
  var mx = 1200 + GX / 2 - DW / 2; // rightmost centre reach minus half frame
  var my = 1120 + GY / 2 - DH / 2; // lowest centre reach minus half frame
  if (panX > mx) panX = mx; if (panX < -mx) panX = -mx;
  if (panY > my) panY = my; if (panY < -my) panY = -my;
}

function draw() {
  var tm = T % LOOP;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  ctx.save();
  ctx.translate(DW / 2, DH / 2);
  ctx.translate(-panX, -panY);
  var i;
  for (i = 0; i < MEDALS.length; i++) {
    drawPortrait(MEDALS[i][0], MEDALS[i][1]);
  }
  for (i = 0; i < SITES.length; i++) {
    ctx.save();
    ctx.translate(SITES[i][0], SITES[i][1]);
    ctx.rotate(VARIANTS[(SITES[i][2] * 3 + SITES[i][3]) % 4]);
    MOTIFS[motifAt(i)]();
    ctx.restore();
  }
  ctx.restore();
  // candle-flicker: one flat ink rect over the field
  ctx.fillStyle = RAVEN;
  ctx.globalAlpha = flickerAlpha(tm);
  ctx.fillRect(0, 0, DW, DH);
  ctx.globalAlpha = 1;
}

// ---- sizing: full-bleed field, cover-fit ----------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- pointer: drag pans, double-tap advances the arrangement --
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
var grab = null, downAt = 0, lastTapAt = -1000, lastTapPos = null;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  grab = { x: p[0], y: p[1], panX: panX, panY: panY, moved: false };
  downAt = T;
});
canvas.addEventListener('pointermove', function (e) {
  if (!grab) return;
  var p = toDesign(e);
  var dx = p[0] - grab.x, dy = p[1] - grab.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) grab.moved = true;
  panX = grab.panX - dx;
  panY = grab.panY - dy;
  clampPan();
});
function endPointer(e) {
  if (!grab) return;
  var wasTap = !grab.moved && (T - downAt) < 0.3;
  grab = null;
  if (!wasTap || !e) return;
  var p = toDesign(e);
  var dt = T - lastTapAt;
  if (dt < 0.35 && lastTapPos && Math.abs(p[0] - lastTapPos[0]) < 30 && Math.abs(p[1] - lastTapPos[1]) < 30) {
    tableIdx = (tableIdx + 1) % TABLES.length;
    lastTapAt = -1000;
    lastTapPos = null;
  } else {
    lastTapAt = T;
    lastTapPos = p;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { grab = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
