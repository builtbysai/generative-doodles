<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collapse of Signal</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // №1146 "Collapse of Signal" — Rosa Menkman study block RM3
  // (The Collapse of PAL, 2010-11). A dying analog broadcast: phosphor-blue
  // scanlines under horizontal-hold wobble, chroma bleeding sideways, a
  // rolling hum bar, a magenta sync-loss tear with a full-frame roll, and —
  // for under two seconds per cycle — a ghostly concentric diamond locking
  // in before the signal decays again. Everything is a pure function of
  // the 10-second loop phase; there is no interaction at all.

  var LOOP = 10;
  var T0 = 7.2;                 // fixed first-frame phase: mid ghost-lock

  // ---------- palette ----------
  var BG = '#050505';           // near-black field
  var OFFSTAGE = '#000000';
  // phosphor #2A4B8F, white #E8E8E8, magenta #FF00E5, amber #B87A00
  var PHOS = [42, 75, 143], WHITE = [232, 232, 232], AMBER = [184, 122, 0];

  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function sstep(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  // keyframe lookup over one loop, smoothstep-interpolated; keys sorted,
  // first key at t=0, last at t=LOOP, values continuous across the wrap.
  function kf(p, keys) {
    for (var i = 0; i < keys.length - 1; i++) {
      var a = keys[i], b = keys[i + 1];
      if (p >= a[0] && p <= b[0]) {
        var u = (p - a[0]) / (b[0] - a[0]);
        return a[1] + (b[1] - a[1]) * sstep(u);
      }
    }
    return keys[keys.length - 1][1];
  }

  // ---------- stage envelopes (loop phase p in seconds) ----------
  // cycle: stable 0-3 · wobble 3-5 · sync loss 5-6.5 · ghost lock 6.5-8 · decay 8-10
  var K_WOB = [[0, 1.5], [3, 2], [4, 9], [5, 16], [5.8, 22], [6.2, 14], [6.5, 0.4], [8, 0.4], [9, 3], [10, 1.5]];
  var K_GHOST = [[0, 0.04], [3, 0.05], [5, 0.09], [6.5, 0.16], [7.0, 0.5], [7.7, 0.5], [8, 0.28], [9, 0.07], [10, 0.04]];
  var K_TEAR = [[0, 0], [4.9, 0], [5.3, 1], [6.1, 1], [6.5, 0], [10, 0]];
  var K_MAG = [[0, 0], [5.0, 0], [5.4, 0.55], [6.1, 0.55], [6.5, 0], [10, 0]];
  var K_AMBER = [[0, 0], [7.9, 0], [8.6, 0.35], [9.2, 0.5], [9.6, 0.25], [10, 0]];
  var K_ROLL = [[0, 0], [5, 0], [6.5, 1], [10, 1]];      // in stage heights; wraps mod 1
  var K_DIP = [[0, 0.35], [0.5, 1], [8.8, 1], [9.7, 0.4], [10, 0.35]];
  var K_BAR = [[0, 0.9], [4.8, 0.9], [5, 0], [8, 0], [8.3, 0.55], [10, 0.9]];

  function barTop(p, stageH) {
    if (p < 3) return stageH * (0.80 - 0.06 * p);            // stable: climbs
    if (p < 5) return stageH * (0.62 - 0.09 * (p - 3));      // wobble: climbs on
    if (p < 8) return -stageH;                               // loss + lock: gone
    return stageH * (1.02 - 0.11 * (p - 8));                 // decay: re-enters
  }

  // ---------- phone detection ----------
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var minScreen = Math.min(sw || 9999, sh || 9999);
  var isPhone = minScreen < 700 || (sh > sw * 1.15 && minScreen < 900);

  // ---------- view / canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, GEO = null;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }
  function fit() {
    W = viewW(); H = viewH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var stageW = W;
    var stageH = stageW * 9 / 16;
    if (stageH > H) { stageH = H; stageW = stageH * 16 / 9; }
    GEO = {
      sx: (W - stageW) / 2, sy: (H - stageH) / 2,
      sw: stageW, sh: stageH,
      pitch: Math.max(2, Math.round(stageH / 360)),
      segW: Math.max(16, Math.round(stageW / 44)),
      phone: isPhone
    };
  }

  // ---------- the broadcast field ----------
  // Broad, abstract signal: dim sky, a horizon glow band, dark ground.
  function sceneLum(u, v, j, g) {
    var lum = 0.10 + 0.06 * (1 - v);
    var dh = (v - 0.60) / 0.04;
    lum += 0.55 * Math.exp(-dh * dh);                        // horizon glow
    if (v > 0.62) lum -= 0.03;
    lum += 0.05 * Math.sin(u * 9.0 + v * 23.0) * Math.sin(u * 3.7 - v * 11.0);
    lum += 0.05 * (hash(g * 91.7 + j * 733.1) - 0.5);        // per-segment grain
    return clamp(lum, 0, 1);
  }

  // 32-step luminance palette, tinted toward amber by the decay factor.
  function buildPalette(amberMix) {
    var pal = [];
    for (var i = 0; i < 32; i++) {
      var lum = i / 31;
      var t1 = clamp(lum / 0.55, 0, 1);
      var r = PHOS[0] * t1, g = PHOS[1] * t1, b = PHOS[2] * t1;
      var t2 = sstep((lum - 0.6) / 0.35) * 0.7;
      r += (WHITE[0] - r) * t2; g += (WHITE[1] - g) * t2; b += (WHITE[2] - b) * t2;
      var ta = amberMix * lum;
      r += (AMBER[0] - r) * ta; g += (AMBER[1] - g) * ta; b += (AMBER[2] - b) * ta;
      pal.push('rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')');
    }
    return pal;
  }

  var RADII = [0.10, 0.17, 0.24, 0.31, 0.36];                // ghost diamond, × stage height

  function draw(t) {
    fit();
    var p = ((t % LOOP) + LOOP) % LOOP;
    var cycle = Math.floor(t / LOOP);
    var sx = GEO.sx, sy = GEO.sy, sWid = GEO.sw, sHei = GEO.sh;
    var pitch = GEO.pitch, segW = GEO.segW;

    var wob = kf(p, K_WOB);
    var ghostA = kf(p, K_GHOST);
    var tear = kf(p, K_TEAR);
    var magA = kf(p, K_MAG);
    var amberMix = kf(p, K_AMBER);
    var dip = kf(p, K_DIP);
    var rollPx = (kf(p, K_ROLL) % 1) * sHei;
    var shimmer = tear > 0 ? 0.82 + 0.18 * Math.sin(p * 37.0) * tear : 1;
    var pal = buildPalette(amberMix);

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = OFFSTAGE;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = BG;
    ctx.fillRect(sx, sy, sWid, sHei);

    var rows = Math.ceil(sHei / pitch);
    var drift = 3 * Math.sin(p * 0.7);
    var fringe = clamp(2 + 3 * wob / 16, 2, 5);
    var cx = sWid / 2;

    function rowOffset(j) {
      var off = wob * Math.sin(j * 0.11 + p * 2.3) + drift;
      if (tear > 0) {
        var slice = Math.floor(j * pitch / 16);
        off += (hash(slice * 7.31 + cycle * 131.7) - 0.5) * 2 * 52 * tear;
      }
      return off;
    }

    ctx.save();
    ctx.beginPath();
    ctx.rect(sx, sy, sWid, sHei);
    ctx.clip();

    // --- scanline field, run-merged by palette step ---
    var g0 = Math.floor((-2 * segW) / segW);
    var g1 = Math.ceil(sWid / segW) + 2;
    for (var j = 0; j < rows; j++) {
      var y = sy + j * pitch;
      var sceneV = (((j * pitch + rollPx) % sHei) + sHei) % sHei / sHei;
      var off = rowOffset(j);
      var runIdx = -1, runX = 0;
      for (var g = g0; g <= g1; g++) {
        var lum = sceneLum(g * segW / sWid, sceneV, j, g) * dip * shimmer;
        var idx = Math.round(clamp(lum, 0, 1) * 31);
        var x = sx + g * segW + off;
        if (idx !== runIdx) {
          if (runIdx >= 0) { ctx.fillStyle = pal[runIdx]; ctx.fillRect(runX, y, x - runX, pitch - 0.6); }
          runIdx = idx; runX = x;
        }
      }
      if (runIdx >= 0) { ctx.fillStyle = pal[runIdx]; ctx.fillRect(runX, y, sx + g1 * segW + off - runX, pitch - 0.6); }
    }

    // --- ghost diamond: scanline-built edges, chroma-fringed ---
    if (ghostA > 0.01) {
      var doFringe = ghostA > 0.05;
      for (var jj = 0; jj < rows; jj++) {
        var yy = sy + jj * pitch;
        var sv = (((jj * pitch + rollPx) % sHei) + sHei) % sHei / sHei;
        var dyPx = Math.abs(sv - 0.5) * sHei;
        var o = rowOffset(jj);
        for (var k = 0; k < RADII.length; k++) {
          var r = RADII[k] * sHei;
          var halfW = r - dyPx;
          if (halfW <= 0) continue;
          var a = ghostA * (1 - 0.10 * k);
          var xl = sx + cx - halfW + o, xr = sx + cx + halfW + o;
          if (doFringe) {
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = '#B87A00';
            ctx.globalAlpha = a * 0.38;
            ctx.fillRect(xl - fringe - 1, yy, 3, pitch);
            ctx.fillRect(xr - fringe - 1, yy, 3, pitch);
            ctx.fillStyle = '#2A4B8F';
            ctx.globalAlpha = a * 0.45;
            ctx.fillRect(xl + fringe - 1, yy, 3, pitch);
            ctx.fillRect(xr + fringe - 1, yy, 3, pitch);
            ctx.globalCompositeOperation = 'source-over';
          }
          ctx.fillStyle = '#E8E8E8';
          ctx.globalAlpha = a;
          ctx.fillRect(xl - 1, yy, 3, pitch);
          ctx.fillRect(xr - 1, yy, 3, pitch);
        }
      }
      ctx.globalAlpha = 1;
    }

    // --- sync-loss magenta tear band ---
    if (magA > 0.01) {
      var bandC = sHei * (0.68 - 0.44 * clamp((p - 5) / 1.5, 0, 1));
      var bandH = sHei * 0.16;
      ctx.fillStyle = '#FF00E5';
      for (var by = -bandH / 2; by < bandH / 2; by += 6) {
        var stripOff = (hash(Math.floor(by * 13.7) + cycle * 57.3) - 0.5) * 60 * tear;
        ctx.globalAlpha = magA * (0.55 + 0.3 * hash(by * 3.1 + cycle));
        ctx.fillRect(sx - 70 + stripOff, sy + bandC + by, sWid + 140, 5);
      }
      ctx.globalAlpha = 1;
    }

    // --- rolling hum bar: black band, 4px stepped edge ---
    var barA = kf(p, K_BAR);
    if (barA > 0.01) {
      var bt = barTop(p, sHei), bh = sHei * 0.12;
      ctx.fillStyle = '#000000';
      ctx.globalAlpha = barA * 0.28;
      ctx.fillRect(sx, sy + bt - 4, sWid, 2);
      ctx.globalAlpha = barA * 0.55;
      ctx.fillRect(sx, sy + bt - 2, sWid, 2);
      ctx.globalAlpha = barA * 0.92;
      ctx.fillRect(sx, sy + bt, sWid, bh);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  var lastT = T0;
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  draw(T0);

  if (typeof requestAnimationFrame === 'function') {
    var startStamp = null;
    var frame = function (ts) {
      if (startStamp === null) startStamp = ts;
      var t = T0 + (ts - startStamp) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
