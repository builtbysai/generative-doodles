<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No9092 · Cipher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0B0B0D; }
  body { position: fixed; inset: 0; width: 100%; touch-action: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function() {
  'use strict';
  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  // Seeded RNG (mulberry32)
  var _s = 9092;
  function rnd() {
    _s |= 0; _s = _s + 0x6D2B79F5 | 0;
    var z = Math.imul(_s ^ _s >>> 15, 1 | _s);
    z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z;
    return ((z ^ z >>> 14) >>> 0) / 4294967296;
  }

  var TAU = Math.PI * 2;
  var BONE = '#EDE6D6', AMBER = '#D9A441';

  // Each glyph: list of strokes in a unit cell [-0.5..0.5].
  // stroke = {k:'l', x1,y1,x2,y2} line | {k:'a', r, a0, a1} arc | {k:'d', x, y, r} dot
  function makeGlyph() {
    var strokes = [];
    var n = 2 + Math.floor(rnd() * 3);
    for (var i = 0; i < n; i++) {
      var kind = rnd();
      if (kind < 0.45) {
        // line: often axis-aligned or diagonal, sometimes through the middle
        var horiz = rnd() < 0.5;
        var c = (rnd() - 0.5) * 0.8;
        var e = 0.15 + rnd() * 0.3;
        if (horiz) strokes.push({ k: 'l', x1: c - e, y1: (rnd() - 0.5) * 0.8, x2: c + e, y2: (rnd() - 0.5) * 0.8 });
        else strokes.push({ k: 'l', x1: (rnd() - 0.5) * 0.8, y1: c - e, x2: (rnd() - 0.5) * 0.8, y2: c + e });
      } else if (kind < 0.75) {
        // arc: partial ring, like a moon
        var a0 = rnd() * TAU;
        strokes.push({ k: 'a', r: 0.18 + rnd() * 0.22, a0: a0, a1: a0 + 0.8 + rnd() * 2.6 });
      } else {
        // dot
        strokes.push({ k: 'd', x: (rnd() - 0.5) * 0.8, y: (rnd() - 0.5) * 0.8, r: 0.05 + rnd() * 0.05 });
      }
    }
    return { strokes: strokes, accent: rnd() < 0.06, phase: rnd() * TAU };
  }

  function drawGlyph(g, size) {
    var s = size;
    ctx.lineWidth = Math.max(1, size * 0.09);
    ctx.lineCap = 'round';
    for (var i = 0; i < g.strokes.length; i++) {
      var st = g.strokes[i];
      if (st.k === 'l') {
        ctx.beginPath();
        ctx.moveTo(st.x1 * s, st.y1 * s);
        ctx.lineTo(st.x2 * s, st.y2 * s);
        ctx.stroke();
      } else if (st.k === 'a') {
        ctx.beginPath();
        ctx.arc(0, 0, st.r * s, st.a0, st.a1);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(st.x * s, st.y * s, st.r * s, 0, TAU);
        ctx.fill();
      }
    }
  }

  var rings = [];
  var seed = 9092;

  function build() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var vw = window.innerWidth, vh = window.innerHeight;
    if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
    W = vw; H = vh;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    _s = seed;
    rings = [];
    var maxR = Math.min(W, H) * 0.46;
    var NR = 7;
    for (var k = 0; k < NR; k++) {
      var frac = (k + 1) / (NR + 0.6);
      var r = maxR * Math.pow(frac, 0.85);
      var circ = TAU * r;
      var gsize = Math.max(14, Math.min(W, H) * 0.052 * (0.75 + 0.5 * frac));
      var count = Math.max(6, Math.floor(circ / (gsize * 1.9)));
      var glyphs = [];
      for (var i = 0; i < count; i++) glyphs.push(makeGlyph());
      rings.push({
        r: r, count: count, glyphs: glyphs, gsize: gsize,
        dir: (k % 2 === 0) ? 1 : -1,
        omega: (0.05 + 0.028 * k) * (k % 2 === 0 ? 1 : -1) / (0.6 + frac),
        ang: rnd() * TAU,
        vel: 0
      });
    }
  }

  window.addEventListener('resize', build);
  build();

  // interaction: drag flings the rings; double-tap reseeds the glyph alphabet
  var dragging = false, lx = 0, ly = 0, lastTap = 0;
  cv.addEventListener('pointerdown', function(e) {
    var now = performance.now();
    if (now - lastTap < 320) { seed = (seed * 9301 + 49297) % 233280; build(); }
    lastTap = now;
    dragging = true; lx = e.clientX; ly = e.clientY;
  });
  window.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    var dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    var stir = (dx - dy) * 0.00012;
    for (var k = 0; k < rings.length; k++) rings[k].vel += stir * (k % 2 === 0 ? 1 : -1);
  });
  window.addEventListener('pointerup', function() { dragging = false; });

  var last = performance.now(), time = 0;

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    time += dt;

    ctx.fillStyle = '#0B0B0D';
    ctx.fillRect(0, 0, W, H);

    var cx = W / 2, cy = H / 2;

    // faint orbit guides
    ctx.strokeStyle = 'rgba(237,230,214,0.055)';
    ctx.lineWidth = 1;
    for (var k = 0; k < rings.length; k++) {
      ctx.beginPath();
      ctx.arc(cx, cy, rings[k].r, 0, TAU);
      ctx.stroke();
    }

    for (var k = 0; k < rings.length; k++) {
      var rg = rings[k];
      rg.vel *= Math.pow(0.25, dt); // decay fling
      rg.ang += (rg.omega + rg.vel) * dt;

      for (var i = 0; i < rg.count; i++) {
        var a = rg.ang + (i / rg.count) * TAU;
        var g = rg.glyphs[i];
        var breathe = 1 + 0.10 * Math.sin(time * 1.4 + g.phase + k);
        var gs = rg.gsize * breathe;
        var x = cx + Math.cos(a) * rg.r;
        var y = cy + Math.sin(a) * rg.r;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(a + Math.PI / 2); // glyphs stand upright along the ring
        ctx.strokeStyle = g.accent ? AMBER : BONE;
        ctx.fillStyle = g.accent ? AMBER : BONE;
        ctx.globalAlpha = g.accent ? 0.95 : 0.78;
        drawGlyph(g, gs);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;

    // quiet center mark
    ctx.strokeStyle = 'rgba(217,164,65,0.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, 5 + 1.5 * Math.sin(time * 1.1), 0, TAU);
    ctx.stroke();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
