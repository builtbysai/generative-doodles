<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>How They Watch</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- How They Watch — Nick Briz study NB7 ----------
  // After howthey.watch/you (2021): the page fingerprints its own reader —
  // canvas hash, browser tokens, screen, timezone, color depth, fonts,
  // pixel ratio, language, cpu threads — and renders the result as a
  // portrait: one labeled red bar per signal, the bar's length hashed
  // from the value itself, so the shape of the picture is the shape of
  // the viewer's own setup. Everything is computed locally, in this
  // page, at load. Nothing is transmitted anywhere: this file contains
  // no network API of any kind, and the footer says so on the record.
  //
  // Two views of the same data: the evidence grid (label | bar | value)
  // and a radial "radar" the grid rotates into as you drag horizontally.
  // Rows assemble top to bottom over ~6s in hard steps. Tap a row to
  // copy its value (best-effort, silent when the clipboard is absent).
  // Values are environment-dependent BY DESIGN — the portrait is of the
  // viewer (clock-piece family): the shipped thumb is a snapshot of the
  // QA environment's answers, not a fixed image.

  var T0 = 6.5;                // fixed phase: assembly complete
  var PAGE_BG = '#0A0A0A';
  var INK_LINE = '#2E2E2E';
  var LABEL = '#FFE14D';       // evidence yellow
  var BAR = '#FF2B2B';         // signal red
  var VALUE = '#E8E8E8';       // paper monospace
  var DIM = '#6E6E6E';
  var HEADER = 'this page just fingerprinted you. here is the portrait.';
  var FOOTER = 'everything on this page stayed in your browser.';
  var HINT = 'drag to rotate the portrait · tap a row to copy its value';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- small hashes (pure, stable) ----------
  function fnv1a(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }
  function hex8(n) {
    var s = (n >>> 0).toString(16);
    while (s.length < 8) s = '0' + s;
    return s;
  }

  // ---------- guarded environment access ----------
  function nav() {
    try {
      if (typeof window !== 'undefined' && window.navigator) return window.navigator;
      if (typeof navigator !== 'undefined') return navigator;
    } catch (e) {}
    return null;
  }
  function scr() {
    try {
      if (typeof window !== 'undefined' && window.screen) return window.screen;
      if (typeof screen !== 'undefined') return screen;
    } catch (e) {}
    return null;
  }

  // ---------- signals: computed once, locally, at load ----------
  // Canvas fingerprint: a small test pattern drawn on this piece's own
  // visible context in a corner patch, read back and hashed, then
  // painted over by the first real frame. If pixel reads are refused,
  // fall back to hashing the UA + screen string. (This hash computation
  // is the one sanctioned pixel read in the piece; no element is ever
  // created and nothing leaves the page.)
  function canvasHash() {
    try {
      ctx.save();
      ctx.fillStyle = '#f60';
      ctx.fillRect(2, 2, 60, 24);
      ctx.fillStyle = '#069';
      ctx.font = '13px Arial';
      ctx.fillText('howthey.watch', 4, 18);
      ctx.fillStyle = 'rgba(102,204,0,0.7)';
      ctx.fillRect(30, 8, 40, 12);
      ctx.beginPath();
      ctx.moveTo(90, 4); ctx.lineTo(112, 24); ctx.lineTo(70, 22); ctx.closePath();
      ctx.fillStyle = '#909';
      ctx.fill();
      var img = ctx.getImageData(0, 0, 120, 30);
      ctx.restore();
      var d = img.data, acc = '';
      for (var i = 0; i < d.length; i += 97) acc += d[i] + ',';
      return hex8(fnv1a(acc));
    } catch (e) {
      try { ctx.restore(); } catch (e2) {}
      var n = nav(), s = scr();
      var seed = (n && n.userAgent ? n.userAgent : '?') + '|' +
                 (s ? s.width + 'x' + s.height : '?');
      return hex8(fnv1a(seed));
    }
  }

  var FONT_PROBES = ['Arial', 'Helvetica', 'Times New Roman', 'Courier New',
    'Georgia', 'Verdana', 'Tahoma', 'Trebuchet MS', 'Impact', 'Comic Sans MS',
    'Palatino', 'Garamond', 'Bookman', 'Helvetica Neue', 'Menlo', 'Monaco',
    'Consolas', 'Lucida Console', 'DejaVu Sans', 'DejaVu Serif',
    'DejaVu Sans Mono', 'Liberation Sans', 'Liberation Serif', 'Ubuntu',
    'Roboto', 'Open Sans', 'Lato', 'Montserrat', 'Fira Sans', 'Segoe UI',
    'Calibri', 'Cambria', 'Optima', 'Futura', 'Gill Sans', 'Baskerville',
    'Andale Mono', 'Courier', 'Times', 'Noto Sans', 'Source Sans Pro'];
  function fontCount() {
    try {
      var test = 'mmmmmmmmmmlliWW@#%';
      var generics = ['monospace', 'serif', 'sans-serif'];
      var base = {};
      for (var g = 0; g < generics.length; g++) {
        ctx.font = '32px ' + generics[g];
        base[generics[g]] = ctx.measureText(test).width;
      }
      var found = 0;
      for (var i = 0; i < FONT_PROBES.length; i++) {
        var hit = false;
        for (var j = 0; j < generics.length && !hit; j++) {
          ctx.font = '32px "' + FONT_PROBES[i] + '",' + generics[j];
          if (ctx.measureText(test).width !== base[generics[j]]) hit = true;
        }
        if (hit) found++;
      }
      return found + ' of ' + FONT_PROBES.length + ' probed';
    } catch (e) {
      return 'unavailable';
    }
  }

  function uaTokens() {
    var n = nav();
    if (!n || !n.userAgent) return 'unavailable';
    var ua = n.userAgent;
    var toks = ua.match(/[A-Za-z][A-Za-z0-9._]*\/[0-9][A-Za-z0-9._]*/g) || [];
    var out = toks.slice(0, 4).join(' · ');
    if (!out) out = ua.slice(0, 34);
    if (out.length > 38) out = out.slice(0, 38);
    return out;
  }

  function buildSignals() {
    var n = nav(), s = scr(), rows = [];
    function push(label, value) {
      var frac = 0.15 + 0.85 * (fnv1a(label + '=' + value) / 4294967296);
      rows.push({ label: label, value: value, frac: frac });
    }
    push('canvas hash', canvasHash());
    push('browser', uaTokens());
    push('screen', s && s.width ? (s.width + ' × ' + s.height) : 'unavailable');
    var tz = 'unavailable';
    try {
      if (typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
        tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'unavailable';
      }
    } catch (e) {}
    push('timezone', tz);
    push('color depth', s && s.colorDepth ? (s.colorDepth + '-bit') : 'unavailable');
    push('fonts found', fontCount());
    var dpr = 'unavailable';
    try {
      var d = (typeof window !== 'undefined' && window.devicePixelRatio) ||
              (typeof devicePixelRatio !== 'undefined' ? devicePixelRatio : 0);
      if (d) dpr = String(d);
    } catch (e) {}
    push('pixel ratio', dpr);
    push('language', n && n.language ? n.language : 'unavailable');
    push('cpu threads', n && n.hardwareConcurrency ? String(n.hardwareConcurrency) : 'unavailable');
    return rows;
  }
  var SIGNALS = buildSignals();

  // ---------- viewport / sizing ----------
  var W = 0, H = 0, DPR = 1;
  function viewSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 800);
    var h = vv ? vv.height : (window.innerHeight || 600);
    return { w: w, h: h };
  }
  function isPhone() {
    var s = scr();
    if (s && s.width && s.height) {
      if (Math.min(s.width, s.height) < 700) return true;
    }
    return H > W * 1.15;
  }
  function fit() {
    var sz = viewSize();
    W = sz.w; H = sz.h;
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  fit();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', fit);
  }
  window.addEventListener('resize', fit);

  // ---------- time ----------
  function nowSec() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : Date.now() / 1000;
  }
  var startStamp = nowSec();
  var lastT = T0;
  function pieceT() { return T0 + (nowSec() - startStamp); }

  // ---------- interaction state ----------
  var viewMix = 0;             // 0 = evidence grid, 1 = radial portrait
  var drag = null;             // {x0, mix0, moved, t0}

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function lerp(a, b, m) { return a + (b - a) * m; }

  // ---------- layout ----------
  // Returns geometry for both views so draw() can blend per element.
  function layout() {
    var phone = isPhone();
    var cx = W / 2;
    var topHead = phone ? 54 : 64;
    var botFoot = H - (phone ? 58 : 64);
    var rowsTop = topHead + (phone ? 26 : 34);
    var rowsBot = botFoot - (phone ? 20 : 26);
    var n = SIGNALS.length;
    var rowH = (rowsBot - rowsTop) / n;
    var unit = Math.min(W, H);
    var barH = Math.max(8, Math.min(20, rowH * 0.34));
    var fsLabel = phone ? 12 : Math.max(13, Math.min(17, unit * 0.021));
    var fsValue = phone ? 11.5 : Math.max(12.5, Math.min(16, unit * 0.02));
    var fsHead = phone ? 13.5 : Math.max(14, Math.min(19, unit * 0.024));
    var fsFoot = phone ? 11.5 : Math.max(12, Math.min(15, unit * 0.019));
    // grid columns
    var gridW = Math.min(W * (phone ? 0.92 : 0.8), 980);
    var gx = cx - gridW / 2;
    var narrow = W < 560;
    var labelW = gridW * 0.27, valueW = gridW * 0.35;
    var barX = gx + labelW + gridW * 0.03;
    var barW = gridW - labelW - valueW - gridW * 0.06;
    var valX = barX + barW + gridW * 0.03;
    // radial
    var rcx = cx, rcy = (rowsTop + rowsBot) / 2;
    var r0 = unit * 0.085;
    var rMax = Math.min(unit * 0.335, (rowsBot - rowsTop) * 0.52);
    return {
      phone: phone, cx: cx, topHead: topHead, botFoot: botFoot,
      rowsTop: rowsTop, rowsBot: rowsBot, rowH: rowH, barH: barH,
      fsLabel: fsLabel, fsValue: fsValue, fsHead: fsHead, fsFoot: fsFoot,
      gx: gx, gridW: gridW, narrow: narrow, labelW: labelW,
      barX: barX, barW: barW, valX: valX, valueW: valueW,
      rcx: rcx, rcy: rcy, r0: r0, rMax: rMax
    };
  }

  // assembly: row k starts at k*0.6s, builds over 0.9s in 3 hard steps
  function stepFrac(k, t) {
    var p = (t - k * 0.6) / 0.9;
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    var s = Math.floor(p * 3);
    return s / 3;
  }
  function stepAlpha(k, t) {
    var p = (t - k * 0.6) / 0.9;
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    var s = Math.floor(p * 3);
    return [0, 0.45, 0.75][s] !== undefined ? [0, 0.45, 0.75][s] : 1;
  }

  // ---------- drawing ----------
  // monospace font at a size that keeps the line inside 94% of the width
  function fitFont(text, px, bold) {
    var size = px;
    ctx.font = (bold ? 'bold ' : '') + size + 'px monospace';
    while (size > 8 && ctx.measureText(text).width > W * 0.94) {
      size -= 0.5;
      ctx.font = (bold ? 'bold ' : '') + size + 'px monospace';
    }
    return (bold ? 'bold ' : '') + size + 'px monospace';
  }
  function draw(T) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    lastT = T;

    ctx.fillStyle = PAGE_BG;
    ctx.fillRect(0, 0, W, H);

    var L = layout();
    var t = T;
    var m = viewMix;

    // header: one line of explanation (shrunk to fit narrow screens)
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.font = fitFont(HEADER, L.fsHead, false);
    ctx.fillStyle = VALUE;
    ctx.fillText(HEADER, L.cx, L.topHead / 2 + 6);
    ctx.strokeStyle = INK_LINE;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(L.gx, L.topHead + 4);
    ctx.lineTo(L.gx + L.gridW, L.topHead + 4);
    ctx.stroke();

    // radial guide ring, fades in with the mix
    if (m > 0.02) {
      ctx.globalAlpha = 0.5 * m;
      ctx.strokeStyle = INK_LINE;
      ctx.beginPath();
      ctx.moveTo(L.rcx + L.r0 + L.rMax, L.rcy);
      ctx.arc(L.rcx, L.rcy, L.r0 + L.rMax, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(L.rcx + L.r0, L.rcy);
      ctx.arc(L.rcx, L.rcy, L.r0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    var n = SIGNALS.length;
    for (var k = 0; k < n; k++) {
      var sig = SIGNALS[k];
      var sf = stepFrac(k, t);
      if (sf <= 0) continue;
      var al = stepAlpha(k, t);
      if (al <= 0) al = 0.45;

      // --- grid geometry ---
      var rowMidY = L.rowsTop + (k + 0.5) * L.rowH;
      var gBarX1 = L.barX, gBarX2 = L.barX + L.barW * sig.frac * sf;
      var gBarY = rowMidY;
      var gLabelX = L.gx, gLabelY = rowMidY;
      var gValX = L.valX, gValY = rowMidY;
      if (L.narrow) {
        // two-line rows: label + value on one line, bar beneath
        gLabelY = L.rowsTop + k * L.rowH + L.rowH * 0.3;
        gValY = gLabelY;
        gValX = L.gx + L.gridW;
        gBarY = L.rowsTop + k * L.rowH + L.rowH * 0.72;
        gBarX1 = L.gx;
        gBarX2 = L.gx + L.gridW * sig.frac * sf;
      }

      // --- radial geometry ---
      var ang = -Math.PI / 2 + k * (Math.PI * 2 / n);
      var ca = Math.cos(ang), sa = Math.sin(ang);
      var rLen = L.r0 + L.rMax * sig.frac * sf;
      var rBarX1 = L.rcx + ca * L.r0, rBarY1 = L.rcy + sa * L.r0;
      var rBarX2 = L.rcx + ca * rLen, rBarY2 = L.rcy + sa * rLen;
      // label rides beside the bar's midpoint, offset perpendicular, so
      // the nine spokes never pile their labels up in the hub
      var midR = (L.r0 + rLen) / 2;
      var off = L.barH * 0.5 + 12;
      var rLabelX = L.rcx + ca * midR - sa * off, rLabelY = L.rcy + sa * midR + ca * off;
      var rValX = L.rcx + ca * (rLen + 12), rValY = L.rcy + sa * (rLen + 12);

      // --- blended geometry ---
      var bX1 = lerp(gBarX1, rBarX1, m), bY1 = lerp(gBarY, rBarY1, m);
      var bX2 = lerp(gBarX2, rBarX2, m), bY2 = lerp(gBarY, rBarY2, m);
      var labX = lerp(gLabelX, rLabelX, m), labY = lerp(gLabelY, rLabelY, m);
      var valX2 = lerp(gValX, rValX, m), valY2 = lerp(gValY, rValY, m);

      // bar: one thick line in both views
      ctx.globalAlpha = 1;
      ctx.strokeStyle = BAR;
      ctx.lineWidth = L.barH;
      ctx.lineCap = 'butt';
      ctx.beginPath();
      ctx.moveTo(bX1, bY1);
      ctx.lineTo(bX2, bY2);
      ctx.stroke();

      // label
      ctx.globalAlpha = al;
      ctx.fillStyle = LABEL;
      ctx.font = L.fsLabel + 'px monospace';
      if (m < 0.5) {
        ctx.textAlign = 'left';
        ctx.fillText(sig.label, labX, labY);
      } else {
        ctx.textAlign = 'center';
        ctx.fillText(sig.label, labX, labY);
      }

      // value
      ctx.fillStyle = VALUE;
      ctx.font = L.fsValue + 'px monospace';
      if (m < 0.5) {
        ctx.textAlign = L.narrow ? 'right' : 'left';
        ctx.fillText(sig.value, valX2, valY2);
      } else {
        ctx.textAlign = ca > 0.25 ? 'left' : (ca < -0.25 ? 'right' : 'center');
        ctx.fillText(sig.value, valX2, valY2);
      }
      ctx.globalAlpha = 1;
    }

    // hint + footer
    ctx.textAlign = 'center';
    ctx.font = fitFont(HINT, L.fsFoot, false);
    ctx.fillStyle = DIM;
    ctx.fillText(HINT, L.cx, L.botFoot + 16);
    ctx.fillStyle = VALUE;
    ctx.font = fitFont(FOOTER, L.fsFoot, true);
    ctx.fillText(FOOTER, L.cx, L.botFoot + 38);
  }

  // ---------- pointer: drag rotates, tap copies ----------
  function evPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX !== undefined ? e.clientX : 0) - r.left;
    var y = (e.clientY !== undefined ? e.clientY : 0) - r.top;
    return { x: x, y: y };
  }
  function rowAt(x, y) {
    var L = layout();
    var n = SIGNALS.length;
    if (viewMix < 0.5) {
      var k = Math.floor((y - L.rowsTop) / L.rowH);
      return (k >= 0 && k < n && x >= L.gx - 10 && x <= L.gx + L.gridW + 10) ? k : -1;
    }
    var dx = x - L.rcx, dy = y - L.rcy;
    var ang = Math.atan2(dy, dx);
    var rel = (ang + Math.PI / 2) % (Math.PI * 2);
    if (rel < 0) rel += Math.PI * 2;
    var idx = Math.round(rel / (Math.PI * 2 / n)) % n;
    var rr = Math.sqrt(dx * dx + dy * dy);
    return (rr > L.r0 * 0.4 && rr < (L.r0 + L.rMax) * 1.45) ? idx : -1;
  }
  function copyValue(v) {
    try {
      var n = nav();
      if (n && n.clipboard && n.clipboard.writeText) {
        var p = n.clipboard.writeText(v);
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) {}
  }
  function onDown(e) {
    var p = evPos(e);
    drag = { x0: p.x, y0: p.y, mix0: viewMix, moved: 0, t0: nowSec(), row: rowAt(p.x, p.y) };
  }
  function onMove(e) {
    if (!drag) return;
    var p = evPos(e);
    var dx = p.x - drag.x0;
    var dy = p.y - drag.y0;
    drag.moved = Math.max(drag.moved, Math.sqrt(dx * dx + dy * dy));
    viewMix = clamp01(drag.mix0 + dx / (W * 0.55));
    draw(lastT);
  }
  function onUp(e) {
    if (!drag) return;
    var quick = (nowSec() - drag.t0) < 0.45;
    if (drag.moved < 6 && quick && drag.row >= 0) {
      copyValue(SIGNALS[drag.row].value);
    }
    drag = null;
    draw(lastT);
  }
  if (canvas.addEventListener) {
    if (typeof window !== 'undefined' && window.PointerEvent) {
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', function () { drag = null; });
    } else {
      canvas.addEventListener('mousedown', onDown);
      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('mouseup', onUp);
      canvas.addEventListener('touchstart', function (e) { if (e.touches && e.touches[0]) onDown(e.touches[0]); });
      canvas.addEventListener('touchmove', function (e) { if (e.touches && e.touches[0]) onMove(e.touches[0]); });
      canvas.addEventListener('touchend', function () { onUp({}); });
    }
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(pieceT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
