<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qué Desorden</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F4EEDC; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var INK = '#1A1A1A', PAPER = '#F4EEDC', WASH = '#B9B4A6', RED = '#C23B2E';

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry32(581070);

/* ---------- precomputed paper speckle (seeded data, drawn directly) ---------- */
var speckles = [];
for (var si = 0; si < 240; si++){
  speckles.push({ x: rng()*1000, y: rng()*1000, r: 0.8 + rng()*1.4, a: 0.03 + rng()*0.06, g: rng() < 0.5 });
}

/* ---------- geometry helpers ---------- */
function seg(x1,y1,x2,y2,n){ var p=[],i; for(i=0;i<=n;i++) p.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n]); return p; }
function rectP(x,y,w,h){ return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]]; }
function circP(cx,cy,r,n){ var p=[],i,a; n=n||24; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function ellP(cx,cy,rx,ry,n){ var p=[],i,a; n=n||26; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); } return p; }
function arcP(cx,cy,r,a0,a1,n){ var p=[],i,a; n=n||10; for(i=0;i<=n;i++){ a=a0+(a1-a0)*i/n; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function wavyH(x1,x2,y,amp,per){ var p=[],x; for(x=x1;x<=x2;x+=8) p.push([x, y+Math.sin((x-x1)/per*Math.PI*2)*amp]); p.push([x2, y+Math.sin((x2-x1)/per*Math.PI*2)*amp]); return p; }
function leafP(bx,by,angDeg,len,wid){ var a=angDeg*Math.PI/180, dx=Math.cos(a), dy=Math.sin(a), px=-dy, py=dx, p=[],i,t,w; for(i=0;i<=6;i++){ t=i/6; w=Math.sin(t*Math.PI)*wid; p.push([bx+dx*len*t+px*w, by+dy*len*t+py*w]); } for(i=6;i>=0;i--){ t=i/6; w=Math.sin(t*Math.PI)*wid; p.push([bx+dx*len*t-px*w, by+dy*len*t-py*w]); } return p; }
function jit(pts, amt){ var out=[],i; for(i=0;i<pts.length;i++) out.push([pts[i][0]+(rng()*2-1)*amt, pts[i][1]+(rng()*2-1)*amt]); return out; }
function S(pts, o){ o = o || {}; var p = jit(pts, o.j !== undefined ? o.j : 1.3); var len=0,i; var n=p.length, lim = o.close ? n : n-1; for(i=1;i<=lim;i++){ var a=p[i-1], b=p[i%n]; len += Math.hypot(b[0]-a[0], b[1]-a[1]); } return { pts:p, w:o.w||3, fill:o.fill||null, color:o.color||null, close:!!o.close, len:len }; }

/* ---------- the tabletop (stage 1000x1000) ---------- */
var TABLE = [[352,150],[928,132],[972,858],[312,884]];

var items = [];
function addItem(label, lx, ly, lsize, shadow, hit, strokes){
  var total=0,i; for(i=0;i<strokes.length;i++) total += strokes[i].len;
  items.push({ label:label, lx:lx, ly:ly, lsize:lsize, shadow:shadow||null, hit:hit||null,
               strokes:strokes, total:total, dur: Math.max(0.55, Math.min(1.5, total/1500)),
               dx:0, dy:0, checkStart:null });
}

/* 1 — la taza (the one red thing on the table) */
(function(){
  addItem('la taza', 384, 400, 23, { cx:443, cy:364, rx:54, ry:9 }, { x:400, y:274, w:124, h:100 }, [
    S([[410,286],[476,286],[470,354],[416,354]], { close:true, w:3.2, fill:RED }),
    S(ellP(443,286,33,7), { close:true, w:2.4 }),
    S([[474,302],[490,304],[497,318],[493,332],[472,338]], { w:2.8 })
  ]);
})();

/* 2 — los libros */
(function(){
  addItem('los libros', 584, 308, 23, { cx:655, cy:284, rx:112, ry:11 }, { x:552, y:156, w:208, h:126 }, [
    S([[562,240],[744,228],[750,260],[568,272]], { close:true, w:3 }),
    S(seg(574,266, 742,254, 3), { w:1.8 }),
    S([[576,206],[730,196],[736,226],[582,236]], { close:true, w:3, fill:WASH }),
    S(seg(576,206, 582,236, 1), { w:2 }),
    S([[592,172],[716,164],[721,192],[597,200]], { close:true, w:3 }),
    S(wavyH(612,700,182,2,44), { w:1.8 })
  ]);
})();

/* 3 — la naranja */
(function(){
  addItem('la naranja', 780, 480, 23, { cx:838, cy:444, rx:54, ry:9 }, { x:784, y:326, w:110, h:124 }, [
    S(circP(838,392,46,28), { close:true, w:3 }),
    S(seg(838,348, 843,334, 1), { w:2.6 }),
    S(leafP(843,336,-38,27,9), { close:true, w:2.4 }),
    S(arcP(838,392,35,0.6,2.1,10), { w:5, color:WASH }),
    S(seg(818,378, 819,379, 1), { w:2.4 }),
    S(seg(856,404, 857,405, 1), { w:2.4 }),
    S(seg(826,414, 827,415, 1), { w:2.4 }),
    S(seg(862,372, 863,373, 1), { w:2.4 })
  ]);
})();

/* 4 — las tijeras */
(function(){
  addItem('las tijeras', 498, 652, 23, { cx:600, cy:606, rx:108, ry:12 }, { x:498, y:420, w:220, h:196 }, [
    S(circP(524,562,19,20), { close:true, w:2.8 }),
    S(circP(556,590,19,20), { close:true, w:2.8 }),
    S(seg(538,548, 596,508, 2), { w:2.8 }),
    S(seg(566,574, 598,514, 2), { w:2.8 }),
    S([[600,502],[616,510],[702,428]], { close:true, w:2.6 }),
    S([[600,508],[616,500],[706,594]], { close:true, w:2.6 }),
    S(circP(603,505,4,10), { close:true, w:2, fill:INK })
  ]);
})();

/* 5 — la planta */
(function(){
  addItem('la planta', 784, 708, 23, { cx:838, cy:682, rx:50, ry:8 }, { x:790, y:516, w:100, h:168 }, [
    S([[806,612],[870,612],[860,676],[816,676]], { close:true, w:3.2 }),
    S(seg(802,612, 874,612, 2), { w:2.6 }),
    S(seg(838,612, 822,568, 2), { w:2.6 }),
    S(seg(838,612, 840,558, 2), { w:2.6 }),
    S(seg(838,612, 856,572, 2), { w:2.6 }),
    S(leafP(822,568,-112,30,10), { close:true, w:2.4 }),
    S(leafP(840,556,-88,34,11), { close:true, w:2.4 }),
    S(leafP(856,572,-62,28,9), { close:true, w:2.4 }),
    S(leafP(830,586,-128,22,8), { close:true, w:2.2 }),
    S(leafP(848,588,-48,22,8), { close:true, w:2.2 })
  ]);
})();

/* 6 — las llaves */
(function(){
  addItem('las llaves', 800, 856, 21, { cx:856, cy:830, rx:58, ry:8 }, { x:820, y:714, w:90, h:124 }, [
    S(circP(852,742,23,22), { close:true, w:3 }),
    S(circP(866,768,7,12), { close:true, w:2.4 }),
    S(seg(870,774, 892,818, 2), { w:2.6 }),
    S(seg(892,818, 878,820, 1), { w:2.4 }),
    S(seg(886,806, 874,810, 1), { w:2.4 }),
    S(circP(844,766,6,12), { close:true, w:2.4 }),
    S(seg(846,772, 852,824, 2), { w:2.6 }),
    S(seg(852,824, 840,822, 1), { w:2.4 }),
    S(seg(851,810, 840,812, 1), { w:2.4 })
  ]);
})();

/* 7 — el cuaderno */
(function(){
  var spiral = [], k, t, px, py;
  for(k=0;k<4;k++){ t = 0.14 + k*0.24; px = 586 + (578-586)*t; py = 724 + (830-724)*t; spiral.push(S(circP(px,py,5.5,10), { close:true, w:2 })); }
  addItem('el cuaderno', 556, 694, 22, { cx:672, cy:854, rx:106, ry:10 }, { x:570, y:714, w:204, h:142 },
    [ S([[586,724],[766,742],[758,848],[578,830]], { close:true, w:3.2 }) ]
    .concat(spiral)
    .concat([
      S(seg(614,762, 740,776, 3), { w:1.8 }),
      S(seg(610,790, 736,804, 3), { w:1.8 })
    ]));
})();

/* 8 — el lápiz */
(function(){
  addItem('el lápiz', 330, 694, 22, { cx:428, cy:664, rx:86, ry:9 }, { x:344, y:540, w:176, h:128 }, [
    S(seg(352,562, 484,648, 3), { w:2.6 }),
    S(seg(360,550, 492,636, 3), { w:2.6 }),
    S(seg(360,550, 352,562, 1), { w:2.6 }),
    S(seg(366,552, 358,564, 1), { w:2 }),
    S([[484,648],[492,636],[512,652]], { close:true, w:2.6 }),
    S(seg(505,650, 512,652, 1), { w:3 })
  ]);
})();

/* 9 — las gafas */
(function(){
  addItem('las gafas', 424, 850, 22, { cx:488, cy:824, rx:92, ry:9 }, { x:388, y:744, w:206, h:96 }, [
    S(circP(452,786,25,24), { close:true, w:3 }),
    S(circP(524,780,25,24), { close:true, w:3 }),
    S(wavyH(474,502,772,3,28), { w:2.6 }),
    S(seg(427,782, 394,760, 2), { w:2.6 }),
    S(seg(549,776, 588,752, 2), { w:2.6 })
  ]);
})();

/* ---------- the margin checklist ---------- */
var ROW0 = 168, ROWH = 82;
var checkBoxes = [];
(function(){ var i; for(i=0;i<items.length;i++){ checkBoxes.push(jit(rectP(46, ROW0 + i*ROWH - 22, 24, 24), 1.1)); } })();

/* ---------- state ---------- */
var itemsDrawn = 0;
var drawingIdx = -1, drawingT0 = 0;
var curT = 0, lastT = 0;

function tick(t){
  lastT = t; curT = t;
  if (drawingIdx >= 0){
    var it = items[drawingIdx];
    if ((t - drawingT0) >= it.dur){
      it.checkStart = t; itemsDrawn++; drawingIdx = -1;
    }
  }
}

/* ---------- drawing ---------- */
function handFont(size, weight){ return 'italic ' + (weight||600) + ' ' + size + 'px "Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif'; }

function pathOf(pts, close){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function strokePartial(pts, close, budget){
  var n = pts.length, lim = close ? n : n-1, b = budget, i, a, c, dx, dy, L;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(i=1;i<=lim;i++){
    a = pts[i-1]; c = pts[i%n]; dx = c[0]-a[0]; dy = c[1]-a[1]; L = Math.hypot(dx,dy);
    if (b >= L){ ctx.lineTo(c[0], c[1]); b -= L; }
    else { var f = L ? b/L : 0; ctx.lineTo(a[0]+dx*f, a[1]+dy*f); b = 0; break; }
  }
  ctx.stroke();
  return b;
}

function drawItem(it, p){
  var i, st, pts, budget;
  ctx.save(); ctx.translate(it.dx, it.dy);
  if (it.shadow && p > 0){
    ctx.save(); ctx.globalAlpha = 0.4 * Math.min(1, p*1.6); ctx.fillStyle = WASH;
    ctx.beginPath(); ctx.ellipse(it.shadow.cx, it.shadow.cy, it.shadow.rx, it.shadow.ry, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
  budget = p * it.total;
  for(i=0;i<it.strokes.length;i++){
    st = it.strokes[i]; pts = st.pts;
    if (st.fill && p > 0.72){
      ctx.save(); ctx.globalAlpha = Math.min(1, (p-0.72)/0.28); ctx.fillStyle = st.fill;
      pathOf(pts, true); ctx.fill(); ctx.restore();
    }
    if (budget <= 0) continue;
    ctx.strokeStyle = st.color || INK; ctx.lineWidth = st.w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (budget >= st.len){ pathOf(pts, st.close); ctx.stroke(); budget -= st.len; }
    else { strokePartial(pts, st.close, budget); budget = 0; }
  }
  var la = Math.max(0, Math.min(1, (p - 0.8)/0.2));
  if (la > 0){
    ctx.save(); ctx.globalAlpha = la; ctx.fillStyle = INK;
    ctx.font = handFont(it.lsize, 600); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.translate(it.lx, it.ly); ctx.rotate(-0.015);
    ctx.fillText(it.label, 0, 0); ctx.restore();
  }
  ctx.restore();
}

function drawChecklist(t){
  var i, y, it, cp;
  ctx.fillStyle = INK; ctx.strokeStyle = INK;
  for(i=0;i<items.length;i++){
    it = items[i]; y = ROW0 + i*ROWH;
    ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    pathOf(checkBoxes[i], true); ctx.stroke();
    ctx.save(); ctx.font = handFont(24, 600); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.translate(86, y); ctx.rotate(i % 2 ? 0.012 : -0.012);
    ctx.fillText(it.label, 0, 0); ctx.restore();
    if (it.checkStart !== null){
      cp = Math.max(0, Math.min(1, (t - it.checkStart)/0.3));
      if (cp > 0){
        ctx.save(); ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        var pts = [[50, y-8],[58, y],[72, y-14]], tot = 0, b, j, a, c, L;
        for(j=1;j<3;j++) tot += Math.hypot(pts[j][0]-pts[j-1][0], pts[j][1]-pts[j-1][1]);
        b = cp * tot;
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for(j=1;j<3;j++){ a=pts[j-1]; c=pts[j]; L=Math.hypot(c[0]-a[0], c[1]-a[1]);
          if (b >= L){ ctx.lineTo(c[0], c[1]); b -= L; } else { var f=L?b/L:0; ctx.lineTo(a[0]+(c[0]-a[0])*f, a[1]+(c[1]-a[1])*f); break; } }
        ctx.stroke(); ctx.restore();
      }
    }
  }
}

var viewW = 300, viewH = 300, dpr = 1;
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : { width:300, height:300 };
var isPhone = Math.min(scr.width, scr.height) < 700; // aspect fallback below only if screen lies
if (!isPhone && viewH > viewW * 1.15 && Math.min(viewW, viewH) < 700) isPhone = true;

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var s = Math.min(viewW/1000, viewH/1000);
  var ox = (viewW - 1000*s)/2, oy = (viewH - 1000*s)/2;
  ctx.setTransform(dpr*s, 0, 0, dpr*s, dpr*ox, dpr*oy);
  var i;
  for(i=0;i<speckles.length;i++){ var sp = speckles[i]; ctx.save(); ctx.globalAlpha = sp.a; ctx.fillStyle = sp.g ? WASH : INK; ctx.fillRect(sp.x, sp.y, sp.r, sp.r); ctx.restore(); }
  // the empty tabletop, waiting for its things
  ctx.save(); ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.lineWidth = 3; pathOf(TABLE, true); ctx.stroke();
  ctx.lineWidth = 2.2; pathOf([[312,884],[972,858],[970,874],[314,900]], true); ctx.stroke();
  ctx.restore();
  drawChecklist(curT);
  for(i=0;i<items.length;i++){
    if (i < itemsDrawn) drawItem(items[i], 1);
    else if (i === drawingIdx) drawItem(items[i], Math.max(0, Math.min(1, (curT - drawingT0)/items[i].dur)));
  }
  // hint
  ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = INK; ctx.font = handFont(21, 600);
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillText('tap · drag', 972, 952); ctx.restore();
}

/* ---------- sizing (Visual Viewport API) ---------- */
function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

/* ---------- interaction: tap (off an item) draws the next thing; drag nudges a drawn thing ---------- */
function toStage(e){
  var r = { left:0, top:0 };
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var cx = (e.clientX - r.left), cy = (e.clientY - r.top);
  var s = Math.min(viewW/1000, viewH/1000);
  return { x: (cx - (viewW - 1000*s)/2)/s, y: (cy - (viewH - 1000*s)/2)/s };
}
function hitItem(p){
  for (var i = items.length - 1; i >= 0; i--){
    var it = items[i];
    if (!it.hit || i >= itemsDrawn) continue;
    var h = it.hit;
    if (p.x >= h.x + it.dx && p.x <= h.x + it.dx + h.w && p.y >= h.y + it.dy && p.y <= h.y + it.dy + h.h) return i;
  }
  return -1;
}
var pdown = null;
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e);
  var idx = hitItem(p);
  pdown = { x:p.x, y:p.y, item: idx, moved:false,
            odx: idx >= 0 ? items[idx].dx : 0, ody: idx >= 0 ? items[idx].dy : 0 };
});
canvas.addEventListener('pointermove', function(e){
  if (!pdown) return;
  var p = toStage(e), dx = p.x - pdown.x, dy = p.y - pdown.y;
  if (Math.abs(dx) > 7 || Math.abs(dy) > 7) pdown.moved = true;
  if (pdown.moved && pdown.item >= 0){
    var it = items[pdown.item];
    it.dx = Math.max(-46, Math.min(46, pdown.odx + dx));
    it.dy = Math.max(-46, Math.min(46, pdown.ody + dy));
    draw();
  }
});
function endPointer(e){
  if (!pdown) return;
  var wasDrag = pdown.moved, onItem = pdown.item >= 0;
  pdown = null;
  if (wasDrag) { draw(); return; }
  if (onItem) return;                                 // a tap on a drawn thing is reserved for dragging it
  if (drawingIdx >= 0) return;                        // she draws deliberately; wait for the stroke
  if (itemsDrawn < items.length){ drawingIdx = itemsDrawn; drawingT0 = curT; }
  draw();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ pdown = null; });
if (typeof window !== 'undefined') window.addEventListener('pointerup', function(){ pdown = null; });

/* ---------- go: synchronous first frame at the resting state, then the loop ---------- */
resize();
var baseTs = null;
function loop(ts){
  if (baseTs === null){ baseTs = ts; lastT = 0; curT = 0; }
  tick((ts - baseTs)/1000);
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
</script>
</body>
</html>
