<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Near Nothing Sky</title>
<style>
html, body { margin: 0; padding: 0; background: #d8d8d4; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#d8d8d4';
var SKY_TOP = '#d3d3cf';
var SKY_HORIZON = '#ebe9e2';
var FIELD = '#c6c6bd';
var HORIZON_LINE = '#a9a9a0';
var FRAME_T = 60.0; /* fixed phase: double arc faintly but visibly present at frame one */
var TIDE_PERIOD = 900.0; /* seconds; one slow tide of the arc, about fifteen minutes */
var TIDE2_PHASE = -0.7; /* secondary bow lags the primary, so it is fainter at frame one */
var DRIFT_PERIOD = 480.0; /* seconds; sky brightness drift, a few percent */
var DRIFT_AMP = 0.03;
var HORIZON_V = 0.78; /* horizon sits low, sky dominant */
var SPECTRUM = ['#b98a78', '#c39a6c', '#c4b078', '#9cab8a', '#8ba2b2', '#8f8fa6', '#a48fa6'];
var PLATE_BG = 'rgba(250,250,246,0.55)';
var PLATE_LINE = 'rgba(90,90,86,0.25)';
var PLATE_INK = '#5c5c58';
var HINT_INK = '#6e6e68';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function shade(h, f) {
  var c = hexRgb(h);
  var r = clamp(Math.round(c[0] * f), 0, 255);
  var g = clamp(Math.round(c[1] * f), 0, 255);
  var b = clamp(Math.round(c[2] * f), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
function tide(t, phase) {
  return 0.5 + 0.5 * Math.sin(TAU * t / TIDE_PERIOD + phase);
}
function drawSky() {
  var drift = 1 + DRIFT_AMP * Math.sin(TAU * phaseT / DRIFT_PERIOD + 0.7);
  var horizonY = F.y + HORIZON_V * F.h;
  var g = ctx.createLinearGradient(0, F.y, 0, horizonY);
  g.addColorStop(0, shade(SKY_TOP, drift));
  g.addColorStop(1, shade(SKY_HORIZON, drift));
  ctx.fillStyle = g;
  ctx.fillRect(F.x, F.y, F.w, horizonY - F.y);
  /* ground below the low horizon, a shade deeper than the sky */
  ctx.fillStyle = shade(FIELD, drift);
  ctx.fillRect(F.x, horizonY, F.w, F.y + F.h - horizonY);
  ctx.fillStyle = rgba(HORIZON_LINE, 0.55);
  ctx.fillRect(F.x, horizonY, F.w, 1);
}
function drawBow(cx, cy, baseR, tideLevel) {
  var S = Math.min(F.w, F.h);
  var band = 0.0085 * S;
  var i, r, a;
  for (i = 0; i < SPECTRUM.length; i++) {
    r = baseR - i * band;
    /* outer bands read slightly stronger, inner bands fade; whole bow stays faint */
    a = 0.13 * tideLevel * (1 - 0.35 * i / (SPECTRUM.length - 1));
    if (a <= 0.0005) continue;
    ctx.beginPath();
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, Math.PI, TAU);
    ctx.strokeStyle = rgba(SPECTRUM[i], a);
    ctx.lineWidth = band + 0.5;
    ctx.stroke();
  }
}
function drawArc() {
  var S = Math.min(F.w, F.h);
  var horizonY = F.y + HORIZON_V * F.h;
  var cx = F.x + F.w / 2;
  var cy = horizonY + 0.24 * S;
  var t1 = tide(phaseT, 0);
  var t2 = tide(phaseT, TIDE2_PHASE);
  /* clip to the sky so no arc spills below the horizon */
  ctx.save();
  ctx.beginPath();
  ctx.rect(F.x, F.y, F.w, horizonY - F.y);
  ctx.clip();
  drawBow(cx, cy, 0.60 * S, t1);
  drawBow(cx, cy, 0.535 * S, t2);
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Near Nothing Sky').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Near Nothing Sky').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 18').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_BG;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Near Nothing Sky', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 18', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_BG;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawSky();
  drawArc();
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    tide: function () { return [+tide(phaseT, 0).toFixed(3), +tide(phaseT, TIDE2_PHASE).toFixed(3)]; }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
