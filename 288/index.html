<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.288 Never Clock Off</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101014; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.288 Never Clock Off (Sophia Golovanevskaya).
// A ceramic timepiece: a black vessel body fused with a bold
// yellow clock face and a white rim. Twelve plain markers sit
// on the dial, the hands keep real time from Date, the second
// hand sweeping and the minute hand stepping, and one small
// orange and blue fish swims a slow circle around the piece,
// one orbit per 60 second loop. Watch-only, no reload.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#101014', YELLOW = '#F2B53A', RIM = '#F2EEE2', ORANGE = '#E2703A', BLUE = '#2E6FA3', BODY = '#141210';
var DW = 1280, DH = 900;
var VX = 640; // vessel centre x
var DCX = 658, DCY = 415; // dial centre, a little off the vessel centre
var RIMR = 238, FACER = 212, ORBITR = 330;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0; // stored centred-fit transform
var LOOP = 60;
var T = 21; // frame one: fish already mid-orbit, about a third round
var lastNow = -1, acc = 0;
var TICK = 1 / 60;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}

// ---- vessel ------------------------------------------------------------------
// A squat pot silhouette behind the dial: a narrow mouth at
// the top, swelling shoulders and belly, and a tucked foot.
// The dial covers the upper belly, so body, rim and face read
// as one fused object, with the black belly and foot showing
// below and at the sides of the yellow face.
function vesselPath() {
  ctx.beginPath();
  ctx.moveTo(VX - 105, 238);
  ctx.lineTo(VX + 105, 238);
  ctx.bezierCurveTo(VX + 150, 240, VX + 168, 238, VX + 178, 252);
  ctx.bezierCurveTo(VX + 268, 315, VX + 292, 430, VX + 282, 545);
  ctx.bezierCurveTo(VX + 274, 640, VX + 215, 715, VX + 128, 752);
  ctx.quadraticCurveTo(VX, 772, VX - 128, 752);
  ctx.bezierCurveTo(VX - 215, 715, VX - 274, 640, VX - 282, 545);
  ctx.bezierCurveTo(VX - 292, 430, VX - 268, 315, VX - 178, 252);
  ctx.bezierCurveTo(VX - 168, 238, VX - 150, 240, VX - 105, 238);
  ctx.closePath();
}

// ---- fish ----------------------------------------------------------------------
// One small cartoon fish held as direct drawing only: an
// orange body, a blue tail and fin, a white eye with a black
// pupil. It is drawn in local coords pointing along +x and
// rotated onto the tangent of its circular orbit, with a
// tail wag that completes a whole number of cycles per loop.
function drawFish(x, y, ang, wag) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  // blue tail, wagging around the rear of the body
  ctx.save();
  ctx.translate(-32, 0);
  ctx.rotate(wag);
  ctx.fillStyle = BLUE;
  ctx.beginPath();
  ctx.moveTo(2, 0);
  ctx.lineTo(-25, -21);
  ctx.lineTo(-18, 0);
  ctx.lineTo(-25, 21);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  // orange body
  ctx.fillStyle = ORANGE;
  ctx.beginPath();
  ctx.ellipse(0, 0, 43, 24, 0, 0, Math.PI * 2);
  ctx.fill();
  // blue fin on the body
  ctx.fillStyle = BLUE;
  ctx.beginPath();
  ctx.ellipse(-2, -7, 14, 9, -0.5, 0, Math.PI * 2);
  ctx.fill();
  // eye
  ctx.fillStyle = RIM;
  ctx.beginPath(); ctx.arc(24, -6, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = BODY;
  ctx.beginPath(); ctx.arc(26, -6, 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---- hands ---------------------------------------------------------------------
function hand(angle, len, tail, wid, col) {
  ctx.strokeStyle = col;
  ctx.lineWidth = wid;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(DCX - Math.sin(angle) * tail, DCY + Math.cos(angle) * tail);
  ctx.lineTo(DCX + Math.sin(angle) * len, DCY - Math.cos(angle) * len);
  ctx.stroke();
}

// ---- drawing --------------------------------------------------------------------
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-80, -80, DW + 160, DH + 160);

  var phase = (T % LOOP) / LOOP;

  // vessel body behind the dial
  vesselPath();
  ctx.fillStyle = BODY;
  ctx.fill();
  // a faint rim-coloured edge so the black body reads against
  // the near black ground, layered translucency only
  vesselPath();
  ctx.strokeStyle = rgba(RIM, 0.28);
  ctx.lineWidth = 2;
  ctx.stroke();
  // blue glaze stripe across the lower belly, below the dial
  ctx.strokeStyle = rgba(BLUE, 0.9);
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(VX - 205, 688);
  ctx.quadraticCurveTo(VX, 716, VX + 205, 688);
  ctx.stroke();
  ctx.strokeStyle = rgba(RIM, 0.35);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(VX - 150, 742);
  ctx.quadraticCurveTo(VX, 756, VX + 150, 742);
  ctx.stroke();

  // dial: white rim, thin black ring, yellow face
  ctx.fillStyle = RIM;
  ctx.beginPath(); ctx.arc(DCX, DCY, RIMR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = BODY;
  ctx.beginPath(); ctx.arc(DCX, DCY, FACER + 13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = YELLOW;
  ctx.beginPath(); ctx.arc(DCX, DCY, FACER, 0, Math.PI * 2); ctx.fill();

  // twelve plain markers, not numerals, on a ring that drifts
  // a few degrees and returns over the loop
  var drift = Math.sin(phase * Math.PI * 2) * 3 * Math.PI / 180;
  ctx.fillStyle = BODY;
  for (var i = 0; i < 12; i++) {
    var a = drift + i * Math.PI / 6;
    var big = (i % 3 === 0);
    var len = big ? 30 : 19, wid = big ? 9 : 6;
    var rMid = 178;
    ctx.save();
    ctx.translate(DCX + Math.sin(a) * rMid, DCY - Math.cos(a) * rMid);
    ctx.rotate(a);
    ctx.fillRect(-wid / 2, -len / 2, wid, len);
    ctx.restore();
  }

  // real time from Date: hour eased by minutes, minute
  // stepped to the whole minute, second sweeping smoothly
  var now = new Date();
  var ms = now.getMilliseconds();
  var sec = now.getSeconds() + ms / 1000;
  var min = now.getMinutes();
  var hr = now.getHours() % 12;
  var secA = sec / 60 * Math.PI * 2;
  var minA = min / 60 * Math.PI * 2;
  var hrA = (hr + min / 60) / 12 * Math.PI * 2;
  hand(hrA, 108, 22, 15, BODY);
  hand(minA, 162, 22, 10, BODY);
  hand(secA, 184, 42, 4, BLUE);
  ctx.fillStyle = BODY;
  ctx.beginPath(); ctx.arc(DCX, DCY, 15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = BLUE;
  ctx.beginPath(); ctx.arc(DCX, DCY, 6.5, 0, Math.PI * 2); ctx.fill();

  // the fish: one full orbit per 60 second loop, starting
  // from the top of the circle, moving clockwise
  var fa = -Math.PI / 2 + phase * Math.PI * 2;
  var fx = DCX + Math.cos(fa) * ORBITR;
  var fy = DCY + Math.sin(fa) * ORBITR;
  var heading = fa + Math.PI / 2;
  var wag = Math.sin(T * Math.PI * 4) * 0.38;
  drawFish(fx, fy, heading, wag);
}

// ---- simulation ------------------------------------------------------------------
function stepSim() { T += TICK; }

// ---- resize ------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame -----------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the shaped timepiece keeps its proportions,
  // centred in the frame, page ground in the piece ground colour
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
