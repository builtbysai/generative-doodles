<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mamabot Assembly</title>
<style>
html, body { margin: 0; padding: 0; background: #17140F; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, PHONE = false;
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;

  function hash(n) {
    var h = (n * 2654435761) >>> 0;
    h ^= h >>> 13;
    h = (h * 1274126177) >>> 0;
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(a, b, x) {
    var t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function win(ct, a, b) { return smooth(a, a + 1, ct) * (1 - smooth(b - 1, b, ct)); }

  function size() {
    var vw = (window.visualViewport && window.visualViewport.width) ? window.visualViewport.width : window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    var sw = (window.screen && window.screen.width) ? window.screen.width : W;
    var sh = (window.screen && window.screen.height) ? window.screen.height : H;
    PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  }
  size();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { size(); draw(now()); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { size(); draw(now()); });
  }

  function now() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - T0) / 1000;
    return 0;
  }

  // Interaction state: closed-form over recorded events and t.
  var clips = {};          // limb -> {pts:[[dx,dy]...], t0}
  var extraFrames = [];    // appended memory frames, max 4
  var drag = null;         // {limb, ax, ay, pts}
  var lastTapT = -10, lastTapX = 0, lastTapY = 0;

  function limbAnchor(kind, g) {
    if (kind === 'armL') return [g.cx - g.torsoW / 2 - g.armW / 2, g.torsoY + g.armH * 0.25];
    return [g.cx + g.torsoW / 2 + g.armW / 2, g.torsoY + g.armH * 0.25];
  }
  function limbOffset(kind, t) {
    var c = clips[kind];
    if (!c || c.pts.length < 2) return [0, 0];
    var ph = (((t - c.t0) % 6) + 6) % 6 / 6;
    var f = ph * (c.pts.length - 1);
    var i = Math.floor(f), fr = f - i;
    var p0 = c.pts[i], p1 = c.pts[Math.min(i + 1, c.pts.length - 1)];
    return [p0[0] + (p1[0] - p0[0]) * fr, p0[1] + (p1[1] - p0[1]) * fr];
  }

  function onDown(x, y, t) {
    var g = geom();
    var aL = limbAnchor('armL', g), aR = limbAnchor('armR', g);
    var dL = Math.hypot(x - aL[0], y - aL[1]), dR = Math.hypot(x - aR[0], y - aR[1]);
    var limb = null, ax = 0, ay = 0;
    if (dL < dR && dL < g.armW * 1.6) { limb = 'armL'; ax = aL[0]; ay = aL[1]; }
    else if (dR < g.armW * 1.6) { limb = 'armR'; ax = aR[0]; ay = aR[1]; }
    if (limb) drag = { limb: limb, ax: ax, ay: ay, pts: [[x - ax, y - ay]], moved: 0 };
    else drag = { limb: null, ax: x, ay: y, pts: [[0, 0]], moved: 0 };
  }
  function onMove(x, y) {
    if (!drag) return;
    drag.pts.push([x - drag.ax, y - drag.ay]);
    drag.moved = Math.max(drag.moved, Math.hypot(x - drag.ax, y - drag.ay));
  }
  function onUp(x, y, t) {
    if (!drag) return;
    var d = drag; drag = null;
    if (d.limb && d.pts.length >= 2 && d.moved > 12) {
      clips[d.limb] = { pts: d.pts, t0: t };
    } else if (!d.limb && d.moved < 12) {
      if (t - lastTapT < 0.4 && Math.hypot(x - lastTapX, y - lastTapY) < 40) {
        var f = { seed: 100 + extraFrames.length * 7 + 3, type: extraFrames.length % 3 };
        if (extraFrames.length >= 4) extraFrames.shift();
        extraFrames.push(f);
        lastTapT = -10;
      } else { lastTapT = t; lastTapX = x; lastTapY = y; }
    }
  }
  function pos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }
  canvas.addEventListener('pointerdown', function (e) { var p = pos(e); onDown(p.x, p.y, now()); });
  canvas.addEventListener('pointermove', function (e) { var p = pos(e); onMove(p.x, p.y); });
  canvas.addEventListener('pointerup', function (e) { var p = pos(e); onUp(p.x, p.y, now()); });

  function geom() {
    var s = Math.min(W / 520, H / 700);
    var cx = W / 2;
    var baseY = H * 0.88;
    return {
      s: s, cx: cx, baseY: baseY,
      headW: 150 * s, headH: 118 * s,
      torsoW: 210 * s, torsoH: 228 * s,
      armW: 68 * s, armH: 158 * s,
      legW: 58 * s, legH: 128 * s,
      torsoY: baseY - 128 * s - 228 * s
    };
  }

  function dot(x, y, r, col) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  function frameRect(x, y, w, h, s) {
    ctx.fillStyle = '#5A4632';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#C9B48A';
    ctx.fillRect(x + 7 * s, y + 7 * s, w - 14 * s, h - 14 * s);
  }
  function panelInterior(x, y, w, h, s, seed, type) {
    // Procedural memory panels only. No photos, no people.
    ctx.fillStyle = '#C9B48A';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#26241F';
    ctx.lineWidth = Math.max(1, 1.5 * s);
    if (type === 0) {
      // Sepia interior: window, table, rug.
      ctx.strokeRect(x + w * 0.18, y + h * 0.14, w * 0.30, h * 0.38);
      ctx.beginPath(); ctx.moveTo(x + w * 0.33, y + h * 0.14); ctx.lineTo(x + w * 0.33, y + h * 0.52);
      ctx.moveTo(x + w * 0.18, y + h * 0.33); ctx.lineTo(x + w * 0.48, y + h * 0.33); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w * 0.15, y + h * 0.72); ctx.lineTo(x + w * 0.85, y + h * 0.72); ctx.stroke();
      ctx.fillStyle = '#A87F3F';
      ctx.beginPath(); ctx.moveTo(x + w * 0.62, y + h * 0.80); ctx.arc(x + w * 0.62, y + h * 0.80, w * 0.12, 0, Math.PI * 2); ctx.fill();
    } else if (type === 1) {
      // Child crayon drawing: sun, house, wobbly ground.
      ctx.strokeStyle = '#A87F3F';
      ctx.beginPath(); ctx.moveTo(x + w * 0.70, y + h * 0.30); ctx.arc(x + w * 0.70, y + h * 0.30, w * 0.11, 0, Math.PI * 2); ctx.stroke();
      for (var k = 0; k < 6; k++) {
        var a = k * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(x + w * 0.70 + Math.cos(a) * w * 0.14, y + h * 0.30 + Math.sin(a) * w * 0.14);
        ctx.lineTo(x + w * 0.70 + Math.cos(a) * w * 0.20, y + h * 0.30 + Math.sin(a) * w * 0.20);
        ctx.stroke();
      }
      ctx.strokeStyle = '#26241F';
      ctx.strokeRect(x + w * 0.15, y + h * 0.45, w * 0.34, h * 0.30);
      ctx.beginPath(); ctx.moveTo(x + w * 0.12, y + h * 0.45); ctx.lineTo(x + w * 0.32, y + h * 0.28); ctx.lineTo(x + w * 0.52, y + h * 0.45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w * 0.10, y + h * 0.82);
      for (var i = 0; i <= 6; i++) ctx.lineTo(x + w * (0.10 + i * 0.13), y + h * (0.82 + (hash(seed + i) - 0.5) * 0.06));
      ctx.stroke();
    } else {
      // Folded letter: fold lines, tea stain, stamp.
      ctx.beginPath(); ctx.moveTo(x + w * 0.15, y + h * 0.35); ctx.lineTo(x + w * 0.85, y + h * 0.35); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w * 0.15, y + h * 0.62); ctx.lineTo(x + w * 0.85, y + h * 0.62); ctx.stroke();
      ctx.fillStyle = 'rgba(168,127,63,0.55)';
      ctx.beginPath(); ctx.moveTo(x + w * 0.68, y + h * 0.70); ctx.arc(x + w * 0.68, y + h * 0.70, w * 0.10, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5A4632';
      ctx.strokeRect(x + w * 0.68, y + h * 0.10, w * 0.18, h * 0.16);
    }
  }
  function skinShell(x, y, w, h, s, alpha) {
    ctx.fillStyle = 'rgba(228,217,190,' + alpha.toFixed(3) + ')';
    ctx.fillRect(x - 3 * s, y - 3 * s, w + 6 * s, h + 6 * s);
    ctx.strokeStyle = 'rgba(38,36,31,0.5)';
    ctx.lineWidth = Math.max(1, s);
    ctx.strokeRect(x - 3 * s, y - 3 * s, w + 6 * s, h + 6 * s);
    var n = Math.floor(w / (26 * s));
    for (var i = 0; i <= n; i++) dot(x + i * (w / Math.max(1, n)), y - 3 * s, Math.max(1, 1.4 * s), 'rgba(38,36,31,0.55)');
  }

  function draw(t) {
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.fillStyle = '#17140F';
    ctx.fillRect(0, 0, W, H);

    var g = geom(), s = g.s;
    var cx = g.cx, baseY = g.baseY;

    // Spotlight pool: layered flat-alpha ellipses, no gradients.
    ctx.fillStyle = 'rgba(201,180,138,0.10)';
    ctx.beginPath(); ctx.moveTo(cx + W * 0.30, baseY + 6 * s); ctx.ellipse(cx, baseY + 6 * s, W * 0.30, 26 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(168,127,63,0.10)';
    ctx.beginPath(); ctx.moveTo(cx + W * 0.20, baseY + 6 * s); ctx.ellipse(cx, baseY + 6 * s, W * 0.20, 17 * s, 0, 0, Math.PI * 2); ctx.fill();

    // Ground line.
    ctx.strokeStyle = '#26241F';
    ctx.lineWidth = Math.max(1, 1.5 * s);
    ctx.beginPath(); ctx.moveTo(W * 0.08, baseY + 2 * s); ctx.lineTo(W * 0.92, baseY + 2 * s); ctx.stroke();

    // Small book on the ground, the thing being tidied toward.
    var bx = cx + g.torsoW * 0.95, by = baseY - 8 * s;
    ctx.fillStyle = '#A87F3F';
    ctx.fillRect(bx, by - 14 * s, 34 * s, 14 * s);
    ctx.strokeStyle = '#26241F';
    ctx.strokeRect(bx, by - 14 * s, 34 * s, 14 * s);

    // Caretaking cycle: 36 s, reach / tidy / rock, closed-form weights.
    var ct = ((t % 36) + 36) % 36;
    var reachW = win(ct, 0, 12), tidyW = win(ct, 12, 24), rockW = win(ct, 24, 36);
    var rockA = 0.035 * rockW * Math.sin(2 * Math.PI * (ct - 24) / 12);
    var bob = 5 * s * rockW * Math.sin(2 * Math.PI * (ct - 24) / 12);

    ctx.save();
    ctx.translate(cx, baseY + bob);
    ctx.rotate(rockA);
    ctx.translate(-cx, -baseY);

    var torsoY = g.torsoY;
    var headY = torsoY - g.headH - 14 * s;
    var legY = torsoY + g.torsoH;

    // Legs: frame struts.
    ctx.fillStyle = '#5A4632';
    ctx.fillRect(cx - g.legW - 14 * s, legY, g.legW, g.legH);
    ctx.fillRect(cx + 14 * s, legY, g.legW, g.legH);
    ctx.fillStyle = '#26241F';
    ctx.fillRect(cx - g.legW - 14 * s, baseY - 6 * s, g.legW, 6 * s);
    ctx.fillRect(cx + 14 * s, baseY - 6 * s, g.legW, 6 * s);

    // Torso frame + sepia interior panel.
    frameRect(cx - g.torsoW / 2, torsoY, g.torsoW, g.torsoH, s);
    panelInterior(cx - g.torsoW / 2 + 7 * s, torsoY + 7 * s, g.torsoW - 14 * s, g.torsoH - 14 * s, s, 11, 0);

    // Head frame + crayon panel.
    frameRect(cx - g.headW / 2, headY, g.headW, g.headH, s);
    panelInterior(cx - g.headW / 2 + 7 * s, headY + 7 * s, g.headW - 14 * s, g.headH - 14 * s, s, 23, 1);

    // Arms: frame + folded-letter panel. Angles from the caretaking cycle,
    // overridden by a recorded drag path when one exists for that limb.
    var armL = limbAnchor('armL', g), armR = limbAnchor('armR', g);
    var offL = limbOffset('armL', t), offR = limbOffset('armR', t);
    var hasL = clips.armL && clips.armL.pts.length >= 2;
    var hasR = clips.armR && clips.armR.pts.length >= 2;
    var angL = hasL ? 0 : (-0.18 - 0.40 * tidyW * Math.sin(2 * Math.PI * (ct - 12) / 12));
    var angR = hasR ? 0 : (0.18 + 0.60 * reachW * Math.sin(2 * Math.PI * ct / 12) + 0.40 * tidyW * Math.sin(2 * Math.PI * (ct - 12) / 12));

    function arm(ax, ay, ang, off, seed) {
      ctx.save();
      ctx.translate(ax + off[0], ay + off[1]);
      ctx.rotate(ang);
      frameRect(-g.armW / 2, 0, g.armW, g.armH, s);
      panelInterior(-g.armW / 2 + 7 * s, 7 * s, g.armW - 14 * s, g.armH - 14 * s, s, seed, 2);
      var breathA = 0.10 + 0.035 * Math.sin(2 * Math.PI * t / 4.5);
      skinShell(-g.armW / 2, 0, g.armW, g.armH, s, breathA);
      ctx.restore();
    }
    arm(armL[0], armL[1], angL, offL, 31);
    arm(armR[0], armR[1], angR, offR, 47);

    // Appended memory frames stack along the torso's right side.
    for (var fi = 0; fi < extraFrames.length; fi++) {
      var fx = cx + g.torsoW / 2 + 10 * s;
      var fy = torsoY + fi * (g.armH * 0.62 + 8 * s);
      var fw = g.armW * 0.85, fh = g.armH * 0.62;
      frameRect(fx, fy, fw, fh, s);
      panelInterior(fx + 7 * s, fy + 7 * s, fw - 14 * s, fh - 14 * s, s, extraFrames[fi].seed, extraFrames[fi].type);
    }

    // Breathing paper skin over the whole body.
    var breath = Math.sin(2 * Math.PI * t / 4.5);
    var alpha = 0.10 + 0.035 * breath;
    var bs = 1 + 0.012 * breath;
    ctx.save();
    ctx.translate(cx, torsoY + g.torsoH / 2);
    ctx.scale(bs, bs);
    ctx.translate(-cx, -(torsoY + g.torsoH / 2));
    skinShell(cx - g.headW / 2, headY, g.headW, g.headH, s, alpha);
    skinShell(cx - g.torsoW / 2, torsoY, g.torsoW, g.torsoH, s, alpha);
    ctx.restore();

    ctx.restore();
  }

  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    (function loop() {
      draw(now());
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
