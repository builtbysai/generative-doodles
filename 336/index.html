<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.336 Red Triangle</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0C0B; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.336 Red Triangle (arunima-dazess-wangchuk).
// A tall red lit triangular arch stands in a black room with a
// projected fire burning inside it, flanked at the base by four
// dark glazed masks with red lit eyes. The fire is particle data:
// exactly 120 particles, asserted, rising from the base inside a
// path clip of the triangle interior, colour stepping from fire
// orange to ember yellow over each rise. Every particle rise
// duration divides the 30s loop, so each particle respawns at
// the base and completes its rise inside the flicker cycle. The
// arch edge light breathes on the same 30s cycle, and the flicker
// riding on the breath comes from a fixed seeded table of 60
// values that repeats every 30s, so the frame at 30s is pixel
// identical to frame 0. The four masks, two per side, asserted,
// are perfectly still dark path data forms; their eye points are
// the only constant red in the piece. Watch only: no interaction.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var ARCH = '#C22F24', FIRE = '#E8722A', EMBER = '#E8B93B';
var MASKD = '#1E1A16', EYE = '#E03128', ROOM = '#0D0C0B';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30;
var T = 7.5, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- triangle geometry: apex near the top, centred -----------
var APEX = { x: 640, y: 78 };
var BASEL = { x: 378, y: 762 }, BASER = { x: 902, y: 762 };
var BASEY = 762, TRI_H = BASEY - APEX.y, HALF_BASE = (BASER.x - BASEL.x) / 2;

function triPath() {
  ctx.beginPath();
  ctx.moveTo(APEX.x, APEX.y);
  ctx.lineTo(BASER.x, BASER.y);
  ctx.lineTo(BASEL.x, BASEL.y);
  ctx.closePath();
}
function halfWidthAt(y) { return HALF_BASE * (y - APEX.y) / TRI_H; }

// ---- flicker table: 60 fixed seeded values, repeats in 30s ---
var FLICK = [];
(function () {
  var i, s = 336120;
  for (i = 0; i < 60; i++) {
    s = (s * 1103515245 + 12345) % 2147483648;
    FLICK.push(0.78 + (s / 2147483648) * 0.37);
  }
})();
if (FLICK.length !== 60) throw new Error('Red Triangle needs a 60 value flicker table');
function flickerAt(t) {
  var pos = (t * 8) % 60, i = Math.floor(pos), f = pos - i;
  var a = FLICK[i], b = FLICK[(i + 1) % 60];
  var u = f * f * (3 - 2 * f);
  return a + (b - a) * u;
}
function lightAt(t) {
  // Breath: one whole sine cycle in 30s. Flicker: the seeded
  // table. Both close at 30s, so the combined light does too.
  var breath = 0.74 + 0.26 * Math.sin(Math.PI * 2 * t / LOOP - Math.PI / 2 + Math.PI / 2);
  var L = breath * flickerAt(t);
  if (L < 0.3) L = 0.3; if (L > 1.12) L = 1.12;
  return L;
}

// ---- fire: exactly 120 particles, asserted --------------------
// dur values all divide 30 (30/3.75=8, /5=6, /6=5, /7.5=4,
// /10=3), so every particle completes whole rises in one loop
// and respawns at the base. swayCyc is a whole number of sway
// cycles per rise, so the sway closes on itself too.
var DURS = [3.75, 5, 6, 7.5, 10];
var PARTICLES = [];
(function () {
  var i, s = 90210;
  function rnd() { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }
  for (i = 0; i < 120; i++) {
    PARTICLES.push({
      lane: rnd() * 2 - 1,
      dur: DURS[Math.floor(rnd() * DURS.length)],
      phase: rnd(),
      swayAmp: 5 + rnd() * 15,
      swayCyc: 1 + Math.floor(rnd() * 3),
      size: 3.2 + rnd() * 6.3
    });
  }
})();
if (PARTICLES.length !== 120) throw new Error('Red Triangle needs exactly 120 particles');
(function () {
  var i, p;
  for (i = 0; i < PARTICLES.length; i++) {
    p = PARTICLES[i];
    if (Math.round(LOOP / p.dur) !== LOOP / p.dur) throw new Error('particle rise must divide the loop');
    if (Math.round(p.swayCyc) !== p.swayCyc) throw new Error('particle sway must close');
  }
})();

function drawFire(t, L) {
  ctx.save();
  triPath();
  ctx.clip();
  // Fire bed glow along the base, layered translucency only.
  var i, gx, ga;
  for (i = 0; i < 9; i++) {
    gx = 452 + i * 47;
    ga = 0.04 + 0.04 * flickerAt(t + i * 0.37);
    ctx.globalAlpha = ga * L;
    ctx.fillStyle = i % 2 ? EMBER : FIRE;
    ctx.beginPath();
    ctx.ellipse(gx, 748, 54, 13, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Particles rising from the base, clipped to the triangle.
  var p, life, y, hw, x, fade, r;
  for (i = 0; i < PARTICLES.length; i++) {
    p = PARTICLES[i];
    life = (t / p.dur + p.phase) % 1;
    y = 750 - life * 618;
    hw = halfWidthAt(y) - 9;
    if (hw < 2) hw = 2;
    x = APEX.x + p.lane * hw * 0.92 +
        Math.sin(life * Math.PI * 2 * p.swayCyc + p.phase * 6.2832) * p.swayAmp * (1 - life * 0.55);
    fade = life < 0.08 ? life / 0.08 : (life > 0.8 ? (1 - life) / 0.2 : 1);
    r = p.size * (1 - life * 0.55);
    // Halo pass, then core pass: translucency, never shadowBlur.
    ctx.globalAlpha = 0.13 * fade * (0.7 + 0.3 * L);
    ctx.fillStyle = FIRE;
    ctx.beginPath(); ctx.arc(x, y, r * 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.9 * fade;
    ctx.fillStyle = life < 0.42 ? FIRE : EMBER;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---- arch edge light: layered translucent red strokes --------
var EDGE_LAYERS = [
  { w: 34, a: 0.045 }, { w: 22, a: 0.07 }, { w: 13, a: 0.12 },
  { w: 7, a: 0.2 }, { w: 3.5, a: 0.48 }, { w: 1.6, a: 0.72 }
];
function drawArch(t, L) {
  var i;
  // Faint red spill inside the room of the triangle.
  ctx.globalAlpha = 0.05 * L;
  ctx.fillStyle = ARCH;
  triPath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = ARCH;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (i = 0; i < EDGE_LAYERS.length; i++) {
    ctx.globalAlpha = EDGE_LAYERS[i].a * L;
    ctx.lineWidth = EDGE_LAYERS[i].w;
    triPath(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ---- flanking masks: exactly 4, two per side, asserted -------
// Fixed dark path data forms, drawn every frame unmoving. The
// features are carved in room black strokes; the eyes are small
// filled points in eye red at constant alpha, the only constant
// red in the piece.
var MASKS = [
  { x: 118, y: 706, s: 0.92 },
  { x: 268, y: 694, s: 1.05 },
  { x: 1012, y: 694, s: 1.05 },
  { x: 1162, y: 706, s: 0.92 }
];
if (MASKS.length !== 4) throw new Error('Red Triangle needs exactly 4 masks');
(function () {
  var i, left = 0;
  for (i = 0; i < MASKS.length; i++) if (MASKS[i].x < 640) left++;
  if (left !== 2) throw new Error('Red Triangle needs two masks per side');
})();

function drawMask(m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.scale(m.s, m.s);
  // Silhouette: high brow, three crown tufts, tapering chin.
  ctx.fillStyle = MASKD;
  ctx.beginPath();
  ctx.moveTo(0, -66);
  ctx.bezierCurveTo(10, -70, 14, -76, 16, -84);
  ctx.bezierCurveTo(22, -72, 26, -70, 34, -62);
  ctx.bezierCurveTo(46, -48, 47, -18, 42, 12);
  ctx.bezierCurveTo(38, 38, 22, 56, 0, 66);
  ctx.bezierCurveTo(-22, 56, -38, 38, -42, 12);
  ctx.bezierCurveTo(-47, -18, -46, -48, -34, -62);
  ctx.bezierCurveTo(-26, -70, -22, -72, -16, -84);
  ctx.bezierCurveTo(-14, -76, -10, -70, 0, -66);
  ctx.closePath();
  ctx.fill();
  // Carved features in room black.
  ctx.strokeStyle = ROOM;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(-28, -19); ctx.lineTo(-8, -25); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, -25); ctx.lineTo(28, -19); ctx.stroke();
  ctx.lineWidth = 2.8;
  ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-3, 10); ctx.lineTo(2, 14); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 40, 12, Math.PI * 1.18, Math.PI * 1.82); ctx.stroke();
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-24, -44); ctx.lineTo(24, -44); ctx.stroke();
  // Eyes: constant alpha, never modulated by breath or flicker.
  ctx.globalAlpha = 1;
  ctx.fillStyle = EYE;
  ctx.beginPath(); ctx.arc(-16, -8, 4.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(16, -8, 4.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, DW, DH);
  var L = lightAt(T);
  drawArch(T, L);
  drawFire(T, L);
  // Edge strokes again over the fire rim so the frame reads solid.
  ctx.strokeStyle = ARCH;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.5 * L;
  ctx.lineWidth = 3.5;
  triPath(); ctx.stroke();
  ctx.globalAlpha = 0.75 * L;
  ctx.lineWidth = 1.6;
  triPath(); ctx.stroke();
  ctx.globalAlpha = 1;
  var i;
  for (i = 0; i < MASKS.length; i++) drawMask(MASKS[i]);
}

// ---- sizing: centred fit, page ground is the room black ------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
