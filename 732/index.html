<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cork Commons</title>
<style>
  html, body { margin: 0; padding: 0; background: #EDE6D6; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Cork Commons (EXPANSION #89 paul-ramirez-jonas, block 5)
// After The Commons (2011): a riderless horse in cork, standing in for
// the Marcus Aurelius monument, that the public uses as a notice board.
// Tap the horse to pin a small colored note with a seeded community
// message. Every pin puffs cork flakes off the surface; the flakes fall
// and settle into a drift on the ground that outlives the horse. Around
// the pins the silhouette erodes in small scallop bites as the 60 s
// cycle advances. At the cycle turn the horse is fresh again, notes
// gone, but the drift remains as the memory. Tap the ground to sweep
// the drift away. No blood, no wounds: this is cork flaking, not flesh.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  ground: '#EDE6D6',
  cork: '#C69A6B',
  speckle: '#A87F52',
  flake: '#8A6544',
  ink: '#1A1A1A',
  notes: ['#E4572E', '#F3A712', '#2E86AB', '#6A994E', '#F5F1E6']
};

var MESSAGES = [
  'for sale: bike',
  'lost cat, answers to Milo',
  'guitar lessons',
  'free firewood',
  'room for rent',
  'piano teacher',
  'yard sale saturday',
  'dog walking',
  'fresh eggs today',
  'book club tuesdays',
  'ride to the airport',
  'babysitter available',
  'community picnic',
  'chess partner wanted',
  'tomato seedlings',
  'help moving a couch'
];

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, isPhone = false;

// ---------------------------------------------------------------------------
// Horse silhouette in local units. Local space: y runs 0 (top of the
// ears) to 1 (hooves); x runs 0 to about 1.28. The horse is drawn from
// two point lists, a body polygon and a tail polygon overlapping the
// croup, both filled with the same flat cork so the union reads as one
// clean profile, almost a logo. Hit tests and erosion placement run on
// these same lists with plain geometry (no Path2D, no isPointInPath).
// ---------------------------------------------------------------------------
var BODY = [
  [0.072, 0.002], [0.098, 0.055], [0.078, 0.150], [0.034, 0.228],
  [0.028, 0.268], [0.068, 0.290], [0.118, 0.276], [0.166, 0.238],
  [0.204, 0.348], [0.226, 0.478], [0.216, 0.558],
  [0.230, 0.598], [0.236, 0.982], [0.236, 1.000], [0.290, 1.000],
  [0.290, 0.638], [0.320, 0.620], [0.330, 0.648], [0.334, 0.982],
  [0.334, 1.000], [0.388, 1.000], [0.388, 0.626], [0.470, 0.606],
  [0.878, 0.606], [0.936, 0.628], [0.942, 0.982], [0.942, 1.000],
  [0.996, 1.000], [0.996, 0.618], [1.046, 0.603], [1.056, 0.623],
  [1.060, 0.982], [1.060, 1.000], [1.114, 1.000], [1.114, 0.583],
  [1.170, 0.488], [1.174, 0.358], [0.900, 0.328], [0.620, 0.316],
  [0.300, 0.298], [0.205, 0.205], [0.160, 0.105], [0.122, 0.048]
];
var TAIL = [
  [1.150, 0.345], [1.225, 0.400], [1.252, 0.580], [1.240, 0.730],
  [1.185, 0.745], [1.170, 0.560], [1.150, 0.430]
];
var LOCAL_W = 1.28;
var EYE = [0.100, 0.135];

function pointInPoly(px, py, poly) {
  var inside = false;
  for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    var xi = poly[i][0], yi = poly[i][1];
    var xj = poly[j][0], yj = poly[j][1];
    if (((yi > py) !== (yj > py)) &&
        (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function inHorse(lx, ly) {
  return pointInPoly(lx, ly, BODY) || pointInPoly(lx, ly, TAIL);
}
function nearestOnSeg(px, py, ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay;
  var len2 = dx * dx + dy * dy;
  var t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return [ax + dx * t, ay + dy * t];
}
// Candidate bite points on the outline near a pin: the nearest outline
// point overall plus nearby outline vertices, kept apart from each
// other, at most three per pin.
function scallopSites(lx, ly, rng) {
  var sites = [];
  var polys = [BODY, TAIL];
  var best = null, bestD = 1e9;
  for (var p = 0; p < polys.length; p++) {
    var poly = polys[p];
    for (var i = 0; i < poly.length; i++) {
      var a = poly[i], b = poly[(i + 1) % poly.length];
      var q = nearestOnSeg(lx, ly, a[0], a[1], b[0], b[1]);
      var d = (q[0] - lx) * (q[0] - lx) + (q[1] - ly) * (q[1] - ly);
      if (d < bestD) { bestD = d; best = q; }
    }
  }
  if (best) sites.push(best);
  var verts = [];
  for (var p2 = 0; p2 < polys.length; p2++) {
    var poly2 = polys[p2];
    for (var k = 0; k < poly2.length; k++) {
      var v = poly2[k];
      var dv = Math.hypot(v[0] - lx, v[1] - ly);
      if (dv < 0.12) verts.push(v);
    }
  }
  verts.sort(function (a, b) {
    return Math.hypot(a[0] - lx, a[1] - ly) - Math.hypot(b[0] - lx, b[1] - ly);
  });
  for (var m = 0; m < verts.length && sites.length < 3; m++) {
    var cand = verts[m], ok = true;
    for (var s = 0; s < sites.length; s++) {
      if (Math.hypot(sites[s][0] - cand[0], sites[s][1] - cand[1]) < 0.035) { ok = false; break; }
    }
    if (ok) sites.push(cand);
  }
  return sites.map(function (pt, idx) {
    return {
      lx: pt[0], ly: pt[1],
      rMax: 0.020 + rng() * 0.014,
      start: 3 + idx * 5 + rng() * 3,
      grow: 16 + rng() * 8
    };
  });
}

// Speckle: fixed seed, local coordinates, generated once. The same
// speckle serves every cycle; the cork is one material throughout.
var SPECKLE = (function () {
  var rng = mulberry32(73201);
  var pts = [];
  for (var i = 0; i < 2600 && pts.length < 850; i++) {
    var x = rng() * LOCAL_W, y = rng();
    if (inHorse(x, y)) pts.push([x, y, 0.6 + rng() * 0.9]);
  }
  return pts;
})();

// ---------------------------------------------------------------------------
// Time and interaction state. Frame one is cycle 0 at t=0, drawn
// synchronously before any loop runs. Pins belong to the current cycle
// only; flakes are kept in absolute time and persist across cycles as
// the ground drift. Every pin's scallops, flakes, message and color are
// drawn from a mulberry32 stream seeded by cycle and pin count, so the
// whole history replays as closed-form functions of the recorded taps.
// ---------------------------------------------------------------------------
var T = 60;
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
var loopStarted = false;
var state = { cycle: 0, pins: [], flakes: [] };

var forcedT = -1;
(function () {
  try {
    var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(location.search || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (e) { /* inert hook, QA only */ }
})();

function nowSec() {
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
  return Math.max(0, (now - startStamp) / 1000);
}

// Layout: ground line at 80% of frame height; horse height is 70% of
// the frame height on desktop and 70% of the smaller dimension on
// phones; hooves rest exactly on the ground line.
function layout() {
  var S = isPhone ? 0.70 * Math.min(W, H) : 0.70 * H;
  return {
    S: S,
    left: (W - LOCAL_W * S) / 2,
    top: 0.80 * H - S,
    groundY: 0.80 * H
  };
}
function toLocal(x, y, L) {
  return [(x - L.left) / L.S, (y - L.top) / L.S];
}

function addPin(lx, ly, cycleT, absT, cycleIdx) {
  var rng = mulberry32(732000 + cycleIdx * 131 + state.pins.length * 17 + 5);
  var L = layout();
  var pin = {
    lx: lx, ly: ly, cycleT: cycleT, absT: absT,
    color: COL.notes[Math.floor(rng() * COL.notes.length)],
    msg: MESSAGES[Math.floor(rng() * MESSAGES.length)],
    rot: (rng() - 0.5) * 0.14,
    scallops: []
  };
  var sites = scallopSites(lx, ly, rng);
  for (var i = 0; i < sites.length; i++) {
    sites[i].start += cycleT;
    pin.scallops.push(sites[i]);
  }
  state.pins.push(pin);
  // Flake puff: seven cork squares leave the surface at the pin and
  // fall to the ground, where they join the drift for good.
  var px = L.left + lx * L.S, py = L.top + ly * L.S;
  for (var f = 0; f < 7; f++) {
    var x0 = px + (rng() - 0.5) * 10;
    var y0 = py + (rng() - 0.5) * 10;
    var vx = (rng() - 0.5) * 30;
    var vy = -(8 + rng() * 26);
    var restY = L.groundY + 3 + rng() * 12;
    var g = 260;
    var dy = restY - y0;
    var tLand = dy <= 0 ? 0 : (-vy + Math.sqrt(vy * vy + 2 * g * dy)) / g;
    state.flakes.push({
      x0: x0, y0: y0, vx: vx, vy: vy, g: g,
      t0: absT, tLand: tLand,
      xLand: x0 + vx * tLand, restY: restY,
      size: 3 + rng() * 2.5
    });
  }
  if (state.flakes.length > 420) state.flakes.splice(0, state.flakes.length - 420);
}

function tracePoly(poly, L) {
  ctx.beginPath();
  for (var i = 0; i < poly.length; i++) {
    var x = L.left + poly[i][0] * L.S, y = L.top + poly[i][1] * L.S;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function easeOutBack(p) {
  var c = 1.70158;
  var q = p - 1;
  return 1 + (c + 1) * q * q * q + c * q * q;
}
function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function draw(cycleT, absT) {
  var L = layout();
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  // Ground and ground line.
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = COL.flake;
  ctx.globalAlpha = 0.55;
  ctx.fillRect(0, L.groundY - 1, W, 2);
  ctx.globalAlpha = 1;

  // Horse: body and tail as one flat cork silhouette.
  ctx.fillStyle = COL.cork;
  tracePoly(BODY, L); ctx.fill();
  tracePoly(TAIL, L); ctx.fill();

  // Speckle, clipped to the silhouette: both subpaths in one path so
  // the clip is their union, not their intersection.
  ctx.save();
  ctx.beginPath();
  var polys = [BODY, TAIL];
  for (var u = 0; u < polys.length; u++) {
    var poly = polys[u];
    for (var v = 0; v < poly.length; v++) {
      var vx = L.left + poly[v][0] * L.S, vy = L.top + poly[v][1] * L.S;
      if (v === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
  }
  ctx.clip();
  ctx.fillStyle = COL.speckle;
  ctx.globalAlpha = 0.5;
  var sp = Math.max(1.2, 0.0035 * L.S);
  for (var i = 0; i < SPECKLE.length; i++) {
    var s = SPECKLE[i];
    ctx.fillRect(L.left + s[0] * L.S, L.top + s[1] * L.S, sp * s[2], sp * s[2]);
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // Eye: one small ground-colored dot so the head reads at a glance.
  ctx.fillStyle = COL.ground;
  ctx.beginPath();
  ctx.arc(L.left + EYE[0] * L.S, L.top + EYE[1] * L.S, Math.max(1.5, 0.009 * L.S), 0, Math.PI * 2);
  ctx.fill();

  // Erosion: ground-colored scallop discs bite the outline near each
  // pin, growing on the precomputed per-pin schedule as the cycle
  // advances. Radii and counts are capped so the horse stays readable
  // well inside the prompt's erosion budget.
  ctx.fillStyle = COL.ground;
  for (var p = 0; p < state.pins.length; p++) {
    var sc = state.pins[p].scallops;
    for (var k = 0; k < sc.length; k++) {
      var bite = sc[k];
      var prog = clamp01((cycleT - bite.start) / bite.grow);
      if (prog <= 0) continue;
      var r = bite.rMax * L.S * prog;
      ctx.beginPath();
      ctx.arc(L.left + bite.lx * L.S, L.top + bite.ly * L.S, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Flakes: falling on closed-form parabolas from their pin moment,
  // then resting in the drift across cycles until swept.
  ctx.fillStyle = COL.flake;
  for (var f = 0; f < state.flakes.length; f++) {
    var fl = state.flakes[f];
    var dt = absT - fl.t0;
    if (dt < 0) continue;
    var fx, fy;
    if (dt >= fl.tLand) { fx = fl.xLand; fy = fl.restY; }
    else {
      fx = fl.x0 + fl.vx * dt;
      fy = fl.y0 + fl.vy * dt + 0.5 * fl.g * dt * dt;
    }
    ctx.fillRect(fx - fl.size / 2, fy - fl.size / 2, fl.size, fl.size);
  }

  // Notes: colored rects with a black pushpin head and the seeded
  // message in tiny ink text; each lands with a small bounce.
  var noteW = Math.max(64, 0.17 * L.S);
  var noteH = noteW * 0.62;
  for (var n = 0; n < state.pins.length; n++) {
    var pin = state.pins[n];
    var cx = L.left + pin.lx * L.S, cy = L.top + pin.ly * L.S;
    var bp = clamp01((absT - pin.absT) / 0.35);
    var scale = bp >= 1 ? 1 : Math.max(0.2, easeOutBack(bp));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(pin.rot);
    ctx.scale(scale, scale);
    ctx.fillStyle = pin.color;
    ctx.fillRect(-noteW / 2, -noteH / 2, noteW, noteH);
    ctx.fillStyle = COL.ink;
    var fs = noteW * 0.145;
    ctx.font = '600 ' + fs + 'px system-ui, sans-serif';
    var tw = ctx.measureText(pin.msg).width;
    if (tw > noteW - 10) {
      fs = fs * (noteW - 10) / tw;
      ctx.font = '600 ' + fs + 'px system-ui, sans-serif';
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pin.msg, 0, noteH * 0.08);
    ctx.beginPath();
    ctx.arc(0, -noteH / 2 + noteW * 0.05, Math.max(2, noteW * 0.045), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// QA-only demo pins: with the inert ?seed=tNN hook, three pins are
// pre-recorded at fixed body spots so forced renders can show notes,
// erosion and drift. In the gallery there is no hook and no demo.
function seedDemoPins(cycleIdx) {
  if (state.pins.length) return;
  addPin(0.55, 0.42, 2, 2, cycleIdx);
  addPin(0.30, 0.38, 8, 8, cycleIdx);
  addPin(0.85, 0.45, 14, 14, cycleIdx);
}

function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = Math.round(vw);
  H = Math.round(vh);
  canvas.width = W;
  canvas.height = H;
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  if (forcedT >= 0) {
    seedDemoPins(Math.floor(forcedT / T));
    draw(forcedT % T, forcedT);
  } else if (loopStarted) {
    var el = nowSec();
    draw(el % T, el);
  } else {
    draw(0, 0);
  }
}

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    if (forcedT >= 0) return;
    var el = nowSec();
    var cycleIdx = Math.floor(el / T);
    if (cycleIdx !== state.cycle) { state.pins = []; state.cycle = cycleIdx; }
    var L = layout();
    var x = e.clientX, y = e.clientY;
    if (typeof x !== 'number' || typeof y !== 'number') return;
    if (y > L.groundY) { state.flakes = []; return; }
    var loc = toLocal(x, y, L);
    if (inHorse(loc[0], loc[1])) addPin(loc[0], loc[1], el % T, el, cycleIdx);
  });
}

resize();

if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
  loopStarted = true;
  var loop = function () {
    var el = nowSec();
    var cycleIdx = Math.floor(el / T);
    if (cycleIdx !== state.cycle) { state.pins = []; state.cycle = cycleIdx; }
    draw(el % T, el);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
