<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Circle That Refuses to Close</title>
<style>
html, body { margin: 0; padding: 0; background: #17141c; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Seed 1520000. No unseeded randomness anywhere.
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1520000);

  // Stepping-mark rotation: one fixed permutation of the 8 marks, one per
  // ring attempt, repeating every 8 attempts.
  var perm = [0, 1, 2, 3, 4, 5, 6, 7];
  for (var i = 7; i > 0; i--) {
    var j = Math.floor(rnd() * (i + 1));
    var tmp = perm[i]; perm[i] = perm[j]; perm[j] = tmp;
  }

  // Per-mark parameters. All variation periods (50 s, 25 s) divide the
  // 50 s attempt, so every mark returns to its exact frame-one state at
  // every attempt boundary.
  var marks = [];
  for (var m = 0; m < 8; m++) {
    marks.push({
      base: m * Math.PI / 4,
      rOff: (rnd() * 2 - 1) * 0.05,
      wAmp: 0.03 + rnd() * 0.04,
      wPer: (m % 2 === 0) ? 50 : 25,
      wPh: rnd() * Math.PI * 2,
      bAmp: 0.02 + rnd() * 0.03,
      bPer: (m % 3 === 0) ? 50 : 25,
      bPh: rnd() * Math.PI * 2,
      armPh: rnd() * Math.PI * 2
    });
  }

  var ATTEMPT = 50;      // seconds per ring attempt
  var PHASE = 20;        // frame one sits 20 s into an attempt (ring half drawn)
  var OMEGA = Math.PI * 2 / ATTEMPT; // one full counter-clockwise turn per attempt
  var FIELD = '#17141c', SHADOW = '#2a2430', OCHRE = '#c98f3d',
      BRICK = '#a34a2e', BONE = '#e0d6c0';

  var W = 720, H = 720, nowT = 0, t0 = null;

  function size() {
    var w = 720, h = 720;
    try {
      if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (typeof window !== 'undefined' && window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    } catch (e) {}
    return { w: Math.round(w), h: Math.round(h) };
  }

  function applySize() {
    var s = size();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }

  function r4(x) { return Math.round(x * 10000) / 10000; }
  function smooth(s) { s = s < 0 ? 0 : (s > 1 ? 1 : s); return s * s * (3 - 2 * s); }
  function wrapPi(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  function geom() {
    var cx = W / 2, cy = H / 2;
    var R = 0.36 * Math.min(W, H);
    return { cx: cx, cy: cy, R: R, k: Math.min(W, H) / 720 };
  }

  // ---- Drag state: closed-form functions of recorded events and t ----
  // Tangent drags: { kind:'tan', startT, endT, evs:[{t,cum}], rel }
  // Outward drags: { kind:'out', mark, startT, endT, lastExtra, relExtra }
  var drags = [];
  var active = null;

  function tangentOffset(t) {
    var off = 0;
    for (var d = 0; d < drags.length; d++) {
      var g = drags[d];
      if (g.kind !== 'tan') continue;
      if (t < g.startT) continue;
      if (g.endT === null || t <= g.endT) {
        var cum = 0;
        for (var e = 0; e < g.evs.length; e++) {
          if (g.evs[e].t <= t) cum = g.evs[e].cum; else break;
        }
        off += 0.45 * cum;
      } else {
        off += g.rel * Math.exp(-(t - g.endT) / 3);
      }
    }
    return off;
  }

  function outwardExtra(mark, t) {
    var ex = 0;
    for (var d = 0; d < drags.length; d++) {
      var g = drags[d];
      if (g.kind !== 'out' || g.mark !== mark) continue;
      if (t < g.startT) continue;
      if (g.endT === null) ex += g.lastExtra;
      else ex += g.relExtra * Math.exp(-(t - g.endT) / 1.5);
    }
    return ex > 110 ? 110 : ex;
  }

  function outwardGap(mark, t) {
    var gw = 0;
    for (var d = 0; d < drags.length; d++) {
      var g = drags[d];
      if (g.kind !== 'out' || g.mark !== mark) continue;
      if (t < g.startT) continue;
      if (g.endT === null) gw = Math.max(gw, 0.9);
      else gw = Math.max(gw, 0.9 * Math.exp(-(t - g.endT) / 1.5));
    }
    return gw;
  }

  // Scheduled step-out: during each attempt's break window [42,50), the
  // stepping mark moves out and back. A pure function of attempt time, so
  // frame one and every attempt boundary are unaffected.
  function schedExtra(i, t) {
    var attemptT = (t + PHASE) % ATTEMPT;
    var attemptIdx = Math.floor((t + PHASE) / ATTEMPT);
    var stepMark = perm[((attemptIdx % 8) + 8) % 8];
    if (i !== stepMark) return 0;
    if (attemptT < 42 || attemptT >= ATTEMPT) return 0;
    if (attemptT < 46) return 40 * smooth((attemptT - 42) / 4);
    return 40 * (1 - smooth((attemptT - 46) / 4));
  }

  // Mark angle/radius at time t, including drag offsets. Counter-clockwise
  // on screen means decreasing canvas angle (y grows downward).
  function markState(i, t) {
    var g = geom();
    var mk = marks[i];
    var ang = mk.base - OMEGA * t + mk.wAmp * Math.sin(Math.PI * 2 * t / mk.wPer + mk.wPh)
      + tangentOffset(t);
    var rad = g.R * (1 + mk.rOff + mk.bAmp * Math.sin(Math.PI * 2 * t / mk.bPer + mk.bPh));
    var extra = outwardExtra(i, t) + schedExtra(i, t);
    if (extra > 110) extra = 110;
    rad += extra;
    return { x: g.cx + rad * Math.cos(ang), y: g.cy + rad * Math.sin(ang), ang: ang, rad: rad, extra: extra };
  }

  function draw(t) {
    nowT = t;
    var g = geom();
    var cx = g.cx, cy = g.cy, R = g.R, k = g.k;
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    // Ground shadow disc under the circle.
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.32, 0, Math.PI * 2);
    ctx.fillStyle = SHADOW;
    ctx.fill();

    // Ring attempt state. Frame one is 20 s into an attempt.
    var attemptT = (t + PHASE) % ATTEMPT;
    var attemptIdx = Math.floor((t + PHASE) / ATTEMPT);
    var stepMark = perm[((attemptIdx % 8) + 8) % 8];
    var Rr = R * 1.16;
    var progress = 0, ringAlpha = 1;
    var gaps = [];
    if (attemptT < 42) {
      progress = 0.95 * smooth(attemptT / 42);
    } else if (attemptT < 46) {
      progress = 0.95;
      gaps.push({ c: markState(stepMark, t).ang, w: 1.1 * smooth((attemptT - 42) / 4) });
    } else {
      progress = 0.95;
      gaps.push({ c: markState(stepMark, t).ang, w: 1.1 });
      ringAlpha = (ATTEMPT - attemptT) / 4;
    }

    // Drag breaks: an outward drag opens a gap at its mark, closing on release.
    for (var mi = 0; mi < 8; mi++) {
      var gw = outwardGap(mi, t);
      if (gw > 0.001) gaps.push({ c: markState(mi, t).ang, w: gw });
    }

    // Ring-line: arc from start S extending counter-clockwise (decreasing
    // angle). Drawn as increasing-angle intervals for canvas arc calls.
    if (progress > 0.001 && ringAlpha > 0.001) {
      var S = -Math.PI / 2;
      var lo = S - progress * Math.PI * 2, hi = S;
      var intervals = [[lo, hi]];
      for (var gi = 0; gi < gaps.length; gi++) {
        var gapW = gaps[gi].w;
        if (gapW <= 0.001) continue;
        // The gap center must be mapped into the drawn interval: try the
        // center and its +-2PI equivalents, keep the one inside, if any.
        // (A plain wrap loop can cycle forever when the mark's angle falls
        // in the arc's undrawn remainder.)
        var gc = null;
        var cands = [gaps[gi].c, gaps[gi].c - Math.PI * 2, gaps[gi].c + Math.PI * 2];
        for (var ci = 0; ci < cands.length; ci++) {
          if (cands[ci] >= lo && cands[ci] <= hi) { gc = cands[ci]; break; }
        }
        if (gc === null) continue;
        var next = [];
        for (var iv = 0; iv < intervals.length; iv++) {
          var a = intervals[iv][0], b = intervals[iv][1];
          var ga = gc - gapW / 2, gb = gc + gapW / 2;
          if (gb <= a || ga >= b) { next.push([a, b]); continue; }
          if (ga > a) next.push([a, Math.min(ga, b)]);
          if (gb < b) next.push([Math.max(gb, a), b]);
        }
        intervals = next;
      }
      ctx.strokeStyle = 'rgba(224,214,192,' + r4(ringAlpha) + ')';
      ctx.lineWidth = Math.max(1, 2 * k);
      ctx.lineCap = 'round';
      for (var q = 0; q < intervals.length; q++) {
        if (intervals[q][1] - intervals[q][0] < 0.001) continue;
        ctx.beginPath();
        ctx.arc(cx, cy, Rr, intervals[q][0], intervals[q][1]);
        ctx.stroke();
      }
    }

    // Dancer-marks: torso + arm + leg lines, ochre/brick alternating.
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1, 2 * k);
    for (var i2 = 0; i2 < 8; i2++) {
      var st = markState(i2, t);
      var mk2 = marks[i2];
      ctx.strokeStyle = (i2 % 2 === 0) ? OCHRE : BRICK;
      var s = 9 * k;
      var sway = 0.22 * Math.sin(Math.PI * 2 * t / mk2.wPer + mk2.armPh);
      ctx.beginPath();
      ctx.moveTo(st.x, st.y - s);
      ctx.lineTo(st.x, st.y + s);
      ctx.moveTo(st.x, st.y - s * 0.5);
      ctx.lineTo(st.x - s * 0.9, st.y - s * 0.2 + sway * s);
      ctx.moveTo(st.x, st.y - s * 0.5);
      ctx.lineTo(st.x + s * 0.9, st.y - s * 0.2 - sway * s);
      ctx.moveTo(st.x, st.y + s);
      ctx.lineTo(st.x - s * 0.8, st.y + s * 1.1);
      ctx.moveTo(st.x, st.y + s);
      ctx.lineTo(st.x + s * 0.8, st.y + s * 1.1);
      ctx.stroke();
    }

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function pointerPos(ev) {
    return { x: ev.clientX, y: ev.clientY };
  }

  canvas.addEventListener('pointerdown', function (ev) {
    var p = pointerPos(ev);
    var g = geom();
    var best = -1, bestD = 1e9;
    for (var i = 0; i < 8; i++) {
      var st = markState(i, nowT);
      var d = Math.hypot(p.x - st.x, p.y - st.y);
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0 && bestD < 36 * g.k) {
      active = { kind: 'out', mark: best, startT: nowT, endT: null, lastExtra: 0, relExtra: 0 };
      drags.push(active);
      return;
    }
    var pr = Math.hypot(p.x - g.cx, p.y - g.cy);
    if (Math.abs(pr - g.R) < 70 * g.k) {
      var a = Math.atan2(p.y - g.cy, p.x - g.cx);
      active = { kind: 'tan', startT: nowT, endT: null, evs: [{ t: nowT, cum: 0 }], lastAng: a, cum: 0, rel: 0 };
      drags.push(active);
    } else {
      active = null;
    }
  });

  canvas.addEventListener('pointermove', function (ev) {
    if (!active) return;
    var p = pointerPos(ev);
    var g = geom();
    if (active.kind === 'tan') {
      var a = Math.atan2(p.y - g.cy, p.x - g.cx);
      active.cum += wrapPi(a - active.lastAng);
      active.lastAng = a;
      active.evs.push({ t: nowT, cum: active.cum });
    } else if (active.kind === 'out') {
      var pr = Math.hypot(p.x - g.cx, p.y - g.cy);
      var base = g.R * (1 + marks[active.mark].rOff +
        marks[active.mark].bAmp * Math.sin(Math.PI * 2 * nowT / marks[active.mark].bPer + marks[active.mark].bPh));
      var ex = pr - base;
      active.lastExtra = ex < 0 ? 0 : (ex > 110 ? 110 : ex);
    }
  });

  function endDrag() {
    if (!active) return;
    active.endT = nowT;
    if (active.kind === 'tan') active.rel = 0.45 * active.cum;
    else if (active.kind === 'out') active.relExtra = active.lastExtra;
    active = null;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  function loop(ts) {
    if (t0 === null) t0 = ts;
    var t = (ts - t0) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }

  applySize();
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { applySize(); draw(nowT); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { applySize(); draw(nowT); });
    }
  }
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
