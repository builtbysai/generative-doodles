<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window Glass</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #2A3138; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // No.795 "Window Glass" - EXPANSION #97 niele-toroni, PP4.
  // Street-facing gallery windows at night. A mullion grid of dark glass
  // panes fills the frame; behind the center panes the gallery interior
  // glows faintly and breathes on one slow 40 s sine. Faint reflection
  // streaks slide across the glass on the same phase family. On the
  // center pane, three white Toroni imprints sit painted directly on the
  // glass. The imprints never move: all motion is light. Watch-only.
  // Everything is a closed-form function of the loop phase: no state,
  // no clock reads; the only randomness is one seeded stream consumed
  // once at startup to fix the imprint jitter.

  var GLASS = "#2A3138";
  var MULLION = "#B9C0C7";
  var IMPRINT = "#F2F2F0";
  var GLOW = "#E8E2D2";

  var LOOP = 40; // seconds

  // Seeded RNG (mulberry32), fixed seed: imprint jitter is identical
  // on every load and at every size.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(79504);

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1, phone = false;

  // ---- Grid layout (fractions of frame) ----------------------------------
  // Desktop / thumb: 5 cols x 3 rows. Phone portrait: 3 cols x 5 rows.
  // The center pane carries the imprints; the glow sits behind the
  // center pane and bleeds a little into its neighbours.
  var grid = { cols: 5, rows: 3 };
  function layout() {
    if (phone) { grid.cols = 3; grid.rows = 5; }
    else { grid.cols = 5; grid.rows = 3; }
  }
  function paneRect(c, r) {
    var pw = 1 / grid.cols, ph = 1 / grid.rows;
    return { x: c * pw, y: r * ph, w: pw, h: ph };
  }
  function centerPane() {
    return paneRect(Math.floor(grid.cols / 2), Math.floor(grid.rows / 2));
  }

  // ---- Imprints -----------------------------------------------------------
  // Three dabs on the center pane, positions in pane-local fractions,
  // jitter fixed by the seeded stream: rotation +-2 deg, size +-5%,
  // bristle streak offsets per dab.
  var imprints = [];
  (function buildImprints() {
    var spots = [[0.32, 0.30], [0.64, 0.50], [0.38, 0.70]];
    for (var i = 0; i < spots.length; i++) {
      var streaks = [];
      var n = 13;
      for (var k = 0; k < n; k++) {
        streaks.push({
          u: 0.10 + 0.80 * (k / (n - 1)) + (rng() - 0.5) * 0.03,
          len: 0.72 + rng() * 0.24,          // streak length, fraction of dab height
          a: 0.08 + rng() * 0.10             // glass show-through alpha
        });
      }
      imprints.push({
        u: spots[i][0], v: spots[i][1],
        s: 0.30 * (0.95 + rng() * 0.10),     // dab width, fraction of pane width
        rot: (rng() - 0.5) * 0.07,          // +-2 degrees
        streaks: streaks
      });
    }
  })();

  // One Toroni dab centered at (cx, cy) with pixel size s. Paint load is
  // densest at the top edge (where the brush first pressed) and drier at
  // the bottom: three horizontal bands of falling alpha, then vertical
  // bristle hairlines where the glass shows through. A soft halo of
  // layered larger rects gives the slight glow against the dark glass.
  function drawImprint(cx, cy, s, rot) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    var w = s, h = s * 0.88;
    var x = -w / 2, y = -h / 2;
    // Halo: layered alpha shapes, no shadowBlur.
    ctx.fillStyle = IMPRINT;
    var halo = [[1.55, 0.045], [1.32, 0.06], [1.16, 0.08]];
    for (var i = 0; i < halo.length; i++) {
      ctx.globalAlpha = halo[i][1];
      ctx.fillRect(x - w * (halo[i][0] - 1) / 2, y - h * (halo[i][0] - 1) / 2,
                   w * halo[i][0], h * halo[i][0]);
    }
    // Body bands: press at top, lift at bottom.
    var bands = [[0.34, 0.96], [0.33, 0.88], [0.33, 0.78]];
    var by = y;
    for (var b = 0; b < bands.length; b++) {
      ctx.globalAlpha = bands[b][1];
      ctx.fillRect(x, by, w, h * bands[b][0] + 1);
      by += h * bands[b][0];
    }
    // Bristle streaks: glass showing through the paint.
    ctx.fillStyle = GLASS;
    var imp = imprints[drawImprint.idx];
    for (var k = 0; k < imp.streaks.length; k++) {
      var st = imp.streaks[k];
      ctx.globalAlpha = st.a;
      var sx = x + w * st.u;
      ctx.fillRect(sx, y + h * 0.06, Math.max(1, w * 0.016), h * st.len);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function measure() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    W = Math.round(vv ? vv.width : (window.innerWidth || 800));
    H = Math.round(vv ? vv.height : (window.innerHeight || 600));
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    var sw = (typeof window !== "undefined" && window.screen) ? window.screen : null;
    if (sw && sw.width && sw.height) {
      phone = Math.min(sw.width, sw.height) < 700;
    } else {
      phone = H > W * 1.15;
    }
    layout();
  }

  function draw(t) {
    var tc = ((t % LOOP) + LOOP) % LOOP;
    var ph = 2 * Math.PI * (tc / LOOP);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;

    var minD = Math.min(W, H);
    var bar = Math.max(5, minD * (phone ? 0.020 : 0.016)); // mullion thickness, px
    var cp = centerPane();

    // Glass everywhere first.
    ctx.fillStyle = GLASS;
    ctx.fillRect(0, 0, W, H);

    // Interior glow behind the center: layered warm rects shrinking to a
    // soft core, centred on the center pane and bleeding ~55% of a pane
    // into the neighbours. Brightness breathes on the loop sine:
    // b = 0.5 + 0.5*sin(ph), so frame one (t = 0) sits at mid-glow,
    // rising; the floor factor keeps the interior present at the dim end.
    var b = 0.5 + 0.5 * Math.sin(ph);
    var glowScale = 0.30 + 0.70 * b;
    var gx = (cp.x - cp.w * 0.55) * W, gy = (cp.y - cp.h * 0.55) * H;
    var gw = cp.w * 2.10 * W, gh = cp.h * 2.10 * H;
    ctx.fillStyle = GLOW;
    var layers = 7;
    for (var i = 0; i < layers; i++) {
      var f = i / layers;                    // 0 = outermost
      var inset = f * 0.42;
      ctx.globalAlpha = (0.028 + 0.030 * f) * glowScale + 0.012;
      ctx.fillRect(gx + gw * inset, gy + gh * inset,
                   gw * (1 - 2 * inset), gh * (1 - 2 * inset));
    }
    ctx.globalAlpha = 1;

    // Reflection streaks: two diagonal pale bands over the glass,
    // clipped to the pane field (they stop at the outer frame). They
    // slide slowly on the same phase family as the breath.
    var slide = Math.sin(ph + 0.9) * W * 0.05;
    ctx.save();
    ctx.beginPath();
    ctx.rect(bar, bar, W - 2 * bar, H - 2 * bar);
    ctx.clip();
    ctx.fillStyle = MULLION;
    var streaks = [
      { cx: 0.30, wdt: 0.16, a: 0.055 },
      { cx: 0.46, wdt: 0.055, a: 0.045 },
      { cx: 0.78, wdt: 0.11, a: 0.04 }
    ];
    var diag = H * 0.35; // horizontal run of the diagonal over full height
    for (var s2 = 0; s2 < streaks.length; s2++) {
      var st2 = streaks[s2];
      var cxp = st2.cx * W + slide * (s2 === 2 ? 0.6 : 1);
      var hw = st2.wdt * W / 2;
      ctx.globalAlpha = st2.a * (0.75 + 0.25 * b);
      ctx.beginPath();
      ctx.moveTo(cxp - hw - diag / 2, -10);
      ctx.lineTo(cxp + hw - diag / 2, -10);
      ctx.lineTo(cxp + hw + diag / 2, H + 10);
      ctx.lineTo(cxp - hw + diag / 2, H + 10);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // Mullions: outer frame plus dividers, flat aluminum. A hairline of
    // imprint white at low alpha along one edge of each bar suggests the
    // metal catching the interior light.
    ctx.fillStyle = MULLION;
    ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
    ctx.fillRect(0, 0, bar, H); ctx.fillRect(W - bar, 0, bar, H);
    var c, r;
    for (c = 1; c < grid.cols; c++) {
      ctx.fillRect(c * W / grid.cols - bar / 2, 0, bar, H);
    }
    for (r = 1; r < grid.rows; r++) {
      ctx.fillRect(0, r * H / grid.rows - bar / 2, W, bar);
    }
    ctx.fillStyle = IMPRINT;
    ctx.globalAlpha = 0.16;
    for (c = 1; c < grid.cols; c++) {
      ctx.fillRect(c * W / grid.cols - bar / 2, 0, 1, H);
    }
    for (r = 1; r < grid.rows; r++) {
      ctx.fillRect(0, r * H / grid.rows - bar / 2, W, 1);
    }
    ctx.globalAlpha = 1;

    // The three imprints on the center pane. Fixed forever.
    var pw = cp.w * W, phgt = cp.h * H;
    var dab = Math.min(pw, phgt);
    for (var k2 = 0; k2 < imprints.length; k2++) {
      drawImprint.idx = k2;
      var im = imprints[k2];
      drawImprint((cp.x + im.u * cp.w) * W, (cp.y + im.v * cp.h) * H,
                  dab * im.s, im.rot);
    }
  }

  measure();

  // QA hook: only when there is no rAF (headless renderer), an optional
  // ?seed=tNN in the URL selects the loop time of the single frame.
  var hasRAF = (typeof requestAnimationFrame === "function");
  var t0 = 0;
  if (!hasRAF) {
    var seedT = 0;
    if (typeof location !== "undefined" && location.search) {
      var m = /seed=t([0-9.]+)/.exec(location.search);
      if (m) seedT = parseFloat(m[1]);
    }
    draw(seedT);
  } else {
    draw(0);
    var tick = function (ts) {
      if (!t0) t0 = ts;
      draw((ts - t0) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  var onResize = function () { measure(); if (!hasRAF) draw(0); };
  if (typeof window !== "undefined" && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", onResize);
  }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("resize", onResize);
  }
})();
</script>
</body>
</html>
