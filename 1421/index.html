<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pretty / Ugly</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #e8e2d4; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  // Seeded PRNG (mulberry32). No Math.random anywhere.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1421000);

  // Static paper speckles, precomputed once (identical every frame).
  var speckles = [];
  (function () {
    var i;
    for (i = 0; i < 90; i++) {
      speckles.push({ x: rand(), y: rand(), r: 1 + rand() * 2, a: 0.04 + rand() * 0.06 });
    }
  })();

  function round4(v) {
    return Math.round(v * 10000) / 10000;
  }

  function sizeCanvas() {
    var w, h;
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    if (w !== W || h !== H) {
      W = w; H = h;
      canvas.width = W;
      canvas.height = H;
    }
  }

  function isPhone() {
    if (typeof window.screen !== 'undefined' && window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) return true;
    }
    return H > W * 1.15;
  }

  function setPageGround(rgb) {
    try {
      if (typeof document !== 'undefined' && document.body && document.body.style) {
        document.body.style.background = rgb;
      }
    } catch (e) { /* probe shims without a real body: ignore */ }
  }

  // ---- intensity model (closed-form over piece time + recorded events) ----
  var CYCLE = 40; // seconds, neutral -> extreme -> neutral
  function clockI(t) {
    var ph = (t % CYCLE) / CYCLE;
    return 0.5 - 0.5 * Math.cos(2 * Math.PI * ph);
  }

  var dragging = false;
  var dragStartY = 0, dragStartI = 0, dragI = 0;
  var releaseT = -1e9, releaseOffset = 0; // decays back to the clock curve

  function intensityAt(t) {
    if (dragging) return dragI;
    var base = clockI(t);
    if (releaseT > -1e8) {
      var dt = t - releaseT;
      if (dt >= 0) base += releaseOffset * Math.exp(-dt / 3);
    }
    if (base < 0) base = 0;
    if (base > 1) base = 1;
    return base;
  }

  function lerp(a, b, k) { return a + (b - a) * k; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function dot(x, y, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function ellipse(x, y, rx, ry, fill) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function ellipseStroke(x, y, rx, ry, lw, stroke) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.lineWidth = lw;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }

  function line(x1, y1, x2, y2, lw, stroke) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineWidth = lw;
    ctx.strokeStyle = stroke;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function draw(t) {
    sizeCanvas();
    if (W <= 0 || H <= 0) return;
    var S = Math.min(W, H);
    var cx = W / 2, cy = H / 2;
    var I = intensityAt(t);
    var phone = isPhone();

    // Background: flat field grading neutral -> intense with I.
    var br = Math.round(lerp(232, 176, I));
    var bg = Math.round(lerp(226, 30, I));
    var bb = Math.round(lerp(212, 36, I));
    var bgCss = 'rgb(' + br + ',' + bg + ',' + bb + ')';
    ctx.fillStyle = bgCss;
    ctx.fillRect(0, 0, W, H);
    setPageGround(bgCss);

    // Static paper speckles (seeded, identical every frame).
    var i, sp;
    for (i = 0; i < speckles.length; i++) {
      sp = speckles[i];
      ctx.fillStyle = 'rgba(74,74,68,' + round4(sp.a) + ')';
      ctx.fillRect(sp.x * W, sp.y * H, sp.r, sp.r);
    }

    var lw = (1.5 + 3.5 * I) * (S / 720);
    var faceRx = 0.34 * S, faceRy = 0.38 * S;
    var ink = '#1a1a18';

    // Extreme shadow: flat-alpha halo behind the face, grows with I.
    if (I > 0.02) {
      ctx.fillStyle = 'rgba(74,26,22,' + round4(0.22 * I) + ')';
      ctx.beginPath();
      ctx.ellipse(cx, cy, faceRx * 1.06, faceRy * 1.06, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Face oval (behind the hand).
    ellipseStroke(cx, cy, faceRx, faceRy, lw, ink);

    // Brows: above the hand, slanting harder with I.
    var browY = cy - 0.30 * S;
    var browLen = 0.12 * S;
    var browDrop = lerp(0.01 * S, 0.055 * S, I); // inner end drops as intensity rises
    var sides = [-1, 1];
    var s;
    // Brows: left slants down toward center, right mirrors it.
    ctx.strokeStyle = ink;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 0.26 * S, browY - browDrop * 0.2);
    ctx.lineTo(cx - 0.14 * S, browY + browDrop);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 0.14 * S, browY + browDrop);
    ctx.lineTo(cx + 0.26 * S, browY - browDrop * 0.2);
    ctx.stroke();

    // Eyes: at the sides of the hand, opening with I.
    var eyeY = cy - 0.10 * S;
    var eyeRx = 0.045 * S;
    var eyeRy = lerp(0.004 * S, 0.042 * S, I);
    var ex;
    for (s = 0; s < 2; s++) {
      ex = cx + sides[s] * 0.21 * S;
      ellipseStroke(ex, eyeY, eyeRx, Math.max(eyeRy, 0.6), lw, ink);
      dot(ex, eyeY, Math.max(1.2, 0.012 * S), ink);
    }

    // Blush: flat-alpha cheeks, strengthening with I.
    var blushA = round4(0.12 + 0.55 * I);
    ellipse(cx - 0.24 * S, cy + 0.14 * S, 0.055 * S, 0.032 * S, 'rgba(192,133,82,' + blushA + ')');
    ellipse(cx + 0.24 * S, cy + 0.14 * S, 0.055 * S, 0.032 * S, 'rgba(192,133,82,' + blushA + ')');

    // Mouth: below the hand. Neutral line -> pleased curve -> extreme open shape.
    var mouthY = cy + 0.26 * S;
    var mouthRx = lerp(0.05 * S, 0.095 * S, I);
    var mouthRy = lerp(0.004 * S, 0.055 * S, I);
    ctx.beginPath();
    ctx.ellipse(cx, mouthY, mouthRx, Math.max(mouthRy, 0.6), 0, 0, Math.PI * 2);
    ctx.lineWidth = lw;
    ctx.strokeStyle = ink;
    ctx.stroke();
    if (I > 0.7) {
      ctx.fillStyle = 'rgba(74,26,22,' + round4((I - 0.7) / 0.3 * 0.75) + ')';
      ctx.beginPath();
      ctx.ellipse(cx, mouthY, mouthRx * 0.82, mouthRy * 0.82, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- The hand: FIXED sprite, never a function of t. ----
    var hand = '#26241f';
    var hx = cx, hy = cy + 0.03 * S;
    // Fingers: four rounded bars, varying heights.
    var fw = 0.042 * S;
    var fingerTops = [0.20, 0.26, 0.24, 0.18]; // heights above palm center
    var f;
    for (f = 0; f < 4; f++) {
      var fx = hx - 0.075 * S + f * 0.05 * S;
      var ftop = hy - fingerTops[f] * S;
      var fbot = hy + 0.02 * S;
      ctx.fillStyle = hand;
      ctx.fillRect(fx - fw / 2, ftop, fw, fbot - ftop);
      dot(fx, ftop, fw / 2, hand);
    }
    // Palm.
    ellipse(hx, hy + 0.05 * S, 0.115 * S, 0.125 * S, hand);
    // Thumb: left side, angled.
    ctx.fillStyle = hand;
    ctx.beginPath();
    ctx.ellipse(hx - 0.115 * S, hy + 0.08 * S, 0.055 * S, 0.028 * S, -0.7, 0, Math.PI * 2);
    ctx.fill();

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---- Interaction: drag brow or mouth to re-grade intensity directly. ----
  function evtPos(e) {
    if (typeof e.clientX !== 'undefined') return { x: e.clientX, y: e.clientY };
    return { x: e.offsetX || 0, y: e.offsetY || 0 };
  }
  function onDown(e) {
    var p = evtPos(e);
    var S = Math.min(W, H);
    var cx = W / 2, cy = H / 2;
    var browY = cy - 0.30 * S, mouthY = cy + 0.26 * S;
    var nearBrow = Math.abs(p.y - browY) < 0.09 * S && Math.abs(p.x - cx) < 0.32 * S;
    var nearMouth = Math.abs(p.y - mouthY) < 0.09 * S && Math.abs(p.x - cx) < 0.16 * S;
    if (nearBrow || nearMouth) {
      dragging = true;
      dragStartY = p.y;
      // Current intensity at this moment (last computed frame).
      dragStartI = lastI;
      dragI = lastI;
      if (e.preventDefault) e.preventDefault();
    }
  }
  var lastI = 0;
  var lastT = 0;
  function onMove(e) {
    if (!dragging) return;
    var p = evtPos(e);
    var S = Math.min(W, H);
    // Drag up = more intense, drag down = calmer.
    dragI = clamp(dragStartI - (p.y - dragStartY) / (0.35 * S), 0, 1);
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    releaseT = lastT;
    releaseOffset = dragI - clockI(lastT);
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
      window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { sizeCanvas(); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { sizeCanvas(); });
  }

  // Wrap draw so the drag model always knows the last clock time / intensity.
  var rawDraw = draw;
  draw = function (t) {
    lastT = t;
    lastI = intensityAt(t);
    rawDraw(t);
  };

  // Synchronous first frame at a constant phase (boot flag pattern).
  draw(0);

  // rAF loop, anchored on the first rAF call; typeof-guarded.
  var started = false, t0 = 0;
  function loop(ts) {
    if (!started) { started = true; t0 = ts; }
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
