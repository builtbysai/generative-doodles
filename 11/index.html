<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№11 · Halftone</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ecdc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(43,58,103,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(242,236,220,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another halftone</div>
<script>
'use strict';
// No11 Halftone.
// A dot grid where radius follows one radial cosine function of the
// distance from a seeded center: dots swell and shrink in rings as
// the cosine rolls outward, like a halftone plate of a ripple. One
// ink (indigo) on cream, no accent, no second term. The function is
// the whole piece (brief concept 11, halftone falloff).

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '11', 10) || 11;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f2ecdc';
const INK = '#2b3a67';

function compose(s) {
  const rnd = mulberry32(s);
  return {
    cx: 0.34 + rnd() * 0.32,
    cy: 0.34 + rnd() * 0.32,
    freq: 2.1 + rnd() * 1.3,      // cosine cycles across the diagonal
    ok: true
  };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h);
  const ox = (w - S) / 2, oy = (h - S) / 2;
  const cx = p.cx * S, cy = p.cy * S;

  const N = 46;
  const cell = S / N;
  ctx.fillStyle = INK;
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const x = (i + 0.5) * cell, y = (j + 0.5) * cell;
      const d = Math.hypot(x - cx, y - cy) / (S * 0.7071);
      const v = 0.5 + 0.5 * Math.cos(d * p.freq * Math.PI * 2);
      const r = cell * 0.46 * Math.pow(v, 0.75);
      if (r < 0.3) continue;
      ctx.beginPath();
      ctx.arc(ox + x, oy + y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
