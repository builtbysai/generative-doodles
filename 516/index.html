<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giant on a Minipony</title>
<style>
  html, body { margin: 0; padding: 0; background: #F7F2E4; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var CREAM = '#F7F2E4', BLUE = '#2B4FB0', RED = '#E6392B', PONY = '#1A1A1A',
      ORANGE = '#E8722A', YELLOW = '#F2B705', DEEPRED = '#C23B2A',
      SKIN = '#F0BE96', SHADOW = '#E9DCBE', INK = '#1A1A1A';
  var DESIGN = 1080;
  var FRAME = 46;                    // blue painted frame band, ~4% of canvas
  var PHASE0 = 2.3;                  // constant first-frame phase: pony centred, mid-stride
  var SPEED = 60;                    // amble speed, design px per second
  var PX_START = -219;               // pony centre x when fully off-field left
  var TRAVEL = 1464;                 // full traverse distance until fully off-field right
  var SHIFT = 621;                   // phase shift so t = PHASE0 puts the pony centre at x 540

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var seed = 51611;
  try {
    var m = /[?&]seed=(\d+)/.exec((typeof location !== 'undefined' && location.search) || '');
    if (m) seed = parseInt(m[1], 10) || seed;
  } catch (e) {}

  // ---------- seeded layout ----------
  function shuffle(arr, rng) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function buildLayout(s) {
    var rng = mulberry32(s);
    var L = {};
    L.hair = rng() < 0.5 ? RED : BLUE;                 // shipped seed rolls blue
    L.stripes = shuffle([ORANGE, YELLOW, DEEPRED, ORANGE], rng); // 4 warm dress stripes
    // keep the doubled colour from landing on itself, so all four bands read
    for (var rot = 0; rot < 3; rot++) {
      var bad = false;
      for (var q = 1; q < L.stripes.length; q++) if (L.stripes[q] === L.stripes[q - 1]) bad = true;
      if (!bad) break;
      L.stripes.push(L.stripes.shift());
    }
    L.propA = Math.floor(rng() * 2);                   // top-left slot: 0 sun disc, 1 crescent moon
    L.propB = Math.floor(rng() * 2);                   // bottom-right slot: 0 potted plant, 1 stack of books
    L.propC = Math.floor(rng() * 2);                   // bottom-left slot: 0 ground scribbles, 1 three flowers
    // painted-frame crayon hatch: short cream strokes lying in the blue band
    L.hatch = [];
    for (var i = 0; i < 150; i++) {
      var edge = Math.floor(rng() * 4);
      var along = 30 + rng() * (DESIGN - 60);
      var off = 6 + rng() * (FRAME - 14);
      var hx, hy, ang;
      if (edge === 0) { hx = along; hy = off; ang = (rng() - 0.5) * 0.5; }
      else if (edge === 1) { hx = along; hy = DESIGN - off; ang = (rng() - 0.5) * 0.5; }
      else if (edge === 2) { hx = off; hy = along; ang = Math.PI / 2 + (rng() - 0.5) * 0.5; }
      else { hx = DESIGN - off; hy = along; ang = Math.PI / 2 + (rng() - 0.5) * 0.5; }
      L.hatch.push({ x: hx, y: hy, a: ang, len: 10 + rng() * 18, w: 2.2 + rng() * 1.8, al: 0.08 + rng() * 0.12 });
    }
    // crayon grain: precomputed specks across the whole stage, drawn directly (no offscreen canvas)
    L.grain = [];
    var inks = [BLUE, ORANGE, YELLOW, DEEPRED, INK, BLUE, ORANGE];
    for (var g = 0; g < 820; g++) {
      L.grain.push({
        x: rng() * DESIGN, y: rng() * DESIGN,
        r: 0.8 + rng() * 1.6,
        ink: inks[Math.floor(rng() * inks.length)],
        a: 0.04 + rng() * 0.07
      });
    }
    return L;
  }
  var L = buildLayout(seed);

  // ---------- view ----------
  var view = { w: 0, h: 0, dpr: 1, phone: false };
  function measure() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) || null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    view.w = w; view.h = h;
    view.dpr = window.devicePixelRatio || 1;
    var sw = window.screen ? window.screen.width : w;
    var sh = window.screen ? window.screen.height : h;
    view.phone = Math.min(sw, sh) < 700 || h > w * 1.15;
    var bw = Math.max(1, Math.round(w * view.dpr));
    var bh = Math.max(1, Math.round(h * view.dpr));
    if (canvas.width !== bw) canvas.width = bw;
    if (canvas.height !== bh) canvas.height = bh;
  }

  // ---------- props (exactly three, fixed slots, never on the figures) ----------
  function drawSun() { // top-left slot, design (140,128), clears the rider's hair at every pass
    ctx.fillStyle = YELLOW;
    ctx.beginPath(); ctx.arc(140, 128, 33, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = ORANGE; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(140, 128, 24, 0, Math.PI * 2); ctx.stroke();
  }
  function drawMoon() {
    ctx.fillStyle = YELLOW;
    ctx.beginPath(); ctx.arc(140, 128, 32, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.arc(158, 118, 27, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = ORANGE;
    ctx.beginPath(); ctx.arc(112, 168, 4.5, 0, Math.PI * 2); ctx.fill();
  }
  function drawPlant() { // bottom-right slot, grounded at y 888
    ctx.strokeStyle = BLUE; ctx.lineWidth = 7; ctx.lineCap = 'round';
    var stems = [[905, 838, 888, 792], [905, 838, 905, 782], [905, 838, 924, 794]];
    for (var i = 0; i < stems.length; i++) {
      ctx.beginPath(); ctx.moveTo(stems[i][0], stems[i][1]);
      ctx.quadraticCurveTo(stems[i][0], stems[i][1] - 22, stems[i][2], stems[i][3]); ctx.stroke();
    }
    ctx.fillStyle = BLUE;
    var leaves = [[884, 788, 15, 9, -0.6], [905, 776, 16, 9, 0], [928, 790, 15, 9, 0.6]];
    for (var j = 0; j < leaves.length; j++) {
      ctx.beginPath();
      ctx.ellipse(leaves[j][0], leaves[j][1], leaves[j][2], leaves[j][3], leaves[j][4], 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = DEEPRED; // pot
    ctx.beginPath();
    ctx.moveTo(878, 838); ctx.lineTo(932, 838); ctx.lineTo(924, 888); ctx.lineTo(886, 888);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = ORANGE;
    ctx.fillRect(874, 830, 62, 10);
  }
  function drawBooks() { // bottom-right slot: three stacked books on the ground line
    ctx.fillStyle = BLUE; ctx.fillRect(862, 862, 92, 26);
    ctx.fillStyle = ORANGE; ctx.fillRect(870, 838, 78, 24);
    ctx.fillStyle = DEEPRED; ctx.fillRect(878, 816, 62, 22);
    ctx.fillStyle = CREAM;
    ctx.fillRect(866, 870, 84, 4); ctx.fillRect(874, 846, 70, 4); ctx.fillRect(882, 824, 54, 4);
  }
  function drawScribbles() { // bottom-left slot: wavy ground strokes
    var rows = [
      { y: 856, c: ORANGE, ph: 0.0 }, { y: 872, c: DEEPRED, ph: 1.7 }, { y: 886, c: BLUE, ph: 3.4 }
    ];
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (var i = 0; i < rows.length; i++) {
      ctx.strokeStyle = rows[i].c;
      ctx.beginPath();
      for (var x = 0; x <= 180; x += 10) {
        var y = rows[i].y + Math.sin(x / 26 + rows[i].ph) * 4;
        if (x === 0) ctx.moveTo(118 + x, y); else ctx.lineTo(118 + x, y);
      }
      ctx.stroke();
    }
  }
  function drawFlowers() { // bottom-left slot: three dot-and-stem flowers
    var fx = [150, 205, 262];
    ctx.strokeStyle = BLUE; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(fx[i], 888);
      ctx.quadraticCurveTo(fx[i] + 6, 862, fx[i], 838); ctx.stroke();
    }
    var cols = [ORANGE, DEEPRED, YELLOW];
    for (var j = 0; j < 3; j++) {
      ctx.fillStyle = cols[j];
      for (var p = 0; p < 5; p++) {
        var a = p / 5 * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(fx[j] + Math.cos(a) * 10, 830 + Math.sin(a) * 10, 6.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = BLUE;
      ctx.beginPath(); ctx.arc(fx[j], 830, 5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---------- pony + rider ----------
  function leg(x1, y1, x2, y2, w) {
    ctx.strokeStyle = PONY; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = PONY;
    ctx.beginPath(); ctx.ellipse(x2 + 3, y2 + 2, 13, 7, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawFigure(px, legPhase) {
    var BY = 698;                       // pony body centre height
    var bobP = Math.sin(legPhase * 2) * 3;
    var bobR = Math.sin(legPhase * 2 + 0.4) * 5;
    var sw = 0.45 * Math.sin(legPhase); // leg swing
    var swB = 0.45 * Math.sin(legPhase + Math.PI);

    // flat ground shadow, travels with the pony
    ctx.fillStyle = SHADOW;
    ctx.beginPath(); ctx.ellipse(px, 890, 205, 15, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(px, BY + bobP);

    // tail, swaying at its base
    ctx.save();
    ctx.translate(-158, -38);
    ctx.rotate(Math.sin(legPhase) * 0.07);
    ctx.strokeStyle = PONY; ctx.lineWidth = 15; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-34, 26, -38, 66); ctx.stroke();
    ctx.fillStyle = PONY;
    ctx.beginPath(); ctx.ellipse(-40, 84, 13, 22, 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // far legs (diagonal pairs with the near legs)
    leg(94, 46, 94 + Math.sin(swB) * 132, 46 + Math.cos(swB) * 132, 20);
    leg(-122, 46, -122 + Math.sin(sw) * 132, 46 + Math.cos(sw) * 132, 20);

    // body
    ctx.fillStyle = PONY;
    ctx.beginPath(); ctx.ellipse(0, 0, 165, 66, 0, 0, Math.PI * 2); ctx.fill();

    // neck + head
    ctx.strokeStyle = PONY; ctx.lineWidth = 52; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(126, -16); ctx.lineTo(190, -78); ctx.stroke();
    ctx.fillStyle = PONY;
    ctx.beginPath(); ctx.ellipse(212, -92, 41, 30, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(240, -76, 22, 16, -0.35, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); // ear
    ctx.moveTo(176, -114); ctx.lineTo(194, -140); ctx.lineTo(202, -110);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = CREAM; // pony eye
    ctx.beginPath(); ctx.arc(218, -96, 5.5, 0, Math.PI * 2); ctx.fill();

    // near legs
    leg(108, 46, 108 + Math.sin(sw) * 132, 46 + Math.cos(sw) * 132, 21);
    leg(-108, 46, -108 + Math.sin(swB) * 132, 46 + Math.cos(swB) * 132, 21);

    ctx.restore(); // pony group

    // ----- rider, seated on the pony back (seat point y 632) -----
    ctx.save();
    ctx.translate(px + 10, 632 + bobR);

    // hair fall behind the dress, at the back
    ctx.fillStyle = L.hair;
    ctx.beginPath(); ctx.ellipse(-98, -118, 42, 112, 0.15, 0, Math.PI * 2); ctx.fill();

    // stick legs, skin, with deep-red shoes
    ctx.strokeStyle = SKIN; ctx.lineCap = 'round';
    ctx.lineWidth = 15;
    ctx.beginPath(); ctx.moveTo(58, 38); ctx.lineTo(118, 94); ctx.lineTo(126, 166); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-54, 38); ctx.lineTo(-104, 90); ctx.lineTo(-94, 162); ctx.stroke();
    ctx.fillStyle = DEEPRED;
    ctx.beginPath(); ctx.ellipse(134, 172, 20, 11, 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-86, 168, 20, 11, -0.15, 0, Math.PI * 2); ctx.fill();

    // dress: trapezoid, stripes clipped inside, bands bowed on a slight curve
    var dTop = -165, dHem = 52;
    function halfW(y) { return 75 + (155 - 75) * ((y - dTop) / (dHem - dTop)); }
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-halfW(dTop), dTop);
    ctx.quadraticCurveTo(0, dTop - 6, halfW(dTop), dTop);
    ctx.quadraticCurveTo(halfW(dTop) + 14, (dTop + dHem) / 2, halfW(dHem), dHem);
    ctx.quadraticCurveTo(0, dHem + 9, -halfW(dHem), dHem);
    ctx.quadraticCurveTo(-halfW(dTop) - 14, (dTop + dHem) / 2, -halfW(dTop), dTop);
    ctx.closePath();
    ctx.clip();
    var bandH = (dHem - dTop) / L.stripes.length;
    for (var b = 0; b < L.stripes.length; b++) {
      var y0 = dTop + b * bandH, y1 = y0 + bandH + 1;
      ctx.fillStyle = L.stripes[b];
      ctx.beginPath();
      ctx.moveTo(-halfW(y0) - 20, y0);
      ctx.quadraticCurveTo(0, y0 + 7, halfW(y0) + 20, y0);
      ctx.lineTo(halfW(y1) + 20, y1);
      ctx.quadraticCurveTo(0, y1 + 7, -halfW(y1) - 20, y1);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // neck
    ctx.fillStyle = SKIN;
    ctx.fillRect(-2, -186, 32, 34);

    // stick arms: front arm reaches to the pony neck, back arm rests on the lap
    ctx.strokeStyle = SKIN; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.moveTo(60, -138); ctx.lineTo(104, -58); ctx.lineTo(148, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-60, -138); ctx.lineTo(-94, -54); ctx.lineTo(-58, 28); ctx.stroke();

    // giant head: hair mass, then the face circle set down-right inside it
    ctx.fillStyle = L.hair;
    ctx.beginPath(); ctx.arc(-6, -306, 148, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-108, -408, 52, 0, Math.PI * 2); ctx.fill(); // bun
    ctx.fillStyle = SKIN;
    ctx.beginPath(); ctx.arc(14, -292, 120, 0, Math.PI * 2); ctx.fill();

    // her face grammar: two dot eyes and one bent-line mouth, nothing more
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(-16, -298, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(50, -298, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(8, -264); ctx.quadraticCurveTo(20, -254, 36, -262); ctx.stroke();

    ctx.restore(); // rider group
  }

  // ---------- frame + scene ----------
  function draw(t) {
    measure();
    var w = view.w, h = view.h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, w, h);

    var stage = Math.min(w, h);
    var ox = (w - stage) / 2, oy = (h - stage) / 2;
    var s = stage / DESIGN;
    ctx.translate(ox, oy);
    ctx.scale(s, s);

    // blue painted frame, cream field inside
    ctx.fillStyle = BLUE;
    ctx.fillRect(0, 0, DESIGN, DESIGN);
    ctx.fillStyle = CREAM;
    ctx.fillRect(FRAME, FRAME, DESIGN - FRAME * 2, DESIGN - FRAME * 2);

    // crayon hatch on the frame band
    ctx.strokeStyle = CREAM; ctx.lineCap = 'round';
    for (var i = 0; i < L.hatch.length; i++) {
      var hh = L.hatch[i];
      ctx.globalAlpha = hh.al;
      ctx.lineWidth = hh.w;
      ctx.beginPath();
      ctx.moveTo(hh.x, hh.y);
      ctx.lineTo(hh.x + Math.cos(hh.a) * hh.len, hh.y + Math.sin(hh.a) * hh.len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // the three props, behind the figures
    if (L.propA === 0) drawSun(); else drawMoon();
    if (L.propB === 0) drawPlant(); else drawBooks();
    if (L.propC === 0) drawScribbles(); else drawFlowers();

    // amble: pony centre travels left to right across the field and wraps,
    // clipped to the cream field so it slips behind the frame at both ends
    var dist = ((SHIFT + t * SPEED) % TRAVEL + TRAVEL) % TRAVEL;
    var px = PX_START + dist;
    var legPhase = (px - 540) / 95 * Math.PI * 2 + 0.9;
    ctx.save();
    ctx.beginPath();
    ctx.rect(FRAME, FRAME, DESIGN - FRAME * 2, DESIGN - FRAME * 2);
    ctx.clip();
    drawFigure(px, legPhase);
    ctx.restore();

    // crayon grain over everything: precomputed specks, drawn directly each frame
    for (var gi = 0; gi < L.grain.length; gi++) {
      var g = L.grain[gi];
      ctx.globalAlpha = g.a;
      ctx.fillStyle = g.ink;
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- run ----------
  var tCur = PHASE0;
  draw(tCur); // synchronous first frame at the constant phase

  function reseed() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    L = buildLayout(seed);
    try { if (typeof history !== 'undefined' && history.replaceState) history.replaceState(null, '', '?seed=' + seed); } catch (e) {}
    draw(tCur);
  }
  canvas.addEventListener('pointerdown', reseed); // per prompt GP4: a tap reseeds

  function onResize() { draw(tCur); }
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', onResize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  }

  if (typeof requestAnimationFrame === 'function') {
    var startTs = null;
    var loop = function (ts) {
      if (startTs === null) startTs = ts;
      tCur = PHASE0 + (ts - startTs) / 1000;
      draw(tCur);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
