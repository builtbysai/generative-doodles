<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyNodes</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070D; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var PHASE = 12.55; // fixed first-frame phase: 0.55 s after the 12 s pulse — wavefront mid-network
  var LOOP = 45;     // seamless 45 s loop
  var PULSE_PERIOD = 6;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var vw = 0, vh = 0, dpr = 1;
  var curT = PHASE;

  // ---------- deterministic seed ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1086);

  // ---------- palette ----------
  var BODY = [15, 22, 34];        // #0F1622 node bodies
  var CYAN = [53, 224, 255];      // #35E0FF signal
  var MAGENTA = [255, 79, 216];   // #FF4FD8 conductor
  var EDGE = '#2A3446';
  var EDGE_LIT = '#35E0FF';

  function mixRGB(a, b, f) {
    var r = Math.round(a[0] + (b[0] - a[0]) * f);
    var g = Math.round(a[1] + (b[1] - a[1]) * f);
    var bl = Math.round(a[2] + (b[2] - a[2]) * f);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  // ---------- nodes ----------
  // Node 0 is the conductor at the exact center. The rest are seeded anchors
  // in polar layout with radius^1.35 so the web is dense at center, sparse out.
  var N = 53;
  var EDGE_THRESH = 0.135; // proximity threshold, in stage fractions
  var nodes = [];
  (function buildNodes() {
    nodes.push({
      ax: 0.5, ay: 0.5, conductor: true, type: 1, z: 2.05,
      rot0: rng() * Math.PI * 2, rotK: 1,
      dph: [rng() * 6.28, rng() * 6.28, rng() * 6.28, rng() * 6.28],
      damp: [0.004, 0.003, 0.004, 0.003]
    });
    for (var i = 1; i < N; i++) {
      var ang = rng() * Math.PI * 2;
      var rad = 0.46 * Math.pow(rng(), 1.35) + 0.035;
      nodes.push({
        ax: 0.5 + Math.cos(ang) * rad,
        ay: 0.5 + Math.sin(ang) * rad,
        conductor: false,
        type: rng() < 0.5 ? 0 : 1,                 // 0 tetrahedron, 1 octahedron
        z: 0.72 + rng() * 0.55,                     // depth scale
        rot0: rng() * Math.PI * 2,
        rotK: 1 + Math.floor(rng() * 2),            // wobble cycles per loop
        dph: [rng() * 6.28, rng() * 6.28, rng() * 6.28, rng() * 6.28],
        damp: [0.006 + rng() * 0.010, 0.005 + rng() * 0.008,
               0.006 + rng() * 0.010, 0.005 + rng() * 0.008]
      });
    }
  })();

  // closed-form drift: layered sines around the anchor, every frequency an
  // integer number of cycles per 45 s loop, so the motion loops seamlessly
  function nodePos(n, t, S, ox, oy) {
    var w = Math.PI * 2 / LOOP;
    var dx = n.damp[0] * Math.sin(w * 1 * t + n.dph[0]) + n.damp[1] * Math.sin(w * 2 * t + n.dph[1]);
    var dy = n.damp[2] * Math.sin(w * 1 * t + n.dph[2]) + n.damp[3] * Math.sin(w * 3 * t + n.dph[3]);
    return { x: ox + (n.ax + dx) * S, y: oy + (n.ay + dy) * S };
  }

  // ---------- wavefront ----------
  // Graph distance (in edges) from the conductor over the seeded anchor
  // layout, using the same proximity threshold the live edges use.
  var dist = [];
  var delay = []; // per-node arrival delay after an emission, seconds
  (function buildWavefront() {
    var i, j;
    var adj = [];
    for (i = 0; i < N; i++) { adj.push([]); dist.push(-1); }
    for (i = 0; i < N; i++) {
      for (j = i + 1; j < N; j++) {
        var dx = nodes[i].ax - nodes[j].ax, dy = nodes[i].ay - nodes[j].ay;
        if (Math.sqrt(dx * dx + dy * dy) < EDGE_THRESH) { adj[i].push(j); adj[j].push(i); }
      }
    }
    dist[0] = 0;
    var queue = [0];
    while (queue.length) {
      var cur = queue.shift();
      for (var k = 0; k < adj[cur].length; k++) {
        var nb = adj[cur][k];
        if (dist[nb] < 0) { dist[nb] = dist[cur] + 1; queue.push(nb); }
      }
    }
    // any node the anchor graph somehow left stranded gets a long delay
    var maxD = 0;
    for (i = 0; i < N; i++) if (dist[i] > maxD) maxD = dist[i];
    for (i = 0; i < N; i++) {
      if (dist[i] < 0) dist[i] = maxD + 1;
      // per-edge latency seeded per node (90-180 ms effective), times graph
      // distance — steep enough that the wavefront's edge stays visible
      delay.push(dist[i] * (0.09 + 0.09 * rng()));
    }
  })();

  // brightness of a node at time t: decaying pulse from the most recent
  // emission whose wavefront has reached it (plus the previous, max'd)
  function brightAt(dly, t, isConductor) {
    var tau = isConductor ? 0.8 : 0.6;
    var best = 0;
    var m = Math.floor((t - dly) / PULSE_PERIOD);
    for (var k = m - 1; k <= m; k++) {
      if (k < 0) continue;
      var age = t - (k * PULSE_PERIOD + dly);
      if (age >= 0) {
        var b = Math.exp(-age / tau);
        if (b > best) best = b;
      }
    }
    return best;
  }

  function isPhone() {
    try {
      var s = window.screen;
      if (s && Math.min(s.width, s.height) < 700) return true;
    } catch (e) {}
    return vh > vw * 1.15;
  }

  function circle(x, y, r, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // one faceted polyhedron: rotated silhouette split into facets radiating
  // from an offset inner point, alternating shade factors
  function drawNode(x, y, r, rot, type, glowRGB, b) {
    var i, pts = [];
    if (type === 1) { // octahedron: diamond
      var raw = [[0, -1], [0.78, 0], [0, 1], [-0.78, 0]];
      for (i = 0; i < 4; i++) {
        var ca = Math.cos(rot), sa = Math.sin(rot);
        pts.push([x + (raw[i][0] * ca - raw[i][1] * sa) * r, y + (raw[i][0] * sa + raw[i][1] * ca) * r]);
      }
      var cxp = x + Math.cos(rot) * r * 0.16, cyp = y + Math.sin(rot) * r * 0.16 - r * 0.10;
    } else { // tetrahedron: triangle
      var raw2 = [[0, -1], [0.90, 0.62], [-0.90, 0.62]];
      for (i = 0; i < 3; i++) {
        var ca2 = Math.cos(rot), sa2 = Math.sin(rot);
        pts.push([x + (raw2[i][0] * ca2 - raw2[i][1] * sa2) * r, y + (raw2[i][0] * sa2 + raw2[i][1] * ca2) * r]);
      }
      var cxp = x + Math.cos(rot) * r * 0.10, cyp = y + Math.sin(rot) * r * 0.10 + r * 0.12;
    }
    var shades = [1.12, 0.82, 1.0, 0.68];
    var glowMix = Math.min(1, b * 0.92);
    var baseArr = [
      BODY[0] + (glowRGB[0] - BODY[0]) * glowMix,
      BODY[1] + (glowRGB[1] - BODY[1]) * glowMix,
      BODY[2] + (glowRGB[2] - BODY[2]) * glowMix
    ];
    for (i = 0; i < pts.length; i++) {
      var p1 = pts[i], p2 = pts[(i + 1) % pts.length];
      var sf = shades[i];
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgb(' + Math.min(255, Math.round(baseArr[0] * sf)) + ',' +
                              Math.min(255, Math.round(baseArr[1] * sf)) + ',' +
                              Math.min(255, Math.round(baseArr[2] * sf)) + ')';
      ctx.beginPath();
      ctx.moveTo(cxp, cyp);
      ctx.lineTo(p1[0], p1[1]);
      ctx.lineTo(p2[0], p2[1]);
      ctx.closePath();
      ctx.fill();
    }
    // rim
    ctx.globalAlpha = 0.28 + 0.55 * b;
    ctx.strokeStyle = mixRGB([42, 52, 70], glowRGB, Math.min(1, b));
    ctx.lineWidth = Math.max(0.7, r * 0.07);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    if (!vw || !vh) return;
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';

    // volumetric dark
    ctx.fillStyle = '#05070D';
    ctx.fillRect(0, 0, vw, vh);

    // square stage, centered; page ground is the void color so it reads full-bleed
    var S = Math.min(vw, vh);
    var ox = (vw - S) / 2, oy = (vh - S) / 2;
    var phone = isPhone();

    // positions + brightness for this frame
    var pos = [], bri = [];
    var i, j;
    for (i = 0; i < N; i++) {
      pos.push(nodePos(nodes[i], t, S, ox, oy));
      bri.push(brightAt(delay[i], t, nodes[i].conductor));
    }

    // ---- connection lines (proximity edges, re-knit every frame) ----
    var threshPx = EDGE_THRESH * S;
    ctx.lineWidth = Math.max(0.7, S * 0.0012);
    var edges = [];
    for (i = 0; i < N; i++) {
      for (j = i + 1; j < N; j++) {
        var dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y;
        if (dx * dx + dy * dy < threshPx * threshPx) edges.push([i, j]);
      }
    }
    ctx.strokeStyle = EDGE;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    for (i = 0; i < edges.length; i++) {
      ctx.moveTo(pos[edges[i][0]].x, pos[edges[i][0]].y);
      ctx.lineTo(pos[edges[i][1]].x, pos[edges[i][1]].y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    // lit segments: the wavefront has crossed both endpoints (min brightness)
    ctx.strokeStyle = EDGE_LIT;
    for (i = 0; i < edges.length; i++) {
      var lb = Math.min(bri[edges[i][0]], bri[edges[i][1]]);
      if (lb > 0.06) {
        // draw per-edge to carry its own alpha
        ctx.globalAlpha = 0.8 * lb;
        ctx.beginPath();
        ctx.moveTo(pos[edges[i][0]].x, pos[edges[i][0]].y);
        ctx.lineTo(pos[edges[i][1]].x, pos[edges[i][1]].y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // ---- expanding rings from the conductor (latest two emissions) ----
    var cm = Math.floor(t / PULSE_PERIOD);
    for (var k = cm - 1; k <= cm; k++) {
      if (k < 0) continue;
      var age = t - k * PULSE_PERIOD;
      if (age < 0 || age > 3.2) continue;
      var rr = age * 0.20 * S;
      var fade = 1 - age / 3.2;
      ctx.globalAlpha = 0.42 * fade;
      ctx.strokeStyle = '#FF4FD8';
      ctx.lineWidth = Math.max(1, S * 0.0022);
      ctx.beginPath();
      ctx.arc(pos[0].x, pos[0].y, rr, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 0.16 * fade;
      ctx.strokeStyle = '#35E0FF';
      ctx.lineWidth = Math.max(1, S * 0.005);
      ctx.beginPath();
      ctx.arc(pos[0].x, pos[0].y, rr * 0.985, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // ---- nodes: halo first, then faceted body; conductor drawn last, on top ----
    var order = [];
    for (i = 1; i < N; i++) order.push(i);
    order.push(0);
    for (var oi = 0; oi < order.length; oi++) {
      i = order[oi];
      var n = nodes[i];
      var r = S * 0.0135 * n.z * (phone ? 1.15 : 1);
      var b = bri[i];
      var glow = n.conductor ? MAGENTA : CYAN;
      if (b > 0.12) {
        circle(pos[i].x, pos[i].y, r * 2.3, n.conductor ? '#FF4FD8' : '#35E0FF', b * 0.05);
        circle(pos[i].x, pos[i].y, r * 1.55, n.conductor ? '#FF4FD8' : '#35E0FF', b * 0.09);
      }
      var rot = n.rot0 + 0.35 * Math.sin((Math.PI * 2 / LOOP) * n.rotK * t + n.dph[0] * 3);
      drawNode(pos[i].x, pos[i].y, r, rot, n.type, glow, b);
    }

    // ---- edge fog: layered flat-alpha bands of #0A0F18 ----
    var bands = 4;
    for (var bi = 0; bi < bands; bi++) {
      var inset = (bi / bands) * S * 0.14;
      var bw = S * 0.14 / bands + 1;
      ctx.globalAlpha = 0.10 - bi * 0.02;
      ctx.fillStyle = '#0A0F18';
      ctx.fillRect(ox + inset, oy + inset, S - inset * 2, bw);                    // top
      ctx.fillRect(ox + inset, oy + S - inset - bw, S - inset * 2, bw);          // bottom
      ctx.fillRect(ox + inset, oy + inset, bw, S - inset * 2);                   // left
      ctx.fillRect(ox + S - inset - bw, oy + inset, bw, S - inset * 2);          // right
    }
    ctx.globalAlpha = 1;

    curT = t;
  }

  function resize() {
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    } else {
      vw = window.innerWidth;
      vh = window.innerHeight;
    }
    dpr = window.devicePixelRatio || 1;
    if (dpr > 2) dpr = 2;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(curT);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) window.addEventListener('resize', resize);

  resize();
  draw(PHASE);

  // motion loop: anchored at the fixed phase, elapsed time only
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var loop = function (now) {
      if (t0 === null) t0 = now;
      draw(PHASE + (now - t0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
