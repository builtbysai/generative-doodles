<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solterona</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EAD9A6; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict. Flat fills only, no gradients anywhere.
  var PINK = '#F2A7C3', TEAL = '#2E8B8B', SILVER = '#C9C9C9',
      SAND = '#EAD9A6', GREY = '#6A6A6A', INK = '#141414';

  var PHASE0 = 1.1; // constant first-frame phase

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var seedRnd = mulberry32(568068);
  // stable per-element jitter, independent of frame count
  function jit(id, i) {
    var x = Math.sin(id * 127.1 + i * 311.7) * 43758.5453;
    return (x - Math.floor(x)) * 2 - 1;
  }

  // ---------------- state ----------------
  var cur = 0;              // 0 = caption card, 1..5 = panels
  var transT = -100;        // sim-time of last advance
  var muted = [false, false]; // panel 2 podcast quote bubbles
  var SUN_HOME = 235, SUN_LOW = 470;
  var sunDragY = SUN_HOME;  // panel 5 sun position while solving/dragging
  var sunDrag = null;       // { dy: grab offset } while dragging the sun
  var rising = false, riseFrom = SUN_HOME, riseT = 0; // panel 1 sun rising back
  var pDown = null;         // pointer-down record
  var simT = PHASE0;

  // ---------------- copy ----------------
  // Card 0 verbatim from the prompt (TF8 caption card).
  var CAPTION = 'Socorro 🗿▪️▪️▪️▪️▪️🔫👀 #stoppodcast #auntie';
  // Panel 2: the podcast quote exists in the prompt only as a paraphrase
  // ("women over 30 have no dating options"); worded here, listed in process.md.
  var QUOTE_A = 'Pasados los treinta, una mujer ya no tiene opciones para ligar.';
  var QUOTE_B = 'Ninguna. Cero opciones. Que se haga a la idea.';
  var CHILD_Q = 'Tía, ¿tú estás de acuerdo?';
  // Panels 3-4: her internal monologue, written for this piece (process.md).
  var MONO_3 = ['Están en todas partes. Siempre están.', 'Su cortejo se sueña como una pesadilla.'];
  var MONO_4 = ['A veces la única respuesta es el silencio.', 'Un silencio incómodo. Y mío.'];
  // Panels 3-4: the men's quotes crowding the margins.
  var QUOTES_3 = [
    { text: '¿Y no te sientes sola?', muted: false },
    { text: 'A tu edad ya no se puede elegir.', muted: false },
    { text: '¿Ni un novio? ¿En serio?', muted: false },
    { text: 'Todavía estás a tiempo.', muted: true }
  ];
  var QUOTES_4 = [
    { text: 'El reloj biológico no perdona.', muted: true },
    { text: 'Alguien habrá, mujer.', muted: true },
    { text: 'Se te va a pasar el arroz.', muted: false },
    { text: 'Piénsatelo, que luego...', muted: true }
  ];

  // ---------------- text helpers ----------------
  function wrap(text, maxW) {
    var words = text.split(' '), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }
  function drawLines(lines, cx, cy, lh) {
    for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], cx, cy + i * lh);
  }

  // wobbly hand-drawn rectangle path
  function wobRect(x, y, w, h, id, amt) {
    var pts = [], N = 5, i, t;
    for (i = 0; i <= N; i++) { t = i / N; pts.push([x + t * w + jit(id, i) * amt, y + jit(id, 20 + i) * amt]); }
    for (i = 1; i <= N; i++) { t = i / N; pts.push([x + w + jit(id, 40 + i) * amt, y + t * h + jit(id, 60 + i) * amt]); }
    for (i = 1; i <= N; i++) { t = i / N; pts.push([x + (1 - t) * w + jit(id, 80 + i) * amt, y + h + jit(id, 100 + i) * amt]); }
    for (i = 1; i < N; i++) { t = i / N; pts.push([x + jit(id, 120 + i) * amt, y + (1 - t) * h + jit(id, 140 + i) * amt]); }
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r); ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h); ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function limb(x1, y1, x2, y2, wOut, wIn, inner) {
    ctx.strokeStyle = INK; ctx.lineWidth = wOut; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = inner; ctx.lineWidth = wIn;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  // plain wobbly speech box (fill + ink outline), optional tail to (tx,ty)
  function speechBox(x, y, w, h, id, fill, tail) {
    if (tail) {
      ctx.beginPath();
      ctx.moveTo(tail[0] - 14, tail[1]);
      ctx.lineTo(tail[2], tail[3]);
      ctx.lineTo(tail[0] + 14, tail[1]);
      ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
    }
    wobRect(x, y, w, h, id, 2.4);
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
    if (tail) { // erase the tail seam where it meets the box
      ctx.fillStyle = fill;
      ctx.fillRect(tail[0] - 13, tail[1] - 4, 26, 8);
    }
  }
  function boxText(text, x, y, w, h, fontPx, color, align) {
    ctx.font = '700 ' + fontPx + 'px "Helvetica Neue", Arial, sans-serif';
    var lines = wrap(text, w - 30);
    ctx.fillStyle = color;
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    var cx = (align === 'left') ? x + 15 : (align === 'right') ? x + w - 15 : x + w / 2;
    var lh = fontPx * 1.24;
    drawLines(lines, cx, y + h / 2 - (lines.length - 1) * lh / 2, lh);
    return lines.length;
  }
  // small muted-speaker mark: speaker wedge + X, drawn in INK
  function muteMark(x, y) {
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(x, y - 5); ctx.lineTo(x + 7, y - 5); ctx.lineTo(x + 13, y - 12);
    ctx.lineTo(x + 13, y + 12); ctx.lineTo(x + 7, y + 5); ctx.lineTo(x, y + 5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + 19, y - 7); ctx.lineTo(x + 29, y + 7);
    ctx.moveTo(x + 29, y - 7); ctx.lineTo(x + 19, y + 7);
    ctx.stroke();
  }

  // ---------------- the aunt ----------------
  // Face features on a SAND disc centred (cx,cy) radius r. eyesOpen=false -> closed arcs.
  function auntFace(cx, cy, r, eyesOpen, look) {
    // silver hair mass behind the face
    ctx.beginPath(); ctx.arc(cx, cy - r * 0.10, r * 1.10, 0, Math.PI * 2);
    ctx.fillStyle = SILVER; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    // bun
    ctx.beginPath(); ctx.arc(cx + r * 0.82, cy - r * 1.02, r * 0.30, 0, Math.PI * 2);
    ctx.fillStyle = SILVER; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    // face
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = SAND; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    // hairline sweep
    ctx.beginPath(); ctx.arc(cx, cy - r * 0.16, r * 0.94, Math.PI * 1.12, Math.PI * 1.88);
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
    var ex = r * 0.36, ey = cy - r * 0.02, lx = (look || 0) * r * 0.08;
    ctx.strokeStyle = INK; ctx.lineCap = 'round';
    if (eyesOpen) {
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(cx - ex + lx, ey, r * 0.055, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + ex + lx, ey, r * 0.055, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(cx - ex - r * 0.13, ey - r * 0.16); ctx.lineTo(cx - ex + r * 0.13, ey - r * 0.16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + ex - r * 0.13, ey - r * 0.16); ctx.lineTo(cx + ex + r * 0.13, ey - r * 0.16); ctx.stroke();
    } else {
      ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.arc(cx - ex, ey - r * 0.05, r * 0.11, Math.PI * 0.08, Math.PI * 0.92); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + ex, ey - r * 0.05, r * 0.11, Math.PI * 0.08, Math.PI * 0.92); ctx.stroke();
    }
    // nose + one straight mouth: calm, never a smile
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx + lx * 0.5, cy + r * 0.16); ctx.lineTo(cx - r * 0.03 + lx * 0.5, cy + r * 0.30); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(cx - r * 0.20, cy + r * 0.52); ctx.lineTo(cx + r * 0.20, cy + r * 0.52); ctx.stroke();
  }

  // ---------------- scenes (design space 1000x1000) ----------------
  var FX = 30, FY = 30, FW = 940, FH = 940; // frame

  function frame(id) {
    wobRect(FX, FY, FW, FH, id, 3.2);
    ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
  }
  function clipFrame() {
    ctx.save();
    ctx.beginPath(); ctx.rect(FX + 5, FY + 5, FW - 10, FH - 10); ctx.clip();
  }

  function drawCard0(p) {
    clipFrame();
    ctx.fillStyle = SAND; ctx.fillRect(0, 0, 1000, 1000);
    ctx.save();
    ctx.globalAlpha = 0.3 + 0.7 * p;
    ctx.translate((1 - p) * 26, 0);
    ctx.fillStyle = INK;
    ctx.font = '900 55px "Arial Black", "Helvetica Neue", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var lines = wrap(CAPTION, 800);
    drawLines(lines, 500, 500 - (lines.length - 1) * 41, 82);
    ctx.restore();
    ctx.restore();
    frame(900);
  }

  // Panels 1 & 5 share one beach framing. sunY in design units.
  function drawBeach(t, eyesOpen, sunY) {
    clipFrame();
    // sunset in FLAT bands (no gradients, house rule): pink sky, sand band, teal sea, sand shore
    ctx.fillStyle = PINK; ctx.fillRect(0, 0, 1000, 332);
    ctx.fillStyle = SAND; ctx.fillRect(0, 332, 1000, 140);
    // the sun: sand disc, ink ring, short ink rays
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
    var i, a;
    for (i = 0; i < 8; i++) {
      a = i / 8 * Math.PI * 2 + 0.2;
      ctx.beginPath();
      ctx.moveTo(690 + Math.cos(a) * 70, sunY + Math.sin(a) * 70);
      ctx.lineTo(690 + Math.cos(a) * 86, sunY + Math.sin(a) * 86);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(690, sunY, 58, 0, Math.PI * 2);
    ctx.fillStyle = SAND; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
    // two small ink birds
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(196, 178, 15, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(226, 178, 15, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(292, 138, 11, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(314, 138, 11, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    // sea, wavy top edge
    ctx.beginPath();
    ctx.moveTo(0, 660);
    for (i = 0; i <= 10; i++) ctx.lineTo(i * 100, 472 + jit(31, i) * 7);
    ctx.lineTo(1000, 660); ctx.closePath();
    ctx.fillStyle = TEAL; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 4.5;
    ctx.beginPath();
    for (i = 0; i <= 10; i++) { var px = i * 100, py = 472 + jit(31, i) * 7; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
    ctx.stroke();
    // sea creature, bobbing gently on the shared clock
    var bob = Math.sin(t * 2 * Math.PI / 9) * 5;
    ctx.beginPath(); ctx.arc(240, 528 + bob, 41, Math.PI, 0); ctx.closePath();
    ctx.fillStyle = SAND; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    ctx.fillStyle = INK;
    var clook = eyesOpen ? 0 : 5; // panel 5: it watches her, and waits
    ctx.beginPath(); ctx.arc(226 + clook, 512 + bob, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(254 + clook, 512 + bob, 4.5, 0, Math.PI * 2); ctx.fill();
    if (eyesOpen) { // the shout, panel 1 only
      ctx.beginPath(); ctx.arc(240, 528 + bob, 8, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(232, 530 + bob); ctx.lineTo(248, 530 + bob); ctx.stroke();
    }
    // splash arcs where it breaks the surface
    ctx.strokeStyle = SAND; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(196, 540 + bob * 0.4, 13, Math.PI * 1.1, Math.PI * 1.7); ctx.stroke();
    ctx.beginPath(); ctx.arc(284, 540 + bob * 0.4, 13, Math.PI * 1.3, Math.PI * 1.9); ctx.stroke();
    if (eyesOpen) { // panel 1 speech: "¡TÍA!"
      speechBox(318, 356, 196, 96, 77, SAND, [356, 452, 268, 522 + bob]);
      ctx.fillStyle = INK;
      ctx.font = '900 46px "Arial Black", "Helvetica Neue", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('¡TÍA!', 416, 406);
    }
    // shore
    ctx.fillStyle = SAND; ctx.fillRect(0, 660, 1000, 340);
    ctx.strokeStyle = INK; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(0, 660); ctx.lineTo(1000, 660); ctx.stroke();
    ctx.fillStyle = INK; ctx.globalAlpha = 0.22;
    for (i = 0; i < 42; i++) {
      var sx = 40 + ((jit(41, i) + 1) / 2) * 920, sy = 690 + ((jit(43, i) + 1) / 2) * 270;
      ctx.beginPath(); ctx.arc(sx, sy, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // her towel
    wobRect(540, 748, 392, 152, 55, 3);
    ctx.fillStyle = PINK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    // reclining aunt: legs stretched along the towel, torso leaning back
    limb(782, 806, 902, 848, 25, 15, SAND);
    limb(766, 830, 876, 872, 25, 15, SAND);
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(912, 852, 16, 9, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(886, 876, 16, 9, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(606, 752); ctx.lineTo(706, 734); ctx.lineTo(806, 792);
    ctx.lineTo(798, 852); ctx.lineTo(646, 852); ctx.lineTo(600, 796);
    ctx.closePath();
    ctx.fillStyle = PINK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    limb(628, 752, 584, 706, 23, 13, SAND); // one arm resting behind her head
    limb(706, 782, 762, 838, 23, 13, SAND);
    auntFace(642, 712, 43, eyesOpen, eyesOpen ? -1 : 0);
    ctx.restore();
    frame(eyesOpen ? 901 : 905);
  }

  // panel 2 quote bubble rects, shared by draw + hit test
  var QB = [
    { x: 60, y: 56, w: 480, h: 128 },
    { x: 566, y: 56, w: 374, h: 128 }
  ];
  function drawPanel2() {
    clipFrame();
    ctx.fillStyle = PINK; ctx.fillRect(0, 0, 1000, 1000);   // interior wall
    ctx.fillStyle = SAND; ctx.fillRect(0, 762, 1000, 238); // floor
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, 762); ctx.lineTo(1000, 762); ctx.stroke();
    // podcast table + two bros
    var bros = [300, 700], bi;
    for (bi = 0; bi < 2; bi++) {
      var bx = bros[bi];
      ctx.beginPath();
      ctx.moveTo(bx - 62, 336); ctx.lineTo(bx + 62, 336); ctx.lineTo(bx + 46, 262); ctx.lineTo(bx - 46, 262);
      ctx.closePath();
      ctx.fillStyle = GREY; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
      ctx.beginPath(); ctx.arc(bx, 218, 35, 0, Math.PI * 2);
      ctx.fillStyle = SAND; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(bx, 206, 36, Math.PI * 1.02, Math.PI * 1.98); // grey cap
      ctx.closePath(); ctx.fillStyle = GREY; ctx.fill(); ctx.stroke();
      ctx.fillStyle = INK; // headphones
      ctx.fillRect(bx - 44, 200, 13, 34); ctx.fillRect(bx + 31, 200, 13, 34);
      ctx.beginPath(); ctx.arc(bx - 9, 226, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(bx + 9, 226, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(bx - 12, 248, 24, 4.5);
    }
    // microphone between them
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(500, 336); ctx.lineTo(500, 268); ctx.stroke();
    ctx.save(); ctx.translate(500, 238); ctx.rotate(0.18);
    rr(-17, -30, 34, 60, 16);
    ctx.fillStyle = GREY; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-17, -10); ctx.lineTo(17, -10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-17, 4); ctx.lineTo(17, 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-17, 18); ctx.lineTo(17, 18); ctx.stroke();
    ctx.restore();
    // table
    ctx.fillStyle = INK; ctx.fillRect(96, 330, 808, 26);
    ctx.fillRect(120, 356, 18, 66); ctx.fillRect(862, 356, 18, 66);
    // the two quote bubbles (tappable to mute)
    var quotes = [QUOTE_A, QUOTE_B];
    for (bi = 0; bi < 2; bi++) {
      var q = QB[bi], m = muted[bi];
      speechBox(q.x, q.y, q.w, q.h, 210 + bi, m ? GREY : SAND, [bros[bi], q.y + q.h, bros[bi] - 6, 196]);
      boxText(quotes[bi], q.x, q.y, q.w, q.h, 26, m ? SILVER : INK, 'center');
      if (m) muteMark(q.x + q.w - 46, q.y + q.h - 22);
    }
    // the child, relaying it
    ctx.beginPath();
    ctx.moveTo(224, 792); ctx.lineTo(290, 792); ctx.lineTo(282, 690); ctx.lineTo(232, 690);
    ctx.closePath();
    ctx.fillStyle = TEAL; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath(); ctx.arc(257, 652, 28, 0, Math.PI * 2);
    ctx.fillStyle = SAND; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(257, 644, 29, Math.PI * 1.05, Math.PI * 1.95);
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(248, 654, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(266, 654, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(248, 668, 18, 3.6);
    limb(284, 716, 330, 686, 19, 10, SAND); // small arm raised toward the aunt
    speechBox(92, 452, 356, 104, 220, SAND, [250, 556, 254, 620]);
    boxText(CHILD_Q, 92, 452, 356, 104, 27, INK, 'center');
    // the aunt, seated, silent: her presence is the whole rebuttal (no bubble)
    rr(606, 462, 308, 318, 26); // teal armchair
    ctx.fillStyle = TEAL; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5.5; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(700, 616); ctx.lineTo(820, 616); ctx.lineTo(848, 762); ctx.lineTo(672, 762);
    ctx.closePath();
    ctx.fillStyle = PINK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    limb(716, 752, 706, 838, 24, 14, SAND);
    limb(804, 752, 814, 838, 24, 14, SAND);
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(704, 846, 17, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(816, 846, 17, 9, 0, 0, Math.PI * 2); ctx.fill();
    limb(690, 640, 640, 706, 23, 13, SAND);
    limb(830, 640, 880, 706, 23, 13, SAND);
    auntFace(760, 566, 47, true, -1);
    ctx.restore();
    frame(902);
  }

  function quoteTag(q, x, y, w, id) {
    speechBox(x, y, w, 88, id, q.muted ? GREY : SAND, null);
    boxText(q.text, x, y, w, 88, 22, q.muted ? SILVER : GREY, 'center');
    if (q.muted) muteMark(x + w - 46, y + 88 - 20);
  }
  function drawFacePanel(which) {
    var is3 = which === 3;
    var quotes = is3 ? QUOTES_3 : QUOTES_4;
    var mono = is3 ? MONO_3 : MONO_4;
    clipFrame();
    ctx.fillStyle = is3 ? PINK : TEAL; ctx.fillRect(0, 0, 1000, 1000);
    ctx.fillStyle = is3 ? TEAL : PINK; ctx.fillRect(0, 402, 1000, 236);
    // her face, large and still at centre (breathing only, on the shared clock)
    var br = 1 + Math.sin(simT * 2 * Math.PI / 6) * 0.004;
    ctx.save();
    ctx.translate(500, 505); ctx.scale(br, br); ctx.translate(-500, -505);
    ctx.beginPath();
    ctx.moveTo(238, 968); ctx.quadraticCurveTo(500, 800, 762, 968); ctx.closePath();
    ctx.fillStyle = PINK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    auntFace(500, 498, 178, true, 0);
    ctx.restore();
    // the men's quotes crowd the four corners, small and grey
    quoteTag(quotes[0], 52, 58, 300, 310 + which);
    quoteTag(quotes[1], 648, 58, 300, 320 + which);
    quoteTag(quotes[2], 52, 810, 300, 330 + which);
    quoteTag(quotes[3], 648, 810, 300, 340 + which);
    // her monologue, quiet ink italics at the side margins
    ctx.fillStyle = INK; ctx.globalAlpha = 0.88;
    ctx.font = 'italic 700 27px "Helvetica Neue", Arial, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    var l1 = wrap(mono[0], 196);
    drawLines(l1, 58, 452 - (l1.length - 1) * 17, 34);
    ctx.textAlign = 'right';
    var l2 = wrap(mono[1], 196);
    drawLines(l2, 942, 560 - (l2.length - 1) * 17, 34);
    ctx.globalAlpha = 1;
    ctx.restore();
    frame(900 + which);
  }

  // ---------------- main draw ----------------
  var VW = 0, VH = 0, S = 0, OX = 0, OY = 0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return VH > VW * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    VW = vv ? vv.width : window.innerWidth;
    VH = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(VW * dpr);
    canvas.height = Math.round(VH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) { S = VW; OX = 0; OY = (VH - S) / 2; }
    else { S = Math.min(VW, VH); OX = (VW - S) / 2; OY = (VH - S) / 2; }
    draw(simT);
  }

  function ease(t) { return t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t); }

  function panelSunY(t) {
    if (cur === 5) return sunDragY;
    if (cur === 1) {
      if (rising) {
        var k = (t - riseT) / 6;
        if (k >= 1) { rising = false; return SUN_HOME; }
        return riseFrom + (SUN_HOME - riseFrom) * ease(k);
      }
      return SUN_HOME;
    }
    return SUN_HOME;
  }

  function draw(t) {
    canvas.style.width = VW + 'px';
    canvas.style.height = VH + 'px';
    ctx.fillStyle = SAND;
    ctx.fillRect(0, 0, VW, VH);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1000, S / 1000);
    ctx.lineJoin = 'round';

    var p = ease((t - transT) / 0.28); // entry progress of the current state
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.65 * p;
    ctx.translate((1 - p) * 20, 0);
    if (cur === 0) drawCard0(1);
    else if (cur === 1) drawBeach(t, true, panelSunY(t));
    else if (cur === 2) drawPanel2();
    else if (cur === 3) drawFacePanel(3);
    else if (cur === 4) drawFacePanel(4);
    else if (cur === 5) drawBeach(t, false, panelSunY(t));
    ctx.restore();

    // panel counter: a small sand tag inside the bottom-left of the frame
    if (cur >= 1) {
      ctx.fillStyle = SAND;
      rr(48, 908, 108, 40, 10); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
      ctx.fillStyle = INK;
      ctx.font = '700 24px "Helvetica Neue", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(cur + ' / 5', 102, 929);
    }
    // hint inside the bottom-right of the frame
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = INK;
    ctx.font = '700 23px "Helvetica Neue", sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(cur === 5 ? 'drag' : 'tap', 944, 934);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------------- interaction ----------------
  function advance() {
    cur = (cur + 1) % 6;
    transT = simT;
    rising = false;
    if (cur === 5) sunDragY = SUN_HOME; // the final beach always opens at the high sun
    draw(simT);
  }
  function loopToPanel1() {
    cur = 1;
    transT = simT;
    rising = true;
    riseFrom = sunDragY;
    riseT = simT;
    draw(simT);
  }
  function toStage(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX - rect.left - OX) / S * 1000, y: (e.clientY - rect.top - OY) / S * 1000 };
  }
  function onDown(e) {
    var pt = toStage(e);
    pDown = { x: pt.x, y: pt.y, moved: false };
    if (cur === 5) {
      var dx = pt.x - 690, dy = pt.y - sunDragY;
      if (dx * dx + dy * dy < 120 * 120) sunDrag = { dy: pt.y - sunDragY };
    }
  }
  function onMove(e) {
    if (!pDown) return;
    var pt = toStage(e);
    if (Math.abs(pt.x - pDown.x) > 10 || Math.abs(pt.y - pDown.y) > 10) pDown.moved = true;
    if (sunDrag) {
      sunDragY = Math.max(SUN_HOME - 10, Math.min(SUN_LOW, pt.y - sunDrag.dy));
      draw(simT);
    }
  }
  function onUp(e) {
    if (!pDown) return;
    var pt = toStage(e);
    var wasDrag = pDown.moved;
    pDown = null;
    if (sunDrag) {
      var pulled = sunDragY;
      sunDrag = null;
      if (pulled >= 440) { loopToPanel1(); return; } // dragged down: the sunset loops
      draw(simT);
      return;
    }
    if (wasDrag) return;
    // panel 2: a tap on a podcast quote mutes it instead of advancing
    if (cur === 2) {
      for (var i = 0; i < 2; i++) {
        var q = QB[i];
        if (pt.x >= q.x && pt.x <= q.x + q.w && pt.y >= q.y && pt.y <= q.y + q.h) {
          muted[i] = !muted[i];
          draw(simT);
          return;
        }
      }
    }
    advance();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { pDown = null; sunDrag = null; });
  }

  // ---------------- loop ----------------
  var startStamp = null;
  function frameLoop(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frameLoop);
  }
  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize(); // draws frame one synchronously at PHASE0
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
