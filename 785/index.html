<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Tool</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #D8D4CC; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // No.785 "Visual Tool" - EXPANSION #96 daniel-buren, PP2.
  // A plain neutral room. A wide band of Buren stripes (white + vermilion,
  // 8.7cm-ratio module: 17 stripe pairs across the frame width) sweeps
  // left to right. Wherever the band overlaps a room edge, the edge
  // ignites white; after the band passes, the edge keeps a ~6 s decay
  // tail, then forgets. Watch-only. Everything is a closed-form function
  // of the 45 s loop phase: no state, no clock reads, no randomness.

  var ROOM = "#D8D4CC";
  var FLOOR = "#C4BFB2";
  var GLOW = "#FFFFFF";
  var SWHITE = "#F6F3EC";
  var VERM = "#C8102E";

  var LOOP = 45;          // full loop, seconds
  var PASS = 30;          // band crossing time, seconds
  var DECAY_TAU = 2.0;    // exp decay: ~5% left at 6 s
  var PAIRS_ACROSS = 17;  // 8.7cm module: stripe pairs across frame width
  var BAND_PAIRS = 4;     // the band is 4 pairs wide

  var pairFrac = 1 / PAIRS_ACROSS;            // one stripe pair, fraction of W
  var bandFrac = BAND_PAIRS * pairFrac;       // band width, fraction of W
  var speed = (1 + bandFrac) / PASS;          // leading-edge speed, frac of W per s
  var LEAD = (2 * pairFrac) / speed;          // at t=0 the leading edge is two pairs in

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1, phone = false;

  // ---- Room geometry (fractions of W / H) --------------------------------
  // Corner vertical at x=0.60; ceiling and floor lines run from the frame
  // edges to the corner; one doorway quad on the right wall, feet on the
  // floor line. Edges are polylines, subdivided into short segments so
  // ignition can be computed per segment from the segment's x position.
  var CT = [0.60, 0.10], CB = [0.60, 0.76];
  var FLOOR_POLY = [[0, 0.815], CB, [1, 0.865], [1, 1], [0, 1]];
  var EDGE_LINES = [
    [[0, 0.185], CT],                 // ceiling, left wall
    [CT, [1, 0.225]],                 // ceiling, right wall
    [CT, CB],                         // corner
    [[0, 0.815], CB],                 // floor line, left
    [CB, [1, 0.865]],                 // floor line, right
    [[0.775, 0.330], [0.905, 0.365]], // doorway top
    [[0.905, 0.365], [0.905, 0.840]], // doorway right
    [[0.905, 0.840], [0.775, 0.806]], // doorway bottom (on the floor line)
    [[0.775, 0.806], [0.775, 0.330]]  // doorway left
  ];

  var segments = [];
  (function buildSegments() {
    var MAXLEN = 0.02;
    for (var i = 0; i < EDGE_LINES.length; i++) {
      var a = EDGE_LINES[i][0], b = EDGE_LINES[i][1];
      var dx = b[0] - a[0], dy = b[1] - a[1];
      var len = Math.sqrt(dx * dx + dy * dy);
      var n = Math.max(1, Math.ceil(len / MAXLEN));
      for (var k = 0; k < n; k++) {
        var t0 = k / n, t1 = (k + 1) / n;
        var x0 = a[0] + dx * t0, y0 = a[1] + dy * t0;
        var x1 = a[0] + dx * t1, y1 = a[1] + dy * t1;
        segments.push({
          x0: x0, y0: y0, x1: x1, y1: y1,
          mx: (x0 + x1) / 2,
          xa: Math.min(x0, x1), xb: Math.max(x0, x1)
        });
      }
    }
  })();

  // Fraction of a segment's x-extent covered by the band interval [lo, hi].
  // A zero-width (vertical) segment counts as covered if its x is inside.
  function overlapFrac(seg, lo, hi) {
    var w = seg.xb - seg.xa;
    if (w < 1e-9) return (seg.mx >= lo && seg.mx <= hi) ? 1 : 0;
    var o = Math.min(seg.xb, hi) - Math.max(seg.xa, lo);
    if (o <= 0) return 0;
    return Math.min(1, o / w);
  }

  // Brightness of one segment at loop time tc. Closed form:
  // the band's leading edge reaches the segment midpoint at sIn and its
  // trailing edge passes it at sOut (pass-clock u = tc + LEAD). While
  // covered, brightness = quick attack ramp x covered fraction. After
  // sOut it decays exponentially from the coverage value at sOut. Before
  // sIn only the previous cycle's tail can remain (negligible by design).
  function segBrightness(seg, tc) {
    var u = tc + LEAD;
    var sIn = seg.mx / speed;
    var sOut = (seg.mx + bandFrac) / speed;
    var b = 0;
    if (u >= sIn && u <= sOut) {
      var E = speed * u;
      var attack = Math.min(1, (u - sIn) / 0.5);
      b = attack * overlapFrac(seg, E - bandFrac, E);
    } else if (u > sOut) {
      var d0 = overlapFrac(seg, seg.mx, seg.mx + bandFrac);
      b = d0 * Math.exp(-(u - sOut) / DECAY_TAU);
    } else {
      var dt = (u + LOOP) - sOut;
      if (dt < 12) {
        var d1 = overlapFrac(seg, seg.mx, seg.mx + bandFrac);
        b = d1 * Math.exp(-dt / DECAY_TAU);
      }
    }
    return b < 0.004 ? 0 : b;
  }

  function measure() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    W = Math.round(vv ? vv.width : (window.innerWidth || 800));
    H = Math.round(vv ? vv.height : (window.innerHeight || 600));
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    var sw = (typeof window !== "undefined" && window.screen) ? window.screen : null;
    if (sw && sw.width && sw.height) {
      phone = Math.min(sw.width, sw.height) < 700;
    } else {
      phone = H > W * 1.15;
    }
  }

  function draw(t) {
    var tc = ((t % LOOP) + LOOP) % LOOP;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Page ground and walls: one flat room tone, floor plane below its line.
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = FLOOR;
    ctx.beginPath();
    for (var i = 0; i < FLOOR_POLY.length; i++) {
      var px = FLOOR_POLY[i][0] * W, py = FLOOR_POLY[i][1] * H;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // The stripe band. Pass-clock u runs ahead of tc by LEAD; the band is
    // on frame while its interval intersects [0, 1] in x.
    var u = tc + LEAD;
    var E = speed * u;                    // leading edge, fraction of W
    var bandLo = E - bandFrac, bandHi = E;
    if (bandHi > 0 && bandLo < 1) {
      var stripeW = (pairFrac / 2) * W;
      var xStart = bandLo * W, xEnd = bandHi * W;
      ctx.save();
      ctx.beginPath();
      ctx.rect(Math.max(0, xStart), 0, Math.min(W, xEnd) - Math.max(0, xStart), H);
      ctx.clip();
      // Stripes anchored to the band's own left edge: they travel with it.
      var firstStripe = Math.floor(xStart / stripeW);
      for (var s = firstStripe; s * stripeW < xEnd; s++) {
        ctx.fillStyle = (s % 2 === 0) ? SWHITE : VERM;
        ctx.fillRect(s * stripeW, 0, stripeW + 1, H);
      }
      ctx.restore();
    }

    // Base edges: quiet 1px lines in the floor tone over everything.
    ctx.strokeStyle = FLOOR;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1;
    ctx.lineCap = "round";
    ctx.beginPath();
    for (var j = 0; j < segments.length; j++) {
      var sg = segments[j];
      ctx.moveTo(sg.x0 * W, sg.y0 * H);
      ctx.lineTo(sg.x1 * W, sg.y1 * H);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Ignited edges: three layered white passes, alpha from brightness.
    var passes = phone
      ? [[5.5, 0.16], [2.8, 0.32], [1.4, 0.85]]
      : [[7, 0.16], [3.5, 0.32], [1.6, 0.85]];
    ctx.strokeStyle = GLOW;
    for (var p = 0; p < passes.length; p++) {
      ctx.lineWidth = passes[p][0];
      for (var q = 0; q < segments.length; q++) {
        var s2 = segments[q];
        var b = segBrightness(s2, tc);
        if (b <= 0) continue;
        ctx.globalAlpha = passes[p][1] * b;
        ctx.beginPath();
        ctx.moveTo(s2.x0 * W, s2.y0 * H);
        ctx.lineTo(s2.x1 * W, s2.y1 * H);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  measure();

  // QA hook: only when there is no rAF (headless renderer), an optional
  // ?seed=tNN in the URL selects the loop time of the single frame.
  var hasRAF = (typeof requestAnimationFrame === "function");
  var t0 = 0;
  if (!hasRAF) {
    var seedT = 0;
    if (typeof location !== "undefined" && location.search) {
      var m = /seed=t([0-9.]+)/.exec(location.search);
      if (m) seedT = parseFloat(m[1]);
    }
    draw(seedT);
  } else {
    draw(0);
    var tick = function (ts) {
      if (!t0) t0 = ts;
      draw((ts - t0) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  var onResize = function () { measure(); if (!hasRAF) draw(0); };
  if (typeof window !== "undefined" && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", onResize);
  }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("resize", onResize);
  }
})();
</script>
</body>
</html>
