<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rampaging Ring</title>
<style>
html, body { margin: 0; padding: 0; background: #0d0d0d; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = [13, 13, 13];
var MAGENTA = [224, 64, 224];
var NSEG = 144;
var SEED = 1554000;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(SEED);
// Seeded noise lattice (1-D value noise over segment index + drift).
var LATTICE = [];
for (var li = 0; li < 512; li++) LATTICE.push(rng() * 2 - 1);
function noise1(u) {
  var i = Math.floor(u);
  var f = u - i;
  var a = LATTICE[((i % 512) + 512) % 512];
  var b = LATTICE[(((i + 1) % 512) + 512) % 512];
  var s = f * f * (3 - 2 * f);
  return a + (b - a) * s;
}
// Seeded spike-event schedule: events 4-9 s apart, seeded arc positions,
// each ~1.6 s long (grow, hold, collapse). First event at ~5 s so frame
// one is calm. Precomputed to 240 s; the schedule repeats every 240 s.
var EVENTS = [];
(function () {
  var t = 4 + rng() * 2;
  while (t < 240) {
    EVENTS.push({ start: t, dur: 1.4 + rng() * 0.5, arc: rng() * TAU, amp: 0.22 + rng() * 0.16 });
    t += 4 + rng() * 5;
  }
})();
function eventEnvelope(e, t) {
  var p = (t - e.start) / e.dur;
  if (p < 0 || p >= 1) return 0;
  if (p < 0.3) { var u = p / 0.3; return u * u * (3 - 2 * u); }
  if (p < 0.6) return 1;
  var v = (p - 0.6) / 0.4; return 1 - v * v * (3 - 2 * v);
}
function wrapAngle(a) {
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var drag = null; // { seg, target, releasedAt, releaseVal }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function ringGeom() {
  var minDim = Math.min(VW, VH);
  return { cx: VW / 2, cy: VH / 2, R: 0.30 * minDim };
}
// Spike height (outward offset, in px) for segment i at time t.
// Pure closed-form function of t plus the drag state.
function spikeAt(i, t, R) {
  var base = i / NSEG * TAU;
  // Slow-drifting noise: small between events, so the ring is almost calm.
  var n = noise1(i * 0.45 + t * 0.12);
  var h = R * 0.025 * (0.5 + 0.5 * n);
  // Seeded spike events.
  var te = t % 240;
  for (var k = 0; k < EVENTS.length; k++) {
    var e = EVENTS[k];
    var env = eventEnvelope(e, te);
    if (env > 0) {
      var d = wrapAngle(base - e.arc);
      var fall = Math.exp(-(d * d) / (2 * 0.14 * 0.14));
      // Per-segment jitter so individual segments spike at different
      // heights instead of one smooth bulge.
      var jit = 0.55 + 0.45 * noise1(i * 1.7 + 3.7 + t * 0.05);
      h += R * e.amp * env * fall * jit;
    }
  }
  // Drag pluck: nearest segment spikes toward the pointer while pressed,
  // then springs back into the noise rhythm on release.
  if (drag) {
    var dd = Math.abs(i - drag.seg);
    dd = Math.min(dd, NSEG - dd);
    var fall2 = Math.exp(-(dd * dd) / (2 * 2.0 * 2.0));
    var val;
    if (drag.releasedAt === null) {
      val = drag.target;
    } else {
      var dt = t - drag.releasedAt;
      val = drag.releaseVal * Math.exp(-dt / 0.35);
    }
    h = Math.max(h, val * fall2);
  }
  return h;
}
function stateAt(t) {
  var g = ringGeom();
  var rot = TAU * t / 120; // slow rotation, one turn per 120 s
  var spikes = [];
  var maxSpike = 0;
  for (var i = 0; i < NSEG; i++) {
    var s = spikeAt(i, t, g.R);
    spikes.push(s);
    if (s > maxSpike) maxSpike = s;
  }
  return { cx: g.cx, cy: g.cy, R: g.R, rot: rot, spikes: spikes, maxSpike: maxSpike, dragSeg: drag ? drag.seg : -1 };
}
function publishHook(st) {
  if (typeof window !== 'undefined') {
    window.__p1554 = {
      R: st.R, rot: st.rot, maxSpike: st.maxSpike,
      spikes: st.spikes.slice(), dragSeg: st.dragSeg
    };
  }
}
function draw(t) {
  lastT = t;
  size();
  var st = stateAt(t);
  ctx.fillStyle = rgb(GROUND);
  ctx.fillRect(0, 0, VW, VH);
  var minDim = Math.min(VW, VH);
  ctx.strokeStyle = rgb(MAGENTA);
  ctx.lineWidth = Math.max(1.5, 0.004 * minDim);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (var i = 0; i <= NSEG; i++) {
    var j = i % NSEG;
    var a = (j / NSEG) * TAU + st.rot;
    var r = st.R + st.spikes[j];
    var x = st.cx + r * Math.cos(a);
    var y = st.cy + r * Math.sin(a);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
  publishHook(st);
}
function pointerPos(e) {
  return { x: e.clientX, y: e.clientY };
}
function onDown(e) {
  var p = pointerPos(e);
  var g = ringGeom();
  var dx = p.x - g.cx, dy = p.y - g.cy;
  var pr = Math.sqrt(dx * dx + dy * dy);
  var st = stateAt(lastT);
  // Only grab when the pointer is near the ring band.
  if (Math.abs(pr - g.R) <= 0.30 * g.R + 12) {
    var ang = Math.atan2(dy, dx) - st.rot;
    var seg = Math.round(((ang % TAU) + TAU) % TAU / TAU * NSEG) % NSEG;
    var target = clamp(pr - g.R, 0, 0.45 * g.R);
    drag = { seg: seg, target: target, releasedAt: null, releaseVal: 0 };
  } else {
    drag = null;
  }
  publishHook(stateAt(lastT));
}
function onMove(e) {
  if (!drag || drag.releasedAt !== null) return;
  var p = pointerPos(e);
  var g = ringGeom();
  var dx = p.x - g.cx, dy = p.y - g.cy;
  var pr = Math.sqrt(dx * dx + dy * dy);
  drag.target = clamp(pr - g.R, 0, 0.45 * g.R);
  publishHook(stateAt(lastT));
}
function onUp(e) {
  if (drag) {
    drag.releasedAt = lastT;
    drag.releaseVal = drag.target;
  }
  drag = drag; // keep drag for spring-back decay; cleared by draw loop below
  publishHook(stateAt(lastT));
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  // Clear a fully decayed drag so later frames are pure noise again.
  if (drag && drag.releasedAt !== null && (t - drag.releasedAt) > 3) drag = null;
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
