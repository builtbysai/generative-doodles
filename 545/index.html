<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F0438F; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: seven colors, nothing else. Flat fills only, no gradients.
  var SKIN = '#FFD400', INK = '#111111', RED = '#D93A2B', TEAR = '#2AA5C4',
      GHOST = '#3FB3D9', LIPS = '#E23B2B', PINK = '#F0438F';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(545066);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---- stage geometry (1080 design space) ----
  var FACE = { cx: 540, cy: 600, rx: 330, ry: 470 };
  var EYE_L = { x: 420, y: 415 }, EYE_R = { x: 660, y: 415 };
  var LIP = { x: 540, y: 775 };

  function facePath() {
    ctx.beginPath();
    ctx.ellipse(FACE.cx, FACE.cy, FACE.rx, FACE.ry, 0, 0, Math.PI * 2);
  }

  // ---- ghosts: seeded freckle-drifters, rising inside the face ----
  var ghosts = [];
  for (var gi = 0; gi < 7; gi++) {
    ghosts.push({
      x: 350 + rng() * 380,          // kept over the face's middle band
      off: rng(),                    // phase offset along the rise cycle
      sway: 6 + rng() * 10,          // horizontal sway amplitude
      spd: 2 + (gi % 3)              // integer ratio speeds on the shared clock
    });
  }

  // ---- tears: seeded per-column droplet offsets ----
  var TEAR_TOP = 472, TEAR_BOT = 950, TEAR_PERIOD = 2.6, TEAR_N = 3;

  // ---- gaze state: occupants track the drag point with lag ----
  var gazeX = 0, gazeY = 0, tgtX = 0, tgtY = 0, dragging = false;

  // ---- animal occupants -------------------------------------------------
  function rabbit(cx, cy, gx, gy) {
    ctx.save();
    ctx.translate(cx + gx * 6, cy + gy * 4);
    ctx.rotate(gx * 0.05);
    ctx.lineWidth = 4.5; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
    // long ears
    [-1, 1].forEach(function (s) {
      ctx.save();
      ctx.translate(s * 21, -38);
      ctx.rotate(s * 0.13);
      ctx.beginPath(); ctx.ellipse(0, -52, 14, 54, 0, 0, Math.PI * 2);
      ctx.fillStyle = RED; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, -50, 6, 34, 0, 0, Math.PI * 2);
      ctx.fillStyle = PINK; ctx.fill();
      ctx.restore();
    });
    // head
    ctx.beginPath(); ctx.ellipse(0, 0, 55, 48, 0, 0, Math.PI * 2);
    ctx.fillStyle = RED; ctx.fill(); ctx.stroke();
    // pupils, shifted by gaze
    ctx.fillStyle = INK;
    [-20, 20].forEach(function (dx) {
      ctx.beginPath(); ctx.arc(dx + gx * 10, -5 + gy * 7, 6.5, 0, Math.PI * 2); ctx.fill();
    });
    // nose + mouth line
    ctx.beginPath(); ctx.moveTo(-5 + gx * 5, 16); ctx.lineTo(5 + gx * 5, 16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx * 5, 16); ctx.lineTo(gx * 5, 23); ctx.stroke();
    ctx.restore();
  }

  function horse(cx, cy, gx, gy) {
    ctx.save();
    ctx.translate(cx + gx * 6, cy + gy * 4);
    ctx.rotate(gx * 0.05);
    ctx.lineWidth = 4.5; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
    // ears
    [-1, 1].forEach(function (s) {
      ctx.beginPath();
      ctx.moveTo(s * 38, -34);
      ctx.lineTo(s * 26, -78);
      ctx.lineTo(s * 12, -40);
      ctx.closePath();
      ctx.fillStyle = RED; ctx.fill(); ctx.stroke();
    });
    // long frontal head, tapering to the muzzle
    ctx.beginPath();
    ctx.moveTo(-42, -48);
    ctx.quadraticCurveTo(0, -62, 42, -48);
    ctx.quadraticCurveTo(44, 6, 27, 52);
    ctx.quadraticCurveTo(20, 68, 0, 68);
    ctx.quadraticCurveTo(-20, 68, -27, 52);
    ctx.quadraticCurveTo(-44, 6, -42, -48);
    ctx.closePath();
    ctx.fillStyle = RED; ctx.fill(); ctx.stroke();
    // forelock tuft: one small filled blob between the ears
    ctx.beginPath();
    ctx.moveTo(-15, -50);
    ctx.quadraticCurveTo(0, -34, 15, -50);
    ctx.quadraticCurveTo(0, -44, -15, -50);
    ctx.closePath();
    ctx.fillStyle = INK; ctx.fill();
    // eyes, shifted by gaze
    ctx.fillStyle = INK;
    [-29, 29].forEach(function (dx) {
      ctx.beginPath(); ctx.arc(dx + gx * 9, -14 + gy * 7, 6.5, 0, Math.PI * 2); ctx.fill();
    });
    // muzzle band + nostrils
    ctx.beginPath(); ctx.ellipse(gx * 4, 46, 28, 15, 0, 0, Math.PI * 2);
    ctx.fillStyle = PINK; ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK;
    [-11, 11].forEach(function (dx) {
      ctx.beginPath(); ctx.arc(dx + gx * 4, 46, 3.6, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  function tearDrop(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y - r * 1.9);
    ctx.quadraticCurveTo(x + r * 1.05, y - r * 0.2, x + r * 0.78, y + r * 0.45);
    ctx.quadraticCurveTo(x + r * 0.4, y + r, x, y + r);
    ctx.quadraticCurveTo(x - r * 0.4, y + r, x - r * 0.78, y + r * 0.45);
    ctx.quadraticCurveTo(x - r * 1.05, y - r * 0.2, x, y - r * 1.9);
    ctx.closePath();
    ctx.fillStyle = TEAR; ctx.fill();
  }

  function ghostShape(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x - s * 0.5, y + s * 0.5);
    ctx.lineTo(x - s * 0.5, y - s * 0.05);
    ctx.quadraticCurveTo(x - s * 0.5, y - s * 0.55, x, y - s * 0.55);
    ctx.quadraticCurveTo(x + s * 0.5, y - s * 0.55, x + s * 0.5, y - s * 0.05);
    ctx.lineTo(x + s * 0.5, y + s * 0.5);
    for (var k = 0; k < 3; k++) {
      var x0 = x + s * 0.5 - (k + 0.5) * (s / 3);
      ctx.quadraticCurveTo(x0 - s / 6, y + s * 0.18, x0 - s / 3, y + s * 0.5);
    }
    ctx.closePath();
    ctx.fillStyle = GHOST; ctx.fill();
    ctx.fillStyle = INK;
    [-0.17, 0.17].forEach(function (d) {
      ctx.beginPath(); ctx.arc(x + d * s, y - s * 0.12, s * 0.075, 0, Math.PI * 2); ctx.fill();
    });
  }

  function satan(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = INK;
    // horns
    [-1, 1].forEach(function (s) {
      ctx.beginPath();
      ctx.moveTo(s * 9, -10);
      ctx.quadraticCurveTo(s * 20, -22, s * 17, -30);
      ctx.quadraticCurveTo(s * 11, -22, s * 5, -14);
      ctx.closePath(); ctx.fill();
    });
    // head
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 15, 0, 0, Math.PI * 2); ctx.fill();
    // eyes
    ctx.fillStyle = SKIN;
    [-6, 6].forEach(function (dx) {
      ctx.beginPath(); ctx.arc(dx, -2, 2.4, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  // ---- draw ---------------------------------------------------------------
  var PHASE0 = 7.3; // constant first-frame phase: tears mid-fall, ghosts spread

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PINK;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    // ground
    ctx.fillStyle = PINK;
    ctx.fillRect(0, 0, 1080, 1080);

    // hair: one big black mass, cropped by the top edge
    ctx.beginPath();
    ctx.ellipse(540, 470, 432, 545, 0, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();

    // face
    facePath();
    ctx.fillStyle = SKIN; ctx.fill();

    // bob side panels straddling the face edges, like strands of the bob
    [-1, 1].forEach(function (s) {
      ctx.beginPath();
      ctx.ellipse(540 + s * 303, 580, 40, 255, 0, 0, Math.PI * 2);
      ctx.fillStyle = INK; ctx.fill();
    });

    // ears, sticking out over the hair at the face's sides
    [-1, 1].forEach(function (s) {
      ctx.beginPath();
      ctx.ellipse(540 + s * 332, 630, 30, 47, 0, 0, Math.PI * 2);
      ctx.fillStyle = SKIN; ctx.fill();
      ctx.lineWidth = 4.5; ctx.strokeStyle = INK; ctx.stroke();
    });

    // bangs: black cap clipped to the face, fringe curving down at centre
    ctx.save();
    facePath(); ctx.clip();
    ctx.beginPath();
    ctx.moveTo(170, 90);
    ctx.lineTo(910, 90);
    ctx.lineTo(910, 295);
    ctx.quadraticCurveTo(540, 395, 170, 295);
    ctx.closePath();
    ctx.fillStyle = INK; ctx.fill();
    ctx.restore();

    // ghosts + tears, clipped to the face so they stay on the skin
    ctx.save();
    facePath(); ctx.clip();

    // ghosts drift upward on one shared clock (integer-ratio speeds)
    for (var i = 0; i < ghosts.length; i++) {
      var g = ghosts[i];
      var cyc = ((t * g.spd / 26) + g.off) % 1;
      var gy2 = 960 - cyc * 700;
      var gx2 = g.x + Math.sin(t * 0.7 + g.off * 6.28) * g.sway;
      ghostShape(gx2, gy2, 38);
    }

    // tears: droplet columns under both eye slots, flat splash at the chin
    [EYE_L.x, EYE_R.x].forEach(function (tx) {
      for (var d = 0; d < TEAR_N; d++) {
        var fr = ((t / TEAR_PERIOD) + d / TEAR_N) % 1;
        if (fr < 0.93) {
          tearDrop(tx, TEAR_TOP + fr * (TEAR_BOT - TEAR_TOP), 10);
        } else {
          var sp = (fr - 0.93) / 0.07;
          ctx.beginPath();
          ctx.ellipse(tx, TEAR_BOT + 8, 6 + sp * 20, 3 + (1 - sp) * 3, 0, 0, Math.PI * 2);
          ctx.fillStyle = TEAR; ctx.fill();
        }
      }
    });
    ctx.restore();

    // nose line: the face's only real feature besides the lips
    ctx.beginPath();
    ctx.moveTo(540, 580);
    ctx.lineTo(540, 642);
    ctx.quadraticCurveTo(540, 654, 527, 654);
    ctx.lineWidth = 5.5; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke();

    // lips
    ctx.beginPath();
    ctx.moveTo(LIP.x - 78, LIP.y);
    ctx.quadraticCurveTo(LIP.x - 40, LIP.y - 26, LIP.x, LIP.y - 8);
    ctx.quadraticCurveTo(LIP.x + 40, LIP.y - 26, LIP.x + 78, LIP.y);
    ctx.quadraticCurveTo(LIP.x + 40, LIP.y + 30, LIP.x, LIP.y + 30);
    ctx.quadraticCurveTo(LIP.x - 40, LIP.y + 30, LIP.x - 78, LIP.y);
    ctx.closePath();
    ctx.fillStyle = LIPS; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(LIP.x - 78, LIP.y);
    ctx.quadraticCurveTo(LIP.x, LIP.y + 8, LIP.x + 78, LIP.y);
    ctx.stroke();

    // Satan sits centred on the lips
    satan(LIP.x, LIP.y + 2);

    // the occupants: rabbit left, horse right, never leaving their slots
    rabbit(EYE_L.x, EYE_L.y, gazeX, gazeY);
    horse(EYE_R.x, EYE_R.y, gazeX, gazeY);

    // thin black frame
    ctx.strokeStyle = INK;
    ctx.lineWidth = 5;
    ctx.strokeRect(16, 16, 1048, 1048);

    // hint
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = INK;
    ctx.font = '24px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('drag', 1032, 1034);
    ctx.restore();

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground pink) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = isPhone() ? W : Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw(PHASE0);
  }

  // ---- drag: occupants track the point; release drifts back over ~3s ----
  function setFromEvent(e) {
    var dx = (e.clientX - OX) * 1080 / S;
    var dy = (e.clientY - OY) * 1080 / S;
    tgtX = clamp((dx - 540) / 480, -1, 1);
    tgtY = clamp((dy - 540) / 480, -1, 1);
  }
  canvas.addEventListener('pointerdown', function (e) { dragging = true; setFromEvent(e); });
  window.addEventListener('pointermove', function (e) { if (dragging) setFromEvent(e); });
  window.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('touchstart', function (e) {
    dragging = true;
    if (e.touches && e.touches[0]) setFromEvent(e.touches[0]);
    if (e.preventDefault) e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchmove', function (e) {
    if (dragging && e.touches && e.touches[0]) setFromEvent(e.touches[0]);
  });
  window.addEventListener('touchend', function () { dragging = false; });

  // ---- animation: rAF anchored at PHASE0 + elapsed; frame one is the
  // synchronous draw in resize(), at the constant phase, gaze front ----
  var startTs = null, lastTs = null;
  function frame(ts) {
    if (startTs === null) { startTs = ts; lastTs = ts; }
    var dt = Math.min((ts - lastTs) / 1000, 0.1);
    lastTs = ts;
    var t = PHASE0 + (ts - startTs) / 1000;
    if (!dragging) { // released: target eases home, gaze settles front in ~3s
      var k = Math.exp(-dt * 1.1);
      tgtX *= k; tgtY *= k;
    }
    var lag = 1 - Math.exp(-dt * 5); // slow lagged tracking
    gazeX += (tgtX - gazeX) * lag;
    gazeY += (tgtY - gazeY) * lag;
    draw(t);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
