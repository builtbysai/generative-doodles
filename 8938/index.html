<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>&#8470;8938 &middot; Eight Bad Chips</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0d10;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: block; cursor: crosshair; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
  }
  .ui {
    position: fixed; z-index: 3; pointer-events: none;
    color: rgba(225, 232, 238, 0.62);
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }
  .ui .num { color: rgba(255, 200, 120, 0.9); }
  #title { top: 18px; left: 20px; }
  #title .sub { display: block; margin-top: 6px; font-size: 9px; letter-spacing: 0.18em; color: rgba(225,232,238,0.36); }
  #hint { bottom: 16px; right: 20px; text-align: right; font-size: 9px; color: rgba(225,232,238,0.36); }
  #seedline { bottom: 16px; left: 20px; font-size: 9px; color: rgba(225,232,238,0.30); }
  #fade {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: #0b0d10; opacity: 1; transition: opacity 0.6s ease;
  }
  @media (max-width: 620px) {
    #seedline { bottom: 38px; }
    #hint { font-size: 8px; }
    #title { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="ui" id="title"><span class="num">&#8470;8938</span> &middot; Eight Bad Chips<span class="sub">seed 243 &middot; the same program, eight different hardware faults</span></div>
<div class="ui" id="hint">click for a new batch of failures</div>
<div class="ui" id="seedline"></div>
<div id="fade"></div>
<script>
"use strict";
/* Seed 243: the AMY manufacturing story. The wire-wrapped prototype
   worked; every masked chip failed in a different way, so the failure
   was never the design. Eight chips run the same program: a harmonic
   mandala of twelve petals. Each chip carries one random fault. The
   piece is the ensemble of its own failures. */
let seed = 243001;
let rng;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const FAULTS = [
  {id:'dropped-harmonics', label:'fault: dropped harmonics 3, 7, 11'},
  {id:'stuck-envelope',    label:'fault: envelope stuck mid-pulse'},
  {id:'detuned-partials',  label:'fault: detuned partials'},
  {id:'dead-noise',        label:'fault: noise generator dead'},
  {id:'slow-clock',        label:'fault: clock at one third speed'},
  {id:'inverted-phase',    label:'fault: inverted phase'},
  {id:'dropped-octaves',   label:'fault: even rings only'},
  {id:'jitter',            label:'fault: angular jitter'}
];
const HUES = [
  [120, 255, 170], [255, 190, 110], [130, 210, 255], [255, 150, 200],
  [200, 180, 255], [170, 255, 220], [255, 220, 150], [150, 230, 230]
];
let chips = [];   /* {fault, hue, phase, grainSeed} */
let W=0,H=0, cols=4, rows=2, pw=0, ph=0, ox=0, oy=0;

function setup(){
  const c = createCanvas(windowWidth, windowHeight);
  c.id('stage');
  rng = mulberry32(seed);
  layout();
  buildBatch();
  document.getElementById('fade').style.opacity = '0';
  updateSeedline();
}

function layout(){
  W = width; H = height;
  if(W < 620){ cols = 2; rows = 4; } else { cols = 4; rows = 2; }
  const gx = 26, gyTop = 78, gyBot = 56;
  pw = (W - gx*(cols+1))/cols;
  ph = (H - gyTop - gyBot - 14*(rows-1))/rows;
  ox = gx; oy = gyTop;
}

function windowResized(){ resizeCanvas(windowWidth, windowHeight); layout(); }

function buildBatch(){
  /* shuffle faults across the eight chips */
  const order = FAULTS.map((f,i)=>i);
  for(let k=order.length-1;k>0;k--){ const m=Math.floor(rng()*(k+1)); const t=order[k]; order[k]=order[m]; order[m]=t; }
  chips = order.map((fi, ci)=>({
    fault: FAULTS[fi],
    hue: HUES[ci % HUES.length],
    phase: rng()*6.2832,
    spin: 0.004 + rng()*0.006,
    grainSeed: Math.floor(rng()*1e9)
  }));
  updateSeedline();
}

function chipRect(ci){
  const col = ci % cols, row = Math.floor(ci/cols);
  return {x: ox + col*(pw+26), y: oy + row*(ph+14), w: pw, h: ph};
}

function draw(){
  background(11,13,16);
  for(let ci=0; ci<8; ci++) drawChip(ci);
  if(frameCount % 20 === 0) updateSeedline();
}

function drawChip(ci){
  const chip = chips[ci];
  const r = chipRect(ci);
  const f = chip.fault.id;
  /* package */
  noStroke(); fill(18, 21, 26);
  rect(r.x, r.y, r.w, r.h, 8);
  stroke(60, 66, 74, 140); strokeWeight(1); noFill();
  rect(r.x, r.y, r.w, r.h, 8);
  /* pins */
  noStroke(); fill(110, 116, 124, 200);
  const npins = 5;
  for(let p=0;p<npins;p++){
    const t = (p+0.5)/npins;
    rect(r.x + t*r.w - 4, r.y - 5, 8, 5, 2);
    rect(r.x + t*r.w - 4, r.y + r.h, 8, 5, 2);
  }
  /* die area */
  const dx = r.x + 14, dy = r.y + 34;
  const dw = r.w - 28, dh = r.h - 58;
  noStroke(); fill(8, 10, 13);
  rect(dx, dy, dw, dh, 4);
  /* the mandala: twelve petals, harmonic rings */
  const mcx = dx + dw/2, mcy = dy + dh/2;
  const R = Math.min(dw, dh)*0.40;
  const slow = (f === 'slow-clock') ? 0.33 : 1;
  const t = frameCount*chip.spin*slow + chip.phase;
  const frozen = (f === 'stuck-envelope');
  const envT = frozen ? 0.62 : (0.5 + 0.5*Math.sin(frameCount*0.02*slow + chip.phase));
  const hue = chip.hue;
  const inverted = (f === 'inverted-phase');
  if(inverted){
    noStroke(); fill(hue[0]*0.32, hue[1]*0.32, hue[2]*0.32, 90);
    circle(mcx, mcy, R*2.3);
  }
  const missing = (f === 'dropped-harmonics') ? [3,7,11] : [];
  const evenOnly = (f === 'dropped-octaves');
  for(let ring=1; ring<=4; ring++){
    if(evenOnly && ring % 2 === 1) continue;
    const rr = R*ring/4;
    for(let pet=0; pet<12; pet++){
      if(missing.includes(pet)) continue;
      let ang = t*(1+ring*0.13) + pet/12*6.2832;
      if(f === 'jitter') ang += Math.sin(frameCount*0.9 + pet*2.7 + chip.phase)*0.09;
      let rad = rr;
      if(f === 'detuned-partials') rad *= 1 + 0.14*Math.sin(ang*3 + frameCount*0.05);
      const px = mcx + Math.cos(ang)*rad, py = mcy + Math.sin(ang)*rad;
      const pr = (3.5 + 9/ring) * (0.45 + envT*0.55);
      if(inverted){
        noStroke(); fill(8, 10, 13, 200);
        circle(px, py, pr*2);
        stroke(hue[0], hue[1], hue[2], 60); strokeWeight(1); noFill();
        circle(px, py, pr*2);
      } else {
        for(let g=3; g>=1; g--){
          noStroke();
          fill(hue[0], hue[1], hue[2], 10*g*(0.4+envT*0.6));
          circle(px, py, pr*g*1.1);
        }
        noStroke();
        fill(hue[0], hue[1], hue[2], 200*(0.35+envT*0.65));
        circle(px, py, pr*1.15);
      }
    }
    /* ring guide */
    noFill(); stroke(hue[0], hue[1], hue[2], 26); strokeWeight(1);
    circle(mcx, mcy, rr*2);
  }
  /* center */
  noStroke(); fill(hue[0], hue[1], hue[2], 220);
  circle(mcx, mcy, 7);
  /* grain: every chip but the dead-noise one */
  if(f !== 'dead-noise'){
    const grng = mulberry32(chip.grainSeed + Math.floor(frameCount/3));
    noStroke();
    for(let s=0;s<26;s++){
      const gx2 = dx + grng()*dw, gy2 = dy + grng()*dh;
      fill(255,255,255, 10+grng()*22);
      circle(gx2, gy2, 1.4);
    }
  }
  /* labels */
  noStroke(); fill(200, 208, 216, 170);
  textAlign(LEFT, CENTER); textSize(10);
  text('CHIP 0' + (ci+1), r.x + 14, r.y + 16);
  fill(255, 150, 130, 150); textSize(8);
  text(chip.fault.label, r.x + 14, r.y + r.h - 12);
  /* notch */
  noStroke(); fill(11,13,16);
  circle(r.x + r.w/2, r.y + 7, 9);
}

function updateSeedline(){
  document.getElementById('seedline').textContent = 'seed ' + seed;
}

function mousePressed(){ reseed(); return false; }
function touchStarted(){ reseed(); return false; }

function reseed(){
  seed = (seed*9301+49297) % 233280 + 13;
  rng = mulberry32(seed);
  buildBatch();
}
function keyPressed(){
  if(key==='r' || key==='R') reseed();
}
</script>
</body>
</html>
