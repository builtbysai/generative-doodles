<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crime Scene Plate</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0b08; }
  canvas { display: block; background: #0d0b08; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  /* Seeded PRNG (mulberry32). No Math.random anywhere in this piece. */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1380000);

  /* Palette */
  var SEPIA = '#c9a25f', OCHRE = '#e0a92e', PAPER = '#d8c194', UMBER = '#3d2c1e',
      TABLE = '#0d0b08', STRINGRED = '#a81414', LED = '#ff7a18', DARKAMBER = '#c25a08',
      PANELBLACK = '#0a0906', TEAL = '#0f5f56', RUST = '#a34a1f', CREAM = '#e8dcc0',
      HUNTER = '#a81414', SCRIPTBLUE = '#3d6fe0', GREY = '#6b6b6b', LIGHTGREY = '#d6d6d6';

  /* Viewport: Visual Viewport API, pinned canvas, phone via window.screen. */
  var W = 0, H = 0, isPhone = false;
  function size() {
    var vw = (typeof window.visualViewport !== 'undefined' && window.visualViewport) ? window.visualViewport.width : window.innerWidth;
    var vh = (typeof window.visualViewport !== 'undefined' && window.visualViewport) ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var sw = (typeof window.screen !== 'undefined' && window.screen) ? window.screen.width : W;
    var sh = (typeof window.screen !== 'undefined' && window.screen) ? window.screen.height : H;
    isPhone = Math.min(sw, sh) < 700 || (H > W * 1.15 && Math.min(W, H) < 700);
  }
  size();
  if (typeof window.addEventListener === 'function') window.addEventListener('resize', function () { size(); draw(bootT); });
  if (typeof window.visualViewport !== 'undefined' && window.visualViewport && typeof window.visualViewport.addEventListener === 'function')
    window.visualViewport.addEventListener('resize', function () { size(); draw(bootT); });

  /* ---- Pseudo-script glyphs: shapes only, never letters, never text. ---- */
  function glyph(g, x, y, s, color) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = Math.max(1, s * 0.14);
    ctx.beginPath();
    if (g === 0) { ctx.moveTo(x, y + s * 0.5); ctx.lineTo(x + s, y + s * 0.5); }
    else if (g === 1) { ctx.moveTo(x, y + s * 0.7); ctx.lineTo(x + s * 0.5, y + s * 0.2); ctx.lineTo(x + s, y + s * 0.7); }
    else if (g === 2) { ctx.fillRect(x, y + s * 0.3, s * 0.28, s * 0.28); ctx.fillRect(x + s * 0.6, y + s * 0.3, s * 0.28, s * 0.28); }
    else if (g === 3) { ctx.moveTo(x + s, y + s * 0.7); ctx.arc(x + s * 0.5, y + s * 0.7, s * 0.5, Math.PI, 0); }
    else if (g === 4) { ctx.moveTo(x + s * 0.5, y); ctx.lineTo(x + s, y + s * 0.8); ctx.lineTo(x, y + s * 0.8); ctx.closePath(); }
    else if (g === 5) { ctx.moveTo(x + s * 0.1, y + s * 0.1); ctx.lineTo(x + s * 0.9, y + s * 0.9); ctx.moveTo(x + s * 0.9, y + s * 0.1); ctx.lineTo(x + s * 0.1, y + s * 0.9); }
    else if (g === 6) { ctx.moveTo(x, y + s * 0.6); ctx.lineTo(x + s * 0.25, y + s * 0.2); ctx.lineTo(x + s * 0.5, y + s * 0.6); ctx.lineTo(x + s * 0.75, y + s * 0.2); ctx.lineTo(x + s, y + s * 0.6); }
    else { ctx.moveTo(x + s * 0.5, y + s * 0.5); ctx.arc(x + s * 0.5, y + s * 0.5, s * 0.35, 0, Math.PI * 2); }
    if (g === 2) return;
    ctx.stroke();
  }
  function glyphRow(x, y, s, n, seed, color) {
    var r = mulberry32(seed);
    for (var i = 0; i < n; i++) glyph(Math.floor(r() * 8), x + i * s * 1.5, y, s, color);
  }

  /* ---- Dot-matrix glyphs for the ticker fragment (5x7, seeded). ---- */
  function dotGlyph(bits, x, y, cw, color) {
    ctx.fillStyle = color;
    for (var row = 0; row < 7; row++) for (var col = 0; col < 5; col++) {
      if (bits[row] & (1 << (4 - col))) ctx.fillRect(x + col * cw, y + row * cw, cw * 0.72, cw * 0.72);
    }
  }
  var dotGlyphs = [];
  (function () {
    var r = mulberry32(1380000 + 555);
    for (var i = 0; i < 12; i++) {
      var bits = [];
      for (var row = 0; row < 7; row++) bits.push(Math.floor(r() * 32));
      dotGlyphs.push(bits);
    }
  })();

  /* ---- Plates: layout, mini-scenes, label cards, pins. ---- */
  /* Base layout in fractions; plateW derived from viewport each draw. */
  var LAYOUT_LAND = [
    { fx: 0.22, fy: 0.27, rot: -0.070 },
    { fx: 0.56, fy: 0.23, rot: 0.052 },
    { fx: 0.79, fy: 0.50, rot: -0.035 },
    { fx: 0.30, fy: 0.64, rot: 0.044 },
    { fx: 0.60, fy: 0.72, rot: -0.061 }
  ];
  var LAYOUT_PORT = [
    { fx: 0.30, fy: 0.16, rot: -0.060 },
    { fx: 0.70, fy: 0.31, rot: 0.045 },
    { fx: 0.30, fy: 0.48, rot: -0.040 },
    { fx: 0.70, fy: 0.65, rot: 0.055 },
    { fx: 0.48, fy: 0.85, rot: -0.050 }
  ];
  /* Connections between plates (pin to pin). */
  var LINKS = [[0, 1], [1, 2], [0, 3], [3, 4], [2, 4], [1, 4]];
  /* Per-plate lift phase (24 s ceremonial cycle, staggered). */
  var LIFT_PHASE = [0.0, 0.21, 0.47, 0.68, 0.86];

  /* Recorded drag state: plates stay where dropped; strings wobble on release. */
  var dragOffsets = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];
  var wobbleAt = [-1e9, -1e9, -1e9, -1e9, -1e9, -1e9];
  var activeDrag = -1, dragStart = { x: 0, y: 0 }, dragBase = { x: 0, y: 0 };

  function plateGeom(t) {
    var land = W >= H;
    var lay = land ? LAYOUT_LAND : LAYOUT_PORT;
    var pw = land ? Math.min(W * 0.26, H * 0.40) : Math.min(W * 0.44, H * 0.24);
    var ph = pw * 0.72;
    var out = [];
    for (var i = 0; i < 5; i++) {
      var cyc = ((t / 24) + LIFT_PHASE[i]) % 1;
      var lift = 0;
      if (cyc < 0.18) { var u = cyc / 0.18; lift = Math.sin(u * Math.PI); }
      out.push({
        x: lay[i].fx * W + dragOffsets[i].x,
        y: lay[i].fy * H + dragOffsets[i].y - lift * 10,
        w: pw * (1 + lift * 0.015), h: ph * (1 + lift * 0.015),
        rot: lay[i].rot, lift: lift
      });
    }
    return out;
  }

  function miniScene(i, px, py, pw, ph, t) {
    var ix = px - pw / 2 + pw * 0.07, iy = py - ph / 2 + ph * 0.10;
    var iw = pw * 0.86, ih = ph * 0.80;
    ctx.save();
    ctx.beginPath(); ctx.rect(ix, iy, iw, ih); ctx.clip();
    if (i === 0) {
      /* Stereograph pair: two sepia panels, ridge lines, sun dots. */
      ctx.fillStyle = SEPIA; ctx.fillRect(ix, iy, iw, ih);
      var gw = iw / 2;
      for (var p = 0; p < 2; p++) {
        var ox = ix + p * gw;
        ctx.fillStyle = PAPER; ctx.fillRect(ox + gw * 0.06, iy + ih * 0.08, gw * 0.88, ih * 0.84);
        ctx.strokeStyle = UMBER; ctx.lineWidth = Math.max(1, pw * 0.006);
        ctx.beginPath(); ctx.moveTo(ox + gw * 0.06, iy + ih * 0.62);
        var rr = mulberry32(1380000 + 101 + p * 17);
        for (var k = 1; k <= 5; k++) ctx.lineTo(ox + gw * 0.06 + gw * 0.88 * k / 5, iy + ih * (0.62 - rr() * 0.28));
        ctx.stroke();
        ctx.fillStyle = OCHRE; ctx.fillRect(ox + gw * 0.68, iy + ih * 0.18, gw * 0.09, gw * 0.09);
        ctx.fillStyle = UMBER; ctx.fillRect(ox + gw * 0.30, iy + ih * 0.55, gw * 0.05, ih * 0.30);
      }
    } else if (i === 1) {
      /* Tree burn: dark trunk and branches, embers rising, closed-form. */
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(ix, iy, iw, ih);
      ctx.strokeStyle = LIGHTGREY; ctx.lineWidth = Math.max(1, pw * 0.008);
      ctx.beginPath(); ctx.moveTo(ix + iw * 0.5, iy + ih * 0.95); ctx.lineTo(ix + iw * 0.5, iy + ih * 0.25);
      ctx.moveTo(ix + iw * 0.5, iy + ih * 0.45); ctx.lineTo(ix + iw * 0.28, iy + ih * 0.28);
      ctx.moveTo(ix + iw * 0.5, iy + ih * 0.55); ctx.lineTo(ix + iw * 0.74, iy + ih * 0.35);
      ctx.stroke();
      var er = mulberry32(1380000 + 202);
      for (var e = 0; e < 22; e++) {
        var ex = ix + iw * (0.2 + er() * 0.6), spd = 12 + er() * 22, off = er() * ih;
        var ey = iy + ih * 0.9 - ((t * spd + off) % (ih * 0.8));
        ctx.fillStyle = (e % 3 === 0) ? OCHRE : RUST;
        ctx.fillRect(ex, ey, Math.max(1, pw * 0.008), Math.max(1, pw * 0.008));
      }
    } else if (i === 2) {
      /* Ticker fragment: scrolling dot-matrix glyph rows. */
      ctx.fillStyle = PANELBLACK; ctx.fillRect(ix, iy, iw, ih);
      var cw = Math.max(2, pw * 0.016);
      for (var row = 0; row < 3; row++) {
        var speed = 14 + row * 7, y0 = iy + ih * 0.16 + row * ih * 0.28;
        for (var col = -1; col < 14; col++) {
          var gi = (col + 12) % 12;
          var gx = ix + iw * 0.04 + col * cw * 6 - ((t * speed) % (cw * 6));
          if (gx > ix - cw * 5 && gx < ix + iw) dotGlyph(dotGlyphs[gi], gx, y0, cw, (row === 1) ? LED : DARKAMBER);
        }
      }
    } else if (i === 3) {
      /* Spiral: logarithmic spiral strokes with glyph stamps. */
      ctx.fillStyle = '#101a18'; ctx.fillRect(ix, iy, iw, ih);
      var cx = ix + iw * 0.5, cy = iy + ih * 0.5;
      ctx.strokeStyle = TEAL; ctx.lineWidth = Math.max(1, pw * 0.008);
      ctx.beginPath();
      for (var a = 0; a <= Math.PI * 5; a += 0.12) {
        var r = Math.min(iw, ih) * 0.06 * Math.exp(0.22 * a);
        var sx = cx + r * Math.cos(a), sy = cy + r * Math.sin(a);
        if (a === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
      var sr = mulberry32(1380000 + 303);
      for (var sgi = 0; sgi < 8; sgi++) {
        var aa = sr() * Math.PI * 5, r2 = Math.min(iw, ih) * 0.06 * Math.exp(0.22 * aa);
        glyph(Math.floor(sr() * 8), cx + r2 * Math.cos(aa) - pw * 0.01, cy + r2 * Math.sin(aa) - pw * 0.01, pw * 0.02, RUST);
      }
    } else {
      /* Moon street: red-graded blocks, wet-light streaks, blue cipher glyphs. */
      ctx.fillStyle = '#120808'; ctx.fillRect(ix, iy, iw, ih);
      var br = mulberry32(1380000 + 404);
      for (var b = 0; b < 6; b++) {
        ctx.fillStyle = (b % 2 === 0) ? '#6e0d0d' : HUNTER;
        ctx.fillRect(ix + iw * (0.04 + b * 0.16), iy + ih * (0.25 + br() * 0.3), iw * 0.13, ih * (0.7 - br() * 0.2));
      }
      ctx.strokeStyle = SCRIPTBLUE; ctx.lineWidth = Math.max(1, pw * 0.006);
      ctx.beginPath(); ctx.moveTo(ix + iw * 0.1, iy + ih * 0.82); ctx.lineTo(ix + iw * 0.9, iy + ih * 0.82); ctx.stroke();
      glyphRow(ix + iw * 0.28, iy + ih * 0.38, pw * 0.035, 5, 1380000 + 405, SCRIPTBLUE);
    }
    ctx.restore();
  }

  function draw(t) {
    ctx.fillStyle = TABLE; ctx.fillRect(0, 0, W, H);
    /* Hovering witness camera: slow closed-form drift. */
    var dx = Math.sin(t * 0.05) * 12, dy = Math.cos(t * 0.04) * 9;
    ctx.save(); ctx.translate(dx, dy);
    var P = plateGeom(t);
    /* Plates. */
    for (var i = 0; i < 5; i++) {
      var p = P[i];
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.lift > 0) { ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(-p.w / 2 + 4, -p.h / 2 + 8, p.w, p.h); }
      ctx.fillStyle = PAPER; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.strokeStyle = UMBER; ctx.lineWidth = Math.max(1, p.w * 0.012); ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.fillStyle = SEPIA; ctx.fillRect(-p.w / 2 + p.w * 0.03, -p.h / 2 + p.h * 0.04, p.w * 0.94, p.h * 0.92);
      miniScene(i, 0, 0, p.w, p.h, t);
      /* Label card overlapping the bottom-right corner, pseudo-script only. */
      ctx.save(); ctx.translate(p.w * 0.30, p.h * 0.36); ctx.rotate(0.09);
      ctx.fillStyle = PAPER; ctx.fillRect(0, 0, p.w * 0.34, p.h * 0.22);
      ctx.strokeStyle = UMBER; ctx.lineWidth = Math.max(1, p.w * 0.006); ctx.strokeRect(0, 0, p.w * 0.34, p.h * 0.22);
      glyphRow(p.w * 0.03, p.h * 0.06, p.w * 0.022, 4, 1380000 + 900 + i * 31, UMBER);
      ctx.restore();
      ctx.restore();
    }
    /* Strings: pin to pin, sag + decaying wobble from recorded drags. */
    ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.0018);
    for (var li = 0; li < LINKS.length; li++) {
      var a = P[LINKS[li][0]], b = P[LINKS[li][1]];
      var ax = a.x - a.w * 0.42, ay = a.y - a.h * 0.42;
      var bx = b.x + b.w * 0.42, by = b.y - b.h * 0.42;
      var mx = (ax + bx) / 2, my = (ay + by) / 2;
      var wob = 0;
      if (wobbleAt[li] > -1e8) {
        var dt = t - wobbleAt[li];
        if (dt >= 0 && dt < 6) wob = 14 * Math.exp(-dt / 1.4) * Math.sin(dt * 7);
      }
      var sag = 14 + wob;
      ctx.strokeStyle = STRINGRED;
      ctx.beginPath(); ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(mx, my + sag, bx, by);
      ctx.stroke();
    }
    /* Pins on top of both top corners, where strings attach. */
    for (var pi = 0; pi < 5; pi++) {
      var pp = P[pi];
      ctx.fillStyle = STRINGRED;
      ctx.fillRect(pp.x - pp.w * 0.42 - 3, pp.y - pp.h * 0.42 - 3, 6, 6);
      ctx.fillRect(pp.x + pp.w * 0.42 - 3, pp.y - pp.h * 0.42 - 3, 6, 6);
    }
    ctx.restore();
    /* Table frame. */
    ctx.strokeStyle = UMBER; ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.004);
    ctx.strokeRect(6, 6, W - 12, H - 12);
  }

  /* ---- Interaction: drag a plate, re-routing its strings. ---- */
  function plateAt(x, y, t) {
    var P = plateGeom(t);
    for (var i = 4; i >= 0; i--) {
      if (Math.abs(x - P[i].x) < P[i].w / 2 && Math.abs(y - P[i].y) < P[i].h / 2) return i;
    }
    return -1;
  }
  function onDown(e) {
    var x = (typeof e.clientX !== 'undefined') ? e.clientX : e.touches[0].clientX;
    var y = (typeof e.clientY !== 'undefined') ? e.clientY : e.touches[0].clientY;
    var i = plateAt(x, y, bootT);
    if (i >= 0) {
      activeDrag = i; dragStart = { x: x, y: y };
      dragBase = { x: dragOffsets[i].x, y: dragOffsets[i].y };
      if (typeof e.preventDefault === 'function') e.preventDefault();
    }
  }
  function onMove(e) {
    if (activeDrag < 0) return;
    var x = (typeof e.clientX !== 'undefined') ? e.clientX : e.touches[0].clientX;
    var y = (typeof e.clientY !== 'undefined') ? e.clientY : e.touches[0].clientY;
    dragOffsets[activeDrag].x = dragBase.x + (x - dragStart.x);
    dragOffsets[activeDrag].y = dragBase.y + (y - dragStart.y);
    draw(bootT);
  }
  function onUp() {
    if (activeDrag < 0) return;
    for (var li = 0; li < LINKS.length; li++) {
      if (LINKS[li][0] === activeDrag || LINKS[li][1] === activeDrag) wobbleAt[li] = bootT;
    }
    activeDrag = -1;
    draw(bootT);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
  }

  /* ---- Boot: frame one is draw(0); the clock starts with the rAF loop. ---- */
  var bootT = 0;
  draw(0);
  var t0 = 0, started = false;
  function loop(now) {
    if (!started) { t0 = now; started = true; }
    bootT = (now - t0) / 1000;
    draw(bootT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
