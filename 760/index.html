<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interference Cube</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2F2F0; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- strict palette ----
  var CHROME = [201, 205, 211];   // #C9CDD3
  var GOLD   = [216, 180, 106];   // #D8B46A
  var VIOLET = [122, 111, 168];   // #7A6FA8
  var TEAL   = [95, 168, 163];    // #5FA8A3
  var SMOKE  = [142, 148, 153];   // #8E9499
  var WHITE  = [242, 242, 240];   // #F2F2F0

  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a + ')';
  }

  // ---- thin-film interference LUT ----
  // One cycle through the coating's angle states. Saturation lives mid-band;
  // the ends wash back toward smoke and chrome.
  var LUT = [
    { u: 0.00, c: SMOKE },
    { u: 0.22, c: VIOLET },
    { u: 0.45, c: TEAL },
    { u: 0.70, c: GOLD },
    { u: 0.88, c: CHROME },
    { u: 1.00, c: SMOKE }
  ];
  function lut(u) {
    u = u - Math.floor(u);
    for (var i = 0; i < LUT.length - 1; i++) {
      var a = LUT[i], b = LUT[i + 1];
      if (u >= a.u && u <= b.u) {
        var t = (u - a.u) / (b.u - a.u || 1);
        t = t * t * (3 - 2 * t);
        return mix(a.c, b.c, t);
      }
    }
    return SMOKE.slice();
  }
  // Interference state of a face: two offset sines of the angle between the
  // view direction and the light azimuth. Returns {color, sat} where sat is
  // the mid-band saturation factor; extremes wash toward chrome.
  function film(u) {
    var sat = Math.pow(Math.abs(Math.sin(Math.PI * (u - Math.floor(u)))), 0.7);
    var col = lut(u);
    col = mix(col, CHROME, (1 - sat) * 0.38);
    return { color: col, sat: sat };
  }

  // ---- state: closed-form in (events, t) ----
  var dragU = 0;          // accumulated drag offset into the interference cycle
  var dragging = false;
  var lastX = 0;
  var orbitPeriod = 90;   // seconds per light orbit

  function faceU(base, faceIdx, t) {
    var orbit = 0.5 * (t / orbitPeriod);                    // half the LUT cycle per orbit
    var wobble = 0.02 * Math.sin(2 * Math.PI * t / 31 + faceIdx * 2.1);
    return base + orbit + dragU + wobble;
  }

  // ---- geometry ----
  function isPhone(w, h) {
    var sw = 0, sh = 0;
    if (typeof screen !== 'undefined' && screen) { sw = screen.width || 0; sh = screen.height || 0; }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return h > w * 1.15;
  }

  function lerpPt(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }

  function poly(pts, fill) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function drawFace(quad, base, faceIdx, t) {
    var st = film(faceU(base, faceIdx, t));
    var A = quad[0], B = quad[1], C = quad[2], D = quad[3];
    // 1) transmitted wash: the gallery white seen through the coating
    poly(quad, rgba(st.color, 0.52));
    // 2) second transmitted layer, hue-shifted, inset toward centroid
    var cen = [(A[0] + B[0] + C[0] + D[0]) / 4, (A[1] + B[1] + C[1] + D[1]) / 4];
    var inset = quad.map(function (p) { return lerpPt(p, cen, 0.16); });
    var st2 = film(faceU(base, faceIdx, t) + 0.12);
    poly(inset, rgba(st2.color, 0.30));
    // 3) absorption: smoke darkening deepening toward the lower edge
    for (var i = 0; i < 6; i++) {
      var v0 = i / 6, v1 = (i + 1) / 6;
      var band = [lerpPt(A, D, v0), lerpPt(B, C, v0), lerpPt(B, C, v1), lerpPt(A, D, v1)];
      poly(band, rgba(SMOKE, 0.02 + 0.11 * Math.pow(i / 5, 2)));
    }
    // 4) mirrored streak: a diagonal band of reflected light
    var streak = [lerpPt(A, D, 0.08), lerpPt(A, D, 0.42), lerpPt(B, C, 0.78), lerpPt(B, C, 0.44)];
    poly(streak, rgba(WHITE, 0.16 + 0.20 * st.sat));
    var streakTint = [lerpPt(A, D, 0.20), lerpPt(A, D, 0.34), lerpPt(B, C, 0.68), lerpPt(B, C, 0.54)];
    poly(streakTint, rgba(st.color, 0.20));
    return st;
  }

  function seam(p, q, col, alpha) {
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
    ctx.strokeStyle = rgba(col, alpha * 0.16); ctx.lineWidth = 6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
    ctx.strokeStyle = rgba(col, alpha * 0.38); ctx.lineWidth = 2.6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
    ctx.strokeStyle = rgba(mix(col, WHITE, 0.45), alpha * 0.85); ctx.lineWidth = 1.2; ctx.stroke();
  }

  function draw(t) {
    var w = canvas.clientWidth || window.innerWidth;
    var h = canvas.clientHeight || window.innerHeight;
    // pin the canvas in px every frame
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = window.innerWidth, H = window.innerHeight;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    w = W; h = H;

    // gallery void
    ctx.fillStyle = rgba(WHITE, 1);
    ctx.fillRect(0, 0, w, h);

    var phone = isPhone(w, h);
    var S = 0.51 * Math.min(w, h);           // cube scale; total width ~1.08 S
    var cx = w / 2, cy = h * 0.40;

    var T  = [cx, cy - S * 0.62];
    var R  = [cx + S * 0.54, cy - S * 0.31];
    var C  = [cx, cy];
    var L  = [cx - S * 0.54, cy - S * 0.31];
    var BL = [cx - S * 0.54, cy + S * 0.31];
    var BC = [cx, cy + S * 0.62];
    var BR = [cx + S * 0.54, cy + S * 0.31];

    var floorY = BC[1] + S * 0.38;

    // pedestal: a thin clear column, nearly invisible
    ctx.fillStyle = rgba(SMOKE, 0.10);
    ctx.fillRect(cx - S * 0.05, BC[1] - S * 0.02, S * 0.10, floorY - BC[1]);
    ctx.fillStyle = rgba(WHITE, 0.35);
    ctx.fillRect(cx - S * 0.05, BC[1] - S * 0.02, S * 0.02, floorY - BC[1]);

    // face states at this instant
    var topBase = 0.93, leftBase = 0.70, rightBase = 0.24;
    var stTop = film(faceU(topBase, 0, t));
    var stLeft = film(faceU(leftBase, 1, t));
    var stRight = film(faceU(rightBase, 2, t));

    // floor glow pool: dominant hue of the three faces, layered soft ellipses
    var dom = mix(mix(stLeft.color, stRight.color, 0.5), stTop.color, 0.3);
    var poolRx = S * 0.78, poolRy = S * 0.16;
    var layers = [[1.0, 0.05], [0.8, 0.06], [0.58, 0.07], [0.38, 0.08]];
    for (var i = 0; i < layers.length; i++) {
      ctx.beginPath();
      ctx.ellipse(cx, floorY, poolRx * layers[i][0], poolRy * layers[i][0], 0, 0, Math.PI * 2);
      ctx.fillStyle = rgba(dom, layers[i][1]);
      ctx.fill();
    }

    // faces: three layered behaviors each
    drawFace([T, R, C, L], topBase, 0, t);
    drawFace([L, C, BC, BL], leftBase, 1, t);
    drawFace([C, R, BR, BC], rightBase, 2, t);

    // seams: brighter interference lines where panes meet (gold-to-blue shift)
    var seamColA = lut(faceU(0.70, 1, t) + 0.06);
    var seamColB = lut(faceU(0.24, 2, t) + 0.30);
    seam(L, C, seamColA, 0.9);
    seam(C, R, seamColB, 0.9);
    seam(C, BC, mix(seamColA, seamColB, 0.5), 0.9);
    // silhouette edges, quieter
    seam(T, R, seamColB, 0.45);
    seam(T, L, seamColA, 0.45);
    seam(L, BL, seamColA, 0.4);
    seam(R, BR, seamColB, 0.4);
    seam(BL, BC, seamColA, 0.35);
    seam(BC, BR, seamColB, 0.35);
  }

  // ---- sizing: Visual Viewport API ----
  function resize() {
    var W = window.innerWidth, H = window.innerHeight;
    if (window.visualViewport) { W = window.visualViewport.width; H = window.visualViewport.height; }
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    draw(frameT);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  // ---- drag: shift the light azimuth through the interference cycle ----
  // The accumulated offset persists as the new base when the drag ends
  // (recorded choice in process.md).
  function ptrX(e) {
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    return e.clientX;
  }
  canvas.addEventListener('pointerdown', function (e) { dragging = true; lastX = ptrX(e); });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var x = ptrX(e);
    dragU += (x - lastX) / Math.max(window.innerWidth, 1) * 0.9;
    lastX = x;
  });
  window.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('touchstart', function (e) { dragging = true; lastX = ptrX(e); }, { passive: true });
  canvas.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    var x = ptrX(e);
    dragU += (x - lastX) / Math.max(window.innerWidth, 1) * 0.9;
    lastX = x;
  }, { passive: true });
  canvas.addEventListener('touchend', function () { dragging = false; });

  // ---- frame one: synchronous draw at orbit t=0 ----
  var frameT = 0;
  draw(0);

  // ---- loop: offset + elapsed-since-load, never a wall clock ----
  if (typeof requestAnimationFrame === 'function') {
    var start = null;
    var loop = function (ts) {
      if (start === null) start = ts;
      frameT = (ts - start) / 1000;
      draw(frameT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
