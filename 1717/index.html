<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chevron Country</title>
<style>
html, body { margin: 0; padding: 0; background: #F3C49E; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F3C49E';
var CREAM = '#FBF3E1';
var MAUVE = '#7E4B62';
var PLATE = '#33202A';
var PLATE_LINE = 'rgba(217,160,176,0.55)';
var TITLE_INK = '#FBF3E1';

function hexRgb(h) {

function rgba(h, a) {

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;

var rng = mulberry32(1717);
var phaseT = FRAME_T;
/* ---- seeded value noise, two octaves, deterministic ---- */

  return 0.65 * vnoise(x * 3, y * 3) + 0.35 * vnoise(x * 7 + 5.2, y * 7 + 2.7);
}
/* ---- drag stir: persistent warp blobs, chevrons migrate around the finger ---- */

var dragShift = 0; /* fold centre migrates toward the last drag x */

function addBlob(bx, by, dx, dy) {
  var i, b;

    b = blobs[i];

    if (dd < 0.08 * 0.08) { b.dx = clamp(b.dx + dx, -0.12, 0.12); b.dy = clamp(b.dy + dy, -0.12, 0.12); return; }

  for (i = 0; i < blobs.length; i++) {

/* ---- heightfield phase: horizontal ridges, chevron fold, plunge column ---- */

  return 0.46 + 0.02 * Math.sin(TAU * t / PERIOD) + dragShift;
}

  var w = warp(x, y);

function slopeX(x, y, t) {

  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;

/* ---- stage: square on desktop, full-bleed on phones ---- */

var LEVELS = [];
(function () {
  var i;

})();
var GRID = 110;
function draw() {
  size();

  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var t = phaseT;

  var m = 0.06;
  var fx0 = st.x + st.w * m, fy0 = st.y + st.h * m;
  var fw = st.w * (1 - 2 * m), fh = st.h * (1 - 2 * m);

  /* marching-squares height grid over the field */
  var H = [];
  for (j = 0; j <= GRID; j++) {
    H[j] = [];
    for (i = 0; i <= GRID; i++) {
      H[j][i] = heightAt(i / GRID, j / GRID, t);
    }

  ctx.save();
  ctx.beginPath();
  ctx.rect(fx0, fy0, fw, fh);
  ctx.clip();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var lw = Math.max(1, fh * 0.0016);
  var counts = { cream: 0, mauve: 0 };
  for (li = 0; li < LEVELS.length; li++) {
    var level = LEVELS[li];
    var creamPath = null, mauvePath = null;
    try {
      creamPath = new Path2D();
      mauvePath = new Path2D();
    } catch (e) {
      creamPath = null; mauvePath = null;
    }
    for (j = 0; j < GRID; j++) {
      for (i = 0; i < GRID; i++) {
        h00 = H[j][i]; h10 = H[j][i + 1]; h11 = H[j + 1][i + 1]; h01 = H[j + 1][i];
        ci = (h00 > level ? 1 : 0) | (h10 > level ? 2 : 0) | (h11 > level ? 4 : 0) | (h01 > level ? 8 : 0);
        if (ci === 0 || ci === 15) continue;
        var x0 = i / GRID, y0 = j / GRID, x1 = (i + 1) / GRID, y1 = (j + 1) / GRID;
        /* edge crossing points, linearly interpolated */
        function edgeX(xa, ya, ha, xb, yb, hb) {
          var f = (level - ha) / (hb - ha);
          return { x: xa + (xb - xa) * f, y: ya + (yb - ya) * f };
        }
        var top = edgeX(x0, y0, h00, x1, y0, h10);
        var right = edgeX(x1, y0, h10, x1, y1, h11);
        var bottom = edgeX(x0, y1, h01, x1, y1, h11);
        var left = edgeX(x0, y0, h00, x0, y1, h01);
        var segs = [];
        if (ci === 1 || ci === 14) segs.push([left, top]);
        else if (ci === 2 || ci === 13) segs.push([top, right]);
        else if (ci === 3 || ci === 12) segs.push([left, right]);
        else if (ci === 4 || ci === 11) segs.push([right, bottom]);
        else if (ci === 5) { segs.push([left, top]); segs.push([right, bottom]); }
        else if (ci === 6 || ci === 9) segs.push([top, bottom]);
        else if (ci === 7 || ci === 8) segs.push([left, bottom]);
        else if (ci === 10) { segs.push([top, right]); segs.push([left, bottom]); }

          var a = segs[cs][0], b = segs[cs][1];
          var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;

          var sl = Math.abs(slopeX(mx, my, t));
          var fdx = mx - foldX(t);
          var foldProx = Math.exp(-(fdx * fdx) / (0.13 * 0.13));
          var pc2 = Math.exp(-((mx - COLX) * (mx - COLX)) / (0.05 * 0.05));
          var isMauve = (sl > 2.2 && foldProx > 0.3) || pc2 > 0.55;

            ctx.beginPath();
            ctx.moveTo(fx0 + a.x * fw, fy0 + a.y * fh);
            ctx.lineTo(fx0 + b.x * fw, fy0 + b.y * fh);

      ctx.strokeStyle = rgba(CREAM, 0.92);

  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Chevron Country').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Chevron Country').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 24').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Chevron Country', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 24', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to stir the ridges.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    counts: function () { return window.__counts || null; },
    stir: function (bx, by, dx, dy) { addBlob(bx, by, dx, dy); lastDragX = bx; dragShift = 0.06 * (bx - 0.5); draw(); }

}
/* ---- drag-to-stir: pointer drag warps the ridge field around the finger ---- */
var dragging = false, lastPX = 0, lastPY = 0;
function pointerPos(e) {
  var r = { left: 0, top: 0 };
  try { r = canvas.getBoundingClientRect(); } catch (err) { r = { left: 0, top: 0 }; }

  var cy = (e.clientY !== undefined ? e.clientY : 0) - r.top;

  var m = 0.06;
  var fx0 = st.x + st.w * m, fy0 = st.y + st.h * m;

  if (e.preventDefault) e.preventDefault();

function onMove(e) {
  if (!dragging) return;
  var p = pointerPos(e);

  var m = 0.06;

</script>
