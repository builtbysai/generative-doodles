<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(0+|Phi*|0-)</title>
<style>
html, body { margin: 0; padding: 0; background: #04050a; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#04050a';
var PLATE = '#f4fbff';
var INK = '#14141c';
var PHASE = 6;
/* A near-empty vacuum births and annihilates rare white-gold dots
   where faint wave trains cross. Frame one is at t = 6 s: the field
   is calm grain, and the first event's two wave trains are already
   converging off-center, 2 s before the dot condenses. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function rgb(c) {
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}
var INK_RGB = hexRgb(INK);
var GOLD = [255, 240, 200];
var GOLD_DIM = [255, 220, 150];
var PALE_BLUE = [175, 205, 255];
var TRAIN_BLUE = [200, 220, 255];
var ICE_BLUE = [170, 210, 255];
var GRAIN_BLUE = [70, 100, 170];
var WASH_BLUE = [40, 70, 140];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var FX = 0, FY = 0, FW = 0, FH = 0, SC = 1;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
  /* Field rect: full viewport on phones, a centered square on
     desktop; the page ground is the piece's own near-black either way. */
  if (isPhone) { FX = 0; FY = 0; FW = VW; FH = VH; }
  else {
    var side = Math.min(VW, VH);
    FX = (VW - side) / 2; FY = (VH - side) / 2; FW = side; FH = side;
  }
  SC = clamp(Math.min(FW, FH) / 900, 0.55, 1.15);
}
/* ---- seeded RNG: mulberry32, fixed seed, no unseeded randomness ---- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* ---- fixed event schedule: Poisson-like gaps from the seeded
   stream, mean gap 28 s, clamped to 8..70 s. The first event is
   pinned so frame one (t = 6 s) already shows its wave trains
   converging: trains start at 4.5 s, the dot condenses at 8.0 s. ---- */
var APPROACH = 3.5, DOT_LIFE = 1.4, RING_LIFE = 2.6;
var MEAN_GAP = 30;
var events = [];
var ribbons = [];
function expGap(rng, mean) {
  var u = rng();
  if (u <= 0) u = 0.000001;
  if (u >= 1) u = 0.999999;
  return clamp(-mean * Math.log(1 - u), 14, 75);
}
function offCenterPos(rng) {
  var x, y, dx, dy, d, tries = 0;
  do {
    x = 0.15 + 0.70 * rng();
    y = 0.18 + 0.64 * rng();
    dx = x - 0.5; dy = (y - 0.5) * (FH / FW);
    d = Math.sqrt(dx * dx + dy * dy);
    tries++;
  } while (d < 0.10 && tries < 40);
  return { x: x, y: y };
}
function buildSchedule() {
  var rng = mulberry32(1655);
  var t = 8.0, i, p, ev;
  while (t < 1500) {
    p = offCenterPos(rng);
    ev = {
      t0: t, fx: p.x, fy: p.y,
      ang: rng() * TAU,
      spread: 1.15 + 0.30 * rng(),
      ring: rng() < 0.6,
      seed: rng() * TAU
    };
    events.push(ev);
    t += expGap(rng, MEAN_GAP);
  }
  /* Ribbons: a second seeded stream, mean gap 80 s, first at ~55 s. */
  var rng2 = mulberry32(9021655);
  var rt = 48 + 20 * rng2();
  while (rt < 1500) {
    ribbons.push({
      t0: rt, dur: 8 + 3 * rng2(),
      p1: rng2() * TAU, p2: rng2() * TAU,
      p3: rng2() * TAU, p4: rng2() * TAU
    });
    rt += clamp(-80 * Math.log(1 - rng2()), 40, 160);
  }
}
/* ---- faint deep-blue field grain and large soft washes, fixed seed ---- */
var grain = [], washes = [];
function buildGrain() {
  var rng = mulberry32(1655008);
  var i;
  for (i = 0; i < 700; i++) {
    grain.push({
      x: rng(), y: rng(),
      r: 0.6 + 1.0 * rng(),
      a: 0.04 + 0.06 * rng(),
      ph: rng() * TAU
    });
  }
  for (i = 0; i < 60; i++) {
    grain.push({
      x: rng(), y: rng(),
      r: 0.8 + 1.2 * rng(),
      a: 0.12 + 0.06 * rng(),
      ph: rng() * TAU
    });
  }
  for (i = 0; i < 7; i++) {
    washes.push({
      x: 0.1 + 0.8 * rng(), y: 0.1 + 0.8 * rng(),
      r: (0.10 + 0.14 * rng()),
      a: 0.012 + 0.008 * rng()
    });
  }
}
function drawDisc(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function drawField(t) {
  var i, g, a, w;
  for (i = 0; i < washes.length; i++) {
    w = washes[i];
    ctx.fillStyle = rgba(WASH_BLUE, w.a);
    drawDisc(FX + w.x * FW, FY + w.y * FH, w.r * Math.min(FW, FH));
    ctx.fill();
  }
  for (i = 0; i < grain.length; i++) {
    g = grain[i];
    /* Slow shimmer only: a closed-form sine of t, never a jump. */
    a = g.a * (0.75 + 0.25 * Math.sin(t * 0.3 + g.ph));
    ctx.fillStyle = rgba(GRAIN_BLUE, a);
    ctx.fillRect(FX + g.x * FW - g.r / 2, FY + g.y * FH - g.r / 2, g.r, g.r);
  }
}
/* ---- one wave train: parallel wavefront lines converging on the
   crossing point along direction ang. u = 0 at train start, 1 at
   the crossing instant (the dot condenses). ---- */
function drawTrain(cx, cy, ang, u, seed, fade) {
  var dx = Math.cos(ang), dy = Math.sin(ang);
  var L = 120 * SC;
  var front = (1 - u) * L;
  var env = smooth(u / 0.35) * (1 - smooth((u - 0.85) / 0.15) * 0.5);
  if (typeof fade === 'number') env *= fade;
  var k, back, bx, by, px, py, a;
  var halfLen = 36 * SC;
  ctx.lineWidth = Math.max(1, 1.1 * SC);
  ctx.lineCap = 'round';
  for (k = 0; k < 5; k++) {
    back = front + k * 13 * SC;
    bx = cx - dx * back; by = cy - dy * back;
    px = -dy * halfLen * (1 - k * 0.08);
    py = dx * halfLen * (1 - k * 0.08);
    a = 0.16 * env * (1 - k / 5) * (0.85 + 0.15 * Math.sin(seed + k * 1.7));
    if (a <= 0.004) continue;
    ctx.strokeStyle = rgba(TRAIN_BLUE, a);
    ctx.beginPath();
    ctx.moveTo(bx - px, by - py);
    ctx.lineTo(bx + px, by + py);
    ctx.stroke();
  }
}
function drawEvent(ev, t) {
  var cx = FX + ev.fx * FW, cy = FY + ev.fy * FH;
  var dt = t - (ev.t0 - APPROACH);
  var u, v, r, a;
  if (dt < 0) return 'gone';
  if (dt < APPROACH) {
    u = dt / APPROACH;
    drawTrain(cx, cy, ev.ang, u, ev.seed);
    drawTrain(cx, cy, ev.ang + ev.spread, u, ev.seed + 2.4);
    return 'approach';
  }
  dt -= APPROACH;
  if (dt < DOT_LIFE) {
    /* Dot condenses, lingers a breath, starts to fade. */
    v = dt / DOT_LIFE;
    a = smooth(v / 0.25) * (1 - smooth((v - 0.7) / 0.3));
    if (a > 0.004) {
      ctx.fillStyle = rgba(GOLD_DIM, 0.05 * a);
      drawDisc(cx, cy, 16 * SC);
      ctx.fill();
      ctx.fillStyle = rgba(GOLD_DIM, 0.16 * a);
      drawDisc(cx, cy, 8 * SC);
      ctx.fill();
      ctx.fillStyle = rgba(GOLD, 0.95 * a);
      drawDisc(cx, cy, 2.4 * SC);
      ctx.fill();
    }
    /* The trains dissolve as the dot forms. */
    if (v < 0.4) {
      drawTrain(cx, cy, ev.ang, 1, ev.seed, 1 - v / 0.4);
      drawTrain(cx, cy, ev.ang + ev.spread, 1, ev.seed + 2.4, 1 - v / 0.4);
    }
    return 'dot';
  }
  dt -= DOT_LIFE;
  if (dt < RING_LIFE) {
    v = dt / RING_LIFE;
    if (ev.ring) {
      r = (5 + 49 * v) * SC;
      a = 0.30 * (1 - v);
      ctx.strokeStyle = rgba(PALE_BLUE, a);
      ctx.lineWidth = Math.max(1, 1.2 * SC);
      drawDisc(cx, cy, r);
      ctx.stroke();
    }
    /* The last breath of the dot, inside the ring. */
    if (v < 0.3) {
      a = 0.5 * (1 - v / 0.3);
      ctx.fillStyle = rgba(GOLD, a);
      drawDisc(cx, cy, 1.6 * SC);
      ctx.fill();
    }
    return 'ring';
  }
  return 'gone';
}
/* ---- blue smoke ribbon: a curl-noise trail, closed-form in t ---- */
function ribbonHead(rb, t) {
  var lt = t - rb.t0;
  return {
    x: FX + (0.5 + 0.28 * Math.sin(0.11 * lt + rb.p1) + 0.10 * Math.sin(0.031 * lt + rb.p2)) * FW,
    y: FY + (0.5 + 0.24 * Math.sin(0.13 * lt + rb.p3) + 0.08 * Math.cos(0.043 * lt + rb.p4)) * FH
  };
}
function drawRibbon(rb, t) {
  var lt = t - rb.t0;
  if (lt < 0 || lt > rb.dur) return;
  var env = smooth(lt / 2) * (1 - smooth((lt - (rb.dur - 2)) / 2));
  if (env <= 0.004) return;
  var k, p0, p1, a, w;
  ctx.lineCap = 'round';
  for (k = 0; k < 36; k++) {
    p0 = ribbonHead(rb, t - k * 0.18);
    p1 = ribbonHead(rb, t - (k + 1) * 0.18);
    a = 0.10 * env * (1 - k / 36);
    w = (1.5 + 7.5 * (1 - k / 36)) * SC;
    if (a <= 0.004) continue;
    ctx.strokeStyle = rgba(ICE_BLUE, a);
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  var title = '(0+|Phi*|0-)';
  var date = '2006 · 07 · 24';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(title).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText(date).width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(title, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.8);
  ctx.fillText(date, plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(INK_RGB, 0.9);
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
/* Watch-only, strictly: no pointer listeners are attached anywhere. */
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function draw(t) {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawField(t);
  var i;
  for (i = 0; i < ribbons.length; i++) drawRibbon(ribbons[i], t);
  for (i = 0; i < events.length; i++) drawEvent(events[i], t);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    schedule: function () {
      return events.map(function (e) {
        return { t0: e.t0, fx: e.fx, fy: e.fy, ring: e.ring };
      });
    },
    ribbons: function () {
      return ribbons.map(function (r) { return { t0: r.t0, dur: r.dur }; });
    },
    eventStateAt: function (t) {
      var out = [], i, ev, dt;
      for (i = 0; i < events.length; i++) {
        ev = events[i];
        dt = t - (ev.t0 - APPROACH);
        if (dt < 0 || dt >= APPROACH + DOT_LIFE + RING_LIFE) continue;
        out.push({
          i: i, t0: ev.t0,
          phase: dt < APPROACH ? 'approach' : (dt < APPROACH + DOT_LIFE ? 'dot' : 'ring')
        });
      }
      return out;
    },
    fieldRect: function () { return { FX: FX, FY: FY, FW: FW, FH: FH, isPhone: isPhone }; },
    pixelStats: function () {
      var img = ctx.getImageData(0, 0, VW, VH).data;
      var n = VW * VH, i, r, g, b, bright = 0, lit = 0, sum = 0;
      for (i = 0; i < n; i++) {
        r = img[i * 4]; g = img[i * 4 + 1]; b = img[i * 4 + 2];
        sum += r + g + b;
        if (r + g + b > 60) lit++;
        if (r + g + b > 200) bright++;
      }
      return { meanRGB: sum / (n * 3), litPixels: lit, brightPixels: bright };
    }
  };
}
/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */
size();
buildSchedule();
buildGrain();
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
