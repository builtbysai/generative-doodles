<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Never Isles - Generative Doodles 8927</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#20180e; }
  body { position:fixed; inset:0; }
  canvas { display:block; width:100vw; height:100vh; touch-action:manipulation; cursor:pointer; }
</style>

<body>
<canvas id="plate" aria-label="The Never Isles: an antique-style nautical chart of a procedural archipelago"></canvas>
<script>
'use strict';
/* ============================================================
   No 8927 "Never Isles" - a procedural antique nautical chart.
   Radial-noise coastlines + erosion passes, engraved plate style,
   recombined GNIS-style place names. Still image; click re-charts.
   ============================================================ */

// ---------------- seed ----------------
const qs = new URLSearchParams(location.search);
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let SEED = qs.get('seed') || 'halcyon-08';
let rng = mulberry32(xmur3(SEED)());
function reseed(s){ SEED = s; rng = mulberry32(xmur3(s)()); }
function rr(a,b){ return a + rng()*(b-a); }
function ri(a,b){ return Math.floor(rr(a,b+1)); }
function pick(arr){ return arr[Math.floor(rng()*arr.length)]; }

// ---------------- value noise ----------------
function makeNoise2D(){
  const p = new Uint8Array(512); const tmp=[];
  for(let i=0;i<256;i++) tmp[i]=i;
  for(let i=255;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=tmp[i];tmp[i]=tmp[j];tmp[j]=t; }
  for(let i=0;i<512;i++) p[i]=tmp[i&255];
  const g=(h,x,y)=>{ switch(h&3){case 0:return x+y;case 1:return -x+y;case 2:return x-y;default:return -x-y;} };
  const fade=t=>t*t*(3-2*t);
  return function(x,y){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255;
    x-=Math.floor(x); y-=Math.floor(y);
    const u=fade(x), v=fade(y);
    const a=p[X]+Y, b=p[X+1]+Y;
    return (g(p[a],x,y)*(1-u)+g(p[b],x-1,y)*u)*(1-v) +
           (g(p[a+1],x,y-1)*(1-u)+g(p[b+1],x-1,y-1)*u)*v;
  };
}

// ---------------- name bank ----------------
// Cropped GNIS-style roots (suffix fragments + evocative stems). Each used once per chart.
const ROOTS = ("wick ton bury ford ham stead mere cliffe ness bourne gate pool dale holm shaw holt den " +
"combe tor garth fell mouth haven ley ing by thorpe thwaite keld gill beck firth ayre voe geo taing hope " +
"side well croft stow minster chester caster porth rill hale may gull thorn kestrel wren alder bramble " +
"heather moss fern sedge reed drift foam spray tide gale mist storm calm rowan yew ash oak elm birch " +
"willow spruce fir larch holly ivy nettle sorrel teal dunlin curlew plover oyster mussel whelk limpet " +
"crab herring mackerel cod skate seal otter fox badger hare stag rook crow raven jay lark pipit tern " +
"petrel fulmar auk puffin heron egret swan snipe").split(" ");
const SAINTS = ["anselm","brendan","ives","malo","aubyn","columba","cuthbert","hilda","aidan","bede",
"oswald","edmund","agnes","lucia","martin","nicholas","justus","sennen","perran","kew"];
const ADJ = ["hollow","still","deep","salt","black","white","red","grey","green","fair","foul","blind",
"false","long","narrow","north","south","east","west","upper","lower","outer","inner","high","broad",
"sheer","rocky","sandy","stony","cold","misty","wild","tame","crooked","split","twin","lone","elder"];
const WATERWORDS = ["bay","harbor","sound","cove","inlet","bight","reach","gut","roads","creek","bar",
"flat","bank","deep","hole","ledge","marsh","haven","firth"];
const CAPEWORDS = ["head","point","ness","bluff","tor","crag"];
const SETTLE_PRE = ["Port","Fort","Old","New","Little","Great"];

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function makeNamer(){
  const usedRoots = new Set(), usedNames = new Set(), usedSaints = new Set();
  function root(){
    for(let t=0;t<400;t++){ const r=pick(ROOTS); if(!usedRoots.has(r)){ usedRoots.add(r); return r; } }
    return "mere"+ri(2,99);
  }
  function saint(){
    for(let t=0;t<100;t++){ const s=pick(SAINTS); if(!usedSaints.has(s)){ usedSaints.add(s); return s; } }
    return "brendan";
  }
  function adj(){
    for(let t=0;t<200;t++){ const a=pick(ADJ); if(!usedRoots.has("~"+a)){ usedRoots.add("~"+a); return a; } }
    return "grey";
  }
  function uniq(name){
    if(usedNames.has(name)) return null;
    usedNames.add(name); return name;
  }
  function settlement(){
    for(let t=0;t<60;t++){
      const k = rng(); let n;
      if(k<0.14){ n = (rng()<0.6?"St. ":"San ") + cap(saint()); }
      else if(k<0.22){ n = "Santa " + cap(saint()); }
      else { n = pick(SETTLE_PRE) + " " + cap(root()); }
      const u = uniq(n); if(u) return u;
    }
    return "Port " + cap(root()) + ri(2,9);
  }
  function waterWord(){ return pick(WATERWORDS); }
  const WATER_BAD=new Set(['by','ing','ley','den','hope','side','well','pool']);
  function waterRoot(){
    for(let t=0;t<80;t++){ const r=root(); if(!WATER_BAD.has(r)) return r; }
    return "mere";
  }
  function water(){ // bay / cove / harbor / ...
    for(let t=0;t<60;t++){
      const w = waterWord(); let n;
      const k = rng();
      if(k<0.45){ let a=adj(); if(a===w) a=adj(); n = cap(a) + " " + cap(w); }
      else if(k<0.8) n = cap(waterRoot()) + " " + cap(w);
      else n = "The " + cap(adj()) + " " + cap(w);
      const u = uniq(n); if(u) return u;
    }
    return cap(waterRoot()) + " Bay";
  }
  function capeWord(){ return pick(CAPEWORDS); }
  const CAPE_BAD=new Set(['gate','pool','mere','den','hope','side','well','ley','ing','shaw','holt','by']);
  function capeRoot(){
    for(let t=0;t<80;t++){ const r=root(); if(!CAPE_BAD.has(r)) return r; }
    return "wick";
  }
  function cape(){
    for(let t=0;t<60;t++){
      const k = rng(); let n; const w = capeWord();
      if(k<0.4) n = "Cape " + cap(capeRoot());
      else if(k<0.7){
        const pre = (w==="point"||w==="head"||w==="ness") ? "" : (rng()<0.5?"Point ":"");
        n = pre + cap(capeRoot()) + " " + cap(w);
      }
      else n = cap(capeRoot()) + " " + cap(w);
      const u = uniq(n); if(u) return u;
    }
    return "Cape " + cap(root());
  }
  const PEAK_BAD=new Set(['ing','by','ley','den','hope','side','pool','mere','gate','well','ness','ton']);
  function peakRoot(){
    for(let t=0;t<80;t++){ const r=root(); if(!PEAK_BAD.has(r)) return r; }
    return "hale";
  }
  function peak(){
    for(let t=0;t<60;t++){
      const n = (rng()<0.5?"Mt. ":"Mount ") + cap(peakRoot());
      const u = uniq(n); if(u) return {name:u, ft: ri(4,28)*100 + ri(0,9)*10};
    }
    return {name:"Mt. "+cap(peakRoot()), ft:1240};
  }
  function reef(){
    for(let t=0;t<60;t++){
      const k=rng(); let n;
      if(k<0.5) n = cap(root()) + " Reef";
      else if(k<0.75) n = cap(adj()) + " Reef";
      else n = cap(root()) + " Rock";
      const u = uniq(n); if(u) return u;
    }
    return cap(root()) + " Reef";
  }
  function shoal(){
    for(let t=0;t<60;t++){
      const n = (rng()<0.6?cap(adj()):cap(root())) + " Shoal" + (rng()<0.25?"s":"");
      const u = uniq(n); if(u) return u;
    }
    return cap(adj()) + " Shoal";
  }
  function channel(){
    for(let t=0;t<60;t++){
      const k=rng(); let n;
      if(k<0.5) n = cap(root()) + " Channel";
      else if(k<0.8) n = cap(root()) + " Sound";
      else n = "The " + cap(adj()) + " Passage";
      const u = uniq(n); if(u) return u;
    }
    return cap(root()) + " Channel";
  }
  const ISLE_BAD=new Set(['by','ing','ley','den','hope','side','well','pool','mere','gate','ton']);
  function isleRoot(){
    for(let t=0;t<80;t++){ const r=root(); if(!ISLE_BAD.has(r)) return r; }
    return "holm";
  }
  function island(big){
    for(let t=0;t<60;t++){
      const k=rng(); let n;
      if(big){ n = k<0.5 ? "Isle of " + cap(isleRoot()) : cap(adj()) + " Isle"; }
      else { n = k<0.6 ? cap(isleRoot()) + " Isle" : cap(adj()) + " Holm"; }
      const u = uniq(n); if(u) return u;
    }
    return cap(isleRoot()) + " Isle";
  }
  return {settlement, water, cape, peak, reef, shoal, channel, island, root, adj, cap};
}

// ---------------- archipelago generation ----------------
const TAU = Math.PI*2;
function angDiff(a,b){ let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }

function blurCircular(r, sigma){
  const n=r.length, out=new Float64Array(n);
  const rad=Math.ceil(sigma*3), w=[];
  let sum=0;
  for(let i=-rad;i<=rad;i++){ const x=Math.exp(-(i*i)/(2*sigma*sigma)); w.push(x); sum+=x; }
  for(let i=0;i<n;i++){ let s=0; for(let k=-rad;k<=rad;k++) s+=r[(i+k+n)%n]*w[k+rad]; out[i]=s/sum; }
  return out;
}

// Radial-noise coastline with embayment dents + erosion smoothing passes.
// Elongated base (ex, ey aspect + rotation) so islands are not potato-round.
function genCoast(cx, cy, R, jag, ex, ey, rot){
  const N=256;
  const comps=[];
  for(let k=1;k<=10;k++){
    const amp = k===1?0.24 : k===2?0.15 : k===3?0.10 : (0.10/Math.pow(k,1.35));
    comps.push({k, a: amp*jag*R, p: rng()*TAU});
  }
  let r=new Float64Array(N);
  for(let i=0;i<N;i++){
    const th=i/N*TAU; let v=0;
    for(const c of comps) v+=c.a*Math.cos(c.k*th+c.p);
    r[i]=R+v;
  }
  // embayment dents (future bays), carved before erosion
  const dents=ri(3,5);
  for(let d=0;d<dents;d++){
    const c0=rng()*TAU, depth=R*rr(0.06,0.15), wdt=rr(0.18,0.38);
    for(let i=0;i<N;i++){
      const th=i/N*TAU, dd=angDiff(th,c0);
      r[i]-=depth*Math.exp(-(dd*dd)/(wdt*wdt));
    }
  }
  // erosion passes: smoothing + headland clipping (promontories erode faster)
  for(let pass=0;pass<2;pass++){
    const s=blurCircular(r,1.7);
    for(let i=0;i<N;i++){
      const over=r[i]-s[i];
      r[i]=s[i]+over*(over>0?0.86:0.97);
    }
  }
  const pts=[];
  const cs=Math.cos(rot), sn=Math.sin(rot);
  for(let i=0;i<N;i++){
    const th=i/N*TAU;
    let px=r[i]*Math.cos(th)*ex, py=r[i]*Math.sin(th)*ey;
    pts.push({x:cx+px*cs-py*sn, y:cy+px*sn+py*cs, r:r[i], th});
  }
  return {cx,cy,R,pts,N,ex,ey,rot};
}

function pointInPoly(x,y,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y;
    if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function distToCoast(x,y,isl){
  let m=1e9;
  for(const p of isl.pts){ const dx=p.x-x,dy=p.y-y; const d=dx*dx+dy*dy; if(d<m)m=d; }
  return Math.sqrt(m);
}
function distToAnyCoast(x,y,islands){
  let m=1e9;
  for(const isl of islands){ const d=distToCoast(x,y,isl); if(d<m)m=d; }
  return m;
}
function insideAnyIsland(x,y,islands,pad){
  for(const isl of islands){
    const dx=x-isl.cx, dy=y-isl.cy;
    const ER=isl.R*Math.max(isl.ex||1,isl.ey||1);
    if(dx*dx+dy*dy < Math.pow(ER*(1.35+(pad||0)),2)) {
      if(pointInPoly(x,y,isl.pts)) return isl;
    }
  }
  return null;
}

function genArchipelago(gx,gy,gw,gh,cart){
  const islands=[];
  const minD = Math.min(gw,gh);
  function elong(){ const e=rr(0.68,1.0); return {ex:rr(1.0,1.42), ey:e, rot:rng()*Math.PI}; }
  function clearOf(x,y,R,extra){
    const ER=R*1.45;
    if(x-ER<gx+8||x+ER>gx+gw-8||y-ER<gy+8||y+ER>gy+gh-8) return false;
    if(cart && x+ER>cart.x-14 && x-ER<cart.x+cart.w+14 && y+ER>cart.y-14 && y-ER<cart.y+cart.h+14) return false;
    for(const o of islands){
      const dx=x-o.cx, dy=y-o.cy;
      if(Math.hypot(dx,dy) < (ER+o.R*1.45)*(1.28+(extra||0))) return false;
    }
    return true;
  }
  // one or two main islands, spread across thirds of the chart
  const mains = rng()<0.55?2:1;
  const thirds = mains===2 ? [[0.06,0.44],[0.56,0.94]] : [[0.25,0.75]];
  let tries=0;
  while(islands.length<mains && tries++<600){
    const R=minD*rr(0.12,0.17);
    const t=pick(thirds);
    const x=rr(gx+gw*t[0],gx+gw*t[1]), y=rr(gy+minD*0.18,gy+gh-minD*0.18);
    if(!clearOf(x,y,R,0.2)) continue;
    const e=elong();
    islands.push(genCoast(x,y,R,rr(1.35,1.7),e.ex,e.ey,e.rot));
  }
  // satellite islets
  const sats=ri(4,7);
  tries=0; let placed=0;
  while(placed<sats && tries++<900){
    const R=minD*rr(0.028,0.075);
    const x=rr(gx+R,gx+gw-R), y=rr(gy+R,gy+gh-R);
    if(!clearOf(x,y,R,0.1)) continue;
    const e=elong();
    islands.push(genCoast(x,y,R,rr(1.5,1.9),e.ex,e.ey,e.rot));
    placed++;
  }
  // guarantee at least 5 landmasses
  tries=0;
  while(islands.length<5 && tries++<900){
    const R=minD*rr(0.03,0.06);
    const x=rr(gx+R,gx+gw-R), y=rr(gy+R,gy+gh-R);
    if(!clearOf(x,y,R,0.1)) continue;
    const e=elong();
    islands.push(genCoast(x,y,R,rr(1.5,1.9),e.ex,e.ey,e.rot));
    placed++;
  }
  islands.sort((a,b)=>b.R-a.R);
  islands.forEach((isl,i)=>{ isl.main = i<mains; });
  return islands;
}

// Feature detection: bays (indented runs), capes (prominent points), gentle shore spots.
function detectFeatures(isl){
  const N=isl.N;
  const base=blurCircular(Float64Array.from(isl.pts.map(p=>p.r)),14);
  const dev=isl.pts.map((p,i)=>p.r-base[i]);
  // bays: runs where coast sits well inside the smoothed baseline
  const bays=[];
  let run=null;
  for(let i=0;i<N+40;i++){
    const k=i%N, d=dev[k];
    const inBay = d < -isl.R*0.035;
    if(inBay){ if(!run) run={start:k,depth:0,at:k}; if(-d>run.depth){run.depth=-d;run.at=k;} }
    else if(run){ if(i-run.start>10) bays.push(run); run=null; }
  }
  bays.sort((a,b)=>b.depth-a.depth);
  // capes: local radius maxima above baseline, spread around the compass
  const capes=[];
  for(let i=0;i<N;i++){
    if(dev[i]>isl.R*0.05){
      let peak=true;
      for(let k=1;k<=6;k++){ if(dev[(i+k)%N]>dev[i]||dev[(i-k+N)%N]>dev[i]){peak=false;break;} }
      if(peak) capes.push({at:i,h:dev[i],th:isl.pts[i].th});
    }
  }
  capes.sort((a,b)=>b.h-a.h);
  const spread=[];
  for(const c of capes){
    if(spread.every(s=>Math.abs(angDiff(s.th,c.th))>0.5)) spread.push(c);
    if(spread.length>=4) break;
  }
  // gentle shore points for settlements (radius near baseline, not in bays)
  const gentle=[];
  for(let i=0;i<N;i+=4){
    if(Math.abs(dev[i])<isl.R*0.035) gentle.push(i);
  }
  if(!gentle.length) for(let i=0;i<N;i+=8) gentle.push(i); // fallback: any shore
  return {bays:bays.slice(0,3), capes:spread, gentle};
}

function coastPoint(isl, idx){
  return isl.pts[((idx%isl.N)+isl.N)%isl.N];
}

// ---------------- rendering ----------------
const canvas=document.getElementById('plate');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const INK='#2a2015', INK_SOFT='#4d4132', CONTOUR='#6f6046', FAINT='#8a7a5c';
const RED='#9c3d2a', PAPER='#e9dab6';

let W=0,H=0,DPR=1, S=1; // S = scale unit = min(W,H)/800
const placed=[];   // label boxes {x,y,w,h}
const reserved=[]; // no-label zones {x,y,w,h}

function boxOverlap(a,b,pad){
  pad=pad||0;
  return a.x-pad<b.x+b.w+pad && a.x+a.w+pad>b.x-pad && a.y-pad<b.y+b.h+pad && a.y+a.h+pad>b.y-pad;
}
function clearOfBoxes(b,pad){
  for(const z of placed) if(boxOverlap(b,z,pad||2)) return false;
  for(const z of reserved) if(boxOverlap(b,z,pad||2)) return false;
  return true;
}

function paper(){
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
  // large tonal blotches (no flat gradients: layered soft ellipses)
  for(let i=0;i<46;i++){
    const x=rng()*W, y=rng()*H, rx=rr(40,260)*S, ry=rr(30,180)*S;
    ctx.fillStyle = rng()<0.5 ? 'rgba(150,118,72,0.045)' : 'rgba(120,110,88,0.05)';
    ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rng()*Math.PI,0,TAU); ctx.fill();
  }
  // faint cool wash over open water feel
  for(let i=0;i<18;i++){
    const x=rng()*W, y=rng()*H, rx=rr(60,220)*S;
    ctx.fillStyle='rgba(126,146,138,0.035)';
    ctx.beginPath(); ctx.ellipse(x,y,rx,rx*rr(0.5,0.8),rng()*Math.PI,0,TAU); ctx.fill();
  }
  // fine grain
  const img=ctx.getImageData(0,0,W,H), d=img.data;
  for(let i=0;i<d.length;i+=4){
    const n=(rng()-0.5)*22;
    d[i]+=n; d[i+1]+=n*0.95; d[i+2]+=n*0.85;
  }
  ctx.putImageData(img,0,0);
  // edge darkening (plate age)
  const eg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  eg.addColorStop(0,'rgba(60,40,18,0)'); eg.addColorStop(1,'rgba(60,40,18,0.16)');
  ctx.fillStyle=eg; ctx.fillRect(0,0,W,H);
}

function border(m){
  ctx.strokeStyle=INK; ctx.lineWidth=Math.max(2,3*S);
  ctx.strokeRect(m,m,W-2*m,H-2*m);
  ctx.lineWidth=Math.max(1,1.2*S);
  ctx.strokeRect(m+7*S,m+7*S,W-2*m-14*S,H-2*m-14*S);
  // corner ornaments: small diamonds
  ctx.fillStyle=INK;
  const c=[[m,m],[W-m,m],[m,H-m],[W-m,H-m]];
  for(const [x,y] of c){
    const d=5*S;
    ctx.beginPath();
    ctx.moveTo(x-d,y); ctx.lineTo(x,y-d); ctx.lineTo(x+d,y); ctx.lineTo(x,y+d);
    ctx.closePath(); ctx.fill();
  }
}

function graticule(gx,gy,gw,gh){
  ctx.save();
  ctx.strokeStyle='rgba(77,65,50,0.35)'; ctx.lineWidth=Math.max(0.6,0.8*S);
  const nx=5, ny=4;
  ctx.font=`${Math.max(9,11*S)}px "IM Fell English", Georgia, serif`;
  ctx.fillStyle=INK_SOFT; ctx.textAlign='center'; ctx.textBaseline='top';
  // fictional but plausible: 41°15'N .. 42°00'N ; 70°45'W .. 69°55'W
  const lat0=41+15/60, lat1=42, lon0=-(70+45/60), lon1=-(69+55/60);
  const flat=i=>{ const v=lat1-(lat1-lat0)*i/ny; const d=Math.floor(v), m2=Math.round((v-d)*60);
    return `${d}\u00B0${String(m2).padStart(2,'0')}\u2032`; };
  const flon=i=>{ const v=-(lon0+(lon1-lon0)*i/nx); const d=Math.floor(v), m2=Math.round((v-d)*60);
    return `${d}\u00B0${String(m2).padStart(2,'0')}\u2032 W`; };
  for(let i=0;i<=nx;i++){
    const x=gx+gw*i/nx;
    ctx.beginPath(); ctx.moveTo(x,gy); ctx.lineTo(x,gy+gh); ctx.stroke();
    const t=flon(i);
    ctx.fillText(t, x, gy+gh+5*S);
    const tw=ctx.measureText(t).width;
    placed.push({x:x-tw/2-3,y:gy+gh-2,w:tw+6,h:20*S});
  }
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=ny;i++){
    const y=gy+gh*i/ny;
    ctx.beginPath(); ctx.moveTo(gx,y); ctx.lineTo(gx+gw,y); ctx.stroke();
    const t=flat(i);
    ctx.fillText(t, gx-6*S, y);
    const tw=ctx.measureText(t).width;
    placed.push({x:gx-6*S-tw-3,y:y-10*S,w:tw+6,h:20*S});
  }
  ctx.restore();
}

// engraved double-stroke helper: main stroke + faint offset echo
function engraveStroke(draw, w, alpha){
  ctx.save();
  ctx.strokeStyle=INK; ctx.lineWidth=w; ctx.globalAlpha=alpha==null?1:alpha;
  draw();
  ctx.translate(0.7*S,-0.5*S); ctx.globalAlpha=(alpha==null?1:alpha)*0.28; ctx.lineWidth=Math.max(0.5,w*0.7);
  draw();
  ctx.restore();
}

function drawBathymetry(isl){
  const factors=[1.07,1.17,1.29,1.43];
  ctx.save();
  factors.forEach((f,fi)=>{
    ctx.strokeStyle=CONTOUR; ctx.lineWidth=Math.max(0.6,(fi===0?1.1:0.8)*S);
    ctx.globalAlpha=fi===0?0.85:0.6;
    ctx.beginPath();
    let pen=false;
    const step=2;
    for(let i=0;i<=isl.N;i+=step){
      const p=isl.pts[i%isl.N];
      const x=isl.cx+(p.x-isl.cx)*f, y=isl.cy+(p.y-isl.cy)*f;
      if(insideAnyIsland(x,y,window.__islands,0.02)){ pen=false; continue; }
      if(!pen){ ctx.moveTo(x,y); pen=true; } else ctx.lineTo(x,y);
    }
    ctx.stroke();
    // seaward hatch ticks on the outer contour
    if(fi===factors.length-1){
      ctx.globalAlpha=0.55; ctx.lineWidth=Math.max(0.5,0.7*S);
      ctx.beginPath();
      for(let i=0;i<isl.N;i+=9){
        const p=isl.pts[i];
        const x=isl.cx+(p.x-isl.cx)*f, y=isl.cy+(p.y-isl.cy)*f;
        if(insideAnyIsland(x,y,window.__islands,0.02)) continue;
        const dx=x-isl.cx, dy=y-isl.cy, L=Math.hypot(dx,dy)||1;
        const tl=rr(4,7)*S;
        ctx.moveTo(x,y); ctx.lineTo(x+dx/L*tl, y+dy/L*tl);
      }
      ctx.stroke();
    }
  });
  ctx.restore();
}

function drawLand(isl){
  ctx.save();
  // land tint: slightly deeper parchment
  ctx.beginPath();
  isl.pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.closePath();
  ctx.fillStyle='rgba(206,178,128,0.55)';
  ctx.fill();
  // faint interior stipple
  ctx.fillStyle='rgba(90,70,45,0.16)';
  const n=Math.floor(isl.R*1.1/S);
  for(let i=0;i<n;i++){
    const a=rng()*TAU, rad=Math.sqrt(rng())*isl.R*0.92;
    const x=isl.cx+rad*Math.cos(a), y=isl.cy+rad*Math.sin(a);
    if(pointInPoly(x,y,isl.pts)) ctx.fillRect(x,y,Math.max(1,1.1*S),Math.max(1,1.1*S));
  }
  engraveStroke(()=>{ ctx.stroke(); }, Math.max(1.2,1.6*S));
  ctx.restore();
}

// hachured relief hills
function drawHills(isl, feats){
  const nHills = isl.main?ri(2,3):(isl.R>40*S?1:0);
  for(let h=0;h<nHills;h++){
    let hx=0,hy=0,ok=false;
    for(let t=0;t<60&&!ok;t++){
      const a=rng()*TAU, rad=rr(0.1,0.45)*isl.R;
      hx=isl.cx+rad*Math.cos(a); hy=isl.cy+rad*Math.sin(a);
      if(distToCoast(hx,hy,isl)>isl.R*0.28) ok=true;
    }
    if(!ok) continue;
    const HR=rr(0.10,0.17)*isl.R;
    ctx.save();
    ctx.strokeStyle=INK_SOFT; ctx.globalAlpha=0.75; ctx.lineWidth=Math.max(0.6,0.9*S);
    const rings=ri(3,5);
    for(let j=1;j<=rings;j++){
      const rad=HR*j/rings;
      ctx.beginPath();
      const wob=makeNoise2D();
      for(let i=0;i<=72;i++){
        const a=i/72*TAU;
        const w2=1+0.14*wob(Math.cos(a)*1.7+h*9, Math.sin(a)*1.7);
        const x=hx+rad*w2*Math.cos(a), y=hy+rad*w2*Math.sin(a);
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.closePath(); ctx.stroke();
      // hachure ticks between rings, pointing downhill (outward)
      if(j<rings){
        ctx.beginPath();
        const ticks=Math.floor(rad/(6*S));
        for(let ti=0;ti<ticks;ti++){
          const a=ti/ticks*TAU+rr(-0.05,0.05);
          const x1=hx+rad*Math.cos(a), y1=hy+rad*Math.sin(a);
          const x2=hx+(rad+rr(3.5,6)*S)*Math.cos(a), y2=hy+(rad+rr(3.5,6)*S)*Math.sin(a);
          ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
    if(h===0) isl.peakAt={x:hx,y:hy};
  }
}

// depth soundings: tiny italic fathom numbers
function drawSoundings(islands, gx,gy,gw,gh){
  ctx.save();
  ctx.fillStyle=INK_SOFT;
  ctx.font=`italic ${Math.max(8,10.5*S)}px "IM Fell English", Georgia, serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const target=Math.floor(gw*gh/(9000*S*S));
  let placedN=0, tries=0;
  while(placedN<target && tries++<target*30){
    const x=rr(gx,gy+0,gx+gw), y=rr(gy,gy+gh);
    if(insideAnyIsland(x,y,islands,0.03)) continue;
    const dc=distToAnyCoast(x,y,islands);
    const depth = dc<40*S ? ri(1,4) : dc<110*S ? ri(3,12) : dc<220*S ? ri(10,24) : ri(20,48);
    const w=ctx.measureText(String(depth)).width;
    const b={x:x-w/2-3,y:y-8*S,w:w+6,h:16*S};
    if(!clearOfBoxes(b,1)) continue;
    ctx.save(); ctx.translate(x,y); ctx.rotate(rr(-0.12,0.12));
    ctx.globalAlpha=0.8; ctx.fillText(String(depth),0,0);
    ctx.restore();
    placed.push(b); placedN++;
  }
  ctx.restore();
}

// ---------------- compass rose ----------------
function drawRose(x,y,R,roses){
  // rhumb lines across the chart
  ctx.save();
  ctx.strokeStyle='rgba(77,65,50,0.30)'; ctx.lineWidth=Math.max(0.5,0.7*S);
  for(let i=0;i<16;i++){
    const a=i/16*TAU + TAU/32;
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(a)*Math.max(W,H)*1.2, y+Math.sin(a)*Math.max(W,H)*1.2);
    ctx.stroke();
  }
  ctx.restore();
  reserved.push({x:x-R-6,y:y-R-6,w:2*R+12,h:2*R+12});
  ctx.save();
  ctx.translate(x,y);
  // rings
  ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1,1.4*S);
  ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.stroke();
  ctx.lineWidth=Math.max(0.6,0.8*S);
  ctx.beginPath(); ctx.arc(0,0,R*0.86,0,TAU); ctx.stroke();
  // degree ticks
  for(let i=0;i<72;i++){
    const a=i/72*TAU, l=(i%18===0)?R*0.14:R*0.07;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*R*0.86,Math.sin(a)*R*0.86);
    ctx.lineTo(Math.cos(a)*(R*0.86-l),Math.sin(a)*(R*0.86-l));
    ctx.stroke();
  }
  // 32 star points
  for(let i=0;i<32;i++){
    const a=i/32*TAU - Math.PI/2;
    const long=i%8===0, mid=i%8===4;
    const L=long?R*0.8:(mid?R*0.55:R*0.34);
    const wdt=(long?0.055:0.035);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a-wdt)*L,Math.sin(a-wdt)*L);
    ctx.lineTo(Math.cos(a)*L*1.0,Math.sin(a)*L*1.0);
    ctx.lineTo(Math.cos(a+wdt)*L,Math.sin(a+wdt)*L);
    ctx.closePath();
    if(i%2===0){ ctx.fillStyle=(i===0?RED:INK); ctx.globalAlpha=i===0?0.85:0.9; ctx.fill(); ctx.globalAlpha=1; }
    else { ctx.strokeStyle=INK; ctx.lineWidth=Math.max(0.6,0.8*S); ctx.stroke(); }
  }
  ctx.fillStyle=PAPER;
  ctx.beginPath(); ctx.arc(0,0,R*0.10,0,TAU); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=Math.max(0.8,1*S);
  ctx.beginPath(); ctx.arc(0,0,R*0.10,0,TAU); ctx.stroke();
  // cardinal letters
  ctx.fillStyle=INK;
  ctx.font=`${Math.max(12,17*S)}px "IM Fell English SC", "IM Fell English", Georgia, serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const LR=R*1.22;
  ctx.fillText('N',0,-LR); ctx.fillText('S',0,LR);
  ctx.fillText('E',LR,0); ctx.fillText('W',-LR,0);
  // fleur-de-lis-ish north mark
  ctx.save(); ctx.translate(0,-R*0.98);
  ctx.fillStyle=RED; ctx.globalAlpha=0.9;
  ctx.beginPath();
  ctx.moveTo(0,-9*S); ctx.lineTo(3.4*S,2*S); ctx.lineTo(0,-1.5*S); ctx.lineTo(-3.4*S,2*S);
  ctx.closePath(); ctx.fill();
  ctx.restore(); ctx.globalAlpha=1;
  ctx.restore();
  roses.push({x,y,R});
}

// ---------------- cartouche ----------------
function drawCartouche(cart){
  const {x,y,w,h}=cart;
  ctx.save();
  // double rule + corner dots
  ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1.6,2.2*S);
  ctx.strokeRect(x,y,w,h);
  ctx.lineWidth=Math.max(0.7,1*S);
  ctx.strokeRect(x+5*S,y+5*S,w-10*S,h-10*S);
  ctx.fillStyle=INK;
  for(const [cx,cy] of [[x,y],[x+w,y],[x,y+h],[x+w,y+h]]){
    ctx.beginPath(); ctx.arc(cx,cy,3.4*S,0,TAU); ctx.fill();
  }
  ctx.textAlign='center';
  const cx=x+w/2;
  ctx.fillStyle=INK;
  ctx.font=`${Math.max(15,26*S)}px "IM Fell English SC", Georgia, serif`;
  if(ctx.letterSpacing!==undefined) ctx.letterSpacing='4px';
  ctx.textBaseline='alphabetic';
  ctx.fillText('THE NEVER ISLES', cx, y+34*S);
  if(ctx.letterSpacing!==undefined) ctx.letterSpacing='1px';
  ctx.strokeStyle=INK_SOFT; ctx.lineWidth=Math.max(0.6,0.8*S);
  ctx.beginPath(); ctx.moveTo(x+w*0.18,y+42*S); ctx.lineTo(x+w*0.82,y+42*S); ctx.stroke();
  ctx.font=`italic ${Math.max(10,14.5*S)}px "IM Fell English", Georgia, serif`;
  ctx.fillStyle=INK_SOFT;
  ctx.fillText('A Chart of the Coasts, Harbours & Soundings', cx, y+58*S);
  // scale bar of leagues
  const bw=Math.min(w*0.52, 300*S), bx=cx-bw/2, by=y+78*S;
  ctx.font=`${Math.max(9,12*S)}px "IM Fell English", Georgia, serif`;
  ctx.fillStyle=INK; ctx.fillText('Scale of Leagues', cx, by-8*S);
  const leagues=4, seg=bw/leagues;
  for(let i=0;i<leagues;i++){
    ctx.fillStyle=i%2?PAPER:INK;
    ctx.fillRect(bx+i*seg,by,seg,7*S);
    ctx.strokeStyle=INK; ctx.lineWidth=Math.max(0.6,0.8*S);
    ctx.strokeRect(bx+i*seg,by,seg,7*S);
  }
  // half-league subdivisions on first segment
  ctx.beginPath();
  ctx.moveTo(bx+seg/2,by); ctx.lineTo(bx+seg/2,by+7*S);
  ctx.stroke();
  ctx.font=`${Math.max(8,10*S)}px "IM Fell English", Georgia, serif`;
  ctx.fillStyle=INK_SOFT;
  for(let i=0;i<=leagues;i++) ctx.fillText(String(i), bx+i*seg, by+19*S);
  // sepia-red seal
  const sx=x+w-26*S, sy=y+26*S, sr2=15*S;
  ctx.save();
  ctx.strokeStyle=RED; ctx.globalAlpha=0.8; ctx.lineWidth=Math.max(1.2,1.8*S);
  ctx.beginPath(); ctx.arc(sx,sy,sr2,0,TAU); ctx.stroke();
  ctx.lineWidth=Math.max(0.6,0.9*S);
  ctx.beginPath(); ctx.arc(sx,sy,sr2*0.72,0,TAU); ctx.stroke();
  // tiny anchor glyph
  ctx.beginPath();
  ctx.moveTo(sx,sy-6*S); ctx.lineTo(sx,sy+5*S);
  ctx.moveTo(sx-4.5*S,sy-3.5*S); ctx.lineTo(sx+4.5*S,sy-3.5*S);
  ctx.moveTo(sx-5.5*S,sy+1*S); ctx.quadraticCurveTo(sx,sy+8*S,sx+5.5*S,sy+1*S);
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// ---------------- labels ----------------
const SERIF='"IM Fell English", Georgia, serif';
const SERIF_SC='"IM Fell English SC", "IM Fell English", Georgia, serif';

function labelBox(text,x,y,font,ls,align){
  ctx.save();
  ctx.font=font;
  if(ctx.letterSpacing!==undefined) ctx.letterSpacing=(ls||'0')+'px';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  const w=ctx.measureText(text).width;
  ctx.restore();
  const m=parseFloat((font.match(/([\d.]+)px/)||[])[1]||12);
  let bx=x-w/2; if(align==='left')bx=x; if(align==='right')bx=x-w;
  return {x:bx-3,y:y-m*0.7-3,w:w+6,h:m*1.4+6};
}
function drawLabel(text,x,y,o){
  o=o||{};
  const font=o.font||`${Math.max(10,13*S)}px ${SERIF}`;
  const b=labelBox(text,x,y,font,o.ls,o.align);
  // try small nudges; `search` widens the grid for hard placements (2 = widest)
  const R2=o.search===2?92*S:(o.search?46*S:18*S), step=o.search===2?12*S:9*S;
  const tries=[[0,0]];
  for(let rad=step;rad<=R2+0.01;rad+=step){
    const n=Math.max(4,Math.floor(rad/step)*4);
    for(let k=0;k<n;k++){ const a=k/n*TAU; tries.push([Math.cos(a)*rad,Math.sin(a)*rad]); }
  }
  for(const [dx,dy] of tries){
    const bb={x:b.x+dx,y:b.y+dy,w:b.w,h:b.h};
    if(o.water && insideAnyIsland(x+dx,y+dy,window.__islands,0)) continue;
    if(o.inside && !o.inside(x+dx,y+dy)) continue;
    if(clearOfBoxes(bb,2)){
      ctx.save();
      ctx.font=font;
      if(ctx.letterSpacing!==undefined) ctx.letterSpacing=((o.ls||0))+'px';
      ctx.textAlign=o.align||'center'; ctx.textBaseline='middle';
      ctx.fillStyle=o.color||INK;
      if(o.rotate){ ctx.translate(x+dx,y+dy); ctx.rotate(o.rotate); ctx.fillText(text,0,0); }
      else ctx.fillText(text,x+dx,y+dy);
      ctx.restore();
      placed.push(bb);
      return {x:x+dx,y:y+dy,ok:true};
    }
  }
  return {ok:false};
}

function layoutLabels(islands, namer, gx,gy,gw,gh){
  const settlements=[]; // for rhumb tracks
  // --- island names first, so settlements and peaks lay out around them ---
  for(const isl of islands){
    const nm=namer.island(isl.main);
    let nx=isl.cx, ny=isl.cy;
    if(isl.peakAt){
      const dx=isl.cx-isl.peakAt.x, dy=isl.cy-isl.peakAt.y, L=Math.hypot(dx,dy)||1;
      nx=isl.cx+dx/L*isl.R*0.30; ny=isl.cy+dy/L*isl.R*0.30;
    }
    if(isl.main || isl.R>52*S){
      const o={font:`${Math.max(11,15*S)}px ${SERIF_SC}`, ls:3, color:INK_SOFT,
        search:isl.main?2:true, inside:(x,y)=>pointInPoly(x,y,isl.pts)};
      drawLabel(nm, nx, ny, o);
    } else {
      drawLabel(nm, isl.cx, isl.cy - isl.R*Math.max(isl.ex||1,isl.ey||1) - 10*S,
        {font:`${Math.max(9,11.5*S)}px ${SERIF_SC}`, ls:2, color:INK_SOFT, search:true});
    }
  }
  // --- per-island features ---
  for(const isl of islands){
    const feats=isl.feats;
    // bays: italic water labels just offshore of the indentation
    // (small islets keep only their name: no room for a legible bay label)
    if(isl.R<(isl.main?0:52*S)) { /* too small to label a bay legibly */ }
    else for(const bay of feats.bays.slice(0, isl.main?3:1)){
      const p=coastPoint(isl,bay.at);
      let dx=p.x-isl.cx, dy=p.y-isl.cy; const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
      // march outward until clear water; give up if the bay is landlocked
      let t=isl.R*0.40, guard=0;
      while(t<isl.R*1.7 && insideAnyIsland(p.x+dx*t,p.y+dy*t,window.__islands,0) && guard++<24) t+=isl.R*0.12;
      if(insideAnyIsland(p.x+dx*t,p.y+dy*t,window.__islands,0)) continue;
      const nm=namer.water();
      drawLabel(nm, p.x+dx*t, p.y+dy*t,
        {font:`italic ${Math.max(10,13*S)}px ${SERIF}`, color:INK_SOFT, water:true, search:true});
    }
    // capes at extremities
    for(const c of feats.capes.slice(0, isl.main?3:1)){
      const p=coastPoint(isl,c.at);
      const dx=p.x-isl.cx, dy=p.y-isl.cy, L=Math.hypot(dx,dy)||1;
      const nm=namer.cape();
      drawLabel(nm, p.x+dx/L*isl.R*0.32, p.y+dy/L*isl.R*0.32,
        {font:`${Math.max(9.5,12.5*S)}px ${SERIF}`, color:INK});
    }
    // settlements: dot on a gentle shore + small-caps label inland
    const nSet = isl.main?2:(isl.R>46*S?1:0);
    const usedIdx=new Set();
    for(let s=0;s<nSet;s++){
      let idx=null;
      for(let t=0;t<60&&idx===null;t++){
        const c=pick(feats.gentle);
        if(c!==undefined && !usedIdx.has(c)){ usedIdx.add(c); idx=c; }
      }
      if(idx===null||idx===undefined) continue;
      const p=coastPoint(isl,idx);
      const dx=isl.cx-p.x, dy=isl.cy-p.y, L=Math.hypot(dx,dy)||1;
      // dot at shore
      ctx.save(); ctx.fillStyle=INK;
      ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(1.6,2.4*S),0,TAU); ctx.fill(); ctx.restore();
      const nm=namer.settlement();
      const r=drawLabel(nm, p.x+dx/L*isl.R*0.55, p.y+dy/L*isl.R*0.55,
        {font:`${Math.max(9.5,12.5*S)}px ${SERIF_SC}`, ls:2.5, color:INK, search:true});
      if(r.ok) settlements.push({x:p.x,y:p.y,isl});
    }
    // peaks
    if(isl.peakAt && (isl.main || rng()<0.4)){
      const pk=namer.peak();
      const {x,y}=isl.peakAt;
      ctx.save(); ctx.strokeStyle=INK; ctx.lineWidth=Math.max(0.8,1.1*S);
      const ts=5*S;
      ctx.beginPath(); ctx.moveTo(x,y-ts); ctx.lineTo(x+ts,y+ts*0.8); ctx.lineTo(x-ts,y+ts*0.8); ctx.closePath(); ctx.stroke();
      ctx.restore();
      drawLabel(`${pk.name} ${pk.ft.toLocaleString('en-US')} ft`, x, y-16*S,
        {font:`${Math.max(9,11.5*S)}px ${SERIF}`, color:INK, search:true});
    }
  }
  // --- reefs & shoals ---
  for(const isl of islands){
    if(!isl.main && rng()<0.45 && isl.R>30*S){
      const p=pick(isl.pts);
      const dx=p.x-isl.cx, dy=p.y-isl.cy, L=Math.hypot(dx,dy)||1;
      const rx=p.x+dx/L*isl.R*rr(0.35,0.6), ry=p.y+dy/L*isl.R*rr(0.35,0.6);
      if(!clearOfBoxes({x:rx-20*S,y:ry-24*S,w:40*S,h:48*S},6)) continue;
      ctx.save(); ctx.fillStyle=INK_SOFT; ctx.globalAlpha=0.85;
      for(let d=0;d<7;d++){
        const a=rng()*TAU, dd=rr(2,12)*S;
        ctx.beginPath(); ctx.arc(rx+Math.cos(a)*dd, ry+Math.sin(a)*dd, Math.max(0.8,1.3*S),0,TAU); ctx.fill();
      }
      ctx.restore();
      drawLabel(namer.reef(), rx, ry-14*S, {font:`italic ${Math.max(9,11.5*S)}px ${SERIF}`, color:INK_SOFT});
    }
  }
  const nShoal=ri(1,2);
  for(let s=0;s<nShoal;s++){
    let sx=0,sy=0,ok=false;
    for(let t=0;t<80&&!ok;t++){
      sx=rr(gx+40*S,gx+gw-40*S); sy=rr(gy+40*S,gy+gh-40*S);
      if(!insideAnyIsland(sx,sy,islands,0.25) && distToAnyCoast(sx,sy,islands)>50*S) ok=true;
    }
    if(!ok) continue;
    const ex=rr(24,44)*S, ey=ex*rr(0.5,0.75);
    ctx.save();
    ctx.strokeStyle=CONTOUR; ctx.globalAlpha=0.7; ctx.lineWidth=Math.max(0.6,0.8*S);
    ctx.setLineDash([3*S,3*S]);
    ctx.beginPath(); ctx.ellipse(sx,sy,ex,ey,rr(0,Math.PI),0,TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=INK_SOFT; ctx.globalAlpha=0.5;
    for(let d=0;d<26;d++){
      const a=rng()*TAU, dd=Math.sqrt(rng());
      ctx.fillRect(sx+Math.cos(a)*dd*ex*0.9, sy+Math.sin(a)*dd*ey*0.9, Math.max(1,1.2*S), Math.max(1,1.2*S));
    }
    ctx.restore();
    drawLabel(namer.shoal(), sx, sy-ey-12*S, {font:`italic ${Math.max(9,11.5*S)}px ${SERIF}`, color:INK_SOFT});
  }
  // --- channel between closest island pair ---
  let best=null;
  for(let i=0;i<islands.length;i++) for(let j=i+1;j<islands.length;j++){
    const a=islands[i], b=islands[j];
    let md=1e9, pa=null, pb=null;
    for(const p of a.pts) for(let k=0;k<b.pts.length;k+=6){
      const q=b.pts[k]; const d=(p.x-q.x)**2+(p.y-q.y)**2;
      if(d<md){md=d;pa=p;pb=q;}
    }
    md=Math.sqrt(md);
    if(md < (a.R+b.R)*1.1 && (!best || md<best.d)) best={d:md,pa,pb};
  }
  if(best){
    const mx=(best.pa.x+best.pb.x)/2, my=(best.pa.y+best.pb.y)/2;
    const ang=Math.atan2(best.pb.y-best.pa.y, best.pb.x-best.pa.x)+Math.PI/2;
    drawLabel(namer.channel(), mx, my, {font:`italic ${Math.max(10,13.5*S)}px ${SERIF}`, color:INK_SOFT, rotate:ang});
  }
  // --- the great water is drawn in build(), before soundings ---
  // --- dashed rhumb tracks between settlements on different islands ---
  ctx.save();
  ctx.strokeStyle=INK_SOFT; ctx.globalAlpha=0.7; ctx.lineWidth=Math.max(0.8,1.1*S);
  ctx.setLineDash([7*S,5*S]);
  let tracks=0;
  for(let i=0;i<settlements.length&&tracks<3;i++) for(let j=i+1;j<settlements.length&&tracks<3;j++){
    const a=settlements[i], b=settlements[j];
    if(a.isl===b.isl) continue;
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
    const sag=L*0.12*(rng()<0.5?1:-1);
    const cxp=mx-dy/L*sag, cyp=my+dx/L*sag;
    // skip tracks that would cross a third island
    let crosses=false;
    for(let s=1;s<10;s++){
      const t=s/10;
      const px=(1-t)*(1-t)*a.x+2*(1-t)*t*cxp+t*t*b.x;
      const py=(1-t)*(1-t)*a.y+2*(1-t)*t*cyp+t*t*b.y;
      const hit=insideAnyIsland(px,py,window.__islands,0);
      if(hit && hit!==a.isl && hit!==b.isl){ crosses=true; break; }
    }
    if(crosses) continue;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(cxp, cyp, b.x, b.y);
    ctx.stroke();
    tracks++;
  }
  ctx.restore();
}

// The great water: THE NEVER SEA over the largest open reach.
// Called before soundings so depth numbers keep clear of it.
function drawSeaLabel(islands, namer, gx,gy,gw,gh){
  const cands=[];
  for(let ix=0;ix<36;ix++) for(let iy=0;iy<24;iy++){
    const x=gx+gw*(ix+0.5)/36, y=gy+gh*(iy+0.5)/24;
    if(insideAnyIsland(x,y,islands,0.1)) continue;
    if(!clearOfBoxes({x:x-4,y:y-4,w:8,h:8},4)) continue;
    cands.push({x,y,d:distToAnyCoast(x,y,islands)});
  }
  cands.sort((a,b)=>b.d-a.d);
  const font=`${28*S}px ${SERIF_SC}`;
  const lspx=9*S;
  ctx.save(); ctx.font=font;
  if(ctx.letterSpacing!==undefined) ctx.letterSpacing=lspx+'px';
  const tw=ctx.measureText('THE NEVER SEA').width; ctx.restore();
  // the text rect must not cross any island: sample across its width
  function seaFits(bx,by){
    for(let k=0;k<=8;k++){
      const x=bx-tw/2+tw*k/8;
      if(insideAnyIsland(x,by,window.__islands,0.02)) return false;
    }
    return true;
  }
  for(const c of cands.slice(0,8)){
    if(c.d<40*S) break;
    const bx=Math.max(gx+tw/2+10*S, Math.min(gx+gw-tw/2-10*S, c.x));
    if(!seaFits(bx,c.y)) continue;
    const r=drawLabel('THE NEVER SEA', bx, c.y, {font, ls:lspx, color:'rgba(77,65,50,0.55)'});
    if(r.ok) return;
  }
}

// ---------------- build ----------------
function build(){
  placed.length=0; reserved.length=0;
  rng = mulberry32(xmur3(SEED)()); // idempotent: every build from the same seed is identical
  const dpr=Math.min(2,window.devicePixelRatio||1);
  DPR=dpr;
  W=window.innerWidth; H=window.innerHeight;
  S=Math.min(W,H)/800;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const namer=makeNamer();
  paper();
  const m=Math.max(14,Math.min(W,H)*0.035);
  border(m);
  const gx=m+22*S, gy=m+22*S, gw=W-2*(m+22*S), gh=H-2*(m+22*S);

  // cartouche sized to fit its title, reserved before islands are placed
  ctx.save();
  ctx.font=`${Math.max(15,26*S)}px "IM Fell English SC", Georgia, serif`;
  if(ctx.letterSpacing!==undefined) ctx.letterSpacing='4px';
  const titleW=ctx.measureText('THE NEVER ISLES').width;
  ctx.restore();
  const cw=Math.min(gw*0.94, Math.max(gw*0.44, titleW+84*S));
  const ch=Math.max(cw*0.44, 108*S);
  const cart={x:gx+6*S, y:gy+gh-ch-6*S, w:cw, h:ch};
  reserved.push({x:cart.x-8,y:cart.y-8,w:cart.w+16,h:cart.h+16});

  const islands=genArchipelago(gx,gy,gw,gh,cart);
  window.__islands=islands;
  for(const isl of islands) isl.feats=detectFeatures(isl);

  graticule(gx,gy,gw,gh);
  // compass roses in open water (found after islands exist)
  const roses=[];
  function openSpot(rad){
    let ox=0,oy=0,od=0;
    for(let t=0;t<400;t++){
      const x=rr(gx+rad,gx+gw-rad), y=rr(gy+rad,gy+gh-rad);
      if(x+rad>cart.x-10&&x-rad<cart.x+cart.w+10&&y+rad>cart.y-10&&y-rad<cart.y+cart.h+10) continue;
      if(insideAnyIsland(x,y,islands,0.35)) continue;
      const d=distToAnyCoast(x,y,islands);
      if(d>od){od=d;ox=x;oy=y;}
    }
    return od>rad*0.85?{x:ox,y:oy}:null;
  }
  const rR=Math.min(W,H)*0.085;
  const s1=openSpot(rR);
  let s2=null;
  if(s1){
    // second rose: best open spot well clear of the first
    const rad2=rR*0.8;
    let od=0;
    for(let t=0;t<400;t++){
      const x=rr(gx+rad2,gx+gw-rad2), y=rr(gy+rad2,gy+gh-rad2);
      if(Math.hypot(x-s1.x,y-s1.y)<rR*3.2) continue;
      if(x+rad2>cart.x-10&&x-rad2<cart.x+cart.w+10&&y+rad2>cart.y-10&&y-rad2<cart.y+cart.h+10) continue;
      if(insideAnyIsland(x,y,islands,0.35)) continue;
      const d=distToAnyCoast(x,y,islands);
      if(d>od){od=d;s2={x,y};}
    }
    if(od<rad2*0.85) s2=null;
  } else { const q=openSpot(rR*0.8); if(q) s2=q; }
  if(s1) drawRose(s1.x,s1.y,rR,roses);
  if(s2) drawRose(s2.x,s2.y,rR*0.8,roses);

  for(const isl of islands) drawBathymetry(isl);
  for(const isl of islands) drawLand(isl);
  for(const isl of islands) drawHills(isl);
  drawSeaLabel(islands, namer, gx,gy,gw,gh);
  drawSoundings(islands,gx,gy,gw,gh);
  layoutLabels(islands,namer,gx,gy,gw,gh);
  drawCartouche(cart);

  // plate caption: regeneration hint
  ctx.save();
  ctx.font=`italic ${Math.max(9,11*S)}px ${SERIF}`;
  ctx.fillStyle='rgba(77,65,50,0.75)';
  ctx.textAlign='right'; ctx.textBaseline='alphabetic';
  ctx.fillText('click to rechart', W-m-12*S, H-m-11*S);
  ctx.restore();

  window.__ready=true;
}

function boot(){
  build();
  if(document.fonts && document.fonts.ready){
    let done=false;
    document.fonts.ready.then(()=>{ if(!done){done=true; build();} });
    setTimeout(()=>{ if(!done){done=true; build();} }, 2500);
  }
}
canvas.addEventListener('click', ()=>{
  const words=['gull','salt','brine','wrack','kestrel','tide','fog','kelp','dune','skerry','marrow','cinder'];
  const s=pick(words)+'-'+pick(words)+'-'+ri(10,99);
  history.replaceState(null,'','?seed='+s);
  reseed(s); boot();
});
boot();
</script>
