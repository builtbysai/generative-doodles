<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Forest Within Me</title>
<style>
  html, body { margin: 0; padding: 0; background: #101511; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (strict, adolfo-serra block 7)
  var DEEP = '#101511', MOSS = '#5A6E4C', BARK = '#3A3129', CREAM = '#EDE6D6', AMBER = '#D9A441';

  function hx(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  function mix(c1, c2, f) {
    var a = hx(c1), b = hx(c2);
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
  }
  function rgba(c, al) { var a = hx(c); return 'rgba(' + a[0] + ',' + a[1] + ',' + a[2] + ',' + al + ')'; }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var SEED = 615074;
  var W = 0, H = 0, DPR = 1, PHONE = false, MIN = 0;

  // Scene data (rebuilt on resize, always from the fixed seed)
  var pathPts = [], pathCum = [], pathLen = 1;
  var layers = [];       // 4 forest depth layers, back to front
  var frags = [];        // memory fragments
  var birds = [];        // released motif birds (interaction only)
  var LAYER_DEPTH = [0.15, 0.4, 0.7, 1.0];

  function catmull(p0, p1, p2, p3, t) {
    var t2 = t * t, t3 = t2 * t;
    return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
  }

  function buildPath() {
    var ctrl = [
      [0.05, 0.99], [0.30, 0.82], [0.21, 0.60], [0.47, 0.48], [0.60, 0.30], [0.80, 0.16], [0.96, 0.05]
    ].map(function (p) { return [p[0] * W, p[1] * H]; });
    pathPts = [];
    var N = 260;
    for (var i = 0; i <= N; i++) {
      var u = i / N * (ctrl.length - 1);
      var k = Math.min(ctrl.length - 2, Math.floor(u));
      var t = u - k;
      var p0 = ctrl[Math.max(0, k - 1)], p1 = ctrl[k], p2 = ctrl[k + 1], p3 = ctrl[Math.min(ctrl.length - 1, k + 2)];
      pathPts.push([catmull(p0[0], p1[0], p2[0], p3[0], t), catmull(p0[1], p1[1], p2[1], p3[1], t)]);
    }
    pathCum = [0];
    for (var j = 1; j < pathPts.length; j++) {
      var dx = pathPts[j][0] - pathPts[j - 1][0], dy = pathPts[j][1] - pathPts[j - 1][1];
      pathCum.push(pathCum[j - 1] + Math.sqrt(dx * dx + dy * dy));
    }
    pathLen = pathCum[pathCum.length - 1];
  }

  function pathAt(u) { // u in [0,1] by arc length -> [x, y, angle]
    var d = u * pathLen;
    var lo = 0, hi = pathCum.length - 1;
    while (lo < hi - 1) { var mid = (lo + hi) >> 1; if (pathCum[mid] <= d) lo = mid; else hi = mid; }
    var seg = pathCum[hi] - pathCum[lo] || 1, f = (d - pathCum[lo]) / seg;
    var x = pathPts[lo][0] + (pathPts[hi][0] - pathPts[lo][0]) * f;
    var y = pathPts[lo][1] + (pathPts[hi][1] - pathPts[lo][1]) * f;
    var ang = Math.atan2(pathPts[hi][1] - pathPts[lo][1], pathPts[hi][0] - pathPts[lo][0]);
    return [x, y, ang];
  }

  function distToPath(x, y) {
    var best = 1e9;
    for (var i = 0; i < pathPts.length; i += 3) {
      var dx = pathPts[i][0] - x, dy = pathPts[i][1] - y, d = dx * dx + dy * dy;
      if (d < best) best = d;
    }
    return Math.sqrt(best);
  }

  function genTree(rng, scale, colMain, colDark) {
    var segs = [], tips = [];
    function branch(x, y, ang, len, wid, depth) {
      var bend = (rng() - 0.5) * 0.35;
      var mx = x + Math.cos(ang + bend * 0.5) * len * 0.55, my = y + Math.sin(ang + bend * 0.5) * len * 0.55;
      var ex = x + Math.cos(ang + bend) * len, ey = y + Math.sin(ang + bend) * len;
      segs.push({ x1: x, y1: y, mx: mx, my: my, x2: ex, y2: ey, w: wid });
      if (depth <= 0 || len < 4) { tips.push([ex, ey]); return; }
      var n = rng() < 0.22 ? 3 : 2;
      for (var i = 0; i < n; i++) {
        var spread = (i - (n - 1) / 2) * (0.38 + rng() * 0.3) + (rng() - 0.5) * 0.15;
        branch(ex, ey, ang + bend + spread, len * (0.68 + rng() * 0.18), Math.max(0.7, wid * 0.62), depth - 1);
      }
      if (rng() < 0.3) tips.push([ex, ey]);
    }
    branch(0, 0, -Math.PI / 2 + (rng() - 0.5) * 0.3, 34 * scale, 7.5 * scale, 5);
    var tufts = [];
    for (var i = 0; i < tips.length; i++) {
      if (rng() < 0.55) tufts.push({ x: tips[i][0], y: tips[i][1], r: (7 + rng() * 13) * scale });
    }
    var ferns = 3 + Math.floor(rng() * 3), fern = [];
    for (var f = 0; f < ferns; f++) {
      var fx = (rng() - 0.5) * 46 * scale, fa = -Math.PI / 2 + (rng() - 0.5) * 1.5, fl = (13 + rng() * 15) * scale;
      fern.push({ x: fx, a: fa, l: fl });
    }
    return { segs: segs, tufts: tufts, ferns: fern, col: colMain, colD: colDark, phase: rng() * Math.PI * 2 };
  }

  function buildForest() {
    layers = [];
    var defs = [
      { n: 17, s: 0.55, col: mix(DEEP, MOSS, 0.50), cold: mix(DEEP, MOSS, 0.30), cor: 0.085, a: 0.85 },
      { n: 15, s: 0.78, col: mix(DEEP, MOSS, 0.30), cold: mix(DEEP, BARK, 0.30), cor: 0.105, a: 0.92 },
      { n: 13, s: 1.05, col: mix(DEEP, BARK, 0.38), cold: DEEP, cor: 0.135, a: 1.0 },
      { n: 11, s: 1.42, col: mix(DEEP, BARK, 0.16), cold: DEEP, cor: 0.175, a: 1.0 }
    ];
    for (var L = 0; L < 4; L++) {
      var rng = mulberry32(SEED + L * 977);
      var def = defs[L], trees = [], tries = 0;
      while (trees.length < def.n && tries < 500) {
        tries++;
        var x = rng() * W, y = rng() * H;
        // bias toward the edges: pull the point away from the centre
        var cx = (x - W / 2) / (W / 2), cy = (y - H / 2) / (H / 2);
        var push = 0.34 + rng() * 0.2;
        x = W / 2 + (Math.abs(cx) < 0.01 ? 0.4 : Math.sign(cx)) * Math.pow(Math.abs(cx), 0.55) * (W / 2) * (1 + push * 0.4);
        y = H / 2 + (Math.abs(cy) < 0.01 ? 0.4 : Math.sign(cy)) * Math.pow(Math.abs(cy), 0.55) * (H / 2) * (1 + push * 0.4);
        x = Math.max(-20, Math.min(W + 20, x)); y = Math.max(H * 0.16, Math.min(H + 24, y));
        if (distToPath(x, y) < def.cor * MIN + 26 * def.s) continue;
        var tr = genTree(rng, def.s * (MIN / 760 + 0.35), def.col, def.cold);
        tr.x = x; tr.y = y;
        trees.push(tr);
      }
      layers.push({ trees: trees, a: def.a, depth: LAYER_DEPTH[L] });
    }
  }

  function buildFrags() {
    var rng = mulberry32(SEED + 5150);
    var spots = [[0.28, 0.15], [0.50, 0.09], [0.68, 0.19], [0.86, 0.11]];
    var kinds = ['fox', 'house', 'bird', 'leaf'];
    frags = [];
    for (var i = 0; i < 4; i++) {
      frags.push({
        bx: (spots[i][0] + (rng() - 0.5) * 0.03) * W,
        by: (spots[i][1] + (rng() - 0.5) * 0.03) * H,
        s: (PHONE ? 0.085 : 0.072) * MIN * (0.9 + rng() * 0.25),
        rot: (rng() - 0.5) * 0.16,
        ph: rng() * Math.PI * 2,
        kind: kinds[i],
        flash: 0
      });
    }
  }

  function rebuild() {
    buildPath();
    buildForest();
    buildFrags();
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth, h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h; MIN = Math.min(w, h);
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    PHONE = sw < 700 || h > w * 1.15;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    rebuild();
    draw(lastT);
  }

  // Interaction state
  var dolly = 0, dollyTarget = 0, dragging = false, dragStartY = 0, dragStartDolly = 0;
  var downT = 0, downX = 0, downY = 0, downMoved = 0;
  var lastT = 0;

  function fragPos(f, t) {
    return [f.bx + Math.sin(t * 0.21 + f.ph) * MIN * 0.008, f.by + Math.sin(t * 0.34 + f.ph * 1.7) * MIN * 0.010];
  }

  function drawMotif(kind, s) {
    // drawn centred at origin, within a box of half-size s; bark lines, cream fills
    ctx.lineWidth = Math.max(1.2, s * 0.075);
    ctx.strokeStyle = BARK;
    ctx.fillStyle = CREAM;
    if (kind === 'fox') {
      ctx.beginPath();
      ctx.moveTo(-s * 0.62, -s * 0.52); ctx.lineTo(-s * 0.55, -s * 0.05); ctx.lineTo(-s * 0.2, -s * 0.28);
      ctx.lineTo(0, s * 0.58); ctx.lineTo(s * 0.2, -s * 0.28); ctx.lineTo(s * 0.55, -s * 0.05); ctx.lineTo(s * 0.62, -s * 0.52);
      ctx.lineTo(s * 0.28, -s * 0.34); ctx.lineTo(0, -s * 0.44); ctx.lineTo(-s * 0.28, -s * 0.34);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = BARK;
      ctx.beginPath(); ctx.arc(-s * 0.24, s * 0.02, s * 0.07, 0, 7); ctx.arc(s * 0.24, s * 0.02, s * 0.07, 0, 7); ctx.fill();
    } else if (kind === 'house') {
      ctx.beginPath();
      ctx.moveTo(-s * 0.55, s * 0.55); ctx.lineTo(-s * 0.55, -s * 0.05); ctx.lineTo(0, -s * 0.55); ctx.lineTo(s * 0.55, -s * 0.05); ctx.lineTo(s * 0.55, s * 0.55);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = BARK;
      ctx.fillRect(-s * 0.14, s * 0.08, s * 0.28, s * 0.47);
    } else if (kind === 'bird') {
      ctx.beginPath();
      ctx.moveTo(-s * 0.62, s * 0.3);
      ctx.quadraticCurveTo(-s * 0.25, -s * 0.42, s * 0.18, -s * 0.3);
      ctx.quadraticCurveTo(s * 0.5, -s * 0.2, s * 0.66, s * 0.02);
      ctx.lineTo(s * 0.42, s * 0.08);
      ctx.quadraticCurveTo(s * 0.2, s * 0.48, -s * 0.2, s * 0.42);
      ctx.quadraticCurveTo(-s * 0.5, s * 0.38, -s * 0.62, s * 0.3);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s * 0.05, -s * 0.05);
      ctx.quadraticCurveTo(s * 0.25, -s * 0.5, s * 0.52, -s * 0.44);
      ctx.stroke();
      ctx.fillStyle = BARK;
      ctx.beginPath(); ctx.arc(s * 0.34, -s * 0.14, s * 0.065, 0, 7); ctx.fill();
    } else { // leaf
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.62);
      ctx.quadraticCurveTo(s * 0.55, -s * 0.15, s * 0.3, s * 0.32);
      ctx.quadraticCurveTo(s * 0.12, s * 0.55, 0, s * 0.6);
      ctx.quadraticCurveTo(-s * 0.12, s * 0.55, -s * 0.3, s * 0.32);
      ctx.quadraticCurveTo(-s * 0.55, -s * 0.15, 0, -s * 0.62);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -s * 0.5); ctx.quadraticCurveTo(s * 0.05, 0, 0, s * 0.68); ctx.stroke();
    }
  }

  function drawFrag(f, t) {
    var p = fragPos(f, t), s = f.s;
    ctx.save();
    ctx.translate(p[0], p[1]);
    ctx.rotate(f.rot + Math.sin(t * 0.18 + f.ph) * 0.02);
    // pale frame: cream border, amber interior (amber lives only here)
    ctx.fillStyle = rgba(AMBER, 0.30 + f.flash * 0.38);
    ctx.fillRect(-s, -s, s * 2, s * 2);
    ctx.lineWidth = Math.max(2, s * 0.16);
    ctx.strokeStyle = rgba(CREAM, 0.92);
    ctx.strokeRect(-s, -s, s * 2, s * 2);
    ctx.lineWidth = Math.max(1, s * 0.045);
    ctx.strokeStyle = rgba(BARK, 0.65);
    ctx.strokeRect(-s * 0.86, -s * 0.86, s * 1.72, s * 1.72);
    drawMotif(f.kind, s * 0.78);
    ctx.restore();
    if (f.flash > 0) f.flash = Math.max(0, f.flash - 0.016);
  }

  function drawTree(tr, sway) {
    ctx.save();
    ctx.translate(tr.x, tr.y);
    ctx.rotate(sway);
    ctx.fillStyle = rgba(DEEP, 0.5);
    ctx.beginPath(); ctx.ellipse(0, 2, 26, 6, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = tr.col;
    ctx.lineCap = 'round';
    for (var i = 0; i < tr.segs.length; i++) {
      var sg = tr.segs[i];
      ctx.lineWidth = sg.w;
      ctx.beginPath(); ctx.moveTo(sg.x1, sg.y1); ctx.quadraticCurveTo(sg.mx, sg.my, sg.x2, sg.y2); ctx.stroke();
    }
    ctx.fillStyle = tr.colD;
    for (var j = 0; j < tr.tufts.length; j++) {
      ctx.globalAlpha = 0.42;
      ctx.beginPath(); ctx.arc(tr.tufts[j].x, tr.tufts[j].y, tr.tufts[j].r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = tr.col;
    ctx.lineWidth = 1.6;
    for (var f = 0; f < tr.ferns.length; f++) {
      var fn = tr.ferns[f];
      ctx.beginPath(); ctx.moveTo(fn.x, 0);
      ctx.quadraticCurveTo(fn.x + Math.cos(fn.a) * fn.l * 0.5, Math.sin(fn.a) * fn.l * 0.7, fn.x + Math.cos(fn.a) * fn.l, Math.sin(fn.a) * fn.l);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawLayer(L, t, dollyV) {
    var lay = layers[L];
    ctx.save();
    var cx = W / 2, cy = H / 2, sc = 1 + dollyV * lay.depth * 0.05;
    ctx.translate(cx, cy + dollyV * lay.depth * MIN * 0.035);
    ctx.scale(sc, sc);
    ctx.translate(-cx, -cy);
    ctx.globalAlpha = lay.a;
    var swayAmp = 0.006 + L * 0.0035;
    for (var i = 0; i < lay.trees.length; i++) {
      drawTree(lay.trees[i], Math.sin(t * 0.45 + lay.trees[i].phase) * swayAmp);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawPath() {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(MOSS, 0.34);
    ctx.lineWidth = MIN * 0.052;
    ctx.beginPath();
    for (var i = 0; i < pathPts.length; i++) { if (i === 0) ctx.moveTo(pathPts[i][0], pathPts[i][1]); else ctx.lineTo(pathPts[i][0], pathPts[i][1]); }
    ctx.stroke();
    ctx.strokeStyle = rgba(CREAM, 0.13);
    ctx.lineWidth = MIN * 0.026;
    ctx.stroke();
    ctx.strokeStyle = rgba(BARK, 0.35);
    ctx.lineWidth = 1.4;
    ctx.setLineDash([2, 9]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function limb(x1, y1, x2, y2, w) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = BARK; ctx.lineWidth = w + 2.6;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = CREAM; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  function drawChild(t) {
    var LOOP = 52; // seconds per full walk
    var u = 0.18 + (t / LOOP) % 1;
    if (u > 1) u -= 1;
    var fade = 1;
    if (u < 0.045) fade = u / 0.045; else if (u > 0.955) fade = (1 - u) / 0.045;
    var pos = pathAt(u);
    var s = Math.max(30, Math.min(86, MIN * (PHONE ? 0.13 : 0.105))); // child height unit
    var phase = Math.PI / 2 + t * (Math.PI * 2 / 0.62); // phase 0 mid-stride offset baked in
    var sw = Math.sin(phase), bob = Math.abs(Math.cos(phase)) * s * 0.03;
    ctx.save();
    ctx.translate(pos[0], pos[1] - bob);
    ctx.rotate(Math.max(-0.4, Math.min(0.4, pos[2] + Math.PI / 2)) * 0.22);
    if (Math.cos(pos[2]) < 0) ctx.scale(-1, 1);
    ctx.globalAlpha = Math.max(0, Math.min(1, fade));
    var hipY = -s * 0.46, shY = -s * 0.74;
    // back limbs
    limb(0, hipY, Math.sin(-sw) * s * 0.20, hipY + s * 0.24, s * 0.085);
    limb(Math.sin(-sw) * s * 0.20, hipY + s * 0.24, Math.sin(-sw) * s * 0.30, -s * 0.01, s * 0.075);
    limb(s * 0.01, shY, Math.sin(sw) * s * 0.17, shY + s * 0.20, s * 0.07); // back arm
    // body
    limb(0, hipY + s * 0.03, s * 0.015, shY, s * 0.21);
    // head
    ctx.fillStyle = BARK; ctx.beginPath(); ctx.arc(s * 0.05, -s * 0.90, s * 0.155, 0, 7); ctx.fill();
    ctx.fillStyle = CREAM; ctx.beginPath(); ctx.arc(s * 0.05, -s * 0.90, s * 0.125, 0, 7); ctx.fill();
    // front limbs
    limb(0, hipY, Math.sin(sw) * s * 0.20, hipY + s * 0.24, s * 0.085);
    limb(Math.sin(sw) * s * 0.20, hipY + s * 0.24, Math.sin(sw) * s * 0.30, -s * 0.01, s * 0.075);
    limb(s * 0.01, shY, Math.sin(-sw) * s * 0.17, shY + s * 0.20, s * 0.07); // front arm
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawBirds(dt) {
    for (var i = birds.length - 1; i >= 0; i--) {
      var b = birds[i];
      b.age += dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.vy -= 6 * dt;
      if (b.age > 2.6 || b.y < -30) { birds.splice(i, 1); continue; }
      var flap = Math.sin(b.age * 22) * 0.55, sc = b.s;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.globalAlpha = Math.max(0, 1 - b.age / 2.6);
      ctx.strokeStyle = CREAM; ctx.lineWidth = Math.max(1.2, sc * 0.10); ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-sc, -Math.sin(flap) * sc * 0.7); ctx.quadraticCurveTo(-sc * 0.4, -sc * 0.25, 0, 0);
      ctx.quadraticCurveTo(sc * 0.4, -sc * 0.25, sc, -Math.sin(flap) * sc * 0.7);
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  var prevNow = 0;
  function draw(t) {
    lastT = t;
    var dt = Math.min(0.05, Math.max(0, t - prevNow)); prevNow = t;
    if (!dragging) { dolly += (dollyTarget - dolly) * Math.min(1, dt * 3.2 + 0.001); if (Math.abs(dolly) < 0.001) dolly = 0; }
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = DEEP;
    ctx.fillRect(0, 0, W, H);
    // soft moss gloom patches, seeded positions baked into layer phase data
    drawLayer(0, t, dolly);
    drawLayer(1, t, dolly);
    drawPath();
    drawLayer(2, t, dolly);
    for (var i = 0; i < frags.length; i++) drawFrag(frags[i], t);
    drawLayer(3, t, dolly);
    drawChild(t);
    drawBirds(dt);
  }

  function nowS() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0; }
  var T0 = nowS();
  function tick() {
    draw(nowS() - T0);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
  }

  function pt(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [e.clientX - r.left, e.clientY - r.top];
  }

  canvas.addEventListener('pointerdown', function (e) {
    var p = pt(e); downX = p[0]; downY = p[1]; downMoved = 0; downT = nowS();
    dragging = true; dragStartY = p[1]; dragStartDolly = dolly;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = pt(e);
    downMoved = Math.max(downMoved, Math.abs(p[0] - downX) + Math.abs(p[1] - downY));
    dolly = Math.max(-1, Math.min(1, dragStartDolly + (p[1] - dragStartY) / H * 1.7));
  });
  function endPointer(e) {
    if (!dragging) return;
    dragging = false; dollyTarget = 0;
    var p = pt(e);
    if (nowS() - downT < 0.35 && downMoved < 12) {
      for (var i = 0; i < frags.length; i++) {
        var fp = fragPos(frags[i], lastT);
        var dx = p[0] - fp[0], dy = p[1] - fp[1];
        if (Math.sqrt(dx * dx + dy * dy) < frags[i].s * 1.35) {
          frags[i].flash = 1;
          birds.push({ x: fp[0], y: fp[1] - frags[i].s * 0.6, vx: 14 + (i % 2) * 10, vy: -46, age: 0, s: frags[i].s * 0.34 });
          break;
        }
      }
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function () { dragging = false; dollyTarget = 0; });

  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
