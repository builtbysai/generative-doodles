<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapping the Prairies</title>
<style>
  html, body { margin: 0; padding: 0; background: #B9C0C7; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var T0 = 17;                  // fixed first-frame phase (s): farmhouse up, specular mid-slide, quote 1 mid-scroll
  var STEEL = '#B9C0C7', STEEL_D = '#8E969E', STEEL_E = '#767E85';
  var SKY = '#9FC2D8', SIDING = '#D9CDB4', SIDING_D = '#CFC2A6', RUST = '#9A4A2B';
  var INK = '#2A2D33', GROUND = '#BFA96E', GRASS = '#8A7A4A', POST = '#5A4632';
  var ROOF = '#A3947C', ROOF_D = '#6E6258', DARK = '#26221C';

  var QUOTES = [
    'the wind took the roof before we heard it',
    'we waited in the cellar three hours',
    'the elevator stood. the barn did not',
    'you could see the storm from the porch, coming all afternoon',
    'after, the quiet was the worst part'
  ];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded hash (no unseeded randomness anywhere) ----------
  function rnd(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- interaction state (recorded offsets only) ----------
  var quoteScrub = 0;           // px (reference scale) added to the marquee offset
  var lightShift = 0;           // px added to the specular centre
  var lightLean = 0;            // extra specular slant, px
  var quoteSeed = 0;            // double-tap reseeds the quote order
  var pointer = { down: false, lx: 0, ly: 0, lastDownT: -9 };

  function quoteOrder() {
    var idx = [0, 1, 2, 3, 4], out = [], pool = idx.slice();
    for (var i = 0; i < 5; i++) {
      var k = Math.floor(rnd(quoteSeed * 977 + i * 131 + 7) * pool.length);
      out.push(pool.splice(k, 1)[0]);
    }
    return out;
  }

  // ---------- sizing (Visual Viewport API) ----------
  var W = 0, H = 0, PHONE = false;
  function measure() {
    var vv = window.visualViewport;
    W = (vv && vv.width) || window.innerWidth || 800;
    H = (vv && vv.height) || window.innerHeight || 600;
    canvas.width = W; canvas.height = H;
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    PHONE = (Math.min(sw, sh) < 700) || (H > W * 1.15);
  }

  // ---------- steel sheeting ----------
  function rivet(x, y, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  function drawSteelBand(y0, y1, t, isBottom) {
    ctx.fillStyle = STEEL; ctx.fillRect(0, y0, W, y1 - y0);
    var bh = y1 - y0;
    // panel seams: verticals + one horizontal seam
    ctx.fillStyle = STEEL_D;
    var seamStep = Math.max(120, W / 7);
    for (var x = seamStep; x < W; x += seamStep) ctx.fillRect(x, y0, 1.5, bh);
    ctx.fillRect(0, y0 + bh * (isBottom ? 0.30 : 0.5), W, 1.5);
    // band edges
    ctx.fillStyle = STEEL_E;
    ctx.fillRect(0, y0, W, 2); ctx.fillRect(0, y1 - 2, W, 2);
    // rivets: a row near each long edge of the band
    ctx.fillStyle = STEEL_D;
    var rr = clamp(bh * 0.035, 1.6, 3.2);
    var step = Math.max(34, W / 26);
    var ry1 = y0 + bh * 0.16, ry2 = y1 - bh * 0.16;
    for (var rx = step * 0.5; rx < W; rx += step) { rivet(rx, ry1, rr); rivet(rx, ry2, rr); }
    // specular: flat white parallelogram sliding on a 60 s orbit (hard edges, no gradient)
    var phase = ((t % 60) + 60) % 60 / 60;
    var cx = W * (-0.35 + 2.8 * phase) + lightShift;
    var lean = W * 0.05 + lightLean;
    ctx.fillStyle = '#FFFFFF';
    ctx.globalAlpha = 0.10;
    specPara(cx - W * 0.05, W * 0.30, lean, y0, y1);
    ctx.globalAlpha = 0.25;
    specPara(cx, W * 0.16, lean, y0, y1);
    ctx.globalAlpha = 1;
  }
  function specPara(cx, hw, lean, y0, y1) {
    ctx.beginPath();
    ctx.moveTo(cx - hw + lean, y0);
    ctx.lineTo(cx + hw + lean, y0);
    ctx.lineTo(cx + hw - lean, y1);
    ctx.lineTo(cx - hw - lean, y1);
    ctx.closePath(); ctx.fill();
  }

  // ---------- sky, sun, clouds, ground ----------
  function drawSky(t, py0, py1, flash) {
    ctx.fillStyle = flash ? '#B4CFE2' : SKY;
    ctx.fillRect(0, py0, W, py1 - py0);
    var ph = py1 - py0;
    // sun: flat pale disc + faint flat halo
    var sx = W * 0.76, sy = py0 + ph * 0.24, sr = ph * 0.075;
    ctx.fillStyle = '#F7F1DC'; ctx.globalAlpha = 0.30;
    ctx.beginPath(); ctx.moveTo(sx + sr * 1.9, sy); ctx.arc(sx, sy, sr * 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.moveTo(sx + sr, sy); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // flat clouds, slow closed-form drift
    ctx.fillStyle = '#EDF2F0';
    for (var i = 0; i < 4; i++) {
      var bx = W * (0.12 + 0.22 * i) + 26 * rnd(i * 31 + 5) + 9 * Math.sin(t * 0.013 + i * 2.1);
      var by = py0 + ph * (0.13 + 0.10 * rnd(i * 31 + 9));
      var cr = ph * (0.035 + 0.02 * rnd(i * 31 + 13));
      ctx.globalAlpha = 0.85;
      blob(bx, by, cr); blob(bx + cr * 1.1, by + cr * 0.18, cr * 0.75); blob(bx - cr * 1.05, by + cr * 0.22, cr * 0.7);
      ctx.globalAlpha = 1;
    }
  }
  function blob(x, y, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  function drawGround(py0, py1) {
    var gy = py0 + (py1 - py0) * 0.80;
    ctx.fillStyle = GROUND; ctx.fillRect(0, gy, W, py1 - gy);
    ctx.fillStyle = '#A8945F'; ctx.fillRect(0, gy, W, 2);
    // fence line: posts + two wires
    ctx.strokeStyle = POST; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, gy + (py1 - gy) * 0.30); ctx.lineTo(W, gy + (py1 - gy) * 0.30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, gy + (py1 - gy) * 0.52); ctx.lineTo(W, gy + (py1 - gy) * 0.52); ctx.stroke();
    ctx.fillStyle = POST;
    var step = Math.max(46, W / 16);
    for (var x = step * 0.4; x < W; x += step) ctx.fillRect(x, gy + (py1 - gy) * 0.10, 3, (py1 - gy) * 0.52);
    // grass ticks
    ctx.strokeStyle = GRASS; ctx.lineWidth = 1;
    for (var i = 0; i < 130; i++) {
      var gx = rnd(i * 17 + 1) * W, gh = 3 + 5 * rnd(i * 17 + 2);
      var gyy = gy + 4 + rnd(i * 17 + 3) * (py1 - gy - 8);
      ctx.beginPath(); ctx.moveTo(gx, gyy); ctx.lineTo(gx + (rnd(i * 17 + 4) - 0.5) * 3, gyy - gh); ctx.stroke();
    }
    return gy;
  }

  // ---------- weathering helpers (local coords, unit u) ----------
  function streaks(x0, y0, x1, y1, n, seed) {
    ctx.fillStyle = RUST;
    for (var i = 0; i < n; i++) {
      var sx = x0 + rnd(seed + i * 7 + 1) * (x1 - x0);
      var sy = y0 + rnd(seed + i * 7 + 2) * (y1 - y0) * 0.4;
      var sl = (0.25 + 0.6 * rnd(seed + i * 7 + 3)) * (y1 - y0);
      ctx.globalAlpha = 0.16 + 0.22 * rnd(seed + i * 7 + 4);
      ctx.fillRect(sx, sy, 0.5 + 0.9 * rnd(seed + i * 7 + 5), Math.min(sl, y1 - sy));
    }
    ctx.globalAlpha = 1;
  }
  function speckles(x0, y0, x1, y1, n, seed) {
    ctx.fillStyle = '#7A6E58';
    for (var i = 0; i < n; i++) {
      ctx.globalAlpha = 0.12 + 0.25 * rnd(seed + i * 3 + 1);
      ctx.fillRect(x0 + rnd(seed + i * 3 + 2) * (x1 - x0), y0 + rnd(seed + i * 3 + 3) * (y1 - y0), 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
  }
  function win(x, y, w, h, broken) {
    ctx.fillStyle = DARK; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = SIDING_D; ctx.lineWidth = 0.35; ctx.strokeRect(x, y, w, h);
    if (broken) {
      ctx.strokeStyle = '#E8E2D4'; ctx.lineWidth = 0.3;
      ctx.beginPath(); ctx.moveTo(x + w * 0.15, y + h * 0.8); ctx.lineTo(x + w * 0.55, y + h * 0.3); ctx.lineTo(x + w * 0.85, y + h * 0.6); ctx.stroke();
    }
  }

  // ---------- the three buildings (origin: ground centre, y up = negative) ----------
  function drawFarmhouse(u) {
    // main two-storey block
    ctx.fillStyle = SIDING; ctx.fillRect(-23 * u, -26 * u, 32 * u, 26 * u);
    ctx.fillStyle = SIDING_D; ctx.fillRect(9 * u, -17 * u, 14 * u, 17 * u);
    // roofs: main with a sag, wing lower
    ctx.fillStyle = ROOF;
    ctx.beginPath();
    ctx.moveTo(-25 * u, -26 * u); ctx.lineTo(-8 * u, -33.5 * u); ctx.lineTo(-6.5 * u, -32.2 * u);
    ctx.lineTo(8 * u, -33 * u); ctx.lineTo(11 * u, -26 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = ROOF_D; ctx.fillRect(8 * u, -20.5 * u, 17 * u, 3.5 * u);
    // chimney, slightly tilted
    ctx.fillStyle = RUST; ctx.fillRect(-17.5 * u, -35.5 * u, 3 * u, 5 * u);
    // porch: sagging roof strip + posts
    ctx.fillStyle = ROOF_D; ctx.fillRect(-23 * u, -10.5 * u, 32 * u, 1.6 * u);
    ctx.fillStyle = POST;
    ctx.fillRect(-21 * u, -10 * u, 0.9 * u, 10 * u); ctx.fillRect(-8 * u, -9.6 * u, 0.9 * u, 9.6 * u); ctx.fillRect(5 * u, -10 * u, 0.9 * u, 10 * u);
    // windows + door
    win(-19 * u, -22 * u, 4.4 * u, 5.4 * u, true);
    win(-9 * u, -22 * u, 4.4 * u, 5.4 * u, false);
    win(1.5 * u, -22 * u, 4.4 * u, 5.4 * u, false);
    win(13 * u, -14.5 * u, 4 * u, 5 * u, true);
    win(-19 * u, -8.6 * u, 4.4 * u, 5.4 * u, false);
    ctx.fillStyle = '#4A4038'; ctx.fillRect(-3.5 * u, -9 * u, 4.6 * u, 9 * u);
    // boarded window (upper right of main block)
    ctx.fillStyle = DARK; ctx.fillRect(-0.5 * u, -15.5 * u, 4.4 * u, 5.4 * u);
    ctx.save(); ctx.translate(1.7 * u, -12.8 * u); ctx.rotate(0.5);
    ctx.fillStyle = '#8A7A5E'; ctx.fillRect(-3.4 * u, -0.7 * u, 6.8 * u, 1.4 * u); ctx.restore();
    ctx.save(); ctx.translate(1.7 * u, -12.8 * u); ctx.rotate(-0.42);
    ctx.fillStyle = '#77694F'; ctx.fillRect(-3.4 * u, -0.7 * u, 6.8 * u, 1.4 * u); ctx.restore();
    streaks(-23 * u, -25 * u, 9 * u, 0, 7, 400);
    speckles(-23 * u, -26 * u, 23 * u, 0, 60, 800);
  }
  function drawElevator(u) {
    // annex shed
    ctx.fillStyle = SIDING_D; ctx.fillRect(8 * u, -19 * u, 13 * u, 19 * u);
    ctx.fillStyle = ROOF_D;
    ctx.beginPath(); ctx.moveTo(7 * u, -19 * u); ctx.lineTo(22 * u, -19 * u); ctx.lineTo(19.5 * u, -22.5 * u); ctx.lineTo(9.5 * u, -22.5 * u); ctx.closePath(); ctx.fill();
    // main shaft
    ctx.fillStyle = SIDING; ctx.fillRect(-8 * u, -46 * u, 16 * u, 46 * u);
    // headhouse
    ctx.fillStyle = SIDING;
    ctx.beginPath(); ctx.moveTo(-8 * u, -46 * u); ctx.lineTo(8 * u, -46 * u); ctx.lineTo(8 * u, -52 * u); ctx.lineTo(-2 * u, -55.5 * u); ctx.lineTo(-8 * u, -52 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = ROOF; ctx.beginPath(); ctx.moveTo(-8.6 * u, -51.6 * u); ctx.lineTo(-2 * u, -55.9 * u); ctx.lineTo(8.6 * u, -51.6 * u); ctx.lineTo(8.6 * u, -50.4 * u); ctx.lineTo(-2 * u, -54.4 * u); ctx.lineTo(-8.6 * u, -50.4 * u); ctx.closePath(); ctx.fill();
    // distributor pipe
    ctx.strokeStyle = ROOF_D; ctx.lineWidth = 0.9 * u;
    ctx.beginPath(); ctx.moveTo(6 * u, -50 * u); ctx.lineTo(17 * u, -24 * u); ctx.stroke();
    // windows down the shaft
    for (var i = 0; i < 4; i++) win(-2.2 * u, (-42 + i * 9) * u, 4.4 * u, 5 * u, i === 2);
    win(11.5 * u, -15 * u, 4 * u, 4.6 * u, false);
    ctx.fillStyle = '#4A4038'; ctx.fillRect(-3 * u, -8.5 * u, 6 * u, 8.5 * u);
    streaks(-8 * u, -52 * u, 8 * u, 0, 10, 1200);
    speckles(-8 * u, -46 * u, 21 * u, 0, 55, 1600);
  }
  function drawBarn(u) {
    // leaning body: top shifted +3u
    ctx.fillStyle = RUST;
    ctx.beginPath();
    ctx.moveTo(-22 * u, 0); ctx.lineTo(22 * u, 0); ctx.lineTo(25 * u, -21 * u); ctx.lineTo(-19 * u, -21 * u);
    ctx.closePath(); ctx.fill();
    // bleached patches
    ctx.fillStyle = SIDING;
    ctx.globalAlpha = 0.35; ctx.fillRect(-16 * u, -14 * u, 9 * u, 8 * u);
    ctx.globalAlpha = 0.25; ctx.fillRect(8 * u, -18 * u, 11 * u, 6 * u);
    ctx.globalAlpha = 1;
    // roof: left plane intact, right plane caved to a sunken ridge
    ctx.fillStyle = ROOF_D;
    ctx.beginPath(); ctx.moveTo(-24 * u, -21 * u); ctx.lineTo(1 * u, -29 * u); ctx.lineTo(4 * u, -21 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4E423A';
    ctx.beginPath(); ctx.moveTo(4 * u, -21 * u); ctx.lineTo(1 * u, -29 * u); ctx.lineTo(15 * u, -24.5 * u); ctx.lineTo(17 * u, -19.5 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#241A12';
    ctx.beginPath(); ctx.moveTo(4 * u, -21 * u); ctx.lineTo(15 * u, -24.5 * u); ctx.lineTo(20 * u, -21 * u); ctx.closePath(); ctx.fill();
    // board lines
    ctx.strokeStyle = 'rgba(38,32,26,0.45)'; ctx.lineWidth = 0.3 * u;
    for (var i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.moveTo(i * 6 * u, 0); ctx.lineTo((i * 6 + 2.6) * u, -21 * u); ctx.stroke();
    }
    // door with X brace
    ctx.strokeStyle = SIDING; ctx.lineWidth = 0.55 * u;
    ctx.strokeRect(-6 * u, -13 * u, 11 * u, 13 * u);
    ctx.beginPath(); ctx.moveTo(-6 * u, -13 * u); ctx.lineTo(5 * u, 0); ctx.moveTo(5 * u, -13 * u); ctx.lineTo(-6 * u, 0); ctx.stroke();
    win(13 * u, -16 * u, 4 * u, 4.4 * u, true);
    streaks(-20 * u, -20 * u, 24 * u, 0, 6, 2000);
    speckles(-22 * u, -21 * u, 25 * u, 0, 50, 2400);
  }
  var BUILDINGS = [drawFarmhouse, drawElevator, drawBarn];

  // ---------- grain + sferic lightning (closed-form, visual only) ----------
  function lightning(t) {
    var ev = Math.floor(t / 47);
    var start = ev * 47 + rnd(ev * 7 + 3) * 30;
    var age = t - start;
    return (age >= 0 && age < 0.4) ? 1 - age / 0.4 : 0;
  }
  function drawGrain(t, py0, py1, burst) {
    var step = Math.floor(t * 8);
    var cell = 6;
    var density = burst > 0 ? 0.16 : 0.045;
    ctx.fillStyle = '#000000'; ctx.globalAlpha = 0.08;
    for (var gy = py0, iy = 0; gy < py1; gy += cell, iy++) {
      for (var gx = 0, ix = 0; gx < W; gx += cell, ix++) {
        if (rnd(ix * 391 + iy * 733 + step * 17) < density) ctx.fillRect(gx + rnd(ix * 57 + iy * 91 + step) * 3, gy, 2, 2);
      }
    }
    ctx.globalAlpha = 1;
    if (burst > 0) {  // sferic crackle burst: bright static ticks over the photo
      ctx.fillStyle = '#FFFFFF'; ctx.globalAlpha = 0.20 * burst;
      for (var i = 0; i < 260; i++) {
        if (rnd(i * 23 + step * 41) < 0.5) ctx.fillRect(rnd(i * 29 + step) * W, py0 + rnd(i * 37 + step * 3) * (py1 - py0), 3, 1.5);
      }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- quote marquee (bottom steel band) ----------
  var widthCache = {};
  function quoteFont() {
    var bh = H * 0.16;
    return clamp(bh * 0.20, 13, Math.min(26, W * 0.045));
  }
  function drawQuotes(t, by0, by1) {
    var fs = quoteFont();
    ctx.font = '600 ' + fs + 'px sans-serif';
    ctx.textBaseline = 'middle';
    var ref = W / 1280;
    var order = quoteOrder();
    var widths = [], total = 0, gap = 260 * ref;
    for (var i = 0; i < 5; i++) {
      var key = order[i] + '@' + fs;
      if (!widthCache[key]) widthCache[key] = ctx.measureText(QUOTES[order[i]]).width;
      widths.push(widthCache[key]); total += widths[i] + gap;
    }
    var speed = 30 * ref;
    var off = ((speed * t + quoteScrub) % total + total) % total;
    var cy = by0 + (by1 - by0) * 0.60;
    ctx.fillStyle = INK;
    var cursor = 560 * ref;
    for (var j = 0; j < 5; j++) {
      for (var k = 0; k < 2; k++) {
        var x = cursor - off + k * total;
        if (x + widths[j] > 0 && x < W) ctx.fillText(QUOTES[order[j]], x, cy);
      }
      cursor += widths[j] + gap;
    }
  }

  // ---------- one frame ----------
  var lastT = T0;
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var topH = H * 0.12, botH = H * 0.16;
    var py0 = topH, py1 = H - botH;
    var flash = lightning(t);

    drawSky(t, py0, py1, flash > 0);
    var gy = drawGround(py0, py1);

    // buildings: 30 s slots, stepped 8 fps crossfade in the last 1.6 s
    var slot = Math.floor(t / 30) % 3, local = t % 30;
    var u = (py1 - py0) / 100;
    ctx.save();
    ctx.translate(W / 2, gy);
    if (local > 28.4) {
      var p = (local - 28.4) / 1.6, s8 = Math.floor(p * 8) / 8;
      ctx.globalAlpha = 1 - s8; BUILDINGS[slot](u);
      ctx.globalAlpha = s8; BUILDINGS[(slot + 1) % 3](u);
      ctx.globalAlpha = 1;
    } else {
      BUILDINGS[slot](u);
    }
    ctx.restore();

    drawGrain(t, py0, py1, flash);

    drawSteelBand(0, topH, t, false);
    drawSteelBand(py1, H, t, true);
    drawQuotes(t, py1, H);
  }

  // ---------- pointer: drag = scrub quotes (x) + shift light (y); double-tap reseeds ----------
  function pieceTime() { return lastT; }
  function toLocal(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var pt = toLocal(e), now = pieceTime();
    if (now - pointer.lastDownT < 0.35) { quoteSeed++; widthCache = {}; }
    pointer.lastDownT = now;
    pointer.down = true; pointer.lx = pt.x; pointer.ly = pt.y;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pointer.down) return;
    var pt = toLocal(e);
    var dx = pt.x - pointer.lx, dy = pt.y - pointer.ly;
    quoteScrub -= dx * (1280 / Math.max(W, 1));
    lightShift += dy * 1.2;
    lightLean = clamp(lightLean + dy * 0.9, -W * 0.2, W * 0.2);
    pointer.lx = pt.x; pointer.ly = pt.y;
  });
  function endPointer() { pointer.down = false; }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);

  // ---------- run ----------
  measure();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { measure(); draw(lastT); });
  }
  window.addEventListener('resize', function () { measure(); draw(lastT); });

  draw(T0);                                    // synchronous fixed-phase first frame
  var startStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) startStamp = stamp;
      lastT = T0 + (stamp - startStamp) / 1000;
      draw(lastT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
