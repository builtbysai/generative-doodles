<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>&#8470;8939 &middot; Pairs Only</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #08070c;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: block; cursor: crosshair; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
  }
  .ui {
    position: fixed; z-index: 3; pointer-events: none;
    color: rgba(235, 232, 245, 0.62);
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }
  .ui .num { color: rgba(255, 200, 120, 0.9); }
  #title { top: 18px; left: 20px; }
  #title .sub { display: block; margin-top: 6px; font-size: 9px; letter-spacing: 0.18em; color: rgba(235,232,245,0.36); }
  #hint { bottom: 16px; right: 20px; text-align: right; font-size: 9px; color: rgba(235,232,245,0.36); }
  #seedline { bottom: 16px; left: 20px; font-size: 9px; color: rgba(235,232,245,0.30); }
  #budget { top: 18px; right: 20px; text-align: right; font-size: 12px; }
  #budget .big { font-size: 26px; color: rgba(255,220,160,0.9); }
  #fade {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: #08070c; opacity: 1; transition: opacity 0.6s ease;
  }
  @media (max-width: 620px) {
    #seedline { bottom: 38px; }
    #hint { font-size: 8px; }
    #title { font-size: 10px; }
    #title .sub { display: none; }
    #budget .big { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="ui" id="title"><span class="num">&#8470;8939</span> &middot; Pairs Only<span class="sub">seed 242 &middot; sixty-four oscillators, spent two at a time, until the last one is gone</span></div>
<div class="ui" id="budget"><span class="big" id="budgetnum">64</span><br>oscillators left</div>
<div class="ui" id="hint">tap for sound &middot; click for a new economy</div>
<div class="ui" id="seedline"></div>
<div id="fade"></div>
<script>
"use strict";
/* Seed 242: the AMY pair-assignment budget. Harmonics can only be spent
   in even counts; wanting an odd-only voice burns 16 oscillators for 8
   used. Rich voices starve their neighbors, and you can hear the budget
   being spent. The piece ends the moment the 64th oscillator is gone. */
let seed = 242001;
let rng;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const N = 64, COLS = 8;
let cells = [];   /* {owner:-1|voice, e:0..1, pulse} */
let voices = [];  /* {color, name, step, nextIn, held:[{cells:[], until}], x} */
let W=0,H=0, gx=0, gy=0, gsize=0, cellP=0;
let flash = 0, rebirthT = -1;
let audioOn=false, actx=null, masterGain=null;
let theftArcs = [];
let economyT = 0;

const VOICE_DEFS = [
  {name:'brass',  color:[255,190,110], rate:1.1},
  {name:'glass',  color:[140,220,255], rate:1.7},
  {name:'reed',   color:[255,130,180], rate:0.8},
  {name:'stone',  color:[190,170,255], rate:2.3}
];
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];

function setup(){
  const c = createCanvas(windowWidth, windowHeight);
  c.id('stage');
  rng = mulberry32(seed);
  layout();
  resetEconomy();
  document.getElementById('fade').style.opacity = '0';
  updateSeedline();
}

function layout(){
  W = width; H = height;
  gsize = Math.min(W*0.9, H*0.62, 560);
  gx = W/2 - gsize/2; gy = H*0.20;
  cellP = gsize/COLS;
}

function windowResized(){ resizeCanvas(windowWidth, windowHeight); layout(); }

function resetEconomy(){
  cells = [];
  for(let i=0;i<N;i++) cells.push({owner:-1, e:0, pulse:0});
  voices = VOICE_DEFS.map((v,i)=>({
    name: v.name, color: v.color, rate: v.rate,
    step: 3+i, nextIn: 0.5+i*0.4, held: [],
    x: gx + gsize*(i+0.5)/4
  }));
  flash = 0; rebirthT = -1; theftArcs = [];
  economyT = 0;
  document.getElementById('budgetnum').textContent = '64';
}

function freeCells(){
  let n = 0;
  for(const c of cells) if(c.owner < 0) n++;
  return n;
}

function cellXY(i){
  const col = i % COLS, row = Math.floor(i/COLS);
  return {x: gx + col*cellP + cellP/2, y: gy + row*cellP + cellP/2};
}

function draw(){
  background(8,7,12);
  if(rebirthT >= 0){
    rebirthT += deltaTime/1000;
    if(rebirthT > 2.6){
      seed = (seed*9301+49297) % 233280 + 5;
      rng = mulberry32(seed);
      resetEconomy();
      updateSeedline();
      return;
    }
  }
  stepVoices();
  drawCells();
  drawVoices();
  drawThefts();
  if(flash > 0){
    flash -= deltaTime/1000*0.9;
    if(flash > 0.45){
      noStroke(); fill(255,250,240, constrain(flash,0,1)*150);
      rect(0,0,W,H);
    } else {
      noStroke(); fill(8,7,12, (0.45-flash)*2*210);
      rect(0,0,W,H);
      fill(255,220,170, 230);
      textAlign(CENTER, CENTER); textSize(Math.min(W,H)*0.05);
      text('the 64th oscillator is gone', W/2, H*0.5);
      textSize(12); fill(235,232,245,140);
      text('a new economy begins', W/2, H*0.5 + 44);
    }
  }
  if(frameCount % 20 === 0) updateSeedline();
}

function stepVoices(){
  if(rebirthT >= 0) return;
  const dt = deltaTime/1000;
  economyT += dt;
  for(const v of voices){
    v.nextIn -= dt;
    /* release expired notes: only cells this voice still owns */
    const vi = voices.indexOf(v);
    for(let i=v.held.length-1;i>=0;i--){
      const h = v.held[i];
      if(millis() > h.until){
        for(const ci of h.cells){
          if(cells[ci].owner === vi){ cells[ci].owner = -1; cells[ci].e = 0.25; }
        }
        v.held.splice(i,1);
      }
    }
    if(v.nextIn <= 0){
      v.nextIn = (1.0 + rng()*2.5)/v.rate;
      singNote(v);
    }
  }
  const left = freeCells();
  document.getElementById('budgetnum').textContent = '' + left;
  if(left === 0 && rebirthT < 0){
    flash = 1.0; rebirthT = 0;
  }
}

function singNote(v){
  /* walk the pentatonic; richer notes demand more pairs */
  const dir = rng();
  if(dir < 0.45 && v.step < PENTA.length-1) v.step++;
  else if(dir < 0.75 && v.step > 0) v.step--;
  else v.step = Math.floor(rng()*PENTA.length);
  const greed = Math.min(4, Math.floor(economyT/18)); /* the economy heats up */
  const pairs = 1 + Math.floor(rng()*2) + greed;   /* 1..2 pairs early, up to 6 late */
  const need = pairs*2;
  /* claim a tight cluster: start at one free cell, grow by nearest neighbor */
  let claimed = [];
  {
    const freeSet = new Set(freeCellIndices());
    if(freeSet.size > 0){
      const arr = Array.from(freeSet);
      let last = arr[Math.floor(rng()*arr.length)];
      claimed.push(last); freeSet.delete(last);
      while(claimed.length < need && freeSet.size > 0){
        const lq = cellXY(last);
        let best = -1, bestD = 1e18;
        for(const ci of freeSet){
          const q = cellXY(ci);
          const d = (q.x-lq.x)*(q.x-lq.x) + (q.y-lq.y)*(q.y-lq.y);
          if(d < bestD){ bestD = d; best = ci; }
        }
        claimed.push(best); freeSet.delete(best); last = best;
      }
    }
  }
  if(claimed.length < need){
    /* starving: steal pairs from the richest other voice */
    let richest = null, richCount = -1;
    for(const o of voices){
      if(o === v) continue;
      let cnt = 0;
      for(const h of o.held) cnt += h.cells.length;
      if(cnt > richCount){ richCount = cnt; richest = o; }
    }
    if(richest && richest.held.length > 0){
      const h = richest.held[richest.held.length-1];
      const take = Math.min(need - claimed.length, h.cells.length);
      const stolen = [];
      for(let k=0;k<take;k++){
        const ci = h.cells.pop();
        claimed.push(ci); stolen.push(ci);
        const a = cellXY(ci), b = {x: v.x, y: gy - 30};
        theftArcs.push({ax:a.x, ay:a.y, bx:b.x, by:b.y, t:0});
      }
      /* rebuild the victim's pair list from the cells it still has */
      h.cells.sort((a,b)=>a-b);
      h.pairs = [];
      for(let k=0;k+1<h.cells.length;k+=2) h.pairs.push([h.cells[k], h.cells[k+1]]);
      if(h.cells.length === 0) richest.held.pop();
    }
  }
  if(claimed.length === 0){
    /* the note dies unplayed: hollow marker */
    theftArcs.push({ax:v.x, ay:gy-30, bx:v.x, by:gy-30, t:0, hollow:true});
    return;
  }
  const vi = voices.indexOf(v);
  for(const ci of claimed){ cells[ci].owner = vi; cells[ci].e = 1; cells[ci].pulse = 1; }
  claimed.sort((a,b)=>a-b); /* neighbors pair up: short bridges */
  const pairList = [];
  for(let k=0;k+1<claimed.length;k+=2) pairList.push([claimed[k], claimed[k+1]]);
  const dur = 1200 + rng()*1800;
  v.held.push({cells: claimed, pairs: pairList, until: millis()+dur});
  if(audioOn) playVoiceNote(v, PENTA[v.step], dur/1000);
}

function freeCellIndices(){
  const idx = [];
  for(let i=0;i<N;i++) if(cells[i].owner < 0) idx.push(i);
  /* shuffle */
  for(let k=idx.length-1;k>0;k--){ const m=Math.floor(rng()*(k+1)); const t=idx[k]; idx[k]=idx[m]; idx[m]=t; }
  return idx;
}

function drawCells(){
  for(let i=0;i<N;i++){
    const c = cells[i], q = cellXY(i);
    const s = cellP*0.78;
    c.pulse *= 0.94;
    if(c.owner >= 0){
      const vc = voices[c.owner].color;
      const glow = 0.55 + 0.45*c.pulse;
      for(let g=3; g>=1; g--){
        noStroke();
        fill(vc[0], vc[1], vc[2], 14*g*glow);
        rect(q.x-s/2-g*2.5, q.y-s/2-g*2.5, s+g*5, s+g*5, 6);
      }
      noStroke();
      fill(vc[0]*glow+30, vc[1]*glow+30, vc[2]*glow+30);
      rect(q.x-s/2, q.y-s/2, s, s, 5);
    } else {
      const a = 26 + c.e*60;
      c.e *= 0.97;
      noStroke();
      fill(120, 110, 150, a);
      rect(q.x-s/2, q.y-s/2, s, s, 5);
    }
  }
  /* pair bridges: the rule made visible */
  for(const v of voices){
    stroke(v.color[0], v.color[1], v.color[2], 130);
    strokeWeight(2);
    for(const h of v.held){
      for(const pr of h.pairs){
        const a = cellXY(pr[0]), b = cellXY(pr[1]);
        line(a.x, a.y, b.x, b.y);
      }
    }
  }
}

function drawVoices(){
  noStroke(); textAlign(CENTER, CENTER);
  voices.forEach((v, vi)=>{
    const y = gy - 44;
    const heldN = v.held.reduce((a,h)=>a+h.cells.length, 0);
    fill(v.color[0], v.color[1], v.color[2], 200);
    textSize(11);
    text(v.name + ' · ' + heldN, v.x, y);
    /* voice mouth: a small diamond that opens when singing */
    const open = v.held.length > 0 ? 10 : 4;
    fill(v.color[0], v.color[1], v.color[2], 160);
    quad(v.x, y+16-open, v.x+7, y+16, v.x, y+16+open, v.x-7, y+16);
  });
}

function drawThefts(){
  for(let i=theftArcs.length-1;i>=0;i--){
    const t = theftArcs[i];
    t.t += deltaTime/1000*1.6;
    if(t.t > 1){ theftArcs.splice(i,1); continue; }
    if(t.hollow){
      noFill(); stroke(150,140,170, 160*(1-t.t));
      strokeWeight(1.5);
      const r = 6 + t.t*22;
      ellipse(t.ax, t.ay, r*2, r*2);
      continue;
    }
    const mx = (t.ax+t.bx)/2, my = Math.min(t.ay, t.by) - 40;
    const x = (1-t.t)*(1-t.t)*t.ax + 2*(1-t.t)*t.t*mx + t.t*t.t*t.bx;
    const y = (1-t.t)*(1-t.t)*t.ay + 2*(1-t.t)*t.t*my + t.t*t.t*t.by;
    noStroke(); fill(255,120,120, 220*(1-t.t));
    circle(x, y, 7);
  }
}

function updateSeedline(){
  document.getElementById('seedline').textContent =
    'seed ' + seed + ' · ' + (audioOn ? 'sound on' : 'sound off');
}

function mousePressed(){ userTap(); return false; }
function touchStarted(){ userTap(); return false; }

function userTap(){
  if(!audioOn){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      masterGain = actx.createGain();
      masterGain.gain.value = 0.12;
      masterGain.connect(actx.destination);
      audioOn = true;
    }catch(e){ audioOn = false; }
  } else {
    resetEconomy();
  }
  updateSeedline();
}

function keyPressed(){
  if(key==='r' || key==='R') resetEconomy();
}

function playVoiceNote(v, st, dur){
  if(!actx) return;
  const base = 164.81 * Math.pow(2, st/12);
  const t = actx.currentTime;
  /* each claimed pair contributes one harmonic */
  const harmonics = 1 + Math.floor(v.held.length/2);
  for(let k=1;k<=Math.min(harmonics,6);k++){
    const o = actx.createOscillator();
    o.type = k%2 ? 'triangle' : 'sine';
    o.frequency.value = base*k;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5/k, t+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t+Math.min(dur,2.4));
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t+Math.min(dur,2.4)+0.05);
  }
}
</script>
</body>
</html>
