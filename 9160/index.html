      g.strokeStyle = 'rgba(58,36,22,.8)'; g.lineWidth = 2.4; g.strokeRect(10, 10, C.W - 20, C.H - 20); g.lineWidth = 1; g.strokeRect(16, 16, C.W - 32, C.H - 32);
      rose(g, C.W - 108 * C.u, C.H - 175 * C.u, 62 * C.u);
      g.fillStyle = 'rgba(58,36,22,.8)'; g.font = `italic ${Math.round(15 * C.u + 4)}px Georgia,serif`; g.textAlign = 'right'; g.fillText('Here be dragons', C.W - 30, C.H - 80 * C.u);
      for (const s of ships) drawShip(g, s);
    }
  });
})();
// ---- harness: resize, pointer, tap, frame loop ----
function resize() {
  const dpr = C.dpr = Math.min(2, window.devicePixelRatio || 1);
  C.W = innerWidth; C.H = innerHeight; cv.width = C.W * dpr; cv.height = C.H * dpr; C.u = clamp(Math.min(C.W / 1100, C.H / 760), 0.62, 1.25);
  if (C.scene) C.scene.init();
}
addEventListener('resize', resize);

let downT = 0, downMoved = 0;
function setP(e) {
  const r = cv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
  C.pdx = x - C.px; C.pdy = y - C.py; C.moved += Math.hypot(C.pdx, C.pdy);
  C.px = x; C.py = y; C.pin = true; C.lastMove = C.t;
  if (C.down) downMoved += Math.hypot(C.pdx, C.pdy);
}
cv.addEventListener('pointermove', setP);
cv.addEventListener('pointerdown', e => {
  unlockAudio(); setP(e); C.down = true; C.click = { x: C.px, y: C.py };
  downT = performance.now(); downMoved = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  C.scene && C.scene.onDown && C.scene.onDown(C.px, C.py);
});
const up = e => {
  C.down = false;
  C.scene && C.scene.onUp && C.scene.onUp();
  if (performance.now() - downT < 250 && downMoved < 10 && typeof onTap === 'function') onTap(C.px, C.py);
};
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', () => { if (!C.down) C.pin = false; });

let last = 0;
function frame(ts) {
  const dt = Math.min(0.033, last ? (ts - last) / 1000 : 0.016); last = ts; C.t += dt;
  const s = C.scene, w = C.walker;
  C.fireOn = C.down && !C.suppressFire && (!s.fireWhen || s.fireWhen());
  if (s.drive) s.drive(dt);
  else if (C.pin && C.t - (C.lastMove || 0) < 6) w.steer(dt, C.px, C.py);
  else w.steer(dt, C.W * (0.5 + 0.3 * Math.cos(C.t * 0.23)), C.H * (0.55 + 0.22 * Math.sin(C.t * 0.31)), 10);
  updateFire(dt); s.update(dt);
  C.click = null; C.steps.length = 0; C.moved = 0;
  g.setTransform(C.dpr, 0, 0, C.dpr, 0, 0);
  const sh = C.shake > 0.1 ? C.shake : 0;
  if (sh) g.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  C.shake *= Math.exp(-dt * 6);
  s.draw(g); drawFire(g, !!s.dark); s.drawTop && s.drawTop(g);
  requestAnimationFrame(frame);
}

C.walker = new Presence();
resize();
C.mode = C.scene.modes ? C.scene.modes[0].id : null;
C.walker.reset(C.W * 0.3, C.H * 0.6);
requestAnimationFrame(frame);

</script>
