<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Frame of Smoke</title>
<style>
html, body { margin: 0; padding: 0; background: #08080A; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#08080A';
var DEEP = '#2E5ECC';
var ICE = '#9AC4E8';
var WHITE = '#FFFFFF';
var LOOP = 40;                     // orbiting light period, seconds
var PHASE0 = 0.8;                  // fixed light angle at t = 0, first frame
var RINGS = 9;                     // concentric flat discs per tube cross-section
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var seed = 1578;
// The frozen curl: a noise-displaced tube centerline, precomputed once
// from the seed and never animated. Only the orbiting light moves.
// The tube is a breaking-wave crest curling inward, seen slightly from
// below: a short tail sweeping up from the lower left, then a spiral
// that wraps a little past three quarters of a turn.
var form = null;                   // {pts:[{x,y,r,tx,ty}], bands:[{i,phase}]}
var placedW = 0, placedH = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(a, b, x) {
  var t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// Build the frozen form in unit coordinates (fractions of minDim,
// origin at the crest centre). Pure function of the seed.
function buildForm() {
  var rnd = mulberry32(seed);
  var p1 = rnd() * TAU, p2 = rnd() * TAU, p3 = rnd() * TAU;
  var pts = [];
  var i, s, th, rad, x, y;
  // Spiral start point, with the same noise displacement the spiral
  // loop below applies, so the tail meets the spiral exactly.
  var rad0 = 0.30 * (1 + 0.10 * Math.sin(p1) + 0.06 * Math.sin(p2));
  var sx0 = Math.cos(-2.1) * rad0, sy0 = -Math.sin(-2.1) * rad0 * 0.92;
  // Tail: quadratic bezier from the wave body up to the spiral start.
  // Its end tangent matches the spiral's start tangent, and its end
  // radius matches the spiral's start radius, so the joint is seamless.
  var tx0 = sx0 - 0.27, ty0 = sy0 - 0.12;
  var cx0 = sx0 - 0.12, cy0 = sy0 - 0.07;
  for (i = 0; i <= 11; i++) {
    var u = i / 11;
    var a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    pts.push({
      x: a * tx0 + b * cx0 + c * sx0,
      y: a * ty0 + b * cy0 + c * sy0,
      r: 0.030 + 0.030 * u,
      s: u * 0.10
    });
  }
  // Spiral curl: theta from -2.1 to 3.3 rad, radius shrinking inward.
  var N = 78;
  for (i = 0; i < N; i++) {
    s = i / (N - 1);
    th = -2.1 + s * 5.4;
    rad = 0.30 * (1 - 0.52 * s);
    rad *= 1 + 0.10 * Math.sin(s * 9.3 + p1) + 0.06 * Math.sin(s * 17.7 + p2);
    x = Math.cos(th) * rad;
    y = -Math.sin(th) * rad * 0.92;
    var r = 0.060 + 0.020 * Math.sin(Math.PI * clamp(s * 1.15, 0, 1));
    r *= 1 - 0.75 * smooth(0.85, 1, s);
    r *= 1 + 0.08 * Math.sin(s * 13.1 + p3);
    pts.push({ x: x, y: y, r: r, s: 0.10 + s * 0.90 });
  }
  // Tangents per point (unit, in unit space).
  for (i = 0; i < pts.length; i++) {
    var a0 = pts[Math.max(0, i - 1)], a1 = pts[Math.min(pts.length - 1, i + 1)];
    var dx = a1.x - a0.x, dy = a1.y - a0.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    pts[i].tx = dx / len; pts[i].ty = dy / len;
  }
  // Caustic bands: fixed slots along the tube, each with a phase.
  var bands = [];
  var slot;
  for (slot = 0; slot < 8; slot++) {
    bands.push({ i: Math.round(6 + slot * (pts.length - 14) / 11), phase: rnd() * TAU });
  }
  form = { pts: pts, bands: bands };
  placedW = VW; placedH = VH;
}
// One tube cross-section as concentric flat discs: deep blue outside,
// ice blue mid, white-hot core. The core brightens near the light.
function drawDisc(px, py, r, boost) {
  var k;
  for (k = 0; k < RINGS; k++) {
    var f = k / (RINGS - 1);       // 0 outer, 1 inner
    var rad = r * (1.08 - 0.62 * f);
    var color, a;
    if (f < 0.45) { color = DEEP; a = 0.085 + 0.05 * f; }
    else if (f < 0.8) { color = ICE; a = 0.10 + 0.06 * f; }
    else { color = WHITE; a = (0.10 + 0.10 * f) * (0.45 + 0.55 * boost); }
    ctx.globalAlpha = Number(a.toFixed(4));
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(px + rad, py);
    ctx.arc(px, py, rad, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function draw(t) {
  lastT = t;
  size();
  if (!form || placedW !== VW || placedH !== VH) buildForm();
  var minDim = Math.min(VW, VH);
  var cx = VW * 0.5, cy = VH * 0.52;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  // Orbiting light: fixed phase at t = 0, pure function of loop time.
  var ang = PHASE0 + TAU * t / LOOP;
  var orbitR = 0.46 * minDim;
  var lx = cx + Math.cos(ang) * orbitR;
  var ly = cy + Math.sin(ang) * orbitR * 0.72;
  var pts = form.pts, i, p;
  // Light pool on the black ground below the crest: refracted light
  // spilling through the glass, drifting with the orbit.
  ctx.globalCompositeOperation = 'lighter';
  var poolX = cx + Math.cos(ang) * 0.10 * minDim;
  var poolY = cy + 0.30 * minDim + Math.sin(ang) * 0.02 * minDim;
  for (i = 0; i < 5; i++) {
    var f = i / 4;
    ctx.globalAlpha = Number((0.020 * (1 - f)).toFixed(4));
    ctx.fillStyle = ICE;
    ctx.beginPath();
    ctx.moveTo(poolX + 0.20 * minDim * (0.4 + 0.6 * f), poolY);
    ctx.arc(poolX, poolY, 0.20 * minDim * (0.4 + 0.6 * f), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // The light source itself: a small white point with a halo, so the
  // viewer can track the one thing that moves.
  for (i = 0; i < 6; i++) {
    f = i / 5;
    ctx.globalAlpha = Number((0.10 * (1 - f)).toFixed(4));
    ctx.fillStyle = WHITE;
    ctx.beginPath();
    ctx.moveTo(lx + 26 * (0.3 + f), ly);
    ctx.arc(lx, ly, 26 * (0.3 + f), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.moveTo(lx + 3.5, ly);
  ctx.arc(lx, ly, 3.5, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;
  // Frozen tube body: discs along the precomputed centerline.
  ctx.globalCompositeOperation = 'source-over';
  var nearest = 0, nearestD = 1e9;
  for (i = 0; i < pts.length; i++) {
    p = pts[i];
    var px = cx + p.x * minDim, py = cy + p.y * minDim;
    var d = Math.sqrt((px - lx) * (px - lx) + (py - ly) * (py - ly));
    if (d < nearestD) { nearestD = d; nearest = i; }
    var boost = clamp(1 - d / (orbitR * 1.5), 0, 1);
    drawDisc(px, py, p.r * minDim, boost);
  }
  // Specular sheen: one continuous bright line along the tube, offset
  // toward the light by a little over half the tube radius, so the
  // glass reads as a smooth surface instead of a ribbed one.
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.strokeStyle = WHITE;
  ctx.lineWidth = Math.max(1, 0.008 * minDim);
  ctx.beginPath();
  started = false;
  for (i = 0; i < pts.length; i++) {
    p = pts[i];
    var sx = cx + p.x * minDim, sy = cy + p.y * minDim;
    var sdx = lx - sx, sdy = ly - sy;
    var sd = Math.sqrt(sdx * sdx + sdy * sdy) || 1;
    var soff = p.r * minDim * 0.62;
    var sox = sdx / sd * soff, soy = sdy / sd * soff;
    if (!started) { ctx.moveTo(sx + sox, sy + soy); started = true; }
    else ctx.lineTo(sx + sox, sy + soy);
  }
  ctx.globalAlpha = Number((0.22).toFixed(4));
  ctx.stroke();
  // Bright core line: the tube's spine where the light passes through.
  ctx.globalAlpha = 1;
  ctx.strokeStyle = ICE;
  ctx.lineWidth = Math.max(1, 0.012 * minDim);
  ctx.beginPath();
  var started = false;
  for (i = 0; i < pts.length; i++) {
    p = pts[i];
    var qx = cx + p.x * minDim, qy = cy + p.y * minDim;
    var ddx = lx - qx, ddy = ly - qy;
    var dd = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
    var off = p.r * minDim * 0.30;
    var ox = ddx / dd * off, oy = ddy / dd * off;
    if (!started) { ctx.moveTo(qx + ox, qy + oy); started = true; }
    else ctx.lineTo(qx + ox, qy + oy);
  }
  ctx.globalAlpha = Number((0.16).toFixed(4));
  ctx.stroke();
  // Caustics: fixed bands across the tube that brighten and dim in
  // sequence as the light orbits, so refraction appears to crawl.
  for (i = 0; i < form.bands.length; i++) {
    var band = form.bands[i];
    p = pts[band.i];
    var bx = cx + p.x * minDim, by = cy + p.y * minDim;
    var br = p.r * minDim;
    var glow = Math.pow(Math.max(0, Math.cos(ang * 1 - band.phase)), 2);
    var ba = Number((0.03 + 0.13 * glow).toFixed(4));
    ctx.globalAlpha = ba;
    ctx.strokeStyle = WHITE;
    ctx.lineWidth = Math.max(1, br * 0.06);
    ctx.beginPath();
    var nx = -p.ty, ny = p.tx;    // perpendicular to the tube
    ctx.moveTo(bx - nx * br * 0.6, by - ny * br * 0.6);
    ctx.quadraticCurveTo(bx + p.tx * br * 0.3, by + p.ty * br * 0.3,
                         bx + nx * br * 0.6, by + ny * br * 0.6);
    ctx.stroke();
  }
  // Hot spot: the cross-section nearest the light flares gently.
  var hp = pts[nearest];
  var hx = cx + hp.x * minDim, hy = cy + hp.y * minDim;
  for (i = 0; i < 3; i++) {
    f = i / 2;
    ctx.globalAlpha = Number((0.13 * (1 - f)).toFixed(4));
    ctx.fillStyle = WHITE;
    ctx.beginPath();
    ctx.moveTo(hx + hp.r * minDim * (0.35 + 0.4 * f), hy);
    ctx.arc(hx, hy, hp.r * minDim * (0.35 + 0.4 * f), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  // Caption: title, formula date, watch cue. Ice chip, near-black text.
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'One Frame of Smoke  ·  2006 · 05 · 08  ·  Watch the light orbit.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = ICE;
  ctx.fillRect(bx - pad, by, Math.ceil(tw) + 2 * pad, fs + 2 * pad);
  ctx.fillStyle = GROUND;
  ctx.textBaseline = 'top';
  ctx.fillText(label, bx, by + pad);
  if (typeof window !== 'undefined') {
    window.__p1578 = {
      t: t, seed: seed, points: pts.length, bands: form.bands.length,
      lightAngle: ang, phone: isPhone()
    };
  }
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
