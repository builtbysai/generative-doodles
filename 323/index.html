<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.323 Celestial Gingko</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101F1E; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.323 Celestial Gingko (meohmy_graphics).
// Scalloped rows of gold-line gingko fans on a near-black teal
// ground, with one tiny cream flower at each fan base. Exactly
// 5 rows hold 6, 5, 6, 5, 6 fans, exactly 28 fans in all, and
// exactly 28 flowers. A shimmer travels along each row in
// sequence over a 24s seamless loop while the flowers pulse
// on staggered phases, so frame 24s is identical to frame 0.
// Tap a fan: it sheds a drift of gold spores that fade over
// exactly 4s, its strokes fading with them, then the fan
// redraws itself in a 2s stroke reveal, whole again at 6s.
// A tap on a fan mid-cycle is ignored for that fan only. All
// spores come from each fan fixed seed table, authored at
// build time in code; there is no runtime random. All marks
// are data drawn each frame on one canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#101F1E', GOLD = '#D9A441', CREAM = '#F2EBD8', TEAL = '#2E7D7B';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;
var T = 7.3, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- rows and fans: 5 rows, 6 5 6 5 6, exactly 28 -----------
var ROW_COUNTS = [6, 5, 6, 5, 6];
var ROW_Y = [238, 378, 518, 658, 798];
var FANS = [];
var FLOWERS = [];
(function () {
  var idx = 0, row, k, n, x;
  for (row = 0; row < ROW_COUNTS.length; row++) {
    n = ROW_COUNTS[row];
    for (k = 0; k < n; k++) {
      x = DW / 2 + (k - (n - 1) / 2) * 176;
      var seed = 32300 + idx * 137;
      var r = rng(seed);
      var spores = [], s;
      for (s = 0; s < 16; s++) {
        spores.push({
          ang: -Math.PI / 2 + (r() - 0.5) * 2.0,
          dist: 34 + r() * 92,
          len: 5 + r() * 9,
          sway: (r() - 0.5) * 30,
          swayPh: r() * Math.PI * 2,
          off: r() * 0.35,
          bright: 0.35 + r() * 0.65,
          startR: 0.45 + r() * 0.35
        });
      }
      FANS.push({
        idx: idx, row: row, col: k, x: x, y: ROW_Y[row],
        R: 66, seed: seed, spores: spores,
        shimPh: row * 0.13 + (n > 1 ? (k / (n - 1)) * 0.85 : 0),
        tapT0: -1000
      });
      FLOWERS.push({ fan: idx, x: x, y: ROW_Y[row] + 4, ph: idx * 0.11 });
      idx++;
    }
  }
})();
if (ROW_COUNTS.length !== 5) throw new Error('Celestial Gingko needs exactly 5 rows');
if (FANS.length !== 28) throw new Error('Celestial Gingko needs exactly 28 fans');
(function () {
  var perRow = [0, 0, 0, 0, 0], i;
  for (i = 0; i < FANS.length; i++) perRow[FANS[i].row]++;
  for (i = 0; i < 5; i++) if (perRow[i] !== ROW_COUNTS[i]) throw new Error('Celestial Gingko row count mismatch');
  if (FLOWERS.length !== 28) throw new Error('Celestial Gingko needs exactly 28 flowers');
  var seen = {}, f;
  for (i = 0; i < FLOWERS.length; i++) {
    f = FLOWERS[i];
    if (seen[f.fan]) throw new Error('Celestial Gingko needs exactly one flower per fan');
    seen[f.fan] = 1;
    if (FANS[f.fan].x !== f.x || FANS[f.fan].y + 4 !== f.y) throw new Error('Celestial Gingko flower not at fan base');
  }
})();

// ---- one fan, line art only ----------------------------------
// alpha scales every stroke; reveal is 0..1 stroke reveal.
function drawFan(fan, alpha, reveal) {
  var bx = fan.x, by = fan.y, R = fan.R, i, a, x, y;
  var loopPhase = (T % LOOP) / LOOP;
  var shim = 0.5 + 0.5 * Math.sin(Math.PI * 2 * (loopPhase - fan.shimPh));
  shim = shim * shim;
  ctx.save();
  ctx.globalAlpha = alpha;
  // Stem, first in the reveal.
  if (reveal > 0) {
    st(GOLD, 2.0);
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.lineTo(bx, by + 20 * Math.min(1, reveal * 5)); ctx.stroke();
  }
  if (reveal >= 1) {
    // Side lines from the base to the rim ends.
    st(GOLD, 1.5);
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.cos(Math.PI) * R, by + Math.sin(Math.PI) * R * 0.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.cos(0) * R, by + Math.sin(0) * R * 0.28); ctx.stroke();
    // Scalloped rim: sampled arc with a small cosine ripple.
    st(GOLD, 1.6 + 0.7 * shim);
    ctx.beginPath();
    var steps = 40;
    for (i = 0; i <= steps; i++) {
      a = Math.PI - (i / steps) * Math.PI;
      var rr = R + 3.5 * Math.cos(9 * a);
      x = bx + Math.cos(a) * rr; y = by - Math.sin(a) * rr * 0.92;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    if (shim > 0.25) {
      ctx.globalAlpha = alpha * (shim - 0.25) * 0.55;
      st(GOLD, 3.6);
      ctx.beginPath();
      for (i = 0; i <= steps; i++) {
        a = Math.PI - (i / steps) * Math.PI;
        var rr2 = R + 3.5 * Math.cos(9 * a);
        x = bx + Math.cos(a) * rr2; y = by - Math.sin(a) * rr2 * 0.92;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.globalAlpha = alpha;
    }
    // Veins radiating from the base.
    for (i = 0; i < 9; i++) {
      a = Math.PI - (0.06 + 0.88 * (i / 8)) * Math.PI;
      var vr = R * 0.88 + 3 * Math.cos(9 * a);
      st(GOLD, 1.15 + 0.55 * shim);
      ctx.beginPath(); ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.cos(a) * vr, by - Math.sin(a) * vr * 0.92);
      ctx.stroke();
    }
    // A teal inner rim accent, low in the fan.
    ctx.globalAlpha = alpha * 0.65;
    st(TEAL, 1.2);
    ctx.beginPath();
    for (i = 0; i <= 24; i++) {
      a = Math.PI - (i / 24) * Math.PI;
      var tr = R * 0.52;
      x = bx + Math.cos(a) * tr; y = by - Math.sin(a) * tr * 0.92;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = alpha;
  } else if (reveal > 0) {
    // Stroke reveal: rim points appear in order, then veins
    // grow one by one, each scaled by its share of the reveal.
    var rimFrac = clamp01(reveal / 0.45);
    var steps2 = 40, upto = Math.floor(rimFrac * steps2);
    if (upto > 0) {
      st(GOLD, 1.6 + 0.7 * shim);
      ctx.beginPath();
      for (i = 0; i <= upto; i++) {
        a = Math.PI - (i / steps2) * Math.PI;
        var rr3 = R + 3.5 * Math.cos(9 * a);
        x = bx + Math.cos(a) * rr3; y = by - Math.sin(a) * rr3 * 0.92;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      st(GOLD, 1.5);
      ctx.beginPath(); ctx.moveTo(bx, by);
      ctx.lineTo(bx - R, by); ctx.stroke();
      if (rimFrac >= 1) {
        ctx.beginPath(); ctx.moveTo(bx, by);
        ctx.lineTo(bx + R, by); ctx.stroke();
      }
    }
    var veinSpan = clamp01((reveal - 0.4) / 0.6);
    for (i = 0; i < 9; i++) {
      var vf = clamp01(veinSpan * 9 - i);
      if (vf <= 0) continue;
      a = Math.PI - (0.06 + 0.88 * (i / 8)) * Math.PI;
      var vr2 = (R * 0.88 + 3 * Math.cos(9 * a)) * vf;
      st(GOLD, 1.15 + 0.55 * shim);
      ctx.beginPath(); ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.cos(a) * vr2, by - Math.sin(a) * vr2 * 0.92);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawFlower(fl) {
  // Tiny cream flower: 5 petals around a gold heart, pulsing
  // gently on a staggered phase, 3 pulses per 24s loop.
  var loopPhase = (T % LOOP) / LOOP;
  var pulse = 0.5 + 0.5 * Math.sin(Math.PI * 2 * (3 * loopPhase - fl.ph));
  var sc = 0.85 + 0.30 * pulse;
  var k, a, px, py;
  ctx.save();
  ctx.globalAlpha = 0.82 + 0.18 * pulse;
  ctx.fillStyle = CREAM;
  for (k = 0; k < 5; k++) {
    a = k / 5 * Math.PI * 2 - Math.PI / 2;
    px = fl.x + Math.cos(a) * 5.2 * sc; py = fl.y + Math.sin(a) * 5.2 * sc;
    circ(px, py, 3.4 * sc, true);
  }
  ctx.fillStyle = GOLD;
  circ(fl.x, fl.y, 2.1 * sc, true);
  ctx.restore();
}

function drawSpores(fan, dt) {
  // dt in 0..4. Seeded filaments drift out from the fan rim
  // and fade across exactly 4s.
  var p = clamp01(dt / 4), i, sp, lp, ease, sx, sy, ex, ey, al;
  ctx.save();
  for (i = 0; i < fan.spores.length; i++) {
    sp = fan.spores[i];
    lp = clamp01((p - sp.off) / (1 - sp.off));
    if (lp <= 0 || lp >= 1) continue;
    ease = 1 - (1 - lp) * (1 - lp);
    sx = fan.x + Math.cos(sp.ang) * fan.R * sp.startR;
    sy = fan.y - Math.sin(-sp.ang) * fan.R * sp.startR * 0.4 - fan.R * sp.startR * 0.35;
    ex = sx + Math.cos(sp.ang) * sp.dist * ease + Math.sin(lp * Math.PI * 2 + sp.swayPh) * sp.sway * lp;
    ey = sy + Math.sin(sp.ang) * sp.dist * ease - 12 * lp;
    al = (1 - lp) * sp.bright * Math.min(1, lp * 9);
    ctx.globalAlpha = al;
    st(GOLD, 1.4);
    ctx.beginPath();
    ctx.moveTo(ex - Math.cos(sp.ang) * sp.len * 0.5, ey - Math.sin(sp.ang) * sp.len * 0.5);
    ctx.lineTo(ex + Math.cos(sp.ang) * sp.len * 0.5, ey + Math.sin(sp.ang) * sp.len * 0.5);
    ctx.stroke();
    ctx.fillStyle = GOLD;
    circ(ex, ey, 1.6, true);
  }
  ctx.restore();
}

function drawScallopRow(fanRow, y) {
  // A chain of small scallop arcs along the row, under the fans.
  var xs = [], i;
  for (i = 0; i < FANS.length; i++) if (FANS[i].row === fanRow) xs.push(FANS[i].x);
  if (!xs.length) return;
  var x0 = Math.min.apply(null, xs) - 92, x1 = Math.max.apply(null, xs) + 92;
  ctx.save();
  ctx.globalAlpha = 0.5;
  st(TEAL, 1.3);
  var step = 36, x;
  ctx.beginPath();
  for (x = x0; x + step <= x1 + 0.5; x += step) {
    ctx.moveTo(x, y);
    ctx.arc(x + step / 2, y, step / 2, Math.PI, 0, false);
  }
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var i, fan, dt;
  for (i = 0; i < 5; i++) drawScallopRow(i, ROW_Y[i] + 30);
  for (i = 0; i < FANS.length; i++) {
    fan = FANS[i];
    dt = T - fan.tapT0;
    if (dt >= 0 && dt < 4) {
      drawFan(fan, 1 - 0.92 * clamp01(dt / 4), 1);
      drawSpores(fan, dt);
    } else if (dt >= 4 && dt < 6) {
      drawFan(fan, 1, clamp01((dt - 4) / 2));
    } else {
      if (dt >= 6) fan.tapT0 = -1000;
      drawFan(fan, 1, 1);
    }
  }
  for (i = 0; i < FLOWERS.length; i++) drawFlower(FLOWERS[i]);
}

// ---- interaction: tap a fan ----------------------------------
var tap = null;
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  tap = { x: p[0], y: p[1], sx: p[0], sy: p[1], moved: 0 };
});
canvas.addEventListener('pointermove', function (e) {
  if (!tap) return;
  var p = toDesign(e);
  tap.moved = Math.max(tap.moved, Math.abs(p[0] - tap.sx), Math.abs(p[1] - tap.sy));
});
canvas.addEventListener('pointerup', function (e) {
  if (tap && tap.moved < 9) {
    var p = toDesign(e), i, fan, dx, dy, d, best = null, bestD = 1e9;
    for (i = 0; i < FANS.length; i++) {
      fan = FANS[i];
      dx = p[0] - fan.x; dy = p[1] - (fan.y - 28);
      d = Math.sqrt(dx * dx + dy * dy);
      if (d < 80 && d < bestD) { bestD = d; best = fan; }
    }
    if (best) {
      var dt = T - best.tapT0;
      if (!(dt >= 0 && dt < 6)) best.tapT0 = T;
    }
  }
  tap = null;
});
canvas.addEventListener('pointercancel', function () { tap = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
