<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.427 Self-Care Waltz</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#3E2A4F; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.427 Self-Care Waltz (yaelhofri, EXPANSION #46).
// After Yael Hofri's Sweetemberdays26 Prompt 2: a woman
// dancing barefoot at home at night, pink headphones on,
// a glass of red wine raised, houseplants framing the
// room and two cats asleep on a magenta rug. Warm
// lamplight pools on the floor around her. She sways
// side to side, hair and hem swinging a beat behind
// her, while music notes rise from the headphones and
// fade. The cats stay asleep; only their tails flick,
// once each per loop. Stillness around the dance is
// the point.
//
// WATCH-ONLY: no interaction at all; the loop is the
// piece. The ambient loop is 14s, seamless: the figure
// sways on a 2s cycle (7 per loop) at 4 degrees, hair
// and dress hem lag the sway by a fixed 0.3s phase,
// seven music-note glyphs (shapes only, never text)
// each rise and fade once per loop on staggered
// offsets, and the two cats' tails flick at fixed
// slots 3.2s and 10.2s (the prompt's 7s cadence made
// exact, one flick per cat per loop). Frame one is
// drawn at the constant phase T = 5.3s, mid-sway with
// notes rising; the clock is anchored there and
// advances in fixed 1/60 ticks, never from a wall
// clock. Flat colour only; the lamp glow is one flat
// stepped pool (concentric flat-alpha ellipses), no
// gradients. One canvas, no offscreen canvas, no
// shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// The YAE3 palette only, nothing else: dusk purple
// walls, lamp-glow yellow, headphone pink, dress
// red-pink, plant green, the two cat browns, rug
// magenta with its pale pink pattern, wine. Skin and
// hair are resolved from inside the palette (see
// process.md): skin is the rug's pale pink #F6D7DE,
// hair is the deep wine #7A1E2B, which also fills the
// glass and draws the facial lines.
var WALLS = '#3E2A4F', GLOW = '#F7D354', PHONES = '#F06A8A';
var DRESS = '#D94F6B', PLANTS = '#4E7A3A';
var CAT1 = '#C9A24B', CAT2 = '#8A6A2E';
var RUG = '#E84393', RUGL = '#F6D7DE', WINE = '#7A1E2B';
var SKIN = RUGL, HAIR = WINE;

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 14;
if (LOOP !== 14) throw new Error('Self-Care Waltz loop must be 14s');
var TICK = 1 / 60;

// QA probe via the house seed pattern: ?seed=flick
// starts the clock mid tail-flick (T = 3.65s) so the
// first cat's flick can be render-checked. It does not
// affect the shipped default, which starts at
// T_OFF = 5.3s exactly.
var seedStr = (typeof location !== 'undefined' && location.search) ? location.search : '';
var T_OFF = seedStr.indexOf('flick') >= 0 ? 3.65 : 5.3;

// ---- small draw helpers ---------------------------------
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function ell(x, y, rx, ry, rot, fill) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function line(x0, y0, x1, y1, col, lw) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function limb(x0, y0, x1, y1, x2, y2, col, lw) {
  ctx.beginPath(); ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(x1, y1, x2, y2);
  ctx.strokeStyle = col; ctx.lineWidth = lw;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
function leaf(x, y, len, wid, ang, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(wid, -len * 0.45, 0, -len);
  ctx.quadraticCurveTo(-wid, -len * 0.45, 0, 0);
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  ctx.restore();
}

// ---- the room -------------------------------------------
// Dusk walls fill the frame. The lamp glow is one flat
// stepped pool: concentric flat-alpha ellipses of glow
// yellow on the floor around the rug, widest and
// faintest first. Drawn before everything else.
function drawWalls() {
  ctx.fillStyle = WALLS;
  ctx.fillRect(-260, -260, DW + 520, DH + 520);
  ctx.globalAlpha = 0.06; ell(640, 792, 640, 138, 0, GLOW);
  ctx.globalAlpha = 0.10; ell(640, 792, 512, 112, 0, GLOW);
  ctx.globalAlpha = 0.16; ell(640, 792, 396, 88, 0, GLOW);
  ctx.globalAlpha = 1;
}

// A floor lamp standing behind the left plant: wine
// base and pole, a solid glow-yellow shade, and two
// stepped halo ellipses behind the shade (part of the
// same stepped-pool treatment, never a gradient).
function drawLamp() {
  ctx.globalAlpha = 0.07; ell(196, 322, 128, 104, 0, GLOW);
  ctx.globalAlpha = 0.12; ell(196, 322, 88, 72, 0, GLOW);
  ctx.globalAlpha = 1;
  ell(196, 706, 48, 11, 0, WINE);
  line(196, 706, 196, 372, WINE, 11);
  ctx.beginPath();
  ctx.moveTo(140, 372); ctx.lineTo(252, 372);
  ctx.lineTo(228, 278); ctx.lineTo(164, 278);
  ctx.closePath(); ctx.fillStyle = GLOW; ctx.fill();
  circ(196, 268, 8, PHONES);
}

// Potted plants framing both edges. Wine pots, green
// stems and leaves, all static: the room stays still.
// Each plant is a fixed authored table of leaves
// {dx, dy, len, wid, ang} read from its crown.
function drawPlant(px, baseY, flip, leaves) {
  ctx.beginPath();
  ctx.moveTo(px - 40, baseY - 62); ctx.lineTo(px + 40, baseY - 62);
  ctx.lineTo(px + 30, baseY); ctx.lineTo(px - 30, baseY);
  ctx.closePath(); ctx.fillStyle = WINE; ctx.fill();
  ctx.fillStyle = WINE; ctx.fillRect(px - 46, baseY - 74, 92, 14);
  for (var i = 0; i < leaves.length; i++) {
    var L = leaves[i];
    var sx = px + L.dx * flip, sy = baseY - 66 + L.dy;
    ctx.beginPath(); ctx.moveTo(px, baseY - 62);
    ctx.quadraticCurveTo(px + L.dx * flip * 0.5, baseY - 120 + L.dy * 0.4, sx, sy);
    ctx.strokeStyle = PLANTS; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
    leaf(sx, sy, L.len, L.wid, L.ang * flip, PLANTS);
  }
}
var PLANT_L = [
  { dx: -34, dy: -96,  len: 74, wid: 17, ang: -0.5 },
  { dx: -8,  dy: -138, len: 88, wid: 19, ang: -0.12 },
  { dx: 22,  dy: -118, len: 80, wid: 18, ang: 0.3 },
  { dx: -52, dy: -52,  len: 62, wid: 15, ang: -0.85 },
  { dx: 44,  dy: -64,  len: 66, wid: 16, ang: 0.7 },
  { dx: 2,   dy: -176, len: 78, wid: 17, ang: 0.05 }
];
var PLANT_R = [
  { dx: 30,  dy: -104, len: 78, wid: 18, ang: 0.45 },
  { dx: 4,   dy: -148, len: 92, wid: 20, ang: 0.1 },
  { dx: -24, dy: -122, len: 82, wid: 18, ang: -0.32 },
  { dx: 54,  dy: -58,  len: 64, wid: 16, ang: 0.85 },
  { dx: -46, dy: -66,  len: 68, wid: 16, ang: -0.7 },
  { dx: -4,  dy: -186, len: 80, wid: 17, ang: -0.04 }
];

// ---- the rug ----------------------------------------------
// Magenta ellipse with a pale pattern: an inner ring
// stroke, a ring of small diamonds, and a centre
// medallion, all in the rug's own pale pink.
function drawRug() {
  ell(640, 800, 482, 100, 0, RUG);
  ctx.beginPath(); ctx.ellipse(640, 800, 424, 80, 0, 0, Math.PI * 2);
  ctx.strokeStyle = RUGL; ctx.lineWidth = 5; ctx.globalAlpha = 0.75; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = RUGL;
  for (var i = 0; i < 16; i++) {
    var a = i * Math.PI / 8;
    var dx = 640 + 356 * Math.cos(a), dy = 800 + 62 * Math.sin(a);
    ctx.save(); ctx.translate(dx, dy); ctx.rotate(Math.PI / 4);
    ctx.globalAlpha = 0.8; ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }
  ctx.globalAlpha = 0.85;
  ctx.save(); ctx.translate(640, 800); ctx.rotate(Math.PI / 4);
  ctx.fillRect(-13, -13, 26, 26); ctx.restore();
  circ(640, 800, 6, RUGL);
  ctx.globalAlpha = 1;
}

// ---- the cats ----------------------------------------------
// Two sleeping cats curled in comma shapes on the rug,
// bottom-left. A comma curl: a round body, a tucked
// head with ears and one closed eye, and a tail that
// wraps around the body. The bodies never move; only
// the tail tip flicks, inside its fixed slot.
function flickOffset(t, slotStart) {
  var p = (t - slotStart) / 0.9;
  if (p < 0 || p > 1) return 0;
  return Math.sin(p * Math.PI * 3) * (1 - p * 0.4) * 0.42;
}
function drawCat(cx, cy, r, body, stripe, t, slotStart) {
  var fo = flickOffset(t, slotStart);
  // tail: a fixed wrap arc hugging just outside the
  // body, then a tip segment rotated by the flick
  // offset about the body centre
  var tcx = cx + 3, tcy = cy + 5, tr = r * 1.05;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(tcx, tcy, tr, Math.PI * 0.55, Math.PI * 1.62);
  ctx.strokeStyle = body; ctx.lineWidth = r * 0.27; ctx.stroke();
  ctx.save(); ctx.translate(tcx, tcy); ctx.rotate(fo);
  ctx.beginPath(); ctx.arc(0, 0, tr, Math.PI * 1.62, Math.PI * 2.08);
  ctx.strokeStyle = body; ctx.lineWidth = r * 0.27; ctx.stroke();
  ctx.restore();
  circ(tcx + tr * Math.cos(Math.PI * 2.08 + fo), tcy + tr * Math.sin(Math.PI * 2.08 + fo), r * 0.14, stripe);
  // body and stripes
  circ(cx, cy, r, body);
  ctx.strokeStyle = stripe; ctx.globalAlpha = 0.45; ctx.lineWidth = r * 0.09;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.66, Math.PI * 1.15, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.8, Math.PI * 1.2, Math.PI * 1.48); ctx.stroke();
  ctx.globalAlpha = 1;
  // tucked head, ears, one closed sleeping eye
  var hx = cx - r * 0.46, hy = cy - r * 0.30, hr = r * 0.52;
  ctx.beginPath();
  ctx.moveTo(hx - hr * 0.72, hy - hr * 0.62);
  ctx.lineTo(hx - hr * 0.42, hy - hr * 1.06);
  ctx.lineTo(hx - hr * 0.08, hy - hr * 0.72);
  ctx.closePath(); ctx.fillStyle = body; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx + hr * 0.14, hy - hr * 0.74);
  ctx.lineTo(hx + hr * 0.52, hy - hr * 1.02);
  ctx.lineTo(hx + hr * 0.66, hy - hr * 0.5);
  ctx.closePath(); ctx.fillStyle = body; ctx.fill();
  circ(hx, hy, hr, body);
  ctx.beginPath(); ctx.arc(hx - hr * 0.1, hy + hr * 0.02, hr * 0.3, Math.PI * 1.1, Math.PI * 1.85);
  ctx.strokeStyle = WINE; ctx.lineWidth = 3.4; ctx.stroke();
  circ(hx + hr * 0.34, hy + hr * 0.3, hr * 0.09, WINE);
}

// ---- music notes --------------------------------------------
// Note glyphs are pure shapes: a filled ellipse head, a
// stem, and a flag (single) or a beam (double). Seven
// authored notes rise from the headphone cups; each one
// completes exactly one rise per 14s loop on its own
// staggered offset, fading in and out, so the stream is
// seamless. Drawn in world space from the sway-rotated
// cup anchors.
var NOTES = [
  { side: 1,  off: 0,  type: 0, col: GLOW },
  { side: -1, off: 2,  type: 1, col: PHONES },
  { side: 1,  off: 4,  type: 1, col: PHONES },
  { side: -1, off: 6,  type: 0, col: GLOW },
  { side: 1,  off: 8,  type: 0, col: RUGL },
  { side: -1, off: 10, type: 1, col: GLOW },
  { side: 1,  off: 12, type: 0, col: PHONES }
];
if (NOTES.length !== 7) throw new Error('Self-Care Waltz must have exactly 7 notes');
function drawNoteGlyph(x, y, s, col, alpha, type) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha;
  ctx.fillStyle = col;
  if (type === 0) {
    ctx.beginPath(); ctx.ellipse(0, 0, 9.5 * s, 6.8 * s, -0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(7.6 * s, -37 * s, 3.4 * s, 37 * s);
    ctx.beginPath();
    ctx.moveTo(7.6 * s, -37 * s);
    ctx.quadraticCurveTo(21 * s, -31 * s, 19.5 * s, -15 * s);
    ctx.quadraticCurveTo(14.5 * s, -24 * s, 7.6 * s, -21 * s);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(0, 0, 9.5 * s, 6.8 * s, -0.35, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(26 * s, -5 * s, 9.5 * s, 6.8 * s, -0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(7.6 * s, -37 * s, 3.4 * s, 37 * s);
    ctx.fillRect(33.6 * s, -42 * s, 3.4 * s, 37 * s);
    ctx.beginPath();
    ctx.moveTo(7.6 * s, -37 * s); ctx.lineTo(37 * s, -42 * s);
    ctx.lineTo(37 * s, -30 * s); ctx.lineTo(7.6 * s, -25 * s);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function rotPt(x, y, px, py, a) {
  var dx = x - px, dy = y - py, c = Math.cos(a), s = Math.sin(a);
  return [px + dx * c - dy * s, py + dx * s + dy * c];
}
function drawNotes(t, swayA) {
  for (var i = 0; i < NOTES.length; i++) {
    var n = NOTES[i];
    var anchor = rotPt(640 + n.side * 58, 246, 640, 700, swayA);
    var p = ((t + n.off) % LOOP) / LOOP;
    var fadeIn = Math.min(1, p / 0.12);
    var fadeOut = p > 0.55 ? Math.max(0, 1 - (p - 0.55) / 0.3) : 1;
    var alpha = fadeIn * fadeOut * 0.95;
    if (alpha <= 0.01) continue;
    var x = anchor[0] + n.side * (14 + 40 * p) + Math.sin(p * 5.2 + i * 1.7) * 9;
    var y = anchor[1] - 16 - p * 215;
    drawNoteGlyph(x, y, 0.82 + 0.36 * p, n.col, alpha, n.type);
  }
}

// ---- the dancer ----------------------------------------------
// Built around the sway pivot at her feet (640, 700).
// The whole figure rotates by the sway angle; inside
// it, the hair mass rotates by the lagged angle about
// the neck and the dress hem shifts by the lagged
// phase, so hair and hem trail the body by 0.3s.
function swayAngle(t) { return (4 * Math.PI / 180) * Math.sin(Math.PI * 2 * t / 2); }

function drawDancer(t) {
  var a = swayAngle(t);
  var aLag = swayAngle(t - 0.3);
  var hemShift = Math.sin(Math.PI * 2 * (t - 0.3) / 2) * 30;
  ctx.save();
  ctx.translate(640, 700); ctx.rotate(a); ctx.translate(-640, -700);

  // hair back mass, on the lagged angle about the neck
  ctx.save();
  ctx.translate(640, 300); ctx.rotate(aLag - a); ctx.translate(-640, -300);
  ell(640, 336, 106, 128, 0, HAIR);
  circ(640, 252, 76, HAIR);
  ctx.restore();

  // legs: one standing, one lifted in the twirl
  limb(652, 540, 658, 618, 664, 686, SKIN, 27);
  limb(622, 540, 556, 588, 518, 552, SKIN, 27);
  ell(676, 692, 21, 9, 0.1, SKIN);
  ell(502, 546, 18, 8, -0.6, SKIN);

  // arms: far arm out to the side, near arm raised
  limb(604, 314, 548, 362, 494, 340, SKIN, 24);
  circ(494, 340, 13, SKIN);
  limb(676, 314, 740, 254, 794, 198, SKIN, 24);
  circ(794, 198, 13, SKIN);

  // dress, hem swung by the lagged phase
  ctx.beginPath();
  ctx.moveTo(604, 290);
  ctx.quadraticCurveTo(640, 280, 678, 290);
  ctx.lineTo(670, 428);
  ctx.quadraticCurveTo(714 + hemShift * 0.4, 498, 748 + hemShift, 560);
  ctx.quadraticCurveTo(640 + hemShift * 0.55, 586, 532 + hemShift, 560);
  ctx.quadraticCurveTo(566 + hemShift * 0.4, 498, 610, 428);
  ctx.closePath(); ctx.fillStyle = DRESS; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(611, 428);
  ctx.quadraticCurveTo(640, 438, 669, 428);
  ctx.strokeStyle = RUGL; ctx.lineWidth = 6; ctx.stroke();

  // head and face
  circ(640, 252, 47, SKIN);
  ctx.strokeStyle = WINE; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(622, 250, 7.5, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  ctx.beginPath(); ctx.arc(658, 250, 7.5, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  ctx.beginPath(); ctx.arc(640, 262, 10, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
  ctx.globalAlpha = 0.55;
  ell(606, 266, 8, 5, 0, PHONES);
  ell(674, 266, 8, 5, 0, PHONES);
  ctx.globalAlpha = 1;

  // hair front arc over the head
  ctx.beginPath(); ctx.arc(640, 248, 51, Math.PI * 1.02, Math.PI * 1.98);
  ctx.strokeStyle = HAIR; ctx.lineWidth = 17; ctx.stroke();

  // headphones: band across the hair, cups at the ears
  ctx.beginPath(); ctx.arc(640, 250, 59, Math.PI * 1.04, Math.PI * 1.96);
  ctx.strokeStyle = PHONES; ctx.lineWidth = 13; ctx.stroke();
  ell(582, 258, 14, 22, 0, PHONES);
  ell(698, 258, 14, 22, 0, PHONES);
  ell(582, 258, 6.5, 11, 0, WALLS);
  ell(698, 258, 6.5, 11, 0, WALLS);

  // the raised wine glass, gripped by its stem
  ctx.strokeStyle = RUGL; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(772, 136);
  ctx.quadraticCurveTo(774, 172, 796, 174);
  ctx.quadraticCurveTo(818, 172, 820, 136);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(774, 148);
  ctx.quadraticCurveTo(776, 168, 796, 170);
  ctx.quadraticCurveTo(816, 168, 818, 148);
  ctx.quadraticCurveTo(796, 156, 774, 148);
  ctx.closePath(); ctx.fillStyle = WINE; ctx.fill();
  line(796, 174, 796, 196, RUGL, 4);
  ell(796, 198, 16, 4.5, 0, RUGL);

  ctx.restore();
}

// ---- frame ---------------------------------------------------
function draw() {
  drawWalls();
  drawLamp();
  drawRug();
  drawPlant(74, 726, 1, PLANT_L);
  drawPlant(1206, 736, -1, PLANT_R);
  drawCat(298, 776, 60, CAT1, CAT2, T, 3.2);
  drawCat(452, 806, 46, CAT2, CAT1, T, 10.2);
  drawDancer(T);
  drawNotes(T, swayAngle(T));
}

// ---- clock ----------------------------------------------------
// T starts at the constant phase T_OFF and advances in fixed
// 1/60 ticks; frame one is drawn synchronously at T_OFF
// exactly, so the thumbnail reproduces byte-identically from
// the shipped script.
var T = T_OFF, acc = 0, lastNow = -1;
function step() { /* state is a pure function of T */ }

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
