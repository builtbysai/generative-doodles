<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tumblewood</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14100a; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<!-- piece-9126-tumblewood -->
<canvas id="c"></canvas>
<script>
'use strict';
'use strict';
/* Piece 9126 driver core: pure functions, no DOM. Shared by node harness and browser. */
const TAU = Math.PI * 2;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const N_LEAVES = 56;
const DEPTH_MIN = 0.45;   // far-band speed/size factor
const MARGIN = 80;        // recycle margin beyond viewport

function depthScale(z) { return 1 - (1 - DEPTH_MIN) * z; }

function createDriver(W, H, seed) {
  let rng = mulberry32(seed);
  let leaves = [];
  let t = 0;
  let gust = { x: 0, y: 0, ttl: 0, dur: 1 };

  function spawnLeaf(anywhere) {
    const z = rng();
    const leaf = {
      z,
      band: Math.min(4, Math.floor(z * 5)),
      // tumble rate tied to fall speed: guarantees >= 1 revolution per descent
      omega: 0, // set below
      glide: 0.15 + rng() * 0.85,
      // fast small flutter (1.2..2.5 Hz) kept disjoint from meander freq (<=0.91 Hz)
      // so the two can never cancel; meander alone guarantees the C2 minimum.
      swayAmp: (4 + rng() * 10) * (W / 1280),
      swayFreq: 1.2 + rng() * 1.3,
      swayPhase: rng() * TAU,
      meanderAmp: (95 + rng() * 55) * (W / 1280),
      meanderWL: 0.25 + rng() * 0.35, // fraction of H per lateral wave
      meanderPhase: rng() * TAU,
      fallSpeed: (62 + rng() * 120) * (H / 800),
      suscept: 0.4 + rng() * 0.8,
      x0: (0.05 + rng() * 0.9) * W,
      y: anywhere ? rng() * (H + 2 * MARGIN) - MARGIN : -MARGIN - rng() * 60,
      rot: rng() * TAU,
      blow: 0,
      t: rng() * 100,
    };
    leaf.fall = leaf.fallSpeed * depthScale(z);
    leaf.omega = leaf.fall * (0.008 + rng() * 0.02) * (rng() < 0.5 ? -1 : 1);
    return leaf;
  }

  function reseed(newSeed) {
    rng = mulberry32(newSeed);
    leaves = [];
    for (let i = 0; i < N_LEAVES; i++) leaves.push(spawnLeaf(true));
    t = 0;
    gust = { x: 0, y: 0, ttl: 0, dur: 1 };
  }

  function applyGust(gx, gy, dur) {
    const cap = 900 * (W / 1280);
    const m = Math.hypot(gx, gy);
    const k = m > cap ? cap / m : 1;
    gust = { x: gx * k, y: gy * k, ttl: dur, dur };
  }

  function windAt() {
    const gk = gust.ttl > 0 ? gust.ttl / gust.dur : 0;
    return {
      x: 14 * Math.sin(t * 0.35) * (W / 1280) + gust.x * gk,
      y: gust.y * gk * 0.4,
    };
  }

  // Rendered position of a leaf (also used by harness for measurement).
  function leafPos(l) {
    const swayX = l.swayAmp * Math.sin(TAU * l.swayFreq * l.t + l.swayPhase);
    const meanderX = l.meanderAmp * Math.sin(TAU * (l.y / (l.meanderWL * H)) + l.meanderPhase);
    return { x: l.x0 + swayX + meanderX + l.blow, y: l.y };
  }

  function step(dt) {
    t += dt;
    if (gust.ttl > 0) gust.ttl = Math.max(0, gust.ttl - dt);
    const w = windAt();
    for (const l of leaves) {
      l.t += dt;
      l.y += l.fall * dt + w.y * 0.3 * dt;
      const adv = w.x * (0.25 + 0.75 * l.glide) * l.suscept;
      l.blow += adv * dt;
      l.blow *= Math.exp(-dt / 3); // gust displacement relaxes back
      const blowMax = 0.35 * W;
      if (l.blow > blowMax) l.blow = blowMax;
      else if (l.blow < -blowMax) l.blow = -blowMax;
      l.rot += l.omega * (1 + 0.35 * Math.min(1, Math.abs(w.x) / 400)) * dt;
      if (l.y > H + MARGIN) Object.assign(l, spawnLeaf(false));
    }
  }

  function signature() {
    return leaves.map(l =>
      [l.omega, l.glide, l.swayPhase, l.fallSpeed, l.z]
        .map(v => v.toFixed(3)).join(',')
    ).join(';');
  }

  reseed(seed);
  return {
    step, reseed, applyGust, leafPos,
    get leaves() { return leaves; },
    get time() { return t; },
    signature,
    consts: { N_LEAVES, MARGIN, W, H },
  };
}




/* ---------- corridor (decoration; fixed layout seed) ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let driver = null;
let seed = (Date.now() % 2147483647) || 7;
let corridor = null;

const VP = () => ({ x: W / 2, y: H * 0.30 });

function lerp(a, b, k) { return a + (b - a) * k; }
function parseColor(h) {
  if (h[0] === '#') return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const m = h.match(/\d+/g); return [+m[0], +m[1], +m[2]];
}
function mix(c1, c2, k) {  // accepts '#rrggbb' or 'rgb(..)'; safe to nest
  const a = parseColor(c1), b = parseColor(c2);
  const m = a.map((v, i) => Math.round(lerp(v, b[i], k)));
  return 'rgb(' + m[0] + ',' + m[1] + ',' + m[2] + ')';
}

function buildCorridor() {
  const rng = mulberry32(9126);
  const vp = VP();
  const bands = [];
  for (let b = 4; b >= 0; b--) {           // far (4) to near (0); drawn far first
    const n = 9 - b;                        // far: 9 thin, near: 5 wide
    const trunks = [];
    for (let i = 0; i < n; i++) {
      const baseX = lerp(-0.10 * W, 1.10 * W, (i + 0.15 + rng() * 0.7) / n);
      const topX = lerp(baseX, vp.x, 0.35 + 0.60 * (b / 4));
      const wBase = lerp(110, 10, b / 4) * (W / 1280) * (0.7 + rng() * 0.6);
      trunks.push({ baseX, topX, wBase, wTop: wBase * 0.35, shade: b / 4 });
    }
    bands.push({ b, trunks });
  }
  // near frame trunks at the extreme edges (drawn last)
  const frame = [
    { baseX: -0.06 * W, topX: -0.10 * W, wBase: 150 * (W / 1280), wTop: 120 * (W / 1280) },
    { baseX: 1.06 * W, topX: 1.10 * W, wBase: 150 * (W / 1280), wTop: 120 * (W / 1280) },
  ];
  // static fallen leaves on the floor
  const floorLeaves = [];
  for (let i = 0; i < 46; i++) {
    const fy = lerp(vp.y + 20, H + 30, Math.pow(rng(), 0.6));
    const spread = lerp(0.18, 0.62, (fy - vp.y) / H);
    floorLeaves.push({
      x: vp.x + (rng() * 2 - 1) * spread * W,
      y: fy,
      s: lerp(2, 7, (fy - vp.y) / H) * (W / 1280 + 0.5),
      rot: rng() * TAU,
      c: ['#9a6524', '#b06a24', '#8a4520', '#a56c28'][Math.floor(rng() * 4)],
    });
  }
  corridor = { bands, frame, floorLeaves };
}

function drawCorridor() {
  const vp = VP();
  // deep warm ground
  ctx.fillStyle = '#14100a';
  ctx.fillRect(0, 0, W, H);
  // far light glow at the corridor end (the scene's light source)
  const gr = Math.min(W, H) * 0.55;
  const g = ctx.createRadialGradient(vp.x, vp.y, 0, vp.x, vp.y, gr);
  g.addColorStop(0, 'rgba(255,220,150,0.85)');
  g.addColorStop(0.45, 'rgba(226,160,90,0.30)');
  g.addColorStop(1, 'rgba(226,160,90,0)');
  ctx.fillStyle = g;
  ctx.fillRect(vp.x - gr, vp.y - gr, gr * 2, gr * 2);
  // floor wedge: lighter warm path leading to the far light
  ctx.fillStyle = '#2b1b0c';
  ctx.beginPath();
  ctx.moveTo(vp.x - W * 0.16, vp.y);
  ctx.lineTo(vp.x + W * 0.16, vp.y);
  ctx.lineTo(W * 1.05, H + 40);
  ctx.lineTo(-W * 0.05, H + 40);
  ctx.closePath(); ctx.fill();
  // path edges catch the far light
  ctx.strokeStyle = '#6b4420'; ctx.lineWidth = Math.max(2, W / 480);
  ctx.beginPath();
  ctx.moveTo(vp.x - W * 0.16, vp.y); ctx.lineTo(-W * 0.05, H + 40);
  ctx.moveTo(vp.x + W * 0.16, vp.y); ctx.lineTo(W * 1.05, H + 40);
  ctx.stroke();
  // fallen leaves on the floor
  for (const f of corridor.floorLeaves) {
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    ctx.globalAlpha = 0.5; ctx.fillStyle = f.c;
    ctx.beginPath(); ctx.ellipse(0, 0, f.s, f.s * 0.55, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // trunk bands far to near
  for (const band of corridor.bands) {
    for (const tr of band.trunks) {
      ctx.fillStyle = mix('#1d1208', '#6b5233', tr.shade);
      ctx.beginPath();
      ctx.moveTo(tr.baseX - tr.wBase / 2, H + 40);
      ctx.lineTo(tr.baseX + tr.wBase / 2, H + 40);
      ctx.lineTo(tr.topX + tr.wTop / 2, -60);
      ctx.lineTo(tr.topX - tr.wTop / 2, -60);
      ctx.closePath(); ctx.fill();
      if (band.b <= 1) {  // lit edge gives near trunks roundness
        ctx.strokeStyle = 'rgba(220,175,115,0.16)';
        ctx.lineWidth = Math.max(1, tr.wBase * 0.06);
        ctx.beginPath();
        ctx.moveTo(tr.baseX - tr.wBase / 2 + 2, H + 40);
        ctx.lineTo(tr.topX - tr.wTop / 2 + 2, -60);
        ctx.stroke();
      }
    }
  }
}

/* ---------- leaves (driver state + visual dressing) ---------- */
const PALETTE = ['#d98e2b', '#b5541f', '#c9962e', '#8f3b1d', '#e0a83c', '#a8641f'];
function dress(l) {
  if (l.vc === undefined) {
    l.vc = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    l.vj = 0.75 + Math.random() * 0.5;
  }
}

function drawLeaf(l, x, y) {
  dress(l);
  const s = (10 + 13 * (1 - l.z)) * l.vj * Math.min(1.4, Math.max(0.7, Math.min(W, H) / 700));
  // leaves near the far light catch its glow
  const dd = Math.hypot(x - W / 2, y - H * 0.30) / (0.6 * Math.min(W, H));
  const glow = Math.max(0, 1 - dd);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(l.rot);
  ctx.globalAlpha = 0.55 + 0.45 * (1 - l.z);
  ctx.fillStyle = mix(mix(l.vc, '#e8c37a', l.z * 0.35), '#ffe9b8', glow * (0.15 + 0.5 * l.z));
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.bezierCurveTo(s * 0.62, -s * 0.45, s * 0.55, s * 0.5, 0, s);
  ctx.bezierCurveTo(-s * 0.55, s * 0.5, -s * 0.62, -s * 0.45, 0, -s);
  ctx.fill();
  ctx.globalAlpha *= 0.55;
  ctx.strokeStyle = '#3a2410';
  ctx.lineWidth = Math.max(1, s * 0.08);
  ctx.beginPath(); ctx.moveTo(0, -s * 0.8); ctx.lineTo(0, s * 0.75); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, s * 0.9); ctx.lineTo(s * 0.2, s * 1.5); ctx.stroke();
  ctx.restore();
}

function drawFrame() {
  for (const tr of corridor.frame) {
    ctx.fillStyle = '#120b05';
    ctx.beginPath();
    ctx.moveTo(tr.baseX - tr.wBase / 2, H + 40);
    ctx.lineTo(tr.baseX + tr.wBase / 2, H + 40);
    ctx.lineTo(tr.topX + tr.wTop / 2, -60);
    ctx.lineTo(tr.topX - tr.wTop / 2, -60);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  driver.step(dt);
  drawCorridor();
  const order = driver.leaves.slice().sort((a, b) => b.z - a.z);
  for (const l of order) {
    const p = driver.leafPos(l);
    drawLeaf(l, p.x, p.y);
  }
  drawFrame();
  requestAnimationFrame(frame);
}

/* ---------- interaction: drag gusts, tap reseeds ---------- */
let pDown = null, pLast = null;
canvas.addEventListener('pointerdown', e => {
  pDown = { x: e.clientX, y: e.clientY, t: performance.now() };
  pLast = { x: e.clientX, y: e.clientY, t: performance.now() };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!pDown) return;
  const now = performance.now();
  const dt = Math.max(16, now - pLast.t) / 1000;
  const vx = (e.clientX - pLast.x) / dt, vy = (e.clientY - pLast.y) / dt;
  if (Math.hypot(e.clientX - pDown.x, e.clientY - pDown.y) > 8) {
    driver.applyGust(vx * 0.9, vy * 0.9, 2.2);
  }
  pLast = { x: e.clientX, y: e.clientY, t: now };
});
canvas.addEventListener('pointerup', e => {
  if (pDown) {
    const moved = Math.hypot(e.clientX - pDown.x, e.clientY - pDown.y);
    const dt = performance.now() - pDown.t;
    if (moved < 10 && dt < 350) {
      seed = (Date.now() % 2147483647) || 7;
      driver.reseed(seed);
    }
  }
  pDown = null; pLast = null;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- sizing ---------- */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildCorridor();
  driver = createDriver(W, H, seed);
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
