<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1945 Standing Next to a Guitar Amp</title>
<style>
  html, body { margin: 0; padding: 0; background: #02030a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Standing Next to a Guitar Amp, LR2 / PP1192, study #254 lucy-railton.
  // Blue Veil made watchable: one cello, one tuning, no electronics.
  // A near-black field, one blue flare blooming very slowly at center,
  // a face half-dissolved behind it. The flare is driven by a closed-form
  // just-intonation sound model: eight partials of a 55 Hz drone, each
  // with its own slow amplitude drift. The beating between partials is
  // the piece: overtones bloom, cancel, surface, linger, dissolve.
  // Watch only. Drag does nothing; the tuning does not negotiate.

  var BG = '#02030a';       // near-black field, never changes at the edges
  var FLARE_CORE = '#eaf2ff'; // soft flare white at the core
  var FLARE_BLUE = '#5f8cff'; // blue bloom
  var FLARE_DEEP = '#1c3a7a'; // deep blue halo
  var FACE = '#0d1526';      // the face, in deep shadow
  var FACE_DARK = '#01020a'; // eye hollows, darker than the field
  var PLATE = '#c8d6f2';     // title plate, soft blue white
  var HINT = '#7d90b8';      // hint, muted blue

  // Fixed-phase first frame: FIRST_T = 30 s into the drift. At t = 30
  // the fundamental is at full amplitude (1.000), the flare is at its
  // widest (radius 0.24 of S), and the face is half-dissolved behind it.
  var FIRST_T = 30;

  // Just-intonation partials of a 55 Hz drone, one cello, one tuning.
  // ratio, base amplitude, drift period in seconds, phase (seeded below).
  var PARTIALS = [
    { r: 1,    base: 1.00, period: 180 },
    { r: 9 / 8, base: 0.45, period: 97 },
    { r: 5 / 4, base: 0.62, period: 143 },
    { r: 4 / 3, base: 0.38, period: 61 },
    { r: 3 / 2, base: 0.55, period: 211 },
    { r: 5 / 3, base: 0.30, period: 83 },
    { r: 7 / 4, base: 0.22, period: 127 },
    { r: 2,    base: 0.40, period: 173 }
  ];
  // Seeded phases from the piece number, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  (function seedPhases() {
    var rng = mulberry32(1945);
    var i;
    for (i = 0; i < PARTIALS.length; i++) {
      PARTIALS[i].phase = rng() * Math.PI * 2;
    }
  })();

  // Amplitude of partial i at time t, in [0.10, 1.00] of its base.
  // Slow drift only: the fastest drift period is 61 s, about 0.016 Hz.
  function partialAmp(i, t) {
    var p = PARTIALS[i];
    return p.base * (0.55 + 0.45 * Math.sin(2 * Math.PI * t / p.period + p.phase));
  }
  // Strongest partial at t, as a fraction of the loudest base (1.00).
  function strongest(t) {
    var best = 0, bi = 0, i, a;
    for (i = 0; i < PARTIALS.length; i++) {
      a = partialAmp(i, t);
      if (a > best) { best = a; bi = i; }
    }
    return { amp: best, idx: bi };
  }
  // Beating between the fifth partial (3/2, 82.5 Hz) and its near-unison
  // twin detuned by 0.4 percent. Beat frequency 0.33 Hz, period about
  // 3.03 s. The beating is NOT smoothed: it modulates the flare core.
  function beat(t) {
    return 0.5 + 0.5 * Math.cos(2 * Math.PI * 0.33 * t + 1.7);
  }
  // Flare radius in units of S = min(W, H). Follows the strongest partial.
  function flareRadius(t, S) {
    var s = strongest(t);
    return S * (0.14 + 0.10 * s.amp);
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The face, half-dissolved in deep shadow behind the flare. Abstract
  // by construction: a faint oval, two dark eye hollows, a nose shadow,
  // a mouth line, all at very low contrast, then dissolved by seeded
  // speckles of the field color. No recognizable portrait is possible.
  function drawFace(cx, cy, S, t) {
    var fw = S * 0.40, fh = S * 0.52;
    // Faint oval of the face, slightly left of center, tilted a little.
    ctx.save();
    ctx.translate(cx - S * 0.02, cy - S * 0.01);
    ctx.rotate(-0.03);
    ctx.fillStyle = hexA(FACE, 0.72);
    ctx.beginPath(); ctx.moveTo(fw, 0); ctx.ellipse(0, 0, fw, fh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(FLARE_BLUE, 0.10);
    ctx.lineWidth = Math.max(1, S * 0.002);
    ctx.beginPath(); ctx.moveTo(fw, 0); ctx.ellipse(0, 0, fw, fh, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    // Brow shadow, a low dark band across the upper face.
    ctx.fillStyle = hexA(FACE_DARK, 0.5);
    ctx.beginPath(); ctx.moveTo(cx - fw * 0.62, cy - fh * 0.28); ctx.ellipse(cx - fw * 0.05, cy - fh * 0.26, fw * 0.62, fh * 0.10, 0, 0, Math.PI * 2); ctx.fill();
    // Eye hollows, two dark ellipses, barely legible.
    ctx.fillStyle = hexA(FACE_DARK, 0.85);
    ctx.beginPath(); ctx.moveTo(cx - fw * 0.42 + fw * 0.13, cy - fh * 0.10); ctx.ellipse(cx - fw * 0.42, cy - fh * 0.10, fw * 0.13, fh * 0.055, 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + fw * 0.30 + fw * 0.13, cy - fh * 0.10); ctx.ellipse(cx + fw * 0.30, cy - fh * 0.10, fw * 0.13, fh * 0.055, -0.08, 0, Math.PI * 2); ctx.fill();
    // Nose shadow, a soft vertical fall from between the eyes.
    var nose = ctx.createLinearGradient(cx, cy - fh * 0.08, cx, cy + fh * 0.28);
    nose.addColorStop(0, hexA(FACE_DARK, 0));
    nose.addColorStop(0.6, hexA(FACE_DARK, 0.45));
    nose.addColorStop(1, hexA(FACE_DARK, 0));
    ctx.fillStyle = nose;
    ctx.fillRect(cx - fw * 0.045, cy - fh * 0.08, fw * 0.09, fh * 0.36);
    // Mouth line, faint and level.
    ctx.strokeStyle = hexA(FACE_DARK, 0.6);
    ctx.lineWidth = Math.max(1, S * 0.003);
    ctx.beginPath();
    ctx.moveTo(cx - fw * 0.28, cy + fh * 0.52);
    ctx.quadraticCurveTo(cx, cy + fh * 0.56, cx + fw * 0.26, cy + fh * 0.50);
    ctx.stroke();
    // Dissolve: seeded speckles of field color eat the face, so the face
    // never resolves. Confined to the oval itself, fixed at load.
    var rng = mulberry32(1945 * 7 + 11);
    var i, sx, sy, sr;
    for (i = 0; i < 260; i++) {
      var ang = rng() * Math.PI * 2;
      var rad = Math.sqrt(rng());
      sx = cx - S * 0.02 + Math.cos(ang) * rad * fw * 0.95;
      sy = cy - S * 0.01 + Math.sin(ang) * rad * fh * 0.95;
      sr = 0.6 + rng() * 2.4;
      ctx.fillStyle = hexA(BG, a4(0.25 + rng() * 0.55));
      ctx.beginPath(); ctx.moveTo(sx + sr, sy); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    }
    // A slow veil drift: a few speckles fade with t, so the dissolve
    // itself breathes, almost imperceptibly.
    var rng2 = mulberry32(1945 * 13 + 5);
    for (i = 0; i < 40; i++) {
      var a2 = rng2() * Math.PI * 2, r2 = Math.sqrt(rng2());
      sx = cx + Math.cos(a2) * r2 * fw;
      sy = cy + Math.sin(a2) * r2 * fh;
      sr = 1 + rng2() * 3;
      var fade = 0.10 + 0.10 * Math.sin(2 * Math.PI * t / 173 + rng2() * 6);
      ctx.fillStyle = hexA(FLARE_BLUE, a4(clamp(fade, 0, 0.25)));
      ctx.beginPath(); ctx.moveTo(sx + sr, sy); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Overtone rings: one faint ring per partial, radius and alpha from
  // that partial's own amplitude, so overtones bloom and cancel on
  // screen exactly as they do in the sound model.
  function drawRings(cx, cy, S, t) {
    var i, a, rr, al;
    for (i = 0; i < PARTIALS.length; i++) {
      a = partialAmp(i, t);
      rr = S * (0.16 + 0.05 * PARTIALS[i].r) * (0.9 + 0.2 * a);
      al = 0.05 + 0.16 * a;
      ctx.strokeStyle = hexA(FLARE_BLUE, a4(clamp(al, 0, 0.22)));
      ctx.lineWidth = Math.max(1, S * 0.0016);
      ctx.beginPath(); ctx.moveTo(cx + rr, cy); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lastT = t;

    var S = Math.min(W, H);
    var cx = W / 2, cy = H * 0.52;
    var R = flareRadius(t, S);
    var b = beat(t);
    var s = strongest(t);

    // Field: blue to black gradient, black edges that never change.
    var field = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 0.75);
    field.addColorStop(0, '#0a1730');
    field.addColorStop(0.35, '#050b1c');
    field.addColorStop(0.7, '#02030a');
    field.addColorStop(1, '#01020a');
    ctx.fillStyle = field;
    ctx.fillRect(0, 0, W, H);

    // The face, behind the flare.
    drawFace(cx, cy, S, t);

    // Overtone rings, behind the bloom.
    drawRings(cx, cy, S, t);

    // The flare: a slow bloom whose radius follows the strongest
    // partial and whose core breathes with the beating. Three nested
    // radial gradients, deep blue to soft flare white.
    var halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 2.0);
    halo.addColorStop(0, hexA(FLARE_DEEP, a4(0.42 + 0.20 * s.amp)));
    halo.addColorStop(0.45, hexA(FLARE_DEEP, a4(0.20 + 0.12 * s.amp)));
    halo.addColorStop(1, hexA(FLARE_DEEP, 0));
    ctx.fillStyle = halo;
    ctx.fillRect(cx - R * 2.0, cy - R * 2.0, R * 4.0, R * 4.0);

    var bloom = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.15);
    bloom.addColorStop(0, hexA(FLARE_BLUE, a4(0.72 + 0.15 * b)));
    bloom.addColorStop(0.5, hexA(FLARE_BLUE, a4(0.32 + 0.15 * s.amp)));
    bloom.addColorStop(1, hexA(FLARE_BLUE, 0));
    ctx.fillStyle = bloom;
    ctx.fillRect(cx - R * 1.15, cy - R * 1.15, R * 2.3, R * 2.3);

    var coreR = R * (0.42 + 0.10 * b);
    var core = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    core.addColorStop(0, hexA(FLARE_CORE, a4(0.95)));
    core.addColorStop(0.55, hexA(FLARE_CORE, a4(0.55 + 0.25 * b)));
    core.addColorStop(1, hexA(FLARE_CORE, 0));
    ctx.fillStyle = core;
    ctx.fillRect(cx - coreR, cy - coreR, coreR * 2, coreR * 2);

    // ---- Plates: title top-left, number and date, tagline top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = PLATE;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Standing Next to a Guitar Amp', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(PLATE, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1945 · 2007 · 05 · 10', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(HINT, 0.9);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('one cello, one tuning', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom.
    ctx.fillStyle = hexA(HINT, 0.95);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fsSmall * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the flare breathe.', W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // No pointer handlers: drag does nothing by design, and no handler
  // may change the field. The piece is watch only.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock, and
  // window.__piece1945 exposes the sound model for probes.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1945 = {
      partialAmp: partialAmp,
      strongest: strongest,
      beat: beat,
      flareRadius: flareRadius,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: the drift runs on its own slow clock, all motion well
  // under the 14 Hz ceiling (fastest drift about 0.016 Hz, beating
  // 0.33 Hz). Guarded so node-canvas QA still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
