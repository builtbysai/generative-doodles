<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Like Fireflies</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0908; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var BG = "#0A0908", AMBER = "#FFB347", WHITE = "#E8E4DA", EMBER = "#E2701D";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(61074);

  // ---------------- Mural as data ----------------
  // All geometry lives in normalized coordinates (x: 0..1 of width, y: 0..1 of height).
  // Segments: {x1,y1,x2,y2,w} with w a stroke weight unit (scaled by H/800 at draw).
  var segs = [];
  var tips = [];

  function branch(x, y, ang, len, wid, depth) {
    var x2 = x + Math.cos(ang) * len;
    var y2 = y + Math.sin(ang) * len;
    segs.push({ x1: x, y1: y, x2: x2, y2: y2, w: wid });
    if (depth <= 0 || wid < 0.4) { tips.push({ x: x2, y: y2 }); return; }
    var n = 2 + (rng() < 0.2 ? 1 : 0);
    for (var i = 0; i < n; i++) {
      var spread = (i - (n - 1) / 2) * (0.3 + rng() * 0.26) + (rng() - 0.5) * 0.2;
      branch(x2, y2, ang + spread, len * (0.7 + rng() * 0.16), wid * 0.66, depth - 1);
    }
  }

  var roots = [0.13, 0.29, 0.46, 0.62, 0.79, 0.91];
  for (var r = 0; r < roots.length; r++) {
    branch(roots[r], 1.03, -Math.PI / 2 + (rng() - 0.5) * 0.22, 0.125 + rng() * 0.03, 7.5, 6);
  }

  // House beams framing the edges.
  function beam(x1, y1, x2, y2, w) { segs.push({ x1: x1, y1: y1, x2: x2, y2: y2, w: w }); }
  beam(0.035, -0.01, 0.035, 1.01, 6.5);   // left post
  beam(0.965, -0.01, 0.965, 1.01, 6.5);   // right post
  beam(-0.01, 0.045, 1.01, 0.045, 6.0);   // top lintel
  beam(-0.01, 0.985, 1.01, 0.985, 5.0);   // ground sill
  beam(0.035, 0.30, 0.21, 0.045, 4.2);    // braces
  beam(0.965, 0.30, 0.79, 0.045, 4.2);
  beam(0.035, 0.70, 0.19, 0.985, 4.2);
  beam(0.965, 0.70, 0.81, 0.985, 4.2);
  beam(0.035, 0.52, 0.13, 0.52, 3.4);     // short cross pegs
  beam(0.87, 0.52, 0.965, 0.52, 3.4);

  // Exactly two ember tips, chosen deterministically from the branch tips.
  var embers = [];
  if (tips.length > 8) {
    embers.push(tips[Math.floor(tips.length * 0.37)]);
    embers.push(tips[Math.floor(tips.length * 0.71)]);
  }

  // ---------------- Fireflies ----------------
  var FLIES = 24;
  var flies = [];
  var firstGlowU = [0.08, 0.18, 0.27, 0.35, 0.43, 0.51, 0.60];
  for (var i = 0; i < FLIES; i++) {
    var bx = 0.06 + rng() * 0.88;
    var by = 0.08 + rng() * 0.84;
    // Keep them scattered: push out of the central ellipse.
    var ex = (bx - 0.5) / 0.21, ey = (by - 0.52) / 0.22;
    var e = ex * ex + ey * ey;
    if (e < 1 && e > 0.0001) {
      var s = 1 / Math.sqrt(e);
      bx = 0.5 + ex * 0.21 * s * 1.05;
      by = 0.52 + ey * 0.22 * s * 1.05;
    }
    var T = 6 + rng() * 8;
    var u0 = i < firstGlowU.length ? firstGlowU[i] : 0.72 + rng() * 0.26;
    flies.push({
      bx: bx, by: by,
      ax: 0.018 + rng() * 0.034, ay: 0.014 + rng() * 0.028,
      fx: 0.05 + rng() * 0.09, fy: 0.04 + rng() * 0.08,
      px: rng() * Math.PI * 2, py: rng() * Math.PI * 2,
      T: T, u0: u0,
      rs: 0.8 + rng() * 0.5,
      ox: 0, oy: 0, vx: 0, vy: 0, boost: 0
    });
  }

  function smooth(t) { return t * t * (3 - 2 * t); }
  function glowOf(u) {
    if (u < 0.15) return smooth(u / 0.15);
    if (u < 0.45) return 0.93 + 0.07 * Math.sin(u * 46.0);
    if (u < 0.70) return 1 - smooth((u - 0.45) / 0.25);
    return 0;
  }
  function flyPos(f, t, W, H) {
    var nx = f.bx + f.ax * Math.sin(t * f.fx * Math.PI * 2 + f.px) + 0.012 * Math.sin(t * 0.11 + f.py);
    var ny = f.by + f.ay * Math.sin(t * f.fy * Math.PI * 2 + f.py) + 0.010 * Math.cos(t * 0.09 + f.px);
    return { x: nx * W + f.ox, y: ny * H + f.oy };
  }

  // ---------------- Sizing ----------------
  var W = 720, H = 720, isPhone = false;
  function viewportSize() {
    var w = 0, h = 0;
    if (typeof window !== "undefined") {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    }
    if (!w && typeof document !== "undefined" && document.documentElement) {
      w = document.documentElement.clientWidth; h = document.documentElement.clientHeight;
    }
    if (!w) { w = 720; h = 720; }
    return { w: w, h: h };
  }
  function resize() {
    var s = viewportSize();
    W = Math.max(50, Math.round(s.w));
    H = Math.max(50, Math.round(s.h));
    canvas.width = W;
    canvas.height = H;
    var sw = 0, sh = 0;
    if (typeof window !== "undefined" && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    isPhone = (sw && sh) ? (Math.min(sw, sh) < 700) : (H > W * 1.15);
  }

  // ---------------- Drawing ----------------
  function strokeSegs(alpha, cx, cy, R) {
    // Bucket segments by stroke weight so each bucket is one batched path.
    var buckets = {};
    var wScale = H / 800;
    for (var i = 0; i < segs.length; i++) {
      var sg = segs[i];
      var x1 = sg.x1 * W, y1 = sg.y1 * H, x2 = sg.x2 * W, y2 = sg.y2 * H;
      if (cx !== null) {
        // distance from (cx,cy) to segment must be within R
        var dx = x2 - x1, dy = y2 - y1;
        var L2 = dx * dx + dy * dy;
        var tt = L2 > 0 ? ((cx - x1) * dx + (cy - y1) * dy) / L2 : 0;
        tt = tt < 0 ? 0 : (tt > 1 ? 1 : tt);
        var qx = x1 + tt * dx - cx, qy = y1 + tt * dy - cy;
        if (qx * qx + qy * qy > R * R) continue;
      }
      var key = Math.round(sg.w * 2);
      if (!buckets[key]) buckets[key] = { w: sg.w * wScale, pts: [] };
      buckets[key].pts.push(x1, y1, x2, y2);
    }
    ctx.strokeStyle = WHITE;
    ctx.globalAlpha = alpha;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (var k in buckets) {
      var b = buckets[k];
      ctx.lineWidth = Math.max(0.5, b.w);
      ctx.beginPath();
      for (var j = 0; j < b.pts.length; j += 4) {
        ctx.moveTo(b.pts[j], b.pts[j + 1]);
        ctx.lineTo(b.pts[j + 2], b.pts[j + 3]);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawEmbers(alpha, cx, cy, R) {
    ctx.fillStyle = EMBER;
    for (var i = 0; i < embers.length; i++) {
      var ex = embers[i].x * W, ey = embers[i].y * H;
      if (cx !== null) {
        var dx = ex - cx, dy = ey - cy;
        if (dx * dx + dy * dy > R * R) continue;
      }
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(ex, ey, Math.max(1.4, H / 320), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  var QUANT = 0.25; // time grid: repeated early draws land on the identical frame
  function draw(tSec) {
    var t = Math.floor(tSec / QUANT) * QUANT;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var minDim = Math.min(W, H);

    // Base mural: barely visible.
    strokeSegs(0.045, null, 0, 0);
    drawEmbers(0.05, null, 0, 0);

    var i, f, p, g, R;
    // Amber halos (few radial gradients, glowing flies only).
    for (i = 0; i < flies.length; i++) {
      f = flies[i];
      var u = (t / f.T + f.u0) % 1;
      g = glowOf(u) + f.boost; if (g > 1) g = 1;
      if (g <= 0.03) continue;
      p = flyPos(f, t, W, H);
      R = (0.085 + 0.045 * (f.rs - 0.8)) * minDim * (0.55 + 0.45 * g) * (isPhone ? 1.12 : 1);
      var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R * 1.2);
      grad.addColorStop(0, "rgba(255,179,71," + (0.16 * g).toFixed(3) + ")");
      grad.addColorStop(1, "rgba(255,179,71,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, R * 1.2, 0, Math.PI * 2);
      ctx.fill();
      f._p = p; f._g = g; f._R = R;
    }
    // Reveal passes: mural redrawn inside each glow disc, brighter at the core.
    for (i = 0; i < flies.length; i++) {
      f = flies[i];
      if (!f._p || f._g <= 0.03) continue;
      p = f._p; g = f._g; R = f._R;
      ctx.save();
      ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.clip();
      strokeSegs(0.5 * g, p.x, p.y, R);
      drawEmbers(0.55 * g, p.x, p.y, R);
      ctx.restore();
      ctx.save();
      ctx.beginPath(); ctx.arc(p.x, p.y, R * 0.55, 0, Math.PI * 2); ctx.clip();
      strokeSegs(0.5 * g, p.x, p.y, R * 0.55);
      drawEmbers(0.45 * g, p.x, p.y, R * 0.55);
      ctx.restore();
      f._p = null;
    }
    // Firefly bodies.
    for (i = 0; i < flies.length; i++) {
      f = flies[i];
      var u2 = (t / f.T + f.u0) % 1;
      var g2 = glowOf(u2) + f.boost; if (g2 > 1) g2 = 1;
      var pp = flyPos(f, t, W, H);
      ctx.fillStyle = AMBER;
      ctx.globalAlpha = 0.22 + 0.78 * g2;
      ctx.beginPath();
      ctx.arc(pp.x, pp.y, Math.max(1.2, minDim / 340) * (0.8 + 0.5 * g2), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------------- Gust (drag) ----------------
  var dragging = false;
  function gust(cx, cy, strong) {
    var minDim = Math.min(W, H);
    var Rg = 0.42 * minDim;
    for (var i = 0; i < flies.length; i++) {
      var f = flies[i];
      var p = flyPos(f, lastT, W, H);
      var dx = p.x - cx, dy = p.y - cy;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < Rg) {
        var k = 1 - d / Rg;
        var inv = d > 1 ? 1 / d : 0;
        f.vx += dx * inv * k * (strong ? 300 : 140);
        f.vy += dy * inv * k * (strong ? 300 : 140);
        f.boost = Math.min(1, f.boost + k * 0.75);
      }
    }
  }
  function pointerPos(ev) {
    var x = (ev.clientX != null ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0));
    var y = (ev.clientY != null ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0));
    return { x: x, y: y };
  }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("pointerdown", function (ev) { dragging = true; var p = pointerPos(ev); gust(p.x, p.y, true); });
    window.addEventListener("pointermove", function (ev) { if (dragging) { var p = pointerPos(ev); gust(p.x, p.y, false); } });
    window.addEventListener("pointerup", function () { dragging = false; });
    window.addEventListener("pointercancel", function () { dragging = false; });
  }

  // ---------------- Loop ----------------
  var lastT = 0;
  var startMs = null;
  var prevMs = null;
  function nowMs() {
    if (typeof performance !== "undefined" && performance.now) return performance.now();
    return 0;
  }
  function frame() {
    var ms = nowMs();
    if (startMs === null) { startMs = ms; prevMs = ms; }
    var dt = Math.min(0.05, Math.max(0, (ms - prevMs) / 1000));
    prevMs = ms;
    lastT = (ms - startMs) / 1000;
    // Gust physics: offsets spring back to the wander path, boosts decay.
    for (var i = 0; i < flies.length; i++) {
      var f = flies[i];
      f.vx += -2.4 * f.ox * dt;
      f.vy += -2.4 * f.oy * dt;
      var damp = Math.exp(-2.6 * dt);
      f.vx *= damp; f.vy *= damp;
      f.ox += f.vx * dt; f.oy += f.vy * dt;
      f.boost *= Math.exp(-0.9 * dt);
    }
    draw(lastT);
    window.requestAnimationFrame(frame);
  }

  resize();
  draw(0); // synchronous first frame: fixed seeded phases, six to eight flies mid-glow
  if (typeof window !== "undefined") {
    if (window.addEventListener) {
      window.addEventListener("resize", function () { resize(); draw(lastT); });
      if (window.visualViewport && window.visualViewport.addEventListener) {
        window.visualViewport.addEventListener("resize", function () { resize(); draw(lastT); });
      }
    }
    if (typeof window.requestAnimationFrame === "function") {
      window.requestAnimationFrame(frame);
    }
  }
})();
</script>
</body>
</html>
