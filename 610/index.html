<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№610 Saoirse</title>
<style>
  html, body { margin: 0; padding: 0; background: #0c1f16; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/lauren-kinsella.md does not exist in the repo, so these
  // hex values are chosen from the prompt's named colors directly.
  var BG = '#0c1f16';        // dark theatre green ground, page ground too
  var DEEP = '#06120c';      // near-black green, the depths of the house
  var CURTAIN = '#123324';   // curtain fold, a shade lighter than the ground
  var GOLD = '#d9b96a';      // the thread, linen gold
  var GOLD_LT = '#eed28f';   // bright core of the thread
  var BLUE = '#6fa8c9';      // the sax, breath blue
  var AMBER = '#c08a3e';     // the viola, dried-grass amber
  var ORANGE = '#c96a2e';    // the piano and harmonium, low candle orange
  var INK = '#e8e0c8';       // title, linen white
  var INK_SOFT = '#9a937a';  // date line and hint, muted linen

  // Fixed-phase first frame: t = 24 s. The viola is mid-turn, stretching
  // the thread wide with loose loops hanging off the line in amber, and
  // the sax's blue echo has just faded. Frame one is byte-reproducible:
  // every thread point, loop, arc and speck is a pure function of t.
  var FIRST_T = 24;

  // The borrowing protocol runs on a 48 s cycle. The thread is never cut,
  // only borrowed: singer, sax, viola, piano, all four together as a
  // reel, then the return to the singer.
  var CYCLE = 48;
  var SEGMENTS = [
    { from: 0,  to: 8,  name: 'singer', color: GOLD,   label: 'the thread is with the singer' },
    { from: 8,  to: 18, name: 'sax',    color: BLUE,   label: 'the thread is with the sax' },
    { from: 18, to: 30, name: 'viola',  color: AMBER,  label: 'the thread is with the viola' },
    { from: 30, to: 40, name: 'piano',  color: ORANGE, label: 'the thread is with the piano' },
    { from: 40, to: 44, name: 'reel',   color: GOLD,   label: 'all four sound the thread together' },
    { from: 44, to: 48, name: 'return', color: GOLD,   label: 'the thread returns to the singer' }
  ];

  // Borrow amount B: how far the thread is pulled from its rest line.
  // It rises through the sax and viola turns, peaks in the piano's
  // release, and decays back to rest in the return. Keyframed so the
  // stray distance decays by rule, never by script.
  var B_KEYS = [
    [0, 0.15], [8, 0.15], [10, 0.45], [18, 0.45], [20, 1.00],
    [30, 1.00], [32, 1.25], [40, 1.25], [42, 0.70], [44, 0.70],
    [46, 0.15], [48, 0.15]
  ];
  // Reel amount R: the brief moment all four sound the thread together.
  var R_KEYS = [
    [0, 0], [40, 0], [41, 1], [43, 1], [44, 0], [48, 0]
  ];
  // Mirror amount M: the sax mirrors the thread in breath blue.
  var M_KEYS = [
    [0, 0], [8, 0], [10, 1], [16, 1], [18, 0], [48, 0]
  ];

  // Loose loops hang off the line at fixed positions, like embroidery.
  // Their radius follows B, so they swell as the thread is borrowed and
  // shrink as it comes home.
  var LOOPS = [
    { u: 0.14, base: 0.030, above: false },
    { u: 0.30, base: 0.042, above: true },
    { u: 0.47, base: 0.026, above: false },
    { u: 0.63, base: 0.038, above: true },
    { u: 0.80, base: 0.030, above: false },
    { u: 0.93, base: 0.022, above: true }
  ];
  // Sean-nos turns: tight ornamental curls fixed on the thread.
  var CURLS = [0.10, 0.24, 0.40, 0.56, 0.72, 0.86];
  // Each agent's gesture arc: where it reaches from the line, and
  // whether it arcs above or below it.
  var ARCS = [
    { name: 'singer', color: GOLD,   u1: 0.06, u2: 0.26, h: 0.055, above: false },
    { name: 'sax',    color: BLUE,   u1: 0.12, u2: 0.44, h: 0.150, above: true },
    { name: 'viola',  color: AMBER,  u1: 0.55, u2: 0.86, h: 0.165, above: false },
    { name: 'piano',  color: ORANGE, u1: 0.30, u2: 0.76, h: 0.105, above: true }
  ];

  // Seeded PRNG, mulberry32, for the dust in the theatre air. Fixed
  // positions, so frame one is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1923);
  var DUST = [];
  for (var d = 0; d < 46; d++) {
    DUST.push({ u: rng(), v: rng(), r: 0.6 + rng() * 1.6, a: 0.04 + rng() * 0.09, drift: 2 + rng() * 5 });
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // Keyframed value at cycle phase ph, smoothstepped between keys.
  function keyAt(keys, ph) {
    var n = keys.length;
    if (ph <= keys[0][0]) { return keys[0][1]; }
    if (ph >= keys[n - 1][0]) { return keys[n - 1][1]; }
    for (var i = 0; i < n - 1; i++) {
      if (ph >= keys[i][0] && ph <= keys[i + 1][0]) {
        var f = smooth((ph - keys[i][0]) / (keys[i + 1][0] - keys[i][0]));
        return keys[i][1] + (keys[i + 1][1] - keys[i][1]) * f;
      }
    }
    return keys[n - 1][1];
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function phase(t) { return t - Math.floor(t / CYCLE) * CYCLE; }
  function segment(ph) {
    for (var i = 0; i < SEGMENTS.length; i++) {
      if (ph >= SEGMENTS[i].from && ph < SEGMENTS[i].to) { return SEGMENTS[i]; }
    }
    return SEGMENTS[0];
  }

  // Height of the thread at horizontal position u (0..1), time t.
  // A slow melody line, stretched wider as the thread is borrowed,
  // with a quicker figure riding it when the reel sounds.
  function threadY(u, t, B, R) {
    var mid = H * 0.5;
    var amp = H * (0.018 + 0.050 * B);
    var y = mid
      + Math.sin(u * Math.PI * 3.0 - t * 0.12) * amp
      + Math.sin(u * Math.PI * 6.0 + t * 0.07) * amp * 0.4
      + Math.sin(u * Math.PI * 2.0 - t * 0.05) * H * 0.015 * B;
    if (R > 0.01) {
      y += Math.sin(u * Math.PI * 12.0 - t * 0.9) * H * 0.008 * R;
    }
    return y;
  }

  // The thread itself: a soft glow under a bright linen-gold core.
  function drawThread(t, B, R) {
    var step = Math.max(2, W / 320);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var widths = [Math.max(5, H * 0.008), Math.max(2, H * 0.0035)];
    var cols = [hexA(GOLD, 0.28), GOLD_LT];
    for (var p = 0; p < 2; p++) {
      ctx.strokeStyle = cols[p];
      ctx.lineWidth = widths[p];
      ctx.beginPath();
      var first = true;
      for (var x = 0; x <= W; x += step) {
        var y = threadY(x / W, t, B, R);
        if (first) { ctx.moveTo(x, y); first = false; }
        else { ctx.lineTo(x, y); }
      }
      ctx.stroke();
    }

    // Sean-nos turns: tight curls fixed on the line, brighter in a reel.
    var cr = Math.max(3, H * 0.008) * (1 + 0.35 * B + 0.45 * R);
    ctx.strokeStyle = hexA(GOLD_LT, a4(0.55 + 0.35 * R));
    ctx.lineWidth = Math.max(1.2, H * 0.002);
    for (var i = 0; i < CURLS.length; i++) {
      var cx = CURLS[i] * W;
      var cy = threadY(CURLS[i], t, B, R);
      ctx.beginPath(); ctx.moveTo(cx + cr, cy); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = hexA(GOLD_LT, a4(0.7));
      ctx.beginPath(); ctx.moveTo(cx + 1.2, cy); ctx.arc(cx, cy, 1.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  // The sax mirrors the thread: a second line in breath blue, offset
  // below the gold one, fading in and out with the sax's turn.
  function drawMirror(t, B, R, M) {
    if (M <= 0.02) { return; }
    var step = Math.max(2, W / 320);
    var off = H * 0.022;
    ctx.strokeStyle = hexA(BLUE, a4(0.5 * M));
    ctx.lineWidth = Math.max(1.4, H * 0.0022);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    var first = true;
    for (var x = 0; x <= W; x += step) {
      var y = threadY(x / W, t + 1.6, B, R) + off;
      if (first) { ctx.moveTo(x, y); first = false; }
      else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
  }

  // Loose loops pulled off the line: the borrowed passages, hanging
  // like embroidery. Their radius follows B, so they swell while the
  // thread is borrowed and shrink as it comes home.
  function drawLoops(t, B, R, holderColor) {
    for (var i = 0; i < LOOPS.length; i++) {
      var L = LOOPS[i];
      var x = L.u * W;
      var y = threadY(L.u, t, B, R);
      var r = L.base * H * (0.35 + 0.95 * B) * (1 + 0.25 * R);
      if (r < 1.5) { continue; }
      var dir = L.above ? -1 : 1;
      var cy = y + dir * r * 0.95;
      ctx.strokeStyle = hexA(holderColor, a4(0.55 + 0.25 * B));
      ctx.lineWidth = Math.max(1.2, H * 0.002);
      ctx.beginPath(); ctx.moveTo(x + r, cy); ctx.arc(x, cy, r, 0, Math.PI * 2); ctx.stroke();
      // The knot where the loop leaves the line.
      ctx.fillStyle = hexA(holderColor, a4(0.85));
      ctx.beginPath(); ctx.moveTo(x + 2, y); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Each agent's gesture arc, reaching from the line and back. The
  // agent holding the thread draws bright; the others stay faint.
  // In the reel all four arcs sound together.
  function drawArcs(t, B, R, seg) {
    for (var i = 0; i < ARCS.length; i++) {
      var A = ARCS[i];
      var active = (seg.name === A.name) ? 1 : 0;
      var a = 0.10 + 0.5 * active + 0.4 * R;
      var dir = A.above ? -1 : 1;
      var x1 = A.u1 * W, x2 = A.u2 * W;
      var y1 = threadY(A.u1, t, B, R), y2 = threadY(A.u2, t, B, R);
      var cx = (x1 + x2) / 2;
      var cy = Math.min(y1, y2) + dir * A.h * H * (0.7 + 0.3 * B);
      ctx.strokeStyle = hexA(A.color, a4(a));
      ctx.lineWidth = Math.max(1.2, H * 0.002);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cx, cy, x2, y2);
      ctx.stroke();
      // The hand at the arc's far point.
      var hx = cx, hy = (y1 + y2) / 2 * 0.5 + cy * 0.5;
      ctx.fillStyle = hexA(A.color, a4(a));
      ctx.beginPath(); ctx.moveTo(hx + 2.5, hy); ctx.arc(hx, hy, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Dust in the theatre air, drifting slowly, never flashing.
  function drawDust(t) {
    for (var i = 0; i < DUST.length; i++) {
      var s = DUST[i];
      var x = ((s.u + s.drift * t / 3600) % 1) * W;
      var y = s.v * H + Math.sin(t * 0.1 + i * 1.7) * H * 0.004;
      ctx.fillStyle = hexA(GOLD_LT, a4(s.a));
      ctx.beginPath(); ctx.moveTo(x + s.r, y); ctx.arc(x, y, s.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var ph = phase(t);
    var B = keyAt(B_KEYS, ph);
    var R = keyAt(R_KEYS, ph);
    var M = keyAt(M_KEYS, ph);
    var seg = segment(ph);

    // Dark theatre green ground, deepening toward the floor.
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, BG);
    grad.addColorStop(0.62, BG);
    grad.addColorStop(1, DEEP);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Curtain folds at the edges of the house, faint and still.
    ctx.fillStyle = hexA(CURTAIN, 0.35);
    var foldW = W * 0.045;
    for (var f = 0; f < 3; f++) {
      var fx = f * foldW * 0.9;
      ctx.beginPath();
      ctx.moveTo(fx, 0);
      ctx.lineTo(fx + foldW, 0);
      ctx.lineTo(fx + foldW * 0.7, H);
      ctx.lineTo(fx + foldW * 0.2, H);
      ctx.closePath();
      ctx.fill();
      var rx = W - fx - foldW;
      ctx.beginPath();
      ctx.moveTo(rx, 0);
      ctx.lineTo(rx + foldW, 0);
      ctx.lineTo(rx + foldW * 0.8, H);
      ctx.lineTo(rx + foldW * 0.3, H);
      ctx.closePath();
      ctx.fill();
    }

    drawDust(t);
    drawArcs(t, B, R, seg);
    drawMirror(t, B, R, M);
    drawLoops(t, B, R, seg.color);
    drawThread(t, B, R);

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Saoirse', 18, 34);
    ctx.fillStyle = INK_SOFT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№610 · 2003 · 09 · 13', 18, 34 + fs2 + 8);

    // Who holds the thread now, bottom-left in the holder's color.
    ctx.fillStyle = hexA(seg.color, 0.9);
    ctx.font = 'italic ' + Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(seg.label, 18, H - 44);

    // Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK_SOFT, 0.9);
    ctx.textAlign = 'center';
    var hint = 'Watch the thread change hands.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(hint, W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs under 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
