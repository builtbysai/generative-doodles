<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Piropo del Siglo XXI</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #8A8A8A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (strict, nothing else). Flat fills only, no gradients.
  var ORANGE = '#E07B2E';   // monkeys
  var FACE_A = '#6A6A6A';   // left monkey's face; also the jungle tone
  var FACE_B = '#F2E4C8';   // right monkey's face
  var HATCH  = '#8A8A8A';   // jungle ground / page ground
  var INK    = '#1A1A1A';   // branch, outlines, lettering
  var WHITE  = '#FFFFFF';   // speech bubble
  var TAN    = '#EAC97E';   // caption banner

  var PHASE0 = 1.6;         // constant first-frame phase: compliment 1, mid-breath
  var SWAP = 8;             // seconds per compliment

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---- the compliment bank: fixed order, deadpan, backhanded ----
  var LINES = [
    'Pues yo creo que estás super bien de la cabeza…',
    'qué guapo estás hoy… para lo que hay',
    'Tienes una cara muy… fácil de recordar.',
    'Sin ti esto sería insoportable. Contigo, solo es pesado.',
    'Me encanta tu camisa. Se nota que no te importa nada.'
  ];
  var BANNER = 'EL PIROPO DEL S. XXI';

  // ---- precomputed jungle: hatch field + leaf silhouettes (seeded, drawn directly) ----
  var rng = mulberry32(556021);
  var hatch = [];
  for (var i = 0; i < 1500; i++) {
    hatch.push({
      x: rng() * 1080, y: rng() * 1080,
      len: 13 + rng() * 15,
      ang: -0.62 + (rng() - 0.5) * 0.35
    });
  }
  var leaves = [];
  for (var j = 0; j < 30; j++) {
    leaves.push({
      x: 30 + rng() * 1020, y: 330 + rng() * 620,
      s: 34 + rng() * 66,
      rot: (rng() - 0.5) * 2.4,
      ph: rng() * Math.PI * 2
    });
  }
  // keep leaves off the monkeys' faces: nudge any leaf that lands on a head
  var HEADS = [{ x: 392, y: 452 }, { x: 688, y: 452 }];
  for (var k = 0; k < leaves.length; k++) {
    for (var h = 0; h < HEADS.length; h++) {
      var dx = leaves[k].x - HEADS[h].x, dy = leaves[k].y - HEADS[h].y;
      if (dx * dx + dy * dy < 150 * 150) { leaves[k].y += 210; if (leaves[k].y > 950) leaves[k].y -= 420; }
    }
  }

  // ---- helpers ----
  function rect(x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
  function circ(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  function ell(x, y, rx, ry, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
  function poly(pts, fill) {
    ctx.fillStyle = fill; ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath(); ctx.fill();
  }

  function drawLeaf(lf, sway) {
    ctx.save();
    ctx.translate(lf.x, lf.y);
    ctx.rotate(lf.rot + sway * 0.06);
    var s = lf.s;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.quadraticCurveTo(s * 0.62, -s * 0.3, 0, s);
    ctx.quadraticCurveTo(-s * 0.62, -s * 0.3, 0, -s);
    ctx.fillStyle = FACE_A; ctx.fill();
    ctx.strokeStyle = HATCH; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -s * 0.8); ctx.lineTo(0, s * 0.8); ctx.stroke();
    ctx.restore();
  }

  // ---- hand lettering: per-character jitter, seeded per text so each
  //      compliment is lettered fresh when it swaps in, then stays put ----
  function handLine(text, cx, cy, size, color, seedKey, spacing) {
    ctx.font = '700 ' + size + 'px "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive, sans-serif';
    var widths = [], total = 0, i, w;
    for (i = 0; i < text.length; i++) { w = ctx.measureText(text[i]).width + (spacing || 0); widths.push(w); total += w; }
    var jr = mulberry32(seedKey);
    var x = cx - total / 2;
    ctx.fillStyle = color;
    ctx.textBaseline = 'middle';
    for (i = 0; i < text.length; i++) {
      ctx.save();
      ctx.translate(x + widths[i] / 2, cy + (jr() - 0.5) * size * 0.09);
      ctx.rotate((jr() - 0.5) * 0.07);
      ctx.textAlign = 'center';
      ctx.fillText(text[i], 0, 0);
      ctx.restore();
      x += widths[i];
    }
  }

  function wrapText(text, size, maxW) {
    ctx.font = '700 ' + size + 'px "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive, sans-serif';
    var words = text.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ---- the wobbly speech bubble (fixed shape; only its text changes) ----
  var bubblePts = (function () {
    var jr = mulberry32(556099), pts = [];
    var x0 = 84, y0 = 58, x1 = 996, y1 = 292, n = 26, i, t, x, y;
    for (i = 0; i < n; i++) {           // top edge, left to right
      t = i / n; x = x0 + (x1 - x0) * t; y = y0 + (jr() - 0.5) * 7; pts.push(x, y);
    }
    for (i = 0; i < n; i++) {           // right edge
      t = i / n; x = x1 + (jr() - 0.5) * 7; y = y0 + (y1 - y0) * t; pts.push(x, y);
    }
    for (i = n; i > 0; i--) {           // bottom edge, right to left
      t = i / n; x = x0 + (x1 - x0) * t; y = y1 + (jr() - 0.5) * 7; pts.push(x, y);
    }
    for (i = n; i > 0; i--) {           // left edge
      t = i / n; x = x0 + (jr() - 0.5) * 7; y = y0 + (y1 - y0) * t; pts.push(x, y);
    }
    return pts;
  })();

  function drawBubble(idx) {
    poly([452, 288, 402, 372, 388, 282], WHITE);            // tail, down to the grey-faced monkey
    ctx.beginPath();
    ctx.moveTo(bubblePts[0], bubblePts[1]);
    for (var i = 2; i < bubblePts.length; i += 2) ctx.lineTo(bubblePts[i], bubblePts[i + 1]);
    ctx.closePath();
    ctx.fillStyle = WHITE; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath();                                        // tail outline, open at the bubble
    ctx.moveTo(452, 284); ctx.lineTo(402, 372); ctx.lineTo(390, 286);
    ctx.stroke();
    var size = 56;
    var lines = wrapText(LINES[idx], size, 800);
    while (lines.length > 3 && size > 40) { size -= 4; lines = wrapText(LINES[idx], size, 800); }
    var lh = size * 1.28, y = 175 - (lines.length - 1) * lh / 2;
    for (var li = 0; li < lines.length; li++) {
      handLine(lines[li], 540, y + li * lh, size, INK, 556200 + idx * 977 + li * 131, 0);
    }
  }

  // ---- one monkey: seated, flat orange, deadpan. bob is a 2-frame step ----
  function drawMonkey(cx, face, bob) {
    ctx.save();
    ctx.translate(cx, bob);
    ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
    // tail, curling out behind
    ctx.strokeStyle = ORANGE; ctx.lineWidth = 17; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-88, 268); ctx.quadraticCurveTo(-176, 250, -158, 168); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    // body
    ell(0, 190, 104, 118, ORANGE);
    ctx.beginPath(); ctx.ellipse(0, 190, 104, 118, 0, 0, Math.PI * 2); ctx.stroke();
    // arms resting down to the branch
    ctx.strokeStyle = ORANGE; ctx.lineWidth = 34;
    ctx.beginPath(); ctx.moveTo(-84, 128); ctx.quadraticCurveTo(-118, 220, -98, 300); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(84, 128); ctx.quadraticCurveTo(118, 220, 98, 300); ctx.stroke();
    circ(-98, 306, 19, ORANGE);
    circ(98, 306, 19, ORANGE);
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    // feet on the branch
    ell(-56, 330, 34, 15, ORANGE); ctx.beginPath(); ctx.ellipse(-56, 330, 34, 15, 0, 0, Math.PI * 2); ctx.stroke();
    ell(56, 330, 34, 15, ORANGE); ctx.beginPath(); ctx.ellipse(56, 330, 34, 15, 0, 0, Math.PI * 2); ctx.stroke();
    // ears
    circ(-80, -8, 27, ORANGE); ctx.beginPath(); ctx.arc(-80, -8, 27, 0, Math.PI * 2); ctx.stroke();
    circ(80, -8, 27, ORANGE); ctx.beginPath(); ctx.arc(80, -8, 27, 0, Math.PI * 2); ctx.stroke();
    circ(-80, -8, 13, face);
    circ(80, -8, 13, face);
    // head
    circ(0, 0, 84, ORANGE); ctx.beginPath(); ctx.arc(0, 0, 84, 0, Math.PI * 2); ctx.stroke();
    // face patch
    ell(0, 10, 58, 52, face); ctx.beginPath(); ctx.ellipse(0, 10, 58, 52, 0, 0, Math.PI * 2); ctx.stroke();
    // deadpan: dot eyes under straight lids, one flat mouth line. Never a smile.
    circ(-24, 2, 5.5, INK);
    circ(24, 2, 5.5, INK);
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-38, -12); ctx.lineTo(-10, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, -12); ctx.lineTo(38, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-17, 34); ctx.lineTo(17, 34); ctx.stroke();
    ctx.restore();
  }

  // ================= FRAME =================

  var viewW = 0, viewH = 0, dpr = 1;
  var isPhone = false;

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewW = w; viewH = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    var sw = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height) : 0;
    isPhone = sw ? (sw < 700) : (h > w * 1.15);
  }

  function drawFrame(t) {
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rect(0, 0, viewW, viewH, HATCH);
    var s = Math.min(viewW, viewH) / 1080;
    var ox = (viewW - 1080 * s) / 2, oy = (viewH - 1080 * s) / 2;
    ctx.save();
    ctx.translate(ox, oy); ctx.scale(s, s);

    ctx.strokeStyle = FACE_A; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < hatch.length; i++) {
      var p = hatch[i];
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(p.ang) * p.len, p.y + Math.sin(p.ang) * p.len);
    }
    ctx.stroke();
    var sway = Math.sin(t * 0.9);
    for (var j = 0; j < leaves.length; j++) drawLeaf(leaves[j], sway);

    ctx.strokeStyle = INK; ctx.lineCap = 'round';
    ctx.lineWidth = 36;
    ctx.beginPath(); ctx.moveTo(96, 806); ctx.quadraticCurveTo(540, 828, 984, 800); ctx.stroke();
    ctx.lineWidth = 16;
    ctx.beginPath(); ctx.moveTo(872, 806); ctx.quadraticCurveTo(916, 772, 946, 762); ctx.stroke();

    var bobA = (Math.floor(t * 1.4) % 2) * 3;
    var bobB = (Math.floor(t * 1.4 + 1) % 2) * 3;
    ctx.save(); ctx.translate(0, 452); drawMonkey(392, FACE_A, bobA); ctx.restore();
    ctx.save(); ctx.translate(0, 452); drawMonkey(688, FACE_B, bobB); ctx.restore();

    // caption banner along the bottom
    rect(0, 972, 1080, 108, TAN);
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, 972); ctx.lineTo(1080, 972); ctx.stroke();
    handLine(BANNER, 540, 1028, 52, INK, 556777, 6);

    // the compliment of the moment, on top of everything
    var idx = Math.floor(t / SWAP) % LINES.length;
    drawBubble(idx);

    ctx.restore();
  }

  // ================= RUN =================

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); drawFrame(PHASE0); });
  }
  window.addEventListener('resize', function () { resize(); drawFrame(PHASE0); });

  resize();
  drawFrame(PHASE0);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts - PHASE0 * 1000;   // continue from the first frame's phase
      drawFrame((ts - t0) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
