<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost in the Net</title>
<style>
html, body { margin: 0; padding: 0; background: #2A1538; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#5B4A7A';
var PLUM = '#2A1538';
var PLUM_DARK = '#1E0E28';
var LAVENDER = '#D9C8F0';
var LAVENDER_DIM = '#B8A9D9';
var MAUVE = '#A97FA8';
var VIOLET = '#6E5A9E';
var VOID = '#17101F';
var GLOW = '#E9B6FF';
var GLOW_CORE = '#F6E3FF';
var KEEP_PURPLE = '#C77DFF';
/* The stream is infinite, the kept set of three is a portrait of the
   chooser. Frame one is at t = 18 s: three candidates already glow in
   the cloud, the gallery strip is present with three empty slots. */
var PHASE = 18;
var EMIT_EVERY = 6, LIFE = 26, FADE_IN = 1.5, FADE_OUT = 4;
var MAX_KEEPS = 3, SETTLE = 1.4, RELEASE_T = 1.5, REFUSE_T = 0.7;
var N_CLOUDS = 14, N_VOIDS = 9;
var STORE_KEY = 'gd-1644-keeps-v1';
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function lerp(a, b, f) { return a + (b - a) * f; }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var GROUND_RGB = hexRgb(GROUND);
var LAV_RGB = hexRgb(LAVENDER);
var LAV_DIM_RGB = hexRgb(LAVENDER_DIM);
var MAUVE_RGB = hexRgb(MAUVE);
var VIOLET_RGB = hexRgb(VIOLET);
var VOID_RGB = hexRgb(VOID);
var GLOW_RGB = hexRgb(GLOW);
var CORE_RGB = hexRgb(GLOW_CORE);
var KEEP_RGB = hexRgb(KEEP_PURPLE);
var CLOUD_COLS = [LAV_RGB, LAV_DIM_RGB, MAUVE_RGB, VIOLET_RGB];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Field-like composition: the cloud field is full-bleed on phones and
   on desktop alike; the gallery strip sits along the bottom edge. */
function stripH() { return clamp(Math.min(VW, VH) * 0.16, 64, 116); }
function fieldRect() { return { x: 0, y: 0, w: VW, h: VH - stripH() }; }
function slotCenter(i) {
  var s = stripH();
  var gap = Math.min(VW * 0.22, 190);
  var cx = VW / 2 + (i - 1) * gap;
  return { x: cx, y: VH - s / 2, r: Math.min(26, s * 0.30) };
}
/* ---- seeded cloud field: 14 clusters of overlapping puffs ---- */
var clouds = [], voids = [];
(function buildSky() {
  var rng = mulberry32(1644001), i, j, puffs, c;
  for (i = 0; i < N_CLOUDS; i++) {
    puffs = [];
    var n = 5 + Math.floor(rng() * 5);
    var bx = 0.04 + rng() * 0.92, by = 0.06 + rng() * 0.78;
    for (j = 0; j < n; j++) {
      puffs.push({
        dx: (rng() * 2 - 1) * 0.075, dy: (rng() * 2 - 1) * 0.045,
        r: 0.028 + rng() * 0.05, a: 0.10 + rng() * 0.16
      });
    }
    c = Math.floor(rng() * CLOUD_COLS.length);
    clouds.push({
      x: bx, y: by, ci: c, puffs: puffs,
      driftX: 10 + rng() * 14, driftY: 6 + rng() * 10,
      ph: rng() * TAU, sp: 0.030 + rng() * 0.025
    });
  }
  for (i = 0; i < N_VOIDS; i++) {
    voids.push({
      x: 0.06 + rng() * 0.88, y: 0.08 + rng() * 0.72,
      r: 0.014 + rng() * 0.022, ph: rng() * TAU,
      driftX: 6 + rng() * 8, driftY: 4 + rng() * 6
    });
  }
})();
function drawDisc(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function drawClouds(t, rect) {
  var i, j, c, p, cx, cy;
  for (i = 0; i < clouds.length; i++) {
    c = clouds[i];
    var ox = Math.sin(t * c.sp + c.ph) * c.driftX;
    var oy = Math.cos(t * c.sp * 0.8 + c.ph) * c.driftY;
    for (j = 0; j < c.puffs.length; j++) {
      p = c.puffs[j];
      cx = rect.x + (c.x + p.dx) * rect.w + ox;
      cy = rect.y + (c.y + p.dy) * rect.h + oy;
      ctx.fillStyle = rgba(CLOUD_COLS[c.ci], p.a);
      drawDisc(cx, cy, p.r * rect.w);
      ctx.fill();
    }
  }
}
function drawVoids(t, rect) {
  var i, v, cx, cy;
  for (i = 0; i < voids.length; i++) {
    v = voids[i];
    cx = rect.x + v.x * rect.w + Math.sin(t * 0.04 + v.ph) * v.driftX;
    cy = rect.y + v.y * rect.h + Math.cos(t * 0.033 + v.ph) * v.driftY;
    ctx.fillStyle = VOID;
    drawDisc(cx, cy, v.r * rect.w);
    ctx.fill();
    ctx.strokeStyle = rgba(VIOLET_RGB, 0.35);
    ctx.lineWidth = 1;
    drawDisc(cx, cy, v.r * rect.w + 2);
    ctx.stroke();
  }
}
/* ---- the stream: one candidate every 6 s, 26 s life, seeded ---- */
function seedFor(k) { return 1644000 + k * 7919; }
function candBorn(k) { return k * EMIT_EVERY; }
function candAge(k, t) { return t - candBorn(k); }
function candAlpha(k, t) {
  var age = candAge(k, t);
  if (age < 0 || age > LIFE) return 0;
  if (age < FADE_IN) return smooth(age / FADE_IN);
  if (age > LIFE - FADE_OUT) return 1 - smooth((age - (LIFE - FADE_OUT)) / FADE_OUT);
  return 1;
}
var candCache = {};
function candFor(k) {
  if (!candCache[k]) {
    var rng = mulberry32(seedFor(k));
    var sats = [], i;
    for (i = 0; i < 3; i++) {
      sats.push({ a: rng() * TAU, d: 0.55 + rng() * 0.55, r: 0.10 + rng() * 0.10 });
    }
    candCache[k] = {
      x: 0.08 + rng() * 0.84, y: 0.10 + rng() * 0.66,
      r: 0.011 + rng() * 0.008, ph: rng() * TAU, sats: sats
    };
  }
  return candCache[k];
}
function candPos(k, rect) {
  var c = candFor(k);
  return { x: rect.x + c.x * rect.w, y: rect.y + c.y * rect.h, r: c.r * rect.w };
}
/* Live candidates at piece time t: born, not yet dissolved, not kept,
   not released. */
function liveCandidates(t) {
  var out = [], k, kMax = Math.floor(t / EMIT_EVERY) + 1;
  for (k = 0; k <= kMax; k++) {
    if (candAge(k, t) < 0 || candAge(k, t) > LIFE) continue;
    if (isKept(k) || isReleased(k)) continue;
    out.push(k);
  }
  return out;
}
/* ---- keeps: the three-slot gallery, persisted (guarded) ---- */
var keeps = []; /* {k, seed, keepT, fromX, fromY, settled} */
var releases = []; /* {k, seed, relT, slot} */
var refusals = []; /* {k, t} */
function isKept(k) {
  var i; for (i = 0; i < keeps.length; i++) if (keeps[i].k === k) return true;
  return false;
}
function isReleased(k) {
  var i; for (i = 0; i < releases.length; i++) if (releases[i].k === k) return true;
  return false;
}
function store() {
  try {
    if (typeof window !== 'undefined' && window.localStorage) {
      var seeds = [], i;
      for (i = 0; i < keeps.length; i++) seeds.push(keeps[i].seed);
      window.localStorage.setItem(STORE_KEY, JSON.stringify(seeds));
    }
  } catch (e) { /* storage unavailable: keeps live in memory only */ }
}
function restore() {
  try {
    if (typeof window !== 'undefined' && window.localStorage) {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var seeds = JSON.parse(raw);
      if (!seeds || !seeds.length) return;
      var i, k;
      for (i = 0; i < seeds.length && keeps.length < MAX_KEEPS; i++) {
        k = Math.round((seeds[i] - 1644000) / 7919);
        if (k < 0 || seedFor(k) !== seeds[i]) continue;
        keeps.push({ k: k, seed: seeds[i], keepT: -1e9, fromX: 0, fromY: 0, settled: true });
      }
    }
  } catch (e) { /* corrupt or unavailable storage: start empty */ }
}
function keepCandidate(k, t, rect) {
  if (isKept(k)) return false;
  if (keeps.length >= MAX_KEEPS) {
    refusals.push({ k: k, t: t });
    return false;
  }
  var p = candPos(k, rect);
  keeps.push({ k: k, seed: seedFor(k), keepT: t, fromX: p.x, fromY: p.y, settled: false });
  store();
  return true;
}
function releaseKept(slot, t) {
  var kp = keeps[slot];
  if (!kp) return false;
  releases.push({ k: kp.k, seed: kp.seed, relT: t, slot: slot });
  keeps.splice(slot, 1);
  store();
  return true;
}
function drawCandidate(k, t, rect, alphaMul) {
  var c = candFor(k), p = candPos(k, rect);
  var base = candAlpha(k, t) * alphaMul;
  if (base <= 0.01) return;
  var pulse = 0.82 + 0.18 * Math.sin(t * 1.1 + c.ph);
  var a = base * pulse;
  var i, s, sx, sy;
  /* Halo, ring, core, then three satellite dots on faint threads. */
  ctx.fillStyle = rgba(GLOW_RGB, 0.16 * a);
  drawDisc(p.x, p.y, p.r * 4.2);
  ctx.fill();
  ctx.strokeStyle = rgba(LAV_RGB, 0.75 * a);
  ctx.lineWidth = 1.2;
  drawDisc(p.x, p.y, p.r * 2.1);
  ctx.stroke();
  ctx.strokeStyle = rgba(LAV_RGB, 0.30 * a);
  ctx.lineWidth = 1;
  for (i = 0; i < c.sats.length; i++) {
    s = c.sats[i];
    sx = p.x + Math.cos(s.a) * p.r * 2.1 * s.d * 2;
    sy = p.y + Math.sin(s.a) * p.r * 2.1 * s.d * 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(sx, sy);
    ctx.stroke();
  }
  for (i = 0; i < c.sats.length; i++) {
    s = c.sats[i];
    sx = p.x + Math.cos(s.a) * p.r * 2.1 * s.d * 2;
    sy = p.y + Math.sin(s.a) * p.r * 2.1 * s.d * 2;
    ctx.fillStyle = rgba(LAV_RGB, 0.85 * a);
    drawDisc(sx, sy, Math.max(1.5, p.r * s.r * 2));
    ctx.fill();
  }
  ctx.fillStyle = rgba(CORE_RGB, a);
  drawDisc(p.x, p.y, p.r);
  ctx.fill();
}
function drawKept(t, rect) {
  var i, kp, slot, sx, sy, f, x, y, r, a, c, j, s;
  for (i = 0; i < keeps.length; i++) {
    kp = keeps[i];
    slot = slotCenter(i);
    if (kp.settled || t - kp.keepT >= SETTLE) {
      x = slot.x; y = slot.y; r = slot.r * 0.62; a = 1;
    } else {
      f = smooth((t - kp.keepT) / SETTLE);
      x = lerp(kp.fromX, slot.x, f);
      y = lerp(kp.fromY, slot.y, f);
      r = slot.r * 0.62 * (1 + 0.25 * Math.sin(f * Math.PI));
      a = 0.65 + 0.35 * f;
    }
    c = candFor(kp.k);
    ctx.fillStyle = rgba(KEEP_RGB, 0.20 * a);
    drawDisc(x, y, r * 2.6);
    ctx.fill();
    ctx.strokeStyle = rgba(LAV_RGB, 0.8 * a);
    ctx.lineWidth = 1.2;
    drawDisc(x, y, r * 1.5);
    ctx.stroke();
    ctx.fillStyle = rgba(CORE_RGB, a);
    drawDisc(x, y, r * 0.8);
    ctx.fill();
    ctx.fillStyle = rgba(KEEP_RGB, 0.9 * a);
    for (j = 0; j < c.sats.length; j++) {
      s = c.sats[j];
      drawDisc(x + Math.cos(s.a) * r * 1.5 * s.d, y + Math.sin(s.a) * r * 1.5 * s.d, Math.max(1.2, r * 0.14));
      ctx.fill();
    }
  }
  /* Released keeps drift back up into the cloud and dissolve. */
  for (i = releases.length - 1; i >= 0; i--) {
    var rel = releases[i];
    var age = t - rel.relT;
    if (age > RELEASE_T) { releases.splice(i, 1); continue; }
    var sl = slotCenter(rel.slot);
    var fa = 1 - smooth(age / RELEASE_T);
    var ry = sl.y - age * 90;
    ctx.fillStyle = rgba(KEEP_RGB, 0.5 * fa);
    drawDisc(sl.x, ry, slot.r * 0.5 * fa + 1);
    ctx.fill();
  }
}
function drawStrip(t) {
  var s = stripH();
  ctx.fillStyle = PLUM;
  ctx.fillRect(0, VH - s, VW, s);
  ctx.fillStyle = rgba(LAV_RGB, 0.5);
  ctx.fillRect(0, VH - s, VW, 1);
  var i, slot;
  for (i = 0; i < MAX_KEEPS; i++) {
    slot = slotCenter(i);
    ctx.strokeStyle = rgba(LAV_DIM_RGB, 0.55);
    ctx.lineWidth = 1;
    drawDisc(slot.x, slot.y, slot.r);
    ctx.stroke();
    ctx.fillStyle = rgba(LAV_DIM_RGB, 0.10);
    drawDisc(slot.x, slot.y, slot.r);
    ctx.fill();
  }
}
function drawText(rect) {
  var smallPx = isPhone ? 11 : 12;
  var cxm = VW / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  var titlePx = isPhone ? 16 : 20;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Ghost in the Net').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Ghost in the Net').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 13').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = cxm - plateW / 2, plateY = 12;
  ctx.fillStyle = PLUM;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(LAV_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = LAVENDER;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Ghost in the Net', cxm, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(LAV_RGB, 0.8);
  ctx.fillText('2006 · 07 · 13', cxm, plateY + 7 + titlePx + 3);
  var hint = 'Tap a glow to keep it.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = VH - stripH() - hintPlateH - 10;
  ctx.fillStyle = PLUM;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(LAV_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(LAV_RGB, 0.9);
  ctx.fillText(hint, cxm, hintPlateY + 7);

/* ---- tap: keep a glow, or release a kept dot from the strip ---- */
function pointerPos(e) {
  var x = 0, y = 0;
  if (e) {
    if (typeof e.offsetX === 'number') { x = e.offsetX; y = e.offsetY; }
    else if (typeof e.clientX === 'number') {
      x = e.clientX; y = e.clientY;
      try {
        if (canvas.getBoundingClientRect) {
          var r = canvas.getBoundingClientRect();
          x -= r.left; y -= r.top;

}
function onPointerDown(e) {

  var i, slot, dx, dy;

      dx = p.x - slot.x; dy = p.y - slot.y;
      if (dx * dx + dy * dy <= (slot.r + 10) * (slot.r + 10)) {
        releaseKept(i, t);
        return;

    return;

  var best = -1, bestD = 1e9, d;
  for (i = 0; i < live.length; i++) {
    var cp = candPos(live[i], rect);

    d = dx * dx + dy * dy;

if (typeof canvas.addEventListener === 'function') {

}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function draw(t) {
  size();

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);

        alphaMul = 0.55 + 0.25 * Math.sin((ra / REFUSE_T) * Math.PI * 2);

    keeps: function () { return keeps.length; },
    keptSeeds: function () { var s = [], i; for (i = 0; i < keeps.length; i++) s.push(keeps[i].seed); return s; },
    liveCount: function (t) { return liveCandidates(t).length; },
    liveAt: function (t) { return liveCandidates(t); },
    keepAt: function (k, t) { size(); return keepCandidate(k, t, fieldRect()); },

    drawAt: function (t) { draw(t); }

/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */

var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;

}
</script>
</body>
