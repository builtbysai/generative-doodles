<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fusion of Horizons — after Gadamer</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0f14; overflow: hidden; height: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .caption {
    position: fixed; bottom: 18px; left: 22px; color: rgba(220,215,200,0.42);
    font: 11px/1.5 -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.14em;
    text-transform: uppercase; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption">The Fusion of Horizons &middot; after Gadamer</div>
<script>
/*
 * THE FUSION OF HORIZONS
 * After Hans-Georg Gadamer's hermeneutics: nobody receives your words
 * the way you meant them. What is spoken (left, cool, crisp) crosses
 * a field of interpretation and arrives (right, warm) reassembled —
 * colored by the listener's past.
 *
 * Two facing profiles in negative space. Between them a river of
 * glyph-marks: ordered strokes dissolve through turbulence, then
 * re-form into new patterns. Nothing said arrives unchanged.
 */
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildField();
  }

  // --- seeded random ---
  let seed = 20261104;
  function rnd() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  // --- curl-ish flow field: a river running left to right with eddies ---
  function flow(x, y, t) {
    const s = 0.0021;
    // base current: gentle meander
    const meander = Math.sin(x * s * 2.0 + t * 0.10) * 0.5 + Math.sin(y * s * 1.4 - t * 0.06) * 0.3;
    // eddies: localized swirls that never close into traps
    const e1 = Math.sin(x * s * 5.0 + t * 0.35 + y * s * 3.0) * 0.55;
    const e2 = Math.cos(y * s * 6.0 - t * 0.28 + x * s * 2.0) * 0.45;
    return meander + e1 + e2;   // radians of deviation from +x
  }

  // --- glyph particles: spoken marks crossing the field ---
  const GLYPHS = [];
  const N = 900;

  function buildField() {
    GLYPHS.length = 0;
    seed = 20261104;
    const midY = H * 0.5;
    for (let i = 0; i < N; i++) {
      // birth on the speaker side, spread vertically
      const bx = W * (0.08 + rnd() * 0.30);
      const by = midY + (rnd() - 0.5) * H * 0.62;
      GLYPHS.push({
        x: bx, y: by,
        px: bx, py: by,
        // glyph character: stroke type
        k: Math.floor(rnd() * 4),       // 0 line, 1 dot, 2 arc, 3 tick
        len: 3 + rnd() * 14,
        w: 0.6 + rnd() * 1.6,
        sp: 0.35 + rnd() * 0.9,         // drift speed
        ph: rnd() * Math.PI * 2,
        // interpretation factor grows with x
        life: 0
      });
    }
  }

  // color ramp: cool crisp (speaker) -> turbulent neutral -> warm reassembled (listener)
  function glyphColor(t, turb) {
    // t: 0 at speaker, 1 at listener
    let r, g, b, a;
    if (t < 0.45) {
      const k = t / 0.45;
      r = 120 + 40 * k; g = 190 + 20 * k; b = 210 + 10 * k;
    } else if (t < 0.62) {
      const k = (t - 0.45) / 0.17;
      r = 160 + 60 * k; g = 210 - 40 * k; b = 220 - 90 * k;
    } else {
      const k = (t - 0.62) / 0.38;
      r = 220 + 25 * k; g = 170 - 30 * k; b = 130 - 40 * k;
    }
    a = 0.5 + 0.4 * (1 - turb);
    return `rgba(${r|0},${g|0},${b|0},${a.toFixed(2)})`;
  }

  // --- facing profiles (negative space silhouettes) ---
  function drawProfiles(t) {
    const s = Math.min(W, H);
    const headR = s * 0.16;
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#000';
    // left profile (speaker): facing right
    const lx = W * 0.16, ly = H * 0.5;
    ctx.beginPath();
    ctx.arc(lx, ly - headR * 0.2, headR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(lx - headR * 0.7, ly + headR * 0.5, headR * 1.4, H);
    // nose hint
    ctx.beginPath();
    ctx.moveTo(lx + headR * 0.95, ly - headR * 0.25);
    ctx.lineTo(lx + headR * 1.25, ly + headR * 0.05);
    ctx.lineTo(lx + headR * 0.95, ly + headR * 0.18);
    ctx.closePath(); ctx.fill();
    // right profile (listener): facing left
    const rx = W * 0.84, ry = H * 0.5;
    ctx.beginPath();
    ctx.arc(rx, ry - headR * 0.2, headR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(rx - headR * 0.7, ry + headR * 0.5, headR * 1.4, H);
    ctx.beginPath();
    ctx.moveTo(rx - headR * 0.95, ry - headR * 0.25);
    ctx.lineTo(rx - headR * 1.25, ry + headR * 0.05);
    ctx.lineTo(rx - headR * 0.95, ry + headR * 0.18);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // --- grain ---
  let grain = null;
  function makeGrain() {
    grain = document.createElement('canvas');
    grain.width = 128; grain.height = 128;
    const g = grain.getContext('2d');
    const d = g.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      d.data[i] = d.data[i+1] = d.data[i+2] = v;
      d.data[i+3] = 14;
    }
    g.putImageData(d, 0, 0);
  }

  // --- paint the static underpainting once ---
  function underpainting() {
    // deep indigo-charcoal ground with vignette
    const grd = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.1, W/2, H/2, Math.max(W,H)*0.75);
    grd.addColorStop(0, '#171a24');
    grd.addColorStop(0.55, '#101218');
    grd.addColorStop(1, '#0a0b0f');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    // faint horizon wash: cool left, warm right
    const wash = ctx.createLinearGradient(0, 0, W, 0);
    wash.addColorStop(0, 'rgba(70,140,170,0.10)');
    wash.addColorStop(0.5, 'rgba(120,120,140,0.03)');
    wash.addColorStop(1, 'rgba(200,130,80,0.10)');
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, H);

    drawProfiles(0);
  }

  let T = 0;
  function frame() {
    T += 0.016;
    // fade trails slightly for painterly motion
    ctx.fillStyle = 'rgba(13,15,20,0.16)';
    ctx.fillRect(0, 0, W, H);

    const midY = H * 0.5;
    for (const p of GLYPHS) {
      p.px = p.x; p.py = p.y;
      const t = Math.min(1, Math.max(0, (p.x - W * 0.08) / (W * 0.84)));
      // turbulence peaks mid-field (the interpretive gap)
      const turb = Math.sin(t * Math.PI);
      const ang = flow(p.x, p.y, T) * (0.35 + turb * 0.9);
      const step = p.sp * (0.8 + turb * 1.1);
      p.x += Math.cos(ang) * step + 1.1;   // steady current toward listener
      p.y += Math.sin(ang) * step * 1.6 + Math.sin(T * 0.7 + p.ph) * 0.35;

      // wrap: reborn at the speaker
      if (p.x > W * 0.94 || p.y < -20 || p.y > H + 20) {
        p.x = W * (0.08 + rnd() * 0.12);
        p.y = midY + (rnd() - 0.5) * H * 0.62;
        p.px = p.x; p.py = p.y;
        continue;
      }

      ctx.strokeStyle = glyphColor(t, turb);
      ctx.lineWidth = p.w;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const L = p.len * (1 - turb * 0.55);   // marks fragment in turbulence
      if (p.k === 0) {
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.px + Math.cos(ang) * L, p.py + Math.sin(ang) * L);
      } else if (p.k === 1) {
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.px + 0.5, p.py + 0.5);
      } else if (p.k === 2) {
        ctx.arc(p.px, p.py, L * 0.4, ang, ang + 2.1);
      } else {
        const nx = -Math.sin(ang), ny = Math.cos(ang);
        ctx.moveTo(p.px - nx * L * 0.3, p.py - ny * L * 0.3);
        ctx.lineTo(p.px + nx * L * 0.3, p.py + ny * L * 0.3);
      }
      ctx.stroke();
    }

    // grain overlay
    if (grain) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      const pat = ctx.createPattern(grain, 'repeat');
      ctx.fillStyle = pat;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }

  // audio lifecycle: pause when hidden
  let running = true;
  function setRunning(v) {
    if (v === running) return;
    running = v;
    if (v) requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => setRunning(!document.hidden));
  window.addEventListener('blur', () => setRunning(false));
  window.addEventListener('focus', () => setRunning(true));
  window.addEventListener('resize', resize);

  makeGrain();
  resize();
  underpainting();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
