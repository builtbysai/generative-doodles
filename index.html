<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#11110f">
<title>Generative Doodles</title>
<style>
  :root { color-scheme:dark; --bg:#11110f; --ink:#ebe9e1; --muted:#a3a19a; --line:#353531; --gap:5px; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
  button,a { -webkit-tap-highlight-color:transparent; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  button:focus-visible,a:focus-visible { outline:1px solid var(--ink); outline-offset:3px; }
  .shell { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  .shell.wall-mode { height:100vh; height:100dvh; overflow:hidden; }
  .masthead { flex:none; display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:54px; padding:0 19px; }
  h1 { font-family:Georgia,'Times New Roman',serif; font-size:22px; font-weight:normal; letter-spacing:-.055em; line-height:1; margin:0; }
  .tools { display:flex; align-items:center; gap:23px; flex:none; font-size:12px; }
  .tools button { color:var(--muted); padding:10px 0; }
  .tools button:hover,.tools button:focus-visible { color:var(--ink); }
  .motion { min-width:34px; text-align:right; font-variant-numeric:tabular-nums; }
  #wall-view { flex:1; min-height:0; display:flex; padding:0 5px 5px; }
  .wall { flex:1; min-width:0; min-height:0; display:grid; grid-template-columns:repeat(var(--columns,4),minmax(0,1fr)); gap:var(--gap); overflow:hidden; position:relative; }
  .wall:focus-visible { outline:1px solid var(--ink); outline-offset:-1px; }
  .lane { min-width:0; height:100%; overflow:hidden; position:relative; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
  .track { display:flex; flex-direction:column; gap:var(--gap); width:100%; will-change:transform; }
  .tile { display:block; flex:none; width:100%; overflow:hidden; position:relative; background:#1c1c19; cursor:inherit; }
  .tile img { display:block; width:100%; height:100%; object-fit:cover; -webkit-user-drag:none; transform:scale(1); transition:transform 360ms cubic-bezier(.2,.7,.2,1),opacity 180ms ease; }
  @media(hover:hover) and (pointer:fine) {
    .lane:not(.dragging) .tile:hover img { transform:scale(1.025); }
  }
  .tile:active img { transform:scale(.985); }
  .lane.dragging .tile img { transform:none; transition:none; }
  .tile img:not(.ready) { opacity:0; }
  .tile .motion-poster { position:absolute; inset:0; pointer-events:none; }
  .tile .motion-poster:not(.ready) { opacity:0; }
  .tile .motion-poster.ready { opacity:1; }
  .tile.broken::after { content:attr(data-title); position:absolute; inset:0; display:grid; place-items:center; padding:16px; text-align:center; font:normal 15px/1.3 Georgia,serif; color:var(--muted); }
  @media(prefers-reduced-motion:reduce) { .tile img { transition:none; } .tile:active img,.lane:not(.dragging) .tile:hover img { transform:none; } }
  .tile:focus-visible { outline-offset:-2px; z-index:2; }
  .lane.dragging,.lane.dragging .tile { cursor:grabbing; }
  .tile.broken img { visibility:hidden; }
  .tile.broken { background:#1c1c19; }
  .status { margin:auto; padding:24px; color:var(--muted); font-size:13px; text-align:center; }
  .status button { margin-top:12px; text-decoration:underline; }
  .foot { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:20px 0; margin:0 24px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
  .foot .links { display:flex; gap:20px; }
  .foot a:hover,.foot button:hover { color:var(--ink); }
  #index-view { flex:1; width:100%; max-width:1560px; margin:0 auto; padding:44px 24px 64px; }
  .index-top { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:16px; border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:24px; }
  .index-top h2 { font:normal 35px/1 Georgia,serif; letter-spacing:-.05em; margin:0; }
  .sort { display:flex; gap:18px; font-size:12px; }
  .sort button { color:var(--muted); padding:5px 0; }
  .sort button[aria-pressed="true"] { color:var(--ink); text-decoration:underline; text-underline-offset:5px; }
  .index-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:34px 14px; }
  .index-piece { min-width:0; content-visibility:auto; contain-intrinsic-size:auto 340px; }
  .index-piece a { display:block; }
  .index-piece img { width:100%; aspect-ratio:1; object-fit:contain; background:#1c1c19; display:block; }
  .index-piece h3 { font:normal 17px/1.3 Georgia,serif; margin:10px 0 4px; }
  .index-piece a:hover h3 { text-decoration:underline; text-underline-offset:3px; }
  .index-piece .num,.index-piece time { color:var(--muted); }
  .index-piece time { font-size:11px; font-variant-numeric:tabular-nums; }
  .index-piece p { font-size:12px; line-height:1.6; color:var(--muted); margin:7px 0 0; }
  .more { display:block; margin:40px auto 0; padding:8px 0; border-bottom:1px solid var(--ink); font-size:13px; }
  .end { text-align:center; color:var(--muted); font-size:12px; margin:40px 0 0; }
  .preview { color:var(--ink); background:var(--bg); border:0; padding:0; margin:auto; width:100%; max-width:none; height:100%; max-height:none; overflow:auto; overscroll-behavior:contain; }
  .preview::backdrop { background:var(--bg); }
  .preview-inner { min-height:100%; display:flex; flex-direction:column; align-items:center; padding:0 24px 28px; }
  .preview-nav { width:100%; flex:none; display:flex; align-items:center; justify-content:space-between; min-height:58px; font-size:12px; }
  .preview-nav button,.preview-nav a { color:var(--muted); padding:12px 0; }
  .preview-nav button:hover,.preview-nav a:hover { color:var(--ink); }
  .preview-nav .preview-steps { display:flex; gap:20px; }
  .preview-image { width:100%; flex:1; display:grid; place-items:center; min-height:0; touch-action:pan-y pinch-zoom; }
  .preview-image img { display:block; width:auto; max-width:100%; height:auto; max-height:min(72vh,900px); max-height:min(72dvh,900px); object-fit:contain; user-select:none; }
  .preview-image a { display:grid; place-items:center; max-width:100%; cursor:pointer; }
  .preview-image a:focus-visible { outline-offset:5px; }
  .preview-copy { flex:none; }
  .preview-image.is-swiping img { transition:none; }
  .preview[open] { overscroll-behavior:none; }
  .preview-nav button { min-height:44px; }
  .preview-copy { width:min(100%,900px); padding-top:22px; display:grid; grid-template-columns:1fr auto; gap:6px 20px; align-items:baseline; }
  .preview-copy h2 { font:normal clamp(24px,3.5vw,38px)/1.1 Georgia,serif; letter-spacing:-.035em; margin:0; }
  .preview-meta { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; grid-column:1/-1; }
  .preview-copy p { color:var(--muted); font-size:13px; line-height:1.6; max-width:65ch; margin:6px 0 0; grid-column:1/-1; }
  .preview-open { font-size:12px; border-bottom:1px solid var(--muted); padding-bottom:3px; white-space:nowrap; }
  .preview-open:hover { border-color:var(--ink); }
  .preview-links { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; justify-content:flex-end; }
  .preview-try { font-size:12px; color:var(--ink); padding-bottom:3px; border-bottom:1px solid var(--muted); }
  .preview-try:hover { border-color:var(--ink); }
  .preview-image.live-stage { touch-action:auto; }
  .preview-image iframe { display:block; border:0; width:min(100%,900px); height:min(72dvh,900px); background:var(--bg); }
  @media(max-width:640px) { .preview-image iframe { height:60dvh; } .preview-links { gap:12px; } }
  @media(max-width:640px) {
    .masthead { min-height:48px; padding:0 12px; }
    h1 { font-size:20px; }
    .tools { gap:16px; font-size:12px; }
    #wall-view { padding:0 5px 5px; }
    #index-view { padding:28px 12px 40px; }
    .index-top h2 { font-size:28px; }
    .sort { gap:12px; }
    .index-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:26px 8px; }
    .index-piece h3 { font-size:15px; }
    .foot { margin:0 12px; }
    .preview-inner { padding:0 12px 20px; }
    .preview-nav { min-height:48px; }
    .preview-image img { max-height:65dvh; }
    .preview-copy { padding-top:18px; }
  }
  @media(max-width:350px) {
    h1 { font-size:17px; }
    .tools { gap:12px; }
  }
</style>
</head>
<body>
<div class="shell wall-mode" id="shell">
  <header class="masthead">
    <h1>Generative Doodles</h1>
    <nav class="tools" aria-label="Gallery">
      <button id="view-toggle" type="button" aria-controls="wall-view index-view">Index</button>
      <button class="motion" id="motion" type="button" aria-label="Pause gallery">Pause</button>
    </nav>
  </header>
  <main id="wall-view" aria-label="Moving artwork gallery">
    <div class="status" id="status" role="status"></div>
    <div class="wall" id="wall" tabindex="0" aria-label="Artwork wall. Drag or scroll a column to explore. Use arrow keys to move and Enter on a piece to inspect." hidden></div>
  </main>
  <main id="index-view" aria-label="Artwork index" hidden>
    <div class="index-top">
      <h2>Index</h2>
      <div class="sort" role="group" aria-label="Sort pieces">
        <button type="button" data-sort="newest" aria-pressed="true">Newest</button>
        <button type="button" data-sort="oldest" aria-pressed="false">Oldest</button>
        <button type="button" data-sort="az" aria-pressed="false">A&ndash;Z</button>
      </div>
    </div>
    <div class="index-grid" id="pieces"></div>
    <button type="button" class="more" id="more" hidden>Load more pieces</button>
    <p class="end" id="index-end" hidden></p>
  </main>
  <footer class="foot" id="foot" hidden>
    <span id="count" aria-live="polite"></span>
    <span class="links"><button type="button" id="shuffle">Shuffle wall</button><a href="https://github.com/builtbysai/generative-doodles/tree/main/study">Research</a><a href="https://github.com/builtbysai/generative-doodles">GitHub</a></span>
  </footer>
</div>
<dialog class="preview" id="preview" aria-labelledby="preview-title">
  <div class="preview-inner">
    <nav class="preview-nav" aria-label="Artwork navigation">
      <button type="button" id="preview-close" autofocus>Back to wall</button>
      <span class="preview-steps"><button type="button" id="preview-prev">Previous</button><button type="button" id="preview-next">Next</button></span>
    </nav>
    <div class="preview-image" id="preview-image"></div>
    <div class="preview-copy">
      <span class="preview-meta" id="preview-meta"></span>
      <h2 id="preview-title"></h2><span class="preview-links"><button class="preview-try" id="preview-try" type="button" hidden>Try piece</button><a class="preview-open" id="preview-open" href="#">View piece</a></span>
      <p id="preview-note"></p>
    </div>
  </div>
</dialog>
<noscript><p class="status">Enable JavaScript to explore the gallery, or <a href="https://github.com/builtbysai/generative-doodles">browse the source on GitHub</a>.</p></noscript>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const shell = $('shell'), wall = $('wall'), wallView = $('wall-view'), indexView = $('index-view');
  const motion = $('motion'), reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const finePointer = matchMedia('(hover: hover) and (pointer: fine)');
  const GAP = 5, BATCH = 48, DATE_BASE = Date.UTC(2002, 0, 12);
  let all = [], ordered = [], lanes = [], view = 'wall', sort = 'newest', shown = 0;
  let paused = reduced.matches, frame = 0, last = 0, lastWidth = 0, wallHeight = 0, resizeFrame = 0;
  let indexReady = false, arrangement=[], catalog=[], selected=null, returnFocus=null;
  let activeLane=0, gesture=null, suppressClickUntil=0, previewSwipe=null, previewAnimation=null, previewEpoch=0, closing=false;
  let previewSuppressUntil=0, liveFrame=null, movingPoster=null, imagePump=0;
  const imageQueue=new Map(), imageRequests=new Map();
  const MAX_IMAGE_REQUESTS=navigator.connection?.saveData?2:4;
  const saveData=()=>!!navigator.connection?.saveData;
  const ease=3.8, motionEase=7.5;
  const preview=$('preview'), mod=(n,m)=>((n%m)+m)%m, clamp=(n,min,max)=>Math.max(min,Math.min(max,n));

  function element(tag, cls, value) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (value != null) el.textContent = value;
    return el;
  }
  function dateFor(n) {
    const d = new Date(DATE_BASE + (n - 1) * 86400000);
    return d.toISOString().slice(0,10).split('-').join(' · ');
  }
  function thumbnail(p, lazy, defer=false) {
    const img = element('img');
    img.alt = p.title; img.draggable=false;
    img.decoding = 'async';
    img.loading = lazy ? 'lazy' : 'eager';
    img.addEventListener('load',()=>img.classList.add('ready'),{once:true});
    const src=p.thumb || (p.n+'/thumb.png');
    if(defer)img.dataset.src=src;else img.src=src;
    if(img.complete&&img.naturalWidth)img.classList.add('ready');
    return img;
  }
  // Only fetch visible and near-visible wall posters. Prioritize visible work,
  // cap concurrent requests, and discard queued work that has already scrolled away.
  function scheduleImages(){
    if(!imagePump&&view==='wall'&&!preview.open&&!document.hidden)imagePump=requestAnimationFrame(pumpImages);
  }
  function queueImage(img,distance){
    if(!img.dataset.src||imageRequests.has(img))return;
    imageQueue.set(img,distance);scheduleImages();
  }
  function pumpImages(){
    imagePump=0;
    if(view!=='wall'||preview.open||document.hidden)return;
    for(const [img] of imageQueue)if(!img.isConnected||!img.dataset.src)imageQueue.delete(img);
    const candidates=[...imageQueue].sort((a,b)=>a[1]-b[1]);
    while(imageRequests.size<MAX_IMAGE_REQUESTS&&candidates.length){
      const [img,distance]=candidates.shift();imageQueue.delete(img);
      if(!img.isConnected||!img.dataset.src)continue;
      const src=img.dataset.src;delete img.dataset.src;
      let timer=0,done=false;
      const finish=()=>{if(done)return;done=true;clearTimeout(timer);img.removeEventListener('load',finish);img.removeEventListener('error',finish);imageRequests.delete(img);scheduleImages();};
      imageRequests.set(img,finish);img.addEventListener('load',finish,{once:true});img.addEventListener('error',finish,{once:true});
      img.fetchPriority=distance===0?'high':'low';timer=setTimeout(finish,15000);img.src=src;
      if(img.complete&&img.naturalWidth)finish();
    }
  }
  function releaseTile(tile){
    if(movingPoster?.tile===tile)stopMotionPoster();
    const img=tile.querySelector('img:not(.motion-poster)');if(!img)return;
    imageQueue.delete(img);
    // An in-flight request may still be cached by the browser. Keep its slot
    // until it settles or times out, so fast flings cannot flood the network.
  }
  function stopMotionPoster(){
    if(!movingPoster)return;
    const p=movingPoster;movingPoster=null;clearTimeout(p.timer);if(p.img)p.img.remove();
  }
  function motionPath(p){
    const path=p.motionThumb;
    return typeof path==='string'&&path.startsWith(p.n+'/')&&/^\d+\/[a-zA-Z0-9_-]+\.svg(?:\?v=[a-zA-Z0-9._-]+)?$/.test(path)?path:null;
  }
  function startMotionPoster(tile,p,e){
    if(!motionPath(p)||!finePointer.matches||e.pointerType!=='mouse'||paused||reduced.matches||saveData()||gesture||preview.open||document.hidden)return;
    stopMotionPoster();
    const item={tile,img:null,timer:0};movingPoster=item;
    item.timer=setTimeout(()=>{
      if(movingPoster!==item||!tile.isConnected||!tile.matches(':hover')||gesture||paused||reduced.matches||preview.open||document.hidden){if(movingPoster===item)stopMotionPoster();return;}
      const img=element('img','motion-poster');img.alt='';img.draggable=false;img.setAttribute('aria-hidden','true');img.decoding='async';img.fetchPriority='low';item.img=img;
      img.addEventListener('load',()=>{if(movingPoster===item)img.classList.add('ready');},{once:true});
      img.addEventListener('error',()=>{if(movingPoster===item)stopMotionPoster();},{once:true});
      tile.append(img);img.src=motionPath(p);if(img.complete&&img.naturalWidth)img.classList.add('ready');
    },550);
  }
  function ratio(p) {
    const aspect=Number(p.aspect);
    if(Number.isFinite(aspect)&&aspect>=.4&&aspect<=2.5)return 1/aspect;
    if (p.n === 795) return .625;
    if (p.n === 796) return .594;
    const ratios = [1, .79, 1.12, .92, 1, .85, 1.18];
    return ratios[(Math.imul(p.n, 2654435761) >>> 0) % ratios.length];
  }
  function take(lane,index) {
    const p=lane.items[mod(index,lane.items.length)];
    const tile = element('a', 'tile');
    tile.href = p.n + '/'; tile.dataset.piece=p.n; tile.dataset.title=p.title;
    tile.setAttribute('aria-label', 'Piece ' + p.n + ': ' + p.title);
    tile.tabIndex = -1;
    const h = Math.round(lane.width * ratio(p));
    tile.style.height = h + 'px';
    const img = thumbnail(p, false, true);
    img.addEventListener('error', () => tile.classList.add('broken'), {once:true});
    tile.append(img);
    if(motionPath(p)){
      tile.addEventListener('pointerenter',e=>startMotionPoster(tile,p,e));
      tile.addEventListener('pointerleave',()=>{if(movingPoster?.tile===tile)stopMotionPoster();});
    }
    return {el:tile,img,h:h+GAP,index};
  }
  function append(lane) {
    const card=take(lane,lane.cards.length?lane.cards[lane.cards.length-1].index+1:0);
    lane.cards.push(card);
    lane.track.append(card.el);
    lane.total += card.h;
  }
  function prepend(lane) {
    const card=take(lane,lane.cards.length?lane.cards[0].index-1:0);
    lane.cards.unshift(card);
    lane.track.prepend(card.el);
    lane.total += card.h;
    lane.y -= card.h;
  }
  function dropFirst(lane) {
    const card = lane.cards.shift();
    if(card.el.contains(document.activeElement))wall.focus({preventScroll:true});
    releaseTile(card.el);card.el.remove();
    lane.total -= card.h;
    lane.y += card.h;
  }
  function dropLast(lane) {
    const card = lane.cards.pop();
    if(card.el.contains(document.activeElement))wall.focus({preventScroll:true});
    releaseTile(card.el);card.el.remove();
    lane.total -= card.h;
  }
  function buffer(lane) { return Math.max(180, lane.width * 1.25); }
  function fill(lane) {
    const pad = buffer(lane);
    while(lane.y > -pad) prepend(lane);
    while(lane.cards.length>1 && lane.y+lane.cards[0].h < -pad) dropFirst(lane);
    while(lane.y+lane.total < wallHeight+pad) append(lane);
    while(lane.cards.length>1 && lane.y+lane.total-lane.cards[lane.cards.length-1].h > wallHeight+pad) dropLast(lane);
  }
  function paint(lane) {
    lane.track.style.transform = 'translate3d(0,' + lane.y.toFixed(2) + 'px,0)';
    let y = lane.y;
    for (const card of lane.cards) {
      const height = card.h - GAP;
      const visible = Math.min(y + height, wallHeight) - Math.max(y, 0);
      const tab = visible >= Math.min(height * .65, wallHeight * .65) ? 0 : -1;
      if (card.el.tabIndex !== tab) card.el.tabIndex = tab;
      const distance=Math.max(0,-(y+height),y-wallHeight);
      if(distance<=Math.max(150,lane.width*.7))queueImage(card.img,distance);
      else imageQueue.delete(card.img);
      y += card.h;
    }
  }
  function move(lane,dy){lane.y+=dy;fill(lane);paint(lane);}
  function isHeld(lane){return !!lane.el.querySelector(':focus-visible')||(finePointer.matches&&lane.hover);}
  function decay(v,rate,dt){return v*Math.exp(-rate*dt);}
  function travel(v,rate,dt){return v*(1-Math.exp(-rate*dt))/rate;}
  function canAnimate(){return view==='wall'&&!preview.open&&!document.hidden&&lanes.length&&(!paused||lanes.some(l=>Math.abs(l.velocity)>2||Math.abs(l.wheel)>0.5||Math.abs(l.drift)>0.5));}
  function wake(){if(!frame&&canAnimate()){last=0;frame=requestAnimationFrame(tick);}}
  function tick(now){
    frame=0;
    if(!canAnimate()){last=0;return;}
    const dt=last?Math.min((now-last)/1000,.05):0;last=now;
    for(const lane of lanes){
      if(gesture&&gesture.lane===lane)continue;
      let delta=0;
      if(Math.abs(lane.wheel)>.5){
        const portion=lane.wheel*(1-Math.exp(-18*dt));lane.wheel-=portion;delta+=portion;
      }else{delta+=lane.wheel;lane.wheel=0;}
      if(Math.abs(lane.velocity)>2){
        delta+=travel(lane.velocity,ease,dt);
        lane.velocity=decay(lane.velocity,ease,dt);
      }else lane.velocity=0;
      const target=!paused&&!isHeld(lane)&&now>lane.holdUntil&&Math.abs(lane.velocity)<12&&Math.abs(lane.wheel)<1?lane.direction*lane.speed:0;
      lane.drift=target+(lane.drift-target)*Math.exp(-motionEase*dt);
      if(Math.abs(lane.drift)<.5&&!target)lane.drift=0;
      delta+=lane.drift*dt;
      if(Math.abs(delta)>.0001)move(lane,delta);
    }
    if(canAnimate())frame=requestAnimationFrame(tick);else last=0;
  }
  function stopLane(lane){lane.velocity=0;lane.wheel=0;lane.drift=0;}
  function syncAnimation() {
    if (frame) cancelAnimationFrame(frame);
    frame = 0; last = 0;
    wake();
    motion.setAttribute('aria-label', paused ? 'Play gallery' : 'Pause gallery');
    motion.textContent = paused ? 'Play' : 'Pause';
  }
  function columnCount(w) {
    return Math.min(all.length, w < 520 ? 2 : w < 760 ? 3 : w < 1080 ? 4 : w < 1450 ? 5 : 6);
  }
  function buildWall() {
    if (!all.length || view !== 'wall') return;
    const w = wall.clientWidth, h = wall.clientHeight;
    if (!w || !h) return;
    const count = columnCount(w);
    if (lanes.length === count && Math.abs(w-lastWidth) < 2) {
      wallHeight = h;
      for (const lane of lanes) { fill(lane); paint(lane); }
      return;
    }
    const previous=lanes, previousCount=previous.length;
    const anchors=previous.map(l=>{let y=l.y;for(const card of l.cards){const height=card.h-GAP;if(y+height>0)return {index:card.index,fraction:clamp(-y/height,-1,1)};y+=card.h;}return null;});
    clearGesture(); lastWidth = w; wallHeight = h;
    wall.style.setProperty('--columns', count);
    for(const tile of wall.querySelectorAll(".tile"))releaseTile(tile);
    wall.replaceChildren();
    lanes = [];
    const width = (w - (count-1)*GAP)/count;
    const newest=arrangement; activeLane=0;
    for (let i=0;i<count;i++) {
      const el = element('div','lane'), track = element('div','track');
      el.append(track);
      wall.append(el);
      const lane = {
        el, track, width, items:newest.filter((_,j) => j%count===i),
        cards:[], total:0, y:-width*(.24+((i*37)%67)/100),
        direction:i%2===0 ? -1 : 1, speed:Math.max(13, Math.min(26,width*.075))*(1+(i%3)*.10), hover:false,velocity:0,wheel:0,drift:0,holdUntil:0
      };
      bindLane(lane,i);
      // Preserve the artwork and fractional offset across same-column resizes.
      const anchor=previousCount===count?anchors[i]:null;
      if(anchor){
        const card=take(lane,anchor.index);lane.cards.push(card);lane.track.append(card.el);lane.total=card.h;
        lane.y=-anchor.fraction*(card.h-GAP);
      }
      while (lane.y + lane.total < wallHeight + buffer(lane)) append(lane);
      fill(lane); paint(lane);
      lanes.push(lane);
    }
    syncAnimation();
  }
  function clearGesture(){
    if(!gesture)return;
    const g=gesture;gesture=null;g.lane.el.classList.remove('dragging');
    if(g.lane.el.hasPointerCapture(g.id))g.lane.el.releasePointerCapture(g.id);
  }
  function bindLane(lane,i){
    const el=lane.el;
    el.addEventListener('pointerenter',()=>{lane.hover=true;activeLane=i;});
    el.addEventListener('pointerleave',()=>{lane.hover=false;});
    el.addEventListener('focusin',()=>{activeLane=i;});
    el.addEventListener('dragstart',e=>e.preventDefault());
    el.addEventListener('pointerdown',e=>{
      if(gesture||!e.isPrimary||e.button!==0)return;
      stopMotionPoster();activeLane=i;stopLane(lane);lane.holdUntil=performance.now()+600;suppressClickUntil=0;
      gesture={id:e.pointerId,lane,startX:e.clientX,startY:e.clientY,lastY:e.clientY,lastTime:performance.now(),samples:[{y:e.clientY,t:performance.now()}],moved:false};
    });
    el.addEventListener('lostpointercapture',e=>{if(e.target===el&&gesture&&gesture.id===e.pointerId)endGesture(e);});
    el.addEventListener('wheel',e=>{
      if(e.ctrlKey||e.metaKey||gesture||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
      const dy=e.deltaY;if(!dy)return;
      e.preventDefault();stopMotionPoster();activeLane=i;lane.velocity=0;lane.drift=0;
      const units=e.deltaMode===1?16:e.deltaMode===2?wallHeight:1;
      const distance=-clamp(dy*units,-wallHeight,wallHeight);
      if(reduced.matches)move(lane,distance);
      else{
        // Small direct response, with a short damped tail for both mouse wheels and trackpads.
        move(lane,distance*.7);lane.wheel=clamp(lane.wheel+distance*.3,-wallHeight,wallHeight);
      }
      lane.holdUntil=performance.now()+850;wake();
    },{passive:false});
  }
  window.addEventListener('pointermove',e=>{
    if(!gesture||gesture.id!==e.pointerId)return;
    const g=gesture,lane=g.lane;
    if(!g.moved){
      if(Math.hypot(e.clientX-g.startX,e.clientY-g.startY)<6)return;
      g.moved=true;lane.el.setPointerCapture(e.pointerId);lane.el.classList.add('dragging');
      if(lane.el.contains(document.activeElement))wall.focus({preventScroll:true});
    }
    const events=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():[];
    const now=performance.now();
    for(const point of (events.length?events:[e])){
      g.samples.push({y:point.clientY,t:Math.min(now,point.timeStamp)});
    }
    g.samples=g.samples.filter(p=>now-p.t<=100).slice(-20);
    const dy=e.clientY-g.lastY;g.lastY=e.clientY;g.lastTime=now;
    move(lane,dy);
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  function endGesture(e){
    if(!gesture||gesture.id!==e.pointerId)return;
    const g=gesture,lane=g.lane,now=performance.now();
    clearGesture();
    if(g.moved){
      suppressClickUntil=now+350;
      const first=g.samples[0],tail=g.samples[g.samples.length-1];
      const v=first&&tail&&tail.t-first.t>=8?(tail.y-first.y)/(tail.t-first.t)*1000:0;
      lane.velocity=!reduced.matches&&e.type==='pointerup'&&now-g.lastTime<85?clamp(v,-2800,2800):0;
      lane.holdUntil=now+900;
    }
    wake();
  }
  window.addEventListener('pointerup',endGesture);
  window.addEventListener('pointercancel',endGesture);
  window.addEventListener('blur',()=>{stopMotionPoster();clearGesture();for(const l of lanes){l.hover=false;stopLane(l);}wake();});
  wall.addEventListener('click',e=>{
    if(e.detail!==0&&performance.now()<suppressClickUntil){e.preventDefault();e.stopPropagation();return;}
    const tile=e.target.closest('.tile');
    if(!tile||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||typeof preview.showModal!=='function')return;
    const p=catalog.find(p=>String(p.n)===tile.dataset.piece);
    if(p){e.preventDefault();openPreview(p,tile);}
  },true);
  wall.addEventListener('keydown',e=>{
    if(!lanes.length||e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      e.preventDefault();activeLane=mod(activeLane+(e.key==='ArrowRight'?1:-1),lanes.length);
      const next=lanes[activeLane].cards.find(c=>c.el.tabIndex===0);
      if(next)next.el.focus({preventScroll:true});else wall.focus({preventScroll:true});
    }else if(['ArrowUp','ArrowDown','PageUp','PageDown'].includes(e.key)){
      e.preventDefault();const lane=lanes[activeLane];stopLane(lane);
      const distance=e.key.startsWith('Page')?wallHeight*.8:lane.width*.55;
      move(lane,(e.key.endsWith('Up')?1:-1)*distance);lane.holdUntil=performance.now()+1200;wake();
    }
  });
  function cancelPreviewAnimation(){
    if(previewAnimation){previewAnimation.cancel();previewAnimation=null;}
  }
  function removeLive(){
    if(liveFrame){liveFrame.remove();liveFrame=null;}
    $('preview-image').classList.remove('live-stage');
  }
  function showStill(){
    if(!selected)return;
    cancelPreviewAnimation();removeLive();renderPreview(selected);
  }
  function showLive(){
    if(!selected||selected.livePreview!==true||!preview.open||closing)return;
    if(liveFrame){showStill();return;}
    cancelPreviewAnimation();previewEpoch++;previewSwipe=null;
    const stage=$('preview-image');stage.classList.remove('is-swiping');
    const iframe=element('iframe');iframe.title=selected.title+' — interactive artwork';
    iframe.setAttribute('sandbox','allow-scripts');
    iframe.setAttribute('allow',"autoplay 'none'; camera 'none'; microphone 'none'; geolocation 'none'");
    iframe.referrerPolicy='no-referrer';iframe.src=selected.n+'/?preview=1';
    liveFrame=iframe;stage.classList.add('live-stage');stage.replaceChildren(iframe);
    $('preview-try').textContent='Still';
  }
  $('preview-try').addEventListener('click',showLive);
  function renderPreview(p){
    removeLive();selected=p;previewEpoch++;
    const epoch=previewEpoch;
    $('preview-title').textContent=p.title;
    $('preview-meta').textContent='№'+p.n+' · '+dateFor(p.n);
    $('preview-note').textContent=p.note||'';$('preview-note').hidden=!p.note;
    $('preview-open').href=p.n+'/';
    $('preview-open').textContent=p.livePreview===true?'Full page':'View piece';
    $('preview-try').hidden=p.livePreview!==true;$('preview-try').textContent='Try piece';
    const link=element('a');link.href=p.n+'/';link.setAttribute('aria-label','View '+p.title);
    const img=thumbnail(p,false);link.append(img);$('preview-image').replaceChildren(link);
    img.addEventListener('error',()=>{if(epoch===previewEpoch){const fallback=element('span','','View piece');link.replaceChildren(fallback);}},{once:true});
    return img;
  }
  function animateFromTile(img,tile,epoch){
    if(reduced.matches||typeof img.animate!=='function'||!tile||!tile.isConnected)return;
    const src=tile.getBoundingClientRect(),dest=img.getBoundingClientRect();
    if(!src.width||!src.height||!dest.width||!dest.height)return;
    const scale=Math.min(src.width/dest.width,src.height/dest.height);
    const x=src.left+src.width/2-(dest.left+dest.width/2),y=src.top+src.height/2-(dest.top+dest.height/2);
    if(epoch!==previewEpoch||!preview.open)return;
    cancelPreviewAnimation();
    previewAnimation=img.animate([{transform:'translate('+x+'px,'+y+'px) scale('+scale+')',opacity:.85},{transform:'none',opacity:1}],{duration:320,easing:'cubic-bezier(.2,.75,.2,1)'});
  }
  function openPreview(p,tile){
    stopMotionPoster();returnFocus=tile;for(const l of lanes)stopLane(l);
    closing=false;previewSwipe=null;previewSuppressUntil=0;
    const img=renderPreview(p),epoch=previewEpoch;preview.showModal();syncAnimation();
    if(img.complete&&img.naturalWidth)requestAnimationFrame(()=>animateFromTile(img,tile,epoch));
    else img.addEventListener('load',()=>requestAnimationFrame(()=>animateFromTile(img,tile,epoch)),{once:true});
  }
  function stepPreview(step){
    if(!selected||closing)return;
    cancelPreviewAnimation();
    const img=renderPreview(catalog[mod(catalog.findIndex(p=>p.n===selected.n)+step,catalog.length)]);
    if(!reduced.matches&&typeof img.animate==='function'){
      previewAnimation=img.animate([{transform:'translateX('+(step*32)+'px)',opacity:.25},{transform:'none',opacity:1}],{duration:230,easing:'cubic-bezier(.2,.7,.2,1)'});
    }
  }
  function closePreview(){
    if(closing||!preview.open)return;
    closing=true;previewEpoch++;cancelPreviewAnimation();removeLive();previewSwipe=null;$('preview-image').classList.remove('is-swiping');
    const img=$('preview-image').querySelector('img'),tile=returnFocus;
    if(reduced.matches||!img||!tile||!tile.isConnected||selected.n!==Number(tile.dataset.piece)||typeof img.animate!=='function'){preview.close();return;}
    const src=img.getBoundingClientRect(),dest=tile.getBoundingClientRect();
    if(!src.width||!dest.width){preview.close();return;}
    const scale=Math.min(dest.width/src.width,dest.height/src.height);
    const x=dest.left+dest.width/2-(src.left+src.width/2),y=dest.top+dest.height/2-(src.top+src.height/2);
    const animation=img.animate([{transform:'none',opacity:1},{transform:'translate('+x+'px,'+y+'px) scale('+scale+')',opacity:.7}],{duration:220,easing:'cubic-bezier(.4,0,.4,1)',fill:'forwards'});
    previewAnimation=animation;animation.onfinish=()=>{if(preview.open)preview.close();};
  }
  $('preview-close').addEventListener('click',closePreview);
  $('preview-prev').addEventListener('click',()=>stepPreview(-1));
  $('preview-next').addEventListener('click',()=>stepPreview(1));
  preview.addEventListener('cancel',e=>{e.preventDefault();closePreview();});
  preview.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();stepPreview(e.key==='ArrowRight'?1:-1);}});
  const stage=$('preview-image');
  stage.addEventListener('pointerdown',e=>{
    if(liveFrame||!e.isPrimary||e.pointerType==='mouse'||closing)return;
    cancelPreviewAnimation();previewSwipe={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,t:performance.now(),active:false};
  });
  stage.addEventListener('pointermove',e=>{
    const g=previewSwipe;if(!g||g.id!==e.pointerId)return;
    g.dx=e.clientX-g.x;
    if(!g.active){
      if(Math.abs(g.dx)<10||Math.abs(g.dx)<Math.abs(e.clientY-g.y)*1.4)return;
      g.active=true;stage.setPointerCapture(e.pointerId);stage.classList.add('is-swiping');
    }
    const img=stage.querySelector('img');
    if(img&&!reduced.matches)img.style.transform='translateX('+g.dx*.75+'px)';
  });
  function finishSwipe(e){
    const g=previewSwipe;if(!g||g.id!==e.pointerId)return;
    previewSwipe=null;stage.classList.remove('is-swiping');
    if(!g.active)return;
    previewSuppressUntil=performance.now()+400;
    const img=stage.querySelector('img');if(img)img.style.transform='';
    if(e.type==='pointerup'&&(Math.abs(g.dx)>Math.min(100,stage.clientWidth*.22)||(Math.abs(g.dx)>38&&performance.now()-g.t<240)))stepPreview(g.dx<0?1:-1);
    else if(img&&!reduced.matches&&typeof img.animate==='function')previewAnimation=img.animate([{transform:'translateX('+g.dx*.75+'px)'},{transform:'none'}],{duration:180,easing:'ease-out'});
  }
  stage.addEventListener('pointerup',finishSwipe);stage.addEventListener('pointercancel',finishSwipe);stage.addEventListener('lostpointercapture',e=>{if(e.target===stage)finishSwipe(e);});
  stage.addEventListener('click',e=>{if(e.detail&&performance.now()<previewSuppressUntil){e.preventDefault();e.stopPropagation();}},true);
  preview.addEventListener('close',()=>{
    previewEpoch++;cancelPreviewAnimation();removeLive();closing=false;previewSwipe=null;stage.classList.remove('is-swiping');
    if(returnFocus&&returnFocus.isConnected)returnFocus.focus({preventScroll:true});else wall.focus({preventScroll:true});
    returnFocus=null;selected=null;stage.replaceChildren();scheduleImages();syncAnimation();
  });
  $('shuffle').addEventListener('click',()=>{
    if(!all.length)return;arrangement=all.slice();
    for(let i=arrangement.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arrangement[i],arrangement[j]]=[arrangement[j],arrangement[i]];}
    clearGesture();lanes=[];lastWidth=0;setView('wall');
  });
  function scheduleResize() {
    if (resizeFrame) cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {resizeFrame=0; buildWall();});
  }

  function indexCard(p) {
    const section = element('article','index-piece');
    const a = element('a');
    a.href = p.n + '/';
    const h = element('h3');
    h.append(element('span','num','№'+p.n), document.createTextNode(' · '+p.title));
    a.append(thumbnail(p,true),h);
    const time = element('time','',dateFor(p.n));
    time.dateTime = new Date(DATE_BASE+(p.n-1)*86400000).toISOString().slice(0,10);
    section.append(a,time);
    if (p.note) section.append(element('p','',p.note));
    return section;
  }
  function renderBatch() {
    const frag = document.createDocumentFragment();
    const end = Math.min(shown+BATCH, ordered.length);
    for (;shown<end;shown++) frag.append(indexCard(ordered[shown]));
    $('pieces').append(frag);
    $('more').hidden = shown>=ordered.length;
    $('index-end').hidden = true;
    if (shown<ordered.length) $('more').textContent='Load more';
  }
  function resetIndex() {
    ordered=all.slice();
    if(sort==='newest') ordered.sort((a,b)=>b.n-a.n);
    else if(sort==='oldest') ordered.sort((a,b)=>a.n-b.n);
    else ordered.sort((a,b)=>a.title.localeCompare(b.title)||a.n-b.n);
    shown=0; $('pieces').replaceChildren(); renderBatch(); indexReady=true;
  }
  function setView(next) {
    if (view===next) return;
    stopMotionPoster();view=next;
    shell.classList.toggle('wall-mode',view==='wall');
    wallView.hidden=view!=='wall'; indexView.hidden=view!=='index'; motion.hidden=view!=='wall'; $('foot').hidden=view!=='index'; clearGesture(); for(const l of lanes)stopLane(l);
    $('view-toggle').textContent=view==='wall'?'Index':'Wall';
    if (view==='index' && !indexReady && all.length) resetIndex();
    window.scrollTo(0,0);
    if (view==='wall') scheduleResize();
    syncAnimation();
  }
  $('view-toggle').addEventListener('click',()=>setView(view==='wall'?'index':'wall'));
  motion.addEventListener('click',()=>{paused=!paused;stopMotionPoster();for(const l of lanes)stopLane(l);syncAnimation();});
  reduced.addEventListener('change',event=>{if(event.matches){paused=true;stopMotionPoster();if(liveFrame)showStill();for(const l of lanes)stopLane(l);syncAnimation();}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stopMotionPoster();if(liveFrame)showStill();clearGesture();for(const l of lanes)stopLane(l);}else scheduleImages();syncAnimation();});
  window.addEventListener('pagehide',()=>{stopMotionPoster();if(liveFrame)showStill();});
  window.addEventListener('pageshow',()=>{for(const l of lanes){l.hover=false;stopLane(l);}syncAnimation();});
  document.querySelectorAll('.sort button').forEach(btn=>btn.addEventListener('click',()=>{
    if(btn.dataset.sort===sort)return;
    sort=btn.dataset.sort;
    document.querySelectorAll('.sort button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
    if(all.length) resetIndex();
  }));
  $('more').addEventListener('click',renderBatch);
  if('ResizeObserver' in window) new ResizeObserver(scheduleResize).observe(wall);
  else window.addEventListener('resize',scheduleResize);
  syncAnimation();
  fetch('pieces.json',{cache:'no-cache'})
    .then(r=>{if(!r.ok)throw new Error('Collection unavailable');return r.json();})
    .then(data=>{
      if(!Array.isArray(data)||!data.length)throw new Error('Empty collection');
      all=data;catalog=all.slice().sort((a,b)=>b.n-a.n);arrangement=catalog.slice();
      $('count').textContent=all.length.toLocaleString()+' pieces';
      $('status').hidden=true; wall.hidden=false;
      if(view==='index')resetIndex();else scheduleResize();
    })
    .catch(()=>{
      const status=$('status');
      status.replaceChildren(document.createTextNode('The collection could not be loaded.'),element('br'));
      const retry=element('button','','Try again');retry.type='button';retry.addEventListener('click',()=>location.reload());
      status.append(retry);
      const error=element('p','status','The collection could not be loaded. Return to Wall to retry.');
      $('pieces').replaceChildren(error);
    });
})();
</script>
</body>
</html>
