<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #14120d;
    color: #e8e2d2;
    font-family: Georgia, serif;
    min-height: 100vh;
  }
  .wall {
    max-width: 780px;
    margin: 0 auto;
    padding: 9vmin 24px 12vmin;
  }
  header { margin-bottom: 6vmin; }
  header h1 {
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #e8e2d2;
    margin-bottom: 18px;
  }
  header .rule {
    width: 44px;
    height: 1px;
    background: #a33b2e;
    margin-bottom: 18px;
  }
  header p {
    color: #8f8875;
    font-size: 15px;
    line-height: 1.8;
    font-style: italic;
    max-width: 52ch;
  }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6vmin;
    padding-bottom: 14px;
    border-bottom: 1px solid #262219;
    flex-wrap: wrap;
    gap: 10px;
  }
  .controls .count {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: #6f695b;
  }
  .sort {
    display: flex;
    gap: 6px;
    font-size: 12px;
    letter-spacing: 0.1em;
  }
  .sort button {
    background: none;
    border: 1px solid #2e2a1f;
    color: #8f8875;
    font-family: Georgia, serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .sort button:hover {
    border-color: #a33b2e;
    color: #e8e2d2;
  }
  .sort button.active {
    background: #a33b2e;
    border-color: #a33b2e;
    color: #f5efe0;
  }
  .piece { margin-bottom: 9vmin; }
  .piece a.thumb {
    display: block;
    overflow: hidden;
    background: #1d1a13;
  }
  .piece a.thumb img {
    display: block;
    width: 100%;
    height: auto;
    transition: transform 0.6s cubic-bezier(0.2, 0.6, 0.2, 1);
  }
  .piece a.thumb:hover img { transform: scale(1.018); }
  .piece .caption {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #262219;
  }
  .piece .caption h2 {
    font-size: 19px;
    font-weight: normal;
    letter-spacing: 0.03em;
  }
  .piece .caption h2 .num { color: #a33b2e; }
  .piece .caption time {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: #6f695b;
  }
  .piece .note {
    margin-top: 10px;
    font-size: 13.5px;
    font-style: italic;
    color: #8f8875;
    line-height: 1.7;
  }
  #sentinel {
    height: 1px;
  }
  .loading {
    text-align: center;
    padding: 4vmin 0;
    color: #6f695b;
    font-size: 13px;
    font-style: italic;
    letter-spacing: 0.1em;
  }
  .end {
    text-align: center;
    padding: 4vmin 0 2vmin;
    color: #6f695b;
    font-size: 12px;
    letter-spacing: 0.14em;
    font-style: italic;
  }
  footer {
    margin-top: 2vmin;
    padding-top: 22px;
    border-top: 1px solid #262219;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: #6f695b;
  }
  footer a { color: #a33b2e; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wall">
  <header>
    <h1>Generative Doodles</h1>
    <div class="rule"></div>
    <p>A daily practice in generative art. Small programs, drawn live in your browser.</p>
  </header>

  <div class="controls">
    <span class="count" id="count"></span>
    <div class="sort" role="group" aria-label="Sort pieces">
      <button data-sort="newest" class="active">Newest</button>
      <button data-sort="oldest">Oldest</button>
      <button data-sort="az">A&ndash;Z</button>
    </div>
  </div>

  <div id="pieces"></div>
  <div id="sentinel"></div>
  <div class="loading" id="loading" style="display:none">loading more&hellip;</div>
  <div class="end" id="end" style="display:none">the whole collection, so far</div>

  <footer>
    <span>drawn with code</span>
    <span><a href="https://github.com/builtbysai/generative-doodles/tree/main/study">research</a> &middot; <a href="https://github.com/builtbysai/generative-doodles">github</a></span>
  </footer>
</div>

<script>
(function() {
  var BATCH = 24;
  var all = [];
  var order = [];
  var rendered = 0;
  var sortMode = 'newest';

  var container = document.getElementById('pieces');
  var sentinel = document.getElementById('sentinel');
  var loadingEl = document.getElementById('loading');
  var endEl = document.getElementById('end');
  var countEl = document.getElementById('count');

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function applySort() {
    order = all.slice();
    if (sortMode === 'newest') order.sort(function(a, b) { return b.n - a.n; });
    else if (sortMode === 'oldest') order.sort(function(a, b) { return a.n - b.n; });
    else order.sort(function(a, b) {
      var t = a.title.localeCompare(b.title);
      return t !== 0 ? t : a.n - b.n;
    });
  }

  function pieceHTML(p) {
    var note = p.note ? '<p class="note">' + esc(p.note) + '</p>' : '';
    return '<section class="piece">' +
      '<a class="thumb" href="' + p.n + '/">' +
      '<img src="' + esc(p.thumb || (p.n + '/thumb.png')) + '" alt="' + esc(p.title) + '" loading="lazy">' +
      '</a>' +
      '<div class="caption"><h2><span class="num">№' + p.n + '</span> &middot; ' + esc(p.title) + '</h2>' +
      '<time>' + esc(p.date) + '</time></div>' +
      note +
      '</section>';
  }

  function renderBatch() {
    if (rendered >= order.length) return;
    var frag = document.createDocumentFragment();
    var tmp = document.createElement('div');
    var end = Math.min(rendered + BATCH, order.length);
    var html = '';
    for (var i = rendered; i < end; i++) html += pieceHTML(order[i]);
    tmp.innerHTML = html;
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    container.appendChild(frag);
    rendered = end;
    updateState();
  }

  function updateState() {
    var done = rendered >= order.length;
    loadingEl.style.display = 'none';
    endEl.style.display = done ? 'block' : 'none';
    countEl.textContent = order.length + (order.length === 1 ? ' piece' : ' pieces');
  }

  function reset() {
    container.innerHTML = '';
    rendered = 0;
    endEl.style.display = 'none';
    renderBatch();
  }

  var observer = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting && rendered < order.length) {
      loadingEl.style.display = 'block';
      // Let the browser paint the loading state, then render
      requestAnimationFrame(function() {
        setTimeout(renderBatch, 30);
      });
    }
  }, { rootMargin: '1200px' });
  observer.observe(sentinel);

  document.querySelectorAll('.sort button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (btn.dataset.sort === sortMode) return;
      sortMode = btn.dataset.sort;
      document.querySelectorAll('.sort button').forEach(function(b) {
        b.classList.toggle('active', b === btn);
      });
      applySort();
      reset();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  fetch('pieces.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      all = data;
      applySort();
      reset();
    })
    .catch(function() {
      countEl.textContent = 'could not load pieces';
    });
})();
</script>
</body>
</html>
