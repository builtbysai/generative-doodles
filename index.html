<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14120d">
<title>Generative Doodles</title>
<style>
  :root { color-scheme: dark; --bg:#14120d; --ink:#e8e2d2; --muted:#a39b87; --line:#302b21; --accent:#c76b56; --gap:8px; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Georgia,serif; }
  button, a { -webkit-tap-highlight-color:transparent; }
  button { font:inherit; }
  a { color:inherit; text-decoration:none; }
  button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .shell { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  .shell.wall-mode { height:100vh; height:100dvh; overflow:hidden; }
  .masthead { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:18px 24px; border-bottom:1px solid var(--line); }
  .brand { min-width:0; }
  h1 { margin:0; font-size:14px; font-weight:normal; letter-spacing:.25em; text-transform:uppercase; }
  .brand p { color:var(--muted); font-size:12px; font-style:italic; margin:6px 0 0; }
  .tools { display:flex; align-items:center; gap:16px; flex-shrink:0; }
  .view-switch { display:flex; gap:2px; padding:3px; border:1px solid var(--line); border-radius:5px; }
  .view-switch button, .motion, .sort button, .more { cursor:pointer; color:var(--muted); background:transparent; border:0; padding:7px 11px; font-size:12px; line-height:1.2; }
  .view-switch button[aria-pressed="true"] { color:var(--ink); background:#302a20; border-radius:3px; }
  .motion { display:flex; align-items:center; gap:7px; min-height:36px; padding:6px 2px; }
  .motion:hover, .sort button:hover, .view-switch button:hover, .more:hover { color:var(--ink); }
  .motion svg { width:15px; height:15px; flex:none; }
  #wall-view { flex:1; min-height:0; padding:8px 8px 0; display:flex; }
  .wall { flex:1; min-width:0; min-height:0; display:grid; grid-template-columns:repeat(var(--columns, 4),minmax(0,1fr)); gap:var(--gap); overflow:hidden; position:relative; }
  .lane { min-width:0; height:100%; overflow:hidden; position:relative; }
  .track { display:flex; flex-direction:column; gap:var(--gap); width:100%; will-change:transform; }
  .tile { display:block; flex:none; width:100%; overflow:hidden; position:relative; background:#211e17; isolation:isolate; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s cubic-bezier(.2,.6,.2,1); }
  .tile:hover img, .tile:focus-visible img { transform:scale(1.025); }
  .tile:focus-visible { outline-offset:-3px; z-index:2; }
  .tile-label { position:absolute; inset:auto 0 0; padding:28px 12px 11px; display:flex; align-items:flex-end; justify-content:space-between; gap:8px; background:linear-gradient(transparent,rgba(12,10,8,.86)); color:#fff; opacity:0; transition:opacity .2s; pointer-events:none; }
  .tile:hover .tile-label, .tile:focus-visible .tile-label, .tile.broken .tile-label { opacity:1; }
  .tile-label strong { font-weight:normal; font-size:14px; line-height:1.2; }
  .tile-label small { font-size:10px; white-space:nowrap; color:#e8e2d2; }
  .tile.broken { display:grid; place-items:center; }
  .tile.broken img { visibility:hidden; }
  .tile.broken::before { content:"Preview unavailable"; position:absolute; color:var(--muted); font-size:12px; font-style:italic; }
  .status { margin:auto; padding:24px; text-align:center; font-size:14px; color:var(--muted); }
  .status button { color:var(--ink); background:transparent; border:1px solid var(--line); padding:7px 12px; cursor:pointer; margin-top:12px; }
  .foot { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 24px; font-size:11px; letter-spacing:.06em; color:var(--muted); }
  .foot a:hover { color:var(--ink); }
  .foot .links { display:flex; gap:14px; }
  #index-view { flex:1; width:100%; max-width:1560px; margin:0 auto; padding:28px 24px 40px; }
  .index-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:24px; }
  .index-top h2 { font-size:20px; font-weight:normal; margin:0; }
  .sort { display:flex; gap:4px; }
  .sort button { border:1px solid var(--line); border-radius:3px; }
  .sort button[aria-pressed="true"] { color:var(--ink); border-color:#77644c; }
  .index-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:28px 16px; }
  .index-piece { min-width:0; }
  .index-piece a { display:block; }
  .index-piece img { width:100%; aspect-ratio:1; object-fit:contain; background:#211e17; display:block; }
  .index-piece a:hover h3 { color:var(--accent); }
  .index-piece h3 { font-weight:normal; font-size:16px; margin:10px 0 5px; }
  .index-piece .num { color:var(--accent); }
  .index-piece time { font-size:11px; color:var(--muted); letter-spacing:.08em; }
  .index-piece p { font-size:12px; line-height:1.6; color:var(--muted); margin:7px 0 0; font-style:italic; }
  .more { display:block; margin:32px auto 0; border:1px solid var(--line); padding:12px 20px; }
  .end { text-align:center; color:var(--muted); font-size:12px; font-style:italic; margin:32px 0 0; }
  @media (max-width:640px) {
    .masthead { flex-wrap:wrap; gap:10px; padding:14px 12px 10px; }
    h1 { font-size:12px; letter-spacing:.19em; }
    .brand p { font-size:11px; }
    .tools { gap:12px; margin-left:auto; }
    .view-switch button { padding:6px 9px; }
    .motion { min-height:31px; }
    #wall-view { padding:6px 6px 0; }
    .foot { padding:10px 12px; font-size:10px; }
    .foot .links { gap:10px; }
    #index-view { padding:20px 12px 32px; }
    .index-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px 10px; }
    .index-piece h3 { font-size:14px; }
  }
  @media (hover:none) { .tile-label { opacity:1; padding:22px 8px 7px; } .tile-label strong { font-size:11px; } .tile-label small { font-size:9px; } }
  @media (prefers-reduced-motion:reduce) { .tile img, .tile-label { transition:none; } .tile:hover img, .tile:focus-visible img { transform:none; } }
</style>
</head>
<body>
<div class="shell wall-mode" id="shell">
  <header class="masthead">
    <div class="brand">
      <h1>Generative Doodles</h1>
      <p>A daily practice in generative art. Drawn live in your browser.</p>
    </div>
    <div class="tools">
      <div class="view-switch" role="group" aria-label="Gallery view">
        <button id="wall-button" type="button" aria-pressed="true" aria-controls="wall-view">Wall</button>
        <button id="index-button" type="button" aria-pressed="false" aria-controls="index-view">Index</button>
      </div>
      <button class="motion" id="motion" type="button" aria-label="Pause gallery">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path id="motion-icon" d="M4 3h2.5v10H4zm5.5 0H12v10H9.5z"/></svg>
        <span id="motion-label">Pause</span>
      </button>
    </div>
  </header>
  <main id="wall-view" aria-label="Moving artwork gallery">
    <div class="status" id="status" role="status">Opening the collection&hellip;</div>
    <div class="wall" id="wall" hidden></div>
  </main>
  <main id="index-view" aria-label="Artwork index" hidden>
    <div class="index-top">
      <h2>All pieces</h2>
      <div class="sort" role="group" aria-label="Sort pieces">
        <button type="button" data-sort="newest" aria-pressed="true">Newest</button>
        <button type="button" data-sort="oldest" aria-pressed="false">Oldest</button>
        <button type="button" data-sort="az" aria-pressed="false">A&ndash;Z</button>
      </div>
    </div>
    <div class="index-grid" id="pieces"></div>
    <button type="button" class="more" id="more" hidden>Load more pieces</button>
    <p class="end" id="index-end" hidden>The whole collection, so far.</p>
  </main>
  <footer class="foot">
    <span id="count" aria-live="polite">Drawn with code</span>
    <span class="links"><a href="https://github.com/builtbysai/generative-doodles/tree/main/study">Research</a><a href="https://github.com/builtbysai/generative-doodles">GitHub</a></span>
  </footer>
</div>
<noscript><p class="status">Enable JavaScript to explore the gallery, or <a href="https://github.com/builtbysai/generative-doodles">browse the source on GitHub</a>.</p></noscript>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const shell = $('shell'), wall = $('wall'), wallView = $('wall-view'), indexView = $('index-view');
  const motion = $('motion'), reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const finePointer = matchMedia('(hover: hover) and (pointer: fine)');
  const GAP = 8, BATCH = 48, DATE_BASE = Date.UTC(2002, 0, 12);
  let all = [], ordered = [], lanes = [], view = 'wall', sort = 'newest', shown = 0;
  let paused = reduced.matches, frame = 0, last = 0, lastWidth = 0, wallHeight = 0, resizeFrame = 0;
  let indexReady = false;

  function element(tag, cls, value) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (value != null) el.textContent = value;
    return el;
  }
  function dateFor(n) {
    const d = new Date(DATE_BASE + (n - 1) * 86400000);
    return d.toISOString().slice(0,10).split('-').join(' · ');
  }
  function thumbnail(p, lazy) {
    const img = element('img');
    img.alt = p.title;
    img.decoding = 'async';
    img.loading = lazy ? 'lazy' : 'eager';
    img.src = p.thumb || (p.n + '/thumb.png');
    return img;
  }
  function ratio(p) {
    if (p.n === 795) return .625;
    if (p.n === 796) return .594;
    const ratios = [1, .79, 1.12, .92, 1, .85, 1.18];
    return ratios[(Math.imul(p.n, 2654435761) >>> 0) % ratios.length];
  }
  function take(lane) {
    const p = lane.items[lane.cursor % lane.items.length];
    lane.cursor++;
    const tile = element('a', 'tile');
    tile.href = p.n + '/';
    tile.setAttribute('aria-label', 'Piece ' + p.n + ': ' + p.title);
    tile.tabIndex = -1;
    const h = Math.round(lane.width * ratio(p));
    tile.style.height = h + 'px';
    const img = thumbnail(p, false);
    img.addEventListener('error', () => tile.classList.add('broken'), {once:true});
    const label = element('span','tile-label');
    label.setAttribute('aria-hidden','true');
    label.append(element('strong','',p.title), element('small','','№' + p.n));
    tile.append(img, label);
    return {el:tile,h:h+GAP};
  }
  function append(lane) {
    const card = take(lane);
    lane.cards.push(card);
    lane.track.append(card.el);
    lane.total += card.h;
  }
  function prepend(lane) {
    const card = take(lane);
    lane.cards.unshift(card);
    lane.track.prepend(card.el);
    lane.total += card.h;
    lane.y -= card.h;
  }
  function dropFirst(lane) {
    const card = lane.cards.shift();
    card.el.remove();
    lane.total -= card.h;
    lane.y += card.h;
  }
  function dropLast(lane) {
    const card = lane.cards.pop();
    card.el.remove();
    lane.total -= card.h;
  }
  function buffer(lane) { return Math.max(180, lane.width * 1.25); }
  function fill(lane) {
    const pad = buffer(lane);
    if (lane.direction < 0) {
      while (lane.cards.length > 1 && lane.y + lane.cards[0].h < -pad) dropFirst(lane);
      while (lane.y + lane.total < wallHeight + pad) append(lane);
    } else {
      while (lane.y > -pad) prepend(lane);
      while (lane.cards.length > 1 && lane.y + lane.total - lane.cards[lane.cards.length-1].h > wallHeight + pad) dropLast(lane);
      while (lane.y + lane.total < wallHeight + pad) append(lane);
    }
  }
  function paint(lane) {
    lane.track.style.transform = 'translate3d(0,' + lane.y.toFixed(2) + 'px,0)';
    let y = lane.y;
    for (const card of lane.cards) {
      const height = card.h - GAP;
      const visible = Math.min(y + height, wallHeight) - Math.max(y, 0);
      const tab = visible >= Math.min(height * .65, wallHeight * .65) ? 0 : -1;
      if (card.el.tabIndex !== tab) card.el.tabIndex = tab;
      y += card.h;
    }
  }
  function isHeld(lane) {
    return lane.el.contains(document.activeElement) || (finePointer.matches && lane.hover);
  }
  function tick(now) {
    frame = 0;
    if (view !== 'wall' || paused || document.hidden) { last = 0; return; }
    const dt = last ? Math.min((now-last)/1000,.05) : 0;
    last = now;
    for (const lane of lanes) {
      if (!isHeld(lane)) {
        lane.y += lane.direction * lane.speed * dt;
        fill(lane);
        paint(lane);
      }
    }
    frame = requestAnimationFrame(tick);
  }
  function syncAnimation() {
    if (frame) cancelAnimationFrame(frame);
    frame = 0; last = 0;
    if (view === 'wall' && !paused && !document.hidden && lanes.length) frame = requestAnimationFrame(tick);
    motion.setAttribute('aria-label', paused ? 'Play gallery' : 'Pause gallery');
    $('motion-label').textContent = paused ? 'Play' : 'Pause';
    $('motion-icon').setAttribute('d', paused ? 'M5 2.5 13 8l-8 5.5z' : 'M4 3h2.5v10H4zm5.5 0H12v10H9.5z');
  }
  function columnCount(w) {
    return Math.min(all.length, w < 520 ? 2 : w < 760 ? 3 : w < 1080 ? 4 : w < 1450 ? 5 : 6);
  }
  function buildWall() {
    if (!all.length || view !== 'wall') return;
    const w = wall.clientWidth, h = wall.clientHeight;
    if (!w || !h) return;
    const count = columnCount(w);
    if (lanes.length === count && Math.abs(w-lastWidth) < 2) {
      wallHeight = h;
      for (const lane of lanes) { fill(lane); paint(lane); }
      return;
    }
    lastWidth = w; wallHeight = h;
    wall.style.setProperty('--columns', count);
    wall.replaceChildren();
    lanes = [];
    const width = (w - (count-1)*GAP)/count;
    const newest = all.slice().sort((a,b) => b.n-a.n);
    for (let i=0;i<count;i++) {
      const el = element('div','lane'), track = element('div','track');
      el.append(track);
      wall.append(el);
      const lane = {
        el, track, width, items:newest.filter((_,j) => j%count===i), cursor:0,
        cards:[], total:0, y:-width*(.24+((i*37)%67)/100),
        direction:i%2===0 ? -1 : 1, speed:Math.max(15, Math.min(30,width*.085))*(1+(i%3)*.09), hover:false
      };
      el.addEventListener('pointerenter', () => {lane.hover=true;});
      el.addEventListener('pointerleave', () => {lane.hover=false;});
      // Fill downward first so the newest pieces are visible in every lane.
      while (lane.y + lane.total < wallHeight + buffer(lane)) append(lane);
      fill(lane); paint(lane);
      lanes.push(lane);
    }
    syncAnimation();
  }
  function scheduleResize() {
    if (resizeFrame) cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {resizeFrame=0; buildWall();});
  }

  function indexCard(p) {
    const section = element('article','index-piece');
    const a = element('a');
    a.href = p.n + '/';
    const h = element('h3');
    h.append(element('span','num','№'+p.n), document.createTextNode(' · '+p.title));
    a.append(thumbnail(p,true),h);
    const time = element('time','',dateFor(p.n));
    time.dateTime = new Date(DATE_BASE+(p.n-1)*86400000).toISOString().slice(0,10);
    section.append(a,time);
    if (p.note) section.append(element('p','',p.note));
    return section;
  }
  function renderBatch() {
    const frag = document.createDocumentFragment();
    const end = Math.min(shown+BATCH, ordered.length);
    for (;shown<end;shown++) frag.append(indexCard(ordered[shown]));
    $('pieces').append(frag);
    $('more').hidden = shown>=ordered.length;
    $('index-end').hidden = !ordered.length || shown<ordered.length;
    if (shown<ordered.length) $('more').textContent='Load more ('+(ordered.length-shown)+' remaining)';
  }
  function resetIndex() {
    ordered=all.slice();
    if(sort==='newest') ordered.sort((a,b)=>b.n-a.n);
    else if(sort==='oldest') ordered.sort((a,b)=>a.n-b.n);
    else ordered.sort((a,b)=>a.title.localeCompare(b.title)||a.n-b.n);
    shown=0; $('pieces').replaceChildren(); renderBatch(); indexReady=true;
  }
  function setView(next) {
    if (view===next) return;
    view=next;
    shell.classList.toggle('wall-mode',view==='wall');
    wallView.hidden=view!=='wall'; indexView.hidden=view!=='index'; motion.hidden=view!=='wall';
    $('wall-button').setAttribute('aria-pressed',String(view==='wall'));
    $('index-button').setAttribute('aria-pressed',String(view==='index'));
    if (view==='index' && !indexReady && all.length) resetIndex();
    window.scrollTo(0,0);
    if (view==='wall') scheduleResize();
    syncAnimation();
  }
  $('wall-button').addEventListener('click',()=>setView('wall'));
  $('index-button').addEventListener('click',()=>setView('index'));
  motion.addEventListener('click',()=>{paused=!paused;syncAnimation();});
  reduced.addEventListener('change',event=>{if(event.matches){paused=true;syncAnimation();}});
  document.addEventListener('visibilitychange',syncAnimation);
  document.querySelectorAll('.sort button').forEach(btn=>btn.addEventListener('click',()=>{
    if(btn.dataset.sort===sort)return;
    sort=btn.dataset.sort;
    document.querySelectorAll('.sort button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
    if(all.length) resetIndex();
  }));
  $('more').addEventListener('click',renderBatch);
  if('ResizeObserver' in window) new ResizeObserver(scheduleResize).observe(wall);
  else window.addEventListener('resize',scheduleResize);
  syncAnimation();
  fetch('pieces.json')
    .then(r=>{if(!r.ok)throw new Error('Collection unavailable');return r.json();})
    .then(data=>{
      if(!Array.isArray(data)||!data.length)throw new Error('Empty collection');
      all=data;
      $('count').textContent=all.length.toLocaleString()+' pieces · drawn with code';
      $('status').hidden=true; wall.hidden=false;
      if(view==='index')resetIndex();else scheduleResize();
    })
    .catch(()=>{
      const status=$('status');
      status.replaceChildren(document.createTextNode('The collection could not be loaded.'),element('br'));
      const retry=element('button','','Try again');retry.type='button';retry.addEventListener('click',()=>location.reload());
      status.append(retry);
      const error=element('p','status','The collection could not be loaded. Return to Wall to retry.');
      $('pieces').replaceChildren(error);
    });
})();
</script>
</body>
</html>
