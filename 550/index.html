<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Views</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F2A0C0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  // INK is the black of the gutters and outlines.
  var PINK = '#F2A0C0', YELLOW = '#FFD400', FOLIAGE = '#2A5BD7',
      TOWER = '#1B3FCE', INK = '#111111';

  var PHASE0 = 2.0;   // constant first-frame phase: initial set, no wipe in flight
  var TICK = 6;       // seconds between panel swaps
  var WIPE_T = 0.4;   // flat wipe duration

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(550066);

  // ---- vignette grammar ----
  var READER = 0, DOG = 1, SMOKER = 2, KID = 3, ARGUE = 4, PIGEON = 5;
  var SCENE_NAMES = ['seated reader', 'dog', 'smoker on a bench',
                     'kid with a balloon', 'couple arguing', 'pigeon close-up'];

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Initial composed set: the six scenes dealt once across the six panels.
  // Panel order: 0,1,2 = left column top to bottom; 3,4,5 = right column.
  var INIT = shuffled([0, 1, 2, 3, 4, 5]);

  // Swap schedule, precomputed from the same seed stream so the whole
  // piece is a pure function of t. Panels change in a shuffled round
  // robin; the incoming scene is the one absent longest (ties broken by
  // the seed), so the sequence feels composed, not random.
  var EVENTS = [];
  (function buildSchedule() {
    var cur = INIT.slice();
    var lastShown = [0, 0, 0, 0, 0, 0];
    var order = shuffled([0, 1, 2, 3, 4, 5]);
    var oi = 0;
    for (var e = 0; e < 120; e++) {
      var time = (e + 1) * TICK;
      var panel = order[oi]; oi++;
      if (oi >= 6) { order = shuffled([0, 1, 2, 3, 4, 5]); oi = 0; }
      var best = Infinity, cand = [];
      for (var s = 0; s < 6; s++) {
        if (s === cur[panel]) continue;
        if (lastShown[s] < best) { best = lastShown[s]; cand = [s]; }
        else if (lastShown[s] === best) cand.push(s);
      }
      var to = cand[Math.floor(rng() * cand.length)];
      EVENTS.push({ time: time, panel: panel, to: to });
      cur[panel] = to;
      lastShown[to] = time;
    }
  })();

  function assignmentAt(t) {
    var cur = INIT.slice();
    var wipe = null;
    for (var i = 0; i < EVENTS.length; i++) {
      var ev = EVENTS[i];
      if (t >= ev.time + WIPE_T) { cur[ev.panel] = ev.to; }
      else if (t >= ev.time) {
        wipe = { panel: ev.panel, from: cur[ev.panel], to: ev.to,
                 p: (t - ev.time) / WIPE_T };
        break;
      } else break;
    }
    return { cur: cur, wipe: wipe };
  }

  // ---- layout (1080 x 1080 design space) ----
  var M = 30, G = 16;
  var IN_X = M, IN_Y = M, IN_W = 1080 - 2 * M, IN_H = 1080 - 2 * M;
  var FRACS = [0.10, 0.28, 0.24, 0.28, 0.10];
  var COL_X = [], COL_W = [];
  (function layout() {
    var avail = IN_W - 4 * G;
    var x = IN_X;
    for (var i = 0; i < 5; i++) {
      COL_W.push(avail * FRACS[i]);
      COL_X.push(x);
      x += COL_W[i] + G;
    }
  })();
  var PINK_H = (IN_H - 2 * G) / 3;
  function pinkRect(col, row) {
    return { x: COL_X[col], y: IN_Y + row * (PINK_H + G), w: COL_W[col], h: PINK_H };
  }
  var TOWER_RECT = { x: COL_X[2], y: IN_Y, w: COL_W[2], h: IN_H };
  var FLOWER_L = { x: COL_X[0], y: IN_Y, w: COL_W[0], h: IN_H };
  var FLOWER_R = { x: COL_X[4], y: IN_Y, w: COL_W[4], h: IN_H };

  // ---- small canvas helpers ----
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fillStroke(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
  }
  function line(x1, y1, x2, y2, color, lw) {
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  // ---- shared street dressing, in pink-panel local space (268 x 329) ----
  function foliage(cx, cy, r) {
    var offs = [[0, 0], [-0.72, 0.28], [0.72, 0.28], [-0.38, -0.5], [0.42, -0.46]];
    for (var i = 0; i < offs.length; i++) {
      circ(cx + offs[i][0] * r, cy + offs[i][1] * r, r * 0.58);
      fillStroke(FOLIAGE, 4.5);
    }
  }
  function groundLine() { line(18, 284, 250, 284, INK, 5); }
  function bench(cx) {
    line(cx - 82, 196, cx + 82, 196, INK, 6);
    line(cx - 76, 196, cx - 76, 254, INK, 6);
    line(cx + 76, 196, cx + 76, 254, INK, 6);
    line(cx - 88, 254, cx + 88, 254, INK, 7);
    line(cx - 80, 254, cx - 80, 284, INK, 6);
    line(cx + 80, 254, cx + 80, 284, INK, 6);
  }
  // A seated figure, centred at cx, seat height 254, flat colour throughout.
  function seatedFigure(cx, color) {
    rr(cx - 11, 238, 9, 46, 4); fillStroke(color, 4.5);   // legs
    rr(cx + 4, 238, 9, 46, 4); fillStroke(color, 4.5);
    rr(cx - 19, 184, 38, 60, 9); fillStroke(color, 5);    // torso
    circ(cx, 164, 17); fillStroke(color, 5);              // head
  }

  // ---- the six vignettes, drawn in 268 x 329 local space ----
  function sceneReader() {
    foliage(50, 62, 32); foliage(224, 56, 27);
    bench(134);
    seatedFigure(134, YELLOW);
    line(122, 206, 108, 228, YELLOW, 9);                 // arms to the book
    line(146, 206, 160, 228, YELLOW, 9);
    ctx.beginPath();                                     // book cover
    ctx.moveTo(134, 216); ctx.lineTo(102, 224); ctx.lineTo(102, 248); ctx.lineTo(134, 240);
    ctx.lineTo(166, 248); ctx.lineTo(166, 224); ctx.closePath();
    fillStroke(TOWER, 4.5);
    ctx.beginPath();                                     // pages
    ctx.moveTo(134, 221); ctx.lineTo(108, 228); ctx.lineTo(108, 243); ctx.lineTo(134, 236);
    ctx.lineTo(160, 243); ctx.lineTo(160, 228); ctx.closePath();
    fillStroke(PINK, 3.5);
    groundLine();
  }

  function sceneDog() {
    foliage(48, 60, 29); foliage(226, 66, 33);
    groundLine();
    ctx.save();
    ctx.translate(138, 238);
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-48, -12); ctx.quadraticCurveTo(-66, -34, -54, -52); ctx.stroke();
    rr(-38, 22, 10, 24, 4); fillStroke(YELLOW, 4.5);     // legs
    rr(20, 22, 10, 24, 4); fillStroke(YELLOW, 4.5);
    ell(0, 0, 54, 31); fillStroke(YELLOW, 5.5);          // body
    ell(10, 12, 34, 17); fillStroke(YELLOW, 4);          // haunch shading shape
    ctx.beginPath();                                     // collar
    ctx.arc(34, -22, 17, 0.5, 1.9); ctx.strokeStyle = TOWER; ctx.lineWidth = 7; ctx.stroke();
    circ(48, -28, 23); fillStroke(YELLOW, 5.5);          // head
    ctx.save(); ctx.translate(38, -38); ctx.rotate(0.5);
    ell(0, 0, 9, 17); fillStroke(FOLIAGE, 4.5);          // ear
    ctx.restore();
    ell(66, -21, 13, 9); fillStroke(YELLOW, 4.5);        // snout
    circ(52, -33, 3.6); ctx.fillStyle = INK; ctx.fill(); // eye
    ctx.restore();
  }

  function sceneSmoker() {
    foliage(222, 58, 29); foliage(46, 72, 25);
    bench(128);
    seatedFigure(128, FOLIAGE);
    line(142, 202, 172, 168, FOLIAGE, 9);                // raised arm
    line(168, 170, 178, 160, INK, 4);                    // cigarette
    circ(180, 158, 4.5); fillStroke(YELLOW, 3);          // lit tip
    ctx.strokeStyle = TOWER; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();                                     // smoke curl
    ctx.moveTo(182, 148);
    ctx.quadraticCurveTo(168, 128, 182, 110);
    ctx.quadraticCurveTo(196, 92, 182, 74);
    ctx.quadraticCurveTo(172, 60, 180, 44);
    ctx.stroke();
    groundLine();
  }

  function sceneKid() {
    foliage(46, 58, 28); foliage(226, 64, 31);
    groundLine();
    line(150, 158, 169, 100, INK, 2.5);                  // balloon string
    ell(173, 64, 31, 39); fillStroke(YELLOW, 5);         // balloon
    ctx.beginPath();
    ctx.moveTo(164, 100); ctx.lineTo(182, 100); ctx.lineTo(173, 112);
    ctx.closePath(); fillStroke(YELLOW, 4);
    rr(97, 232, 10, 52, 4); fillStroke(FOLIAGE, 4.5);    // legs
    rr(112, 232, 10, 52, 4); fillStroke(FOLIAGE, 4.5);
    rr(91, 188, 38, 48, 9); fillStroke(FOLIAGE, 5);      // torso
    line(124, 198, 150, 158, FOLIAGE, 9);                // arm up to the string
    line(96, 200, 84, 228, FOLIAGE, 9);
    circ(110, 168, 16); fillStroke(FOLIAGE, 5);          // head
  }

  function bubble(x, y, w, h, tailX, tailY, text) {
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(x + w * 0.32, y + h);
    ctx.lineTo(x + w * 0.62, y + h);
    ctx.closePath(); fillStroke(YELLOW, 4);
    rr(x, y, w, h, 13); fillStroke(YELLOW, 4.5);
    ctx.fillStyle = INK;
    ctx.font = '700 30px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2 + 2);
  }
  function standingFigure(cx, color, flip) {
    rr(cx - 12, 244, 9, 40, 4); fillStroke(color, 4.5);
    rr(cx + 4, 244, 9, 40, 4); fillStroke(color, 4.5);
    rr(cx - 19, 190, 38, 58, 9); fillStroke(color, 5);
    line(cx + flip * 17, 204, cx + flip * 30, 230, color, 8);
    line(cx - flip * 17, 204, cx - flip * 24, 232, color, 8);
    circ(cx, 172, 16); fillStroke(color, 5);
  }
  function sceneArgue() {
    foliage(34, 40, 20); foliage(238, 40, 20);
    groundLine();
    standingFigure(76, YELLOW, 1);
    standingFigure(194, FOLIAGE, -1);
    bubble(14, 14, 80, 38, 66, 92, '...');
    bubble(174, 58, 80, 38, 200, 138, '?!');
    bubble(18, 102, 80, 38, 72, 162, '...');
  }

  function scenePigeon() {
    foliage(38, 46, 22); foliage(234, 42, 20);
    groundLine();
    ctx.beginPath();                                     // tail feathers
    ctx.moveTo(52, 168); ctx.lineTo(14, 138); ctx.lineTo(26, 196); ctx.lineTo(58, 208);
    ctx.closePath(); fillStroke(TOWER, 5);
    ctx.beginPath();
    ctx.moveTo(60, 196); ctx.lineTo(24, 190); ctx.lineTo(38, 232); ctx.lineTo(72, 224);
    ctx.closePath(); fillStroke(TOWER, 5);
    ell(126, 198, 102, 76); fillStroke(FOLIAGE, 6);      // body
    ctx.save();                                          // wing
    ctx.translate(112, 196); ctx.rotate(-0.25);
    ell(0, 0, 62, 38);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 2, 40, 22, 0, 0.3, Math.PI - 0.3); ctx.stroke();
    ctx.restore();
    circ(198, 108, 45); fillStroke(TOWER, 6);            // head
    ctx.beginPath();                                     // beak
    ctx.moveTo(234, 96); ctx.lineTo(266, 110); ctx.lineTo(234, 126);
    ctx.closePath(); fillStroke(YELLOW, 4.5);
    circ(210, 98, 10); fillStroke(PINK, 3.5);            // eye ring
    circ(210, 98, 5); ctx.fillStyle = INK; ctx.fill();   // eye
    line(104, 272, 104, 284, INK, 5);                    // feet on the line
    line(148, 272, 148, 284, INK, 5);
  }

  var SCENES = [sceneReader, sceneDog, sceneSmoker, sceneKid, sceneArgue, scenePigeon];

  // ---- panel painters ----
  function drawPinkPanel(r, sceneIdx, wipe) {
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
    paintScene(r, sceneIdx);
    if (wipe) {
      ctx.save();
      ctx.beginPath(); ctx.rect(r.x, r.y, r.w * wipe.p, r.h); ctx.clip();
      paintScene(r, wipe.to);
      ctx.restore();
      line(r.x + r.w * wipe.p, r.y, r.x + r.w * wipe.p, r.y + r.h, INK, 5);
    }
    ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
  }
  function paintScene(r, sceneIdx) {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.scale(r.w / 268, r.h / 329);
    ctx.beginPath(); ctx.rect(0, 0, 268, 329); ctx.clip();
    ctx.fillStyle = PINK; ctx.fillRect(0, 0, 268, 329);
    ctx.lineJoin = 'round';
    SCENES[sceneIdx]();
    ctx.restore();
  }

  function drawTower(r) {
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
    ctx.translate(r.x, r.y);
    var w = r.w, h = r.h, cx = w / 2;
    ctx.fillStyle = YELLOW; ctx.fillRect(0, 0, w, h);
    ctx.lineJoin = 'round';
    // bushes at the base
    var bushOffs = [[0, 0], [-0.72, 0.28], [0.72, 0.28], [-0.38, -0.5], [0.42, -0.46]];
    function bush(bx, by, br) {
      for (var i = 0; i < bushOffs.length; i++) {
        circ(bx + bushOffs[i][0] * br, by + bushOffs[i][1] * br, br * 0.58);
        fillStroke(FOLIAGE, 4.5);
      }
    }
    // base building
    rr(w * 0.08, h * 0.885, w * 0.84, h * 0.115, 4); fillStroke(TOWER, 5);
    rr(cx - w * 0.055, h * 0.925, w * 0.11, h * 0.075, 3); fillStroke(PINK, 4);
    bush(w * 0.09, h * 0.965, w * 0.10);
    bush(w * 0.91, h * 0.965, w * 0.10);
    // shaft
    ctx.fillStyle = TOWER;
    ctx.fillRect(cx - w * 0.23, h * 0.30, w * 0.46, h * 0.585);
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.strokeRect(cx - w * 0.23, h * 0.30, w * 0.46, h * 0.585);
    // shaft windows
    for (var row = 0; row < 5; row++) {
      for (var col = 0; col < 2; col++) {
        var wx = cx + (col === 0 ? -0.145 : 0.075) * w;
        var wy = h * (0.345 + row * 0.105);
        ctx.fillStyle = YELLOW; ctx.fillRect(wx, wy, w * 0.07, h * 0.045);
        ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.strokeRect(wx, wy, w * 0.07, h * 0.045);
      }
    }
    // clock block
    rr(cx - w * 0.30, h * 0.175, w * 0.60, h * 0.125, 4); fillStroke(TOWER, 5);
    circ(cx, h * 0.2375, w * 0.155); fillStroke(YELLOW, 5);
    line(cx, h * 0.2375, cx, h * 0.2375 - w * 0.10, INK, 5);
    line(cx, h * 0.2375, cx + w * 0.085, h * 0.2375 + w * 0.05, INK, 5);
    circ(cx, h * 0.2375, w * 0.02); ctx.fillStyle = INK; ctx.fill();
    // dome and spire
    ctx.beginPath(); ctx.arc(cx, h * 0.175, w * 0.30, Math.PI, 0); ctx.closePath();
    fillStroke(FOLIAGE, 5);
    line(cx, h * 0.175 - w * 0.30, cx, h * 0.175 - w * 0.30 - h * 0.045, INK, 5);
    circ(cx, h * 0.175 - w * 0.30 - h * 0.055, w * 0.035); fillStroke(TOWER, 4);
    ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
  }

  function drawFlowerPanel(r) {
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
    ctx.translate(r.x, r.y);
    var w = r.w, h = r.h;
    ctx.fillStyle = TOWER; ctx.fillRect(0, 0, w, h);
    ctx.lineJoin = 'round';
    function flower(cx, cy, R, stemLen) {
      line(cx, cy + R * 0.5, cx, cy + R * 0.5 + stemLen, FOLIAGE, 6);
      ctx.save(); ctx.translate(cx - R * 0.36, cy + R * 0.5 + stemLen * 0.55); ctx.rotate(-0.6);
      ell(0, 0, R * 0.30, R * 0.15); fillStroke(FOLIAGE, 4);
      ctx.restore();
      for (var k = 0; k < 8; k++) {
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(k * Math.PI / 4);
        ell(0, -R * 0.60, R * 0.33, R * 0.60); fillStroke(YELLOW, 4.5);
        ctx.restore();
      }
      circ(cx, cy, R * 0.34); fillStroke(PINK, 4.5);
    }
    flower(w * 0.5, h * 0.20, w * 0.30, h * 0.16);
    flower(w * 0.5, h * 0.62, w * 0.235, h * 0.14);
    ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PINK;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);
    ctx.lineJoin = 'round';

    // black gutter base
    ctx.fillStyle = INK;
    ctx.fillRect(IN_X - 6, IN_Y - 6, IN_W + 12, IN_H + 12);

    drawFlowerPanel(FLOWER_L);
    drawFlowerPanel(FLOWER_R);
    drawTower(TOWER_RECT);

    var st = assignmentAt(t);
    var panels = [pinkRect(1, 0), pinkRect(1, 1), pinkRect(1, 2),
                  pinkRect(3, 0), pinkRect(3, 1), pinkRect(3, 2)];
    for (var i = 0; i < 6; i++) {
      if (st.wipe && st.wipe.panel === i) {
        drawPinkPanel(panels[i], st.wipe.from, st.wipe);
      } else {
        drawPinkPanel(panels[i], st.cur[i], null);
      }
    }

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is pink) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      S = W;
      OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H);
      OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
