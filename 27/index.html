<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№27 · Moons</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b10; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(240,238,230,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.85); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another moons</div>
<script>
'use strict';
// No27 Moons.
// A grid of moons, one per cell, each drawn as a full disc cut by an
// offset shadow disc in the page's own black, so only a crescent or
// a gibbous sliver survives. The phase advances across each row and
// the rows are offset by a seeded amount, so the grid runs through
// the whole cycle several times, waxing one way and waning back.
// The shadow always comes from the same side, like one sun for the
// whole sky. Cream moons on near-black.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '27', 10) || 27;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0b0b10';

function compose(s) {
  const rnd = mulberry32(s);
  return {
    rowShift: rnd(),
    start: rnd(),
    sun: (rnd() - 0.5) * 0.9        // shadow direction tilt, radians
  };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h) * 0.94;
  const ox = (w - S) / 2, oy = (h - S) / 2;
  const COLS = 9, ROWS = 9;
  const cell = S / COLS, cellY = S / ROWS;
  const r = Math.min(cell, cellY) * 0.34;
  const sdx = Math.cos(p.sun), sdy = Math.sin(p.sun);

  for (let j = 0; j < ROWS; j++) {
    for (let i = 0; i < COLS; i++) {
      const phase = ((p.start + (i + j * p.rowShift) / COLS) % 1 + 1) % 1;   // 0..1 cycle
      const cx = ox + (i + 0.5) * cell, cy = oy + (j + 0.5) * cellY;
      // shadow offset: 0 at full moon, 2r at new moon
      const off = Math.abs(phase * 2 - 1) * r * 1.92;
      const dirSign = phase < 0.5 ? 1 : -1;
      ctx.fillStyle = '#efe9d8';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = GROUND;
      ctx.beginPath();
      ctx.arc(cx + sdx * off * dirSign, cy + sdy * off * dirSign, r * 0.98, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
