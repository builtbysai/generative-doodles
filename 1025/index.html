<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Body the Lights Agree On</title>
<style>
  html, body { margin: 0; padding: 0; background: #060607; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var TAU = Math.PI * 2;
  var LOOP = 45;            // seamless loop length, seconds
  var T0 = 8;               // frame one: fixed piece time, seconds
  var BASE_SEED = 1025186;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, PHONE = false;

  function fit() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(50, Math.floor(w));
    H = Math.max(50, Math.floor(h));
    canvas.width = W;
    canvas.height = H;
    var sw = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height) : 0;
    PHONE = sw ? (sw < 700) : (H > W * 1.15);
  }
  fit();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(currentT); });
  }
  window.addEventListener('resize', function () { fit(); draw(currentT); });

  // ---------- the constellation: constant local points, one rigid transform ----------
  var locals = [];   // seven points, local space, NEVER mutated after build
  var hull = [];     // indices, CCW hull of locals
  var edges = [];    // fixed edge set: hull cycle + chords + interior spokes

  function cross(o, a, b) { return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); }

  function buildBody(seed) {
    var rnd = mulberry32(seed);
    locals = [];
    // seven points at seeded angles and radii: varied, spread, one near the middle
    var baseA = rnd() * TAU;
    for (var i = 0; i < 6; i++) {
      var ang = baseA + (i / 6) * TAU + (rnd() - 0.5) * 0.55;
      var rad = 0.34 + rnd() * 0.16;                 // 0.34 .. 0.50
      locals.push({ x: Math.cos(ang) * rad, y: Math.sin(ang) * rad });
    }
    locals.push({ x: (rnd() - 0.5) * 0.22, y: (rnd() - 0.5) * 0.22 });
    // normalize: largest radius exactly 0.5 so the body fills the view the same at any seed
    var mx = 0, i2;
    for (i2 = 0; i2 < 7; i2++) { var r = Math.hypot(locals[i2].x, locals[i2].y); if (r > mx) mx = r; }
    var k = 0.5 / mx;
    for (i2 = 0; i2 < 7; i2++) { locals[i2].x *= k; locals[i2].y *= k; }

    // monotone chain hull (indices)
    var idx = [0, 1, 2, 3, 4, 5, 6].sort(function (a, b) {
      return locals[a].x - locals[b].x || locals[a].y - locals[b].y;
    });
    var lower = [], upper = [], j, t2;
    for (j = 0; j < idx.length; j++) {
      t2 = idx[j];
      while (lower.length >= 2 && cross(locals[lower[lower.length - 2]], locals[lower[lower.length - 1]], locals[t2]) <= 0) lower.pop();
      lower.push(t2);
    }
    for (j = idx.length - 1; j >= 0; j--) {
      t2 = idx[j];
      while (upper.length >= 2 && cross(locals[upper[upper.length - 2]], locals[upper[upper.length - 1]], locals[t2]) <= 0) upper.pop();
      upper.push(t2);
    }
    lower.pop(); upper.pop();
    hull = lower.concat(upper);

    // fixed edges: hull cycle, hull chords (i to i+2), interior spokes
    var seen = {};
    edges = [];
    function addEdge(a, b) {
      if (a === b) return;
      var key = a < b ? a + '_' + b : b + '_' + a;
      if (seen[key]) return;
      seen[key] = 1;
      edges.push([a, b]);
    }
    var hn = hull.length;
    for (j = 0; j < hn; j++) {
      addEdge(hull[j], hull[(j + 1) % hn]);
      addEdge(hull[j], hull[(j + 2) % hn]);
    }
    var onHull = {};
    for (j = 0; j < hn; j++) onHull[hull[j]] = 1;
    for (j = 0; j < 7; j++) {
      if (!onHull[j]) {
        // interior point: spoke to its two nearest hull vertices and to the farthest
        var ds = hull.map(function (hv) {
          return { hv: hv, d: Math.hypot(locals[hv].x - locals[j].x, locals[hv].y - locals[j].y) };
        }).sort(function (a, b) { return a.d - b.d; });
        addEdge(j, ds[0].hv);
        addEdge(j, ds[1].hv);
        addEdge(j, ds[ds.length - 1].hv);
      }
    }
  }
  buildBody(BASE_SEED);

  // ---------- rigid transform: closed form in t, plus a spring drag offset ----------
  var dragOff = { ang: 0, x: 0, y: 0, vang: 0, vx: 0, vy: 0 };
  var dragging = false;
  var dragTarget = { ang: 0, x: 0, y: 0 };

  function baseTransform(t) {
    var ph = TAU * t / LOOP;
    return {
      ang: 0.55 * Math.sin(ph) + 0.18 * Math.sin(2 * ph + 1.1),
      cx: 0.5 + 0.028 * Math.sin(ph + 0.7),
      cy: 0.5 + 0.024 * Math.sin(2 * ph + 2.0),
      dang: 0.55 * (TAU / LOOP) * Math.cos(ph) + 0.36 * (TAU / LOOP) * Math.cos(2 * ph + 1.1)
    };
  }

  function springDrag(dt) {
    // spring the drag offset toward its target (pointer while dragging, zero after release)
    var K = dragging ? 60 : 14, D = dragging ? 14 : 6.2;
    function step(cur, vel, tgt) {
      var f = (tgt - cur) * K - vel * D;
      vel += f * dt;
      cur += vel * dt;
      return [cur, vel];
    }
    var r;
    r = step(dragOff.ang, dragOff.vang, dragTarget.ang); dragOff.ang = r[0]; dragOff.vang = r[1];
    r = step(dragOff.x, dragOff.vx, dragTarget.x); dragOff.x = r[0]; dragOff.vx = r[1];
    r = step(dragOff.y, dragOff.vy, dragTarget.y); dragOff.y = r[0]; dragOff.vy = r[1];
  }

  // ---------- marker ghost envelope: dim to near invisible mid loop ----------
  function smooth(a, b, x) {
    var u = (x - a) / (b - a);
    u = u < 0 ? 0 : (u > 1 ? 1 : u);
    return u * u * (3 - 2 * u);
  }
  function markerFactor(t) {
    var tt = ((t % LOOP) + LOOP) % LOOP;
    var down = smooth(20, 22.5, tt);       // 0 before 20, 1 after 22.5
    var up = smooth(27.5, 30, tt);         // returns between 27.5 and 30
    var ghost = down * (1 - up);
    return 1 - ghost * (1 - 0.067);        // 0.06 alpha / 0.9 base = 0.067
  }

  // ---------- projection washes, evaluated in frame local space ----------
  var tapTimes = [];   // relight taps: each spawns one extra sweep

  function sweepPos(t) { return -0.85 + 1.7 * ((t % 15) / 15); }

  function drawBand(cx, cy, S, totalAng, pos, strength) {
    // layered flat alpha strips, perpendicular to local x, rotated by a fixed local lean
    var lean = -0.55;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(totalAng + lean);
    ctx.scale(S, S);
    var layers = [
      [0.46, 0.05], [0.34, 0.08], [0.24, 0.12], [0.15, 0.18], [0.07, 0.26]
    ];
    ctx.fillStyle = '#F4F6FF';
    for (var i = 0; i < layers.length; i++) {
      ctx.globalAlpha = layers[i][1] * strength;
      ctx.fillRect(pos - layers[i][0] / 2, -0.95, layers[i][0], 1.9);
    }
    ctx.restore();
  }

  function drawPool(lx, ly, r, strength) {
    // concentric flat alpha discs, drawn in local space by the caller transform
    var n = 6, i;
    ctx.fillStyle = '#FFB545';
    for (i = n; i >= 1; i--) {
      ctx.globalAlpha = 0.05 * strength;
      ctx.beginPath();
      ctx.arc(lx, ly, r * i / n, 0, TAU);
      ctx.fill();
    }
  }

  function draw(t) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#060607';
    ctx.fillRect(0, 0, W, H);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var bt = baseTransform(t);
    var S = (PHONE ? 0.88 : 0.92) * Math.min(W, H);
    var cx = (bt.cx + dragOff.x) * W;
    var cy = (bt.cy + dragOff.y) * H;
    var ang = bt.ang + dragOff.ang;
    var ca = Math.cos(ang), sa = Math.sin(ang);

    function toWorld(p) {
      return { x: cx + S * (p.x * ca - p.y * sa), y: cy + S * (p.x * sa + p.y * ca) };
    }
    var world = locals.map(toWorld);

    // hull path
    function hullPath() {
      ctx.beginPath();
      for (var i = 0; i < hull.length; i++) {
        var p = world[hull[i]];
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
    }

    // frame body: faint filled implication of the rigid body
    hullPath();
    ctx.fillStyle = '#2A2D36';
    ctx.globalAlpha = 0.42;
    ctx.fill();

    // the light, clipped to the body it agrees on
    ctx.save();
    hullPath();
    ctx.clip();

    // amber pools drift inside the frame local space
    var ph2 = TAU * t / 22.5;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.scale(S, S);
    drawPool(0.26 * Math.sin(ph2 + 1.3), 0.22 * Math.cos(ph2 * 0.999 + 0.4), 0.20, 1);
    drawPool(0.24 * Math.sin(ph2 * 0.5 + 4.2), 0.26 * Math.sin(ph2 * 0.5 + 2.1), 0.15, 0.8);
    ctx.restore();

    // cool white sweeps cross the frame
    drawBand(cx, cy, S, ang, sweepPos(t), 1);
    for (var ti = 0; ti < tapTimes.length; ti++) {
      var age = t - tapTimes[ti];
      if (age >= 0 && age < 6) {
        var env = Math.sin(Math.PI * age / 6);
        drawBand(cx, cy, S, ang, -0.85 + 1.7 * (age / 6), env);
      }
    }
    ctx.restore();

    // frame lines: the implication, faint
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = '#2A2D36';
    ctx.lineWidth = PHONE ? 1.2 : 1.5;
    ctx.beginPath();
    for (var e = 0; e < edges.length; e++) {
      var a = world[edges[e][0]], b = world[edges[e][1]];
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();

    // markers: small, dim, honest infra-red red; the truth, not the show
    var mf = markerFactor(t);
    var mr = PHONE ? 3.6 : 3;
    for (var m = 0; m < 7; m++) {
      var p2 = world[m];
      ctx.globalAlpha = 0.16 * mf;
      ctx.fillStyle = '#FF2E2E';
      ctx.beginPath();
      ctx.arc(p2.x, p2.y, mr * 2.4, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 0.9 * mf;
      ctx.beginPath();
      ctx.arc(p2.x, p2.y, mr, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- time: frame one is the fixed offset, never a wall clock ----------
  var currentT = T0;
  draw(currentT);

  var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var lastStamp = startStamp;
  function frame(now) {
    var dt = Math.min(0.05, Math.max(0.001, (now - lastStamp) / 1000));
    lastStamp = now;
    currentT = T0 + (now - startStamp) / 1000;
    springDrag(dt);
    audioTick(currentT);
    draw(currentT);
    requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }

  // ---------- audio: lazy, gesture gated, typeof guarded ----------
  var AC = null, humOsc = null, humGain = null, washGain = null, prevGhost = 1;
  function audioInit() {
    if (AC) return;
    var Ctor = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!Ctor) return;
    try {
      AC = new Ctor();
      humOsc = AC.createOscillator();
      humOsc.type = 'sawtooth';
      humOsc.frequency.value = 46;
      var humFilter = AC.createBiquadFilter();
      humFilter.type = 'lowpass';
      humFilter.frequency.value = 220;
      humGain = AC.createGain();
      humGain.gain.value = 0.0;
      humOsc.connect(humFilter); humFilter.connect(humGain); humGain.connect(AC.destination);
      humOsc.start();
      // soft wash: looped noise through a bandpass, gain follows sweep presence
      var len = AC.sampleRate * 2;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      var rnd = mulberry32(777);
      for (var i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
      var src = AC.createBufferSource();
      src.buffer = buf; src.loop = true;
      var bp = AC.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.6;
      washGain = AC.createGain();
      washGain.gain.value = 0.0;
      src.connect(bp); bp.connect(washGain); washGain.connect(AC.destination);
      src.start();
    } catch (e) { AC = null; }
  }
  function tone(freqA, freqB, dur, gainV) {
    if (!AC) return;
    try {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freqA, AC.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, freqB), AC.currentTime + dur);
      g.gain.setValueAtTime(gainV, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + dur + 0.05);
    } catch (e) { /* audio stays optional */ }
  }
  function audioTick(t) {
    if (!AC) return;
    var bt = baseTransform(t);
    if (humOsc && humGain) {
      humOsc.frequency.value = 42 + 260 * Math.abs(bt.dang);
      humGain.gain.value = 0.028;
    }
    if (washGain) {
      var sp = sweepPos(t);
      var presence = Math.max(0, 1 - Math.abs(sp) / 0.85);
      washGain.gain.value = 0.05 * presence;
    }
    var g = markerFactor(t);
    if (prevGhost > 0.5 && g <= 0.5) tone(320, 110, 1.6, 0.05);   // the truth, leaving
    if (prevGhost < 0.5 && g >= 0.5) tone(110, 340, 1.6, 0.05);   // the truth, back
    prevGhost = g;
  }

  // ---------- interaction: grasp the body, relight, new body ----------
  var downAt = 0, downX = 0, downY = 0, moved = 0, lastTapAt = -10, lastTapX = 0, lastTapY = 0;
  var grasp = null;

  function pt(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', function (e) {
    audioInit();
    if (AC && AC.state === 'suspended' && AC.resume) AC.resume();
    var p = pt(e);
    downAt = currentT; downX = p.x; downY = p.y; moved = 0;
    var bt = baseTransform(currentT);
    grasp = {
      startX: p.x, startY: p.y,
      cxPx: (bt.cx + dragOff.x) * W, cyPx: (bt.cy + dragOff.y) * H,
      ang0: dragOff.ang, x0: dragOff.x, y0: dragOff.y,
      a0: Math.atan2(p.y - (bt.cy + dragOff.y) * H, p.x - (bt.cx + dragOff.x) * W)
    };
    dragging = true;
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || !grasp) return;
    var p = pt(e);
    moved = Math.max(moved, Math.hypot(p.x - downX, p.y - downY));
    var a1 = Math.atan2(p.y - grasp.cyPx, p.x - grasp.cxPx);
    var da = a1 - grasp.a0;
    while (da > Math.PI) da -= TAU;
    while (da < -Math.PI) da += TAU;
    dragTarget.ang = grasp.ang0 + da;
    dragTarget.x = grasp.x0 + (p.x - grasp.startX) / W;
    dragTarget.y = grasp.y0 + (p.y - grasp.startY) / H;
  });

  function endPointer(e) {
    if (!dragging) return;
    dragging = false;
    dragTarget.ang = 0; dragTarget.x = 0; dragTarget.y = 0;
    var p = pt(e);
    var quick = (currentT - downAt) < 0.35;
    if (quick && moved < 8) {
      // a tap: relight, or a double tap: a new body
      if (currentT - lastTapAt < 0.4 && Math.hypot(p.x - lastTapX, p.y - lastTapY) < 30) {
        buildBody((Math.random() * 1e9) | 0);
        tapTimes.length = 0;
        lastTapAt = -10;
      } else {
        tapTimes.push(currentT);
        if (tapTimes.length > 4) tapTimes.shift();
        lastTapAt = currentT; lastTapX = p.x; lastTapY = p.y;
        tone(520, 760, 0.35, 0.04);
      }
    }
    grasp = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function () {
    dragging = false;
    dragTarget.ang = 0; dragTarget.x = 0; dragTarget.y = 0;
    grasp = null;
  });
})();
</script>
</body>
</html>
