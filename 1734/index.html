<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Players, One System</title>
<style>
html, body { margin: 0; padding: 0; background: #0E0D10; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0E0D10';
var PLATE = '#17161A';
var PLATE_LINE = 'rgba(242,239,230,0.35)';
var TITLE_INK = '#F2EFE6';
var HINT_INK = '#E8C86A';
var RED = '#D64545';
var RED_DEEP = '#8E2B2B';
var BLUE = '#4A78DC';
var BLUE_DEEP = '#2B4A8E';
var GOLD = '#E8C86A';
var TITLE = 'Two Players, One System';
var DATESTR = '2006 · 10 · 11';
var HINT = 'Drag to nudge one player.';
/* Fixed phase for frame one: the duet has been playing 6 s at load. */
var T0 = 6.0;
var TRAIL_N = 120;
var TRAIL_DT = 0.075;
var GOLD_R_FRAC = 0.12;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1734);
var simTime = T0;
/* Agent wander parameters, fixed at load from the seeded rng.
   The two agents share a slow meeting modulation (MEET_W) and a shared
   tuning frequency (SHARED_W): their own wander frequencies sit near a
   2:3 ratio and the coupling term blends each toward the shared value,
   so the pair drifts in and out of unison instead of chasing. */
var MEET_W = 0.32, MEET_P = 0.9, SHARED_W = 0.26;
var agents = [
  {
    color: RED, deep: RED_DEEP, name: 'RED',
    cx: 0.30, cy: 0.52,
    ax1: 0.14, w1: 0.23, p1: 0.7,
    ax2: 0.02, w2: 0.61, p2: 2.0,
    ay1: 0.05, v1: 0.29, q1: 1.3,
    ay2: 0.02, v2: 0.67, q2: 0.4,
    meetX: 0.10, meetY: 0.08, side: -1
  },
  {
    color: BLUE, deep: BLUE_DEEP, name: 'BLUE',
    cx: 0.70, cy: 0.52,
    ax1: -0.14, w1: 0.23, p1: 1.6,
    ax2: -0.02, w2: 0.61, p2: 0.4,
    ay1: 0.05, v1: 0.29, q1: 0.5,
    ay2: 0.02, v2: 0.67, q2: 1.9,
    meetX: -0.10, meetY: 0.08, side: 1
  }
];
/* Small fixed jitter so the two wander signatures are not mirror copies. */
agents[0].p1 += (rng() - 0.5) * 0.04;
agents[1].q1 += (rng() - 0.5) * 0.04;
/* Drag nudges: closed-form sum over recorded incremental samples.
   Each sample decays with a spring return (tau 1.6 s), so a drag visibly
   pulls one form off its path and the coupling eases it back. */
var nudges = [];
function nudgeAt(agentIdx, t) {
  var ox = 0, oy = 0, i, s, d, w;
  for (i = 0; i < nudges.length; i++) {
    s = nudges[i];
    if (s.agent !== agentIdx) continue;
    d = t - s.t;
    if (d < 0) continue;
    w = Math.exp(-d / 1.6) * Math.cos(2.0 * d) * 0.5 + Math.exp(-d / 1.6) * 0.5;
    ox += s.dx * w;
    oy += s.dy * w;
  }
  var m = Math.sqrt(ox * ox + oy * oy);
  var cap = 0.16 * Math.min(VW, VH);
  if (m > cap && m > 0) { ox *= cap / m; oy *= cap / m; }
  return { x: ox, y: oy };
}
function posAt(agentIdx, t) {
  var a = agents[agentIdx];
  var meet = Math.sin(MEET_W * t + MEET_P);
  var x = a.cx + a.ax1 * Math.sin(a.w1 * t + a.p1) + a.meetX * meet + a.ax2 * Math.sin(a.w2 * t + a.p2);
  var y = a.cy + a.ay1 * Math.sin(a.v1 * t + a.q1) + a.meetY * meet + a.ay2 * Math.sin(a.v2 * t + a.q2);
  var n = nudgeAt(agentIdx, t);
  return { x: x * VW + n.x, y: y * VH + n.y };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function drawForm(p, color, deep, t) {
  var S = Math.min(VW, VH);
  var R = S * 0.055;
  var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R * 3.4);
  g.addColorStop(0, rgba(color, 0.20));
  g.addColorStop(0.5, rgba(color, 0.07));
  g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(p.x + R * 3.4, p.y);
  ctx.arc(p.x, p.y, R * 3.4, 0, TAU);
  ctx.fill();
  var layers = [
    { r: 1.7, a: 0.10 }, { r: 1.35, a: 0.16 }, { r: 1.0, a: 0.30 },
    { r: 0.68, a: 0.55 }, { r: 0.42, a: 0.90 }
  ];
  var i, L;
  for (i = 0; i < layers.length; i++) {
    L = layers[i];
    ctx.fillStyle = rgba(color, L.a);
    ctx.beginPath();
    ctx.moveTo(p.x + R * L.r, p.y);
    ctx.arc(p.x, p.y, R * L.r, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = rgba('#F2EFE6', 0.85);
  ctx.beginPath();
  ctx.moveTo(p.x + R * 0.16, p.y);
  ctx.arc(p.x, p.y, R * 0.16, 0, TAU);
  ctx.fill();
  /* faint ring marking the form's listening radius */
  ctx.strokeStyle = rgba(color, 0.35);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(p.x + R * 2.1, p.y);
  ctx.arc(p.x, p.y, R * 2.1, 0, TAU);
  ctx.stroke();
}
function drawTrail(agentIdx, t) {
  var a = agents[agentIdx];
  var i, s, p0, p1, f;
  var prev = null;
  for (i = 0; i < TRAIL_N; i++) {
    s = t - (TRAIL_N - 1 - i) * TRAIL_DT;
    p1 = posAt(agentIdx, s);
    f = i / (TRAIL_N - 1);
    if (prev) {
      ctx.strokeStyle = rgba(a.color, 0.08 + 0.60 * f);
      ctx.lineWidth = 1 + 2.2 * f;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
    prev = p1;
  }
}
function goldPoints(t) {
  var S = Math.min(VW, VH);
  var thr = GOLD_R_FRAC * S;
  var out = [], i, s, pr, pb, dx, dy, d, mx, my;
  for (i = 0; i < TRAIL_N; i++) {
    s = t - (TRAIL_N - 1 - i) * TRAIL_DT;
    pr = posAt(0, s);
    pb = posAt(1, s);
    dx = pr.x - pb.x; dy = pr.y - pb.y;
    d = Math.sqrt(dx * dx + dy * dy);
    mx = (pr.x + pb.x) / 2; my = (pr.y + pb.y) / 2;
    if (d < thr && Math.abs(mx - VW * 0.5) < VW * 0.24) {
      out.push({ x: mx, y: my, k: 1 - d / thr, f: i / (TRAIL_N - 1) });
    }
  }
  return out;
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var S = Math.min(VW, VH);
  var i, g, gp;
  /* meeting zone guides */
  ctx.strokeStyle = 'rgba(242,239,230,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(VW * 0.38, 0); ctx.lineTo(VW * 0.38, VH);
  ctx.moveTo(VW * 0.62, 0); ctx.lineTo(VW * 0.62, VH);
  ctx.stroke();
  if (VW > 720) {
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(242,239,230,0.40)';
    ctx.fillText('MEETING ZONE', VW * 0.5, 12);
  }
  /* washes of red and blue light, each centered on its player */
  var pr = posAt(0, simTime), pb = posAt(1, simTime);
  g = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, S * 0.55);
  g.addColorStop(0, rgba(RED, 0.10));
  g.addColorStop(1, rgba(RED, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
  g = ctx.createRadialGradient(pb.x, pb.y, 0, pb.x, pb.y, S * 0.55);
  g.addColorStop(0, rgba(BLUE, 0.10));
  g.addColorStop(1, rgba(BLUE, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
  /* trails, older fainter */
  drawTrail(0, simTime);
  drawTrail(1, simTime);
  /* gold only where the two trails genuinely meet, in the center zone */
  gp = goldPoints(simTime);
  var best = null;
  for (i = 0; i < gp.length; i++) {
    if (!best || gp[i].k > best.k) best = gp[i];
    ctx.fillStyle = rgba(GOLD, 0.25 + 0.65 * gp[i].k * (0.4 + 0.6 * gp[i].f));
    ctx.beginPath();
    ctx.moveTo(gp[i].x + 1.2 + 2.8 * gp[i].k, gp[i].y);
    ctx.arc(gp[i].x, gp[i].y, 1.2 + 2.8 * gp[i].k, 0, TAU);
    ctx.fill();
  }
  if (best) {
    g = ctx.createRadialGradient(best.x, best.y, 0, best.x, best.y, S * 0.07);
    g.addColorStop(0, rgba(GOLD, 0.22 * best.k));
    g.addColorStop(1, rgba(GOLD, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(best.x + S * 0.07, best.y);
    ctx.arc(best.x, best.y, S * 0.07, 0, TAU);
    ctx.fill();
  }
  /* the two players, soft-edged, equal weight */
  drawForm(pr, RED, RED_DEEP, simTime);
  drawForm(pb, BLUE, BLUE_DEEP, simTime);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(TITLE).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(TITLE).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText(DATESTR).width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(TITLE, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText(DATESTR, plateX + 14, plateY + 7 + titlePx + 3);
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(HINT).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(HINT, hintPlateX + 12, hintPlateY + 7);
}
/* ---- drag: nudge the nearer player; the pair eases back to shared tuning ---- */
var dragAgent = -1, dragLastX = 0, dragLastY = 0, dragging = false;
function pickAgent(x, y) {
  var pr = posAt(0, simTime), pb = posAt(1, simTime);
  var dr = Math.hypot(x - pr.x, y - pr.y);
  var db = Math.hypot(x - pb.x, y - pb.y);
  return dr <= db ? 0 : 1;
}
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    var x = e.clientX || 0, y = e.clientY || 0;
    dragAgent = pickAgent(x, y);
    dragLastX = x; dragLastY = y; dragging = true;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || dragAgent < 0) return;
    var x = e.clientX || 0, y = e.clientY || 0;
    var dx = x - dragLastX, dy = y - dragLastY;
    dragLastX = x; dragLastY = y;
    if (dx === 0 && dy === 0) return;
    nudges.push({ t: simTime, dx: dx, dy: dy, agent: dragAgent });
    if (nudges.length > 400) nudges.splice(0, nudges.length - 400);
    draw();
  });
  canvas.addEventListener('pointerup', function () {
    dragging = false; dragAgent = -1;
  });
  canvas.addEventListener('pointercancel', function () {
    dragging = false; dragAgent = -1;
  });
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { simTime = t; draw(); },
    pos: function (i, t) { return posAt(i, t); },
    goldCount: function () { return goldPoints(simTime).length; },
    goldCountAt: function (t) { simTime = t; draw(); return goldPoints(t).length; },
    nudge: function (agent, dx, dy) { nudges.push({ t: simTime, dx: dx, dy: dy, agent: agent }); draw(); },
    nudgeCount: function () { return nudges.length; },
    simTime: function () { return simTime; }
  };
}
/* ---- frame one: fixed phase t = 6 s, both players legible, meeting zone clear ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) { simTime += dt; draw(); }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
