<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.406 Bear Hug</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F7D8C9; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.406 Bear Hug (nina-clausonet).
// After Nina Clausonet's animal-embrace mechanism from
// her 2020 seed: the white-haired muse, closed eyes and
// red lips, hugging a huge cream polar bear on a blush
// ground. Both wear red - her mittens are oversized,
// a paper crown sits tilted on her head, and the bear
// wears a red scarf. A brown Christmas tree with red
// dots and a cream star stands behind them at the upper
// right. WATCH-ONLY: a pure 24s seamless loop - the two
// figures rock gently together on a shared 6s sine,
// exactly 140 snow particles fall (each a whole number
// of field heights per loop), and the bear's left ear
// twitches once per cycle at one fixed slot. The crown
// tilt is a constant -8 degrees and never animates.
// Grain is fixed speckle data (900 static + 200
// drifting dots), never a texture. The only lettering
// is her small script signature, hand-lettered stroke
// paths in red at the bottom left (the designed-text
// exception for this piece). Palette closed at the
// specced hexes, used flat or at flat alpha steps. One
// canvas, no offscreen canvas, no gradients, no
// filters, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BLUSH = '#F7D8C9', SKIN = '#E8A58A', WHITE = '#FFFFFF';
var CREAM = '#F5EDE0', RED = '#E63329', BROWN = '#8B5A3C';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;
if (LOOP !== 24) throw new Error('Bear Hug loop must be 24s');
var TICK = 1 / 60;
var TAU = Math.PI * 2;
var CROWN_TILT = -8 * Math.PI / 180;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-looking
// value is baked from this at load and never changes
// between frames or renders.
var seed = 406;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- small draw helpers --------------------------------
function circ(x, y, r, col, a) {
  ctx.globalAlpha = (a === undefined ? 1 : a);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function ell(x, y, rx, ry, col, rot, a) {
  ctx.globalAlpha = (a === undefined ? 1 : a);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function poly(pts, col, a) {
  ctx.globalAlpha = (a === undefined ? 1 : a);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function strokePts(pts, w, col, a) {
  ctx.globalAlpha = (a === undefined ? 1 : a);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function arcStroke(x, y, r, a0, a1, w, col, a) {
  ctx.globalAlpha = (a === undefined ? 1 : a);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke();
  ctx.globalAlpha = 1;
}
function star(cx, cy, rO, rI, rot, col) {
  var pts = [], i, a;
  for (i = 0; i < 10; i++) {
    a = rot + i * Math.PI / 5 - Math.PI / 2;
    var r = (i % 2 === 0) ? rO : rI;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  poly(pts, col);
}

// ---- snow ----------------------------------------------
// Exactly 140 particles. Each falls a whole number of
// field heights per 24s loop (k = 1, 2 or 3), so every
// flake is home at the wrap; the sway periods divide
// the loop too. The first 55 flakes draw behind the
// figures, the rest in front.
var SNOW = [];
(function () {
  var i;
  for (i = 0; i < 140; i++) {
    SNOW.push({
      x: rnd() * DW, y0: rnd() * DH,
      r: 1.3 + rnd() * 2.6,
      k: 1 + Math.floor(rnd() * 3),
      amp: 4 + rnd() * 10,
      per: [6, 8, 12, 24][Math.floor(rnd() * 4)],
      ph: rnd() * TAU,
      a: [0.55, 0.75, 0.95][Math.floor(rnd() * 3)]
    });
  }
})();
if (SNOW.length !== 140) throw new Error('Bear Hug needs exactly 140 snow particles');
SNOW.forEach(function (f) {
  if (f.k !== Math.floor(f.k) || f.k < 1 || f.k > 3) throw new Error('snow fall must be whole field heights');
  if (LOOP % f.per !== 0) throw new Error('snow sway period must divide the loop');
});
function drawSnow(t, from, to) {
  var i, f, y;
  for (i = from; i < to; i++) {
    f = SNOW[i];
    y = (f.y0 + f.k * DH * (t / LOOP)) % DH;
    circ(f.x + f.amp * Math.sin(TAU * t / f.per + f.ph), y, f.r, WHITE, f.a);
  }
}

// ---- grain ---------------------------------------------
// 900 static speckle dots + 200 slow-drifting dots,
// baked from the seeded LCG at flat alpha steps.
// Drifting dots wander on small circular paths whose
// periods divide the loop, so they are home at the wrap.
var GRAIN_COLS = [WHITE, RED, BROWN, SKIN, CREAM];
var GRAIN_ALPHAS = [0.05, 0.07, 0.09];
var STATIC_GRAIN = [], DRIFT_GRAIN = [];
(function () {
  var i;
  for (i = 0; i < 900; i++) {
    STATIC_GRAIN.push({
      x: rnd() * DW, y: rnd() * DH, r: 0.8 + rnd() * 1.1,
      col: GRAIN_COLS[Math.floor(rnd() * 5)],
      a: GRAIN_ALPHAS[Math.floor(rnd() * 3)]
    });
  }
  for (i = 0; i < 200; i++) {
    DRIFT_GRAIN.push({
      x: rnd() * DW, y: rnd() * DH, r: 0.8 + rnd() * 1.0,
      col: GRAIN_COLS[Math.floor(rnd() * 5)],
      a: GRAIN_ALPHAS[Math.floor(rnd() * 3)],
      per: [6, 8, 12, 24][Math.floor(rnd() * 4)],
      amp: 5 + rnd() * 9, ph: rnd() * TAU
    });
  }
})();
if (STATIC_GRAIN.length !== 900) throw new Error('Bear Hug needs exactly 900 static grain dots');
if (DRIFT_GRAIN.length !== 200) throw new Error('Bear Hug needs exactly 200 drifting grain dots');
DRIFT_GRAIN.forEach(function (g) { if (LOOP % g.per !== 0) throw new Error('drift period must divide the loop'); });
function drawGrain(t) {
  var i, g, ph;
  for (i = 0; i < STATIC_GRAIN.length; i++) {
    g = STATIC_GRAIN[i];
    circ(g.x, g.y, g.r, g.col, g.a);
  }
  for (i = 0; i < DRIFT_GRAIN.length; i++) {
    g = DRIFT_GRAIN[i];
    ph = TAU * (t / g.per) + g.ph;
    circ(g.x + g.amp * Math.cos(ph), g.y + g.amp * 0.6 * Math.sin(ph), g.r, g.col, g.a);
  }
}

// ---- tree ----------------------------------------------
// Brown Christmas tree behind the figures, upper right:
// three scalloped tiers of overlapping ellipses, a
// trunk, red bauble dots at fixed spots, and a cream
// star on top. The tree does not rock; it is scenery.
var TREE_DOTS = [
  [1108, 372], [1062, 428], [1158, 424], [1108, 452],
  [1008, 540], [1108, 522], [1204, 544], [1052, 588], [1162, 592],
  [968, 668], [1072, 648], [1180, 652], [1252, 676], [1018, 712], [1150, 716]
];
function drawTree() {
  ctx.fillStyle = BROWN;
  ctx.fillRect(1090, 620, 36, 272);
  poly([[1090, 892], [1126, 892], [1150, 900], [1066, 900]], BROWN);
  // top tier
  ell(1050, 430, 55, 45, BROWN); ell(1166, 430, 55, 45, BROWN); ell(1108, 402, 78, 62, BROWN);
  // middle tier
  ell(1025, 552, 70, 52, BROWN); ell(1191, 552, 70, 52, BROWN); ell(1108, 522, 110, 75, BROWN);
  // bottom tier
  ell(1005, 688, 85, 58, BROWN); ell(1211, 688, 85, 58, BROWN); ell(1108, 652, 140, 85, BROWN);
  var i;
  for (i = 0; i < TREE_DOTS.length; i++) circ(TREE_DOTS[i][0], TREE_DOTS[i][1], 8, RED);
  star(1108, 282, 31, 13, -0.14, CREAM);
}

// ---- ear twitch ----------------------------------------
// One fixed slot per 24s cycle: 13.0s to 13.9s. A quick
// triple flick, damped to nothing by the slot's end.
function earTwitch(t) {
  var p = t % LOOP, s = 13.0, d = 0.9;
  if (p < s || p > s + d) return 0;
  var u = (p - s) / d;
  return 0.38 * Math.sin(u * Math.PI * 4) * (1 - u);
}

// ---- bear ----------------------------------------------
// A huge cream polar bear, front-facing and serene.
// Warm shadow strokes are the tree brown at flat alpha
// steps. Drawn inside the rocking group.
function drawBear(t) {
  // feet
  ell(498, 862, 90, 40, CREAM);
  ell(902, 862, 90, 40, CREAM);
  arcStroke(462, 856, 15, Math.PI * 1.1, Math.PI * 1.9, 3, BROWN, 0.30);
  arcStroke(938, 856, 15, Math.PI * 1.1, Math.PI * 1.9, 3, BROWN, 0.30);
  // body and belly
  ell(700, 618, 308, 284, CREAM);
  ell(700, 668, 196, 184, CREAM);
  arcStroke(700, 668, 190, Math.PI * 0.15, Math.PI * 0.85, 3.5, BROWN, 0.16);
  // side arms, resting down the body's flanks
  ell(448, 598, 60, 168, CREAM, 0.42);
  ell(952, 598, 60, 168, CREAM, -0.42);
  // ears: the left one carries the twitch
  ctx.save();
  ctx.translate(574, 216); ctx.rotate(earTwitch(t)); ctx.translate(-574, -216);
  circ(574, 198, 50, CREAM);
  ell(574, 200, 25, 22, BROWN, 0, 0.22);
  ctx.restore();
  circ(826, 198, 50, CREAM);
  ell(826, 200, 25, 22, BROWN, 0, 0.22);
  // head
  circ(700, 336, 168, CREAM);
  ell(594, 402, 24, 38, BROWN, 0.2, 0.10);
  // muzzle, nose, mouth
  ell(700, 396, 82, 60, CREAM);
  arcStroke(700, 396, 78, Math.PI * 0.1, Math.PI * 0.9, 3, BROWN, 0.28);
  ell(700, 372, 26, 18, BROWN);
  arcStroke(700, 396, 14, Math.PI * 0.15, Math.PI * 0.85, 3.5, BROWN, 0.55);
  // closed eyes, serene cap arcs
  arcStroke(626, 332, 16, Math.PI * 1.12, Math.PI * 1.88, 4.5, BROWN, 0.75);
  arcStroke(774, 332, 16, Math.PI * 1.12, Math.PI * 1.88, 4.5, BROWN, 0.75);
  // scarf: both wear red. A band across the neck and a
  // fringed tail hanging at the bear's right side.
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.moveTo(546, 460);
  ctx.quadraticCurveTo(700, 542, 854, 460);
  ctx.lineTo(854, 506);
  ctx.quadraticCurveTo(700, 584, 546, 506);
  ctx.closePath(); ctx.fill();
  poly([[788, 496], [846, 496], [840, 646], [782, 636]], RED);
  strokePts([[792, 636], [790, 660]], 4, RED);
  strokePts([[812, 640], [811, 664]], 4, RED);
  strokePts([[832, 642], [833, 666]], 4, RED);
}

// ---- muse ----------------------------------------------
// The muse in front of the bear's left chest: white hair
// mass, pink face with closed eyes and red lips, a red
// paper crown tilted at a constant -8 degrees, a white
// sweater, and two white-sleeved arms reaching around
// the bear, ending in oversized red mittens. Drawn
// inside the rocking group, after the bear.
function drawMuse() {
  // hair mass behind the head, falling past the shoulders
  ell(424, 428, 128, 150, WHITE);
  ell(398, 596, 94, 112, WHITE);
  // sweater torso
  ell(432, 652, 106, 132, WHITE);
  arcStroke(432, 566, 62, Math.PI * 1.05, Math.PI * 1.95, 3.5, BROWN, 0.18);
  // face
  ell(428, 418, 68, 76, SKIN);
  // hair cap over the forehead, and side locks
  ell(428, 364, 76, 46, WHITE);
  ell(360, 472, 25, 72, WHITE);
  ell(496, 472, 25, 72, WHITE);
  // closed eyes
  arcStroke(403, 422, 10, Math.PI * 1.12, Math.PI * 1.88, 3.5, BROWN, 0.8);
  arcStroke(453, 422, 10, Math.PI * 1.12, Math.PI * 1.88, 3.5, BROWN, 0.8);
  // red lips
  ell(428, 460, 10.5, 5.5, RED);
  // paper crown: a band with three points, tilted at
  // exactly -8 degrees; the tilt is a constant and the
  // crown never animates on its own.
  ctx.save();
  ctx.translate(428, 298); ctx.rotate(CROWN_TILT);
  poly([[-58, 26], [-58, -14], [-38, 8], [-20, -25], [0, 6], [20, -25], [38, 8], [58, -14], [58, 26]], RED);
  circ(-30, 13, 4, CREAM); circ(0, 15, 4, CREAM); circ(30, 13, 4, CREAM);
  ctx.restore();
  // arms reaching around the bear, white sleeves
  ctx.strokeStyle = WHITE; ctx.lineCap = 'round'; ctx.lineWidth = 36;
  ctx.beginPath(); ctx.moveTo(478, 560); ctx.quadraticCurveTo(562, 586, 630, 614); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(472, 630); ctx.quadraticCurveTo(546, 670, 602, 702); ctx.stroke();
  // oversized red mittens resting on the bear's belly
  ell(646, 620, 43, 32, RED, 0.4);
  circ(618, 598, 15, RED);
  ell(618, 708, 45, 33, RED, 0.2);
  circ(588, 690, 16, RED);
}

// The bear's front paws, drawn after the muse so the
// hug wraps around her: the left paw overlaps her
// sweater's right edge, the right paw rests low.
function drawFrontPaws() {
  ell(524, 748, 58, 47, CREAM, 0.3);
  arcStroke(506, 742, 13, Math.PI * 1.1, Math.PI * 1.9, 3, BROWN, 0.30);
  arcStroke(536, 750, 13, Math.PI * 1.1, Math.PI * 1.9, 3, BROWN, 0.30);
  ell(884, 748, 58, 47, CREAM, -0.3);
  arcStroke(866, 742, 13, Math.PI * 1.1, Math.PI * 1.9, 3, BROWN, 0.30);
  arcStroke(896, 750, 13, Math.PI * 1.1, Math.PI * 1.9, 3, BROWN, 0.30);
}

// ---- signature ------------------------------------------
// Hand-lettered script stroke paths (her flowing
// signature flourish) in red, small, at the bottom left.
// No font text anywhere.
var SIG_STROKES = [
  [[2, 46], [5, 28], [8, 19], [13, 16], [17, 20], [18, 30], [21, 19], [25, 17], [28, 24], [29, 40], [33, 44]],
  [[42, 46], [44, 30], [46, 21], [49, 28], [51, 46]],
  [[60, 46], [63, 28], [66, 19], [71, 16], [75, 20], [76, 30], [79, 19], [83, 17], [86, 24], [87, 40], [91, 44]],
  [[112, 21], [103, 17], [96, 23], [95, 34], [99, 44], [106, 46], [112, 40], [114, 28], [114, 20]],
  [[114, 20], [116, 36], [120, 46], [127, 43]]
];
function strokePath(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length - 1; i++) {
    var mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
  ctx.stroke();
}
function drawSignature() {
  ctx.save();
  ctx.translate(54, 800);
  ctx.scale(0.66, 0.66);
  ctx.strokeStyle = RED; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.9; ctx.lineWidth = 3.4;
  SIG_STROKES.forEach(strokePath);
  circ(45, 9, 2.8, RED, 0.9);
  ctx.globalAlpha = 0.6; ctx.lineWidth = 2.2;
  strokePath([[2, 55], [40, 61], [88, 58], [128, 50]]);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function draw(t) {
  ctx.fillStyle = BLUSH;
  ctx.fillRect(0, 0, DW, DH);
  drawSnow(t, 0, 55);
  drawTree();
  // The embrace: bear and muse rock together on a shared
  // 6s sine (4 whole cycles per loop) about a low pivot,
  // with a small companion bob. Tree and snow stay out
  // of the group.
  ctx.save();
  ctx.translate(0, 5 * Math.sin(TAU * t / 6 - 0.7));
  ctx.translate(640, 885);
  ctx.rotate(1.1 * Math.PI / 180 * Math.sin(TAU * t / 6));
  ctx.translate(-640, -885);
  drawBear(t);
  drawMuse();
  drawFrontPaws();
  ctx.restore();
  drawSnow(t, 55, 140);
  drawGrain(t);
  drawSignature();
}

// ---- clock and frame -----------------------------------
// Determinism: frame one is drawn synchronously at the
// constant phase T0 (embrace mid-rock, snow mid-fall),
// and the animation clock advances from that anchor in
// fixed 1/60 ticks accumulated from rAF timestamps.
// Frame one never reads a wall clock.
var T0 = 9.4;
var T = T0;
var lastNow = -1, acc = 0;
function step() { /* watch-only: state lives in the clock */ }

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // The page ground takes the blush, so the letterbox of
  // the centred fit is the piece's own ground.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BLUSH;
  ctx.fillRect(0, 0, W, H);
  // Centred fit: the shaped composition keeps its shape
  // at any aspect.
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
