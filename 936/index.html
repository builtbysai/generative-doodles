<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dear Someone: A Weekly Correspondence</title>
<style>
  html, body { margin: 0; padding: 0; background: #F6F1E5; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var PAPER = '#F6F1E5';
  var CORAL = '#E0572F';
  var INDIGO = '#3B4B8C';
  var MUSTARD = '#D9A441';
  var STAMPRED = '#B23A2E';
  var INK = '#23211C';
  var WHITE = '#FFFFFF'; // sheen wedge only, per brief (flat polygon, low alpha)

  // ---------- timing ----------
  var WEEK_LEN = 50;        // one week, seconds of piece time
  var COLLECT_LEN = 40;     // observations collect over 40 s
  var LEGEND_START = 18;    // legend begins writing while the week still collects
  var LEGEND_LEN = 12;      // legend writes over 12 s
  var WIPE_START = 48;      // postal wipe, last 2 s of the week
  var PHASE0 = 26;          // frame one: week 1 at 65% collected, legend mid-write

  var QUESTIONS = [
    'times I checked the clock',
    'smiles at strangers',
    'complaints, kept and sent',
    'things I was grateful for',
    'cups of tea',
    'songs stuck in my head',
    'times I said sorry',
    'windows I looked out of',
    'things I nearly bought',
    'moments of quiet',
    'texts I did not send',
    'stairs I climbed'
  ];
  var SIGNOFF = 'read me slowly';

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rngFor(key) { return mulberry32(hashStr(key)); }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ---------- weeks: master stream consumed in week order ----------
  var MASTER = mulberry32(936001);
  var WEEK_SEEDS = [];
  var WEEK_CACHE = [];
  function weekSeed(i) {
    while (WEEK_SEEDS.length <= i) WEEK_SEEDS.push((MASTER() * 4294967296) >>> 0);
    return WEEK_SEEDS[i];
  }
  var GRAMMARS = ['stems', 'clusters', 'threads', 'arcs'];
  var KEYS = {
    stems:   ['one stem = one day', 'spiral turns = count'],
    clusters: ['one cluster = one day', 'bigger circle = more'],
    threads: ['one thread = one day', 'loops = count'],
    arcs:    ['one arc = one day', 'ticks = count']
  };
  function genWeek(i) {
    if (WEEK_CACHE[i]) return WEEK_CACHE[i];
    var rng = mulberry32(weekSeed(i));
    var g = GRAMMARS[i % 4];
    var wk = { idx: i, grammar: g, q: QUESTIONS[i % QUESTIONS.length], days: [], total: 0, units: [] };
    var d, j;
    if (g === 'stems') {
      for (d = 0; d < 7; d++) { var turns = 1 + Math.floor(rng() * 6); wk.days.push(turns); wk.units.push(turns); wk.total += turns; }
    } else if (g === 'clusters') {
      for (d = 0; d < 7; d++) {
        var n = 2 + Math.floor(rng() * 4), obs = [];
        for (j = 0; j < n; j++) obs.push({ v: 1 + Math.floor(rng() * 5), a: rng() * Math.PI * 2, dist: rng() });
        wk.days.push(obs); wk.units.push(n); wk.total += n;
      }
    } else if (g === 'threads') {
      for (d = 0; d < 7; d++) { var loops = 1 + Math.floor(rng() * 7); wk.days.push(loops); wk.units.push(loops); wk.total += loops; }
    } else {
      for (d = 0; d < 7; d++) { var ticks = 2 + Math.floor(rng() * 8); wk.days.push(ticks); wk.units.push(ticks); wk.total += ticks; }
    }
    WEEK_CACHE[i] = wk;
    return wk;
  }
  // per-day reveal fractions for a collect frontier (in units)
  function dayFracs(wk, frontier) {
    var out = [], acc = 0;
    for (var d = 0; d < 7; d++) {
      out.push(clamp01((frontier - acc) / wk.units[d]));
      acc += wk.units[d];
    }
    return out;
  }

  // ---------- canvas / view ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;
  var L = null; // layout

  function computeLayout() {
    var mx = clamp(Math.min(W, H) * 0.045, 10, 44);
    var my = clamp(Math.min(W, H) * 0.038, 8, 36);
    var card = { x: mx, y: my, w: W - 2 * mx, h: H - 2 * my };
    var pad = clamp(card.w * 0.038, 14, 34);
    var ruleY = card.y + card.h * (PHONE ? 0.60 : 0.64);
    var stampW = clamp(card.w * 0.085, 54, 96);
    var stampH = stampW * 1.22;
    L = {
      card: card, pad: pad, ruleY: ruleY,
      data: { x: card.x + pad, y: card.y + pad * 0.9, w: card.w - 2 * pad, h: ruleY - card.y - pad * 0.9 - pad * 0.55 },
      legend: { x: card.x + pad, y: ruleY + pad * 0.55, w: card.w - 2 * pad, h: card.y + card.h - ruleY - pad * 0.55 - pad * 0.5 },
      stamp: { x: card.x + card.w - pad * 0.7 - stampW, y: card.y + pad * 0.7, w: stampW, h: stampH },
      qSize: PHONE ? 19 : 27,
      kSize: PHONE ? 14.5 : 19
    };
  }
  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv && vv.width ? vv.width : (window.innerWidth || 300);
    H = vv && vv.height ? vv.height : (window.innerHeight || 300);
    DPR = Math.min((typeof window !== 'undefined' && window.devicePixelRatio) || 1, 2);
    var sw = 0;
    if (typeof window !== 'undefined' && window.screen && window.screen.width) {
      sw = Math.min(window.screen.width, window.screen.height);
    }
    PHONE = sw > 0 ? (sw < 700) : (H > W * 1.15);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    computeLayout();
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(curElapsed); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(curElapsed); });
  }

  // ---------- interaction state (recorded events; closed-form replay) ----------
  var SKIPS = [];       // elapsed times of double-tap week skips
  var FLIPS = [];       // elapsed times of tap flips
  var curElapsed = 0;
  var tilt = { skew: 0, shift: 0, sheen: 0.5, active: false, releaseT: -10, relSkew: 0, relShift: 0, relSheen: 0.5 };

  function virtualTime(e) {
    var v = PHASE0, last = 0, i, ev;
    var evs = SKIPS.slice().sort(function (a, b) { return a - b; });
    for (i = 0; i < evs.length; i++) {
      ev = evs[i];
      if (ev > e) break;
      v += (ev - last);
      v = (Math.floor(v / WEEK_LEN) + 1) * WEEK_LEN; // jump to next week start
      last = ev;
    }
    v += (e - last);
    return v;
  }
  function flipState(e) {
    var n = 0, lastT = -10, i;
    for (i = 0; i < FLIPS.length; i++) { if (FLIPS[i] <= e) { n++; lastT = FLIPS[i]; } }
    var prog = n === 0 ? 1 : clamp01((e - lastT) / 0.6);
    // target side after the latest flip: odd count = back. During the first
    // half of the animation we still show the side we are leaving.
    var enteringBack = (n % 2) === 1;
    var showBack = prog < 0.5 ? !enteringBack : enteringBack;
    if (n === 0) showBack = false;
    return { n: n, prog: prog, showBack: showBack };
  }

  // ---------- audio (lazy, guarded) ----------
  var AC = null, audioOn = false;
  function ensureAudio() {
    if (audioOn) return;
    try {
      var Ctor = (typeof window !== 'undefined') ? (window.AudioContext || window.webkitAudioContext) : null;
      if (typeof Ctor === 'function') { AC = new Ctor(); audioOn = true; }
    } catch (err) { AC = null; audioOn = false; }
  }
  function blip(freq, dur, gain, type) {
    if (!audioOn || !AC) return;
    try {
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (err) {}
  }
  function swish() {
    if (!audioOn || !AC) return;
    try {
      var len = AC.sampleRate * 0.35, buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0), i;
      for (i = 0; i < len; i++) d[i] = (Math.sin(i * 12.9898) * 43758.5453 % 1) * (1 - i / len);
      var src = AC.createBufferSource(); src.buffer = buf;
      var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(500, AC.currentTime);
      f.frequency.exponentialRampToValueAtTime(2400, AC.currentTime + 0.3);
      var g = AC.createGain(); g.gain.value = 0.12;
      src.connect(f); f.connect(g); g.connect(AC.destination);
      src.start();
    } catch (err) {}
  }
  function thump() { blip(88, 0.22, 0.25, 'sine'); blip(1400, 0.03, 0.05, 'square'); }
  function pencilTick() { blip(1900 + (hashStr('tk' + tickCount) % 500), 0.025, 0.035, 'square'); }
  var tickCount = 0, lastUnitsShown = -1, lastWeekIdx = -1;

  // ---------- hand-lettered text pipeline ----------
  var FONT = '"Segoe Print","Bradley Hand","Comic Sans MS",cursive';
  function setHandFont(size, bold) {
    ctx.font = (bold ? '700 ' : '') + size + 'px ' + FONT;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }
  // draws text letter by letter with seeded jitter; reveal = fraction of total width written.
  // returns total width.
  function handText(str, x, y, size, color, reveal, key, bold) {
    setHandFont(size, bold);
    var widths = [], total = 0, i, w;
    var track = size * 0.05;
    for (i = 0; i < str.length; i++) { w = ctx.measureText(str[i]).width + track; widths.push(w); total += w; }
    if (reveal <= 0) return total;
    var rng = rngFor('txt:' + key + ':' + str);
    var budget = reveal * total, cx = x;
    ctx.fillStyle = color;
    for (i = 0; i < str.length; i++) {
      var cw = widths[i];
      if (budget < cw * 0.5) break;
      var rot = (rng() * 2 - 1) * 0.05;
      var dy = (rng() * 2 - 1) * size * 0.07;
      var ch = str[i];
      if (ch !== ' ') {
        ctx.save();
        ctx.translate(cx + cw / 2, y + dy);
        ctx.rotate(rot);
        ctx.fillText(ch, -cw / 2, 0);
        ctx.restore();
      }
      cx += cw;
      budget -= cw;
    }
    return total;
  }
  function textWidth(str, size, bold) {
    setHandFont(size, bold);
    var t = 0, i;
    for (i = 0; i < str.length; i++) t += ctx.measureText(str[i]).width + size * 0.05;
    return t;
  }
  function wrapText(str, size, maxW, bold) {
    var words = str.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var trial = cur ? cur + ' ' + words[i] : words[i];
      if (textWidth(trial, size, bold) > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = trial;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ---------- wobbly strokes ----------
  function wobLine(x1, y1, x2, y2, key, amp, color, lw) {
    var rng = rngFor('wl:' + key);
    var seg = 6, i, px, py;
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (i = 0; i <= seg; i++) {
      var t = i / seg;
      var off = (i === 0 || i === seg) ? 0 : (rng() * 2 - 1) * amp;
      var dx = -(y2 - y1), dy = (x2 - x1), len = Math.sqrt(dx * dx + dy * dy) || 1;
      px = lerp(x1, x2, t) + dx / len * off;
      py = lerp(y1, y2, t) + dy / len * off;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  function wobPath(pts, key, amp, color, lw) {
    var rng = rngFor('wp:' + key);
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var ox = (rng() * 2 - 1) * amp, oy = (rng() * 2 - 1) * amp;
      if (i === 0) ctx.moveTo(pts[i][0] + ox, pts[i][1] + oy);
      else ctx.lineTo(pts[i][0] + ox, pts[i][1] + oy);
    }
    ctx.stroke();
  }

  // ---------- grammar glyphs (front data area) ----------
  function drawStems(wk, fr, area) {
    var colW = area.w / 7;
    var baseY = area.y + area.h * 0.96;
    ctx.save();
    ctx.globalAlpha = 0.30;
    wobLine(area.x + 2, baseY, area.x + area.w - 2, baseY, 'ground' + wk.idx, 1.2, INK, 1.5);
    ctx.restore();
    for (var d = 0; d < 7; d++) {
      var f = fr[d];
      if (f <= 0) continue;
      var rng = rngFor('stem:' + wk.idx + ':' + d);
      var cx = area.x + (d + 0.5) * colW + (rng() * 2 - 1) * 3;
      var stemH = area.h * (0.80 + rng() * 0.14);
      var phase = rng() * Math.PI * 2;
      var stemFrac = clamp01(f / 0.2);
      // stem (indigo), drawn upward with the first slice of the day's reveal
      ctx.strokeStyle = INDIGO; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath();
      var steps = 14, i, t, wx;
      for (i = 0; i <= steps; i++) {
        t = (i / steps) * stemFrac;
        wx = cx + Math.sin(t * 5.1 + phase) * 1.6;
        if (i === 0) ctx.moveTo(wx, baseY); else ctx.lineTo(wx, baseY - t * stemH);
      }
      ctx.stroke();
      // spiral turns (coral), wrapped along the stem
      var sp = clamp01((f - 0.2) / 0.8);
      if (sp > 0) {
        var turns = wk.days[d];
        var amp = Math.min(colW * 0.30, 15);
        ctx.strokeStyle = CORAL; ctx.lineWidth = 2;
        ctx.beginPath();
        var N = 90, s, y, xx;
        for (i = 0; i <= N; i++) {
          s = (i / N) * sp;
          y = baseY - s * stemH * 0.94 - stemH * 0.03;
          xx = cx + Math.sin(s * turns * Math.PI * 2 + phase * 0.3) * amp * (0.55 + 0.45 * Math.sin(s * Math.PI));
          if (i === 0) ctx.moveTo(xx, y); else ctx.lineTo(xx, y);
        }
        ctx.stroke();
      }
    }
  }
  function drawClusters(wk, fr, area) {
    var colW = area.w / 7;
    var cyBase = area.y + area.h * 0.52;
    for (var d = 0; d < 7; d++) {
      var f = fr[d];
      if (f <= 0) continue;
      var crng = rngFor('clu:' + wk.idx + ':' + d);
      var ccx = area.x + (d + 0.5) * colW;
      var ccy = cyBase + (crng() * 2 - 1) * area.h * 0.16;
      var obs = wk.days[d];
      var shown = f * obs.length;
      for (var j = 0; j < obs.length; j++) {
        var pop = clamp01(shown - j);
        if (pop <= 0) continue;
        var o = obs[j];
        var ring = 1 + Math.floor(j / 5);
        var dist = o.dist * colW * 0.30 * ring;
        var ox = ccx + Math.cos(o.a) * dist;
        var oy = ccy + Math.sin(o.a) * dist * 0.8;
        var r = (2.2 + o.v * 1.85) * (0.4 + 0.6 * pop);
        ctx.fillStyle = o.v >= 4 ? MUSTARD : (o.v === 3 ? CORAL : INDIGO);
        ctx.beginPath();
        ctx.arc(ox, oy, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  function drawThreads(wk, fr, area) {
    var rowH = area.h / 7;
    var x0 = area.x + 4, x1 = area.x + area.w - 4;
    for (var d = 0; d < 7; d++) {
      var f = fr[d];
      if (f <= 0) continue;
      var y = area.y + (d + 0.5) * rowH;
      var rng = rngFor('thr:' + wk.idx + ':' + d);
      var wob = [];
      for (var k = 0; k <= 8; k++) wob.push((rng() * 2 - 1) * 3);
      // thread line, drawn to the reveal frontier
      ctx.strokeStyle = CORAL; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      var steps = 40, i, t, xx, yy;
      for (i = 0; i <= steps; i++) {
        t = (i / steps) * f;
        xx = lerp(x0, x1, t);
        yy = y + wob[Math.min(8, Math.floor(t * 8))] * Math.sin(t * Math.PI);
        if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
      // loops along the thread
      var loops = wk.days[d];
      var lr = Math.min(rowH * 0.30, 10);
      for (var j = 0; j < loops; j++) {
        var lf = (j + 0.5) / loops;
        if (f < lf) continue;
        var pop = clamp01((f - lf) * loops * 1.6);
        var lx = lerp(x0, x1, lf);
        var ly = y + wob[Math.min(8, Math.floor(lf * 8))] * Math.sin(lf * Math.PI);
        ctx.strokeStyle = CORAL; ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(lx, ly, lr * (0.4 + 0.6 * pop), 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }
  function drawArcs(wk, fr, area) {
    var cx = area.x + area.w / 2;
    var cy = area.y + area.h * 1.02;
    var maxR = Math.min(area.w * 0.47, area.h * 0.98);
    for (var d = 0; d < 7; d++) {
      var f = fr[d];
      if (f <= 0) continue;
      var r = maxR * (d + 1) / 7;
      ctx.strokeStyle = INDIGO; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx, cy, r, Math.PI, Math.PI + f * Math.PI);
      ctx.stroke();
      var ticks = wk.days[d];
      ctx.strokeStyle = MUSTARD; ctx.lineWidth = 2.2;
      for (var j = 0; j < ticks; j++) {
        var tf = (j + 0.5) / ticks;
        if (f < tf) continue;
        var a = Math.PI + tf * Math.PI;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * (r - 5), cy + Math.sin(a) * (r - 5));
        ctx.lineTo(cx + Math.cos(a) * (r + 5), cy + Math.sin(a) * (r + 5));
        ctx.stroke();
      }
    }
  }
  function drawData(wk, collectP, area) {
    var fr = dayFracs(wk, collectP * wk.total);
    if (wk.grammar === 'stems') drawStems(wk, fr, area);
    else if (wk.grammar === 'clusters') drawClusters(wk, fr, area);
    else if (wk.grammar === 'threads') drawThreads(wk, fr, area);
    else drawArcs(wk, fr, area);
  }
  function glyphUnitsShown(wk, collectP) {
    return Math.floor(collectP * wk.total + 0.0001);
  }

  // ---------- legend glyph samples ----------
  function drawSample(grammar, x, y, s, key) {
    ctx.save();
    ctx.translate(x, y);
    ctx.lineCap = 'round';
    if (grammar === 'stems') {
      ctx.strokeStyle = INDIGO; ctx.lineWidth = Math.max(1.4, s * 0.09);
      ctx.beginPath(); ctx.moveTo(0, s * 0.5); ctx.lineTo(0, -s * 0.5); ctx.stroke();
      ctx.strokeStyle = CORAL; ctx.lineWidth = Math.max(1.2, s * 0.07);
      ctx.beginPath();
      for (var i = 0; i <= 30; i++) {
        var t = i / 30;
        var px = Math.sin(t * Math.PI * 4) * s * 0.30;
        var py = s * 0.46 - t * s * 0.92;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    } else if (grammar === 'clusters') {
      ctx.fillStyle = INDIGO;
      ctx.beginPath(); ctx.arc(-s * 0.22, s * 0.12, s * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = MUSTARD;
      ctx.beginPath(); ctx.arc(s * 0.20, -s * 0.06, s * 0.26, 0, Math.PI * 2); ctx.fill();
    } else if (grammar === 'threads') {
      ctx.strokeStyle = CORAL; ctx.lineWidth = Math.max(1.4, s * 0.08);
      ctx.beginPath(); ctx.moveTo(-s * 0.5, 0); ctx.lineTo(s * 0.5, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, s * 0.20, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.strokeStyle = INDIGO; ctx.lineWidth = Math.max(1.4, s * 0.08);
      ctx.beginPath(); ctx.arc(0, s * 0.34, s * 0.42, Math.PI, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = MUSTARD; ctx.lineWidth = Math.max(1.4, s * 0.08);
      for (var j = 0; j < 3; j++) {
        var a = Math.PI + (j + 0.5) / 3 * Math.PI;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * s * 0.32, s * 0.34 + Math.sin(a) * s * 0.32);
        ctx.lineTo(Math.cos(a) * s * 0.52, s * 0.34 + Math.sin(a) * s * 0.52);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---------- stamp and postmark ----------
  function drawStampPostmark(alpha) {
    var st = L.stamp;
    ctx.save();
    ctx.globalAlpha = alpha;
    // stamp body
    ctx.fillStyle = CORAL;
    ctx.fillRect(st.x + 4, st.y + 4, st.w - 8, st.h - 8);
    ctx.fillStyle = MUSTARD;
    ctx.beginPath(); ctx.arc(st.x + st.w * 0.68, st.y + st.h * 0.32, st.w * 0.13, 0, Math.PI * 2); ctx.fill();
    // mini spiral stem on the stamp
    ctx.strokeStyle = INDIGO; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath();
    var bx = st.x + st.w * 0.38, by0 = st.y + st.h * 0.82, bh = st.h * 0.58, i, s, px, py;
    ctx.moveTo(bx, by0); ctx.lineTo(bx, by0 - bh);
    ctx.stroke();
    ctx.strokeStyle = PAPER; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (i = 0; i <= 24; i++) {
      s = i / 24;
      px = bx + Math.sin(s * Math.PI * 5) * st.w * 0.14;
      py = by0 - s * bh;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    // perforated edge
    ctx.strokeStyle = STAMPRED; ctx.lineWidth = 1.6;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(st.x + 1, st.y + 1, st.w - 2, st.h - 2);
    ctx.setLineDash([]);
    // postmark: double circle overlapping the stamp's left edge
    var pmx = st.x - st.w * 0.10, pmy = st.y + st.h * 0.34, pmr = st.w * 0.34;
    ctx.strokeStyle = STAMPRED; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(pmx, pmy, pmr, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(pmx, pmy, pmr * 0.68, 0, Math.PI * 2); ctx.stroke();
    // wavy cancellation lines running left
    ctx.lineWidth = 1.6;
    for (var ln = 0; ln < 3; ln++) {
      var wy = pmy - pmr * 0.5 + ln * pmr * 0.5;
      ctx.beginPath();
      for (i = 0; i <= 26; i++) {
        var t = i / 26;
        px = pmx - pmr * 0.4 - t * st.w * 1.15;
        py = wy + Math.sin(t * Math.PI * 5 + ln) * 2.4;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- card faces ----------
  function cardPath() {
    var c = L.card, r = 7;
    ctx.beginPath();
    ctx.moveTo(c.x + r, c.y);
    ctx.lineTo(c.x + c.w - r, c.y); ctx.arcTo(c.x + c.w, c.y, c.x + c.w, c.y + r, r);
    ctx.lineTo(c.x + c.w, c.y + c.h - r); ctx.arcTo(c.x + c.w, c.y + c.h, c.x + c.w - r, c.y + c.h, r);
    ctx.lineTo(c.x + r, c.y + c.h); ctx.arcTo(c.x, c.y + c.h, c.x, c.y + c.h - r, r);
    ctx.lineTo(c.x, c.y + r); ctx.arcTo(c.x, c.y, c.x + r, c.y, r);
    ctx.closePath();
  }
  function legendSequence(wk, qSize, kSize, sampleS) {
    // items: {text, size, sample:boolean, keyIdx} in writing order
    var items = [];
    var qLines = wrapText(wk.q, qSize, L.legend.w, true);
    var i;
    for (i = 0; i < qLines.length; i++) items.push({ text: qLines[i], size: qSize, bold: true, sample: false });
    for (i = 0; i < KEYS[wk.grammar].length; i++) items.push({ text: KEYS[wk.grammar][i], size: kSize, bold: false, sample: true });
    return items;
  }
  function drawFront(wk, collectP, legendP) {
    var c = L.card;
    ctx.fillStyle = PAPER;
    cardPath(); ctx.fill();
    ctx.save();
    cardPath(); ctx.clip();
    drawData(wk, collectP, L.data);
    // rule between drawing and legend
    ctx.save();
    ctx.globalAlpha = 0.55;
    wobLine(c.x + L.pad * 0.7, L.ruleY, c.x + c.w - L.pad * 0.7, L.ruleY, 'rule' + wk.idx, 1, INK, 1.4);
    ctx.restore();
    // legend band: question then key lines, written in sequence
    var items = legendSequence(wk, L.qSize, L.kSize);
    var widths = [], total = 0, i;
    for (i = 0; i < items.length; i++) {
      var wItem = textWidth(items[i].text, items[i].size, items[i].bold) + (items[i].sample ? L.kSize * 2.4 : 0);
      widths.push(wItem); total += wItem;
    }
    var budget = legendP * total;
    var y = L.legend.y + L.qSize * 1.05;
    for (i = 0; i < items.length; i++) {
      var it = items[i];
      var frac = clamp01(budget / widths[i]);
      var lineH = it.size * 1.42;
      if (it.sample && frac > 0) {
        var ss = it.size * 1.5 * clamp01(frac * 2);
        drawSample(wk.grammar, L.legend.x + it.size * 0.8, y - it.size * 0.34, ss, wk.idx);
      }
      var tx = L.legend.x + (it.sample ? it.size * 2.3 : 0);
      handText(it.text, tx, y, it.size, INK, frac, 'wk' + wk.idx + ':i' + i, it.bold);
      budget -= widths[i];
      y += lineH;
      if (budget <= 0 && i < items.length - 1) {
        // remaining items unwritten; still advance nothing visually
        // (loop continues but frac will be 0)
      }
    }
    drawStampPostmark(1);
    ctx.restore();
    // card edge
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.5;
    cardPath(); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function drawBack(wk) {
    var c = L.card;
    ctx.fillStyle = PAPER;
    cardPath(); ctx.fill();
    ctx.save();
    cardPath(); ctx.clip();
    drawStampPostmark(0.55);
    var qSize = clamp(c.w * 0.062, 24, 46);
    var kSize = clamp(c.w * 0.034, 15, 26);
    var x = c.x + L.pad * 1.2, y = c.y + L.pad + qSize * 1.1;
    var qLines = wrapText(wk.q, qSize, c.w - L.pad * 2.4, true);
    var i;
    for (i = 0; i < qLines.length; i++) {
      handText(qLines[i], x, y, qSize, INK, 1, 'back-q' + wk.idx + ':' + i, true);
      y += qSize * 1.35;
    }
    y += qSize * 0.5;
    ctx.save();
    ctx.globalAlpha = 0.55;
    wobLine(x, y - qSize * 0.45, c.x + c.w - L.pad * 1.2, y - qSize * 0.45, 'back-rule' + wk.idx, 1, INK, 1.4);
    ctx.restore();
    var keys = KEYS[wk.grammar];
    for (i = 0; i < keys.length; i++) {
      drawSample(wk.grammar, x + kSize * 1.1, y + kSize * 0.6, kSize * 2.0, wk.idx);
      handText(keys[i], x + kSize * 2.9, y + kSize * 0.95, kSize, INK, 1, 'back-k' + wk.idx + ':' + i, false);
      y += kSize * 2.1;
    }
    // sign-off
    var sSize = clamp(c.w * 0.026, 12, 20);
    var sw = textWidth(SIGNOFF, sSize, false);
    handText(SIGNOFF, c.x + c.w - L.pad * 1.2 - sw, c.y + c.h - L.pad * 0.9, sSize, INK, 1, 'signoff', false);
    ctx.restore();
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.5;
    cardPath(); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- postal wipe ----------
  function drawWipe(wk, wipeFrac) {
    var c = L.card;
    var front = c.x - 6 + wipeFrac * (c.w + 12);
    ctx.save();
    cardPath(); ctx.clip();
    ctx.fillStyle = PAPER;
    ctx.beginPath();
    ctx.moveTo(c.x - 2, c.y - 2);
    ctx.lineTo(front, c.y - 2);
    var steps = 40, i, yy;
    for (i = 0; i <= steps; i++) {
      yy = c.y - 2 + (i / steps) * (c.h + 4);
      ctx.lineTo(front + Math.sin(i * 1.7 + wk.idx) * 5, yy);
    }
    ctx.lineTo(c.x - 2, c.y + c.h + 2);
    ctx.closePath();
    ctx.fill();
    // cancellation waves riding the front
    ctx.strokeStyle = STAMPRED; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    for (var ln = 0; ln < 3; ln++) {
      ctx.beginPath();
      for (i = 0; i <= steps; i++) {
        yy = c.y + c.h * (0.30 + ln * 0.2) + Math.sin(i * 0.9 + ln * 2) * 4;
        var xx = front - 46 + (i / steps) * 40;
        if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- main draw (pure in e, recorded events, tilt state) ----------
  function draw(e) {
    curElapsed = e;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    var v = virtualTime(e);
    var wi = Math.floor(v / WEEK_LEN);
    var phase = v - wi * WEEK_LEN;
    var wk = genWeek(wi);
    var collectP = clamp01(phase / COLLECT_LEN);
    var legendP = clamp01((phase - LEGEND_START) / LEGEND_LEN);
    var wipeFrac = phase >= WIPE_START ? clamp01((phase - WIPE_START) / (WEEK_LEN - WIPE_START)) : 0;

    // live sound bookkeeping (no visual effect)
    if (audioOn) {
      var shown = glyphUnitsShown(wk, collectP);
      if (lastWeekIdx !== -1 && wi !== lastWeekIdx) thump();
      if (shown > lastUnitsShown && phase < COLLECT_LEN && lastUnitsShown !== -1) { tickCount++; pencilTick(); }
      lastUnitsShown = shown;
    }
    lastWeekIdx = wi;

    var fs = flipState(e);
    var c = L.card, ccx = c.x + c.w / 2, ccy = c.y + c.h / 2;

    // tilt settle (closed-form from release record)
    var sk = tilt.skew, sh = tilt.shift, sheenX = tilt.sheen;
    if (!tilt.active && tilt.releaseT > 0) {
      var dt = e - tilt.releaseT;
      var decay = Math.exp(-dt / 0.45);
      sk = tilt.relSkew * decay;
      sh = tilt.relShift * decay;
      sheenX = 0.5 + (tilt.relSheen - 0.5) * decay;
    }

    ctx.save();
    ctx.translate(ccx, ccy);
    var sx = fs.prog >= 1 ? 1 : Math.abs(Math.cos(fs.prog * Math.PI));
    if (sx < 0.001) sx = 0.001;
    ctx.transform(sx, 0, sk * sx, 1 - 0.05 * Math.sin(fs.prog * Math.PI), sh, 0);
    ctx.translate(-ccx, -ccy);

    if (fs.showBack) drawBack(wk);
    else {
      drawFront(wk, collectP, legendP);
      if (wipeFrac > 0) drawWipe(wk, wipeFrac);
    }

    // sheen wedge while tilted
    if (Math.abs(sk) > 0.004 || Math.abs(sh) > 0.004 || tilt.active) {
      ctx.save();
      cardPath(); ctx.clip();
      var sxp = c.x + sheenX * c.w;
      ctx.fillStyle = WHITE;
      ctx.globalAlpha = 0.10;
      ctx.beginPath();
      ctx.moveTo(sxp - c.w * 0.16, c.y - 8);
      ctx.lineTo(sxp + c.w * 0.05, c.y - 8);
      ctx.lineTo(sxp - c.w * 0.05 + sh * 40, c.y + c.h + 8);
      ctx.lineTo(sxp - c.w * 0.26 + sh * 40, c.y + c.h + 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    // flip shading
    if (fs.prog < 1 && fs.n > 0) {
      ctx.save();
      cardPath(); ctx.clip();
      ctx.fillStyle = INK;
      ctx.globalAlpha = 0.16 * Math.sin(fs.prog * Math.PI);
      ctx.fillRect(c.x, c.y, c.w, c.h);
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------- pointer interaction ----------
  var pDown = null, lastTapT = -10, pendingFlip = null;
  function evtPos(ev) {
    var r = (typeof canvas.getBoundingClientRect === 'function') ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (typeof ev.clientX === 'number' ? ev.clientX : 0) - r.left;
    var y = (typeof ev.clientY === 'number' ? ev.clientY : 0) - r.top;
    return { x: x, y: y };
  }
  function onDown(ev) {
    ensureAudio();
    if (AC && AC.resume) { try { AC.resume(); } catch (err) {} }
    var p = evtPos(ev);
    pDown = { x: p.x, y: p.y, t: curElapsed, dragged: false };
  }
  function onMove(ev) {
    if (!pDown) return;
    var p = evtPos(ev);
    var dx = p.x - pDown.x, dy = p.y - pDown.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) pDown.dragged = true;
    if (pDown.dragged) {
      var c = L.card;
      tilt.active = true;
      tilt.skew = clamp(dx / c.w, -0.14, 0.14);
      tilt.shift = clamp(dy / c.h, -0.10, 0.10) * 6;
      tilt.sheen = clamp(0.5 + dx / c.w * 0.9, 0.05, 0.95);
    }
  }
  function onUp(ev) {
    if (!pDown) return;
    var wasDrag = pDown.dragged, downT = pDown.t;
    pDown = null;
    if (wasDrag) {
      tilt.active = false;
      tilt.releaseT = curElapsed;
      tilt.relSkew = tilt.skew; tilt.relShift = tilt.shift; tilt.relSheen = tilt.sheen;
      return;
    }
    if (curElapsed - downT > 0.45) return; // long press: not a tap
    // tap: double or single?
    if (curElapsed - lastTapT < 0.35) {
      lastTapT = -10;
      if (pendingFlip !== null && typeof clearTimeout === 'function') { clearTimeout(pendingFlip); pendingFlip = null; }
      SKIPS.push(curElapsed);
      thump();
    } else {
      lastTapT = curElapsed;
      if (typeof setTimeout === 'function') {
        pendingFlip = setTimeout(function () {
          FLIPS.push(curElapsed);
          swish();
          pendingFlip = null;
        }, 340);
      } else {
        FLIPS.push(curElapsed);
        swish();
      }
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { pDown = null; tilt.active = false; });
    canvas.addEventListener('mousedown', function (ev) { if (!window.PointerEvent) onDown(ev); });
    canvas.addEventListener('mousemove', function (ev) { if (!window.PointerEvent) onMove(ev); });
    canvas.addEventListener('mouseup', function (ev) { if (!window.PointerEvent) onUp(ev); });
  }

  // ---------- boot + loop ----------
  resize();
  draw(0);
  var startTs = null;
  function tick(ts) {
    if (startTs === null) startTs = ts;
    draw((ts - startTs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
</body>
</html>
