<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mapocho Course</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #10181A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.681 "Mapocho Course" (EXPANSION #83 lachimuchina, block 1).
  // The ensemble's river-course composition made visible: one river
  // runs diagonally from the high Andes (upper-left) to the city and
  // the sea (lower-right), and every visual parameter is bound to the
  // course parameter t in [0,1]. Agent speed falls downstream, so
  // density grows as 1/v: a handful of bright, quick, crystalline
  // darts at the headwaters, clumping stone arcs mid-course, and a
  // crowd of heavy, dark, slow disks at the mouth. Banks change with
  // the course too: snow-blue cliffs, ochre urban blocks, flat slate.
  // Watch-only flow; dragging across the water drops a stone in the
  // river: a vortex swirls the agents and travels downstream.
  // No hero, no labels, no text. Anti-protagonism is the rule.

  var SNOW  = '#DCEBF2';  // snow water
  var HEAD  = '#5B8FA6';  // headwater blue
  var STONE = '#8A7F6A';  // mid-river stone
  var OCHRE = '#B0682E';  // urban block
  var HAZE  = '#6E6E66';  // city haze
  var SLATE = '#2B3538';  // estuary slate
  var NIGHT = '#10181A';  // night channel / page ground

  var BASE_SEED = 681001;
  var STEPS = 600;        // path table resolution
  var SEG = 110;          // strip segments along the course
  var BAND = 0.034;       // bank band width in composition units
  var NAGENTS = 90;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mixc(h1, h2, t) {
    var a = hexRGB(h1), b = hexRGB(h2);
    return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' +
      Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
  }
  // Array-space mixing: colors that are themselves mixes must be
  // combined as [r,g,b] arrays, never re-parsed as hex strings.
  function mixA(a, b, t) {
    return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  }
  function css(a) {
    return 'rgb(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ')';
  }
  var SNOW_A = hexRGB(SNOW), HEAD_A = hexRGB(HEAD), STONE_A = hexRGB(STONE),
      OCHRE_A = hexRGB(OCHRE), HAZE_A = hexRGB(HAZE), SLATE_A = hexRGB(SLATE),
      NIGHT_A = hexRGB(NIGHT);

  // ------------------------------------------------------------------
  // THE COURSE. Control points in composition space (x right, y
  // down), source at the upper-left corner, mouth at the lower-right.
  // A Catmull-Rom spline runs through them, resampled uniformly by
  // arc length into PATH; the table index fraction IS the course
  // parameter t. Tangents and left normals are stored per sample.
  // ------------------------------------------------------------------
  var WAY = [
    [0.05, 0.06], [0.20, 0.10], [0.33, 0.22], [0.38, 0.38],
    [0.47, 0.52], [0.62, 0.60], [0.75, 0.70], [0.85, 0.82],
    [0.95, 0.94]
  ];
  var PATH = [];
  (function buildPath() {
    var raw = [];
    var n = WAY.length;
    function pt(i) { return WAY[clamp(i, 0, n - 1)]; }
    var i, j;
    for (i = 0; i < n - 1; i++) {
      var p0 = pt(i - 1), p1 = pt(i), p2 = pt(i + 1), p3 = pt(i + 2);
      for (j = 0; j < 32; j++) {
        var u = j / 32, u2 = u * u, u3 = u2 * u;
        raw.push([
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[0]) * u3)
        ]);
      }
    }
    raw.push([WAY[n - 1][0], WAY[n - 1][1]]);
    var cum = [0];
    for (i = 1; i < raw.length; i++) {
      cum.push(cum[i - 1] + Math.hypot(raw[i][0] - raw[i - 1][0], raw[i][1] - raw[i - 1][1]));
    }
    var total = cum[cum.length - 1];
    var seg = 0;
    for (i = 0; i <= STEPS; i++) {
      var target = total * i / STEPS;
      while (seg < raw.length - 2 && cum[seg + 1] < target) seg++;
      var span = Math.max(1e-9, cum[seg + 1] - cum[seg]);
      var f = clamp((target - cum[seg]) / span, 0, 1);
      PATH.push({
        x: lerp(raw[seg][0], raw[seg + 1][0], f),
        y: lerp(raw[seg][1], raw[seg + 1][1], f)
      });
    }
    for (i = 0; i <= STEPS; i++) {
      var a = PATH[Math.max(0, i - 1)], b = PATH[Math.min(STEPS, i + 1)];
      var dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.max(1e-9, Math.hypot(dx, dy));
      PATH[i].tx = dx / len; PATH[i].ty = dy / len;
      PATH[i].nx = -dy / len; PATH[i].ny = dx / len;
    }
  })();
  function pathPoint(s) {
    var f = clamp(s, 0, 1) * STEPS;
    var i = Math.min(STEPS - 1, Math.floor(f));
    var r = f - i;
    var a = PATH[i], b = PATH[i + 1];
    return {
      x: lerp(a.x, b.x, r), y: lerp(a.y, b.y, r),
      tx: lerp(a.tx, b.tx, r), ty: lerp(a.ty, b.ty, r),
      nx: lerp(a.nx, b.nx, r), ny: lerp(a.ny, b.ny, r)
    };
  }
  function halfW(s) { return 0.016 + 0.038 * Math.pow(s, 1.3); }

  // ------------------------------------------------------------------
  // FLOW. Agent course speed v(s) falls downstream; the travel-time
  // table TAU(s) = integral of ds / v(s) turns a uniform phase into
  // a course position, so steady-state density is proportional to
  // 1/v: sparse at the source, crowded at the mouth, from frame one.
  // One full traverse takes T_TOTAL seconds (about a minute).
  // ------------------------------------------------------------------
  function speedAt(s) { return 0.008 + 0.05 * (1 - s) * (1 - s); }
  var TAU = [0];
  (function buildTau() {
    for (var i = 1; i <= STEPS; i++) {
      var s0 = (i - 1) / STEPS, s1 = i / STEPS;
      TAU.push(TAU[i - 1] + (s1 - s0) * 0.5 * (1 / speedAt(s0) + 1 / speedAt(s1)));
    }
  })();
  var T_TOTAL = TAU[STEPS];
  function courseAtTravel(u) {
    u = ((u % T_TOTAL) + T_TOTAL) % T_TOTAL;
    var lo = 0, hi = STEPS;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (TAU[mid] < u) lo = mid + 1; else hi = mid;
    }
    var i = Math.max(1, lo);
    var span = Math.max(1e-9, TAU[i] - TAU[i - 1]);
    return (i - 1 + clamp((u - TAU[i - 1]) / span, 0, 1)) / STEPS;
  }

  // ------------------------------------------------------------------
  // ZONE COLORS. Everything is a function of the course parameter.
  // ------------------------------------------------------------------
  function waterColorA(s) {
    var c = mixA(HEAD_A, STONE_A, smooth(0.30, 0.55, s));
    c = mixA(c, SLATE_A, smooth(0.72, 0.95, s));
    return mixA(SNOW_A, c, smooth(0.0, 0.18, s));
  }
  function waterColor(s) { return css(waterColorA(s)); }
  function bankColor(s, k) {
    // k = 0 innermost band, 2 outermost.
    var head = mixA(HEAD_A, SNOW_A, 0.25 + 0.30 * k);
    var urb = (k === 0) ? OCHRE_A : mixA(OCHRE_A, HAZE_A, 0.35 + 0.30 * (k - 1));
    var wH = 1 - smooth(0.28, 0.44, s);
    var wE = smooth(0.72, 0.88, s);
    var wU = Math.max(0, 1 - wH - wE);
    return css([
      head[0] * wH + urb[0] * wU + SLATE_A[0] * wE,
      head[1] * wH + urb[1] * wU + SLATE_A[1] * wE,
      head[2] * wH + urb[2] * wU + SLATE_A[2] * wE
    ]);
  }

  // Bank ridge noise: seeded phases per side and band level. The
  // estuary flattens the ridges out (flat slate).
  var ridgeSeed = mulberry32(BASE_SEED + 11);
  var RIDGE = [];
  for (var ri = 0; ri < 8; ri++) {
    RIDGE.push({ a: ridgeSeed() * Math.PI * 2, b: ridgeSeed() * Math.PI * 2, f: 2.2 + ridgeSeed() * 1.6 });
  }
  function ridgeR(s, k, side) {
    // Level 0 is the channel edge itself: no noise, so the innermost
    // bank always meets the water. Noise lives on the outer levels.
    if (k === 0) return halfW(s);
    var r = RIDGE[(side > 0 ? 4 : 0) + k];
    var flat = 1 - smooth(0.74, 0.92, s);
    var nse = 0.6 * Math.sin(Math.PI * 2 * r.f * s + r.a) +
              0.4 * Math.sin(Math.PI * 2 * r.f * 2.7 * s + r.b);
    return halfW(s) + k * BAND + BAND * 0.38 * nse * flat;
  }

  // Urban block texture: small seeded rectangles sitting on the
  // mid-course banks. Static, precomputed.
  var BLOCKS = [];
  (function buildBlocks() {
    var rnd = mulberry32(BASE_SEED + 23);
    for (var i = 0; i < 54; i++) {
      BLOCKS.push({
        s: 0.42 + rnd() * 0.28,
        side: rnd() < 0.5 ? -1 : 1,
        band: Math.floor(rnd() * 3),
        off: 0.15 + rnd() * 0.7,
        w: 0.010 + rnd() * 0.015,
        h: 0.008 + rnd() * 0.011,
        ochre: rnd() < 0.62,
        alpha: 0.35 + rnd() * 0.35
      });
    }
  })();
  // Snow ticks on the headwater cliffs.
  var TICKS = [];
  (function buildTicks() {
    var rnd = mulberry32(BASE_SEED + 37);
    for (var i = 0; i < 44; i++) {
      TICKS.push({
        s: 0.02 + rnd() * 0.28,
        side: rnd() < 0.5 ? -1 : 1,
        band: 1 + Math.floor(rnd() * 2),
        off: rnd(),
        len: 0.008 + rnd() * 0.009,
        alpha: 0.30 + rnd() * 0.30
      });
    }
  })();

  // ------------------------------------------------------------------
  // AGENTS. Each agent is a pure function of time: a travel phase
  // offset, a seeded lateral berth, a home lane for the mid-course
  // clumping, and glyph seeds. The glyph morphs with s: darting
  // segment (headwaters) to rotating arc (mid-course) to swirling
  // disk (mouth), crossfaded by smooth weights.
  // ------------------------------------------------------------------
  var AGENTS = [];
  (function buildAgents() {
    var rnd = mulberry32(BASE_SEED + 51);
    for (var i = 0; i < NAGENTS; i++) {
      AGENTS.push({
        phase: (i + 0.15 + 0.7 * rnd()) / NAGENTS,
        lat: (rnd() * 2 - 1) * 0.72,
        lane: (Math.floor(rnd() * 3) - 1) * 0.38,
        seed: rnd() * Math.PI * 2,
        spin: 0.5 + rnd() * 0.9,
        size: 0.8 + rnd() * 0.45
      });
    }
  })();
  // Water surface streaks: faster than the agents, pure phase too.
  var STREAKS = [];
  (function buildStreaks() {
    var rnd = mulberry32(BASE_SEED + 67);
    for (var i = 0; i < 24; i++) {
      STREAKS.push({
        phase: rnd(),
        lat: (rnd() * 2 - 1) * 0.5,
        len: 0.7 + rnd() * 0.6
      });
    }
  })();

  // ------------------------------------------------------------------
  // VORTICES. A drag drops a stone in the river: the vortex is
  // recorded with the anchored time of the gesture, sits at the
  // projected course position, and travels downstream as it ages.
  // Agent displacement is a pure function of time and this history.
  // ------------------------------------------------------------------
  var vortices = [];
  function nearestCourse(x, y) {
    var best = 0, bd = 1e9, i, d;
    for (i = 0; i <= STEPS; i += 4) {
      d = (PATH[i].x - x) * (PATH[i].x - x) + (PATH[i].y - y) * (PATH[i].y - y);
      if (d < bd) { bd = d; best = i; }
    }
    var lo = Math.max(0, best - 4), hi = Math.min(STEPS, best + 4);
    for (i = lo; i <= hi; i++) {
      d = (PATH[i].x - x) * (PATH[i].x - x) + (PATH[i].y - y) * (PATH[i].y - y);
      if (d < bd) { bd = d; best = i; }
    }
    var p = PATH[best];
    var lat = ((x - p.x) * p.nx + (y - p.y) * p.ny) / Math.max(1e-6, halfW(best / STEPS));
    return { s: best / STEPS, lat: clamp(lat, -1.4, 1.4) };
  }
  function vortexCenter(v, t) {
    var age = t - v.t0;
    var s = Math.min(1, v.s + 0.028 * age);
    var p = pathPoint(s);
    return { x: p.x + p.nx * v.lat * halfW(s) * 0.6, y: p.y + p.ny * v.lat * halfW(s) * 0.6, s: s };
  }
  function swirlOffset(x, y, t) {
    var ox = 0, oy = 0;
    for (var i = 0; i < vortices.length; i++) {
      var v = vortices[i];
      var age = t - v.t0;
      if (age < 0 || age > 4) continue;
      var c = vortexCenter(v, t);
      var dx = x - c.x, dy = y - c.y;
      var dist = Math.hypot(dx, dy);
      var R = 0.10;
      if (dist < R && dist > 1e-5) {
        var env = Math.sin(Math.PI * age / 4);
        var th = 2.4 * env * (1 - dist / R);
        var cs = Math.cos(th), sn = Math.sin(th);
        ox += (dx * cs - dy * sn) - dx;
        oy += (dx * sn + dy * cs) - dy;
      }
    }
    return { x: ox, y: oy };
  }

  // ------------------------------------------------------------------
  // Canvas, sizing, house rules.
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var scale = 1, orgX = 0, orgY = 0;
  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    scale = Math.min(W, H);
    orgX = (W - scale) / 2;
    orgY = (H - scale) / 2;
  }
  function px(x) { return orgX + x * scale; }
  function py(y) { return orgY + y * scale; }
  function toComp(clientX, clientY) {
    return { x: (clientX - orgX) / scale, y: (clientY - orgY) / scale };
  }

  // ------------------------------------------------------------------
  // Drawing. Strips are drawn as per-segment quads so color and
  // width can follow the course parameter exactly.
  // ------------------------------------------------------------------
  function stripQuad(s0, s1, r0Fn, r1Fn, side, color, alpha) {
    var a = pathPoint(s0), b = pathPoint(s1);
    var rA0 = r0Fn(s0), rA1 = r1Fn(s0), rB0 = r0Fn(s1), rB1 = r1Fn(s1);
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(px(a.x + a.nx * side * rA0), py(a.y + a.ny * side * rA0));
    ctx.lineTo(px(b.x + b.nx * side * rB0), py(b.y + b.ny * side * rB0));
    ctx.lineTo(px(b.x + b.nx * side * rB1), py(b.y + b.ny * side * rB1));
    ctx.lineTo(px(a.x + a.nx * side * rA1), py(a.y + a.ny * side * rA1));
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function drawBanks() {
    var sides = [-1, 1], k, i;
    for (var si = 0; si < 2; si++) {
      var side = sides[si];
      for (k = 2; k >= 0; k--) {
        (function (k) {
          var rIn = function (s) { return ridgeR(s, k, side); };
          var rOut = function (s) { return ridgeR(s, k + 1, side); };
          var alpha = k === 0 ? 1.0 : (k === 1 ? 0.9 : 0.78);
          for (i = 0; i < SEG; i++) {
            var s0 = i / SEG, s1 = (i + 1) / SEG;
            stripQuad(s0, s1, rIn, rOut, side, bankColor((s0 + s1) / 2, k), alpha);
          }
        })(k);
      }
    }
  }
  function drawBlocksAndTicks() {
    var i, b, p, r, cx, cy, ang;
    for (i = 0; i < BLOCKS.length; i++) {
      b = BLOCKS[i];
      p = pathPoint(b.s);
      r = ridgeR(b.s, b.band, b.side) + (ridgeR(b.s, b.band + 1, b.side) - ridgeR(b.s, b.band, b.side)) * b.off;
      cx = p.x + p.nx * b.side * r;
      cy = p.y + p.ny * b.side * r;
      ang = Math.atan2(p.ty, p.tx);
      ctx.save();
      ctx.translate(px(cx), py(cy));
      ctx.rotate(ang);
      ctx.fillStyle = b.ochre ? OCHRE : HAZE;
      ctx.globalAlpha = b.alpha;
      ctx.fillRect(-b.w * scale / 2, -b.h * scale / 2, b.w * scale, b.h * scale);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    ctx.lineCap = 'round';
    for (i = 0; i < TICKS.length; i++) {
      var tk = TICKS[i];
      p = pathPoint(tk.s);
      r = ridgeR(tk.s, tk.band, tk.side) + (ridgeR(tk.s, tk.band + 1, tk.side) - ridgeR(tk.s, tk.band, tk.side)) * tk.off;
      cx = p.x + p.nx * tk.side * r;
      cy = p.y + p.ny * tk.side * r;
      ctx.strokeStyle = SNOW;
      ctx.globalAlpha = tk.alpha;
      ctx.lineWidth = Math.max(1, 0.0022 * scale);
      ctx.beginPath();
      ctx.moveTo(px(cx - p.tx * tk.len / 2), py(cy - p.ty * tk.len / 2));
      ctx.lineTo(px(cx + p.tx * tk.len / 2), py(cy + p.ty * tk.len / 2));
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  function drawChannel() {
    var i;
    var zero = function () { return 0; };
    var full = function (s) { return halfW(s); };
    var mid = function (s) { return halfW(s) * 0.62; };
    var sides = [-1, 1];
    for (var si = 0; si < 2; si++) {
      var side = sides[si];
      for (i = 0; i < SEG; i++) {
        var s0 = i / SEG, s1 = (i + 1) / SEG, sm = (s0 + s1) / 2;
        stripQuad(s0, s1, zero, full, side, css(mixA(NIGHT_A, waterColorA(sm), 0.22)), 1);
      }
      for (i = 0; i < SEG; i++) {
        var t0 = i / SEG, t1 = (i + 1) / SEG, tm = (t0 + t1) / 2;
        stripQuad(t0, t1, zero, mid, side, waterColor(tm), 0.85);
      }
    }
  }
  function drawStreaks(t) {
    ctx.lineCap = 'round';
    for (var i = 0; i < STREAKS.length; i++) {
      var st = STREAKS[i];
      var s = courseAtTravel(st.phase * T_TOTAL + t * 1.5);
      var fade = smooth(0, 0.03, s) * (1 - smooth(0.96, 1, s));
      if (fade <= 0.01) continue;
      var p = pathPoint(s);
      var cx = p.x + p.nx * st.lat * halfW(s);
      var cy = p.y + p.ny * st.lat * halfW(s);
      var len = 0.030 * st.len * (1 - 0.5 * s);
      ctx.strokeStyle = css(mixA(waterColorA(s), SNOW_A, 0.35 * (1 - s)));
      ctx.globalAlpha = 0.30 * fade;
      ctx.lineWidth = Math.max(1, 0.0026 * scale);
      ctx.beginPath();
      ctx.moveTo(px(cx - p.tx * len / 2), py(cy - p.ty * len / 2));
      ctx.lineTo(px(cx + p.tx * len / 2), py(cy + p.ty * len / 2));
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  function drawAgents(t, breath) {
    ctx.lineCap = 'round';
    for (var i = 0; i < AGENTS.length; i++) {
      var a = AGENTS[i];
      var s = courseAtTravel(a.phase * T_TOTAL + t);
      var fade = smooth(0, 0.015, s) * (1 - smooth(0.972, 1, s));
      if (fade <= 0.01) continue;
      var segW = 1 - smooth(0.30, 0.44, s);
      var diskW = smooth(0.64, 0.80, s);
      var arcW = clamp(1 - segW - diskW, 0, 1);
      var p = pathPoint(s);
      var lat = lerp(a.lat, a.lane, 0.55 * arcW);
      var bx = p.x + p.nx * lat * halfW(s) * 0.82;
      var by = p.y + p.ny * lat * halfW(s) * 0.82;
      // Headwater darting: quick jitter along the tangent.
      var dart = Math.sin(t * 7 + a.seed * 3.1) * 0.006 * segW;
      bx += p.tx * dart; by += p.ty * dart;
      // Mouth swirl: a slow small orbit.
      var sw = 0.0085 * diskW;
      bx += Math.cos(t * 0.9 * a.spin + a.seed) * sw;
      by += Math.sin(t * 0.9 * a.spin + a.seed) * sw;
      // Drag vortices bend the position around their center.
      var off = swirlOffset(bx, by, t);
      bx += off.x; by += off.y;
      var X = px(bx), Y = py(by);
      var alpha = fade * breath;
      if (segW > 0.02) {
        var L = 0.021 * a.size * (0.75 + 0.35 * Math.sin(t * 9 + a.seed * 5.0));
        ctx.strokeStyle = mixc(SNOW, HEAD, smooth(0, 0.35, s));
        ctx.globalAlpha = alpha * segW * 0.95;
        ctx.lineWidth = Math.max(1, 0.0034 * scale);
        ctx.beginPath();
        ctx.moveTo(X - p.tx * L * scale / 2, Y - p.ty * L * scale / 2);
        ctx.lineTo(X + p.tx * L * scale / 2, Y + p.ty * L * scale / 2);
        ctx.stroke();
        ctx.fillStyle = SNOW;
        ctx.beginPath();
        ctx.arc(X + p.tx * L * scale / 2, Y + p.ty * L * scale / 2, Math.max(0.6, 0.0022 * scale), 0, Math.PI * 2);
        ctx.fill();
      }
      if (arcW > 0.02) {
        var rr = (0.0062 + 0.0038 * Math.sin(a.seed * 7.0)) * a.size;
        var rot = t * 0.7 * a.spin + a.seed;
        ctx.strokeStyle = mixc(STONE, HAZE, 0.35);
        ctx.globalAlpha = alpha * arcW * 0.9;
        ctx.lineWidth = Math.max(1, 0.0030 * scale);
        ctx.beginPath();
        ctx.arc(X, Y, rr * scale, rot, rot + 4.2);
        ctx.stroke();
      }
      if (diskW > 0.02) {
        var dr = (0.0048 + 0.0062 * smooth(0.7, 1, s)) * a.size;
        ctx.fillStyle = mixc(SLATE, NIGHT, 0.30);
        ctx.globalAlpha = alpha * diskW * 0.95;
        ctx.beginPath();
        ctx.arc(X, Y, dr * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = STONE;
        ctx.globalAlpha = alpha * diskW * 0.28;
        ctx.lineWidth = Math.max(1, 0.0016 * scale);
        ctx.beginPath();
        ctx.arc(X, Y, dr * scale, t * 0.5 * a.spin + a.seed, t * 0.5 * a.spin + a.seed + 3.6);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
  function drawVortexRings(t) {
    for (var i = 0; i < vortices.length; i++) {
      var v = vortices[i];
      var age = t - v.t0;
      if (age < 0 || age > 4) continue;
      var c = vortexCenter(v, t);
      var env = Math.sin(Math.PI * age / 4);
      ctx.strokeStyle = SNOW;
      ctx.globalAlpha = 0.22 * env;
      ctx.lineWidth = Math.max(1, 0.002 * scale);
      ctx.beginPath();
      ctx.arc(px(c.x), py(c.y), (0.018 + age * 0.026) * scale, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ------------------------------------------------------------------
  // Interaction: drag across the water drops stones in the river.
  // Gestures are recorded with anchored elapsed times; nothing here
  // reloads or resets the piece.
  // ------------------------------------------------------------------
  var dragging = false;
  var lastVortexAt = -1;
  function evtPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e && e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return null;
  }
  function dropStone(e, force) {
    var pos = evtPos(e);
    if (!pos) return;
    var now = elapsed();
    if (!force && now - lastVortexAt < 0.10) return;
    lastVortexAt = now;
    var c = toComp(pos.x, pos.y);
    var nc = nearestCourse(c.x, c.y);
    vortices.push({ s: nc.s, lat: nc.lat, t0: now });
    if (vortices.length > 24) vortices.splice(0, vortices.length - 24);
  }
  function onDown(e) { dragging = true; dropStone(e, true); if (e && e.preventDefault) e.preventDefault(); }
  function onMove(e) { if (dragging) dropStone(e, false); }
  function onUp() { dragging = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('touchstart', onDown);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onUp);
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  // ------------------------------------------------------------------
  // Clock and main draw. Frame one is an explicit synchronous draw
  // at t = 0 with agents at their seeded course positions. Agent
  // positions are pure functions of the anchored elapsed time;
  // nothing reads Date.now().
  // ------------------------------------------------------------------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - t0) / 1000;
    }
    return 0;
  }
  function draw(tOverride) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var t = (typeof tOverride === 'number') ? tOverride : elapsed();
    // Prune spent vortices (live clock only; the headless frame is
    // vortex-free by construction).
    if (typeof tOverride !== 'number') {
      for (var i = vortices.length - 1; i >= 0; i--) {
        if (t - vortices[i].t0 > 4.5) vortices.splice(i, 1);
      }
    }
    var breath = 0.90 + 0.10 * Math.sin(Math.PI * 2 * t / 48 - Math.PI / 2);
    ctx.fillStyle = NIGHT;
    ctx.fillRect(0, 0, W, H);
    drawBanks();
    drawBlocksAndTicks();
    drawChannel();
    drawStreaks(t);
    drawAgents(t, breath);
    drawVortexRings(t);
  }

  // QA hook: ?seed=t<seconds> forces a fixed frame time so later
  // states of the flow can be rendered headlessly.
  var forcedT = -1;
  try {
    var m = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(
      (typeof location !== 'undefined' && location.search) || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (err) { forcedT = -1; }

  resize();
  draw(forcedT >= 0 ? forcedT : 0);
  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
