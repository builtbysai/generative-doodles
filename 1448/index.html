<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Costume Is the Body</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #14524a; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1448000);

  // Feather layout, seeded once: phase, length jitter, colour index.
  var FEATHER_COLORS = ['#d81a2a', '#e8a81a', '#1a9aaa', '#c81a6a', '#f2ead8'];
  function featherSpec(n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push({
        phase: rng() * Math.PI * 2,
        len: 0.85 + rng() * 0.3,
        col: FEATHER_COLORS[Math.floor(rng() * FEATHER_COLORS.length)]
      });
    }
    return out;
  }
  var crestFeathers = featherSpec(7);
  var shoulderL = featherSpec(5);
  var shoulderR = featherSpec(5);
  var hemFeathers = featherSpec(9);

  // Recorded drag events (closed-form state: everything is a function of
  // this list and t, never frame-integrated).
  var events = []; // {t0, kind: 'ripple'|'hem', amt}
  var dragging = false, lastX = 0, lastY = 0;

  function rippleAt(t) {
    var s = 0;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.kind === 'ripple' && t >= e.t0) s += e.amt * Math.exp(-(t - e.t0) / 1.5);
    }
    return Math.min(s, 1.2);
  }
  function hemLiftAt(t) {
    var s = 0;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.kind === 'hem' && t >= e.t0) s += e.amt * Math.exp(-(t - e.t0) / 2.0);
    }
    return Math.min(s, 1);
  }

  // Gesture window: one small gesture per 8 s block, alternating.
  function gestureAt(t) {
    var block = Math.floor(t / 8) % 2;
    var p = t % 8;
    var a = 0;
    if (p < 1) a = p;
    else if (p < 2.5) a = 1;
    else if (p < 3.5) a = 1 - (p - 2.5);
    return { kind: block, amt: a };
  }

  function round4(x) {
    return Math.round(x * 10000) / 10000;
  }

  function drawFeather(x, y, len, wid, ang, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(0, -len / 2, wid / 2, len / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw(t) {
    var vw = (typeof window !== 'undefined' && window.visualViewport)
      ? window.visualViewport.width : window.innerWidth;
    var vh = (typeof window !== 'undefined' && window.visualViewport)
      ? window.visualViewport.height : window.innerHeight;
    var w = vw, h = vh;
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    var cx = w / 2;
    // Costume scale fits height (~75%) and, on narrow phones, width too,
    // so the feather fans never clip at the frame edges.
    var H = Math.min(h * 0.75, w * 1.05);
    var top = (h - H) / 2 - h * 0.03; // crest top, near-vertical-center
    var hemY = top + H;            // skirt hem
    var waistY = top + H * 0.42;
    var shoulderY = top + H * 0.20;
    var s = H;
    var ripple = rippleAt(t);
    var hemLift = hemLiftAt(t);
    var gest = gestureAt(t);
    var sway = Math.sin(t * Math.PI * 2 / 6) * 0.03 * s + ripple * 0.02 * s;
    var breathe = 1 + 0.005 * Math.sin(t * Math.PI * 2 / 5);

    // Backdrop + floor.
    ctx.fillStyle = '#14524a';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#cfc8bc';
    ctx.fillRect(0, h * 0.70, w, h * 0.30);

    // Soft ground shadow under the stand.
    ctx.fillStyle = '#5a4a34';
    ctx.beginPath();
    ctx.ellipse(cx, h * 0.885, s * 0.22, s * 0.02, 0, 0, Math.PI * 2);
    ctx.fill();

    // Stand: pole + base (dark wood), visible below the hem.
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(cx - s * 0.012, hemY - s * 0.02, s * 0.024, h * 0.885 - hemY + s * 0.02);
    ctx.fillRect(cx - s * 0.14, h * 0.885, s * 0.28, s * 0.022);
    ctx.fillRect(cx - s * 0.10, h * 0.862, s * 0.20, s * 0.022);

    ctx.save();
    ctx.translate(sway * 0.3, 0);
    ctx.scale(1, breathe);

    // Skirt: wide bell, scarlet ground with feather rows.
    var waistHW = s * 0.10, hemHW = s * 0.30;
    var liftPx = hemLift * s * 0.12;
    ctx.fillStyle = '#d81a2a';
    ctx.beginPath();
    ctx.moveTo(cx - waistHW, waistY);
    ctx.lineTo(cx - hemHW, hemY - liftPx * 0.3);
    ctx.quadraticCurveTo(cx, hemY - liftPx, cx + hemHW, hemY - liftPx * 0.3);
    ctx.lineTo(cx + waistHW, waistY);
    ctx.closePath();
    ctx.fill();
    // Skirt feather scallops along the hem.
    for (var i = 0; i < hemFeathers.length; i++) {
      var f = hemFeathers[i];
      var fx = cx - hemHW + (2 * hemHW) * (i + 0.5) / hemFeathers.length;
      var fy = hemY - liftPx * (0.3 + 0.7 * Math.sin(Math.PI * (i + 0.5) / hemFeathers.length));
      var wang = Math.sin(t * Math.PI * 2 / 3 + f.phase) * 0.12 + ripple * 0.25 * Math.sin(f.phase + t);
      drawFeather(fx, fy - s * 0.02, s * 0.09 * f.len, s * 0.045, wang, f.col);
    }
    // Skirt panel seams (hand stitching feel).
    ctx.strokeStyle = '#f2ead8';
    ctx.lineWidth = Math.max(1, s * 0.004);
    ctx.beginPath();
    ctx.moveTo(cx - waistHW * 0.4, waistY + s * 0.01);
    ctx.lineTo(cx - hemHW * 0.4, hemY - liftPx * 0.5);
    ctx.moveTo(cx + waistHW * 0.4, waistY + s * 0.01);
    ctx.lineTo(cx + hemHW * 0.4, hemY - liftPx * 0.5);
    ctx.stroke();

    // Bodice: turquoise torso, magenta sash.
    ctx.fillStyle = '#1a9aaa';
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.085, shoulderY + s * 0.06);
    ctx.quadraticCurveTo(cx, shoulderY + s * 0.02, cx + s * 0.085, shoulderY + s * 0.06);
    ctx.lineTo(cx + waistHW, waistY);
    ctx.lineTo(cx - waistHW, waistY);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c81a6a';
    ctx.beginPath();
    ctx.moveTo(cx - waistHW, waistY - s * 0.05);
    ctx.lineTo(cx + waistHW, waistY - s * 0.05);
    ctx.lineTo(cx + waistHW, waistY - s * 0.01);
    ctx.lineTo(cx - waistHW, waistY - s * 0.01);
    ctx.closePath();
    ctx.fill();

    // Collar ring at the neck: cream, no face, no head inside.
    ctx.fillStyle = '#f2ead8';
    ctx.beginPath();
    ctx.ellipse(cx, shoulderY + s * 0.02, s * 0.075, s * 0.028, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#14524a';
    ctx.beginPath();
    ctx.ellipse(cx, shoulderY + s * 0.02, s * 0.045, s * 0.016, 0, 0, Math.PI * 2);
    ctx.fill();

    // Shoulder fans: tall feathered shoulders, left and right.
    var turn = (gest.kind === 1) ? gest.amt : 0;
    function shoulderFan(side, specs) {
      var baseX = cx + side * s * 0.13;
      for (var j = 0; j < specs.length; j++) {
        var sp = specs[j];
        var spread = (j - (specs.length - 1) / 2) / (specs.length - 1);
        var ang = side * (0.5 + Math.abs(spread) * 0.9) * (spread >= 0 ? 1 : -1) * 0.9
          + Math.sin(t * Math.PI * 2 / 3 + sp.phase) * 0.10
          + ripple * 0.3 * Math.sin(sp.phase + t * 2)
          + turn * side * 0.2;
        var fx2 = baseX + side * spread * s * 0.10;
        var fy2 = shoulderY + s * 0.05 - Math.abs(spread) * s * 0.02;
        drawFeather(fx2, fy2, s * 0.20 * sp.len, s * 0.05, ang, sp.col);
      }
    }
    shoulderFan(-1, shoulderL);
    shoulderFan(1, shoulderR);

    // Sleeves: hanging, scarlet with gold cuff; left sleeve lifts on gesture 0.
    var lift = (gest.kind === 0) ? gest.amt : 0;
    function sleeve(side, lifted) {
      var sx = cx + side * s * 0.15;
      var sy = shoulderY + s * 0.06;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(side * 0.15 + (lifted ? -side * lift * 0.9 : 0));
      ctx.fillStyle = '#d81a2a';
      ctx.beginPath();
      ctx.moveTo(-s * 0.035, 0);
      ctx.lineTo(s * 0.035, 0);
      ctx.lineTo(s * 0.045, s * 0.20);
      ctx.lineTo(-s * 0.045, s * 0.20);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#e8a81a';
      ctx.fillRect(-s * 0.045, s * 0.17, s * 0.09, s * 0.03);
      ctx.restore();
    }
    sleeve(-1, true);
    sleeve(1, false);

    // Crest: tall feather crown above the collar, no face beneath it.
    for (var k = 0; k < crestFeathers.length; k++) {
      var cf = crestFeathers[k];
      var spread2 = (k - (crestFeathers.length - 1) / 2) / (crestFeathers.length - 1);
      var ang2 = spread2 * 1.1
        + Math.sin(t * Math.PI * 2 / 3 + cf.phase) * 0.12
        + ripple * 0.35 * Math.sin(cf.phase + t * 2);
      drawFeather(cx + spread2 * s * 0.09, shoulderY - s * 0.02,
        s * 0.22 * cf.len, s * 0.05, ang2, cf.col);
    }

    ctx.restore();
  }

  function onDown(e) {
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
  }
  function onMove(e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    var now = lastT; // piece clock, shared with the rAF loop
    // Hem zone: lower skirt. Dragging it upward lifts the skirt.
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var px = e.clientX - rect.left, py = e.clientY - rect.top;
    var h = canvas.height, w = canvas.width;
    var Hs = Math.min(h * 0.75, w * 1.05);
    var topS = (h - Hs) / 2 - h * 0.03;
    var hemY = topS + Hs;
    var waistY = topS + Hs * 0.42;
    var inHem = py > waistY + (hemY - waistY) * 0.55 && Math.abs(px - w / 2) < Hs * 0.32;
    if (inHem && dy < 0) {
      events.push({ t0: now, kind: 'hem', amt: Math.min(-dy / 120, 0.6) });
    } else {
      var mag = Math.min((Math.abs(dx) + Math.abs(dy)) / 200, 0.8);
      if (mag > 0.02) events.push({ t0: now, kind: 'ripple', amt: mag });
    }
  }
  function onUp() { dragging = false; }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', function () { draw(lastT); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  // Boot flag: frame one is draw(0); the clock starts only with the rAF loop.
  var lastT = 0, t0 = null;
  draw(0);
  function loop(ts) {
    if (t0 === null) t0 = ts;
    lastT = (ts - t0) / 1000;
    draw(lastT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  // Probe hook (used by QA only; inert in the gallery).
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      loop: loop,
      events: events,
      gestureAt: gestureAt,
      rippleAt: rippleAt,
      hemLiftAt: hemLiftAt,
      firePointer: function (type, x, y) {
        var e = { clientX: x, clientY: y };
        if (type === 'down') onDown(e);
        else if (type === 'move') onMove(e);
        else onUp(e);
      }
    };
  }
})();
</script>
</body>
</html>
