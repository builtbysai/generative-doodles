<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.416 Noodle Lift</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FF2E6E; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.416 Noodle Lift (yeti-iglesias, EXPANSION #44).
// After Yeti Iglesias's earliest signature mechanism
// (her 2018 ramen): a dark red bowl of orange broth
// on a hot pink ground, a halved egg, three purple
// narutomaki spirals and two green nori sheets in the
// broth, and from the upper left a neon-yellow hand
// holding dark chopsticks lifts a bundle of neon
// yellow noodle strands that hang as wavy lines. TAP
// the bowl: the whole hand-and-sticks assembly lifts
// higher on a FIXED 2.4s tap cycle (0.8s ease up,
// 0.8s hold, 0.8s ease down, on fixed ticks from the
// tap), the ten strands stretch longer, and one
// authored steam curl puffs at the lift peak. The
// strands are exactly 10 quadratic curves recomputed
// from the chopstick tip every frame - they stretch
// by recomputation, never by scaling a drawn layer.
// Ambient 28s loop: the noodles sway gently as
// hanging curves, the broth shimmers and the steam
// rises, all on whole cycles of the loop. Grain is
// fixed dot DATA: exactly 500 speckle dots drawn in
// table order every frame, never a texture or
// filter. The only lettering is her hand-lettered
// "Yeti" signature bottom-right, drawn as STROKE
// PATHS (no font text), the set's designed-text
// exception. Frame one is drawn at the constant phase
// T = 9.0s (noodles mid-sway at rest height, steam
// mid-rise); the clock is anchored there and advances
// in fixed 1/60 ticks, never from a wall clock. Flat
// colour only, one canvas, no offscreen canvas, no
// gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Ground hot pink; bowl dark red with a navy base;
// broth orange; noodles and hand neon yellow;
// chopsticks dark red; egg white and yolk orange;
// narutomaki purple with white spirals; nori green.
// Nothing else.
var GROUND = '#FF2E6E', BOWL = '#A31621', NAVY = '#1B1B4E';
var BROTH = '#FF7B1C', NEON = '#FFE600', STICK = '#7A1020';
var EGGW = '#FFFFFF', YOLK = '#FF9500', NARU = '#9B30FF';
var NORI = '#1E5A2F';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 28;
if (LOOP !== 28) throw new Error('Noodle Lift ambient loop must be 28s');
var TICK = 1 / 60;

// ---- bowl geometry --------------------------------------
// The bowl is centred in the lower half. Rim ellipse
// centre (640, 566); the broth sits inside it.
var BCX = 640, RIM_Y = 566, RIM_RX = 336, RIM_RY = 60;
var BRO_RX = 318, BRO_RY = 52;

// ---- seeded data ----------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
function makeRng(seedStart) {
  var s = seedStart;
  return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// ---- bowl contents --------------------------------------
// Resolved counts, asserted: exactly 1 egg half with
// its yolk showing, exactly 3 narutomaki slices,
// exactly 2 nori sheets standing at the back of the
// broth.
var EGG = { x: 838, y: 556, rx: 56, ry: 34, rot: -0.15 };
var EGG_COUNT = 1;
var NARUS = [
  { x: 742, y: 582, r: 28 },
  { x: 672, y: 594, r: 25 },
  { x: 784, y: 596, r: 23 }
];
if (NARUS.length !== 3) throw new Error('narutomaki slices must be exactly 3');
var NORIS = [
  { x: 470, y: 492, w: 78, h: 124, rot: -0.10 },
  { x: 545, y: 478, w: 70, h: 112, rot: 0.07 }
];
if (NORIS.length !== 2) throw new Error('nori sheets must be exactly 2');

// ---- steam ----------------------------------------------
// Exactly 2 ambient steam curls rising from the broth.
// k = whole rise cycles per 28s loop.
var STEAMS = [
  { x: 788, base: 524, top: 300, k: 2, ph: 0.0 },
  { x: 902, base: 542, top: 330, k: 3, ph: 2.4 }
];
if (STEAMS.length !== 2) throw new Error('steam curls must be exactly 2');

// ---- the lifting assembly -------------------------------
// The hand holds both chopsticks; the whole assembly
// (sticks, mitt, and the strands' tip anchors) shares
// one offset. Rest tips: front stick (268, 336), back
// stick (292, 322). Grips sit under the mitt.
var TIP_F = { x: 268, y: 336 }, TIP_B = { x: 292, y: 322 };
var GRIP_F = { x: 128, y: 214 }, GRIP_B = { x: 142, y: 196 };
var LIFT_Y = 92, LIFT_X = 18;

// ---- the noodles ----------------------------------------
// Exactly 10 strands. Each hangs from an anchor along
// the segment between the two stick tips (plus a fixed
// jitter) down to an authored landing point inside the
// broth ellipse, and sways on whole cycles of the
// loop. lx/ly were checked against the broth ellipse:
// ((lx-640)/318)^2 + ((ly-566)/52)^2 < 0.8 for all.
var STRANDS = [
  { u: 0.00, jx: 0,  jy: 0,  lx: 486, ly: 600, k: 2, ph: 0.0, bow: -10 },
  { u: 0.11, jx: 3,  jy: -2, lx: 508, ly: 604, k: 3, ph: 1.1, bow: 6 },
  { u: 0.22, jx: -2, jy: 3,  lx: 530, ly: 594, k: 2, ph: 2.2, bow: -4 },
  { u: 0.33, jx: 4,  jy: -1, lx: 548, ly: 606, k: 4, ph: 0.7, bow: 12 },
  { u: 0.44, jx: -3, jy: 2,  lx: 566, ly: 598, k: 3, ph: 3.0, bow: -8 },
  { u: 0.56, jx: 2,  jy: -3, lx: 584, ly: 604, k: 2, ph: 1.8, bow: 3 },
  { u: 0.67, jx: 0,  jy: 1,  lx: 600, ly: 600, k: 3, ph: 4.2, bow: -12 },
  { u: 0.78, jx: -4, jy: 0,  lx: 500, ly: 602, k: 4, ph: 2.6, bow: 8 },
  { u: 0.89, jx: 3,  jy: -2, lx: 618, ly: 606, k: 2, ph: 5.1, bow: -5 },
  { u: 1.00, jx: -1, jy: 2,  lx: 556, ly: 604, k: 3, ph: 3.7, bow: 10 }
];
if (STRANDS.length !== 10) throw new Error('noodle strands must be exactly 10');

// Paper grain: exactly 500 fixed speckle dots over the
// whole design field, drawn in this order every frame.
var rngGrain = makeRng(416);
var GRAIN = [];
for (var gi = 0; gi < 500; gi++) {
  GRAIN.push({ x: rngGrain() * DW, y: rngGrain() * DH, r: 0.8 + rngGrain() * 1.3, pale: rngGrain() < 0.5 });
}
if (GRAIN.length !== 500) throw new Error('grain count');

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellA(x, y, rx, ry, rot, color, alpha) {
  ctx.globalAlpha = alpha;
  ell(x, y, rx, ry, rot, color);
  ctx.globalAlpha = 1;
}
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function poly(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}
function strokePts(pts, w, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function rrPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ---- motif recipes --------------------------------------
// One narutomaki slice: a purple disc with a white
// spiral stroked into it.
function drawNaru(n) {
  ell(n.x, n.y, n.r, n.r, 0, NARU);
  var pts = [];
  for (var i = 0; i <= 40; i++) {
    var a = (i / 40) * Math.PI * 4.5;
    var r = 2 + a * (n.r - 5) / (Math.PI * 4.5);
    pts.push([n.x + Math.cos(a) * r, n.y + Math.sin(a) * r]);
  }
  strokePts(pts, 5, EGGW, 0.95);
  ell(n.x, n.y, 3, 3, 0, EGGW);
}

// One ambient steam curl: a rising sine curve sampled
// at 40 points, its wave phase travelling upward on
// whole cycles of the loop. It is stroked as three
// layered paths (full length faint, mid length
// stronger, core strongest) so the ends fade softly
// without segment banding.
function steamPoint(st, travel, u) {
  return [
    st.x + Math.sin(u * 4.6 - travel * Math.PI * 2 + st.ph) * 15 * (0.25 + u),
    st.base - u * (st.base - st.top)
  ];
}
function drawSteam(st, lt) {
  var N = 40;
  var travel = (lt * st.k / LOOP) % 1;
  var pts = [];
  for (var j = 0; j <= N; j++) pts.push(steamPoint(st, travel, j / N));
  var layers = [
    { a: 0, b: N, w: 12, al: 0.34 },
    { a: 5, b: N - 4, w: 10, al: 0.30 },
    { a: 12, b: N - 12, w: 8, al: 0.28 }
  ];
  ctx.strokeStyle = EGGW;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var li = 0; li < layers.length; li++) {
    var L = layers[li];
    ctx.globalAlpha = L.al;
    ctx.lineWidth = L.w;
    ctx.beginPath();
    ctx.moveTo(pts[L.a][0], pts[L.a][1]);
    for (var j2 = L.a + 1; j2 <= L.b; j2++) ctx.lineTo(pts[j2][0], pts[j2][1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// The authored tap puff: one steam curl above the
// broth that swells and fades across the hold phase
// of the tap cycle. Drawn only while the cycle runs;
// it is a fixed spiral, not a spawned particle.
function drawPuff(q) {
  var cx = 716, cy = 458 - 30 * q;
  var pts = [];
  var turns = Math.PI * 1.7 * (0.4 + 0.6 * q);
  for (var i = 0; i <= 28; i++) {
    var a = (i / 28) * turns;
    var r = (4 + a * 3.4) * (0.6 + 0.7 * q);
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.82]);
  }
  strokePts(pts, 6, EGGW, 0.8 * (1 - q * 0.85));
}

// The hand: a flat neon-yellow mitt entering from the
// left edge, with 3 finger lines in yolk orange. Its
// grips close over the chopstick handles (the sticks
// are drawn first, underneath).
function drawHand() {
  ctx.fillStyle = NEON;
  ctx.beginPath();
  ctx.moveTo(-14, 172);
  ctx.quadraticCurveTo(60, 146, 128, 158);
  ctx.quadraticCurveTo(188, 168, 198, 214);
  ctx.quadraticCurveTo(204, 252, 176, 282);
  ctx.quadraticCurveTo(140, 306, 84, 302);
  ctx.quadraticCurveTo(30, 300, -14, 288);
  ctx.closePath();
  ctx.fill();
  // 3 finger lines wrapping the grip: each a single
  // smooth quadratic bow (sampled at 7 points so no
  // kink survives), kept well inside the mitt.
  var fingers = [
    [102, 176, 124, 232, 100, 290],
    [132, 180, 154, 236, 130, 294],
    [160, 192, 180, 242, 160, 294]
  ];
  for (var fi = 0; fi < fingers.length; fi++) {
    var fg = fingers[fi], fpts = [];
    for (var fq = 0; fq <= 6; fq++) {
      var fu = fq / 6;
      fpts.push([
        (1 - fu) * (1 - fu) * fg[0] + 2 * (1 - fu) * fu * fg[2] + fu * fu * fg[4],
        (1 - fu) * (1 - fu) * fg[1] + 2 * (1 - fu) * fu * fg[3] + fu * fu * fg[5]
      ]);
    }
    strokePts(fpts, 4.5, YOLK, 0.75);
  }
}

// Her hand-lettered signature, stroke paths only, in
// navy at the bottom right. No font text.
function drawSignature() {
  ctx.save();
  ctx.translate(1096, 818);
  ctx.scale(1.3, 1.3);
  var w = 3.4;
  // Y
  strokePts([[0, 0], [11, 15]], w, NAVY, 0.9);
  strokePts([[22, 0], [11, 15]], w, NAVY, 0.9);
  strokePts([[11, 15], [11, 34]], w, NAVY, 0.9);
  // e: a small loop with a crossbar, sampled as points
  var epts = [];
  for (var i = 0; i <= 10; i++) {
    var a = Math.PI * 0.95 - (i / 10) * Math.PI * 1.9;
    epts.push([42 + Math.cos(a) * 8.5, 21 + Math.sin(a) * 8.5]);
  }
  strokePts(epts, w, NAVY, 0.9);
  strokePts([[34, 19], [50, 17]], w, NAVY, 0.9);
  // t: stem with a hook, and its cross
  strokePts([[64, 2], [63, 24], [66, 30], [71, 29]], w, NAVY, 0.9);
  strokePts([[56, 12], [72, 12]], w, NAVY, 0.9);
  // i: stem and dot
  strokePts([[86, 13], [86, 30]], w, NAVY, 0.9);
  ctx.globalAlpha = 0.9; ell(86, 4, 2.4, 2.4, 0, NAVY); ctx.globalAlpha = 1;
  // flourish
  strokePts([[2, 42], [46, 47], [94, 40]], w, NAVY, 0.9);
  ctx.restore();
}

// ---- piece state ----------------------------------------
// Constant first-frame phase: T = 9.0s into the 28s
// loop (noodles mid-sway at rest height, steam
// mid-rise, no tap running).
var T = 9.0;
var lastNow = -1, acc = 0;
var tapT = -1; // -1 idle; otherwise seconds into the 2.4s tap cycle
var TAP_LEN = 2.4;

// Optional QA probe via the query string the house
// renderer passes as ?seed=... : lift=1 pins the tap
// cycle at its hold midpoint (full lift, puff at half
// swell). Deterministic; default play is unaffected.
var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
if (/lift=1/.test(qs)) tapT = 1.2;

function smooth(p) { return p * p * (3 - 2 * p); }

function step() {
  if (tapT >= 0) {
    tapT += TICK;
    if (tapT >= TAP_LEN) tapT = -1;
  }
}

// Lift envelope of the tap cycle: 0.8s ease up, 0.8s
// hold at the peak, 0.8s ease back down. 0 when idle.
function liftU() {
  if (tapT < 0) return 0;
  var p = tapT / TAP_LEN;
  if (p < 1 / 3) return smooth(p * 3);
  if (p < 2 / 3) return 1;
  return 1 - smooth((p - 2 / 3) * 3);
}

function drawScene(lt) {
  // Page ground: hot pink, everywhere.
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);

  var u = liftU();
  var asmX = -LIFT_X * u, asmY = -LIFT_Y * u;

  // Bowl wall: dark red, from the rim points curving
  // down to a soft flat bottom.
  ctx.fillStyle = BOWL;
  ctx.beginPath();
  ctx.moveTo(BCX - RIM_RX, RIM_Y);
  ctx.bezierCurveTo(BCX - RIM_RX + 12, 690, BCX - 260, 772, BCX - 140, 790);
  ctx.lineTo(BCX + 140, 790);
  ctx.bezierCurveTo(BCX + 260, 772, BCX + RIM_RX - 12, 690, BCX + RIM_RX, RIM_Y);
  ctx.closePath();
  ctx.fill();
  // Navy base the bowl stands on.
  poly(NAVY, [548, 786, 732, 786, 748, 824, 532, 824]);

  // Nori sheets standing at the back of the bowl,
  // their feet tucked under the broth (drawn next).
  for (var ni = 0; ni < NORIS.length; ni++) {
    var no = NORIS[ni];
    ctx.save();
    ctx.translate(no.x, no.y);
    ctx.rotate(no.rot);
    rrPath(-no.w / 2, -no.h / 2, no.w, no.h, 10);
    ctx.fillStyle = NORI;
    ctx.fill();
    ctx.restore();
  }

  // The broth surface.
  ell(BCX, RIM_Y, BRO_RX, BRO_RY, 0, BROTH);

  // Contents riding the broth: the egg half, then the
  // three narutomaki.
  ell(EGG.x, EGG.y, EGG.rx, EGG.ry, EGG.rot, EGGW);
  ell(EGG.x - 6, EGG.y - 4, 24, 17, EGG.rot, YOLK);
  for (var na = 0; na < NARUS.length; na++) drawNaru(NARUS[na]);

  // Broth shimmer: 2 ellipse strokes clipped to the
  // surface, their alpha oscillating on whole cycles.
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(BCX, RIM_Y, BRO_RX, BRO_RY, 0, 0, Math.PI * 2);
  ctx.clip();
  ctx.strokeStyle = EGGW; ctx.lineCap = 'round';
  ctx.globalAlpha = 0.20 + 0.13 * Math.sin(Math.PI * 2 * 2 * lt / LOOP);
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.ellipse(BCX, RIM_Y, 235, 33, 0, Math.PI * 0.25, Math.PI * 0.75);
  ctx.stroke();
  ctx.globalAlpha = 0.16 + 0.12 * Math.sin(Math.PI * 2 * 3 * lt / LOOP + 1.9);
  ctx.beginPath();
  ctx.ellipse(BCX, RIM_Y, 160, 22, 0, Math.PI * 0.30, Math.PI * 0.70);
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;

  // Ambient steam, rising off the broth.
  for (var s2 = 0; s2 < STEAMS.length; s2++) drawSteam(STEAMS[s2], lt);

  // The tap puff, at the lift peak.
  if (tapT >= 0.8 && tapT < 1.6) drawPuff((tapT - 0.8) / 0.8);

  // The lifting assembly: chopsticks first, then the
  // mitt closing over their grips.
  ctx.save();
  ctx.translate(asmX, asmY);
  seg(GRIP_B.x, GRIP_B.y, TIP_B.x, TIP_B.y, 11, STICK);
  seg(GRIP_F.x, GRIP_F.y, TIP_F.x, TIP_F.y, 11, STICK);
  drawHand();
  ctx.restore();

  // The noodles: exactly 10 strands, each built on a
  // quadratic curve from its tip anchor (which rides
  // the assembly) to its landing point in the broth,
  // recomputed this frame. The control point sags
  // below the chord and sways on the strand's whole
  // cycles, so a lift stretches the hang for real; the
  // strand is then sampled along that quadratic with
  // a gentle perpendicular ripple (zero at both ends)
  // so it hangs as a wavy line, not a swoosh.
  var tipBx = TIP_B.x + asmX, tipBy = TIP_B.y + asmY;
  var tipFx = TIP_F.x + asmX, tipFy = TIP_F.y + asmY;
  ctx.strokeStyle = NEON;
  ctx.lineWidth = 7.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var si = 0; si < STRANDS.length; si++) {
    var sn = STRANDS[si];
    var tx = tipBx + (tipFx - tipBx) * sn.u + sn.jx;
    var ty = tipBy + (tipFy - tipBy) * sn.u + sn.jy;
    var mx = (tx + sn.lx) / 2, my = (ty + sn.ly) / 2;
    var dist = Math.sqrt((sn.lx - tx) * (sn.lx - tx) + (sn.ly - ty) * (sn.ly - ty));
    var sway = Math.sin(Math.PI * 2 * sn.k * lt / LOOP + sn.ph) * (9 + (si % 3) * 2);
    var cx = mx + sn.bow + sway;
    var cy = my + dist * (0.10 + (si % 4) * 0.025) + 6 + Math.sin(Math.PI * 2 * sn.k * lt / LOOP + sn.ph + 1.2) * 3;
    var NS = 16;
    ctx.beginPath();
    for (var q = 0; q <= NS; q++) {
      var uu = q / NS;
      var ix = (1 - uu) * (1 - uu) * tx + 2 * (1 - uu) * uu * cx + uu * uu * sn.lx;
      var iy = (1 - uu) * (1 - uu) * ty + 2 * (1 - uu) * uu * cy + uu * uu * sn.ly;
      // Tangent of the quadratic, for the ripple normal.
      var dxq = 2 * (1 - uu) * (cx - tx) + 2 * uu * (sn.lx - cx);
      var dyq = 2 * (1 - uu) * (cy - ty) + 2 * uu * (sn.ly - cy);
      var dl = Math.sqrt(dxq * dxq + dyq * dyq) || 1;
      var rip = Math.sin(uu * Math.PI * 3 + sn.ph * 1.7) * 4.2 * Math.sin(Math.PI * uu);
      ix += (-dyq / dl) * rip;
      iy += (dxq / dl) * rip;
      if (q === 0) ctx.moveTo(ix, iy); else ctx.lineTo(ix, iy);
    }
    ctx.stroke();
  }

  // Paper grain over all, fixed table order.
  for (var g2 = 0; g2 < GRAIN.length; g2++) {
    var gd = GRAIN[g2];
    if (gd.pale) ellA(gd.x, gd.y, gd.r, gd.r, 0, EGGW, 0.05);
    else ellA(gd.x, gd.y, gd.r, gd.r, 0, NAVY, 0.05);
  }

  drawSignature();
}

function draw() { drawScene(T % LOOP); }

// ---- pointer: tap the bowl -------------------------------
// A tap is a press and release close together in design
// space, landing on the bowl. It starts the fixed 2.4s
// lift cycle on fixed ticks; a tap landing while a
// cycle runs is ignored, so the motion is always the
// authored one. The piece never reloads.
var downX = -1, downY = -1, downT = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
function inBowl(p) {
  var dx = (p.x - BCX) / 370, dy = (p.y - 650) / 210;
  return dx * dx + dy * dy < 1;
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved >= 28 || held >= 0.6) return;
  if (!inBowl(p)) return;
  if (tapT >= 0) return;
  tapT = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; });

// ---- sizing: centred fit, page ground = hot pink --------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
