<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9041 · Lunar Strip</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e9e2d0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; cursor: pointer; }
  .cap {
    position: fixed; left: 18px; bottom: 14px; pointer-events: none;
    color: #6b6250; font: italic 12.5px/1.5 Georgia, serif; opacity: 0.85;
  }
  .cap b { color: #3d382c; font-weight: normal; font-style: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><b>№9041 · Lunar Strip</b>, one lunation in twenty-nine moons, click for another sky</div>
<script>
'use strict';
/*
  Lunar Strip: twenty-nine small moon discs in one horizontal band,
  a full lunation left to right. New, crescent, half, gibbous, full,
  and back again. The terminator is hand-wobbled, never a perfect
  ellipse. The single full moon is warm gold, the only color.
  Northern hemisphere convention: waxing moons lit on the right.
*/

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '11', 10) || 11;
let rand = mulberry32(seed);

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const U = 1000; // fixed virtual units, viewport-invariant

function fit() {
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const s = Math.min(window.innerWidth, window.innerHeight) * 0.94;
  cv.width = s * DPR; cv.height = s * DPR;
  cv.style.width = s + 'px'; cv.style.height = s + 'px';
  ctx.setTransform(cv.width / U, 0, 0, cv.width / U, 0, 0);
}
window.addEventListener('resize', () => { fit(); draw(); });

function makeNoise(r) {
  const p = new Array(256);
  for (let i = 0; i < 256; i++) p[i] = r();
  return function (x) {
    const xi = Math.floor(x), xf = x - xi;
    const a = p[((xi % 256) + 256) % 256], b = p[(((xi + 1) % 256) + 256) % 256];
    const u = xf * xf * (3 - 2 * xf);
    return a + (b - a) * u;
  };
}

const SYNODIC = 29.53;
const NMOONS = 29;

function outlinePts(cx, cy, r, noise, off) {
  const N = 48, pts = [];
  for (let k = 0; k < N; k++) {
    const a = k / N * Math.PI * 2;
    const w = 1 + (noise(off + k * 0.613) - 0.5) * 0.045;
    pts.push([cx + r * w * Math.cos(a), cy + r * w * Math.sin(a)]);
  }
  return pts;
}

function tracePts(pts) {
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let k = 1; k <= pts.length; k++) ctx.lineTo(pts[k % pts.length][0], pts[k % pts.length][1]);
  ctx.closePath();
}

function drawMoon(cx, cy, r, phase, noise, off) {
  const th = phase * Math.PI * 2;
  const waxing = phase < 0.5;
  const illum = (1 - Math.cos(th)) / 2;
  const pts = outlinePts(cx, cy, r, noise, off);

  // faint earthshine body so even new moons read as discs
  ctx.beginPath(); tracePts(pts);
  ctx.fillStyle = 'rgba(58,52,44,0.055)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(58,52,44,0.75)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (illum < 0.015) return; // new moon: outline and earthshine only

  // lit region: limb (wobbled outline arc) + hand-wobbled terminator.
  // The terminator is the half-ellipse from S to N passing through
  // (cx + mx, cy), where mx = +/- r*cos(phase angle): east of center
  // for waxing crescent (thin right sliver), west of center for waxing
  // gibbous (nearly full), mirrored for waning.
  const mx = (waxing ? 1 : -1) * r * Math.cos(th);
  const limb = [];
  if (waxing) { for (let i = 0; i < 25; i++) limb.push((36 + i) % 48); }
  else { for (let i = 0; i < 25; i++) limb.push(12 + i); }

  const M = 22, term = [];
  for (let j = 0; j <= M; j++) {
    const u = j / M;
    const phi = Math.PI / 2 - u * Math.PI; // S -> N through (cx + mx, cy)
    const wob = Math.sin(Math.PI * u) * (noise(off + 90 + u * 7.3) - 0.5) * r * 0.12;
    term.push([cx + mx * Math.cos(phi) + wob, cy + r * Math.sin(phi)]);
  }
  const termSeq = waxing ? term.slice(1) : term.slice(0, M).reverse();

  ctx.beginPath();
  tracePts(pts); // outer: full disc
  const s0 = limb[0];
  ctx.moveTo(pts[s0][0], pts[s0][1]);
  for (let i = 1; i < limb.length; i++) ctx.lineTo(pts[limb[i]][0], pts[limb[i]][1]);
  for (let j = 0; j < termSeq.length; j++) ctx.lineTo(termSeq[j][0], termSeq[j][1]);
  ctx.closePath();
  ctx.fillStyle = 'rgba(58,52,44,0.88)';
  ctx.fill('evenodd'); // ink everywhere except the lit region
}

function drawGoldMoon(cx, cy, r, noise, off) {
  const pts = outlinePts(cx, cy, r, noise, off);
  // restrained warm glow
  const g = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 2.4);
  g.addColorStop(0, 'rgba(206,158,74,0.32)');
  g.addColorStop(0.5, 'rgba(206,158,74,0.10)');
  g.addColorStop(1, 'rgba(206,158,74,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r * 2.4, 0, 7); ctx.fill();
  // gold disc, gently modeled
  const dg = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r * 1.05);
  dg.addColorStop(0, '#f2d184');
  dg.addColorStop(0.7, '#e5ae54');
  dg.addColorStop(1, '#d1983f');
  ctx.beginPath(); tracePts(pts);
  ctx.fillStyle = dg;
  ctx.fill();
  // whisper of maria, barely there
  const mr = mulberry32(seed * 31 + off);
  ctx.fillStyle = 'rgba(120,84,40,0.10)';
  for (let i = 0; i < 4; i++) {
    const a = mr() * Math.PI * 2, d = mr() * r * 0.45;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r * (0.12 + mr() * 0.14), 0, 7);
    ctx.fill();
  }
  ctx.beginPath(); tracePts(pts);
  ctx.strokeStyle = 'rgba(58,52,44,0.8)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function draw() {
  rand = mulberry32(seed);
  const noise = makeNoise(rand);
  const R = (a, b) => a + rand() * (b - a);

  // ---- paper ----
  const paper = ctx.createLinearGradient(0, 0, U, U);
  paper.addColorStop(0, '#f3eee1');
  paper.addColorStop(0.6, '#efe8d6');
  paper.addColorStop(1, '#e9e1cc');
  ctx.fillStyle = paper;
  ctx.fillRect(0, 0, U, U);

  const bandY = 430;
  const x0 = 64, x1 = 936, dx = (x1 - x0) / (NMOONS - 1);
  const mr = 14.5;

  // ---- faint stars, kept clear of the band ----
  const sr = mulberry32(seed + 501);
  for (let i = 0; i < 36; i++) {
    const x = 70 + sr() * 860;
    let y = 110 + sr() * 780;
    if (Math.abs(y - bandY) < 70) y = y < bandY ? y - 90 : y + 90;
    ctx.fillStyle = 'rgba(90,80,64,' + (0.06 + sr() * 0.14).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(x, y, 0.8 + sr() * 1.2, 0, 7);
    ctx.fill();
  }

  // ---- the lunation ----
  let goldIdx = 0, best = -1;
  const phases = [];
  for (let i = 0; i < NMOONS; i++) {
    const p = (i + 0.5) / SYNODIC;
    phases.push(p);
    const illum = (1 - Math.cos(p * Math.PI * 2)) / 2;
    if (illum > best) { best = illum; goldIdx = i; }
  }
  for (let i = 0; i < NMOONS; i++) {
    const cx = x0 + i * dx + (noise(i * 3.1 + 7) - 0.5) * 2.5;
    const cy = bandY + (noise(i * 5.7 + 40) - 0.5) * 9;
    if (i === goldIdx) drawGoldMoon(cx, cy, mr, noise, i * 13.7);
    else drawMoon(cx, cy, mr, phases[i], noise, i * 13.7);
  }

  // ---- wobbly plate frame ----
  ctx.strokeStyle = 'rgba(70,62,50,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const fr = 64, fw = 40;
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (U - 2 * fr) * t + (noise(t * 9.1) - 0.5) * 5;
    const y = fr + (noise(t * 7.3 + 40) - 0.5) * 5;
    s2 ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr + (noise(t * 8.2 + 80) - 0.5) * 5;
    const y = fr + (U - 2 * fr) * t + (noise(t * 6.1 + 120) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr - (U - 2 * fr) * t + (noise(t * 7.7 + 160) - 0.5) * 5;
    const y = U - fr + (noise(t * 9.4 + 200) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (noise(t * 6.6 + 240) - 0.5) * 5;
    const y = U - fr - (U - 2 * fr) * t + (noise(t * 8.8 + 280) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  // ---- grain ----
  const gr = mulberry32(seed + 5);
  ctx.fillStyle = 'rgba(60,52,40,1)';
  for (let i = 0; i < 6000; i++) {
    ctx.globalAlpha = 0.025 + gr() * 0.06;
    ctx.beginPath();
    ctx.arc(gr() * U, gr() * U, 0.6 + gr() * 1.6, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- vignette ----
  const v = ctx.createRadialGradient(U / 2, U / 2, U * 0.32, U / 2, U / 2, U * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(40,30,18,0.16)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, U, U);
}

cv.addEventListener('click', () => {
  const s = 1 + Math.floor(Math.random() * 99999);
  location.search = '?seed=' + s;
});

fit();
draw();
</script>
</body>
</html>
