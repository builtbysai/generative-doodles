<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№43 · Wall of Light</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,255,255,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to shift the light</div>
<script>
'use strict';
// No43 Wall of Light (after mathiaskrissmer, prompt 8 via Bug).
// Three luminous curves only, sweeping wall to wall like a projector
// beam on a dark gallery wall. Each curve is a smooth chain through
// six control points that orbit slowly on a 35 second loop (integer
// cycles, so it closes). The chain is sampled at 200 points and
// stroked in three additive passes; where curves cross, brightness
// emerges from the blending alone. Curves enter and exit beyond
// the canvas edges, so no endpoint is ever visible. White on
// #050505. Drag adds a parallax offset that eases back on release.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '43', 10) || 43;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#050505';
const LOOP = 35;

const rnd = mulberry32(seed);
const CURVES = [0, 1, 2].map(c => ({
  baseY: 0.28 + c * 0.22 + (rnd() - 0.5) * 0.06,
  pts: Array.from({ length: 6 }, (_, i) => ({
    fx: -0.18 + i * 0.272,
    amp: 0.05 + rnd() * 0.085,
    cyc: 1 + ((rnd() * 2) | 0) + (c === 1 ? 1 : 0),
    ph: rnd() * Math.PI * 2
  }))
}));

let par = { x: 0, y: 0 };
let parEase = { x: 0, y: 0 };
let dragging = false;
let dragStart = null;

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  const t = (nowMs / 1000) % LOOP;
  parEase.x *= 0.98; parEase.y *= 0.98;
  const offX = (par.x + parEase.x) * RX, offY = (par.y + parEase.y) * RY;

  const passes = [
    { a: 0.10, lw: 0.020 }, { a: 0.25, lw: 0.008 }, { a: 0.70, lw: 0.003 }
  ];
  ctx.globalCompositeOperation = 'lighter';
  CURVES.forEach((curve, ci) => {
    const depth = 0.5 + ci * 0.35;
    const ctrl = curve.pts.map(p => [
      ox + p.fx * RX + offX * depth,
      oy + (curve.baseY + Math.sin((t / LOOP) * Math.PI * 2 * p.cyc + p.ph) * p.amp) * RY + offY * depth
    ]);
    const samples = [];
    for (let s = 0; s < ctrl.length - 1; s++) {
      const p0 = ctrl[Math.max(0, s - 1)], p1 = ctrl[s], p2 = ctrl[s + 1], p3 = ctrl[Math.min(ctrl.length - 1, s + 2)];
      const steps = s === ctrl.length - 2 ? 40 : 40;
      for (let i = 0; i < steps; i++) {
        const u = i / steps;
        samples.push([catmull(p0[0], p1[0], p2[0], p3[0], u), catmull(p0[1], p1[1], p2[1], p3[1], u)]);
      }
    }
    samples.push(ctrl[ctrl.length - 1]);
    for (const pass of passes) {
      ctx.strokeStyle = 'rgba(255,255,255,' + pass.a + ')';
      ctx.lineWidth = Math.max(0.7, Math.min(RX, RY) * pass.lw);
      ctx.beginPath();
      samples.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
    }
  });
  ctx.globalCompositeOperation = 'source-over';
  return {};
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(11000);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

canvas.addEventListener('pointerdown', ev => {
  dragging = true;
  dragStart = { x: ev.clientX, y: ev.clientY, px: par.x, py: par.y };
  parEase = { x: 0, y: 0 };
});
canvas.addEventListener('pointermove', ev => {
  if (!dragging || !dragStart) return;
  const [w, h] = viewportWH();
  par.x = dragStart.px + (ev.clientX - dragStart.x) / w * 0.3;
  par.y = dragStart.py + (ev.clientY - dragStart.y) / h * 0.3;
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  parEase = { x: par.x, y: par.y };
  par = { x: 0, y: 0 };
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
