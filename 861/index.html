<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№861 Study 1: Serpentine</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №861 Study 1: Serpentine, CK7 / PP1261, study #262 colton-kempf.
  // The famous 1896 image: a dancer in blue fabric centered on black,
  // the Serpentine Dance. Below the frame, three labeled stems wait:
  // a 2019 club track, a loudness-plus-pitch study, the maker's own
  // 2022 music. TAP selects which stem scores the dance. Same image,
  // three different films: the club track makes it a gig, the study
  // makes it a graph, the 2022 music makes it a memory. The control
  // strip is the point: a controlled experiment, not a menu.
  // Audio is visual-only in this gallery: no real WebAudio, per the
  // Franke rule. The dancer herself never changes; only the scoring
  // character changes. No colorizing beyond the blue fabric tint.
  var GROUND = '#050505'; // page ground, archive black

  // Fixed-phase first frame: FIRST_T = 12 s into a 60 s cycle.
  // Every motion period divides 60, so the frame at FIRST_T + 60
  // equals the frame at FIRST_T and the loop closes seamlessly.
  var FIRST_T = 12;
  var CYCLE = 60;
  var SEED = 861;

  // Stem state: 0 club track, 1 loudness-plus-pitch study, 2 2022 music.
  var stem = 0;
  var STEMS = [
    { label: '2019 CLUB TRACK', sub: 'A GIG', period: 6, amp: 1.0 },
    { label: 'LOUDNESS + PITCH STUDY', sub: 'A GRAPH', period: 12, amp: 0.7 },
    { label: '2022 MUSIC', sub: 'A MEMORY', period: 20, amp: 0.85 }
  ];

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // ?stem=<0|1|2> selects the stem at load. Read at load only.
  var probeT = null;
  var probeStem = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var mst = qs.match(/[?&]stem=([0-2])/);
    if (mst) { probeStem = parseInt(mst[1], 10); }
  } catch (e) {}
  if (probeStem !== null) { stem = probeStem; }

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipsePath(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }

  // Palette: archive black and white with the blue fabric tinted.
  // Stem labels in plain type. No colorizing beyond the blue tint.
  var BLACK = [5, 5, 5];
  var ARCHIVE = [12, 12, 14];
  var FIGURE = [16, 16, 18];
  var RIM = [120, 160, 210];
  var FABRIC = [111, 159, 216];
  var FABRIC_DEEP = [74, 122, 184];
  var FABRIC_PALE = [157, 191, 232];
  var FABRIC_DARK = [47, 90, 148];
  var WHITE = [232, 230, 224];
  var DIM = [106, 106, 102];
  var WARM = [230, 217, 194];
  var STRIP = [13, 13, 16];

  // ---- Fixed archival grain: 140 faint speckles, static -----------
  var grainRng = mulberry32(SEED * 17 + 7);
  var GRAIN = [];
  var gi;
  for (gi = 0; gi < 140; gi++) {
    GRAIN.push({
      x: grainRng(), y: grainRng() * 0.84,
      r: 0.0008 + grainRng() * 0.0016,
      a: 0.03 + grainRng() * 0.06
    });
  }

  // ---- Fixed fabric petal table: 6 billowing petals ---------------
  var petalRng = mulberry32(SEED * 23 + 3);
  var PETALS = [];
  var pi;
  for (pi = 0; pi < 6; pi++) {
    PETALS.push({
      base: Math.PI * (0.1 + 0.16 * pi), // fanned across the lower
      // half at FIRST_T, so frame one reads as a swirling skirt;
      // the swirl carries them overhead as the cycle turns
      len: 0.30 + petalRng() * 0.07,
      wid: 0.11 + petalRng() * 0.05,
      lift: 0.10 + petalRng() * 0.10,
      ph: petalRng() * Math.PI * 2
    });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsLabel = Math.round(clamp(W * 0.018, 10, 14));
    L.fsSub = Math.round(clamp(W * 0.014, 8, 11));
    L.fsHint = Math.round(clamp(W * 0.020, 11, 15));
    L.fsGraph = Math.round(clamp(W * 0.012, 7, 9));
    // Dance area is the top 0.84 of the stage; the control strip
    // is the thin band beneath it.
    L.danceH = H * 0.84;
    L.stripY = H * 0.84;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function X(f) { return f * W; }
  function Y(f) { return f * H; }
  function DY(f) { return f * L.danceH; } // y within the dance area

  // ---- Motion: the swirl angle, per stem ---------------------------
  // Each stem's swirl period divides the 60 s cycle, so the loop
  // closes. The club stem spins fastest, the study measured, the
  // memory slowest.
  function swirl(t) {
    var S = STEMS[stem];
    return 2 * Math.PI * (t - FIRST_T) / S.period;
  }
  // Club beat: 2 Hz pulse, 120 beats a minute. Under 14 Hz by
  // construction, and it only scales the fabric, never flashes.
  function beat(t) {
    if (stem !== 0) { return 0; }
    return 0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / 0.5);
  }

  // ---- Base: archive black, faint grain, floor line ---------------
  function drawBase(t) {
    ctx.fillStyle = rgb(BLACK);
    ctx.fillRect(0, 0, W, H);
    var i, g;
    for (i = 0; i < GRAIN.length; i++) {
      g = GRAIN[i];
      ctx.fillStyle = rgba(WHITE, a4(g.a));
      circle(X(g.x), Y(g.y), Math.max(0.75, g.r * W));
      ctx.fill();
    }
    // Faint floor line the dancer stands on.
    ctx.strokeStyle = rgba(WHITE, a4(0.10));
    ctx.lineWidth = Math.max(1, W * 0.0012);
    ctx.beginPath();
    ctx.moveTo(X(0.10), DY(0.88));
    ctx.lineTo(X(0.90), DY(0.88));
    ctx.stroke();
    // Soft reflection under the dancer.
    var rg = ctx.createRadialGradient(X(0.5), DY(0.90), 0, X(0.5), DY(0.90), W * 0.22);
    rg.addColorStop(0, rgba(FABRIC_DEEP, a4(0.12)));
    rg.addColorStop(1, rgba(FABRIC_DEEP, 0));
    ctx.fillStyle = rg;
    ctx.fillRect(X(0.28), DY(0.84), W * 0.44, DY(0.10));
  }

  // ---- The dancer: same archival figure in every stem --------------
  // Head, torso and arms are a dark silhouette with a blue rim;
  // the fabric is six billowing petals that swirl around her.
  function drawDancer(t) {
    var cx = X(0.5);
    // On phones the dance area is tall and narrow, so the figure
    // scales up a little to fill the frame; on desktop it is W.
    var U = W * (isPhone ? 1.3 : 1);
    var sw = swirl(t);
    var S = STEMS[stem];
    var b = beat(t);
    var breathe = 1 + 0.02 * Math.sin(2 * Math.PI * (t - FIRST_T) / 10 + 0.4);
    var i, p, ang, len, wid, px, py;

    // Fabric petals first, behind the figure. Lighter compositing
    // lets the overlapping blue tints glow like lit fabric.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < PETALS.length; i++) {
      p = PETALS[i];
      ang = p.base + sw + 0.18 * Math.sin(2 * Math.PI * (t - FIRST_T) / 20 + p.ph);
      len = p.len * U * S.amp * breathe * (1 + 0.05 * b);
      wid = p.wid * U * (1 + 0.04 * Math.sin(2 * Math.PI * (t - FIRST_T) / 15 + p.ph));
      px = cx + Math.cos(ang) * len * 0.55;
      py = DY(0.62) + Math.sin(ang) * len * 0.38 - p.lift * DY(0.10) * Math.sin(sw * 0.5 + p.ph);
      var col = (i % 3 === 0) ? FABRIC : (i % 3 === 1) ? FABRIC_DEEP : FABRIC_PALE;
      var al = (stem === 2) ? 0.30 : 0.42;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(ang + Math.PI / 2 * 0.35);
      ctx.fillStyle = rgba(col, a4(al + 0.06 * b));
      ellipsePath(0, 0, len * 0.55, wid, 0);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // Wide skirt base: one broad translucent sweep under the figure.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rgba(FABRIC_DARK, a4((stem === 2 ? 0.28 : 0.36) + 0.05 * b));
    ctx.save();
    ctx.translate(cx, DY(0.62));
    ctx.rotate(0.10 * Math.sin(sw));
    ellipsePath(0, 0, U * 0.30 * S.amp * breathe, DY(0.16), 0);
    ctx.fill();
    ctx.restore();
    ctx.restore();

    // Figure silhouette: head, torso, arms raised holding the
    // fabric wands, a narrow skirt column. Blue rim on the lit side.
    ctx.fillStyle = rgba(FIGURE, a4(0.96));
    circle(cx, DY(0.28), U * 0.032);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - U * 0.022, DY(0.32));
    ctx.lineTo(cx + U * 0.022, DY(0.32));
    ctx.lineTo(cx + U * 0.030, DY(0.58));
    ctx.lineTo(cx - U * 0.030, DY(0.58));
    ctx.closePath();
    ctx.fill();
    // Arms raised outward and up, holding the fabric.
    ctx.strokeStyle = rgba(FIGURE, a4(0.96));
    ctx.lineWidth = Math.max(2, U * 0.008);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - U * 0.018, DY(0.36));
    ctx.lineTo(cx - U * 0.20, DY(0.30 + 0.02 * Math.sin(sw + 1.2)));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + U * 0.018, DY(0.36));
    ctx.lineTo(cx + U * 0.20, DY(0.30 + 0.02 * Math.sin(sw + 2.4)));
    ctx.stroke();
    // Wand tips: two small pale points at the hands.
    ctx.fillStyle = rgba(FABRIC_PALE, a4(0.85));
    circle(cx - U * 0.20, DY(0.30 + 0.02 * Math.sin(sw + 1.2)), Math.max(1.5, U * 0.005));
    ctx.fill();
    circle(cx + U * 0.20, DY(0.30 + 0.02 * Math.sin(sw + 2.4)), Math.max(1.5, U * 0.005));
    ctx.fill();
    // Blue rim light along the figure's left edge.
    ctx.strokeStyle = rgba(RIM, a4(0.55));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(cx - U * 0.022, DY(0.33));
    ctx.lineTo(cx - U * 0.030, DY(0.57));
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, DY(0.28), U * 0.032, Math.PI * 0.7, Math.PI * 1.3);
    ctx.stroke();
    // Narrow skirt column below the torso.
    ctx.fillStyle = rgba(FIGURE, a4(0.94));
    ctx.beginPath();
    ctx.moveTo(cx - U * 0.028, DY(0.58));
    ctx.lineTo(cx + U * 0.028, DY(0.58));
    ctx.lineTo(cx + U * 0.045, DY(0.86));
    ctx.lineTo(cx - U * 0.045, DY(0.86));
    ctx.closePath();
    ctx.fill();
  }

  // ---- Club stem: the gig ------------------------------------------
  // A beat pulse rings out from the dancer and two thin light bars
  // breathe at the frame edges. The fabric already spins fastest
  // on this stem; the pulse is the room responding.
  function drawClub(t) {
    if (stem !== 0) { return; }
    var b = beat(t);
    var cx = X(0.5), cy = DY(0.55);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // Expanding beat ring, period 0.5 s, drawn as a thin circle
    // whose radius resets each beat; radius is a function of the
    // fractional beat phase, so it never accumulates.
    var phase = ((t - FIRST_T) % 0.5 + 0.5) % 0.5 / 0.5;
    var r = W * (0.18 + 0.22 * phase);
    ctx.strokeStyle = rgba(FABRIC_PALE, a4(0.18 * (1 - phase)));
    ctx.lineWidth = Math.max(1, W * 0.002);
    circle(cx, cy, r);
    ctx.stroke();
    // Light bars at the left and right edges, breathing on the beat.
    ctx.fillStyle = rgba(FABRIC, a4(0.05 + 0.10 * b));
    ctx.fillRect(0, 0, W * 0.02, L.danceH);
    ctx.fillRect(W * 0.98, 0, W * 0.02, L.danceH);
    ctx.restore();
  }

  // ---- Study stem: the graph ---------------------------------------
  // A spare readout under the dance: a loudness trace in white and
  // a pitch trace in blue, on a faint grid. The motion is measured;
  // the traces are closed-form sums whose periods divide 60 s.
  function loudness(xf, t) {
    var u = (t - FIRST_T);
    return 0.5
      + 0.22 * Math.sin(2 * Math.PI * xf * 3 + 2 * Math.PI * u / 30)
      + 0.12 * Math.sin(2 * Math.PI * xf * 7 - 2 * Math.PI * u / 20)
      + 0.06 * Math.sin(2 * Math.PI * xf * 12 + 2 * Math.PI * u / 15);
  }
  function pitch(xf, t) {
    var u = (t - FIRST_T);
    return 0.5
      + 0.30 * Math.sin(2 * Math.PI * xf * 2 - 2 * Math.PI * u / 60)
      + 0.10 * Math.sin(2 * Math.PI * xf * 5 + 2 * Math.PI * u / 12);
  }
  function drawStudy(t) {
    if (stem !== 1) { return; }
    var gx0 = X(0.06), gx1 = X(0.94);
    var gy0 = DY(0.74), gy1 = DY(0.83);
    var i, xf, x, y;
    // Faint grid.
    ctx.strokeStyle = rgba(WHITE, a4(0.12));
    ctx.lineWidth = Math.max(0.75, W * 0.0008);
    for (i = 0; i <= 4; i++) {
      x = gx0 + (gx1 - gx0) * i / 4;
      ctx.beginPath();
      ctx.moveTo(x, gy0);
      ctx.lineTo(x, gy1);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(gx0, (gy0 + gy1) / 2);
    ctx.lineTo(gx1, (gy0 + gy1) / 2);
    ctx.stroke();
    // Loudness trace, white.
    ctx.strokeStyle = rgba(WHITE, a4(0.8));
    ctx.lineWidth = Math.max(1.25, W * 0.0018);
    ctx.beginPath();
    for (i = 0; i <= 120; i++) {
      xf = i / 120;
      x = gx0 + (gx1 - gx0) * xf;
      y = gy1 - (gy1 - gy0) * loudness(xf, t);
      if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
    // Pitch trace, blue.
    ctx.strokeStyle = rgba(FABRIC_PALE, a4(0.8));
    ctx.lineWidth = Math.max(1.25, W * 0.0018);
    ctx.beginPath();
    for (i = 0; i <= 120; i++) {
      xf = i / 120;
      x = gx0 + (gx1 - gx0) * xf;
      y = gy1 - (gy1 - gy0) * pitch(xf, t);
      if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
    // Tiny labels for the two traces.
    ctx.textAlign = 'left';
    ctx.fillStyle = rgba(WHITE, a4(0.65));
    ctx.font = L.fsGraph + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('LOUDNESS', gx0, gy0 - 4);
    ctx.fillStyle = rgba(FABRIC_PALE, a4(0.65));
    ctx.fillText('PITCH', gx1 - ctx.measureText('PITCH').width, gy0 - 4);
    ctx.textAlign = 'left';
  }

  // ---- Memory stem: the haze ---------------------------------------
  // A warm, soft veil over the black, and the fabric drifts slowest
  // and softest. Nothing new is added; the same dance is remembered.
  function drawMemory(t) {
    if (stem !== 2) { return; }
    var cx = X(0.5), cy = DY(0.45);
    var breathe = 0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / 60);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.62);
    g.addColorStop(0, rgba(WARM, a4(0.10 + 0.04 * breathe)));
    g.addColorStop(0.6, rgba(WARM, a4(0.05)));
    g.addColorStop(1, rgba(WARM, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, L.danceH);
    // Soft vignette: the edges fall further away, like a memory.
    var vg = ctx.createRadialGradient(W / 2, L.danceH / 2, Math.min(W, L.danceH) * 0.35,
      W / 2, L.danceH / 2, Math.max(W, L.danceH) * 0.72);
    vg.addColorStop(0, rgba(BLACK, 0));
    vg.addColorStop(1, rgba(BLACK, a4(0.35)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, L.danceH);
  }

  // ---- Control strip: three labeled stems --------------------------
  // The selected stem's label brightens; the other two dim. Plain
  // type, no decoration beyond a small tick under the selection.
  function drawStrip() {
    ctx.fillStyle = rgb(STRIP);
    ctx.fillRect(0, L.stripY, W, H - L.stripY);
    ctx.strokeStyle = rgba(WHITE, a4(0.18));
    ctx.lineWidth = Math.max(1, W * 0.0012);
    ctx.beginPath();
    ctx.moveTo(0, L.stripY);
    ctx.lineTo(W, L.stripY);
    ctx.stroke();
    var i, cx, labelY, subY;
    labelY = L.stripY + (H - L.stripY) * 0.34;
    subY = L.stripY + (H - L.stripY) * 0.60;
    for (i = 0; i < 3; i++) {
      cx = W * (1 / 6 + i / 3);
      var sel = (i === stem);
      ctx.textAlign = 'center';
      ctx.fillStyle = sel ? rgba(WHITE, a4(0.95)) : rgba(DIM, a4(0.55));
      ctx.font = '600 ' + L.fsLabel + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(STEMS[i].label, cx, labelY);
      ctx.fillStyle = sel ? rgba(FABRIC_PALE, a4(0.85)) : rgba(DIM, a4(0.45));
      ctx.font = L.fsSub + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(STEMS[i].sub, cx, subY);
      if (sel) {
        ctx.fillStyle = rgba(FABRIC_PALE, a4(0.9));
        ctx.fillRect(cx - W * 0.02, subY + 6, W * 0.04, Math.max(2, W * 0.003));
      }
    }
    ctx.textAlign = 'left';
  }

  // ---- Caption and hint, in-canvas ---------------------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(WHITE, a4(0.9));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№861 · Study 1: Serpentine', W * 0.04, H * 0.05);
    ctx.fillStyle = rgba(WHITE, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 21', W * 0.04, H * 0.05 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(WHITE, a4(0.8));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Tap to change the stem.', W / 2, H - L.fsHint * 0.7);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawBase(t);
    drawDancer(t);
    drawClub(t);
    drawStudy(t);
    drawMemory(t);
    drawStrip();
    drawText();
  }

  // TAP selects the next stem, in fixed order, wrapping around.
  // Same image, three different films. No reload, no reseed.
  function advanceStem() {
    stem = (stem + 1) % 3;
    draw(lastT);
  }
  function setStem(n) {
    stem = ((n % 3) + 3) % 3;
    draw(lastT);
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('click', advanceStem);
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece861 exposes the stem, the swirl, the beat, and
  // the two study traces so probes can check each settled state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece861 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      stem: function () { return stem; },
      stems: STEMS.map(function (s) { return s.label; }),
      setStem: setStem,
      advance: advanceStem,
      swirl: function (t) { return swirl(t); },
      beat: function (t) { return beat(t); },
      loudness: function (xf, t) { return loudness(xf, t); },
      pitch: function (xf, t) { return pitch(xf, t); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 60 s cycle, closed-form. Guarded so node-canvas
  // QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
