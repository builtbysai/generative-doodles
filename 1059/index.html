<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Suit Remembers</title>
<style>
  html, body { margin: 0; padding: 0; background: #070708; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (strict: ember ramp only, nothing cool) ----------
  var FIELD = '#070708';
  // temperature ramp stops: [t, r, g, b]
  // 0.00 idle #15161A / 0.25 cooling ember #2A1512 / 0.50 ember #B23A2E
  // 0.75 proximity warm #FFE9C4 / 1.00 active flare #FFFFFF
  var STOPS = [
    [0.00, 0x15, 0x16, 0x1A],
    [0.25, 0x2A, 0x15, 0x12],
    [0.50, 0xB2, 0x3A, 0x2E],
    [0.75, 0xFF, 0xE9, 0xC4],
    [1.00, 0xFF, 0xFF, 0xFF]
  ];
  function ramp(t) {
    if (t <= 0) return 'rgb(21,22,26)';
    if (t >= 1) return 'rgb(255,255,255)';
    for (var i = 1; i < STOPS.length; i++) {
      if (t <= STOPS[i][0]) {
        var a = STOPS[i - 1], b = STOPS[i];
        var u = (t - a[0]) / (b[0] - a[0]);
        var r = Math.round(a[1] + (b[1] - a[1]) * u);
        var g = Math.round(a[2] + (b[2] - a[2]) * u);
        var bl = Math.round(a[3] + (b[3] - a[3]) * u);
        return 'rgb(' + r + ',' + g + ',' + bl + ')';
      }
    }
    return 'rgb(255,255,255)';
  }

  // ---------- sim constants ----------
  var DT = 1 / 60;              // fixed step, seconds
  var PREROLL = 26;             // frame one lives at sim t = 26 s
  var NCELLS = 150;
  var FALLOFF = 0.16;           // world units (about 90 px on a 720 stage, plus margin)
  var DECAY = 0.05;             // temperature per second while cooling
  var SPEED = 0.085;            // wearer speed, world units per second
  var PAUSE_LEN = 3;            // seconds, at flagged waypoints
  var BASE_SEED = 1059240;

  var seed = BASE_SEED;
  var simTime = 0;

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width) { W = vv.width; H = vv.height; }
    else if (typeof window !== 'undefined' && window.innerWidth) { W = window.innerWidth; H = window.innerHeight; }
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { fit(); draw(); });
    }
  }

  // world: unit square, contain-fit, centered; scatter scales to fit any width
  function view() {
    var s = Math.min(W, H);
    return { s: s, ox: (W - s) / 2, oy: (H - s) / 2 };
  }

  // ---------- cells: loose organic scatter, never a grid ----------
  var cells = [];
  function buildCells(s) {
    var rng = mulberry32(s);
    var pts = [];
    var i, j;
    // cluster centers give the scatter its organic clumping (the suit wraps a body)
    var clusters = [];
    for (i = 0; i < 6; i++) clusters.push([0.14 + rng() * 0.72, 0.14 + rng() * 0.72]);
    function gauss() { // Box-Muller from the seeded stream
      var u = 0, v = 0;
      while (u === 0) u = rng();
      while (v === 0) v = rng();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    for (i = 0; i < NCELLS; i++) {
      var x, y;
      if (rng() < 0.62) {
        var c = clusters[Math.floor(rng() * clusters.length)];
        x = c[0] + gauss() * 0.11;
        y = c[1] + gauss() * 0.11;
      } else {
        x = 0.05 + rng() * 0.90;
        y = 0.05 + rng() * 0.90;
      }
      x = Math.max(0.035, Math.min(0.965, x));
      y = Math.max(0.035, Math.min(0.965, y));
      pts.push({ x: x, y: y, r: 0.014 + rng() * 0.011, temp: 0, ef: 1 });
    }
    // relaxation: three passes pushing apart any pair closer than 0.045
    for (var pass = 0; pass < 3; pass++) {
      for (i = 0; i < pts.length; i++) {
        for (j = i + 1; j < pts.length; j++) {
          var dx = pts[j].x - pts[i].x, dy = pts[j].y - pts[i].y;
          var d2 = dx * dx + dy * dy;
          if (d2 < 0.045 * 0.045 && d2 > 1e-9) {
            var d = Math.sqrt(d2), push = (0.045 - d) / 2;
            var ux = dx / d, uy = dy / d;
            pts[i].x -= ux * push; pts[i].y -= uy * push;
            pts[j].x += ux * push; pts[j].y += uy * push;
          }
        }
      }
    }
    for (i = 0; i < pts.length; i++) {
      var p = pts[i];
      p.x = Math.max(0.03, Math.min(0.97, p.x));
      p.y = Math.max(0.03, Math.min(0.97, p.y));
      // edge fade: outer cells sit dimmer, the field is a patch of the suit
      var dc = Math.sqrt((p.x - 0.5) * (p.x - 0.5) + (p.y - 0.5) * (p.y - 0.5));
      var u2 = Math.max(0, Math.min(1, (dc - 0.40) / 0.28));
      p.ef = 1 - 0.72 * (u2 * u2 * (3 - 2 * u2));
    }
    cells = pts;
  }

  // ---------- wearer: unseen, on a seeded waypoint schedule ----------
  // Closed Catmull-Rom loop through stratified waypoints. The schedule is a
  // list of legs (move along one spline segment, then optional pause), with
  // cumulative times; wearerPos(t) is a pure function of the schedule clock.
  var schedule = null; // {pts, segs:[{dur, pauseAfter}], total, cum:[]}
  var wearerClock = 0; // seconds into the schedule (advances with the sim)

  function catmull(pts, i, u) {
    var n = pts.length;
    var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    var u2 = u * u, u3 = u2 * u;
    return [
      0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
      0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)
    ];
  }

  function buildSchedule(s) {
    var rng = mulberry32(s ^ 0x9E3779B9);
    // one waypoint per zone of a 3x3 stratification, visited in shuffled order
    var zones = [];
    var zx, zy;
    for (zy = 0; zy < 3; zy++) for (zx = 0; zx < 3; zx++) zones.push([zx, zy]);
    for (var i = zones.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = zones[i]; zones[i] = zones[j]; zones[j] = tmp;
    }
    var pts = zones.map(function (z) {
      return [ (z[0] + 0.22 + rng() * 0.56) / 3, (z[1] + 0.22 + rng() * 0.56) / 3 ];
    });
    // segment lengths by sampling, durations from the constant speed
    var segs = [], cum = [], total = 0;
    for (i = 0; i < pts.length; i++) {
      var len = 0, prev = catmull(pts, i, 0);
      for (var k = 1; k <= 16; k++) {
        var cur = catmull(pts, i, k / 16);
        len += Math.sqrt((cur[0] - prev[0]) * (cur[0] - prev[0]) + (cur[1] - prev[1]) * (cur[1] - prev[1]));
        prev = cur;
      }
      var dur = len / SPEED;
      var pauseAfter = (i % 2 === 1) ? PAUSE_LEN : 0; // a pause at every second waypoint
      segs.push({ dur: dur, pauseAfter: pauseAfter });
      cum.push(total);
      total += dur + pauseAfter;
    }
    schedule = { pts: pts, segs: segs, cum: cum, total: total };
  }

  function wearerPos(t) {
    var tt = t % schedule.total;
    var i = 0;
    // find leg containing tt
    while (i < schedule.segs.length - 1 && tt >= schedule.cum[i] + schedule.segs[i].dur + schedule.segs[i].pauseAfter) i++;
    var seg = schedule.segs[i];
    var local = tt - schedule.cum[i];
    if (local <= seg.dur) return catmull(schedule.pts, i, seg.dur > 0 ? local / seg.dur : 0);
    return schedule.pts[(i + 1) % schedule.pts.length].slice(); // paused at the waypoint
  }

  // ---------- pointer state: drag means you are the wearer ----------
  var dragging = false;
  var pointerWorld = null; // [x, y] in world units while dragging
  var downAt = 0, downPos = null, lastTapAt = -10, lastTapPos = null;

  function toWorld(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var v = view();
    return [ ((e.clientX - rect.left) - v.ox) / v.s, ((e.clientY - rect.top) - v.oy) / v.s ];
  }

  function reseed() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    buildSchedule(seed);
    wearerClock = 0; // the wearer relocates; the cells keep their memory
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      pointerWorld = toWorld(e);
      downAt = simTime;
      downPos = pointerWorld;
    });
    canvas.addEventListener('pointermove', function (e) {
      if (dragging) pointerWorld = toWorld(e);
    });
    canvas.addEventListener('pointerup', function (e) {
      var wasDrag = dragging;
      dragging = false;
      pointerWorld = null;
      if (!wasDrag || !downPos) return;
      var up = toWorld(e);
      var moved = Math.sqrt((up[0] - downPos[0]) * (up[0] - downPos[0]) + (up[1] - downPos[1]) * (up[1] - downPos[1]));
      var quick = (simTime - downAt) < 0.3;
      downPos = null;
      if (!quick || moved > 0.03) return; // it was a drag, not a tap
      if (lastTapPos && (simTime - lastTapAt) < 0.35 &&
          Math.sqrt((up[0] - lastTapPos[0]) * (up[0] - lastTapPos[0]) + (up[1] - lastTapPos[1]) * (up[1] - lastTapPos[1])) < 0.08) {
        lastTapAt = -10; lastTapPos = null;
        reseed();
      } else {
        lastTapAt = simTime; lastTapPos = up;
      }
    });
    canvas.addEventListener('pointercancel', function () { dragging = false; pointerWorld = null; downPos = null; });
  }

  // ---------- simulation ----------
  function step() {
    simTime += DT;
    wearerClock += DT;
    var wp = (dragging && pointerWorld) ? pointerWorld : wearerPos(wearerClock);
    var wx = wp[0], wy = wp[1];
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      var dx = c.x - wx, dy = c.y - wy;
      var d = Math.sqrt(dx * dx + dy * dy);
      var infl = 0;
      if (d < FALLOFF) { infl = 0.5 + 0.5 * Math.cos(Math.PI * d / FALLOFF); }
      if (infl > c.temp) {
        // rise toward the proximity level; the closer, the faster
        c.temp += (infl - c.temp) * Math.min(1, DT * (2.5 + 6.5 * infl));
        if (c.temp > 1) c.temp = 1;
      } else {
        // slow cooling toward the current proximity level: the memory lingers
        c.temp = Math.max(infl, c.temp - DECAY * DT);
      }
    }
  }

  // ---------- drawing ----------
  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);
    var v = view();
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      var t = c.temp;
      var col = ramp(t);
      var cx = v.ox + c.x * v.s, cy = v.oy + c.y * v.s;
      var r = c.r * v.s;
      var b = c.ef; // edge fade scales the whole disc stack
      ctx.fillStyle = col;
      ctx.globalAlpha = (0.06 + 0.14 * t) * b;
      ctx.beginPath(); ctx.arc(cx, cy, r * 1.9, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = (0.10 + 0.30 * t) * b;
      ctx.beginPath(); ctx.arc(cx, cy, r * 1.3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = (0.38 + 0.62 * t) * b;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- boot: pre-roll, frame one, live loop ----------
  fit();
  buildCells(seed);
  buildSchedule(seed);
  wearerClock = 0;
  var steps = Math.round(PREROLL / DT);
  for (var s2 = 0; s2 < steps; s2++) step();
  draw();

  if (typeof requestAnimationFrame !== 'undefined') {
    var lastMs = null, acc = 0;
    var loop = function (ms) {
      if (lastMs === null) lastMs = ms;
      var elapsed = (ms - lastMs) / 1000;
      lastMs = ms;
      if (elapsed > 0.25) elapsed = 0.25;
      acc += elapsed;
      var n = Math.floor(acc / DT);
      if (n > 30) n = 30;
      acc -= n * DT;
      for (var i = 0; i < n; i++) step();
      draw();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
