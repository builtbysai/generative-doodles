<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№115 · Phaseflame</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#14335E; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(247,227,176,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to lean the flames</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function qseed(){ const m=(window.location&&window.location.search||'').match(/seed=(\d+)/); return m?parseInt(m[1],10):null; }
function hexRgb(hx){ return [parseInt(hx.slice(1,3),16), parseInt(hx.slice(3,5),16), parseInt(hx.slice(5,7),16)]; }
function mixc(c1,c2,f){ return [Math.round(c1[0]+(c2[0]-c1[0])*f), Math.round(c1[1]+(c2[1]-c1[1])*f), Math.round(c1[2]+(c2[2]-c1[2])*f)]; }
function css(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function makeNoise1(seed){ const rand=mulberry(seed); const g=new Float32Array(256); for(let i=0;i<256;i++)g[i]=rand(); return function(x){ const ix=Math.floor(x); const fx=x-ix; const sx=fx*fx*(3-2*fx); const a=g[ix&255], b=g[(ix+1)&255]; return a+(b-a)*sx; }; }

// No.115 Phaseflame: 220 columns of 40 short vertical segments; a layered sine
// and noise phase field offsets the stacks so they read as rising flames.
const SEED=qseed()||115115;
const COLS=220, SEG=40;
const RED=hexRgb('#E23A2E'), ORANGE=hexRgb('#F28C28'), CREAMC=hexRgb('#F7E3B0');
const BUCKETS=18, bucketCss=[];
for(let b=0;b<BUCKETS;b++){ const f=b/(BUCKETS-1); bucketCss.push(css(f<0.5?mixc(CREAMC,ORANGE,f*2):mixc(ORANGE,RED,(f-0.5)*2),1)); }
const noise1=makeNoise1(SEED^0x77aa);
let cols=null, dragging=false, dragSX=0, dragSY=0, lean=0, leanT=0, hMul=1, hMulT=1, holdUntil=-1, lastMs=null;
function buildCols(w,h){
  const arr=[];
  for(let i=0;i<COLS;i++){
    const xc=(i+0.5)*(w/COLS);
    arr.push({ xc:xc, hf:clamp(0.55+0.5*noise1(xc*0.004+3.7),0.4,1.05), fl:noise1(xc*0.05+9.1)*Math.PI*2 });
  }
  return { w:w, h:h, arr:arr };
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0.016; if(lastMs!==null) dt=clamp((nowMs-lastMs)/1000,0.001,0.05); lastMs=nowMs;
  if(!cols||cols.w!==w||cols.h!==h) cols=buildCols(w,h);
  if(!dragging && nowMs>holdUntil){ lean+=(0-lean)*(1-Math.exp(-dt*1.4)); hMul+=(1-hMul)*(1-Math.exp(-dt*1.4)); }
  else { lean+=(leanT-lean)*(1-Math.exp(-dt*10)); hMul+=(hMulT-hMul)*(1-Math.exp(-dt*10)); }
  const t=nowMs/1000;
  ctx.fillStyle='#14335E'; ctx.fillRect(0,0,w,h);
  const cw=w/COLS, yBase=h*0.995, A1=h*0.045, A2=h*0.028, A3=h*0.05;
  const paths=[]; for(let b=0;b<BUCKETS;b++) paths.push([]);
  for(const c of cols.arr){
    const xs=c.xc+lean;
    const off=A1*Math.sin(xs*0.011+t*0.45)+A2*Math.sin(xs*0.023-t*0.77)+A3*(noise1(xs*0.006+t*0.055)-0.5)*2;
    const segH=(h*0.66*c.hf*hMul)/SEG;
    for(let i=0;i<SEG;i++){
      const frac=i/(SEG-1);
      const offI=off*(Math.pow(1-frac,1.4)*0.85+0.15)+Math.sin(t*2.1+c.fl+i*0.55)*1.2*(1-frac);
      const y=yBase-(i+0.5)*segH+offI*0.35;
      paths[Math.round(frac*(BUCKETS-1))].push(c.xc-cw*0.36, y-segH*0.42, cw*0.72, segH*0.84);
    }
  }
  for(let b=0;b<BUCKETS;b++){ const arr=paths[b]; if(!arr.length) continue; ctx.fillStyle=bucketCss[b]; ctx.beginPath(); for(let i=0;i<arr.length;i+=4) ctx.rect(arr[i],arr[i+1],arr[i+2],arr[i+3]); ctx.fill(); }
  if(cols.arr.length!==COLS) console.assert(false,'cols',COLS);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; dragSX=e.clientX; dragSY=e.clientY; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; leanT=(e.clientX-dragSX)*1.0; hMulT=clamp(1-(e.clientY-dragSY)*0.0022,0.45,1.75); });
function endP(now){ dragging=false; holdUntil=performance.now()+4000; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
