<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Crowd Wave</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c2028; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (verbatim from the prompt).
  var FIELD = '#1c2028';
  var DOT = '#9a9aa0';
  var CREST = '#e8e0d0';
  var SHADOW = '#101318';
  var VERSE = '#c9a86a';

  var LOOP = 48; // seconds; wave passes alternate every 24 s: left-to-right, then bottom-to-top.
  var X_PASS = 24; // length of one pass in each direction
  var SEED = 1519000; // recorded; the field itself needs no randomness (grid + travelling wave).

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(SEED);
  // Fixed per-line verse offsets, drawn from the seed so they are reproducible.
  var verseSeed = [rnd(), rnd(), rnd()];

  function size() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number' &&
        typeof window.visualViewport.height === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' &&
               typeof window.innerWidth === 'number' &&
               typeof window.innerHeight === 'number') {
      w = window.innerWidth; h = window.innerHeight;
    } else {
      w = 720; h = 720;
    }
    return { w: w, h: h };
  }

  function isPhone(w, h) {
    var minDim = 1e9;
    if (typeof window !== 'undefined' && window.screen &&
        typeof window.screen.width === 'number' &&
        typeof window.screen.height === 'number') {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
    if (minDim < 700) { return true; }
    return h > w * 1.15;
  }

  function smoothstep(x) {
    if (x <= 0) { return 0; }
    if (x >= 1) { return 1; }
    return x * x * (3 - 2 * x);
  }

  // Direction weight: 1 during the left-to-right pass, 0 during the
  // bottom-to-top pass, with 2 s smooth crossfades centred on the turns.
  // Periodic with period LOOP, and w1(0) = w1(LOOP) = 1, so frame one is a
  // pure left-to-right wave and the loop closes without a jump.
  function w1(tau) {
    if (tau < 24) { return 1; }
    if (tau < 26) { return 1 - smoothstep((tau - 24) / 2); }
    if (tau < 46) { return 0; }
    return smoothstep((tau - 46) / 2);
  }

  // Recorded drag segments, closed-form over piece time. Each segment:
  // {x, y, dx, dy, t}. Horizontal drag pushes the crest ahead of the
  // pointer; vertical drag raises (up) or lowers (down) the wave height.
  var segments = [];
  var dragging = false;
  var lastX = 0, lastY = 0;
  var nowT = 0;

  function onDown(e) {
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
  }
  function onMove(e) {
    if (!dragging) { return; }
    var dx = e.clientX - lastX;
    var dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (dx !== 0 || dy !== 0) {
      segments.push({ x: e.clientX, y: e.clientY, dx: dx, dy: dy, t: nowT });
    }
  }
  function onUp() { dragging = false; }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function draw(t) {
    nowT = t;
    var tau = ((t % LOOP) + LOOP) % LOOP; // loop-local time; t=LOOP is t=0 exactly.
    var d = size();
    var W = d.w, H = d.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // Field rect: full-bleed on phones, a centred square on desktop.
    var phone = isPhone(W, H);
    var fx, fy, fw, fh;
    if (phone) {
      fx = 0; fy = 0; fw = W; fh = H;
    } else {
      var side = Math.min(W, H);
      fx = (W - side) / 2; fy = (H - side) / 2; fw = side; fh = side;
    }

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    var spacing = Math.max(12, Math.min(22, Math.min(fw, fh) / 40));
    var dot = Math.max(2, Math.round(spacing * 0.22));
    var half = dot / 2;
    var cols = Math.max(2, Math.floor(fw / spacing));
    var rows = Math.max(2, Math.floor(fh / spacing));
    var gx0 = fx + (fw - (cols - 1) * spacing) / 2;
    var gy0 = fy + (fh - (rows - 1) * spacing) / 2;

    // Wave clocks. Both advance with period X_PASS, so both are continuous
    // across the direction turns and across the loop wrap (phase mod 2PI).
    var px = (tau % X_PASS) / X_PASS;
    var py = (((tau - 24) % X_PASS) + X_PASS) % X_PASS / X_PASS;
    var a = w1(tau);
    var b = 1 - a;

    // Wave amplitude with the closed-form vertical-drag factor.
    var ampOff = 0;
    var sigma = 0.22 * Math.min(fw, fh);
    var sigma2 = 2 * sigma * sigma;
    for (var s = 0; s < segments.length; s++) {
      var seg = segments[s];
      // Absolute piece time: a drag's effect decays once and never recurs
      // at the next loop wrap.
      var dt = t - seg.t;
      if (dt < 0 || dt > 24) { continue; }
      ampOff += (-seg.dy / Math.max(1, fh)) * 0.6 * Math.exp(-dt / 4);
    }
    var amp = Math.max(0.7, Math.min(1.3, 1 + ampOff));
    var A = spacing * 0.38 * amp;

    for (var r = 0; r < rows; r++) {
      var by = gy0 + r * spacing;
      for (var c = 0; c < cols; c++) {
        var bx = gx0 + c * spacing;
        // Local crest push from recorded drag segments, decaying with
        // tau 4 s. A rightward drag must move the crest right: the crest
        // of sin(2PI(bx/fw - px) + push) sits at bx = fw(px - push/2PI),
        // so the push takes the opposite sign of dx.
        var push = 0;
        for (var k = 0; k < segments.length; k++) {
          var sg = segments[k];
          var age = t - sg.t;
          if (age < 0 || age > 24) { continue; }
          var ddx = bx - sg.x, ddy = by - sg.y;
          var g = Math.exp(-(ddx * ddx + ddy * ddy) / sigma2);
          push += (-sg.dx / Math.max(1, fw)) * 2 * Math.PI * g * Math.exp(-age / 4);
        }
        if (push > 2 * Math.PI) { push = 2 * Math.PI; }
        if (push < -2 * Math.PI) { push = -2 * Math.PI; }
        var xw = Math.sin(2 * Math.PI * ((bx - fx) / fw - px) + push);
        var yw = Math.sin(2 * Math.PI * (((fy + fh) - by) / fh - py) + push);
        var v = a * xw + b * yw;
        var dy = A * v;
        var col = DOT;
        if (v > 0.65) { col = CREST; }
        else if (v < -0.65) { col = SHADOW; }
        ctx.fillStyle = col;
        ctx.fillRect(bx - half, by + dy - half, dot, dot);
      }
    }

    // Verse-lines: long thin faint-gold lines drifting high in the frame,
    // lines only, never letters. Each crosses the field in a period that
    // divides LOOP, so every line returns to its start at the loop wrap.
    var verseDefs = [
      { len: 0.34, period: 48, y: 0.05, off: verseSeed[0] },
      { len: 0.42, period: 24, y: 0.09, off: verseSeed[1] },
      { len: 0.28, period: 16, y: 0.13, off: verseSeed[2] }
    ];
    ctx.fillStyle = VERSE;
    for (var vi = 0; vi < verseDefs.length; vi++) {
      var vd = verseDefs[vi];
      var len = vd.len * fw;
      var span = fw + len;
      var start = vd.off * span;
      var x = (((start + fw * (tau / vd.period)) % span) + span) % span - len;
      var y = fy + vd.y * fh;
      ctx.globalAlpha = 0.55;
      ctx.fillRect(fx + x, y, len, 2);
    }
    ctx.globalAlpha = 1;
  }

  // Synchronous first frame at a constant phase.
  draw(0);

  // rAF loop as a plain function declaration. The first rAF call anchors
  // the clock; frame one never comes from wall-clock-derived elapsed time.
  var t0 = null;
  function loop(ts) {
    if (t0 === null) { t0 = ts; }
    var t = (ts - t0) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
