<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№623 Fingerprint Edition</title>
<style>
  html, body { margin: 0; padding: 0; background: #f7f5f0; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Fingerprint Edition, CW5 / PP1211, study #256 caius-williams.
  // A white ground with vertical side text like the Zheng Hao
  // tape cover. The centre field is irregular fingerprint dots
  // of varying opacity, slowly multiplying. Each new printing
  // adds dots but also smears the old ones: the edition degrades
  // as it grows, photocopy style. Tap pulls a print: a new stamp
  // cluster lands while the old dots fade and smear, and the
  // edition number climbs. The sheet keeps its history. No clean
  // prints, no vector perfect dots. The piece is the degradation.
  var PAPER = '#f7f5f0';  // paper white
  var INK = '#1a1a1a';    // ink black
  var GRAY = '#6b6b6b';   // ink gray
  var PENCIL = '#9a9a92'; // pencil gray, smear edges
  var SMEAR = '#b8b5ac';  // pale smear gray
  var FAINT = '#d8d5cc';  // faintest ridge gray

  // Fixed-phase first frame: FIRST_T = 9 s. At t = 9 the sheet
  // already carries three pulled prints (edition 3), so frame
  // one shows a lived-in field: three stamp clusters overlaid,
  // the earliest already smeared, plus the ambient dots born
  // before 9 s fading in. The edition counter at frame one is
  // the fixed number 3, never random.
  var FIRST_T = 9;
  var SEED = 1964;
  var BASE_EDITION = 3;
  var EDITION_LIMIT = 25;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is accepted as an alias for the same clock,
  // so the node-canvas render tool (which passes its probe value
  // as ?seed=) can verify that the frame changes over time.
  // ?pulls=<n> sets how many extra prints have been pulled at
  // load, so a tap probe can be simulated deterministically.
  // Read at load only.
  var probeT = null;
  var probePulls = 0;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var mp = qs.match(/[?&]pulls=([0-9]+)/);
    if (mp) { probePulls = parseInt(mp[1], 10); }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and fixed salts, so every frame is a pure
  // function of t and the pull count.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // The pull count: extra prints pulled since the sheet started
  // at edition 3. Tap increments it; the sheet keeps its history.
  // pullTimes records when each pulled print landed, so a fresh
  // stamp fades in sharp at the pull time; prints never pulled
  // fall back to their fixed index birth (p * 3 s), which keeps
  // ?pulls= probes and frame one fully deterministic.
  var pulls = probePulls;
  var pullTimes = {};
  function edition() { return BASE_EDITION + pulls; }
  function printBirth(p) {
    if (pullTimes[p] !== undefined) { return pullTimes[p]; }
    // A print pulled before load must already be on the sheet
    // at load time, so index births are capped at the load
    // clock; the founding prints (0, 3, 6 s) are unaffected.
    var loadT = (probeT !== null) ? probeT : FIRST_T;
    return Math.min(p * 3, loadT);
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    // Field-like composition: full-bleed on phones, square on
    // desktop. The dot field is centred, clear of the title
    // plate at top and the hint at bottom.
    // On a tall phone the field is centred a touch left and
    // sized from the width, not the short side, so the whorl
    // fills the viewport while staying inside the plate frame.
    L.cx = isPhone ? W * 0.52 : W * 0.56;
    L.cy = H * 0.52;
    L.R = isPhone ? W * 0.36 : u * 0.30;
    L.sideX = Math.max(14, W * 0.045);
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Dot field -------------------------------------------------
  // One print is a stamp cluster: dots laid along whorl rings
  // around a seeded centre offset, each dot irregular in size
  // and opacity, each with a smear direction and a birth time.
  // Print p is born at p * 3 s, so at FIRST_T = 9 the three
  // founding prints are all on the sheet, the first already
  // six seconds old and smearing. Later pulls are born at the
  // pull time (see pullPrint) and age from there.
  // Ambient dots are born on a slow schedule across the first
  // 48 s, so the field keeps multiplying even between pulls.
  var dotsCache = null;
  var dotsCachePulls = -1;
  function buildDots() {
    if (dotsCache !== null && dotsCachePulls === pulls) { return dotsCache; }
    var dots = [];
    var total = BASE_EDITION + pulls;
    var p, i;
    for (p = 0; p < total; p++) {
      var rng = mulberry32(SEED * 17 + p * 104729 + 5);
      var ox = (rng() - 0.5) * L.u * 0.10;
      var oy = (rng() - 0.5) * L.u * 0.10;
      var birth = printBirth(p);
      var rings = 9;
      var r;
      for (r = 0; r < rings; r++) {
        var rr = L.R * (0.12 + 0.88 * (r / (rings - 1)));
        var step = (Math.PI * 2) / Math.max(6, Math.round(rr / (L.u * 0.016)));
        var a;
        for (a = 0; a < Math.PI * 2; a += step) {
          if (rng() < 0.18) { continue; } // gaps in the whorl
          var ang = a + (rng() - 0.5) * 0.22;
          var rad = rr + (rng() - 0.5) * L.u * 0.012;
          var dx = L.cx + ox + Math.cos(ang) * rad;
          var dy = L.cy + oy + Math.sin(ang) * rad * 0.92;
          var smearAng = ang + Math.PI / 2 + (rng() - 0.5) * 0.7;
          dots.push({
            x: dx, y: dy,
            r: Math.max(1.1, L.u * (0.0022 + rng() * 0.0042)),
            op: 0.28 + rng() * 0.55,
            birth: birth + rng() * 1.2,
            smear: smearAng,
            smearLen: L.u * (0.004 + rng() * 0.016),
            gray: rng() < 0.3
          });
        }
      }
    }
    // Ambient dots: slow multiplication between pulls.
    var arng = mulberry32(SEED * 29 + 991);
    for (i = 0; i < 220; i++) {
      var aa = arng() * Math.PI * 2;
      var arad = Math.sqrt(arng()) * L.R * 1.02;
      dots.push({
        x: L.cx + Math.cos(aa) * arad,
        y: L.cy + Math.sin(aa) * arad * 0.92,
        r: Math.max(1.0, L.u * (0.0018 + arng() * 0.0032)),
        op: 0.22 + arng() * 0.45,
        birth: arng() * 48,
        smear: aa + Math.PI / 2 + (arng() - 0.5) * 0.9,
        smearLen: L.u * (0.003 + arng() * 0.012),
        gray: arng() < 0.45
      });
    }
    dotsCache = dots;
    dotsCachePulls = pulls;
    return dots;
  }

  // Whorl ridge arcs: thin broken arcs in faint pencil gray that
  // give the dot field its fingerprint read. Seeded per print so
  // each pull adds its own ridges.
  function drawRidges(t) {
    var total = BASE_EDITION + pulls;
    var p, r;
    for (p = 0; p < total; p++) {
      var rng = mulberry32(SEED * 41 + p * 31337 + 11);
      var ox = (rng() - 0.5) * L.u * 0.10;
      var oy = (rng() - 0.5) * L.u * 0.10;
      var birth = printBirth(p);
      var age = t - birth;
      if (age < 0) { continue; }
      var fade = clamp(age / 2, 0, 1) * (1 - clamp(age / 60, 0, 0.55));
      for (r = 0; r < 7; r++) {
        var rr = L.R * (0.18 + 0.82 * (r / 6));
        var a0 = rng() * Math.PI * 2;
        var a1 = a0 + Math.PI * (0.5 + rng() * 1.1);
        ctx.strokeStyle = hexA(p % 2 ? PENCIL : FAINT, a4(0.16 * fade));
        ctx.lineWidth = Math.max(1, L.u * 0.0016);
        ctx.beginPath();
        ctx.moveTo(L.cx + ox + Math.cos(a0) * rr, L.cy + oy + Math.sin(a0) * rr * 0.92);
        ctx.arc(L.cx + ox, L.cy + oy, rr, a0, a1);
        ctx.stroke();
      }
    }
  }

  // One dot: a filled irregular circle plus a smear tail that
  // grows as the dot ages, so old prints blur while new ones
  // stamp in sharp. Opacity fades in over 1.5 s, then decays
  // toward a 0.45 floor over 30 s: the edition degrades.
  function drawDot(d, t) {
    var age = t - d.birth;
    if (age < 0) { return; }
    var fadeIn = clamp(age / 1.5, 0, 1);
    var decay = 1 - 0.55 * clamp(age / 30, 0, 1);
    var op = d.op * fadeIn * decay;
    if (op <= 0.01) { return; }
    var drift = Math.min(age * L.u * 0.0006, L.u * 0.012);
    var x = d.x + Math.cos(d.smear) * drift;
    var y = d.y + Math.sin(d.smear) * drift;
    var col = d.gray ? PENCIL : INK;
    // Smear tail, drawn first so the dot sits on top of it.
    var tail = d.smearLen * clamp(age / 8, 0.15, 1);
    ctx.strokeStyle = hexA(SMEAR, a4(op * 0.55));
    ctx.lineWidth = Math.max(0.8, d.r * 0.7);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(d.smear) * tail, y + Math.sin(d.smear) * tail);
    ctx.stroke();
    // Irregular dot: a circle plus a small offset second blob so
    // no dot is vector perfect.
    ctx.fillStyle = hexA(col, a4(op));
    ctx.beginPath();
    ctx.moveTo(x + d.r, y);
    ctx.arc(x, y, d.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = hexA(col, a4(op * 0.6));
    ctx.beginPath();
    ctx.moveTo(x + d.r * 0.45 + d.r * 0.45, y + d.r * 0.3);
    ctx.arc(x + d.r * 0.45, y + d.r * 0.3, d.r * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Paper white ground.
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // A faint plate mark: the sheet edge, a hairline frame inset
    // from the stage, like a print on paper.
    ctx.strokeStyle = hexA(INK, a4(0.14));
    ctx.lineWidth = 1;
    ctx.strokeRect(W * 0.09 + 0.5, H * 0.10 + 0.5, W * 0.86 - 1, H * 0.76 - 1);

    drawRidges(t);
    var dots = buildDots();
    var i;
    for (i = 0; i < dots.length; i++) { drawDot(dots[i], t); }

    // ---- Vertical side text along the left, like the Zheng Hao
    // tape cover. Reads bottom to top.
    var fsSide = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.save();
    ctx.translate(L.sideX + 2, H * 0.78);
    ctx.rotate(-Math.PI / 2);
    ctx.font = '600 ' + fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(INK, a4(0.72));
    ctx.fillText('F I N G E R P R I N T   E D I T I O N', 0, 0);
    ctx.font = fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = hexA(GRAY, a4(0.7));
    ctx.fillText('C W 5   ·   P P 1 2 1 1', 0, fsSide + 7);
    ctx.restore();

    // ---- Plates: title top-left, number and date below it.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Fingerprint Edition', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(GRAY, a4(0.9));
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№623 · 2007 · 05 · 29', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    // ---- Edition number, bottom-right: climbs with each pull.
    var edText = 'EDITION ' + edition() + ' / ' + EDITION_LIMIT;
    ctx.font = '600 ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = hexA(INK, a4(0.85));
    ctx.textAlign = 'right';
    ctx.fillText(edText, W - 18, H - 18 - fsHint - 16);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom, ink on a faint paper
    // pill so it stays legible over the field.
    var hint = 'Tap to pull a print.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(INK, a4(0.05));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(INK, a4(0.2));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = hexA(INK, a4(0.9));
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // Tap is the printing pull, not a reseed: one more stamp
  // cluster lands, the field ages, the edition climbs. The sheet
  // keeps its history. New prints are born at the current time
  // so they stamp in sharp while old ones keep smearing.
  function pullPrint() {
    if (edition() >= EDITION_LIMIT) { return; }
    pulls += 1;
    pullTimes[BASE_EDITION + pulls - 1] = lastT;
    dotsCache = null;
    draw(lastT);
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', pullPrint);
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1964 exposes the edition and the pull count.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1964 = {
      edition: function () { return edition(); },
      pulls: function () { return pulls; },
      pull: function () { pullPrint(); return edition(); },
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: dots fade in and smear over seconds, the field
  // multiplies slowly, all well under the 14 Hz ceiling.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
