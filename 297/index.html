<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.297 Okame Mask Field</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#2A1512; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.297 Okame Mask Field (Ruby Waters).
// Eleven okame masks, round moon faces with black bob cuts,
// high vermilion blush and tiny smiling mouths, drifting at
// three depths over faint giant chrysanthemums. Watch-only.
// 32 second seamless loop: masks bob on depth staggered sine
// phases whose cycles divide the loop, near masks tilt gently,
// the chrysanthemum ground rotates three degrees and back, and
// every eight seconds one mask blinks for 300ms in a fixed
// seeded rotation. No text, no interaction.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#2A1512', CREAM = '#FBF3E4', HAIR = '#141414', RED = '#D23A2A', FAINT = '#6E2B22';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 32;
var T = 23.86, lastNow = -1, acc = 0; // frame one mid-drift, next blink in 0.14s
var TICK = 1 / 60;

function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }

// ---- masks: exactly 11, asserted (4 near, 4 mid, 3 far) -----------
// Base positions are curated so the field reads scattered at load;
// per-mask phase, drift and bob cycles come from a fixed seed.
// Bob and drift cycles are integers per 32s loop, so the loop
// seam is exact. Depth sets scale, alpha and drift speed.
var masks = [];
(function () {
  var defs = [
    // far layer first in the list, drawn first
    { x: 240, y: 205, r: 60, depth: 0 },
    { x: 645, y: 150, r: 56, depth: 0 },
    { x: 1045, y: 215, r: 62, depth: 0 },
    // mid layer
    { x: 145, y: 485, r: 82, depth: 1 },
    { x: 505, y: 335, r: 86, depth: 1 },
    { x: 855, y: 350, r: 84, depth: 1 },
    { x: 1150, y: 505, r: 80, depth: 1 },
    // near layer
    { x: 365, y: 645, r: 116, depth: 2 },
    { x: 705, y: 585, r: 124, depth: 2 },
    { x: 1030, y: 720, r: 110, depth: 2 },
    { x: 205, y: 765, r: 104, depth: 2 }
  ];
  var r = rng(297411);
  for (var i = 0; i < defs.length; i++) {
    var d = defs[i];
    var speed = d.depth === 0 ? 0.45 : (d.depth === 1 ? 0.75 : 1.0);
    masks.push({
      x: d.x, y: d.y, r: d.r, depth: d.depth,
      alpha: d.depth === 0 ? 0.78 : (d.depth === 1 ? 0.92 : 1.0),
      ph: r() * Math.PI * 2,
      ph2: r() * Math.PI * 2,
      cycX: 1 + Math.floor(r() * 2),       // 1 or 2 cycles per loop
      cycY: 1 + Math.floor(r() * 2),
      ampX: (9 + r() * 9) * speed + (d.depth === 2 ? 8 : 0),
      ampY: (7 + r() * 7) * speed + (d.depth === 2 ? 5 : 0),
      tilt: d.depth === 2 ? 0.055 + r() * 0.03 : (d.depth === 1 ? 0.022 : 0.01)
    });
  }
})();
var nearCount = 0, midCount = 0, farCount = 0;
for (var ci = 0; ci < masks.length; ci++) {
  if (masks[ci].depth === 2) nearCount++;
  else if (masks[ci].depth === 1) midCount++;
  else farCount++;
}
if (masks.length !== 11) throw new Error('mask count must be 11, got ' + masks.length);
if (nearCount !== 4 || midCount !== 4 || farCount !== 3) {
  throw new Error('mask layers must be 4 near, 4 mid, 3 far, got ' + nearCount + '/' + midCount + '/' + farCount);
}

// ---- blink rotation: deterministic, one mask per 8s beat ----------
// A seeded shuffle fixes the order once; each 32s loop the four
// beats blink order[0], order[1], order[2], order[3] in turn, so
// every play of the loop is identical. A blink lasts 300ms at
// the start of its beat, shaped as a sine pulse of eye openness.
var blinkOrder = (function () {
  var idx = [];
  for (var i = 0; i < masks.length; i++) idx.push(i);
  var r = rng(297903);
  for (var j = idx.length - 1; j > 0; j--) {
    var k = Math.floor(r() * (j + 1));
    var tmp = idx[j]; idx[j] = idx[k]; idx[k] = tmp;
  }
  return idx;
})();
function blinkOpenness(maskIdx, tLoop) {
  var beat = Math.floor(tLoop / 8);           // 0..3
  if (blinkOrder[beat] !== maskIdx) return 1;
  var beatT = tLoop - beat * 8;               // 0..8
  if (beatT >= 0.3) return 1;
  var p = beatT / 0.3;                        // 0..1 across 300ms
  return 1 - Math.sin(p * Math.PI);           // 1 -> 0 -> 1
}

// ---- chrysanthemums: faint giant petal rings behind the masks -----
var flowers = [
  { x: 315, y: 285, r: 390, petals: 26, ph: 0.0 },
  { x: 985, y: 640, r: 430, petals: 28, ph: 0.7 },
  { x: 660, y: 90, r: 300, petals: 24, ph: 1.4 }
];
function drawFlower(f, rot) {
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(rot + f.ph * 0.12);
  ctx.fillStyle = FAINT;
  for (var ring = 0; ring < 2; ring++) {
    var rr = f.r * (ring === 0 ? 1.0 : 0.64);
    var n = f.petals - ring * 5;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + ring * 0.21;
      ctx.save();
      ctx.rotate(a);
      // one wide petal: a teardrop from the centre outward, wide
      // enough that neighbouring bases overlap and no gaps spike
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(rr * 0.36, -rr * 0.21, rr * 0.78, -rr * 0.15, rr, 0);
      ctx.bezierCurveTo(rr * 0.78, rr * 0.15, rr * 0.36, rr * 0.21, 0, 0);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.beginPath();
  ctx.arc(0, 0, f.r * 0.16, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---- one okame mask -------------------------------------------------
// Hair silhouette first (a black bob: cap plus side panels), then
// the cream moon face, a black fringe arc across the forehead,
// high vermilion blush, small black eyes that morph to a line on
// a blink, tiny brows, and a small vermilion smiling mouth.
function drawMask(m, idx, tLoop) {
  var ph = tLoop / LOOP * Math.PI * 2;
  var x = m.x + Math.sin(ph * m.cycX + m.ph) * m.ampX;
  var y = m.y + Math.cos(ph * m.cycY + m.ph2) * m.ampY;
  var tilt = Math.sin(ph + m.ph) * m.tilt;
  var open = blinkOpenness(idx, tLoop);
  var R = m.r;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  ctx.globalAlpha = m.alpha;
  // hair back: bob silhouette, a wide black shape behind the face
  // with a softly curved flat bottom below the face circle
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.arc(0, -R * 0.02, R * 1.08, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-R * 1.08, -R * 0.02);
  ctx.lineTo(R * 1.08, -R * 0.02);
  ctx.lineTo(R * 1.08, R * 0.52);
  ctx.quadraticCurveTo(0, R * 0.72, -R * 1.08, R * 0.52);
  ctx.closePath();
  ctx.fill();
  // face: cream moon circle, set low inside the bob
  ctx.fillStyle = CREAM;
  ctx.beginPath();
  ctx.arc(0, R * 0.12, R * 0.92, 0, Math.PI * 2);
  ctx.fill();
  // hair fringe: a black ellipse clipped to the face circle, so
  // its lower edge is one clean curve across the forehead
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, R * 0.12, R * 0.92, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.ellipse(0, -R * 0.50, R * 1.02, R * 0.54, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // side hair locks: black ellipses sitting on the bob edge,
  // mostly outside the face, tips reaching past the cheeks
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.ellipse(-R * 0.97, R * 0.30, R * 0.15, R * 0.40, 0.06, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(R * 0.97, R * 0.30, R * 0.15, R * 0.40, -0.06, 0, Math.PI * 2);
  ctx.fill();
  // blush: high vermilion rounds on both cheeks
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.ellipse(-R * 0.52, R * 0.38, R * 0.21, R * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(R * 0.52, R * 0.38, R * 0.21, R * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();
  // brows: two small black arcs
  ctx.strokeStyle = HAIR;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1.6, R * 0.045);
  ctx.beginPath();
  ctx.arc(-R * 0.33, R * 0.15, R * 0.11, Math.PI * 1.15, Math.PI * 1.85);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(R * 0.33, R * 0.15, R * 0.11, Math.PI * 1.15, Math.PI * 1.85);
  ctx.stroke();
  // eyes: black ovals whose height morphs to a line on a blink
  ctx.fillStyle = HAIR;
  var eyeRy = Math.max(R * 0.012, R * 0.115 * open);
  ctx.beginPath();
  ctx.ellipse(-R * 0.33, R * 0.22, R * 0.075, eyeRy, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(R * 0.33, R * 0.22, R * 0.075, eyeRy, 0, 0, Math.PI * 2);
  ctx.fill();
  // mouth: tiny vermilion smile, a small filled lip shape
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.ellipse(0, R * 0.58, R * 0.13, R * 0.075, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = CREAM;
  ctx.beginPath();
  ctx.ellipse(0, R * 0.545, R * 0.11, R * 0.045, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function stepSim() { T += TICK; }

function draw() {
  var tLoop = ((T % LOOP) + LOOP) % LOOP;
  var ph = tLoop / LOOP * Math.PI * 2;
  // ground
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  // chrysanthemum ground: rotates three degrees and back per loop
  var rot = Math.sin(ph) * 3 * Math.PI / 180;
  ctx.save();
  ctx.translate(DW / 2, DH / 2);
  ctx.rotate(rot);
  ctx.translate(-DW / 2, -DH / 2);
  for (var fi = 0; fi < flowers.length; fi++) drawFlower(flowers[fi], 0);
  ctx.restore();
  // masks in depth order: far (0..2), mid (3..6), near (7..10)
  for (var i = 0; i < masks.length; i++) drawMask(masks[i], i, tLoop);
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: whole design visible, page ground is the piece ground
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
