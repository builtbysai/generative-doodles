<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaos Game (27)</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#000000';
var PLATE = '#f2efe8';
var INK = '#1c1c22';
/* One triangle, one drifting parameter. A golden stippled Sierpinski
   pyramid builds dot by dot on black; the step fraction p then drifts
   on a slow sine, and the crystal melts toward lace and noise and
   rebuilds. The watchable thing is the fractal mid-transition, dots
   still landing, structure never settled. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
/* Fixed-seed LCG: the vertex choices are a pure function of the dot
   index, never Math.random(). */
var lcgState = 20190827 >>> 0;
function lcg() {
  lcgState = (Math.imul(lcgState, 1664525) + 1013904223) >>> 0;
  return lcgState / 4294967296;
}
var DOT_RATE = 500;      /* dots per second of piece time */
var K0 = 9000;           /* dots already landed in frame one */
var WINDOW = 22000;      /* dots kept on screen; older dots fall away */
var SWEEP_PERIOD = 120;  /* seconds of dot-time per full p cycle */
var P_MID = 0.725, P_AMP = 0.225; /* p sweeps 0.5 to 0.95 and back */
function paramAt(tau) {
  return P_MID - P_AMP * Math.cos(TAU * tau / SWEEP_PERIOD);
}
/* Dot color is a closed-form function of p: golden at the middle,
   iron red as p climbs, white at the extreme. Nothing else. */
var GOLD = [217, 164, 65], RED = [179, 58, 43], WHITE = [255, 255, 255];
var BUCKETS = 48;
var bucketStyle = [];
(function () {
  var b, p, f, r, g, bl;
  for (b = 0; b < BUCKETS; b++) {
    p = 0.5 + (b / (BUCKETS - 1)) * 0.45;
    if (p <= 0.75) {
      f = (p - 0.5) / 0.25;
      r = lerp(GOLD[0], RED[0], f);
      g = lerp(GOLD[1], RED[1], f);
      bl = lerp(GOLD[2], RED[2], f);
    } else {
      f = (p - 0.75) / 0.20;
      r = lerp(RED[0], WHITE[0], f);
      g = lerp(RED[1], WHITE[1], f);
      bl = lerp(RED[2], WHITE[2], f);
    }
    bucketStyle.push('rgba(' + Math.round(r) + ',' + Math.round(g) + ','
      + Math.round(bl) + ',0.6000)');
  }
})();
function bucketFor(p) {
  return clamp(Math.floor((p - 0.5) / 0.45 * BUCKETS), 0, BUCKETS - 1);
}
/* Triangle vertices in figure space, a square of side 1 centered at
   the origin, apex up. */
var VX = [0, -0.48, 0.48];
var VY = [-0.55, 0.30, 0.30];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* The chaos game state. dots holds the visible window in figure
   space; simK is the global dot index, a pure function of piece
   time: simK = K0 + DOT_RATE * t. */
var dots = [];
var simK = 0;
var px = 0, py = 0;
function advanceTo(targetK) {
  var tau, p, vi;
  while (simK < targetK) {
    tau = simK / DOT_RATE;
    p = paramAt(tau);
    vi = Math.floor(lcg() * 3);
    px += p * (VX[vi] - px);
    py += p * (VY[vi] - py);
    dots.push(px, py, bucketFor(p));
    simK++;
  }
  if (dots.length > (WINDOW + 512) * 3) {
    dots.splice(0, dots.length - WINDOW * 3);
  }
}
function drawDots() {
  var S = Math.min(VW, VH) * 0.80;
  var cx = VW / 2, cy = VH * 0.50;
  var dot = Math.min(VW, VH) >= 700 ? 2 : 1;
  var i, cur = -1;
  for (i = 0; i < dots.length; i += 3) {
    if (dots[i + 2] !== cur) {
      cur = dots[i + 2];
      ctx.fillStyle = bucketStyle[cur];
    }
    ctx.fillRect(cx + dots[i] * S, cy + dots[i + 1] * S, dot, dot);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Chaos Game (27)').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Chaos Game (27)').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 02').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = 'rgba(28,28,34,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Chaos Game (27)', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = 'rgba(28,28,34,0.8)';
  ctx.fillText('2006 · 08 · 02', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = 'rgba(28,28,34,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = 'rgba(28,28,34,0.9)';
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var K = Math.floor(K0 + DOT_RATE * t);
  advanceTo(K);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawDots();
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    dotCount: function () { return dots.length / 3; },
    simK: function () { return simK; },
    paramAt: function (tau) { return paramAt(tau); }
  };
}
/* ---- frame one: t = 0, 9000 dots landed, p from 0.5 to 0.593,
   a golden pyramid mid-build ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = 0, prevTs = null, t0 = null;
draw(0);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
