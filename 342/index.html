<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.342 Flat Net</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4EFE3; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.342 Flat Net (myclayco).
// After their bow cutter and its "looks kinda weird before
// you assemble it" moment: the flat net of a bow drawn on
// paper as pure line, two loop blanks left and right, a
// knot band in the middle, two notched tails below, and
// dashed terracotta score lines on every fold. On a 24s
// seamless loop the net folds itself up into the bow and
// unfolds back to the net: holds at both ends, ease in-out
// between, phases 5 + 8 + 5 + 5 + 1 = 24s, so frame 24s
// is pixel-identical to frame 0. The fold is 2D hinge work
// computed as data, no 3D library: loops compress toward
// their hinge, swell taller and lift at the far edge,
// tails swing about their base hinge to hang under the
// knot, the knot cinches and takes its ridge lines. The
// dusty rose fill belongs to the assembled bow only; its
// weight tracks the fold, so the flat net is lines only.
// Watch-only. All marks are drawn directly each frame on
// one canvas: no offscreen canvas, no gradients, no
// shadowBlur, no filters.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F4EFE3', INK = '#1C1A17', TERRA = '#C25E3C', ROSE = '#D98E8E';
var DW = 1280, DH = 900;
var LOOP = 24;              // seconds, seamless
var CLOCK0 = 9.0;           // offset clock: frame one is mid-fold
var TAU = Math.PI * 2;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;

// ---- net geometry, all as JS data ------------------------------
// Design centre of the net.
var CX = 640, CY = 431;

// A lens (loop blank) sampled from two cubic arcs that meet
// at pointed tips, with a small authored jitter baked into
// the samples so the line keeps a hand-drawn stance. rx is
// the half width, ry the half height at the crown.
function lensPoints(cx, cy, rx, ry) {
  var pts = [];
  var SEG = 26, i, t, mt, a, b, c, d, x, y;
  // top arc, left tip to right tip
  for (i = 0; i <= SEG; i++) {
    t = i / SEG; mt = 1 - t;
    a = mt * mt * mt; b = 3 * mt * mt * t; c = 3 * mt * t * t; d = t * t * t;
    x = a * -rx + b * (-rx * 0.5) + c * (rx * 0.5) + d * rx;
    y = b * (-ry * 1.33) + c * (-ry * 1.33);
    pts.push([cx + x, cy + y]);
  }
  // bottom arc, right tip back to left tip
  for (i = 1; i <= SEG; i++) {
    t = i / SEG; mt = 1 - t;
    a = mt * mt * mt; b = 3 * mt * mt * t; c = 3 * mt * t * t; d = t * t * t;
    x = a * rx + b * (rx * 0.5) + c * (-rx * 0.5) + d * -rx;
    y = b * (ry * 1.33) + c * (ry * 1.33);
    pts.push([cx + x, cy + y]);
  }
  // authored wobble, tips kept exact
  for (i = 0; i < pts.length; i++) {
    var lx = pts[i][0] - cx;
    var keep = Math.min(1, (rx - Math.abs(lx)) / 34);
    if (keep > 0) {
      pts[i][0] += 1.5 * Math.sin(i * 2.39 + 0.7) * keep;
      pts[i][1] += 1.5 * Math.cos(i * 1.83 + 0.2) * keep;
    }
  }
  return pts;
}
var LOOP_L = lensPoints(392, CY, 178, 88);
var LOOP_R = LOOP_L.map(function (p) { return [2 * CX - p[0], p[1]]; });

// The knot: a rounded-rect band sampled as a polygon.
function knotPoints() {
  var x0 = 578, x1 = 702, y0 = 384, y1 = 478, r = 16;
  var pts = [], i, a;
  // walk the four edges with arc corners, starting top-left
  var arcs = [
    [x1 - r, y0 + r, -Math.PI / 2, 0],
    [x1 - r, y1 - r, 0, Math.PI / 2],
    [x0 + r, y1 - r, Math.PI / 2, Math.PI],
    [x0 + r, y0 + r, Math.PI, Math.PI * 1.5]
  ];
  pts.push([x0 + r, y0]);
  pts.push([x1 - r, y0]);
  for (var k = 0; k < 4; k++) {
    var arc = arcs[k];
    for (i = 1; i <= 5; i++) {
      a = arc[2] + (arc[3] - arc[2]) * i / 5;
      pts.push([arc[0] + r * Math.cos(a), arc[1] + r * Math.sin(a)]);
    }
    if (k === 0) pts.push([x1, y1 - r]);
    if (k === 1) pts.push([x0 + r, y1]);
    if (k === 2) pts.push([x0, y0 + r]);
  }
  return pts;
}
var KNOT = knotPoints();

// The tails: ribbons with a V notch at the far end, authored
// flat. Left tail points walk base-left, base-right, far
// inner, notch, far outer. The bases meet at the centre of
// the knot's bottom edge and never overlap, so the inner
// edges hang either side of the centre line. The hinge is
// the base midpoint.
var TAIL_L = [
  [590, 480], [640, 486], [556, 726], [530, 678], [478, 688]
];
var TAIL_R = TAIL_L.map(function (p) { return [2 * CX - p[0], p[1]]; });
var HINGE_L = [615, 483], HINGE_R = [2 * CX - 615, 483];

// ---- fold timeline ----------------------------------------------
// Holds at both ends, ease in-out between. Phases sum to
// 24s: flat hold 5, fold 8, bow hold 5, unfold 5, flat 1.
function smoother(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function foldAmount(tau) {
  if (tau < 5) return 0;
  if (tau < 13) return smoother((tau - 5) / 8);
  if (tau < 18) return 1;
  if (tau < 23) return 1 - smoother((tau - 18) / 5);
  return 0;
}

// ---- piece transforms --------------------------------------------
// Loops: compress toward the hinge, swell taller, and lift,
// the far edge lifting most, a perspective skew as data.
function loopPose(pts, hingeX, f) {
  var comp = 1 - 0.22 * f;
  var out = [];
  for (var i = 0; i < pts.length; i++) {
    var dx = pts[i][0] - hingeX;
    var dy = pts[i][1] - CY;
    var adx = Math.abs(dx);
    var lift = f * (14 + adx * 0.083 + adx * 0.045);
    out.push([
      hingeX + dx * comp,
      CY + dy * (1 + 0.26 * f) - lift
    ]);
  }
  return out;
}
// Tails: swing about the base hinge from the flat splay to
// hanging under the knot, and tuck up a little.
function tailPose(pts, hinge, dir, f) {
  var a = dir * 0.30 * f;
  var ca = Math.cos(a), sa = Math.sin(a);
  var out = [];
  for (var i = 0; i < pts.length; i++) {
    var dx = pts[i][0] - hinge[0];
    var dy = pts[i][1] - hinge[1];
    out.push([
      hinge[0] + dx * ca - dy * sa,
      hinge[1] + dx * sa + dy * ca - 10 * f
    ]);
  }
  return out;
}
// Knot: cinch about its own centre.
function knotPose(pts, f) {
  var sx = 1 - 0.08 * f, sy = 1 + 0.04 * f;
  var out = [];
  for (var i = 0; i < pts.length; i++) {
    out.push([CX + (pts[i][0] - CX) * sx, CY + (pts[i][1] - CY) * sy]);
  }
  return out;
}

function trace(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
function piece(pts, fillAmt) {
  trace(pts);
  if (fillAmt > 0.003) {
    ctx.save();
    ctx.globalAlpha = fillAmt;
    ctx.fillStyle = ROSE;
    ctx.fill();
    ctx.restore();
  }
  ctx.strokeStyle = INK;
  ctx.lineWidth = 3;
  ctx.stroke();
}

// ---- draw ----------------------------------------------------------
function draw(tau) {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, DW, DH);
  var f = foldAmount(tau);
  var fL = smoother(clamp01(f * 1.15));
  var fT = smoother(clamp01((f - 0.08) / 0.92));
  var fK = smoother(clamp01(f));

  var tailL = tailPose(TAIL_L, HINGE_L, -1, fT);
  var tailR = tailPose(TAIL_R, HINGE_R, 1, fT);
  var loopL = loopPose(LOOP_L, 574, fL);
  var loopR = loopPose(LOOP_R, 706, fL);
  var knot = knotPose(KNOT, fK);

  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // tails first (behind), then loops, knot on top
  piece(tailL, fT);
  piece(tailR, fT);
  piece(loopL, fL);
  piece(loopR, fL);

  // score lines: dashed terracotta on every fold. The loop
  // creases are printed near the loop bases and travel with
  // the compression; the tail scores ride their base edges
  // as they swing.
  var comp = 1 - 0.22 * fL;
  var creaseL = 574 + (548 - 574) * comp;
  var creaseR = 706 + (732 - 706) * comp;
  var creaseHalf = 32 * (1 + 0.26 * fL);
  var creaseLift = 12 * fL;
  ctx.save();
  ctx.strokeStyle = TERRA;
  ctx.lineWidth = 2.5;
  ctx.setLineDash([8, 7]);
  ctx.beginPath();
  ctx.moveTo(creaseL, CY - creaseHalf - creaseLift); ctx.lineTo(creaseL, CY + creaseHalf - creaseLift);
  ctx.moveTo(creaseR, CY - creaseHalf - creaseLift); ctx.lineTo(creaseR, CY + creaseHalf - creaseLift);
  ctx.moveTo(tailL[0][0], tailL[0][1]); ctx.lineTo(tailL[1][0], tailL[1][1]);
  ctx.moveTo(tailR[0][0], tailR[0][1]); ctx.lineTo(tailR[1][0], tailR[1][1]);
  ctx.stroke();
  ctx.restore();

  // the knot, layered on top; its ridge lines arrive with
  // the fold
  piece(knot, fK);
  if (fK > 0.003) {
    ctx.save();
    ctx.globalAlpha = fK;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2.5;
    var sx = 1 - 0.08 * fK, sy = 1 + 0.04 * fK;
    ctx.beginPath();
    [-22, 22].forEach(function (off) {
      ctx.moveTo(CX + off * sx, CY + (396 - CY) * sy);
      ctx.lineTo(CX + off * sx, CY + (466 - CY) * sy);
    });
    ctx.stroke();
    ctx.restore();
  }
}

// ---- sizing, frame, loop --------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Centred fit: the shaped composition keeps its shape at
  // any aspect, and the page ground is the paper colour.
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var tau = (((time || 0) / 1000) + CLOCK0) % LOOP;
  draw(tau);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
