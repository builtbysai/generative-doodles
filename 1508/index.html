<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odyssey: One Woman Against the Elements</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; }
  canvas { display: block; background: #2a2a30; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function () {
  'use strict';
  var FIELD = '#2a2a30';
  var CREAM = '#e8e0d0';
  var GOLD = '#d9a441';
  var SLATE = '#4a5a7a';
  var TEAL = '#2e6f6a';
  var GREY = '#b8bcc0';
  var BRICK = '#a8674a';
  var LOOP = 48;
  var PHASE_SHIFT = 6;
  var SLOT = 12;
  var BASE_STIFF = 0.7;
  var SEED = 1508000;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rnd4(v) { return Math.round(v * 10000) / 10000; }
  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function fill(hex, alpha) {
    var c = hexRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + rnd4(alpha) + ')';
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

  var rand = mulberry32(SEED);
  var windStreaks = [];
  for (var i = 0; i < 26; i++) {
    windStreaks.push({ p: rand(), y: 0.15 + rand() * 0.70, len: 0.08 + rand() * 0.08, a: 0.45 + rand() * 0.45 });
  }
  var stormMarks = [];
  for (var j = 0; j < 220; j++) {
    stormMarks.push({ x: 0.45 + rand() * 0.55, y: 0.12 + rand() * 0.76, s: 2 + rand() * 3, ph: rand() * 6.283, a: 0.25 + rand() * 0.55 });
  }
  var chaosFrags = [];
  for (var k = 0; k < 40; k++) {
    chaosFrags.push({ x: 0.42 + rand() * 0.55, y: 0.15 + rand() * 0.70, w: 0.010 + rand() * 0.022, h: 0.008 + rand() * 0.018, rot: rand() * 3.14, ph: rand() * 6.283, a: 0.70 + rand() * 0.30 });
  }

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, U = 0;
  var curT = 0;
  var events = [];
  var isDown = false;

  function size() {
    var vw, vh;
    if (typeof window !== 'undefined' && window.visualViewport) {
      vw = window.visualViewport.width; vh = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      vw = window.innerWidth; vh = window.innerHeight;
    } else { vw = 720; vh = 720; }
    W = vw; H = vh; U = Math.min(W, H);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  function onResize() { size(); drawAt(curT); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }

  function mapStiff(px) { return clamp(1.05 - 0.8 * px, 0.25, 1.0); }
  function stiffnessAt(t) {
    var last = null, lastUp = null, lastMove = null;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.t > t) break;
      last = e;
      if (e.type === 'up') lastUp = e;
      if (e.type === 'move' || e.type === 'down') lastMove = e;
    }
    if (!last) return BASE_STIFF;
    if (last.type === 'up') {
      var sUp = lastMove ? mapStiff(lastMove.x / W) : BASE_STIFF;
      return BASE_STIFF + (sUp - BASE_STIFF) * Math.exp(-(t - lastUp.t) / 1.5);
    }
    return mapStiff(last.x / W);
  }

  function env(st) {
    if (st < 2) return smooth(st / 2);
    if (st > 10) return smooth((SLOT - st) / 2);
    return 1;
  }
  function pressure(slot) {
    if (slot === 0) return 0.55;
    if (slot === 1) return 0.70;
    if (slot === 2) return 1.0;
    return 0.80;
  }

  function drawAt(t) {
    curT = t;
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var phase = (lt + PHASE_SHIFT) % LOOP;
    var slot = Math.floor(phase / SLOT);
    var st = phase - slot * SLOT;
    var e = env(st);
    var stiff = stiffnessAt(t);
    size();

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    var x0 = 0.18 * W, x1 = 0.88 * W;
    var baseY = 0.50 * H;
    var figX = 0.12 * W;
    var feetY = 0.66 * H;
    var headR = 0.032 * U;
    var headCy = feetY - 0.26 * U;
    var torsoW = 0.05 * U, torsoTop = feetY - 0.21 * U, torsoH = 0.13 * U;

    if (slot === 0) {
      ctx.strokeStyle = fill(SLATE, 0.9 * e);
      ctx.lineWidth = Math.max(1.5, 0.003 * U);
      for (var wi = 0; wi < windStreaks.length; wi++) {
        var s = windStreaks[wi];
        var u = (s.p + st / SLOT) % 1;
        var sx = (1 - u) * 1.15 * W - 0.05 * W;
        var sy = s.y * H;
        var sl = s.len * W;
        var edge = clamp(Math.min(sx / (0.15 * W), (W - sx) / (0.15 * W)), 0, 1);
        ctx.strokeStyle = fill(SLATE, s.a * e * edge);
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + sl, sy - sl * 0.35);
        ctx.stroke();
      }
    } else if (slot === 1) {
      ctx.lineWidth = Math.max(2, 0.004 * U);
      for (var band = 0; band < 4; band++) {
        var by = (0.28 + band * 0.13) * H;
        var amp = 0.022 * H * e;
        ctx.strokeStyle = fill(TEAL, (0.85 - band * 0.12) * e);
        ctx.beginPath();
        var first = true;
        for (var bx = 0.35 * W; bx <= W; bx += W / 60) {
          var wy = by + amp * Math.sin(6.283 * ((bx - 0.35 * W) / (0.30 * W) - st / 6 + band * 0.25));
          if (first) { ctx.moveTo(bx, wy); first = false; } else { ctx.lineTo(bx, wy); }
        }
        ctx.stroke();
      }
    } else if (slot === 2) {
      for (var mi = 0; mi < stormMarks.length; mi++) {
        var mk = stormMarks[mi];
        var mx = mk.x * W + 0.012 * W * Math.sin(6.283 * (st / 2 + mk.ph));
        var my = mk.y * H + 0.012 * H * Math.cos(6.283 * (st / 2.7 + mk.ph));
        ctx.fillStyle = fill(GREY, mk.a * e);
        ctx.fillRect(mx, my, mk.s, mk.s);
      }
    } else {
      for (var ci = 0; ci < chaosFrags.length; ci++) {
        var cf = chaosFrags[ci];
        var cx = cf.x * W + 0.02 * W * Math.sin(6.283 * (st / 9 + cf.ph));
        var cy = cf.y * H + 0.02 * H * Math.cos(6.283 * (st / 11 + cf.ph));
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(cf.rot);
        ctx.fillStyle = fill(BRICK, cf.a * e);
        ctx.fillRect(-cf.w * U / 2, -cf.h * U / 2, cf.w * U, cf.h * U);
        ctx.restore();
      }
    }

    var ampMax = 0.10 * H;
    var bend = ampMax * pressure(slot) * e / stiff;
    if (bend > 0.12 * H) bend = 0.12 * H;
    bend += 0.008 * H * Math.sin(6.283 * lt / LOOP);
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = Math.max(2, 0.006 * U);
    ctx.beginPath();
    var firstPt = true;
    for (var lx = x0; lx <= x1; lx += (x1 - x0) / 60) {
      var lu = (lx - x0) / (x1 - x0);
      var dy = bend * Math.sin(3.14159 * lu);
      if (slot === 1) dy += 0.2 * bend * Math.sin(6.283 * (3 * lu) + phase * 0.5);
      if (firstPt) { ctx.moveTo(lx, baseY + dy); firstPt = false; } else { ctx.lineTo(lx, baseY + dy); }
    }
    ctx.stroke();

    ctx.fillStyle = CREAM;
    ctx.beginPath();
    ctx.moveTo(figX + headR, headCy);
    ctx.arc(figX, headCy, headR, 0, 6.283);
    ctx.fill();
    ctx.fillRect(figX - torsoW / 2, torsoTop, torsoW, torsoH);
    ctx.fillRect(figX - torsoW / 2, torsoTop + torsoH, torsoW * 0.4, feetY - (torsoTop + torsoH));
    ctx.fillRect(figX + torsoW * 0.1, torsoTop + torsoH, torsoW * 0.4, feetY - (torsoTop + torsoH));
    ctx.fillRect(figX - torsoW / 2, torsoTop + torsoH * 0.25, (x0 - figX) + torsoW / 2, Math.max(2, 0.008 * U));
  }

  function onDown(ev) {
    isDown = true;
    events.push({ t: curT, type: 'down', x: ev.clientX });
    if (ev.preventDefault) ev.preventDefault();
  }
  function onMove(ev) {
    if (!isDown) return;
    events.push({ t: curT, type: 'move', x: ev.clientX });
  }
  function onUp(ev) {
    if (!isDown) return;
    isDown = false;
    events.push({ t: curT, type: 'up', x: ev.clientX });
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  size();
  drawAt(0);

  if (typeof window !== 'undefined') {
    window.__piece = { drawAt: drawAt, stiffnessAt: stiffnessAt, loop: LOOP };
  }

  function loop(now) {
    if (typeof loop._start === 'undefined') loop._start = now;
    var el = (now - loop._start) / 1000;
    drawAt(el);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
