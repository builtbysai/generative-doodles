<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silent Choir</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, phone = false;
  function size() {
    var w = 800, h = 600;
    try {
      if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
      else { w = window.innerWidth; h = window.innerHeight; }
    } catch (e) { /* keep fallback */ }
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    try {
      var minDim = Math.min(window.screen.width, window.screen.height);
      phone = minDim < 700;
      if (!phone) { phone = (h > w * 1.15); }
    } catch (e) { phone = false; }
  }
  size();
  try {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); });
    }
    if (window.addEventListener) { window.addEventListener('resize', function () { size(); }); }
  } catch (e) { /* listeners optional */ }

  /* ---- seeded content (never Math.random, never Date.now) ---- */
  var CYCLE = 30;            /* one vial pulse per 30 s cycle */
  var NPART = 110;
  var parts = [];
  var rng = mulberry32(1363000);
  var i, p;
  for (i = 0; i < NPART; i++) {
    p = {
      x: rng(),
      life: 14 + rng() * 14,          /* seconds to rise the full field */
      off: rng() * 30,                /* phase offset, so frame one is populated */
      sway: 6 + rng() * 22,           /* px of horizontal sway */
      swayP: rng() * Math.PI * 2,
      swayT: 7 + rng() * 9,           /* sway period */
      size: 1.2 + rng() * 3.4,
      tone: rng(),                    /* 0 = breath-white, 1 = ash, 2 = ember tint */
      peak: 0.10 + rng() * 0.22
    };
    parts.push(p);
  }

  /* waveform shape: fixed seeded sum of sines over x (amplitude breathes with time) */
  var waveCo = [];
  var wrng = mulberry32(1363000 + 7919);
  for (i = 0; i < 5; i++) {
    waveCo.push({ f: 2 + wrng() * 9, a: 0.4 + wrng() * 0.6, ph: wrng() * Math.PI * 2 });
  }
  function waveY(x, t) {
    var y = 0, k;
    for (k = 0; k < waveCo.length; k++) {
      y += waveCo[k].a * Math.sin(x * waveCo[k].f * Math.PI * 2 + waveCo[k].ph);
    }
    return y;
  }

  /* grain: seeded function of (dot index, quantized 2 s time index) — stable within a step */
  var NGRAIN = 240;
  var grain = [];
  var grng = mulberry32(1363000 + 2 * 7919);
  for (i = 0; i < NGRAIN; i++) {
    grain.push({ x: grng(), y: grng(), s: grng() < 0.5 ? 1 : 2 });
  }
  function grainAlpha(gi, tIdx) {
    var r = mulberry32(1363000 + 3 * 7919 + gi * 131 + tIdx * 17);
    return r() < 0.5 ? 0.05 : 0.10;
  }

  /* vial pulse: one pulse per cycle, gaussian around phase 0.45 */
  function vialPulse(t) {
    var ph = (t % CYCLE) / CYCLE;
    var d = (ph - 0.45) / 0.09;
    return Math.exp(-d * d);
  }

  function draw(t) {
    var x, y, k, a, age, lifeT, yy, alpha;
    var minD = Math.min(W, H);
    /* ground: the piece's own near-black, never brightened */
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    /* faint grain overlay (seeded, quantized) */
    var tIdx = Math.floor(t / 2);
    for (k = 0; k < grain.length; k++) {
      ctx.fillStyle = 'rgba(216,212,204,' + grainAlpha(k, tIdx).toFixed(3) + ')';
      ctx.fillRect(grain[k].x * W, grain[k].y * H, grain[k].s, grain[k].s);
    }

    /* field-recording waveform: thin horizon line, faintly pulsing amplitude */
    var waveBaseY = H * 0.42;
    var amp = (2.5 + 3.5 * (0.5 + 0.5 * Math.sin(t * Math.PI * 2 / CYCLE))) * (minD / 900 + 0.5);
    ctx.strokeStyle = 'rgba(140,140,140,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (x = 0; x <= W; x += 4) {
      yy = waveBaseY + waveY(x / W, t) * amp;
      if (x === 0) { ctx.moveTo(x, yy); } else { ctx.lineTo(x, yy); }
    }
    ctx.stroke();

    /* breath particles: rise on a slow clock, stored closed-form paths */
    for (k = 0; k < parts.length; k++) {
      p = parts[k];
      age = (t + p.off) % p.life;
      lifeT = age / p.life;
      x = p.x * W + Math.sin(t * Math.PI * 2 / p.swayT + p.swayP) * p.sway;
      y = H * 1.02 - lifeT * H * 1.04;
      /* fade in over first 15%, out over last 30% */
      if (lifeT < 0.15) { alpha = p.peak * (lifeT / 0.15); }
      else if (lifeT > 0.70) { alpha = p.peak * (1 - (lifeT - 0.70) / 0.30); }
      else { alpha = p.peak; }
      if (alpha <= 0) { continue; }
      if (p.tone < 0.6) { ctx.fillStyle = 'rgba(216,212,204,' + alpha.toFixed(3) + ')'; }
      else if (p.tone < 0.85) { ctx.fillStyle = 'rgba(140,140,140,' + alpha.toFixed(3) + ')'; }
      else { ctx.fillStyle = 'rgba(201,106,44,' + (alpha * 0.8).toFixed(3) + ')'; }
      ctx.beginPath();
      ctx.moveTo(x + p.size, y);
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    /* the vial: low-center, one contained breath */
    var vx = W * 0.5, vy = H * 0.78;
    var pulse = vialPulse(t);
    var glowR = minD * 0.045 * (1 + pulse * 0.9);
    var glowA = 0.10 + pulse * 0.35;
    ctx.fillStyle = 'rgba(201,106,44,' + glowA.toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(vx + glowR, vy);
    ctx.arc(vx, vy, glowR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(201,106,44,' + (0.25 + pulse * 0.55).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(vx + glowR * 0.45, vy);
    ctx.arc(vx, vy, glowR * 0.45, 0, Math.PI * 2);
    ctx.fill();
    /* vial glass: small upright capsule outline, ash stroke */
    var vw = Math.max(5, minD * 0.012), vh = Math.max(14, minD * 0.032);
    ctx.strokeStyle = 'rgba(216,212,204,0.65)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(vx - vw, vy - vh);
    ctx.lineTo(vx - vw, vy + vh);
    ctx.lineTo(vx + vw, vy + vh);
    ctx.lineTo(vx + vw, vy - vh);
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = 'rgba(216,212,204,0.9)';
    ctx.beginPath();
    ctx.moveTo(vx + 2.5, vy);
    ctx.arc(vx, vy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  /* frame one is drawn synchronously at t = 0 via a boot flag;
     the clock starts only with the rAF loop. */
  var started = false;
  var t0 = 0;
  draw(0);
  function loop(ts) {
    if (!started) { started = true; t0 = ts; }
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') { requestAnimationFrame(loop); }
  }
  if (typeof requestAnimationFrame !== 'undefined') { requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
