<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№129 · The Crescent Shore</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EDE3; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function nowMs(){ if(typeof performance!=='undefined'&&performance&&typeof performance.now==='function') return performance.now(); return Date.now(); }

// No.129 The Crescent Shore: a Gray-Scott reaction-diffusion field, hard
// thresholded to ink on paper. Position on the f/k parameter square picks
// the regime along a crescent: spots, then worms, then coral labyrinths.
// The strip along the bottom edge is the instrument: tap or drag on it to
// scrub f/k, and the field regrows from a small noisy blob seed.
const GROUND='#F2EDE3', INK='#1A1A1A';
// diffusion scaling chosen so the three Pearson points below land in their
// named regimes on this grid: spots, worms and coral all verified in QA
const Du=0.2097, Dv=0.105;
const F_MIN=0.010, F_MAX=0.080, K_MIN=0.040, K_MAX=0.075;
const CRESCENT=[[0.035,0.065],[0.048,0.065],[0.0545,0.062]];
let F=CRESCENT[2][0], K=CRESCENT[2][1];
let W=0,H=0, GW=0, GH=0, U=null, V=null, U2=null, V2=null;
let rng=mulberry32(322), reseedCount=0;
let lastMs=null, lastInteractMs=nowMs(), autoT=2, autoDir=1;
let drag=null;

function crescentAt(t){
  // t in [0,2]: 0 spots, 1 worms, 2 coral; smooth interp along the shore
  t=clamp(t,0,2);
  const i=t>=1?1:0, f=t-i, s=f*f*(3-2*f);
  const a=CRESCENT[i], b=CRESCENT[i+1];
  return [a[0]+(b[0]-a[0])*s, a[1]+(b[1]-a[1])*s];
}
function nearestT(f,k){
  let best=1, bd=1e9;
  for(let i=0;i<=40;i++){ const p=crescentAt(i/20); const d=(p[0]-f)*(p[0]-f)*40+(p[1]-k)*(p[1]-k); if(d<bd){ bd=d; best=i/20; } }
  return best;
}
function layout(){
  const m=isPhone()?10:14, stripH=isPhone()?60:68;
  const fw=Math.max(50,W-2*m), fh=Math.max(50,H-stripH-m-8);
  return { m, stripH, fx:m, fy:m, fw, fh, sy:H-stripH, sh:stripH };
}
function initGrid(){
  const L=layout();
  const maxDim=144;
  if(L.fw>=L.fh){ GW=maxDim; GH=Math.max(48,Math.round(maxDim*L.fh/L.fw)); }
  else { GH=maxDim; GW=Math.max(48,Math.round(maxDim*L.fw/L.fh)); }
  const n=GW*GH;
  U=new Float32Array(n); V=new Float32Array(n);
  U2=new Float32Array(n); V2=new Float32Array(n);
}
function seedBlob(R,cx,cy,baseR){
  // an irregular disc, radius wobbled by angle, never a clean square
  const wob=[]; for(let i=0;i<12;i++) wob.push(0.7+R()*0.6);
  const Rr=Math.ceil(baseR*1.6);
  for(let y=Math.max(0,Math.floor(cy-Rr));y<Math.min(GH,cy+Rr+1);y++) for(let x=Math.max(0,Math.floor(cx-Rr));x<Math.min(GW,cx+Rr+1);x++){
    const dx=x-cx, dy=y-cy, d=Math.sqrt(dx*dx+dy*dy);
    if(d<baseR*1.5){
      const a=Math.atan2(dy,dx), wi=((Math.round((a+Math.PI)/(2*Math.PI)*12)%12)+12)%12;
      if(d<baseR*wob[wi]){ const i=y*GW+x; V[i]=0.5; U[i]=0.5; }
    }
  }
}
function seedField(){
  reseedCount++;
  const R=mulberry32(322+reseedCount*7919);
  const n=GW*GH;
  for(let i=0;i<n;i++){ U[i]=1; V[i]=0; }
  // dense jittered grid of small noisy blobs across the whole frame, so
  // growth starts everywhere at once instead of spreading from one blob
  const step=15;
  for(let gy=step/2;gy<GH;gy+=step) for(let gx=step/2;gx<GW;gx+=step){
    seedBlob(R, gx+(R()-0.5)*10, gy+(R()-0.5)*10, 2+R()*1.8);
  }
  // one larger blob near the middle as the main shore seed
  seedBlob(R, GW*(0.38+R()*0.24), GH*(0.38+R()*0.24), Math.min(GW,GH)*(0.07+R()*0.03));
  // noise specks scattered wide so growth has many small shores
  for(let s=0;s<46;s++){
    const sx=(R()*GW)|0, sy=(R()*GH)|0, r=1+R()*2.2;
    for(let y=Math.max(0,sy-3);y<Math.min(GH,sy+4);y++) for(let x=Math.max(0,sx-3);x<Math.min(GW,sx+4);x++){
      const dx=x-sx, dy=y-sy;
      if(dx*dx+dy*dy<r*r && R()<0.8){ const i=y*GW+x; V[i]=0.35+R()*0.2; U[i]=1-V[i]; }
    }
  }
  // faint grain so no region stays perfectly sterile
  for(let i=0;i<n;i++) if(R()<0.012) V[i]=0.2+R()*0.15;
}
function stepSim(){
  const kill=F+K;
  for(let y=0;y<GH;y++){
    const yu=y>0?y-1:GH-1, yd=y<GH-1?y+1:0;
    for(let x=0;x<GW;x++){
      const xl=x>0?x-1:GW-1, xr=x<GW-1?x+1:0;
      const i=y*GW+x;
      const lapU=0.2*(U[y*GW+xl]+U[y*GW+xr]+U[yu*GW+x]+U[yd*GW+x])
        +0.05*(U[yu*GW+xl]+U[yu*GW+xr]+U[yd*GW+xl]+U[yd*GW+xr])-U[i];
      const lapV=0.2*(V[y*GW+xl]+V[y*GW+xr]+V[yu*GW+x]+V[yd*GW+x])
        +0.05*(V[yu*GW+xl]+V[yu*GW+xr]+V[yd*GW+xl]+V[yd*GW+xr])-V[i];
      const uvv=U[i]*V[i]*V[i];
      let nu=U[i]+Du*lapU-uvv+F*(1-U[i]);
      let nv=V[i]+Dv*lapV+uvv-kill*V[i];
      U2[i]=nu<0?0:(nu>1?1:nu); V2[i]=nv<0?0:(nv>1?1:nv);
    }
  }
  const t=U; U=U2; U2=t; const t2=V; V=V2; V2=t2;
}
function stripGeom(){
  const L=layout();
  const sq=L.sh-22, sx=(W-sq)/2, sy=L.sy+(L.sh-sq)/2-3;
  return { L, sq, sx, sy };
}
function paramToXY(f,k){
  const g=stripGeom();
  return [g.sx+(f-F_MIN)/(F_MAX-F_MIN)*g.sq, g.sy+(1-(k-K_MIN)/(K_MAX-K_MIN))*g.sq];
}
function paramFromXY(px,py){
  const g=stripGeom();
  const f=F_MIN+clamp((px-g.sx)/g.sq,0,1)*(F_MAX-F_MIN);
  const k=K_MIN+(1-clamp((py-g.sy)/g.sq,0,1))*(K_MAX-K_MIN);
  return [f,k];
}
function inStrip(px,py){ const L=layout(); return py>=L.sy-4; }
function inSquare(px,py){ const g=stripGeom(); return px>=g.sx-6&&px<=g.sx+g.sq+6&&py>=g.sy-6&&py<=g.sy+g.sq+6; }

function drawStrip(){
  const g=stripGeom(), L=g.L;
  ctx.strokeStyle=INK; ctx.globalAlpha=0.35; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,L.sy+0.5); ctx.lineTo(W,L.sy+0.5); ctx.stroke();
  ctx.globalAlpha=1;
  // hint sits in the strip, left of the square, so nothing overlaps
  ctx.fillStyle=INK; ctx.globalAlpha=0.55;
  ctx.font='10px -apple-system,"Segoe UI",system-ui,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('drag to scrub the shore', L.m, L.sy+L.sh/2);
  ctx.globalAlpha=1;
  // f/k square
  ctx.strokeStyle=INK; ctx.lineWidth=1;
  ctx.strokeRect(g.sx+0.5,g.sy+0.5,g.sq-1,g.sq-1);
  // crescent zone through the three Pearson points
  ctx.beginPath();
  for(let i=0;i<=40;i++){ const p=crescentAt(i/20); const xy=paramToXY(p[0],p[1]); if(i===0) ctx.moveTo(xy[0],xy[1]); else ctx.lineTo(xy[0],xy[1]); }
  ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke();
  ctx.lineWidth=1;
  for(const p of CRESCENT){ const xy=paramToXY(p[0],p[1]); ctx.beginPath(); ctx.arc(xy[0],xy[1],2.2,0,6.283); ctx.fillStyle=INK; ctx.fill(); }
  // current point marker
  const mp=paramToXY(F,K);
  ctx.beginPath(); ctx.arc(mp[0],mp[1],5,0,6.283); ctx.fillStyle=GROUND; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=1.6; ctx.stroke();
  ctx.beginPath(); ctx.arc(mp[0],mp[1],1.8,0,6.283); ctx.fillStyle=INK; ctx.fill();
  // tiny axis ticks only
  ctx.fillStyle=INK; ctx.font='9px Menlo, Consolas, monospace'; ctx.globalAlpha=0.7;
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('f', g.sx+g.sq/2, g.sy+g.sq+2);
  ctx.textAlign='right'; ctx.textBaseline='middle';
  ctx.fillText('k', g.sx-3, g.sy+g.sq/2);
  ctx.globalAlpha=1;
}
function drawFrame(now){
  const wh=viewportWH(); prep(wh[0],wh[1]); W=wh[0]; H=wh[1];
  if(lastMs!==null){
    // advance the simulation a few steps per frame
    for(let i=0;i<7;i++) stepSim();
    // untouched for 30s: slow auto-scrub drifts along the crescent
    if(now-lastInteractMs>30000){
      autoT+=autoDir*0.0016;
      if(autoT>=2){ autoT=2; autoDir=-1; } if(autoT<=0){ autoT=0; autoDir=1; }
      const p=crescentAt(autoT); F=p[0]; K=p[1];
    }
  }
  lastMs=now;
  const L=layout();
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,W,H);
  // field border
  ctx.strokeStyle=INK; ctx.lineWidth=1;
  ctx.strokeRect(L.fx+0.5,L.fy+0.5,L.fw-1,L.fh-1);
  // thresholded cells, batched into horizontal runs
  const TH=0.22, cw=L.fw/GW, ch=L.fh/GH;
  ctx.fillStyle=INK;
  for(let y=0;y<GH;y++){
    let run=-1;
    for(let x=0;x<=GW;x++){
      const on=x<GW && V[y*GW+x]>TH;
      if(on&&run<0) run=x;
      if(!on&&run>=0){
        ctx.fillRect(L.fx+run*cw, L.fy+y*ch, (x-run)*cw+0.6, ch+0.6);
        run=-1;
      }
    }
  }
  drawStrip();
  return {};
}
function frame(now){ return drawFrame(now); }

function ptrPos(e){ return [e.clientX,e.clientY]; }
canvas.addEventListener('pointerdown',e=>{
  const p=ptrPos(e); lastInteractMs=nowMs();
  if(inSquare(p[0],p[1])||inStrip(p[0],p[1])){
    const fk=paramFromXY(p[0],p[1]); F=fk[0]; K=fk[1]; autoT=nearestT(F,K);
    drag={ mode:'strip', moved:false, x:p[0], y:p[1] };
  } else {
    drag={ mode:'field', moved:false, x:p[0], y:p[1], t:nearestT(F,K) };
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!drag) return;
  const p=ptrPos(e); lastInteractMs=nowMs();
  if(Math.abs(p[0]-drag.x)+Math.abs(p[1]-drag.y)>3) drag.moved=true;
  if(drag.mode==='strip'){
    const fk=paramFromXY(p[0],p[1]); F=fk[0]; K=fk[1]; autoT=nearestT(F,K);
  } else {
    // field drag scrubs along the crescent by horizontal travel
    drag.t=clamp(drag.t+(p[0]-drag.x)*0.004,0,2); drag.x=p[0];
    const fk=crescentAt(drag.t); F=fk[0]; K=fk[1]; autoT=drag.t;
  }
  drawFrame(nowMs());
});
function endPtr(e){
  if(!drag) return;
  lastInteractMs=nowMs();
  const wasStrip=drag.mode==='strip';
  drag=null;
  // scrubbing or tapping the instrument regrows the field from a blob seed
  if(wasStrip) seedField();
  else seedField();
}
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',()=>{ drag=null; });

// staged first frame: grid sized to the opening viewport, seeded with a
// noisy blob and pre-warmed so the piece opens as a grown shore
(function init(){
  const wh=viewportWH(); W=wh[0]; H=wh[1]; prep(W,H);
  initGrid();
  seedField();
  for(let i=0;i<1200;i++) stepSim();
})();
function loop(now){ frame(now); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
frame(nowMs());
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(nowMs()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(nowMs()));
</script>
</body>
</html>
