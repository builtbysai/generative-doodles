<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№131 · Gather</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EDE3; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(42,33,24,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">hold to gather, release to stamp</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function nowMs(){ return (typeof performance!=='undefined'&&performance&&typeof performance.now==='function')?performance.now():Date.now(); }

// No.131 Gather: a slime-mold agent field (Physarum, Jones steering) on warm
// paper. Thousands of agents deposit into a shared trail map, sense the
// trail ahead-left, ahead and ahead-right, and turn toward the strongest
// scent in fixed 20 degree steps, so the network stays angular and
// reticulated rather than smooth. Press and hold pulls every agent inside
// a growing radius to the pointer; release stamps a flat deep ink disc
// into an obstacle mask that the swarm routes around and never deposits
// on. Discs persist and fade very slowly. The composition becomes a
// history of gathers. The trail map is a plain Float32Array grid rendered
// as batched fillRect runs on the main canvas only (never a second canvas
// or a pixel buffer), so the piece runs the same in the browser and under
// the node-canvas QA shim.
const GROUND='#F2EDE3', MID='#6B5D4F', DEEP='#2A2118';
const SA=22*Math.PI/180, RA=20*Math.PI/180, SO=9, STEP=1.7, DEP=0.85, CAP=1.6;
const rng=mulberry32(335);
let W=0, H=0;
let simW=0, simH=0, trail=null, trail2=null, mask=null;
let ax=null, ay=null, aa=null, NAG=0;
let discs=[]; // {fx, fy, fr as fraction of simW, born}
let hold=null; // {x, y in css px, since}
let stepCount=0;

function initSim(){
  const wh=viewportWH(); W=wh[0]; H=wh[1];
  // 0.5x render scale, fitted inside a 416x312 cap so the grid stays modest
  let gw=Math.max(120,Math.round(W*0.5)), gh=Math.max(120,Math.round(H*0.5));
  const fit=Math.min(1,416/gw,312/gh);
  simW=Math.max(96,Math.round(gw*fit)); simH=Math.max(96,Math.round(gh*fit));
  trail=new Float32Array(simW*simH); trail2=new Float32Array(simW*simH);
  mask=new Float32Array(simW*simH);
  NAG=isPhone()?5200:6200;
  ax=new Float32Array(NAG); ay=new Float32Array(NAG); aa=new Float32Array(NAG);
  // headings start on the 20 degree lattice the turns move in, so paths
  // stay polygonal instead of curving smoothly
  for(let i=0;i<NAG;i++){ ax[i]=rng()*simW; ay[i]=rng()*simH; aa[i]=((rng()*18)|0)*RA; }
}
function sense(x,y,ang){
  let sx=x+Math.cos(ang)*SO, sy=y+Math.sin(ang)*SO;
  sx-=Math.floor(sx/simW)*simW; sy-=Math.floor(sy/simH)*simH;
  const idx=(sy|0)*simW+(sx|0);
  return trail[idx]*(1-mask[idx]);
}
function diffuse(){
  // 5-neighbour diffusion plus decay every 4th step: enough spread for the
  // scent to be followable, little enough that veins stay thin and crisp.
  const w=simW, h=simH, src=trail, dst=trail2;
  for(let y=0;y<h;y++){
    const yu=y>0?y-1:0, yd=y<h-1?y+1:h-1, r0=y*w, ru=yu*w, rd=yd*w;
    for(let x=0;x<w;x++){
      const xl=x>0?x-1:0, xr=x<w-1?x+1:w-1;
      dst[r0+x]=(src[r0+x]*6+src[r0+xl]+src[r0+xr]+src[ru+x]+src[rd+x])*0.1*0.90;
    }
  }
  const t=trail; trail=trail2; trail2=t;
  if(discs.length){ for(let i=0;i<mask.length;i++) mask[i]*=0.9995; }
}
function stampMask(d){
  const cx=d.fx*simW, cy=d.fy*simH, r=d.fr*simW, r2=r*r;
  const x0=Math.max(0,Math.floor(cx-r)), x1=Math.min(simW-1,Math.ceil(cx+r));
  const y0=Math.max(0,Math.floor(cy-r)), y1=Math.min(simH-1,Math.ceil(cy+r));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const dx=x-cx, dy=y-cy; if(dx*dx+dy*dy<=r2) mask[y*simW+x]=1;
  }
}
function holdRadius(){
  if(!hold) return 0;
  return Math.min(120, 26+(nowMs()-hold.since)*0.09);
}
function agentStep(){
  let hx=0, hy=0, hr=0;
  if(hold){ hx=hold.x/(W/simW); hy=hold.y/(H/simH); hr=holdRadius()/(W/simW); }
  for(let i=0;i<NAG;i++){
    let x=ax[i], y=ay[i], a=aa[i];
    if(hold){
      const dx=hx-x, dy=hy-y, d2=dx*dx+dy*dy;
      if(d2<hr*hr){
        const d=Math.sqrt(d2)||0.001;
        const pull=Math.min(d,2.6);
        x+=dx/d*pull; y+=dy/d*pull;
        a=Math.atan2(dy,dx)+(rng()-0.5)*0.6;
        ax[i]=x; ay[i]=y; aa[i]=a;
        const idx=clamp(y|0,0,simH-1)*simW+clamp(x|0,0,simW-1);
        if(mask[idx]<0.4) trail[idx]=Math.min(CAP,trail[idx]+DEP);
        continue;
      }
    }
    const fl=sense(x,y,a-SA), f=sense(x,y,a), fr=sense(x,y,a+SA);
    if(f>fl&&f>fr){ /* keep heading */ }
    else if(f<fl&&f<fr){ a+=(rng()<0.5?-RA:RA); }
    else if(fl<fr){ a+=RA; }
    else if(fr<fl){ a-=RA; }
    let nx=x+Math.cos(a)*STEP, ny=y+Math.sin(a)*STEP;
    nx-=Math.floor(nx/simW)*simW; ny-=Math.floor(ny/simH)*simH;
    const idx=(ny|0)*simW+(nx|0);
    if(mask[idx]>0.4){ aa[i]=a+RA*2*(rng()<0.5?-1:1); continue; }
    ax[i]=nx; ay[i]=ny; aa[i]=a;
    trail[idx]=Math.min(CAP,trail[idx]+DEP);
  }
  stepCount++;
  if(stepCount%4===0) diffuse();
}
function bandOf(v){
  if(v>=1.32) return 3;
  if(v>=0.55) return 2;
  if(v>=0.30) return 1;
  return -1;
}
function drawTrails(){
  const cw=W/simW, ch=H/simH;
  for(let y=0;y<simH;y++){
    const r0=y*simW, yPx=y*ch;
    let runBand=-2, runStart=0;
    for(let x=0;x<=simW;x++){
      const b=x<simW?bandOf(trail[r0+x]):-2;
      if(b!==runBand){
        if(runBand===3){ ctx.fillStyle=DEEP; ctx.globalAlpha=1; ctx.fillRect(runStart*cw,yPx,(x-runStart)*cw+0.7,ch+0.7); }
        else if(runBand===2){ ctx.fillStyle=MID; ctx.globalAlpha=0.95; ctx.fillRect(runStart*cw,yPx,(x-runStart)*cw+0.7,ch+0.7); }
        else if(runBand===1){ ctx.fillStyle=MID; ctx.globalAlpha=0.55; ctx.fillRect(runStart*cw,yPx,(x-runStart)*cw+0.7,ch+0.7); }
        else if(runBand===0){ ctx.fillStyle=MID; ctx.globalAlpha=0.30; ctx.fillRect(runStart*cw,yPx,(x-runStart)*cw+0.7,ch+0.7); }
        runBand=b; runStart=x;
      }
    }
  }
  ctx.globalAlpha=1;
}
function drawDiscs(now){
  for(const d of discs){
    const al=clamp(1-0.75*((now-d.born)/240000),0.25,1);
    ctx.globalAlpha=al; ctx.fillStyle=DEEP;
    ctx.beginPath(); ctx.arc(d.fx*W, d.fy*H, d.fr*W, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawFrame(now){
  const wh=viewportWH(); prep(wh[0],wh[1]); W=wh[0]; H=wh[1];
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,W,H);
  drawTrails();
  drawDiscs(now);
  return {};
}
function frame(now){ agentStep(); agentStep(); return drawFrame(now); }

canvas.addEventListener('pointerdown',e=>{ hold={x:e.clientX,y:e.clientY,since:nowMs()}; });
canvas.addEventListener('pointermove',e=>{ if(hold){ hold.x=e.clientX; hold.y=e.clientY; } });
function endHold(){
  if(!hold) return;
  const r=Math.max(18,holdRadius());
  const d={ fx:clamp(hold.x/W,0,1), fy:clamp(hold.y/H,0,1), fr:(r/(W/simW))/simW, born:nowMs() };
  discs.push(d); stampMask(d);
  hold=null;
}
canvas.addEventListener('pointerup',endHold);
canvas.addEventListener('pointercancel',()=>{ hold=null; });

// Pre-warm: 400 agent steps before the first frame so the opening view and
// the thumbnail already show a formed reticulated network. No disc exists
// in the initial state; discs are the viewer's marks only.
initSim();
for(let s=0;s<400;s++) agentStep();
function loop(now){ frame(now); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(nowMs());
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(nowMs()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(nowMs()));
</script>
</body>
</html>
