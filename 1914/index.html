<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1914 Footfoot</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0b0c; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var FLOOR = '#0d0b0c';      // near-black floor, also the page ground
  var FLOOR_SOFT = '#171214';  // faint floor variation
  var RUG = '#8f1d2c';         // rug crimson
  var RUG_DARK = '#6e1420';    // rug border band, darker crimson
  var RUG_DEEP = '#57101a';    // rug inner shadow
  var GOLD = '#e8c878';        // frozen-loop halos, pale gold
  var GOLD_DIM = '#d9b36a';    // rug fringe, title, hint
  var GOLD_FAINT = '#b3925a';  // date line, muted gold
  var GREEN = '#3fd47a';       // Freeze pedal LED
  var RED_LED = '#e5484d';     // octave pedal LED
  var BOARD = '#1a1712';       // pedalboard, near-black
  var PEDAL = '#241d18';       // pedal bodies
  var PEDAL_EDGE = '#3a2f28';  // pedal rims
  var SKIN = '#c89b7a';        // bare feet
  var SKIN_DARK = '#a87a5c';   // foot shading
  var SKIN_LINE = '#8a6248';   // foot outline, toenails
  var SHADOW = '#3a0f16';      // octave shadow rings

  // Fixed-phase first frame: t = 21.6 s. The left foot is mid-press on the
  // Freeze pedal, a fresh halo only 0.6 s old, and three older rings are
  // already stacked on the rug (aged 6.6, 12.6 and 18.6 s), each pulsing at
  // its own tempo. The right foot is drifting back to the frame edge after
  // its octave press. Every foot, pedal and halo is a pure function of t,
  // so frame one is byte-reproducible.
  var FIRST_T = 21.6;

  // Choreography cycle, 24 s. Freeze events at 3, 9, 15, 21 s; octave
  // events at 6 and 18 s; Whammy at 12 s.
  var CYCLE = 24;
  var FREEZE_EVENTS = [3, 9, 15, 21];
  var OCTAVE_EVENTS = [6, 18];
  var WHAMMY_PRESS = [11, 12.6];

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function smooth(t) { return t * t * (3 - 2 * t); }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Rug geometry: the rug is a square in rug units, u = rug side / 100.
  // On phones the rug goes full-bleed (fills the width); on desktop it is
  // a centered square with a margin of dark floor around it.
  function rugGeom() {
    var side, rx, ry;
    if (isPhone) {
      side = W;
      rx = 0; ry = (H - side) / 2;
    } else {
      side = Math.min(W, H) * 0.80;
      rx = (W - side) / 2; ry = (H - side) / 2 + 12;
    }
    return { x: rx, y: ry, s: side, u: side / 100, cx: rx + side / 2, cy: ry + side / 2 };
  }

  // Pedal centres in rug units (origin rug centre, y down).
  var PEDALS = {
    whammy: { x: -26, y: 31, w: 15, h: 17 },
    freeze: { x: 0, y: 31, w: 12, h: 12 },
    octave: { x: 26, y: 31, w: 12, h: 12 }
  };

  // ---- choreography ----
  // Each foot follows keyframes {t, x, y, rot} in rug units, interpolated
  // with smoothstep; press windows are separate so a foot can hesitate
  // (hover with a tremble) before a press.
  var LEFT_KEYS = [
    { t: 0, x: -58, y: 16, rot: -0.55 },
    { t: 2.5, x: -34, y: 22, rot: -0.30 },
    { t: 10, x: -30, y: 23, rot: -0.10 },
    { t: 11, x: -28, y: 25, rot: 0 },
    { t: 12.6, x: -28, y: 25, rot: 0 },
    { t: 16, x: -12, y: 22, rot: 0.10 },
    { t: 20, x: -3, y: 21, rot: 0.05 },
    { t: 21, x: -2, y: 25, rot: 0 },
    { t: 22.4, x: -2, y: 25, rot: 0 },
    { t: 23.5, x: -34, y: 18, rot: -0.35 },
    { t: 24, x: -58, y: 16, rot: -0.55 }
  ];
  var LEFT_PRESS = [[11, 12.6], [21, 22.4]];
  var RIGHT_KEYS = [
    { t: 0, x: 58, y: 14, rot: 0.55 },
    { t: 2.2, x: 10, y: 22, rot: 0.15 },
    { t: 3, x: 6, y: 25, rot: 0 },
    { t: 4.2, x: 6, y: 25, rot: 0 },
    { t: 5.2, x: 24, y: 22, rot: 0.10 },
    { t: 6, x: 26, y: 25, rot: 0 },
    { t: 7, x: 26, y: 25, rot: 0 },
    { t: 8.2, x: 8, y: 22, rot: 0.10 },
    { t: 9, x: 6, y: 25, rot: 0 },
    { t: 10.2, x: 6, y: 25, rot: 0 },
    { t: 12, x: 40, y: 18, rot: 0.35 },
    { t: 14.2, x: 8, y: 22, rot: 0.10 },
    { t: 15, x: 6, y: 25, rot: 0 },
    { t: 16.2, x: 6, y: 25, rot: 0 },
    { t: 17.2, x: 24, y: 22, rot: 0.10 },
    { t: 18, x: 26, y: 25, rot: 0 },
    { t: 19, x: 26, y: 25, rot: 0 },
    { t: 20.5, x: 42, y: 18, rot: 0.35 },
    { t: 24, x: 58, y: 14, rot: 0.55 }
  ];
  var RIGHT_PRESS = [[3, 4.2], [6, 7], [9, 10.2], [15, 16.2], [18, 19]];

  function footAt(keys, pressWins, t) {
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    var i = 0;
    while (i < keys.length - 2 && keys[i + 1].t <= ph) { i++; }
    var a = keys[i], b = keys[i + 1];
    var f = clamp((ph - a.t) / (b.t - a.t), 0, 1);
    f = smooth(f);
    var x = lerp(a.x, b.x, f), y = lerp(a.y, b.y, f), rot = lerp(a.rot, b.rot, f);
    // Hover bob while the foot is in the air.
    var press = 0;
    for (var p = 0; p < pressWins.length; p++) {
      var s0 = pressWins[p][0], s1 = pressWins[p][1];
      var pin = smooth(clamp((ph - s0) / 0.3, 0, 1));
      var pout = 1 - smooth(clamp((ph - s1) / 0.3, 0, 1));
      press = Math.max(press, pin * pout);
    }
    if (press < 0.5) {
      y += 0.7 * Math.sin(ph * Math.PI * 2 * 0.8 + (keys === LEFT_KEYS ? 1.3 : 4.1));
    }
    // Hesitation: a tremble in the half second before a press starts.
    for (var q = 0; q < pressWins.length; q++) {
      var ds = pressWins[q][0] - ph;
      if (ds > 0 && ds < 0.6) {
        var env = Math.sin((0.6 - ds) / 0.6 * Math.PI);
        x += 0.5 * env * Math.sin(ph * 25);
        y += 0.3 * env * Math.sin(ph * 31);
      }
    }
    return { x: x, y: y, rot: rot, press: press };
  }

  // LED brightness: full while pressed, decaying for 2 s after release.
  function ledAt(pressWins, t) {
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    var v = 0;
    for (var p = 0; p < pressWins.length; p++) {
      var s0 = pressWins[p][0], s1 = pressWins[p][1];
      if (ph >= s0 && ph <= s1) { return 1; }
      if (ph > s1) { v = Math.max(v, Math.exp(-(ph - s1) / 0.8)); }
    }
    return v;
  }

  function whammyTilt(t) {
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    var s0 = WHAMMY_PRESS[0], s1 = WHAMMY_PRESS[1];
    var pin = smooth(clamp((ph - s0) / 0.3, 0, 1));
    var pout = 1 - smooth(clamp((ph - s1) / 0.3, 0, 1));
    return pin * pout;
  }

  // ---- drawing helpers ----
  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  function ring(x, y, r, lw, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  }

  function drawRug(g) {
    // Crimson field with a darker border band and a pale gold rule.
    ctx.fillStyle = RUG;
    ctx.fillRect(g.x, g.y, g.s, g.s);
    ctx.fillStyle = RUG_DARK;
    ctx.fillRect(g.x, g.y, g.s, 4.5 * g.u);
    ctx.fillRect(g.x, g.y + g.s - 4.5 * g.u, g.s, 4.5 * g.u);
    ctx.fillRect(g.x, g.y, 4.5 * g.u, g.s);
    ctx.fillRect(g.x + g.s - 4.5 * g.u, g.y, 4.5 * g.u, g.s);
    ctx.strokeStyle = hexA(GOLD_DIM, 0.8);
    ctx.lineWidth = Math.max(1, 0.35 * g.u);
    ctx.strokeRect(g.x + 6.5 * g.u, g.y + 6.5 * g.u, g.s - 13 * g.u, g.s - 13 * g.u);
    ctx.strokeStyle = hexA(GOLD_DIM, 0.45);
    ctx.strokeRect(g.x + 9 * g.u, g.y + 9 * g.u, g.s - 18 * g.u, g.s - 18 * g.u);
    // Weave: a faint dot grid across the field.
    ctx.fillStyle = hexA(RUG_DEEP, 0.35);
    for (var iy = 12; iy <= 88; iy += 6) {
      for (var ix = 12; ix <= 88; ix += 6) {
        dot(g.x + ix * g.u, g.y + iy * g.u, 0.28 * g.u, hexA(RUG_DEEP, 0.35));
      }
    }
    // Fringe along the top and bottom edges.
    ctx.strokeStyle = hexA(GOLD_DIM, 0.75);
    ctx.lineWidth = Math.max(1, 0.3 * g.u);
    for (var fx = 2; fx <= 98; fx += 3) {
      ctx.beginPath(); ctx.moveTo(g.x + fx * g.u, g.y); ctx.lineTo(g.x + fx * g.u, g.y - 2.2 * g.u); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(g.x + fx * g.u, g.y + g.s); ctx.lineTo(g.x + fx * g.u, g.y + g.s + 2.2 * g.u); ctx.stroke();
    }
    // A faint centre medallion, a diamond the rings will stack over.
    ctx.save();
    ctx.translate(g.cx, g.cy - 8 * g.u);
    ctx.rotate(Math.PI / 4);
    ctx.strokeStyle = hexA(GOLD_DIM, 0.35);
    ctx.lineWidth = Math.max(1, 0.3 * g.u);
    ctx.strokeRect(-7 * g.u, -7 * g.u, 14 * g.u, 14 * g.u);
    ctx.restore();
  }

  function drawPedalboard(g, t) {
    var u = g.u;
    var bx = g.cx - 40 * u, by = g.cy + 21 * u, bw = 80 * u, bh = 19 * u;
    ctx.fillStyle = BOARD;
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = PEDAL_EDGE;
    ctx.lineWidth = Math.max(1, 0.3 * u);
    ctx.strokeRect(bx, by, bw, bh);

    // Whammy: a long treadle whose angle tips when the foot presses.
    var w = PEDALS.whammy;
    var wx = g.cx + w.x * u, wy = g.cy + w.y * u;
    var tilt = whammyTilt(t);
    ctx.fillStyle = PEDAL;
    ctx.fillRect(wx - w.w / 2 * u, wy - w.h / 2 * u, w.w * u, w.h * u);
    ctx.strokeStyle = PEDAL_EDGE;
    ctx.strokeRect(wx - w.w / 2 * u, wy - w.h / 2 * u, w.w * u, w.h * u);
    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(-0.10 + tilt * 0.22);
    ctx.fillStyle = hexA('#4a3a30', 1);
    ctx.fillRect(-5.5 * u, -6.5 * u, 11 * u, 13 * u);
    ctx.strokeStyle = hexA(GOLD_DIM, 0.5);
    ctx.lineWidth = Math.max(1, 0.25 * u);
    for (var k = -2; k <= 2; k++) {
      ctx.beginPath(); ctx.moveTo(-4.5 * u, k * 2.4 * u); ctx.lineTo(4.5 * u, k * 2.4 * u); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = hexA(GOLD_DIM, 0.9);
    ctx.font = '600 ' + Math.max(6, 1.6 * u) + 'px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('WHAMMY', wx, wy + w.h / 2 * u - 1.2 * u);

    // Freeze: small box, green LED glowing after each press.
    var f = PEDALS.freeze;
    var fx = g.cx + f.x * u, fy = g.cy + f.y * u;
    ctx.fillStyle = PEDAL;
    ctx.fillRect(fx - f.w / 2 * u, fy - f.h / 2 * u, f.w * u, f.h * u);
    ctx.strokeStyle = PEDAL_EDGE;
    ctx.strokeRect(fx - f.w / 2 * u, fy - f.h / 2 * u, f.w * u, f.h * u);
    var fl = ledAt([[3, 4.2], [9, 10.2], [15, 16.2], [21, 22.4]], t);
    if (fl > 0.02) {
      dot(fx, fy - f.h / 2 * u + 2.2 * u, 2.6 * u * (0.6 + 0.4 * fl), hexA(GREEN, a4(0.25 * fl)));
      dot(fx, fy - f.h / 2 * u + 2.2 * u, 1.1 * u, hexA(GREEN, a4(0.35 + 0.65 * fl)));
    } else {
      dot(fx, fy - f.h / 2 * u + 2.2 * u, 1.1 * u, hexA(GREEN, 0.25));
    }
    ctx.fillStyle = hexA(GOLD_DIM, 0.9);
    ctx.fillText('FREEZE', fx, fy + f.h / 2 * u - 1.2 * u);

    // Octave: small box, red LED.
    var o = PEDALS.octave;
    var ox = g.cx + o.x * u, oy = g.cy + o.y * u;
    ctx.fillStyle = PEDAL;
    ctx.fillRect(ox - o.w / 2 * u, oy - o.h / 2 * u, o.w * u, o.h * u);
    ctx.strokeStyle = PEDAL_EDGE;
    ctx.strokeRect(ox - o.w / 2 * u, oy - o.h / 2 * u, o.w * u, o.h * u);
    var ol = ledAt([[6, 7], [18, 19]], t);
    if (ol > 0.02) {
      dot(ox, oy - o.h / 2 * u + 2.2 * u, 2.6 * u * (0.6 + 0.4 * ol), hexA(RED_LED, a4(0.25 * ol)));
      dot(ox, oy - o.h / 2 * u + 2.2 * u, 1.1 * u, hexA(RED_LED, a4(0.35 + 0.65 * ol)));
    } else {
      dot(ox, oy - o.h / 2 * u + 2.2 * u, 1.1 * u, hexA(RED_LED, 0.25));
    }
    ctx.fillStyle = hexA(GOLD_DIM, 0.9);
    ctx.fillText('OCTAVE', ox, oy + o.h / 2 * u - 1.2 * u);
    ctx.textAlign = 'left';
  }

  // Frozen loops: one pale gold ring per Freeze event, stacked on the rug
  // centre. Each ring keeps its own pulse tempo and phase and decays
  // slowly; the rings are deliberately not synced to a master clock.
  function drawHalos(g, t) {
    var u = g.u;
    ctx.save();
    ctx.beginPath();
    ctx.rect(g.x, g.y, g.s, g.s);
    ctx.clip();
    for (var cyc = 0; cyc < 3; cyc++) {
      var cycStart = (Math.floor(t / CYCLE) - cyc) * CYCLE;
      for (var k = 0; k < FREEZE_EVENTS.length; k++) {
        var e = cycStart + FREEZE_EVENTS[k];
        var age = t - e;
        if (age < 0 || age > 30) { continue; }
        var freq = 0.45 + 0.11 * k;
        var phase = hash(k * 7 + 3) * Math.PI * 2;
        var pulse = Math.sin(age * Math.PI * 2 * freq + phase);
        var r = (10 + 3.5 * k) * u * (1 + 0.03 * pulse);
        var a = 0.6 * Math.exp(-age / 10) * (0.75 + 0.25 * pulse);
        if (a <= 0.02) { continue; }
        ring(g.cx, g.cy - 8 * u, r, Math.max(1, (0.55 + age * 0.02) * u), hexA(GOLD, a4(a)));
        ring(g.cx, g.cy - 8 * u, r, Math.max(1, 0.2 * u), hexA(GOLD, a4(a * 0.5)));
      }
    }
    // Octave shadow rings: darker, at half the freeze frequency, one per
    // octave event, sitting just outside the freshest freeze ring.
    for (var cyc2 = 0; cyc2 < 3; cyc2++) {
      var cycStart2 = (Math.floor(t / CYCLE) - cyc2) * CYCLE;
      for (var k2 = 0; k2 < OCTAVE_EVENTS.length; k2++) {
        var e2 = cycStart2 + OCTAVE_EVENTS[k2];
        var age2 = t - e2;
        if (age2 < 0 || age2 > 30) { continue; }
        var freq2 = (0.45 + 0.11 * 3) / 2;
        var phase2 = hash(k2 * 13 + 5) * Math.PI * 2;
        var pulse2 = Math.sin(age2 * Math.PI * 2 * freq2 + phase2);
        var r2 = 24 * u * (1 + 0.025 * pulse2);
        var a2 = 0.4 * Math.exp(-age2 / 12) * (0.8 + 0.2 * pulse2);
        if (a2 <= 0.02) { continue; }
        ring(g.cx, g.cy - 8 * u, r2, Math.max(1, 0.9 * u), hexA(SHADOW, a4(a2)));
        ring(g.cx, g.cy - 8 * u, r2, Math.max(1, 0.2 * u), hexA(GOLD, a4(a2 * 0.4)));
      }
    }
    ctx.restore();
  }

  // A bare foot from directly above: heel at the top, five toes at the
  // bottom, toenails in pale gold. Press squashes the foot slightly flat.
  function drawFoot(g, f, u) {
    var x = g.cx + f.x * u, y = g.cy + f.y * u;
    var s = u;
    var len = 17 * s, wid = 7.5 * s;
    var squash = 1 - 0.10 * f.press;
    // Soft shadow on the rug, tighter when the foot is pressed flat.
    ctx.fillStyle = hexA('#000000', a4(0.30 - 0.10 * f.press));
    ctx.beginPath();
    ctx.moveTo(x + wid * 0.9 + 1.5 * s, y + len * 0.5 * squash + 1.5 * s);
    ctx.ellipse(x + 1.5 * s, y + len * 0.1 * squash + 1.5 * s, wid * 0.85, len * 0.5 * squash, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(f.rot);
    ctx.scale(1, squash);
    // Sole: heel dome, waist, ball, then five toe bumps along the front.
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(0, -len / 2);
    ctx.bezierCurveTo(wid * 0.62, -len * 0.42, wid * 0.55, -len * 0.10, wid * 0.62, len * 0.18);
    ctx.bezierCurveTo(wid * 0.68, len * 0.34, wid * 0.55, len * 0.42, wid * 0.42, len * 0.46);
    ctx.lineTo(-wid * 0.42, len * 0.46);
    ctx.bezierCurveTo(-wid * 0.55, len * 0.42, -wid * 0.68, len * 0.34, -wid * 0.62, len * 0.18);
    ctx.bezierCurveTo(-wid * 0.55, -len * 0.10, -wid * 0.62, -len * 0.42, 0, -len / 2);
    ctx.closePath(); ctx.fill();
    // Toes: five small bumps along the front edge, big toe on the inside.
    var toeR = [1.35, 1.10, 1.00, 0.90, 0.80];
    var toeX = [-wid * 0.46, -wid * 0.23, 0, wid * 0.23, wid * 0.46];
    for (var i = 0; i < 5; i++) {
      var tx = toeX[i] * 0.92, ty = len * 0.46 + toeR[i] * s * 0.35;
      ctx.fillStyle = SKIN;
      ctx.beginPath(); ctx.moveTo(tx + toeR[i] * s, ty);
      ctx.arc(tx, ty, toeR[i] * s, 0, Math.PI * 2); ctx.fill();
      // Toenail: a small pale arc on each toe.
      ctx.fillStyle = hexA(GOLD_DIM, 0.85);
      ctx.beginPath(); ctx.moveTo(tx + toeR[i] * s * 0.55, ty + toeR[i] * s * 0.15);
      ctx.arc(tx, ty + toeR[i] * s * 0.15, toeR[i] * s * 0.55, 0, Math.PI * 2); ctx.fill();
    }
    // The arch line, a soft curve across the middle of the sole.
    ctx.strokeStyle = hexA(SKIN_LINE, 0.5);
    ctx.lineWidth = Math.max(0.8, 0.25 * s);
    ctx.beginPath();
    ctx.moveTo(-wid * 0.30, -len * 0.05);
    ctx.quadraticCurveTo(0, len * 0.05, wid * 0.28, -len * 0.02);
    ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Near-black floor ground.
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, 0, W, H);
    // A faint floor sheen, two soft dark panels.
    ctx.fillStyle = FLOOR_SOFT;
    ctx.fillRect(0, 0, W, H * 0.5);

    var g = rugGeom();
    var u = g.u;

    drawRug(g);
    drawPedalboard(g, t);
    drawHalos(g, t);

    var left = footAt(LEFT_KEYS, LEFT_PRESS, t);
    var right = footAt(RIGHT_KEYS, RIGHT_PRESS, t);
    drawFoot(g, left, u);
    drawFoot(g, right, u);

    // Title plate, top-left, in pale gold on the dark floor.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = GOLD;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Footfoot', 18, 34);
    ctx.fillStyle = GOLD_FAINT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1914 · 2007 · 04 · 09', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(GOLD_DIM, 0.9);
    ctx.textAlign = 'center';
    ctx.fillText('Watch the feet work the pedals while frozen loops stack on the rug.', W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs near 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
