<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9024 · Personal Weather - Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #101418;
    color: #e9e4d6;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 4vmin 20px 6vmin;
    overflow: hidden;
  }
  header { text-align: center; margin-bottom: 3vmin; max-width: 640px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8a93a0; margin-bottom: 12px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #e8a04c; }
  header p { color: #8a93a0; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #d6d0bd; font-weight: normal; }
  #stage {
    background: #f3efe3;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: crosshair;
    touch-action: none;
    position: relative;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 3vmin; color: #5d6672; font-size: 13px; font-style: italic; }
  footer a { color: #e8a04c; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9024</span> · Personal Weather</h1>
  <p>A field of wind barbs, each with a heading of its own. Your pointer paints
  weather into the air: fast flicks burn amber, slow drifts stay blue.
  <b>Move your pointer to stir it.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
const SEED = parseInt(params.get("seed") || "902403", 10);
const DEMO = params.get("demo") === "1";
const rand = mulberry32(SEED);

// Seeded value noise for coherent headings
const perm = new Uint8Array(512);
{
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
}
function fade(t){ return t * t * (3 - 2 * t); }
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const h = (X, Y) => perm[(perm[X & 255] + Y) & 255] / 255;
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
  const u = fade(xf), v = fade(yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// Wind field bus: a low-res float field the pointer paints into.
// Trail points carry direction and speed-as-pressure; each frame they are
// re-stamped with an envelope (ease up over the first 30% of life, ease
// down over the rest), so gusts bloom and decay with no per-segment state.
const FW = 64, FH = 64;
const fwx = new Float32Array(FW * FH);
const fwy = new Float32Array(FW * FH);
const trail = [];
const TRAIL_LIFE = 1500; // ms, trails bloom then decay
const TRAIL_MAX = 240;

function easeOutSine(t){ return Math.sin(t * Math.PI / 2); }

function paintTrail(now){
  fwx.fill(0); fwy.fill(0);
  for (let i = trail.length - 1; i >= 0; i--){
    const p = trail[i];
    const age = (now - p.t0) / TRAIL_LIFE;
    if (age >= 1){ trail.splice(i, 1); continue; }
    // Envelope: ease up over the first 30% of life, ease down over the rest
    const e = age < 0.3 ? easeOutSine(age / 0.3) : easeOutSine((1 - age) / 0.7);
    const inten = Math.min(1, p.force) * e;
    if (inten < 0.015) continue;
    const r = 2.2 + 6.5 * inten; // disc radius in field cells
    const cx = p.u * (FW - 1), cy = p.v * (FH - 1);
    const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(FW - 1, Math.ceil(cx + r));
    const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(FH - 1, Math.ceil(cy + r));
    for (let yy = y0; yy <= y1; yy++){
      for (let xx = x0; xx <= x1; xx++){
        const d = Math.hypot(xx - cx, yy - cy) / r;
        if (d >= 1) continue;
        const fall = 0.5 + 0.5 * Math.cos(d * Math.PI);
        const k = inten * fall;
        const idx = yy * FW + xx;
        fwx[idx] += p.dx * k;
        fwy[idx] += p.dy * k;
      }
    }
  }
}

function sampleField(u, v){
  const x = Math.min(Math.max(u, 0), 1) * (FW - 1);
  const y = Math.min(Math.max(v, 0), 1) * (FH - 1);
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const x1 = Math.min(FW - 1, x0 + 1), y1 = Math.min(FH - 1, y0 + 1);
  const tx = x - x0, ty = y - y0;
  const i00 = y0 * FW + x0, i10 = y0 * FW + x1;
  const i01 = y1 * FW + x0, i11 = y1 * FW + x1;
  const ax = fwx[i00] + (fwx[i10] - fwx[i00]) * tx;
  const bx = fwx[i01] + (fwx[i11] - fwx[i01]) * tx;
  const ay = fwy[i00] + (fwy[i10] - fwy[i00]) * tx;
  const by = fwy[i01] + (fwy[i11] - fwy[i01]) * tx;
  return [ax + (bx - ax) * ty, ay + (by - ay) * ty];
}

// Calm ambient drift so the field is alive before any touch
function ambient(u, v, t){
  const s1 = Math.sin(u * 5.1 + t * 0.35 + vnoise(3.1, 7.7) * 6.28);
  const s2 = Math.sin(v * 4.3 - t * 0.27 + u * 2.2);
  const s3 = Math.sin((u + v) * 3.7 + t * 0.21);
  return [0.055 * (0.6 * s1 + 0.4 * s3), 0.055 * (0.6 * s2 - 0.4 * s3)];
}

// Segments: short strokes, each with a fixed personal heading
const stage = document.getElementById("stage");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let segs = [];
let W = 0, H = 0, DPR = 1;

const COOL = [62, 112, 148];   // calm steel blue
const WARM = [232, 142, 46];   // gust amber
const BUCKETS = 18;
const bucketColors = [];
for (let i = 0; i < BUCKETS; i++){
  const t = i / (BUCKETS - 1);
  const e = t * t * (3 - 2 * t); // smooth the ramp
  bucketColors.push("rgb(" +
    Math.round(COOL[0] + (WARM[0] - COOL[0]) * e) + "," +
    Math.round(COOL[1] + (WARM[1] - COOL[1]) * e) + "," +
    Math.round(COOL[2] + (WARM[2] - COOL[2]) * e) + ")");
}

function buildField(){
  segs = [];
  const spacing = 17;
  const cols = Math.max(8, Math.floor(W / spacing));
  const rows = Math.max(8, Math.floor(H / spacing));
  const ox = (W - (cols - 1) * spacing) / 2;
  const oy = (H - (rows - 1) * spacing) / 2;
  for (let r = 0; r < rows; r++){
    for (let c = 0; c < cols; c++){
      const x = ox + c * spacing + (rand() - 0.5) * spacing * 0.7;
      const y = oy + r * spacing + (rand() - 0.5) * spacing * 0.7;
      const coh = vnoise(c * 0.14, r * 0.14); // local heading coherence
      const heading = coh * Math.PI * 3 + (rand() - 0.5) * 1.1;
      segs.push({
        x, y, heading,
        len: 9 + rand() * 9,
        alpha: 0.62 + rand() * 0.30
      });
    }
  }
}

function angDiff(a, b){
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

let lastFrame = 0;
function frame(now){
  const t = now / 1000;
  paintTrail(now);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // paper
  ctx.fillStyle = "#f3efe3";
  ctx.fillRect(0, 0, W, H);

  // bucket the segments by intensity so each bucket strokes in one pass
  const buckets = [];
  for (let i = 0; i < BUCKETS; i++) buckets.push([]);
  const hot = [];
  for (let s = 0; s < segs.length; s++){
    const sg = segs[s];
    const u = sg.x / W, v = sg.y / H;
    const pw = sampleField(u, v);
    const aw = ambient(u, v, t);
    const wx = pw[0] + aw[0], wy = pw[1] + aw[1];
    let inten = Math.sqrt(wx * wx + wy * wy);
    if (inten > 1) inten = 1;
    const windAng = Math.atan2(wy, wx);
    // tilt toward the wind, but never past ~52 degrees off the personal heading
    const tilt = Math.max(-0.9, Math.min(0.9, angDiff(windAng, sg.heading))) *
                 Math.min(1, inten * 1.25);
    const ang = sg.heading + tilt;
    // stretch along the personal heading, slide along it too
    const len = sg.len * (1 + inten * 1.7);
    const slide = inten * 11;
    const cx = sg.x + Math.cos(sg.heading) * slide;
    const cy = sg.y + Math.sin(sg.heading) * slide;
    const dx = Math.cos(ang) * len / 2, dy = Math.sin(ang) * len / 2;
    const item = [cx - dx, cy - dy, cx + dx, cy + dy, sg.alpha];
    buckets[Math.round(inten * (BUCKETS - 1))].push(item);
    if (inten > 0.55) hot.push([cx - dx * 0.45, cy - dy * 0.45,
                                cx + dx * 0.45, cy + dy * 0.45, inten]);
  }
  ctx.lineCap = "round";
  for (let i = 0; i < BUCKETS; i++){
    const b = buckets[i];
    if (!b.length) continue;
    ctx.strokeStyle = bucketColors[i];
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    for (let k = 0; k < b.length; k++){
      const it = b[k];
      ctx.globalAlpha = it[4];
      ctx.moveTo(it[0], it[1]);
      ctx.lineTo(it[2], it[3]);
    }
    ctx.stroke();
  }
  // bright cores on the strongest gusts
  if (hot.length){
    ctx.strokeStyle = "rgb(255,196,96)";
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let k = 0; k < hot.length; k++){
      const it = hot[k];
      ctx.globalAlpha = Math.min(1, (it[4] - 0.55) * 2.2) * 0.85;
      ctx.moveTo(it[0], it[1]);
      ctx.lineTo(it[2], it[3]);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // soft vignette + ink frame
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35,
                                      W/2, H/2, Math.max(W,H)*0.72);
  vg.addColorStop(0, "rgba(70,52,30,0)");
  vg.addColorStop(1, "rgba(70,52,30,0.16)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(40,36,28,0.55)";
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);

  lastFrame = now;
  requestAnimationFrame(frame);
}

// Pointer paints wind: speed becomes pressure (force = min(dist^2 * k, 1))
let lastU = -1, lastV = -1;
function stageUV(e){
  const r = stage.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
}
function onMove(e){
  const now = performance.now();
  const uv = stageUV(e);
  const u = Math.min(Math.max(uv[0], 0), 1);
  const v = Math.min(Math.max(uv[1], 0), 1);
  if (lastU >= 0){
    const dx = u - lastU, dy = v - lastV;
    const dd = dx * dx + dy * dy;
    if (dd > 1e-9){
      const len = Math.sqrt(dd);
      trail.push({ u, v, dx: dx / len, dy: dy / len,
                   force: Math.min(dd * 14000, 1), t0: now });
      if (trail.length > TRAIL_MAX) trail.shift();
    }
    // a resting pointer paints nothing: force is zero when dd is zero
  }
  lastU = u; lastV = v;
}
function onLeave(){ lastU = -1; lastV = -1; }
window.addEventListener("pointermove", onMove, { passive: true });
window.addEventListener("pointerdown", onMove, { passive: true });
stage.addEventListener("pointerleave", onLeave);

function resize(){
  const headerH = document.querySelector("header").offsetHeight;
  const footerH = document.querySelector("footer").offsetHeight;
  const availH = window.innerHeight - headerH - footerH - 90;
  const stageW = Math.max(280, Math.min(window.innerWidth * 0.94, 1040, availH * 1.5));
  const stageH = stageW / 1.5;
  stage.style.width = stageW + "px";
  stage.style.height = stageH + "px";
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = stageW; H = stageH;
  canvas.width = Math.round(stageW * DPR);
  canvas.height = Math.round(stageH * DPR);
  buildField();
}
let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 150);
});

// Demo mode: scripted gusts for screenshots (?demo=1)
function demoGusts(){
  const sweeps = [
    { x0: 0.08, y0: 0.72, x1: 0.55, y1: 0.30, bend: -0.25, delay: 200 },
    { x0: 0.85, y0: 0.25, x1: 0.35, y1: 0.62, bend: 0.30, delay: 700 },
    { x0: 0.20, y0: 0.15, x1: 0.80, y1: 0.80, bend: 0.18, delay: 1200 }
  ];
  for (const s of sweeps){
    const steps = 26;
    for (let i = 0; i <= steps; i++){
      const k = i / steps;
      const u = s.x0 + (s.x1 - s.x0) * k;
      const v = s.y0 + (s.y1 - s.y0) * k + Math.sin(k * Math.PI) * s.bend;
      setTimeout(() => {
        const now = performance.now();
        const du = (s.x1 - s.x0) / steps, dv = (s.y1 - s.y0) / steps;
        const len = Math.hypot(du, dv) || 1;
        trail.push({ u, v, dx: du / len, dy: dv / len,
                     force: 0.95, t0: now });
        if (trail.length > TRAIL_MAX) trail.shift();
      }, s.delay + i * 28);
    }
  }
}

resize();
if (DEMO) demoGusts();
requestAnimationFrame(frame);
</script>
</body>
</html>
