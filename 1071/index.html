<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Chair</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #04050A;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');

  var LOOP = 55;
  var START_T = 18;
  var TRACK = 660;
  var VOID = '#04050A';
  var LIGHT = '#BFD4FF';
  var FOG = '#0A0D16';
  var CHAIR = '#0E0F12';
  var GLOW = '#FFD75E';

  var W = 0;
  var H = 0;
  var DPR = 1;
  var isPhone = false;
  var seed = 10710813;
  var structures = [];

  var startStamp = 0;
  if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') {
    startStamp = performance.now();
  }

  var phaseOffset = 0;
  var jump = null;
  var pointer = { down: false, x: 0, y: 0, startX: 0, startY: 0, startElapsed: 0, moved: false };
  var activeLean = 0;
  var leanRelease = null;
  var pendingTap = null;
  var audio = null;

  function clamp(v, a, b) {
    return v < a ? a : (v > b ? b : v);
  }

  function mod(v, n) {
    return ((v % n) + n) % n;
  }

  function smooth(q) {
    q = clamp(q, 0, 1);
    return q * q * q * (q * (q * 6 - 15) + 10);
  }

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeStructures() {
    var rand = mulberry32(seed);
    var i;
    var count = 32;
    structures = [];
    for (i = 0; i < count; i++) {
      var side = (i % 2 === 0) ? -1 : 1;
      if (rand() < 0.22) side = -side;
      structures.push({
        z: ((i + 0.18 + rand() * 0.62) / count) * TRACK,
        offset: side * (54 + rand() * 82),
        height: 58 + rand() * 118,
        width: 13 + rand() * 22,
        type: Math.floor(rand() * 4),
        phase: rand() * Math.PI * 2
      });
    }
  }

  function pathX(z) {
    return 15 * Math.sin(z * 0.0105) + 9 * Math.sin(z * 0.021 + 1.7);
  }

  function pathY(z) {
    return 3.2 * Math.sin(z * 0.016 + 0.4) + 1.4 * Math.sin(z * 0.033 + 2.1);
  }

  function pathSecondX(z) {
    return -15 * 0.0105 * 0.0105 * Math.sin(z * 0.0105) -
           9 * 0.021 * 0.021 * Math.sin(z * 0.021 + 1.7);
  }

  function elapsedNow() {
    if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') {
      return Math.max(0, (performance.now() - startStamp) / 1000);
    }
    return 0;
  }

  function phaseAt(elapsed) {
    var p;
    var q;
    if (jump) {
      q = (elapsed - jump.start) / 0.8;
      if (q >= 1) {
        p = jump.from + jump.delta;
        phaseOffset = p - ((START_T + elapsed) / LOOP);
        jump = null;
        return mod(p, 1);
      }
      return mod(jump.from + jump.delta * smooth(q), 1);
    }
    return mod((START_T + elapsed) / LOOP + phaseOffset, 1);
  }

  function leanAt(elapsed) {
    var age;
    if (pointer.down) return activeLean;
    if (!leanRelease) return 0;
    age = elapsed - leanRelease.start;
    if (age < 0 || age > 2.4) return 0;
    return leanRelease.value * Math.exp(-2.0 * age) *
      (1 + 0.16 * Math.sin(age * 8.5) * Math.exp(-1.6 * age));
  }

  function bankAt(t, elapsed) {
    var z = (t / LOOP) * TRACK;
    var pathBank = clamp(-pathSecondX(z) * 34, -0.12, 0.12);
    var rigSway = 0.014 * Math.sin(elapsed * 0.43 + 1.1);
    return clamp(pathBank + rigSway + leanAt(elapsed), -0.34, 0.34);
  }

  function resize() {
    var vv = window.visualViewport;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    var sw = (window.screen && window.screen.width) ? window.screen.width : w;
    var sh = (window.screen && window.screen.height) ? window.screen.height : h;
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    isPhone = Math.min(sw, sh) < 700 || (Math.min(sw, sh) >= 700 && H > W * 1.15);
  }

  function project(cam, worldZ, offset) {
    var rel = mod(worldZ - cam.z, TRACK);
    var scale = cam.focal / Math.max(11, rel);
    if (scale > 16) scale = 16;
    var wx = pathX(worldZ) + offset;
    var wy = pathY(worldZ) - cam.y;
    return {
      rel: rel,
      scale: scale,
      x: cam.cx + (wx - cam.x) * scale,
      y: cam.horizon + (13 + wy) * scale
    };
  }

  function drawGuide(cam, offset, alpha) {
    var r;
    var p;
    ctx.beginPath();
    for (r = 8; r <= 650; r += 14) {
      p = project(cam, cam.z + r, offset);
      if (r === 8) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = LIGHT;
    ctx.lineWidth = offset === 0 ? 1.2 : 1;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawStructure(cam, s) {
    var p = project(cam, s.z, s.offset);
    var depth = 1 - p.rel / TRACK;
    var alpha = clamp(0.16 + depth * 0.78, 0.16, 0.92);
    var w = Math.max(1.2, s.width * p.scale);
    var h = s.height * p.scale;
    var x = p.x;
    var base = p.y;
    var top = base - h;
    var i;
    var y;

    if (p.rel < 7 || x < -W * 0.55 || x > W * 1.55) return;

    ctx.strokeStyle = LIGHT;
    ctx.fillStyle = LIGHT;
    ctx.lineWidth = Math.max(1, p.scale * 1.15);

    if (s.type === 2) {
      var c = project(cam, s.z, 0);
      var left = project(cam, s.z, -58);
      var right = project(cam, s.z, 58);
      var archTop = c.y - (126 + (s.height - 58) * 0.35) * c.scale;
      ctx.globalAlpha = alpha * 0.82;
      ctx.beginPath();
      ctx.moveTo(left.x, left.y);
      ctx.lineTo(left.x, archTop);
      ctx.lineTo(right.x, archTop);
      ctx.lineTo(right.x, right.y);
      ctx.stroke();
      ctx.globalAlpha = alpha * 0.38;
      ctx.beginPath();
      ctx.moveTo(left.x, archTop + h * 0.16);
      ctx.lineTo(right.x, archTop + h * 0.16);
      ctx.stroke();
    } else if (s.type === 0) {
      ctx.globalAlpha = alpha * 0.30;
      ctx.fillRect(x - w / 2, top, w, h);
      ctx.globalAlpha = alpha * 0.92;
      ctx.strokeRect(x - w / 2, top, w, h);
      ctx.globalAlpha = alpha * 0.55;
      ctx.beginPath();
      for (i = 1; i <= 3; i++) {
        y = top + (h * i / 4);
        ctx.moveTo(x - w / 2, y);
        ctx.lineTo(x + w / 2, y);
      }
      ctx.stroke();
    } else if (s.type === 1) {
      var leg = Math.max(2, w * 0.16);
      ctx.globalAlpha = alpha * 0.88;
      ctx.beginPath();
      ctx.moveTo(x - w / 2, base);
      ctx.lineTo(x - w * 0.18, top);
      ctx.lineTo(x + w * 0.18, top);
      ctx.lineTo(x + w / 2, base);
      ctx.moveTo(x - w * 0.34, base - h * 0.36);
      ctx.lineTo(x + w * 0.34, base - h * 0.36);
      ctx.moveTo(x - w * 0.27, base - h * 0.68);
      ctx.lineTo(x + w * 0.27, base - h * 0.68);
      ctx.stroke();
      ctx.globalAlpha = alpha * 0.28;
      ctx.fillRect(x - leg / 2, top, leg, h);
    } else {
      var slabH = Math.max(2, h * 0.15);
      for (i = 0; i < 4; i++) {
        y = base - slabH - i * h * 0.22;
        ctx.globalAlpha = alpha * (0.32 + i * 0.13);
        ctx.fillRect(x - w * (0.72 - i * 0.08), y - slabH, w * (1.44 - i * 0.16), slabH);
        ctx.globalAlpha = alpha * 0.66;
        ctx.strokeRect(x - w * (0.72 - i * 0.08), y - slabH, w * (1.44 - i * 0.16), slabH);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFogBands(cam, t) {
    var i;
    var y;
    var drift = Math.sin(t * 0.11) * W * 0.018;
    ctx.fillStyle = FOG;
    for (i = 0; i < 4; i++) {
      y = cam.horizon - H * (0.30 - i * 0.075) + Math.sin(t * 0.07 + i * 1.7) * H * 0.006;
      ctx.globalAlpha = 0.16 + i * 0.045;
      ctx.fillRect(-W * 0.25 + drift * (i + 1) * 0.24, y, W * 1.5, H * (0.028 + i * 0.006));
    }
    ctx.globalAlpha = 1;
  }

  function drawChair(elapsed, bank) {
    var unit = Math.min(W, H);
    var cw = unit * (isPhone ? 0.52 : 0.38);
    var ch = unit * (isPhone ? 0.36 : 0.315);
    var cx = W / 2 + leanAt(elapsed) * W * 0.012;
    var baseY = H - unit * 0.012;

    ctx.save();
    ctx.translate(cx, baseY);
    ctx.rotate(bank);

    ctx.globalAlpha = 0.10;
    ctx.fillStyle = LIGHT;
    ctx.beginPath();
    ctx.moveTo(-cw * 0.34, -ch * 1.015);
    ctx.lineTo(cw * 0.34, -ch * 1.015);
    ctx.lineTo(cw * 0.42, -ch * 0.40);
    ctx.lineTo(-cw * 0.42, -ch * 0.40);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.fillStyle = CHAIR;
    ctx.beginPath();
    ctx.moveTo(-cw * 0.31, -ch);
    ctx.lineTo(cw * 0.31, -ch);
    ctx.lineTo(cw * 0.39, -ch * 0.40);
    ctx.lineTo(-cw * 0.39, -ch * 0.40);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = 0.15;
    ctx.fillStyle = GLOW;
    ctx.beginPath();
    ctx.moveTo(-cw * 0.46, -ch * 0.40);
    ctx.lineTo(cw * 0.46, -ch * 0.40);
    ctx.lineTo(cw * 0.40, -ch * 0.27);
    ctx.lineTo(-cw * 0.40, -ch * 0.27);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = 0.40;
    ctx.fillStyle = GLOW;
    ctx.beginPath();
    ctx.moveTo(-cw * 0.39, -ch * 0.385);
    ctx.lineTo(cw * 0.39, -ch * 0.385);
    ctx.lineTo(cw * 0.35, -ch * 0.295);
    ctx.lineTo(-cw * 0.35, -ch * 0.295);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.fillStyle = CHAIR;
    ctx.beginPath();
    ctx.moveTo(-cw * 0.50, -ch * 0.31);
    ctx.lineTo(-cw * 0.36, -ch * 0.31);
    ctx.lineTo(-cw * 0.30, ch * 0.035);
    ctx.lineTo(-cw * 0.47, ch * 0.035);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cw * 0.50, -ch * 0.31);
    ctx.lineTo(cw * 0.36, -ch * 0.31);
    ctx.lineTo(cw * 0.30, ch * 0.035);
    ctx.lineTo(cw * 0.47, ch * 0.035);
    ctx.closePath();
    ctx.fill();

    ctx.fillRect(-cw * 0.50, -ch * 0.035, cw, ch * 0.04);
    ctx.fillRect(-cw * 0.54, 0, cw * 0.16, ch * 0.035);
    ctx.fillRect(cw * 0.38, 0, cw * 0.16, ch * 0.035);

    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = LIGHT;
    ctx.lineWidth = Math.max(1, unit * 0.0022);
    ctx.beginPath();
    ctx.moveTo(-cw * 0.31, -ch);
    ctx.lineTo(cw * 0.31, -ch);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function initAudio() {
    var AC;
    var noise;
    var buffer;
    var source;
    var filter;
    var noiseGain;
    var osc;
    var oscGain;
    var master;
    var panner = null;
    var i;
    if (audio) {
      if (audio.ctx && typeof audio.ctx.resume === 'function') audio.ctx.resume();
      return;
    }
    AC = window.AudioContext || window.webkitAudioContext;
    if (typeof AC !== 'function') return;
    try {
      audio = { ctx: new AC() };
      buffer = audio.ctx.createBuffer(1, audio.ctx.sampleRate, audio.ctx.sampleRate);
      noise = buffer.getChannelData(0);
      var noiseRand = mulberry32(seed ^ 0x51ab);
      for (i = 0; i < noise.length; i++) noise[i] = noiseRand() * 2 - 1;
      source = audio.ctx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;
      filter = audio.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 420;
      noiseGain = audio.ctx.createGain();
      noiseGain.gain.value = 0.028;
      osc = audio.ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = 48;
      oscGain = audio.ctx.createGain();
      oscGain.gain.value = 0.006;
      master = audio.ctx.createGain();
      master.gain.value = 0.8;
      if (typeof audio.ctx.createStereoPanner === 'function') {
        panner = audio.ctx.createStereoPanner();
        source.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(panner);
        osc.connect(oscGain);
        oscGain.connect(panner);
        panner.connect(master);
      } else {
        source.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(master);
        osc.connect(oscGain);
        oscGain.connect(master);
      }
      master.connect(audio.ctx.destination);
      source.start();
      osc.start();
      audio.filter = filter;
      audio.osc = osc;
      audio.panner = panner;
    } catch (err) {
      audio = null;
    }
  }

  function updateAudio(bank, speedFactor) {
    if (!audio || !audio.ctx) return;
    try {
      audio.filter.frequency.value = 340 + speedFactor * 150;
      audio.osc.frequency.value = 42 + speedFactor * 18;
      if (audio.panner) audio.panner.pan.value = clamp(-bank * 2.6, -0.65, 0.65);
    } catch (err) {
      audio = null;
    }
  }

  function drawAt(elapsed) {
    var phase = phaseAt(elapsed);
    var t = phase * LOOP;
    var z = phase * TRACK;
    var cam = {
      z: z,
      x: pathX(z),
      y: pathY(z),
      cx: W / 2,
      horizon: H * 0.665 + pathY(z) * H * 0.004,
      focal: Math.min(W, H) * (isPhone ? 0.86 : 0.94)
    };
    var bank = bankAt(t, elapsed);
    var mapped = [];
    var i;
    var speedFactor;

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = VOID;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(bank * 0.18);
    ctx.translate(-W / 2, -H / 2);

    ctx.fillStyle = VOID;
    ctx.fillRect(-W * 0.25, -H * 0.25, W * 1.5, H * 1.5);
    ctx.globalAlpha = 0.60;
    ctx.fillStyle = FOG;
    ctx.fillRect(-W * 0.25, cam.horizon, W * 1.5, H * 0.55);
    ctx.globalAlpha = 1;

    drawGuide(cam, -64, 0.045);
    drawGuide(cam, -28, 0.065);
    drawGuide(cam, 0, 0.085);
    drawGuide(cam, 28, 0.065);
    drawGuide(cam, 64, 0.045);

    for (i = 0; i < structures.length; i++) {
      mapped.push({ s: structures[i], rel: mod(structures[i].z - z, TRACK) });
    }
    mapped.sort(function (a, b) { return b.rel - a.rel; });
    for (i = 0; i < mapped.length; i++) drawStructure(cam, mapped[i].s);

    drawFogBands(cam, t);

    ctx.globalAlpha = 0.20;
    ctx.fillStyle = FOG;
    ctx.fillRect(-W * 0.25, cam.horizon + H * 0.17, W * 1.5, H * 0.06);
    ctx.globalAlpha = 1;
    ctx.restore();

    drawChair(elapsed, bank);

    speedFactor = jump ? 2.2 : 1;
    updateAudio(bank, speedFactor);
  }

  function eventPoint(e) {
    var rect = { left: 0, top: 0 };
    if (typeof canvas.getBoundingClientRect === 'function') rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX || 0) - rect.left,
      y: (e.clientY || 0) - rect.top
    };
  }

  function jumpToNextWaypoint() {
    var elapsed = elapsedNow();
    var p = phaseAt(elapsed);
    var target = (Math.floor(p * 8 + 0.00001) + 1) / 8;
    var delta = mod(target - p, 1);
    if (delta < 0.025) {
      target += 1 / 8;
      delta = mod(target - p, 1);
    }
    jump = { start: elapsed, from: p, delta: delta };
  }

  function registerTap() {
    var elapsed = elapsedNow();
    if (pendingTap && elapsed - pendingTap.elapsed < 0.36) {
      if (pendingTap.timer) clearTimeout(pendingTap.timer);
      pendingTap = null;
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      makeStructures();
      return;
    }
    pendingTap = { elapsed: elapsed, timer: null };
    if (typeof setTimeout === 'function') {
      pendingTap.timer = setTimeout(function () {
        pendingTap = null;
        jumpToNextWaypoint();
      }, 335);
    } else {
      pendingTap = null;
      jumpToNextWaypoint();
    }
  }

  function onPointerDown(e) {
    var p = eventPoint(e);
    initAudio();
    pointer.down = true;
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.startX = p.x;
    pointer.startY = p.y;
    pointer.startElapsed = elapsedNow();
    pointer.moved = false;
    activeLean = 0;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.preventDefault) e.preventDefault();
  }

  function onPointerMove(e) {
    var p;
    if (!pointer.down) return;
    p = eventPoint(e);
    pointer.x = p.x;
    pointer.y = p.y;
    if (Math.abs(p.x - pointer.startX) > 9 || Math.abs(p.y - pointer.startY) > 9) pointer.moved = true;
    activeLean = clamp((p.x - pointer.startX) / Math.max(1, W) * 0.55, -0.24, 0.24);
    if (e.preventDefault) e.preventDefault();
  }

  function onPointerUp(e) {
    var elapsed;
    if (!pointer.down) return;
    elapsed = elapsedNow();
    pointer.down = false;
    if (!pointer.moved && elapsed - pointer.startElapsed < 0.35) {
      activeLean = 0;
      registerTap();
    } else if (Math.abs(activeLean) > 0.005) {
      leanRelease = { start: elapsed, value: activeLean };
      activeLean = 0;
    } else {
      activeLean = 0;
    }
    if (e.preventDefault) e.preventDefault();
  }

  function onPointerCancel() {
    pointer.down = false;
    activeLean = 0;
  }

  if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', resize);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerCancel);
  }

  makeStructures();
  resize();
  if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') {
    startStamp = performance.now();
  }
  drawAt(0);

  var raf = null;
  if (typeof window.requestAnimationFrame === 'function') raf = window.requestAnimationFrame;
  else if (typeof requestAnimationFrame === 'function') raf = requestAnimationFrame;

  function loop() {
    drawAt(elapsedNow());
    if (raf) raf(loop);
  }
  if (raf) raf(loop);
})();
</script>
</body>
</html>
