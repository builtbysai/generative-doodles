<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8470;8933 &middot; Spiral Zap</title>
<style>
  :root{ --ink:#262019; --paper:#f1e9d8; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--paper)}
  body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);
       -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
  #plate{position:absolute;top:14px;left:18px;pointer-events:none;user-select:none;
    font-size:13px;letter-spacing:.14em;color:rgba(38,32,25,.55);text-transform:uppercase}
  #plate b{color:var(--ink);font-weight:700}
  #rule{position:absolute;top:36px;left:18px;pointer-events:none;user-select:none;
    font-size:11px;letter-spacing:.08em;color:rgba(38,32,25,.42)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="plate"><b>&#8470;8933</b> &middot; Spiral Zap</div>
  <div id="rule">one quiet triadic palette &middot; spiral zap from 0 to 1 in ten steps &middot; click for a fresh palette</div>
</div>
<script>
"use strict";
/* №8933 "Spiral Zap" (seed 273): a color-theory parameter sweep as
   composition. One quiet seeded 6-color triadic palette in OKLCH, drawn as
   the same nested-disc stack in ten panels. Panel i applies the zap
   (spiral) palette modifier at intensity m = i/9: position along the
   palette becomes an angle (tightness 0.2 + |m|), sqrt-scaled radius,
   hue shift = cos(angle) * radius * 150 * m, lightness and chroma take the
   sine component. Geometry never changes; only the palette is zapped.
   Click re-rolls the base triadic palette. Study-informed (pro-color-
   harmonies), implementation derived, not copied. */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromURL(){
  const m = /[?&]seed=(\d+)/.exec(location.search);
  return m ? (parseInt(m[1],10) >>> 0) : 273;
}
let SEED = seedFromURL();

/* ---------- OKLCH plumbing (own implementation) ---------- */
function oklchLinear(L, C, hDeg){
  const h = hDeg * Math.PI / 180;
  const a = C * Math.cos(h), b = C * Math.sin(h);
  let l = L + 0.3963377774*a + 0.2158037573*b;
  let m = L - 0.1055613458*a - 0.0638541728*b;
  let s = L - 0.0894841775*a - 1.2914855480*b;
  l = l*l*l; m = m*m*m; s = s*s*s;
  return [
    +4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
    -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
    -0.0041960863*l - 0.7034186147*m + 1.7076147010*s
  ];
}
function oklchCss(c){
  let C = c.C;
  for (let k = 0; k < 16; k++){
    const rgb = oklchLinear(c.L, C, c.h);
    const ok = rgb.every(v => v >= -0.002 && v <= 1.002);
    if (ok || C < 0.004){
      const g = v => {
        v = Math.min(1, Math.max(0, v));
        v = v <= 0.0031308 ? 12.92*v : 1.055*Math.pow(v, 1/2.4) - 0.055;
        return Math.round(v * 255);
      };
      return 'rgb(' + g(rgb[0]) + ',' + g(rgb[1]) + ',' + g(rgb[2]) + ')';
    }
    C *= 0.9;  // gamut clamp: reduce chroma, keep lightness and hue
  }
  return 'rgb(128,128,128)';
}
const wrapHue = h => ((h % 360) + 360) % 360;

/* ---------- the quiet triadic base ---------- */
function buildBase(rng){
  const baseHue = rng() * 360;
  const bend = (rng() - 0.5) * 8;                 // slight seeded arm wobble
  const anchors = [baseHue, baseHue + 120 + bend, baseHue + 240 - bend];
  const narrative = [0.7, 1.0, 0.85, 1.0, 0.75, 0.6];  // chroma rhythm
  const Ls = [0.65, 0.60, 0.55, 0.49, 0.46, 0.43];     // index 5 is the broad outer disc
  const baseC = 0.10;                                   // quiet
  const cols = [];
  for (let i = 0; i < 6; i++){
    let h = wrapHue(anchors[i % 3] + (rng() - 0.5) * 6);
    let L = Ls[i] + (rng() - 0.5) * 0.03;
    let C = baseC * narrative[i] * (0.92 + rng() * 0.16);
    if (i >= 3) C *= 0.9;                        // deeper row, a touch calmer
    // named mud zones: muted colors there sit down as neutrals
    const mud = (h >= 25 && h <= 65) || (h >= 100 && h <= 140) || (h >= 180 && h <= 200);
    if (mud && C < 0.15) C *= 0.5;
    cols.push({ L: L, C: C, h: h });
  }
  return cols;
}

/* ---------- the zap (spiral) modifier ---------- */
function zap(pal, m){
  const n = pal.length, tight = 0.2 + Math.abs(m);
  return pal.map((c, i) => {
    const x = i / (n - 1);
    const ang = x * tight * Math.PI * 2;
    const rad = Math.sqrt(x);
    const hs = Math.cos(ang) * rad * 150 * m;     // hue shift, degrees
    const s = Math.sin(ang) * rad * m;            // sine component
    return {
      L: Math.min(0.92, Math.max(0.08, c.L + s * 0.13)),
      C: Math.max(0.004, c.C * (1 + s * 0.85)),
      h: wrapHue(c.h + hs)
    };
  });
}

/* ---------- drawing ---------- */
const RADII = [1, 0.815, 0.64, 0.475, 0.32, 0.175];
let base = null;

function roll(){
  base = buildBase(mulberry32(SEED));
}

function drawStack(cx, cy, R, cols, gap){
  // palette index 5 is the broad outer disc, index 0 the calm core:
  // the zap grows with palette position, so the big discs take the hit
  for (let j = 0; j < 6; j++){
    ctx.fillStyle = oklchCss(cols[5 - j]);
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(1, R * RADII[j] - gap), 0, Math.PI * 2);
    ctx.fill();
  }
}

function draw(){
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // paper, faintly tinted by the base hue
  const ground = oklchCss({ L: 0.935, C: 0.014, h: wrapHue(base[0].h + 10) });
  ctx.fillStyle = ground;
  ctx.fillRect(0, 0, W, H);

  // soft paper grain, stable per seed
  const grng = mulberry32(SEED ^ 0x9e3779b9);
  ctx.fillStyle = 'rgba(38,32,25,0.05)';
  for (let i = 0; i < 700; i++) ctx.fillRect(grng() * W, grng() * H, 1.1, 1.1);

  const cols = W < 720 ? 2 : 10;        // narrow screens: 2x5 stack
  const rows = W < 720 ? 5 : 1;
  const top = 72, bottom = 14, padX = Math.min(28, W * 0.045);
  const availW = W - padX * 2, availH = H - top - bottom;
  const cellW = availW / cols;
  let cellH = Math.min(availH / rows, cellW * 1.45);
  const gridW = cellW * cols, gridH = cellH * rows;
  const ox = (W - gridW) / 2, oy = top + (availH - gridH) / 2;
  const R = Math.min(cellW, cellH) * 0.40;
  const gap = Math.max(0.6, R * 0.022);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let i = 0; i < 10; i++){
    const m = i / 9;
    const col = i % cols, row = (i / cols) | 0;
    const cx = ox + (col + 0.5) * cellW;
    const cy = oy + (row + 0.5) * cellH - cellH * 0.07;
    const colsNow = zap(base, m);

    // panel hairline
    ctx.strokeStyle = 'rgba(38,32,25,0.16)';
    ctx.lineWidth = 1;
    ctx.strokeRect(ox + col * cellW + 5.5, oy + row * cellH + 5.5, cellW - 11, cellH - 11);

    drawStack(cx, cy, R, colsNow, gap);

    // intensity track: the only axis label, intensity not the tip
    const bw = Math.min(cellW * 0.52, 74);
    const by = cy + R + cellH * 0.085;
    ctx.fillStyle = 'rgba(38,32,25,0.18)';
    ctx.fillRect(cx - bw / 2, by, bw, 3);
    ctx.fillStyle = 'rgba(38,32,25,0.78)';
    ctx.fillRect(cx - bw / 2, by, Math.max(2.5, bw * m), 3);
    ctx.font = '10px "Avenir Next","Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(38,32,25,0.45)';
    ctx.fillText(m === 0 ? '0' : m === 1 ? '1' : m.toFixed(2).slice(1), cx, by + 7);
  }
}

window.addEventListener('resize', draw);
canvas.addEventListener('pointerdown', () => {
  SEED = (Math.random() * 1e9) | 0;
  roll();
  draw();
});

roll();
draw();
</script>
</body>
</html>
