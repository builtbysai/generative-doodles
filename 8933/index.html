<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spiral Zap — No.8933</title>
<!-- phantom-fill-8933 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#0d0f0e; }
  canvas { display:block; width:100vw; height:100dvh; }
  .label {
    position:fixed; left:0; right:0; bottom:0; padding:14px 18px 16px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:#e8e4da; pointer-events:none; user-select:none;
  }
  .label .t { font-size:11px; letter-spacing:.28em; text-transform:uppercase; opacity:.85; }
  .label .n { font-size:11px; letter-spacing:.18em; opacity:.45; }
  .tip {
    position:fixed; top:0; bottom:0; width:1px; background:rgba(232,228,218,.35);
    pointer-events:none;
  }
  .tip span {
    position:absolute; top:16px; left:6px; white-space:nowrap;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(232,228,218,.6);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tip" id="tip"><span>tipping point</span></div>
<div class="label"><span class="t">Spiral Zap</span><span class="n">No. 8933 &middot; one palette, ten turns</span></div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const tipEl = document.getElementById('tip');
  let W, H, dpr;

  // Triadic palette: deep teal, rust, ochre — one palette, spiralled ten times.
  const PAL = ['#2e7f7a', '#c2512c', '#d9a62e'];
  const TURNS = 10;
  const TIP = 0.58; // fraction across the frame where calm becomes feral

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tipEl.style.left = (TIP * W) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // Deterministic pseudo-random for stable feral texture.
  function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

  // Disturbance: 0 on the far left, smooth rise, then a sharp step at the tip.
  function disturbance(x) {
    const f = x / W;
    const ramp = Math.pow(Math.max(0, f - 0.12) / 0.88, 1.6) * 0.35;
    const step = f >= TIP ? 0.65 + 0.35 * Math.min(1, (f - TIP) / 0.25) : 0;
    return Math.min(1, ramp + step);
  }

  function draw(t) {
    ctx.fillStyle = '#0d0f0e';
    ctx.fillRect(0, 0, W, H);

    const cx = W * 0.5, cy = H * 0.5;
    const maxR = Math.min(W, H) * 0.46;
    const total = Math.PI * 2 * TURNS;
    const steps = 2600;

    // Slow breathing rotation: the spiral turns a fraction of a degree.
    const rot = Math.sin(t * 0.00006) * 0.06;

    ctx.lineCap = 'round';
    let prev = null;
    for (let i = 0; i <= steps; i++) {
      const a = (i / steps) * total + rot;
      const r = maxR * (i / steps);
      const baseX = cx + Math.cos(a) * r;
      const baseY = cy + Math.sin(a) * r;
      const d = disturbance(baseX);
      // Calm: smooth point. Feral: jitter + radial spikes, amplitude grows with d.
      const jx = d > 0 ? (hash(i * 3 + 1) - 0.5) * d * 26 : 0;
      const jy = d > 0 ? (hash(i * 5 + 2) - 0.5) * d * 26 : 0;
      const spike = d > 0.5 ? (hash(i * 7 + 3) - 0.5) * (d - 0.5) * 46 : 0;
      const x = baseX + jx + Math.cos(a) * spike;
      const y = baseY + jy + Math.sin(a) * spike;

      if (prev) {
        // Colour cycles through the triad once per turn: palette spiralled 10x.
        const turn = Math.floor(a / (Math.PI * 2)) % 3;
        ctx.strokeStyle = PAL[turn];
        ctx.globalAlpha = 0.35 + 0.65 * (i / steps);
        // Stroke thins as it ferals: calm ribbon, feral hairline sparks.
        ctx.lineWidth = 7.5 - d * 5.5;
        ctx.beginPath();
        ctx.moveTo(prev[0], prev[1]);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
      prev = [x, y];
    }
    ctx.globalAlpha = 1;

    // The tipping point, drawn on the canvas too: a faint vertical hairline.
    ctx.strokeStyle = 'rgba(232,228,218,0.28)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(TIP * W, 0);
    ctx.lineTo(TIP * W, H);
    ctx.stroke();
  }

  let last = 0;
  function frame(ts) {
    if (ts - last > 33) { draw(ts); last = ts; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
