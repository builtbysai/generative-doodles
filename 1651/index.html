<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Phase Experience, Episode 1</title>
<style>
html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#050505';
var PLATE = '#0d0d0d';
var INK = '#e8e4d8';
var GOLD = '#ffd678';
var RUST = '#c85a1e';
var WHITE = '#ffffff';
var PRISM = ['#ff2ea6', '#19c8e8', '#ffd400', '#39d353'];
/* A local order parameter decays on its own and the pointer injects
   entropy that the field absorbs and relaxes away. Frame one is at
   t = 6 s: the field is developed, part crystal, part rust. */
var PHASE = 6;
var COLS = 28, ROWS = 20;
var SEED = 1651001;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var GOLD_RGB = hexRgb(GOLD);
var RUST_RGB = hexRgb(RUST);
var WHITE_RGB = hexRgb(WHITE);
var PRISM_RGB = [];
(function () { var i; for (i = 0; i < PRISM.length; i++) PRISM_RGB.push(hexRgb(PRISM[i])); })();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* ---- point agents: one local order parameter each ----
   Seeded from a fixed hash (the mint-hash-derived equilibrium).
   eq in [0.35, 0.80]; frame-one order is a developed mix of eq. */
var agents = [];
(function buildAgents() {
  var rng = mulberry32(SEED), i, j, a;
  for (j = 0; j < ROWS; j++) {
    for (i = 0; i < COLS; i++) {
      a = {
        u: (i + 0.5) / COLS, v: (j + 0.5) / ROWS,
        ju: (rng() - 0.5) * 0.55 / COLS, jv: (rng() - 0.5) * 0.55 / ROWS,
        eq: 0.35 + rng() * 0.45,
        col: Math.floor(rng() * PRISM.length),
        ph: rng() * TAU, drift: 0.10 + rng() * 0.22,
        ang: rng() * TAU, spin: (rng() - 0.5) * 0.5
      };
      a.o = clamp(a.eq * (0.55 + rng() * 0.45), 0.05, 0.95);
      agents.push(a);
    }
  }
})();
function agentCount() { return agents.length; }
function orderMean() {
  var s = 0, i; for (i = 0; i < agents.length; i++) s += agents[i].o;
  return s / agents.length;
}
function spacing() {
  return Math.min(VW / COLS, VH / ROWS);
}
/* Agent position: lattice site plus a displacement that grows as
   order falls; chaotic agents drift on slow orbits around the site. */
function agentPos(a, t) {
  var s = spacing();
  var dis = (1 - a.o) * s * 0.55 * (0.85 + 0.15 * Math.sin(t * 0.3 + a.ph));
  var ang = a.ang + a.spin * t * (1 - a.o) + a.drift * t * 0.15;
  return {
    x: (a.u + a.ju) * VW + dis * Math.cos(ang),
    y: (a.v + a.jv) * VH + dis * Math.sin(ang)
  };
}
/* ---- entropy operators ----
   Drag right/down injects positive entropy (order falls, rust wins);
   drag left/up injects negative entropy (order crystallizes).
   The field absorbs the burst and relaxes back on slow timescales;
   a long press settles it toward its fixed-hash equilibrium. */
var pointer = { down: false, x: 0, y: 0, lastX: 0, lastY: 0, moved: 0, downAt: 0 };
var settling = false;
var SETTLE_MS = 700;
function injectAt(px, py, sign, strength) {
  var s = spacing(), R = s * 3.4, i, a, p, dx, dy, d2, fall;
  for (i = 0; i < agents.length; i++) {
    a = agents[i];
    p = agentPos(a, clockT);
    dx = p.x - px; dy = p.y - py;
    d2 = dx * dx + dy * dy;
    if (d2 > R * R * 2.25) continue;
    fall = Math.exp(-d2 / (2 * R * R));
    a.o = clamp(a.o + sign * strength * fall, 0.02, 0.98);
  }
}
function update(dt, t) {
  var i, a, relax = settling ? 0.25 : 0.010, decay = 0.020, floor = 0.06;
  for (i = 0; i < agents.length; i++) {
    a = agents[i];
    /* Decay toward chaos, plus slow relaxation toward equilibrium. */
    a.o += (floor - a.o) * decay * dt;
    a.o += (a.eq - a.o) * relax * dt;
    a.o = clamp(a.o, 0.02, 0.98);
  }
}
function onPointerDown(e) {
  var p = pointerPos(e);
  pointer.down = true; pointer.x = p.x; pointer.y = p.y;
  pointer.lastX = p.x; pointer.lastY = p.y; pointer.moved = 0;
  pointer.downAt = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  settling = false;
  if (e && e.preventDefault) e.preventDefault();
}
function onPointerMove(e) {
  if (!pointer.down) return;
  var p = pointerPos(e), dx = p.x - pointer.lastX, dy = p.y - pointer.lastY;
  var mag = Math.sqrt(dx * dx + dy * dy);
  pointer.moved += mag;
  if (mag > 0.5) {
    var sign = (Math.abs(dx) >= Math.abs(dy) ? dx : dy) >= 0 ? -1 : 1;
    injectAt(p.x, p.y, sign, clamp(mag / 14, 0.05, 0.6));
    settling = false;
  }
  pointer.lastX = p.x; pointer.lastY = p.y;
  if (e && e.preventDefault) e.preventDefault();
}
function onPointerUp(e) {
  pointer.down = false; settling = false;
}
function pointerPos(e) {
  var r = { left: 0, top: 0 };
  if (canvas.getBoundingClientRect) { try { r = canvas.getBoundingClientRect(); } catch (err) { r = { left: 0, top: 0 }; } }
  return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('pointerleave', onPointerUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function drawDisc(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function drawVoxel(cx, cy, half) {
  ctx.beginPath();
  ctx.moveTo(cx - half, cy - half);
  ctx.lineTo(cx + half, cy - half);
  ctx.lineTo(cx + half, cy + half);
  ctx.lineTo(cx - half, cy + half);
  ctx.closePath();
}
/* Dotted white orbital ring around a chaotic core. */
function drawOrbital(cx, cy, r, o, t, ph) {
  var n = 6, k, ang, dx, dy;
  for (k = 0; k < n; k++) {
    ang = ph + t * 0.25 * (1 - o) + (k / n) * TAU;
    dx = cx + r * Math.cos(ang); dy = cy + r * Math.sin(ang);
    ctx.fillStyle = rgba(WHITE_RGB, 0.55 * (1 - o) + 0.15);
    drawDisc(dx, dy, Math.max(0.8, r * 0.10));
    ctx.fill();
  }
}
function drawField(t) {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var s = spacing(), i, j, a, p, q, idx, o, half, glow;
  /* Crystal bonds between ordered neighbors. */
  ctx.lineWidth = 1;
  for (j = 0; j < ROWS; j++) {
    for (i = 0; i < COLS; i++) {
      idx = j * COLS + i;
      a = agents[idx];
      if (a.o < 0.55) continue;
      if (i + 1 < COLS) {
        q = agents[idx + 1];
        if (q.o >= 0.55) {
          p = agentPos(a, t);
          var p2 = agentPos(q, t);
          ctx.strokeStyle = rgba(GOLD_RGB, (a.o * q.o - 0.30) * 0.45);
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
      if (j + 1 < ROWS) {
        q = agents[idx + COLS];
        if (q.o >= 0.55) {
          p = agentPos(a, t);
          var p3 = agentPos(q, t);
          ctx.strokeStyle = rgba(GOLD_RGB, (a.o * q.o - 0.30) * 0.45);
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p3.x, p3.y);
          ctx.stroke();
        }
      }
    }
  }
  /* Agents: prismatic voxels with white-gold glow when ordered,
     rust-orange cores with dotted white orbitals when chaotic. */
  for (i = 0; i < agents.length; i++) {
    a = agents[i];
    p = agentPos(a, t);
    o = a.o;
    if (o >= 0.45) {
      glow = smooth((o - 0.45) / 0.55);
      ctx.fillStyle = rgba(GOLD_RGB, 0.22 * glow);
      drawDisc(p.x, p.y, s * 0.30);
      ctx.fill();
      half = s * 0.13 * (0.75 + 0.25 * o);
      ctx.fillStyle = rgba(PRISM_RGB[a.col], 0.55 + 0.45 * o);
      drawVoxel(p.x, p.y, half);
      ctx.fill();
      ctx.fillStyle = rgba(WHITE_RGB, 0.5 * glow);
      drawDisc(p.x, p.y, s * 0.045);
      ctx.fill();
    } else {
      ctx.fillStyle = rgba(RUST_RGB, 0.55 + 0.30 * (1 - o));
      drawDisc(p.x, p.y, s * 0.085 * (1 + 0.35 * (1 - o)));
      ctx.fill();
      drawOrbital(p.x, p.y, s * 0.30 * (0.8 + 0.4 * (1 - o)), o, t, a.ph);
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  var title = 'The Phase Experience, Episode 1';
  var date = '2006 · 07 · 20';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText(title).width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText(date).width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(WHITE_RGB, 0.25);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText(title, plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(hexRgb(INK), 0.8);
  ctx.fillText(date, plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag through the structure to inject entropy.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(WHITE_RGB, 0.25);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(hexRgb(INK), 0.9);
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
var prevT = PHASE;
var clockT = PHASE;
function draw(t) {
  size();
  var dt = clamp(t - prevT, 0, 0.1);
  prevT = t;
  clockT = t;
  /* Long press: pointer held still settles the field toward equilibrium. */
  if (pointer.down && pointer.moved < 8 && pointer.downAt > 0 &&
      typeof performance !== 'undefined' && performance.now) {
    if (performance.now() - pointer.downAt > SETTLE_MS) settling = true;
  }
  update(dt, t);
  drawField(t);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    agentCount: agentCount,
    orderMean: orderMean,
    orderAt: function (i) { return agents[i] ? agents[i].o : -1; },
    injectAt: function (x, y, sign, strength) { injectAt(x, y, sign, strength || 0.5); },
    setSettle: function (s) { settling = !!s; },
    settling: function () { return settling; }
  };
}
/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */
size();
var prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
