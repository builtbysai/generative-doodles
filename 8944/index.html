<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Seventeen Microns · №8944</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0d1117; overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 70vw;
    font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(214, 221, 235, 0.62); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 system-ui, sans-serif;
    color: rgba(214, 221, 235, 0.38);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #ui {
    position: fixed; left: 14px; top: 96px; z-index: 5;
    display: flex; flex-direction: column; gap: 10px;
    font: 400 13px/1.5 system-ui, sans-serif; color: #d6ddeb;
  }
  #dia { width: 220px; accent-color: #9fc3e8; cursor: pointer; }
  .btn {
    font: 500 13px/1.4 system-ui, sans-serif; color: #c8a24a;
    background: transparent; border: 1px solid rgba(200,162,74,0.6);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; align-self: flex-start;
  }
  .btn.on { background: rgba(200,162,74,0.18); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui">
  <label>droplet diameter<br><input type="range" id="dia" min="0" max="1000" value="200"><br>
  <span id="diaval"></span></label>
  <button class="btn" id="reveal">show the number</button>
  <div id="readout"></div>
</div>
<div id="cap">A cloud is a negotiation between falling and rising. Drag the diameter. Find where the deal flips.</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   Seventeen Microns — №8944 (2026-07-07), seed 249
   From the cloud droplet arithmetic: Stokes settling velocity
   against a fixed ambient updraft of 1 cm/s. The slider sweeps
   diameter on a log scale from 5 to 100 µm. Below the crossover
   the droplets float and glow; above it they streak and rain.
   The number is earned first, then revealed: ~18 µm, computed
   live, not asserted.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 249;
const rnd = mulberry32(seed);
document.getElementById("seedtag").textContent = "seed " + seed;

/* physics: Stokes law, SI units */
const G = 9.81, RHO_W = 1000, RHO_A = 1.2, MU = 1.81e-5;
const UPDRAFT = 0.01; // 1 cm/s, m/s
function stokes(d) { // d in meters -> settling velocity m/s
  return G * d * d * (RHO_W - RHO_A) / (18 * MU);
}
const THRESH = Math.sqrt(UPDRAFT * 18 * MU / (G * (RHO_W - RHO_A))) * 1e6; // µm

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize); resize();

const slider = document.getElementById("dia");
const diaval = document.getElementById("diaval");
const readout = document.getElementById("readout");
let revealed = false;
document.getElementById("reveal").addEventListener("click", (e) => {
  revealed = !revealed;
  e.target.classList.toggle("on", revealed);
});
function diameterUm() { return 5 * Math.pow(20, slider.value / 1000); }

/* droplets */
const drops = [];
for (let i = 0; i < 46; i++) {
  drops.push({ x: rnd(), y: rnd(), ph: rnd() * Math.PI * 2, s: 0.7 + rnd() * 0.6 });
}

function drawFrame(now) {
  const t = now / 1000;
  const dUm = diameterUm();
  const d = dUm * 1e-6;
  const settle = stokes(d);            // m/s down
  const net = settle - UPDRAFT;        // m/s down positive
  const floats = net < 0;
  ctx.clearRect(0, 0, W, H);
  const pad = Math.min(W, H) * 0.06;
  const narrow = W <= 700;

  ctx.fillStyle = "rgba(214,221,235,0.92)";
  ctx.font = "600 " + Math.round(Math.min(W, H) * 0.032) + "px system-ui, sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("№8944 · Seventeen Microns", pad, pad * 1.7);

  // chamber: right side (desktop) or center band (mobile)
  const ch = narrow
    ? { x: pad, y: H * 0.42, w: W - pad * 2, h: H * 0.44 }
    : { x: W * 0.40, y: H * 0.14, w: W * 0.56, h: H * 0.72 };
  ctx.strokeStyle = "rgba(159,195,232,0.35)";
  ctx.lineWidth = 1;
  ctx.strokeRect(ch.x, ch.y, ch.w, ch.h);

  // updraft arrows
  ctx.strokeStyle = "rgba(159,195,232,0.22)";
  for (let ax = 0; ax < 6; ax++) {
    const x = ch.x + ch.w * (ax + 0.5) / 6;
    const yy = ch.y + ch.h - ((t * 40 + ax * 53) % (ch.h - 40)) - 20;
    ctx.beginPath();
    ctx.moveTo(x, yy); ctx.lineTo(x, yy - 16);
    ctx.moveTo(x - 5, yy - 11); ctx.lineTo(x, yy - 16); ctx.lineTo(x + 5, yy - 11);
    ctx.stroke();
  }
  ctx.fillStyle = "rgba(159,195,232,0.5)";
  ctx.font = "400 " + Math.round(Math.min(W, H) * 0.02) + "px system-ui, sans-serif";
  ctx.fillText("updraft 1.00 cm/s", ch.x + 8, ch.y + 20);

  // droplets: chamber maps to 12 cm of cloud
  const pxPerM = ch.h / 0.12;
  for (const p of drops) {
    p.y += net * pxPerM * (1 / 60) * p.s;
    p.x += Math.sin(t * 0.8 + p.ph) * 0.0006;
    if (p.y < 0) { p.y = 1; p.x = rnd(); }
    if (p.y > 1) { p.y = 0; p.x = rnd(); }
    const x = ch.x + p.x * ch.w;
    const y = ch.y + p.y * ch.h;
    const r = 1.5 + Math.log10(dUm / 5) * 2.2;
    if (floats) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 6);
      g.addColorStop(0, "rgba(240,200,120,0.85)");
      g.addColorStop(0.4, "rgba(240,200,120,0.25)");
      g.addColorStop(1, "rgba(240,200,120,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y + Math.sin(t * 1.3 + p.ph) * 3, r * 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(250,225,170,0.95)";
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    } else {
      const streak = Math.min(60, Math.abs(net) * pxPerM * 0.35);
      ctx.strokeStyle = "rgba(159,195,232,0.75)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, y - streak); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = "rgba(200,220,245,0.9)";
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // readouts
  diaval.textContent = dUm.toFixed(1) + " µm";
  const settleCm = (settle * 100), netCm = (net * 100);
  readout.innerHTML =
    "settling " + settleCm.toFixed(2) + " cm/s<br>" +
    "updraft 1.00 cm/s<br>" +
    "net " + (netCm >= 0 ? "+" : "") + netCm.toFixed(2) + " cm/s<br>" +
    "<b style='color:" + (floats ? "#e8b95f" : "#9fc3e8") + "'>" +
    (floats ? "floats" : "rains") + "</b>" +
    (revealed ? "<br>crossover ≈ " + THRESH.toFixed(1) + " µm" : "");

  // threshold marker on the slider track
  if (revealed) {
    const frac = Math.log(THRESH / 5) / Math.log(20);
    const r = slider.getBoundingClientRect();
    ctx.strokeStyle = "rgba(240,200,120,0.9)";
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(r.left + frac * r.width, r.top - 4);
    ctx.lineTo(r.left + frac * r.width, r.bottom + 4);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(240,200,120,0.9)";
    ctx.font = "400 11px system-ui, sans-serif";
    ctx.fillText(THRESH.toFixed(1) + " µm", r.left + frac * r.width - 24, r.bottom + 16);
  }
  requestAnimationFrame(drawFrame);
}
requestAnimationFrame(drawFrame);
</script>
</body>
</html>
