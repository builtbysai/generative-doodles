<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Deadpan</title>
<style>
  html, body { margin:0; padding:0; background:#4A5A34; height:100%; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // Palette (strict, four tones, no mixes)
  var COL_OLIVE = "#4A5A34";  // lighter olive field
  var COL_DARK  = "#2A331E";  // dark olive region
  var COL_CRACK = "#F2F2EE";  // crack white
  var COL_LINE  = "#C1121F";  // the flat line

  var LOOP = 30;              // seconds, seamless
  var LOOP_OFF = 4;           // frame one sits at loop t = 4 s (young crack)
  var SEED = 841002;          // crack tree seed

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1, minDim = 0;

  // Crack tree: segments {x1,y1,x2,y2,birth,dur,w} and arcs {cx,cy,r,a0,a1,birth,dur,w}
  var segs = [], arcs = [], impact = { x: 0, y: 0 };

  function isPhone() {
    try {
      if (window.screen) {
        var m = Math.min(window.screen.width || 0, window.screen.height || 0);
        if (m > 0) return m < 700;
      }
    } catch (e) {}
    return H > W * 1.15;
  }

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Build the whole crack tree from the fixed seed. Every segment carries a
  // birth time and a growth duration, so the reveal at any loop time is a
  // closed-form function of t. Nothing here reads a clock.
  function buildCrack() {
    var rnd = mulberry32(SEED);
    segs = []; arcs = [];
    impact = { x: W * 0.36, y: H * 0.40 };
    var frontSpeed = (0.62 * minDim) / 17;   // crack front: full reach by ~18 s
    function birthAt(dist, extra) { return 0.5 + dist / frontSpeed + (extra || 0); }

    // One wandering chain from (x, y) along angle ang, with a length budget.
    function chain(x, y, ang, budget, depth) {
      var cx = x, cy = y, a = ang, spent = 0;
      while (spent < budget) {
        var step = (0.045 + rnd() * 0.055) * minDim * (depth === 0 ? 1 : 0.8);
        if (spent + step > budget) step = budget - spent;
        var nx = cx + Math.cos(a) * step, ny = cy + Math.sin(a) * step;
        var d0 = Math.sqrt((cx - impact.x) * (cx - impact.x) + (cy - impact.y) * (cy - impact.y));
        segs.push({
          x1: cx, y1: cy, x2: nx, y2: ny,
          birth: birthAt(d0, depth * 0.35), dur: 0.55,
          w: Math.max(0.8, (2.3 - depth * 0.55)) * (minDim / 720)
        });
        // fork a child branch
        if (depth < 3 && rnd() < 0.34) {
          var side = rnd() < 0.5 ? -1 : 1;
          chain(nx, ny, a + side * (0.35 + rnd() * 0.4), budget * (0.32 + rnd() * 0.3), depth + 1);
        }
        a += (rnd() - 0.5) * 0.24;
        cx = nx; cy = ny; spent += step;
      }
    }

    var rays = 10;
    for (var i = 0; i < rays; i++) {
      var ang = (i / rays) * Math.PI * 2 + (rnd() - 0.5) * 0.5;
      var budget = (0.34 + rnd() * 0.30) * minDim;
      chain(impact.x, impact.y, ang, budget, 0);
    }

    // Partial concentric rings around the impact (the glass webbing)
    var ringR = [0.10, 0.185, 0.285];
    for (var r = 0; r < ringR.length; r++) {
      var rad = ringR[r] * minDim;
      var spans = 2 + Math.floor(rnd() * 2);
      for (var s = 0; s < spans; s++) {
        var a0 = rnd() * Math.PI * 2;
        arcs.push({
          cx: impact.x, cy: impact.y, r: rad,
          a0: a0, a1: a0 + 0.7 + rnd() * 1.1,
          birth: birthAt(rad, 0.3 + rnd() * 0.8), dur: 0.9,
          w: Math.max(0.7, 1.4 * (minDim / 720))
        });
      }
    }
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    minDim = Math.min(W, H);
    buildCrack();
  }

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  function draw(elapsed) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var lt = (elapsed + LOOP_OFF) % LOOP;

    // Ground: olive field, dark olive below the horizon split.
    ctx.globalAlpha = 1;
    ctx.fillStyle = COL_OLIVE;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = COL_DARK;
    ctx.fillRect(0, H * 0.64, W, H - H * 0.64);

    // Crack: closed-form reveal of the precomputed tree.
    var fade = lt < 26 ? 1 : (LOOP - lt) / 4;
    if (fade > 0) {
      ctx.strokeStyle = COL_CRACK;
      ctx.lineCap = "round";
      for (var i = 0; i < segs.length; i++) {
        var s = segs[i];
        var f = clamp01((lt - s.birth) / s.dur);
        if (f <= 0) continue;
        ctx.globalAlpha = fade;
        ctx.lineWidth = s.w;
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x1 + (s.x2 - s.x1) * f, s.y1 + (s.y2 - s.y1) * f);
        ctx.stroke();
      }
      for (var j = 0; j < arcs.length; j++) {
        var ar = arcs[j];
        var g = clamp01((lt - ar.birth) / ar.dur);
        if (g <= 0) continue;
        ctx.globalAlpha = fade * 0.9;
        ctx.lineWidth = ar.w;
        ctx.beginPath();
        ctx.arc(ar.cx, ar.cy, ar.r, ar.a0, ar.a0 + (ar.a1 - ar.a0) * g);
        ctx.stroke();
      }
      // Impact knot, present once the first branches exist.
      if (lt > 0.5) {
        ctx.globalAlpha = fade;
        ctx.fillStyle = COL_CRACK;
        ctx.beginPath();
        ctx.arc(impact.x, impact.y, Math.max(1.6, minDim * 0.005), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // The flat line. One constant rectangle, drawn last, identical in every
    // frame of every loop. It does not react to the crack, the fade, or
    // anything else. That is the whole piece.
    var th = Math.max(3, Math.round(minDim * 0.011));
    ctx.globalAlpha = 1;
    ctx.fillStyle = COL_LINE;
    ctx.fillRect(0, Math.round(H / 2 - th / 2), W, th);
    ctx.globalAlpha = 1;
  }

  var perfNow = (typeof performance !== "undefined" && performance && typeof performance.now === "function")
    ? function () { return performance.now(); }
    : null;
  var t0 = perfNow ? perfNow() : 0;
  function tNow() { return perfNow ? (perfNow() - t0) / 1000 : 0; }

  // ----- Boot -------------------------------------------------------------
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", resize);
  }
  window.addEventListener("resize", resize);

  draw(0);
  if (typeof requestAnimationFrame === "function") {
    var loop = function () {
      draw(tNow());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
