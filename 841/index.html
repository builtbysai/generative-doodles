<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free to Choose — №841</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #241f1b;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
  }
  #stage {
    position: relative;
    display: block;
    cursor: pointer;
  }
  #caption {
    margin-top: 18px;
    text-align: center;
    color: #8a7f74;
    user-select: none;
  }
  #caption .t {
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #b3a89c;
  }
  #caption .s {
    margin-top: 5px;
    font-size: 12px;
    font-style: italic;
    letter-spacing: 0.04em;
    color: #6f655b;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="caption">
  <div class="t">Free to choose</div>
  <div class="s">after Santiago Sierra, Salamanca, 2000 &mdash; tap to reseed</div>
</div>
<script>
(function () {
  "use strict";

  // Freedom and choice. In Sierra's Salamanca work the four women
  // "chose" the tattoo for the price of a dose. The choice was real
  // and it was not free: need made it for them.
  //
  // Driver: forms wander freely through the field. Each one, on
  // reaching the line, chooses: cross and be marked, or turn away and
  // stay unmarked. The choice is a coin flip weighted by need, and
  // need grows the longer a form waits. A form with no need turns
  // away; a form consumed by need crosses. Crossing pays (a brief
  // flare) and marks (forever), and the need starts growing again.
  // Nothing forces any form. The pressure does the work.
  //
  // Need is visible: a needy form darkens. The line is drawn faint
  // across the field (the offer) and solid only where it lies on a
  // form (the mark). Tap reseeds.

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");

  var GROUND_TOP = "#2b2420";
  var GROUND_BOT = "#1e1916";
  var LINE_FAINT = "rgba(179,168,156,0.30)";
  var MARK_COLOR = "#120e0c";
  var FLARE_COLOR = [217, 142, 74]; // warm amber
  var NEED_COLOR = [58, 51, 46];    // the dark need pulls toward
  var TONES = ["#8a7a6a", "#9a8a7a", "#7a6a5c", "#a89378", "#6f6258", "#b09a80", "#847468"];
  var N_FORMS = 12;
  var FADE_SECS = 3;
  var DECIDE_DIST = 50;  // px from the line where a form chooses
  var FREE_DIST = 80;    // px from the line where the choice resets
  var NEED_SECS = 75;    // seconds for need to grow from 0 to 1

  var W = 0, H = 0, DPR = 1;
  var seed = 0;
  var rnd = null;
  var forms = [];
  var lineY = 0;
  var turnovers = 0;
  var crossings = 0;
  var turnaways = 0;
  var clockT = 0;
  var lastNow = null;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var maxW = Math.min(vw - 32, 920);
    var maxH = vh - 120;
    var w = maxW, h = Math.round(w * 0.72);
    if (h > maxH) { h = maxH; w = Math.round(h / 0.72); }
    W = w; H = h;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build(seed);
  }

  function newForm(fadeIn) {
    var y = rnd() * H;
    return {
      x: rnd() * W, y: y,
      rx: 26 + rnd() * 34, ry: 20 + rnd() * 28,
      heading: rnd() * Math.PI * 2,
      speed: 12 + rnd() * 10,
      tone: TONES[Math.floor(rnd() * TONES.length)],
      scalePhase: rnd() * Math.PI * 2,
      scalePeriod: 7 + rnd() * 5,
      marked: false, markDy: 0, markHalf: 0,
      flare: 0,
      need: 0,
      decided: false, decision: null,
      side: y > lineY ? 1 : -1,
      age: 0, lifespan: 150 + rnd() * 90,
      fade: fadeIn ? 0 : 1, state: fadeIn ? "in" : "live"
    };
  }

  function build(s) {
    seed = s;
    rnd = mulberry32(seed);
    clockT = 0;
    turnovers = 0;
    crossings = 0;
    turnaways = 0;
    lineY = H * (0.40 + rnd() * 0.20);
    forms = [];
    for (var i = 0; i < N_FORMS; i++) forms.push(newForm(false));
    draw();
  }

  function hexRgb(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function markForm(f) {
    if (f.marked || f.state !== "live") return;
    var sc = 1 + 0.02 * Math.sin(2 * Math.PI * clockT / f.scalePeriod + f.scalePhase);
    var dy = (lineY - f.y) / sc;
    if (Math.abs(dy) >= f.ry) return;
    f.marked = true;
    f.markDy = dy;
    f.markHalf = f.rx * Math.sqrt(1 - (dy / f.ry) * (dy / f.ry));
    f.flare = 1; // the payment: bright, warm, brief
    f.need = 0;  // the payment satisfies the need, for now
  }

  function update(dt) {
    clockT += dt;
    for (var i = 0; i < forms.length; i++) {
      var f = forms[i];
      f.age += dt;

      if (f.state === "in") {
        f.fade = Math.min(1, f.fade + dt / FADE_SECS);
        if (f.fade >= 1) f.state = "live";
      } else if (f.state === "out") {
        f.fade = Math.max(0, f.fade - dt / FADE_SECS);
        if (f.fade <= 0) {
          forms[i] = newForm(true);
          turnovers++;
          continue;
        }
      } else if (f.age > f.lifespan) {
        f.state = "out";
      }

      // Need grows the longer a form waits.
      if (f.state === "live") f.need = Math.min(1, f.need + dt / NEED_SECS);

      // Wander: the heading drifts, nothing steers the form.
      f.heading += (rnd() - 0.5) * 2.0 * dt;
      var vx = Math.cos(f.heading) * f.speed;
      var vy = Math.sin(f.heading) * f.speed;

      // The choice, made on entering the decision zone.
      var dist = Math.abs(f.y - lineY);
      if (f.state === "live" && dist < DECIDE_DIST && !f.decided) {
        f.decided = true;
        if (rnd() < f.need) {
          f.decision = "cross";
        } else {
          f.decision = "away";
          f.heading = -f.heading; // turn away, visibly
          vy = Math.sin(f.heading) * f.speed;
          turnaways++;
        }
      } else if (dist > FREE_DIST) {
        f.decided = false;
        f.decision = null;
      }

      f.x += vx * dt;
      f.y += vy * dt;
      var m = 80;
      if (f.x < -m) f.x += W + 2 * m;
      if (f.x > W + m) f.x -= W + 2 * m;
      if (f.y < -m) { f.y += H + 2 * m; f.side = f.y > lineY ? 1 : -1; }
      if (f.y > H + m) { f.y -= H + 2 * m; f.side = f.y > lineY ? 1 : -1; }

      // Crossing the line: the transaction repeats for the marked.
      var newSide = f.y > lineY ? 1 : -1;
      if (newSide !== f.side) {
        f.side = newSide;
        crossings++;
        if (f.marked) {
          f.flare = Math.max(f.flare, 0.7);
          f.need = 0;
        }
      }

      // The flare dies in a few seconds; the mark does not.
      if (f.flare > 0) f.flare = Math.max(0, f.flare - dt / 2.5);

      // Marked once, in the middle band, so the mark is a real chord.
      if (!f.marked && f.state === "live") {
        var sc = 1 + 0.02 * Math.sin(2 * Math.PI * clockT / f.scalePeriod + f.scalePhase);
        if (Math.abs(lineY - f.y) < f.ry * sc * 0.6) markForm(f);
      }
    }
  }

  function draw() {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, GROUND_TOP);
    grad.addColorStop(1, GROUND_BOT);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // The offer: one faint line across the whole field.
    ctx.strokeStyle = LINE_FAINT;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, lineY);
    ctx.lineTo(W, lineY);
    ctx.stroke();

    for (var i = 0; i < forms.length; i++) {
      var f = forms[i];
      var sc = 1 + 0.02 * Math.sin(2 * Math.PI * clockT / f.scalePeriod + f.scalePhase);
      ctx.save();
      ctx.globalAlpha = f.fade;
      ctx.translate(f.x, f.y);
      ctx.scale(sc, sc);

      // Need darkens the form; the flare warms and brightens it.
      var base = hexRgb(f.tone);
      var nd = f.need * 0.55, fl = f.flare;
      var r = Math.round(base[0] + (NEED_COLOR[0] - base[0]) * nd);
      var g = Math.round(base[1] + (NEED_COLOR[1] - base[1]) * nd);
      var b = Math.round(base[2] + (NEED_COLOR[2] - base[2]) * nd);
      r = Math.round(r + (FLARE_COLOR[0] - r) * fl * 0.65);
      g = Math.round(g + (FLARE_COLOR[1] - g) * fl * 0.65);
      b = Math.round(b + (FLARE_COLOR[2] - b) * fl * 0.65);
      if (fl > 0.01) {
        ctx.shadowColor = "rgba(217,142,74,0.8)";
        ctx.shadowBlur = fl * 28;
      }
      ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
      ctx.beginPath();
      ctx.ellipse(0, 0, f.rx, f.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // The mark: solid, dark, travelling with the form.
      if (f.marked) {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(0, 0, f.rx, f.ry, 0, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = MARK_COLOR;
        ctx.fillRect(-f.markHalf, f.markDy - 1.25, f.markHalf * 2, 2.5);
        ctx.restore();
      }
      ctx.restore();
    }
  }

  function frame(now) {
    if (lastNow === null) lastNow = now;
    var dt = (now - lastNow) / 1000;
    lastNow = now;
    update(Math.min(dt, 0.1));
    draw();
    requestAnimationFrame(frame);
  }

  function reseed() {
    build((Math.random() * 1e9) | 0);
  }

  canvas.addEventListener("click", reseed);
  canvas.addEventListener("touchend", function (e) { e.preventDefault(); reseed(); }, { passive: false });
  window.addEventListener("resize", layout);

  // Test hooks.
  window.__piece = {
    lineY: function () { return lineY; },
    forms: function () {
      return forms.map(function (f) {
        return {
          x: f.x, y: f.y, rx: f.rx, ry: f.ry,
          heading: f.heading, speed: f.speed,
          marked: f.marked, markDy: f.markDy, markHalf: f.markHalf,
          flare: f.flare, need: f.need,
          decided: f.decided, decision: f.decision,
          age: f.age, lifespan: f.lifespan,
          state: f.state, fade: f.fade,
          distToLine: Math.abs(f.y - lineY)
        };
      });
    },
    markedCount: function () {
      return forms.filter(function (f) { return f.marked; }).length;
    },
    turnovers: function () { return turnovers; },
    crossings: function () { return crossings; },
    turnaways: function () { return turnaways; },
    step: function (dt) { update(dt); draw(); },
    testMark: function (i) {
      // Test-only: force a mark at the form's centre chord, regardless
      // of where it sits. The real marking path is geometry-gated.
      var f = forms[i];
      if (f.marked || f.state !== "live") return;
      f.marked = true;
      f.markDy = 0;
      f.markHalf = f.rx;
      f.flare = 1;
    },
    setNeed: function (i, v) { forms[i].need = v; },
    placeForm: function (i, x, y, heading) {
      var f = forms[i];
      f.x = x; f.y = y; f.heading = heading;
      f.decided = false; f.decision = null;
      f.side = y > lineY ? 1 : -1;
    },
    reseed: reseed,
    seed: function () { return seed; },
    size: function () { return { w: W, h: H }; }
  };

  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
