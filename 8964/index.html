<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8964 — Fusion Threshold</title>
<!-- phantom-fill-8964 -->
<style>
  :root{--bg:#0a0a0a;--ink:#f2f2f0;--dim:#7a7a76;--amber:#ffb000;--red:#ff3b30;--line:#262626}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
  header{width:100%;max-width:1100px;padding:26px 24px 0;display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:clamp(22px,4vw,34px);font-weight:400}
  .no{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim);letter-spacing:.22em}
  .sub{width:100%;max-width:1100px;padding:8px 24px 0;color:var(--dim);font-style:italic;font-size:15px}
  main{flex:1;width:100%;max-width:1100px;min-height:0;padding:10px 24px 0;display:flex;flex-direction:column}
  #field{width:100%;flex:1;display:block}
  .readout{display:flex;gap:48px;padding:10px 2px 0;font-family:ui-monospace,Menlo,monospace}
  .readout b{display:block;font-size:28px;font-weight:600}
  .readout span{font-size:11px;letter-spacing:.16em;color:var(--dim)}
  #rateVal{color:var(--ink)}
  #state{color:var(--amber)}
  #state.fused{color:var(--red)}
  .controls{width:100%;max-width:1100px;padding:12px 24px 0;display:flex;align-items:center;gap:18px}
  .controls label{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.16em;color:var(--dim);white-space:nowrap}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--line);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--amber);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--amber);cursor:grab}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--amber);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--amber);cursor:grab}
  .tick{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim)}
  footer{padding:16px 24px 24px;display:flex;gap:16px;align-items:center;color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em}
  button{background:none;border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:11px;letter-spacing:.16em;padding:10px 18px;cursor:pointer}
  button:hover{border-color:var(--amber);color:var(--amber)}
</style>
</head>
<body>
<header><h1>Fusion Threshold</h1><div class="no">№ 8964</div></header>
<p class="sub">Dots accelerate until they stop being dots and become tone. A meter marks the moment.</p>
<main>
  <canvas id="field"></canvas>
  <div class="readout">
    <div><b id="rateVal">1.0 Hz</b><span>PULSE RATE</span></div>
    <div><b id="state">RHYTHM</b><span>STATE</span></div>
    <div><b>20 Hz</b><span>FUSION THRESHOLD</span></div>
  </div>
</main>
<div class="controls">
  <label>RATE</label><span class="tick">0.5 Hz</span>
  <input type="range" id="rate" min="0" max="1000" step="1" value="145">
  <span class="tick">60 Hz</span>
</div>
<footer><span>DRAG THE RATE — OR SWEEP THROUGH THE THRESHOLD</span><button id="sweep">SWEEP ▸</button><button id="mute">MUTE</button></footer>
<script>
(function(){
"use strict";
// A 330 Hz carrier is gated by a square LFO at the pulse rate.
// Below ~20 Hz you hear separate pulses; above it the pulses fuse into tone.
var CARRIER = 330, THRESH = 20;
var rate = 1.0; // Hz, log slider 0.5..60
var rateEl = document.getElementById('rate');
var rateVal = document.getElementById('rateVal'), stateEl = document.getElementById('state');
function sliderToRate(v){ return 0.5 * Math.pow(120, v / 1000); }
function rateToSlider(r){ return Math.round(1000 * Math.log(r / 0.5) / Math.log(120)); }
rate = sliderToRate(parseInt(rateEl.value, 10));

// --- audio ---
var ctx = null, master = null, lfo = null, muted = false;
function ensureCtx(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    window.__ac = ctx;
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(ctx.destination);
    var car = ctx.createOscillator(), cg = ctx.createGain();
    car.type = 'sine'; car.frequency.value = CARRIER;
    cg.gain.value = 0.5;
    lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = rate;
    var lg = ctx.createGain(); lg.gain.value = 0.5;
    lfo.connect(lg); lg.connect(cg.gain);
    car.connect(cg); cg.connect(master);
    car.start(); lfo.start();
  }
  if(ctx.state === 'suspended' && !muted) ctx.resume();
}
document.addEventListener('visibilitychange', function(){
  if(!ctx) return;
  if(document.hidden) ctx.suspend(); else if(!muted) ctx.resume();
});
window.addEventListener('blur', function(){ if(ctx) ctx.suspend(); });
window.addEventListener('focus', function(){ if(ctx && !muted) ctx.resume(); });
window.addEventListener('beforeunload', function(){ if(ctx) ctx.close(); });
document.getElementById('mute').addEventListener('click', function(){
  ensureCtx();
  muted = !muted;
  this.textContent = muted ? 'UNMUTE' : 'MUTE';
  master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.05);
  if(muted) ctx.suspend(); else ctx.resume();
});
function setRate(r){
  rate = r;
  rateVal.textContent = (r < 10 ? r.toFixed(1) : r.toFixed(0)) + ' Hz';
  var fused = r >= THRESH, fusing = r >= 8 && r < THRESH;
  stateEl.textContent = fused ? 'TONE — FUSED' : (fusing ? 'FUSING' : 'RHYTHM');
  stateEl.classList.toggle('fused', fused);
  if(lfo) lfo.frequency.setTargetAtTime(r, ctx.currentTime, 0.02);
}
rateEl.addEventListener('input', function(){
  ensureCtx(); stopSweep();
  setRate(sliderToRate(parseInt(rateEl.value, 10)));
});

// --- sweep: 1 Hz -> 48 Hz over 14 s ---
var sweeping = false, sweepId = null, sweepStart = 0, sweepFrom = 0;
var sweepBtn = document.getElementById('sweep');
function stopSweep(){
  sweeping = false;
  if(sweepId) cancelAnimationFrame(sweepId);
  sweepId = null;
  sweepBtn.textContent = 'SWEEP ▸';
}
sweepBtn.addEventListener('click', function(){
  if(sweeping){ stopSweep(); return; }
  ensureCtx();
  sweeping = true;
  sweepBtn.textContent = 'STOP';
  sweepStart = performance.now();
  sweepFrom = rate;
  var target = 48;
  function step(now){
    var k = Math.min(1, (now - sweepStart) / 14000);
    var r = sweepFrom * Math.pow(target / sweepFrom, k);
    rateEl.value = rateToSlider(r);
    setRate(r);
    if(k < 1 && sweeping) sweepId = requestAnimationFrame(step);
    else stopSweep();
  }
  sweepId = requestAnimationFrame(step);
});

// --- dots + meter ---
var cv = document.getElementById('field'), cx2 = cv.getContext('2d');
function resize(){
  var r = cv.getBoundingClientRect();
  cv.width = r.width; cv.height = r.height;
}
window.addEventListener('resize', resize);
resize();
var NDOTS = 24;
function frame(now){
  var W = cv.width, H = cv.height;
  cx2.clearRect(0, 0, W, H);
  var dotY = Math.round(H * 0.38);
  var fused = rate >= THRESH;
  // pulse phase, shared by all dots: on for the first half of each cycle
  var phase = (now / 1000 * rate) % 1;
  var on = phase < 0.5;
  var bright = fused ? 1 : (on ? 1 : 0.12);
  // fused: dots join into one glowing bar
  if(fused){
    cx2.strokeStyle = 'rgba(255,59,48,0.55)'; cx2.lineWidth = 3;
    cx2.beginPath();
    cx2.moveTo(60, dotY); cx2.lineTo(W - 60, dotY); cx2.stroke();
  }
  for(var i = 0; i < NDOTS; i++){
    var x = 60 + (W - 120) * i / (NDOTS - 1);
    cx2.fillStyle = fused ? '#ff3b30' : '#f2f2f0';
    cx2.globalAlpha = bright;
    cx2.beginPath(); cx2.arc(x, dotY, fused ? 7 : 8, 0, Math.PI * 2); cx2.fill();
  }
  cx2.globalAlpha = 1;
  // meter: log scale 0.5..60 Hz
  var my = Math.round(H * 0.78), mx0 = 60, mx1 = W - 60;
  function meterX(r){ return mx0 + (Math.log(r / 0.5) / Math.log(120)) * (mx1 - mx0); }
  cx2.strokeStyle = '#3a3a38'; cx2.lineWidth = 2;
  cx2.beginPath(); cx2.moveTo(mx0, my); cx2.lineTo(mx1, my); cx2.stroke();
  // tick marks at 1, 2, 5, 10, 20, 40, 60
  cx2.fillStyle = '#7a7a76';
  cx2.font = '11px ui-monospace, Menlo, monospace';
  cx2.textAlign = 'center';
  [1, 2, 5, 10, 20, 40, 60].forEach(function(t){
    var x = meterX(t);
    cx2.strokeStyle = '#3a3a38'; cx2.lineWidth = 1;
    cx2.beginPath(); cx2.moveTo(x, my - 5); cx2.lineTo(x, my + 5); cx2.stroke();
    cx2.fillText(t + '', x, my + 22);
  });
  // threshold line
  var tx = meterX(THRESH);
  cx2.strokeStyle = '#ff3b30'; cx2.lineWidth = 2;
  cx2.beginPath(); cx2.moveTo(tx, my - 26); cx2.lineTo(tx, my + 26); cx2.stroke();
  cx2.fillStyle = '#ff3b30';
  cx2.fillText('FUSION 20 Hz', tx, my - 34);
  // needle
  var nx = meterX(rate);
  cx2.fillStyle = '#ffb000';
  cx2.beginPath();
  cx2.moveTo(nx, my - 14); cx2.lineTo(nx - 7, my - 28); cx2.lineTo(nx + 7, my - 28);
  cx2.closePath(); cx2.fill();
  cx2.fillRect(nx - 1.5, my - 14, 3, 14);
  requestAnimationFrame(frame);
}
setRate(rate);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
