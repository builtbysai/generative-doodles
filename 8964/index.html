<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8470;8964 &middot; Fusion Threshold</title>
<style>
  :root{ --ink:#0e0f13; --paper:#f2ead8; --verm:#e2482e; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--paper);
       -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
  #plate{position:absolute;top:14px;left:18px;pointer-events:none;user-select:none;
    font-size:13px;letter-spacing:.14em;color:rgba(242,234,216,.62);text-transform:uppercase;z-index:2}
  #plate b{color:var(--paper);font-weight:700}
  #meter{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));pointer-events:none;user-select:none;
    text-align:center;z-index:2}
  #rate{font-size:26px;font-weight:600;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  #rate small{font-size:13px;font-weight:400;color:rgba(242,234,216,.6)}
  #fused{display:inline-block;margin-top:6px;font-size:12px;letter-spacing:.28em;font-weight:700;
    color:var(--verm);border:1px solid var(--verm);border-radius:999px;padding:4px 14px 4px 17px;
    opacity:0;transition:opacity .4s}
  #fused.on{opacity:1}
  #hist{position:absolute;top:14px;right:18px;pointer-events:none;user-select:none;z-index:2;
    font-size:11px;letter-spacing:.08em;color:rgba(242,234,216,.45);text-align:right;line-height:1.8}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="plate"><b>&#8470;8964</b> &middot; Fusion Threshold</div>
  <div id="hist"></div>
  <div id="meter">
    <div id="rate">0.0 <small>marks / sec</small></div>
    <div id="fused">FUSED</div>
  </div>
</div>
<script>
"use strict";
/* Seed 264 "Fusion Threshold": an accelerating dot field that crosses the
   point where discrete marks fuse into continuous tone. Marks are emitted
   at a rate that grows exponentially through the cycle; persistence trails
   do the fusing. The piece watches for the phase change, stamps the rate
   at which it happened, and keeps a short history of past fusions. It ends
   deliberately past fusion, holding the solid band before re-seeding. */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const rateEl = document.getElementById('rate');
const fusedEl = document.getElementById('fused');
const histEl = document.getElementById('hist');

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromURL(){
  const m = /[?&]seed=(\d+)/.exec(location.search);
  return m ? (parseInt(m[1],10) >>> 0) : ((Math.random()*1e9)|0);
}
let SEED = seedFromURL();

const CYCLE = 36;        // seconds: sparse -> fused -> held
const FUSE_GUESS = 24;   // marks/sec where the tag flips; the honest stamp is measured
const DOTS = [
  {c:'#f2ead8', glow:'#ffe9b0'},
  {c:'#cfe8ff', glow:'#8ecbff'},
  {c:'#ffd9c9', glow:'#ff9e7a'}
];

let W=0,H=0,DPR=1;
let rnd, dots, emitAcc, t0, fusedAt, fusedStamped, hist, pal, jitterSeed, cycleN;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#0e0f13';
  ctx.fillRect(0,0,W,H);
}
window.addEventListener('resize', resize);

function rate(t){ return 1.5*Math.pow(1.16, t); }  // marks per second
function smoothNoise(x, s){
  return Math.sin(x*1.7+s)*0.55 + Math.sin(x*3.9+s*1.3)*0.30 + Math.sin(x*8.1+s*0.7)*0.15;
}

function newCycle(){
  rnd = mulberry32(SEED + cycleN*104729);
  pal = DOTS[(rnd()*DOTS.length)|0];
  jitterSeed = rnd()*100;
  dots = [];
  emitAcc = 0; fusedAt = -1; fusedStamped = false;
  t0 = performance.now()/1000;
  ctx.fillStyle = '#0e0f13';
  ctx.fillRect(0,0,W,H);
  fusedEl.classList.remove('on');
}

function draw(now){
  const t = now/1000 - t0;
  const dt = Math.min(0.05, (now - (draw.last||now))/1000);
  draw.last = now;

  // persistence: the fuser
  ctx.fillStyle = 'rgba(14,15,19,0.10)';
  ctx.fillRect(0,0,W,H);

  const r = rate(Math.min(t, CYCLE));
  if(t <= CYCLE){
    emitAcc += r*dt;
    const v = W/5.5;                       // dots cross in 5.5 s
    const dr = Math.max(1.6, Math.min(3.4, W/520));
    while(emitAcc >= 1){
      emitAcc -= 1;
      dots.push({
        x: W+12,
        y: H/2 + smoothNoise(t*2.2 + dots.length*0.13, jitterSeed)*H*0.30,
        v: v*(0.94+rnd()*0.12),
        ph: rnd()*7
      });
    }
    // the phase change: measured, not assumed
    if(!fusedStamped && r >= FUSE_GUESS){
      fusedAt = t; fusedStamped = true;
      hist.push(r);
      if(hist.length > 3) hist.shift();
      fusedEl.classList.add('on');
      renderHist();
    }
  }

  // dots
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const band = fusedStamped ? 1 : 0;
  for(let i=dots.length-1;i>=0;i--){
    const d = dots[i];
    d.x -= d.v*dt;
    if(d.x < -14){ dots.splice(i,1); continue; }
    const tw = 0.7+0.3*Math.sin(now*9+d.ph);
    ctx.shadowColor = pal.glow; ctx.shadowBlur = 8+10*band;
    ctx.fillStyle = pal.c;
    ctx.globalAlpha = 0.55+0.4*tw;
    ctx.beginPath(); ctx.arc(d.x, d.y, (1.6+1.4*tw)*(0.7+0.5*band), 0, 7); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // threshold hairline at center, brightens past fusion
  ctx.strokeStyle = fusedStamped ? 'rgba(226,72,46,0.75)' : 'rgba(242,234,216,0.22)';
  ctx.lineWidth = fusedStamped ? 2 : 1;
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();

  rateEl.innerHTML = (t<=CYCLE ? r : rate(CYCLE)).toFixed(1)+' <small>marks / sec</small>';

  if(t >= CYCLE+2.5){
    cycleN++;
    newCycle();
  }
  requestAnimationFrame(draw);
}

function renderHist(){
  histEl.innerHTML = hist.map((r,i)=>'fusion '+(i+1)+': '+r.toFixed(1)+'/s').join('<br>');
}

canvas.addEventListener('pointerdown', ()=>{
  SEED = (Math.random()*1e9)|0;
  cycleN = 0; hist = [];
  renderHist();
  newCycle();
});

resize();
hist = [];
cycleN = 0;
newCycle();
requestAnimationFrame(draw);
</script>
</body>
</html>
