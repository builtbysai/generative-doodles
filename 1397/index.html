<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telephone Game</title>
<style>
  html, body { margin: 0; padding: 0; background: #e4dfd2; overflow: hidden; }
  canvas { display: block; background: #e4dfd2; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded PRNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Deterministic hash in [-1, 1] for (cycle, copy, seg, pt).
  function hash4(a, b, c, d) {
    var h = (a * 73856093) ^ (b * 19349663) ^ (c * 83492791) ^ (d * 2971215073);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = h ^ (h >>> 16);
    return ((h >>> 0) / 4294967296) * 2 - 1;
  }

  // ---------- palette ----------
  var PAPER = [228, 223, 210];
  var INK = [26, 26, 24];
  var SHIFTS = [[61, 90, 128], [176, 30, 36], [74, 124, 58]];
  function rgba(c, a) {
    var q = Math.round(a * 10000) / 10000;
    if (q <= 0) return 'rgba(0,0,0,0)';
    if (q >= 1) return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + q + ')';
  }
  function lerpC(a, b, t) {
    return [Math.round(a[0] + (b[0] - a[0]) * t),
            Math.round(a[1] + (b[1] - a[1]) * t),
            Math.round(a[2] + (b[2] - a[2]) * t)];
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smoothstep(v) {
    v = clamp(v, 0, 1);
    return v * v * (3 - 2 * v);
  }

  // ---------- motif: geometric bird, parametric vector drawing ----------
  // Unit space, roughly [-1, 1] x [-1, 1]. Each entry is a polyline.
  var MOTIF = [
    [[-0.9, 0.15], [-0.2, -0.35], [0.7, -0.15], [-0.2, 0.35], [-0.9, 0.15]], // body
    [[-0.35, -0.1], [0.15, -0.75], [0.45, -0.25]],                            // wing
    [[0.7, -0.15], [1.0, -0.05], [0.7, 0.05]],                               // beak
    [[-0.9, 0.15], [-1.35, -0.15], [-1.25, 0.3], [-1.4, 0.55]],               // tail
    [[-0.1, 0.35], [-0.1, 0.85]],                                            // leg
    [[0.35, -0.35]]                                                          // eye (dot)
  ];

  var NCOPIES = 8;
  var CYCLE = 48; // seconds per re-seed cycle
  var SHIFT = 36; // phase shift so frame one already shows the full chain

  // ---------- recorded events (closed-form state) ----------
  var dragSamples = []; // {t, dx}
  var errorEvents = []; // {cycle, copy, time}
  var downInfo = null;
  var curT = 0;
  var copyCenters = []; // filled each draw: {x, y, r}

  function scrubOffset(t) {
    var s = 0;
    for (var i = 0; i < dragSamples.length; i++) {
      var e = dragSamples[i];
      if (t >= e.t) s += e.dx * 0.05 * Math.exp(-(t - e.t) / 4);
    }
    return clamp(s, -40, 0);
  }

  function copyParams(cycle, copy) {
    var rng = mulberry32(1397000 + cycle * 101 + copy * 7919);
    return {
      rot: (rng() * 2 - 1) * 0.6,
      dropBase: rng(),
      wobSeed: rng() * 100,
      glyph: Math.floor(rng() * 5),
      yOff: (rng() * 2 - 1)
    };
  }

  // Degradation of copy i at effective cycle time ct, including injected errors.
  function degradation(cycle, copy, ct, t) {
    var reveal = clamp((ct - copy * 3) / 18, 0, 1);
    var d = reveal * (0.15 + 0.85 * (copy / (NCOPIES - 1)));
    var extra = 0;
    for (var i = 0; i < errorEvents.length; i++) {
      var ev = errorEvents[i];
      if (ev.cycle !== cycle || ev.copy > copy) continue;
      var hop = copy - ev.copy;
      var arr = (t - ev.time - hop * 0.5) / 1.5;
      extra += 0.4 * smoothstep(arr);
    }
    return clamp(d + extra, 0, 1);
  }

  function drawGlyph(g, x, y, s, color) {
    ctx.strokeStyle = rgba(color, 0.75);
    ctx.lineWidth = Math.max(1, s * 0.12);
    ctx.beginPath();
    if (g === 0) { // chevron
      ctx.moveTo(x - s * 0.4, y - s * 0.3); ctx.lineTo(x, y + s * 0.3); ctx.lineTo(x + s * 0.4, y - s * 0.3);
    } else if (g === 1) { // arc
      ctx.moveTo(x - s * 0.4, y + s * 0.2);
      ctx.arc(x, y + s * 0.2, s * 0.4, Math.PI, 0);
    } else if (g === 2) { // cross
      ctx.moveTo(x - s * 0.35, y); ctx.lineTo(x + s * 0.35, y);
      ctx.moveTo(x, y - s * 0.35); ctx.lineTo(x, y + s * 0.35);
    } else if (g === 3) { // hook
      ctx.moveTo(x - s * 0.3, y - s * 0.4); ctx.lineTo(x - s * 0.3, y + s * 0.2);
      ctx.arc(x, y + s * 0.2, s * 0.3, Math.PI, 0);
    } else { // dot pair
      ctx.fillStyle = rgba(color, 0.75);
      ctx.fillRect(x - s * 0.45, y - s * 0.12, s * 0.24, s * 0.24);
      ctx.fillRect(x + s * 0.21, y - s * 0.12, s * 0.24, s * 0.24);
      return;
    }
    ctx.stroke();
  }

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return { w: w, h: h };
  }

  function draw(t) {
    curT = t;
    var s = size();
    var W = s.w, H = s.h;
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = rgba(PAPER, 1);
    ctx.fillRect(0, 0, W, H);

    var cycle = Math.floor((t + SHIFT) / CYCLE);
    var ctLive = (t + SHIFT) % CYCLE;
    var ct = Math.max(0, ctLive + scrubOffset(t));

    var bandY = H * 0.52;
    // Motif half-width is 1.4*scale; keep it under half the copy spacing so
    // neighbours never overlap, even at 390 wide.
    var scale = Math.min(Math.min(W, H) * 0.085, W * 0.042);
    var x0 = W * 0.09, x1 = W * 0.93;
    copyCenters = [];

    for (var i = 0; i < NCOPIES; i++) {
      var p = copyParams(cycle, i);
      var d = degradation(cycle, i, ct, t);
      var cx = x0 + (x1 - x0) * (i / (NCOPIES - 1));
      var cy = bandY + p.yOff * 10 * d;
      copyCenters.push({ x: cx, y: cy, r: scale * 1.6 });
      var col = lerpC(INK, SHIFTS[i % 3], d);
      var rot = p.rot * d * (0.2 + i / NCOPIES);
      var wob = d * scale * 0.09;
      var appear = smoothstep((ct - i * 3) / 2);
      if (appear <= 0) continue;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.strokeStyle = rgba(col, appear);
      ctx.fillStyle = rgba(col, appear);
      ctx.lineWidth = Math.max(1, scale * 0.045);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (var si = 0; si < MOTIF.length; si++) {
        var seg = MOTIF[si];
        // Segment dropout grows with degradation; original (copy 0) never drops.
        var dropRng = mulberry32(1397000 + cycle * 101 + i * 7919 + si * 131);
        if (i > 0 && dropRng() < d * 0.55) continue;
        var pts = [];
        for (var pi = 0; pi < seg.length; pi++) {
          var wx = hash4(cycle, i, si, pi * 2) * wob;
          var wy = hash4(cycle, i, si, pi * 2 + 1) * wob;
          pts.push([seg[pi][0] * scale + wx, seg[pi][1] * scale + wy]);
        }
        if (pts.length === 1) {
          var r = Math.max(1.5, scale * 0.06);
          ctx.fillRect(pts[0][0] - r / 2, pts[0][1] - r / 2, r, r);
        } else {
          ctx.beginPath();
          ctx.moveTo(pts[0][0], pts[0][1]);
          for (var k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
          ctx.stroke();
        }
      }
      ctx.restore();

      // Pseudo-script index glyph below the copy (never a letter or digit).
      drawGlyph(p.glyph, cx, bandY + scale * 1.9, scale * 0.28, col);
    }
  }

  // ---------- interaction: drag scrubs history, tap mishears ----------
  function pos(e) {
    if (e.clientX !== undefined) return { x: e.clientX, y: e.clientY };
    if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: 0, y: 0 };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e);
    downInfo = { x: p.x, y: p.y, t: curT, moved: 0 };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!downInfo) return;
    var p = pos(e);
    var inc = p.x - downInfo.x;
    if (inc !== 0) {
      dragSamples.push({ t: curT, dx: inc });
      downInfo.moved += Math.abs(inc);
    }
    downInfo.x = p.x; downInfo.y = p.y;
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!downInfo) return;
    var p = pos(e);
    // Tap (not a drag): mishear the nearest copy.
    if (downInfo.moved < 14) {
      var best = -1, bd = 1e9;
      for (var i = 0; i < copyCenters.length; i++) {
        var ddx = p.x - copyCenters[i].x, ddy = p.y - copyCenters[i].y;
        var dd = ddx * ddx + ddy * ddy;
        if (dd < bd) { bd = dd; best = i; }
      }
      if (best >= 0 && bd < copyCenters[best].r * copyCenters[best].r * 4) {
        errorEvents.push({ cycle: Math.floor((curT + SHIFT) / CYCLE), copy: best, time: curT });
      }
    }
    downInfo = null;
  });

  // ---------- boot: frame one is draw(0); clock starts with the rAF loop ----------
  draw(0);
  var started = false, t0 = 0;
  function loop(ts) {
    if (!started) { started = true; t0 = ts; }
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  function onResize() { draw(curT); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }
})();
</script>
</body>
</html>
