<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bad Stars</title>
<style>
  html, body { margin: 0; padding: 0; background: #F3D3DC; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var T0 = 33;                  // fixed first-frame phase: slot 1, clouds over water, phrase up
  var SLOT = 25;                // seconds per scene
  var SCENE_SEQ = [0, 1, 2, 3, 4];   // tidal, clouds, narwhal, cacti, trees
  var PHRASES = [
    'we heard people trying to dig through the rubble',
    'we had always known there was something off about him',
    'the water kept rising after the rain stopped',
    'no one remembered locking the door',
    'the sirens were for another town',
    'it was a clear day, like this one'
  ];
  // palette
  var WP_LIGHT = '#E8A0B4', WP_DEEP = '#D66A8A', WP_GROUND = '#F5D7DF';
  var SEA = '#7FB5A5', OCHRE = '#D98E4A', SMOKE = '#8A8D94', FLAME = '#E86A2C';
  var CARD = '#F6EFE3', INK = '#1B1B1B';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded hash (seeded only; no unseeded randomness) ----------
  function rnd(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- phrase order (seeded shuffle; double-tap reseeds) ----------
  var phraseSeed = 1233;
  var phraseOrder = [];
  function shufflePhrases() {
    phraseOrder = [0, 1, 2, 3, 4, 5];
    for (var i = 5; i > 0; i--) {
      var j = Math.floor(rnd(phraseSeed * 91.7 + i * 17.31) * (i + 1));
      var tmp = phraseOrder[i]; phraseOrder[i] = phraseOrder[j]; phraseOrder[j] = tmp;
    }
  }
  shufflePhrases();
  function phraseForSlot(k) { return PHRASES[phraseOrder[k % 6]]; }

  // ---------- intrusion plan ----------
  // intrusion k sits in [25k-4, 25k), replacing the tail of slot k-1.
  // k=1: none (frame one stays calm). k>=2: types cycle 2,0,1 (volcano, bush, grate).
  function intrusionType(k) {
    if (k < 2) return -1;
    return (k * 7 + 3) % 3 === 0 ? 0 : ((k * 7 + 3) % 3 === 1 ? 1 : 2);
  }

  // ---------- interaction state (recorded events only) ----------
  var nudgeOffset = 0;          // scene index offset from drags
  var drag = null;              // {x0, x}
  var lastTapT = -10;

  // ---------- sizing (Visual Viewport API) ----------
  var W = 0, H = 0, SCALE = 1, PHONE = false;
  function measure() {
    var vv = window.visualViewport;
    W = (vv && vv.width) || window.innerWidth || 800;
    H = (vv && vv.height) || window.innerHeight || 600;
    canvas.width = W; canvas.height = H;
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    PHONE = (Math.min(sw, sh) < 700) || (H > W * 1.15);
    SCALE = clamp(Math.min(W, H) / 760, 0.55, 1.25);
    if (PHONE) SCALE = clamp(Math.min(W, H) / 620, 0.6, 1.1);
  }
  function borderW() { return Math.max(17, Math.min(W, H) * 0.036); }

  // ---------- shape helpers ----------
  // dots/discs: fresh path + moveTo before every arc (house rule)
  function disc(x, y, r, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }
  function blob(x, y, r, seed, fill, squash) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    var n = 11;
    for (var i = 0; i <= n; i++) {
      var a = (i % n) / n * 6.2832;
      var rr = r * (0.84 + 0.28 * rnd(seed + i * 3.7));
      var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * squash;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.fill();
  }
  function poly(pts, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath(); ctx.fill();
  }
  function star5(x, y, R, rot, fill) {
    var pts = [];
    for (var i = 0; i < 10; i++) {
      var a = rot + i * 3.14159 / 5, rr = (i % 2 === 0) ? R : R * 0.5;
      pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    poly(pts, fill);
  }

  // ---------- scene 0: tidal flat ----------
  function sceneTidal(g, step, x, y, w, h) {
    ctx.fillStyle = '#DDEEE7'; ctx.fillRect(x, y, w, h * 0.34);                    // sky
    ctx.fillStyle = '#A8CFC2'; ctx.fillRect(x, y + h * 0.34, w, h * 0.13);        // sheen water
    ctx.fillStyle = '#E7D2AC'; ctx.fillRect(x, y + h * 0.47, w, h * 0.53);        // sand
    // wet patches
    for (var i = 0; i < 5; i++) {
      blob(x + w * (0.12 + 0.19 * i) + (rnd(i * 7 + 1) - 0.5) * w * 0.06,
           y + h * (0.62 + 0.24 * rnd(i * 7 + 2)), w * 0.075, i * 13 + 4, '#DCC493', 0.4);
    }
    // slow wave lines on the sheen band, stepping in 4-step groups
    ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = Math.max(1.2, 1.6 * SCALE);
    for (var rI = 0; rI < 3; rI++) {
      var wy = y + h * (0.365 + 0.033 * rI);
      for (var sI = 0; sI < 6; sI++) {
        var wx = x + ((sI * w / 5 + ((step >> 2) % 8) * 3 + rI * 26) % (w + 30)) - 15;
        ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + w * 0.055, wy); ctx.stroke();
      }
    }
    // drift line of tiny shells
    for (var dI = 0; dI < 9; dI++) {
      disc(x + w * (0.06 + 0.105 * dI), y + h * (0.5 + 0.03 * rnd(dI * 3 + 8)), 1.6 * SCALE, '#C9B18A');
    }
    // starfish
    var sf = [[0.24, 0.68, 0], [0.55, 0.8, 1], [0.79, 0.63, 2]];
    for (var fI = 0; fI < 3; fI++) {
      var fx = x + w * sf[fI][0], fy = y + h * sf[fI][1], fr = w * 0.045;
      star5(fx, fy, fr, rnd(fI * 11 + 3) * 3, OCHRE);
      star5(fx, fy, fr * 0.55, rnd(fI * 11 + 3) * 3, '#E5A566');
      disc(fx, fy, fr * 0.14, '#B96F32');
    }
    // shells: scallop fans
    for (var shI = 0; shI < 4; shI++) {
      var sx = x + w * (0.13 + 0.24 * shI) + (rnd(shI * 5 + 2) - 0.5) * 20;
      var sy = y + h * (0.9 - 0.13 * rnd(shI * 5 + 6)), sr = 9 * SCALE + shI * 1.5;
      ctx.fillStyle = shI % 2 ? '#F2D8C9' : WP_LIGHT;
      ctx.beginPath(); ctx.moveTo(sx + sr, sy);
      ctx.arc(sx, sy, sr, 0, 3.14159); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(160,110,90,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - sr * 0.6, sy - sr * 0.75); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + sr * 0.6, sy - sr * 0.75); ctx.stroke();
    }
  }

  // ---------- scene 1: clouds over water ----------
  var CLOUDS = [];
  for (var cI = 0; cI < 6; cI++) {
    CLOUDS.push({
      fx: rnd(cI * 17 + 1), fy: 0.1 + 0.24 * rnd(cI * 17 + 2),
      r: 0.055 + 0.05 * rnd(cI * 17 + 3), seed: cI * 29 + 5,
      cream: cI % 2 === 0
    });
  }
  function drawCloud(cx, cy, r, seed, cream) {
    blob(cx - r * 0.85, cy + r * 0.18, r * 0.62, seed + 1, cream ? '#FDF6E8' : '#FFFFFF', 0.62);
    blob(cx + r * 0.85, cy + r * 0.2, r * 0.58, seed + 2, cream ? '#FDF6E8' : '#FFFFFF', 0.6);
    blob(cx, cy, r, seed + 3, cream ? '#FFFDF6' : '#FFFFFF', 0.66);
    blob(cx, cy + r * 0.34, r * 0.8, seed + 4, '#E9EEF3', 0.5);
  }
  function sceneClouds(g, step, x, y, w, h) {
    ctx.fillStyle = '#A9CCE4'; ctx.fillRect(x, y, w, h * 0.2);
    ctx.fillStyle = '#BCD9E8'; ctx.fillRect(x, y + h * 0.2, w, h * 0.22);
    ctx.fillStyle = '#CFE5EF'; ctx.fillRect(x, y + h * 0.42, w, h * 0.2);
    disc(x + w * 0.13, y + h * 0.15, h * 0.05, '#F7ECD2');
    // clouds drift slowly, wrapping
    for (var i = 0; i < 6; i++) {
      var cl = CLOUDS[i], span = w + w * 0.4;
      var cx = x - w * 0.2 + ((cl.fx * span + step * 0.32) % span);
      drawCloud(cx, y + h * cl.fy, w * cl.r, cl.seed, cl.cream);
    }
    // water
    ctx.fillStyle = SEA; ctx.fillRect(x, y + h * 0.62, w, h * 0.38);
    ctx.fillStyle = '#9CC8BA'; ctx.fillRect(x, y + h * 0.62, w, h * 0.035);
    // reflected streaks under clouds
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = Math.max(1.2, 2 * SCALE);
    for (var rI = 0; rI < 6; rI++) {
      var cl2 = CLOUDS[rI], span2 = w + w * 0.4;
      var ccx = x - w * 0.2 + ((cl2.fx * span2 + step * 0.32) % span2);
      for (var sI = 0; sI < 3; sI++) {
        var sy = y + h * (0.7 + 0.09 * sI) + (rnd(rI * 7 + sI) - 0.5) * 4;
        var sw2 = w * cl2.r * (0.7 + 0.5 * rnd(rI * 9 + sI * 3)) * (1 - sI * 0.18);
        var jx = ((step >> 2) % 3 - 1) * 2;
        ctx.beginPath(); ctx.moveTo(ccx - sw2 / 2 + jx, sy); ctx.lineTo(ccx + sw2 / 2 + jx, sy); ctx.stroke();
      }
    }
    // one tiny sail at the horizon
    var bx = x + w * 0.78, by = y + h * 0.615;
    poly([bx, by - h * 0.075, bx, by, bx + w * 0.035, by], '#FFFFFF');
    ctx.strokeStyle = '#5E7A72'; ctx.lineWidth = Math.max(1, 1.4 * SCALE);
    ctx.beginPath(); ctx.moveTo(bx - w * 0.012, by + 2); ctx.lineTo(bx + w * 0.045, by + 2); ctx.stroke();
  }

  // ---------- scene 2: narwhal ----------
  function sceneNarwhal(g, step, x, y, w, h) {
    ctx.fillStyle = '#DCEEE8'; ctx.fillRect(x, y, w, h * 0.22);
    drawCloud(x + w * 0.24, y + h * 0.11, w * 0.05, 91, true);
    drawCloud(x + w * 0.74, y + h * 0.09, w * 0.04, 97, false);
    ctx.fillStyle = SEA; ctx.fillRect(x, y + h * 0.22, w, h * 0.3);
    ctx.fillStyle = '#5E9A90'; ctx.fillRect(x, y + h * 0.52, w, h * 0.48);
    // gull marks
    ctx.strokeStyle = 'rgba(70,90,95,0.55)'; ctx.lineWidth = Math.max(1, 1.3 * SCALE);
    for (var gI = 0; gI < 3; gI++) {
      var gx = x + w * (0.18 + 0.27 * gI), gy = y + h * (0.07 + 0.04 * rnd(gI * 7 + 2)), gs = 5 * SCALE;
      ctx.beginPath(); ctx.moveTo(gx - gs, gy);
      ctx.lineTo(gx - gs * 0.3, gy - gs * 0.55); ctx.lineTo(gx, gy);
      ctx.lineTo(gx + gs * 0.3, gy - gs * 0.55); ctx.lineTo(gx + gs, gy); ctx.stroke();
    }
    // narwhal
    var bob = [0, -0.014, -0.028][step % 3] * h;
    var cx = x + w * 0.46, wl = y + h * 0.52, rx = w * 0.17, ry = h * 0.13;
    var cy = wl + bob + ry * 0.08;
    // tail flukes
    poly([cx - rx * 0.96, cy - ry * 0.2, cx - rx * 1.28, cy - ry * 0.72, cx - rx * 1.14, cy + ry * 0.02], '#7A8BA0');
    poly([cx - rx * 0.96, cy - ry * 0.12, cx - rx * 1.3, cy + ry * 0.22, cx - rx * 1.12, cy + ry * 0.3], '#6E7F94');
    // body: true ellipse as a parametric polygon (arc() would give a circle)
    ctx.fillStyle = '#7A8BA0';
    ctx.beginPath();
    for (var bI = 0; bI <= 28; bI++) {
      var ba = bI / 28 * 6.2832;
      var bpx = cx + Math.cos(ba) * rx, bpy = cy + Math.sin(ba) * ry;
      if (bI === 0) ctx.moveTo(bpx, bpy); else ctx.lineTo(bpx, bpy);
    }
    ctx.fill();
    // tusk: tapered triangle + spiral marks
    var tx = cx + rx * 0.8, ty = cy - ry * 0.52;
    var tdx = w * 0.135, tdy = -h * 0.115;
    poly([tx, ty, tx + tdx, ty + tdy, tx + w * 0.012, ty + h * 0.02], '#EFE6CE');
    ctx.strokeStyle = 'rgba(150,125,80,0.8)'; ctx.lineWidth = Math.max(1, 1.4 * SCALE);
    for (var tI = 1; tI <= 4; tI++) {
      var f = tI / 5;
      ctx.beginPath();
      ctx.moveTo(tx + tdx * f - 2, ty + tdy * f + h * 0.012 * (1 - f));
      ctx.lineTo(tx + tdx * f + w * 0.011, ty + tdy * f + h * 0.017 * (1 - f) + 2);
      ctx.stroke();
    }
    // eye + smile hint
    disc(cx + rx * 0.55, cy - ry * 0.3, Math.max(1.6, 2.4 * SCALE), '#22303A');
    // water overlay: submerge the lower body
    ctx.fillStyle = 'rgba(127,181,165,0.38)'; ctx.fillRect(x, wl, w, y + h - wl);
    ctx.fillStyle = 'rgba(94,154,144,0.3)'; ctx.fillRect(x, wl + h * 0.1, w, y + h - wl - h * 0.1);
    // ripples at the waterline: flattened ellipse rings, expanding in steps
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(1, 1.5 * SCALE);
    for (var rI2 = 0; rI2 < 3; rI2++) {
      var rr2 = rx * (0.8 + 0.2 * ((step + rI2 * 2) % 4));
      ctx.globalAlpha = 0.5 - 0.11 * ((step + rI2 * 2) % 4);
      ctx.beginPath();
      for (var rp = 0; rp <= 24; rp++) {
        var ra = rp / 24 * 6.2832;
        var rpx = cx + Math.cos(ra) * rr2, rpy = wl + 3 + Math.sin(ra) * rr2 * 0.16;
        if (rp === 0) ctx.moveTo(rpx, rpy); else ctx.lineTo(rpx, rpy);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- scene 3: cacti blooming ----------
  function saguaro(cx, baseY, u, seed, step, idx) {
    var mw = u * 0.1, mh = u * 0.58, topY = baseY - mh;
    // main column: rect + disc cap (same green, seam invisible)
    ctx.fillStyle = '#5E8F5A';
    ctx.fillRect(cx - mw / 2, topY, mw, mh);
    disc(cx, topY, mw / 2, '#5E8F5A');
    // arms: horizontal connector + vertical capsule; returns the arm tip
    var aw = mw * 0.6;
    function arm(side, elbowY, len, rise) {
      var ax = cx + side * (mw / 2 + len);
      ctx.fillStyle = '#5E8F5A';
      ctx.fillRect(Math.min(cx + side * mw / 2, ax), elbowY - aw / 2, len, aw);
      ctx.fillRect(ax - aw / 2, elbowY - rise, aw, rise + aw / 2);
      disc(ax, elbowY - rise, aw / 2, '#5E8F5A');
      return { x: ax, y: elbowY - rise };
    }
    var tips = [{ x: cx, y: topY - mw / 2 }];
    if (idx !== 1) tips.push(arm(-1, baseY - mh * 0.45, u * 0.07, u * 0.16));
    tips.push(arm(1, baseY - mh * 0.58, u * 0.08, u * 0.13));
    // rib shade
    ctx.fillStyle = 'rgba(50,90,45,0.35)';
    ctx.fillRect(cx + mw * 0.16, topY + mw * 0.3, mw * 0.18, mh - mw * 0.3);
    // blooms: open in steps
    var openPh = [0.3, 0.7, 1, 0.7][(step >> 3) % 4];
    for (var tI = 0; tI < tips.length; tI++) {
      var tp = tips[tI], pr = (u * 0.026 * openPh + 1.2) * (tI === 0 ? 1 : 0.8);
      for (var pI = 0; pI < 5; pI++) {
        var pa = pI / 5 * 6.2832 + seed;
        disc(tp.x + Math.cos(pa) * pr * 1.45, tp.y - u * 0.012 + Math.sin(pa) * pr * 1.45, pr, tI % 2 ? WP_DEEP : WP_LIGHT);
      }
      disc(tp.x, tp.y - u * 0.012, pr * 0.55, '#F2C14E');
    }
  }
  function sceneCacti(g, step, x, y, w, h) {
    ctx.fillStyle = '#F9E8CE'; ctx.fillRect(x, y, w, h * 0.55);
    disc(x + w * 0.82, y + h * 0.16, h * 0.055, '#F2B880');
    ctx.fillStyle = '#D9A05B'; ctx.fillRect(x, y + h * 0.46, w, h * 0.09);   // mesa band
    poly([x + w * 0.04, y + h * 0.46, x + w * 0.1, y + h * 0.4, x + w * 0.3, y + h * 0.4, x + w * 0.36, y + h * 0.46], '#CE9550');
    poly([x + w * 0.62, y + h * 0.46, x + w * 0.68, y + h * 0.41, x + w * 0.88, y + h * 0.41, x + w * 0.93, y + h * 0.46], '#CE9550');
    ctx.fillStyle = '#E4C08E'; ctx.fillRect(x, y + h * 0.55, w, h * 0.45);
    ctx.fillStyle = '#D9AE76'; ctx.fillRect(x, y + h * 0.82, w, h * 0.18);
    var u = h;
    saguaro(x + w * 0.24, y + h * 0.9, u, 3.1, step, 0);
    saguaro(x + w * 0.55, y + h * 0.84, u * 0.78, 5.3, step, 1);
    saguaro(x + w * 0.8, y + h * 0.92, u * 0.9, 7.9, step, 2);
    // rocks + flowering bush
    for (var rI = 0; rI < 6; rI++) {
      blob(x + w * (0.06 + 0.16 * rI), y + h * (0.9 + 0.05 * rnd(rI * 3 + 1)), 6 * SCALE + rI, rI * 7 + 2, '#B98D5F', 0.55);
    }
    blob(x + w * 0.4, y + h * 0.93, w * 0.028, 41, '#5E8F5A', 0.7);
    for (var bI = 0; bI < 6; bI++) disc(x + w * 0.4 + (rnd(bI * 3 + 9) - 0.5) * w * 0.05, y + h * 0.93 + (rnd(bI * 5 + 4) - 0.5) * h * 0.04, 2.2 * SCALE, WP_DEEP);
  }

  // ---------- scene 4: trees swaying ----------
  function sceneTrees(g, step, x, y, w, h) {
    ctx.fillStyle = '#CFE6EF'; ctx.fillRect(x, y, w, h * 0.45);
    drawCloud(x + w * 0.3, y + h * 0.14, w * 0.045, 61, false);
    drawCloud(x + w * 0.72, y + h * 0.2, w * 0.055, 67, true);
    ctx.fillStyle = '#9CC184'; ctx.fillRect(x, y + h * 0.45, w, h * 0.3);
    ctx.fillStyle = '#8AB06F'; ctx.fillRect(x, y + h * 0.75, w, h * 0.25);
    var swayT = [-1, 0, 1, 0];
    for (var i = 0; i < 4; i++) {
      var tx = x + w * (0.16 + 0.22 * i), baseY = y + h * (0.8 + 0.05 * (i % 2));
      var th = h * (0.34 + 0.05 * rnd(i * 7 + 3));
      // trunk
      poly([tx - w * 0.012, baseY, tx + w * 0.012, baseY, tx + w * 0.006, baseY - th * 0.55, tx - w * 0.006, baseY - th * 0.55], '#8A6A4E');
      var lean = swayT[(step >> 1) % 4] * (1.5 + i * 0.7) * SCALE;
      var cyy = baseY - th * 0.78;
      blob(tx + lean, cyy, w * 0.075, i * 19 + 2, i % 2 ? '#7FB069' : '#6FA05A', 0.82);
      blob(tx + lean - w * 0.05, cyy + th * 0.08, w * 0.05, i * 19 + 8, '#5E9150', 0.8);
      blob(tx + lean + w * 0.05, cyy + th * 0.06, w * 0.052, i * 19 + 13, '#7FB069', 0.8);
    }
    // meadow flower specks
    for (var fI = 0; fI < 26; fI++) {
      disc(x + w * rnd(fI * 3.1 + 1), y + h * (0.78 + 0.19 * rnd(fI * 5.3 + 2)), 1.7 * SCALE,
           ['#FFFFFF', '#F2C14E', WP_LIGHT][fI % 3]);
    }
    // a butterfly, two dots fluttering in steps
    var bf = (step >> 1) % 8;
    var bfx = x + w * (0.3 + 0.05 * Math.sin(bf)), bfy = y + h * (0.62 + 0.03 * Math.cos(bf * 1.3));
    disc(bfx - 3 * SCALE, bfy, 2.4 * SCALE, WP_DEEP);
    disc(bfx + 3 * SCALE, bfy, 2.4 * SCALE, WP_DEEP);
  }

  // ---------- intrusions ----------
  function intrusionBush(g, step, x, y, w, h) {
    ctx.fillStyle = '#3E3A44'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#2F2B33'; ctx.fillRect(x, y + h * 0.78, w, h * 0.22);
    var bx = x + w * 0.5, by = y + h * 0.82;
    blob(bx - w * 0.1, by - h * 0.08, w * 0.09, 71, '#4E7D4C', 0.75);
    blob(bx + w * 0.09, by - h * 0.07, w * 0.085, 77, '#5E8F5A', 0.75);
    blob(bx, by - h * 0.14, w * 0.1, 83, '#557F50', 0.8);
    // flames flicker at 4 fps (step pairs)
    for (var i = 0; i < 14; i++) {
      var fx = bx + (rnd(i * 7.7 + 1) - 0.5) * w * 0.3;
      var fh = h * (0.1 + 0.13 * rnd(i * 3.3 + (step >> 1) * 13.7));
      var fw = w * 0.02 + w * 0.012 * rnd(i * 5 + 2);
      poly([fx - fw, by - h * 0.1, fx, by - h * 0.1 - fh, fx + fw, by - h * 0.1], FLAME);
      poly([fx - fw * 0.5, by - h * 0.1, fx, by - h * 0.1 - fh * 0.55, fx + fw * 0.5, by - h * 0.1], '#F2B04A');
    }
    // embers rising
    for (var eI = 0; eI < 10; eI++) {
      var ey = by - h * 0.12 - ((step * 6 + eI * 53) % (h * 0.5));
      disc(bx + (rnd(eI * 9 + 4) - 0.5) * w * 0.24 + Math.sin(eI * 3 + step * 0.3) * 4, ey, 1.8 * SCALE, '#F2B04A');
    }
  }
  function intrusionGrate(g, step, x, y, w, h) {
    ctx.fillStyle = '#55565C'; ctx.fillRect(x, y, w, h * 0.2);
    ctx.fillStyle = '#33343A'; ctx.fillRect(x, y + h * 0.2, w, h * 0.8);
    ctx.fillStyle = '#45464C'; ctx.fillRect(x, y + h * 0.2, w, h * 0.02);
    // pavement seams
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
    for (var sI = 0; sI < 4; sI++) {
      ctx.beginPath(); ctx.moveTo(x + w * (0.2 + 0.2 * sI), y + h * 0.55); ctx.lineTo(x + w * (0.16 + 0.2 * sI), y + h); ctx.stroke();
    }
    var gx = x + w * 0.5, gy = y + h * 0.66;
    // smoke blobs rise and grow
    for (var i = 7; i >= 0; i--) {
      var cyc = (step * 1.4 + i * 31) % 250;
      var sy = gy - cyc * h * 0.0021;
      var sx = gx + Math.sin(i * 2.4 + cyc * 0.03) * w * 0.03 + cyc * w * 0.0004;
      ctx.globalAlpha = clamp((1 - cyc / 250) * 0.5, 0, 0.5);
      blob(sx, sy, (9 + cyc * 0.16) * SCALE, i * 23 + 3, i % 2 ? SMOKE : '#A9ACB2', 0.78);
    }
    ctx.globalAlpha = 1;
    // the grate
    ctx.fillStyle = '#1E1E22'; ctx.fillRect(gx - w * 0.11, gy, w * 0.22, h * 0.055);
    ctx.fillStyle = '#0F0F12';
    for (var sI2 = 0; sI2 < 5; sI2++) ctx.fillRect(gx - w * 0.09 + sI2 * w * 0.04, gy + h * 0.012, w * 0.02, h * 0.032);
  }
  function intrusionVolcano(g, step, x, y, w, h) {
    ctx.fillStyle = '#7A6F6B'; ctx.fillRect(x, y, w, h * 0.5);
    ctx.fillStyle = '#665C58'; ctx.fillRect(x, y + h * 0.5, w, h * 0.5);
    // ash fall
    for (var aI = 0; aI < 30; aI++) {
      var ay = (rnd(aI * 3.7 + 1) * h + step * 2.2) % h;
      disc(x + rnd(aI * 9.1 + 2) * w, y + ay, 1.5 * SCALE, 'rgba(40,36,34,0.6)');
    }
    var cx = x + w * 0.5, baseY = y + h * 0.92, topY = y + h * 0.34, tw = w * 0.1, bw = w * 0.34;
    poly([cx - bw, baseY, cx - tw, topY, cx + tw, topY, cx + bw, baseY], '#6B5750');
    poly([cx - tw, topY, cx + tw, topY, cx + tw * 0.55, topY + h * 0.05, cx - tw * 0.55, topY + h * 0.05], '#4E3E38');
    // crater pulse at 4 fps
    var pulse = [0.75, 1, 0.88][(step >> 1) % 3];
    blob(cx, topY + h * 0.012, w * 0.045 * pulse, 99, FLAME, 0.4);
    blob(cx, topY + h * 0.012, w * 0.024 * pulse, 103, '#F2B04A', 0.4);
    // lava dribbles, lengths stepping
    for (var lI = 0; lI < 3; lI++) {
      var lx = cx + (lI - 1) * w * 0.045;
      var llen = h * (0.16 + 0.1 * ((step >> 2) + lI) % 3 * 0.5);
      poly([lx - w * 0.008, topY + h * 0.04, lx + w * 0.008, topY + h * 0.04,
            lx + w * 0.013, topY + h * 0.04 + llen, lx - w * 0.013, topY + h * 0.04 + llen], FLAME);
    }
    // smoke plume
    ctx.globalAlpha = 0.75;
    blob(cx + w * 0.03, topY - h * 0.09, w * 0.06, 111, SMOKE, 0.7);
    blob(cx + w * 0.07, topY - h * 0.16, w * 0.075, 117, '#A9ACB2', 0.7);
    ctx.globalAlpha = 1;
  }
  var SCENES = [sceneTidal, sceneClouds, sceneNarwhal, sceneCacti, sceneTrees];
  var INTRUSIONS = [intrusionBush, intrusionGrate, intrusionVolcano];
  function sceneIdxForSlot(k) {
    var n = SCENE_SEQ.length;
    return SCENE_SEQ[(((k + nudgeOffset) % n) + n) % n];
  }

  // ---------- wallpaper border (the room is the frame) ----------
  function drawBorder() {
    var B = borderW(), T = Math.max(30, B * 1.7);
    // wallpaper ground: border band only (four strips)
    ctx.fillStyle = WP_GROUND;
    ctx.fillRect(0, 0, W, B); ctx.fillRect(0, H - B, W, B);
    ctx.fillRect(0, B, B, H - 2 * B); ctx.fillRect(W - B, B, B, H - 2 * B);
    function flower(fx, fy, deep) {
      for (var p = 0; p < 5; p++) {
        var a = p / 5 * 6.2832 - 1.5708;
        disc(fx + Math.cos(a) * B * 0.21, fy + Math.sin(a) * B * 0.21, B * 0.16, deep ? WP_DEEP : WP_LIGHT);
      }
      disc(fx, fy, B * 0.11, OCHRE);
      disc(fx + B * 0.3, fy + B * 0.3, B * 0.06, SEA);
    }
    var idx = 0, xx, yy;
    for (xx = T / 2; xx < W; xx += T) { flower(xx, B / 2, idx++ % 2 === 0); flower(xx, H - B / 2, idx++ % 2 === 0); }
    for (yy = T / 2 + T; yy < H - T / 2; yy += T) { flower(B / 2, yy, idx++ % 2 === 0); flower(W - B / 2, yy, idx++ % 2 === 0); }
    ctx.strokeStyle = 'rgba(214,106,138,0.5)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(B - 2, B - 2, W - 2 * B + 4, H - 2 * B + 4);
    ctx.strokeStyle = 'rgba(214,106,138,0.35)';
    ctx.strokeRect(1, 1, W - 2, H - 2);
  }

  // ---------- phrase card ----------
  function phraseAlpha(lt) {
    if (lt < 6 || lt >= 18) return 0;
    var aIn = 1, aOut = 1;
    if (lt < 8) aIn = clamp(Math.floor((lt - 6) * 8) / 16, 0, 1);
    if (lt > 16) aOut = clamp(Math.floor((18 - lt) * 8) / 16, 0, 1);
    return Math.min(aIn, aOut);
  }
  function drawPhrase(text, alpha, iw) {
    if (alpha <= 0) return;
    var fs = clamp(Math.min(W, H) * 0.047, 18, 36);
    ctx.font = fs + 'px Georgia, "Times New Roman", serif';
    var maxW = iw - 70 * SCALE;
    // greedy word wrap, hand-set centered lines
    var words = text.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    var lh = fs * 1.32, padX = fs * 0.85, padY = fs * 0.5;
    var tw = 0;
    for (var lI = 0; lI < lines.length; lI++) tw = Math.max(tw, ctx.measureText(lines[lI]).width);
    var cw = tw + padX * 2, ch = lines.length * lh + padY * 2;
    var cx0 = W / 2 - cw / 2, cy0 = H / 2 - ch / 2;
    ctx.globalAlpha = alpha * 0.9;
    ctx.fillStyle = CARD; ctx.fillRect(cx0, cy0, cw, ch);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var lI2 = 0; lI2 < lines.length; lI2++) {
      ctx.fillText(lines[lI2], W / 2, cy0 + padY + lh * (lI2 + 0.5));
    }
    ctx.globalAlpha = 1;
  }

  // ---------- hint (interaction cue, fades out early) ----------
  function drawHint(t) {
    var a = clamp((11.5 - t) / 2.5, 0, 1);
    if (a <= 0) return;
    var fs = Math.max(10, 11.5 * SCALE);
    ctx.font = fs + 'px system-ui, sans-serif';
    var txt = 'drag to nudge the calm · double-tap to reseed';
    var tw = ctx.measureText(txt).width;
    var B = borderW();
    ctx.globalAlpha = a * 0.8;
    ctx.fillStyle = CARD;
    ctx.fillRect(W / 2 - tw / 2 - 9, H - B - fs - 16, tw + 18, fs + 9);
    ctx.globalAlpha = a * 0.75;
    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, W / 2, H - B - fs / 2 - 11.5);
    ctx.globalAlpha = 1;
  }

  // ---------- main draw ----------
  var lastT = T0;
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var B = borderW();
    var ix = B, iy = B, iw = W - 2 * B, ih = H - 2 * B;
    var step = Math.floor(t * 8);
    var k = Math.floor(t / SLOT);
    var lt = t - k * SLOT;
    var ik = intrusionType(k + 1);         // intrusion that may cut this slot's tail
    var inIntr = ik >= 0 && lt >= SLOT - 4;

    ctx.save();
    ctx.beginPath(); ctx.rect(ix, iy, iw, ih); ctx.clip();
    if (drag) ctx.translate(clamp(drag.x - drag.x0, -34, 34) * 0.4, 0);

    if (inIntr) {
      INTRUSIONS[ik](t, step, ix, iy, iw, ih);
    } else {
      var idx = sceneIdxForSlot(k);
      var fadeDur = intrusionType(k) >= 0 ? 0.75 : 1.5;
      if (lt < fadeDur && k > 0) {
        // under-layer: the intrusion just ended, or the previous scene
        if (intrusionType(k) >= 0) INTRUSIONS[intrusionType(k)](t, step, ix, iy, iw, ih);
        else SCENES[sceneIdxForSlot(k - 1)](t, step, ix, iy, iw, ih);
        var a = Math.round(clamp(lt / fadeDur, 0, 1) * 8) / 8;
        ctx.globalAlpha = a;
        SCENES[idx](t, step, ix, iy, iw, ih);
        ctx.globalAlpha = 1;
      } else {
        SCENES[idx](t, step, ix, iy, iw, ih);
      }
      drawPhrase(phraseForSlot(k), phraseAlpha(lt), iw);
    }
    ctx.restore();

    drawBorder();
    drawHint(t);
  }

  // ---------- pointer ----------
  function pieceTime() { return lastT; }
  function toLocal(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var pt = toLocal(e), t = pieceTime();
    if (t - lastTapT < 0.35) {
      // double-tap: reseed the phrase order
      phraseSeed++;
      shufflePhrases();
      lastTapT = -10;
      drag = null;
      draw(t);
      return;
    }
    lastTapT = t;
    drag = { x0: pt.x, x: pt.x };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.x = toLocal(e).x;
    draw(pieceTime());
  });
  function endPointer() {
    if (!drag) return;
    var dx = drag.x - drag.x0;
    if (dx <= -44) nudgeOffset += 1;        // swipe left: cycle forward
    else if (dx >= 44) nudgeOffset -= 1;    // swipe right: cycle back
    drag = null;
    draw(pieceTime());
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);

  // ---------- run ----------
  measure();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { measure(); draw(lastT); });
  }
  window.addEventListener('resize', function () { measure(); draw(lastT); });

  draw(T0);                                    // synchronous fixed-phase first frame
  var startStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) startStamp = stamp;
      lastT = T0 + (stamp - startStamp) / 1000;
      draw(lastT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
