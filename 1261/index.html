<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workmare Lamp</title>
<style>
  html, body { margin: 0; padding: 0; background: #1E1B16; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
"use strict";

/* ---------- seeded hash (integer, deterministic) ---------- */
function hash(n){
  var x = (n * 2654435761) >>> 0;
  x ^= x >>> 15; x = (x * 2246822519) >>> 0;
  x ^= x >>> 13; x = (x * 3266489917) >>> 0;
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}

/* ---------- palette ---------- */
var NIGHT = "#1E1B16", DESK = "#2A251E", DESK2 = "#332C21",
    GLOW = "#F5D98B", SHADE = "#E8C547", INK = "#3A332A",
    RINGB = "#6B4A2F", PAPER = "#D8D2C4", MUG = "#4A4238",
    BONE = "#F0EAD8", DIMLINE = "#57493A";

/* ---------- state: everything is a function of recorded events + t ---------- */
var dialEvents = [];   /* {t, rate} */
var tapEvents = [];    /* {t, x, y} */
var reseedEvents = []; /* {t} */
var lastTapT = -10;
var dialDrag = false;

function saltAt(t){
  var s = 0;
  for (var i = 0; i < reseedEvents.length; i++) if (reseedEvents[i].t <= t) s++;
  return s;
}
function rateAt(t){
  var r = 4;
  for (var i = 0; i < dialEvents.length; i++) if (dialEvents[i].t <= t) r = dialEvents[i].rate;
  return r;
}
/* frozen specimen index (0 mop, 1 door, 2 ring) or -1, from taps */
function frozenAt(t, boxes){
  var salt = saltAt(t), lastReseed = -1;
  for (var i = 0; i < reseedEvents.length; i++) if (reseedEvents[i].t <= t) lastReseed = reseedEvents[i].t;
  var f = -1;
  for (var j = 0; j < tapEvents.length; j++){
    var e = tapEvents[j];
    if (e.t > t || e.t <= lastReseed) continue;
    var hit = -1;
    for (var k = 0; k < boxes.length; k++){
      var b = boxes[k];
      if (e.x >= b.x - b.r && e.x <= b.x + b.r && e.y >= b.y - b.r && e.y <= b.y + b.r) { hit = k; break; }
    }
    f = hit;
  }
  return f;
}

/* ---------- canvas + sizing ---------- */
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");
var W = 0, H = 0, PHONE = false;

function resize(){
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  cv.width = W; cv.height = H;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  if (window.screen && Math.min(window.screen.width, window.screen.height) < 700) PHONE = true;
  else if (H > W * 1.15) PHONE = true; else PHONE = false;
  draw(0);
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
window.addEventListener("resize", resize);

/* ---------- draw helpers (node-canvas safe: flat shapes only) ---------- */
function line(x1, y1, x2, y2, col, w){
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function dot(x, y, r, col){
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function rect(x, y, w, h, col){
  ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
}
function wobLine(pts, col, w){
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
/* crude wobbly segment between two points, seeded */
function wig(x1, y1, x2, y2, salt, k, amp){
  var n = 4, pts = [];
  for (var i = 0; i <= n; i++){
    var f = i / n;
    var jx = (i === 0 || i === n) ? 0 : (hash(salt * 977 + k * 131 + i * 17) - 0.5) * 2 * amp;
    var jy = (i === 0 || i === n) ? 0 : (hash(salt * 613 + k * 71 + i * 29) - 0.5) * 2 * amp;
    pts.push([x1 + (x2 - x1) * f + jx, y1 + (y2 - y1) * f + jy]);
  }
  return pts;
}

/* ---------- creatures (crude, hand-drawn, stop-motion poses) ---------- */
function drawMop(x, y, s, pose, salt){
  var tilt = [-0.16, 0, 0.16, 0][pose];
  var spread = [-1, 0, 1, 0][pose];
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * 0.4);
  /* legs */
  line(-4 * s, 0, (-4 + spread * 4) * s, 26 * s, INK, 2.5 * s);
  line(4 * s, 0, (4 - spread * 4) * s, 26 * s, INK, 2.5 * s);
  dot((-4 + spread * 4) * s, 28 * s, 3 * s, INK);
  dot((4 - spread * 4) * s, 28 * s, 3 * s, INK);
  /* body: stick + mop head strands */
  line(0, -34 * s, 0, 2 * s, INK, 3 * s);
  for (var i = -3; i <= 3; i++){
    var ex = i * 5 * s + (hash(salt * 31 + i * 7) - 0.5) * 4 * s;
    wobLine(wig(i * 3 * s, -34 * s, ex, -46 * s, salt, i + 10, 2 * s), INK, 2 * s);
  }
  ctx.restore();
}
function drawDoor(x, y, s, pose, salt){
  var eye = [1, 1.6, 0.4, 1][pose];
  var mouth = [0, 1, 2, 0][pose];
  var wob = (hash(salt * 41 + pose * 13) - 0.5) * 3 * s;
  ctx.save(); ctx.translate(x, y + wob);
  rect(-16 * s, -26 * s, 32 * s, 52 * s, INK);
  rect(-13 * s, -23 * s, 26 * s, 46 * s, "#2E2820");
  dot(-7 * s, -8 * s, 3.2 * s * eye, BONE);
  dot(7 * s, -8 * s, 3.2 * s * eye, BONE);
  dot(-7 * s, -8 * s, 1.4 * s, NIGHT);
  dot(7 * s, -8 * s, 1.4 * s, NIGHT);
  if (mouth === 0) line(-6 * s, 10 * s, 6 * s, 10 * s, BONE, 2 * s);
  else if (mouth === 1) { ctx.strokeStyle = BONE; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(-7 * s, 8 * s); ctx.quadraticCurveTo(0, 16 * s, 7 * s, 8 * s); ctx.stroke(); }
  else dot(0, 11 * s, 3.5 * s, BONE);
  dot(12 * s, 2 * s, 2.5 * s, GLOW); /* knob */
  ctx.restore();
}
function drawRing(x, y, s, pose, salt){
  var r = 20 * s;
  ctx.strokeStyle = RINGB; ctx.lineWidth = 4.5 * s; ctx.lineCap = "round";
  for (var i = 0; i < 12; i++){
    var a0 = i * Math.PI / 6, a1 = (i + 1) * Math.PI / 6;
    var rr = r + (hash(salt * 53 + pose * 19 + i * 3) - 0.5) * 6 * s;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a0) * rr, y + Math.sin(a0) * rr);
    ctx.arc(x, y, rr, a0, a1);
    ctx.stroke();
  }
  /* splatter dots */
  for (var j = 0; j < 5; j++){
    var a = hash(salt * 77 + pose * 23 + j * 11) * 6.283;
    var d = r + 6 * s + hash(salt * 91 + j * 5) * 10 * s;
    dot(x + Math.cos(a) * d, y + Math.sin(a) * d, (1.5 + hash(salt + j) * 2) * s, RINGB);
  }
}

/* ---------- layout + frame ---------- */
function scale(){
  return PHONE ? W / 760 : Math.min(W / 1280, H / 900);
}
function draw(t){
  var s = scale();
  if (s <= 0) s = 1;
  var deskTop = H * 0.60;
  var salt = saltAt(t);
  var rate = rateAt(t);
  var eff = Math.min(rate, 8);              /* visible flicker clamped */
  var phase = (t * eff) % 1;
  var on = phase < 0.5;
  var flash = Math.floor(t * eff);
  var pose = (eff >= 7.5) ? 1 : ((flash % 4) + 4) % 4;  /* too fast: frozen mid-pose */
  var creatureAlpha = on ? (eff < 2 ? 0.6 : 1) : (eff < 2 ? 0 : 0.18);

  /* background: constant, never flashes */
  rect(0, 0, W, H, NIGHT);
  /* desk */
  rect(0, deskTop, W, H - deskTop, DESK);
  rect(0, deskTop, W, 3, DESK2);
  /* papers + pen on the desk */
  rect(W * 0.06, deskTop + 26 * s, 120 * s, 84 * s, PAPER);
  rect(W * 0.06 + 10 * s, deskTop + 40 * s, 100 * s, 3, DIMLINE);
  rect(W * 0.06 + 10 * s, deskTop + 56 * s, 80 * s, 3, DIMLINE);
  line(W * 0.20, deskTop + 130 * s, W * 0.20 + 60 * s, deskTop + 122 * s, INK, 3 * s);

  /* lamp: mug base, binder-clip arm, sticky-note shade */
  var mx = W * 0.30, my = deskTop;
  rect(mx - 26 * s, my - 34 * s, 52 * s, 34 * s, MUG);
  ctx.strokeStyle = MUG; ctx.lineWidth = 3 * s;
  ctx.beginPath(); ctx.moveTo(mx - 26 * s, my - 26 * s); ctx.arc(mx - 26 * s, my - 17 * s, 9 * s, Math.PI / 2, Math.PI * 1.5, true); ctx.stroke();
  var jx = mx + 4 * s, jy = my - 34 * s;
  var sx = mx + 118 * s, sy = my - 190 * s;
  line(jx, jy, (jx + sx) / 2, (jy + sy) / 2 - 14 * s, INK, 5 * s);
  line((jx + sx) / 2, (jy + sy) / 2 - 14 * s, sx, sy, INK, 5 * s);
  rect((jx + sx) / 2 - 10 * s, (jy + sy) / 2 - 24 * s, 20 * s, 12 * s, "#6E675C"); /* binder clip */
  rect(sx - 34 * s, sy - 30 * s, 68 * s, 60 * s, SHADE); /* sticky-note shade */
  line(sx - 34 * s, sy + 30 * s, sx + 34 * s, sy + 30 * s, "#C9A83E", 2 * s);
  if (on) dot(sx, sy + 34 * s, 5 * s, GLOW); /* bulb */

  /* glow disc: gated by the strobe, never the full frame */
  var gx = sx, gy = deskTop + 10 * s, gr = 210 * s;
  ctx.fillStyle = on ? "rgba(245,217,139,0.20)" : "rgba(245,217,139,0.04)";
  ctx.beginPath(); ctx.moveTo(gx + gr, gy); ctx.arc(gx, gy, gr, 0, 7); ctx.fill();
  ctx.fillStyle = on ? "rgba(245,217,139,0.12)" : "rgba(245,217,139,0.02)";
  ctx.beginPath(); ctx.moveTo(gx + gr * 0.6, gy); ctx.arc(gx, gy, gr * 0.6, 0, 7); ctx.fill();

  /* creatures on the desk, stop-motion steps per flash */
  var boxes = [];
  var mopPath = W * 0.55, mopLen = W * 0.32;
  var mopX = mopPath + ((flash * 8 * s) % mopLen);
  var mopY = deskTop + 60 * s;
  var doorPath = W * 0.88, doorLen = W * 0.30;
  var doorX = doorPath - ((flash * 5 * s) % doorLen);
  var doorY = deskTop + 120 * s;
  var ringX = W * 0.50 + ((flash * 2 * s) % 40) - 20;
  var ringY = deskTop + 170 * s;
  boxes.push({x: mopX, y: mopY, r: 82 * s});
  boxes.push({x: doorX, y: doorY, r: 79 * s});
  boxes.push({x: ringX, y: ringY, r: 72 * s});

  ctx.save();
  ctx.globalAlpha = creatureAlpha;
  drawMop(mopX, mopY, s * 1.8, pose, salt);
  drawDoor(doorX, doorY, s * 1.8, pose, salt);
  drawRing(ringX, ringY, s * 1.8, pose, salt);
  ctx.restore();

  /* strobe dial, bottom right on the desk */
  var dx = W * 0.88, dy = deskTop + 200 * s, dr = Math.max(30 * s, 26);
  ctx.fillStyle = "#171410";
  ctx.beginPath(); ctx.moveTo(dx + dr, dy); ctx.arc(dx, dy, dr, 0, 7); ctx.fill();
  ctx.strokeStyle = DIMLINE; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(dx + dr, dy); ctx.arc(dx, dy, dr, 0, 7); ctx.stroke();
  for (var ti = 0; ti < 12; ti++){
    var a = (-135 + ti * (270 / 11)) * Math.PI / 180;
    line(dx + Math.cos(a) * (dr - 8), dy + Math.sin(a) * (dr - 8),
         dx + Math.cos(a) * dr, dy + Math.sin(a) * dr, DIMLINE, 2);
  }
  var na = (-135 + (rate - 1) * (270 / 11)) * Math.PI / 180;
  line(dx, dy, dx + Math.cos(na) * (dr - 12), dy + Math.sin(na) * (dr - 12), GLOW, 3);
  dot(dx, dy, 4, GLOW);

  /* specimen view: tap a creature to freeze it, labelled */
  var f = frozenAt(t, boxes);
  if (f >= 0){
    ctx.fillStyle = "rgba(10,8,6,0.72)";
    ctx.fillRect(0, 0, W, H);
    var bw = Math.min(W * 0.7, 420 * s), bh = bw * 0.72;
    var bx = (W - bw) / 2, by = (H - bh) / 2;
    rect(bx, by, bw, bh, "#241F19");
    ctx.strokeStyle = GLOW; ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    var cs = s * 3.2;
    if (f === 0) drawMop(bx + bw / 2, by + bh * 0.52, cs, 1, salt);
    else if (f === 1) drawDoor(bx + bw / 2, by + bh * 0.52, cs, 1, salt);
    else drawRing(bx + bw / 2, by + bh * 0.52, cs, 1, salt);
    ctx.fillStyle = BONE;
    ctx.font = Math.round(17 * s) + "px Georgia, serif";
    ctx.textAlign = "center";
    ctx.fillText("desk anxiety no." + (f + 1), bx + bw / 2, by + bh - 18 * s);
    ctx.textAlign = "left";
  }
}

/* ---------- pointer: drag the dial, tap a creature, double-tap reseeds ---------- */
function pos(e){
  var r = cv.getBoundingClientRect ? cv.getBoundingClientRect() : {left: 0, top: 0};
  return {x: (e.clientX !== undefined ? e.clientX : e.offsetX) - r.left,
          y: (e.clientY !== undefined ? e.clientY : e.offsetY) - r.top};
}
function nowT(){
  if (typeof performance !== "undefined" && performance.now) return (performance.now() - T0) / 1000;
  return 0;
}
var T0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
var downPos = null, downT = 0;

cv.addEventListener("pointerdown", function(e){
  var p = pos(e), t = nowT();
  downPos = p; downT = t;
  var deskTop = H * 0.60;
  var dx = W * 0.88, dy = deskTop + 200 * scale();
  var ddx = p.x - dx, ddy = p.y - dy;
  if (ddx * ddx + ddy * ddy < 60 * 60) dialDrag = true;
});
cv.addEventListener("pointermove", function(e){
  if (!dialDrag) return;
  var p = pos(e), t = nowT();
  var deskTop = H * 0.60;
  var dx = W * 0.88, dy = deskTop + 200 * scale();
  var a = Math.atan2(p.y - dy, p.x - dx) * 180 / Math.PI;
  if (a < -135) a = -135; if (a > 135) a = 135;
  var rate = 1 + Math.round((a + 135) / 270 * 11);
  dialEvents.push({t: t, rate: rate});
  draw(t);
});
function endPointer(e){
  var p = pos(e), t = nowT();
  dialDrag = false;
  if (!downPos) return;
  var moved = Math.abs(p.x - downPos.x) + Math.abs(p.y - downPos.y);
  if (moved < 12){
    if (t - lastTapT < 0.4){
      reseedEvents.push({t: t});
      lastTapT = -10;
    } else {
      tapEvents.push({t: t, x: p.x, y: p.y});
      lastTapT = t;
    }
  }
  downPos = null;
  draw(t);
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", function(){ dialDrag = false; downPos = null; });

/* ---------- loop: frame one is synchronous at t = 0 ---------- */
function tick(){
  draw(nowT());
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(tick);
}
resize();
if (typeof requestAnimationFrame === "function") requestAnimationFrame(tick);
})();
</script>
</body>
</html>
