<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Belleville Metro</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#EDEAE2; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  function RNG(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var TILE = '#EDEAE2', TERRA = '#B46A4A', GREEN = '#3E7C3F', GREEN2 = '#6AA86A';
  var WICKER = '#C89B5E', FLOOR = '#6E6A66', NAVY = '#2A3A6A';
  var PHASE0 = 1.5;

  // Fixed authored tables, index 0 at load. Tap cycles all three together.
  var SIGNS = ['BELLEVILLE', 'IL FAIT BON', 'JARDIN', 'LECTURE'];
  var MURAL_KINDS = ['sun', 'arches', 'waves', 'diamonds'];
  var LAYOUTS = [
    { books: [6, 5], baskets: [4, 3] },
    { books: [4, 7], baskets: [3, 5] },
    { books: [7, 4], baskets: [5, 3] },
    { books: [5, 6], baskets: [3, 4] }
  ];
  var stationIndex = 0;

  // Hanging plant strands: fixed start points, sway phases, leaf counts.
  var strands = [];
  (function () {
    var r = RNG(451001);
    for (var side = 0; side < 2; side++) {
      for (var i = 0; i < 7; i++) {
        strands.push({
          side: side, fx: 0.02 + i * 0.022 + r() * 0.01,
          len: 0.10 + r() * 0.10, ph: r() * Math.PI * 2, leaves: 4 + Math.floor(r() * 3)
        });
      }
    }
  })();
  var BOOK_COLORS = ['#B5584A', '#2A3A6A', '#3E7C3F', '#C8A040', '#8A6F5C', '#D86A78', '#E07840'];

  function drawStrand(s, t) {
    var x0 = s.side === 0 ? s.fx * W : W - s.fx * W;
    var sway = Math.sin(t * 0.9 + s.ph) * W * 0.008;
    var len = s.len * H;
    ctx.strokeStyle = GREEN; ctx.lineWidth = Math.max(1.5, W * 0.002); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x0, 0);
    ctx.bezierCurveTo(x0 + sway * 0.4, len * 0.4, x0 + sway, len * 0.7, x0 + sway * 1.4, len);
    ctx.stroke();
    for (var l = 0; l < s.leaves; l++) {
      var f = (l + 1) / (s.leaves + 1);
      var lx = x0 + sway * 1.4 * f, ly = len * f;
      ctx.fillStyle = (l % 2 === 0) ? GREEN : GREEN2;
      ctx.beginPath(); ctx.ellipse(lx, ly, W * 0.006 + 1.5, H * 0.008 + 1.5, 0.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawMural(cx, cy, mw, mh, kind) {
    var g = ctx.createLinearGradient(cx, cy, cx, cy + mh);
    g.addColorStop(0, '#E07840'); g.addColorStop(1, '#D86A78');
    ctx.fillStyle = g;
    ctx.fillRect(cx, cy, mw, mh);
    ctx.fillStyle = 'rgba(237,234,226,0.9)';
    if (kind === 'sun') {
      ctx.beginPath(); ctx.arc(cx + mw / 2, cy + mh * 0.62, mw * 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(237,234,226,0.9)'; ctx.lineWidth = 2;
      for (var i = 0; i < 5; i++) {
        ctx.beginPath(); ctx.arc(cx + mw / 2, cy + mh * 0.62, mw * (0.26 + i * 0.07), Math.PI, Math.PI * 2); ctx.stroke();
      }
    } else if (kind === 'arches') {
      for (var a = 0; a < 3; a++) {
        ctx.beginPath(); ctx.arc(cx + mw * (0.22 + a * 0.28), cy + mh, mw * 0.12, Math.PI, 0); ctx.stroke();
      }
    } else if (kind === 'waves') {
      ctx.strokeStyle = 'rgba(237,234,226,0.9)'; ctx.lineWidth = 3;
      for (var wv = 0; wv < 3; wv++) {
        ctx.beginPath();
        ctx.moveTo(cx, cy + mh * (0.3 + wv * 0.22));
        for (var x = 0; x <= mw; x += mw / 8) {
          ctx.lineTo(cx + x, cy + mh * (0.3 + wv * 0.22) + Math.sin(x / mw * Math.PI * 4) * mh * 0.06);
        }
        ctx.stroke();
      }
    } else {
      for (var r0 = 0; r0 < 2; r0++) {
        for (var c0 = 0; c0 < 3; c0++) {
          var dx = cx + mw * (0.2 + c0 * 0.3), dy = cy + mh * (0.3 + r0 * 0.4);
          ctx.beginPath();
          ctx.moveTo(dx, dy - mh * 0.10); ctx.lineTo(dx + mw * 0.10, dy);
          ctx.lineTo(dx, dy + mh * 0.10); ctx.lineTo(dx - mw * 0.10, dy);
          ctx.closePath(); ctx.fill();
        }
      }
    }
  }

  function drawFigure(x, y, s, t, ph, role) {
    ctx.fillStyle = '#3A2E24';
    ctx.beginPath(); ctx.arc(x, y - s * 0.42, s * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3A2E24'; ctx.lineWidth = Math.max(1.5, s * 0.05); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y - s * 0.32); ctx.lineTo(x, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - s * 0.08, y + s * 0.34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s * 0.08, y + s * 0.34); ctx.stroke();
    if (role === 'read') {
      ctx.fillStyle = '#B5584A';
      ctx.fillRect(x - s * 0.05, y - s * 0.18, s * 0.30, s * 0.20);
    } else if (role === 'water') {
      ctx.strokeStyle = '#2A3A6A'; ctx.lineWidth = Math.max(1.5, s * 0.04);
      ctx.beginPath(); ctx.moveTo(x + s * 0.1, y - s * 0.2); ctx.lineTo(x + s * 0.38, y - s * 0.05); ctx.stroke();
      ctx.fillStyle = 'rgba(120,170,200,0.8)';
      for (var d = 0; d < 3; d++) {
        ctx.beginPath(); ctx.arc(x + s * (0.42 + d * 0.08), y + s * (0.08 + d * 0.06), 2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var lay = LAYOUTS[stationIndex];
    var sign = SIGNS[stationIndex];
    var mural = MURAL_KINDS[stationIndex];

    // vault: tiled wall with a curved ceiling line
    ctx.fillStyle = TILE;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#E2DED2';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.30);
    ctx.quadraticCurveTo(W * 0.5, -H * 0.10, W, H * 0.30);
    ctx.lineTo(W, 0); ctx.lineTo(0, 0);
    ctx.closePath(); ctx.fill();
    // tile joints on the wall
    ctx.strokeStyle = 'rgba(110,106,102,0.25)'; ctx.lineWidth = 1;
    for (var gx = 0; gx < W; gx += W / 16) {
      ctx.beginPath(); ctx.moveTo(gx, H * 0.30); ctx.lineTo(gx, H * 0.80); ctx.stroke();
    }
    for (var gy = H * 0.30; gy < H * 0.80; gy += H * 0.07) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }
    // hanging plant cascades from the top corners
    for (var s = 0; s < strands.length; s++) drawStrand(strands[s], t);

    // station sign, centered on the back wall
    var sw = Math.min(W * 0.52, 560), sh = Math.max(28, H * 0.085);
    var sx = (W - sw) / 2, sy = H * 0.36;
    ctx.fillStyle = NAVY;
    ctx.fillRect(sx, sy, sw, sh);
    ctx.fillStyle = '#EDEAE2';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var fs = Math.min(sh * 0.52, sw / (sign.length * 0.72));
    ctx.font = '700 ' + fs + 'px Arial, sans-serif';
    ctx.fillText(sign, W / 2, sy + sh / 2 + 1);

    // mural panels flanking the sign
    var mw = Math.min(W * 0.16, 200), mh = H * 0.20;
    drawMural(W * 0.045, H * 0.38, mw, mh, mural);
    drawMural(W - W * 0.045 - mw, H * 0.38, mw, mh, mural);

    // terracotta passive-cooling sculpture, center
    var cx = W / 2, cy = H * 0.62;
    ctx.fillStyle = TERRA;
    ctx.beginPath(); ctx.ellipse(cx, cy, W * 0.05, H * 0.10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - W * 0.045, cy + H * 0.04, W * 0.035, H * 0.07, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + W * 0.045, cy + H * 0.04, W * 0.035, H * 0.07, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#EDEAE2';
    for (var h0 = 0; h0 < 3; h0++) {
      ctx.beginPath(); ctx.arc(cx, cy - H * 0.05 + h0 * H * 0.045, W * 0.012, 0, Math.PI * 2); ctx.fill();
    }

    // wooden shelves of free books, left (below the mural panels)
    var shx = W * 0.06, shy = H * 0.64;
    ctx.fillStyle = '#8A6F5C';
    ctx.fillRect(shx, shy, W * 0.16, H * 0.012);
    ctx.fillRect(shx, shy + H * 0.09, W * 0.16, H * 0.012);
    for (var bi = 0; bi < lay.books[0]; bi++) {
      ctx.fillStyle = BOOK_COLORS[bi % BOOK_COLORS.length];
      ctx.fillRect(shx + 4 + bi * (W * 0.16 - 8) / lay.books[0], shy - H * 0.055, (W * 0.16 - 16) / lay.books[0] - 2, H * 0.055);
    }
    for (var bj = 0; bj < lay.books[1]; bj++) {
      ctx.fillStyle = BOOK_COLORS[(bj + 3) % BOOK_COLORS.length];
      ctx.fillRect(shx + 4 + bj * (W * 0.16 - 8) / lay.books[1], shy + H * 0.09 - H * 0.05, (W * 0.16 - 16) / lay.books[1] - 2, H * 0.05);
    }
    // baskets of produce, right (below the mural panels)
    var bkx = W * 0.80;
    for (var bk = 0; bk < 2; bk++) {
      var byy = H * 0.64 + bk * H * 0.10;
      ctx.fillStyle = WICKER;
      ctx.beginPath(); ctx.ellipse(bkx + W * 0.05, byy, W * 0.055, H * 0.028, 0, 0, Math.PI * 2); ctx.fill();
      var nb = lay.baskets[bk];
      for (var pi = 0; pi < nb; pi++) {
        ctx.fillStyle = (pi % 2 === 0) ? '#E07840' : '#6AA86A';
        ctx.beginPath(); ctx.arc(bkx + W * (0.02 + pi * 0.022), byy - H * 0.012, W * 0.010, 0, Math.PI * 2); ctx.fill();
      }
    }

    // floor strip, bottom 20%, with a track hint at the very bottom edge
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, H * 0.80, W, H * 0.20);
    ctx.fillStyle = '#4A4642';
    ctx.fillRect(0, H * 0.965, W, H * 0.035);
    ctx.strokeStyle = 'rgba(237,234,226,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, H * 0.965); ctx.lineTo(W, H * 0.965); ctx.stroke();

    // small figures: reader, walker, waterer
    var fs2 = Math.max(44, H * 0.075);
    drawFigure(W * 0.30, H * 0.88, fs2, t, 0, 'read');
    var walkX = ((t * 0.03) % 1.2 - 0.1) * W;
    drawFigure(walkX, H * 0.88, fs2, t, 1, 'walk');
    drawFigure(W * 0.68, H * 0.88, fs2, t, 2, 'water');
  }

  var downX = 0, downY = 0, moved = false;
  canvas.addEventListener('pointerdown', function (e) {
    downX = e.clientX; downY = e.clientY; moved = false;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 6) moved = true;
  });
  canvas.addEventListener('pointerup', function () {
    if (!moved) stationIndex = (stationIndex + 1) % 4;
  });
  canvas.addEventListener('pointercancel', function () { moved = false; });

  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    var loop = function (now) {
      draw(PHASE0 + (now - start) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
