<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tent for Close Readings</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #3A2A20; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;

  // Seeded PRNG (mulberry32). No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Palette
  var MADDER = '#A63A2A', INDIGO = '#1E3A5F', CREAM = '#EFE3C8',
      GOLD = '#C9A44A', SEAM = '#3A2A20', LIGHT = '#F5EBD3',
      DARKINDIGO = '#142A45', INDIGO2 = '#2C527A';

  // Panel styles: 6 panels radiating from an implied apex above the top edge.
  // Angles are computed in build() so the outer rays pass through the top corners
  // and the cloth covers the whole frame at any aspect. Center panels carry the
  // strongest motif; side panels fade toward the edges.
  var PANELS = [
    { dye: INDIGO,  motif: INDIGO2, fade: 0.55, bead: false },
    { dye: MADDER,  motif: '#7E2A1F', fade: 0.75, bead: true },
    { dye: INDIGO,  motif: CREAM,  fade: 0.95, bead: true },
    { dye: CREAM,   motif: INDIGO, fade: 1.00, bead: true },
    { dye: MADDER,  motif: '#7E2A1F', fade: 0.75, bead: false },
    { dye: INDIGO,  motif: INDIGO2, fade: 0.55, bead: true }
  ];

  // Per-panel seeded motif marks, generated once per geometry build.
  var marks = []; // marks[i] = array of {x, y, kind, s, rot, col}
  var apex = { x: 0, y: 0 };
  var R = 0;

  function build() {
    apex.x = W * 0.5;
    apex.y = -H * 0.12;
    // Outer rays through the top corners: the wedge then widens downward and
    // covers every frame point (no outside visible anywhere).
    var aMin = Math.atan2(-W * 0.5, H * 0.12);
    var aMax = Math.atan2(W * 0.5, H * 0.12);
    for (var e = 0; e <= PANELS.length; e++) {
      var ae = aMin + (aMax - aMin) * (e / PANELS.length);
      if (e < PANELS.length) PANELS[e].a0 = ae;
      if (e > 0) PANELS[e - 1].a1 = ae;
    }
    R = Math.sqrt((W * 0.5) * (W * 0.5) + (H * 1.12) * (H * 1.12)) * 1.05;
    marks = [];
    for (var i = 0; i < PANELS.length; i++) {
      var p = PANELS[i];
      var rnd = mulberry32(1295 * 100 + i * 17 + 3);
      var arr = [];
      var count = (i === 2 || i === 3) ? 46 : 26;
      for (var k = 0; k < count; k++) {
        var t = rnd(); // 0..1 down the panel
        var u = rnd(); // 0..1 across the panel
        var ang = p.a0 + (p.a1 - p.a0) * u;
        var dist = R * (0.18 + 0.80 * t);
        var x = apex.x + Math.sin(ang) * dist;
        var y = apex.y + Math.cos(ang) * dist;
        var kind = Math.floor(rnd() * 4); // 0 diamond, 1 triangle, 2 dot, 3 ring
        arr.push({ x: x, y: y, kind: kind, s: 5 + rnd() * 13, rot: rnd() * Math.PI, col: p.motif });
      }
      marks.push(arr);
    }
  }

  function size() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.round(w); H = Math.round(h);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || (H > W * 1.15 && Math.min(W, H) < 700);
    if (typeof document !== 'undefined' && document.body) document.body.style.background = SEAM;
    build();
  }

  // Drag pan state: closed-form over recorded events and t.
  // drags: [{t, x, y}] pointer positions while dragging; release: {t} or null.
  var drags = [];
  var dragging = false;
  var releaseT = -1, releasePan = { x: 0, y: 0 };

  function panAt(t) {
    // Walk the drag record: pan eases toward each anchor, then decays to 0 after release.
    var pan = { x: 0, y: 0 };
    var prevT = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      var dt = Math.max(0, d.t - prevT);
      var k = 1 - Math.exp(-dt / 0.35);
      pan.x += (d.x - pan.x) * k;
      pan.y += (d.y - pan.y) * k;
      prevT = d.t;
    }
    if (releaseT >= 0 && t >= releaseT) {
      var rt = Math.max(0, t - releaseT);
      var dk = Math.exp(-rt / 1.2);
      return { x: releasePan.x * dk, y: releasePan.y * dk };
    }
    if (drags.length > 0) {
      // Ease from last anchor toward its target over time since last event.
      var last = drags[drags.length - 1];
      var dt2 = Math.max(0, t - last.t);
      var k2 = 1 - Math.exp(-dt2 / 0.35);
      // pan currently holds value at last event time; blend toward last anchor.
      return { x: pan.x + (last.x - pan.x) * k2, y: pan.y + (last.y - pan.y) * k2 };
    }
    return pan;
  }

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  var dragStart = null;
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragStart = pos(e);
    releaseT = -1;
    drags = [{ t: pieceT, x: 0, y: 0 }];
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = pos(e);
    var dx = Math.max(-30, Math.min(30, (p.x - dragStart.x) * 0.25));
    var dy = Math.max(-20, Math.min(20, (p.y - dragStart.y) * 0.25));
    drags.push({ t: pieceT, x: dx, y: dy });
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!dragging) return;
    dragging = false;
    releasePan = panAt(pieceT);
    releaseT = pieceT;
  });
  canvas.addEventListener('pointercancel', function () {
    if (!dragging) return;
    dragging = false;
    releasePan = panAt(pieceT);
    releaseT = pieceT;
  });

  function dot(x, y, r, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function panelPath(p, sway, pan, depth) {
    var ax = apex.x + pan.x * depth;
    var ay = apex.y + pan.y * depth;
    // Slight angular overlap so per-panel breeze phases never open ground gaps.
    var eps = 0.012;
    var x0 = ax + Math.sin(p.a0 + sway - eps) * R;
    var y0 = ay + Math.cos(p.a0 + sway - eps) * R;
    var x1 = ax + Math.sin(p.a1 + sway + eps) * R;
    var y1 = ay + Math.cos(p.a1 + sway + eps) * R;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.closePath();
  }

  function draw(t) {
    // Ground: seam shadow, no sky visible anywhere.
    ctx.fillStyle = SEAM;
    ctx.fillRect(0, 0, W, H);

    var pan = panAt(t);
    // Draw outermost panels first so the center overlaps them.
    var order = [0, 5, 1, 4, 2, 3];
    for (var oi = 0; oi < order.length; oi++) {
      var i = order[oi];
      var p = PANELS[i];
      var depth = 0.4 + 0.6 * (1 - Math.abs(i - 2.5) / 2.5); // center layers pan most
      // Breeze: small angular sway for the panel edges, pixel sway for marks.
      // (A pixel value must never be added to an angle: that scrambled the fan.)
      var swayA = Math.sin(t * (Math.PI * 2 / 14) + i * 1.1) * 0.008;
      var swayP = Math.sin(t * (Math.PI * 2 / 14) + i * 1.1) * (W * 0.006);
      var px = pan.x * depth, py = pan.y * depth;

      // Panel cloth
      ctx.save();
      panelPath(p, swayA, pan, depth);
      ctx.fillStyle = p.dye;
      ctx.globalAlpha = 0.35 + 0.65 * p.fade;
      ctx.fill();
      ctx.globalAlpha = 1;
      // Motif marks clipped to the panel
      ctx.clip();
      var arr = marks[i];
      for (var k = 0; k < arr.length; k++) {
        var m = arr[k];
        var mx = m.x + px + swayP * (0.5 + (m.y / H));
        var my = m.y + py;
        ctx.fillStyle = m.col;
        ctx.globalAlpha = 0.85 * p.fade;
        if (m.kind === 0) {
          // diamond
          ctx.beginPath();
          ctx.moveTo(mx, my - m.s);
          ctx.lineTo(mx + m.s * 0.7, my);
          ctx.lineTo(mx, my + m.s);
          ctx.lineTo(mx - m.s * 0.7, my);
          ctx.closePath();
          ctx.fill();
        } else if (m.kind === 1) {
          // triangle
          ctx.save();
          ctx.translate(mx, my);
          ctx.rotate(m.rot);
          ctx.beginPath();
          ctx.moveTo(0, -m.s);
          ctx.lineTo(m.s * 0.85, m.s * 0.7);
          ctx.lineTo(-m.s * 0.85, m.s * 0.7);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        } else if (m.kind === 2) {
          dot(mx, my, m.s * 0.35, m.col);
        } else {
          // ring
          ctx.strokeStyle = m.col;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(mx + m.s * 0.6, my);
          ctx.arc(mx, my, m.s * 0.6, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
      // Light wash through the cloth, slow long cycle, per-panel phase.
      var la = 0.05 + 0.05 * Math.sin(t * (Math.PI * 2 / 22) + i * 0.9);
      ctx.fillStyle = LIGHT;
      ctx.globalAlpha = Math.max(0, la) * p.fade;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      ctx.restore();

      // Seam: dashed stitch lines along both radial edges.
      ctx.save();
      ctx.strokeStyle = SEAM;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([7, 6]);
      ctx.globalAlpha = 0.85;
      var ax = apex.x + pan.x * depth, ay = apex.y + pan.y * depth;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax + Math.sin(p.a0 + swayA) * R, ay + Math.cos(p.a0 + swayA) * R);
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax + Math.sin(p.a1 + swayA) * R, ay + Math.cos(p.a1 + swayA) * R);
      ctx.stroke();
      ctx.setLineDash([]);
      // Beading rows: gold dots along one edge on beaded panels.
      if (p.bead) {
        for (var b = 0; b < 9; b++) {
          var bt = 0.25 + 0.7 * (b / 8);
          var bx = ax + Math.sin(p.a0 + swayA) * R * bt;
          var by = ay + Math.cos(p.a0 + swayA) * R * bt;
          dot(bx, by, 2.2, GOLD);
        }
      }
      ctx.restore();
    }

  }

  // Clock: boot flag pins frame one to exactly t = 0.
  var pieceT = 0;
  var started = false;
  var T0 = 0;
  function loop(ts) {
    if (!started) { started = true; T0 = ts; }
    pieceT = (ts - T0) / 1000;
    draw(pieceT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }

  function onResize() {
    size();
    draw(started ? pieceT : 0);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
  window.addEventListener('resize', onResize);

  size();
  draw(0); // synchronous first frame at exactly t = 0
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
