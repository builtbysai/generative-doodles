<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№871 Chrome-Forward</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d1b2e; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №871 Chrome-Forward, SOA1 / PP1271, study #264 sheldon-omar-abba.
  // An automobile framed like a portrait sitter. Head-on, low,
  // chrome-forward, patient. The car is the face; the people are
  // accessories: a hand on a door handle at the left edge, a
  // shoulder passing at the right edge, neither ever entering
  // the center. Night dusk blues, chrome whites, one saturated
  // paint color (deep red) for the session. Film grain is present
  // but never the subject. Almost no motion: a slow settle, like
  // the subject relaxing for the camera. Watch-only; the patience
  // is the system, and hurrying it would make it a car ad.
  // Visual-only: no WebAudio, no autoplay audio, per the Franke rule.
  var GROUND = '#0d1b2e'; // page ground, night dusk blue

  // Fixed-phase first frame: FIRST_T = 0 s into a 60 s cycle.
  // The settle is a closed-form sine: the car sinks 4 px by
  // mid-cycle and returns to its first-frame height at the seam,
  // the headlight glow breathes on the same 60 s clock, the
  // shoulder passes the right edge once per cycle and is gone
  // again by the seam, and the grain shimmer shares the period.
  // Nothing changes faster than the 60 s cycle, far below the
  // 14 Hz safety limit by construction. All motion is a function
  // of cycle phase, so the frame at FIRST_T + 60 equals the frame
  // at FIRST_T.
  var FIRST_T = 0;
  var CYCLE = 60;
  var SEED = 871;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipse(x, y, rx, ry) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  }
  function rrect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }

  // ---- Palette ------------------------------------------------------
  var DUSK_TOP = [13, 27, 46];
  var DUSK_MID = [29, 47, 71];
  var DUSK_LOW = [16, 26, 42];
  var STREET = [8, 13, 22];
  var PAINT = [176, 32, 40];       // the one saturated paint color
  var PAINT_HI = [214, 58, 62];
  var PAINT_LO = [110, 18, 26];
  var CHROME = [232, 236, 240];
  var CHROME_DIM = [154, 164, 174];
  var CHROME_DK = [96, 106, 118];
  var GLASS = [18, 30, 48];
  var GLASS_HI = [72, 96, 128];
  var LAMP = [255, 244, 214];      // headlight warmth
  var SKIN = [198, 148, 108];
  var COAT = [38, 44, 58];
  var WHITE = [235, 240, 245];

  // ---- Fixed film grain: seeded dots, alpha breathes on the cycle --
  var grainRng = mulberry32(SEED * 13 + 5);
  var GRAIN = [];
  var gi;
  for (gi = 0; gi < 700; gi++) {
    GRAIN.push({
      x: grainRng(), y: grainRng(),
      r: 0.4 + grainRng() * 0.9,
      ph: grainRng() * Math.PI * 2,
      base: 0.015 + grainRng() * 0.035
    });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle state: settle 0..1, glow 0..1, shoulder pass 0..1 ----
  function stateAt(t) {
    var p = (((t - FIRST_T) % CYCLE) + CYCLE) % CYCLE;
    var w = Math.PI * 2 * p / CYCLE;
    var settle = 0.5 - 0.5 * Math.cos(w);       // 0 at seam, 1 at mid-cycle
    var glow = 0.8 + 0.2 * Math.cos(w);         // full at seam, softer mid-cycle
    var pass = Math.sin(Math.PI * clamp((p - 12) / 36, 0, 1)); // 0..1..0, t=12..48
    return { p: p, settle: settle, glow: glow, pass: pass };
  }

  // ---- Dusk backdrop: gradient sky, horizon glow, dark street -----
  function drawBackdrop(st) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(DUSK_TOP));
    g.addColorStop(0.55, rgb(DUSK_MID));
    g.addColorStop(0.78, rgb(DUSK_LOW));
    g.addColorStop(1, rgb(STREET));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // Warm horizon glow behind the sitter, low and wide.
    var hg = ctx.createRadialGradient(W / 2, H * 0.62, 0, W / 2, H * 0.62, W * 0.55);
    hg.addColorStop(0, rgba([96, 84, 66], a4(0.28)));
    hg.addColorStop(0.6, rgba([96, 84, 66], a4(0.10)));
    hg.addColorStop(1, rgba([96, 84, 66], 0));
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, W, H);
    // Faint distant rooftops along the horizon, kept very quiet.
    ctx.fillStyle = rgba([10, 18, 30], a4(0.85));
    ctx.fillRect(0, H * 0.60, W * 0.16, H * 0.03);
    ctx.fillRect(W * 0.84, H * 0.585, W * 0.16, H * 0.045);
    ctx.fillRect(W * 0.02, H * 0.615, W * 0.08, H * 0.015);
    // Street line.
    ctx.fillStyle = rgba([6, 10, 18], a4(0.9));
    ctx.fillRect(0, H * 0.78, W, H * 0.22);
  }

  // ---- The sitter: one procedural vehicle, head-on, low ------------
  function drawCar(st) {
    var cx = W / 2;
    var cw = W * 0.70;
    var x0 = cx - cw / 2;
    var x1 = cx + cw / 2;
    var yTop = H * 0.235;   // roofline
    var yGlass0 = H * 0.265;
    var yGlass1 = H * 0.395;
    var yHood0 = H * 0.395;
    var yHood1 = H * 0.565;
    var yFace0 = H * 0.565; // grille / headlight band
    var yFace1 = H * 0.685;
    var yBump0 = H * 0.685;
    var yBump1 = H * 0.735;
    var yGround = H * 0.78;
    var dy = st.settle * Math.min(5, H * 0.007); // the slow settle, px down

    ctx.save();
    ctx.translate(0, dy);

    // Soft shadow and faint paint reflection on the street.
    ctx.fillStyle = rgba([0, 0, 0], a4(0.55));
    ellipse(cx, yGround + H * 0.012, cw * 0.48, H * 0.018);
    ctx.fill();
    ctx.fillStyle = rgba(PAINT, a4(0.10));
    ellipse(cx, yGround + H * 0.028, cw * 0.40, H * 0.014);
    ctx.fill();

    // Wheels: dark, low, just peeking below the body.
    var wy = yGround - H * 0.028;
    var wr = H * 0.048;
    var wx;
    for (wx = 0; wx < 2; wx++) {
      var wcx = wx === 0 ? x0 + cw * 0.13 : x1 - cw * 0.13;
      ctx.fillStyle = rgb([12, 13, 15]);
      circle(wcx, wy, wr);
      ctx.fill();
      ctx.fillStyle = rgb(CHROME_DIM);
      circle(wcx, wy, wr * 0.55);
      ctx.fill();
      ctx.fillStyle = rgb([30, 32, 36]);
      circle(wcx, wy, wr * 0.30);
      ctx.fill();
    }

    // Body: roof, hood and face in one painted shell.
    var body = ctx.createLinearGradient(0, yTop, 0, yBump1);
    body.addColorStop(0, rgb(PAINT_HI));
    body.addColorStop(0.35, rgb(PAINT));
    body.addColorStop(1, rgb(PAINT_LO));
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(cx - cw * 0.315, yTop);
    ctx.lineTo(cx + cw * 0.315, yTop);
    ctx.quadraticCurveTo(cx + cw * 0.36, yTop + H * 0.02, cx + cw * 0.40, yGlass1);
    ctx.lineTo(x1, yHood1);
    ctx.lineTo(x1, yFace1);
    ctx.lineTo(x0, yFace1);
    ctx.lineTo(x0, yHood1);
    ctx.lineTo(cx - cw * 0.40, yGlass1);
    ctx.quadraticCurveTo(cx - cw * 0.36, yTop + H * 0.02, cx - cw * 0.315, yTop);
    ctx.closePath();
    ctx.fill();

    // Roof highlight: a thin chrome line along the roofline.
    ctx.strokeStyle = rgba(CHROME, a4(0.85));
    ctx.lineWidth = Math.max(1, H * 0.003);
    ctx.beginPath();
    ctx.moveTo(cx - cw * 0.315, yTop + H * 0.004);
    ctx.lineTo(cx + cw * 0.315, yTop + H * 0.004);
    ctx.stroke();

    // Windshield: dark glass with one slow reflection streak.
    ctx.fillStyle = rgb(GLASS);
    ctx.beginPath();
    ctx.moveTo(cx - cw * 0.295, yGlass0);
    ctx.lineTo(cx + cw * 0.295, yGlass0);
    ctx.lineTo(cx + cw * 0.365, yGlass1);
    ctx.lineTo(cx - cw * 0.365, yGlass1);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgba(GLASS_HI, a4(0.28 + 0.10 * st.settle));
    ctx.beginPath();
    ctx.moveTo(cx - cw * 0.10, yGlass0);
    ctx.lineTo(cx - cw * 0.02, yGlass0);
    ctx.lineTo(cx + cw * 0.10, yGlass1);
    ctx.lineTo(cx + cw * 0.02, yGlass1);
    ctx.closePath();
    ctx.fill();
    // Rear-view mirror: a small dark shape hanging in the glass.
    ctx.fillStyle = rgb([10, 16, 26]);
    rrect(cx - cw * 0.045, yGlass0 + H * 0.028, cw * 0.09, H * 0.022, H * 0.008);
    ctx.fill();

    // Hood crease lines, quiet chrome.
    ctx.strokeStyle = rgba(CHROME, a4(0.35));
    ctx.lineWidth = Math.max(1, H * 0.002);
    ctx.beginPath();
    ctx.moveTo(cx - cw * 0.30, yHood0 + H * 0.01);
    ctx.lineTo(cx - cw * 0.30, yHood1 - H * 0.01);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + cw * 0.30, yHood0 + H * 0.01);
    ctx.lineTo(cx + cw * 0.30, yHood1 - H * 0.01);
    ctx.stroke();

    // Headlight glow on the dusk air, breathing with the cycle.
    var hlY = (yFace0 + yFace1) / 2;
    var hl;
    for (hl = 0; hl < 2; hl++) {
      var hcx = hl === 0 ? cx - cw * 0.265 : cx + cw * 0.265;
      var hg2 = ctx.createRadialGradient(hcx, hlY, 0, hcx, hlY, cw * 0.16);
      hg2.addColorStop(0, rgba(LAMP, a4(0.35 * st.glow)));
      hg2.addColorStop(1, rgba(LAMP, 0));
      ctx.fillStyle = hg2;
      ctx.fillRect(hcx - cw * 0.16, hlY - cw * 0.16, cw * 0.32, cw * 0.32);
    }

    // Headlights: chrome rings, warm glass, a bright core.
    for (hl = 0; hl < 2; hl++) {
      var hx = hl === 0 ? cx - cw * 0.265 : cx + cw * 0.265;
      var hw = cw * 0.115, hh = H * 0.052;
      ctx.fillStyle = rgb(CHROME);
      rrect(hx - hw / 2 - H * 0.004, hlY - hh / 2 - H * 0.004, hw + H * 0.008, hh + H * 0.008, hh * 0.5);
      ctx.fill();
      var lg = ctx.createLinearGradient(hx - hw / 2, hlY, hx + hw / 2, hlY);
      lg.addColorStop(0, rgb([255, 250, 230]));
      lg.addColorStop(0.5, rgb([240, 226, 190]));
      lg.addColorStop(1, rgb([214, 196, 150]));
      ctx.fillStyle = lg;
      rrect(hx - hw / 2, hlY - hh / 2, hw, hh, hh * 0.5);
      ctx.fill();
      ctx.fillStyle = rgba([255, 255, 244], a4(0.55 + 0.35 * st.glow));
      circle(hx - hw * 0.18, hlY - hh * 0.12, hh * 0.22);
      ctx.fill();
    }

    // Grille: chrome frame with four horizontal slats.
    var gx0 = cx - cw * 0.13, gx1 = cx + cw * 0.13;
    var gy0 = yFace0 + H * 0.008, gy1 = yFace1 - H * 0.012;
    ctx.fillStyle = rgb(CHROME_DK);
    rrect(gx0, gy0, gx1 - gx0, gy1 - gy0, H * 0.008);
    ctx.fill();
    var si;
    for (si = 0; si < 4; si++) {
      var sy = gy0 + (gy1 - gy0) * (0.18 + si * 0.21);
      ctx.fillStyle = rgb(CHROME);
      ctx.fillRect(gx0 + cw * 0.008, sy, gx1 - gx0 - cw * 0.016, Math.max(1.5, H * 0.004));
    }
    // Small round badge at the grille center.
    ctx.fillStyle = rgb(CHROME);
    circle(cx, (gy0 + gy1) / 2, H * 0.014);
    ctx.fill();
    ctx.fillStyle = rgb(PAINT);
    circle(cx, (gy0 + gy1) / 2, H * 0.008);
    ctx.fill();

    // Indicator lamps, small amber dots under the headlights.
    for (hl = 0; hl < 2; hl++) {
      var ix = hl === 0 ? cx - cw * 0.265 : cx + cw * 0.265;
      ctx.fillStyle = rgba([232, 150, 48], a4(0.85));
      rrect(ix - cw * 0.03, yFace1 - H * 0.022, cw * 0.06, H * 0.012, H * 0.006);
      ctx.fill();
    }

    // Bumper: a wide chrome bar with a dark lower valance.
    var bg = ctx.createLinearGradient(0, yBump0, 0, yBump1);
    bg.addColorStop(0, rgb(CHROME));
    bg.addColorStop(0.5, rgb(CHROME_DIM));
    bg.addColorStop(1, rgb(CHROME_DK));
    ctx.fillStyle = bg;
    rrect(x0 + cw * 0.02, yBump0, cw * 0.96, yBump1 - yBump0, H * 0.01);
    ctx.fill();
    // License plate, small and centered on the bumper.
    ctx.fillStyle = rgb([226, 228, 222]);
    rrect(cx - cw * 0.055, yBump0 + H * 0.006, cw * 0.11, H * 0.026, H * 0.004);
    ctx.fill();
    ctx.fillStyle = rgb([40, 48, 60]);
    ctx.font = '600 ' + Math.max(8, Math.round(H * 0.016)) + 'px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('871', cx, yBump0 + H * 0.019);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    // Side mirrors, small chrome ears at the glass corners.
    ctx.fillStyle = rgb(CHROME_DIM);
    rrect(x0 - cw * 0.015, yGlass1 - H * 0.02, cw * 0.035, H * 0.028, H * 0.006);
    ctx.fill();
    rrect(x1 - cw * 0.02, yGlass1 - H * 0.02, cw * 0.035, H * 0.028, H * 0.006);
    ctx.fill();

    ctx.restore();
  }

  // ---- Edge figures: never in the center ---------------------------
  // Left: a hand on a door handle, cropped by the frame edge.
  // Right: a shoulder passing, drifting in and out once per cycle.
  function drawEdgeFigures(st) {
    // Door handle: a small chrome bar at the left edge, at the
    // height of the car's face band, with a hand wrapped on it.
    // Kept large enough to read at thumb size: the handle is a
    // bright bar, the hand a clear skin shape over it.
    var hx = W * 0.052;
    var hy = H * 0.615;
    ctx.fillStyle = rgb(CHROME);
    rrect(hx - W * 0.020, hy - H * 0.008, W * 0.040, H * 0.016, H * 0.008);
    ctx.fill();
    // Sleeve, dark coat, entering from the left edge.
    ctx.fillStyle = rgb(COAT);
    ctx.beginPath();
    ctx.moveTo(0, hy - H * 0.016);
    ctx.lineTo(hx + W * 0.006, hy - H * 0.006);
    ctx.lineTo(hx + W * 0.006, hy + H * 0.036);
    ctx.lineTo(0, hy + H * 0.052);
    ctx.closePath();
    ctx.fill();
    // The hand: palm over the handle, four fingers curled under.
    ctx.fillStyle = rgb(SKIN);
    ellipse(hx, hy + H * 0.002, W * 0.020, H * 0.016);
    ctx.fill();
    var fi;
    for (fi = 0; fi < 4; fi++) {
      ctx.fillStyle = rgb(SKIN);
      circle(hx - W * 0.012 + fi * W * 0.008, hy + H * 0.018, H * 0.006);
      ctx.fill();
    }
    ctx.fillStyle = rgb([160, 112, 78]);
    circle(hx + W * 0.014, hy + H * 0.008, H * 0.006);
    ctx.fill();

    // Right: a shoulder passing. Its center stays between 0.92W
    // and 1.02W, so it never enters the center of the frame.
    var px = W * (1.02 - 0.10 * st.pass);
    var py = H * 0.62;
    var pr = H * 0.075;
    ctx.fillStyle = rgba(COAT, a4(0.92));
    ctx.beginPath();
    ctx.moveTo(px - pr * 1.5, H);
    ctx.lineTo(px - pr * 1.1, py + pr * 0.4);
    ctx.quadraticCurveTo(px, py - pr * 0.9, px + pr * 1.3, py + pr * 0.2);
    ctx.lineTo(px + pr * 1.6, H);
    ctx.closePath();
    ctx.fill();
    // Head, in profile, mostly out of frame.
    ctx.fillStyle = rgba([52, 40, 32], a4(0.95));
    circle(px + pr * 0.15, py - pr * 0.75, pr * 0.55);
    ctx.fill();
    // A faint rim of dusk light on the shoulder's edge.
    ctx.strokeStyle = rgba([140, 160, 190], a4(0.35));
    ctx.lineWidth = Math.max(1, H * 0.002);
    ctx.beginPath();
    ctx.moveTo(px - pr * 1.05, py + pr * 0.45);
    ctx.quadraticCurveTo(px - pr * 0.5, py - pr * 0.55, px + pr * 0.55, py - pr * 0.75);
    ctx.stroke();
  }

  // ---- Film grain: present, never the subject -----------------------
  function drawGrain(st) {
    var i, g, a;
    for (i = 0; i < GRAIN.length; i++) {
      g = GRAIN[i];
      a = g.base * (0.7 + 0.3 * Math.sin(Math.PI * 2 * st.p / CYCLE + g.ph));
      ctx.fillStyle = rgba(WHITE, a4(a));
      ctx.fillRect(g.x * W, g.y * H, g.r, g.r);
    }
  }

  // ---- Caption plate and hint --------------------------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(WHITE, a4(0.88));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№871 · Chrome-Forward', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(WHITE, a4(0.58));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 31', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(WHITE, a4(0.72));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch it settle.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var st = stateAt(t);
    drawBackdrop(st);
    drawCar(st);
    drawEdgeFigures(st);
    drawGrain(st);
    drawText();
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece871 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece871 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      stateAt: function (t) { return stateAt(t); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 60 s cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
