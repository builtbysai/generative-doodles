<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Through the Machine</title>
<style>
  html, body { margin: 0; padding: 0; background: #0C0A08; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var TAU = Math.PI * 2;
  var COL = {
    paper: "#0C0A08",
    edge: "#D8CFAE",
    scan: "#7FD8C8",
    bloom: "#E8A020",
    fray: "#5A6A72"
  };
  var SWEEP_DUR = 3.0;        // seconds for one autonomous scan sweep
  var UNFOLD_DUR = 0.8;       // tap-born figure unfold time
  var TAP_DELAY = 0.30;       // single tap waits this long (double-tap window)
  var MAX_FIGS = 10;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smoothstep(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, PHONE = false;

  function detectPhone(w, h) {
    var sw = 0, sh = 0;
    if (typeof window !== "undefined" && window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
    return h > w * 1.15; // aspect fallback only when screen size is unavailable
  }

  function resize() {
    var w = 0, h = 0;
    if (typeof window !== "undefined" && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if (!w || !h) {
      w = (typeof window !== "undefined" && window.innerWidth) || 300;
      h = (typeof window !== "undefined" && window.innerHeight) || 300;
    }
    W = w; H = h;
    PHONE = detectPhone(w, h);
    var dpr = 1;
    if (typeof window !== "undefined" && window.devicePixelRatio) {
      dpr = clamp(window.devicePixelRatio, 1, 2);
    }
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(nowSec());
  }

  // ---------- clock (elapsed seconds; frame one is t = 0, drawn synchronously) ----------
  var startStamp = null;
  function nowSec() {
    if (typeof performance !== "undefined" && performance && typeof performance.now === "function") {
      var n = performance.now() / 1000;
      if (startStamp === null) startStamp = n;
      return n - startStamp;
    }
    return 0;
  }

  // ---------- figure outlines (folk paper-cut silhouettes, local units) ----------
  // Single non-overlapping outline polygon per figure; holes are punched with
  // even-odd fill. y grows downward, origin at figure centre.
  var SHAPES = {
    person: {
      outline: [
        [-0.170, 0.500], [-0.155, 0.100], [-0.210, 0.020], [-0.225, -0.140],
        [-0.130, -0.200], [-0.050, -0.270], [-0.085, -0.330], [-0.095, -0.410],
        [-0.060, -0.485], [0.000, -0.500], [0.060, -0.485], [0.095, -0.410],
        [0.085, -0.330], [0.050, -0.270], [0.130, -0.200], [0.225, -0.140],
        [0.210, 0.020], [0.155, 0.100], [0.170, 0.500], [0.040, 0.500],
        [0.040, 0.350], [-0.040, 0.350], [-0.040, 0.500]
      ],
      holes: [
        { kind: "diamond", x: 0.000, y: -0.080, r: 0.050 },
        { kind: "circle", x: 0.000, y: 0.140, r: 0.032 },
        { kind: "star", x: 0.000, y: 0.265, r: 0.042 },
        { kind: "circle", x: -0.095, y: 0.400, r: 0.026 },
        { kind: "circle", x: 0.095, y: 0.400, r: 0.026 }
      ],
      halfW: 0.225
    },
    horse: {
      outline: [
        [-0.530, -0.200], [-0.460, -0.300], [-0.400, -0.400], [-0.355, -0.310],
        [-0.300, -0.280], [-0.100, -0.305], [0.150, -0.300], [0.380, -0.270],
        [0.500, -0.200], [0.550, 0.050], [0.520, 0.280], [0.440, 0.255],
        [0.405, 0.280], [0.405, 0.500], [0.335, 0.500], [0.330, 0.295],
        [0.050, 0.260], [-0.260, 0.270], [-0.260, 0.500], [-0.330, 0.500],
        [-0.330, 0.220], [-0.385, 0.020], [-0.425, -0.120], [-0.500, -0.130]
      ],
      holes: [
        { kind: "circle", x: 0.080, y: -0.020, r: 0.075 },
        { kind: "diamond", x: -0.320, y: -0.150, r: 0.035 },
        { kind: "circle", x: 0.330, y: -0.050, r: 0.040 },
        { kind: "circle", x: -0.205, y: 0.060, r: 0.030 }
      ],
      halfW: 0.550
    },
    bird: {
      outline: [
        [0.480, -0.160], [0.360, -0.260], [0.260, -0.270], [0.180, -0.380],
        [0.130, -0.200], [0.050, -0.180], [-0.080, -0.480], [-0.200, -0.200],
        [-0.300, -0.100], [-0.550, 0.020], [-0.580, 0.080], [-0.500, 0.200],
        [-0.280, 0.160], [0.000, 0.240], [0.280, 0.100], [0.380, -0.040],
        [0.440, -0.100]
      ],
      holes: [
        { kind: "circle", x: -0.060, y: -0.230, r: 0.045 },
        { kind: "diamond", x: 0.050, y: 0.020, r: 0.050 },
        { kind: "circle", x: -0.380, y: 0.080, r: 0.030 },
        { kind: "circle", x: 0.260, y: 0.000, r: 0.022 }
      ],
      halfW: 0.580
    }
  };
  var TYPE_CYCLE = ["person", "horse", "bird"];

  function holePath(hole) {
    var i, a, r;
    if (hole.kind === "circle") {
      ctx.moveTo(hole.x + hole.r, hole.y);
      ctx.arc(hole.x, hole.y, hole.r, 0, TAU);
    } else if (hole.kind === "diamond") {
      ctx.moveTo(hole.x, hole.y - hole.r);
      ctx.lineTo(hole.x + hole.r, hole.y);
      ctx.lineTo(hole.x, hole.y + hole.r);
      ctx.lineTo(hole.x - hole.r, hole.y);
      ctx.closePath();
    } else { // star, 5 points
      for (i = 0; i < 10; i++) {
        a = -Math.PI / 2 + i * Math.PI / 5;
        r = (i % 2 === 0) ? hole.r : hole.r * 0.45;
        if (i === 0) ctx.moveTo(hole.x + Math.cos(a) * r, hole.y + Math.sin(a) * r);
        else ctx.lineTo(hole.x + Math.cos(a) * r, hole.y + Math.sin(a) * r);
      }
      ctx.closePath();
    }
  }

  // ---------- world state (all visual state is a function of seeds, recorded
  // events, and t; nothing is accumulated frame to frame) ----------
  var epoch = 0;
  var epochSeed = 87132;
  var epochT0 = 0;             // piece-time at which the current epoch began
  var figures = [];            // {id,type,baseX,baseY,scale,born,wx,wy,px,py,wr,pr,seed}
  var sweepStarts = [];        // sweep start times relative to epochT0
  var nextFigId = 1;
  var spawnCounter = 0;

  function buildEpoch(seed, t0, firstSweepOffset) {
    var rng = mulberry32(seed);
    figures = [];
    var defs = [
      { type: "person", bx: 0.39, by: 0.52, sc: 1.00 },
      { type: "horse", bx: 0.70, by: 0.60, sc: 0.78 },
      { type: "bird", bx: 0.15, by: 0.30, sc: 0.55 }
    ];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      figures.push(makeFigure(d.type,
        clamp(d.bx + (rng() - 0.5) * 0.03, 0.08, 0.92),
        clamp(d.by + (rng() - 0.5) * 0.03, 0.12, 0.88),
        d.sc, t0 - 10, rng));
    }
    sweepStarts = [];
    var s = firstSweepOffset;
    while (s < 3600) {
      sweepStarts.push(s);
      s += SWEEP_DUR + 9 + rng() * 7;   // irregular 9..16 s gaps
    }
  }

  function makeFigure(type, bx, by, sc, born, rng) {
    return {
      id: nextFigId++,
      type: type, baseX: bx, baseY: by, scale: sc, born: born,
      wx: 0.045 + rng() * 0.045, wy: 0.038 + rng() * 0.040,
      px: rng() * TAU, py: rng() * TAU,
      wr: 0.05 + rng() * 0.05, pr: rng() * TAU,
      seed: Math.floor(rng() * 100000)
    };
  }

  function figPos(FIG, t) {
    var lt = t - FIG.born; if (lt < 0) lt = 0;
    return {
      x: FIG.baseX * W + Math.sin(lt * FIG.wx + FIG.px) * 0.012 * W,
      y: FIG.baseY * H + Math.sin(lt * FIG.wy + FIG.py) * 0.010 * H,
      rot: 0.03 * Math.sin(lt * FIG.wr + FIG.pr)
    };
  }
  function figSize(FIG) { return Math.min(W, H) * 0.36 * FIG.scale * (PHONE ? 0.9 : 1); }

  // ---------- scan band ----------
  // Recorded pointer drags: band follows the pointer while it is down.
  var drags = [];              // {t0, t1 (null while open), samples:[{t,x}]}
  var releaseEvents = [];      // {t, vals:{figId: s}} scan amount at release
  var pendingTap = null;       // {t, x, y} materialises at t + TAP_DELAY

  function sweepBandAt(te) {   // te = time within epoch; returns {x01, u} or null
    for (var i = sweepStarts.length - 1; i >= 0; i--) {
      var st = sweepStarts[i];
      if (te >= st && te <= st + SWEEP_DUR) {
        var u = (te - st) / SWEEP_DUR;
        return { x01: -0.05 + 1.10 * u, u: u, idx: i };
      }
      if (st > te) continue;
      break;
    }
    return null;
  }

  function bandAt(t) {
    // an open or closed drag covering t wins over the autonomous schedule
    for (var i = drags.length - 1; i >= 0; i--) {
      var d = drags[i];
      if (t >= d.t0 && (d.t1 === null || t <= d.t1)) {
        var x = d.samples[0].x;
        for (var j = 0; j < d.samples.length; j++) {
          if (d.samples[j].t <= t) x = d.samples[j].x; else break;
        }
        return { x: x, presence: 1, drag: true, idx: -1 };
      }
    }
    var sw = sweepBandAt(t - epochT0);
    if (sw) {
      var pres = smoothstep(0, 0.05, sw.u) * (1 - smoothstep(0.96, 1, sw.u));
      return { x: sw.x01 * W, presence: pres, drag: false, idx: sw.idx };
    }
    return null;
  }

  function bandHalfWidth() { return Math.max(20, W * 0.05); }

  // ---------- scan amount per figure (closed form) ----------
  function scanAmount(FIG, t, band) {
    var s = 0, i, u;
    // autonomous sweep pulses: band centre crosses the figure base x at tc
    var te = t - epochT0;
    var crossFrac = (FIG.baseX + 0.05) / 1.10;
    for (i = 0; i < sweepStarts.length; i++) {
      var tc = sweepStarts[i] + SWEEP_DUR * crossFrac;
      if (tc < te - 1.3) continue;
      if (tc > te + 1.3) break;
      u = te - tc;
      var p = smoothstep(-0.60, -0.10, u) * (1 - smoothstep(0.15, 0.60, u));
      if (p > s) s = p;
    }
    // live drag overlap
    if (band && band.drag) {
      var pos = figPos(FIG, t);
      var hw = SHAPES[FIG.type].halfW * figSize(FIG) + bandHalfWidth();
      var ov = clamp(1 - Math.abs(band.x - pos.x) / hw, 0, 1);
      if (ov > s) s = ov;
    }
    // decaying tail after a drag release
    for (i = 0; i < releaseEvents.length; i++) {
      var ev = releaseEvents[i];
      if (t >= ev.t && t < ev.t + 1.6) {
        var v = ev.vals[FIG.id];
        if (v) {
          var dec = v * Math.exp(-(t - ev.t) / 0.38);
          if (dec > s) s = dec;
        }
      }
    }
    return clamp(s, 0, 1);
  }

  function sweepIndexAt(t) {
    var te = t - epochT0, n = 0;
    for (var i = 0; i < sweepStarts.length; i++) if (sweepStarts[i] <= te) n++;
    return n;
  }

  // ---------- audio (lazy, guarded; first gesture only) ----------
  var AC = null, rustleGain = null, scanOsc = null, scanGain = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    try {
      var Ctor = (typeof window !== "undefined") && (window.AudioContext || window.webkitAudioContext);
      if (!Ctor) return;
      AC = new Ctor();
      var master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
      // paper rustle bed: looped noise through a lowpass
      var len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0), rng = mulberry32(871);
      for (var i = 0; i < len; i++) data[i] = rng() * 2 - 1;
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420;
      rustleGain = AC.createGain(); rustleGain.gain.value = 0.012;
      src.connect(lp); lp.connect(rustleGain); rustleGain.connect(master); src.start();
      // scan tone
      scanOsc = AC.createOscillator(); scanOsc.type = "sine"; scanOsc.frequency.value = 240;
      scanGain = AC.createGain(); scanGain.gain.value = 0;
      scanOsc.connect(scanGain); scanGain.connect(master); scanOsc.start();
      AC._master = master;
    } catch (e) { AC = null; }
  }
  function playGong() {
    if (!AC) return;
    try {
      var t0 = AC.currentTime;
      var freqs = [196, 294.5], gains = [0.055, 0.022];
      for (var i = 0; i < 2; i++) {
        var o = AC.createOscillator(); o.type = "sine"; o.frequency.value = freqs[i];
        var g = AC.createGain();
        g.gain.setValueAtTime(gains[i], t0);
        g.gain.exponentialRampToValueAtTime(0.0004, t0 + 1.6);
        o.connect(g); g.connect(AC._master); o.start(t0); o.stop(t0 + 1.7);
      }
    } catch (e) { /* audio is decoration; stay silent on failure */ }
  }
  function updateAudio(band, maxS) {
    if (!AC || !scanGain) return;
    try {
      var frac = band ? clamp(band.x / Math.max(1, W), 0, 1) : 0;
      var target = band ? 0.030 * band.presence * (0.35 + 0.65 * maxS) : 0;
      scanGain.gain.setTargetAtTime(target, AC.currentTime, 0.08);
      scanOsc.frequency.setTargetAtTime(220 + 640 * frac, AC.currentTime, 0.05);
      if (rustleGain) rustleGain.gain.setTargetAtTime(0.012 + 0.010 * maxS, AC.currentTime, 0.2);
    } catch (e) { /* ignore */ }
  }

  // ---------- drawing ----------
  function drawFigure(FIG, t, band) {
    var pos = figPos(FIG, t);
    var size = figSize(FIG);
    var s = scanAmount(FIG, t, band);
    var uf = clamp((t - FIG.born) / UNFOLD_DUR, 0, 1);
    var ease = 1 - Math.pow(1 - uf, 3);
    var sx = 0.05 + 0.95 * ease;
    if (uf <= 0) return s;

    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(pos.rot);
    ctx.scale(size * sx, size);

    var shape = SHAPES[FIG.type];
    var i, hole;

    // gold bloom behind the holes while scanned
    if (s > 0.02) {
      ctx.fillStyle = COL.bloom;
      for (i = 0; i < shape.holes.length; i++) {
        hole = shape.holes[i];
        ctx.globalAlpha = s * 0.10;
        ctx.beginPath(); ctx.arc(hole.x, hole.y, hole.r * 2.3, 0, TAU); ctx.fill();
        ctx.globalAlpha = s * 0.50;
        ctx.beginPath(); ctx.arc(hole.x, hole.y, hole.r * (1 + 0.30 * s), 0, TAU); ctx.fill();
      }
    }

    // body: outline plus punched holes, even-odd
    ctx.globalAlpha = (1 - 0.55 * s) * (0.35 + 0.65 * ease);
    ctx.fillStyle = COL.paper;
    ctx.beginPath();
    ctx.moveTo(shape.outline[0][0], shape.outline[0][1]);
    for (i = 1; i < shape.outline.length; i++) ctx.lineTo(shape.outline[i][0], shape.outline[i][1]);
    ctx.closePath();
    for (i = 0; i < shape.holes.length; i++) holePath(shape.holes[i]);
    ctx.fill("evenodd");

    // parchment edge and hole rims
    ctx.globalAlpha = (0.55 + 0.30 * s) * (0.4 + 0.6 * ease);
    ctx.strokeStyle = COL.edge;
    ctx.lineWidth = 1.3 / size;
    ctx.beginPath();
    ctx.moveTo(shape.outline[0][0], shape.outline[0][1]);
    for (i = 1; i < shape.outline.length; i++) ctx.lineTo(shape.outline[i][0], shape.outline[i][1]);
    ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = (0.35 + 0.30 * s) * (0.4 + 0.6 * ease);
    ctx.lineWidth = 0.9 / size;
    for (i = 0; i < shape.holes.length; i++) { ctx.beginPath(); holePath(shape.holes[i]); ctx.stroke(); }

    // fray: short static strokes shedding from the outline while scanned
    if (s > 0.03) {
      var swIdx = sweepIndexAt(t) + (band && band.drag ? 500 : 0);
      var rng = mulberry32(FIG.seed + swIdx * 7919 + 13);
      ctx.strokeStyle = COL.fray;
      ctx.globalAlpha = s * 0.85;
      ctx.lineWidth = 1.1 / size;
      var pts = shape.outline;
      ctx.beginPath();
      for (i = 0; i < pts.length; i++) {
        var p = pts[i], q = pts[(i + 1) % pts.length];
        var mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
        var dx = q[0] - p[0], dy = q[1] - p[1];
        var dl = Math.sqrt(dx * dx + dy * dy) || 1;
        var nx = -dy / dl, ny = dx / dl;
        if (nx * mx + ny * my < 0) { nx = -nx; ny = -ny; }  // outward
        var jx = (rng() - 0.5) * 0.02, jy = (rng() - 0.5) * 0.02;
        var len = (0.012 + rng() * 0.030) * (0.4 + 0.6 * s);
        var bx = p[0] + jx, by = p[1] + jy;
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + nx * len + (rng() - 0.5) * 0.012, by + ny * len + (rng() - 0.5) * 0.012);
        var bx2 = mx + jx, by2 = my + jy;
        ctx.moveTo(bx2, by2);
        ctx.lineTo(bx2 + nx * len * 0.8 + (rng() - 0.5) * 0.012, by2 + ny * len * 0.8 + (rng() - 0.5) * 0.012);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    return s;
  }

  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.fillStyle = COL.paper;
    ctx.fillRect(0, 0, W, H);

    // pending tap materialises a figure
    if (pendingTap && t >= pendingTap.t + TAP_DELAY) {
      var type = TYPE_CYCLE[spawnCounter % TYPE_CYCLE.length];
      spawnCounter++;
      var rngS = mulberry32(epochSeed + spawnCounter * 331 + 7);
      figures.push(makeFigure(type, pendingTap.x / W, pendingTap.y / H, 0.85, pendingTap.t + TAP_DELAY, rngS));
      if (figures.length > MAX_FIGS) figures.splice(3, 1);
      pendingTap = null;
    }

    var band = bandAt(t);

    // scan band under the figures, so translucent bodies take its tint
    if (band && band.presence > 0.01) {
      var bw = bandHalfWidth();
      ctx.fillStyle = COL.scan;
      ctx.globalAlpha = 0.10 * band.presence;
      ctx.fillRect(band.x - bw, 0, bw * 2, H);
      ctx.globalAlpha = 0.13 * band.presence;
      ctx.fillRect(band.x - bw * 0.18, 0, bw * 0.36, H);
      ctx.globalAlpha = 0.28 * band.presence;
      ctx.fillRect(band.x - bw, 0, 1.5, H);
      ctx.fillRect(band.x + bw - 1.5, 0, 1.5, H);
      ctx.globalAlpha = 1;
    }

    var maxS = 0;
    for (var i = 0; i < figures.length; i++) {
      var s = drawFigure(figures[i], t, band);
      if (s > maxS) maxS = s;
      // bloom gong when a figure's scan crosses its peak
      var prev = figures[i]._ps || 0;
      if (prev < 0.6 && s >= 0.6) playGong();
      figures[i]._ps = s;
    }
    updateAudio(band, maxS);
  }

  // ---------- pointer interaction ----------
  var pDown = null;   // {t, x, y, moved}
  function evtPos(e) {
    return { x: e.clientX || 0, y: e.clientY || 0 };
  }
  function onDown(e) {
    ensureAudio();
    var t = nowSec(), p = evtPos(e);
    pDown = { t: t, x: p.x, y: p.y, moved: false };
    drags.push({ t0: t, t1: null, samples: [{ t: t, x: p.x }] });
    if (drags.length > 24) drags.shift();
  }
  function onMove(e) {
    if (!pDown) return;
    var t = nowSec(), p = evtPos(e);
    if (Math.abs(p.x - pDown.x) + Math.abs(p.y - pDown.y) > 10) pDown.moved = true;
    var d = drags[drags.length - 1];
    if (d && d.t1 === null) d.samples.push({ t: t, x: p.x });
  }
  function onUp(e) {
    if (!pDown) return;
    var t = nowSec(), p = evtPos(e);
    var d = drags[drags.length - 1];
    if (d && d.t1 === null) {
      d.samples.push({ t: t, x: p.x });
      d.t1 = t;
      // record the scan amount each figure holds at release, for the decay tail
      var band = { x: p.x, presence: 1, drag: true, idx: -1 };
      var vals = {};
      for (var i = 0; i < figures.length; i++) {
        var sv = scanAmount(figures[i], t, band);
        if (sv > 0.02) vals[figures[i].id] = sv;
      }
      releaseEvents.push({ t: t, vals: vals });
      if (releaseEvents.length > 24) releaseEvents.shift();
    }
    var quick = (t - pDown.t) < 0.35 && !pDown.moved;
    if (quick) {
      if (pendingTap && (t - pendingTap.t) < 0.40) {
        // double tap: reseed the whole drift
        pendingTap = null;
        epoch++;
        epochSeed = 87132 + epoch * 1013;
        epochT0 = t;
        buildEpoch(epochSeed, t, 1.5);
        drags = []; releaseEvents = [];
      } else {
        pendingTap = { t: t, x: p.x, y: p.y };
      }
    }
    pDown = null;
  }

  if (canvas.addEventListener) {
    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
  }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("resize", resize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener("resize", resize);
    }
  }

  buildEpoch(epochSeed, 0, -1.2);   // first sweep already mid-flight at t = 0
  resize();

  function loop() {
    draw(nowSec());
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(loop);
})();
</script>
