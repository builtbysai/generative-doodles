<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Polygonal Erasure</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101013; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function phase(t, a, b) { return clamp01((t - a) / (b - a)); }
var BASE = '#8A8F98', INKC = '#1F2A44', SHAD = '#C0392B', BG = '#101013';

var edges = [], edgeMap = {}, segs = [], crossings = [], midPts = [];
function vkey(x, y) { return Math.round(x * 10) / 10 + ',' + Math.round(y * 10) / 10; }
function addEdge(x1, y1, x2, y2) {
  var k = vkey(x1, y1) < vkey(x2, y2) ? vkey(x1, y1) + '|' + vkey(x2, y2) : vkey(x2, y2) + '|' + vkey(x1, y1);
  if (!edgeMap[k]) {
    edgeMap[k] = { x1: x1, y1: y1, x2: x2, y2: y2, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
    edges.push(k);
  }
  return edgeMap[k];
}
function segInt(a, b) {
  var d = (a.x2 - a.x1) * (b.y2 - b.y1) - (a.y2 - a.y1) * (b.x2 - b.x1);
  if (Math.abs(d) < 1e-9) return null;
  var t = ((b.x1 - a.x1) * (b.y2 - b.y1) - (b.y1 - a.y1) * (b.x2 - b.x1)) / d;
  var u = ((b.x1 - a.x1) * (a.y2 - a.y1) - (b.y1 - a.y1) * (a.x2 - a.x1)) / d;
  if (t <= 0.02 || t >= 0.98 || u <= 0.02 || u >= 0.98) return null;
  return { x: a.x1 + t * (a.x2 - a.x1), y: a.y1 + t * (a.y2 - a.y1), t: t };
}
function build() {
  edges = []; edgeMap = {}; segs = []; crossings = []; midPts = [];
  if (!W) return;
  var L = W / 6.9;                            // ~7 octagons across
  var s = L / (2 + Math.SQRT2);
  var Ro = s / (2 * Math.sin(Math.PI / 8));
  var polys = [], i, j, k, a;
  for (j = -1; j * L < H + L; j++) for (i = -1; i * L < W + L; i++) {
    var cx = i * L, cy = j * L, ov = [];
    for (k = 0; k < 8; k++) {
      a = Math.PI / 8 + k * Math.PI / 4;
      ov.push([cx + Math.cos(a) * Ro, cy + Math.sin(a) * Ro]);
    }
    polys.push({ pts: ov, oct: true });
    var sx = cx + L / 2, sy = cy + L / 2, h = s / 2;
    polys.push({ pts: [[sx - h, sy - h], [sx + h, sy - h], [sx + h, sy + h], [sx - h, sy + h]], oct: false });
  }
  polys.forEach(function (p) {
    var ms = [], n = p.pts.length;
    for (k = 0; k < n; k++) {
      var p1 = p.pts[k], p2 = p.pts[(k + 1) % n];
      ms.push(addEdge(p1[0], p1[1], p2[0], p2[1]));
    }
    p.mids = ms;
    if (p.oct) {
      for (k = 0; k < 8; k++) segs.push({ x1: ms[k].mx, y1: ms[k].my, x2: ms[(k + 2) % 8].mx, y2: ms[(k + 2) % 8].my });
    } else {
      for (k = 0; k < 4; k++) segs.push({ x1: ms[k].mx, y1: ms[k].my, x2: ms[(k + 1) % 4].mx, y2: ms[(k + 1) % 4].my });
      segs.push({ x1: ms[0].mx, y1: ms[0].my, x2: ms[2].mx, y2: ms[2].my });
      segs.push({ x1: ms[1].mx, y1: ms[1].my, x2: ms[3].mx, y2: ms[3].my });
    }
  });
  edges.forEach(function (k2) { midPts.push(edgeMap[k2]); });
  // reveal order: from the centre outward
  var ccx = W / 2, ccy = H / 2;
  segs.sort(function (p, q) {
    return Math.hypot((p.x1 + p.x2) / 2 - ccx, (p.y1 + p.y2) / 2 - ccy) - Math.hypot((q.x1 + q.x2) / 2 - ccx, (q.y1 + q.y2) / 2 - ccy);
  });
  // crossings, with over/under alternating along each strand
  var per = segs.map(function () { return []; });
  var ii, jj, hit;
  for (ii = 0; ii < segs.length; ii++) for (jj = ii + 1; jj < segs.length; jj++) {
    hit = segInt(segs[ii], segs[jj]);
    if (hit) { per[ii].push({ o: jj, t: hit.t, x: hit.x, y: hit.y }); per[jj].push({ o: ii, t: 0, x: hit.x, y: hit.y }); }
  }
  for (ii = 0; ii < segs.length; ii++) {
    per[ii].sort(function (p, q) { return p.t - q.t; });
    per[ii].forEach(function (c, ci) {
      if (ii < c.o) crossings.push({ x: c.x, y: c.y, over: (ci % 2 === 0) ? ii : c.o });
    });
  }
}

var LOOP = 32, OFFSET = 20; // frame one: the base half-erased, the braid complete
function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  var t = ((now / 1000 + OFFSET) % LOOP + LOOP) % LOOP;
  var L = W / 6.9, s = L / (2 + Math.SQRT2);
  var bw = Math.max(2.2, s * 0.17);
  var baseDraw = phase(t, 0, 6);
  var baseAlpha = (t < 18 ? 1 : 1 - phase(t, 18, 22)) * 0.95;
  var patP = phase(t, 10, 18);
  var i, e;

  // the base tessellation, drawing edge by edge
  if (baseAlpha > 0.01 && baseDraw > 0) {
    ctx.strokeStyle = BASE; ctx.lineWidth = 1.4;
    ctx.globalAlpha = baseAlpha;
    var nE = Math.floor(edges.length * baseDraw);
    ctx.beginPath();
    for (i = 0; i < nE; i++) {
      e = edgeMap[edges[i]];
      ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // contact points: the edge midpoints, pulsing as they are marked
  if (t >= 6 && t < 22) {
    var pulse = t < 10 ? 1 + 0.45 * Math.sin((t - 6) / 4 * Math.PI * 2) : 1;
    var dA = t < 18 ? 1 : 1 - phase(t, 18, 22);
    ctx.fillStyle = BASE;
    ctx.globalAlpha = 0.95 * dA;
    for (i = 0; i < midPts.length; i++) {
      ctx.beginPath(); ctx.arc(midPts[i].mx, midPts[i].my, 2.1 * pulse, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // the second tessellation: braid shadow pass, then the ink pass
  if (patP > 0) {
    var nS = Math.floor(segs.length * patP);
    ctx.lineCap = 'round';
    ctx.strokeStyle = SHAD; ctx.lineWidth = bw;
    ctx.beginPath();
    for (i = 0; i < nS; i++) { ctx.moveTo(segs[i].x1 + 2.2, segs[i].y1 + 2.4); ctx.lineTo(segs[i].x2 + 2.2, segs[i].y2 + 2.4); }
    ctx.stroke();
    ctx.strokeStyle = INKC; ctx.lineWidth = bw * 0.8;
    ctx.beginPath();
    for (i = 0; i < nS; i++) { ctx.moveTo(segs[i].x1, segs[i].y1); ctx.lineTo(segs[i].x2, segs[i].y2); }
    ctx.stroke();
    // over/under interlace once the braid is complete
    if (patP >= 1) {
      for (i = 0; i < crossings.length; i++) {
        var c = crossings[i], sg = segs[c.over];
        ctx.fillStyle = BG;
        ctx.beginPath(); ctx.arc(c.x, c.y, bw * 0.58, 0, Math.PI * 2); ctx.fill();
        ctx.save();
        ctx.beginPath(); ctx.arc(c.x, c.y, bw * 1.05, 0, Math.PI * 2); ctx.clip();
        ctx.strokeStyle = INKC; ctx.lineWidth = bw * 0.8;
        ctx.beginPath(); ctx.moveTo(sg.x1, sg.y1); ctx.lineTo(sg.x2, sg.y2); ctx.stroke();
        ctx.restore();
      }
    }
  }
  if (t >= 28) {
    ctx.fillStyle = 'rgba(16,16,19,' + ((t - 28) / 4 * 0.96).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

resize();
draw(0);
function frame(ts) {
  draw(ts || 0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
