<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Screens Are Watching</title>
<style>
  html, body { margin:0; padding:0; background:#08090C; overflow:hidden; height:100%; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.973 "The Screens Are Watching" - study #119 kyle-mcdonald, PP134.
   Twelve laptop screens on a dark wall. Each screen shows only a face,
   drawn dark in the screen's own cold glow. All twelve pairs of pupils
   track one unseen point that wanders the room. Blinks are staggered.
   One screen at a time is recording. The screens never show content. */

var WALL = '#08090C', BEZEL = '#1C1F28', GLOW = '#B8C4D4',
    FACE = '#0E1013', RED = '#FF3B3B';
var GLOW_RGB = [184,196,212], FACE_RGB = [14,16,19], RED_RGB = [255,59,59];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 720, H = 720;

function isPhone(){
  var sw = 9999, sh = 9999;
  if (typeof window !== 'undefined' && window.screen){ sw = window.screen.width; sh = window.screen.height; }
  var mn = Math.min(sw, sh);
  if (mn < 700) return true;
  return H > W * 1.15;
}
function resize(){
  var w = W, h = H;
  if (typeof window !== 'undefined' && window.visualViewport){
    w = window.visualViewport.width; h = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth){
    w = window.innerWidth; h = window.innerHeight;
  }
  W = Math.max(200, Math.floor(w)); H = Math.max(200, Math.floor(h));
  canvas.width = W; canvas.height = H;
}
if (typeof window !== 'undefined'){
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);
}
resize();

/* ---------------- sim state ---------------- */
var DT = 1/120;
var simT = 0;
var gen = 0;
var rng = mulberry32(973134);
var screens = [];        // per-screen face + blink state
var recIdx = 0, recNext = 0;
var gazePoint = null, gazeUntil = -1;   // tap: hold all pupils here
var dragPoint = null;                    // drag: the visitor is the point
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
var soundEvents = [];                    // {kind} queued for the audio layer

function rgba(c, a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

/* The unseen point: a slow seeded Lissajous drifting around the room.
   Closed-form in sim time, so frame one is exact. */
function unseenPoint(t){
  var cx = W * 0.5, cy = H * 0.46;
  var x = cx + W * 0.46 * Math.sin(t * 0.113 + 1.9) + W * 0.10 * Math.sin(t * 0.041 + 0.4);
  var y = cy + H * 0.30 * Math.sin(t * 0.073 + 3.6) + H * 0.07 * Math.sin(t * 0.159 + 1.1);
  return { x: x, y: y };
}

function buildGeneration(seed){
  rng = mulberry32(seed);
  gen++;
  screens = [];
  for (var i = 0; i < 12; i++){
    screens.push({
      fx: (rng() - 0.5) * 0.10,          // face centre jitter, unit of screen w
      fy: (rng() - 0.5) * 0.08,
      eyeDX: 0.115 + rng() * 0.035,      // half eye spacing, unit of screen w
      eyeR: 0.030 + rng() * 0.012,       // eye radius, unit of screen w
      noseL: 0.05 + rng() * 0.04,        // nose tick length
      mouthW: 0.10 + rng() * 0.07,       // mouth half width
      mouthC: (rng() - 0.5) * 0.09,      // mouth curvature (+ smile, - frown)
      glowPh: rng() * Math.PI * 2,
      glowSp: 0.14 + rng() * 0.16,
      pupX: 0, pupY: 0,
      blinkAt: 1.2 + rng() * 6.5,
      blinkStart: -10
    });
  }
  recIdx = Math.floor(rng() * 12);
  recNext = 7 + rng() * 7;
  gazePoint = null; gazeUntil = -1; dragPoint = null;
}
buildGeneration(973134);

function stepSim(){
  simT += DT;
  var target;
  if (dragPoint) target = dragPoint;
  else if (gazePoint && simT <= gazeUntil) target = gazePoint;
  else target = unseenPoint(simT);
  for (var i = 0; i < 12; i++){
    var s = screens[i];
    /* blink scheduling (seeded stream, staggered by construction) */
    if (simT >= s.blinkAt){
      s.blinkStart = simT;
      s.blinkAt = simT + 2.3 + rng() * 4.6;
      soundEvents.push({ kind: 'blink' });
    }
    /* pupil ease toward the point: slow saccade */
    s._tx = target.x; s._ty = target.y;
    var k = 1 - Math.exp(-DT * 3.2);
    s.pupX += ((target.x) - s.pupX) * k;
    s.pupY += ((target.y) - s.pupY) * k;
  }
  if (simT >= recNext){
    var n = Math.floor(rng() * 11);
    if (n >= recIdx) n++;
    recIdx = n;
    recNext = simT + 7 + rng() * 7;
    soundEvents.push({ kind: 'tally' });
  }
}
/* frame one: exactly 2400 fixed steps (20 s of shift) */
for (var p = 0; p < 2400; p++) stepSim();
soundEvents.length = 0;

/* ---------------- layout + draw ---------------- */
function layout(){
  var phone = isPhone();
  /* portrait frames: the wall keeps its shape as a square block centred
     vertically, instead of stretching the screens into slivers */
  var bw = W, bh = H, oy = 0;
  if (H > W * 1.05){ bh = W; oy = (H - W) / 2; }
  var mx = bw * (phone ? 0.045 : 0.06), my = bh * (phone ? 0.05 : 0.07);
  var gw = bw - mx * 2, gh = bh - my * 2;
  var gapX = gw * 0.045, gapY = gh * 0.06;
  var sw = (gw - gapX * 3) / 4, sh = (gh - gapY * 2) / 3;
  return { mx: mx, my: my + oy, gapX: gapX, gapY: gapY, sw: sw, sh: sh };
}
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
  ctx.lineTo(x + w, y + h - r); ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  ctx.lineTo(x + r, y + h); ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  ctx.closePath();
}
function draw(){
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = WALL;
  ctx.fillRect(0, 0, W, H);
  var L = layout();
  for (var i = 0; i < 12; i++){
    var s = screens[i];
    var col = i % 4, row = (i / 4) | 0;
    var x = L.mx + col * (L.sw + L.gapX), y = L.my + row * (L.sh + L.gapY);
    var sw = L.sw, sh = L.sh, rad = Math.min(sw, sh) * 0.09;
    /* bezel */
    rr(x, y, sw, sh, rad);
    ctx.fillStyle = BEZEL; ctx.fill();
    if (i === recIdx){
      ctx.strokeStyle = rgba(RED_RGB, 0.55); ctx.lineWidth = 1;
      ctx.stroke();
    }
    /* glow panel: layered flat alphas (no gradients) */
    var br = 0.68 + 0.22 * Math.sin(simT * s.glowSp + s.glowPh);   // 0.46..0.90
    var ix = x + sw * 0.055, iy = y + sh * 0.07, iw = sw * 0.89, ih = sh * 0.86;
    rr(ix, iy, iw, ih, rad * 0.7);
    ctx.fillStyle = rgba(GLOW_RGB, br * 0.55); ctx.fill();
    rr(ix + iw * 0.09, iy + ih * 0.10, iw * 0.82, ih * 0.80, rad * 0.55);
    ctx.fillStyle = rgba(GLOW_RGB, br * 0.5); ctx.fill();
    rr(ix + iw * 0.22, iy + ih * 0.22, iw * 0.56, ih * 0.56, rad * 0.4);
    ctx.fillStyle = rgba(GLOW_RGB, br * 0.35); ctx.fill();

    /* the face, dark on the glow */
    var fcx = x + sw * (0.5 + s.fx), fcy = y + sh * (0.52 + s.fy);
    var edx = sw * s.eyeDX, er = Math.max(1.6, sw * s.eyeR);
    var ey = fcy - sh * 0.10;
    var blinking = (simT - s.blinkStart) < 0.15;
    /* pupil direction: from this face to the tracked point, clamped in-eye */
    var dx = s.pupX - fcx, dy = s.pupY - fcy;
    var dl = Math.sqrt(dx * dx + dy * dy) || 1;
    var maxOff = er * 0.52;
    var ox = dx / dl * Math.min(maxOff, dl * 0.012), oy = dy / dl * Math.min(maxOff, dl * 0.012);
    ctx.fillStyle = FACE;
    ctx.strokeStyle = FACE;
    for (var e = -1; e <= 1; e += 2){
      var exx = fcx + e * edx;
      if (blinking){
        ctx.lineWidth = Math.max(1, er * 0.28);
        ctx.beginPath(); ctx.moveTo(exx - er * 0.9, ey); ctx.lineTo(exx + er * 0.9, ey); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(exx, ey, er, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = rgba(RED_RGB, 0.8);
        ctx.beginPath(); ctx.arc(exx + ox, ey + oy, Math.max(0.7, er * 0.36), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = FACE;
      }
    }
    /* nose tick */
    ctx.lineWidth = Math.max(1, sw * 0.008);
    ctx.beginPath();
    ctx.moveTo(fcx, fcy - sh * 0.03);
    ctx.lineTo(fcx, fcy + sh * s.noseL);
    ctx.stroke();
    /* mouth arc */
    var mw = sw * s.mouthW, myy = fcy + sh * 0.20;
    ctx.lineWidth = Math.max(1, sw * 0.009);
    ctx.beginPath();
    ctx.moveTo(fcx - mw, myy);
    ctx.quadraticCurveTo(fcx, myy + sh * s.mouthC * 2, fcx + mw, myy);
    ctx.stroke();
    /* recording dot */
    if (i === recIdx){
      var pulse = 0.55 + 0.45 * Math.sin(simT * 4.2);
      ctx.fillStyle = rgba(RED_RGB, 0.35 + 0.55 * pulse);
      ctx.beginPath();
      ctx.arc(x + sw - sw * 0.085, y + sh * 0.115, Math.max(1.6, sw * 0.016) * (0.8 + 0.3 * pulse), 0, Math.PI * 2);
      ctx.fill();
    }
  }
}
draw();

/* ---------------- audio (lazy, guarded) ---------------- */
var AC = null, humGain = null;
function ensureAudio(){
  if (AC) { if (AC.resume) AC.resume(); return; }
  if (typeof window === 'undefined' || !window.AudioContext) return;
  try {
    AC = new window.AudioContext();
    humGain = AC.createGain(); humGain.gain.value = 0.0;
    var o1 = AC.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 118;
    var o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = 59;
    var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 240;
    var g2 = AC.createGain(); g2.gain.value = 0.4;
    o1.connect(f); o2.connect(f); f.connect(g2); g2.connect(humGain); humGain.connect(AC.destination);
    o1.start(); o2.start();
    humGain.gain.linearRampToValueAtTime(0.012, AC.currentTime + 2.5);
  } catch (e) { AC = null; }
}
function blip(freq, dur, gain, type){
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur + 0.02);
  } catch (e) {}
}
function clicks(n){
  if (!AC) return;
  for (var i = 0; i < n; i++){
    (function(i){
      setTimeout(function(){ blip(2100 + (i % 5) * 160, 0.03, 0.015, 'square'); }, i * 14);
    })(i);
  }
}
var blinkSoundCool = 0;
function drainSounds(){
  if (!AC) { soundEvents.length = 0; return; }
  for (var i = 0; i < soundEvents.length; i++){
    var k = soundEvents[i].kind;
    if (k === 'tally') blip(1560, 0.07, 0.02);
    else if (k === 'blink' && simT > blinkSoundCool){ blinkSoundCool = simT + 1.5; blip(3400, 0.02, 0.006, 'square'); }
  }
  soundEvents.length = 0;
}

/* ---------------- interaction (events by piece time) ---------------- */
function pt(e){
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return { x: (e.clientX - r.left) * (W / (r.width || W)), y: (e.clientY - r.top) * (H / (r.height || H)) };
}
var downAt = -10, downPos = null, moved = false;
function onDown(e){
  ensureAudio();
  var p = pt(e);
  downAt = simT; downPos = p; moved = false;
  if (simT - lastTapT < 0.35 && Math.abs(p.x - lastTapX) < 30 && Math.abs(p.y - lastTapY) < 30){
    buildGeneration(973134 + gen * 7919);      /* double-tap: a new shift */
    lastTapT = -10;
    clicks(12);
    return;
  }
  lastTapT = simT; lastTapX = p.x; lastTapY = p.y;
  dragPoint = p;
}
function onMove(e){
  if (!downPos) return;
  var p = pt(e);
  if (Math.abs(p.x - downPos.x) + Math.abs(p.y - downPos.y) > 6) moved = true;
  dragPoint = p;
}
function onUp(e){
  if (downPos && !moved && simT - downAt < 0.4){
    var p = pt(e);
    gazePoint = { x: p.x, y: p.y };             /* tap: meet its gaze */
    gazeUntil = simT + 3;
    clicks(12);
  }
  downPos = null; dragPoint = null;
}
if (typeof window !== 'undefined' && canvas.addEventListener){
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}

/* ---------------- loop ---------------- */
var lastNow = -1;
function frame(now){
  if (lastNow < 0) lastNow = now;
  var el = (now - lastNow) / 1000;
  lastNow = now;
  if (el > 0.25) el = 0.25;
  var steps = Math.round(el / DT);
  if (steps > 30) steps = 30;
  for (var i = 0; i < steps; i++) stepSim();
  drainSounds();
  draw();
}
if (typeof requestAnimationFrame !== 'undefined'){
  requestAnimationFrame(function tick(now){ frame(now); requestAnimationFrame(tick); });
}
</script>
</body>
</html>
