<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neosincretismo</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #100D0B; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.676 "Neosincretismo" (EXPANSION #82 clemente-mckay, block 4).
  // His core term as a morphing profile: one large instrument outline
  // in burnished clay that breathes between two heritages, the
  // EUROPEAN BELL (crown knob, clean curve, flared mouth) and the
  // PRE-COLUMBIAN WHISTLING VESSEL (globular body, stirrup spout,
  // chambered interior). The two profiles are matched point sets, so
  // every in-between is a true interpolation and the midpoint is
  // genuinely neither. A 44 s loop dwells longest at that ambiguous
  // midpoint, where the outline picks up a gold shimmer. A small
  // caption under the profile alternates "campana" / "huaco" with the
  // grammar and fades out entirely at the center. Drag sideways to
  // scrub the morph; release and the slow breathing resumes.

  var CLAY = '#A4552F';
  var ENGOBE = '#E4D3B8';
  var GROUND = '#100D0B';
  var GOLD = '#D9A441';

  var FW = 1.0, FH = 1.0;      // square composition field
  var LOOP = 44;               // seconds, bell to huaco and back
  // Profile box inside the composition field.
  var PBX = 0.155, PBY = 0.070, PBW = 0.690, PBH = 0.790;
  var CAPY = 0.925;            // caption baseline center (composition y)

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ------------------------------------------------------------------
  // THE TWO PROFILES. Each is authored as a RIGHT HALF only: sixteen
  // points running from the top axis point down the right side to the
  // bottom axis point, in profile space (x: 0..1, axis at 0.5; y: 0
  // top, 1 bottom). The left half is the exact mirror, so both
  // profiles and every interpolated state are bilaterally symmetric
  // by construction. Point i of the bell answers point i of the
  // huaco: knob top to arch top, crown to spout leg, wall to body
  // swell, sound bow to base curve, mouth to chambered foot.
  // ------------------------------------------------------------------
  var BELL_R = [
    [0.500, 0.030], [0.540, 0.038], [0.548, 0.070], [0.520, 0.095],
    [0.560, 0.140], [0.600, 0.230], [0.618, 0.340], [0.628, 0.460],
    [0.640, 0.570], [0.672, 0.672], [0.716, 0.762], [0.758, 0.845],
    [0.772, 0.905], [0.760, 0.945], [0.650, 0.928], [0.500, 0.918]
  ];
  var HUACO_R = [
    [0.500, 0.020], [0.560, 0.026], [0.592, 0.062], [0.598, 0.120],
    [0.640, 0.185], [0.700, 0.280], [0.738, 0.395], [0.748, 0.510],
    [0.738, 0.625], [0.706, 0.728], [0.655, 0.815], [0.612, 0.868],
    [0.578, 0.905], [0.562, 0.940], [0.532, 0.953], [0.500, 0.956]
  ];
  // The stirrup opening, at full huaco. Collapsed toward a hairline
  // sliver as the morph leaves the vessel pole.
  var HOLE = [
    [0.452, 0.145], [0.456, 0.080], [0.472, 0.052], [0.500, 0.044],
    [0.528, 0.052], [0.544, 0.080], [0.548, 0.145]
  ];
  // Interior chamber lines, engobe, visible only on the huaco side:
  // the whistle channel dropping from the spout, a chamber divider,
  // and the arc of the lower chamber.
  var CHAMBERS = [
    [[0.500, 0.170], [0.503, 0.300], [0.497, 0.420], [0.500, 0.520]],
    [[0.385, 0.560], [0.440, 0.545], [0.500, 0.555], [0.560, 0.545], [0.615, 0.560]],
    [[0.420, 0.720], [0.470, 0.750], [0.530, 0.750], [0.580, 0.720]]
  ];

  // Morph amount from loop time. Ping-pong triangle, then the dwell
  // map m = tri + (0.8 / 2pi) * sin(2pi * tri): its slope is 1.8 at
  // the poles and 0.2 at the center, so the loop hurries through the
  // pure grammars and lingers in the ambiguous middle.
  function morphAt(t) {
    var u = (((t % LOOP) + LOOP) % LOOP) / LOOP;
    var tri = u < 0.5 ? 2 * u : 2 - 2 * u;
    return clamp(tri + (0.8 / (2 * Math.PI)) * Math.sin(2 * Math.PI * tri), 0, 1);
  }

  // ------------------------------------------------------------------
  // Layout (Visual Viewport API, resize listeners on both)
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var scale = 1, orgX = 0, orgY = 0;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    scale = Math.min(W / FW, H / FH) * 0.97;
    orgX = (W - FW * scale) / 2;
    orgY = (H - FH * scale) / 2;
  }
  function px(x) { return orgX + x * scale; }
  function py(y) { return orgY + y * scale; }
  // Profile space to composition space.
  function cx(p) { return PBX + p[0] * PBW; }
  function cy(p) { return PBY + p[1] * PBH; }

  // Morphed right half at amount m, with a barely-there breath scale.
  function morphedHalf(m, breath) {
    var out = [];
    for (var i = 0; i < BELL_R.length; i++) {
      var x = lerp(BELL_R[i][0], HUACO_R[i][0], m);
      var y = lerp(BELL_R[i][1], HUACO_R[i][1], m);
      out.push([0.5 + (x - 0.5) * breath, 0.5 + (y - 0.5) * breath]);
    }
    return out;
  }
  function fullContour(half) {
    var pts = half.slice();
    for (var i = half.length - 2; i >= 1; i--) pts.push([1 - half[i][0], half[i][1]]);
    return pts; // profile space, closed loop
  }
  function toDevice(pts) {
    var out = [];
    for (var i = 0; i < pts.length; i++) out.push([px(cx(pts[i])), py(cy(pts[i]))]);
    return out;
  }
  // Adds the smoothed closed contour of device points to the path.
  function traceLoop(dev) {
    var n = dev.length;
    var mx = (dev[0][0] + dev[n - 1][0]) / 2, my = (dev[0][1] + dev[n - 1][1]) / 2;
    ctx.moveTo(mx, my);
    for (var i = 0; i < n; i++) {
      var p = dev[i], q = dev[(i + 1) % n];
      ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
    }
    ctx.closePath();
  }
  function holePoints(w) {
    var out = [];
    for (var i = 0; i < HOLE.length; i++) {
      var tx = 0.5 + (HOLE[i][0] - 0.5) * 0.06;
      var ty = 0.088 + (HOLE[i][1] - 0.09) * 0.06;
      out.push([lerp(tx, HOLE[i][0], w), lerp(ty, HOLE[i][1], w)]);
    }
    return out;
  }

  function drawProfile(t) {
    var m = morphAt(t);
    var breath = 1 + 0.0035 * Math.sin(2 * Math.PI * t / 8.5);
    var dev = toDevice(fullContour(morphedHalf(m, breath)));
    var holeW = smooth(0.10, 0.70, m);
    var holeDev = holeW > 0.03 ? toDevice(holePoints(holeW)) : null;

    // Clay fill (with the stirrup opening cut by even-odd).
    ctx.beginPath();
    traceLoop(dev);
    if (holeDev) {
      ctx.moveTo(holeDev[0][0], holeDev[0][1]);
      for (var i = 1; i < holeDev.length; i++) ctx.lineTo(holeDev[i][0], holeDev[i][1]);
      ctx.closePath();
    }
    ctx.fillStyle = CLAY;
    ctx.globalAlpha = 1;
    ctx.fill('evenodd');

    // Gold shimmer at the midpoint: the contour stroked again in
    // gold, slightly offset, its phase slowly sliding.
    var shim = Math.exp(-((m - 0.5) * (m - 0.5)) / (2 * 0.13 * 0.13));
    if (shim > 0.01) {
      var off = (1.1 + 0.9 * Math.sin(t * 1.4)) * shim;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.strokeStyle = GOLD;
      ctx.lineWidth = Math.max(0.8, 0.0072 * scale);
      ctx.globalAlpha = 0.20 * shim;
      ctx.beginPath(); traceLoop(dev); ctx.stroke();
      ctx.save();
      ctx.translate(off, 0);
      ctx.globalAlpha = 0.26 * shim;
      ctx.beginPath(); traceLoop(dev); ctx.stroke();
      ctx.translate(-2 * off, 0);
      ctx.beginPath(); traceLoop(dev); ctx.stroke();
      ctx.restore();
    }

    // Engobe contour: the one line.
    ctx.globalAlpha = 1;
    ctx.strokeStyle = ENGOBE;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(0.8, 0.0062 * scale);
    ctx.beginPath(); traceLoop(dev); ctx.stroke();

    // The stirrup opening gets its own engobe edge as it opens.
    if (holeDev) {
      ctx.globalAlpha = 0.85 * holeW;
      ctx.lineWidth = Math.max(0.7, 0.0042 * scale);
      ctx.beginPath();
      ctx.moveTo(holeDev[0][0], holeDev[0][1]);
      for (var j = 1; j < holeDev.length; j++) ctx.lineTo(holeDev[j][0], holeDev[j][1]);
      ctx.closePath();
      ctx.stroke();
    }

    // Interior chamber lines fade in on the huaco side.
    var chA = smooth(0.55, 0.92, m) * 0.75;
    if (chA > 0.004) {
      ctx.globalAlpha = chA;
      ctx.strokeStyle = ENGOBE;
      ctx.lineWidth = Math.max(0.6, 0.0034 * scale);
      for (var c = 0; c < CHAMBERS.length; c++) {
        var line = CHAMBERS[c];
        ctx.beginPath();
        ctx.moveTo(px(cx(line[0])), py(cy(line[0])));
        for (var k = 1; k < line.length; k++) ctx.lineTo(px(cx(line[k])), py(cy(line[k])));
        ctx.stroke();
      }
    }

    // Caption: one word, crossfading with the grammar, both gone at
    // the midpoint.
    var campA = 1 - smooth(0.16, 0.44, m);
    var huacoA = smooth(0.56, 0.84, m);
    ctx.globalAlpha = 1;
    ctx.fillStyle = ENGOBE;
    ctx.font = Math.round(0.036 * scale) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (campA > 0.004) { ctx.globalAlpha = campA; ctx.fillText('campana', px(0.5), py(CAPY)); }
    if (huacoA > 0.004) { ctx.globalAlpha = huacoA; ctx.fillText('huaco', px(0.5), py(CAPY)); }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Clock and drag scrub. The morph is a pure function of loop time
  // plus the recorded scrub offset. A horizontal drag adds offset
  // while held (a full frame width of travel scrubs a half loop);
  // on release the offset persists and the loop resumes from there.
  // ------------------------------------------------------------------
  var scrub = 0;          // committed offset, seconds
  var dragBase = 0;       // scrub at pointerdown
  var dragStartX = 0;
  var dragging = false;

  // QA hook: "seed=tNN" freezes the clock at NN seconds.
  var forcedT = -1;
  try {
    var qs = String((typeof location !== 'undefined' && location.search) || '');
    var mt = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(qs);
    if (mt) forcedT = parseFloat(mt[1]);
  } catch (e) { forcedT = -1; }

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (forcedT >= 0) return forcedT;
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }

  function draw(nowOverride) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var t;
    if (forcedT >= 0) t = forcedT;
    else if (typeof nowOverride === 'number') t = nowOverride;
    else t = elapsed();
    drawProfile(t + scrub);
  }

  if (canvas && canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      dragBase = scrub;
      dragStartX = e.clientX || 0;
      if (canvas.setPointerCapture && e.pointerId != null) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (e.preventDefault) e.preventDefault();
    });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = (e.clientX || 0) - dragStartX;
      scrub = dragBase + (W > 0 ? (dx / W) * (LOOP / 2) : 0);
      if (forcedT < 0) draw();
    });
    window.addEventListener('pointerup', function () { dragging = false; });
    window.addEventListener('pointercancel', function () { dragging = false; });
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  resize();
  draw(0); // frame one: synchronous draw at the constant phase (pure bell)

  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
