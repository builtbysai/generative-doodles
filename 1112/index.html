<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Live Miniature</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #060607; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1112 "Live Miniature" — Markus Kison study block MK1.
   A miniature city block on a dark table. Its building faces carry live
   procedural "webcam feed" textures — window grids with tiny people moving
   inside lit interiors, blind shadows sweeping — drawn directly in 2D and
   deliberately mis-registered by a few pixels at the corners, so the
   projection seams show. A fast 40 s day/night cycle runs over the model:
   gold day, blue dusk, black night with warm windows. Pseudo-3D projected
   boxes (the prompt's Three.js spec adapted to canvas 2D per house
   precedent). Frame one is a fixed day phase; everything is seeded. */

var TAU = Math.PI * 2;

/* ---------- seeded rng (determinism: no Math.random, no wall clock) ------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- colour helpers ----------------------------------------------- */
function hx(c) {
  return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
}
function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function mix(a, b, f) {
  return [Math.round(a[0] + (b[0] - a[0]) * f),
          Math.round(a[1] + (b[1] - a[1]) * f),
          Math.round(a[2] + (b[2] - a[2]) * f)];
}
function shade(c, f) {
  return [Math.min(255, Math.round(c[0] * f)),
          Math.min(255, Math.round(c[1] * f)),
          Math.min(255, Math.round(c[2] * f))];
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, f) { return a + (b - a) * f; }

/* ---------- day / night cycle --------------------------------------------- */
/* 40 s cycle: day -> dusk -> night -> dawn -> day. Keyframes carry the
   global light wash (flat alpha overlay colour) and the night factor. */
var CYCLE = 40;
var DAYK  = { wash: [255, 196, 110], washA: 0.30, night: 0.0 };
var DUSKK = { wash: [86, 120, 200],  washA: 0.30, night: 0.45 };
var NIGHTK = { wash: [28, 38, 78],  washA: 0.20, night: 1.0 };
var KEYS = [
  [0.00, DAYK], [0.38, DAYK], [0.50, DUSKK],
  [0.60, NIGHTK], [0.88, NIGHTK], [1.00, DAYK]
];
function lightAt(t) {
  var p = ((t % CYCLE) + CYCLE) % CYCLE / CYCLE;
  for (var i = 0; i < KEYS.length - 1; i++) {
    var p0 = KEYS[i][0], p1 = KEYS[i + 1][0];
    if (p >= p0 && p <= p1) {
      var f = (p1 - p0) > 0 ? (p - p0) / (p1 - p0) : 0;
      var A = KEYS[i][1], B = KEYS[i + 1][1];
      return {
        wash: mix(A.wash, B.wash, f),
        washA: lerp(A.washA, B.washA, f),
        night: lerp(A.night, B.night, f)
      };
    }
  }
  return { wash: DAYK.wash, washA: DAYK.washA, night: 0 };
}

/* ---------- city layout (seeded) ------------------------------------------ */
var seedBase = 1112137;
var buildings = [];
var lamps = [];
var BASES = ['#8E877C', '#7D766B', '#98917F', '#6E675C', '#A39A89', '#857E72', '#948B7A'];

function buildCity() {
  var rng = mulberry32(seedBase);
  buildings = []; lamps = [];
  var xs = [-0.8, -0.4, 0, 0.4, 0.8], zs = [-0.75, -0.25, 0.25, 0.75];
  var plots = [];
  var xi, zi;
  for (xi = 0; xi < xs.length; xi++) for (zi = 0; zi < zs.length; zi++) plots.push([xs[xi], zs[zi]]);
  /* drop two plots so the block breathes: 18 buildings */
  plots.splice(Math.floor(rng() * plots.length), 1);
  plots.splice(Math.floor(rng() * plots.length), 1);
  for (var pi = 0; pi < plots.length; pi++) {
    var bx = plots[pi][0] + (rng() - 0.5) * 0.05;
    var bz = plots[pi][1] + (rng() - 0.5) * 0.05;
    var bhx = 0.13 + rng() * 0.05;
    var bhz = 0.13 + rng() * 0.05;
    var H = 0.28 + Math.pow(rng(), 1.35) * 0.78;
    if (pi % 6 === 2) H = 0.85 + rng() * 0.25;      /* a few towers */
    var b = {
      x: bx, z: bz, hx: bhx, hz: bhz, h: H,
      base: hx(BASES[Math.floor(rng() * BASES.length)]),
      roof: rng() < 0.34,
      roofHx: 0, roofHz: 0, roofH: 0,
      faces: []
    };
    if (b.roof) {
      b.roofHx = bhx * (0.4 + rng() * 0.25);
      b.roofHz = bhz * (0.4 + rng() * 0.25);
      b.roofH = 0.07 + rng() * 0.09;
    }
    for (var f = 0; f < 4; f++) {
      var fw = (f < 2) ? 2 * bhz : 2 * bhx;         /* faces 0,1 are the x sides */
      var cols = clamp(Math.round(fw / 0.115), 2, 6);
      var rows = clamp(Math.round(H / 0.125), 2, 9);
      var cells = [];
      for (var ci = 0; ci < cols * rows; ci++) {
        var occ = rng() < 0.62;
        var ppl = [];
        if (occ) {
          var np = rng() < 0.5 ? 1 : 2;
          for (var k = 0; k < np; k++) {
            ppl.push({
              ph1: rng() * TAU, ph2: rng() * TAU,
              sp1: 0.25 + rng() * 0.4, sp2: 0.2 + rng() * 0.35,
              ax: 0.16 + rng() * 0.2, ay: 0.1 + rng() * 0.14
            });
          }
        }
        cells.push({
          occ: occ, lit: rng() < 0.55, ppl: ppl,
          blindPh: rng() * TAU, blindSp: TAU / (70 + rng() * 90),
          flick: rng() * TAU
        });
      }
      b.faces.push({
        cols: cols, rows: rows, cells: cells,
        ox: (rng() * 2 - 1) * 3, oy: (rng() * 2 - 1) * 3,   /* mis-registration */
        sweepSeed: rng()
      });
    }
    buildings.push(b);
  }
  var lampSpots = [[-0.6, -0.5], [0.2, -0.5], [0.6, 0.0], [-0.2, 0.5], [0.6, 0.5], [-0.6, 0.0]];
  for (var li = 0; li < lampSpots.length; li++) {
    lamps.push({ x: lampSpots[li][0] + (rng() - 0.5) * 0.06, z: lampSpots[li][1] + (rng() - 0.5) * 0.06 });
  }
}
buildCity();

/* ---------- time / orbit state -------------------------------------------- */
var PHASE0 = 12;                 /* fixed first-frame phase: full day */
var simTime = 0;
var azOff = 0;                   /* drag orbit offset, eases back to idle */
function nowT() { return PHASE0 + simTime; }
function idleAz(t) { return 0.7 + 0.45 * Math.sin(TAU * t / 90); }

/* ---------- canvas / viewport --------------------------------------------- */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var vw = 300, vh = 300, dpr = 1, phone = false;

function fit() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  vw = vv ? vv.width : (window.innerWidth || 300);
  vh = vv ? vv.height : (window.innerHeight || 300);
  dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
  var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : vw;
  var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : vh;
  phone = (Math.min(sw, sh) < 700) || (vh > vw * 1.15);
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(); });
  }
  window.addEventListener('resize', function () { fit(); draw(); });
}
fit();

/* ---------- projection ------------------------------------------------------ */
var COSEL = 0.62, SINEL = 0.78;
var az = 1.0;
function proj(x, y, z, S, ox, oy) {
  var ca = Math.cos(az), sa = Math.sin(az);
  var xr = x * ca - z * sa;              /* screen-right axis */
  var dt = x * sa + z * ca;              /* toward camera (camDir = (sinAz, cosAz)) */
  var k = S * 0.32;
  return [ox + S * 0.5 + xr * k, oy + S * 0.60 + dt * k * COSEL - y * k * SINEL, dt];
}
function quad(pts, fill, alpha) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = rgba(fill, alpha);
  ctx.fill();
}
function bilerp(q, u, v) {
  var topX = lerp(q[0][0], q[1][0], u), topY = lerp(q[0][1], q[1][1], u);
  var botX = lerp(q[3][0], q[2][0], u), botY = lerp(q[3][1], q[2][1], u);
  return [lerp(topX, botX, v), lerp(topY, botY, v)];
}

/* face corner world coords: A,B are the two vertical edges (screen TL,TR,BR,BL) */
var FACEDEF = [
  { n: [1, 0],  a: function (b) { return [b.x + b.hx, b.z + b.hz]; }, b: function (b) { return [b.x + b.hx, b.z - b.hz]; } },
  { n: [-1, 0], a: function (b) { return [b.x - b.hx, b.z - b.hz]; }, b: function (b) { return [b.x - b.hx, b.z + b.hz]; } },
  { n: [0, 1],  a: function (b) { return [b.x - b.hx, b.z + b.hz]; }, b: function (b) { return [b.x + b.hx, b.z + b.hz]; } },
  { n: [0, -1], a: function (b) { return [b.x + b.hx, b.z - b.hz]; }, b: function (b) { return [b.x - b.hx, b.z - b.hz]; } }
];
var LIGHTDIR = [-0.55, 0.84];            /* fixed key light, upper front-left */

var CELLDAY = [216, 222, 226];
var CELLWARM = [255, 217, 160];
var CELLDARK = [16, 22, 34];
var PERSON = [22, 18, 14];

function drawFace(b, fi, S, ox, oy, t, L) {
  var def = FACEDEF[fi];
  var A = def.a(b), B = def.b(b);
  var q = [
    proj(A[0], b.h, A[1], S, ox, oy),
    proj(B[0], b.h, B[1], S, ox, oy),
    proj(B[0], 0, B[1], S, ox, oy),
    proj(A[0], 0, A[1], S, ox, oy)
  ];
  var bright = 0.8 + 0.24 * Math.max(0, def.n[0] * LIGHTDIR[0] + def.n[1] * LIGHTDIR[1]);
  var baseC = shade(b.base, bright * (1 - 0.45 * L.night));
  quad(q, baseC, 1);

  var fd = b.faces[fi];
  var cols = fd.cols, rows = fd.rows;
  var foX = fd.ox * (S / 720), foY = fd.oy * (S / 720);
  /* window feed, shifted by the mis-registration offset */
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var cell = fd.cells[r * cols + c];
      var u0 = (c + 0.14) / cols, u1 = (c + 0.86) / cols;
      var v0 = (r + 0.16) / rows, v1 = (r + 0.84) / rows;
      var p00 = bilerp(q, u0, v0), p10 = bilerp(q, u1, v0);
      var p11 = bilerp(q, u1, v1), p01 = bilerp(q, u0, v1);
      p00 = [p00[0] + foX, p00[1] + foY]; p10 = [p10[0] + foX, p10[1] + foY];
      p11 = [p11[0] + foX, p11[1] + foY]; p01 = [p01[0] + foX, p01[1] + foY];
      var nightCell = cell.lit ? CELLWARM : CELLDARK;
      var cc = mix(CELLDAY, nightCell, L.night);
      if (cell.occ) cc = mix(cc, CELLWARM, 0.16 * (1 - L.night));
      var alpha = 0.5 + 0.4 * L.night * (cell.lit ? 1 : 0.4);
      if (cell.lit && L.night > 0.5) alpha *= 0.93 + 0.07 * Math.sin(t * 2.1 + cell.flick);
      quad([p00, p10, p11, p01], cc, alpha);
      /* blinds: a shade creeps down the cell and back, each on its own clock */
      var bf = clamp(0.5 + 0.62 * Math.sin(cell.blindPh + t * cell.blindSp), 0, 1);
      if (bf > 0.06) {
        var b1 = bilerp(q, u0, v0 + (v1 - v0) * bf), b2 = bilerp(q, u1, v0 + (v1 - v0) * bf);
        b1 = [b1[0] + foX, b1[1] + foY]; b2 = [b2[0] + foX, b2[1] + foY];
        quad([p00, p10, b2, b1], [26, 24, 30], 0.34 * bf);
      }
      /* people: tiny dots drifting inside the cell */
      if (cell.ppl.length) {
        var cw = Math.abs(p10[0] - p00[0]) + Math.abs(p01[0] - p00[0]);
        var chh = Math.abs(p01[1] - p00[1]) + Math.abs(p10[1] - p00[1]);
        var rad = Math.max(1.05, Math.min(cw, chh) * 0.10);
        ctx.fillStyle = rgba(PERSON, 0.88);
        for (var k = 0; k < cell.ppl.length; k++) {
          var pp = cell.ppl[k];
          var pu = (c + 0.5 + pp.ax * Math.sin(t * pp.sp1 + pp.ph1)) / cols;
          var pv = (r + 0.52 + pp.ay * Math.sin(t * pp.sp2 + pp.ph2)) / rows;
          var pc = bilerp(q, pu, pv);
          ctx.beginPath();
          ctx.arc(pc[0] + foX, pc[1] + foY, rad, 0, TAU);
          ctx.fill();
        }
      }
    }
  }
  /* slow blind-shadow band sweeping the whole face */
  var sv = ((t * 0.013 + fd.sweepSeed) % 1.25) - 0.125;
  var s0 = bilerp(q, 0, clamp(sv, 0, 1)), s1 = bilerp(q, 1, clamp(sv, 0, 1));
  var s2 = bilerp(q, 1, clamp(sv + 0.22, 0, 1)), s3 = bilerp(q, 0, clamp(sv + 0.22, 0, 1));
  quad([s0, s1, s2, s3], [18, 16, 22], 0.10);
  /* light wash unifies the face with the time of day */
  quad(q, L.wash, L.washA);
  /* outline */
  ctx.beginPath();
  ctx.moveTo(q[0][0], q[0][1]);
  for (var i = 1; i < 4; i++) ctx.lineTo(q[i][0], q[i][1]);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawBox(b, y0, hx, hz, hh, S, ox, oy, t, L, withFeed) {
  var ca = Math.cos(az), sa = Math.sin(az);
  var camDir = [sa, ca];
  var tmp = { x: b.x, z: b.z, hx: hx, hz: hz, h: y0 + hh, base: b.base, faces: b.faces };
  var vis = [];
  for (var f = 0; f < 4; f++) {
    var dn = FACEDEF[f].n[0] * camDir[0] + FACEDEF[f].n[1] * camDir[1];
    if (dn > 0.02) vis.push(f);
  }
  for (var vi = 0; vi < vis.length; vi++) {
    if (withFeed) {
      drawFace(tmp, vis[vi], S, ox, oy, t, L);
    } else {
      var def = FACEDEF[vis[vi]];
      var A = def.a(tmp), B = def.b(tmp);
      var q = [
        proj(A[0], tmp.h, A[1], S, ox, oy),
        proj(B[0], tmp.h, B[1], S, ox, oy),
        proj(B[0], y0, B[1], S, ox, oy),
        proj(A[0], y0, A[1], S, ox, oy)
      ];
      var bright = 0.8 + 0.24 * Math.max(0, def.n[0] * LIGHTDIR[0] + def.n[1] * LIGHTDIR[1]);
      quad(q, shade(b.base, bright * (1 - 0.45 * L.night)), 1);
      quad(q, L.wash, L.washA);
    }
  }
  /* roof */
  var tq = [
    proj(b.x - hx, y0 + hh, b.z - hz, S, ox, oy),
    proj(b.x + hx, y0 + hh, b.z - hz, S, ox, oy),
    proj(b.x + hx, y0 + hh, b.z + hz, S, ox, oy),
    proj(b.x - hx, y0 + hh, b.z + hz, S, ox, oy)
  ];
  quad(tq, shade(b.base, 1.1 * (1 - 0.4 * L.night)), 1);
  quad(tq, L.wash, L.washA * 0.8);
}

/* ---------- draw ------------------------------------------------------------ */
function draw() {
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  var S = Math.min(vw, vh), ox = (vw - S) / 2, oy = (vh - S) / 2;
  var t = nowT();
  var L = lightAt(t);
  az = idleAz(t) + azOff;

  ctx.fillStyle = '#060607';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  /* table: a darker rim slab, then the top */
  var rim = [[-1.44, -1.44], [1.44, -1.44], [1.44, 1.44], [-1.44, 1.44]].map(function (p) {
    var q = proj(p[0], 0, p[1], S, ox, oy); return [q[0], q[1] + S * 0.045];
  });
  quad(rim, [8, 6, 5], 1);
  var top = [[-1.44, -1.44], [1.44, -1.44], [1.44, 1.44], [-1.44, 1.44]].map(function (p) {
    return proj(p[0], 0, p[1], S, ox, oy);
  });
  quad(top, [17, 14, 11], 1);

  /* contact shadow under the block */
  var ctr = proj(0, 0, 0, S, ox, oy);
  ctx.beginPath();
  ctx.ellipse(ctr[0], ctr[1], S * 0.46, S * 0.17, 0, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();

  /* city slab + street grid */
  var slab = [[-1.06, -1.06], [1.06, -1.06], [1.06, 1.06], [-1.06, 1.06]].map(function (p) {
    return proj(p[0], 0, p[1], S, ox, oy);
  });
  quad(slab, [26, 23, 19], 1);
  ctx.strokeStyle = 'rgba(235,225,200,0.055)';
  ctx.lineWidth = Math.max(1, S * 0.004);
  var gx, gz, a, bq;
  var lines = [-0.6, -0.2, 0.2, 0.6];
  for (gx = 0; gx < lines.length; gx++) {
    a = proj(lines[gx], 0, -1.04, S, ox, oy); bq = proj(lines[gx], 0, 1.04, S, ox, oy);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(bq[0], bq[1]); ctx.stroke();
  }
  lines = [-0.5, 0, 0.5];
  for (gz = 0; gz < lines.length; gz++) {
    a = proj(-1.04, 0, lines[gz], S, ox, oy); bq = proj(1.04, 0, lines[gz], S, ox, oy);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(bq[0], bq[1]); ctx.stroke();
  }

  /* street lamps (glow grows with the night) */
  for (var li = 0; li < lamps.length; li++) {
    var lp = proj(lamps[li].x, 0, lamps[li].z, S, ox, oy);
    if (L.night > 0.04) {
      ctx.beginPath(); ctx.arc(lp[0], lp[1], S * 0.03, 0, TAU);
      ctx.fillStyle = rgba([255, 190, 110], 0.10 * L.night); ctx.fill();
      ctx.beginPath(); ctx.arc(lp[0], lp[1], Math.max(1.4, S * 0.0035), 0, TAU);
      ctx.fillStyle = rgba([255, 214, 150], 0.85 * L.night); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(lp[0], lp[1], Math.max(1, S * 0.0025), 0, TAU);
      ctx.fillStyle = 'rgba(160,155,145,0.6)'; ctx.fill();
    }
  }

  /* buildings, far to near */
  var ca = Math.cos(az), sa = Math.sin(az);
  var sorted = buildings.slice().sort(function (p1, p2) {
    return (p1.x * sa + p1.z * ca) - (p2.x * sa + p2.z * ca);
  });
  for (var bi = 0; bi < sorted.length; bi++) {
    var b = sorted[bi];
    drawBox(b, 0, b.hx, b.hz, b.h, S, ox, oy, t, L, true);
    if (b.roof) drawBox(b, b.h, b.roofHx, b.roofHz, b.roofH, S, ox, oy, t, L, false);
  }
}

/* ---------- audio: faint city hum, lazy + guarded ---------------------------- */
var AC = null, aMaster = null;
function ensureAudio() {
  if (AC) return;
  try {
    var Ctx = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!Ctx) return;
    AC = new Ctx();
    aMaster = AC.createGain(); aMaster.gain.value = 0.0;
    aMaster.connect(AC.destination);
    var o1 = AC.createOscillator(); o1.type = 'sine'; o1.frequency.value = 58;
    var g1 = AC.createGain(); g1.gain.value = 0.5;
    o1.connect(g1); g1.connect(aMaster); o1.start();
    var o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = 116.5;
    var g2 = AC.createGain(); g2.gain.value = 0.16;
    o2.connect(g2); g2.connect(aMaster); o2.start();
    var len = AC.sampleRate * 2;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0), last = 0, nr = mulberry32(4242);
    for (var i = 0; i < len; i++) { var w = nr() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3; }
    var ns = AC.createBufferSource(); ns.buffer = buf; ns.loop = true;
    var nf = AC.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 220;
    var ng = AC.createGain(); ng.gain.value = 0.35;
    ns.connect(nf); nf.connect(ng); ng.connect(aMaster); ns.start();
    aMaster.gain.setTargetAtTime(0.032, AC.currentTime, 1.2);
  } catch (e) { AC = null; aMaster = null; }
}

/* ---------- interaction ------------------------------------------------------- */
var dragging = false, downClientX = 0, dragBaseOff = 0;
var downT = 0, moved = 0, downSX = 0, downSY = 0;
var lastTapT = -1000;

function evPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [e.clientX - r.left, e.clientY - r.top, e.clientX];
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    var s = evPos(e);
    dragging = true; moved = 0;
    downSX = s[0]; downSY = s[1]; downClientX = s[2];
    dragBaseOff = azOff; downT = e.timeStamp || 0;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var s = evPos(e);
    moved = Math.max(moved, Math.abs(s[0] - downSX), Math.abs(s[1] - downSY));
    azOff = dragBaseOff + (s[2] - downClientX) * 0.0055;
  });
  function endPointer(e) {
    if (!dragging) return;
    dragging = false;
    var stamp = e.timeStamp || 0;
    if (stamp - downT < 350 && moved < 8) {                    /* a tap */
      if (stamp - lastTapT < 350) {                            /* double-tap: new layout */
        lastTapT = -1000;
        seedBase += 1013;
        buildCity();
        draw();
      } else {
        lastTapT = stamp;
      }
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function () { dragging = false; });
}

/* ---------- main loop ---------------------------------------------------------- */
draw();
var lastTs = -1;
function frame(ts) {
  if (lastTs < 0) lastTs = ts;
  var el = (ts - lastTs) / 1000; lastTs = ts;
  if (el > 0.1) el = 0.1;
  simTime += el;
  if (!dragging) azOff *= Math.exp(-el / 2.8);     /* ease back to the idle orbit */
  draw();
  requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
</script>
