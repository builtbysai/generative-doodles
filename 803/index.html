<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TBT</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #26242A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  // Strict palette: the chameleon band and one dark ground, nothing else.
  // The ground is a plain charcoal, #26242A: dark, neutral, and constant.
  // It never changes; only the canvas surface answers the viewpoint.
  var GROUND = "#26242A";
  var TEAL = "#2E9B8C";
  var COPPER = "#C06A2E";
  var VIOLET = "#7A4FB0";

  var CYCLE = 30;   // seconds: the watch-only viewpoint drift, one full loop
  var TAU = 0.14;   // seconds: the drag easing time constant

  // Frame one is t = 0 exactly: viewpoint 0, the teal end of the band.
  // T0 exists so QA can patch a copy to a later phase and inspect the
  // copper and violet readings; in the shipped piece it is 0.
  var T0 = 0;

  // The chameleon LUT: 512 precomputed readings along the band. The first
  // half mixes teal into copper, the second half mixes copper into
  // violet. There are no other stops: the surface can only ever be a mix
  // of two neighbouring pigments, the way the real chameleon paint flips
  // between its observed readings. No rainbow, no hue wheel.
  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  var C_TEAL = hexRGB(TEAL), C_COPPER = hexRGB(COPPER), C_VIOLET = hexRGB(VIOLET);
  var LUT_N = 512;
  var LUT = [];
  for (var li = 0; li < LUT_N; li++) {
    var lu = li / (LUT_N - 1);
    var a, b, f;
    if (lu < 0.5) { a = C_TEAL; b = C_COPPER; f = lu * 2; }
    else { a = C_COPPER; b = C_VIOLET; f = (lu - 0.5) * 2; }
    var lr = Math.round(a[0] + (b[0] - a[0]) * f);
    var lg = Math.round(a[1] + (b[1] - a[1]) * f);
    var lb = Math.round(a[2] + (b[2] - a[2]) * f);
    LUT.push("rgb(" + lr + "," + lg + "," + lb + ")");
  }
  function lutAt(v) {
    var i = Math.round(clamp01(v) * (LUT_N - 1));
    return LUT[i];
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    DPR = window.devicePixelRatio || 1;
    W = Math.round(w);
    H = Math.round(h);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

  // Viewpoint state. Until the visitor drags, the viewpoint drifts on
  // its own: v(t) = (1 - cos(2 pi t / 30)) / 2, teal at t = 0, violet at
  // t = 15, teal again at t = 30, an exact integer loop. Once a drag has
  // happened, the fallback never resumes: the viewpoint is a closed-form
  // exponential approach from the last recorded anchor toward the drag
  // target, and on release it simply stays where it was left.
  var interacted = false;
  var anchorT = 0, anchorV = 0, target = 0;
  var clockT = T0;

  function viewpointAt(t) {
    if (!interacted) {
      var ph = ((t % CYCLE) + CYCLE) % CYCLE;
      return (1 - Math.cos(2 * Math.PI * ph / CYCLE)) / 2;
    }
    return target + (anchorV - target) * Math.exp(-(t - anchorT) / TAU);
  }

  function setTarget(x) {
    var rect = canvas.getBoundingClientRect();
    var u = rect.width > 0 ? (x - rect.left) / rect.width : 0.5;
    var now = clockT;
    anchorV = viewpointAt(now);   // settle the past before re-anchoring
    anchorT = now;
    target = clamp01(u);
    interacted = true;
  }

  var dragging = false;
  canvas.addEventListener("pointerdown", function (e) {
    dragging = true;
    setTarget(e.clientX);
  });
  window.addEventListener("pointermove", function (e) {
    if (dragging) setTarget(e.clientX);
  });
  window.addEventListener("pointerup", function () { dragging = false; });
  window.addEventListener("pointercancel", function () { dragging = false; });

  function diamondPath(cx, cy, R) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - R);
    ctx.lineTo(cx + R, cy);
    ctx.lineTo(cx, cy + R);
    ctx.lineTo(cx - R, cy);
    ctx.closePath();
  }

  function draw(t) {
    clockT = t;
    if (W === 0) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var v = viewpointAt(t);
    var cx = W / 2, cy = H / 2;
    // The diamond is sized from its diagonal: the half-diagonal is a
    // fraction of the frame's smaller dimension, so the canvas fits the
    // narrow phone frame with wall to spare on every side.
    var R = Math.min(W, H) * (isPhone() ? 0.44 : 0.40);

    // A soft drop shadow: the diamond redrawn a breath lower in black at
    // low alpha. Layered flat shape, no blur; it lifts the canvas off
    // the dark wall just enough to read as a hung object.
    ctx.fillStyle = "#000000";
    ctx.globalAlpha = 0.35;
    diamondPath(cx, cy + R * 0.045, R);
    ctx.fill();
    ctx.globalAlpha = 1;

    // The chameleon surface, drawn as 56 vertical strips. Each strip
    // takes the LUT reading at the global viewpoint shifted by the
    // strip's own angle across the surface (plus or minus 0.16), so the
    // colour varies over the canvas the way it varies over the real
    // paint: one material, a spread of simultaneous readings.
    //
    // The strips are filled full-height inside a clip of the diamond
    // path, so the clip, not per-strip height arithmetic, defines the
    // silhouette. The clip edge is one continuous path, rasterised
    // antialiased: the diagonals land smooth. (An earlier build set
    // each strip's height to the diamond's extent at the strip centre,
    // which advanced the slanted edges in strip-width steps and read
    // pixelated.) The colours are untouched by the change of edge.
    ctx.save();
    diamondPath(cx, cy, R);
    ctx.clip();
    var STRIPS = 56;
    for (var i = 0; i < STRIPS; i++) {
      var x0 = cx - R + (2 * R) * (i / STRIPS);
      var x1 = cx - R + (2 * R) * ((i + 1) / STRIPS);
      var xm = (x0 + x1) / 2;
      ctx.fillStyle = lutAt(v + (xm - cx) / R * 0.16);
      ctx.fillRect(x0, cy - R, x1 - x0 + 1, 2 * R);
    }
    ctx.restore();

    // The sheen: layered flat alpha bands inside the diamond clip. A
    // primary vertical light band left of centre (seven slices, alpha
    // rising to 0.16 at its core) and a fainter broad band right of
    // centre, in white; a shade of four black bands gathering toward
    // the right vertex. The band drifts a little with the viewpoint, as
    // a light reading on a surface does when the viewer moves.
    ctx.save();
    diamondPath(cx, cy, R);
    ctx.clip();
    var sx = cx - R * 0.30 + (v - 0.5) * R * 0.10;
    var swd = R * 0.55;
    var prof = [0.03, 0.07, 0.12, 0.16, 0.12, 0.07, 0.03];
    ctx.fillStyle = "#FFFFFF";
    for (var s = 0; s < prof.length; s++) {
      ctx.globalAlpha = prof[s];
      ctx.fillRect(sx - swd / 2 + swd * (s / prof.length), cy - R, swd / prof.length + 1, 2 * R);
    }
    ctx.globalAlpha = 0.05;
    ctx.fillRect(cx + R * 0.18, cy - R, R * 0.5, 2 * R);
    ctx.fillStyle = "#000000";
    var shade = [0.04, 0.07, 0.10, 0.14];
    for (var d = 0; d < shade.length; d++) {
      ctx.globalAlpha = shade[d];
      ctx.fillRect(cx + R * (0.55 + 0.11 * d), cy - R, R * 0.12 + 1, 2 * R);
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // The edge: a quiet dark outline so the canvas holds its shape
    // against the wall at every reading, teal to violet.
    ctx.strokeStyle = "#000000";
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = Math.max(1, R * 0.006);
    diamondPath(cx, cy, R);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () { resize(); draw(clockT); });
  }
  window.addEventListener("resize", function () { resize(); draw(clockT); });

  resize();
  draw(T0);

  // The loop is anchored at load: frame one is the synchronous draw
  // above at t = T0, and the animation is elapsed-since-load, never a
  // wall clock.
  if (typeof requestAnimationFrame === "function") {
    var start = null;
    var tick = function (now) {
      if (start === null) start = now;
      draw(T0 + (now - start) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
