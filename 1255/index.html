<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irretrievable Replies</title>
<style>
  html, body { margin: 0; padding: 0; background: #17171A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
"use strict";

/* ---------- seeded hash (integer, deterministic) ---------- */
function hash(n){
  var x = (n * 2654435761) >>> 0;
  x ^= x >>> 15; x = (x * 2246822519) >>> 0;
  x ^= x >>> 13; x = (x * 3266489917) >>> 0;
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}

/* ---------- the letters (generated; no real letters) ----------
   token: [word, tag]  tag: "" plain | "G" gap (never printed) | vignette name (image word) */
var LETTERS = [
[["i",""],["keep","G"],["the",""],["photograph","photograph"],["from","G"],["that",""],["summer","G"],["by",""],["the","G"],["lake","lake"],["the",""],["back",""],["door","doorway"],["never","G"],["latched",""],["and",""],["you","G"],["are",""],["laughing",""],["in",""],["all","G"],["of",""],["them",""],["though","G"],["i","G"],["never",""],["learned","G"],["to",""],["swim",""],["that","G"],["year","G"],["the",""],["house","house"],["smelled",""],["of","G"],["rain","G"],["and",""],["somebody",""],["else's",""],["cooking","G"],["and","G"],["the",""],["road","road"],["home","doorway"],["took","G"],["all",""],["evening","G"],["if",""],["you","G"],["still","G"],["keep",""],["the",""],["letters","letter"],["i","G"],["sent",""],["that",""],["winter","G"],["write",""],["back","G"],["when","G"],["you",""],["can","G"],["because",""],["i",""],["have","G"],["a","G"],["million",""],["things",""],["to","G"],["tell",""],["you",""],["and",""],["none","G"],["of",""],["them","G"],["fit",""],["in",""],["an","G"],["envelope","letter"],["so",""],["i","G"],["am","G"],["telling",""],["them","G"],["now",""],["yours","G"]],
[["the","G"],["train","G"],["was",""],["late","G"],["and",""],["the","G"],["platform",""],["smelled","G"],["of",""],["rain",""],["i","G"],["watched",""],["the",""],["road","road"],["until","G"],["the",""],["light",""],["changed","G"],["you",""],["would",""],["have","G"],["laughed",""],["at","G"],["the",""],["man","G"],["with",""],["the",""],["wet",""],["newspaper","G"],["i",""],["bought",""],["two","G"],["tickets",""],["out","G"],["of",""],["habit","G"],["keep",""],["the",""],["blue",""],["one","G"],["i",""],["never",""],["sent","G"],["the",""],["letter","letter"],["i","G"],["wrote",""],["on","G"],["the",""],["train",""],["home","doorway"]],
[["your",""],["garden","G"],["gate",""],["was",""],["open","G"],["when",""],["i","G"],["passed",""],["the",""],["tree","tree"],["has","G"],["taken",""],["the",""],["whole",""],["fence","G"],["this",""],["year",""],["i","G"],["stood",""],["there",""],["like","G"],["a",""],["photograph","photograph"],["nobody","G"],["framed",""],["tell",""],["the",""],["house","house"],["i",""],["remember","G"],["its",""],["kitchen",""],["my",""],["hand","hand"],["still","G"],["reaches",""],["for","G"],["the",""],["second","G"],["cup",""],["empty","G"]]
];

/* ---------- reading schedule ---------- */
var SALT = 1255;
var variant = 0;
var words = [], R = [], DUR = [], totalDur = 0;

function dur(k){
  return 1.45 + 0.55 * hash(SALT + variant * 977 + k * 131);
}
function buildSchedule(){
  words = LETTERS[variant];
  R = []; DUR = []; totalDur = 0;
  var t = 0;
  for (var k = 0; k < words.length; k++){
    R.push(t);
    var d = dur(k);
    DUR.push(d);
    t += d + (words[k][1] && words[k][1] !== "G" ? 0.5 : 0); /* image words linger */
  }
  totalDur = t;
}
buildSchedule();

/* frame one: word 14 just being read (fixed phase) */
var T0 = R[14] + 0.45 * DUR[14];

/* ---------- interaction state (closed-form from events) ---------- */
var baseClock = T0;      /* reading clock at lastStamp */
var scrub = 0;           /* drag offset, clock-seconds */
var playing = true;
var lastStamp = -1;
var lastTapT = -10000, lastTapX = 0, lastTapY = 0;
var dragOn = false, dragMoved = false, downX = 0, downY = 0, downT = 0, lastPX = 0;

function phaseNow(){
  var p = baseClock + scrub;
  return p;
}

/* ---------- canvas / viewport ---------- */
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");
var W = 0, H = 0, PHONE = false;

function resize(){
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.max(50, Math.round(w)); H = Math.max(50, Math.round(h));
  cv.width = W; cv.height = H;
  PHONE = false;
  if (window.screen && Math.min(window.screen.width, window.screen.height) < 700) PHONE = true;
  if (!PHONE && H > W * 1.15) PHONE = true;
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
window.addEventListener("resize", resize);
resize();

/* ---------- palette ---------- */
var BG = "#17171A", INK = "#D8D2C4", SEPIA = "#A68B5B",
    GAPLINE = "#4A4A57", ACCENT = "#8A4B3A", EMPTY = "#2E2E34";

/* ---------- vignettes (simple sepia glyphs) ---------- */
function vigDoorway(s){
  ctx.strokeRect(-0.30*s, -0.42*s, 0.60*s, 0.84*s);
  ctx.beginPath(); /* ajar door */
  ctx.moveTo(-0.30*s, -0.42*s); ctx.lineTo(0.02*s, -0.30*s);
  ctx.lineTo(0.02*s, 0.42*s); ctx.lineTo(-0.30*s, 0.42*s); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); /* light wedge on the floor */
  ctx.moveTo(0.02*s, 0.42*s); ctx.lineTo(0.42*s, 0.42*s); ctx.lineTo(0.10*s, 0.20*s); ctx.closePath();
  ctx.globalAlpha *= 0.5; ctx.fill(); ctx.globalAlpha /= 0.5;
}
function vigLake(s){
  ctx.beginPath(); ctx.arc(0, -0.05*s, 0.16*s, Math.PI, 0); ctx.stroke(); /* sun half-disc */
  ctx.beginPath(); ctx.moveTo(-0.48*s, -0.05*s); ctx.lineTo(0.48*s, -0.05*s); ctx.stroke(); /* horizon */
  for (var r = 0; r < 3; r++){
    var y = (0.10 + r * 0.13) * s, amp = 0.03*s;
    ctx.beginPath();
    for (var x = -0.44; x <= 0.44; x += 0.08){
      var yy = y + Math.sin(x * 14 + r * 2.1) * amp;
      if (x === -0.44) ctx.moveTo(x*s, yy); else ctx.lineTo(x*s, yy);
    }
    ctx.stroke();
  }
}
function vigHouse(s){
  ctx.strokeRect(-0.30*s, -0.02*s, 0.60*s, 0.44*s);
  ctx.beginPath(); ctx.moveTo(-0.40*s, -0.02*s); ctx.lineTo(0, -0.34*s); ctx.lineTo(0.40*s, -0.02*s); ctx.stroke();
  ctx.strokeRect(-0.08*s, 0.12*s, 0.16*s, 0.30*s); /* door */
  ctx.strokeRect(0.12*s, 0.06*s, 0.11*s, 0.11*s);  /* window */
}
function vigPhotograph(s){
  ctx.strokeRect(-0.42*s, -0.34*s, 0.84*s, 0.68*s);
  ctx.strokeRect(-0.36*s, -0.28*s, 0.72*s, 0.56*s);
  ctx.beginPath(); ctx.arc(-0.13*s, -0.06*s, 0.075*s, 0, 6.2832); ctx.stroke(); /* head 1 */
  ctx.beginPath(); ctx.arc(0.14*s, -0.06*s, 0.075*s, 0, 6.2832); ctx.stroke();  /* head 2 */
  ctx.beginPath(); ctx.arc(-0.13*s, 0.30*s, 0.15*s, Math.PI, 0); ctx.stroke();  /* shoulders */
  ctx.beginPath(); ctx.arc(0.14*s, 0.30*s, 0.15*s, Math.PI, 0); ctx.stroke();
}
function vigHand(s){
  ctx.beginPath(); ctx.arc(0, 0.10*s, 0.20*s, 0, 6.2832); ctx.stroke(); /* palm */
  var fx = [-0.16, -0.055, 0.055, 0.16];
  for (var i = 0; i < 4; i++){
    ctx.beginPath();
    ctx.moveTo(fx[i]*s, -0.02*s);
    ctx.lineTo(fx[i]*s*1.08, (-0.34 - 0.05*Math.cos(i*1.1))*s);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(fx[i]*s*1.08, (-0.36 - 0.05*Math.cos(i*1.1))*s, 0.035*s, 0, 6.2832); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(0.18*s, 0.16*s); ctx.lineTo(0.36*s, 0.02*s); ctx.stroke(); /* thumb */
}
function vigTree(s){
  ctx.beginPath(); ctx.moveTo(0, 0.44*s); ctx.lineTo(0, -0.02*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -0.02*s); ctx.lineTo(-0.16*s, -0.20*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -0.02*s); ctx.lineTo(0.15*s, -0.24*s); ctx.stroke();
  ctx.beginPath(); ctx.arc(-0.10*s, -0.26*s, 0.17*s, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.arc(0.12*s, -0.28*s, 0.15*s, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -0.38*s, 0.16*s, 0, 6.2832); ctx.stroke();
}
function vigLetter(s){
  ctx.strokeRect(-0.42*s, -0.26*s, 0.84*s, 0.52*s);
  ctx.beginPath(); ctx.moveTo(-0.42*s, -0.26*s); ctx.lineTo(0, 0.06*s); ctx.lineTo(0.42*s, -0.26*s); ctx.stroke();
}
function vigRoad(s){
  ctx.beginPath(); ctx.moveTo(-0.46*s, 0.42*s); ctx.lineTo(-0.05*s, -0.40*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.46*s, 0.42*s); ctx.lineTo(0.05*s, -0.40*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0.30*s); ctx.lineTo(0, 0.16*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0.02*s); ctx.lineTo(0, -0.06*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -0.20*s); ctx.lineTo(0, -0.26*s); ctx.stroke();
}
var VIG = { doorway: vigDoorway, lake: vigLake, house: vigHouse, photograph: vigPhotograph,
            hand: vigHand, tree: vigTree, letter: vigLetter, road: vigRoad };

function bloomEnv(age){
  if (age < 0) return 0;
  if (age < 1.2) return age / 1.2;          /* bloom in */
  if (age < 8.5) return 1;                  /* hold */
  if (age < 13.5) return 1 - (age - 8.5) / 5; /* fade */
  return 0;
}

/* ---------- draw ---------- */
function draw(phase){
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

  var bandTop = H * 0.80;
  var s = Math.min(W, H) * (PHONE ? 0.20 : 0.17);

  /* blooms (pure function of phase) */
  var alive = [];
  for (var k = 0; k < words.length; k++){
    var tag = words[k][1];
    if (tag && tag !== "G"){
      var e = bloomEnv(phase - R[k]);
      if (e > 0) alive.push([k, e]);
    }
  }
  ctx.strokeStyle = SEPIA; ctx.fillStyle = SEPIA;
  ctx.lineWidth = Math.max(1.2, s * 0.022);
  ctx.lineCap = "round";
  for (var a = 0; a < alive.length; a++){
    var kk = alive[a][0], ee = alive[a][1];
    if (alive.length > 5 && a < alive.length - 5) ee *= 0.3; /* cap: oldest yield */
    var px = (0.16 + 0.68 * hash(kk * 31 + 7)) * W;
    var py = (0.13 + 0.48 * hash(kk * 57 + 3)) * H;
    if (py > bandTop - s * 0.6) py = bandTop - s * 0.6;
    ctx.save();
    ctx.translate(px, py);
    ctx.globalAlpha = 0.8 * ee;
    VIG[words[kk][1]](s);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  /* separator */
  ctx.strokeStyle = EMPTY; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, bandTop); ctx.lineTo(W, bandTop); ctx.stroke();

  /* current word index */
  var c = 0;
  for (var i = 0; i < words.length; i++){ if (R[i] <= phase) c = i; }

  /* text band */
  var fs = Math.round(H * (PHONE ? 0.034 : 0.030));
  ctx.font = fs + "px 'Courier New', monospace";
  ctx.textBaseline = "alphabetic";
  var baseY = bandTop + (H - bandTop) * 0.58;
  var anchorX = W * 0.40;
  var spaceW = ctx.measureText(" ").width;

  /* x positions relative to current word */
  var xs = new Array(words.length);
  xs[c] = anchorX;
  var x = anchorX;
  for (var j = c - 1; j >= 0; j--){
    x -= ctx.measureText(words[j + 1][0]).width + spaceW;
    xs[j] = x;
  }
  x = anchorX;
  for (var j2 = c + 1; j2 < words.length; j2++){
    x += ctx.measureText(words[j2 - 1][0]).width + spaceW;
    xs[j2] = x;
  }

  for (var m = 0; m < words.length; m++){
    var wx = xs[m];
    var ww = ctx.measureText(words[m][0]).width;
    if (wx + ww < -20 || wx > W + 20) continue;
    var tagm = words[m][1];
    if (tagm === "G"){
      /* the unprinted side: an underscore run, never the word */
      var n_ = Math.max(2, Math.round(ww / ctx.measureText("_").width));
      var us = "";
      for (var u = 0; u < n_; u++) us += "_";
      ctx.fillStyle = GAPLINE;
      ctx.globalAlpha = (m <= c) ? 0.95 : 0.4;
      ctx.fillText(us, wx, baseY);
    } else {
      ctx.fillStyle = INK;
      ctx.globalAlpha = (m < c) ? 1 : (m === c ? 1 : 0.25);
      ctx.fillText(words[m][0], wx, baseY);
    }
    if (m === c){
      ctx.globalAlpha = 1;
      ctx.fillStyle = ACCENT;
      ctx.fillRect(wx, baseY + fs * 0.22, ww, Math.max(2, fs * 0.09));
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------- loop ---------- */
function tick(stamp){
  if (lastStamp < 0) lastStamp = stamp;
  if (playing) baseClock += (stamp - lastStamp) / 1000;
  lastStamp = stamp;
  var p = phaseNow();
  if (p > totalDur + 8){ baseClock -= (totalDur + 8); p = phaseNow(); }
  if (p < 0){ baseClock -= p; p = 0; }
  draw(p);
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(tick);
}

/* ---------- pointer: tap = pause, double-tap = reseed, drag = scrub ---------- */
function pt(e){ return [e.clientX, e.clientY]; }
cv.addEventListener("pointerdown", function(e){
  var p = pt(e); dragOn = true; dragMoved = false;
  downX = lastPX = p[0]; downY = p[1]; downT = performance.now();
});
cv.addEventListener("pointermove", function(e){
  if (!dragOn) return;
  var p = pt(e);
  var dx = p[0] - lastPX; lastPX = p[0];
  if (Math.abs(p[0] - downX) > 8) dragMoved = true;
  if (dragMoved){
    scrub += dx * 0.03; /* 33px ≈ one reading-second */
    var pnow = phaseNow();
    if (pnow < 0) scrub -= pnow;
    if (pnow > totalDur + 8) scrub -= (pnow - (totalDur + 8));
  }
});
cv.addEventListener("pointerup", function(e){
  if (!dragOn) return;
  dragOn = false;
  var now = performance.now();
  if (!dragMoved && now - downT < 350){
    var p = pt(e);
    if (now - lastTapT < 350 && Math.abs(p[0] - lastTapX) < 40 && Math.abs(p[1] - lastTapY) < 40){
      /* double-tap: reseed the letter, restart the reading */
      variant = (variant + 1) % LETTERS.length;
      buildSchedule();
      baseClock = 0; scrub = 0; playing = true;
      lastTapT = -10000;
    } else {
      playing = !playing; /* tap: pause / resume */
      lastTapT = now; lastTapX = p[0]; lastTapY = p[1];
    }
  }
});

/* synchronous first frame at the fixed phase, then the loop */
draw(T0);
if (typeof requestAnimationFrame === "function") requestAnimationFrame(tick);
})();
</script>
</body>
</html>
