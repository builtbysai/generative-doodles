<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Driverless Car Sings</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random in piece logic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1439000);
  function a4(x) { return Math.round(x * 10000) / 10000; }
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function rect(x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
  function dot(x, y, r, fill) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }

  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var minScreen = Math.min(window.screen.width, window.screen.height);
    phone = minScreen < 700 || H > W * 1.15;
    canvas.width = W; canvas.height = H;
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
    window.addEventListener('resize', size);
  }

  // --- Tape sequencer: 27 tapes, two decks alternating -------------------
  // Deck A plays tape k, deck B plays tape k+1 at lower gain; 6 s per step.
  // Per-tape gain: main tape fades in/out over its slot; secondary is soft.
  var TAPE_N = 27;
  var SLOT = 6;
  var tapeColor = [];
  for (var i = 0; i < TAPE_N; i++) {
    var c = ['#e8c832', '#c01818', '#ece8dc'][i % 3];
    tapeColor.push(c);
  }
  // Fragment type per tape: 0 field, 1 autobahn sign, 2 petrol station.
  var tapeFrag = [];
  for (var j = 0; j < TAPE_N; j++) tapeFrag.push(Math.floor(rnd() * 3));

  // Interaction state: recorded drag events, closed-form over time.
  var drags = []; // {kind:'label', tape, t} or {kind:'car', t, dx}
  var labelOverride = null; // {tape, t}
  var carSway = []; // {t, amp}

  function seqAt(t) {
    var step = Math.floor(t / SLOT) % TAPE_N;
    var frac = (t % SLOT) / SLOT;
    var mainGain = frac < 0.15 ? frac / 0.15 : (frac > 0.85 ? (1 - frac) / 0.15 : 1);
    var secGain = 0.35 * (1 - mainGain * 0.5);
    return { main: step, sec: (step + 1) % TAPE_N, mainGain: mainGain, secGain: secGain };
  }
  function activeTape(t) {
    if (labelOverride && t - labelOverride.t < 12) return { main: labelOverride.tape, sec: (labelOverride.tape + 1) % TAPE_N, mainGain: 1, secGain: 0.3, override: true };
    return seqAt(t);
  }

  // Landscape fragment drawing (flat shapes only).
  function drawFragment(x, y, w, h, type, seed) {
    var r = mulberry32(1439000 + seed * 7919);
    if (type === 0) {
      rect(x, y, w, h, '#5a6a3a');
      rect(x, y + h * 0.6, w, h * 0.4, '#4a5a30');
      for (var k = 0; k < 5; k++) {
        var fx = x + r() * w, fy = y + r() * h * 0.5;
        rect(fx, fy, 3, 10, '#3a4a28');
      }
    } else if (type === 1) {
      // Autobahn sign as flat colour blocks only — no letters, per the
      // numbers-only text rule (cassette numbers are the sole text).
      rect(x, y, w, h, '#1a4a8a');
      rect(x + w * 0.2, y + h * 0.2, w * 0.6, h * 0.6, '#ece8dc');
      rect(x + w * 0.35, y + h * 0.35, w * 0.3, h * 0.3, '#1a4a8a');
    } else {
      rect(x, y, w, h, '#ece8dc');
      rect(x, y, h * 0.3, h, '#c01818');
      rect(x + w * 0.3, y + h * 0.3, w * 0.4, h * 0.4, '#3a3f44');
    }
  }

  function draw(t) {
    // Frame one is draw(0) via the boot flag below; t is piece time only.
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    rect(0, 0, W, H, '#141210');

    var seq = activeTape(t);
    var frag = tapeFrag[seq.main];

    // --- Cassette row across the top ---
    var rowH = phone ? 44 : 40;
    var cols = phone ? 14 : 27;
    var rows = Math.ceil(TAPE_N / cols);
    var cw = W / cols, ch = rowH / rows;
    for (var i = 0; i < TAPE_N; i++) {
      var cx = (i % cols) * cw, cy = Math.floor(i / cols) * ch;
      var lit = (i === seq.main) ? 1 : (i === seq.sec ? 0.55 : 0.25);
      var base = tapeColor[i];
      rect(cx + 1, cy + 1, cw - 2, ch - 2, rgba(base, 0.25 + 0.75 * lit * 0.4));
      ctx.fillStyle = rgba(base, a4(0.35 + 0.65 * lit));
      ctx.fillRect(cx + 1, cy + 1, cw - 2, ch - 2);
      if (i === seq.main) {
        ctx.strokeStyle = rgba('#ece8dc', 0.9);
        ctx.lineWidth = 2;
        ctx.strokeRect(cx + 2, cy + 2, cw - 4, ch - 4);
      }
      ctx.fillStyle = '#141210';
      ctx.font = Math.max(9, Math.floor(ch * 0.45)) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), cx + cw / 2, cy + ch / 2);
    }
    var topY = rowH;

    // --- Landscape strips: film frames above and below the car ---
    var stripH = Math.max(60, (H - topY) * 0.16);
    var scroll = (t * 22) % 240; // fragments scroll past; car never moves
    var fragW = 240;
    var off = (seq.main * 37) % fragW; // drag-selected tape shifts the strip to its fragment
    if (seq.override) off = (seq.main * 37) % fragW;
    for (var s = 0; s < 2; s++) {
      var sy = s === 0 ? topY : H - stripH;
      rect(0, sy, W, stripH, '#1a1712');
      for (var fx = -1; fx < Math.ceil(W / fragW) + 1; fx++) {
        var idx = ((Math.floor((t * 22) / fragW) + fx) % 12 + 12) % 12;
        var px = fx * fragW - scroll + (s === 0 ? -off : off);
        var ftype = (idx + seq.main) % 3;
        drawFragment(px + 4, sy + 6, fragW - 8, stripH - 12, ftype, idx * 3 + s);
        ctx.strokeStyle = rgba('#ece8dc', 0.25);
        ctx.lineWidth = 1;
        ctx.strokeRect(px, sy, fragW, stripH);
      }
    }

    // --- Road: receding trapezoid, empty ---
    var roadTop = topY + stripH, roadBot = H - stripH;
    var midY = (roadTop + roadBot) / 2;
    ctx.fillStyle = '#3a3f44';
    ctx.beginPath();
    ctx.moveTo(W * 0.5 - 60, roadTop);
    ctx.lineTo(W * 0.5 + 60, roadTop);
    ctx.lineTo(W, roadBot);
    ctx.lineTo(0, roadBot);
    ctx.closePath();
    ctx.fill();
    // Centre dashes, receding.
    ctx.fillStyle = rgba('#ece8dc', 0.5);
    var dy = roadTop + 10;
    var dw = 6;
    while (dy < roadBot - 20) {
      var pw = (dy - roadTop) / (roadBot - roadTop);
      rect(W / 2 - dw * pw - 2, dy, 4 + 8 * pw, 3 + 10 * pw, rgba('#ece8dc', 0.5));
      dy += 26 + 40 * pw;
    }

    // --- Car: static center sprite, three singing figures, no driver ---
    var sway = 0;
    for (var d = 0; d < carSway.length; d++) {
      var el = t - carSway[d].t;
      if (el >= 0 && el < 4) sway += carSway[d].amp * Math.sin(el * Math.PI * 2 / 1.2) * Math.exp(-el * 0.8);
    }
    var carW = Math.min(W * 0.62, 560), carH = carW * 0.42;
    var carX = W / 2 - carW / 2, carY = midY - carH / 2 + sway;
    // Body: cream with rust patches, unroadworthy.
    rect(carX, carY + carH * 0.35, carW, carH * 0.45, '#e8e2d4');
    rect(carX + carW * 0.12, carY + carH * 0.12, carW * 0.76, carH * 0.35, '#e8e2d4');
    rect(carX + carW * 0.05, carY + carH * 0.72, carW * 0.9, carH * 0.12, '#9a4a28');
    rect(carX + carW * 0.7, carY + carH * 0.2, carW * 0.12, carH * 0.18, '#9a4a28');
    rect(carX + carW * 0.2, carY + carH * 0.55, carW * 0.08, carH * 0.1, '#9a4a28');
    // Windows: three passengers, driver seat EMPTY.
    var winY = carY + carH * 0.18, winH = carH * 0.28;
    var seats = [0.16, 0.44, 0.72]; // three women; driver position (leftmost front) left empty
    for (var p = 0; p < 3; p++) {
      var wx = carX + carW * seats[p];
      rect(wx, winY, carW * 0.2, winH, '#1a2a2a');
      // Head + singing mouth (mouth opens with a sine per figure).
      var hx = wx + carW * 0.1, hy = winY + winH * 0.45;
      dot(hx, hy, carH * 0.09, '#d4a880');
      var mouth = (Math.sin(t * 2.2 + p * 1.7) * 0.5 + 0.5) * carH * 0.07;
      rect(hx - 2, hy + carH * 0.07, 5, Math.max(1, mouth), '#141210');
      // Sway: shoulders bob slightly.
      rect(wx + carW * 0.02, winY + winH * 0.7, carW * 0.16, winH * 0.3, ['#c01818', '#e8c832', '#1a4a8a'][p]);
    }
    // Empty driver seat: window outline only, no figure.
    var dwx = carX + carW * 0.02;
    ctx.strokeStyle = rgba('#141210', 0.6);
    ctx.lineWidth = 2;
    ctx.strokeRect(dwx, winY, carW * 0.12, winH);
    // Wheels.
    dot(carX + carW * 0.22, carY + carH * 0.82, carH * 0.12, '#141210');
    dot(carX + carW * 0.78, carY + carH * 0.82, carH * 0.12, '#141210');
    dot(carX + carW * 0.22, carY + carH * 0.82, carH * 0.05, '#8a8f94');
    dot(carX + carW * 0.78, carY + carH * 0.82, carH * 0.05, '#8a8f94');
    // Headlight glow hint (flat alpha, no gradient).
    rect(carX + carW, carY + carH * 0.5, 12, 6, rgba('#f2c832', 0.5));
  }

  // Pointer: drag a cassette label = play it louder + shift strip to its fragment.
  // Drag the car = sway only, never steering, never moving the car.
  var down = null;
  function pos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX)) - r.left;
    var cy = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY)) - r.top;
    return { x: cx, y: cy };
  }
  function labelAt(x, y) {
    var rowH = phone ? 44 : 40;
    if (y > rowH) return -1;
    var cols = phone ? 14 : 27;
    var col = Math.floor(x / (W / cols)), row = Math.floor(y / (rowH / Math.ceil(TAPE_N / cols)));
    var idx = row * cols + col;
    return idx < TAPE_N ? idx : -1;
  }
  function onDown(e) {
    var p = pos(e);
    var lab = labelAt(p.x, p.y);
    if (lab >= 0) { down = { kind: 'label', tape: lab }; return; }
    // Car zone: mid-band of the canvas.
    var topY = (phone ? 44 : 40) + Math.max(60, (H - (phone ? 44 : 40)) * 0.16);
    var botY = H - Math.max(60, (H - (phone ? 44 : 40)) * 0.16);
    if (p.y > topY && p.y < botY) down = { kind: 'car', x: p.x };
  }
  function onMove(e) {
    if (!down) return;
    var p = pos(e);
    if (down.kind === 'label') {
      var lab = labelAt(p.x, p.y);
      if (lab >= 0) down.tape = lab;
    } else if (down.kind === 'car') {
      var dx = p.x - down.x;
      if (Math.abs(dx) > 12) { carSway.push({ t: nowT, amp: Math.min(6, Math.abs(dx) * 0.05) }); down.x = p.x; }
    }
  }
  function onUp() {
    if (down && down.kind === 'label') labelOverride = { tape: down.tape, t: nowT };
    down = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // Boot flag: frame one is draw(0); the clock starts only with the rAF loop.
  var nowT = 0;
  var start = null;
  draw(0);
  function loop(ts) {
    if (start === null) start = ts;
    nowT = (ts - start) / 1000;
    draw(nowT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
