<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№94 · Dot Tide</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5EFE0; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(43,58,143,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to raise a second wave</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.94 Dot Tide: grid 28 x 48, seamless 8s diagonal wave, drag raises a second wave source
const COLS=28, ROWS=48;
let dragPt=null, dragging=false, secondAmp=0, lastMs=null;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  secondAmp+=(((dragging)?1:0)-secondAmp)*Math.min(1,dt*5+ (dt===0?0:0));
  if(dt===0 && dragging) secondAmp=1;
  const t=nowMs/1000;
  ctx.fillStyle='#F5EFE0'; ctx.fillRect(0,0,w,h);
  const phone=isPhone();
  let ox=0, oy=0, dw=w, dh=h;
  if(!phone){ const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; dw=S; dh=S; }
  const cellW=dw/COLS, cellH=dh/ROWS, cell=Math.min(cellW,cellH);
  const baseR=cell/5;
  const speed=Math.PI*2/8, k=Math.PI*2*2;
  let gx=-1, gy=-1;
  if(dragPt){ gx=(dragPt[0]-ox)/cellW-0.5; gy=(dragPt[1]-oy)/cellH-0.5; }
  ctx.fillStyle='#2B3A8F';
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const dist=((c+0.5)*cellW+(r+0.5)*cellH)/(dw+dh);
      let s=Math.sin(t*speed - dist*k);
      if(secondAmp>0.01 && gx>=0){ const d2=Math.hypot(c-gx, r-gy)/Math.max(COLS,ROWS); s+=secondAmp*Math.sin(t*speed - d2*k*1.4); s=clamp(s,-1.4,1.4)/1.4*1.0; s=clamp(s,-1,1); }
      const wave=0.5+0.5*s;
      const rad=baseR*(0.12+2.88*wave);
      if(rad<0.25) continue;
      const x=ox+(c+0.5)*cellW, y=oy+(r+0.5)*cellH;
      ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
    }
  }
  if(COLS*ROWS!==1344) console.assert(false,'dots',COLS*ROWS);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; dragPt=[e.clientX,e.clientY]; secondAmp=1; });
canvas.addEventListener('pointermove',e=>{ if(dragging) dragPt=[e.clientX,e.clientY]; });
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(2000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
