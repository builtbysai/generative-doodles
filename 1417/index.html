<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helping Hands</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e2d4; overflow: hidden; }
  canvas { display: block; background: #e8e2d4; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = null;
  if (typeof document !== 'undefined' && document.getElementById) {
    canvas = document.getElementById('c');
  }
  if (!canvas) return;
  var ctx = canvas.getContext('2d');

  // ---------- seeded PRNG (mulberry32), never Math.random ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1417000);
  // Seeded smudge field (fixed positions, drawn every frame identically).
  var smudges = [];
  for (var si = 0; si < 14; si++) {
    smudges.push({ x: rng(), y: rng(), rx: 0.02 + rng() * 0.05, ry: 0.008 + rng() * 0.02, rot: rng() * 3.14159 });
  }
  // Per-hand wobble phases, seeded.
  var wob1 = rng() * 6.2832, wob2 = rng() * 6.2832;

  function ra(v) { return Math.round(v * 10000) / 10000; }
  function rgba(r, g, b, a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + ra(a) + ')'; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ---------- viewport / phone ----------
  var W = 1280, H = 900, phone = false, curS = 900;
  function vpSize() {
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      return { w: window.visualViewport.width, h: window.visualViewport.height };
    }
    if (typeof window !== 'undefined' && typeof window.innerWidth === 'number') {
      return { w: window.innerWidth, h: window.innerHeight };
    }
    return { w: 1280, h: 900 };
  }
  function detectPhone() {
    var sw = 99999;
    if (typeof window !== 'undefined' && window.screen &&
        typeof window.screen.width === 'number') {
      sw = Math.min(window.screen.width, window.screen.height);
    }
    if (sw < 700) return true;
    if (H > W * 1.15) return true;
    return false;
  }
  function sizeCanvas() {
    var s = vpSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    phone = detectPhone();
  }
  sizeCanvas();
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { sizeCanvas(); });
  }
  if (typeof window !== 'undefined' && window.visualViewport &&
      window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { sizeCanvas(); });
  }

  // ---------- palette ----------
  var PAPER = '#e8e2d4';
  var FIG = ['#26241f', '#7a6a55']; // figure 0 (dark), figure 1 (brown)
  var TABLE_WOOD = '#8a6a44';
  var WIN_GLASS = '#9ab4c0';
  var BLUSH = '#c08552';
  var SHADOW = '#4a4a44';

  // ---------- object params: base, target, eased (closed-form over events) ----------
  var baseParams = { rx: 0.125, ry: 0.085, w: 0.15, h: 0.26 }; // fractions of W / H
  var target = { rx: baseParams.rx, ry: baseParams.ry, w: baseParams.w, h: baseParams.h };
  // Easing events per key: [{t, from, to}]; folded closed-form, tau 1.5 s.
  var evLog = { rx: [], ry: [], w: [], h: [] };
  var TAU = 1.5;
  function easedVal(key, t) {
    var evs = evLog[key], v = baseParams[key];
    for (var i = 0; i < evs.length; i++) {
      var e = evs[i];
      if (t < e.t) break;
      v = e.to - (e.to - e.from) * Math.exp(-(t - e.t) / TAU);
    }
    return v;
  }
  function easedParams(t) {
    return { rx: easedVal('rx', t), ry: easedVal('ry', t), w: easedVal('w', t), h: easedVal('h', t) };
  }

  // ---------- drag ----------
  var dragging = false, dragObj = null; // 'table' | 'window'
  var clockNow = 0;
  function pointerPos(e) {
    var x = 0, y = 0;
    if (typeof e.offsetX === 'number') { x = e.offsetX; y = e.offsetY; }
    else if (typeof e.clientX === 'number') {
      var r = { left: 0, top: 0 };
      if (canvas.getBoundingClientRect) { try { r = canvas.getBoundingClientRect(); } catch (err) {} }
      x = e.clientX - r.left; y = e.clientY - r.top;
    }
    return { x: x, y: y };
  }
  function objectCenter() { return { x: 0.74 * W, y: 0.46 * H }; }
  function onDown(e) {
    var p = pointerPos(e), oc = objectCenter();
    var dx = Math.abs(p.x - oc.x), dy = Math.abs(p.y - oc.y);
    var phase = phaseAt(clockNow);
    var near = false;
    if (phase.obj === 'table') {
      near = dx < 0.22 * W && dy < 0.20 * H;
    } else {
      near = dx < 0.16 * W && dy < 0.22 * H;
    }
    if (near) { dragging = true; dragObj = phase.obj; }
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pointerPos(e), oc = objectCenter();
    var dx = p.x - oc.x, dy = p.y - oc.y;
    if (dragObj === 'table') {
      var nrx = clamp(Math.abs(dx) / W, 0.06, 0.20);
      var nry = clamp(Math.abs(dy) / curS * 0.7, 0.03, 0.12);
      pushEvent('rx', nrx); pushEvent('ry', nry);
      target.rx = nrx; target.ry = nry;
    } else {
      var nw = clamp(2 * Math.abs(dx) / W, 0.08, 0.24);
      var nh = clamp(2 * Math.abs(dy) / H, 0.14, 0.38);
      pushEvent('w', nw); pushEvent('h', nh);
      target.w = nw; target.h = nh;
    }
  }
  function pushEvent(key, to) {
    var from = easedVal(key, clockNow);
    evLog[key].push({ t: clockNow, from: from, to: to });
  }
  function onUp() { dragging = false; dragObj = null; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---------- phase / roles ----------
  // 60 s loop: 0-30 table (roles A), 30-60 window (roles B). Swap animates
  // during the last 2.5 s of each phase; frame one (t=0) is stable, mid-table.
  function phaseAt(t) {
    var cyc = ((t % 60) + 60) % 60;
    var idx = cyc < 30 ? 0 : 1;
    var pt = cyc < 30 ? cyc : cyc - 30;
    var swap = pt > 27.5 ? smooth((pt - 27.5) / 2.5) : 0;
    return {
      obj: idx === 0 ? 'table' : 'window',
      idx: idx,
      pt: pt,
      swap: swap,
      faceFig: idx === 0 ? 0 : 1,   // figure supplying the face
      armsFig: idx === 0 ? 1 : 0,   // figure supplying the arms
      learner: idx === 1            // window phase = learner's version
    };
  }

  // ---------- outline paths ----------
  // Returns point on outline for progress u in [0,1), plus tangent angle.
  function outlinePoint(obj, prm, oc, u) {
    if (obj === 'table') {
      var th = u * 2 * Math.PI;
      return { x: oc.x + Math.cos(th) * prm.rx * W,
               y: oc.y + Math.sin(th) * prm.ry * curS,
               a: th + Math.PI / 2 };
    }
    // window: rectangle perimeter, starting top-left, clockwise.
    var w = prm.w * W, h = prm.h * H;
    var x0 = oc.x - w / 2, y0 = oc.y - h / 2;
    var per = 2 * (w + h), d = u * per;
    if (d < w) return { x: x0 + d, y: y0, a: 0 };
    if (d < w + h) return { x: x0 + w, y: y0 + (d - w), a: Math.PI / 2 };
    if (d < 2 * w + h) return { x: x0 + w - (d - w - h), y: y0 + h, a: Math.PI };
    return { x: x0, y: y0 + h - (d - 2 * w - h), a: -Math.PI / 2 };
  }
  function traceProgress(phase, pt) {
    var u = pt / 30;
    if (phase.learner) {
      // slower, with hesitation dwells: progress lags and breathes.
      u = u * 0.88 - 0.03 * Math.sin(2 * Math.PI * 3 * u);
    }
    return clamp(u, 0, 1);
  }

  // ---------- drawing helpers (one shape per beginPath; dots as rects) ----------
  function dot(x, y, s, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  function disc(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function ellipse(x, y, rx, ry, color) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function line(x1, y1, x2, y2, wdt, color) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = wdt;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  function curve(x1, y1, cx, cy, x2, y2, wdt, color) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(cx, cy, x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = wdt;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // ---------- figure ----------
  // Draws one figure (torso + head, no face). Returns shoulder points.
  function drawFigure(fx, fy, color, headRyScale) {
    var S = Math.min(W, H);
    var headR = 0.085 * S;
    var headCx = fx, headCy = fy;
    // torso: shoulders to waist cut at 0.92H
    ctx.fillStyle = color;
    ctx.fillRect(fx - 0.075 * W, headCy + headR * 0.55, 0.15 * W, 0.92 * H - (headCy + headR * 0.55));
    // shoulders as discs to soften the top
    disc(fx - 0.075 * W, headCy + headR * 0.55, 0.028 * W, color);
    disc(fx + 0.075 * W, headCy + headR * 0.55, 0.028 * W, color);
    // head
    ellipse(headCx, headCy, headR, headR * headRyScale, color);
    // waist cut line
    line(fx - 0.075 * W, 0.92 * H, fx + 0.075 * W, 0.92 * H, 2, SHADOW);
    return {
      shL: { x: fx - 0.075 * W, y: headCy + headR * 0.6 },
      shR: { x: fx + 0.075 * W, y: headCy + headR * 0.6 },
      head: { x: headCx, y: headCy, r: headR }
    };
  }
  // Face features on the front figure's head. strain in [0,1] (table weight),
  // stretch in [0,1] (window height). Both from live target params: instant.
  function drawFace(head, strain, stretch, learner, t) {
    var S = Math.min(W, H);
    var r = head.r;
    var ex = r * 0.38, ey = head.y - r * 0.08;
    var eyeH = r * 0.10 * (1 - 0.45 * strain) * (1 + 0.35 * stretch);
    // eyes as filled rects (node-canvas dot rule)
    ctx.fillStyle = PAPER;
    ctx.fillRect(head.x - ex - r * 0.07, ey - eyeH, r * 0.14, eyeH * 2);
    ctx.fillRect(head.x + ex - r * 0.07, ey - eyeH, r * 0.14, eyeH * 2);
    // brows: angled down with strain, raised with stretch
    var browTilt = -0.35 * strain + 0.30 * stretch;
    var by = head.y - r * 0.38;
    line(head.x - ex - r * 0.16, by - browTilt * r * 0.3, head.x - ex + r * 0.16, by + browTilt * r * 0.3, Math.max(2, r * 0.055), PAPER);
    line(head.x + ex - r * 0.16, by + browTilt * r * 0.3, head.x + ex + r * 0.16, by - browTilt * r * 0.3, Math.max(2, r * 0.055), PAPER);
    // blush
    ellipse(head.x - ex, head.y + r * 0.28, r * 0.16, r * 0.10, BLUSH);
    ellipse(head.x + ex, head.y + r * 0.28, r * 0.16, r * 0.10, BLUSH);
    // mouth: tight line under strain, open oval under stretch
    var my = head.y + r * 0.52;
    if (stretch > 0.45) {
      ellipse(head.x, my, r * 0.10, r * 0.10 * stretch, PAPER);
    } else {
      line(head.x - r * 0.16 * (1 - 0.5 * strain), my, head.x + r * 0.16 * (1 - 0.5 * strain), my, Math.max(2, r * 0.05), PAPER);
    }
    // learner charm: a small asymmetric smile tilt
    if (learner) {
      line(head.x - r * 0.10, my + r * 0.12, head.x + r * 0.14, my + r * 0.05, Math.max(2, r * 0.04), PAPER);
    }
  }

  // ---------- main draw ----------
  function draw(t) {
    clockNow = t;
    var S = Math.min(W, H);
    curS = S;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // seeded smudges
    for (var i = 0; i < smudges.length; i++) {
      var sm = smudges[i];
      ctx.save();
      ctx.translate(sm.x * W, sm.y * H);
      ctx.rotate(sm.rot);
      ctx.fillStyle = rgba(74, 74, 68, 0.05);
      ctx.fillRect(-sm.rx * W, -sm.ry * H, sm.rx * 2 * W, sm.ry * 2 * H);
      ctx.restore();
    }

    var phase = phaseAt(t);
    var oc = objectCenter();
    var eased = easedParams(t);
    // Face quality reacts instantly to the live target; arms use eased params.
    var strain = 0, stretch = 0;
    if (phase.obj === 'table') {
      strain = clamp((target.rx - 0.06) / 0.14, 0, 1) * 0.7 + 0.3;
    } else {
      stretch = clamp((target.h - 0.14) / 0.24, 0, 1) * 0.7 + 0.3;
    }
    var headRyScale = 1 + 0.18 * stretch - 0.06 * strain;

    // Figure placement: front figure at pair center, back figure offset.
    // During the swap window, offsets trade places.
    var pairCx = 0.36 * W;
    var frontOff = -0.012 * W, backOff = -0.058 * W;
    var curFront = frontOff, curBack = backOff;
    if (phase.swap > 0) {
      curFront = lerp(frontOff, backOff, phase.swap);
      curBack = lerp(backOff, frontOff, phase.swap);
    }
    var headY = 0.30 * H;
    // Draw order: back figure first; during the second half of the swap the
    // order flips so the trade of places reads.
    var orderFirst = phase.swap < 0.5 ? 'back' : 'front';
    var faceFigX, armsFigX;
    // face figure's x and arms figure's x under current swap interpolation:
    // face figure starts front, arms figure starts back; after the swap window
    // the roles themselves flip at the phase boundary (handled by phaseAt).
    faceFigX = pairCx + curFront;
    armsFigX = pairCx + curBack;

    var faceGeom, armsGeom;
    function paint(which) {
      if (which === 'back') {
        armsGeom = drawFigure(armsFigX, headY, FIG[phase.armsFig], headRyScale);
      } else {
        faceGeom = drawFigure(faceFigX, headY, FIG[phase.faceFig], headRyScale);
      }
    }
    if (orderFirst === 'back') { paint('back'); paint('front'); }
    else { paint('front'); paint('back'); }

    // ---- object outline (faint full + traced portion) ----
    var u = traceProgress(phase, phase.pt);
    var wobAmp = phase.learner ? 0.010 * S : 0.003 * S;
    if (phase.obj === 'table') {
      // faint full ellipse
      ctx.beginPath();
      ctx.ellipse(oc.x, oc.y, eased.rx * W, eased.ry * curS, 0, 0, 2 * Math.PI);
      ctx.strokeStyle = rgba(138, 106, 68, 0.18);
      ctx.lineWidth = Math.max(1.5, 0.004 * S);
      ctx.stroke();
      // traced arc
      var a0 = -Math.PI / 2, a1 = a0 + u * 2 * Math.PI;
      ctx.beginPath();
      ctx.ellipse(oc.x, oc.y, eased.rx * W, eased.ry * curS, 0, a0, a1);
      ctx.strokeStyle = rgba(138, 106, 68, 0.85);
      ctx.lineWidth = Math.max(2, 0.006 * S);
      ctx.stroke();
      // table legs hint (faint)
      line(oc.x - eased.rx * W * 0.6, oc.y + eased.ry * curS * 0.4, oc.x - eased.rx * W * 0.6, oc.y + eased.ry * curS * 1.6, Math.max(1.5, 0.004 * S), rgba(138, 106, 68, 0.25));
      line(oc.x + eased.rx * W * 0.6, oc.y + eased.ry * curS * 0.4, oc.x + eased.rx * W * 0.6, oc.y + eased.ry * curS * 1.6, Math.max(1.5, 0.004 * S), rgba(138, 106, 68, 0.25));
    } else {
      var ww = eased.w * W, hh = eased.h * H;
      var x0 = oc.x - ww / 2, y0 = oc.y - hh / 2;
      ctx.strokeStyle = rgba(154, 180, 192, 0.20);
      ctx.lineWidth = Math.max(1.5, 0.004 * S);
      ctx.strokeRect(x0, y0, ww, hh);
      // mullions, faint
      line(oc.x, y0, oc.x, y0 + hh, Math.max(1, 0.003 * S), rgba(154, 180, 192, 0.20));
      line(x0, oc.y, x0 + ww, oc.y, Math.max(1, 0.003 * S), rgba(154, 180, 192, 0.20));
      // traced perimeter portion
      var per = 2 * (ww + hh), d = u * per;
      ctx.strokeStyle = rgba(154, 180, 192, 0.85);
      ctx.lineWidth = Math.max(2, 0.006 * S);
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      var rem = d;
      var seg = Math.min(rem, ww); ctx.lineTo(x0 + seg, y0); rem -= seg;
      if (rem > 0) { seg = Math.min(rem, hh); ctx.lineTo(x0 + ww, y0 + seg); rem -= seg; }
      if (rem > 0) { seg = Math.min(rem, ww); ctx.lineTo(x0 + ww - seg, y0 + hh); rem -= seg; }
      if (rem > 0) { seg = Math.min(rem, hh); ctx.lineTo(x0, y0 + hh - seg); }
      ctx.stroke();
    }

    // ---- arms: two hands tracing the outline at u and u+0.5 ----
    var hands = [];
    for (var hi = 0; hi < 2; hi++) {
      var uu = (u + hi * 0.5) % 1;
      var pt = outlinePoint(phase.obj, eased, oc, uu);
      // learner wobble + corner overshoot on the window
      var wob = Math.sin(t * 2.2 + (hi === 0 ? wob1 : wob2) + uu * 12.56) * wobAmp;
      var px = Math.cos(pt.a), py = Math.sin(pt.a);
      var hx = pt.x + (-py) * wob, hy = pt.y + px * wob;
      if (phase.learner && phase.obj === 'window') {
        // overshoot near corners: push the hand slightly past the corner
        var w2 = eased.w * W, h2 = eased.h * H;
        var cx0 = oc.x - w2 / 2, cy0 = oc.y - h2 / 2;
        var nearCorner = (Math.abs(hx - cx0) < 0.02 * W && Math.abs(hy - cy0) < 0.02 * H) ||
          (Math.abs(hx - (cx0 + w2)) < 0.02 * W && Math.abs(hy - cy0) < 0.02 * H) ||
          (Math.abs(hx - cx0) < 0.02 * W && Math.abs(hy - (cy0 + h2)) < 0.02 * H) ||
          (Math.abs(hx - (cx0 + w2)) < 0.02 * W && Math.abs(hy - (cy0 + h2)) < 0.02 * H);
        if (nearCorner) { hx += px * 0.008 * S; hy += py * 0.008 * S; }
      }
      hands.push({ x: hx, y: hy });
    }
    var sh = [armsGeom.shL, armsGeom.shR];
    var armColor = FIG[phase.armsFig];
    for (var ai = 0; ai < 2; ai++) {
      var spt = sh[ai], hpt = hands[ai];
      var mx = (spt.x + hpt.x) / 2, my = (spt.y + hpt.y) / 2 - 0.03 * H;
      curve(spt.x, spt.y, mx, my, hpt.x, hpt.y, Math.max(3, 0.014 * S), armColor);
      disc(hpt.x, hpt.y, Math.max(4, 0.012 * S), armColor);
    }

    // ---- face on the front figure (drawn last so it stays on top) ----
    drawFace(faceGeom.head, strain, stretch, phase.learner, t);

    // ground shadow under the pair
    ctx.fillStyle = rgba(74, 74, 68, 0.10);
    ctx.fillRect(pairCx - 0.14 * W, 0.93 * H, 0.28 * W, 0.012 * H);

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---------- boot: frame one = draw(0); clock starts with the rAF loop ----------
  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    function loop(ts) {
      if (t0 === null) t0 = ts;
      draw((ts - t0) / 1000);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
