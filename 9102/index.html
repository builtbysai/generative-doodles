<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9102 · Binary</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0e; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // BINARY — a clock told in flipping discs.
  // Six columns (hours, minutes, seconds; two digits each), four rows of
  // bits (8 4 2 1, bottom-aligned). A lit disc is brass; a dark disc is a
  // ghost ring. When a bit changes, its disc turns over like a coin —
  // it thins to a bright edge, then lands on its other face. Carries
  // ripple: when the seconds roll over, the flip travels left through
  // minutes and hours in a wave, the way the change itself travels.
  // Tap to hide or show the small decimal digits. Watch it at :59.

  var COLS = [
    { bits: [2, 1] },        // hours tens
    { bits: [8, 4, 2, 1] },  // hours ones
    { bits: [4, 2, 1] },     // minutes tens
    { bits: [8, 4, 2, 1] },  // minutes ones
    { bits: [4, 2, 1] },     // seconds tens
    { bits: [8, 4, 2, 1] }   // seconds ones
  ];
  var FLIP_MS = 460;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var showDigits = true;

  // state[col][bit] = { on, flip: {t0, from, to, delay} | null }
  var state = [];
  var lastSecond = -1;

  var qs = new URLSearchParams(location.search);
  var freezeSec = qs.get('t') !== null ? parseFloat(qs.get('t')) : null; // seconds into the day
  var pinMid = qs.get('mid') !== null;

  function nowSeconds() {
    if (freezeSec !== null) return freezeSec + performance.now() / 1000;
    var d = new Date();
    return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
  }
  function digitsOf(sec) {
    var s = Math.floor(sec) % 86400;
    var hh = Math.floor(s / 3600), mm = Math.floor(s / 60) % 60, ss = s % 60;
    return [Math.floor(hh / 10), hh % 10, Math.floor(mm / 10), mm % 10, Math.floor(ss / 10), ss % 10];
  }
  function easeOutBack(t) {
    var c = 1.30158;
    return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
  }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  function initState(digs) {
    state = COLS.map(function (col, ci) {
      var m = {};
      col.bits.forEach(function (b) { m[b] = { on: (digs[ci] & b) !== 0, flip: null }; });
      return m;
    });
  }

  function tick() {
    var sec = nowSeconds();
    var whole = Math.floor(sec);
    if (whole === lastSecond) return;
    lastSecond = whole;
    var digs = digitsOf(sec);
    if (!state.length) { initState(digs); return; }
    var now = performance.now();
    COLS.forEach(function (col, ci) {
      col.bits.forEach(function (b) {
        var cell = state[ci][b];
        var target = (digs[ci] & b) !== 0;
        if (target !== cell.on) {
          // ripple: flips start at the seconds (right) and travel left
          var delay = (5 - ci) * 55;
          cell.flip = { t0: now + delay, from: cell.on, to: target };
          cell.on = target;
        }
      });
    });
  }

  function drawDisc(x, y, r, cell, now, colIdx, bit) {
    var p = 0, flipping = false, faceOn = cell.on;
    if (cell.flip) {
      var t = (now - cell.flip.t0) / FLIP_MS;
      if (t < 0) { faceOn = cell.flip.from; }
      else if (t >= 1) { cell.flip = null; faceOn = cell.on; }
      else {
        flipping = true;
        p = easeInOut(t);
        faceOn = p < 0.5 ? cell.flip.from : cell.flip.to;
      }
    }
    if (pinMid && colIdx === 5 && bit === 1) { flipping = true; p = 0.5; faceOn = true; }
    var ang = p * Math.PI;
    var squash = flipping ? Math.max(0.07, Math.abs(Math.cos(ang))) : 1;
    var edgeGlow = flipping ? Math.sin(ang) : 0;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.40)';
    ctx.beginPath();
    ctx.ellipse(x, y + r * 1.06, r * 0.92, r * 0.16, 0, 0, 6.283);
    ctx.fill();
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1, squash);
    if (faceOn) {
      var g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.05);
      g.addColorStop(0, '#ffe3a1');
      g.addColorStop(0.45, '#f2c063');
      g.addColorStop(0.85, '#c07f2e');
      g.addColorStop(1, '#8a5a1d');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, 6.283);
      ctx.fill();
      // slow sheen drift, so lit discs feel like metal at rest
      var sx = Math.cos(now / 3400 + colIdx * 1.3 + bit) * r * 0.3;
      var sy = -r * 0.45 + Math.sin(now / 4100 + bit * 2.1) * r * 0.08;
      var sheen = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 0.85);
      sheen.addColorStop(0, 'rgba(255,255,255,0.20)');
      sheen.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sheen;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, 6.283);
      ctx.fill();
      ctx.strokeStyle = 'rgba(70,42,8,0.55)';
      ctx.lineWidth = Math.max(1, r * 0.045);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#15161c';
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, 6.283);
      ctx.fill();
      ctx.strokeStyle = 'rgba(235,225,200,0.20)';
      ctx.lineWidth = Math.max(1, r * 0.05);
      ctx.stroke();
      ctx.fillStyle = 'rgba(235,225,200,0.10)';
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.16, 0, 6.283);
      ctx.fill();
    }
    ctx.restore();
    if (flipping && edgeGlow > 0.72) {
      // the coin's edge catches the light at the turn
      ctx.strokeStyle = 'rgba(255,236,190,' + ((edgeGlow - 0.72) * 2.4) + ')';
      ctx.lineWidth = Math.max(1, r * 0.06);
      ctx.beginPath();
      ctx.moveTo(x - r * 0.96, y);
      ctx.lineTo(x + r * 0.96, y);
      ctx.stroke();
    }
  }

  function draw(now) {
    tick();
    var bg = ctx.createRadialGradient(W / 2, H * 0.44, 0, W / 2, H * 0.44, Math.max(W, H) * 0.72);
    bg.addColorStop(0, '#14151d');
    bg.addColorStop(0.6, '#0d0d13');
    bg.addColorStop(1, '#070709');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var digs = digitsOf(nowSeconds());
    var gap = 0.38;                                   // extra space between digit pairs
    var cellX = Math.min((W * 0.94) / (6 + gap * 2), (H * 0.80) / 4.9);
    var cellY = cellX;
    var gridW = cellX * 6 + cellX * gap * 2;
    var gridH = cellY * 4;
    var x0 = (W - gridW) / 2 + cellX / 2;
    var yBase = H * 0.5 + gridH / 2 - cellY / 2;      // center of the bottom row
    var r = cellX * 0.365;

    // colon dots between the pairs, breathing with the seconds
    var pulse = 0.20 + 0.13 * (0.5 + 0.5 * Math.sin(now / 1000 * Math.PI));
    for (var gi = 0; gi < 2; gi++) {
      var cxp = x0 + (1.5 + gi * 2) * cellX + gap * cellX * (gi + 0.5);
      for (var di = 0; di < 2; di++) {
        var cyp = yBase - cellY * (di === 0 ? 0.85 : 1.65);
        ctx.fillStyle = 'rgba(242,192,99,' + pulse + ')';
        ctx.beginPath();
        ctx.arc(cxp, cyp, r * 0.10, 0, 6.283);
        ctx.fill();
      }
    }

    COLS.forEach(function (col, ci) {
      var cx = x0 + ci * cellX + (ci >= 2 ? gap * cellX : 0) + (ci >= 4 ? gap * cellX : 0);
      col.bits.forEach(function (b, bi) {
        var rowFromBottom = [1, 2, 4, 8].indexOf(b);
        var cy = yBase - rowFromBottom * cellY;
        drawDisc(cx, cy, r, state[ci][b], now, ci, b);
      });
      if (showDigits) {
        ctx.fillStyle = 'rgba(233,225,205,0.52)';
        ctx.font = Math.round(cellX * 0.30) + 'px ui-monospace, Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(String(digs[ci]), cx, yBase + cellY * 0.78);
      }
    });
  }

  function frame(now) {
    draw(now);
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointerdown', function () { showDigits = !showDigits; });

  function build() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', build);
  build();
  initState(digitsOf(nowSeconds()));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
