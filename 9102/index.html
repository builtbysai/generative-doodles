<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9102 · Binary</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #07080d; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // BINARY — a clock of stones in the dark.
  // Six columns (hours, minutes, seconds; two digits each), four rows of
  // bits (8 4 2 1, bottom-aligned). Each bit is a pebble with its own
  // imperfect outline; lit, it glows candle-warm with a halo and a
  // reflection pooled under it; dark, it sits as a quiet stone outline.
  // When a bit changes, its stone turns over: it thins to a bright
  // crescent, lands at a new tilt, and a ring of light ripples out.
  // Carries ripple too — at :59 → :00 the flip travels left through
  // minutes and hours. Tap to hide or show the small decimal digits.

  var COLS = [
    { bits: [2, 1] },
    { bits: [8, 4, 2, 1] },
    { bits: [4, 2, 1] },
    { bits: [8, 4, 2, 1] },
    { bits: [4, 2, 1] },
    { bits: [8, 4, 2, 1] }
  ];
  var FLIP_MS = 520;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var showDigits = true;
  var state = [];
  var ripples = [];
  var lastSecond = -1;

  var qs = new URLSearchParams(location.search);
  var freezeSec = qs.get('t') !== null ? parseFloat(qs.get('t')) : null;
  var pinMid = qs.get('mid') !== null;

  function mulberry(s) {
    var a = s >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var dust = [];
  (function () {
    var rg = mulberry(9102);
    for (var i = 0; i < 70; i++) dust.push({ x: rg(), y: rg(), r: 0.4 + rg() * 1.1, a: 0.02 + rg() * 0.05 });
  })();

  function nowSeconds() {
    if (freezeSec !== null) return freezeSec + performance.now() / 1000;
    var d = new Date();
    return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
  }
  function digitsOf(sec) {
    var s = Math.floor(sec) % 86400;
    var hh = Math.floor(s / 3600), mm = Math.floor(s / 60) % 60, ss = s % 60;
    return [Math.floor(hh / 10), hh % 10, Math.floor(mm / 10), mm % 10, Math.floor(ss / 10), ss % 10];
  }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  function initState(digs) {
    state = COLS.map(function (col, ci) {
      var m = {};
      col.bits.forEach(function (b) { m[b] = { on: (digs[ci] & b) !== 0, flip: null }; });
      return m;
    });
  }

  function tick() {
    var sec = nowSeconds();
    var whole = Math.floor(sec);
    if (whole === lastSecond) return;
    lastSecond = whole;
    var digs = digitsOf(sec);
    if (!state.length) { initState(digs); return; }
    var now = performance.now();
    COLS.forEach(function (col, ci) {
      col.bits.forEach(function (b) {
        var cell = state[ci][b];
        var target = (digs[ci] & b) !== 0;
        if (target !== cell.on) {
          cell.flip = { t0: now + (5 - ci) * 55, from: cell.on, to: target };
          cell.on = target;
        }
      });
    });
  }

  // Each bit is a pebble, not a perfect disc: its outline is set once by
  // its own two sine harmonics, so the grid is made of stones, each one
  // slightly itself. When a pebble turns over it settles at a new tilt.
  function pebblePath(r, seedA, seedB) {
    ctx.beginPath();
    for (var i = 0; i <= 28; i++) {
      var th = (i / 28) * Math.PI * 2;
      var rr = r * (1 + 0.045 * Math.sin(3 * th + seedA) + 0.028 * Math.sin(5 * th + seedB));
      var px = Math.cos(th) * rr, py = Math.sin(th) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function drawDisc(x, y, r, cell, now, colIdx, bit) {
    if (cell.seedA === undefined) {
      var rg0 = mulberry(4000 + colIdx * 97 + bit * 13);
      cell.seedA = rg0() * 6.28;
      cell.seedB = rg0() * 6.28;
      cell.tilt = (rg0() - 0.5) * 0.05;
    }
    var p = 0, flipping = false, faceOn = cell.on;
    if (cell.flip) {
      var t = (now - cell.flip.t0) / FLIP_MS;
      if (t < 0) { faceOn = cell.flip.from; }
      else if (t >= 1) {
        var wasTo = cell.flip.to;
        cell.flip = null;
        faceOn = cell.on;
        cell.tilt = (mulberry((now | 0) + colIdx * 31 + bit)() - 0.5) * 0.07;
        if (wasTo) ripples.push({ x: x, y: y, r: r, t0: now });
      } else {
        flipping = true;
        p = easeInOut(t);
        faceOn = p < 0.5 ? cell.flip.from : cell.flip.to;
      }
    }
    if (pinMid && colIdx === 5 && bit === 1) { flipping = true; p = 0.5; faceOn = true; }
    var ang = p * Math.PI;
    var squash = flipping ? Math.max(0.045, Math.abs(Math.cos(ang))) : 1;
    var edgeGlow = flipping ? Math.sin(ang) : 0;

    // reflection pooled under the stone
    if (faceOn) {
      var refl = ctx.createRadialGradient(x, y + r * 1.30, 0, x, y + r * 1.30, r * 1.05);
      refl.addColorStop(0, 'rgba(255,190,100,' + (0.12 - edgeGlow * 0.05) + ')');
      refl.addColorStop(1, 'rgba(255,190,100,0)');
      ctx.fillStyle = refl;
      ctx.beginPath();
      ctx.ellipse(x, y + r * 1.30, r * 1.05, r * 0.30, 0, 0, 6.283);
      ctx.fill();
      // halo: light stays round and dips as the stone passes edge-on
      var breathe = colIdx >= 4 ? 1 + 0.05 * Math.sin(now / 700 + bit * 1.7) : 1;
      var haloR = r * 1.95 * breathe * (1 + edgeGlow * 0.3);
      var halo = ctx.createRadialGradient(x, y, r * 0.4, x, y, haloR);
      var dip = Math.max(0.12, Math.min(1, squash * 1.7));
      halo.addColorStop(0, 'rgba(255,198,110,' + (0.19 * dip) + ')');
      halo.addColorStop(0.55, 'rgba(255,176,80,' + (0.06 * dip) + ')');
      halo.addColorStop(1, 'rgba(255,176,80,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(x, y, haloR, 0, 6.283);
      ctx.fill();
    }
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(cell.tilt + (flipping ? Math.sin(ang) * 0.10 : 0));
    ctx.scale(1, squash);
    pebblePath(r, cell.seedA, cell.seedB);
    if (faceOn) {
      var g = ctx.createRadialGradient(-r * 0.34, -r * 0.38, r * 0.08, 0, 0, r * 1.05);
      g.addColorStop(0, '#fff4d8');
      g.addColorStop(0.38, '#ffd489');
      g.addColorStop(0.78, '#eda63f');
      g.addColorStop(1, '#d99b45');
      ctx.fillStyle = g;
      ctx.fill();
      var core = ctx.createRadialGradient(-r * 0.2, -r * 0.24, 0, -r * 0.2, -r * 0.24, r * 0.52);
      core.addColorStop(0, 'rgba(255,255,255,0.45)');
      core.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = core;
      pebblePath(r, cell.seedA, cell.seedB);
      ctx.fill();
      if (flipping && squash < 0.30) {
        ctx.fillStyle = 'rgba(255,244,205,' + (0.55 * (1 - squash / 0.30)) + ')';
        pebblePath(r, cell.seedA, cell.seedB);
        ctx.fill();
      }
    } else {
      // an unlit stone: present, quiet, its outline in the dark
      ctx.fillStyle = 'rgba(206,214,235,0.030)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(206,216,242,0.15)';
      ctx.lineWidth = Math.max(1, r * 0.04);
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw(now) {
    tick();
    var bg = ctx.createRadialGradient(W / 2, H * 0.46, 0, W / 2, H * 0.46, Math.max(W, H) * 0.75);
    bg.addColorStop(0, '#101019');
    bg.addColorStop(0.55, '#0a0a12');
    bg.addColorStop(1, '#050508');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    for (var di = 0; di < dust.length; di++) {
      var d = dust[di];
      ctx.fillStyle = 'rgba(210,218,240,' + d.a + ')';
      ctx.beginPath();
      ctx.arc(d.x * W, d.y * H, d.r, 0, 6.283);
      ctx.fill();
    }

    var digs = digitsOf(nowSeconds());
    var gap = 0.55;
    var cellX = Math.min((W * 0.94) / (6 + gap * 2), (H * 0.82) / 5.2);
    var cellY = cellX * 1.07;
    var gridW = cellX * 6 + cellX * gap * 2;
    var gridH = cellY * 4;
    var x0 = (W - gridW) / 2 + cellX / 2;
    var yBase = H * 0.5 + gridH / 2 - cellY / 2;
    var r = cellX * 0.325;

    // landing ripples, under the lamps
    for (var ri = ripples.length - 1; ri >= 0; ri--) {
      var rp = ripples[ri];
      var age = (now - rp.t0) / 750;
      if (age >= 1) { ripples.splice(ri, 1); continue; }
      ctx.strokeStyle = 'rgba(255,196,105,' + (0.22 * (1 - age)) + ')';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r * (1 + age * 1.7), 0, 6.283);
      ctx.stroke();
    }

    // colon dots, bright just after the tick, fading through the second
    var frac = nowSeconds() % 1;
    var pulse = 0.14 + 0.30 * Math.pow(1 - frac, 2);
    for (var gi = 0; gi < 2; gi++) {
      var cxp = x0 + (1.5 + gi * 2) * cellX + gap * cellX * (gi + 0.5);
      for (var dj = 0; dj < 2; dj++) {
        var cyp = yBase - cellY * (dj === 0 ? 0.82 : 1.68);
        var cg = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, r * 0.34);
        cg.addColorStop(0, 'rgba(255,205,120,' + pulse + ')');
        cg.addColorStop(1, 'rgba(255,205,120,0)');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(cxp, cyp, r * 0.34, 0, 6.283);
        ctx.fill();
      }
    }

    COLS.forEach(function (col, ci) {
      var cx = x0 + ci * cellX + (ci >= 2 ? gap * cellX : 0) + (ci >= 4 ? gap * cellX : 0);
      col.bits.forEach(function (b) {
        var rowFromBottom = [1, 2, 4, 8].indexOf(b);
        var cy = yBase - rowFromBottom * cellY;
        drawDisc(cx, cy, r, state[ci][b], now, ci, b);
      });
      if (showDigits) {
        ctx.fillStyle = 'rgba(226,230,244,0.40)';
        ctx.font = '300 ' + Math.round(cellX * 0.27) + 'px ui-sans-serif, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(digs[ci]), cx, yBase + cellY * 0.92);
      }
    });
  }

  function frame(now) {
    draw(now);
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointerdown', function () { showDigits = !showDigits; });

  function build() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', build);
  build();
  initState(digitsOf(nowSeconds()));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
