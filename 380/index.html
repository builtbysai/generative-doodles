<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.380 Boho Jungle</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EFE3CC; }
  canvas { display:block; touch-action:none; cursor:grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.380 Boho Jungle (jenkbdoodles).
// After Jen K's maximalist animal print: five flat hero
// animals on light beige - white leopards with black
// spots, orange tigers with black stripes, one black
// and white zebra - packed among spiky tropical plants
// with tiny berry dots sprinkled in every remaining
// gap. Three registers, no negative space, no scene:
// the beige ground is the background. The animals
// breathe (scale 0.98 to 1.02) and the leaves sway
// plus/minus 3 degrees, both on whole cycles of the
// 40s loop. Drag near an animal and it turns slightly
// toward the pointer; on release it settles back to
// exactly its authored rotation. Nothing is runtime
// random: species order, positions, spot, stripe and
// band tables, plant scatter and berry scatter all
// come from one fixed seed below, and every pattern
// is path data clipped to the animal's own silhouette
// paths on this one canvas - no sprites, no offscreen.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#EFE3CC', PAPER = '#FAFAF5', INK = '#1E1E1E';
var TIGER = '#E08A3C', LEAF_A = '#4E7A4E', LEAF_B = '#7A9B4E';
var BERRY = '#B33A3A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 40;
if (LOOP !== 40) throw new Error('Boho Jungle loop must be 40s');
var TICK = 1 / 60;
var BREATHE_CYCLES = 2, SWAY_CYCLES = 2;
var SWAY_MAX = 3 * Math.PI / 180; // plus/minus 3 degrees
var TURN_MAX = 0.16, TURN_RADIUS = 360;

// ---- fixed seed ---------------------------------------------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(20260126);

// ---- the five hero animals -----------------------------------
// Species order is fixed by the spec: leopard, tiger,
// zebra, leopard, tiger, in seeded rotation. Positions
// are authored, then jittered from the seed. Local
// animal space: origin at torso centre, facing +x,
// total height about 290 design px (a third of the
// design height) before the per-animal scale.
var LEG_X = [110, 82, -92, -118]; // near front, far front, near back, far back
var SPECIES = ['leopard', 'tiger', 'zebra', 'leopard', 'tiger'];
var SPOTS = [], STRIPES = [], BANDS = [];
var ANIMALS = [];
(function buildAnimals() {
  var bases = [
    { x: 330, y: 285, flip: false },
    { x: 950, y: 255, flip: true },
    { x: 640, y: 615, flip: false },
    { x: 1075, y: 700, flip: false },
    { x: 170, y: 730, flip: true }
  ];
  for (var i = 0; i < bases.length; i++) {
    var b = bases[i];
    ANIMALS.push({
      kind: SPECIES[i],
      x: b.x + (rng() - 0.5) * 36,
      y: b.y + (rng() - 0.5) * 30,
      flip: b.flip,
      patFlip: (i === 3 || i === 4) ? -1 : 1, // repeated species mirror their pattern tables
      rot: (rng() - 0.5) * 0.22,
      s: 0.98 + rng() * 0.04,
      phase: rng() * Math.PI * 2,
      turn: 0
    });
  }
})();
if (ANIMALS.length !== 5) throw new Error('Boho Jungle needs exactly 5 hero animals');
if (SPECIES.join(',') !== 'leopard,tiger,zebra,leopard,tiger')
  throw new Error('Boho Jungle species order must be leopard,tiger,zebra,leopard,tiger');

// Pattern tables, generated once from the seed and drawn
// from data every frame (never re-rolled).
(function buildPatterns() {
  var i, j;
  // leopard: torso spots (some ringed rosettes, kept
  // fully inside the torso so they never clip into
  // scribbles on the silhouette edge), chest spots.
  // Torso spots keep a minimum spacing so they read as
  // a coat, not a smudge.
  for (i = 0; i < 34; i++) {
    var ring = rng() < 0.22;
    var sx = 0, sy = 0, tries = 0, ok = false;
    while (!ok && tries < 8) {
      sx = -152 + rng() * 306; sy = -60 + rng() * 120;
      if (ring) {
        sx = Math.max(-138, Math.min(128, sx));
        sy = Math.max(-42, Math.min(42, sy));
      }
      ok = true;
      for (var q = 0; q < SPOTS.length; q++) {
        if (SPOTS[q].chest) continue;
        var ddx = SPOTS[q].x - sx, ddy = SPOTS[q].y - sy;
        if (ddx * ddx + ddy * ddy < 17 * 17) { ok = false; break; }
      }
      tries++;
    }
    SPOTS.push({
      x: sx, y: sy,
      rx: 7 + rng() * 8, ry: 5 + rng() * 6, rot: rng() * Math.PI,
      ring: ring
    });
  }
  for (i = 0; i < 6; i++) {
    SPOTS.push({
      chest: true,
      x: 92 + rng() * 78, y: -74 + rng() * 80,
      rx: 4 + rng() * 3.5, ry: 3.5 + rng() * 3, rot: rng() * Math.PI,
      ring: false
    });
  }
  // tiger: torso stripes hanging from the top, shorter
  // stripes rising from the belly, chest stripes
  var x = -148;
  while (x < 148) {
    STRIPES.push({ x: x, len: 46 + rng() * 32, slant: (rng() - 0.5) * 10, low: false });
    x += 23 + rng() * 11;
  }
  x = -138;
  while (x < 140) {
    STRIPES.push({ x: x, len: 28 + rng() * 16, slant: (rng() - 0.5) * 8, low: true });
    x += 32 + rng() * 12;
  }
  for (j = 0; j < 3; j++) STRIPES.push({ chest: true, x: 108 + j * 22, len: 54, slant: 6, low: false });
  // zebra: torso bands and chest bands (stroked curves)
  x = -150;
  while (x < 155) { BANDS.push({ x: x, w: 13 + rng() * 4 }); x += 29 + rng() * 5; }
})();

// ---- spiky plants (mid register) ------------------------------
// A plant is a curved stem with stacked triangle leaves
// alternating up it, in the two leaf greens. Back plants
// fill the field on a jittered grid; shorter tufts stand
// in front along the bottom.
var PLANTS = [];
(function buildPlants() {
  var xs = [90, 410, 730, 1050], ys = [250, 530, 810];
  var i, j;
  for (j = 0; j < ys.length; j++) {
    for (i = 0; i < xs.length; i++) {
      PLANTS.push({
        x: xs[i] + (rng() - 0.5) * 120, y: ys[j] + (rng() - 0.5) * 60,
        h: 150 + rng() * 110, lean: (rng() - 0.5) * 60,
        phase: rng() * Math.PI * 2, front: false,
        flipLeaf: rng() < 0.5
      });
    }
  }
  var tx = [140, 470, 800, 1130, 300, 980];
  for (i = 0; i < tx.length; i++) {
    PLANTS.push({
      x: tx[i] + (rng() - 0.5) * 60, y: 898 + rng() * 14,
      h: 80 + rng() * 50, lean: (rng() - 0.5) * 30,
      phase: rng() * Math.PI * 2, front: true,
      flipLeaf: rng() < 0.5
    });
  }
})();
if (PLANTS.length !== 18) throw new Error('Boho Jungle needs exactly 18 plants');

// ---- berries and filler (micro register) ----------------------
// Berry clusters and single leaves are rejection-sampled
// off the animals' bodies so the micro register fills
// the gaps without freckling the fauna.
function onAnimal(x, y, pad) {
  for (var i = 0; i < ANIMALS.length; i++) {
    var a = ANIMALS[i];
    var dx = (x - a.x) / (250 * a.s + pad), dy = (y - a.y) / (170 * a.s + pad);
    if (dx * dx + dy * dy < 1) return true;
  }
  return false;
}
var BERRIES = [], DOTS = [], SPRIGS = [];
(function buildMicro() {
  var tries, x, y, i, k;
  for (i = 0; i < 26; i++) {
    tries = 0;
    do { x = 20 + rng() * 1240; y = 20 + rng() * 860; tries++; } while (onAnimal(x, y, 6) && tries < 40);
    if (onAnimal(x, y, 6)) continue;
    var dots = [];
    var n = 3 + Math.floor(rng() * 3);
    for (k = 0; k < n; k++) dots.push({ dx: (rng() - 0.5) * 22, dy: (rng() - 0.5) * 18, r: 4.5 + rng() * 3 });
    BERRIES.push({ x: x, y: y, dots: dots });
  }
  for (i = 0; i < 36; i++) {
    tries = 0;
    do { x = 16 + rng() * 1248; y = 16 + rng() * 868; tries++; } while (onAnimal(x, y, 0) && tries < 30);
    if (onAnimal(x, y, 0)) continue;
    DOTS.push({ x: x, y: y, r: 3 + rng() * 2.2 });
  }
  for (i = 0; i < 20; i++) {
    tries = 0;
    do { x = 30 + rng() * 1220; y = 30 + rng() * 840; tries++; } while (onAnimal(x, y, -8) && tries < 30);
    if (onAnimal(x, y, -8)) continue;
    SPRIGS.push({ x: x, y: y, rot: rng() * Math.PI * 2, s: 0.8 + rng() * 0.5, col: rng() < 0.5 ? LEAF_A : LEAF_B });
  }
})();

// ---- clock -----------------------------------------------------
// Constant first-frame phase: T = 11.3s into the 40s
// loop, leaves mid-sway, animals mid-breath, all turns
// exactly zero. The animation clock is anchored to this
// constant plus elapsed time since load, advanced in
// fixed 1/60 ticks. Frame one is never drawn from a
// wall clock.
var T = 11.3;
var lastNow = -1, acc = 0;

// ---- animal geometry (local coords, facing +x) ------------------
function torsoPath() {
  ctx.beginPath();
  ctx.moveTo(-150, -10);
  ctx.bezierCurveTo(-150, -58, -70, -66, 0, -64);
  ctx.bezierCurveTo(80, -66, 150, -52, 152, -6);
  ctx.bezierCurveTo(150, 44, 80, 62, 0, 62);
  ctx.bezierCurveTo(-80, 62, -148, 46, -150, -10);
  ctx.closePath();
}
function chestPath() {
  ctx.beginPath();
  ctx.ellipse(124, -34, 50, 44, -0.45, 0, Math.PI * 2);
}
function headPath() {
  ctx.beginPath();
  ctx.ellipse(196, -104, 42, 35, -0.12, 0, Math.PI * 2);
}
function legPath(x) {
  ctx.beginPath();
  ctx.moveTo(x - 12, 28);
  ctx.lineTo(x + 12, 28);
  ctx.lineTo(x + 10, 138);
  ctx.quadraticCurveTo(x + 10, 150, x - 2, 150);
  ctx.lineTo(x - 10, 150);
  ctx.quadraticCurveTo(x - 13, 150, x - 12, 138);
  ctx.closePath();
}
function tailPath(thin) {
  var w = thin ? 6 : 9;
  ctx.beginPath();
  ctx.moveTo(-146, -38 + w * 0.4);
  ctx.quadraticCurveTo(-196, -64, -204, -6);
  ctx.quadraticCurveTo(-207, 26, -192, 52);
  ctx.quadraticCurveTo(-186, 28, -188, -2);
  ctx.quadraticCurveTo(-192, -44, -142, -22);
  ctx.closePath();
  return w;
}
function earPaths() {
  ctx.beginPath();
  ctx.moveTo(154, -124); ctx.quadraticCurveTo(158, -148, 170, -150);
  ctx.quadraticCurveTo(180, -144, 178, -124); ctx.closePath();
  ctx.moveTo(186, -128); ctx.quadraticCurveTo(196, -150, 208, -146);
  ctx.quadraticCurveTo(212, -134, 204, -120); ctx.closePath();
}
function dot(x, y, r, col) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

// Pattern passes: drawn from the fixed tables, clipped
// to the animal's own paths on this canvas. The table
// passes run under the animal's patFlip so the two
// leopards (and the two tigers) do not wear identical
// coats; the authored marks stay unmirrored, placed on
// the head, tail and legs as drawn.
function leopardTables() {
  var i, sp;
  ctx.fillStyle = INK;
  ctx.save(); torsoPath(); ctx.clip();
  for (i = 0; i < SPOTS.length; i++) {
    sp = SPOTS[i];
    if (sp.chest) continue;
    if (sp.ring) {
      ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(sp.x, sp.y, sp.rx, sp.ry, sp.rot, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(sp.x, sp.y, sp.rx, sp.ry, sp.rot, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
  ctx.save(); chestPath(); ctx.clip();
  for (i = 0; i < SPOTS.length; i++) {
    sp = SPOTS[i];
    if (!sp.chest) continue;
    ctx.beginPath(); ctx.ellipse(sp.x, sp.y, sp.rx, sp.ry, sp.rot, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function leopardMarks() {
  var i;
  dot(180, -114, 5, INK); dot(210, -120, 4, INK); dot(176, -92, 4, INK);
  dot(-172, -36, 6, INK); dot(-196, -8, 6, INK); dot(-196, 26, 5, INK);
  for (i = 0; i < LEG_X.length; i++) {
    dot(LEG_X[i], 84, 5.5, INK); dot(LEG_X[i] + 2, 118, 4.5, INK);
  }
}
function tigerTables() {
  var i, st;
  ctx.fillStyle = INK;
  ctx.save(); torsoPath(); ctx.clip();
  for (i = 0; i < STRIPES.length; i++) {
    st = STRIPES[i];
    if (st.chest) continue;
    ctx.beginPath();
    if (!st.low) {
      ctx.moveTo(st.x - 6, -68);
      ctx.lineTo(st.x + 7, -68);
      ctx.lineTo(st.x + st.slant + 1.5, -68 + st.len);
      ctx.lineTo(st.x + st.slant - 1.5, -68 + st.len);
    } else {
      ctx.moveTo(st.x - 5, 66);
      ctx.lineTo(st.x + 6, 66);
      ctx.lineTo(st.x + st.slant + 1.5, 66 - st.len);
      ctx.lineTo(st.x + st.slant - 1.5, 66 - st.len);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.save(); chestPath(); ctx.clip();
  for (i = 0; i < STRIPES.length; i++) {
    st = STRIPES[i];
    if (!st.chest) continue;
    ctx.beginPath();
    ctx.moveTo(st.x - 6, -88);
    ctx.lineTo(st.x + 7, -88);
    ctx.lineTo(st.x + st.slant + 1.5, -88 + st.len);
    ctx.lineTo(st.x + st.slant - 1.5, -88 + st.len);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function tigerMarks() {
  var i;
  ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(184, -128); ctx.lineTo(188, -112);
  ctx.moveTo(202, -132); ctx.lineTo(204, -116);
  ctx.moveTo(218, -124); ctx.lineTo(216, -110);
  ctx.stroke();
  ctx.fillStyle = INK;
  legBand(-180, -40, 8, 0.5); legBand(-197, -8, 7, 0.1);
  for (i = 0; i < LEG_X.length; i++) {
    legBandRect(LEG_X[i], 82, 7); legBandRect(LEG_X[i], 116, 6);
  }
}
function zebraTables() {
  var i, b;
  ctx.strokeStyle = INK; ctx.lineCap = 'round';
  ctx.save(); torsoPath(); ctx.clip();
  for (i = 0; i < BANDS.length; i++) {
    b = BANDS[i];
    ctx.lineWidth = b.w;
    ctx.beginPath();
    ctx.moveTo(b.x, -72);
    ctx.quadraticCurveTo(b.x + 12, 0, b.x - 4, 74);
    ctx.stroke();
  }
  ctx.restore();
  ctx.save(); chestPath(); ctx.clip();
  ctx.lineWidth = 11;
  ctx.beginPath();
  ctx.moveTo(116, -82); ctx.quadraticCurveTo(126, -34, 114, 8);
  ctx.moveTo(144, -78); ctx.quadraticCurveTo(152, -34, 142, 4);
  ctx.stroke();
  ctx.restore();
}
function zebraMarks() {
  var i;
  ctx.strokeStyle = INK; ctx.lineCap = 'round';
  ctx.lineWidth = 6.5;
  ctx.beginPath();
  ctx.moveTo(168, -124); ctx.lineTo(212, -116);
  ctx.moveTo(170, -98); ctx.lineTo(210, -92);
  ctx.stroke();
  ctx.fillStyle = INK;
  for (i = 0; i < LEG_X.length; i++) {
    legBandRect(LEG_X[i], 84, 8); legBandRect(LEG_X[i], 120, 7);
  }
}
// A band painted across one leg, tapered to the leg's width.
function legBandRect(x, y, h) {
  var wTop = 24 - (y - 28) * (4 / 122), wBot = 24 - (y + h - 28) * (4 / 122);
  ctx.beginPath();
  ctx.moveTo(x - wTop / 2, y);
  ctx.lineTo(x + wTop / 2, y);
  ctx.lineTo(x + wBot / 2, y + h);
  ctx.lineTo(x - wBot / 2, y + h);
  ctx.closePath(); ctx.fill();
}
// A small rotated band across the tail (tiger).
function legBand(x, y, h, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillRect(-9, -h / 2, 18, h);
  ctx.restore();
}
function drawAnimal(a, t) {
  var ph = t / LOOP;
  var breathe = 1 + 0.02 * Math.sin(Math.PI * 2 * BREATHE_CYCLES * ph + a.phase);
  var base = a.kind === 'tiger' ? TIGER : PAPER;
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot + a.turn);
  ctx.scale((a.flip ? -1 : 1) * a.s * breathe, a.s * breathe);
  // tail behind everything, far legs behind the torso
  tailPath(a.kind === 'zebra');
  ctx.fillStyle = base; ctx.fill();
  legPath(LEG_X[1]); ctx.fill();
  legPath(LEG_X[3]); ctx.fill();
  torsoPath(); ctx.fill();
  legPath(LEG_X[0]); ctx.fill();
  legPath(LEG_X[2]); ctx.fill();
  // paws
  ctx.beginPath();
  for (var i = 0; i < LEG_X.length; i++) ctx.ellipse(LEG_X[i] + 3, 148, 13, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  chestPath(); ctx.fill();
  headPath(); ctx.fill();
  // muzzle
  ctx.beginPath(); ctx.ellipse(226, -80, 23, 17, 0, 0, Math.PI * 2); ctx.fill();
  earPaths(); ctx.fill();
  // pattern tables, clipped to the silhouette paths and
  // mirrored per repeated species; then authored marks
  ctx.save();
  if (a.patFlip < 0) ctx.scale(-1, 1);
  if (a.kind === 'leopard') leopardTables();
  else if (a.kind === 'tiger') tigerTables();
  else zebraTables();
  ctx.restore();
  if (a.kind === 'leopard') leopardMarks();
  else if (a.kind === 'tiger') tigerMarks();
  else zebraMarks();
  if (a.kind === 'zebra') {
    // mane: a tight zigzag crest hugging the neck from
    // the head down to the shoulder, and a dark muzzle
    ctx.fillStyle = INK;
    ctx.beginPath();
    var mx = [162, 148, 134, 120, 107], my = [-134, -114, -95, -77, -61], k;
    ctx.moveTo(mx[0], my[0]);
    for (k = 0; k < mx.length; k++) {
      ctx.lineTo(mx[k] - 13, my[k] - 9);
      ctx.lineTo(mx[k] - 3, my[k] + 2);
    }
    for (k = mx.length - 1; k >= 0; k--) ctx.lineTo(mx[k] + 9, my[k] + 7);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(228, -78, 19, 14, 0, 0, Math.PI * 2); ctx.fill();
    // tail tuft
    ctx.beginPath(); ctx.ellipse(-194, 46, 8, 15, 0.3, 0, Math.PI * 2); ctx.fill();
  } else {
    // nose at the muzzle tip
    ctx.beginPath(); ctx.ellipse(242, -76, 7, 5.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();
  }
  // eye
  dot(208, -106, 4.5, INK);
  ctx.restore();
}

// ---- plants, berries, sprigs -------------------------------------
function stemPoint(p, u) {
  // point along the plant's quadratic stem at u in 0..1
  var x0 = 0, y0 = 0, x1 = p.lean * 0.3, y1 = -p.h * 0.55, x2 = p.lean, y2 = -p.h;
  var a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
  return [a * x0 + b * x1 + c * x2, a * y0 + b * y1 + c * y2];
}
function drawPlant(p, t) {
  var ph = t / LOOP;
  var sway = SWAY_MAX * Math.sin(Math.PI * 2 * SWAY_CYCLES * ph + p.phase);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(sway);
  // stem
  ctx.strokeStyle = LEAF_A; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(p.lean * 0.3, -p.h * 0.55, p.lean, -p.h);
  ctx.stroke();
  // stacked triangle leaves, alternating sides and greens
  var n = Math.max(3, Math.floor(p.h / 24));
  for (var i = 1; i <= n; i++) {
    var u = i / (n + 0.5);
    var pt = stemPoint(p, u);
    var side = (i % 2 === 0 ? 1 : -1) * (p.flipLeaf ? -1 : 1);
    var L = 56 * (1 - u * 0.45), Wd = 17 * (1 - u * 0.3);
    var tipx = pt[0] + side * L * 0.82, tipy = pt[1] - L * 0.3;
    ctx.fillStyle = i % 2 === 0 ? LEAF_A : LEAF_B;
    ctx.beginPath();
    ctx.moveTo(pt[0] - 4, pt[1] - Wd * 0.4);
    ctx.lineTo(tipx, tipy);
    ctx.lineTo(pt[0] + 4, pt[1] + Wd * 0.5);
    ctx.closePath(); ctx.fill();
  }
  // tip leaf, straight up
  var top = stemPoint(p, 1);
  ctx.fillStyle = LEAF_B;
  ctx.beginPath();
  ctx.moveTo(top[0] - 6, top[1] + 6);
  ctx.lineTo(top[0] + 3, top[1] - 26);
  ctx.lineTo(top[0] + 8, top[1] + 6);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawSprig(sp) {
  ctx.save();
  ctx.translate(sp.x, sp.y); ctx.rotate(sp.rot); ctx.scale(sp.s, sp.s);
  ctx.strokeStyle = sp.col; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(0, -14); ctx.stroke();
  ctx.fillStyle = sp.col;
  var ys = [-8, 2, 12];
  for (var i = 0; i < ys.length; i++) {
    ctx.beginPath();
    ctx.moveTo(0, ys[i] - 6); ctx.lineTo(-15, ys[i] + 3); ctx.lineTo(0, ys[i] + 6);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, ys[i] - 6); ctx.lineTo(15, ys[i] + 3); ctx.lineTo(0, ys[i] + 6);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2000, -2000, DW + 4000, DH + 4000);
  var i;
  for (i = 0; i < PLANTS.length; i++) if (!PLANTS[i].front) drawPlant(PLANTS[i], T);
  for (i = 0; i < ANIMALS.length; i++) drawAnimal(ANIMALS[i], T);
  for (i = 0; i < PLANTS.length; i++) if (PLANTS[i].front) drawPlant(PLANTS[i], T);
  for (i = 0; i < SPRIGS.length; i++) drawSprig(SPRIGS[i]);
  // berries last: clusters on a tiny stem, then single dots
  for (i = 0; i < BERRIES.length; i++) {
    var b = BERRIES[i];
    ctx.strokeStyle = LEAF_A; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x, b.y + 12); ctx.lineTo(b.x, b.y); ctx.stroke();
    for (var k = 0; k < b.dots.length; k++) dot(b.x + b.dots[k].dx, b.y + b.dots[k].dy, b.dots[k].r, BERRY);
  }
  for (i = 0; i < DOTS.length; i++) dot(DOTS[i].x, DOTS[i].y, DOTS[i].r, BERRY);
}

// ---- sizing: full-bleed cover fit, ground is the beige -----------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- pointer: drag turns nearby fauna toward the pointer ----------
// While dragging, each animal inside TURN_RADIUS eases
// its turn toward a target tilt: head up when the
// pointer is above it, head down when below, scaled by
// closeness. On release every target returns to zero
// and the step snaps the turn to exactly zero, so the
// animals settle back to precisely their authored
// rotations.
var dragging = false, px = 0, py = 0;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  px = p[0]; py = p[1]; dragging = true;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  px = p[0]; py = p[1];
});
function endPointer() { dragging = false; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

function step() {
  for (var i = 0; i < ANIMALS.length; i++) {
    var a = ANIMALS[i];
    var target = 0;
    if (dragging) {
      var dx = px - a.x, dy = py - a.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < TURN_RADIUS) {
        var vt = TURN_MAX * (1 - d / TURN_RADIUS) * (dy >= 0 ? 1 : -1);
        target = a.flip ? -vt : vt; // the mirror flips apparent rotation
      }
    }
    a.turn += (target - a.turn) * Math.min(1, TICK * 5);
    if (target === 0 && Math.abs(a.turn) < 0.001) a.turn = 0; // exact settle
  }
}

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
