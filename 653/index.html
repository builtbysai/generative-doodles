<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cinco Estrellas</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0B; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var GROUND = '#0A0A0B';
  var PAPER = '#F2EDE4';
  var STEEL = '#8A8A8C';
  var BASE = '#3A3A3D';

  var BASE_SEED = 653001;

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // True Cruz del Sur geometry, tangent-plane projection of catalog
  // positions (RA, Dec), facing south: east (Mimosa) falls to the left.
  // Normalized units: x right, y down. Vertical span 6.00, horizontal 4.07.
  //   Gacrux  RA 187.79  Dec -57.11   (head)
  //   Acrux   RA 186.65  Dec -63.10   (foot)
  //   Mimosa  RA 191.93  Dec -59.69   (east arm)
  //   Imai    RA 183.79  Dec -58.75   (west arm)
  //   Epsilon RA 185.34  Dec -60.40   (fifth star, beside the Acrux-Imai arm)
  var STARS = [
    { name: 'gacrux',  x:  0.04, y: -2.99, size: 0.85 },
    { name: 'acrux',   x:  0.61, y:  3.00, size: 1.00 },
    { name: 'mimosa',  x: -2.03, y: -0.41, size: 0.92 },
    { name: 'imai',    x:  2.04, y: -1.35, size: 0.72 },
    { name: 'epsilon', x:  1.26, y:  0.30, size: 0.55 }
  ];
  // Inter-node springs: the cross outline (head to arms, arms to foot,
  // the crossbar) and epsilon's two braces. No spine link: the tethers
  // hold the vertical, and the outline keeps the cross readable.
  var LINKS = [[0, 2], [0, 3], [2, 3], [2, 1], [3, 1], [4, 1], [4, 3]];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, isPhone = false;

  // Layout in px, rebuilt on resize.
  var unit = 60;                 // px per normalized unit
  var cx = 0, cy = 0;            // cross center
  var anchorX = 0, anchorY = 0;  // ring anchor (fixed point)
  var baseTop = 0;               // y of the base band's nominal top edge
  var baseEdge = [];             // seeded irregular top edge of the base

  // Shard outlines, normalized to radius 1, seeded once.
  var shards = [];

  // Sim state.
  var pos = [], prev = [], rest = [], tetherLen = [], linkLen = [];
  var dragIdx = -1, dragX = 0, dragY = 0, dragMoved = false;
  var simSteps = 0;              // fixed steps taken on the anchored clock
  var DT = 1 / 240;
  var GRAV = 55;                 // px/s^2, light
  var DAMP = 0.9795;             // per-step velocity keep factor: decay
                                 // rate about 5/s against the home spring,
                                 // near half of critical, so a release
                                 // overshoots once, gently, and settles
                                 // within a few seconds
  var KH = 26;                   // home spring /s^2: the steel structure
                                 // holds each star centered on its place,
                                 // so rest is the unique equilibrium and a
                                 // hard pull flexes instead of cartwheeling
                                 // the whole cross around the ring

  function buildShards() {
    var rng = mulberry32(BASE_SEED);
    shards = [];
    for (var s = 0; s < STARS.length; s++) {
      var n = 6 + Math.floor(rng() * 3);       // 6 to 8 vertices
      var rot = rng() * Math.PI * 2;
      var pts = [];
      for (var i = 0; i < n; i++) {
        var a = rot + (i / n) * Math.PI * 2;
        var r = 0.68 + rng() * 0.45;
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      shards.push(pts);
    }
    // Base top edge: gentle seeded irregularity across the width.
    baseEdge = [];
    var m = 14;
    for (var j = 0; j <= m; j++) baseEdge.push((rng() - 0.5) * 2);
  }

  function layout() {
    var uH = H * 0.46 / 6.0;
    var uW = W * (isPhone ? 0.80 : 0.62) / 4.07;
    unit = Math.min(uH, uW);
    cx = W / 2;
    cy = H * 0.44;
    anchorX = W / 2;
    anchorY = H * 0.085;
    baseTop = H * 0.80;
    rest = [];
    var i;
    for (i = 0; i < STARS.length; i++) {
      rest.push([cx + STARS[i].x * unit, cy + STARS[i].y * unit]);
    }
    tetherLen = [];
    for (i = 0; i < STARS.length; i++) {
      var dx = rest[i][0] - anchorX, dy = rest[i][1] - anchorY;
      tetherLen.push(Math.sqrt(dx * dx + dy * dy));
    }
    linkLen = [];
    for (i = 0; i < LINKS.length; i++) {
      var a = rest[LINKS[i][0]], b = rest[LINKS[i][1]];
      var ddx = b[0] - a[0], ddy = b[1] - a[1];
      linkLen.push(Math.sqrt(ddx * ddx + ddy * ddy));
    }
  }

  function resetSim() {
    pos = []; prev = [];
    for (var i = 0; i < STARS.length; i++) {
      pos.push([rest[i][0], rest[i][1]]);
      prev.push([rest[i][0], rest[i][1]]);
    }
    simSteps = 0;
    dragIdx = -1;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || H > W * 1.15;
    layout();
    resetSim();
  }

  function stepSim(tSec) {
    var i, p, q;
    // Integrate.
    var sway = 5.0 * Math.sin(tSec * 0.55);
    for (i = 0; i < STARS.length; i++) {
      if (i === dragIdx) {
        // Held star: pos and prev both pinned, so it carries no Verlet
        // velocity; on release it starts from rest at the displaced
        // position and the springs, not a pointer fling, drive the swing.
        pos[i][0] = dragX; pos[i][1] = dragY;
        prev[i][0] = dragX; prev[i][1] = dragY;
        continue;
      }
      p = pos[i]; q = prev[i];
      var vx = (p[0] - q[0]) * DAMP, vy = (p[1] - q[1]) * DAMP;
      var vmax = 6; // per-step displacement clamp, keeps the solve stable
      if (vx > vmax) vx = vmax; else if (vx < -vmax) vx = -vmax;
      if (vy > vmax) vy = vmax; else if (vy < -vmax) vy = -vmax;
      q[0] = p[0]; q[1] = p[1];
      // Home spring toward the star's place (y target pre-sagged by
      // GRAV / KH so the hang settles on the true cross, not below it).
      var hx = (rest[i][0] - p[0]) * KH;
      var hy = (rest[i][1] + GRAV / KH - p[1]) * KH;
      p[0] += vx + (sway + hx) * DT * DT;
      p[1] += vy + (GRAV + hy) * DT * DT;
    }
    // Constraints.
    for (var iter = 0; iter < 16; iter++) {
      for (i = 0; i < STARS.length; i++) {
        if (i === dragIdx) continue;
        p = pos[i];
        var dx = p[0] - anchorX, dy = p[1] - anchorY;
        var d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
        var diff = (d - tetherLen[i]) / d;
        p[0] -= dx * diff; p[1] -= dy * diff;
      }
      for (i = 0; i < LINKS.length; i++) {
        var ia = LINKS[i][0], ib = LINKS[i][1];
        var a = pos[ia], b = pos[ib];
        var lx = b[0] - a[0], ly = b[1] - a[1];
        var ld = Math.sqrt(lx * lx + ly * ly) || 0.0001;
        var corr = (ld - linkLen[i]) / ld * 0.20; // compliant: links stretch
                                 // visibly under a pull instead of dragging
                                 // the whole web rigidly with the held star
        var wa = ia === dragIdx ? 0 : 1, wb = ib === dragIdx ? 0 : 1;
        var ws = wa + wb;
        if (!ws) continue;
        // Each free end takes its share of the compliant correction.
        a[0] += lx * corr * (wa / ws); a[1] += ly * corr * (wa / ws);
        b[0] -= lx * corr * (wb / ws); b[1] -= ly * corr * (wb / ws);
      }
    }
  }

  function advanceTo(tSec) {
    var target = Math.floor(tSec / DT);
    var guard = 0;
    while (simSteps < target && guard < 60) {
      stepSim(simSteps * DT);
      simSteps++;
      guard++;
    }
    if (simSteps < target) simSteps = target; // dropped time after a long stall
  }

  function lineWidthFor(len, restLen) {
    var stretch = (len - restLen) / restLen;
    var w = 1.12 - stretch * 1.5;
    return w < 0.45 ? 0.45 : (w > 1.3 ? 1.3 : w);
  }

  function drawPositions(P) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Base: one low granite mass, irregular top edge, bottom fifth.
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, baseTop + baseEdge[0] * unit * 0.05);
    for (var j = 1; j < baseEdge.length; j++) {
      ctx.lineTo((j / (baseEdge.length - 1)) * W, baseTop + baseEdge[j] * unit * 0.05);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = BASE;
    ctx.fill();

    ctx.strokeStyle = STEEL;
    ctx.lineCap = 'round';

    // Inter-node lines (weak springs, drawn first, under the tethers).
    var i, a, b, dx, dy, d;
    for (i = 0; i < LINKS.length; i++) {
      a = P[LINKS[i][0]]; b = P[LINKS[i][1]];
      dx = b[0] - a[0]; dy = b[1] - a[1];
      d = Math.sqrt(dx * dx + dy * dy);
      ctx.lineWidth = lineWidthFor(d, linkLen[i]) * 0.85;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }

    // Tether lines to the ring anchor.
    for (i = 0; i < STARS.length; i++) {
      a = P[i];
      dx = a[0] - anchorX; dy = a[1] - anchorY;
      d = Math.sqrt(dx * dx + dy * dy);
      ctx.lineWidth = lineWidthFor(d, tetherLen[i]);
      ctx.beginPath();
      ctx.moveTo(anchorX, anchorY);
      ctx.lineTo(a[0], a[1]);
      ctx.stroke();
    }

    // The ring.
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(anchorX, anchorY, Math.max(5, unit * 0.10), 0, Math.PI * 2);
    ctx.stroke();

    // The five stone points: flat paper shards, no glyphs, no glow.
    ctx.fillStyle = PAPER;
    for (i = 0; i < STARS.length; i++) {
      var r = unit * 0.30 * STARS[i].size;
      var pts = shards[i];
      ctx.beginPath();
      ctx.moveTo(P[i][0] + pts[0][0] * r, P[i][1] + pts[0][1] * r);
      for (var k = 1; k < pts.length; k++) {
        ctx.lineTo(P[i][0] + pts[k][0] * r, P[i][1] + pts[k][1] * r);
      }
      ctx.closePath();
      ctx.fill();
    }
  }

  function draw(tSec) {
    advanceTo(tSec);
    drawPositions(pos);
  }

  // Anchored elapsed clock from rAF timestamps, offset plus elapsed
  // since load. Frame one is drawn synchronously at t = 0, at rest.
  var t0 = null, lastTs = null;

  function elapsed(tsMs) { return (tsMs - t0) / 1000; }

  // QA hook: ?seed=disturb draws the synchronous frame with Acrux pulled
  // off its rest position (unsolved), so stretch and line thinning show.
  var qaDisturb = false;
  if (typeof location !== 'undefined' && location.search) {
    if (/seed=disturb/.test(location.search)) qaDisturb = true;
  }

  function frame(ts) {
    if (t0 === null) t0 = ts;
    lastTs = ts;
    draw(elapsed(ts));
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  function redraw() {
    if (lastTs !== null && t0 !== null) draw(elapsed(lastTs));
    else draw(0);
  }

  function pointerPos(ev) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [ev.clientX - r.left, ev.clientY - r.top];
  }

  canvas.addEventListener('pointerdown', function (ev) {
    var p = pointerPos(ev);
    var best = -1, bestD = 34 + unit * 0.15;
    for (var i = 0; i < STARS.length; i++) {
      var dx = pos[i][0] - p[0], dy = pos[i][1] - p[1];
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0) {
      dragIdx = best;
      dragX = p[0]; dragY = p[1];
      dragMoved = false;
      if (canvas.setPointerCapture && ev.pointerId !== undefined) {
        try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
      }
    }
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (dragIdx < 0) return;
    var p = pointerPos(ev);
    dragX = p[0]; dragY = p[1];
    dragMoved = true;
    redraw();
  });
  function endDrag() {
    // Release: the star starts from rest at its displaced position
    // (velocity is zeroed while held) and the springs settle it home.
    dragIdx = -1;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); redraw(); });
  }
  window.addEventListener('resize', function () { resize(); redraw(); });

  buildShards();
  resize();

  if (qaDisturb) {
    var P = [];
    for (var i2 = 0; i2 < STARS.length; i2++) P.push([rest[i2][0], rest[i2][1]]);
    P[1][0] -= unit * 0.85; P[1][1] += unit * 0.55;  // Acrux pulled down-left
    P[4][0] -= unit * 0.22; P[4][1] += unit * 0.16;  // Epsilon dragged along
    drawPositions(P);
  } else {
    draw(0); // frame one: the true cross at rest, synchronous
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
