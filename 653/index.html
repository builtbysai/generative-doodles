<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№653 Britain in Colour, Pointed and Shot</title>
<style>
  html, body { margin: 0; padding: 0; background: #2b2721; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1994 Britain in Colour, Pointed and Shot, SN3 / PP1241,
  // study #260 syd-nuku. A point-and-shoot diary: a stack of
  // twelve prints, vernacular subjects, grain visible, slightly
  // uneven exposure, white date stamps. One frame at a time fills
  // the view, the next print peeking at the edge like a print
  // stack. The frame holds, the grain shimmers; occasionally the
  // stack shuffles. TAP advances to the next print in the stack
  // (never reseeds; the diary has an order). Study ref: M3
  // point-and-shoot diary.
  var GROUND = '#2b2721'; // tabletop the stack sits on
  var PRINT_WHITE = '#f4efe2';

  // Fixed-phase first frame: FIRST_T = 6 s. Frame 0 is the beached
  // boat; grain shimmer sits at a fixed phase at t = 6, the stack
  // shuffle offset is fixed, and the flip is at rest, so the first
  // frame is byte-stable. Grain shimmer runs on a slow 7.3 s sine
  // with small amplitude: subtle, never flashing, well under 14 Hz.
  var FIRST_T = 6;
  var SEED = 1994;
  var FLIP_DUR = 0.55;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias, so the node-canvas render tool
  // (which passes its probe value as ?seed=) can verify that the
  // frame changes over time. Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // The 12 prints, in diary order. Never reordered, never reseeded.
  var FRAMES = [
    { name: 'Beached Boat',    date: '03 JUN 07' },
    { name: 'Ferry Deck',      date: '04 JUN 07' },
    { name: 'Ridge Walkers',   date: '09 JUN 07' },
    { name: 'Allotment',       date: '11 JUN 07' },
    { name: 'Service Station', date: '14 JUN 07' },
    { name: 'Caravan Park',    date: '16 JUN 07' },
    { name: 'Bus Stop, Rain',  date: '18 JUN 07' },
    { name: 'Garden Fence',    date: '21 JUN 07' },
    { name: 'Corner Shop',     date: '23 JUN 07' },
    { name: 'The Pier',        date: '25 JUN 07' },
    { name: 'Playing Field',   date: '27 JUN 07' },
    { name: 'Terraced Street', date: '28 JUN 07' }
  ];

  var idx = 0;    // current print
  var flip = null; // {from, to, start} while a print-flip runs

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // ---- Film colour -------------------------------------------------
  var SKY_PALE = ['#b7c6c2', '#d9dcd0'];
  var SKY_GOLD = ['#d9bd8a', '#ecdcb0'];
  var SKY_DUSK = ['#7d7484', '#a89a90'];
  var SKY_GREY = ['#9aa3a0', '#c2c4bd'];
  var GREEN_DARK = '#55663f';
  var GREEN_MID = '#6d7d5a';
  var GREEN_PALE = '#8a9670';
  var GRASS_DRY = '#a89a6a';
  var GREY_MID = '#8a8a80';
  var GREY_DARK = '#5f5f58';
  var WARM = '#c9a06a';
  var WARM_PALE = '#d8b078';
  var RUST = '#7a4a38';
  var RUST_LIGHT = '#a85a44';
  var SEA = '#6f8278';
  var SEA_DARK = '#4e5f58';
  var CREAM = '#efe6cf';
  var WHITE = [244, 239, 226];

  // Image-area geometry, set inside drawPrint before a scene draws.
  var IX = 0, IY = 0, IW = 0, IH = 0;

  // Scene helpers: coordinates are fractions of the image area.
  function R(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(IX + x * IW, IY + y * IH, w * IW, h * IH);
  }
  function P(pts, c) {
    var i;
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(IX + pts[0][0] * IW, IY + pts[0][1] * IH);
    for (i = 1; i < pts.length; i++) {
      ctx.lineTo(IX + pts[i][0] * IW, IY + pts[i][1] * IH);
    }
    ctx.closePath();
    ctx.fill();
  }
  function C(x, y, r, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(IX + (x + r) * IW, IY + y * IH);
    ctx.arc(IX + x * IW, IY + y * IH, r * IW, 0, Math.PI * 2);
    ctx.fill();
  }
  function LN(x1, y1, x2, y2, w, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(IX + x1 * IW, IY + y1 * IH);
    ctx.lineTo(IX + x2 * IW, IY + y2 * IH);
    ctx.stroke();
  }
  function skyGrad(top, bot) {
    var g = ctx.createLinearGradient(0, IY, 0, IY + IH);
    g.addColorStop(0, top);
    g.addColorStop(1, bot);
    ctx.fillStyle = g;
    ctx.fillRect(IX, IY, IW, IH);
  }
  function rngFor(f) { return mulberry32(SEED * 31 + f * 101 + 7); }

  // A tuft of dune or verge grass: a few thin strokes from one base.
  function tuft(x, y, s, c1, c2, rng) {
    var i, a;
    for (i = 0; i < 5; i++) {
      a = -Math.PI / 2 + (rng() - 0.5) * 1.1;
      LN(x, y, x + Math.cos(a) * 0.035 * s, y + Math.sin(a) * 0.05 * s,
        Math.max(1, IW * 0.0016), rng() < 0.5 ? c1 : c2);
    }
  }

  // ---- The twelve prints -------------------------------------------
  // 0. Beached boat in dune grass.
  function scBoat() {
    var rng = rngFor(0), i;
    skyGrad(SKY_PALE[0], SKY_PALE[1]);
    R(0, 0.52, 1, 0.12, SEA);            // flat grey-green sea
    R(0, 0.56, 1, 0.02, '#e8e4d2');      // pale tide line
    R(0, 0.62, 1, 0.38, '#b3a888');      // sand
    P([[0, 0.62], [0.28, 0.56], [0.62, 0.60], [1, 0.55], [1, 0.62]], '#9a9a72'); // dune rise
    // Hull, beached and tilted, rust red with a white sheer strake.
    P([[0.30, 0.50], [0.62, 0.44], [0.66, 0.50], [0.60, 0.62], [0.36, 0.66], [0.29, 0.58]], RUST);
    P([[0.30, 0.50], [0.62, 0.44], [0.63, 0.47], [0.31, 0.53]], CREAM);
    LN(0.47, 0.46, 0.47, 0.30, Math.max(1.5, IW * 0.003), '#4a3a30'); // mast
    LN(0.47, 0.30, 0.58, 0.44, Math.max(1, IW * 0.0016), '#4a3a30');  // stay
    R(0.40, 0.56, 0.06, 0.05, '#3a3230');  // dark hatch
    // Dune grass tufts across the foreground.
    for (i = 0; i < 26; i++) {
      tuft(0.03 + rng() * 0.94, 0.68 + rng() * 0.30, 0.7 + rng() * 0.9, GRASS_DRY, GREEN_PALE, rng);
    }
    // A rope coil and a bucket left on the sand.
    C(0.72, 0.78, 0.028, '#8a7a5a');
    C(0.72, 0.78, 0.016, '#6a5a42');
    R(0.80, 0.74, 0.045, 0.06, '#5a6b7d');
  }

  // 1. Ferry deck at golden hour.
  function scFerry() {
    var rng = rngFor(1), i;
    skyGrad(SKY_GOLD[0], SKY_GOLD[1]);
    C(0.68, 0.34, 0.055, '#f2e2b0');      // low sun
    C(0.68, 0.34, 0.085, 'rgba(242,226,176,0.35)');
    R(0, 0.48, 1, 0.16, SEA_DARK);        // sea, dark against the light
    R(0, 0.48, 1, 0.015, '#e8d9a8');      // sun path on the water
    for (i = 0; i < 7; i++) {
      R(0.55 + rng() * 0.25, 0.50 + rng() * 0.10, 0.06 + rng() * 0.10, 0.008, 'rgba(232,217,168,0.5)');
    }
    R(0, 0.64, 1, 0.36, '#7a6a52');       // deck, flash-warm
    for (i = 0; i < 9; i++) {              // deck plank seams
      LN(0, 0.66 + i * 0.04, 1, 0.66 + i * 0.04, Math.max(1, IH * 0.002), 'rgba(60,48,36,0.45)');
    }
    // Rail: two bars and posts.
    LN(0, 0.40, 1, 0.40, Math.max(2, IH * 0.006), '#e8e2d2');
    LN(0, 0.52, 1, 0.52, Math.max(1.5, IH * 0.004), '#e8e2d2');
    for (i = 0; i < 8; i++) {
      LN(0.06 + i * 0.13, 0.40, 0.06 + i * 0.13, 0.64, Math.max(1.5, IW * 0.002), '#d8d2c2');
    }
    // Lifebuoy hung on the rail.
    ctx.strokeStyle = '#c96a3a';
    ctx.lineWidth = Math.max(3, IW * 0.012);
    ctx.beginPath();
    ctx.moveTo(IX + (0.22 + 0.045) * IW, IY + 0.46 * IH);
    ctx.arc(IX + 0.22 * IW, IY + 0.46 * IH, 0.045 * IW, 0, Math.PI * 2);
    ctx.stroke();
    // A passenger at the rail, back to camera, coat warm in the light.
    R(0.55, 0.44, 0.055, 0.13, '#8a5a44');
    C(0.577, 0.432, 0.024, '#6a4a38');
    R(0.545, 0.57, 0.065, 0.07, '#5f4a3c');
  }

  // 2. Hikers on a ridge.
  function scRidge() {
    var rng = rngFor(2), i;
    skyGrad('#b2c2c6', '#d5d8cc');
    C(0.80, 0.20, 0.05, 'rgba(240,238,224,0.9)'); // pale sun, high
    P([[0, 0.30], [0.30, 0.24], [0.55, 0.30], [1, 0.22], [1, 0.46], [0, 0.52]], '#7d8a68'); // far hill
    P([[0, 0.52], [0.25, 0.40], [0.52, 0.46], [0.78, 0.38], [1, 0.44], [1, 1], [0, 1]], GREEN_MID); // ridge
    P([[0, 0.52], [0.25, 0.40], [0.52, 0.46], [0.78, 0.38], [1, 0.44], [1, 0.52], [0.78, 0.46], [0.52, 0.54], [0.25, 0.48], [0, 0.60]], GREEN_DARK); // ridge shadow face
    // Three walkers with packs, strung along the crest.
    var walkers = [[0.22, 0.435, '#a85a44'], [0.34, 0.415, '#5a6b7d'], [0.47, 0.44, '#8a7a4a']];
    for (i = 0; i < walkers.length; i++) {
      var wx = walkers[i][0], wy = walkers[i][1], wc = walkers[i][2];
      R(wx - 0.012, wy - 0.035, 0.024, 0.055, wc);       // body
      R(wx - 0.026, wy - 0.030, 0.014, 0.04, '#4a3a30'); // pack
      C(wx, wy - 0.048, 0.013, '#3a3230');               // head
      LN(wx - 0.008, wy + 0.02, wx - 0.014, wy + 0.055, Math.max(1.5, IW * 0.002), '#3a3230'); // legs
      LN(wx + 0.008, wy + 0.02, wx + 0.016, wy + 0.052, Math.max(1.5, IW * 0.002), '#3a3230');
    }
    for (i = 0; i < 18; i++) {
      tuft(0.04 + rng() * 0.92, 0.62 + rng() * 0.34, 0.6 + rng() * 0.8, GRASS_DRY, GREEN_PALE, rng);
    }
    // A drystone wall crossing the lower slope.
    LN(0, 0.78, 1, 0.70, Math.max(2, IH * 0.008), '#8a8378');
    for (i = 0; i < 12; i++) {
      LN(0.05 + i * 0.08, 0.775 - i * 0.006, 0.05 + i * 0.08, 0.79 - i * 0.006, Math.max(1, IW * 0.002), '#6a6358');
    }
  }

  // 3. Allotment.
  function scAllotment() {
    var rng = rngFor(3), i, j;
    skyGrad(SKY_PALE[0], SKY_PALE[1]);
    R(0, 0.34, 1, 0.10, '#8a9670');       // hedge line
    R(0, 0.44, 1, 0.56, '#7d7a52');       // worked earth
    // Plot strips in alternating greens and browns.
    var strips = ['#6d7d4a', '#8a6a4a', '#5a6b3f', '#a89a6a', '#6d7d5a', '#7d6a4a'];
    for (i = 0; i < 6; i++) {
      R(i * 0.17, 0.44, 0.155, 0.56, strips[i]);
      for (j = 0; j < 8; j++) {            // crop rows
        LN(i * 0.17 + 0.01, 0.48 + j * 0.06, (i + 1) * 0.17 - 0.01, 0.48 + j * 0.06, Math.max(1, IH * 0.003), 'rgba(40,48,28,0.4)');
      }
    }
    // Shed with a pitched roof, left of centre.
    P([[0.08, 0.46], [0.20, 0.38], [0.32, 0.46]], '#5f4a3c');
    R(0.10, 0.46, 0.20, 0.14, '#7a6248');
    R(0.17, 0.50, 0.06, 0.10, '#4a3a30');
    R(0.12, 0.48, 0.03, 0.03, '#c9d2c2');
    // Bean poles: a wigwam of canes.
    for (i = 0; i < 5; i++) {
      LN(0.62 + i * 0.03, 0.62, 0.685, 0.44, Math.max(1, IW * 0.0016), '#a89a72');
    }
    LN(0.60, 0.60, 0.78, 0.60, Math.max(1, IW * 0.0016), '#a89a72');
    // Watering can and a bucket by the path.
    R(0.44, 0.78, 0.05, 0.045, '#5a6b7d');
    LN(0.44, 0.79, 0.415, 0.77, Math.max(1.5, IW * 0.002), '#5a6b7d');
    R(0.52, 0.80, 0.04, 0.05, '#8a7a5a');
    // Path down the middle, pale gravel.
    P([[0.47, 0.44], [0.53, 0.44], [0.56, 1], [0.44, 1]], '#b3a888');
    // Fence posts along the front.
    for (i = 0; i < 9; i++) {
      LN(0.04 + i * 0.12, 0.86, 0.04 + i * 0.12, 0.98, Math.max(2, IW * 0.004), '#6a5a42');
    }
    LN(0, 0.90, 1, 0.90, Math.max(1.5, IH * 0.004), '#6a5a42');
  }

  // 4. Service station at dusk.
  function scStation() {
    var rng = rngFor(4), i;
    skyGrad(SKY_DUSK[0], SKY_DUSK[1]);
    C(0.82, 0.22, 0.035, '#e8ddc2');      // early moon
    R(0, 0.62, 1, 0.38, '#5f5f58');       // forecourt
    R(0, 0.62, 1, 0.015, '#8a8378');      // kerb light
    // Canopy slab on two columns, underside lit warm.
    R(0.08, 0.30, 0.72, 0.07, '#3a3a40');
    R(0.08, 0.37, 0.72, 0.015, WARM);
    R(0.14, 0.385, 0.03, 0.24, '#4a4a50');
    R(0.68, 0.385, 0.03, 0.24, '#4a4a50');
    R(0.10, 0.30, 0.68, 0.02, '#c96a3a'); // fascia stripe
    // Pumps under the canopy.
    for (i = 0; i < 2; i++) {
      var px = 0.24 + i * 0.28;
      R(px, 0.44, 0.09, 0.18, '#c2b8a2');
      R(px + 0.02, 0.46, 0.05, 0.05, '#3a3230');
      R(px + 0.02, 0.53, 0.05, 0.02, '#c96a3a');
      LN(px + 0.09, 0.50, px + 0.12, 0.60, Math.max(1, IW * 0.002), '#2a2622');
    }
    // Price pylon, glowing.
    R(0.86, 0.24, 0.09, 0.30, '#2a2a30');
    R(0.875, 0.26, 0.06, 0.10, '#e8c96a');
    R(0.875, 0.38, 0.06, 0.06, '#c96a3a');
    // A car at the pump, headlights on.
    R(0.42, 0.52, 0.20, 0.09, '#4a4a48');
    P([[0.44, 0.52], [0.48, 0.46], [0.56, 0.46], [0.60, 0.52]], '#3a3a38');
    C(0.46, 0.615, 0.022, '#1a1a18');
    C(0.58, 0.615, 0.022, '#1a1a18');
    C(0.415, 0.585, 0.014, '#f2e2b0');
    R(0.38, 0.575, 0.05, 0.02, 'rgba(242,226,176,0.5)'); // headlight wash
    // Wet forecourt reflections.
    for (i = 0; i < 10; i++) {
      R(0.10 + rng() * 0.75, 0.70 + rng() * 0.24, 0.05 + rng() * 0.12, 0.006, 'rgba(232,201,106,0.25)');
    }
  }

  // 5. Caravan park.
  function scCaravan() {
    var rng = rngFor(5), i;
    skyGrad(SKY_PALE[0], SKY_PALE[1]);
    R(0, 0.55, 1, 0.45, '#8a9670');       // grass field
    R(0, 0.55, 1, 0.03, '#6d7d5a');
    // Caravan one: cream with a rust stripe.
    R(0.10, 0.52, 0.34, 0.16, CREAM);
    R(0.10, 0.60, 0.34, 0.03, RUST_LIGHT);
    R(0.14, 0.55, 0.07, 0.06, '#5a6b7d');
    R(0.28, 0.55, 0.07, 0.06, '#5a6b7d');
    C(0.20, 0.685, 0.028, '#2a2622');
    C(0.34, 0.685, 0.028, '#2a2622');
    LN(0.44, 0.55, 0.44, 0.68, Math.max(1.5, IW * 0.002), '#4a3a30'); // tow bar
    // Caravan two, further back, smaller.
    R(0.58, 0.46, 0.28, 0.13, '#e8e0cc');
    R(0.58, 0.53, 0.28, 0.025, '#5a6b7d');
    R(0.62, 0.48, 0.05, 0.05, '#4a4a50');
    R(0.72, 0.48, 0.05, 0.05, '#4a4a50');
    C(0.66, 0.595, 0.022, '#2a2622');
    C(0.78, 0.595, 0.022, '#2a2622');
    // Groundsheet laid out in front of caravan one, and a chair.
    R(0.12, 0.78, 0.22, 0.06, 'rgba(201,160,106,0.85)');
    R(0.06, 0.84, 0.05, 0.06, '#7d8a68');
    // Washing line, high enough to clear the second caravan's roof.
    LN(0.56, 0.38, 0.94, 0.34, Math.max(1, IW * 0.0016), '#4a3a30');
    var cloths = ['#c2b8a2', '#a8b8a8', '#c9a06a', '#b8b0a0'];
    for (i = 0; i < 4; i++) {
      R(0.60 + i * 0.085, 0.375 - i * 0.01, 0.05, 0.065, cloths[i]);
    }
    // A windbreak and a plastic chair.
    R(0.86, 0.66, 0.10, 0.10, '#b8b0a0');
    LN(0.86, 0.66, 0.96, 0.66, Math.max(1.5, IW * 0.002), '#8a8378');
    for (i = 0; i < 14; i++) {
      tuft(0.03 + rng() * 0.94, 0.82 + rng() * 0.16, 0.6 + rng() * 0.7, GRASS_DRY, GREEN_PALE, rng);
    }
  }

  // 6. Bus stop in rain.
  function scBusStop() {
    var rng = rngFor(6), i;
    skyGrad(SKY_GREY[0], SKY_GREY[1]);
    R(0, 0.58, 1, 0.42, '#6a6a64');       // wet road
    R(0, 0.58, 1, 0.02, '#8a8a80');
    // Wet reflections: vertical light streaks.
    for (i = 0; i < 16; i++) {
      R(0.05 + rng() * 0.9, 0.62 + rng() * 0.30, 0.008 + rng() * 0.02, 0.05 + rng() * 0.14, 'rgba(220,220,210,0.20)');
    }
    // Shelter: glass panels, flat roof, bench.
    R(0.16, 0.30, 0.40, 0.04, '#4a4a48');
    R(0.16, 0.34, 0.015, 0.34, '#4a4a48');
    R(0.545, 0.34, 0.015, 0.34, '#4a4a48');
    R(0.175, 0.34, 0.37, 0.34, 'rgba(180,190,185,0.35)');
    R(0.175, 0.34, 0.37, 0.10, 'rgba(220,225,220,0.18)');
    R(0.20, 0.56, 0.32, 0.03, '#7a5a44'); // bench
    LN(0.22, 0.59, 0.22, 0.68, Math.max(1.5, IW * 0.002), '#5a4636');
    LN(0.50, 0.59, 0.50, 0.68, Math.max(1.5, IW * 0.002), '#5a4636');
    // A waiting figure, umbrella up, lowered over the head.
    R(0.60, 0.50, 0.045, 0.14, '#5a6b7d');
    C(0.622, 0.485, 0.018, '#3a3230');
    P([[0.55, 0.49], [0.695, 0.49], [0.622, 0.415]], '#a85a44'); // umbrella
    LN(0.622, 0.49, 0.622, 0.52, Math.max(1, IW * 0.0016), '#3a3230');

  var SCENES = [scBoat, scFerry, scRidge, scAllotment, scStation, scCaravan,
    scBusStop, scFence, scShop, scPier, scField, scTerrace];

  // ---- Film grain and exposure -------------------------------------
  // Per-frame grain: fixed seeded dots, so frame one is byte-stable.
  // Shimmer is a slow 7.3 s sine with small amplitude, a pure function
  // of t, so every render at the same t is identical.
  var GRAIN = [];
  var LEAK = [];
  (function () {
    var f, i, rng;
    for (f = 0; f < 12; f++) {
      rng = mulberry32(SEED * 101 + f * 57 + 11);
      var dots = [];
      for (i = 0; i < 420; i++) {
        dots.push({
          x: rng(), y: rng(),
          r: 0.0009 + rng() * 0.0018,
          a: 0.05 + rng() * 0.11,
          white: rng() < 0.45,
          ph: rng() * Math.PI * 2
        });
      }
      GRAIN.push(dots);
      LEAK.push({
        x: rng(), y: rng() * 0.5,
        r: 0.45 + rng() * 0.35,
        a: 0.04 + rng() * 0.05
      });
    }
  })();

  function drawGrain(f, t) {
    var dots = GRAIN[f], i, d, m, a;
    for (i = 0; i < dots.length; i++) {
      d = dots[i];
      m = 0.88 + 0.12 * Math.sin(2 * Math.PI * t / 7.3 + d.ph);
      a = d.a * m;
      if (a <= 0.01) { continue; }
      ctx.fillStyle = d.white ? rgba(WHITE, a4(a)) : rgba([20, 18, 14], a4(a));
      ctx.fillRect(IX + d.x * IW, IY + d.y * IH, Math.max(1, d.r * IW), Math.max(1, d.r * IW));
    }
  }

  function drawLeak(f) {
    var lk = LEAK[f];
    var gx = IX + lk.x * IW, gy = IY + lk.y * IH, gr = lk.r * IW;
    var g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, rgba([242, 226, 176], a4(lk.a)));
    g.addColorStop(1, rgba([242, 226, 176], 0));
    ctx.fillStyle = g;
    ctx.fillRect(IX, IY, IW, IH);
  }

  function drawVignette() {
    var cx = IX + IW / 2, cy = IY + IH / 2, r = Math.max(IW, IH) * 0.72;
    var g = ctx.createRadialGradient(cx, cy, r * 0.45, cx, cy, r);
    g.addColorStop(0, rgba([0, 0, 0], 0));
    g.addColorStop(1, rgba([0, 0, 0], a4(0.12)));
    ctx.fillStyle = g;
    ctx.fillRect(IX, IY, IW, IH);
  }

  // ---- Layout ------------------------------------------------------
  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.021, 12, 16));
    L.fsStamp = Math.round(clamp(W * 0.018, 10, 14));
    L.border = Math.max(8, Math.round(W * 0.028));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- One print ---------------------------------------------------
  // Draws print f as a white-bordered photo, offset by (ox, oy) in
  // stage px, scaled about its centre, with an optional slight
  // rotation. When captions is true, the title plate, date line,
  // frame counter and hint ride on the print.
  function drawPrint(f, ox, oy, scale, alpha, rot, captions) {
    ctx.save();
    ctx.globalAlpha = a4(clamp(alpha, 0, 1));
    var cx = W / 2 + ox, cy = H / 2 + oy;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    if (rot) { ctx.rotate(rot); }
    ctx.translate(-W / 2, -H / 2);

    // Drop shadow so the stack reads as paper on a table.
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(4, 6, W, H);
    // The print itself: white border around the image.
    ctx.fillStyle = PRINT_WHITE;
    ctx.fillRect(0, 0, W, H);
    IX = L.border; IY = L.border;
    IW = W - 2 * L.border; IH = H - 2 * L.border;

    ctx.save();
    ctx.beginPath();
    ctx.rect(IX, IY, IW, IH);
    ctx.clip();
    SCENES[f]();
    drawLeak(f);
    drawVignette();
    // White date stamp, bottom right, as the camera printed it.
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba([255, 255, 255], a4(0.92));
    ctx.font = 'bold ' + L.fsStamp + 'px "Courier New", Courier, monospace';
    ctx.fillText(FRAMES[f].date, IX + IW - 10, IY + IH - 10);
    drawGrain(f, lastT);
    ctx.restore();

    if (captions) {
      // Title plate, top left inside the image; white with a soft
      // dark offset so it stays readable over any sky.
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
      ctx.fillStyle = rgba([20, 18, 14], a4(0.35));
      ctx.fillText('№653 · Britain in Colour, Pointed and Shot', IX + 11, IY + L.fsCap + 11);
      ctx.fillStyle = rgba([255, 255, 255], a4(0.88));
      ctx.fillText('№653 · Britain in Colour, Pointed and Shot', IX + 10, IY + L.fsCap + 10);
      ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
      ctx.fillStyle = rgba([255, 255, 255], a4(0.70));
      ctx.fillText('2007 · 06 · 28', IX + 10, IY + L.fsCap + 10 + L.fsDate + 6);
      // Frame counter, top right.
      ctx.textAlign = 'right';
      ctx.font = '600 ' + L.fsDate + 'px Georgia, "Times New Roman", serif';
      ctx.fillStyle = rgba([255, 255, 255], a4(0.80));
      ctx.fillText((f + 1) + ' / 12', IX + IW - 10, IY + L.fsDate + 10);
      // Hint, bottom centre, clear of the date stamp at the right.
      ctx.textAlign = 'center';
      ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
      ctx.fillStyle = rgba([20, 18, 14], a4(0.35));
      ctx.fillText('Tap to turn to the next print.', IX + IW / 2 + 1, IY + IH - 9);
      ctx.fillStyle = rgba([255, 255, 255], a4(0.88));
      ctx.fillText('Tap to turn to the next print.', IX + IW / 2, IY + IH - 10);
      ctx.textAlign = 'left';
    }
    ctx.restore();
  }

  // ---- Draw --------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Tabletop ground; the stage is the whole image.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // The stack shuffles occasionally: a slow wobble on the peek
    // offset, a pure function of t.
    var peek = Math.max(10, W * 0.022) + 4 * Math.sin(2 * Math.PI * t / 24 + 1);

    if (flip) {
      var p = clamp((t - flip.start) / FLIP_DUR, 0, 1);
      if (p >= 1) {
        idx = flip.to;
        flip = null;
      }
    }
    if (flip) {
      var q = clamp((t - flip.start) / FLIP_DUR, 0, 1);
      // Incoming print slides from the peek offset into place
      // (the stack's top position, shifted up-left by the peek).
      var inX = peek * (1 - q) + (-peek) * q;
      drawPrint(flip.to, inX, inX, 1, 1, 0, false);
      // Outgoing print lifts, slides right and fades.
      drawPrint(flip.from, -peek + q * IW * 0.45, -peek - q * IH * 0.05, 1 - 0.05 * q, 1 - 0.22 * q, q * 0.05, true);
    } else {
      // Next print peeking at the right and bottom edges; the top
      // print sits shifted up-left by the peek so the stack reads.
      drawPrint((idx + 1) % 12, peek, peek, 1, 1, 0, false);
      drawPrint(idx, -peek, -peek, 1, 1, 0, true);
    }
  }

  // ---- Interaction -------------------------------------------------
  // TAP advances to the next print in the fixed order. Taps during a
  // flip are ignored; the diary never reseeds and never reloads.
  function tap() {
    if (flip) { return; }
    flip = { from: idx, to: (idx + 1) % 12, start: lastT };
  }
  function onTap(e) {
    if (e && typeof e.preventDefault === 'function') { e.preventDefault(); }
    tap();
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', onTap);
      canvas.addEventListener('click', onTap);
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1994 exposes the stack state for probes.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1994 = {
      firstT: FIRST_T,
      index: function () { return idx; },
      flipping: function () { return flip !== null; },
      frameName: function (i) { return FRAMES[i].name; },
      frameDate: function (i) { return FRAMES[i].date; },
      count: function () { return FRAMES.length; },
      tap: tap,
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: grain shimmers and the stack shuffles slowly.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
