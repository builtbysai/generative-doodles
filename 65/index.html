<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№65 · Pascal's Field</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(24,24,24,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to ripple the count</div>
<script>
'use strict';
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '65', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }

const HUES=['#f4f1ea','#d93b3b','#f2a01e','#f5c518','#2cae57','#1fb3cc','#7a2fd9'];
const PASCAL=[];
for(let n=0;n<=16;n++){ const row=[1]; for(let k=1;k<n;k++) row.push(PASCAL[n-1][k-1]+PASCAL[n-1][k]); if(n>0) row.push(1); PASCAL.push(row); }
function Cnk(n,k){ if(k<0||k>n) return 0; return PASCAL[n][k]; }
function keff(n,c){ if(c<=n) return c; const m=2*n-c; return m<0?0:m; }
const OFFS=[[0,0],[0,1],[1,0],[1,1],[-1,0],[0,-1],[1,-1],[-1,1]];
function residue(r,c,ti,mod){
  const o=OFFS[ti];
  let n=r+o[0]; n=Math.max(0,Math.min(8,n));
  let k=keff(n,c+o[1]);
  const v=Cnk(n,k);
  return ((v%mod)+mod)%mod;
}
const MODS=[5,6,7,9];
function nextMod(m){ const i=MODS.indexOf(m); return MODS[(i+1)%MODS.length]; }
let ripple=null;
function drawLayer(w,h,mod,alpha){
  const phone=isPhone(); const N=9;
  let ox,oy,cw,ch;
  if(phone){ ox=0; oy=0; cw=w/N; ch=h/N; } else { const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; cw=S/N; ch=S/N; }
  ctx.save(); ctx.globalAlpha=alpha;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    let m=mod;
    if(ripple){
      const d=Math.max(Math.abs(r-ripple.r),Math.abs(c-ripple.c));
      if(d<=1) m=nextMod(mod);
    }
    const x=ox+c*cw, y=oy+r*ch, cx=x+cw/2, cy=y+ch/2;
    const pts=[[x,y],[cx,y],[x+cw,y],[x+cw,cy],[x+cw,y+ch],[cx,y+ch],[x,y+ch],[x,cy]];
    for(let i=0;i<8;i++){
      const res=residue(r,c,i,m);
      ctx.fillStyle=HUES[res%HUES.length];
      const p1=pts[i], p2=pts[(i+1)%8];
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
  ctx.save(); ctx.strokeStyle='#f4f1ea'; ctx.lineWidth=1;
  for(let i=0;i<=N;i++){
    ctx.beginPath(); ctx.moveTo(ox+i*cw,oy); ctx.lineTo(ox+i*cw,oy+N*ch); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox,oy+i*ch); ctx.lineTo(ox+N*cw,oy+i*ch); ctx.stroke();
  }
  ctx.restore();
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#f4f1ea'; ctx.fillRect(0,0,w,h);
  const t=nowMs/1000;
  const seg=Math.floor(t/6), within=t-seg*6;
  const cur=MODS[seg%MODS.length], prev=MODS[((seg-1)%MODS.length+MODS.length)%MODS.length];
  if(seg>0 && within<1.2){ drawLayer(w,h,prev,1); drawLayer(w,h,cur,smooth(within/1.2)); }
  else drawLayer(w,h,cur,1);
  if(ripple && nowMs-ripple.at>1600) ripple=null;
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
function cellAt65(ev){
  const [w,h]=viewportWH(); const phone=isPhone(); const N=9;
  let ox,oy,cw,ch;
  if(phone){ ox=0; oy=0; cw=w/N; ch=h/N; } else { const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; cw=S/N; ch=S/N; }
  const c=Math.floor((ev.clientX-ox)/cw), r=Math.floor((ev.clientY-oy)/ch);
  if(r<0||c<0||r>=N||c>=N) return null;
  return {r,c};
}
canvas.addEventListener('pointerdown',ev=>{ const cell=cellAt65(ev); if(cell) ripple={r:cell.r,c:cell.c,at:performance.now()}; });
canvas.addEventListener('pointermove',ev=>{ const cell=cellAt65(ev); if(cell && ripple) ripple={r:cell.r,c:cell.c,at:performance.now()}; });
function end65(){ if(ripple) ripple.at=performance.now()-800; }
canvas.addEventListener('pointerup',end65); canvas.addEventListener('pointercancel',end65);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
