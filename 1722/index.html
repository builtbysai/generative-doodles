<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Threshold</title>
<style>
html, body { margin: 0; padding: 0; background: #D63384; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#D63384';
var PLATE = '#16294E';
var PLATE_LINE = 'rgba(249,215,232,0.55)';
var TITLE_INK = '#FBD3E8';
var HINT_INK = '#F8A8CC';
var PERIOD = 48;
var FRAME_T = 8.5;
var STEP_S = 8;
var GRID = 90;
/* threshold steps, one per 8 s, six steps per 48 s loop */
var STEPS = [0.34, 0.38, 0.42, 0.46, 0.50, 0.54];
/* pink wash bands below the threshold, navy above it */
var BAND_LOW = '#F8A8CC';
var BAND_MID = '#EF6FB0';
var BAND_HIGH = '#D63384';
var NAVY = '#16294E';
var STRIATION = '#FBD3E8';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1722);
var phaseT = FRAME_T;
/* ---- one continuous scalar field: 6 seeded gaussian bumps + value noise ---- */
var BUMPS = [];
(function () {
  /* jittered 3x2 grid so the six bumps stay separated: distinct blobs, not one mass */
  var cells = [[0.22, 0.25], [0.50, 0.22], [0.78, 0.28], [0.25, 0.72], [0.52, 0.75], [0.78, 0.72]];
  var i;
  for (i = 0; i < 6; i++) {
    BUMPS.push({
      cx: cells[i][0] + (rng() - 0.5) * 0.12,
      cy: cells[i][1] + (rng() - 0.5) * 0.12,
      sx: 0.12 + rng() * 0.05,
      sy: 0.12 + rng() * 0.05,
      amp: 0.68 + rng() * 0.27,
      ph: rng() * TAU
    });
  }
})();
/* value-noise lattice, 5x5 and 9x9 octaves, seeded */
var LAT1 = [], LAT2 = [];
(function () {
  var i;
  for (i = 0; i < 25; i++) LAT1.push(rng());
  for (i = 0; i < 81; i++) LAT2.push(rng());
})();
function smooth(a, b, f) {
  var s = f * f * (3 - 2 * f);
  return a + (b - a) * s;
}
function vnoise(u, v, lat, n) {
  var x = u * n, y = v * n;
  var xi = Math.floor(x), yi = Math.floor(y);
  var xf = x - xi, yf = y - yi;
  var x0 = xi % n, x1 = (xi + 1) % n, y0 = yi % n, y1 = (yi + 1) % n;
  var a = lat[y0 * n + x0], b = lat[y0 * n + x1];
  var c = lat[y1 * n + x0], d = lat[y1 * n + x1];
  return smooth(smooth(a, b, xf), smooth(c, d, xf), yf);
}
function gauss(u, v, cx, cy, sx, sy, amp) {
  var dx = (u - cx) / sx, dy = (v - cy) / sy;
  return amp * Math.exp(-(dx * dx + dy * dy));
}
function fieldAt(u, v, t) {
  var i, b, f = 0;
  for (i = 0; i < BUMPS.length; i++) {
    b = BUMPS[i];
    var cx = b.cx + 0.02 * Math.sin(TAU * t / PERIOD + b.ph);
    var cy = b.cy + 0.02 * Math.cos(TAU * t / PERIOD + b.ph * 0.7);
    f += gauss(u, v, cx, cy, b.sx, b.sy, b.amp);
  }
  f += 0.10 * (vnoise(u, v, LAT1, 5) - 0.5) * 2;
  f += 0.04 * (vnoise(u, v, LAT2, 9) - 0.5) * 2;
  return clamp(f, 0, 1);
}
function thresholdAt(t) {
  var idx = Math.floor(t / STEP_S) % STEPS.length;
  return STEPS[idx];
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones (field-like composition) ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- marching squares: filled region where field >= level, one path ---- */
function fillLevel(vals, level, st) {
  var n = GRID, i, j;
  var cw = st.w / n, ch = st.h / n;
  ctx.beginPath();
  var a, b, c, d, idx, x0, y0;
  for (j = 0; j < n; j++) {
    for (i = 0; i < n; i++) {
      a = vals[j * (n + 1) + i];
      b = vals[j * (n + 1) + i + 1];
      c = vals[(j + 1) * (n + 1) + i + 1];
      d = vals[(j + 1) * (n + 1) + i];
      idx = 0;
      if (a >= level) idx |= 8;
      if (b >= level) idx |= 4;
      if (c >= level) idx |= 2;
      if (d >= level) idx |= 1;
      if (idx === 0) continue;
      x0 = st.x + i * cw; y0 = st.y + j * ch;
      if (idx === 15) {
        ctx.moveTo(x0, y0);
        ctx.lineTo(x0 + cw, y0);
        ctx.lineTo(x0 + cw, y0 + ch);
        ctx.lineTo(x0, y0 + ch);
        ctx.closePath();
        continue;
      }
      var tx = x0 + cw * ((level - a) / (b - a));
      var rx = x0 + cw, ry = y0 + ch * ((level - b) / (c - b));
      var bx = x0 + cw * ((level - d) / (c - d)), by = y0 + ch;
      var lx = x0, ly = y0 + ch * ((level - a) / (d - a));
      var A = [x0, y0], B = [x0 + cw, y0], C = [x0 + cw, y0 + ch], D = [x0, y0 + ch];
      var T = [tx, y0], R = [rx, ry], Bo = [bx, by], L = [lx, ly];
      var polys = null;
      if (idx === 1) polys = [[D, L, Bo]];
      else if (idx === 2) polys = [[C, Bo, R]];
      else if (idx === 3) polys = [[D, C, R, L]];
      else if (idx === 4) polys = [[B, T, R]];
      else if (idx === 5) polys = [[B, T, R], [D, L, Bo]];
      else if (idx === 6) polys = [[B, C, Bo, T]];
      else if (idx === 7) polys = [[T, B, C, D, L]];
      else if (idx === 8) polys = [[A, L, T]];
      else if (idx === 9) polys = [[A, D, Bo, T]];
      else if (idx === 10) polys = [[A, L, T], [C, Bo, R]];
      else if (idx === 11) polys = [[A, T, R, C, D]];
      else if (idx === 12) polys = [[A, B, R, L]];
      else if (idx === 13) polys = [[A, B, R, Bo, D, L]];
      else if (idx === 14) polys = [[A, B, C, Bo, L]];
      if (polys) {
        var p, q;
        for (p = 0; p < polys.length; p++) {
          ctx.moveTo(polys[p][0][0], polys[p][0][1]);
          for (q = 1; q < polys[p].length; q++) ctx.lineTo(polys[p][q][0], polys[p][q][1]);
          ctx.closePath();
        }
      }
    }
  }
}
/* ---- marching squares contour lines: the level's ring edges, as segments ---- */
function strokeLevel(vals, level, st) {
  var n = GRID, i, j;
  var cw = st.w / n, ch = st.h / n;
  ctx.beginPath();
  var a, b, c, d, idx, x0, y0;
  for (j = 0; j < n; j++) {
    for (i = 0; i < n; i++) {
      a = vals[j * (n + 1) + i];
      b = vals[j * (n + 1) + i + 1];
      c = vals[(j + 1) * (n + 1) + i + 1];
      d = vals[(j + 1) * (n + 1) + i];
      idx = 0;
      if (a >= level) idx |= 8;
      if (b >= level) idx |= 4;
      if (c >= level) idx |= 2;
      if (d >= level) idx |= 1;
      if (idx === 0 || idx === 15) continue;
      x0 = st.x + i * cw; y0 = st.y + j * ch;
      var tx = x0 + cw * ((level - a) / (b - a));
      var rx = x0 + cw, ry = y0 + ch * ((level - b) / (c - b));
      var bx = x0 + cw * ((level - d) / (c - d)), by = y0 + ch;
      var lx = x0, ly = y0 + ch * ((level - a) / (d - a));
      var T = [tx, y0], R = [rx, ry], Bo = [bx, by], L = [lx, ly];
      var segs = null;
      if (idx === 1) segs = [[L, Bo]];
      else if (idx === 2) segs = [[Bo, R]];
      else if (idx === 3) segs = [[L, R]];
      else if (idx === 4) segs = [[T, R]];
      else if (idx === 5) segs = [[T, R], [L, Bo]];
      else if (idx === 6) segs = [[T, Bo]];
      else if (idx === 7) segs = [[T, L]];
      else if (idx === 8) segs = [[L, T]];
      else if (idx === 9) segs = [[Bo, T]];
      else if (idx === 10) segs = [[L, T], [Bo, R]];
      else if (idx === 11) segs = [[T, R]];
      else if (idx === 12) segs = [[L, R]];
      else if (idx === 13) segs = [[R, Bo]];
      else if (idx === 14) segs = [[Bo, L]];
      if (segs) {
        var s;
        for (s = 0; s < segs.length; s++) {
          ctx.moveTo(segs[s][0][0], segs[s][0][1]);
          ctx.lineTo(segs[s][1][0], segs[s][1][1]);
        }
      }
    }
  }
}
function draw() {
  size();
  ctx.fillStyle = BAND_LOW;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, st.w, st.h);
  ctx.clip();
  var t = phaseT;
  var T = thresholdAt(t);
  var n = GRID, i, j;
  var vals = new Float32Array((n + 1) * (n + 1));
  for (j = 0; j <= n; j++) {
    for (i = 0; i <= n; i++) {
      vals[j * (n + 1) + i] = fieldAt(i / n, j / n, t);
    }
  }
  /* wash bands, low to high: hard quantized pink levels */
  var b1 = T * 0.45, b2 = T * 0.80;
  fillLevel(vals, b1, st);
  ctx.fillStyle = BAND_MID;
  ctx.fill();
  fillLevel(vals, b2, st);
  ctx.fillStyle = BAND_HIGH;
  ctx.fill();
  /* navy blobs above the stepping threshold */
  fillLevel(vals, T, st);
  ctx.fillStyle = NAVY;
  ctx.fill();
  /* pale striations hugging every level boundary */
  ctx.strokeStyle = STRIATION;
  ctx.lineWidth = Math.max(1, st.w / 420);
  strokeLevel(vals, b1, st);
  ctx.stroke();
  strokeLevel(vals, b2, st);
  ctx.stroke();
  strokeLevel(vals, T, st);
  ctx.stroke();
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Ink Threshold').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Ink Threshold').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 29').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Ink Threshold', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 29', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the threshold step.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    thresholdAt: function (t) { return thresholdAt(t); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 8.5 s, just after the step at 8 s ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
