<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Crystalline Dialogue</title>
<style>
html, body { margin: 0; padding: 0; background: #07080A; overflow: hidden; }
canvas { display: block; touch-action: none; }
#soundBtn {
  position: fixed; right: 12px; bottom: 12px; z-index: 10;
  font: 12px monospace; color: #C9A86A; background: #0A0B0E;
  border: 1px solid rgba(185,200,216,0.40); padding: 7px 12px;
  cursor: pointer; letter-spacing: 0.04em;
}
#soundBtn.on { color: #E8A33D; border-color: rgba(232,163,61,0.70); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="soundBtn" type="button">Sound: off</button>
<script>
/* The Crystalline Dialogue: two agents on a dark stage, a warm vocal
   line (amber, continuous, breathy) above and a cool guitar line
   (silver, plucked, faceted) below. They begin in strict canon: every
   phrase the voice sings, the guitar repeats exactly one breath later.
   Over about 90 seconds the canon loosens into free counterpoint: the
   guitar decorates, the voice holds, phrases overlap and miss. In the
   final third both renounce form: the lines break into labile fragments

var GROUND = '#07080A';

var GUITAR = '#B9C8D8';

var GUITAR_BRIGHT = '#D7E2EC';
var OPAL = '#D5DDE8';
var OPAL_VIOLET = '#E6D9F2';

var TITLE_INK = '#EDE6D6';
var HINT_INK = '#C9A86A';

    var osc2 = audioCtx.createOscillator();

    g.gain.linearRampToValueAtTime(0.0001, now + ev.dur + 0.2);

    osc.start(now); osc2.start(now);

    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();

  soundBtn.addEventListener('click', function (ev) {
    if (ev && ev.preventDefault) ev.preventDefault();
    toggleSound();
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      /* when an event begins and audio is live, sound it */
      if (audioOn && audioCtx) {
        var i;
        for (i = 0; i < events.length; i++) {
          var ev = events[i];
          if (ev.t > phaseT) break;
          if (ev.t > lastAudioT && ev.t <= phaseT) {
            if (ev.agent === 0) playVoice(ev); else playGuitar(ev);
          }
        }
        lastAudioT = phaseT;
      }
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
