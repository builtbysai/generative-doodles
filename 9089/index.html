<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9089 · Rhizome</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #070907; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var SEED = 9089;
  var GROUND = 'rgb(7,9,7)';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(SEED);

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0;

  var walkers = [];
  var MAXW = 420;
  var SEASON_LEN = 46; // seconds per grow / prune / rebirth cycle

  var seasonT = 0;
  var ptr = { x: -9999, y: -9999, down: false };

  var JADES = ['#9fd8cd', '#7fc4b6', '#5fb3a6', '#3f8f84'];
  var AMBERS = ['#d9a441', '#c78f33'];

  function pickLineage() {
    if (rng() < 0.12) return AMBERS[(rng() * AMBERS.length) | 0];
    return JADES[(rng() * JADES.length) | 0];
  }

  function spawn(x, y, col) {
    if (walkers.length >= MAXW) walkers.shift();
    var ml = 90 + rng() * 220;
    var w = {
      x: x, y: y,
      a: rng() * Math.PI * 2,
      sp: 1.1 + rng() * 1.7,
      w: 0.8 + rng() * 2.2,
      life: ml, maxLife: ml,
      col: col || pickLineage()
    };
    walkers.push(w);
    return w;
  }

  function seedBurst(n, cx, cy, spread) {
    for (var i = 0; i < n; i++) {
      var a = rng() * Math.PI * 2, r = Math.sqrt(rng()) * spread;
      spawn(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
  }

  function clearGround() {
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
  }

  function reseed(hard) {
    rng = mulberry32((Date.now() ^ SEED) >>> 0);
    walkers.length = 0;
    if (hard) clearGround();
    var n = Math.round(Math.min(W, H) / 9);
    for (var i = 0; i < 3; i++) {
      seedBurst(n, W * (0.2 + 0.6 * rng()), H * (0.2 + 0.6 * rng()), Math.min(W, H) * 0.22);
    }
    seasonT = -Math.PI / 2 + 0.4; // restart near spring
  }

  function resize() {
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.lineCap = 'round';
    clearGround();
  }

  function angDiff(a, b) {
    var d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  var last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts;
    var dt60 = dt * 60;

    seasonT += (dt / SEASON_LEN) * Math.PI * 2;
    var season = 0.5 + 0.5 * Math.sin(seasonT); // 0 winter .. 1 summer

    // fade old ink; winter fades faster, pruning the network
    var fade = 0.022 + (1 - season) * 0.055;
    ctx.fillStyle = 'rgba(7,9,7,' + fade.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);

    // spring sowing
    if (season > 0.25) {
      var rate = (season - 0.25) * 5 * dt60;
      var n = Math.floor(rate) + (rng() < rate - Math.floor(rate) ? 1 : 0);
      for (var s = 0; s < n; s++) spawn(rng() * W, rng() * H);
    }
    if (walkers.length < 30 && season > 0.35) {
      seedBurst(24, W / 2 + (rng() - 0.5) * W * 0.5, H / 2 + (rng() - 0.5) * H * 0.5, Math.min(W, H) * 0.2);
    }

    var growth = 0.3 + 0.9 * season;
    for (var i = walkers.length - 1; i >= 0; i--) {
      var w = walkers[i];
      w.a += (rng() - 0.5) * 0.5 * dt60;
      // bend toward the finger
      if (ptr.down) {
        var pdx = ptr.x - w.x, pdy = ptr.y - w.y;
        var pd2 = pdx * pdx + pdy * pdy;
        var R = 260;
        if (pd2 < R * R && pd2 > 1) {
          var want = Math.atan2(pdy, pdx);
          w.a += angDiff(want, w.a) * 0.09 * (1 - Math.sqrt(pd2) / R) * dt60;
        }
      }
      var step = w.sp * growth * dt60;
      var nx = w.x + Math.cos(w.a) * step;
      var ny = w.y + Math.sin(w.a) * step;
      var frac = w.life / w.maxLife;
      ctx.strokeStyle = w.col;
      ctx.globalAlpha = 0.25 + 0.65 * frac;
      ctx.lineWidth = Math.max(0.5, w.w * frac);
      ctx.beginPath();
      ctx.moveTo(w.x, w.y);
      ctx.lineTo(nx, ny);
      ctx.stroke();
      w.x = nx; w.y = ny;
      w.life -= dt60 * (1.1 - 0.5 * season);
      // branch
      if (rng() < 0.05 * dt60 * growth && walkers.length < MAXW) {
        var c = spawn(w.x, w.y, w.col);
        c.a = w.a + (rng() < 0.5 ? -1 : 1) * (0.35 + rng() * 0.6);
        c.w = Math.max(0.4, w.w * 0.72);
        c.maxLife = c.life = w.maxLife * (0.5 + rng() * 0.4);
        c.sp = w.sp * (0.85 + rng() * 0.3);
      }
      if (w.life <= 0 || nx < -20 || nx > W + 20 || ny < -20 || ny > H + 20) {
        walkers.splice(i, 1);
      }
    }
    ctx.globalAlpha = 1;
  }

  var lastTap = 0;
  cv.addEventListener('pointerdown', function (e) {
    ptr.down = true; ptr.x = e.clientX; ptr.y = e.clientY;
  });
  window.addEventListener('pointermove', function (e) {
    if (ptr.down) { ptr.x = e.clientX; ptr.y = e.clientY; }
  });
  window.addEventListener('pointerup', function () {
    ptr.down = false;
    var now = Date.now();
    if (now - lastTap < 320) reseed(true);
    lastTap = now;
  });
  window.addEventListener('resize', resize);

  resize();
  reseed(false);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
