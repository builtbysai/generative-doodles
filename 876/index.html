<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tape That Has Since Been Lost</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (strict) ----------
  var C_BG = '#0A0A0A';     // tape black
  var C_AMBER = '#FFB000';  // tape line / counter
  var C_MARK = '#E8E8E0';   // recorded marks / playhead
  var C_HISS = '#8A8A86';   // hiss bloom
  var C_VOID = '#020203';   // dropout void

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1, isPhone = false;

  function computeSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : (window.innerWidth || 720);
    H = vv ? vv.height : (window.innerHeight || 720);
    DPR = window.devicePixelRatio || 1;
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    isPhone = (Math.min(sw, sh) < 700) || (H > W * 1.15);
  }
  function resize() {
    computeSize();
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- tape model ----------
  var SEG = 240;                 // wear / mark resolution along the tape
  var CRAWL = 1 / 90;            // one pass = 90 s at play speed
  var DT = 1 / 30;               // fixed simulation timestep
  var DROPOUT_AT = 0.93;         // local wear where the signal is eaten

  var epoch = 0;                 // tape number (0 = first tape)
  var marks = [];                // per segment: null or {kind, off, len, dy}
  var wear = new Float32Array(SEG);
  var hissPts = [];              // precomputed speckle field (unit space)
  var pos = 0.30;                // playhead position, 0..1
  var dir = 1;                   // 1 forward, -1 flipped (playing backwards)
  var plays = 0;                 // completed passes, never resets
  var scrubbing = false;
  var needleUntil = -1;          // playhead pos where a needle-drop sweep ends
  var gone = false;              // interlude: recording gone, new tape loading
  var goneT = 0;
  var simT = 0;

  function buildHiss() {
    var rng = mulberry32(987123 + epoch * 131);
    hissPts = [];
    var N = 2600;
    for (var i = 0; i < N; i++) {
      var x = rng();
      // concentrate toward top and bottom edges
      var side = rng() < 0.5 ? 0 : 1;
      var depth = Math.pow(rng(), 1.8) * 0.30;
      var y = side === 0 ? depth : 1 - depth;
      hissPts.push({ x: x, y: y, ph: rng() * Math.PI * 2, s: 1 + rng() * 1.6 });
    }
  }

  function buildTape(ep, preWearTarget) {
    epoch = ep;
    var rng = mulberry32(20210 + ep * 7919);
    marks = [];
    var i;
    for (i = 0; i < SEG; i++) {
      if (rng() < 0.34) { marks.push(null); continue; }
      marks.push({
        kind: rng(),                       // shape selector
        off: rng(),                        // offset inside segment
        len: 0.5 + rng() * 1.8,            // length in segment widths
        dy: (rng() - 0.5) * 0.7            // vertical offset in band halves
      });
    }
    // pre-worn patches: a found tape, already slightly worn
    wear = new Float32Array(SEG);
    var patches = 6 + Math.floor(rng() * 3);
    for (var p = 0; p < patches; p++) {
      var c = rng() * SEG, wdt = 4 + rng() * 14, amp = 0.25 + rng() * 0.4;
      for (i = 0; i < SEG; i++) {
        var d = Math.abs(i - c);
        if (d < wdt) wear[i] += amp * (1 - d / wdt);
      }
    }
    // normalize so the mean wear matches the target exactly
    var sum = 0;
    for (i = 0; i < SEG; i++) sum += wear[i];
    var mean = sum / SEG;
    if (mean > 0.0001) {
      var k = preWearTarget / mean;
      for (i = 0; i < SEG; i++) wear[i] = Math.min(0.62, wear[i] * k);
    }
    buildHiss();
  }

  function meanWear() {
    var s = 0;
    for (var i = 0; i < SEG; i++) s += wear[i];
    return s / SEG;
  }

  function addWear(centerPos, radiusSeg, amount) {
    var c = Math.floor(centerPos * SEG);
    for (var i = -radiusSeg; i <= radiusSeg; i++) {
      var idx = c + i;
      if (idx < 0 || idx >= SEG) continue;
      var f = 1 - Math.abs(i) / (radiusSeg + 1);
      wear[idx] = Math.min(1, wear[idx] + amount * f);
    }
  }

  buildTape(0, 0.07);
  pos = 0.30;

  // ---------- simulation (fixed timestep) ----------
  var lastPointerX = 0, scrubVel = 0;

  function step(dt) {
    simT += dt;
    if (gone) {
      goneT += dt;
      if (goneT > 4.5) {
        gone = false; goneT = 0;
        buildTape(epoch + 1, 0.02);
        pos = 0.12; dir = 1; needleUntil = -1;
      }
      return;
    }
    var speed = CRAWL * (needleUntil >= 0 ? 2.5 : 1);
    if (scrubbing) {
      // playhead follows the pointer; scrub speed writes wear
      var target = Math.max(0, Math.min(0.999, lastPointerX / W));
      var dx = target - pos;
      scrubVel = Math.abs(dx) / dt;              // tape units per second
      pos = target;
      var inten = 0.002 + Math.min(0.045, scrubVel * 0.10);
      addWear(pos, 2, inten * (dt / DT));
      if (pos <= 0.001) { dir = 1; }
    } else {
      pos += dir * speed * dt;
      // the playhead wears the tape gently wherever it passes
      addWear(pos, 0, 0.0011 * (dir < 0 ? 2 : 1) * (dt / DT));
      if (dir > 0 && pos >= 1) {
        pos -= 1; plays++;
        if (needleUntil >= 0) needleUntil = -1;
      } else if (dir < 0 && pos <= 0) {
        pos = 0; dir = 1; plays++;               // flip pass completed
      }
      if (needleUntil >= 0 && dir > 0 && pos >= needleUntil) needleUntil = -1;
    }
    if (meanWear() >= 0.995) { gone = true; goneT = 0; }
  }

  // ---------- audio (lazy, gesture only, typeof-guarded) ----------
  var AC = null, aMaster = null, aFilter = null, aWow = null, aHissGain = null, aReady = false;
  function ensureAudio() {
    if (aReady) { if (AC && AC.resume) AC.resume(); return; }
    var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext
      : (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      var dur = 2, nb = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
      var data = nb.getChannelData(0);
      var nr = mulberry32(4451);
      for (var i = 0; i < data.length; i++) data[i] = nr() * 2 - 1;
      aFilter = AC.createBiquadFilter(); aFilter.type = 'lowpass';
      aFilter.frequency.value = 3200; aFilter.Q.value = 0.4;
      aMaster = AC.createGain(); aMaster.gain.value = 0.0;
      var delay = AC.createDelay(1); delay.delayTime.value = 0.23;
      var fb = AC.createGain(); fb.gain.value = 0.34;
      var fbFilter = AC.createBiquadFilter(); fbFilter.type = 'lowpass'; fbFilter.frequency.value = 1400;
      var bed = AC.createGain(); bed.gain.value = 0.5;
      var o1 = AC.createOscillator(); o1.type = 'sine'; o1.frequency.value = 110;
      var o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 164.81;
      var og = AC.createGain(); og.gain.value = 0.16;
      var ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
      var ng = AC.createGain(); ng.gain.value = 0.05;
      o1.connect(og); o2.connect(og); ns.connect(ng);
      og.connect(bed); ng.connect(bed);
      bed.connect(aFilter);
      aFilter.connect(aMaster);
      aFilter.connect(delay); delay.connect(fbFilter); fbFilter.connect(fb); fb.connect(delay);
      var wet = AC.createGain(); wet.gain.value = 0.3; delay.connect(wet); wet.connect(aMaster);
      // wow / flutter
      aWow = AC.createOscillator(); aWow.frequency.value = 0.55;
      var wowG = AC.createGain(); wowG.gain.value = 2;
      aWow.connect(wowG); wowG.connect(o1.detune); wowG.connect(o2.detune);
      // hiss
      var hs = AC.createBufferSource(); hs.buffer = nb; hs.loop = true; hs.playbackRate.value = 0.7;
      var hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3800;
      aHissGain = AC.createGain(); aHissGain.gain.value = 0.0;
      hs.connect(hp); hp.connect(aHissGain); aHissGain.connect(aMaster);
      aMaster.connect(AC.destination);
      o1.start(); o2.start(); ns.start(); hs.start(); aWow.start();
      aReady = true;
    } catch (e) { AC = null; aReady = false; }
  }
  var audioTick = 0;
  function updateAudio() {
    if (!aReady || !AC) return;
    if ((audioTick++ & 7) !== 0) return;         // throttle parameter updates
    var w = gone ? 1 : meanWear();
    var t = AC.currentTime;
    // dropout gates: deterministic in sim time, keyed to plays and epoch
    var gateSeed = Math.floor(simT * 2.5) * 131 + plays * 17 + epoch * 7;
    var gr = mulberry32(gateSeed)();
    var drop = (!gone && gr < w * 0.30) ? 0.15 : 1;
    var masterTarget = gone ? 0.05 : (0.14 * drop);
    aMaster.gain.setTargetAtTime(masterTarget, t, 0.08);
    aFilter.frequency.setTargetAtTime(gone ? 500 : 3400 - w * 2600, t, 0.2);
    if (aHissGain) aHissGain.gain.setTargetAtTime(0.02 + w * 0.16, t, 0.3);
  }

  // ---------- interaction ----------
  var downT = 0, downX = 0, downY = 0, moved = false, lastTapT = -10, lastTapX = 0;
  function nowS() { return simT; }

  function onDown(x, y) {
    ensureAudio();
    downT = nowS(); downX = x; downY = y; moved = false;
    lastPointerX = x;
    scrubbing = false;
  }
  function onMove(x, y) {
    if (downT < 0) return;
    if (Math.abs(x - downX) > 8 || Math.abs(y - downY) > 8) moved = true;
    if (moved) { scrubbing = true; lastPointerX = x; }
  }
  function onUp(x, y) {
    var wasScrub = scrubbing;
    scrubbing = false;
    if (downT < 0) return;
    downT = -1;
    if (wasScrub || moved) return;
    // a tap
    if (nowS() - lastTapT < 0.35 && Math.abs(x - lastTapX) < 30) {
      // double tap: flip the tape, plays backwards once at double wear
      if (!gone) { dir = -1; needleUntil = -1; }
      lastTapT = -10;
    } else {
      // single tap: drop the needle, one clean sweep from here
      if (!gone) {
        pos = Math.max(0, Math.min(0.999, x / W));
        dir = 1;
        needleUntil = Math.min(0.999, pos + 0.30);
      }
      lastTapT = nowS(); lastTapX = x;
    }
  }
  downT = -1;
  canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY); });
  window.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
  window.addEventListener('pointerup', function (e) { onUp(e.clientX, e.clientY); });
  canvas.addEventListener('touchstart', function (e) {
    if (e.touches && e.touches[0]) onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchend', function (e) {
    if (e.changedTouches && e.changedTouches[0]) onUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  });

  // ---------- drawing ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = C_BG;
    ctx.fillRect(0, 0, W, H);

    var mw = gone ? 1 : meanWear();
    var bandH = Math.max(24, H * (isPhone ? 0.062 : 0.052));
    var yMid = H * 0.5;
    var segW = W / SEG;
    var fade = gone ? Math.max(0, 1 - goneT / 1.2) : 1;   // recording dies fast once gone

    // hiss bloom (density and alpha follow global wear)
    var hissCount = Math.floor(150 + mw * 2150);
    ctx.fillStyle = C_HISS;
    for (var hi = 0; hi < hissCount && hi < hissPts.length; hi++) {
      var hp2 = hissPts[hi];
      var tw = 0.10 + 0.16 * (0.5 + 0.5 * Math.sin(t * 1.7 + hp2.ph));
      ctx.globalAlpha = tw * (0.50 + mw * 0.50);
      ctx.fillRect(hp2.x * W, hp2.y * H, hp2.s, hp2.s);
    }
    ctx.globalAlpha = 1;

    // tape line: per-segment amber, wobbling and dimming with local wear
    var i, wob, x0;
    for (i = 0; i < SEG; i++) {
      var lw = wear[i];
      x0 = i * segW;
      wob = Math.sin(i * 0.55 + t * 2.1) * lw * bandH * 0.55
          + Math.sin(i * 0.13 - t * 0.9) * lw * bandH * 0.30;
      if (lw > DROPOUT_AT) {
        ctx.fillStyle = C_VOID;
        ctx.globalAlpha = 0.9;
        ctx.fillRect(x0, yMid - bandH * 0.85 + wob, segW + 1, bandH * 1.7);
      } else {
        // faint body of the tape
        ctx.fillStyle = C_AMBER;
        ctx.globalAlpha = 0.10 * (1 - lw * 0.6) * fade;
        ctx.fillRect(x0, yMid - bandH * 0.5 + wob, segW + 1, bandH);
        // the line itself
        ctx.globalAlpha = (1 - lw * 0.55) * (0.82 + 0.10 * Math.sin(t * 7 + i * 0.4)) * fade;
        ctx.fillRect(x0, yMid - bandH * 0.14 + wob, segW + 1, bandH * 0.28);
      }
    }
    ctx.globalAlpha = 1;

    // recorded marks
    if (!gone) {
      for (i = 0; i < SEG; i++) {
        var mk = marks[i];
        if (!mk) continue;
        var w2 = wear[i];
        if (w2 > DROPOUT_AT) continue;
        var mwob = Math.sin(i * 0.55 + t * 2.1) * w2 * bandH * 0.55
                 + Math.sin(i * 0.13 - t * 0.9) * w2 * bandH * 0.30;
        var mx = (i + 0.15 + mk.off * 0.7) * segW;
        var my = yMid + mk.dy * bandH * 0.5 + mwob;
        var baseA = (1 - w2 * 0.6) * 0.88;
        ctx.fillStyle = C_MARK;
        // smeared ghosts first (neighbor blur grows with wear)
        if (w2 > 0.15) {
          var sm = w2 * segW * 1.1;
          ctx.globalAlpha = baseA * 0.30;
          drawMark(mx - sm, my, mk, bandH, segW);
          ctx.globalAlpha = baseA * 0.30;
          drawMark(mx + sm, my, mk, bandH, segW);
          ctx.globalAlpha = baseA * 0.45;
          drawMark(mx - sm * 0.5, my, mk, bandH, segW);
          drawMark(mx + sm * 0.5, my, mk, bandH, segW);
        }
        ctx.globalAlpha = baseA;
        drawMark(mx, my, mk, bandH, segW);
      }
      ctx.globalAlpha = 1;
    }

    // playhead
    if (!gone) {
      var px = pos * W;
      ctx.fillStyle = C_MARK;
      ctx.globalAlpha = 0.9;
      ctx.fillRect(px - 1, yMid - bandH * 1.45, 2, bandH * 2.9);
      ctx.globalAlpha = 1;
      ctx.fillRect(px - 3.5, yMid - bandH * 1.62, 7, bandH * 0.22);
    }

    // interlude dim: the bare line and hiss, then the new tape
    if (gone) {
      ctx.fillStyle = C_BG;
      ctx.globalAlpha = Math.min(0.55, goneT * 0.4);
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    // counter (prompt-sanctioned text: the counting is the honesty)
    var pct = Math.round(mw * 100);
    ctx.fillStyle = C_AMBER;
    ctx.globalAlpha = 0.85;
    ctx.font = (isPhone ? 10 : 11) + 'px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var pad = Math.max(10, W * 0.018);
    ctx.fillText('PLAYS ' + plays, pad, H - pad - 15);
    ctx.fillText('WEAR ' + pct + '%', pad, H - pad);
    ctx.globalAlpha = 1;
  }

  function drawMark(x, y, mk, bandH, segW) {
    var k = mk.kind;
    if (k < 0.4) {
      // tall tick
      ctx.fillRect(x, y - bandH * 0.42, Math.max(1.4, segW * 0.30), bandH * 0.84);
    } else if (k < 0.75) {
      // dash
      ctx.fillRect(x, y - bandH * 0.09, segW * mk.len, bandH * 0.18);
    } else {
      // pair of short ticks
      ctx.fillRect(x, y - bandH * 0.30, Math.max(1.2, segW * 0.22), bandH * 0.60);
      ctx.fillRect(x + segW * 0.55, y - bandH * 0.30, Math.max(1.2, segW * 0.22), bandH * 0.60);
    }
  }

  // ---------- frame one (synchronous, deterministic) ----------
  draw(0);

  // ---------- main loop: fixed-timestep simulation ----------
  var acc = 0, lastTs = -1;
  function loop(ts) {
    if (lastTs < 0) lastTs = ts;
    var elapsed = Math.min(0.25, (ts - lastTs) / 1000);
    lastTs = ts;
    acc += elapsed;
    while (acc >= DT) { step(DT); acc -= DT; }
    draw(simT);
    updateAudio();
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
