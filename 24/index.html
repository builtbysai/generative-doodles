<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№24 · Spiral</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0c; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,240,228,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.85); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another spiral</div>
<script>
'use strict';
// No24 Spiral.
// One Archimedean spiral, walked from the center outward, with a
// capsule laid tangent at every step. Capsule length grows with the
// radius, so the coil starts as tight stitching and opens into long
// strokes at the rim; the spacing between arms is constant, which is
// what makes the coil read as one continuous ribbon of marks. Warm
// white on near-black, and the outermost capsule of the walk is gold.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '24', 10) || 24;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0a0a0c';

function compose(s) {
  const rnd = mulberry32(s);
  return {
    turns: 7 + rnd() * 3,
    rot: rnd() * Math.PI * 2,
    dir: rnd() < 0.5 ? 1 : -1
  };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.46;
  const totalAngle = p.turns * Math.PI * 2;
  const b = R / totalAngle;                    // radius per radian
  ctx.lineCap = 'round';
  // Walk by arc length, not by angle: the step shrinks as the radius
  // grows, so capsules stay evenly spaced along the whole coil.
  const ds = S * 0.011;
  let th = 0.25;
  let lastPt = null;
  while (th < totalAngle) {
    const r = b * th;
    const f = th / totalAngle;
    const a = p.rot + p.dir * th;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    const dx = -Math.sin(a) * r + Math.cos(a) * b * p.dir;
    const dy = Math.cos(a) * r + Math.sin(a) * b * p.dir;
    const dl = Math.hypot(dx, dy);
    const len = (S * 0.006) * (0.45 + f * 1.2);
    ctx.strokeStyle = 'rgba(245,240,228,0.85)';
    ctx.lineWidth = Math.max(0.9, S / 700) * (0.7 + f * 0.6);
    ctx.beginPath();
    ctx.moveTo(x - (dx / dl) * len / 2, y - (dy / dl) * len / 2);
    ctx.lineTo(x + (dx / dl) * len / 2, y + (dy / dl) * len / 2);
    ctx.stroke();
    lastPt = [x, y, dx / dl, dy / dl, len, f];
    th += ds / Math.max(1, dl);
  }
  if (lastPt) {
    const [x, y, ux, uy, len, f] = lastPt;
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = Math.max(0.9, S / 700) * (0.7 + f * 0.6);
    ctx.beginPath();
    ctx.moveTo(x - ux * len / 2, y - uy * len / 2);
    ctx.lineTo(x + ux * len / 2, y + uy * len / 2);
    ctx.stroke();
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
