<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Aesthetic Compositions</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // №1161 "New Aesthetic Compositions" — Nick Briz study block NB2
  // (theNewAesthetic.js, 2012: a JS artware library that is a tool
  // and an essay at the same time). The piece IS the generator plus
  // its documented source: a top bar with three preset buttons
  // (tropes / sorts / maps), a 3x2 grid of compositions in the New
  // Aesthetic vocabulary — pixel-sorted fields, satellite mosaics,
  // wireframe solids, dataviz bar fields, sorted blobs, depth-grid
  // terrain — and a source panel on the right that shows condensed
  // excerpts of the very functions drawing the left side, comments
  // included, because the comments are the essay. Tap a preset to
  // regenerate (a 400ms wipe sweeps the grid); drag the obfuscate
  // slider and the library starts arguing with itself: sort runs
  // lengthen, wireframes displace, mosaic tiles jitter loose.
  // Everything is drawn on the one canvas, the source panel is
  // always visible, and nothing here is a picture of the piece —
  // it is the piece, running.

  // ---------- palette (flat only) ----------
  var BG = '#0A0A0A';
  var PAPER = '#E8E8E8';
  var WIRE = '#00E5FF';
  var ACCENT = '#FF3D00';
  var SORTPAL = ['#FF2B6E', '#00FFC2', '#FFE14D', '#3D5AFE', '#FF9100', '#B388FF'];
  var CELLBG = '#101114';
  var BORD = '#26262B';
  var DIM = '#8B8B93';
  var COMMENT = '#6E8B67';
  var PANELBG = '#0D0F0D';
  var MOSAIC = ['#22392E', '#2E4A3A', '#47603F', '#5A6E46',
                '#7A7A4E', '#8A7B52', '#A08C5A', '#C2B280'];
  var WATER = '#1D3A52';
  var ROAD = '#B9AE94';

  var T0 = 3.2;               // fixed first-frame phase
  var WIPE_MS = 0.4;          // preset regeneration wipe, seconds

  // ---------- seeded rng (mulberry32 only) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hash01(n) {           // deterministic hash -> [0,1)
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function lum(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
    return (r * 299 + g * 587 + b * 114) / 1000;
  }
  // smooth value noise over a seeded lattice; x,y in [0,1]
  function noiseFn(seed, nx, ny) {
    var rng = mulberry32(seed), lat = [], i;
    for (i = 0; i < nx * ny; i++) lat.push(rng());
    return function (x, y) {
      var fx = x * (nx - 1), fy = y * (ny - 1);
      var ix = Math.floor(fx), iy = Math.floor(fy);
      ix = Math.min(ix, nx - 2); iy = Math.min(iy, ny - 2);
      var tx = fx - ix, ty = fy - iy;
      var sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
      var a = lat[iy * nx + ix], b = lat[iy * nx + ix + 1],
          c = lat[(iy + 1) * nx + ix], d = lat[(iy + 1) * nx + ix + 1];
      return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    };
  }

  // ---------- phone detection ----------
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var minScreen = Math.min(sw || 9999, sh || 9999);
  var isPhone = minScreen < 700;

  // ---------- view / canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }
  function fit() {
    W = viewW(); H = viewH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---------- interaction state (events recorded, state derived) ----------
  var state = {
    preset: 'tropes',
    gen: 0,              // regeneration counter; feeds every seed
    obf: 0.35,           // obfuscation 0..1
    lastTap: -1e9,       // piece-time of last preset tap (wipe anchor)
    dragging: false
  };
  var nowT = T0;
  var BTNS = [];         // {name,x,y,w,h} from last layout
  var SL = null;         // slider geometry from last layout

  // ================= the library =================
  // Six generators. Each one is running on the left; each one's
  // condensed source is printed on the right.

  // the feed does not want to be read, it wants to be rendered —
  // so sort it by brightness, in segments as long as our doubt.
  function drawPixelSort(x, y, w, h, seed, obf) {
    var cols = 26, rows = 18, cw = w / cols, ch = h / rows;
    var rng = mulberry32(seed);
    var grid = new Array(cols * rows), r, c, i;
    for (r = 0; r < rows; r++) {
      var base = SORTPAL[Math.floor(rng() * SORTPAL.length)];
      for (c = 0; c < cols; c++) {
        var p = rng(), v;
        if (p < 0.52) v = base;
        else if (p < 0.8) v = SORTPAL[Math.floor(rng() * SORTPAL.length)];
        else if (p < 0.9) v = PAPER;
        else v = BG;
        grid[r * cols + c] = v;
      }
    }
    var seg = Math.max(3, Math.round(4 + obf * 22));
    for (r = 0; r < rows; r++) {
      for (var s0 = 0; s0 < cols; s0 += seg) {
        var part = grid.slice(r * cols + s0, r * cols + Math.min(cols, s0 + seg));
        part.sort(function (a, b) { return lum(a) - lum(b); });
        for (i = 0; i < part.length; i++) grid[r * cols + s0 + i] = part[i];
      }
    }
    for (r = 0; r < rows; r++) {
      c = 0;
      while (c < cols) {
        var v0 = grid[r * cols + c], c0 = c;
        while (c < cols && grid[r * cols + c] === v0) c++;
        ctx.fillStyle = v0;
        ctx.fillRect(x + c0 * cw, y + r * ch, (c - c0) * cw + 0.6, ch + 0.6);
      }
    }
  }

  // the map is a photograph the state took of itself. tiles
  // jitter when the survey stops trusting itself.
  function drawSatelliteMosaic(x, y, w, h, seed, obf) {
    var cols = 9, rows = 7, tw = w / cols, th = h / rows;
    var nz = noiseFn(seed, 5, 4), r, c;
    for (r = 0; r < rows; r++) {
      for (c = 0; c < cols; c++) {
        var u = (c + 0.5) / cols, v = (r + 0.5) / rows;
        var n = nz(u, v), tone;
        if (n < 0.13) tone = WATER;
        else if (Math.abs(n - 0.52) < 0.028) tone = ROAD;
        else tone = MOSAIC[Math.floor(n * MOSAIC.length) % MOSAIC.length];
        var hs = hash01(seed * 3.1 + r * 57.7 + c * 131.3);
        if (hs < obf * 0.2) continue;              // unsurveyed tile
        var jx = (hash01(seed + r * 7.9 + c * 3.3) - 0.5) * obf * 5;
        var jy = (hash01(seed + r * 5.1 + c * 9.7) - 0.5) * obf * 5;
        ctx.fillStyle = tone;
        ctx.fillRect(x + c * tw + jx + 0.5, y + r * th + jy + 0.5, tw - 1, th - 1);
      }
    }
  }

  // every model is a rumor about a solid. the noise is the part
  // the rumor got right.
  var PHI = (1 + Math.sqrt(5)) / 2;
  var ICO_V = [[-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0],
               [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI],
               [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1]];
  var ICO_E = [], DISP = [];
  (function () {
    var i, j, a, b, dx, dy, dz, d2, min = 1e9;
    for (i = 0; i < 12; i++) for (j = i + 1; j < 12; j++) {
      dx = ICO_V[i][0] - ICO_V[j][0]; dy = ICO_V[i][1] - ICO_V[j][1]; dz = ICO_V[i][2] - ICO_V[j][2];
      d2 = dx * dx + dy * dy + dz * dz; if (d2 < min) min = d2;
    }
    for (i = 0; i < 12; i++) for (j = i + 1; j < 12; j++) {
      dx = ICO_V[i][0] - ICO_V[j][0]; dy = ICO_V[i][1] - ICO_V[j][1]; dz = ICO_V[i][2] - ICO_V[j][2];
      d2 = dx * dx + dy * dy + dz * dz; if (d2 < min * 1.05) ICO_E.push([i, j]);
    }
    var rng = mulberry32(4242);
    for (i = 0; i < 12; i++) {
      a = rng() * Math.PI * 2; b = rng() * 2 - 1;
      DISP.push([Math.cos(a) * Math.sqrt(1 - b * b), Math.sin(a) * Math.sqrt(1 - b * b), b]);
    }
    for (i = 0; i < 12; i++) {           // normalize vertices to unit sphere
      var L = Math.sqrt(ICO_V[i][0] * ICO_V[i][0] + ICO_V[i][1] * ICO_V[i][1] + ICO_V[i][2] * ICO_V[i][2]);
      ICO_V[i] = [ICO_V[i][0] / L, ICO_V[i][1] / L, ICO_V[i][2] / L];
    }
  })();
  function drawWireframe(x, y, w, h, seed, obf, t) {
    var cx = x + w / 2, cy = y + h / 2, R = Math.min(w, h) * 0.4;
    var ph = seed * 0.37;
    var ay = ph + t * 0.22, ax = 0.55 + 0.25 * Math.sin(t * 0.13 + ph);
    var cay = Math.cos(ay), say = Math.sin(ay), cax = Math.cos(ax), sax = Math.sin(ax);
    var P = [], i, e;
    for (i = 0; i < 12; i++) {
      var d = obf * 0.3 * (0.6 + 0.4 * Math.sin(t * 0.9 + i * 1.7));
      var vx = ICO_V[i][0] + DISP[i][0] * d, vy = ICO_V[i][1] + DISP[i][1] * d,
          vz = ICO_V[i][2] + DISP[i][2] * d;
      var X = vx * cay + vz * say, Z = -vx * say + vz * cay;
      var Y = vy * cax - Z * sax; Z = vy * sax + Z * cax;
      var s = R / (1 + 0.12 * Z);
      P.push([cx + X * s, cy + Y * s, Z]);
    }
    for (i = 0; i < ICO_E.length; i++) {
      e = ICO_E[i];
      var za = (P[e[0]][2] + P[e[1]][2]) / 2;
      ctx.globalAlpha = 0.3 + 0.32 * (za + 1);
      ctx.strokeStyle = WIRE; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(P[e[0]][0], P[e[0]][1]);
      ctx.lineTo(P[e[1]][0], P[e[1]][1]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAPER;
    for (i = 0; i < 12; i++) ctx.fillRect(P[i][0] - 1.3, P[i][1] - 1.3, 2.6, 2.6);
  }

  // the chart performs a certainty it does not possess.
  function drawBarField(x, y, w, h, seed, obf) {
    var n = 16, nz = noiseFn(seed, 8, 2), rng = mulberry32(seed + 5);
    var hs = [], i, s;
    for (i = 0; i < n; i++) hs.push(0.18 + 0.78 * nz(i / (n - 1), 0.35) + (rng() - 0.5) * 0.08);
    var segB = 3 + Math.floor(obf * 5);
    for (s = 0; s < n; s += segB) {
      if (hash01(seed + s * 13.7) < obf) {
        var part = hs.slice(s, Math.min(n, s + segB)).sort(function (a, b) { return a - b; });
        for (i = 0; i < part.length; i++) hs[s + i] = part[i];
      }
    }
    var base = y + h - 12, top = y + 8, bw = w / n;
    var maxI = 0;
    for (i = 0; i < n; i++) if (hs[i] > hs[maxI]) maxI = i;
    for (i = 0; i < n; i++) {
      var bh = hs[i] * (base - top), bx = x + i * bw + 2, bwid = bw - 4;
      if (hash01(seed * 1.3 + i * 29.3) < obf * 0.3) bx += obf * 8;   // glitch slip
      ctx.fillStyle = (i === maxI) ? ACCENT : SORTPAL[(i * 2 + seed) % SORTPAL.length];
      ctx.fillRect(bx, base - bh, bwid, bh);
      ctx.fillStyle = PAPER;
      ctx.fillRect(bx, base - bh - 4, bwid, 1.4);                     // value tick
    }
    ctx.fillStyle = PAPER;
    ctx.fillRect(x, base + 3, w, 1.2);
  }

  // a face, almost. the algorithm insists it is only weather.
  function drawBlobSort(x, y, w, h, seed, obf) {
    var cx = x + w / 2, cy = y + h / 2;
    var ringW = 6, maxR = Math.min(w, h) / 2 - 4, nr = Math.floor(maxR / ringW);
    var win = 2 + Math.floor(obf * 9), k, s, i;
    for (k = 0; k < nr; k++) {
      var r0 = (k + 0.5) * ringW;
      var segs = Math.max(10, Math.floor(2 * Math.PI * r0 / 7));
      var rng = mulberry32(seed + k * 77);
      var cols = [];
      for (s = 0; s < segs; s++) {
        var p = rng();
        cols.push(p < 0.62 ? SORTPAL[(k + Math.floor(rng() * 2)) % SORTPAL.length]
                 : p < 0.85 ? SORTPAL[Math.floor(rng() * SORTPAL.length)] : BG);
      }
      for (s = 0; s < segs; s += win) {
        var idx = [];
        for (i = 0; i < win && s + i < segs; i++) idx.push(s + i);
        var vals = idx.map(function (j) { return cols[j]; });
        vals.sort(function (a, b) { return lum(a) - lum(b); });
        for (i = 0; i < idx.length; i++) cols[idx[i]] = vals[i];
      }
      var segLen = 2 * Math.PI * r0 / segs;
      for (s = 0; s < segs; s++) {
        if (cols[s] === BG) continue;
        var a = (s / segs) * Math.PI * 2;
        ctx.save();
        ctx.translate(cx + r0 * Math.cos(a), cy + r0 * Math.sin(a));
        ctx.rotate(a);
        ctx.fillStyle = cols[s];
        ctx.fillRect(-segLen / 2 - 0.4, -ringW / 2 + 0.5, segLen + 0.8, ringW - 1);
        ctx.restore();
      }
    }
    ctx.fillStyle = PAPER;
    ctx.fillRect(cx - 1.5, cy - 1.5, 3, 3);
  }

  // terrain is just a database pretending to be a place.
  function drawDepthGrid(x, y, w, h, seed, obf) {
    var nx = 13, ny = 10, nz = noiseFn(seed, 5, 4), i, j;
    var pts = [];
    for (j = 0; j < ny; j++) {
      pts.push([]);
      for (i = 0; i < nx; i++) {
        var u = i / (nx - 1), v = j / (ny - 1);
        var hgt = nz(u, v) * (1 + obf * 0.5);
        var jx = (hash01(seed + i * 3.9 + j * 8.1) - 0.5) * obf * 7;
        var jy = (hash01(seed + i * 6.3 + j * 4.7) - 0.5) * obf * 4;
        pts[j].push([x + u * w + jx, y + h * 0.16 + v * h * 0.66 - hgt * h * 0.34 + jy]);
      }
    }
    ctx.strokeStyle = WIRE; ctx.lineWidth = 1;
    for (j = 0; j < ny; j++) {
      ctx.globalAlpha = 0.16;
      ctx.beginPath();
      for (i = 0; i < nx; i++) { var q = pts[j][i]; if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]); }
      ctx.stroke();
    }
    for (i = 0; i < nx; i++) {
      ctx.globalAlpha = 0.3 + 0.55 * (i / (nx - 1));
      ctx.beginPath();
      for (j = 0; j < ny; j++) { var p = pts[j][i]; if (j === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  var GEN = {
    sort:   { label: 'pixelSort()',       fn: drawPixelSort },
    mosaic: { label: 'satelliteMosaic()', fn: drawSatelliteMosaic },
    wire:   { label: 'wireframe()',       fn: drawWireframe },
    bars:   { label: 'barField()',        fn: drawBarField },
    blob:   { label: 'blobSort()',         fn: drawBlobSort },
    depth:  { label: 'depthGrid()',       fn: drawDepthGrid }
  };
  var PRESETS = {
    tropes: [['mosaic', 11], ['wire', 12], ['bars', 13], ['depth', 14], ['sort', 15], ['blob', 16]],
    sorts:  [['sort', 21], ['blob', 22], ['sort', 23], ['bars', 24], ['blob', 25], ['sort', 26]],
    maps:   [['mosaic', 31], ['depth', 32], ['mosaic', 33], ['wire', 34], ['depth', 35], ['bars', 36]]
  };
  var PRESET_NAMES = ['tropes', 'sorts', 'maps'];

  // ---------- the source panel: condensed excerpts of the above ----------
  // kind: 'h' header (accent), 'c' comment (dim green), 'k' code (paper)
  var SRC = [
    ['h', '// theNewAesthetic.js - v0.2.1'],
    ['c', '// a utility && an essay. the fns'],
    ['c', '// below are running on the left.'],
    ['k', ''],
    ['k', 'function pixelSort(grid, obf) {'],
    ['c', '  // the feed does not want to be'],
    ['c', '  // read. it wants to be rendered.'],
    ['c', '  // so sort it by brightness, in'],
    ['c', '  // segments as long as our doubt.'],
    ['k', '  sortRuns(grid, 4 + obf * 24);'],
    ['k', '}'],
    ['k', ''],
    ['k', 'function satelliteMosaic(seed) {'],
    ['c', '  // the map is a photograph the'],
    ['c', '  // state took of itself. tiles'],
    ['c', '  // jitter when the survey stops'],
    ['c', '  // trusting itself.'],
    ['k', '  return tiles(seed, JITTER);'],
    ['k', '}'],
    ['k', ''],
    ['k', 'function wireframe(mesh, obf) {'],
    ['c', '  // every model is a rumor about'],
    ['c', '  // a solid. the noise is the part'],
    ['c', '  // the rumor got right.'],
    ['k', '  displace(mesh, obf * rumor);'],
    ['k', '}'],
    ['k', ''],
    ['k', 'function barField(data) {'],
    ['c', '  // the chart performs a certainty'],
    ['c', '  // it does not possess.'],
    ['k', '  return bars(data, CERTAIN);'],
    ['k', '}'],
    ['k', ''],
    ['k', 'function blobSort(blob, obf) {'],
    ['c', '  // a face, almost. the algorithm'],
    ['c', '  // insists it is only weather.'],
    ['k', '  sortPolar(blob, obf);'],
    ['k', '}'],
    ['k', ''],
    ['k', 'function depthGrid(seed, obf) {'],
    ['c', '  // terrain is just a database'],
    ['c', '  // pretending to be a place.'],
    ['k', '  return survey(seed, obf);'],
    ['k', '}'],
    ['k', ''],
    ['c', '// obfuscate: turn it up and the'],
    ['c', '// library argues with itself.'],
    ['c', '// use everything. cite nothing.']
  ];

  // ---------- draw ----------
  function draw(t) {
    fit();
    var pad = isPhone ? 12 : 16;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // ----- layout -----
    var barH = isPhone ? 92 : 54;
    var gridX = pad, gridW, panelX, panelW, panelY, panelH;
    var contentY = barH + 6;
    var gridY = contentY, gridH, sliderY, hintY;
    if (isPhone) {
      gridW = W - pad * 2;
      gridH = 258;
      sliderY = gridY + gridH + 12;
      hintY = sliderY + 30;
      panelX = pad; panelW = gridW;
      panelY = hintY + 10; panelH = H - panelY - pad;
    } else {
      gridW = Math.floor((W - pad * 2 - 14) * 2 / 3);
      gridH = H - contentY - 78;
      sliderY = gridY + gridH + 14;
      hintY = sliderY + 32;
      panelX = pad + gridW + 14; panelW = W - pad - panelX;
      panelY = contentY; panelH = H - contentY - pad;
    }

    // ----- top bar -----
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, barH);
    ctx.fillStyle = ACCENT;
    var sqY = isPhone ? 17 : (barH - 10) / 2;
    ctx.fillRect(pad, sqY, 10, 10);
    ctx.fillStyle = PAPER;
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('theNewAesthetic.js', pad + 18, isPhone ? 22 : barH / 2 + 1);
    if (isPhone) {
      ctx.fillStyle = DIM; ctx.font = '10px monospace';
      ctx.fillText('// a utility && an essay', pad + 18, 42);
    }
    ctx.strokeStyle = BORD; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, barH - 0.5); ctx.lineTo(W, barH - 0.5); ctx.stroke();

    // preset buttons
    BTNS = [];
    var bw = isPhone ? Math.floor((W - pad * 2 - 16) / 3) : 96;
    var bh = isPhone ? 30 : 32;
    var bx = isPhone ? pad : W - pad - (bw * 3 + 16);
    var by = isPhone ? 54 : (barH - bh) / 2;
    for (var bi = 0; bi < 3; bi++) {
      var nm = PRESET_NAMES[bi];
      var r = { name: nm, x: bx + bi * (bw + 8), y: by, w: bw, h: bh };
      BTNS.push(r);
      var active = state.preset === nm;
      ctx.fillStyle = active ? '#1E1E22' : '#151517';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = active ? ACCENT : BORD;
      ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
      ctx.fillStyle = active ? ACCENT : PAPER;
      ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.fillText(nm, r.x + r.w / 2, r.y + r.h / 2 + 1);
    }
    ctx.textAlign = 'left';

    // ----- composition grid (3x2) -----
    var gap = 10;
    var cellW = (gridW - gap * 2) / 3, cellH = (gridH - gap) / 2;
    var cells = PRESETS[state.preset];
    for (var ci = 0; ci < 6; ci++) {
      var cxx = gridX + (ci % 3) * (cellW + gap);
      var cyy = gridY + Math.floor(ci / 3) * (cellH + gap);
      ctx.fillStyle = CELLBG;
      ctx.fillRect(cxx, cyy, cellW, cellH);
      ctx.save();
      ctx.beginPath(); ctx.rect(cxx, cyy, cellW, cellH); ctx.clip();
      var spec = cells[ci];
      var seed = spec[1] * 1000 + state.gen * 7919 + ci * 131;
      GEN[spec[0]].fn(cxx + 5, cyy + 5, cellW - 10, cellH - 10, seed, state.obf, t);
      ctx.restore();
      ctx.strokeStyle = BORD;
      ctx.strokeRect(cxx + 0.5, cyy + 0.5, cellW - 1, cellH - 1);
      // cell label chip
      var lab = GEN[spec[0]].label;
      ctx.font = '9px monospace';
      var lw = ctx.measureText(lab).width + 10;
      ctx.fillStyle = 'rgba(10,10,10,0.82)';
      ctx.fillRect(cxx + 5, cyy + 5, lw, 15);
      ctx.fillStyle = DIM;
      ctx.fillText(lab, cxx + 10, cyy + 13);
    }

    // regeneration wipe: a bright sweep across the grid for 400ms
    var wt = t - state.lastTap;
    if (wt >= 0 && wt < WIPE_MS) {
      var wx = gridX + (wt / WIPE_MS) * gridW;
      ctx.fillStyle = ACCENT; ctx.globalAlpha = 0.9;
      ctx.fillRect(wx - 6, gridY, 3, gridH);
      ctx.fillStyle = PAPER;
      ctx.fillRect(wx - 3, gridY, 2, gridH);
      ctx.globalAlpha = 1;
    }

    // ----- obfuscate slider -----
    ctx.font = '12px monospace';
    ctx.fillStyle = PAPER; ctx.textBaseline = 'middle';
    ctx.fillText('obfuscate', gridX, sliderY + 9);
    var trX = gridX + 92, trW = gridW - 92 - 52, trY = sliderY + 9;
    SL = { x: trX, y: sliderY - 4, w: trW, h: 26, trackY: trY };
    ctx.fillStyle = '#26262B';
    ctx.fillRect(trX, trY - 2, trW, 4);
    ctx.fillStyle = ACCENT;
    ctx.fillRect(trX, trY - 2, trW * state.obf, 4);
    var hx = trX + trW * state.obf;
    ctx.fillStyle = PAPER;
    ctx.fillRect(hx - 5, trY - 9, 10, 18);
    ctx.fillStyle = BG;
    ctx.fillRect(hx - 1, trY - 5, 2, 10);
    ctx.fillStyle = DIM; ctx.font = '11px monospace';
    ctx.fillText(state.obf.toFixed(2), trX + trW + 10, trY + 1);

    // ----- hint -----
    ctx.fillStyle = DIM; ctx.font = '10px monospace';
    ctx.fillText('tap a preset to regenerate · drag obfuscate to corrupt', gridX, hintY);

    // ----- source panel (always visible) -----
    ctx.fillStyle = PANELBG;
    ctx.fillRect(panelX, panelY, panelW, panelH);
    ctx.strokeStyle = BORD;
    ctx.strokeRect(panelX + 0.5, panelY + 0.5, panelW - 1, panelH - 1);
    ctx.fillStyle = DIM; ctx.font = '10px monospace'; ctx.textBaseline = 'middle';
    ctx.fillText('SOURCE — theNewAesthetic.js', panelX + 10, panelY + 12);
    ctx.strokeStyle = BORD;
    ctx.beginPath();
    ctx.moveTo(panelX, panelY + 23.5); ctx.lineTo(panelX + panelW, panelY + 23.5);
    ctx.stroke();
    var lineH = isPhone ? 14 : 15;
    var fontPx = panelW > 330 ? 11.5 : 10;
    ctx.font = fontPx + 'px monospace';
    var areaY = panelY + 28, areaH = panelH - 36;
    var totalH = SRC.length * lineH;
    var off = totalH > areaH ? ((t - T0) * 6) % totalH : 0;
    ctx.save();
    ctx.beginPath(); ctx.rect(panelX + 2, areaY, panelW - 4, areaH); ctx.clip();
    for (var rep = 0; rep < 2; rep++) {
      for (var li = 0; li < SRC.length; li++) {
        var ly = areaY + li * lineH - off + rep * totalH + lineH / 2;
        if (ly < areaY - lineH || ly > areaY + areaH + lineH) continue;
        var kind = SRC[li][0], txt = SRC[li][1];
        if (!txt) continue;
        ctx.fillStyle = kind === 'h' ? ACCENT : kind === 'c' ? COMMENT : PAPER;
        ctx.fillText(txt, panelX + 10, ly);
      }
    }
    ctx.restore();
    ctx.textBaseline = 'alphabetic';
  }

  // ---------- pointer interaction ----------
  function evtPos(e) {
    if (e.clientX !== undefined && canvas.getBoundingClientRect) {
      var r = canvas.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    }
    return [e.offsetX || 0, e.offsetY || 0];
  }
  function setObfFromX(px) {
    if (!SL) return;
    var v = (px - SL.x) / SL.w;
    state.obf = v < 0 ? 0 : v > 1 ? 1 : v;
  }
  function onDown(e) {
    var p = evtPos(e), px = p[0], py = p[1], i;
    for (i = 0; i < BTNS.length; i++) {
      var b = BTNS[i];
      if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
        state.preset = b.name;
        state.gen++;
        state.lastTap = nowT;
        draw(nowT);
        return;
      }
    }
    if (SL && px >= SL.x - 8 && px <= SL.x + SL.w + 8 && py >= SL.y && py <= SL.y + SL.h) {
      state.dragging = true;
      setObfFromX(px);
      draw(nowT);
    }
  }
  function onMove(e) {
    if (!state.dragging) return;
    setObfFromX(evtPos(e)[0]);
    draw(nowT);
  }
  function onUp() { state.dragging = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  var lastT = T0;
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  draw(T0);

  var startStamp = null;
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    var t = T0 + (stamp - startStamp) / 1000;
    lastT = t; nowT = t;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
