<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleven Palettes, One Seed</title>
<style>
html, body { margin: 0; padding: 0; background: #EFE6D4; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FIRST_T = 6.0;
var HOLD = 5.0;
var FADE = 0.4;
var CYCLE = HOLD + FADE;
var GRID = 14;
var PLATE = '#2e2418';
var PLATE_LINE = 'rgba(201,143,45,0.55)';
var TITLE_INK = '#f3ead6';
var HINT_INK = '#e8c87a';
/* The same geometry dressed eleven ways. One frozen field of
   marks is recolored on a slow loop, and a faint readout prints
   the sampling weights behind each palette so the randomness can
   be audited instead of merely watched. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* Eleven weighted palettes. Each carries a ground, four flat
   colors in fixed slots, and sampling weights: common colors
   weight 10, the accent color weight 1. Slot order never moves,
   so a swap changes color only, never geometry. Palette 8 is the
   rare one: a dark ground where two rust tones collide. */
var PALETTES = [
  { name: 'sand',   ground: [239, 230, 212], colors: [[201, 143, 45], [166, 73, 43], [43, 74, 140], [122, 90, 46]],  weights: [10, 10, 6, 1] },
  { name: 'cobalt', ground: [239, 230, 212], colors: [[43, 74, 140], [127, 163, 201], [30, 42, 74], [201, 143, 45]],  weights: [10, 10, 6, 1] },
  { name: 'bone',   ground: [232, 220, 200], colors: [[31, 27, 22], [216, 205, 180], [140, 133, 120], [179, 58, 43]],   weights: [10, 10, 6, 1] },
  { name: 'rust',   ground: [239, 230, 212], colors: [[166, 73, 43], [179, 58, 43], [201, 143, 45], [43, 74, 140]],   weights: [10, 10, 6, 1] },
  { name: 'night',  ground: [25, 21, 18],    colors: [[232, 217, 184], [201, 143, 45], [179, 58, 43], [43, 74, 140]],  weights: [10, 10, 6, 1] },
  { name: 'ochre',  ground: [239, 230, 212], colors: [[217, 164, 65], [140, 106, 47], [232, 217, 184], [166, 73, 43]], weights: [10, 10, 6, 1] },
  { name: 'moss',   ground: [230, 224, 206], colors: [[107, 112, 64], [62, 74, 46], [201, 143, 45], [179, 58, 43]],   weights: [10, 10, 6, 1] },
  { name: 'rare',   ground: [25, 21, 18],    colors: [[179, 58, 43], [166, 73, 43], [232, 217, 184], [43, 74, 140]],  weights: [10, 10, 6, 1] },
  { name: 'indigo', ground: [239, 230, 212], colors: [[43, 74, 140], [30, 42, 74], [127, 163, 201], [201, 143, 45]],  weights: [10, 10, 6, 1] },
  { name: 'terra',  ground: [239, 230, 212], colors: [[166, 73, 43], [201, 106, 59], [232, 217, 184], [43, 74, 140]],  weights: [10, 10, 6, 1] },
  { name: 'char',   ground: [25, 21, 18],    colors: [[232, 217, 184], [140, 133, 120], [201, 143, 45], [179, 58, 43]], weights: [10, 10, 6, 1] }
];
/* ---- fixed geometry: one seeded field, frozen mid-growth ---- */
var shapes = [];
(function buildField() {
  var rng = mulberry32(1673);
  var roleW = [10, 10, 6, 1];
  var i, j;
  for (j = 0; j < GRID; j++) {
    for (i = 0; i < GRID; i++) {
      var u = (i + 0.5 + (rng() - 0.5) * 0.42) / GRID;
      var v = (j + 0.5 + (rng() - 0.5) * 0.42) / GRID;
      var kind = rng();
      var ang = Math.floor(rng() * 12) * (Math.PI / 6);
      var x = rng(), slot = 0, acc = 0, s;
      for (s = 0; s < roleW.length; s++) {
        acc += roleW[s] / 27;
        if (x <= acc) { slot = s; break; }
      }
      shapes.push({
        u: u, v: v,
        kind: kind < 0.62 ? 0 : (kind < 0.84 ? 1 : 2),
        ang: ang,
        len: 0.52 + rng() * 0.38,
        wid: 0.16 + rng() * 0.16,
        rad: 0.20 + rng() * 0.12,
        slot: slot
      });
    }
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Square field: near-full-bleed width on phones (0.94, so the edge
   shapes stay whole instead of slicing at the canvas edge), an inset
   square on desktop, centered in the viewport. */
function fieldRect() {
  var s = isPhone ? Math.min(VW, VH) * 0.94 : Math.min(VW, VH) * 0.88;
  return { x: (VW - s) / 2, y: (VH - s) / 2, s: s };
}
function paletteAt(t) {
  var el = t - FIRST_T;
  if (el < 0) el = 0;
  var idx = Math.floor(el / CYCLE) % PALETTES.length;
  var phase = el - Math.floor(el / CYCLE) * CYCLE;
  var prev = (idx + PALETTES.length - 1) % PALETTES.length;
  if (idx === 0 && el < CYCLE) return { cur: PALETTES[0], prev: null, p: 1, phase: phase, idx: 0 };
  if (phase < FADE) return { cur: PALETTES[idx], prev: PALETTES[prev], p: phase / FADE, phase: phase, idx: idx };
  return { cur: PALETTES[idx], prev: null, p: 1, phase: phase, idx: idx };
}
function readoutAlpha(phase) {
  if (phase < 1.2) return 0.6;
  if (phase < 3.0) return 0.6 - (phase - 1.2) * (0.45 / 1.8);
  return 0.15;
}
function drawShape(b, f, alpha) {
  var x = f.x + b.u * f.s, y = f.y + b.v * f.s;
  var cell = f.s / GRID;
  ctx.globalAlpha = alpha;
  if (b.kind === 0) {
    var len = b.len * cell, wid = b.wid * cell;
    var hl = len / 2, hw = wid / 2;
    var ca = Math.cos(b.ang), sa = Math.sin(b.ang);
    ctx.beginPath();
    ctx.moveTo(x - hl * ca + hw * sa, y - hl * sa - hw * ca);
    ctx.lineTo(x + hl * ca + hw * sa, y + hl * sa - hw * ca);
    ctx.lineTo(x + hl * ca - hw * sa, y + hl * sa + hw * ca);
    ctx.lineTo(x - hl * ca - hw * sa, y - hl * sa + hw * ca);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + hl * ca + hw, y + hl * sa);
    ctx.arc(x + hl * ca, y + hl * sa, hw, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - hl * ca + hw, y - hl * sa);
    ctx.arc(x - hl * ca, y - hl * sa, hw, 0, TAU);
    ctx.fill();
  } else if (b.kind === 1) {
    ctx.beginPath();
    ctx.moveTo(x + b.rad * cell, y);
    ctx.arc(x, y, b.rad * cell, 0, TAU);
    ctx.fill();
  } else {
    var side = b.len * cell * 0.62;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(b.ang);
    ctx.fillRect(-side / 2, -side / 2, side, side);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawField(pal, alpha) {
  var f = fieldRect();
  var i, b;
  for (i = 0; i < shapes.length; i++) {
    b = shapes[i];
    ctx.fillStyle = rgba(pal.colors[b.slot], 1);
    drawShape(b, f, alpha);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Eleven Palettes, One Seed').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Eleven Palettes, One Seed').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 11').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Eleven Palettes, One Seed', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 11', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function drawReadout(pal, idx, phase) {
  var a = readoutAlpha(phase);
  var smallPx = isPhone ? 10 : 11;
  ctx.font = smallPx + 'px monospace';
  var line1 = 'PAL ' + ('0' + (idx + 1)).slice(-2) + '/11 ' + pal.name.toUpperCase();
  var line2 = 'w ' + pal.weights.join(' ');
  var w = Math.max(ctx.measureText(line1).width, ctx.measureText(line2).width);
  var plateW = w + 20;
  var plateH = smallPx * 2 + 16;
  var plateX = VW - plateW - 12;
  var plateY = VH - plateH - 12;
  ctx.globalAlpha = a;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(line1, plateX + 10, plateY + 7);
  ctx.fillText(line2, plateX + 10, plateY + 7 + smallPx + 2);
  ctx.globalAlpha = 1;
}
function draw(t) {
  size();
  var st = paletteAt(t);
  ctx.fillStyle = rgba(st.cur.ground, 1);
  ctx.fillRect(0, 0, VW, VH);
  if (st.prev && st.p < 1) {
    drawField(st.prev, 1 - st.p);
    drawField(st.cur, st.p);
  } else {
    drawField(st.cur, 1);
  }
  drawPlates();
  drawReadout(st.cur, st.idx, st.phase);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    paletteName: function () { return paletteAt(FIRST_T).cur.name; },
    paletteIndex: function (t) { return paletteAt(t).idx; },
    shapeCount: function () { return shapes.length; }
  };
}
/* ---- frame one: t = FIRST_T, palette 0 fully settled ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
