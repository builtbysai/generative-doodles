<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1932 The Synth Bender</title>
<style>
  html, body { margin: 0; padding: 0; background: #120a14; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/chris-hyson.md does not exist in the repo, so these hex
  // values are chosen from the prompt's own color names.
  var RACK_BG = '#120a14';   // deep rack black, room ground
  var PANEL = '#1c101f';     // modular panel face
  var PANEL_EDGE = '#33203a';// panel outline
  var MAGENTA = '#c2187a';   // magenta studio light
  var MAGENTA_LT = '#e05aa8';// magenta glow, lighter
  var HOT_PINK = '#ff2e88';  // cable pulse, hot pink
  var AMBER = '#ffb347';     // cable pulse, amber
  var ICE = '#7fd4ff';       // cable pulse, ice blue
  var WARM_WHITE = '#fff3e0';// oscillator nodes, warm white
  var FIGURE = '#050308';    // figures from behind, near black
  var INK = '#f3e6f0';       // plate ink, pale warm white
  var PULSE_COLORS = [HOT_PINK, AMBER, ICE];
  var PULSE_NAMES = ['hot pink', 'amber', 'ice blue'];

  // QA hook: location.search may carry ?seed= to vary the layout,
  // ?sx= ?sy= ?ex= ?ey= (fractions of stage W/H) to simulate a repatch
  // drag from one node to another before the first frame, and ?t= to
  // move the first frame. Parsed by hand so it works in every host.
  var QA = {};
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search.replace(/^\?/, '') : '';
    if (qs) {
      var parts = qs.split('&');
      for (var qi = 0; qi < parts.length; qi++) {
        var kv = parts[qi].split('=');
        if (kv[0]) { QA[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); }
      }
    }
  } catch (e) {}
  var SEED = 1932;
  if (QA.seed !== undefined) {
    var ps = parseInt(QA.seed, 10);
    if (!isNaN(ps)) { SEED = ps; }
  }

  // Fixed-phase first frame: t = 6 s. Pulse rates run about 0.25 to
  // 0.32 traversals per second with staggered phases, so at t = 6 every
  // cable carries pulses visibly mid-cable and the room's hum color is
  // settled. Frame one is byte-reproducible: every node, cable and pulse
  // is a pure function of t and the seeded PRNG.
  var FIRST_T = 6;
  if (QA.t !== undefined) {
    var pt = parseFloat(QA.t);
    if (!isNaN(pt)) { FIRST_T = pt; }
  }

  // Seeded PRNG, mulberry32. A fresh instance is built per draw from the
  // piece number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The node graph: ten oscillator nodes in two rows across the wall,
  // positions as fractions of the stage so they survive resize. Eight
  // cables link them; each cable's pulse color comes from its endpoints
  // and its pulse rate from its length, so repatching a cable changes
  // both visibly.
  var NODES = [];
  var EDGES = [];
  (function buildGraph() {
    var rng = mulberry32(SEED);
    var i;
    for (i = 0; i < 5; i++) {
      NODES.push({ fx: 0.11 + i * 0.195 + (rng() - 0.5) * 0.04, fy: 0.13 + (rng() - 0.5) * 0.03 });
    }
    for (i = 0; i < 5; i++) {
      NODES.push({ fx: 0.15 + i * 0.175 + (rng() - 0.5) * 0.04, fy: 0.33 + (rng() - 0.5) * 0.03 });
    }
    var pairs = [[0, 6], [1, 5], [2, 7], [3, 9], [4, 8], [1, 7], [2, 8], [0, 7]];
    for (i = 0; i < pairs.length; i++) {
      EDGES.push({ a: pairs[i][0], b: pairs[i][1], phase: rng() });
    }
  })();

  // The figures: three silhouettes seen from behind, fixed centers and
  // hand offsets from the seed. Only their hands move.
  var FIGURES = [];
  (function buildFigures() {
    var rng = mulberry32(SEED + 7);
    var cx = [0.22, 0.50, 0.78];
    for (var i = 0; i < 3; i++) {
      // Hands sit beside the head, not on top of it, reaching up to the wall.
      var side = (rng() < 0.5) ? -1 : 1;
      FIGURES.push({ cx: cx[i], handDx: side * (0.075 + rng() * 0.035), handPhase: rng() * Math.PI * 2 });
    }
  })();

  // The room's hum color: the color of the most recently patched cable.
  // It starts as the first cable's color and tints the whole room wash.
  var humIdx = edgeColorIdx(EDGES[0].a, EDGES[0].b);

  function edgeColorIdx(a, b) { return (a + b) % 3; }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var drag = null; // { edge, fixedNode, curX, curY } while a repatch drag runs
  var nowT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function mixHex(h1, h2, t) {
    var r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
    var r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
    var r = Math.round(lerp(r1, r2, t)), g = Math.round(lerp(g1, g2, t)), b = Math.round(lerp(b1, b2, t));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function frac(x) { return x - Math.floor(x); }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function nodeX(i) { return NODES[i].fx * W; }
  function nodeY(i) { return NODES[i].fy * H; }

  // Cable geometry: a hanging vine, a quadratic curve from one node to
  // the other with its belly pulled down by the cable's length.
  function cableGeom(e) {
    var x0 = nodeX(e.a), y0 = nodeY(e.a), x1 = nodeX(e.b), y1 = nodeY(e.b);
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy);
    var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + H * 0.07 + len * 0.14;
    return { x0: x0, y0: y0, x1: x1, y1: y1, cx: cx, cy: cy, len: len };
  }
  function cablePoint(g, u) {
    var v = 1 - u;
    return {
      x: v * v * g.x0 + 2 * v * u * g.cx + u * u * g.x1,
      y: v * v * g.y0 + 2 * v * u * g.cy + u * u * g.y1
    };
  }
  // Pulse rate: shorter patches run faster, longer ones slower, so a
  // repatch to a nearer node speeds the cable up and to a farther node
  // slows it down. Rates stay between 0.12 and 0.34 traversals a second.
  function cableRate(g) {
    var diag = Math.sqrt(W * W + H * H);
    return 0.34 - 0.22 * clamp(g.len / diag, 0, 1);
  }

  function nearestNode(x, y) {
    var best = -1, bestD = 1e9;
    for (var i = 0; i < NODES.length; i++) {
      var dx = nodeX(i) - x, dy = nodeY(i) - y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = i; }
    }
    var thresh = Math.max(34, H * 0.055);
    return (bestD <= thresh) ? best : -1;
  }

  // The repatch itself: move the cable that ends at fromNode so it ends
  // at toNode instead, then re-weight the hum to the new cable's color.
  // Returns the edge moved, or null when fromNode carries no cable.
  function applyRepatch(fromNode, toNode) {
    var edge = null, ei = -1;
    for (var i = 0; i < EDGES.length; i++) {
      if (EDGES[i].b === fromNode) { edge = EDGES[i]; ei = i; break; }
    }
    if (!edge) {
      for (var j = 0; j < EDGES.length; j++) {
        if (EDGES[j].a === fromNode) { edge = EDGES[j]; ei = j; break; }
      }
    }
    if (!edge) { return null; }
    if (edge.b === fromNode) { edge.b = toNode; }
    else { edge.a = toNode; }
    humIdx = edgeColorIdx(edge.a, edge.b);
    return edge;
  }

  function pointerPos(ev) {
    var rect = canvas.getBoundingClientRect();
    var sx = (rect.width > 0) ? (W / rect.width) : 1;
    var sy = (rect.height > 0) ? (H / rect.height) : 1;
    return { x: (ev.clientX - rect.left) * sx, y: (ev.clientY - rect.top) * sy };
  }

  function onDown(ev) {
    var p = pointerPos(ev);
    var n = nearestNode(p.x, p.y);
    if (n < 0) { return; }
    var edge = null;
    for (var i = 0; i < EDGES.length; i++) {
      if (EDGES[i].b === n || EDGES[i].a === n) { edge = EDGES[i]; break; }
    }
    if (!edge) { return; }
    var fixedNode = (edge.b === n) ? edge.a : edge.b;
    drag = { edge: edge, fixedNode: fixedNode, startNode: n, curX: p.x, curY: p.y };
    if (ev.preventDefault) { ev.preventDefault(); }
  }
  function onMove(ev) {
    if (!drag) { return; }
    var p = pointerPos(ev);
    drag.curX = p.x; drag.curY = p.y;
    if (ev.preventDefault) { ev.preventDefault(); }
  }
  function onUp(ev) {
    if (!drag) { return; }
    var p = pointerPos(ev);
    var n = nearestNode(p.x, p.y);
    if (n >= 0 && n !== drag.startNode) {
      applyRepatch(drag.startNode, n);
    }
    drag = null;
    draw(nowT);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { drag = null; draw(nowT); });
  }

  function drawPanel(cx, cy, w, h, rng) {
    ctx.fillStyle = PANEL;
    ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
    ctx.strokeStyle = hexA(PANEL_EDGE, 0.9);
    ctx.lineWidth = 1;
    ctx.strokeRect(cx - w / 2, cy - h / 2, w, h);
    // Knobs and jacks: small dots and rings, fixed per panel from the seed.
    var i;
    ctx.fillStyle = hexA(WARM_WHITE, 0.5);
    for (i = 0; i < 3; i++) {
      var kx = cx - w * 0.28 + i * w * 0.28;
      var ky = cy - h * 0.22;
      ctx.beginPath(); ctx.moveTo(kx + 2.5, ky); ctx.arc(kx, ky, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = hexA(WARM_WHITE, 0.35);
    for (i = 0; i < 4; i++) {
      var jx = cx - w * 0.33 + i * w * 0.22;
      var jy = cy + h * 0.26;
      ctx.beginPath(); ctx.moveTo(jx + 3, jy); ctx.arc(jx, jy, 3, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawHand(x, y, r, t, phase) {
    var bob = Math.sin(t * 0.6 + phase) * H * 0.004;
    var hy = y + bob;
    ctx.fillStyle = hexA(WARM_WHITE, 0.95);
    ctx.beginPath(); ctx.moveTo(x + r, hy); ctx.arc(x, hy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(WARM_WHITE, 0.8);
    ctx.lineWidth = Math.max(1, r * 0.35);
    ctx.beginPath();
    ctx.moveTo(x - r * 0.5, hy - r * 0.6); ctx.lineTo(x - r * 0.7, hy - r * 1.7);
    ctx.moveTo(x + r * 0.4, hy - r * 0.7); ctx.lineTo(x + r * 0.5, hy - r * 1.8);
    ctx.stroke();
  }

  function draw(t) {
    nowT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var hum = PULSE_COLORS[humIdx];

    // Room ground: deep rack black, washed with magenta studio light
    // and the current hum color, so a repatch shifts the whole room.
    ctx.fillStyle = RACK_BG;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = hexA(MAGENTA, 0.10);
    ctx.fillRect(0, 0, W, H * 0.66);
    ctx.fillStyle = hexA(hum, 0.07);
    ctx.fillRect(0, 0, W, H);
    var glow = ctx.createRadialGradient(W * 0.5, H * 0.10, 0, W * 0.5, H * 0.10, Math.min(W, H) * 0.62);
    glow.addColorStop(0, hexA(MAGENTA_LT, 0.20));
    glow.addColorStop(0.6, hexA(hum, 0.06));
    glow.addColorStop(1, hexA(MAGENTA_LT, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H * 0.70);

    // The modular wall: two rows of rack panels behind the nodes, plus
    // a third row of blank panels filling the wall above the figures.
    var rng = mulberry32(SEED + 31);
    var pw = W * 0.16, ph = H * 0.125;
    var i, n;
    for (i = 0; i < NODES.length; i++) {
      drawPanel(nodeX(i), nodeY(i), pw, ph, rng);
    }
    for (i = 0; i < 5; i++) {
      drawPanel(W * (0.12 + i * 0.19), H * 0.52, pw, ph, rng);
    }

    // Cables: hanging vines between nodes, each in its own pulse color.
    for (i = 0; i < EDGES.length; i++) {
      var e = EDGES[i];
      var g = cableGeom(e);
      var col = PULSE_COLORS[edgeColorIdx(e.a, e.b)];
      ctx.strokeStyle = hexA(col, 0.14);
      ctx.lineWidth = Math.max(4, H * 0.008);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(g.x0, g.y0);
      ctx.quadraticCurveTo(g.cx, g.cy, g.x1, g.y1);
      ctx.stroke();
      ctx.strokeStyle = hexA(col, 0.6);
      ctx.lineWidth = Math.max(1.6, H * 0.0032);
      ctx.beginPath();
      ctx.moveTo(g.x0, g.y0);
      ctx.quadraticCurveTo(g.cx, g.cy, g.x1, g.y1);
      ctx.stroke();
    }

    // The cable being dragged: a live vine from its fixed node to the
    // pointer, in the color it would take at the node under the pointer.
    if (drag) {
      var de = drag.edge;
      var fx = nodeX(drag.fixedNode), fy = nodeY(drag.fixedNode);
      var hover = nearestNode(drag.curX, drag.curY);
      var dcol = (hover >= 0 && hover !== drag.startNode)
        ? PULSE_COLORS[edgeColorIdx(drag.fixedNode, hover)]
        : PULSE_COLORS[edgeColorIdx(de.a, de.b)];
      var dg = { x0: fx, y0: fy, x1: drag.curX, y1: drag.curY,
        cx: (fx + drag.curX) / 2, cy: (fy + drag.curY) / 2 + H * 0.05 };
      ctx.strokeStyle = hexA(dcol, 0.85);
      ctx.lineWidth = Math.max(1.8, H * 0.0036);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(dg.x0, dg.y0);
      ctx.quadraticCurveTo(dg.cx, dg.cy, dg.x1, dg.y1);
      ctx.stroke();
    }

    // Oscillator nodes: warm white cores with a faint ring.
    for (i = 0; i < NODES.length; i++) {
      var nx = nodeX(i), ny = nodeY(i);
      var nr = Math.max(4, H * 0.011);
      ctx.fillStyle = hexA(WARM_WHITE, 0.18);
      ctx.beginPath(); ctx.moveTo(nx + nr * 2.2, ny); ctx.arc(nx, ny, nr * 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = hexA(WARM_WHITE, 0.55);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(nx + nr * 1.5, ny); ctx.arc(nx, ny, nr * 1.5, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = hexA(WARM_WHITE, 0.95);
      ctx.beginPath(); ctx.moveTo(nx + nr, ny); ctx.arc(nx, ny, nr, 0, Math.PI * 2); ctx.fill();
    }

    // Pulses of light traveling along every cable vine.
    for (i = 0; i < EDGES.length; i++) {
      var pe = EDGES[i];
      var pg = cableGeom(pe);
      var pcol = PULSE_COLORS[edgeColorIdx(pe.a, pe.b)];
      var rate = cableRate(pg);
      for (var k = 0; k < 2; k++) {
        var u = frac(t * rate + pe.phase + k * 0.5);
        var pp = cablePoint(pg, u);
        var pr = Math.max(3, H * 0.007);
        ctx.fillStyle = hexA(pcol, 0.30);
        ctx.beginPath(); ctx.moveTo(pp.x + pr * 2.4, pp.y); ctx.arc(pp.x, pp.y, pr * 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = hexA(pcol, 0.95);
        ctx.beginPath(); ctx.moveTo(pp.x + pr, pp.y); ctx.arc(pp.x, pp.y, pr, 0, Math.PI * 2); ctx.fill();
      }
    }

    // The figures: a dark band across the lower third, seen from behind.
    // Heads and shoulders only; they never turn around.
    var bandY = H * 0.66;
    ctx.fillStyle = hexA(MAGENTA, 0.05);
    ctx.fillRect(0, bandY, W, H - bandY);
    for (i = 0; i < FIGURES.length; i++) {
      var f = FIGURES[i];
      var cx = f.cx * W;
      var headR = H * 0.052;
      var headY = H * 0.715;
      var shW = W * 0.115;
      var shY = H * 0.775;
      ctx.fillStyle = FIGURE;
      ctx.beginPath();
      ctx.moveTo(cx - shW, H);
      ctx.lineTo(cx - shW, shY);
      ctx.quadraticCurveTo(cx, shY - H * 0.045, cx + shW, shY);
      ctx.lineTo(cx + shW, H);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + headR, headY); ctx.arc(cx, headY, headR, 0, Math.PI * 2); ctx.fill();
      // Magenta rim light on the side facing the wall's glow.
      ctx.strokeStyle = hexA(MAGENTA_LT, 0.4);
      ctx.lineWidth = Math.max(1.2, H * 0.002);
      ctx.beginPath();
      ctx.arc(cx, headY, headR, Math.PI * 0.9, Math.PI * 1.9);
      ctx.stroke();
      // Hands: the only moving parts, reaching up toward the wall.
      drawHand(cx + f.handDx * W, H * 0.665, Math.max(3.5, H * 0.0075), t, f.handPhase);
    }
    // A hand rides the drag point while a cable is being repatch
    if (drag) {
      drawHand(drag.curX, drag.curY, Math.max(5, H * 0.010), t, 0);
    }

    // Plates: title top-left, date below it, hum word top-right.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Synth Bender', 18, 34);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1932 · 2007 · 04 · 27', 18, 34 + fs2 + 8);

    ctx.textAlign = 'right';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('hum · ' + PULSE_NAMES[humIdx], W - 18, 34);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = 'italic ' + fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('the wall is listening', W - 18, 34 + fs2 + 8);
    ctx.textAlign = 'left';

    // Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.textAlign = 'center';
    var hint = 'Drag from one node to another to repatch.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    if (W < 560) {
      ctx.fillText('Drag from one node', W / 2, H - 34);
      ctx.fillText('to another to repatch.', W / 2, H - 16);
    } else {
      ctx.fillText(hint, W / 2, H - 20);
    }
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();

  // QA repatch probe: ?sx= ?sy= ?ex= ?ey= (stage fractions) replays a
  // drag from one node to another before the first frame is drawn.
  if (QA.sx !== undefined && QA.ex !== undefined) {
    var qx0 = parseFloat(QA.sx) * W, qy0 = parseFloat(QA.sy) * H;
    var qx1 = parseFloat(QA.ex) * W, qy1 = parseFloat(QA.ey) * H;
    var qn0 = nearestNode(qx0, qy0), qn1 = nearestNode(qx1, qy1);
    if (qn0 >= 0 && qn1 >= 0 && qn0 !== qn1) { applyRepatch(qn0, qn1); }
  }

  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Drag only: no audio, no click-to-reload. All motion runs under 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
