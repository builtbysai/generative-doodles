<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.317 Monoline Study</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FAF8F2; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.317 Monoline Study (Coral Cockatoo).
// Single-weight black line drawings of Australian botanicals on
// white paper, no fill: a gum blossom, a wattle spray and a
// banksia cone, in that order, exactly one on screen at a time.
// Each specimen is a set of real authored paths, drawn in order
// (stem first, then the architecture, then detail). The reveal
// is a stroke-dashoffset reveal driven by each path's real
// computed length, advancing at one constant drawing speed.
// The speed is fixed first; each specimen's path set is then
// scaled so its total real length draws in an authored duration
// inside 3-4s. The hold after each draw is exactly 4s. One line
// weight throughout: 2.5 design units, never varied. Tap skips
// to the next specimen's drawing start. No text anywhere.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var INK = '#1A1A1A', PAPER = '#FAF8F2';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 0, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var LW = 2.5;
var SPEED = 1800; // design units per second, constant for all specimens
var HOLD = 4;     // seconds, exact
var DUR_AUTHORED = [3.6, 3.4, 3.8]; // per specimen, inside 3-4s

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function P(x, y) { return { x: x, y: y }; }
function quad(p0, p1, p2, n) {
  var pts = [], i, t, u;
  for (i = 0; i <= n; i++) {
    t = i / n; u = 1 - t;
    pts.push(P(u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
               u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y));
  }
  return pts;
}
function cubic(p0, p1, p2, p3, n) {
  var pts = [], i, t, u;
  for (i = 0; i <= n; i++) {
    t = i / n; u = 1 - t;
    pts.push(P(u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
               u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y));
  }
  return pts;
}
function ell(cx, cy, rx, ry, a0, a1, n) {
  var pts = [], i, a;
  for (i = 0; i <= n; i++) {
    a = a0 + (a1 - a0) * i / n;
    pts.push(P(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry));
  }
  return pts;
}
function circ(cx, cy, r, n) { return ell(cx, cy, r, r, 0, Math.PI * 2, n || 12); }
function join() {
  var out = [], i, j;
  for (i = 0; i < arguments.length; i++) {
    for (j = (i === 0 ? 0 : 1); j < arguments[i].length; j++) out.push(arguments[i][j]);
  }
  return out;
}
// Lanceolate leaf outline: base to tip and back, two curved sides.
function leaf(base, tip, wid) {
  var dx = tip.x - base.x, dy = tip.y - base.y;
  var L = Math.sqrt(dx * dx + dy * dy) || 1;
  var px = -dy / L, py = dx / L;
  var c1 = P(base.x + dx * 0.45 + px * wid, base.y + dy * 0.45 + py * wid);
  var c2 = P(base.x + dx * 0.45 - px * wid, base.y + dy * 0.45 - py * wid);
  return join(quad(base, c1, tip, 14), quad(tip, c2, base, 14));
}
function branchTo(from, to, bend) {
  var dx = to.x - from.x, dy = to.y - from.y;
  var L = Math.sqrt(dx * dx + dy * dy) || 1;
  var px = -dy / L, py = dx / L;
  return cubic(from,
    P(from.x + dx * 0.33 + px * bend, from.y + dy * 0.33 + py * bend),
    P(from.x + dx * 0.66 + px * bend, from.y + dy * 0.66 + py * bend), to, 10);
}
function pathLen(pts) {
  var s = 0, i, dx, dy;
  for (i = 1; i < pts.length; i++) {
    dx = pts[i].x - pts[i - 1].x; dy = pts[i].y - pts[i - 1].y;
    s += Math.sqrt(dx * dx + dy * dy);
  }
  return s;
}
// Scale the whole path set about the design centre so the total
// real length draws in the authored duration at the fixed speed,
// then record each path's real length and cumulative start.
function buildSpecimen(rawPaths, authoredDur) {
  var raw = 0, i, j;
  for (i = 0; i < rawPaths.length; i++) raw += pathLen(rawPaths[i]);
  var f = authoredDur * SPEED / raw;
  var cx = DW / 2, cy = DH / 2, paths = [], total = 0;
  for (i = 0; i < rawPaths.length; i++) {
    var pts = [];
    for (j = 0; j < rawPaths[i].length; j++) {
      pts.push(P(cx + (rawPaths[i][j].x - cx) * f, cy + (rawPaths[i][j].y - cy) * f));
    }
    var len = pathLen(pts);
    paths.push({ pts: pts, len: len, start: total });
    total += len;
  }
  return { paths: paths, total: total, dur: total / SPEED };
}

// ---- Specimen 1: gum blossom -----------------------------------
// Stem first, then cup and leaves, then stamens and fine detail.
function gumBlossom() {
  var paths = [], r = rng(31701), i;
  // stems
  paths.push(cubic(P(640, 810), P(628, 690), P(650, 610), P(640, 548), 18));
  paths.push(branchTo(P(640, 640), P(468, 566), 18));
  paths.push(branchTo(P(642, 610), P(806, 540), -18));
  paths.push(branchTo(P(638, 615), P(530, 428), -64));
  // architecture: cup outline, rim, two leaves, one small bud cup
  var cup = join(
    cubic(P(562, 452), P(566, 510), P(596, 544), P(628, 548), 10),
    quad(P(628, 548), P(640, 553), P(652, 548), 6),
    cubic(P(652, 548), P(684, 544), P(714, 510), P(718, 452), 10),
    [P(562, 452)]);
  paths.push(cup);
  paths.push(ell(640, 452, 82, 16, 0, Math.PI * 2, 28));
  var leafL = { b: P(468, 566), t: P(352, 500) };
  var leafR = { b: P(806, 540), t: P(928, 486) };
  paths.push(leaf(leafL.b, leafL.t, 46));
  paths.push(leaf(leafR.b, leafR.t, 46));
  paths.push(ell(530, 420, 22, 28, 0, Math.PI * 2, 18));
  // detail: stamen filaments radiating from the rim, dot tips
  var tips = [];
  for (i = 0; i < 28; i++) {
    var a = -Math.PI / 2 + (i / 27 - 0.5) * 1.85 + (r() - 0.5) * 0.07;
    var len = 105 + r() * 45;
    var sx = 640 + Math.cos(a) * 20, sy = 444 + Math.sin(a) * 10;
    var ex = 640 + Math.cos(a) * len, ey = 444 - Math.abs(Math.sin(a)) * len * 0.92 - 18;
    var fp = quad(P(sx, sy), P((sx + ex) / 2 + (r() - 0.5) * 14, (sy + ey) / 2), P(ex, ey), 8);
    paths.push(fp);
    tips.push(fp[fp.length - 1]);
  }
  for (i = 0; i < tips.length; i++) paths.push(circ(tips[i].x, tips[i].y, 4.5, 10));
  // detail: arcs across the cup, leaf midribs, bud stamens
  paths.push(ell(640, 478, 66, 13, Math.PI * 0.12, Math.PI * 0.88, 14));
  paths.push(ell(640, 506, 52, 11, Math.PI * 0.12, Math.PI * 0.88, 12));
  paths.push(ell(640, 530, 34, 9, Math.PI * 0.12, Math.PI * 0.88, 10));
  paths.push(quad(leafL.b, P(408, 520), leafL.t, 10));
  paths.push(quad(leafR.b, P(870, 500), leafR.t, 10));
  for (i = -1; i <= 1; i++) {
    paths.push([P(530 + i * 9, 396), P(530 + i * 13, 372)]);
    paths.push(circ(530 + i * 13, 368, 3.6, 8));
  }
  return buildSpecimen(paths, DUR_AUTHORED[0]);
}

// ---- Specimen 2: wattle spray ----------------------------------
// Stem and branches first, then pom clusters and phyllodes, then
// the short radiating detail inside each pom.
function wattle() {
  var paths = [], r = rng(31702), i, j;
  var poms = [
    { x: 452, y: 548, r: 40 }, { x: 700, y: 530, r: 44 },
    { x: 500, y: 392, r: 38 }, { x: 724, y: 380, r: 40 },
    { x: 584, y: 252, r: 42 }, { x: 692, y: 222, r: 34 },
    { x: 640, y: 330, r: 30 }
  ];
  var nodes = [P(548, 652), P(565, 575), P(592, 470), P(610, 430),
               P(635, 372), P(650, 350), P(620, 410)];
  // stems
  paths.push(cubic(P(520, 820), P(545, 650), P(590, 500), P(650, 350), 20));
  for (i = 0; i < poms.length; i++) paths.push(branchTo(nodes[i], P(poms[i].x, poms[i].y), i % 2 === 0 ? 16 : -16));
  // architecture: pom outlines and three narrow phyllodes
  for (i = 0; i < poms.length; i++) paths.push(circ(poms[i].x, poms[i].y, poms[i].r, 24));
  var ph1 = { b: P(535, 730), t: P(392, 612) };
  var ph2 = { b: P(560, 640), t: P(762, 548) };
  var ph3 = { b: P(585, 520), t: P(452, 428) };
  paths.push(leaf(ph1.b, ph1.t, 21));
  paths.push(leaf(ph2.b, ph2.t, 21));
  paths.push(leaf(ph3.b, ph3.t, 19));
  // detail: radiating ticks and small inner dots in each pom
  for (i = 0; i < poms.length; i++) {
    for (j = 0; j < 14; j++) {
      var a = j / 14 * Math.PI * 2 + (r() - 0.5) * 0.2;
      paths.push([P(poms[i].x + Math.cos(a) * poms[i].r * 0.52, poms[i].y + Math.sin(a) * poms[i].r * 0.52),
                  P(poms[i].x + Math.cos(a) * poms[i].r * 0.94, poms[i].y + Math.sin(a) * poms[i].r * 0.94)]);
    }
    for (j = 0; j < 5; j++) {
      paths.push(circ(poms[i].x + (r() - 0.5) * poms[i].r * 0.9,
                      poms[i].y + (r() - 0.5) * poms[i].r * 0.9, 4, 8));
    }
  }
  paths.push(quad(ph1.b, P(462, 664), ph1.t, 10));
  paths.push(quad(ph2.b, P(664, 586), ph2.t, 10));
  paths.push(quad(ph3.b, P(516, 466), ph3.t, 10));
  return buildSpecimen(paths, DUR_AUTHORED[1]);
}

// ---- Specimen 3: banksia cone ----------------------------------
// Stem and leaf branches first, then the cone outline and leaves,
// then spikelets, bands and leaf detail.
function banksia() {
  var paths = [], r = rng(31703), row, col, i;
  // stems
  paths.push(cubic(P(640, 820), P(636, 730), P(644, 660), P(640, 600), 14));
  paths.push(branchTo(P(640, 710), P(452, 632), 14));
  paths.push(branchTo(P(640, 700), P(832, 624), -14));
  // architecture: cone outline and two leaves
  var cone = join(
    cubic(P(574, 600), P(562, 460), P(572, 300), P(602, 190), 18),
    quad(P(602, 190), P(622, 160), P(640, 160), 6),
    quad(P(640, 160), P(658, 160), P(678, 190), 6),
    cubic(P(678, 190), P(708, 300), P(718, 460), P(706, 600), 18),
    [P(574, 600)]);
  paths.push(cone);
  var lfL = { b: P(452, 632), t: P(330, 560) };
  var lfR = { b: P(832, 624), t: P(954, 552) };
  paths.push(leaf(lfL.b, lfL.t, 48));
  paths.push(leaf(lfR.b, lfR.t, 48));
  // detail: spikelet hooks in phyllotaxis rows, with dot tips
  var tips = [];
  for (row = 0; row < 10; row++) {
    var y = 566 - row * 36;
    var halfW = 68 - (600 - y) * 0.07;
    for (col = 0; col < 5; col++) {
      var fx = col / 4 * 2 - 1;
      var x = 640 + fx * halfW * 0.86 + (r() - 0.5) * 6;
      var lean = fx * 16;
      var hp = quad(P(x, y), P(x + lean * 0.4, y - 14), P(x + lean, y - 26), 6);
      paths.push(hp);
      tips.push(hp[hp.length - 1]);
    }
  }
  for (i = 0; i < tips.length; i++) paths.push(circ(tips[i].x, tips[i].y, 3.2, 8));
  // detail: three long lines following the cone, four bands
  var fxs = [-0.45, 0, 0.45];
  for (i = 0; i < fxs.length; i++) {
    paths.push(cubic(P(640 + fxs[i] * 58, 584), P(640 + fxs[i] * 52, 440),
                     P(640 + fxs[i] * 44, 300), P(640 + fxs[i] * 34, 208), 16));
  }
  var bandY = [490, 410, 330, 252];
  for (i = 0; i < bandY.length; i++) {
    var hw = 68 - (600 - bandY[i]) * 0.07;
    paths.push(ell(640, bandY[i], hw - 7, 11, Math.PI * 0.08, Math.PI * 0.92, 14));
  }
  // detail: leaf midribs and one serrated edge line per leaf
  paths.push(quad(lfL.b, P(388, 584), lfL.t, 10));
  paths.push(quad(lfR.b, P(896, 576), lfR.t, 10));
  var zigL = [], zigR = [], k, t, zx, zy;
  for (k = 0; k <= 8; k++) {
    t = k / 8;
    zx = lfL.b.x + (lfL.t.x - lfL.b.x) * t; zy = lfL.b.y + (lfL.t.y - lfL.b.y) * t - 34 * Math.sin(t * Math.PI) + (k % 2 === 0 ? -6 : 6) * (1 - t);
    zigL.push(P(zx, zy));
    zx = lfR.b.x + (lfR.t.x - lfR.b.x) * t; zy = lfR.b.y + (lfR.t.y - lfR.b.y) * t - 34 * Math.sin(t * Math.PI) + (k % 2 === 0 ? -6 : 6) * (1 - t);
    zigR.push(P(zx, zy));
  }
  paths.push(zigL);
  paths.push(zigR);
  return buildSpecimen(paths, DUR_AUTHORED[2]);
}

// ---- cycle --------------------------------------------------------
var NAMES = ['gum blossom', 'wattle', 'banksia'];
var SPECIMENS = [gumBlossom(), wattle(), banksia()];
if (SPECIMENS.length !== 3) throw new Error('Monoline Study needs exactly 3 specimens in the cycle');
var DUR = [], STARTS = [], accT = 0, di;
for (di = 0; di < 3; di++) {
  DUR.push(SPECIMENS[di].dur);
  if (DUR[di] < 3 || DUR[di] > 4) throw new Error('Monoline Study draw duration out of 3-4s: ' + DUR[di]);
  if (Math.abs(DUR[di] - DUR_AUTHORED[di]) > 0.01) throw new Error('Monoline Study duration off authored value: ' + DUR[di]);
  STARTS.push(accT);
  accT += DUR[di] + HOLD;
}
var CYCLE = accT;
// Frame one: the gum blossom already part-drawn, mid-reveal.
var START_OFFSET = 2.2;
if (START_OFFSET <= 0 || START_OFFSET >= DUR[0]) throw new Error('Monoline Study frame one must start mid-reveal of the gum blossom');
var skipOffset = 0;

function cyclePos() { return ((T + START_OFFSET + skipOffset) % CYCLE + CYCLE) % CYCLE; }
function specimenAt(pos) {
  var i;
  for (i = 0; i < 3; i++) {
    if (pos < STARTS[i] + DUR[i]) return { idx: i, local: pos - STARTS[i], phase: 'draw' };
    if (pos < STARTS[i] + DUR[i] + HOLD) return { idx: i, local: pos - STARTS[i] - DUR[i], phase: 'hold' };
  }
  return { idx: 0, local: 0, phase: 'draw' };
}
function draw() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, DW, DH);
  var st = specimenAt(cyclePos());
  var ON_SCREEN = 1;
  if (ON_SCREEN !== 1) throw new Error('Monoline Study needs exactly 1 specimen on screen');
  var sp = SPECIMENS[st.idx];
  var budget = st.phase === 'hold' ? sp.total : st.local * SPEED;
  ctx.strokeStyle = INK; ctx.lineWidth = LW; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var i, path, local;
  for (i = 0; i < sp.paths.length; i++) {
    path = sp.paths[i];
    local = budget - path.start;
    if (local <= 0) break;
    if (local > path.len) local = path.len;
    // Real path-length reveal: dash pattern of one full path
    // length, offset so only the drawn length shows.
    ctx.setLineDash([path.len, path.len]);
    ctx.lineDashOffset = path.len - local;
    ctx.beginPath();
    ctx.moveTo(path.pts[0].x, path.pts[0].y);
    for (var j = 1; j < path.pts.length; j++) ctx.lineTo(path.pts[j].x, path.pts[j].y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.lineDashOffset = 0;
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

var downX = 0, downY = 0;
canvas.addEventListener('pointerdown', function (e) { downX = e.clientX; downY = e.clientY; });
canvas.addEventListener('pointerup', function (e) {
  var moved = Math.max(Math.abs(e.clientX - downX), Math.abs(e.clientY - downY));
  if (moved >= 12) return;
  // Tap: skip immediately to the next specimen's drawing start.
  var pos = cyclePos(), next = CYCLE, i;
  for (i = 0; i < 3; i++) { if (STARTS[i] > pos + 0.001 && STARTS[i] < next) next = STARTS[i]; }
  skipOffset += next - pos;
});
canvas.addEventListener('pointercancel', function () {});

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
