<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interference Is the Drawing</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BLACK = '#0A0A0A';
var WHITE = '#F5F5F5';
// Seeded PRNG (mulberry32) so the big holes sit at fixed positions.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Big holes: seeded positions and radii, fixed for the life of the piece.
// Seven voids, spread across the field by rejection sampling (no two holes
// overlap, none covers the caption corner at bottom left).
var HOLES = (function () {
  var rnd = mulberry32(1570);
  var list = [];
  var i, j, ang, rad, r, ok, tries;
  for (i = 0; i < 7; i++) {
    tries = 0;
    do {
      ang = rnd() * TAU;
      rad = 0.18 + rnd() * 0.24;
      r = 0.04 + rnd() * 0.032;
      ok = true;
      // Keep clear of the caption corner (bottom left).
      if (Math.cos(ang) * rad < -0.15 && Math.sin(ang) * rad > 0.22) ok = false;
      for (j = 0; ok && j < list.length; j++) {
        var dx = Math.cos(ang) * rad - list[j].ax;
        var dy = Math.sin(ang) * rad - list[j].ay;
        if (Math.sqrt(dx * dx + dy * dy) < r + list[j].r + 0.035) ok = false;
      }
      tries++;
    } while (!ok && tries < 200);
    list.push({ ax: Math.cos(ang) * rad, ay: Math.sin(ang) * rad, r: r });
  }
  return list;
})();
// Slow autonomous drift of the square layer, a pure function of piece time.
function drift(t) {
  return {
    x: 14 * Math.sin(t * 0.11) + 6 * Math.sin(t * 0.043 + 1.7),
    y: 12 * Math.sin(t * 0.093 + 0.6) + 5 * Math.cos(t * 0.051 + 2.2)
  };
}
// Drag model: every drag is recorded, never integrated per frame.
// drags: completed drags, each {dx, dy, ease} where ease is the eased fraction
// applied at release. active: the drag in progress, or null.
// offset(t) = drift(t) + sum of completed drag deltas + the active drag's
// pointer delta scaled by 1 - exp(-(t - dragStartT) / 0.12), so the square
// layer follows the finger with eased follow and settles on release.
var drags = [];
var active = null;
var lastT = 0;
function offsetAt(t, step) {
  var d = drift(t);
  // Fixed base offset: the square set is always slightly off the circle
  // set, so the moire is violent from frame one, before any drift or drag.
  var ox = d.x + step * 0.45, oy = d.y - step * 0.35;
  var i;
  for (i = 0; i < drags.length; i++) {
    ox += drags[i].dx * drags[i].ease;
    oy += drags[i].dy * drags[i].ease;
  }
  if (active) {
    var k = 1 - Math.exp(-(t - active.t0) / 0.12);
    if (k < 0) k = 0;
    if (k > 1) k = 1;
    ox += (active.cx - active.sx) * k;
    oy += (active.cy - active.sy) * k;
  }
  return { x: ox, y: oy };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, startT = null;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function draw(t) {
  lastT = t;
  size();
  var minDim = Math.min(VW, VH);
  var cx = VW / 2, cy = VH / 2;
  var step = Math.max(14, Math.round(minDim / 34));
  var maxR = Math.ceil(Math.hypot(VW, VH) / 2) + step;
  var lw = Math.max(1, Math.round(step * 0.09));
  var off = offsetAt(t, step);
  var scx = cx + off.x, scy = cy + off.y;
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, VW, VH);
  ctx.strokeStyle = WHITE;
  ctx.lineWidth = lw;
  var i, r, h;
  // Layer one: concentric white circles, centered.
  for (r = step; r <= maxR; r += step) {
    ctx.beginPath();
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.stroke();
  }
  // Layer two: concentric white squares, slightly offset by drift and drag.
  for (h = step; h <= maxR; h += step) {
    ctx.beginPath();
    ctx.moveTo(scx - h, scy - h);
    ctx.lineTo(scx + h, scy - h);
    ctx.lineTo(scx + h, scy + h);
    ctx.lineTo(scx - h, scy + h);
    ctx.closePath();
    ctx.stroke();
  }
  // Big holes: solid black filled circles drawn OVER the lattices.
  // (Not destination-out: that would punch to transparency and break the
  // black ground in the thumb PNG. The fill matches the ground exactly.)
  ctx.fillStyle = BLACK;
  for (i = 0; i < HOLES.length; i++) {
    var hx = cx + HOLES[i].ax * minDim;
    var hy = cy + HOLES[i].ay * minDim;
    var hr = HOLES[i].r * minDim;
    ctx.beginPath();
    ctx.moveTo(hx + hr, hy);
    ctx.arc(hx, hy, hr, 0, TAU);
    ctx.fill();
  }
  // Caption: title, formula date, drag hint. White on the black ground.
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'Interference Is the Drawing  ·  2006 · 04 · 30  ·  Drag to shift the moire.';
  ctx.font = fs + 'px sans-serif';
  ctx.fillStyle = WHITE;
  ctx.textBaseline = 'top';
  ctx.fillText(label, Math.round(fs * 0.8), Math.round(VH - fs * 1.6));
  if (typeof window !== 'undefined') {
    window.__p1570 = {
      t: t, offset: off, step: step, maxR: maxR,
      cx: cx, cy: cy, minDim: minDim, holes: HOLES.length,
      dragging: !!active, drags: drags.length
    };
  }
}
function pointerPos(e) {
  var x = 0, y = 0;
  if (typeof e.clientX === 'number') { x = e.clientX; y = e.clientY; }
  else if (e.touches && e.touches[0]) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
  return { x: x, y: y };
}
function onDown(e) {
  var p = pointerPos(e);
  active = { sx: p.x, sy: p.y, cx: p.x, cy: p.y, t0: lastT };
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (!active) return;
  var p = pointerPos(e);
  active.cx = p.x; active.cy = p.y;
  if (e.preventDefault) e.preventDefault();
}
function onUp(e) {
  if (!active) return;
  var p = pointerPos(e);
  active.cx = p.x; active.cy = p.y;
  var k = 1 - Math.exp(-(lastT - active.t0) / 0.12);
  if (k < 0) k = 0;
  if (k > 1) k = 1;
  // A tap without movement records a zero delta and changes nothing.
  drags.push({ dx: active.cx - active.sx, dy: active.cy - active.sy, ease: k });
  active = null;
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
