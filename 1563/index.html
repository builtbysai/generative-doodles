<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forecast: Feeling</title>
<style>
html, body { margin: 0; padding: 0; background: #0D0B14; overflow: hidden; }
canvas { display: block; }
.overlay { position: fixed; left: 18px; top: 16px; color: #8A8496; font-family: Georgia, serif; pointer-events: none; z-index: 2; }
.overlay .t { font-size: 20px; letter-spacing: 0.04em; color: #C9C3D4; }
.overlay .d { font-size: 12px; letter-spacing: 0.18em; margin-top: 4px; }
.hint { position: fixed; left: 18px; bottom: 16px; color: #8A8496; font-family: Georgia, serif; font-size: 13px; letter-spacing: 0.06em; pointer-events: none; z-index: 2; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay"><div class="t">Forecast: Feeling</div><div class="d">2006 &middot; 04 &middot; 23</div></div>
<div class="hint">Tap for new weather.</div>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0D0B14';
var FACE_COUNT = 7; // grin, open smile, blushing smile, wink, tongue, sunglasses, tears of joy
var BASE_SEED = 1563 * 7919;
var TAP_STEP = 104729;
var SWAP_EVERY = 12;
var COUNT = 72;
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0;
var seed = BASE_SEED;
var parts = [];
var epoch = null;
var lastTs = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function h32(a, b, c) {
  var h = (a | 0) ^ Math.imul(b | 0, 2654435761) ^ Math.imul(c | 0, 40503);
  h = Math.imul(h ^ (h >>> 13), 0x5bd1e995);
  h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  var w = 0, h = 0;
  if (typeof window !== 'undefined' && window.screen) { w = window.screen.width; h = window.screen.height; }
  if (w && h) return Math.min(w, h) < 700;
  return VH > VW * 1.15;
}

function buildParts() {
  var rng = mulberry32(seed);
  var wind = rng() * TAU;
  var wx = Math.cos(wind), wy = Math.sin(wind);
  parts = [];
  for (var i = 0; i < COUNT; i++) {
    var layer = i % 3;
    var lo, hi, speed;
    if (layer === 0) { lo = 12; hi = 28; speed = 6; }
    else if (layer === 1) { lo = 28; hi = 64; speed = 14; }
    else { lo = 64; hi = 110; speed = 26; }
    var sizePx = lo + rng() * (hi - lo);
    var drift = speed * (0.7 + rng() * 0.6);
    var ang = rng() * TAU;
    var av = (rng() - 0.5) * 0.5;
    var bobAmp = 6 + rng() * 18;
    var bobFreq = 0.05 + rng() * 0.12;
    var bobPhase = rng() * TAU;
    parts.push({
      layer: layer, size: sizePx,
      bx: rng(), by: rng(),
      vx: wx * drift, vy: wy * drift,
      rot0: ang, av: av,
      bobAmp: bobAmp, bobFreq: bobFreq, bobPhase: bobPhase,
      face0: Math.floor(rng() * FACE_COUNT)
    });
  }
}

function faceFor(p, t) {
  var slot = Math.floor(t / SWAP_EVERY);
  return Math.floor(h32(seed, p.face0 * 131 + 17, slot) * FACE_COUNT);
}

function drawFace(x, y, sizePx, rot, variant) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  var r = sizePx / 2;
  var ink = '#1A1A1A';
  ctx.fillStyle = '#FFCC4D';
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.arc(0, 0, r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = Math.max(1, r * 0.04);
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.arc(0, 0, r * 0.97, 0, TAU);
  ctx.stroke();
  function dot(ex, ey, er) {
    ctx.fillStyle = ink;
    ctx.beginPath();
    ctx.moveTo(ex + er, ey);
    ctx.arc(ex, ey, er, 0, TAU);
    ctx.fill();
  }
  function happyEye(ex, ey, er) {
    ctx.strokeStyle = ink;
    ctx.lineWidth = Math.max(1.5, r * 0.09);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ex - er, ey + er * 0.4);
    ctx.arc(ex, ey + er * 0.4, er, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
  }
  function smile(mx, my, mr, open) {
    if (open) {
      ctx.fillStyle = ink;
      ctx.beginPath();
      ctx.moveTo(mx - mr, my);
      ctx.arc(mx, my, mr, 0, Math.PI);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.strokeStyle = ink;
      ctx.lineWidth = Math.max(1.5, r * 0.09);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(mx - mr, my - mr * 0.25);
      ctx.arc(mx, my - mr * 0.25, mr, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
    }
  }
  var er = r * 0.10;
  if (variant === 0) {
    dot(-r * 0.34, -r * 0.22, er);
    dot(r * 0.34, -r * 0.22, er);
    smile(0, r * 0.10, r * 0.42, false);
  } else if (variant === 1) {
    dot(-r * 0.34, -r * 0.22, er);
    dot(r * 0.34, -r * 0.22, er);
    smile(0, r * 0.02, r * 0.45, true);
  } else if (variant === 2) {
    happyEye(-r * 0.34, -r * 0.22, er * 1.1);
    happyEye(r * 0.34, -r * 0.22, er * 1.1);
    ctx.fillStyle = '#FF9EBB';
    ctx.beginPath();
    ctx.moveTo(-r * 0.52 + r * 0.14, r * 0.12);
    ctx.arc(-r * 0.52, r * 0.12, r * 0.14, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r * 0.52 + r * 0.14, r * 0.12);
    ctx.arc(r * 0.52, r * 0.12, r * 0.14, 0, TAU);
    ctx.fill();
    smile(0, r * 0.10, r * 0.38, false);
  } else if (variant === 3) {
    dot(-r * 0.34, -r * 0.22, er);
    happyEye(r * 0.34, -r * 0.22, er * 1.1);
    smile(0, r * 0.10, r * 0.42, false);
  } else if (variant === 4) {
    dot(-r * 0.34, -r * 0.22, er);
    dot(r * 0.34, -r * 0.22, er);
    smile(0, r * 0.05, r * 0.42, false);
    ctx.fillStyle = '#FF6B81';
    ctx.beginPath();
    ctx.moveTo(-r * 0.16, r * 0.30);
    ctx.lineTo(r * 0.16, r * 0.30);
    ctx.lineTo(r * 0.16, r * 0.62);
    ctx.arc(0, r * 0.62, r * 0.16, 0, Math.PI);
    ctx.lineTo(-r * 0.16, r * 0.30);
    ctx.closePath();
    ctx.fill();
  } else if (variant === 5) {
    ctx.fillStyle = ink;
    ctx.fillRect(-r * 0.62, -r * 0.42, r * 0.52, r * 0.34);
    ctx.fillRect(r * 0.10, -r * 0.42, r * 0.52, r * 0.34);
    ctx.fillRect(-r * 0.12, -r * 0.36, r * 0.24, r * 0.10);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(-r * 0.56, -r * 0.38, r * 0.16, r * 0.10);
    ctx.fillRect(r * 0.16, -r * 0.38, r * 0.16, r * 0.10);
    smile(0, r * 0.10, r * 0.42, false);
  } else {
    happyEye(-r * 0.34, -r * 0.22, er * 1.1);
    happyEye(r * 0.34, -r * 0.22, er * 1.1);
    smile(0, r * 0.02, r * 0.45, true);
    ctx.fillStyle = '#5AC8FA';
    ctx.beginPath();
    ctx.moveTo(-r * 0.62 + r * 0.10, r * 0.02);
    ctx.arc(-r * 0.62, r * 0.02, r * 0.10, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r * 0.62 + r * 0.10, r * 0.02);
    ctx.arc(r * 0.62, r * 0.02, r * 0.10, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function draw(t) {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var phone = isPhone();
  var W = VW, H = VH;
  var margin = 140;
  var extW = W + margin * 2, extH = H + margin * 2;
  var anchorSize = phone ? 120 : 160;
  var cx = W / 2, cy = H / 2;
  var anchorRot = Math.sin(t * 0.08) * 0.12;
  var anchorBob = Math.sin(t * 0.25) * 8;
  var i, p, x, y, rot, variant;
  for (var layer = 0; layer < 3; layer++) {
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      if (p.layer !== layer) continue;
      if (layer === 2 && p.size > 100) continue;
      x = (((p.bx * extW + p.vx * t) % extW) + extW) % extW - margin;
      y = (((p.by * extH + p.vy * t) % extH) + extH) % extH - margin
        + Math.sin(t * p.bobFreq * TAU + p.bobPhase) * p.bobAmp;
      rot = p.rot0 + p.av * t;
      variant = faceFor(p, t);
      drawFace(x, y, p.size, rot, variant);
    }
  }
  for (i = 0; i < parts.length; i++) {
    p = parts[i];
    if (p.layer !== 2 || p.size <= 100) continue;
    x = (((p.bx * extW + p.vx * t) % extW) + extW) % extW - margin;
    y = (((p.by * extH + p.vy * t) % extH) + extH) % extH - margin
      + Math.sin(t * p.bobFreq * TAU + p.bobPhase) * p.bobAmp;
    rot = p.rot0 + p.av * t;
    variant = faceFor(p, t);
    drawFace(x, y, p.size, rot, variant);
  }
  drawFace(cx, cy + anchorBob, anchorSize, anchorRot, 0);
}

function reseed() {
  seed += TAP_STEP;
  buildParts();
  epoch = null;
  draw(0);
}

function onTap(e) {
  if (e && e.preventDefault) e.preventDefault();
  reseed();
}
canvas.addEventListener('pointerdown', onTap);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
buildParts();
draw(0);
function loop(ts) {
  lastTs = ts;
  if (epoch === null) epoch = ts;
  var t = (ts - epoch) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
