<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four First Names, Drifting</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var FIELD = '#2a2a30';
  var CREAM = '#e8e0d0';
  var GOLD = '#d9a441';
  var TEAL = '#2e6f6a';
  var BRICK = '#a8674a';

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1482000);

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(1, Math.floor(w));
    H = Math.max(1, Math.floor(h));
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }

  // Loop: 24 s total. Scene 0-14 s, signatures drift 14-24 s.
  var LOOP = 24;
  var SCENE_LEN = 14;
  var CREDIT_LEN = LOOP - SCENE_LEN;

  // Four flowing line-signatures: parameterized polylines, never text.
  var SIG_COLORS = [CREAM, GOLD, TEAL, BRICK];
  var sigs = [];
  for (var i = 0; i < 4; i++) {
    sigs.push({
      color: SIG_COLORS[i],
      // Shape parameters, seeded once.
      a1: 0.018 + rnd() * 0.022,
      f1: 2.0 + rnd() * 2.0,
      p1: rnd() * Math.PI * 2,
      a2: 0.008 + rnd() * 0.014,
      f2: 5.0 + rnd() * 4.0,
      p2: rnd() * Math.PI * 2,
      // Drift offsets: stacked start, loose group in flight.
      xOff: (rnd() - 0.5) * 0.10,
      yOff: (rnd() - 0.5) * 0.16,
      len: 0.30 + rnd() * 0.10
    });
  }

  // Seated-figure scene: 5 figures, bodies in palette colors.
  var FIG_COLORS = [TEAL, BRICK, GOLD, TEAL, CREAM];
  var figs = [];
  for (var j = 0; j < 5; j++) {
    figs.push({
      color: FIG_COLORS[j],
      bobPhase: rnd() * Math.PI * 2,
      bobSpeed: 0.6 + rnd() * 0.5
    });
  }

  // Recorded drag intervals in absolute piece time: {s, e|null}.
  var drags = [];
  var activeDrag = null;

  function dragOverlap(a, b) {
    var total = 0;
    for (var k = 0; k < drags.length; k++) {
      var s = drags[k].s, e = (drags[k].e === null) ? b : drags[k].e;
      var lo = Math.max(a, s), hi = Math.min(b, e);
      if (hi > lo) total += (hi - lo);
    }
    return total;
  }
  function isDraggingAt(t) {
    for (var k = 0; k < drags.length; k++) {
      var s = drags[k].s, e = drags[k].e;
      if (t >= s && (e === null || t < e)) return true;
    }
    return false;
  }

  // Effective credit progress at absolute piece time t (0..1 within a credit
  // phase, 0 outside it). Drag slows the drift: speed 0.3 while dragging.
  function creditProgress(t) {
    var cycle = Math.floor(t / LOOP);
    var phaseStart = cycle * LOOP + SCENE_LEN;
    if (t < phaseStart) return 0;
    var raw = t - phaseStart;
    if (raw >= CREDIT_LEN) return 1;
    var slowed = dragOverlap(phaseStart, t);
    var eff = raw - 0.7 * slowed;
    if (eff < 0) eff = 0;
    return Math.min(1, eff / CREDIT_LEN);
  }

  function round4(x) {
    return Math.round(x * 10000) / 10000;
  }

  function drawScene(t) {
    var baseY = H * 0.62;
    var legH = H * 0.10;
    var hipY = baseY - legH;
    var bw = Math.max(10, W * 0.055);
    var torsoH = H * 0.13;
    var gap = W * 0.16;
    var x0 = W * 0.5 - 2 * gap;
    // Bench the figures sit on.
    ctx.fillStyle = CREAM;
    var benchH = Math.max(2, H * 0.006);
    ctx.fillRect(x0 - gap * 0.5, hipY, gap * 5, benchH);
    ctx.fillRect(x0 - gap * 0.5, hipY, Math.max(2, W * 0.004), legH);
    ctx.fillRect(x0 + gap * 4.5, hipY, Math.max(2, W * 0.004), legH);
    for (var i = 0; i < figs.length; i++) {
      var f = figs[i];
      var x = x0 + i * gap;
      var bob = Math.sin(t * f.bobSpeed + f.bobPhase) * H * 0.006;
      var headR = bw * 0.42;
      var headY = hipY - torsoH - headR * 1.1 + bob;
      ctx.fillStyle = f.color;
      // Torso (seated, upright).
      ctx.fillRect(x - bw * 0.5, hipY - torsoH, bw, torsoH);
      // Thigh, horizontal forward; shin, vertical down to the floor.
      var thighH = Math.max(3, torsoH * 0.22);
      ctx.fillRect(x - bw * 0.5, hipY - thighH, bw * 1.7, thighH);
      ctx.fillRect(x + bw * 1.2 - Math.max(3, bw * 0.22), hipY, Math.max(3, bw * 0.22), legH);
      // Head: own beginPath, moveTo before the arc (node-canvas quirk).
      ctx.fillStyle = CREAM;
      ctx.beginPath();
      ctx.moveTo(x + headR, headY);
      ctx.arc(x, headY, headR, 0, Math.PI * 2);
      ctx.fill();
      // Eye dot as a filled rect.
      ctx.fillStyle = FIELD;
      var d = Math.max(2, headR * 0.14);
      ctx.fillRect(x + headR * 0.15 - d / 2, headY - headR * 0.1 - d / 2, d, d);
    }
  }

  function drawSignatures(t, p) {
    // p: effective credit progress 0..1. Group travels right edge to left
    // of center; dissolves over the last third of travel.
    var sep = isDraggingAt(t) ? 1.8 : 1.0;
    var alpha = 1;
    if (p > 2 / 3) alpha = 1 - (p - 2 / 3) / (1 / 3);
    alpha = round4(Math.max(0, Math.min(1, alpha)));
    if (alpha <= 0) return;
    var midY = H * 0.5;
    var travel = W * 0.62;
    var groupX = W * 0.98 - p * travel;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var i = 0; i < sigs.length; i++) {
      var s = sigs[i];
      var len = W * s.len;
      var x0 = groupX + s.xOff * sep * W;
      var y0 = midY + s.yOff * sep * H;
      var lw = Math.max(2, Math.min(W, H) * 0.005);
      ctx.strokeStyle = s.color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = lw;
      ctx.beginPath();
      var steps = 48;
      for (var k = 0; k <= steps; k++) {
        var fx = k / steps;
        var x = x0 + fx * len;
        var y = y0
          + Math.sin(fx * s.f1 * Math.PI * 2 + s.p1) * H * s.a1
          + Math.sin(fx * s.f2 * Math.PI * 2 + s.p2) * H * s.a2;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    if (W === 0 || H === 0) resize();
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);
    var lt = t % LOOP;
    if (lt < SCENE_LEN) {
      // Scene bob runs on loop-local time so the 24 s loop closes exactly
      // (t=24 renders byte-identical to t=0); absolute t made the bob phase
      // drift across the loop boundary.
      drawScene(lt);
    } else {
      // During the credit phase the field holds only the signatures.
      var p = creditProgress(t);
      drawSignatures(t, p);
    }
  }

  // Pointer: drag slows the drift; release resumes. Never restarts anything.
  function onDown(e) {
    var t = (typeof pieceNow === 'number') ? pieceNow : 0;
    activeDrag = { s: t, e: null };
    drags.push(activeDrag);
    if (e && e.preventDefault) e.preventDefault();
  }
  function onUp() {
    if (activeDrag) { activeDrag.e = (typeof pieceNow === 'number') ? pieceNow : 0; activeDrag = null; }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // Probe + live hooks.
  var pieceNow = 0;
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: function (t) { pieceNow = t; draw(t); },
      pointerdown: function (t) { pieceNow = t; onDown(null); },
      pointerup: function (t) { pieceNow = t; onUp(); },
      creditProgress: creditProgress,
      loopLen: LOOP,
      sceneLen: SCENE_LEN
    };
  }

  // Boot: frame one is draw(0); the clock starts only with the rAF loop.
  draw(0);
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    pieceNow = (ts - start) / 1000;
    draw(pieceNow);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
