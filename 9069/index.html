<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9069 · Bastion</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#141210; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(236,229,211,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another bastion</div>
<script>
'use strict';
// No9069 Bastion.
// A wall of vertical slabs standing on a baseline. Each slab's height is
// set by two unseen sources inside the square: height falls off with
// distance from each source, and the two fields add, so towers rise
// where the fields reinforce and the wall sags where neither reaches.
// Slabs are colored by height: low slabs are deep teal, mid slabs slate
// and ochre, tall slabs rust. The single tallest slab is vermilion,
// found by measurement, not placed by hand. The gate for a good seed is
// a skyline with real relief: height range above 0.55 of the square and
// at least four slabs above 0.80, so the wall never comes out flat.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9069', 10) || 9069;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const BONE = '#ece1c8';
const VERM = '#b3402a';

function colorFor(h, tallest) {
  if (tallest) return VERM;
  if (h > 0.86) return '#a8542f';
  if (h > 0.68) return '#c08346';
  if (h > 0.50) return '#5d6157';
  if (h > 0.30) return '#33534b';
  return '#24382f';
}

function compose(s) {
  const rnd = mulberry32(s);
  const N = 60 + ((rnd() * 24) | 0);             // 60..83 slabs
  // Two height sources, kept off the floor and inside the middle band.
  const s1 = { x: 0.10 + rnd() * 0.35, a: 0.60 + rnd() * 0.30, r: 0.09 + rnd() * 0.11 };
  const s2 = { x: 0.55 + rnd() * 0.38, a: 0.60 + rnd() * 0.30, r: 0.09 + rnd() * 0.11 };
  const ripple = 0.03 + rnd() * 0.05;
  const rippleK = 18 + rnd() * 26;
  const rippleP = rnd() * Math.PI * 2;

  const heights = new Float64Array(N);
  let mn = Infinity, mx = -Infinity, tallest = 0;
  for (let i = 0; i < N; i++) {
    const x = (i + 0.5) / N;
    let h = 0.07;
    for (const src of [s1, s2]) {
      const d = Math.abs(x - src.x);
      h += src.a * Math.exp(-(d * d) / (2 * src.r * src.r));
    }
    h += ripple * Math.sin(x * rippleK + rippleP) + (rnd() - 0.5) * 0.02;
    h = Math.max(0.05, Math.min(0.97, h));
    heights[i] = h;
    if (h < mn) mn = h;
    if (h > mx) { mx = h; tallest = i; }
  }
  let high = 0;
  for (let i = 0; i < N; i++) if (heights[i] > 0.80) high++;
  return { N, heights, tallest, range: mx - mn, high };
}

function buildPiece(baseSeed) {
  let best = null, bestScore = -1;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    const score = p.range + Math.min(p.high, 6) * 0.05;
    if (score > bestScore) { bestScore = score; best = p; }
    if (p.range > 0.55 && p.high >= 4) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#141210';
  ctx.fillRect(0, 0, w, h);
  const S = Math.min(w, h);
  const ox = (w - S) / 2, oy = (h - S) / 2;

  ctx.fillStyle = BONE;
  ctx.fillRect(ox, oy, S, S);
  ctx.save();
  ctx.beginPath(); ctx.rect(ox, oy, S, S); ctx.clip();

  if (!piece) piece = buildPiece(seed);
  const p = piece;
  const floor = oy + S * 0.94;
  const bw = S / p.N;
  for (let i = 0; i < p.N; i++) {
    const bh = p.heights[i] * S * 0.88;
    ctx.fillStyle = colorFor(p.heights[i], i === p.tallest);
    ctx.fillRect(ox + i * bw + bw * 0.10, floor - bh, bw * 0.80, bh);
  }
  // Baseline.
  ctx.fillStyle = '#241f18';
  ctx.fillRect(ox, floor, S, Math.max(2, S / 240));

  const rnd = mulberry32((seed ^ 0x51f15e) >>> 0);
  for (let g = 0; g < 2000; g++) {
    const x = ox + rnd() * S, y = oy + rnd() * S;
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(30,26,20,0.05)' : 'rgba(90,74,52,0.045)';
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
