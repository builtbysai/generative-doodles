<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9069 Alluvium · Generative Doodles</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#191410; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,220,198,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another alluvium</div>
<script>
'use strict';
// No9069 Alluvium.
// River mouths seen from above: each source spills a fan of arcs, and the
// fans overlap and settle over each other in thin translucent sediment.
// Every seed is checked so the fans actually overlap instead of sitting
// apart like strangers.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9069', 10) || 9069;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}

const ctx = canvas.getContext('2d');

const GROUND = '#191410';
const SEDIMENTS = ['#c9a15f', '#b0763a', '#8a5a30', '#d9c08a', '#6e4a2c', '#a3703d'];

function compose(s) {
  const rnd = mulberry32(s);
  const F = 3 + ((rnd() * 2) | 0);              // 3..4 fans
  const fans = [];
  for (let i = 0; i < F; i++) {
    const arcs = [];
    const A = 44 + ((rnd() * 28) | 0);          // arcs per fan
    const spread = 0.62 + rnd() * 0.38;         // angular half-spread
    const reach = 1.05 + rnd() * 0.75;          // how far the fan runs
    for (let a = 0; a < A; a++) {
      arcs.push({
        r: 0.05 + (a / A) * reach,
        wob: (rnd() - 0.5) * 0.06,
        tone: (rnd() * SEDIMENTS.length) | 0,
        alpha: 0.13 + rnd() * 0.17
      });
    }
    fans.push({ x: 0.08 + rnd() * 0.84, y: -0.10 - rnd() * 0.16, arcs, spread });
  }
  // overlap score: mean pairwise source distance (smaller = more overlap)
  let dSum = 0, dN = 0;
  for (let i = 0; i < F; i++) for (let j = i + 1; j < F; j++) {
    dSum += Math.abs(fans[i].x - fans[j].x); dN++;
  }
  return { fans, overlap: dN ? dSum / dN : 0 };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 24; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best || p.overlap < best.overlap) best = p;
    if (p.overlap < 0.30) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: use the physical screen size, not the viewport aspect.
  // The viewport can lie (desktop-site mode, pinch state, URL-bar flux)
  // but screen.width always reports the real device.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;
  const S = Math.min(RX, RY);

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  ctx.save();
  ctx.beginPath(); ctx.rect(ox, oy, RX, RY); ctx.clip();
  ctx.lineCap = 'round';

  for (const f of p.fans) {
    const fx = ox + f.x * RX, fy = oy + f.y * RY;
    for (const a of f.arcs) {
      ctx.strokeStyle = hexA(SEDIMENTS[a.tone], a.alpha);
      ctx.lineWidth = Math.max(1.2, S / 260 * (0.7 + a.r));
      ctx.beginPath();
      const SEG = 48;
      for (let k = 0; k <= SEG; k++) {
        const ang = Math.PI * (k / SEG);          // 0..PI, fanning downward
        const rr = (a.r + a.wob * Math.sin(ang * 3 + a.r * 40)) * S;
        const spreadA = (ang - Math.PI / 2) * f.spread + Math.PI / 2;
        const x = fx + Math.cos(spreadA) * rr;
        const y = fy + Math.sin(spreadA) * rr * (RY / RX > 1.3 ? 1.35 : 0.95);
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  // Restrained grain.
  const rnd = mulberry32((seed ^ 0x77aa1d) >>> 0);
  for (let g = 0; g < 2200; g++) {
    const x = ox + rnd() * RX, y = oy + rnd() * RY;
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(10,8,5,0.07)' : 'rgba(232,220,198,0.045)';
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
