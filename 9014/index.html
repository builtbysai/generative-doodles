<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9014 · Bloom — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #ece5d3;
    color: #4a4136;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 620px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #a09a89; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; color: #3a3226; }
  header h1 .num { color: #a63d40; }
  header p { color: #8a8272; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #5c5344; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #f3eee1;
    box-shadow: 0 18px 60px rgba(90, 75, 50, 0.25);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #a09a89; font-size: 13px; font-style: italic; }
  footer a { color: #a63d40; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9014</span> · Bloom</h1>
  <p>First the ruler draws, then the water takes over: pigment blooms over
  exact geometry and dries where it wants. <b>Click the piece for a fresh
  sheet.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 901415;
const tParam = parseFloat(params.get("t"));
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const TAU = Math.PI * 2;
const VU = 1000;
const PAPER = "#f3eee1";
const INK = "58,47,40";
const INK_MS = 1400, WASH_MS = 1150, WASH_GAP = 420;

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function hexRGB(h){
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
// Box-Muller gaussian from a uniform stream
function gauss(rnd){
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}

const TRIADS = [
  ["#33406e", "#d9a03f", "#a63d40"],  // indigo / ochre / madder
  ["#3e7d6b", "#b0602f", "#33406e"],  // teal / sienna / indigo
  ["#a63d40", "#d9a03f", "#6b4a2f"]   // madder / ochre / umber
];

// ---- geometry: polylines + anchor points ----
function circlePts(cx, cy, r, n){
  const p = [];
  for (let i = 0; i <= n; i++){
    const a = (i / n) * TAU;
    p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return p;
}
function arcPts(cx, cy, r, a0, a1, n){
  const p = [];
  for (let i = 0; i <= n; i++){
    const a = a0 + (a1 - a0) * (i / n);
    p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return p;
}
function rectPts(x, y, w, h){
  return [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]];
}
function linePts(x0, y0, x1, y1, n){
  const p = [];
  for (let i = 0; i <= n; i++) p.push([x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n]);
  return p;
}

function buildComposition(rnd){
  // returns { strokes: [polyline...], anchors: [{x, y, r}] }
  const kind = (rnd() * 3) | 0;
  const strokes = [], anchors = [];
  if (kind === 0){
    // Orbit: large circle, inner circle, bars, triangle
    const cx = 500, cy = 470, R = 300;
    strokes.push(circlePts(cx, cy, R, 140));
    strokes.push(circlePts(cx, cy, R * 0.52, 100));
    strokes.push(rectPts(140, 700, 720, 46));
    strokes.push(rectPts(180, 180, 46, 260));
    const t3 = [[cx, cy - R * 1.02], [cx - R * 0.88, cy + R * 0.51], [cx + R * 0.88, cy + R * 0.51], [cx, cy - R * 1.02]];
    strokes.push(t3);
    anchors.push({ x: cx, y: cy, r: 210 }, { x: 500, y: 723, r: 130 },
                 { x: 203, y: 310, r: 110 }, { x: cx + R * 0.62, y: cy - R * 0.62, r: 120 });
  } else if (kind === 1){
    // Arcs from the corner + bars + small sun
    for (let i = 0; i < 5; i++)
      strokes.push(arcPts(120, 880, 150 + i * 130, -Math.PI / 2, 0.12, 110));
    strokes.push(rectPts(640, 120, 52, 560));
    strokes.push(rectPts(760, 300, 52, 380));
    strokes.push(circlePts(770, 180, 74, 80));
    anchors.push({ x: 480, y: 520, r: 230 }, { x: 666, y: 400, r: 120 },
                 { x: 770, y: 180, r: 130 }, { x: 300, y: 700, r: 150 });
  } else {
    // Grid of small circles + one diagonal sweep + large arc
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
      strokes.push(circlePts(300 + i * 200, 300 + j * 200, 62, 60));
    strokes.push(linePts(120, 880, 880, 120, 2));
    strokes.push(arcPts(500, 500, 420, Math.PI * 0.7, Math.PI * 1.3, 120));
    anchors.push({ x: 500, y: 500, r: 200 }, { x: 300, y: 300, r: 120 },
                 { x: 700, y: 700, r: 120 }, { x: 500, y: 130, r: 140 });
  }
  return { strokes, anchors: anchors.slice(0, 3 + ((rnd() * 2) | 0)), kind };
}

// ---- watercolor wash: recursively deformed polygon glazes ----
function deformPoly(pts, rnd, sigma, depth){
  let p = pts;
  for (let d = 0; d < depth; d++){
    const out = [];
    for (let i = 0; i < p.length; i++){
      const a = p[i], b = p[(i + 1) % p.length];
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const off = gauss(rnd) * sigma, ang = rnd() * TAU;
      out.push(a, [mx + Math.cos(ang) * off, my + Math.sin(ang) * off]);
    }
    p = out;
  }
  return p;
}

function buildWash(anchor, pigment, rnd){
  const wet = rnd() < 0.55;                       // wet washes bleed far
  const sigma = wet ? 14 + rnd() * 14 : 5 + rnd() * 6;
  const depth = 4 + ((rnd() * 2) | 0);
  const layers = 44 + ((rnd() * 26) | 0);
  const base = circlePts(anchor.x, anchor.y, anchor.r, 9);
  const polys = [];
  for (let i = 0; i < layers; i++)
    polys.push(deformPoly(base, rnd, sigma * (0.75 + rnd() * 0.5), depth));
  const edge = polys[(polys.length / 2) | 0];     // mid-deformation boundary
  // granulation speckles inside the wash
  const speck = [];
  const jrnd = mulberry32((rnd() * 1e9) | 0);
  let guard = 0;
  while (speck.length < 1700 && guard++ < 30000){
    const a = jrnd() * TAU, rr = Math.sqrt(jrnd()) * anchor.r * 1.05;
    speck.push({
      x: anchor.x + Math.cos(a) * rr, y: anchor.y + Math.sin(a) * rr,
      s: 0.8 + jrnd() * 1.1, a: 0.03 + jrnd() * 0.06
    });
  }
  const hueJit = (rnd() - 0.5) * 10;
  return { polys, edge, speck, pigment, hueJit, alpha: 5 + rnd() * 4, wet };
}

function shade(rgb, f){
  return [clamp(Math.round(rgb[0] * f), 0, 255), clamp(Math.round(rgb[1] * f), 0, 255), clamp(Math.round(rgb[2] * f), 0, 255)];
}

let ctx, comp, washes;

function setupCanvas(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  const K = S / VU;
  canvas.width = S * dpr; canvas.height = S * dpr;
  ctx = canvas.getContext("2d");
  ctx.setTransform(dpr * K, 0, 0, dpr * K, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VU, VU);
}

function drawPaper(rnd){
  // cotton grain: fine speckle + long faint fibers
  for (let i = 0; i < 3200; i++){
    ctx.globalAlpha = 0.015 + rnd() * 0.03;
    ctx.fillStyle = rnd() < 0.6 ? "#c9bfa8" : "#fffdf6";
    ctx.fillRect(rnd() * VU, rnd() * VU, 1 + rnd() * 1.6, 1 + rnd() * 1.6);
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "rgba(160,148,120,0.05)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 70; i++){
    const x = rnd() * VU, y = rnd() * VU, a = rnd() * TAU, l = 30 + rnd() * 90;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
    ctx.stroke();
  }
}

function pathOf(poly){
  ctx.beginPath();
  ctx.moveTo(poly[0][0], poly[0][1]);
  for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
  ctx.closePath();
}

function generate(){
  const rnd = mulberry32(seed);
  comp = buildComposition(rnd);
  const triad = TRIADS[(rnd() * TRIADS.length) | 0];
  washes = comp.anchors.map((a, i) =>
    buildWash(a, triad[i % triad.length], mulberry32((rnd() * 1e9) | 0)));
  // paper stream last so composition is stable regardless
  comp.paperRnd = mulberry32(seed ^ 0x9e37);
}

let rafId = 0, startT = 0;
let drawnInk = [], drawnLayers = [], drawnSpeck = [], edgeDrawn = [];

function resetDrawState(){
  drawnInk = comp.strokes.map(() => 1);
  drawnLayers = washes.map(() => 0);
  drawnSpeck = washes.map(() => 0);
  edgeDrawn = washes.map(() => false);
}

function drawInkDelta(frac){
  ctx.strokeStyle = `rgba(${INK},0.88)`;
  ctx.lineWidth = 2.6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  const per = 1 / comp.strokes.length;
  for (let s = 0; s < comp.strokes.length; s++){
    const local = clamp((frac - s * per) / per, 0, 1);
    const pts = comp.strokes[s];
    const target = Math.max(1, Math.floor(local * pts.length));
    ctx.beginPath();
    for (let i = drawnInk[s]; i < target && i < pts.length; i++){
      ctx.moveTo(pts[i - 1][0], pts[i - 1][1]);
      ctx.lineTo(pts[i][0], pts[i][1]);
    }
    ctx.stroke();
    drawnInk[s] = Math.max(drawnInk[s], Math.min(target, pts.length));
  }
}

function drawWashDelta(w, wi, frac){
  const c = hexRGB(w.pigment);
  const cj = [
    clamp(c[0] + w.hueJit, 0, 255) | 0,
    clamp(c[1] + w.hueJit * 0.7, 0, 255) | 0,
    clamp(c[2] + w.hueJit * 0.4, 0, 255) | 0
  ];
  const nLayers = Math.floor(frac * w.polys.length);
  for (let i = drawnLayers[wi]; i < nLayers; i++){
    pathOf(w.polys[i]);
    ctx.fillStyle = `rgba(${cj[0]},${cj[1]},${cj[2]},${(w.alpha / 255).toFixed(4)})`;
    ctx.fill();
  }
  drawnLayers[wi] = Math.max(drawnLayers[wi], nLayers);
  const nSpeck = Math.floor(frac * w.speck.length);
  for (let i = drawnSpeck[wi]; i < nSpeck; i++){
    const s = w.speck[i];
    ctx.fillStyle = `rgba(${cj[0]},${cj[1]},${cj[2]},${s.a.toFixed(3)})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  drawnSpeck[wi] = Math.max(drawnSpeck[wi], nSpeck);
  if (frac >= 1 && !edgeDrawn[wi]){
    edgeDrawn[wi] = true;
    const dk = shade(c, 0.62);
    pathOf(w.edge);
    ctx.strokeStyle = `rgba(${dk[0]},${dk[1]},${dk[2]},0.14)`;
    ctx.lineWidth = 5;
    ctx.stroke();
  }
}

function advanceTo(prog){
  const inkFrac = clamp(prog / 0.22, 0, 1);
  drawInkDelta(inkFrac);
  const wprog = clamp((prog - 0.22) / 0.78, 0, 1);
  for (let i = 0; i < washes.length; i++){
    const local = clamp(wprog * (washes.length + 1) - i * 0.55, 0, 1);
    if (local > 0) drawWashDelta(washes[i], i, local);
  }
}

function render(frozenT){
  generate();
  setupCanvas();
  drawPaper(comp.paperRnd);
  resetDrawState();
  cancelAnimationFrame(rafId);
  startT = 0;
  if (Number.isFinite(frozenT)){ advanceTo(clamp(frozenT, 0, 1)); return; }
  if (reduced){ advanceTo(1); return; }
  const total = INK_MS + washes.length * (WASH_MS + WASH_GAP);
  const step = now => {
    if (!startT) startT = now;
    const prog = clamp((now - startT) / total, 0, 1);
    advanceTo(prog);
    if (prog < 1) rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}

let frozenProg = Number.isFinite(tParam) ? tParam : (reduced ? 1 : undefined);
window.addEventListener("resize", () => render(frozenProg));
document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  render();
});
render(frozenProg);
</script>
</body>
</html>
