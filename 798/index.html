<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ocean Answer</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EDEAE2; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  // Strict palette: two tones, nothing else. The rule is the work.
  var GROUND = "#EDEAE2";
  var BLUE = "#1F4E8C";

  var LOOP = 48;        // seconds, seamless: 12 takes of 4 s
  var TAKES = 12;
  var TAKE_LEN = LOOP / TAKES;

  // Frame one is loop t = 0 exactly: take 01, fully shown, counter 01/12.
  // No phase offset is needed here; the field is complete from the start.
  var PHASE = 0;

  // mulberry32: the only randomness in the piece, consumed once at setup.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Imprint texture: one No. 50 brush, pressed and lifted. Each imprint is
  // a DAB first: a solid body of paint, near-opaque through its upper
  // two-thirds where the brush first pressed, easing only toward the dry
  // bottom edge where it lifted. The bristle texture lives INSIDE that
  // body: blue ridges add density, and thin ground-coloured gaps score
  // the fine separations between bristle bundles, both drawn in three
  // stacked segments whose alpha falls away (1.0 / 0.62 / 0.35) toward the
  // bottom. A short cluster of dense load strokes sits at the very top
  // edge. Placement is never jittered: the lattice below is exact and is
  // identical in every take. The hand lives only here, in the texture,
  // plus the take's overall pressure.
  function makeImprint(rng) {
    var streaks = [];
    var n = 26 + Math.floor(rng() * 13); // 26..38 density ridges
    for (var i = 0; i < n; i++) {
      streaks.push({
        x: (rng() * 2 - 1) * 0.46,              // across the dab, in dab units
        top: -0.5 + rng() * 0.1,                // starts at the top edge
        len: 0.58 + rng() * 0.44,               // some drag a hair past the base
        w: 0.028 + rng() * 0.03,                // bristle width, dab units
        a: 0.45 + rng() * 0.4                   // ridge density over the body
      });
    }
    var gaps = [];
    var g = 18 + Math.floor(rng() * 10); // 18..27 bristle-gap scores
    for (var h = 0; h < g; h++) {
      gaps.push({
        x: (rng() * 2 - 1) * 0.46,
        top: -0.5 + rng() * 0.08,
        len: 0.5 + rng() * 0.48,
        w: 0.012 + rng() * 0.014,               // thinner than the ridges
        a: 0.16 + rng() * 0.2                   // ground showing through
      });
    }
    var load = [];
    var m = 8 + Math.floor(rng() * 5); // dense top-edge load strokes
    for (var j = 0; j < m; j++) {
      load.push({
        x: (rng() * 2 - 1) * 0.44,
        len: 0.1 + rng() * 0.12,
        w: 0.03 + rng() * 0.03,
        a: 0.65 + rng() * 0.3
      });
    }
    return {
      rot: (rng() * 2 - 1) * 0.035,       // rotation jitter, +-2 degrees
      scl: 0.95 + rng() * 0.1,            // scale jitter, +-5 percent
      alp: 0.9 + rng() * 0.1,             // alpha jitter, +-10 percent
      body: 0.9 + rng() * 0.1,            // dab body alpha: solid paint
      streaks: streaks,
      gaps: gaps,
      load: load
    };
  }

  // Twelve takes of the same field. The lattice is one and identical in
  // all twelve; each take is a fresh seeded hand (per-imprint rotation,
  // scale, alpha, paint load, streak data) plus its own overall pressure,
  // alpha 0.75 to 1.0. All twelve are precomputed once at load; the take
  // on screen is a pure function of loop time, so the cuts are exact and
  // the loop is seamless.
  var VARIANTS = [];
  (function () {
    for (var v = 0; v < TAKES; v++) {
      var rng = mulberry32(798001 + v * 7919);
      var pressure = 0.75 + rng() * 0.25;
      var set = [];
      for (var i = 0; i < 16; i++) set.push(makeImprint(rng));
      VARIANTS.push({ pressure: pressure, imprints: set });
    }
  })();

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    DPR = window.devicePixelRatio || 1;
    W = Math.round(w);
    H = Math.round(h);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  var currentT = PHASE;

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () { resize(); draw(currentT); });
  }
  window.addEventListener("resize", function () { resize(); draw(currentT); });

  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }

  // Per-take pressure multiplier, set by draw() before stamping the field.
  var PRESSURE = 1;

  // Draw one imprint centered at (cx, cy), dab size s, fully pressed.
  // There is no press animation in this piece: every take is a finished
  // field, and takes change by hard cut, never by morph or fade.
  function drawImprint(cx, cy, s, imp) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(imp.rot);
    ctx.scale(imp.scl, imp.scl);
    ctx.fillStyle = BLUE;
    // Dab body: the squarish block of paint, drawn as horizontal bands
    // (no gradients in this house). Full density through the upper
    // two-thirds, where the brush pressed; the bottom third dries off,
    // easing to just over half density at the lift-off edge.
    var BANDS = 12, b, bf;
    for (b = 0; b < BANDS; b++) {
      bf = b / BANDS;
      ctx.globalAlpha = PRESSURE * imp.alp * imp.body *
        (bf < 0.62 ? 1 : 1 - 0.45 * smooth((bf - 0.62) / 0.38));
      ctx.fillRect(-s / 2, -s / 2 + bf * s, s, s / BANDS + 1);
    }
    // Bristle texture inside the body, each stroke in three segments
    // drying toward the bottom: blue ridges deepen the paint load,
    // then ground-coloured gaps score the separations between bristle
    // bundles, the fine light lines a flat brush leaves in solid paint.
    ctx.lineCap = "butt";
    var k, st, seg, segLen, y0, y1;
    ctx.strokeStyle = BLUE;
    for (k = 0; k < imp.streaks.length; k++) {
      st = imp.streaks[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      y0 = st.top * s;
      segLen = (st.len * s) / 3;
      for (seg = 0; seg < 3; seg++) {
        ctx.globalAlpha = PRESSURE * imp.alp * st.a * (seg === 0 ? 1 : (seg === 1 ? 0.62 : 0.35));
        y1 = y0 + segLen;
        ctx.beginPath();
        ctx.moveTo(st.x * s, y0);
        ctx.lineTo(st.x * s, y1);
        ctx.stroke();
        y0 = y1;
      }
    }
    ctx.strokeStyle = GROUND;
    for (k = 0; k < imp.gaps.length; k++) {
      st = imp.gaps[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      y0 = st.top * s;
      segLen = (st.len * s) / 3;
      for (seg = 0; seg < 3; seg++) {
        ctx.globalAlpha = PRESSURE * st.a * (seg === 0 ? 1 : (seg === 1 ? 0.6 : 0.3));
        y1 = y0 + segLen;
        ctx.beginPath();
        ctx.moveTo(st.x * s, y0);
        ctx.lineTo(st.x * s, y1);
        ctx.stroke();
        y0 = y1;
      }
    }
    ctx.strokeStyle = BLUE;
    // Top-edge load: where the brush first pressed, the paint is densest.
    for (k = 0; k < imp.load.length; k++) {
      st = imp.load[k];
      ctx.lineWidth = Math.max(1, st.w * s);
      ctx.globalAlpha = PRESSURE * imp.alp * st.a;
      ctx.beginPath();
      ctx.moveTo(st.x * s, -s / 2);
      ctx.lineTo(st.x * s, -s / 2 + st.len * s);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  // The lattice: exact, unjittered, brick-offset. Pitch derives from the
  // frame's smaller dimension; columns sit at (c - 1.75) pitches on even
  // rows and (c - 1.25) on odd rows (the half-step shift), which centers
  // the whole 4x4 field's bounding box on the frame center. The interval
  // is the constant; only the support (the frame) changes its size. This
  // geometry is computed identically for every take: the layout never
  // changes, only the hand does.
  function draw(t) {
    currentT = t;
    if (W === 0) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var phase = ((t % LOOP) + LOOP) % LOOP;
    var take = Math.floor(phase / TAKE_LEN); // 0..11, pure function of t
    var variant = VARIANTS[take];
    PRESSURE = variant.pressure;

    var P = Math.min(W, H) / 5.4;   // the 30 cm interval, in frame units
    var S = P * 0.5;                // dab size: half a step, sparse field
    var cx = W / 2, cy = H / 2;

    for (var r = 0; r < 4; r++) {
      for (var c = 0; c < 4; c++) {
        var i = r * 4 + c;
        var x = cx + (c - (r % 2 === 0 ? 1.75 : 1.25)) * P;
        var y = cy + (r - 1.5) * P;
        drawImprint(x, y, S, variant.imprints[i]);
      }
    }

    // The take counter: the one text the prompt sanctions, and the only
    // text in the piece besides the title. Tiny, quiet, bottom-right,
    // in the imprint blue at low alpha; it changes only at the cuts.
    var fs = Math.max(11, Math.round(Math.min(W, H) * 0.02));
    var mg = Math.round(Math.min(W, H) * 0.035);
    ctx.font = fs + "px sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = BLUE;
    ctx.globalAlpha = 0.55;
    ctx.fillText(pad2(take + 1) + "/12", W - mg, H - mg);
    ctx.globalAlpha = 1;
  }

  resize();
  draw(PHASE);

  // Watch-only. The loop is anchored at load: frame one is the synchronous
  // draw above at t = 0, and the animation is elapsed-since-load, never a
  // wall clock. No interaction of any kind.
  if (typeof requestAnimationFrame === "function") {
    var start = null;
    var tick = function (now) {
      if (start === null) start = now;
      draw(PHASE + (now - start) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
