<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>№5004 · Fault Lines</title><meta name="description" content="A recursive field of corner-turning arcs, where a diagonal probability gradient changes the scale of a shared geometric motif. Tap for another print."><style>
html,body{margin:0;overflow:hidden;width:100%;height:100%;background:#e6dec7}canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;outline:none}canvas:active{cursor:pointer}canvas:focus-visible{outline:1px solid currentColor;outline-offset:-4px}button{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));background:none;border:0;padding:10px;color:#e7dfc8;font:12px Arial,sans-serif;cursor:pointer}button:focus-visible{outline:1px solid currentColor}
</style></head><body><canvas id="art" tabindex="0" aria-label="Fault Lines. Tap for a new variation."></canvas><script>
'use strict';
function random(seed){return ()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fault(seed,t=0,control=0){
 const r=random(seed),palettes=[["#e9dfc9","#263333","#b35239","#b6b095"],["#e6dec7","#272e3d","#a84f39","#9aa4a1"],["#ece2cc","#263831","#b96c43","#adb3a0"]];
 const [bg,ink,red,soft]=palettes[Math.floor(r()*palettes.length)],shapes=[];
 function rect(x,y,w,h,c){shapes.push({pts:[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],fill:c,closed:true});}
 function arc(cx,cy,rad,start,c,w){const pts=[];for(let i=0;i<=30;i++){const a=start+i/30*Math.PI/2;pts.push([cx+rad*Math.cos(a),cy+rad*Math.sin(a)]);}shapes.push({pts,c,w});}
 // Recursive quadrants share a single corner-turning grammar at every scale.
 // A coarse diagonal field biases the probability of subdivision.
 function tile(x,y,s,depth){
   const u=(x+s/2-360)/294,v=(y+s/2-360)/294,field=Math.sin((u-v)*4.1+seed%7)*.5+.5;
   if(depth<3&&(depth===0||r()<(.39+.29*field)/(depth===1?1:1.48))){
     const q=s/2;tile(x,y,q,depth+1);tile(x+q,y,q,depth+1);tile(x,y+q,q,depth+1);tile(x+q,y+q,q,depth+1);return;
   }
   const pad=1.65,a=x+pad,b=y+pad,z=s-2*pad, dark=r()<.47,ground=dark?ink:bg,fg=dark?bg:ink;
   rect(a,b,z,z,ground);
   const flip=(Math.floor((x-66)/s)+Math.floor((y-66)/s)+Math.floor(r()*2))%2===0;
   const corners=flip?[[a,b,0],[a+z,b+z,Math.PI]]:[[a+z,b,Math.PI/2],[a,b+z,Math.PI*1.5]];
   const bands=Math.max(3,Math.round(z/17)),spacing=z/(2*(bands+.25));
   for(const [cx,cy,ang] of corners)for(let i=0;i<bands;i++){
     const radius=(i+.72)*spacing,accent=((i+depth+Math.floor(x/73))%7===0);
     arc(cx,cy,radius,ang,accent?red:i%4===2?soft:fg,spacing*.66);
   }
 }
 rect(66,66,588,588,ink);tile(66,66,588,0);return {bg,shapes};
}
const make=fault,ANIMATED=false,SOUND=false,DEFAULT=5004,cv=document.getElementById('art'),ctx=cv.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)');
const params=new URLSearchParams(location.search);
let seed=params.has('seed')?Number(params.get('seed'))>>>0:DEFAULT,time=0,phase=0,raf=0,last=0,drag=null,model=null,dirty=true,size=null,visible=!document.hidden;
let ac=null,voices=[],master=null,wantsSound=false,focused=true;
function draw(){
 const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight,dpr=Math.min(devicePixelRatio||1,2);
 if(!size||size[0]!==w||size[1]!==h||size[2]!==dpr){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px';size=[w,h,dpr];}
 if(dirty||ANIMATED){model=make(seed,time,phase);dirty=false;}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=model.bg;ctx.fillRect(0,0,w,h);document.body.style.background=model.bg;
 const s=Math.min(w,h)/720;ctx.translate((w-720*s)/2,(h-720*s)/2);ctx.scale(s,s);ctx.lineCap='round';ctx.lineJoin='round';
 for(const q of model.shapes){ctx.beginPath();ctx.moveTo(q.pts[0][0],q.pts[0][1]);for(let j=1;j<q.pts.length;j++)ctx.lineTo(q.pts[j][0],q.pts[j][1]);if(q.closed)ctx.closePath();if(q.fill){ctx.fillStyle=q.fill;ctx.fill();}else{ctx.strokeStyle=q.c;ctx.lineWidth=q.w;ctx.stroke();}}
}
function tick(now){raf=0;if(!visible||reduce.matches)return;if(last)time+=Math.min(.05,(now-last)/1000);last=now;draw();updateSound();raf=requestAnimationFrame(tick);}
function wake(){if(ANIMATED&&visible&&!reduce.matches&&!raf){last=0;raf=requestAnimationFrame(tick);}}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;last=0;}
function regenerate(){seed=(Math.random()*4294967296)>>>0;time=0;phase=0;dirty=true;try{history.replaceState(null,'','?seed='+seed);}catch{}draw();updateSound();}
cv.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,phase,moved:false};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)drag.moved=true;if(ANIMATED&&drag.moved){phase=drag.phase+(e.clientX-drag.x+e.clientY-drag.y)*.012;dirty=true;if(reduce.matches)draw();updateSound();}});
cv.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<7)regenerate();});
cv.addEventListener('pointercancel',()=>drag=null);cv.addEventListener('lostpointercapture',()=>drag=null);
cv.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();regenerate();}else if(ANIMATED&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();phase+=e.key==='ArrowRight'?.22:-.22;draw();updateSound();}});
function resize(){draw();}window.addEventListener('resize',resize);if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
function updateSound(){if(!ac||ac.state!=='running'||!wantsSound)return;const a=ac.currentTime,p=model.petals||6;const base=110*2**((p-5)/12);voices[0].frequency.setTargetAtTime(base*(1+.012*Math.sin(time*.5+phase)),a,.2);voices[1].frequency.setTargetAtTime(base*1.5*(1+.012*Math.sin(time*.32-phase)),a,.2);voices[2].frequency.setTargetAtTime(base*2*(1+.006*Math.sin(time*.21+phase)),a,.3);}
async function audioState(){if(!ac)return;try{if(wantsSound&&visible&&focused){await ac.resume();if(wantsSound&&visible&&focused){master.gain.setTargetAtTime(.045,ac.currentTime,.15);updateSound();}else await ac.suspend();}else{master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(0,ac.currentTime);await ac.suspend();}}catch{}}
if(SOUND){const button=document.getElementById('sound');button.addEventListener('click',async()=>{wantsSound=!wantsSound;button.textContent=wantsSound?'Sound on':'Sound off';button.setAttribute('aria-pressed',String(wantsSound));if(wantsSound&&!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){wantsSound=false;button.textContent='Sound unavailable';button.disabled=true;return;}try{ac=new AC();master=ac.createGain();master.gain.value=0;master.connect(ac.destination);for(let i=0;i<3;i++){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=110*(i+1);g.gain.value=[.45,.28,.15][i];o.connect(g);g.connect(master);o.start();voices.push(o);}}catch{wantsSound=false;button.textContent='Sound unavailable';button.disabled=true;return;}}await audioState();});}
document.addEventListener('visibilitychange',()=>{visible=!document.hidden;if(visible)wake();else stop();audioState();});
window.addEventListener('blur',()=>{focused=false;audioState();});window.addEventListener('focus',()=>{focused=true;audioState();});
window.addEventListener('pagehide',()=>{visible=false;stop();audioState();});window.addEventListener('pageshow',()=>{visible=!document.hidden;wake();audioState();});
reduce.addEventListener('change',()=>{if(reduce.matches){stop();draw();}else wake();});
draw();wake();
</script></body></html>
