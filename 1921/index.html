<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1921 The Wordsmith's Band</title>
<style>
  html, body { margin: 0; padding: 0; background: #14101c; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. No study
  // file exists for lauren-kinsella, so the hex values are chosen here
  // from the prompt's own color names.
  var BG = '#14101c';       // stage ground, page ground too
  var PAPER = '#f2e8d5';    // the fixed lyric, warm paper white
  var PAPER_DIM = '#b9ac93';// date line and hint, muted paper
  var AMBER = '#e8a33d';    // analogue synth amber
  var ICE = '#9fd4e8';      // piano ice blue
  var TEAL = '#1f7a6e';     // bass deep teal
  var TEAL_LT = '#2fa893';  // bass bars, brightened for the dark ground
  var COPPER = '#c47a4a';   // sax copper
  var CHAR = '#6e6e78';     // drums, muted charcoal pulses
  var CHAR_LT = '#9a9aa4';  // drum bars when locked
  var LIGHT = '#f7ead0';    // aligned bars of light when the band locks

  // The lyric. One invented line, immutable: tap never changes it.
  var LYRIC = 'the light you left is still learning how to stay';

  // Fixed-phase first frame: t = 23 s. Piano and sax are locked into
  // aligned bars of light, synth and bass are mid-arrangement, drums
  // are loose and pulsing. Frame one is byte-reproducible: every mark,
  // bar and pulse is a pure function of t and the take seed.
  var FIRST_T = 23;

  // Seeded PRNG. The default take is seeded 1921; each tap re-seeds
  // from 1921 + take * 7919, so every take is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Five instrumental agents. Period is the lock cycle in seconds,
  // phase is the lock offset; per take the phase is jittered a little
  // so the arrangement schedule shifts while the first-frame mix of
  // locked, mid and loose agents stays roughly as designed.
  var AGENTS = [
    { name: 'PIANO', color: ICE,    bar: ICE,    period: 20, phase: 0,    count: 24 },
    { name: 'SYNTH', color: AMBER,  bar: AMBER,  period: 26, phase: 1.0,  count: 30 },
    { name: 'BASS',  color: TEAL,   bar: TEAL_LT,period: 17, phase: -1.9, count: 18 },
    { name: 'SAX',   color: COPPER, bar: COPPER, period: 29, phase: 2.87, count: 22 },
    { name: 'DRUMS', color: CHAR,   bar: CHAR_LT,period: 13, phase: 0.7,  count: 16 }
  ];
  var COLS = 16; // shared grid the bars snap to when an agent locks

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var nowT = FIRST_T;
  var take = 0;

  // Per-take agent state: phases, mark positions, drift, sizes.
  // Rebuilt by reseedTake; the lyric is never touched here.
  var agentState = [];
  function reseedTake() {
    var rng = mulberry32(1921 + take * 7919);
    agentState = [];
    for (var i = 0; i < AGENTS.length; i++) {
      var a = AGENTS[i];
      var marks = [];
      var n = a.count + Math.floor(rng() * 9) - 4;
      for (var j = 0; j < n; j++) {
        marks.push({
          x0: 0.10 + rng() * 0.88,
          y0: 0.12 + rng() * 0.76,
          vx: (rng() - 0.5) * 0.008,
          bob: rng() * Math.PI * 2,
          r: 0.35 + rng() * 0.75,
          dash: rng() < 0.45
        });
      }
      var pulses = [];
      for (var k = 0; k < 3; k++) {
        pulses.push({ x: 0.14 + rng() * 0.8, y: 0.35 + rng() * 0.3 });
      }
      agentState.push({
        phase: a.phase + (rng() - 0.5) * 0.6,
        marks: marks,
        pulses: pulses,
        barCols: [
          Math.floor(rng() * COLS),
          Math.floor(rng() * COLS),
          Math.floor(rng() * COLS)
        ]
      });
    }
  }
  reseedTake();

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function wrap(v) { v = v % 1; return v < 0 ? v + 1 : v; }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Coherence of one agent at time t: 0 loose, 1 locked. Each agent
  // converges on the lyric's prosody on its own period and drifts away
  // again; the lyric is ten words, so the lock cycles run in whole
  // seconds near that count and never repeat together.
  function coherence(i, t) {
    var a = AGENTS[i];
    var s = Math.sin((Math.PI * 2 * t) / a.period + agentState[i].phase);
    return clamp((0.5 + 0.5 * s - 0.55) / 0.30, 0, 1);
  }

  function drawLyric() {
    var top = H * 0.20;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    var fs = clamp(W * 0.042, 15, 34);
    ctx.font = 'italic 600 ' + Math.round(fs) + 'px Georgia, "Times New Roman", serif';
    while (fs > 11 && ctx.measureText(LYRIC).width > W * 0.94) {
      fs -= 1;
      ctx.font = 'italic 600 ' + Math.round(fs) + 'px Georgia, "Times New Roman", serif';
    }
    ctx.fillStyle = PAPER;
    ctx.fillText(LYRIC, W / 2, top - Math.max(14, H * 0.028));
    // Hairline under the lyric: the line between the words and the band.
    ctx.strokeStyle = hexA(PAPER, 0.16);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W * 0.06, top);
    ctx.lineTo(W * 0.94, top);
    ctx.stroke();
    ctx.textAlign = 'left';
  }

  function drawAgent(i, t, fieldTop, laneH) {
    var a = AGENTS[i];
    var st = agentState[i];
    var lock = coherence(i, t);
    var laneTop = fieldTop + i * laneH;
    var laneBot = laneTop + laneH;

    // Faint tint of the agent's color across its lane.
    ctx.fillStyle = hexA(a.color, 0.045);
    ctx.fillRect(0, laneTop, W, laneH);

    // Lane label, small caps at the left edge.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = hexA(a.color, 0.6);
    ctx.font = '600 ' + Math.round(clamp(W * 0.02, 10, 13)) + 'px Helvetica, Arial, sans-serif';
    ctx.fillText(a.name, 14, laneTop + Math.max(14, laneH * 0.22));

    var baseR = Math.max(2, H * 0.004);
    for (var j = 0; j < st.marks.length; j++) {
      var m = st.marks[j];
      var x = wrap(m.x0 + m.vx * t);
      var gx = clamp(Math.round(x * (COLS - 1)) / (COLS - 1), 0.035, 0.965);
      var px = lerp(x, gx, lock) * W;
      var py = laneTop + m.y0 * laneH + Math.sin(t * 0.3 + m.bob) * laneH * 0.06;
      if (lock > 0.05) {
        // Locked: the mark snaps to the grid as a vertical bar of light.
        var bw = Math.max(2, W * 0.011);
        ctx.fillStyle = hexA(a.bar, a4(0.10 * lock));
        ctx.fillRect(px - bw * 1.8, laneTop + 2, bw * 3.6, laneH - 4);
        ctx.fillStyle = hexA(a.bar, a4(0.55 * lock));
        ctx.fillRect(px - bw / 2, laneTop + 2, bw, laneH - 4);
      }
      if (lock < 0.95) {
        // Loose: the mark drifts as a dot or a short dash.
        var ma = a4(0.55 * (1 - lock));
        ctx.fillStyle = hexA(a.color, ma);
        if (m.dash) {
          ctx.fillRect(px - baseR * 2.2 * m.r, py - baseR * 0.4, baseR * 4.4 * m.r, baseR * 0.8);
        } else {
          ctx.beginPath();
          ctx.moveTo(px + baseR * m.r, py);
          ctx.arc(px, py, baseR * m.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Drums: muted charcoal pulses on the beat, rings that bloom and
    // fade at fixed positions in the lane, on top of the drum marks.
    if (a.name === 'DRUMS') {
      var beat = (t * 1.2) % 1;
      for (var k = 0; k < st.pulses.length; k++) {
        var p = st.pulses[k];
        var cx = p.x * W;
        var cy = laneTop + p.y * laneH;
        var r = Math.max(1, beat * laneH * 0.30);
        var pa = a4(0.4 * (1 - beat));
        if (pa > 0.01) {
          ctx.strokeStyle = hexA(CHAR_LT, pa);
          ctx.lineWidth = Math.max(1, H * 0.002);
          ctx.beginPath();
          ctx.moveTo(cx + r, cy);
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.fillStyle = hexA(CHAR_LT, 0.7);
        ctx.beginPath();
        ctx.moveTo(cx + baseR * 0.8, cy);
        ctx.arc(cx, cy, baseR * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = PAPER;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Wordsmith\u2019s Band', 18, 30);
    ctx.fillStyle = PAPER_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('\u21161921 \u00b7 2007 \u00b7 04 \u00b7 16', 18, 30 + fs2 + 8);

    drawLyric();

    // The band's field: the lower four-fifths, one lane per agent.
    var fieldTop = H * 0.20;
    var fieldBot = H * 0.955;
    var laneH = (fieldBot - fieldTop) / AGENTS.length;
    var locked = 0;
    for (var i = 0; i < AGENTS.length; i++) {
      if (coherence(i, t) > 0.6) { locked++; }
      drawAgent(i, t, fieldTop, laneH);
    }

    // When the arrangement locks, aligned bars of light snap into
    // place across the whole field.
    if (locked >= 2) {
      var bw = Math.max(3, W * 0.008);
      for (var c = 0; c < 3; c++) {
        var col = agentState[0].barCols[c];
        var bx = ((col + 0.5) / COLS) * W;
        ctx.fillStyle = hexA(LIGHT, 0.13);
        ctx.fillRect(bx - bw / 2, fieldTop, bw, fieldBot - fieldTop);
      }
    }

    // Lane hairlines.
    ctx.strokeStyle = hexA(PAPER, 0.06);
    ctx.lineWidth = 1;
    for (var l = 1; l < AGENTS.length; l++) {
      var ly = fieldTop + l * laneH;
      ctx.beginPath();
      ctx.moveTo(0, ly);
      ctx.lineTo(W, ly);
      ctx.stroke();
    }

    // Hint, centered at the bottom.
    ctx.fillStyle = hexA(PAPER_DIM, 0.9);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Tap for a new take.', W / 2, H - 14);
    ctx.textAlign = 'left';
  }

  // TAP to start a new take: re-seed the five agents from scratch
  // around the same lyric. The lyric string is never touched.
  function newTake() {
    take++;
    reseedTake();
    draw(nowT);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      if (e && typeof e.preventDefault === 'function') { e.preventDefault(); }
      newTake();
    });
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Visual only, no audio. All motion runs under 1.2 Hz, well under the
  // 14 Hz ceiling. Tap only re-seeds the agents, never reloads.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      nowT = FIRST_T + (now - start) / 1000;
      draw(nowT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
