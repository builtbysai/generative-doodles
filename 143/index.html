<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Eleven Nine Segment</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101013; }
  canvas { display:block; touch-action:none; }
  .hint { position:fixed; left:0; right:0; bottom:14px; text-align:center;
    font:12px/1.4 monospace; color:#8b8e99; letter-spacing:0.08em; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">drag to turn the field</div>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// curated arrangements: (9,11) alternating, (7,9) paired clusters, (11,13) alternating
var SEEDS = [
  { pairs: [9, 11], pos: [[0, 0], [-0.56, -0.36], [0.58, -0.32], [-0.50, 0.42], [0.54, 0.44]], rad: [0.335, 0.30, 0.30, 0.285, 0.285] },
  { pairs: [7, 9],  pos: [[-0.30, -0.10], [0.34, -0.22], [-0.52, 0.34], [0.10, 0.30], [0.60, 0.30]], rad: [0.36, 0.315, 0.27, 0.30, 0.25] },
  { pairs: [11, 13], pos: [[0, 0.02], [-0.58, -0.34], [0.56, -0.38], [-0.48, 0.44], [0.52, 0.40]], rad: [0.325, 0.29, 0.29, 0.275, 0.275] }
];
var seedIdx = 0;
var rot = { x: 0.24, y: -0.30 };       // opens slightly turned, settles flat
var rotT = { x: 0, y: 0 };

function project(x, y, z) {
  var cx = Math.cos(rot.x), sx = Math.sin(rot.x), cy = Math.cos(rot.y), sy = Math.sin(rot.y);
  var y1 = y * cx - z * sx, z1 = y * sx + z * cx;
  var x2 = x * cy + z1 * sy, z2 = -x * sy + z1 * cy;
  return [x2, y1, z2];
}
function draw() {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#101013'; ctx.fillRect(0, 0, W, H);
  var S = Math.min(W, H);
  var cx0 = W / 2, cy0 = H / 2;
  var seed = SEEDS[seedIdx];
  var petals = [], shadows = [];
  for (var si = 0; si < seed.pos.length; si++) {
    var n = seed.pairs[si % 2];
    var R = seed.rad[si] * S;
    var rIn = R * Math.cos(2 * Math.PI / n) / Math.cos(Math.PI / n);
    var lift = R * 0.34;
    var baseRot = si * 0.73 + seedIdx * 0.9;
    var cc = project(seed.pos[si][0] * S, seed.pos[si][1] * S, lift * 0.18);
    var verts = [];
    for (var k = 0; k < 2 * n; k++) {
      var a = baseRot + k * Math.PI / n;
      var rr = (k % 2 === 0) ? R : rIn;
      var lx = Math.cos(a) * rr, ly = Math.sin(a) * rr;
      var z = (k % 2 === 0) ? ((k / 2) % 2 === 0 ? lift : lift * 0.08) : (((k - 1) / 2) % 2 === 0 ? lift * 0.62 : lift * 0.22);
      verts.push([seed.pos[si][0] * S + lx, seed.pos[si][1] * S + ly, z]);
    }
    for (var p = 0; p < 2 * n; p++) {
      var v1 = verts[p], v2 = verts[(p + 1) % (2 * n)];
      var c3 = [seed.pos[si][0] * S, seed.pos[si][1] * S, lift * 0.18];
      var P1 = project(v1[0], v1[1], v1[2]), P2 = project(v2[0], v2[1], v2[2]), PC = project(c3[0], c3[1], c3[2]);
      var depth = (P1[2] + P2[2] + PC[2]) / 3;
      var az = (v1[2] + v2[2]) / 2;
      // cast shadow: the petal flattened to the plane, shifted away from the light
      var F1 = project(v1[0], v1[1], 0), F2 = project(v2[0], v2[1], 0), FC = project(c3[0], c3[1], 0);
      var so = az * 0.22;
      shadows.push([[F1[0] + so * 0.55, F1[1] + so * 0.8], [F2[0] + so * 0.55, F2[1] + so * 0.8], [FC[0] + so * 0.55, FC[1] + so * 0.8]]);
      // folded-paper alternation: a petal hinged on a raised point catches
      // the light, a petal hinged on a flat point falls to the crease tone
      var oi = (p % 2 === 0) ? p : p + 1;
      var raised = ((oi / 2) % 2 === 0);
      var tone = (raised ? 0.06 : 0.82) + Math.abs(v1[2] - v2[2]) / lift * 0.12;
      petals.push({ pts: [[P1[0], P1[1]], [P2[0], P2[1]], [PC[0], PC[1]]], depth: depth, tone: Math.min(1, tone) });
    }
  }
  var i, j;
  ctx.fillStyle = 'rgba(110,123,147,0.45)';
  for (i = 0; i < shadows.length; i++) {
    ctx.beginPath();
    for (j = 0; j < 3; j++) {
      var q = shadows[i][j];
      if (j === 0) ctx.moveTo(cx0 + q[0], cy0 + q[1]); else ctx.lineTo(cx0 + q[0], cy0 + q[1]);
    }
    ctx.closePath(); ctx.fill();
  }
  petals.sort(function (a, b) { return a.depth - b.depth; });
  for (i = 0; i < petals.length; i++) {
    var pt = petals[i];
    var f = pt.tone;
    var r = Math.round(0xF5 + (0xDD - 0xF5) * f), g = Math.round(0xF2 + (0xD6 - 0xF2) * f), b = Math.round(0xEA + (0xC2 - 0xEA) * f);
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx.strokeStyle = '#DDD6C2'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (j = 0; j < 3; j++) {
      if (j === 0) ctx.moveTo(cx0 + pt.pts[j][0], cy0 + pt.pts[j][1]); else ctx.lineTo(cx0 + pt.pts[j][0], cy0 + pt.pts[j][1]);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
var drag = null, lastTap = { t: 0, x: 0, y: 0 };
canvas.addEventListener('pointerdown', function (e) {
  var now = Date.now();
  if (now - lastTap.t < 320 && Math.abs(e.clientX - lastTap.x) < 44 && Math.abs(e.clientY - lastTap.y) < 44) {
    seedIdx = (seedIdx + 1) % SEEDS.length;
    lastTap.t = 0; drag = null;
    return;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
  drag = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  rotT.y = Math.max(-0.65, Math.min(0.65, rotT.y + (e.clientX - drag.x) * 0.005));
  rotT.x = Math.max(-0.65, Math.min(0.65, rotT.x + (e.clientY - drag.y) * 0.005));
  drag = { x: e.clientX, y: e.clientY };
});
function endDrag() { drag = null; rotT.x = 0; rotT.y = 0; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

resize();
draw();
function frame() {
  rot.x += (rotT.x - rot.x) * 0.055;
  rot.y += (rotT.y - rot.y) * 0.055;
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
