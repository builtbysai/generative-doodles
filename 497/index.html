<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tricolor Panels</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var GREEN = '#47AE65';
  var PALE  = '#DCE8EE';
  var RED   = '#B93439';
  var SUIT  = '#517FB3';
  var NAVY  = '#3D5577';
  var PAPER = '#FFFFFF';
  var DASH  = '#B9C6D4';   // snow-dash: the halftone dot color on paper white
  var SKIN  = '#F8F5F0';

  var PHASE = 2.35;        // fixed pre-roll phase, seconds into the loop
  var LOOP  = 6.0;         // seamless loop length, seconds

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ------------------------------------------------------------------
  // Scene, built from a seed. One panel shape set per run (triangles,
  // diamonds, or circles, never mixed), three invented two-syllable
  // names, one jittered pose for the main racer.
  // ------------------------------------------------------------------
  var NAME_POOL = ['NILO', 'MARA', 'ELIO', 'SARA', 'TIMO', 'LARA', 'OTTO', 'RINA', 'IVO', 'NORA'];
  var SHAPES = ['triangles', 'diamonds', 'circles'];

  function buildScene(seed) {
    var rng = mulberry32(seed);
    var shapeSet = SHAPES[Math.floor(rng() * 3)];
    var pool = NAME_POOL.slice();
    var names = [];
    for (var i = 0; i < 3; i++) {
      names.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
    }
    var pose = {
      backKnee: 0.9 + rng() * 0.2,
      frontKnee: 0.9 + rng() * 0.2,
      armSwing: 0.9 + rng() * 0.2,
      lean: 0.95 + rng() * 0.1
    };
    return { shapeSet: shapeSet, names: names, pose: pose };
  }

  var seedIndex = 0;
  var scene = buildScene(497001);

  // Halftone dot grid for the main field, precomputed once with its own
  // stream so the field is identical for every scene seed.
  var dots = [];
  (function () {
    var rng = mulberry32(99173);
    var step = 0.030;
    for (var gy = step * 0.5; gy < 1; gy += step) {
      for (var gx = 0.315; gx < 1; gx += step) {
        dots.push({
          x: gx + (rng() - 0.5) * 0.012,
          y: gy + (rng() - 0.5) * 0.012,
          r: 0.0045 + rng() * 0.0035,
          a: 0.35 + rng() * 0.45
        });
      }
    }
  })();

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ------------------------------------------------------------------
  // Drawing helpers
  // ------------------------------------------------------------------
  function pathPoly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  // Tapered limb quad between two joints.
  function limb(x0, y0, x1, y1, w0, w1, color) {
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len, ny = dx / len;
    pathPoly([
      [x0 + nx * w0 / 2, y0 + ny * w0 / 2],
      [x1 + nx * w1 / 2, y1 + ny * w1 / 2],
      [x1 - nx * w1 / 2, y1 - ny * w1 / 2],
      [x0 - nx * w0 / 2, y0 - ny * w0 / 2]
    ]);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function circle(x, y, r, color) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  // Her face grammar in profile (the racer is a side view): skin disc,
  // flat hair block over the top, one arc eye, L-line nose. Local
  // frame: head center at origin, radius r, facing +x.
  function face(cx, cy, r) {
    circle(cx, cy, r, SKIN);
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI * 1.02, Math.PI * 1.98);
    ctx.arc(cx, cy - r * 0.34, r * 0.82, Math.PI * 1.99, Math.PI * 1.01, true);
    ctx.closePath();
    ctx.fillStyle = NAVY;
    ctx.fill();
    ctx.strokeStyle = NAVY;
    ctx.lineWidth = r * 0.10;
    ctx.lineCap = 'round';
    var er = r * 0.20;
    ctx.beginPath(); ctx.arc(cx + r * 0.28, cy + r * 0.02, er, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.52, cy + r * 0.10);
    ctx.lineTo(cx + r * 0.44, cy + r * 0.40);
    ctx.lineTo(cx + r * 0.58, cy + r * 0.43);
    ctx.stroke();
  }

  // ------------------------------------------------------------------
  // Panels
  // ------------------------------------------------------------------
  function panelPath(kind, bx, by, bw, bh) {
    if (kind === 'triangles') {
      pathPoly([[bx + bw / 2, by], [bx + bw, by + bh], [bx, by + bh]]);
    } else if (kind === 'diamonds') {
      pathPoly([[bx + bw / 2, by], [bx + bw, by + bh / 2], [bx + bw / 2, by + bh], [bx, by + bh / 2]]);
    } else {
      ctx.beginPath();
      ctx.arc(bx + bw / 2, by + bh / 2, Math.min(bw, bh) / 2, 0, Math.PI * 2);
    }
  }

  // Inner width of the shape at vertical fraction f of its box.
  function innerWidth(kind, bw, bh, f) {
    if (kind === 'triangles') return bw * f;
    if (kind === 'diamonds') return bw * (1 - Math.abs(2 * f - 1));
    var r = Math.min(bw, bh) / 2;
    var dy = (f - 0.5) * bh;
    return 2 * Math.sqrt(Math.max(0, r * r - dy * dy));
  }

  // Mini scene 1: running figure, line skeleton in white on the panel.
  function miniRunner(cx, cy, s) {
    ctx.strokeStyle = PAPER;
    ctx.lineWidth = s * 0.11;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    circle(cx + s * 0.30, cy - s * 0.42, s * 0.16, SKIN);
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.24, cy - s * 0.26);  // shoulder
    ctx.lineTo(cx + s * 0.05, cy + s * 0.05);  // hip
    ctx.lineTo(cx + s * 0.34, cy + s * 0.22);  // front knee
    ctx.lineTo(cx + s * 0.30, cy + s * 0.52);  // front foot
    ctx.moveTo(cx + s * 0.05, cy + s * 0.05);
    ctx.lineTo(cx - s * 0.26, cy + s * 0.20);  // back knee
    ctx.lineTo(cx - s * 0.44, cy + s * 0.44);  // back foot
    ctx.moveTo(cx + s * 0.24, cy - s * 0.26);
    ctx.lineTo(cx + s * 0.48, cy - s * 0.02);  // front arm
    ctx.moveTo(cx + s * 0.24, cy - s * 0.26);
    ctx.lineTo(cx - s * 0.10, cy - s * 0.06);  // back arm
    ctx.stroke();
  }

  // Mini scene 2: tricolor flag on a pole.
  function miniFlag(cx, cy, s) {
    ctx.strokeStyle = NAVY;
    ctx.lineWidth = s * 0.07;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.42, cy - s * 0.52);
    ctx.lineTo(cx - s * 0.42, cy + s * 0.52);
    ctx.stroke();
    var fx = cx - s * 0.42, fy = cy - s * 0.52, fw = s * 0.88, fh = s * 0.58;
    var bands = [GREEN, PAPER, RED];
    for (var i = 0; i < 3; i++) {
      var bx = fx + (fw / 3) * i;
      pathPoly([
        [bx, fy + Math.sin(i * 1.1) * s * 0.03],
        [bx + fw / 3, fy + Math.sin((i + 1) * 1.1) * s * 0.03],
        [bx + fw / 3, fy + fh + Math.sin((i + 1) * 1.1) * s * 0.03],
        [bx, fy + fh + Math.sin(i * 1.1) * s * 0.03]
      ]);
      ctx.fillStyle = bands[i];
      ctx.fill();
    }
    ctx.strokeStyle = NAVY;
    ctx.lineWidth = s * 0.035;
    ctx.strokeRect(fx, fy - s * 0.01, fw, fh + s * 0.02);
  }

  // Mini scene 3: medal on a ribbon.
  function miniMedal(cx, cy, s) {
    pathPoly([[cx - s * 0.30, cy - s * 0.55], [cx - s * 0.05, cy - s * 0.08], [cx - s * 0.22, cy - s * 0.08], [cx - s * 0.44, cy - s * 0.55]]);
    ctx.fillStyle = NAVY; ctx.fill();
    pathPoly([[cx + s * 0.30, cy - s * 0.55], [cx + s * 0.05, cy - s * 0.08], [cx + s * 0.22, cy - s * 0.08], [cx + s * 0.44, cy - s * 0.55]]);
    ctx.fillStyle = GREEN; ctx.fill();
    circle(cx, cy + s * 0.22, s * 0.30, PALE);
    ctx.strokeStyle = NAVY;
    ctx.lineWidth = s * 0.045;
    ctx.beginPath(); ctx.arc(cx, cy + s * 0.22, s * 0.185, 0, Math.PI * 2); ctx.stroke();
    // small star at the medal center
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var rr = (i % 2 === 0) ? s * 0.105 : s * 0.045;
      var px = cx + Math.cos(a) * rr, py = cy + s * 0.22 + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = NAVY;
    ctx.fill();
  }

  function strokeName(name, cx, baseY, S, kind, bw, f, color) {
    var size = S * 0.042;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round';
    var maxW = innerWidth(kind, bw, 1, f) * 0.92;
    function setFont(sz) { ctx.font = '700 ' + sz + 'px "Arial Narrow", Arial, sans-serif'; }
    setFont(size);
    var wdt = ctx.measureText(name).width;
    if (wdt > maxW && wdt > 0) { size = size * (maxW / wdt); setFont(size); }
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.1, 4 * S / 1080);
    ctx.strokeText(name, cx, baseY);
  }

  function drawPanel(i, ox, oy, S) {
    var fills = [GREEN, PALE, RED];
    var nameColors = [NAVY, NAVY, PALE];
    var thirdH = S / 3;
    var x0 = ox - 0.035 * S, x1 = ox + 0.30 * S;
    var bx = x0 + 0.015 * S, bw = (x1 - x0) - 0.03 * S;
    var by = oy + i * thirdH + 0.022 * S, bh = thirdH - 0.044 * S;
    var cx = bx + bw / 2;

    panelPath(scene.shapeSet, bx, by, bw, bh);
    ctx.fillStyle = fills[i];
    ctx.fill();

    ctx.save();
    panelPath(scene.shapeSet, bx, by, bw, bh);
    ctx.clip();
    var ms = bh * 0.30;
    var scy = by + bh * 0.40;
    if (i === 0) miniRunner(cx, scy, ms);
    else if (i === 1) miniFlag(cx, scy, ms);
    else miniMedal(cx, scy, ms);
    ctx.restore();

    var nf = 0.86;
    strokeName(scene.names[i], cx, by + bh * nf, S, scene.shapeSet, bw, nf, nameColors[i]);
  }

  // ------------------------------------------------------------------
  // Main figure: speed-skater racer in a blue suit, drawn in a local
  // frame whose +x axis is the direction of travel. The caller rotates
  // the frame to -45 degrees so the racer crosses bottom-left to
  // top-right.
  // ------------------------------------------------------------------
  function drawRacer(S) {
    var p = scene.pose;
    var hipX = 0, hipY = 0;
    var shX = 0.17 * p.lean, shY = -0.125;
    // back leg, extended behind
    limb(hipX, hipY, -0.155 * p.backKnee, 0.055, 0.052, 0.038, SUIT);
    limb(-0.155 * p.backKnee, 0.055, -0.295 * p.backKnee, 0.155, 0.038, 0.026, SUIT);
    // rear arm, tucked back
    limb(shX, shY, 0.06, -0.01, 0.034, 0.026, SUIT);
    limb(0.06, -0.01, -0.03, 0.045, 0.026, 0.02, SUIT);
    circle(-0.038, 0.050, 0.018, SKIN);
    // torso
    limb(hipX, hipY + 0.01, shX, shY, 0.105, 0.082, SUIT);
    // front leg, bent under the body
    limb(hipX, hipY, 0.125 * p.frontKnee, 0.095, 0.052, 0.038, SUIT);
    limb(0.125 * p.frontKnee, 0.095, 0.095, 0.215, 0.038, 0.026, SUIT);
    // front arm reaching down-forward
    limb(shX, shY, 0.235, -0.015 * p.armSwing, 0.034, 0.026, SUIT);
    limb(0.235, -0.015 * p.armSwing, 0.295, 0.075 * p.armSwing, 0.026, 0.02, SUIT);
    circle(0.305, 0.085 * p.armSwing, 0.021, SKIN);
    // skate blades
    ctx.strokeStyle = NAVY;
    ctx.lineWidth = 0.011;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-0.335 * p.backKnee, 0.175); ctx.lineTo(-0.245 * p.backKnee, 0.175);
    ctx.moveTo(0.055, 0.235); ctx.lineTo(0.145, 0.235);
    ctx.stroke();
    // head
    face(shX + 0.055, shY - 0.022, 0.046);
  }

  // ------------------------------------------------------------------
  // Frame
  // ------------------------------------------------------------------
  function draw(t) {
    if (!W || !H) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // Square composition, centered; it keeps its shape on phones.
    var S = Math.min(W, H);
    var ox = (W - S) / 2, oy = (H - S) / 2;
    var phase = ((t % LOOP) + LOOP) % LOOP / LOOP; // 0..1

    // Halftone dot field on the main ground only. Drawn first, under
    // the opaque panels and figure, so dots never land inside a panel
    // or on the racer. Alpha shimmers in a wave from bottom to top,
    // with a radial falloff toward the field edges.
    var fcx = ox + S * 0.66, fcy = oy + S * 0.5;
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      var dx = ox + d.x * S, dy = oy + d.y * S;
      var dist = Math.sqrt(Math.pow((dx - fcx) / (S * 0.52), 2) + Math.pow((dy - fcy) / (S * 0.52), 2));
      var fall = Math.max(0.12, Math.min(1, 1.18 - dist));
      var shimmer = 0.72 + 0.28 * Math.sin(phase * Math.PI * 2 - (1 - d.y) * 2.4);
      ctx.globalAlpha = d.a * fall * shimmer;
      circle(dx, dy, d.r * S, DASH);
    }
    ctx.globalAlpha = 1;

    // Panels down the left third, static.
    for (var pi = 0; pi < 3; pi++) drawPanel(pi, ox, oy, S);

    // Main racer on the slash, breathing in and out along it.
    var bob = Math.sin(phase * Math.PI * 2) * 0.018 * S;
    ctx.save();
    ctx.translate(ox + S * 0.635, oy + S * 0.52);
    ctx.rotate(-Math.PI / 4);
    ctx.translate(bob, 0);
    ctx.scale(S, S);
    drawRacer(S);
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // Run: synchronous first frame at the fixed phase; the rAF loop, when
  // available, is anchored as PHASE + elapsed. Double-tap reseeds.
  // ------------------------------------------------------------------
  resize();
  draw(PHASE);

  var startStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) startStamp = stamp;
      var elapsed = (stamp - startStamp) / 1000;
      draw(PHASE + elapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  var lastTap = -1e9;
  if (typeof window !== 'undefined' && canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (ev) {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
      if (now - lastTap < 350) {
        seedIndex++;
        scene = buildScene(497001 + seedIndex * 131);
        draw(PHASE);
      }
      lastTap = now;
    });
  }
})();
</script>
</body>
</html>
