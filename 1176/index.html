<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No-Media Pairing — №1176</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0C; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32 only) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function pmod(x, n) { return ((x % n) + n) % n; }

  // ---------- palette ----------
  var BG = '#0A0A0C';
  var PAPER = '#E8E8E8';
  var CONE = '#F5F0E6';
  var BLEND = '#B8FF2E';
  var VCOLORS = ['#FF2B6E', '#00FFC2', '#FFE14D', '#7C5CFF', '#FF8A00', '#4DD2FF'];
  var VNAMES = ['vex', 'oru', 'tala', 'mir', 'sol', 'une', 'kap', 'rin', 'azo', 'pel', 'wyn', 'oda'];

  // ---------- continuum constants ----------
  var MASTER = 1176001;
  var ROUND_LEN = 60;         // 60 s of piece time = a compressed 10 minutes
  var GAP_LEN = 2;            // black gap: the pair leaves no trace
  var CYCLE = ROUND_LEN + GAP_LEN;
  var T0 = 23;                // fixed first frame: round 0, rt = 23 s, countdown 6:10
  var NVOICES = 12;

  // voice v: glyph v, behavior v % 6, color VCOLORS[v % 6]
  var BEH_SPIKES = 0, BEH_BLOBS = 1, BEH_RINGS = 2, BEH_RAIN = 3, BEH_MESH = 4, BEH_ORBITS = 5;

  // ---------- round derivation: one seeded stream, hashed per round ----------
  // Any round is computable directly from its index, so the continuum never
  // loops (the stream effectively never repeats) yet frame one is fixed.
  var pairCache = [];
  function pairFor(r) {
    while (pairCache.length <= r) {
      var idx = pairCache.length;
      var rng = mulberry32((MASTER ^ Math.imul(idx + 1, 0x9E3779B9)) >>> 0);
      var a = -1, b = -1, prev = idx > 0 ? pairCache[idx - 1] : null;
      do {
        a = Math.floor(rng() * NVOICES);
        b = Math.floor(rng() * NVOICES);
        while (b === a) b = Math.floor(rng() * NVOICES);
      } while (prev && ((a === prev[0] && b === prev[1]) || (a === prev[1] && b === prev[0])));
      pairCache.push([a, b]);
    }
    return pairCache[r];
  }
  function roundParams(r) {
    var rng = mulberry32((0x51ED27 ^ Math.imul(r + 1, 0x85EBCA6B)) >>> 0);
    function P() {
      return {
        f1: 0.6 + rng() * 0.9,
        f2: 1.0 + rng() * 1.4,
        ph1: rng() * 6.2832,
        ph2: rng() * 6.2832,
        seed: Math.floor(rng() * 100000),
        spd: 0.75 + rng() * 0.5
      };
    }
    var pa = P(), pb = P();
    return { pa: pa, pb: pb, wAB: 0.45 + rng() * 0.55, wBA: 0.45 + rng() * 0.55 };
  }
  // instantaneous amplitude of a voice, analytic in round time
  function ampOf(P, t) {
    var s = 0.7 * Math.sin(t * P.f1 * 0.9 + P.ph1) + 0.3 * Math.sin(t * P.f2 * 2.3 + P.ph2);
    return clamp01(0.5 + 0.5 * s);
  }

  // ---------- canvas / view ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var lastT = T0;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 600;
  }
  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw || 9999, sh || 9999);
    if (mn < 700) return true;
    return H > W * 1.15;
  }
  function fit() {
    W = viewW(); H = viewH();
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---------- glyphs ----------
  function circlePath(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 6.2832);
  }
  function drawGlyph(type, x, y, r, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1.4, r * 0.14);
    var i, u, px, py;
    if (type === 0) {            // triangle
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r * 0.9, y + r * 0.75);
      ctx.lineTo(x - r * 0.9, y + r * 0.75);
      ctx.closePath();
      ctx.stroke();
    } else if (type === 1) {     // square
      ctx.strokeRect(x - r * 0.8, y - r * 0.8, r * 1.6, r * 1.6);
    } else if (type === 2) {     // wave
      ctx.beginPath();
      for (i = 0; i <= 8; i++) {
        u = -1 + i * 0.25;
        px = x + u * r;
        py = y + Math.sin(u * 3.1416) * r * 0.6;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    } else if (type === 3) {     // blob
      circlePath(x, y, r * 0.55); ctx.fill();
      circlePath(x - r * 0.45, y + r * 0.2, r * 0.38); ctx.fill();
      circlePath(x + r * 0.45, y + r * 0.15, r * 0.42); ctx.fill();
    } else if (type === 4) {     // ring
      circlePath(x, y, r * 0.8); ctx.stroke();
      circlePath(x, y, r * 0.22); ctx.fill();
    } else if (type === 5) {     // cross
      ctx.beginPath();
      ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
      ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
      ctx.stroke();
    } else if (type === 6) {     // bars
      var bw = r * 0.34, base = y + r * 0.75, hs = [0.9, 1.5, 1.1];
      for (i = 0; i < 3; i++) {
        ctx.fillRect(x + (i - 1) * bw * 1.45 - bw / 2, base - r * hs[i] * 0.62, bw, r * hs[i] * 0.62);
      }
    } else if (type === 7) {     // diamond
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r * 0.8, y);
      ctx.lineTo(x, y + r);
      ctx.lineTo(x - r * 0.8, y);
      ctx.closePath();
      ctx.stroke();
    } else if (type === 8) {     // spiral-arc
      ctx.beginPath();
      ctx.moveTo(x + r * 0.8 * Math.cos(0.5), y + r * 0.8 * Math.sin(0.5));
      ctx.arc(x, y, r * 0.8, 0.5, 5.6);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + r * 0.45 * Math.cos(2.6), y + r * 0.45 * Math.sin(2.6));
      ctx.arc(x, y, r * 0.45, 2.6, 7.4);
      ctx.stroke();
    } else if (type === 9) {     // dots
      for (i = 0; i < 3; i++) { circlePath(x + (i - 1) * r * 0.62, y, r * 0.2); ctx.fill(); }
    } else if (type === 10) {    // zigzag
      ctx.beginPath();
      ctx.moveTo(x - r, y + r * 0.3);
      ctx.lineTo(x - r * 0.35, y - r * 0.5);
      ctx.lineTo(x + r * 0.3, y + r * 0.4);
      ctx.lineTo(x + r, y - r * 0.4);
      ctx.stroke();
    } else {                     // crescent
      ctx.lineWidth = r * 0.42;
      ctx.beginPath();
      ctx.moveTo(x + r * 0.78 * Math.cos(-2.35), y + r * 0.78 * Math.sin(-2.35));
      ctx.arc(x, y, r * 0.78, -2.35, 1.15);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- center-stage behaviors ----------
  // Every behavior is a closed-form function of (round time, params, energy).
  // History is the same function evaluated at earlier times — never canvas fade.

  function behSpikes(cx, cy, R, t, P, e, color) {
    var k, i, ang, len, tx, ty;
    for (k = 2; k >= 0; k--) {
      var tt = t - k * 0.35;
      var al = (k === 0 ? 0.95 : k === 1 ? 0.34 : 0.17);
      ctx.save();
      ctx.globalAlpha = al;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (i = 0; i < 14; i++) {
        ang = (i / 14) * 6.2832 + P.ph1 * 0.3;
        len = R * (0.3 + 0.78 * e * Math.pow(0.5 + 0.5 * Math.sin(tt * P.f2 * 2.1 + i * 2.399 + P.seed % 17), 3));
        tx = cx + Math.cos(ang) * len;
        ty = cy + Math.sin(ang) * len;
        ctx.moveTo(cx + Math.cos(ang) * R * 0.1, cy + Math.sin(ang) * R * 0.1);
        ctx.lineTo(tx, ty);
      }
      ctx.stroke();
      // jagged eruption outline through the tips
      ctx.globalAlpha = al * 0.65;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (i = 0; i <= 14; i++) {
        var j = i % 14;
        ang = (j / 14) * 6.2832 + P.ph1 * 0.3;
        len = R * (0.3 + 0.78 * e * Math.pow(0.5 + 0.5 * Math.sin(tt * P.f2 * 2.1 + j * 2.399 + P.seed % 17), 3));
        tx = cx + Math.cos(ang) * len;
        ty = cy + Math.sin(ang) * len;
        if (i === 0) ctx.moveTo(tx, ty); else ctx.lineTo(tx, ty);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  function blobsAt(cx, cy, R, t, P, e, color, alphaScale) {
    var rng = mulberry32(P.seed * 7 + 13);
    var j, ba, rf, sf, ws, ang, rr, rad;
    ctx.save();
    ctx.fillStyle = color;
    for (j = 0; j < 7; j++) {
      ba = rng() * 6.2832;
      rf = 0.2 + rng() * 0.55;
      sf = 0.1 + rng() * 0.12;
      ws = (rng() - 0.5) * 0.9;
      ang = ba + t * ws * (0.5 + 0.6 * e) * P.spd;
      rr = R * rf * (0.8 + 0.25 * Math.sin(t * P.f1 + j * 1.7));
      rad = R * sf * (0.75 + 0.5 * Math.sin(t * P.f1 * 1.7 + j * 1.3 + P.ph2)) * (0.8 + 0.45 * e);
      ctx.globalAlpha = 0.5 * alphaScale;
      circlePath(cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr * 0.82, Math.max(1.5, rad));
      ctx.fill();
    }
    ctx.restore();
  }
  function behBlobs(cx, cy, R, t, P, e, color) {
    blobsAt(cx, cy, R, t - 0.45, P, e, color, 0.35);
    blobsAt(cx, cy, R, t, P, e, color, 1);
  }

  function behRings(cx, cy, R, t, P, e, color) {
    var k, ph, rad;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    for (k = 0; k < 3; k++) {
      ph = pmod(t * (0.22 + 0.2 * e) * P.spd + k / 3, 1);
      rad = (0.15 + 0.85 * ph) * R * (0.92 + 0.25 * e);
      ctx.globalAlpha = (1 - ph) * 0.85;
      circlePath(cx, cy, rad);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = color;
    circlePath(cx, cy, 3 + 2.2 * e);
    ctx.fill();
    ctx.restore();
  }

  function behRain(cx, cy, R, t, P, e, color) {
    var rng = mulberry32(P.seed * 3 + 29);
    var j, xj, zj, sj, y0, yy, len;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    for (j = 0; j < 24; j++) {
      xj = (rng() * 2 - 1) * R * 0.92;
      zj = 0.4 + rng() * 0.6;
      sj = 0.35 + rng() * 0.45;
      y0 = rng() * 2;
      yy = pmod(y0 + t * sj * (0.6 + 0.7 * e) * P.spd, 2) - 1;
      len = R * 0.16 * zj;
      ctx.globalAlpha = 0.25 + 0.55 * zj;
      ctx.beginPath();
      ctx.moveTo(cx + xj + len * 0.15, cy + yy * R);
      ctx.lineTo(cx + xj, cy + yy * R + len);
      ctx.stroke();
    }
    ctx.restore();
  }

  function behMesh(cx, cy, R, t, P, e, color) {
    var i, j, nx, ny, px, py;
    var pts = [];
    for (i = 0; i < 6; i++) {
      pts.push([]);
      for (j = 0; j < 6; j++) {
        nx = -1 + i * 0.4;
        ny = -1 + j * 0.4;
        px = cx + nx * R + Math.sin(ny * 2.2 + t * P.f1 * 1.4 + P.ph1) * R * 0.09 * (0.4 + e);
        py = cy + ny * R + Math.cos(nx * 2.0 - t * P.f2 * 1.1 + P.ph2) * R * 0.09 * (0.4 + e);
        pts[i].push([px, py]);
      }
    }
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (i = 0; i < 6; i++) {
      for (j = 0; j < 6; j++) {
        if (i < 5) { ctx.moveTo(pts[i][j][0], pts[i][j][1]); ctx.lineTo(pts[i + 1][j][0], pts[i + 1][j][1]); }
        if (j < 5) { ctx.moveTo(pts[i][j][0], pts[i][j][1]); ctx.lineTo(pts[i][j + 1][0], pts[i][j + 1][1]); }
      }
    }
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.9;
    for (i = 0; i < 6; i++) for (j = 0; j < 6; j++) { circlePath(pts[i][j][0], pts[i][j][1], 2); ctx.fill(); }
    ctx.restore();
  }

  function behOrbits(cx, cy, R, t, P, e, color) {
    var j, k, orad, w, ph, ang, ox, oy;
    var radii = [0.35, 0.6, 0.85], ws = [0.9, -0.65, 1.3];
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    for (j = 0; j < 3; j++) {
      orad = R * radii[j] * (0.9 + 0.2 * e);
      ctx.globalAlpha = 0.22;
      circlePath(cx, cy, orad);
      ctx.stroke();
      w = ws[j] * P.spd;
      ph = P.ph1 + j * 2.1;
      for (k = 7; k >= 0; k--) {
        ang = (t - k * 0.07) * w + ph;
        ox = cx + Math.cos(ang) * orad;
        oy = cy + Math.sin(ang) * orad;
        ctx.globalAlpha = k === 0 ? 0.95 : 0.5 * (1 - k / 8);
        ctx.fillStyle = color;
        circlePath(ox, oy, k === 0 ? 4.5 : 3.4 - k * 0.22);
        ctx.fill();
      }
    }
    ctx.fillStyle = PAPER;
    ctx.globalAlpha = 0.9;
    circlePath(cx, cy, 1.8);
    ctx.fill();
    ctx.restore();
  }

  var BEHAVIORS = [behSpikes, behBlobs, behRings, behRain, behMesh, behOrbits];

  // ---------- layout ----------
  function layout() {
    var phone = isPhone();
    var cdSize = Math.round(clamp(W * 0.045, 26, 46));
    return {
      phone: phone,
      R: Math.min(W, H) * (phone ? 0.165 : 0.16),
      homeAx: W * 0.31, homeBx: W * 0.69, homeY: H * 0.56,
      ringCx: W / 2, ringCy: H * 0.53,
      ringRx: W / 2 - (phone ? 30 : 40) - 6,
      ringRy: H * 0.40,
      glyphR: clamp(Math.min(W, H) * 0.02, 10, 15),
      cdSize: cdSize,
      cdY: cdSize + 16
    };
  }

  function fmtCountdown(remSeconds) {
    var ts = Math.max(0, Math.ceil(remSeconds));
    var m = Math.floor(ts / 60), s = ts % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ---------- draw ----------
  function draw(t) {
    lastT = t;
    var L = layout();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var round = Math.floor(t / CYCLE);
    var rt = t - round * CYCLE;
    var pair = pairFor(round);
    var inGap = rt >= ROUND_LEN;

    // ---- ring guide (faint ellipse as a segmented polyline) ----
    ctx.save();
    ctx.strokeStyle = PAPER;
    ctx.globalAlpha = inGap ? 0.04 : 0.07;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var s = 0; s <= 72; s++) {
      var ga = (s / 72) * 6.2832;
      var gx = L.ringCx + Math.cos(ga) * L.ringRx;
      var gy = L.ringCy + Math.sin(ga) * L.ringRy;
      if (s === 0) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
    }
    ctx.stroke();
    ctx.restore();

    if (!inGap) {
      var rp = roundParams(round);
      var P = rp.pa, Q = rp.pb;
      var aA = ampOf(P, rt), aB = ampOf(Q, rt);
      // cross-modulated energies: each voice's own amp bent by the other's
      var eA = clamp01(aA * 0.6 + aB * rp.wBA * 0.55);
      var eB = clamp01(aB * 0.6 + aA * rp.wAB * 0.55);
      var R = L.R;
      // cross-modulated centers: A's amplitude bends B's drift, and back
      var cAx = L.homeAx + (aB - 0.5) * rp.wBA * R * 0.5;
      var cAy = L.homeY + (0.5 - aB) * rp.wBA * R * 0.3;
      var cBx = L.homeBx + (aA - 0.5) * rp.wAB * R * 0.5;
      var cBy = L.homeY + (0.5 - aA) * rp.wAB * R * 0.3;
      var colA = VCOLORS[pair[0] % 6], colB = VCOLORS[pair[1] % 6];
      // stepped fade-in over the first 2 s of the round (4 alpha levels)
      var fade = rt < 0.5 ? 0.25 : rt < 1 ? 0.5 : rt < 1.5 ? 0.75 : 1;

      // ---- spotlights: flat cones from the top corners ----
      ctx.save();
      ctx.fillStyle = CONE;
      ctx.globalAlpha = 0.25 * fade;
      ctx.beginPath();
      ctx.moveTo(W * 0.05, -8);
      ctx.lineTo(cAx - R * 0.85, cAy + R * 0.6);
      ctx.lineTo(cAx + R * 0.85, cAy + R * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(W * 0.95, -8);
      ctx.lineTo(cBx - R * 0.85, cBy + R * 0.6);
      ctx.lineTo(cBx + R * 0.85, cBy + R * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // ---- cross-modulation tendrils ----
      var mx = (cAx + cBx) / 2, my = (cAy + cBy) / 2;
      var dx = cBx - cAx, dy = cBy - cAy;
      var dl = Math.sqrt(dx * dx + dy * dy) || 1;
      var pvx = -dy / dl, pvy = dx / dl;
      var talphas = [0.3, 0.45, 0.6, 0.75];
      ctx.save();
      ctx.strokeStyle = BLEND;
      ctx.lineWidth = 2;
      for (var i = 0; i < 4; i++) {
        var off = (i - 1.5) * R * 0.16;
        var bend = Math.sin(rt * (0.5 + 0.13 * i) + i * 1.93 + P.ph2) * R * 0.18
                 + (aA - aB) * R * 0.55 * ((i % 2) * 2 - 1);
        ctx.globalAlpha = talphas[i] * fade;
        ctx.beginPath();
        ctx.moveTo(cAx + pvx * off, cAy + pvy * off);
        ctx.quadraticCurveTo(mx + pvx * bend, my + pvy * bend, cBx + pvx * off, cBy + pvy * off);
        ctx.stroke();
      }
      ctx.restore();

      // ---- the two voices, improvising ----
      ctx.save();
      ctx.globalAlpha = fade;
      BEHAVIORS[pair[0] % 6](cAx, cAy, R, rt, P, eA, colA);
      drawGlyph(pair[0], cAx, cAy, R * 0.16, colA, 0.95);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = fade;
      BEHAVIORS[pair[1] % 6](cBx, cBy, R, rt, Q, eB, colB);
      drawGlyph(pair[1], cBx, cBy, R * 0.16, colB, 0.95);
      ctx.restore();
    }

    // ---- ring of 12 voices ----
    for (var v = 0; v < NVOICES; v++) {
      var th = ((v + 0.5) / NVOICES) * 6.2832 - Math.PI / 2;
      var rx = L.ringCx + Math.cos(th) * L.ringRx;
      var ry = L.ringCy + Math.sin(th) * L.ringRy;
      var active = !inGap && (v === pair[0] || v === pair[1]);
      var col = VCOLORS[v % 6];
      if (active) {
        ctx.save();
        ctx.strokeStyle = col;
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = 1.5;
        circlePath(rx, ry, L.glyphR + 5);
        ctx.stroke();
        ctx.restore();
      }
      var ga2 = inGap ? 0.45 : active ? 0.3 : 0.6;
      drawGlyph(v, rx, ry, L.glyphR, col, ga2 * (inGap ? 0.6 : 1));
      ctx.save();
      ctx.fillStyle = active ? col : PAPER;
      ctx.globalAlpha = active ? 0.9 : 0.45;
      if (inGap) ctx.globalAlpha = 0.27;
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(VNAMES[v], rx, ry + L.glyphR + 6);
      ctx.restore();
    }

    // ---- countdown: 10:00 compressed into the round ----
    ctx.save();
    ctx.fillStyle = PAPER;
    ctx.globalAlpha = inGap ? 0.55 : 0.92;
    ctx.font = '700 ' + L.cdSize + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    var label = inGap ? '0:00' : fmtCountdown((ROUND_LEN - rt) * 10);
    ctx.fillText(label, W / 2, L.cdY);
    ctx.restore();
  }

  // ---------- run ----------
  fit();
  draw(T0);

  var anchorStamp = null;
  function frame(stamp) {
    if (anchorStamp === null) anchorStamp = stamp;
    draw(T0 + (stamp - anchorStamp) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(lastT); });
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(function (stamp) {
      anchorStamp = stamp;
      frame(stamp);
    });
  }
})();
</script>
