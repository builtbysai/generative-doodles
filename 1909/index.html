<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1909 The Rollout</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2e8d5; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var PAPER = '#f2e8d5';      // warm paper, portrait cards and page ground
  var PAPER_LIGHT = '#fbf3e2'; // title cards, slightly lighter paper
  var PAPER_WARM = '#f6dfae';  // full warm light of the final movement
  var INK = '#1a1712';         // silhouettes in ink black
  var INK_SOFT = '#4a4238';    // muted ink for the date line
  var RED = '#a33327';         // hand-ink red for the title cards
  var RED_DIM = '#8a2f24';
  var RULE = '#8a7a5e';        // frame rule lines, warm brown

  // Fixed-phase first frame: t = 12 s. Phase 12 sits mid second movement
  // (sax, 8 to 16 s): the sax title card has dissolved, the sax portrait
  // stands full in the frame, and the drummer has already accreted as a
  // small silhouette along the frame's bottom edge. Frame one is
  // byte-reproducible: every portrait, card and pulse is a pure function
  // of t.
  var FIRST_T = 12;

  // Movement table, 40 s cycle, five movements of 8 s each.
  var CYCLE = 40;
  var MOV_LEN = 8;
  var NAMES = ['Batteria', 'Sassofono', 'Trombone', 'Chitarra', 'Il quartetto'];
  var ROMAN = ['I', 'II', 'III', 'IV', 'V'];
  var PHRASES = [
    "l'elemento propulsivo, nervoso, denso, viscerale",
    'il fiato che canta, lungo e caldo',
    'la voce che scivola, calda e lenta',
    'il tema che ritorna, chiaro e lieve'
  ];

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function hexLerp(h1, h2, t) {
    var r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
    var r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
    var r = Math.round(lerp(r1, r2, t)), g = Math.round(lerp(g1, g2, t)), b = Math.round(lerp(b1, b2, t));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Frame geometry: a slightly portrait frame, centered.
  function frameGeom() {
    var fw = Math.min(W * 0.86, H * 0.62);
    var fh = fw * 1.08;
    var fx = (W - fw) / 2;
    var fy = (H - fh) / 2 + H * 0.02;
    return { x: fx, y: fy, w: fw, h: fh, cx: W / 2, baseY: fy + fh * 0.72 };
  }

  // Movement state at time t: index 0..4, seconds into the movement,
  // and the dissolve factor for the arriving portrait (0..1).
  function movementAt(t) {
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    var idx = Math.floor(ph / MOV_LEN);
    if (idx > 4) { idx = 4; }
    var into = ph - idx * MOV_LEN;
    var fadeIn = clamp(into / 1.0, 0, 1);
    var fadeOut = idx < 4 ? clamp((MOV_LEN - 1.5 - into) / 1.5, 0, 1) : 1;
    return { idx: idx, into: into, alpha: fadeIn * fadeOut };
  }

  // Title-card state for a solo movement: shown for the first 3 s,
  // fading in over 0.5 s and out over the last 0.5 s.
  function cardAlpha(mv) {
    if (mv.idx >= 4) { return 0; }
    var a = clamp(mv.into / 0.5, 0, 1) * clamp((3.0 - mv.into) / 0.5, 0, 1);
    return a;
  }

  // ---- silhouettes ----
  // Each player is drawn at centre cx, baseline baseY (floor line), unit u.
  // Head, shoulders and instrument, all flat ink. alpha scales the whole
  // figure; every shape is a pure function of t.

  function drawHeadShoulders(cx, baseY, u, alpha) {
    ctx.fillStyle = hexA(INK, a4(alpha));
    // Head, sitting on the shoulders, not floating above them.
    ctx.beginPath(); ctx.moveTo(cx + 0.28 * u, baseY - 2.05 * u);
    ctx.arc(cx, baseY - 2.05 * u, 0.28 * u, 0, Math.PI * 2); ctx.fill();
    // Shoulders: a broad rounded shape.
    ctx.beginPath();
    ctx.moveTo(cx - 0.95 * u, baseY);
    ctx.lineTo(cx - 0.95 * u, baseY - 1.15 * u);
    ctx.quadraticCurveTo(cx - 0.9 * u, baseY - 1.75 * u, cx - 0.35 * u, baseY - 1.82 * u);
    ctx.lineTo(cx + 0.35 * u, baseY - 1.82 * u);
    ctx.quadraticCurveTo(cx + 0.9 * u, baseY - 1.75 * u, cx + 0.95 * u, baseY - 1.15 * u);
    ctx.lineTo(cx + 0.95 * u, baseY);
    ctx.closePath(); ctx.fill();
  }

  function drawDrums(cx, baseY, u, t, alpha, rings) {
    drawHeadShoulders(cx, baseY, u, alpha);
    var pulse = t - Math.floor(t); // 1 Hz pulse, the drummer's beat
    // Bass drum: ink disc with a paper centre.
    var bx = cx + 0.98 * u, by = baseY - 0.55 * u;
    ctx.fillStyle = hexA(INK, a4(alpha));
    ctx.beginPath(); ctx.moveTo(bx + 0.62 * u, by); ctx.arc(bx, by, 0.62 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hexA(PAPER, a4(alpha));
    ctx.beginPath(); ctx.moveTo(bx + 0.40 * u, by); ctx.arc(bx, by, 0.40 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hexA(INK, a4(alpha));
    ctx.beginPath(); ctx.moveTo(bx + 0.12 * u, by); ctx.arc(bx, by, 0.12 * u, 0, Math.PI * 2); ctx.fill();
    // Snare: an ellipse on the left.
    ctx.save();
    ctx.translate(cx - 0.95 * u, baseY - 0.72 * u);
    ctx.scale(1, 0.42);
    ctx.beginPath(); ctx.moveTo(0.42 * u, 0); ctx.arc(0, 0, 0.42 * u, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = hexA(PAPER, a4(alpha));
    ctx.save();
    ctx.translate(cx - 0.95 * u, baseY - 0.72 * u);
    ctx.scale(1, 0.42);
    ctx.beginPath(); ctx.moveTo(0.30 * u, 0); ctx.arc(0, 0, 0.30 * u, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // Drumsticks: two short lines from the hands to the drums.
    ctx.strokeStyle = hexA(INK, a4(alpha));
    ctx.lineWidth = Math.max(1.5, 0.06 * u);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx + 0.45 * u, baseY - 1.55 * u);
    ctx.lineTo(bx - 0.25 * u, by - 0.55 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 0.45 * u, baseY - 1.55 * u);
    ctx.lineTo(cx - 0.95 * u, baseY - 0.95 * u); ctx.stroke();
    // Pulse rings leaving the bass drum, one per beat. Suppressed in the
    // quartet, where four players share the frame and the rings would cross
    // the whole row.
    if (rings === false) { return; }
    for (var k = 0; k < 2; k++) {
      var age = pulse + k;
      if (age > 1.6) { continue; }
      var r = 0.62 * u + age * 1.1 * u;
      var a = alpha * 0.45 * Math.pow(1 - age / 1.6, 1.2);
      if (a <= 0.01) { continue; }
      ctx.strokeStyle = hexA(INK, a4(a));
      ctx.lineWidth = Math.max(1, 0.05 * u);
      ctx.beginPath(); ctx.moveTo(bx + r, by); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawSax(cx, baseY, u, t, alpha) {
    drawHeadShoulders(cx, baseY, u, alpha);
    // Saxophone body: a thick curved stroke that leaves the mouth and arcs
    // out to the player's right, clear of the shoulders, down to the bell.
    var mx = cx + 0.18 * u, my = baseY - 1.90 * u;
    var bx = cx + 1.05 * u, by = baseY - 0.30 * u;
    ctx.strokeStyle = hexA(INK, a4(alpha));
    ctx.lineWidth = 0.24 * u;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.bezierCurveTo(cx + 0.95 * u, baseY - 1.70 * u, cx + 1.30 * u, baseY - 0.95 * u, bx, by);
    ctx.stroke();
    // Bell: a flared cone at the end of the tube, opening downward.
    ctx.fillStyle = hexA(INK, a4(alpha));
    ctx.beginPath();
    ctx.moveTo(bx - 0.28 * u, by - 0.22 * u);
    ctx.lineTo(bx + 0.30 * u, by - 0.10 * u);
    ctx.lineTo(bx + 0.42 * u, by + 0.38 * u);
    ctx.lineTo(bx - 0.18 * u, by + 0.42 * u);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = hexA(PAPER, a4(alpha * 0.9));
    ctx.beginPath(); ctx.moveTo(bx + 0.28 * u, by + 0.32 * u);
    ctx.arc(bx + 0.14 * u, by + 0.22 * u, 0.12 * u, 0, Math.PI * 2); ctx.fill();
    // Keys: three small paper dots along the tube.
    var keys = [[0.92, -1.55], [1.12, -1.18], [1.18, -0.78]];
    for (var i = 0; i < keys.length; i++) {
      ctx.fillStyle = hexA(PAPER, a4(alpha * 0.85));
      ctx.beginPath(); ctx.moveTo(cx + keys[i][0] * u + 0.07 * u, baseY + keys[i][1] * u);
      ctx.arc(cx + keys[i][0] * u, baseY + keys[i][1] * u, 0.07 * u, 0, Math.PI * 2); ctx.fill();
    }
    // Breath: a slow wavy line leaving the bell, swaying with t.
    var sway = Math.sin(t * 1.6) * 0.12 * u;
    ctx.strokeStyle = hexA(INK, a4(alpha * 0.5));
    ctx.lineWidth = Math.max(1, 0.035 * u);
    ctx.beginPath();
    ctx.moveTo(bx + 0.30 * u, by + 0.38 * u);
    ctx.quadraticCurveTo(bx + 0.75 * u, by + 0.45 * u + sway, bx + 1.05 * u, by + 0.25 * u - sway);
    ctx.stroke();
  }

  function drawTrombone(cx, baseY, u, t, alpha) {
    drawHeadShoulders(cx, baseY, u, alpha);
    // Slide: two parallel tubes, the slide drifting slowly with t, and the
    // bell flaring at the far end, away from the player.
    var slide = 0.30 * u * Math.sin(t * 0.6);
    var y1 = baseY - 1.95 * u, y2 = baseY - 1.70 * u;
    var x0 = cx + 0.20 * u, x1 = cx + 1.90 * u + slide;
    ctx.strokeStyle = hexA(INK, a4(alpha));
    ctx.lineWidth = Math.max(1.5, 0.07 * u);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0, y2); ctx.lineTo(x1, y2); ctx.stroke();
    // Bell: a flared cone at the far end of the slide.
    ctx.fillStyle = hexA(INK, a4(alpha));
    ctx.beginPath();
    ctx.moveTo(x1, y1 - 0.12 * u);
    ctx.lineTo(x1 + 0.55 * u, y1 - 0.45 * u);
    ctx.lineTo(x1 + 0.55 * u, y2 + 0.45 * u);
    ctx.lineTo(x1, y2 + 0.12 * u);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = hexA(PAPER, a4(alpha * 0.9));
    ctx.beginPath(); ctx.moveTo(x1 + 0.55 * u + 0.10 * u, (y1 + y2) / 2);
    ctx.arc(x1 + 0.55 * u, (y1 + y2) / 2, 0.10 * u, 0, Math.PI * 2); ctx.fill();
    // Hand on the slide.
    ctx.fillStyle = hexA(INK, a4(alpha));
    ctx.beginPath(); ctx.moveTo(cx + 1.05 * u + slide + 0.10 * u, (y1 + y2) / 2);
    ctx.arc(cx + 1.05 * u + slide, (y1 + y2) / 2, 0.10 * u, 0, Math.PI * 2); ctx.fill();
  }

  function drawGuitar(cx, baseY, u, t, alpha) {
    drawHeadShoulders(cx, baseY, u, alpha);
    // Guitar body held out to the player's right, clear of the shoulders:
    // lower bout and upper bout, two ink discs.
    var bx = cx + 1.00 * u, by = baseY - 0.50 * u;
    ctx.fillStyle = hexA(INK, a4(alpha));
    ctx.beginPath(); ctx.moveTo(bx + 0.55 * u, by); ctx.arc(bx, by, 0.55 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx - 0.15 * u + 0.34 * u, by - 0.48 * u);
    ctx.arc(bx - 0.15 * u, by - 0.48 * u, 0.34 * u, 0, Math.PI * 2); ctx.fill();
    // Sound hole in paper.
    ctx.fillStyle = hexA(PAPER, a4(alpha * 0.9));
    ctx.beginPath(); ctx.moveTo(bx + 0.16 * u, by - 0.28 * u);
    ctx.arc(bx, by - 0.28 * u, 0.16 * u, 0, Math.PI * 2); ctx.fill();
    // Neck from the body up to the left shoulder, headstock at the end.
    ctx.strokeStyle = hexA(INK, a4(alpha));
    ctx.lineWidth = Math.max(2, 0.13 * u);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx - 0.28 * u, by - 0.62 * u);
    ctx.lineTo(cx - 0.55 * u, baseY - 1.85 * u); ctx.stroke();
    ctx.fillStyle = hexA(INK, a4(alpha));
    ctx.fillRect(cx - 0.72 * u, baseY - 2.02 * u, 0.22 * u, 0.34 * u);
    // Strings: two thin paper lines along the neck.
    ctx.strokeStyle = hexA(PAPER, a4(alpha * 0.7));
    ctx.lineWidth = Math.max(0.8, 0.02 * u);
    ctx.beginPath(); ctx.moveTo(bx - 0.25 * u, by - 0.57 * u);
    ctx.lineTo(cx - 0.52 * u, baseY - 1.80 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx - 0.19 * u, by - 0.49 * u);
    ctx.lineTo(cx - 0.46 * u, baseY - 1.72 * u); ctx.stroke();
    // Strumming hand: a small dot circling the sound hole, 1 Hz.
    var sa = t * Math.PI * 2;
    var hx = bx + Math.cos(sa) * 0.22 * u, hy = by - 0.28 * u + Math.sin(sa) * 0.22 * u;
    ctx.fillStyle = hexA(PAPER, a4(alpha * 0.9));
    ctx.beginPath(); ctx.moveTo(hx + 0.08 * u, hy); ctx.arc(hx, hy, 0.08 * u, 0, Math.PI * 2); ctx.fill();
  }

  var PLAYERS = [drawDrums, drawSax, drawTrombone, drawGuitar];

  // ---- hand-lettered card text ----
  // Each character is drawn with a small seeded jitter in position and
  // rotation, so the card reads as hand-lettered rather than typeset.
  function drawHandText(text, cx, y, fontPx, color, maxW, seedBase) {
    ctx.font = 'italic 600 ' + fontPx + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var words = text.split(' ');
    var lines = [], line = '';
    for (var w = 0; w < words.length; w++) {
      var trial = line ? line + ' ' + words[w] : words[w];
      if (ctx.measureText(trial).width > maxW && line) {
        lines.push(line); line = words[w];
      } else { line = trial; }
    }
    if (line) { lines.push(line); }
    var lineH = fontPx * 1.35;
    var totalH = lines.length * lineH;
    var y0 = y - totalH / 2 + lineH * 0.72;
    var ci = 0;
    for (var li = 0; li < lines.length; li++) {
      var lw = ctx.measureText(lines[li]).width;
      var x = cx - lw / 2;
      for (var ch = 0; ch < lines[li].length; ch++) {
        var chr = lines[li].charAt(ch);
        var jx = (hash(seedBase + ci * 3 + 1) - 0.5) * fontPx * 0.10;
        var jy = (hash(seedBase + ci * 3 + 2) - 0.5) * fontPx * 0.12;
        var jr = (hash(seedBase + ci * 3 + 3) - 0.5) * 0.07;
        ctx.save();
        ctx.translate(x + jx, y0 + li * lineH + jy);
        ctx.rotate(jr);
        ctx.fillText(chr, 0, 0);
        ctx.restore();
        x += ctx.measureText(chr).width;
        ci++;
      }
    }
    return lines.length;
  }

  function drawCard(f, mv, t) {
    var a = cardAlpha(mv);
    if (a <= 0.01) { return; }
    var cw = f.w * 0.86, ch = f.h * 0.26;
    var cx = f.cx, cy = f.y + f.h * 0.05 + ch / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.012);
    ctx.globalAlpha = a4(a);
    ctx.fillStyle = PAPER_LIGHT;
    ctx.fillRect(-cw / 2, -ch / 2, cw, ch);
    ctx.strokeStyle = RED;
    ctx.lineWidth = Math.max(1.2, f.w * 0.004);
    ctx.strokeRect(-cw / 2, -ch / 2, cw, ch);
    // Two faint rule lines, like a sketchbook page.
    ctx.strokeStyle = hexA(RED, 0.35);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-cw / 2 + 14, -ch / 2 + ch * 0.30); ctx.lineTo(cw / 2 - 14, -ch / 2 + ch * 0.30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-cw / 2 + 14, -ch / 2 + ch * 0.68); ctx.lineTo(cw / 2 - 14, -ch / 2 + ch * 0.68); ctx.stroke();
    // The character sketch, hand-lettered in red ink.
    var fontPx = Math.round(clamp(cw / 21, 13, 24));
    drawHandText(PHRASES[mv.idx], 0, 0, fontPx, RED, cw - 36, mv.idx * 97 + 11);
    ctx.restore();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Warm paper ground.
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    var f = frameGeom();
    var mv = movementAt(t);

    // Portrait frame: warm paper, deepening to full warm light in the
    // final movement when the whole band plays together.
    var warm = mv.idx === 4 ? clamp(mv.into / 2, 0, 1) : 0;
    ctx.fillStyle = hexLerp(PAPER, PAPER_WARM, warm);
    ctx.fillRect(f.x, f.y, f.w, f.h);
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.5, f.w * 0.006);
    ctx.strokeRect(f.x, f.y, f.w, f.h);
    ctx.strokeStyle = hexA(RULE, 0.8);
    ctx.lineWidth = 1;
    ctx.strokeRect(f.x + 5, f.y + 5, f.w - 10, f.h - 10);

    // Floor line inside the frame.
    ctx.strokeStyle = hexA(INK, 0.55);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(f.x + f.w * 0.08, f.baseY + 2); ctx.lineTo(f.x + f.w * 0.92, f.baseY + 2); ctx.stroke();

    var uSolo = f.h * 0.16;

    if (mv.idx < 4) {
      // The arriving portrait, large and centered.
      PLAYERS[mv.idx](f.cx, f.baseY, uSolo, t, mv.alpha);
      // Earlier members accrete as small silhouettes along the bottom edge.
      var uSmall = f.h * 0.055;
      var stripY = f.y + f.h - f.h * 0.10;
      for (var m = 0; m < mv.idx; m++) {
        var sx = f.x + f.w * (0.14 + m * 0.17);
        PLAYERS[m](sx, stripY, uSmall, t, 0.9);
      }
      // Title card announcing the arrival, on top of the portrait.
      drawCard(f, mv, t);
    } else {
      // Final movement: the full quartet together in warm light. Players
      // stagger front and back so the four silhouettes stay separate: drums
      // and trombone in front, sax and guitar a step back and slightly
      // smaller. The drummer's pulse rings are suppressed here, so they do
      // not cross the row.
      var u4 = f.h * 0.095;
      var xs = [0.14, 0.38, 0.62, 0.86];
      var front = [true, false, true, false];
      for (var p = 0; p < 4; p++) {
        var pu = front[p] ? u4 : u4 * 0.88;
        var pby = front[p] ? f.baseY : f.baseY - u4 * 0.35;
        if (p === 0) { drawDrums(f.x + f.w * xs[p], pby, pu, t, 1, false); }
        else { PLAYERS[p](f.x + f.w * xs[p], pby, pu, t, 1); }
      }
      // Baton-passing: a small red dot travels from player to player on a
      // 4 s cycle, with a thin red line trailing to the player it left.
      var batonPh = t - Math.floor(t / 4) * 4;
      var from = Math.floor(batonPh);
      var to = (from + 1) % 4;
      var frac = batonPh - from;
      var bx0 = f.x + f.w * xs[from], bx1 = f.x + f.w * xs[to];
      var byy = f.baseY - u4 * 2.55;
      var bxx = lerp(bx0, bx1, frac);
      ctx.strokeStyle = hexA(RED, 0.55);
      ctx.lineWidth = Math.max(1, 0.03 * u4);
      ctx.beginPath(); ctx.moveTo(bx0, byy); ctx.lineTo(bxx, byy); ctx.stroke();
      ctx.fillStyle = RED;
      ctx.beginPath(); ctx.moveTo(bxx + 0.09 * u4, byy);
      ctx.arc(bxx, byy, 0.09 * u4, 0, Math.PI * 2); ctx.fill();
    }

    // Movement label, small ink caps at the frame's bottom edge.
    var fsL = Math.round(clamp(f.w / 26, 11, 17));
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsL + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(ROMAN[mv.idx] + ' · ' + NAMES[mv.idx], f.cx, f.y + f.h - 12);
    ctx.textAlign = 'left';

    // Title plate, top-left. The frame sits low and centered, so the plate
    // clears it on desktop and phone alike.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Rollout', 18, 34);
    ctx.fillStyle = INK_SOFT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1909 · 2007 · 04 · 04', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(INK_SOFT, 0.9);
    ctx.textAlign = 'center';
    ctx.fillText('Watch the band arrive, one by one.', W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs near 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
