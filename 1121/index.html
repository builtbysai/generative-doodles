<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terravision</title>
<style>
  html, body { margin: 0; padding: 0; background: #020409; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seed = 1121;
  try {
    var m = /[?&]seed=(\d+)/.exec(location.search || '');
    if (m) seed = parseInt(m[1], 10);
  } catch (e) {}

  // ---------- palette ----------
  var SPACE = '#020409';
  var OCEAN_DEEP = [10, 42, 94];      // #0A2A5E
  var OCEAN_SHELF = [44, 98, 152];    // shallow water, a step up from the deep
  var LAND_LOW = [62, 107, 53];       // #3E6B35
  var LAND_HIGH = [201, 180, 138];    // #C9B48A
  var CITY = [255, 233, 184];         // #FFE9B8
  var RIM = [77, 163, 255];           // #4DA3FF

  function lerp(a, b, f) { return a + (b - a) * f; }
  function lerpCol(a, b, f) {
    return [Math.round(lerp(a[0], b[0], f)),
            Math.round(lerp(a[1], b[1], f)),
            Math.round(lerp(a[2], b[2], f))];
  }
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  // ---------- phone detection ----------
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var isPhone = Math.min(sw || 9999, sh || 9999) < 700;

  // ---------- stars: sparse, dim, static (own fixed seed, planet reseed never moves them) ----------
  var starRnd = mulberry32(777123);
  var STARS = [];
  for (var si = 0; si < 130; si++) {
    STARS.push({ x: starRnd(), y: starRnd(), r: 0.5 + starRnd() * 0.9, a: 0.18 + starRnd() * 0.45 });
  }

  // ---------- seeded 3D value noise (sampled on the sphere: no longitude seam) ----------
  function hash3(ix, iy, iz, salt) {
    var n = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) +
            Math.imul(iz, 1274126177) + Math.imul(salt, 974634211);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function noise3(x, y, z, salt) {
    var ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    var fx = x - ix, fy = y - iy, fz = z - iz;
    var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), uz = fz * fz * (3 - 2 * fz);
    var c000 = hash3(ix, iy, iz, salt),     c100 = hash3(ix + 1, iy, iz, salt);
    var c010 = hash3(ix, iy + 1, iz, salt), c110 = hash3(ix + 1, iy + 1, iz, salt);
    var c001 = hash3(ix, iy, iz + 1, salt),     c101 = hash3(ix + 1, iy, iz + 1, salt);
    var c011 = hash3(ix, iy + 1, iz + 1, salt), c111 = hash3(ix + 1, iy + 1, iz + 1, salt);
    return lerp(
      lerp(lerp(c000, c100, ux), lerp(c010, c110, ux), uy),
      lerp(lerp(c001, c101, ux), lerp(c011, c111, ux), uy), uz);
  }
  function fbm(x, y, z, salt, oct) {
    var sum = 0, amp = 0.5, tot = 0, f = 1;
    for (var o = 0; o < oct; o++) {
      sum += amp * noise3(x * f, y * f, z * f, salt + o * 31);
      tot += amp; amp *= 0.5; f *= 2.03;
    }
    return sum / tot;
  }

  // ---------- the planet: a lat/long cell grid over layered noise ----------
  var NLON = isPhone ? 72 : 92;
  var NLAT = isPhone ? 36 : 46;
  var SEA = 0.545;                 // continent threshold in the fbm field
  var cells = [];
  var cities = [];

  function buildPlanet() {
    var prnd = mulberry32(seed * 7919 + 101);
    var ox = (prnd() - 0.5) * 40, oy = (prnd() - 0.5) * 40, oz = (prnd() - 0.5) * 40;
    var ox2 = (prnd() - 0.5) * 40, oy2 = (prnd() - 0.5) * 40, oz2 = (prnd() - 0.5) * 40;
    var saltA = 1000 + Math.floor(prnd() * 8000);
    var saltB = 20000 + Math.floor(prnd() * 8000);
    cells = [];
    var i, j;
    for (j = 0; j < NLAT; j++) {
      var lat = -Math.PI / 2 + (j + 0.5) * Math.PI / NLAT;
      var cl = Math.cos(lat), sl = Math.sin(lat);
      for (i = 0; i < NLON; i++) {
        var lon = -Math.PI + (i + 0.5) * 2 * Math.PI / NLON;
        var x = cl * Math.cos(lon), y = sl, z = cl * Math.sin(lon);
        var c = fbm(x * 1.65 + ox, y * 1.65 + oy, z * 1.65 + oz, saltA, 5);
        var r = fbm(x * 2.9 + ox2, y * 2.9 + oy2, z * 2.9 + oz2, saltB, 4);
        var ridge = 1 - Math.abs(2 * r - 1); ridge = ridge * ridge;
        var land = c > SEA;
        var elev = 0, dep = 0;
        if (land) {
          elev = (c - SEA) / (1 - SEA);
          elev = clamp(elev * 0.72 + ridge * elev * 0.55, 0, 1);
        } else {
          dep = clamp((SEA - c) / SEA, 0, 1);
        }
        cells.push({ x: x, y: y, z: z, h: c, land: land, elev: elev, dep: dep,
                     mottle: 0.9 + 0.2 * r, gx: 0, gy: 0 });
      }
    }
    // relief gradients from neighbours in the grid
    for (j = 0; j < NLAT; j++) {
      for (i = 0; i < NLON; i++) {
        var idx = j * NLON + i;
        var hl = cells[j * NLON + ((i - 1 + NLON) % NLON)].h;
        var hr = cells[j * NLON + ((i + 1) % NLON)].h;
        var hd = cells[Math.max(0, j - 1) * NLON + i].h;
        var hu = cells[Math.min(NLAT - 1, j + 1) * NLON + i].h;
        cells[idx].gx = (hr - hl) * 6;
        cells[idx].gy = (hu - hd) * 6;
      }
    }
    // cities: seeded spots on low-to-mid land, spread around the globe
    cities = [];
    var stride = 37 + Math.floor(prnd() * 23);
    for (var k = stride; k < cells.length && cities.length < 30; k += stride) {
      var cell = cells[k];
      if (cell.land && cell.elev > 0.04 && cell.elev < 0.6) {
        cities.push({ cell: cell, rot: prnd() * Math.PI, sc: 0.8 + prnd() * 0.5 });
      }
    }
  }
  buildPlanet();

  // ---------- view state: one big physical ball ----------
  var TILT = 23.5 * Math.PI / 180;   // Earth's axial tilt, kept exact
  var IDLE_RATE = 0.021;             // rad/s, a very slow idle turn
  var LAM = 0.55;                    // momentum decay rate
  var az = 0.9, el = 0.0;            // current spin / elevation offset
  var spinV = 0, spinVE = 0;         // fling velocity, decays after release
  var zoom = 0, zoomTarget = 0;      // 0 orbit .. 1 relief .. 2 city grid
  var dragging = false;
  var dragId = null, dragX = 0, dragY = 0, dragAz = 0, dragEl = 0;
  var lastMX = 0, lastMY = 0, lastMT = 0, moveV = 0, moveVE = 0;
  var pointers = {};
  var pinchD = 0, pinchZoom = 0;

  // ---------- canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }
  function fit() {
    W = viewW(); H = viewH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // fixed light, upper left of the viewer
  var LX = -0.52, LY = 0.60, LZ = 0.61;

  function draw(t, dt) {
    fit();

    // --- advance the ball (interaction response only; frame one is fixed-phase) ---
    if (!dragging) {
      var decay = Math.exp(-LAM * dt);
      spinV *= decay; spinVE *= decay;
      az += (IDLE_RATE + spinV) * dt;
      el += spinVE * dt;
      el += (0 - el) * Math.min(1, dt * 0.4);   // elevation settles back to level
      el = clamp(el, -0.6, 0.6);
      zoom += (zoomTarget - zoom) * Math.min(1, dt * 3.2);
      if (Math.abs(zoomTarget - zoom) < 0.0005) zoom = zoomTarget;
    }

    ctx.fillStyle = SPACE;
    ctx.fillRect(0, 0, W, H);

    // stars
    ctx.fillStyle = '#FFFFFF';
    for (var si = 0; si < STARS.length; si++) {
      var st = STARS[si];
      ctx.globalAlpha = st.a;
      ctx.fillRect(st.x * W, st.y * H, st.r, st.r);
    }
    ctx.globalAlpha = 1;

    var cx = W / 2, cy = H / 2;
    var R = 0.40 * Math.min(W, H) * (1 + 0.30 * zoom);

    // rotation: spin about the polar axis, drag elevation, then the 23.5 degree tilt
    var caz = Math.cos(az), saz = Math.sin(az);
    var cel = Math.cos(el), sel = Math.sin(el);
    var cti = Math.cos(TILT), sti = Math.sin(TILT);

    function project(x, y, z) {
      var x1 = x * caz + z * saz;
      var z1 = -x * saz + z * caz;
      var y2 = y * cel - z1 * sel;
      var z2 = y * sel + z1 * cel;
      var x3 = x1 * cti - y2 * sti;
      var y3 = x1 * sti + y2 * cti;
      return { x: x3, y: y3, z: z2, sx: cx + x3 * R, sy: cy - y3 * R };
    }

    // limb disc so the cell gaps still read as ocean, never as space
    ctx.fillStyle = rgb(OCEAN_DEEP);
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();

    var reliefMix = smooth((zoom - 0.45) / 1.0);
    var cityMix = smooth((zoom - 1.25) / 0.7);
    var cellBase = 2 * Math.PI * R / NLON * 1.3;

    for (var ci = 0; ci < cells.length; ci++) {
      var c = cells[ci];
      var p = project(c.x, c.y, c.z);
      if (p.z <= 0.015) continue;
      var col;
      if (c.land) {
        col = lerpCol(LAND_LOW, LAND_HIGH, Math.pow(c.elev, 0.72));
      } else {
        col = lerpCol(OCEAN_SHELF, OCEAN_DEEP, Math.pow(c.dep, 0.65));
      }
      // mottle + fixed-light shading + limb falloff
      var diff = p.x * LX + p.y * LY + p.z * LZ;
      var bright = (0.50 + 0.50 * Math.max(0, diff)) * (0.72 + 0.28 * p.z) * c.mottle;
      // relief shading strengthens as the dive passes the middle layer
      if (reliefMix > 0) {
        bright *= 1 + reliefMix * clamp((-c.gx * 0.8 + c.gy * 0.55), -0.5, 0.5);
      }
      bright = clamp(bright, 0.12, 1.25);
      ctx.fillStyle = 'rgb(' + Math.min(255, Math.round(col[0] * bright)) + ',' +
                             Math.min(255, Math.round(col[1] * bright)) + ',' +
                             Math.min(255, Math.round(col[2] * bright)) + ')';
      var s = cellBase * (0.45 + 0.55 * p.z);
      ctx.fillRect(p.sx - s / 2, p.sy - s / 2, s, s);
    }

    // city grids fade in on the deepest layer: warm white street grids over land
    if (cityMix > 0.01) {
      ctx.strokeStyle = rgb(CITY);
      ctx.fillStyle = rgb(CITY);
      for (var ki = 0; ki < cities.length; ki++) {
        var cc = cities[ki].cell;
        var pp = project(cc.x, cc.y, cc.z);
        if (pp.z <= 0.05) continue;
        var gs = R * 0.052 * cities[ki].sc * (0.5 + zoom * 0.45);
        var cr = Math.cos(cities[ki].rot), sr = Math.sin(cities[ki].rot);
        ctx.globalAlpha = 0.8 * cityMix * pp.z;
        ctx.lineWidth = Math.max(0.6, R * 0.0016);
        ctx.beginPath();
        for (var g = -1; g <= 1; g++) {
          var off = g * gs * 0.38;
          // two families of streets, rotated with the city
          ctx.moveTo(pp.sx + (-gs * cr - off * sr), pp.sy + (-gs * sr + off * cr));
          ctx.lineTo(pp.sx + ( gs * cr - off * sr), pp.sy + ( gs * sr + off * cr));
          ctx.moveTo(pp.sx + (off * cr - -gs * sr), pp.sy + (off * sr + -gs * cr));
          ctx.lineTo(pp.sx + (off * cr -  gs * sr), pp.sy + (off * sr +  gs * cr));
        }
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(pp.sx, pp.sy, Math.max(0.7, R * 0.0022), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // atmosphere rim: concentric stroked circles, no gradients
    var rimSteps = [[1.5, 0.42], [4.5, 0.26], [8.5, 0.15], [14, 0.08]];
    ctx.strokeStyle = rgb(RIM);
    for (var ri = 0; ri < rimSteps.length; ri++) {
      ctx.globalAlpha = rimSteps[ri][1];
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(cx, cy, R + rimSteps[ri][0] * (R / 300), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // zoom-depth arc, the only UI: thin, no numbers
    var arcR = Math.max(11, Math.min(W, H) * 0.026);
    var arcX = W - arcR - 16, arcY = arcR + 16;
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath();
    ctx.arc(arcX, arcY, arcR, 0, Math.PI * 2);
    ctx.stroke();
    if (zoom > 0.004) {
      ctx.strokeStyle = rgb(RIM);
      ctx.beginPath();
      ctx.arc(arcX, arcY, arcR, -Math.PI / 2, -Math.PI / 2 + (zoom / 2) * Math.PI * 2);
      ctx.stroke();
    }
  }

  // ---------- interaction: drag = spin the ball, wheel/pinch = dive, double-tap = new planet ----------
  function evPos(e) {
    if (e && e.clientX != null) return { x: e.clientX, y: e.clientY, id: e.pointerId != null ? e.pointerId : 'm' };
    return null;
  }
  function reseed() {
    seed = (seed * 1103515245 + 12345) % 2147483647;
    if (seed <= 0) seed += 2147483646;
    buildPlanet();
  }

  var lastTap = 0;
  function onDown(e) {
    var p = evPos(e);
    if (!p) return;
    pointers[p.id] = p;
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (now && now - lastTap < 320 && Object.keys(pointers).length === 1) reseed();
    lastTap = now;
    if (Object.keys(pointers).length === 2) {
      var ks = Object.keys(pointers);
      var a = pointers[ks[0]], b = pointers[ks[1]];
      pinchD = Math.hypot(a.x - b.x, a.y - b.y);
      pinchZoom = zoomTarget;
      dragging = false;
      return;
    }
    dragging = true; dragId = p.id;
    dragX = lastMX = p.x; dragY = lastMY = p.y;
    dragAz = az; dragEl = el;
    moveV = 0; moveVE = 0; lastMT = lastT;
    spinV = 0; spinVE = 0;
  }
  function onMove(e) {
    var p = evPos(e);
    if (!p) return;
    if (pointers[p.id]) pointers[p.id] = p;
    if (Object.keys(pointers).length === 2) {
      var ks = Object.keys(pointers);
      var a = pointers[ks[0]], b = pointers[ks[1]];
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchD > 0) zoomTarget = clamp(pinchZoom + (d - pinchD) * 0.006, 0, 2);
      return;
    }
    if (!dragging || p.id !== dragId) return;
    az = dragAz + (p.x - dragX) * 0.0075;
    el = clamp(dragEl + (p.y - dragY) * 0.005, -0.6, 0.6);
    var dtm = Math.max(0.008, lastT - lastMT);
    moveV = (p.x - lastMX) * 0.0075 / dtm;
    moveVE = (p.y - lastMY) * 0.005 / dtm;
    lastMX = p.x; lastMY = p.y; lastMT = lastT;
  }
  function onUp(e) {
    var p = evPos(e);
    if (p && pointers[p.id]) delete pointers[p.id];
    if (dragging && (!p || p.id === dragId)) {
      dragging = false;
      spinV = clamp(moveV, -2.4, 2.4);    // the ball keeps the fling, then settles
      spinVE = clamp(moveVE, -1.2, 1.2);
    }
    if (Object.keys(pointers).length < 2) pinchD = 0;
  }
  function onWheel(e) {
    var d = (e && e.deltaY) || 0;
    zoomTarget = clamp(zoomTarget + d * 0.0022, 0, 2);
    if (e && e.preventDefault) e.preventDefault();
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('wheel', onWheel);
    canvas.addEventListener('dblclick', function () { reseed(); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT, 0); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT, 0); });
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  var lastT = 0;
  draw(0, 0);

  var startStamp = null, prevT = 0;
  function frame(stamp) {
    if (startStamp === null) { startStamp = stamp; prevT = 0; }
    var t = (stamp - startStamp) / 1000;
    var dt = Math.min(0.05, Math.max(0, t - prevT));
    prevT = t;
    lastT = t;
    draw(t, dt);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
