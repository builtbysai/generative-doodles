<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Stone Remembers</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #ece8dc; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1418000);
  function rr(a, b) { return a + rng() * (b - a); }
  function ri(a, b) { return Math.floor(rr(a, b + 1)); }
  // Round fading alphas to 4 decimals (node-canvas scientific-notation quirk).
  function a4(v) {
    if (v < 0) v = 0; if (v > 1) v = 1;
    return Math.round(v * 10000) / 10000;
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, phone = false;

  function isPhone() {
    var s = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (s && s.width && s.height) {
      return Math.min(s.width, s.height) < 700;
    }
    return H > W * 1.15;
  }
  function sizeCanvas() {
    var vw = W, vh = H;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      vw = visualViewport.width; vh = visualViewport.height;
    } else if (typeof window !== 'undefined') {
      vw = window.innerWidth; vh = window.innerHeight;
    }
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    phone = isPhone();
  }
  sizeCanvas();
  if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
    visualViewport.addEventListener('resize', sizeCanvas);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', sizeCanvas);
  }

  // ---- Static stone texture (precomputed, seeded) ----
  var speckles = [];
  for (var i = 0; i < 900; i++) {
    speckles.push({ u: rng(), v: rng(), s: rr(1, 3), tone: ri(0, 2), a: rr(0.05, 0.16) });
  }
  var blotches = [];
  for (var j = 0; j < 14; j++) {
    blotches.push({ u: rng(), v: rng(), ru: rr(0.08, 0.22), rv: rr(0.05, 0.14), tone: ri(0, 1), a: rr(0.04, 0.09) });
  }
  var strata = [];
  for (var k = 0; k < 6; k++) {
    strata.push({ v: rng(), h: rr(0.03, 0.10), tone: ri(0, 1), a: rr(0.05, 0.10) });
  }
  var cracks = [];
  for (var c = 0; c < 7; c++) {
    var pts = [];
    var px = rng(), py = rng();
    for (var s = 0; s < 7; s++) { pts.push([px, py]); px += rr(-0.12, 0.12); py += rr(0.02, 0.12); }
    cracks.push({ pts: pts, a: rr(0.15, 0.30), w: rr(1, 2) });
  }

  // ---- Mark buffer (the diary) ----
  // type: 0 notch (tap), 1 polish (hold), 2 smudge (drag)
  var marks = [];
  var MAX_MARKS = 900;
  function addMark(type, u, v, born) {
    marks.push({
      type: type, u: u, v: v, born: born,
      rot: rr(0, Math.PI * 2), r: type === 2 ? rr(8, 18) : rr(6, 14),
      seed: rng()
    });
    if (marks.length > MAX_MARKS) marks.splice(0, marks.length - MAX_MARKS);
  }
  function markAlpha(m, t) {
    var age = t - m.born;
    if (age < 60) return 1;
    var a = 1 - (age - 60) / 180;
    return a < 0.45 ? 0.45 : a;
  }

  // Ancient history: the stone already carries a diary at frame one.
  for (var a = 0; a < 48; a++) {
    addMark(ri(0, 2), rng(), rng(), -600 + a * 10);
  }

  // ---- Ghost touch schedule (seeded, closed-form) ----
  // Taps from the left: every 9 s from t = 6. Holds from the right: every 13 s from t = 14.
  var ghostPos = [];
  for (var g = 0; g < 64; g++) ghostPos.push([rng(), rng()]);
  function ghostIndex(k) { return ((k % 64) + 64) % 64; }
  function ghostEvent(k, isHold) {
    var t = isHold ? 14 + 13 * k : 6 + 9 * k;
    var p = ghostPos[ghostIndex(k)];
    // Taps cluster left, holds cluster right.
    var u = isHold ? 0.55 + p[0] * 0.40 : 0.05 + p[0] * 0.40;
    return { t: t, u: u, v: p[1], hold: isHold };
  }
  // Pre-seed ghost marks from the 150 s before frame one.
  for (var k = -20; k < 0; k++) {
    var et = ghostEvent(k, false);
    if (et.t >= -150) addMark(0, et.u, et.v, et.t);
    var eh = ghostEvent(k, true);
    if (eh.t >= -150) addMark(1, eh.u, eh.v, eh.t);
  }
  var firedTap = -1, firedHold = -1;
  var glows = []; // {u, v, t0}
  function fireGhosts(t) {
    var k = Math.floor((t - 6) / 9);
    while (firedTap < k) {
      firedTap++;
      if (firedTap >= 0) {
        var e = ghostEvent(firedTap, false);
        addMark(0, e.u, e.v, e.t);
        glows.push({ u: e.u, v: e.v, t0: e.t });
      }
    }
    var h = Math.floor((t - 14) / 13);
    while (firedHold < h) {
      firedHold++;
      if (firedHold >= 0) {
        var e2 = ghostEvent(firedHold, true);
        addMark(1, e2.u, e2.v, e2.t);
        glows.push({ u: e2.u, v: e2.v, t0: e2.t });
      }
    }
  }

  // ---- Visitor touches: drag smudges, tap notches, hold polishes ----
  var down = null; // {u, v, t, moved, lastU, lastV}
  function evPos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }
  function onDown(e) {
    if (e.preventDefault) e.preventDefault();
    var p = evPos(e);
    down = { u: p.x / W, v: p.y / H, t: clockT, moved: 0, lastU: p.x / W, lastV: p.y / H };
    glows.push({ u: down.u, v: down.v, t0: clockT });
  }
  function onMove(e) {
    if (!down) return;
    if (e.preventDefault) e.preventDefault();
    var p = evPos(e);
    var u = p.x / W, v = p.y / H;
    var dx = (u - down.lastU) * W, dy = (v - down.lastV) * H;
    var d = Math.sqrt(dx * dx + dy * dy);
    down.moved = Math.max(down.moved, Math.sqrt(Math.pow((u - down.u) * W, 2) + Math.pow((v - down.v) * H, 2)));
    if (d > 12) {
      addMark(2, (u + down.lastU) / 2, (v + down.lastV) / 2, clockT);
      down.lastU = u; down.lastV = v;
    }
  }
  function onUp(e) {
    if (!down) return;
    if (e.preventDefault) e.preventDefault();
    var dt = clockT - down.t;
    if (down.moved < 14) {
      if (dt < 0.35) addMark(0, down.u, down.v, clockT);
      else if (dt > 0.6) addMark(1, down.u, down.v, clockT);
    }
    down = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---- Draw ----
  function draw(t) {
    sizeCanvas();
    ctx.fillStyle = '#8a8578';
    ctx.fillRect(0, 0, W, H);
    // Strata bands.
    for (var i = 0; i < strata.length; i++) {
      var st = strata[i];
      ctx.fillStyle = st.tone === 0 ? 'rgba(74,70,60,' + a4(st.a) + ')' : 'rgba(214,209,192,' + a4(st.a) + ')';
      ctx.fillRect(0, st.v * H, W, st.h * H);
    }
    // Tonal blotches.
    for (var j = 0; j < blotches.length; j++) {
      var b = blotches[j];
      ctx.fillStyle = b.tone === 0 ? 'rgba(74,70,60,' + a4(b.a) + ')' : 'rgba(214,209,192,' + a4(b.a) + ')';
      ctx.beginPath();
      ctx.ellipse(b.u * W, b.v * H, b.ru * W, b.rv * H, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // Speckle grain (filled rects, never batched arcs).
    for (var s = 0; s < speckles.length; s++) {
      var sp = speckles[s];
      if (sp.tone === 0) ctx.fillStyle = 'rgba(74,70,60,' + a4(sp.a) + ')';
      else if (sp.tone === 1) ctx.fillStyle = 'rgba(214,209,192,' + a4(sp.a) + ')';
      else ctx.fillStyle = 'rgba(106,101,88,' + a4(sp.a) + ')';
      ctx.fillRect(sp.u * W, sp.v * H, sp.s, sp.s);
    }
    // Cracks.
    for (var c = 0; c < cracks.length; c++) {
      var cr = cracks[c];
      ctx.strokeStyle = 'rgba(74,70,60,' + a4(cr.a) + ')';
      ctx.lineWidth = cr.w;
      ctx.beginPath();
      ctx.moveTo(cr.pts[0][0] * W, cr.pts[0][1] * H);
      for (var p = 1; p < cr.pts.length; p++) ctx.lineTo(cr.pts[p][0] * W, cr.pts[p][1] * H);
      ctx.stroke();
    }
    // The diary: marks in order, oldest first, so newer overlay older.
    for (var m = 0; m < marks.length; m++) {
      var mk = marks[m];
      var al = markAlpha(mk, t);
      var x = mk.u * W, y = mk.v * H;
      if (mk.type === 0) {
        // Notch: dark wedge.
        var c1 = Math.cos(mk.rot), s1 = Math.sin(mk.rot);
        ctx.fillStyle = 'rgba(74,70,60,' + a4(0.85 * al) + ')';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + c1 * mk.r, y + s1 * mk.r);
        ctx.lineTo(x + c1 * mk.r * 0.4 - s1 * mk.r * 0.5, y + s1 * mk.r * 0.4 + c1 * mk.r * 0.5);
        ctx.closePath();
        ctx.fill();
      } else if (mk.type === 1) {
        // Polish: pale ellipse, own beginPath.
        ctx.fillStyle = 'rgba(214,209,192,' + a4(0.55 * al) + ')';
        ctx.beginPath();
        ctx.ellipse(x, y, mk.r, mk.r * 0.62, mk.rot, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Smudge: cluster of flat-alpha circles, each its own beginPath.
        for (var q = 0; q < 5; q++) {
          var ox = Math.cos(mk.rot + q * 1.3) * mk.r * 0.45;
          var oy = Math.sin(mk.rot + q * 1.3) * mk.r * 0.45;
          ctx.fillStyle = 'rgba(106,101,88,' + a4(0.16 * al) + ')';
          ctx.beginPath();
          ctx.arc(x + ox, y + oy, mk.r * (0.45 + 0.1 * q), 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    // Touch glows: faint red, only at the moment of touch.
    for (var gi = 0; gi < glows.length; gi++) {
      var gl = glows[gi];
      var ga = 1 - (t - gl.t0) / 1.5;
      if (ga <= 0) continue;
      ctx.fillStyle = 'rgba(200,53,42,' + a4(0.20 * ga) + ')';
      ctx.beginPath();
      ctx.arc(gl.u * W, gl.v * H, 26, 0, Math.PI * 2);
      ctx.fill();
    }
    // Held pointer glows while held.
    if (down && t - down.t > 0.3) {
      var ha = 0.12 + 0.08 * Math.min(1, (t - down.t) / 0.6);
      ctx.fillStyle = 'rgba(200,53,42,' + a4(ha) + ')';
      ctx.beginPath();
      ctx.arc(down.u * W, down.v * H, 30, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Clock: frame one = draw(0), clock starts with the rAF loop ----
  var clockT = 0;
  var booted = false;
  draw(0);
  function loop(ts) {
    if (!booted) { booted = true; loop.t0 = ts; }
    clockT = (ts - loop.t0) / 1000;
    fireGhosts(clockT);
    draw(clockT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
