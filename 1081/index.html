<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Time Continuums</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1E1428;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');

  var TINT_NOW = '#16202E';   // left timeline field
  var TINT_AGO = '#1E1428';   // right timeline field (also the page ground)
  var GRAY = '#8B93A3';       // scene gray: strata, seams, shadows
  var FIGURE = '#D7DCE6';     // figure silhouettes
  var FRAME = '#E8E8E6';      // portal frame, the only bright object
  var WALL = '#0B0D13';       // the wall-barrier band

  var LOOP = 45;              // seamless loop, seconds
  var DELAY = 6;              // the right side runs this far behind
  var PHASE0 = 24;            // fixed first-frame phase: divider near center, a figure stands in the portal
  var TAU = Math.PI * 2;

  var W = 0;
  var H = 0;
  var DPR = 1;
  var isPhone = false;

  var startStamp = 0;
  if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') {
    startStamp = performance.now();
  }

  function clamp(v, a, b) {
    return v < a ? a : (v > b ? b : v);
  }

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- the shared scene: performer silhouettes adrift over a dark field ----
  // Every position is a closed-form sum of sines whose periods divide the
  // 45 s loop, so sceneAt(t) and sceneAt(t - 6) are the same world at two
  // phases and the whole piece loops seamlessly. Nothing is integrated.
  var figures = [];

  function makeFigures() {
    var rand = mulberry32(10810242);
    figures = [];
    var i;
    for (i = 0; i < 10; i++) {
      var depth = rand();                       // 0 far, 1 near
      figures.push({
        bx: 0.07 + rand() * 0.86,               // base x, stage fraction
        by: 0.40 + rand() * 0.38,               // foot line, stage fraction
        s: 0.55 + depth * 0.65,                 // scale
        a: 0.45 + depth * 0.40,                 // alpha by depth
        ax: 0.012 + rand() * 0.026,             // drift amplitude, x
        ay: 0.004 + rand() * 0.008,             // drift amplitude, y
        k1: 1 + Math.floor(rand() * 2),         // loop harmonics
        k2: 1 + Math.floor(rand() * 3),
        p1: rand() * TAU,
        p2: rand() * TAU,
        sway: 0.5 + rand() * 0.8,               // body sway rate factor
        stride: 0.7 + rand() * 0.7              // leg swing rate factor
      });
    }
    // draw far figures first
    figures.sort(function (a, b) { return a.s - b.s; });
  }

  function figurePose(f, t) {
    var w = TAU / LOOP;
    var x = f.bx + f.ax * Math.sin(w * f.k1 * t + f.p1)
                  + f.ax * 0.4 * Math.sin(w * f.k2 * t + f.p2);
    var y = f.by + f.ay * Math.sin(w * f.k2 * t + f.p2 * 1.7);
    var lean = 0.05 * Math.sin(w * 2 * f.sway * t + f.p1);
    var swing = Math.sin(w * 3 * f.stride * t + f.p2);
    return { x: x, y: y, lean: lean, swing: swing };
  }

  function drawFigure(g, f, pose) {
    var S = g.S;
    var h = 0.17 * S * f.s;                     // figure height
    var x = g.ox + pose.x * S;
    var yBase = g.oy + pose.y * S;
    var hipY = yBase - h * 0.46;
    var shoulderY = yBase - h * 0.76;
    var cx = x + pose.lean * h * 0.4;           // torso leans with the sway

    ctx.save();
    ctx.globalAlpha = f.a;

    // floor shadow
    ctx.fillStyle = GRAY;
    ctx.globalAlpha = f.a * 0.16;
    ctx.beginPath();
    ctx.ellipse(x, yBase, h * 0.20, h * 0.035, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = f.a;

    ctx.fillStyle = FIGURE;
    ctx.strokeStyle = FIGURE;
    ctx.lineCap = 'round';

    // legs: two strokes swinging against each other
    var legW = h * 0.075;
    var step = pose.swing * h * 0.13;
    ctx.lineWidth = legW;
    ctx.beginPath();
    ctx.moveTo(cx, hipY);
    ctx.lineTo(x + step, yBase);
    ctx.moveTo(cx, hipY);
    ctx.lineTo(x - step, yBase);
    ctx.stroke();

    // torso: a tapered capsule from hips to shoulders
    ctx.lineWidth = h * 0.20;
    ctx.beginPath();
    ctx.moveTo(cx, hipY);
    ctx.lineTo(cx + pose.lean * h * 0.5, shoulderY);
    ctx.stroke();

    // arms: one stroke each, hanging with a slight counter-swing
    ctx.lineWidth = h * 0.055;
    var armSwing = pose.swing * h * 0.07;
    ctx.beginPath();
    ctx.moveTo(cx + pose.lean * h * 0.5, shoulderY + h * 0.03);
    ctx.lineTo(cx - h * 0.16 - armSwing, hipY + h * 0.10);
    ctx.moveTo(cx + pose.lean * h * 0.5, shoulderY + h * 0.03);
    ctx.lineTo(cx + h * 0.16 - armSwing, hipY + h * 0.10);
    ctx.stroke();

    // head
    ctx.beginPath();
    ctx.arc(cx + pose.lean * h * 0.62, shoulderY - h * 0.13, h * 0.095, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  // The room itself: faint strata that are identical in both timelines, so
  // only the figures betray the six seconds between the halves.
  function drawRoom(g) {
    var S = g.S;
    ctx.save();
    ctx.strokeStyle = GRAY;
    ctx.lineWidth = Math.max(1, S * 0.0012);
    var ys = [0.30, 0.55, 0.82];
    var i;
    for (i = 0; i < ys.length; i++) {
      ctx.globalAlpha = 0.10;
      ctx.beginPath();
      ctx.moveTo(g.ox, g.oy + ys[i] * S);
      ctx.lineTo(g.ox + S, g.oy + ys[i] * S);
      ctx.stroke();
    }
    // a low floor band, flat alpha
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = GRAY;
    ctx.fillRect(g.ox, g.oy + 0.82 * S, S, 0.18 * S);
    ctx.restore();
  }

  function drawScene(g, t) {
    drawRoom(g);
    var i;
    for (i = 0; i < figures.length; i++) {
      drawFigure(g, figures[i], figurePose(figures[i], t));
    }
  }

  function clipRect(x, y, w, h) {
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
  }

  function drawAt(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // page ground: the darker tint
    ctx.fillStyle = TINT_AGO;
    ctx.fillRect(0, 0, W, H);

    var S = Math.min(W, H);
    var g = { S: S, ox: (W - S) / 2, oy: (H - S) / 2 };

    var divX = g.ox + S * (0.5 + 0.15 * Math.sin(TAU * t / LOOP));
    var bandW = S * 0.16;
    var bandX = divX - bandW / 2;
    var portalW = S * 0.105;
    var portalH = portalW * 1.4;
    var portalX = divX - portalW / 2;
    var portalY = g.oy + (S - portalH) / 2;

    // left timeline: now
    ctx.save();
    clipRect(g.ox, g.oy, divX - g.ox, S);
    ctx.fillStyle = TINT_NOW;
    ctx.fillRect(g.ox, g.oy, S, S);
    drawScene(g, t);
    ctx.restore();

    // right timeline: six seconds ago
    ctx.save();
    clipRect(divX, g.oy, g.ox + S - divX, S);
    ctx.fillStyle = TINT_AGO;
    ctx.fillRect(g.ox, g.oy, S, S);
    drawScene(g, t - DELAY);
    ctx.restore();

    // through the portal, each side sees the other timeline
    ctx.save();
    clipRect(portalX, portalY, divX - portalX, portalH);
    ctx.fillStyle = TINT_AGO;
    ctx.fillRect(portalX, portalY, portalW, portalH);
    drawScene(g, t - DELAY);
    ctx.restore();

    ctx.save();
    clipRect(divX, portalY, portalX + portalW - divX, portalH);
    ctx.fillStyle = TINT_NOW;
    ctx.fillRect(portalX, portalY, portalW, portalH);
    drawScene(g, t);
    ctx.restore();

    // the wall-barrier: a solid band with the portal cut through it
    ctx.fillStyle = WALL;
    ctx.fillRect(bandX, g.oy, bandW, portalY - g.oy);                       // above the portal
    ctx.fillRect(bandX, portalY + portalH, bandW, g.oy + S - portalY - portalH); // below
    ctx.fillRect(bandX, portalY, portalX - bandX, portalH);                 // left sliver
    ctx.fillRect(portalX + portalW, portalY, bandX + bandW - portalX - portalW, portalH); // right sliver

    // barrier seams and edges, kept dim: the frame is the only bright object
    ctx.save();
    ctx.strokeStyle = GRAY;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = Math.max(1, S * 0.0015);
    ctx.beginPath();
    ctx.moveTo(bandX, g.oy);
    ctx.lineTo(bandX, g.oy + S);
    ctx.moveTo(bandX + bandW, g.oy);
    ctx.lineTo(bandX + bandW, g.oy + S);
    ctx.stroke();
    ctx.globalAlpha = 0.16;
    ctx.beginPath();
    ctx.moveTo(bandX + bandW * 0.22, g.oy);
    ctx.lineTo(bandX + bandW * 0.22, g.oy + S);
    ctx.moveTo(bandX + bandW * 0.78, g.oy);
    ctx.lineTo(bandX + bandW * 0.78, g.oy + S);
    ctx.stroke();
    ctx.restore();

    // the portal frame: one hard light-gray rectangle
    ctx.strokeStyle = FRAME;
    ctx.lineWidth = Math.max(2, S * 0.0045);
    ctx.strokeRect(portalX, portalY, portalW, portalH);
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = Math.max(1, S * 0.0015);
    ctx.strokeRect(portalX - S * 0.006, portalY - S * 0.006, portalW + S * 0.012, portalH + S * 0.012);
    ctx.restore();

    // stage edge
    ctx.save();
    ctx.strokeStyle = GRAY;
    ctx.globalAlpha = 0.25;
    ctx.lineWidth = 1;
    ctx.strokeRect(g.ox + 0.5, g.oy + 0.5, S - 1, S - 1);
    ctx.restore();
  }

  function elapsed() {
    if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') {
      return Math.max(0, (performance.now() - startStamp) / 1000);
    }
    return 0;
  }

  function frame() {
    drawAt(PHASE0 + elapsed());
  }

  function resize() {
    var vv = window.visualViewport;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    var sw = (window.screen && window.screen.width) ? window.screen.width : w;
    var sh = (window.screen && window.screen.height) ? window.screen.height : h;
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
    drawAt(PHASE0);
  }

  if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  makeFigures();
  resize();

  var raf = null;
  if (typeof window.requestAnimationFrame === 'function') raf = window.requestAnimationFrame;
  else if (typeof requestAnimationFrame === 'function') raf = requestAnimationFrame;
  if (raf) {
    var loop = function () {
      frame();
      raf(loop);
    };
    raf(loop);
  }
})();
</script>
</body>
</html>
