<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9072 · Well</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#efe6cf; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(74,62,42,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(239,230,207,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another well</div>
<script>
'use strict';
// No9072 Well.
// Nested squares, each one smaller and turned a little further than the
// one outside it, so the eye falls down a twisting shaft. The twist per
// step is constant for a given seed; the total twist across the stack
// is what the build measures, and seeds are rejected unless it lands
// between 25 and 70 degrees: below that the shaft reads as a stack of
// frames, above that it dissolves into a star. Squares are stroked in
// ink on bone; one square, chosen in the middle third of the stack, is
// vermilion and drawn a touch heavier.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9072', 10) || 9072;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const BONE = '#efe6cf';
const INK = 'rgba(38,34,28,0.82)';
const VERM = 'rgba(179,64,42,0.95)';

function compose(s) {
  const rnd = mulberry32(s);
  const N = 30 + ((rnd() * 10) | 0);             // 30..39 squares
  const totalTwist = (25 + rnd() * 45) * (rnd() < 0.5 ? 1 : -1); // degrees, signed
  const shrink = 0.90 + rnd() * 0.035;           // per-step size factor
  const cxo = (rnd() - 0.5) * 0.02, cyo = (rnd() - 0.5) * 0.02;
  const verm = Math.floor(N * (0.36 + rnd() * 0.28));
  return { N, totalTwist, shrink, cxo, cyo, verm, ok: Math.abs(totalTwist) >= 25 && Math.abs(totalTwist) <= 70 };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function drawSquare(cx, cy, half, ang) {
  const c = Math.cos(ang), sn = Math.sin(ang);
  ctx.beginPath();
  for (let k = 0; k < 4; k++) {
    const px = (k === 0 || k === 3) ? -half : half;
    const py = k < 2 ? -half : half;
    const x = cx + px * c - py * sn;
    const y = cy + px * sn + py * c;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
}

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  // Portrait: the bone ground fills the viewport so the centered well
  // reads as a print on paper, not a tile adrift in black.
  ctx.fillStyle = BONE;
  ctx.fillRect(0, 0, w, h);
  const S = Math.min(w, h);
  const ox = (w - S) / 2, oy = (h - S) / 2;

  ctx.fillStyle = BONE;
  ctx.fillRect(ox, oy, S, S);
  ctx.save();
  ctx.beginPath(); ctx.rect(ox, oy, S, S); ctx.clip();

  if (!piece) piece = buildPiece(seed);
  const p = piece;
  const cx = ox + S / 2 + p.cxo * S, cy = oy + S / 2 + p.cyo * S;
  const startHalf = S * 0.44;
  const lineW = Math.max(1, S / 620);

  for (let i = 0; i < p.N; i++) {
    const f = i / (p.N - 1);
    const half = startHalf * Math.pow(p.shrink, i);
    const ang = (p.totalTwist * Math.PI / 180) * f;
    if (i === p.verm) continue;
    ctx.strokeStyle = INK;
    ctx.lineWidth = lineW;
    drawSquare(cx, cy, half, ang);
  }
  // Vermilion square last, heavier.
  {
    const i = p.verm;
    const f = i / (p.N - 1);
    const half = startHalf * Math.pow(p.shrink, i);
    const ang = (p.totalTwist * Math.PI / 180) * f;
    ctx.strokeStyle = VERM;
    ctx.lineWidth = lineW * 1.8;
    drawSquare(cx, cy, half, ang);
  }

  const rnd = mulberry32((seed ^ 0x452821) >>> 0);
  for (let g = 0; g < 1800; g++) {
    const x = ox + rnd() * S, y = oy + rnd() * S;
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(38,34,28,0.05)' : 'rgba(90,74,52,0.04)';
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
