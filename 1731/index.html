<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Twenty-Second Down</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0A0A0A';
var BONE = '#EFE9DD';
var EDGE = '#7FA8C9';
var PLATE = '#1C1C1C';
var PLATE_LINE = 'rgba(127,168,201,0.45)';
var TITLE_INK = '#EFE9DD';
var HINT_INK = '#7FA8C9';
var PERIOD = 11;
var BARS = 22;
var FRAME_T = 38.5;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1731);
var phaseT = FRAME_T;
/* ---- seeded bars: 22 distinct, no two alike ---- */
var BARLIST = [];
(function () {
  var i;
  for (i = 0; i < BARS; i++) {
    BARLIST.push({
      wFrac: 0.58 + rng() * 0.30,
      hFrac: 0.74 + rng() * 0.26,
      phase: (rng() - 0.5) * 0.55,
      bright: 0.80 + rng() * 0.20,
      edgeA: 0.30 + rng() * 0.30
    });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* detune: continuous drift, (cycleIndex + u) / 22 of one bar's range.
   Continuous across every cycle seam; wraps only at cycle 22, the true repeat. */
function detuneAt(t) {
  var cyc = Math.floor(t / PERIOD);
  var u = (t - cyc * PERIOD) / PERIOD;
  return ((cyc + u) / BARS) % 1;
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var bandX = st.x + st.w * 0.07;
  var bandW = st.w * 0.86;
  var bandH = st.h * 0.34;
  var bandY = st.y + (st.h - bandH) / 2;
  var cyc = Math.floor(phaseT / PERIOD);
  var u = (phaseT - cyc * PERIOD) / PERIOD;
  var detune = detuneAt(phaseT);
  /* one bar's vertical range is bandH; the detune drop is a slow downward
     drift of the whole set, 1/22 of that range per cycle */
  var drop = detune * bandH * 0.28;
  var cy = bandY + bandH / 2 + drop;
  var slot = bandW / BARS;
  var i, b, pulse, h, w, x, y, a;
  for (i = 0; i < BARS; i++) {
    b = BARLIST[i];
    /* travelling pulse: the swell rotates across the bars, one full pass per cycle */
    pulse = 0.5 + 0.5 * Math.sin(TAU * (u + i / BARS) + b.phase);
    h = bandH * b.hFrac * (0.78 + 0.22 * pulse);
    w = slot * b.wFrac;
    x = bandX + i * slot + (slot - w) / 2;
    y = cy - h / 2;
    a = (0.72 + 0.28 * pulse) * b.bright;
    ctx.fillStyle = rgba(BONE, a);
    ctx.fillRect(x, y, w, h);
    /* faint blue edge light along the left edge of each bar */
    ctx.fillStyle = rgba(EDGE, b.edgeA * (0.55 + 0.45 * pulse));
    ctx.fillRect(x, y, Math.max(1, w * 0.07), h);
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('One Twenty-Second Down').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('One Twenty-Second Down').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 08').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('One Twenty-Second Down', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 08', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the slow detune.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    barCount: function () { return BARS; },
    detuneOffset: function () { return detuneAt(phaseT); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase, cycle index 3, t = 5.5 s into the cycle ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % (PERIOD * BARS);
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
