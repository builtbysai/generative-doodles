<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.364 Dandelion Medallions</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2A58A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.364 Dandelion Medallions (jmarie.creates).
// After Julianne Haness's "Dandelions": a two-scale
// system. The macro scale is a bold purple vine
// scrollwork lattice: thick continuous Catmull-Rom
// curves woven through a half-drop grid of nodes on a
// salmon ground, with hanging leaves and tendril curls
// along the vines. The micro scale is the inserts:
// giant coral dandelion-seed-head medallions at the
// vine intersections, crisp radial starbursts of 12 to
// 24 arms with darker-coral dot fills. Growth pulse:
// the starbursts rotate a few degrees and the vines
// sway, every term a whole number of cycles in one
// 36s loop, so frame 36s is pixel-identical to
// frame 0. Drag pans the oversized system; double-tap
// advances medallion placement and arm counts to the
// next authored arrangement in a fixed table of
// three. Nothing is runtime random: node positions,
// arms, radii, leaves and curls are closed-form
// functions of the grid indices.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var GROUND = '#F2A58A';   // salmon
var VINE = '#6B4C8E';     // purple
var CORAL = '#E0574E';    // medallion coral
var DOT = '#A83A32';      // darker coral, dot fills only

var DW = 1280, DH = 900;
var WW = 1760, WH = 1260; // authored world, oversized for pan
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 36;            // seconds, seamless master loop
if (LOOP !== 36) throw new Error('Dandelion Medallions loop must be 36s');
var TICK = 1 / 60;
// Frame one starts developed: exactly 9s into the 36s
// cycle, a quarter phase, so the medallions sit
// mid-rotation and the vines mid-sway. Drawn at this
// fixed phase, never from a wall clock, so the
// thumbnail reproduces byte-identically; the live loop
// advances from that same anchor.
var T_OFFSET = 9;
var T = T_OFFSET;

// ---- the node grid ------------------------------------------------
// Half-drop: odd rows shift half a column. Columns are
// 352 apart, rows 275. Node sway is a whole-cycle
// sinusoid of the loop phase, offset per node, so the
// lattice breathes without ever tearing.
var COLS = 5, ROWS = 5;
function isOdd(n) { return ((n % 2) + 2) % 2 === 1; }
function nodePos(c, r, ph) {
  var x = 88 + c * 352 + (isOdd(r) ? 176 : 0);
  var y = 80 + r * 275;
  var sx = 7 * Math.sin(ph + c * 0.9 + r * 0.35);
  var sy = 5 * Math.sin(ph + r * 0.8 + c * 0.3 + 1.7);
  return [x + sx, y + sy];
}

// ---- arrangements: fixed table of three ---------------------------
// Each arrangement decides, per node, whether a
// medallion sits there and with how many arms and what
// radius. Arms always land in 12..24 (asserted at
// load). Double-tap steps the index; nothing else
// about the piece changes.
//   0 full bloom: all 25 nodes, arms 12..24, R 92..108
//   1 checker:    13 nodes on even parity, arms
//                 15..24, R 112
//   2 sparse:     17 nodes, arms 12 or 16, R 78
var ARRANGEMENTS = [
  function (c, r) {
    return { arms: 12 + ((c * 7 + r * 5) % 5) * 3, rad: 92 + ((c + r) % 3) * 8 };
  },
  function (c, r) {
    if ((c + r) % 2 !== 0) return null;
    return { arms: 24 - ((c * 3 + r) % 4) * 3, rad: 112 };
  },
  function (c, r) {
    if ((2 * c + r) % 3 === 1) return null;
    return { arms: ((c + r) % 2 === 0) ? 16 : 12, rad: 78 };
  }
];
if (ARRANGEMENTS.length !== 3) throw new Error('Dandelion Medallions needs exactly three arrangements');
var arrIdx = 0;
// build the node lists once and assert the arm range
var ARR_NODES = ARRANGEMENTS.map(function (fn) {
  var list = [];
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var m = fn(c, r);
      if (!m) continue;
      if (m.arms < 12 || m.arms > 24) throw new Error('medallion arms out of range: ' + m.arms);
      list.push({ c: c, r: r, arms: m.arms, rad: m.rad });
    }
  }
  return list;
});

// ---- Catmull-Rom vines ---------------------------------------------
function crPoint(p0, p1, p2, p3, t) {
  var t2 = t * t, t3 = t2 * t;
  return [
    0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
    0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
  ];
}
function strokeSpline(pts, steps) {
  ctx.beginPath();
  for (var i = 0; i < pts.length - 1; i++) {
    var p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (var s = (i === 0 ? 0 : 1); s <= steps; s++) {
      var p = crPoint(p0, p1, p2, p3, s / steps);
      if (i === 0 && s === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
    }
  }
  ctx.stroke();
}
// vertical vine per column, horizontal vine per row,
// each running one phantom node past both ends so the
// curves cross the world edges without pinching
function vinePoints(ph) {
  var lines = [];
  var c, r, pts;
  for (c = 0; c < COLS; c++) {
    pts = [];
    for (r = -1; r <= ROWS; r++) pts.push(nodePos(c, r, ph));
    lines.push(pts);
  }
  for (r = 0; r < ROWS; r++) {
    pts = [];
    for (c = -1; c <= COLS; c++) pts.push(nodePos(c, r, ph));
    lines.push(pts);
  }
  return lines;
}

// ---- leaves and tendril curls ---------------------------------------
// One leaf hangs at the midpoint of every horizontal
// segment, one points outward at the midpoint of every
// vertical segment, alternating sides by index parity.
// Curls sit at the quarter points of horizontal
// segments on alternating rows.
function leaf(x, y, len, wid, ang) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(0, -len / 2);
  ctx.quadraticCurveTo(wid, -len * 0.1, 0, len / 2);
  ctx.quadraticCurveTo(-wid, -len * 0.1, 0, -len / 2);
  ctx.closePath();
  ctx.fillStyle = VINE;
  ctx.fill();
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -len / 2 + 5);
  ctx.lineTo(0, len / 2 - 5);
  ctx.stroke();
  ctx.restore();
}
function curl(x, y, dir) {
  ctx.strokeStyle = VINE;
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  var steps = 22;
  for (var i = 0; i <= steps; i++) {
    var a = dir * (i / steps) * Math.PI * 3.1;
    var rad = 2 + (i / steps) * 12;
    var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad * 0.8;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}
function drawFoliage(ph) {
  var c, r, a, b, mx, my;
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS - 1; c++) {
      a = nodePos(c, r, ph); b = nodePos(c + 1, r, ph);
      mx = (a[0] + b[0]) / 2; my = (a[1] + b[1]) / 2;
      leaf(mx, my + 30, 62, 17, ((c + r) % 2 === 0 ? 0.45 : -0.45));
      if (r % 2 === 0) {
        curl(a[0] + (b[0] - a[0]) * 0.25, a[1] + (b[1] - a[1]) * 0.25 - 24, 1);
        curl(a[0] + (b[0] - a[0]) * 0.75, a[1] + (b[1] - a[1]) * 0.75 + 26, -1);
      }
    }
  }
  for (c = 0; c < COLS; c++) {
    for (r = 0; r < ROWS - 1; r++) {
      a = nodePos(c, r, ph); b = nodePos(c, r + 1, ph);
      mx = (a[0] + b[0]) / 2; my = (a[1] + b[1]) / 2;
      leaf(mx + ((c + r) % 2 === 0 ? 24 : -24), my, 56, 15, ((c + r) % 2 === 0 ? 1.15 : -1.15));
    }
  }
}

// ---- medallions ------------------------------------------------------
// Crisp radial starburst: straight arms at three
// length steps, a three-spoke tuft at each tip, one
// darker dot on each arm and a dotted centre disc.
function medallion(x, y, rad, arms, rot) {
  var i, a, lx, ly, tx, ty, k, ta;
  ctx.strokeStyle = CORAL;
  ctx.lineCap = 'round';
  // dots between the arms, inner ring
  ctx.fillStyle = DOT;
  for (i = 0; i < arms; i++) {
    a = rot + (i + 0.5) * Math.PI * 2 / arms;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * rad * 0.34, y + Math.sin(a) * rad * 0.34, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
  // arms with tufts and arm dots
  var lenSteps = [0.9, 1, 0.95];
  for (i = 0; i < arms; i++) {
    a = rot + i * Math.PI * 2 / arms;
    var L = rad * lenSteps[i % 3];
    lx = x + Math.cos(a) * 16; ly = y + Math.sin(a) * 16;
    tx = x + Math.cos(a) * L; ty = y + Math.sin(a) * L;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.lineWidth = 2.4;
    for (k = -1; k <= 1; k++) {
      ta = a + k * 0.5;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx + Math.cos(ta) * 11, ty + Math.sin(ta) * 11);
      ctx.stroke();
    }
    ctx.fillStyle = DOT;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * L * 0.55, y + Math.sin(a) * L * 0.55, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
  // centre disc with a dotted ring
  ctx.fillStyle = CORAL;
  ctx.beginPath();
  ctx.arc(x, y, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = DOT;
  for (i = 0; i < 6; i++) {
    a = rot + i * Math.PI / 3;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * 8, y + Math.sin(a) * 8, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(x, y, 2.4, 0, Math.PI * 2);
  ctx.fill();
}

// ---- view: drag pan state ---------------------------------------------
// The world is authored 1760x1260 against a 1280x900
// design view, so the pan clamps to the authored
// margin (with a small allowance for vine sway) and
// the explored position persists on release.
var panX = 0, panY = 0;
function clampPan() {
  if (panX > 232) panX = 232; if (panX < -232) panX = -232;
  if (panY > 172) panY = 172; if (panY < -172) panY = -172;
}

function draw() {
  var tm = T % LOOP;
  var ph = Math.PI * 2 * tm / LOOP;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  ctx.save();
  ctx.translate((DW - WW) / 2 - panX, (DH - WH) / 2 - panY);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  // vines
  ctx.strokeStyle = VINE;
  ctx.lineWidth = 26;
  var lines = vinePoints(ph);
  for (var i = 0; i < lines.length; i++) strokeSpline(lines[i], 14);
  // leaves and curls ride the same swayed node field
  drawFoliage(ph);
  // medallions at the intersections, rotating a few
  // degrees on a whole-cycle sinusoid, phase per node
  var nodes = ARR_NODES[arrIdx];
  for (var j = 0; j < nodes.length; j++) {
    var nd = nodes[j];
    var p = nodePos(nd.c, nd.r, ph);
    var rot = nd.c * 0.7 + nd.r * 1.1 + 0.07 * Math.sin(ph + nd.c * 1.3 + nd.r * 0.7);
    medallion(p[0], p[1], nd.rad, nd.arms, rot);
  }
  ctx.restore();
}

// ---- sizing: full-bleed field, cover-fit ------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction: drag pans, double-tap advances the ------------------
// arrangement. A tap is a quick touch that barely
// moves; two taps inside 350ms step the arrangement
// table. Dragging never triggers it, and a tap never
// pans. No reload anywhere.
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
var grab = null, downAt = 0, downXY = null, lastTapMs = -10000;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  grab = { x: p[0], y: p[1], panX: panX, panY: panY };
  downAt = Date.now();
  downXY = p;
});
canvas.addEventListener('pointermove', function (e) {
  if (!grab) return;
  var p = toDesign(e);
  panX = grab.panX - (p[0] - grab.x);
  panY = grab.panY - (p[1] - grab.y);
  clampPan();
});
canvas.addEventListener('pointerup', function (e) {
  if (downXY) {
    var p = toDesign(e);
    var moved = Math.abs(p[0] - downXY[0]) + Math.abs(p[1] - downXY[1]);
    var now = Date.now();
    if (moved < 14 && now - downAt < 400) {
      if (now - lastTapMs < 350) {
        arrIdx = (arrIdx + 1) % ARRANGEMENTS.length;
        lastTapMs = -10000;
      } else {
        lastTapMs = now;
      }
    }
  }
  grab = null; downXY = null;
});
canvas.addEventListener('pointercancel', function () { grab = null; downXY = null; });

// ---- frame --------------------------------------------------------------
var lastNow = -1, acc = 0;
function frame(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && now > 0) dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
