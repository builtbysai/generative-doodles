<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Morning Abduction</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0B1026; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var SKY = '#0B1026';
  var STAR = '#FFFFFF';
  var SAUCER = '#3A3F4A';
  var RIM = '#8A93A5';
  var DOME = '#BFD6E4';
  var BEAM = '#FFF7E0';
  var POT = '#141414';

  var LOOP_MS = 36000;
  var PHASE0 = 9000;              // constant first-frame phase, a quarter into the loop
  var TAU = Math.PI * 2;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return H > W * 1.15;
  }

  function fit() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    DPR = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) {
      DPR = Math.min(window.devicePixelRatio, 2);
    }
    W = Math.round(w); H = Math.round(h);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  // ---------- star field: all load-time layout from the seeded stream ----------

  var rng = mulberry32(46703);
  var TWINKLES = [4, 4.5, 6, 7.2];   // every cycle divides the 36s loop, so the loop is seamless
  var stars = [];
  for (var i = 0; i < 84; i++) {
    stars.push({
      x: rng(),
      y: rng() * 0.92 + 0.03,
      r: 0.6 + rng() * 1.1,
      cycle: TWINKLES[Math.floor(rng() * TWINKLES.length)],
      phase: rng() * TAU,
      base: 0.35 + rng() * 0.4
    });
  }

  // ---------- drag springs ----------

  var pointer = { active: false, x: 0, y: 0 };
  var dragOX = 0, dragOXV = 0;       // saucer horizontal nudge offset
  var dragTilt = 0, dragTiltV = 0;   // saucer lean
  var beamLag = 0, beamLagV = 0;     // beam angle trailing the lean

  function spring(state, vel, target, stiff, damp, dt) {
    var a = (target - state) * stiff - vel * damp;
    vel += a * dt;
    state += vel * dt;
    return [state, vel];
  }

  function updateSprings(dt, baseSx) {
    var tOX = 0, tTilt = 0;
    if (pointer.active) {
      tOX = clamp((pointer.x - baseSx) * 0.35, -W * 0.085, W * 0.085);
      tTilt = clamp((pointer.x - baseSx) / (W * 0.45), -1, 1) * 0.16;
    }
    var r;
    r = spring(dragOX, dragOXV, tOX, 90, 14, dt); dragOX = r[0]; dragOXV = r[1];
    r = spring(dragTilt, dragTiltV, tTilt, 90, 14, dt); dragTilt = r[0]; dragTiltV = r[1];
    r = spring(beamLag, beamLagV, dragTilt * 1.3, 34, 8.5, dt); beamLag = r[0]; beamLagV = r[1];
  }

  // ---------- drawing ----------

  function drawStars(tSec) {
    ctx.fillStyle = STAR;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.5 + 0.5 * Math.sin(TAU * tSec / s.cycle + s.phase);
      ctx.globalAlpha = s.base + (1 - s.base) * tw * tw;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPot(u) {
    ctx.fillStyle = POT;
    ctx.strokeStyle = POT;

    // handle: a thick curved loop on the right, drawn first so the body covers its roots
    ctx.lineWidth = u * 0.075;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(u * 0.26, -u * 0.44);
    ctx.bezierCurveTo(u * 0.48, -u * 0.40, u * 0.48, -u * 0.02, u * 0.28, u * 0.06);
    ctx.stroke();

    // spout: a small angular wedge out of the upper-left chamber
    ctx.beginPath();
    ctx.moveTo(-u * 0.26, -u * 0.54);
    ctx.lineTo(-u * 0.50, -u * 0.42);
    ctx.lineTo(-u * 0.44, -u * 0.28);
    ctx.lineTo(-u * 0.27, -u * 0.34);
    ctx.closePath(); ctx.fill();

    // body: lid, upper chamber, waist band, octagonal lower chamber
    ctx.beginPath();
    ctx.moveTo(-u * 0.30, -u * 0.58);                    // lid left edge
    ctx.quadraticCurveTo(0, -u * 0.70, u * 0.30, -u * 0.58);
    ctx.lineTo(u * 0.335, -u * 0.30);                    // upper chamber, flaring slightly
    ctx.lineTo(u * 0.36, -u * 0.16);                     // waist band top
    ctx.lineTo(u * 0.315, -u * 0.06);                    // waist pinch
    ctx.lineTo(u * 0.355, u * 0.10);                     // lower chamber facets
    ctx.lineTo(u * 0.325, u * 0.42);
    ctx.lineTo(u * 0.24, u * 0.62);                      // base
    ctx.lineTo(-u * 0.24, u * 0.62);
    ctx.lineTo(-u * 0.325, u * 0.42);
    ctx.lineTo(-u * 0.355, u * 0.10);
    ctx.lineTo(-u * 0.315, -u * 0.06);
    ctx.lineTo(-u * 0.36, -u * 0.16);
    ctx.lineTo(-u * 0.335, -u * 0.30);
    ctx.closePath(); ctx.fill();

    // lid knob and its short stem
    ctx.fillRect(-u * 0.035, -u * 0.76, u * 0.07, u * 0.15);
    ctx.beginPath();
    ctx.moveTo(-u * 0.085, -u * 0.685);
    ctx.lineTo(u * 0.085, -u * 0.685);
    ctx.lineTo(u * 0.055, -u * 0.775);
    ctx.lineTo(-u * 0.055, -u * 0.775);
    ctx.closePath(); ctx.fill();
  }

  function drawSaucer(u, tilt) {
    ctx.save();
    ctx.rotate(tilt);
    // glass dome
    ctx.fillStyle = DOME;
    ctx.beginPath();
    ctx.ellipse(0, -u * 0.10, u * 0.46, u * 0.30, 0, Math.PI, 0);
    ctx.closePath(); ctx.fill();
    // hull
    ctx.fillStyle = SAUCER;
    ctx.beginPath();
    ctx.ellipse(0, 0, u, u * 0.29, 0, 0, TAU);
    ctx.fill();
    // lit rim: the bright lower arc of the hull
    ctx.strokeStyle = RIM;
    ctx.lineWidth = Math.max(1.5, u * 0.075);
    ctx.beginPath();
    ctx.ellipse(0, 0, u * 0.985, u * 0.275, 0, Math.PI * 0.10, Math.PI * 0.90);
    ctx.stroke();
    // dark underside core the beam pours from
    ctx.fillStyle = SAUCER;
    ctx.beginPath();
    ctx.ellipse(0, u * 0.16, u * 0.34, u * 0.11, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function draw(tMs) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var tSec = tMs / 1000;
    var u = Math.min(W, H);                    // composition unit; shape survives portrait phones
    if (isPhone()) u = Math.min(W * 1.15, H);  // a touch larger on narrow screens, same proportions

    ctx.fillStyle = SKY;
    ctx.fillRect(0, 0, W, H);
    drawStars(tSec);

    // saucer anchor: top-center, drifting on an 18s sine inside the 36s loop
    var baseSx = W * 0.5 + Math.sin(TAU * tSec / 18 + 0.7) * W * 0.045;
    var sx = baseSx + dragOX;
    var sy = H * 0.185;
    var baseTilt = 0.035 * Math.sin(TAU * tSec / 12 + 1.1);
    var beamAngle = 0.07 * Math.sin(TAU * tSec / 12 + 0.4) + beamLag;

    // beam + pot group, rotating around the saucer center
    var pivotY = sy + u * 0.055;
    var potDist = H * 0.60 - pivotY;           // pot rides at 60% of frame height
    var beamLen = H * 0.47;
    ctx.save();
    ctx.translate(sx, pivotY);
    ctx.rotate(beamAngle);
    var grad = ctx.createLinearGradient(0, 0, 0, beamLen);
    grad.addColorStop(0, 'rgba(255,247,224,0.35)');
    grad.addColorStop(0.55, 'rgba(255,247,224,0.20)');
    grad.addColorStop(1, 'rgba(255,247,224,0.07)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-u * 0.14, 0);
    ctx.lineTo(u * 0.14, 0);
    ctx.lineTo(u * 0.32, beamLen);
    ctx.lineTo(-u * 0.32, beamLen);
    ctx.closePath(); ctx.fill();

    // the pot, suspended in the beam: bob along the beam axis, slow roll
    var bob = Math.sin(TAU * tSec / 6 + 0.8) * H * 0.012;
    var roll = 0.0873 * Math.sin(TAU * tSec / 12 + 0.9);   // plus/minus 5 degrees
    ctx.translate(0, potDist + bob);
    ctx.rotate(roll);
    drawPot(u * 0.24);
    ctx.restore();

    // saucer on top, so the beam reads as pouring out of it
    ctx.save();
    ctx.translate(sx, sy);
    drawSaucer(u * 0.185, baseTilt + dragTilt);
    ctx.restore();
  }

  // ---------- clock: anchored as fixed offset + elapsed since load ----------

  var startStamp = Date.now();
  var lastStamp = null;
  function currentT() { return PHASE0 + (Date.now() - startStamp); }
  function frame() {
    var now = Date.now();
    var dt = lastStamp === null ? 0.016 : Math.min(0.033, (now - lastStamp) / 1000);
    lastStamp = now;
    var t = PHASE0 + (now - startStamp);
    var baseSx = W * 0.5 + Math.sin(TAU * (t / 1000) / 18 + 0.7) * W * 0.045;
    updateSprings(dt, baseSx);
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  }

  // ---------- interaction: drag nudges the saucer ----------

  function evtPos(e) {
    var r = { left: 0, top: 0 };
    if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return [cx - r.left, cy - r.top];
  }
  function onDown(e) {
    var p = evtPos(e);
    pointer.active = true; pointer.x = p[0]; pointer.y = p[1];
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!pointer.active) return;
    var p = evtPos(e);
    pointer.x = p[0]; pointer.y = p[1];
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() { pointer.active = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown);
  canvas.addEventListener('touchmove', onMove);
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(currentT()); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(currentT()); });
  }

  fit();
  draw(PHASE0);   // synchronous first frame at exactly PHASE0: deterministic
  if (typeof requestAnimationFrame !== 'undefined') {
    startStamp = Date.now();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
