<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8470;8966 &middot; Fifty-Three Divisions</title>
<style>
  :root{ --paper:#f6f1e2; --ink:#2b2620; --ink-soft:#6f6353; --brass:#a5762a; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--paper)}
  body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);
       -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
  #plate{position:absolute;top:14px;left:18px;pointer-events:none;user-select:none;
    font-size:13px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  #plate b{color:var(--ink);font-weight:700}
  #readout{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));pointer-events:none;user-select:none;
    text-align:center;background:rgba(246,241,226,.92);border:1px solid rgba(43,38,32,.25);
    border-radius:12px;padding:10px 18px;min-width:min(88vw,420px);
    box-shadow:0 2px 12px rgba(43,38,32,.10)}
  #readout .c{font-size:15px;font-weight:600;letter-spacing:.02em}
  #readout .d{font-size:12px;color:var(--ink-soft);margin-top:3px;letter-spacing:.04em}
  #legend{position:absolute;top:14px;right:18px;pointer-events:none;user-select:none;
    text-align:right;font-size:11px;letter-spacing:.06em;color:var(--ink-soft);line-height:1.7}
  #legend b{color:var(--brass)}
  @media (max-width:560px){
    #legend{top:60px;right:auto;left:18px;text-align:left}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="plate"><b>&#8470;8966</b> &middot; Fifty-Three Divisions</div>
  <div id="legend">53 commas &middot; 5 wholetones of 9<br>2 limmas of 4 &middot; <b>the seam lives in the limmas</b></div>
  <div id="readout">
    <div class="c" id="ro-comma">touch the wheel</div>
    <div class="d" id="ro-det">53 equal divisions of the octave</div>
  </div>
</div>
<script>
"use strict";
/* Seed 267 "Fifty-Three Divisions": Sabat's 53-comma octave as a visual
   instrument. The octave is divided into 53 equal commas (5 wholetones of
   9 commas, 2 limmas of 4). Diatonic anchors get long spokes and names;
   the two narrow limma bands, which hold the 4.2-cent closure error, are
   bracketed in brass. Hovering or tapping a wedge reads its comma, its
   cents, and its nearest 12-tone neighbor. */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const roComma = document.getElementById('ro-comma');
const roDet = document.getElementById('ro-det');

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromURL(){
  const m = /[?&]seed=(\d+)/.exec(location.search);
  return m ? (parseInt(m[1],10) >>> 0) : ((Math.random()*1e9)|0);
}
let SEED = seedFromURL();
let rnd = mulberry32(SEED);

const COMMAS = 53;
const DIATONIC = {0:'C', 9:'D', 18:'E', 22:'F', 31:'G', 40:'A', 49:'B'};
const LIMMAS = [[18,22],[49,53]];   // E-F and B-C: the narrow bands that hold the seam
const NAMES12 = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

let W=0,H=0,DPR=1, cx=0, cy=0, R=0, rIn=0;
let sel = -1, rot = 0, targetRot = 0;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx = W/2; cy = H*0.44;
  R = Math.min(W,H)*0.335;
  rIn = R*0.60;
}
window.addEventListener('resize', resize);

function cents(c){ return c*1200/COMMAS; }
function nearest12(c){
  const ct = cents(c);
  let n = Math.round(ct/100) % 12;
  if(n<0) n+=12;
  const dev = ct - n*100;
  return {name:NAMES12[n], dev:dev};
}
function wedgePath(c, ro, ri){
  const a0 = rot - Math.PI/2 + c/COMMAS*Math.PI*2;
  const a1 = rot - Math.PI/2 + (c+1)/COMMAS*Math.PI*2;
  ctx.beginPath();
  ctx.arc(cx,cy,ro,a0,a1);
  ctx.arc(cx,cy,ri,a1,a0,true);
  ctx.closePath();
}

function draw(now){
  const t = now/1000;
  ctx.fillStyle = '#f6f1e2';
  ctx.fillRect(0,0,W,H);

  rot += (targetRot-rot)*0.06;

  // wedges
  for(let c=0;c<COMMAS;c++){
    const hue = c/COMMAS*360;
    const isSel = (c===sel);
    wedgePath(c, R, rIn);
    ctx.fillStyle = 'hsl('+hue.toFixed(1)+','+(isSel?78:58)+'%,'+(isSel?62:56)+'%)';
    ctx.fill();
    ctx.strokeStyle = isSel ? '#2b2620' : 'rgba(246,241,226,0.85)';
    ctx.lineWidth = isSel ? 2.4 : 1;
    ctx.stroke();
  }

  // limma brackets in brass
  ctx.strokeStyle = '#a5762a';
  ctx.lineWidth = 3;
  for(const [a,b] of LIMMAS){
    const a0 = rot - Math.PI/2 + a/COMMAS*Math.PI*2;
    const a1 = rot - Math.PI/2 + b/COMMAS*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,R+16,a0,a1);
    ctx.stroke();
    // tick ends
    for(const aa of [a0,a1]){
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(aa)*(R+10), cy+Math.sin(aa)*(R+10));
      ctx.lineTo(cx+Math.cos(aa)*(R+22), cy+Math.sin(aa)*(R+22));
      ctx.stroke();
    }
  }
  // seam shimmer on limmas
  const shim = 0.35+0.3*Math.sin(t*2.1);
  ctx.strokeStyle = 'rgba(165,118,42,'+shim.toFixed(2)+')';
  ctx.lineWidth = 1.5;
  for(const [a,b] of LIMMAS){
    const a0 = rot - Math.PI/2 + a/COMMAS*Math.PI*2;
    const a1 = rot - Math.PI/2 + b/COMMAS*Math.PI*2;
    ctx.beginPath(); ctx.arc(cx,cy,R+9,a0,a1); ctx.stroke();
  }

  // diatonic spokes
  for(const cStr of Object.keys(DIATONIC)){
    const c = +cStr, name = DIATONIC[c];
    const a = rot - Math.PI/2 + (c+0.5)/COMMAS*Math.PI*2;
    const pulse = 0.72+0.28*Math.sin(t*1.6 + c*0.9);
    const x0 = cx+Math.cos(a)*rIn*0.92, y0 = cy+Math.sin(a)*rIn*0.92;
    const x1 = cx+Math.cos(a)*R*1.16, y1 = cy+Math.sin(a)*R*1.16;
    ctx.strokeStyle = 'rgba(43,38,32,'+(0.55*pulse+0.25).toFixed(2)+')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    ctx.fillStyle = '#2b2620';
    ctx.font = '600 '+Math.max(12,Math.min(17,R*0.075))+'px "Avenir Next","Segoe UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lx = cx+Math.cos(a)*R*1.30, ly = cy+Math.sin(a)*R*1.30;
    ctx.fillText(name, lx, ly);
  }
  ctx.textBaseline = 'alphabetic';

  // center medallion
  ctx.fillStyle = '#f6f1e2';
  ctx.beginPath(); ctx.arc(cx,cy,rIn*0.88,0,7); ctx.fill();
  ctx.strokeStyle = 'rgba(43,38,32,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx,cy,rIn*0.88,0,7); ctx.stroke();
  ctx.fillStyle = '#2b2620';
  ctx.font = '600 '+Math.max(16,Math.min(24,rIn*0.16))+'px "Avenir Next","Segoe UI",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('53', cx, cy-4);
  ctx.font = '400 '+Math.max(10,Math.min(13,rIn*0.09))+'px "Avenir Next","Segoe UI",sans-serif';
  ctx.fillStyle = '#6f6353';
  ctx.fillText('commas to the octave', cx, cy+Math.max(14,rIn*0.11));

  requestAnimationFrame(draw);
}

function pickAt(px,py){
  const dx = px-cx, dy = py-cy;
  const d = Math.hypot(dx,dy);
  if(d < rIn || d > R+26){ sel = -1; updateReadout(); return; }
  let a = Math.atan2(dy,dx) + Math.PI/2 - rot;
  while(a < 0) a += Math.PI*2;
  while(a >= Math.PI*2) a -= Math.PI*2;
  sel = Math.min(COMMAS-1, Math.floor(a/(Math.PI*2)*COMMAS));
  updateReadout();
}
function updateReadout(){
  if(sel < 0){
    roComma.textContent = 'touch the wheel';
    roDet.textContent = '53 equal divisions of the octave';
    return;
  }
  const ct = cents(sel), n = nearest12(sel);
  const dia = DIATONIC[sel] ? ' · diatonic '+DIATONIC[sel] : '';
  const lim = LIMMAS.some(([a,b])=> sel>=a && sel<b) ? ' · in a limma seam' : '';
  roComma.textContent = 'comma '+sel+' · '+ct.toFixed(1)+'¢'+dia;
  const dev = (n.dev>=0?'+':'')+n.dev.toFixed(1)+'¢';
  roDet.textContent = 'nearest 12-tone: '+n.name+' ('+dev+')'+lim;
}
canvas.addEventListener('pointermove', e=> pickAt(e.clientX, e.clientY));
canvas.addEventListener('pointerdown', e=>{ pickAt(e.clientX, e.clientY); targetRot += 0.12; });

resize();
updateReadout();
requestAnimationFrame(draw);
</script>
</body>
</html>
