<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms of Paper</title>
<style>
html, body { margin: 0; padding: 0; background: #fdfdf6; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#fdfdf6';
var RULE = '#a9c6de';
var RED = '#C0392B';
var GREEN = '#2E7D4F';
var GRAPHITE = '#5a5850';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, both margins mid-breath */
var PLATE_FILL = '#fdfdf6';
var PLATE_LINE = 'rgba(0,0,0,0.28)';
var PLATE_INK = '#2b2b28';
var HINT_INK = '#2b2b28';
function clamp2(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgba(hex, a) {
  var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(4) + ')';
}
function smooth01(u) { u = clamp2(u, 0, 1); return u * u * (3 - 2 * u); }
/* Growth fronts: two margins, each with 8 clusters of branching walks.
   Every segment is a closed-form function of piece time on fixed seeded
   tables, so frame one is byte-comparable. A segment never crosses a ruled
   line: its whole walk stays inside one rule band (rule + 3 px to next
   rule - 3 px). Each segment has two endpoint variants (A and B); the
   variant drawn alternates each breath cycle, so regrowth follows a
   slightly different path. Breath cycle: grow 0..0.5 of the period (with a
   hesitation plateau), hold to 0.65, fade to 0.15 alpha by period end. */
var CLUSTERS_PER_SIDE = 11;
var SEGS = []; /* rebuilt per draw from seed 1788; deterministic */
var SMUDGES = [];
function buildTables() {
  var rng = mulberry32(1788);
  var side, ci, s, b, k;
  SEGS = [];
  for (side = 0; side < 2; side++) {
    for (ci = 0; ci < CLUSTERS_PER_SIDE; ci++) {
      var band = 2 + Math.floor(rng() * 20); /* rule band index */
      var col = rng() < 0.5 ? RED : GREEN;
      var x0, y0;
      var nMain = 8 + Math.floor(rng() * 6);
      var pts = [];
      /* cluster anchor: x inside the margin zone, y inside its band */
      var ax = side === 0 ? 0.02 + rng() * 0.05 : 0.93 + rng() * 0.05;
      var ay = band + 0.25 + rng() * 0.5; /* in rule-band units */
      pts.push({ x: ax, y: ay });
      /* main chain: angular steps, mostly horizontal wander, y clamped
         to stay inside the band */
      for (s = 0; s < nMain; s++) {
        var p = pts[pts.length - 1];
        var dx = (rng() * 2 - 1) * 0.034;
        var dy = (rng() * 2 - 1) * 0.26;
        var nx = clamp2(p.x + dx, side === 0 ? 0.012 : 0.87, side === 0 ? 0.13 : 0.988);
        var ny = clamp2(p.y + dy, band + 0.08, band + 0.92);
        pts.push({ x: nx, y: ny });
      }
      /* branches off the chain */
      var branches = 3 + Math.floor(rng() * 3);
      for (b = 0; b < branches; b++) {
        var bp = pts[1 + Math.floor(rng() * (pts.length - 2))];
        var bx = bp.x, by = bp.y;
        var nB = 2 + Math.floor(rng() * 3);
        var prev = { x: bx, y: by };
        for (k = 0; k < nB; k++) {
          var bdx = (rng() * 2 - 1) * 0.03;
          var bdy = (rng() * 2 - 1) * 0.24;
          var nbx = clamp2(prev.x + bdx, side === 0 ? 0.012 : 0.87, side === 0 ? 0.13 : 0.988);
          var nby = clamp2(prev.y + bdy, band + 0.08, band + 0.92);
          SEGS.push(mkSeg(prev, { x: nbx, y: nby }, col, rng, band));
          prev = { x: nbx, y: nby };
        }
      }
      for (s = 0; s < pts.length - 1; s++) {
        SEGS.push(mkSeg(pts[s], pts[s + 1], col, rng, band));
      }
    }
  }
  SMUDGES = [];
  for (k = 0; k < 10; k++) {
    SMUDGES.push({
      x: k % 2 === 0 ? 0.03 + rng() * 0.06 : 0.91 + rng() * 0.06,
      y: rng(),
      r: 0.08 + rng() * 0.08,
      a: 0.02 + rng() * 0.03
    });
  }
}
function mkSeg(p0, p1, col, rng, band) {
  /* variant B endpoint: a small seeded offset from A, clamped to the same
     rule band so the regrown path still never crosses a ruled line */
  var jx = (rng() * 2 - 1) * 0.012;
  var jy = (rng() * 2 - 1) * 0.10;
  return {
    x0: p0.x, y0: p0.y, x1: p1.x, y1: p1.y,
    x1b: clamp2(p1.x + jx, 0.012, 0.988), y1b: clamp2(p1.y + jy, band + 0.08, band + 0.92),
    col: col,
    w: 1.3 + rng() * 1.8,
    period: 18 + rng() * 14, /* 18..32 s breath */
    off: rng() * 32,
    jit: (rng() * 2 - 1) * 0.0016 /* perpendicular pencil wobble */
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* full-bleed sheet */
var RS = 36; /* rule spacing px */
var RULE0 = 0; /* y of first rule line */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  F = { x: 0, y: 0, w: VW, h: VH };
  RS = isPhone ? 30 : 36;
  RULE0 = RS * 0.5;
}
/* rule band b spans [RULE0 + b*RS + 3, RULE0 + (b+1)*RS - 3]; segment y is
   stored in band units, so convert: y_px = RULE0 + y_units * RS */
function drawRules() {
  ctx.strokeStyle = rgba(RULE, 0.85);
  ctx.lineWidth = 1;
  var y, k = 0;
  ctx.beginPath();
  for (y = RULE0; y < VH + RS; y += RS, k++) {
    ctx.moveTo(0, Math.round(y) + 0.5);
    ctx.lineTo(VW, Math.round(y) + 0.5);
  }
  ctx.stroke();
}
function drawSmudges() {
  var i, s;
  for (i = 0; i < SMUDGES.length; i++) {
    s = SMUDGES[i];
    var cx = s.x * VW, cy = s.y * VH;
    var r = s.r * Math.min(VW, VH);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgba(90,88,80,' + s.a.toFixed(4) + ')');
    g.addColorStop(1, 'rgba(90,88,80,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.fill();
  }
}
/* segment state at time t: growth fraction along the active variant and
   pencil alpha. Cycle index picks variant A (even) or B (odd). */
function segState(seg, t) {
  var cyc = Math.floor((t + seg.off) / seg.period);
  var p = ((t + seg.off) % seg.period) / seg.period;
  var g;
  if (p < 0.5) {
    var u = p / 0.5;
    /* hesitate: fast start, plateau, then finish */
    if (u < 0.45) g = u * 0.8;
    else if (u < 0.6) g = 0.36;
    else g = 0.36 + (u - 0.6) * 1.6;
  } else g = 1;
  g = clamp2(g, 0, 1);
  var a = p < 0.65 ? 1 : 1 - 0.85 * ((p - 0.65) / 0.35);
  return { g: g, a: a, variantB: (cyc % 2) === 1 };
}
function drawSegment(seg, t) {
  var st = segState(seg, t);
  if (st.g <= 0.001 || st.a <= 0.02) return;
  var ex = st.variantB ? seg.x1b : seg.x1;
  var ey = st.variantB ? seg.y1b : seg.y1;
  var x0 = seg.x0 * VW, y0 = RULE0 + seg.y0 * RS;
  var x1 = (seg.x0 + (ex - seg.x0) * st.g) * VW;
  var y1 = RULE0 + (seg.y0 + (ey - seg.y0) * st.g) * RS;
  var dx = x1 - x0, dy = y1 - y0;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len < 0.5) return;
  var nx = -dy / len, ny = dx / len; /* perpendicular */
  var j = seg.jit * Math.min(VW, VH);
  var w = seg.w * (isPhone ? 0.9 : 1);
  ctx.lineCap = 'round';
  /* pencil double stroke: main pass plus a lighter offset pass */
  ctx.strokeStyle = rgba(seg.col, 0.82 * st.a);
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(x0 + nx * j, y0 + ny * j);
  ctx.lineTo(x1 + nx * j, y1 + ny * j);
  ctx.stroke();
  ctx.strokeStyle = rgba(seg.col, 0.38 * st.a);
  ctx.lineWidth = w * 0.55;
  ctx.beginPath();
  ctx.moveTo(x0 - nx * j * 1.6, y0 - ny * j * 1.6);
  ctx.lineTo(x1 - nx * j * 1.6, y1 - ny * j * 1.6);
  ctx.stroke();
}
function drawClusters(t) {
  var i;
  for (i = 0; i < SEGS.length; i++) drawSegment(SEGS[i], t);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Forms of Paper').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Forms of Paper').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 04').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Forms of Paper', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 04', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  buildTables();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawRules();
  drawSmudges();
  drawClusters(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    segCount: function () { return SEGS.length; }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp2((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
