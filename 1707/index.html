<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agate Field</title>
<style>
html, body { margin: 0; padding: 0; background: #3E2A1A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#3E2A1A';
var PLATE = '#3A2A1C';
var PLATE_LINE = 'rgba(242,234,216,0.45)';
var TITLE_INK = '#F2EAD8';
var HINT_INK = '#E6D9BC';
var FIELD_T0 = 0;
var REDRAW_MS = 140;
var FILL_GRID = 320;
var MG = 150;
var L0 = -0.60;
var LSTEP = 0.127;
var NLEVELS = 14;
var LIGHT_BANDS = ['#F2EAD8', '#E6D9BC', '#DCC9A3'];
var DARK_BANDS = ['#8A5A33', '#55552F', '#6B4423'];
var VEIN = 'rgba(62,42,26,0.65)';
var LAKE1 = { u: 0.30, v: 0.36, amp: 0.62, sig: 0.13 };
var LAKE2 = { u: 0.70, v: 0.66, amp: 0.55, sig: 0.14 };
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
/* ---- seeded value noise ---- */
var rng = mulberry32(1707);
var PERM = new Array(512);
var pi, pj, tmp;
var base = [];
for (pi = 0; pi < 256; pi++) base.push(pi);
for (pi = 255; pi > 0; pi--) {
  pj = Math.floor(rng() * (pi + 1));
  tmp = base[pi]; base[pi] = base[pj]; base[pj] = tmp;
}
for (pi = 0; pi < 512; pi++) PERM[pi] = base[pi & 255];
function hash2(ix, iy) {
  return PERM[(PERM[ix & 255] + iy) & 255] / 255;
}
function smooth(t) { return t * t * (3 - 2 * t); }
function noise2(x, y) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var sx = smooth(fx), sy = smooth(fy);
  var a = hash2(ix, iy), b = hash2(ix + 1, iy);
  var c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  var ab = a + (b - a) * sx;
  var cd = c + (d - c) * sx;
  return ab + (cd - ab) * sy;
}
function fbm(x, y) {
  var s = 0, amp = 0.5, f = 1, tot = 0, o;
  for (o = 0; o < 4; o++) {
    s += amp * noise2(x * f, y * f);
    tot += amp;
    amp *= 0.5; f *= 2;
  }
  return s / tot;
}
function cfbm(x, y) { return fbm(x, y) - 0.5; }
function lakeAmp(u, v, lake) {
  var du = u - lake.u, dv = v - lake.v;
  var d2 = du * du + dv * dv;
  return lake.amp * Math.exp(-d2 / (2 * lake.sig * lake.sig));
}
/* ---- the scalar field: domain-warped fbm plus two basin lakes ---- */
function fieldAt(u, v, t) {
  var tx = t * 0.05, ty = t * 0.037;
  var wx = cfbm(u * 2.2 + 3.7 + tx, v * 2.2 + 9.2 + ty);
  var wy = cfbm(u * 2.2 + 8.4 - ty, v * 2.2 + 2.6 + tx);
  var f = cfbm(u * 5.0 + 1.6 * wx, v * 5.0 + 1.6 * wy);
  f += 0.22 * Math.sin((u * 3.4 + wy * 0.8) * TAU + t * 0.03);
  f += 0.18 * Math.cos((v * 2.9 + wx * 0.6) * TAU - t * 0.02);
  f += lakeAmp(u, v, LAKE1);
  f += lakeAmp(u, v, LAKE2);
  return f;
}
function bandColor(f) {
  var b = Math.floor((f - L0) / LSTEP);
  var shade = Math.floor(b / 2) % 3;
  if (shade < 0) shade += 3;
  if (b % 2 === 0) return LIGHT_BANDS[shade];
  return DARK_BANDS[shade];
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var fieldTime = FIELD_T0;
var off = null;
try {
  if (typeof document !== 'undefined' && document.createElement) {
    off = document.createElement('canvas');
    off.width = FILL_GRID; off.height = FILL_GRID;
  }
} catch (e) { off = null; }
var offCtx = null;
if (off) {
  try { offCtx = off.getContext('2d'); } catch (e) { offCtx = null; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- alternating band fills, classified per pixel from the field ---- */
function drawFills(st, t) {
  var gx, gy, f;
  if (offCtx) {
    var img = offCtx.createImageData(FILL_GRID, FILL_GRID);
    var data = img.data;
    var idx = 0;
    for (gy = 0; gy < FILL_GRID; gy++) {
      for (gx = 0; gx < FILL_GRID; gx++) {
        f = fieldAt((gx + 0.5) / FILL_GRID, (gy + 0.5) / FILL_GRID, t);
        var c = hexRgb(bandColor(f));
        data[idx] = c[0]; data[idx + 1] = c[1]; data[idx + 2] = c[2]; data[idx + 3] = 255;
        idx += 4;
      }
    }
    offCtx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, st.x, st.y, st.w, st.h);
  } else {
    var cw = st.w / FILL_GRID, ch = st.h / FILL_GRID;
    for (gy = 0; gy < FILL_GRID; gy++) {
      for (gx = 0; gx < FILL_GRID; gx++) {
        f = fieldAt((gx + 0.5) / FILL_GRID, (gy + 0.5) / FILL_GRID, t);
        ctx.fillStyle = bandColor(f);
        ctx.fillRect(st.x + gx * cw, st.y + gy * ch, cw + 1.0, ch + 1.0);
      }
    }
  }
}
/* ---- marching squares: real iso-contour extraction from the field ---- */
function drawContours(st, t) {
  var n = MG + 1, i, j;
  var vals = new Array(n * n);
  for (j = 0; j < n; j++) {
    for (i = 0; i < n; i++) {
      vals[j * n + i] = fieldAt(i / MG, j / MG, t);
    }
  }
  var cw = st.w / MG, ch = st.h / MG;
  ctx.lineWidth = Math.max(0.75, st.w / 900);
  ctx.strokeStyle = VEIN;
  var li, lvl, x0, y0, x1, y1, x2, y2, x3, y3;
  var a, b, c, d, ci;
  function edgeX(ax, ay, av, bx, by, bv) {
    var s = (lvl - av) / (bv - av);
    if (s < 0) s = 0; if (s > 1) s = 1;
    return [ax + (bx - ax) * s, ay + (by - ay) * s];
  }
  for (li = 0; li < NLEVELS; li++) {
    lvl = L0 + (li + 1) * LSTEP;
    ctx.beginPath();
    for (j = 0; j < MG; j++) {
      for (i = 0; i < MG; i++) {
        a = vals[j * n + i];
        b = vals[j * n + i + 1];
        c = vals[(j + 1) * n + i + 1];
        d = vals[(j + 1) * n + i];
        ci = 0;
        if (a > lvl) ci |= 1;
        if (b > lvl) ci |= 2;
        if (c > lvl) ci |= 4;
        if (d > lvl) ci |= 8;
        if (ci === 0 || ci === 15) continue;
        x0 = st.x + i * cw; y0 = st.y + j * ch;
        x1 = st.x + (i + 1) * cw; y1 = st.y + j * ch;
        x2 = st.x + (i + 1) * cw; y2 = st.y + (j + 1) * ch;
        x3 = st.x + i * cw; y3 = st.y + (j + 1) * ch;
        var top = edgeX(x0, y0, a, x1, y1, b);
        var right = edgeX(x1, y1, b, x2, y2, c);
        var bottom = edgeX(x3, y3, d, x2, y2, c);
        var left = edgeX(x0, y0, a, x3, y3, d);
        function seg(p, q) {
          ctx.moveTo(p[0], p[1]);
          ctx.lineTo(q[0], q[1]);
        }
        if (ci === 1 || ci === 14) seg(left, top);
        else if (ci === 2 || ci === 13) seg(top, right);
        else if (ci === 3 || ci === 12) seg(left, right);
        else if (ci === 4 || ci === 11) seg(right, bottom);
        else if (ci === 5) { seg(left, top); seg(right, bottom); }
        else if (ci === 6 || ci === 9) seg(top, bottom);
        else if (ci === 7 || ci === 8) seg(left, bottom);
        else if (ci === 10) { seg(left, bottom); seg(top, right); }
      }
    }
    ctx.stroke();
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  drawFills(st, fieldTime);
  drawContours(st, fieldTime);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Agate Field').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Agate Field').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 14').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Agate Field', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 14', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the veins crawl.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    fieldAt: function (u, v, t) { return fieldAt(u, v, t); },
    fieldTime: function () { return fieldTime; },
    levels: function () { return NLEVELS; },
    lakes: function () {
      var found = 0, k;
      var lakes = [LAKE1, LAKE2];
      for (k = 0; k < lakes.length; k++) {
        var lc = fieldAt(lakes[k].u, lakes[k].v, FIELD_T0);
        var ring = fieldAt(lakes[k].u + lakes[k].sig * 2.2, lakes[k].v, FIELD_T0);
        if (lc > ring + 0.1) found++;
      }
      return found;
    },
    fieldRange: function (t) {
      var mn = 99, mx = -99, i, j, f;
      for (j = 0; j <= 40; j++) {
        for (i = 0; i <= 40; i++) {
          f = fieldAt(i / 40, j / 40, t);
          if (f < mn) mn = f;
          if (f > mx) mx = f;
        }
      }
      return { min: mn, max: mx };
    },
    crossings: function (t) {
      var lvl = L0 + 6 * LSTEP;
      var n = 0, i, prev = fieldAt(0, 0.5, t), cur;
      for (i = 1; i <= 200; i++) {
        cur = fieldAt(i / 200, 0.5, t);
        if ((prev - lvl) * (cur - lvl) < 0) n++;
        prev = cur;
      }
      return n;
    },
    drawAt: function (t) { fieldTime = t; draw(); }
  };
}
/* ---- frame one: fixed phase t = 0, field frozen at its seed state ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, lastDraw = 0, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      clockT = (now - t0) / 1000;
      if (now - lastDraw >= REDRAW_MS) {
        lastDraw = now;
        fieldTime = clockT;
        var hidden = false;
        try { hidden = document.hidden; } catch (e) { hidden = false; }
        if (!hidden) draw();
      }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
