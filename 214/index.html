<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.214 Sky Scroll</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EDE6D2; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.214 Sky Scroll (David Bowen). A ballpoint plotter drawing the
// sky on warm paper. A procedural cloud field drifts; the machine
// renders it in short parallel hatch strokes, dense where the cloud
// is thick, dissolving into bare paper at the edges, the little red
// nib working back and forth in bands at a plotter's pace. When a
// drawing finishes the scroll advances: the finished sky slides
// down into the stack at the bottom edge and a fresh sheet starts
// on a new sky. Double tap advances the scroll early.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#EDE6D2';
var INK = '#2A4FA8', SHADOW = '#5A6A8A', NIB = '#8A2A1A';
var W = 0, H = 0, phone = false;
var seed = 214214;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
var T = 0, lastNow = -1;

// ---- the cloud field: value noise, 4 octaves, on a coarse grid ----------------------
function makeNoise(sd) {
  var r = rng(sd), perm = [];
  for (var i = 0; i < 256; i++) perm.push(i);
  for (i = 255; i > 0; i--) { var j = (r() * (i + 1)) | 0, t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  var lat = new Array(256);
  for (i = 0; i < 256; i++) lat[i] = r();
  function val(ix, iy) { return lat[perm[(perm[ix & 255] + iy) & 255]]; }
  function sm(k) { return k * k * (3 - 2 * k); }
  return function (x, y) {
    var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    var a = val(ix, iy), b = val(ix + 1, iy), c = val(ix, iy + 1), d = val(ix + 1, iy + 1);
    return lerp(lerp(a, b, sm(fx)), lerp(c, d, sm(fx)), sm(fy));
  };
}
function cloudDensity(nz, x, y, t) {
  var dx = t * 0.006, dy = t * 0.0016;
  var v = nz(x * 0.055 + dx, y * 0.055 + dy) * 0.50
        + nz(x * 0.12 + 31 + dx * 1.7, y * 0.12 + 7 + dy) * 0.27
        + nz(x * 0.26 + 57, y * 0.26 + 19) * 0.15
        + nz(x * 0.55 + 91, y * 0.55 + 43) * 0.08;
  v = (v - 0.35) * 2.5;                        // threshold into cloud cover
  var edge = Math.min(x / 12, 1) * Math.min(y / 16, 1) * Math.min((120 - x) / 14, 1) * Math.min((84 - y) / 16, 1);
  return clamp(v, 0, 1) * clamp(edge, 0, 1);
}

// ---- one drawing: a precomputed hatch stroke list -------------------------------------
// Field space: 120 x 84 sample units, 28 bands. Strokes are emitted
// band by band, alternating direction (boustrophedon) = nib order.
var BANDS = 34, FW = 120, FH = 84;
function buildDrawing(sd, tRef) {
  var nz = makeNoise(sd), r = rng(sd ^ 0xbeef), strokes = [];
  for (var b = 0; b < BANDS; b++) {
    var fy = (b + 0.5) / BANDS * FH;
    var xs = [];
    for (var gx = 0; gx <= 110; gx++) xs.push(gx / 110 * FW);
    if (b % 2 === 1) xs.reverse();
    for (var s = 0; s < xs.length; s++) {
      var fx = xs[s];
      var d = cloudDensity(nz, fx, fy, tRef);
      if (d < 0.10) continue;
      var lvl = d < 0.34 ? 1 : (d < 0.60 ? 2 : 3);
      var len = (0.85 + d * 1.0) * (0.7 + r() * 0.6);
      var dirx = (b % 2 === 1) ? -1 : 1;
      strokes.push({
        x: fx / FW, y: fy / FH,
        dx: dirx * len / FW, dy: (r() - 0.5) * 0.9 / FH,
        lvl: lvl, alpha: 0.30 + d * 0.62, shadow: d > 0.55 && r() < 0.4
      });
      // stipple build-up: a second, offset stroke in the thick of it
      if (d > 0.45 && r() < d) {
        strokes.push({
          x: (fx + 0.4) / FW, y: (fy + 0.9) / FH,
          dx: dirx * len * 0.85 / FW, dy: (r() - 0.5) * 0.9 / FH,
          lvl: lvl, alpha: (0.30 + d * 0.62) * 0.8, shadow: d > 0.6 && r() < 0.35
        });
      }
    }
  }
  return strokes;
}

// ---- the scroll machine -----------------------------------------------------------------
var DWELL = 3.5, DRAW_T = 25, SCROLL_T = 2.2;
var cur = null, curAge = 0, stack = [], phase = 'draw', phaseT = 0, scrollFrom = null;
var skySeed = seed;
function newSky() {
  skySeed = (skySeed * 1664525 + 1013904223) >>> 0;
  return buildDrawing(skySeed, T + rand() * 40);
}
cur = newSky();
curAge = DRAW_T * 0.5; // frame one: half plotted, nib mid-frame
phaseT = curAge;
// two finished skies already wait in the stack
stack.push(newSky()); stack.push(newSky());
function advanceScroll() {
  if (phase === 'scroll') return;
  scrollFrom = cur; phase = 'scroll'; phaseT = 0;
}
function machineStep(dt) {
  phaseT += dt;
  if (phase === 'draw') {
    curAge = phaseT;
    if (phaseT >= DRAW_T + DWELL) advanceScroll();
  } else if (phase === 'scroll') {
    if (phaseT >= SCROLL_T) {
      stack.unshift(scrollFrom);
      if (stack.length > 3) stack.length = 3;
      scrollFrom = null;
      cur = newSky();
      curAge = 0; phase = 'draw'; phaseT = 0;
    }
  }
}
function revealOf(age) { return clamp(age / DRAW_T, 0, 1); }

// ---- input ---------------------------------------------------------------------------------
var lastDownT = -9;
canvas.addEventListener('pointerdown', function (e) {
  if (T - lastDownT < 0.35) { advanceScroll(); lastDownT = -9; }
  else lastDownT = T;
});

// ---- resize -----------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing -------------------------------------------------------------------------------------
function drawStrokes(strokes, count, ox, oy, dw, dh, clipBottom) {
  var n = Math.floor(count);
  ctx.lineCap = 'round';
  if (clipBottom > 0) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, clipBottom); ctx.clip(); }
  for (var i = 0; i < n && i < strokes.length; i++) {
    var s = strokes[i];
    ctx.strokeStyle = s.shadow ? SHADOW : INK;
    ctx.globalAlpha = s.alpha;
    ctx.lineWidth = Math.max(0.6, s.lvl * (phone ? 0.62 : 0.8));
    var x = ox + s.x * dw, y = oy + s.y * dh;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + s.dx * dw, y + s.dy * dh);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (clipBottom > 0) ctx.restore();
}
function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && time > 0) { var dt = Math.min(0.05, (time - lastNow) / 1000); T += dt; machineStep(dt); }
  lastNow = time;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(120,105,80,0.05)';
  var gr = rng(99);
  for (var i = 0; i < 130; i++) ctx.fillRect(gr() * W, gr() * H, 1.3, 1.3);
  var dh = H * 0.86, top = H * 0.015;
  var scrollOff = 0;
  if (phase === 'scroll') { var k = phaseT / SCROLL_T; scrollOff = (k * k * (3 - 2 * k)) * dh; }
  // the current drawing
  var reveal = phase === 'draw' ? revealOf(curAge) : 1;
  drawStrokes(cur, cur.length * reveal, 0, top + scrollOff, W, dh, 0);
  // the finished stack: peeking tops below, newest nearest; during a
  // scroll the whole stack eases down one peek to make room
  var peek = H * 0.045;
  var stackShift = phase === 'scroll' ? (scrollOff / dh) * peek : 0;
  for (var si = Math.min(stack.length, 3) - 1; si >= 0; si--) {
    var baseY = H - (si + 1) * peek + stackShift;
    drawStrokes(stack[si], stack[si].length, 0, baseY, W, dh, H);
    // the stack sheet edge
    ctx.strokeStyle = 'rgba(90,80,60,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, baseY); ctx.lineTo(W, baseY); ctx.stroke();
  }
  // the outgoing drawing, once scrolled past, joins as the newest stack sheet
  if (phase === 'scroll' && scrollFrom) {
    var landY = H - peek - dh + scrollOff;
    drawStrokes(scrollFrom, scrollFrom.length, 0, landY, W, dh, H);
  }
  // the nib: visible only while drawing
  if (phase === 'draw' && reveal > 0 && reveal < 1) {
    var idx = Math.min(cur.length - 1, Math.floor(cur.length * reveal));
    var s = cur[idx];
    var nx = s.x * W, ny = top + s.y * dh;
    var ns = Math.max(4, Math.min(W, H) * 0.009);
    ctx.fillStyle = NIB;
    ctx.beginPath();
    ctx.moveTo(nx, ny + ns * 1.5);
    ctx.lineTo(nx - ns * 0.62, ny - ns * 0.4);
    ctx.lineTo(nx + ns * 0.62, ny - ns * 0.4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(138,42,26,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(nx, ny - ns * 0.4); ctx.lineTo(nx, ny - ns * 2.4); ctx.stroke();
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
