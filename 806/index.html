<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Orange Bars</title>
<style>
  html, body { margin: 0; padding: 0; background: #F6F3EC; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): the white ground and the one orange. Nothing else.
  var GROUND = '#F6F3EC';
  var BAR = '#E06A1B';

  var LOOP = 36; // seconds, seamless

  // The panorama: a wide horizontal band. On a landscape frame it fills
  // the frame wall to wall. On a portrait frame it sits centered as a 3:1
  // band; the ground continues above and below in the same white, so the
  // band's edge is invisible and only the bars' height gives it away.
  // The bars: width = W/8, nominal centers at W/4 and 3W/4, spanning the
  // band's full height. Drift: +/-5% of W on slow sines with integer
  // period ratios over the loop (bar one: 1 cycle, bar two: 2 cycles),
  // so the loop closes exactly and neither bar ever leaves its quarter
  // zone (0.20W..0.30W and 0.70W..0.80W). At t = 0 both sines are 0:
  // frame one is the nominal quarters, no phase offset.

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function viewportSize() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
  }

  function isPhone(w, h) {
    var sw = 0, sh = 0;
    if (window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return h > w * 1.15;
  }

  function bandRect(w, h) {
    if (h > w) {
      var bh = Math.round(w / 3);
      return { y: Math.round((h - bh) / 2), h: bh };
    }
    return { y: 0, h: h };
  }

  var layout = null;
  var currentT = 0;

  function draw(t) {
    currentT = t;
    var size = viewportSize();
    if (!layout || layout.w !== size.w || layout.h !== size.h) {
      canvas.width = size.w;
      canvas.height = size.h;
      layout = { w: size.w, h: size.h, phone: isPhone(size.w, size.h), band: bandRect(size.w, size.h) };
    }
    canvas.style.width = size.w + 'px';
    canvas.style.height = size.h + 'px';

    var w = layout.w;
    var band = layout.band;
    var p = (t / LOOP) * Math.PI * 2;

    // the ground, absolute, wall to wall
    ctx.globalAlpha = 1;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, w, layout.h);

    // the two bars, and nothing else
    var bw = w / 8;
    var c1 = w * (0.25 + 0.05 * Math.sin(p));
    var c2 = w * (0.75 + 0.05 * Math.sin(2 * p));
    ctx.fillStyle = BAR;
    ctx.fillRect(Math.round(c1 - bw / 2), band.y, Math.round(bw), band.h);
    ctx.fillRect(Math.round(c2 - bw / 2), band.y, Math.round(bw), band.h);
  }

  // frame one: synchronous, loop t = 0, bars at the nominal quarters
  draw(0);

  var start = null;
  function frame(ts) {
    if (start === null) start = ts;
    draw(((ts - start) / 1000) % LOOP);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

  function onResize() { draw(currentT); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
