<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Until Observed</title>
<style>
  html, body { margin: 0; padding: 0; background: #020203; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.886 "Until Observed" (study #108 bnsh_av, PP47 "Superposition").
   A field of particles, each a smear of four ghost positions.
   Observation collapses them; release lets them decohere back into ghosts.
   Frame one is the synchronous draw at t=0. No wall clock is ever read. */

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- canvas / viewport ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

function isPhone() {
  try {
    var s = window.screen;
    if (s) { var m = Math.min(s.width, s.height); if (m > 0 && m < 700) return true; }
  } catch (e) {}
  return H > W * 1.15;
}

function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.round(w)); H = Math.max(1, Math.round(h));
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
window.addEventListener('resize', resize);
resize();

// ---------- palette (strict) ----------
var COL_BG = '#020203';
var COL_GHOST = '#4A4A52';
var COL_POINT = '#FFFFFF';
var COL_FRONT = '#8A8A86';

// ---------- field ----------
// Positions are kept in "width units": x in [0,1] across the frame,
// y in the same units (so y ranges over [0, H/W]). Distances, ghost
// radii and the wavefront speed are all measured in these units.
var PHONE = isPhone();
var N = PHONE ? 110 : 150;
var GHOSTS = 4;
var rng = mulberry32(886047);
var particles = [];
for (var i = 0; i < N; i++) {
  var p = {
    bx: 0.04 + rng() * 0.92,
    byf: 0.05 + rng() * 0.90,            // fraction of height
    wobAx: 0.004 + rng() * 0.006,        // slow drift wander, closed form in t
    wobAy: 0.004 + rng() * 0.006,
    wobFx: 0.05 + rng() * 0.08,
    wobFy: 0.05 + rng() * 0.08,
    wobPx: rng() * Math.PI * 2,
    wobPy: rng() * Math.PI * 2,
    ghosts: []
  };
  for (var g = 0; g < GHOSTS; g++) {
    p.ghosts.push({
      ang: rng() * Math.PI * 2,
      rad: 0.010 + rng() * 0.020,        // smear radius in width units
      shimF: 0.25 + rng() * 0.55,        // shimmer frequency
      shimP: rng() * Math.PI * 2,
      rotF: 0.05 + rng() * 0.12,         // slow rotation of the offset
      alpha: 0.34 + rng() * 0.30
    });
  }
  particles.push(p);
}

// ---------- observation events ----------
// Each source is a recorded event; a particle's collapse is a closed-form
// function of the event list and t.
//   field source : {x, y, t0, t1, rMax}   t1 null while the pointer is down
//   global source: {global:true, x, y, t0, holdUntil}
// Front speed in width units per second; collapse ramp per particle 0.4 s;
// decoherence time constant ~1.0 s (certainty essentially gone in ~3 s).
var FRONT_SPEED = 0.35;
var GLOBAL_SPEED = 0.95;
var RAMP = 0.4;
var TAU_DECO = 1.0;
var sources = [];
var activeSrc = null;
var downInfo = null;
var lastTap = { t: -10, src: null };

function srcCollapse(s, d, t) {
  var sp = s.global ? GLOBAL_SPEED : FRONT_SPEED;
  if (!s.global && d > s.rMax) return 0;
  var ta = s.t0 + d / sp;                // wavefront arrival time
  if (t < ta) return 0;
  var rel = s.global ? s.holdUntil : s.t1;
  if (rel !== null && rel !== undefined && t > rel) {
    if (rel < ta) return 0;              // released before the front arrived
    var cAt = Math.min(1, (rel - ta) / RAMP);
    return cAt * Math.exp(-(t - rel) / TAU_DECO);
  }
  return Math.min(1, (t - ta) / RAMP);
}

function particleCoherence(px, py, t) {
  var c = 0;
  for (var i = 0; i < sources.length; i++) {
    var s = sources[i];
    var dx = px - s.x, dy = py - s.y;
    var v = srcCollapse(s, Math.sqrt(dx * dx + dy * dy), t);
    if (v > c) c = v;
  }
  return 1 - c;                          // 1 = full ghost cloud, 0 = collapsed
}

// ---------- audio (lazy, gesture-gated, typeof-guarded) ----------
// The ghost chorus: a few detuned faint sines whose detune width follows
// the field's mean coherence. Collapse narrows them to one clear tone.
var AC = null, chorusOsc = null, chorusGain = null, lastAudioT = -1;
var CHORUS_SPREAD = [-42, -21, 0, 21, 42]; // cents at full coherence
function ensureAudio() {
  if (AC) { if (AC.resume) AC.resume(); return; }
  try {
    var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext
      : (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null;
    if (!Ctor) return;
    AC = new Ctor();
    chorusGain = AC.createGain();
    chorusGain.gain.value = 0.0;
    chorusGain.connect(AC.destination);
    chorusOsc = [];
    for (var i = 0; i < CHORUS_SPREAD.length; i++) {
      var o = AC.createOscillator();
      o.type = 'sine';
      o.frequency.value = 196;
      o.detune.value = CHORUS_SPREAD[i];
      var og = AC.createGain();
      og.gain.value = i === 2 ? 0.5 : 0.3;
      o.connect(og); og.connect(chorusGain);
      o.start();
      chorusOsc.push(o);
    }
    chorusGain.gain.setTargetAtTime(0.045, AC.currentTime, 1.5);
  } catch (e) { AC = null; chorusOsc = null; }
}
function updateAudio(meanCoh, t) {
  if (!AC || !chorusOsc) return;
  if (t - lastAudioT < 0.12) return;
  lastAudioT = t;
  try {
    var ct = AC.currentTime;
    for (var i = 0; i < chorusOsc.length; i++) {
      chorusOsc[i].detune.setTargetAtTime(CHORUS_SPREAD[i] * meanCoh, ct, 0.25);
    }
  } catch (e) {}
}

// ---------- pointer ----------
var nowT = 0;
function evtPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cx = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cy = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: cx / W, y: cy / W };
}
canvas.addEventListener('pointerdown', function (e) {
  ensureAudio();
  var p = evtPos(e), t = nowT;
  if (e.preventDefault) e.preventDefault();
  // double-tap: total observation
  if (t - lastTap.t < 0.35 && lastTap.src) {
    lastTap.src.t1 = t;                  // retire the first pinpoint at once
    sources.push({ global: true, x: p.x, y: p.y, t0: t, holdUntil: t + 2.0, rMax: Infinity });
    lastTap = { t: -10, src: null };
    activeSrc = null;
    downInfo = { t: t, x: p.x, y: p.y, moved: true, global: true };
    return;
  }
  var s = { global: false, x: p.x, y: p.y, t0: t, t1: null, rMax: Infinity };
  sources.push(s);
  activeSrc = s;
  downInfo = { t: t, x: p.x, y: p.y, moved: false, global: false };
});
canvas.addEventListener('pointermove', function (e) {
  if (!activeSrc || !downInfo) return;
  var p = evtPos(e), t = nowT;
  var dx = p.x - activeSrc.x, dy = p.y - activeSrc.y;
  if (Math.sqrt(dx * dx + dy * dy) > 0.05) {
    // the front follows the finger: close this source, open a new one
    activeSrc.t1 = t;
    var s = { global: false, x: p.x, y: p.y, t0: t, t1: null, rMax: Infinity };
    sources.push(s);
    activeSrc = s;
    downInfo.moved = true;
  }
});
function endPointer(e) {
  if (!downInfo) return;
  var t = nowT;
  if (activeSrc) {
    if (!downInfo.global && !downInfo.moved && (t - downInfo.t) < 0.30) {
      // a tap: pinpoint collapse, brief hold, then release
      activeSrc.rMax = 0.06;
      activeSrc.t1 = activeSrc.t0 + 1.1;
      lastTap = { t: t, src: activeSrc };
    } else {
      activeSrc.t1 = t;
    }
    activeSrc = null;
  }
  downInfo = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// ---------- draw ----------
function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = COL_BG;
  ctx.fillRect(0, 0, W, H);

  var aspect = H / W;
  var ghostR = Math.max(1.1, W * 0.0021);
  var pointR = Math.max(1.2, W * 0.0016);
  var sumCoh = 0;

  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var px = p.bx + p.wobAx * Math.sin(p.wobFx * t + p.wobPx);
    var py = p.byf * aspect + p.wobAy * Math.sin(p.wobFy * t + p.wobPy);
    var h = particleCoherence(px, py, t);
    sumCoh += h;
    var sx = px * W, sy = py * W;

    // ghosts: the smear, shrinking and fading as coherence falls
    if (h > 0.01) {
      ctx.fillStyle = COL_GHOST;
      for (var g = 0; g < GHOSTS; g++) {
        var gh = p.ghosts[g];
        var rr = gh.rad * h * (1 + 0.28 * Math.sin(gh.shimF * t + gh.shimP));
        var aa = gh.ang + gh.rotF * t + 0.18 * Math.sin(gh.shimF * 0.7 * t + gh.shimP * 1.7);
        ctx.globalAlpha = gh.alpha * h;
        ctx.beginPath();
        ctx.arc(sx + Math.cos(aa) * rr * W, sy + Math.sin(aa) * rr * W, ghostR, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // the collapsed point: one sharp bright position
    var cAmt = 1 - h;
    if (cAmt > 0.01) {
      ctx.globalAlpha = Math.min(1, cAmt * 1.15);
      ctx.fillStyle = COL_POINT;
      ctx.beginPath();
      ctx.arc(sx, sy, pointR, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // wavefront rings for fronts still spreading
  ctx.globalAlpha = 1;
  for (var i = 0; i < sources.length; i++) {
    var s = sources[i];
    var sp = s.global ? GLOBAL_SPEED : FRONT_SPEED;
    var rel = s.global ? s.holdUntil : s.t1;
    if (rel !== null && rel !== undefined && t > rel) continue;
    var r = sp * (t - s.t0);
    var maxR = s.global ? 1.8 : (s.rMax === Infinity ? 1.8 : s.rMax);
    if (r <= 0.004 || r >= maxR) continue;
    ctx.globalAlpha = 0.30 * Math.max(0, 1 - r / maxR) + 0.06;
    ctx.strokeStyle = COL_FRONT;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * W, r * W, 0, Math.PI * 2);
    ctx.stroke();
  }

  // readout: the specced state word + collapsed percentage (small, bottom)
  var meanCoh = sumCoh / particles.length;
  var collapsedPct = Math.round((1 - meanCoh) * 100);
  var word = collapsedPct >= 50 ? 'COLLAPSED' : 'COHERENT';
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = COL_FRONT;
  ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(word + ' \u00B7 ' + collapsedPct + '%', W / 2, H - 12);
  ctx.globalAlpha = 1;

  updateAudio(meanCoh, t);

  // prune long-dead sources (their collapse has fully decohered)
  for (var i = sources.length - 1; i >= 0; i--) {
    var s2 = sources[i];
    var rel2 = s2.global ? s2.holdUntil : s2.t1;
    if (rel2 !== null && rel2 !== undefined && t > rel2 + 5 && s2 !== activeSrc) {
      sources.splice(i, 1);
    }
  }
}

// ---------- loop ----------
draw(0);
var startTs = null;
function frame(ts) {
  if (startTs === null) startTs = ts;
  nowT = (ts - startTs) / 1000;
  draw(nowT);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
</script>
</body>
</html>
