<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Five Is Forbidden</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0C0C0E; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function phase(t, a, b) { return clamp01((t - a) / (b - a)); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }
var TILE = '#EDE6D3', MORTAR = '#2A2D33', MIS = '#8A6FA8', BG = '#0C0C0E';

var tiles = [], mismatches = [], R = 40, A1 = null, A2 = null, C0 = null;
function polySample(cx, cy, r, n, rot, N) {
  // N points sampled evenly by arc length around an n-gon
  var verts = [], i, a;
  for (i = 0; i < n; i++) {
    a = rot + i * 2 * Math.PI / n;
    verts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  var per = [], total = 0, out = [];
  for (i = 0; i < n; i++) {
    var d = Math.hypot(verts[(i + 1) % n][0] - verts[i][0], verts[(i + 1) % n][1] - verts[i][1]);
    per.push(d); total += d;
  }
  var dist = 0, ei = 0, acc = 0, k, f;
  for (k = 0; k < N; k++) {
    var want = total * k / N;
    while (ei < n - 1 && acc + per[ei] < want) { acc += per[ei]; ei++; }
    f = per[ei] ? (want - acc) / per[ei] : 0;
    out.push([verts[ei][0] + (verts[(ei + 1) % n][0] - verts[ei][0]) * f,
              verts[ei][1] + (verts[(ei + 1) % n][1] - verts[ei][1]) * f]);
    dist = want;
  }
  return out;
}
function hash(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function build() {
  tiles = []; mismatches = [];
  if (!W) return;
  R = Math.min(W, H) / 10.5;
  var dx = 1.5 * R, dy = Math.sqrt(3) * R;
  var cols = Math.ceil(W / dx) + 3, rows = Math.ceil(H / dy) + 3;
  var i, j, idx = 0;
  for (j = 0; j < rows; j++) for (i = 0; i < cols; i++) {
    var x = i * dx - R, y = j * dy + (i % 2 ? dy / 2 : 0) - R;
    // the honest translation attempt: copy the pentagon on the same lattice,
    // and let the error accumulate with the column, as translation does
    var ax = x + i * R * 0.11, ay = y + i * R * 0.045;
    tiles.push({ hx: x, hy: y, ax: ax, ay: ay, rx: ax, ry: ay, rot: (Math.floor(hash(idx) * 5)) * Math.PI / 5, idx: idx });
    idx++;
  }
  C0 = tiles[Math.floor(tiles.length / 2)];
  A1 = [0, Math.sqrt(3) * R]; A2 = [1.5 * R, Math.sqrt(3) * R / 2]; // primitive lattice vectors
  // relaxation: the translated pentagons genuinely collide (their lattice
  // is too tight for five-fold), so neighbours push apart until nothing
  // overlaps; only a weak anchor keeps the field from leaving entirely.
  // The push-apart is non-uniform: that is the failure, made visible.
  var minD = 1.92 * R, it, p, q, ddx, ddy, d, push;
  for (it = 0; it < 90; it++) {
    for (i = 0; i < tiles.length; i++) {
      p = tiles[i];
      for (j = i + 1; j < tiles.length; j++) {
        q = tiles[j];
        ddx = q.rx - p.rx; ddy = q.ry - p.ry;
        d = Math.hypot(ddx, ddy);
        if (d > 0.001 && d < minD) {
          push = (minD - d) / 2;
          p.rx -= ddx / d * push; p.ry -= ddy / d * push;
          q.rx += ddx / d * push; q.ry += ddy / d * push;
        }
      }
      p.rx += (p.ax - p.rx) * 0.012; p.ry += (p.ay - p.ry) * 0.012;
    }
  }
  // where translation failed, mark it: the copies the relaxation had to
  // shove farthest from where pure translation put them
  var cand = [];
  for (i = 0; i < tiles.length; i++) {
    p = tiles[i];
    var disp = Math.hypot(p.rx - p.ax, p.ry - p.ay);
    if (disp > R * 0.30 && p.hx > 0 && p.hx < W && p.hy > 0 && p.hy < H) cand.push({ ax: p.ax, ay: p.ay, rx: p.rx, ry: p.ry, d: disp });
  }
  cand.sort(function (a, b) { return b.d - a.d; });
  mismatches = cand.slice(0, 24);
}

var LOOP = 30, OFFSET = 21; // frame one: the five-fold drift, well under way
function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  var t = ((now / 1000 + OFFSET) % LOOP + LOOP) % LOOP;
  var morph = smooth(phase(t, 10, 16));       // hexagons become pentagons
  var relax = smooth(phase(t, 16, 24));       // and settle into quasiperiodic order
  var i, p, cxp, cyp;
  var N = 50;

  for (i = 0; i < tiles.length; i++) {
    p = tiles[i];
    var axp = p.hx + (p.ax - p.hx) * morph;
    var ayp = p.hy + (p.ay - p.hy) * morph;
    cxp = axp + (p.rx - axp) * relax;
    cyp = ayp + (p.ry - ayp) * relax;
    var hex = polySample(cxp, cyp, R * 0.97, 6, 0, N);
    var pen = polySample(cxp, cyp, R * 0.94, 5, -Math.PI / 2 + p.rot * morph, N);
    ctx.beginPath();
    for (var k = 0; k < N; k++) {
      var gx = hex[k][0] + (pen[k][0] - hex[k][0]) * morph;
      var gy = hex[k][1] + (pen[k][1] - hex[k][1]) * morph;
      // pull the outline in a touch so the mortar shows between tiles
      gx = cxp + (gx - cxp) * 0.94; gy = cyp + (gy - cyp) * 0.94;
      if (k === 0) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
    }
    ctx.closePath();
    ctx.fillStyle = TILE; ctx.fill();
    ctx.strokeStyle = MORTAR; ctx.lineWidth = 1.4; ctx.stroke();
  }

  // the true unit cell, outlined once while six-fold still holds
  if (t < 11 && C0) {
    var ua = 1 - phase(t, 10, 11);
    ctx.strokeStyle = 'rgba(42,45,51,' + (0.55 + 0.35 * Math.sin(t / 10 * Math.PI * 2)) + ')';
    ctx.globalAlpha = ua;
    ctx.lineWidth = 2.6;
    var c = [C0.hx, C0.hy];
    ctx.beginPath();
    ctx.moveTo(c[0], c[1]);
    ctx.lineTo(c[0] + A1[0], c[1] + A1[1]);
    ctx.lineTo(c[0] + A1[0] + A2[0], c[1] + A1[1] + A2[1]);
    ctx.lineTo(c[0] + A2[0], c[1] + A2[1]);
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = MORTAR;
    [[0, 0], A1, A2, [A1[0] + A2[0], A1[1] + A2[1]]].forEach(function (o) {
      ctx.beginPath(); ctx.arc(c[0] + o[0], c[1] + o[1], 3, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // mismatch points glow where the translation failed
  if (t >= 15) {
    var ma = phase(t, 17, 23);
    for (i = 0; i < mismatches.length; i++) {
      p = mismatches[i];
      var mx = p.ax + (p.rx - p.ax) * relax * 0.35;
      var my = p.ay + (p.ry - p.ay) * relax * 0.35;
      ctx.fillStyle = 'rgba(138,111,168,' + (0.22 * ma).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(mx, my, R * 0.30, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(138,111,168,' + (0.9 * ma).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(mx, my, Math.max(2.4, R * 0.075), 0, Math.PI * 2); ctx.fill();
    }
  }

  if (t >= 24) {
    ctx.fillStyle = 'rgba(12,12,14,' + ((t - 24) / 6 * 0.96).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

resize();
draw(0);
function frame(ts) {
  draw(ts || 0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
