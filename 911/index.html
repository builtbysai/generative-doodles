<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>spherical inversion and trigonometry</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAFAF8; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  No.911 "spherical inversion and trigonometry" (study #111 simondavidryden, PP72).
  One black trig curve bent through a spherical inversion on a paper-white
  ground, with the tool's own live parameter panel printed top-left in
  monospace: sph_invertion, x, y, zoom, time, sphRadius, with star-bar
  meters. The panel is the piece's own readout, specced text.
  Frame one is the synchronous draw at t = 0 with the specced defaults
  (zoom 5.1, sphRadius 0.7, time 0.2, highlight on x). Every parameter is
  a closed-form function of (t, recorded pointer events). No wall clock
  feeds the image. Sound (first gesture only) is one pure sine whose
  pitch is the drawn curve's mean curvature; the zero state is silent.
*/

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- seeded RNG (mulberry32); kept for house parity, the piece
   itself is fully analytic and consumes no randomness ---------- */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(91172);
rng(); /* stream opened and unused: determinism is analytic, not sampled */

/* ---------- viewport ---------- */
var W = 0, H = 0, DPR = 1, isPhone = false;

function viewportSize() {
  var w, h;
  if (typeof window !== 'undefined' && window.visualViewport &&
      typeof window.visualViewport.width === 'number') {
    w = window.visualViewport.width; h = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && typeof window.innerWidth === 'number') {
    w = window.innerWidth; h = window.innerHeight;
  } else {
    w = 1280; h = 900;
  }
  return { w: Math.max(50, Math.round(w)), h: Math.max(50, Math.round(h)) };
}

function resize() {
  var s = viewportSize();
  W = s.w; H = s.h;
  DPR = 1;
  if (typeof window !== 'undefined' && typeof window.devicePixelRatio === 'number') {
    DPR = Math.min(2, Math.max(1, window.devicePixelRatio));
  }
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen) {
    sw = window.screen.width || 0; sh = window.screen.height || 0;
  }
  isPhone = (sw > 0 && sh > 0 && Math.min(sw, sh) < 700) || (H > W * 1.15);
}

/* ---------- recorded pointer events ---------- */
/* dragSamples: {t, dx, dy} per pointermove. taps: {t} per classified tap.
   Everything the piece shows is derived from these two logs and t. */
var dragSamples = [];
var taps = [];
var pDown = null; /* {t, x, y, moved} while a pointer is down */

var nowSec = 0;

function onDown(e) {
  ensureAudio();
  var p = evtPos(e);
  pDown = { t: nowSec, x: p.x, y: p.y, lx: p.x, ly: p.y, moved: 0 };
}
function onMove(e) {
  if (!pDown) return;
  var p = evtPos(e);
  var dx = p.x - pDown.lx, dy = p.y - pDown.ly;
  pDown.lx = p.x; pDown.ly = p.y;
  pDown.moved += Math.abs(dx) + Math.abs(dy);
  if (dx !== 0 || dy !== 0) dragSamples.push({ t: nowSec, dx: dx, dy: dy });
}
function onUp(e) {
  if (!pDown) return;
  var dur = nowSec - pDown.t;
  if (dur < 0.35 && pDown.moved < 8) taps.push({ t: nowSec });
  pDown = null;
}
function evtPos(e) {
  var x = 0, y = 0;
  if (e && typeof e.clientX === 'number') { x = e.clientX; y = e.clientY; }
  else if (e && e.touches && e.touches[0]) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
  else if (e && e.changedTouches && e.changedTouches[0]) { x = e.changedTouches[0].clientX; y = e.changedTouches[0].clientY; }
  return { x: x, y: y };
}
if (canvas && typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}

/* ---------- gesture derivation (closed form over the logs) ---------- */
/* A tap resolves 0.35 s after it lands: two taps within 0.35 s pair into
   one double-tap (a zero-state event at the second tap), singles step the
   highlighted panel row. */
function deriveGestures(t) {
  var singles = 0, zeroStart = -1, i, gap;
  var sorted = taps.slice().sort(function (a, b) { return a.t - b.t; });
  i = 0;
  while (i < sorted.length) {
    if (i + 1 < sorted.length && (sorted[i + 1].t - sorted[i].t) < 0.35) {
      if (sorted[i + 1].t <= t) zeroStart = sorted[i + 1].t;
      i += 2;
    } else {
      if (sorted[i].t + 0.35 <= t) singles += 1;
      i += 1;
    }
  }
  gap = zeroStart >= 0 ? t - zeroStart : -1;
  return {
    highlight: singles % 5,
    zero: (gap >= 0 && gap < 4) ? zeroStart : -1
  };
}

function dragTotals(t) {
  var dx = 0, dy = 0, i, s;
  for (i = 0; i < dragSamples.length; i++) {
    s = dragSamples[i];
    if (s.t <= t) { dx += s.dx; dy += s.dy; }
  }
  return { dx: dx, dy: dy };
}

/* ---------- parameters (closed form of t and the logs) ---------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function paramsAt(t) {
  var g = deriveGestures(t);
  if (g.zero >= 0) {
    return { x: 0, y: 0, zoom: 0, time: 0, sph: 0, hi: g.highlight, zero: true };
  }
  var d = dragTotals(t);
  var timeRaw = 0.2 + 0.15 * t;
  return {
    x: 1.6 * Math.sin(t * 0.11) + 0.4 * Math.sin(t * 0.043 + 1.7),
    y: 1.5 * Math.cos(t * 0.083 + 0.6) + 0.5 * Math.sin(t * 0.031),
    zoom: clamp(5.1 + 0.010 * d.dx, 1, 10),
    time: timeRaw - 10 * Math.floor(timeRaw / 10),
    sph: clamp(0.7 - 0.004 * d.dy, 0, 2),
    hi: g.highlight,
    zero: false
  };
}

/* ---------- layout ---------- */
function fontPx() { return isPhone ? 10 : 15; }

function layout() {
  var fp = fontPx();
  var charW = fp * 0.62;
  var panelW = Math.ceil(27 * charW) + 20;
  var rx0 = Math.max(panelW + 16, Math.round(W * 0.27));
  return {
    fp: fp,
    panelX: Math.round(W * 0.035),
    panelY: Math.round(H * 0.045),
    rx0: rx0,
    ry0: Math.round(H * 0.05),
    rx1: Math.round(W * 0.985),
    ry1: Math.round(H * 0.96)
  };
}

/* ---------- the curve ---------- */
/* Base trig curve in region-local unit space, then spherical inversion
   about a center low-left of the region, then a zoom scale about the
   region center. Returns screen points plus the mean curvature. */
function curvePoints(t, P, L) {
  var N = 400, pts = [], i, u;
  var phase = (0.2 + 0.15 * t) * 0.8;
  var cx = -0.18, cy = 1.18; /* inversion center, low-left of the region */
  var R = P.sph * 1.30;
  var R2 = R * R;
  var zf = P.zoom / 5.1;
  var rw = L.rx1 - L.rx0, rh = L.ry1 - L.ry0;
  if (P.zero) {
    for (i = 0; i < N; i++) {
      u = i / (N - 1);
      pts.push({ x: L.rx0 + (0.03 + 0.94 * u) * rw, y: L.ry0 + (0.92 - 0.84 * u) * rh });
    }
    return { pts: pts, curv: 0 };
  }
  var raw = [];
  for (i = 0; i < N; i++) {
    u = i / (N - 1);
    var bx = u;
    var by = 0.60 - 0.34 * u
      + 0.115 * Math.sin(u * 5.0 + phase + P.x * 1.2)
      + 0.062 * Math.cos(u * 9.0 + P.y * 1.5)
      + 0.045 * Math.sin(u * 2.2 - phase * 0.6);
    var dx = bx - cx, dy = by - cy;
    var d2 = dx * dx + dy * dy;
    if (d2 < 0.012) d2 = 0.012;
    var k = R2 / d2;
    var ix = cx + dx * k, iy = cy + dy * k;
    /* fixed framing fit (constants measured over the full LFO cycle at
       the defaults, so the arc stays inside the region as it breathes),
       then the live zoom scales about the arc's home center */
    ix = 0.14 + ix * 0.95;
    iy = 0.33 + iy * 0.72;
    ix = 0.45 + (ix - 0.45) * zf;
    iy = 0.50 + (iy - 0.50) * zf;
    raw.push({ x: ix, y: iy });
  }
  for (i = 0; i < N; i++) {
    pts.push({ x: L.rx0 + raw[i].x * rw, y: L.ry0 + raw[i].y * rh });
  }
  /* mean curvature of the drawn polyline: mean turning angle per point,
     length-normalised and soft-clamped into 0..1 */
  var sum = 0, cnt = 0;
  for (i = 1; i < N - 1; i++) {
    var ax = pts[i].x - pts[i - 1].x, ay = pts[i].y - pts[i - 1].y;
    var bx2 = pts[i + 1].x - pts[i].x, by2 = pts[i + 1].y - pts[i].y;
    var la = Math.sqrt(ax * ax + ay * ay), lb = Math.sqrt(bx2 * bx2 + by2 * by2);
    if (la < 0.001 || lb < 0.001) continue;
    var dot = (ax * bx2 + ay * by2) / (la * lb);
    if (dot > 1) dot = 1; if (dot < -1) dot = -1;
    sum += Math.acos(dot) / ((la + lb) * 0.5);
    cnt += 1;
  }
  var meanK = cnt > 0 ? sum / cnt : 0;
  var curv = clamp((meanK - 0.004) * 22, 0, 1);
  return { pts: pts, curv: curv };
}

/* ---------- panel ---------- */
var ROW_NAMES = ['x', 'y', 'zoom', 'time', 'sphRadius'];
function fmt(v) {
  var s = v.toFixed(1);
  return s === '-0.0' ? '0.0' : s;
}
function starsFor(idx, P) {
  var n = 0;
  if (idx === 0) n = Math.round(Math.abs(P.x) / 2 * 10);
  else if (idx === 1) n = Math.round(Math.abs(P.y) / 2 * 10);
  else if (idx === 2) n = Math.round(P.zoom / 10 * 10);
  else if (idx === 3) n = Math.round(P.time / 10 * 10);
  else n = Math.round(P.sph / 2 * 10);
  if (n < 0) n = 0; if (n > 10) n = 10;
  var s = '';
  for (var i = 0; i < n; i++) s += '*';
  return s;
}
function rowValue(idx, P) {
  if (idx === 0) return P.x;
  if (idx === 1) return P.y;
  if (idx === 2) return P.zoom;
  if (idx === 3) return P.time;
  return P.sph;
}
function padName(name) {
  var s = name;
  while (s.length < 9) s += ' ';
  return s;
}

function drawPanel(P, L) {
  var fp = L.fp;
  var lh = Math.round(fp * 1.45);
  ctx.textBaseline = 'top';
  ctx.font = fp + 'px "DejaVu Sans Mono", "Courier New", monospace';
  var x0 = L.panelX, y0 = L.panelY;
  ctx.fillStyle = '#333333';
  ctx.fillText('sph_invertion', x0, y0);
  for (var i = 0; i < 5; i++) {
    var y = y0 + lh * (i + 1);
    var label = padName(ROW_NAMES[i]) + ' [' + fmt(rowValue(i, P)) + ']';
    var stars = starsFor(i, P);
    var labelW = ctx.measureText(label + ' ').width;
    if (i === P.hi) {
      ctx.fillStyle = '#000000';
      ctx.fillText(label, x0, y);
      ctx.fillText(label, x0 + 0.6, y);
      ctx.fillText(stars, x0 + labelW, y);
      ctx.fillText(stars, x0 + labelW + 0.6, y);
    } else {
      ctx.fillStyle = '#333333';
      ctx.fillText(label, x0, y);
      ctx.fillStyle = '#666666';
      ctx.fillText(stars, x0 + labelW, y);
    }
  }
}

/* ---------- audio: one pure sine, pitch = mean curvature ---------- */
var AC = null, osc = null, oscGain = null, audioTried = false;
function ensureAudio() {
  if (audioTried) return;
  audioTried = true;
  try {
    var Ctor = null;
    if (typeof window !== 'undefined') {
      if (typeof window.AudioContext === 'function') Ctor = window.AudioContext;
      else if (typeof window.webkitAudioContext === 'function') Ctor = window.webkitAudioContext;
    }
    if (!Ctor) return;
    AC = new Ctor();
    osc = AC.createOscillator();
    oscGain = AC.createGain();
    osc.type = 'sine';
    osc.frequency.value = 200;
    oscGain.gain.value = 0;
    osc.connect(oscGain);
    oscGain.connect(AC.destination);
    osc.start();
  } catch (err) {
    AC = null; osc = null; oscGain = null;
  }
}
function updateAudio(curv, zero) {
  if (!AC || !osc || !oscGain) return;
  try {
    if (AC.state === 'suspended' && typeof AC.resume === 'function') AC.resume();
    var tc = AC.currentTime;
    osc.frequency.setTargetAtTime(200 + 400 * curv, tc, 0.05);
    oscGain.gain.setTargetAtTime(zero ? 0 : 0.045, tc, 0.08);
  } catch (err) { /* audio is garnish; the picture never depends on it */ }
}

/* ---------- draw ---------- */
function draw(t) {
  if (!W || !H) resize();
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#FAFAF8';
  ctx.fillRect(0, 0, W, H);
  var P = paramsAt(t);
  var L = layout();
  var C = curvePoints(t, P, L);
  ctx.strokeStyle = '#0A0A0A';
  ctx.lineWidth = Math.max(1.2, Math.min(W, H) * 0.0022);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (var i = 0; i < C.pts.length; i++) {
    if (i === 0) ctx.moveTo(C.pts[i].x, C.pts[i].y);
    else ctx.lineTo(C.pts[i].x, C.pts[i].y);
  }
  ctx.stroke();
  drawPanel(P, L);
  updateAudio(C.curv, P.zero);
}

/* ---------- run ---------- */
resize();
draw(0);
var startStamp = null;
function frame(ts) {
  if (startStamp === null) startStamp = ts;
  nowSec = (ts - startStamp) / 1000;
  draw(nowSec);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('resize', function () { resize(); draw(nowSec); });
}
if (typeof window !== 'undefined' && window.visualViewport &&
    typeof window.visualViewport.addEventListener === 'function') {
  window.visualViewport.addEventListener('resize', function () { resize(); draw(nowSec); });
}
</script>
</body>
</html>
