<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tape and Scissors</title>
<style>
html, body { margin: 0; padding: 0; background: #8a6a48; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (prompt only, no other color).
  var WOOD = '#8a6a48';
  var CREAM = '#e8e0d0';
  var GREY = '#d8d2c4';
  var TEAL = '#2e6f6a';
  var SCARLET = '#c1272d';
  var STEEL = '#9a9a9a';
  var CHARCOAL = '#2a2a30';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Seeded per-strip splice marks (fixed fractions of strip width).
  var rng = mulberry32(1475000);
  function seededSplices() {
    var n = 1 + Math.floor(rng() * 2);
    var out = [];
    for (var i = 0; i < n; i++) out.push(0.22 + rng() * 0.56);
    return out;
  }

  // Three strips, each bound to one looping scene. Order = stack top to bottom.
  var strips = [
    { scene: 0, color: CREAM, cut: false, fresh: false, splices: seededSplices() },
    { scene: 1, color: GREY, cut: false, fresh: false, splices: seededSplices() },
    { scene: 2, color: TEAL, cut: false, fresh: false, splices: seededSplices() }
  ];
  var order = [0, 1, 2];
  var selected = 0; // strip index; default = top strip
  var drag = null; // {id, startX, dx, moved}
  var scissorsTap = false;

  function vpSize() {
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      return [visualViewport.width, visualViewport.height];
    }
    return [window.innerWidth, window.innerHeight];
  }

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    var s = vpSize();
    return s[1] > s[0] * 1.15;
  }

  // Layout: three rows, each a scene frame above its strip. Scissors lower right.
  function layout(vw, vh) {
    var top = vh * 0.04;
    var pitch = vh * 0.31;
    var rowH = vh * 0.28;
    var rows = [];
    for (var p = 0; p < 3; p++) {
      var ry = top + p * pitch;
      rows.push({
        frame: { x: vw * 0.10, y: ry, w: vw * 0.72, h: rowH * 0.58 },
        strip: { x: vw * 0.08, y: ry + rowH * 0.66, w: vw * 0.76, h: rowH * 0.26 }
      });
    }
    var sc = Math.min(vw, vh) * 0.09;
    return {
      rows: rows,
      scissors: { cx: vw * 0.90, cy: vh * 0.90, s: sc, hit: 34 }
    };
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- Scenes (all closed-form over t; phase 1 = second half after a cut) ----

  function drawRoom(fx, fy, fw, fh, t, phase) {
    rect(fx, fy, fw, fh, CREAM);
    rect(fx, fy + fh * 0.70, fw, fh * 0.30, WOOD);
    var loop = 12;
    var lt = t % loop;
    var spk = Math.floor(lt / 4) % 3;
    if (phase === 1) spk = 2 - spk;
    for (var i = 0; i < 3; i++) {
      var cx = fx + fw * (0.20 + i * 0.30);
      var by = fy + fh * 0.70;
      var bodyC = i === 0 ? CHARCOAL : (i === 1 ? TEAL : GREY);
      var tilt = 0;
      if (i === spk) tilt = Math.sin(t * 1.4) * 0.06;
      var hx = cx + tilt * fh * 0.3;
      var hy = fy + fh * 0.42 + (i === spk ? Math.sin(t * 2.2) * fh * 0.012 : 0);
      rect(cx - fw * 0.055, by - fh * 0.28, fw * 0.11, fh * 0.28, bodyC);
      dot(hx, hy, fh * 0.07, CHARCOAL);
      if (i === spk) {
        // Rising voice-line: zigzag polyline above the speaker's head.
        ctx.strokeStyle = TEAL;
        ctx.lineWidth = Math.max(2, fh * 0.02);
        ctx.beginPath();
        var vx = hx, vy = hy - fh * 0.10;
        ctx.moveTo(vx, vy);
        for (var k = 1; k <= 4; k++) {
          vx += (k % 2 === 0 ? -1 : 1) * fw * 0.02;
          vy -= fh * 0.05;
          ctx.lineTo(vx, vy);
        }
        ctx.stroke();
      }
    }
  }

  function drawCrowd(fx, fy, fw, fh, t, phase) {
    rect(fx, fy, fw, fh, WOOD);
    var n = 7;
    for (var i = 0; i < n; i++) {
      var cx = fx + fw * (0.10 + i * 0.133);
      var by = fy + fh * 0.88;
      var bodyC = [CHARCOAL, TEAL, CREAM, GREY, CHARCOAL, TEAL, CREAM][i];
      var nod = Math.sin(t * 1.6 + i * 0.9) * fh * 0.02;
      if (phase === 1) nod = -nod;
      rect(cx - fw * 0.045, by - fh * 0.30, fw * 0.09, fh * 0.30, bodyC);
      dot(cx, by - fh * 0.36 + nod, fh * 0.075, CREAM);
    }
  }

  function drawMonitors(fx, fy, fw, fh, t, phase) {
    rect(fx, fy, fw, fh, CHARCOAL);
    var pat = Math.floor(t / 2) % 3;
    if (phase === 1) pat = (pat + 1) % 3;
    var scrC = [CREAM, GREY, TEAL];
    for (var i = 0; i < 3; i++) {
      var mx = fx + fw * (0.08 + i * 0.32);
      var my = fy + fh * 0.18;
      var mw = fw * 0.24, mh = fh * 0.64;
      rect(mx, my, mw, mh, CHARCOAL);
      rect(mx + mw * 0.08, my + mh * 0.08, mw * 0.84, mh * 0.84, scrC[(i + pat) % 3]);
      // Flickering abstract blocks inside each screen.
      var bcol = [TEAL, SCARLET, CHARCOAL][(i + pat) % 3];
      var bx = mx + mw * (0.15 + 0.12 * ((i + pat) % 3));
      var by = my + mh * (0.20 + 0.15 * (pat % 2));
      rect(bx, by, mw * 0.22, mh * 0.18, bcol);
      rect(mx + mw * 0.60, my + mh * 0.55, mw * 0.18, mh * 0.14, bcol);
    }
  }

  var sceneFns = [drawRoom, drawCrowd, drawMonitors];
  var sceneLoops = [12, 8, 6];

  function drawScene(strip, fx, fy, fw, fh, t) {
    var loop = sceneLoops[strip.scene];
    var phase = 0;
    if (strip.cut) {
      var lt = t % loop;
      phase = lt >= loop / 2 ? 1 : 0;
    }
    ctx.save();
    ctx.beginPath();
    ctx.rect(fx, fy, fw, fh);
    ctx.clip();
    sceneFns[strip.scene](fx, fy, fw, fh, t, phase);
    ctx.restore();
  }

  // ---- Scissors (lower right; steel blades, scarlet handle loops) ----
  function drawScissors(cx, cy, s) {
    ctx.strokeStyle = STEEL;
    ctx.lineWidth = Math.max(2, s * 0.08);
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.5, cy + s * 0.5);
    ctx.lineTo(cx + s * 0.4, cy - s * 0.5);
    ctx.moveTo(cx + s * 0.5, cy + s * 0.5);
    ctx.lineTo(cx - s * 0.4, cy - s * 0.5);
    ctx.stroke();
    ctx.strokeStyle = SCARLET;
    ctx.lineWidth = Math.max(2, s * 0.10);
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.5 + s * 0.22, cy + s * 0.5);
    ctx.arc(cx - s * 0.5, cy + s * 0.5, s * 0.22, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.5 + s * 0.22, cy + s * 0.5);
    ctx.arc(cx + s * 0.5, cy + s * 0.5, s * 0.22, 0, Math.PI * 2);
    ctx.stroke();
    dot(cx, cy - s * 0.02, s * 0.07, CHARCOAL);
  }

  // ---- Full frame ----
  function draw(t) {
    var s = vpSize();
    var vw = s[0], vh = s[1];
    canvas.width = vw;
    canvas.height = vh;
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    var L = layout(vw, vh);
    rect(0, 0, vw, vh, WOOD);
    for (var p = 0; p < 3; p++) {
      var st = strips[order[p]];
      var row = L.rows[p];
      var dx = (drag && drag.id === order[p]) ? drag.dx : 0;
      // Scene frame (charcoal border, scene inside).
      rect(row.frame.x + dx - 4, row.frame.y - 4, row.frame.w + 8, row.frame.h + 8, CHARCOAL);
      drawScene(st, row.frame.x + dx, row.frame.y, row.frame.w, row.frame.h, t);
      // Tape strip.
      var sx = row.strip.x + dx, sy = row.strip.y, sw = row.strip.w, sh = row.strip.h;
      if (st.cut) {
        var gap = Math.max(3, sw * 0.012);
        var half = (sw - gap) / 2;
        rect(sx, sy, half, sh, st.color);
        rect(sx + half + gap, sy, half, sh, st.color);
        rect(sx + half, sy, gap, sh, SCARLET);
      } else {
        rect(sx, sy, sw, sh, st.color);
      }
      // Seeded splice marks.
      for (var i = 0; i < st.splices.length; i++) {
        rect(sx + sw * st.splices[i], sy, 3, sh, SCARLET);
      }
      // Fresh splice line at the join after a reorder swap.
      if (st.fresh) rect(sx + sw - 6, sy, 3, sh, SCARLET);
      // Selected strip: charcoal outline.
      if (order[p] === selected) {
        ctx.strokeStyle = CHARCOAL;
        ctx.lineWidth = 3;
        ctx.strokeRect(sx - 2, sy - 2, sw + 4, sh + 4);
      }
    }
    drawScissors(L.scissors.cx, L.scissors.cy, L.scissors.s);
  }

  // ---- Pointer handling ----
  function hitStrip(x, y) {
    var s = vpSize();
    var L = layout(s[0], s[1]);
    for (var p = 0; p < 3; p++) {
      var row = L.rows[p];
      // Generous hit area: frame + strip + the gap between them.
      if (x >= row.frame.x - 10 && x <= row.frame.x + row.frame.w + 10 &&
          y >= row.frame.y - 10 && y <= row.strip.y + row.strip.h + 10) {
        return order[p];
      }
    }
    return -1;
  }

  function inScissors(x, y) {
    var s = vpSize();
    var L = layout(s[0], s[1]);
    return Math.abs(x - L.scissors.cx) <= L.scissors.hit &&
           Math.abs(y - L.scissors.cy) <= L.scissors.hit;
  }

  function onDown(x, y) {
    if (inScissors(x, y)) { scissorsTap = true; return; }
    var id = hitStrip(x, y);
    if (id >= 0) drag = { id: id, startX: x, dx: 0, moved: false };
  }

  function onMove(x, y) {
    if (!drag) return;
    drag.dx = x - drag.startX;
    if (Math.abs(drag.dx) > 4) drag.moved = true;
  }

  function onUp(x, y) {
    if (scissorsTap) {
      scissorsTap = false;
      if (inScissors(x, y)) {
        var st = strips[selected];
        if (!st.cut) st.cut = true;
      }
      return;
    }
    if (!drag) return;
    var d = drag;
    drag = null;
    if (Math.abs(d.dx) >= 80) {
      var p = order.indexOf(d.id);
      if (d.dx > 0 && p < 2) {
        var tmp = order[p]; order[p] = order[p + 1]; order[p + 1] = tmp;
        strips[d.id].fresh = true;
      } else if (d.dx < 0 && p > 0) {
        var tmp2 = order[p]; order[p] = order[p - 1]; order[p - 1] = tmp2;
        strips[d.id].fresh = true;
      }
    } else if (!d.moved) {
      selected = d.id;
    }
  }

  canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY); });
  canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
  canvas.addEventListener('pointerup', function (e) { onUp(e.clientX, e.clientY); });
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
    if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
      visualViewport.addEventListener('resize', function () { draw(lastT); });
    }
  }

  var lastT = 0;
  var booted = false;
  var t0 = 0;
  function loop(ts) {
    if (!booted) { booted = true; t0 = ts; }
    lastT = (ts - t0) / 1000;
    draw(lastT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }

  // Synchronous first frame at a constant phase (determinism gate).
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

  // Probe interface (also used by the QA harness).
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: function (t) { lastT = t; draw(t); },
      down: onDown, move: onMove, up: onUp,
      order: function () { return order.slice(); },
      selected: function () { return selected; },
      cut: function (id) { return strips[id].cut; },
      fresh: function (id) { return strips[id].fresh; },
      layout: function () {
        var s = vpSize();
        return layout(s[0], s[1]);
      }
    };
  }
})();
</script>
</body>
</html>
