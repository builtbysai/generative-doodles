<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watson's Halo</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FFFFFF;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  // Frame one is the sim state after a fixed synchronous pre-roll:
  // 12 simulated seconds (720 fixed steps of 1/60s) from the seeded
  // initial state, so the thumb is reproducible byte for byte.
  var DT = 1 / 60;
  var PREROLL_STEPS = 720; // 12s
  var T0 = PREROLL_STEPS * DT;
  var WORLD = 1000;
  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');
  var view = { w: 0, h: 0, dpr: 1, scale: 1, ox: 0, oy: 0, phone: false };

  var COLORS = {
    ground: '#FFFFFF',
    corridor: '#EDEBE8',
    ring: '#F0503C',
    label: '#F0503C'
  };
  var SWARM = ['#FF6B5A', '#2FB8B0', '#F5A66B', '#FFFFFF']; // coral, teal, peach, white

  var CENTER = { x: 500, y: 468 };
  var RING_R = 225;          // ring diameter = 45% of frame
  var RING_DOTS = 72;
  var N_DOTS = 180;
  var ATTN_RADIUS = 460;     // world units: dots this near the pointer feel it
  var ATTN_RAMP = 0.9;       // seconds for attention to reach full strength

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function mulberry(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Seeded swarm --------------------------------------------------
  // Each dot: a home anchor seeded inside/around the ring, a depth
  // weight (size), a palette colour, and seeded phases for the slow
  // curl-ish wander of its home. Positions/velocities are sim state.
  var rnd = mulberry(1099);
  var dots = [];
  for (var i = 0; i < N_DOTS; i++) {
    var ang = rnd() * Math.PI * 2;
    // Bias homes toward the ring's disc and a soft shell just outside it.
    var rr = RING_R * (0.12 + 0.95 * Math.pow(rnd(), 0.7));
    var depth = 0.6 + rnd() * 0.75;
    dots.push({
      hx: CENTER.x + Math.cos(ang) * rr,
      hy: CENTER.y + Math.sin(ang) * rr,
      x: 0, y: 0, vx: 0, vy: 0,
      r: (3.4 + rnd() * 4.6) * depth,
      depth: depth,
      color: SWARM[Math.floor(rnd() * SWARM.length)],
      wob1: rnd() * Math.PI * 2, wob2: rnd() * Math.PI * 2,
      wobF1: 0.05 + rnd() * 0.06, wobF2: 0.04 + rnd() * 0.05,
      wobA: 10 + rnd() * 16,
      // where this dot sits inside the gathered cloud at the pointer
      gx: (rnd() - 0.5) * 130, gy: (rnd() - 0.5) * 130,
      jit: rnd() * Math.PI * 2
    });
  }
  // Start at home so the pre-roll only has to settle the wander.
  for (i = 0; i < N_DOTS; i++) { dots[i].x = dots[i].hx; dots[i].y = dots[i].hy; }

  // Home position at sim time t: anchor plus slow seeded wander
  // (sums of sines standing in for curl drift — analytic, no state).
  function homeAt(d, t) {
    return {
      x: d.hx + Math.sin(t * d.wobF1 * Math.PI * 2 + d.wob1) * d.wobA
               + Math.sin(t * 0.021 + d.wob2) * 6,
      y: d.hy + Math.cos(t * d.wobF2 * Math.PI * 2 + d.wob2) * d.wobA
               + Math.cos(t * 0.017 + d.wob1) * 6
    };
  }

  // ---- Interaction state ----------------------------------------------
  var pointer = { down: false, x: CENTER.x, y: CENTER.y };
  var attn = 0;              // 0..1, ramps while the pointer is down
  var pulseT = -Infinity;    // sim time of the last pointer-down

  // ---- Fixed-timestep sim ----------------------------------------------
  var simT = 0;
  function step(dt) {
    simT += dt;
    if (pointer.down) attn = Math.min(1, attn + dt / ATTN_RAMP);
    else attn = Math.max(0, attn - dt / (ATTN_RAMP * 1.6));
    for (var i = 0; i < N_DOTS; i++) {
      var d = dots[i];
      var home = homeAt(d, simT);
      var tx = home.x, ty = home.y, k = 5.5, c = 3.4;
      if (attn > 0) {
        var dxp = pointer.x - d.x, dyp = pointer.y - d.y;
        var distP = Math.sqrt(dxp * dxp + dyp * dyp);
        var w = attn * clamp(1 - distP / ATTN_RADIUS, 0, 1);
        if (w > 0) {
          var gx = pointer.x + d.gx * 0.55, gy = pointer.y + d.gy * 0.55;
          tx = lerp(tx, gx, w);
          ty = lerp(ty, gy, w);
          k = lerp(k, 13, w);
          c = lerp(c, 4.6, w);
        }
      }
      // A breath of seeded jitter so the swarm never looks machined.
      tx += Math.sin(simT * 0.9 + d.jit) * 2.2;
      ty += Math.cos(simT * 0.8 + d.jit * 1.7) * 2.2;
      d.vx += ((tx - d.x) * k - d.vx * c) * dt;
      d.vy += ((ty - d.y) * k - d.vy * c) * dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
    }
  }
  for (var s = 0; s < PREROLL_STEPS; s++) step(DT);

  // ---- View -------------------------------------------------------------
  function resize() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    }
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(vw * dpr));
    canvas.height = Math.max(1, Math.round(vh * dpr));
    var screenMin = 0;
    if (window.screen) screenMin = Math.min(window.screen.width || 0, window.screen.height || 0);
    var phone = screenMin > 0 ? screenMin < 700 : vh > vw * 1.15;
    var scale = Math.min(vw / WORLD, vh / WORLD);
    view = {
      w: vw, h: vh, dpr: dpr, scale: scale,
      ox: (vw - WORLD * scale) / 2,
      oy: (vh - WORLD * scale) / 2,
      phone: phone
    };
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
  }
  window.addEventListener('resize', function () { resize(); draw(); });
  resize();

  function ringRadius(t) {
    return RING_R * (1 + 0.028 * Math.sin(t * Math.PI * 2 / 9));
  }

  function softDot(x, y, r, color, haloColor) {
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = haloColor;
    ctx.beginPath(); ctx.arc(x, y, r * 2.3, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.20;
    ctx.beginPath(); ctx.arc(x, y, r * 1.45, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawCorridor() {
    ctx.strokeStyle = COLORS.corridor;
    ctx.lineWidth = 2;
    // Nested frames converging on the centre: a corridor in plan.
    var scales = [0.52, 0.78, 1.08];
    for (var i = 0; i < scales.length; i++) {
      var hw = 500 * scales[i], hh = 468 * scales[i];
      ctx.globalAlpha = 0.55;
      ctx.strokeRect(CENTER.x - hw, CENTER.y - hh, hw * 2, hh * 2);
    }
    // Radiants from the vanishing point to the frame corners and edges.
    ctx.globalAlpha = 0.45;
    var targets = [[0, 0], [1000, 0], [0, 1000], [1000, 1000],
                   [500, 0], [500, 1000], [0, 500], [1000, 500]];
    ctx.beginPath();
    for (i = 0; i < targets.length; i++) {
      ctx.moveTo(CENTER.x, CENTER.y);
      ctx.lineTo(targets[i][0], targets[i][1]);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawRing(t) {
    var R = ringRadius(t);
    // The pulse fired on pointer-down: one dotted echo expanding out.
    var pu = (t - pulseT) / 1.15;
    if (pu >= 0 && pu < 1) {
      ctx.fillStyle = COLORS.ring;
      var pr = R + 12 + 64 * pu;
      var pn = 56;
      ctx.globalAlpha = 0.5 * (1 - pu);
      for (var j = 0; j < pn; j++) {
        var pa = (j / pn) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(CENTER.x + Math.cos(pa) * pr, CENTER.y + Math.sin(pa) * pr,
                2.6 * (1 - pu * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // The halo itself: individual coral dots on the circumference,
    // swelling slightly with attention.
    var bump = 1 + 0.35 * attn + (pu >= 0 && pu < 1 ? 0.5 * (1 - pu) : 0);
    ctx.fillStyle = COLORS.ring;
    for (var i = 0; i < RING_DOTS; i++) {
      var a = (i / RING_DOTS) * Math.PI * 2 + t * 0.02;
      var rr = R + Math.sin(a * 3 + t * 0.6) * 1.6;
      ctx.globalAlpha = 0.92;
      ctx.beginPath();
      ctx.arc(CENTER.x + Math.cos(a) * rr, CENTER.y + Math.sin(a) * rr,
              3.1 * bump, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    return R;
  }

  function draw() {
    canvas.style.width = view.w + 'px';
    canvas.style.height = view.h + 'px';
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = COLORS.ground;
    ctx.fillRect(0, 0, view.w, view.h);
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.scale, view.scale);

    drawCorridor();

    // Swarm, far (light) dots first so the near ones sit on top.
    var order = dots.slice().sort(function (a, b) { return a.depth - b.depth; });
    for (var i = 0; i < order.length; i++) {
      var d = order[i];
      // White dots need a whisper of warm grey halo to read on white.
      var halo = d.color === '#FFFFFF' ? '#E9E0D8' : d.color;
      softDot(d.x, d.y, d.r, d.color, halo);
    }

    var R = drawRing(simT);

    // The one specced word: the identity's name, quiet coral mono.
    ctx.fillStyle = COLORS.label;
    ctx.globalAlpha = 0.85;
    ctx.font = '500 25px "SF Mono", "Roboto Mono", Menlo, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('Watson', CENTER.x, CENTER.y + R + 34);
    ctx.globalAlpha = 1;
  }

  // ---- Pointer -----------------------------------------------------------
  function toWorld(ev) {
    var cx = ev.clientX, cy = ev.clientY;
    if (canvas.getBoundingClientRect) {
      var rect = canvas.getBoundingClientRect();
      cx -= rect.left; cy -= rect.top;
    }
    return { x: (cx - view.ox) / view.scale, y: (cy - view.oy) / view.scale };
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (ev) {
      var p = toWorld(ev);
      pointer.down = true; pointer.x = p.x; pointer.y = p.y;
      pulseT = simT;
      draw();
    });
    canvas.addEventListener('pointermove', function (ev) {
      if (!pointer.down) return;
      var p = toWorld(ev);
      pointer.x = p.x; pointer.y = p.y;
    });
    var release = function () { pointer.down = false; };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('pointerleave', release);
  }

  draw();

  if (typeof requestAnimationFrame === 'function') {
    var lastStamp = null;
    var acc = 0;
    var raf = function (stamp) {
      if (lastStamp === null) lastStamp = stamp;
      acc += Math.min((stamp - lastStamp) / 1000, 0.25);
      lastStamp = stamp;
      while (acc >= DT) { step(DT); acc -= DT; }
      draw();
      requestAnimationFrame(raf);
    };
    requestAnimationFrame(raf);
  }
})();
</script>
</body>
</html>
