<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DOTS (instruction no. 1)</title>
<style>
html, body { margin: 0; padding: 0; background: #F5F1E8; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var PAPER = '#F5F1E8';
var SHADOW = 'rgba(138,143,150,0.4)';
var GRIDLINE = 'rgba(42,42,40,0.10)';
var PALETTES = [
  ['#E63946', '#F4842C', '#F4D35E', '#43AA8B', '#3A86FF'],
  ['#E63946', '#F4842C', '#F4D35E', '#43AA8B', '#3A86FF', '#8338EC', '#FF006E'],
  ['#111111', '#6B6B6B', '#CFCFCF']
];
var N = 12, CELLS = N * N;
var BUILD = 24, HOLD = 8, XFADE = 4, CYCLE = BUILD + HOLD + XFADE;
var STAGGER = 0.15, FILL = 2;
var SEED = 1324000;

var W = 0, H = 0;
function size() {
  var vw = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.width : window.innerWidth;
  var vh = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.height : window.innerHeight;
  W = Math.round(vw); H = Math.round(vh);
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
size();
if (typeof window !== 'undefined') {
  window.addEventListener('resize', function () { size(); draw(pieceTime()); });
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', function () { size(); draw(pieceTime()); });
  }
}

var t0 = null;
function nowSec() {
  return (typeof performance !== 'undefined') ? performance.now() / 1000 : 0;
}
function pieceTime() {
  if (t0 === null) return 0;
  return Math.max(0, nowSec() - t0);
}

var taps = [];
var lastTap = -1;
canvas.addEventListener('pointerdown', function () {
  var t = pieceTime();
  if (lastTap >= 0 && (t - lastTap) < 0.4) { taps.push({ t: t }); lastTap = -1; }
  else { lastTap = t; }
});

function tapState(t) {
  var count = 0, base = 0;
  for (var i = 0; i < taps.length; i++) {
    if (taps[i].t <= t) { count++; base = taps[i].t; }
  }
  return { count: count, base: base };
}
function basePalette(count) {
  if (count === 0) return 0;
  return Math.floor(mulberry32(SEED + count * 7919)() * 3);
}
function cycleData(count, cycleIndex) {
  var rng = mulberry32(SEED + count * 7919 + cycleIndex * 104729);
  var order = [];
  for (var i = 0; i < CELLS; i++) order.push(i);
  for (var i = CELLS - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  var pal = PALETTES[(basePalette(count) + cycleIndex) % 3];
  var colors = [];
  for (var k = 0; k < CELLS; k++) colors.push(pal[Math.floor(rng() * pal.length)]);
  var hack = Math.floor(rng() * CELLS);
  var hackAngle = rng() * Math.PI * 2;
  return { order: order, colors: colors, hack: hack, hackAngle: hackAngle };
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function disc(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.closePath();
}
function halfMoon(cx, cy, r, a) {
  ctx.beginPath();
  ctx.moveTo(cx + r * Math.cos(a + Math.PI), cy + r * Math.sin(a + Math.PI));
  ctx.arc(cx, cy, r, a + Math.PI, a + Math.PI * 2);
  ctx.closePath();
}

function drawDot(cx, cy, r, color, progress, isHack, angle, alphaScale, cellSeed) {
  if (progress <= 0 || alphaScale <= 0) return;
  var ox = r * 0.14, oy = r * 0.18;
  ctx.save();
  ctx.globalAlpha = alphaScale;
  ctx.fillStyle = SHADOW;
  if (isHack) { halfMoon(cx + ox, cy + oy, r, angle); } else { disc(cx + ox, cy + oy, r); }
  ctx.fill();
  ctx.fillStyle = color;
  for (var k = 0; k < 3; k++) {
    var th = k / 3;
    if (progress > th) {
      var lp = clamp((progress - th) * 3, 0, 1);
      ctx.globalAlpha = alphaScale * (0.30 + 0.55 * lp);
      var rr = r * (0.55 + 0.45 * lp);
      if (isHack) { halfMoon(cx, cy, rr, angle); } else { disc(cx, cy, rr); }
      ctx.fill();
    }
  }
  if (progress > 0.5) {
    var rng = mulberry32(cellSeed);
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1, r * 0.05);
    for (var s = 0; s < 4; s++) {
      var a = rng() * Math.PI;
      var d = (rng() - 0.5) * r * 1.1;
      var half = Math.sqrt(Math.max(0, r * r - d * d)) * 0.92;
      var px = Math.cos(a), py = Math.sin(a);
      var qx = -py, qy = px;
      ctx.globalAlpha = alphaScale * 0.18;
      ctx.beginPath();
      ctx.moveTo(cx + qx * d - px * half, cy + qy * d - py * half);
      ctx.lineTo(cx + qx * d + px * half, cy + qy * d + py * half);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function draw(t) {
  size();
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  var S = Math.min(W, H);
  var grid = S * 0.76;
  var ox = (W - grid) / 2, oy = (H - grid) / 2;
  var cell = grid / N;
  var r = cell * 0.32;

  var st = tapState(t);
  var ct = t - st.base;
  // Phase-shifted 12 s so frame one opens mid-build: stencil plus most
  // dots filled, the last seeded cells still empty. Fixed phase, gate-valid.
  var ctS = ct + 12;
  var cycleIndex = Math.floor(ctS / CYCLE);
  var phase = ctS - cycleIndex * CYCLE;
  var data = cycleData(st.count, cycleIndex);

  ctx.strokeStyle = GRIDLINE;
  ctx.lineWidth = Math.max(1, cell * 0.02);
  ctx.beginPath();
  for (var g = 0; g <= N; g++) {
    ctx.moveTo(ox + g * cell, oy); ctx.lineTo(ox + g * cell, oy + grid);
    ctx.moveTo(ox, oy + g * cell); ctx.lineTo(ox + grid, oy + g * cell);
  }
  ctx.stroke();

  var grng = mulberry32(SEED + 7);
  ctx.fillStyle = 'rgba(42,42,40,0.05)';
  for (var f = 0; f < 160; f++) {
    var fx = ox + grng() * grid, fy = oy + grng() * grid;
    ctx.beginPath();
    ctx.moveTo(fx + 1, fy);
    ctx.arc(fx, fy, 1, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCycle(d, mode, alphaScale) {
    for (var p = 0; p < CELLS; p++) {
      var ci = d.order[p];
      var cx = ox + (ci % N) * cell + cell / 2;
      var cy = oy + Math.floor(ci / N) * cell + cell / 2;
      var prog;
      if (mode === 'full') { prog = 1; }
      else {
        var start = p * STAGGER;
        prog = clamp((phase - start) / FILL, 0, 1);
      }
      drawDot(cx, cy, r, d.colors[ci], prog, ci === d.hack, d.hackAngle, alphaScale, SEED + ci * 7 + cycleIndex * 131);
    }
  }

  if (phase < BUILD) {
    drawCycle(data, 'build', 1);
  } else if (phase < BUILD + HOLD) {
    drawCycle(data, 'full', 1);
  } else {
    var a = (phase - BUILD - HOLD) / XFADE;
    var next = cycleData(st.count, cycleIndex + 1);
    drawCycle(data, 'full', 1 - a);
    drawCycle(next, 'full', a);
  }
}

draw(0);
function loop() {
  draw(pieceTime());
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') {
  t0 = nowSec();
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
