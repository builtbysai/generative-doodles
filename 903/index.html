<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Em_p/t.'y</title>
<style>
  html, body { margin: 0; padding: 0; background: #B9C4C9; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(90364);

  // ---------- palette (strict) ----------
  var GROUND = [185, 196, 201]; // #B9C4C9
  var SHADE  = [138, 151, 158]; // #8A979E
  var LIGHT  = [220, 228, 232]; // #DCE4E8
  var MIST   = [210, 218, 223]; // #D2DADF
  var RIBBON = '#101314';
  var REDGE  = '#3A4348';

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return H > W * 1.15;
  }

  function resize() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width || 0; h = window.visualViewport.height || 0;
    }
    if (!w || !h) {
      w = (typeof window !== 'undefined' && window.innerWidth) || 720;
      h = (typeof window !== 'undefined' && window.innerHeight) || 720;
    }
    W = Math.max(50, Math.round(w)); H = Math.max(50, Math.round(h));
    DPR = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) {
      DPR = Math.min(window.devicePixelRatio, 2);
    }
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    buildTerrainGrid();
  }

  // ---------- seeded 2D value noise + fbm (the heightfield) ----------
  function hash2(ix, iy) {
    var n = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263)) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    var a = hash2(ix, iy), b = hash2(ix + 1, iy);
    var c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function fbm(x, y) {
    var v = 0, amp = 0.5, f = 1, tot = 0;
    for (var o = 0; o < 4; o++) {
      v += vnoise(x * f, y * f) * amp;
      tot += amp; amp *= 0.5; f *= 2.03;
    }
    return v / tot;
  }
  // Marbled height: domain-warped fbm, normalized to roughly 0..1.
  function baseH(nx, ny) {
    var wx = fbm(nx * 2.1 + 11.3, ny * 2.1 + 4.7);
    var wy = fbm(nx * 2.1 + 43.9, ny * 2.1 + 19.2);
    var h = fbm(nx * 3.3 + (wx - 0.5) * 2.6, ny * 3.3 + (wy - 0.5) * 2.6);
    h = (h - 0.5) * 1.3 + 0.5;
    return h < 0 ? 0 : (h > 1 ? 1 : h);
  }

  // ---------- carved valleys (analytic depression grid, interaction state) ----------
  var CG = 120; // carve grid is CG x CG over normalized space
  var carve = new Float32Array(CG * CG);
  function carveAt(nx, ny) {
    var i = Math.floor(nx * CG), j = Math.floor(ny * CG);
    if (i < 0) i = 0; if (i >= CG) i = CG - 1;
    if (j < 0) j = 0; if (j >= CG) j = CG - 1;
    return carve[j * CG + i];
  }
  function addCarve(nx, ny, depth, radiusCells) {
    var ci = nx * CG, cj = ny * CG, r = radiusCells;
    for (var j = Math.floor(cj - r); j <= Math.ceil(cj + r); j++) {
      if (j < 0 || j >= CG) continue;
      for (var i = Math.floor(ci - r); i <= Math.ceil(ci + r); i++) {
        if (i < 0 || i >= CG) continue;
        var d = Math.sqrt((i - ci) * (i - ci) + (j - cj) * (j - cj)) / r;
        if (d >= 1) continue;
        var fall = (1 - d) * (1 - d);
        var idx = j * CG + i;
        carve[idx] = Math.min(0.55, carve[idx] + depth * fall);
      }
    }
  }
  function effH(nx, ny) { return baseH(nx, ny) - carveAt(nx, ny); }
  // gradient of the effective field, in normalized units
  function gradAt(nx, ny) {
    var e = 0.004;
    var gx = (effH(nx + e, ny) - effH(nx - e, ny)) / (2 * e);
    var gy = (effH(nx, ny + e) - effH(nx, ny - e)) / (2 * e);
    return { x: gx, y: gy };
  }

  // ---------- terrain tone LUT (palette anchors only, interpolated) ----------
  var LUTN = 64;
  var lut = [];
  (function buildLUT() {
    var stops = [
      { v: 0.00, c: MIST }, { v: 0.16, c: MIST },
      { v: 0.34, c: SHADE }, { v: 0.58, c: GROUND },
      { v: 0.86, c: GROUND }, { v: 1.00, c: LIGHT }
    ];
    for (var i = 0; i < LUTN; i++) {
      var v = i / (LUTN - 1), s = 0;
      while (s < stops.length - 2 && v > stops[s + 1].v) s++;
      var a = stops[s], b = stops[s + 1];
      var f = (v - a.v) / Math.max(0.0001, b.v - a.v);
      f = f < 0 ? 0 : (f > 1 ? 1 : f);
      var r = Math.round(a.c[0] + (b.c[0] - a.c[0]) * f);
      var g = Math.round(a.c[1] + (b.c[1] - a.c[1]) * f);
      var bl = Math.round(a.c[2] + (b.c[2] - a.c[2]) * f);
      lut.push('rgb(' + r + ',' + g + ',' + bl + ')');
    }
  })();

  // ---------- render grid (base height + hillshade/contour shift, per resize) ----------
  var COLS = 168, ROWS = 132;
  var cellH = null, cellShift = null;
  function buildTerrainGrid() {
    ROWS = Math.max(60, Math.min(240, Math.round(COLS * H / W)));
    cellH = new Float32Array(COLS * ROWS);
    cellShift = new Float32Array(COLS * ROWS);
    var BANDS = 11;
    for (var j = 0; j < ROWS; j++) {
      for (var i = 0; i < COLS; i++) {
        var nx = (i + 0.5) / COLS, ny = (j + 0.5) / ROWS;
        var h = baseH(nx, ny);
        var idx = j * COLS + i;
        cellH[idx] = h;
        // hillshade: light from the north-west
        var e = 0.006;
        var gx = (baseH(nx + e, ny) - baseH(nx - e, ny)) / (2 * e);
        var gy = (baseH(nx, ny + e) - baseH(nx, ny - e)) / (2 * e);
        var sh = (-gx * 0.55 - gy * 0.75) * 0.055;
        sh = sh < -0.15 ? -0.15 : (sh > 0.10 ? 0.10 : sh);
        // contour darkening near band boundaries
        var fr = (h * BANDS) % 1;
        var cd = 0;
        if (fr < 0.10) cd = -0.05 * (1 - fr / 0.10);
        cellShift[idx] = sh + cd;
      }
    }
  }

  function drawTerrain() {
    var cw = W / COLS, ch = H / ROWS;
    var paths = [];
    for (var p = 0; p < LUTN; p++) paths.push(null);
    for (var j = 0; j < ROWS; j++) {
      for (var i = 0; i < COLS; i++) {
        var idx = j * COLS + i;
        var nx = (i + 0.5) / COLS, ny = (j + 0.5) / ROWS;
        var v = cellH[idx] - carveAt(nx, ny) * 0.9;
        v = v * 0.92 + cellShift[idx] + 0.04;
        var li = Math.floor((v < 0 ? 0 : (v > 1 ? 1 : v)) * (LUTN - 1));
        if (!paths[li]) paths[li] = [];
        paths[li].push(i * cw, j * ch);
      }
    }
    for (var q = 0; q < LUTN; q++) {
      var arr = paths[q];
      if (!arr) continue;
      ctx.fillStyle = lut[q];
      ctx.beginPath();
      for (var k = 0; k < arr.length; k += 2) {
        ctx.rect(arr[k] - 0.5, arr[k + 1] - 0.5, cw + 1, ch + 1);
      }
      ctx.fill();
    }
  }

  // ---------- ribbons ----------
  var NPTS = 40;
  var ribbons = [];
  var simTime = 0;
  var floodT = 0;
  var drought = { phase: 'none', t: 0 }; // none | out | bare | in
  var ribbonAlpha = 1;
  var meanSpeedNorm = 0;

  function downhillAngle(nx, ny) {
    var g = gradAt(nx, ny);
    // convert normalized gradient to pixel-space direction
    var px = -(g.x) / W, py = -(g.y) / H;
    var m = Math.sqrt(px * px + py * py);
    if (m < 1e-6) return null;
    return { a: Math.atan2(py, px), mag: Math.sqrt(g.x * g.x + g.y * g.y) };
  }

  function makeRibbon(x, y) {
    var d = downhillAngle(x, y);
    var r = {
      hx: x, hy: y,
      heading: d ? d.a : rng() * Math.PI * 2,
      phase: rng() * Math.PI * 2,
      wob: 0.7 + rng() * 0.9,
      wBase: 0.030 + rng() * 0.052, // fraction of min dimension: ~20-60px at 720
      pts: [],
      age: 0, pathLen: 0, stuckAge: 0,
      seed: rng() * 1000
    };
    for (var i = 0; i < NPTS; i++) r.pts.push({ x: x, y: y });
    return r;
  }

  function spawnRibbon(sx, sy) {
    var x = sx, y = sy;
    if (x === undefined) {
      // find a high seeded point to be born on
      var tries = 0;
      do {
        x = 0.06 + rng() * 0.88; y = 0.06 + rng() * 0.88;
        tries++;
      } while (tries < 14 && (baseH(x, y) < 0.52 || baseH(x, y) > 0.9));
    }
    var r = makeRibbon(x, y);
    ribbons.push(r);
    return r;
  }

  // Lay a ribbon's chain along its downhill course so frame one is mid-river.
  // Returns the number of chain points sampled from the real trail.
  function preroll(r) {
    var trail = [{ x: r.hx, y: r.hy }];
    var dt = 1 / 60;
    for (var s = 0; s < 640; s++) {
      stepHead(r, dt, true);
      if (r.hx < 0.005 || r.hx > 0.995 || r.hy < 0.005 || r.hy > 0.995) break;
      trail.push({ x: r.hx, y: r.hy });
    }
    // sample the trail at chain spacing, head first; the body follows the
    // head's path, so the chain is stored from the head backward.
    var S = Math.min(W, H);
    var spPx = S * 0.02;
    var pts = [{ x: r.hx, y: r.hy }];
    var acc = 0;
    for (var i = trail.length - 2; i >= 0 && pts.length < NPTS; i--) {
      var a = trail[i + 1], b = trail[i];
      acc += Math.sqrt(Math.pow((a.x - b.x) * W, 2) + Math.pow((a.y - b.y) * H, 2));
      if (acc >= spPx) { pts.push({ x: b.x, y: b.y }); acc = 0; }
    }
    var realPts = pts.length;
    while (pts.length < NPTS) {
      var last = pts[pts.length - 1];
      pts.push({ x: last.x - Math.cos(r.heading) * spPx / W, y: last.y - Math.sin(r.heading) * spPx / H });
    }
    r.pts = pts;
    r.age = 0; r.pathLen = 0;
    return realPts;
  }

  // Spawn a ribbon already laid out mid-course, head comfortably inside the
  // frame: try several seeded births and keep the best-scoring course.
  function spawnLaid() {
    var best = null, bestScore = -1;
    for (var t = 0; t < 8; t++) {
      var x = 0.08 + rng() * 0.84, y = 0.08 + rng() * 0.84;
      var h = baseH(x, y);
      if (h < 0.5 || h > 0.9) continue;
      var cand = makeRibbon(x, y);
      var realPts = preroll(cand);
      var margin = Math.min(cand.hx, 1 - cand.hx, cand.hy, 1 - cand.hy);
      var score = margin * 1000 + realPts;
      if (score > bestScore) { bestScore = score; best = cand; }
      if (margin >= 0.06 && realPts >= 34) break;
    }
    if (!best) { best = makeRibbon(0.5, 0.4); preroll(best); }
    ribbons.push(best);
    return best;
  }

  function stepHead(r, dt, inPreroll) {
    var d = downhillAngle(r.hx, r.hy);
    if (d) {
      // turn toward downhill, rate-limited
      var diff = d.a - r.heading;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      var maxTurn = 2.4 * dt;
      r.heading += diff < -maxTurn ? -maxTurn : (diff > maxTurn ? maxTurn : diff);
    }
    var wob = 0.30 * Math.sin(simTime * 0.6 * r.wob + r.phase) +
              0.20 * Math.sin(r.hx * 9.0 + r.phase * 2.0) * Math.cos(r.hy * 7.0 + r.phase);
    var slope = d ? d.mag : 0;
    var slopeF = 0.45 + Math.min(1.5, slope * 0.55);
    var pool = 1 - Math.min(0.62, carveAt(r.hx, r.hy) * 1.15); // pooled in carved valleys
    var spd = 0.055 * slopeF * pool; // domain units per second (px-scaled below)
    if (!inPreroll && floodT > 0) spd *= 1.8;
    var S = Math.min(W, H);
    var stepPx = spd * S * dt * 8.0; // tuned so a river crosses in ~25-40s
    var ang = r.heading + wob * 0.35;
    var dx = Math.cos(ang) * stepPx / W;
    var dy = Math.sin(ang) * stepPx / H;
    r.hx += dx; r.hy += dy;
    r.pathLen += Math.sqrt(dx * dx + dy * dy);
    r.age += dt;
    r.curSpd = spd * pool;
    return spd;
  }

  function stepRibbon(r, dt) {
    stepHead(r, dt, false);
    // follow-the-leader chain, spacing enforced in pixel space
    var S = Math.min(W, H);
    var spPx = S * 0.02;
    r.pts[0].x = r.hx; r.pts[0].y = r.hy;
    for (var i = 1; i < NPTS; i++) {
      var prev = r.pts[i - 1], p = r.pts[i];
      var dxp = (p.x - prev.x) * W, dyp = (p.y - prev.y) * H;
      var dist = Math.sqrt(dxp * dxp + dyp * dyp);
      if (dist > spPx && dist > 1e-6) {
        var f = (dist - spPx) / dist;
        p.x -= (dxp * f) / W; p.y -= (dyp * f) / H;
      }
    }
  }

  function step(dt) {
    simTime += dt;
    if (floodT > 0) floodT -= dt;
    // drought timeline
    if (drought.phase === 'out') {
      drought.t += dt;
      ribbonAlpha = Math.max(0, 1 - drought.t / 1.0);
      if (drought.t >= 1.0) {
        drought.phase = 'bare'; drought.t = 0;
        ribbons = [];
        for (var i = 0; i < 5; i++) spawnLaid();
      }
    } else if (drought.phase === 'bare') {
      drought.t += dt;
      if (drought.t >= 6.0) { drought.phase = 'in'; drought.t = 0; }
    } else if (drought.phase === 'in') {
      drought.t += dt;
      ribbonAlpha = Math.min(1, drought.t / 1.5);
      if (drought.t >= 1.5) { drought.phase = 'none'; drought.t = 0; ribbonAlpha = 1; }
    }
    // pending tap (spring) fires once the double-tap window passes
    if (pendingTap && simTime - pendingTap.t > 0.35) {
      var pt = pendingTap; pendingTap = null;
      if (ribbons.length >= 8) ribbons.shift();
      var sr = spawnRibbon(pt.x, pt.y);
      sr.heading = (downhillAngle(pt.x, pt.y) || { a: Math.PI / 2 }).a;
      gurgle();
    }
    var spdSum = 0;
    for (var j = ribbons.length - 1; j >= 0; j--) {
      var r = ribbons[j];
      stepRibbon(r, dt);
      spdSum += r.curSpd || 0;
      var out = r.hx < -0.06 || r.hx > 1.06 || r.hy < -0.06 || r.hy > 1.06;
      if (r.age > 20 && r.pathLen < 0.12) r.stuckAge += dt; else r.stuckAge = 0;
      if (out || r.stuckAge > 4) {
        ribbons.splice(j, 1);
        // a fresh river enters from an edge and grows its course inward
        var side = Math.floor(rng() * 4), ex, ey;
        if (side === 0) { ex = 0.01 + rng() * 0.98; ey = 0.012; }
        else if (side === 1) { ex = 0.01 + rng() * 0.98; ey = 0.988; }
        else if (side === 2) { ex = 0.012; ey = 0.01 + rng() * 0.98; }
        else { ex = 0.988; ey = 0.01 + rng() * 0.98; }
        spawnRibbon(ex, ey);
      }
    }
    meanSpeedNorm = ribbons.length ? Math.min(1, (spdSum / ribbons.length) * 9) : 0;
    updateAudio();
  }

  function drawRibbons() {
    var S = Math.min(W, H);
    var floodW = floodT > 0 ? 1.3 : 1.0;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var ri = 0; ri < ribbons.length; ri++) {
      var r = ribbons[ri];
      var i, p, q, wobW;
      // widths per point
      var ws = [];
      for (i = 0; i < NPTS; i++) {
        var f = i / (NPTS - 1); // 0 head, 1 tail
        var headRamp = 0.7 + 0.3 * Math.sin(Math.min(1, f * 3) * Math.PI / 2);
        var prof = headRamp * (1 - f * f * 0.72) * (0.85 + 0.15 * Math.sin(simTime * 0.8 + r.phase + i * 0.32));
        ws.push(r.wBase * prof * floodW * S);
      }
      // soft edge pass
      ctx.strokeStyle = REDGE;
      ctx.globalAlpha = 0.30 * ribbonAlpha;
      for (i = 0; i < NPTS - 1; i++) {
        p = r.pts[i]; q = r.pts[i + 1];
        ctx.lineWidth = (ws[i] + ws[i + 1]) * 0.5 * 1.5;
        ctx.beginPath();
        ctx.moveTo(p.x * W, p.y * H);
        ctx.lineTo(q.x * W, q.y * H);
        ctx.stroke();
      }
      // core pass
      ctx.strokeStyle = RIBBON;
      ctx.globalAlpha = 0.94 * ribbonAlpha;
      for (i = 0; i < NPTS - 1; i++) {
        p = r.pts[i]; q = r.pts[i + 1];
        ctx.lineWidth = (ws[i] + ws[i + 1]) * 0.5;
        ctx.beginPath();
        ctx.moveTo(p.x * W, p.y * H);
        ctx.lineTo(q.x * W, q.y * H);
        ctx.stroke();
      }
      // contour line along the left edge of travel
      ctx.strokeStyle = REDGE;
      ctx.globalAlpha = 0.8 * ribbonAlpha;
      ctx.lineWidth = Math.max(1.5, S * 0.0028);
      ctx.beginPath();
      for (i = 0; i < NPTS; i++) {
        p = r.pts[i];
        var pn = r.pts[Math.min(NPTS - 1, i + 1)], pp = r.pts[Math.max(0, i - 1)];
        var tx = (pn.x - pp.x) * W, ty = (pn.y - pp.y) * H;
        var tl = Math.sqrt(tx * tx + ty * ty) || 1;
        var ox = (-ty / tl) * ws[i] * 0.52, oy = (tx / tl) * ws[i] * 0.52;
        if (i === 0) ctx.moveTo(p.x * W + ox, p.y * H + oy);
        else ctx.lineTo(p.x * W + ox, p.y * H + oy);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawTerrain();
    drawRibbons();
  }

  // ---------- audio (lazy, gesture-only, guarded) ----------
  var AC = null, aNoiseGain = null, aLPF = null, aSubGain = null, audioOn = false;
  function ensureAudio() {
    if (audioOn) return;
    audioOn = true;
    try {
      var Ctor = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
      if (!Ctor) return;
      AC = new Ctor();
      var len = 2 * AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0);
      var arng = mulberry32(90311);
      var last = 0;
      for (var i = 0; i < len; i++) { // brownish noise for a deep current
        var white = arng() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        data[i] = last * 3.2;
      }
      var src = AC.createBufferSource();
      src.buffer = buf; src.loop = true;
      aLPF = AC.createBiquadFilter();
      aLPF.type = 'lowpass'; aLPF.frequency.value = 140; aLPF.Q.value = 0.4;
      aNoiseGain = AC.createGain(); aNoiseGain.gain.value = 0.05;
      src.connect(aLPF); aLPF.connect(aNoiseGain); aNoiseGain.connect(AC.destination);
      src.start();
      var sub = AC.createOscillator();
      sub.type = 'sine'; sub.frequency.value = 40;
      aSubGain = AC.createGain(); aSubGain.gain.value = 0.045;
      sub.connect(aSubGain); aSubGain.connect(AC.destination);
      sub.start();
    } catch (e) { AC = null; }
  }
  function updateAudio() {
    if (!AC || !aLPF) return;
    try {
      var target = drought.phase === 'bare' || drought.phase === 'out' ? 70 : 110 + 430 * meanSpeedNorm;
      aLPF.frequency.value = target;
      aNoiseGain.gain.value = 0.035 + 0.075 * meanSpeedNorm;
    } catch (e) {}
  }
  function gurgle() {
    if (!AC) return;
    try {
      var o = AC.createOscillator(), g = AC.createGain();
      var t0 = AC.currentTime;
      o.type = 'sine';
      o.frequency.setValueAtTime(270, t0);
      o.frequency.exponentialRampToValueAtTime(78, t0 + 0.38);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.42);
      o.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0 + 0.45);
    } catch (e) {}
  }

  // ---------- pointer ----------
  var pointerDown = false, downTime = 0, downX = 0, downY = 0, dragDist = 0;
  var lastX = 0, lastY = 0, lastMoveT = 0;
  var pendingTap = null;

  function evtPos(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined) ? e.clientX : 0;
    var cy = (e.clientY !== undefined) ? e.clientY : 0;
    return { x: cx - rect.left, y: cy - rect.top };
  }
  function onDown(e) {
    ensureAudio();
    if (AC && AC.resume) { try { AC.resume(); } catch (err) {} }
    var p = evtPos(e);
    pointerDown = true;
    downTime = simTime; downX = p.x; downY = p.y;
    lastX = p.x; lastY = p.y; lastMoveT = simTime;
    dragDist = 0;
    if (e && e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!pointerDown) return;
    var p = evtPos(e);
    var dx = p.x - lastX, dy = p.y - lastY;
    var segLen = Math.sqrt(dx * dx + dy * dy);
    dragDist += segLen;
    var dtEv = Math.max(0.008, simTime - lastMoveT);
    var speed = segLen / Math.min(W, H) / dtEv; // domain units per second
    if (speed > 0.9) floodT = 1.2; // fast drag: the flood
    // carve deeper where the hand slows (pooling), lighter at speed
    var slowF = Math.max(0.35, Math.min(1.25, 1.3 - speed * 1.1));
    var steps = Math.max(1, Math.ceil(segLen / 6));
    for (var i = 0; i <= steps; i++) {
      var f = i / steps;
      addCarve((lastX + dx * f) / W, (lastY + dy * f) / H, 0.055 * slowF, 3.2);
    }
    lastX = p.x; lastY = p.y; lastMoveT = simTime;
    if (e && e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!pointerDown) return;
    pointerDown = false;
    var held = simTime - downTime;
    if (held < 0.3 && dragDist < Math.min(W, H) * 0.02) {
      if (pendingTap && simTime - pendingTap.t <= 0.35) {
        pendingTap = null;
        if (drought.phase === 'none') { drought.phase = 'out'; drought.t = 0; }
      } else {
        pendingTap = { t: simTime, x: downX / W, y: downY / H };
      }
    }
    if (e && e.preventDefault) e.preventDefault();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(simTime); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { resize(); draw(simTime); });
    }
  }

  // ---------- go ----------
  resize();
  for (var si = 0; si < 5; si++) spawnLaid();
  draw(0); // frame one: seeded initial state, marbled terrain, rivers mid-course
  var lastNow = -1, accum = 0;
  function frame(now) {
    if (lastNow < 0) lastNow = now;
    var dt = (now - lastNow) / 1000;
    lastNow = now;
    if (dt > 0.1) dt = 0.1;
    accum += dt;
    var STEP = 1 / 60;
    var n = 0;
    while (accum >= STEP && n < 6) { step(STEP); accum -= STEP; n++; }
    if (n === 6) accum = 0;
    if (dt > 0) draw(simTime);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
})();
</script>
</body>
