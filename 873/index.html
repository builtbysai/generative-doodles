<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№873 Hang It Dirty</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e4db; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №873 Hang It Dirty, SOA3 / PP1273, study #264 sheldon-omar-abba.
  // DRIVER: the reviewer's nose to the grain. A gallery wall where
  // the prints hang on blue painter's tape and binder clips, a
  // toolbox of spare prints below, a tire and oil-jug shrine on the
  // floor. The wall is close enough to touch; the grain is visible
  // when you lean in. Everything is within reach, nothing is behind
  // glass, nothing is at museum distance.
  // MECHANISM: prints hang by tape at their top corners and shift
  // faintly in a draft. Drag a print toward you and it swings off
  // its tape to hang by one corner, growing nearer as it swings,
  // the grain resolving as it nears. Release and it settles back
  // onto the wall. Closeness is the interaction.
  // Visual-only: no WebAudio, no autoplay audio, per the Franke rule.
  var GROUND = '#e8e4db'; // page ground, scuffed white wall

  // Fixed-phase first frame: FIRST_T = 12 s into a 60 s cycle.
  // Each print sways on a period that divides 60 (60/30/20/15 s),
  // so the frame at FIRST_T + 60 equals the frame at FIRST_T.
  // Sway is at most about 1 degree; nothing flickers, nothing
  // flashes, far below the 14 Hz limit by construction.
  var FIRST_T = 12;
  var CYCLE = 60;
  var SEED = 873;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias, so the node-canvas render tool
  // (which passes its probe value as ?seed=) can verify that the
  // frame changes over time. Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipse(x, y, rx, ry) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  }

  // ---- Palette ------------------------------------------------------
  var WALL = [232, 228, 219];      // scuffed white wall
  var WALL_DARK = [214, 209, 199]; // wall in shade / scuff tone
  var FLOOR = [74, 62, 52];        // dark warm floor
  var FLOOR_LIT = [96, 82, 68];
  var PAPER = [244, 241, 234];     // print paper
  var INK = [26, 25, 23];          // print ink
  var TAPE = [46, 109, 180];       // blue painter's tape
  var AMBER = [180, 118, 42];      // motor-oil amber
  var AMBER_DEEP = [128, 78, 24];
  var HINT_INK = [52, 48, 44];
  var TOOLBOX = [122, 44, 34];     // toolbox red, worn

  // ---- Fixed wall tables -------------------------------------------
  var wallRng = mulberry32(SEED * 13 + 5);
  var SCUFFS = [];
  var i, j;
  for (i = 0; i < 26; i++) {
    SCUFFS.push({
      x: wallRng(), y: wallRng() * 0.78,
      rx: 0.02 + wallRng() * 0.07, ry: 0.004 + wallRng() * 0.02,
      a: 0.03 + wallRng() * 0.06, dark: wallRng() > 0.6
    });
  }
  var SPECKS = [];
  for (i = 0; i < 60; i++) {
    SPECKS.push({ x: wallRng(), y: wallRng() * 0.80, r: 0.6 + wallRng() * 1.4, a: 0.05 + wallRng() * 0.10 });
  }
  var NAILS = [];
  for (i = 0; i < 9; i++) {
    NAILS.push({ x: 0.05 + wallRng() * 0.9, y: 0.10 + wallRng() * 0.55 });
  }

  // ---- The four prints ----------------------------------------------
  // Hinge is the top-left corner: the print sways around it in the
  // draft, and when dragged it hangs from that corner alone.
  // Sizes are fractions of the stage; heights follow the print's own
  // portrait ratio so tall phones keep the same shapes.
  var PRINTS = [
    { x: 0.045, y: 0.150, w: 0.205, ratio: 1.28, tilt: -0.012, motif: 0, period: 60, phase: 0.0,  clip: false },
    { x: 0.275, y: 0.130, w: 0.210, ratio: 1.34, tilt: 0.010,  motif: 1, period: 30, phase: 1.3,  clip: true },
    { x: 0.510, y: 0.160, w: 0.200, ratio: 1.26, tilt: -0.008, motif: 2, period: 20, phase: 2.6,  clip: false },
    { x: 0.735, y: 0.140, w: 0.215, ratio: 1.31, tilt: 0.014,  motif: 3, period: 15, phase: 4.1,  clip: false }
  ];
  // Grain dots per print, fixed positions in inner-rect fractions.
  // Detail level d (0.3 at rest, 1.0 fully near) decides how many
  // are drawn and how fine they are: coarse and faint far away,
  // dense and crisp up close. That is the grain resolving.
  var grainRng = mulberry32(SEED * 29 + 11);
  for (i = 0; i < PRINTS.length; i++) {
    var g = [];
    for (j = 0; j < 260; j++) {
      g.push({ x: grainRng(), y: grainRng(), r: 0.5 + grainRng() });
    }
    PRINTS[i].grain = g;
    // Motif detail lines, fixed, revealed only when near.
    var det = [];
    for (j = 0; j < 14; j++) { det.push(grainRng()); }
    PRINTS[i].detail = det;
  }

  // ---- Drag state ----------------------------------------------------
  // dragIdx: print currently held, or -1. dragP: live proximity
  // 0..1 while held. rel[i]: {from, t0} while a released print
  // settles back; proximity decays to 0 over 1.4 s of virtual time.
  var dragIdx = -1, dragP = 0, dragSX = 0, dragSY = 0;
  var rel = [null, null, null, null];
  var RELEASE_SECS = 1.4;

  function printP(idx, t) {
    if (idx === dragIdx) { return dragP; }
    var r = rel[idx];
    if (!r) { return 0; }
    var u = (t - r.t0) / RELEASE_SECS;
    if (u >= 1) { rel[idx] = null; return 0; }
    if (u < 0) { u = 0; }
    return r.from * (1 - smooth(u));
  }

  // Print geometry in stage space at time t (hinge, angle, scale).
  function printGeom(idx, t) {
    var p = PRINTS[idx];
    var U = Math.min(W, H);
    var w = p.w * W;
    var h = w * p.ratio;
    var hx = p.x * W;
    var hy = p.y * H;
    var prox = printP(idx, t);
    var sway = reduced ? 0 : 0.009 * Math.sin((Math.PI * 2 * t) / p.period + p.phase);
    var ang = p.tilt + sway + prox * 0.52; // swings off the tape toward one corner
    var s = 1 + 0.30 * prox;               // grows as it comes toward you
    return { hx: hx, hy: hy, w: w, h: h, ang: ang, s: s, prox: prox, U: U };
  }

  function hitPrint(x, y, t) {
    for (var k = PRINTS.length - 1; k >= 0; k--) {
      var g = printGeom(k, t);
      var dx = (x - g.hx) / g.s, dy = (y - g.hy) / g.s;
      var ca = Math.cos(-g.ang), sa = Math.sin(-g.ang);
      var lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
      if (lx >= -6 && lx <= g.w + 6 && ly >= -10 && ly <= g.h + 6) { return k; }
    }
    return -1;
  }

  function pointerDown(x, y) {
    var k = hitPrint(x, y, lastT);
    if (k < 0) { return false; }
    dragIdx = k; dragP = 0; dragSX = x; dragSY = y;
    rel[k] = null;
    return true;
  }
  function pointerMove(x, y) {
    if (dragIdx < 0) { return; }
    var pull = (y - dragSY) + 0.4 * Math.abs(x - dragSX);
    dragP = clamp(pull / 220, 0, 1);
  }
  function pointerUp() {
    if (dragIdx < 0) { return; }
    rel[dragIdx] = { from: dragP, t0: lastT };
    dragIdx = -1; dragP = 0;
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Wall and floor -------------------------------------------------
  function drawWallFloor(t) {
    ctx.fillStyle = rgb(WALL);
    ctx.fillRect(0, 0, W, H);
    // Soft daylight wash from the upper left.
    var wash = ctx.createLinearGradient(0, 0, W * 0.7, H * 0.6);
    wash.addColorStop(0, rgba([255, 252, 244], a4(0.35)));
    wash.addColorStop(1, rgba([255, 252, 244], 0));
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, H);
    // Scuffs and specks: the wall is worked, not pristine.
    var s;
    for (var a = 0; a < SCUFFS.length; a++) {
      s = SCUFFS[a];
      ctx.fillStyle = s.dark ? rgba(WALL_DARK, a4(s.a)) : rgba([255, 255, 250], a4(s.a));
      ellipse(s.x * W, s.y * H, s.rx * W, s.ry * H);
      ctx.fill();
    }
    for (var b = 0; b < SPECKS.length; b++) {
      s = SPECKS[b];
      ctx.fillStyle = rgba([90, 82, 70], a4(s.a));
      circle(s.x * W, s.y * H, s.r);
      ctx.fill();
    }
    // Old nail holes from earlier hangs.
    for (var c = 0; c < NAILS.length; c++) {
      ctx.fillStyle = rgba([70, 64, 56], a4(0.5));
      circle(NAILS[c].x * W, NAILS[c].y * H, 1.6);
      ctx.fill();
    }
    // Faint pencil level line, long since ignored.
    ctx.strokeStyle = rgba([90, 82, 70], a4(0.18));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W * 0.06, H * 0.62);
    ctx.lineTo(W * 0.94, H * 0.615);
    ctx.stroke();
    // Floor.
    var floorY = H * 0.82;
    ctx.fillStyle = rgb(FLOOR);
    ctx.fillRect(0, floorY, W, H - floorY);
    var fl = ctx.createLinearGradient(0, floorY, 0, H);
    fl.addColorStop(0, rgba(FLOOR_LIT, a4(0.55)));
    fl.addColorStop(1, rgba([20, 16, 12], a4(0.35)));
    ctx.fillStyle = fl;
    ctx.fillRect(0, floorY, W, H - floorY);
    // Baseboard.
    ctx.fillStyle = rgba([52, 44, 38], a4(0.85));
    ctx.fillRect(0, floorY - 4, W, 4);
    ctx.fillStyle = rgba([210, 204, 192], a4(0.35));
    ctx.fillRect(0, floorY - 5, W, 1);
  }

  // ---- One print's black-and-white motif ------------------------------
  // Drawn in local space: paper rect (0,0,w,h), inner rect inset by
  // a white margin. Motif ink alpha deepens with detail d, and fine
  // detail lines appear only as the print comes near.
  function drawMotif(idx, g, d) {
    var p = PRINTS[idx];
    var w = g.w, h = g.h;
    var m = w * 0.09; // white margin
    var ix = m, iy = m, iw = w - 2 * m, ih = h - 2 * m;
    var inkA = a4(0.82 + 0.18 * d);
    var cx = ix + iw / 2, cy = iy + ih / 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(ix, iy, iw, ih);
    ctx.clip();
    if (p.motif === 0) {
      // Concentric circles, slightly off-center.
      var r0 = Math.min(iw, ih) * 0.48;
      for (var k = 5; k >= 1; k--) {
        ctx.fillStyle = (k % 2 === 1) ? rgba(INK, inkA) : rgba(PAPER, 1);
        circle(cx + w * 0.02, cy - h * 0.02, r0 * k / 5);
        ctx.fill();
      }
      if (d > 0.5) {
        ctx.strokeStyle = rgba(INK, a4((d - 0.5) * 1.4));
        ctx.lineWidth = 1;
        for (var q = 0; q < 8; q++) {
          circle(cx + w * 0.02, cy - h * 0.02, r0 * (0.12 + q * 0.11));
          ctx.stroke();
        }
      }
    } else if (p.motif === 1) {
      // Diagonal bars.
      ctx.fillStyle = rgba(INK, inkA);
      var bw = iw * 0.11;
      for (var s = -2; s < 8; s++) {
        ctx.beginPath();
        ctx.moveTo(ix + s * bw * 2, iy + ih);
        ctx.lineTo(ix + s * bw * 2 + bw, iy + ih);
        ctx.lineTo(ix + s * bw * 2 + bw + ih * 0.5, iy);
        ctx.lineTo(ix + s * bw * 2 + ih * 0.5, iy);
        ctx.closePath();
        ctx.fill();
      }
      if (d > 0.5) {
        ctx.strokeStyle = rgba(INK, a4((d - 0.5) * 1.4));
        ctx.lineWidth = 1;
        for (var s2 = -2; s2 < 8; s2++) {
          ctx.beginPath();
          ctx.moveTo(ix + s2 * bw * 2 + bw * 0.5, iy + ih);
          ctx.lineTo(ix + s2 * bw * 2 + bw * 0.5 + ih * 0.5, iy);
          ctx.stroke();
        }
      }
    } else if (p.motif === 2) {
      // Halftone dot field, denser toward the lower right.
      var cols = 9, rows = 11;
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var u = (c / (cols - 1) + r / (rows - 1)) / 2;
          var rad = (0.8 + u * 4.2) * (w / 150);
          ctx.fillStyle = rgba(INK, inkA);
          circle(ix + (c + 0.5) * iw / cols, iy + (r + 0.5) * ih / rows, rad);
          ctx.fill();
        }
      }
      if (d > 0.5) {
        // Finer second field between the dots, visible up close.
        ctx.fillStyle = rgba(INK, a4((d - 0.5) * 1.2));
        for (var r2 = 0; r2 < rows - 1; r2++) {
          for (var c2 = 0; c2 < cols - 1; c2++) {
            circle(ix + (c2 + 1) * iw / cols, iy + (r2 + 1) * ih / rows, 0.9 * (w / 150));
            ctx.fill();
          }
        }
      }
    } else {
      // One big arc over horizontal bars.
      ctx.fillStyle = rgba(INK, inkA);
      var barH = ih * 0.10;
      for (var b = 0; b < 4; b++) {
        var bw2 = iw * (0.55 + 0.15 * ((b % 2) * 2 - 1) * 0.5);
        ctx.fillRect(ix, iy + ih - (b + 1) * barH * 1.35, bw2, barH);
      }
      ctx.beginPath();
      ctx.moveTo(cx - iw * 0.42, iy + ih * 0.44);
      ctx.arc(cx, iy + ih * 0.44, iw * 0.42, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = rgba(PAPER, 1);
      circle(cx, iy + ih * 0.44, iw * 0.21);
      ctx.fill();
      if (d > 0.5) {
        ctx.strokeStyle = rgba(INK, a4((d - 0.5) * 1.4));
        ctx.lineWidth = 1;
        for (var a2 = 0; a2 < 4; a2++) {
          ctx.beginPath();
          ctx.moveTo(cx - iw * (0.30 + a2 * 0.05), iy + ih * 0.44);
          ctx.arc(cx, iy + ih * 0.44, iw * (0.30 + a2 * 0.05), Math.PI, 0);
          ctx.stroke();
        }
      }
    }
    ctx.restore();

    // Grain over the whole print. Far away it is coarse and faint;
    // near, it is dense and crisp: the grain resolves.
    var n = Math.floor(30 + 230 * d);
    var gr = (1.6 - 0.9 * d) * (g.U / 720);
    ctx.fillStyle = rgba([40, 36, 30], a4(0.05 + 0.20 * d));
    for (var gi = 0; gi < n; gi++) {
      var dot = p.grain[gi];
      circle(ix + dot.x * iw, iy + dot.y * ih, gr * dot.r);
      ctx.fill();
    }
  }

  // ---- One print, tape, and clip ---------------------------------------
  function drawPrint(idx, t) {
    var p = PRINTS[idx];
    var g = printGeom(idx, t);
    var prox = g.prox;
    var d = 0.30 + 0.70 * prox; // detail level: grain resolution

    ctx.save();
    // Soft shadow on the wall; it grows and drops as the print lifts.
    ctx.translate(g.hx, g.hy);
    ctx.rotate(g.ang);
    ctx.scale(g.s, g.s);
    ctx.fillStyle = rgba([30, 26, 20], a4(0.10 + 0.12 * prox));
    ctx.fillRect(4 + 14 * prox, 5 + 16 * prox, g.w, g.h);
    // Paper.
    ctx.fillStyle = rgb(PAPER);
    ctx.fillRect(0, 0, g.w, g.h);
    // Paper edge, faintly warm.
    ctx.strokeStyle = rgba([120, 112, 98], a4(0.35));
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, g.w - 1, g.h - 1);
    drawMotif(idx, g, d);
    ctx.restore();

    // Tape stays on the wall: the hinge corner holds, the far
    // corner peels as the print swings toward you.
    var tw = g.w * 0.30, th = Math.max(8, g.h * 0.045);
    // Hinge tape, top-left, fixed.
    ctx.save();
    ctx.translate(g.hx + g.w * 0.06, g.hy - th * 0.4);
    ctx.rotate(-0.06 + PRINTS[idx].tilt);
    ctx.fillStyle = rgba(TAPE, a4(0.88));
    ctx.fillRect(-tw / 2, -th / 2, tw, th);
    ctx.fillStyle = rgba([255, 255, 255], a4(0.14));
    ctx.fillRect(-tw / 2, -th / 2, tw, th * 0.35);
    ctx.restore();
    // Far tape, top-right: peels and flaps with proximity.
    ctx.save();
    var px = g.hx + g.w * 0.94, py = g.hy - th * 0.4;
    ctx.translate(px, py);
    ctx.rotate(0.05 + prox * 1.35);
    ctx.translate(-tw * 0.45, prox * th * 1.6);
    ctx.fillStyle = rgba(TAPE, a4(0.88 - 0.18 * prox));
    ctx.fillRect(-tw / 2, -th / 2, tw, th);
    ctx.fillStyle = rgba([255, 255, 255], a4(0.14));
    ctx.fillRect(-tw / 2, -th / 2, tw, th * 0.35);
    ctx.restore();

    // Binder clip on the second print's top edge.
    if (p.clip) {
      var cw = Math.max(12, g.w * 0.14), ch = Math.max(9, g.h * 0.05);
      var cxp = g.hx + g.w * 0.5, cyp = g.hy - ch * 0.3;
      ctx.save();
      ctx.translate(cxp, cyp);
      ctx.rotate(p.tilt * 0.5);
      ctx.fillStyle = rgb([24, 22, 20]);
      ctx.beginPath();
      ctx.moveTo(-cw / 2 + 3, -ch / 2);
      ctx.lineTo(cw / 2 - 3, -ch / 2);
      ctx.lineTo(cw / 2, ch / 2 - 2);
      ctx.lineTo(-cw / 2, ch / 2 - 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = rgba([24, 22, 20], a4(0.9));
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-cw * 0.28, -ch / 2);
      ctx.lineTo(-cw * 0.40, -ch - 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cw * 0.28, -ch / 2);
      ctx.lineTo(cw * 0.40, -ch - 3);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ---- Floor still life: toolbox, tire, oil jug ------------------------
  function drawFloorStill(t) {
    var floorY = H * 0.82;
    var fh = H - floorY;
    var U = Math.min(W, H);

    // Toolbox of spare prints, bottom left. Prints fan out of it.
    var tbx = W * 0.055, tby = floorY + fh * 0.42;
    var tbw = W * 0.20, tbh = fh * 0.42;
    // Spare prints leaning behind the box.
    ctx.save();
    ctx.translate(tbx + tbw * 0.30, tby - tbh * 0.55);
    for (var s = 0; s < 3; s++) {
      ctx.save();
      ctx.rotate(-0.16 + s * 0.10);
      ctx.fillStyle = rgb([238, 235, 228]);
      ctx.fillRect(-tbw * 0.28, -tbh * 0.95, tbw * 0.56, tbh * 1.05);
      ctx.strokeStyle = rgba(INK, a4(0.5));
      ctx.lineWidth = 1;
      ctx.strokeRect(-tbw * 0.28 + 0.5, -tbh * 0.95 + 0.5, tbw * 0.56 - 1, tbh * 1.05 - 1);
      ctx.strokeStyle = rgba(INK, a4(0.65));
      ctx.beginPath();
      ctx.moveTo(-tbw * 0.18, -tbh * 0.55);
      ctx.lineTo(tbw * 0.18, -tbh * 0.55);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-tbw * 0.18, -tbh * 0.30);
      ctx.lineTo(tbw * 0.10, -tbh * 0.30);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    // The box itself.
    ctx.fillStyle = rgb(TOOLBOX);
    ctx.fillRect(tbx, tby, tbw, tbh);
    ctx.fillStyle = rgba([255, 255, 255], a4(0.08));
    ctx.fillRect(tbx, tby, tbw, tbh * 0.22);
    ctx.strokeStyle = rgba([30, 16, 12], a4(0.6));
    ctx.lineWidth = 1;
    ctx.strokeRect(tbx + 0.5, tby + 0.5, tbw - 1, tbh - 1);
    // Handle.
    ctx.strokeStyle = rgb([40, 34, 28]);
    ctx.lineWidth = Math.max(2, U * 0.006);
    ctx.beginPath();
    ctx.moveTo(tbx + tbw * 0.30, tby);
    ctx.lineTo(tbx + tbw * 0.30, tby - tbh * 0.28);
    ctx.lineTo(tbx + tbw * 0.70, tby - tbh * 0.28);
    ctx.lineTo(tbx + tbw * 0.70, tby);
    ctx.stroke();
    // Latch.
    ctx.fillStyle = rgba(AMBER, a4(0.9));
    ctx.fillRect(tbx + tbw * 0.46, tby + tbh * 0.30, tbw * 0.08, tbh * 0.22);

    // Tire, leaning on the wall, center of the shrine.
    var tx = W * 0.47, ty = floorY + fh * 0.52;
    var tr = fh * 0.40;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(-0.10);
    ctx.fillStyle = rgb([22, 20, 18]);
    circle(0, 0, tr);
    ctx.fill();
    // Tread ticks.
    ctx.strokeStyle = rgba([70, 66, 60], a4(0.8));
    ctx.lineWidth = Math.max(2, tr * 0.07);
    for (var a = 0; a < 16; a++) {
      var an = (a / 16) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(an) * tr * 0.88, Math.sin(an) * tr * 0.88);
      ctx.lineTo(Math.cos(an) * tr * 0.99, Math.sin(an) * tr * 0.99);
      ctx.stroke();
    }
    ctx.fillStyle = rgb(FLOOR);
    circle(0, 0, tr * 0.52);
    ctx.fill();
    ctx.strokeStyle = rgba([70, 66, 60], a4(0.7));
    ctx.lineWidth = Math.max(1.5, tr * 0.05);
    circle(0, 0, tr * 0.52);
    ctx.stroke();
    ctx.fillStyle = rgba([200, 190, 175], a4(0.16));
    ctx.beginPath();
    ctx.moveTo(-tr * 0.7, -tr * 0.7);
    ctx.arc(0, 0, tr * 0.99, Math.PI * 1.05, Math.PI * 1.45);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Oil jug, amber, beside the tire.
    var jx = W * 0.72, jy = floorY + fh * 0.30;
    var jw = W * 0.075, jh = fh * 0.62;
    ctx.save();
    ctx.translate(jx, jy);
    ctx.fillStyle = rgb(AMBER);
    ctx.beginPath();
    ctx.moveTo(-jw / 2, jh);
    ctx.lineTo(-jw / 2, -jh * 0.1);
    ctx.lineTo(-jw * 0.18, -jh * 0.55);
    ctx.lineTo(jw * 0.18, -jh * 0.55);
    ctx.lineTo(jw / 2, -jh * 0.1);
    ctx.lineTo(jw / 2, jh);
    ctx.closePath();
    ctx.fill();
    // Spout.
    ctx.fillStyle = rgb(AMBER_DEEP);
    ctx.beginPath();
    ctx.moveTo(jw * 0.18, -jh * 0.55);
    ctx.lineTo(jw * 0.52, -jh * 0.82);
    ctx.lineTo(jw * 0.62, -jh * 0.62);
    ctx.lineTo(jw * 0.34, -jh * 0.42);
    ctx.closePath();
    ctx.fill();
    // Handle.
    ctx.strokeStyle = rgb(AMBER_DEEP);
    ctx.lineWidth = Math.max(2, U * 0.007);
    ctx.beginPath();
    ctx.moveTo(-jw * 0.18, -jh * 0.55);
    ctx.lineTo(-jw * 0.52, -jh * 0.72);
    ctx.lineTo(-jw * 0.52, -jh * 0.28);
    ctx.lineTo(-jw * 0.18, -jh * 0.18);
    ctx.stroke();
    // Oil level and highlight.
    ctx.fillStyle = rgba(AMBER_DEEP, a4(0.55));
    ctx.fillRect(-jw / 2 + 2, jh * 0.25, jw - 4, jh * 0.75);
    ctx.fillStyle = rgba([255, 220, 160], a4(0.35));
    ctx.fillRect(-jw * 0.30, -jh * 0.05, jw * 0.10, jh * 0.85);
    ctx.restore();

    // A shop rag by the tire.
    ctx.save();
    ctx.translate(W * 0.385, floorY + fh * 0.86);
    ctx.rotate(0.3);
    ctx.fillStyle = rgba([198, 192, 180], a4(0.9));
    ellipse(0, 0, W * 0.035, fh * 0.10);
    ctx.fill();
    ctx.fillStyle = rgba([90, 80, 66], a4(0.5));
    ellipse(W * 0.008, fh * 0.02, W * 0.02, fh * 0.05);
    ctx.fill();
    ctx.restore();

    // Contact shadows under the still life.
    ctx.fillStyle = rgba([0, 0, 0], a4(0.28));
    ellipse(tx, floorY + fh * 0.94, tr * 1.05, fh * 0.07);
    ctx.fill();
    ellipse(jx, floorY + fh * 0.94, jw * 0.8, fh * 0.06);
    ctx.fill();
    ellipse(tbx + tbw / 2, floorY + fh * 0.94, tbw * 0.62, fh * 0.06);
    ctx.fill();
  }

  // ---- Caption plate and hint -----------------------------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(HINT_INK, a4(0.88));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№873 · Hang It Dirty', W * 0.04, H * 0.052);
    ctx.fillStyle = rgba(HINT_INK, a4(0.60));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 06 · 02', W * 0.04, H * 0.052 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(HINT_INK, a4(0.78));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag a print toward you.', W / 2, H * 0.795);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    drawWallFloor(t);
    for (var k = 0; k < PRINTS.length; k++) { drawPrint(k, t); }
    drawFloorStill(t);
    drawText();
  }

  // Pointer input: drag a print toward you.
  try {
    canvas.addEventListener('pointerdown', function (e) {
      var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
      var x = (e.clientX || 0) - r.left, y = (e.clientY || 0) - r.top;
      if (pointerDown(x, y)) {
        draw(lastT);
        if (e.preventDefault) { e.preventDefault(); }
      }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (dragIdx < 0) { return; }
      var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
      pointerMove((e.clientX || 0) - r.left, (e.clientY || 0) - r.top);
      draw(lastT);
    });
    var endDrag = function () { if (dragIdx >= 0) { pointerUp(); draw(lastT); } };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece873 exposes state and the drag probes.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece873 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      draw: function (t) { draw(t); },
      printP: function (idx, t) { return printP(idx, t); },
      geom: function (idx, t) { return printGeom(idx, t); },
      pointerDown: pointerDown,
      pointerMove: pointerMove,
      pointerUp: pointerUp,
      dragIndex: function () { return dragIdx; }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 60 s cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
