<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prolonged Echo</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f2f0e8; }
  canvas { display: block; }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 13px/1.2 system-ui, sans-serif; color: #4a4a44; letter-spacing: 0.02em;
    pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag anywhere to launch a tap</div>
<script>
(function () {
  'use strict';
  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1411000);
  var R = function (a, b) { return a + rnd() * (b - a); };

  var WALL = '#f2f0e8', ARC = '#1a1a18', GRAY = '#8a8f94',
      VALLEY = '#ffffff', INK = '#26241f', SMUDGE = '#4a4a44';

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0;
  var phone = false;

  function isPhone() {
    try {
      var s = window.screen;
      if (s && s.width && s.height) return Math.min(s.width, s.height) < 700;
    } catch (e) {}
    return false;
  }
  function size() {
    var vv = null;
    try { vv = window.visualViewport; } catch (e) {}
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    W = Math.round(w); H = Math.round(h);
    cv.width = W; cv.height = H;
    phone = isPhone() || (H > W * 1.15 && Math.min(W, H) < 700);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    try { if (document.body) document.body.style.background = WALL; } catch (e) {}
    try {
      var hint = document.getElementById('hint');
      if (hint) hint.style.color = SMUDGE;
    } catch (e) {}
  }
  size();
  try { window.visualViewport.addEventListener('resize', size); } catch (e) {}
  window.addEventListener('resize', size);

  function r4(x) { return Math.round(x * 10000) / 10000; }

  // ---- Static layered charcoal drawings: 2 large, 2 small ----
  var panels = [];
  (function buildPanels() {
    var defs = [
      { fx: 0.58, fy: 0.16, s: 0.30, big: true },
      { fx: 0.20, fy: 0.62, s: 0.26, big: true },
      { fx: 0.82, fy: 0.66, s: 0.15, big: false },
      { fx: 0.38, fy: 0.30, s: 0.13, big: false }
    ];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i], arcs = [], n = d.big ? 5 : 3;
      for (var j = 0; j < n; j++) {
        arcs.push({
          a0: R(-0.2, 0.5), a1: R(2.2, 3.4),
          rx: R(0.5, 1.0), ry: R(0.35, 0.7),
          w: R(2, 5), al: R(0.25, 0.55)
        });
      }
      panels.push({ d: d, arcs: arcs });
    }
  })();

  function drawPanel(p, t) {
    var cx = p.d.fx * W, cy = p.d.fy * H, s = p.d.s * Math.min(W, H);
    for (var i = 0; i < p.arcs.length; i++) {
      var a = p.arcs[i];
      ctx.beginPath();
      ctx.strokeStyle = GRAY;
      ctx.globalAlpha = r4(a.al);
      ctx.lineWidth = Math.max(1, a.w * (W / 1000));
      var steps = 40;
      for (var k = 0; k <= steps; k++) {
        var th = a.a0 + (a.a1 - a.a0) * (k / steps);
        var x = cx + Math.cos(th) * a.rx * s;
        var y = cy + Math.sin(th) * a.ry * s * 0.6 + (k / steps) * s * 0.12;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---- Echo arcs ----
  // A tap launches an arc that travels rightward, bouncing and decaying,
  // plus delayed copies at +1s, +2.5s, +5s with decreasing amplitude and
  // increasing distortion. Arcs accumulate; only the oldest fade, toward a floor.
  var taps = []; // {x0, y0, t0, seed}
  var TRAVEL = 7; // seconds for an arc to cross the frame
  var ECHO_DELAYS = [0, 1, 2.5, 5];
  var ECHO_AMPS = [1, 0.6, 0.35, 0.18];
  var ECHO_DIST = [0, 0.15, 0.35, 0.6];

  function addTap(x, y, t) {
    taps.push({ x0: x, y0: y, t0: t, seed: Math.floor(rnd() * 1000000) });
    if (taps.length > 40) taps.shift();
  }
  // Pre-seeded taps so frame one already carries a thickened wall.
  addTap(0.06, 0.30, -30); addTap(0.06, 0.52, -22);
  addTap(0.06, 0.72, -14); addTap(0.06, 0.42, -6);
  // Seeded schedule: a tap every 9 s from t = 4.
  var schedule = [];
  for (var st = 4; st < 400; st += 9) schedule.push(st);
  var schedFired = 0;

  var drags = []; // {x, y, t} recent drag points that inject taps
  var dragging = false, lastTapAt = -10;

  function onPoint(x, y, t) {
    if (t - lastTapAt < 0.4) return;
    lastTapAt = t;
    addTap(Math.max(0.02, x / W), Math.min(0.95, Math.max(0.05, y / H)), t);
    drags.push({ x: x, y: y, t: t });
  }
  function bind(el) {
    el.addEventListener('pointerdown', function (e) {
      dragging = true;
      onPoint(e.clientX, e.clientY, clockT());
    });
    el.addEventListener('pointermove', function (e) {
      if (dragging) onPoint(e.clientX, e.clientY, clockT());
    });
    function end() { dragging = false; }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }
  bind(cv);

  // Clock: starts only with the rAF loop; frame one = draw(0).
  var t0 = null, booted = false;
  function clockT() {
    if (t0 === null) return 0;
    return (performance.now() - t0) / 1000;
  }

  function arcPoint(arc, p, out) {
    // p in [0,1] along the arc; returns [x, y, amp].
    var r = mulberry32(arc.seed);
    var wob1 = 0, wob2 = 0, wob3 = 0;
    // Deterministic per-arc wobble phases.
    var ph1 = r() * 6.283, ph2 = r() * 6.283, ph3 = r() * 6.283;
    var dist = arc.dist;
    var x = arc.x0 * W + p * (W - arc.x0 * W);
    var slope = 0.10 * H; // arcs slope rightward downward
    var bounce = Math.sin(p * Math.PI * 3 + ph1) * (1 - p) * 0.16 * H;
    var wob = (Math.sin(p * 9 + ph2) * 0.03 + Math.sin(p * 23 + ph3) * 0.012) * H * dist;
    var y = arc.y0 * H + p * slope + bounce * (1 - dist * 0.5) + wob;
    var amp = arc.amp * (1 - p * 0.55);
    out[0] = x; out[1] = y; out[2] = amp;
    return out;
  }

  function drawArc(arc, t) {
    var age = t - arc.tLaunch;
    if (age < 0 || age > TRAVEL + 90) return;
    var prog = Math.min(1, age / TRAVEL);
    // Oldest echoes fade toward a floor, never to zero.
    var fade = 1;
    if (age > TRAVEL) {
      var over = age - TRAVEL;
      fade = Math.max(0.14, 1 - over / 90);
    }
    var lw = Math.max(2, 0.016 * Math.min(W, H) * arc.amp);
    var steps = 90;
    var pt = [0, 0, 0];
    var drawn = Math.floor(prog * steps);
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    for (var k = 0; k <= drawn; k++) {
      var p = k / steps;
      // White shows through: seeded gaps in the stroke.
      var gapR = mulberry32(arc.seed + k * 13);
      if (gapR() < 0.16) continue;
      arcPoint(arc, p, pt);
      var a = r4(Math.min(0.92, pt[2] * fade));
      ctx.globalAlpha = a;
      ctx.strokeStyle = arc.amp >= 0.6 ? ARC : GRAY;
      ctx.beginPath();
      if (k === 0) { ctx.moveTo(pt[0], pt[1]); }
      else {
        var prev = [0, 0, 0];
        arcPoint(arc, (k - 1) / steps, prev);
        ctx.moveTo(prev[0], prev[1]);
      }
      ctx.lineTo(pt[0], pt[1]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawTapGlyph(x, y, t) {
    // Hand-shape touching a palm-shape at frame left.
    var s = Math.min(W, H) * 0.045;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = INK;
    ctx.fillRect(x - s * 0.5, y - s * 0.5, s, s * 0.8); // palm
    ctx.fillRect(x + s * 0.7, y - s * 0.9, s * 0.22, s * 0.9); // fingers
    ctx.fillRect(x + s * 0.95, y - s * 0.6, s * 0.22, s * 0.7);
    ctx.fillRect(x + s * 1.2, y - s * 0.3, s * 0.22, s * 0.6);
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    // Scheduled taps (each fires exactly once).
    while (schedFired < schedule.length && schedule[schedFired] <= t) {
      var sy = 0.25 + (schedFired % 4) * 0.16;
      addTap(0.06, sy, schedule[schedFired]);
      schedFired++;
    }

    // All arcs, oldest first so newer pile on top.
    for (var ti = 0; ti < taps.length; ti++) {
      var tp = taps[ti];
      for (var e = 0; e < ECHO_DELAYS.length; e++) {
        drawArc({
          x0: tp.x0, y0: tp.y0,
          tLaunch: tp.t0 + ECHO_DELAYS[e],
          amp: ECHO_AMPS[e], dist: ECHO_DIST[e],
          seed: tp.seed + e * 101
        }, t);
      }
    }

    // Layered charcoal drawings on top.
    for (var pi = 0; pi < panels.length; pi++) drawPanel(panels[pi], t);

    // Valley labels: the prompt's own two capital labels only.
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = INK;
    var fs = Math.max(12, Math.round(Math.min(W, H) * 0.028));
    ctx.font = '700 ' + fs + 'px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('OWE', W * 0.30, H * 0.56);
    ctx.fillText('HAND PALM', W * 0.62, H * 0.84);
    ctx.globalAlpha = 1;

    // Tap glyph at frame left for the most recent tap.
    if (taps.length) {
      var last = taps[taps.length - 1];
      if (t - last.t0 < 3) drawTapGlyph(last.x0 * W + 10, last.y0 * H, t);
    }

    // Pin canvas size every frame (house rule).
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }

  function loop(now) {
    if (t0 === null) t0 = now;
    var t = (now - t0) / 1000;
    draw(t);
  }
  function frame(now) {
    loop(now);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  // Synchronous first frame at constant phase.
  draw(0);
  booted = true;
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
