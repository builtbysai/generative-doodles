<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Passes</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: five colors, nothing else. Flat fills only, no gradients.
  var PERI = '#5B6BB5', SKIN = '#E8B48C', INK = '#161616', WHITE = '#FFFFFF', LAMP = '#F5F2E8';
  var COLORS = { peri: PERI, skin: SKIN, ink: INK, white: WHITE };

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(542065);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---- one shared vector scene -------------------------------------------
  // Every shape is registered once: p() traces its path, f is its fill class
  // ('peri' | 'skin' | 'white' | 'ink' | null), s says the line pass strokes it.
  // The four passes are four walks over this single registry:
  //   pass 1 (always): white ground + every outline stroked in ink
  //   pass 2 (scrub 0..1): 'ink' fills fade in
  //   pass 3 (scrub 1..2): 'peri' / 'skin' / 'white' fills fade in
  //   pass 4 (scrub 2..3): lamp-white light wedges + bulbs fade in
  var shapes = [];
  function add(p, f, s) { shapes.push({ p: p, f: f, s: s !== false }); }

  function rectP(x, y, w, h) {
    return function () { ctx.beginPath(); ctx.rect(x, y, w, h); };
  }
  function ellP(cx, cy, rx, ry) {
    return function () { ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); };
  }
  function polyP(pts) {
    return function () {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
    };
  }
  // flat limb: quad between two points plus the path (joint circles are
  // registered as their own ellipse shapes)
  function limbP(x1, y1, x2, y2, w) {
    var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len * w / 2, ny = dx / len * w / 2;
    return polyP([[x1 + nx, y1 + ny], [x2 + nx, y2 + ny], [x2 - nx, y2 - ny], [x1 - nx, y1 - ny]]);
  }
  function bottleP(cx, base, w, h) {
    var bw = w / 2, nw = w * 0.17, sh = base - h * 0.66, nk = base - h * 0.85;
    return polyP([[cx - bw, base], [cx - bw, sh], [cx - nw, nk], [cx - nw, base - h],
                  [cx + nw, base - h], [cx + nw, nk], [cx + bw, sh], [cx + bw, base]]);
  }
  function glassP(cx, top) { // small tumbler standing on the bar, base at top+30
    return polyP([[cx - 13, top], [cx + 13, top], [cx + 10, top + 30], [cx - 10, top + 30]]);
  }

  // -- room --
  add(rectP(0, 0, 1080, 1080), 'peri', false);          // wall
  add(rectP(0, 900, 1080, 180), 'ink', false);          // floor

  // -- bottle shelves (boards ink; bottles alternate ink / white fills) --
  function shelf(x, y, w, n) {
    add(rectP(x, y, w, 13), 'ink');
    var cx = x + 26;
    for (var i = 0; i < n; i++) {
      var bw = 26 + rng() * 14, bh = 82 + rng() * 48;
      add(bottleP(cx + bw / 2, y, bw, bh), (i % 2 === 0) ? 'ink' : 'white');
      cx += bw + 14 + rng() * 16;
      if (cx > x + w - 30) break;
    }
  }
  shelf(30, 300, 260, 4);        // small shelf, back left
  shelf(600, 296, 450, 6);       // back right, upper
  shelf(600, 448, 450, 6);       // back right, lower

  // -- hanging lamps: cord (line only), shade (ink) --
  var LAMPS = [205, 545, 885];
  LAMPS.forEach(function (x) {
    add(function () { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 118); }, null);
    add(polyP([[x - 30, 118], [x + 30, 118], [x + 58, 192], [x - 58, 192]]), 'ink');
  });

  // -- figures behind the bar --
  function halfDisc(cx, cy, r) { // hair cap over a round head
    return function () {
      ctx.beginPath();
      ctx.moveTo(cx - r, cy);
      ctx.arc(cx, cy, r, Math.PI, 0);
      ctx.closePath();
    };
  }
  // bartender, centre
  add(polyP([[646, 548], [754, 548], [766, 600], [634, 600]]), 'white');   // shirt
  add(polyP([[678, 548], [722, 548], [728, 600], [672, 600]]), 'ink');     // vest
  add(ellP(700, 494, 45, 45), 'skin');                                      // head
  add(halfDisc(700, 494, 46), 'ink');                                       // hair
  // standing customer at the bar, right
  add(polyP([[872, 530], [972, 530], [984, 600], [860, 600]]), 'ink');     // jacket
  add(ellP(922, 474, 42, 42), 'skin');
  add(halfDisc(922, 474, 43), 'ink');
  add(glassP(668, 566), 'white');                                           // glasses on the bar
  add(glassP(905, 566), 'white');

  // -- bar counter --
  add(rectP(90, 596, 970, 26), 'ink');                    // slab
  add(rectP(90, 622, 970, 278), 'white');                 // front
  [330, 575, 820].forEach(function (x) {                  // grooves on the front
    add(function () { ctx.beginPath(); ctx.moveTo(x, 646); ctx.lineTo(x, 876); }, null);
  });

  // -- empty stools in front of the bar --
  function stool(x) {
    add(rectP(x, 696, 88, 24), 'ink');
    add(rectP(x + 8, 720, 11, 152), 'ink');
    add(rectP(x + 69, 720, 11, 152), 'ink');
    add(function () { ctx.beginPath(); ctx.moveTo(x + 13, 812); ctx.lineTo(x + 75, 812); }, null);
  }
  stool(600);
  stool(800);

  // -- foreground woman, holding a glass up --
  add(limbP(306, 566, 262, 742, 34), 'skin');             // resting arm
  add(ellP(260, 748, 15, 15), 'skin');                    // hand
  add(limbP(452, 566, 540, 500, 36), 'skin');             // raised upper arm
  add(ellP(540, 500, 18, 18), 'skin');                    // elbow
  add(limbP(540, 500, 588, 428, 32), 'skin');             // forearm
  add(ellP(592, 420, 15, 15), 'skin');                    // hand at the glass
  add(rectP(362, 498, 40, 58), 'skin', false);            // neck (fill only: its
  // outline would read as a stray box against chin and shoulder lines)
  add(ellP(382, 452, 60, 72), 'skin');                    // face
  add(polyP([[302, 548], [462, 548], [522, 1080], [246, 1080]]), 'ink'); // dress
  add(function () {                                       // hair, forehead scooped
    ctx.beginPath();
    ctx.moveTo(312, 552);
    ctx.quadraticCurveTo(300, 360, 382, 344);
    ctx.quadraticCurveTo(464, 360, 452, 552);
    ctx.quadraticCurveTo(440, 472, 426, 458);
    ctx.quadraticCurveTo(382, 418, 338, 458);
    ctx.quadraticCurveTo(324, 472, 312, 552);
    ctx.closePath();
  }, 'ink');
  // her glass: stemmed, held high
  add(polyP([[574, 384], [618, 384], [610, 424], [582, 424]]), 'white');
  add(function () { ctx.beginPath(); ctx.moveTo(596, 424); ctx.lineTo(596, 446); }, null);
  add(function () { ctx.beginPath(); ctx.moveTo(582, 448); ctx.lineTo(610, 448); }, null);

  // -- facial features: drawn with the line pass, always visible --
  var features = [];
  function dot(x, y, r) { features.push({ dot: [x, y, r] }); }
  function mouth(x1, x2, y) { features.push({ mouth: [x1, x2, y] }); }
  dot(360, 480, 5); dot(404, 480, 5); mouth(370, 394, 500);       // woman
  dot(686, 496, 3.5); dot(714, 496, 3.5); mouth(692, 708, 520);   // bartender
  dot(909, 476, 3.5); dot(935, 476, 3.5); mouth(915, 929, 500);   // customer

  // -- pass 4: light wedges + bulbs (flat lamp-white polygons) --
  var lightShapes = [];
  LAMPS.forEach(function (x) {
    lightShapes.push(polyP([[x - 24, 194], [x + 24, 194], [x + 190, 800], [x - 190, 800]]));
    lightShapes.push(ellP(x, 205, 13, 13));
  });

  // ---- passes ----
  function fillPass(cls, alpha) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = COLORS[cls];
    for (var i = 0; i < shapes.length; i++) {
      if (shapes[i].f === cls) { shapes[i].p(); ctx.fill(); }
    }
    ctx.restore();
  }

  var scrub = 0, scrubTarget = 0;   // 0..3 across the four passes

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = WHITE;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    // stage ground (pass 1 paper)
    ctx.fillStyle = WHITE;
    ctx.fillRect(0, 0, 1080, 1080);

    var aInk = clamp(scrub, 0, 1);
    var aCol = clamp(scrub - 1, 0, 1);
    var aLight = clamp(scrub - 2, 0, 1);

    fillPass('peri', aCol);
    fillPass('skin', aCol);
    fillPass('white', aCol);
    fillPass('ink', aInk);

    if (aLight > 0) {
      ctx.save();
      ctx.globalAlpha = aLight;
      ctx.fillStyle = LAMP;
      for (var i = 0; i < lightShapes.length; i++) { lightShapes[i](); ctx.fill(); }
      ctx.restore();
    }

    // line pass: the ruled line art never disappears
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3.4;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (i = 0; i < shapes.length; i++) {
      if (shapes[i].s) { shapes[i].p(); ctx.stroke(); }
    }
    // features
    ctx.fillStyle = INK;
    for (i = 0; i < features.length; i++) {
      var f = features[i];
      if (f.dot) { ctx.beginPath(); ctx.arc(f.dot[0], f.dot[1], f.dot[2], 0, Math.PI * 2); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(f.mouth[0], f.mouth[2]); ctx.lineTo(f.mouth[1], f.mouth[2]); ctx.stroke(); }
    }

    // stage indicator: four tiny squares, bottom-left; active one filled in
    var active = Math.round(scrub);
    for (i = 0; i < 4; i++) {
      var sx = 36 + i * 38, sy = 1014;
      ctx.fillStyle = WHITE;
      ctx.fillRect(sx, sy, 26, 26);
      ctx.strokeStyle = INK;
      ctx.lineWidth = 3;
      ctx.strokeRect(sx, sy, 26, 26);
      if (i === active) { ctx.fillStyle = INK; ctx.fillRect(sx + 6, sy + 6, 14, 14); }
    }

    // hint
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = PERI; // visible on the white paper of pass 1 and on the
    // black floor of the later passes alike
    ctx.font = '26px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('drag', 1044, 1044);
    ctx.restore();

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground white) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = isPhone() ? W : Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw();
  }

  // ---- drag: horizontal position scrubs passes 0..3 ----
  var dragging = false;
  function setFromEvent(e) {
    var designX = (e.clientX - OX) * 1080 / S;
    scrubTarget = clamp(designX / 1080, 0, 1) * 3;
  }
  canvas.addEventListener('pointerdown', function (e) { dragging = true; setFromEvent(e); });
  window.addEventListener('pointermove', function (e) { if (dragging) setFromEvent(e); });
  window.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('touchstart', function (e) {
    dragging = true;
    if (e.touches && e.touches[0]) setFromEvent(e.touches[0]);
    if (e.preventDefault) e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchmove', function (e) {
    if (dragging && e.touches && e.touches[0]) setFromEvent(e.touches[0]);
  });
  window.addEventListener('touchend', function () { dragging = false; });

  // ---- animation: ease the scrub toward the drag target; frame one is the
  // synchronous draw at scrub 0 (pass 1, clean line art) ----
  function frame() {
    scrub += (scrubTarget - scrub) * 0.18;
    if (Math.abs(scrubTarget - scrub) < 0.001) scrub = scrubTarget;
    draw();
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
