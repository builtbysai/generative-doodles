<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№73 · Ringcube</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0e; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(216,216,216,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to tumble the cube</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
const VERTS=[];
for(const x of [-1,1]) for(const y of [-1,1]) for(const z of [-1,1]) VERTS.push([x,y,z]);
const EDGES=[];
for(let i=0;i<8;i++) for(let j=i+1;j<8;j++){ let d=0; for(let k=0;k<3;k++) if(VERTS[i][k]!==VERTS[j][k]) d++; if(d===1) EDGES.push([i,j]); }
const CLIPS={0:1,2:1,5:1,7:1,1:1,6:1};
let dragRX=0, dragRY=0, dragging=false, lastX=0, lastY=0, releaseAt=-10, relRX=0, relRY=0;
function project(v,ax,ay,cx,cy,half){
  const ca=Math.cos(ax), sa=Math.sin(ax), cb=Math.cos(ay), sb=Math.sin(ay);
  let x=v[0], y=v[1], z=v[2];
  let y1=y*ca-z*sa, z1=y*sa+z*ca;
  let x2=x*cb+z1*sb, z2=-x*sb+z1*cb;
  return [cx+x2*half, cy+y1*half, z2];
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#0b0b0e'; ctx.fillRect(0,0,w,h);
  const t=nowMs/1000;
  let rx=dragRX, ry=dragRY;
  if(!dragging&&releaseAt>0){ const k=Math.max(0,1-(t-releaseAt)/2.5); const e=k*k; rx=relRX*e; ry=relRY*e; }
  const ax=t*2*Math.PI*1/24+rx, ay=t*2*Math.PI*2/24+ry;
  const S=Math.min(w,h), cx=w/2, cy=h/2, half=S*0.27;
  const P=VERTS.map(v=>project(v,ax,ay,cx,cy,half));
  const detachIdx=Math.floor(t/2)%EDGES.length;
  const detachAmt=Math.sin(Math.PI*((t%2)/2))*half*2*0.06;
  ctx.lineWidth=1.5; ctx.strokeStyle='#8a8a8a'; ctx.lineCap='butt';
  EDGES.forEach((e,ei)=>{
    let a=P[e[0]], b=P[e[1]];
    let mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    let nx=-(b[1]-a[1]), ny=(b[0]-a[0]); const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
    let offx=0, offy=0; if(ei===detachIdx){ offx=nx*detachAmt; offy=ny*detachAmt; }
    const x1=a[0]+(b[0]-a[0])*0.14+offx, y1=a[1]+(b[1]-a[1])*0.14+offy;
    const x2=a[0]+(b[0]-a[0])*0.86+offx, y2=a[1]+(b[1]-a[1])*0.86+offy;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
  const ringR=half*2*0.025;
  ctx.lineWidth=2; ctx.strokeStyle='#d8d8d8';
  P.forEach((p,i)=>{ ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(3,ringR),0,Math.PI*2); ctx.stroke(); });
  ctx.fillStyle='#f4f1ea';
  P.forEach((p,i)=>{ if(CLIPS[i]){ ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(1.8,ringR*0.32),0,Math.PI*2); ctx.fill(); } });
  return {edges:EDGES.length, rings:P.length};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(2000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
canvas.addEventListener('pointermove',e=>{ if(dragging){ dragRY+=(e.clientX-lastX)*0.01; dragRX+=(e.clientY-lastY)*0.01; lastX=e.clientX; lastY=e.clientY; } });
function endP(){ if(dragging){ dragging=false; releaseAt=performance.now()/1000; relRX=dragRX; relRY=dragRY; dragRX=0; dragRY=0; } }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
