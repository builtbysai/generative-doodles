<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8940 — Master Frequency Only</title>
<!-- phantom-fill-8940 -->
<style>
  :root{--bg:#141210;--ink:#f2ead8;--dim:#8a8072;--brass:#e8b23a;--brass2:#c9a227;--line:#2e2a24}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
  header{width:100%;max-width:900px;padding:26px 24px 0;display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:clamp(22px,4vw,34px);font-weight:400;letter-spacing:.02em}
  .no{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim);letter-spacing:.22em}
  .sub{width:100%;max-width:900px;padding:8px 24px 0;color:var(--dim);font-style:italic;font-size:15px}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;min-height:0}
  #dial{touch-action:none;cursor:grab}
  #dial:active{cursor:grabbing}
  .readout{display:flex;gap:44px;font-family:ui-monospace,Menlo,monospace;text-align:center}
  .readout b{display:block;font-size:26px;font-weight:600;color:var(--brass)}
  .readout span{font-size:11px;letter-spacing:.18em;color:var(--dim)}
  .recipe{width:min(560px,86vw)}
  .recipe h2{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.22em;color:var(--dim);font-weight:400;margin-bottom:8px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:56px}
  .bar{flex:1;background:var(--brass2);opacity:.85;position:relative}
  .bar i{position:absolute;top:100%;left:0;right:0;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--dim);font-style:normal;padding-top:4px}
  footer{padding:14px 24px 24px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;display:flex;gap:20px;align-items:center}
  button{background:none;border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:11px;letter-spacing:.14em;padding:8px 14px;cursor:pointer}
  button:hover{border-color:var(--brass)}
</style>
</head>
<body>
<header><h1>Master Frequency Only</h1><div class="no">№ 8940</div></header>
<p class="sub">Every sound frozen as a spectral recipe. Your only control is one master wheel. Timbre intact, pitch yours.</p>
<main>
  <canvas id="dial" width="320" height="320"></canvas>
  <div class="readout">
    <div><b id="mult">×1.00</b><span>MASTER MULTIPLIER</span></div>
    <div><b id="hz">65.4 Hz</b><span>BASE FREQUENCY</span></div>
  </div>
  <div class="recipe">
    <h2>FROZEN RECIPE — PARTIALS 1–8, FIXED AMPLITUDES</h2>
    <div class="bars" id="bars"></div>
  </div>
</main>
<footer><span>DRAG THE WHEEL — SOUND STARTS ON FIRST TOUCH</span><button id="mute">MUTE</button></footer>
<script>
(function(){
"use strict";
// --- the frozen recipe: 3 chord roots x 8 partials, amplitudes never change ---
var BASE = 65.41; // C2
var ROOTS = [1, 1.5, 2]; // C2, G2, C3
var AMPS = [1, .55, .38, .28, .20, .15, .11, .08];
var value = 0.5; // 0..1 -> multiplier 0.5x..2.0x (log)
function mult(){ return 0.5 * Math.pow(4, value); }

// --- audio ---
var ctx = null, master = null, oscs = [], muted = false;
function ensureCtx(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    window.__ac = ctx;
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(ctx.destination);
    ROOTS.forEach(function(r){
      AMPS.forEach(function(a, p){
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = BASE * mult() * r * (p + 1);
        g.gain.value = a * 0.045;
        o.connect(g); g.connect(master); o.start();
        oscs.push({o:o, r:r, p:p + 1});
      });
    });
  }
  if(ctx.state === 'suspended' && !muted) ctx.resume();
}
function retune(){
  if(!ctx) return;
  var t = ctx.currentTime, m = mult();
  oscs.forEach(function(v){ v.o.frequency.setTargetAtTime(BASE * m * v.r * v.p, t, 0.03); });
}
document.addEventListener('visibilitychange', function(){
  if(!ctx) return;
  if(document.hidden) ctx.suspend(); else if(!muted) ctx.resume();
});
window.addEventListener('blur', function(){ if(ctx) ctx.suspend(); });
window.addEventListener('focus', function(){ if(ctx && !muted) ctx.resume(); });
window.addEventListener('beforeunload', function(){ if(ctx) ctx.close(); });
document.getElementById('mute').addEventListener('click', function(){
  ensureCtx();
  muted = !muted;
  this.textContent = muted ? 'UNMUTE' : 'MUTE';
  if(master) master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.05);
  if(muted) ctx.suspend(); else ctx.resume();
});

// --- recipe bars ---
var barsEl = document.getElementById('bars');
AMPS.forEach(function(a, i){
  var d = document.createElement('div');
  d.className = 'bar';
  d.style.height = Math.round(a * 100) + '%';
  d.innerHTML = '<i>' + (i + 1) + '</i>';
  barsEl.appendChild(d);
});

// --- dial ---
var cv = document.getElementById('dial'), cx2 = cv.getContext('2d');
var W = cv.width, C = W / 2, R = W / 2 - 14;
var multEl = document.getElementById('mult'), hzEl = document.getElementById('hz');
function ang(v){ return (135 + v * 270) * Math.PI / 180; } // 0 deg = east, clockwise
function draw(){
  cx2.clearRect(0, 0, W, W);
  // tick ring
  for(var i = 0; i <= 54; i++){
    var a = (135 + i * 5) * Math.PI / 180, maj = i % 6 === 0;
    var r1 = R - (maj ? 16 : 9), r2 = R;
    cx2.strokeStyle = maj ? '#8a8072' : '#3a352e';
    cx2.lineWidth = maj ? 2 : 1;
    cx2.beginPath();
    cx2.moveTo(C + r1 * Math.cos(a), C + r1 * Math.sin(a));
    cx2.lineTo(C + r2 * Math.cos(a), C + r2 * Math.sin(a));
    cx2.stroke();
  }
  // value arc
  cx2.strokeStyle = '#e8b23a'; cx2.lineWidth = 3;
  cx2.beginPath(); cx2.arc(C, C, R - 26, ang(0), ang(value)); cx2.stroke();
  // needle
  var a = ang(value);
  cx2.strokeStyle = '#f2ead8'; cx2.lineWidth = 3;
  cx2.beginPath();
  cx2.moveTo(C - 18 * Math.cos(a), C - 18 * Math.sin(a));
  cx2.lineTo(C + (R - 34) * Math.cos(a), C + (R - 34) * Math.sin(a));
  cx2.stroke();
  // hub
  cx2.fillStyle = '#e8b23a';
  cx2.beginPath(); cx2.arc(C, C, 9, 0, Math.PI * 2); cx2.fill();
  cx2.fillStyle = '#141210';
  cx2.beginPath(); cx2.arc(C, C, 3.5, 0, Math.PI * 2); cx2.fill();
  // labels
  cx2.fillStyle = '#8a8072';
  cx2.font = '11px ui-monospace, Menlo, monospace';
  cx2.textAlign = 'center';
  cx2.fillText('×0.5', C - R + 6, C + R - 2);
  cx2.fillText('×2.0', C + R - 6, C + R - 2);
  cx2.fillText('×1.0', C, C - R + 10);
}
function readouts(){
  multEl.textContent = '×' + mult().toFixed(2);
  hzEl.textContent = (BASE * mult()).toFixed(1) + ' Hz';
}
function pointerAngle(e){
  var r = cv.getBoundingClientRect();
  return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
}
var dragging = false, lastAng = 0;
cv.addEventListener('pointerdown', function(e){
  ensureCtx();
  dragging = true; lastAng = pointerAngle(e);
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', function(e){
  if(!dragging) return;
  var a = pointerAngle(e), d = a - lastAng;
  if(d > 180) d -= 360; if(d < -180) d += 360;
  lastAng = a;
  value = Math.min(1, Math.max(0, value + d / 270));
  draw(); readouts(); retune();
});
cv.addEventListener('pointerup', function(){ dragging = false; });
cv.addEventListener('pointercancel', function(){ dragging = false; });
draw(); readouts();
})();
</script>
</body>
</html>
