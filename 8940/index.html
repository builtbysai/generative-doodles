<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>&#8470;8940 &middot; Master Frequency Only</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0600;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: block; cursor: crosshair; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
  }
  .scan {
    position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0.5;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, rgba(0,0,0,0) 1px 3px);
  }
  .ui {
    position: fixed; z-index: 3; pointer-events: none;
    color: rgba(255, 190, 110, 0.66);
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    text-shadow: 0 0 12px rgba(255,170,60,0.45), 0 1px 6px rgba(0,0,0,0.9);
  }
  .ui .num { color: rgba(255, 210, 140, 0.95); }
  #title { top: 18px; left: 20px; }
  #title .sub { display: block; margin-top: 6px; font-size: 9px; letter-spacing: 0.18em; color: rgba(255,190,110,0.38); }
  #hint { bottom: 16px; right: 20px; text-align: right; font-size: 9px; color: rgba(255,190,110,0.38); }
  #seedline { bottom: 16px; left: 20px; font-size: 9px; color: rgba(255,190,110,0.32); }
  #fade {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: #0a0600; opacity: 1; transition: opacity 0.6s ease;
  }
  @media (max-width: 620px) {
    #seedline { bottom: 38px; }
    #hint { font-size: 8px; }
    #title { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="scan"></div>
<div class="ui" id="title"><span class="num">&#8470;8940</span> &middot; Master Frequency Only<span class="sub">seed 241 &middot; the recipe is the instrument; the knob only moves it</span></div>
<div class="ui" id="hint">drag the wheel &middot; tap for sound</div>
<div class="ui" id="seedline"></div>
<div id="fade"></div>
<script>
"use strict";
/* Seed 241: the AMY 2400-baud experiment. A voice is analyzed down to a
   spectral recipe (a handful of oscillator parameters); pitch is shifted
   by moving only the master frequency while the slaves follow. The
   transposition never smears, because the recipe is the instrument. */
let seed = 241001;
let rng;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const NPART = 12;
let recipe = [];        /* amplitudes for partials 1..12 */
let masterHz = 110, targetHz = 110, autoDemo = true;
let wheel = {x:0, y:0, r:0, angle:0, dragging:false};
let W=0,H=0, cardX=0, cardY=0, cardW=0, cardH=0, axisY=0, axisX0=0, axisX1=0;
let audioOn=false, actx=null, droneOsc=[];
let palette;

function setup(){
  const c = createCanvas(windowWidth, windowHeight);
  c.id('stage');
  rng = mulberry32(seed);
  palette = { amber:[255,176,0], hot:[255,220,150], dim:[150,95,30], bg:[10,6,0] };
  buildRecipe();
  layout();
  document.getElementById('fade').style.opacity = '0';
  updateSeedline();
}

function buildRecipe(){
  /* a voice reduced to 12 analyzed partials: strong low end, curated dips */
  recipe = [];
  for(let k=1;k<=NPART;k++){
    let a = 1/(k*0.9);
    if(k===4 || k===7) a *= 0.35;
    if(k===9) a *= 1.4;
    a *= 0.75 + rng()*0.5;
    recipe.push(a);
  }
  const mx = Math.max(...recipe);
  recipe = recipe.map(a => a/mx);
}

function layout(){
  W = width; H = height;
  cardW = Math.min(W*0.86, 760); cardH = H*0.30;
  cardX = W/2 - cardW/2; cardY = H*0.10;
  wheel.r = Math.min(W,H)*0.16;
  wheel.x = W/2; wheel.y = H*0.72;
  axisY = H*0.475; axisX0 = W*0.08; axisX1 = W*0.92;
}

function windowResized(){ resizeCanvas(windowWidth, windowHeight); layout(); }

function freqToX(f){
  /* log axis from 40 Hz to 4000 Hz */
  const t = (Math.log(f)-Math.log(40))/(Math.log(4000)-Math.log(40));
  return axisX0 + constrain(t,0,1)*(axisX1-axisX0);
}

function draw(){
  background(palette.bg[0], palette.bg[1], palette.bg[2]);
  if(autoDemo){
    targetHz = 110 * Math.pow(2, Math.sin(frameCount*0.006)*1.5);
  }
  masterHz += (targetHz - masterHz)*0.05;
  wheel.angle += (targetHz > masterHz ? 1 : -1)*0.004 + (wheel.dragging?0:0.001);
  drawRecipeCard();
  drawAxis();
  drawWheel();
  if(frameCount % 20 === 0) updateSeedline();
}

function drawRecipeCard(){
  /* the frozen spectral recipe: this never moves */
  noStroke();
  fill(20, 12, 2, 220);
  rect(cardX, cardY, cardW, cardH, 10);
  stroke(palette.dim[0], palette.dim[1], palette.dim[2], 120);
  strokeWeight(1); noFill();
  rect(cardX, cardY, cardW, cardH, 10);
  noStroke(); fill(palette.amber[0], palette.amber[1], palette.amber[2], 170);
  textAlign(LEFT, CENTER); textSize(10);
  text('spectral recipe · tap card to re-analyze', cardX+16, cardY+22);
  const bw = cardW/NPART;
  for(let k=0;k<NPART;k++){
    const bx = cardX + k*bw + bw*0.22;
    const bh = recipe[k]*(cardH-84);
    const by = cardY + cardH - 34 - bh;
    for(let g=3; g>=1; g--){
      fill(palette.amber[0], palette.amber[1], palette.amber[2], 16*g);
      rect(bx-g*2, by-g*2, bw*0.56+g*4, bh+g*4, 3);
    }
    fill(palette.hot[0], palette.hot[1], palette.hot[2], 235);
    rect(bx, by, bw*0.56, bh, 3);
    fill(palette.amber[0], palette.amber[1], palette.amber[2], 130);
    textAlign(CENTER, CENTER); textSize(9);
    text(k+1, bx+bw*0.28, cardY+cardH-20);
  }
  textAlign(RIGHT, CENTER); textSize(9);
  fill(palette.amber[0], palette.amber[1], palette.amber[2], 110);
  text('partials 1-12', cardX+cardW-16, cardY+22);
}

function drawAxis(){
  /* the log-frequency strip: the whole recipe slides here, shape intact */
  noStroke(); fill(255,190,110,150);
  textAlign(LEFT, CENTER); textSize(10);
  text('master moves everything at once', axisX0, axisY-46);
  stroke(palette.dim[0], palette.dim[1], palette.dim[2], 140);
  strokeWeight(1);
  line(axisX0, axisY, axisX1, axisY);
  noStroke(); fill(palette.dim[0], palette.dim[1], palette.dim[2], 150);
  textAlign(CENTER, CENTER); textSize(9);
  for(const f of [55, 110, 220, 440, 880, 1760]){
    const x = freqToX(f);
    line(x, axisY, x, axisY+6);
    text(f>=1000 ? (f/1000)+'k' : ''+f, x, axisY+20);
  }
  /* ghost of the recipe at the reference 110 Hz */
  drawRecipeOnAxis(110, 60);
  /* live recipe at the master frequency */
  drawRecipeOnAxis(masterHz, 200);
  /* master readout */
  noStroke(); fill(palette.hot[0], palette.hot[1], palette.hot[2], 230);
  textAlign(CENTER, CENTER); textSize(15);
  text(masterHz.toFixed(1) + ' Hz', W/2, axisY+48);
}

function drawRecipeOnAxis(base, alpha){
  const bw = 9;
  for(let k=0;k<NPART;k++){
    const x = freqToX(base*(k+1)) - bw/2;
    const bh = recipe[k]*64;
    if(alpha < 120){
      noFill();
      stroke(palette.amber[0], palette.amber[1], palette.amber[2], alpha);
      strokeWeight(1);
      rect(x, axisY-bh, bw, bh, 2);
    } else {
      noStroke();
      fill(palette.amber[0], palette.amber[1], palette.amber[2], alpha*0.28);
      rect(x-3, axisY-bh-3, bw+6, bh+6, 3);
      fill(palette.hot[0], palette.hot[1], palette.hot[2], alpha);
      rect(x, axisY-bh, bw, bh, 2);
    }
  }
}

function drawWheel(){
  const w = wheel;
  /* dial body */
  noStroke();
  fill(16, 10, 2);
  circle(w.x, w.y, w.r*2);
  stroke(palette.dim[0], palette.dim[1], palette.dim[2], 160);
  strokeWeight(2); noFill();
  circle(w.x, w.y, w.r*2);
  /* tick ring */
  for(let i=0;i<48;i++){
    const a = i/48*6.2832;
    const r1 = w.r*0.86, r2 = w.r*(i%4===0?0.72:0.79);
    stroke(palette.amber[0], palette.amber[1], palette.amber[2], i%4===0?170:80);
    strokeWeight(i%4===0?2:1);
    line(w.x+Math.cos(a)*r1, w.y+Math.sin(a)*r1, w.x+Math.cos(a)*r2, w.y+Math.sin(a)*r2);
  }
  /* pointer */
  const pa = w.angle;
  stroke(palette.hot[0], palette.hot[1], palette.hot[2], 240);
  strokeWeight(4);
  line(w.x, w.y, w.x+Math.cos(pa)*w.r*0.62, w.y+Math.sin(pa)*w.r*0.62);
  noStroke(); fill(palette.hot[0], palette.hot[1], palette.hot[2], 240);
  circle(w.x+Math.cos(pa)*w.r*0.62, w.y+Math.sin(pa)*w.r*0.62, 10);
  noStroke(); fill(10,6,0);
  circle(w.x, w.y, w.r*0.3);
  fill(palette.amber[0], palette.amber[1], palette.amber[2], 200);
  textAlign(CENTER, CENTER); textSize(10);
  text('MASTER', w.x, w.y+2);
  noStroke(); fill(255,190,110,140); textSize(10);
  text(autoDemo ? 'demo sweep · drag to take over' : 'manual · double-click resumes demo',
       w.x, w.y + w.r + 26);
}

function wheelHit(x, y){
  return Math.hypot(x-wheel.x, y-wheel.y) < wheel.r*1.25;
}

function mousePressed(){
  if(wheelHit(mouseX, mouseY)){ wheel.dragging = true; autoDemo = false; dragWheel(mouseX, mouseY); return false; }
  userTap(); return false;
}
function mouseDragged(){ if(wheel.dragging){ dragWheel(mouseX, mouseY); return false; } }
function mouseReleased(){ wheel.dragging = false; }
function touchStarted(){
  if(wheelHit(mouseX, mouseY)){ wheel.dragging = true; autoDemo = false; dragWheel(mouseX, mouseY); return false; }
  userTap(); return false;
}
function touchMoved(){ if(wheel.dragging){ dragWheel(mouseX, mouseY); return false; } }
function touchEnded(){ wheel.dragging = false; }
function doubleClicked(){ if(!wheelHit(mouseX, mouseY)) autoDemo = true; }

function dragWheel(x, y){
  /* vertical drag sets the master: up = higher */
  const t = constrain((wheel.y + wheel.r - y)/(wheel.r*2), 0, 1);
  targetHz = 55 * Math.pow(2, t*3); /* 55 Hz to 440 Hz */
}

function userTap(){
  /* tap outside the wheel: toggle sound or reseed */
  if(!audioOn){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      audioOn = true;
      startDrone();
    }catch(e){ audioOn = false; }
  } else if(dist(mouseX, mouseY, cardX+cardW/2, cardY+cardH/2) < cardW/2){
    buildRecipe(); /* tap the card to re-analyze a new voice */
    if(audioOn){ stopDrone(); startDrone(); }
  } else {
    audioOn = false;
    stopDrone();
  }
  updateSeedline();
}

function keyPressed(){
  if(key==='r' || key==='R'){ buildRecipe(); if(audioOn){ stopDrone(); startDrone(); } }
}

function startDrone(){
  if(!actx) return;
  stopDrone();
  const mg = actx.createGain();
  mg.gain.value = 0.0001;
  mg.connect(actx.destination);
  mg.gain.linearRampToValueAtTime(0.12, actx.currentTime+1.5);
  const oscs = [];
  for(let k=0;k<NPART;k++){
    const o = actx.createOscillator();
    o.type = 'sawtooth';
    const g = actx.createGain();
    g.gain.value = recipe[k]*0.14;
    const f = actx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 3200;
    o.connect(g); g.connect(f); f.connect(mg);
    o.start();
    oscs.push(o);
  }
  const updater = setInterval(()=>{
    if(!audioOn){ clearInterval(updater); return; }
    const t = actx.currentTime;
    oscs.forEach((o,k)=>{ o.frequency.setTargetAtTime(masterHz*(k+1), t, 0.05); });
  }, 90);
  droneOsc.push({oscs:oscs, mg:mg, updater:updater});
}

function stopDrone(){
  for(const d of droneOsc){
    clearInterval(d.updater);
    try{
      d.mg.gain.cancelScheduledValues(actx.currentTime);
      d.mg.gain.setValueAtTime(d.mg.gain.value, actx.currentTime);
      d.mg.gain.linearRampToValueAtTime(0.0001, actx.currentTime+0.6);
      const oscs = d.oscs;
      setTimeout(()=>{ for(const o of oscs){ try{o.stop();}catch(e){} } }, 800);
    }catch(e){}
  }
  droneOsc = [];
}

function updateSeedline(){
  document.getElementById('seedline').textContent =
    'seed ' + seed + ' · master ' + masterHz.toFixed(1) + ' Hz · ' + (audioOn ? 'sound on' : 'sound off');
}
</script>
</body>
</html>
