<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>№9133 · The Rolling Stone</title>
  <style>
    body {
      margin: 0;
      background: #0d0d11;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      max-width: 100vw;
      max-height: 100vh;
    }
    .cap{position:fixed;left:14px;bottom:12px;color:rgba(255,255,255,.42);font:12px/1.4 system-ui;letter-spacing:.14em}
  </style>
</head>
<body>
<canvas id="canvas" width="600" height="600"></canvas>
<div class="cap">№9133 · THE ROLLING STONE</div>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;

  let phase = 0; // Normalized loop [0, 1)
  const speed = 0.006;
  const scaleFactor = 2; // Each loop doubles in scale

  function drawRingLayer(scale, alpha) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    // Concentric terrain rings / funnel texture
    ctx.strokeStyle = `rgba(180, 175, 165, ${alpha * 0.35})`;
    ctx.lineWidth = 1.5 / scale;
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 2; a += 0.1) {
      const r = 100 + Math.sin(a * 8) * 6 + Math.cos(a * 5) * 4;
      if (a === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.stroke();

    // Radial guide pebbles in the background
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2 + 0.3;
      const dist = 135 + (i % 3) * 12;
      ctx.fillStyle = `rgba(130, 125, 115, ${alpha * 0.45})`;
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawRollingStone(t) {
    // The stone appears to roll inward toward the center while camera zooms faster,
    // resetting seamlessly every cycle
    const angle = -Math.PI / 3 + Math.sin(t * Math.PI * 2) * 0.04;
    const distance = 150; // Held at a seemingly constant screen radius due to camera zoom
    const sx = cx + Math.cos(angle) * distance;
    const sy = cy + Math.sin(angle) * distance;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(-t * Math.PI * 4); // Continuous rolling rotation

    // Shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.beginPath();
    ctx.arc(4, 6, 16, 0, Math.PI * 2);
    ctx.fill();

    // Irregular stone body
    ctx.fillStyle = '#c8c2b8';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      const r = 15 + (i % 2 === 0 ? 2 : -1.5);
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // Stone surface highlight
    ctx.fillStyle = '#e5e0d8';
    ctx.beginPath();
    ctx.arc(-4, -4, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Pause when tab hidden (audio lifecycle / battery)
  let running = true;
  document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) requestAnimationFrame(render); });
  window.addEventListener('blur', () => { running = false; });
  window.addEventListener('focus', () => { if (!running) { running = true; requestAnimationFrame(render); } });

  function render() {
    if (!running) return;
    phase = (phase + speed) % 1;
    const baseZoom = Math.pow(scaleFactor, phase);

    // Dark center abyss gradient
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, W * 0.7);
    grad.addColorStop(0, '#050507');
    grad.addColorStop(0.25, '#18171c');
    grad.addColorStop(1, '#2c2a32');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Draw self-similar zooming layers
    for (let i = -3; i <= 4; i++) {
      const layerScale = Math.pow(scaleFactor, i) * baseZoom;
      const normalized = (i + phase + 3) / 7;
      const alpha = Math.sin(Math.min(Math.max(normalized, 0), 1) * Math.PI);
      drawRingLayer(layerScale, alpha);
    }

    drawRollingStone(phase);
    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
