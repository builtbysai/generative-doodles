<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niches</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0A09; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var WALL = '#171614';
  var INTERIOR = '#0C0B0A';
  var SILHOUETTE = '#3A352C';
  var MEMBRANE = '#CFC8BB';
  var SUTURE = '#8A2F2B';
  var GROUND = '#0B0A09';

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(699085);

  var COLS = 4, ROWS = 5, COUNT = COLS * ROWS;

  // Seeded content assignment: exactly one empty niche, some singles, rest pairs.
  var contents = [];
  var i;
  for (i = 0; i < COUNT; i++) contents.push('pair');
  var order = [];
  for (i = 0; i < COUNT; i++) order.push(i);
  for (i = COUNT - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  contents[order[0]] = 'empty';
  var singles = 4 + Math.floor(rng() * 3); // 4..6 singles
  for (i = 1; i <= singles; i++) contents[order[i]] = 'single';

  // Per-niche seeded data
  var niches = [];
  for (i = 0; i < COUNT; i++) {
    var streaks = [];
    var nStreak = 5 + Math.floor(rng() * 5);
    for (var s = 0; s < nStreak; s++) {
      streaks.push({
        u: 0.08 + rng() * 0.84,          // horizontal position within niche
        w: 0.5 + rng() * 1.6,            // width px at unit scale
        a: 0.04 + rng() * 0.07,          // extra alpha
        top: rng() * 0.25,
        bot: 0.75 + rng() * 0.25
      });
    }
    niches.push({
      kind: contents[i],
      breathPhase: rng() * Math.PI * 2,
      mirror: rng() < 0.5,               // single silhouette side / pair variation
      tiltA: (rng() - 0.5) * 0.14,
      tiltB: (rng() - 0.5) * 0.14,
      scaleJitter: 0.92 + rng() * 0.16,
      streaks: streaks,
      clearAmt: 0                        // pointer clearing state (0 = fully clouded)
    });
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);
  resize();

  // Pointer state, recorded with anchored times
  var pointer = { x: -9999, y: -9999, present: false, lastT: -10 };

  function anchoredNow() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
  }
  var T0 = anchoredNow();
  function elapsed() { return anchoredNow() - T0; }

  function setPointer(e) {
    var r = canvas.getBoundingClientRect();
    pointer.x = (e.clientX - r.left);
    pointer.y = (e.clientY - r.top);
    pointer.present = true;
    pointer.lastT = elapsed();
  }
  canvas.addEventListener('pointermove', setPointer);
  canvas.addEventListener('pointerdown', setPointer);
  canvas.addEventListener('pointerleave', function () { pointer.present = false; });
  canvas.addEventListener('pointerup', function () { /* inspection only; no state change */ });

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  // Abstract shoe-last wedge: an elongated rounded blob, wider blunt toe at
  // one end, narrower heel at the other, slight sole curve. Drawn around
  // origin, length along +x, unit length 1.
  function wedgePath(cx, cy, len, hgt, tilt, mirror) {
    var m = mirror ? -1 : 1;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt);
    ctx.scale(m, 1);
    var L = len, Hh = hgt;
    ctx.beginPath();
    // heel (narrow, raised, at -x); instep slopes down to a fuller blunt toe (+x)
    ctx.moveTo(-0.50 * L, -0.30 * Hh);
    ctx.bezierCurveTo(-0.55 * L, -0.02 * Hh, -0.52 * L, 0.20 * Hh, -0.44 * L, 0.34 * Hh);
    ctx.bezierCurveTo(-0.28 * L, 0.50 * Hh, 0.05 * L, 0.52 * Hh, 0.30 * L, 0.46 * Hh);
    ctx.bezierCurveTo(0.46 * L, 0.42 * Hh, 0.53 * L, 0.22 * Hh, 0.51 * L, -0.05 * Hh);
    ctx.bezierCurveTo(0.49 * L, -0.30 * Hh, 0.34 * L, -0.42 * Hh, 0.10 * L, -0.38 * Hh);
    ctx.bezierCurveTo(-0.12 * L, -0.35 * Hh, -0.30 * L, -0.46 * Hh, -0.50 * L, -0.30 * Hh);
    ctx.closePath();
    ctx.restore();
  }

  // Soft silhouette: several scaled low-alpha copies of the same wedge.
  function drawSilhouette(cx, cy, len, hgt, tilt, mirror) {
    var passes = [
      { s: 1.20, a: 0.10 },
      { s: 1.12, a: 0.16 },
      { s: 1.05, a: 0.24 },
      { s: 1.00, a: 0.52 }
    ];
    ctx.fillStyle = SILHOUETTE;
    for (var p = 0; p < passes.length; p++) {
      ctx.globalAlpha = passes[p].a;
      wedgePath(cx, cy, len * passes[p].s, hgt * passes[p].s, tilt, mirror);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function layout() {
    var phone = isPhone();
    var marginX = W * (phone ? 0.045 : 0.07);
    var marginY = H * (phone ? 0.035 : 0.07);
    var gw = W - marginX * 2;
    var gh = H - marginY * 2;
    var cellW = gw / COLS;
    var cellH = gh / ROWS;
    return { marginX: marginX, marginY: marginY, cellW: cellW, cellH: cellH };
  }

  function draw(t, dt) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Page ground then wall
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    var L = layout();
    var insetX = L.cellW * 0.13;
    var insetY = L.cellH * 0.13;

    for (var idx = 0; idx < COUNT; idx++) {
      var col = idx % COLS;
      var row = Math.floor(idx / COLS);
      var nx = L.marginX + col * L.cellW + insetX;
      var ny = L.marginY + row * L.cellH + insetY;
      var nw = L.cellW - insetX * 2;
      var nh = L.cellH - insetY * 2;
      var n = niches[idx];
      var rad = Math.min(nw, nh) * 0.14;

      // Recessed interior
      roundRect(nx, ny, nw, nh, rad);
      ctx.fillStyle = INTERIOR;
      ctx.fill();

      // Silhouettes inside, clipped to the niche
      ctx.save();
      roundRect(nx, ny, nw, nh, rad);
      ctx.clip();
      var cyMid = ny + nh * 0.54;
      var shoeLen = nw * 0.40 * n.scaleJitter;
      var shoeHgt = nh * 0.34 * n.scaleJitter;
      if (n.kind === 'pair') {
        drawSilhouette(nx + nw * 0.28, cyMid, shoeLen, shoeHgt, n.tiltA, false);
        drawSilhouette(nx + nw * 0.72, cyMid, shoeLen, shoeHgt, n.tiltB, true);
      } else if (n.kind === 'single') {
        var sx = n.mirror ? nx + nw * 0.72 : nx + nw * 0.28;
        var hx = n.mirror ? nx + nw * 0.28 : nx + nw * 0.72;
        drawSilhouette(sx, cyMid, shoeLen, shoeHgt, n.tiltA, n.mirror);
        // The absent counterpart: a darker hollow where it would be
        ctx.fillStyle = GROUND;
        ctx.globalAlpha = 0.55;
        wedgePath(hx, cyMid, shoeLen * 1.04, shoeHgt * 1.04, n.tiltB, !n.mirror);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      // Pointer clearing target for this niche: radial falloff from pointer
      var target = 0;
      if (pointer.present) {
        var cxN = nx + nw / 2, cyN = ny + nh / 2;
        var dx = pointer.x - cxN, dy = pointer.y - cyN;
        var distC = Math.sqrt(dx * dx + dy * dy);
        var reach = Math.max(nw, nh) * 0.5 + 40;
        if (distC < reach) target = 1 - distC / reach;
      }
      // Fast clear, slow cloud-back (about 2 s)
      if (dt > 0) {
        if (target > n.clearAmt) n.clearAmt = Math.min(target, n.clearAmt + dt * 3.2);
        else n.clearAmt = Math.max(target, n.clearAmt - dt * 0.5);
      }

      // Breathing membrane alpha: 0.30..0.45 on a 12 s cycle
      var base = 0.375 + 0.075 * Math.sin((t / 12) * Math.PI * 2 + n.breathPhase);
      var alpha = base * (1 - n.clearAmt) + 0.08 * n.clearAmt;

      // Membrane fill
      roundRect(nx, ny, nw, nh, rad);
      ctx.fillStyle = MEMBRANE;
      ctx.globalAlpha = alpha;
      ctx.fill();
      ctx.globalAlpha = 1;

      // Vertical noise streaks on the membrane
      ctx.save();
      roundRect(nx, ny, nw, nh, rad);
      ctx.clip();
      ctx.fillStyle = MEMBRANE;
      for (var s = 0; s < n.streaks.length; s++) {
        var st = n.streaks[s];
        ctx.globalAlpha = alpha * st.a * 2.2;
        ctx.fillRect(nx + st.u * nw, ny + st.top * nh, st.w, (st.bot - st.top) * nh);
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      // Suture dashes stitching the membrane edge into the wall
      var inset = Math.max(3, Math.min(nw, nh) * 0.045);
      ctx.strokeStyle = SUTURE;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = Math.max(1.2, Math.min(nw, nh) * 0.016);
      ctx.setLineDash([4, 6]);
      roundRect(nx + inset, ny + inset, nw - inset * 2, nh - inset * 2, Math.max(2, rad - inset));
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
  }

  // Frame one: synchronous draw at breath phase 0
  draw(0, 0);

  var last = elapsed();
  function frame() {
    var now = elapsed();
    var dt = Math.min(0.1, now - last);
    last = now;
    draw(now, dt);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
