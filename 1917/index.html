<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1917 A Different Drummer Every Track</title>
<style>
  html, body { margin: 0; padding: 0; background: #161009; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt; no study
  // file exists for ruth-goller. The unchanging song is steady amber; each
  // drummer arrives in one distinct muted accent that washes the frame
  // and recedes with them.
  var BG = '#161009';        // warm near-black ground, page ground too
  var BG_SOFT = '#1f170e';   // faint lift behind the song band
  var AMBER = '#d99a3c';     // the detuned bass figure, never changes
  var AMBER_LT = '#e8b45a';  // the voice line, steady amber
  var AMBER_DK = '#8a5a1e';  // bass shadow, the detune underneath
  var INK = '#f2e6d4';       // title and hint, warm off-white
  var INK_SOFT = '#b39a78';  // date line, muted warm grey
  var THRONE = '#6b5a44';    // empty throne outlines, muted wood-grey

  // The five drummers, in seating order. Each is a closed-form strike
  // model: rate (strikes per second), swing (off-beat pull), glyph shape,
  // and spread of the radiating fan.
  var DRUMMERS = [
    { name: 'TOM SKINNER',  style: 'SKITTER',      color: '#6fae9e', rate: 5.2, swing: 0.30, glyph: 'tick', spread: 1.00 },
    { name: 'SEB ROCHFORD', style: 'WEIGHT',       color: '#b4502f', rate: 1.6, swing: 0.06, glyph: 'disc', spread: 0.62 },
    { name: 'BEX BURCH',    style: 'WOODEN PULSE', color: '#a67c3d', rate: 2.8, swing: 0.16, glyph: 'bar',  spread: 0.85 },
    { name: 'FRANK ROSALY', style: 'BRUSHWORK',    color: '#8f86c2', rate: 3.6, swing: 0.24, glyph: 'arc',  spread: 1.10 },
    { name: 'JIM HART',     style: 'METAL SONG',   color: '#9fb0c0', rate: 2.2, swing: 0.10, glyph: 'ring', spread: 0.95 }
  ];

  // Fixed-phase first frame: t = 6 s. Tom Skinner has been seated since
  // t = 0 and is mid-gesture, the skitter already radiating, the song band
  // steady underneath. Frame one is byte-reproducible: every glyph, line
  // and wash is a pure function of t and the seating state.
  var FIRST_T = 6;
  var SEAT_LEN = 18;   // a drummer plays for 18 s, then stands
  var HANDOFF = 1.2;   // crossfade of rhythmic feel after a tap, seconds
  var GLYPH_LIFE = 1.4;

  // Seating state. The song never changes; only this state does.
  var seatIndex = 0;        // drummer currently seated
  var seatStart = 0;        // t at which they sat down
  var standAt = SEAT_LEN;   // t at which they stand
  var prevIndex = -1;       // drummer being replaced, during a handoff
  var prevSeatStart = 0;    // t at which the outgoing drummer sat down
  var handoffStart = -10;   // t of the last tap

  // Tap probe (QA hook): ?tap=N or ?seed=N seats drummer N at FIRST_T - 2,
  // fully seated and mid-gesture, so a probed render shows a visibly
  // different drummer from the default first frame.
  var probe = -1;
  try {
    var q = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m = q.match(/[?&](?:tap|seed)=(\d+)/);
    if (m) { probe = parseInt(m[1], 10) % DRUMMERS.length; }
  } catch (e) { probe = -1; }
  if (probe >= 0) {
    seatIndex = probe;
    seatStart = FIRST_T - 2;
    standAt = FIRST_T - 2 + SEAT_LEN;
    prevIndex = -1;
    handoffStart = -10;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function hexA(h, a) {
    var c = hexRGB(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a4(a) + ')';
  }
  function hexLerp(h1, h2, t) {
    var a = hexRGB(h1), b = hexRGB(h2);
    var r = Math.round(lerp(a[0], b[0], t));
    var g = Math.round(lerp(a[1], b[1], t));
    var bl = Math.round(lerp(a[2], b[2], t));
    function hx(v) { var s = v.toString(16); return s.length === 1 ? '0' + s : s; }
    return '#' + hx(r) + hx(g) + hx(bl);
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Geometry: the throne row arcs above, the song band holds the middle.
  function geom() {
    return {
      arcY: H * 0.27,
      arcRise: H * 0.055,
      bandY: H * 0.60,
      bandAmp: H * 0.030,
      seatR: Math.max(10, Math.min(W, H) * 0.042)
    };
  }
  function thronePos(g, i) {
    var u = i / (DRUMMERS.length - 1);
    return {
      x: W * (0.14 + 0.72 * u),
      y: g.arcY - g.arcRise * (1 - Math.pow(2 * u - 1, 2))
    };
  }

  // The unchanging song. The detuned bass figure: one thick amber line
  // with its detuned shadow a few px below; the voice a brighter amber
  // line braiding gently above it. Pure functions of t, never of drummer.
  function bassY(g, x, t) {
    var u = (x - W * 0.07) / (W * 0.86);
    return g.bandY
      + Math.sin(u * Math.PI * 3.0 + t * 0.50) * g.bandAmp
      + Math.sin(u * Math.PI * 7.0 - t * 0.30) * g.bandAmp * 0.28;
  }
  function voiceY(g, x, t) {
    var u = (x - W * 0.07) / (W * 0.86);
    return g.bandY - H * 0.055
      + Math.sin(u * Math.PI * 4.2 + t * 0.62 + 1.3) * g.bandAmp * 0.7
      + Math.sin(u * Math.PI * 2.0 - t * 0.21) * g.bandAmp * 0.45;
  }

  // Strike times for drummer d seated at start: closed-form, with
  // swing pulling alternate strikes off the grid.
  function strikeTime(d, k, start) {
    return start + k / d.rate + d.swing * Math.sin(k * 2.39) / d.rate;
  }
  // How many strikes have happened by time t (for drummer d).
  function strikeCount(d, t, start) {
    var n = Math.floor((t - start) * d.rate);
    return n < 0 ? 0 : n;
  }

  // Wash: the current drummer's accent color laid over the frame, rising
  // with them and receding as they stand. Returns { color, alpha }.
  function washAt(t) {
    var seated = t < standAt;
    var f = clamp((t - handoffStart) / HANDOFF, 0, 1);
    var a = 0;
    var col = DRUMMERS[seatIndex].color;
    if (seated) {
      a = 0.08 * (prevIndex >= 0 ? f : 1);
      if (prevIndex >= 0 && f < 1) { col = hexLerp(DRUMMERS[prevIndex].color, col, f); }
    } else {
      var since = t - standAt;
      a = 0.08 * clamp(1 - since / 2.5, 0, 1);
    }
    return { color: col, alpha: a4(a), seated: seated, f: f };
  }

  function drawThrone(g, p, i, t, seatedHere) {
    var r = g.seatR;
    var shimmer = seatedHere ? 0 : 0.30 + 0.08 * Math.sin(t * 0.8 + i * 1.9);
    // Back posts and top rail.
    ctx.strokeStyle = hexA(THRONE, a4(shimmer + 0.12));
    ctx.lineWidth = Math.max(1, H * 0.0022);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.x - r * 0.75, p.y - r * 0.4);
    ctx.lineTo(p.x - r * 0.75, p.y - r * 2.1);
    ctx.moveTo(p.x + r * 0.75, p.y - r * 0.4);
    ctx.lineTo(p.x + r * 0.75, p.y - r * 2.1);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x - r * 0.75, p.y - r * 2.1);
    ctx.quadraticCurveTo(p.x, p.y - r * 2.55, p.x + r * 0.75, p.y - r * 2.1);
    ctx.stroke();
    // Seat: its own path (node-canvas ellipse quirk).
    ctx.fillStyle = hexA(THRONE, a4(shimmer));
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, r, r * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();
    // Legs.
    ctx.strokeStyle = hexA(THRONE, a4(shimmer + 0.10));
    ctx.beginPath();
    ctx.moveTo(p.x - r * 0.55, p.y + r * 0.1);
    ctx.lineTo(p.x - r * 0.7, p.y + r * 1.5);
    ctx.moveTo(p.x + r * 0.55, p.y + r * 0.1);
    ctx.lineTo(p.x + r * 0.7, p.y + r * 1.5);
    ctx.stroke();
  }

  function drawDrummer(g, p, d, t) {
    var r = g.seatR;
    var col = d.color;
    // Two small drums in front of the throne.
    ctx.fillStyle = hexA(col, 0.85);
    ctx.beginPath(); ctx.moveTo(p.x - r * 0.95 + r * 0.42, p.y + r * 0.9); ctx.arc(p.x - r * 0.95, p.y + r * 0.9, r * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(p.x + r * 0.95 + r * 0.42, p.y + r * 0.9); ctx.arc(p.x + r * 0.95, p.y + r * 0.9, r * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(BG, 0.6);
    ctx.lineWidth = Math.max(1, H * 0.0018);
    ctx.beginPath(); ctx.moveTo(p.x - r * 0.95 + r * 0.42, p.y + r * 0.9); ctx.arc(p.x - r * 0.95, p.y + r * 0.9, r * 0.42, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x + r * 0.95 + r * 0.42, p.y + r * 0.9); ctx.arc(p.x + r * 0.95, p.y + r * 0.9, r * 0.42, 0, Math.PI * 2); ctx.stroke();
    // Torso: shoulders rising from the seat.
    var bob = Math.sin(t * 1.4) * H * 0.002;
    ctx.fillStyle = hexA(col, 0.95);
    ctx.beginPath();
    ctx.moveTo(p.x - r * 0.62, p.y - r * 0.15);
    ctx.quadraticCurveTo(p.x - r * 0.55, p.y - r * 1.25 + bob, p.x, p.y - r * 1.35 + bob);
    ctx.quadraticCurveTo(p.x + r * 0.55, p.y - r * 1.25 + bob, p.x + r * 0.62, p.y - r * 0.15);
    ctx.closePath();
    ctx.fill();
    // Head.
    ctx.beginPath(); ctx.moveTo(p.x + r * 0.38, p.y - r * 1.55 + bob); ctx.arc(p.x, p.y - r * 1.55 + bob, r * 0.38, 0, Math.PI * 2); ctx.fill();
    // Arms reaching to the drums, swaying with the strike pulse.
    var sway = Math.sin(t * d.rate * 0.9) * r * 0.12;
    ctx.strokeStyle = hexA(col, 0.95);
    ctx.lineWidth = Math.max(1.5, H * 0.003);
    ctx.beginPath();
    ctx.moveTo(p.x - r * 0.4, p.y - r * 0.9 + bob);
    ctx.lineTo(p.x - r * 0.95, p.y + r * 0.75 + sway);
    ctx.moveTo(p.x + r * 0.4, p.y - r * 0.9 + bob);
    ctx.lineTo(p.x + r * 0.95, p.y + r * 0.75 - sway);
    ctx.stroke();
  }

  // One struck glyph, radiating outward from the drummer. ageFrac 0..1
  // over GLYPH_LIFE; theta points up and out; size scales with the stage.
  function drawGlyph(d, ox, oy, theta, dist, size, ageFrac, alpha) {
    var x = ox + Math.cos(theta) * dist;
    var y = oy + Math.sin(theta) * dist;
    var a = a4(alpha * (1 - ageFrac));
    if (a <= 0.01) { return; }
    var col = d.color;
    if (d.glyph === 'tick') {
      var len = size * 2.2 * (1 - ageFrac * 0.4);
      ctx.strokeStyle = hexA(col, a);
      ctx.lineWidth = Math.max(1.5, size * 0.22);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - Math.cos(theta) * len / 2, y - Math.sin(theta) * len / 2);
      ctx.lineTo(x + Math.cos(theta) * len / 2, y + Math.sin(theta) * len / 2);
      ctx.stroke();
    } else if (d.glyph === 'disc') {
      ctx.fillStyle = hexA(col, a);
      ctx.beginPath(); ctx.moveTo(x + size, y); ctx.arc(x, y, size * (1 - ageFrac * 0.3), 0, Math.PI * 2); ctx.fill();
    } else if (d.glyph === 'bar') {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(theta);
      ctx.fillStyle = hexA(col, a);
      ctx.fillRect(-size * 1.3, -size * 0.32, size * 2.6, size * 0.64);
      ctx.restore();
    } else if (d.glyph === 'arc') {
      // Brushwork: a swept arc segment plus a faint trailing arc.
      var r = size * (1.1 + ageFrac * 1.6);
      var a0 = theta - 0.7, a1 = theta + 0.7;
      ctx.strokeStyle = hexA(col, a);
      ctx.lineWidth = Math.max(1.2, size * 0.20);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a0) * r, y + Math.sin(a0) * r);
      ctx.arc(x, y, r, a0, a1);
      ctx.stroke();
      ctx.strokeStyle = hexA(col, a4(a * 0.45));
      ctx.lineWidth = Math.max(0.8, size * 0.10);
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a0) * r * 1.35, y + Math.sin(a0) * r * 1.35);
      ctx.arc(x, y, r * 1.35, a0, a1);
      ctx.stroke();
    } else { // ring
      ctx.strokeStyle = hexA(col, a);
      ctx.lineWidth = Math.max(1, size * 0.18 * (1 - ageFrac * 0.5));
      ctx.beginPath(); ctx.moveTo(x + size * (0.6 + ageFrac), y); ctx.arc(x, y, size * (0.6 + ageFrac), 0, Math.PI * 2); ctx.stroke();
    }
  }

  // All strikes of drummer dIndex still glowing at time t, with the
  // handoff fade applied. origin is the drummer's hands. start is when
  // they sat down; endT is the last moment they could strike (their
  // handoff, or t while still playing).
  function drawStrikes(g, dIndex, t, origin, fade, start, endT) {
    var d = DRUMMERS[dIndex];
    var n = strikeCount(d, Math.min(t, endT), start);
    var recent = Math.ceil(GLYPH_LIFE * d.rate) + 1;
    var startK = Math.max(0, n - recent);
    for (var k = startK; k < n; k++) {
      var st = strikeTime(d, k, start);
      if (st > t) { continue; }
      var age = t - st;
      if (age >= GLYPH_LIFE) { continue; }
      var ageFrac = age / GLYPH_LIFE;
      // Upward fan: strikes radiate up and out from the drummer, spread
      // per drummer, so the gestures fill the air above the throne row.
      var theta = -Math.PI / 2 + (hash(k * 7 + dIndex * 13) - 0.5) * d.spread * Math.PI * 0.62;
      var dist = H * (0.02 + ageFrac * 0.20);
      var size = Math.max(3, H * 0.010 * (1 + hash(k * 3 + dIndex) * 0.8));
      // Faint motion trail along the radial, so each strike reads as
      // travelling outward rather than appearing in place.
      ctx.strokeStyle = hexA(d.color, a4(0.22 * (1 - ageFrac) * fade));
      ctx.lineWidth = Math.max(1, size * 0.16);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(origin.x + Math.cos(theta) * dist * 0.7, origin.y + Math.sin(theta) * dist * 0.7);
      ctx.lineTo(origin.x + Math.cos(theta) * dist, origin.y + Math.sin(theta) * dist);
      ctx.stroke();
      drawGlyph(d, origin.x, origin.y, theta, dist, size, ageFrac, 0.95 * fade);
    }
    // Strike pulse ring at the drummer on the most recent strike.
    if (n > 0) {
      var last = strikeTime(d, n - 1, start);
      var lage = t - last;
      if (lage >= 0 && lage < 0.9) {
        var pr = H * (0.02 + (lage / 0.9) * 0.10);
        ctx.strokeStyle = hexA(d.color, a4(0.35 * (1 - lage / 0.9) * fade));
        ctx.lineWidth = Math.max(1, H * 0.002);
        ctx.beginPath(); ctx.moveTo(origin.x + pr, origin.y); ctx.arc(origin.x, origin.y, pr, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var g = geom();
    var wash = washAt(t);

    // The drummer's accent washes the frame, then recedes with them.
    if (wash.alpha > 0.005) {
      ctx.fillStyle = hexA(wash.color, wash.alpha);
      ctx.fillRect(0, 0, W, H);
    }

    // Faint ground behind the song band.
    ctx.fillStyle = hexA(BG_SOFT, 0.6);
    ctx.fillRect(W * 0.07, g.bandY - H * 0.10, W * 0.86, H * 0.17);

    // The song band: the detuned bass figure and the voice. These never
    // change when the drummer changes; only the voice takes a faint tint
    // of the current wash.
    var x0 = W * 0.07, x1 = W * 0.93;
    var step = Math.max(2, (x1 - x0) / 300);
    var voiceCol = wash.alpha > 0.005 ? hexLerp(AMBER_LT, wash.color, 0.35 * (wash.alpha / 0.08)) : AMBER_LT;

    // Bass shadow: the detune underneath, a few px low.
    ctx.strokeStyle = hexA(AMBER_DK, 0.8);
    ctx.lineWidth = Math.max(2, H * 0.006);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var x = x0; x <= x1; x += step) {
      var sy = bassY(g, x, t) + H * 0.009;
      if (x === x0) { ctx.moveTo(x, sy); } else { ctx.lineTo(x, sy); }
    }
    ctx.stroke();
    // Bass figure.
    ctx.strokeStyle = hexA(AMBER, 0.95);
    ctx.lineWidth = Math.max(3, H * 0.011);
    ctx.beginPath();
    for (var bx = x0; bx <= x1; bx += step) {
      var by = bassY(g, bx, t);
      if (bx === x0) { ctx.moveTo(bx, by); } else { ctx.lineTo(bx, by); }
    }
    ctx.stroke();
    // Bass pulse dots, one per slow beat.
    for (var b = 0; b < 8; b++) {
      var px = x0 + (x1 - x0) * (b + 0.5) / 8;
      var py = bassY(g, px, t) + H * 0.026;
      var pulse = 0.35 + 0.30 * Math.sin(t * 0.9 + b * 1.3);
      ctx.fillStyle = hexA(AMBER_LT, a4(clamp(pulse, 0.05, 0.7)));
      ctx.beginPath(); ctx.moveTo(px + H * 0.005, py); ctx.arc(px, py, H * 0.005, 0, Math.PI * 2); ctx.fill();
    }
    // Voice line.
    ctx.strokeStyle = hexA(voiceCol, 0.92);
    ctx.lineWidth = Math.max(1.6, H * 0.004);
    ctx.beginPath();
    for (var vx = x0; vx <= x1; vx += step) {
      var vy = voiceY(g, vx, t);
      if (vx === x0) { ctx.moveTo(vx, vy); } else { ctx.lineTo(vx, vy); }
    }
    ctx.stroke();

    // The throne row arcs above the band.
    var seatedHere = wash.seated;
    for (var i = 0; i < DRUMMERS.length; i++) {
      var p = thronePos(g, i);
      drawThrone(g, p, i, t, seatedHere && i === seatIndex);
    }

    // The seated drummer and their radiating gestures.
    if (wash.seated) {
      var sp = thronePos(g, seatIndex);
      var origin = { x: sp.x, y: sp.y - g.seatR * 0.6 };
      // During a handoff the outgoing drummer's gestures fade out first.
      if (prevIndex >= 0 && wash.f < 1) {
        var pp = thronePos(g, prevIndex);
        var porigin = { x: pp.x, y: pp.y - g.seatR * 0.6 };
        drawStrikes(g, prevIndex, t, porigin, 1 - wash.f, prevSeatStart, handoffStart);
      }
      drawDrummer(g, sp, DRUMMERS[seatIndex], t);
      drawStrikes(g, seatIndex, t, origin, prevIndex >= 0 ? wash.f : 1, seatStart, t);
      // The seated drummer's style word, small, under their throne.
      ctx.fillStyle = hexA(DRUMMERS[seatIndex].color, 0.9);
      ctx.font = '600 ' + Math.round(clamp(W / 52, 10, 13)) + 'px Georgia, "Times New Roman", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(DRUMMERS[seatIndex].style, sp.x, sp.y + g.seatR * 2.6);
      ctx.textAlign = 'left';
    }

    // Current drummer label, top-right: name only, so long names never
    // collide with the title. The style word rides under the throne.
    var fsT = Math.round(clamp(W / 34, 11, 16));
    ctx.fillStyle = hexA(INK_SOFT, 0.95);
    ctx.font = '600 ' + fsT + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    var labelY = W < 560 ? 30 : 34;
    if (wash.seated) {
      ctx.fillText(DRUMMERS[seatIndex].name, W - 18, labelY);
    } else {
      ctx.fillText('THRONE EMPTY', W - 18, labelY);
    }
    ctx.textAlign = 'left';

    // Title plate, top-left. The title is long, so it wraps to two lines
    // on narrow screens while the drummer label keeps the top-right.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    if (W < 560) {
      ctx.fillText('A Different Drummer', 18, 30);
      ctx.fillText('Every Track', 18, 30 + fs1 + 6);
      ctx.fillStyle = INK_SOFT;
      ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('№1917 · 2007 · 04 · 12', 18, 30 + fs1 + 6 + fs2 + 8);
    } else {
      ctx.fillText('A Different Drummer Every Track', 18, 34);
      ctx.fillStyle = INK_SOFT;
      ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
      ctx.fillText('№1917 · 2007 · 04 · 12', 18, 34 + fs2 + 8);
    }
    ctx.fillStyle = hexA(INK_SOFT, 0.9);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Tap to seat a new drummer.', W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  // Seating: a tap seats the next drummer in order, a substitution, never
  // a reload. The song is untouched; only the rhythmic world is replaced.
  var actx = null;
  function seatNext(t) {
    var next = (seatIndex + 1) % DRUMMERS.length;
    // If the throne is empty, the next drummer in order takes it.
    prevIndex = (t < standAt) ? seatIndex : -1;
    prevSeatStart = seatStart;
    seatIndex = next;
    seatStart = t;
    standAt = t + SEAT_LEN;
    handoffStart = t;
  }
  function softThump() {
    // Sound only inside the tap gesture, muted-soft and lazy.
    try {
      if (typeof window.AudioContext !== 'function' && typeof window.webkitAudioContext !== 'function') { return; }
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        actx = new AC();
      }
      if (actx.state === 'suspended' && typeof actx.resume === 'function') { actx.resume(); }
      var o = actx.createOscillator();
      var gn = actx.createGain();
      o.type = 'sine';
      o.frequency.value = 55;
      gn.gain.setValueAtTime(0.04, actx.currentTime);
      gn.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.25);
      o.connect(gn);
      gn.connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + 0.3);
    } catch (e) { /* visual only if audio is unavailable */ }
  }

  var tapT = FIRST_T;
  function onTap() {
    seatNext(tapT);
    softThump();
    draw(tapT);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onTap);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // All motion runs under 6 Hz by construction (fastest strike rate 5.2/s
  // draws glyphs, not full-frame flicker), well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      tapT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
