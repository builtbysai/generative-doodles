<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hot Spot</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #08080A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): background #08080A, globe body #16161A,
  // lat/long frame #2E2E36, continent wire #FF2A1F,
  // bloom #FF5A3C (low alpha), wire joints #B01A12. Nothing else.
  var BG = '#08080A';
  var BODY = '#16161A';
  var FRAME = '#2E2E36';
  var WIRE = '#FF2A1F';
  var BLOOM = '#FF5A3C';
  var JOINT = '#B01A12';

  var BASE_SEED = 705002;
  var DRIFT = 4;              // degrees per second: one full turn in 90 s
  var SPIN_TAU = 1.6;         // seconds; fling velocity decay constant
  var SPARK_DUR = 1.6;        // seconds for a tap spark to cross its wire
  var SPARK_TAIL = 0.22;      // spark length, as a fraction of the wire
  var D2R = Math.PI / 180;
  var FORCE_T = -1;           // QA hook: -1 = live clock, else fixed elapsed

  // QA seed hook: ?seed=tNN pins the elapsed time (used by the headless
  // renderer to inspect later phases). Inert in normal viewing.
  try {
    if (typeof location !== 'undefined' && location.search) {
      var qm = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
      if (qm) FORCE_T = parseFloat(qm[1]);
    }
  } catch (e) { /* live mode */ }

  // Seeded RNG (mulberry32), used only to pick a spark's continent,
  // keyed by the tap count so the choice is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---- Continent data ---------------------------------------------------
  // Hand-authored, hand-simplified [lon, lat] outlines, written from
  // general world-map knowledge and deliberately reduced to readable
  // silhouettes (roughly 25-65 points each). Continents only: no country
  // borders, no labels. Closed loops repeat their first point at the end.
  var CONTINENTS = [
    { name: 'North America', closed: true, pts: [
      [-168, 65], [-159, 70], [-144, 70], [-130, 69], [-117, 68],
      [-105, 68], [-94, 69], [-87, 66], [-83, 61], [-86, 55], [-91, 51],
      [-88, 48], [-82, 45], [-76, 43], [-70, 44], [-66, 45], [-70, 41],
      [-74, 38], [-76, 34], [-80, 31], [-81, 26], [-84, 27], [-85, 30],
      [-89, 30], [-94, 29], [-97, 25], [-96, 20], [-93, 18], [-90, 21],
      [-87, 21], [-86, 16], [-83, 10], [-79, 9], [-82, 9], [-85, 12],
      [-89, 13], [-93, 15], [-96, 17], [-100, 18], [-104, 21],
      [-106, 25], [-109, 29], [-114, 31], [-117, 33], [-121, 36],
      [-124, 42], [-126, 48], [-131, 54], [-139, 60], [-151, 60],
      [-159, 57], [-165, 60], [-168, 65]
    ] },
    { name: 'South America', closed: true, pts: [
      [-77, 7], [-72, 11], [-67, 11], [-62, 10], [-56, 6], [-52, 5],
      [-50, 1], [-46, -2], [-41, -4], [-35, -8], [-36, -12], [-39, -15],
      [-39, -20], [-42, -23], [-48, -27], [-53, -33], [-57, -38],
      [-62, -39], [-62, -43], [-65, -47], [-67, -51], [-68, -55],
      [-71, -54], [-73, -50], [-74, -44], [-73, -37], [-71, -30],
      [-70, -23], [-70, -18], [-74, -15], [-78, -10], [-81, -5],
      [-81, -1], [-79, 3], [-77, 7]
    ] },
    { name: 'Africa', closed: true, pts: [
      [-6, 35], [-1, 35], [5, 37], [10, 37], [11, 34], [18, 32],
      [25, 32], [30, 31], [33, 30], [35, 27], [37, 22], [39, 19],
      [41, 15], [43, 12], [46, 11], [50, 12], [51, 10], [47, 6],
      [42, 0], [40, -5], [40, -11], [38, -17], [36, -21], [34, -26],
      [31, -29], [27, -33], [21, -34], [18, -33], [16, -29], [14, -23],
      [13, -17], [12, -11], [13, -6], [10, -2], [9, 3], [4, 6],
      [-3, 5], [-8, 4], [-12, 8], [-16, 12], [-17, 16], [-16, 20],
      [-16, 24], [-14, 27], [-11, 30], [-8, 32], [-6, 35]
    ] },
    { name: 'Madagascar', closed: true, pts: [
      [43, -16], [47, -15], [50, -17], [49, -20], [47, -24], [45, -25],
      [44, -22], [44, -18], [43, -16]
    ] },
    { name: 'Eurasia', closed: true, pts: [
      [-9, 43], [-9, 48], [-5, 49], [-1, 51], [3, 53], [7, 54],
      [8, 57], [11, 58], [7, 58], [5, 60], [8, 62], [13, 66],
      [18, 69], [24, 71], [31, 70], [38, 68], [45, 68], [53, 69],
      [62, 70], [70, 72], [78, 72], [85, 74], [93, 76], [100, 77],
      [107, 77], [113, 75], [120, 74], [127, 73], [135, 73],
      [142, 72], [150, 71], [157, 70], [164, 69], [172, 66],
      [179, 66], [179, 63], [172, 61], [165, 60], [160, 56],
      [157, 52], [152, 48], [145, 47], [141, 44], [140, 39],
      [136, 35], [132, 34], [129, 36], [126, 38], [122, 38],
      [120, 34], [121, 30], [120, 26], [114, 22], [109, 19],
      [109, 14], [106, 9], [103, 5], [101, 3], [99, 7], [98, 10],
      [97, 14], [94, 16], [92, 21], [89, 22], [86, 20], [83, 17],
      [80, 14], [78, 8], [76, 10], [73, 16], [70, 21], [66, 25],
      [61, 25], [57, 26], [52, 26], [50, 29], [49, 28], [52, 25],
      [56, 25], [59, 23], [58, 21], [55, 18], [53, 16], [49, 14],
      [45, 12], [43, 13], [41, 16], [39, 21], [36, 27], [34, 28],
      [34, 31], [36, 36], [32, 36], [28, 36], [26, 38], [23, 36],
      [22, 37], [21, 39], [19, 40], [19, 42], [16, 40], [15, 38],
      [16, 37], [15, 40], [12, 44], [10, 44], [7, 43], [3, 42],
      [0, 39], [-2, 37], [-6, 36], [-9, 37], [-9, 43]
    ] },
    { name: 'Greenland', closed: true, pts: [
      [-46, 60], [-42, 62], [-38, 65], [-32, 68], [-31, 70],
      [-28, 74], [-30, 78], [-35, 80], [-45, 80], [-52, 77],
      [-55, 72], [-54, 67], [-52, 62], [-49, 60], [-46, 60]
    ] },
    { name: 'Australia', closed: true, pts: [
      [113, -22], [114, -27], [115, -32], [117, -35], [122, -34],
      [127, -32], [130, -32], [132, -32], [134, -33], [136, -35],
      [138, -35], [139, -37], [141, -38], [145, -38], [147, -38],
      [150, -37], [152, -33], [153, -29], [153, -25], [151, -21],
      [148, -19], [145, -17], [143, -14], [142, -11], [141, -13],
      [141, -16], [140, -18], [137, -16], [136, -12], [134, -11],
      [132, -11], [129, -13], [126, -14], [123, -16], [120, -18],
      [117, -20], [113, -22]
    ] },
    { name: 'Antarctica', closed: false, pts: [
      [-180, -72], [-150, -73], [-120, -72], [-90, -71], [-60, -69],
      [-30, -70], [0, -70], [30, -69], [60, -68], [90, -67],
      [120, -67], [150, -68], [179, -71]
    ] }
  ];

  // Per-continent arc-length fractions in lon/lat space, precomputed
  // once: the spark travels by fraction of total wire length.
  CONTINENTS.forEach(function (c) {
    var cum = [0], total = 0, i, a, b;
    var n = c.closed ? c.pts.length : c.pts.length - 1;
    for (i = 0; i < n; i++) {
      a = c.pts[i]; b = c.pts[(i + 1) % c.pts.length];
      total += Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) +
                         (b[1] - a[1]) * (b[1] - a[1]));
      cum.push(total);
    }
    c.cum = cum;
    c.total = total;
  });

  // Graticule in lon/lat space: parallels every 20 degrees, meridians
  // every 20 degrees, sampled finely enough to curve cleanly.
  var GRATICULE = [];
  (function () {
    var lat, lon, pts, i;
    for (lat = -60; lat <= 60; lat += 20) {
      pts = [];
      for (lon = -180; lon <= 180; lon += 5) pts.push([lon, lat]);
      GRATICULE.push(pts);
    }
    for (lon = -180; lon < 180; lon += 20) {
      pts = [];
      for (i = 0; i <= 28; i++) pts.push([lon, -84 + i * 6]);
      GRATICULE.push(pts);
    }
  })();

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1, PHONE = false;
  var CX = 0, CY = 0, R = 0;

  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 800; h = 600; }
    return { w: w, h: h };
  }

  function resize() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) {
      DPR = clamp(window.devicePixelRatio, 1, 2);
    }
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    // Phone detection: physical screen size first (min dimension < 700),
    // tall-aspect as the fallback signal only.
    var smin = 100000;
    if (typeof window !== 'undefined' && window.screen &&
        window.screen.width && window.screen.height) {
      smin = Math.min(window.screen.width, window.screen.height);
    }
    PHONE = (smin < 700) || (H > W * 1.15 && smin === 100000);
    // The globe fills about 70% of the smaller dimension at every size.
    CX = W / 2; CY = H / 2;
    R = 0.35 * Math.min(W, H);
  }

  // ---- Rotation state ---------------------------------------------------
  // Rotation is a closed-form function of the anchored clock plus the
  // recorded interaction state. Frame one (t = 0, no interaction) is
  // exactly rotation 0: the Atlantic view.
  var rot = { base: 0, baseT: 0, spin: 0, spinT: 0 };

  function rotAt(t) {
    var a = rot.base + DRIFT * (t - rot.baseT);
    if (rot.spin !== 0) {
      var dt = t - rot.spinT;
      if (dt > 0) a += rot.spin * SPIN_TAU * (1 - Math.exp(-dt / SPIN_TAU));
    }
    return a;
  }

  // ---- Spark state --------------------------------------------------------
  var tapCount = 0;
  var spark = null; // { ci: continent index, t0: start time }

  // ---- Projection ---------------------------------------------------------
  // Orthographic: rotate longitude around the Y axis, project. z > 0 is
  // the facing hemisphere.
  function p3(lon, lat, rotDeg) {
    var lam = (lon - rotDeg) * D2R;
    var phi = lat * D2R;
    var cp = Math.cos(phi);
    return { x: cp * Math.sin(lam), y: Math.sin(phi), z: cp * Math.cos(lam) };
  }
  function sx(p) { return CX + R * p.x; }
  function sy(p) { return CY - R * p.y; }

  // Clip a 3D segment to one side of the limb plane (z = 0). front=true
  // keeps the facing part, front=false keeps the far part.
  function clipZ(a, b, front) {
    var EPS = 0.0005;
    var za = a.z, zb = b.z;
    if (front) {
      if (za <= EPS && zb <= EPS) return null;
      if (za > EPS && zb > EPS) return [a, b];
    } else {
      if (za >= -EPS && zb >= -EPS) return null;
      if (za < -EPS && zb < -EPS) return [a, b];
    }
    var s = za / (za - zb);
    var p = {
      x: a.x + (b.x - a.x) * s,
      y: a.y + (b.y - a.y) * s,
      z: 0
    };
    if (front) return za > 0 ? [a, p] : [p, b];
    return za < 0 ? [a, p] : [p, b];
  }

  // Stroke one lon/lat polyline on one side of the globe.
  function strokeSide(pts, closed, rotDeg, front) {
    var n = pts.length;
    var segs = closed ? n : n - 1;
    var proj = [];
    var i, a, b, seg;
    for (i = 0; i < n; i++) proj.push(p3(pts[i][0], pts[i][1], rotDeg));
    ctx.beginPath();
    var any = false;
    for (i = 0; i < segs; i++) {
      a = proj[i]; b = proj[(i + 1) % n];
      seg = clipZ(a, b, front);
      if (!seg) continue;
      ctx.moveTo(sx(seg[0]), sy(seg[0]));
      ctx.lineTo(sx(seg[1]), sy(seg[1]));
      any = true;
    }
    if (any) ctx.stroke();
  }

  function drawGraticule(rotDeg) {
    var i;
    ctx.strokeStyle = FRAME;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.10;
    for (i = 0; i < GRATICULE.length; i++) {
      strokeSide(GRATICULE[i], false, rotDeg, false);
    }
    ctx.globalAlpha = 0.5;
    for (i = 0; i < GRATICULE.length; i++) {
      strokeSide(GRATICULE[i], false, rotDeg, true);
    }
    ctx.globalAlpha = 1;
  }

  function drawWire(rotDeg) {
    var i;
    // Back hemisphere: the far wire, faded to near-invisible.
    ctx.strokeStyle = WIRE;
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = 0.07;
    for (i = 0; i < CONTINENTS.length; i++) {
      strokeSide(CONTINENTS[i].pts, CONTINENTS[i].closed, rotDeg, false);
    }
    // Front hemisphere glow: layered strokes only, no blur filter. A wide
    // low-alpha bloom pass, a tighter bloom pass, then the core line.
    ctx.strokeStyle = BLOOM;
    ctx.lineWidth = 5;
    ctx.globalAlpha = 0.14;
    for (i = 0; i < CONTINENTS.length; i++) {
      strokeSide(CONTINENTS[i].pts, CONTINENTS[i].closed, rotDeg, true);
    }
    ctx.lineWidth = 2.6;
    ctx.globalAlpha = 0.20;
    for (i = 0; i < CONTINENTS.length; i++) {
      strokeSide(CONTINENTS[i].pts, CONTINENTS[i].closed, rotDeg, true);
    }
    ctx.strokeStyle = WIRE;
    ctx.lineWidth = 1.7;
    ctx.globalAlpha = 0.95;
    for (i = 0; i < CONTINENTS.length; i++) {
      strokeSide(CONTINENTS[i].pts, CONTINENTS[i].closed, rotDeg, true);
    }
    ctx.globalAlpha = 1;
    // Wire joints: a small darker dot at each facing vertex, swelling
    // slightly toward the disc centre with the foreshortening.
    ctx.fillStyle = JOINT;
    var jr = clamp(R * 0.006, 1.1, 2.1);
    var c, p, v;
    for (i = 0; i < CONTINENTS.length; i++) {
      c = CONTINENTS[i];
      for (var j = 0; j < c.pts.length; j++) {
        if (c.closed && j === c.pts.length - 1) continue; // duplicated seam point
        p = p3(c.pts[j][0], c.pts[j][1], rotDeg);
        if (p.z <= 0.03) continue;
        v = jr * (0.7 + 0.5 * p.z);
        ctx.beginPath();
        ctx.arc(sx(p), sy(p), v, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Interpolate a lon/lat point at arc-length fraction f along a
  // continent polyline.
  function pointAt(c, f) {
    var target = f * c.total;
    var n = c.closed ? c.pts.length : c.pts.length - 1;
    for (var i = 0; i < n; i++) {
      if (target <= c.cum[i + 1] || i === n - 1) {
        var a = c.pts[i], b = c.pts[(i + 1) % c.pts.length];
        var span = c.cum[i + 1] - c.cum[i];
        var u = span > 0 ? (target - c.cum[i]) / span : 0;
        u = clamp(u, 0, 1);
        return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
      }
    }
    return c.pts[0];
  }

  function drawSpark(t, rotDeg) {
    if (!spark) return;
    var u = (t - spark.t0) / SPARK_DUR;
    if (u < 0 || u >= 1) { if (u >= 1) spark = null; return; }
    var c = CONTINENTS[spark.ci];
    var env = Math.sin(Math.PI * u);
    var head = u;
    var tail = Math.max(0, u - SPARK_TAIL);
    var STEPS = 26;
    var pts3 = [];
    var i, ll;
    for (i = 0; i <= STEPS; i++) {
      ll = pointAt(c, tail + (head - tail) * (i / STEPS));
      pts3.push(p3(ll[0], ll[1], rotDeg));
    }
    // Collect the facing runs of the spark path.
    var runs = [];
    var run = null;
    for (i = 0; i < STEPS; i++) {
      var seg = clipZ(pts3[i], pts3[i + 1], true);
      if (!seg) { run = null; continue; }
      if (!run) { run = []; runs.push(run); }
      if (run.length === 0) run.push(seg[0]);
      run.push(seg[1]);
    }
    ctx.lineCap = 'round';
    for (i = 0; i < runs.length; i++) {
      var r2 = runs[i];
      ctx.beginPath();
      ctx.moveTo(sx(r2[0]), sy(r2[0]));
      for (var j = 1; j < r2.length; j++) ctx.lineTo(sx(r2[j]), sy(r2[j]));
      ctx.strokeStyle = BLOOM;
      ctx.lineWidth = 5;
      ctx.globalAlpha = 0.30 * env;
      ctx.stroke();
      ctx.strokeStyle = BLOOM;
      ctx.lineWidth = 2.2;
      ctx.globalAlpha = 0.95 * env;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineCap = 'butt';
    // The spark head itself, when it is on the facing side.
    var hp = p3(ll[0], ll[1], rotDeg);
    if (hp.z > 0) {
      ctx.fillStyle = BLOOM;
      ctx.beginPath();
      ctx.arc(sx(hp), sy(hp), clamp(R * 0.008, 1.6, 2.8), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    var rotDeg = rotAt(t);
    // The barely visible steel body.
    ctx.fillStyle = BODY;
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.fill();
    drawGraticule(rotDeg);
    // Rim of the disc.
    ctx.strokeStyle = FRAME;
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    drawWire(rotDeg);
    drawSpark(t, rotDeg);
  }

  // ---- Clock, pointer, boot ---------------------------------------------
  var startStamp = -1;
  function nowSec() {
    if (FORCE_T >= 0) return FORCE_T;
    if (typeof performance !== 'undefined' && performance.now) {
      if (startStamp < 0) startStamp = performance.now();
      return (performance.now() - startStamp) / 1000;
    }
    return 0;
  }

  var ptr = { down: false, downT: 0, downX: 0, lastX: 0, lastMoveT: 0,
              moved: 0, vel: 0 };

  function evtPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    return { x: W / 2, y: H / 2 };
  }

  function fireSpark(now) {
    tapCount++;
    var rng = mulberry32(BASE_SEED + tapCount * 1009);
    // Any continent except the open Antarctic arc.
    var ci = Math.floor(rng() * (CONTINENTS.length - 1));
    spark = { ci: ci, t0: now };
  }

  function releaseSpin(now) {
    rot.spin = clamp(ptr.vel, -140, 140);
    rot.spinT = now;
  }

  function onDown(e) {
    var p = evtPos(e);
    var now = nowSec();
    ptr.down = true;
    ptr.downT = now; ptr.downX = p.x;
    ptr.lastX = p.x; ptr.lastMoveT = now;
    ptr.moved = 0; ptr.vel = 0;
  }

  function onMove(e) {
    if (!ptr.down) return;
    var p = evtPos(e);
    var now = nowSec();
    var dx = p.x - ptr.lastX;
    ptr.lastX = p.x;
    ptr.moved += Math.abs(dx);
    if (dx === 0) return;
    // Dragging across the globe face: pixels to degrees at the radius.
    var deg = (dx / Math.max(R, 1)) / D2R;
    // Fold the drag into the anchored rotation state.
    rot.base = rotAt(now) + deg;
    rot.baseT = now;
    rot.spin = 0;
    var dt = now - ptr.lastMoveT;
    ptr.lastMoveT = now;
    if (dt > 0.005) {
      var inst = deg / dt;
      ptr.vel = 0.7 * ptr.vel + 0.3 * inst;
    }
  }

  function onUp(e) {
    if (!ptr.down) return;
    ptr.down = false;
    var now = nowSec();
    var dt = now - ptr.downT;
    if (dt < 0.35 && ptr.moved < 6) {
      fireSpark(now); // a tap: a spark pulse along one continent wire
    } else if (ptr.moved >= 6) {
      releaseSpin(now); // a drag: the fling eases back into the slow drift
    }
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointerleave', function () {
      if (ptr.down && ptr.moved >= 6) releaseSpin(nowSec());
      ptr.down = false;
    });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(nowSec()); });
  }
  if (typeof window !== 'undefined' && window.visualViewport &&
      window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () {
      resize(); draw(nowSec());
    });
  }

  resize();
  draw(0); // frame one: the synchronous draw at rotation 0

  if (FORCE_T >= 0) {
    draw(FORCE_T);
  } else if (typeof requestAnimationFrame === 'function') {
    var tick = function () {
      draw(nowSec());
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
