<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No. 8973 · Typewriter Weave - Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #ece4d0;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// No. 8973 · Typewriter Weave
// Anni Albers' typewriter studies: woven bands struck from repeated
// character clusters, one ink on paper, the hand's pressure jitter intact.
// Seeded PRNG (mulberry32); click/tap re-weaves with a fresh seed.
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var FONT = '"Courier New", "Liberation Mono", Courier, monospace';
var params = new URLSearchParams(location.search);
var seed = parseInt(params.get("seed") || "135", 10);
if (!isFinite(seed)) seed = 135;

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");

function fit(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(2, Math.round(window.innerWidth * dpr));
  canvas.height = Math.max(2, Math.round(window.innerHeight * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function strike(ch, x, y, alpha, size, rot){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.font = size + "px " + FONT;
  ctx.fillText(ch, 0, 0);
  ctx.restore();
}

function paperGrain(rng, W, H){
  // faint mottling so the sheet is a surface, not a flat fill
  for (var i = 0; i < 9; i++){
    var gx = rng() * W, gy = rng() * H, gr = (0.15 + rng() * 0.35) * Math.min(W, H);
    var g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    var tone = rng() < 0.5 ? "120,100,70" : "255,252,240";
    g.addColorStop(0, "rgba(" + tone + ",0.05)");
    g.addColorStop(1, "rgba(" + tone + ",0)");
    ctx.fillStyle = g;
    ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
  }
  // paper speckle
  for (var s = 0; s < 2600; s++){
    var dark = rng() < 0.45;
    ctx.fillStyle = dark ? "rgba(90,75,55," + (0.02 + rng() * 0.05) + ")"
                         : "rgba(255,255,250," + (0.03 + rng() * 0.05) + ")";
    ctx.fillRect(rng() * W, rng() * H, 1 + rng() * 1.4, 1 + rng() * 1.4);
  }
}

function draw(){
  var W = window.innerWidth, H = window.innerHeight;
  var rng = mulberry32(seed);

  // --- the sheet ---
  ctx.fillStyle = "#ece4d0";
  ctx.fillRect(0, 0, W, H);
  paperGrain(rng, W, H);

  var u = Math.min(W, H);
  var fs = Math.max(10, u / 52);       // strike size: the typewriter's pitch
  var adv = fs * 0.602;                // courier advance
  var INK = "32,27,22";

  var mx = W * 0.055, myTop = H * 0.055, myBot = H * 0.105;
  var tx0 = mx, tx1 = W - mx, ty0 = myTop, ty1 = H - myBot;

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "rgb(" + INK + ")";

  // --- warp: faint vertical threads, the loom's held tension ---
  var warpChars = ["i", ":", "l", "1", "t", "!"];
  var wc = warpChars[(rng() * warpChars.length) | 0];
  for (var x = tx0 + adv; x < tx1 - adv * 0.5; x += adv * 0.78){
    var colPhase = rng() * 6.283, colAmp = 0.8 + rng() * 2.0;
    for (var y = ty0; y < ty1; y += fs * 0.92){
      if (rng() < 0.045) continue;                       // a thread skips a beat
      var jx = (rng() - 0.5) * 2.2 + Math.sin(y * 0.012 + colPhase) * colAmp;
      strike(wc, x + jx, y + (rng() - 0.5) * 2.2,
             0.15 + rng() * 0.22, fs * (0.9 + rng() * 0.18), (rng() - 0.5) * 0.06);
    }
  }

  // --- weft: bands of struck clusters, the hand at the keys ---
  var DARK  = ["#####", "MMMMM", "WWWWW", "@@@@@", "&&&&&"];
  var MID   = ["=====", "ooooo", "*****", "+++++", "/////", "xxxxx", "zzzzz"];
  var LIGHT = [".....", ":::::", "-----", "~~~~~", ",,,,,", "'''''", "`````"];
  var classes = [DARK, MID, LIGHT];

  var yy = ty0 + fs * 0.6;
  var prevClass = -1, prevCluster = "";
  while (yy < ty1 - fs * 1.2){
    var cls = (rng() * 3) | 0;
    if (cls === prevClass) cls = (cls + 1 + ((rng() * 2) | 0)) % 3;   // never two alike in a row
    var pool = classes[cls];
    var cl = pool[(rng() * pool.length) | 0];
    if (cl === prevCluster) cl = pool[(pool.indexOf(cl) + 1) % pool.length];
    var rows = 2 + ((rng() * 4) | 0);
    var base = 0.40 + rng() * 0.52;                                  // this band's ribbon ink
    var rowH = fs * (0.94 + rng() * 0.16);                           // this band's beat: tight or loose
    var slubRow = rng() < 0.28 ? (rng() * rows) | 0 : -1;            // one heavy slub row, sometimes
    var lineStart = tx0 + adv * (1.2 + (rng() - 0.5) * 2.4);         // the typist's line wanders
    // band edges undulate like a hand-beaten weft, never ruler-straight
    var edgeA = 2.5 + rng() * 5, edgeF = 0.0018 + rng() * 0.003, edgeP = rng() * 6.283;
    var fadeP = rng() * 6.283;                                      // the ribbon fades along the carriage

    for (var r = 0; r < rows; r++){
      var ry = yy + r * rowH;
      if (ry > ty1) break;
      var waveA = 0.9 + rng() * 1.7, waveF = 0.004 + rng() * 0.008, waveP = rng() * 6.283;
      var rowPhase = rng() * cl.length;                             // cluster phase drifts per row
      var slub = (r === slubRow);
      var stepMul = slub ? 1.38 : 1.0;
      var xx = lineStart - rowPhase * adv * 0.98;
      while (xx < tx1 - adv){
        for (var k = 0; k < cl.length; k++){
          var sx = xx + k * adv * 0.98 * stepMul;
          if (sx < tx0 || sx > tx1 - adv * 0.5) continue;
          var roll = rng();
          if (roll < 0.02) continue;                                // the key missed entirely
          var chp = base * (0.5 + 0.5 * rng());                     // per-strike pressure
          chp *= 0.78 + 0.22 * Math.sin(sx * 0.0021 + fadeP);       // ribbon fades along the line
          if (roll < 0.09) chp *= 0.42;                             // ribbon running dry
          var heavy = roll > 0.945;                                 // struck twice
          var chx = sx + (rng() - 0.5) * 3.4;
          var chy = ry + Math.sin(sx * waveF + waveP) * waveA
                       + Math.sin(sx * edgeF + edgeP) * edgeA
                       + (rng() - 0.5) * 3.6;
          var csize = fs * (0.9 + rng() * 0.2) * (slub ? 1.34 : 1);
          strike(cl[k], chx, chy, chp * (heavy ? 1.12 : 1) * (slub ? 1.32 : 1),
                 csize, (rng() - 0.5) * 0.11);
          if (heavy) strike(cl[k], chx + 0.7, chy + 0.5, chp, csize * 0.99, 0.01);
        }
        xx += cl.length * adv * 0.98 * stepMul;
      }
    }
    yy += rows * rowH;
    yy += (rng() < 0.62) ? fs * (0.5 + rng() * 0.85) : fs * 0.18;    // warp-only breather, or tight
    prevClass = cls; prevCluster = cl;
  }

  // --- selvedge: the cloth's finished edges ---
  [tx0 - adv * 0.4, tx1 + adv * 0.4].forEach(function(ex){
    for (var sy = ty0; sy < ty1; sy += fs * 0.8){
      if (rng() < 0.03) continue;
      strike("#", ex + (rng() - 0.5) * 2, sy + (rng() - 0.5) * 2.4,
             0.45 + rng() * 0.3, fs * 0.95, (rng() - 0.5) * 0.08);
    }
  });

  // --- typed note, bottom of the sheet ---
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.font = Math.max(10, u / 64) + "px " + FONT;
  ctx.fillStyle = "rgba(32,27,22,0.55)";
  ctx.fillText("No. 8973 \u00B7 Typewriter Weave \u00B7 click to re-weave", mx, H - myBot * 0.42);
}

function weave(newSeed){
  seed = newSeed;
  try {
    var url = new URL(location.href);
    url.searchParams.set("seed", String(seed));
    history.replaceState(null, "", url.toString());
  } catch (e) { /* file:// edge cases: keep drawing anyway */ }
  draw();
}

canvas.addEventListener("click", function(){
  weave((Math.random() * 1e9) | 0);
});

var resizeT = null;
window.addEventListener("resize", function(){
  clearTimeout(resizeT);
  resizeT = setTimeout(function(){ fit(); draw(); }, 120);
});

fit();
draw();
</script>
</body>
</html>
