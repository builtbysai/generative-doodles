<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Physician Should Be in Attendance</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(831831);

  // ---------- palette (strict) ----------
  var BLACK = '#000000';
  var WHITE = '#FFFFFF';
  var AMBER = '#C9A227';   // booth readout
  var PAPER = '#EFE9DB';   // warning card

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- viewport sizing (Visual Viewport API) ----------
  function viewSize() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    return { w: w, h: h };
  }
  function isPhone(w, h) {
    var sw = 9999;
    if (window.screen) sw = Math.min(window.screen.width, window.screen.height);
    return sw < 700 || h > w * 1.15;
  }

  var W = 0, H = 0, DPR = 1, PHONE = false;
  var GEO = null;
  function resize() {
    var s = viewSize();
    W = Math.max(1, Math.round(s.w));
    H = Math.max(1, Math.round(s.h));
    DPR = window.devicePixelRatio || 1;
    PHONE = isPhone(W, H);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    buildScene();
  }
  function buildScene() {
    var minD = Math.min(W, H);
    var cardW = PHONE ? W * 0.88 : Math.min(W * 0.62, minD * 1.05);
    var cardH = minD * (PHONE ? 0.30 : 0.34);
    GEO = {
      minD: minD,
      cx: W / 2,
      cardCy: H * 0.44,
      cardW: cardW,
      cardH: cardH,
      warnTitle: clamp(minD * 0.052, 20, 46),
      warnLine: clamp(minD * 0.026, 12, 24),
      cardSmall: clamp(minD * 0.024, 11, 22),
      cardBig: clamp(minD * 0.040, 16, 36),
      readSize: clamp(minD * 0.024, 11, 20),
      readY: H * 0.44 + cardH / 2 + minD * 0.085,
      discR: clamp(minD * 0.026, 10, 22),
      discY: H * 0.44 + cardH / 2 + minD * 0.085 + minD * 0.075
    };
  }

  // ---------- card machine + booth counter (closed form) ----------
  // State lives in anchors. Every interaction (tap advance, double-tap
  // reseed, drag scrub) appends an anchor recording the frame count at
  // that moment, so the state at any t is a closed-form function of the
  // anchor list: counter(t) = anchor.frames + rate * (t - anchor.t)
  // while a "film" card (2 or 3) is up, and holds still otherwise.
  var CARD_WARNING = 0, CARD_TITLE = 1, CARD_BEGIN = 2, CARD_BLACK = 3;
  var anchors = [{ t: 0, frames: 0, card: CARD_WARNING, rate: 8.0, splices: 500 }];

  function stateAt(t) {
    var a = anchors[0];
    for (var i = anchors.length - 1; i >= 0; i--) {
      if (anchors[i].t <= t) { a = anchors[i]; break; }
    }
    var film = (a.card === CARD_BEGIN || a.card === CARD_BLACK);
    return {
      card: a.card,
      frames: a.frames + (film ? a.rate * (t - a.t) : 0),
      rate: a.rate,
      splices: a.splices
    };
  }
  function pushAnchor(t, card, frames, rate, splices) {
    anchors.push({ t: t, frames: frames, card: card, rate: rate, splices: splices });
  }

  // ---------- piece clock (anchored to first rAF timestamp) ----------
  var clockStart = null, clockNow = 0;
  function pieceT() { return clockNow; }

  // ---------- audio: original music-box loop, first tap only ----------
  // An original generic ragtime-style melody (composed for this piece,
  // not a reproduction of any existing tune): a syncopated music-box
  // melody over a quiet oom-pah bass, ~8 bars of 2 beats, looped.
  var BEAT = 0.42;            // seconds per beat
  var LOOP_BEATS = 16;
  var EVENTS = [];
  (function buildEvents() {
    var mel = [
      [0, 72], [0.5, 76], [1, 79], [2, 76], [2.5, 74], [3, 72],
      [4, 74], [4.5, 77], [5, 81], [6, 77], [6.5, 76], [7, 74],
      [8, 72], [8.5, 76], [9, 79], [10, 84], [10.5, 81], [11, 79],
      [12, 81], [12.5, 79], [13, 76], [14, 74], [15, 72]
    ];
    var bass = [
      [0, 48], [2, 43], [4, 45], [6, 43],
      [8, 48], [10, 43], [12, 41], [14, 43]
    ];
    var i;
    for (i = 0; i < mel.length; i++) EVENTS.push({ beat: mel[i][0], midi: mel[i][1], g: 0.9 });
    for (i = 0; i < bass.length; i++) EVENTS.push({ beat: bass[i][0], midi: bass[i][1], g: 0.4 });
    EVENTS.sort(function (a, b) { return a.beat - b.beat; });
  })();

  var actx = null, audioLive = false, audioStartT = 0;
  var busIn = null, sched = { idx: 0, loopStart: 0 };

  function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function playNote(midi, when, g) {
    var f = midiHz(midi);
    var out = actx.createGain();
    out.gain.setValueAtTime(0, when);
    out.gain.linearRampToValueAtTime(g, when + 0.004);
    out.gain.exponentialRampToValueAtTime(0.0008, when + 0.55);
    var o1 = actx.createOscillator();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(f, when);
    var o2 = actx.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(f * 3, when);
    var g2 = actx.createGain();
    g2.gain.setValueAtTime(0.22, when);
    o1.connect(out);
    o2.connect(g2);
    g2.connect(out);
    out.connect(busIn);
    o1.start(when); o2.start(when);
    o1.stop(when + 0.6); o2.stop(when + 0.6);
  }

  function scheduleAhead() {
    if (!audioLive || !actx) return;
    var ahead = actx.currentTime + 0.25;
    var guard = 0;
    while (guard++ < 64) {
      var ev = EVENTS[sched.idx];
      var when = sched.loopStart + ev.beat * BEAT;
      if (when > ahead) break;
      if (when >= actx.currentTime - 0.05) playNote(ev.midi, when, ev.g);
      sched.idx++;
      if (sched.idx >= EVENTS.length) {
        sched.idx = 0;
        sched.loopStart += LOOP_BEATS * BEAT;
      }
    }
  }

  function startAudio() {
    if (audioLive) return;
    var AC = null;
    if (typeof AudioContext !== 'undefined') AC = AudioContext;
    else if (typeof webkitAudioContext !== 'undefined') AC = webkitAudioContext;
    if (!AC) return; // no audio in this environment: the piece runs silently
    try {
      actx = new AC();
      var bp = actx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1700;
      bp.Q.value = 0.7;
      var master = actx.createGain();
      master.gain.value = 0.16;
      bp.connect(master);
      master.connect(actx.destination);
      busIn = bp;
      if (actx.state === 'suspended' && actx.resume) actx.resume();
      sched.idx = 0;
      sched.loopStart = actx.currentTime + 0.08;
      audioLive = true;
      audioStartT = pieceT();
      scheduleAhead();
    } catch (err) {
      actx = null;
      audioLive = false;
    }
  }

  // ---------- drawing ----------
  function pad4(n) {
    var s = String(n);
    while (s.length < 4) s = '0' + s;
    return s;
  }

  function drawCardText(lines) {
    // lines: array of {text, size, weight, gap}
    var total = 0, i;
    for (i = 0; i < lines.length; i++) total += lines[i].size + (lines[i].gap || 0);
    var y = GEO.cardCy - total / 2;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (i = 0; i < lines.length; i++) {
      var L = lines[i];
      var size = L.size;
      ctx.font = (L.weight || '400') + ' ' + size + 'px "Helvetica Neue", Arial, sans-serif';
      var wText = ctx.measureText(L.text).width;
      var maxW = GEO.cardW * 0.92;
      if (wText > maxW) {
        size = Math.floor(size * maxW / wText);
        ctx.font = (L.weight || '400') + ' ' + size + 'px "Helvetica Neue", Arial, sans-serif';
      }
      ctx.fillText(L.text, GEO.cx, y);
      y += L.size + (L.gap || 0);
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var st = stateAt(t);
    var frames = st.frames + liveScrub;

    // ground: black, except the held black frame breathes (0.05 Hz)
    if (st.card === CARD_BLACK) {
      var v = Math.round(7 + 6 * Math.sin(2 * Math.PI * 0.05 * t - Math.PI / 2));
      ctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
    } else {
      ctx.fillStyle = BLACK;
    }
    ctx.fillRect(0, 0, W, H);

    // the card
    if (st.card === CARD_WARNING) {
      ctx.fillStyle = PAPER;
      ctx.fillRect(GEO.cx - GEO.cardW / 2, GEO.cardCy - GEO.cardH / 2, GEO.cardW, GEO.cardH);
      ctx.fillStyle = BLACK;
      drawCardText([
        { text: 'WARNING', size: GEO.warnTitle, weight: '700', gap: GEO.warnLine * 0.9 },
        { text: 'This film may be especially unsuitable for epileptics', size: GEO.warnLine, gap: GEO.warnLine * 0.5 },
        { text: 'A physician should be in attendance', size: GEO.warnLine }
      ]);
    } else if (st.card === CARD_TITLE) {
      ctx.fillStyle = WHITE;
      drawCardText([
        { text: 'TONY CONRAD PRESENTS', size: GEO.cardSmall, gap: GEO.cardBig * 0.9 },
        { text: 'A PHYSICIAN SHOULD BE IN ATTENDANCE', size: GEO.cardBig, weight: '600' }
      ]);
    } else if (st.card === CARD_BEGIN) {
      ctx.fillStyle = WHITE;
      drawCardText([
        { text: 'THE FILM WILL NOW BEGIN', size: GEO.cardBig, weight: '600' }
      ]);
    }
    // CARD_BLACK: nothing. The film never arrives.

    // booth readout
    var shown = Math.floor(frames);
    shown = ((shown % 10000) + 10000) % 10000;
    ctx.fillStyle = AMBER;
    ctx.font = GEO.readSize + 'px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('FRAME ' + pad4(shown) + ' / ' + st.splices + ' SPLICES / ' + st.rate.toFixed(1) + ' Hz', GEO.cx, GEO.readY);

    // gramophone disc glyph: spins only while the ragtime plays
    var ang = audioLive ? (t - audioStartT) * 2 * Math.PI * 0.55 : 0;
    var dx = GEO.cx, dy = GEO.discY, r = GEO.discR;
    ctx.beginPath();
    ctx.arc(dx, dy, r, 0, Math.PI * 2);
    ctx.fillStyle = PAPER;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(dx, dy, r * 0.62, 0, Math.PI * 2);
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(dx, dy, r * 0.34, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(dx, dy, r * 0.13, 0, Math.PI * 2);
    ctx.fillStyle = AMBER;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(dx + Math.cos(ang) * r * 0.8, dy + Math.sin(ang) * r * 0.8, Math.max(1.4, r * 0.11), 0, Math.PI * 2);
    ctx.fillStyle = BLACK;
    ctx.fill();
  }

  // ---------- pointer: tap advances, double-tap reseeds, drag scrubs ----------
  var pDown = null;
  var lastTapUp = -10;
  var liveScrub = 0;

  function evPos(e) {
    return { x: e.clientX || 0, y: e.clientY || 0 };
  }

  canvas.addEventListener('pointerdown', function (e) {
    startAudio(); // first gesture starts the ragtime; never autoplayed
    var p = evPos(e);
    pDown = { x: p.x, y: p.y, t: pieceT(), moved: false };
    liveScrub = 0;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pDown) return;
    var p = evPos(e);
    var dxTotal = p.x - pDown.x;
    if (Math.abs(dxTotal) > 6 || Math.abs(p.y - pDown.y) > 6) pDown.moved = true;
    if (pDown.moved) liveScrub = dxTotal * 2; // 2 frames per pixel scrubbed
  });
  function endPointer() {
    if (!pDown) return;
    var t = pieceT();
    var st = stateAt(t);
    if (pDown.moved) {
      // commit the scrub as an anchor: the counter keeps the offset
      pushAnchor(t, st.card, st.frames + liveScrub, st.rate, st.splices);
    } else if (t - pDown.t < 0.4) {
      if (t - lastTapUp < 0.35) {
        // double-tap: reseed the booth numbers
        var rate = 6 + Math.floor(rng() * 9);            // 6.0 to 14.0 Hz
        var splices = 240 + Math.floor(rng() * 520);     // 240 to 759 splices
        pushAnchor(t, st.card, st.frames, rate, splices);
        lastTapUp = -10;
      } else {
        // tap: advance the cards; the loop never delivers a film
        pushAnchor(t, (st.card + 1) % 4, st.frames, st.rate, st.splices);
        lastTapUp = t;
      }
    }
    liveScrub = 0;
    pDown = null;
    draw(t);
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- run ----------
  resize();
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  draw(0); // frame one: synchronous, warning card, FRAME 0000, disc still, silent

  if (typeof requestAnimationFrame === 'function') {
    var loop = function (ts) {
      if (clockStart === null) clockStart = ts;
      clockNow = (ts - clockStart) / 1000;
      scheduleAhead();
      draw(clockNow);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
