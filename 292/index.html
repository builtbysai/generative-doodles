<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.292 Kawaii Vessels Grid</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F7EFE0; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.292 Kawaii Vessels Grid (Ruby Waters).
// A 4x3 flash sheet of creature-vessels on cream paper,
// thin vermilion rules between cells. Exactly 12 cells.
// Each vessel has a face and a function. Watch-only:
// 24 second loop, staggered per cell, plants sway,
// candle flames flicker as layered translucent ellipses,
// eyes blink in a slow cascade, octopus tentacles drift.
// Frame one is offset so several cells are already
// mid-blink and mid-sway.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CREAM = '#F7EFE0', VERM = '#D23A2A', COBALT = '#2B5EA7',
    INK = '#1A1A1A', MUST = '#E0A437', MINT = '#7FD1B9';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T0 = 7.4; // frame one offset into the loop
var T = T0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function smooth(a, b, x) { var u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); }
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function outline(w) { ctx.strokeStyle = INK; ctx.lineWidth = w || 4; ctx.stroke(); }

// Blink: each cell on its own phase, period 6s, brief closure.
// Returns eye openness 0..1.
function openness(idx) {
  var ph = ((T + idx * 0.55) % 6) / 6; // 0..1
  var d = Math.min(ph, 1 - ph) * 6; // distance to wrap in seconds-ish
  // blink centred at phase 0: closed when d < 0.14
  var o = smooth(0.02, 0.16, d);
  return clamp(o, 0.08, 1);
}
function sway(idx, amp) { return Math.sin(T * Math.PI * 2 / 24 * 3 + idx * 1.7) * (amp || 4); }

// Faces: three vocabularies only.
function faceGoogly(cx, cy, idx, spread, r) {
  var o = openness(idx);
  var dx = spread || 20, rad = r || 11;
  for (var s = -1; s <= 1; s += 2) {
    var ex = cx + s * dx;
    ctx.save();
    ctx.translate(ex, cy); ctx.scale(1, Math.max(0.12, o));
    circ(0, 0, rad); ctx.fillStyle = CREAM; ctx.fill(); outline(3.5);
    if (o > 0.25) { circ(s * 2, 1, rad * 0.48); ctx.fillStyle = INK; ctx.fill(); circ(s * 2 - 2, -2, 2.4); ctx.fillStyle = CREAM; ctx.fill(); }
    ctx.restore();
  }
  blush(cx, cy, dx);
  mouth(cx, cy + 16);
}
function faceMoon(cx, cy, idx, spread) {
  var o = openness(idx);
  var dx = spread || 20;
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  for (var s = -1; s <= 1; s += 2) {
    ctx.beginPath();
    // closed moon: downward arc, flattens a touch on blink
    ctx.arc(cx + s * dx, cy - 2 + (1 - o) * 2, 10, Math.PI * 0.15, Math.PI * 0.85, false);
    ctx.stroke();
  }
  blush(cx, cy, dx);
  mouth(cx, cy + 16);
}
function faceSlit(cx, cy, idx, spread) {
  var o = openness(idx);
  var dx = spread || 20;
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  for (var s = -1; s <= 1; s += 2) {
    var w = 10, h = 5 * Math.max(0.15, o);
    ctx.beginPath(); ctx.moveTo(cx + s * dx - w, cy); ctx.lineTo(cx + s * dx + w, cy - h * 0.3); ctx.stroke();
  }
  blush(cx, cy, dx);
  mouth(cx, cy + 16);
}
function blush(cx, cy, dx) {
  ctx.fillStyle = VERM;
  ctx.globalAlpha = 0.55;
  circ(cx - dx - 16, cy + 10, 7); ctx.fill();
  circ(cx + dx + 16, cy + 10, 7); ctx.fill();
  ctx.globalAlpha = 1;
}
function mouth(cx, cy) {
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy - 3, 6, Math.PI * 0.1, Math.PI * 0.9, false); ctx.stroke();
}
function flame(x, y, idx, scale) {
  var sc = scale || 1;
  var f = Math.sin(T * 5.1 + idx * 2.3) * 2.2 + Math.sin(T * 8.7 + idx) * 1.1;
  var h = (20 + Math.sin(T * 6.3 + idx * 1.9) * 3) * sc;
  ctx.globalAlpha = 0.35; ellipse(x + f * 0.4, y - h * 0.45, 11 * sc, h * 0.62); ctx.fillStyle = MUST; ctx.fill();
  ctx.globalAlpha = 0.55; ellipse(x + f * 0.6, y - h * 0.38, 7.5 * sc, h * 0.45); ctx.fillStyle = VERM; ctx.fill();
  ctx.globalAlpha = 0.9; ellipse(x + f * 0.3, y - h * 0.28, 4 * sc, h * 0.26); ctx.fillStyle = MUST; ctx.fill();
  ctx.globalAlpha = 1;
}

// ---- 12 vessel painters, centred at (cx,cy) in a ~220x190 cell ----
function vDaruma(cx, cy, idx) {
  var sw = sway(idx, 3);
  // fronds from head
  ctx.strokeStyle = MINT; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (var i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(cx + i * 10, cy - 62);
    ctx.quadraticCurveTo(cx + i * 16 + sw * (1 + Math.abs(i) * 0.3), cy - 92, cx + i * 22 + sw * 1.6, cy - 100 - Math.abs(2 - Math.abs(i)) * 4); ctx.stroke();
    circ(cx + i * 22 + sw * 1.6, cy - 102 - Math.abs(2 - Math.abs(i)) * 4, 5); ctx.fillStyle = MINT; ctx.fill();
  }
  ellipse(cx, cy + 8, 58, 66); ctx.fillStyle = VERM; ctx.fill(); outline(5);
  ellipse(cx, cy + 22, 36, 40); ctx.fillStyle = CREAM; ctx.fill(); outline(3.5);
  faceGoogly(cx, cy + 6, idx, 19, 10);
}
function vTiger(cx, cy, idx) {
  rr(cx - 54, cy - 48, 108, 108, 26); ctx.fillStyle = MUST; ctx.fill(); outline(5);
  ctx.save(); rr(cx - 54, cy - 48, 108, 108, 26); ctx.clip();
  ctx.strokeStyle = INK; ctx.lineWidth = 7;
  for (var i = 0; i < 4; i++) { line(cx - 56, cy - 20 + i * 26, cx - 22, cy - 28 + i * 26); line(cx + 56, cy - 20 + i * 26, cx + 22, cy - 28 + i * 26); }
  ctx.fillStyle = CREAM; ctx.fillRect(cx - 27, cy + 6, 54, 46);
  ctx.restore(); rr(cx - 54, cy - 48, 108, 108, 26); outline(5);
  // ears
  circ(cx - 44, cy - 50, 14); ctx.fillStyle = MUST; ctx.fill(); outline(4);
  circ(cx + 44, cy - 50, 14); ctx.fillStyle = MUST; ctx.fill(); outline(4);
  faceSlit(cx, cy + 12, idx, 19);
}
function vCatBrush(cx, cy, idx) {
  // brushes behind
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
  var cols = [VERM, MINT, MUST];
  for (var i = -1; i <= 1; i++) {
    line(cx + i * 20, cy - 30, cx + i * 26, cy - 92);
    circ(cx + i * 26, cy - 96, 9); ctx.fillStyle = cols[i + 1]; ctx.fill(); outline(3);
  }
  ellipse(cx, cy + 18, 56, 58); ctx.fillStyle = COBALT; ctx.fill(); outline(5);
  circ(cx - 42, cy - 34, 15); ctx.fillStyle = COBALT; ctx.fill(); outline(4);
  circ(cx + 42, cy - 34, 15); ctx.fillStyle = COBALT; ctx.fill(); outline(4);
  circ(cx - 42, cy - 34, 6); ctx.fillStyle = MINT; ctx.fill();
  circ(cx + 42, cy - 34, 6); ctx.fillStyle = MINT; ctx.fill();
  faceGoogly(cx, cy + 10, idx, 19, 10);
  // whiskers
  ctx.strokeStyle = CREAM; ctx.lineWidth = 2.5;
  line(cx - 52, cy + 22, cx - 30, cy + 26); line(cx + 30, cy + 26, cx + 52, cy + 22);
}
function vCatLamp(cx, cy, idx) {
  // striped body
  ctx.save();
  ellipse(cx, cy + 14, 58, 62); ctx.fillStyle = CREAM; ctx.fill(); ctx.clip();
  ctx.fillStyle = VERM;
  for (var i = 0; i < 4; i++) ctx.fillRect(cx - 60, cy - 34 + i * 30, 120, 13);
  ctx.restore();
  ellipse(cx, cy + 14, 58, 62); outline(5);
  circ(cx - 44, cy - 38, 14); ctx.fillStyle = VERM; ctx.fill(); outline(4);
  circ(cx + 44, cy - 38, 14); ctx.fillStyle = VERM; ctx.fill(); outline(4);
  // glowing candle window
  ellipse(cx, cy + 28, 24, 28); ctx.fillStyle = MUST; ctx.fill(); outline(3.5);
  ctx.globalAlpha = 0.28; circ(cx, cy + 22, 34); ctx.fillStyle = MUST; ctx.fill(); ctx.globalAlpha = 1;
  flame(cx, cy + 36, idx, 1.05);
  faceMoon(cx, cy - 18, idx, 19);
}
function vVase(cx, cy, idx) {
  var sw = sway(idx, 4);
  // blooms
  ctx.strokeStyle = MINT; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (var i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(cx, cy - 36); ctx.quadraticCurveTo(cx + i * 18 + sw, cy - 62, cx + i * 30 + sw * 1.5, cy - 78); ctx.stroke();
    for (var p = 0; p < 5; p++) { var a = p / 5 * Math.PI * 2; circ(cx + i * 30 + sw * 1.5 + Math.cos(a) * 10, cy - 82 + Math.sin(a) * 10, 7); ctx.fillStyle = VERM; ctx.fill(); }
    circ(cx + i * 30 + sw * 1.5, cy - 82, 5); ctx.fillStyle = MUST; ctx.fill();
  }
  ctx.beginPath(); ctx.moveTo(cx - 20, cy - 34); ctx.lineTo(cx + 20, cy - 34); ctx.lineTo(cx + 38, cy + 8); ctx.lineTo(cx + 30, cy + 68); ctx.lineTo(cx - 30, cy + 68); ctx.lineTo(cx - 38, cy + 8); ctx.closePath();
  ctx.fillStyle = COBALT; ctx.fill(); outline(5);
  faceMoon(cx, cy + 22, idx, 17);
}
function vDog(cx, cy, idx) {
  ellipse(cx, cy + 16, 60, 56); ctx.fillStyle = CREAM; ctx.fill(); outline(5);
  // spots
  ctx.fillStyle = INK;
  circ(cx - 34, cy - 8, 10); ctx.fill(); circ(cx + 38, cy + 34, 8); ctx.fill(); circ(cx - 12, cy + 48, 7); ctx.fill(); circ(cx + 26, cy - 20, 6); ctx.fill();
  // floppy ears
  ellipse(cx - 38, cy - 58, 13, 24); ctx.fillStyle = MUST; ctx.fill(); outline(4);
  ellipse(cx + 38, cy - 58, 13, 24); ctx.fillStyle = MUST; ctx.fill(); outline(4);
  circ(cx, cy - 34, 30); ctx.fillStyle = CREAM; ctx.fill(); outline(4);
  faceGoogly(cx, cy - 38, idx, 15, 8);
  circ(cx, cy - 20, 6); ctx.fillStyle = INK; ctx.fill();
}
function vGourd(cx, cy, idx) {
  ellipse(cx, cy + 34, 46, 44); ctx.fillStyle = MUST; ctx.fill(); outline(5);
  circ(cx, cy - 28, 34); ctx.fillStyle = MUST; ctx.fill(); outline(5);
  // hair bun
  circ(cx, cy - 64, 12); ctx.fillStyle = INK; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy - 28, 34, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  faceMoon(cx, cy - 26, idx, 15);
  // sash
  ctx.strokeStyle = VERM; ctx.lineWidth = 9; line(cx - 38, cy + 42, cx + 38, cy + 22);
}
function vChrys(cx, cy, idx) {
  // pot
  rr(cx - 52, cy + 18, 104, 58, 12); ctx.fillStyle = VERM; ctx.fill(); outline(5);
  ctx.fillStyle = CREAM; for (var d = 0; d < 3; d++) { circ(cx - 28 + d * 28, cy + 46, 6); ctx.fill(); }
  // chrysanthemum bloom as face head
  var sw = sway(idx, 2);
  ctx.save(); ctx.translate(sw, 0);
  for (var p = 0; p < 12; p++) { var a = p / 12 * Math.PI * 2; ellipse(cx + Math.cos(a) * 34, cy - 26 + Math.sin(a) * 34, 18, 11); ctx.fillStyle = MUST; ctx.fill(); outline(2.5); }
  circ(cx, cy - 26, 38); ctx.fillStyle = CREAM; ctx.fill(); outline(4);
  faceSlit(cx, cy - 28, idx, 18);
  ctx.restore();
}
function vTeapot(cx, cy, idx) {
  ellipse(cx, cy + 14, 62, 52); ctx.fillStyle = MINT; ctx.fill(); outline(5);
  // spout and handle
  ctx.beginPath(); ctx.moveTo(cx + 54, cy - 2); ctx.quadraticCurveTo(cx + 86, cy - 12, cx + 82, cy + 18); ctx.quadraticCurveTo(cx + 66, cy + 24, cx + 56, cy + 16); ctx.closePath(); ctx.fillStyle = MINT; ctx.fill(); outline(4);
  ctx.beginPath(); ctx.arc(cx - 66, cy + 12, 20, Math.PI * 0.4, Math.PI * 1.6); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
  // lid
  ellipse(cx, cy - 36, 28, 12); ctx.fillStyle = MINT; ctx.fill(); outline(4);
  circ(cx, cy - 48, 8); ctx.fillStyle = VERM; ctx.fill();
  // scarf band
  ctx.save(); ellipse(cx, cy + 14, 62, 52); ctx.clip(); ctx.fillStyle = VERM; ctx.fillRect(cx - 64, cy + 30, 128, 16);
  ctx.fillStyle = MUST; for (var d = 0; d < 5; d++) ctx.fillRect(cx - 56 + d * 26, cy + 30, 8, 16);
  ctx.restore(); ellipse(cx, cy + 14, 62, 52); outline(5);
  faceGoogly(cx, cy + 2, idx, 19, 10);
}
function vShrine(cx, cy, idx) {
  // shrine arch
  rr(cx - 56, cy - 58, 112, 128, 50); ctx.fillStyle = INK; ctx.fill(); outline(5);
  rr(cx - 42, cy - 44, 84, 100, 38); ctx.fillStyle = CREAM; ctx.fill(); outline(3.5);
  // candle
  rr(cx - 14, cy + 6, 28, 44, 5); ctx.fillStyle = COBALT; ctx.fill(); outline(3.5);
  flame(cx, cy + 4, idx, 1.15);
  // face on shrine top
  faceMoon(cx, cy - 22, idx, 16);
  // base
  ctx.fillStyle = VERM; ctx.fillRect(cx - 58, cy + 66, 116, 10);
}
function vOctopus(cx, cy, idx) {
  // tentacles drifting
  ctx.strokeStyle = COBALT; ctx.lineWidth = 11; ctx.lineCap = 'round';
  for (var i = -2; i <= 2; i++) {
    var drift = Math.sin(T * Math.PI * 2 / 24 * 2 + idx + i * 0.9) * 7;
    ctx.beginPath(); ctx.moveTo(cx + i * 20, cy + 48);
    ctx.quadraticCurveTo(cx + i * 24 + drift, cy + 72, cx + i * 28 + drift * 1.5, cy + 82 - Math.abs(i) * 4); ctx.stroke();
    circ(cx + i * 28 + drift * 1.5, cy + 82 - Math.abs(i) * 4, 5); ctx.fillStyle = COBALT; ctx.fill();
  }
  ellipse(cx, cy - 2, 58, 58); ctx.fillStyle = COBALT; ctx.fill(); outline(5);
  ctx.fillStyle = MINT; circ(cx - 30, cy + 22, 7); ctx.fill(); circ(cx + 34, cy + 10, 6); ctx.fill(); circ(cx + 8, cy + 36, 5); ctx.fill();
  // pot rim on head
  ellipse(cx, cy - 56, 30, 10); ctx.fillStyle = MUST; ctx.fill(); outline(3.5);
  faceGoogly(cx, cy - 6, idx, 20, 11);
}
function vCatMug(cx, cy, idx) {
  // mug handle
  ctx.beginPath(); ctx.arc(cx + 62, cy + 10, 24, -Math.PI * 0.45, Math.PI * 0.45); ctx.strokeStyle = INK; ctx.lineWidth = 13; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 62, cy + 10, 24, -Math.PI * 0.45, Math.PI * 0.45); ctx.strokeStyle = MUST; ctx.lineWidth = 7; ctx.stroke();
  rr(cx - 56, cy - 42, 112, 112, 16); ctx.fillStyle = MUST; ctx.fill(); outline(5);
  // ears
  ctx.beginPath(); ctx.moveTo(cx - 48, cy - 40); ctx.lineTo(cx - 34, cy - 68); ctx.lineTo(cx - 16, cy - 42); ctx.closePath(); ctx.fillStyle = MUST; ctx.fill(); outline(4);
  ctx.beginPath(); ctx.moveTo(cx + 16, cy - 42); ctx.lineTo(cx + 34, cy - 68); ctx.lineTo(cx + 48, cy - 40); ctx.closePath(); ctx.fillStyle = MUST; ctx.fill(); outline(4);
  // steam as mint curls, swaying
  var sw = sway(idx, 3);
  ctx.strokeStyle = MINT; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (var i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(cx + i * 22 + sw, cy - 52); ctx.quadraticCurveTo(cx + i * 22 - sw, cy - 66, cx + i * 22 + sw, cy - 78); ctx.stroke(); }
  faceMoon(cx, cy + 8, idx, 20);
  ctx.fillStyle = VERM; circ(cx - 34, cy + 46, 6); ctx.fill(); circ(cx, cy + 52, 6); ctx.fill(); circ(cx + 34, cy + 46, 6); ctx.fill();
}

var CELLS = [vDaruma, vTiger, vCatBrush, vCatLamp, vVase, vDog, vGourd, vChrys, vTeapot, vShrine, vOctopus, vCatMug];
if (CELLS.length !== 12) { throw new Error('Kawaii Vessels Grid requires exactly 12 cells, got ' + CELLS.length); }

function draw() {
  ctx.fillStyle = CREAM;
  ctx.fillRect(-80, -80, DW + 160, DH + 160);
  var mx = 72, my = 58, gw = DW - mx * 2, gh = DH - my * 2;
  var cw = gw / 4, ch = gh / 3;
  // sheet border
  ctx.strokeStyle = VERM; ctx.lineWidth = 3;
  ctx.strokeRect(mx, my, gw, gh);
  for (var i = 0; i < CELLS.length; i++) {
    var col = i % 4, row = Math.floor(i / 4);
    var x0 = mx + col * cw, y0 = my + row * ch;
    var cx = x0 + cw / 2, cy = y0 + ch / 2 + 6;
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, cw, ch); ctx.clip();
    CELLS[i](cx, cy, i);
    ctx.restore();
    // rules
    ctx.strokeStyle = VERM; ctx.lineWidth = 2;
    if (col > 0) line(x0, y0, x0, y0 + ch);
    if (row > 0) line(x0, y0, x0 + cw, y0);
  }
  ctx.strokeStyle = VERM; ctx.lineWidth = 3;
  ctx.strokeRect(mx, my, gw, gh);
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function stepSim() { T += TICK; }

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = CREAM;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
