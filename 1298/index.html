<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interrupted Factory</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1C1D21; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;

  // Seeded PRNG (mulberry32). No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Deterministic per-loop value in [0,1) from loop index and a salt.
  // Loop reseeds (swerve apparatus, cover timings) use this, never Math.random.
  function loopRand(loop, salt) {
    var r = mulberry32(1298000 + loop * 97 + salt * 13);
    return r();
  }

  // Palette
  var ROOM = '#1C1D21', FLOOR = '#17171B', STEEL = '#8A8D94',
      STEELDARK = '#565960', COVER = '#CFC7B8', COVEREDGE = '#B0A68E',
      GLOW = '#E4B04A', WEB = '#A9AEB8', RED = '#8C2F28',
      THREADDIM = '#6B6257', FLOORLINE = '#2A2B30';

  var CYCLE = 90;
  var curT = 0;

  // Apparatuses: loose row, receding slightly. offsets stagger the 90 s
  // state cycle so frame one shows one WORK, one IDLE, one half-covered,
  // one HALTED, and never all four covered at once.
  // type: 0 = thread stand, 1 = sewing machine. slipped: cover stops at 55%.
  var APPS = [
    { x: 0.07, scale: 1.00, type: 0, off: 0,  slipped: false },
    { x: 0.29, scale: 0.92, type: 1, off: 35, slipped: false },
    { x: 0.51, scale: 0.84, type: 0, off: 58, slipped: true },
    { x: 0.70, scale: 0.76, type: 1, off: 76, slipped: false }
  ];
  var floorY = 0, slotW = 0, slotH = 0;
  var webEls = []; // seeded web elements, drawn in order, count grows per cycle

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W; canvas.height = H;
    var minDim = 1e9;
    if (typeof window !== 'undefined' && window.screen) {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
    isPhone = minDim < 700 || (H > W * 1.15 && minDim === 1e9);
    if (typeof window !== 'undefined' && window.screen) {
      isPhone = minDim < 700;
      if (!isPhone && H > W * 1.15) isPhone = true;
    }
  }

  function build() {
    floorY = H * 0.82;
    slotW = W * 0.16;
    slotH = H * 0.42;
    // Seeded web: radials fanning from the top-left corner into the room,
    // endpoints on an arc so the fan reads, plus arcs between neighbours.
    var r = mulberry32(1298);
    var ax = W * 0.012, ay = H * 0.012;
    var R = Math.min(W, H) * 0.30;
    var radials = [];
    for (var i = 0; i < 8; i++) {
      var ang = (0.28 + i * 0.11 + r() * 0.04) * Math.PI / 2;
      radials.push({ x: ax + Math.cos(ang) * R * (0.85 + r() * 0.3),
                     y: ay + Math.sin(ang) * R * (0.85 + r() * 0.3) });
    }
    webEls = [];
    for (var k = 0; k < 8; k++) {
      webEls.push({ kind: 0, x: radials[k].x, y: radials[k].y });
      if (k < 6) {
        var a = radials[k], b = radials[k + 1];
        var fr = 0.35 + 0.4 * r();
        webEls.push({ kind: 1,
                      x1: ax + (a.x - ax) * fr, y1: ay + (a.y - ay) * fr,
                      x2: ax + (b.x - ax) * fr, y2: ay + (b.y - ay) * fr,
                      cx: ax + (a.x + b.x - 2 * ax) * fr * 0.45,
                      cy: ay + (a.y + b.y - 2 * ay) * fr * 0.45 });
      }
    }
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(a, b, v) {
    var t = clamp((v - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }

  // State of apparatus i at piece time t. Returns {state, cover, swerve}.
  // state: 0 WORK, 1 IDLE, 2 COVERED, 3 HALTED. cover: 0..1 extent of the
  // dust cover (slipped machines cap at 0.55). swerve: 0..1 quiver strength.
  function appState(i, t) {
    var a = APPS[i];
    var loop = Math.floor(t / CYCLE);
    var p = (t + a.off) % CYCLE;
    var coverDur = 6 + 4 * loopRand(loop, i + 1);
    var st, cover = 0;
    var maxCover = a.slipped ? 0.55 : 1;
    if (p < 30) { st = 0; }
    else if (p < 50) { st = 1; }
    else if (p < 70) { st = 2; cover = maxCover * clamp((p - 50) / coverDur, 0, 1); }
    else { st = 3; cover = maxCover * (1 - clamp((p - 70) / 6, 0, 1)); }
    // Swerve: at loop time 60-70 s, one seeded apparatus snaps taut.
    var swApp = Math.floor(loopRand(loop, 99) * APPS.length);
    var lt = t % CYCLE, sw = 0;
    if (swApp === i && lt >= 60 && lt < 70) {
      sw = smooth(60, 62, lt) * (1 - smooth(67, 70, lt));
    }
    return { state: st, cover: cover, swerve: sw };
  }

  function line(x1, y1, x2, y2, col, w) {
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function rect(x, y, w, h, col) {
    ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
  }
  function quad(x1, y1, x2, y2, cx, cy, col, w) {
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
  }
  // Glowing thread: layered flat-alpha passes, no shadowBlur, no gradients.
  function glowLine(x1, y1, x2, y2, cx, cy, vib) {
    var passes = [[5, 0.07], [3, 0.14], [1.6, 0.9]];
    for (var i = 0; i < passes.length; i++) {
      ctx.strokeStyle = GLOW; ctx.globalAlpha = passes[i][1]; ctx.lineWidth = passes[i][0];
      ctx.beginPath(); ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cx, cy + vib, x2, y2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawStand(a, x, baseY, s, st) {
    var mw = slotW * s, mh = slotH * s;
    var cx = x + mw * 0.5;
    var top = baseY - mh;
    // Base and rod.
    rect(x + mw * 0.30, baseY - mh * 0.03, mw * 0.40, mh * 0.03, STEELDARK);
    line(cx, baseY - mh * 0.03, cx, top + mh * 0.06, STEEL, Math.max(2, 3 * s));
    // Crossbar with two spools; the lower spool is the single warning-red detail.
    line(cx - mw * 0.30, top + mh * 0.10, cx + mw * 0.30, top + mh * 0.10, STEEL, Math.max(2, 3 * s));
    rect(cx - mw * 0.34, top + mh * 0.02, mw * 0.14, mh * 0.16, STEELDARK);
    rect(cx - mw * 0.32, top + mh * 0.04, mw * 0.10, mh * 0.12, STEEL);
    rect(cx + mw * 0.20, top + mh * 0.02, mw * 0.14, mh * 0.16, STEELDARK);
    rect(cx + mw * 0.22, top + mh * 0.04, mw * 0.10, mh * 0.12, RED);
    // Thread path: top spool down to a take-up hook.
    var sx = cx - mw * 0.27, sy = top + mh * 0.18;
    var tx = x + mw * 0.78, ty = baseY - mh * 0.30;
    drawThread(sx, sy, tx, ty, st, mh);
  }

  function drawMachine(a, x, baseY, s, st) {
    var mw = slotW * s, mh = slotH * s;
    var tableY = baseY - mh * 0.30;
    // Table and legs.
    rect(x, tableY, mw, mh * 0.04, STEELDARK);
    rect(x + mw * 0.08, tableY + mh * 0.04, mw * 0.05, baseY - tableY - mh * 0.04, STEELDARK);
    rect(x + mw * 0.85, tableY + mh * 0.04, mw * 0.05, baseY - tableY - mh * 0.04, STEELDARK);
    // Body: column, arm, needle bar. Bare steel silhouette.
    var bx = x + mw * 0.10, bw = mw * 0.62, bh = mh * 0.34;
    var bodyTop = tableY - bh;
    rect(bx, bodyTop + bh * 0.55, mw * 0.14, bh * 0.45, STEEL);
    rect(bx, bodyTop, bw, bh * 0.45, STEEL);
    line(bx + mw * 0.04, bodyTop + bh * 0.45, bx + mw * 0.04, bodyTop + bh * 0.55, STEELDARK, 1);
    // Needle bar and presser foot at the arm end.
    var nx = bx + bw - mw * 0.06;
    line(nx, bodyTop + bh * 0.45, nx, tableY - mh * 0.02, STEEL, Math.max(1.5, 2.5 * s));
    rect(nx - mw * 0.05, tableY - mh * 0.05, mw * 0.10, mh * 0.03, STEELDARK);
    // Spool on the arm.
    rect(bx + mw * 0.08, bodyTop - mh * 0.10, mw * 0.10, mh * 0.10, STEELDARK);
    rect(bx + mw * 0.10, bodyTop - mh * 0.08, mw * 0.06, mh * 0.06, STEEL);
    // Thread path: arm spool down to the needle tip.
    drawThread(bx + mw * 0.13, bodyTop - mh * 0.02, nx, tableY - mh * 0.02, st, mh);
  }

  // Thread rendering by state. t is piece time (for vibration / quiver).
  function drawThread(sx, sy, tx, ty, st, mh) {
    var mx = (sx + tx) / 2, my = (sy + ty) / 2;
    if (st.state === 2) return; // swallowed by the cover
    if (st.swerve > 0) {
      var q = Math.sin(curT * 2 * Math.PI * 9) * 3 * st.swerve;
      glowLine(sx, sy, tx, ty, mx, my, q);
      return;
    }
    if (st.state === 0) {
      var vib = Math.sin(curT * 2 * Math.PI * 7 + sx) * 1.1;
      glowLine(sx, sy, tx, ty, mx, my, vib);
    } else if (st.state === 1) {
      // IDLE: sag grows over the first 5 s of the phase, then holds.
      var a = APPS[drawThread._i];
      var p = (curT + a.off) % CYCLE;
      var sag = clamp((p - 30) / 5, 0, 1) * mh * 0.16;
      quad(sx, sy, tx, ty, mx, my + sag, THREADDIM, 1.5);
    } else {
      // HALTED: slack thread drooping to a small coil at the base.
      quad(sx, sy, tx, ty, mx, my + mh * 0.22, THREADDIM, 1.5);
      ctx.strokeStyle = THREADDIM; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.lineTo(tx + 6, ty + 8); ctx.lineTo(tx - 5, ty + 14); ctx.lineTo(tx + 4, ty + 20);
      ctx.stroke();
    }
  }

  // Draped cover over one apparatus: narrow (the apparatus's own width, not
  // the whole slot), hanging from the apparatus top, bottom edge slanting
  // where it slipped mid-pull.
  function drawCover(x, appTop, baseY, s, st) {
    if (st.cover <= 0) return;
    var mw = slotW * s;
    var cw = mw * 0.62, cx0 = x + mw * 0.19;
    var bot = appTop + st.cover * (baseY - appTop);
    ctx.fillStyle = COVER;
    ctx.beginPath();
    ctx.moveTo(cx0, appTop);
    ctx.lineTo(cx0 + cw, appTop);
    ctx.lineTo(cx0 + cw, bot - 10);
    ctx.lineTo(cx0, bot);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = COVEREDGE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx0 + cw * 0.30, appTop + 4);
    ctx.lineTo(cx0 + cw * 0.28, bot - 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx0 + cw * 0.65, appTop + 4);
    ctx.lineTo(cx0 + cw * 0.68, bot - 12); ctx.stroke();
  }

  function drawNeedle() {
    // Giant needle, foreground right, point cropped by the frame. A tool
    // first: eye slot near the top end, long tapered shaft, point at the
    // far end exiting the frame bottom-right.
    var tx = W * 0.70, ty = H * 0.30;
    var len = H * 1.05, wid = Math.max(6, H * 0.028);
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(0.52);
    ctx.fillStyle = STEEL;
    ctx.beginPath();
    ctx.moveTo(-wid / 2, 0);
    ctx.lineTo(-wid / 2, len * 0.90);
    ctx.lineTo(0, len);
    ctx.lineTo(wid / 2, len * 0.90);
    ctx.lineTo(wid / 2, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#C9CCD2'; ctx.lineWidth = Math.max(1, wid * 0.18);
    ctx.beginPath(); ctx.moveTo(-wid * 0.18, len * 0.10);
    ctx.lineTo(-wid * 0.18, len * 0.84); ctx.stroke();
    // Eye slot near the top end.
    ctx.fillStyle = ROOM;
    ctx.fillRect(-wid * 0.10, len * 0.06, wid * 0.20, len * 0.045);
    ctx.restore();
  }

  function drawWeb(t) {
    var n = Math.min(webEls.length, 5 + Math.floor(t / CYCLE));
    ctx.strokeStyle = WEB; ctx.lineWidth = 1; ctx.globalAlpha = 0.4;
    var ax = W * 0.012, ay = H * 0.012;
    for (var i = 0; i < n; i++) {
      var e = webEls[i];
      ctx.beginPath();
      if (e.kind === 0) { ctx.moveTo(ax, ay); ctx.lineTo(e.x, e.y); }
      else { ctx.moveTo(e.x1, e.y1); ctx.quadraticCurveTo(e.cx, e.cy, e.x2, e.y2); }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    curT = t;
    ctx.fillStyle = ROOM; ctx.fillRect(0, 0, W, H);
    // Floor.
    rect(0, floorY, W, H - floorY, FLOOR);
    line(0, floorY, W, floorY, FLOORLINE, 1);
    drawWeb(t);
    // Apparatuses, back to front.
    for (var i = APPS.length - 1; i >= 0; i--) {
      var a = APPS[i];
      var x = a.x * W;
      var baseY = floorY - (1 - a.scale) * 24;
      var st = appState(i, t);
      drawThread._i = i;
      var appTop;
      if (a.type === 0) { drawStand(a, x, baseY, a.scale, st); appTop = baseY - slotH * a.scale; }
      else { drawMachine(a, x, baseY, a.scale, st); appTop = baseY - slotH * a.scale * 0.74; }
      drawCover(x, appTop, baseY, a.scale, st);
    }
    drawNeedle();
    // Pin canvas size (phone rule).
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function onResize() {
    size(); build(); draw(curT);
  }
  size(); build();
  draw(0); // boot-flagged first frame: exactly t = 0, clock starts with rAF
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
  window.addEventListener('resize', onResize);
  // rAF loop: plain function declaration, armed from the real scheduler only.
  var T0 = 0, started = false;
  function loop(ts) {
    if (!started) { T0 = ts; started = true; }
    draw((ts - T0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
