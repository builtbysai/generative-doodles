<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm Tuning</title>
<style>
html, body { margin: 0; padding: 0; background: #241811; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: an extreme close-up of a palm, palm up, filling the frame under
   warm lamplight. String tunings are inked in ballpoint blue across the
   skin, and on a slow fixed loop the ink fades and rewrites itself with new
   numbers, one marking at a time. A thin violin string at the frame edge
   retunes with each marking: its drawn tension shifts and short bowed
   phrase marks appear beside it. The reading is intimate and silent, watch
   only, the hand the only geography. */
var TAU = Math.PI * 2;
var GROUND = '#241811';
var GLOW_HI = '#6B4423';
var GLOW_SOFT = '#4A2E1A';
var SKIN_HI = '#EBC49C';
var SKIN = '#D9A986';
var SKIN_LO = '#C98F66';
var SKIN_DEEP = '#B57E56';
var CREASE = '#9C6B45';
var BALLPOINT = '#1F3A93';
var BALLPOINT_SOFT = '#3B5BB5';
var INK = '#1A1512';
var VARNISH = '#5C3A1E';
var VARNISH_HI = '#7A4E28';
var VARNISH_LO = '#3E2712';
var STRING_DIM = '#D8C9A8';
var STRING_LIT = '#F2E8D0';
var PLATE = '#F2E8D8';
var PLATE_LINE = 'rgba(36,24,17,0.35)';
var TITLE_INK = '#241811';
var HINT_INK = '#5C4A38';
var FRAME_T = 60.0;        /* fixed phase for frame one */
var CYCLE = 48.0;          /* four markings, 12 s each */
var SLOT = 12.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* The four tunings, one per violin string, written across the palm. */
var MARKINGS = [
  { fx: 0.28, fy: 0.46, text: 'G3  196 Hz' },
  { fx: 0.56, fy: 0.37, text: 'D4  294 Hz' },
  { fx: 0.40, fy: 0.65, text: 'A4  440 Hz' },
  { fx: 0.66, fy: 0.57, text: 'E5  659 Hz' }
];
/* Seeded tilt and underline wobble per marking, so the handwriting sits
   with care and never changes between frames. */
var MARK_ROT = [], MARK_WOB = [];
(function () {
  var i, rng;
  for (i = 0; i < MARKINGS.length; i++) {
    rng = mulberry32(1861 + i * 13);
    MARK_ROT.push((rng() - 0.5) * 0.14);
    MARK_WOB.push((rng() - 0.5) * 0.012);
  }
})();
/* Four violin strings down the varnish band at the right frame edge. */
var STRING_FX = [0.915, 0.938, 0.961, 0.984];
/* Which marking is being read at phase time t, and how far its ink has
   faded in or out within its 12 s slot. At frame one (t = 60) the cycle
   sits mid-slot on the second marking, so its ink is fully present. */
function cycleState(t) {
  var ct = (t + 4) % CYCLE;
  var idx = Math.floor(ct / SLOT) % MARKINGS.length;
  var local = ct % SLOT;
  var a = 1;
  if (local < 1.5) a = local / 1.5;
  else if (local > 10.5) a = (SLOT - local) / 1.5;
  return { idx: idx, alpha: clamp(a, 0, 1), local: local };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on
   desktop. The page ground takes the piece's own lamplight dark. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function drawLampGlow(rc) {
  var m = Math.min(rc.w, rc.h);
  var g = ctx.createRadialGradient(rc.x + rc.w * 0.30, rc.y + rc.h * 0.22, 0,
    rc.x + rc.w * 0.30, rc.y + rc.h * 0.22, m * 0.75);
  g.addColorStop(0, rgba(GLOW_HI, 0.55));
  g.addColorStop(0.6, rgba(GLOW_SOFT, 0.30));
  g.addColorStop(1, rgba(GROUND, 0));
  ctx.fillStyle = g;
  ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
  /* shallow depth of field feel: large soft out-of-focus shapes behind
     the palm, drawn as low-alpha radial washes */
  var blobs = [
    { x: 0.18, y: 0.82, r: 0.30, col: GLOW_SOFT, a: 0.35 },
    { x: 0.85, y: 0.12, r: 0.26, col: VARNISH_LO, a: 0.40 },
    { x: 0.10, y: 0.15, r: 0.22, col: GLOW_HI, a: 0.25 }
  ];
  var i, b, bg;
  for (i = 0; i < blobs.length; i++) {
    b = blobs[i];
    bg = ctx.createRadialGradient(rc.x + b.x * rc.w, rc.y + b.y * rc.h, 0,
      rc.x + b.x * rc.w, rc.y + b.y * rc.h, b.r * m);
    bg.addColorStop(0, rgba(b.col, b.a));
    bg.addColorStop(1, rgba(b.col, 0));
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(rc.x + b.x * rc.w + b.r * m, rc.y + b.y * rc.h);
    ctx.arc(rc.x + b.x * rc.w, rc.y + b.y * rc.h, b.r * m, 0, TAU);
    ctx.fill();
  }
}
function drawPalm(rc, t) {
  var m = Math.min(rc.w, rc.h);
  var cx = rc.x + rc.w * 0.48, cy = rc.y + rc.h * 0.60;
  /* palm mound: warm skin gradient, lighter toward the lamplight. Radii
     follow the field's own width and height, so the palm fills a tall
     phone field as fully as a square desktop one. */
  var prx = rc.w * 0.46, pry = rc.h * 0.40;
  var g = ctx.createRadialGradient(cx - prx * 0.22, cy - pry * 0.30, m * 0.05, cx, cy, Math.max(prx, pry) * 1.05);
  g.addColorStop(0, SKIN_HI);
  g.addColorStop(0.55, SKIN);
  g.addColorStop(1, SKIN_LO);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(cx + prx, cy);
  ctx.ellipse(cx, cy, prx, pry, -0.12, 0, TAU);
  ctx.fill();
  /* heel of the palm, lower left, slightly deeper tone */
  ctx.fillStyle = rgba(SKIN_LO, 0.85);
  ctx.beginPath();
  ctx.moveTo(cx - rc.w * 0.05 + rc.w * 0.30, cy + rc.h * 0.16);
  ctx.ellipse(cx - rc.w * 0.05, cy + rc.h * 0.16, rc.w * 0.30, rc.h * 0.24, 0.25, 0, TAU);
  ctx.fill();
  /* soft shadow where the palm curves away, lower right */
  ctx.fillStyle = rgba(SKIN_DEEP, 0.28);
  ctx.beginPath();
  ctx.moveTo(cx + rc.w * 0.30 + rc.w * 0.22, cy + rc.h * 0.22);
  ctx.ellipse(cx + rc.w * 0.30, cy + rc.h * 0.22, rc.w * 0.22, rc.h * 0.16, -0.35, 0, TAU);
  ctx.fill();
  /* fingers: soft rounded forms cropped by the top frame edge */
  var fx = [0.16, 0.33, 0.50, 0.67], i, x0, x1, y0, y1;
  ctx.lineCap = 'round';
  for (i = 0; i < fx.length; i++) {
    x0 = rc.x + rc.w * fx[i];
    x1 = x0 + (i - 1.5) * m * 0.010;
    y0 = rc.y - m * 0.02;
    y1 = rc.y + rc.h * (0.26 - i * 0.008 + (i === 1 ? 0.03 : 0));
    ctx.strokeStyle = SKIN;
    ctx.lineWidth = m * 0.085;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    ctx.strokeStyle = rgba(SKIN_HI, 0.8);
    ctx.lineWidth = m * 0.028;
    ctx.beginPath();
    ctx.moveTo(x0 - m * 0.018, y0 + m * 0.02);
    ctx.lineTo(x1 - m * 0.018, y1 - m * 0.02);
    ctx.stroke();
  }
  /* thumb: a thick soft form entering from the left edge */
  ctx.strokeStyle = SKIN_LO;
  ctx.lineWidth = m * 0.095;
  ctx.beginPath();
  ctx.moveTo(rc.x - m * 0.02, rc.y + rc.h * 0.78);
  ctx.quadraticCurveTo(rc.x + rc.w * 0.10, rc.y + rc.h * 0.66, rc.x + rc.w * 0.24, rc.y + rc.h * 0.56);
  ctx.stroke();
  ctx.strokeStyle = rgba(SKIN_HI, 0.7);
  ctx.lineWidth = m * 0.028;
  ctx.beginPath();
  ctx.moveTo(rc.x + rc.w * 0.02, rc.y + rc.h * 0.76);
  ctx.quadraticCurveTo(rc.x + rc.w * 0.10, rc.y + rc.h * 0.65, rc.x + rc.w * 0.21, rc.y + rc.h * 0.57);
  ctx.stroke();
  /* crease lines across the palm, restrained and low contrast */
  ctx.strokeStyle = rgba(CREASE, 0.55);
  ctx.lineWidth = Math.max(1.5, m * 0.004);
  ctx.beginPath();
  ctx.moveTo(rc.x + rc.w * 0.14, rc.y + rc.h * 0.52);
  ctx.quadraticCurveTo(rc.x + rc.w * 0.45, rc.y + rc.h * 0.38, rc.x + rc.w * 0.78, rc.y + rc.h * 0.42);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rc.x + rc.w * 0.12, rc.y + rc.h * 0.62);
  ctx.quadraticCurveTo(rc.x + rc.w * 0.45, rc.y + rc.h * 0.52, rc.x + rc.w * 0.80, rc.y + rc.h * 0.55);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rc.x + rc.w * 0.30, rc.y + rc.h * 0.30);
  ctx.quadraticCurveTo(rc.x + rc.w * 0.18, rc.y + rc.h * 0.58, rc.x + rc.w * 0.38, rc.y + rc.h * 0.88);
  ctx.stroke();
}
function drawMarking(rc, idx, alpha, t) {
  var m = Math.min(rc.w, rc.h);
  var mk = MARKINGS[idx];
  var x = rc.x + rc.w * mk.fx, y = rc.y + rc.h * mk.fy;
  var fs = Math.max(13, Math.round(m * 0.032));
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(MARK_ROT[idx]);
  ctx.font = 'italic bold ' + fs + 'px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = rgba(BALLPOINT, alpha);
  ctx.fillText(mk.text, 0, 0);
  var tw = ctx.measureText(mk.text).width;
  /* ballpoint underline, slightly wobbled, like a quick pen stroke */
  ctx.strokeStyle = rgba(BALLPOINT_SOFT, alpha * 0.9);
  ctx.lineWidth = Math.max(1.2, m * 0.0025);
  ctx.beginPath();
  ctx.moveTo(0, fs * 0.55);
  ctx.quadraticCurveTo(tw * 0.5, fs * 0.55 + MARK_WOB[idx] * m, tw, fs * 0.55);
  ctx.stroke();
  ctx.restore();
}
function drawVarnishEdge(rc, t, st) {
  var m = Math.min(rc.w, rc.h);
  var bandX = rc.x + rc.w * 0.90;
  var bandW = rc.w * 0.10;
  var g = ctx.createLinearGradient(bandX, 0, bandX + bandW, 0);
  g.addColorStop(0, VARNISH_LO);
  g.addColorStop(0.45, VARNISH);
  g.addColorStop(0.75, VARNISH_HI);
  g.addColorStop(1, VARNISH_LO);
  ctx.fillStyle = g;
  ctx.fillRect(bandX, rc.y, bandW, rc.h);
  /* wood grain running down the varnish */
  var i, gx;
  ctx.strokeStyle = 'rgba(26,21,18,0.30)';
  ctx.lineWidth = 1;
  for (i = 0; i < 3; i++) {
    gx = bandX + bandW * (0.25 + i * 0.25);
    ctx.beginPath();
    ctx.moveTo(gx, rc.y);
    ctx.quadraticCurveTo(gx + m * 0.004, rc.y + rc.h * 0.5, gx, rc.y + rc.h);
    ctx.stroke();
  }
  /* thin lamplight edge where the varnish meets the palm */
  ctx.fillStyle = rgba(STRING_LIT, 0.35);
  ctx.fillRect(bandX, rc.y, Math.max(1, m * 0.002), rc.h);
  /* the four strings: the active one is drawn taut and bright, its
     tension shifted by the marking being read; the others hang slack */
  var j, sx, bow, active;
  for (j = 0; j < STRING_FX.length; j++) {
    sx = rc.x + rc.w * STRING_FX[j];
    active = (j === st.idx);
    if (active) {
      bow = (st.idx - 1.5) * m * 0.008 + Math.sin(TAU * t / 9 + j) * m * 0.002;
    } else {
      bow = m * 0.003 * (j % 2 === 0 ? 1 : -1);
    }
    ctx.strokeStyle = active ? rgba(STRING_LIT, 0.95) : rgba(STRING_DIM, 0.45);
    ctx.lineWidth = active ? Math.max(1.5, m * 0.002) : 1;
    ctx.beginPath();
    ctx.moveTo(sx, rc.y);
    ctx.quadraticCurveTo(sx + bow, rc.y + rc.h * 0.5, sx, rc.y + rc.h);
    ctx.stroke();
  }
  /* short bowed phrase marks beside the active string, appearing with
     the ink of the marking being read */
  var rng = mulberry32(1861 + st.idx * 29);
  var px, py, pl;
  ctx.strokeStyle = rgba(STRING_LIT, st.alpha * 0.9);
  ctx.lineWidth = Math.max(1.2, m * 0.0025);
  ctx.lineCap = 'round';
  for (j = 0; j < 4; j++) {
    px = rc.x + rc.w * STRING_FX[st.idx] - m * 0.028 - rng() * m * 0.012;
    py = rc.y + rc.h * (0.22 + j * 0.15 + (rng() - 0.5) * 0.03);
    pl = m * 0.016 + rng() * m * 0.010;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + pl, py + pl * 0.35);
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Palm Tuning').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Palm Tuning').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 15').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Palm Tuning', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 15', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  var st = cycleState(t);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.beginPath();
  ctx.rect(sc.x, sc.y, sc.w, sc.h);
  ctx.clip();
  ctx.fillStyle = GROUND;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  drawLampGlow(sc);
  drawPalm(sc, t);
  /* the previous marking lingers as a faint ghost of fading ink */
  var prev = (st.idx + MARKINGS.length - 1) % MARKINGS.length;
  drawMarking(sc, prev, 0.10, t);
  drawMarking(sc, st.idx, st.alpha, t);
  drawVarnishEdge(sc, t, st);
  ctx.restore();
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    markingCount: MARKINGS.length,
    cycleStateAt: function (t) { return cycleState(t); }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, second marking fully inked ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
