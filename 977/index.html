<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Erased Crossing</title>
<style>
  html, body { margin:0; padding:0; background:#0B0D12; overflow:hidden; height:100%; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.977 "The Erased Crossing" - study #120 daito-manabe, PP138.
   Diminished reality at a night crossing. Pedestrian silhouettes cross
   the zebra; the system detects them in the scan band, outlines them,
   dissolves them, and inpaints the void with a striated guess of wood
   grain and contour lines. The ghosts keep walking. One real figure at
   centre is never erased. The machine is not sinister. It is just doing
   its job. */

var ASPHALT = '#0B0D12', ZEBRA = [201,207,219], SIL = '#05060A',
    MINT = [125,249,198], AMBER = [217,164,65], TEAL = [46,125,123],
    CONTOUR = [58,61,70], COAT = '#8A5A3A', SKIN = '#E8C39E';
var NEON = [[255,79,216],[79,214,255],[255,196,79]];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function h1(n){ n = Math.imul(n ^ (n >>> 15), 2246822519); n = Math.imul(n ^ (n >>> 13), 3266489917); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
function rgba(c, a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 720, H = 720;

function isPhone(){
  var sw = 9999, sh = 9999;
  if (typeof window !== 'undefined' && window.screen){ sw = window.screen.width; sh = window.screen.height; }
  if (Math.min(sw, sh) < 700) return true;
  return H > W * 1.15;
}
function resize(){
  var w = W, h = H;
  if (typeof window !== 'undefined' && window.visualViewport){
    w = window.visualViewport.width; h = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth){
    w = window.innerWidth; h = window.innerHeight;
  }
  W = Math.max(200, Math.floor(w)); H = Math.max(200, Math.floor(h));
  canvas.width = W; canvas.height = H;
}
if (typeof window !== 'undefined'){
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);
}
resize();

/* ---------------- stage + scene constants (720 x 720 design space) ---- */
var SCAN_Y = 245, BAND_T = 200, BAND_B = 290;
var U = { x: 0.9613, y: -0.2756 };        /* zebra direction */
var V = { x: 0.2756, y: 0.9613 };         /* crossing direction */
var DT = 1 / 120;
var simT = 0, stepIdx = 0, gen = 0;
var rng = mulberry32(977138);
var walkers = [];
var neonSmears = [];
var soundEvents = [];
var nextBeat = 1.0;

/* ---------------- walkers ----------------
   state: solid -> detected (0.8 s) -> dissolve (0.35 s) -> ghost -> exit.
   Detection fires while a solid walker is inside the scan band, after its
   seeded delay, unless it is inside a tap-granted exemption window. */
function makeStriations(r, fh, bw){
  var lines = [], n = Math.max(5, Math.round(fh / 3.4));
  for (var i = 0; i < n; i++){
    lines.push({
      dy: (i + 0.5) * (fh / n),
      col: (i % 4 === 3) ? 2 : (i % 2),          /* 0 amber, 1 teal, 2 contour */
      phase: r() * Math.PI * 2,
      amp: 0.7 + r() * 1.1,
      freq: 0.05 + r() * 0.06
    });
  }
  return lines;
}
function configureWalker(w, cfg){
  w.ax = cfg.a.x; w.ay = cfg.a.y;
  w.dx = cfg.d.x; w.dy = cfg.d.y;
  var len = Math.sqrt(w.dx * w.dx + w.dy * w.dy);
  w.ux = w.dx / len; w.uy = w.dy / len; w.pathLen = len;
  w.speed = cfg.speed;
  w.fh = cfg.fh;
  w.bw = w.fh * 0.36;
  w.spawnAt = cfg.spawnAt || 0;
  w.detectDelay = (cfg.detectDelay !== undefined) ? cfg.detectDelay : 0.3 + rng() * 3.2;
  w.state = cfg.initState || 'solid';
  w.stateT = 0;
  w.dist = cfg.initDist || 0;
  w.active = false;
  w.inBand = false;
  w.detectAt = Infinity;
  w.exemptUntil = -1;
  w.bobPh = rng() * Math.PI * 2;
  w.smearX = 0; w.smearY = 0;
  w.lines = makeStriations(rng, w.fh, w.bw);
  return w;
}
function seg(ex, ey, ux, uy, len){ return { a: { x: ex, y: ey }, d: { x: ux * len, y: uy * len } }; }
function randomCfg(r){
  var flow = Math.floor(r() * 4), sp = 17 + r() * 14, fh = 26 + r() * 14;
  var j = (r() - 0.5) * 0.09, cs = Math.cos(j), sn = Math.sin(j);
  function rot(vx, vy){ return { x: vx * cs - vy * sn, y: vx * sn + vy * cs }; }
  var d, a;
  if (flow === 0){ d = rot(U.x, U.y); a = { x: -50, y: 120 + r() * 520 }; }
  else if (flow === 1){ d = rot(-U.x, -U.y); a = { x: 770, y: 80 + r() * 480 }; }
  else if (flow === 2){ d = rot(V.x, V.y); a = { x: 60 + r() * 560, y: -50 }; }
  else { d = rot(-V.x, -V.y); a = { x: 100 + r() * 520, y: 770 }; }
  var c = seg(a.x, a.y, d.x, d.y, 900);
  c.speed = sp; c.fh = fh;
  return c;
}
function buildGeneration(seed){
  rng = mulberry32(seed);
  gen++;
  simT = 0; stepIdx = 0; nextBeat = 1.0;
  walkers = [];
  function add(cfg){ var w = configureWalker({}, cfg); walkers.push(w); return w; }
  function S(a, d, speed, fh, extra){
    var c = seg(a.x, a.y, d.x, d.y, 900);
    c.speed = speed; c.fh = fh;
    if (extra) for (var k in extra) c[k] = extra[k];
    return add(c);
  }
  /* scripted first cast: guarantees the frame-one composition after the
     30 s pre-roll. Respawned walkers afterwards are fully generic. */
  S({x:-50,y:470}, U, 20, 34, { initState:'ghost', initDist: 100 });                   /* ghost, along */
  S({x:770,y:210}, {x:-U.x,y:-U.y}, 18, 30, { initState:'ghost', initDist: 200 });     /* ghost, along back */
  S({x:300,y:-50}, V, 20, 36, { initState:'ghost', initDist: 60 });                    /* ghost, crossing down */
  S({x:430,y:770}, {x:-V.x,y:-V.y}, 19, 28, { initState:'ghost', initDist: 140 });    /* ghost, crossing up */
  S({x:370,y:-50}, V, 26, 38, { spawnAt: 17.8, detectDelay: 1.2 });                    /* hero: mid-dissolve at t=30 */
  S({x:-50,y:560}, U, 20, 32, { initDist: 150 });                                      /* solid, low lane, never in band */
  S({x:520,y:770}, {x:-V.x,y:-V.y}, 21, 33, { spawnAt: 19 });                          /* solid, rising late */
  S({x:-50,y:640}, U, 19, 29, { initDist: 200 });                                      /* solid, bottom lane */
  S({x:180,y:-50}, V, 22, 31, { spawnAt: 24 });                                        /* solid, enters late up top */
  S({x:-50,y:380}, U, 21, 35, { initState:'ghost', initDist: 120 });                   /* ghost, mid band */
  S({x:240,y:-50}, V, 24, 30, { detectDelay: 2.0 });                                   /* erases early, ghost by frame one */
  S({x:770,y:430}, {x:-U.x,y:-U.y}, 22, 34, { initState:'ghost', initDist: 120 });     /* ghost, along back low */
  S({x:600,y:770}, {x:-V.x,y:-V.y}, 25, 32, { spawnAt: 6, detectDelay: 1.5 });         /* erases late in pre-roll */
  S({x:-50,y:300}, U, 27, 27, { spawnAt: 3, detectDelay: 2.5 });                       /* erases early, ghost near exit */
  /* neon signage smears along the top edge */
  neonSmears = [];
  for (var i = 0; i < 6; i++){
    neonSmears.push({
      x: 20 + i * 118 + rng() * 30, y: 10 + rng() * 22,
      w: 62 + rng() * 95, h: 15 + rng() * 13,
      col: NEON[i % 3], a: 0.10 + rng() * 0.09
    });
  }
}
buildGeneration(977138);

function walkerPos(w){
  return { x: w.ax + w.ux * w.dist, y: w.ay + w.uy * w.dist };
}
function stepSim(){
  simT += DT; stepIdx++;
  if (simT >= nextBeat){ soundEvents.push({ kind: 'beat' }); nextBeat += 1.15; }
  for (var i = 0; i < walkers.length; i++){
    var w = walkers[i];
    if (!w.active){
      if (simT >= w.spawnAt) w.active = true;
      else continue;
    }
    w.dist += w.speed * DT;
    w.stateT += DT;
    var p = walkerPos(w);
    var inBand = (p.y >= BAND_T && p.y <= BAND_B);
    if (w.state === 'solid'){
      if (inBand && !w.inBand) w.detectAt = simT + w.detectDelay;
      if (!inBand) w.detectAt = Infinity;
      if (inBand && simT >= w.detectAt && simT >= w.exemptUntil){
        w.state = 'detected'; w.stateT = 0;
        soundEvents.push({ kind: 'scan' });
      }
    } else if (w.state === 'detected' && w.stateT >= 0.8){
      w.state = 'dissolve'; w.stateT = 0;
      soundEvents.push({ kind: 'dissolve' });
    } else if (w.state === 'dissolve' && w.stateT >= 0.35){
      w.state = 'ghost'; w.stateT = 0;
    }
    w.inBand = inBand;
    /* smear relaxes over about five seconds */
    var dec = Math.exp(-DT / 1.6);
    w.smearX *= dec; w.smearY *= dec;
    if (w.dist > w.pathLen + 30){
      var cfg = randomCfg(rng);
      cfg.spawnAt = simT + 1 + rng() * 4;
      configureWalker(w, cfg);
    }
  }
}
/* frame one: exactly 3600 fixed steps (30 s of crossing) */
for (var p0 = 0; p0 < 3600; p0++) stepSim();
soundEvents.length = 0;

/* ---------------- drawing ---------------- */
function stageBox(){
  var S = Math.min(W, H);
  return { ox: (W - S) / 2, oy: (H - S) / 2, sc: S / 720 };
}
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
  ctx.lineTo(x + w, y + h - r); ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  ctx.lineTo(x + r, y + h); ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  ctx.closePath();
}
/* figure path: head circle + body stadium. (x, y) is the feet centre. */
function figurePath(x, y, fh){
  var hr = fh * 0.13, bw = fh * 0.36;
  var headCY = y - fh + hr;
  var bodyTop = y - fh + hr * 1.55, bodyBot = y - fh * 0.06;
  var capT = bodyTop + bw / 2, capB = bodyBot - bw / 2;
  ctx.beginPath();
  ctx.arc(x, headCY, hr, 0, Math.PI * 2);
  ctx.moveTo(x - bw / 2, capT);
  ctx.arc(x, capT, bw / 2, Math.PI, Math.PI * 2);       /* top cap, over the top */
  ctx.lineTo(x + bw / 2, capB);
  ctx.arc(x, capB, bw / 2, 0, Math.PI);                /* bottom cap, under */
  ctx.closePath();
  return { hr: hr, bw: bw, headCY: headCY, bodyTop: bodyTop, bodyBot: bodyBot };
}
function drawStriations(w, x, y, fh, alpha, grow){
  var topY = y - fh;
  ctx.save();
  figurePath(x, y, fh);
  ctx.clip();
  if (grow < 1){
    ctx.beginPath();
    ctx.rect(x - fh, y - fh * grow * 1.12, fh * 2, fh * grow * 1.12 + 2);
    ctx.clip();
  }
  ctx.fillStyle = rgba(CONTOUR, 0.35 * alpha);
  ctx.fillRect(x - fh * 0.3, topY - 2, fh * 0.6, fh + 4);
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  for (var i = 0; i < w.lines.length; i++){
    var L = w.lines[i];
    var col = (L.col === 0) ? AMBER : (L.col === 1) ? TEAL : CONTOUR;
    ctx.strokeStyle = rgba(col, (L.col === 2 ? 0.55 : 0.85) * alpha);
    ctx.beginPath();
    var bend = 0.4 + 0.6 * Math.sin(L.dy * 0.28);
    for (var px = -w.bw / 2 - 2; px <= w.bw / 2 + 2; px += 4){
      var yy = topY + L.dy + Math.sin(px * L.freq + L.phase) * L.amp + w.smearY * bend * 0.4;
      var xx = x + px + w.smearX * bend;
      if (px <= -w.bw / 2 - 1) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function drawOutline(x, y, fh, geo){
  var fl = 0.5 + 0.5 * h1(((stepIdx >> 2) * 13) + Math.round(x));
  ctx.strokeStyle = rgba(MINT, 0.35 + 0.55 * fl);
  ctx.lineWidth = 1.3;
  var i, a, r, px, py;
  ctx.beginPath();
  for (i = 0; i <= 12; i++){
    a = (i / 12) * Math.PI * 2;
    r = geo.hr + 2.2 + (h1(stepIdx * 3 + i * 7) - 0.5) * 3;
    px = x + Math.cos(a) * r; py = geo.headCY + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  var cx = x, cy = (geo.bodyTop + geo.bodyBot) / 2;
  var rx = geo.bw / 2 + 2.2, ry = (geo.bodyBot - geo.bodyTop) / 2 + 2.2;
  ctx.beginPath();
  for (i = 0; i <= 18; i++){
    a = (i / 18) * Math.PI * 2;
    var jr = 1 + (h1(stepIdx * 5 + i * 11) - 0.5) * 0.14;
    px = cx + Math.cos(a) * rx * jr; py = cy + Math.sin(a) * ry * jr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}
function drawWalker(w){
  if (!w.active) return;
  var p = walkerPos(w);
  if (p.x < -60 || p.x > 780 || p.y < -60 || p.y > 780) return;
  var fh = w.fh * (isPhone() ? 1.25 : 1);
  var bob = Math.sin(simT * (w.speed * 0.32) + w.bobPh) * 0.8;
  var x = p.x, y = p.y + bob;
  /* ground shadow */
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, p.y + 2, fh * 0.24, fh * 0.07, 0, 0, Math.PI * 2); ctx.fill();
  var geo;
  if (w.state === 'solid' || w.state === 'detected'){
    figurePath(x, y, fh);
    ctx.fillStyle = SIL; ctx.fill();
    ctx.strokeStyle = 'rgba(201,207,219,0.14)';   /* wet rim light, keeps the silhouette findable */
    ctx.lineWidth = 1; ctx.stroke();
    geo = figurePath(x, y, fh);
    if (w.state === 'detected') drawOutline(x, y, fh, geo);
  } else if (w.state === 'dissolve'){
    var dp = Math.min(1, w.stateT / 0.35);
    figurePath(x, y, fh);
    ctx.fillStyle = 'rgba(5,6,10,' + (1 - dp) + ')'; ctx.fill();
    drawStriations(w, x, y, fh, dp, dp);
    geo = figurePath(x, y, fh);
    drawOutline(x, y, fh, geo);
  } else { /* ghost */
    drawStriations(w, x, y, fh, 0.92, 1);
  }
  if (simT < w.exemptUntil && w.state !== 'ghost'){
    var tx = x + fh * 0.30, ty = y - fh - 5;
    ctx.strokeStyle = rgba(MINT, 0.9); ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(tx - 3.4, ty); ctx.lineTo(tx - 1.2, ty + 2.6); ctx.lineTo(tx + 3.6, ty - 3.2);
    ctx.stroke();
  }
}
function drawRealFigure(){
  var x = 360, y = 392, fh = 46 * (isPhone() ? 1.2 : 1);
  var breathe = 1 + 0.012 * Math.sin(simT * (Math.PI * 2 / 4.5));
  var adjT = simT % 20;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(x, y + 2, fh * 0.26, fh * 0.08, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(x, y); ctx.scale(breathe, breathe); ctx.translate(-x, -y);
  var geo = figurePath(x, y, fh);
  ctx.fillStyle = COAT; ctx.fill();
  ctx.beginPath(); ctx.arc(x, geo.headCY, geo.hr, 0, Math.PI * 2);
  ctx.fillStyle = SKIN; ctx.fill();
  if (adjT < 1.2){
    /* glasses adjust: arm tick rises, glasses bar flashes, settles */
    var up = adjT < 0.5 ? adjT / 0.5 : (adjT > 0.9 ? Math.max(0, (1.2 - adjT) / 0.3) : 1);
    ctx.strokeStyle = SKIN; ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(x + geo.bw * 0.42, y - fh * 0.38);
    ctx.lineTo(x + geo.bw * 0.30, (y - fh * 0.38) + (geo.headCY - (y - fh * 0.38)) * up);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(20,16,12,' + (0.85 * up) + ')'; ctx.lineWidth = 1.4;
    var gy = geo.headCY;
    ctx.beginPath();
    ctx.moveTo(x - geo.hr * 0.92, gy); ctx.lineTo(x - geo.hr * 0.12, gy);
    ctx.moveTo(x + geo.hr * 0.12, gy); ctx.lineTo(x + geo.hr * 0.92, gy);
    ctx.moveTo(x - geo.hr * 0.12, gy); ctx.lineTo(x + geo.hr * 0.12, gy);
    ctx.stroke();
  }
  ctx.restore();
}
function draw(){
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = ASPHALT;
  ctx.fillRect(0, 0, W, H);
  var sb = stageBox();
  ctx.save();
  ctx.translate(sb.ox, sb.oy);
  ctx.scale(sb.sc, sb.sc);
  /* zebra: diagonal stripes, clipped to the crossing band */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(360 - U.x * 580 - V.x * 205, 380 - U.y * 580 - V.y * 205);
  ctx.lineTo(360 + U.x * 580 - V.x * 205, 380 + U.y * 580 - V.y * 205);
  ctx.lineTo(360 + U.x * 580 + V.x * 205, 380 + U.y * 580 + V.y * 205);
  ctx.lineTo(360 - U.x * 580 + V.x * 205, 380 - U.y * 580 + V.y * 205);
  ctx.closePath();
  ctx.clip();
  ctx.fillStyle = rgba(ZEBRA, 0.05);
  ctx.fillRect(0, 0, 720, 720);
  ctx.fillStyle = rgba(ZEBRA, 0.5);
  var pitch = 66, sw2 = 30;
  for (var k = -4; k < 5; k++){
    var cxp = 360 + k * pitch * V.x, cyp = 380 + k * pitch * V.y;
    ctx.beginPath();
    ctx.moveTo(cxp - U.x * 580 - V.x * sw2 / 2, cyp - U.y * 580 - V.y * sw2 / 2);
    ctx.lineTo(cxp + U.x * 580 - V.x * sw2 / 2, cyp + U.y * 580 - V.y * sw2 / 2);
    ctx.lineTo(cxp + U.x * 580 + V.x * sw2 / 2, cyp + U.y * 580 + V.y * sw2 / 2);
    ctx.lineTo(cxp - U.x * 580 + V.x * sw2 / 2, cyp - U.y * 580 + V.y * sw2 / 2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  /* wet sheen bands */
  ctx.fillStyle = 'rgba(140,160,190,0.03)';
  ctx.fillRect(0, 470, 720, 26); ctx.fillRect(0, 545, 720, 20); ctx.fillRect(0, 615, 720, 30);
  /* scan band + line */
  ctx.fillStyle = rgba(MINT, 0.02);
  ctx.fillRect(0, BAND_T, 720, BAND_B - BAND_T);
  ctx.fillStyle = rgba(MINT, 0.08);
  ctx.fillRect(0, SCAN_Y, 720, 1);
  /* neon smears, top edge (signage, no letters) */
  for (var i = 0; i < neonSmears.length; i++){
    var ns = neonSmears[i];
    rr(ns.x, ns.y, ns.w, ns.h, ns.h / 2);
    ctx.fillStyle = rgba(ns.col, ns.a); ctx.fill();
    rr(ns.x + ns.w * 0.18, ns.y + ns.h * 0.24, ns.w * 0.64, ns.h * 0.52, ns.h / 4);
    ctx.fillStyle = rgba(ns.col, ns.a * 1.4); ctx.fill();
  }
  /* walkers, painter order by ground y */
  var sorted = walkers.filter(function(w){ return w.active; }).sort(function(a, b){ return walkerPos(a).y - walkerPos(b).y; });
  var ri = sorted.length;
  while (ri-- > 0){ if (walkerPos(sorted[ri]).y <= 392) break; }
  for (var j = 0; j < sorted.length; j++){
    if (j === ri + 1) drawRealFigure();
    drawWalker(sorted[j]);
  }
  if (ri + 1 >= sorted.length) drawRealFigure();
  if (sorted.length === 0) drawRealFigure();
  ctx.restore();
}
draw();

/* ---------------- audio (lazy, guarded) ---------------- */
var AC = null;
function ensureAudio(){
  if (AC) { if (AC.resume) AC.resume(); return; }
  if (typeof window === 'undefined' || !window.AudioContext) return;
  try {
    AC = new window.AudioContext();
    var len = AC.sampleRate * 2;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var ch = buf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    function noiseLoop(freq, type, gain){
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
      var g = AC.createGain(); g.gain.value = gain;
      src.connect(f); f.connect(g); g.connect(AC.destination);
      src.start();
    }
    noiseLoop(220, 'lowpass', 0.016);    /* traffic hum */
    noiseLoop(5200, 'highpass', 0.004);  /* wet hiss */
  } catch (e) { AC = null; }
}
function thump(t0, freq, gain, dur){
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function scanTick(){
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = 2300;
    g.gain.setValueAtTime(0.010, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.03);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + 0.05);
  } catch (e) {}
}
function dissolveSweep(){
  if (!AC) return;
  try {
    var len = AC.sampleRate * 0.4;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var ch = buf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2.5;
    f.frequency.setValueAtTime(1800, AC.currentTime);
    f.frequency.exponentialRampToValueAtTime(300, AC.currentTime + 0.35);
    var g = AC.createGain(); g.gain.value = 0.028;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start();
  } catch (e) {}
}
function drainSounds(){
  if (!AC) { soundEvents.length = 0; return; }
  var played = 0;
  for (var i = 0; i < soundEvents.length && played < 6; i++){
    var k = soundEvents[i].kind;
    if (k === 'beat'){ thump(AC.currentTime, 58, 0.055, 0.12); thump(AC.currentTime + 0.22, 52, 0.038, 0.1); played++; }
    else if (k === 'scan'){ scanTick(); played++; }
    else if (k === 'dissolve'){ dissolveSweep(); played++; }
  }
  soundEvents.length = 0;
}

/* ---------------- interaction (events by piece time) ---------------- */
function toStage(e){
  var r = (canvas.getBoundingClientRect) ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: W, height: H };
  var cx = (e.clientX - r.left) * (W / (r.width || W));
  var cy = (e.clientY - r.top) * (H / (r.height || H));
  var sb = stageBox();
  return { x: (cx - sb.ox) / sb.sc, y: (cy - sb.oy) / sb.sc };
}
var downAt = -10, downPos = null, lastPos = null, moved = false;
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
function onDown(e){
  ensureAudio();
  var p = toStage(e);
  downAt = simT; downPos = p; lastPos = p; moved = false;
  if (simT - lastTapT < 0.35 && Math.abs(p.x - lastTapX) < 34 && Math.abs(p.y - lastTapY) < 34){
    buildGeneration(977138 + gen * 104729);   /* double-tap: a new crossing */
    for (var q = 0; q < 900; q++) stepSim();
    soundEvents.length = 0;
    lastTapT = -10; downPos = null;
    return;
  }
  lastTapT = simT; lastTapX = p.x; lastTapY = p.y;
}
function onMove(e){
  if (!downPos) return;
  var p = toStage(e);
  var mdx = p.x - lastPos.x, mdy = p.y - lastPos.y;
  if (Math.abs(p.x - downPos.x) + Math.abs(p.y - downPos.y) > 8) moved = true;
  if (moved){
    for (var i = 0; i < walkers.length; i++){
      var w = walkers[i];
      if (!w.active || w.state !== 'ghost') continue;
      var wp = walkerPos(w);
      var ddx = wp.x - p.x, ddy = wp.y - w.fh * 0.5 - p.y;
      var d = Math.sqrt(ddx * ddx + ddy * ddy);
      if (d < 70){
        var f = (1 - d / 70) * 0.55;
        w.smearX = Math.max(-14, Math.min(14, w.smearX + mdx * f));
        w.smearY = Math.max(-10, Math.min(10, w.smearY + mdy * f));
      }
    }
  }
  lastPos = p;
}
function onUp(e){
  if (downPos && !moved && simT - downAt < 0.4){
    var p = toStage(e);
    var best = null, bd = 38;
    for (var i = 0; i < walkers.length; i++){
      var w = walkers[i];
      if (!w.active || w.state === 'ghost') continue;
      var wp = walkerPos(w);
      var ddx = wp.x - p.x, ddy = (wp.y - w.fh * 0.5) - p.y;
      var d = Math.sqrt(ddx * ddx + ddy * ddy);
      if (d < bd){ bd = d; best = w; }
    }
    if (best){
      best.exemptUntil = simT + 30;           /* spared for thirty seconds */
      if (best.state === 'detected' || best.state === 'dissolve'){
        best.state = 'solid'; best.stateT = 0; /* the system releases it */
        best.detectAt = Infinity;
      }
    }
  }
  downPos = null; lastPos = null;
}
if (typeof window !== 'undefined' && canvas.addEventListener){
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}

/* ---------------- loop ---------------- */
var lastNow = -1;
function frame(now){
  if (lastNow < 0) lastNow = now;
  var el = (now - lastNow) / 1000;
  lastNow = now;
  if (el > 0.25) el = 0.25;
  var steps = Math.round(el / DT);
  if (steps > 30) steps = 30;
  for (var i = 0; i < steps; i++) stepSim();
  drainSounds();
  draw();
}
if (typeof requestAnimationFrame !== 'undefined'){
  requestAnimationFrame(function tick(now){ frame(now); requestAnimationFrame(tick); });
}
</script>
