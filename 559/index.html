<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Souvenirs del Viajero Experto</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EAC97E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  var INK = '#1A1A1A', TAN = '#EAC97E', BLUE = '#5A8AD6', BROWN = '#8A5A30',
      WHITE = '#FFFFFF', PINK = '#F06AA8', ORANGE = '#F07B2E', RED = '#D93A2B',
      YELLOW = '#F2D230', GREY = '#9A9A9A', CHIP = '#C0392B', GREEN = '#5AB85A';

  var DW = 1080, DH = 1240;     // design space (portrait taxonomy page)
  var PHASE0 = 1.7;             // constant first-frame phase

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function easeOut(v) { return 1 - (1 - v) * (1 - v); }
  function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

  // ---------------- wobbly hand-drawn helpers ----------------
  function wobRectPath(x, y, w, h, r, seed, jit) {
    var rng = mulberry32(seed);
    var pts = [];
    function edge(x0, y0, x1, y1) {
      var len = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
      var n = Math.max(1, Math.round(len / 44));
      for (var i = 0; i < n; i++) {
        var u = i / n;
        pts.push([x0 + (x1 - x0) * u + (rng() - 0.5) * 2 * jit,
                  y0 + (y1 - y0) * u + (rng() - 0.5) * 2 * jit]);
      }
    }
    edge(x + r, y, x + w - r, y);
    edge(x + w, y + r, x + w, y + h - r);
    edge(x + w - r, y + h, x + r, y + h);
    edge(x, y + h - r, x, y + r);
    ctx.beginPath();
    var n = pts.length;
    for (var i = 0; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n];
      var mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      if (i === 0) ctx.moveTo(mx, my);
      else {
        var pp = pts[(i - 1 + n) % n];
        ctx.quadraticCurveTo(pp[0], pp[1], mx, my);
      }
    }
    ctx.closePath();
  }
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fs(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.85);
    ctx.bezierCurveTo(x - s * 1.25, y + s * 0.05, x - s * 0.72, y - s * 0.85, x, y - s * 0.25);
    ctx.bezierCurveTo(x + s * 0.72, y - s * 0.85, x + s * 1.25, y + s * 0.05, x, y + s * 0.85);
    ctx.closePath();
  }
  function starPath(x, y, R, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rad = (i % 2 === 0) ? R : r;
      var a = rot + i * Math.PI / 5 - Math.PI / 2;
      var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // Hand-lettered wobbly text: per-string seeded jitter, stable across frames.
  var FONT = '"Chalkboard SE", "Comic Sans MS", sans-serif';
  function textWob(str, cx, y, size, color, seedExtra, align) {
    ctx.font = '700 ' + size + 'px ' + FONT;
    ctx.textBaseline = 'middle';
    var widths = [], total = 0, i, w;
    for (i = 0; i < str.length; i++) { w = ctx.measureText(str[i]).width; widths.push(w); total += w; }
    var x = (align === 'left') ? cx : cx - total / 2;
    var rng = mulberry32(hashStr(str) * 31 + (seedExtra || 0));
    ctx.fillStyle = color;
    for (i = 0; i < str.length; i++) {
      var jx = (rng() - 0.5) * size * 0.07, jy = (rng() - 0.5) * size * 0.11;
      var rot = (rng() - 0.5) * 0.07;
      ctx.save();
      ctx.translate(x + widths[i] / 2 + jx, y + jy);
      ctx.rotate(rot);
      ctx.textAlign = 'center';
      ctx.fillText(str[i], 0, 0);
      ctx.restore();
      x += widths[i];
    }
    return total;
  }
  function fitSize(str, size, maxW) {
    ctx.font = '700 ' + size + 'px ' + FONT;
    while (size > 10 && ctx.measureText(str).width > maxW) {
      size -= 1; ctx.font = '700 ' + size + 'px ' + FONT;
    }
    return size;
  }

  // ---------------- the traveler (blue rodent) ----------------
  // Local coords: origin at feet centre, unit height ~100.
  function traveler(o) {
    // o: x, y, s, shirt (fill or null), eye: 'open'|'happy'|'cry', mouth: 'smile'|'flat'|'open'|'wavy',
    //    armR: 'down'|'up'|'hold'|'point', armL: 'down'|'up', flip
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.scale((o.flip ? -1 : 1) * o.s, o.s);
    // tail
    ctx.beginPath();
    ctx.moveTo(-16, -8);
    ctx.quadraticCurveTo(-38, -2, -34, -22);
    ctx.strokeStyle = INK; ctx.lineWidth = 3.2; ctx.stroke();
    // feet
    ell(-11, -2, 10, 4); fs(BLUE, 3);
    ell(12, -2, 10, 4); fs(BLUE, 3);
    // body
    ctx.beginPath();
    ctx.moveTo(-21, 0);
    ctx.quadraticCurveTo(-24, -34, -13, -52);
    ctx.quadraticCurveTo(0, -60, 13, -52);
    ctx.quadraticCurveTo(24, -34, 21, 0);
    ctx.closePath(); fs(o.shirt || BLUE, 3.4);
    // left arm
    ctx.beginPath();
    if (o.armL === 'up') { ctx.moveTo(-18, -44); ctx.quadraticCurveTo(-32, -56, -30, -70); }
    else { ctx.moveTo(-18, -44); ctx.quadraticCurveTo(-30, -30, -27, -14); }
    ctx.strokeStyle = INK; ctx.lineWidth = 4.4; ctx.stroke();
    circ(o.armL === 'up' ? -30 : -27, o.armL === 'up' ? -72 : -12, 5); fs(BLUE, 3);
    // ears
    circ(-13, -90, 9); fs(BLUE, 3.2);
    circ(13, -90, 9); fs(BLUE, 3.2);
    circ(-13, -90, 4); fs(WHITE, 0);
    circ(13, -90, 4); fs(WHITE, 0);
    // head
    circ(0, -72, 21); fs(BLUE, 3.4);
    // snout (rodent muzzle, pointing right)
    ell(13, -66, 13, 8.5); fs(BLUE, 3);
    circ(25, -68, 3); fs(INK, 0);
    ctx.beginPath();
    ctx.moveTo(20, -62); ctx.lineTo(33, -59);
    ctx.moveTo(20, -65); ctx.lineTo(34, -65);
    ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.stroke();
    // eye
    if (o.eye === 'happy') {
      ctx.beginPath(); ctx.arc(1, -76, 5, Math.PI * 1.08, Math.PI * 1.92); ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.stroke();
    } else {
      circ(1, -77, 3); fs(INK, 0);
    }
    if (o.eye === 'cry') {
      // tear drops
      ctx.beginPath();
      ctx.moveTo(-6, -66); ctx.quadraticCurveTo(-11, -56, -6, -52); ctx.quadraticCurveTo(-1, -56, -6, -66);
      ctx.closePath(); fs(WHITE, 2);
      ctx.beginPath();
      ctx.moveTo(9, -64); ctx.quadraticCurveTo(4, -55, 9, -51); ctx.quadraticCurveTo(14, -55, 9, -64);
      ctx.closePath(); fs(WHITE, 2);
    }
    // mouth
    ctx.beginPath();
    if (o.mouth === 'open') { ell(13, -58, 4.5, 6); fs(INK, 0); ell(13, -55.5, 3, 3); fs(CHIP, 0); }
    else if (o.mouth === 'wavy') { ctx.moveTo(6, -58); ctx.quadraticCurveTo(10, -61, 14, -58); ctx.quadraticCurveTo(18, -55, 22, -58); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.stroke(); }
    else if (o.mouth === 'flat') { ctx.moveTo(7, -58); ctx.lineTo(19, -58); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.stroke(); }
    else { ctx.arc(12, -61, 6, Math.PI * 0.15, Math.PI * 0.8); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.stroke(); }
    // right arm
    ctx.beginPath();
    if (o.armR === 'up') { ctx.moveTo(18, -44); ctx.quadraticCurveTo(33, -58, 31, -74); }
    else if (o.armR === 'hold') { ctx.moveTo(18, -44); ctx.quadraticCurveTo(32, -40, 36, -50); }
    else if (o.armR === 'point') { ctx.moveTo(18, -44); ctx.quadraticCurveTo(34, -46, 42, -44); }
    else { ctx.moveTo(18, -44); ctx.quadraticCurveTo(30, -30, 27, -14); }
    ctx.strokeStyle = INK; ctx.lineWidth = 4.4; ctx.stroke();
    var hx = o.armR === 'up' ? 31 : (o.armR === 'hold' ? 37 : (o.armR === 'point' ? 44 : 27));
    var hy = o.armR === 'up' ? -76 : (o.armR === 'hold' ? -51 : (o.armR === 'point' ? -44 : -12));
    circ(hx, hy, 5); fs(BLUE, 3);
    ctx.restore();
    return { hx: o.x + (o.flip ? -1 : 1) * hx * o.s, hy: o.y + hy * o.s,
             headX: o.x, headTop: o.y - 100 * o.s, neckX: o.x + 2 * o.s, neckY: o.y - 56 * o.s };
  }

  // tiny white hand (for the collar)
  function tinyHand(x, y, s, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    circ(0, 2, 6); fs(WHITE, 2.2);
    circ(-4.4, -4, 2.6); fs(WHITE, 2);
    circ(0, -5.6, 2.6); fs(WHITE, 2);
    circ(4.4, -4, 2.6); fs(WHITE, 2);
    ctx.restore();
  }
  function starfish(x, y, s, rot) {
    starPath(x, y, 26 * s, 12 * s, rot || 0); fs(ORANGE, 3);
    circ(x - 6 * s, y - 3 * s, 1.8 * s); fs(INK, 0);
    circ(x + 6 * s, y + 2 * s, 1.8 * s); fs(INK, 0);
    circ(x, y + 7 * s, 1.8 * s); fs(INK, 0);
  }
  function lizard(x, y, s, wag, wave) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    // tail
    ctx.beginPath();
    ctx.moveTo(-14, 4);
    ctx.quadraticCurveTo(-30, 8 + wag * 4, -34, -4 + wag * 6);
    ctx.strokeStyle = GREEN; ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-14, 4);
    ctx.quadraticCurveTo(-30, 8 + wag * 4, -34, -4 + wag * 6);
    ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.stroke();
    // legs
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-8, 8); ctx.lineTo(-13, 15);
    ctx.moveTo(10, 8); ctx.lineTo(16, 15);
    ctx.stroke();
    // body
    ell(0, 0, 17, 10); fs(GREEN, 3);
    // head
    circ(16, -6, 9); fs(GREEN, 3);
    circ(19, -8, 2); fs(INK, 0);
    ctx.beginPath(); ctx.arc(18, -3, 4.5, Math.PI * 0.1, Math.PI * 0.75); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    // waving arm
    ctx.beginPath();
    ctx.moveTo(8, -4);
    ctx.quadraticCurveTo(14, -14, 20 + (wave || 0) * 3, -18 - (wave || 0) * 2);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }
  function smallCase(x, y, w, h, open) {
    // little suitcase prop; open: lid tipped back, tan interior showing
    if (open) {
      ctx.save(); ctx.translate(x - w / 2, y - h * 0.32); ctx.rotate(-0.42);
      wobRectPath(0, -h * 0.52, w, h * 0.52, 8, 777, 1.6); fs(BROWN, 3.4);
      ctx.restore();
    }
    wobRectPath(x - w / 2, y - h * 0.32, w, h * 0.68, 8, 778, 1.6); fs(BROWN, 3.4);
    if (open) {
      wobRectPath(x - w / 2 + 7, y - h * 0.32 + 6, w - 14, 17, 5, 779, 1.2); fs(TAN, 2);
    }
    if (!open) {
      ctx.fillStyle = TAN; ctx.fillRect(x - w * 0.3, y - h * 0.35, 9, h * 0.72); ctx.fillRect(x + w * 0.3 - 9, y - h * 0.35, 9, h * 0.72);
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(x - w * 0.3, y - h * 0.35, 9, h * 0.72); ctx.strokeRect(x + w * 0.3 - 9, y - h * 0.35, 9, h * 0.72);
      ctx.beginPath(); ctx.arc(x, y - h * 0.35 - 6, 13, Math.PI, 0); ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.stroke();
    }
  }
  function bubble(x, y, w, h, tailX, tailY, seed) {
    wobRectPath(x - w / 2, y - h / 2, w, h, 12, seed, 2);
    fs(WHITE, 3.4);
    ctx.beginPath();
    ctx.moveTo(x + w * 0.18, y + h / 2 - 4); ctx.lineTo(tailX, tailY); ctx.lineTo(x + w * 0.42, y + h / 2 - 6);
    ctx.closePath(); fs(WHITE, 0);
    ctx.beginPath();
    ctx.moveTo(x + w * 0.18, y + h / 2 - 4); ctx.lineTo(tailX, tailY); ctx.lineTo(x + w * 0.42, y + h / 2 - 6);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
  }

  // ---------------- panels ----------------
  var LABELS = ['souvenir artesanal', 'souvenir textil', 'souvenir prohibido',
                'souvenir permanente', 'souvenir imán', 'souvenir nostálgico',
                'souvenir gastronómico', 'souvenir involuntario', 'souvenir total'];
  var COLW = 328, PANH = 236, LABH = 40, GAP = 18, MARG = 30;
  var ROWP = PANH + LABH + GAP;
  function panelRect(i) {
    var c = i % 3, r = Math.floor(i / 3);
    return { x: MARG + c * (COLW + GAP), y: MARG + r * ROWP, w: COLW, h: PANH };
  }

  function drawPanel(i, t, gagU, gagEnv) {
    var R = panelRect(i);
    var cx = R.x + R.w / 2, cy = R.y + R.h / 2;
    var fl = R.y + R.h - 32; // floor line (abs)
    // background + clip
    ctx.save();
    wobRectPath(R.x, R.y, R.w, R.h, 12, 9000 + i * 131, 2.2);
    ctx.fillStyle = WHITE; ctx.fill();
    ctx.clip();
    ctx.translate(cx, cy);
    // local coords: x -164..164, y -118..118, floor at +86
    var shX = 0, shY = 0;
    if (gagEnv > 0 && (i === 2 || i === 3)) shX = Math.sin(t * 34) * 3.4 * gagEnv;
    if (gagEnv > 0 && i === 6) shX = Math.sin(t * 30) * 2.4 * gagEnv;
    ctx.translate(shX, shY);

    if (i === 0) {
      // collar of tiny white hands, worn proudly + one on display
      var tr = traveler({ x: -52, y: 86, s: 1.18, eye: 'open', mouth: 'smile', armR: 'down', armL: 'up' });
      var wob = gagEnv > 0 ? Math.sin(t * 26) * 0.25 * gagEnv : 0;
      for (var k = 0; k < 9; k++) {
        var a = (k / 9) * Math.PI * 2;
        tinyHand(tr.neckX - cx + Math.cos(a) * 27 * 1.18, tr.neckY - cy + Math.sin(a) * 14 * 1.18, 1.55, a + Math.PI / 2 + wob);
      }
      // display stand with one grand hand
      ctx.beginPath(); ctx.moveTo(52, 86); ctx.lineTo(52, 6); ctx.moveTo(24, 86); ctx.lineTo(80, 86); ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.stroke();
      tinyHand(52, -10, 3.1, wob * 0.6);
      textWob('¡hecho a mano!', 58, -62, 17, INK, 41);
    }
    if (i === 1) {
      // pink message tee
      var bnc = gagEnv > 0 ? -Math.abs(Math.sin(gagU * Math.PI * 3)) * 7 * gagEnv : 0;
      ctx.save(); ctx.translate(0, bnc);
      traveler({ x: -46, y: 86, s: 1.35, shirt: PINK, eye: 'open', mouth: 'smile', armR: 'up', armL: 'down' });
      textWob('PARIS', -46, 42, 13, INK, 42);
      textWob('MON AMOUR', -46, 58, 10.5, INK, 43);
      ctx.restore();
      // rack with a second tee
      ctx.beginPath(); ctx.moveTo(62, -84); ctx.lineTo(62, 86); ctx.moveTo(30, -84); ctx.lineTo(128, -84); ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(78, -82); ctx.lineTo(112, -82); ctx.lineTo(126, -62); ctx.lineTo(112, -56); ctx.lineTo(112, -6); ctx.lineTo(78, -6); ctx.lineTo(78, -56); ctx.lineTo(64, -62);
      ctx.closePath(); fs(PINK, 3);
      textWob('PARIS', 95, -38, 11, INK, 44);
    }
    if (i === 2) {
      // starfish heist, stopped mid-theft
      ctx.fillStyle = TAN; ctx.fillRect(-164, 34, 328, 84);
      ctx.beginPath(); ctx.moveTo(-164, 34); ctx.lineTo(164, 34); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.stroke();
      traveler({ x: -58, y: 86, s: 1.12, eye: 'open', mouth: 'flat', armR: 'hold', armL: 'down' });
      starfish(6, 30, 1.25, 0.4 + (gagEnv > 0 ? Math.sin(t * 22) * 0.14 * gagEnv : 0));
      // prohibition sign: mini starfish under a slash
      ctx.beginPath(); ctx.moveTo(118, 86); ctx.lineTo(118, -18); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
      circ(118, -44, 27); fs(WHITE, 3.6);
      starfish(118, -44, 0.62, 0.3);
      ctx.beginPath(); ctx.moveTo(99, -25); ctx.lineTo(137, -63); ctx.strokeStyle = RED; ctx.lineWidth = 5.4; ctx.stroke();
      bubble(48, -84, 102, 44, 102, -60, 9102);
      textWob('¡alto!', 48, -84, 19, INK, 45);
    }
    if (i === 3) {
      // tattoo applied while he cries
      traveler({ x: -58, y: 86, s: 1.16, eye: 'cry', mouth: 'wavy', armR: 'hold', armL: 'down' });
      // tattoo on the chest: I + heart + BENIDORM (lettered white so it reads on the blue body)
      textWob('I', -88, 38, 12, WHITE, 46);
      heartPath(-58, 36, 10); fs(RED, 2.4);
      textWob('Benidorm', -57, 62, 10.5, WHITE, 47);
      // needle machine at his held hand
      ctx.save();
      ctx.translate(-2, 20);
      ctx.rotate(-0.5 + (gagEnv > 0 ? Math.sin(t * 60) * 0.06 * gagEnv : 0));
      wobRectPath(-12, -28, 26, 38, 4, 9103, 1); fs(INK, 0);
      ctx.fillStyle = GREY; ctx.fillRect(-3, 10, 6, 24);
      ctx.beginPath(); ctx.moveTo(0, 34); ctx.lineTo(-3, 46); ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.stroke();
      ctx.restore();
      // ink bottle on the floor
      wobRectPath(46, 52, 32, 34, 4, 9104, 1); fs(INK, 0);
      ctx.fillStyle = WHITE; ctx.fillRect(52, 62, 20, 14);
      textWob('tinta', 62, 102, 12.5, INK, 48);
    }
    if (i === 4) {
      // fridge magnets
      textWob('arte con mayúsculas', 0, -102, 16.5, INK, 49);
      // fridge
      wobRectPath(-158, -84, 150, 170, 8, 9105, 1.6); fs(WHITE, 3.6);
      ctx.beginPath(); ctx.moveTo(-158, -28); ctx.lineTo(-8, -28); ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.stroke();
      ctx.fillStyle = GREY; ctx.fillRect(-24, -70, 7, 30); ctx.fillRect(-24, -12, 7, 40);
      var hop = gagEnv > 0 ? -Math.abs(Math.sin(gagU * Math.PI * 4)) * 6 * gagEnv : 0;
      // bikini magnet
      ctx.save(); ctx.translate(-102, -50 + hop); ctx.scale(1.3, 1.3);
      ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(0, 13); ctx.lineTo(-1, -9); ctx.closePath(); fs(YELLOW, 2.4);
      ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(0, 13); ctx.lineTo(1, -9); ctx.closePath(); fs(YELLOW, 2.4);
      ctx.beginPath(); ctx.moveTo(-22, 26); ctx.quadraticCurveTo(0, 18, 22, 26); ctx.lineTo(18, 34); ctx.quadraticCurveTo(0, 27, -18, 34); ctx.closePath(); fs(YELLOW, 2.4);
      ctx.restore();
      starfish(-46, 26 + hop * 0.7, 0.82, 0.2);
      heartPath(-122, 54 + hop * 0.5, 11); fs(RED, 2.4);
      // letter magnets
      var letters = [['S', TAN], ['O', WHITE], ['L', CHIP]];
      for (var li = 0; li < 3; li++) {
        ctx.save(); ctx.translate(-134 + li * 36, -4 + (li % 2) * 4 + hop * (0.4 + li * 0.2)); ctx.rotate((li - 1) * 0.14);
        wobRectPath(-13, -13, 26, 26, 4, 9200 + li, 1); fs(letters[li][1], 2.4);
        ctx.restore();
        textWob(letters[li][0], -134 + li * 36, -4 + (li % 2) * 4 + hop * (0.4 + li * 0.2), 15, INK, 50 + li);
      }
      traveler({ x: 96, y: 86, s: 1.04, eye: 'happy', mouth: 'smile', armR: 'point', armL: 'down', flip: true });
    }
    if (i === 5) {
      // nostalgic trash
      traveler({ x: -66, y: 86, s: 1.1, eye: 'open', mouth: 'flat', armR: 'hold', armL: 'down' });
      // napkin held up
      ctx.save();
      ctx.translate(-25, 27); ctx.rotate(-0.16 + (gagEnv > 0 ? Math.sin(t * 16) * 0.2 * gagEnv : 0));
      wobRectPath(-23, -18, 46, 36, 6, 9106, 2.6); fs(GREY, 2.6);
      ctx.beginPath(); ctx.arc(-5, 0, 7, 0.4, 2.4); ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.stroke();
      ctx.restore();
      textWob('Nápoles…', -66, -96, 16, INK, 51);
      // tissue box on the floor
      wobRectPath(92, 56, 58, 30, 4, 9107, 1.4); fs(WHITE, 3);
      ctx.beginPath();
      ctx.moveTo(106, 56); ctx.quadraticCurveTo(112, 38, 121, 42); ctx.quadraticCurveTo(128, 46, 134, 56);
      ctx.closePath(); fs(GREY, 2.2);
      // crumpled pile
      var pile = [[26, 76], [54, 82], [82, 74], [44, 58], [104, 82]];
      for (var pi = 0; pi < pile.length; pi++) {
        circ(pile[pi][0], pile[pi][1], 15); fs(GREY, 2.6);
        ctx.beginPath(); ctx.arc(pile[pi][0] - 3, pile[pi][1] - 2, 6, 0.5, 2.6); ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.stroke();
      }
    }
    if (i === 6) {
      // chipotle: it burns him
      traveler({ x: -34, y: 86, s: 1.18, eye: 'open', mouth: 'open', armR: 'hold', armL: 'down' });
      // bottle in held hand
      ctx.save(); ctx.translate(18, 30); ctx.rotate(0.16); ctx.scale(1.3, 1.3);
      wobRectPath(-11, -34, 24, 44, 6, 9108, 1.2); fs(CHIP, 3);
      ctx.fillStyle = INK; ctx.fillRect(-6, -44, 14, 11);
      ctx.fillStyle = WHITE; ctx.fillRect(-7, -18, 16, 18);
      heartPath(1, -10, 5); fs(CHIP, 0);
      ctx.restore();
      // steam from bottle + above head (ambient, deterministic phase)
      var puffs = 3 + (gagEnv > 0 ? 2 : 0);
      for (var si = 0; si < puffs; si++) {
        var ph = ((t * 0.5 + si / puffs) % 1);
        var sx = (si % 2 === 0 ? 18 : -36) + Math.sin(ph * 5 + si) * 4;
        var sy = -28 - ph * 54;
        ctx.globalAlpha = 0.45 * (1 - ph);
        ell(sx, sy, 5 + ph * 6, 4 + ph * 5); fs(GREY, 0);
        ctx.globalAlpha = 1;
      }
      // sweat drops
      ell(-61, -38, 4, 6); fs(WHITE, 2);
      ell(-9, -50, 4, 6); fs(WHITE, 2);
      textWob('Acapulco…', 66, -88, 16, INK, 52);
      textWob('¡pica!', 78, -58, 19, CHIP, 53);
    }
    if (i === 7) {
      // the involuntary souvenir: lizard in the open suitcase
      textWob('el comienzo', -152, -100, 15.5, INK, 54, 'left');
      textWob('de una amistad', -152, -79, 15.5, INK, 55, 'left');
      traveler({ x: -126, y: 86, s: 0.82, eye: 'happy', mouth: 'smile', armR: 'point', armL: 'down' });
      // open suitcase
      ctx.save(); ctx.translate(14, 24); ctx.rotate(-0.34);
      wobRectPath(-98, -84, 196, 50, 8, 9109, 1.6); fs(BROWN, 3.4);
      ctx.restore();
      wobRectPath(-82, 22, 192, 62, 8, 9110, 1.6); fs(TAN, 3.4);
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-82, 40); ctx.lineTo(110, 40); ctx.stroke();
      var jump = gagEnv > 0 ? -Math.abs(Math.sin(gagU * Math.PI * 2)) * 16 * gagEnv : 0;
      lizard(14, 12 + jump, 1.2, Math.sin(t * 3) * 0.5, gagEnv);
    }
    if (i === 8) {
      // home at last, surrounded by all of it, content
      var bb = gagEnv > 0 ? -Math.abs(Math.sin(gagU * Math.PI * 3)) * 5 * gagEnv : 0;
      ctx.save(); ctx.translate(0, bb);
      var tr9 = traveler({ x: -34, y: 86, s: 1.14, eye: 'happy', mouth: 'smile', armR: 'down', armL: 'up' });
      for (var k2 = 0; k2 < 9; k2++) {
        var a2 = (k2 / 9) * Math.PI * 2;
        tinyHand(tr9.neckX - cx + Math.cos(a2) * 26 * 1.14, tr9.neckY - cy + Math.sin(a2) * 14 * 1.14, 1.45, a2 + Math.PI / 2);
      }
      ctx.restore();
      smallCase(102, 62, 96, 62, true);
      starfish(66, 78, 0.8, 0.3);
      // bottle on a little stool
      ctx.beginPath(); ctx.moveTo(120, 30); ctx.lineTo(152, 30); ctx.moveTo(126, 30); ctx.lineTo(126, 52); ctx.moveTo(146, 30); ctx.lineTo(146, 52); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
      ctx.save(); ctx.translate(136, 30); ctx.rotate(0.1); ctx.scale(1.3, 1.3);
      wobRectPath(-8, -26, 18, 34, 5, 9111, 1); fs(CHIP, 2.6);
      ctx.fillStyle = INK; ctx.fillRect(-4, -34, 10, 9);
      ctx.restore();
      textWob('en casa', -96, -94, 16, INK, 56);
    }

    ctx.restore();
    // frame
    wobRectPath(R.x, R.y, R.w, R.h, 12, 9000 + i * 131, 2.2);
    ctx.strokeStyle = INK; ctx.lineWidth = 4.2; ctx.stroke();
    // specimen label banner
    var ly = R.y + R.h + 6;
    wobRectPath(R.x + 14, ly, R.w - 28, LABH - 8, 8, 9500 + i * 71, 1.8);
    ctx.fillStyle = TAN; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3.2; ctx.stroke();
    var ls = fitSize(LABELS[i], 24, R.w - 56);
    textWob(LABELS[i], cx, ly + (LABH - 8) / 2, ls, INK, 9700 + i);
  }

  // ---------------- hero zone ----------------
  var CASE = { x: 480, y: 1022, w: 425, h: 158 };   // hero suitcase body
  var HERO = { x: 258, feet: 1188, s: 2.4 };
  var openAmt = 0, openTarget = 0, dragging = false, dragStartX = 0, caseOff = 0;
  var downX = 0, downY = 0, downT = 0, downOnCase = false;
  var gagPanel = -1, gagStart = -10;
  var lastT = PHASE0;

  function drawHero(t) {
    // divider
    ctx.beginPath();
    var rng = mulberry32(4242);
    ctx.moveTo(30, 912);
    for (var x = 30; x <= 1050; x += 60) ctx.lineTo(x + 30, 912 + (rng() - 0.5) * 5);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();

    var bob = Math.sin(t * 2) * 1.6;
    var tr = { headX: HERO.x, headTop: HERO.feet + bob - 100 * HERO.s };

    // lizard path: suitcase mouth -> arc -> traveler's head
    var perch = smooth((openAmt - 0.45) / 0.55);
    var mx = CASE.x + CASE.w * 0.52 + caseOff, my = CASE.y + 6;
    var hx = tr.headX, hy = tr.headTop + bob - 4;
    var cxp = (mx + hx) / 2 - 40, cyp = Math.min(my, hy) - 190;
    var q = easeOut(perch);
    var lx = (1 - q) * (1 - q) * mx + 2 * (1 - q) * q * cxp + q * q * hx;
    var ly = (1 - q) * (1 - q) * my + 2 * (1 - q) * q * cyp + q * q * hy;

    // lid (behind body, rotates about the hinge at the body's top-left)
    ctx.save();
    ctx.translate(CASE.x + caseOff, CASE.y);
    ctx.rotate(-openAmt * 1.82);
    wobRectPath(0, -104, CASE.w, 104, 10, 31337, 2);
    fs(BROWN, 4.2);
    ctx.fillStyle = TAN;
    ctx.fillRect(52, -104, 26, 104); ctx.fillRect(CASE.w - 78, -104, 26, 104);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.strokeRect(52, -104, 26, 104); ctx.strokeRect(CASE.w - 78, -104, 26, 104);
    ctx.restore();
    // interior (visible as it opens)
    if (openAmt > 0.02) {
      wobRectPath(CASE.x + 10 + caseOff, CASE.y + 8, CASE.w - 20, 46, 8, 31338, 1.6);
      fs(TAN, 3);
      // folded pink tee peeking out
      ctx.fillStyle = PINK; ctx.fillRect(CASE.x + 120 + caseOff, CASE.y + 16, 92, 30);
      ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.strokeRect(CASE.x + 120 + caseOff, CASE.y + 16, 92, 30);
    }
    // lizard (springs out as the case opens)
    if (openAmt > 0.04) lizard(lx, ly, 1.7, Math.sin(t * 3.2) * 0.5, perch >= 1 ? Math.sin(t * 4) * 0.5 : 0);
    // body
    wobRectPath(CASE.x + caseOff, CASE.y, CASE.w, CASE.h, 10, 31339, 2);
    fs(BROWN, 4.2);
    ctx.fillStyle = TAN;
    ctx.fillRect(CASE.x + 62 + caseOff, CASE.y, 26, CASE.h);
    ctx.fillRect(CASE.x + CASE.w - 88 + caseOff, CASE.y, 26, CASE.h);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
    ctx.strokeRect(CASE.x + 62 + caseOff, CASE.y, 26, CASE.h);
    ctx.strokeRect(CASE.x + CASE.w - 88 + caseOff, CASE.y, 26, CASE.h);
    // handle
    ctx.beginPath(); ctx.arc(CASE.x + CASE.w / 2 + caseOff, CASE.y - 2, 30, Math.PI, 0);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    // re-draw traveler in front of the case edge if overlapping
    traveler({ x: HERO.x, y: HERO.feet + bob, s: HERO.s, eye: 'open', mouth: 'smile', armR: 'down', armL: 'down' });
    if (perch >= 1) lizard(lx, ly, 1.7, Math.sin(t * 3.2) * 0.5, Math.sin(t * 4) * 0.5);
  }

  // ---------------- main draw ----------------
  var W = 0, H = 0, S = 1, OX = 0, OY = 0;
  var simT = PHASE0;

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = TAN;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S, S);
    ctx.lineJoin = 'round';

    var dt = Math.max(0, Math.min(0.05, t - lastT)); lastT = t;
    var tgt = dragging ? openTarget : 0;
    var d = tgt - openAmt;
    var step = dt * 2.4;
    openAmt += d > step ? step : (d < -step ? -step : d);
    if (!dragging) caseOff += (0 - caseOff) * Math.min(1, dt * 5);

    var gagU = (t - gagStart) / 1.4;
    var gagEnv = (gagPanel >= 0 && gagU >= 0 && gagU < 1) ? Math.sin(Math.PI * gagU) : 0;
    for (var i = 0; i < 9; i++) {
      drawPanel(i, t, i === gagPanel ? gagU : 0, i === gagPanel ? gagEnv : 0);
    }
    drawHero(t);

    // hint
    ctx.save();
    ctx.globalAlpha = 0.55;
    textWob('drag · tap', 972, 1218, 21, INK, 777);
    ctx.restore();
    ctx.restore();
  }

  // ---------------- sizing ----------------
  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15;
  }
  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) { S = W / DW; OX = 0; OY = (H - DH * S) / 2; }
    else { S = Math.min(W / DW, H / DH); OX = (W - DW * S) / 2; OY = (H - DH * S) / 2; }
    draw(simT);
  }

  // ---------------- interaction ----------------
  function toDesign(e) {
    var rect = (typeof canvas.getBoundingClientRect === 'function') ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: ((e.clientX - rect.left) - OX) / S, y: ((e.clientY - rect.top) - OY) / S };
  }
  function onCase(p) {
    return p.x > CASE.x - 16 && p.x < CASE.x + CASE.w + 16 && p.y > CASE.y - 170 && p.y < CASE.y + CASE.h + 16;
  }
  function onDown(e) {
    var p = toDesign(e);
    downX = p.x; downY = p.y; downT = simT; downOnCase = onCase(p);
    if (downOnCase) { dragging = true; dragStartX = p.x; openTarget = 0; }
  }
  function onMove(e) {
    if (!dragging) return;
    var p = toDesign(e);
    openTarget = clamp01(Math.abs(p.x - dragStartX) / 150);
    var off = (p.x - dragStartX) * 0.16;
    caseOff = off > 20 ? 20 : (off < -20 ? -20 : off);
    draw(simT);
  }
  function onUp(e) {
    if (dragging) { dragging = false; draw(simT); return; }
    var p = toDesign(e);
    var moved = Math.sqrt((p.x - downX) * (p.x - downX) + (p.y - downY) * (p.y - downY));
    if (moved < 14 && simT - downT < 0.6) {
      for (var i = 0; i < 9; i++) {
        var R = panelRect(i);
        if (p.x >= R.x && p.x <= R.x + R.w && p.y >= R.y && p.y <= R.y + R.h + LABH) {
          gagPanel = i; gagStart = simT; break;
        }
      }
      draw(simT);
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { dragging = false; });
  }

  // ---------------- animation ----------------
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }
  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
