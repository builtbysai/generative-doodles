<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Day All Night</title>
<style>
html, body { margin: 0; padding: 0; background: #e8e2d4; overflow: hidden; height: 100%; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Round every fading alpha to 4 decimals before stringifying: node-canvas
  // misparses scientific-notation alphas (e.g. 2.5e-15) as fully opaque.
  function a4(x) {
    var v = Math.round(x * 10000) / 10000;
    if (v < 0) v = 0;
    if (v > 1) v = 1;
    return v;
  }
  function rgba(r, g, b, a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')'; }

  var PAPER = [232, 226, 212], BLACK = [26, 26, 24], RED = [176, 30, 36],
      HORIZ = [138, 143, 148], GOLD = [245, 197, 66], SMUDGE = [74, 74, 68];

  // Seeded constants: one full day-night cycle per ~40 s, speed varied by seed
  // (a fast cycle reads as a short day, a slow one as a long day).
  var rand = mulberry32(1409000);
  var CYCLE = 40 * (0.8 + 0.45 * rand()); // 32-50 s
  var OFFSET = 0.3; // constant frame-one phase: both arcs 30% drawn at t = 0
  // Seeded charcoal smudges: fixed offsets around the circle, flat alpha only.
  var smudges = [];
  for (var i = 0; i < 9; i++) {
    smudges.push({
      a: rand() * Math.PI * 2,
      d: 0.86 + rand() * 0.34,
      rx: 14 + rand() * 34,
      ry: 5 + rand() * 9,
      al: 0.05 + rand() * 0.09
    });
  }

  var W = 0, H = 0, cx = 0, hy = 0, R = 0;
  function isPhone() {
    var mw = 1e9;
    if (typeof window !== 'undefined' && window.screen) {
      mw = Math.min(window.screen.width || 1e9, window.screen.height || 1e9);
    }
    if (mw < 700) return true;
    return H > W * 1.15;
  }
  function resize() {
    var vw = 0, vh = 0;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && typeof window.innerWidth === 'number') {
      vw = window.innerWidth;
      vh = window.innerHeight;
    }
    if (!vw || !vh) return;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    cx = W / 2; hy = H * 0.5; R = Math.min(W, H) * 0.42;
    if (typeof document !== 'undefined' && document.body && document.body.style) {
      // Centered composition keeps its shape; page ground takes the piece's
      // own background color (field paper) on every device.
      document.body.style.background = '#e8e2d4';
    }
  }
  resize();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) {
      window.addEventListener('resize', resize);
    }
  }

  // ---- Interaction state (closed-form functions of recorded events + t) ----
  // Each arc has its own speed multiplier; drag along an arc re-times that
  // half of the cycle. Multipliers decay back to 1 (tau 6 s) after release.
  var speedBlack = 1, speedRed = 1, lastDragT = -1e9;
  var dragArc = null, dragX = 0, dragY = 0;

  function arcPoint(arc, p) {
    // Black: upper semicircle, left -> right over the top (angle PI -> 2PI).
    // Red: lower semicircle, right -> left under the bottom (angle 0 -> PI).
    var th = arc === 'black' ? Math.PI + p * Math.PI : p * Math.PI;
    return { x: cx + R * Math.cos(th), y: hy + R * Math.sin(th), th: th };
  }
  function tangent(th) {
    // Travel direction for both arcs is increasing angle.
    return { x: -Math.sin(th), y: Math.cos(th) };
  }
  function nearestArc(x, y) {
    var dx = x - cx, dy = y - hy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (Math.abs(dist - R) > 44) return null;
    var th = Math.atan2(dy, dx);
    if (th < 0) th += Math.PI * 2;
    // Upper half (angles PI..2PI) -> black arc; lower half (0..PI) -> red.
    return th >= Math.PI ? 'black' : 'red';
  }

  function onDown(e) {
    var p = pointerPos(e);
    var arc = nearestArc(p.x, p.y);
    if (!arc) { dragArc = null; return; }
    dragArc = arc; dragX = p.x; dragY = p.y;
  }
  function onMove(e) {
    if (!dragArc) return;
    var p = pointerPos(e);
    var dx = p.x - dragX, dy = p.y - dragY;
    dragX = p.x; dragY = p.y;
    // Project the drag delta onto the travel tangent at the pointer's angle.
    var th = Math.atan2(p.y - hy, p.x - cx);
    if (th < 0) th += Math.PI * 2;
    var tg = tangent(th);
    var along = dx * tg.x + dy * tg.y;
    var cur = dragArc === 'black' ? speedBlack : speedRed;
    cur = cur * (1 + along * 0.004);
    if (cur < 0.35) cur = 0.35;
    if (cur > 2.5) cur = 2.5;
    if (dragArc === 'black') speedBlack = cur; else speedRed = cur;
    lastDragT = nowT;
  }
  function onUp() { dragArc = null; }
  function pointerPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    return { x: 0, y: 0 };
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  function drawArc(arc, p, ghost) {
    var th0 = arc === 'black' ? Math.PI : 0;
    var th1 = th0 + p * Math.PI;
    ctx.beginPath();
    ctx.arc(cx, hy, R, th0, th1, false);
    if (arc === 'black') ctx.strokeStyle = rgba(BLACK[0], BLACK[1], BLACK[2], ghost ? 0.12 : 0.95);
    else ctx.strokeStyle = rgba(RED[0], RED[1], RED[2], ghost ? 0.12 : 0.95);
    ctx.lineWidth = ghost ? 3 : 5;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  function dot(x, y, r, col) {
    // Dots as filled rects (node-canvas quirk: batched arcs connect).
    ctx.fillStyle = col;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  var nowT = 0;
  function draw(t) {
    nowT = t;
    // Decay speed multipliers back to 1 after release (tau 6 s).
    if (t - lastDragT > 0.05 && !dragArc) {
      var dt = Math.min(0.1, t - (draw._pt || 0));
      var f = Math.exp(-dt / 6);
      speedBlack = 1 + (speedBlack - 1) * f;
      speedRed = 1 + (speedRed - 1) * f;
    }
    draw._pt = t;

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = 'rgb(' + PAPER[0] + ',' + PAPER[1] + ',' + PAPER[2] + ')';
    ctx.fillRect(0, 0, W, H);

    // Horizon line across the middle third.
    ctx.fillStyle = 'rgb(' + HORIZ[0] + ',' + HORIZ[1] + ',' + HORIZ[2] + ')';
    ctx.fillRect(0, hy - 1, W, 2);

    // Charcoal smudges (seeded, static, flat alpha).
    for (var i = 0; i < smudges.length; i++) {
      var s = smudges[i];
      var sx = cx + Math.cos(s.a) * R * s.d;
      var sy = hy + Math.sin(s.a) * R * s.d;
      ctx.fillStyle = rgba(SMUDGE[0], SMUDGE[1], SMUDGE[2], s.al);
      ctx.beginPath();
      ctx.ellipse(sx, sy, s.rx, s.ry, s.a, 0, Math.PI * 2);
      ctx.fill();
    }

    // Ghost full circle first, so the circle never breaks at a wrap.
    drawArc('black', 1, true);
    drawArc('red', 1, true);

    // Live arcs: progress advances with each arc's own speed multiplier.
    var pB = (OFFSET + (t * speedBlack) / CYCLE) % 1;
    var pR = (OFFSET + (t * speedRed) / CYCLE) % 1;
    drawArc('black', pB, false);
    drawArc('red', pR, false);

    // Gold draw-heads: halo (flat alpha circle) + core dot.
    var hB = arcPoint('black', pB), hR = arcPoint('red', pR);
    var rB = 6 + speedBlack * 2, rR = 6 + speedRed * 2;
    ctx.fillStyle = rgba(GOLD[0], GOLD[1], GOLD[2], 0.25);
    ctx.beginPath(); ctx.arc(hB.x, hB.y, rB + 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(GOLD[0], GOLD[1], GOLD[2], 0.25);
    ctx.beginPath(); ctx.arc(hR.x, hR.y, rR + 8, 0, Math.PI * 2); ctx.fill();
    dot(hB.x, hB.y, rB, 'rgb(' + GOLD[0] + ',' + GOLD[1] + ',' + GOLD[2] + ')');
    dot(hR.x, hR.y, rR, 'rgb(' + GOLD[0] + ',' + GOLD[1] + ',' + GOLD[2] + ')');
  }

  // Synchronous first frame at a constant phase; the rAF clock starts only
  // with the loop, so frame one is reproducible.
  draw(0);

  var t0 = -1;
  function loop(ts) {
    if (t0 < 0) t0 = ts;
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
