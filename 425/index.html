<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.425 Long Lunch</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#4E7A3A; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.425 Long Lunch (yaelhofri, EXPANSION #46).
// After Yael Hofri's definitive mechanism: an outdoor
// table still life on a red-and-pink checkered cloth -
// a bottle labeled VINO, two glasses of red wine, a
// bowl of green salad with tomatoes, lemon halves,
// papaya halves, a vase of pink, orange and yellow
// flowers, one lit candle, a wooden chair edge at the
// left, and a leafy-green backdrop across the top
// third. Flat fills, warm and saturated throughout.
// The only text is the VINO label, drawn as
// hand-lettered stroke paths, plus her signed corner
// mark at bottom right, shipped as a small hand-drawn
// flower glyph in ink path data (the prompt names the
// mark but not its form; replaceable).
//
// The ambient loop is 20s, seamless, and the piece is
// watch-only apart from one gesture: the candle flame
// flickers on a 2-phase sine dividing the loop, the
// flower heads sway plus or minus 2 degrees on whole
// cycles, and exactly one leaf drifts across the
// backdrop per loop. DOUBLE-TAP advances a table of
// exactly 3 AUTHORED table arrangements (bottle,
// glasses, vase, lemons and papaya re-laid on the
// anchor grid; cloth, backdrop, chair, salad bowl and
// candle stay put) - never a runtime reseed. Moved
// items lift and settle over 0.55s on fixed ticks.
// The flame glow is stepped flat-alpha discs, no
// gradients anywhere. Frame one is drawn at the
// constant phase T = 6.35s with arrangement 1 complete
// and the flame mid-flicker; the clock is anchored
// there and advances in fixed 1/60 ticks, never from a
// wall clock. Flat colour only, one canvas, no
// offscreen canvas, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Cloth checks and base, wine, bottle green, the three
// flower colours, lemon, papaya, salad green, candle
// flame, leafy backdrop, dusk edge. Nothing else.
var CLOTH_A = '#D94F6B', CLOTH_B = '#F6D7DE';
var WINE = '#7A1E2B', BOTTLE = '#2E5339';
var FL_PINK = '#F06A8A', FL_ORANGE = '#F5A623', FL_YELLOW = '#F7D354';
var LEMON = '#F2D024', PAPAYA = '#F08C3C', SALAD = '#5C9E46';
var FLAME = '#FFC83D', LEAF = '#4E7A3A', DUSK = '#3E2A4F';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 20;
if (LOOP !== 20) throw new Error('Long Lunch loop must be 20s');
var TICK = 1 / 60;
var CLOTH_Y = 300;

// QA probes via the house seed pattern: ?seed=arr2 and
// ?seed=arr3 start on those authored arrangements so
// each table can be render-checked. The shipped
// default starts on arrangement 1 at T_OFF = 6.35s.
var seedStr = (typeof location !== 'undefined' && location.search) ? location.search : '';
var startIdx = 0;
if (seedStr.indexOf('arr2') >= 0) startIdx = 1;
if (seedStr.indexOf('arr3') >= 0) startIdx = 2;
var T_OFF = 6.35;

// ---- small draw helpers ---------------------------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function circ(x, y, r, fill, alpha) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) {
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.fillStyle = fill; ctx.fill();
    ctx.restore();
  }
}
function ell(x, y, rx, ry, rot, fill, alpha) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  if (fill) {
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.fillStyle = fill; ctx.fill();
    ctx.restore();
  }
}
function line(x0, y0, x1, y1, col, lw) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function shadow(x, baseY, rx) {
  ell(x, baseY + 6, rx, 10, 0, DUSK, 0.16);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---- hand-lettered strokes for VINO ----------------------
// Tiny stroke glyph table in a unit box (x 0..0.72,
// y 0..1, y down). The label is the piece's only text
// and is drawn as path data only, never font text.
function arcPts(cx, cy, rx, ry, a0, a1, n) {
  var pts = [];
  for (var i = 0; i <= n; i++) {
    var a = (a0 + (a1 - a0) * (i / n)) * Math.PI / 180;
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return pts;
}
var GLYPHS = {
  V: [ [[0.03, 0], [0.36, 1], [0.69, 0]] ],
  I: [ [[0.36, 0], [0.36, 1]], [[0.15, 0], [0.57, 0]], [[0.15, 1], [0.57, 1]] ],
  N: [ [[0.06, 1], [0.06, 0], [0.66, 1], [0.66, 0]] ],
  O: [ arcPts(0.36, 0.5, 0.33, 0.49, 0, 360, 20) ]
};
function drawWord(word, cx, topY, h, col, lw) {
  var adv = 0.86 * h;
  var total = adv * (word.length - 1) + 0.72 * h;
  var x = cx - total / 2;
  ctx.strokeStyle = col; ctx.lineWidth = lw;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (var li = 0; li < word.length; li++) {
    var strokes = GLYPHS[word.charAt(li)];
    if (strokes) {
      for (var si = 0; si < strokes.length; si++) {
        var pts = strokes[si];
        ctx.beginPath();
        for (var pi = 0; pi < pts.length; pi++) {
          var px = x + pts[pi][0] * h, py = topY + pts[pi][1] * h;
          if (pi === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }
    x += adv;
  }
}

// ---- fixed scatter tables ---------------------------------
// Backdrop leaf clusters and fallen cloth petals are
// fixed-seed data, generated once, drawn directly.
var CLUSTERS = [];
var PETALS = [];
(function () {
  var rng = mulberry32(425);
  for (var i = 0; i < 15; i++) {
    CLUSTERS.push({
      x: 30 + rng() * 1220, y: 26 + rng() * 238,
      a: rng() * Math.PI * 2, s: 0.7 + rng() * 0.6,
      dark: rng() < 0.45
    });
  }
  var cols = [FL_PINK, FL_ORANGE, FL_YELLOW];
  for (var j = 0; j < 11; j++) {
    PETALS.push({
      x: 40 + rng() * 1200, y: 348 + rng() * 512,
      a: rng() * Math.PI, s: 0.7 + rng() * 0.5,
      col: cols[j % 3]
    });
  }
})();
function leafCluster(c) {
  var col = c.dark ? BOTTLE : SALAD;
  for (var i = 0; i < 3; i++) {
    var a = c.a + i * 0.9;
    ell(c.x + 16 * c.s * Math.cos(a), c.y + 12 * c.s * Math.sin(a),
        17 * c.s, 8 * c.s, a, col);
  }
}

// ---- the authored arrangements ------------------------------
// Six movable items, three authored tables. Salad bowl,
// candle and chair are furniture of the scene and do
// not move. Positions are base points (x, baseY).
var ITEM_KEYS = ['bottle', 'glassL', 'glassR', 'vase', 'lemons', 'papaya'];
var ARRANGEMENTS = [
  { bottle: [640, 505], glassL: [455, 520], glassR: [825, 520],
    vase: [1060, 575], lemons: [630, 730], papaya: [945, 715] },
  { bottle: [300, 500], glassL: [478, 520], glassR: [615, 514],
    vase: [1015, 580], lemons: [862, 728], papaya: [560, 712] },
  { bottle: [975, 498], glassL: [798, 518], glassR: [1138, 524],
    vase: [335, 585], lemons: [620, 748], papaya: [880, 700] }
];
if (ARRANGEMENTS.length !== 3) throw new Error('Long Lunch needs exactly 3 arrangements');
for (var ai = 0; ai < 3; ai++) {
  for (var ki = 0; ki < ITEM_KEYS.length; ki++) {
    if (!ARRANGEMENTS[ai][ITEM_KEYS[ki]]) throw new Error('arrangement missing item');
  }
}
var SALAD_POS = [320, 705], CANDLE_POS = [195, 565];

// ---- scene furniture ---------------------------------------
function drawBackdrop(t) {
  ctx.fillStyle = LEAF;
  ctx.fillRect(-240, -240, DW + 480, CLOTH_Y + 240);
  for (var i = 0; i < CLUSTERS.length; i++) leafCluster(CLUSTERS[i]);
  // dusk creeping in along the very top edge, stepped bands
  ctx.fillStyle = DUSK;
  ctx.save(); ctx.globalAlpha = 0.35; ctx.fillRect(-240, -240, DW + 480, 252); ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.30; ctx.fillRect(-240, -240, DW + 480, 266); ctx.restore();
  // exactly one leaf drifts across the backdrop per loop
  var p = t / LOOP;
  var lx = -70 + (DW + 140) * p;
  var ly = 128 + 56 * Math.sin(Math.PI * 2 * 2 * p);
  var la = Math.PI * 2 * 2 * p + 0.6;
  ell(lx, ly, 24, 11, la, FL_ORANGE);
  line(lx - 20 * Math.cos(la), ly - 20 * Math.sin(la),
       lx + 20 * Math.cos(la), ly + 20 * Math.sin(la), BOTTLE, 2.5);
}
function drawCloth() {
  ctx.fillStyle = CLOTH_B;
  ctx.fillRect(-240, CLOTH_Y, DW + 480, DH - CLOTH_Y + 240);
  var cell = DW / 12;
  ctx.fillStyle = CLOTH_A;
  for (var r = 0; r * cell < DH - CLOTH_Y + cell; r++) {
    for (var c = -2; c < 14; c++) {
      if ((c + r) % 2 === 0) ctx.fillRect(c * cell, CLOTH_Y + r * cell, cell, cell);
    }
  }
  ctx.fillStyle = CLOTH_A;
  ctx.fillRect(-240, CLOTH_Y - 5, DW + 480, 10);
  for (var i = 0; i < PETALS.length; i++) {
    var p = PETALS[i];
    ell(p.x, p.y, 10 * p.s, 5.5 * p.s, p.a, p.col, 0.85);
  }
}
function drawChair() {
  // the wooden chair edge at the left, deep wine red
  ctx.fillStyle = WINE;
  rr(10, 244, 118, 34, 14); ctx.fill();
  rr(18, 356, 102, 30, 12); ctx.fill();
  rr(18, 462, 102, 28, 12); ctx.fill();
  rr(16, 252, 24, 356, 10); ctx.fill();
  rr(98, 252, 24, 356, 10); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(6, 596); ctx.lineTo(150, 628); ctx.lineTo(150, 656); ctx.lineTo(6, 630);
  ctx.closePath(); ctx.fill();
  rr(128, 640, 20, 158, 8); ctx.fill();
}

// ---- the items ----------------------------------------------
function drawBottle(x, baseY) {
  shadow(x, baseY, 56);
  ctx.fillStyle = BOTTLE;
  rr(x - 17, baseY - 252, 34, 66, 8); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 17, baseY - 190);
  ctx.lineTo(x - 48, baseY - 168);
  ctx.lineTo(x - 48, baseY);
  ctx.lineTo(x + 48, baseY);
  ctx.lineTo(x + 48, baseY - 168);
  ctx.lineTo(x + 17, baseY - 190);
  ctx.closePath(); ctx.fill();
  rr(x - 48, baseY - 196, 96, 196, 16); ctx.fill();
  ell(x, baseY - 190, 30, 12, 0, BOTTLE);
  // cork and a flat highlight stripe
  ctx.fillStyle = PAPAYA;
  rr(x - 10, baseY - 264, 20, 16, 5); ctx.fill();
  ctx.fillStyle = CLOTH_B;
  ctx.save(); ctx.globalAlpha = 0.22;
  rr(x - 36, baseY - 176, 13, 158, 6); ctx.fill();
  ctx.restore();
  // the label: cloth pink, VINO in wine stroke paths
  ctx.fillStyle = CLOTH_B;
  rr(x - 41, baseY - 128, 82, 52, 6); ctx.fill();
  drawWord('VINO', x, baseY - 113, 22, WINE, 3.2);
}
function drawGlass(x, baseY) {
  shadow(x, baseY, 30);
  var topY = baseY - 118;
  // wine first, then the glass over it
  ctx.beginPath();
  ctx.moveTo(x - 27, topY + 16);
  ctx.quadraticCurveTo(x - 24, topY + 52, x, topY + 54);
  ctx.quadraticCurveTo(x + 24, topY + 52, x + 27, topY + 16);
  ctx.closePath();
  ctx.fillStyle = WINE; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 31, topY);
  ctx.quadraticCurveTo(x - 28, topY + 56, x, topY + 60);
  ctx.quadraticCurveTo(x + 28, topY + 56, x + 31, topY);
  ctx.strokeStyle = CLOTH_B; ctx.lineWidth = 3.5; ctx.stroke();
  line(x, topY + 60, x, baseY - 8, CLOTH_B, 3.5);
  ell(x, baseY - 5, 27, 6, 0, CLOTH_B);
}
var FLOWER_HEADS = [
  { dx: -58, dy: -196, r: 30, col: FL_PINK,   cen: FL_YELLOW, ph: 0.0, k: 1 },
  { dx: -18, dy: -224, r: 34, col: FL_ORANGE, cen: CLOTH_A,   ph: 1.7, k: 2 },
  { dx: 26,  dy: -208, r: 29, col: FL_YELLOW, cen: FL_ORANGE, ph: 3.1, k: 1 },
  { dx: 62,  dy: -178, r: 26, col: FL_PINK,   cen: FL_YELLOW, ph: 4.4, k: 2 },
  { dx: 2,   dy: -168, r: 24, col: FL_PINK,   cen: FL_ORANGE, ph: 5.5, k: 1 }
];
function drawFlowerHead(hx, hy, h, t) {
  var sway = (2 * Math.PI / 180) * Math.sin(Math.PI * 2 * h.k * t / LOOP + h.ph);
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(sway);
  for (var i = 0; i < 8; i++) {
    var a = i * Math.PI / 4;
    ell(h.r * 0.58 * Math.cos(a), h.r * 0.58 * Math.sin(a),
        h.r * 0.52, h.r * 0.27, a, h.col);
  }
  circ(0, 0, h.r * 0.30, h.cen);
  ctx.restore();
}
function drawVase(x, baseY, t) {
  shadow(x, baseY, 52);
  var mouthY = baseY - 104;
  // stems rise from the mouth to each head
  ctx.strokeStyle = BOTTLE; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (var i = 0; i < FLOWER_HEADS.length; i++) {
    var h = FLOWER_HEADS[i];
    ctx.beginPath();
    ctx.moveTo(x, mouthY + 4);
    ctx.quadraticCurveTo(x + h.dx * 0.4, mouthY - 50, x + h.dx, baseY + h.dy + h.r * 0.7);
    ctx.stroke();
  }
  ell(x - 30, mouthY - 42, 12, 6, -0.6, SALAD);
  ell(x + 34, mouthY - 66, 12, 6, 0.6, SALAD);
  // vase body
  ctx.fillStyle = BOTTLE;
  ctx.beginPath();
  ctx.moveTo(x - 27, mouthY);
  ctx.quadraticCurveTo(x - 52, baseY - 46, x - 34, baseY);
  ctx.lineTo(x + 34, baseY);
  ctx.quadraticCurveTo(x + 52, baseY - 46, x + 27, mouthY);
  ctx.closePath(); ctx.fill();
  ell(x, mouthY, 29, 9, 0, BOTTLE);
  ctx.fillStyle = CLOTH_B;
  ctx.save(); ctx.globalAlpha = 0.20;
  rr(x - 38, baseY - 84, 11, 66, 5); ctx.fill();
  ctx.restore();
  for (var j = 0; j < FLOWER_HEADS.length; j++) {
    var fh = FLOWER_HEADS[j];
    drawFlowerHead(x + fh.dx, baseY + fh.dy, fh, t);
  }
}
function drawLemons(x, y) {
  shadow(x, y + 16, 62);
  lemonHalf(x - 40, y, -0.10);
  lemonHalf(x + 42, y + 18, 0.12);
}
function lemonHalf(x, y, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI); ctx.closePath();
  ctx.fillStyle = LEMON; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI); ctx.closePath();
  ctx.fillStyle = FL_YELLOW; ctx.fill();
  ctx.strokeStyle = CLOTH_B; ctx.lineWidth = 2.4;
  var angs = [0.35, Math.PI / 2, Math.PI - 0.35];
  for (var i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(24 * Math.cos(angs[i]), 24 * Math.sin(angs[i]));
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI);
  ctx.strokeStyle = FL_ORANGE; ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
}
function drawPapaya(x, y) {
  shadow(x, y + 18, 66);
  papayaHalf(x - 44, y, -0.14);
  papayaHalf(x + 46, y + 16, 0.10);
}
function papayaHalf(x, y, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ell(0, 0, 47, 30, 0, PAPAYA);
  ell(0, 1, 32, 19, 0, FL_YELLOW);
  ctx.fillStyle = DUSK;
  var seeds = [[-12, 0], [0, -5], [12, 0], [-6, 7], [7, 7], [0, 2]];
  for (var i = 0; i < seeds.length; i++) circ(seeds[i][0], seeds[i][1], 3.4, DUSK);
  ctx.restore();
}
function drawSalad(x, y) {
  shadow(x, y + 84, 118);
  // salad mounds over the rim
  var mounds = [[-78, -52, 30], [-40, -64, 34], [0, -68, 36], [42, -62, 33], [80, -50, 29]];
  for (var i = 0; i < mounds.length; i++) {
    circ(x + mounds[i][0], y + mounds[i][1], mounds[i][2], i === 2 ? LEAF : SALAD);
  }
  // bowl
  ctx.beginPath(); ctx.arc(x, y - 44, 122, 0, Math.PI); ctx.closePath();
  ctx.fillStyle = WINE; ctx.fill();
  ell(x, y - 44, 122, 15, 0, WINE);
  ell(x, y + 82, 44, 9, 0, WINE);
  // tomatoes and olives on the salad
  var toms = [[-58, -66], [18, -78], [64, -58], [-16, -52]];
  for (var j = 0; j < toms.length; j++) circ(x + toms[j][0], y + toms[j][1], 8, CLOTH_A);
  var ols = [[-88, -44], [36, -48], [88, -38]];
  for (var k = 0; k < ols.length; k++) circ(x + ols[k][0], y + ols[k][1], 5.5, BOTTLE);
}
function drawCandle(x, baseY, t) {
  shadow(x, baseY, 42);
  // stepped flat glow behind the flame
  var fl = 1 + 0.10 * Math.sin(Math.PI * 2 * 3 * t / LOOP) +
              0.06 * Math.sin(Math.PI * 2 * 7 * t / LOOP + 1.3);
  var gy = baseY - 118;
  circ(x, gy, 76, FLAME, 0.07);
  circ(x, gy, 52, FLAME, 0.12);
  circ(x, gy, 32, FLAME, 0.20);
  // holder and stick
  ctx.fillStyle = DUSK;
  ell(x, baseY - 4, 42, 10, 0, DUSK);
  ctx.beginPath();
  ctx.moveTo(x - 9, baseY - 6); ctx.lineTo(x + 9, baseY - 6);
  ctx.lineTo(x + 20, baseY - 26); ctx.lineTo(x - 20, baseY - 26);
  ctx.closePath(); ctx.fill();
  ell(x, baseY - 27, 27, 8, 0, DUSK);
  ctx.fillStyle = CLOTH_B;
  rr(x - 13, baseY - 92, 26, 66, 5); ctx.fill();
  line(x, baseY - 92, x, baseY - 100, DUSK, 3);
  // flame: teardrop, 2-phase sine flicker
  ctx.save();
  ctx.translate(x, baseY - 100);
  ctx.scale(1 / (0.92 + 0.08 * fl), fl);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-11, -7, -8, -25, 0, -36);
  ctx.bezierCurveTo(8, -25, 11, -7, 0, 0);
  ctx.closePath();
  ctx.fillStyle = FLAME; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, -3);
  ctx.bezierCurveTo(-6, -8, -4, -17, 0, -23);
  ctx.bezierCurveTo(4, -17, 6, -8, 0, -3);
  ctx.closePath();
  ctx.fillStyle = FL_YELLOW; ctx.fill();
  ctx.restore();
}
function drawCornerMark() {
  // her signed corner mark: a tiny hand-drawn flower glyph
  var x = 1218, y = 838;
  ctx.strokeStyle = WINE; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (var i = 0; i < 5; i++) {
    var a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    ell(x + 11 * Math.cos(a), y + 11 * Math.sin(a), 8, 5, a, FL_PINK);
  }
  circ(x, y, 4.5, FL_ORANGE);
  ctx.beginPath();
  ctx.moveTo(x, y + 16);
  ctx.quadraticCurveTo(x + 2, y + 30, x - 2, y + 42);
  ctx.strokeStyle = BOTTLE; ctx.stroke();
  ell(x + 9, y + 30, 8, 4, 0.5, SALAD);
}

// ---- arrangement state --------------------------------------
// Positions are a pure function of the anchored clock
// plus the authored switch history. transStart is a
// piece-clock time; fromPos is the snapshot taken at
// the last switch, so mid-transition switches stay
// continuous. Frame one has no transition running.
var arrIdx = startIdx;
var curPos = {}, fromPos = {};
var transStart = -10;
var TRANS_LEN = 0.55;
function snapshot(idx) {
  var o = {};
  for (var i = 0; i < ITEM_KEYS.length; i++) {
    var p = ARRANGEMENTS[idx][ITEM_KEYS[i]];
    o[ITEM_KEYS[i]] = [p[0], p[1]];
  }
  return o;
}
curPos = snapshot(arrIdx);
fromPos = snapshot(arrIdx);
function smooth(p) { return p * p * (3 - 2 * p); }
function itemPos(key, t) {
  var to = ARRANGEMENTS[arrIdx][key];
  var el = t - transStart;
  if (el >= TRANS_LEN) return to;
  var fr = fromPos[key];
  var p = smooth(Math.max(0, el / TRANS_LEN));
  return [fr[0] + (to[0] - fr[0]) * p,
          fr[1] + (to[1] - fr[1]) * p - Math.sin(p * Math.PI) * 16];
}

// ---- draw ------------------------------------------------------
function draw() {
  drawBackdrop(T);
  drawCloth();
  drawChair();
  var items = [];
  items.push({ y: SALAD_POS[1], fn: function () { drawSalad(SALAD_POS[0], SALAD_POS[1]); } });
  items.push({ y: CANDLE_POS[1], fn: function () { drawCandle(CANDLE_POS[0], CANDLE_POS[1], T); } });
  var pos = {};
  for (var i = 0; i < ITEM_KEYS.length; i++) pos[ITEM_KEYS[i]] = itemPos(ITEM_KEYS[i], T);
  items.push({ y: pos.bottle[1], fn: (function (p) { return function () { drawBottle(p[0], p[1]); }; })(pos.bottle) });
  items.push({ y: pos.glassL[1], fn: (function (p) { return function () { drawGlass(p[0], p[1]); }; })(pos.glassL) });
  items.push({ y: pos.glassR[1], fn: (function (p) { return function () { drawGlass(p[0], p[1]); }; })(pos.glassR) });
  items.push({ y: pos.vase[1], fn: (function (p) { return function () { drawVase(p[0], p[1], T); }; })(pos.vase) });
  items.push({ y: pos.lemons[1], fn: (function (p) { return function () { drawLemons(p[0], p[1]); }; })(pos.lemons) });
  items.push({ y: pos.papaya[1], fn: (function (p) { return function () { drawPapaya(p[0], p[1]); }; })(pos.papaya) });
  items.sort(function (a, b) { return a.y - b.y; });
  for (var j = 0; j < items.length; j++) items[j].fn();
  drawCornerMark();
}

// ---- step ------------------------------------------------------
function step() { /* state is a pure function of T plus tap history */ }

// ---- pointer: double-tap advances the arrangement --------------
// Tap timing uses the piece clock, as elsewhere in the
// lane, so interaction never touches a wall clock.
var downX = -1, downY = -1, downT = 0;
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved >= 28 || held >= 0.8) return;
  var ddx = p.x - lastTapX, ddy = p.y - lastTapY;
  if (T - lastTapT <= 0.45 && Math.sqrt(ddx * ddx + ddy * ddy) < 90) {
    // settle the current positions, then advance the table
    for (var i = 0; i < ITEM_KEYS.length; i++) {
      var ip = itemPos(ITEM_KEYS[i], T);
      fromPos[ITEM_KEYS[i]] = [ip[0], ip[1]];
    }
    arrIdx = (arrIdx + 1) % ARRANGEMENTS.length;
    transStart = T;
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = p.x; lastTapY = p.y;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; });

// ---- sizing: full-bleed cover fit ------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- clock -------------------------------------------------------
// T starts at the constant phase T_OFF and advances in
// fixed 1/60 ticks; frame one is drawn synchronously at
// T_OFF exactly, so the thumbnail reproduces
// byte-identically from the shipped script.
var T = T_OFF, acc = 0, lastNow = -1;
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
