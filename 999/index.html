<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phenomena</title>
<style>
  html, body { margin: 0; padding: 0; background: #07080C; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function clamp01(v) { return clamp(v, 0, 1); }

  // ---------- constants ----------
  var SEED = 999160;
  var DT = 1 / 120;              // fixed sim step (120 Hz)
  var PREROLL = 2400;            // exactly 2400 steps = 20 s before frame one
  var AMP = 40;                  // the amplification: minuscule x40
  var PATCH_UNITS = 24;          // the patch is 24 x 24 units
  var N_MOTES = 14;
  var N_PARTS = 500;
  var TREM_N = 11;               // trembling line points

  var COL = {
    field: '#07080C',
    patchFrame: '#3A3D46',
    patchInk: '#8A8D84',
    current: '#4FD6FF',
    seismic: '#FFD93B',
    breath: '#FF4FD8',
    fader: '#14161C',
    handle: '#FFFFFF',
    tag: '#8A8D84'
  };

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, PHONE = false;

  function viewportSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: Math.max(50, Math.round(w)), h: Math.max(50, Math.round(h)) };
  }

  function resize() {
    var s = viewportSize();
    W = s.w; H = s.h;
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    PHONE = (Math.min(sw, sh) < 700) || (H > W * 1.15);
  }

  function barH() { return PHONE ? 60 : 54; }
  function patchPx() { return clamp(Math.round(Math.min(W, H) * 0.06), 30, 56); }
  function patchRect() {
    var p = patchPx();
    var fh = H - barH();
    return { x: Math.round(W / 2 - p / 2), y: Math.round(fh / 2 - p / 2), s: p };
  }

  // ---------- faders (the edit) ----------
  // value: user value while held, else a slow seeded LFO drift around 0.72.
  var faders = [];
  (function initFaders() {
    var rng = mulberry32(SEED ^ 0xFAD3);
    var names = ['CURRENT', 'SEISMIC', 'BREATH'];
    for (var i = 0; i < 3; i++) {
      faders.push({
        name: names[i],
        fs: 0.8 + rng() * 0.45,
        ph: rng() * Math.PI * 2,
        userVal: 0.72,
        holdUntil: -1,
        relT: -1,
        relVal: 0.72
      });
    }
  })();
  function faderValue(i, t) {
    var f = faders[i];
    if (t < f.holdUntil) return f.userVal;
    var drift = 0.72 + 0.16 * Math.sin(0.13 * t * f.fs + f.ph);
    if (f.relT > 0 && t - f.relT < 2.5) {
      var k = (t - f.relT) / 2.5;
      k = k * k * (3 - 2 * k);
      return f.relVal + (drift - f.relVal) * k;
    }
    return drift;
  }
  function gain(i, t) { return faderValue(i, t) * 1.4; }  // fader 0..1 -> gain 0..1.4

  // ---------- the phenomenon (micro patch state, pure data) ----------
  var phenCount = 0;
  var motes = [];        // {x,y,vx,vy,tvx,tvy,ph} in patch units
  var trem = null;       // trembling line params
  var pulse = null;      // pulsing dot params {x,y,fp,ph}
  var curl = null;       // full-frame current field params (fixed per piece)
  (function initCurl() {
    var rng = mulberry32(SEED ^ 0xC021);
    curl = {
      fx: 1.15 + rng() * 0.5, fy: 1.0 + rng() * 0.5,
      fx2: 2.1 + rng() * 0.7, fy2: 1.9 + rng() * 0.7,
      p1: rng() * Math.PI * 2, p2: rng() * Math.PI * 2,
      p3: rng() * Math.PI * 2, p4: rng() * Math.PI * 2
    };
  })();

  function initMicro() {
    var rng = mulberry32((SEED + phenCount * 7919) >>> 0);
    var biasX = (rng() - 0.5) * 1.5;         // this phenomenon's prevailing drift
    var biasY = (rng() - 0.5) * 0.7;
    motes = [];
    for (var i = 0; i < N_MOTES; i++) {
      var tvx = biasX + (rng() - 0.5) * 1.5;
      var tvy = biasY + (rng() - 0.5) * 1.1;
      motes.push({
        x: 1.5 + rng() * 21, y: 1.5 + rng() * 21,
        vx: tvx, vy: tvy, tvx: tvx, tvy: tvy,
        ph: rng() * Math.PI * 2
      });
    }
    trem = {
      a1: 1.3 + rng() * 0.7, w1: 1.9 + rng() * 0.7, ph1: rng() * Math.PI * 2,
      a2: 0.6 + rng() * 0.5, w2: 3.3 + rng() * 0.9, ph2: rng() * Math.PI * 2,
      a3: 0.28 + rng() * 0.14, w3: 10.5 + rng() * 3.5, ph3: rng() * Math.PI * 2
    };
    pulse = { x: 16 + rng() * 4, y: 5 + rng() * 3, fp: 0.13 + rng() * 0.06, ph: rng() * Math.PI * 2 };
  }

  // ---------- full-frame current particles ----------
  var parts = [];
  function initField() {
    var rng = mulberry32((SEED ^ 0x91E1) + phenCount * 331);
    parts = [];
    for (var i = 0; i < N_PARTS; i++) {
      parts.push({ x: rng(), y: rng(), j: 0.7 + rng() * 0.6, pvx: 0, pvy: 0 });
    }
  }

  // ---------- sim state ----------
  var T = 0;
  var chanX = 0, chanY = 0, chanB = 0.5;   // the patch's real motion stats
  var prevBright = 0, prevFracL = 0.5, shimmerSm = 0;
  var yHist = [];                          // chanY history, one sample per step
  var rings = [];                          // breath rings {r, spd}
  var prevDB = 0;
  var RING_MAX = 0.60;                     // fraction of min(W,H)

  function tremY(i, t) {
    return 12 + trem.a1 * Math.sin(trem.w1 * t + trem.ph1 + i * 0.55)
              + trem.a2 * Math.sin(trem.w2 * t + trem.ph2 + i * 1.13)
              + trem.a3 * Math.sin(trem.w3 * t + trem.ph3 + i * 0.9);
  }
  function tremVY(i, t) {
    return trem.a1 * trem.w1 * Math.cos(trem.w1 * t + trem.ph1 + i * 0.55)
         + trem.a2 * trem.w2 * Math.cos(trem.w2 * t + trem.ph2 + i * 1.13)
         + trem.a3 * trem.w3 * Math.cos(trem.w3 * t + trem.ph3 + i * 0.9);
  }
  function pulseBright(t) {
    return 0.5 - 0.5 * Math.cos(2 * Math.PI * pulse.fp * t + pulse.ph);
  }

  function step() {
    T += DT;
    var i, m;

    // motes: spring toward per-mote target velocity + seeded jitter, bounce at walls
    var sumVX = 0, sumVY = 0, leftCount = 0;
    for (i = 0; i < motes.length; i++) {
      m = motes[i];
      m.vx += ((m.tvx - m.vx) * 1.4 + 0.35 * Math.sin(T * 0.9 + m.ph)) * DT;
      m.vy += ((m.tvy - m.vy) * 1.4 + 0.35 * Math.cos(T * 0.8 + m.ph * 1.7)) * DT;
      m.x += m.vx * DT;
      m.y += m.vy * DT;
      if (m.x < 0.6) { m.x = 0.6; m.vx = Math.abs(m.vx); }
      if (m.x > 23.4) { m.x = 23.4; m.vx = -Math.abs(m.vx); }
      if (m.y < 0.6) { m.y = 0.6; m.vy = Math.abs(m.vy); }
      if (m.y > 23.4) { m.y = 23.4; m.vy = -Math.abs(m.vy); }
      sumVX += m.vx; sumVY += m.vy;
      if (m.x < 12) leftCount++;
    }
    chanX = sumVX / motes.length;

    // Y channel: the trembling line's mean y-velocity (analytic, from the same data)
    var sumT = 0;
    for (i = 0; i < TREM_N; i++) sumT += tremVY(i, T);
    chanY = sumT / TREM_N;
    yHist.push(chanY);
    if (yHist.length > 8192) yHist.splice(0, 1024);

    // B channel: pulsing dot brightness + its derivative + mote-density shimmer
    var bNow = pulseBright(T);
    var dB = (bNow - prevBright) / DT;
    prevBright = bNow;
    var fracL = leftCount / motes.length;
    var shimInst = clamp((fracL - prevFracL) / DT * 0.02, -1, 1);
    prevFracL = fracL;
    shimmerSm += (shimInst - shimmerSm) * 0.04;
    var dBNorm = clamp(dB / (Math.PI * pulse.fp), -1, 1);
    chanB = clamp01(0.60 * bNow + 0.30 * (0.5 + 0.5 * dBNorm) + 0.18 * shimmerSm);

    // breath rings: spawn on each brightness peak, expand at a B-driven rate
    if (prevDB > 0 && dB <= 0) {
      rings.push({ r: 0.05, spd: (0.016 + 0.027 * chanB) * Math.max(0.15, gain(2, T)) });
      if (rings.length > 10) rings.shift();
    }
    prevDB = dB;
    for (i = rings.length - 1; i >= 0; i--) {
      rings[i].r += rings[i].spd * DT;
      if (rings[i].r > RING_MAX) rings.splice(i, 1);
    }

    // CURRENT: advect the field particles; global drift is the X channel, amplified
    var gC = gain(0, T);
    var driftX = chanX * (AMP / PATCH_UNITS) * 0.16 * gC;
    var driftY = clamp(chanY, -2, 2) * 0.02 * gC;
    var spd = 0.045 * (0.35 + 0.65 * gC);
    var c = curl;
    for (i = 0; i < parts.length; i++) {
      var p = parts[i];
      var cvx = Math.sin(2 * Math.PI * (c.fy * p.y + c.p2) + 0.06 * T)
              + 0.6 * Math.sin(2 * Math.PI * (c.fy2 * p.x + c.p3) - 0.043 * T);
      var cvy = Math.cos(2 * Math.PI * (c.fx * p.x + c.p1) - 0.05 * T)
              + 0.6 * Math.cos(2 * Math.PI * (c.fx2 * p.y + c.p4) + 0.037 * T);
      p.pvx = cvx * spd * p.j + driftX;
      p.pvy = cvy * spd * p.j + driftY;
      p.x += p.pvx * DT;
      p.y += p.pvy * DT;
      if (p.x < 0) p.x += 1; if (p.x > 1) p.x -= 1;
      if (p.y < 0) p.y += 1; if (p.y > 1) p.y -= 1;
    }
  }

  function reseedPhenomenon(full) {
    phenCount++;
    initMicro();
    // the lanes re-amplify from the new micro state: clear their readable history
    yHist.length = 0;
    rings.length = 0;
    prevBright = pulseBright(T);
    prevDB = 0;
    prevFracL = 0.5;
    shimmerSm = 0;
    if (full) initField();
  }

  // ---------- audio (lazy, guarded; the faders are the mixer) ----------
  var AC = null, gNoise = null, gSeis = null, gBreath = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    try {
      var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext
               : (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null;
      if (!Ctor) return;
      AC = new Ctor();
      var master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
      // CURRENT: airy noise
      var len = AC.sampleRate * 2;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.6;
      gNoise = AC.createGain(); gNoise.gain.value = 0;
      src.connect(bp); bp.connect(gNoise); gNoise.connect(master); src.start();
      // SEISMIC: low rumble
      var o1 = AC.createOscillator(); o1.type = 'sine'; o1.frequency.value = 46;
      gSeis = AC.createGain(); gSeis.gain.value = 0;
      o1.connect(gSeis); gSeis.connect(master); o1.start();
      // BREATH: slow swell tone
      var o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = 96;
      gBreath = AC.createGain(); gBreath.gain.value = 0;
      o2.connect(gBreath); gBreath.connect(master); o2.start();
    } catch (e) { AC = null; }
  }
  function audioFrame() {
    if (!AC) return;
    try {
      var t = AC.currentTime;
      gNoise.gain.setTargetAtTime(clamp(Math.abs(chanX) * 0.35, 0, 0.4) * gain(0, T) * 0.35, t, 0.08);
      gSeis.gain.setTargetAtTime(clamp(Math.abs(chanY) * 0.10, 0, 0.35) * gain(1, T) * 0.4, t, 0.08);
      gBreath.gain.setTargetAtTime(chanB * gain(2, T) * 0.10, t, 0.15);
    } catch (e) { /* audio is garnish; the visual is complete in silence */ }
  }

  // ---------- draw ----------
  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var bh = barH();
    var fieldH = H - bh;
    var minD = Math.min(W, fieldH);
    var cx = W / 2, cy = fieldH / 2;
    var gB = gain(2, T), gS = gain(1, T);

    ctx.fillStyle = COL.field;
    ctx.fillRect(0, 0, W, H);

    // BREATH (behind everything): expanding rings + layered sun, driven by chanB
    var i, r;
    for (i = 0; i < rings.length; i++) {
      r = rings[i].r * minD;
      var a = (1 - rings[i].r / RING_MAX) * 0.42 * Math.min(1, gB);
      if (a <= 0.004) continue;
      ctx.strokeStyle = COL.breath;
      ctx.globalAlpha = a * 0.35;
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = a;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    var sunR = minD * 0.052 * (0.8 + 0.45 * chanB * Math.max(0.1, gB));
    var sunA = [0.05, 0.07, 0.10, 0.15];
    var sunK = [1.0, 0.78, 0.55, 0.34];
    ctx.fillStyle = COL.breath;
    for (i = 0; i < 4; i++) {
      ctx.globalAlpha = sunA[i] * Math.min(1.2, gB) * (0.6 + 0.6 * chanB);
      ctx.beginPath(); ctx.arc(cx, cy, Math.max(1, sunR * sunK[i]), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // CURRENT: the particle field, swept by the patch's X drift
    ctx.strokeStyle = COL.current;
    ctx.lineWidth = 1.4;
    for (i = 0; i < parts.length; i++) {
      var p = parts[i];
      var px = p.x * W, py = p.y * fieldH;
      var sp = Math.sqrt(p.pvx * p.pvx + p.pvy * p.pvy);
      ctx.globalAlpha = clamp(0.25 + sp * 3.2, 0.25, 0.85);
      ctx.beginPath();
      ctx.moveTo(px - p.pvx * W * 0.085, py - p.pvy * fieldH * 0.085);
      ctx.lineTo(px, py);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // SEISMIC: the Y channel's own history, amplified, as a trace across mid-frame
    var midY = fieldH * 0.5;
    var bandHalf = fieldH * 0.17;
    ctx.strokeStyle = COL.seismic;
    ctx.globalAlpha = 0.14;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();
    if (yHist.length > 8) {
      var delays = [0, 240];
      for (var pass = 0; pass < 2; pass++) {
        var delay = delays[pass];
        ctx.globalAlpha = pass === 0 ? 0.9 : 0.22;
        ctx.lineWidth = pass === 0 ? 1.6 : 1.1;
        ctx.beginPath();
        var started = false;
        for (var sx = 0; sx <= W; sx += 3) {
          var ago = (W - sx) / 3 * 2 + delay;          // samples back from now (2 per column)
          var idx = yHist.length - 1 - ago;
          if (idx < 0) continue;
          var v = yHist[Math.floor(idx)];
          var off = clamp(v * (AMP / PATCH_UNITS), -1.5, 1.5) * bandHalf * 0.52 * gS;
          var yy = midY - off;
          if (!started) { ctx.moveTo(sx, yy); started = true; } else ctx.lineTo(sx, yy);
        }
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // THE PATCH: tiny, centered, precious. Filled so the lanes pass behind it.
    var pr = patchRect();
    var sc = pr.s / PATCH_UNITS;
    ctx.fillStyle = COL.field;
    ctx.fillRect(pr.x, pr.y, pr.s, pr.s);
    // trembling line
    ctx.strokeStyle = COL.patchInk;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (i = 0; i < TREM_N; i++) {
      var tx = pr.x + (2 + i * 2) * sc;
      var ty = pr.y + tremY(i, T) * sc;
      if (i === 0) ctx.moveTo(tx, ty); else ctx.lineTo(tx, ty);
    }
    ctx.stroke();
    // pulsing dot
    ctx.fillStyle = COL.patchInk;
    ctx.globalAlpha = 0.3 + 0.7 * pulseBright(T);
    ctx.beginPath(); ctx.arc(pr.x + pulse.x * sc, pr.y + pulse.y * sc, 1.9, 0, Math.PI * 2); ctx.fill();
    // dust motes
    ctx.globalAlpha = 0.9;
    for (i = 0; i < motes.length; i++) {
      ctx.fillRect(pr.x + motes[i].x * sc - 0.8, pr.y + motes[i].y * sc - 0.8, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
    // hairline frame
    ctx.strokeStyle = COL.patchFrame;
    ctx.lineWidth = 1;
    ctx.strokeRect(pr.x + 0.5, pr.y + 0.5, pr.s - 1, pr.s - 1);

    // EDIT BAR: three faders, alive with the seeded edit
    var barTop = fieldH;
    ctx.fillStyle = COL.fader;
    ctx.fillRect(0, barTop, W, 1);
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    var trackTop = barTop + 20, trackBot = barTop + bh - 8;
    for (i = 0; i < 3; i++) {
      var gx = (i + 0.5) * W / 3;
      ctx.fillStyle = COL.tag;
      ctx.fillText(faders[i].name, gx, barTop + 12);
      ctx.fillStyle = COL.fader;
      ctx.fillRect(gx - 2, trackTop, 4, trackBot - trackTop);
      var val = faderValue(i, T);
      var hy = trackBot - val * (trackBot - trackTop);
      ctx.fillStyle = COL.handle;
      ctx.fillRect(gx - 9, hy - 2, 18, 4);
    }
  }

  // ---------- interaction ----------
  function nowReal() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  }
  var dragFader = -1;
  var downInfo = null;   // {x, y, t, moved}
  var lastTapReal = -10000;

  function faderFromEvent(x, y) {
    var bh = barH();
    if (y < H - bh - 6) return -1;
    var i = Math.floor(x / (W / 3));
    return clamp(i, 0, 2);
  }
  function setFaderFromY(i, y) {
    var bh = barH();
    var trackTop = (H - bh) + 20, trackBot = (H - bh) + bh - 8;
    var v = clamp01((trackBot - y) / (trackBot - trackTop));
    faders[i].userVal = v;
    faders[i].holdUntil = T + 20;         // your edit holds; the drift pauses 20 s
    faders[i].relT = T + 20;
    faders[i].relVal = v;
  }
  function evtPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
  }
  function onDown(e) {
    ensureAudio();
    var p = evtPos(e);
    var fi = faderFromEvent(p.x, p.y);
    downInfo = { x: p.x, y: p.y, t: nowReal(), moved: false };
    if (fi >= 0) { dragFader = fi; setFaderFromY(fi, p.y); downInfo.moved = true; }
  }
  function onMove(e) {
    if (!downInfo) return;
    var p = evtPos(e);
    if (Math.abs(p.x - downInfo.x) + Math.abs(p.y - downInfo.y) > 9) downInfo.moved = true;
    if (dragFader >= 0) setFaderFromY(dragFader, p.y);
  }
  function onUp(e) {
    if (dragFader >= 0) { dragFader = -1; downInfo = null; return; }
    if (!downInfo || downInfo.moved) { downInfo = null; return; }
    var p = evtPos(e);
    var quick = nowReal() - downInfo.t < 450;
    downInfo = null;
    if (!quick) return;
    // a tap: on the patch = sample a new phenomenon; a second quick tap = reseed all
    var now = nowReal();
    var isDouble = (now - lastTapReal) < 320;
    lastTapReal = now;
    if (isDouble) { reseedPhenomenon(true); return; }
    var pr = patchRect();
    var pad = 16;
    if (p.x >= pr.x - pad && p.x <= pr.x + pr.s + pad && p.y >= pr.y - pad && p.y <= pr.y + pr.s + pad) {
      reseedPhenomenon(false);
    }
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', function () { ensureAudio(); }, { passive: true });

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
  }
  window.addEventListener('resize', function () { resize(); draw(); });

  // ---------- main ----------
  resize();
  initMicro();
  initField();
  prevBright = pulseBright(0);
  for (var s = 0; s < PREROLL; s++) step();   // 2400 fixed steps: frame one is earned
  draw();

  var lastReal = null, acc = 0;
  function frame(ts) {
    if (lastReal === null) lastReal = ts;
    var dt = Math.min(0.06, (ts - lastReal) / 1000);
    lastReal = ts;
    acc += dt;
    var n = 0;
    while (acc >= DT && n < 10) { step(); acc -= DT; n++; }
    if (n === 10) acc = 0;
    audioFrame();
    draw();
    requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }
})();
</script>
