<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Forest</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0A09; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a dark gallery holds hollowed-log drums and one tall totem with an
   oval sound hole like an eye. A dancer in white drifts among them; drag her
   through the forest and the drums answer her nearness with low woody thumps
   and ember light. Circle the totem fully and it releases a deep chord that
   sets every drum humming in sympathy. Without a body in the room, the
   installation stays silent. */
var TAU = Math.PI * 2;
var GROUND = '#0B0A09';
var WALL = '#141110';
var FLOOR = '#080706';
var WOOD = '#6B4A2F';
var WOOD_HI = '#8A6238';
var WOOD_LO = '#4A3220';
var BARK = '#2E2015';
var DANCER = '#F2EFE8';
var EMBER = '#E86A1F';
var EMBER_HI = '#FF8A3D';
var PLATE = '#0D0C0B';
var PLATE_LINE = 'rgba(242,239,232,0.28)';
var TITLE_INK = '#EDEDE8';
var HINT_INK = '#9AA3AD';
var FRAME_T = 60.0;        /* fixed phase for frame one */
var DRUM_COUNT = 7;
var TOTEM_COUNT = 1;
var PROX = 0.16;           /* nearness radius, fraction of min(VW,VH) */
var TOTEM_RING = 0.30;     /* circle-detection radius, fraction of min(VW,VH) */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var soundOn = true;
var audioCtx = null;
var master = null;
var noiseBuf = null;
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
/* ---- seeded forest: 7 drums, 1 totem, dancer start ---- */
var DRUMS = [];
var TOTEM = null;
var DANCER_START = { x: 0.30, y: 0.62 };
(function () {
  var rng = mulberry32(1851);
  var i, spots = [
    [0.16, 0.42], [0.42, 0.30], [0.66, 0.44], [0.84, 0.30],
    [0.24, 0.80], [0.55, 0.74], [0.82, 0.72]
  ];
  for (i = 0; i < DRUM_COUNT; i++) {
    DRUMS.push({
      x: spots[i][0] + (rng() - 0.5) * 0.04,
      y: spots[i][1] + (rng() - 0.5) * 0.04,
      len: 0.085 + rng() * 0.035,   /* log length, fraction of min(VW,VH) */
      rad: 0.020 + rng() * 0.008,   /* log radius */
      rot: (rng() - 0.5) * 0.5,     /* slight tilt */
      freq: 52 + rng() * 26,        /* thump fundamental, Hz */
      pulse: 0,                     /* ember glow 0..1 */
      cool: 0,                      /* retrigger cooldown, seconds */
      ph: rng() * TAU
    });
  }
  TOTEM = {
    x: 0.68, y: 0.46,
    w: 0.055, h: 0.34,              /* totem width/height, fraction of min(VW,VH) */
    pulse: 0,
    ring: 0,                        /* accumulated circling angle, radians */
    lastAng: null,
    fired: 0                       /* chord/hum glow timer, seconds */
  };
})();
var dancer = {
  x: DANCER_START.x, y: DANCER_START.y,
  tx: DANCER_START.x, ty: DANCER_START.y,
  vx: 0, vy: 0, dragging: false
};
var humUntil = -1;   /* phaseT until which the sympathetic hum glows */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The forest fills the frame to the edges on every screen. */
function fieldRect() {
  return { x: 0, y: 0, w: VW, h: VH };
}
function toPx(fx, fy, sc) {
  return { x: sc.x + fx * sc.w, y: sc.y + fy * sc.h };
}
/* ---- audio: built lazily inside the first gesture, never autoplay ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try {
      audioCtx = new AudioContext();
      master = audioCtx.createGain();
      master.gain.value = 0.9;
      master.connect(audioCtx.destination);
      var len = Math.floor(audioCtx.sampleRate * 0.5);
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = noiseBuf.getChannelData(0), i;
      for (i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function thump(dr) {
  if (!soundOn) return;
  var ac = ensureAudio();
  if (!ac) return;
  try {
    var t0 = ac.currentTime;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    var f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 320; f.Q.value = 0.8;
    var src = ac.createBufferSource();
    src.buffer = noiseBuf;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + 0.6);
    var o = ac.createOscillator();
    o.type = 'sine'; o.frequency.value = dr.freq;
    var og = ac.createGain();
    og.gain.setValueAtTime(0.0001, t0);
    og.gain.exponentialRampToValueAtTime(0.35, t0 + 0.015);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
    o.connect(og); og.connect(master);
    o.start(t0); o.stop(t0 + 0.75);
  } catch (e) {}
}
function chord() {
  if (!soundOn) return;
  var ac = ensureAudio();
  if (!ac) return;
  try {
    var t0 = ac.currentTime;
    var parts = [55, 82.5, 110, 165, 220];
    var i, o, g;
    for (i = 0; i < parts.length; i++) {
      o = ac.createOscillator();
      o.type = 'sine'; o.frequency.value = parts[i];
      g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.16, t0 + 0.4);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 5.0);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + 5.1);
    }
  } catch (e) {}
}
/* ---- interaction state: proximity thumps, totem circling ---- */
function angDelta(a, b) {
  var d = a - b;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return d;
}
function stepLogic(dt, t, sc) {
  var m = Math.min(sc.w, sc.h);
  var i, dr, dx, dy, dist;
  /* dancer trails her drag target smoothly */
  var nx = dancer.x + (dancer.tx - dancer.x) * Math.min(1, dt * 6);
  var ny = dancer.y + (dancer.ty - dancer.y) * Math.min(1, dt * 6);
  dancer.vx = (nx - dancer.x) / Math.max(dt, 0.001);
  dancer.vy = (ny - dancer.y) / Math.max(dt, 0.001);
  dancer.x = nx; dancer.y = ny;
  var speed = Math.sqrt(dancer.vx * dancer.vx + dancer.vy * dancer.vy);
  /* drums answer only when she passes near, with a cooldown */
  for (i = 0; i < DRUMS.length; i++) {
    dr = DRUMS[i];
    dr.pulse = Math.max(0, dr.pulse - dt * 0.45);
    dr.cool = Math.max(0, dr.cool - dt);
    dx = dancer.x - dr.x; dy = dancer.y - dr.y;
    dist = Math.sqrt(dx * dx + dy * dy) * m;
    if (speed > 0.02 && dist < PROX * m && dr.cool <= 0) {
      dr.pulse = 1;
      dr.cool = 1.4;
      thump(dr);
    }
  }
  /* totem: accumulate circling angle only while she stays in the ring */
  var tp = toPx(TOTEM.x, TOTEM.y, sc);
  var dp = toPx(dancer.x, dancer.y, sc);
  var tdx = dp.x - tp.x, tdy = dp.y - tp.y;
  var tdist = Math.sqrt(tdx * tdx + tdy * tdy);
  TOTEM.pulse = Math.max(0, TOTEM.pulse - dt * 0.4);
  TOTEM.fired = Math.max(0, TOTEM.fired - dt);
  if (tdist < TOTEM_RING * m && tdist > TOTEM.w * m * 0.9) {
    var ang = Math.atan2(tdy, tdx);
    if (TOTEM.lastAng !== null) {
      var dA = angDelta(ang, TOTEM.lastAng);
      if (Math.abs(dA) < 0.6) TOTEM.ring += dA;
    }
    TOTEM.lastAng = ang;
    if (Math.abs(TOTEM.ring) >= TAU) {
      TOTEM.ring = 0;
      TOTEM.fired = 5.0;
      TOTEM.pulse = 1;
      humUntil = t + 5.0;
      var j;
      for (j = 0; j < DRUMS.length; j++) DRUMS[j].pulse = 1;
      chord();
    }
  } else {
    TOTEM.lastAng = null;
    TOTEM.ring *= Math.max(0, 1 - dt * 0.5);
  }
}
function drawRoom(sc, t) {
  var g = ctx.createLinearGradient(0, sc.y, 0, sc.y + sc.h);
  g.addColorStop(0, WALL);
  g.addColorStop(0.62, GROUND);
  g.addColorStop(0.621, FLOOR);
  g.addColorStop(1, FLOOR);
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  /* faint gallery floor line */
  ctx.strokeStyle = 'rgba(242,239,232,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sc.x, sc.y + sc.h * 0.62);
  ctx.lineTo(sc.x + sc.w, sc.y + sc.h * 0.62);
  ctx.stroke();
}
function drawDrum(dr, sc, t) {
  var m = Math.min(sc.w, sc.h);
  var p = toPx(dr.x, dr.y, sc);
  var L = dr.len * m, R = dr.rad * m;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(dr.rot);
  /* soft shadow */
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.moveTo(L * 0.55, R * 1.1);
  ctx.ellipse(0, R * 1.1, L * 0.55, R * 0.5, 0, 0, TAU);
  ctx.fill();
  /* log body */
  var g = ctx.createLinearGradient(0, -R, 0, R);
  g.addColorStop(0, WOOD_HI);
  g.addColorStop(0.5, WOOD);
  g.addColorStop(1, WOOD_LO);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-L / 2, -R);
  ctx.lineTo(L / 2, -R);
  ctx.lineTo(L / 2, R);
  ctx.lineTo(-L / 2, R);
  ctx.closePath();
  ctx.fill();
  /* end rings */
  ctx.fillStyle = WOOD_LO;
  ctx.beginPath();
  ctx.moveTo(-L / 2 + R * 0.28, -R);
  ctx.ellipse(-L / 2, 0, R * 0.28, R, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(L / 2 - R * 0.28, -R);
  ctx.ellipse(L / 2, 0, R * 0.28, R, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = BARK;
  ctx.lineWidth = Math.max(1, R * 0.08);
  ctx.beginPath();
  ctx.moveTo(-L / 2, -R * 0.45);
  ctx.lineTo(L / 2, -R * 0.45);
  ctx.moveTo(-L / 2, R * 0.35);
  ctx.lineTo(L / 2, R * 0.35);
  ctx.stroke();
  /* sound hole, pulsing ember when the drum answers */
  var glow = dr.pulse;
  if (glow > 0.01) {
    var rg = ctx.createRadialGradient(0, -R * 0.15, 0, 0, -R * 0.15, R * 3.2);
    rg.addColorStop(0, rgba(EMBER, (0.45 * glow).toFixed(4)));
    rg.addColorStop(1, rgba(EMBER, 0));
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(R * 3.2, -R * 0.15);
    ctx.arc(0, -R * 0.15, R * 3.2, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = glow > 0.01 ? rgba(EMBER_HI, (0.35 + 0.65 * glow).toFixed(4)) : BARK;
  ctx.beginPath();
  ctx.moveTo(R * 0.55, -R * 0.15);
  ctx.ellipse(0, -R * 0.15, R * 0.55, R * 0.42, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function drawTotem(sc, t) {
  var m = Math.min(sc.w, sc.h);
  var p = toPx(TOTEM.x, TOTEM.y, sc);
  var W = TOTEM.w * m, H = TOTEM.h * m;
  var top = p.y - H / 2, left = p.x - W / 2;
  /* shadow */
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.moveTo(left + W * 0.15, top + H);
  ctx.ellipse(p.x, top + H + W * 0.12, W * 0.85, W * 0.14, 0, 0, TAU);
  ctx.fill();
  /* trunk */
  var g = ctx.createLinearGradient(left, 0, left + W, 0);
  g.addColorStop(0, WOOD_LO);
  g.addColorStop(0.35, WOOD);
  g.addColorStop(0.6, WOOD_HI);
  g.addColorStop(1, WOOD_LO);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(left + W * 0.12, top);
  ctx.quadraticCurveTo(p.x, top - W * 0.18, left + W * 0.88, top);
  ctx.lineTo(left + W * 0.92, top + H);
  ctx.lineTo(left + W * 0.08, top + H);
  ctx.closePath();
  ctx.fill();
  /* bark lines */
  ctx.strokeStyle = BARK;
  ctx.lineWidth = Math.max(1, W * 0.03);
  var i;
  for (i = 0; i < 4; i++) {
    var bx = left + W * (0.22 + i * 0.18);
    ctx.beginPath();
    ctx.moveTo(bx, top + H * 0.08);
    ctx.quadraticCurveTo(bx + W * 0.06, top + H * 0.5, bx - W * 0.04, top + H * 0.94);
    ctx.stroke();
  }
  /* oval sound hole, the eye */
  var ey = top + H * 0.24;
  var erx = W * 0.26, ery = W * 0.42;
  var glow = Math.max(TOTEM.pulse, TOTEM.fired > 0 ? 0.9 : 0);
  if (glow > 0.01) {
    var rg = ctx.createRadialGradient(p.x, ey, 0, p.x, ey, W * 2.4);
    rg.addColorStop(0, rgba(EMBER, (0.5 * glow).toFixed(4)));
    rg.addColorStop(1, rgba(EMBER, 0));
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(p.x + W * 2.4, ey);
    ctx.arc(p.x, ey, W * 2.4, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = glow > 0.01 ? rgba(EMBER_HI, (0.4 + 0.6 * glow).toFixed(4)) : '#120D08';
  ctx.beginPath();
  ctx.moveTo(p.x + erx, ey);
  ctx.ellipse(p.x, ey, erx, ery, 0, 0, TAU);
  ctx.fill();
  /* faint circling progress arc, only while she is in the ring */
  if (TOTEM.lastAng !== null && Math.abs(TOTEM.ring) > 0.15) {
    var rr = TOTEM_RING * m * 0.82;
    ctx.strokeStyle = rgba(EMBER, 0.35);
    ctx.lineWidth = Math.max(1.5, W * 0.05);
    ctx.beginPath();
    ctx.arc(p.x, p.y, rr, 0, TOTEM.ring, TOTEM.ring < 0);
    ctx.stroke();
  }
}
function drawDancer(sc, t) {
  var m = Math.min(sc.w, sc.h);
  var p = toPx(dancer.x, dancer.y, sc);
  /* gentle idle sway, in place, so she is always moving but never travels */
  var sway = Math.sin(TAU * t / 9 + 1.2) * m * 0.004;
  var bob = Math.sin(TAU * t / 4.5 + 0.4) * m * 0.002;
  var px = p.x + sway, py = p.y + bob;
  var s = m * 0.030;   /* figure height scale */
  /* trailing wisp, behind her direction of travel */
  var tx = -dancer.vx, ty = -dancer.vy;
  var tl = Math.sqrt(tx * tx + ty * ty);
  if (tl > 0.001) { tx /= tl; ty /= tl; } else { tx = -0.8; ty = 0.35; }
  var i;
  for (i = 4; i >= 1; i--) {
    var gx = px + tx * s * 0.55 * i + Math.sin(TAU * t / 6 + i) * s * 0.08;
    var gy = py + ty * s * 0.55 * i + s * 0.3 * i;
    ctx.fillStyle = rgba(DANCER, 0.10 * (5 - i) / 4);
    ctx.beginPath();
    ctx.moveTo(gx + s * 0.10, gy);
    ctx.arc(gx, gy, s * (0.16 - i * 0.02), 0, TAU);
    ctx.fill();
  }
  /* soft floor glow under her */
  var rg = ctx.createRadialGradient(px, py + s * 1.15, 0, px, py + s * 1.15, s * 1.6);
  rg.addColorStop(0, 'rgba(242,239,232,0.10)');
  rg.addColorStop(1, 'rgba(242,239,232,0)');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.moveTo(px + s * 1.6, py + s * 1.15);
  ctx.arc(px, py + s * 1.15, s * 1.6, 0, TAU);
  ctx.fill();
  /* figure: head, torso, skirt, arms */
  ctx.strokeStyle = DANCER;
  ctx.fillStyle = DANCER;
  ctx.lineWidth = Math.max(1.5, s * 0.07);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px + s * 0.14, py - s * 0.92);
  ctx.arc(px, py - s * 0.92, s * 0.14, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(px, py - s * 0.78);
  ctx.quadraticCurveTo(px + s * 0.10, py - s * 0.30, px + s * 0.05, py + s * 0.10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px, py - s * 0.62);
  ctx.quadraticCurveTo(px - s * 0.55, py - s * 0.45, px - s * 0.85, py - s * 0.75);
  ctx.moveTo(px, py - s * 0.62);
  ctx.quadraticCurveTo(px + s * 0.55, py - s * 0.40, px + s * 0.80, py - s * 0.15);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px + s * 0.05, py + s * 0.10);
  ctx.quadraticCurveTo(px - s * 0.25, py + s * 0.75, px - s * 0.55, py + s * 1.05);
  ctx.moveTo(px + s * 0.05, py + s * 0.10);
  ctx.quadraticCurveTo(px + s * 0.35, py + s * 0.75, px + s * 0.62, py + s * 1.02);
  ctx.stroke();
}
function drawHum(sc, t) {
  if (t >= humUntil) return;
  var m = Math.min(sc.w, sc.h);
  var a = 0.05 * (1 - (humUntil - t) / 5.0) + 0.03;
  var g = ctx.createRadialGradient(sc.x + sc.w * 0.5, sc.y + sc.h * 0.5, 0, sc.x + sc.w * 0.5, sc.y + sc.h * 0.5, m * 0.55);
  g.addColorStop(0, rgba(EMBER, a.toFixed(4)));
  g.addColorStop(1, rgba(EMBER, 0));
  ctx.fillStyle = g;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Sound Forest').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Sound Forest').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 05').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Sound Forest', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 05', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag the dancer.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;

  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);

function draw() {

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);

  var i;
  for (i = 0; i < DRUMS.length; i++) drawDrum(DRUMS[i], sc, t);

    totemCount: TOTEM_COUNT,

/* ---- frame one: fixed phase t = 60.0 s, dancer at her start, all drums dark ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);

    soundOn = !soundOn;
    draw();
    return;
  }
  ensureAudio();
  dancer.dragging = true;
  dancer.tx = clamp(p.x, 0.02, 0.98);
  dancer.ty = clamp(p.y, 0.02, 0.98);
  try { ev.preventDefault(); } catch (e) {}
}
function onMove(ev) {
  if (!dancer.dragging) return;
  var p = pointerPos(ev);
  dancer.tx = clamp(p.x, 0.02, 0.98);
  dancer.ty = clamp(p.y, 0.02, 0.98);
  try { ev.preventDefault(); } catch (e) {}
}
function onUp() { dancer.dragging = false; }
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);

  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', onUp);

draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {

    function step(now) {

      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);

      clockT += dt;

      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
