<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№44 · Color Break</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,255,255,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to move the break</div>
<script>
'use strict';
// No44 Color Break (after mathiaskrissmer, prompt 9 via Bug).
// Five luminous white elliptical loops turn slowly on black, each
// with seeded eccentricity, tilt, and integer rotation rate, so the
// 32 second loop closes. One accent exists: flat vermilion, and it
// appears only on the segments of the loops that fall inside a
// single drifting zone. The zone is never drawn; only its effect
// is visible. Inside segments render vermilion in one flat pass,
// no glow; outside, the loops render white in additive passes.
// Idle, the zone drifts on its own slow path. Drag moves it; it
// follows the pointer with easing.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '44', 10) || 44;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#000000';
const VERMILION = '#ff2e1f';
const LOOP = 32;

const rnd = mulberry32(seed);
const LOOPS5 = Array.from({ length: 5 }, (_, i) => ({
  cx: 0.24 + rnd() * 0.52,
  cy: 0.24 + rnd() * 0.52,
  a: 0.16 + rnd() * 0.13,
  ecc: 0.45 + rnd() * 0.35,
  tilt: rnd() * Math.PI,
  rate: (i % 2 === 0 ? 1 : -1) * (1 + (i % 3)),
  ph: rnd() * Math.PI * 2
}));
const ZONE_R = 0.19;

let zone = { x: 0.5, y: 0.45 };
let zoneTarget = null;
let dragging = false;

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const S = Math.min(w, h);
  const ox = (w - S) / 2, oy = (h - S) / 2;
  const t = (nowMs / 1000) % LOOP;
  const tu = t / LOOP;

  // zone: idle drift or pointer target, eased
  let zt;
  if (zoneTarget) zt = zoneTarget;
  else zt = {
    x: 0.5 + 0.30 * Math.sin(tu * Math.PI * 2 * 1 + 1.1),
    y: 0.48 + 0.26 * Math.sin(tu * Math.PI * 2 * 2 + 0.4)
  };
  zone.x += (zt.x - zone.x) * 0.045;
  zone.y += (zt.y - zone.y) * 0.045;
  const zx = ox + zone.x * S, zy = oy + zone.y * S, zr = ZONE_R * S;

  const passes = [
    { a: 0.09, lw: 0.016 }, { a: 0.25, lw: 0.007 }, { a: 0.7, lw: 0.003 }
  ];
  const SEG = 110;
  for (const lp of LOOPS5) {
    const rot = lp.tilt + tu * Math.PI * 2 * lp.rate;
    const lcx = ox + lp.cx * S, lcy = oy + lp.cy * S;
    const A = lp.a * S, B = lp.a * lp.ecc * S;
    const pts = [];
    for (let i = 0; i <= SEG; i++) {
      const a = (i / SEG) * Math.PI * 2 + lp.ph;
      const ex = A * Math.cos(a), ey = B * Math.sin(a);
      pts.push([lcx + ex * Math.cos(rot) - ey * Math.sin(rot), lcy + ex * Math.sin(rot) + ey * Math.cos(rot)]);
    }
    // white passes (outside segments only, drawn per segment run)
    ctx.globalCompositeOperation = 'lighter';
    for (const pass of passes) {
      ctx.strokeStyle = 'rgba(255,255,255,' + pass.a + ')';
      ctx.lineWidth = Math.max(0.7, S * pass.lw);
      ctx.beginPath();
      let pen = false;
      for (let i = 0; i < SEG; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
        const inside = Math.hypot(mx - zx, my - zy) < zr;
        if (!inside) {
          if (!pen) { ctx.moveTo(pts[i][0], pts[i][1]); pen = true; }
          ctx.lineTo(pts[i + 1][0], pts[i + 1][1]);
        } else pen = false;
      }
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    // vermilion: inside segments, one flat pass
    ctx.strokeStyle = VERMILION;
    ctx.lineWidth = Math.max(0.8, S * 0.0035);
    ctx.beginPath();
    let pen2 = false;
    for (let i = 0; i < SEG; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      const inside = Math.hypot(mx - zx, my - zy) < zr;
      if (inside) {
        if (!pen2) { ctx.moveTo(pts[i][0], pts[i][1]); pen2 = true; }
        ctx.lineTo(pts[i + 1][0], pts[i + 1][1]);
      } else pen2 = false;
    }
    ctx.stroke();
  }
  return {};
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(9000);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function setZoneFromEvent(ev) {
  const [w, h] = viewportWH();
  const S = Math.min(w, h);
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  zoneTarget = {
    x: (ev.clientX - r.left - (w - S) / 2) / S,
    y: (ev.clientY - r.top - (h - S) / 2) / S
  };
}
canvas.addEventListener('pointerdown', ev => { dragging = true; setZoneFromEvent(ev); });
canvas.addEventListener('pointermove', ev => { if (dragging) setZoneFromEvent(ev); });
function endDrag() { dragging = false; zoneTarget = null; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
