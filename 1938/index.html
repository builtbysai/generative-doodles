<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1938 52 Studies for Right Hand</title>
<style>
  html, body { margin: 0; padding: 0; background: #f3eee1; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette from the prompt: paper cream, ink black gestures, pale grey
  // panel borders, a faint ochre wash on finished studies.
  var PAPER = '#f3eee1';
  var INK = '#1a1712';
  var BORDER = '#c9c2b2';
  var OCHRE = '#d9a441';

  var COLS = 13, ROWS = 4, TOTAL = 52;
  var PRE_EXISTING = 5;   // studies already inked at frame one
  var DRAW_DUR = 1.2;     // seconds for one gesture to be drawn
  var FIRST_T = 1;        // simulated time of the first frame, seconds

  // Seeded PRNG, mulberry32. A fresh instance per gesture, so every
  // gesture is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function smooth(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }

  // One gesture per panel, generated at load from the seed. Points are
  // normalized panel coordinates: u in [0.58, 0.94] of the panel width,
  // so no gesture ever enters the panel's left half; v in [0.08, 0.92]
  // of the panel height. Three kinds of right-hand line: a flowing
  // curve, an angular zigzag, and a small curl with a falling exit.
  function genGesture(i) {
    var rng = mulberry32(1938 * 7919 + i * 131);
    var type = Math.floor(rng() * 3);
    var pts = [];
    var k, u, v;
    if (type === 0) {
      var ph = rng() * Math.PI * 2;
      var amp = 0.06 + rng() * 0.08;
      var n = 11;
      for (k = 0; k < n; k++) {
        v = 0.08 + (0.84 * k) / (n - 1);
        u = 0.76 + amp * Math.sin(ph + v * 6.5) + (rng() - 0.5) * 0.03;
        pts.push([clamp(u, 0.58, 0.94), v]);
      }
    } else if (type === 1) {
      var n2 = 8;
      var left = true;
      for (k = 0; k < n2; k++) {
        v = 0.08 + (0.84 * k) / (n2 - 1);
        u = left ? 0.60 + rng() * 0.05 : 0.88 + rng() * 0.05;
        if (k === 0) { u = 0.62 + rng() * 0.04; }
        if (k === n2 - 1) { u = 0.90 + rng() * 0.03; }
        pts.push([clamp(u, 0.58, 0.94), v]);
        left = !left;
      }
    } else {
      var cx = 0.74 + (rng() - 0.5) * 0.06;
      var cy = 0.38 + rng() * 0.18;
      var n3 = 13;
      for (k = 0; k < n3; k++) {
        if (k < 9) {
          var a = (k / 8) * Math.PI * 2 * 1.4;
          var r = 0.13 * (1 - k / 14);
          u = cx + r * Math.cos(a);
          v = cy + r * 0.42 * Math.sin(a);
        } else {
          v = 0.62 + (0.28 * (k - 8)) / 4;
          u = cx + 0.10 + (rng() - 0.5) * 0.03;
        }
        pts.push([clamp(u, 0.58, 0.94), clamp(v, 0.08, 0.92)]);
      }
    }
    return { type: type, pts: pts };
  }

  var GESTURES = [];
  for (var gi = 0; gi < TOTAL; gi++) { GESTURES.push(genGesture(gi)); }

  // State. Panels 0..completed-1 are finished; the active gesture, if
  // any, is being drawn on panel `completed`; `pending` counts taps
  // that arrived while a gesture was still drawing, so every tap
  // commissions exactly one study. completedAt holds the time each
  // panel finished, for the wash fade-in; pre-existing studies finished
  // long before frame one.
  var completed = PRE_EXISTING;
  var completedAt = [];
  for (var ci = 0; ci < TOTAL; ci++) { completedAt.push(ci < PRE_EXISTING ? -100 : 0); }
  var active = null;
  var pending = 0;
  var now = FIRST_T;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var L = {};

  function layout() {
    var headerH = Math.round(H * 0.085);
    var hintH = Math.round(H * 0.05);
    var gap = Math.max(3, Math.round(W * 0.006));
    var gridX0 = 16, gridX1 = W - 16;
    var gridY0 = headerH + 10, gridY1 = H - hintH - 12;
    var panelW = (gridX1 - gridX0 - gap * (COLS - 1)) / COLS;
    var panelH = (gridY1 - gridY0 - gap * (ROWS - 1)) / ROWS;
    L = {
      headerH: headerH, hintH: hintH, gap: gap,
      gridX0: gridX0, gridX1: gridX1,
      gridY0: gridY0, gridY1: gridY1,
      panelW: panelW, panelH: panelH
    };
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
    layout();
  }

  function panelRect(i) {
    var col = i % COLS, row = Math.floor(i / COLS);
    return {
      x: L.gridX0 + col * (L.panelW + L.gap),
      y: L.gridY0 + row * (L.panelH + L.gap),
      w: L.panelW, h: L.panelH
    };
  }

  // The panel the next tap will commission: the first empty one after
  // the finished studies, the gesture in progress, and the queue.
  function nextEmptyIndex() {
    var n = completed + (active ? 1 : 0) + pending;
    return n >= TOTAL ? -1 : n;
  }

  function startGesture(i, t0) {
    active = { index: i, t0: t0, g: GESTURES[i] };
  }

  function completeActive() {
    var idx = active.index;
    var doneAt = active.t0 + DRAW_DUR;
    completedAt[idx] = doneAt;
    completed++;
    active = null;
    if (pending > 0) {
      pending--;
      startGesture(completed, doneAt);
    }
  }

  // Tap to commission the next study. Taps never reload or reseed;
  // after 52 they do nothing.
  function commission() {
    if (completed + (active ? 1 : 0) + pending >= TOTAL) { return false; }
    if (reduced) {
      completedAt[completed] = now;
      completed++;
      draw(now);
      return true;
    }
    if (active) { pending++; return true; }
    startGesture(completed, now);
    return true;
  }

  function drawGesture(i, p) {
    var g = GESTURES[i];
    var r = panelRect(i);
    var pts = g.pts;
    var n = pts.length;
    var total = n - 1;
    var f = p * total;
    var full = Math.floor(f);
    var frac = f - full;
    var w0 = clamp(r.w * 0.05, 1.2, 3);
    var w1 = w0 * 0.55;
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var s, x0, y0, x1, y1;
    for (s = 0; s < full; s++) {
      x0 = r.x + pts[s][0] * r.w; y0 = r.y + pts[s][1] * r.h;
      x1 = r.x + pts[s + 1][0] * r.w; y1 = r.y + pts[s + 1][1] * r.h;
      ctx.lineWidth = lerp(w0, w1, s / total);
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }
    var hx, hy;
    if (frac > 0 && full < total) {
      x0 = r.x + pts[full][0] * r.w; y0 = r.y + pts[full][1] * r.h;
      x1 = r.x + pts[full + 1][0] * r.w; y1 = r.y + pts[full + 1][1] * r.h;
      hx = lerp(x0, x1, frac); hy = lerp(y0, y1, frac);
      ctx.lineWidth = lerp(w0, w1, full / total);
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(hx, hy);
      ctx.stroke();
    } else {
      hx = r.x + pts[n - 1][0] * r.w; hy = r.y + pts[n - 1][1] * r.h;
    }
    // Wet head while the gesture is still being drawn.
    if (p < 1) {
      var hr = w0 * 0.9;
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.moveTo(hx + hr, hy);
      ctx.arc(hx, hy, hr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPanel(i, t, scale, emphasis) {
    var r = panelRect(i);
    var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    ctx.save();
    if (scale !== 1) {
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy);
    }
    // Panel border.
    ctx.strokeStyle = emphasis ? hexA(INK, 0.6) : BORDER;
    ctx.lineWidth = emphasis ? 1.5 : 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    // Constraint line: the faint midline no gesture ever crosses.
    ctx.strokeStyle = hexA(INK, 0.10);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(r.x + r.w / 2, r.y + 1);
    ctx.lineTo(r.x + r.w / 2, r.y + r.h - 1);
    ctx.stroke();
    // Ochre wash on the right half only, for finished studies, so the
    // left half stays bare cream forever.
    if (i < completed) {
      var wp = smooth(0, 0.5, t - completedAt[i]);
      if (wp > 0) {
        ctx.fillStyle = hexA(OCHRE, a4(0.13 * wp));
        ctx.fillRect(r.x + r.w / 2, r.y, r.w / 2, r.h);
      }
    }
    // Gesture: full for finished studies, partial while being drawn.
    var p = 0;
    if (i < completed) { p = 1; }
    else if (active && active.index === i) { p = clamp((t - active.t0) / DRAW_DUR, 0, 1); }
    if (p > 0) { drawGesture(i, p); }
    ctx.restore();
  }

  function draw(t) {
    now = t;
    var guard = 0;
    while (active && t - active.t0 >= DRAW_DUR && guard < 60) { completeActive(); guard++; }

    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // ---- Header: title left, count right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsTick = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('52 Studies for Right Hand', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.7);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1938 · 2007 · 05 · 03', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(completed + ' / 52 studies', W - 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.6);
    ctx.font = 'italic ' + fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(completed >= TOTAL ? 'the wall is complete' : 'right hand only', W - 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'left';
    ctx.strokeStyle = hexA(INK, 0.18);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(16, L.headerH + 2); ctx.lineTo(W - 16, L.headerH + 2);
    ctx.stroke();

    // ---- The wall: 52 panels, 13 by 4. The next empty panel is
    // drawn slightly enlarged with a darker border; a commissioned
    // panel scales up and shrinks into place as its gesture is drawn.
    // Both are drawn last so they sit above their neighbours.
    var ai = active ? active.index : -1;
    var ei = nextEmptyIndex();
    for (var i = 0; i < TOTAL; i++) {
      if (i === ai || i === ei) { continue; }
      drawPanel(i, t, 1, false);
    }
    if (ei >= 0 && ei !== ai) { drawPanel(ei, t, 1.05, true); }
    if (active) {
      var s = 1 + 0.22 * (1 - smooth(0, 0.9, t - active.t0));
      drawPanel(active.index, t, s, false);
    }

    // ---- Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fsTick * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(completed >= TOTAL ? 'The wall is complete. Fifty-two studies, right hand only.' : 'Tap to commission the next study.', W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      commission();
      draw(now);
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(now); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(now); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: gestures draw over 1.2 s and panels shrink into place
  // over 0.9 s; all motion is slow, well under the 14 Hz ceiling.
  // Guarded so node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (nowMs) {
      var t = FIRST_T + (nowMs - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  // QA probe hook: tap(), advance(dt), state(), violations().
  try {
    window.__probe1938 = {
      tap: function () { return commission(); },
      advance: function (dt) { now += dt; draw(now); },
      state: function () {
        return { completed: completed, active: active ? active.index : -1, pending: pending, nextEmpty: nextEmptyIndex() };
      },
      violations: function () {
        var bad = [];
        for (var i = 0; i < TOTAL; i++) {
          var r = panelRect(i);
          var midX = r.x + r.w / 2;
          var pts = GESTURES[i].pts;
          for (var k = 0; k < pts.length; k++) {
            var ax = r.x + pts[k][0] * r.w;
            if (ax < midX - 0.5) { bad.push({ panel: i, point: k, x: ax, midX: midX }); }
          }
        }
        return bad;
      }
    };
  } catch (e) {}
})();
</script>
</body>
</html>
