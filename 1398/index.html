<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balloon Speaker</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0c0a09; }
  canvas { display: block; background: #0c0a09; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // Seeded PRNG (mulberry32). Seed 1398000 + index*7919. Never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1398000);
  // Seeded hotspot motifs: positions + motif kind (0 star, 1 ring, 2 hand).
  var hotspots = [];
  for (var i = 0; i < 3; i++) {
    hotspots.push({ x: 0.22 + 0.56 * rnd(), y: 0.24 + 0.52 * rnd(), kind: i });
  }
  // Seeded grain dots (positions fixed; visibility keyed by quantized time).
  var grain = [];
  for (var g = 0; g < 140; g++) {
    grain.push({ x: rnd(), y: rnd(), s: 1 + Math.floor(rnd() * 2) });
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function viewport() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1280; h = 900; }
    return { w: w, h: h };
  }
  var W = 1280, H = 900;
  function sizeCanvas() {
    var v = viewport();
    W = v.w; H = v.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  sizeCanvas();

  // Recorded interaction state (closed-form functions of these + t, never
  // frame-integrated simulation).
  var dragActive = false, dragX = 0, dragY = 0;
  var relT = -1e9, relOffX = 0, relOffY = 0; // drag release: offset decays back to drift
  var held = false, holdStart = 0;
  var relDepth = 0, relDepthT = -1e9;

  function drift(t) {
    return {
      x: W * (0.5 + 0.30 * Math.sin(t * 0.17 + 1.3) * Math.cos(t * 0.043)),
      y: H * (0.5 + 0.30 * Math.sin(t * 0.13 + 0.6) * Math.cos(t * 0.061 + 2.0))
    };
  }
  function sourceAt(t) {
    if (dragActive) return { x: dragX, y: dragY };
    var d = drift(t);
    var w = Math.exp(-(t - relT) / 4);
    if (w < 0.001) w = 0;
    return { x: d.x + relOffX * w, y: d.y + relOffY * w };
  }
  function depthAt(t) {
    if (held) {
      var d = (t - holdStart) / 1.2;
      return d > 1 ? 1 : d;
    }
    var d2 = relDepth * Math.exp(-(t - relDepthT) / 0.8);
    return d2 < 0.001 ? 0 : d2;
  }
  // Bass pulse envelope: 2.6 s period, sharp attack, exponential decay.
  function bassEnv(t) {
    var ph = t - Math.floor(t / 2.6) * 2.6;
    return 0.25 + 0.75 * Math.exp(-ph / 0.55);
  }
  // Height field at normalized point (nx, ny), closed-form wavefronts.
  function heightAt(nx, ny, t) {
    var s = sourceAt(t);
    var diag = Math.sqrt(W * W + H * H);
    var px = nx * W, py = ny * H;
    var dx = px - s.x, dy = py - s.y;
    var r = Math.sqrt(dx * dx + dy * dy) / diag;
    var depth = depthAt(t);
    var A = (0.55 + 0.45 * bassEnv(t)) * (1 + 1.7 * depth);
    var w1 = Math.sin(2 * Math.PI * (r * 3.2) - 2 * Math.PI * t / 1.3) * Math.exp(-r * 2.6);
    var dx2 = px - (W - s.x), dy2 = py - (H - s.y);
    var r2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) / diag;
    var w2 = 0.35 * Math.sin(2 * Math.PI * (r2 * 3.2) - 2 * Math.PI * t / 1.3 + 1.7) * Math.exp(-r2 * 2.6);
    return A * (w1 + w2);
  }
  function mix(a, b, f) {
    return [Math.round(a[0] + (b[0] - a[0]) * f),
            Math.round(a[1] + (b[1] - a[1]) * f),
            Math.round(a[2] + (b[2] - a[2]) * f)];
  }
  var SHADOW = [42, 30, 26], LATEX = [216, 184, 168], GOLD = [245, 197, 66], VOID = [12, 10, 9];
  function rgb(c, a) {
    // Round alpha to 4 decimals: node-canvas misparses scientific-notation
    // alphas (e.g. 2.5e-15) as fully opaque.
    var al = Math.round(a * 10000) / 10000;
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + al + ')';
  }

  var COLS = 56, ROWS = 40;
  function draw(t) {
    sizeCanvas();
    ctx.fillStyle = '#0c0a09';
    ctx.fillRect(0, 0, W, H);
    var cw = W / COLS, ch = H / ROWS;
    for (var j = 0; j < ROWS; j++) {
      for (var i = 0; i < COLS; i++) {
        var nx = (i + 0.5) / COLS, ny = (j + 0.5) / ROWS;
        var v = heightAt(nx, ny, t) / 1.4; // approx [-1, 1]
        var col;
        if (v >= 0) {
          if (v < 0.55) col = mix(SHADOW, LATEX, v / 0.55);
          else col = mix(LATEX, GOLD, (v - 0.55) / 0.45);
        } else {
          col = mix(SHADOW, VOID, -v > 1 ? 1 : -v);
        }
        ctx.fillStyle = 'rgb(' + col[0] + ',' + col[1] + ',' + col[2] + ')';
        ctx.fillRect(i * cw, j * ch, cw + 0.5, ch + 0.5);
      }
    }
    // Motif stamps at interference hotspots: fleeting, never stable.
    for (var k = 0; k < hotspots.length; k++) {
      var hs = hotspots[k];
      var hv = heightAt(hs.x, hs.y, t) / 1.4;
      if (hv > 0.45) {
        var a = (hv - 0.45) / 0.55;
        if (a > 1) a = 1;
        var cx = hs.x * W, cy = hs.y * H;
        var R = Math.min(W, H) * 0.085;
        ctx.fillStyle = rgb(GOLD, a * 0.9);
        ctx.strokeStyle = rgb(GOLD, a * 0.9);
        ctx.lineWidth = 2;
        if (hs.kind === 0) {
          // Star: 5-point polygon.
          ctx.beginPath();
          for (var p = 0; p < 10; p++) {
            var ang = -Math.PI / 2 + p * Math.PI / 5;
            var rad = (p % 2 === 0) ? R : R * 0.45;
            var sx = cx + Math.cos(ang) * rad, sy = cy + Math.sin(ang) * rad;
            if (p === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
          ctx.closePath(); ctx.fill();
        } else if (hs.kind === 1) {
          // Ring.
          ctx.beginPath();
          ctx.arc(cx, cy, R * 0.8, 0, 2 * Math.PI);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx, cy, R * 0.35, 0, 2 * Math.PI);
          ctx.fill();
        } else {
          // Hand: palm rect + four finger rects + thumb rect.
          var fw = R * 0.22;
          ctx.fillRect(cx - R * 0.55, cy - R * 0.3, R * 1.1, R * 0.9);
          for (var f = 0; f < 4; f++) {
            ctx.fillRect(cx - R * 0.5 + f * fw * 1.15, cy - R * 1.05, fw, R * 0.8);
          }
          ctx.fillRect(cx + R * 0.55, cy - R * 0.1, R * 0.5, fw);
        }
      }
    }
    // Visible pulse metronome: small dot, bottom-left, breathing with bass.
    var ph = t - Math.floor(t / 2.6) * 2.6;
    var pulse = Math.exp(-ph / 0.55);
    ctx.fillStyle = rgb(GOLD, 0.25 + 0.75 * pulse);
    ctx.beginPath();
    ctx.arc(30, H - 30, 6 + 10 * pulse, 0, 2 * Math.PI);
    ctx.fill();
    // Analog grain: seeded dots keyed by quantized 0.5 s time.
    var q = Math.floor(t / 0.5);
    for (var d = 0; d < grain.length; d++) {
      var gd = grain[d];
      var on = ((gd.x * 1000 + q * 7 + d * 13) % 5) < 2;
      if (!on) continue;
      ctx.fillStyle = rgb(LATEX, 0.05);
      ctx.fillRect(gd.x * W, gd.y * H, gd.s, gd.s);
    }
  }

  // Audio: lazy, gesture-gated only. Never autoplay, fully visual without it.
  var actx = null, osc = null, ogain = null;
  function startHum() {
    if (typeof window === 'undefined' || typeof window.AudioContext === 'undefined') return;
    if (!actx) {
      try {
        actx = new window.AudioContext();
        osc = actx.createOscillator();
        ogain = actx.createGain();
        osc.type = 'sine'; osc.frequency.value = 55;
        ogain.gain.value = 0;
        osc.connect(ogain); ogain.connect(actx.destination);
        osc.start();
      } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
  }
  function stopHum() {
    if (osc) { try { osc.stop(); } catch (e) {} }
    osc = null; ogain = null; actx = null;
  }

  function onDown(e) {
    var p = e.touches ? e.touches[0] : e;
    dragActive = true; held = true;
    dragX = p.clientX; dragY = p.clientY; holdStart = nowT;
    startHum();
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragActive) return;
    var p = e.touches ? e.touches[0] : e;
    dragX = p.clientX; dragY = p.clientY;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!dragActive) return;
    dragActive = false; held = false;
    var d = drift(nowT);
    relT = nowT; relOffX = dragX - d.x; relOffY = dragY - d.y;
    var hd = (nowT - holdStart) / 1.2; if (hd > 1) hd = 1;
    relDepth = hd; relDepthT = nowT;
    stopHum();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown);
    canvas.addEventListener('touchmove', onMove);
    canvas.addEventListener('touchend', onUp);
  }
  function onResize() { draw(nowT); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }

  // Deterministic first frame: boot flag, draw(0) synchronously at load.
  var nowT = 0;
  var booted = false;
  draw(0);
  booted = true;
  var t0 = null;
  function loop(ts) {
    if (t0 === null) t0 = ts / 1000;
    nowT = ts / 1000 - t0;
    if (ogain) { try { ogain.gain.value = 0.04 + 0.06 * depthAt(nowT); } catch (e) {} }
    draw(nowT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
