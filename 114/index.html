<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№114 · Threadbands</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EDE4; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(26,21,18,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to stir the threads</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function qseed(){ const m=(window.location&&window.location.search||'').match(/seed=(\d+)/); return m?parseInt(m[1],10):null; }
function hexRgb(hx){ return [parseInt(hx.slice(1,3),16), parseInt(hx.slice(3,5),16), parseInt(hx.slice(5,7),16)]; }
function mixc(c1,c2,f){ return [Math.round(c1[0]+(c2[0]-c1[0])*f), Math.round(c1[1]+(c2[1]-c1[1])*f), Math.round(c1[2]+(c2[2]-c1[2])*f)]; }
function css(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

// No.114 Threadbands: 7 diagonal bands at 35 degrees on warm paper; each holds 170
// jittered points joined to their 3 nearest neighbours; colour runs along the diagonal.
const SEED=qseed()||114114;
const NB=7, NP=700;
const D=[Math.cos(-0.6109), Math.sin(-0.6109)]; // band axis, bottom-left to top-right
const N=[-D[1], D[0]];
const RAMP=['#C1440E','#D9042B','#A4137A','#5E2B97','#1F2A6B'].map(hexRgb);
const BUCKETS=28, bucketCss=[];
for(let b=0;b<BUCKETS;b++){ const pos=(b/(BUCKETS-1))*4; const k=Math.min(3,Math.floor(pos)); bucketCss.push(css(mixc(RAMP[k],RAMP[k+1],pos-k),1)); }
let field=null, dragging=false, ptrX=0, ptrY=0, stirAmp=0, lastMs=null;
function buildField(w,h){
  const rand=mulberry(SEED);
  let smin=1e9,smax=-1e9,umin=1e9,umax=-1e9;
  for(const [cx,cy] of [[0,0],[w,0],[0,h],[w,h]]){ const s=N[0]*cx+N[1]*cy, u=D[0]*cx+D[1]*cy; if(s<smin)smin=s; if(s>smax)smax=s; if(u<umin)umin=u; if(u>umax)umax=u; }
  const span=smax-smin, pitch=span/NB, hw=pitch*0.36;
  const uext=(umax-umin)*0.04; umin-=uext; umax+=uext;
  const bands=[];
  for(let b=0;b<NB;b++){
    const sc=smin+pitch*(b+0.5), bandT=b/(NB-1), pts=[];
    for(let i=0;i<NP;i++){
      const u=umin+rand()*(umax-umin);
      const v=(rand()*2-1)*hw;
      pts.push({ x:D[0]*u+N[0]*(sc+v), y:D[1]*u+N[1]*(sc+v), ph1:rand()*Math.PI*2, ph2:rand()*Math.PI*2, uT:(u-umin)/(umax-umin), jit:rand(), nb:[] });
    }
    for(let i=0;i<NP;i++){ const d2=[]; for(let j=0;j<NP;j++){ if(j!==i){ const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y; d2.push([dx*dx+dy*dy,j]); } } d2.sort((a,b2)=>a[0]-b2[0]); pts[i].nb=[d2[0][1],d2[1][1],d2[2][1]]; }
    bands.push({ pts:pts, bandT:bandT });
  }
  return { w:w, h:h, bands:bands };
}
function posOf(p,t){
  let x=p.x + N[0]*Math.sin(t*0.35+p.ph1)*3.2 + D[0]*Math.cos(t*0.27+p.ph2)*3.2;
  let y=p.y + N[1]*Math.sin(t*0.35+p.ph1)*3.2 + D[1]*Math.cos(t*0.27+p.ph2)*3.2;
  if(stirAmp>0.003){
    const dx=x-ptrX, dy=y-ptrY, d=Math.sqrt(dx*dx+dy*dy);
    if(d<150&&d>1){ const fall=(1-d/150)*stirAmp; const push=Math.sin(d*0.045-t*7)*10*fall; x+=dx/d*push; y+=dy/d*push; }
  }
  return [x,y];
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0.016; if(lastMs!==null) dt=clamp((nowMs-lastMs)/1000,0.001,0.05); lastMs=nowMs;
  if(!field||field.w!==w||field.h!==h) field=buildField(w,h);
  const t=nowMs/1000;
  stirAmp+= ((dragging?1:0)-stirAmp)*(1-Math.exp(-dt*(dragging?6:1.6)));
  ctx.fillStyle='#F2EDE4'; ctx.fillRect(0,0,w,h);
  ctx.lineWidth=1; ctx.globalAlpha=0.38;
  const paths=[]; for(let b=0;b<BUCKETS;b++) paths.push([]);
  for(const band of field.bands){
    const pos=band.pts.map(p=>posOf(p,t));
    for(let i=0;i<band.pts.length;i++){
      const p=band.pts[i];
      const ct=clamp(0.55*band.bandT+0.45*p.uT+(p.jit-0.5)*0.08,0,1);
      const arr=paths[Math.round(ct*(BUCKETS-1))];
      for(const j of p.nb){ arr.push(pos[i][0],pos[i][1],pos[j][0],pos[j][1]); }
    }
  }
  for(let b=0;b<BUCKETS;b++){ const arr=paths[b]; if(!arr.length) continue; ctx.strokeStyle=bucketCss[b]; ctx.beginPath(); for(let i=0;i<arr.length;i+=4){ ctx.moveTo(arr[i],arr[i+1]); ctx.lineTo(arr[i+2],arr[i+3]); } ctx.stroke(); }
  ctx.globalAlpha=1;
  if(field.bands.length!==NB) console.assert(false,'bands',NB);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; ptrX=e.clientX; ptrY=e.clientY; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; ptrX=e.clientX; ptrY=e.clientY; });
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
