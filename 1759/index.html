<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Words of Concern</title>
<style>
html, body { margin: 0; padding: 0; background: #F7F4EE; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F7F4EE';
var GRAPHITE = [90, 90, 88];
var RUST = [168, 91, 63];
var INK = '#1B1B1B';
var PLATE = '#EFEAE0';
var PLATE_LINE = 'rgba(90,90,88,0.4)';
var TITLE_INK = '#1B1B1B';
var HINT_INK = '#5A5A58';
var FRAME_T = 60.0;
var CYCLE = 120.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smoothstep(a, b, x) {
  var u = clamp((x - a) / (b - a), 0, 1);
  return u * u * (3 - 2 * u);
}
function mix(a, b, u) { return a + (b - a) * u; }
function rgbaMix(c1, c2, u, a) {
  var r = Math.round(mix(c1[0], c2[0], u));
  var g = Math.round(mix(c1[1], c2[1], u));
  var b = Math.round(mix(c1[2], c2[2], u));
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- driver: short abstract fragments drift like slow tape loops.
   Each fragment circles its own small orbit on an incommensurate
   period; the crowd phase masses them toward the middle, then they
   drop out one at a time in a fixed order until a single voice
   remains, and the cycle begins again. ---- */
var SQ2 = Math.sqrt(2), SQ3 = Math.sqrt(3), SQ5 = Math.sqrt(5), SQ7 = Math.sqrt(7);
var CROWD_X = 0.50, CROWD_Y = 0.46;
/* x, y: orbit centre (fraction of frame); r: orbit radius (fraction
   of min(VW,VH)); p: orbit period in seconds (irrational ratios, so
   the crowd density never repeats); ph: orbit phase; fs: relative
   font size; ox, oy: crowd-cluster offset (fraction of min(VW,VH)). */
var FRAGMENTS = [
  { text: 'the room', x: 0.16, y: 0.24, r: 0.045, p: 7.3 * SQ2, ph: 0.4, fs: 1.00, ox: -0.11, oy: -0.07 },
  { text: 'a little', x: 0.30, y: 0.70, r: 0.038, p: 5.9 * SQ3, ph: 2.1, fs: 0.90, ox: 0.09, oy: -0.08 },
  { text: 'not yet', x: 0.44, y: 0.28, r: 0.052, p: 8.1 * SQ5, ph: 4.0, fs: 1.10, ox: -0.06, oy: 0.09 },
  { text: 'listen', x: 0.58, y: 0.74, r: 0.040, p: 6.7 * SQ7, ph: 1.2, fs: 1.05, ox: 0.01, oy: 0.01 },
  { text: 'again', x: 0.72, y: 0.26, r: 0.048, p: 9.4 * SQ2, ph: 3.3, fs: 0.95, ox: 0.12, oy: 0.04 },
  { text: 'slowly', x: 0.84, y: 0.58, r: 0.036, p: 5.3 * SQ5, ph: 5.1, fs: 0.90, ox: 0.04, oy: -0.11 },
  { text: 'hold on', x: 0.24, y: 0.48, r: 0.042, p: 7.9 * SQ3, ph: 0.8, fs: 1.00, ox: 0.10, oy: 0.08 },
  { text: 'almost', x: 0.62, y: 0.48, r: 0.034, p: 6.1 * SQ7, ph: 2.7, fs: 0.90, ox: -0.09, oy: 0.10 },
  { text: 'a door', x: 0.38, y: 0.82, r: 0.046, p: 8.7 * SQ2, ph: 4.6, fs: 0.95, ox: -0.02, oy: -0.12 },
  { text: 'the light', x: 0.88, y: 0.80, r: 0.039, p: 5.7 * SQ3, ph: 1.9, fs: 1.00, ox: 0.07, oy: 0.11 }
];
/* Dropout order: fixed sequence, one voice every 2.9 s from t = 85.
   Fragment 3 ("listen") never drops; it is the final voice. */
var DROP_ORDER = [0, 5, 2, 7, 1, 9, 4, 8, 6];
var DROP_START = 85.0, DROP_STEP = 2.9, DROP_LEN = 2.4;
var HOLD_END = 116.0, RESEED_END = 120.0;
var FINAL_INDEX = 3;
function cycleT(t) {
  var c = t % CYCLE;
  return c < 0 ? c + CYCLE : c;
}
/* Crowd envelope: 0 while drifting, ramps 45-70 s, holds to 85 s,
   thins as voices drop out, near 0 during the final hold. */
function crowdEnv(t) {
  var c = cycleT(t);
  if (c < 45) return 0;
  if (c < 70) return smoothstep(45, 70, c);
  if (c < DROP_START) return 1;
  var dropped = 0, k;
  for (k = 0; k < DROP_ORDER.length; k++) {
    if (c >= DROP_START + k * DROP_STEP + DROP_LEN) dropped++;
  }
  if (c < HOLD_END) return 1 - (dropped / DROP_ORDER.length) * 0.85;
  return 0;
}
/* Per-fragment visibility: 1 while present, fading to 0 across its
   dropout window, 0 while gone, fading back in during the reseed. */
function fragAlpha(f, t) {
  var c = cycleT(t);
  var di = DROP_ORDER.indexOf(f);
  if (di >= 0) {
    var ds = DROP_START + di * DROP_STEP;
    if (c >= ds + DROP_LEN && c < HOLD_END) return 0;
    if (c >= ds && c < ds + DROP_LEN) return 1 - (c - ds) / DROP_LEN;
  }
  if (c >= HOLD_END) {
    if (f === FINAL_INDEX) return 1; /* the final voice never left */
    var rs = HOLD_END + f * 0.35;
    if (c < rs) return 0;
    return smoothstep(rs, rs + 1.5, c);
  }
  return 1;
}
function fragPos(f, t, crowd) {
  var s = Math.min(VW, VH);
  var a = TAU * (t / FRAGMENTS[f].p) + FRAGMENTS[f].ph;
  var ox = FRAGMENTS[f].x * VW + Math.cos(a) * FRAGMENTS[f].r * s;
  var oy = FRAGMENTS[f].y * VH + Math.sin(a) * FRAGMENTS[f].r * s * 0.8;
  var cx = CROWD_X * VW + FRAGMENTS[f].ox * s;
  var cy = CROWD_Y * VH + FRAGMENTS[f].oy * s;
  return { x: mix(ox, cx, crowd), y: mix(oy, cy, crowd) };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Words of Concern').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Words of Concern').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 05').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Words of Concern', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 05', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var s = Math.min(VW, VH);
  var t = phaseT;
  var crowd = crowdEnv(t);
  var c = cycleT(t);
  var basePx = clamp(0.02 * s, 12, 22);
  var i, f;
  /* faint orbit traces: the loops stay put while the words travel */
  for (i = 0; i < FRAGMENTS.length; i++) {
    f = FRAGMENTS[i];
    ctx.strokeStyle = 'rgba(90,90,88,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(f.x * VW + f.r * s, f.y * VH);
    ctx.ellipse(f.x * VW, f.y * VH, f.r * s, f.r * s * 0.8, 0, 0, TAU);
    ctx.stroke();
  }
  /* fragments */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (i = 0; i < FRAGMENTS.length; i++) {
    f = FRAGMENTS[i];
    var vis = fragAlpha(i, t);
    if (vis <= 0.001) continue;
    var p = fragPos(i, t, crowd);
    var alpha = (0.50 + 0.35 * crowd) * vis;
    var warm = crowd;
    if (i === FINAL_INDEX && c >= DROP_START + 8 * DROP_STEP + DROP_LEN && c < HOLD_END) {
      /* final voice alone: deep ink black, full strength */
      ctx.fillStyle = 'rgba(27,27,27,' + (1.0 * vis).toFixed(4) + ')';
    } else {
      ctx.fillStyle = rgbaMix(GRAPHITE, RUST, warm, alpha);
    }
    ctx.font = Math.round(basePx * f.fs) + 'px sans-serif';
    ctx.fillText(f.text, p.x, p.y);
  }
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    fragmentCount: function () { return FRAGMENTS.length; },
    crowdEnv: function (t) { return crowdEnv(t); },
    fragAlpha: function (i, t) { return fragAlpha(i, t); },
    fragPos: function (i, t) { var p = fragPos(i, t, crowdEnv(t)); return [p.x, p.y]; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, crowd partway formed ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
