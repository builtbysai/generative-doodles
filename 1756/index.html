<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Speakers Are the Piece</title>
<style>
html, body { margin: 0; padding: 0; background: #2E1B14; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#2E1B14';
var CONE = '#C89A68';
var CONE_LIGHT = '#DDB27E';
var CONE_DARK = '#9C7046';
var RIM = '#5F3D24';
var RING = '#7A5233';
var CAP = '#8A5E38';
var CORD = '#C7A97B';
var CORD_FAINT = 'rgba(199,169,123,0.55)';
var GLOW = 'rgba(255,178,92,0.16)';
var PLATE = '#E9DCC4';
var PLATE_LINE = 'rgba(122,82,51,0.7)';
var TITLE_INK = '#2E2417';
var HINT_INK = '#6B5636';
var FRAME_T = 60.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1756);
var phaseT = FRAME_T;
/* ---- drivers: one large anchor low and central, seven smaller ones
   scattered at staggered heights like a hanging constellation.
   Each driver carries two irrational shudder periods and one slow
   sway period, all closed-form functions of piece time. ---- */
var SQ2 = Math.sqrt(2), SQ3 = Math.sqrt(3), SQ5 = Math.sqrt(5), SQ7 = Math.sqrt(7);
var DRIVERS = [
  { x: 0.50, y: 0.70, r: 0.115, p1: 0.91 * SQ2, p2: 0.91 * SQ3, ps: 23.7, ph1: 0.4, ph2: 2.1, phs: 0.9, depth: 1.00, anchor: true },
  { x: 0.16, y: 0.30, r: 0.058, p1: 0.77 * SQ3, p2: 0.77 * SQ5, ps: 19.3, ph1: 1.7, ph2: 0.3, phs: 2.4, depth: 0.62, anchor: false },
  { x: 0.30, y: 0.52, r: 0.066, p1: 0.83 * SQ5, p2: 0.83 * SQ2, ps: 27.1, ph1: 3.1, ph2: 1.2, phs: 4.0, depth: 0.78, anchor: false },
  { x: 0.38, y: 0.20, r: 0.050, p1: 0.69 * SQ7, p2: 0.69 * SQ3, ps: 21.9, ph1: 5.0, ph2: 2.8, phs: 1.1, depth: 0.55, anchor: false },
  { x: 0.63, y: 0.34, r: 0.062, p1: 0.88 * SQ2, p2: 0.88 * SQ7, ps: 25.5, ph1: 0.9, ph2: 4.4, phs: 3.3, depth: 0.85, anchor: false },
  { x: 0.73, y: 0.55, r: 0.054, p1: 0.74 * SQ5, p2: 0.74 * SQ2, ps: 17.3, ph1: 2.6, ph2: 5.5, phs: 0.2, depth: 0.70, anchor: false },
  { x: 0.85, y: 0.27, r: 0.060, p1: 0.80 * SQ3, p2: 0.80 * SQ7, ps: 29.7, ph1: 4.2, ph2: 0.7, phs: 5.1, depth: 0.58, anchor: false },
  { x: 0.66, y: 0.14, r: 0.044, p1: 0.66 * SQ7, p2: 0.66 * SQ5, ps: 31.1, ph1: 1.1, ph2: 3.6, phs: 2.9, depth: 0.48, anchor: false }
];
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function driverXY(d, t) {
  var s = Math.min(VW, VH);
  var sway = Math.sin(TAU * (t / d.ps) + d.phs) * s * 0.012;
  return { cx: d.x * VW + sway, cy: d.y * VH, r: d.r * s, sway: sway };
}
function shudder(d, t) {
  var s1 = Math.sin(TAU * (t / d.p1) + d.ph1);
  var s2 = Math.sin(TAU * (t / d.p2) + d.ph2);
  return { s1: s1, s2: s2, mem: 1 + 0.055 * d.depth * s1 + 0.038 * d.depth * s2,
           dx: 0.028 * d.depth * s2, dy: 0.034 * d.depth * s1 };
}
function drawCord(d, t) {
  var p = driverXY(d, t);
  var s = Math.min(VW, VH);
  var topX = d.x * VW;
  var bend = p.sway * 1.6;
  ctx.strokeStyle = CORD_FAINT;
  ctx.lineWidth = Math.max(s * 0.0016, 0.8);
  ctx.beginPath();
  ctx.moveTo(topX, 0);
  ctx.quadraticCurveTo(topX + bend, p.cy * 0.5, p.cx, p.cy - p.r);
  ctx.stroke();
  /* tiny knot where the cord meets the driver rim */
  ctx.fillStyle = CORD;
  ctx.beginPath();
  ctx.moveTo(p.cx + 2.5, p.cy - p.r);
  ctx.arc(p.cx, p.cy - p.r, 2.5, 0, TAU);
  ctx.fill();
}
function drawGlow(t) {
  var a = DRIVERS[0];
  var p = driverXY(a, t);
  var s = Math.min(VW, VH);
  var sh = shudder(a, t);
  var pulse = 0.75 + 0.25 * sh.s1;
  var gx = p.cx, gy = p.cy + p.r * 1.55, gr = p.r * 2.1;
  var grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
  grad.addColorStop(0, 'rgba(255,178,92,' + (0.16 * pulse).toFixed(4) + ')');
  grad.addColorStop(0.55, 'rgba(255,178,92,' + (0.06 * pulse).toFixed(4) + ')');
  grad.addColorStop(1, 'rgba(255,178,92,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(gx + gr, gy);
  ctx.arc(gx, gy, gr, 0, TAU);
  ctx.fill();
}
function drawDriver(d, t) {
  var p = driverXY(d, t);
  var sh = shudder(d, t);
  var cx = p.cx + sh.dx * p.r, cy = p.cy + sh.dy * p.r, r = p.r;
  var s = Math.min(VW, VH);
  /* soft shadow under the driver */
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.9, cy + r * 0.95);
  ctx.ellipse(cx, cy + r * 0.92, r * 0.92, r * 0.30, 0, 0, TAU);
  ctx.fill();
  /* bare cone: radial gradient, warm paper brown, no cabinet */
  var grad = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.3, r * 0.1, cx, cy, r);
  grad.addColorStop(0, CONE_LIGHT);
  grad.addColorStop(0.6, CONE);
  grad.addColorStop(1, CONE_DARK);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fill();
  /* outer rim */
  ctx.strokeStyle = RIM;
  ctx.lineWidth = Math.max(s * 0.004, 1.5);
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r - ctx.lineWidth / 2, 0, TAU);
  ctx.stroke();
  /* concentric surround rings */
  var i;
  for (i = 1; i <= 2; i++) {
    var rr = r * (0.86 - 0.14 * (i - 1));
    ctx.strokeStyle = rgba(RING, 0.55);
    ctx.lineWidth = Math.max(s * 0.002, 0.8);
    ctx.beginPath();
    ctx.moveTo(cx + rr, cy);
    ctx.arc(cx, cy, rr, 0, TAU);
    ctx.stroke();
  }
  /* shuddering membrane: ellipse breathing on the per-driver sine pair */
  var mr = r * 0.62 * sh.mem;
  var mgrad = ctx.createRadialGradient(cx - mr * 0.2, cy - mr * 0.25, mr * 0.1, cx, cy, mr);
  mgrad.addColorStop(0, CONE_LIGHT);
  mgrad.addColorStop(1, CONE);
  ctx.fillStyle = mgrad;
  ctx.beginPath();
  ctx.moveTo(cx + mr, cy);
  ctx.ellipse(cx, cy, mr, mr * (0.94 + 0.05 * sh.s2), 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(RING, 0.6);
  ctx.lineWidth = Math.max(s * 0.0018, 0.7);
  ctx.beginPath();
  ctx.moveTo(cx + mr, cy);
  ctx.ellipse(cx, cy, mr, mr * (0.94 + 0.05 * sh.s2), 0, 0, TAU);
  ctx.stroke();
  /* dust cap */
  var cr = r * 0.22 * (1 + 0.05 * sh.s1);
  ctx.fillStyle = CAP;
  ctx.beginPath();
  ctx.moveTo(cx + cr, cy);
  ctx.arc(cx, cy, cr, 0, TAU);
  ctx.fill();
  ctx.fillStyle = rgba(CONE_LIGHT, 0.5);
  ctx.beginPath();
  ctx.moveTo(cx + cr * 0.5, cy - cr * 0.4);
  ctx.arc(cx - cr * 0.15, cy - cr * 0.2, cr * 0.45, 0, TAU);
  ctx.fill();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Speakers Are the Piece').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Speakers Are the Piece').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 02').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Speakers Are the Piece', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 02', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var i;
  for (i = 0; i < DRIVERS.length; i++) drawCord(DRIVERS[i], phaseT);
  drawGlow(phaseT);
  for (i = 0; i < DRIVERS.length; i++) drawDriver(DRIVERS[i], phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    driverCount: function () { return DRIVERS.length; },
    driverXY: function (i, t) { var p = driverXY(DRIVERS[i], t); return [p.cx, p.cy, p.r]; },
    shudder: function (i, t) { return shudder(DRIVERS[i], t); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, full constellation ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
