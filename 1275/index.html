<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kala Pani</title>
<style>
html, body { margin: 0; padding: 0; background: #171310; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, PHONE = false;
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;

  function hash(n) {
    var h = (n * 2654435761) >>> 0;
    h ^= h >>> 13;
    h = (h * 1274126177) >>> 0;
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(a, b, x) {
    var t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function size() {
    var vw = (window.visualViewport && window.visualViewport.width) ? window.visualViewport.width : window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    var sw = (window.screen && window.screen.width) ? window.screen.width : W;
    var sh = (window.screen && window.screen.height) ? window.screen.height : H;
    PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  }
  size();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { size(); build(); draw(now()); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { size(); build(); draw(now()); });
  }

  function now() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - T0) / 1000;
    return 0;
  }

  // Interaction state: closed-form over recorded events and t.
  var pointer = { x: -9999, y: -9999, t: -100 };
  var lastAct = 0;
  function pos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }
  canvas.addEventListener('pointerdown', function (e) { var p = pos(e); pointer.x = p.x; pointer.y = p.y; pointer.t = now(); lastAct = now(); });
  canvas.addEventListener('pointermove', function (e) { var p = pos(e); pointer.x = p.x; pointer.y = p.y; pointer.t = now(); lastAct = now(); });
  canvas.addEventListener('pointerup', function (e) { var p = pos(e); pointer.x = p.x; pointer.y = p.y; pointer.t = now(); lastAct = now(); });

  // ---- Geometry (rebuilt on resize; all seeded, no Math.random) ----
  var G = null;
  function bez(p0, p1, p2, p3, n) {
    n = n || 40;
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var t = i / n, u = 1 - t;
      var x, y;
      if (p3) {
        x = u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0];
        y = u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1];
      } else {
        x = u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0];
        y = u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1];
      }
      pts.push([x, y]);
    }
    return pts;
  }
  // Convert a polyline into thread dashes with per-dash jitter.
  function dashesFrom(pts, seed, dashLen, gap, col, width) {
    var out = [];
    var acc = 0, on = true, seg = 0, s = seed * 1000;
    for (var i = 1; i < pts.length; i++) {
      var ax = pts[i - 1][0], ay = pts[i - 1][1], bx = pts[i][0], by = pts[i][1];
      var d = Math.hypot(bx - ax, by - ay);
      var ux = d ? (bx - ax) / d : 0, uy = d ? (by - ay) / d : 0;
      var rem = d;
      while (rem > 0.01) {
        var need = (on ? dashLen : gap) - acc;
        var step = Math.min(need, rem);
        if (on) {
          var jx = (hash(s + seg * 3 + 1) - 0.5) * 1.6;
          var jy = (hash(s + seg * 3 + 2) - 0.5) * 1.6;
          out.push({ x1: ax + jx, y1: ay + jy, x2: ax + ux * step + jx, y2: ay + uy * step + jy, col: col, w: width, mx: ax + ux * step / 2, my: ay + uy * step / 2 });
          seg++;
        }
        acc += step; rem -= step; ax += ux * step; ay += uy * step;
        if (acc >= (on ? dashLen : gap) - 0.001) { on = !on; acc = 0; }
      }
    }
    return out;
  }

  function build() {
    var S = Math.min(W, H) * (PHONE ? 0.97 : 0.9);
    var ox = (W - S) / 2, oy = (H - S) / 2;
    var u = S / 100; // panel units: panel is 100x100
    function P(x, y) { return [ox + x * u, oy + y * u]; }

    // Engraving: invented architecture (arched colonnade + domed pavilion),
    // ornamental border, crosshatch shading fields. All original procedural work.
    var hatch = []; // {x1,y1,x2,y2,a}
    // Liang-Barsky segment clip against a rect; returns clipped segment or null.
    function clipSeg(x1, y1, x2, y2, rx0, ry0, rx1, ry1) {
      var dx = x2 - x1, dy = y2 - y1;
      var p = [-dx, dx, -dy, dy], q = [x1 - rx0, rx1 - x1, y1 - ry0, ry1 - y1];
      var t0 = 0, t1 = 1;
      for (var i = 0; i < 4; i++) {
        if (p[i] === 0) { if (q[i] < 0) return null; }
        else {
          var r = q[i] / p[i];
          if (p[i] < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
          else { if (r < t0) return null; if (r < t1) t1 = r; }
        }
      }
      return [x1 + t0 * dx, y1 + t0 * dy, x1 + t1 * dx, y1 + t1 * dy];
    }
    // hatchRect takes panel units and converts to pixels internally.
    function hatchRect(x0, y0, x1, y1, angle, spacingU, seed, alpha) {
      var a = P(x0, y0), b = P(x1, y1);
      var px0 = a[0], py0 = a[1], px1 = b[0], py1 = b[1];
      var spacing = spacingU * u;
      var cx = (px0 + px1) / 2, cy = (py0 + py1) / 2, r = Math.hypot(px1 - px0, py1 - py0) / 2 + 2;
      var ca = Math.cos(angle), sa = Math.sin(angle);
      var n = Math.floor((r * 2) / spacing);
      for (var i = -n; i <= n; i++) {
        var off = i * spacing + (hash(seed + i * 7) - 0.5) * spacing * 0.3;
        var px = -sa * off, py = ca * off;
        var x1l = cx + px - ca * r, y1l = cy + py - sa * r;
        var x2l = cx + px + ca * r, y2l = cy + py + sa * r;
        var c = clipSeg(x1l, y1l, x2l, y2l, px0, py0, px1, py1);
        if (c) hatch.push({ x1: c[0], y1: c[1], x2: c[2], y2: c[3], a: alpha });
      }
    }
    // Border: outer + inner rule lines (drawn directly), corner rosettes + diamonds.
    // Ornamental border motifs: repeating diamond + leaf along inner border.
    var motifs = [];
    var inset = 9;
    for (var i = 0; i < 14; i++) {
      var fx = inset + 3 + i * (100 - 2 * inset - 6) / 13;
      motifs.push({ x: fx, y: inset + 1.5, top: true });
      motifs.push({ x: fx, y: 100 - inset - 1.5, top: false });
    }
    for (var j = 0; j < 14; j++) {
      var fy = inset + 3 + j * (100 - 2 * inset - 6) / 13;
      motifs.push({ x: inset + 1.5, y: fy, side: true });
      motifs.push({ x: 100 - inset - 1.5, y: fy, side: true });
    }
    // Invented architecture: colonnade of three arches (left), domed pavilion (right),
    // shaded with crosshatch. Coordinates in panel units.
    hatchRect(14, 52, 40, 78, 0.6, 1.6, 11, 0.55);   // colonnade shadow
    hatchRect(14, 52, 40, 78, -0.6, 1.6, 23, 0.35);  // crosshatch second pass
    hatchRect(58, 48, 86, 80, 0.6, 1.8, 37, 0.5);    // pavilion shadow
    hatchRect(58, 48, 86, 80, -0.6, 1.8, 41, 0.3);
    hatchRect(20, 20, 80, 34, 0.5, 2.2, 53, 0.28);    // sky / upper shading
    var arch = [];
    // three arch outlines (colonnade)
    for (var a = 0; a < 3; a++) {
      var ax0 = 16 + a * 9, ax1 = ax0 + 7;
      arch.push({ x0: ax0, x1: ax1, yTop: 56, yBot: 78, dome: true });
    }
    // pavilion: dome + drum + columns
    var pav = { x0: 60, x1: 84, yTop: 50, yBot: 80 };

    // Embroidery: floral vines + female face, denser over the architecture.
    // Curves defined in panel units, then converted.
    var vineDefs = [
      { pts: bez([10, 96], [22, 74], [14, 60], [30, 44]), col: '#3F6B4F', w: 1.6 },
      { pts: bez([30, 44], [44, 52], [40, 68], [56, 78]), col: '#3F6B4F', w: 1.6 },
      { pts: bez([56, 78], [70, 66], [64, 52], [80, 44]), col: '#E8A020', w: 1.5 },
      { pts: bez([12, 88], [26, 82], [20, 66], [36, 58]), col: '#A4233B', w: 1.5 },
      { pts: bez([36, 58], [50, 62], [46, 76], [62, 84]), col: '#A4233B', w: 1.5 },
      { pts: bez([80, 44], [88, 56], [84, 70], [92, 84]), col: '#3F6B4F', w: 1.6 },
      { pts: bez([62, 84], [74, 88], [70, 94], [86, 94]), col: '#E8A020', w: 1.5 },
      { pts: bez([44, 52], [52, 40], [60, 44], [66, 34]), col: '#A4233B', w: 1.5 }
    ];
    // Face: closed oval outline + hair arc + brow + eye + lips, lower-center-right.
    var faceDefs = [
      { pts: bez([68, 76], [60, 72], [60, 60], [66, 52]), col: '#A4233B', w: 1.7 },
      { pts: bez([66, 52], [74, 52], [76, 60], [68, 76]), col: '#A4233B', w: 1.7 },
      { pts: bez([59, 62], [60, 48], [70, 44], [77, 52]), col: '#E8A020', w: 1.6 },
      { pts: bez([62, 59], [66, 58], [69, 58], [71, 59]), col: '#3F6B4F', w: 1.5 },
      { pts: bez([63, 62], [66, 62], [68, 62], [70, 62]), col: '#3F6B4F', w: 1.5 },
      { pts: bez([64, 70], [67, 71], [70, 71], [73, 70]), col: '#A4233B', w: 1.5 }
    ];
    var stitches = [];
    var order = 0;
    function addCurve(def, seed) {
      var px = def.pts.map(function (p) { return P(p[0], p[1]); });
      var ds = dashesFrom(px, seed, 2.6 * u * 0.32 + 4, 2.0 * u * 0.32 + 3, def.col, def.w * u * 0.32 + 0.8);
      for (var i = 0; i < ds.length; i++) { ds[i].ord = order++; stitches.push(ds[i]); }
    }
    vineDefs.forEach(function (d, i) { addCurve(d, 100 + i * 13); });
    faceDefs.forEach(function (d, i) { addCurve(d, 300 + i * 17); });
    // Dense stitch cluster over the colonnade (reclamation density).
    for (var c = 0; c < 5; c++) {
      var cx0 = 16 + c * 5;
      addCurve({ pts: bez([cx0, 78], [cx0 + 2, 66], [cx0 + 1, 58], [cx0 + 3, 52]), col: (c % 2 ? '#E8A020' : '#A4233B'), w: 1.5 }, 500 + c * 19);
    }
    // Leaves on vines: small lens shapes (own beginPath each; no batched ellipse).
    var leaves = [];
    for (var li = 0; li < 26; li++) {
      var v = vineDefs[li % vineDefs.length];
      var pt = v.pts[Math.floor(hash(700 + li * 31) * (v.pts.length - 1))];
      var p = P(pt[0], pt[1]);
      leaves.push({ x: p[0], y: p[1], r: (3.2 + hash(900 + li) * 2.4) * u * 0.32 + 2, a: hash(1000 + li) * Math.PI, col: (li % 3 === 0 ? '#E8A020' : '#3F6B4F'), ord: order++ });
    }
    // Faux-gem cluster, lower right.
    var gems = [];
    var gp = P(86, 86);
    for (var gi = 0; gi < 6; gi++) {
      gems.push({ x: gp[0] + (hash(1100 + gi * 7) - 0.5) * 7 * u, y: gp[1] + (hash(1200 + gi * 7) - 0.5) * 5 * u, r: (2.2 + hash(1300 + gi) * 1.4) * u * 0.32 + 1.5, ph: hash(1400 + gi) * 6.28 });
    }
    // Tea stains: flat alpha blotches on the paper.
    var stains = [];
    for (var si = 0; si < 5; si++) {
      var sp = P(15 + hash(1500 + si * 13) * 70, 12 + hash(1600 + si * 13) * 76);
      stains.push({ x: sp[0], y: sp[1], rx: (6 + hash(1700 + si) * 8) * u, ry: (4 + hash(1800 + si) * 6) * u, a: 0.05 + hash(1900 + si) * 0.04 });
    }

    G = { S: S, ox: ox, oy: oy, u: u, P: P, hatch: hatch, arch: arch, pav: pav, motifs: motifs, inset: inset, stitches: stitches, leaves: leaves, gems: gems, stains: stains };
  }
  build();

  function draw(t) {
    var g = G;
    ctx.fillStyle = '#171310';
    ctx.fillRect(0, 0, W, H);

    // Panel: aged paper.
    ctx.fillStyle = '#E5D6B0';
    ctx.fillRect(g.ox, g.oy, g.S, g.S);
    // Tea stains (flat alpha ellipses, own beginPath each).
    for (var si = 0; si < g.stains.length; si++) {
      var st = g.stains[si];
      ctx.beginPath();
      ctx.moveTo(st.x + st.rx, st.y);
      ctx.ellipse(st.x, st.y, st.rx, st.ry, 0.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(169,127,63,' + st.a.toFixed(3) + ')';
      ctx.fill();
    }

    // Stillness dim: after 6 s without pointer activity, engraving fades
    // toward 0.35, leaving the thread as the lasting image.
    var idle = t - lastAct;
    var dim = 1;
    if (idle > 6) dim = lerp(1, 0.35, smooth(6, 8, idle));
    // Engraving fade-in: from a faint impression at load to full by 2 s.
    var engA = (0.30 + 0.70 * smooth(0, 2, t)) * dim;

    ctx.save();
    ctx.globalAlpha = engA;
    ctx.strokeStyle = '#4A3B2A';
    ctx.lineWidth = Math.max(0.7, g.u * 0.22);
    // Border rules.
    ctx.beginPath();
    ctx.moveTo(g.ox + 4 * g.u, g.oy + 4 * g.u);
    ctx.lineTo(g.ox + g.S - 4 * g.u, g.oy + 4 * g.u);
    ctx.lineTo(g.ox + g.S - 4 * g.u, g.oy + g.S - 4 * g.u);
    ctx.lineTo(g.ox + 4 * g.u, g.oy + g.S - 4 * g.u);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(g.ox + 7 * g.u, g.oy + 7 * g.u);
    ctx.lineTo(g.ox + g.S - 7 * g.u, g.oy + 7 * g.u);
    ctx.lineTo(g.ox + g.S - 7 * g.u, g.oy + g.S - 7 * g.u);
    ctx.lineTo(g.ox + 7 * g.u, g.oy + g.S - 7 * g.u);
    ctx.closePath();
    ctx.stroke();
    // Border motifs: diamonds.
    for (var mi = 0; mi < g.motifs.length; mi++) {
      var m = g.motifs[mi];
      var mp = g.P(m.x, m.y);
      var r = 1.1 * g.u;
      ctx.beginPath();
      ctx.moveTo(mp[0], mp[1] - r);
      ctx.lineTo(mp[0] + r, mp[1]);
      ctx.lineTo(mp[0], mp[1] + r);
      ctx.lineTo(mp[0] - r, mp[1]);
      ctx.closePath();
      ctx.stroke();
    }
    // Corner rosettes: small paired-arc petals (own path each).
    var corners = [[9, 9], [91, 9], [9, 91], [91, 91]];
    for (var ci = 0; ci < 4; ci++) {
      var cp = g.P(corners[ci][0], corners[ci][1]);
      for (var pet = 0; pet < 6; pet++) {
        var ang = pet * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(cp[0] + Math.cos(ang) * 1.2 * g.u, cp[1] + Math.sin(ang) * 1.2 * g.u);
        ctx.arc(cp[0] + Math.cos(ang) * 2.0 * g.u, cp[1] + Math.sin(ang) * 2.0 * g.u, 0.9 * g.u, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    // Crosshatch fields.
    ctx.beginPath();
    for (var hi = 0; hi < g.hatch.length; hi++) {
      var h = g.hatch[hi];
      ctx.moveTo(h.x1, h.y1);
      ctx.lineTo(h.x2, h.y2);
    }
    ctx.globalAlpha = engA * 0.8;
    ctx.stroke();
    ctx.globalAlpha = engA;
    // Architecture outlines: colonnade arches + pavilion.
    for (var ai = 0; ai < g.arch.length; ai++) {
      var a = g.arch[ai];
      var p0 = g.P(a.x0, a.yBot), p1 = g.P(a.x1, a.yBot), pt = g.P((a.x0 + a.x1) / 2, a.yTop);
      ctx.beginPath();
      ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p0[0], pt[1] + 4 * g.u);
      ctx.quadraticCurveTo(pt[0], pt[1] - 2 * g.u, p1[0], pt[1] + 4 * g.u);
      ctx.lineTo(p1[0], p1[1]);
      ctx.stroke();
    }
    var pv = g.pav;
    var dp0 = g.P(pv.x0, pv.yBot), dp1 = g.P(pv.x1, pv.yBot), dpt = g.P((pv.x0 + pv.x1) / 2, pv.yTop);
    ctx.beginPath();
    ctx.moveTo(dp0[0], dp0[1]);
    ctx.lineTo(dp0[0], dpt[1] + 6 * g.u);
    ctx.moveTo(dp0[0], dpt[1] + 6 * g.u);
    ctx.quadraticCurveTo(dpt[0], dpt[1] - 3 * g.u, dp1[0], dpt[1] + 6 * g.u);
    ctx.lineTo(dp1[0], dp1[1]);
    ctx.stroke();
    ctx.restore();

    // Embroidery: stitches reveal progressively (closed-form in t).
    var prog = clamp(0.04 + t / 12, 0, 1);
    var visible = Math.floor(prog * g.stitches.length);
    // Lift: stitches near the pointer rise slightly, then settle (exponential decay).
    var liftT = t - pointer.t;
    var liftAmp = liftT < 0 ? 0 : Math.exp(-liftT / 0.8) * 4;
    ctx.lineCap = 'round';
    // Draw dashes grouped by color for fewer state changes; lift applied per dash.
    var byCol = {};
    for (var di = 0; di < visible; di++) {
      var d = g.stitches[di];
      var dx = d.mx - pointer.x, dy = d.my - pointer.y;
      var dist = Math.hypot(dx, dy);
      var fall = dist < 60 ? (1 - dist / 60) : 0;
      var lx = -liftAmp * fall * 0.4, ly = -liftAmp * fall;
      var key = d.col + '|' + d.w.toFixed(2);
      if (!byCol[key]) byCol[key] = [];
      byCol[key].push([d.x1 + lx, d.y1 + ly, d.x2 + lx, d.y2 + ly]);
    }
    for (var k in byCol) {
      var parts = k.split('|');
      ctx.strokeStyle = parts[0];
      ctx.lineWidth = parseFloat(parts[1]);
      ctx.beginPath();
      var arr = byCol[k];
      for (var bi = 0; bi < arr.length; bi++) {
        ctx.moveTo(arr[bi][0], arr[bi][1]);
        ctx.lineTo(arr[bi][2], arr[bi][3]);
      }
      ctx.stroke();
    }
    // Leaves (visible once their order is reached).
    for (var li2 = 0; li2 < g.leaves.length; li2++) {
      var lf = g.leaves[li2];
      if (lf.ord > visible) continue;
      var dx2 = lf.x - pointer.x, dy2 = lf.y - pointer.y;
      var dist2 = Math.hypot(dx2, dy2);
      var fall2 = dist2 < 60 ? (1 - dist2 / 60) : 0;
      var ly2 = -liftAmp * fall2;
      ctx.beginPath();
      ctx.moveTo(lf.x - lf.r + 0, lf.y + ly2);
      ctx.quadraticCurveTo(lf.x, lf.y - lf.r * 0.7 + ly2, lf.x + lf.r, lf.y + ly2);
      ctx.quadraticCurveTo(lf.x, lf.y + lf.r * 0.7 + ly2, lf.x - lf.r, lf.y + ly2);
      ctx.fillStyle = lf.col;
      ctx.fill();
    }
    // Faux gems: small diamonds with a slow shimmer (closed-form sine in t).
    for (var gi2 = 0; gi2 < g.gems.length; gi2++) {
      var gm = g.gems[gi2];
      var sh = 0.55 + 0.45 * Math.sin(t * 0.9 + gm.ph);
      ctx.beginPath();
      ctx.moveTo(gm.x, gm.y - gm.r);
      ctx.lineTo(gm.x + gm.r * 0.7, gm.y);
      ctx.lineTo(gm.x, gm.y + gm.r);
      ctx.lineTo(gm.x - gm.r * 0.7, gm.y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(127,196,196,' + (0.35 + 0.55 * sh).toFixed(3) + ')';
      ctx.fill();
      ctx.strokeStyle = '#4A3B2A';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // Boot flag (determinism, №343 rule): the synchronous first frame draws at
  // exactly t = 0, never from performance.now() elapsed time, so the thumb is
  // byte-identical on every render. The clock starts with the rAF loop below.
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    (function loop() {
      draw(now());
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
