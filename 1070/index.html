<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audience, in Reverse</title>
<style>
  html, body { margin: 0; padding: 0; background: #08080A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var STAGE = '#08080A';
  var LIVE = '#7FD4FF';
  var GHOST_PLAY = '#FFB3C8';
  var FIGURE = '#1C1E24';
  var RECORD_SECONDS = 30;
  var TAU = Math.PI * 2;

  var W = 720;
  var H = 720;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : ((typeof window !== 'undefined' && window.innerWidth) || 720);
    H = vv ? vv.height : ((typeof window !== 'undefined' && window.innerHeight) || 720);
    canvas.width = W;
    canvas.height = H;
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  resize();

  function isPhone() {
    var smallest = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      smallest = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return smallest < 700 || H > W * 1.15;
  }

  function stageRect() {
    var side = Math.min(W, H) * (isPhone() ? 0.965 : 0.94);
    return {
      x: (W - side) / 2,
      y: (H - side) / 2,
      side: side
    };
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function dist(x1, y1, x2, y2) {
    var dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Piece clock. The first frame is drawn separately at a fixed state and
  // does not consult this clock.
  var clockEpochMs = null;
  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  }
  function pieceTime() {
    var ms = nowMs();
    if (clockEpochMs === null) clockEpochMs = ms;
    return Math.max(0, (ms - clockEpochMs) / 1000);
  }
  function pieceTimeFromRaf(ms) {
    if (clockEpochMs === null) clockEpochMs = ms;
    return Math.max(0, (ms - clockEpochMs) / 1000);
  }

  // Recorded performance state. Strokes contain only visitor samples.
  var mode = 'ready'; // ready, record, playback
  var strokes = [];
  var activeStroke = null;
  var activePointer = null;
  var recordStartT = 0;
  var playbackStartT = 0;
  var playbackDuration = 0;
  var seedCycle = 0;
  var pendingTap = null;
  var armedDoubleTap = false;
  var lastPointerTapT = -10;

  function recordElapsed(t) {
    return clamp(t - recordStartT, 0, RECORD_SECONDS);
  }

  function strokeToneBase(stroke) {
    return 148 + (seedCycle % 5) * 18 + (stroke.index % 4) * 24;
  }

  function makeStroke(t, x, y) {
    var elapsed = recordElapsed(t);
    var s = {
      index: strokes.length,
      start: elapsed,
      end: elapsed,
      points: [{ t: elapsed, x: x, y: y }]
    };
    strokes.push(s);
    return s;
  }

  function addSample(stroke, t, x, y, force) {
    if (!stroke) return;
    var elapsed = recordElapsed(t);
    var p = stroke.points[stroke.points.length - 1];
    if (!p) {
      stroke.points.push({ t: elapsed, x: x, y: y });
      stroke.end = elapsed;
      return;
    }
    var dt = elapsed - p.t;
    var d = dist(p.x, p.y, x, y);
    if (force || dt >= 0.08 || (dt >= 0.014 && d >= 0.0012)) {
      stroke.points.push({ t: elapsed, x: x, y: y });
      stroke.end = elapsed;
    }
  }

  // Ghost figures are dwell aggregates, not decorations. Slow or stationary
  // samples accumulate seconds in a coarse spatial cell; a cell becomes a
  // figure anchor only after sustained presence.
  function computeGhosts() {
    var cellSize = 0.06;
    var cells = {};
    var order = [];
    var i, j, key, cell, a, b, dt, mx, my;
    for (i = 0; i < strokes.length; i++) {
      var pts = strokes[i].points;
      for (j = 1; j < pts.length; j++) {
        a = pts[j - 1];
        b = pts[j];
        dt = clamp(b.t - a.t, 0, 0.12);
        if (dt <= 0) continue;
        mx = (a.x + b.x) / 2;
        my = (a.y + b.y) / 2;
        key = Math.floor(mx / cellSize) + ':' + Math.floor(my / cellSize);
        cell = cells[key];
        if (!cell) {
          cell = {
            dwell: 0, x: 0, y: 0, emergeT: -1,
            ix: Math.floor(mx / cellSize), iy: Math.floor(my / cellSize)
          };
          cells[key] = cell;
          order.push(cell);
        }
        var before = cell.dwell;
        cell.dwell += dt;
        cell.x += mx * dt;
        cell.y += my * dt;
        if (before < 0.72 && cell.dwell >= 0.72) cell.emergeT = b.t;
      }
    }
    var candidates = [];
    for (i = 0; i < order.length; i++) {
      cell = order[i];
      if (cell.dwell >= 0.72) {
        candidates.push({
          x: cell.x / cell.dwell,
          y: cell.y / cell.dwell,
          dwell: cell.dwell,
          emergeT: cell.emergeT >= 0 ? cell.emergeT : 0,
          strength: clamp(0.34 + (cell.dwell - 0.72) / 1.55, 0.34, 1)
        });
      }
    }
    candidates.sort(function (p, q) { return q.dwell - p.dwell; });
    var anchors = [];
    for (i = 0; i < candidates.length; i++) {
      var separated = true;
      for (j = 0; j < anchors.length; j++) {
        if (dist(candidates[i].x, candidates[i].y, anchors[j].x, anchors[j].y) < 0.115) {
          separated = false;
          break;
        }
      }
      if (separated) anchors.push(candidates[i]);
      if (anchors.length >= 14) break;
    }
    return anchors;
  }

  function drawGhostFigure(g, rect, alpha, playback) {
    var s = rect.side * (0.105 + g.strength * 0.075);
    var x = rect.x + g.x * rect.side;
    var y = rect.y + g.y * rect.side;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = FIGURE;
    ctx.strokeStyle = playback ? GHOST_PLAY : LIVE;
    ctx.lineWidth = Math.max(1, rect.side * 0.0022);

    // Abstract standing form: head mass, tapered body, and a split base.
    ctx.beginPath();
    ctx.arc(0, -0.34 * s, 0.145 * s, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-0.20 * s, -0.14 * s);
    ctx.lineTo(0.20 * s, -0.14 * s);
    if (seedCycle % 3 === 1) {
      ctx.lineTo(0.13 * s, 0.16 * s);
      ctx.lineTo(0.30 * s, 0.43 * s);
      ctx.lineTo(0.08 * s, 0.43 * s);
      ctx.lineTo(0, 0.18 * s);
      ctx.lineTo(-0.08 * s, 0.43 * s);
      ctx.lineTo(-0.30 * s, 0.43 * s);
      ctx.lineTo(-0.13 * s, 0.16 * s);
    } else if (seedCycle % 3 === 2) {
      ctx.lineTo(0.30 * s, 0.40 * s);
      ctx.lineTo(-0.30 * s, 0.40 * s);
    } else {
      ctx.lineTo(0.25 * s, 0.38 * s);
      ctx.lineTo(0.07 * s, 0.38 * s);
      ctx.lineTo(0.02 * s, 0.13 * s);
      ctx.lineTo(-0.02 * s, 0.13 * s);
      ctx.lineTo(-0.07 * s, 0.38 * s);
      ctx.lineTo(-0.25 * s, 0.38 * s);
    }
    ctx.closePath();
    ctx.fill();
    if (playback) ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function strokePath(points, rect) {
    if (!points.length) return;
    ctx.beginPath();
    for (var i = 0; i < points.length; i++) {
      var x = rect.x + points[i].x * rect.side;
      var y = rect.y + points[i].y * rect.side;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    if (points.length === 1) {
      ctx.lineTo(rect.x + points[0].x * rect.side + 0.01, rect.y + points[0].y * rect.side);
    }
  }

  function drawLiveTrails(rect) {
    var passes = [
      { width: 0.010, alpha: 0.10 },
      { width: 0.0055, alpha: 0.28 },
      { width: 0.0028, alpha: 0.92 }
    ];
    ctx.strokeStyle = LIVE;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var p = 0; p < passes.length; p++) {
      ctx.globalAlpha = passes[p].alpha;
      ctx.lineWidth = Math.max(1, rect.side * passes[p].width);
      for (var i = 0; i < strokes.length; i++) {
        strokePath(strokes[i].points, rect);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function reversedPoints(stroke, sourceCursor) {
    var pts = [];
    for (var i = stroke.points.length - 1; i >= 0; i--) {
      if (stroke.points[i].t >= sourceCursor) pts.push(stroke.points[i]);
    }
    return pts;
  }

  function drawPlaybackTrails(rect, cursor) {
    var echoes = [
      { lag: 0.62, width: 0.009, alpha: 0.08 },
      { lag: 0.30, width: 0.006, alpha: 0.18 },
      { lag: 0, width: 0.0032, alpha: 0.94 }
    ];
    ctx.strokeStyle = GHOST_PLAY;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var e = 0; e < echoes.length; e++) {
      var c = clamp(cursor + echoes[e].lag, 0, playbackDuration);
      ctx.globalAlpha = echoes[e].alpha;
      ctx.lineWidth = Math.max(1, rect.side * echoes[e].width);
      for (var i = 0; i < strokes.length; i++) {
        var pts = reversedPoints(strokes[i], c);
        if (pts.length > 1) {
          strokePath(pts, rect);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawTimeline(rect, fraction, color) {
    var margin = rect.side * 0.055;
    var x0 = rect.x + margin;
    var x1 = rect.x + rect.side - margin;
    var y = rect.y + rect.side - rect.side * 0.045;
    var h = Math.max(2, rect.side * 0.006);
    ctx.globalAlpha = 1;
    ctx.fillStyle = FIGURE;
    ctx.fillRect(x0, y, x1 - x0, h);
    if (fraction > 0) {
      ctx.fillStyle = color;
      ctx.fillRect(x0, y, (x1 - x0) * clamp(fraction, 0, 1), h);
    }
    ctx.fillStyle = FIGURE;
    var tickW = Math.max(1, rect.side * 0.002);
    ctx.fillRect((x0 + x1) / 2 - tickW / 2, y - h * 0.55, tickW, h * 2.1);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var rect = stageRect();
    ctx.globalAlpha = 1;
    ctx.fillStyle = STAGE;
    ctx.fillRect(0, 0, W, H);

    // The recorder boundary is part of the empty stage; no scene content is
    // invented before a visitor supplies it.
    ctx.strokeStyle = FIGURE;
    ctx.globalAlpha = 0.78;
    ctx.lineWidth = 1;
    ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.side - 1, rect.side - 1);
    ctx.globalAlpha = 1;

    var ghosts = (mode === 'record' || mode === 'playback') ? computeGhosts() : [];
    var i, g;

    if (mode === 'record') {
      for (i = 0; i < ghosts.length; i++) {
        g = ghosts[i];
        drawGhostFigure(g, rect, 0.16 + g.strength * 0.42, false);
      }
      drawLiveTrails(rect);
      drawTimeline(rect, recordElapsed(t) / RECORD_SECONDS, LIVE);
    } else if (mode === 'playback') {
      var p = clamp(t - playbackStartT, 0, playbackDuration);
      var cursor = playbackDuration - p;
      for (i = 0; i < ghosts.length; i++) {
        g = ghosts[i];
        if (g.emergeT >= cursor) {
          var reveal = clamp(0.25 + (g.emergeT - cursor) / 0.65, 0.25, 1);
          drawGhostFigure(g, rect, (0.22 + g.strength * 0.48) * reveal, true);
        }
      }
      drawPlaybackTrails(rect, cursor);
      drawTimeline(rect, playbackDuration ? p / playbackDuration : 1, GHOST_PLAY);
    } else {
      drawTimeline(rect, 0, LIVE);
    }
  }

  // Audio. A context exists only after a visitor gesture. Recorded stroke
  // metadata is replayed in reverse order with falling pitch in Act 2.
  var actx = null;
  var recordVoice = null;
  var playbackVoices = [];

  function ensureAudio() {
    if (actx) {
      if (actx.resume) actx.resume();
      return;
    }
    var AC = null;
    if (typeof AudioContext !== 'undefined') AC = AudioContext;
    else if (typeof window !== 'undefined' && window.webkitAudioContext) AC = window.webkitAudioContext;
    if (!AC) return;
    try { actx = new AC(); } catch (err) { actx = null; }
  }

  function stopRecordVoice(fast) {
    if (!recordVoice || !actx) { recordVoice = null; return; }
    try {
      var now = actx.currentTime;
      recordVoice.gain.gain.cancelScheduledValues(now);
      recordVoice.gain.gain.setValueAtTime(recordVoice.gain.gain.value, now);
      recordVoice.gain.gain.linearRampToValueAtTime(0, now + (fast ? 0.03 : 0.10));
      recordVoice.osc.stop(now + (fast ? 0.05 : 0.13));
    } catch (err) { /* The visual piece never depends on audio. */ }
    recordVoice = null;
  }

  function startRecordVoice(stroke) {
    if (!actx || !stroke) return;
    stopRecordVoice(true);
    try {
      var osc = actx.createOscillator();
      var gain = actx.createGain();
      var now = actx.currentTime;
      var base = strokeToneBase(stroke);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(base, now);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.020, now + 0.08);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start(now);
      recordVoice = { osc: osc, gain: gain, stroke: stroke, base: base };
    } catch (err) { recordVoice = null; }
  }

  function updateRecordVoice(t) {
    if (!actx || !recordVoice || mode !== 'record') return;
    try {
      var elapsed = Math.max(0, recordElapsed(t) - recordVoice.stroke.start);
      var rise = Math.min(1, elapsed / 7);
      recordVoice.osc.frequency.setTargetAtTime(
        recordVoice.base + 118 * rise, actx.currentTime, 0.06);
    } catch (err) { /* Audio remains optional. */ }
  }

  function stopPlaybackVoices() {
    if (!actx) { playbackVoices = []; return; }
    for (var i = 0; i < playbackVoices.length; i++) {
      try { playbackVoices[i].stop(actx.currentTime); } catch (err) { /* Already ended. */ }
    }
    playbackVoices = [];
  }

  function schedulePlaybackAudio() {
    if (!actx) return;
    stopPlaybackVoices();
    try {
      var startAt = actx.currentTime + 0.03;
      var reversed = strokes.slice().reverse();
      for (var i = 0; i < reversed.length; i++) {
        var st = reversed[i];
        var offset = Math.max(0, playbackDuration - st.end);
        var dur = Math.max(0.08, st.end - st.start);
        var osc = actx.createOscillator();
        var gain = actx.createGain();
        var base = strokeToneBase(st);
        var peak = base + 118 * Math.min(1, dur / 7);
        var when = startAt + offset;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(peak, when);
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, base), when + dur);
        var swell = Math.min(0.14, dur * 0.35);
        var cutoff = Math.max(swell, dur - 0.03);
        gain.gain.setValueAtTime(0.0001, when);
        gain.gain.exponentialRampToValueAtTime(0.018, when + swell);
        gain.gain.setValueAtTime(0.018, when + cutoff);
        gain.gain.linearRampToValueAtTime(0, when + dur);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start(when);
        osc.stop(when + dur + 0.03);
        playbackVoices.push(osc);
      }
    } catch (err) { playbackVoices = []; }
  }

  function startPlayback(t, requestedDuration) {
    if (!strokes.length) {
      mode = 'ready';
      return;
    }
    stopRecordVoice(true);
    activeStroke = null;
    activePointer = null;
    playbackDuration = clamp(requestedDuration, 0.08, RECORD_SECONDS);
    playbackStartT = t;
    mode = 'playback';
    schedulePlaybackAudio();
  }

  function finishPlaybackIfNeeded(t) {
    if (mode !== 'playback') return;
    if (t - playbackStartT >= playbackDuration) {
      stopPlaybackVoices();
      strokes = [];
      activeStroke = null;
      activePointer = null;
      playbackDuration = 0;
      mode = 'ready';
    }
  }

  function clearAndReseed() {
    stopRecordVoice(true);
    stopPlaybackVoices();
    strokes = [];
    activeStroke = null;
    activePointer = null;
    pendingTap = null;
    armedDoubleTap = false;
    playbackDuration = 0;
    mode = 'ready';
    seedCycle++;
  }

  function executePendingTap(t) {
    if (!pendingTap || t < pendingTap.deadline) return;
    pendingTap = null;
    if (mode === 'record') startPlayback(t, recordElapsed(t));
  }

  function pointerPosition(e) {
    var rect = stageRect();
    var x = 0, y = 0;
    if (canvas.getBoundingClientRect) {
      var box = canvas.getBoundingClientRect();
      x = (e.clientX - box.left - rect.x) / rect.side;
      y = (e.clientY - box.top - rect.y) / rect.side;
    } else {
      x = ((e.clientX || 0) - rect.x) / rect.side;
      y = ((e.clientY || 0) - rect.y) / rect.side;
    }
    return { x: clamp(x, 0, 1), y: clamp(y, 0, 1) };
  }

  function insideStage(p) { return p.x >= 0 && p.x <= 1 && p.y >= 0 && p.y <= 1; }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      ensureAudio();
      var t = pieceTime();
      var p = pointerPosition(e);
      armedDoubleTap = !!(pendingTap && t - pendingTap.t < 0.38);
      if (armedDoubleTap) pendingTap = null;
      activePointer = {
        id: e.pointerId, x: p.x, y: p.y, downT: t,
        downX: p.x, downY: p.y, moved: false, strokeStarted: false
      };
      if (canvas.setPointerCapture && e.pointerId !== undefined) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* Optional. */ }
      }
    });

    canvas.addEventListener('pointermove', function (e) {
      if (!activePointer) return;
      var t = pieceTime();
      var p = pointerPosition(e);
      activePointer.x = p.x;
      activePointer.y = p.y;
      if (dist(activePointer.downX, activePointer.downY, p.x, p.y) > 0.006) {
        activePointer.moved = true;
      }
      if (!activePointer.moved || !insideStage(p)) return;
      if (mode === 'ready') {
        strokes = [];
        recordStartT = t;
        mode = 'record';
        pendingTap = null;
      }
      if (mode !== 'record') return;
      if (!activeStroke) {
        activeStroke = makeStroke(t, p.x, p.y);
        activePointer.strokeStarted = true;
        startRecordVoice(activeStroke);
      } else {
        addSample(activeStroke, t, p.x, p.y, false);
      }
      if (recordElapsed(t) >= RECORD_SECONDS) {
        startPlayback(recordStartT + RECORD_SECONDS, RECORD_SECONDS);
      }
    });

    function endPointer(e) {
      if (!activePointer) return;
      var t = pieceTime();
      var wasStroke = !!activeStroke;
      if (activeStroke) {
        var p = pointerPosition(e);
        addSample(activeStroke, t, p.x, p.y, true);
        activeStroke.end = recordElapsed(t);
        stopRecordVoice(false);
        activeStroke = null;
      }
      var wasTap = !activePointer.moved && t - activePointer.downT < 0.38;
      activePointer = null;
      if (wasTap) {
        if (armedDoubleTap) {
          clearAndReseed();
          armedDoubleTap = false;
          lastPointerTapT = -10;
          return;
        }
        pendingTap = { t: t, deadline: t + 0.36 };
        lastPointerTapT = t;
      } else if (wasStroke) {
        pendingTap = null;
        armedDoubleTap = false;
      }
      if (mode === 'record' && recordElapsed(t) >= RECORD_SECONDS) {
        startPlayback(recordStartT + RECORD_SECONDS, RECORD_SECONDS);
      }
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
  }

  function maintain(t) {
    executePendingTap(t);
    if (mode === 'record') {
      if (activePointer && activeStroke && activePointer.moved) {
        addSample(activeStroke, t, activePointer.x, activePointer.y, false);
      }
      updateRecordVoice(t);
      if (recordElapsed(t) >= RECORD_SECONDS) {
        startPlayback(recordStartT + RECORD_SECONDS, RECORD_SECONDS);
      }
    }
    finishPlaybackIfNeeded(t);
  }

  // Fixed synchronous first frame. This is the honest ready state: the stage
  // and its timeline exist; no audience performance has been supplied.
  draw(0);

  if (typeof requestAnimationFrame === 'function') {
    var rafLoop = function (now) {
      var t = pieceTimeFromRaf(now);
      maintain(t);
      draw(t);
      requestAnimationFrame(rafLoop);
    };
    requestAnimationFrame(rafLoop);
  }
})();
</script>
</body>
</html>
