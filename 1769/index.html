<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Pink Field</title>
<style>
html, body { margin: 0; padding: 0; background: #f2a6c2; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
/* Pinkcourtesyphone register: one flat pink, one near-white object, dark rose text */
var PINK = '#f2a6c2';
var SPRIG = '#fdf6f3';
var SPRIG_SOFT = '#f9e3ec';
var TEXT_ROSE = '#7c2a44';
var PLATE = '#7c2a44';
var PLATE_LINE = 'rgba(253,246,243,0.45)';
var TITLE_INK = '#fdf6f3';
var DATE_INK = '#f2a6c2';
var FRAME_T = 60.0; /* fixed phase: sprig partway across its first crossing */
var CROSS_S = 600.0; /* seconds to cross the field */
var PAUSE_S = 90.0; /* seconds resting off-field between crossings */
var LEG_S = CROSS_S + PAUSE_S;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1769);
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
/* sprig jitter, fixed at load from the seeded rng so frame one is reproducible */
var LEAF_JIT = [];
(function () {
  var i;
  for (i = 0; i < 7; i++) LEAF_JIT.push((rng() - 0.5) * 0.10);
})();
/* four legs, each entering from a different edge; cubic beziers in field coords */
var LEGS = [
  { p0: [0.0, 0.62], p1: [0.30, 0.30], p2: [0.70, 0.72], p3: [1.0, 0.38] }, /* left to right */
  { p0: [0.68, 0.0], p1: [0.36, 0.30], p2: [0.76, 0.70], p3: [0.42, 1.0] }, /* top to bottom */
  { p0: [1.0, 0.30], p1: [0.72, 0.66], p2: [0.28, 0.34], p3: [0.0, 0.66] }, /* right to left */
  { p0: [0.30, 1.0], p1: [0.62, 0.72], p2: [0.38, 0.28], p3: [0.60, 0.0] }  /* bottom to top */
];
function cubic(a, b, c, d, u) {
  var v = 1 - u;
  return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c + u * u * u * d;
}
function cubicD(a, b, c, d, u) {
  var v = 1 - u;
  return 3 * v * v * (b - a) + 6 * v * u * (c - b) + 3 * u * u * (d - c);
}
/* sprig state at piece time t: { u, x, y, angle, visible } in field coords */
function sprigAt(t) {
  var leg = Math.floor(t / LEG_S) % LEGS.length;
  var lt = t - Math.floor(t / LEG_S) * LEG_S;
  if (lt >= CROSS_S) return { visible: false };
  var u = lt / CROSS_S;
  var L = LEGS[leg];
  var x = cubic(L.p0[0], L.p1[0], L.p2[0], L.p3[0], u);
  var y = cubic(L.p0[1], L.p1[1], L.p2[1], L.p3[1], u);
  var dx = cubicD(L.p0[0], L.p1[0], L.p2[0], L.p3[0], u);
  var dy = cubicD(L.p0[1], L.p1[1], L.p2[1], L.p3[1], u);
  return { visible: true, u: u, x: x, y: y, angle: Math.atan2(dy, dx) };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
function fx(u) { return F.x + u * F.w; }
function fy(v) { return F.y + v * F.h; }
/* one small leaf: a solid pointed oval from two quadratic curves */
function drawLeaf(x, y, len, ang) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.5, -len * 0.30, len, 0);
  ctx.quadraticCurveTo(len * 0.5, len * 0.30, 0, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
/* the sprig: one stem, seven small leaves, three buds at the tip */
function drawSprig(s) {
  var sc = F.w * 0.11; /* sprig length in px */
  var cx = fx(s.x), cy = fy(s.y);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(s.angle);
  /* stem: a gentle quadratic curve, near-white */
  ctx.strokeStyle = rgba(SPRIG, 0.92);
  ctx.lineWidth = Math.max(1.5, sc * 0.022);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-sc * 0.5, 0);
  ctx.quadraticCurveTo(0, -sc * 0.10, sc * 0.5, 0);
  ctx.stroke();
  /* leaves, alternating along the stem */
  var i, lx, ly, la;
  ctx.fillStyle = rgba(SPRIG, 0.88);
  for (i = 0; i < 7; i++) {
    lx = -sc * 0.38 + i * sc * 0.125;
    ly = -sc * 0.10 * Math.sin((i / 6) * Math.PI) + LEAF_JIT[i] * sc * 0.4;
    la = (i % 2 === 0 ? -0.7 : 0.7) + LEAF_JIT[i];
    drawLeaf(lx, ly, sc * 0.16, la);
  }
  /* three tiny buds at the tip */
  var buds = [[0.52, -0.05], [0.58, 0.03], [0.47, 0.06]];
  ctx.fillStyle = rgba(SPRIG_SOFT, 0.95);
  for (i = 0; i < buds.length; i++) {
    ctx.beginPath();
    ctx.moveTo(buds[i][0] * sc + sc * 0.045, buds[i][1] * sc);
    ctx.arc(buds[i][0] * sc, buds[i][1] * sc, sc * 0.045, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}
function drawTextLine() {
  var px = isPhone ? 12 : 13;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = px + 'px Georgia, "Times New Roman", serif';
  ctx.fillStyle = TEXT_ROSE;
  ctx.fillText('one pink field, one sprig, ten minutes', F.x + F.w / 2, F.y + F.h - 8);
}
function draw() {
  size();
  /* one flat pink field; the page ground is the same pink, so the field fills the screen */
  ctx.fillStyle = PINK;
  ctx.fillRect(0, 0, VW, VH);
  var s = sprigAt(phaseT);
  if (s.visible) drawSprig(s);
  drawTextLine();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('One Pink Field').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('One Pink Field').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 15').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('One Pink Field', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = DATE_INK;
  ctx.fillText('2006 · 11 · 15', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = VW - hintPlateW - 12;
  var hintPlateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
