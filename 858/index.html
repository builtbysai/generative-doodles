<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№858 Cursive Over the Gate</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d1220; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №858 Cursive Over the Gate, CK4 / PP1258, study #262 colton-kempf.
  // The driver, as a felt phenomenon: the camera walks a dark street
  // toward a lit venue while gold names drift past like credits that
  // cannot decide what they are. Drag pulls the camera along the
  // approach, from the street to the doors; on release the walk eases
  // back to a slow automatic drift.
  var GROUND = '#0d1220'; // page ground, the night sky

  // Fixed-phase first frame: FIRST_T = 15 s into a 120 s cycle.
  // The approach parameter u is a closed-form loop over t; drag adds
  // an offset that eases back to zero on release, so frame one is
  // fully deterministic. Audio is visual-only in this gallery: no
  // real WebAudio anywhere in the piece.
  var FIRST_T = 15;
  var CYCLE = 120;
  var SEED = 858;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: night brick, fence grey, gold script, one warm practical light.
  var SKY_TOP = [10, 14, 28];
  var SKY_LOW = [24, 28, 48];
  var ROOF = [16, 19, 34];
  var ROOF_LIT = [38, 34, 52];
  var BRICK = [74, 46, 38];
  var BRICK_DARK = [52, 30, 25];
  var BRICK_LIGHT = [96, 62, 50];
  var MORTAR = [40, 24, 20];
  var WALL = [42, 26, 18];
  var WALL_DARK = [26, 16, 11];
  var FENCE = [96, 101, 110];
  var FENCE_DARK = [58, 62, 70];
  var GOLD = [217, 164, 65];
  var GOLD_LIGHT = [238, 200, 110];
  var GOLD_DIM = [176, 128, 52];
  var LAMP = [255, 180, 92];
  var LAMP_HOT = [255, 214, 140];
  var DOOR = [58, 36, 22];
  var DOOR_DARK = [38, 22, 13];
  var PLACARD = [232, 214, 178];
  var PLACARD_INK = [52, 38, 26];
  var STREET = [22, 22, 30];
  var STREET_LINE = [38, 38, 50];
  var CAPTION = [232, 210, 160];
  var HINT = [232, 210, 160];

  // ---- Stars: fixed table, slow twinkle ------------------------------
  var starRng = mulberry32(SEED * 13 + 5);
  var STARS = [];
  var si;
  for (si = 0; si < 42; si++) {
    STARS.push({
      x: starRng(), y: starRng() * 0.42,
      r: 0.6 + starRng() * 1.4,
      ph: starRng() * Math.PI * 2,
      a: 0.35 + starRng() * 0.45
    });
  }

  // ---- Rooftops: fixed skyline ---------------------------------------
  var roofRng = mulberry32(SEED * 7 + 2);
  var ROOFS = [];
  var ri;
  for (ri = 0; ri < 9; ri++) {
    ROOFS.push({
      x0: ri * 0.125, w: 0.09 + roofRng() * 0.06,
      h: 0.03 + roofRng() * 0.07,
      lit: roofRng() > 0.6
    });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.fsName = Math.round(clamp(W * 0.058, 18, 46));
    L.fsVenue = Math.round(clamp(W * 0.088, 28, 70));
    L.fsPlacard = Math.round(clamp(W * 0.030, 10, 24));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function X(f) { return f * W; }
  function Y(f) { return f * H; }

  // ---- Approach parameter --------------------------------------------
  // u in [0, 1]: 0 is the street, 1 is the doors. The loop drifts
  // slowly out and back over the 120 s cycle; drag adds an offset
  // that eases back to zero on release.
  var uOff = 0;            // drag offset, eased to 0 on release
  var dragging = false;
  function loopU(t) {
    return 0.5 + 0.48 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE);
  }
  function uAt(t) {
    return clamp(loopU(t) + uOff, 0, 1);
  }

  // ---- Arch geometry, all functions of u ------------------------------
  function archGeom(u) {
    var a = W * (0.22 + 0.38 * u);          // arch half-width
    var baseY = H * 0.92;
    var springY = H * (0.66 - 0.18 * u);    // where the curve springs
    var a2 = a * 0.80;                      // inner opening half-width
    return { cx: W * 0.5, a: a, a2: a2, baseY: baseY, springY: springY,
      topY: springY - a, topY2: springY - a2 };
  }
  function archPath(g, halfW) {
    // One continuous path: up the left pier, over the crown, down
    // the right pier. Callers close it for clip/fill, or stroke it
    // open for the rim (no bottom edge).
    ctx.beginPath();
    ctx.moveTo(g.cx - halfW, g.baseY);
    ctx.lineTo(g.cx - halfW, g.springY);
    ctx.arc(g.cx, g.springY, halfW, Math.PI, 0, false);
    ctx.lineTo(g.cx + halfW, g.baseY);
  }

  // ---- Doors and light, functions of u --------------------------------
  function doorState(u) {
    var g = archGeom(u);
    var dw = g.a2 * 0.55;                   // door width
    var doorTop = g.springY - g.a2 * 0.45;
    var gap = dw * 0.55 * smooth((u - 0.65) / 0.35); // doors stand ajar late
    var lampGlow = 0.05 + 0.16 * u;         // glow radius, stage fraction of W
    var spill = smooth((u - 0.60) / 0.40);  // warm spill onto the street
    var venueA = smooth((u - 0.85) / 0.12); // venue name appears near u = 1
    return { dw: dw, doorTop: doorTop, gap: gap, lampGlow: lampGlow,
      spill: spill, venueA: venueA };
  }

  // ---- Gold cursive names ---------------------------------------------
  // Each performer name sweeps right to left across its own u window,
  // at its own depth and height; the venue name arrives last, large,
  // over the open doors, only near u = 1.
  var NAMES = [
    { text: 'Mara Voss', u0: 0.05, u1: 0.45, y: 0.30, depth: 1.00, ph: 0.0 },
    { text: 'The Low Frequencies', u0: 0.35, u1: 0.70, y: 0.40, depth: 0.80, ph: 2.1 },
    { text: 'A. K. Bell', u0: 0.60, u1: 0.90, y: 0.32, depth: 0.65, ph: 4.2 }
  ];
  var SCRIPT = '"Snell Roundhand", "Segoe Script", "Brush Script MT", cursive, Georgia, serif';
  function nameState(u, t) {
    var out = [];
    var i, n, prog, alpha, x, y;
    for (i = 0; i < NAMES.length; i++) {
      n = NAMES[i];
      prog = (u - n.u0) / (n.u1 - n.u0);
      alpha = smooth(prog / 0.18) * (1 - smooth((prog - 0.82) / 0.18));
      x = 1.12 - prog * 2.24 * n.depth;
      y = n.y + 0.012 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE + n.ph);
      out.push({ text: n.text, x: x, y: y, alpha: alpha,
        size: L.fsName * (0.8 + 0.2 * n.depth) });
    }
    var d = doorState(u);
    out.push({ text: 'The Arches', x: 0.5, y: 0.36, alpha: d.venueA,
      size: L.fsVenue, venue: true });
    return out;
  }

  // ---- Sky, stars, rooftops -------------------------------------------
  function drawSky(t) {
    var g = ctx.createLinearGradient(0, 0, 0, H * 0.62);
    g.addColorStop(0, rgb(SKY_TOP));
    g.addColorStop(1, rgb(SKY_LOW));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H * 0.62);
    var i, s, tw;
    for (i = 0; i < STARS.length; i++) {
      s = STARS[i];
      // Slow twinkle, about a 7 s period: far below the 14 Hz limit.
      tw = s.a * (0.6 + 0.4 * Math.sin(2 * Math.PI * (t - FIRST_T) / 7 + s.ph));
      ctx.fillStyle = rgba([235, 238, 255], a4(tw));
      ctx.fillRect(X(s.x), Y(s.y), s.r, s.r);
    }
  }
  function drawRoofs(u) {
    var shift = -u * 0.04 * W; // distant rooftops barely move
    var i, r, rx;
    for (i = 0; i < ROOFS.length; i++) {
      r = ROOFS[i];
      rx = X(r.x0) + shift;
      ctx.fillStyle = rgb(r.lit ? ROOF_LIT : ROOF);
      ctx.fillRect(rx, Y(0.62) - H * r.h, X(r.w), H * r.h + 2);
      // Chimney on every other roof.
      if (i % 2 === 0) {
        ctx.fillStyle = rgb(ROOF);
        ctx.fillRect(rx + X(r.w) * 0.6, Y(0.62) - H * (r.h + 0.035), W * 0.012, H * 0.035);
      }
      // One lit window on the lit roofs.
      if (r.lit) {
        ctx.fillStyle = rgba(LAMP, a4(0.75));
        ctx.fillRect(rx + X(r.w) * 0.3, Y(0.62) - H * (r.h * 0.55), W * 0.012, H * 0.018);
      }
    }
  }

  // ---- Street ----------------------------------------------------------
  function drawStreet(u) {
    ctx.fillStyle = rgb(STREET);
    ctx.fillRect(0, Y(0.62), W, H * 0.38);
    // Cobble courses, widening toward the viewer.
    var i, fy, lw;
    ctx.fillStyle = rgba(STREET_LINE, a4(0.5));
    for (i = 0; i < 7; i++) {
      fy = Y(0.64 + i * i * 0.006 + i * 0.022);
      lw = Math.max(1, H * 0.0016);
      ctx.fillRect(0, fy, W, lw);
    }
    // Converging joints toward the vanishing point under the arch.
    ctx.strokeStyle = rgba(STREET_LINE, a4(0.35));
    ctx.lineWidth = Math.max(1, H * 0.0012);
    var j;
    for (j = -5; j <= 5; j++) {
      ctx.beginPath();
      ctx.moveTo(W * 0.5 + j * W * 0.06, Y(0.62));
      ctx.lineTo(W * 0.5 + j * W * 0.22, H);
      ctx.stroke();
    }
  }

  // ---- Brick railway arch ----------------------------------------------
  function drawArch(u) {
    var g = archGeom(u);
    // Brickwork, clipped to the outer arch.
    ctx.save();
    archPath(g, g.a);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = rgb(BRICK);
    ctx.fillRect(g.cx - g.a, g.topY, g.a * 2, g.baseY - g.topY);
    // Brick courses with staggered joints.
    var rowH = H * 0.035;
    var row, y, off, jx;
    ctx.fillStyle = rgba(MORTAR, a4(0.65));
    for (row = 0, y = g.topY; y < g.baseY; row++, y += rowH) {
      ctx.fillRect(g.cx - g.a, y, g.a * 2, Math.max(1, H * 0.002));
      off = (row % 2 === 0) ? 0 : W * 0.028;
      for (jx = g.cx - g.a + off; jx < g.cx + g.a; jx += W * 0.056) {
        ctx.fillRect(jx, y, Math.max(1, W * 0.0016), rowH);
      }
    }
    // A lighter keystone course at the crown.
    ctx.fillStyle = rgba(BRICK_LIGHT, a4(0.5));
    ctx.fillRect(g.cx - W * 0.02, g.topY, W * 0.04, H * 0.05);
    ctx.restore();
    // Arch rim: a pale stone ring around the opening.
    ctx.strokeStyle = rgba([188, 168, 140], a4(0.8));
    ctx.lineWidth = Math.max(2, W * 0.008);
    archPath(g, g.a2);
    ctx.stroke();
  }

  // ---- Venue facade inside the arch: wall, doors, lamp -----------------
  function drawVenue(u) {
    var g = archGeom(u);
    var d = doorState(u);
    // Facade, clipped to the inner opening.
    ctx.save();
    archPath(g, g.a2);
    ctx.closePath();
    ctx.clip();
    var wg = ctx.createLinearGradient(0, g.topY2, 0, g.baseY);
    wg.addColorStop(0, rgb(WALL));
    wg.addColorStop(1, rgb(WALL_DARK));
    ctx.fillStyle = wg;
    ctx.fillRect(g.cx - g.a2, g.topY2, g.a2 * 2, g.baseY - g.topY2);
    // Warm glow behind the doors, growing as the doors open.
    if (d.gap > 0.5) {
      var gg = ctx.createLinearGradient(g.cx - d.gap / 2, d.doorTop, g.cx + d.gap / 2, g.baseY);
      gg.addColorStop(0, rgba(LAMP_HOT, a4(0.9)));
      gg.addColorStop(1, rgba(LAMP, a4(0.7)));
      ctx.fillStyle = gg;
      ctx.fillRect(g.cx - d.gap / 2, d.doorTop, d.gap, g.baseY - d.doorTop);
    }
    ctx.restore();
    // Doors: two panels standing ajar, warm light between them.
    var half = d.dw / 2;
    ctx.fillStyle = rgb(DOOR);
    ctx.fillRect(g.cx - half, d.doorTop, half - d.gap / 2, g.baseY - d.doorTop);
    ctx.fillRect(g.cx + d.gap / 2, d.doorTop, half - d.gap / 2, g.baseY - d.doorTop);
    // Door panels: vertical planks and a crossbar each.
    ctx.fillStyle = rgba(DOOR_DARK, a4(0.7));
    ctx.fillRect(g.cx - half + W * 0.006, d.doorTop, Math.max(1, W * 0.0016), g.baseY - d.doorTop);
    ctx.fillRect(g.cx + half - W * 0.008, d.doorTop, Math.max(1, W * 0.0016), g.baseY - d.doorTop);
    ctx.fillRect(g.cx - half, d.doorTop + (g.baseY - d.doorTop) * 0.45, half - d.gap / 2, Math.max(1, H * 0.004));
    ctx.fillRect(g.cx + d.gap / 2, d.doorTop + (g.baseY - d.doorTop) * 0.45, half - d.gap / 2, Math.max(1, H * 0.004));
    // Warm spill from the open doors onto the street.
    if (d.spill > 0.01) {
      var sg = ctx.createLinearGradient(0, g.baseY, 0, H);
      sg.addColorStop(0, rgba(LAMP, a4(0.35 * d.spill)));
      sg.addColorStop(1, rgba(LAMP, 0));
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(g.cx - d.gap / 2 - W * 0.01, g.baseY);
      ctx.lineTo(g.cx + d.gap / 2 + W * 0.01, g.baseY);
      ctx.lineTo(g.cx + d.dw * 0.75, H);
      ctx.lineTo(g.cx - d.dw * 0.75, H);
      ctx.closePath();
      ctx.fill();
    }
    // The one warm practical light: a lamp over the doors.
    var lx = g.cx, ly = d.doorTop - H * 0.035;
    var lr = d.lampGlow * W;
    var lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, lr);
    lg.addColorStop(0, rgba(LAMP_HOT, a4(0.55 + 0.25 * u)));
    lg.addColorStop(0.4, rgba(LAMP, a4(0.22)));
    lg.addColorStop(1, rgba(LAMP, 0));
    ctx.fillStyle = lg;
    ctx.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
    // Lamp fixture: a small bracket and shade.
    ctx.strokeStyle = rgb([60, 44, 28]);
    ctx.lineWidth = Math.max(1.5, W * 0.003);
    ctx.beginPath();
    ctx.moveTo(lx, ly - H * 0.022);
    ctx.lineTo(lx, ly - H * 0.008);
    ctx.stroke();
    ctx.fillStyle = rgb([60, 44, 28]);
    ctx.beginPath();
    ctx.moveTo(lx - W * 0.018, ly - H * 0.006);
    ctx.lineTo(lx + W * 0.018, ly - H * 0.006);
    ctx.lineTo(lx + W * 0.010, ly + H * 0.006);
    ctx.lineTo(lx - W * 0.010, ly + H * 0.006);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb(LAMP_HOT);
    ctx.beginPath();
    ctx.moveTo(lx + W * 0.010, ly + H * 0.006);
    ctx.arc(lx, ly + H * 0.006, W * 0.010, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- Hand-painted placard, fixed to the arch --------------------------
  function drawPlacard(u) {
    var g = archGeom(u);
    var px = g.cx - g.a * 0.98;
    var py = H * 0.52;
    // Readable mid-approach: fades in early, fades out as you pass it.
    var alpha = smooth((u - 0.12) / 0.18) * (1 - smooth((u - 0.68) / 0.22));
    if (alpha < 0.02) { return; }
    var bw = W * 0.17, bh = H * 0.085;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(-0.05);
    ctx.globalAlpha = a4(alpha);
    ctx.fillStyle = rgb(PLACARD);
    ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
    ctx.strokeStyle = rgba(PLACARD_INK, a4(0.8));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.strokeRect(-bw / 2 + W * 0.006, -bh / 2 + H * 0.008, bw - W * 0.012, bh - H * 0.016);
    ctx.fillStyle = rgb(PLACARD_INK);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'italic 700 ' + L.fsPlacard + 'px Georgia, serif';
    ctx.fillText('TONIGHT', 0, -bh * 0.14);
    ctx.font = L.fsPlacard * 0.72 + 'px Georgia, serif';
    ctx.fillText('doors 8 o\'clock', 0, bh * 0.26);
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // ---- Spiked fence, mid layer, passing across --------------------------
  function drawFence(u) {
    // The fence passes across the frame and clears as you reach the doors.
    var alpha = (1 - smooth((u - 0.72) / 0.28)) * 0.92;
    if (alpha < 0.02) { return; }
    var spacing = W * 0.035;
    var shift = (u * 0.5 * W) % spacing;
    var topY = H * 0.70, botY = H * 0.95;
    ctx.save();
    ctx.globalAlpha = a4(alpha);
    // Rails.
    ctx.fillStyle = rgb(FENCE_DARK);
    ctx.fillRect(0, topY, W, Math.max(2, H * 0.006));
    ctx.fillRect(0, botY - H * 0.006, W, Math.max(2, H * 0.006));
    // Bars with spikes.
    var x;
    ctx.fillStyle = rgb(FENCE);
    for (x = -spacing + shift; x < W + spacing; x += spacing) {
      ctx.fillRect(x, topY - H * 0.018, Math.max(1.5, W * 0.004), botY - topY + H * 0.018);
      ctx.beginPath();
      ctx.moveTo(x - W * 0.005, topY - H * 0.018);
      ctx.lineTo(x + W * 0.002, topY - H * 0.042);
      ctx.lineTo(x + W * 0.009, topY - H * 0.018);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // ---- Gold cursive names, foreground layer ------------------------------
  function drawNames(u, t) {
    var names = nameState(u, t);
    var i, n;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (i = 0; i < names.length; i++) {
      n = names[i];
      if (n.alpha < 0.02) { continue; }
      ctx.font = (n.venue ? 'italic ' : '') + Math.round(n.size) + 'px ' + SCRIPT;
      // Soft gold glow under the script.
      ctx.fillStyle = rgba(GOLD_DIM, a4(0.35 * n.alpha));
      ctx.fillText(n.text, X(n.x), Y(n.y) + 2);
      ctx.fillStyle = rgba(n.venue ? GOLD_LIGHT : GOLD, a4(n.alpha));
      ctx.fillText(n.text, X(n.x), Y(n.y));
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // ---- Caption and hint, in the template's place ----------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.85));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№858 · Cursive Over the Gate', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CAPTION, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 18', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(HINT, a4(0.85));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to walk to the doors.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var u = uAt(t);

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawSky(t);
    drawRoofs(u);
    drawStreet(u);
    drawArch(u);
    drawVenue(u);
    drawPlacard(u);
    drawFence(u);
    drawNames(u, t);
    // Soft vignette, night, never HDR.
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42,
      W / 2, H / 2, Math.max(W, H) * 0.78);
    vg.addColorStop(0, rgba([0, 0, 0], 0));
    vg.addColorStop(1, rgba([0, 0, 0], a4(0.28)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    drawText();
  }

  // ---- Drag: pulls the camera along the approach ----------------------
  // Pointer x maps straight onto u: left edge is the street, right
  // edge is the doors. On release the offset eases back to the loop.
  function pointerPos(e) {
    var rect = { left: stageX, top: stageY };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    var cx = (e.clientX - rect.left) / (rect.width || W);
    var cy = (e.clientY - rect.top) / (rect.height || H);
    return { x: clamp(cx, 0, 1), y: clamp(cy, 0, 1) };
  }
  function applyDrag(p) {
    uOff = clamp(p.x, 0, 1) - loopU(lastT);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      try { if (e && typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      dragging = true;
      applyDrag(pointerPos(e));
      draw(lastT);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      applyDrag(pointerPos(e));
      draw(lastT);
    });
    var endDrag = function () {
      if (!dragging) { return; }
      dragging = false;
      // Release: the loop eases uOff back to zero.
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', endDrag);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece858 exposes approach, names and door state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece858 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      u: function (t) { return uAt(t); },
      loopU: function (t) { return loopU(t); },
      arch: function (u) { var g = archGeom(u); return { halfW: g.a, topY: g.topY, springY: g.springY }; },
      door: function (u) { return doorState(u); },
      names: function (u, t) { return nameState(u, t); },
      dragTo: function (u, t) { dragging = true; uOff = clamp(u, 0, 1) - loopU(t); },
      release: function () { dragging = false; },
      easeStep: function (dt, t) { uOff *= Math.exp(-dt / 1.5); return uAt(t); },
      dragOffset: function () { return uOff; },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 120 s approach cycle, closed-form. The drag offset
  // eases back to zero after release. Guarded so node-canvas QA
  // (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var prevNow = start;
    requestAnimationFrame(function loop(now) {
      var dt = (now - prevNow) / 1000;
      prevNow = now;
      var t = FIRST_T + (now - start) / 1000;
      if (!dragging) {
        var k = Math.exp(-dt / 1.5);
        uOff *= k;
      }
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
