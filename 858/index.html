<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Final Ten Seconds</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette (strict) ----------
  var BG = '#050505';
  var PALE = '#D8D2C4';
  var TRAIL = '#8A8678';
  var BLUE = '#1B2A3A';
  var RED = '#7A2018';

  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var s = seed | 0;
    return function () {
      s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- viewport ----------
  var W = 0, H = 0, phone = false;
  function resize() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (window.screen && window.screen.width && window.screen.height) {
      phone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      phone = H > W * 1.15;
    }
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
  }

  // ---------- clock ----------
  var hasPerf = (typeof performance !== 'undefined' && performance && typeof performance.now === 'function');
  var t0 = hasPerf ? performance.now() : Date.now();
  function nowT() {
    var n = hasPerf ? performance.now() : Date.now();
    return (n - t0) / 1000;
  }

  // ---------- the ekhoes ----------
  var LOOP = 10;               // every ekho repeats its final ten seconds
  var TRAIL_DUR = 3.4;         // seconds of chalk trail behind each figure
  var TRAIL_STEP = 0.14;
  var gen = 0;
  var figures = [];
  var userEkho = null;         // {pts:[{x,y}], period, born}
  var tapMarks = [];           // {x, y, t}
  var dragSamples = [];        // ghost cursor path {x, y, t}

  // Frame-one loop positions (seconds into the 10 s loop at t=0), staggered so
  // the field opens mid-loop with developed trails; the pacing figure sits
  // 0.55 s past its closure, so its red marker pulse is still visible.
  var START_POS = [0.55, 3.2, 5.6, 7.4, 2.1];

  function makeFigures(seed) {
    var rnd = mulberry32(seed);
    var defs = [
      { type: 'pace',  cx: 0.300, by: 0.700, amp: 0.085, hF: 0.205, hum: 64.0,  aMul: 1.00 },
      { type: 'reach', cx: 0.520, by: 0.628, amp: 0.035, hF: 0.225, hum: 64.7,  aMul: 0.90 },
      { type: 'kneel', cx: 0.700, by: 0.690, amp: 0.030, hF: 0.118, hum: 81.2,  aMul: 0.95 },
      { type: 'sway',  cx: 0.150, by: 0.605, amp: 0.042, hF: 0.175, hum: 96.4,  aMul: 0.80 },
      { type: 'eight', cx: 0.850, by: 0.618, amp: 0.050, hF: 0.185, hum: 108.1, aMul: 0.85 }
    ];
    var out = [];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      var varied = gen > 0;
      out.push({
        type: d.type,
        cx: d.cx + (varied ? (rnd() - 0.5) * 0.04 : 0),
        by: d.by + (varied ? (rnd() - 0.5) * 0.014 : 0),
        amp: d.amp,
        hF: d.hF,
        hum: d.hum * (varied ? (0.97 + rnd() * 0.06) : 1),
        aMul: d.aMul,
        off: START_POS[i],
        ph: rnd() * Math.PI * 2,
        j1x: (rnd() - 0.5) * 3.2, j1y: (rnd() - 0.5) * 3.2,
        j2x: (rnd() - 0.5) * 2.4, j2y: (rnd() - 0.5) * 2.4
      });
    }
    return out;
  }

  function loopPos(f, t) {
    var pos = ((t + f.off) % LOOP + LOOP) % LOOP;
    return pos;
  }

  // Closed-form anchor position (normalized coords) at piece time t.
  function figPos(f, t) {
    var a = loopPos(f, t) / LOOP * Math.PI * 2;
    var x, y;
    if (f.type === 'pace') {
      x = f.cx + f.amp * Math.sin(a) + 0.018 * Math.sin(a + 1.3);
      y = f.by - 0.012 * (0.5 + 0.5 * Math.sin(2 * a + f.ph));
    } else if (f.type === 'reach') {
      var s = 0.5 + 0.5 * Math.sin(2 * a + f.ph);
      x = f.cx + f.amp * Math.sin(a);
      y = f.by - 0.105 * s;
    } else if (f.type === 'kneel') {
      x = f.cx + f.amp * Math.sin(a);
      y = f.by + 0.010 * Math.sin(2 * a + f.ph);
    } else if (f.type === 'sway') {
      x = f.cx + f.amp * Math.sin(a);
      y = f.by + 0.030 * Math.cos(a + f.ph);
    } else { // eight
      x = f.cx + f.amp * Math.sin(a);
      y = f.by + 0.032 * Math.sin(a) * Math.cos(a) + 0.006 * Math.sin(2 * a + f.ph);
    }
    return { x: x, y: y };
  }

  function reachAmt(f, t) {
    var a = loopPos(f, t) / LOOP * Math.PI * 2;
    return 0.5 + 0.5 * Math.sin(2 * a + f.ph);
  }

  // ---------- user ekho replay ----------
  function userPos(u, t) {
    var n = u.pts.length;
    if (n === 0) return { x: 0.5, y: 0.5 };
    var local = ((t - u.born) % u.period + u.period) % u.period;
    var fi = local / u.period * (n - 1);
    var i0 = Math.floor(fi);
    var i1 = Math.min(n - 1, i0 + 1);
    var fr = fi - i0;
    return {
      x: u.pts[i0].x + (u.pts[i1].x - u.pts[i0].x) * fr,
      y: u.pts[i0].y + (u.pts[i1].y - u.pts[i0].y) * fr
    };
  }

  // ---------- silhouette ----------
  // Anchor = base center. Local coords: x right, y up (negated on draw).
  function bodyPath(w, h, kneel) {
    var bw = kneel ? 0.62 : 0.50;   // base half-width (x w)
    var sw = kneel ? 0.44 : 0.36;   // side at 40% height
    var ww = kneel ? 0.36 : 0.27;   // waist
    var sh = kneel ? 0.40 : 0.31;   // shoulder half-width
    var nh = kneel ? 0.70 : 0.83;   // neck height (x h)
    var sY = kneel ? 0.62 : 0.79;   // shoulder height
    ctx.beginPath();
    ctx.moveTo(-bw * w, 0);
    ctx.lineTo(-sw * w, -0.40 * h);
    ctx.lineTo(-ww * w, -0.60 * h);
    ctx.lineTo(-sh * w, -sY * h);
    ctx.lineTo(-0.11 * w, -nh * h);
    ctx.lineTo(0.11 * w, -nh * h);
    ctx.lineTo(sh * w, -sY * h);
    ctx.lineTo(ww * w, -0.60 * h);
    ctx.lineTo(sw * w, -0.40 * h);
    ctx.lineTo(bw * w, 0);
    ctx.closePath();
  }

  function drawSilhouette(px, py, w, h, tilt, j1x, j1y, j2x, j2y, kneel, aMul) {
    var headCY = (kneel ? -0.78 : -0.905) * h;
    var headRX = w * 0.32, headRY = h * 0.078;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(tilt);
    // main fill
    ctx.fillStyle = rgba(PALE, 0.40 * aMul);
    bodyPath(w, h, kneel); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, headCY, headRX, headRY, 0, 0, Math.PI * 2); ctx.fill();
    // chalk double-pass: offset ghost fill
    ctx.fillStyle = rgba(PALE, 0.15 * aMul);
    ctx.save(); ctx.translate(j1x, j1y);
    bodyPath(w, h, kneel); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, headCY, headRX, headRY, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // jittered chalk outlines
    ctx.strokeStyle = rgba(PALE, 0.30 * aMul);
    ctx.lineWidth = 1.3;
    bodyPath(w, h, kneel); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, headCY, headRX, headRY, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = rgba(TRAIL, 0.20 * aMul);
    ctx.save(); ctx.translate(j2x, j2y);
    bodyPath(w, h, kneel); ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  function drawEkhoFigure(f, t) {
    var p = figPos(f, t);
    var px = p.x * W, py = p.y * H;
    var hPx = f.hF * H * (phone ? 1.12 : 1);
    if (f.type === 'reach') hPx *= 1 + 0.22 * reachAmt(f, t);
    var wPx = hPx * (f.type === 'kneel' ? 0.62 : 0.36);
    var pa = figPos(f, t - 0.05), pb = figPos(f, t + 0.05);
    var vx = (pb.x - pa.x) * W;
    var tilt = Math.max(-0.07, Math.min(0.07, vx * 0.004));
    drawSilhouette(px, py, wPx, hPx, tilt, f.j1x, f.j1y, f.j2x, f.j2y, f.type === 'kneel', f.aMul);
  }

  function drawUserFigure(u, t) {
    var p = userPos(u, t);
    var px = p.x * W, py = p.y * H;
    var hPx = 0.18 * H * (phone ? 1.12 : 1);
    var wPx = hPx * 0.36;
    var pa = userPos(u, t - 0.05), pb = userPos(u, t + 0.05);
    var vx = (pb.x - pa.x) * W;
    var tilt = Math.max(-0.07, Math.min(0.07, vx * 0.004));
    drawSilhouette(px, py, wPx, hPx, tilt, 1.4, -1.1, -1.8, 0.9, false, 0.55);
  }

  // ---------- trails ----------
  function drawTrailFor(posFn, aMul, jx, jy) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var steps = Math.round(TRAIL_DUR / TRAIL_STEP);
    var k, s0, s1, pA, pB, alpha;
    ctx.lineWidth = Math.max(1.6, H * 0.0032);
    for (k = steps; k >= 1; k--) {
      s0 = k * TRAIL_STEP; s1 = (k - 1) * TRAIL_STEP;
      alpha = 0.52 * Math.pow(1 - s0 / TRAIL_DUR, 1.35) * aMul;
      if (alpha <= 0.004) continue;
      pA = posFn(s0); pB = posFn(s1);
      ctx.strokeStyle = rgba(TRAIL, alpha);
      ctx.beginPath();
      ctx.moveTo(pA.x * W, pA.y * H);
      ctx.lineTo(pB.x * W, pB.y * H);
      ctx.stroke();
      ctx.strokeStyle = rgba(TRAIL, alpha * 0.5);
      ctx.beginPath();
      ctx.moveTo(pA.x * W + jx, pA.y * H + jy);
      ctx.lineTo(pB.x * W + jx, pB.y * H + jy);
      ctx.stroke();
    }
  }

  // ---------- red closure markers ----------
  function drawMarker(px, py, age) {
    // permanent small dot at the loop-closure point
    ctx.fillStyle = rgba(RED, 0.28);
    ctx.beginPath(); ctx.arc(px, py, 4.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgba(RED, 0.80);
    ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.fill();
    // pulse as the loop closes
    if (age < 2.6) {
      var pa = 0.75 * Math.exp(-age * 1.6);
      ctx.strokeStyle = rgba(RED, pa);
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(px, py, 3 + age * 10, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = rgba(RED, Math.min(1, 0.8 + pa));
      ctx.beginPath(); ctx.arc(px, py, 2.6 + 1.2 * Math.exp(-age * 2.2), 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---------- audio (lazy, gesture-started, guarded) ----------
  var AC = null, humNodes = [], humMaster = null;
  function addHum(freq, vol) {
    var o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    var g = AC.createGain();
    g.gain.value = vol;
    o.connect(g);
    g.connect(humMaster);
    o.start();
    humNodes.push({ osc: o, gain: g });
  }
  function syncAudio() {
    if (!AC) return;
    var i;
    for (i = 0; i < humNodes.length; i++) {
      try { humNodes[i].osc.stop(); } catch (e) {}
      try { humNodes[i].gain.disconnect(); } catch (e2) {}
    }
    humNodes = [];
    if (humMaster) { try { humMaster.disconnect(); } catch (e) {} }
    humMaster = AC.createGain();
    humMaster.gain.value = 0.5;
    humMaster.connect(AC.destination);
    for (i = 0; i < figures.length; i++) addHum(figures[i].hum, 0.028);
    if (userEkho) addHum(87.3, 0.020);
  }
  function ensureAudio() {
    if (AC) {
      if (typeof AC.resume === 'function') { try { AC.resume(); } catch (e) {} }
      return;
    }
    var Ctor = null;
    if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
    else if (typeof window !== 'undefined' && window.webkitAudioContext) Ctor = window.webkitAudioContext;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      syncAudio();
    } catch (e) { AC = null; }
  }

  // ---------- interaction ----------
  var dragging = false;
  var downT = 0, downX = 0, downY = 0, downMoved = 0;
  var stroke = null;           // {samples:[{x,y,t}], len}
  var lastTapT = -10;

  function evtPos(e) {
    var x = 0, y = 0;
    if (typeof e.clientX === 'number') {
      x = e.clientX; y = e.clientY;
      if (typeof canvas.getBoundingClientRect === 'function') {
        var r = canvas.getBoundingClientRect();
        x -= r.left; y -= r.top;
      }
    }
    return { x: W > 0 ? x / W : 0, y: H > 0 ? y / H : 0 };
  }

  function distPx(ax, ay, bx, by) {
    var dx = (ax - bx) * W, dy = (ay - by) * H;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function tryCapture(now) {
    if (!stroke || stroke.samples.length < 4) return;
    var samples = stroke.samples;
    var cur = samples[samples.length - 1];
    var minDim = Math.min(W, H);
    var closeR = Math.max(18, minDim * 0.035);
    for (var i = 0; i < samples.length; i++) {
      var age = now - samples[i].t;
      if (age < 1.2) break;
      if (age > LOOP) continue;
      // path length from sample i to now
      var len = 0, j;
      for (j = i + 1; j < samples.length; j++) {
        len += distPx(samples[j - 1].x, samples[j - 1].y, samples[j].x, samples[j].y);
      }
      if (len < minDim * 0.22) continue;
      if (distPx(cur.x, cur.y, samples[i].x, samples[i].y) < closeR) {
        // capture samples i..end as the new ekho
        var seg = samples.slice(i);
        var period = Math.max(1.5, now - samples[i].t);
        var N = 96, pts = [], k, fi, i0, i1, fr;
        for (k = 0; k < N; k++) {
          fi = k / (N - 1) * (seg.length - 1);
          i0 = Math.floor(fi); i1 = Math.min(seg.length - 1, i0 + 1); fr = fi - i0;
          pts.push({
            x: seg[i0].x + (seg[i1].x - seg[i0].x) * fr,
            y: seg[i0].y + (seg[i1].y - seg[i0].y) * fr
          });
        }
        userEkho = { pts: pts, period: period, born: now };
        syncAudio();
        stroke = { samples: [{ x: cur.x, y: cur.y, t: now }], len: 0 };
        return;
      }
    }
  }

  function onDown(e) {
    ensureAudio();
    var p = evtPos(e), now = nowT();
    dragging = true;
    downT = now; downX = p.x; downY = p.y; downMoved = 0;
    stroke = { samples: [{ x: p.x, y: p.y, t: now }], len: 0 };
    dragSamples.push({ x: p.x, y: p.y, t: now });
    if (e && typeof e.preventDefault === 'function') e.preventDefault();
  }

  function onMove(e) {
    if (!dragging) return;
    var p = evtPos(e), now = nowT();
    dragSamples.push({ x: p.x, y: p.y, t: now });
    if (dragSamples.length > 900) dragSamples.splice(0, dragSamples.length - 900);
    if (stroke) {
      var last = stroke.samples[stroke.samples.length - 1];
      var d = distPx(last.x, last.y, p.x, p.y);
      stroke.len += d;
      downMoved = Math.max(downMoved, distPx(downX, downY, p.x, p.y));
      stroke.samples.push({ x: p.x, y: p.y, t: now });
      tryCapture(now);
    }
    if (e && typeof e.preventDefault === 'function') e.preventDefault();
  }

  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var now = nowT();
    var p = (e && typeof e.clientX === 'number') ? evtPos(e) : { x: downX, y: downY };
    var isTap = downMoved < 8 && (now - downT) < 0.4;
    if (isTap) {
      if (now - lastTapT < 0.45) {
        // double-tap: release all loops and reseed
        gen++;
        figures = makeFigures(858190 + gen * 7919);
        userEkho = null;
        tapMarks = [];
        dragSamples = [];
        lastTapT = -10;
        syncAudio();
      } else {
        tapMarks.push({ x: p.x, y: p.y, t: now });
        lastTapT = now;
      }
    }
    stroke = null;
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerup', onUp);
  }

  // ---------- draw ----------
  function draw(t) {
    if (W <= 0 || H <= 0) resize();
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // grief-blue floor line at 70% (the only blue in the piece)
    var fy = Math.round(0.70 * H) + 0.5;
    ctx.strokeStyle = rgba(BLUE, 0.95);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy); ctx.stroke();
    ctx.strokeStyle = rgba(BLUE, 0.35);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, fy + 3.5); ctx.lineTo(W, fy + 3.5); ctx.stroke();

    var i, f;

    // trails (sampled backward from the same closed-form paths)
    for (i = 0; i < figures.length; i++) {
      f = figures[i];
      (function (ff) {
        drawTrailFor(function (s) { return figPos(ff, t - s); }, ff.aMul, ff.j1x * 0.6, ff.j1y * 0.6);
      })(f);
    }
    if (userEkho) {
      (function (u) {
        drawTrailFor(function (s) { return userPos(u, t - s); }, 0.55, 1.0, -0.8);
      })(userEkho);
    }

    // loop-closure markers at each path's phase-0 point
    for (i = 0; i < figures.length; i++) {
      f = figures[i];
      var mp = figPos(f, -f.off); // position where loop phase == 0
      drawMarker(mp.x * W, mp.y * H, loopPos(f, t));
    }
    if (userEkho) {
      var ulocal = ((t - userEkho.born) % userEkho.period + userEkho.period) % userEkho.period;
      var up0 = userEkho.pts[0];
      drawMarker(up0.x * W, up0.y * H, ulocal);
    }

    // figures
    for (i = 0; i < figures.length; i++) drawEkhoFigure(figures[i], t);
    if (userEkho) drawUserFigure(userEkho, t);

    // ghost cursor path (recent drag samples, fading)
    var kept = [];
    for (i = 0; i < dragSamples.length; i++) {
      if (t - dragSamples[i].t < 3) kept.push(dragSamples[i]);
    }
    dragSamples = kept;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(1.2, H * 0.002);
    for (i = 1; i < dragSamples.length; i++) {
      var age = t - dragSamples[i].t;
      var al = 0.26 * (1 - age / 3);
      if (al <= 0.004) continue;
      ctx.strokeStyle = rgba(TRAIL, al);
      ctx.beginPath();
      ctx.moveTo(dragSamples[i - 1].x * W, dragSamples[i - 1].y * H);
      ctx.lineTo(dragSamples[i].x * W, dragSamples[i].y * H);
      ctx.stroke();
    }
    if (dragging && dragSamples.length) {
      var lp = dragSamples[dragSamples.length - 1];
      ctx.fillStyle = rgba(PALE, 0.5);
      ctx.beginPath(); ctx.arc(lp.x * W, lp.y * H, 3, 0, Math.PI * 2); ctx.fill();
    }

    // tap pulses (red loop-closure style)
    var mk = [];
    for (i = 0; i < tapMarks.length; i++) {
      var m = tapMarks[i], mage = t - m.t;
      if (mage > 2.6) continue;
      mk.push(m);
      var mx = m.x * W, my = m.y * H;
      var talpha = 0.85 * Math.exp(-mage * 1.9);
      ctx.strokeStyle = rgba(RED, talpha);
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(mx, my, 3 + mage * 16, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = rgba(RED, Math.min(1, talpha + 0.25));
      ctx.beginPath(); ctx.arc(mx, my, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    tapMarks = mk;
  }

  // ---------- boot ----------
  resize();
  figures = makeFigures(858190);
  draw(0);
  function tick() {
    draw(nowT());
    requestAnimationFrame(tick);
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
