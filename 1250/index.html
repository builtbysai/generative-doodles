<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Greeting Algorithm</title>
<style>
  html, body { margin: 0; padding: 0; background: #EFE6D4; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1250 "Greeting Algorithm" - Jenna Maurice study block JM3.
   After Maurice's Forming an Affectionate Relationship with the
   Seemingly Unaffectionate (the saguaro hugs) and her mimicry method:
   relationships with landscape, built non-verbally. A small soft body
   crosses a pale desert, leans its whole side against a saguaro and
   holds the hug for the better part of half a minute; then it walks
   to a boulder, climbs a little way up the slope's base and lies
   along it, mirroring the angle. Never the top. Never a conquest.
   The gestures repeat, slightly different every cycle - lean, hold
   time and pace all hashed per greeting. The agent has no face: it
   is a body, not a mascot. Drag near the agent to change which
   feature it greets next; tap to hold the hug (the agent's clock
   pauses, the desert does not); double-tap reseeds the landscape.
   Silent; flat fills only; seeded hashes only. */

var T0 = 26;                   // fixed first-frame phase: mid first hug
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

var PAL = {
  sky: '#EFE6D4', skyLow: '#EADFC6',
  sand: '#D6B981', sandFar: '#E2CC96', sandNear: '#C9AB6B',
  sandSpeck: '#BFA05E', shadow: '#C2A468',
  green: '#6B7F4E', greenDark: '#57693E', greenLight: '#82955F',
  rock: '#8A8177', rockLight: '#9D9587', rockDark: '#71685C',
  agent: '#C98A7D', agentDark: '#B2766A'
};

/* ---------- seeded hash (integer, deterministic) ---------- */
function ih(a, b) {
  var x = ((a | 0) * 374761393 + (b | 0) * 668265263) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function sstep(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function seedBase() { return 1250 + salt * 7919; }

/* ---------- time ---------- */
function perfNow() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
}
var startPerf = perfNow();
function pieceNow() { return T0 + (perfNow() - startPerf); }

/* ---------- interaction state (recorded, never integrated) ----------
   salt:        double-tap reseed count (landscape + schedule flavour)
   runOffset:   piece-time at which the current run's agent clock is 0
   pauses:      closed pause intervals, in piece-time coordinates
   pausedSince: piece-time the current pause began, or null
   flips:       recorded target flips {gc} - a flip retargets every
                greeting AFTER the one in progress when it was made */
var salt = 0;
var runOffset = 0;
var pauses = [];
var pausedSince = null;
var flips = [];

function pausedTotal(u) {
  var s = 0, i, a, b;
  for (i = 0; i < pauses.length; i++) {
    a = Math.max(pauses[i][0], runOffset); b = Math.min(pauses[i][1], u);
    if (b > a) s += b - a;
  }
  if (pausedSince !== null && u > pausedSince) s += u - Math.max(pausedSince, runOffset);
  return s;
}
function agentTime(u) { return u - runOffset - pausedTotal(u); }

/* ---------- layout & landscape ---------- */
function isPhone() {
  var s = window.screen;
  if (s && Math.min(s.width, s.height) < 700) return true;
  return H > W * 1.15;
}
function layout() {
  var phone = isPhone();
  var S = seedBase();
  var jx = (ih(S, 901) - 0.5) * 0.03, jx2 = (ih(S, 902) - 0.5) * 0.03;
  var cactusX = W * ((phone ? 0.27 : 0.30) + jx);
  var cw = clamp(W * 0.036, 24, 46);                    // saguaro column width
  var ch = H * (phone ? 0.30 : 0.355) * (0.94 + 0.12 * ih(S, 903));
  var rockCx = W * ((phone ? 0.71 : 0.735) + jx2);
  var rockW = W * (phone ? 0.36 : 0.215) * (0.92 + 0.16 * ih(S, 904));
  var rockH = H * (phone ? 0.125 : 0.172) * (0.92 + 0.16 * ih(S, 905));
  var bodyH = H * (phone ? 0.080 : 0.084);
  return {
    phone: phone,
    horizon: H * 0.655,
    duneP1: ih(S, 911) * 6.28, duneP2: ih(S, 912) * 6.28,
    duneA1: H * (0.010 + 0.006 * ih(S, 913)), duneA2: H * (0.006 + 0.005 * ih(S, 914)),
    cactusX: cactusX, cw: cw, ch: ch,
    armL: 0.40 + 0.10 * ih(S, 915), armR: 0.55 + 0.10 * ih(S, 916),  // attach heights (frac of ch)
    rockCx: rockCx, rockW: rockW, rockH: rockH,
    bodyH: bodyH, bodyHW: bodyH * 0.35,
    spawnX: W * 0.045
  };
}
function groundY(x, L) {
  return L.horizon + L.duneA1 * Math.sin(x / W * 4.1 + L.duneP1)
                   + L.duneA2 * Math.sin(x / W * 9.7 + L.duneP2);
}
/* boulder slope: lower-left edge, P0 at the base, P1 near the top */
function slopePts(L) {
  var base = groundY(L.rockCx, L) + H * 0.006;
  return {
    x0: L.rockCx - L.rockW * 0.52, y0: base,
    x1: L.rockCx - L.rockW * 0.13, y1: base - L.rockH,
    base: base
  };
}
function slopeTilt(L) {
  var p = slopePts(L);
  return Math.min(0.62, Math.atan2(p.x1 - p.x0, p.y0 - p.y1));
}
function slopePoint(L, s) {
  var p = slopePts(L);
  return { x: lerp(p.x0, p.x1, s), y: lerp(p.y0, p.y1, s) };
}
var SLOPE_S = 0.27;              // agent stops in the slope's lower third

function greetX(target, L) {
  if (target === 0) return L.cactusX + L.cw / 2 + L.bodyHW * 0.78;
  return slopePoint(L, SLOPE_S).x;
}

/* ---------- greeting schedule ----------
   Greetings alternate cactus (0) / boulder (1); a recorded flip
   toggles the target of every greeting after the flipped one.
   All durations derive from hashes of the greeting index. */
function greetTarget(g) {
  var t = g % 2, i;
  for (i = 0; i < flips.length; i++) if (flips[i].gc < g) t ^= 1;
  return t;
}
function greetParams(g) {
  var S = seedBase();
  return {
    target: greetTarget(g),
    hold: 22 + 18 * ih(S, g * 5 + 1),                       // 22-40 s
    speed: 0.030 + 0.012 * ih(S, g * 5 + 3),                // fraction of W per second
    lean: 0.20 + 0.05 * ih(S, g * 5 + 2),                   // cactus lean, radians
    tiltJitter: (ih(S, g * 5 + 4) - 0.5) * 0.06            // boulder tilt variation
  };
}
/* walk path as segments: ground runs follow groundY, slope runs lerp */
function buildWalk(fromTarget, fromX, g, L) {
  var prm = greetParams(g);
  var segs = [];
  function groundSeg(xa, xb) {
    if (Math.abs(xb - xa) < 0.5) return;
    segs.push({ kind: 'g', xa: xa, xb: xb, len: Math.abs(xb - xa) });
  }
  function slopeSeg(down) {       // between slope base and the greet point
    var a = slopePoint(L, 0), b = slopePoint(L, SLOPE_S);
    var len = Math.sqrt((b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y));
    segs.push({ kind: 's', down: down, len: len });
  }
  if (prm.target === 1) {                       // heading to the boulder
    groundSeg(fromX, slopePoint(L, 0).x);
    slopeSeg(false);
  } else if (fromTarget === 1) {                // leaving the boulder
    slopeSeg(true);
    groundSeg(slopePoint(L, 0).x, greetX(0, L));
  } else {                                      // spawn or cactus side
    groundSeg(fromX, greetX(0, L));
  }
  var total = 0, i;
  for (i = 0; i < segs.length; i++) total += segs[i].len;
  return { segs: segs, total: total, dur: total / (prm.speed * W) };
}
function walkPos(walk, d, L) {
  var i, seg, t;
  for (i = 0; i < walk.segs.length; i++) {
    seg = walk.segs[i];
    if (d <= seg.len || i === walk.segs.length - 1) {
      t = seg.len > 0 ? clamp(d / seg.len, 0, 1) : 0;
      if (seg.kind === 'g') {
        var x = lerp(seg.xa, seg.xb, t);
        return { x: x, y: groundY(x, L), slope: 0, dir: seg.xb >= seg.xa ? 1 : -1 };
      }
      var a = slopePoint(L, seg.down ? SLOPE_S : 0), b = slopePoint(L, seg.down ? 0 : SLOPE_S);
      return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), slope: seg.down ? 1 - t : t, dir: 1 };
    }
    d -= seg.len;
  }
  return { x: 0, y: 0, slope: 0, dir: 1 };
}
/* full agent pose at agent-time tau */
function agentPose(tau, L) {
  var g = 0, t = 0, fromTarget = -1, fromX = L.spawnX;
  while (true) {
    var prm = greetParams(g);
    var walk = buildWalk(fromTarget, fromX, g, L);
    var holdStart = t + walk.dur, holdEnd = holdStart + prm.hold;
    if (tau < holdStart) {
      var d = sstep((tau - t) / walk.dur) * walk.total;
      var wp = walkPos(walk, d, L);
      return { mode: 'walk', g: g, target: prm.target, x: wp.x, y: wp.y,
               dir: wp.dir, dist: d, tilt: wp.slope * (slopeTilt(L) + prm.tiltJitter) * 0.55,
               lambda: 0, holdT: 0 };
    }
    if (tau < holdEnd) {
      var he = tau - holdStart;
      var lam = Math.min(sstep(he / 1.2), 1 - sstep((he - (prm.hold - 1.0)) / 1.0));
      var gx = greetX(prm.target, L);
      var gy = prm.target === 0 ? groundY(gx, L) : slopePoint(L, SLOPE_S).y;
      var sway = Math.sin(he * (Math.PI * 2 / 5.3)) * 0.014;
      var tilt = prm.target === 0 ? -(prm.lean + sway) * lam
                                  : (slopeTilt(L) + prm.tiltJitter + sway * 0.6) * lam;
      return { mode: 'hold', g: g, target: prm.target, x: gx, y: gy, dir: 1,
               dist: 0, tilt: tilt, lambda: lam, holdT: he, holdDur: prm.hold };
    }
    fromTarget = prm.target;
    fromX = greetX(prm.target, L);
    t = holdEnd; g++;
  }
}

/* ---------- drawing helpers (each shape its own path) ---------- */
function rect(x, y, w, h) { ctx.fillRect(x, y, w, h); }
function ell(x, y, rx, ry, rot) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function poly(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function line(x1, y1, x2, y2, w) {
  ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

/* ---------- the desert ---------- */
function drawDesert(L) {
  var x, y;
  ctx.fillStyle = PAL.sky; rect(0, 0, W, H);
  ctx.fillStyle = PAL.skyLow; rect(0, L.horizon - H * 0.045, W, H * 0.045);
  // far dune band (lighter), crest above the walk line
  ctx.fillStyle = PAL.sandFar;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (x = 0; x <= W; x += 16) ctx.lineTo(x, groundY(x, L) - H * 0.052 + H * 0.008 * Math.sin(x / W * 3.1 + L.duneP2));
  ctx.lineTo(W, groundY(W, L) - H * 0.052 + H * 0.008 * Math.sin(3.1 + L.duneP2));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  // main ground
  ctx.fillStyle = PAL.sand;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (x = 0; x <= W; x += 16) ctx.lineTo(x, groundY(x, L));
  ctx.lineTo(W, groundY(W, L));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  // near band (deeper), below the walk line
  ctx.fillStyle = PAL.sandNear;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (x = 0; x <= W; x += 16) ctx.lineTo(x, groundY(x, L) + H * 0.115 + H * 0.010 * Math.sin(x / W * 5.3 + L.duneP1));
  ctx.lineTo(W, groundY(W, L) + H * 0.115 + H * 0.010 * Math.sin(5.3 + L.duneP1));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  // speckles on the near band
  ctx.fillStyle = PAL.sandSpeck;
  var S = seedBase(), i, sx, sy;
  for (i = 0; i < 90; i++) {
    sx = ih(S, 500 + i * 2) * W;
    sy = groundY(sx, L) + H * 0.13 + ih(S, 501 + i * 2) * H * 0.20;
    if (sy < H - 2) rect(sx, sy, 2.2, 1.4);
  }
}
function drawSaguaro(L) {
  var cx = L.cactusX, base = groundY(cx, L) + 2, cw = L.cw, ch = L.ch;
  var top = base - ch, r = cw / 2;
  ctx.fillStyle = PAL.shadow; ell(cx, base + H * 0.004, cw * 1.15, H * 0.006, 0);
  ctx.fillStyle = PAL.green;
  // arms first (column covers the joints): stub + rising capsule
  function arm(side, attach, rise) {
    var ay = base - ch * attach, out = cw * 1.02, aw = cw * 0.60;
    var ex = cx + side * (r + out);
    rect(Math.min(cx + side * r, ex), ay - aw * 0.5, Math.abs(ex - (cx + side * r)) + aw * 0.5, aw);
    ctx.beginPath();
    ctx.moveTo(ex - aw / 2, ay + aw * 0.4);
    ctx.lineTo(ex - aw / 2, ay - rise + aw / 2);
    ctx.arc(ex, ay - rise + aw / 2, aw / 2, Math.PI, 0);
    ctx.lineTo(ex + aw / 2, ay + aw * 0.4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = PAL.greenDark; ctx.globalAlpha = 0.4;
    line(ex, ay - rise + aw * 0.7, ex, ay + aw * 0.2, Math.max(1.2, cw * 0.055));
    ctx.globalAlpha = 1;
  }
  arm(-1, L.armL, ch * 0.30);
  arm(1, L.armR, ch * 0.34);
  // column
  ctx.beginPath();
  ctx.moveTo(cx - r, base);
  ctx.lineTo(cx - r, top + r);
  ctx.arc(cx, top + r, r, Math.PI, 0);
  ctx.lineTo(cx + r, base);
  ctx.closePath(); ctx.fill();
  // light side + ribs
  ctx.fillStyle = PAL.greenLight; ctx.globalAlpha = 0.35;
  poly([cx + r * 0.34, base, cx + r * 0.34, top + r * 1.15, cx + r * 0.78, top + r * 0.55, cx + r * 0.86, base]);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = PAL.greenDark; ctx.globalAlpha = 0.4;
  line(cx - r * 0.42, base - ch * 0.06, cx - r * 0.42, top + r * 1.25, Math.max(1.2, cw * 0.055));
  line(cx + r * 0.05, base - ch * 0.06, cx + r * 0.05, top + r * 1.05, Math.max(1.2, cw * 0.055));
  ctx.globalAlpha = 1;
}
function drawBoulder(L) {
  var p = slopePts(L), cx = L.rockCx, bw = L.rockW, bh = L.rockH, base = p.base;
  ctx.fillStyle = PAL.shadow; ell(cx, base + H * 0.005, bw * 0.52, H * 0.007, 0);
  ctx.fillStyle = PAL.rock;
  ctx.beginPath();
  ctx.moveTo(p.x0, p.y0);
  ctx.quadraticCurveTo(p.x1 - bw * 0.05, p.y1 - bh * 0.10, cx - bw * 0.05, p.y1 - bh * 0.03);
  ctx.quadraticCurveTo(cx + bw * 0.34, p.y1 + bh * 0.02, cx + bw * 0.50, base - bh * 0.16);
  ctx.quadraticCurveTo(cx + bw * 0.55, base - bh * 0.04, cx + bw * 0.46, base);
  ctx.closePath(); ctx.fill();
  // facets: light upper-left, dark lower-right
  ctx.fillStyle = PAL.rockLight;
  poly([p.x0 + bw * 0.03, p.y0 - bh * 0.10, p.x1 + bw * 0.02, p.y1 + bh * 0.06,
        cx + bw * 0.10, p.y1 + bh * 0.10, cx - bw * 0.16, base - bh * 0.42]);
  ctx.fillStyle = PAL.rockDark;
  poly([cx + bw * 0.10, base, cx + bw * 0.46, base, cx + bw * 0.50, base - bh * 0.16,
        cx + bw * 0.22, base - bh * 0.30]);
}

/* ---------- the agent ----------
   Local coords: origin at the feet, body rises to -h. The blob's
   control points morph: flatL flattens the contact (left) side for
   the cactus hug, flatB flattens the underside for the slope lie. */
function blobPath(w, h, flatL, flatB) {
  var lx = function (round, flat) { return lerp(round, flat, flatL); };
  var by = function (round, flat) { return lerp(round, flat, flatB); };
  ctx.beginPath();
  ctx.moveTo(lx(-w, -w * 0.94), by(-h * 0.03, -h * 0.10));
  ctx.bezierCurveTo(lx(-w * 1.09, -w * 0.97), by(-h * 0.40, -h * 0.40),
                    lx(-w * 0.80, -w * 0.93), -h * 0.72, -w * 0.36, -h * 0.92);
  ctx.quadraticCurveTo(0, -h * 1.01, w * 0.36, -h * 0.92);
  ctx.bezierCurveTo(w * 0.80, -h * 0.72, w * 1.09, -h * 0.40, w, by(-h * 0.03, -h * 0.10));
  ctx.quadraticCurveTo(0, by(h * 0.05, -h * 0.075), lx(-w, -w * 0.94), by(-h * 0.03, -h * 0.10));
  ctx.closePath();
}
function drawAgent(pose, L) {
  var h = L.bodyH, w = L.bodyHW;
  var walking = pose.mode === 'walk';
  // ground shadow (not while lying on the slope)
  if (!(pose.target === 1 && pose.mode === 'hold')) {
    ctx.fillStyle = PAL.shadow; ctx.globalAlpha = 0.55;
    ell(pose.x, pose.y + H * 0.004, w * 1.2, h * 0.055, 0);
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.translate(pose.x, pose.y);
  // feet: planted flat on the ground, or aligned to the body on the slope
  var feetTilt = (pose.mode === 'hold' && pose.target === 1) ? pose.tilt : 0;
  ctx.save();
  ctx.rotate(feetTilt);
  ctx.fillStyle = PAL.agentDark;
  var stepA = 0, stepB = 0;
  if (walking) {
    var ph = pose.dist / (h * 0.42) * Math.PI;
    stepA = Math.max(0, Math.sin(ph)) * h * 0.075;
    stepB = Math.max(0, Math.sin(ph + Math.PI)) * h * 0.075;
  }
  ell(-w * 0.40, -stepA - h * 0.002, w * 0.37, h * 0.060, 0);
  ell(w * 0.40, -stepB - h * 0.002, w * 0.37, h * 0.060, 0);
  ctx.restore();
  // body
  var bob = walking ? Math.abs(Math.sin(pose.dist / (h * 0.42) * Math.PI)) * h * 0.035 : 0;
  var breath = pose.mode === 'hold' ? 1 + Math.sin(pose.holdT * (Math.PI * 2 / 4.6)) * 0.012 * pose.lambda : 1;
  var flatL = pose.target === 0 ? pose.lambda : 0;
  var flatB = pose.target === 1 ? pose.lambda : 0;
  var sqX = (1 - 0.10 * flatL) * breath;
  ctx.translate(0, -bob);
  ctx.rotate(pose.tilt + (walking ? 0.035 * pose.dir : 0));
  ctx.scale(sqX, (1 - 0.10 * flatB) * breath);
  blobPath(w, h, flatL, flatB);
  ctx.fillStyle = PAL.agent; ctx.fill();
  ctx.save();
  blobPath(w, h, flatL, flatB); ctx.clip();
  ctx.fillStyle = PAL.agentDark; ctx.globalAlpha = 0.30;
  ell(w * 0.52, -h * 0.28, w * 0.62, h * 0.55, 0);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------- frame ---------- */
function draw(tau) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var L = layout();
  drawDesert(L);
  drawSaguaro(L);
  drawBoulder(L);
  drawAgent(agentPose(tau, L), L);
}

/* ---------- interaction ---------- */
var dragging = false, dragMoved = false, dragFlipped = false, nearAgent = false,
    downX = 0, downY = 0, downT = 0, lastTapT = -10;
function agentScreenPos() {
  var L = layout();
  var pose = agentPose(agentTime(pieceNow()), L);
  return { x: pose.x, y: pose.y - L.bodyH * 0.5, g: pose.g, mode: pose.mode };
}
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; dragMoved = false; dragFlipped = false;
  downX = e.clientX; downY = e.clientY; downT = perfNow();
  var ap = agentScreenPos();
  var dx = e.clientX - ap.x, dy = e.clientY - ap.y;
  nearAgent = Math.sqrt(dx * dx + dy * dy) < 0.25 * Math.min(W, H);
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  if (Math.abs(e.clientX - downX) > 6 || Math.abs(e.clientY - downY) > 6) dragMoved = true;
  if (dragMoved && nearAgent && !dragFlipped) {
    dragFlipped = true;
    flips.push({ gc: agentScreenPos().g });      // retargets later greetings
  }
});
function endPointer(e) {
  if (!dragging) return; dragging = false;
  if (dragMoved) { lastTapT = -10; return; }
  var now = perfNow();
  if (now - downT > 0.5) return;
  var u = pieceNow();
  if (now - lastTapT < 0.34) {                   // double-tap: reseed
    salt++; runOffset = u; pauses = []; pausedSince = null; flips = [];
    lastTapT = -10; return;
  }
  lastTapT = now;
  if (pausedSince === null) pausedSince = u;     // tap: hold the hug
  else { pauses.push([pausedSince, u]); pausedSince = null; }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- sizing: Visual Viewport API ---------- */
function resize() {
  var vv = window.visualViewport;
  W = Math.floor(vv ? vv.width : window.innerWidth);
  H = Math.floor(vv ? vv.height : window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(agentTime(pieceNow())); });
window.addEventListener('resize', function () { resize(); draw(agentTime(pieceNow())); });
