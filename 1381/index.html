<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vertigo Re-read</title>
<style>
  html, body { margin: 0; padding: 0; background: #101a18; overflow: hidden; height: 100%; }
  canvas { display: block; background: #101a18; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1381000);

  var TEAL = '#0f5f56', RUST = '#a34a1f', CREAM = '#e8dcc0', INK = '#101a18', PIT = '#0a0f0d';

  var W = 0, H = 0, CX = 0, CY = 0, RMAX = 0, PHONE = false;
  var currentT = 0;
  var booted = false;

  function sizeFromViewport() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    CX = w / 2; CY = h / 2;
    var minDim = Math.min(w, h);
    PHONE = false;
    try {
      var sw = window.screen.width, sh = window.screen.height;
      if (Math.min(sw, sh) < 700) PHONE = true;
    } catch (e) { /* ignore */ }
    if (!PHONE && h > w * 1.15) PHONE = true;
    RMAX = minDim * (PHONE ? 0.48 : 0.46);
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }

  // ---- Seeded particle field: closed-form spiral positions of piece time ----
  var PARTICLES = [];
  var PCOLORS = [TEAL, TEAL, RUST, CREAM, CREAM, RUST];
  for (var i = 0; i < 150; i++) {
    PARTICLES.push({
      arm: rnd() * Math.PI * 2,
      off: rnd(),
      period: 9 + rnd() * 11,
      size: 1.5 + rnd() * 2.2,
      color: PCOLORS[Math.floor(rnd() * PCOLORS.length)]
    });
  }

  function particlePos(p, t, handed, tight) {
    var ph = (t / p.period + p.off) % 1;
    if (ph < 0) ph += 1;
    var r = RMAX * (0.16 + 0.84 * Math.exp(-1.7 * ph));
    var a = p.arm + handed * ph * 4.5 * Math.PI * tight;
    return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r, ph: ph };
  }

  // ---- Seeded glyph field: rings accreting outer -> inward ----
  var GLYPHS = [];
  var GTYPES = ['chevron', 'triangle', 'cross', 'arc', 'dotpair', 'tick', 'diamond', 'hook'];
  var RING_FRACS = [0.92, 0.76, 0.60, 0.45, 0.31];
  for (var ring = 0; ring < 5; ring++) {
    var count = 10 + ring;
    for (var g = 0; g < count; g++) {
      GLYPHS.push({
        ring: ring,
        angle: rnd() * Math.PI * 2,
        type: GTYPES[Math.floor(rnd() * GTYPES.length)],
        size: 7 + rnd() * 7,
        color: (rnd() < 0.55) ? RUST : CREAM,
        phase: rnd() * 40,
        period: 40
      });
    }
  }

  function glyphAlpha(gl, t) {
    // Ring delay: outer rings appear first, inner rings follow.
    var wave = (t + gl.phase - gl.ring * 4) % gl.period;
    if (wave < 0) wave += gl.period;
    if (wave < 6) return wave / 6;
    if (wave < 26) return 1;
    if (wave < 32) return 1 - (wave - 26) / 6;
    return 0;
  }

  function drawGlyph(type, x, y, s, color) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1, s * 0.14);
    ctx.beginPath();
    if (type === 'chevron') {
      ctx.moveTo(x - s, y - s * 0.6); ctx.lineTo(x, y + s * 0.4); ctx.lineTo(x + s, y - s * 0.6);
    } else if (type === 'triangle') {
      ctx.moveTo(x, y - s); ctx.lineTo(x + s, y + s * 0.7); ctx.lineTo(x - s, y + s * 0.7); ctx.closePath();
    } else if (type === 'cross') {
      ctx.moveTo(x - s, y); ctx.lineTo(x + s, y); ctx.moveTo(x, y - s); ctx.lineTo(x, y + s);
    } else if (type === 'arc') {
      ctx.arc(x, y, s * 0.8, Math.PI * 0.15, Math.PI * 1.1);
    } else if (type === 'dotpair') {
      ctx.moveTo(x - s * 0.7, y); ctx.arc(x - s * 0.7, y, s * 0.22, 0, Math.PI * 2);
      ctx.moveTo(x + s * 0.7, y); ctx.arc(x + s * 0.7, y, s * 0.22, 0, Math.PI * 2);
    } else if (type === 'tick') {
      ctx.moveTo(x - s * 0.4, y + s); ctx.lineTo(x + s * 0.4, y - s);
    } else if (type === 'diamond') {
      ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.7, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s * 0.7, y); ctx.closePath();
    } else if (type === 'hook') {
      ctx.moveTo(x - s, y - s * 0.5); ctx.lineTo(x - s, y + s * 0.5); ctx.lineTo(x + s * 0.6, y + s * 0.5);
    }
    ctx.stroke();
    if (type === 'dotpair') {
      ctx.beginPath(); ctx.moveTo(x - s * 0.7 + s * 0.22, y); ctx.arc(x - s * 0.7, y, s * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + s * 0.7 + s * 0.22, y); ctx.arc(x + s * 0.7, y, s * 0.22, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---- Drag state: closed-form sum over recorded drag samples ----
  var dragSamples = []; // {dx, t}
  var lastX = null;
  var DRAG_TAU = 4;

  function dragState(t) {
    var d = 0;
    for (var i = 0; i < dragSamples.length; i++) {
      var s = dragSamples[i];
      d += s.dx * Math.exp(-(t - s.t) / DRAG_TAU);
    }
    if (Math.abs(d) < 2) d = 0; // snap negligible residue to base, so the loop resumes exactly
    var handed = (d < -80) ? -1 : 1;
    var tight = 1 + Math.max(-0.5, Math.min(0.8, d / 600));
    return { d: d, handed: handed, tight: tight };
  }

  function onDown(e) {
    lastX = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
  }
  function onMove(e) {
    var x = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
    if (lastX === null || x === undefined) return;
    var dx = x - lastX;
    lastX = x;
    if (dx !== 0) dragSamples.push({ dx: dx, t: currentT });
    if (dragSamples.length > 400) dragSamples.splice(0, dragSamples.length - 400);
  }
  function onUp() { lastX = null; }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function draw(t) {
    currentT = t;
    sizeFromViewport();
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);

    var ds = dragState(t);
    var handed = ds.handed, tight = ds.tight;

    // Guide arms: logarithmic spirals, fixed scale, never zooming.
    ctx.lineWidth = 1;
    var ARM_COLORS = [TEAL, RUST, CREAM, TEAL];
    var ARM_ALPHAS = [0.30, 0.24, 0.15, 0.30];
    for (var arm = 0; arm < 4; arm++) {
      var base = arm * (Math.PI * 2 / 4);
      ctx.strokeStyle = ARM_COLORS[arm];
      ctx.globalAlpha = ARM_ALPHAS[arm];
      ctx.beginPath();
      var first = true;
      for (var th = 0; th <= Math.PI * 4; th += 0.15) {
        var rr = RMAX * Math.exp(-0.32 * th);
        var aa = base + handed * th;
        var px = CX + Math.cos(aa) * rr, py = CY + Math.sin(aa) * rr;
        if (first) { ctx.moveTo(px, py); first = false; } else { ctx.lineTo(px, py); }
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Particle traces: short closed-form trail segments, one beginPath each.
    for (var i = 0; i < PARTICLES.length; i++) {
      var p = PARTICLES[i];
      var pos = particlePos(p, t, handed, tight);
      if (pos.ph > 0.02) {
        var ph2 = pos.ph - 0.015;
        var r2 = RMAX * (0.16 + 0.84 * Math.exp(-1.7 * ph2));
        var a2 = p.arm + handed * ph2 * 4.5 * Math.PI * tight;
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = Math.max(1, p.size * 0.7);
        ctx.beginPath();
        ctx.moveTo(CX + Math.cos(a2) * r2, CY + Math.sin(a2) * r2);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(pos.x + p.size, pos.y);
      ctx.arc(pos.x, pos.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Glyph rings: alpha envelopes, outer rings first.
    for (var gi = 0; gi < GLYPHS.length; gi++) {
      var gl = GLYPHS[gi];
      var alpha = glyphAlpha(gl, t);
      if (alpha <= 0) continue;
      var gr = RMAX * RING_FRACS[gl.ring];
      var gx = CX + Math.cos(gl.angle) * gr;
      var gy = CY + Math.sin(gl.angle) * gr;
      ctx.globalAlpha = alpha * 0.9;
      drawGlyph(gl.type, gx, gy, gl.size, gl.color);
      ctx.globalAlpha = 1;
    }

    // The dark pit at the center.
    ctx.fillStyle = PIT;
    ctx.beginPath();
    ctx.moveTo(CX + RMAX * 0.12, CY);
    ctx.arc(CX, CY, RMAX * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = RUST;
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(CX + RMAX * 0.12, CY);
    ctx.arc(CX, CY, RMAX * 0.12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function resize() {
    draw(currentT);
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // Frame one: synchronous, constant phase.
  draw(0);
  booted = true;

  // Animation loop: plain function declaration, typeof-guarded.
  var loopStart = null;
  function loop(ts) {
    if (loopStart === null) loopStart = ts;
    draw((ts - loopStart) / 1000);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
