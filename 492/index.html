<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Exploded Serif</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var BLACK = '#0A0A0A';
  var WHITE = '#FFFFFF';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 300, H = 300, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? Math.round(vv.width) : window.innerWidth;
    H = vv ? Math.round(vv.height) : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);
  resize();

  // ---- seeded RNG (mulberry32) ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- parametric serif-capital construction ----
  // Local letter space: y from 0 (cap top) to 1 (baseline), x from 0 to LW.

  function vStem(cx, w, s, y0, y1) {
    y0 = (y0 === undefined) ? 0 : y0;
    y1 = (y1 === undefined) ? 1 : y1;
    var l = cx - w / 2, r = cx + w / 2, f = s;
    return [[
      [l - f, y0], [r + f, y0], [r + f, y0 + f * 0.6], [r, y0 + f * 2.2],
      [r, y1 - f * 2.2], [r + f, y1 - f * 0.6], [r + f, y1], [l - f, y1],
      [l - f, y1 - f * 0.6], [l, y1 - f * 2.2], [l, y0 + f * 2.2], [l - f, y0 + f * 0.6]
    ]];
  }

  function rect(x0, y0, x1, y1) {
    return [[[x0, y0], [x1, y0], [x1, y1], [x0, y1]]];
  }

  // horizontal arm with a slight serif point at its free (right) end
  function arm(x0, y0, x1, y1) {
    var cy = (y0 + y1) / 2;
    return [[[x0, y0], [x1 - 0.015, y0], [x1 + 0.035, cy], [x1 - 0.015, y1], [x0, y1]]];
  }

  // diagonal stem: width w, end flare f (polygon only, never rotated at runtime)
  function diag(x0, y0, x1, y1, w, f) {
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / len, uy = dy / len;
    var px = -uy, py = ux;
    var hw = w / 2, fw = w / 2 + f;
    var ax = x0 - ux * f * 0.9, ay = y0 - uy * f * 0.9;
    var bx = x1 + ux * f * 0.9, by = y1 + uy * f * 0.9;
    return [[
      [ax + px * fw, ay + py * fw], [x0 + px * hw, y0 + py * hw],
      [x1 + px * hw, y1 + py * hw], [bx + px * fw, by + py * fw],
      [bx - px * fw, by - py * fw], [x1 - px * hw, y1 - py * hw],
      [x0 - px * hw, y0 - py * hw], [ax - px * fw, ay - py * fw]
    ]];
  }

  // Each letter: LW = local width; frags = { paths, dir, mag:[min,max] }.
  var LETTERS = {
    A: { LW: 0.98, frags: [
      { paths: [[[0.40, 0.0], [0.58, 0.0], [0.545, 0.08], [0.435, 0.08]]], dir: [0, -1], mag: [0.05, 0.09] },
      { paths: diag(0.47, 0.03, 0.07, 1.0, 0.155, 0.025), dir: [-0.85, 0.3], mag: [0.07, 0.15] },
      { paths: diag(0.51, 0.03, 0.91, 1.0, 0.155, 0.025), dir: [0.85, 0.3], mag: [0.07, 0.15] },
      { paths: rect(0.315, 0.615, 0.665, 0.685), dir: [0.1, 1], mag: [0.04, 0.08] }
    ]},
    E: { LW: 0.68, frags: [
      { paths: vStem(0.115, 0.17, 0.045), dir: [-1, 0.05], mag: [0.07, 0.14] },
      { paths: arm(0.10, 0.0, 0.60, 0.095), dir: [0.65, -0.75], mag: [0.06, 0.12] },
      { paths: arm(0.10, 0.455, 0.52, 0.545), dir: [1, 0], mag: [0.06, 0.13] },
      { paths: arm(0.10, 0.905, 0.62, 1.0), dir: [0.65, 0.75], mag: [0.06, 0.12] }
    ]},
    H: { LW: 0.76, frags: [
      { paths: vStem(0.115, 0.17, 0.045), dir: [-1, 0.1], mag: [0.07, 0.15] },
      { paths: vStem(0.645, 0.17, 0.045), dir: [1, 0.1], mag: [0.07, 0.15] },
      { paths: rect(0.20, 0.465, 0.56, 0.545), dir: [0, 1], mag: [0.04, 0.08] }
    ]},
    M: { LW: 0.92, frags: [
      { paths: vStem(0.105, 0.165, 0.045), dir: [-1, 0], mag: [0.07, 0.14] },
      { paths: vStem(0.815, 0.165, 0.045), dir: [1, 0], mag: [0.07, 0.14] },
      { paths: diag(0.205, 0.02, 0.46, 0.52, 0.135, 0.02), dir: [-0.35, -1], mag: [0.05, 0.11] },
      { paths: diag(0.46, 0.52, 0.715, 0.02, 0.135, 0.02), dir: [0.35, -1], mag: [0.05, 0.11] }
    ]},
    R: { LW: 0.70, frags: [
      { paths: vStem(0.115, 0.17, 0.045), dir: [-1, 0.05], mag: [0.07, 0.14] },
      { paths: [
          [[0.10, 0.0], [0.46, 0.0], [0.575, 0.06], [0.625, 0.16], [0.625, 0.33], [0.575, 0.45], [0.46, 0.52], [0.10, 0.52]],
          [[0.275, 0.135], [0.435, 0.135], [0.485, 0.19], [0.485, 0.30], [0.435, 0.375], [0.275, 0.375]]
        ], evenOdd: true, dir: [0.85, -0.45], mag: [0.06, 0.13] },
      { paths: diag(0.40, 0.50, 0.66, 1.0, 0.15, 0.03), dir: [0.7, 0.7], mag: [0.06, 0.13] }
    ]},
    T: { LW: 0.88, frags: [
      { paths: rect(0.02, 0.0, 0.445, 0.10), dir: [-0.8, -0.6], mag: [0.06, 0.12] },
      { paths: rect(0.435, 0.0, 0.86, 0.10), dir: [0.8, -0.6], mag: [0.06, 0.12] },
      { paths: vStem(0.44, 0.165, 0.045, 0.07, 1.0), dir: [0, 1], mag: [0.05, 0.11] }
    ]}
  };
  var ORDER = ['A', 'E', 'H', 'M', 'R', 'T'];

  // ---- state ----
  var seed = 49204;
  var letterName = 'A';
  var frags = []; // {def, homeX, homeY, x, y, vx, vy}

  function buildLetter(name, fromAssembled) {
    var def = LETTERS[name];
    var rng = mulberry32(seed);
    frags = def.frags.map(function (fd) {
      var dl = Math.sqrt(fd.dir[0] * fd.dir[0] + fd.dir[1] * fd.dir[1]) || 1;
      var jitter = (rng() - 0.5) * 0.55;
      var ca = Math.cos(jitter), sa = Math.sin(jitter);
      var dx = (fd.dir[0] / dl) * ca - (fd.dir[1] / dl) * sa;
      var dy = (fd.dir[0] / dl) * sa + (fd.dir[1] / dl) * ca;
      var mag = fd.mag[0] + rng() * (fd.mag[1] - fd.mag[0]);
      return {
        def: fd,
        homeX: dx * mag, homeY: dy * mag, // in letter units
        x: fromAssembled ? 0 : dx * mag,
        y: fromAssembled ? 0 : dy * mag,
        vx: 0, vy: 0
      };
    });
  }
  buildLetter('A', false);

  function reseed() {
    seed = seed + 1;
    var rng = mulberry32(seed * 31 + 7);
    var idx = Math.floor(rng() * ORDER.length);
    var name = ORDER[idx];
    if (name === letterName) name = ORDER[(idx + 1) % ORDER.length];
    letterName = name;
    buildLetter(name, true); // fragments fly out from the assembled letter
  }

  // ---- interaction ----
  var dragging = false;
  var dragSX = 0, dragSY = 0, dragX = 0, dragY = 0;
  var downT = 0, downX = 0, downY = 0, lastTapT = -1000, lastTapX = 0, lastTapY = 0;

  function ptr(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function onDown(e) {
    var p = ptr(e);
    dragging = true;
    dragSX = dragX = p.x; dragSY = dragY = p.y;
    downT = performance.now(); downX = p.x; downY = p.y;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = ptr(e);
    dragX = p.x; dragY = p.y;
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var now = performance.now();
    var moved = Math.sqrt((dragX - downX) * (dragX - downX) + (dragY - downY) * (dragY - downY));
    if (moved < 8 && now - downT < 400) {
      var dt = now - lastTapT;
      var dd = Math.sqrt((downX - lastTapX) * (downX - lastTapX) + (downY - lastTapY) * (downY - lastTapY));
      if (dt < 350 && dd < 40) {
        reseed();
        lastTapT = -1000;
      } else {
        lastTapT = now; lastTapX = downX; lastTapY = downY;
      }
    }
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);

  // ---- physics: spring-damper per fragment, translation only ----
  function step(dt) {
    var minDim = Math.min(W, H);
    var dvx = dragging ? (dragX - dragSX) : 0;
    var dvy = dragging ? (dragY - dragSY) : 0;
    var dLen = Math.sqrt(dvx * dvx + dvy * dvy);
    var boost = Math.min(dLen / (0.35 * minDim), 1); // how hard the drag pulls
    var K = 130, C = 8.5; // underdamped: elastic snap-back
    for (var i = 0; i < frags.length; i++) {
      var f = frags[i];
      var unit = letterUnit();
      var hx = f.homeX * unit, hy = f.homeY * unit;
      var hl = Math.sqrt(hx * hx + hy * hy) || 1;
      var align = dLen > 0 ? ((hx / hl) * (dvx / dLen) + (hy / hl) * (dvy / dLen)) : 0;
      var pull = 0.25 + 0.75 * Math.max(0, align);
      var tx = hx * (1 + 0.85 * boost * pull) + dvx * 0.22 * pull;
      var ty = hy * (1 + 0.85 * boost * pull) + dvy * 0.22 * pull;
      f.vx += ((tx - f.x * unit) * K - f.vx * C) * dt;
      f.vy += ((ty - f.y * unit) * K - f.vy * C) * dt;
      f.x += (f.vx * dt) / unit;
      f.y += (f.vy * dt) / unit;
    }
  }

  function letterUnit() {
    var def = LETTERS[letterName];
    var byH = 0.80 * H;
    // width budget reserves room for exploded offsets and serif flares
    // so no fragment can leave the frame on narrow screens
    var byW = (0.96 * W) / (def.LW + 0.44);
    return Math.min(byH, byW);
  }

  // ---- draw ----
  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    var def = LETTERS[letterName];
    var unit = letterUnit();
    var cx = W / 2, cy = H / 2;
    var ox = cx - (def.LW / 2) * unit;
    var oy = cy - unit / 2;

    // one faint 1px axis line through the displacement origin
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - unit * 0.72, Math.round(cy) + 0.5);
    ctx.lineTo(cx + unit * 0.72, Math.round(cy) + 0.5);
    ctx.stroke();

    ctx.fillStyle = WHITE;
    for (var i = 0; i < frags.length; i++) {
      var f = frags[i];
      var fx = ox + f.x * unit, fy = oy + f.y * unit;
      ctx.beginPath();
      for (var s = 0; s < f.def.paths.length; s++) {
        var pts = f.def.paths[s];
        for (var p = 0; p < pts.length; p++) {
          var X = fx + pts[p][0] * unit, Y = fy + pts[p][1] * unit;
          if (p === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
        }
        ctx.closePath();
      }
      if (f.def.evenOdd) ctx.fill('evenodd'); else ctx.fill();
    }

    // hint
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    ctx.font = '12px system-ui, -apple-system, sans-serif';
    ctx.fillText('drag', 14, H - 14);
  }

  // synchronous first frame: fragments at their seeded exploded positions
  draw();

  var last = null;
  function frame(ts) {
    if (last === null) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.033);
    last = ts;
    if (dt > 0) step(dt);
    draw();
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
