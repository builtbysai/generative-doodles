<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Banks of Reverb</title>
<style>
html, body { margin: 0; padding: 0; background: #0E1B17; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0E1B17';
var PLATE = '#132420';
var PLATE_LINE = 'rgba(245,239,226,0.35)';
var TITLE_INK = '#F5EFE2';
var HINT_INK = '#8FC7BB';
var SOURCE = '#F5EFE2';
var TEAL = '#5BC8B8';
var AMBER = '#D99A3A';
var FRAME_T = 60.0;
var PULSE_EVERY = 4.0;
var FAST_LIFE = 6.0;   /* fast bank: expands in 2.5 s, gone by 6 s */
var FAST_EXPAND = 2.5;
var SLOW_LIFE = 16.0;  /* slow bank: expands in 10 s, lingers to 16 s */
var SLOW_EXPAND = 10.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* slow noise: two drifting slider values in [0,1], deterministic in t */
function sliderNoise(t, a, b, c) {
  return 0.5 + 0.5 * (0.6 * Math.sin(t * a + b) + 0.4 * Math.sin(t * c + a * 3.1));
}
function liveliness(t) { return sliderNoise(t, 0.11, 0.7, 0.043); }
function lengthVal(t) { return sliderNoise(t, 0.07, 2.3, 0.031); }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* centered square composition; the longest rings catch the frame edges */
function squareRect() {
  var margin = isPhone ? 56 : 96;
  var side = Math.min(VW, VH) - margin;
  if (side < 120) side = Math.max(120, Math.min(VW, VH) - 24);
  return { x: (VW - side) / 2, y: (VH - side) / 2, s: side, cx: VW / 2, cy: VH / 2 };
}
function drawRing(cx, cy, r, color, alpha, width) {
  if (r <= 0 || alpha <= 0.001) return;
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.strokeStyle = rgba(color, alpha);
  ctx.lineWidth = width;
  ctx.stroke();
}
function drawBank(cx, cy, maxR, age, life, expand, color, peakAlpha, width, echoCount, echoGap) {
  var k, e;
  for (e = 0; e < echoCount; e++) {
    var a = age - e * echoGap;
    if (a < 0 || a > life) continue;
    var grow = clamp(a / expand, 0, 1);
    var r = maxR * (0.12 + 0.88 * grow * grow * (3 - 2 * grow));
    var fade = 1 - a / life;
    var alpha = peakAlpha * fade * fade * (1 - e * 0.22);
    drawRing(cx, cy, r, color, alpha, width * (1 - e * 0.15));
  }
}
function drawSliders(sq) {
  var live = liveliness(phaseT);
  var len = lengthVal(phaseT);
  var w = Math.min(sq.s * 0.62, 300);
  var x0 = (VW - w) / 2;
  var y0 = sq.y + sq.s + (isPhone ? 12 : 18);
  var rows = [
    { label: 'liveliness', v: live, color: TEAL },
    { label: 'length', v: len, color: AMBER }
  ];
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = (isPhone ? 10 : 11) + 'px monospace';
  var i, row, y;
  for (i = 0; i < rows.length; i++) {
    row = rows[i];
    y = y0 + i * (isPhone ? 15 : 17);
    ctx.fillStyle = rgba(TITLE_INK, 0.55);
    ctx.fillText(row.label, x0, y);
    var trackX = x0 + 78;
    var trackW = w - 78;
    ctx.fillStyle = rgba(TITLE_INK, 0.22);
    ctx.fillRect(trackX, y - 0.5, trackW, 1);
    var tx = trackX + row.v * trackW;
    ctx.beginPath();
    ctx.moveTo(tx + 4, y);
    ctx.arc(tx, y, 4, 0, TAU);
    ctx.fillStyle = rgba(row.color, 0.9);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tx + 8, y);
    ctx.arc(tx, y, 8, 0, TAU);
    ctx.strokeStyle = rgba(row.color, 0.25);
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var sq = squareRect();
  var maxR = sq.s * 0.66;
  var live = liveliness(phaseT);
  var len = lengthVal(phaseT);
  /* slider values modulate decay length: liveliness shortens the fast bank,
     length stretches the slow bank */
  var fastLife = FAST_LIFE * (0.7 + 0.6 * live);
  var slowLife = SLOW_LIFE * (0.7 + 0.6 * len);
  var t = phaseT;
  var firstPulse = Math.floor(t / PULSE_EVERY) * PULSE_EVERY;
  var p, age;
  ctx.globalCompositeOperation = 'lighter';
  /* oldest pulses first so newer rings bloom over older ones */
  for (p = firstPulse - 4 * PULSE_EVERY; p <= firstPulse; p += PULSE_EVERY) {
    age = t - p;
    if (age < 0) continue;
    drawBank(sq.cx, sq.cy, maxR, age, slowLife, SLOW_EXPAND, AMBER, 0.30, 5, 3, 0.45);
    drawBank(sq.cx, sq.cy, maxR, age, fastLife, FAST_EXPAND, TEAL, 0.42, 4, 3, 0.12);
  }
  ctx.globalCompositeOperation = 'source-over';
  /* source: a warm white event point with a soft halo, never an instrument */
  var pulseAge = t - firstPulse;
  var flare = clamp(1 - pulseAge / 1.2, 0, 1);
  ctx.beginPath();
  ctx.moveTo(sq.cx + 26, sq.cy);
  ctx.arc(sq.cx, sq.cy, 26, 0, TAU);
  ctx.fillStyle = rgba(SOURCE, 0.05 + 0.10 * flare);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sq.cx + 12, sq.cy);
  ctx.arc(sq.cx, sq.cy, 12, 0, TAU);
  ctx.fillStyle = rgba(SOURCE, 0.14 + 0.16 * flare);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sq.cx + 4.5, sq.cy);
  ctx.arc(sq.cx, sq.cy, 4.5, 0, TAU);
  ctx.fillStyle = SOURCE;
  ctx.fill();
  drawSliders(sq);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Two Banks of Reverb').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Two Banks of Reverb').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 08').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Two Banks of Reverb', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 08', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    sliders: function () { return { liveliness: liveliness(phaseT), length: lengthVal(phaseT) }; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s; pulses at 44, 48, 52, 56, 60 s, so
   the slow bank shows three lingering amber rings and the fast bank shows
   fresh teal rings from the newest pulses ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
