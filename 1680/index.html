<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archetype, Rebuilt</title>
<style>
html, body { margin: 0; padding: 0; background: #EFE6D4; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
/* Archetype, Rebuilt (KG1, PP927).
   Driver: a plane divides recursively, one split at a time, into rectangles
   that rise as shallow isometric blocks. Order being partitioned, watched
   as it happens. Every few minutes a trait swaps: a new hand-built palette
   and a new scene angle, while the geometry rebuilds from empty. */
var PHASE = 20.0;
var TRAIT_LEN = 150;
var MORPH = 5;
var SPLIT_EVERY = 1.1;
var TARGET_LEAVES = 64;
var MIN_SIDE = 0.028;
var GAP = 0.0035;
var INK = [26, 26, 26];
/* palettes: a, b, quiet; ground; page; frame color; frame width (fraction) */
var PALS = [
  { a: [217, 160, 33], b: [179, 58, 43], quiet: [239, 230, 212],
    ground: [239, 230, 212], page: [239, 230, 212], frame: [239, 230, 212], fw: 0 },
  { a: [217, 123, 123], b: [122, 42, 53], quiet: [242, 234, 216],
    ground: [242, 234, 216], page: [242, 234, 216], frame: [242, 234, 216], fw: 0 },
  { a: [107, 78, 142], b: [43, 74, 140], quiet: [232, 180, 37],
    ground: [246, 241, 231], page: [91, 184, 176], frame: [91, 184, 176], fw: 0.045 }
];
/* cameras: rotation deg, vertical squash, extrusion lift, scale, vertical shift */
var CAMS = [
  { rot: 0, squash: 1.0, lift: 0, scale: 1.0, cy: 0 },
  { rot: 30, squash: 0.55, lift: 1.0, scale: 1.35, cy: 0.03 },
  { rot: 45, squash: 0.22, lift: 1.6, scale: 0.85, cy: -0.18 }
];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function easeOut(k) { k = clamp(k, 0, 1); return 1 - Math.pow(1 - k, 3); }
function rgb(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }
function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(4) + ')'; }
function shade(c, f) { return [c[0] * f, c[1] * f, c[2] * f]; }
function lerpC(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}

/* Recursive binary split tree, fully determined by its seed. Each node
   records its birth and split times; the visible frontier at time lt is
   the set of leaves that have been born but not yet split. */
function leafColor(node) {
  var area = (node.x1 - node.x0) * (node.y1 - node.y0);
  if (area >= 0.06) return 2;
  return (node.id % 2 === 0) ? 0 : 1;
}
function leafHeight(node, seed) {
  var area = (node.x1 - node.x0) * (node.y1 - node.y0);
  var jr = mulberry32(seed ^ Math.imul(node.id + 1, 2654435761));
  var base = 0.02 + 0.10 * (Math.sqrt(area) / 0.5);
  return base * (0.8 + 0.4 * jr());
}
function buildTree(seed) {
  var rng = mulberry32(seed);
  var root = { id: 0, x0: 0, y0: 0, x1: 1, y1: 1, depth: 0, birth: 0, split: null, kids: null };
  root.h = leafHeight(root, seed);
  root.ci = leafColor(root);
  var frontier = [root];
  var leaves = 1;
  var nextId = 1;
  var t = 0;
  while (leaves < TARGET_LEAVES) {
    var cand = [];
    var wsum = 0;
    var i;
    for (i = 0; i < frontier.length; i++) {
      var L = frontier[i];
      var w = L.x1 - L.x0, h = L.y1 - L.y0;
      if (L.depth < 7 && (w > 2 * MIN_SIDE || h > 2 * MIN_SIDE)) {
        cand.push(L);
        wsum += w * h;
      }
    }
    if (!cand.length) break;
    var r = rng() * wsum;
    var pick = cand[cand.length - 1];
    for (i = 0; i < cand.length; i++) {
      var ar = (cand[i].x1 - cand[i].x0) * (cand[i].y1 - cand[i].y0);
      if (r < ar) { pick = cand[i]; break; }
      r -= ar;
    }
    var pw = pick.x1 - pick.x0, ph = pick.y1 - pick.y0;
    var vertical;
    if (pw > 2 * MIN_SIDE && ph > 2 * MIN_SIDE) vertical = pw >= ph;
    else vertical = pw > 2 * MIN_SIDE;
    var p = 0.35 + rng() * 0.30;
    var a, b;
    if (vertical) {
      var sx = pick.x0 + pw * p;
      a = { id: nextId++, x0: pick.x0, y0: pick.y0, x1: sx, y1: pick.y1, depth: pick.depth + 1, birth: t, split: null, kids: null };
      b = { id: nextId++, x0: sx, y0: pick.y0, x1: pick.x1, y1: pick.y1, depth: pick.depth + 1, birth: t, split: null, kids: null };
    } else {
      var sy = pick.y0 + ph * p;
      a = { id: nextId++, x0: pick.x0, y0: pick.y0, x1: pick.x1, y1: sy, depth: pick.depth + 1, birth: t, split: null, kids: null };
      b = { id: nextId++, x0: pick.x0, y0: sy, x1: pick.x1, y1: pick.y1, depth: pick.depth + 1, birth: t, split: null, kids: null };
    }
    a.h = leafHeight(a, seed); a.ci = leafColor(a);
    b.h = leafHeight(b, seed); b.ci = leafColor(b);
    pick.split = t;
    pick.kids = [a, b];
    frontier.splice(frontier.indexOf(pick), 1);
    frontier.push(a, b);
    leaves++;
    t += SPLIT_EVERY;
  }
  return { root: root, leaves: leaves, splits: leaves - 1, doneAt: t - SPLIT_EVERY };
}
var TREES = [buildTree(1680001), buildTree(1680002), buildTree(1680003)];
function frontierAt(node, lt, out) {
  if (lt < node.birth) return;
  if (node.split === null || lt < node.split) { out.push(node); return; }
  frontierAt(node.kids[0], lt, out);
  frontierAt(node.kids[1], lt, out);
}

function draw(t) {
  size();
  var dt = t - PHASE;
  var trait = Math.floor(t / TRAIT_LEN) % 3;
  var prev = (trait + 2) % 3;
  var lt = t - Math.floor(t / TRAIT_LEN) * TRAIT_LEN;
  var mk = smooth(lt / MORPH);
  /* camera: morph from previous trait to current over 5s, plus a slow
     ambient drift of the angle between swaps (zero at frame one). */
  var c0 = CAMS[prev], c1 = CAMS[trait];
  var cam = {
    rot: lerp(c0.rot, c1.rot, mk) + Math.sin(dt * 0.02) * 1.5,
    squash: lerp(c0.squash, c1.squash, mk) + Math.cos(dt * 0.017) * 0.015,
    lift: lerp(c0.lift, c1.lift, mk),
    scale: lerp(c0.scale, c1.scale, mk),
    cy: lerp(c0.cy, c1.cy, mk)
  };
  var p0 = PALS[prev], p1 = PALS[trait];
  var pal = {
    a: lerpC(p0.a, p1.a, mk), b: lerpC(p0.b, p1.b, mk), quiet: lerpC(p0.quiet, p1.quiet, mk),
    ground: lerpC(p0.ground, p1.ground, mk), page: lerpC(p0.page, p1.page, mk),
    frame: lerpC(p0.frame, p1.frame, mk), fw: lerp(p0.fw, p1.fw, mk)
  };
  var cols = [pal.a, pal.b, pal.quiet];
  /* page ground follows the trait */
  ctx.fillStyle = rgb(pal.page);
  ctx.fillRect(0, 0, VW, VH);
  if (typeof document !== 'undefined' && document.body && document.body.style) {
    document.body.style.background = rgb(pal.page);
  }
  var comp = compRect();
  var fw = pal.fw * Math.min(comp.w, comp.h);
  var band = { x: comp.x + fw, y: comp.y + fw, w: comp.w - 2 * fw, h: comp.h - 2 * fw };
  /* field ground inside the frame band */
  ctx.fillStyle = rgb(pal.ground);
  ctx.fillRect(band.x, band.y, band.w, band.h);
  var S = isPhone ? Math.max(band.w, band.h) : Math.min(band.w, band.h);
  var cx = band.x + band.w / 2;
  var cy = band.y + band.h / 2 + cam.cy * band.h;
  var rad = cam.rot * Math.PI / 180;
  var co = Math.cos(rad), si = Math.sin(rad);
  function proj(x, y, z) {
    var u = x - 0.5, v = y - 0.5;
    var sx = u * co - v * si;
    var sy = (u * si + v * co) * cam.squash;
    return [cx + sx * S * cam.scale, cy + sy * S * cam.scale - z * cam.lift * S * 0.9];
  }
  var tree = TREES[trait];
  var vis = [];
  frontierAt(tree.root, lt, vis);
  /* painter order: far (small x+y) first */
  vis.sort(function (p, q) { return (p.x0 + p.y0) - (q.x0 + q.y0); });
  ctx.save();
  ctx.beginPath();
  ctx.rect(band.x, band.y, band.w, band.h);
  ctx.clip();
  /* the plane base: black, shows through the gaps as gap lines */
  var b00 = proj(0, 0, 0), b10 = proj(1, 0, 0), b11 = proj(1, 1, 0), b01 = proj(0, 1, 0);
  ctx.fillStyle = rgb(INK);
  ctx.beginPath();
  ctx.moveTo(b00[0], b00[1]); ctx.lineTo(b10[0], b10[1]);
  ctx.lineTo(b11[0], b11[1]); ctx.lineTo(b01[0], b01[1]);
  ctx.closePath(); ctx.fill();
  var i;
  for (i = 0; i < vis.length; i++) {
    var L = vis[i];
    var age = lt - L.birth;
    var grow = easeOut(age / 0.5);
    if (grow <= 0) continue;
    var h = L.h * grow;
    var x0 = L.x0 + GAP, y0 = L.y0 + GAP, x1 = L.x1 - GAP, y1 = L.y1 - GAP;
    var col = cols[L.ci];
    var t00 = proj(x0, y0, h), t10 = proj(x1, y0, h), t11 = proj(x1, y1, h), t01 = proj(x0, y1, h);
    var g10 = proj(x1, y0, 0), g11 = proj(x1, y1, 0), g01 = proj(x0, y1, 0);
    if (cam.lift > 0.001) {
      /* side faces: x1 edge mid shade, y1 edge dark shade */
      ctx.fillStyle = rgb(shade(col, 0.70));
      ctx.beginPath();
      ctx.moveTo(t10[0], t10[1]); ctx.lineTo(t11[0], t11[1]);
      ctx.lineTo(g11[0], g11[1]); ctx.lineTo(g10[0], g10[1]);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = rgb(shade(col, 0.52));
      ctx.beginPath();
      ctx.moveTo(t01[0], t01[1]); ctx.lineTo(t11[0], t11[1]);
      ctx.lineTo(g11[0], g11[1]); ctx.lineTo(g01[0], g01[1]);
      ctx.closePath(); ctx.fill();
    }
    /* top face, full palette color */
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.moveTo(t00[0], t00[1]); ctx.lineTo(t10[0], t10[1]);
    ctx.lineTo(t11[0], t11[1]); ctx.lineTo(t01[0], t01[1]);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  /* copy plates */
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  var ccx = band.x + band.w / 2;
  var topY = band.y + Math.max(6, 0.012 * band.h);
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var tw = ctx.measureText('Archetype, Rebuilt').width;
  ctx.fillStyle = rgb(pal.ground);
  ctx.fillRect(ccx - tw / 2 - 8, topY - 3, tw + 16, titlePx + 6);
  ctx.fillStyle = rgba(INK, 0.72);
  ctx.fillText('Archetype, Rebuilt', ccx, topY);
  ctx.font = smallPx + 'px monospace';
  var dw = ctx.measureText('2006 · 08 · 18').width;
  ctx.fillStyle = rgb(pal.ground);
  ctx.fillRect(ccx - dw / 2 - 8, topY + titlePx + 4, dw + 16, smallPx + 4);
  ctx.fillStyle = rgba(INK, 0.55);
  ctx.fillText('2006 · 08 · 18', ccx, topY + titlePx + 5);
  var hint = 'Watch the city assemble.';
  var hw = ctx.measureText(hint).width;
  var hy = band.y + band.h - smallPx - 10;
  ctx.fillStyle = rgb(pal.ground);
  ctx.fillRect(ccx - hw / 2 - 8, hy - 3, hw + 16, smallPx + 6);
  ctx.fillStyle = rgba(INK, 0.6);
  ctx.fillText(hint, ccx, hy);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
