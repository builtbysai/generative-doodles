<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dissolve Wall</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #232326;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Strict palette. Nothing else is ever drawn.
  var WALL = [35, 35, 38];       // #232326
  var RIM = [16, 16, 18];        // #101012
  var PROGRAM = [
    [42, 74, 232],               // deep blue #2A4AE8
    [58, 216, 232],              // cyan      #3AD8E8
    [224, 74, 208],              // magenta   #E04AD0
    [240, 168, 64],              // amber     #F0A840
    [184, 40, 40]                // deep red  #B82828
  ];

  var LOOP = 240;   // 4-minute preview cycle, seamless (prompt-sanctioned)
  var SEG = 48;     // one color per segment
  var HOLD = 40;    // hold, then an 8 s crossfade to the next color
  var FADE = SEG - HOLD;

  function smooth(u) {
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    return u * u * (3 - 2 * u);
  }

  function lerp(a, b, u) { return a + (b - a) * u; }

  function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }

  function rgbString(c, a) {
    if (typeof a === 'number') {
      return 'rgba(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ',' + a + ')';
    }
    return 'rgb(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ')';
  }

  // The program color as a pure closed-form function of loop time t (seconds).
  function programColor(t) {
    var tt = ((t % LOOP) + LOOP) % LOOP;
    var seg = Math.floor(tt / SEG);
    var local = tt - seg * SEG;
    var A = PROGRAM[seg % 5];
    var B = PROGRAM[(seg + 1) % 5];
    if (local < HOLD) return [A[0], A[1], A[2]];
    var u = smooth((local - HOLD) / FADE);
    return [lerp(A[0], B[0], u), lerp(A[1], B[1], u), lerp(A[2], B[2], u)];
  }

  // Seeded RNG (mulberry32) for the aperture blob shape.
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var z = s;
      z = Math.imul(z ^ (z >>> 15), z | 1);
      z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
      return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The aperture: a rounded organic blob, wider than tall, defined once in
  // unit space (8 anchor points, seeded radius jitter, y squashed by 0.72).
  // The same shape, scaled, serves for bleed, rim, glass, and shading bands.
  var BLOB = (function () {
    var rnd = mulberry32(75191);
    var pts = [];
    var N = 10;
    for (var i = 0; i < N; i++) {
      var a = (i / N) * Math.PI * 2 + (rnd() - 0.5) * 0.22;
      var r = 0.85 + rnd() * 0.28;
      pts.push([Math.cos(a) * r, Math.sin(a) * r * 0.72]);
    }
    return pts;
  })();

  function blobPath(cx, cy, rx, ry) {
    var n = BLOB.length;
    var px = [], py = [], i;
    for (i = 0; i < n; i++) {
      px.push(cx + BLOB[i][0] * rx);
      py.push(cy + BLOB[i][1] * ry);
    }
    ctx.beginPath();
    var mx = (px[n - 1] + px[0]) / 2, my = (py[n - 1] + py[0]) / 2;
    ctx.moveTo(mx, my);
    for (i = 0; i < n; i++) {
      var j = (i + 1) % n;
      ctx.quadraticCurveTo(px[i], py[i], (px[i] + px[j]) / 2, (py[i] + py[j]) / 2);
    }
    ctx.closePath();
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var col = programColor(t);
    var phone = isPhone();
    var cx = W / 2, cy = H / 2;
    var rx = (phone ? 0.40 : 0.30) * W;
    var ry = (phone ? 0.115 : 0.225) * H;

    // Wall.
    ctx.fillStyle = rgbString(WALL);
    ctx.fillRect(0, 0, W, H);

    // Color bleed: the program color tints the wall around the aperture,
    // in wide, faint, layered copies of the blob.
    var bleed = [
      [3.10, 0.012],
      [2.60, 0.016],
      [2.18, 0.022],
      [1.84, 0.030],
      [1.58, 0.040],
      [1.36, 0.052]
    ];
    for (var b = 0; b < bleed.length; b++) {
      blobPath(cx, cy, rx * bleed[b][0], ry * bleed[b][0]);
      ctx.fillStyle = rgbString(col, bleed[b][1]);
      ctx.fill();
    }

    // Rim: the dark cut edge of the aperture.
    blobPath(cx, cy, rx * 1.045, ry * 1.045);
    ctx.fillStyle = rgbString(RIM);
    ctx.fill();

    // Curved glass: a dark base, the program color laid over it, then
    // concentric inset bands of the same color. The bands accumulate toward
    // the center, so the middle sits fuller and brighter while the edges
    // stay thinner against the dark base: a barrel curve of light, with no
    // reflection and nothing photographic.
    blobPath(cx, cy, rx, ry);
    ctx.fillStyle = rgbString(RIM);
    ctx.fill();
    blobPath(cx, cy, rx, ry);
    ctx.fillStyle = rgbString(col, 0.94);
    ctx.fill();
    var bands = [0.96, 0.915, 0.86, 0.795, 0.72];
    for (var k = 0; k < bands.length; k++) {
      blobPath(cx, cy, rx * bands[k], ry * bands[k]);
      ctx.fillStyle = rgbString(col, 0.13);
      ctx.fill();
    }
    // Inner shadow at the glass edge: the rim color pressed back in.
    var lw = Math.max(2, Math.min(W, H) * 0.012);
    blobPath(cx, cy, rx * 0.99, ry * 0.99);
    ctx.strokeStyle = rgbString(RIM, 0.55);
    ctx.lineWidth = lw;
    ctx.stroke();
    blobPath(cx, cy, rx * 0.955, ry * 0.955);
    ctx.strokeStyle = rgbString(RIM, 0.22);
    ctx.lineWidth = lw;
    ctx.stroke();

    if (document.body && document.body.style) document.body.style.background = rgbString(WALL);
  }

  // Inert QA hook (house convention): ?seed=tNN draws frame one at loop
  // time NN seconds. Without the parameter the piece starts at t = 0.
  var startT = 0;
  var searchStr = (window.location && window.location.search) ||
    (typeof location !== 'undefined' ? location.search : '') || '';
  var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(searchStr);
  if (m) startT = parseFloat(m[1]);

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(startT); });
  }
  window.addEventListener('resize', function () { resize(); draw(startT); });

  // Frame one: the synchronous draw at loop t = 0 (deep blue, hold start).
  draw(startT);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts;
      draw(startT + (ts - t0) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
