<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motion Edit</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0A0E14;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');

  var BG = '#0A0E14';        // CAD-dark
  var WIRE = '#3E4A5C';      // wireframes, at 0.6
  var PATH = '#35E0FF';      // motion paths, at 0.9
  var MARK = '#FFFFFF';      // machine markers
  var TRACK = '#1C2532';     // timeline track
  var HEAD = '#FF4FD8';      // playhead, magenta only
  var TYPE = '#5C6B80';      // mono test text

  var SUITE = 40;            // one suite loop, seconds
  var PHASE0 = 14;           // fixed first-frame phase: TEST 02, machines mid-path

  var W = 0;
  var H = 0;
  var DPR = 1;
  var isPhone = false;

  var startStamp = 0;
  if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') {
    startStamp = performance.now();
  }

  function clamp(v, a, b) {
    return v < a ? a : (v > b ? b : v);
  }

  function mod(v, n) {
    return ((v % n) + n) % n;
  }

  // ---------- paths: sampled polylines, arc-length parameterized ----------

  function buildPath(points) {
    var cum = [0];
    var total = 0;
    for (var i = 1; i <= points.length; i++) {
      var a = points[i - 1];
      var b = points[i % points.length];
      total += Math.hypot(b[0] - a[0], b[1] - a[1]);
      cum.push(total);
    }
    return { pts: points, cum: cum, len: total };
  }

  function pathPoint(path, s) {
    var n = path.pts.length;
    s = mod(s, path.len);
    // binary search the segment holding s
    var lo = 0, hi = path.cum.length - 1;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (path.cum[mid + 1] < s) lo = mid + 1; else hi = mid;
    }
    var segLen = path.cum[lo + 1] - path.cum[lo];
    var f = segLen > 0 ? (s - path.cum[lo]) / segLen : 0;
    var a = path.pts[lo % n];
    var b = path.pts[(lo + 1) % n];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  }

  // the wall's straight rail run: two straights joined by semicircle ends
  function railPoints() {
    var pts = [];
    var y0 = 0.15, y1 = 0.21, x0 = 0.13, x1 = 0.55;
    var r = (y1 - y0) / 2, cy = (y0 + y1) / 2;
    var i, a;
    for (i = 0; i <= 40; i++) pts.push([x0 + (x1 - x0) * (i / 40), y0]);
    for (i = 1; i <= 20; i++) {
      a = -Math.PI / 2 + Math.PI * (i / 20);
      pts.push([x1 + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    for (i = 1; i <= 40; i++) pts.push([x1 - (x1 - x0) * (i / 40), y1]);
    for (i = 1; i < 20; i++) {
      a = Math.PI / 2 + Math.PI * (i / 20);
      pts.push([x0 + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    return pts;
  }

  // the triangle's height/roll figure: a tall tilted ellipse
  function ellipsePoints() {
    var pts = [];
    var cx = 0.79, cy = 0.45, rx = 0.125, ry = 0.19, rot = 0.2;
    var cr = Math.cos(rot), sr = Math.sin(rot);
    for (var i = 0; i < 160; i++) {
      var a = (i / 160) * Math.PI * 2;
      var ex = rx * Math.cos(a), ey = ry * Math.sin(a);
      pts.push([cx + ex * cr - ey * sr, cy + ex * sr + ey * cr]);
    }
    return pts;
  }

  // the monolith's S-route: a closed Catmull-Rom loop whose outer edge runs an S
  function sRoutePoints() {
    var ctrl = [
      [0.58, 0.32], [0.44, 0.38], [0.42, 0.50], [0.56, 0.58],
      [0.54, 0.70], [0.40, 0.76], [0.30, 0.68], [0.28, 0.54],
      [0.32, 0.40], [0.44, 0.30]
    ];
    var pts = [];
    var n = ctrl.length;
    var STEPS = 24;
    for (var i = 0; i < n; i++) {
      var p0 = ctrl[(i - 1 + n) % n], p1 = ctrl[i];
      var p2 = ctrl[(i + 1) % n], p3 = ctrl[(i + 2) % n];
      for (var j = 0; j < STEPS; j++) {
        var t = j / STEPS, t2 = t * t, t3 = t2 * t;
        pts.push([
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
        ]);
      }
    }
    return pts;
  }

  // one machine per path; each completes its loop once per suite, at a
  // staggered wrap time, so the TEST counter climbs 01 -> 04 across the suite
  var machines = [
    { path: buildPath(railPoints()), off: 30 },    // completes at tc = 10
    { path: buildPath(ellipsePoints()), off: 18 }, // completes at tc = 22
    { path: buildPath(sRoutePoints()), off: 9 }    // completes at tc = 31
  ];
  var WRAPS = machines.map(function (m) { return mod(SUITE - m.off, SUITE); });

  function testCount(tc) {
    var c = 1;
    for (var i = 0; i < WRAPS.length; i++) if (tc >= WRAPS[i]) c++;
    return c;
  }

  function flashStrength(tc, wrap) {
    var dt = mod(tc - wrap, SUITE);
    if (dt >= 1.1) return 0;
    var k = 1 - dt / 1.1;
    return k * k * (0.5 + 0.5 * k);
  }

  // ---------- sizing ----------

  function resize() {
    var vv = window.visualViewport;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    var sw = (window.screen && window.screen.width) ? window.screen.width : w;
    var sh = (window.screen && window.screen.height) ? window.screen.height : h;
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    isPhone = Math.min(sw, sh) < 700 || (Math.min(sw, sh) >= 700 && H > W * 1.15);
  }

  function geomNow() {
    var unit = Math.min(W, H);
    return { unit: unit, ox: (W - unit) / 2, oy: (H - unit) / 2 };
  }

  // ---------- drawing ----------

  function line(g, pts, close) {
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var x = g.ox + pts[i][0] * g.unit;
      var y = g.oy + pts[i][1] * g.unit;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    if (close) ctx.closePath();
    ctx.stroke();
  }

  function slab(g, x, y, w, h, dx, dy) {
    line(g, [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], true);
    line(g, [[x + dx, y + dy], [x + w + dx, y + dy], [x + w + dx, y + h + dy], [x + dx, y + h + dy]], true);
    line(g, [[x, y], [x + dx, y + dy]]);
    line(g, [[x + w, y], [x + w + dx, y + dy]]);
    line(g, [[x + w, y + h], [x + w + dx, y + h + dy]]);
    line(g, [[x, y + h], [x + dx, y + h + dy]]);
  }

  function drawWireframes(g) {
    ctx.strokeStyle = WIRE;
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = Math.max(1, g.unit * 0.0016);
    // the wall: a slab, left of center, with its projection seam
    slab(g, 0.12, 0.34, 0.30, 0.28, 0.04, -0.035);
    line(g, [[0.12, 0.48], [0.42, 0.48]]);
    line(g, [[0.27, 0.34], [0.27, 0.62]]);
    // the monolith: a tall thin slab, center
    slab(g, 0.515, 0.26, 0.07, 0.38, 0.03, -0.028);
    line(g, [[0.515, 0.335], [0.585, 0.335]]);
    // the truss triangle, right, with its inner web
    line(g, [[0.68, 0.58], [0.80, 0.32], [0.92, 0.58]], true);
    line(g, [[0.74, 0.45], [0.86, 0.45], [0.80, 0.58]]);
    line(g, [[0.74, 0.45], [0.80, 0.58]]);
    line(g, [[0.86, 0.45], [0.80, 0.58]]);
    line(g, [[0.66, 0.615], [0.94, 0.615]]);
    ctx.globalAlpha = 1;
  }

  function drawPath(g, m, tc) {
    var path = m.path;
    var n = path.pts.length;
    var flash = flashStrength(tc, mod(SUITE - m.off, SUITE));
    // full loop, dim
    ctx.strokeStyle = PATH;
    ctx.globalAlpha = 0.26 + 0.5 * flash;
    ctx.lineWidth = Math.max(1, g.unit * 0.002) + g.unit * 0.004 * flash;
    line(g, path.pts, true);
    // lit portion: from arc 0 up to the machine, drawn from the stored samples
    var phase = mod(tc + m.off, SUITE) / SUITE;
    var sNow = phase * path.len;
    var lit = [];
    var step = path.len / n;
    for (var s = 0; s < sNow; s += step) lit.push(pathPoint(path, s));
    lit.push(pathPoint(path, sNow));
    if (lit.length > 1) {
      ctx.globalAlpha = 0.22;
      ctx.lineWidth = Math.max(1, g.unit * 0.005);
      line(g, lit, false);
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = Math.max(1, g.unit * 0.0022);
      line(g, lit, false);
    }
    ctx.globalAlpha = 1;
    return pathPoint(path, sNow);
  }

  function drawMachine(g, p) {
    var s = g.unit * (isPhone ? 0.017 : 0.0145);
    var x = g.ox + p[0] * g.unit;
    var y = g.oy + p[1] * g.unit;
    ctx.fillStyle = MARK;
    ctx.globalAlpha = 1;
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }

  function drawTimeline(g, tc) {
    var x0 = 0.06, x1 = 0.94;
    var yTop = 0.85, yTrack = 0.898, yBot = 0.94;
    ctx.strokeStyle = WIRE;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = Math.max(1, g.unit * 0.0014);
    line(g, [[x0, 0.83], [x1, 0.83]]);
    ctx.globalAlpha = 1;
    // track
    ctx.fillStyle = TRACK;
    var tx = g.ox + x0 * g.unit, tw = (x1 - x0) * g.unit;
    ctx.fillRect(tx, g.oy + (yTrack - 0.007) * g.unit, tw, 0.014 * g.unit);
    // segment ticks: one per test in the suite
    ctx.strokeStyle = WIRE;
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = Math.max(1, g.unit * 0.0016);
    for (var i = 0; i <= 4; i++) {
      var fx = x0 + (x1 - x0) * (i / 4);
      line(g, [[fx, yTrack - 0.016], [fx, yTrack + 0.016]]);
    }
    ctx.globalAlpha = 1;
    // playhead
    var px = x0 + (x1 - x0) * (tc / SUITE);
    ctx.strokeStyle = HEAD;
    ctx.lineWidth = Math.max(1, g.unit * 0.0026);
    line(g, [[px, yTop], [px, yBot]]);
    ctx.fillStyle = HEAD;
    var hs = g.unit * 0.011;
    var hx = g.ox + px * g.unit, hy = g.oy + yTop * g.unit;
    ctx.fillRect(hx - hs / 2, hy - hs / 2, hs, hs);
    // the test counter, left of the strip
    ctx.fillStyle = TYPE;
    ctx.font = '600 ' + Math.round(g.unit * 0.021) + 'px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('TEST 0' + testCount(tc), g.ox + x0 * g.unit, g.oy + 0.87 * g.unit);
  }

  function drawLabels(g) {
    ctx.fillStyle = TYPE;
    ctx.font = '600 ' + Math.round(g.unit * 0.019) + 'px monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillText('VICON LOCK', g.ox + 0.065 * g.unit, g.oy + 0.082 * g.unit);
    ctx.textAlign = 'right';
    ctx.fillText('300mm/s', g.ox + 0.935 * g.unit, g.oy + 0.082 * g.unit);
    ctx.textAlign = 'left';
  }

  function drawAt(elapsed) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = geomNow();
    var tc = mod(PHASE0 + elapsed, SUITE);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // viewport frame
    ctx.strokeStyle = WIRE;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = Math.max(1, g.unit * 0.0016);
    line(g, [[0.04, 0.04], [0.96, 0.04], [0.96, 0.80], [0.04, 0.80]], true);
    ctx.globalAlpha = 1;

    drawWireframes(g);

    var heads = [];
    for (var i = 0; i < machines.length; i++) heads.push(drawPath(g, machines[i], tc));
    for (var j = 0; j < heads.length; j++) drawMachine(g, heads[j]);

    drawLabels(g);
    drawTimeline(g, tc);
  }

  function elapsedNow() {
    if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') {
      return (performance.now() - startStamp) / 1000;
    }
    return 0;
  }

  if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', resize);
  }

  resize();
  if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') {
    startStamp = performance.now();
  }
  drawAt(0);

  var raf = null;
  if (typeof window.requestAnimationFrame === 'function') raf = window.requestAnimationFrame;
  else if (typeof requestAnimationFrame === 'function') raf = requestAnimationFrame;

  function loop() {
    drawAt(elapsedNow());
    if (raf) raf(loop);
  }
  if (raf) raf(loop);
})();
</script>
</body>
</html>
