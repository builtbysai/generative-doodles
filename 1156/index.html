<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sticker Shuffle</title>
<style>
  html, body { margin: 0; padding: 0; background: #111111; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Sticker Shuffle — Antonio Roberts study AR5 (Sticker Book, 2019) ----------
  // Five invented sticker creatures, each cut into convex polygon fragments
  // that live on a 6x6 slot grid. Twice per 8s loop the deck shuffles:
  // at t=2.0s a seeded permutation throws ~40% of the fragments into new
  // slots (three swaps cross creature boundaries, so brief impossible
  // hybrids form); at t=5.5s the identity permutation resolves everyone
  // home. Flights are 0.4s ease-out-cubic, computed closed-form from t —
  // no integrated state, no drift. Watch-only.

  var T0 = 0.8;                 // fixed phase: fully assembled, pre-shuffle
  var LOOP = 8, FLIGHT = 0.4;
  var EVENTS = [2.0, 5.5];      // shuffle timestamps inside the loop
  var BG = '#111111', INK = '#000000';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- fragment polygon templates (cell-local coords, 0..1) ----------
  function jitterQuad(rng) {
    var j = function () { return (rng() - 0.5) * 0.05; };
    return [
      [0.06 + j(), 0.05 + j()], [0.95 + j(), 0.06 + j()],
      [0.94 + j(), 0.95 + j()], [0.05 + j(), 0.94 + j()]
    ];
  }
  var TEMPLATES = {
    full:     null, // seeded jitter quad, filled in below
    triUp:    [[0.50, 0.04], [0.96, 0.96], [0.04, 0.96]],
    triDown:  [[0.04, 0.04], [0.96, 0.04], [0.50, 0.96]],
    triLeft:  [[0.04, 0.50], [0.96, 0.04], [0.96, 0.96]],
    triRight: [[0.04, 0.04], [0.96, 0.50], [0.04, 0.96]],
    moonTop:  [[0.30, 0.04], [0.96, 0.04], [0.96, 0.96], [0.62, 0.96]],
    moonMid:  [[0.68, 0.04], [0.96, 0.04], [0.96, 0.96], [0.68, 0.96]],
    moonBot:  [[0.62, 0.04], [0.96, 0.04], [0.96, 0.96], [0.30, 0.96]]
  };

  // ---------- creatures: [name, color, [[col,row,template,detail], ...]] ----------
  var CREATURES = [
    ['star', '#FFD23F', [
      [3, 0, 'triUp', null], [2, 1, 'triLeft', null], [3, 1, 'full', 'face'],
      [4, 1, 'triRight', null], [3, 2, 'triDown', null]
    ]],
    ['blob', '#FF5C39', [
      [0, 2, 'full', 'eyeL'], [1, 2, 'full', 'eyeR'], [0, 3, 'full', 'stripes'],
      [1, 3, 'full', 'mouth'], [1, 4, 'triDown', null]
    ]],
    ['moon', '#3FC1FF', [
      [5, 2, 'moonTop', 'closedEye'], [5, 3, 'moonMid', 'dot'], [5, 4, 'moonBot', null]
    ]],
    ['arrow', '#7CFF00', [
      [0, 5, 'full', 'diag'], [1, 5, 'full', 'diag'], [2, 5, 'full', null],
      [2, 4, 'full', null], [3, 5, 'triRight', null]
    ]],
    ['pink', '#FF7AD9', [
      [4, 4, 'full', 'eyes'], [4, 5, 'full', 'toes'], [5, 5, 'full', 'belly']
    ]]
  ];

  // ---------- build fragment table (deterministic) ----------
  var rng = mulberry32(1156005);
  var FRAGS = [];
  CREATURES.forEach(function (cr) {
    cr[2].forEach(function (cell) {
      var tpl = cell[2] === 'full' ? jitterQuad(rng) : TEMPLATES[cell[2]];
      FRAGS.push({
        creature: cr[0], color: cr[1],
        col: cell[0], row: cell[1],
        poly: tpl, detail: cell[3]
      });
    });
  });
  // fragment order: 0-4 star, 5-9 blob, 10-12 moon, 13-17 arrow, 18-20 pink

  // ---------- shuffle permutation (event 1); event 2 is identity ----------
  // PERM1[f] = index of the fragment whose home slot f flies to.
  var PERM1 = FRAGS.map(function (_, i) { return i; });
  function swapSlots(a, b) { var t = PERM1[a]; PERM1[a] = PERM1[b]; PERM1[b] = t; }
  swapSlots(2, 6);    // star face <-> blob right eye   (cross-creature)
  swapSlots(11, 16);  // moon sliver <-> arrow head-top (cross-creature)
  swapSlots(18, 1);   // pink eyes  <-> star left point (cross-creature)
  swapSlots(5, 9);    // blob left eye <-> blob drip    (within-creature)
  // 8 of 21 fragments move (~38%)

  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

  // fragment f's grid position (in cell units, float) at loop time t
  function fragPos(f, t) {
    var home = { x: FRAGS[f].col, y: FRAGS[f].row };
    var dest = { x: FRAGS[PERM1[f]].col, y: FRAGS[PERM1[f]].row };
    if (t < EVENTS[0]) return home;
    if (t < EVENTS[0] + FLIGHT) {
      var k = easeOutCubic((t - EVENTS[0]) / FLIGHT);
      return { x: home.x + (dest.x - home.x) * k, y: home.y + (dest.y - home.y) * k };
    }
    if (t < EVENTS[1]) return dest;
    if (t < EVENTS[1] + FLIGHT) {
      var k2 = easeOutCubic((t - EVENTS[1]) / FLIGHT);
      return { x: dest.x + (home.x - dest.x) * k2, y: dest.y + (home.y - dest.y) * k2 };
    }
    return home;
  }

  // ---------- viewport / sizing ----------
  var W = 0, H = 0, DPR = 1;
  function viewSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 800);
    var h = vv ? vv.height : (window.innerHeight || 600);
    return { w: w, h: h };
  }
  function isPhone() {
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr && scr.width && scr.height) {
      if (Math.min(scr.width, scr.height) < 700) return true;
    }
    return H > W * 1.15;
  }
  function fit() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  fit();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', fit);
  }
  window.addEventListener('resize', fit);

  // ---------- details (drawn clipped inside the fragment polygon) ----------
  function dot(x, y, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function drawDetail(kind, u) {
    ctx.lineWidth = u * 0.045;
    ctx.strokeStyle = INK;
    ctx.fillStyle = INK;
    if (kind === 'face') {
      dot(0.35 * u, 0.42 * u, 0.055 * u, INK);
      dot(0.65 * u, 0.42 * u, 0.055 * u, INK);
      ctx.beginPath();
      ctx.arc(0.5 * u, 0.52 * u, 0.18 * u, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
    } else if (kind === 'eyeL' || kind === 'eyeR') {
      dot(0.5 * u, 0.45 * u, 0.20 * u, '#FFFFFF');
      dot((kind === 'eyeL' ? 0.55 : 0.45) * u, 0.47 * u, 0.09 * u, INK);
    } else if (kind === 'stripes') {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(-0.1 * u, 0.28 * u, 1.2 * u, 0.13 * u);
      ctx.fillRect(-0.1 * u, 0.60 * u, 1.2 * u, 0.13 * u);
    } else if (kind === 'mouth') {
      ctx.beginPath();
      ctx.arc(0.5 * u, 0.32 * u, 0.22 * u, Math.PI * 0.2, Math.PI * 0.8);
      ctx.stroke();
      dot(0.16 * u, 0.30 * u, 0.05 * u, INK);
      dot(0.84 * u, 0.30 * u, 0.05 * u, INK);
    } else if (kind === 'closedEye') {
      ctx.beginPath();
      ctx.arc(0.62 * u, 0.40 * u, 0.16 * u, Math.PI * 0.05, Math.PI * 0.95);
      ctx.stroke();
    } else if (kind === 'dot') {
      dot(0.82 * u, 0.5 * u, 0.07 * u, '#FFFFFF');
    } else if (kind === 'diag') {
      ctx.fillStyle = '#FFFFFF';
      [[-0.05, 0.80], [0.38, 0.80], [0.81, 0.80]].forEach(function (o) {
        ctx.beginPath();
        ctx.moveTo(o[0] * u, o[1] * u);
        ctx.lineTo((o[0] + 0.28) * u, (o[1] - 0.62) * u);
        ctx.lineTo((o[0] + 0.48) * u, (o[1] - 0.62) * u);
        ctx.lineTo((o[0] + 0.20) * u, o[1] * u);
        ctx.closePath();
        ctx.fill();
      });
    } else if (kind === 'eyes') {
      dot(0.35 * u, 0.40 * u, 0.06 * u, INK);
      dot(0.65 * u, 0.40 * u, 0.06 * u, INK);
      dot(0.37 * u, 0.38 * u, 0.02 * u, '#FFFFFF');
      dot(0.67 * u, 0.38 * u, 0.02 * u, '#FFFFFF');
      ctx.beginPath();
      ctx.arc(0.5 * u, 0.55 * u, 0.10 * u, Math.PI * 0.2, Math.PI * 0.8);
      ctx.stroke();
    } else if (kind === 'toes') {
      for (var i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo((0.28 + i * 0.22) * u, 0.68 * u);
        ctx.lineTo((0.28 + i * 0.22) * u, 0.86 * u);
        ctx.stroke();
      }
    } else if (kind === 'belly') {
      dot(0.5 * u, 0.55 * u, 0.22 * u, '#FFFFFF');
      dot(0.5 * u, 0.52 * u, 0.07 * u, '#FF5C39');
    }
  }

  // ---------- draw ----------
  function draw(tAbs) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var t = ((tAbs % LOOP) + LOOP) % LOOP;
    var side = Math.min(W, H) * (isPhone() ? 0.96 : 0.92);
    var cell = side / 6;
    var ox = (W - side) / 2, oy = (H - side) / 2;

    for (var f = 0; f < FRAGS.length; f++) {
      var fr = FRAGS[f];
      var p = fragPos(f, t);
      var x0 = ox + p.x * cell, y0 = oy + p.y * cell;
      ctx.beginPath();
      fr.poly.forEach(function (pt, i) {
        var px = x0 + pt[0] * cell, py = y0 + pt[1] * cell;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.fillStyle = fr.color;
      ctx.fill();
      if (fr.detail) {
        ctx.save();
        ctx.clip();
        ctx.translate(x0, y0);
        drawDetail(fr.detail, cell);
        ctx.restore();
        // re-stroke path after restore (clip consumed the current path state)
        ctx.beginPath();
        fr.poly.forEach(function (pt, i) {
          var px = x0 + pt[0] * cell, py = y0 + pt[1] * cell;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.closePath();
      }
      ctx.strokeStyle = INK;
      ctx.lineWidth = Math.max(2, cell * 0.027);
      ctx.lineJoin = 'round';
      ctx.stroke();
    }
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function pieceT() {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : start;
    return T0 + (now - start) / 1000;
  }
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(pieceT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
