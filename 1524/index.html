<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Apartment That Remembers</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e0d2; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette (only these five colours are used) ----------
  var BG = '#e6e0d2';
  var INK = '#33302a';
  var PLUM = '#5a2e3a';
  var OCHRE = '#c98f3d';
  var PALE = '#c9c2b0';

  // ---------- deterministic PRNG (mulberry32, seed 1524000) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1524000);

  // ---------- helpers ----------
  function a4(x) { return Math.round(x * 10000) / 10000; }
  function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }
  function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  var OCHRE_RGB = hexRgb(OCHRE);
  var PALE_RGB = hexRgb(PALE);
  function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a4(a) + ')'; }

  // ---------- loop schedule (120 s, periodic, seeded) ----------
  // Plan in unit space: width 1, height 0.52. Rooms are thirds of the width.
  // Doors sit on the shared walls at nx = 1/3 and 2/3, centred at ny = 0.5.
  var LOOP = 120;
  var SPEED = 0.055; // plan-widths per second (unit space)
  function roomOf(nx) { return clamp(Math.floor(nx * 3), 0, 2); }
  function interiorPoint(room) {
    // Room r spans nx in [r/3, (r+1)/3]; keep the point inset within that third.
    return { x: room / 3 + (0.18 + 0.64 * rand()) / 3, y: 0.2 + 0.6 * rand() };
  }
  function dist(a, b) {
    var dx = b.x - a.x, dy = (b.y - a.y) * 0.52;
    return Math.sqrt(dx * dx + dy * dy);
  }

  var rawSegs = []; // {t0, t1, fx, fy, tx, ty} in unscaled time
  var cursor = 0;
  var cur = null;
  function addMove(to, dwellAfter) {
    var d = dist(cur, to) / SPEED;
    rawSegs.push({ t0: cursor, t1: cursor + d, fx: cur.x, fy: cur.y, tx: to.x, ty: to.y });
    cursor += d;
    cur = to;
    if (dwellAfter > 0) {
      rawSegs.push({ t0: cursor, t1: cursor + dwellAfter, fx: cur.x, fy: cur.y, tx: cur.x, ty: cur.y });
      cursor += dwellAfter;
    }
  }
  // Visit order: 12 visits, each in a different room from the previous one.
  var visits = [1];
  var room = 1;
  for (var k = 1; k < 12; k++) {
    var opts = [0, 1, 2].filter(function (r) { return r !== room; });
    room = opts[Math.floor(rand() * 2)];
    visits.push(room);
  }
  var prevRoom = -1;
  for (var v = 0; v < visits.length; v++) {
    var rv = visits[v];
    if (cur === null) {
      cur = interiorPoint(rv);
      rawSegs.push({ t0: 0, t1: 1.2 + 1.6 * rand(), fx: cur.x, fy: cur.y, tx: cur.x, ty: cur.y });
      cursor = rawSegs[0].t1;
    } else {
      // Walk to this visit through every door on the way, pausing at each threshold.
      var doors = [];
      if (prevRoom < rv) { for (var d = prevRoom + 1; d <= rv; d++) doors.push(d / 3); }
      else { for (var d2 = prevRoom; d2 > rv; d2--) doors.push(d2 / 3); }
      for (var di = 0; di < doors.length; di++) {
        addMove({ x: doors[di], y: 0.5 }, 2.2);
      }
      addMove(interiorPoint(rv), 1.2 + 1.6 * rand());
    }
    prevRoom = rv;
  }
  // Scale every duration so the schedule tiles exactly [0, LOOP).
  var scale = LOOP / cursor;
  var segs = rawSegs.map(function (s) {
    return { t0: s.t0 * scale, t1: s.t1 * scale, fx: s.fx, fy: s.fy, tx: s.tx, ty: s.ty };
  });
  segs[segs.length - 1].t1 = LOOP;

  function schedPos(t) {
    var tm = ((t % LOOP) + LOOP) % LOOP;
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (tm >= s.t0 && tm < s.t1) {
        if (s.fx === s.tx && s.fy === s.ty) return { x: s.fx, y: s.fy };
        var u = smooth((tm - s.t0) / (s.t1 - s.t0));
        return { x: lerp(s.fx, s.tx, u), y: lerp(s.fy, s.ty, u) };
      }
    }
    var last = segs[segs.length - 1];
    return { x: last.tx, y: last.ty };
  }

  // ---------- drag sessions (closed-form over recorded events) ----------
  // Each session: {t0, t1 (null while held), startPos, releasePos, moves:[{t,x,y}]}
  var sessions = [];
  var active = null;
  function pointerAt(session, t) {
    var p = session.moves[0];
    for (var i = 0; i < session.moves.length; i++) {
      if (session.moves[i].t <= t) p = session.moves[i];
      else break;
    }
    return p;
  }
  function posAt(t) {
    var base = schedPos(t);
    // Find the latest session that started at or before t.
    var s = null;
    for (var i = 0; i < sessions.length; i++) {
      if (sessions[i].t0 <= t) s = sessions[i];
      else break;
    }
    if (s === null) return base;
    if (s.t1 === null || t <= s.t1) {
      // Currently dragging: ease from the drag-start position toward the pointer.
      var k = smooth((t - s.t0) / 1.2);
      var pp = pointerAt(s, t);
      return { x: lerp(s.startPos.x, pp.x, k), y: lerp(s.startPos.y, pp.y, k) };
    }
    if (t < s.t1 + 1.5) {
      // Blend back to the scheduled path after release.
      var k2 = smooth((t - s.t1) / 1.5);
      return { x: lerp(s.releasePos.x, base.x, k2), y: lerp(s.releasePos.y, base.y, k2) };
    }
    return base;
  }

  // ---------- geometry ----------
  function size() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 720; h = 720; }
    return { w: w, h: h };
  }
  function geom(w, h) {
    var planW = Math.min(w * 0.74, h * 1.30);
    var planH = planW * 0.52;
    if (planH > h * 0.7) { planH = h * 0.7; planW = planH / 0.52; }
    return {
      cx: w / 2, cy: h / 2, planW: planW, planH: planH,
      x0: w / 2 - planW / 2, y0: h / 2 - planH / 2
    };
  }
  function toPx(g, p) {
    return { x: g.x0 + p.x * g.planW, y: g.y0 + p.y * g.planH };
  }
  function toUnit(g, px, py) {
    return {
      x: clamp((px - g.x0) / g.planW, 0.04, 0.96),
      y: clamp((py - g.y0) / g.planH, 0.08, 0.92)
    };
  }

  // ---------- drawing ----------
  var lastT = 0;
  function draw(t) {
    lastT = t;
    var wh = size();
    var w = wh.w, h = wh.h;
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var g = geom(w, h);
    var lw = Math.max(1.5, g.planW * 0.0035);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, w, h);

    // Room lines: outer rectangle plus shared walls with door gaps.
    ctx.strokeStyle = INK;
    ctx.lineWidth = lw;
    ctx.lineCap = 'square';
    function line(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    var X0 = g.x0, X1 = g.x0 + g.planW, Y0 = g.y0, Y1 = g.y0 + g.planH;
    var W1 = g.x0 + g.planW / 3, W2 = g.x0 + (2 * g.planW) / 3;
    var GY0 = g.y0 + g.planH * 0.29, GY1 = g.y0 + g.planH * 0.71;
    line(X0, Y0, X1, Y0);
    line(X0, Y1, X1, Y1);
    line(X0, Y0, X0, Y1);
    line(X1, Y0, X1, Y1);
    line(W1, Y0, W1, GY0);
    line(W1, GY1, W1, Y1);
    line(W2, Y0, W2, GY0);
    line(W2, GY1, W2, Y1);

    // Traces: trailing 75 s of the path, oldest first. Young segments are
    // ochre, old ones pale; both fade with age and drop out past 75 s, so
    // rooms fade one at a time, oldest first, and the plan is never fully
    // erased (the window always holds recent path) nor fully full (thin
    // lines over a 75 s window of a 120 s loop).
    var STEP = 0.25, WINDOW = 75;
    var prev = null;
    for (var age = WINDOW; age > 0; age -= STEP) {
      var p = posAt(t - age + STEP);
      var px = toPx(g, p);
      if (prev !== null) {
        var a = age - STEP; // age of the newer endpoint
        var col, al;
        if (a < 40) { col = OCHRE_RGB; al = 0.8 - 0.3 * (a / 40); }
        else { col = PALE_RGB; al = 0.5 - 0.35 * ((a - 40) / 35); }
        ctx.strokeStyle = rgba(col, al);
        ctx.lineWidth = Math.max(1, g.planW * 0.0022);
        ctx.lineCap = 'round';
        line(prev.x, prev.y, px.x, px.y);
      }
      prev = px;
    }

    // Dancer-mark: small articulated glyph in deep plum.
    var mp = toPx(g, posAt(t));
    var s = g.planH * 0.10;
    ctx.strokeStyle = PLUM;
    ctx.lineWidth = Math.max(1.5, g.planW * 0.004);
    ctx.lineCap = 'round';
    line(mp.x, mp.y - s * 0.5, mp.x, mp.y + s * 0.5); // torso
    line(mp.x, mp.y - s * 0.2, mp.x - s * 0.5, mp.y - s * 0.5); // arms
    line(mp.x, mp.y - s * 0.2, mp.x + s * 0.5, mp.y - s * 0.5);
    line(mp.x, mp.y + s * 0.5, mp.x - s * 0.4, mp.y + s); // legs
    line(mp.x, mp.y + s * 0.5, mp.x + s * 0.4, mp.y + s);
  }

  // ---------- pointer input ----------
  function pointerPos(e) {
    var rect = { left: 0, top: 0 };
    if (canvas.getBoundingClientRect) rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function onDown(e) {
    var wh = size();
    var g = geom(wh.w, wh.h);
    var pp = pointerPos(e);
    var u = toUnit(g, pp.x, pp.y);
    active = { t0: lastT, t1: null, startPos: posAt(lastT), releasePos: null, moves: [{ t: lastT, x: u.x, y: u.y }] };
    sessions.push(active);
  }
  function onMove(e) {
    if (active === null) return;
    var wh = size();
    var g = geom(wh.w, wh.h);
    var pp = pointerPos(e);
    var u = toUnit(g, pp.x, pp.y);
    active.moves.push({ t: lastT, x: u.x, y: u.y });
  }
  function onUp(e) {
    if (active === null) return;
    var wh = size();
    var g = geom(wh.w, wh.h);
    var pp = pointerPos(e);
    var u = toUnit(g, pp.x, pp.y);
    active.moves.push({ t: lastT, x: u.x, y: u.y });
    active.t1 = lastT;
    active.releasePos = posAt(lastT);
    active = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---------- clock ----------
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    draw((ts - start) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(lastT); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { draw(lastT); });
    }
  }
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
