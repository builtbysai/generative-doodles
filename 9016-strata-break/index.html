<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9016 · Strata Break · Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #e8e4d8;
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: Georgia, serif;
  }
  #back {
    position: fixed;
    top: 22px; left: 26px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #9a927f;
    text-decoration: none;
    transition: color 0.2s;
  }
  #back:hover { color: #211d16; }
  #frame {
    position: relative;
    width: min(86vmin, 860px, calc(100vh - 110px));
    height: min(86vmin, 860px, calc(100vh - 110px));
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    box-shadow: 0 18px 60px rgba(30, 25, 18, 0.28), 0 2px 8px rgba(30, 25, 18, 0.18);
    cursor: pointer;
  }
  #caption {
    position: absolute;
    left: 0; right: 0;
    bottom: -2.4em;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: #6b6455;
    text-transform: uppercase;
  }
  #caption span { color: #a33b2e; }
  #hint {
    position: absolute;
    left: 0; right: 0;
    bottom: -4.1em;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #9a927f;
  }
</style>
</head>
<body>
<a id="back" href="../">← Generative Doodles</a>
<div id="frame">
  <canvas id="c"></canvas>
  <div id="caption">Strata Break <span>·</span> doodle №9016</div>
  <div id="hint">click for a new variation</div>
</div>
<script>
"use strict";
/* ============================================================
   STRATA BREAK · Generative Doodles №9016
   A synthesis of study notes, not a copy of any single source:
   - Radial ring structure ......... Gorillasun's tree-ring technique
   - Disorder gradient by radius ... Generative Artistry's Cubic Disarray idea
   - Micro-segment accumulation .... DesLauriers's stroke-buildup method
   - Monochrome, density-as-tone ... Hoff's ink discipline
   - Random ring breaks/rejoins .... Gorillasun's disconnect trick
   - Grain pass .................... Gorillasun's texture lesson
   Seeded: ?seed=12345 or click for a new variation.
   ============================================================ */

// --- Seeded PRNG (mulberry32) ---
function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// --- Tiny value-noise (seeded) for displacement fields ---
function makeNoise2D(rand) {
  const P = 256, perm = new Uint8Array(P * 2), grad = new Float32Array(P);
  const p = [...Array(P).keys()];
  for (let i = P - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0;[p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < P * 2; i++) perm[i] = p[i & (P - 1)];
  for (let i = 0; i < P; i++) grad[i] = rand() * 2 - 1;
  const fade = t => t * t * (3 - 2 * t);
  return function(x, y) {
    const xi = Math.floor(x) & (P - 1), yi = Math.floor(y) & (P - 1);
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const h = (X, Y) => grad[perm[(perm[X & (P - 1)] + Y) & (P - 1)]];
    const u = fade(xf), v = fade(yf);
    return (h(xi, yi) * (1 - u) + h(xi + 1, yi) * u) * (1 - v) +
           (h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u) * v;
  };
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function draw(seed) {
  const rand = mulberry32(seed);
  const noise = makeNoise2D(mulberry32(seed ^ 0x9e3779b9));

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const S = 900;                       // internal resolution (square)
  canvas.width = S * dpr; canvas.height = S * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // --- Palette: warm paper, deep ink, one rare accent ---
  const PAPER = '#f5f1e6', INK = '#211d16', ACCENT = '#a33b2e';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, S, S);

  const cx = S / 2, cy = S / 2;
  const maxR = S * 0.46;

  // Rare accent ring: pick one ring index to render in deep red (Hoff's single-ink accent)
  const ringCount = 64;
  const accentRing = (rand() < 0.75) ? (rand() * ringCount) | 0 : -1;

  // Disorder gradient: 0 at center -> 1 at edge (Cubic Disarray, mapped radially)
  for (let ri = 0; ri < ringCount; ri++) {
    const t = ri / (ringCount - 1);            // 0 center .. 1 edge
    const r = 8 + t * (maxR - 8) + (rand() - 0.5) * 3;  // slight radius jitter breaks mechanical banding
    const disorder = Math.pow(t, 1.6);          // eases in: calm core, wild rim

    const isAccent = (ri === accentRing);
    ctx.strokeStyle = isAccent ? ACCENT : INK;

    // Line weight & opacity: fine precise core, heavier broken rim.
    // Accent ring draws slightly bolder so it reads as deliberate, not accidental.
    ctx.lineWidth = (0.7 + disorder * 1.6 + rand() * 0.5) * (isAccent ? 1.6 : 1);
    ctx.globalAlpha = Math.min(0.95, 0.5 + rand() * 0.28 - disorder * 0.12 + (isAccent ? 0.25 : 0));
    ctx.lineCap = 'round';

    // Displacement amplitude grows with disorder
    const dispAmp = 1.5 + disorder * 26;
    const noiseScale = 0.012 + disorder * 0.02;
    const phase = rand() * 100;

    // Break probability grows with disorder (Gorillasun's disconnect trick)
    const breakP = 0.02 + disorder * 0.34;

    const steps = Math.max(48, (r * 2.4) | 0);
    let penDown = true;
    let prevX = null, prevY = null;

    ctx.beginPath();
    for (let s = 0; s <= steps; s++) {
      const a = (s / steps) * Math.PI * 2;

      // Occasionally lift the pen -> broken ring segments
      if (rand() < breakP) {
        if (penDown) { ctx.stroke(); ctx.beginPath(); penDown = false; }
        prevX = prevY = null;
        // skip ahead a little so gaps have visible length
        continue;
      }
      if (!penDown) { ctx.beginPath(); penDown = true; }

      const nx = noise(Math.cos(a) * 2 + phase, Math.sin(a) * 2 + r * noiseScale);
      const ny = noise(Math.sin(a) * 2 + phase + 40, Math.cos(a) * 2 + r * noiseScale);
      const rr = r + nx * dispAmp + ny * dispAmp * 0.6;
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr;

      if (prevX === null) ctx.moveTo(x, y);
      else {
        // micro-segments: draw short overlapping strokes, not one path
        // (DesLauriers accumulation: each segment slightly jittered)
        const jx = (rand() - 0.5) * disorder * 2.2;
        const jy = (rand() - 0.5) * disorder * 2.2;
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(x + jx, y + jy);
      }
      prevX = x; prevY = y;
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // --- Faint registration: one perfect circle at the core, the "undisturbed" origin ---
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;

  // --- Grain pass (Gorillasun's texture lesson) ---
  const img = ctx.getImageData(0, 0, S, S);
  const d = img.data;
  const grainRand = mulberry32(seed ^ 0x51ab3f);
  for (let i = 0; i < d.length; i += 4) {
    const g = (grainRand() - 0.5) * 22;
    d[i] += g; d[i + 1] += g; d[i + 2] += g;
  }
  ctx.putImageData(img, 0, 0);

  // --- Vignette: subtle darkening at corners to hold the composition ---
  const vg = ctx.createRadialGradient(cx, cy, maxR * 0.55, cx, cy, maxR * 1.35);
  vg.addColorStop(0, 'rgba(40,32,20,0)');
  vg.addColorStop(1, 'rgba(40,32,20,0.16)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, S, S);
}

function seedFromURL() {
  const m = /[?&]seed=(\d+)/.exec(location.search);
  return m ? parseInt(m[1], 10) >>> 0 : (Math.random() * 1e9) >>> 0;
}

let seed = seedFromURL();
draw(seed);
document.getElementById('caption').innerHTML =
  'Strata Break <span>·</span> doodle №9016 <span>·</span> seed ' + seed;
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) >>> 0;
  draw(seed);
  document.getElementById('caption').innerHTML =
    'Strata Break <span>·</span> doodle №9016 <span>·</span> seed ' + seed;
});
</script>
</body>
</html>
