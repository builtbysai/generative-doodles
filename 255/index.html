<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.255 Hard Surface Mech</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1A2E1A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.255 Hard Surface Mech (tanzinchospel.art). After his
// Day 7 hard surface study (2021): a chunky low-poly
// robot, big yellow leg armour, green knee pads, pink
// orange piston feet, standing on a flat green plane
// under a dark sky, lit like a film still. Built flat in
// canvas 2D, no WebGL: the orbit is faked by sliding the
// features and squeezing the silhouette as the yaw turns.
// It idles, plates shifting a few pixels, accents
// breathing. Drag to orbit it; the yaw has inertia.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var YEL = '#F2C230', KNEE = '#4CAF50', PISTON = '#E8785A', GROUND = '#2E7D32', SKY = '#1A2E1A';
var DW = 1200, DH = 900, FLOOR = 618;
var W = 0, H = 0, phone = false;
var viewS = 1, viewOX = 0, viewOY = 0;
var T = 2.0, lastNow = -1; // frame one: three-quarter view, idle mid-shift
var yaw = 0.65, yawVel = 0;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rr(x, y, w, h, r) { // rounded rect path
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---- one leg: thigh armour, green knee, piston foot ---------------------------------
function drawLeg(hipX, k, dark, bob) {
  var hipY = 428 + bob;
  ctx.fillStyle = mix(YEL, SKY, dark);
  rr(hipX - 44 * k, hipY, 88 * k, 82, 16 * k); ctx.fill();            // thigh armour
  ctx.fillStyle = mix(YEL, SKY, dark + 0.16);
  rr(hipX - 44 * k, hipY + 52, 88 * k, 30, 10 * k); ctx.fill();       // thigh shade band
  ctx.fillStyle = mix(KNEE, SKY, dark);
  rr(hipX - 50 * k, hipY + 76, 100 * k, 44, 13 * k); ctx.fill();      // knee pad
  ctx.fillStyle = mix(YEL, SKY, dark + 0.10);
  rr(hipX - 33 * k, hipY + 124, 66 * k, 58, 9 * k); ctx.fill();       // shin
  ctx.fillStyle = mix(PISTON, SKY, dark);
  rr(hipX - 40 * k, hipY + 178, 80 * k, 13, 6); ctx.fill();           // piston rod collar
  rr(hipX - 58 * k, hipY + 190, 116 * k, 17, 7); ctx.fill();          // piston cylinder
  rr(hipX - 66 * k, hipY + 206, 132 * k, 13, 5); ctx.fill();         // foot plate
}

// ---- the mech, parametric in yaw -------------------------------------------------------
function drawMech() {
  var c = Math.cos(yaw), s = Math.sin(yaw);
  var ac = Math.abs(c), as = Math.abs(s);
  var CX = 600;
  var bob = Math.sin(T * 1.3) * 3;
  var breathe = 0.5 + 0.5 * Math.sin(T * 0.9);
  var wf = 0.60 + 0.40 * ac;                       // silhouette squeeze at side view
  var legSpread = 106 * c;                          // legs converge as it turns
  var nearIsRight = s >= 0;
  var plateShift = Math.sin(T * 0.7) * 2.5;

  // ground shadow
  ctx.fillStyle = rgba(SKY, 0.55);
  ctx.beginPath(); ctx.ellipse(CX, FLOOR + 26, 235, 26, 0, 0, Math.PI * 2); ctx.fill();

  var leftHip = CX - legSpread, rightHip = CX + legSpread;
  // far leg, then body, then near leg, so the hips overlap honestly
  if (nearIsRight) drawLeg(leftHip, 0.93, 0.30, 0); else drawLeg(rightHip, 0.93, 0.30, 0);

  // far arm, behind the torso
  var farArmX = CX + (nearIsRight ? -1 : 1) * (128 * wf + 16);
  ctx.fillStyle = mix(YEL, SKY, 0.34);
  rr(farArmX - 25, 292 + bob, 50, 128, 14); ctx.fill();
  ctx.fillStyle = mix(PISTON, SKY, 0.34);
  rr(farArmX - 25, 402 + bob, 50, 20, 8); ctx.fill();                  // far fist

  // pelvis
  ctx.fillStyle = mix(YEL, SKY, 0.14);
  rr(CX - 98 * wf, 398 + bob, 196 * wf, 48, 12); ctx.fill();

  // chest: front plate plus the side face the yaw exposes
  var chestW = 258 * wf, chestX = CX - chestW / 2, chestY = 262 + bob;
  ctx.fillStyle = YEL;
  rr(chestX, chestY, chestW, 142, 18); ctx.fill();
  if (as > 0.06) { // side face, on the side the turn opens
    var sideW = 44 * as;
    ctx.fillStyle = mix(YEL, SKY, 0.22);
    ctx.beginPath();
    if (s > 0) { // right side opens
      ctx.moveTo(chestX + chestW - 4, chestY + 10);
      ctx.lineTo(chestX + chestW + sideW, chestY + 26);
      ctx.lineTo(chestX + chestW + sideW, chestY + 116);
      ctx.lineTo(chestX + chestW - 4, chestY + 132);
    } else {     // left side opens
      ctx.moveTo(chestX + 4, chestY + 10);
      ctx.lineTo(chestX - sideW, chestY + 26);
      ctx.lineTo(chestX - sideW, chestY + 116);
      ctx.lineTo(chestX + 4, chestY + 132);
    }
    ctx.closePath(); ctx.fill();
    // a piston detail riding the side face
    ctx.fillStyle = mix(PISTON, SKY, 0.10);
    var px = s > 0 ? chestX + chestW + sideW * 0.28 : chestX - sideW * 0.72;
    rr(px, chestY + 52, 16, 52, 6); ctx.fill();
  }
  // front details fade as the front turns away
  if (ac > 0.12) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, ac * 1.6);
    ctx.fillStyle = mix(YEL, SKY, 0.30);
    rr(chestX + 22 + plateShift, chestY + 22, chestW - 44, 40, 9); ctx.fill(); // chest plate, idling
    ctx.fillStyle = mix(KNEE, SKY, 0.05);
    for (var v = 0; v < 3; v++) rr(chestX + 30 + plateShift, chestY + 82 + v * 15, chestW - 60, 6, 3), ctx.fill(); // vents
    ctx.fillStyle = rgba(PISTON, 0.45 + 0.55 * breathe);
    rr(chestX + chestW * 0.30, chestY + 118, chestW * 0.40, 8, 4); ctx.fill(); // emissive strip
    ctx.restore();
  }

  // head: a block with a breathing eye slit, set by the yaw
  var headW = 76 * (0.66 + 0.34 * ac), headX = CX - headW / 2 + s * 14, headY = 196 + bob;
  ctx.fillStyle = mix(YEL, SKY, 0.08);
  rr(headX, headY, headW, 62, 10); ctx.fill();
  ctx.fillStyle = mix(YEL, SKY, 0.30);
  rr(headX - 8, headY - 12, headW + 16, 14, 6); ctx.fill();            // brow plate
  if (ac > 0.12) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, ac * 1.7);
    ctx.fillStyle = rgba(PISTON, 0.5 + 0.5 * breathe);
    var eyeW = headW * 0.52;
    rr(CX + s * 14 - eyeW / 2, headY + 30, eyeW, 8, 4); ctx.fill();    // eye slit
    ctx.restore();
  }
  ctx.fillStyle = mix(PISTON, SKY, 0.05);
  rr(CX + s * 14 - 3, headY - 34, 6, 24, 3); ctx.fill();               // antenna

  // near shoulder pad and arm
  var nearArmX = CX + (nearIsRight ? 1 : -1) * (128 * wf + 16) + Math.sin(T * 0.9 + 1) * 2;
  ctx.fillStyle = YEL;
  rr(nearArmX - 40, 268 + bob, 80, 62, 16); ctx.fill();                // shoulder pad
  ctx.fillStyle = mix(YEL, SKY, 0.18);
  rr(nearArmX - 26, 326 + bob, 52, 92, 13); ctx.fill();                // upper arm
  ctx.fillStyle = mix(PISTON, SKY, 0.05);
  rr(nearArmX - 26, 404 + bob, 52, 22, 9); ctx.fill();                 // fist

  // near leg over the pelvis edge
  if (nearIsRight) drawLeg(rightHip, 1.0, 0.02, 0); else drawLeg(leftHip, 1.0, 0.02, 0);

  // three-point light, suggested flat and kept ON the body:
  // a green key wash clipped to the chest and head, falling
  // from the left; a warm orange rim down the near pad edge
  ctx.save();
  rr(chestX, chestY, chestW, 142, 18);
  rr(CX - headW / 2 + s * 14, headY, headW, 62, 10);
  ctx.clip();
  ctx.fillStyle = rgba(KNEE, 0.09);
  ctx.beginPath();
  ctx.moveTo(CX - 190, 180 + bob); ctx.lineTo(CX - 26, 180 + bob);
  ctx.lineTo(CX - 74, chestY + 150); ctx.lineTo(CX - 218, chestY + 150);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = rgba(PISTON, 0.5);
  ctx.lineWidth = 3.5;
  var rimX = nearArmX + (nearIsRight ? 37 : -37);
  ctx.beginPath(); ctx.moveTo(rimX, 276 + bob); ctx.lineTo(rimX, 322 + bob); ctx.stroke();
}

function draw() {
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, DW, DH);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, FLOOR, DW, DH - FLOOR);
  ctx.fillStyle = mix(GROUND, SKY, 0.35);
  ctx.fillRect(0, DH - 60, DW, 60);                                     // the plane darkens away
  ctx.fillStyle = rgba(KNEE, 0.20);
  ctx.fillRect(0, FLOOR, DW, 3);                                        // horizon kiss
  drawMech();
}

// ---- drag to orbit -------------------------------------------------------------------------
var dragging = false, lastPX = 0;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true;
  lastPX = e.clientX;
  yawVel = 0;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var dx = (e.clientX - lastPX) / viewS;
  lastPX = e.clientX;
  yaw += dx * 0.0085;
  yawVel = dx * 0.0085 * 60; // per second, for the release
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);
  // contain-fit: the film still keeps its shape, centred,
  // the dark sky filling whatever the screen leaves
  viewS = Math.min(W / DW, H / DH);
  viewOX = (W - DW * viewS) / 2;
  viewOY = (H - DH * viewS) / 2;
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  if (!dragging && dt > 0) { // inertia after a drag, damped to rest
    yaw += yawVel * dt;
    yawVel *= Math.exp(-2.4 * dt);
    if (Math.abs(yawVel) < 0.001) yawVel = 0;
  }
  ctx.setTransform(viewS, 0, 0, viewS, viewOX, viewOY);
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
