<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№136 · Olympic Form</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0D; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(237,230,214,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scrub the letters</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function sstep(x){ x=clamp(x,0,1); return x*x*(3-2*x); }

// No.136 Olympic Form: a single bone-white contour of an athlete's body
// resolves into a letter, holds, and melts into the next figure, spelling
// C H A R S T. Figures and glyphs share one resampled point count, so every
// morph is a point-for-point interpolation of a single unbroken line.
const GROUND='#0B0B0D', BONE='#EDE6D6';
const N=120, LETTERS=6, SEG=8, LOOP=LETTERS*SEG;

// --- contour authoring (unit space, y down, figure height about 0.86) ---
const FIGURES=[
  // 1 backbend (for C): hands top right, spine sweeping left and down, feet low right
  [[0.24,-0.38],[0.20,-0.30],[0.19,-0.24],[0.12,-0.22],[0.05,-0.16],[-0.08,-0.08],[-0.14,0.04],[-0.13,0.14],[-0.08,0.26],[-0.02,0.36],[0.03,0.42],[0.09,0.40],[0.05,0.28],[0.06,0.16],[0.08,0.05],[0.11,-0.05],[0.15,-0.14],[0.19,-0.17],[0.22,-0.26],[0.27,-0.33]],
  // 2 hurdler (for H): front leg extended, back leg trailing
  [[-0.02,-0.42],[0.03,-0.37],[0.02,-0.31],[0.07,-0.28],[0.13,-0.16],[0.15,-0.06],[0.09,-0.05],[0.06,0.02],[0.08,0.08],[0.20,0.10],[0.32,0.11],[0.38,0.13],[0.38,0.18],[0.24,0.17],[0.10,0.15],[0.01,0.14],[-0.08,0.22],[-0.14,0.30],[-0.10,0.40],[-0.04,0.43],[-0.03,0.32],[-0.02,0.20],[-0.05,0.08],[-0.06,-0.02],[-0.14,-0.10],[-0.09,-0.16],[-0.06,-0.27],[-0.04,-0.32],[-0.07,-0.37]],
  // 3 lifter (for A): arms raised in a V, legs in an A stance
  [[-0.12,-0.44],[-0.17,-0.31],[-0.10,-0.25],[-0.045,-0.285],[-0.05,-0.35],[0,-0.385],[0.05,-0.35],[0.045,-0.285],[0.10,-0.25],[0.17,-0.31],[0.12,-0.44],[0.06,-0.32],[0.065,-0.20],[0.07,-0.05],[0.09,0.05],[0.19,0.24],[0.30,0.42],[0.21,0.42],[0.08,0.22],[0,0.15],[-0.08,0.22],[-0.21,0.42],[-0.30,0.42],[-0.19,0.24],[-0.09,0.05],[-0.07,-0.05],[-0.065,-0.20],[-0.06,-0.32]],
  // 4 sprinter (for R): crouched drive, diagonal body
  [[-0.24,-0.40],[-0.17,-0.36],[-0.13,-0.26],[-0.16,-0.20],[-0.10,-0.14],[-0.04,-0.04],[-0.09,-0.02],[-0.08,0.02],[0.04,0.10],[0.12,0.20],[0.14,0.34],[0.18,0.42],[0.11,0.42],[0.07,0.26],[0.0,0.16],[-0.06,0.10],[-0.18,0.20],[-0.27,0.31],[-0.35,0.39],[-0.30,0.35],[-0.20,0.24],[-0.12,0.12],[-0.14,0.0],[-0.24,-0.02],[-0.27,0.06],[-0.20,-0.08],[-0.20,-0.22],[-0.27,-0.33]],
  // 5 gymnast (for S): chest arched one way, hips the other, one leg tucked
  [[0.10,-0.42],[0.16,-0.36],[0.13,-0.29],[0.18,-0.16],[0.13,-0.03],[0.10,0.06],[0.16,0.16],[0.15,0.28],[0.11,0.38],[0.15,0.44],[0.07,0.44],[0.05,0.30],[0.02,0.18],[-0.03,0.10],[-0.10,0.18],[-0.13,0.28],[-0.08,0.36],[-0.04,0.30],[-0.05,0.14],[-0.11,0.02],[-0.08,-0.10],[-0.02,-0.20],[-0.10,-0.28],[-0.14,-0.36],[-0.07,-0.34],[-0.03,-0.30],[-0.01,-0.35],[0.03,-0.39]],
  // 6 crucifix (for T): arms level, legs together
  [[-0.40,-0.26],[-0.10,-0.285],[-0.045,-0.30],[-0.05,-0.36],[0,-0.415],[0.05,-0.36],[0.045,-0.30],[0.10,-0.285],[0.40,-0.26],[0.40,-0.185],[0.09,-0.20],[0.065,-0.13],[0.07,0.05],[0.075,0.25],[0.08,0.42],[0.02,0.425],[0.01,0.20],[-0.01,0.20],[-0.02,0.425],[-0.08,0.42],[-0.075,0.25],[-0.07,0.05],[-0.065,-0.13],[-0.09,-0.20],[-0.40,-0.185]]
];
function strokeOutline(spine, hw){
  const left=[], right=[];
  for(let i=0;i<spine.length;i++){
    const p=spine[i], pa=spine[Math.max(0,i-1)], pb=spine[Math.min(spine.length-1,i+1)];
    let tx=pb[0]-pa[0], ty=pb[1]-pa[1]; const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
    left.push([p[0]-ty*hw, p[1]+tx*hw]);
    right.push([p[0]+ty*hw, p[1]-tx*hw]);
  }
  return left.concat(right.reverse());
}
function cSpine(){ const pts=[]; for(let a=-55; a>=-305; a-=17.5){ const r=a*Math.PI/180; pts.push([0.30*Math.cos(r), 0.30*Math.sin(r)]); } return pts; }
function sSpine(){ return [[0.115,-0.33],[0,-0.35],[-0.10,-0.32],[-0.17,-0.23],[-0.165,-0.14],[-0.10,-0.06],[0,0],[0.10,0.06],[0.165,0.14],[0.17,0.23],[0.10,0.32],[0,0.35],[-0.115,0.33]]; }
const GLYPHS=[
  strokeOutline(cSpine(), 0.06),
  [[-0.30,-0.40],[-0.30,-0.40],[-0.15,-0.40],[-0.15,-0.06],[0.15,-0.06],[0.15,-0.40],[0.30,-0.40],[0.30,-0.40],[0.30,0.40],[0.30,0.40],[0.15,0.40],[0.15,0.08],[-0.15,0.08],[-0.15,0.40],[-0.30,0.40],[-0.30,0.40]],
  [[-0.32,0.40],[-0.32,0.40],[-0.06,-0.40],[-0.06,-0.40],[0.06,-0.40],[0.06,-0.40],[0.32,0.40],[0.32,0.40],[0.17,0.40],[0.10,0.14],[0.10,0.14],[-0.10,0.14],[-0.10,0.14],[-0.17,0.40]],
  [[-0.28,-0.40],[-0.28,-0.40],[0.05,-0.40],[0.20,-0.37],[0.28,-0.26],[0.28,-0.16],[0.22,-0.07],[0.10,-0.03],[0.30,0.40],[0.30,0.40],[0.14,0.40],[-0.02,0.05],[-0.13,0.05],[-0.13,0.40],[-0.28,0.40],[-0.28,0.40]],
  strokeOutline(sSpine(), 0.06),
  [[-0.32,-0.40],[-0.32,-0.40],[0.32,-0.40],[0.32,-0.40],[0.32,-0.26],[0.32,-0.26],[0.075,-0.26],[0.075,0.40],[0.075,0.40],[-0.075,0.40],[-0.075,0.40],[-0.075,-0.26],[-0.32,-0.26],[-0.32,-0.26]]
];
// --- shared resampling: every contour becomes N points, same winding, top start ---
function catmull(p0,p1,p2,p3,t){
  const t2=t*t, t3=t2*t;
  return [
    0.5*((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    0.5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
  ];
}
function sampleClosed(ctrl, n){
  const M=ctrl.length, dense=[], steps=14;
  for(let i=0;i<M;i++){
    const p0=ctrl[(i+M-1)%M], p1=ctrl[i], p2=ctrl[(i+1)%M], p3=ctrl[(i+2)%M];
    for(let s=0;s<steps;s++) dense.push(catmull(p0,p1,p2,p3,s/steps));
  }
  const L=[0]; let tot=0;
  for(let i=1;i<=dense.length;i++){ const a=dense[i-1], b=dense[i%dense.length]; tot+=Math.hypot(b[0]-a[0], b[1]-a[1]); L.push(tot); }
  const out=[];
  for(let k=0;k<n;k++){
    const target=tot*k/n;
    let idx=0; while(idx<dense.length-1 && L[idx+1]<target) idx++;
    const seg=(L[idx+1]-L[idx])||1, f=(target-L[idx])/seg;
    const a=dense[idx%dense.length], b=dense[(idx+1)%dense.length];
    out.push([a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f]);
  }
  return out;
}
function align(pts){
  let area=0;
  for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; area+=a[0]*b[1]-b[0]*a[1]; }
  if(area<0) pts.reverse();
  let best=0;
  for(let i=1;i<pts.length;i++){
    if(pts[i][1]<pts[best][1] || (pts[i][1]===pts[best][1] && Math.abs(pts[i][0])<Math.abs(pts[best][0]))) best=i;
  }
  return pts.slice(best).concat(pts.slice(0,best));
}
const FIG=FIGURES.map(f=>align(sampleClosed(f, N)));
const GLY=GLYPHS.map(g=>align(sampleClosed(g, N)));

let seqT=5.2, lastMs=null, dragging=false, dragLastX=0;

function currentPoints(pt){
  const seg=Math.floor(pt/SEG)%LETTERS, local=pt-seg*SEG;
  const fig=FIG[seg], gly=GLY[seg], next=FIG[(seg+1)%LETTERS];
  if(local<2) return fig;
  if(local<4){ const e=sstep((local-2)/2); return fig.map((p,i)=>[p[0]+(gly[i][0]-p[0])*e, p[1]+(gly[i][1]-p[1])*e]); }
  if(local<7) return gly;
  const e=sstep(local-7);
  return gly.map((p,i)=>[p[0]+(next[i][0]-p[0])*e, p[1]+(next[i][1]-p[1])*e]);
}
function strokePts(pts, S, cx, cy, alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=BONE; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const x=cx+pts[i][0]*S, y=cy+pts[i][1]*S;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(!dragging) seqT+=dt;
  const pt=((seqT%LOOP)+LOOP)%LOOP;
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h);
  const seg=Math.floor(pt/SEG)%LETTERS;
  const S=Math.min(h*0.70, w*0.92)/0.86; // 70% of frame height, but never wider than the frame
  // morph ghost of the previous figure at 18% alpha
  strokePts(FIG[(seg+LETTERS-1)%LETTERS], S, w/2, h/2, 0.18);
  strokePts(currentPoints(pt), S, w/2, h/2, 1);
}
function frame(nowMs){ drawFrame(nowMs); }
function ptr(e){ return [e.clientX, e.clientY]; }
canvas.addEventListener('pointerdown',e=>{ const [x]=ptr(e); dragging=true; dragLastX=x; });
canvas.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const [x]=ptr(e);
  seqT += (x-dragLastX)*(LOOP/Math.max(1, viewportWH()[0]*1.2));
  dragLastX=x; frame(performance.now());
});
function endP(){
  if(!dragging) return;
  dragging=false;
  seqT=Math.round(seqT/SEG)*SEG; // resume from the nearest letter
  frame(performance.now());
}
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);
function loop(nowMs){ frame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
frame(0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>frame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>frame(performance.now()));
</script>
</body>
</html>
