<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9071 · Solstice</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#141210; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(236,229,211,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another solstice</div>
<script>
'use strict';
// No9071 Solstice.
// A low sun inside the square, and the whole square divided into rays
// around it: wedges of varying width, colored by direction. Wedges
// pointing up are warm (bone, wheat, ochre, rust), wedges pointing down
// are cool (slate, teal, deep teal), and the wedges at the horizons mix
// the two families, so the light has a geography. The sun itself is a
// plain vermilion disc, sized and placed by the seed but kept in the
// middle band of the square by the build gate: too high and the geography
// inverts, too low and the warm half vanishes.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9071', 10) || 9071;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const WARM = ['#eee3c6', '#dec491', '#c99e5f', '#b0763a'];
const COOL = ['#5d6157', '#33534b', '#24382f', '#2b4a44'];
const SUN = '#b3402a';

function compose(s) {
  const rnd = mulberry32(s);
  const sx = 0.34 + rnd() * 0.32;               // 0.34..0.66
  const sy = 0.52 + rnd() * 0.22;               // 0.52..0.74, low sun
  const sunR = 0.045 + rnd() * 0.030;

  const wedges = [];
  let a = rnd() * Math.PI * 2;
  const total = Math.PI * 2;
  let acc = 0;
  while (acc < total - 0.06) {
    const wdt = 0.06 + rnd() * 0.16;            // ~3.5..12.6 degrees
    wedges.push({ a0: a + acc, a1: a + acc + Math.min(wdt, total - acc) });
    acc += wdt;
  }
  // Per-wedge color: warm up, cool down, mixed at the horizons, with a
  // seeded pick inside each family so neighbors differ.
  for (const wg of wedges) {
    const mid = (wg.a0 + wg.a1) / 2;
    const up = -Math.sin(mid);                  // canvas y down: up is negative sin
    let fam;
    if (up > 0.25) fam = WARM;
    else if (up < -0.25) fam = COOL;
    else fam = rnd() < 0.5 ? WARM : COOL;
    wg.color = fam[(rnd() * fam.length) | 0];
  }
  return { sx, sy, sunR, wedges, ok: sx > 0.30 && sx < 0.70 && sy > 0.50 && sy < 0.76 && wedges.length >= 42 && wedges.length <= 84 };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.fillStyle = '#141210';
  ctx.fillRect(0, 0, w, h);
  // Portrait phones go full-bleed: the angular wedges radiate to fill
  // any viewport, so the sunburst simply gets taller.
  // Phone layout: use the physical screen size, not the viewport aspect.
  // The viewport can lie (desktop-site mode, pinch state, URL-bar flux)
  // but screen.width always reports the real device.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  if (!piece) piece = buildPiece(seed);
  const p = piece;
  const cx = ox + p.sx * RX, cy = oy + p.sy * RY;
  const R = Math.max(RX, RY) * 1.6;               // past every corner

  ctx.save();
  ctx.beginPath(); ctx.rect(ox, oy, RX, RY); ctx.clip();
  for (const wg of p.wedges) {
    ctx.fillStyle = wg.color;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(wg.a0) * R, cy + Math.sin(wg.a0) * R);
    ctx.lineTo(cx + Math.cos(wg.a1) * R, cy + Math.sin(wg.a1) * R);
    ctx.closePath();
    ctx.fill();
  }
  // The sun.
  ctx.fillStyle = SUN;
  ctx.beginPath();
  ctx.arc(cx, cy, p.sunR * RX, 0, Math.PI * 2);
  ctx.fill();

  const rnd = mulberry32((seed ^ 0x1b56c4) >>> 0);
  for (let g = 0; g < 1800; g++) {
    const x = ox + rnd() * RX, y = oy + rnd() * RY;
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(20,16,10,0.05)' : 'rgba(240,233,214,0.04)';
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
