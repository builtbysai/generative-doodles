<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal Ball</title>
<style>
  html, body { margin: 0; padding: 0; background: #BCE62E; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (flat fills only, no gradients)
  var LIME = '#BCE62E';
  var BALLW = '#F2F0EA';
  var BLUE = '#1B63F0';
  var BLACK = '#000000';
  var BROW = '#E8543A';
  var CLEAT = '#E63946';
  var HANDGREEN = '#7CB518';
  var HANDGREEN_D = '#4E7A0E';
  var DARK = '#10181C';
  var GRAIN_COLS = ['#A9CE22', '#CDEA4E', '#9FC31D', '#B5D92E'];

  var PHASE0 = 1.35;          // constant pre-roll phase for frame one
  var BASE_SEED = 507061;
  var TAU = Math.PI * 2;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function makeLayout(seed) {
    var rnd = mulberry32(seed);
    var L = {};
    L.patchRot = (rnd() * 2 - 1) * 0.18;
    L.pentJit = [];
    for (var i = 0; i < 6; i++) L.pentJit.push((rnd() * 2 - 1) * 0.2);
    L.kickSpread = (rnd() * 2 - 1) * 0.14;
    L.handTiltL = (rnd() * 2 - 1) * 0.16;
    L.handTiltR = (rnd() * 2 - 1) * 0.16;
    L.handPhaseL = rnd() * TAU;
    L.handPhaseR = rnd() * TAU;
    L.grain = [];
    for (var j = 0; j < 240; j++) {
      L.grain.push({
        x: rnd(), y: rnd(),
        r: 0.6 + rnd() * 1.9,
        c: GRAIN_COLS[(rnd() * 4) | 0],
        a: 0.35 + rnd() * 0.5
      });
    }
    return L;
  }

  var seedCount = 0;
  var layout = makeLayout(BASE_SEED);

  function isPhone(w, h) {
    var sw = 9999;
    if (window.screen) sw = Math.min(window.screen.width, window.screen.height);
    if (sw < 700) return true;
    return h > w * 1.15;
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    canvas.width = Math.max(1, Math.round(w));
    canvas.height = Math.max(1, Math.round(h));
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  function pentPath(cx, cy, r, rot) {
    ctx.beginPath();
    for (var i = 0; i < 5; i++) {
      var a = rot + i * TAU / 5;
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // Hand drawn in unit space: origin at wrist, +X toward the ball, total length ~1.03.
  function drawHandUnit(color, outline) {
    var i, bx, by, ang, tx, ty;
    var tips = [0.30, 0.37, 0.34, 0.26];
    var fan = [-0.17, -0.06, 0.05, 0.17];
    ctx.lineCap = 'round';
    // fingers (capsules fanning from the palm front)
    ctx.strokeStyle = color;
    ctx.lineWidth = 0.088;
    for (i = 0; i < 4; i++) {
      bx = 0.64; by = -0.135 + i * 0.09; ang = fan[i];
      tx = bx + Math.cos(ang) * tips[i];
      ty = by + Math.sin(ang) * tips[i];
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke();
    }
    // palm
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(0.50, 0, 0.30, 0.205, 0, 0, TAU);
    ctx.fill();
    ctx.lineWidth = 0.014;
    ctx.strokeStyle = outline;
    ctx.stroke();
    // thumb
    ctx.strokeStyle = color;
    ctx.lineWidth = 0.085;
    ctx.beginPath(); ctx.moveTo(0.32, 0.14); ctx.lineTo(0.58, 0.31); ctx.stroke();
  }

  function placeHand(cornerX, cornerY, color, outline, tilt, phase, sideSign, p, cx, cy, R, S, phone) {
    var dx = cx - cornerX, dy = cy - cornerY;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / dist, uy = dy / dist;
    var ballD = 2 * R;
    var L = ballD * (phone ? 1.45 : 1.7);
    var hover = Math.sin(p * TAU / 5.5 + phase) * 0.014 * S;
    var reach = Math.min(L * 0.46, dist - (R + 0.16 * ballD)) + hover;
    var wx = cornerX + ux * (reach - 1.03 * L);
    var wy = cornerY + uy * (reach - 1.03 * L);
    var ang = Math.atan2(uy, ux) + tilt * 0.3;
    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(ang);
    ctx.scale(L, L * sideSign);
    drawHandUnit(color, outline);
    ctx.restore();
  }

  function drawLeg(side, cx, cy, R, p) {
    var a = Math.PI / 2 + side * (0.62 + layout.kickSpread);
    var ax = cx + Math.cos(a) * R * 0.86;
    var ay = cy + Math.sin(a) * R * 0.86;
    var cyc = p % 3;
    var kickAmt = (cyc < 0.45 && Math.floor(cyc / 0.15) % 2 === 0) ? 1 : 0;
    var delta = -side * 0.45 * kickAmt;
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(a - Math.PI / 2 + delta);
    ctx.lineCap = 'round';
    // sock
    ctx.strokeStyle = BALLW;
    ctx.lineWidth = 0.10 * R;
    ctx.beginPath(); ctx.moveTo(0, -0.05 * R); ctx.lineTo(0, 0.30 * R); ctx.stroke();
    // sock stripes
    ctx.strokeStyle = BLUE;
    ctx.lineWidth = 0.04 * R;
    ctx.beginPath(); ctx.moveTo(-0.052 * R, 0.17 * R); ctx.lineTo(0.052 * R, 0.17 * R); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.052 * R, 0.25 * R); ctx.lineTo(0.052 * R, 0.25 * R); ctx.stroke();
    // boot
    ctx.strokeStyle = CLEAT;
    ctx.lineWidth = 0.115 * R;
    ctx.beginPath(); ctx.moveTo(0, 0.30 * R); ctx.lineTo(0.03 * R, 0.46 * R); ctx.stroke();
    ctx.lineWidth = 0.095 * R;
    ctx.beginPath(); ctx.moveTo(0.03 * R, 0.46 * R); ctx.lineTo(0.17 * R, 0.50 * R); ctx.stroke();
    // cleats
    ctx.fillStyle = DARK;
    var cleats = [[0.0, 0.53], [0.08, 0.555], [0.16, 0.54]];
    for (var i = 0; i < cleats.length; i++) {
      ctx.beginPath();
      ctx.arc(cleats[i][0] * R, cleats[i][1] * R, 0.018 * R, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFace(fx, fy, R) {
    var i, s, ox, oy;
    ctx.lineCap = 'round';
    // eyes: two big black ovals
    ctx.fillStyle = BLACK;
    for (s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.ellipse(fx + s * 0.15 * R, fy, 0.08 * R, 0.125 * R, 0, 0, TAU);
      ctx.fill();
    }
    // brow arcs (red)
    ctx.strokeStyle = BROW;
    ctx.lineWidth = 0.032 * R;
    for (s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.arc(fx + s * 0.15 * R, fy - 0.13 * R, 0.105 * R, Math.PI * 1.18, Math.PI * 1.82);
      ctx.stroke();
    }
    // blush strokes (red, three per cheek)
    ctx.lineWidth = 0.026 * R;
    for (s = -1; s <= 1; s += 2) {
      for (i = 0; i < 3; i++) {
        ox = fx + s * 0.29 * R;
        oy = fy + (0.05 + i * 0.05) * R;
        ctx.beginPath();
        ctx.moveTo(ox - 0.038 * R, oy + 0.018 * R);
        ctx.lineTo(ox + 0.038 * R, oy - 0.018 * R);
        ctx.stroke();
      }
    }
    // small smile
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = 0.028 * R;
    ctx.beginPath();
    ctx.arc(fx, fy + 0.10 * R, 0.075 * R, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
  }

  function draw(elapsed) {
    var w = canvas.width, h = canvas.height;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var S = Math.min(w, h);
    var cx = w / 2, cy = h / 2;
    var R = 0.275 * S;
    var phone = isPhone(w, h);
    var p = PHASE0 + elapsed;
    var i, g;

    // ground
    ctx.fillStyle = LIME;
    ctx.fillRect(0, 0, w, h);
    // grain: precomputed seeded specks, drawn directly each frame
    for (i = 0; i < layout.grain.length; i++) {
      g = layout.grain[i];
      ctx.globalAlpha = g.a;
      ctx.fillStyle = g.c;
      ctx.beginPath();
      ctx.arc(g.x * w, g.y * h, g.r * S / 500, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // giant detached hands at the top corners
    placeHand(0, 0, HANDGREEN, HANDGREEN_D, layout.handTiltL, layout.handPhaseL, 1, p, cx, cy, R, S, phone);
    placeHand(w, 0, BALLW, DARK, layout.handTiltR, layout.handPhaseR, -1, p, cx, cy, R, S, phone);

    // bob (whole ball group) and squash (ball and face)
    var bobY = Math.sin(p * TAU / 2.6) * 0.010 * S;
    var sq = Math.sin(p * TAU / 2.6 + Math.PI / 3);

    // boot legs first, so the sock roots tuck under the ball edge
    drawLeg(-1, cx, cy + bobY, R, p);
    drawLeg(1, cx, cy + bobY, R, p);

    // ball
    ctx.save();
    ctx.translate(cx, cy + bobY);
    ctx.scale(1 - 0.022 * sq, 1 + 0.04 * sq);
    ctx.fillStyle = BALLW;
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, TAU);
    ctx.fill();
    // pentagon patches, clipped to the ball
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, TAU);
    ctx.clip();
    ctx.fillStyle = BLUE;
    pentPath(0, 0, 0.36 * R, layout.patchRot - Math.PI / 2 + layout.pentJit[0]);
    ctx.fill();
    var ulAng = 0, best = 1e9;
    for (i = 0; i < 5; i++) {
      var ang = -Math.PI / 2 + i * TAU / 5 + layout.patchRot;
      var px = Math.cos(ang) * 0.64 * R;
      var py = Math.sin(ang) * 0.64 * R;
      pentPath(px, py, 0.34 * R, ang + layout.pentJit[i + 1]);
      ctx.fill();
      var ddx = Math.cos(ang) - (-0.7071), ddy = Math.sin(ang) - (-0.7071);
      var dd = ddx * ddx + ddy * ddy;
      if (dd < best) { best = dd; ulAng = ang; }
    }
    ctx.restore();
    // face on the upper-left pentagon area
    drawFace(Math.cos(ulAng) * 0.50 * R, Math.sin(ulAng) * 0.50 * R, R);
    // ball outline
    ctx.strokeStyle = BLUE;
    ctx.lineWidth = 0.006 * S;
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  function reseed() {
    seedCount++;
    layout = makeLayout(BASE_SEED + seedCount * 7919);
  }

  canvas.addEventListener('dblclick', reseed);
  var lastTap = -1e9;
  canvas.addEventListener('pointerdown', function () {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (now - lastTap < 320) { reseed(); lastTap = -1e9; } else { lastTap = now; }
  });

  // Frame one: one synchronous draw at the constant phase.
  draw(0);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var frame = function (now) {
      draw((now - t0) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
