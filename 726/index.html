<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alignment</title>
<style>
  html, body { margin: 0; padding: 0; background: #08080A; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var BG = '#08080A';
  var PALETTE = ['#FF3838', '#FF9F1A', '#F7E731', '#54A0FF', '#2E5BFF', '#1DD1A1', '#FFFFFF'];

  var N = 12;                 // 12x12 grid of cells
  var CELLS = N * N;
  var T = 24;                 // seconds per loop; two alignment waves per loop
  var INSET = 0.055;          // seam gap at each end of a quarter arc (rad)

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var viewW = 0, viewH = 0, isPhone = false;

  // ---------- inert QA hook: ?seed=tNN forces the loop time ----------
  var forcedT = -1;
  (function () {
    try {
      var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(location.search || '');
      if (m) forcedT = parseFloat(m[1]);
    } catch (e) { /* inert hook, QA only */ }
  })();

  // ---------- seeded RNG ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function smoothstep(a, b, x) {
    var s = (x - a) / (b - a);
    if (s < 0) s = 0; else if (s > 1) s = 1;
    return s * s * (3 - 2 * s);
  }

  function wrapPi(x) { return Math.atan2(Math.sin(x), Math.cos(x)); }

  // ---------- epoch state: everything derives from the epoch seed ----------
  // Per cell: 4 arc colors (constant within the epoch), a base rotation,
  // one phase offset per arc (this is what scattering means: the four arcs
  // of a cell sit at scattered angles, NOT at quarter steps), a slow drift
  // oscillation, per-arc wiggles, and the aligned target rotation (the
  // nearest multiple of 90 degrees to the base rotation).
  var epoch = 0;
  var cells = null;
  function buildEpoch(ep) {
    var rng = mulberry32(0xA1169 + ep * 7919);
    var out = [];
    for (var i = 0; i < CELLS; i++) {
      var colors = [];
      var phi = [];
      var psi = [];
      for (var j = 0; j < 4; j++) {
        colors.push(PALETTE[Math.floor(rng() * PALETTE.length)]);
        phi.push((rng() * 2 - 1) * 1.9);          // scattered offset, up to ~109 deg
        psi.push(rng());                          // wiggle phase
      }
      var rho0 = rng() * Math.PI * 2;
      out.push({
        cx: i % N,
        cy: Math.floor(i / N),
        colors: colors,
        phi: phi,
        psi: psi,
        rho0: rho0,
        rhoA: Math.round(rho0 / (Math.PI / 2)) * (Math.PI / 2),
        driftAmp: 0.25 + rng() * 0.5,
        driftFreq: 1 + Math.floor(rng() * 2),     // integer: loop closes exactly
        driftPhase: rng()
      });
    }
    return out;
  }
  cells = buildEpoch(0);

  // ---------- phase convergence ----------
  // Alignment strength A(cell, u), u = loop phase in [0,1):
  //   A = E(u) * W(cell, u)
  // E(u): trapezoid envelope, 0 at u=0 and u=1 (so frame one is fully
  // scattered and the loop closes on the same scattered field), ramping in
  // over u in [0.03, 0.18] and out over [0.82, 0.97], flat 1 between.
  // W(cell, u): the diagonal traveling wave. With d = (cx+cy)/(2(N-1)) the
  // normalized diagonal coordinate, the wave phase is q = 2u - 1.15d + 0.35
  // (the factor 2 gives two waves per loop; the 1.15 sweep carries each
  // wavefront corner to corner). g = cos(2*pi*frac(q)) peaks at 1 as the
  // front crosses the cell's diagonal; W = smoothstep(0.55, 0.92, g), so a
  // band a few diagonals wide reaches full alignment as the front passes.
  function alignment(cell, u) {
    var env = smoothstep(0.03, 0.18, u) * (1 - smoothstep(0.82, 0.97, u));
    if (env <= 0) return 0;
    var d = (cell.cx + cell.cy) / (2 * (N - 1));
    var q = 2 * u - 1.15 * d + 0.35;
    var f = q - Math.floor(q);
    var g = Math.cos(2 * Math.PI * f);
    return env * smoothstep(0.55, 0.92, g);
  }

  // ---------- sizing ----------
  var currentT = 0;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    viewW = Math.max(1, Math.floor(w));
    viewH = Math.max(1, Math.floor(h));
    canvas.width = viewW;
    canvas.height = viewH;
    var sw = (window.screen && window.screen.width) || 9999;
    var sh = (window.screen && window.screen.height) || 9999;
    isPhone = Math.min(sw, sh) < 700 || viewH > viewW * 1.15;
    draw(forcedT >= 0 ? forcedT : currentT);
  }

  // ---------- drawing ----------
  // Arcs are only ever drawn as quarter arcs. A complete circle exists in
  // the piece only when A reaches 1 and the four quarter arcs of a cell
  // land exactly on quarter positions with just the seam insets between
  // them; no full-circle path is ever stroked.
  function draw(t) {
    currentT = t;
    if (!viewW || !viewH) return;
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, viewW, viewH);

    var lt = ((t % T) + T) % T;
    var u = lt / T;

    // centered square field, refits any frame
    var field = Math.min(viewW, viewH) * 0.94;
    var cell = field / N;
    var ox = (viewW - field) / 2, oy = (viewH - field) / 2;
    var R = cell * 0.30;
    var lw = Math.max(1.2, cell * 0.18);          // thick strokes, ~18% of cell

    ctx.lineCap = 'butt';

    for (var i = 0; i < CELLS; i++) {
      var c = cells[i];
      var A = alignment(c, u);
      var rho = c.rho0 + c.driftAmp * Math.sin(2 * Math.PI * (c.driftFreq * u + c.driftPhase));
      var px = ox + (c.cx + 0.5) * cell;
      var py = oy + (c.cy + 0.5) * cell;
      for (var j = 0; j < 4; j++) {
        var scattered = rho + j * Math.PI / 2 + c.phi[j] +
          0.3 * Math.sin(2 * Math.PI * (2 * u + c.psi[j]));
        var aligned = c.rhoA + j * Math.PI / 2;
        // shortest-path interpolation: at A=1 the arc sits exactly on its
        // quarter; at A=0 it sits at its scattered angle
        var theta = aligned + wrapPi(scattered - aligned) * (1 - A);
        ctx.strokeStyle = c.colors[j];
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.arc(px, py, R, theta + INSET, theta + Math.PI / 2 - INSET);
        ctx.stroke();
      }
    }
  }

  // ---------- interaction: tap reseeds the phase field ----------
  function reseed() {
    epoch += 1;
    cells = buildEpoch(epoch);
    startStamp = null; // re-anchor the loop clock at the next frame
    draw(forcedT >= 0 ? forcedT : 0);
  }
  canvas.addEventListener('pointerdown', function () { reseed(); });

  // ---------- boot + loop ----------
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    draw((ts - startStamp) / 1000);
    requestAnimationFrame(frame);
  }

  function onResize() { resize(); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  resize();
  draw(forcedT >= 0 ? forcedT : 0); // frame one: synchronous, loop t = 0, never clock-derived

  if (forcedT < 0 && typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
