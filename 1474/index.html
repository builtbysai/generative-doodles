<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewind Until It Collapses</title>
<style>
html, body { margin: 0; padding: 0; background: #1c1c22; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (prompt only, no other color).
  var GREY = [184, 188, 192];   // broadcast grey #b8bcc0
  var SUIT = [42, 42, 48];      // suits charcoal #2a2a30
  var TEAL = [46, 111, 106];    // studio backdrop teal #2e6f6a
  var FRAME = [28, 28, 34];     // screen frame black #1c1c22
  var GOLD = [217, 164, 65];    // rewind reel gold #d9a441
  var PALE = [216, 210, 196];   // drained figures pale #d8d2c4

  function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  function lerp(a, b, t) {
    return [Math.round(a[0] + (b[0] - a[0]) * t),
            Math.round(a[1] + (b[1] - a[1]) * t),
            Math.round(a[2] + (b[2] - a[2]) * t)];
  }
  function mod(n, m) { return ((n % m) + m) % m; }

  // Timeline: 36 s cycle = 3 passes x 12 s. Each pass: 8 s play, then a
  // 4 s rewind that scrubs backwards at increasing speed (playhead
  // 1 - rt^2, so its speed grows with rt). Drain grows from pass/3
  // during play to (pass+1)/3 across the rewind, so after three passes
  // the figures are fully pale and small, and the loop restarts at
  // full color. No randomness anywhere, so every frame is reproducible.
  var CYCLE = 36, PASS = 12, PLAY = 8, REW = 4;

  var CW = 0, CH = 0, PHONE = false;
  function size() {
    var w, h;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      w = visualViewport.width; h = visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    CW = w; CH = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    var sw = window.screen ? window.screen.width : w;
    var sh = window.screen ? window.screen.height : h;
    PHONE = (Math.min(sw, sh) < 700) || (h > w * 1.15);
  }
  size();

  // Drag-to-rewind state: anchor re-based on release, never a restart.
  var anchorT = 0, anchorP = 0, lastT = 0;
  var dragging = false, lastX = 0, dragOffset = 0;
  var DRAG_RATE = 0.02; // timeline seconds per dragged pixel

  function computeP(t) {
    return mod(anchorP + (t - anchorT) + (dragging ? dragOffset : 0), CYCLE);
  }
  // Returns {P, pass, phase, playhead, drain, mouth} for piece time t.
  function stateAt(t) {
    var P = computeP(t);
    var pass = Math.floor(P / PASS);
    var passT = P - pass * PASS;
    var phase, playhead, drain;
    if (passT < PLAY) {
      phase = 'play';
      playhead = passT / PLAY;
      drain = pass / 3;
    } else {
      phase = 'rewind';
      var rt = (passT - PLAY) / REW;
      playhead = 1 - rt * rt;
      drain = (pass + rt) / 3;
    }
    var mouth = 0.35 + 0.65 * Math.abs(Math.sin(playhead * Math.PI * 4));
    return { P: P, pass: pass, phase: phase, playhead: playhead, drain: drain, mouth: mouth };
  }

  function layout() {
    var m = PHONE ? 0 : Math.round(Math.min(CW, CH) * 0.03);
    var tv = { x: m, y: m, w: CW - 2 * m, h: Math.round(CH * 0.64) };
    var strip = { x: m, y: tv.y + tv.h + Math.round(CH * 0.02), w: CW - 2 * m,
                  h: CH - m - (tv.y + tv.h + Math.round(CH * 0.02)) };
    return { tv: tv, strip: strip };
  }

  function draw(t) {
    lastT = t;
    var st = stateAt(t);
    var L = layout();
    var tv = L.tv, strip = L.strip;

    // Ground.
    ctx.fillStyle = rgb(FRAME);
    ctx.fillRect(0, 0, CW, CH);

    // TV screen: black frame, teal studio, grey floor band.
    var bez = PHONE ? 8 : 11;
    ctx.fillStyle = rgb(GREY);
    ctx.fillRect(tv.x, tv.y, tv.w, tv.h);
    ctx.fillStyle = rgb(FRAME);
    ctx.fillRect(tv.x + bez, tv.y + bez, tv.w - 2 * bez, tv.h - 2 * bez);
    var ix = tv.x + 2 * bez, iy = tv.y + 2 * bez;
    var iw = tv.w - 4 * bez, ih = tv.h - 4 * bez;
    ctx.fillStyle = rgb(TEAL);
    ctx.fillRect(ix, iy, iw, ih);
    var floorH = Math.round(ih * 0.20);
    ctx.fillStyle = rgb(GREY);
    ctx.fillRect(ix, iy + ih - floorH, iw, floorH);

    // Suited figures: 2 rows x 5, identical, drained by color and size.
    var figCol = lerp(SUIT, PALE, st.drain);
    var scale = 1 - 0.35 * st.drain;
    var colW = iw / 5;
    var fh = Math.min(ih * 0.30, colW * 1.4) * scale;
    var bodyW = fh * 0.52;
    var headR = fh * 0.17;
    var rows = [iy + ih * 0.14, iy + ih * 0.50];
    ctx.fillStyle = rgb(figCol);
    for (var r = 0; r < 2; r++) {
      var ty = rows[r];
      for (var c = 0; c < 5; c++) {
        var cx = ix + colW * (c + 0.5);
        var hy = ty + headR;
        ctx.beginPath();
        ctx.moveTo(cx + headR, hy);
        ctx.arc(cx, hy, headR, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(cx - bodyW / 2, ty + 2 * headR, bodyW, fh - 2 * headR);
      }
    }
    // Mouth lines: one grey line per head, opening with the pronouncement.
    ctx.strokeStyle = rgb(GREY);
    ctx.lineWidth = Math.max(2, headR * 0.12);
    ctx.beginPath();
    for (var r2 = 0; r2 < 2; r2++) {
      var ty2 = rows[r2];
      for (var c2 = 0; c2 < 5; c2++) {
        var cx2 = ix + colW * (c2 + 0.5);
        var hy2 = ty2 + headR;
        var len = headR * 0.6 + st.mouth * headR * 0.8;
        var my = hy2 + headR * 0.25;
        ctx.moveTo(cx2 - len / 2, my);
        ctx.lineTo(cx2 + len / 2, my);
      }
    }
    ctx.stroke();

    // Control strip: gold tape reel (rotates with the playhead, so it
    // visibly runs backwards during a rewind) and a timeline track.
    var midY = strip.y + strip.h / 2;
    var reelR = Math.min(strip.h * 0.30, 70);
    var reelX = strip.x + reelR + Math.max(14, strip.w * 0.02);
    var reelY = midY;
    ctx.fillStyle = rgb(GOLD);
    ctx.beginPath();
    ctx.moveTo(reelX + reelR, reelY);
    ctx.arc(reelX, reelY, reelR, 0, Math.PI * 2);
    ctx.fill();
    var ang = st.playhead * Math.PI * 4 + st.pass * Math.PI;
    ctx.strokeStyle = rgb(FRAME);
    ctx.lineWidth = Math.max(3, reelR * 0.07);
    ctx.beginPath();
    for (var s = 0; s < 4; s++) {
      var a = ang + s * Math.PI / 2;
      ctx.moveTo(reelX, reelY);
      ctx.lineTo(reelX + Math.cos(a) * reelR * 0.9, reelY + Math.sin(a) * reelR * 0.9);
    }
    ctx.stroke();
    ctx.fillStyle = rgb(FRAME);
    ctx.beginPath();
    ctx.moveTo(reelX + reelR * 0.14, reelY);
    ctx.arc(reelX, reelY, reelR * 0.14, 0, Math.PI * 2);
    ctx.fill();

    // Timeline track with a gold playhead marker.
    var trackX0 = reelX + reelR + Math.max(20, strip.w * 0.03);
    var trackX1 = strip.x + strip.w - Math.max(14, strip.w * 0.02);
    ctx.fillStyle = rgb(GREY);
    ctx.fillRect(trackX0, midY - 3, trackX1 - trackX0, 6);
    var mx = trackX0 + st.playhead * (trackX1 - trackX0);
    ctx.fillStyle = rgb(GOLD);
    ctx.beginPath();
    ctx.moveTo(mx + 10, midY);
    ctx.arc(mx, midY, 10, 0, Math.PI * 2);
    ctx.fill();

    // Drain pips: one filled gold square per completed rewind pass.
    var filled = Math.min(3, Math.floor(st.drain * 3 + 0.001));
    var pip = 18, gap = 10;
    var pipsW = 3 * pip + 2 * gap;
    var px = trackX0 + (trackX1 - trackX0 - pipsW) / 2;
    var py = midY + Math.max(26, strip.h * 0.16);
    for (var p = 0; p < 3; p++) {
      var bx = px + p * (pip + gap);
      if (p < filled) {
        ctx.fillStyle = rgb(GOLD);
        ctx.fillRect(bx, py, pip, pip);
      } else {
        ctx.strokeStyle = rgb(GREY);
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, py, pip, pip);
      }
    }
  }

  function pxOf(e) {
    if (typeof e.offsetX !== 'undefined') return e.offsetX;
    return e.clientX;
  }
  function onDown(e) {
    var L = layout();
    var x = pxOf(e);
    var y = (typeof e.offsetY !== 'undefined') ? e.offsetY : e.clientY;
    if (y < L.strip.y || y > L.strip.y + L.strip.h) return;
    dragging = true; lastX = x; dragOffset = 0;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var x = pxOf(e);
    dragOffset += (x - lastX) * DRAG_RATE;
    lastX = x;
    draw(lastT);
  }
  function onUp(e) {
    if (!dragging) return;
    anchorP = computeP(lastT);
    anchorT = lastT;
    dragOffset = 0;
    dragging = false;
    draw(lastT);
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { size(); draw(lastT); });
  }
  if (typeof visualViewport !== 'undefined' && visualViewport &&
      visualViewport.addEventListener) {
    visualViewport.addEventListener('resize', function () { size(); draw(lastT); });
  }

  // Test hook for the QA harness (vm-isolated instance, forced time).
  if (typeof window !== 'undefined') {
    window.__piece = { draw: draw, state: stateAt };
  }

  // Frame one at a constant phase; the rAF clock starts with the loop.
  draw(0);
  var started = false, t0 = 0;
  function loop(ts) {
    if (!started) { started = true; t0 = ts; }
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
