<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.384 Peaceful Birch</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E1A1C; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.384 Peaceful Birch (jenkbdoodles).
// After Jen K's cabincore birch forest, in her own
// bright-vs-moody duality this piece ships the MOODY
// variant only: eleven pale birch trunks with black
// bark marks rise full-bleed through a deep
// teal-black ground, sage leaves cluster low and mid
// in the understory, and gold leaf-dots fall slowly
// through a faint drifting mist. WATCH-ONLY: no
// pointer handling at all, nothing to touch. The
// trunks sway half a degree, almost imperceptibly;
// the mist crosses on whole cycles; every falling
// dot completes whole falls per loop, so the 60s
// loop is seamless and meditative. All scatter is
// fixed seeded data baked at load, never per-frame
// noise, and everything is drawn directly on this
// ONE canvas: no layers, no offscreen, no gradients.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0E1A1C', TRUNK = '#EFE8DC', BARK = '#1E1E1E';
var LEAF = '#7A9B76', GOLD = '#C9A24B';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 60;
if (LOOP !== 60) throw new Error('Peaceful Birch loop must be 60s');
var SWAY = 30; // 2 whole sway cycles per loop
if (LOOP % SWAY !== 0) throw new Error('sway must complete whole cycles per loop');
var MIST = 30; // 2 whole mist crossings per loop
if (LOOP % MIST !== 0) throw new Error('mist must complete whole cycles per loop');
var TICK = 1 / 60;
var DEG = Math.PI / 180;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-
// looking value in the piece is baked from this at
// load and never changes between frames or renders.
var seed = 384;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- trunks --------------------------------------------
// Exactly 11 trunks asserted, spread across an
// extended field (x from -140 to 1420) so the
// cover-fit crop is full-bleed forest at any aspect.
// Each trunk: base x, base half-width tapering to a
// narrower rounded top, a slight lean that eases in
// toward the top, a sway phase, and its own seeded
// set of bark dashes in trunk-local coordinates.
// Indices 1, 5 and 8 are far trunks: narrower, drawn
// first at low alpha behind the mist.
var BASE_Y = DH + 80;
var LEN = DH + 240;
var TRUNKS = [];
(function () {
  var baseX = [-120, 60, 210, 380, 520, 660, 800, 950, 1100, 1260, 1410];
  var i, j, k, t, trunk;
  for (i = 0; i < baseX.length; i++) {
    var far = (i === 1 || i === 5 || i === 8);
    var wBase = far ? 15 + rnd() * 7 : 24 + rnd() * 20;
    trunk = {
      x: baseX[i] + (rnd() * 60 - 30),
      wBase: wBase,
      wTop: wBase * (0.66 + rnd() * 0.1),
      lean: (rnd() * 32 - 16),
      phase: rnd() * Math.PI * 2,
      far: far,
      dashes: []
    };
    var nDash = 11 + Math.floor(rnd() * 6);
    for (j = 0; j < nDash; j++) {
      t = 0.05 + rnd() * 0.92;
      var halfW = (trunk.wBase + (trunk.wTop - trunk.wBase) * t) / 2;
      var dw = halfW * 2 * (0.3 + rnd() * 0.45);
      trunk.dashes.push({
        t: t,
        cx: trunk.lean * t * t + (rnd() * 2 - 1) * Math.max(0, (halfW - dw / 2)) * 0.8,
        w: dw,
        h: 3.5 + rnd() * 2.5
      });
    }
    TRUNKS.push(trunk);
  }
  if (TRUNKS.length !== 11) throw new Error('Peaceful Birch needs exactly 11 trunks');
})();

function trunkCenterX(trunk, t) { return trunk.lean * t * t; }
function trunkHalfW(trunk, t) { return (trunk.wBase + (trunk.wTop - trunk.wBase) * t) / 2; }

function trunkPath(trunk) {
  // Sampled tapered form: left edge up, rounded cap,
  // right edge down. t = 0 at the base, 1 at the top.
  var N = 14, k, t;
  ctx.beginPath();
  for (k = 0; k <= N; k++) {
    t = k / N;
    var lx = trunkCenterX(trunk, t) - trunkHalfW(trunk, t);
    var ly = -t * LEN;
    if (k === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
  }
  var topCx = trunkCenterX(trunk, 1), topHw = trunkHalfW(trunk, 1);
  ctx.quadraticCurveTo(topCx, -LEN - topHw * 1.1, topCx + topHw, -LEN);
  for (k = N; k >= 0; k--) {
    t = k / N;
    ctx.lineTo(trunkCenterX(trunk, t) + trunkHalfW(trunk, t), -t * LEN);
  }
  ctx.closePath();
}

function drawTrunk(trunk, swayAngle) {
  ctx.save();
  ctx.translate(trunk.x, BASE_Y);
  ctx.rotate(swayAngle);
  trunkPath(trunk);
  ctx.fillStyle = TRUNK;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = BARK;
  for (var j = 0; j < trunk.dashes.length; j++) {
    var d = trunk.dashes[j];
    ctx.fillRect(d.cx - d.w / 2, -d.t * LEN - d.h / 2, d.w, d.h);
  }
  ctx.restore();
  ctx.restore();
}

// ---- mist ----------------------------------------------
// Two direct-drawn ellipse sets, no layer: a back
// set at alpha 0.055 and a faint front veil at
// 0.028, drifting in opposite directions. Each set
// crosses one full wrap span per 30s, two whole
// crossings per loop, and every ellipse is drawn at
// x, x - SPAN and x + SPAN so the wrap is seamless
// across the whole extended field.
var SPAN = 1760;
function mistSet(count, yLo, yHi, a) {
  var set = [], i;
  for (i = 0; i < count; i++) {
    set.push({
      x: rnd() * SPAN,
      y: yLo + rnd() * (yHi - yLo),
      rx: 240 + rnd() * 280,
      ry: 24 + rnd() * 30,
      a: a
    });
  }
  return set;
}
var MIST_BACK = mistSet(7, 230, 700, 0.055);
var MIST_FRONT = mistSet(4, 140, 800, 0.028);

function drawMist(set, off) {
  ctx.fillStyle = TRUNK;
  for (var i = 0; i < set.length; i++) {
    var m = set[i];
    ctx.globalAlpha = m.a;
    for (var k = -1; k <= 1; k++) {
      var x = m.x + off + k * SPAN;
      ctx.beginPath();
      ctx.ellipse(x, m.y, m.rx, m.ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ---- leaves --------------------------------------------
// Sage understory: clusters low (y 640-870) and mid
// (y 380-560), each a short stem with leaves fanning
// upward and outward, plus scattered single leaves.
// All positions and angles are fixed seeded data.
var LEAVES = [];
(function () {
  var i, j;
  function leaf(x, y, ang, len) {
    LEAVES.push({ x: x, y: y, ang: ang, len: len });
  }
  for (i = 0; i < 10; i++) {
    var lowBand = i % 2 === 0;
    var cxp = -160 + rnd() * 1600;
    var cyp = lowBand ? 640 + rnd() * 230 : 380 + rnd() * 180;
    var n = 6 + Math.floor(rnd() * 4);
    for (j = 0; j < n; j++) {
      var a = -Math.PI / 2 + (rnd() * 1.9 - 0.95);
      var dist = 6 + rnd() * 16;
      leaf(cxp + Math.cos(a) * dist, cyp + Math.sin(a) * dist * 0.6, a, 9 + rnd() * 6);
    }
  }
  for (i = 0; i < 16; i++) {
    leaf(-160 + rnd() * 1600, 300 + rnd() * 580, -Math.PI / 2 + (rnd() * 2.2 - 1.1), 8 + rnd() * 6);
  }
})();

function drawLeaf(lf) {
  var L = lf.len, Wd = L * 0.42;
  ctx.save();
  ctx.translate(lf.x, lf.y);
  ctx.rotate(lf.ang + Math.PI / 2);
  ctx.beginPath();
  ctx.moveTo(0, -L / 2);
  ctx.quadraticCurveTo(Wd, 0, 0, L / 2);
  ctx.quadraticCurveTo(-Wd, 0, 0, -L / 2);
  ctx.closePath();
  ctx.fillStyle = LEAF;
  ctx.fill();
  ctx.strokeStyle = GROUND;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -L / 2 + 1.5);
  ctx.lineTo(0, L / 2 - 1.5);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---- falling gold dots ---------------------------------
// Exactly 26 dots asserted. Each dot owns a phase and
// a whole fall count per loop (1 or 2), so over the
// 60s loop every dot makes only complete falls and
// wraps seamlessly back to the top. A gentle sideways
// drift runs on the same whole-cycle count.
var DOTS = [];
(function () {
  var i;
  for (i = 0; i < 26; i++) {
    DOTS.push({
      x: -200 + rnd() * 1680,
      p: rnd(),
      c: rnd() < 0.5 ? 1 : 2,
      r: 2 + rnd() * 1.6,
      amp: 5 + rnd() * 8
    });
  }
  if (DOTS.length !== 26) throw new Error('Peaceful Birch needs exactly 26 falling dots');
})();

// ---- motion state --------------------------------------
// Constant first-frame phase: T = 11.25s into the 60s
// loop. The sway sine sits at 0.375 of its cycle
// (trunks mid-lean), the mist at 0.375 of a crossing
// (mid-drift), and the dots are spread through their
// falls by their phases (mid-fall). Frame one is
// drawn synchronously at this constant; the rAF loop
// advances T from the same anchor in fixed ticks.
// Frame one never reads a wall clock.
var T = 11.25;
var lastNow = -1, acc = 0;

function step() {}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  var i, trunk, sway;
  var mistOff = ((T % MIST) / MIST) * SPAN;
  // Far trunks, dimmed by the dark, behind the mist.
  for (i = 0; i < TRUNKS.length; i++) {
    trunk = TRUNKS[i];
    if (!trunk.far) continue;
    sway = 0.5 * DEG * Math.sin(Math.PI * 2 * (T / SWAY) + trunk.phase);
    ctx.globalAlpha = 0.45;
    drawTrunk(trunk, sway);
    ctx.globalAlpha = 1;
  }
  drawMist(MIST_BACK, mistOff);
  // Near trunks at full pale.
  for (i = 0; i < TRUNKS.length; i++) {
    trunk = TRUNKS[i];
    if (trunk.far) continue;
    sway = 0.5 * DEG * Math.sin(Math.PI * 2 * (T / SWAY) + trunk.phase);
    drawTrunk(trunk, sway);
  }
  // Understory leaves.
  for (i = 0; i < LEAVES.length; i++) drawLeaf(LEAVES[i]);
  // The faint front veil of mist.
  drawMist(MIST_FRONT, -mistOff);
  // Falling gold leaf-dots.
  ctx.fillStyle = GOLD;
  for (i = 0; i < DOTS.length; i++) {
    var d = DOTS[i];
    var f = (d.p + d.c * T / LOOP) % 1;
    var y = -40 + f * (DH + 80);
    var x = d.x + d.amp * Math.sin(Math.PI * 2 * (d.c * T / LOOP + d.p));
    ctx.beginPath();
    ctx.arc(x, y, d.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---- sizing: cover fit, full-bleed field ---------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
