<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Paper Palace</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#7FA8C9; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  // deterministic PRNG (mulberry32, fixed seed)
  function RNG(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // matte paper grain, drawn directly each frame
  var grain = [];
  (function () {
    var r = RNG(448001);
    for (var i = 0; i < 700; i++) {
      grain.push({ x: r(), y: r(), s: 0.6 + r() * 1.4, a: 0.02 + r() * 0.05, lite: r() > 0.5 });
    }
  })();

  // islet outlines: seeded noise per islet (fraction across, height factor)
  function isletNoise(seed, n) {
    var r = RNG(seed), out = [];
    for (var i = 0; i <= n; i++) out.push(0.82 + r() * 0.36);
    return out;
  }
  var islets = [
    { cx: 0.18, w: 0.24, h: 0.040, noise: isletNoise(448002, 14) },
    { cx: 0.50, w: 0.44, h: 0.058, noise: isletNoise(448003, 20) },
    { cx: 0.82, w: 0.24, h: 0.040, noise: isletNoise(448004, 14) }
  ];

  var PHASE0 = 2.0; // constant first-frame loop phase (seconds)
  var breeze = 0, breezeTarget = 0, lastT = PHASE0;
  var dragging = false, downX = 0, downY = 0, lastMX = 0, lastMY = 0;

  // cloth lower edge at fraction x (0..1 across), time t: seamless 14s wave
  function clothBottom(xf, t, ampMul) {
    var ph = (t % 14) / 14 * Math.PI * 2;
    var y = H * 0.34
      + Math.sin(xf * Math.PI * 2 * 2.0 + ph) * H * 0.030 * ampMul
      + Math.sin(xf * Math.PI * 2 * 5.0 - ph * 1.0 + 1.3) * H * 0.012 * ampMul;
    return y;
  }

  function drawIslet(it, horizon) {
    var cx = it.cx * W, w = it.w * Math.min(W, H), h = it.h * H;
    var n = it.noise.length - 1;
    ctx.fillStyle = '#8A8A8A';
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, horizon + h * 0.55);
    for (var i = 0; i <= n; i++) {
      var xf = i / n;
      var top = horizon - h * Math.sin(xf * Math.PI) * it.noise[i];
      ctx.lineTo(cx - w / 2 + xf * w, top);
    }
    ctx.lineTo(cx + w / 2, horizon + h * 0.55);
    ctx.closePath(); ctx.fill();
    // crevices: short dark strokes on the mound
    ctx.strokeStyle = '#5B5B5B'; ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.002);
    for (var k = 0; k < 4; k++) {
      var fx = 0.2 + k * 0.2;
      var cy = horizon - h * Math.sin(fx * Math.PI) * 0.6;
      ctx.beginPath();
      ctx.moveTo(cx - w / 2 + fx * w, cy);
      ctx.lineTo(cx - w / 2 + fx * w + w * 0.03, cy + h * 0.35);
      ctx.stroke();
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var S = Math.min(W, H);
    var horizon = H * 0.55;
    var ph14 = (t % 14) / 14 * Math.PI * 2;

    // breeze decay (time-based, so the first frame is always breeze-free)
    if (t > lastT) {
      var dt = t - lastT;
      if (dragging) breeze += (breezeTarget - breeze) * Math.min(1, dt * 4);
      else breeze *= Math.exp(-dt * 0.9);
    }
    lastT = t;
    var ampMul = 1 + breeze * 1.4;

    // sky and sea: one calm matte blue, sea marked by shimmer lines
    ctx.fillStyle = '#7FA8C9';
    ctx.fillRect(0, 0, W, H);

    // ---- giant red silk cloth: spans the top 40%, rippling lower edge ----
    var NX = 48;
    ctx.fillStyle = '#C41E3A';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(W, 0);
    for (var i = NX; i >= 0; i--) ctx.lineTo(i / NX * W, clothBottom(i / NX, t, ampMul));
    ctx.closePath(); ctx.fill();
    // fold shading, drawn as vertical strips: crest highlight, fold-back shadow
    for (var c = 0; c < NX; c++) {
      var x0 = c / NX * W, x1 = (c + 1) / NX * W;
      var mid = (c + 0.5) / NX;
      var fold = Math.sin(mid * Math.PI * 2 * 2.0 + ph14);
      var b0 = clothBottom(c / NX, t, ampMul), b1 = clothBottom((c + 1) / NX, t, ampMul);
      ctx.beginPath();
      ctx.moveTo(x0, 0); ctx.lineTo(x1, 0); ctx.lineTo(x1, b1); ctx.lineTo(x0, b0);
      ctx.closePath();
      if (fold > 0) { ctx.fillStyle = 'rgba(232,90,110,' + (fold * 0.30).toFixed(3) + ')'; }
      else { ctx.fillStyle = 'rgba(122,18,38,' + (-fold * 0.28).toFixed(3) + ')'; }
      ctx.fill();
    }
    // lower edge line
    ctx.strokeStyle = '#7A1226'; ctx.lineWidth = Math.max(1, S * 0.002);
    ctx.beginPath();
    for (var e = 0; e <= NX; e++) {
      var ex = e / NX * W, ey = clothBottom(e / NX, t, ampMul);
      if (e === 0) ctx.moveTo(ex, ey); else ctx.lineTo(ex, ey);
    }
    ctx.stroke();

    // ---- thin crescent moon, left third, in front of the cloth ----
    var moonX = W * 0.24, moonY = H * 0.20, moonR = S * 0.04;
    ctx.fillStyle = '#F5F0DC';
    ctx.beginPath();
    ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
    ctx.arc(moonX + moonR * 0.55, moonY - moonR * 0.08, moonR * 0.92, 0, Math.PI * 2);
    ctx.fill('evenodd');

    // ---- sea ----
    ctx.fillStyle = '#7FA8C9';
    ctx.fillRect(0, horizon, W, H - horizon);
    // horizon line, faint, so the 55% line reads through the flat colour
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, horizon + 0.5); ctx.lineTo(W, horizon + 0.5); ctx.stroke();

    // soft reflections: cloth band, then house smear (vertical, low alpha)
    ctx.fillStyle = 'rgba(196,30,58,' + (0.08 + 0.03 * Math.sin(ph14)).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    ctx.lineTo(W, horizon);
    for (var rx = NX; rx >= 0; rx--) {
      ctx.lineTo(rx / NX * W, horizon + H * 0.10 + Math.sin(rx * 0.7 + ph14) * H * 0.008);
    }
    ctx.closePath(); ctx.fill();

    var houseH = S * 0.25, houseW = houseH * 0.78;
    var houseCx = W / 2, houseBase = horizon + H * 0.03, houseTop = houseBase - houseH;
    // house reflection smear
    ctx.fillStyle = 'rgba(169,191,212,' + (0.12 + 0.04 * Math.sin(ph14 + 1.1)).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(houseCx - houseW * 0.55, horizon + H * 0.02);
    ctx.lineTo(houseCx + houseW * 0.55, horizon + H * 0.02);
    ctx.lineTo(houseCx + houseW * 0.45, horizon + H * 0.20);
    ctx.lineTo(houseCx - houseW * 0.45, horizon + H * 0.20);
    ctx.closePath(); ctx.fill();

    // sea shimmer: calm horizontal strokes, shimmering with the 14s wave
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
    for (var s = 0; s < 7; s++) {
      var sy = horizon + H * 0.05 + s * H * 0.055;
      var sa = 0.06 + 0.08 * (0.5 + 0.5 * Math.sin(ph14 + s * 1.2));
      ctx.strokeStyle = 'rgba(255,255,255,' + sa.toFixed(3) + ')';
      var sx = (s % 2 ? W * 0.12 : W * 0.55) + Math.sin(ph14 + s) * W * 0.01;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + W * 0.28, sy); ctx.stroke();
    }

    // ---- three rocky islets ----
    for (var ii = 0; ii < islets.length; ii++) drawIslet(islets[ii], horizon);

    // ---- small townhouse on the central islet ----
    var roofH = houseH * 0.28, wallH = houseH - roofH;
    var wallX = houseCx - houseW / 2, wallY = houseTop + roofH;
    // pitched roof, slightly wider than the walls
    ctx.fillStyle = '#5B6B7A';
    ctx.beginPath();
    ctx.moveTo(wallX - houseW * 0.06, wallY);
    ctx.lineTo(houseCx, houseTop);
    ctx.lineTo(wallX + houseW * 1.06, wallY);
    ctx.closePath(); ctx.fill();
    // walls
    ctx.fillStyle = '#A9BFD4';
    ctx.fillRect(wallX, wallY, houseW, wallH);
    // door, centred at the wall base
    ctx.fillStyle = '#5B6B7A';
    ctx.fillRect(houseCx - houseW * 0.07, houseBase - wallH * 0.32, houseW * 0.14, wallH * 0.32);
    // exactly 6 windows, 2 rows x 3 columns
    var winW = houseW * 0.16, winH = wallH * 0.20;
    var litIndex = Math.floor(t / 20) % 6;
    var litPhase = (t % 20) / 20;
    var litAlpha = litPhase < 0.2 ? 0.3 + 0.7 * (litPhase / 0.2) : 1.0 - 0.7 * ((litPhase - 0.2) / 0.8);
    for (var wr = 0; wr < 2; wr++) {
      for (var wc = 0; wc < 3; wc++) {
        var wi = wr * 3 + wc;
        var wx = wallX + houseW * (0.14 + wc * 0.30) - winW / 2 + houseW * 0.02;
        var wy = wallY + wallH * (0.14 + wr * 0.30);
        if (wi === litIndex) {
          ctx.save(); ctx.globalAlpha = litAlpha;
          ctx.fillStyle = '#F5D90A';
          ctx.fillRect(wx, wy, winW, winH);
          ctx.restore();
        } else {
          ctx.fillStyle = '#F5F0DC';
          ctx.fillRect(wx, wy, winW, winH);
        }
        ctx.strokeStyle = 'rgba(91,107,122,0.6)'; ctx.lineWidth = Math.max(1, S * 0.0015);
        ctx.strokeRect(wx, wy, winW, winH);
      }
    }

    // matte grain over everything, very low alpha
    for (var g = 0; g < grain.length; g++) {
      var p = grain[g];
      ctx.fillStyle = p.lite ? 'rgba(255,255,255,' + p.a + ')' : 'rgba(40,60,80,' + p.a + ')';
      ctx.fillRect(p.x * W, p.y * H, p.s, p.s);
    }
    void PHONE;
  }

  // interaction: drag creates a breeze; cloth amplitude follows pointer velocity
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; downX = e.clientX; downY = e.clientY; lastMX = e.clientX; lastMY = e.clientY;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastMX, dy = e.clientY - lastMY;
    var speed = Math.sqrt(dx * dx + dy * dy);
    breezeTarget = Math.min(1, speed / 25);
    lastMX = e.clientX; lastMY = e.clientY;
  });
  canvas.addEventListener('pointerup', function () { dragging = false; breezeTarget = 0; });
  canvas.addEventListener('pointercancel', function () { dragging = false; breezeTarget = 0; });

  var currentT = PHASE0;
  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    var loop = function (now) {
      currentT = PHASE0 + (now - start) / 1000;
      draw(currentT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
