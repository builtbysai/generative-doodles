<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray Outsider</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2B3C0; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict, nothing else)
  var PINK = '#F2B3C0';   // ground / worker clothing
  var INK  = '#161616';   // outlines, hair, shadow pools
  var GRAY = '#CFCFCF';   // protagonist head
  var DESK = '#D8D8D8';   // desks
  var WHITE = '#FFFFFF';  // worker heads, desk papers

  var S = 1080; // design stage, square

  // Seeded RNG (mulberry32, fixed seed) for stable per-desk details
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(537065);

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var vw = 300, vh = 300, dpr = 1;
  var isPhone = false;

  function detectPhone(w, h) {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return h > w * 1.15;
  }

  function resize() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    if (!w || !h) {
      w = window.innerWidth || 300;
      h = window.innerHeight || 300;
    }
    vw = w; vh = h;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    isPhone = detectPhone(vw, vh);
  }

  if (typeof window !== 'undefined' && window.visualViewport &&
      typeof window.visualViewport.addEventListener === 'function') {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(PHASE0 + elapsed()); });
  }
  if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(PHASE0 + elapsed()); });
  }

  // ---- Interaction state: gaze follows drag point, drifts back on release ----
  var dragging = false;
  var dragNX = 0, dragNY = 0;      // target gaze, normalized -1..1
  var gazeX = 0, gazeY = 0;        // current gaze, normalized -1..1
  var releaseT = -10;              // phase time of release
  var lastPhase = 0;

  function stageGeom() {
    var scale = Math.min(vw, vh) / S;
    return {
      scale: scale,
      ox: (vw - S * scale) / 2,
      oy: (vh - S * scale) / 2
    };
  }

  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    var cx = (typeof e.clientX === 'number') ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (typeof e.clientY === 'number') ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: cx - r.left, y: cy - r.top };
  }

  function setDragTarget(e) {
    var p = pointerPos(e);
    var g = stageGeom();
    var sx = (p.x - g.ox) / g.scale;
    var sy = (p.y - g.oy) / g.scale;
    dragNX = Math.max(-1, Math.min(1, (sx - S / 2) / (S / 2)));
    dragNY = Math.max(-1, Math.min(1, (sy - 330) / 420));
  }

  function onDown(e) { dragging = true; setDragTarget(e); if (e.preventDefault) e.preventDefault(); }
  function onMove(e) { if (dragging) setDragTarget(e); }
  function onUp() { if (dragging) { dragging = false; releaseT = lastPhase; } }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
  }

  // ---- Office layout: 3 rows x 4 desks, simple perspective ----
  // Back rows are smaller and more tightly spaced; front row widest.
  var rows = [
    { y: 668, s: 0.60, spread: 0.62 },
    { y: 806, s: 0.84, spread: 0.80 },
    { y: 972, s: 1.14, spread: 1.00 }
  ];
  var desks = [];
  for (var r = 0; r < 3; r++) {
    for (var i = 0; i < 4; i++) {
      var f = (i - 1.5) / 1.5; // -1..1
      desks.push({
        x: S / 2 + f * 372 * rows[r].spread,
        y: rows[r].y,
        s: rows[r].s,
        paperDX: (rng() - 0.5) * 30,
        paperRot: (rng() - 0.5) * 0.5
      });
    }
  }

  function ellipse(x, y, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  }

  // One parametric worker: blank white head bowed, pink body, arms on desk bobbing.
  function drawWorker(x, deskTopY, s, bob) {
    // body (pink torso behind desk)
    ctx.fillStyle = PINK;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3.2 * s;
    ctx.beginPath();
    ctx.moveTo(x - 30 * s, deskTopY + 4 * s);
    ctx.lineTo(x - 22 * s, deskTopY - 44 * s);
    ctx.lineTo(x + 22 * s, deskTopY - 44 * s);
    ctx.lineTo(x + 30 * s, deskTopY + 4 * s);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // head: blank oval, bowed down
    ellipse(x, deskTopY - 62 * s + bob * 0.4, 17 * s, 21 * s);
    ctx.fillStyle = WHITE;
    ctx.fill(); ctx.stroke();
    // arms reaching forward onto the desk, typing bob
    ctx.fillStyle = PINK;
    ctx.beginPath();
    ctx.moveTo(x - 24 * s, deskTopY - 30 * s);
    ctx.lineTo(x - 6 * s, deskTopY - 2 * s + bob);
    ctx.lineTo(x - 1 * s, deskTopY - 2 * s + bob);
    ctx.lineTo(x - 10 * s, deskTopY - 32 * s);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 24 * s, deskTopY - 30 * s);
    ctx.lineTo(x + 10 * s, deskTopY - 32 * s);
    ctx.lineTo(x + 1 * s, deskTopY - 2 * s - bob);
    ctx.lineTo(x + 6 * s, deskTopY - 2 * s - bob);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  function drawDesk(d, phase) {
    var s = d.s, x = d.x, y = d.y;
    var topW = 118 * s, topD = 30 * s, frontH = 26 * s;
    var topY = y - topD - frontH;
    // flat black shadow pool under the desk
    ellipse(x, y + 8 * s, topW * 0.72, 13 * s);
    ctx.fillStyle = INK;
    ctx.fill();
    // worker behind desk (typing bob, all in sync)
    var bob = Math.sin(phase * 5.2) * 2.4 * s;
    drawWorker(x, topY + 2 * s, s, bob);
    // desk front face
    ctx.fillStyle = DESK;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3.2 * s;
    ctx.beginPath();
    ctx.moveTo(x - topW / 2 + 10 * s, topY + topD);
    ctx.lineTo(x + topW / 2 - 10 * s, topY + topD);
    ctx.lineTo(x + topW / 2 - 10 * s, y);
    ctx.lineTo(x - topW / 2 + 10 * s, y);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // desk top (parallelogram, simple perspective)
    ctx.beginPath();
    ctx.moveTo(x - topW / 2, topY + topD);
    ctx.lineTo(x - topW / 2 + 16 * s, topY);
    ctx.lineTo(x + topW / 2 + 16 * s, topY);
    ctx.lineTo(x + topW / 2, topY + topD);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // paper sheet on the desk
    ctx.save();
    ctx.translate(x + d.paperDX * s, topY + topD * 0.45);
    ctx.rotate(d.paperRot);
    ctx.fillStyle = WHITE;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2 * s;
    ctx.fillRect(-16 * s, -9 * s, 32 * s, 18 * s);
    ctx.strokeRect(-16 * s, -9 * s, 32 * s, 18 * s);
    ctx.restore();
  }

  // The giant head: gray mask face, black hair cap, ear, hoop earring,
  // symbol-face only: dot eyes, single-line mouth.
  function drawHead(phase) {
    var cx = 540, pivotY = 500;
    var pupilDX = gazeX * 17;
    var pupilDY = gazeY * 9;
    var tilt = gazeX * 0.055; // clamped head tilt toward drag

    ctx.save();
    ctx.translate(cx, pivotY);
    ctx.rotate(tilt);
    ctx.translate(-cx, -pivotY);

    // face mask: big rounded shape, cropped by the top edge of the stage
    ctx.fillStyle = GRAY;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(cx - 268, -170);
    ctx.lineTo(cx + 268, -170);
    ctx.bezierCurveTo(cx + 282, 90, cx + 238, 330, cx + 150, 428);
    ctx.bezierCurveTo(cx + 80, 492, cx - 80, 492, cx - 150, 428);
    ctx.bezierCurveTo(cx - 238, 330, cx - 282, 90, cx - 268, -170);
    ctx.closePath();
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.stroke();
    ctx.restore();

    // hair cap: black mass across the top of the head
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(cx - 290, -180);
    ctx.lineTo(cx + 290, -180);
    ctx.bezierCurveTo(cx + 288, -30, cx + 250, 66, cx + 176, 96);
    ctx.bezierCurveTo(cx + 90, 40, cx - 60, 34, cx - 168, 92);
    ctx.bezierCurveTo(cx - 248, 60, cx - 288, -40, cx - 290, -180);
    ctx.closePath();
    ctx.fill();

    // ear on the right side
    ellipse(cx + 272, 218, 30, 46);
    ctx.fillStyle = GRAY;
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 5;
    ctx.stroke();
    // hoop earring: torus arc hanging from the ear
    ctx.beginPath();
    ctx.arc(cx + 272, 292, 27, Math.PI * 0.95, Math.PI * 2.05);
    ctx.strokeStyle = WHITE;
    ctx.lineWidth = 11;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + 272, 292, 27, Math.PI * 0.95, Math.PI * 2.05);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // symbol-face: two dot eyes (pupils shift with gaze), one line mouth
    ctx.fillStyle = INK;
    ellipse(cx - 96 + pupilDX, 252 + pupilDY, 13, 13);
    ctx.fill();
    ellipse(cx + 96 + pupilDX, 252 + pupilDY, 13, 13);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 46 + pupilDX * 0.6, 402 + pupilDY * 0.6);
    ctx.lineTo(cx + 46 + pupilDX * 0.6, 402 + pupilDY * 0.6);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 6;
    ctx.stroke();

    ctx.restore();
  }

  var PHASE0 = 1.35; // constant first-frame phase: workers mid-bob, gaze centered

  function draw(phase) {
    lastPhase = phase;
    // pin canvas CSS size every frame
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';

    // gaze easing: follow while dragging; drift back to center over ~4s after release
    if (dragging) {
      gazeX += (dragNX - gazeX) * 0.045;
      gazeY += (dragNY - gazeY) * 0.045;
    } else if (phase - releaseT < 4 && (gazeX !== 0 || gazeY !== 0)) {
      var k = Math.min(1, (phase - releaseT) / 4);
      var e = 1 - Math.pow(1 - k, 3);
      gazeX = gazeX * (1 - e * 0.06);
      gazeY = gazeY * (1 - e * 0.06);
      if (k >= 1) { gazeX = 0; gazeY = 0; }
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // page ground is the pink itself
    ctx.fillStyle = PINK;
    ctx.fillRect(0, 0, vw, vh);

    var g = stageGeom();
    ctx.translate(g.ox, g.oy);
    ctx.scale(g.scale, g.scale);

    // stage ground
    ctx.fillStyle = PINK;
    ctx.fillRect(0, 0, S, S);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, S, S);
    ctx.clip();

    // office first (head looms over it)
    for (var i = 0; i < desks.length; i++) drawDesk(desks[i], phase);
    drawHead(phase);

    ctx.restore();

    // thin black panel border
    ctx.strokeStyle = INK;
    ctx.lineWidth = 5;
    ctx.strokeRect(14, 14, S - 28, S - 28);

    // hint: one lowercase word, subtle, bottom-right corner
    ctx.fillStyle = INK;
    ctx.globalAlpha = 0.42;
    ctx.font = (isPhone ? 30 : 27) + 'px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('drag', S - 34, S - 30);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // ---- Loop: anchored as fixed PHASE0 + elapsed; first frame synchronous ----
  var t0 = null;
  function elapsed() {
    if (t0 === null) return 0;
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    return (now - t0) / 1000;
  }
  function frame(now) {
    if (t0 === null) t0 = now;
    draw(PHASE0 + (now - t0) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  resize();
  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
