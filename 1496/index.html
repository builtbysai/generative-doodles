<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Table Tap</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #e8e0d0; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (CA1 only, no other color).
  var ROOM = '#e8e0d0';
  var WALNUT = '#6b4a3a';
  var CHARCOAL = '#2a2a30';
  var SLATE = '#4a5a7a';
  var SKY = '#b8bcc0';
  var GOLD = '#d9a441';

  // Seeded PRNG (mulberry32), never Math.random. Scenes are fixed
  // compositions, so no randomness is needed; the seed is kept for
  // parity with the study.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1496000);
  void rng;

  // Scenes as a loop array with an invisible duration meter. Shots impose
  // their own length: 10, 14, 9, 15 s. Total loop 48 s.
  var DUR = [10, 14, 9, 15];
  var LOOP = 48;
  var BOUND = [0, 10, 24, 33, 48];
  var TAP_WIN = 0.5;

  // Drag segments in absolute piece time: {t0, t1 (null while active),
  // rate}. Rate is 1 outside segments; while a panel drag is held the
  // meter fills slower, never faster, so a drag can only hold a scene.
  var segs = [];
  var active = null;
  var now = 0;
  var W = 0, H = 0;
  var lastGeom = null;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // Effective (meter) time at absolute time t: integral of the rate.
  function effTime(t) {
    var total = 0, prev = 0, i, s, end;
    for (i = 0; i < segs.length; i++) {
      s = segs[i];
      if (s.t0 >= t) break;
      if (s.t1 !== null && s.t1 <= prev) continue;
      if (s.t0 > prev) { total += (Math.min(s.t0, t) - prev); prev = Math.min(s.t0, t); }
      if (prev >= t) break;
      end = (s.t1 === null) ? t : Math.min(t, s.t1);
      if (end > prev) { total += s.rate * (end - prev); prev = end; }
      if (prev >= t) break;
    }
    if (prev < t) total += (t - prev);
    return total;
  }

  // Scene index and scene-local time from effective time.
  function sceneAt(eff) {
    var lt = ((eff % LOOP) + LOOP) % LOOP;
    var i;
    for (i = 0; i < 4; i++) {
      if (lt >= BOUND[i] && lt < BOUND[i + 1]) {
        return { index: i, local: lt - BOUND[i], lt: lt, boundary: BOUND[i] };
      }
    }
    return { index: 0, local: 0, lt: 0, boundary: 0 };
  }

  function size() {
    var vw = (typeof window !== 'undefined' && window.visualViewport)
      ? window.visualViewport.width : window.innerWidth;
    var vh = (typeof window !== 'undefined' && window.visualViewport)
      ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function geom() {
    var s = Math.min(W, H) * 0.07;
    var panel = { x: 0.08 * W, y: 0.05 * H, w: 0.84 * W, h: 0.48 * H };
    var tableY = 0.72 * H, tableH = Math.max(8, 0.08 * H);
    return {
      s: s, panel: panel,
      tableX: 0.05 * W, tableW: 0.90 * W, tableY: tableY, tableH: tableH,
      leftX: 0.20 * W, rightX: 0.80 * W,
      figY: tableY
    };
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }
  function disc(cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Landscape strips. Each scene's internal motion is a function of
  // scene-local time only (linear progress or integer-cycle sines), so
  // every scene is deterministic and the loop closes exactly.
  function drawScene(i, st, dur, p) {
    var x = p.x, y = p.y, w = p.w, h = p.h;
    var pr = st / dur;
    rect(x, y, w, h, SKY);
    if (i === 0) {
      // Hills: gold sun drifting left to right, slate hills, walnut road.
      disc(x + lerp(0.12 * w, 0.82 * w, pr), y + 0.20 * h, 0.055 * w, GOLD);
      rect(x, y + 0.62 * h, w, 0.38 * h, SLATE);
      rect(x, y + 0.72 * h, w, 0.28 * h, CHARCOAL);
      rect(x + 0.42 * w, y + 0.62 * h, 0.16 * w, 0.38 * h, WALNUT);
      rect(x + 0.10 * w, y + 0.55 * h, 0.05 * w, 0.14 * h, CHARCOAL);
      rect(x + 0.78 * w, y + 0.50 * h, 0.05 * w, 0.18 * h, CHARCOAL);
    } else if (i === 1) {
      // Lake: slate water, charcoal reeds, gold sun and its reflection.
      disc(x + 0.70 * w, y + 0.18 * h, 0.05 * w, GOLD);
      rect(x, y + 0.55 * h, w, 0.45 * h, SLATE);
      var rip = Math.sin(st * Math.PI * 2 * 2 / dur) * 0.012 * h;
      rect(x, y + 0.55 * h + rip, w, 0.02 * h, CHARCOAL);
      rect(x + 0.68 * w, y + 0.30 * h, 0.04 * w, 0.012 * h, GOLD);
      rect(x + 0.15 * w, y + 0.42 * h, 0.015 * w, 0.16 * h, CHARCOAL);
      rect(x + 0.20 * w, y + 0.45 * h, 0.015 * w, 0.13 * h, CHARCOAL);
      rect(x + 0.85 * w, y + 0.40 * h, 0.015 * w, 0.18 * h, CHARCOAL);
    } else if (i === 2) {
      // Field: charcoal ground, walnut fence, slate barn, drifting cloud.
      rect(x, y + 0.60 * h, w, 0.40 * h, CHARCOAL);
      rect(x + 0.62 * w, y + 0.30 * h, 0.22 * w, 0.30 * h, SLATE);
      rect(x + 0.66 * w, y + 0.42 * h, 0.06 * w, 0.18 * h, WALNUT);
      var cx = x + lerp(-0.10 * w, 0.95 * w, pr);
      rect(cx, y + 0.12 * h, 0.14 * w, 0.05 * h, ROOM);
      rect(cx + 0.03 * w, y + 0.08 * h, 0.08 * w, 0.05 * h, ROOM);
      var k;
      for (k = 0; k < 5; k++) {
        rect(x + (0.12 + k * 0.18) * w, y + 0.52 * h, 0.03 * w, 0.10 * h, WALNUT);
      }
      rect(x + 0.08 * w, y + 0.55 * h, 0.84 * w, 0.015 * h, WALNUT);
    } else {
      // Coast: slate sea, charcoal cliff, walnut path, low gold sun.
      rect(x, y + 0.58 * h, w, 0.42 * h, SLATE);
      var wv = Math.sin(st * Math.PI * 2 * 3 / dur) * 0.010 * h;
      rect(x, y + 0.58 * h + wv, w, 0.015 * h, ROOM);
      rect(x + 0.06 * w, y + 0.20 * h, 0.18 * w, 0.42 * h, CHARCOAL);
      rect(x + 0.24 * w, y + 0.62 * h, 0.10 * w, 0.38 * h, WALNUT);
      disc(x + lerp(0.55 * w, 0.75 * w, pr), y + 0.42 * h, 0.05 * w, GOLD);
    }
  }

  // Seated editor figure: torso, head disc in the contrasting tone (the
  // room ground is cream, so a cream head would vanish), dot eye, arm
  // with a hand disc hovering above the table. During a tap both hands
  // dip to the table in the same frame; while a drag holds the scene,
  // the hands tremble.
  function drawFigure(cx, tableY, s, clothes, headColor, facing, handY, tapping) {
    var torsoTop = tableY - 1.55 * s;
    rect(cx - 0.42 * s, torsoTop, 0.84 * s, 1.55 * s, clothes);
    disc(cx, torsoTop - 0.34 * s, 0.36 * s, headColor);
    rect(cx + facing * 0.12 * s, torsoTop - 0.38 * s, 0.07 * s, 0.07 * s, ROOM);
    // Arm reaching toward the table centre at hand height, hand disc at
    // its end in the figure's own clothes color.
    var hx = cx + facing * 1.05 * s;
    rect(Math.min(cx, hx), handY - 0.09 * s, Math.abs(hx - cx), 0.18 * s, clothes);
    disc(hx, handY, 0.20 * s, clothes);
    if (tapping) disc(hx, tableY + 0.02 * s, 0.13 * s, GOLD);
  }

  function draw(t) {
    now = t;
    size();
    var g = geom();
    lastGeom = g;
    var eff = effTime(t);
    var sc = sceneAt(eff);
    var holding = active !== null;
    // Tap window: the first half-second after a cut, excluding the exact
    // loop start, so frame one opens on hovering hands, not mid-tap.
    var tapping = sc.local > 0 && sc.local < TAP_WIN;
    var tremble = 0;
    if (holding) tremble = Math.sin(eff * Math.PI * 2 * 6) * g.s * 0.05;

    rect(0, 0, W, H, ROOM);

    // Panel: sky-grey frame with generous empty room around it.
    var p = g.panel;
    rect(p.x - 0.012 * W, p.y - 0.012 * H, p.w + 0.024 * W, p.h + 0.024 * H, ROOM);
    drawScene(sc.index, sc.local, DUR[sc.index], p);

    // Table across the lower third.
    rect(g.tableX, g.tableY, g.tableW, g.tableH, WALNUT);

    // Hands: hover above the table, dip to it during a tap, tremble
    // while a drag holds the scene. Both hands share one tap window, so
    // they always tap in the same frame.
    var hoverY = g.tableY - 0.55 * g.s + tremble;
    var handY = tapping ? g.tableY - 0.10 * g.s : hoverY;
    drawFigure(g.leftX, g.tableY, g.s, CHARCOAL, SLATE, 1, handY, tapping);
    drawFigure(g.rightX, g.tableY, g.s, SLATE, CHARCOAL, -1, handY, tapping);
  }

  function onPanel(x, y) {
    var p = lastGeom ? lastGeom.panel : null;
    if (!p) return false;
    return x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h;
  }
  function onDown(e) {
    var x = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
    var y = (e.clientY !== undefined) ? e.clientY : e.touches[0].clientY;
    if (!onPanel(x, y)) return;
    active = { t0: now, x0: x, rate: 1, t1: null };
    segs.push(active);
  }
  function onMove(e) {
    var x = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
    if (!active) return;
    var dx = x - active.x0;
    var r = clamp(1 - Math.abs(dx) / 300, 0.25, 1);
    active.t1 = now;
    active = { t0: now, x0: x, rate: r, t1: null };
    segs.push(active);
  }
  function onUp() {
    if (!active) return;
    active.t1 = now;
    active = null;
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(now); });
    }
    window.addEventListener('resize', function () { draw(now); });
  }

  // Frame one at a constant phase; clock starts only with the rAF loop.
  draw(0);
  if (typeof window !== 'undefined' && typeof window.__piece === 'undefined') {
    window.__piece = {
      drawAt: function (t) { draw(t); },
      down: function (x, y) { onDown({ clientX: x, clientY: y }); },
      move: function (x, y) { onMove({ clientX: x, clientY: y }); },
      up: function () { onUp(); },
      state: function () {
        var eff = effTime(now);
        var sc = sceneAt(eff);
        return {
          t: now, eff: eff, lt: sc.lt, scene: sc.index,
          sceneLocal: sc.local,
          tapping: sc.local > 0 && sc.local < TAP_WIN,
          holding: active !== null,
          leftX: lastGeom ? lastGeom.leftX : 0,
          rightX: lastGeom ? lastGeom.rightX : 0,
          W: W, H: H
        };
      }
    };
  }
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
