<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seeds Are Meant to Disperse</title>
<style>
  html, body { margin: 0; padding: 0; background: #9A958C; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var T0 = 96;                 // fixed first-frame phase (seconds of piece time)
  var YEAR = 360;              // full year cycle, seconds
  var SEASON_LEN = 90;         // one season = 90 s
  var BASE_SALT = 1237;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- deterministic hash ----------
  function ihash(a, b) {
    var x = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ 0x9E3779B9;
    x = Math.imul(x ^ (x >>> 13), 1274126177);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  function seasonAt(t) { return Math.floor(t / SEASON_LEN) % 4; } // 0 spring 1 summer 2 autumn 3 winter

  // ---------- interaction state (events only; frame one has none) ----------
  var gustEvents = [];   // piece-times of gusts
  var reseedEvents = []; // piece-times of double-tap reseeds
  var lastGustT = -1e9;

  function saltAt(rt) {
    var s = 0;
    for (var i = 0; i < reseedEvents.length; i++) if (reseedEvents[i] <= rt) s++;
    return s;
  }

  // ---------- layout (unit space, fractions of frame) ----------
  function isPhone(W, H) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width, window.screen.height);
    }
    return sw < 700 || H > W * 1.15;
  }
  function bedRect(W, H) {
    var phone = isPhone(W, H);
    var bw = phone ? 0.86 : 0.62;
    var bh = phone ? 0.72 : 0.66;
    return { x0: (1 - bw) / 2, y0: (1 - bh) / 2, w: bw, h: bh };
  }
  function pathStrip(bed) { // gravel path across the bed's middle (no germination)
    var cy = bed.y0 + bed.h * 0.52;
    return { y0: cy - 0.016, y1: cy + 0.016 };
  }

  // ---------- plants ----------
  var PLANT_TYPES = [0, 1, 2, 0, 1, 2]; // 0 dandelion, 1 milkweed, 2 grass
  function plantPos(p, bed) {
    var col = p % 3, row = Math.floor(p / 3);
    var u = bed.x0 + bed.w * (0.20 + 0.30 * col + (ihash(p, 602) - 0.5) * 0.12);
    var v = bed.y0 + bed.h * (0.28 + 0.42 * row + (ihash(p, 603) - 0.5) * 0.10);
    return { u: u, v: v };
  }

  // ---------- release schedule ----------
  var SEASON_INTERVAL = [6.5, 5.0, 2.6, 13.0]; // spring, summer, autumn (most), winter
  function releaseTimes(p, upto) {
    var times = [];
    var t = ihash(p, 501) * 3;
    var k = 0;
    while (t <= upto && k < 20000) {
      times.push(t);
      var base = SEASON_INTERVAL[seasonAt(t)];
      t += base * (0.7 + 0.6 * ihash(p * 4096 + k, 77));
      k++;
    }
    return times;
  }

  // ---------- one seed's full derivation ----------
  function seedInfo(p, k, rt) {
    var salt = saltAt(rt);
    var type = PLANT_TYPES[p];
    var h1 = ihash(p * 8192 + k, 1001 + salt * 131);
    var h2 = ihash(p * 8192 + k, 1002 + salt * 131);
    var h3 = ihash(p * 8192 + k, 1003 + salt * 131);
    var h4 = ihash(p * 8192 + k, 1004 + salt * 131);
    var dur, speed;
    if (type === 0) { dur = 9 + 5 * h1; speed = 0.030 + 0.014 * h3; }        // parachute: slow float
    else if (type === 1) { dur = 12 + 6 * h1; speed = 0.042 + 0.016 * h3; }  // silk: long shallow glide
    else { dur = 5 + 3 * h1; speed = 0.058 + 0.020 * h3; }                    // awn: quick tumble
    var ang = 0.42 + (h2 - 0.5) * 0.8;
    var dx = Math.cos(ang) * speed, dy = Math.sin(ang) * speed;
    var bed = bedRect(canvas.width, canvas.height);
    var start = plantPos(p, bed);
    // gust bonus: wind x3 during [g, g+3] -> extra 2x over the overlap
    var bonus = 0;
    for (var i = 0; i < gustEvents.length; i++) {
      var ov = Math.min(rt + dur, gustEvents[i] + 3) - Math.max(rt, gustEvents[i]);
      if (ov > 0) bonus += 2 * ov;
    }
    var lx = start.u + dx * (dur + bonus);
    var lv = start.v + dy * (dur + bonus);
    var lt = rt + dur;
    var strip = pathStrip(bed);
    var onSoil = lx >= bed.x0 && lx <= bed.x0 + bed.w && lv >= bed.y0 && lv <= bed.y0 + bed.h &&
                 !(lv >= strip.y0 && lv <= strip.y1);
    var germ = onSoil && ihash(p * 8192 + k, 2002) < 0.35;
    var sproutT = Infinity;
    if (germ) {
      var b = Math.ceil((lt + 0.001) / SEASON_LEN) * SEASON_LEN;
      for (var j = 0; j < 6; j++) {
        var s = seasonAt(b);
        if (s === 0 || s === 1) { sproutT = b; break; }
        b += SEASON_LEN;
      }
    }
    return { p: p, k: k, type: type, rt: rt, dur: dur, lt: lt,
             sx: start.u, sv: start.v, lx: lx, lv: lv,
             dx: dx, dy: dy, h4: h4, onSoil: onSoil, germ: germ, sproutT: sproutT };
  }

  function collectSeeds(t) {
    var out = [];
    for (var p = 0; p < 6; p++) {
      var times = releaseTimes(p, t);
      for (var k = 0; k < times.length; k++) out.push(seedInfo(p, k, times[k]));
    }
    return out;
  }

  function flightPos(sd, t) {
    var s = (t - sd.rt) / sd.dur;
    if (s < 0) s = 0; if (s > 1) s = 1;
    var ease = sd.type === 2 ? Math.pow(s, 0.92) : s;
    var x = sd.sx + (sd.lx - sd.sx) * ease;
    var y = sd.sv + (sd.lv - sd.sv) * ease;
    // perpendicular bob / sway, fading at both ends
    var plen = Math.sqrt(sd.dx * sd.dx + sd.dy * sd.dy) || 1;
    var px = -sd.dy / plen, py = sd.dx / plen;
    var env = Math.sin(s * Math.PI);
    var amp = sd.type === 0 ? 0.008 : (sd.type === 1 ? 0.012 : 0.004);
    var freq = sd.type === 1 ? 12 : 9.4;
    var off = Math.sin(s * freq + sd.h4 * 6.283) * amp * env;
    return { u: x + px * off, v: y + py * off, s: s };
  }

  // ---------- drawing helpers ----------
  function dot(x, y, r, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.globalAlpha = 1;
  }
  function sprout(x, y, size, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1, size * 0.22);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - size);
    ctx.moveTo(x, y - size * 0.55);
    ctx.lineTo(x - size * 0.55, y - size * 1.05);
    ctx.moveTo(x, y - size * 0.55);
    ctx.lineTo(x + size * 0.55, y - size * 1.05);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- main draw ----------
  var lastT = T0;
  function draw(t) {
    lastT = t;
    var W = canvas.width, H = canvas.height;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var bed = bedRect(W, H);
    var season = seasonAt(t);
    var bx = bed.x0 * W, by = bed.y0 * H, bw = bed.w * W, bh = bed.h * H;
    var strip = pathStrip(bed);

    // pavement
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#9A958C';
    ctx.fillRect(0, 0, W, H);
    // pavement speckle + slab seams
    var cell = 34;
    for (var gy = 0; gy < H / cell; gy++) {
      for (var gx = 0; gx < W / cell; gx++) {
        var hh = ihash(gx * 64 + gy, 909);
        if (hh < 0.5) dot(gx * cell + hh * 30, gy * cell + ihash(gx, gy * 31 + 7) * 30, 1.1, hh < 0.25 ? '#8A857D' : '#A8A39A', 0.5);
      }
    }
    ctx.strokeStyle = 'rgba(90,85,78,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W * 0.5, 0); ctx.lineTo(W * 0.5, by);
    ctx.moveTo(W * 0.5, by + bh); ctx.lineTo(W * 0.5, H);
    ctx.moveTo(0, H * 0.5); ctx.lineTo(bx, H * 0.5);
    ctx.moveTo(bx + bw, H * 0.5); ctx.lineTo(W, H * 0.5);
    ctx.stroke();

    // garden bed: soil rows
    var rows = 6;
    for (var r = 0; r < rows; r++) {
      ctx.fillStyle = r % 2 === 0 ? '#5A4232' : '#503829';
      ctx.fillRect(bx, by + bh * r / rows, bw, bh / rows + 1);
    }
    ctx.strokeStyle = '#3E2C1F';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    // gravel path strip
    ctx.fillStyle = '#A79B84';
    ctx.fillRect(bx, strip.y0 * H, bw, (strip.y1 - strip.y0) * H);

    // cultivated seedling rows
    var seedlingScale = [0.6, 1.0, 0.85, 0][season];
    var seedlingColor = season === 2 ? '#A88B3F' : '#6FA05A';
    if (season !== 3) {
      for (var rr = 0; rr < 4; rr++) {
        var ry = by + bh * (0.16 + 0.19 * rr);
        for (var i = 0; i < 14; i++) {
          var sx = bx + bw * (0.05 + 0.9 * (i / 13)) + (ihash(rr * 40 + i, 303) - 0.5) * 6;
          var sy = ry + (ihash(i, rr * 17 + 5) - 0.5) * 5;
          sprout(sx, sy, (5 + ihash(rr, i + 88) * 3) * seedlingScale * (Math.min(W, H) / 720 + 0.4), seedlingColor, 0.9);
        }
      }
    }

    // seeds: landed marks and sprouts (under snow in winter)
    var seeds = collectSeeds(t);
    var dispersed = 0, germinated = 0;
    var si, sd;
    for (si = 0; si < seeds.length; si++) {
      sd = seeds[si];
      if (sd.rt <= t) dispersed++;
      if (sd.germ && sd.sproutT <= t) germinated++;
    }
    for (si = 0; si < seeds.length; si++) {
      sd = seeds[si];
      if (sd.lt > t) continue;
      var mx = sd.lx * W, my = sd.lv * H;
      if (mx < -10 || mx > W + 10 || my < -10 || my > H + 10) continue;
      if (sd.germ && t >= sd.sproutT) {
        sprout(mx, my, 5.5, '#6FA05A', season === 3 ? 0.8 : 0.95);
      } else {
        dot(mx, my, 1.6, sd.onSoil ? '#D8C49A' : '#F2EAD8', 0.8);
      }
    }

    // seed-head plants (swaying)
    for (var p = 0; p < 6; p++) {
      var pp = plantPos(p, bed);
      var cx = pp.u * W, cy = pp.v * H;
      var swx = Math.sin(t * 0.6 + p * 1.7) * 2, swy = Math.cos(t * 0.5 + p * 2.3) * 1.5;
      var hx = cx + swx, hy = cy + swy;
      var plantCol = season === 2 ? '#8A6A34' : (season === 3 ? '#5E6B52' : '#5E7D46');
      // rosette leaves
      ctx.strokeStyle = plantCol;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (var lf = 0; lf < 5; lf++) {
        var la = lf / 5 * 6.283 + p;
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(la) * 11, cy + Math.sin(la) * 8);
      }
      ctx.stroke();
      var type = PLANT_TYPES[p];
      if (type === 0) { // dandelion clock
        ctx.strokeStyle = '#F2EAD8';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var rd = 0; rd < 12; rd++) {
          var ra = rd / 12 * 6.283 + ihash(p, 71) * 3;
          ctx.moveTo(hx, hy);
          ctx.lineTo(hx + Math.cos(ra) * 9, hy + Math.sin(ra) * 9);
        }
        ctx.stroke();
        dot(hx, hy, 1.6, '#D8C49A', 1);
      } else if (type === 1) { // milkweed pod
        ctx.fillStyle = '#7A8A5A';
        ctx.beginPath();
        ctx.moveTo(hx, hy - 11);
        ctx.quadraticCurveTo(hx + 6, hy - 3, hx, hy + 11);
        ctx.quadraticCurveTo(hx - 6, hy - 3, hx, hy - 11);
        ctx.fill();
        ctx.strokeStyle = '#5E6B45';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(hx, hy - 10); ctx.lineTo(hx, hy + 10);
        ctx.stroke();
      } else { // grass head
        ctx.strokeStyle = '#C9B98A';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (var aw = 0; aw < 5; aw++) {
          var aa = -1.2 + aw * 0.6;
          ctx.moveTo(hx, hy);
          ctx.lineTo(hx + Math.sin(aa) * 13, hy - Math.cos(aa) * 13);
        }
        ctx.stroke();
      }
    }

    // winter snow over the bed (marks faint beneath)
    if (season === 3) {
      ctx.fillStyle = '#EDEEF0';
      ctx.globalAlpha = 0.82;
      ctx.fillRect(bx, by, bw, bh);
      ctx.globalAlpha = 0.22;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    // in-flight seeds
    for (si = 0; si < seeds.length; si++) {
      sd = seeds[si];
      if (sd.rt > t || sd.lt <= t) continue;
      var fp = flightPos(sd, t);
      var fx = fp.u * W, fy = fp.v * H;
      if (fx < -20 || fx > W + 20 || fy < -20 || fy > H + 20) continue;
      if (sd.type === 0) { // parachute: mini clock + soft shadow dot
        dot(fx + 3, fy + 4, 2, '#6E6A62', 0.3);
        ctx.strokeStyle = '#F2EAD8';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var q = 0; q < 8; q++) {
          var qa = q / 8 * 6.283 + sd.h4 * 3;
          ctx.moveTo(fx, fy);
          ctx.lineTo(fx + Math.cos(qa) * 6.5, fy + Math.sin(qa) * 6.5);
        }
        ctx.stroke();
        dot(fx, fy, 1.3, '#EFE6D2', 1);
      } else if (sd.type === 1) { // silk: pod + trailing ribbon
        var back = Math.atan2(sd.dy, sd.dx) + Math.PI;
        ctx.strokeStyle = '#F2EAD8';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (var seg = 0; seg <= 4; seg++) {
          var bt = seg / 4;
          var rx = fx + Math.cos(back) * bt * 17 + Math.sin(bt * 9 + sd.h4 * 6.28) * 2.4 * bt;
          var ry = fy + Math.sin(back) * bt * 17 + Math.cos(bt * 7 + sd.h4 * 6.28) * 2.4 * bt;
          if (seg === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
        }
        ctx.stroke();
        dot(fx, fy, 1.8, '#EFE6D2', 1);
      } else { // awn: tumbling barbed line
        var th = sd.h4 * 6.283 + (t - sd.rt) * 6;
        var ax = Math.cos(th) * 5, ay = Math.sin(th) * 5;
        ctx.strokeStyle = '#E8DCC2';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(fx - ax, fy - ay);
        ctx.lineTo(fx + ax, fy + ay);
        for (var bb = -1; bb <= 1; bb++) {
          ctx.moveTo(fx + ax * bb * 0.5, fy + ay * bb * 0.5);
          ctx.lineTo(fx + ax * bb * 0.5 - ay * 0.7, fy + ay * bb * 0.5 + ax * 0.7);
        }
        ctx.stroke();
      }
    }

    // season band along the top edge
    var bandH = Math.max(9, Math.round(H * 0.016));
    var segCols = ['#6FA05A', '#D8A020', '#B4713A', '#EDEEF0'];
    for (var sg = 0; sg < 4; sg++) {
      ctx.globalAlpha = sg === season ? 1 : 0.5;
      ctx.fillStyle = segCols[sg];
      ctx.fillRect(W * sg / 4, 0, W / 4 + 1, bandH);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#3A3630';
    var prog = (t % YEAR) / YEAR;
    ctx.fillRect(prog * W - 1, 0, 2, bandH + 3);

    // the ledger (quiet tally, bottom-right)
    ctx.font = Math.round(Math.min(W, H) * 0.021 + 4) + 'px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#3A3630';
    ctx.globalAlpha = 0.92;
    ctx.fillText('germinated ' + germinated + ' / dispersed ' + dispersed, W - 12, H - 12);
    ctx.globalAlpha = 1;
  }

  // ---------- sizing ----------
  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 720; h = 720; }
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
    draw(lastT);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ---------- interaction: slow drag = one gust; double-tap = reseed wind ----------
  var downPos = null, downT = 0, lastTapT = -1e9, lastTapPos = null;
  function pieceNow() { return lastT; }
  function toLocal(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }
  canvas.addEventListener('pointerdown', function (e) {
    downPos = toLocal(e); downT = pieceNow();
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!downPos) return;
    var up = toLocal(e);
    var dist = Math.sqrt((up.x - downPos.x) * (up.x - downPos.x) + (up.y - downPos.y) * (up.y - downPos.y));
    var now = pieceNow();
    if (dist >= 80) {
      if (now - lastGustT >= 30) { gustEvents.push(now); lastGustT = now; }
    } else {
      if (lastTapPos && now - lastTapT < 6 && Math.abs(up.x - lastTapPos.x) < 40 && Math.abs(up.y - lastTapPos.y) < 40) {
        reseedEvents.push(now);
        lastTapT = -1e9; lastTapPos = null;
      } else { lastTapT = now; lastTapPos = up; }
    }
    downPos = null;
  });

  // ---------- run ----------
  resize();
  draw(T0);
  var startStamp = null;
  function loop(now) {
    if (startStamp === null) startStamp = now;
    draw(T0 + (now - startStamp) / 1000);
    requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
