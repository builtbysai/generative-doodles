<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visiting Camera</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2f4a; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1399000);

  // Round fading alphas to 4 decimals before stringifying (node-canvas quirk:
  // scientific-notation alphas like 2.5e-15 parse as opaque).
  function a4(x) {
    if (x < 0) x = 0; if (x > 1) x = 1;
    return Math.round(x * 10000) / 10000;
  }
  function rgba(r, g, b, a) {
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  var INDIGO = '#2a2f4a', PINE = '#2f6b3a', WATER = '#4a6b7c',
      TRUNK = '#4a3826', EMBER = '#e0962a', OUTLINE = '#141210';

  // ---- Scene layout (unit space 1000 x 1000, scaled to canvas) ----
  // Pines: seeded positions along the shore. Each pine: x, base y, height, width.
  var pines = [];
  for (var i = 0; i < 14; i++) {
    pines.push({
      x: 30 + rng() * 940,
      y: 560 + rng() * 40,
      h: 90 + rng() * 130,
      w: 60 + rng() * 70,
      sway: rng() * Math.PI * 2
    });
  }
  // Ripple lines on the water: seeded rows.
  var ripples = [];
  for (var j = 0; j < 16; j++) {
    ripples.push({
      y: 640 + j * 22 + rng() * 8,
      len: 40 + rng() * 160,
      x0: rng() * 1000,
      sp: 0.5 + rng() * 1.2,
      ph: rng() * Math.PI * 2
    });
  }
  // Camera detail targets (unit space): a pine, a ripple, the sun's reflection.
  var details = [
    { x: pines[3].x, y: pines[3].y - pines[3].h * 0.55, name: 'pine' },
    { x: 620, y: 760, name: 'ripple' },
    { x: 700, y: 780, name: 'reflection' }
  ];
  var sunX = 700, sunY = 430, sunR = 62;

  // ---- Camera: closed-form keyframe cycle, never a cut ----
  // 60 s cycle: wide hold 12 s, push 12 s, hold 12 s, release 12 s, wide hold 12 s.
  // Every segment >= 8 s. Detail index advances once per cycle.
  function easeIO(u) {
    if (u < 0) u = 0; if (u > 1) u = 1;
    return u * u * (3 - 2 * u);
  }
  function camera(t) {
    var cyc = Math.floor(t / 60);
    var seg = t - cyc * 60;
    var det = details[cyc % 3];
    var scale = 1, fx = 500, fy = 500;
    if (seg < 12) {
      scale = 1; fx = 500; fy = 500;
    } else if (seg < 24) {
      var u = easeIO((seg - 12) / 12);
      scale = 1 + 1.2 * u;
      fx = 500 + (det.x - 500) * u;
      fy = 500 + (det.y - 500) * u;
    } else if (seg < 36) {
      scale = 2.2; fx = det.x; fy = det.y;
    } else if (seg < 48) {
      var v = easeIO((seg - 36) / 12);
      scale = 2.2 - 1.2 * v;
      fx = det.x + (500 - det.x) * v;
      fy = det.y + (500 - det.y) * v;
    } else {
      scale = 1; fx = 500; fy = 500;
    }
    return { scale: scale, fx: fx, fy: fy };
  }

  // ---- Drag look-around: closed-form decayed offset, camera always returns ----
  var drags = []; // {x, y, t}
  function dragOffset(t) {
    var ox = 0, oy = 0;
    for (var k = 0; k < drags.length; k++) {
      var d = drags[k];
      var age = t - d.t;
      if (age < 0) age = 0;
      var w = Math.exp(-age / 3);
      ox += d.x * w; oy += d.y * w;
    }
    var cap = 80;
    if (ox > cap) ox = cap; if (ox < -cap) ox = -cap;
    if (oy > cap) oy = cap; if (oy < -cap) oy = -cap;
    return { x: ox, y: oy };
  }

  var dragging = false, lastX = 0, lastY = 0;
  function pos(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  function onDown(e) { dragging = true; var p = pos(e); lastX = p.x; lastY = p.y; }
  function onMove(e) {
    if (!dragging) return;
    var p = pos(e);
    var dx = p.x - lastX, dy = p.y - lastY;
    lastX = p.x; lastY = p.y;
    drags.push({ x: dx, y: dy, t: now() });
    if (drags.length > 200) drags.splice(0, drags.length - 200);
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: true });
  canvas.addEventListener('touchmove', onMove, { passive: true });
  canvas.addEventListener('touchend', onUp);

  // ---- Viewport ----
  var W = 0, H = 0;
  function resize() {
    var vv = (typeof window.visualViewport !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = Math.round(w); canvas.height = Math.round(h);
    draw(0);
  }
  if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  function isPhone() {
    var s = window.screen;
    if (s) {
      var mn = Math.min(s.width, s.height);
      if (mn < 700) return true;
    }
    return H > W * 1.15;
  }

  // ---- Drawing helpers ----
  function dot(x, y, s, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  function poly(pts, fill, strokeW) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (strokeW) { ctx.lineWidth = strokeW; ctx.strokeStyle = OUTLINE; ctx.stroke(); }
  }

  function drawPine(p, t, S, ox, oy) {
    // S: unit->px scale; ox, oy: pixel offsets of unit origin.
    var sway = Math.sin(t * 0.5 + p.sway) * 3;
    var x = ox + p.x * S, y = oy + p.y * S, h = p.h * S, w = p.w * S;
    // Trunk
    ctx.fillStyle = TRUNK;
    ctx.fillRect(x - w * 0.06, y - h * 0.25, w * 0.12, h * 0.25);
    // Three stacked triangles, segmented color fields, bold outlines.
    var tiers = [
      { top: y - h, bot: y - h * 0.45, half: w * 0.5 },
      { top: y - h * 0.75, bot: y - h * 0.25, half: w * 0.42 },
      { top: y - h * 0.5, bot: y - h * 0.05, half: w * 0.34 }
    ];
    for (var k = 0; k < 3; k++) {
      var tr = tiers[k];
      ctx.lineWidth = Math.max(2, S * 3);
      poly([[x + sway, tr.top], [x - tr.half, tr.bot], [x + tr.half, tr.bot]], PINE, ctx.lineWidth);
    }
  }

  // Time handling: boot flag — frame one is draw(0); clock starts with rAF.
  var startTime = 0, booted = false;
  function now() {
    if (!booted) return 0;
    return (performance.now() - startTime) / 1000;
  }

  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var S = Math.min(W, H) / 1000;
    var ox = (W - 1000 * S) / 2, oy = (H - 1000 * S) / 2;
    // Field-like composition goes full-bleed on phones.
    if (isPhone()) { S = Math.max(W, H) / 1000; ox = (W - 1000 * S) / 2; oy = (H - 1000 * S) / 2; }

    var cam = camera(t);
    var d = dragOffset(t);
    // Camera transform: scale about focus, plus drag offset in px.
    ctx.save();
    ctx.translate(W / 2 + d.x, H / 2 + d.y);
    ctx.scale(cam.scale, cam.scale);
    ctx.translate(-(ox + cam.fx * S), -(oy + cam.fy * S));

    // Sky (dusk indigo field, full unit square plus margin for camera moves).
    ctx.fillStyle = INDIGO;
    ctx.fillRect(ox - 500 * S, oy - 500 * S, 2000 * S, 2000 * S);
    // Sun: ember disc with bold outline.
    ctx.beginPath();
    ctx.moveTo(ox + (sunX + sunR) * S, oy + sunY * S);
    ctx.arc(ox + sunX * S, oy + sunY * S, sunR * S, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = EMBER; ctx.fill();
    ctx.lineWidth = Math.max(2, S * 4); ctx.strokeStyle = OUTLINE; ctx.stroke();
    // Shore band.
    ctx.fillStyle = TRUNK;
    ctx.fillRect(ox - 200 * S, oy + 600 * S, 1400 * S, 22 * S);
    // Water.
    ctx.fillStyle = WATER;
    ctx.fillRect(ox - 200 * S, oy + 622 * S, 1400 * S, 400 * S);
    // Sun's reflection column on the water (segmented ember bars, breathing).
    // Drawn after the water fill so the bars sit on top of it.
    var breath = 0.5 + 0.5 * Math.sin(t * 0.8);
    for (var r = 0; r < 6; r++) {
      var bw = (30 - r * 3) * S * (0.8 + 0.4 * breath);
      var by = oy + (660 + r * 34) * S;
      ctx.fillStyle = rgba(224, 150, 42, 0.55 - r * 0.06);
      ctx.fillRect(ox + (sunX - 15) * S + (r % 2 ? 6 * S : -6 * S), by, bw, 7 * S);
    }
    // Ripple lines: closed-form sine drift, own slow loop regardless of camera.
    ctx.lineWidth = Math.max(1, S * 2);
    ctx.strokeStyle = rgba(232, 230, 220, 0.5);
    for (var i = 0; i < ripples.length; i++) {
      var rp = ripples[i];
      var rx = (rp.x0 + t * rp.sp * 10) % 1100 - 50;
      var ry = rp.y + Math.sin(t * 0.6 + rp.ph) * 3;
      ctx.beginPath();
      ctx.moveTo(ox + rx * S, oy + ry * S);
      ctx.lineTo(ox + (rx + rp.len) * S, oy + ry * S);
      ctx.stroke();
    }
    // Pines along the shore.
    for (var p = 0; p < pines.length; p++) drawPine(pines[p], t, S, ox, oy);

    ctx.restore();

    // Grain overlay: seeded dots keyed by quantized time (0.5 s quantum).
    var q = Math.floor(t * 2);
    var grng = mulberry32(1399000 + q * 7919);
    ctx.fillStyle = rgba(232, 230, 220, 0.05);
    for (var g = 0; g < 160; g++) {
      var gx = grng() * W, gy = grng() * H;
      ctx.fillRect(gx, gy, 2, 2);
    }
  }

  resize();
  draw(0);

  function loop(ts) {
    if (!booted) { booted = true; startTime = ts; }
    draw(now());
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
