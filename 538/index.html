<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silent Nine</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2B3C0; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (NH2 spec: four inks, flat only, nothing else) ----------
  var PINK = '#F2B3C0',   // flat pink ground / figure pink
      INK = '#161616',    // black outlines, gutters, objects
      GRAY = '#CFCFCF',   // the one contrasting figure
      WHITE = '#FFFFFF';  // panel interiors, heads, balloons

  // ---------- viewport / stage (square stage, stage units 0..1) ----------
  var W = 0, H = 0, SX = 0, SY = 0, SS = 0;
  var isPhone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SS = Math.min(w, h);
    SX = (w - SS) / 2; SY = (h - SS) / 2;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || h > w * 1.15;
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- stage-unit helpers (arguments are stage units 0..1) ----------
  function X(u) { return SX + u * SS; }
  function Y(u) { return SY + u * SS; }
  function sLine(x1, y1, x2, y2, wdt, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function sCirc(x, y, r, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * SS, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function sCircS(x, y, r, wdt, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS;
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * SS, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function sEll(x, y, rx, ry, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(X(x), Y(y), rx * SS, ry * SS, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function sEllS(x, y, rx, ry, wdt, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS;
    ctx.beginPath(); ctx.ellipse(X(x), Y(y), rx * SS, ry * SS, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function sRect(x, y, w, h, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.fillRect(X(x), Y(y), w * SS, h * SS);
    ctx.globalAlpha = 1;
  }
  function rrPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(X(x + r), Y(y));
    ctx.lineTo(X(x + w - r), Y(y)); ctx.arcTo(X(x + w), Y(y), X(x + w), Y(y + r), r * SS);
    ctx.lineTo(X(x + w), Y(y + h - r)); ctx.arcTo(X(x + w), Y(y + h), X(x + w - r), Y(y + h), r * SS);
    ctx.lineTo(X(x + r), Y(y + h)); ctx.arcTo(X(x), Y(y + h), X(x), Y(y + h - r), r * SS);
    ctx.lineTo(X(x), Y(y + r)); ctx.arcTo(X(x), Y(y), X(x + r), Y(y), r * SS);
    ctx.closePath();
  }
  function sRrFill(x, y, w, h, r, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col; rrPath(x, y, w, h, r); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function sRrStroke(x, y, w, h, r, wdt, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS; rrPath(x, y, w, h, r); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function sTri(x1, y1, x2, y2, x3, y3, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.lineTo(X(x3), Y(y3));
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ---------- grid geometry ----------
  var MARGIN = 0.045;                 // pink margin around the grid
  var GUT = 8 / 1080;                 // 8px black gutters at stage scale
  var CELL = (1 - 2 * MARGIN - 2 * GUT) / 3;
  function cellRect(i) {
    var cx = i % 3, cy = (i / 3) | 0;
    return { x: MARGIN + cx * (CELL + GUT), y: MARGIN + cy * (CELL + GUT), w: CELL, h: CELL };
  }

  // ---------- panel-local context ----------
  // All scene drawing happens in local units: u,v in 0..1 across one panel.
  // L converts to stage units (positions AND sizes) before touching ctx.
  function makeLocal(p) {
    var L = { p: p };
    L.X = function (u) { return p.x + u * p.w; };
    L.Y = function (v) { return p.y + v * p.h; };
    L.px = function (s) { return s * p.w * SS; };  // local size -> device px
    L.line = function (u1, v1, u2, v2, w, col, a) { sLine(L.X(u1), L.Y(v1), L.X(u2), L.Y(v2), w * p.w, col, a); };
    L.circ = function (u, v, r, col, a) { sCirc(L.X(u), L.Y(v), r * p.w, col, a); };
    L.circS = function (u, v, r, w, col, a) { sCircS(L.X(u), L.Y(v), r * p.w, w * p.w, col, a); };
    L.ell = function (u, v, rx, ry, col, a) { sEll(L.X(u), L.Y(v), rx * p.w, ry * p.h, col, a); };
    L.ellS = function (u, v, rx, ry, w, col, a) { sEllS(L.X(u), L.Y(v), rx * p.w, ry * p.h, w * p.w, col, a); };
    L.rect = function (u, v, w, h, col, a) { sRect(L.X(u), L.Y(v), w * p.w, h * p.h, col, a); };
    L.rrFill = function (u, v, w, h, r, col, a) { sRrFill(L.X(u), L.Y(v), w * p.w, h * p.h, r * p.w, col, a); };
    L.rrStroke = function (u, v, w, h, r, wd, col, a) { sRrStroke(L.X(u), L.Y(v), w * p.w, h * p.h, r * p.w, wd * p.w, col, a); };
    L.tri = function (u1, v1, u2, v2, u3, v3, col, a) { sTri(L.X(u1), L.Y(v1), L.X(u2), L.Y(v2), L.X(u3), L.Y(v3), col, a); };
    return L;
  }
  function groundBand(p) {
    sRect(p.x, p.y + 0.8 * p.h, p.w, 0.2 * p.h, PINK);
  }

  // ---------- story grammar ----------
  // figure scenes (6 per grid, drawn from this pool of 8)
  var FIG_SCENES = ['phoneCall', 'twoAtTable', 'clasp', 'forkPause',
                    'coffeeChat', 'standingPair', 'readingPaper', 'typingDesk'];
  var FULL_FIG = { phoneCall: 1, twoAtTable: 1, coffeeChat: 1, standingPair: 1, readingPaper: 1, typingDesk: 1 };
  // object close-ups (3 per grid); the first pick always comes from the core four
  var OBJ_CORE = ['shoe', 'phone', 'fork', 'cup'];
  var OBJ_POOL = ['shoe', 'phone', 'fork', 'cup', 'watch', 'keys'];
  // balloon punctuation by reading position: calm -> question -> exclaim -> calm
  var CURVE = ['...', '...', '...', '?', '?', '?', '!', '!', '...'];

  function shuffled(rng, arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = (rng() * (i + 1)) | 0;
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function makeStory(rng) {
    var panels = [];
    var i;
    // choose 3 object positions out of 9
    var objPos = {};
    var order = shuffled(rng, [0, 1, 2, 3, 4, 5, 6, 7, 8]);
    for (i = 0; i < 3; i++) objPos[order[i]] = true;
    // figure scenes: 6 distinct
    var figs = shuffled(rng, FIG_SCENES).slice(0, 6);
    // object kinds: first from the core four, the rest from the full pool, all distinct
    var kinds = [OBJ_CORE[(rng() * OBJ_CORE.length) | 0]];
    var rest = shuffled(rng, OBJ_POOL.filter(function (k) { return k !== kinds[0]; }));
    kinds.push(rest[0], rest[1]);
    // the one gray figure: chosen among full-figure panels
    var fullIdx = [];
    var fi = 0, oi = 0;
    for (i = 0; i < 9; i++) {
      if (objPos[i]) {
        panels.push({ kind: 'obj', scene: kinds[oi++], gray: false, balloon: null });
      } else {
        var sc = figs[fi++];
        panels.push({ kind: 'fig', scene: sc, gray: false, balloon: null });
        if (FULL_FIG[sc]) fullIdx.push(i);
      }
    }
    var grayAt = fullIdx[(rng() * fullIdx.length) | 0];
    panels[grayAt].gray = true;
    // balloons on figure panels only, punctuation from the tension curve
    var anyBang = false, anyQ = false, anyDots = false;
    for (i = 0; i < 9; i++) {
      if (panels[i].kind !== 'fig') continue;
      if (rng() < 0.72) {
        panels[i].balloon = CURVE[i];
        if (CURVE[i] === '!') anyBang = true;
        if (CURVE[i] === '?') anyQ = true;
        if (CURVE[i] === '...') anyDots = true;
      }
    }
    // guarantee the arc reads: one '...', one '?', one '!' somewhere on figures
    function forcePunct(ch, test) {
      for (var k = 0; k < 9; k++) {
        if (panels[k].kind === 'fig' && test(k)) { panels[k].balloon = ch; return; }
      }
    }
    if (!anyDots) forcePunct('...', function (k) { return k <= 2; });
    if (!anyQ) forcePunct('?', function (k) { return k >= 3 && k <= 5; });
    if (!anyBang) forcePunct('!', function (k) { return k >= 6 && k <= 7; });
    // the curve closes calm: a figure in the last panel trails off with '...'
    if (panels[8].kind === 'fig' && !panels[8].balloon) panels[8].balloon = '...';
    return panels;
  }

  // ---------- figures and balloons (local units) ----------
  // symbol-face figure: round head (dot eyes, single line mouth), flat torso,
  // black stick legs when standing. Returns head geometry for props/balloons.
  function drawFigure(L, cx, groundV, scale, gray, seated) {
    var body = gray ? GRAY : PINK;
    var headR = 0.108 * scale;
    var torsoH = (seated ? 0.30 : 0.34) * scale;
    var torsoTop = groundV - (seated ? 0 : 0.18) * scale - torsoH;
    var headCy = torsoTop - headR - 0.012;
    if (!seated) {
      L.line(cx - 0.065 * scale, groundV - 0.18 * scale, cx - 0.065 * scale, groundV, 0.030, INK);
      L.line(cx + 0.065 * scale, groundV - 0.18 * scale, cx + 0.065 * scale, groundV, 0.030, INK);
    }
    L.rrFill(cx - 0.125 * scale, torsoTop, 0.25 * scale, torsoH, 0.03, body);
    L.rrStroke(cx - 0.125 * scale, torsoTop, 0.25 * scale, torsoH, 0.03, 0.023, INK);
    L.circ(cx, headCy, headR, gray ? GRAY : WHITE);
    L.circS(cx, headCy, headR, 0.023, INK);
    L.circ(cx - headR * 0.36, headCy - headR * 0.08, headR * 0.13, INK);
    L.circ(cx + headR * 0.36, headCy - headR * 0.08, headR * 0.13, INK);
    L.line(cx - headR * 0.30, headCy + headR * 0.42, cx + headR * 0.30, headCy + headR * 0.42, 0.023, INK);
    return { cx: cx, headCy: headCy, headR: headR, torsoTop: torsoTop, groundV: groundV, scale: scale };
  }
  function arm(L, x1, y1, x2, y2) { L.line(x1, y1, x2, y2, 0.030, INK); }

  function drawBalloon(L, bx, by, bw, bh, text, tailX, tailY) {
    // tail first (under the body), fill then a hint of outline on the open side
    L.tri(bx + bw * 0.5 - 0.035, by + bh - 0.01, bx + bw * 0.5 + 0.035, by + bh - 0.01, tailX, tailY, WHITE);
    L.line(bx + bw * 0.5 - 0.035, by + bh - 0.005, tailX, tailY, 0.020, INK);
    L.rrFill(bx, by, bw, bh, 0.045, WHITE);
    L.rrStroke(bx, by, bw, bh, 0.045, 0.023, INK);
    ctx.fillStyle = INK;
    ctx.font = '700 ' + Math.round(bh * 0.52 * L.p.w * SS) + 'px "Arial Rounded MT Bold", "Helvetica Rounded", Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, X(L.X(bx + bw / 2)), Y(L.Y(by + bh / 2 + 0.008)));
  }

  // ----- figure scenes -----
  function scenePhoneCall(p, d) {
    var L = makeLocal(p);
    var f = drawFigure(L, 0.40, 0.80, 1.0, d.gray, false);
    // phone held to the right ear: small black rounded rect, tilted
    ctx.save();
    ctx.translate(X(L.X(0.40 + f.headR + 0.030)), Y(L.Y(f.headCy + 0.01)));
    ctx.rotate(0.22);
    ctx.fillStyle = INK;
    var pw = L.px(0.042), ph = L.px(0.082);
    ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
    ctx.restore();
    arm(L, 0.40 + 0.11, f.torsoTop + 0.10, 0.40 + f.headR + 0.02, f.headCy + 0.05);
    arm(L, 0.40 - 0.11, f.torsoTop + 0.10, 0.40 - 0.17, 0.62);
    if (d.balloon) drawBalloon(L, 0.56, 0.07, 0.36, 0.17, d.balloon, 0.47, f.headCy - 0.02);
  }
  function sceneTwoAtTable(p, d) {
    var L = makeLocal(p);
    var a = drawFigure(L, 0.27, 0.80, 0.92, d.gray, true);
    var b = drawFigure(L, 0.73, 0.80, 0.92, false, true);
    // table between them
    L.rect(0.36, 0.60, 0.28, 0.022, INK);
    L.line(0.40, 0.622, 0.40, 0.80, 0.027, INK);
    L.line(0.60, 0.622, 0.60, 0.80, 0.027, INK);
    // a cup on the table
    L.rrFill(0.465, 0.545, 0.07, 0.055, 0.012, WHITE);
    L.rrStroke(0.465, 0.545, 0.07, 0.055, 0.012, 0.021, INK);
    arm(L, 0.27 + 0.10, a.torsoTop + 0.12, 0.40, 0.58);
    arm(L, 0.73 - 0.10, b.torsoTop + 0.12, 0.60, 0.58);
    if (d.balloon) drawBalloon(L, 0.33, 0.05, 0.34, 0.16, d.balloon, 0.66, b.headCy);
  }
  function sceneClasp(p, d) {
    var L = makeLocal(p);
    // close-up: two forearms rising from the bottom corners into a clasp
    L.line(0.10, 1.0, 0.415, 0.60, 0.125, PINK);
    L.line(0.90, 1.0, 0.585, 0.60, 0.125, PINK);
    // white cuff bands across the arms, same width as the arm
    L.line(0.28, 0.748, 0.316, 0.698, 0.128, WHITE);
    L.line(0.72, 0.748, 0.684, 0.698, 0.128, WHITE);
    // clasped hands: two tall ellipses leaning into each other, overlapping
    function hand(cx, cy, rot) {
      ctx.save();
      ctx.translate(X(L.X(cx)), Y(L.Y(cy)));
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, L.px(0.105), L.px(0.148), 0, 0, Math.PI * 2);
      ctx.fillStyle = WHITE; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = L.px(0.023); ctx.stroke();
      ctx.restore();
    }
    hand(0.435, 0.46, -0.30);
    hand(0.565, 0.46, 0.30);
    // finger separations: two short curves near the top of each hand
    function fingerArc(cx, cy, rot, dx) {
      ctx.save();
      ctx.translate(X(L.X(cx)), Y(L.Y(cy)));
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.arc(L.px(dx), L.px(-0.105), L.px(0.030), Math.PI * 1.05, Math.PI * 1.95);
      ctx.strokeStyle = INK; ctx.lineWidth = L.px(0.017); ctx.stroke();
      ctx.restore();
    }
    fingerArc(0.435, 0.46, -0.30, -0.038);
    fingerArc(0.435, 0.46, -0.30, 0.038);
    fingerArc(0.565, 0.46, 0.30, -0.038);
    fingerArc(0.565, 0.46, 0.30, 0.038);
    // thumbs crossing at the front of the clasp
    L.ell(0.472, 0.545, 0.026, 0.042, WHITE);
    L.ellS(0.472, 0.545, 0.026, 0.042, 0.016, INK);
    L.ell(0.528, 0.545, 0.026, 0.042, WHITE);
    L.ellS(0.528, 0.545, 0.026, 0.042, 0.016, INK);
    if (d.balloon) drawBalloon(L, 0.32, 0.03, 0.36, 0.15, d.balloon, 0.5, 0.30);
  }
  function sceneForkPause(p, d) {
    var L = makeLocal(p);
    // partial figure at the left edge
    L.circ(0.02, 0.16, 0.085, WHITE);
    L.circS(0.02, 0.16, 0.085, 0.023, INK);
    L.circ(0.005, 0.145, 0.011, INK);
    L.circ(0.045, 0.145, 0.011, INK);
    L.rrFill(-0.06, 0.26, 0.17, 0.30, 0.03, PINK);
    L.rrStroke(-0.06, 0.26, 0.17, 0.30, 0.03, 0.023, INK);
    // plate with food dots, bottom centre
    L.ell(0.52, 0.72, 0.26, 0.085, WHITE);
    L.ellS(0.52, 0.72, 0.26, 0.085, 0.023, INK);
    L.ell(0.52, 0.705, 0.185, 0.052, WHITE);
    L.ellS(0.52, 0.705, 0.185, 0.052, 0.015, INK);
    L.circ(0.45, 0.70, 0.020, PINK);
    L.circ(0.55, 0.715, 0.016, GRAY);
    L.circ(0.60, 0.695, 0.013, PINK);
    // arm entering from the top-right corner, hand holding a fork over the plate
    L.line(0.90, 0.02, 0.66, 0.34, 0.095, PINK);
    L.line(0.876, 0.052, 0.852, 0.084, 0.105, WHITE);
    L.ell(0.645, 0.365, 0.05, 0.035, WHITE);
    L.ellS(0.645, 0.365, 0.05, 0.035, 0.018, INK);
    // fork: handle + neck + 3 tines pointing down, hovering
    L.line(0.645, 0.375, 0.615, 0.50, 0.033, INK);
    L.line(0.588, 0.50, 0.642, 0.50, 0.027, INK);
    L.line(0.592, 0.50, 0.592, 0.565, 0.021, INK);
    L.line(0.615, 0.50, 0.615, 0.575, 0.021, INK);
    L.line(0.638, 0.50, 0.638, 0.565, 0.021, INK);
    if (d.balloon) drawBalloon(L, 0.17, 0.05, 0.33, 0.16, d.balloon, 0.09, 0.185);
  }
  function sceneCoffeeChat(p, d) {
    var L = makeLocal(p);
    var f = drawFigure(L, 0.5, 0.80, 1.0, d.gray, false);
    // cup held with both hands at chest height
    arm(L, 0.5 - 0.11, f.torsoTop + 0.10, 0.5 - 0.055, f.torsoTop + 0.20);
    arm(L, 0.5 + 0.11, f.torsoTop + 0.10, 0.5 + 0.055, f.torsoTop + 0.20);
    L.rrFill(0.5 - 0.055, f.torsoTop + 0.155, 0.11, 0.085, 0.015, WHITE);
    L.rrStroke(0.5 - 0.055, f.torsoTop + 0.155, 0.11, 0.085, 0.015, 0.021, INK);
    L.ell(0.5, f.torsoTop + 0.162, 0.048, 0.012, PINK);
    if (d.balloon) drawBalloon(L, 0.58, 0.06, 0.36, 0.17, d.balloon, 0.55, f.headCy - 0.02);
  }
  function sceneStandingPair(p, d) {
    var L = makeLocal(p);
    var a = drawFigure(L, 0.33, 0.80, 0.95, d.gray, false);
    drawFigure(L, 0.66, 0.80, 0.95, false, false);
    arm(L, 0.33 - 0.11, a.torsoTop + 0.10, 0.33 - 0.16, 0.60);
    arm(L, 0.33 + 0.11, a.torsoTop + 0.10, 0.50, 0.58);
    if (d.balloon) drawBalloon(L, 0.30, 0.05, 0.36, 0.16, d.balloon, 0.36, a.headCy - 0.03);
  }
  function sceneReadingPaper(p, d) {
    var L = makeLocal(p);
    var body = d.gray ? GRAY : PINK;
    // torso behind the paper
    L.rrFill(0.30, 0.42, 0.40, 0.38, 0.03, body);
    L.rrStroke(0.30, 0.42, 0.40, 0.38, 0.03, 0.023, INK);
    // head peeking over the top
    L.circ(0.5, 0.335, 0.105, d.gray ? GRAY : WHITE);
    L.circS(0.5, 0.335, 0.105, 0.023, INK);
    L.circ(0.462, 0.327, 0.0135, INK);
    L.circ(0.538, 0.327, 0.0135, INK);
    L.line(0.468, 0.379, 0.532, 0.379, 0.023, INK);
    // the newspaper: big white sheet with gray column blocks (no words)
    L.rrFill(0.235, 0.40, 0.53, 0.42, 0.012, WHITE);
    L.rrStroke(0.235, 0.40, 0.53, 0.42, 0.012, 0.024, INK);

  // ----- object close-ups -----

  function objCup(p) {

  function objKeys(p) {
    var L = makeLocal(p);

    L.circS(0.40, 0.30, 0.105, 0.033, GRAY);

    ctx.save();

    L.circS(0.468, 0.40, 0.024, 0.015, INK);

  var FIG_DRAW = {
    phoneCall: scenePhoneCall, twoAtTable: sceneTwoAtTable, clasp: sceneClasp,
    forkPause: sceneForkPause, coffeeChat: sceneCoffeeChat, standingPair: sceneStandingPair,
    readingPaper: sceneReadingPaper, typingDesk: sceneTypingDesk
  };
  var OBJ_DRAW = { shoe: objShoe, phone: objPhone, fork: objFork, cup: objCup, watch: objWatch, keys: objKeys };

  function drawPanel(i, reveal) {
    var d = story[i];
    var p = cellRect(i);
    // black gutter block, then white interior
    sRect(p.x - GUT / 2, p.y - GUT / 2, p.w + GUT, p.h + GUT, INK);
    sRect(p.x, p.y, p.w, p.h, WHITE);
    if (reveal <= 0) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(X(p.x), Y(p.y), p.w * reveal * SS, p.h * SS);
    ctx.clip();
    sRect(p.x, p.y, p.w, p.h, WHITE);
    groundBand(p);
    if (d.kind === 'fig') FIG_DRAW[d.scene](p, d); else OBJ_DRAW[d.scene](p);
    ctx.restore();
  }

  // ---------- state: initial story is fixed; taps reseed ----------
  var BASE_SEED = 538065;
  var tapCount = 0;
  var story = makeStory(mulberry32(BASE_SEED));
  var wipeStart = -10; // long past: frame one shows the complete grid
  var nowT = 0;

  function handleTap() {
    tapCount++;
    story = makeStory(mulberry32(BASE_SEED + tapCount * 7919));
    wipeStart = nowT;
  }
  canvas.addEventListener('pointerdown', handleTap);
  canvas.addEventListener('mousedown', handleTap);
  canvas.addEventListener('touchstart', handleTap);

  // ---------- draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PINK; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < 9; i++) {
      var pr = (t - wipeStart - i * 0.055) / 0.32;
      if (pr > 1) pr = 1;
      if (pr < 0) pr = 0;
      drawPanel(i, pr);
    }
    // hint: the only word on the page
    ctx.fillStyle = INK; ctx.globalAlpha = 0.45;
    ctx.font = '600 ' + Math.round((isPhone ? 0.024 : 0.02) * SS) + 'px sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('tap', X(0.985), Y(0.99));
    ctx.globalAlpha = 1;
  }

  // ---------- deterministic first frame + guarded loop ----------
  draw(0);
  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    nowT = (now - startStamp) / 1000;
    draw(nowT);
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
