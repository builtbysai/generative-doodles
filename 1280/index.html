<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Beautiful Zameen</title>
<style>
  html, body { margin: 0; padding: 0; background: #171310; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;

  // Seeded PRNG (mulberry32, fixed seed): deterministic, no Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var MUSLIN = '#E8DCC3', SEPIA = '#C9A87A', RED = '#B03A2E', MUSTARD = '#D9A441',
      INDIGO = '#2E3A5C', COTTON = '#F5F0E6', GREEN = '#6B7F4E', SHADOW = '#4A3B2A',
      INK = '#171310';

  // Square composition geometry, recomputed on resize.
  var S = 0, ox = 0, oy = 0, b = 0; // side, origin, border band
  var borderCells = [], washBlobs = [], cottonPlants = [], fieldRows = [];
  var verseLines = [
    ['please', 'strip', 'them', 'of', 'these'],
    ['chemical', 'cotton', 'flowers'],
    ['let', 'them', 'cling', 'to', 'peace']
  ];
  var VERSE_TOTAL = 30, VERSE_N = 13;

  function build() {
    var r = mulberry32(128001);
    borderCells = [];
    // Phulkari border: two dense rows of darn-stitch diamond cells per side.
    var cols = [MUSTARD, RED, COTTON, MUSTARD, RED];
    var step = S * 0.046;
    function sideCells(x0, y0, x1, y1) {
      var dx = x1 - x0, dy = y1 - y0;
      var len = Math.sqrt(dx * dx + dy * dy);
      var n = Math.floor(len / step);
      for (var k = 0; k <= n; k++) {
        var f = n === 0 ? 0.5 : k / n;
        borderCells.push({
          x: x0 + dx * f, y: y0 + dy * f,
          rad: b * 0.16 * (0.8 + r() * 0.4),
          col: cols[Math.floor(r() * cols.length)],
          rot: (r() - 0.5) * 0.5,
          ph: r() * Math.PI * 2
        });
      }
    }
    var r1 = b * 0.32, r2 = b * 0.68;
    // Row 1 (outer) and row 2 (inner) on all four sides, inset to the corners.
    sideCells(b + r1, r1, S - b - r1, r1);
    sideCells(b + r1, S - r1, S - b - r1, S - r1);
    sideCells(r1, b + r1, r1, S - b - r1);
    sideCells(S - r1, b + r1, S - r1, S - b - r1);
    sideCells(b + r2, r2, S - b - r2, r2);
    sideCells(b + r2, S - r2, S - b - r2, S - r2);
    sideCells(r2, b + r2, r2, S - b - r2);
    sideCells(S - r2, b + r2, S - r2, S - b - r2);

    // Sepia wash blobs over the muslin inner field.
    washBlobs = [];
    for (var i = 0; i < 14; i++) {
      washBlobs.push({
        x: b + r() * (S - 2 * b), y: b + r() * (S - 2 * b),
        rx: S * (0.08 + r() * 0.14), ry: S * (0.05 + r() * 0.09),
        rot: (r() - 0.5) * 1.2, a: 0.10 + r() * 0.10
      });
    }

    // Cotton plants along the foreground of the vignette.
    cottonPlants = [];
    var inner = S - 2 * b;
    for (var p = 0; p < 7; p++) {
      var px = b + inner * (0.08 + p * 0.14) + (r() - 0.5) * inner * 0.04;
      var py = b + inner * 0.86 + (r() - 0.5) * inner * 0.03;
      var bolls = [];
      for (var q = 0; q < 4; q++) {
        bolls.push({
          dx: (r() - 0.5) * S * 0.05, dy: -r() * S * 0.07,
          rad: S * (0.012 + r() * 0.010), ph: r() * Math.PI * 2
        });
      }
      cottonPlants.push({ x: px, y: py, h: S * (0.07 + r() * 0.04), bolls: bolls, ph: r() * Math.PI * 2 });
    }

    // Converging field rows behind the figures.
    fieldRows = [];
    for (var f2 = 0; f2 < 9; f2++) {
      fieldRows.push({ x0: b + inner * (f2 / 8), x1: b + inner * (0.30 + (f2 / 8) * 0.40) });
    }
  }

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var minDim = Infinity;
    try { if (window.screen) minDim = Math.min(window.screen.width, window.screen.height); } catch (e) {}
    isPhone = (minDim < 700) || (H > W * 1.15);
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    S = Math.round(Math.min(W, H) * (isPhone ? 1.0 : 0.94));
    ox = Math.round((W - S) / 2);
    oy = Math.round((H - S) / 2);
    b = S * 0.15;
    build();
  }

  function pin() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // --- Interaction state: closed-form over recorded events + t ---
  var dragEvents = []; // {x, y, t} in square coords, border drags only
  var lastAct = -100; // idle since long before load: breeze is on at frame one
  var pointerDown = false;

  function toSquare(e) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e2) {}
    var cx = (e.clientX !== undefined ? e.clientX : 0) - rect.left;
    var cy = (e.clientY !== undefined ? e.clientY : 0) - rect.top;
    return { x: cx - ox, y: cy - oy };
  }
  function inBorder(p) {
    return p.x >= 0 && p.x <= S && p.y >= 0 && p.y <= S &&
      (p.x < b || p.x > S - b || p.y < b || p.y > S - b);
  }
  canvas.addEventListener('pointerdown', function (e) {
    pointerDown = true;
    var p = toSquare(e);
    lastAct = nowT();
    if (inBorder(p)) dragEvents.push({ x: p.x, y: p.y, t: nowT() });
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = toSquare(e);
    lastAct = nowT();
    if (pointerDown && inBorder(p)) dragEvents.push({ x: p.x, y: p.y, t: nowT() });
  });
  canvas.addEventListener('pointerup', function () { pointerDown = false; lastAct = nowT(); });

  // Clock: starts with the rAF loop; frame one is always exactly t = 0.
  var T0 = 0, booted = false;
  function nowT() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - T0) / 1000;
    return 0;
  }

  function dot(x, y, rad, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fill();
  }

  function diamond(x, y, rad, rot, col, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(scale, scale);
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1, S * 0.0022);
    ctx.setLineDash([Math.max(2, S * 0.006), Math.max(2, S * 0.005)]);
    ctx.beginPath();
    ctx.moveTo(0, -rad);
    ctx.lineTo(rad, 0);
    ctx.lineTo(0, rad);
    ctx.lineTo(-rad, 0);
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    dot(x, y, Math.max(1, rad * 0.18), col);
  }

  function drawFigure(cx, baseY, hgt, bodyCol, drapeCol) {
    // Loose-wash draped figure, seen from a low angle: tall, simple, soft-edged.
    ctx.fillStyle = bodyCol;
    ctx.beginPath();
    ctx.moveTo(cx - hgt * 0.16, baseY);
    ctx.quadraticCurveTo(cx - hgt * 0.22, baseY - hgt * 0.55, cx - hgt * 0.10, baseY - hgt * 0.82);
    ctx.quadraticCurveTo(cx, baseY - hgt * 0.95, cx + hgt * 0.10, baseY - hgt * 0.82);
    ctx.quadraticCurveTo(cx + hgt * 0.22, baseY - hgt * 0.55, cx + hgt * 0.16, baseY);
    ctx.closePath();
    ctx.fill();
    // Drape fold lines, flat alpha.
    ctx.strokeStyle = drapeCol;
    ctx.lineWidth = Math.max(1, S * 0.003);
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(cx - hgt * 0.05, baseY - hgt * 0.78);
    ctx.quadraticCurveTo(cx - hgt * 0.02, baseY - hgt * 0.45, cx - hgt * 0.06, baseY - hgt * 0.08);
    ctx.moveTo(cx + hgt * 0.06, baseY - hgt * 0.72);
    ctx.quadraticCurveTo(cx + hgt * 0.03, baseY - hgt * 0.40, cx + hgt * 0.07, baseY - hgt * 0.10);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // Head in sepia wash.
    dot(cx, baseY - hgt * 0.92, hgt * 0.075, SEPIA);
  }

  function draw(t) {
    pin();
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(ox, oy);

    // Muslin ground.
    ctx.fillStyle = MUSLIN;
    ctx.fillRect(0, 0, S, S);

    // Sepia washes.
    for (var i = 0; i < washBlobs.length; i++) {
      var w = washBlobs[i];
      ctx.save();
      ctx.translate(w.x, w.y);
      ctx.rotate(w.rot);
      ctx.fillStyle = SEPIA;
      ctx.globalAlpha = w.a;
      ctx.beginPath();
      ctx.moveTo(w.rx, 0);
      ctx.ellipse(0, 0, w.rx, w.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // Phulkari border band: indigo ground.
    ctx.fillStyle = INDIGO;
    ctx.fillRect(0, 0, S, b);
    ctx.fillRect(0, S - b, S, b);
    ctx.fillRect(0, b, b, S - 2 * b);
    ctx.fillRect(S - b, b, b, S - 2 * b);
    // Inner stitch line framing the vignette.
    ctx.strokeStyle = MUSTARD;
    ctx.lineWidth = Math.max(1, S * 0.002);
    ctx.setLineDash([Math.max(3, S * 0.008), Math.max(3, S * 0.006)]);
    ctx.strokeRect(b + S * 0.008, b + S * 0.008, S - 2 * b - S * 0.016, S - 2 * b - S * 0.016);
    ctx.setLineDash([]);

    // Border cells with drag ripple: stitches compress (harden), then relax.
    for (var c = 0; c < borderCells.length; c++) {
      var cell = borderCells[c];
      var dx = 0, dy = 0, sc = 1;
      for (var e = 0; e < dragEvents.length; e++) {
        var ev = dragEvents[e];
        var dt = t - ev.t;
        if (dt < 0 || dt > 3) continue;
        var ddx = cell.x - ev.x, ddy = cell.y - ev.y;
        var dist = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
        var env = Math.exp(-dist / (S * 0.09)) * Math.exp(-dt / 1.2);
        var osc = Math.sin(dist * 0.35 - dt * 9);
        dx += (ddx / dist) * S * 0.02 * env * osc;
        dy += (ddy / dist) * S * 0.02 * env * osc;
        sc -= 0.25 * Math.exp(-dist / (S * 0.06)) * Math.exp(-dt / 1.2);
      }
      if (sc < 0.6) sc = 0.6;
      diamond(cell.x + dx, cell.y + dy, cell.rad, cell.rot, cell.col, sc);
    }

    // Vignette: field rows converging (low angle, viewer kneeling).
    var inner = S - 2 * b;
    var vinTop = b + inner * 0.02, vinBot = b + inner * 0.68;
    ctx.strokeStyle = GREEN;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = Math.max(1, S * 0.002);
    for (var fr = 0; fr < fieldRows.length; fr++) {
      ctx.beginPath();
      ctx.moveTo(fieldRows[fr].x0, vinBot);
      ctx.lineTo(fieldRows[fr].x1, vinTop + inner * 0.30);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Two women in the cotton field, loose washes.
    var figH = inner * 0.52;
    var baseY = b + inner * 0.72;
    drawFigure(b + inner * 0.30, baseY, figH, RED, MUSTARD);
    drawFigure(b + inner * 0.68, baseY, figH * 0.94, GREEN, COTTON);

    // Hands holding crops and a photograph at center.
    var hx = b + inner * 0.49, hy = b + inner * 0.52;
    ctx.strokeStyle = SEPIA;
    ctx.lineWidth = Math.max(2, S * 0.008);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b + inner * 0.34, baseY - figH * 0.45);
    ctx.quadraticCurveTo(hx - S * 0.03, hy, hx - S * 0.01, hy);
    ctx.moveTo(b + inner * 0.64, baseY - figH * 0.42);
    ctx.quadraticCurveTo(hx + S * 0.03, hy, hx + S * 0.01, hy);
    ctx.stroke();
    dot(hx - S * 0.012, hy, S * 0.011, SEPIA);
    dot(hx + S * 0.012, hy, S * 0.011, SEPIA);
    // The photograph: cream rect, slightly askew, sepia image inside.
    ctx.save();
    ctx.translate(hx, hy - S * 0.055);
    ctx.rotate(-0.08);
    ctx.fillStyle = COTTON;
    ctx.fillRect(-S * 0.035, -S * 0.028, S * 0.07, S * 0.056);
    ctx.fillStyle = SEPIA;
    ctx.globalAlpha = 0.7;
    ctx.fillRect(-S * 0.027, -S * 0.020, S * 0.054, S * 0.030);
    ctx.globalAlpha = 1;
    ctx.restore();
    // Crop stalks held beside the photograph.
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = Math.max(1, S * 0.0025);
    ctx.beginPath();
    for (var st = 0; st < 3; st++) {
      var sx = hx + S * 0.045 + st * S * 0.008;
      ctx.moveTo(sx, hy + S * 0.01);
      ctx.quadraticCurveTo(sx + S * 0.004, hy - S * 0.02, sx + S * 0.002, hy - S * 0.045);
    }
    ctx.stroke();

    // Cotton plants in the foreground; breeze passes in stillness.
    var idle = t - lastAct;
    var breeze = idle < 4 ? 0 : Math.min(1, (idle - 4) / 3);
    for (var p = 0; p < cottonPlants.length; p++) {
      var pl = cottonPlants[p];
      var sway = breeze * S * 0.008 * Math.sin((Math.PI * 2 * t) / 7 + pl.ph);
      ctx.strokeStyle = GREEN;
      ctx.lineWidth = Math.max(1, S * 0.0025);
      ctx.beginPath();
      ctx.moveTo(pl.x, pl.y);
      ctx.quadraticCurveTo(pl.x + sway, pl.y - pl.h * 0.5, pl.x + sway * 1.4, pl.y - pl.h);
      ctx.stroke();
      for (var q = 0; q < pl.bolls.length; q++) {
        var bo = pl.bolls[q];
        dot(pl.x + bo.dx + sway * 1.4, pl.y - pl.h + bo.dy, bo.rad, COTTON);
      }
    }

    // Verse band: wavy baselines, words stitching in one by one over 30 s.
    var bandY = b + inner * 0.70;
    var bandH = inner * 0.28;
    var fontPx = Math.max(10, S * 0.030);
    ctx.font = fontPx + 'px Georgia, serif';
    ctx.textBaseline = 'alphabetic';
    var wordIndex = 0;
    for (var li = 0; li < verseLines.length; li++) {
      var words = verseLines[li];
      var lineY = bandY + bandH * (0.28 + li * 0.32);
      // Faint guide curve: the cloth's marked line, awaiting stitch.
      ctx.strokeStyle = SHADOW;
      ctx.globalAlpha = 0.16;
      ctx.lineWidth = Math.max(1, S * 0.0015);
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      for (var gx = b + inner * 0.06; gx <= b + inner * 0.94; gx += S * 0.01) {
        var gy = lineY + Math.sin(gx * 0.02 + li * 1.7) * S * 0.004;
        if (gx === b + inner * 0.06) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      // Center the line: measure all words plus gaps.
      var gap = fontPx * 0.55;
      var totalW = 0;
      var widths = [];
      for (var wi = 0; wi < words.length; wi++) {
        var ww = ctx.measureText(words[wi]).width;
        widths.push(ww);
        totalW += ww + (wi < words.length - 1 ? gap : 0);
      }
      var wx = b + (inner - totalW) / 2;
      for (var wj = 0; wj < words.length; wj++) {
        var wy = lineY + Math.sin((wx + widths[wj] / 2) * 0.02 + li * 1.7) * S * 0.004;
        var start = wordIndex * (VERSE_TOTAL / VERSE_N);
        var prog = Math.max(0, Math.min(1, (t - start) / 1.8));
        if (prog > 0) {
          ctx.globalAlpha = prog;
          ctx.fillStyle = SHADOW;
          ctx.fillText(words[wj], wx, wy);
          // Stitch dashes beneath the word: the sewn thread.
          ctx.strokeStyle = RED;
          ctx.lineWidth = Math.max(1, S * 0.0018);
          ctx.setLineDash([Math.max(2, S * 0.005), Math.max(2, S * 0.004)]);
          ctx.beginPath();
          ctx.moveTo(wx, wy + fontPx * 0.32);
          ctx.lineTo(wx + widths[wj], wy + fontPx * 0.32);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }
        wx += widths[wj] + gap;
        wordIndex++;
      }
    }

    ctx.restore();
  }

  size();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { size(); draw(0); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { size(); draw(0); });
  }
  draw(0); // Frame one: exactly t = 0 (boot flag, №343 rule).
  if (typeof requestAnimationFrame !== 'undefined') {
    (function loop() {
      if (!booted) { booted = true; T0 = performance.now(); }
      draw(nowT());
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
