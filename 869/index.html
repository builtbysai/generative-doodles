<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№869 Chair, Parking Lot</title>
<style>
  html, body { margin: 0; padding: 0; background: #232323; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №869 Chair, Parking Lot, ZW7 / PP1269, study #263 zach-wolfe.
  // One absurd object in the most ordinary setting possible. A
  // gaming chair sits alone in an empty parking lot at midday,
  // seen from above, a long shadow trailing it. Nothing is wrong
  // and nothing is explained. Tap cycles through six fixed
  // absurd pairings, in order, wrapping around: the double-take
  // is the whole image, so a fresh double-take is a faithful
  // refresh. Tap to reseed, never click-to-reload.
  var GROUND = '#232323'; // page ground, dark asphalt

  // Fixed-phase first frame: FIRST_T = 5 s into a 60 s cycle.
  // The shadow creep and the heat shimmer are both pure sines
  // of (t - FIRST_T) / CYCLE, so the frame at FIRST_T + 60
  // equals the frame at FIRST_T exactly.
  var FIRST_T = 5;
  var CYCLE = 60;
  var SEED = 869;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // ?pair=<0..5> selects the pairing at load. Read at load only.
  var probeT = null;
  var probePair = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var mp = qs.match(/[?&]pair=([0-9]+)/);
    if (mp) { probePair = parseInt(mp[1], 10) % 6; }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;
  var pairIndex = (probePair !== null) ? probePair : 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipsePath(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }
  function rr(x, y, w, h, r) {
    // Rounded rect path, started at its own first point.
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Palette: asphalt grey, faded lot lines, black-and-red
  // upholstery, hard daylight. Each pairing keeps its own
  // ground; the object is always the one saturated thing.
  var ASPHALT = [107, 111, 114];
  var ASPHALT_DARK = [88, 92, 95];
  var LINE_FADED = [216, 216, 210];
  var CHAIR_BLACK = [18, 18, 20];
  var CHAIR_RED = [178, 24, 28];
  var CREAM = [242, 237, 226]; // caption and hint
  var SHADOW = [16, 14, 12];

  // ---- Seeded texture tables, fixed at load -----------------------
  // Oil stains on the asphalt.
  var oilRng = mulberry32(SEED * 7 + 3);
  var OIL = [];
  var oi;
  for (oi = 0; oi < 7; oi++) {
    OIL.push({ x: 0.08 + oilRng() * 0.84, y: 0.10 + oilRng() * 0.80,
      rx: 0.02 + oilRng() * 0.035, ry: 0.012 + oilRng() * 0.02,
      rot: oilRng() * Math.PI, a: 0.10 + oilRng() * 0.10 });
  }
  // Gravel speckle on the rooftop.
  var gravRng = mulberry32(SEED * 13 + 5);
  var GRAVEL = [];
  var gi;
  for (gi = 0; gi < 260; gi++) {
    GRAVEL.push({ x: gravRng(), y: gravRng(), r: 0.001 + gravRng() * 0.0022,
      l: gravRng() > 0.5 });
  }
  // Wheat stalks: x, lean, height, shade.
  var wheatRng = mulberry32(SEED * 17 + 9);
  var WHEAT = [];
  var wi;
  for (wi = 0; wi < 320; wi++) {
    WHEAT.push({ x: wheatRng(), y: wheatRng(), lean: (wheatRng() - 0.5) * 0.03,
      len: 0.012 + wheatRng() * 0.02, dark: wheatRng() > 0.5 });
  }
  // Beach footprints.
  var footRng = mulberry32(SEED * 23 + 2);
  var FEET = [];
  var fi;
  for (fi = 0; fi < 14; fi++) {
    FEET.push({ x: 0.55 + fi * 0.02 + (footRng() - 0.5) * 0.01,
      y: 0.78 - fi * 0.045 + (footRng() - 0.5) * 0.01,
      side: (fi % 2 === 0) ? -1 : 1 });
  }
  // Heat shimmer lines: fixed rows, drifting phase.
  var shimRng = mulberry32(SEED * 31 + 4);
  var SHIMMER = [];
  var si2;
  for (si2 = 0; si2 < 6; si2++) {
    SHIMMER.push({ y: 0.62 + si2 * 0.055, ph: shimRng() * Math.PI * 2,
      amp: 0.004 + shimRng() * 0.004 });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    // The object sits just off centre, small in its setting.
    L.objX = 0.44;
    L.objY = 0.47;
    L.objS = 0.16; // object size as a fraction of W
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Sun creep: the shadow angle and length are pure sines of the
  // cycle phase, so they return exactly at FIRST_T + CYCLE.
  // u is 0..1 across the cycle.
  function phaseU(t) {
    return (((t - FIRST_T) / CYCLE) % 1 + 1) % 1;
  }
  function shadowVec(t) {
    var u = phaseU(t);
    var ang = 0.52 + 0.16 * Math.sin(2 * Math.PI * u); // about 30 deg, creeping
    var len = 1.9 * (1 + 0.10 * Math.sin(2 * Math.PI * u + 1.3));
    return { dx: Math.sin(ang) * len, dy: Math.cos(ang) * len };
  }

  // ---- Settings: procedural lot / street / room grids -------------
  function drawSetting(t) {
    var i, x, y;
    if (pairIndex === 0) {
      // Parking lot: asphalt, two rows of faded bays.
      ctx.fillStyle = rgb(ASPHALT);
      ctx.fillRect(0, 0, W, H);
      // A darker patched strip along the top, like a repair.
      ctx.fillStyle = rgba(ASPHALT_DARK, a4(0.55));
      ctx.fillRect(0, 0, W, H * 0.06);
      // Faded bay lines: horizontal rails and vertical dividers.
      ctx.strokeStyle = rgba(LINE_FADED, a4(0.42));
      ctx.lineWidth = Math.max(1.5, W * 0.004);
      ctx.beginPath();
      ctx.moveTo(0, H * 0.30); ctx.lineTo(W, H * 0.30);
      ctx.moveTo(0, H * 0.62); ctx.lineTo(W, H * 0.62);
      ctx.stroke();
      ctx.beginPath();
      for (i = 0; i <= 10; i++) {
        x = W * 0.04 + i * W * 0.092;
        ctx.moveTo(x, H * 0.30); ctx.lineTo(x, H * 0.44);
        ctx.moveTo(x, H * 0.62); ctx.lineTo(x, H * 0.76);
      }
      ctx.stroke();
      // A worn centre line down the driving lane.
      ctx.strokeStyle = rgba(LINE_FADED, a4(0.30));
      ctx.setLineDash([W * 0.05, W * 0.04]);
      ctx.beginPath();
      ctx.moveTo(0, H * 0.53); ctx.lineTo(W, H * 0.53);
      ctx.stroke();
      ctx.setLineDash([]);
      // Manhole and drain grate.
      ctx.fillStyle = rgba(ASPHALT_DARK, a4(0.8));
      circle(W * 0.82, H * 0.86, W * 0.022);
      ctx.fill();
      ctx.strokeStyle = rgba([40, 42, 44], a4(0.9));
      ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.strokeRect(W * 0.10, H * 0.88, W * 0.07, H * 0.02);
      // Oil stains.
      for (i = 0; i < OIL.length; i++) {
        ctx.fillStyle = rgba([30, 30, 32], a4(OIL[i].a));
        ellipsePath(W * OIL[i].x, H * OIL[i].y, W * OIL[i].rx, H * OIL[i].ry, OIL[i].rot);
        ctx.fill();
      }
    } else if (pairIndex === 1) {
      // Laundromat: pale tiled floor, washers along the top.
      ctx.fillStyle = rgb([185, 192, 184]);
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = rgba([120, 128, 120], a4(0.35));
      ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.beginPath();
      for (i = 0; i <= 10; i++) {
        x = i * W * 0.1;
        ctx.moveTo(x, 0); ctx.lineTo(x, H);
        y = i * H * 0.1;
        ctx.moveTo(0, y); ctx.lineTo(W, y);
      }
      ctx.stroke();
      // A row of six washers along the top wall.
      for (i = 0; i < 6; i++) {
        x = W * 0.03 + i * W * 0.16;
        ctx.fillStyle = rgb([208, 210, 208]);
        ctx.fillRect(x, H * 0.03, W * 0.14, H * 0.13);
        ctx.strokeStyle = rgba([90, 96, 92], a4(0.6));
        ctx.lineWidth = Math.max(1, W * 0.002);
        ctx.strokeRect(x, H * 0.03, W * 0.14, H * 0.13);
        // Round porthole, dark glass.
        ctx.fillStyle = rgb([38, 44, 48]);
        circle(x + W * 0.07, H * 0.095, W * 0.038);
        ctx.fill();
        ctx.strokeStyle = rgba([150, 158, 154], a4(0.9));
        ctx.lineWidth = Math.max(1, W * 0.003);
        circle(x + W * 0.07, H * 0.095, W * 0.038);
        ctx.stroke();
        // One washer mid-cycle, red light on.
        if (i === 3) {
          ctx.fillStyle = rgb([178, 24, 28]);
          circle(x + W * 0.115, H * 0.055, W * 0.006);
          ctx.fill();
        }
      }
      // A folding bench along the right wall, and a floor drain.
      ctx.fillStyle = rgb([168, 156, 138]);
      ctx.fillRect(W * 0.86, H * 0.42, W * 0.11, H * 0.05);
      ctx.fillStyle = rgba([60, 62, 60], a4(0.7));
      circle(W * 0.5, H * 0.88, W * 0.012);
      ctx.fill();
    } else if (pairIndex === 2) {
      // Rooftop: membrane, parapet border, vents, skylight.
      ctx.fillStyle = rgb([138, 133, 120]);
      ctx.fillRect(0, 0, W, H);
      // Parapet: a darker band around all four edges.
      ctx.fillStyle = rgb([104, 99, 88]);
      ctx.fillRect(0, 0, W, H * 0.045);
      ctx.fillRect(0, H * 0.955, W, H * 0.045);
      ctx.fillRect(0, 0, W * 0.045, H);
      ctx.fillRect(W * 0.955, 0, W * 0.045, H);
      // Gravel speckle.
      for (i = 0; i < GRAVEL.length; i++) {
        ctx.fillStyle = GRAVEL[i].l ? rgba([170, 165, 150], a4(0.5)) : rgba([96, 91, 80], a4(0.5));
        circle(W * GRAVEL[i].x, H * GRAVEL[i].y, W * GRAVEL[i].r);
        ctx.fill();
      }
      // Two square vents and a skylight, all flat in plan.
      ctx.fillStyle = rgb([88, 92, 94]);
      ctx.fillRect(W * 0.12, H * 0.14, W * 0.09, H * 0.09);
      ctx.fillRect(W * 0.78, H * 0.72, W * 0.09, H * 0.09);
      ctx.strokeStyle = rgba([60, 62, 64], a4(0.8));
      ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.strokeRect(W * 0.12, H * 0.14, W * 0.09, H * 0.09);
      ctx.strokeRect(W * 0.78, H * 0.72, W * 0.09, H * 0.09);
      ctx.fillStyle = rgb([168, 188, 198]);
      ctx.fillRect(W * 0.72, H * 0.12, W * 0.14, H * 0.10);
      ctx.strokeStyle = rgba([90, 98, 102], a4(0.8));
      ctx.strokeRect(W * 0.72, H * 0.12, W * 0.14, H * 0.10);
      // A seam line across the membrane.
      ctx.strokeStyle = rgba([96, 91, 80], a4(0.5));
      ctx.beginPath();
      ctx.moveTo(0, H * 0.55); ctx.lineTo(W, H * 0.55);
      ctx.stroke();
    } else if (pairIndex === 3) {
      // Bus stop: sidewalk slabs, shelter, road along the bottom.
      ctx.fillStyle = rgb([154, 147, 138]);
      ctx.fillRect(0, 0, W, H * 0.68);
      ctx.strokeStyle = rgba([110, 104, 96], a4(0.5));
      ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.beginPath();
      for (i = 0; i <= 6; i++) {
        x = i * W * 0.166;
        ctx.moveTo(x, 0); ctx.lineTo(x, H * 0.68);
      }
      for (i = 0; i <= 4; i++) {
        y = i * H * 0.17;
        ctx.moveTo(0, y); ctx.lineTo(W, y);
      }
      ctx.stroke();
      // Shelter: flat glass roof on two posts, a bench under it.
      ctx.fillStyle = rgba([70, 84, 92], a4(0.55));
      ctx.fillRect(W * 0.18, H * 0.10, W * 0.34, H * 0.09);
      ctx.fillStyle = rgb([60, 62, 64]);
      ctx.fillRect(W * 0.20, H * 0.10, W * 0.012, H * 0.16);
      ctx.fillRect(W * 0.49, H * 0.10, W * 0.012, H * 0.16);
      ctx.fillStyle = rgb([120, 110, 96]);
      ctx.fillRect(W * 0.22, H * 0.24, W * 0.26, H * 0.035);
      // Sign pole with a small square sign.
      ctx.fillStyle = rgb([52, 54, 56]);
      ctx.fillRect(W * 0.78, H * 0.16, W * 0.008, H * 0.14);
      ctx.fillStyle = rgb([30, 90, 140]);
      ctx.fillRect(W * 0.755, H * 0.10, W * 0.06, H * 0.06);
      // Road along the bottom, with a dashed centre line.
      ctx.fillStyle = rgb([85, 88, 92]);
      ctx.fillRect(0, H * 0.68, W, H * 0.32);
      ctx.strokeStyle = rgba(LINE_FADED, a4(0.55));
      ctx.lineWidth = Math.max(1.5, W * 0.004);
      ctx.setLineDash([W * 0.06, W * 0.05]);
      ctx.beginPath();
      ctx.moveTo(0, H * 0.84); ctx.lineTo(W, H * 0.84);
      ctx.stroke();
      ctx.setLineDash([]);
      // Kerb line where sidewalk meets road.
      ctx.fillStyle = rgba([200, 196, 188], a4(0.7));
      ctx.fillRect(0, H * 0.675, W, H * 0.008);
    } else if (pairIndex === 4) {
      // Wheat field: gold ground, stalk strokes, a dirt track.
      ctx.fillStyle = rgb([201, 164, 74]);
      ctx.fillRect(0, 0, W, H);
      // A dirt track running diagonally, lighter and bare.
      ctx.fillStyle = rgb([178, 142, 92]);
      ctx.beginPath();
      ctx.moveTo(W * 0.62, 0);
      ctx.lineTo(W * 0.78, 0);
      ctx.lineTo(W * 0.30, H);
      ctx.lineTo(W * 0.14, H);
      ctx.closePath();
      ctx.fill();
      // Stalk strokes: short leaning lines, two shades.
      ctx.lineWidth = Math.max(1, W * 0.0016);
      for (i = 0; i < WHEAT.length; i++) {
        ctx.strokeStyle = WHEAT[i].dark ? rgba([150, 116, 44], a4(0.55)) : rgba([226, 190, 104], a4(0.55));
        ctx.beginPath();
        ctx.moveTo(W * WHEAT[i].x, H * WHEAT[i].y);
        ctx.lineTo(W * (WHEAT[i].x + WHEAT[i].lean), H * (WHEAT[i].y - WHEAT[i].len));
        ctx.stroke();
      }
    } else {
      // Beach: sand, water along the right edge, foam line.
      ctx.fillStyle = rgb([217, 192, 138]);
      ctx.fillRect(0, 0, W, H);
      // Water band on the right, with a pale foam edge.
      ctx.fillStyle = rgb([95, 143, 168]);
      ctx.fillRect(W * 0.82, 0, W * 0.18, H);
      ctx.fillStyle = rgba([235, 240, 238], a4(0.75));
      ctx.fillRect(W * 0.805, 0, W * 0.015, H);
      // A striped towel, flat in plan.
      ctx.fillStyle = rgb([196, 84, 60]);
      ctx.fillRect(W * 0.16, H * 0.70, W * 0.20, H * 0.10);
      ctx.fillStyle = rgb([240, 232, 214]);
      ctx.fillRect(W * 0.16, H * 0.733, W * 0.20, H * 0.012);
      ctx.fillRect(W * 0.16, H * 0.767, W * 0.20, H * 0.012);
      // Footprints wandering down toward the water.
      ctx.fillStyle = rgba([178, 150, 100], a4(0.8));
      for (i = 0; i < FEET.length; i++) {
        ellipsePath(W * (FEET[i].x + FEET[i].side * 0.008), H * FEET[i].y, W * 0.006, H * 0.011, 0);
        ctx.fill();
      }
    }
  }

  // ---- Objects: overhead glyphs, one per pairing ------------------
  // Each object draws its own shadow silhouette first (flat dark
  // shape, offset along the sun vector), then the object itself.
  function drawObject(t) {
    var cx = W * L.objX, cy = H * L.objY, s = W * L.objS;
    var sv = shadowVec(t);
    var dx = sv.dx * s, dy = sv.dy * s;

    function shadowFill(a) {
      ctx.fillStyle = rgba(SHADOW, a4(a));
    }

    if (pairIndex === 0) {
      // Gaming chair, seen from above: backrest, seat, armrests,
      // five-star base peeking out below the seat.
      shadowFill(0.30);
      rr(cx - s * 0.34 + dx, cy - s * 0.52 + dy, s * 0.68, s * 1.04, s * 0.10);
      ctx.fill();
      shadowFill(0.08);
      rr(cx - s * 0.34 + dx * 1.20, cy - s * 0.52 + dy * 1.20, s * 0.68, s * 1.04, s * 0.10);
      ctx.fill();
      // Five-star base spokes, dark steel, under the seat.
      ctx.strokeStyle = rgb([52, 52, 56]);
      ctx.lineWidth = Math.max(1.5, s * 0.05);
      var k;
      for (k = 0; k < 5; k++) {
        var a = -Math.PI / 2 + k * (Math.PI * 2 / 5);
        ctx.beginPath();
        ctx.moveTo(cx, cy + s * 0.18);
        ctx.lineTo(cx + Math.cos(a) * s * 0.42, cy + s * 0.18 + Math.sin(a) * s * 0.42);
        ctx.stroke();
      }
      // Seat.
      ctx.fillStyle = rgb(CHAIR_BLACK);
      rr(cx - s * 0.30, cy - s * 0.10, s * 0.60, s * 0.52, s * 0.08);
      ctx.fill();
      // Red piping around the seat edge.
      ctx.strokeStyle = rgb(CHAIR_RED);
      ctx.lineWidth = Math.max(1.5, s * 0.035);
      rr(cx - s * 0.30, cy - s * 0.10, s * 0.60, s * 0.52, s * 0.08);
      ctx.stroke();
      // Backrest above the seat, with a red centre stripe.
      ctx.fillStyle = rgb(CHAIR_BLACK);
      rr(cx - s * 0.34, cy - s * 0.52, s * 0.68, s * 0.40, s * 0.08);
      ctx.fill();
      ctx.fillStyle = rgb(CHAIR_RED);
      ctx.fillRect(cx - s * 0.05, cy - s * 0.52, s * 0.10, s * 0.40);
      // Headrest pillow.
      ctx.fillStyle = rgb([36, 36, 40]);
      rr(cx - s * 0.16, cy - s * 0.50, s * 0.32, s * 0.12, s * 0.05);
      ctx.fill();
      // Armrests, thin rails at the seat sides.
      ctx.fillStyle = rgb([40, 40, 44]);
      ctx.fillRect(cx - s * 0.40, cy - s * 0.06, s * 0.07, s * 0.40);
      ctx.fillRect(cx + s * 0.33, cy - s * 0.06, s * 0.07, s * 0.40);
    } else if (pairIndex === 1) {
      // Armchair in a laundromat: rounded body, two cushions,
      // armrests, a backrest band.
      shadowFill(0.30);
      rr(cx - s * 0.42 + dx, cy - s * 0.46 + dy, s * 0.84, s * 0.92, s * 0.14);
      ctx.fill();
      shadowFill(0.08);
      rr(cx - s * 0.42 + dx * 1.20, cy - s * 0.46 + dy * 1.20, s * 0.84, s * 0.92, s * 0.14);
      ctx.fill();
      // A faded mat under the chair.
      ctx.fillStyle = rgba([150, 138, 122], a4(0.8));
      rr(cx - s * 0.52, cy - s * 0.56, s * 1.04, s * 1.12, s * 0.06);
      ctx.fill();
      // Body.
      ctx.fillStyle = rgb([122, 74, 58]);
      rr(cx - s * 0.42, cy - s * 0.46, s * 0.84, s * 0.92, s * 0.14);
      ctx.fill();
      // Backrest band at the top.
      ctx.fillStyle = rgb([104, 62, 48]);
      rr(cx - s * 0.42, cy - s * 0.46, s * 0.84, s * 0.26, s * 0.12);
      ctx.fill();
      // Two cushion seams.
      ctx.strokeStyle = rgba([70, 40, 30], a4(0.9));
      ctx.lineWidth = Math.max(1, s * 0.03);
      ctx.beginPath();
      ctx.moveTo(cx, cy - s * 0.18); ctx.lineTo(cx, cy + s * 0.42);
      ctx.moveTo(cx - s * 0.30, cy + s * 0.12); ctx.lineTo(cx + s * 0.30, cy + s * 0.12);
      ctx.stroke();
      // Armrests, lighter rolls at the sides.
      ctx.fillStyle = rgb([138, 88, 68]);
      rr(cx - s * 0.52, cy - s * 0.30, s * 0.12, s * 0.66, s * 0.06);
      ctx.fill();
      rr(cx + s * 0.40, cy - s * 0.30, s * 0.12, s * 0.66, s * 0.06);
      ctx.fill();
    } else if (pairIndex === 2) {
      // Bathtub on a rooftop: white tub, grey water line, taps.
      shadowFill(0.30);
      rr(cx - s * 0.30 + dx, cy - s * 0.55 + dy, s * 0.60, s * 1.10, s * 0.16);
      ctx.fill();
      shadowFill(0.08);
      rr(cx - s * 0.30 + dx * 1.20, cy - s * 0.55 + dy * 1.20, s * 0.60, s * 1.10, s * 0.16);
      ctx.fill();
      // Outer shell.
      ctx.fillStyle = rgb([232, 230, 224]);
      rr(cx - s * 0.30, cy - s * 0.55, s * 0.60, s * 1.10, s * 0.16);
      ctx.fill();
      ctx.strokeStyle = rgba([150, 152, 148], a4(0.8));
      ctx.lineWidth = Math.max(1, s * 0.02);
      rr(cx - s * 0.30, cy - s * 0.55, s * 0.60, s * 1.10, s * 0.16);
      ctx.stroke();
      // Inner basin, pale blue-grey.
      ctx.fillStyle = rgb([185, 196, 196]);
      rr(cx - s * 0.22, cy - s * 0.45, s * 0.44, s * 0.90, s * 0.12);
      ctx.fill();
      // Water line.
      ctx.strokeStyle = rgba([120, 140, 148], a4(0.8));
      ctx.lineWidth = Math.max(1, s * 0.02);
      rr(cx - s * 0.22, cy - s * 0.45, s * 0.44, s * 0.90, s * 0.12);
      ctx.stroke();
      // Taps at the far end: a spout and two knobs.
      ctx.fillStyle = rgb([120, 124, 126]);
      ctx.fillRect(cx - s * 0.02, cy - s * 0.62, s * 0.04, s * 0.10);
      circle(cx - s * 0.14, cy - s * 0.56, s * 0.045);
      ctx.fill();
      circle(cx + s * 0.14, cy - s * 0.56, s * 0.045);
      ctx.fill();
      // Four feet.
      ctx.fillStyle = rgb([90, 90, 92]);
      circle(cx - s * 0.24, cy - s * 0.48, s * 0.03); ctx.fill();
      circle(cx + s * 0.24, cy - s * 0.48, s * 0.03); ctx.fill();
      circle(cx - s * 0.24, cy + s * 0.48, s * 0.03); ctx.fill();
      circle(cx + s * 0.24, cy + s * 0.48, s * 0.03); ctx.fill();
    } else if (pairIndex === 3) {
      // Grand piano at a bus stop: curved body, lid seam,
      // keyboard strip, three legs, bench.
      shadowFill(0.30);
      ctx.save();
      ctx.translate(cx + dx, cy + dy);
      pianoBodyPath(s);
      ctx.fill();
      ctx.restore();
      shadowFill(0.08);
      ctx.save();
      ctx.translate(cx + dx * 1.20, cy + dy * 1.20);
      pianoBodyPath(s);
      ctx.fill();
      ctx.restore();
      // Body.
      ctx.fillStyle = rgb([23, 23, 26]);
      ctx.save();
      ctx.translate(cx, cy);
      pianoBodyPath(s);
      ctx.fill();
      // Lid seam: an inner curve following the body.
      ctx.strokeStyle = rgba([90, 90, 96], a4(0.9));
      ctx.lineWidth = Math.max(1, s * 0.02);
      ctx.beginPath();
      ctx.moveTo(-s * 0.34, -s * 0.30);
      ctx.bezierCurveTo(s * 0.05, -s * 0.34, s * 0.34, -s * 0.10, s * 0.30, s * 0.28);
      ctx.stroke();
      // Keyboard strip at the bottom edge, white with black ticks.
      ctx.fillStyle = rgb([238, 236, 230]);
      ctx.fillRect(-s * 0.36, s * 0.30, s * 0.72, s * 0.10);
      ctx.fillStyle = rgb([20, 20, 22]);
      var k2;
      for (k2 = 0; k2 < 10; k2++) {
        ctx.fillRect(-s * 0.33 + k2 * s * 0.068, s * 0.30, s * 0.03, s * 0.055);
      }
      ctx.restore();
      // Three legs.
      ctx.fillStyle = rgb([30, 30, 33]);
      circle(cx - s * 0.34, cy - s * 0.30, s * 0.03); ctx.fill();
      circle(cx + s * 0.30, cy + s * 0.26, s * 0.03); ctx.fill();
      circle(cx - s * 0.30, cy + s * 0.38, s * 0.03); ctx.fill();
      // Bench beside it.
      ctx.fillStyle = rgb([40, 36, 32]);
      rr(cx + s * 0.55, cy + s * 0.30, s * 0.34, s * 0.16, s * 0.03);
      ctx.fill();
    } else if (pairIndex === 4) {
      // Office desk in a wheat field: wood top, monitor, keyboard,
      // mug, paper, office chair dot behind.
      shadowFill(0.30);
      rr(cx - s * 0.55 + dx, cy - s * 0.32 + dy, s * 1.10, s * 0.64, s * 0.04);
      ctx.fill();
      shadowFill(0.08);
      rr(cx - s * 0.55 + dx * 1.20, cy - s * 0.32 + dy * 1.20, s * 1.10, s * 0.64, s * 0.04);
      ctx.fill();
      // Office chair, a small dark circle behind the desk.
      ctx.fillStyle = rgb([44, 44, 48]);
      circle(cx, cy - s * 0.48, s * 0.16);
      ctx.fill();
      ctx.strokeStyle = rgba([44, 44, 48], a4(0.9));
      ctx.lineWidth = Math.max(1, s * 0.03);
      ctx.beginPath();
      ctx.moveTo(cx, cy - s * 0.34); ctx.lineTo(cx, cy - s * 0.30);
      ctx.stroke();
      // Desk top.
      ctx.fillStyle = rgb([138, 107, 74]);
      rr(cx - s * 0.55, cy - s * 0.32, s * 1.10, s * 0.64, s * 0.04);
      ctx.fill();
      // Drawer seams on the near edge.
      ctx.strokeStyle = rgba([96, 70, 44], a4(0.9));
      ctx.lineWidth = Math.max(1, s * 0.02);
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.20, cy - s * 0.32); ctx.lineTo(cx - s * 0.20, cy + s * 0.32);
      ctx.moveTo(cx + s * 0.20, cy - s * 0.32); ctx.lineTo(cx + s * 0.20, cy + s * 0.32);
      ctx.stroke();
      // Monitor, dark screen on a stand, at the far edge.
      ctx.fillStyle = rgb([28, 30, 34]);
      rr(cx - s * 0.24, cy - s * 0.30, s * 0.48, s * 0.26, s * 0.02);
      ctx.fill();
      ctx.fillStyle = rgb([52, 54, 58]);
      ctx.fillRect(cx - s * 0.03, cy - s * 0.06, s * 0.06, s * 0.06);
      // Keyboard strip and a white sheet of paper.
      ctx.fillStyle = rgb([60, 62, 66]);
      ctx.fillRect(cx - s * 0.18, cy + s * 0.02, s * 0.36, s * 0.10);
      ctx.fillStyle = rgb([240, 238, 230]);
      ctx.fillRect(cx + s * 0.28, cy + s * 0.08, s * 0.18, s * 0.18);
      // Mug, a small red circle.
      ctx.fillStyle = rgb(CHAIR_RED);
      circle(cx - s * 0.40, cy + s * 0.14, s * 0.05);
      ctx.fill();
    } else {
      // Vending machine on a beach: tall red cabinet, glass front
      // with snack rows, coin slot, brand strip.
      shadowFill(0.30);
      rr(cx - s * 0.30 + dx, cy - s * 0.55 + dy, s * 0.60, s * 1.10, s * 0.05);
      ctx.fill();
      shadowFill(0.08);
      rr(cx - s * 0.30 + dx * 1.20, cy - s * 0.55 + dy * 1.20, s * 0.60, s * 1.10, s * 0.05);
      ctx.fill();
      // Cabinet.
      ctx.fillStyle = rgb([176, 48, 48]);
      rr(cx - s * 0.30, cy - s * 0.55, s * 0.60, s * 1.10, s * 0.05);
      ctx.fill();
      // Dark side edge, for a little depth in plan.
      ctx.fillStyle = rgb([120, 30, 30]);
      ctx.fillRect(cx + s * 0.22, cy - s * 0.55, s * 0.08, s * 1.10);
      // Brand strip at the top.
      ctx.fillStyle = rgb([240, 236, 226]);
      ctx.fillRect(cx - s * 0.24, cy - s * 0.50, s * 0.48, s * 0.10);
      ctx.fillStyle = rgb([176, 48, 48]);
      ctx.fillRect(cx - s * 0.20, cy - s * 0.475, s * 0.40, s * 0.05);
      // Glass front with three rows of snacks.
      ctx.fillStyle = rgb([42, 58, 68]);
      ctx.fillRect(cx - s * 0.24, cy - s * 0.34, s * 0.48, s * 0.62);
      var snackCols = [[214, 160, 40], [60, 140, 90], [190, 80, 60], [90, 120, 180]];
      var r3, c3;
      for (r3 = 0; r3 < 3; r3++) {
        for (c3 = 0; c3 < 4; c3++) {
          ctx.fillStyle = rgb(snackCols[(r3 + c3) % 4]);
          ctx.fillRect(cx - s * 0.21 + c3 * s * 0.115, cy - s * 0.30 + r3 * s * 0.20, s * 0.09, s * 0.13);
        }
      }
      // Coin slot and pickup flap at the bottom.
      ctx.fillStyle = rgb([220, 220, 214]);
      ctx.fillRect(cx - s * 0.24, cy + s * 0.32, s * 0.10, s * 0.03);
      ctx.fillStyle = rgb([30, 32, 34]);
      ctx.fillRect(cx + s * 0.02, cy + s * 0.30, s * 0.20, s * 0.12);
    }
  }

  // Grand piano body path, centred at the origin, in units of s.
  // Straight left edge, curved right side, flat keyboard edge.
  function pianoBodyPath(s) {
    ctx.beginPath();
    ctx.moveTo(-s * 0.36, -s * 0.34);
    ctx.lineTo(s * 0.10, -s * 0.34);
    ctx.bezierCurveTo(s * 0.38, -s * 0.30, s * 0.44, -s * 0.02, s * 0.34, s * 0.30);
    ctx.lineTo(-s * 0.36, s * 0.30);
    ctx.closePath();
  }

  // ---- Heat shimmer: barely visible, drifting with the cycle -----
  function drawShimmer(t) {
    var u = phaseU(t);
    var i, j, x0, y0;
    ctx.strokeStyle = rgba([255, 255, 255], a4(0.05));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    for (i = 0; i < SHIMMER.length; i++) {
      y0 = H * SHIMMER[i].y;
      ctx.beginPath();
      for (j = 0; j <= 24; j++) {
        x0 = (0.10 + 0.80 * j / 24) * W;
        var wob = Math.sin(2 * Math.PI * (j / 24 * 3 + u + SHIMMER[i].ph / (Math.PI * 2))) * H * SHIMMER[i].amp;
        if (j === 0) { ctx.moveTo(x0, y0 + wob); } else { ctx.lineTo(x0, y0 + wob); }
      }
      ctx.stroke();
    }
  }

  // ---- Caption and hint, on dark scrim plates ---------------------
  // The ground changes with each pairing, light sand to dark
  // asphalt, so the text sits on its own plate to stay readable.
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var padX = W * 0.018, padY = L.fsCap * 0.55;
    var capW = W * 0.30, capH = L.fsCap + L.fsDate + padY * 2 + 8;
    ctx.fillStyle = rgba([10, 10, 10], a4(0.45));
    rr(W * 0.04 - padX, H * 0.04 - padY, capW, capH, 6);
    ctx.fill();
    ctx.fillStyle = rgba(CREAM, a4(0.92));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№869 · Chair, Parking Lot', W * 0.04, H * 0.04 + L.fsCap * 0.8);
    ctx.fillStyle = rgba(CREAM, a4(0.62));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 29', W * 0.04, H * 0.04 + L.fsCap + L.fsDate + 8);
    // Hint pill, centred at the bottom.
    var hint = 'Tap for a new pairing.';
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var pillW = hw + L.fsHint * 1.6, pillH = L.fsHint * 2.1;
    ctx.fillStyle = rgba([10, 10, 10], a4(0.45));
    rr(W / 2 - pillW / 2, H - pillH - L.fsHint * 0.7, pillW, pillH, pillH / 2);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CREAM, a4(0.88));
    ctx.fillText(hint, W / 2, H - L.fsHint * 0.7 - pillH / 2 + L.fsHint * 0.38);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawSetting(t);
    drawObject(t);
    drawShimmer(t);
    drawText();
  }

  // Tap cycles the pairing, deterministically, in order, wrapping.
  function onTap() {
    pairIndex = (pairIndex + 1) % 6;
    draw(lastT);
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', onTap);
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece869 exposes the clock, the cycle, the pairing
  // list and the tap cycle.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece869 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      pair: function () { return pairIndex; },
      setPair: function (i) { pairIndex = ((i % 6) + 6) % 6; draw(lastT); },
      tap: function () { onTap(); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 60 s cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
