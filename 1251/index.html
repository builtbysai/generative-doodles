<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>It's Just the TV</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#141210; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
  No.1251 "It's Just the TV" — Jenna Maurice JM4.
  A boxy 90s CRT in a dark living room; on screen, warm video feedback
  drawn as stored-transform iteration (no frame buffer): the domestic
  glyph scene is redrawn inside itself under iterated scale/rotate/shift.
  Drag vertically: recursion depth 2-8. Tap: drop the family photo into
  the feedback. Double-tap: reseed.
*/

// ---------- seeded hashes ----------
var SEED = 1251;
function h1(n){ // deterministic hash -> [0,1)
  var x = Math.sin(n * 127.1 + SEED * 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function h2(a, b){ return h1(a * 57.31 + b * 131.7 + 9.17); }

// ---------- palette ----------
var ROOM   = "#141210";
var FURN   = "#241f19";   // furniture silhouettes, a breath lighter than room
var FURN2  = "#1b1712";
var TVBODY = "#2e2a26";
var TVEDGE = "#454039";
var AMBER  = "#D8A75A";
var MAGENTA= "#A34E8C";
var PHOS   = "#9FB4C0";
var STATIC = "#E8E4D8";
var SEPIA  = "#c9a06a";

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone(){
  try {
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    if (sw < 700) return true;
  } catch(e){}
  return H > W * 1.15;
}
function resize(){
  var vw = (window.visualViewport ? window.visualViewport.width  : window.innerWidth)  || 800;
  var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) || 600;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = vw; H = vh;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + "px";
  canvas.style.height = H + "px";
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
window.addEventListener("resize", resize);

// ---------- interaction state ----------
var T0 = 12;                      // fixed first-frame phase (seconds)
var startStamp = null;            // anchored by rAF timestamps; null in QA renderer
var cycleLen = 50;                // photo auto-drop cycle
var depthTarget = 5, depthShown = 5;
var photoBirths = [];             // absolute times the photo entered the feedback
var dragState = null;
var lastTapT = -10, tapTimer = null;
var lastNow = 0;

function nowSec(){
  // Piece time: anchored at T0 + elapsed since load.
  if (startStamp === null) return T0;
  return T0 + (lastNow - startStamp) / 1000;
}

// seeded automatic photo drop: once per cycle, at a hashed offset
function seededDrop(cycleIdx){ return cycleIdx * cycleLen + 4 + h1(cycleIdx * 3.7 + 1) * 4; }
function photoActiveAt(t){
  // returns {level, alpha} for the most recent photo instance, or null
  var births = photoBirths.slice();
  var ci = Math.floor(t / cycleLen);
  for (var k = ci - 1; k <= ci; k++){ if (k >= 0) births.push(seededDrop(k)); }
  var best = null;
  for (var i = 0; i < births.length; i++){
    var age = t - births[i];
    if (age >= 0 && age < 26 && (best === null || births[i] > best.birth)) best = { birth: births[i], age: age };
  }
  if (!best) return null;
  // born at the innermost level, carried outward as the spiral turns
  var lvl = Math.max(0, Math.round(4 - best.age / 6));
  var a = 0.85 * (1 - best.age / 26);
  return { level: lvl, alpha: Math.max(0, a) };
}

// ---------- shape helpers ----------
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function dot(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
function withAlpha(hex, a){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

// ---------- the domestic glyph scene (drawn in unit space, origin top-left) ----------
// sofa + lamp + window, flat shapes, warm duotone washes supplied by caller.
function drawGlyph(t, level){
  var warm = (level % 2 === 0) ? AMBER : MAGENTA;
  ctx.fillStyle = withAlpha(warm, 0.16); ctx.fillRect(0, 0, 1, 1);
  ctx.fillStyle = withAlpha(PHOS, 0.10); ctx.fillRect(0, 0, 1, 0.42);
  // window, back right
  ctx.fillStyle = withAlpha(PHOS, 0.30); ctx.fillRect(0.60, 0.14, 0.26, 0.34);
  ctx.fillStyle = withAlpha(AMBER, 0.20); ctx.fillRect(0.715, 0.14, 0.03, 0.34);
  ctx.fillRect(0.60, 0.295, 0.26, 0.025);
  // lamp, left: stem + shade + glow disc
  ctx.fillStyle = withAlpha(AMBER, 0.30); dot(0.17, 0.30, 0.075);
  ctx.fillStyle = "rgba(30,24,18,0.85)";
  ctx.beginPath();
  ctx.moveTo(0.115, 0.30); ctx.lineTo(0.225, 0.30); ctx.lineTo(0.20, 0.17); ctx.lineTo(0.14, 0.17);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(0.163, 0.30, 0.014, 0.40);
  ctx.fillRect(0.11, 0.70, 0.12, 0.02);
  // sofa silhouette along the bottom (two humps)
  ctx.fillStyle = "rgba(22,17,12,0.92)";
  ctx.beginPath();
  ctx.moveTo(0.06, 1); ctx.lineTo(0.06, 0.80);
  ctx.arc(0.22, 0.80, 0.16, Math.PI, 0);
  ctx.arc(0.52, 0.78, 0.19, Math.PI, 0);
  ctx.arc(0.80, 0.80, 0.13, Math.PI, 0);
  ctx.lineTo(0.94, 1); ctx.closePath(); ctx.fill();
  ctx.fillRect(0.06, 0.86, 0.88, 0.14);
}

// the family photo: 3 flat figures + a dog, sepia
function drawPhoto(alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = withAlpha(SEPIA, 0.16); ctx.fillRect(0.06, 0.06, 0.88, 0.88);
  ctx.strokeStyle = withAlpha(SEPIA, 0.55); ctx.lineWidth = 0.02; ctx.strokeRect(0.06, 0.06, 0.88, 0.88);
  ctx.fillStyle = "#8a6a42";
  function figure(cx, hgt, wdt){
    dot(cx, 0.30 - hgt * 0.16, wdt * 0.30);
    ctx.beginPath();
    ctx.moveTo(cx - wdt/2, 0.86); ctx.lineTo(cx - wdt*0.32, 0.30);
    ctx.lineTo(cx + wdt*0.32, 0.30); ctx.lineTo(cx + wdt/2, 0.86);
    ctx.closePath(); ctx.fill();
  }
  figure(0.26, 1.00, 0.20);
  figure(0.50, 0.86, 0.18);
  figure(0.70, 0.60, 0.13);
  // dog
  ctx.beginPath(); ctx.ellipse(0.82, 0.76, 0.085, 0.05, 0, 0, 6.2832); ctx.fill();
  dot(0.895, 0.70, 0.038);
  ctx.fillRect(0.755, 0.79, 0.018, 0.08); ctx.fillRect(0.865, 0.79, 0.018, 0.08);
  ctx.restore();
}

// one feedback level: clip to the screen rect, wash, then either the glyph
// scene (shallow) or the nested next screen (deep), plus photo if resident.
function drawLevel(t, level, maxLevel, photo){
  rr(-0.5, -0.5, 1, 1, 0.09);
  ctx.fillStyle = "#0d0c10"; ctx.fill();
  ctx.save();
  rr(-0.5, -0.5, 1, 1, 0.09); ctx.clip();
  // phosphor wash, alternating warm per level
  var warm = (level % 2 === 0) ? AMBER : MAGENTA;
  ctx.fillStyle = withAlpha(warm, 0.12); ctx.fillRect(-0.5, -0.5, 1, 1);
  ctx.fillStyle = withAlpha(PHOS, 0.10); ctx.fillRect(-0.5, -0.5, 1, 0.4);

  if (level >= maxLevel){
    // deepest: the broadcast glyph, full
    ctx.save(); ctx.translate(-0.5, -0.5); drawGlyph(t, level); ctx.restore();
  } else if (level >= 4){
    // deep simplification: screen rect + glow dot over a ghost of the glyph
    ctx.save(); ctx.translate(-0.5, -0.5); ctx.globalAlpha = 0.5; drawGlyph(t, level); ctx.restore();
  }

  if (level < maxLevel){
    // nested screen: iterated scale / rotate / shift
    var ph = t * 0.11 + level * 0.7;
    var rot = Math.sin(ph) * 0.028 + (h2(level, 3) - 0.5) * 0.02;
    var scl = 0.80 + 0.02 * Math.sin(t * 0.07 + level);
    var shx = 0.03 * Math.sin(t * 0.05 + level * 1.3);
    var shy = 0.02 * Math.cos(t * 0.06 + level * 0.9);
    ctx.save();
    ctx.translate(shx, shy); ctx.rotate(rot); ctx.scale(scl, scl);
    drawLevel(t, level + 1, maxLevel, photo);
    ctx.restore();
  }

  // the photo rides the recursion: drawn on top at its resident level and
  // every deeper one, smaller and fainter each time — half-dissolved
  if (photo && level >= photo.level){
    var pa = photo.alpha * Math.pow(0.72, level - photo.level);
    ctx.save(); ctx.translate(-0.33, -0.33); ctx.scale(0.66, 0.66);
    drawPhoto(pa); ctx.restore();
  }

  // soft phosphor double-stroke on the screen edge
  rr(-0.5, -0.5, 1, 1, 0.09);
  ctx.strokeStyle = withAlpha(PHOS, 0.20); ctx.lineWidth = 0.030; ctx.stroke();
  rr(-0.5, -0.5, 1, 1, 0.09);
  ctx.strokeStyle = withAlpha(STATIC, 0.13); ctx.lineWidth = 0.010; ctx.stroke();
  ctx.restore();
}

// ---------- the screen (clipped): feedback + static ----------
function drawScreen(t, sx, sy, sw, sh){
  ctx.save();
  rr(sx, sy, sw, sh, Math.min(sw, sh) * 0.07); ctx.clip();
  ctx.fillStyle = "#0d0c10"; ctx.fillRect(sx, sy, sw, sh);
  var d = Math.max(2, Math.min(8, Math.round(depthShown)));
  ctx.save();
  ctx.translate(sx + sw / 2, sy + sh / 2); ctx.scale(sw, sh);
  drawLevel(t, 0, d - 1, photoActiveAt(t));
  ctx.restore();
  // static sparkle, 8 fps steps, sparse hashed dots
  var step = Math.floor(t * 8);
  ctx.fillStyle = STATIC;
  for (var i = 0; i < 46; i++){
    var px = sx + h2(step, i * 2 + 1) * sw;
    var py = sy + h2(step, i * 2 + 2) * sh;
    ctx.globalAlpha = 0.05 + 0.20 * h2(i, step);
    ctx.fillRect(px, py, 1.6, 1.6);
  }
  ctx.globalAlpha = 1;
  // soft top-light falloff (flat alpha bands, no gradient)
  ctx.fillStyle = "rgba(232,228,216,0.05)"; ctx.fillRect(sx, sy, sw, sh * 0.16);
  ctx.fillStyle = "rgba(0,0,0,0.13)";       ctx.fillRect(sx, sy + sh * 0.86, sw, sh * 0.14);
  ctx.restore();
}

// ---------- the room + TV ----------
function draw(t){
  depthShown += (depthTarget - depthShown) * 0.06;
  var phone = isPhone();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = ROOM; ctx.fillRect(0, 0, W, H);

  var u = Math.min(W, H);
  // wall picture frame, right
  ctx.strokeStyle = FURN; ctx.lineWidth = Math.max(3, u * 0.008);
  var pfw = u * (phone ? 0.16 : 0.20), pfh = pfw * 1.25;
  ctx.strokeRect(W - pfw - u * 0.055, H * 0.13, pfw, pfh);
  ctx.fillStyle = FURN2; ctx.fillRect(W - pfw - u * 0.055, H * 0.13, pfw, pfh);
  // curtains at the edges
  ctx.fillStyle = FURN2;
  var cw = u * 0.045;
  ctx.fillRect(0, 0, cw, H * 0.72); ctx.fillRect(W - cw, 0, cw, H * 0.72);
  ctx.fillStyle = FURN;
  ctx.fillRect(cw * 0.45, 0, cw * 0.3, H * 0.72); ctx.fillRect(W - cw * 0.75, 0, cw * 0.3, H * 0.72);
  // floor lamp, left: pole + shade + faint warm glow disc
  var lx = u * 0.085, lbase = H * 0.86;
  ctx.fillStyle = withAlpha(AMBER, 0.08); dot(lx, H * 0.335, u * 0.052);
  ctx.fillStyle = withAlpha(AMBER, 0.14); dot(lx, H * 0.335, u * 0.030);
  ctx.fillStyle = FURN;
  ctx.fillRect(lx - 1.5, H * 0.36, 3, lbase - H * 0.36);
  ctx.beginPath();
  ctx.moveTo(lx - u * 0.032, H * 0.36); ctx.lineTo(lx + u * 0.032, H * 0.36);
  ctx.lineTo(lx + u * 0.020, H * 0.29); ctx.lineTo(lx - u * 0.020, H * 0.29);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(lx - u * 0.03, lbase, u * 0.06, 4);

  // TV geometry: centered, ~55% of frame height
  var tvH = H * 0.55, tvW = tvH * 1.24;
  if (tvW > W * 0.86){ tvW = W * 0.86; tvH = tvW / 1.24; }
  var tvX = (W - tvW) / 2 + (phone ? 0 : u * 0.02), tvY = H * 0.46 - tvH / 2;
  var sx = tvX + tvW * 0.055, sy = tvY + tvH * 0.09;
  var sw = tvW * 0.70, sh = tvH * 0.82, rad = Math.min(sw, sh) * 0.07;

  // glow the TV throws on the wall (flat alpha discs)
  ctx.fillStyle = withAlpha(AMBER, 0.045); dot(tvX + tvW * 0.40, tvY + tvH * 0.5, tvW * 0.62);
  ctx.fillStyle = withAlpha(MAGENTA, 0.035); dot(tvX + tvW * 0.40, tvY + tvH * 0.5, tvW * 0.45);

  // feet + VCR shelf
  ctx.fillStyle = TVBODY;
  ctx.fillRect(tvX + tvW * 0.12, tvY + tvH, tvW * 0.05, tvH * 0.05);
  ctx.fillRect(tvX + tvW * 0.80, tvY + tvH, tvW * 0.05, tvH * 0.05);
  var vcrY = tvY + tvH * 1.07, vcrH = tvH * 0.13;
  ctx.fillStyle = "#232019"; rr(tvX + tvW * 0.06, vcrY, tvW * 0.86, vcrH, 3); ctx.fill();
  ctx.fillStyle = "rgba(90,200,120,0.85)"; dot(tvX + tvW * 0.155, vcrY + vcrH / 2, Math.max(1.6, u * 0.004));
  ctx.fillStyle = "rgba(232,228,216,0.28)";
  ctx.fillRect(tvX + tvW * 0.30, vcrY + vcrH / 2 - 1, tvW * 0.05, 2);

  // body
  ctx.fillStyle = TVBODY; rr(tvX, tvY, tvW, tvH, tvH * 0.045); ctx.fill();
  ctx.strokeStyle = TVEDGE; ctx.lineWidth = 2; rr(tvX, tvY, tvW, tvH, tvH * 0.045); ctx.stroke();
  // side panel: knobs + speaker grille of dots
  var px = tvX + tvW * 0.845;
  ctx.fillStyle = "#3a352f";
  dot(px, tvY + tvH * 0.20, tvH * 0.052); dot(px, tvY + tvH * 0.36, tvH * 0.052);
  ctx.fillStyle = "#191612";
  dot(px, tvY + tvH * 0.20, tvH * 0.026); dot(px, tvY + tvH * 0.36, tvH * 0.026);
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  for (var gy = 0; gy < 5; gy++) for (var gx = 0; gx < 3; gx++)
    dot(px - tvW * 0.028 + gx * tvW * 0.028, tvY + tvH * (0.56 + gy * 0.075), Math.max(1.2, u * 0.0035));

  // screen bezel shadow, then the feedback itself
  ctx.fillStyle = "#17150f"; rr(sx - 5, sy - 5, sw + 10, sh + 10, rad + 5); ctx.fill();
  drawScreen(t, sx, sy, sw, sh);
  // bezel sheen
  ctx.strokeStyle = "rgba(232,228,216,0.10)"; ctx.lineWidth = 2;
  rr(sx - 5, sy - 5, sw + 10, sh + 10, rad + 5); ctx.stroke();

  // sofa back silhouette across the bottom (viewer-side): low humps only
  ctx.fillStyle = "#0c0a08";
  var sbY = H * 0.915, sbH = H - sbY;
  ctx.fillRect(0, sbY + sbH * 0.35, W, sbH);
  ctx.beginPath(); ctx.ellipse(W * 0.24, sbY + sbH * 0.55, W * 0.20, sbH * 0.62, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W * 0.60, sbY + sbH * 0.48, W * 0.23, sbH * 0.72, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W * 0.93, sbY + sbH * 0.58, W * 0.14, sbH * 0.55, 0, 0, 6.2832); ctx.fill();

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
}

// ---------- interaction ----------
function ptr(e){ return { x: e.clientX, y: e.clientY, t: nowSec() }; }
canvas.addEventListener("pointerdown", function(e){
  dragState = ptr(e); dragState.moved = false;
});
canvas.addEventListener("pointermove", function(e){
  if (!dragState) return;
  var dy = e.clientY - dragState.y;
  if (Math.abs(dy) > 6) dragState.moved = true;
  if (dragState.moved) depthTarget = Math.max(2, Math.min(8, 5 - dy / 60));
});
canvas.addEventListener("pointerup", function(e){
  if (!dragState) return;
  var wasDrag = dragState.moved;
  dragState = null;
  if (wasDrag) return;
  var t = nowSec();
  if (t - lastTapT < 0.35){
    // double-tap: reseed
    SEED = 1251 + Math.floor(h1(t * 13.7) * 9000) + 37;
    photoBirths = [];
    lastTapT = -10;
    if (tapTimer){ clearTimeout(tapTimer); tapTimer = null; }
  } else {
    lastTapT = t;
    // wait a beat to distinguish single from double tap
    tapTimer = setTimeout(function(){ photoBirths.push(nowSec()); tapTimer = null; }, 360);
  }
});

// ---------- run ----------
resize();
draw(T0); // synchronous fixed-phase first frame
function frame(now){
  lastNow = now;
  if (startStamp === null) startStamp = now;
  draw(nowSec());
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
</script>
</body>
</html>
