<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cover Your Ears to Hear</title>
<style>
  html, body { margin: 0; padding: 0; background: #0C0B09; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var WOOD = '#8A6A48';   // table wood
  var WORN = '#B89A68';   // worn-spot pale
  var BONE = '#EDE8DE';   // bone white (rest glow)
  var BG   = '#0C0B09';   // background black
  var BLUE = '#7A8A9A';   // whisper blue (glyphs only)

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- layout ----------
  var W = 0, H = 0, DPR = 1, isPhone = false;
  var tableTopY = 0, slabH = 0, restR = 0;
  var restX = [0, 0], restY = 0;

  function viewSize() {
    var vv = window.visualViewport;
    if (vv && vv.width) return { w: vv.width, h: vv.height };
    return { w: window.innerWidth || 0, h: window.innerHeight || 0 };
  }

  function layout() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var sw = (window.screen && window.screen.width) ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || H > W * 1.15;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    tableTopY = H * (isPhone ? 0.70 : 0.68);
    slabH = Math.max(18, H * 0.038);
    restR = Math.max(13, Math.min(W, H) * 0.030);
    restX[0] = W * (isPhone ? 0.27 : 0.31);
    restX[1] = W * (isPhone ? 0.73 : 0.69);
    restY = tableTopY;
  }

  // ---------- grain (seeded, normalized coords, generated once) ----------
  var grain = [];
  (function () {
    var rnd = mulberry32(85213);
    for (var i = 0; i < 30; i++) {
      grain.push({
        yOff: rnd(),                 // 0..1 across slab thickness
        x0: rnd() * 0.25,
        x1: 0.55 + rnd() * 0.45,
        wob: 0.4 + rnd() * 1.1,      // wobble amplitude in px
        ph: rnd() * Math.PI * 2,
        pale: rnd() < 0.4,           // pale stroke vs dark stroke
        lw: 0.8 + rnd() * 1.1
      });
    }
  })();

  // ---------- interaction state ----------
  // pointers: map id -> { x, y, rest: 0|1|-1 }
  var pointers = {};
  var heldRest = [false, false];       // a pointer is down on each rest
  var listening = false;               // both rests held
  var holds = [];                      // closed intervals {start, end}
  var openHold = null;                 // {start} while listening
  var lean = 0;                        // -1..1, from touch midpoint

  var nowT = 0;                        // piece clock (seconds), driven by rAF

  function setListening(on, t) {
    if (on === listening) return;
    listening = on;
    if (on) {
      openHold = { start: t };
      audioStart();
    } else {
      if (openHold) { openHold.end = t; holds.push(openHold); openHold = null; }
      audioStop();
    }
  }

  function refreshHolds(t) {
    heldRest[0] = false; heldRest[1] = false;
    var mx = 0, n = 0;
    for (var id in pointers) {
      var p = pointers[id];
      if (p.rest === 0 || p.rest === 1) { heldRest[p.rest] = true; }
      mx += p.x; n++;
    }
    if (heldRest[0] && heldRest[1] && n >= 2) {
      lean = Math.max(-1, Math.min(1, ((mx / n) - W / 2) / (W / 2)));
    }
    setListening(heldRest[0] && heldRest[1], t);
  }

  function evPos(e) {
    return { x: e.clientX || 0, y: e.clientY || 0 };
  }

  function nearestRest(x, y) {
    var grab = restR * 3.2;
    var d0 = Math.hypot(x - restX[0], y - restY);
    var d1 = Math.hypot(x - restX[1], y - restY);
    if (d0 <= grab && d0 <= d1) return 0;
    if (d1 <= grab) return 1;
    return -1;
  }

  canvas.addEventListener('pointerdown', function (e) {
    var pos = evPos(e);
    pointers[e.pointerId] = { x: pos.x, y: pos.y, rest: nearestRest(pos.x, pos.y) };
    refreshHolds(nowT);
    draw(nowT);
  });
  window.addEventListener('pointermove', function (e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    var pos = evPos(e);
    p.x = pos.x; p.y = pos.y;
    refreshHolds(nowT);
  });
  function releasePointer(e) {
    if (pointers[e.pointerId]) {
      delete pointers[e.pointerId];
      refreshHolds(nowT);   // losing either rest cuts listening instantly
      draw(nowT);
    }
  }
  window.addEventListener('pointerup', releasePointer);
  window.addEventListener('pointercancel', releasePointer);

  // ---------- audio (lazy, gesture-gated, typeof-guarded) ----------
  var AC = null, master = null, panner = null;
  function audioStart() {
    if (typeof window === 'undefined') return;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (typeof Ctor !== 'function') return;
    try {
      if (!AC) {
        AC = new Ctor();
        master = AC.createGain();
        master.gain.value = 0;
        panner = (typeof AC.createStereoPanner === 'function') ? AC.createStereoPanner() : null;
        var out = panner || AC.createGain();
        if (panner) panner.connect(master); else out.connect(master);
        master.connect(AC.destination);

        var rnd = mulberry32(4177);
        // whisper: looped noise through wandering bandpass formants
        var nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
        var data = nb.getChannelData(0);
        for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        var noise = AC.createBufferSource();
        noise.buffer = nb; noise.loop = true;
        var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900; lp.Q.value = 0.4;
        noise.connect(lp); lp.connect(out);
        var formants = [[520, 9, 0.50], [1150, 11, 0.30], [2350, 13, 0.12]];
        for (var f = 0; f < formants.length; f++) {
          var bp = AC.createBiquadFilter();
          bp.type = 'bandpass'; bp.frequency.value = formants[f][0]; bp.Q.value = formants[f][1];
          var g = AC.createGain(); g.gain.value = formants[f][2];
          lp.connect(bp); bp.connect(g); g.connect(out);
          var lfo = AC.createOscillator();
          lfo.frequency.value = 0.13 + rnd() * 0.35;
          var lg = AC.createGain(); lg.gain.value = formants[f][0] * (0.25 + rnd() * 0.2);
          lfo.connect(lg); lg.connect(bp.frequency); lfo.start();
        }
        noise.start();
        // faint slow violin-ish saw under heavy lowpass
        var saw = AC.createOscillator(); saw.type = 'sawtooth'; saw.frequency.value = 196;
        var slp = AC.createBiquadFilter(); slp.type = 'lowpass'; slp.frequency.value = 640; slp.Q.value = 0.6;
        var sg = AC.createGain(); sg.gain.value = 0.035;
        var bow = AC.createOscillator(); bow.frequency.value = 0.09;
        var bg = AC.createGain(); bg.gain.value = 0.016;
        bow.connect(bg); bg.connect(sg.gain);
        var vib = AC.createOscillator(); vib.frequency.value = 4.6;
        var vg = AC.createGain(); vg.gain.value = 2.2;
        vib.connect(vg); vg.connect(saw.frequency);
        saw.connect(slp); slp.connect(sg); sg.connect(out);
        saw.start(); bow.start(); vib.start();
      }
      if (AC.state === 'suspended' && typeof AC.resume === 'function') AC.resume();
      var t = AC.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(0.38, t, 0.22);          // modest gain up
      if (panner) panner.pan.setTargetAtTime(lean * 0.7, t, 0.1);
    } catch (err) { /* audio unavailable: the piece stays silent */ }
  }
  function audioStop() {
    if (!AC || !master) return;
    try {
      var t = AC.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(0, t, 0.03);             // fast release: the cut is instant
    } catch (err) { /* ignore */ }
  }
  function audioPan() {
    if (!AC || !panner || !listening) return;
    try { panner.pan.setTargetAtTime(lean * 0.7, AC.currentTime, 0.08); } catch (err) { /* ignore */ }
  }

  // ---------- glyph blooms (closed-form in recorded hold intervals and t) ----------
  var CADENCE = 0.8;    // seconds between spawns while held
  var LIFE = 3.4;       // seconds per bloom

  function drawBlooms(t) {
    var intervals = holds.slice();
    if (openHold) intervals.push({ start: openHold.start, end: Infinity });
    var shiftX = lean * W * 0.05;
    ctx.strokeStyle = BLUE;
    ctx.lineCap = 'round';
    for (var iv = 0; iv < intervals.length; iv++) {
      var it = intervals[iv];
      if (t >= it.end) continue;               // ended hold: glyphs are gone, cut mid-bloom
      var kMax = Math.floor((t - it.start) / CADENCE);
      for (var k = 0; k <= kMax; k++) {
        var spawn = it.start + k * CADENCE;
        if (spawn >= it.end) break;
        var age = t - spawn;
        if (age < 0 || age >= LIFE) continue;
        var p = age / LIFE;
        var ox = restX[k % 2] + shiftX;
        var cy = restY - restR * 0.6 - p * H * 0.44;
        var r = restR * (0.8 + p * 3.6);
        var fadeIn = Math.min(1, age / 0.35);
        var a = 0.30 * fadeIn * (1 - p) * (1 - p);
        if (a <= 0.004) continue;
        ctx.globalAlpha = a;
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(ox, cy, r, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = a * 0.65;
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(ox, cy, r * 0.70, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = a * 0.4;
        ctx.beginPath(); ctx.arc(ox, cy, r * 1.32, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- drawing ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // darkness
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // sound glyphs above the table, only while listening
    if (listening || openHold) drawBlooms(t);

    // ---- table in profile ----
    var legW = Math.max(10, W * 0.016);
    var legTop = tableTopY + slabH;
    var legBot = H * 0.985;
    var legX = [W * 0.055, W * 0.945 - legW];
    // legs
    ctx.fillStyle = WOOD;
    ctx.globalAlpha = 0.82;
    ctx.fillRect(legX[0], legTop, legW, legBot - legTop);
    ctx.fillRect(legX[1], legTop, legW, legBot - legTop);
    // apron
    ctx.globalAlpha = 0.9;
    ctx.fillRect(legX[0], legTop, legX[1] + legW - legX[0], H * 0.016);
    ctx.globalAlpha = 1;
    // top slab
    ctx.fillStyle = WOOD;
    ctx.fillRect(0, tableTopY, W, slabH);
    // worn top edge line
    ctx.fillStyle = WORN;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(0, tableTopY, W, Math.max(1.5, slabH * 0.10));
    ctx.globalAlpha = 1;
    // grain strokes
    ctx.lineCap = 'round';
    for (var gi = 0; gi < grain.length; gi++) {
      var g = grain[gi];
      ctx.strokeStyle = g.pale ? WORN : BG;
      ctx.globalAlpha = g.pale ? 0.20 : 0.22;
      ctx.lineWidth = g.lw;
      ctx.beginPath();
      var gx0 = g.x0 * W, gx1 = g.x1 * W, gy = tableTopY + (0.15 + g.yOff * 0.7) * slabH;
      var steps = 14;
      for (var s2 = 0; s2 <= steps; s2++) {
        var fx = gx0 + (gx1 - gx0) * (s2 / steps);
        var fy = gy + Math.sin(g.ph + (s2 / steps) * Math.PI * 2.2) * g.wob;
        if (s2 === 0) ctx.moveTo(fx, fy); else ctx.lineTo(fx, fy);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // ---- worn elbow spots + rests ----
    var pulse = 1 + 0.045 * Math.sin(t * 1.25);
    for (var r = 0; r < 2; r++) {
      var cx = restX[r], cy = restY;
      // worn spot: pale ellipse worn into the slab face
      ctx.fillStyle = WORN;
      ctx.globalAlpha = 0.45;
      ctx.beginPath();
      ctx.ellipse(cx, cy + slabH * 0.30, restR * 2.1, slabH * 0.46, 0, 0, Math.PI * 2);
      ctx.fill();
      // rest glow: layered flat-alpha discs (no shadowBlur, no gradients)
      var held = heldRest[r];
      var boost = held ? 1.5 : (listening ? 1.2 : 1.0);
      var layers = [[3.1, 0.05], [2.3, 0.08], [1.65, 0.13]];
      ctx.fillStyle = BONE;
      for (var li = 0; li < layers.length; li++) {
        ctx.globalAlpha = layers[li][1] * boost * pulse;
        ctx.beginPath();
        ctx.arc(cx, cy, restR * layers[li][0] * pulse, 0, Math.PI * 2);
        ctx.fill();
      }
      // the rest disc itself
      ctx.globalAlpha = held ? 1.0 : 0.88;
      ctx.beginPath();
      ctx.arc(cx, cy, restR * 0.62, 0, Math.PI * 2);
      ctx.fill();
      // inner wear ring on the disc
      ctx.globalAlpha = held ? 0.5 : 0.32;
      ctx.strokeStyle = WORN;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(cx, cy, restR * 0.40, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- boot ----------
  layout();
  draw(0);   // frame one: the instrument waiting, synchronous at t=0

  if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
    window.visualViewport.addEventListener('resize', function () { layout(); draw(nowT); });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { layout(); draw(nowT); });
  }

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var loop = function (ts) {
      if (t0 === null) t0 = ts;
      nowT = (ts - t0) / 1000;
      audioPan();
      draw(nowT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
