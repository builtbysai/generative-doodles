<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№852 The Miniature Bedroom</title>
<style>
  html, body { margin: 0; padding: 0; background: #8a8f96; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №852 The Miniature Bedroom, IA6 / PP1252, study #261 iso-attrill.
  // A dollhouse-scale child's bedroom, visibly handmade: a rumpled
  // tiny bed, a nightstand with a toy alarm clock, 90s toys scattered,
  // a band of small figures that barely fit inside. Palette: muted,
  // near-monochrome greys with one warm practical light, the lamp.
  // The room fills the frame; the camera stays outside looking in.
  // DRAG tilts the room; small objects slide with gravity. The
  // figures shift but never leave. 3D miniature set with simple
  // rigid-body response to tilt; materials read as cardboard and
  // fabric. No photorealism, no true-scale room, no horror.
  // Mechanism M2.
  var GROUND = '#8a8f96'; // page ground, the frame-0 wall colour

  // Fixed-phase first frame: FIRST_T = 12 s into a 72 s cycle.
  // The room sways gently on its own (closed-form tilt); a drag
  // adds tilt that springs back to the loop path on release.
  // Loose toys slide downhill with gravity, each with its own lag;
  // the figures shift a little and never leave. All motion is
  // closed-form or spring-integrated from the virtual clock, so
  // frame one is deterministic.
  var FIRST_T = 12;
  var CYCLE = 72;
  var SEED = 852;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // ---- Palette: muted near-monochrome, one warm light -------------
  var WALL = [138, 143, 152];
  var WALL_DARK = [112, 117, 128];
  var WALL_PALE = [158, 163, 170];
  var SKIRT = [96, 100, 110];
  var FLOOR = [126, 106, 82];
  var FLOOR_DARK = [104, 86, 64];
  var FLOOR_LINE = [92, 76, 56];
  var RUG = [152, 130, 112];
  var RUG_EDGE = [132, 110, 94];
  var RUG_IN = [168, 146, 126];
  var BED_WOOD = [96, 82, 70];
  var BED_WOOD_D = [78, 66, 56];
  var BLANKET = [172, 162, 150];
  var BLANKET_D = [148, 138, 126];
  var SHEET = [196, 190, 178];
  var PILLOW = [204, 198, 186];
  var STAND = [110, 94, 78];
  var STAND_D = [92, 78, 64];
  var LAMP_SHADE = [238, 214, 160];
  var LAMP_GLOW = [247, 196, 110];
  var LAMP_CORE = [252, 224, 150];
  var CLOCK_FACE = [232, 226, 210];
  var CLOCK_RED = [168, 84, 66];
  var CLOCK_DARK = [52, 48, 44];
  var NIGHT = [58, 66, 88];
  var NIGHT_D = [44, 52, 72];
  var MOON = [226, 222, 200];
  var STAR = [214, 210, 192];
  var FRAME_WOOD = [104, 88, 70];
  var CARDBOARD = [178, 162, 138];
  var CARDBOARD_D = [156, 140, 116];
  var INK = [58, 54, 50];
  var BALL = [178, 96, 82];
  var BALL_D = [150, 76, 64];
  var CAR_BODY = [120, 128, 138];
  var CAR_TOP = [150, 138, 110];
  var DOLL_SKIN = [214, 182, 158];
  var DOLL_DRESS = [158, 120, 118];
  var BLOCK_R = [172, 104, 88];
  var BLOCK_B = [104, 122, 148];
  var BLOCK_G = [118, 138, 112];
  var BLOCK_Y = [198, 172, 110];
  var MOBILE_STAR = [214, 196, 150];
  var MOBILE_MOON = [190, 186, 168];
  var STRING = [70, 66, 60];
  var SHADOW = [40, 38, 44];

  // ---- Wallpaper dots: fixed table from a fixed seed ----------------
  var dotRng = mulberry32(SEED * 7 + 3);
  var DOTS = [];
  var di;
  for (di = 0; di < 60; di++) {
    DOTS.push({ x: dotRng(), y: dotRng(), r: 0.0016 + dotRng() * 0.0022 });
  }

  // ---- The band of small figures: fixed authored table -------------
  // Five peg figures that barely fit along the back wall. Each has a
  // body colour, a head colour, a height and a lean; they shift a
  // little with the tilt and never leave the wall.
  var FIGURES = [
    { x: 0.585, h: 0.105, lean: -0.06, body: [150, 96, 84],  head: [214, 182, 158], hat: 1 },
    { x: 0.645, h: 0.118, lean: 0.04,  body: [104, 122, 148], head: [196, 168, 142], hat: 0 },
    { x: 0.710, h: 0.098, lean: -0.03, body: [118, 138, 112], head: [222, 192, 166], hat: 1 },
    { x: 0.770, h: 0.112, lean: 0.07,  body: [158, 120, 118], head: [206, 176, 150], hat: 0 },
    { x: 0.830, h: 0.102, lean: -0.05, body: [138, 128, 150], head: [214, 184, 160], hat: 1 }
  ];

  // ---- Loose toys that slide with gravity --------------------------
  // rest x/y in stage fractions (floor plane); slideK is how far the
  // toy travels per unit of tilt; lag is its spring rate (heavier
  // toys lag more); bounds clamp the slide so nothing leaves the room.
  var TOYS = [
    { kind: 'ball',   x: 0.300, y: 0.790, r: 0.030, slideK: 1.00, lag: 3.2, ox: 0, oy: 0, spin: 0 },
    { kind: 'car',    x: 0.660, y: 0.745, r: 0.032, slideK: 0.85, lag: 2.6, ox: 0, oy: 0, spin: 0 },
    { kind: 'block',  x: 0.520, y: 0.820, r: 0.020, slideK: 0.70, lag: 4.5, ox: 0, oy: 0, spin: 0, col: BLOCK_R, letter: 'A' },
    { kind: 'block',  x: 0.565, y: 0.845, r: 0.020, slideK: 0.70, lag: 5.0, ox: 0, oy: 0, spin: 0, col: BLOCK_B, letter: 'B' },
    { kind: 'block',  x: 0.480, y: 0.855, r: 0.020, slideK: 0.70, lag: 4.0, ox: 0, oy: 0, spin: 0, col: BLOCK_G, letter: 'C' },
    { kind: 'doll',   x: 0.400, y: 0.860, r: 0.028, slideK: 0.60, lag: 3.8, ox: 0, oy: 0, spin: 0 }
  ];

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.fsLetter = Math.round(clamp(W * 0.018, 10, 14));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Tilt state ----------------------------------------------------
  // Loop tilt is closed-form: a slow 72 s sway, zero at FIRST_T.
  // Drag adds a target tilt; the current tilt springs toward the
  // target, and on release the target returns to the loop tilt.
  var tilt = { roll: 0, pitch: 0 };       // current tilt, radians
  var tiltTarget = { roll: 0, pitch: 0 }; // spring target
  var dragging = false;
  var dragStart = { x: 0, y: 0 };
  var dragBase = { roll: 0, pitch: 0 };
  var stateInit = false;

  function loopTilt(t) {
    var ph = 2 * Math.PI * (t - FIRST_T) / CYCLE;
    return {
      roll: 0.016 * Math.sin(ph),
      pitch: 0.011 * Math.sin(ph + 1.3)
    };
  }

  function slideTarget(toy, tiltV) {
    // Downhill slide: roll pushes toys sideways, pitch pushes them
    // toward or away from the viewer (down the floor plane).
    var tx = toy.slideK * tiltV.roll * W * 0.9;
    var ty = toy.slideK * tiltV.pitch * H * 1.1;
    var maxX = W * 0.055, maxY = H * 0.035;
    return { x: clamp(tx, -maxX, maxX), y: clamp(ty, -maxY, maxY) };
  }

  function stepPhysics(t, dt) {
    var lt = loopTilt(t);
    if (!dragging) { tiltTarget.roll = lt.roll; tiltTarget.pitch = lt.pitch; }
    var k = 1 - Math.exp(-dt * 6);
    tilt.roll += (tiltTarget.roll - tilt.roll) * k;
    tilt.pitch += (tiltTarget.pitch - tilt.pitch) * k;
    var i, toy, st, kt;
    for (i = 0; i < TOYS.length; i++) {
      toy = TOYS[i];
      st = slideTarget(toy, tilt);
      kt = 1 - Math.exp(-dt * toy.lag);
      toy.ox += (st.x - toy.ox) * kt;
      toy.oy += (st.y - toy.oy) * kt;
      toy.spin = toy.ox * 0.9; // the ball and car rotate as they roll
    }
  }

  function snapPhysics(t) {
    var lt = loopTilt(t);
    tilt.roll = lt.roll; tilt.pitch = lt.pitch;
    tiltTarget.roll = lt.roll; tiltTarget.pitch = lt.pitch;
    var i, toy, st;
    for (i = 0; i < TOYS.length; i++) {
      toy = TOYS[i];
      st = slideTarget(toy, tilt);
      toy.ox = st.x; toy.oy = st.y; toy.spin = toy.ox * 0.9;
    }
    stateInit = true;
  }

  // ---- Room geometry (stage fractions) -------------------------------
  var WALL_TOP = 0.055;
  var WALL_BOT = 0.660; // back wall meets the floor here
  var FLOOR_BOT = 0.940;
  function X(f) { return f * W; }
  function Y(f) { return f * H; }

  function drawWall(t) {
    // Back wall, muted grey-blue with a faint dot wallpaper.
    ctx.fillStyle = rgb(WALL);
    ctx.fillRect(0, Y(WALL_TOP), W, Y(WALL_BOT) - Y(WALL_TOP));
    var i, d;
    ctx.fillStyle = rgba(WALL_PALE, a4(0.35));
    for (i = 0; i < DOTS.length; i++) {
      d = DOTS[i];
      ctx.beginPath();
      ctx.moveTo(X(d.x) + d.r * W, Y(WALL_TOP + d.y * (WALL_BOT - WALL_TOP)));
      ctx.arc(X(d.x), Y(WALL_TOP + d.y * (WALL_BOT - WALL_TOP)), d.r * W, 0, Math.PI * 2);
      ctx.fill();
    }
    // Skirting board along the base of the wall.
    ctx.fillStyle = rgb(SKIRT);
    ctx.fillRect(0, Y(WALL_BOT) - H * 0.022, W, H * 0.022);
    ctx.fillStyle = rgba(WALL_DARK, a4(0.5));
    ctx.fillRect(0, Y(WALL_BOT) - H * 0.004, W, H * 0.004);
  }

  function drawWindow() {
    // Small window, right of the bed: night sky, a moon, two stars.
    var wx0 = X(0.640), wx1 = X(0.880);
    var wy0 = Y(0.140), wy1 = Y(0.430);
    var ww = wx1 - wx0, wh = wy1 - wy0;
    ctx.fillStyle = rgb(FRAME_WOOD);
    ctx.fillRect(wx0 - W * 0.008, wy0 - H * 0.008, ww + W * 0.016, wh + H * 0.016);
    ctx.fillStyle = rgb(NIGHT);
    ctx.fillRect(wx0, wy0, ww, wh);
    ctx.fillStyle = rgba(NIGHT_D, a4(0.6));
    ctx.fillRect(wx0, wy0 + wh * 0.62, ww, wh * 0.38);
    // Moon, low in the left pane, clear of the hanging mobile star.
    ctx.fillStyle = rgb(MOON);
    ctx.beginPath();
    ctx.moveTo(wx0 + ww * 0.28 + ww * 0.09, wy0 + wh * 0.58);
    ctx.arc(wx0 + ww * 0.28, wy0 + wh * 0.58, ww * 0.09, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(STAR);
    var sx, sy;
    var stars = [[0.18, 0.22], [0.45, 0.30], [0.82, 0.62], [0.25, 0.78]];
    var si;
    for (si = 0; si < stars.length; si++) {
      sx = wx0 + ww * stars[si][0]; sy = wy0 + wh * stars[si][1];
      ctx.beginPath();
      ctx.moveTo(sx + W * 0.003, sy);
      ctx.arc(sx, sy, W * 0.003, 0, Math.PI * 2);
      ctx.fill();
    }
    // Cross frame and a cardboard sill.
    ctx.fillStyle = rgb(FRAME_WOOD);
    ctx.fillRect(wx0 + ww / 2 - W * 0.004, wy0, W * 0.008, wh);
    ctx.fillRect(wx0, wy0 + wh / 2 - H * 0.004, ww, H * 0.008);
    ctx.fillStyle = rgb(CARDBOARD);
    ctx.fillRect(wx0 - W * 0.014, wy1, ww + W * 0.028, H * 0.014);
  }

  function drawBunting() {
    // A string of handmade paper flags across the top of the wall.
    var y0 = Y(0.085), y1 = Y(0.115);
    ctx.strokeStyle = rgba(STRING, a4(0.8));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(X(0.06), y0);
    ctx.quadraticCurveTo(X(0.50), Y(0.135), X(0.94), y0);
    ctx.stroke();
    var cols = [BLOCK_R, BLOCK_B, BLOCK_G, BLOCK_Y, [150, 120, 118]];
    var i, fx, fy, fw = W * 0.022;
    for (i = 0; i < 9; i++) {
      fx = X(0.10 + i * 0.10);
      fy = y0 + (Y(0.135) - y0) * Math.sin(Math.PI * (0.10 + i * 0.10));
      ctx.fillStyle = rgb(cols[i % cols.length]);
      ctx.beginPath();
      ctx.moveTo(fx - fw / 2, fy);
      ctx.lineTo(fx + fw / 2, fy);
      ctx.lineTo(fx, fy + H * 0.028);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawPoster() {
    // A cardboard poster, taped to the wall: a hand-drawn rocket.
    var px0 = X(0.470), px1 = X(0.585);
    var py0 = Y(0.170), py1 = Y(0.360);
    var pw = px1 - px0, ph = py1 - py0;
    ctx.fillStyle = rgb(CARDBOARD);
    ctx.fillRect(px0, py0, pw, ph);
    ctx.fillStyle = rgba(CARDBOARD_D, a4(0.7));
    ctx.fillRect(px0, py0 + ph * 0.86, pw, ph * 0.14);
    // Tape corners.
    ctx.fillStyle = rgba([232, 226, 210], a4(0.75));
    ctx.fillRect(px0 - W * 0.004, py0 - H * 0.004, W * 0.020, H * 0.012);
    ctx.fillRect(px1 - W * 0.016, py0 - H * 0.004, W * 0.020, H * 0.012);
    // Rocket: body, fins, window, flame.
    var cx = px0 + pw * 0.5, cy = py0 + ph * 0.46;
    var rw = pw * 0.20, rh = ph * 0.34;
    ctx.fillStyle = rgb([196, 190, 178]);
    ctx.beginPath();
    ctx.moveTo(cx - rw / 2, cy + rh / 2);
    ctx.lineTo(cx - rw / 2, cy - rh * 0.1);
    ctx.quadraticCurveTo(cx - rw / 2, cy - rh / 2, cx, cy - rh / 2);
    ctx.quadraticCurveTo(cx + rw / 2, cy - rh / 2, cx + rw / 2, cy - rh * 0.1);
    ctx.lineTo(cx + rw / 2, cy + rh / 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb(CLOCK_RED);
    ctx.beginPath();
    ctx.moveTo(cx - rw / 2, cy + rh * 0.1);
    ctx.lineTo(cx - rw * 0.95, cy + rh * 0.55);
    ctx.lineTo(cx - rw / 2, cy + rh * 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + rw / 2, cy + rh * 0.1);
    ctx.lineTo(cx + rw * 0.95, cy + rh * 0.55);
    ctx.lineTo(cx + rw / 2, cy + rh * 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb(BLOCK_B);
    ctx.beginPath();
    ctx.moveTo(cx + rw * 0.22, cy - rh * 0.12);
    ctx.arc(cx, cy - rh * 0.12, rw * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(LAMP_GLOW);
    ctx.beginPath();
    ctx.moveTo(cx - rw * 0.3, cy + rh / 2);
    ctx.lineTo(cx + rw * 0.3, cy + rh / 2);
    ctx.lineTo(cx, cy + rh * 0.95);
    ctx.closePath();
    ctx.fill();
    // Hand-lettered caption under the rocket.
    ctx.fillStyle = rgb(INK);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '700 ' + Math.round(clamp(W * 0.016, 9, 12)) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('TO THE MOON', cx, py0 + ph * 0.80);
    ctx.textAlign = 'left';
  }

  function drawFloor() {
    // Wood floor: a trapezoid widening toward the viewer, plank lines
    // converging gently, a darker front edge.
    ctx.fillStyle = rgb(FLOOR);
    ctx.beginPath();
    ctx.moveTo(X(0.075), Y(WALL_BOT));
    ctx.lineTo(X(0.925), Y(WALL_BOT));
    ctx.lineTo(X(1.0), Y(FLOOR_BOT));
    ctx.lineTo(X(0.0), Y(FLOOR_BOT));
    ctx.closePath();
    ctx.fill();
    // Plank seams, fanning from the back wall to the front edge.
    ctx.strokeStyle = rgba(FLOOR_LINE, a4(0.55));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    var i, fx0, fx1;
    for (i = 1; i < 8; i++) {
      fx0 = X(0.075 + i * 0.10625);
      fx1 = X(i * 0.125);
      ctx.beginPath();
      ctx.moveTo(fx0, Y(WALL_BOT));
      ctx.lineTo(fx1, Y(FLOOR_BOT));
      ctx.stroke();
    }
    // A cross seam across the floor, two thirds down.
    ctx.beginPath();
    ctx.moveTo(X(0.035), Y(0.815));
    ctx.lineTo(X(0.965), Y(0.815));
    ctx.stroke();
    ctx.fillStyle = rgba(FLOOR_DARK, a4(0.5));
    ctx.fillRect(0, Y(FLOOR_BOT) - H * 0.010, W, H * 0.010);
  }

  function drawRug() {
    // Oval rag rug, centre floor, in muted rose-grey rings.
    var cx = X(0.50), cy = Y(0.800);
    var rx = W * 0.235, ry = H * 0.075;
    ctx.fillStyle = rgb(RUG_EDGE);
    ctx.beginPath();
    ctx.moveTo(cx + rx, cy);
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(RUG);
    ctx.beginPath();
    ctx.moveTo(cx + rx * 0.82, cy);
    ctx.ellipse(cx, cy, rx * 0.82, ry * 0.78, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(RUG_IN);
    ctx.beginPath();
    ctx.moveTo(cx + rx * 0.55, cy);
    ctx.ellipse(cx, cy, rx * 0.55, ry * 0.52, 0, 0, Math.PI * 2);
    ctx.fill();
    // Rag stitching: short dashes around the middle ring.
    ctx.strokeStyle = rgba(RUG_EDGE, a4(0.7));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    var i, a;
    for (i = 0; i < 24; i++) {
      a = i / 24 * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * rx * 0.68, cy + Math.sin(a) * ry * 0.64);
      ctx.lineTo(cx + Math.cos(a) * rx * 0.72, cy + Math.sin(a) * ry * 0.68);
      ctx.stroke();
    }
  }

  function drawBed() {
    // The tiny bed, left: wooden frame, rumpled blanket, pillow.
    var bx0 = X(0.095), bx1 = X(0.430);
    var baseY = Y(0.640);
    var bw = bx1 - bx0;
    var headH = H * 0.270;
    var bedH = H * 0.085;
    // Headboard: two posts and a slatted top.
    ctx.fillStyle = rgb(BED_WOOD);
    ctx.fillRect(bx0, baseY - headH, Math.max(2, W * 0.008), headH);
    ctx.fillRect(bx1 - Math.max(2, W * 0.008), baseY - headH, Math.max(2, W * 0.008), headH);
    ctx.fillRect(bx0, baseY - headH, bw, Math.max(2, H * 0.012));
    ctx.fillRect(bx0, baseY - headH * 0.55, bw, Math.max(2, H * 0.010));
    ctx.fillStyle = rgb(BED_WOOD_D);
    ctx.fillRect(bx0, baseY - headH * 0.55 + H * 0.010, bw, H * 0.006);
    // Mattress and sheet, then the rumpled blanket: a wavy top edge
    // drawn as a closed path so the fabric reads handmade.
    ctx.fillStyle = rgb(SHEET);
    ctx.fillRect(bx0, baseY - bedH, bw, bedH);
    var bx = bx0, by = baseY - bedH;
    var i, wx, wy;
    ctx.fillStyle = rgb(BLANKET);
    ctx.beginPath();
    ctx.moveTo(bx0, by);
    for (i = 0; i <= 10; i++) {
      wx = bx0 + bw * i / 10;
      wy = by - H * 0.018 * (0.5 + 0.5 * Math.sin(i * 2.1 + 0.7));
      ctx.lineTo(wx, wy);
    }
    ctx.lineTo(bx1, baseY - H * 0.006);
    ctx.lineTo(bx0, baseY - H * 0.006);
    ctx.closePath();
    ctx.fill();
    // Blanket folds: soft darker strokes following the rumple.
    ctx.strokeStyle = rgba(BLANKET_D, a4(0.8));
    ctx.lineWidth = Math.max(1, W * 0.002);
    for (i = 0; i < 4; i++) {
      wx = bx0 + bw * (0.18 + i * 0.20);
      ctx.beginPath();
      ctx.moveTo(wx, by - H * 0.012);
      ctx.quadraticCurveTo(wx + W * 0.012, by - H * 0.028, wx + W * 0.020, by - H * 0.008);
      ctx.stroke();
    }
    // Pillow, propped at the head end, slightly squashed.
    var px = bx0 + bw * 0.16, py = by - H * 0.020;
    ctx.fillStyle = rgb(PILLOW);
    ctx.beginPath();
    ctx.moveTo(px - W * 0.055, py);
    ctx.ellipse(px, py, W * 0.055, H * 0.026, -0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgba(BLANKET_D, a4(0.6));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(px - W * 0.040, py - H * 0.008);
    ctx.lineTo(px + W * 0.040, py - H * 0.008);
    ctx.stroke();
    // Bed legs and the shadow under the bed.
    ctx.fillStyle = rgba(SHADOW, a4(0.25));
    ctx.beginPath();
    ctx.moveTo(bx0 + W * 0.01, baseY);
    ctx.ellipse(bx0 + bw / 2, baseY + H * 0.004, bw * 0.48, H * 0.008, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(BED_WOOD_D);
    ctx.fillRect(bx0 + W * 0.006, baseY, Math.max(2, W * 0.006), H * 0.018);
    ctx.fillRect(bx1 - W * 0.012, baseY, Math.max(2, W * 0.006), H * 0.018);
  }

  function drawNightstand(t) {
    // Nightstand right of the bed, with the toy alarm clock and the
    // one warm lamp: the room's only practical light.
    var nx0 = X(0.455), nx1 = X(0.575);
    var topY = Y(0.520);
    var nw = nx1 - nx0;
    var bodyH = Y(WALL_BOT) - topY;
    ctx.fillStyle = rgb(STAND);
    ctx.fillRect(nx0, topY, nw, bodyH);
    ctx.fillStyle = rgb(STAND_D);
    ctx.fillRect(nx0, topY, nw, H * 0.008);
    ctx.fillRect(nx0, topY + bodyH * 0.45, nw, H * 0.006);
    // Drawer knob.
    ctx.fillStyle = rgb(CLOCK_DARK);
    ctx.beginPath();
    ctx.moveTo(nx0 + nw / 2 + Math.max(1.5, W * 0.004), topY + bodyH * 0.26);
    ctx.arc(nx0 + nw / 2, topY + bodyH * 0.26, Math.max(1.5, W * 0.004), 0, Math.PI * 2);
    ctx.fill();
    // Lamp: stem, warm shade, glow halo that breathes slowly.
    var lx = nx0 + nw * 0.30, ly = topY;
    var glowPulse = 0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / 9 + 0.8);
    var gr = W * 0.085 * (1 + 0.04 * glowPulse);
    var lg = ctx.createRadialGradient(lx, ly - H * 0.075, 0, lx, ly - H * 0.075, gr);
    lg.addColorStop(0, rgba(LAMP_GLOW, a4(0.42)));
    lg.addColorStop(0.6, rgba(LAMP_GLOW, a4(0.14)));
    lg.addColorStop(1, rgba(LAMP_GLOW, 0));
    ctx.fillStyle = lg;
    ctx.fillRect(lx - gr, ly - H * 0.075 - gr, gr * 2, gr * 2);
    ctx.fillStyle = rgb(CLOCK_DARK);
    ctx.fillRect(lx - W * 0.004, ly - H * 0.055, W * 0.008, H * 0.055);
    ctx.fillStyle = rgb(LAMP_SHADE);
    ctx.beginPath();
    ctx.moveTo(lx - W * 0.030, ly - H * 0.055);
    ctx.lineTo(lx + W * 0.030, ly - H * 0.055);
    ctx.lineTo(lx + W * 0.020, ly - H * 0.100);
    ctx.lineTo(lx - W * 0.020, ly - H * 0.100);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb(LAMP_CORE);
    ctx.beginPath();
    ctx.moveTo(lx - W * 0.020, ly - H * 0.100);
    ctx.lineTo(lx + W * 0.020, ly - H * 0.100);
    ctx.lineTo(lx + W * 0.014, ly - H * 0.112);
    ctx.lineTo(lx - W * 0.014, ly - H * 0.112);
    ctx.closePath();
    ctx.fill();
    // Toy alarm clock: two bells, a cream face, hands at ten past ten.
    var cx = nx0 + nw * 0.72, cy = topY - H * 0.028;
    var cr = W * 0.024;
    ctx.fillStyle = rgb(CLOCK_RED);
    ctx.beginPath();
    ctx.moveTo(cx - cr * 0.9 + cr * 0.28, cy - cr * 0.9);
    ctx.arc(cx - cr * 0.9, cy - cr * 0.9, cr * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + cr * 0.9 + cr * 0.28, cy - cr * 0.9);
    ctx.arc(cx + cr * 0.9, cy - cr * 0.9, cr * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgb(CLOCK_RED);
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.beginPath();
    ctx.moveTo(cx - cr * 0.5, cy - cr * 1.15);
    ctx.lineTo(cx + cr * 0.5, cy - cr * 1.15);
    ctx.stroke();
    ctx.fillStyle = rgb(CLOCK_FACE);
    ctx.beginPath();
    ctx.moveTo(cx + cr, cy);
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgb(CLOCK_DARK);
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(cx + cr, cy);
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.stroke();
    // Hands: ten past ten.
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx - cr * 0.55, cy - cr * 0.55);
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + cr * 0.62, cy - cr * 0.45);
    ctx.stroke();
    ctx.fillStyle = rgb(CLOCK_DARK);
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.003, cy);
    ctx.arc(cx, cy, W * 0.003, 0, Math.PI * 2);
    ctx.fill();
    // Little feet under the clock.
    ctx.fillStyle = rgb(CLOCK_DARK);
    ctx.fillRect(cx - cr * 0.6, cy + cr * 0.9, W * 0.006, H * 0.008);
    ctx.fillRect(cx + cr * 0.6 - W * 0.006, cy + cr * 0.9, W * 0.006, H * 0.008);
  }

  function drawFigures(t) {
    // The band of small figures along the back wall. They shift a
    // little with the tilt (a third of the toys' travel) and lean
    // into it, but they never leave the wall.
    var i, f, fx, fy, fh, fw, bob, shift;
    for (i = 0; i < FIGURES.length; i++) {
      f = FIGURES[i];
      bob = H * 0.0012 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE + i * 1.9);
      shift = clamp(tilt.roll * W * 0.30, -W * 0.008, W * 0.008);
      fx = X(f.x) + shift;
      fh = H * f.h;
      fy = Y(WALL_BOT) - H * 0.022 + bob; // feet on the skirting top
      fw = fh * 0.34;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(f.lean + tilt.roll * 0.6);
      // Body: a peg-doll torso, slightly wider at the base.
      ctx.fillStyle = rgb(f.body);
      ctx.beginPath();
      ctx.moveTo(-fw * 0.42, 0);
      ctx.lineTo(-fw * 0.30, -fh * 0.62);
      ctx.lineTo(fw * 0.30, -fh * 0.62);
      ctx.lineTo(fw * 0.42, 0);
      ctx.closePath();
      ctx.fill();
      // Head.
      ctx.fillStyle = rgb(f.head);
      ctx.beginPath();
      ctx.moveTo(-fw * 0.30, -fh * 0.62);
      ctx.arc(0, -fh * 0.78, fw * 0.30, 0, Math.PI * 2);
      ctx.fill();
      // Eyes, two dots.
      ctx.fillStyle = rgb(INK);
      ctx.beginPath();
      ctx.moveTo(-fw * 0.12 + W * 0.0012, -fh * 0.78);
      ctx.arc(-fw * 0.12, -fh * 0.78, W * 0.0012, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(fw * 0.12 + W * 0.0012, -fh * 0.78);
      ctx.arc(fw * 0.12, -fh * 0.78, W * 0.0012, 0, Math.PI * 2);
      ctx.fill();
      // A pointed party hat on some figures.
      if (f.hat) {
        ctx.fillStyle = rgb(f.body);
        ctx.beginPath();
        ctx.moveTo(-fw * 0.24, -fh * 0.98);
        ctx.lineTo(fw * 0.24, -fh * 0.98);
        ctx.lineTo(0, -fh * 1.28);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawToy(toy, t) {
    var x = X(toy.x) + toy.ox;
    var y = Y(toy.y) + toy.oy;
    var r = toy.r * W;
    if (toy.kind === 'ball') {
      // Striped ball, rolling with its slide.
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(toy.spin * 0.02);
      ctx.fillStyle = rgb(BALL);
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgb(BALL_D);
      ctx.beginPath();
      ctx.moveTo(-r * 0.4, -r);
      ctx.lineTo(r * 0.4, -r);
      ctx.lineTo(r * 0.7, r);
      ctx.lineTo(-r * 0.1, r);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = rgba([232, 226, 210], a4(0.8));
      ctx.beginPath();
      ctx.moveTo(-r * 0.55, -r * 0.3);
      ctx.arc(-r * 0.35, -r * 0.3, r * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (toy.kind === 'car') {
      // Small 90s toy car, body and cabin, two wheels.
      var cl = r * 2.4, ch = r * 0.9;
      ctx.fillStyle = rgba(SHADOW, a4(0.25));
      ctx.beginPath();
      ctx.moveTo(x + cl * 0.5, y + r * 0.55);
      ctx.ellipse(x, y + r * 0.55, cl * 0.5, r * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgb(CAR_BODY);
      ctx.beginPath();
      ctx.moveTo(x - cl / 2, y + r * 0.4);
      ctx.lineTo(x - cl / 2, y - ch * 0.3);
      ctx.quadraticCurveTo(x - cl / 2, y - ch * 0.7, x - cl * 0.3, y - ch * 0.7);
      ctx.lineTo(x + cl * 0.3, y - ch * 0.7);
      ctx.quadraticCurveTo(x + cl / 2, y - ch * 0.7, x + cl / 2, y - ch * 0.3);
      ctx.lineTo(x + cl / 2, y + r * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = rgb(CAR_TOP);
      ctx.fillRect(x - cl * 0.28, y - ch * 1.05, cl * 0.56, ch * 0.45);
      ctx.fillStyle = rgb(CLOCK_DARK);
      var wx1 = x - cl * 0.30, wx2 = x + cl * 0.30;
      ctx.beginPath();
      ctx.moveTo(wx1 + r * 0.32, y + r * 0.4);
      ctx.arc(wx1, y + r * 0.4, r * 0.32, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(wx2 + r * 0.32, y + r * 0.4);
      ctx.arc(wx2, y + r * 0.4, r * 0.32, 0, Math.PI * 2);
      ctx.fill();
    } else if (toy.kind === 'block') {
      // Wooden letter block, tilted slightly by its slide.
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(toy.ox * 0.004);
      ctx.fillStyle = rgb(toy.col);
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.strokeStyle = rgba(INK, a4(0.5));
      ctx.lineWidth = Math.max(1, W * 0.0015);
      ctx.strokeRect(-r, -r, r * 2, r * 2);
      ctx.fillStyle = rgba([240, 234, 220], a4(0.9));
      ctx.font = '700 ' + L.fsLetter + 'px Georgia, "Times New Roman", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(toy.letter, 0, 1);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.restore();
    } else if (toy.kind === 'doll') {
      // A small rag doll, lying where it was dropped.
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.5 + toy.ox * 0.003);
      ctx.fillStyle = rgb(DOLL_DRESS);
      ctx.beginPath();
      ctx.moveTo(-r * 0.5, r * 0.9);
      ctx.lineTo(r * 0.5, r * 0.9);
      ctx.lineTo(r * 0.75, -r * 0.4);
      ctx.lineTo(-r * 0.75, -r * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = rgb(DOLL_SKIN);
      ctx.beginPath();
      ctx.moveTo(r * 0.42, -r * 0.4);
      ctx.arc(0, -r * 0.62, r * 0.42, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgb([90, 70, 58]);
      ctx.beginPath();
      ctx.moveTo(r * 0.42, -r * 0.75);
      ctx.arc(0, -r * 0.62, r * 0.42, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawMobile(t) {
    // A paper star-and-moon mobile hanging from the top of the room.
    // It swings against the tilt like a pendulum.
    var ax = X(0.760), ay = Y(WALL_TOP);
    var swing = -tilt.roll * 1.4 + 0.02 * Math.sin(2 * Math.PI * (t - FIRST_T) / 9 + 2.0);
    var len = H * 0.115;
    var bx = ax + Math.sin(swing) * len;
    var by = ay + Math.cos(swing) * len;
    ctx.strokeStyle = rgba(STRING, a4(0.85));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();
    // Star: five points, drawn as a closed path.
    var sr = W * 0.018;
    ctx.fillStyle = rgb(MOBILE_STAR);
    ctx.beginPath();
    var i, a, px, py;
    for (i = 0; i < 10; i++) {
      a = -Math.PI / 2 + i * Math.PI / 5;
      var rr = (i % 2 === 0) ? sr : sr * 0.45;
      px = bx + Math.cos(a) * rr;
      py = by + Math.sin(a) * rr;
      if (i === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
    }
    ctx.closePath();
    ctx.fill();
    // A small crescent moon hanging beside the star.
    var mx = bx + W * 0.035, my = by + H * 0.012;
    ctx.fillStyle = rgb(MOBILE_MOON);
    ctx.beginPath();
    ctx.moveTo(mx + W * 0.012, my);
    ctx.arc(mx, my, W * 0.012, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(WALL);
    ctx.beginPath();
    ctx.moveTo(mx + W * 0.016, my - H * 0.002);
    ctx.arc(mx + W * 0.005, my - H * 0.002, W * 0.010, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRoom(t) {
    // The whole room tilts as one rigid set around the stage centre.
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(tilt.roll);
    ctx.translate(-W / 2 + tilt.pitch * W * 0.35, -H / 2 + tilt.pitch * H * 0.2);
    drawWall(t);
    drawWindow();
    drawBunting();
    drawPoster();
    drawFloor();
    drawRug();
    drawBed();
    drawNightstand(t);
    drawFigures(t);
    var i;
    for (i = 0; i < TOYS.length; i++) { drawToy(TOYS[i], t); }
    drawMobile(t);
    ctx.restore();
  }

  function drawWarmth() {
    // The lamp's warmth pools over the whole room, strongest near
    // the nightstand; a soft vignette keeps the dollhouse feel.
    var lx = X(0.515), ly = Y(0.445);
    var wg = ctx.createRadialGradient(lx, ly, 0, lx, ly, W * 0.55);
    wg.addColorStop(0, rgba(LAMP_GLOW, a4(0.10)));
    wg.addColorStop(0.6, rgba(LAMP_GLOW, a4(0.04)));
    wg.addColorStop(1, rgba(LAMP_GLOW, 0));
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, W, H);
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.40,
      W / 2, H / 2, Math.max(W, H) * 0.72);
    vg.addColorStop(0, rgba([40, 38, 44], 0));
    vg.addColorStop(1, rgba([40, 38, 44], a4(0.18)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function draw(t) {
    var dt = clamp(t - lastT, 0, 0.1);
    lastT = t;
    if (stateInit) { stepPhysics(t, dt); }
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Ground is the frame-0 wall colour; the room fills the stage.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawRoom(t);
    drawWarmth();

    // Caption, top left, and the hint, bottom center, in the
    // template's place: dark ink on the pale wall, cream on the
    // dark floor strip at the bottom.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba([58, 54, 50], a4(0.8));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№852 · The Miniature Bedroom', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba([58, 54, 50], a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 12', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba([240, 234, 220], a4(0.9));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to tilt the room.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // ---- Drag interaction ----------------------------------------------
  // Pointer drag tilts the room; release springs back to the loop.
  function pointerPos(e) {
    var r = { x: 0, y: 0 };
    try {
      if (e && typeof e.clientX === 'number') { r.x = e.clientX; r.y = e.clientY; }
      else if (e && typeof e.pageX === 'number') { r.x = e.pageX; r.y = e.pageY; }
    } catch (err) {}
    return r;
  }
  function onDown(e) {
    var p = pointerPos(e);
    dragging = true;
    dragStart = p;
    dragBase.roll = tilt.roll;
    dragBase.pitch = tilt.pitch;
    try { if (e && typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
  }
  function onMove(e) {
    if (!dragging) { return; }
    var p = pointerPos(e);
    var dx = p.x - dragStart.x, dy = p.y - dragStart.y;
    tiltTarget.roll = clamp(dragBase.roll + dx / W * 0.35, -0.09, 0.09);
    tiltTarget.pitch = clamp(dragBase.pitch + dy / H * 0.25, -0.06, 0.06);
  }
  function onUp() {
    if (!dragging) { return; }
    dragging = false; // target returns to the loop tilt in stepPhysics
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) { onDown(e); draw(lastT); });
    canvas.addEventListener('pointermove', function (e) { onMove(e); draw(lastT); });
    canvas.addEventListener('pointerup', function (e) { onUp(); draw(lastT); });
    canvas.addEventListener('pointercancel', function (e) { onUp(); draw(lastT); });
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece852 exposes the tilt state and the drag.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece852 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      tilt: function () { return { roll: tilt.roll, pitch: tilt.pitch }; },
      toys: function () {
        var out = [], i;
        for (i = 0; i < TOYS.length; i++) {
          out.push({ kind: TOYS[i].kind, ox: TOYS[i].ox, oy: TOYS[i].oy });
        }
        return out;
      },
      down: function (x, y) { onDown({ clientX: x, clientY: y }); },
      move: function (x, y) { onMove({ clientX: x, clientY: y }); },
      up: function () { onUp(); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  snapPhysics(probeT !== null ? probeT : FIRST_T);
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: a 72 s sway, a 9 s lamp breath, springs integrated
  // from the virtual clock. Guarded so node-canvas QA works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t); // draw() steps the springs from the virtual clock
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
