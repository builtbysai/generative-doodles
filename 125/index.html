<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№125 · Rayhatch Co-create</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#101012; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(237,230,214,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag the lower strip to shape it</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.125 Rayhatch Co-create: a small raymarcher (3 SDF primitives, smooth morph),
// surfaces drawn as hatch lines whose length follows the light. No WebGL.
const GROUND='#101012', HATCH='#EDE6D6', TEAL='#1F6E6B';
let morph=0.55, lightAz=0.7, lightEl=0.62, spacing=9;
let rotOff=0, rotOffX=0, dblSeed=0;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const t=nowMs/1000;
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h);
  // keep the form inside narrow frames: pull the camera back on portrait phones
  const fit=clamp(0.283*h/(0.44*w),1,2.2);
  const camZ=2.95*fit, R=1.28;
  const ry=t*0.07+rotOff, rx=0.35+rotOffX+0.06*Math.sin(t*0.05);
  const cxr=Math.cos(rx), sxr=Math.sin(rx), cyr=Math.cos(ry), syr=Math.sin(ry);
  const tm=t*0.3;
  // light direction in world space; the SDF gradient below is also world-space
  const lx=Math.cos(lightEl)*Math.sin(lightAz), ly=Math.sin(lightEl), lz=Math.cos(lightEl)*Math.cos(lightAz);
  function mapP(px,py,pz){
    const y1=py*cxr-pz*sxr, z1=py*sxr+pz*cxr; py=y1; pz=z1;
    const x2=px*cyr+pz*syr, z2=-px*syr+pz*cyr; px=x2; pz=z2;
    const ds=Math.sqrt(px*px+py*py+pz*pz)-0.95;
    const qx=Math.sqrt(px*px+pz*pz)-0.62;
    const dt2=Math.sqrt(qx*qx+py*py)-0.34;
    const bx=Math.abs(px)-0.62, by=Math.abs(py)-0.62, bz=Math.abs(pz)-0.62;
    const ox=Math.max(bx,0), oy=Math.max(by,0), oz=Math.max(bz,0);
    const db=Math.sqrt(ox*ox+oy*oy+oz*oz)+Math.min(Math.max(bx,Math.max(by,bz)),0)-0.08;
    let d=morph<1? ds+(dt2-ds)*morph : dt2+(db-dt2)*(morph-1);
    d+=0.05*Math.sin(px*3.1+tm)*Math.sin(py*2.7-tm*0.8)*Math.sin(pz*3.4+tm*0.6);
    return d;
  }
  const s=Math.max(2, Math.round(Math.min(w,h)/220));
  const gw=Math.ceil(w/s), gh=Math.ceil(h/s);
  const K=1.15, aspect=w/h;
  const inkSeg=[], tealSeg=[];
  for(let j=0;j<gh;j++){
    const v=(j+0.5)*s, ny=-(v/h-0.5)*K;
    for(let i=0;i<gw;i++){
      const u=(i+0.5)*s, nx=(u/w-0.5)*aspect*K;
      const inv=1/Math.sqrt(nx*nx+ny*ny+1);
      const rdx=nx*inv, rdy=ny*inv, rdz=-inv;
      // analytic pass through the bounding sphere first: cheap reject
      const b=camZ*rdz, c=camZ*camZ-R*R, disc=b*b-c;
      if(disc<0) continue;
      const sq=Math.sqrt(disc);
      let tt=Math.max(-b-sq,0.05); const tEnd=-b+sq;
      let hit=false, hx=0, hy=0, hz=0;
      for(let it=0; it<64 && tt<tEnd; it++){
        hx=rdx*tt; hy=rdy*tt; hz=camZ+rdz*tt;
        const d=mapP(hx,hy,hz);
        if(d<0.0035){ hit=true; break; }
        tt+=d*0.72;
      }
      if(!hit) continue;
      // normal from the SDF gradient
      const e=0.012;
      const gx=mapP(hx+e,hy,hz)-mapP(hx-e,hy,hz);
      const gy=mapP(hx,hy+e,hz)-mapP(hx,hy-e,hz);
      const gz=mapP(hx,hy,hz+e)-mapP(hx,hy,hz-e);
      const gl=Math.sqrt(gx*gx+gy*gy+gz*gz)||1;
      let diff=(gx/gl*lx+gy/gl*ly+gz/gl*lz+0.35)/1.35;
      diff=clamp(diff,0,1);
      // hatch layer 1: diagonal lines, segment length follows the light
      const a1=(u+v)*0.70711, f1=a1/spacing-Math.floor(a1/spacing);
      if(f1<0.30 && diff>0.05){
        const len=s*0.78*clamp(diff*1.2,0.10,1);
        const seg=[u-0.70711*len, v+0.70711*len, u+0.70711*len, v-0.70711*len];
        if(diff<0.10) tealSeg.push(seg); else inkSeg.push(seg);
      } else if(diff<=0.06 && ((i*31+j*17)%4===0)){
        tealSeg.push([u-s*0.15, v, u+s*0.15, v]);
      }
      // hatch layer 2: cross-hatch arrives only in strong light
      if(diff>0.60){
        const a2=(u-v)*0.70711, f2=a2/spacing-Math.floor(a2/spacing);
        if(f2<0.30){
          const len2=s*0.78*clamp((diff-0.60)*2.4,0,1);
          inkSeg.push([u-0.70711*len2, v-0.70711*len2, u+0.70711*len2, v+0.70711*len2]);
        }
      }
    }
  }
  ctx.lineWidth=clamp(s*0.24,0.8,1.6);
  ctx.lineCap='round';
  ctx.strokeStyle=HATCH;
  ctx.beginPath();
  for(const sg of inkSeg){ ctx.moveTo(sg[0],sg[1]); ctx.lineTo(sg[2],sg[3]); }
  ctx.stroke();
  ctx.strokeStyle=TEAL;
  ctx.beginPath();
  for(const sg of tealSeg){ ctx.moveTo(sg[0],sg[1]); ctx.lineTo(sg[2],sg[3]); }
  ctx.stroke();
}
// interaction: three invisible zones in the bottom strip; elsewhere drags orbit
let dragMode=null, zone=-1, lastPt=null, lastTapT=-1e9;
canvas.addEventListener('pointerdown',e=>{
  if(e.timeStamp-lastTapT<350){
    dblSeed++;
    const rnd=mulberry(hashStr('Rayhatch '+dblSeed));
    morph=rnd()*2; lightAz=rnd()*6.283; lightEl=0.1+rnd()*1.0; spacing=6+rnd()*8;
    lastTapT=-1e9; dragMode=null; return;
  }
  lastTapT=e.timeStamp;
  const [w,h]=viewportWH();
  if(e.clientY>h*0.80){ dragMode='zone'; zone=Math.min(2, Math.floor(e.clientX/(w/3))); }
  else dragMode='orbit';
  lastPt=[e.clientX,e.clientY];
});
canvas.addEventListener('pointermove',e=>{
  if(!dragMode||!lastPt) return;
  const dx=e.clientX-lastPt[0], dy=e.clientY-lastPt[1];
  if(dragMode==='zone'){
    if(zone===0) morph=clamp(morph+dx*0.005,0,2);
    else if(zone===1){ lightAz+=dx*0.01; lightEl=clamp(lightEl-dy*0.008,-0.15,1.35); }
    else spacing=clamp(spacing+dy*0.05,5.5,16);
  } else { rotOff+=dx*0.005; rotOffX=clamp(rotOffX+dy*0.003,-0.3,0.3); }
  lastPt=[e.clientX,e.clientY];
});
function endP(){ dragMode=null; lastPt=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
