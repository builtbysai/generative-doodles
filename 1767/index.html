<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bridge Gong</title>
<style>
html, body { margin: 0; padding: 0; background: #d9d9d2; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#d9d9d2';
var FEN = '#cfcfc6';
var HORIZON = '#a8a89e';
var MIST = '#f2f2ec';
var RUST = '#b4531f';
var RUST_DARK = '#8a3d16';
var RUST_LIGHT = '#c96a2e';
var STEEL = '#3c4147';
var STEEL_LIGHT = '#5a6068';
var GOLD = '#e8b64a';
var AMBER = '#b96a1e';
var PALE_GOLD = '#f5e6c0';
var POST_GREY = '#8d8d82';
var PLATE = '#2f3338';
var PLATE_LINE = 'rgba(232,182,74,0.55)';
var TITLE_INK = '#e8e8e0';
var HINT_INK = '#e8b64a';
var FRAME_T = 60.0; /* fixed phase: rings mid-decay at frame one */
var RING_SPEED = 0.028; /* field units per second along the bridge axis */
var RING_LIFE = 20.0; /* seconds until a ring has fully decayed */
var RETURN_DELAY = 4.0; /* seconds before the return ring answers a strike */
var RETURN_SPEED = 0.026;
var MEMBERS = 15; /* vertical truss members along the bridge */
var DRAG_MIN_GAP = 0.6; /* seconds between drag strikes */
var SAME_MEMBER_GAP = 2.0; /* seconds before the same member may ring again */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1767);
var phaseT = FRAME_T;
var simT = 0;
var strikes = []; /* { u: axis param 0..1, born: simT } */
var nextStrike = 4 + rng() * 6;
var lastDragStrike = -10;
var lastDragMember = -1;
var dragging = false;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
/* bridge axis in field coords: lower left to upper right */
var AX = 0.08, AY = 0.80, BX = 0.92, BY = 0.22;
var DX = BX - AX, DY = BY - AY;
var AXIS_LEN = Math.sqrt(DX * DX + DY * DY);
var UX = DX / AXIS_LEN, UY = DY / AXIS_LEN; /* unit vector along the bridge */
var NX = -UY, NY = UX; /* unit normal, sky side (up) */
var TRUSS = 0.07; /* chord separation in field units */
var BRIDGE_ANGLE = Math.atan2(DY, DX);
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
function fx(u) { return F.x + u * F.w; }
function fy(v) { return F.y + v * F.h; }
/* point on the deck at axis param t (0..1) */
function deckPoint(t) {
  return { x: fx(AX + DX * t), y: fy(AY + DY * t) };
}
function topPoint(t) {
  return { x: fx(AX + DX * t + NX * TRUSS), y: fy(AY + DY * t + NY * TRUSS) };
}
/* nearest truss member to a canvas point; returns { index, u, x, y } */
function nearestMember(px, py) {
  var rx = (px - F.x) / F.w - AX;
  var ry = (py - F.y) / F.h - AY;
  var t = (rx * DX + ry * DY) / (AXIS_LEN * AXIS_LEN);
  t = clamp(t, 0, 1);
  var idx = Math.round(t * (MEMBERS - 1));
  var u = idx / (MEMBERS - 1);
  var p = deckPoint(u);
  return { index: idx, u: u, x: p.x, y: p.y };
}
function strikeAt(u, now) {
  strikes.push({ u: u, born: now });
}
function selfStrike() {
  var idx = Math.floor(rng() * MEMBERS);
  strikeAt(idx / (MEMBERS - 1), simT);
  nextStrike = simT + 8 + rng() * 6;
}
function stepSim(dt) {
  simT += dt;
  while (nextStrike <= simT) selfStrike();
  var i;
  for (i = strikes.length - 1; i >= 0; i--) {
    if (simT - strikes[i].born > RING_LIFE) strikes.splice(i, 1);
  }
}
var audioCtx = null;
function playNote(memberIndex) {
  try {
    if (typeof window === 'undefined') return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (typeof AC === 'undefined') return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var freq = 98 * Math.pow(2, memberIndex / (MEMBERS - 1));
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    var t0 = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.12, t0 + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.0);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 4.2);
  } catch (e) { /* silent if audio is unavailable */ }
}
function pointerPos(e) {
  var x = 0, y = 0;
  try {
    if (typeof e.offsetX !== 'undefined') { x = e.offsetX; y = e.offsetY; }
    else if (canvas.getBoundingClientRect) {
      var r = canvas.getBoundingClientRect();
      x = e.clientX - r.left; y = e.clientY - r.top;
    }
  } catch (err) { x = 0; y = 0; }
  return { x: x, y: y };
}
function handleStrike(e) {
  var p = pointerPos(e);
  var m = nearestMember(p.x, p.y);
  if (simT - lastDragStrike < DRAG_MIN_GAP) return;
  if (m.index === lastDragMember && simT - lastDragStrike < SAME_MEMBER_GAP) return;
  lastDragStrike = simT;
  lastDragMember = m.index;
  strikeAt(m.u, simT);
  playNote(m.index);
}
function drawFen() {
  ctx.fillStyle = FEN;
  ctx.fillRect(F.x, fy(0.30), F.w, F.y + F.h - fy(0.30));
  /* horizon, a thin line far behind */
  ctx.fillStyle = HORIZON;
  ctx.fillRect(F.x, fy(0.30), F.w, 1);
  /* Holme Fen posts: a few thin markers standing in the mist */
  var i, px, ph;
  ctx.fillStyle = rgba(POST_GREY, 0.35);
  for (i = 0; i < 6; i++) {
    px = fx(0.14 + i * 0.145);
    ph = F.h * (0.028 + 0.012 * Math.sin(i * 2.7 + 1.3));
    ctx.fillRect(px, fy(0.30) - ph, 1.5, ph);
  }
  /* slow mist bands drifting across the fen */
  var bands = [0.42, 0.58, 0.74];
  for (i = 0; i < bands.length; i++) {
    var drift = Math.sin(phaseT * 0.02 + i * 2.1) * 0.02;
    ctx.fillStyle = rgba(MIST, 0.07);
    ctx.fillRect(F.x, fy(bands[i] + drift) - F.h * 0.025, F.w, F.h * 0.05);
  }
}
function drawBridge() {
  var i, p0, p1, q0, q1;
  /* piers: short stubs sinking into the mist, not bars across the fen */
  var pierTs = [0.30, 0.70];
  for (i = 0; i < pierTs.length; i++) {
    var pp = deckPoint(pierTs[i]);
    ctx.fillStyle = rgba(STEEL, 0.30);
    ctx.fillRect(pp.x - 2, pp.y, 4, F.h * 0.10);
    ctx.fillStyle = rgba(STEEL_LIGHT, 0.25);
    ctx.fillRect(pp.x - 2, pp.y, 1.5, F.h * 0.10);
  }
  /* deck: the roadway the rings travel along */
  p0 = deckPoint(0); p1 = deckPoint(1);
  ctx.strokeStyle = RUST_DARK;
  ctx.lineWidth = Math.max(3, F.w * 0.006);
  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  ctx.lineTo(p1.x, p1.y);
  ctx.stroke();
  /* top chord, rust */
  q0 = topPoint(0); q1 = topPoint(1);
  ctx.strokeStyle = RUST;
  ctx.lineWidth = Math.max(2.5, F.w * 0.004);
  ctx.beginPath();
  ctx.moveTo(q0.x, q0.y);
  ctx.lineTo(q1.x, q1.y);
  ctx.stroke();
  /* vertical members and alternating diagonals */
  var t, a, b, c, d;
  for (i = 0; i < MEMBERS; i++) {
    t = i / (MEMBERS - 1);
    a = deckPoint(t); b = topPoint(t);
    ctx.strokeStyle = STEEL;
    ctx.lineWidth = Math.max(1.2, F.w * 0.002);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    /* node dot at the deck */
    ctx.beginPath();
    ctx.moveTo(a.x + 2.5, a.y);
    ctx.arc(a.x, a.y, 2.5, 0, TAU);
    ctx.fillStyle = RUST_LIGHT;
    ctx.fill();
    if (i < MEMBERS - 1) {
      var t2 = (i + 1) / (MEMBERS - 1);
      if (i % 2 === 0) { c = deckPoint(t); d = topPoint(t2); }
      else { c = topPoint(t); d = deckPoint(t2); }
      ctx.strokeStyle = rgba(RUST, 0.85);
      ctx.lineWidth = Math.max(1, F.w * 0.0016);
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();
    }
  }
}
function drawRing(s, age, speed, delay, peakAlpha, color) {
  var a = age - delay;
  if (a <= 0) return;
  var r = a * speed * F.w;
  if (r <= 0) return;
  var fade = 1 - age / RING_LIFE;
  if (fade <= 0) return;
  var alpha = peakAlpha * Math.pow(fade, 1.2);
  var p = deckPoint(s.u);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(BRIDGE_ANGLE);
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.ellipse(0, 0, r, r * 0.30, 0, 0, TAU);
  ctx.strokeStyle = rgba(color, alpha);
  ctx.lineWidth = Math.max(1, 1.5 + 5.5 * fade);
  ctx.stroke();
  ctx.restore();
}
function drawStrikes() {
  var i, s, age;
  /* normal blending on the pale ground: additive washes gold to white */
  for (i = 0; i < strikes.length; i++) {
    s = strikes[i];
    age = simT - s.born;
    /* gold ring ageing toward deep amber */
    var warm = age < RING_LIFE * 0.5 ? GOLD : AMBER;
    drawRing(s, age, RING_SPEED, 0, 0.85, warm);
    drawRing(s, age, RING_SPEED, 0, 0.35, GOLD);
    drawRing(s, age, RETURN_SPEED, RETURN_DELAY, 0.35, PALE_GOLD);
  }
  /* strike flash: a brief bright bloom at the struck member */
  for (i = 0; i < strikes.length; i++) {
    s = strikes[i];
    age = simT - s.born;
    if (age < 2.5) {
      var p = deckPoint(s.u);
      var fa = (1 - age / 2.5).toFixed(4);
      ctx.beginPath();
      ctx.moveTo(p.x + 10, p.y);
      ctx.arc(p.x, p.y, 10 * (1 - age / 2.5) + 3, 0, TAU);
      ctx.fillStyle = 'rgba(232,182,74,' + fa + ')';
      ctx.fill();
    }
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawFen();
  drawBridge();
  drawStrikes();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Bridge Gong').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Bridge Gong').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 13').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Bridge Gong', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 13', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to strike.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    strikeCount: function () { return strikes.length; },
    strikeAges: function () { var out = []; var i; for (i = 0; i < strikes.length; i++) out.push(+(simT - strikes[i].born).toFixed(2)); return out; },
    nearestMember: nearestMember,
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60 s, sim pre-run 0 to 60 s in 1/30 s steps ---- */
size();
/* pre-run the simulation so frame one holds rings mid-decay */
(function () {
  var steps = Math.round(FRAME_T * 30);
  var s;
  for (s = 0; s < steps; s++) stepSim(1 / 30);
  phaseT = FRAME_T;
})();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    handleStrike(e);
    if (e.preventDefault) e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (dragging) handleStrike(e);
  });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointercancel', function () { dragging = false; });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0, acc = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      acc += dt;
      while (acc >= 1 / 30) { stepSim(1 / 30); acc -= 1 / 30; }
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
