<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№77 · Sortation Pass</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F3EDE1; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(20,20,20,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scrub the sort</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const GROUND='#F3EDE1', INK='#141414', PAL=['#1F4ED8','#2E9E5B','#E03A1F','#D9A02B'];

// No.77 Sortation Pass: 10x10 = 100 cells, bubble sort per column
const N=10, COLS=['#1F4ED8','#2E9E5B','#E03A1F','#D9A02B'];
const initGrid=[], swapsPerCol=[];
{ const r=rng(7703);
  const base=[]; for(let c=0;c<N;c++){ const col=[]; for(let i=0;i<N;i++) col.push(Math.floor(r()*4)); base.push(col); }
  for(let c=0;c<N;c++){
    const arr=base[c].slice(); initGrid.push(base[c].slice());
    const sw=[];
    for(let pass=0;pass<N;pass++) for(let i=0;i<N-1-pass;i++){ if(arr[i]>arr[i+1]){ const tmp=arr[i]; arr[i]=arr[i+1]; arr[i+1]=tmp; sw.push(i); } }
    swapsPerCol.push(sw);
  }
}
let scrubT=null, holdUntil=-1, dragging=false;
function effTime(t){
  if(dragging && scrubT!==null) return scrubT;
  if(scrubT!==null && t<holdUntil) return scrubT;
  return t%20;
}
function colState(c, ph){
  // returns array of {color, y} per item in current order positions interpolated
  const items=initGrid[c].map((col,row)=>({col:row*0+col, y:row}));
  const sw=swapsPerCol[c];
  const start=c*0.7, avail=10;
  for(let s=0;s<sw.length;s++){
    const ts=start + (sw.length? (s/Math.max(sw.length,1))*avail : 0);
    const dur=0.45, row=sw[s];
    if(ph<ts) break;
    if(ph>=ts+dur){
      // swap items currently at rows row,row+1 (find by y approx integer)
      items.sort((a,b)=>a.y-b.y);
      const tmp=items[row].col; // not needed
      const a=items[row], b=items[row+1]; const ty=a.y; a.y=b.y; b.y=ty;
    } else {
      const p=smooth((ph-ts)/dur);
      items.sort((a,b)=>a.y-b.y);
      const a=items[row], b=items[row+1]; const y0=a.y, y1=b.y; a.y=y0+(y1-y0)*p; b.y=y1+(y0-y1)*p;
      break;
    }
  }
  return items;
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const t=nowMs/1000, ph=effTime(t);
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h);
  const S=Math.min(w,h)*0.84, x0=(w-S)/2, y0=(h-S)/2, cell=S/N;
  ctx.fillStyle=INK; ctx.fillRect(x0,y0,S,S);
  let count=0;
  for(let c=0;c<N;c++){
    const items=colState(c, ph);
    for(const it of items){
      ctx.fillStyle=COLS[it.col];
      ctx.fillRect(x0+c*cell+1, y0+it.y*cell+1, cell-2, cell-2);
      count++;
    }
  }
  if(count!==100) console.assert(false,'count',count);
  // reseed fade 18-19 out, 19-20 in
  let a=0; if(ph>=18&&ph<19) a=(ph-18); else if(ph>=19&&ph<20) a=1-(ph-19);
  if(a>0){ ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,a)); ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h); ctx.restore(); }
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; const [w,h]=viewportWH(); scrubT=Math.max(0,Math.min(1,(e.clientY-(h-Math.min(w,h)*0.84)/2)/(Math.min(w,h)*0.84)))*20; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const [w,h]=viewportWH(); const S=Math.min(w,h)*0.84; scrubT=Math.max(0,Math.min(1,(e.clientY-(h-S)/2)/S))*20; });
function endP(){ if(dragging){ dragging=false; holdUntil=performance.now()/1000+4; } }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(9000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
