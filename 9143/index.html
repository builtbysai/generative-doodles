<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№9143 — The Only Sin</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0812; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  .cap {
    position:fixed; left:0; right:0; bottom:18px; text-align:center;
    color:rgba(232,225,240,.42); font:12px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing:.14em; text-transform:uppercase; pointer-events:none; user-select:none;
  }
  .cap b { color:rgba(232,200,140,.62); font-weight:600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">№9143 — <b>The Only Sin</b> &nbsp;·&nbsp; “Only sin is loving you knowing I can’t have you”</div>
<script>
(function(){
  "use strict";
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, S = 1; // S = scale factor for radii

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // portrait: orbs scale to the width so they stay present; landscape: to the smaller side
    S = (H > W) ? W / 450 : Math.min(W, H) / 700;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- geometry (orientation-aware: horizontal in landscape, vertical in portrait) ----
  function isPortrait(){ return H > W; }
  function belovedPos(t){
    if (isPortrait()) return { x: W * 0.5, y: H * 0.28 + Math.sin(t * 0.21) * 4 * S };
    return { x: W * 0.68, y: H * 0.5 + Math.sin(t * 0.21) * 4 * S };
  }
  function loverRest(){
    if (isPortrait()) return { x: W * 0.5, y: H * 0.73 };
    return { x: W * 0.27, y: H * 0.5 };
  }
  function loverClose(){
    if (isPortrait()) return { x: W * 0.5, y: H * 0.48 };
    return { x: W * 0.52, y: H * 0.5 };
  }

  // ---- state machine ----
  // phases: rest, approach, reach, retreat
  var phase = 'rest';
  var phaseT = 0;          // seconds in current phase
  var cycle = 0;           // cycle count (varies approach angle)
  var DUR = { rest: 2.6, approach: 6.0, reach: 2.6, retreat: 4.2 };

  // lover current position (lerped)
  var lover = loverRest();
  var approachOff = 0;     // perpendicular offset for this approach (varies the angle)
  var arcDir = 1;          // filament arc direction (alternates)

  // filament: {ax,ay,bx,by,cx,cy} quadratic from lover edge to near beloved
  var filament = null;     // live filament (during reach)
  var traces = [];         // faded ghosts of past filaments {ax,ay,bx,by,cx,cy, alpha}
  var motes = [];          // gold dust drifting toward beloved

  function easeInOut(u){ return u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2; }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  function startApproach(){
    cycle++;
    approachOff = (Math.sin(cycle * 1.7) * 0.5 + Math.sin(cycle * 0.9) * 0.5) * 26 * S;
    arcDir = (cycle % 2 === 0) ? 1 : -1;
    phase = 'approach'; phaseT = 0;
  }

  function buildFilament(){
    var b = belovedPos(performance.now() / 1000);
    var rL = 20 * S, rB = 24 * S;
    var dx = b.x - lover.x, dy = b.y - lover.y;
    var d = Math.hypot(dx, dy) || 1;
    var ux = dx / d, uy = dy / d;
    // start at lover's near edge, end just short of beloved (leave a gap)
    var gap = Math.max(14 * S, d * 0.10);
    var ax = lover.x + ux * rL, ay = lover.y + uy * rL;
    var bx = b.x - ux * (rB + gap), by = b.y - uy * (rB + gap);
    // control point: midpoint pushed perpendicular for a gentle arc
    var mx = (ax + bx) / 2, my = (ay + by) / 2;
    var px = -uy, py = ux; // perpendicular
    var bow = (18 + (cycle % 3) * 7) * S * arcDir;
    return { ax: ax, ay: ay, bx: bx, by: by, cx: mx + px * bow, cy: my + py * bow };
  }

  function step(dt){
    phaseT += dt;
    var rest = loverRest(), close = loverClose();
    var port = isPortrait();
    if (phase === 'rest'){
      if (port){ lover.x = rest.x + Math.sin(performance.now()/1000 * 0.6) * 3 * S; lover.y = rest.y; }
      else { lover.x = rest.x; lover.y = rest.y + Math.sin(performance.now()/1000 * 0.6) * 3 * S; }
      if (phaseT >= DUR.rest) startApproach();
    } else if (phase === 'approach'){
      var u = clamp(phaseT / DUR.approach, 0, 1);
      var e = easeInOut(u);
      if (port){
        lover.x = rest.x + approachOff * e;
        lover.y = rest.y + (close.y - rest.y) * e + Math.sin(performance.now()/1000 * 0.6) * 2 * S;
      } else {
        lover.x = rest.x + (close.x - rest.x) * e;
        lover.y = rest.y + approachOff * e + Math.sin(performance.now()/1000 * 0.6) * 2 * S;
      }
      // spawn motes
      if (Math.random() < 0.35){
        motes.push({ x: lover.x + (Math.random()-0.5)*30*S, y: lover.y + (Math.random()-0.5)*30*S,
                     vx: (40 + Math.random()*60) * S, vy: (Math.random()-0.5)*14*S,
                     life: 0, max: 1.6 + Math.random()*0.8, r: (1 + Math.random()*1.6) * S });
      }
      if (phaseT >= DUR.approach){ phase = 'reach'; phaseT = 0; filament = buildFilament(); }
    } else if (phase === 'reach'){
      if (phaseT >= DUR.reach){
        // leave a faint trace
        if (filament) traces.push({ f: filament, alpha: 0.075, born: performance.now()/1000 });
        filament = null;
        phase = 'retreat'; phaseT = 0;
      }
    } else if (phase === 'retreat'){
      var u2 = clamp(phaseT / DUR.retreat, 0, 1);
      var e2 = easeInOut(u2);
      if (port){
        lover.x = close.x + (rest.x - close.x) * e2 + approachOff * (1 - e2);
        lover.y = close.y + (rest.y - close.y) * e2;
      } else {
        lover.x = close.x + (rest.x - close.x) * e2;
        lover.y = (rest.y + approachOff) + (rest.y - (rest.y + approachOff)) * e2;
      }
      if (phaseT >= DUR.retreat){ phase = 'rest'; phaseT = 0; }
    }

    // motes drift and fade
    for (var i = motes.length - 1; i >= 0; i--){
      var m = motes[i];
      m.life += dt;
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.life >= m.max) motes.splice(i, 1);
    }
    // traces fade over 60s
    var now = performance.now() / 1000;
    for (var j = traces.length - 1; j >= 0; j--){
      var tr = traces[j];
      var age = now - tr.born;
      tr.alpha = 0.075 * Math.max(0, 1 - age / 60);
      if (tr.alpha <= 0.001) traces.splice(j, 1);
    }
  }

  // ---- drawing ----
  var stars = [];
  for (var s = 0; s < 70; s++){
    stars.push({ x: Math.random(), y: Math.random(), r: 0.4 + Math.random()*1.1, a: 0.12 + Math.random()*0.3, p: Math.random()*6.28 });
  }

  function drawFilament(f, alpha, width, glow){
    ctx.save();
    ctx.strokeStyle = 'rgba(240,190,110,' + alpha + ')';
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    if (glow){ ctx.shadowColor = 'rgba(240,180,90,0.9)'; ctx.shadowBlur = 14 * S; }
    ctx.beginPath();
    ctx.moveTo(f.ax, f.ay);
    ctx.quadraticCurveTo(f.cx, f.cy, f.bx, f.by);
    ctx.stroke();
    ctx.restore();
  }

  function draw(now){
    ctx.clearRect(0, 0, W, H);
    // background: deep indigo-plum radial
    var bg = ctx.createRadialGradient(W*0.68, H*0.5, 0, W*0.68, H*0.5, Math.max(W,H)*0.75);
    bg.addColorStop(0, '#171226');
    bg.addColorStop(0.55, '#0d0a18');
    bg.addColorStop(1, '#08060f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // stars
    for (var i = 0; i < stars.length; i++){
      var st = stars[i];
      var tw = 0.7 + 0.3 * Math.sin(now * 0.7 + st.p);
      ctx.fillStyle = 'rgba(200,190,230,' + (st.a * tw) + ')';
      ctx.beginPath(); ctx.arc(st.x * W, st.y * H, st.r * S, 0, 6.2832); ctx.fill();
    }

    var b = belovedPos(now);
    var rB = 24 * S;
    var rL = 20 * S;

    // traces (ghosts of past filaments)
    for (var j = 0; j < traces.length; j++){
      drawFilament(traces[j].f, traces[j].alpha, 1.2 * S, false);
    }

    // motes
    for (var k = 0; k < motes.length; k++){
      var m = motes[k];
      var a = 0.5 * (1 - m.life / m.max);
      ctx.fillStyle = 'rgba(240,200,120,' + a + ')';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.2832); ctx.fill();
    }

    // proximity: 0 at rest, 1 at closest (along the approach axis)
    var rest = loverRest(), close = loverClose();
    var prox = isPortrait()
      ? clamp((rest.y - lover.y) / Math.max(1, rest.y - close.y), 0, 1)
      : clamp((lover.x - rest.x) / Math.max(1, close.x - rest.x), 0, 1);

    // beloved: pale silver-blue, breathing, serene
    var breathe = 1 + 0.05 * Math.sin(now * 0.5);
    var rb = rB * breathe;
    var halo = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, rb * 4.2);
    halo.addColorStop(0, 'rgba(190,210,255,0.30)');
    halo.addColorStop(0.5, 'rgba(170,190,250,0.08)');
    halo.addColorStop(1, 'rgba(170,190,250,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(b.x, b.y, rb * 4.2, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#e8eefc';
    ctx.beginPath(); ctx.arc(b.x, b.y, rb, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(b.x - rb*0.3, b.y - rb*0.3, rb*0.42, 0, 6.2832); ctx.fill();

    // lover: warm gold, stretches toward beloved as it nears
    var stretch = 1 + prox * 0.55;           // elongation toward beloved
    var ang = Math.atan2(b.y - lover.y, b.x - lover.x);
    var glowA = 0.22 + prox * 0.38;
    var lg = ctx.createRadialGradient(lover.x, lover.y, 0, lover.x, lover.y, rL * 4.5);
    lg.addColorStop(0, 'rgba(240,185,95,' + glowA + ')');
    lg.addColorStop(0.55, 'rgba(230,160,70,0.10)');
    lg.addColorStop(1, 'rgba(230,160,70,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(lover.x, lover.y, rL * 4.5, 0, 6.2832); ctx.fill();

    ctx.save();
    ctx.translate(lover.x, lover.y);
    ctx.rotate(ang);
    ctx.scale(stretch, 1 / Math.sqrt(stretch));
    var body = ctx.createRadialGradient(-rL*0.25, -rL*0.25, rL*0.1, 0, 0, rL);
    body.addColorStop(0, '#ffe9b0');
    body.addColorStop(0.45, '#f2b95e');
    body.addColorStop(1, '#c07f2e');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(0, 0, rL, 0, 6.2832); ctx.fill();
    ctx.restore();

    // live filament during reach: grows in, holds, fades
    if (filament && phase === 'reach'){
      var u = clamp(phaseT / DUR.reach, 0, 1);
      // grow 0-0.3, hold 0.3-0.7, fade 0.7-1
      var grow = clamp(u / 0.3, 0, 1);
      var fade = 1 - clamp((u - 0.7) / 0.3, 0, 1);
      var fa = 0.9 * grow * fade;
      // draw partial filament by interpolating end point along the curve
      var t = grow;
      var ex = (1-t)*(1-t)*filament.ax + 2*(1-t)*t*filament.cx + t*t*filament.bx;
      var ey = (1-t)*(1-t)*filament.ay + 2*(1-t)*t*filament.cy + t*t*filament.by;
      var cx2 = (1-t)*filament.ax + t*filament.cx;
      var cy2 = (1-t)*filament.ay + t*filament.cy;
      // bright core + soft halo
      drawFilament({ ax: filament.ax, ay: filament.ay, bx: ex, by: ey, cx: cx2, cy: cy2 }, fa * 0.35, 5 * S, true);
      drawFilament({ ax: filament.ax, ay: filament.ay, bx: ex, by: ey, cx: cx2, cy: cy2 }, fa, 1.6 * S, true);
      // tip glow
      ctx.fillStyle = 'rgba(255,230,170,' + (fa * 0.9) + ')';
      ctx.beginPath(); ctx.arc(ex, ey, 3.2 * S, 0, 6.2832); ctx.fill();
    }
  }

  // ---- loop ----
  var last = performance.now();
  var running = true;
  function frame(now){
    if (!running) return;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    step(dt);
    draw(now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ running = false; }
    else { running = true; last = performance.now(); requestAnimationFrame(frame); }
  });
  window.addEventListener('blur', function(){ running = false; });
  window.addEventListener('focus', function(){
    if (!running){ running = true; last = performance.now(); requestAnimationFrame(frame); }
  });
})();
</script>
</body>
</html>
