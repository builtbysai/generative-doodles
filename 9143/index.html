<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№9143 — Rooted</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0b0813; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  .cap {
    position:fixed; left:0; right:0; bottom:18px; text-align:center;
    color:rgba(232,225,240,.42); font:12px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing:.14em; text-transform:uppercase; pointer-events:none; user-select:none;
  }
  .cap b { color:rgba(232,200,140,.62); font-weight:600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">№9143 — <b>Rooted</b> &nbsp;·&nbsp; “Only sin is loving you knowing I can’t have you”</div>
<script>
(function(){
  "use strict";
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, S = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H) / 700;
    buildField();
  }
  window.addEventListener('resize', resize);

  // ---- moon ----
  function moonPos(t){
    if (H > W) return { x: W * 0.5, y: H * 0.20 + Math.sin(t * 0.18) * 3 * S };
    return { x: W * 0.72, y: H * 0.22 + Math.sin(t * 0.18) * 3 * S };
  }

  // ---- field of stems ----
  var stems = [];
  var petals = [];
  var stars = [];

  function buildField(){
    stems = [];
    var n = Math.round(Math.max(18, Math.min(34, W / 34)));
    for (var i = 0; i < n; i++){
      var fx = (i + 0.5) / n;               // 0..1 across the width
      var bx = fx * W + (Math.random() - 0.5) * 14 * S;
      var hgt = (0.30 + Math.random() * 0.28) * H;   // stem height
      var hue = 38 + Math.random() * 10;             // gold range
      stems.push({
        bx: bx, hgt: hgt, hue: hue,
        phase: Math.random() * 6.283,
        swayAmp: (0.05 + Math.random() * 0.06),
        swaySpd: 0.25 + Math.random() * 0.35,
        bloomR: (7 + Math.random() * 6) * S,
        bloomPh: Math.random() * 6.283,
        leanJit: (Math.random() - 0.5) * 0.10
      });
    }
    stars = [];
    for (var s = 0; s < 80; s++){
      stars.push({ x: Math.random(), y: Math.random(), r: 0.4 + Math.random()*1.1, a: 0.10 + Math.random()*0.28, p: Math.random()*6.28 });
    }
  }

  // tip of a stem at time t (leaning toward the moon)
  function stemTip(st, t){
    var m = moonPos(t);
    // direction from base to moon
    var dx = m.x - st.bx, dy = (H + 10) - m.y;
    var d = Math.hypot(dx, dy) || 1;
    var ux = dx / d, uy = -dy / d; // upward toward moon
    // lean: how far the tip bends toward the moon (0.35..0.62 of height, more for taller stems)
    var lean = 0.30 + (st.hgt / H) * 0.55 + st.leanJit;
    var sway = Math.sin(t * st.swaySpd + st.phase) * st.swayAmp;
    // tip position: base + up*height, bent toward moon by lean, plus sway perpendicular
    var upx = 0, upy = -1;
    var tx = st.bx + ux * st.hgt * lean + upx * st.hgt * (1 - lean) + (-uy) * sway * st.hgt * 0.5;
    var ty = (H + 10) + uy * st.hgt * lean + upy * st.hgt * (1 - lean) + (ux) * sway * st.hgt * 0.5;
    return { x: tx, y: ty, ux: ux, uy: uy, lean: lean };
  }

  function step(dt, t){
    // spawn petals from random blooms
    if (Math.random() < 0.55 && stems.length){
      var st = stems[(Math.random() * stems.length) | 0];
      var tip = stemTip(st, t);
      var m = moonPos(t);
      petals.push({
        x: tip.x, y: tip.y,
        tx: m.x, ty: m.y,
        life: 0, max: 4.5 + Math.random() * 2.5,
        r: (2.2 + Math.random() * 2.2) * S,
        flut: Math.random() * 6.283,
        flutAmp: (6 + Math.random() * 10) * S,
        rot: Math.random() * 6.283,
        rotSpd: (Math.random() - 0.5) * 1.2
      });
    }
    for (var i = petals.length - 1; i >= 0; i--){
      var p = petals[i];
      p.life += dt;
      var u = p.life / p.max;
      if (u >= 1){ petals.splice(i, 1); continue; }
      // rise toward the moon, easing out; flutter sideways; dissolve before arriving
      var e = 1 - Math.pow(1 - u, 2);
      if (p.sx === undefined){ p.sx = p.x; p.sy = p.y; }
      var px = p.sx + (p.tx - p.sx) * e * 0.72;
      var py = p.sy + (p.ty - p.sy) * e * 0.72;
      p.x = px + Math.sin(p.life * 2.2 + p.flut) * p.flutAmp * (1 - u * 0.5);
      p.y = py;
      p.rot += p.rotSpd * dt;
    }
    if (petals.length > 90) petals.splice(0, petals.length - 90);
  }

  function drawStem(st, t){
    var tip = stemTip(st, t);
    var bx = st.bx, by = H + 10;
    // control point: bend toward the moon
    var cx = (bx + tip.x) / 2 + (tip.ux) * st.hgt * 0.18;
    var cy = (by + tip.y) / 2;
    // gradient along the stem: dark root to bright gold tip
    var g = ctx.createLinearGradient(bx, by, tip.x, tip.y);
    g.addColorStop(0, 'rgba(120,80,30,0.55)');
    g.addColorStop(0.6, 'hsla(' + st.hue + ',70%,55%,0.75)');
    g.addColorStop(1, 'hsla(' + (st.hue + 6) + ',85%,68%,0.95)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.8 * S;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(cx, cy, tip.x, tip.y);
    ctx.stroke();
    return tip;
  }

  function drawBloom(tip, st, t){
    var pulse = 1 + 0.16 * Math.sin(t * 0.9 + st.bloomPh);
    var r = st.bloomR * pulse;
    // glow
    var gl = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, r * 3.4);
    gl.addColorStop(0, 'hsla(' + st.hue + ',90%,65%,0.34)');
    gl.addColorStop(0.6, 'hsla(' + st.hue + ',85%,55%,0.08)');
    gl.addColorStop(1, 'hsla(' + st.hue + ',85%,55%,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(tip.x, tip.y, r * 3.4, 0, 6.2832); ctx.fill();
    // petals: 5 ellipses around the core
    ctx.save();
    ctx.translate(tip.x, tip.y);
    for (var k = 0; k < 5; k++){
      ctx.rotate(6.2832 / 5);
      ctx.fillStyle = 'hsla(' + (st.hue + 4) + ',88%,66%,0.92)';
      ctx.beginPath();
      ctx.ellipse(r * 0.62, 0, r * 0.62, r * 0.34, 0, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
    // bright core
    ctx.fillStyle = '#ffedbe';
    ctx.beginPath(); ctx.arc(tip.x, tip.y, r * 0.42, 0, 6.2832); ctx.fill();
  }

  function draw(now){
    var t = now;
    ctx.clearRect(0, 0, W, H);
    // dusk background: deep violet, warmer near the horizon
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0d0a1c');
    bg.addColorStop(0.55, '#141024');
    bg.addColorStop(0.85, '#1d1428');
    bg.addColorStop(1, '#120c1a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // stars
    for (var i = 0; i < stars.length; i++){
      var st = stars[i];
      var tw = 0.7 + 0.3 * Math.sin(now * 0.6 + st.p);
      ctx.fillStyle = 'rgba(205,195,235,' + (st.a * tw) + ')';
      ctx.beginPath(); ctx.arc(st.x * W, st.y * H, st.r * S, 0, 6.2832); ctx.fill();
    }

    // moon
    var m = moonPos(t);
    var rM = 26 * S;
    var breathe = 1 + 0.04 * Math.sin(now * 0.4);
    var rm = rM * breathe;
    var halo = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, rm * 4.6);
    halo.addColorStop(0, 'rgba(200,215,255,0.32)');
    halo.addColorStop(0.5, 'rgba(175,195,250,0.09)');
    halo.addColorStop(1, 'rgba(175,195,250,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(m.x, m.y, rm * 4.6, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#e9effd';
    ctx.beginPath(); ctx.arc(m.x, m.y, rm, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(m.x - rm*0.3, m.y - rm*0.3, rm*0.45, 0, 6.2832); ctx.fill();
    // faint craters
    ctx.fillStyle = 'rgba(180,195,230,0.35)';
    ctx.beginPath(); ctx.arc(m.x + rm*0.35, m.y + rm*0.2, rm*0.16, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(m.x - rm*0.1, m.y + rm*0.45, rm*0.11, 0, 6.2832); ctx.fill();

    // ground mist
    var mist = ctx.createLinearGradient(0, H * 0.86, 0, H);
    mist.addColorStop(0, 'rgba(40,28,60,0)');
    mist.addColorStop(1, 'rgba(40,28,60,0.55)');
    ctx.fillStyle = mist;
    ctx.fillRect(0, H * 0.86, W, H * 0.14);

    // stems (back to front: shorter first)
    var order = stems.slice().sort(function(a, b){ return a.hgt - b.hgt; });
    var tips = [];
    for (var j = 0; j < order.length; j++){
      var tip = drawStem(order[j], t);
      tips.push({ tip: tip, st: order[j] });
    }
    // blooms on top
    for (var k = 0; k < tips.length; k++){
      drawBloom(tips[k].tip, tips[k].st, t);
    }

    // petals drifting up, dissolving before the moon
    for (var p = 0; p < petals.length; p++){
      var pt = petals[p];
      var u = pt.life / pt.max;
      var a = 0.85 * (u < 0.15 ? u / 0.15 : 1) * (1 - u);
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(pt.rot);
      ctx.fillStyle = 'rgba(245,205,120,' + Math.max(0, a) + ')';
      ctx.beginPath();
      ctx.ellipse(0, 0, pt.r * 1.5, pt.r * 0.8, 0, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }
  }

  // ---- loop ----
  resize();
  var last = performance.now();
  var running = true;
  function frame(nowMs){
    if (!running) return;
    var dt = Math.min(0.05, (nowMs - last) / 1000);
    last = nowMs;
    var t = nowMs / 1000;
    step(dt, t);
    draw(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ running = false; }
    else { running = true; last = performance.now(); requestAnimationFrame(frame); }
  });
  window.addEventListener('blur', function(){ running = false; });
  window.addEventListener('focus', function(){
    if (!running){ running = true; last = performance.now(); requestAnimationFrame(frame); }
  });
})();
</script>
</body>
</html>
