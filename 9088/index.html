<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9088 · Split Tide</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f3eee3; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; cursor:ew-resize; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  "use strict";
  var TAU = Math.PI * 2;
  var LOOP = 20; // seconds, seamless
  var MAXD = 6;
  var PAPER = '#f3eee3', PAPER_LT = '#f8f4eb', INK = '#17130d', RED = '#c8402a';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;

  // ---------- fixed split tree (structure only; geometry is a pure function of phase) ----------
  var _s = 9088;
  function rnd(){ _s = ((_s * 1664525 + 1013904223) >>> 0); return _s / 4294967296; }
  function build(depth){
    var node = { depth: depth, seed: rnd(), theta0: rnd() * Math.PI, k: rnd() < 0.5 ? 1 : 2, hash: rnd() };
    if (depth < MAXD){ node.left = build(depth + 1); node.right = build(depth + 1); }
    return node;
  }
  var root = build(0);

  // half-plane clip: keep points where sign * dot(p - p0, n) <= 0
  function clipHalf(poly, px0, py0, nx, ny, sign){
    var out = [], i, a, b, da, db, t;
    for (i = 0; i < poly.length; i++){
      a = poly[i]; b = poly[(i + 1) % poly.length];
      da = sign * ((a[0] - px0) * nx + (a[1] - py0) * ny);
      db = sign * ((b[0] - px0) * nx + (b[1] - py0) * ny);
      if (da <= 0) out.push(a);
      if ((da < 0 && db > 0) || (da > 0 && db < 0)){
        t = da / (da - db);
        out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
      }
    }
    return out;
  }

  function bbox(poly){
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, i, p;
    for (i = 0; i < poly.length; i++){
      p = poly[i];
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    }
    return [x0, y0, x1, y1];
  }

  function drawPoly(poly, fill){
    var i;
    ctx.beginPath();
    ctx.moveTo(OX + poly[0][0], OY + poly[0][1]);
    for (i = 1; i < poly.length; i++) ctx.lineTo(OX + poly[i][0], OY + poly[i][1]);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = Math.max(2, S * 0.004);
    ctx.strokeStyle = INK;
    ctx.stroke();
  }

  function render(node, poly, phase){
    if (node.depth >= MAXD || poly.length < 3){
      var fill = (node.depth % 2 === 0) ? PAPER_LT : INK;
      if (node.depth === MAXD && node.hash < 0.15) fill = RED;
      drawPoly(poly, fill);
      return;
    }
    var bb = bbox(poly);
    var cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
    var minDim = Math.min(bb[2] - bb[0], bb[3] - bb[1]);
    var theta = node.theta0 + 0.85 * Math.sin(TAU * node.k * phase + node.seed * TAU);
    var dx = Math.cos(theta), dy = Math.sin(theta);
    var nx = -dy, ny = dx;
    var off = 0.30 * minDim * Math.sin(TAU * phase + node.seed * TAU * 1.7);
    var px0 = cx + nx * off, py0 = cy + ny * off;
    var left = clipHalf(poly, px0, py0, nx, ny, 1);
    var right = clipHalf(poly, px0, py0, nx, ny, -1);
    if (left.length < 3 || right.length < 3){
      drawPoly(poly, (node.depth % 2 === 0) ? PAPER_LT : INK);
      return;
    }
    render(node.left, left, phase);
    render(node.right, right, phase);
  }

  function resize(){
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H) * 0.9;
    OX = (W - S) / 2; OY = (H - S) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- loop phase: drag scrubs, double-tap resets ----------
  var t0 = performance.now();
  var scrub = 0, dragging = false, lastX = 0, lastTap = 0;

  function phase(){
    var el = (performance.now() - t0) / 1000;
    var p = (el / LOOP + scrub) % 1;
    return p < 0 ? p + 1 : p;
  }

  function frame(){
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    // frame
    ctx.lineWidth = Math.max(3, S * 0.008);
    ctx.strokeStyle = INK;
    ctx.strokeRect(OX, OY, S, S);
    var poly = [[0, 0], [S, 0], [S, S], [0, S]];
    render(root, poly, phase());
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  canvas.addEventListener('pointerdown', function(e){
    dragging = true; lastX = e.clientX;
    var now = Date.now();
    if (now - lastTap < 320){ scrub = 0; t0 = performance.now(); lastTap = 0; }
    else lastTap = now;
  });
  canvas.addEventListener('pointermove', function(e){
    if (!dragging) return;
    scrub += (e.clientX - lastX) / 600;
    lastX = e.clientX;
  });
  function end(){ dragging = false; }
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', end);
})();
</script>
</body>
</html>
