<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Inside-Out Sun</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0B0814;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  // Frame one is a fixed phase: t = 10s. The fluid is mid-swirl, the
  // breathing pulse (4s period) is mid-rise, the room is washed purple.
  var T0 = 10;
  var WORLD = 1000;
  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');
  var currentT = T0;
  var view = { w: 0, h: 0, dpr: 1, scale: 1, ox: 0, oy: 0, phone: false };

  var COLORS = {
    room: '#0B0814',
    wash: '#5A2E8F',
    greenDeep: '#1FD6A6',
    greenBright: '#3DF5C0',
    violet: '#7A4DFF',
    glow: '#CFFFEF',
    base: '#0C231E',
    rig: '#2E2350',
    rigBar: '#241A3D'
  };

  // Sphere geometry, world units. Diameter 550 = 55% of the frame.
  var CX = 500, CY = 462, R = 275;
  var FLOOR_Y = 806;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, u) { return a + (b - a) * u; }

  function resize() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    }
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(vw * dpr));
    canvas.height = Math.max(1, Math.round(vh * dpr));
    var screenMin = 0;
    if (window.screen) screenMin = Math.min(window.screen.width || 0, window.screen.height || 0);
    var phone = screenMin > 0 ? screenMin < 700 : vh > vw * 1.15;
    var scale = Math.min(vw / WORLD, vh / WORLD);
    view = {
      w: vw,
      h: vh,
      dpr: dpr,
      scale: scale,
      ox: (vw - WORLD * scale) / 2,
      oy: (vh - WORLD * scale) / 2,
      phone: phone
    };
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT); });
  }
  window.addEventListener('resize', function () { resize(); draw(currentT); });
  resize();

  // ---- Seeded value noise ----------------------------------------------
  function hash2(ix, iy, seed) {
    var n = (ix * 374761393 + iy * 668265263 + seed * 974634211) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
  }
  function vnoise(x, y, seed) {
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    var a = hash2(ix, iy, seed), b = hash2(ix + 1, iy, seed);
    var c = hash2(ix, iy + 1, seed), d = hash2(ix + 1, iy + 1, seed);
    return lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
  }
  function fbm(x, y, seed) {
    var v = 0, amp = 0.55, tot = 0, f = 1;
    for (var o = 0; o < 3; o++) {
      v += amp * vnoise(x * f, y * f, seed + o * 131);
      tot += amp;
      amp *= 0.5;
      f *= 2.13;
    }
    return v / tot; // 0..1
  }

  // Scalar potential of the fluid in disc coords (x,y in -1..1). The flow
  // runs along the perpendicular gradient of a domain-warped fBm: pure
  // liquid swirls, no landmasses. te = flow time (visitor-quickened).
  function potential(x, y, te) {
    var wx = (fbm(x * 0.95 + 3.7 + te * 0.31, y * 0.95 + 9.1 - te * 0.17, 41) - 0.5) * 1.35;
    var wy = (fbm(x * 0.95 + 17.3 - te * 0.23, y * 0.95 + 5.9 + te * 0.29, 87) - 0.5) * 1.35;
    return fbm((x + wx) * 1.0 + te * 0.11, (y + wy) * 1.0 - te * 0.07, 7);
  }
  // Returns [dirX, dirY, speed01] of the flow at disc point (x,y).
  function flowAt(x, y, te) {
    var e = 0.05;
    var p0 = potential(x, y, te);
    var px = potential(x + e, y, te);
    var py = potential(x, y + e, te);
    var gx = (px - p0) / e, gy = (py - p0) / e;
    var mag = Math.sqrt(gx * gx + gy * gy);
    if (mag < 1e-6) return [1, 0, 0];
    // Perpendicular gradient: curl-like swirl along iso-lines of the warp.
    return [-gy / mag, gx / mag, clamp(mag * 0.85, 0, 1)];
  }

  function hexRGB(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  var C_DEEP = hexRGB(COLORS.greenDeep), C_BRIGHT = hexRGB(COLORS.greenBright), C_VIO = hexRGB(COLORS.violet);
  function fluidColor(s, alpha) {
    var a, b, u;
    if (s < 0.5) { a = C_DEEP; b = C_BRIGHT; u = s * 2; }
    else { a = C_BRIGHT; b = C_VIO; u = (s - 0.5) * 2; }
    var r = Math.round(lerp(a[0], b[0], u));
    var g = Math.round(lerp(a[1], b[1], u));
    var bl = Math.round(lerp(a[2], b[2], u));
    return 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha.toFixed(3) + ')';
  }

  // ---- Visitor -----------------------------------------------------------
  // Recorded pointer state only; every influence is a closed-form function
  // of the recorded events and t.
  var visitor = { down: false, x: 0, y: 0, tDown: 0, tUp: -1, closeAtUp: 0, has: false };

  function closeness(t) {
    if (!visitor.has) return 0;
    var dx = visitor.x - CX, dy = visitor.y - CY;
    var prox = clamp(1.15 - Math.sqrt(dx * dx + dy * dy) / (2.3 * R), 0, 1);
    if (visitor.down) {
      return clamp((t - visitor.tDown) / 0.6, 0, 1) * prox;
    }
    if (visitor.tUp >= 0) {
      return visitor.closeAtUp * Math.exp(-(t - visitor.tUp) / 2.5);
    }
    return 0;
  }

  function toWorld(e) {
    var rect = canvas.getBoundingClientRect();
    var px = (e.clientX - rect.left) * (view.w / Math.max(1, rect.width));
    var py = (e.clientY - rect.top) * (view.h / Math.max(1, rect.height));
    return [(px - view.ox) / view.scale, (py - view.oy) / view.scale];
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = toWorld(e);
    visitor.down = true; visitor.has = true;
    visitor.x = p[0]; visitor.y = p[1];
    visitor.tDown = currentT; visitor.tUp = -1;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!visitor.down) return;
    var p = toWorld(e);
    visitor.x = p[0]; visitor.y = p[1];
  });
  function endVisit() {
    if (!visitor.down) return;
    visitor.closeAtUp = closeness(currentT);
    visitor.down = false;
    visitor.tUp = currentT;
  }
  canvas.addEventListener('pointerup', endVisit);
  canvas.addEventListener('pointercancel', endVisit);
  canvas.addEventListener('pointerleave', endVisit);

  // ---- Drawing -----------------------------------------------------------
  function circle(x, y, r, style) {
    ctx.fillStyle = style;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRig() {
    ctx.strokeStyle = COLORS.rig;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(452, 40); ctx.lineTo(428, CY - R + 14);
    ctx.moveTo(548, 40); ctx.lineTo(572, CY - R + 14);
    ctx.stroke();
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(CX, 44); ctx.lineTo(CX, CY - R);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = COLORS.rigBar;
    ctx.fillRect(428, 30, 144, 9);
    ctx.fillRect(CX - 14, 39, 28, 13);
  }

  function drawReflection(pulse) {
    // Squashed, dim echo of the sphere's lower bands on the floor.
    ctx.fillStyle = COLORS.wash;
    ctx.globalAlpha = 0.10 + 0.05 * pulse;
    ctx.beginPath();
    ctx.ellipse(CX, FLOOR_Y + 26, R * 1.02, 30, 0, 0, Math.PI * 2);
    ctx.fill();
    for (var i = 0; i < 6; i++) {
      var y = FLOOR_Y + 10 + i * 15;
      var rx = R * (0.94 - i * 0.085);
      ctx.fillStyle = i % 2 === 0 ? COLORS.greenDeep : COLORS.violet;
      ctx.globalAlpha = (0.11 - i * 0.014) * (0.65 + 0.6 * pulse);
      ctx.beginPath();
      ctx.ellipse(CX, y, rx, 4.6, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // One streamline layer: polar grid of samples, each traced as a short
  // multi-step polyline along the flow so the strokes bend like liquid
  // instead of cracking like foil. The coarse layer is the viscous body,
  // the fine layer is the surface sheen.
  function drawFluidLayer(te, rings, spokes, widthMul, alphaMul, steps, close, pulse) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var ri = 1; ri <= rings; ri++) {
      var rr = Math.pow(ri / rings, 0.82); // disc radius 0..1, denser core
      for (var si = 0; si < spokes; si++) {
        var ang = (si / spokes) * Math.PI * 2 + (ri % 2) * (Math.PI / spokes);
        var x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
        var f = flowAt(x, y, te);
        var s = f[2];
        // Visitor: fluid quickens and brightens near the pointer.
        var boost = 0;
        if (close > 0.003) {
          var vx = (visitor.x - CX) / R, vy = (visitor.y - CY) / R;
          var dvx = x - vx, dvy = y - vy;
          var d2 = dvx * dvx + dvy * dvy;
          boost = close * Math.exp(-d2 / 0.16);
        }
        var sEff = clamp(s + boost * 0.55, 0, 1);
        var alpha = (0.13 + 0.55 * sEff) * alphaMul * (0.8 + 0.35 * pulse) + boost * 0.3;
        ctx.strokeStyle = fluidColor(sEff, clamp(alpha, 0, 0.95));
        ctx.lineWidth = widthMul * (0.8 + sEff * 0.9);
        // Trace the streamline both ways from the sample point.
        var ds = (0.020 + 0.030 * sEff + boost * 0.012);
        var pts = [[x, y]];
        var px = x, py = y, pf = f;
        for (var k = 0; k < steps; k++) {
          px += pf[0] * ds; py += pf[1] * ds;
          if (px * px + py * py > 1.02) break;
          pts.push([px, py]);
          pf = flowAt(px, py, te);
        }
        px = x; py = y; pf = f;
        for (var k2 = 0; k2 < steps; k2++) {
          px -= pf[0] * ds; py -= pf[1] * ds;
          if (px * px + py * py > 1.02) break;
          pts.unshift([px, py]);
          pf = flowAt(px, py, te);
        }
        ctx.beginPath();
        for (var pi = 0; pi < pts.length; pi++) {
          var wx = CX + pts[pi][0] * R, wy = CY + pts[pi][1] * R;
          if (pi === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
        }
        ctx.stroke();
        if (widthMul < 3 && sEff > 0.86) {
          circle(CX + x * R, CY + y * R, 1.7, 'rgba(207,255,239,' + (0.34 * (sEff - 0.86) / 0.14).toFixed(3) + ')');
        }
      }
    }
  }

  function draw(t) {
    currentT = t;
    canvas.style.width = view.w + 'px';
    canvas.style.height = view.h + 'px';
    ctx.setTransform(view.dpr || 1, 0, 0, view.dpr || 1, 0, 0);
    ctx.fillStyle = COLORS.room;
    ctx.fillRect(0, 0, view.w, view.h);
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.scale, view.scale);

    var close = closeness(t);
    // Breathing pulse: 4s period, quickening as the visitor draws near.
    // At t = T0 with no visitor: pulse = 0.5, mid-rise.
    var period = 4 / (1 + 0.9 * close);
    var pulse = 0.5 - 0.5 * Math.sin(2 * Math.PI * t / period);
    // Flow time: slow autonomous drift, quickened by the visitor.
    var te = t * 0.055 * (1 + 1.6 * close);

    // Room wash: the room glows purple from the sphere's light.
    ctx.fillStyle = COLORS.wash;
    ctx.globalAlpha = 0.10 + 0.13 * pulse;
    ctx.fillRect(0, 0, WORLD, WORLD);
    ctx.globalAlpha = 1;
    circle(CX, CY, R * 1.95, 'rgba(90,46,143,' + (0.035 + 0.035 * pulse).toFixed(3) + ')');
    circle(CX, CY, R * 1.68, 'rgba(90,46,143,' + (0.045 + 0.045 * pulse).toFixed(3) + ')');
    circle(CX, CY, R * 1.42, 'rgba(90,46,143,' + (0.06 + 0.06 * pulse).toFixed(3) + ')');

    drawRig();
    drawReflection(pulse);

    // Outer glow: layered flat-alpha circles following the pulse.
    var glowPulse = 1 + 0.045 * pulse;
    circle(CX, CY, R * 1.30 * glowPulse, 'rgba(207,255,239,0.020)');
    circle(CX, CY, R * 1.18 * glowPulse, 'rgba(207,255,239,0.032)');
    circle(CX, CY, R * 1.09 * glowPulse, 'rgba(207,255,239,0.050)');
    circle(CX, CY, R * 1.03 * glowPulse, 'rgba(207,255,239,0.075)');

    // Sphere body.
    circle(CX, CY, R, COLORS.base);
    ctx.save();
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.clip();
    // Violet depth wash inside the lower fluid.
    circle(CX, CY + R * 0.42, R * 0.95, 'rgba(122,77,255,0.10)');
    circle(CX, CY - R * 0.4, R * 0.9, 'rgba(31,214,166,0.08)');
    drawFluidLayer(te, 10, 20, 10, 0.55, 3, close, pulse);  // viscous underlay
    drawFluidLayer(te, 24, 40, 2.4, 1.0, 4, close, pulse);  // surface streamlines
    // Inner glow.
    circle(CX, CY, R * 0.97, 'rgba(207,255,239,' + (0.028 + 0.03 * pulse).toFixed(3) + ')');
    circle(CX, CY, R * 0.78, 'rgba(207,255,239,' + (0.022 + 0.024 * pulse).toFixed(3) + ')');
    ctx.restore();

    // Rim light: thin bright arc + an upper highlight.
    ctx.strokeStyle = 'rgba(207,255,239,' + (0.5 + 0.32 * pulse).toFixed(3) + ')';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(CX, CY, R - 1, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(207,255,239,' + (0.30 + 0.25 * pulse).toFixed(3) + ')';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(CX, CY, R - 5, -2.45, -0.75);
    ctx.stroke();
  }

  function frame(ms) {
    var t = T0 + (typeof ms === 'number' && isFinite(ms) ? ms / 1000 : 0);
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  frame(0);
})();
</script>
</body>
</html>
