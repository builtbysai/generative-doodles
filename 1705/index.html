<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Totem of Soft Masses</title>
<style>
html, body { margin: 0; padding: 0; background: #F4EDE3; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F4EDE3';
var PLATE = '#EFE3D2';
var PLATE_LINE = 'rgba(36,30,34,0.40)';
var TITLE_INK = '#241E22';
var HINT_INK = '#6B5560';
var RIM = '#241E22';
var LOOP_PERIOD = 48;
var FRAME_ONE_T = 6.0;
var BLOB_COUNT = 5;
var FILL_COLS = ['#D48C9C', '#7E5AA2', '#2E7F7B', '#D89AA6', '#8A63B0'];
var SHADE_COLS = ['#A85F70', '#5B3E7D', '#1F5B57', '#B06A7C', '#6B4A8C'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- seeded value noise (lattice hash + smooth interpolation) ---- */
var rng = mulberry32(1705);
var PERM = new Array(256);
var pi;
for (pi = 0; pi < 256; pi++) PERM[pi] = pi;
for (pi = 255; pi > 0; pi--) {
  var pj = Math.floor(rng() * (pi + 1));
  var tmp = PERM[pi]; PERM[pi] = PERM[pj]; PERM[pj] = tmp;
}
function hash2(ix, iy) {
  return PERM[(PERM[ix & 255] + iy) & 255] / 255;
}
function vnoise(x, y) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var sx = smooth(fx), sy = smooth(fy);
  var a = hash2(ix, iy), b = hash2(ix + 1, iy);
  var c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
function fbm(x, y, oct) {
  var sum = 0, amp = 0.5, f = 1, o, norm = 0;
  for (o = 0; o < oct; o++) {
    sum += amp * vnoise(x * f, y * f);
    norm += amp;
    amp *= 0.5; f *= 2.03;
  }
  return sum / norm;
}
/* ---- per-blob seeded parameters ---- */
var BLOBS = [];
var bi;
for (bi = 0; bi < BLOB_COUNT; bi++) {
  BLOBS.push({
    rFrac: 0.100 + rng() * 0.030,
    offFrac: (bi % 2 === 0 ? -1 : 1) * (0.010 + rng() * 0.022),
    driftAmp: 0.004 + rng() * 0.006,
    driftPhase: rng() * TAU,
    driftPeriod: 30 + rng() * 18,
    breathPhase: rng() * TAU,
    breathPeriod: 11 + rng() * 7,
    nSeed: rng() * 40,
    asymPhase: rng() * TAU
  });
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- stack lean: whole totem sways and rebalances, closed form ---- */
function leanAt(t) {
  return 0.05 * Math.sin(TAU * t / LOOP_PERIOD) + 0.018 * Math.sin(TAU * t / 17.3 + 1.2);
}
/* ---- blob polar radius: layered fbm over the wrapped angle + asymmetry ---- */
function blobRadius(b, th, t, R) {
  var nx = Math.cos(th) * 1.6 + b.nSeed;
  var ny = Math.sin(th) * 1.6 + b.nSeed * 0.7 + t * 0.045;
  var n = (fbm(nx, ny, 3) - 0.5) * 2;
  var asym = 0.045 * Math.sin(2 * th + b.asymPhase + 0.03 * t);
  var breath = 1 + 0.03 * Math.sin(TAU * t / b.breathPeriod + b.breathPhase);
  return R * breath * (1 + 0.105 * n + asym);
}
/* ---- blob centres for a given time (before lean rotation) ---- */
function blobCenters(t, st) {
  /* centered geometric piece keeps its shape on phones, but the stack is
     tall, so on phones size it against the viewport height, not the width */
  var S = isPhone ? Math.min(VH * 0.94, VW * 2.05) : Math.min(st.w, st.h);
  var cx = st.x + st.w / 2;
  var cy = st.y + st.h / 2;
  var centers = [];
  var i, r, spacing;
  var total = 0;
  var rs = [];
  for (i = 0; i < BLOB_COUNT; i++) {
    r = S * BLOBS[i].rFrac;
    rs.push(r);
    if (i > 0) total += 0.72 * (rs[i - 1] + r);
  }
  var y = cy - total / 2;
  for (i = 0; i < BLOB_COUNT; i++) {
    var drift = S * BLOBS[i].driftAmp * Math.sin(TAU * t / BLOBS[i].driftPeriod + BLOBS[i].driftPhase);
    centers.push({ x: cx + S * BLOBS[i].offFrac + drift, y: y, r: rs[i] });
    if (i < BLOB_COUNT - 1) y += 0.72 * (rs[i] + rs[i + 1]);
  }
  return centers;
}
/* ---- rim thickness at angle th: base plus pressure bumps at contacts ---- */
function rimWidth(b, idx, th, t, centers, R) {
  var wBase = R * 0.045;
  var w = wBase;
  var j, c, dx, dy, d, overlap, pressure, ang, diff, g;
  for (j = 0; j < BLOB_COUNT; j++) {
    if (j === idx) continue;
    c = centers[j];
    dx = c.x - centers[idx].x; dy = c.y - centers[idx].y;
    d = Math.sqrt(dx * dx + dy * dy);
    overlap = (centers[idx].r + c.r) - d;
    if (overlap <= 0) continue;
    pressure = clamp(overlap / (0.30 * (centers[idx].r + c.r)), 0, 1);
    ang = Math.atan2(dy, dx);
    diff = Math.atan2(Math.sin(th - ang), Math.cos(th - ang));
    g = Math.exp(-(diff * diff) / (2 * 0.55 * 0.55));
    w += R * 0.105 * pressure * g;
  }
  return w;
}
function blobOutline(b, idx, cx, cy, t, centers, scale) {
  var R = centers[idx].r * scale;
  var seg, th, rr;
  ctx.beginPath();
  for (seg = 0; seg <= 96; seg++) {
    th = seg / 96 * TAU;
    rr = blobRadius(b, th, t, R);
    if (seg === 0) ctx.moveTo(cx + rr * Math.cos(th), cy + rr * Math.sin(th));
    else ctx.lineTo(cx + rr * Math.cos(th), cy + rr * Math.sin(th));
  }
  ctx.closePath();
}
var clockT = FRAME_ONE_T;
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var S = Math.min(st.w, st.h);
  var t = clockT;
  var centers = blobCenters(t, st);
  var lean = leanAt(t);
  var pivot = centers[BLOB_COUNT - 1];
  /* soft ground shadow under the stack */
  ctx.save();
  ctx.translate(pivot.x, pivot.y + pivot.r * 0.95);
  ctx.scale(1, 0.28);
  ctx.fillStyle = 'rgba(36,30,34,0.10)';
  ctx.beginPath();
  ctx.arc(0, 0, pivot.r * 1.15, 0, TAU);
  ctx.fill();
  ctx.restore();
  var i, b, c, cx, cy, th, seg, ro, ri, w, rOut, rIn;
  for (i = 0; i < BLOB_COUNT; i++) {
    b = BLOBS[i];
    c = centers[i];
    /* lean rotation about the base blob */
    var dx = c.x - pivot.x, dy = c.y - pivot.y;
    var cs = Math.cos(lean), sn = Math.sin(lean);
    cx = pivot.x + dx * cs - dy * sn;
    cy = pivot.y + dx * sn + dy * cs;
    /* body fill */
    blobOutline(b, i, cx, cy, t, centers, 1);
    ctx.fillStyle = FILL_COLS[i % FILL_COLS.length];
    ctx.fill();
    /* soft inner shading: darker inner offset, low alpha */
    ctx.save();
    blobOutline(b, i, cx, cy, t, centers, 1);
    ctx.clip();
    blobOutline(b, i, cx + c.r * 0.10, cy + c.r * 0.14, t, centers, 0.80);
    ctx.fillStyle = rgba(SHADE_COLS[i % SHADE_COLS.length], 0.22);
    ctx.fill();
    blobOutline(b, i, cx - c.r * 0.16, cy - c.r * 0.20, t, centers, 0.55);
    ctx.fillStyle = 'rgba(255,250,242,0.14)';
    ctx.fill();
    ctx.restore();
    /* rim: filled ring between the boundary and a pressure-thickened inner offset */
    ctx.beginPath();
    for (seg = 0; seg <= 96; seg++) {
      th = seg / 96 * TAU;
      rOut = blobRadius(b, th, t, c.r);
      if (seg === 0) ctx.moveTo(cx + rOut * Math.cos(th), cy + rOut * Math.sin(th));
      else ctx.lineTo(cx + rOut * Math.cos(th), cy + rOut * Math.sin(th));
    }
    for (seg = 96; seg >= 0; seg--) {
      th = seg / 96 * TAU;
      w = rimWidth(b, i, th, t, centers, c.r);
      rIn = Math.max(1, blobRadius(b, th, t, c.r) - w);
      ctx.lineTo(cx + rIn * Math.cos(th), cy + rIn * Math.sin(th));
    }
    ctx.closePath();
    ctx.fillStyle = RIM;
    ctx.fill();
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Totem of Soft Masses').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Totem of Soft Masses').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 12').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Totem of Soft Masses', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 12', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the stack breathe.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (tt) { clockT = tt; draw(); },
    blobCount: function () { return BLOB_COUNT; },
    leanRange: function () {
      var mn = 99, mx = -99, tt, v;
      for (tt = 0; tt <= 48; tt += 0.5) {
        v = leanAt(tt);
        if (v < mn) mn = v;
        if (v > mx) mx = v;
      }
      return { min: mn, max: mx };
    },
    rimRange: function (tt) {
      var st = stageRect();
      var centers = blobCenters(tt, st);
      var mn = 1e9, mx = -1e9, i, seg, th, w;
      for (i = 0; i < BLOB_COUNT; i++) {
        for (seg = 0; seg < 96; seg++) {
          th = seg / 96 * TAU;
          w = rimWidth(BLOBS[i], i, th, tt, centers, centers[i].r);
          if (w < mn) mn = w;
          if (w > mx) mx = w;
        }
      }
      return { min: mn, max: mx, base: centers[0].r * 0.045 };
    },
    clockT: function () { return clockT; }
  };
}
/* ---- frame one: fixed phase t = 6.0 s, full stack visible, rims thick at contacts ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT = (clockT + dt) % LOOP_PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
