<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ten Skies, One Cloud</title>
<style>
  html, body { margin: 0; padding: 0; background: #7FB8E8; overflow: hidden; height: 100%; }
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var T0 = 47;                 // fixed first-frame phase, seconds into the loop
  var LOOP = 156;              // his Ten Skies runtime: 2:36
  var BLUE_A = '#7FB8E8', BLUE_B = '#A8D0F0';
  var CLOUD_A = '#FFFFFF', CLOUD_B = '#E8F0F8';
  var GREEN = '#00B140', MAGENTA = '#FF2BD9', CYAN = '#00E5FF';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1, PHONE = false;

  // ---------- deterministic hashes / rng ----------
  function ihash(n) {
    n = n | 0;
    n = (n ^ 61) ^ (n >>> 16);
    n = (n + (n << 3)) | 0;
    n = n ^ (n >>> 4);
    n = Math.imul(n, 0x27d4eb2d);
    n = n ^ (n >>> 15);
    return (n >>> 0) / 4294967296;
  }
  function mulberry32(seed) {
    var a = seed | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- the ten skies ----------
  // Drift is measured in whole wrap-lengths per 156 s cycle (integer k),
  // so the loop closes exactly. Layer 5 has k = 0: the nearly still sky.
  var DRIFT_K = [-2, -1, 1, 2, -3, 0, 3, -1, 2, -2];
  var layers = [];
  (function buildLayers() {
    for (var L = 0; L < 10; L++) {
      var rng = mulberry32(1013 + L * 7717);
      var count = 5 + Math.floor(rng() * 4);       // 5..8 clouds
      var clouds = [];
      for (var i = 0; i < count; i++) {
        var circles = [];
        var nc = 5 + Math.floor(rng() * 4);        // 5..8 circles per cloud
        for (var k = 0; k < nc; k++) {
          circles.push({
            ox: (rng() * 2 - 1) * 0.52,
            oy: (rng() * 2 - 1) * 0.30,
            r: 0.34 + rng() * 0.28
          });
        }
        clouds.push({
          x0: -0.10 + rng() * 1.20,                // fraction of W
          y0: 0.05 + rng() * 0.86,                 // fraction of H
          R: 0.105 + rng() * 0.125,                // bounding radius, fraction of H
          bobM: 1 + Math.floor(rng() * 2),         // whole cycles per loop: periodic
          bobPh: rng() * 6.2831853,
          bobAmp: 0.006 + rng() * 0.010,
          circles: circles
        });
      }
      layers.push({
        k: DRIFT_K[L],
        cloudColor: (L % 2 === 0) ? CLOUD_A : CLOUD_B,
        plateBlue: (L % 2 === 0) ? BLUE_B : BLUE_A,
        alpha: 0.92 + rng() * 0.08,
        clouds: clouds
      });
    }
  })();

  // screen-space position of a cloud at piece-time t (seconds, absolute; looped inside)
  function cloudPos(layer, cl, t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var x = cl.x0 + 1.5 * layer.k * (lt / LOOP);   // drift, in W units
    x = ((x + 0.30) % 1.60 + 1.60) % 1.60 - 0.30;  // wrap over [-0.30, 1.30]
    var y = cl.y0 + cl.bobAmp * Math.sin(6.2831853 * cl.bobM * (lt / LOOP) + cl.bobPh);
    var Rpx = cl.R * Math.min(W, H);   // short side: density holds in portrait
    return { x: x * W, y: y * H, rx: Rpx, ry: Rpx * 0.66 };
  }

  // ---------- solo (drag on a cloud isolates its sky) ----------
  var holds = [];            // {t0, t1|null, layer}
  var activeHold = null;
  function pieceNow(startStamp) {
    return T0 + (Date.now() - startStamp) / 1000;
  }
  var START = Date.now();
  function soloAt(t) {
    // walk recorded hold intervals; s rises 0->1 in 0.4 s, decays in 0.6 s
    var s = 0, layer = -1;
    for (var i = 0; i < holds.length; i++) {
      var hd = holds[i];
      var end = (hd.t1 === null) ? t : hd.t1;
      if (t < hd.t0) break;
      var sStart = s;
      var riseEnd = Math.min(end, hd.t0 + (1 - sStart) * 0.4);
      if (t <= riseEnd) {
        s = Math.min(1, sStart + Math.max(0, t - hd.t0) / 0.4);
        layer = hd.layer;
        return { s: s, layer: layer };
      }
      var sPeak = Math.min(1, sStart + Math.max(0, riseEnd - hd.t0) / 0.4);
      if (hd.t1 === null || t <= hd.t1) { s = sPeak; layer = hd.layer; return { s: s, layer: layer }; }
      s = Math.max(0, sPeak - (t - hd.t1) / 0.6);
      layer = hd.layer;
      if (s === 0) layer = -1;
    }
    return { s: s, layer: layer };
  }
  function topmostLayerAt(px, py, t) {
    for (var L = 9; L >= 0; L--) {
      var lay = layers[L];
      for (var i = 0; i < lay.clouds.length; i++) {
        var p = cloudPos(lay, lay.clouds[i], t);
        var dx = (px - p.x) / p.rx, dy = (py - p.y) / p.ry;
        if (dx * dx + dy * dy <= 1) return L;
      }
    }
    return -1;
  }
  function onDown(e) {
    var t = pieceNow(START);
    var L = topmostLayerAt(e.clientX, e.clientY, t);
    if (L < 0) return;
    activeHold = { t0: t, t1: null, layer: L };
    holds.push(activeHold);
    if (holds.length > 24) holds.splice(0, holds.length - 24);
  }
  function onMove(e) {
    if (!activeHold) return;
    var t = pieceNow(START);
    var L = topmostLayerAt(e.clientX, e.clientY, t);
    if (L >= 0) activeHold.layer = L;
  }
  function onUp() {
    if (activeHold) { activeHold.t1 = pieceNow(START); activeHold = null; }
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  // ---------- sizing ----------
  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 1280);
    var h = vv ? vv.height : (window.innerHeight || 800);
    W = Math.max(50, Math.round(w));
    H = Math.max(50, Math.round(h));
    DPR = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) {
      DPR = Math.min(window.devicePixelRatio, 2);
    }
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width; sh = window.screen.height;
    }
    PHONE = (Math.min(sw, sh) < 700) || (H > W * 1.15);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', fit);
    }
    if (window.addEventListener) window.addEventListener('resize', fit);
  }

  // ---------- drawing ----------
  function drawCloud(lay, cl, t, alphaMul) {
    var p = cloudPos(lay, cl, t);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(1, 0.66);
    var i, c;
    // plate underlay: the layer's own sky blue, slipped down — the matte edge
    ctx.globalAlpha = 0.55 * alphaMul;
    ctx.fillStyle = lay.plateBlue;
    for (i = 0; i < cl.circles.length; i++) {
      c = cl.circles[i];
      ctx.beginPath();
      ctx.moveTo(c.ox * p.rx + c.r * p.rx, c.oy * p.rx + p.rx * 0.10);
      ctx.arc(c.ox * p.rx, c.oy * p.rx + p.rx * 0.10, c.r * p.rx, 0, 6.2831853);
      ctx.fill();
    }
    // the cloud itself
    ctx.globalAlpha = lay.alpha * alphaMul;
    ctx.fillStyle = lay.cloudColor;
    for (i = 0; i < cl.circles.length; i++) {
      c = cl.circles[i];
      ctx.beginPath();
      ctx.moveTo(c.ox * p.rx + c.r * p.rx, c.oy * p.rx);
      ctx.arc(c.ox * p.rx, c.oy * p.rx, c.r * p.rx, 0, 6.2831853);
      ctx.fill();
    }
    ctx.restore();
    return p;
  }

  // seam field: grid cells covered by clouds of >= 2 layers.
  // Marks are drawn on cell sides that face a cell covered by < 2 layers,
  // i.e. exactly along the silhouette edge of the upper keyed cloud.
  function drawSeams(pos, t, alphaMul) {
    var cell = Math.max(16, Math.min(30, Math.round(W / 56)));
    var cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
    var mask = new Int32Array(cols * rows);
    var i, j, L, ci;
    for (j = 0; j < rows; j++) {
      for (i = 0; i < cols; i++) {
        var px = (i + 0.5) * cell, py = (j + 0.5) * cell;
        var m = 0;
        for (L = 0; L < 10; L++) {
          var list = pos[L];
          for (ci = 0; ci < list.length; ci++) {
            var p = list[ci];
            if (px < p.x - p.rx || px > p.x + p.rx || py < p.y - p.ry || py > p.y + p.ry) continue;
            var dx = (px - p.x) / p.rx, dy = (py - p.y) / p.ry;
            if (dx * dx + dy * dy <= 1) { m |= (1 << L); break; }
          }
        }
        mask[j * cols + i] = m;
      }
    }
    function bits(m) { var b = 0; while (m) { b += m & 1; m >>= 1; } return b; }
    function seamAt(ii, jj) {
      if (ii < 0 || jj < 0 || ii >= cols || jj >= rows) return false;
      return bits(mask[jj * cols + ii]) >= 2;
    }
    var step = Math.floor(t * 2.5);        // seam shimmer, stepped ~2.5 Hz
    var fstep = Math.floor(t / 0.4);       // fleck set, changes every 0.4 s
    ctx.save();
    for (j = 0; j < rows; j++) {
      for (i = 0; i < cols; i++) {
        if (!seamAt(i, j)) continue;
        var cx = (i + 0.5) * cell, cy = (j + 0.5) * cell;
        var shimmer = 0.55 + 0.45 * ihash((i * 73856093) ^ (j * 19349663) ^ (step * 83492791));
        var ga = (0.55 + 0.45 * shimmer) * alphaMul;
        var x0 = i * cell, x1 = x0 + cell, y0 = j * cell, y1 = y0 + cell;
        // sides facing non-overlap: T R B L (0=top,1=right,2=bottom,3=left)
        var dirs = [
          !seamAt(i, j - 1), !seamAt(i + 1, j), !seamAt(i, j + 1), !seamAt(i - 1, j)
        ];
        for (var d = 0; d < 4; d++) {
          if (!dirs[d]) continue;
          // magenta fringe, pushed 3 px outward (away from the overlap)
          ctx.globalAlpha = 0.75 * ga;
          ctx.fillStyle = MAGENTA;
          if (d === 0) ctx.fillRect(x0, y0 - 4.5, cell, 2);
          if (d === 1) ctx.fillRect(x1 + 2.5, y0, 2, cell);
          if (d === 2) ctx.fillRect(x0, y1 + 2.5, cell, 2);
          if (d === 3) ctx.fillRect(x0 - 4.5, y0, 2, cell);
          // the hard green key edge itself
          ctx.globalAlpha = ga;
          ctx.fillStyle = GREEN;
          if (d === 0) ctx.fillRect(x0, y0 - 1.5, cell, 3);
          if (d === 1) ctx.fillRect(x1 - 1.5, y0, 3, cell);
          if (d === 2) ctx.fillRect(x0, y1 - 1.5, cell, 3);
          if (d === 3) ctx.fillRect(x0 - 1.5, y0, 3, cell);
        }
        // cyan artifact flecks sprinkled through the overlap
        if (ihash((i * 31 + j * 57) ^ (fstep * 911)) < 0.10) {
          var fx = cx + (ihash(i * 131 + j * 17 + fstep) - 0.5) * cell * 0.7;
          var fy = cy + (ihash(i * 13 + j * 149 + fstep * 3) - 0.5) * cell * 0.7;
          ctx.globalAlpha = 0.95 * alphaMul;
          ctx.fillStyle = CYAN;
          ctx.fillRect(fx - 1.5, fy - 1.5, 3, 3);
        }
      }
    }
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = BLUE_A;
    ctx.fillRect(0, 0, W, H);

    var solo = soloAt(t);
    var s = solo.s, soloLayer = solo.layer;
    var pos = [];
    var L, i;

    if (s > 0 && soloLayer >= 0) {
      // other skies sink: clouds fade, the field washes toward key-green
      for (L = 0; L < 10; L++) {
        if (L === soloLayer) { pos[L] = []; continue; }
        pos[L] = [];
        for (i = 0; i < layers[L].clouds.length; i++) {
          pos[L].push(drawCloud(layers[L], layers[L].clouds[i], t, 1 - 0.75 * s));
        }
      }
      ctx.globalAlpha = 0.38 * s;
      ctx.fillStyle = GREEN;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      drawSeams(pos, t, 1 - 0.45 * s);
      // the solo sky, alone on top
      var sl = layers[soloLayer];
      for (i = 0; i < sl.clouds.length; i++) drawCloud(sl, sl.clouds[i], t, 1);
    } else {
      for (L = 0; L < 10; L++) {
        pos[L] = [];
        for (i = 0; i < layers[L].clouds.length; i++) {
          pos[L].push(drawCloud(layers[L], layers[L].clouds[i], t, 1));
        }
      }
      drawSeams(pos, t, 1);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- run ----------
  fit();
  draw(T0);   // synchronous fixed-phase first frame
  function frame() {
    draw(pieceNow(START));
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
