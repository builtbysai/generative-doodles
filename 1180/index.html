<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Windows into the Continuum</title>
<style>
  html, body { margin: 0; padding: 0; background: #0C0C0E; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ===== Windows into the Continuum — Jason Soliday study block SD5 =====
  // One jagged "screech" line runs the width of the screen. A seeded stream
  // of process events (sped up / slowed / chopped / looped / reprocessed)
  // warps the phase clock the line is sampled from. One continuous phase:
  // nothing ever jumps at an event boundary. Watch only; no loop point.

  // ==CORE-BEGIN==
  var MASTER_SEED = 5;
  var EV_TYPES = ['sped', 'slowed', 'chopped', 'looped', 'reprocessed'];
  var EV_RATE = { sped: 3, slowed: 0.25 };
  var EV_LABEL = {
    sped: 'sped up ×3',
    slowed: 'slowed ×0.25',
    chopped: 'chopped',
    looped: 'looped',
    reprocessed: 'reprocessed through itself'
  };
  var EV_TINT = {
    sped: '#00FFC2', slowed: '#7C5CFF', chopped: '#FF2B6E',
    looped: '#FFE14D', reprocessed: '#FF8A00'
  };
  var CHOP_SLICE = 0.18;

  function hash2(a, b) {
    var h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) +
             Math.imul(MASTER_SEED | 0, 974634211)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ---- event stream: pure function of the event index ----
  var _events = [];
  function getEvent(j) {
    if (_events[j]) return _events[j];
    var prevEnd = 0, prevType = -1;
    if (j > 0) { var p = getEvent(j - 1); prevEnd = p.e; prevType = p.typeIdx; }
    var gap = (j === 0) ? 4 + 5 * hash2(j, 11) : 2 + 4 * hash2(j, 11);
    var s = prevEnd + gap;
    var typeIdx;
    if (prevType < 0) typeIdx = Math.floor(hash2(j, 22) * 5);
    else typeIdx = (prevType + 1 + Math.floor(hash2(j, 22) * 4)) % 5; // never same twice in a row
    var type = EV_TYPES[typeIdx];
    var d, loopL = 0, loopK = 0;
    if (type === 'looped') {
      loopL = 1.5 + 0.5 * hash2(j, 33);          // loop window length (phase seconds)
      loopK = 2 + Math.floor(hash2(j, 44) * 2);  // 2 or 3 turns of the window
      d = loopL * loopK;                          // event lasts exactly k windows
    } else {
      d = 3 + 3 * hash2(j, 33);
    }
    var ev = { j: j, s: s, d: d, e: s + d, type: type, typeIdx: typeIdx,
               loopL: loopL, loopK: loopK, labelX: 0.06 + 0.62 * hash2(j, 55) };
    _events[j] = ev;
    return ev;
  }

  // ---- reprocessed: rate feeds back on phase, rate = 1 + 0.7*sin(0.05*phi) ----
  // Deterministic 0.05 s-step integration inside the event span only.
  function reprocessPhi(phiS, dur) {
    var h = 0.05, phi = phiS, rem = dur;
    while (rem > 1e-12) {
      var step = Math.min(h, rem);
      phi += step * (1 + 0.7 * Math.sin(phi * 0.05));
      rem -= step;
    }
    return phi;
  }

  function eventPhiEnd(j, phiS) {
    var ev = getEvent(j);
    switch (ev.type) {
      case 'sped': return phiS + EV_RATE.sped * ev.d;
      case 'slowed': return phiS + EV_RATE.slowed * ev.d;
      case 'chopped': return phiS + Math.floor(ev.d / CHOP_SLICE) * CHOP_SLICE;
      case 'looped': return phiS + ev.loopL; // break out at the window's end
      case 'reprocessed': return reprocessPhi(phiS, ev.d);
    }
    return phiS;
  }

  var _phiStart = [];
  function phiAtEventStart(j) {
    var k = 0;
    while (_phiStart[j] === undefined) {
      var idx = _phiStart.length;
      if (idx === 0) {
        _phiStart[0] = getEvent(0).s; // rate 1 from phi=0 at t=0
      } else {
        var pe = eventPhiEnd(idx - 1, _phiStart[idx - 1]);
        _phiStart[idx] = pe + (getEvent(idx).s - getEvent(idx - 1).e);
      }
      k++;
      if (k > 100000) break;
    }
    return _phiStart[j];
  }
  function phiAtEventEnd(j) { return eventPhiEnd(j, phiAtEventStart(j)); }

  // ---- the warped phase clock: pure function of t ----
  function phiAt(t) {
    if (t <= 0) return 0;
    var j = 0;
    while (true) {
      var ev = getEvent(j);
      if (t < ev.s) {
        if (j === 0) return t;
        return phiAtEventEnd(j - 1) + (t - getEvent(j - 1).e);
      }
      if (t < ev.e) {
        var phiS = phiAtEventStart(j);
        var u = t - ev.s;
        switch (ev.type) {
          case 'sped': return phiS + EV_RATE.sped * u;
          case 'slowed': return phiS + EV_RATE.slowed * u;
          case 'chopped': return phiS + Math.floor(u / CHOP_SLICE) * CHOP_SLICE;
          case 'looped': return phiS + (u % ev.loopL);
          case 'reprocessed': return reprocessPhi(phiS, u);
        }
      }
      j++;
    }
  }

  function activeEvent(t) {
    var j = 0;
    while (true) {
      var ev = getEvent(j);
      if (t < ev.s) return null;
      if (t < ev.e) return ev;
      j++;
    }
  }

  // ---- the screech itself: pure function of phase ----
  var WHORL = [
    [13.7, 0.13, hash2(901, 1) * 6.2832],
    [23.3, 0.10, hash2(902, 2) * 6.2832],
    [38.9, 0.07, hash2(903, 3) * 6.2832]
  ];
  function screech(p) {
    var v = Math.sin(p) +
            0.55 * Math.sin(p * 2.76 + 0.7) +
            0.32 * Math.sin(p * 5.4 + 2.1) +
            0.18 * Math.sin(p * 9.1 + 4.0);
    for (var i = 0; i < WHORL.length; i++) {
      v += WHORL[i][1] * Math.sin(p * WHORL[i][0] + WHORL[i][2]);
    }
    return v / 2.35;
  }
  // ==CORE-END==

  // ---------- view / canvas ----------
  var BG = '#0C0C0E';
  var LINE = '#E8E8E8';
  var LABEL_INK = '#9A9AA5';
  var FAINT = '#55555E';
  var TRACK = '#26262C';
  var T0 = 21.0; // fixed first-frame phase: inside the j=2 "sped up x3" event, label fading

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var currentT = T0;

  function viewW() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vv && vv.width) return vv.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    if (vv && vv.height) return vv.height;
    return window.innerHeight || 800;
  }
  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw || 9999, sh || 9999);
    if (mn < 700) return true;
    return H > W * 1.15;
  }
  function fit() {
    W = viewW(); H = viewH();
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    var bw = Math.round(W * DPR), bh = Math.round(H * DPR);
    if (canvas.width !== bw) canvas.width = bw;
    if (canvas.height !== bh) canvas.height = bh;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(currentT); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(currentT); });
  }

  // ---------- drawing ----------
  function traceLine(phi, t) {
    var midY = H * 0.5, amp = H * 0.09, scale = 0.05, step = 2;
    var act = activeEvent(t);
    var cellW = 22;
    var slice = (act && act.type === 'chopped') ? Math.floor((t - act.s) / CHOP_SLICE) : -1;
    ctx.beginPath();
    if (slice < 0) {
      for (var x = 0; x <= W; x += step) {
        var y = midY - screech(phi + x * scale) * amp;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
    } else {
      var nCells = Math.ceil(W / cellW);
      for (var c = 0; c < nCells; c++) {
        if (hash2(act.j * 7919 + slice, c) < 0.38) continue; // chopped gap
        var x0 = c * cellW, x1 = Math.min(W, x0 + cellW);
        for (var xx = x0; xx <= x1; xx += step) {
          var yy = midY - screech(phi + xx * scale) * amp;
          if (xx === x0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
      }
    }
  }

  function drawLabels(t, midY, amp, phone) {
    var fs = phone ? 11 : 13;
    ctx.font = fs + 'px monospace';
    ctx.textBaseline = 'alphabetic';
    var j = 0;
    while (true) {
      var ev = getEvent(j);
      if (ev.s > t) break;
      var age = t - ev.s;
      if (age < 2.5) {
        var stepIdx = Math.floor(age / 2.5 * 6); // 6 fade steps
        ctx.globalAlpha = (6 - stepIdx) / 6 * 0.95;
        var lx = Math.min(ev.labelX * W, W - (phone ? 190 : 250));
        var ly = (j % 2 === 0) ? midY - amp - 24 : midY + amp + 42;
        ctx.fillStyle = EV_TINT[ev.type];
        ctx.fillRect(lx, ly - fs + 2, 10, 10);
        ctx.fillStyle = LABEL_INK;
        ctx.fillText(EV_LABEL[ev.type], lx + 16, ly);
        ctx.globalAlpha = 1;
      }
      j++;
    }
  }

  function drawScrubber(t, phone) {
    var trackY = H - 46;
    var x0 = 48, x1 = W - 48;
    ctx.strokeStyle = TRACK; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, trackY); ctx.lineTo(x1, trackY); ctx.stroke();
    // arrow caps fading outward
    ctx.lineWidth = 1.2;
    for (var i = 0; i < 3; i++) {
      ctx.globalAlpha = 0.5 - i * 0.16;
      ctx.strokeStyle = FAINT;
      var lx = x0 - 6 - i * 7, rx = x1 + 6 + i * 7;
      ctx.beginPath();
      ctx.moveTo(lx + 5, trackY - 4); ctx.lineTo(lx, trackY); ctx.lineTo(lx + 5, trackY + 4);
      ctx.moveTo(rx - 5, trackY - 4); ctx.lineTo(rx, trackY); ctx.lineTo(rx - 5, trackY + 4);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // caption
    ctx.font = (phone ? 11 : 12) + 'px monospace';
    ctx.fillStyle = FAINT;
    var cap = 'a window, not the work.';
    ctx.fillText(cap, (W - ctx.measureText(cap).width) / 2, trackY - 30);
    // you-are-here marker on an endless timeline
    var frac = (t % 997) / 997;
    var mx = x0 + frac * (x1 - x0);
    ctx.strokeStyle = FAINT; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(mx, trackY - 6); ctx.lineTo(mx, trackY + 6); ctx.stroke();
    ctx.fillStyle = FAINT;
    ctx.beginPath(); ctx.moveTo(mx + 2.5, trackY); ctx.arc(mx, trackY, 2.5, 0, 6.2832); ctx.fill();
    ctx.font = (phone ? 9 : 10) + 'px monospace';
    var lab = 'you are here';
    var lw = ctx.measureText(lab).width;
    var tx = Math.max(4, Math.min(W - lw - 4, mx - lw / 2));
    ctx.fillText(lab, tx, trackY + 24);
  }

  function draw(t) {
    currentT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    var phone = isPhone();
    var midY = H * 0.5, amp = H * 0.09;
    var phi = phiAt(t);
    // soft under-stroke, then the line itself
    ctx.strokeStyle = LINE; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalAlpha = 0.13; ctx.lineWidth = 5;
    traceLine(phi, t); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 2;
    traceLine(phi, t); ctx.stroke();
    drawLabels(t, midY, amp, phone);
    drawScrubber(t, phone);
  }

  // ---------- run ----------
  fit();
  draw(T0);
  var bootStamp = null;
  function frame(now) {
    if (bootStamp === null) bootStamp = now;
    draw(T0 + (now - bootStamp) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
