<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№111 · Emberfall</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0906; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(242,227,194,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to bend the flow</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function qseed(){ const m=(window.location&&window.location.search||'').match(/seed=(\d+)/); return m?parseInt(m[1],10):null; }
function mixc(c1,c2,f){ return [Math.round(c1[0]+(c2[0]-c1[0])*f), Math.round(c1[1]+(c2[1]-c1[1])*f), Math.round(c1[2]+(c2[2]-c1[2])*f)]; }
function css(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function makeNoise2(seed){ const rand=mulberry(seed); const p=new Uint8Array(256); for(let i=0;i<256;i++)p[i]=i; for(let i=255;i>0;i--){ const j=(rand()*(i+1))|0; const t=p[i]; p[i]=p[j]; p[j]=t; } const perm=new Uint8Array(512); for(let i=0;i<512;i++)perm[i]=p[i&255];
  function val(ix,iy){ return perm[(perm[ix&255]+iy)&255]/255; }
  return function(x,y){ const ix=Math.floor(x), iy=Math.floor(y); const fx=x-ix, fy=y-iy; const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy); const a=val(ix,iy), b=val(ix+1,iy), c=val(ix,iy+1), d=val(ix+1,iy+1); return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy; }; }

// No.111 Emberfall: 600 particles advected through curl noise in 4 diagonal bands;
// colour from a bronze-to-cream ramp by trail age; longest trail per band gets the ember edge line.
const SEED=qseed()||111111;
const noise=makeNoise2(SEED^0x9e37);
const NP=600, MAXHIST=110;
const FLOW=[Math.cos(-0.62), Math.sin(-0.62)]; // bottom-left to top-right
const PERP=[-FLOW[1], FLOW[0]];
const BANDS=[{c:0.18,hw:0.060},{c:0.40,hw:0.082},{c:0.60,hw:0.055},{c:0.82,hw:0.070}];
const UMBER=[58,36,21], BRONZE=[138,90,43], CREAM=[242,227,194];
function ramp(f){ return f<0.5?mixc(CREAM,BRONZE,f*2):mixc(BRONZE,UMBER,(f-0.5)*2); }
let sim=null;
const pointer={down:false,x:0,y:0,amp:0};
function bandWeight(u){ let w=0; for(const b of BANDS){ const d=Math.abs(u-b.c); if(d<b.hw){ const s=0.5+0.5*Math.cos(Math.PI*d/b.hw); if(s>w)w=s; } } return w; }
function bandOf(u){ let bi=0,bd=1e9; BANDS.forEach((b,i)=>{ const d=Math.abs(u-b.c); if(d<bd){bd=d;bi=i;} }); return bi; }
function buildSim(w,h){
  const rand=mulberry(SEED);
  const S=Math.min(w,h);
  let umin=1e9, umax=-1e9;
  for(const [cx,cy] of [[0,0],[w,0],[0,h],[w,h]]){ const u=PERP[0]*cx+PERP[1]*cy; if(u<umin)umin=u; if(u>umax)umax=u; }
  const parts=[];
  function spawn(){ let x=0,y=0,u=0,tries=0; do { x=rand()*w; y=rand()*h; u=(PERP[0]*x+PERP[1]*y-umin)/(umax-umin); tries++; } while(rand()>bandWeight(u)&&tries<24);
    return { x:x, y:y, px:x, py:y, age:0, life:220+((rand()*240)|0), band:bandOf(u), shade:rand(), hist:[[x,y]] }; }
  for(let i=0;i<NP;i++){ const p=spawn(); p.age=(rand()*p.life)|0; parts.push(p); }
  return { w:w, h:h, S:S, umin:umin, umax:umax, parts:parts, rand:rand, t:3 };
}
function stepSim(sm, dt){
  const w=sm.w, h=sm.h, S=sm.S, t=sm.t;
  const ns=2.4/S, e=0.05, spd=S*0.0020+1.1, ox=t*0.011, oy=t*0.008;
  const vAmp=pointer.amp, vR=S*0.30;
  ctx.fillStyle='rgba(11,9,6,0.030)'; ctx.fillRect(0,0,w,h);
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const p of sm.parts){
    p.px=p.x; p.py=p.y;
    const nx=p.x*ns+ox, ny=p.y*ns+oy;
    let vx=(noise(nx,ny+e)-noise(nx,ny-e))/(2*e), vy=-(noise(nx+e,ny)-noise(nx-e,ny))/(2*e);
    vx=vx*spd*0.16+FLOW[0]*spd*0.62; vy=vy*spd*0.16+FLOW[1]*spd*0.62;
    if(vAmp>0.003){ const dx=p.x-pointer.x, dy=p.y-pointer.y; const dv=Math.sqrt(dx*dx+dy*dy); if(dv<vR&&dv>1){ const fall=(1-dv/vR)*vAmp; vx+=(-dy/dv)*spd*2.4*fall; vy+=(dx/dv)*spd*2.4*fall; } }
    p.x+=vx; p.y+=vy; p.age++;
    p.hist.push([p.x,p.y]); if(p.hist.length>MAXHIST)p.hist.shift();
    const f=p.age/p.life;
    ctx.strokeStyle=css(mixc(ramp(f),BRONZE,p.shade*0.25), 0.6-0.2*f);
    ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke();
    if(p.age>=p.life||p.x<-30||p.x>w+30||p.y<-30||p.y>h+30){ const np=sm.rand; const fresh=(function(){ let x=0,y=0,u=0,tries=0; do { x=np()*w; y=np()*h; u=(PERP[0]*x+PERP[1]*y-sm.umin)/(sm.umax-sm.umin); tries++; } while(np()>bandWeight(u)&&tries<24); return { x:x, y:y, px:x, py:y, age:0, life:220+((np()*240)|0), band:bandOf(u), shade:np(), hist:[[x,y]] }; })(); Object.assign(p,fresh); }
  }
  // ember edge lines: longest trail in each band, spine stroked once
  const best=[null,null,null,null];
  for(const p of sm.parts){ const b=p.band; if(!best[b]||p.hist.length>best[b].hist.length) best[b]=p; }
  ctx.strokeStyle='rgba(255,122,26,0.5)'; ctx.lineWidth=1;
  for(const p of best){ if(!p||p.hist.length<26) continue; ctx.beginPath(); ctx.moveTo(p.hist[0][0],p.hist[0][1]); for(let i=1;i<p.hist.length;i++) ctx.lineTo(p.hist[i][0],p.hist[i][1]); ctx.stroke(); }
  sm.t+=dt;
  if(!pointer.down) pointer.amp*=Math.exp(-dt*1.1); else pointer.amp=Math.min(1,pointer.amp+dt*3);
}
let lastMs=null;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0.016; if(lastMs!==null) dt=clamp((nowMs-lastMs)/1000,0.001,0.05); lastMs=nowMs;
  if(!sim||sim.w!==w||sim.h!==h){ sim=buildSim(w,h); ctx.fillStyle='#0B0906'; ctx.fillRect(0,0,w,h); for(let k=0;k<420;k++) stepSim(sim,0.016); }
  else stepSim(sim,dt);
  return {};
}
function evPos(e){ return [e.clientX,e.clientY]; }
canvas.addEventListener('pointerdown',e=>{ const [x,y]=evPos(e); pointer.down=true; pointer.x=x; pointer.y=y; });
canvas.addEventListener('pointermove',e=>{ if(!pointer.down) return; const [x,y]=evPos(e); pointer.x=x; pointer.y=y; });
function endP(){ pointer.down=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
