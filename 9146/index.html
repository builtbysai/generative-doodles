<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№9146 — The Worried Note</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0d0c10;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .cap{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:#4a4438;
    font:13px/1.4 Georgia,serif;letter-spacing:.14em;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">№9146 — THE WORRIED NOTE</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
var FIELD='#0d0c10', BONE='#ddd3b8', GHOST='#4a4438', RED='#b33324';
var x=0, y=0, markW=0, markH=0;
var ghosts=[]; // {pts:[{x,y}], life}
var phrase=[], segIdx=0, segT=0, rate=0;
var trailPts=[];
var dragging=false, dragX=0, dragY=0;
var last=performance.now();
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  y=H*0.5;
  markW=Math.max(70,Math.min(160,W*0.16));
  markH=Math.max(16,markW*0.22);
  if(x===0) x=W*0.12;
}
function rand(a,b){ return a+Math.random()*(b-a); }
// Build a phrase: segments of {rate, dur}. Rates: fast, freeze, replay, slow, freeze.
// rate is a multiplier on base speed (px/s). replay is a rewind.
function buildPhrase(){
  var segs=[];
  var n=5+Math.floor(Math.random()*2);
  for(var i=0;i<n;i++){
    var kind=Math.random();
    if(kind<0.3) segs.push({type:'fast', rate:rand(2.2,3.4), dur:rand(0.5,1.1)});
    else if(kind<0.5) segs.push({type:'freeze', rate:0, dur:rand(0.4,1.0)});
    else if(kind<0.68) segs.push({type:'replay', rate:-1, dur:rand(0.5,0.9)}); // rewind
    else if(kind<0.85) segs.push({type:'slow', rate:rand(0.15,0.4), dur:rand(0.8,1.6)});
    else segs.push({type:'freeze', rate:0, dur:rand(0.6,1.4)});
  }
  // ensure at least one replay and one freeze per phrase
  var hasReplay=segs.some(function(s){return s.type==='replay';});
  var hasFreeze=segs.some(function(s){return s.type==='freeze';});
  if(!hasReplay) segs[1+Math.floor(Math.random()*(segs.length-2))]={type:'replay', rate:-1, dur:rand(0.5,0.9)};
  if(!hasFreeze) segs[0]={type:'freeze', rate:0, dur:rand(0.5,1.0)};
  // first segment is always fast so the piece starts moving
  segs[0]={type:'fast', rate:rand(2.2,3.0), dur:rand(0.8,1.2)};
  return segs;
}
function step(dt){
  segT-=dt;
  if(segT<=0){
    segIdx++;
    if(segIdx>=phrase.length){
      phrase=buildPhrase(); segIdx=0;
    }
    var s=phrase[segIdx];
    segT=s.dur;
    rate=s.rate;
    if(s.type==='replay'){
      // snapshot current trail as a ghost before rewinding
      if(trailPts.length>4){
        ghosts.push({pts:trailPts.slice(), life:1});
        if(ghosts.length>14) ghosts.shift();
      }
      trailPts=[];
    }
  }
  var base=90; // px/s base travel
  if(rate===-1){
    // replay: jump back a short distance
    x-=base*0.9*dt*3;
    if(x<W*0.06) x=W*0.06;
  }else{
    x+=base*rate*dt;
  }
  if(dragging){
    // under the pointer it still stutters and freezes: the phrase rules it
    x+=(dragX-x)*Math.min(1,dt*4)*0.3;
    y+=(dragY-y)*Math.min(1,dt*4)*0.3;
  }else{
    // drift back to the middle band
    y+=(H*0.5-y)*Math.min(1,dt*0.5);
  }
  if(x>W*0.92){
    // reached the right edge: wrap to the left, keep the phrase
    x=W*0.08;
    if(trailPts.length>4){
      ghosts.push({pts:trailPts.slice(), life:1});
      if(ghosts.length>14) ghosts.shift();
    }
    trailPts=[];
  }
  // record trail (only while moving forward)
  if(rate>0){
    trailPts.push({x:x,y:y});
    if(trailPts.length>400) trailPts.shift();
  }
  // fade ghosts
  for(var i=ghosts.length-1;i>=0;i--){
    ghosts[i].life-=dt*0.12;
    if(ghosts[i].life<=0) ghosts.splice(i,1);
  }
}
function drawMark(mx,my,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(mx,my);
  // thick short bar with a rounded end, like a bent note stem
  ctx.fillStyle=BONE;
  var w=markW, h=markH;
  ctx.beginPath();
  ctx.moveTo(-w/2,-h/2);
  ctx.lineTo(w/2-h/2,-h/2);
  ctx.arc(w/2-h/2,0,h/2,-Math.PI/2,Math.PI/2);
  ctx.lineTo(-w/2,h/2);
  ctx.closePath();
  ctx.fill();
  // the "worried" segment: always the same segment, signal red
  ctx.fillStyle=RED;
  ctx.fillRect(w*0.12,-h/2,w*0.16,h);
  ctx.restore();
}
function draw(){
  ctx.fillStyle=FIELD;
  ctx.fillRect(0,0,W,H);
  // ghosts: replayed stretches, slightly brighter
  for(var i=0;i<ghosts.length;i++){
    var g=ghosts[i];
    ctx.strokeStyle=GHOST;
    ctx.globalAlpha=Math.max(0,g.life)*0.9;
    ctx.lineWidth=markH*0.5;
    ctx.lineCap='round';
    ctx.beginPath();
    for(var j=0;j<g.pts.length;j++){
      var p=g.pts[j];
      if(j===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  // current trail
  if(trailPts.length>1){
    ctx.strokeStyle='rgba(74,68,56,0.5)';
    ctx.lineWidth=markH*0.35;
    ctx.lineCap='round';
    ctx.beginPath();
    for(var k=0;k<trailPts.length;k++){
      var tp=trailPts[k];
      if(k===0) ctx.moveTo(tp.x,tp.y); else ctx.lineTo(tp.x,tp.y);
    }
    ctx.stroke();
  }
  drawMark(x,y,1);
}
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  step(dt); draw();
  requestAnimationFrame(frame);
}
// interaction: drag the mark (it keeps its phrase, stutters under the pointer); drag a ghost erases it
function pickGhost(px,py){
  for(var i=ghosts.length-1;i>=0;i--){
    var g=ghosts[i];
    for(var j=0;j<g.pts.length;j++){
      var p=g.pts[j];
      var dx=p.x-px, dy=p.y-py;
      if(dx*dx+dy*dy<markH*markH) return i;
    }
  }
  return -1;
}
cv.addEventListener('pointerdown',function(e){
  var gi=pickGhost(e.clientX,e.clientY);
  if(gi>=0){ ghosts.splice(gi,1); return; }
  var dx=e.clientX-x, dy=e.clientY-y;
  if(Math.abs(dx)<markW&&Math.abs(dy)<markH*2){
    dragging=true; dragX=e.clientX; dragY=e.clientY;
  }
});
window.addEventListener('pointermove',function(e){
  if(dragging){ dragX=e.clientX; dragY=e.clientY; }
});
window.addEventListener('pointerup',function(){ dragging=false; });
window.addEventListener('pointercancel',function(){ dragging=false; });
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',function(){last=performance.now();});
resize();
phrase=buildPhrase(); segIdx=0; segT=phrase[0].dur; rate=phrase[0].rate;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
