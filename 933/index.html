<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Teacher Is Three</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF7F0; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var PAPER = '#FAF7F0';
  var PENCIL = '#2B2B2B';
  var WASH = '#D6DBDF';
  var MAGNET_COLORS = ['#E74C3C', '#F39C12', '#2ECC71', '#3498DB', '#9B59B6', '#E91E63'];
  var CAPTION = 'she added a few bits to make it better. she was right.';

  // Loop timing (seconds)
  var DROP_DUR = 15;    // magnets drop in
  var DRAW_DUR = 60;    // pencil draws itself
  var HOLD_DUR = 10;    // hold complete
  var CLEAR_DUR = 3;    // gentle clear (fade)
  var LOOP = DROP_DUR + DRAW_DUR + HOLD_DUR + CLEAR_DUR; // 88
  var GEN0_OFFSET = DROP_DUR + 0.35 * DRAW_DUR; // frame one: magnets down, pencil 35% drawn

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var viewW = 300, viewH = 300, dpr = 1, isPhone = false;

  function measure() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    }
    if (!w) { w = 300; h = 300; }
    viewW = w; viewH = h;
    dpr = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (dpr < 1) dpr = 1; if (dpr > 3) dpr = 3;
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    isPhone = (Math.min(sw, sh) > 0 && Math.min(sw, sh) < 700) || (viewH > viewW * 1.15);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    // (pencil path cache keys include viewW/viewH, so a resize invalidates it)
  }
  measure();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', measure);
    if (window.addEventListener) window.addEventListener('resize', measure);
  }

  // Seeded RNG (mulberry32)
  function makeRng(seed) {
    var s = seed | 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Clock: elapsed seconds since load (piece-local, never wall-clock dates)
  function rawNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return 0;
  }
  var startT = rawNow();
  function elapsed() { return Math.max(0, rawNow() - startT); }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function easeOutBounce(p) {
    var n1 = 7.5625, d1 = 2.75;
    if (p < 1 / d1) return n1 * p * p;
    if (p < 2 / d1) { p -= 1.5 / d1; return n1 * p * p + 0.75; }
    if (p < 2.5 / d1) { p -= 2.25 / d1; return n1 * p * p + 0.9375; }
    p -= 2.625 / d1; return n1 * p * p + 0.984375;
  }

  // ----- Agent One: the child's magnets (seeded per generation) -----
  // Local perimeter points of a rounded rect, jittered: handled objects, not vectors.
  function perimeterPoints(rng, w, h) {
    var a = w / 2, b = h / 2, cr = Math.min(a, b) * 0.46;
    var raw = [];
    var i, ang;
    for (i = 0; i <= 4; i++) raw.push([-a + cr + (2 * (a - cr)) * (i / 4), -b]);              // top edge
    for (i = 1; i <= 4; i++) { ang = -Math.PI / 2 + (Math.PI / 2) * (i / 4); raw.push([a - cr + cr * Math.cos(ang), -b + cr + cr * Math.sin(ang)]); }
    for (i = 1; i <= 4; i++) raw.push([a, -b + cr + (2 * (b - cr)) * (i / 4)]);              // right edge
    for (i = 1; i <= 4; i++) { ang = (Math.PI / 2) * (i / 4); raw.push([a - cr + cr * Math.cos(ang), b - cr + cr * Math.sin(ang)]); }
    for (i = 1; i <= 4; i++) raw.push([a - cr - (2 * (a - cr)) * (i / 4), b]);               // bottom edge
    for (i = 1; i <= 4; i++) { ang = Math.PI / 2 + (Math.PI / 2) * (i / 4); raw.push([-a + cr + cr * Math.cos(ang), b - cr + cr * Math.sin(ang)]); }
    for (i = 1; i <= 4; i++) raw.push([-a, b - cr - (2 * (b - cr)) * (i / 4)]);              // left edge
    for (i = 1; i <= 3; i++) { ang = Math.PI + (Math.PI / 2) * (i / 4); raw.push([-a + cr + cr * Math.cos(ang), -b + cr + cr * Math.sin(ang)]); }
    // Handled-object irregularity: a low-frequency warp plus a whisper of
    // per-point noise. Strong per-point jitter melts the rect into a blob.
    var phase = rng() * Math.PI * 2;
    var warp = 0.0038 + rng() * 0.0022;
    return raw.map(function (p) {
      var ang = Math.atan2(p[1] / (b || 1), p[0] / (a || 1));
      var off = Math.sin(2 * ang + phase) * warp;
      var len = Math.sqrt(p[0] * p[0] + p[1] * p[1]) || 1;
      var nx = p[0] / len, ny = p[1] / len;
      return [
        p[0] + nx * off + (rng() - 0.5) * 2 * 0.0021,
        p[1] + ny * off + (rng() - 0.5) * 2 * 0.0021
      ];
    });
  }

  function buildMagnets(gen) {
    var rng = makeRng(93300 + gen * 10007);
    var count = isPhone ? 12 : 16;
    var mags = [];
    for (var i = 0; i < count; i++) {
      var w = 0.115 + rng() * 0.085;              // units of min dimension
      var h = w * (0.58 + rng() * 0.36);
      mags.push({
        cx: 0.04 + rng() * 0.92,                  // fraction of view width
        cy: 0.05 + rng() * 0.88,                  // fraction of view height
        w: w, h: h,
        rot: (rng() - 0.5) * 1.1,
        color: MAGNET_COLORS[Math.floor(rng() * MAGNET_COLORS.length) % MAGNET_COLORS.length],
        pts: perimeterPoints(rng, w, h),
        dropAt: 0.8 + (13.2 / count) * i + rng() * 0.5 // phase second when this magnet drops
      });
    }
    return mags;
  }

  // ----- Event log (the only interaction state; everything else is derived) -----
  var genStart = -GEN0_OFFSET; // generation 0 begins offset so frame one is mid-loop
  var genIndex = 0;
  var modeEvents = [];   // {t, mode} mode: 0 contour, 1 hatch, 2 connect
  var dragMagnets = [];  // {t, cx, cy, w, h, rot, color, pts}

  function modeAt(t) {
    var m = 0;
    for (var i = 0; i < modeEvents.length; i++) if (modeEvents[i].t <= t) m = modeEvents[i].mode;
    return m;
  }

  // ----- Agent Two: the designer's pencil paths -----
  // Paths are built in px space from a magnet list + mode, cached by a key.
  var pathCache = { key: null, paths: null, total: 0 };

  function magnetPx(m) {
    var md = Math.min(viewW, viewH);
    return {
      cx: m.cx * viewW, cy: m.cy * viewH,
      w: m.w * md, h: m.h * md, rot: m.rot,
      pts: m.pts.map(function (p) { return [p[0] * md, p[1] * md]; })
    };
  }
  function worldPts(mp) {
    var c = Math.cos(mp.rot), s = Math.sin(mp.rot);
    return mp.pts.map(function (p) {
      return [mp.cx + p[0] * c - p[1] * s, mp.cy + p[0] * s + p[1] * c];
    });
  }
  function pointInMagnet(mp, x, y, pad) {
    var dx = x - mp.cx, dy = y - mp.cy;
    var c = Math.cos(-mp.rot), s = Math.sin(-mp.rot);
    var lx = dx * c - dy * s, ly = dx * s + dy * c;
    return Math.abs(lx) <= mp.w / 2 + pad && Math.abs(ly) <= mp.h / 2 + pad;
  }
  function pathLength(pts) {
    var L = 0;
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      L += Math.sqrt(dx * dx + dy * dy);
    }
    return L;
  }

  function buildPaths(mags, mode, salt) {
    var rng = makeRng(51500 + salt * 131 + mode * 7919);
    var mps = mags.map(magnetPx);
    var paths = [];
    var md = Math.min(viewW, viewH);
    var i, j;
    if (mode === 0) {
      // CONTOUR: trace each perimeter, offset outward, with the designer's own wobble
      for (i = 0; i < mps.length; i++) {
        var mp = mps[i];
        var c = Math.cos(mp.rot), s = Math.sin(mp.rot);
        var grow = 1 + (7.5 / Math.max(20, Math.min(mp.w, mp.h)));
        var pts = mp.pts.map(function (p, k) {
          var wob = Math.sin(k * 1.7 + i * 2.3) * 0.8;
          var lx = p[0] * grow + (rng() - 0.5) * 2.6 + wob * 0.3;
          var ly = p[1] * grow + (rng() - 0.5) * 2.6 + wob * 0.3;
          return [mp.cx + lx * c - ly * s, mp.cy + lx * s + ly * c];
        });
        pts = chaikin(pts, true, 2);
        pts.push(pts[0].slice());
        paths.push(pts);
      }
    } else if (mode === 1) {
      // HATCH: 45-degree lines across the field, kept only where no magnet covers
      var spacing = Math.max(11, md * 0.021);
      var step = spacing * 0.45;
      for (var off = -viewH; off < viewW; off += spacing) {
        var run = [];
        for (var x = 0; x <= viewW + step; x += step) {
          var y = x + off;
          var inside = false;
          if (y >= -2 && y <= viewH + 2) {
            for (j = 0; j < mps.length; j++) {
              if (pointInMagnet(mps[j], x, y, 2.5)) { inside = true; break; }
            }
          } else inside = true;
          if (!inside) {
            run.push([x + (rng() - 0.5) * 1.6, y + (rng() - 0.5) * 1.6]);
          } else {
            if (run.length >= 2) paths.push(run);
            run = [];
          }
        }
        if (run.length >= 2) paths.push(run);
      }
    } else {
      // CONNECT: link each magnet to its two nearest neighbours, dots at centres
      var pairs = {};
      var centres = mps.map(function (mp) { return [mp.cx, mp.cy]; });
      for (i = 0; i < centres.length; i++) {
        var dists = [];
        for (j = 0; j < centres.length; j++) {
          if (j === i) continue;
          var dx = centres[j][0] - centres[i][0], dy = centres[j][1] - centres[i][1];
          dists.push([dx * dx + dy * dy, j]);
        }
        dists.sort(function (a, b) { return a[0] - b[0]; });
        for (var q = 0; q < Math.min(2, dists.length); q++) {
          var o = dists[q][1];
          pairs[Math.min(i, o) + '_' + Math.max(i, o)] = [i, o];
        }
      }
      Object.keys(pairs).forEach(function (k) {
        var a = centres[pairs[k][0]], b = centres[pairs[k][1]];
        var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        var dx = b[0] - a[0], dy = b[1] - a[1];
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var bend = (rng() - 0.5) * len * 0.22;
        var cxp = mx + (-dy / len) * bend, cyp = my + (dx / len) * bend;
        var pts = [];
        for (var s2 = 0; s2 <= 14; s2++) {
          var u = s2 / 14;
          var px = (1 - u) * (1 - u) * a[0] + 2 * (1 - u) * u * cxp + u * u * b[0];
          var py = (1 - u) * (1 - u) * a[1] + 2 * (1 - u) * u * cyp + u * u * b[1];
          pts.push([px + (rng() - 0.5) * 2.2, py + (rng() - 0.5) * 2.2]);
        }
        paths.push(pts);
      });
      for (i = 0; i < centres.length; i++) paths.push([[centres[i][0], centres[i][1]]]); // dot (zero-length path)
    }
    var total = 0;
    for (i = 0; i < paths.length; i++) total += pathLength(paths[i]);
    return { paths: paths, total: total };
  }

  // ----- Drawing -----
  function strokePartial(pts, budget) {
    if (pts.length === 1) { // a dot
      if (budget >= 0) {
        ctx.beginPath();
        ctx.arc(pts[0][0], pts[0][1], Math.max(1.8, Math.min(viewW, viewH) * 0.0035), 0, Math.PI * 2);
        ctx.fill();
      }
      return 0;
    }
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    var used = 0;
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      var seg = Math.sqrt(dx * dx + dy * dy);
      if (used + seg <= budget) {
        ctx.lineTo(pts[i][0], pts[i][1]);
        used += seg;
      } else {
        var f = seg > 0 ? (budget - used) / seg : 0;
        if (f > 0) ctx.lineTo(pts[i - 1][0] + dx * f, pts[i - 1][1] + dy * f);
        used = budget;
        break;
      }
    }
    ctx.stroke();
    return used;
  }

  function tracePath(pts, close) {
    // Plain polygon through the sampled perimeter (which already carries
    // corner-arc samples): crisp like a handled plastic magnet.
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (close) ctx.closePath();
  }

  // Chaikin corner-cutting: turns a polygonal pencil path into a smooth hand line.
  function chaikin(pts, closed, iterations) {
    var out = pts;
    for (var it = 0; it < iterations; it++) {
      var next = [];
      var n = out.length;
      var segCount = closed ? n : n - 1;
      if (!closed) next.push(out[0]);
      for (var i = 0; i < segCount; i++) {
        var a = out[i], b = out[(i + 1) % n];
        next.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
        next.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
      }
      if (!closed) next.push(out[n - 1]);
      out = next;
    }
    return out;
  }

  function drawMagnet(m, dropP, alpha) {
    var md = Math.min(viewW, viewH);
    var mp = magnetPx(m);
    var yOff = -0.30 * md * (1 - easeOutBounce(clamp(dropP, 0, 1)));
    var wp = worldPts(mp);
    var i;
    // flat offset shadow in wash (never shadowBlur)
    ctx.save();
    ctx.globalAlpha = alpha * 0.5;
    ctx.fillStyle = WASH;
    tracePath(wp.map(function (p) { return [p[0] + 5, p[1] + 7 + yOff]; }), true);
    ctx.fill();
    ctx.restore();
    // body
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = m.color;
    tracePath(wp.map(function (p) { return [p[0], p[1] + yOff]; }), true);
    ctx.fill();
    ctx.globalAlpha = alpha * 0.10;
    ctx.strokeStyle = PENCIL;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.restore();
    return wp;
  }

  function draw(t) {
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, viewW, viewH);

    var localT = t - genStart;
    var loopIdx = Math.floor(localT / LOOP);
    var loopStart = genStart + loopIdx * LOOP;
    var phase = localT - loopIdx * LOOP;

    var fade = 1;
    if (phase > DROP_DUR + DRAW_DUR + HOLD_DUR) fade = 1 - (phase - DROP_DUR - DRAW_DUR - HOLD_DUR) / CLEAR_DUR;
    fade = clamp(fade, 0, 1);

    var base = buildMagnets(genIndex);
    var extras = [];
    for (var i = 0; i < dragMagnets.length; i++) {
      if (dragMagnets[i].t >= loopStart && dragMagnets[i].t <= t) extras.push(dragMagnets[i]);
    }

    // magnets (shadow + body), dropping per schedule
    var all = base.concat(extras);
    for (i = 0; i < all.length; i++) {
      var m = all[i];
      var p;
      if (i < base.length) {
        p = (phase - m.dropAt) / 0.9;
      } else {
        p = (t - m.t) / 0.7;
      }
      if (p <= 0) continue;
      drawMagnet(m, p, fade);
    }

    // pencil run: starts at the loop's draw phase, or at a later mode tap in this loop
    var mode = modeAt(t);
    var drawStartAbs = loopStart + DROP_DUR;
    var runStart = drawStartAbs;
    for (i = 0; i < modeEvents.length; i++) {
      if (modeEvents[i].t > drawStartAbs && modeEvents[i].t <= t && modeEvents[i].t >= loopStart) {
        runStart = Math.max(runStart, modeEvents[i].t);
      }
    }
    // pencil subjects: magnets that existed when this run began
    var subjects = base.slice();
    for (i = 0; i < dragMagnets.length; i++) {
      if (dragMagnets[i].t >= loopStart && dragMagnets[i].t <= runStart) subjects.push(dragMagnets[i]);
    }
    var progress = clamp((t - runStart) / DRAW_DUR, 0, 1);
    if (progress > 0) {
      var key = genIndex + '|' + mode + '|' + subjects.length + '|' + viewW + 'x' + viewH + '|' + runStart.toFixed(2);
      if (pathCache.key !== key) {
        var built = buildPaths(subjects, mode, genIndex * 31 + subjects.length);
        pathCache = { key: key, paths: built.paths, total: built.total };
      }
      var budget = progress * pathCache.total;
      var md = Math.min(viewW, viewH);
      ctx.save();
      ctx.strokeStyle = PENCIL;
      ctx.fillStyle = PENCIL;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      // graphite double pass: soft under-stroke, then the line
      var passes = [[2.3, 0.34], [1.25, 0.62]];
      for (var pi = 0; pi < passes.length; pi++) {
        ctx.lineWidth = Math.max(1, passes[0][0] * md / 720 * (pi === 0 ? 1 : 0.62));
        ctx.globalAlpha = fade * passes[pi][1];
        var remaining = budget;
        for (i = 0; i < pathCache.paths.length; i++) {
          if (remaining < 0) break;
          remaining -= strokePartial(pathCache.paths[i], remaining);
        }
      }
      ctx.restore();
    }

    // caption (verbatim), bottom-left, on a soft paper plate for legibility
    ctx.save();
    ctx.globalAlpha = fade;
    var fs = isPhone ? 12 : 15;
    ctx.font = fs + 'px Georgia, "Times New Roman", serif';
    var tw = ctx.measureText(CAPTION).width;
    ctx.fillStyle = PAPER;
    ctx.globalAlpha = fade * 0.85;
    ctx.fillRect(10, viewH - fs - 16, tw + 16, fs + 12);
    ctx.globalAlpha = fade * 0.88;
    ctx.fillStyle = PENCIL;
    ctx.fillText(CAPTION, 18, viewH - 14);
    ctx.restore();
  }

  draw(0);

  // ----- Sound (lazy, gesture-only, typeof-guarded) -----
  var AC = null, masterGain = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    if (typeof window === 'undefined') return;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      masterGain = AC.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  function noiseBuffer(dur) {
    var len = Math.floor(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  function clack(sizeNorm) {
    if (!AC || !masterGain) return;
    var t0 = AC.currentTime;
    var src = AC.createBufferSource();
    src.buffer = noiseBuffer(0.07);
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 750 + sizeNorm * 950;
    bp.Q.value = 1.1;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.30, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
    src.connect(bp); bp.connect(g); g.connect(masterGain);
    src.start(t0); src.stop(t0 + 0.09);
    var osc = AC.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(200 - sizeNorm * 80, t0);
    osc.frequency.exponentialRampToValueAtTime(70, t0 + 0.07);
    var og = AC.createGain();
    og.gain.setValueAtTime(0.12, t0);
    og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
    osc.connect(og); og.connect(masterGain);
    osc.start(t0); osc.stop(t0 + 0.09);
  }
  function scratch() {
    if (!AC || !masterGain) return;
    var t0 = AC.currentTime;
    var src = AC.createBufferSource();
    src.buffer = noiseBuffer(0.13);
    src.playbackRate.value = 0.8 + Math.random() * 0.4;
    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 850;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.045, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
    src.connect(lp); lp.connect(g); g.connect(masterGain);
    src.start(t0); src.stop(t0 + 0.14);
  }

  // Sound state follows the visuals; sounds fire only in a live rAF loop.
  var snd = { key: '', landed: {}, lastScratch: 0 };
  function soundUpdate(t) {
    if (!AC) return;
    var localT = t - genStart;
    var loopIdx = Math.floor(localT / LOOP);
    var phase = localT - loopIdx * LOOP;
    var key = genIndex + ':' + loopIdx;
    if (snd.key !== key) { snd.key = key; snd.landed = {}; }
    var base = buildMagnets(genIndex);
    for (var i = 0; i < base.length; i++) {
      if (!snd.landed[i] && phase > base[i].dropAt + 0.65) {
        snd.landed[i] = true;
        clack(clamp((base[i].w - 0.115) / 0.085, 0, 1));
      }
    }
    for (i = 0; i < dragMagnets.length; i++) {
      var dk = 'd' + i;
      if (!snd.landed[dk] && t > dragMagnets[i].t + 0.5 && dragMagnets[i].t >= genStart + loopIdx * LOOP) {
        snd.landed[dk] = true;
        clack(0.5);
      }
    }
    // pencil scratch while the pencil is actively drawing
    var drawStartAbs = genStart + loopIdx * LOOP + DROP_DUR;
    var runStart = drawStartAbs;
    for (i = 0; i < modeEvents.length; i++) {
      if (modeEvents[i].t > drawStartAbs && modeEvents[i].t <= t) runStart = Math.max(runStart, modeEvents[i].t);
    }
    var prog = clamp((t - runStart) / DRAW_DUR, 0, 1);
    if (prog > 0 && prog < 1 && phase < DROP_DUR + DRAW_DUR + HOLD_DUR && t - snd.lastScratch > 0.38) {
      snd.lastScratch = t;
      scratch();
    }
  }

  // ----- Pointer interaction -----
  var ptr = null;        // active pointer stroke
  var pendingTap = null; // {upT}
  var dragRng = makeRng(777001);

  function addDragMagnet(x, y, t) {
    var md = Math.min(viewW, viewH);
    var w = (0.115 + dragRng() * 0.085);
    var m = {
      t: t,
      cx: x / viewW, cy: y / viewH,
      w: w, h: w * (0.58 + dragRng() * 0.36),
      rot: (dragRng() - 0.5) * 1.1,
      color: MAGNET_COLORS[Math.floor(dragRng() * MAGNET_COLORS.length) % MAGNET_COLORS.length],
      pts: null
    };
    m.pts = perimeterPoints(dragRng, m.w, m.h);
    dragMagnets.push(m);
    void md;
  }

  function onDown(e) {
    ensureAudio();
    var t = elapsed();
    ptr = {
      downT: t, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY,
      dist: 0, sinceAdd: 0, adds: 0, dragging: false
    };
  }
  function onMove(e) {
    if (!ptr) return;
    var dx = e.clientX - ptr.lx, dy = e.clientY - ptr.ly;
    var seg = Math.sqrt(dx * dx + dy * dy);
    ptr.dist += seg;
    ptr.sinceAdd += seg;
    ptr.lx = e.clientX; ptr.ly = e.clientY;
    if (ptr.dist > 12) ptr.dragging = true;
    if (ptr.dragging && ptr.adds < 4 && ptr.sinceAdd > 65) {
      ptr.sinceAdd = 0;
      ptr.adds++;
      addDragMagnet(e.clientX, e.clientY, elapsed());
    }
  }
  function onUp(e) {
    if (!ptr) return;
    var t = elapsed();
    var wasDrag = ptr.dragging;
    var dur = t - ptr.downT;
    ptr = null;
    if (wasDrag || dur > 0.45) return;
    // tap candidate: resolve single vs double after the disambiguation window
    if (pendingTap && (t - pendingTap.upT) <= 0.35) {
      pendingTap = null;
      // DOUBLE-TAP: start over with a new arrangement, same pencil mode
      genIndex++;
      genStart = t;
      dragMagnets = dragMagnets.filter(function (m) { return m.t >= t; });
      snd.key = '';
    } else {
      pendingTap = { upT: t };
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('pointerup', onUp);

  function frame() {
    var t = elapsed();
    if (pendingTap && (t - pendingTap.upT) > 0.35) {
      var fireT = pendingTap.upT + 0.35;
      pendingTap = null;
      // TAP: the designer swaps emulation style over the same magnets
      modeEvents.push({ t: fireT, mode: (modeAt(fireT) + 1) % 3 });
    }
    draw(t);
    soundUpdate(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
