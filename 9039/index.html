<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9039 · Wind Field</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e9e2d0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; cursor: pointer; }
  .cap {
    position: fixed; left: 18px; bottom: 14px; pointer-events: none;
    color: #6b6250; font: italic 12.5px/1.5 Georgia, serif; opacity: 0.85;
  }
  .cap b { color: #3d382c; font-weight: normal; font-style: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><b>№9039 · Wind Field</b>, a gust crossing the wheat, one poppy standing, click for another field</div>
<script>
'use strict';
/*
  Wind Field: a gust frozen mid-passage through wheat. Every blade leans
  downwind, the bend swelling where the gust is, so the gust's shape reads
  across the field. One poppy stands unbent, the only red in the piece.
*/

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '90210', 10) || 90210;
let rand = mulberry32(seed);

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const U = 1000; // virtual units; composition is viewport-invariant

function fit() {
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const s = Math.min(window.innerWidth, window.innerHeight) * 0.94;
  cv.width = s * DPR; cv.height = s * DPR;
  cv.style.width = s + 'px'; cv.style.height = s + 'px';
  ctx.setTransform(cv.width / U, 0, 0, cv.width / U, 0, 0);
}
window.addEventListener('resize', () => { fit(); draw(); });

function makeNoise(r) {
  const p = new Array(256);
  for (let i = 0; i < 256; i++) p[i] = r();
  return function (x) {
    const xi = Math.floor(x), xf = x - xi;
    const a = p[xi & 255], b = p[(xi + 1) & 255];
    const u = xf * xf * (3 - 2 * xf);
    return a + (b - a) * u;
  };
}

const INK = [58, 52, 44];
function ink(alpha) {
  return 'rgba(' + INK[0] + ',' + INK[1] + ',' + INK[2] + ',' + alpha.toFixed(3) + ')';
}

function draw() {
  rand = mulberry32(seed);
  const noise = makeNoise(rand);
  const R = (a, b) => a + rand() * (b - a);

  // ---- paper ----
  const paper = ctx.createLinearGradient(0, 0, U, U);
  paper.addColorStop(0, '#f3eee1');
  paper.addColorStop(0.6, '#efe8d6');
  paper.addColorStop(1, '#e9e1cc');
  ctx.fillStyle = paper;
  ctx.fillRect(0, 0, U, U);

  // print area
  const PX = 70, PY = 70, PW = U - 2 * PX, PH = U - 2 * PY;
  ctx.save();
  ctx.beginPath(); ctx.rect(PX, PY, PW, PH); ctx.clip();

  // ---- the gust: one gaussian swell plus a faint ripple ----
  const gx = R(320, 680);       // gust center x
  const gw = R(170, 260);       // gust width
  const gAmp = R(0.50, 0.65);   // extra bend at the gust core
  const gPhase = R(0, 6.28);

  const fieldTop = 340;         // low horizon: wheat fills the lower two-thirds
  const fieldBot = 985;

  // faint distant wash at the horizon
  ctx.fillStyle = 'rgba(58,52,44,0.07)';
  ctx.fillRect(PX, 296, PW, 52);

  // ---- the poppy: decided first, drawn in depth order ----
  const popX = R(380, 620);
  const popY = R(640, 800);

  // ---- wheat ----
  const blades = [];
  const N = 700;
  for (let i = 0; i < N; i++) {
    const x0 = R(30, 970);
    const y0 = fieldTop + Math.pow(rand(), 0.72) * (fieldBot - fieldTop);
    blades.push({ x0, y0, j1: rand(), j2: rand(), j3: rand() });
  }

  const items = blades.map(b => ({ y: b.y0, kind: 0, b }));
  items.push({ y: popY, kind: 1 });
  items.sort((a, b) => a.y - b.y);

  const bendAt = (x) => {
    const g = Math.exp(-((x - gx) * (x - gx)) / (2 * gw * gw));
    return { g, bend: 0.10 + gAmp * g + 0.07 * Math.sin(x * 0.018 + gPhase) };
  };

  function drawBlade(b) {
    const depthT = (b.y0 - fieldTop) / (fieldBot - fieldTop);
    const scale = 0.45 + 0.8 * depthT;
    const h = (60 + b.j1 * 85) * scale;
    let bend = bendAt(b.x0).bend + (b.j2 - 0.5) * 0.14;
    bend = Math.max(0.03, Math.min(0.85, bend));
    const tipX = b.x0 + bend * h;
    const tipY = b.y0 - h * Math.sqrt(Math.max(0.25, 1 - bend * bend));
    const wob = (noise(b.x0 * 0.05 + b.j3 * 40) - 0.5) * 18 * scale;
    const cx = b.x0 + bend * h * 0.35 + wob;
    const cy = b.y0 - h * 0.55;
    const alpha = 0.5 + 0.5 * depthT;

    ctx.strokeStyle = ink(alpha);
    ctx.lineWidth = 1.5 + 1.9 * depthT;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x0, b.y0);
    ctx.quadraticCurveTo(cx, cy, tipX, tipY);
    ctx.stroke();

    // seed head
    const ang = Math.atan2(tipY - cy, tipX - cx);
    const hx = tipX + Math.cos(ang) * 7 * scale;
    const hy = tipY + Math.sin(ang) * 7 * scale;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(ang);
    ctx.fillStyle = ink(alpha);
    ctx.beginPath();
    ctx.ellipse(0, 0, 2.8 * scale, 7.5 * scale, 0, 0, 7);
    ctx.fill();
    ctx.restore();

    // awns fanning from the head
    ctx.lineWidth = Math.max(0.7, 0.9 * scale);
    for (let k = 0; k < 5; k++) {
      const a = ang + (k - 2) * 0.28 + (b.j3 - 0.5) * 0.2;
      const len = (11 + b.j1 * 9) * scale;
      const sx = hx + Math.cos(a) * 6 * scale;
      const sy = hy + Math.sin(a) * 6 * scale;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(a) * len, sy + Math.sin(a) * len);
      ctx.stroke();
    }
  }

  function drawLeaf(x, y, dirn, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(dirn);
    ctx.fillStyle = ink(0.85);
    ctx.beginPath();
    ctx.ellipse(10 * s, 0, 11 * s, 3.4 * s, 0, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  function drawPoppy() {
    const stemH = 195;
    // stem: unbent, barely a wobble
    ctx.strokeStyle = ink(0.95);
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(popX, popY);
    ctx.quadraticCurveTo(popX - 5, popY - stemH * 0.55, popX + 7, popY - stemH);
    ctx.stroke();
    drawLeaf(popX - 2, popY - stemH * 0.35, Math.PI - 0.35, 1);
    drawLeaf(popX + 3, popY - stemH * 0.62, 0.4, 0.85);

    // head: plain red petals, the only color in the piece
    const hx = popX + 7, hy = popY - stemH;
    const prand = mulberry32(seed + 11);
    for (let k = 0; k < 5; k++) {
      const a = k * (Math.PI * 2 / 5) + (prand() - 0.5) * 0.3;
      const sh = 0.9 + prand() * 0.25;
      ctx.fillStyle = 'rgb(' + Math.round(179 * sh) + ',' + Math.round(53 * sh) + ',' + Math.round(43 * sh) + ')';
      ctx.save();
      ctx.translate(hx + Math.cos(a) * 9, hy + Math.sin(a) * 9);
      ctx.rotate(a + Math.PI / 2);
      ctx.beginPath();
      ctx.ellipse(0, 0, 13, 20, 0, 0, 7);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = ink(1);
    ctx.beginPath();
    ctx.arc(hx, hy, 6, 0, 7);
    ctx.fill();
  }

  for (const it of items) {
    if (it.kind === 0) drawBlade(it.b); else drawPoppy();
  }

  ctx.restore();

  // ---- wobbly plate frame ----
  ctx.strokeStyle = 'rgba(70,62,50,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const fr = 64, fw = 40;
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (U - 2 * fr) * t + (noise(t * 9.1) - 0.5) * 5;
    const y = fr + (noise(t * 7.3 + 40) - 0.5) * 5;
    s2 ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr + (noise(t * 8.2 + 80) - 0.5) * 5;
    const y = fr + (U - 2 * fr) * t + (noise(t * 6.1 + 120) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr - (U - 2 * fr) * t + (noise(t * 7.7 + 160) - 0.5) * 5;
    const y = U - fr + (noise(t * 9.4 + 200) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (noise(t * 6.6 + 240) - 0.5) * 5;
    const y = U - fr - (U - 2 * fr) * t + (noise(t * 8.8 + 280) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  // ---- grain ----
  const gr = mulberry32(seed + 5);
  ctx.fillStyle = 'rgba(60,52,40,1)';
  for (let i = 0; i < 5200; i++) {
    ctx.globalAlpha = 0.025 + gr() * 0.06;
    const r = 0.6 + gr() * 1.6;
    ctx.beginPath();
    ctx.arc(gr() * U, gr() * U, r, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- vignette ----
  const v = ctx.createRadialGradient(U / 2, U / 2, U * 0.32, U / 2, U / 2, U * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(40,30,18,0.16)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, U, U);
}

cv.addEventListener('click', () => {
  const s = 1000 + Math.floor(Math.random() * 900000);
  location.search = '?seed=' + s;
});

fit();
draw();
</script>
</body>
</html>
