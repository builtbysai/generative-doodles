<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Held Thing</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #D93A2B; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (strict, nothing else): vermilion ground, wallpaper black,
  // skin white, hair black, cup blue. Flat fills only, no gradients.
  var GROUND = '#D93A2B', WPAPER = '#1A1A1A', SKIN = '#FFFFFF',
      HAIR = '#111111', BLUE = '#1B6FD6';

  var LOOP = 24;        // seconds per seamless loop
  var PHASE0 = 0;       // constant first-frame phase: wallpaper offset 0, smoke at fixed curls

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(548066);
  // The wallpaper crawl and the smoke are pure functions of phase, so the
  // seed only fixes a faint seeded jitter on the leaf rotations, forever.
  var LEAF_JIT = [];
  for (var j = 0; j < 64; j++) LEAF_JIT.push((rng() - 0.5) * 0.14);

  // ---- wallpaper: black leaves on vermilion, one tile drawn on an offset grid ----
  var TILE = 190;
  function leaf(cx, cy, len, wid, ang) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.fillStyle = WPAPER;
    ctx.beginPath();
    ctx.moveTo(-len / 2, 0);
    ctx.quadraticCurveTo(0, -wid, len / 2, 0);
    ctx.quadraticCurveTo(0, wid, -len / 2, 0);
    ctx.closePath();
    ctx.fill();
    // vein cut in the ground colour
    ctx.strokeStyle = GROUND;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-len / 2 + 8, 0);
    ctx.lineTo(len / 2 - 8, 0);
    ctx.stroke();
    ctx.restore();
  }
  function drawTile(x, y, k) {
    leaf(x + 56, y + 58, 106, 42, -0.6 + LEAF_JIT[k % 64]);
    leaf(x + 142, y + 146, 96, 38, 2.25 + LEAF_JIT[(k + 17) % 64]);
    ctx.fillStyle = WPAPER;
    ctx.beginPath();
    ctx.arc(x + 152, y + 38, 6, 0, Math.PI * 2);
    ctx.fill();
  }
  function drawWallpaper(off) {
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, 1080, 1080);
    var k = 0;
    for (var ty = -1; ty <= 6; ty++) {
      for (var tx = -1; tx <= 6; tx++) {
        drawTile(tx * TILE - off, ty * TILE - off * 0.35, k++);
      }
    }
  }

  // ---- the figure: white skin, black bob, calm profile facing right ----
  function drawFigure() {
    // torso: back falls to the bottom-left corner, chest front on the right
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(196, 452);
    ctx.bezierCurveTo(140, 580, 84, 780, 58, 1080);
    ctx.lineTo(352, 1080);
    ctx.bezierCurveTo(338, 880, 314, 690, 288, 556);
    ctx.lineTo(262, 486);
    ctx.closePath();
    ctx.fill();

    // hair silhouette: a bob mass cropped by the top edge
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.moveTo(-30, -40);
    ctx.lineTo(408, -40);
    ctx.bezierCurveTo(428, 110, 404, 238, 356, 318);
    ctx.bezierCurveTo(334, 356, 300, 378, 258, 384);
    ctx.lineTo(128, 384);
    ctx.bezierCurveTo(58, 378, 8, 330, -12, 258);
    ctx.bezierCurveTo(-26, 178, -28, 60, -30, -40);
    ctx.closePath();
    ctx.fill();

    // face: white profile laid over the hair's front; forehead, nose, lips,
    // chin, then the inner curve back down the jaw and neck
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(206, -20);
    ctx.bezierCurveTo(300, -12, 346, 68, 349, 140);
    ctx.bezierCurveTo(350, 158, 344, 168, 339, 180);
    ctx.lineTo(373, 232);
    ctx.bezierCurveTo(377, 240, 373, 249, 363, 253);
    ctx.bezierCurveTo(353, 257, 345, 259, 341, 263);
    ctx.bezierCurveTo(349, 271, 351, 279, 345, 287);
    ctx.bezierCurveTo(349, 295, 347, 303, 339, 309);
    ctx.bezierCurveTo(347, 333, 337, 357, 309, 369);
    ctx.bezierCurveTo(282, 384, 258, 390, 246, 404);
    ctx.bezierCurveTo(228, 428, 210, 452, 198, 474);
    ctx.bezierCurveTo(184, 420, 176, 362, 179, 300);
    ctx.bezierCurveTo(171, 200, 182, 58, 206, -20);
    ctx.closePath();
    ctx.fill();

    // one closed eye: a single calm curve, nothing else on the face
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = 5.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(284, 204);
    ctx.quadraticCurveTo(301, 214, 318, 204);
    ctx.stroke();
  }

  // ---- the held thing: forearm from the bottom edge, hand, tiny cup ----
  var CUP_X = 560, CUP_TOP = 612;
  function drawArmAndCup() {
    // forearm rising from the bottom edge
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(486, 1080);
    ctx.bezierCurveTo(493, 950, 503, 832, 513, 748);
    ctx.lineTo(607, 748);
    ctx.bezierCurveTo(614, 832, 622, 950, 628, 1080);
    ctx.closePath();
    ctx.fill();
    // hand cupping from below: a rounded palm with three finger bumps
    ctx.beginPath();
    ctx.ellipse(CUP_X, 724, 58, 27, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(CUP_X - 34, 706, 13, 0, Math.PI * 2);
    ctx.arc(CUP_X, 700, 14, 0, Math.PI * 2);
    ctx.arc(CUP_X + 34, 706, 13, 0, Math.PI * 2);
    ctx.fill();

    // saucer
    ctx.beginPath();
    ctx.ellipse(CUP_X, 702, 60, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = BLUE;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(CUP_X, 702, 60, 10, 0, 0, Math.PI * 2);
    ctx.stroke();

    // cup body: white trapezoid, 1080-space height 90 (under 12% of canvas)
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(517, CUP_TOP);
    ctx.lineTo(603, CUP_TOP);
    ctx.lineTo(591, 692);
    ctx.lineTo(529, 692);
    ctx.closePath();
    ctx.fill();
    // tea surface
    ctx.fillStyle = BLUE;
    ctx.beginPath();
    ctx.ellipse(CUP_X, CUP_TOP, 43, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    // pattern: a blue band and a row of blue dots, clipped to the body
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(517, CUP_TOP);
    ctx.lineTo(603, CUP_TOP);
    ctx.lineTo(591, 692);
    ctx.lineTo(529, 692);
    ctx.closePath();
    ctx.clip();
    ctx.fillRect(515, 632, 90, 12);
    ctx.beginPath();
    for (var i = 0; i < 4; i++) ctx.arc(534 + i * 18, 664, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // handle
    ctx.strokeStyle = BLUE;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(612, 650, 16, -1.15, 1.15);
    ctx.stroke();
  }

  // ---- smoke: flat white curls rising from the cup, 8s sub-loop (3 per 24s) ----
  function drawSmoke(t) {
    ctx.fillStyle = SKIN;
    for (var i = 0; i < 5; i++) {
      var p = ((t / 8) + i / 5) % 1;
      var y = (CUP_TOP - 14) - p * 235;
      var x = CUP_X + Math.sin(p * 4.4 + i * 1.35) * 20 * p;
      var r = 5 + p * 14;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- scene ----
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // page ground fills the whole canvas; the square stage is clipped so
    // the wallpaper tiles never spill into the letterbox
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);
    ctx.beginPath();
    ctx.rect(0, 0, 1080, 1080);
    ctx.clip();

    // wallpaper crawls slowly in one direction, one tile per loop, wrapped
    var off = TILE * ((t % LOOP) / LOOP);
    drawWallpaper(off);

    // the figure breathes almost imperceptibly: a 2px shoulder rise on a
    // 4s cycle (6 breaths per loop, integer ratio, seamless)
    var breathY = -(1 + Math.sin(2 * Math.PI * t / 4));
    ctx.save();
    ctx.translate(0, breathY);
    drawFigure();
    drawArmAndCup();
    drawSmoke(t);
    ctx.restore();

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred, keeps its shape
  // on phones too; page ground is the vermilion) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // the composition keeps its square shape on every screen, phone included
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw(simT);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
