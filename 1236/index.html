<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wandering Through Secret Storms</title>
<style>
  html, body { margin: 0; padding: 0; background: #101010; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1236 "Wandering Through Secret Storms" - Christina Battle study block CB5.
   A triptych of redacted documents about storms: a weather-service report
   blacked out to fragments, women filing records in an archive aisle, and a
   satellite storm half-covered by sliding black bars. The bars are the image.
   All motion is stepped at 6 fps with seeded jitter. Silent. No gradients,
   no filters, no offscreen canvas, no Math.random. */

var T0 = 13;                 // fixed first-frame phase, seconds
var CYCLE = 40;              // bar slide cycle, seconds
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

var PAL = {
  paper: '#E4DCC8', black: '#0C0C0C', ink: '#33302A', teal: '#3E6E7A',
  steel: '#8E969E', red: '#B04A3A', graybar: '#8A8474',
  steelDark: '#6E767E', wall: '#43464A', floor: '#33353A',
  tealLight: '#7FA8B4', tealPale: '#A8C8CE', faint: '#C9C2AC'
};

/* ---------- seeded hash (integer, deterministic) ---------- */
function ih(a, b) {
  var x = ((a | 0) * 374761393 + (b | 0) * 668265263) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function stepT(t) { return Math.floor(t * 6) / 6; }   // 6 fps step clock
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* ---------- interaction state (events only; QA never fires them) ---------- */
var salt = 0;            // reseed count from double-tap
var dragTotal = 0;       // accumulated horizontal drag, px (persists on release)
var dragging = false, lastPX = 0, downX = 0, downT = 0, lastTapT = -10, moved = 0;

canvas.addEventListener('pointerdown', function (e) {
  dragging = true; moved = 0; lastPX = e.clientX; downX = e.clientX; downT = perfNow();
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var dx = e.clientX - lastPX; lastPX = e.clientX;
  dragTotal += dx; moved += Math.abs(dx);
});
function endPointer() {
  if (!dragging) return; dragging = false;
  var now = perfNow();
  if (moved < 8) {                                   // a tap
    if (now - lastTapT < 0.32) { salt++; lastTapT = -10; }  // double-tap reseeds
    else lastTapT = now;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
function perfNow() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
}

/* ---------- survivor / slip assignment (seeded by salt) ---------- */
var POOL = ['funnel', '11:47', 'not confirmed', 'hail', 'county road',
            'unconfirmed', 'pressure', 'debris', '17 minutes', 'shelter'];
var SLIP_POOL = ['wind rising', 'glass everywhere', 'the dog knew first',
                 'sirens, then quiet', 'mud in the yard'];
function perm(n, s) {                              // seeded permutation of 0..n-1
  var a = [], i, j, tmp;
  for (i = 0; i < n; i++) a.push(i);
  if (s === 0) return a;                            // salt 0 = identity (frame-one layout)
  for (i = n - 1; i > 0; i--) { j = Math.floor(ih(s * 131 + 7, i) * (i + 1)); tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
  return a;
}
function slotWord(slot) { return POOL[perm(POOL.length, salt)[slot]]; }
function slipWord(zone) { return SLIP_POOL[perm(SLIP_POOL.length, salt + 40)[zone]]; }

/* ================= LEFT PANEL: the document ================= */
var SLOT_LINES = [1, 3, 5, 8, 10, 12];               // body lines carrying a survivor

function drawDocument(px, py, pw, ph, t) {
  var st = stepT(t), si = Math.floor(t * 6);
  ctx.fillStyle = PAL.paper; ctx.fillRect(px, py, pw, ph);
  // static paper speckle
  ctx.fillStyle = 'rgba(51,48,42,0.10)';
  for (var g = 0; g < 130; g++) {
    var gx = px + ih(g, 11) * pw, gy = py + ih(g, 23) * ph;
    ctx.fillRect(gx, gy, 1.4, 1.4);
  }
  var pad = pw * 0.075;
  var fs = clamp(pw * 0.052, 7, 15);
  ctx.fillStyle = PAL.ink;
  ctx.font = '700 ' + fs * 1.05 + 'px monospace';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('FIELD REPORT 87-114', px + pad, py + ph * 0.075);
  ctx.fillRect(px + pad, py + ph * 0.095, pw - pad * 2, 1.6);
  ctx.font = fs * 0.8 + 'px monospace';
  ctx.fillStyle = '#6A6455';
  ctx.fillText('COUNTY STATION  /  JUL 31', px + pad, py + ph * 0.125);

  var lines = 14, top = py + ph * 0.165, lh = (ph * 0.80) / lines;
  var shift = clamp(dragTotal, -pw * 0.16, pw * 0.16);   // visitor redaction offset
  ctx.font = fs + 'px monospace';
  for (var L = 0; L < lines; L++) {
    var ly = top + L * lh, base = ly + lh * 0.62;
    var slot = SLOT_LINES.indexOf(L);
    // build fake word-bars across the line
    var segs = [], x = px + pad, endX = px + pw - pad;
    var survX = -1, survW = 0, word = null;
    if (slot >= 0) {
      word = slotWord(slot);
      survW = ctx.measureText(word).width;
      survX = px + pad + (pw - pad * 2 - survW) * (0.16 + 0.62 * ih(L, 5));
    }
    var guard = 0;
    while (x < endX - 10 && guard++ < 40) {
      var wdt = 14 + ih(L * 31 + guard, 3) * (pw * 0.11);
      if (survX > 0 && x + wdt > survX - 5 && x < survX) wdt = survX - 5 - x;
      if (wdt < 4) { x = survX + survW + 7; continue; }
      if (survX > 0 && x >= survX - 5 && x < survX + survW) { x = survX + survW + 7; continue; }
      segs.push([x, Math.min(wdt, endX - x)]); x += wdt + 6;
    }
    // fake text (gray word-bars)
    ctx.fillStyle = PAL.graybar;
    for (var s2 = 0; s2 < segs.length; s2++) ctx.fillRect(segs[s2][0], base - fs * 0.52, segs[s2][1], fs * 0.5);
    // survivor word (real text on paper)
    if (word) {
      ctx.fillStyle = PAL.ink;
      ctx.fillText(word, survX, base);
      if (slot === 0) {                              // red pencil underline
        ctx.strokeStyle = PAL.red; ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(survX - 1, base + 3);
        ctx.lineTo(survX + survW * 0.5, base + 3.8 + ih(L, 8));
        ctx.lineTo(survX + survW + 1, base + 3);
        ctx.stroke();
      }
    }
    // redaction bars over the fake text only (segment runs), breathing + jitter
    var breathe = (ih(L, si) - 0.5) * 4;
    var jx = (ih(L, si + 900) - 0.5) * 2, jy = (ih(L, si + 500) - 0.5) * 2;
    ctx.fillStyle = PAL.black;
    var runs = [];
    if (survX < 0) runs.push([px + pad, endX]);
    else { runs.push([px + pad, survX - 5]); runs.push([survX + survW + 5, endX]); }
    for (var r = 0; r < runs.length; r++) {
      var rx = runs[r][0] + jx + shift, rw = (runs[r][1] - runs[r][0]) + breathe;
      if (rw < 2) continue;
      ctx.save();
      ctx.translate(rx + rw / 2, ly + lh * 0.36 + jy);
      ctx.rotate((ih(L, 77) - 0.5) * 0.012);
      ctx.fillRect(-rw / 2, -lh * 0.30, rw, lh * 0.60);
      ctx.restore();
    }
  }
}

/* ================= CENTER PANEL: the archive aisle ================= */
function drawerFront(x, y, w, h, label) {
  ctx.fillStyle = PAL.steel; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = PAL.steelDark; ctx.lineWidth = 1;
  ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  ctx.fillStyle = PAL.paper;                          // label holder
  var lw = w * 0.44, lx = x + (w - lw) / 2;
  ctx.fillRect(lx, y + h * 0.14, lw, h * 0.26);
  if (label) {
    ctx.fillStyle = PAL.ink;
    var lfs = clamp(h * 0.20, 5, 10);
    ctx.font = '700 ' + lfs + 'px monospace';
    var tw = ctx.measureText(label).width;
    if (tw > w * 0.94) {                              // shrink to fit narrow drawers
      lfs = Math.max(2.4, lfs * (w * 0.94) / tw);
      ctx.font = '700 ' + lfs + 'px monospace';
      tw = ctx.measureText(label).width;
    }
    ctx.fillText(label, x + (w - tw) / 2, y + h * 0.335);
    ctx.strokeStyle = PAL.red; ctx.lineWidth = 1.3;   // red pencil underline
    ctx.beginPath(); ctx.moveTo(x + (w - tw) / 2, y + h * 0.44); ctx.lineTo(x + (w + tw) / 2, y + h * 0.44); ctx.stroke();
  } else {
    ctx.fillStyle = PAL.graybar; ctx.fillRect(lx + lw * 0.18, y + h * 0.235, lw * 0.64, 1.6);
  }
  ctx.strokeStyle = PAL.ink;                          // handle
  ctx.beginPath(); ctx.moveTo(x + w * 0.3, y + h * 0.68); ctx.lineTo(x + w * 0.7, y + h * 0.68); ctx.stroke();
}
function drawFigure(cx, baseY, fh, dress, poseB, flip) {
  var hw = fh * 0.11;
  ctx.fillStyle = dress;                              // dress silhouette
  ctx.beginPath();
  ctx.moveTo(cx - hw * 0.5, baseY - fh * 0.78);
  ctx.lineTo(cx + hw * 0.5, baseY - fh * 0.78);
  ctx.lineTo(cx + hw * 1.15, baseY);
  ctx.lineTo(cx - hw * 1.15, baseY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = PAL.paper;                          // head
  ctx.beginPath(); ctx.arc(cx, baseY - fh * 0.88, hw * 0.52, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAL.ink;                            // hair cap
  ctx.beginPath(); ctx.arc(cx, baseY - fh * 0.905, hw * 0.53, Math.PI, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = dress; ctx.lineWidth = hw * 0.34; // arm: 2 poses
  ctx.beginPath(); ctx.moveTo(cx + flip * hw * 0.4, baseY - fh * 0.72);
  if (poseB) ctx.lineTo(cx + flip * hw * 1.9, baseY - fh * 0.66);
  else ctx.lineTo(cx + flip * hw * 0.95, baseY - fh * 0.30);
  ctx.stroke();
}
function drawAisle(px, py, pw, ph, t) {
  ctx.fillStyle = PAL.wall; ctx.fillRect(px, py, pw, ph);
  var horizon = py + ph * 0.16;
  ctx.fillStyle = PAL.floor;                          // floor trapezoid
  ctx.beginPath();
  ctx.moveTo(px, py + ph); ctx.lineTo(px + pw, py + ph);
  ctx.lineTo(px + pw * 0.60, horizon + ph * 0.52); ctx.lineTo(px + pw * 0.40, horizon + ph * 0.52);
  ctx.closePath(); ctx.fill();
  // back cabinet (far end of the aisle)
  ctx.fillStyle = '#5A5E63'; ctx.fillRect(px + pw * 0.40, horizon, pw * 0.20, ph * 0.52);
  ctx.strokeStyle = PAL.steelDark;
  for (var b = 0; b < 4; b++) { ctx.beginPath(); ctx.moveTo(px + pw * 0.40, horizon + b * ph * 0.13); ctx.lineTo(px + pw * 0.60, horizon + b * ph * 0.13); ctx.stroke(); }

  var cols = 3, rows = 6;
  var bankW = pw * 0.335, bankY = py + ph * 0.07, bankH = ph * 0.80;
  var dw = bankW / cols, dh = bankH / rows;
  // which drawer is open: one per 3 s block, stepped slide
  var block = Math.floor(t / 3), phase = t - block * 3;
  var openIdx = Math.floor(ih(block, 41) * cols * rows * 2);
  var openStep = phase < 0.5 ? Math.floor(phase * 6) / 3 : (phase > 2.5 ? Math.floor((3 - phase) * 6) / 3 : 1);
  var openBank = openIdx >= cols * rows ? 1 : 0, openCell = openIdx % (cols * rows);
  for (var bank = 0; bank < 2; bank++) {
    var bx = bank === 0 ? px + pw * 0.015 : px + pw * 0.65;
    ctx.fillStyle = '#55585C'; ctx.fillRect(bx - 2, bankY - 3, bankW + 4, bankH + 6); // cabinet carcass
    for (var c = 0; c < cols; c++) for (var r2 = 0; r2 < rows; r2++) {
      var cell = r2 * cols + c;
      var dx = bx + c * dw + 1.5, dy = bankY + r2 * dh + 1.5, fw = dw - 3, fh2 = dh - 3;
      var isOpen = (bank === openBank && cell === openCell);
      var label = (bank === 0 && r2 === 1 && c === 1) ? 'STORMS' : null;
      if (isOpen && openStep > 0) {
        ctx.fillStyle = PAL.black; ctx.fillRect(dx, dy, fw, fh2);          // cavity
        var ox = (bank === 0 ? 1 : -1) * openStep * dw * 0.28, oy = openStep * dh * 0.30;
        ctx.fillStyle = PAL.paper;                                            // files inside
        ctx.fillRect(dx + ox + fw * 0.14, dy + oy - fh2 * 0.16, fw * 0.30, fh2 * 0.30);
        ctx.fillRect(dx + ox + fw * 0.50, dy + oy - fh2 * 0.10, fw * 0.30, fh2 * 0.24);
        drawerFront(dx + ox, dy + oy, fw, fh2, label);
      } else drawerFront(dx, dy, fw, fh2, label);
    }
  }
  // cart with paper stacks
  var cartX = px + pw * 0.455, cartY = py + ph * 0.80, cartW = pw * 0.10, cartH = ph * 0.055;
  ctx.fillStyle = PAL.steelDark; ctx.fillRect(cartX, cartY, cartW, cartH);
  ctx.fillStyle = PAL.paper;
  ctx.fillRect(cartX + cartW * 0.10, cartY - ph * 0.028, cartW * 0.55, ph * 0.026);
  ctx.fillRect(cartX + cartW * 0.16, cartY - ph * 0.050, cartW * 0.48, ph * 0.020);
  ctx.fillStyle = PAL.black;
  ctx.beginPath(); ctx.arc(cartX + cartW * 0.16, cartY + cartH + 3, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cartX + cartW * 0.84, cartY + cartH + 3, 3, 0, Math.PI * 2); ctx.fill();
  // the two women filing
  var figH = ph * 0.30, groundY = py + ph * 0.90;
  drawFigure(px + pw * 0.375, groundY, figH, PAL.teal, openBank === 0 && openStep > 0, -1);
  drawFigure(px + pw * 0.635, groundY, figH, '#3A3D40', openBank === 1 && openStep > 0, 1);
}

/* ================= RIGHT PANEL: the storm ================= */
var SLIP_ZONES = [0, 2, 4];                          // bars that slip, by index
function slipActive(t, zone) {                       // 2 s slips; none at t=13
  for (var k = 0; k < 40; k++) {
    var start = 6 + k * 13 + ih(k, 61) * 4;
    if (t >= start && t < start + 2 && SLIP_ZONES[k % 3] === zone) return (t - start) / 2;
    if (start > t) break;
  }
  return -1;
}
function drawStorm(px, py, pw, ph, t) {
  var st = stepT(t), si = Math.floor(t * 6);
  ctx.fillStyle = PAL.teal; ctx.fillRect(px, py, pw, ph);
  // satellite speckle
  ctx.fillStyle = 'rgba(12,12,12,0.12)';
  for (var g = 0; g < 110; g++) ctx.fillRect(px + ih(g, 31) * pw, py + ih(g, 47) * ph, 1.6, 1.6);
  // storm spiral: flat bands + arc arms
  var cx = px + pw * 0.44, cy = py + ph * 0.40, R = pw * 0.34;
  var bands = [PAL.tealPale, PAL.teal, PAL.tealLight, PAL.teal, PAL.faint, PAL.teal];
  for (var i = 5; i >= 0; i--) {
    ctx.fillStyle = bands[i];
    ctx.beginPath(); ctx.arc(cx + (i % 2 ? 2 : -2), cy, R * (0.30 + i * 0.14), 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = PAL.faint; ctx.lineWidth = clamp(pw * 0.03, 3, 9);
  for (var a = 0; a < 3; a++) {
    ctx.beginPath(); ctx.arc(cx, cy, R * (0.42 + a * 0.20), a * 2.1 + 0.4, a * 2.1 + 2.5); ctx.stroke();
  }
  ctx.fillStyle = PAL.paper;                          // eye
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.10, 0, Math.PI * 2); ctx.fill();
  // latitude ticks
  ctx.fillStyle = 'rgba(228,220,200,0.55)';
  for (var tk = 1; tk < 8; tk++) ctx.fillRect(px + pw - 7, py + ph * tk / 8, 5, 1.4);
  // handwriting fragments (beneath the bars)
  ctx.fillStyle = 'rgba(51,48,42,0.85)';
  ctx.textBaseline = 'alphabetic';
  for (var z = 0; z < 3; z++) {
    var bar = SLIP_ZONES[z];
    var wy = py + ph * (0.16 + bar * 0.168) + ph * 0.055;
    var wfs = clamp(pw * 0.062, 8, 17);
    ctx.font = 'italic ' + wfs + 'px Georgia, serif';
    ctx.fillText(slipWord(z), px + pw * 0.10, wy);
    if (z === 0) {                                    // red pencil underline
      var ww = ctx.measureText(slipWord(z)).width;
      ctx.strokeStyle = PAL.red; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(px + pw * 0.10, wy + 3); ctx.lineTo(px + pw * 0.10 + ww, wy + 3.6); ctx.stroke();
    }
  }
  // five black bars: slide on the 40 s cycle, jitter, visitor shift
  var phase = (st % CYCLE) / CYCLE;
  var vShift = clamp(dragTotal * 0.4, -ph * 0.06, ph * 0.06);
  for (var bar2 = 0; bar2 < 5; bar2++) {
    var baseY = py + ph * (0.135 + bar2 * 0.168);
    var tri = 1 - Math.abs(1 - 2 * ((phase + bar2 * 0.13) % 1));
    var by = baseY + (tri - 0.5) * ph * 0.055 + vShift + (ih(bar2, si + 300) - 0.5) * 2;
    var bx2 = px - 2, bw2 = pw + 4;
    var slip = slipActive(st, bar2);
    if (slip >= 0) {                                  // bar jumps aside, stepped
      var sStep = slip < 0.25 ? Math.floor(slip * 12) / 3 : (slip > 0.75 ? Math.floor((1 - slip) * 12) / 3 : 1);
      bx2 += sStep * pw * 0.86;
    }
    ctx.fillStyle = PAL.black; ctx.fillRect(bx2, by, bw2, ph * 0.085);
  }
}

/* ================= frame ================= */
function draw(t) {
  if (!W) return;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#101010'; ctx.fillRect(0, 0, W, H);
  var m = Math.max(6, W * 0.008), gap = Math.max(4, W * 0.005);
  var pw = (W - m * 2 - gap * 2) / 3, ph = H - m * 2;
  drawDocument(m, m, pw, ph, t);
  drawAisle(m + pw + gap, m, pw, ph, t);
  drawStorm(m + (pw + gap) * 2, m, pw, ph, t);
  ctx.strokeStyle = 'rgba(228,220,200,0.20)'; ctx.lineWidth = 1;
  for (var p = 0; p < 3; p++) ctx.strokeRect(m + (pw + gap) * p + 0.5, m + 0.5, pw - 1, ph - 1);
}
function resize() {
  var vv = window.visualViewport;
  W = Math.floor(vv ? vv.width : window.innerWidth);
  H = Math.floor(vv ? vv.height : window.innerHeight);
  DPR = window.devicePixelRatio || 1;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(T0); });
window.addEventListener('resize', function () { resize(); draw(T0); });

resize();
draw(T0);                                            // synchronous fixed-phase first frame
if (typeof requestAnimationFrame === 'function') {
  var startMs = perfNow() * 1000;
  var tick = function () {
    var el = (perfNow() * 1000 - startMs) / 1000;
    draw(T0 + el);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
