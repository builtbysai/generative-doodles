<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Girl Blue: The Cello Takes the Voice</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('c');
  var g = cv.getContext('2d');
  var LOOP = 48;
  var vpW = 0, vpH = 0, minDim = 0;
  var nowT = 0;
  var startStamp = null;

  // Seeded PRNG (mulberry32), seed 1509000. Only used for fixed per-point
  // jitter signs, so every loop index renders identically.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1509000);
  var NPTS = 220;
  var jitSign = [];
  for (var i = 0; i < NPTS; i++) jitSign.push(rng() * 2 - 1);

  function round4(x) { return Math.round(x * 10000) / 10000; }
  function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }
  function smoothstep(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }
  function loopLocal(t) {
    var lt = t % LOOP;
    return lt < 0 ? lt + LOOP : lt;
  }
  // Scheduled roughness: sweet 0-16 s, rise 16-24 s, raw hold 24-32 s,
  // fall 32-48 s. All periods divide the 48 s loop, so it closes exactly.
  function schedRough(lt) {
    if (lt < 16) return 0;
    if (lt < 24) return smoothstep(16, 24, lt);
    if (lt < 32) return 1;
    return 1 - smoothstep(32, 48, lt);
  }

  // Drag state: a single latest drag, closed-form over recorded events.
  // bias: -1 = fully sweet, +1 = fully raw. While dragging, bias is live;
  // after release it decays exponentially (tau 2 s) back to the schedule.
  var dragRec = null; // {active, bias, endT}
  function effBias(t) {
    if (!dragRec) return 0;
    if (dragRec.active) return dragRec.bias;
    return dragRec.bias * Math.exp(-(t - dragRec.endT) / 2);
  }
  function effRough(t) {
    var lt = loopLocal(t);
    return clamp(schedRough(lt) + effBias(t), 0, 1);
  }
  function bandCenterY() { return 0.30 * vpH; }
  function bandHalfH() { return 0.22 * vpH; }
  function biasFromY(y) {
    return clamp((y - bandCenterY()) / bandHalfH(), -1, 1);
  }
  function onDown(e) {
    var y = e.clientY !== undefined ? e.clientY : 0;
    if (y < 0.08 * vpH || y > 0.55 * vpH) return;
    dragRec = { active: true, bias: biasFromY(y), endT: nowT };
    drawAt(nowT);
  }
  function onMove(e) {
    if (!dragRec || !dragRec.active) return;
    var y = e.clientY !== undefined ? e.clientY : 0;
    dragRec.bias = biasFromY(y);
    drawAt(nowT);
  }
  function onUp() {
    if (!dragRec || !dragRec.active) return;
    dragRec.active = false;
    dragRec.endT = nowT;
    drawAt(nowT);
  }
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);

  function sizeFromViewport() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth; h = window.innerHeight;
    }
    if (!w || !h) { w = 720; h = 720; }
    vpW = w; vpH = h; minDim = Math.min(w, h);
    cv.width = w; cv.height = h;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
  }

  function melodyPoint(u, rough) {
    var x = (0.08 + 0.84 * u) * vpW;
    var base = 0.30 * vpH
      + Math.sin(2 * Math.PI * 2 * u + 0.6) * 0.085 * vpH
      + Math.sin(2 * Math.PI * 5 * u + 2.1) * 0.038 * vpH;
    var idx = Math.round(u * (NPTS - 1));
    var jit = jitSign[idx] * 0.020 * vpH * rough
      + Math.sin(2 * Math.PI * 28 * u) * 0.014 * vpH * rough;
    return [x, base + jit];
  }

  function drawAt(t) {
    nowT = t;
    var lt = loopLocal(t);
    var rough = effRough(t);
    sizeFromViewport();
    // Stage ground.
    g.fillStyle = '#2a2a30';
    g.fillRect(0, 0, vpW, vpH);

    // Melody line: gold base, brick core growing with roughness.
    var lw = Math.max(3, 0.012 * minDim);
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.beginPath();
    for (var i = 0; i < NPTS; i++) {
      var pt = melodyPoint(i / (NPTS - 1), rough);
      if (i === 0) g.moveTo(pt[0], pt[1]); else g.lineTo(pt[0], pt[1]);
    }
    g.strokeStyle = '#d9a441';
    g.lineWidth = lw;
    g.stroke();
    if (rough > 0) {
      g.beginPath();
      for (var j = 0; j < NPTS; j++) {
        var pt2 = melodyPoint(j / (NPTS - 1), rough);
        if (j === 0) g.moveTo(pt2[0], pt2[1]); else g.lineTo(pt2[0], pt2[1]);
      }
      g.strokeStyle = 'rgba(168,103,74,' + round4(0.9 * rough) + ')';
      g.lineWidth = lw * 0.6;
      g.stroke();
    }

    // Piano blocks along the bottom: 8 blocks, 4 s pulse cycle (divides 48).
    var nb = 8;
    var bw = 0.84 * vpW / nb;
    var bx0 = 0.08 * vpW;
    for (var k = 0; k < nb; k++) {
      var pulse = 0.5 + 0.5 * Math.sin(2 * Math.PI * (lt / 4 - k / nb));
      var alpha = round4(0.55 + 0.45 * pulse);
      var bh = (0.055 + 0.02 * Math.sin(k * 2.3)) * vpH;
      g.fillStyle = 'rgba(74,90,122,' + alpha + ')';
      g.fillRect(bx0 + k * bw + bw * 0.12, 0.82 * vpH - bh, bw * 0.76, bh);
    }

    // Percussion dots at the bottom edge: 6 s tap cycle, 8 taps at 0.75 s.
    var tapCycle = lt % 6;
    for (var d = 0; d < nb; d++) {
      var age = tapCycle - d * 0.75;
      if (age < 0) age += 6;
      var bright = age < 0.3;
      var dot = Math.max(4, 0.012 * minDim);
      g.fillStyle = bright ? '#e8e0d0' : 'rgba(232,224,208,0.25)';
      var dx = bx0 + d * bw + bw * 0.5 - dot / 2;
      g.fillRect(dx, 0.93 * vpH, dot, dot);
    }
  }

  function loop(ts) {
    if (startStamp === null) startStamp = ts;
    var el = (ts - startStamp) / 1000;
    drawAt(el);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }

  function onResize() { drawAt(nowT); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }

  drawAt(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  window.__piece = {
    drawAt: drawAt,
    state: function () {
      var lt = loopLocal(nowT);
      return {
        lt: lt,
        schedR: schedRough(lt),
        bias: effBias(nowT),
        rough: effRough(nowT)
      };
    },
    down: function (x, y) { onDown({ clientX: x, clientY: y }); },
    move: function (x, y) { onMove({ clientX: x, clientY: y }); },
    up: function () { onUp(); }
  };
})();
</script>
</body>
</html>
