<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9055 · Meridian</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0e0e12; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
// mulberry32 seeded
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rng = mulberry(9055*104729+13);

// Meridian lines: flowing vertical curves with phase drift
const LINES = 48;
const lineParams = [];
for(let i=0;i<LINES;i++){
  lineParams.push({
    x: rng(),           // base x position (0-1)
    amp: 0.02 + rng()*0.06,
    freq: 1 + Math.floor(rng()*3),
    phase: rng()*Math.PI*2,
    speed: 0.3 + rng()*0.7,
    hue: 210 + rng()*40,  // blue-violet range
    alpha: 0.15 + rng()*0.35
  });
}

let dragX = 0, dragY = 0, dragging = false;
let time = 0;

function drawFrame(dt){
  const [w,h] = viewportWH(); prep(w,h);
  // fade trail
  ctx.fillStyle = 'rgba(14,14,18,0.08)';
  ctx.fillRect(0,0,w,h);

  time += dt;

  const cx = w/2 + dragX;
  const cy = h/2 + dragY;

  for(const p of lineParams){
    const baseX = p.x * w;
    ctx.beginPath();
    const steps = 60;
    for(let s=0;s<=steps;s++){
      const t = s/steps;
      const y = t * h;
      // flowing curve: sine displacement that evolves with time
      const wave = Math.sin(t * Math.PI * p.freq * 2 + p.phase + time * p.speed);
      const wave2 = Math.sin(t * Math.PI * 3 + p.phase * 1.7 - time * p.speed * 0.6);
      const x = baseX + (wave * p.amp + wave2 * p.amp * 0.5) * w;
      // subtle pull toward drag point
      const dx = cx - x, dy = cy - y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const pull = Math.max(0, 1 - dist/(w*0.3)) * 30;
      const px = x + (dx/dist||0) * pull * 0.3;
      const py = y + (dy/dist||0) * pull * 0.3;
      if(s===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    const lightness = 45 + Math.sin(time*p.speed + p.phase)*15;
    ctx.strokeStyle = `hsla(${p.hue},60%,${lightness}%,${p.alpha})`;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
}

let lastT = performance.now();
function loop(now){
  const dt = Math.min((now - lastT)/1000, 0.05);
  lastT = now;
  drawFrame(dt);
  requestAnimationFrame(loop);
}

// drag to stir
canvas.addEventListener('pointerdown', e => { dragging = true; });
canvas.addEventListener('pointermove', e => {
  if(!dragging) return;
  const [w,h] = viewportWH();
  dragX += e.movementX || 0;
  dragY += e.movementY || 0;
  dragX = Math.max(-w*0.3, Math.min(w*0.3, dragX));
  dragY = Math.max(-h*0.3, Math.min(h*0.3, dragY));
});
function endDrag(){ dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// gentle return to center
setInterval(() => {
  if(!dragging){ dragX *= 0.95; dragY *= 0.95; }
}, 50);

window.addEventListener('resize', () => {
  const [w,h] = viewportWH(); prep(w,h);
  ctx.fillStyle = '#0e0e12'; ctx.fillRect(0,0,w,h);
});
// init
{
  const [w,h] = viewportWH(); prep(w,h);
  ctx.fillStyle = '#0e0e12'; ctx.fillRect(0,0,w,h);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
