<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Naming of Names</title>
<style>
  html, body { margin: 0; padding: 0; background: #060606; overflow: hidden; width: 100%; height: 100%; }
  canvas { display: block; background: #060606; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Deterministic integer hash -> [0,1), for grain keyed by (dot, time index).
  function hash2(x, y) {
    var h = (x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = h ^ (h >>> 16);
    return (h >>> 0) / 4294967296;
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var RUST = [160, 82, 45];
  var DUST = [193, 68, 14];
  var GRAY = [110, 106, 99];
  var GROUND = '#060606';

  var W = 0, H = 0, minDim = 0;
  var isPhone = false;

  function sizeFromViewport() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (typeof window !== 'undefined' ? window.innerWidth : 800);
    var h = vv ? vv.height : (typeof window !== 'undefined' ? window.innerHeight : 600);
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    minDim = Math.min(W, H);
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : W;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : H;
    isPhone = (Math.min(sw, sh) < 700) || (H > W * 1.15);
  }
  sizeFromViewport();

  // ---- Contour systems -------------------------------------------------
  // Two superimposed topographical systems: Earth canyon (rust) and Mars
  // canyon (dust), offset centers, each a set of closed loops perturbed by
  // seeded periodic harmonics so every loop reads as an etching.
  var LOOPS_PER = 14;
  var SYSTEMS = [];
  (function buildSystems() {
    var defs = [
      { cx: 0.38, cy: 0.55, col: RUST, seed: 1367000 },
      { cx: 0.64, cy: 0.45, col: DUST, seed: 1367000 + 7919 }
    ];
    for (var s = 0; s < defs.length; s++) {
      var d = defs[s];
      var rnd = mulberry32(d.seed);
      var loops = [];
      for (var k = 0; k < LOOPS_PER; k++) {
        var R = minDim * (0.055 + k * 0.042);
        var har = [];
        var freqs = [2, 3, 5];
        var amps = [0.10, 0.06, 0.04];
        for (var j = 0; j < 3; j++) {
          har.push({ f: freqs[j], a: amps[j], p: rnd() * Math.PI * 2 });
        }
        loops.push({ R: R, har: har });
      }
      SYSTEMS.push({ cxF: d.cx, cyF: d.cy, col: d.col, loops: loops });
    }
  })();

  var NPTS = 160;
  function loopPoints(sys, loop) {
    var cx = sys.cxF * W, cy = sys.cyF * H;
    var pts = [];
    for (var i = 0; i < NPTS; i++) {
      var th = (i / NPTS) * Math.PI * 2;
      var mod = 1;
      for (var j = 0; j < loop.har.length; j++) {
        var h = loop.har[j];
        mod += h.a * Math.sin(h.f * th + h.p);
      }
      pts.push([cx + Math.cos(th) * loop.R * mod, cy + Math.sin(th) * loop.R * mod * 0.82]);
    }
    return pts;
  }

  // ---- Pseudo-script fragments -----------------------------------------
  // Invented glyph marks only: bars, dot pairs, chevrons, arcs, ticks.
  // Never letterforms, never readable words.
  var FRAGS = [];
  (function buildFrags() {
    var rnd = mulberry32(1367000 + 7919 * 3);
    for (var i = 0; i < 10; i++) {
      FRAGS.push({
        sys: i % 2,
        loop: 2 + Math.floor(rnd() * 10),
        s0: rnd(),
        speed: 0.008 + rnd() * 0.012,
        seed: Math.floor(rnd() * 100000)
      });
    }
  })();

  function drawMark(x, y, ang, kind, s, col) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1, s * 0.22);
    ctx.beginPath();
    if (kind === 0) { ctx.moveTo(-s, 0); ctx.lineTo(s, 0); }
    else if (kind === 1) { ctx.moveTo(-s, -s * 0.5); ctx.lineTo(0, s * 0.5); ctx.lineTo(s, -s * 0.5); }
    else if (kind === 2) { ctx.moveTo(-s * 0.7, 0); ctx.arc(0, 0, s * 0.7, Math.PI, 0); }
    else if (kind === 3) { ctx.moveTo(-s, -s * 0.4); ctx.lineTo(-s, s * 0.4); ctx.moveTo(0, -s * 0.4); ctx.lineTo(0, s * 0.4); }
    else { ctx.moveTo(-s, 0); ctx.lineTo(-s * 0.3, -s * 0.6); }
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.rect(s * 0.9, -1, 2, 2);
    ctx.fill();
    ctx.restore();
  }

  function drawFragment(f, t) {
    var sys = SYSTEMS[f.sys];
    var loop = sys.loops[f.loop];
    var pts = loopPoints(sys, loop);
    var s = (f.s0 + t * f.speed) % 1;
    var fi = s * NPTS;
    var i0 = Math.floor(fi) % NPTS;
    var i1 = (i0 + 1) % NPTS;
    var frac = fi - Math.floor(fi);
    var x = pts[i0][0] + (pts[i1][0] - pts[i0][0]) * frac;
    var y = pts[i0][1] + (pts[i1][1] - pts[i0][1]) * frac;
    var ang = Math.atan2(pts[i1][1] - pts[i0][1], pts[i1][0] - pts[i0][0]);
    var rnd = mulberry32(f.seed);
    var col = 'rgba(' + GRAY[0] + ',' + GRAY[1] + ',' + GRAY[2] + ',0.85)';
    var n = 4;
    for (var m = 0; m < n; m++) {
      var kind = Math.floor(rnd() * 5);
      var dx = (rnd() - 0.5) * 26;
      var dy = (rnd() - 0.5) * 12;
      var c = Math.cos(ang), sn = Math.sin(ang);
      drawMark(x + dx * c - dy * sn, y + dx * sn + dy * c, ang + (rnd() - 0.5) * 0.6, kind, 4 + rnd() * 3, col);
    }
  }

  // ---- Stars and grain --------------------------------------------------
  var STARS = [];
  (function buildStars() {
    var rnd = mulberry32(1367000 + 7919 * 7);
    for (var i = 0; i < 110; i++) {
      STARS.push({ x: rnd(), y: rnd(), a: 0.25 + rnd() * 0.6, s: rnd() < 0.2 ? 2 : 1 });
    }
  })();

  var GRAIN_N = 320;
  function drawGrain(t) {
    var q = Math.floor(t / 2);
    for (var i = 0; i < GRAIN_N; i++) {
      var gx = hash2(i * 2 + 11, 5) * W;
      var gy = hash2(i * 2 + 29, 7) * H;
      var a = 0.03 + 0.08 * hash2(i, q);
      ctx.fillStyle = 'rgba(' + GRAY[0] + ',' + GRAY[1] + ',' + GRAY[2] + ',' + a.toFixed(3) + ')';
      ctx.fillRect(gx, gy, 1.5, 1.5);
    }
  }

  // ---- Interaction: drag scrubs the canyon blend -----------------------
  // Closed-form over recorded drags: blend is the last dragged x fraction,
  // default 0.5 (both canyons superimposed). Left = Earth, right = Mars.
  var blend = 0.5;
  var dragging = false;
  function onDown(e) {
    dragging = true;
    var x = (e.clientX !== undefined) ? e.clientX : 0;
    blend = Math.max(0, Math.min(1, x / W));
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var x = (e.clientX !== undefined) ? e.clientX : 0;
    blend = Math.max(0, Math.min(1, x / W));
    if (e.preventDefault) e.preventDefault();
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---- Draw --------------------------------------------------------------
  var LOOP_DUR = 48;
  function rgba(col, a) {
    return 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + a.toFixed(3) + ')';
  }

  var nowT = 0;
  function draw(t) {
    nowT = t;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Stars (static seeded field).
    for (var i = 0; i < STARS.length; i++) {
      var st = STARS[i];
      ctx.fillStyle = 'rgba(' + GRAY[0] + ',' + GRAY[1] + ',' + GRAY[2] + ',' + st.a.toFixed(3) + ')';
      ctx.fillRect(st.x * W, st.y * H, st.s, st.s);
    }

    var lw = Math.max(1, Math.min(2, minDim / 700));
    var earthA = 0.06 + 0.94 * (1 - blend);
    var marsA = 0.06 + 0.94 * blend;
    var sysA = [earthA, marsA];
    var g = 0;
    for (var s = 0; s < SYSTEMS.length; s++) {
      var sys = SYSTEMS[s];
      for (var k = 0; k < sys.loops.length; k++) {
        var loop = sys.loops[k];
        var phase = (t + g * 1.7) % LOOP_DUR;
        g++;
        var frac, alpha;
        if (phase < 10) { frac = phase / 10; alpha = phase / 10; }
        else if (phase < 34) { frac = 1; alpha = 1; }
        else { frac = 1; alpha = (LOOP_DUR - phase) / 14; }
        var a = alpha * sysA[s] * 0.9;
        if (a <= 0.01 || frac <= 0.01) continue;
        var pts = loopPoints(sys, loop);
        var count = Math.max(2, Math.floor(frac * NPTS));
        ctx.strokeStyle = rgba(sys.col, a);
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (var p = 1; p < count; p++) {
          ctx.lineTo(pts[p][0], pts[p][1]);
        }
        if (frac >= 1) ctx.closePath();
        ctx.stroke();
      }
    }

    // Pseudo-script fragments drifting along contour lines.
    for (var f = 0; f < FRAGS.length; f++) {
      drawFragment(FRAGS[f], t);
    }

    // Constant film grain.
    drawGrain(t);
  }

  function onResize() {
    sizeFromViewport();
    draw(nowT);
  }
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  if (vv && vv.addEventListener) vv.addEventListener('resize', onResize);
  if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', onResize);

  // Frame one is a constant phase: draw(0) synchronously at load.
  draw(0);

  // rAF loop as a plain function declaration behind a typeof guard.
  var startTime = null;
  function loop(ts) {
    if (startTime === null) startTime = ts;
    draw((ts - startTime) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
