<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>It Improves While Watched</title>
<style>
html, body { margin: 0; padding: 0; background: #EDE4D3; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#EDE4D3';
var FLOOR = '#DFD2B8';
var PLATE = '#2E2820';
var PLATE_LINE = 'rgba(237,228,211,0.5)';
var TITLE_INK = '#EFE7D6';
var HINT_INK = '#EFE7D6';
var COUNTER_INK = '#5C4A33';
/* Pre-roll: frame one is blended from seeded noise toward the clean render
   at exactly FIRST_SPP samples, alpha SAMPLE_ALPHA each. Clean fraction
   1 - (1 - 0.012)^64 = 0.538, a half-resolved still life. */
var FIRST_SPP = 64;
var SAMPLE_ALPHA = 0.012;
var CONVERGE_MAX = 0.96;
var RENOISE_FLOOR = 0.12;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixRgb(a, b, f) {
  return [
    Math.round(a[0] + (b[0] - a[0]) * f),
    Math.round(a[1] + (b[1] - a[1]) * f),
    Math.round(a[2] + (b[2] - a[2]) * f)
  ];
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  var changed = (vw !== VW || vh !== VH);
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (changed) { noisePx = null; }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- the clean still life: folded plates, a torus knot, a small cup ---- */
function drawStillLife(orbit) {
  var st = stageRect();
  var horizonY = st.y + st.h * 0.60;
  var cx = st.x + st.w * 0.5;
  var cy = horizonY;
  var ox = orbit * st.w * 0.02;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* infinite floor spans the full viewport width */
  ctx.fillStyle = FLOOR;
  ctx.fillRect(0, horizonY, VW, VH - horizonY);
  ctx.strokeStyle = 'rgba(92,74,51,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, horizonY + 0.5);
  ctx.lineTo(VW, horizonY + 0.5);
  ctx.stroke();
  /* soft key light behind the subject */
  var glow = ctx.createRadialGradient(cx + ox, horizonY - st.h * 0.22, 10, cx + ox, horizonY - st.h * 0.22, st.w * 0.42);
  glow.addColorStop(0, 'rgba(255,246,228,0.85)');
  glow.addColorStop(1, 'rgba(255,246,228,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, VW, horizonY);
  /* floor shadows, layered soft ellipses */
  var sh;
  for (sh = 0; sh < 3; sh++) {
    ctx.fillStyle = 'rgba(60,45,30,' + (0.10 - sh * 0.025).toFixed(4) + ')';
    ctx.beginPath();
    ctx.ellipse(cx + ox, cy + st.h * 0.075, st.w * (0.30 + sh * 0.03), st.h * (0.028 + sh * 0.006), 0, 0, TAU);
    ctx.fill();
  }
  /* folded plates, stacked, left of center */
  var px = st.x + st.w * 0.38 + ox * 0.6;
  var py = cy + st.h * 0.055;
  var pw = st.w * 0.175, ph = st.h * 0.034;
  var plateCols = ['#F4EDE0', '#B45A32', '#7A8B5A', '#D9C9A8'];
  var i;
  for (i = 0; i < 4; i++) {
    var iy = py - i * st.h * 0.022;
    ctx.fillStyle = 'rgba(60,45,30,0.30)';
    ctx.beginPath();
    ctx.ellipse(px, iy + st.h * 0.008, pw, ph, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = plateCols[i];
    ctx.beginPath();
    ctx.ellipse(px, iy, pw, ph, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,45,30,0.55)';
    ctx.lineWidth = Math.max(1, st.w * 0.002);
    ctx.beginPath();
    ctx.ellipse(px, iy, pw, ph, 0, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(60,45,30,0.35)';
    ctx.lineWidth = Math.max(1, st.w * 0.0015);
    ctx.beginPath();
    ctx.ellipse(px, iy, pw * 0.72, ph * 0.62, 0, 0, TAU);
    ctx.stroke();
  }
  /* folded cloth beside the plates */
  var fx = st.x + st.w * 0.56 + ox * 0.6;
  var fy = cy + st.h * 0.045;
  var fw = st.w * 0.085, fh = st.h * 0.045;
  ctx.fillStyle = '#A08050';
  ctx.beginPath();
  ctx.moveTo(fx - fw, fy);
  ctx.lineTo(fx, fy - fh);
  ctx.lineTo(fx + fw, fy);
  ctx.lineTo(fx, fy + fh);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(60,45,30,0.5)';
  ctx.lineWidth = Math.max(1, st.w * 0.0015);
  ctx.beginPath();
  ctx.moveTo(fx - fw, fy);
  ctx.lineTo(fx, fy - fh);
  ctx.lineTo(fx + fw, fy);
  ctx.lineTo(fx, fy + fh);
  ctx.closePath();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(60,45,30,0.4)';
  ctx.lineWidth = Math.max(1, st.w * 0.0012);
  ctx.beginPath();
  ctx.moveTo(fx - fw * 0.55, fy - fh * 0.45);
  ctx.lineTo(fx + fw * 0.55, fy + fh * 0.45);
  ctx.moveTo(fx + fw * 0.55, fy - fh * 0.45);
  ctx.lineTo(fx - fw * 0.55, fy + fh * 0.45);
  ctx.stroke();
  /* torus knot, right of center, drawn back to front as shaded discs */
  var kx = st.x + st.w * 0.68 + ox;
  var ky = horizonY - st.h * 0.16;
  var R = st.h * 0.115;
  var dark = hexRgb('#5C4632'), light = hexRgb('#C9A87C');
  var pts = [];
  var t, X, Y, Z;
  for (t = 0; t < 220; t++) {
    var a = t / 220 * TAU + orbit * 0.25;
    X = (2 + Math.cos(3 * a)) * Math.cos(2 * a);
    Y = (2 + Math.cos(3 * a)) * Math.sin(2 * a);
    Z = Math.sin(3 * a);
    pts.push({ x: kx + X * R * 0.42, y: ky + (Y * 0.42 - Z * 0.30) * R, z: Z });
  }
  pts.sort(function (p, q) { return p.z - q.z; });
  var p;
  for (p = 0; p < pts.length; p++) {
    var pt = pts[p];
    var f = (pt.z + 1) / 2;
    var col = mixRgb(dark, light, f);
    ctx.fillStyle = 'rgb(' + col[0] + ',' + col[1] + ',' + col[2] + ')';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, R * (0.115 + 0.05 * f), 0, TAU);
    ctx.fill();
  }
  /* small cup, far right, with a highlight */
  var ux = st.x + st.w * 0.84 + ox * 0.8;
  var uy = cy + st.h * 0.03;
  var ur = st.w * 0.04;
  ctx.fillStyle = '#7A6A54';
  ctx.beginPath();
  ctx.arc(ux, uy, ur, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,246,228,0.55)';
  ctx.beginPath();
  ctx.arc(ux - ur * 0.35, uy - ur * 0.35, ur * 0.4, 0, TAU);
  ctx.fill();
}
/* ---- seeded monochrome noise, chunky 2x2 cells ---- */
var noisePx = null;
function buildNoise() {
  var n = VW * VH * 4, i;
  noisePx = new Uint8ClampedArray(n);
  var cw = Math.ceil(VW / 2), ch = Math.ceil(VH / 2);
  var rng = mulberry32(1700);
  var cell = new Uint8ClampedArray(cw * ch);
  for (i = 0; i < cw * ch; i++) cell[i] = 118 + Math.floor((rng() * 2 - 1) * 92);
  var x, y;
  for (y = 0; y < VH; y++) {
    var row = Math.floor(y / 2) * cw;
    for (x = 0; x < VW; x++) {
      var g = cell[row + (x >> 1)];
      var o = (y * VW + x) * 4;
      noisePx[o] = g; noisePx[o + 1] = g; noisePx[o + 2] = g; noisePx[o + 3] = 255;
    }
  }
}
/* ---- accumulation: clean fraction c, spp display derived from c ---- */
var converge = 1 - Math.pow(1 - SAMPLE_ALPHA, FIRST_SPP);
var orbit = 0, orbitTarget = 0;
var lastMoveT = -100, frameNo = 0;
var clockT = 0, prevTs = null, t0 = null, lastDrawn = 0;
var outImg = null;
function sppOf(c) {
  return Math.round(-Math.log(1 - c) / SAMPLE_ALPHA);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('It Improves While Watched').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('It Improves While Watched').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 07').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('It Improves While Watched', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 07', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Move to orbit, stillness refines.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  /* nearly invisible sample counter, lower right */
  var counter = 'spp ' + sppOf(converge);
  ctx.font = smallPx + 'px monospace';
  var cw2 = ctx.measureText(counter).width;
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = COUNTER_INK;
  ctx.fillText(counter, VW - cw2 - 14, VH - smallPx - 14);
  ctx.globalAlpha = 1;
}
function draw() {
  size();
  frameNo++;
  if (!noisePx) buildNoise();
  /* clean render, captured as pixels */
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawStillLife(orbit);
  var cleanImg;
  try {
    cleanImg = ctx.getImageData(0, 0, VW, VH);
  } catch (e) {
    return;
  }
  var clean = cleanImg.data;
  if (!outImg || outImg.width !== VW || outImg.height !== VH) {
    outImg = ctx.createImageData(VW, VH);
  }
  var out = outImg.data;
  var c = converge, nc = 1 - c;
  var i;
  for (i = 0; i < out.length; i += 4) {
    out[i] = noisePx[i] * nc + clean[i] * c;
    out[i + 1] = noisePx[i + 1] * nc + clean[i + 1] * c;
    out[i + 2] = noisePx[i + 2] * nc + clean[i + 2] * c;
    out[i + 3] = 255;
  }
  ctx.putImageData(outImg, 0, 0);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
function onPointer(x, y) {
  lastMoveT = clockT;
  orbitTarget = clamp((x - VW / 2) / (VW / 2), -1, 1);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function () { draw(); },
    converge: function () { return converge; },
    spp: function () { return sppOf(converge); },
    firstSpp: function () { return FIRST_SPP; }
  };
}
/* ---- frame one: pre-rolled to FIRST_SPP samples, orbit 0, still pointer ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (canvas.addEventListener) {
  canvas.addEventListener('pointermove', function (e) { onPointer(e.clientX, e.clientY); });
  canvas.addEventListener('pointerdown', function (e) { onPointer(e.clientX, e.clientY); });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    var hidden = false;
    try { hidden = document.hidden; } catch (e) { hidden = false; }
    /* convergence is slow; re-blend at most 4 times a second */
    if (!hidden && clockT - lastDrawn >= 0.25) {
      var step = clockT - lastDrawn;
      var still = (clockT - lastMoveT) > 1.5;
      if (still) {
        converge += (CONVERGE_MAX - converge) * (1 - Math.exp(-0.03 * step));
      } else {
        converge += (RENOISE_FLOOR - converge) * (1 - Math.exp(-2.2 * step));
      }
      orbit += (orbitTarget - orbit) * Math.min(1, step * 2);
      draw();
      lastDrawn = clockT;
    }
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
