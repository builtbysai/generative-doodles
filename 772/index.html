<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Arch</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #101012;
    overflow: hidden;
  }
  canvas {
    display: block;
    cursor: grab;
    touch-action: none;
  }
  canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Strict palette (Mary Corse, Arch paintings). Nothing outside these
  // anchors is ever drawn; every other tone is a mix of them.
  var ARCH  = [245, 244, 240];  // #F5F4F0 arch body
  var FLARE = [255, 253, 244];  // #FFFDF4 full flare
  var FIELD = [16, 16, 18];     // #101012 black field
  var EDGE  = [42, 42, 46];     // #2A2A2E arch edge shadow
  var TINT  = [244, 232, 200];  // #F4E8C8 warm flare tint

  function lerp(a, b, u) { return a + (b - a) * u; }

  function mix(c1, c2, u) {
    return [lerp(c1[0], c2[0], u), lerp(c1[1], c2[1], u), lerp(c1[2], c2[2], u)];
  }

  function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }

  function rgbString(c, a) {
    if (typeof a === 'number') {
      return 'rgba(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ',' + a + ')';
    }
    return 'rgb(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ')';
  }

  function smooth01(v) {
    v = Math.max(0, Math.min(1, v));
    return v * v * (3 - 2 * v);
  }

  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---- Arch geometry ------------------------------------------------------
  // The arch is ONE shortened band, Corse's construction: up one post,
  // across a shallow circular arc, down the other post. All dimensions are
  // in units of the arch's total height S, y measured upward from the base.
  var AW = 0.58;                          // total width / total height
  var BT = 0.085;                         // band thickness
  var PA = AW / 2 - BT / 2;               // 0.2475 post centerline offset
  var SAG = 0.16 * AW;                    // 0.0928 arc sagitta (shallow)
  var SPRING = 1 - SAG - BT / 2;          // 0.8647 post top / chord height
  var RAD = (PA * PA + SAG * SAG) / (2 * SAG); // 0.3765 arc radius
  var CY = SPRING + SAG - RAD;            // 0.5810 arc center height
  var PHIMAX = Math.asin(PA / RAD);       // arc half-angle at the posts

  function layout() {
    // Human-scaled: taller than wide, generous black margins on every
    // side, on phones as on desktop.
    var S = Math.min(0.74 * H, (0.84 * W) / AW);
    return { S: S, cx: W / 2, baseY: 0.875 * H, phone: isPhone() };
  }

  // Outline of the whole band as a canvas-space point list: outer edge up
  // the left post, sampled outer arc, down the right post, across the
  // base, up the inner right post, sampled inner arc back, down the inner
  // left post. One continuous path, post and lintel in a single stroke.
  function archPoints(L) {
    var S = L.S, cx = L.cx, baseY = L.baseY;
    var pts = [];
    function P(x, y) { pts.push([cx + x * S, baseY - y * S]); }
    var xo = PA + BT / 2, xi = PA - BT / 2;
    var Ro = RAD + BT / 2, Ri = RAD - BT / 2;
    var phiO = Math.asin(xo / Ro), phiI = Math.asin(xi / Ri);
    var yJoinO = CY + Ro * Math.cos(phiO);
    var yJoinI = CY + Ri * Math.cos(phiI);
    var i, phi, SEG = 44;
    P(-xo, 0);
    P(-xo, yJoinO);
    for (i = 1; i <= SEG; i++) {
      phi = -phiO + 2 * phiO * i / SEG;
      P(Ro * Math.sin(phi), CY + Ro * Math.cos(phi));
    }
    P(xo, yJoinO);
    P(xo, 0);
    P(xi, 0);
    P(xi, yJoinI);
    for (i = 1; i <= SEG; i++) {
      phi = phiI - 2 * phiI * i / SEG;
      P(Ri * Math.sin(phi), CY + Ri * Math.cos(phi));
    }
    P(-xi, yJoinI);
    P(-xi, 0);
    return pts;
  }

  // The empty opening: inner post edges, inner arc, base. Used to clip
  // the glow so the light stays inside the doorway.
  function openingPoints(L) {
    var S = L.S, cx = L.cx, baseY = L.baseY;
    var pts = [];
    function P(x, y) { pts.push([cx + x * S, baseY - y * S]); }
    var xi = PA - BT / 2, Ri = RAD - BT / 2;
    var phiI = Math.asin(xi / Ri);
    var yJoinI = CY + Ri * Math.cos(phiI);
    var i, phi, SEG = 44;
    P(-xi, 0);
    P(-xi, yJoinI);
    for (i = 1; i <= SEG; i++) {
      phi = -phiI + 2 * phiI * i / SEG;
      P(Ri * Math.sin(phi), CY + Ri * Math.cos(phi));
    }
    P(xi, yJoinI);
    P(xi, 0);
    return pts;
  }

  function pathFrom(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  // ---- Microsphere grain --------------------------------------------------
  // Seeded points inside the band, placed parametrically: along the posts
  // (offset across the band thickness) and along the arc (radial offset).
  // Unit-space data, independent of viewport, so the field is identical
  // at every size. Visibility is tied to the arch's brightness: the beads
  // only read where the light is.
  var GRAIN = (function () {
    var rnd = mulberry32(7720501);
    var pts = [];
    var N = 2600, i, r, x, y;
    for (i = 0; i < N; i++) {
      r = rnd();
      if (r < 0.62) {
        var side = rnd() < 0.5 ? -1 : 1;
        y = rnd() * SPRING;
        x = side * PA + (rnd() * 2 - 1) * (BT / 2) * 0.94;
      } else {
        var phi = (rnd() * 2 - 1) * PHIMAX * 0.99;
        var rr = RAD + (rnd() * 2 - 1) * (BT / 2) * 0.94;
        x = rr * Math.sin(phi);
        y = CY + rr * Math.cos(phi);
      }
      pts.push({
        x: x, y: y,
        s: 0.7 + rnd() * 1.3,
        a: 0.35 + rnd() * 0.65,
        warm: rnd() < 0.22
      });
    }
    return pts;
  })();

  // ---- Approach state -----------------------------------------------------
  // Brightness is a function of approach distance d in [0,1]: 0 near,
  // 1 far. d(t) = idle drift + drag offset. Every term is closed-form in
  // recorded pointer samples and t, so frame one (t = 0, d = 0.5, mid
  // approach) is reproducible exactly and never touches Date.now().
  var DRIFT_PERIOD = 25;   // seconds, idle in-and-out cycle
  var EASE_TAU = 2.8;      // seconds, offset ease-back after release

  var mode = 'idle';       // 'idle' | 'drag' | 'ease'
  var dragYDown = 0, dragOffDown = 0, dragOffCur = 0;
  var relT = 0, relOff = 0;

  function clockT() {
    var n = (typeof performance !== 'undefined' && performance.now)
      ? performance.now() : 0;
    return n / 1000;
  }
  var clock0 = clockT();
  var startT = 0;

  function eventT() { return startT + (clockT() - clock0); }

  function offsetAt(t) {
    if (mode === 'drag') return dragOffCur;
    if (mode === 'ease') {
      return relOff * Math.exp(-Math.max(0, t - relT) / EASE_TAU);
    }
    return 0;
  }

  function approachAt(t) {
    var dIdle = 0.5 + 0.38 * Math.sin(2 * Math.PI * t / DRIFT_PERIOD);
    var d = dIdle + offsetAt(t);
    d = Math.max(0.02, Math.min(0.98, d));
    return 1 - d;
  }

  function pointerY(ev) {
    if (typeof ev.clientY === 'number') return ev.clientY;
    if (ev.touches && ev.touches.length) return ev.touches[0].clientY;
    return 0;
  }

  canvas.addEventListener('pointerdown', function (ev) {
    var t = eventT();
    dragOffDown = offsetAt(t);
    dragOffCur = dragOffDown;
    dragYDown = pointerY(ev);
    mode = 'drag';
    if (canvas.setPointerCapture && ev.pointerId !== undefined) {
      try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    }
  });

  canvas.addEventListener('pointermove', function (ev) {
    if (mode !== 'drag') return;
    // Drag up = approach (offset down), drag down = retreat. One full
    // viewport height of travel covers the whole distance range.
    var k = H > 0 ? 1.0 / H : 0.001;
    dragOffCur = Math.max(-0.55, Math.min(0.55,
      dragOffDown + (pointerY(ev) - dragYDown) * k));
  });

  function endDrag() {
    if (mode !== 'drag') return;
    relT = eventT();
    relOff = dragOffCur;
    mode = 'ease';
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', endDrag);

  // ---- Draw ---------------------------------------------------------------
  function draw(t) {
    if (!W || !H) resize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var L = layout();
    var S = L.S, cx = L.cx, baseY = L.baseY;
    var u = Math.max(0.8, Math.min(W, H) / 720);

    var a = approachAt(t);                    // 0 far, 1 near
    var a2 = a * a;
    var glowG = Math.pow(smooth01((a - 0.35) / 0.65), 1.5);
    var grainVis = 0.95 * Math.pow(smooth01((a - 0.12) / 0.88), 1.2);

    var fillCol = mix(mix(ARCH, TINT, 0.32 * a2), FLARE, 0.85 * a2);
    var fillAlpha = 0.08 + 0.90 * Math.pow(a, 1.2);

    // Field.
    ctx.fillStyle = rgbString(FIELD);
    ctx.fillRect(0, 0, W, H);

    var outline = archPoints(L);

    // Ground contact: a quiet shadow pool under the arch base.
    ctx.beginPath();
    ctx.ellipse(cx, baseY + 0.012 * S, (PA + BT) * S, 0.028 * S, 0, 0, Math.PI * 2);
    ctx.fillStyle = rgbString(EDGE, 0.30);
    ctx.fill();

    // Glow inside the opening, clipped to the doorway: layered alpha
    // ellipses (the house substitute for a radial gradient), radius and
    // strength growing as the viewer approaches. Drawn before the arch
    // so the band always sits in front of its own light.
    if (glowG > 0.003) {
      ctx.save();
      pathFrom(openingPoints(L));
      ctx.clip();
      var openHW = (PA - BT / 2) * S;
      var gx = cx, gy = baseY - 0.44 * S;
      var rx = openHW * (0.45 + 0.95 * glowG);
      var ry = rx * 1.6;
      var glowCol = mix(FLARE, TINT, 0.35);
      // Many thin layers, outer ones fainter, so the stack falls off
      // smoothly toward the opening's edges instead of stepping.
      var layers = 30, i, f;
      for (i = layers; i >= 1; i--) {
        f = i / layers;
        ctx.beginPath();
        ctx.ellipse(gx, gy, rx * f, ry * f, 0, 0, Math.PI * 2);
        ctx.fillStyle = rgbString(glowCol,
          (0.032 * glowG + 0.0085) * (1.2 - 0.65 * f));
        ctx.fill();
      }
      // Spill on the ground inside the doorway.
      ctx.beginPath();
      ctx.ellipse(cx, baseY - 0.006 * S, openHW * 1.02, 0.045 * S, 0, 0, Math.PI * 2);
      ctx.fillStyle = rgbString(TINT, 0.10 * glowG);
      ctx.fill();
      ctx.restore();
    }

    // Halo: the outline swollen slightly about the base center, in warm
    // tint at very low alpha, only when near. Light bleeding off the band.
    if (glowG > 0.003) {
      ctx.save();
      ctx.translate(cx, baseY);
      ctx.scale(1.05, 1.05);
      ctx.translate(-cx, -baseY);
      pathFrom(outline);
      ctx.fillStyle = rgbString(TINT, 0.05 * glowG);
      ctx.fill();
      ctx.restore();
    }

    // Edge shadow rim: stroke the outline wide in the dark edge tone
    // first; the fill covers the inner half, leaving a thin dark rim
    // standing between the white band and the black field.
    pathFrom(outline);
    ctx.strokeStyle = rgbString(EDGE, 0.9);
    ctx.lineWidth = 2.2 * u + 0.8;
    ctx.stroke();

    // The band itself.
    pathFrom(outline);
    ctx.fillStyle = rgbString(fillCol, fillAlpha);
    ctx.fill();

    // Pale outline: as the arch dims toward far, the fill thins and this
    // stroke takes over, so at distance only the outline remains.
    pathFrom(outline);
    ctx.strokeStyle = rgbString(mix(ARCH, FLARE, a), 0.30 + 0.25 * (1 - a));
    ctx.lineWidth = 1.2 * u;
    ctx.stroke();

    // Microsphere grain, clipped to the band. Beads appear only in the
    // light: their alpha rides on the arch's brightness.
    if (grainVis > 0.01) {
      ctx.save();
      pathFrom(outline);
      ctx.clip();
      var i2, p;
      for (i2 = 0; i2 < GRAIN.length; i2++) {
        p = GRAIN[i2];
        ctx.fillStyle = rgbString(p.warm ? TINT : FLARE, p.a * grainVis);
        var sz = p.s * u;
        ctx.fillRect(cx + p.x * S - sz / 2, baseY - p.y * S - sz / 2, sz, sz);
      }
      ctx.restore();
    }
  }

  // Inert QA hook (house convention): ?seed=tNN draws frame one at loop
  // time NN seconds. Without the parameter the piece starts at t = 0.
  var searchStr = (window.location && window.location.search) ||
    (typeof location !== 'undefined' ? location.search : '') || '';
  var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(searchStr);
  if (m) startT = parseFloat(m[1]);

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(startT); });
  }
  window.addEventListener('resize', function () { resize(); draw(startT); });

  // Frame one: the synchronous draw at t = startT (0 in normal viewing:
  // mid approach, arch clearly lit, opening beginning to glow).
  draw(startT);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts;
      draw(startT + (ts - t0) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
