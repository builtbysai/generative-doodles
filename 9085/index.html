<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9085 · Orbit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #D8D4C8; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var SEED = 9085;
  var GROUND = '#D8D4C8';
  var ACCENT = '#C23E1D';
  var INKS = ['#2E2C28', '#4A4A44', '#8A867B', '#A39E8E', '#C4BFAE', '#5A6068'];

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }

  var motifs = [];
  var accentIdx = 0;

  function layout() {
    var rnd = mulberry32(SEED);
    motifs = [];
    var minDim = Math.min(W, H);
    var count = 9 + Math.floor(rnd() * 4); // 9..12 motifs
    // Loose jittered lattice, not a strict grid (unlike 9080's 5x7)
    var cols = 3 + Math.floor(rnd() * 2);
    var rows = 3 + Math.floor(rnd() * 2);
    var cells = [];
    for (var i = 0; i < cols; i++) {
      for (var j = 0; j < rows; j++) cells.push([i, j]);
    }
    // Shuffle cells, take `count`
    for (var s = cells.length - 1; s > 0; s--) {
      var k = Math.floor(rnd() * (s + 1));
      var tmp = cells[s]; cells[s] = cells[k]; cells[k] = tmp;
    }
    cells = cells.slice(0, Math.min(count, cells.length));

    accentIdx = Math.floor(rnd() * cells.length);

    for (var m = 0; m < cells.length; m++) {
      var cell = cells[m];
      var cx = (cell[0] + 0.5) / cols * W + (rnd() - 0.5) * W / cols * 0.35;
      var cy = (cell[1] + 0.5) / rows * H + (rnd() - 0.5) * H / rows * 0.35;
      var R = minDim * (0.06 + rnd() * 0.075);
      var type = ['rings', 'rings', 'quarter', 'half', 'disc', 'dotfield'][Math.floor(rnd() * 6)];
      var ringCount = 2 + Math.floor(rnd() * 3);
      var rot = Math.floor(rnd() * 4) * Math.PI / 2 + (rnd() < 0.3 ? Math.PI / 4 : 0);
      var rotSpeed = (rnd() - 0.5) * 0.12;
      var breathAmp = 0.02 + rnd() * 0.025;
      var phase = rnd() * Math.PI * 2;
      var colors = [];
      for (var q = 0; q < ringCount + 1; q++) {
        colors.push(INKS[Math.floor(rnd() * INKS.length)]);
      }
      motifs.push({
        x: cx, y: cy, R: R, type: type, rings: ringCount,
        rot: rot, rotSpeed: rotSpeed, breath: breathAmp, phase: phase,
        colors: colors, pop: 0
      });
    }
  }

  function drawMotif(mo, t, isAccent) {
    var breathe = 1 + mo.breath * Math.sin(t * 0.6 + mo.phase);
    var R = mo.R * breathe;
    var rot = mo.rot + mo.rotSpeed * t;
    var popScale = 1 + mo.pop * 0.35;
    R *= popScale;
    ctx.save();
    ctx.translate(mo.x, mo.y);

    if (mo.type === 'rings') {
      // Concentric stroked rings, hard edges
      for (var i = 0; i < mo.rings; i++) {
        var rr = R * (1 - i * (0.85 / mo.rings));
        var col = (isAccent && i === 0) ? ACCENT : mo.colors[i % mo.colors.length];
        ctx.strokeStyle = col;
        ctx.lineWidth = Math.max(3, R * 0.16);
        ctx.beginPath();
        ctx.arc(0, 0, rr, 0, Math.PI * 2);
        ctx.stroke();
      }
      // Center dot
      ctx.fillStyle = isAccent ? ACCENT : mo.colors[mo.rings % mo.colors.length];
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(2.5, R * 0.09), 0, Math.PI * 2);
      ctx.fill();
    } else if (mo.type === 'quarter') {
      // Quarter-circle arcs rotating slowly
      ctx.rotate(rot);
      for (var j = 0; j < mo.rings; j++) {
        var qr = R * (1 - j * (0.8 / mo.rings));
        var col2 = (isAccent && j === 0) ? ACCENT : mo.colors[j % mo.colors.length];
        ctx.strokeStyle = col2;
        ctx.lineWidth = Math.max(4, R * 0.2);
        ctx.beginPath();
        ctx.arc(0, 0, qr, 0, Math.PI / 2);
        ctx.stroke();
        // Second arc opposite
        ctx.strokeStyle = mo.colors[(j + 2) % mo.colors.length];
        ctx.beginPath();
        ctx.arc(0, 0, qr, Math.PI, Math.PI * 1.5);
        ctx.stroke();
      }
    } else if (mo.type === 'half') {
      // Half disc, flat fill
      ctx.rotate(rot);
      ctx.fillStyle = isAccent ? ACCENT : mo.colors[0];
      ctx.beginPath();
      ctx.arc(0, 0, R, -Math.PI / 2, Math.PI / 2);
      ctx.closePath();
      ctx.fill();
      // Thin dividing line
      ctx.strokeStyle = GROUND;
      ctx.lineWidth = Math.max(2, R * 0.05);
      ctx.beginPath();
      ctx.moveTo(0, -R); ctx.lineTo(0, R);
      ctx.stroke();
    } else if (mo.type === 'disc') {
      // Solid disc with ring
      ctx.fillStyle = isAccent ? ACCENT : mo.colors[0];
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.72, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = mo.colors[1];
      ctx.lineWidth = Math.max(3, R * 0.12);
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.94, 0, Math.PI * 2);
      ctx.stroke();
    } else { // dotfield
      // Small cluster of dots in circular arrangement
      var n = 5 + mo.rings;
      for (var d = 0; d < n; d++) {
        var a = (d / n) * Math.PI * 2 + rot * 0.5;
        var dr = R * 0.55;
        var dotCol = (isAccent && d === 0) ? ACCENT : mo.colors[d % mo.colors.length];
        ctx.fillStyle = dotCol;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * dr, Math.sin(a) * dr, Math.max(2.5, R * 0.1), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = isAccent ? ACCENT : mo.colors[0];
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(2.5, R * 0.1), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  var startT = performance.now() / 1000;
  var lastReconf = 0;

  function frame() {
    var now = performance.now() / 1000;
    var t = now - startT;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Slow reconfiguration: every ~12s one motif swaps type
    if (t - lastReconf > 12) {
      lastReconf = t;
      var rnd = mulberry32(SEED + Math.floor(t));
      var mi = Math.floor(rnd() * motifs.length);
      var types = ['rings', 'quarter', 'half', 'disc', 'dotfield'];
      motifs[mi].type = types[Math.floor(rnd() * types.length)];
      motifs[mi].pop = 1;
    }

    for (var i = 0; i < motifs.length; i++) {
      var mo = motifs[i];
      if (mo.pop > 0) mo.pop = Math.max(0, mo.pop - 0.03);
      drawMotif(mo, t, i === accentIdx);
    }
    requestAnimationFrame(frame);
  }

  // Tap: reconfigure nearest motif
  cv.addEventListener('pointerdown', function (e) {
    var x = e.clientX, y = e.clientY;
    var best = -1, bestD = Infinity;
    for (var i = 0; i < motifs.length; i++) {
      var dx = motifs[i].x - x, dy = motifs[i].y - y;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0) {
      var types = ['rings', 'quarter', 'half', 'disc', 'dotfield'];
      var cur = types.indexOf(motifs[best].type);
      motifs[best].type = types[(cur + 1) % types.length];
      motifs[best].pop = 1;
    }
  });

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
