<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9085 · Fission</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #D8D4C8; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var SEED = 9085;
  var GROUND = '#D8D4C8';
  var MAX_DEPTH = 5;
  var MIN_SIZE = 0.06; // normalized
  var GAP = 0.004;     // normalized gap between cells
  var SPLIT_DUR = 0.7; // seconds
  var IDLE_MIN = 5, IDLE_MAX = 9;

  var ACCENT = '#C23E1D';
  var PALETTE = ['#2E2C28', '#3A3833', '#5A6068', '#6E6A5E', '#8A867B', '#A39E8E', '#B8B2A2', '#CFC9B8'];

  // Seeded RNG (mulberry32)
  var _s = SEED >>> 0;
  function rnd() {
    _s |= 0; _s = _s + 0x6D2B79F5 | 0;
    var t = Math.imul(_s ^ _s >>> 15, 1 | _s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var vw = window.innerWidth, vh = window.innerHeight;
    if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
    W = vw; H = vh;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---- Subdivision tree (normalized 0..1 coordinates) ----

  var accentCount = 0;

  function makeLeaf(x, y, w, h, depth) {
    var color;
    if (accentCount < 2 && depth >= 2 && rnd() < 0.06) {
      color = ACCENT; accentCount++;
    } else {
      var r = rnd();
      color = r < 0.45 ? pick(['#CFC9B8', '#B8B2A2', '#A39E8E']) : pick(PALETTE);
    }
    return { x: x, y: y, w: w, h: h, depth: depth, color: color, split: null };
  }

  function trySplit(node) {
    if (node.split) return false;
    if (node.depth >= MAX_DEPTH) return false;
    if (node.w < MIN_SIZE && node.h < MIN_SIZE) return false;
    var dir = node.w >= node.h ? 'v' : 'h';
    if (rnd() < 0.18) dir = dir === 'v' ? 'h' : 'v';
    var target = 0.32 + rnd() * 0.36;
    var a, b;
    if (dir === 'v') {
      a = makeLeaf(node.x, node.y, node.w * target, node.h, node.depth + 1);
      b = makeLeaf(node.x + node.w * target, node.y, node.w * (1 - target), node.h, node.depth + 1);
    } else {
      a = makeLeaf(node.x, node.y, node.w, node.h * target, node.depth + 1);
      b = makeLeaf(node.x, node.y + node.h * target, node.w, node.h * (1 - target), node.depth + 1);
    }
    node.split = { dir: dir, target: target, pos: 0, a: a, b: b, anim: null };
    node.split.anim = { from: 0, to: target, t: 0, dur: SPLIT_DUR, mode: 'split' };
    return true;
  }

  function tryMerge(node) {
    if (!node.split) return false;
    var sp = node.split;
    if (sp.a.split || sp.b.split) return false;
    if (sp.anim) return false;
    sp.anim = { from: sp.pos, to: sp.pos < 0.5 ? 0 : 1, t: 0, dur: SPLIT_DUR * 0.8, mode: 'merge' };
    return true;
  }

  function buildInitial() {
    accentCount = 0;
    var root = makeLeaf(0.035, 0.035, 0.93, 0.93, 0);
    var changed = true, guard = 0;
    while (changed && guard++ < 40) {
      changed = false;
      (function walk(n) {
        if (!n.split && n.depth < 3 && (n.w > 0.22 || n.h > 0.22) && rnd() < 0.85) {
          if (trySplit(n)) { n.split.pos = n.split.target; n.split.anim = null; changed = true; }
        }
        if (n.split) { walk(n.split.a); walk(n.split.b); }
      })(root);
    }
    return root;
  }

  var root = buildInitial();

  function collectLeaves(node, out) {
    if (!node.split) { out.push(node); return; }
    collectLeaves(node.split.a, out);
    collectLeaves(node.split.b, out);
  }
  function collectMergeable(node, out) {
    if (node.split) {
      if (!node.split.a.split && !node.split.b.split && !node.split.anim) out.push(node);
      collectMergeable(node.split.a, out);
      collectMergeable(node.split.b, out);
    }
  }
  function leafAt(node, px, py) {
    if (!node.split) return (px >= node.x && px <= node.x + node.w && py >= node.y && py <= node.y + node.h) ? node : null;
    var sp = node.split;
    var cut = sp.dir === 'v' ? node.x + node.w * sp.pos : node.y + node.h * sp.pos;
    if (sp.dir === 'v') {
      return px < cut ? leafAt(sp.a, px, py) : leafAt(sp.b, px, py);
    }
    return py < cut ? leafAt(sp.a, px, py) : leafAt(sp.b, px, py);
  }

  // ---- Animation ----

  var idleTimer = IDLE_MIN + rnd() * (IDLE_MAX - IDLE_MIN);

  function idleStep() {
    var leaves = [];
    collectLeaves(root, leaves);
    var mergeable = [];
    collectMergeable(root, mergeable);
    var doSplit = leaves.length < 26 ? rnd() < 0.8 : rnd() < 0.45;
    if (doSplit) {
      var cands = leaves.filter(function (l) { return l.depth < MAX_DEPTH && (l.w > MIN_SIZE * 1.4 || l.h > MIN_SIZE * 1.4); });
      if (cands.length) { trySplit(cands[Math.floor(rnd() * cands.length)]); return; }
    }
    if (mergeable.length) {
      tryMerge(mergeable[Math.floor(rnd() * mergeable.length)]);
    } else if (!doSplit) {
      var cands2 = leaves.filter(function (l) { return l.depth < MAX_DEPTH; });
      if (cands2.length) trySplit(cands2[Math.floor(rnd() * cands2.length)]);
    }
  }

  function updateAnims(dt) {
    (function walk(n) {
      if (n.split && n.split.anim) {
        var an = n.split.anim;
        an.t += dt;
        var k = Math.min(an.t / an.dur, 1);
        k = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        n.split.pos = an.from + (an.to - an.from) * k;
        if (an.t >= an.dur) {
          if (an.mode === 'merge') {
            var survivor = an.to === 0 ? n.split.b : n.split.a;
            n.color = survivor.color;
            n.split = null;
          } else {
            n.split.pos = n.split.target;
            n.split.anim = null;
          }
        }
      }
      if (n.split) { walk(n.split.a); walk(n.split.b); }
    })(root);
  }

  // ---- Drawing ----

  function drawNode(n) {
    if (!n.split) {
      var px = n.x * W, py = n.y * H, pw = n.w * W, ph = n.h * H;
      var g = Math.max(1, GAP * Math.min(W, H));
      ctx.fillStyle = n.color;
      ctx.fillRect(px + g / 2, py + g / 2, pw - g, ph - g);
      return;
    }
    var sp = n.split;
    if (sp.dir === 'v') {
      var cutX = (n.x + n.w * sp.pos) * W;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, cutX, H); ctx.clip();
      drawNode(sp.a); ctx.restore();
      ctx.save();
      ctx.beginPath(); ctx.rect(cutX, 0, W - cutX, H); ctx.clip();
      drawNode(sp.b); ctx.restore();
    } else {
      var cutY = (n.y + n.h * sp.pos) * H;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, cutY); ctx.clip();
      drawNode(sp.a); ctx.restore();
      ctx.save();
      ctx.beginPath(); ctx.rect(0, cutY, W, H - cutY); ctx.clip();
      drawNode(sp.b); ctx.restore();
    }
  }

  function draw() {
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    drawNode(root);
  }

  // ---- Interaction ----

  function onTap(cx, cy) {
    var nx = cx / W, ny = cy / H;
    var leaf = leafAt(root, nx, ny);
    if (!leaf) return;
    if (leaf.depth < MAX_DEPTH && (leaf.w > MIN_SIZE || leaf.h > MIN_SIZE)) {
      trySplit(leaf);
    }
    idleTimer = IDLE_MIN + rnd() * (IDLE_MAX - IDLE_MIN);
  }
  canvas.addEventListener('pointerdown', function (e) {
    onTap(e.clientX, e.clientY);
  });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---- Main loop ----

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    idleTimer -= dt;
    if (idleTimer <= 0) {
      idleStep();
      idleTimer = IDLE_MIN + rnd() * (IDLE_MAX - IDLE_MIN);
    }
    updateAnims(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
