<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Note Held As Long As She Wants</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var CHARCOAL = '#2a2a30';
  var GOLD = '#d9a441';
  var SLATE = '#4a5a7a';
  var GREY = '#b8bcc0';
  var CREAM = '#e8e0d0';

  var LOOP = 24;
  var SHIFT = 6; // frame one opens mid-sustain, not on an empty field
  var ENTER_END = 4, SUSTAIN_END = 12, THIN_END = 16, TREMBLE_END = 20;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1504000);
  // Ghost lines: previous cycles' lines, fixed seeded geometry. Their alpha
  // is a pure function of loop-local time (decaying across the loop, renewed
  // at the loop boundary), so the loop closes exactly; accumulating real
  // history across loops would break t = LOOP vs t = 0.
  var GHOSTS = [];
  var gi;
  var ghostCols = [SLATE, GREY, SLATE, GREY];
  var ghostOffs = [-0.26, -0.13, 0.13, 0.26];
  for (gi = 0; gi < 4; gi++) {
    GHOSTS.push({
      off: ghostOffs[gi],
      col: ghostCols[gi],
      len: 0.72 + rng() * 0.20,
      th: 0.35 + rng() * 0.25
    });
  }

  var W = 0, H = 0, nowT = 0;
  var segments = []; // closed drag segments: {t0, t1, rate}
  var active = null; // {t0, rate, x0, dx}

  function viewport() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1280; h = 720; }
    return { w: w, h: h };
  }

  function isPhone() {
    if (typeof window !== 'undefined' && window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) { return true; }
    }
    return H > W * 1.15;
  }

  function resize() {
    var v = viewport();
    W = v.w; H = v.h;
    canvas.width = W; canvas.height = H;
    draw(0);
  }

  function r4(x) {
    return Math.round(x * 10000) / 10000;
  }

  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + r4(a) + ')';
  }

  function smooth(x) {
    if (x <= 0) { return 0; }
    if (x >= 1) { return 1; }
    return x * x * (3 - 2 * x);
  }

  // Effective (drag-slowed) piece time: closed-form integral over recorded
  // drag segments. Outside drags the rate is 1, so effT = t with no drags.
  // Rate floor 0.25: a drag slows the meter, it never freezes it.
  function effT(t) {
    var eff = t;
    var i;
    for (i = 0; i < segments.length; i++) {
      eff -= (1 - segments[i].rate) * (segments[i].t1 - segments[i].t0);
    }
    if (active) {
      eff -= (1 - active.rate) * (t - active.t0);
    }
    return eff;
  }

  function loopLocal(t) {
    var lt = (effT(t) + SHIFT) % LOOP;
    if (lt < 0) { lt += LOOP; }
    return lt;
  }

  // Main-line state at loop-local time lt. Returns extent (0..1),
  // thickness fraction of Tmax, alpha, and tremble envelope (0..1).
  function lineState(lt) {
    if (lt < ENTER_END) {
      return { extent: smooth(lt / ENTER_END), th: 1, alpha: 1, trem: 0 };
    }
    if (lt < SUSTAIN_END) {
      return { extent: 1, th: 1, alpha: 1, trem: 0 };
    }
    if (lt < THIN_END) {
      var k = (lt - SUSTAIN_END) / (THIN_END - SUSTAIN_END);
      return { extent: 1, th: 1 - 0.78 * smooth(k), alpha: 1, trem: 0 };
    }
    if (lt < TREMBLE_END) {
      var u = (lt - THIN_END) / (TREMBLE_END - THIN_END);
      var env = Math.sin(Math.PI * u);
      return { extent: 1, th: 0.22, alpha: 1, trem: env };
    }
    var f = (lt - TREMBLE_END) / (LOOP - TREMBLE_END);
    return { extent: 1, th: 0.22, alpha: 1 - smooth(f), trem: 0 };
  }

  function draw(t) {
    nowT = t;
    if (!W || !H) {
      var v = viewport();
      W = v.w; H = v.h;
      canvas.width = W; canvas.height = H;
    }
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var U = Math.min(W, H);
    var lt = loopLocal(t);
    var st = lineState(lt);
    var mainY = H * 0.5;
    var Tmax = Math.max(6, 0.02 * U);

    ctx.fillStyle = CHARCOAL;
    ctx.fillRect(0, 0, W, H);

    // Ghost lines: decaying across the loop, renewed at the boundary.
    var g;
    for (g = 0; g < GHOSTS.length; g++) {
      var gh = GHOSTS[g];
      var ga = 0.06 + 0.38 * (1 - lt / LOOP);
      ctx.strokeStyle = hexA(gh.col, ga);
      ctx.lineWidth = Math.max(2, Tmax * gh.th);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, mainY + gh.off * H);
      ctx.lineTo(W * gh.len, mainY + gh.off * H);
      ctx.stroke();
    }

    // Main line: gold stroke, trembling during the tremble window.
    if (st.alpha > 0 && st.extent > 0) {
      var x1 = W * st.extent;
      var thick = Math.max(2, Tmax * st.th);
      var tremAmp = U * 0.006 * st.trem;
      ctx.strokeStyle = hexA(GOLD, st.alpha);
      ctx.lineWidth = thick;
      ctx.lineCap = 'round';
      ctx.beginPath();
      var step = Math.max(8, W / 240);
      var x;
      var first = true;
      for (x = 0; x <= x1; x += step) {
        var ty = mainY;
        if (st.trem > 0) {
          ty += tremAmp * Math.sin(2 * Math.PI * (x / (W / 12)) + lt * 2);
        }
        if (first) { ctx.moveTo(x, ty); first = false; }
        else { ctx.lineTo(x, ty); }
      }
      if (x1 > 0 && (x1 - (Math.floor(x1 / step) * step)) > 0) {
        ctx.lineTo(x1, mainY + (st.trem > 0 ? tremAmp * Math.sin(2 * Math.PI * (x1 / (W / 12)) + lt * 2) : 0));
      }
      ctx.stroke();
      // Tremble accent: a thin cream hairline riding the tremble, offset up.
      if (st.trem > 0) {
        ctx.strokeStyle = hexA(CREAM, 0.5 * st.trem);
        ctx.lineWidth = Math.max(1, Tmax * 0.08);
        ctx.beginPath();
        first = true;
        for (x = 0; x <= x1; x += step) {
          var cy = mainY - thick * 0.9 + tremAmp * Math.sin(2 * Math.PI * (x / (W / 12)) + lt * 2);
          if (first) { ctx.moveTo(x, cy); first = false; }
          else { ctx.lineTo(x, cy); }
        }
        ctx.stroke();
      }
    }
  }

  function nearLine(y) {
    return Math.abs(y - H * 0.5) < H * 0.12;
  }

  function onDown(e) {
    var x = (e.clientX !== undefined) ? e.clientX : e.x;
    var y = (e.clientY !== undefined) ? e.clientY : e.y;
    if (nearLine(y)) {
      active = { t0: nowT, rate: 1, x0: x, dx: 0 };
    }
  }
  function onMove(e) {
    if (!active) { return; }
    var x = (e.clientX !== undefined) ? e.clientX : e.x;
    active.dx = x - active.x0;
    // Close the current sub-segment at nowT and start a new one at the
    // rate implied by the cumulative drag distance.
    segments.push({ t0: active.t0, t1: nowT, rate: active.rate });
    var adx = Math.abs(active.dx);
    var rate = 1 - adx / 300;
    if (rate < 0.25) { rate = 0.25; }
    if (rate > 1) { rate = 1; }
    active = { t0: nowT, rate: rate, x0: active.x0, dx: active.dx };
  }
  function onUp() {
    if (!active) { return; }
    segments.push({ t0: active.t0, t1: nowT, rate: active.rate });
    active = null;
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
  }

  // Probe API: drive the piece at forced times without touching the clock.
  if (typeof window !== 'undefined') {
    window.__piece = {
      drawAt: function (t) { draw(t); },
      loopLocal: loopLocal,
      lineState: lineState,
      effT: effT,
      pointerDown: onDown,
      pointerMove: onMove,
      pointerUp: onUp
    };
  }

  // Fixed-phase first frame.
  draw(0);

  var startTime = null;
  function loop(ts) {
    if (startTime === null) { startTime = ts; }
    var t = (ts - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
