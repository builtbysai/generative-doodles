<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Four Particles Lost</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #040506; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1111 "Four Particles Lost" — Daniel Franke, Four Particles Lost (2015).
   A dark tank of high-viscous fluid. Four luminous particles drift on slow
   75 s Lissajous guides through a coarse velocity grid; their long ribbons
   are the piece. Fixed-timestep sim; frame one is the state after a fixed
   30 s synchronous pre-roll, so the first frame is reproducible. */

var TAU = Math.PI * 2;

/* ---------- seeded rng (determinism: no Math.random, no wall clock) ------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(1111008);

/* ---------- palette ------------------------------------------------------ */
var COL = {
  tank: '#040506',
  field: '#0A0D12',
  core: [242, 237, 228],      // #F2EDE4
  ribbonHi: [77, 216, 200],   // #4DD8C8
  ribbonLo: [30, 74, 68],     // #1E4A44
  bloom: [232, 160, 32]       // #E8A020
};
function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function mix(a, b, f) {
  return [Math.round(a[0] + (b[0] - a[0]) * f),
          Math.round(a[1] + (b[1] - a[1]) * f),
          Math.round(a[2] + (b[2] - a[2]) * f)];
}

/* ---------- fluid grid --------------------------------------------------- */
var GN = 44, NCELL = GN * GN;
var gu = new Float32Array(NCELL), gv = new Float32Array(NCELL);
var gu2 = new Float32Array(NCELL), gv2 = new Float32Array(NCELL);
var VISC = 0.42;              // per-pass pull toward neighbour mean (heavy)
var DT = 1 / 60;
var LOOP = 75;                // seconds; guides close on this period

function diffuse() {
  var p, x, y, i, xl, xr, yu, yd;
  for (p = 0; p < 3; p++) {   // multiple passes per step = high viscosity
    for (y = 0; y < GN; y++) {
      for (x = 0; x < GN; x++) {
        i = y * GN + x;
        xl = x > 0 ? i - 1 : i; xr = x < GN - 1 ? i + 1 : i;
        yu = y > 0 ? i - GN : i; yd = y < GN - 1 ? i + GN : i;
        gu2[i] = gu[i] + VISC * ((gu[xl] + gu[xr] + gu[yu] + gu[yd]) * 0.25 - gu[i]);
        gv2[i] = gv[i] + VISC * ((gv[xl] + gv[xr] + gv[yu] + gv[yd]) * 0.25 - gv[i]);
      }
    }
    var tu = gu; gu = gu2; gu2 = tu;
    var tv = gv; gv = gv2; gv2 = tv;
  }
}
function decayGrid(f) {
  for (var i = 0; i < NCELL; i++) { gu[i] *= f; gv[i] *= f; }
}
function sampleGrid(x, y) {
  var gx = x * (GN - 1), gy = y * (GN - 1);
  var x0 = Math.floor(gx), y0 = Math.floor(gy);
  if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0;
  if (x0 > GN - 2) x0 = GN - 2; if (y0 > GN - 2) y0 = GN - 2;
  var fx = gx - x0, fy = gy - y0, i = y0 * GN + x0;
  var u = (gu[i] * (1 - fx) + gu[i + 1] * fx) * (1 - fy) +
          (gu[i + GN] * (1 - fx) + gu[i + GN + 1] * fx) * fy;
  var v = (gv[i] * (1 - fx) + gv[i + 1] * fx) * (1 - fy) +
          (gv[i + GN] * (1 - fx) + gv[i + GN + 1] * fx) * fy;
  return [u, v];
}
function inject(x, y, dx, dy, radius, strength) {
  var gr = radius * (GN - 1);
  var cx = x * (GN - 1), cy = y * (GN - 1);
  var x0 = Math.max(0, Math.floor(cx - gr)), x1 = Math.min(GN - 1, Math.ceil(cx + gr));
  var y0 = Math.max(0, Math.floor(cy - gr)), y1 = Math.min(GN - 1, Math.ceil(cy + gr));
  for (var yy = y0; yy <= y1; yy++) {
    for (var xx = x0; xx <= x1; xx++) {
      var ddx = (xx - cx) / gr, ddy = (yy - cy) / gr;
      var d2 = ddx * ddx + ddy * ddy;
      if (d2 >= 1) continue;
      var w = (1 - d2) * (1 - d2) * strength, i = yy * GN + xx;
      gu[i] += dx * w; gv[i] += dy * w;
      var sp = Math.sqrt(gu[i] * gu[i] + gv[i] * gv[i]);
      if (sp > 1.1) { gu[i] *= 1.1 / sp; gv[i] *= 1.1 / sp; }
    }
  }
}

/* ---------- particles ---------------------------------------------------- */
var particles = [];
for (var pi = 0; pi < 4; pi++) {
  particles.push({
    cx: 0.30 + rand() * 0.40, cy: 0.30 + rand() * 0.40,
    ax: 0.19 + rand() * 0.11, ay: 0.19 + rand() * 0.11,
    fx: 2 + Math.floor(rand() * 2), fy: 1 + Math.floor(rand() * 3),
    px: rand() * TAU, py: rand() * TAU,
    x: 0, y: 0, vx: 0, vy: 0,
    ribbon: [], hl: -1
  });
}
function guidePos(p, t) {
  return [p.cx + p.ax * Math.sin(TAU * p.fx * t / LOOP + p.px),
          p.cy + p.ay * Math.sin(TAU * p.fy * t / LOOP + p.py)];
}
function guideVel(p, t) {
  return [p.ax * TAU * p.fx / LOOP * Math.cos(TAU * p.fx * t / LOOP + p.px),
          p.ay * TAU * p.fy / LOOP * Math.cos(TAU * p.fy * t / LOOP + p.py)];
}
particles.forEach(function (p) { var g = guidePos(p, 0); p.x = g[0]; p.y = g[1]; });

var RIB_MAX = 840;            // points per ribbon (every 2nd step = 28 s of history)
var simTime = 0, stepCount = 0, stillUntil = -1;
var blooms = [];              // {x, y, t} amber disturbance marks

function step() {
  simTime += DT; stepCount++;
  diffuse();
  decayGrid(simTime < stillUntil ? 0.90 : 0.9985);
  for (var i = 0; i < 4; i++) {
    var p = particles[i];
    var g = guidePos(p, simTime), gv2p = guideVel(p, simTime);
    var fv = sampleGrid(p.x, p.y);
    // faint perpetual breathing current, periodic on the loop
    var bx = 0.012 * Math.sin(TAU * 2 * simTime / LOOP + p.y * 5.1);
    var by = 0.012 * Math.cos(TAU * 3 * simTime / LOOP + p.x * 4.3);
    p.vx = gv2p[0] + fv[0] + bx;
    p.vy = gv2p[1] + fv[1] + by;
    p.x += p.vx * DT + (g[0] - p.x) * 0.9 * DT;
    p.y += p.vy * DT + (g[1] - p.y) * 0.9 * DT;
    if (p.x < 0.02) p.x = 0.02; if (p.x > 0.98) p.x = 0.98;
    if (p.y < 0.02) p.y = 0.02; if (p.y > 0.98) p.y = 0.98;
    // the particle stirs the fluid a little as it passes
    inject(p.x, p.y, p.vx * 0.012, p.vy * 0.012, 0.03, 1);
    if (stepCount % 2 === 0) {
      p.ribbon.push(p.x, p.y);
      if (p.ribbon.length > RIB_MAX * 2) p.ribbon.splice(0, p.ribbon.length - RIB_MAX * 2);
    }
  }
}

/* pre-roll: 30 simulated seconds, run synchronously before frame one */
var PREROLL = 30;
for (var ps = 0; ps < PREROLL / DT; ps++) step();

/* ---------- canvas / viewport -------------------------------------------- */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var vw = 300, vh = 300, dpr = 1, phone = false;

function fit() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  vw = vv ? vv.width : (window.innerWidth || 300);
  vh = vv ? vv.height : (window.innerHeight || 300);
  dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
  var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : vw;
  var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : vh;
  phone = (Math.min(sw, sh) < 700) || (vh > vw * 1.15);
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(); });
  }
  window.addEventListener('resize', function () { fit(); draw(); });
}
fit();

function stage() {
  var S = Math.min(vw, vh);
  return { S: S, ox: (vw - S) / 2, oy: (vh - S) / 2 };
}
function toScreen(st, x, y) { return [st.ox + x * st.S, st.oy + y * st.S]; }
function toWorld(st, sx, sy) { return [(sx - st.ox) / st.S, (sy - st.oy) / st.S]; }

/* ---------- draw ---------------------------------------------------------- */
function bloomAt(x, y) {
  var b = 0;
  for (var i = 0; i < blooms.length; i++) {
    var m = blooms[i], age = simTime - m.t;
    if (age < 0 || age > 6) continue;
    var dx = x - m.x, dy = y - m.y, d2 = dx * dx + dy * dy;
    var v = Math.exp(-d2 / 0.0081) * Math.exp(-age / 2.0);
    if (v > b) b = v;
  }
  return b;
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  var st = stage();
  ctx.fillStyle = COL.tank;
  ctx.fillRect(0, 0, vw, vh);
  ctx.fillStyle = COL.field;
  ctx.fillRect(st.ox, st.oy, st.S, st.S);

  /* faint field energy: disturbed cells shimmer a breath above the field */
  var cell = st.S / GN;
  for (var y = 0; y < GN; y++) {
    for (var x = 0; x < GN; x++) {
      var i = y * GN + x;
      var sp = Math.sqrt(gu[i] * gu[i] + gv[i] * gv[i]);
      if (sp > 0.015) {
        ctx.fillStyle = rgba(COL.ribbonHi, Math.min(0.10, sp * 0.35));
        ctx.fillRect(st.ox + x * cell, st.oy + y * cell, cell + 0.5, cell + 0.5);
      }
    }
  }

  /* ribbons */
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var lw = Math.max(1.5, st.S * 0.0030) * (phone ? 1.25 : 1);
  for (var pi2 = 0; pi2 < 4; pi2++) {
    var p = particles[pi2], r = p.ribbon, n = r.length / 2;
    if (n < 2) continue;
    var hlF = (p.hl > simTime) ? 1.8 : 1;
    ctx.lineWidth = lw;
    for (var k = 1; k < n; k++) {
      var frac = k / (n - 1);
      var a = (0.04 + 0.50 * frac) * hlF;
      if (a > 0.92) a = 0.92;
      var col = mix(COL.ribbonLo, COL.ribbonHi, Math.pow(frac, 0.8));
      var mx = (r[(k - 1) * 2] + r[k * 2]) / 2, my = (r[(k - 1) * 2 + 1] + r[k * 2 + 1]) / 2;
      var b = bloomAt(mx, my);
      if (b > 0.02) { col = mix(col, COL.bloom, Math.min(0.6, b * 0.8)); a += 0.22 * b; }
      var s0 = toScreen(st, r[(k - 1) * 2], r[(k - 1) * 2 + 1]);
      var s1 = toScreen(st, r[k * 2], r[k * 2 + 1]);
      ctx.strokeStyle = rgba(col, a);
      ctx.beginPath();
      ctx.moveTo(s0[0], s0[1]);
      ctx.lineTo(s1[0], s1[1]);
      ctx.stroke();
    }
  }

  /* cores: plain, small, bright */
  for (var pi3 = 0; pi3 < 4; pi3++) {
    var q = particles[pi3], s = toScreen(st, q.x, q.y);
    var hl = q.hl > simTime;
    var cr = Math.max(2.2, st.S * 0.0034) * (phone ? 1.2 : 1);
    ctx.fillStyle = rgba(COL.core, hl ? 0.30 : 0.16);
    ctx.beginPath(); ctx.arc(s[0], s[1], cr * 2.7, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(COL.core, 0.96);
    ctx.beginPath(); ctx.arc(s[0], s[1], cr, 0, TAU); ctx.fill();
  }

  /* prune old bloom marks */
  while (blooms.length && simTime - blooms[0].t > 7) blooms.shift();
}

/* ---------- audio (lazy, gesture-gated, optional) ------------------------- */
var AC = null, aMaster = null;
function ensureAudio() {
  if (AC) { if (AC.resume) AC.resume(); return; }
  var Ctor = null;
  if (typeof window !== 'undefined') Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  try {
    AC = new Ctor();
    aMaster = AC.createGain(); aMaster.gain.value = 0;
    var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240;
    aMaster.connect(lp); lp.connect(AC.destination);
    var o1 = AC.createOscillator(); o1.type = 'sine'; o1.frequency.value = 46;
    var g1 = AC.createGain(); g1.gain.value = 0.6;
    o1.connect(g1); g1.connect(aMaster); o1.start();
    var o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = 92.7;
    var g2 = AC.createGain(); g2.gain.value = 0.22;
    o2.connect(g2); g2.connect(aMaster); o2.start();
    var nb = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    var nd = nb.getChannelData(0), last = 0;
    for (var i = 0; i < nd.length; i++) {           // brown-ish looped noise
      var wht = rand() * 2 - 1;
      last = (last + 0.02 * wht) / 1.02; nd[i] = last * 3.2;
    }
    var ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
    var nf = AC.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 180;
    var ng = AC.createGain(); ng.gain.value = 0.5;
    ns.connect(nf); nf.connect(ng); ng.connect(aMaster); ns.start();
  } catch (e) { AC = null; aMaster = null; }
}
function audioLevel() {
  if (!AC || !aMaster) return;
  var sum = 0, cnt = 0;
  for (var i = 0; i < NCELL; i += 7) { sum += Math.abs(gu[i]) + Math.abs(gv[i]); cnt += 2; }
  var e = sum / cnt;
  var target = Math.min(0.085, 0.010 + e * 0.55);
  try { aMaster.gain.setTargetAtTime(target, AC.currentTime, 0.4); } catch (err) {}
}

/* ---------- interaction ---------------------------------------------------- */
var dragging = false, downX = 0, downY = 0, downT = 0, lastWX = 0, lastWY = 0, moved = 0;
var lastTapT = -1000, lastMarkX = -9, lastMarkY = -9;
var pendingTap = null;   // {x, y, stamp} — resolved once the double-tap window passes

function evPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [e.clientX - r.left, e.clientY - r.top];
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    var st = stage(), s = evPos(e), w = toWorld(st, s[0], s[1]);
    dragging = true; moved = 0;
    downX = s[0]; downY = s[1]; downT = e.timeStamp || 0;
    lastWX = w[0]; lastWY = w[1]; lastMarkX = w[0]; lastMarkY = w[1];
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var st = stage(), s = evPos(e), w = toWorld(st, s[0], s[1]);
    moved = Math.max(moved, Math.abs(s[0] - downX), Math.abs(s[1] - downY));
    var dx = w[0] - lastWX, dy = w[1] - lastWY;
    lastWX = w[0]; lastWY = w[1];
    if (dx || dy) inject(w[0], w[1], dx, dy, 0.055, 2.3);
    var mdx = w[0] - lastMarkX, mdy = w[1] - lastMarkY;
    if (mdx * mdx + mdy * mdy > 0.0004) {
      blooms.push({ x: w[0], y: w[1], t: simTime });
      if (blooms.length > 28) blooms.splice(0, blooms.length - 28);
      lastMarkX = w[0]; lastMarkY = w[1];
    }
  });
  function endPointer(e) {
    if (!dragging) return;
    dragging = false;
    var stamp = e.timeStamp || 0;
    var dur = stamp - downT;
    if (dur < 350 && moved < 8) {                    // a tap
      var st = stage(), s = evPos(e), w = toWorld(st, s[0], s[1]);
      if (stamp - lastTapT < 350) {                 // double-tap: still the tank
        pendingTap = null; lastTapT = -1000;
        decayGrid(0.12);
        stillUntil = simTime + 2.5;
      } else {
        lastTapT = stamp;
        pendingTap = { x: w[0], y: w[1], stamp: stamp };
      }
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function () { dragging = false; });
}
function resolvePendingTap(nowStamp) {
  if (!pendingTap || nowStamp - pendingTap.stamp <= 350) return;
  var st = stage(), best = -1, bestD = 1e9;
  for (var i = 0; i < 4; i++) {
    var dx = particles[i].x - pendingTap.x, dy = particles[i].y - pendingTap.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestD) { bestD = d; best = i; }
  }
  var thresh = Math.max(30, st.S * 0.055) / st.S;
  if (best >= 0 && bestD < thresh) particles[best].hl = simTime + 5;
  pendingTap = null;
}

/* ---------- main loop ------------------------------------------------------ */
draw();
var lastTs = -1, acc = 0;
function frame(ts) {
  if (lastTs < 0) lastTs = ts;
  var el = (ts - lastTs) / 1000; lastTs = ts;
  if (el > 0.1) el = 0.1;
  acc += el;
  while (acc >= DT) { step(); acc -= DT; }
  resolvePendingTap(ts);
  draw();
  audioLevel();
  requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
</script>
</body>
</html>
