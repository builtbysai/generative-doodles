<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>One Sculpture Per Viewer</title>
<style>
  html, body { margin: 0; padding: 0; background: #05060A; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="720" height="720"></canvas>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');

  // ---------- deterministic helpers ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function mix32(a, b) {
    var x = (a | 0) ^ Math.imul(b | 0, 0x9E3779B1);
    x = Math.imul(x ^ (x >>> 13), 0x85EBCA6B);
    x = Math.imul(x ^ (x >>> 16), 0xC2B2AE35);
    return (x ^ (x >>> 13)) >>> 0;
  }
  function hash01(a, b) { return mix32(a, b) / 4294967296; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function mixc(c1, c2, f) {
    var r = Math.round(c1[0] + (c2[0] - c1[0]) * f);
    var g = Math.round(c1[1] + (c2[1] - c1[1]) * f);
    var b = Math.round(c1[2] + (c2[2] - c1[2]) * f);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  var COL_CORE = [127, 212, 255];   // #7FD4FF
  var COL_RIDGE = [184, 230, 255];  // #B8E6FF
  var COL_AMBER = [232, 160, 32];   // #E8A020

  // ---------- state ----------
  var PHASE = 20.0; // fixed first-frame phase (seconds)
  var roomSeed = 1106;
  var sculptureSeed = 7;
  var markers = [];
  var drag = { on: false, x: 0, y: 0, downX: 0, downY: 0, downT: 0, moved: false };
  var release = null; // {t, x, y}
  var freeze = null;  // {hash, tSpec, until}
  var lastTapT = -100;

  // ---------- viewport ----------
  var W = 720, H = 720, S = 720, OX = 0, OY = 0, UNIT = 0.72, IS_PHONE = false;
  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : (window.innerWidth || 720);
    H = vv ? vv.height : (window.innerHeight || 720);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    UNIT = S / 1000;
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    IS_PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  // ---------- room markers ----------
  function buildMarkers() {
    markers = [];
    var rnd = mulberry32(roomSeed * 7919 + 13);
    var side, k;
    for (side = 0; side < 2; side++) {
      for (k = 0; k < 7; k++) {
        var bx = side === 0 ? 42 + rnd() * 108 : 850 + rnd() * 105;
        var by = 82 + k * 132 + (rnd() - 0.5) * 56;
        markers.push({
          x: bx, y: by,
          type: Math.floor(rnd() * 6),
          size: 24 + rnd() * 20,
          rot: rnd() < 0.3 ? Math.PI / 2 : 0,
          a: 0.5 + rnd() * 0.5
        });
      }
    }
  }
  function drawGlyph(g) {
    var s = g.size, h = s / 2;
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.rot);
    ctx.globalAlpha = g.a;
    ctx.strokeStyle = '#2E3540';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    if (g.type === 0) { // corner brackets
      var c = h * 0.45;
      ctx.moveTo(-h, -h + c); ctx.lineTo(-h, -h); ctx.lineTo(-h + c, -h);
      ctx.moveTo(h - c, -h); ctx.lineTo(h, -h); ctx.lineTo(h, -h + c);
      ctx.moveTo(h, h - c); ctx.lineTo(h, h); ctx.lineTo(h - c, h);
      ctx.moveTo(-h + c, h); ctx.lineTo(-h, h); ctx.lineTo(-h, h - c);
    } else if (g.type === 1) { // plus in square
      ctx.rect(-h, -h, s, s);
      ctx.moveTo(-h * 0.5, 0); ctx.lineTo(h * 0.5, 0);
      ctx.moveTo(0, -h * 0.5); ctx.lineTo(0, h * 0.5);
    } else if (g.type === 2) { // diamond
      ctx.moveTo(0, -h); ctx.lineTo(h, 0); ctx.lineTo(0, h); ctx.lineTo(-h, 0); ctx.closePath();
      ctx.moveTo(0, -h * 0.4); ctx.lineTo(h * 0.4, 0); ctx.lineTo(0, h * 0.4); ctx.lineTo(-h * 0.4, 0); ctx.closePath();
    } else if (g.type === 3) { // double square
      ctx.rect(-h, -h, s, s);
      ctx.rect(-h * 0.55, -h * 0.55, s * 0.55, s * 0.55);
    } else if (g.type === 4) { // X in circle
      ctx.moveTo(h, 0); ctx.arc(0, 0, h, 0, Math.PI * 2);
      ctx.moveTo(-h * 0.5, -h * 0.5); ctx.lineTo(h * 0.5, h * 0.5);
      ctx.moveTo(h * 0.5, -h * 0.5); ctx.lineTo(-h * 0.5, h * 0.5);
    } else { // triangle + dot
      ctx.moveTo(0, -h); ctx.lineTo(h * 0.87, h * 0.6); ctx.lineTo(-h * 0.87, h * 0.6); ctx.closePath();
    }
    ctx.stroke();
    if (g.type === 5) {
      ctx.beginPath(); ctx.arc(0, h * 0.1, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = '#2E3540'; ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---------- portal ----------
  function portalRadius() { return IS_PHONE ? 192 : 178; }
  function driftPos(t) {
    return {
      x: 580 + 130 * Math.sin(0.07 * t),
      y: 460 + 110 * Math.sin(0.053 * t + 1.3)
    };
  }
  function portalPos(t) {
    if (drag.on) return { x: drag.x, y: drag.y };
    var d = driftPos(t);
    if (release) {
      var w = Math.exp(-(t - release.t) / 0.9);
      if (w < 0.002) { release = null; return d; }
      return { x: d.x + (release.x - d.x) * w, y: d.y + (release.y - d.y) * w };
    }
    return d;
  }
  function sculptureHash(px, py) {
    var qx = Math.round(px / 25), qy = Math.round(py / 25);
    return mix32(mix32(roomSeed, sculptureSeed), mix32(qx, qy));
  }

  // ---------- analytic spectrum ----------
  function swellEnv(t) {
    var P = 23, ph = ((t % P) + P) % P, dd = ph - 4;
    if (dd > P / 2) dd -= P; if (dd < -P / 2) dd += P;
    return Math.exp(-(dd * dd) / 4.5);
  }
  function ridgeValue(i, hash, t) {
    var prof = 0.35 + 0.65 * hash01(hash, i * 3 + 1);
    var ph = hash01(hash, i * 3 + 2) * Math.PI * 2;
    var breathe = 0.78 + 0.22 * Math.sin(t * 0.45 + 0.8);
    var wave = 0.5 + 0.5 * Math.sin(i * 0.75 - t * 1.25 + ph);
    var sw = swellEnv(t);
    var v = prof * breathe * (0.35 + 0.65 * wave) * (1 + 0.55 * sw);
    return { v: v, sw: sw };
  }

  // ---------- sculpture (drawn only inside the portal clip) ----------
  function drawSculpture(cx, cy, R, hash, t) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.clip();
    // inner glow: layered flat-alpha discs
    var discs = [[0.99, 0.045], [0.68, 0.05], [0.42, 0.06]];
    for (var d = 0; d < discs.length; d++) {
      ctx.beginPath();
      ctx.arc(cx, cy, R * discs[d][0], 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(127,212,255,' + discs[d][1] + ')';
      ctx.fill();
    }
    var N = 28;
    var rot = 0.06 * Math.sin(t * 0.11) + hash01(hash, 999) * 0.6;
    var tips = [], vals = [];
    for (var i = 0; i < N; i++) {
      var rv = ridgeValue(i, hash, t);
      var len = R * (0.22 + 0.62 * Math.min(rv.v, 1.25));
      var ang = rot + (i / N) * Math.PI * 2;
      tips.push({ x: cx + Math.cos(ang) * len, y: cy + Math.sin(ang) * len, ang: ang, len: len });
      vals.push(rv);
    }
    // faint web between neighbouring tips
    ctx.beginPath();
    for (var w = 0; w <= N; w++) {
      var tp = tips[w % N];
      if (w === 0) ctx.moveTo(tp.x, tp.y); else ctx.lineTo(tp.x, tp.y);
    }
    ctx.strokeStyle = 'rgba(184,230,255,0.13)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // ridges
    for (var r = 0; r < N; r++) {
      var tip = tips[r], v = vals[r].v, sw = vals[r].sw;
      var bright = 0.25 + 0.75 * Math.min(v, 1);
      var ca = Math.cos(tip.ang), sa = Math.sin(tip.ang);
      var px = -sa, py = ca;
      var bx = cx + ca * 14, by = cy + sa * 14;
      var mx = cx + ca * tip.len * 0.55, my = cy + sa * tip.len * 0.55;
      var hw = 4.5 + 6.5 * Math.min(v, 1);
      // kite facet
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(mx + px * hw, my + py * hw);
      ctx.lineTo(tip.x, tip.y);
      ctx.lineTo(mx - px * hw, my - py * hw);
      ctx.closePath();
      ctx.fillStyle = 'rgba(127,212,255,' + (0.08 + 0.22 * bright) + ')';
      ctx.fill();
      // spoke
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(tip.x, tip.y);
      ctx.strokeStyle = 'rgba(184,230,255,' + (bright * 0.85) + ')';
      ctx.lineWidth = 2.2;
      ctx.stroke();
      // tip node, amber only on loud-peak swells
      var amber = sw * clamp((v - 0.55) * 1.6, 0, 1);
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 2.2 + 2.1 * Math.min(v, 1), 0, Math.PI * 2);
      if (amber > 0.03) {
        ctx.fillStyle = mixc(COL_RIDGE, COL_AMBER, amber);
        ctx.globalAlpha = bright;
        ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = 'rgba(223,246,255,' + bright + ')';
        ctx.fill();
      }
    }
    // core
    var pulse = 0.9 + 0.18 * Math.sin(t * 0.45 + 0.8);
    ctx.beginPath(); ctx.arc(cx, cy, 17 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(127,212,255,0.85)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 9.5 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(223,246,255,0.95)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 4 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.98)'; ctx.fill();
    ctx.restore();
  }

  // ---------- portal frame ----------
  function drawPortal(cx, cy, R) {
    ctx.save();
    // outer ring
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(237,232,218,0.92)'; ctx.lineWidth = 2.4; ctx.stroke();
    // inner hairline
    ctx.beginPath(); ctx.arc(cx, cy, R - 7, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(237,232,218,0.30)'; ctx.lineWidth = 1; ctx.stroke();
    // diagonal handle ticks
    ctx.strokeStyle = 'rgba(237,232,218,0.85)'; ctx.lineWidth = 2.4;
    for (var k = 0; k < 4; k++) {
      var a = Math.PI / 4 + k * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (R + 3), cy + Math.sin(a) * (R + 3));
      ctx.lineTo(cx + Math.cos(a) * (R + 13), cy + Math.sin(a) * (R + 13));
      ctx.stroke();
    }
    // screw dots
    ctx.fillStyle = 'rgba(237,232,218,0.9)';
    for (var s2 = 0; s2 < 4; s2++) {
      var a2 = s2 * Math.PI / 2 + 0.35;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a2) * R, cy + Math.sin(a2) * R, 2.1, 0, Math.PI * 2);
      ctx.fill();
    }
    // bottom grip (handheld)
    ctx.strokeStyle = 'rgba(237,232,218,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx, cy + R + 13); ctx.lineTo(cx, cy + R + 24);
    ctx.moveTo(cx - 15, cy + R + 26); ctx.lineTo(cx + 15, cy + R + 26);
    ctx.stroke();
    ctx.restore();
  }

  // ---------- main draw ----------
  function draw(t) {
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    // room
    ctx.fillStyle = '#05060A';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(UNIT, UNIT);
    for (var m = 0; m < markers.length; m++) drawGlyph(markers[m]);
    var pos = portalPos(t);
    var R = portalRadius();
    var hash = sculptureHash(pos.x, pos.y);
    var tSpec = t;
    if (freeze) {
      if (t < freeze.until) { hash = freeze.hash; tSpec = freeze.tSpec; }
      else freeze = null;
    }
    drawSculpture(pos.x, pos.y, R, hash, tSpec);
    drawPortal(pos.x, pos.y, R);
    ctx.restore();
  }

  // ---------- audio (lazy, gesture-only; geometry never reads it) ----------
  var audioCtx = null;
  function ensureAudio() {
    if (audioCtx) { if (audioCtx.resume) audioCtx.resume(); return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      var master = audioCtx.createGain();
      master.gain.value = 0.045;
      var analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      master.connect(analyser);
      analyser.connect(audioCtx.destination);
      var freqs = [96, 144.5, 192.3];
      for (var i = 0; i < freqs.length; i++) {
        var o = audioCtx.createOscillator();
        o.type = i === 0 ? 'sine' : 'triangle';
        o.frequency.value = freqs[i];
        o.detune.value = (i - 1) * 5;
        var g = audioCtx.createGain();
        g.gain.value = i === 0 ? 0.5 : 0.2;
        o.connect(g); g.connect(master);
        o.start();
      }
      var lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.13;
      var lg = audioCtx.createGain();
      lg.gain.value = 0.018;
      lfo.connect(lg); lg.connect(master.gain);
      lfo.start();
    } catch (e) { audioCtx = null; }
  }

  // ---------- interaction ----------
  function nowMs() {
    if (window.performance && window.performance.now) return window.performance.now();
    return Date.now();
  }
  var startStamp = nowMs();
  function pieceT() { return PHASE + (nowMs() - startStamp) / 1000; }
  function toUnit(e) {
    var rect = cv.getBoundingClientRect ? cv.getBoundingClientRect() : { left: 0, top: 0 };
    return {
      x: (e.clientX - rect.left - OX) / UNIT,
      y: (e.clientY - rect.top - OY) / UNIT
    };
  }
  cv.addEventListener('pointerdown', function (e) {
    ensureAudio();
    var p = toUnit(e);
    var pos = portalPos(pieceT());
    drag.on = true; drag.moved = false;
    drag.downX = p.x; drag.downY = p.y; drag.downT = pieceT();
    drag.x = pos.x; drag.y = pos.y;
    release = null;
    if (cv.setPointerCapture && e.pointerId != null) { try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag.on) return;
    var p = toUnit(e);
    var dx = p.x - drag.downX, dy = p.y - drag.downY;
    if (Math.abs(dx) + Math.abs(dy) > 8) drag.moved = true;
    if (drag.moved) { drag.x = clamp(p.x, 60, 940); drag.y = clamp(p.y, 60, 940); }
  });
  function endPointer(e) {
    if (!drag.on) return;
    var t = pieceT();
    var wasDrag = drag.moved;
    drag.on = false;
    if (wasDrag) {
      release = { t: t, x: drag.x, y: drag.y };
      return;
    }
    if (t - drag.downT > 0.4) return; // long press: not a tap
    // tap
    if (t - lastTapT < 0.4) {
      // double-tap: new room
      roomSeed = (Math.imul(roomSeed, 1103515245) + ((t * 1000) | 0) + 12345) & 0x7fffffff;
      sculptureSeed = (sculptureSeed + 1) & 0xffff;
      buildMarkers();
      freeze = null;
      lastTapT = -100;
    } else {
      var pos = portalPos(t);
      freeze = { hash: sculptureHash(pos.x, pos.y), tSpec: t, until: t + 10 };
      lastTapT = t;
    }
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);

  // ---------- boot ----------
  buildMarkers();
  resize();
  draw(PHASE);
  function frame() {
    draw(pieceT());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
