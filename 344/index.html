<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.344 Spaghetti Monster</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#121417; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.344 Spaghetti Monster (myclayco).
// After their Sep 2026 failed-print post: a clean cutter-wall
// toolpath, one continuous extrusion line tracing a scalloped
// frame in cream, draws itself neatly for 8s; then the print
// head fails and the line blooms from the failure point into
// a dense hot-coral scribble for 6s; then the bed clears in
// 2s and the 16s loop starts over. The tangle is a random
// walk driven by a fixed seed table held as JS data below:
// never runtime random, never a monster face, the tangle IS
// the monster. A small gold dot rides the line as the print
// head. Drag anywhere and noise is injected into the points
// the head has not reached yet; points already drawn are
// never rewritten, and the clear phase wipes every stamp so
// no drag residue carries across loops. No tap action.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#121417', CREAM = '#F2EBD8', CORAL = '#E4572E', GOLD = '#D9A441';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 3.6, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- loop phases: 8s draw + 6s tangle + 2s clear = 16s ------
var P_DRAW = 8, P_TANGLE = 6, P_CLEAR = 2;
var LOOP = P_DRAW + P_TANGLE + P_CLEAR;
if (LOOP !== 16) throw new Error('Spaghetti Monster loop must be 16s');

// ---- fixed seed table for the tangle walk (data, not RNG) ----
var SEED_T = [
  0.108, 0.608, 0.761, 0.99, 0.361, 0.208, 0.756, 0.422, 0.429, 0.686, 0.314, 0.359,
  0.234, 0.989, 0.321, 0.743, 0.537, 0.032, 0.142, 0.382, 0.668, 0.757, 0.033, 0.599,
  0.631, 0.783, 0.289, 0.788, 0.603, 0.876, 0.474, 0.259, 0.078, 0.577, 0.298, 0.51,
  0.229, 0.675, 0.328, 0.752, 0.176, 0.945, 0.182, 0.603, 0.481, 0.925, 0.079, 0.316,
  0.478, 0.075, 0.134, 0.399, 0.317, 0.402, 0.218, 0.255, 0.112, 0.458, 0.518, 0.544,
  0.82, 0.212, 0.949, 0.577, 0.684, 0.267, 0.339, 0.727, 0.314, 0.733, 0.762, 0.019,
  0.744, 0.677, 0.483, 0.353, 0.954, 0.981, 0.191, 0.202, 0.705, 0.698, 0.113, 0.911,
  0.723, 0.973, 0.317, 0.113, 0.3, 0.659, 0.825, 0.577, 0.612, 0.678, 0.862, 0.882,
  0.239, 0.178, 0.96, 0.143, 0.757, 0.51, 0.371, 0.325, 0.31, 0.227, 0.544, 0.928,
  0.683, 0.507, 0.484, 0.114, 0.09, 0.892, 0.678, 0.223, 0.101, 0.455, 0.213, 0.55,
  0.81, 0.31, 0.49, 0.032, 0.647, 0.826, 0.368, 0.987, 0.083, 0.351, 0.195, 0.108,
  0.223, 0.889, 0.254, 0.094, 0.243, 0.624, 0.265, 0.37, 0.517, 0.063, 0.043, 0.46,
  0.041, 0.257, 0.743, 0.354, 0.593, 0.999, 0.068, 0.744, 0.912, 0.698, 0.695, 0.789,
  0.277, 0.313, 0.291, 0.825, 0.072, 0.504, 0.161, 0.282, 0.906, 0.311, 0.54, 0.044,
  0.941, 0.934, 0.495, 0.675, 0.723, 0.971, 0.511, 0.858, 0.903, 0.233, 0.616, 0.114,
  0.344, 0.396, 0.68, 0.747, 0.185, 0.098, 0.863, 0.146, 0.601, 0.419, 0.928, 0.701,
  0.57, 0.021, 0.64, 0.68, 0.774, 0.285, 0.138, 0.491, 0.483, 0.227, 0.841, 0.693,
  0.903, 0.063, 0.107, 0.396, 0.533, 0.199, 0.386, 0.367, 0.201, 0.653, 0.429, 0.338,
  0.355, 0.299, 0.093, 0.777, 0.159, 0.793, 0.661, 0.218, 0.56, 0.053, 0.485, 0.015,
  0.073, 0.843, 0.152, 0.117, 0.157, 0.807, 0.818, 0.162, 0.076, 0.368, 0.157, 0.118,
  0.793, 0.218, 0.531, 0.721, 0.465, 0.345, 0.554, 0.65, 0.603, 0.733, 0.345, 0.992,
  0.065, 0.242, 0.353, 0.452, 0.863, 0.581, 0.169, 0.146, 0.227, 0.96, 0.719, 0.925,
  0.856, 0.188, 0.294, 0.051, 0.634, 0.316, 0.686, 0.428, 0.348, 0.24, 0.263, 0.151,
  0.411, 0.631, 0.374, 0.342, 0.817, 0.169, 0.961, 0.077, 0.666, 0.281, 0.369, 0.449,
  0.941, 0.765, 0.708, 0.349, 0.348, 0.457, 0.213, 0.986, 0.994, 0.639, 0.83, 0.24,
  0.564, 0.617, 0.794, 0.109, 0.015, 0.14, 0.842, 0.275, 0.074, 0.37, 0.836, 0.54,
  0.728, 0.403, 0.913, 0.607, 0.289, 0.193, 0.747, 0.465, 0.502, 0.989, 0.631, 0.537,
  0.865, 0.72, 0.443, 0.331, 0.194, 0.029, 0.354, 0.621, 0.641, 0.015, 0.586, 0.845,
  0.289, 0.874, 0.739, 0.26, 0.073, 0.588, 0.497, 0.638, 0.228, 0.817, 0.834, 0.309,
  0.268, 0.753, 0.811, 0.639, 0.299, 0.888, 0.807, 0.392, 0.429, 0.175, 0.31, 0.68,
  0.357, 0.922, 0.388, 0.427, 0.491, 0.459, 0.182, 0.292, 0.123, 0.351, 0.425, 0.324,
  0.553, 0.506, 0.045, 0.502, 0.902, 0.923, 0.3, 0.873, 0.596, 0.556, 0.53, 0.445,
  0.621, 0.168, 0.419, 0.649, 0.187, 0.843, 0.652, 0.46, 0.329, 0.894, 0.928, 0.921,
  0.228, 0.133, 0.468, 0.097, 0.383, 0.107, 0.276, 0.152, 0.373, 0.275, 0.305, 0.583,
  0.181, 0.371, 0.502, 0.657, 0.645, 0.362, 0.235, 0.951, 0.342, 0.966, 0.858, 0.319,
  0.645, 0.8, 0.082, 0.991, 0.681, 0.928, 0.873, 0.645, 0.804, 0.789, 0.381, 0.608,
  0.092, 0.972, 0.62, 0.999, 0.617, 0.628, 0.829, 0.289, 0.373, 0.812, 0.416, 0.98,
  0.833, 0.283, 0.355, 0.244, 0.332, 0.873, 0.125, 0.241, 0.004, 0.397, 0.7, 0.126,
  0.478, 0.691, 0.279, 0.537, 0.477, 0.022, 0.797, 0.122, 0.983, 0.112, 0.846, 0.263,
  0.637, 0.037, 0.676, 0.273, 0.188, 0.257, 0.736, 0.785, 0.894, 0.019, 0.716, 0.346
];
(function () {
  if (SEED_T.length !== 480) throw new Error('tangle seed table must hold 480 entries');
  for (var i = 0; i < SEED_T.length; i++) {
    if (SEED_T[i] < 0 || SEED_T[i] > 1) throw new Error('seed entry out of range');
  }
})();

// ---- clean toolpath: scalloped rounded-rect frame ------------
// Base rounded rectangle sampled clockwise from top centre,
// then each point pushed along its outward normal by a sine
// scallop whose count is a whole number around the perimeter,
// so the wave closes seamlessly at the start point.
var CX = 640, CY = 450, HW = 520, HH = 325, CR = 130;
var base = [];
function seg(x0, y0, x1, y1) {
  var dx = x1 - x0, dy = y1 - y0;
  var n = Math.max(2, Math.ceil(Math.sqrt(dx * dx + dy * dy) / 4));
  for (var i = (base.length ? 1 : 0); i <= n; i++) base.push([x0 + dx * i / n, y0 + dy * i / n]);
}
function arc(cx, cy, r, a0, a1) {
  var n = Math.max(4, Math.ceil(Math.abs(a1 - a0) / 0.05));
  for (var i = 1; i <= n; i++) {
    var a = a0 + (a1 - a0) * i / n;
    base.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
}
seg(CX, CY - HH, CX + HW - CR, CY - HH);
arc(CX + HW - CR, CY - HH + CR, CR, -Math.PI / 2, 0);
seg(CX + HW, CY - HH + CR, CX + HW, CY + HH - CR);
arc(CX + HW - CR, CY + HH - CR, CR, 0, Math.PI / 2);
seg(CX + HW - CR, CY + HH, CX - HW + CR, CY + HH);
arc(CX - HW + CR, CY + HH - CR, CR, Math.PI / 2, Math.PI);
seg(CX - HW, CY + HH - CR, CX - HW, CY - HH + CR);
arc(CX - HW + CR, CY - HH + CR, CR, Math.PI, Math.PI * 1.5);
seg(CX - HW + CR, CY - HH, CX, CY - HH);

var NP = base.length;
if (NP < 600) throw new Error('toolpath needs a dense polyline');
// cumulative arc length along the base path
var BS = [0];
for (var bi = 1; bi < NP; bi++) {
  BS.push(BS[bi - 1] + Math.hypot(base[bi][0] - base[bi - 1][0], base[bi][1] - base[bi - 1][1]));
}
var PERIM = BS[NP - 1];
var SCALLOPS = Math.round(PERIM / 64);
if (SCALLOPS < 40) throw new Error('scallop count too low');
var PATH = [], PL = [0];
for (var pi = 0; pi < NP; pi++) {
  var ip = base[(pi + 1) % NP], im = base[(pi + NP - 1) % NP];
  var tx = ip[0] - im[0], ty = ip[1] - im[1];
  var tl = Math.hypot(tx, ty) || 1;
  var nx = ty / tl, ny = -tx / tl;
  if (nx * (base[pi][0] - CX) + ny * (base[pi][1] - CY) < 0) { nx = -nx; ny = -ny; }
  var off = 8.5 * Math.sin(2 * Math.PI * SCALLOPS * BS[pi] / PERIM);
  PATH.push([base[pi][0] + nx * off, base[pi][1] + ny * off]);
  if (pi > 0) PL.push(PL[pi - 1] + Math.hypot(PATH[pi][0] - PATH[pi - 1][0], PATH[pi][1] - PATH[pi - 1][1]));
}
var PATH_LEN = PL[NP - 1];

// ---- tangle walk: precomputed once from the seed table -------
// Starts at the failure point (the path start, top centre),
// turns by the table values, step length and bloom radius
// both grow across the 6s phase; the bloom is anchored a
// little inside the frame and whenever the walk strays past
// its current radius it is steered back toward the anchor,
// so the scribble piles onto the bed as one dense local bloom.
var FX = PATH[0][0], FY = PATH[0][1];
var AX = FX, AY = FY + 95; // bloom anchor: pulled inside the frame
var TN = SEED_T.length + 1;
var TW = [[FX, FY]];
(function () {
  var ang = 1.45, x = FX, y = FY;
  for (var i = 1; i < TN; i++) {
    var u = i / (TN - 1);
    ang += (SEED_T[i - 1] - 0.5) * 2.7;
    var len = 5 + 26 * Math.pow(u, 1.5);
    var dx = x - AX, dy = y - AY;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var maxR = 30 + 205 * u;
    if (dist > maxR) {
      var toC = Math.atan2(-dy, -dx);
      var diff = toC - ang;
      while (diff > Math.PI) diff -= 2 * Math.PI;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      ang += diff * 0.6;
      len *= 0.7;
    }
    x += Math.cos(ang) * len;
    y += Math.sin(ang) * len;
    TW.push([x, y]);
  }
})();

// ---- drag noise: stamps that only ever touch upcoming points -
// A stamp records where the finger was and which path index
// the head had reached when it landed. A point is displaced
// only by stamps born before the head reached it, so a point
// already drawn can never move again; stamps are wiped when
// the loop wraps, in the clear phase's clean bed.
var stamps = [];
var headC = 0, headT = 0, phase = 'c';
function disp(x, y, i, ph) {
  for (var k = 0; k < stamps.length; k++) {
    var st = stamps[k];
    if (st.phase !== ph || st.head >= i) continue;
    var dx = x - st.x, dy = y - st.y;
    var f = st.amp * Math.exp(-(dx * dx + dy * dy) / 28800);
    if (f < 0.02) continue;
    var a = i * 2.399963 + (ph === 't' ? 1.93 : 0);
    x += f * Math.cos(a);
    y += f * Math.sin(a);
  }
  return [x, y];
}
function dispPt(arr, i, ph) { return disp(arr[i][0], arr[i][1], i, ph); }

// ---- drawing ---------------------------------------------------
function drawClean(frac) {
  var target = frac * PATH_LEN;
  ctx.strokeStyle = CREAM;
  ctx.lineWidth = 7;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  var p0 = dispPt(PATH, 0, 'c');
  ctx.moveTo(p0[0], p0[1]);
  var i = 0;
  while (i < NP - 1 && PL[i + 1] < target) {
    i++;
    var p = dispPt(PATH, i, 'c');
    ctx.lineTo(p[0], p[1]);
  }
  var hx, hy;
  if (i >= NP - 1) { hx = p0[0]; hy = p0[1]; headC = NP - 1; }
  else {
    var span = PL[i + 1] - PL[i] || 1;
    var f = (target - PL[i]) / span;
    hx = PATH[i][0] + (PATH[i + 1][0] - PATH[i][0]) * f;
    hy = PATH[i][1] + (PATH[i + 1][1] - PATH[i][1]) * f;
    var hp = disp(hx, hy, i + 1, 'c');
    hx = hp[0]; hy = hp[1];
    ctx.lineTo(hx, hy);
    headC = i + 1;
  }
  ctx.stroke();
  return [hx, hy];
}
function drawTangle(frac) {
  var count = 1 + Math.round(frac * (TN - 1));
  if (count > TN) count = TN;
  ctx.strokeStyle = CORAL;
  ctx.lineWidth = 5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  var p0 = dispPt(TW, 0, 't');
  ctx.moveTo(p0[0], p0[1]);
  for (var i = 1; i < count; i++) {
    var p = dispPt(TW, i, 't');
    ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
  headT = count - 1;
  return dispPt(TW, count - 1, 't');
}
function drawHead(pos, alpha) {
  ctx.save();
  ctx.globalAlpha = 0.5 * alpha;
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(pos[0], pos[1], 14, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = GOLD;
  ctx.beginPath();
  ctx.arc(pos[0], pos[1], 8.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

var prevP = -1;
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var p = T % LOOP;
  if (prevP >= 0 && p < prevP) stamps.length = 0; // clean bed
  prevP = p;
  var alpha = 1;
  if (p >= P_DRAW + P_TANGLE) alpha = Math.pow(1 - (p - P_DRAW - P_TANGLE) / P_CLEAR, 1.4);
  if (alpha < 0) alpha = 0;
  ctx.save();
  ctx.globalAlpha = alpha;
  var head;
  if (p < P_DRAW) {
    phase = 'c';
    head = drawClean(p / P_DRAW);
  } else {
    drawClean(1);
    phase = p < P_DRAW + P_TANGLE ? 't' : 'x';
    var tf = p < P_DRAW + P_TANGLE ? (p - P_DRAW) / P_TANGLE : 1;
    head = drawTangle(tf);
  }
  ctx.restore();
  if (alpha > 0.01) drawHead(head, alpha);
}

// ---- sizing: full-bleed field, cover-fit ----------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag: stamps land in design coords via the stored transform
var dragging = false, lastStamp = null;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function addStamp(x, y) {
  if (phase !== 'c' && phase !== 't') return;
  stamps.push({ x: x, y: y, head: phase === 'c' ? headC : headT, phase: phase, amp: 13 });
  if (stamps.length > 48) stamps.shift();
  lastStamp = [x, y];
}
canvas.addEventListener('pointerdown', function (e) {
  dragging = true;
  lastStamp = null;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  if (!lastStamp || Math.hypot(p[0] - lastStamp[0], p[1] - lastStamp[1]) > 16) addStamp(p[0], p[1]);
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
