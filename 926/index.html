<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Forwards Is Growth</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (strict: two neons, one core, one spark, one gray) ----------
  var GROUND = '#000000';
  var GROWTH = '#FF2E88';   // hot pink: growth quarter, ring spins forwards
  var RECESS = '#00E5FF';   // ice cyan: recession quarter, ring spins backwards
  var CORE = '#FFFFFF';
  var SPARK = '#FFD75E';
  var GRAY = '#8A8A8A';

  // ---------- data: 232 US quarters, 1968 Q1 .. 2025 Q4 ----------
  var N = 232;
  var QSEC = 1.1;                       // seconds per quarter of playhead travel
  function qidx(year, q) { return (year - 1968) * 4 + (q - 1); }
  var REC = [];
  for (var i0 = 0; i0 < N; i0++) REC.push(false);
  // documented recession clusters (start year, start q, end year, end q)
  var RANGES = [
    [1973, 4, 1975, 1],   // oil shock recession: 6 quarters
    [1980, 1, 1980, 2],   // 1980 recession: 2
    [1981, 3, 1982, 4],   // Volcker recession: 6
    [1990, 3, 1991, 1],   // Gulf War recession: 3
    [2001, 1, 2001, 3],   // dot-com recession: 3
    [2008, 1, 2009, 3],   // Great Recession: 7, the longest run
    [2020, 1, 2020, 2]    // COVID recession: 2
  ];
  for (var r0 = 0; r0 < RANGES.length; r0++) {
    var ra = RANGES[r0];
    for (var ri = qidx(ra[0], ra[1]); ri <= qidx(ra[2], ra[3]); ri++) REC[ri] = true;
  }
  // a few single-quarter dips, drawn from fixed candidates by the seeded stream
  var CANDS = [qidx(1970, 1), qidx(1986, 3), qidx(1998, 3), qidx(2016, 1)];
  var pickRng = mulberry32(92687);
  var picked = [];
  while (picked.length < 3) {
    var cand = CANDS[Math.floor(pickRng() * CANDS.length)];
    if (picked.indexOf(cand) < 0) picked.push(cand);
  }
  for (var p0 = 0; p0 < picked.length; p0++) REC[picked[p0]] = true;

  function dirOf(i) { return REC[i] ? -1 : 1; }   // +1 forwards (clockwise), -1 backwards
  var nRec = 0;
  for (var c0 = 0; c0 < N; c0++) if (REC[c0]) nRec++;
  var nGrow = N - nRec;
  // spin rate chosen so one full series loop nets exactly 5 whole turns:
  // the loop wraps with no visible jump in the ring angle.
  var RATE = (Math.PI * 2 * 5) / (QSEC * (nGrow - nRec));   // rad per second, signed by direction
  // angle prefix sums: A[k] = ring angle when the playhead enters quarter k
  var A = [0];
  for (var k0 = 0; k0 < N; k0++) A.push(A[k0] + dirOf(k0) * RATE * QSEC);
  var NET = A[N];
  function angleOf(tau) {
    var loops = Math.floor(tau / N);
    var u = tau - loops * N;
    var k = Math.floor(u);
    if (k > N - 1) k = N - 1;
    var f = u - k;
    return loops * NET + A[k] + dirOf(k) * RATE * QSEC * f;
  }
  function idxOfTau(tau) {
    var m = Math.floor(tau) % N;
    return m < 0 ? m + N : m;
  }
  function qName(i) {
    return 'Q' + (i % 4 + 1) + ' ' + (1968 + Math.floor(i / 4));
  }

  // direction flips: boundaries where the spin reverses (sparks live here)
  var FLIPS = [];
  for (var b0 = 1; b0 < N; b0++) if (dirOf(b0) !== dirOf(b0 - 1)) FLIPS.push(b0);
  var SPARK_SPAN = 0.5;   // spark lifetime, in quarter units of playhead travel
  var sparkRng = mulberry32(926232);
  var SPARKS = {};        // boundary -> [{along, out, sz}]
  for (var f0 = 0; f0 < FLIPS.length; f0++) {
    var arr = [];
    for (var j0 = 0; j0 < 12; j0++) {
      arr.push({ along: sparkRng() - 0.5, out: sparkRng(), sz: 1.1 + sparkRng() * 1.7 });
    }
    SPARKS[FLIPS[f0]] = arr;
  }

  // ---------- playhead start: Q4 2001, just after the flip out of the 2001 recession ----------
  var TAU0 = 135.3;
  var ISO_LEN = 5;        // tap isolate: seconds
  var HOLD_LEN = 8;       // double-tap hold on the long recession: seconds
  var RUN_START = qidx(2008, 1), RUN_LEN = 7;

  // ---------- recorded events; everything drawn is a function of (t, events) ----------
  var events = [];        // {kind:'tap', t, q} | {kind:'dtap', t} | {kind:'drag', t0, t1, moves:[{t, cum}]}
  function eventTime(e) { return e.kind === 'drag' ? e.t0 : e.t; }
  function addEvent(e) {
    events.push(e);
    events.sort(function (x, y) { return eventTime(x) - eventTime(y); });
  }

  // fold the event list into the piece state at time t
  function stateAt(t) {
    var curT = 0, curTau = TAU0, curOff = 0;
    function tauAt(to) { return curTau + (to - curT) / QSEC; }
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.kind === 'tap') {
        if (t < e.t) break;
        var tTau = tauAt(e.t), tAng = angleOf(tTau) + curOff;
        if (t < e.t + ISO_LEN) {
          return { tau: e.q, angle: tAng + dirOf(e.q) * RATE * (t - e.t), mode: 'iso', isoQ: e.q, playIdx: e.q };
        }
        curOff = tAng + dirOf(e.q) * RATE * ISO_LEN - angleOf(e.q);
        curTau = e.q; curT = e.t + ISO_LEN;
      } else if (e.kind === 'dtap') {
        if (t < e.t) break;
        var dTau = tauAt(e.t), dAng = angleOf(dTau) + curOff;
        if (t < e.t + HOLD_LEN) {
          var lt = (t - e.t) / QSEC;
          var hIdx = RUN_START + (Math.floor(lt) % RUN_LEN);
          return { tau: RUN_START + (lt % RUN_LEN), angle: dAng - RATE * (t - e.t), mode: 'hold', playIdx: hIdx };
        }
        var ltEnd = HOLD_LEN / QSEC;
        var endTau = RUN_START + (ltEnd % RUN_LEN);
        curOff = dAng - RATE * HOLD_LEN - angleOf(endTau);
        curTau = endTau; curT = e.t + HOLD_LEN;
      } else if (e.kind === 'drag') {
        if (t < e.t0) break;
        var gTau = tauAt(e.t0), gAng = angleOf(gTau) + curOff;
        if (t <= e.t1) {
          var cum = 0;
          for (var s = 0; s < e.moves.length; s++) if (e.moves[s].t <= t) cum = e.moves[s].cum;
          return { tau: gTau, angle: gAng + cum, mode: 'drag', playIdx: idxOfTau(gTau) };
        }
        var cumF = e.moves.length ? e.moves[e.moves.length - 1].cum : 0;
        curOff = gAng + cumF - angleOf(gTau);
        curTau = gTau; curT = e.t1;
      }
    }
    var fTau = tauAt(t);
    return { tau: fTau, angle: angleOf(fTau) + curOff, mode: 'play', playIdx: idxOfTau(fTau) };
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  function viewSize() {
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      return { w: window.visualViewport.width, h: window.visualViewport.height };
    }
    return { w: window.innerWidth, h: window.innerHeight };
  }
  function isPhone(w, h) {
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : w;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : h;
    var minDim = Math.min(sw, sh);
    if (minDim > 0 && minDim < 700) return true;
    return h > w * 1.15;
  }

  var DECADES = [1968, 1980, 1990, 2000, 2010, 2020];

  // ---------- draw ----------
  function draw(t, live) {
    var vs = viewSize();
    var w = Math.max(50, Math.floor(vs.w)), h = Math.max(50, Math.floor(vs.h));
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    var st = stateAt(t);
    if (live) { st.tau = live.tau; st.angle = live.angle; st.playIdx = idxOfTau(live.tau); st.mode = 'drag'; }
    var ringAngle = st.angle;
    var playIdx = st.playIdx;

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, w, h);

    var cx = w / 2, cy = h / 2;
    var R = Math.min(w, h) * 0.36;
    var segLW = Math.max(6, Math.min(30, R * 0.085));
    var segW = Math.PI * 2 / N;
    var gap = segW * 0.18;
    var base = ringAngle - Math.PI / 2;

    // core: thin white circle beneath the segments
    ctx.strokeStyle = CORE;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(cx, cy, R - segLW * 0.72, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // segments
    for (var i = 0; i < N; i++) {
      var isPlay = i === playIdx;
      ctx.strokeStyle = REC[i] ? RECESS : GROWTH;
      ctx.globalAlpha = isPlay ? 1 : 0.82;
      ctx.lineWidth = isPlay ? segLW * 1.5 : segLW;
      ctx.beginPath();
      ctx.arc(cx, cy, R, base + i * segW + gap / 2, base + (i + 1) * segW - gap / 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // playhead tick: a short white radial needle on the current quarter
    var pa = base + (playIdx + 0.5) * segW;
    ctx.strokeStyle = CORE;
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(pa) * (R - segLW * 0.95), cy + Math.sin(pa) * (R - segLW * 0.95));
    ctx.lineTo(cx + Math.cos(pa) * (R + segLW * 0.95), cy + Math.sin(pa) * (R + segLW * 0.95));
    ctx.stroke();
    ctx.globalAlpha = 1;

    // decade labels on the rim, riding their segments
    ctx.fillStyle = GRAY;
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var labR = R + segLW * 0.5 + 13;
    for (var d = 0; d < DECADES.length; d++) {
      var di = qidx(DECADES[d], 1);
      var da = base + (di + 0.5) * segW;
      ctx.fillText('' + DECADES[d], cx + Math.cos(da) * labR, cy + Math.sin(da) * labR);
    }

    // sparks at direction flips the playhead has just crossed
    ctx.fillStyle = SPARK;
    for (var fi = 0; fi < FLIPS.length; fi++) {
      var b = FLIPS[fi];
      var m0 = Math.floor((st.tau - b) / N);
      for (var m = m0 - 1; m <= m0 + 1; m++) {
        var age = st.tau - (b + m * N);
        if (age < 0 || age >= SPARK_SPAN) continue;
        var pr = age / SPARK_SPAN;
        var sa = base + (b + 0.5) * segW;
        var fld = SPARKS[b];
        ctx.globalAlpha = (1 - pr) * 0.85;
        for (var j = 0; j < fld.length; j++) {
          var sp = fld[j];
          var ang = sa + sp.along * pr * 0.10;
          var rad = R + segLW * 0.6 + sp.out * pr * 34;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad, sp.sz * (1 - pr * 0.4), 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;

    // legend strip
    ctx.fillStyle = GRAY;
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('forwards = growth · backwards = recession', w / 2, 20);

    // isolate caption
    if (st.mode === 'iso') {
      ctx.font = '13px sans-serif';
      ctx.fillText(qName(st.isoQ) + ': ' + (dirOf(st.isoQ) < 0 ? 'backwards' : 'forwards'), w / 2, h - 22);
    }
  }

  // ---------- audio: synthesized breakbeat, lazy and gesture-gated ----------
  var AC = null, master = null, noiseBuf = null;
  var aPhase = 0, aLastStep = -1, scratchSteps = 0;
  var STEP_DUR = 60 / 142 / 4;    // 142 BPM sixteenths
  var KICK = { 0: 1, 10: 1, 16: 1, 26: 1 };
  var SNARE = { 4: 1, 12: 1, 20: 1, 28: 1 };
  function initAudio() {
    if (AC) return;
    try {
      var Ctx = null;
      if (typeof AudioContext !== 'undefined') Ctx = AudioContext;
      else if (typeof webkitAudioContext !== 'undefined') Ctx = webkitAudioContext;
      if (!Ctx) return;
      AC = new Ctx();
      master = AC.createGain();
      master.gain.value = 0.4;
      master.connect(AC.destination);
      var len = AC.sampleRate, buf = AC.createBuffer(1, len, AC.sampleRate);
      var dd = buf.getChannelData(0);
      var nr = mulberry32(9260);
      for (var i = 0; i < len; i++) dd[i] = nr() * 2 - 1;
      noiseBuf = buf;
    } catch (e) { AC = null; }
  }
  function kick() {
    try {
      var t0 = AC.currentTime;
      var o = AC.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(100, t0);
      o.frequency.exponentialRampToValueAtTime(43, t0 + 0.12);
      var g = AC.createGain();
      g.gain.setValueAtTime(0.85, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + 0.25);
    } catch (e) { /* silent */ }
  }
  function snare() {
    try {
      var t0 = AC.currentTime;
      var src = AC.createBufferSource(); src.buffer = noiseBuf;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.9;
      var g = AC.createGain();
      g.gain.setValueAtTime(0.5, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.13);
      src.connect(bp); bp.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + 0.15);
      var o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = 190;
      var g2 = AC.createGain();
      g2.gain.setValueAtTime(0.2, t0);
      g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
      o.connect(g2); g2.connect(master);
      o.start(t0); o.stop(t0 + 0.1);
    } catch (e) { /* silent */ }
  }
  function hat(accent) {
    try {
      var t0 = AC.currentTime;
      var src = AC.createBufferSource(); src.buffer = noiseBuf;
      src.playbackRate.value = 1.7;
      var hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
      var g = AC.createGain();
      g.gain.setValueAtTime(accent ? 0.22 : 0.13, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + (accent ? 0.07 : 0.04));
      src.connect(hp); hp.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + 0.09);
    } catch (e) { /* silent */ }
  }
  function fireStep(s) {
    if (KICK[s]) kick();
    if (SNARE[s]) snare();
    if (s % 2 === 0) hat(s % 8 === 0);
  }
  function tickAudio(t, prevT, st, dragging) {
    if (!AC) return;
    var dt = Math.max(0, t - prevT);
    if (dragging) {
      aPhase += scratchSteps;      // the finger drives the record
      scratchSteps = 0;
    } else {
      var dir = st.mode === 'iso' ? dirOf(st.isoQ) : (st.mode === 'hold' ? -1 : dirOf(st.playIdx));
      aPhase += dir * dt / STEP_DUR;   // recession steps run the pattern backwards
    }
    var step = Math.floor(aPhase);
    if (step !== aLastStep) {
      aLastStep = step;
      fireStep(((step % 32) + 32) % 32);
    }
  }

  // ---------- clock ----------
  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  }
  var startMs = nowMs();
  var prevT = 0;
  function pieceT() { return (nowMs() - startMs) / 1000; }
  function frame() {
    var t = pieceT();
    var live = liveDrag ? { tau: liveDrag.tau, angle: liveDrag.angleStart + liveDrag.cum } : null;
    var st = stateAt(t);
    if (live) { st.mode = 'drag'; st.playIdx = idxOfTau(live.tau); }
    tickAudio(t, prevT, st, !!liveDrag);
    prevT = t;
    draw(t, live);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  draw(0); // deterministic frame one
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

  function redraw() { draw(pieceT(), null); }
  if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', redraw);
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', redraw);
  }

  // ---------- pointer interaction ----------
  var pDown = false, pMoved = false, pStartX = 0, pStartY = 0;
  var pLastA = 0, downState = null, downT = 0;
  var liveDrag = null, dragMoves = [];
  var lastTapT = -10, pendingTap = null;
  function pointerAngle(x, y) {
    var vs = viewSize();
    return Math.atan2(y - vs.h / 2, x - vs.w / 2);
  }
  function normAng(d) {
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function segmentAt(x, y, t) {
    var st = stateAt(t);
    var segW = Math.PI * 2 / N;
    var rel = normAng(Math.atan2(y - viewSize().h / 2, x - viewSize().w / 2) - (st.angle - Math.PI / 2));
    var u = (rel + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(u / segW) % N;
  }
  function onDown(x, y) {
    initAudio();
    if (AC && typeof AC.resume === 'function') { try { AC.resume(); } catch (e) { /* noop */ } }
    pDown = true; pMoved = false;
    pStartX = x; pStartY = y;
    downT = pieceT();
    downState = stateAt(downT);
    pLastA = pointerAngle(x, y);
    liveDrag = null; dragMoves = [];
  }
  function onMove(x, y) {
    if (!pDown) return;
    var dx = x - pStartX, dy = y - pStartY;
    if (dx * dx + dy * dy > 36) pMoved = true;
    if (pMoved) {
      if (!liveDrag) {
        liveDrag = { tau: downState.tau, angleStart: downState.angle, cum: 0 };
        dragMoves = [{ t: downT, cum: 0 }];
      }
      var a = pointerAngle(x, y);
      var d = normAng(a - pLastA);
      liveDrag.cum += d;
      scratchSteps += d * 6;         // scratch: finger angle bends the pattern
      dragMoves.push({ t: pieceT(), cum: liveDrag.cum });
      pLastA = a;
    }
  }
  function onUp(x, y) {
    if (!pDown) return;
    pDown = false;
    var t = pieceT();
    if (liveDrag) {
      addEvent({ kind: 'drag', t0: downT, t1: t, moves: dragMoves });
      liveDrag = null; dragMoves = [];
    } else if (t - downT < 0.6) {
      var q = segmentAt(x, y, t);
      if (t - lastTapT < 0.38) {
        // double-tap: hold the long recession; cancel the pending single tap
        if (pendingTap !== null) { clearTimeout(pendingTap); pendingTap = null; }
        lastTapT = -10;
        addEvent({ kind: 'dtap', t: t });
      } else {
        lastTapT = t;
        (function (tt, qq) {
          pendingTap = setTimeout(function () {
            pendingTap = null;
            addEvent({ kind: 'tap', t: tt, q: qq });
          }, 380);
        })(t, q);
      }
    }
    redraw();
  }
  function evtPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e && e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: 0, y: 0 };
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerdown', function (e) { var p = evtPos(e); onDown(p.x, p.y); });
    window.addEventListener('pointermove', function (e) { var p = evtPos(e); onMove(p.x, p.y); });
    window.addEventListener('pointerup', function (e) { var p = evtPos(e); onUp(p.x, p.y); });
    window.addEventListener('pointercancel', function () {
      if (liveDrag) addEvent({ kind: 'drag', t0: downT, t1: pieceT(), moves: dragMoves });
      pDown = false; liveDrag = null; dragMoves = [];
    });
  }
})();
</script>
</body>
</html>
