<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№8926 · Desordres</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#ece5d3; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(32,29,23,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another desordres</div>
<script>
'use strict';
// No8926 Desordres.
// A grid of squares, each one disobeying a little. Per-cell rotation and
// offset come from two octaves of seeded value noise, so neighbouring
// squares lean into and away from each other like a crowd shifting its
// weight. Most squares are warm charcoal outlines; a few, chosen by the
// seed, burn vermilion and sit a touch heavier. The ground is bone, the
// page color, so the piece simply centers at any size. After Molnar.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

// Seeded value-noise grid with smooth interpolation.
function makeNoise(rnd, size) {
  const g = [];
  for (let y = 0; y < size; y++) { g[y] = []; for (let x = 0; x < size; x++) g[y][x] = rnd(); }
  const sm = t => t * t * (3 - 2 * t);
  return function(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = sm(x - xi), yf = sm(y - yi);
    const x0 = ((xi % size) + size) % size, x1 = (x0 + 1) % size;
    const y0 = ((yi % size) + size) % size, y1 = (y0 + 1) % size;
    const a = g[y0][x0], b = g[y0][x1], c = g[y1][x0], d = g[y1][x1];
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
  };
}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '8926', 10) || 8926;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#ece5d3';
const INK = '#201d17';
const VERM = '#c65a34';

function compose(s) {
  const rnd = mulberry32(s);
  const nRot = makeNoise(rnd, 8);
  const nOff = makeNoise(rnd, 8);
  const nVerm = makeNoise(rnd, 4);
  return {
    cells: 9,
    rotAmp: 0.16 + rnd() * 0.10,      // max rotation, radians (~9-15 deg)
    offAmp: 0.10 + rnd() * 0.10,      // max offset, share of cell
    sizeBase: 0.60 + rnd() * 0.08,    // square side, share of cell
    sizeVar: 0.05 + rnd() * 0.06,     // size variation, share of cell
    vermThr: 0.80 + rnd() * 0.08,     // noise threshold for vermilion cells
    nRot, nOff, nVerm,
    rotFreq: 0.55 + rnd() * 0.35,
    offFreq: 0.45 + rnd() * 0.35,
  };
}

function renderPiece(c, W, H, p) {
  // Phone layout: physical screen size, aspect only as fallback.
  // Field piece: full-bleed grid on phones, centered square on desktop.
  const scrMin = (typeof window !== 'undefined' && window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || H > W * 1.15;

  c.fillStyle = GROUND;
  c.fillRect(0, 0, W, H);

  let cols, rows, cell, ox, oy;
  if (mobileLayout) {
    cols = p.cells;
    cell = W / cols;
    rows = Math.round(H / cell);
    ox = 0; oy = (H - rows * cell) / 2;
  } else {
    const S = Math.min(W, H) * 0.86;
    cols = rows = p.cells;
    cell = S / cols;
    ox = (W - cols * cell) / 2; oy = (H - rows * cell) / 2;
  }
  for (let gy = 0; gy < rows; gy++) {
    for (let gx = 0; gx < cols; gx++) {
      const u = cols > 1 ? gx / (cols - 1) : 0.5, v = rows > 1 ? gy / (rows - 1) : 0.5;
      // Two octaves of rotation noise: broad lean + local jitter.
      const rot = (p.nRot(u * p.rotFreq * 4, v * p.rotFreq * 4) - 0.5) * 2 * p.rotAmp
                + (p.nRot(u * p.rotFreq * 11 + 7, v * p.rotFreq * 11 + 3) - 0.5) * p.rotAmp * 0.5;
      const ox2 = (p.nOff(u * p.offFreq * 4 + 13, v * p.offFreq * 4 + 5) - 0.5) * 2 * p.offAmp * cell;
      const oy2 = (p.nOff(u * p.offFreq * 4 + 29, v * p.offFreq * 4 + 17) - 0.5) * 2 * p.offAmp * cell;
      const side = cell * (p.sizeBase + (p.nOff(u * 9 + 41, v * 9 + 23) - 0.5) * 2 * p.sizeVar);
      const isVerm = p.nVerm(u * 3, v * 3) > p.vermThr;

      const cx = ox + (gx + 0.5) * cell + ox2;
      const cy = oy + (gy + 0.5) * cell + oy2;

      c.save();
      c.translate(cx, cy);
      c.rotate(rot);
      c.strokeStyle = isVerm ? VERM : INK;
      c.globalAlpha = isVerm ? 0.94 : 0.88;
      c.lineWidth = Math.max(1, cell * 0.035) * (isVerm ? 1.5 : 1);
      c.strokeRect(-side / 2, -side / 2, side, side);
      c.restore();
    }
  }
  c.globalAlpha = 1;
}

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  const p = compose(seed);
  renderPiece(ctx, w, h, p);
}

window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  draw();
});
draw();
</script>
</body>
</html>
