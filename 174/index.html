<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No.174 Self-Organizing Swarm</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F5F3EC; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.174 Self-Organizing Swarm. About a hundred flat tiles -
// equilateral triangles in both polarities, squares, hexagons - in
// OpArt primaries, resting in neat edge-to-edge clusters: a honeycomb
// patch, triangle fields, a square block, a hex flower. Every tile is
// a light rigid body (circle collider, polygon renderer) held to its
// home by a weak spring, its edges magnetised home. Dragging through
// the field flings tiles with momentum; released, they drift back
// and re-cluster into the tilings. Double-tap reseeds a new field.
// Untouched, the field stirs itself once a minute and re-settles.
// No text anywhere; the gallery note carries the cue.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#F5F3EC', INK = '#1A1A1A';
var PALETTE = ['#D92B2B', '#1E4FD8', '#F2C230', '#FFFFFF'];
var W = 0, H = 0;
var seed = 20240704;
(function () {
  var m = /seed=(\d+)/.exec(location.search || '');
  if (m) seed = parseInt(m[1], 10) >>> 0;
})();

function rng(seedIn) {
  var a = seedIn >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- settled layout (unit field coords) -------------------------
// tile: {pts (relative to centroid), cx, cy, r, color, loose}
function buildLayout(seedIn) {
  var rand = rng(seedIn);
  var tiles = [];
  var SQ3 = Math.sqrt(3);
  function addTile(absPts, color, loose) {
    var cx = 0, cy = 0;
    absPts.forEach(function (p) { cx += p[0]; cy += p[1]; });
    cx /= absPts.length; cy /= absPts.length;
    var r = 0;
    var rel = absPts.map(function (p) {
      var dx = p[0] - cx, dy = p[1] - cy;
      r = Math.max(r, Math.sqrt(dx * dx + dy * dy));
      return [dx, dy];
    });
    tiles.push({ pts: rel, cx: cx, cy: cy, r: r, color: color, loose: !!loose });
  }
  function hexPts(cx, cy, rot) {
    var pts = [];
    for (var i = 0; i < 6; i++) {
      var a = rot + i * Math.PI / 3;
      pts.push([cx + Math.cos(a), cy + Math.sin(a)]);
    }
    return pts;
  }
  var pA = Math.floor(rand() * 4), pB = Math.floor(rand() * 4);
  var pC = Math.floor(rand() * 4), pD = Math.floor(rand() * 4);

  function honeycomb(ox, oy, cols, rows, phase) {
    for (var col = 0; col < cols; col++) {
      for (var row = 0; row < rows; row++) {
        if ((col === 0 && row === rows - 1) || (col === cols - 1 && row === 0)) continue;
        addTile(hexPts(ox + col * 1.5, oy + row * SQ3 + (col % 2 ? SQ3 / 2 : 0), 0),
          PALETTE[(col + row + phase) % 4]);
      }
    }
  }
  function triField(ox, oy, ni, nj, radius, phase) {
    function TP(i, j) { return [ox + i + j * 0.5, oy + j * SQ3 / 2]; }
    var ccx = ox + ni / 2, ccy = oy + nj * SQ3 / 4;
    for (var j = 0; j < nj; j++) {
      for (var i = 0; i < ni; i++) {
        var A = TP(i, j), B = TP(i + 1, j), C = TP(i, j + 1), D = TP(i + 1, j + 1);
        var u = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
        if (Math.hypot(u[0] - ccx, u[1] - ccy) < radius) addTile([A, B, C], PALETTE[(j + phase) % 4]);
        var d = [(B[0] + C[0] + D[0]) / 3, (B[1] + C[1] + D[1]) / 3];
        if (Math.hypot(d[0] - ccx, d[1] - ccy) < radius) addTile([B, D, C], PALETTE[(j + 1 + phase) % 4]);
      }
    }
  }
  function squares(ox, oy, cols, rows, edge, phase) {
    for (var i = 0; i < cols; i++) {
      for (var j = 0; j < rows; j++) {
        addTile([[ox + i * edge, oy + j * edge], [ox + (i + 1) * edge, oy + j * edge],
                  [ox + (i + 1) * edge, oy + (j + 1) * edge], [ox + i * edge, oy + (j + 1) * edge]],
          PALETTE[(i + 2 * j + phase) % 4]);
      }
    }
  }
  function hexFlower(fx, fy, phase) {
    addTile(hexPts(fx, fy, Math.PI / 6), PALETTE[phase]);
    var hp = hexPts(fx, fy, Math.PI / 6);
    for (var e = 0; e < 6; e++) {
      var p1 = hp[e], p2 = hp[(e + 1) % 6];
      var mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
      var nx = mx - fx, ny = my - fy, nl = Math.sqrt(nx * nx + ny * ny);
      addTile([p1, p2, [mx + nx / nl * (SQ3 / 2), my + ny / nl * (SQ3 / 2)]], PALETTE[(e + phase) % 4]);
    }
  }
  function miniHoney(gx, gy, phase) {
    addTile(hexPts(gx, gy, 0), PALETTE[(phase + 2) % 4]);
    for (var q = 0; q < 6; q++) {
      var a2 = q * Math.PI / 3 + Math.PI / 6;
      addTile(hexPts(gx + SQ3 * Math.cos(a2), gy + SQ3 * Math.sin(a2), 0), PALETTE[(q + phase) % 4]);
    }
  }
  function looseSingles(list) {
    list.forEach(function (L, ix) {
      var kind = ix % 3;
      if (kind === 0) addTile([[L[0], L[1]], [L[0] + 1, L[1]], [L[0] + 0.5, L[1] + SQ3 / 2]], PALETTE[(ix + pB) % 4], true);
      else if (kind === 1) addTile([[L[0], L[1]], [L[0] + 1.2, L[1]], [L[0] + 1.2, L[1] + 1.2], [L[0], L[1] + 1.2]], PALETTE[(ix + pC) % 4], true);
      else addTile(hexPts(L[0], L[1], Math.PI / 6), PALETTE[(ix + pD) % 4], true);
    });
  }

  // triangle fields hold about 7.3 cells per unit of radius squared
  // (2.31 cells per unit area); radii below are sized for ~120 tiles.
  var portrait = H > W * 1.05;
  if (!portrait) { // field about 36 x 25
    honeycomb(2, 2, 4, 4, pA);
    squares(10.5, 1.5, 4, 3, 1.3, pC);
    triField(18.5, 1, 6, 6, 1.6, pB);
    triField(26, 1, 6, 5, 1.55, pB + 3);
    triField(1.5, 11.5, 6, 5, 1.7, pB + 2);
    hexFlower(13, 13.5, pD);
    miniHoney(21.5, 12.5, pA);
    squares(24, 19, 5, 2, 1.3, pC + 2);
    triField(1.5, 18.5, 5, 5, 1.5, pB + 1);
    looseSingles([[20, 23], [30, 16], [33, 3], [35, 8], [28, 7], [8, 20], [3, 22], [33, 23]]);
  } else { // field about 27 x 38
    honeycomb(2, 2, 4, 4, pA);
    triField(15, 1, 6, 5, 1.65, pB);
    squares(15.5, 7, 4, 3, 1.3, pC);
    triField(1.5, 11, 6, 5, 1.7, pB + 2);
    hexFlower(16.5, 14.5, pD);
    miniHoney(5, 19, pA);
    squares(11.5, 19.5, 5, 2, 1.3, pC + 1);
    triField(1.5, 23.5, 6, 6, 1.45, pB + 1);
    squares(14.5, 24.5, 4, 2, 1.3, pC + 2);
    squares(14.5, 30, 4, 2, 1.3, pC + 3);
    looseSingles([[12, 31], [20, 33], [23, 18], [24, 29], [5, 30], [3, 35], [15, 35.5], [23, 36]]);
  }
  // physics cap: trim loose singles first, then tiles farthest out
  while (tiles.length > 120) {
    var li = -1;
    for (var i = tiles.length - 1; i >= 0; i--) if (tiles[i].loose) { li = i; break; }
    if (li < 0) break;
    tiles.splice(li, 1);
  }
  while (tiles.length > 120) {
    var fi = 0, fd = -1;
    tiles.forEach(function (t, i) {
      var d = Math.hypot(t.cx - 19, t.cy - 15);
      if (d > fd) { fd = d; fi = i; }
    });
    tiles.splice(fi, 1);
  }
  return tiles;
}

var tiles = [];
var fit = { s: 10, ox: 0, oy: 0 };
function layout() {
  var homes = buildLayout(seed);
  // field bounds
  var mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
  homes.forEach(function (t) {
    t.pts.forEach(function (p) {
      mnx = Math.min(mnx, t.cx + p[0]); mxx = Math.max(mxx, t.cx + p[0]);
      mny = Math.min(mny, t.cy + p[1]); mxy = Math.max(mxy, t.cy + p[1]);
    });
  });
  var fw = mxx - mnx, fh = mxy - mny;
  fit.s = Math.min(W * 0.96 / fw, H * 0.96 / fh);
  fit.ox = W / 2 - (mnx + fw / 2) * fit.s;
  fit.oy = H / 2 - (mny + fh / 2) * fit.s;
  homes.forEach(function (t, i) {
    var keep = tiles[i];
    tiles[i] = {
      hx: fit.ox + t.cx * fit.s, hy: fit.oy + t.cy * fit.s,
      pts: t.pts.map(function (p) { return [p[0] * fit.s, p[1] * fit.s]; }),
      r: t.r * fit.s, color: t.color,
      dx: keep ? keep.dx : 0, dy: keep ? keep.dy : 0,
      vx: keep ? keep.vx : 0, vy: keep ? keep.vy : 0,
      da: keep ? keep.da : 0, va: keep ? keep.va : 0
    };
  });
  tiles.length = homes.length;
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  layout();
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---------- physics ------------------------------------------------------
var lastNow = -1, stirCycle = -1;
function step(dt, now) {
  if (dt <= 0) return;
  var i, j;
  // idle self-stir: once per 60 s cycle, a gentle shake
  var cyc = Math.floor(now / 60000);
  if (cyc !== stirCycle) {
    stirCycle = cyc;
    if (lastNow > 0) {
      for (i = 0; i < tiles.length; i++) {
        if ((i * 2654435761 >>> 8) % 10 < 3) {
          tiles[i].vx += ((i * 37) % 13 - 6) * 14;
          tiles[i].vy += ((i * 53) % 11 - 5) * 14;
          tiles[i].va += ((i * 29) % 7 - 3) * 0.25;
        }
      }
    }
  }
  var damp = Math.exp(-3.0 * dt), dampA = Math.exp(-3.6 * dt);
  for (i = 0; i < tiles.length; i++) {
    var t = tiles[i];
    t.vx += (-26 * t.dx) * dt; t.vy += (-26 * t.dy) * dt;
    t.va += (-30 * t.da) * dt;
    t.vx *= damp; t.vy *= damp; t.va *= dampA;
    t.dx += t.vx * dt; t.dy += t.vy * dt; t.da += t.va * dt;
  }
  // pairwise separation (circle colliders)
  for (i = 0; i < tiles.length; i++) {
    for (j = i + 1; j < tiles.length; j++) {
      var a = tiles[i], b = tiles[j];
      var ax = a.hx + a.dx, ay = a.hy + a.dy, bx = b.hx + b.dx, by = b.hy + b.dy;
      var dx = bx - ax, dy = by - ay;
      var rr = (a.r + b.r) * 0.80;
      var d2 = dx * dx + dy * dy;
      if (d2 > 0.01 && d2 < rr * rr) {
        var d = Math.sqrt(d2), push = (rr - d) / d * 0.5;
        var px = dx * push, py = dy * push;
        a.dx -= px * 0.5; a.dy -= py * 0.5;
        b.dx += px * 0.5; b.dy += py * 0.5;
      }
    }
  }
  // soft walls
  for (i = 0; i < tiles.length; i++) {
    var t2 = tiles[i];
    var x = t2.hx + t2.dx, y = t2.hy + t2.dy;
    if (x < t2.r * 0.5) t2.dx += (t2.r * 0.5 - x) * 0.4;
    if (x > W - t2.r * 0.5) t2.dx -= (x - (W - t2.r * 0.5)) * 0.4;
    if (y < t2.r * 0.5) t2.dy += (t2.r * 0.5 - y) * 0.4;
    if (y > H - t2.r * 0.5) t2.dy -= (y - (H - t2.r * 0.5)) * 0.4;
  }
}

// ---------- drag -----------------------------------------------------------
var drag = null, lastTap = { t: -1000, x: 0, y: 0 };
canvas.addEventListener('pointerdown', function (e) {
  drag = { x: e.clientX, y: e.clientY, vx: 0, vy: 0, t: e.timeStamp };
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var dt = Math.max(1, e.timeStamp - drag.t) / 1000;
  var vx = (e.clientX - drag.x) / dt, vy = (e.clientY - drag.y) / dt;
  drag.vx = vx; drag.vy = vy;
  var R = Math.max(70, fit.s * 5);
  for (var i = 0; i < tiles.length; i++) {
    var t = tiles[i];
    var cx = t.hx + t.dx, cy = t.hy + t.dy;
    var dx = cx - e.clientX, dy = cy - e.clientY;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < R) {
      var f = (1 - d / R);
      t.vx += vx * 0.55 * f + (d > 1 ? dx / d * 130 * f : 0);
      t.vy += vy * 0.55 * f + (d > 1 ? dy / d * 130 * f : 0);
      t.va += (vx * dy - vy * dx) / (R * R) * 2.2 * f;
    }
  }
  drag.x = e.clientX; drag.y = e.clientY; drag.t = e.timeStamp;
});
function endDrag(e) {
  if (drag && e) {
    if (e.timeStamp - lastTap.t < 320 && Math.abs(e.clientX - lastTap.x) < 44 && Math.abs(e.clientY - lastTap.y) < 44) {
      seed = (seed * 1103515245 + 12345 + (e.timeStamp | 0)) >>> 0;
      layout();
      for (var i = 0; i < tiles.length; i++) {
        tiles[i].vx += ((i * 41) % 17 - 8) * 22;
        tiles[i].vy += ((i * 31) % 15 - 7) * 22;
        tiles[i].va += ((i * 19) % 9 - 4) * 0.3;
      }
      lastTap.t = -1000;
    } else {
      lastTap = { t: e.timeStamp, x: e.clientX, y: e.clientY };
    }
  }
  drag = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', function () { drag = null; });

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = lastNow < 0 ? 0 : Math.min(0.033, (now - lastNow) / 1000);
  lastNow = now;
  step(dt, now);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;
  ctx.lineJoin = 'round';
  for (var i = 0; i < tiles.length; i++) {
    var t = tiles[i];
    var cx = t.hx + t.dx, cy = t.hy + t.dy;
    var cs = Math.cos(t.da), sn = Math.sin(t.da);
    ctx.beginPath();
    t.pts.forEach(function (p, ix) {
      var x = cx + p[0] * cs - p[1] * sn;
      var y = cy + p[0] * sn + p[1] * cs;
      if (ix === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = t.color;
    ctx.fill();
    ctx.stroke();
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
