<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Reader</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05070F; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var SKY = '#05070F';
  var STAR = '#FFFFFF';
  var MOON = '#9A9A96';
  var CRATER = '#7A7A76';
  var SUIT = '#E8E6E0';
  var VISOR = '#2B4A7A';
  var BOOK = '#D9261C';
  var SEA = '#2B5FE3';
  var CLOUD = '#FFFFFF';
  var LAND = '#4E7A4E';

  var PHASE = 25.0; // fixed pre-roll: page mid-turn, helmet dipped, clouds drifted

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(471007);

  // ---- seeded star field (normalised coords; periods all divide 60s) ----
  var TWINKLES = [5, 6, 7.5, 10, 12, 15, 20, 30];
  var stars = [];
  for (var i = 0; i < 105; i++) {
    stars.push({
      x: rng(), y: rng() * 0.92,
      r: 0.6 + rng() * 1.5,
      per: TWINKLES[Math.floor(rng() * TWINKLES.length)],
      ph: rng() * Math.PI * 2,
      base: 0.35 + rng() * 0.45
    });
  }
  // ---- seeded craters (normalised; clipped to the moon disc in draw) ----
  var craters = [];
  for (var j = 0; j < 16; j++) {
    craters.push({
      x: 0.03 + rng() * 0.94,
      y: 0.815 + rng() * 0.165,
      r: 0.012 + rng() * 0.026,
      squash: 0.45 + rng() * 0.25
    });
  }
  // ---- seeded Earth cloud groups (normalised to Earth radius) ----
  var clouds = [];
  for (var k = 0; k < 4; k++) {
    clouds.push({
      bx: rng() * 2.6 - 1.3,        // base offset across the wrap band
      y: -0.55 + rng() * 1.1,       // vertical position in radii
      s: 0.34 + rng() * 0.30,       // group size in radii
      sp: 0.75 + rng() * 0.5        // drift speed factor
    });
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // moon surface: top of a huge circle whose crest sits at 80% of frame height
  function moonGeom() {
    var Rm = 1.8 * Math.max(W, H);
    var cx = W * 0.5;
    var cy = H * 0.80 + Rm;
    return { Rm: Rm, cx: cx, cy: cy };
  }
  function surfaceY(x) {
    var g = moonGeom();
    var dx = x - g.cx;
    var under = g.Rm * g.Rm - dx * dx;
    return g.cy - Math.sqrt(Math.max(0, under));
  }

  function drawEarth(t) {
    var U = Math.min(W, H);
    var ex = W * 0.80, ey = H * 0.20, R = 0.098 * U;

    // faint halo in the sea colour
    var halo = ctx.createRadialGradient(ex, ey, R * 0.9, ex, ey, R * 1.55);
    halo.addColorStop(0, 'rgba(43,95,227,0.20)');
    halo.addColorStop(1, 'rgba(43,95,227,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(ex, ey, R * 1.55, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(ex, ey, R, 0, Math.PI * 2);
    ctx.clip();

    // sea
    ctx.fillStyle = SEA;
    ctx.fillRect(ex - R, ey - R, R * 2, R * 2);

    // landmasses: static soft blobs
    ctx.fillStyle = LAND;
    var blobs = [
      [-0.38, -0.34, 0.34], [-0.16, -0.22, 0.22], [-0.52, -0.14, 0.18],
      [0.30, 0.28, 0.30], [0.52, 0.42, 0.18], [0.08, -0.52, 0.16],
      [0.44, -0.30, 0.14], [-0.05, 0.55, 0.15]
    ];
    for (var b = 0; b < blobs.length; b++) {
      ctx.beginPath();
      ctx.arc(ex + blobs[b][0] * R, ey + blobs[b][1] * R, blobs[b][2] * R, 0, Math.PI * 2);
      ctx.fill();
    }

    // cloud swirls: drift sideways across the disc, wrapping every 60s
    var wrap = 2.6 * R;
    ctx.fillStyle = CLOUD;
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      var drift = ((t / 60) * wrap * cl.sp + cl.bx * R) % wrap;
      if (drift < 0) drift += wrap;
      var cxp = ex - 1.3 * R + drift;
      var cyp = ey + cl.y * R;
      var s = cl.s * R;
      for (var rep = -1; rep <= 1; rep++) {
        var bx = cxp + rep * wrap;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.ellipse(bx, cyp, s * 0.62, s * 0.20, -0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(bx + s * 0.34, cyp + s * 0.10, s * 0.44, s * 0.15, -0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(bx - s * 0.30, cyp - s * 0.08, s * 0.36, s * 0.12, -0.25, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // rim
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = Math.max(1, 0.0035 * U);
    ctx.beginPath();
    ctx.arc(ex, ey, R, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawAstronaut(t) {
    var S = Math.min(H, W * 1.55);
    var aH = 0.205 * S;                       // seated figure height
    var ax = W * 0.165;                       // seat point
    var ay = surfaceY(ax) + 0.006 * S;        // butt rests on the surface
    var phone = isPhone();
    if (phone) aH *= 1.12;                    // legibility bump on small screens

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // soft contact shadow on the moon
    ctx.fillStyle = 'rgba(122,122,118,0.5)';
    ctx.beginPath();
    ctx.ellipse(ax + 0.13 * aH, ay + 0.012 * aH, 0.44 * aH, 0.05 * aH, 0, 0, Math.PI * 2);
    ctx.fill();

    var hipX = ax, hipY = ay - 0.30 * aH;
    var shX = ax + 0.10 * aH, shY = ay - 0.80 * aH;   // shoulder
    var neckX = ax + 0.13 * aH, neckY = ay - 0.86 * aH;

    // far leg (slightly higher, behind)
    ctx.strokeStyle = SUIT;
    ctx.lineWidth = 0.145 * aH;
    ctx.beginPath();
    ctx.moveTo(hipX + 0.01 * aH, hipY - 0.01 * aH);
    ctx.lineTo(ax + 0.30 * aH, ay - 0.26 * aH);       // far knee
    ctx.lineTo(ax + 0.31 * aH, ay - 0.015 * aH);      // far boot
    ctx.stroke();
    // near leg: thigh forward, shin down to a boot flat on the ground
    ctx.lineWidth = 0.165 * aH;
    ctx.beginPath();
    ctx.moveTo(hipX, hipY + 0.02 * aH);
    ctx.lineTo(ax + 0.40 * aH, ay - 0.235 * aH);      // near knee
    ctx.lineTo(ax + 0.42 * aH, ay - 0.01 * aH);       // near boot
    ctx.stroke();
    // boots in the crater grey
    ctx.fillStyle = CRATER;
    ctx.beginPath();
    ctx.ellipse(ax + 0.335 * aH, ay - 0.008 * aH, 0.075 * aH, 0.038 * aH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(ax + 0.455 * aH, ay - 0.004 * aH, 0.085 * aH, 0.042 * aH, 0, 0, Math.PI * 2);
    ctx.fill();

    // backpack: rounded pack behind the torso, with a grey panel
    ctx.fillStyle = SUIT;
    ctx.beginPath();
    ctx.roundRect(ax - 0.335 * aH, ay - 0.845 * aH, 0.30 * aH, 0.56 * aH, 0.09 * aH);
    ctx.fill();
    ctx.fillStyle = CRATER;
    ctx.beginPath();
    ctx.roundRect(ax - 0.295 * aH, ay - 0.755 * aH, 0.21 * aH, 0.30 * aH, 0.05 * aH);
    ctx.fill();

    // torso: one thick stroke, leaning a little toward the book
    ctx.strokeStyle = SUIT;
    ctx.lineWidth = 0.335 * aH;
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(shX, shY);
    ctx.stroke();

    // book position, held low in front of the lap
    var bkX = ax + 0.47 * aH, bkY = ay - 0.335 * aH;

    // far arm: shoulder to the book's far edge
    ctx.lineWidth = 0.115 * aH;
    ctx.beginPath();
    ctx.moveTo(shX - 0.01 * aH, shY + 0.06 * aH);
    ctx.lineTo(ax + 0.24 * aH, ay - 0.47 * aH);       // elbow
    ctx.lineTo(bkX - 0.10 * aH, bkY + 0.03 * aH);
    ctx.stroke();
    // near arm: shoulder down and forward to the book
    ctx.beginPath();
    ctx.moveTo(shX + 0.02 * aH, shY + 0.09 * aH);
    ctx.lineTo(ax + 0.33 * aH, ay - 0.44 * aH);       // elbow
    ctx.lineTo(bkX + 0.02 * aH, bkY + 0.06 * aH);
    ctx.stroke();

    // ---- the red book, open, spine vertical at its centre ----
    var pw = 0.215 * aH, ph = 0.30 * aH;              // page width / height
    ctx.save();
    ctx.translate(bkX, bkY);
    ctx.rotate(-0.10);
    // cover: two red leaves fanning from the spine
    ctx.fillStyle = BOOK;
    ctx.beginPath();                                  // left cover
    ctx.moveTo(0, -ph / 2);
    ctx.lineTo(-pw * 1.06, -ph * 0.36);
    ctx.lineTo(-pw * 1.06, ph * 0.44);
    ctx.lineTo(0, ph / 2);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();                                  // right cover
    ctx.moveTo(0, -ph / 2);
    ctx.lineTo(pw * 1.06, -ph * 0.36);
    ctx.lineTo(pw * 1.06, ph * 0.44);
    ctx.lineTo(0, ph / 2);
    ctx.closePath();
    ctx.fill();
    // page blocks in white, well inset so the red cover frames them
    ctx.fillStyle = STAR;
    ctx.beginPath();
    ctx.moveTo(0, -ph * 0.36);
    ctx.lineTo(-pw * 0.78, -ph * 0.24);
    ctx.lineTo(-pw * 0.78, ph * 0.28);
    ctx.lineTo(0, ph * 0.36);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -ph * 0.36);
    ctx.lineTo(pw * 0.78, -ph * 0.24);
    ctx.lineTo(pw * 0.78, ph * 0.28);
    ctx.lineTo(0, ph * 0.36);
    ctx.closePath();
    ctx.fill();
    // the turning page: a white sliver hinged on the spine, one turn per 20s
    var cyc = t % 20;
    var p = (cyc - 4.4) / 1.6;                        // turn window 4.4s to 6.0s
    if (p >= 0 && p <= 1) {
      var e = p * p * (3 - 2 * p);                    // smoothstep
      var edgeX = pw * 0.78 * Math.cos(Math.PI * e); // right side to left side
      var lift = Math.sin(Math.PI * e) * ph * 0.10;  // rises as it flips
      ctx.beginPath();
      ctx.moveTo(0, -ph * 0.36);
      ctx.lineTo(edgeX, -ph * 0.24 - lift);
      ctx.lineTo(edgeX, ph * 0.28 - lift * 0.6);
      ctx.lineTo(0, ph * 0.36);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(5,7,15,0.22)';
      ctx.lineWidth = Math.max(1, 0.01 * aH);
      ctx.stroke();
    }
    // spine shade line
    ctx.strokeStyle = 'rgba(5,7,15,0.25)';
    ctx.lineWidth = Math.max(1, 0.012 * aH);
    ctx.beginPath();
    ctx.moveTo(0, -ph * 0.44);
    ctx.lineTo(0, ph * 0.44);
    ctx.stroke();
    ctx.restore();

    // ---- helmet: suit-white dome with a dark visor, nodding gently ----
    var tilt = 0.07 + 0.055 * Math.sin((t % 20) / 20 * Math.PI * 2 - 0.9);
    var headR = 0.20 * aH;
    var hcx = neckX + 0.035 * aH, hcy = neckY - headR * 0.72;
    ctx.save();
    ctx.translate(neckX, neckY);
    ctx.rotate(tilt);
    ctx.translate(-neckX, -neckY);
    ctx.fillStyle = SUIT;
    ctx.beginPath();
    ctx.arc(hcx, hcy, headR, 0, Math.PI * 2);
    ctx.fill();
    // visor: dark blue glass facing forward and down toward the book
    ctx.fillStyle = VISOR;
    ctx.beginPath();
    ctx.ellipse(hcx + headR * 0.30, hcy + headR * 0.10, headR * 0.60, headR * 0.52, 0.35, 0, Math.PI * 2);
    ctx.fill();
    // small visor glint in suit white
    ctx.fillStyle = SUIT;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.ellipse(hcx + headR * 0.48, hcy - headR * 0.16, headR * 0.13, headR * 0.07, 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function draw(t) {
    if (!W || !H) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var U = Math.min(W, H);

    // ---- sky ----
    ctx.fillStyle = SKY;
    ctx.fillRect(0, 0, W, H);

    // ---- stars, twinkling on staggered cycles ----
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var a = st.base + (1 - st.base) * (0.5 + 0.5 * Math.sin(t * (Math.PI * 2 / st.per) + st.ph));
      ctx.fillStyle = STAR;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(st.x * W, st.y * H, st.r * U / 720 + 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- Earth, upper right ----
    drawEarth(t);

    // ---- moon: one low curve across the bottom ----
    var g = moonGeom();
    ctx.fillStyle = MOON;
    ctx.beginPath();
    ctx.arc(g.cx, g.cy, g.Rm, 0, Math.PI * 2);
    ctx.fill();

    // craters, clipped inside the moon
    ctx.save();
    ctx.beginPath();
    ctx.arc(g.cx, g.cy, g.Rm, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = CRATER;
    for (var j = 0; j < craters.length; j++) {
      var cr = craters[j];
      ctx.beginPath();
      ctx.ellipse(cr.x * W, cr.y * H, cr.r * U, cr.r * U * cr.squash, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // ---- the reader ----
    drawAstronaut(t);
  }

  // ---- run: watch-only, no interaction ----
  resize();
  draw(PHASE);

  var startStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) startStamp = stamp;
      var elapsed = (stamp - startStamp) / 1000;
      draw(PHASE + elapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
