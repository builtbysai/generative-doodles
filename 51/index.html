<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№51 · Chromesthetic Grid</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#17171c; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,228,216,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to retune</div>
<script>
'use strict';

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '51', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function artRect(w,h,full){
  if (full || isPhone()) return [0,0,w,h];
  const s=Math.min(w,h); return [(w-s)/2,(h-s)/2,s,s];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}

const PAL = ['#d42b1e','#7a1f1f','#2f9e44','#0fa3a3','#f5c518','#ef6c00','#2456c8','#f28ab2','#b39ddb','#b030a0','#1c9fd6'];
const rng = mulberry(seed*7919+11);
const COLS=4, ROWS=5, N=20;
const mods=[];
for(let i=0;i<N;i++){
  const cx=0.5+(rng()-0.5)*0.3, cy=0.5+(rng()-0.5)*0.3;
  const r1=0.34+rng()*0.2, r2=0.16+rng()*0.12;
  const a0=Math.floor(rng()*4)*Math.PI/2;
  const tuples=[];
  for(let k=0;k<3;k++){ const t=[]; let used=new Set(); while(t.length<3){ const c=Math.floor(rng()*PAL.length); if(!used.has(c)){used.add(c); t.push(PAL[c]);} } tuples.push(t); }
  mods.push({cx,cy,r1,r2,a0,tuples});
}
let dragOff=0, dragX=null, lastX=0, idleAt=0;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#17171c'; ctx.fillRect(0,0,w,h);
  const [rx,ry,rw,rh]=artRect(w,h,true);
  const t=((nowMs/1000)+dragOff)%24; if(t<0){}
  const wave=((nowMs/1000)+dragOff)/1.2;
  const mw=rw/COLS, mh=rh/ROWS;
  for(let i=0;i<N;i++){
    const col=i%COLS, row=Math.floor(i/COLS);
    const x=rx+col*mw, y=ry+row*mh;
    const m=mods[i];
    let local=wave-i; let cyc=Math.floor(local); let frac=local-cyc;
    let ti=((cyc%3)+3)%3; let ang=m.a0;
    let cols=m.tuples[ti];
    if(frac>=0 && frac<1){
      const p=Math.min(1,frac/0.6);
      ang=m.a0 + p*Math.PI;
      if(frac>=0.6) cols=m.tuples[(((cyc+1)%3)+3)%3];
    }
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,mw,mh); ctx.clip();
    ctx.fillStyle=cols[0]; ctx.fillRect(x,y,mw,mh);
    const ccx=x+m.cx*mw, ccy=y+m.cy*mh;
    ctx.fillStyle=cols[1]; ctx.beginPath(); ctx.arc(ccx,ccy,m.r1*Math.min(mw,mh)*2,ang,ang+Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle=cols[2]; ctx.beginPath(); ctx.arc(ccx,ccy,m.r2*Math.min(mw,mh)*2,ang,ang+Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle=cols[1]; ctx.beginPath(); ctx.arc(ccx,ccy,m.r2*Math.min(mw,mh)*2,ang+Math.PI,ang+Math.PI*2); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // structural band between middle rows
  const bandH=rh*0.07, bandY=ry+rh*0.5-bandH/2;
  ctx.fillStyle='#17171c'; ctx.fillRect(rx,bandY,rw,bandH);
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(6000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',ev=>{dragX=ev.clientX; lastX=ev.clientX;});
canvas.addEventListener('pointermove',ev=>{ if(dragX===null) return; dragOff += (ev.clientX-lastX)/Math.max(1,viewportWH()[0])*24; lastX=ev.clientX; });
function endDrag(){ dragX=null; }
canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));

</script>
</body>
</html>
