<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Hundred Kilos</title>
<style>
  html, body { margin: 0; padding: 0; background: #070A12; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var PHASE = 20; // fixed first-frame phase: wall mid-advance, sphere mid-beat
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var vw = 0, vh = 0, dpr = 1;
  var curT = PHASE;

  // deterministic seed for the audience row
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1080);
  var audience = [];
  (function buildAudience() {
    var rows = [
      { n: 15, y: 0.895, s: 0.75 },
      { n: 12, y: 0.945, s: 1.05 }
    ];
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      for (var i = 0; i < row.n; i++) {
        audience.push({
          x: (i + 0.5) / row.n + (rng() - 0.5) * 0.03,
          y: row.y + (rng() - 0.5) * 0.008,
          s: row.s * (0.85 + rng() * 0.35)
        });
      }
    }
  })();

  function isPhone() {
    try {
      var s = window.screen;
      if (s && Math.min(s.width, s.height) < 700) return true;
    } catch (e) {}
    return vh > vw * 1.15;
  }

  // Wall depth program, closed-form: 60 s loop.
  // 0-45 s advance at constant speed (freight, never eased), 45-50 s hold, 50-60 s retract.
  function depthAt(t) {
    var lt = ((t % 60) + 60) % 60;
    if (lt < 45) return lt / 45;
    if (lt < 50) return 1;
    return 1 - (lt - 50) / 10;
  }

  // Heartbeat: 4 s period, sharp attack, slow decay, with a softer second thump.
  function beatAt(t) {
    var p = (((t % 4) + 4) % 4) / 4;
    var a = Math.exp(-p * 5.5);
    var q = p - 0.16;
    if (q < 0) q += 1;
    var b = 0.55 * Math.exp(-q * 7);
    return Math.min(1, a + b);
  }

  function circle(x, y, r, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    if (!vw || !vh) return;
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';

    // void
    ctx.fillStyle = '#070A12';
    ctx.fillRect(0, 0, vw, vh);

    // square stage, centered; page ground is the void color so it reads full-bleed
    var S = Math.min(vw, vh);
    var ox = (vw - S) / 2, oy = (vh - S) / 2;

    var d = depthAt(t);
    var beat = beatAt(t);

    var floorY = oy + S * 0.80;
    var wallW = S * (0.50 + 0.34 * d);
    var wallH = wallW * (4 / 7.6);
    var wallX = ox + (S - wallW) / 2;
    var wallTop = floorY - wallH;
    var cx = ox + S / 2;
    var hy = wallTop + wallH * 0.48; // grid horizon on the wall face

    // ---- ceiling rail, implied at the top edge ----
    var railY = oy + S * 0.055;
    ctx.strokeStyle = '#1C2947';
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = Math.max(1, S * 0.0022);
    ctx.beginPath();
    ctx.moveTo(ox + S * 0.05, railY);
    ctx.lineTo(ox + S * 0.95, railY);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // hangers down to the wall's top edge
    ctx.strokeStyle = '#141F38';
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = Math.max(1, S * 0.0016);
    [0.22, 0.5, 0.78].forEach(function (f) {
      var hx = wallX + wallW * f;
      ctx.beginPath();
      ctx.moveTo(hx, railY);
      ctx.lineTo(hx, wallTop);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // ---- floor reflection of the wall (flipped, 0.25 alpha, squashed) ----
    var reflH = wallH * 0.45;
    var strips = 6;
    for (var si = 0; si < strips; si++) {
      var sy = floorY + (reflH * si) / strips;
      var sh = reflH / strips + 1;
      ctx.globalAlpha = 0.25 * (1 - si / strips) * 0.9;
      ctx.fillStyle = '#0D1424';
      ctx.fillRect(wallX, sy, wallW, sh);
    }
    ctx.globalAlpha = 1;

    // ---- the wall face ----
    ctx.fillStyle = '#0D1424';
    ctx.fillRect(wallX, wallTop, wallW, wallH);
    // faint top edge light on the wall
    ctx.fillStyle = '#22345C';
    ctx.globalAlpha = 0.5;
    ctx.fillRect(wallX, wallTop, wallW, Math.max(1, S * 0.0018));
    ctx.globalAlpha = 1;

    // ---- cyan wireframe grid on the wall's lower half ----
    ctx.save();
    ctx.beginPath();
    ctx.rect(wallX, wallTop, wallW, wallH);
    ctx.clip();
    ctx.strokeStyle = '#35E0FF';
    ctx.lineWidth = Math.max(1, S * 0.0013);
    // fan lines from the vanishing point
    for (var fi = -7; fi <= 7; fi++) {
      var bx = cx + fi * wallW * 0.105;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.moveTo(cx, hy);
      ctx.lineTo(bx, floorY);
      ctx.stroke();
    }
    // horizontal lines scrolling toward the viewer (closed-form offset)
    var off = (t * 0.018) % 1;
    for (var k = 0; k < 9; k++) {
      var z = (k + off) / 9;
      var yy = hy + (floorY - hy) * Math.pow(z, 1.9);
      var spread = (Math.pow(z, 1.9)) * wallW * 0.52;
      ctx.globalAlpha = 0.12 + 0.5 * z;
      ctx.beginPath();
      ctx.moveTo(cx - spread, yy);
      ctx.lineTo(cx + spread, yy);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // faint mirrored grid lines in the floor reflection
    ctx.strokeStyle = '#35E0FF';
    ctx.lineWidth = Math.max(1, S * 0.0012);
    for (var mi = -5; mi <= 5; mi += 2) {
      var mx = cx + mi * wallW * 0.105;
      ctx.globalAlpha = 0.07;
      ctx.beginPath();
      ctx.moveTo(cx, floorY);
      ctx.lineTo(mx, floorY + reflH * 0.8);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // ---- the pulsing sphere, floating above the grid horizon ----
    var sx = cx;
    var sy2 = wallTop + wallH * 0.27;
    var sr = wallH * 0.165 * (1 + 0.06 * beat);
    // sphere reflection first (under the real sphere in paint order, in the floor band)
    var rsy = floorY + (floorY - sy2) * 0.45;
    ctx.save();
    ctx.translate(sx, rsy);
    ctx.scale(1, 0.5);
    circle(0, 0, sr * 2.2, '#4A7DFF', 0.25 * 0.10);
    circle(0, 0, sr * 1.4, '#4A7DFF', 0.25 * 0.16);
    circle(0, 0, sr * 0.9, '#4A7DFF', 0.25 * 0.30);
    ctx.restore();
    // glow: layered flat-alpha discs
    circle(sx, sy2, sr * 3.1, '#4A7DFF', 0.035 + 0.030 * beat);
    circle(sx, sy2, sr * 2.3, '#4A7DFF', 0.055 + 0.035 * beat);
    circle(sx, sy2, sr * 1.7, '#4A7DFF', 0.085 + 0.040 * beat);
    circle(sx, sy2, sr * 1.3, '#4A7DFF', 0.13 + 0.05 * beat);
    circle(sx, sy2, sr, '#4A7DFF', 0.48 + 0.22 * beat);
    circle(sx, sy2, sr * 0.62, '#8FA9F2', 0.35 + 0.20 * beat);
    circle(sx, sy2, sr * 0.34, '#D6E2FF', 0.30 + 0.25 * beat);

    // ---- audience silhouettes, tiny, far below ----
    ctx.fillStyle = '#05070C';
    for (var ai = 0; ai < audience.length; ai++) {
      var p = audience[ai];
      var px = ox + p.x * S;
      var py = oy + p.y * S;
      var hr = S * 0.0095 * p.s;
      ctx.beginPath();
      ctx.arc(px, py - hr * 1.55, hr, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(px, py + hr * 0.6, hr * 1.65, Math.PI, Math.PI * 2);
      ctx.fill();
    }

    curT = t;
  }

  function resize() {
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    } else {
      vw = window.innerWidth;
      vh = window.innerHeight;
    }
    dpr = window.devicePixelRatio || 1;
    if (dpr > 2) dpr = 2;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(curT);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) window.addEventListener('resize', resize);

  resize();
  draw(PHASE);

  // motion loop: anchored at the fixed phase, elapsed time only
  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var loop = function (now) {
      if (t0 === null) t0 = now;
      draw(PHASE + (now - t0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
