<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No9083 · Strides</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a0a0c; }
  body { position: fixed; inset: 0; width: 100%; touch-action: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function() {
  'use strict';
  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var T = 12; // loop period, seconds

  // ---- color utils (flat tones only) ----
  function hx(c) { return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
  function mix(a, b, k) {
    var A = hx(a), B = hx(b);
    return 'rgb(' + Math.round(A[0]+(B[0]-A[0])*k) + ',' + Math.round(A[1]+(B[1]-A[1])*k) + ',' + Math.round(A[2]+(B[2]-A[2])*k) + ')';
  }

  var BASE = '#d9d3c3';   // warm bone beam
  var OUT  = '#101013';   // near-black outline
  var BG   = '#0a0a0c';
  var PULSE = '#e8a33d';  // amber traveler

  var P = null; // geometry params, rebuilt on resize
  function build() {
    var cx = W/2, cy = H/2;
    var R = Math.min(W, H) * 0.30;
    var A = { x: cx, y: cy - R };
    var B = { x: cx + R*Math.cos(Math.PI/6), y: cy + R*Math.sin(Math.PI/6) };
    var C = { x: cx - R*Math.cos(Math.PI/6), y: cy + R*Math.sin(Math.PI/6) };
    P = { cx:cx, cy:cy, R:R, A:A, B:B, C:C, w: Math.min(W,H)*0.055 };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var vw = window.innerWidth, vh = window.innerHeight;
    if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
    W = vw; H = vh;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    build();
  }

  function seg(p1, p2) { ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }

  // A beam with flat bevel shading; faceK in [0,1] from raking light
  function beam(p1, p2, w, faceK) {
    var dx = p2.x-p1.x, dy = p2.y-p1.y, len = Math.hypot(dx,dy) || 1;
    var nx = -dy/len, ny = dx/len, off = w*0.22;
    ctx.lineCap = 'butt';
    ctx.strokeStyle = OUT; ctx.lineWidth = w + 6; seg(p1,p2);
    ctx.strokeStyle = BASE; ctx.lineWidth = w; seg(p1,p2);
    ctx.strokeStyle = mix(BASE, '#ffffff', 0.10 + 0.55*faceK); ctx.lineWidth = w*0.30;
    seg({x:p1.x+nx*off, y:p1.y+ny*off}, {x:p2.x+nx*off, y:p2.y+ny*off});
    ctx.strokeStyle = mix(BASE, '#000000', 0.10 + 0.55*(1-faceK)); ctx.lineWidth = w*0.30;
    seg({x:p1.x-nx*off, y:p1.y-ny*off}, {x:p2.x-nx*off, y:p2.y-ny*off});
  }

  function lerpP(p, q, f) { return { x: p.x+(q.x-p.x)*f, y: p.y+(q.y-p.y)*f }; }
  function faceKOf(p1, p2, phi) {
    var mx = (p1.x+p2.x)/2 - P.cx, my = (p1.y+p2.y)/2 - P.cy;
    return 0.5 + 0.5*Math.cos(Math.atan2(my,mx) - phi);
  }

  // Pointer steers the raking light
  var phase = 0, phaseTarget = null, pointerOn = false;
  function onPoint(x) { pointerOn = true; phaseTarget = (x/W)*Math.PI*2; }
  window.addEventListener('pointerdown', function(e){ onPoint(e.clientX); });
  window.addEventListener('pointermove', function(e){ if (pointerOn) onPoint(e.clientX); });
  window.addEventListener('pointerup', function(){ pointerOn = false; });
  window.addEventListener('pointercancel', function(){ pointerOn = false; });

  function grid() {
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    var g = 34;
    for (var x = g/2; x < W; x += g)
      for (var y = g/2; y < H; y += g) {
        ctx.beginPath(); ctx.arc(x, y, 1, 0, 7); ctx.fill();
      }
  }

  // Pulse position along perimeter A->B->C->A, s in [0,1)
  function perim(s) {
    var side = Math.floor(s*3)%3, f = s*3 - Math.floor(s*3);
    if (side === 0) return lerpP(P.A, P.B, f);
    if (side === 1) return lerpP(P.B, P.C, f);
    return lerpP(P.C, P.A, f);
  }

  function draw(t) {
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    grid();

    var wt = (t % T) / T; // 0..1 loop phase
    // light phase: full orbit per loop + pointer steering (eases back to keep loop seamless)
    if (pointerOn && phaseTarget !== null) phase += (phaseTarget - phase)*0.08;
    else { var home = Math.round(phase/(Math.PI*2))*Math.PI*2; phase += (home-phase)*0.04; }
    var phi = wt*Math.PI*2 + phase;

    var breathe = 1 + 0.015*Math.sin(wt*Math.PI*2);
    ctx.save();
    ctx.translate(P.cx, P.cy); ctx.scale(breathe, breathe); ctx.translate(-P.cx, -P.cy);

    var A=P.A, B=P.B, C=P.C, w=P.w;
    var k1 = faceKOf(A,B,phi), k2 = faceKOf(B,C,phi), k3 = faceKOf(C,A,phi);
    // Impossible cycle: s1>s3 at A, s2>s1 at B, s3>s2 at C
    beam(A, B, w, k1);            // s1
    beam(B, C, w, k2);            // s2
    beam(C, A, w, k3);            // s3
    beam(A, lerpP(A,B,0.25), w, k1); // patch: s1 over s3 at A

    // Traveler pulse — energy striding the impossible loop forever
    var pp = perim(wt);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var pr = w*1.15;
    ctx.fillStyle = 'rgba(232,163,61,0.20)';
    ctx.beginPath(); ctx.arc(pp.x, pp.y, pr, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(232,163,61,0.55)';
    ctx.beginPath(); ctx.arc(pp.x, pp.y, pr*0.45, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff3dd';
    ctx.beginPath(); ctx.arc(pp.x, pp.y, pr*0.18, 0, 7); ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  var t0 = performance.now()/1000;
  function frame() {
    var t = performance.now()/1000 - t0;
    draw(t);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  frame();
})();
</script>
</body>
</html>
