<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summit Loop</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #FF9E5E; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32), fixed seed: all load-time layout derives from it.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(46255);

  var LOOP = 60;          // seconds, seamless
  var PREROLL = 24;       // fixed first-frame phase: bands mid-drift, bird mid-crossing
  var TILE = 1600;        // ridge tile width (px at design scale), ridges are periodic in it

  // Four bands, far to near. Ridge = sum of two sines with integer cycles per tile,
  // so the ridge is periodic in TILE by construction and wraps exactly.
  // cycles = whole ridge tiles travelled per 60 s loop (integer => seamless wrap).
  function makeBand(baseFrac, ampFrac, cycles, color) {
    return {
      base: baseFrac,
      a1: ampFrac * (0.55 + rand() * 0.3),
      a2: ampFrac * (0.25 + rand() * 0.2),
      k1: 1 + Math.floor(rand() * 2),        // 1..2 cycles per tile
      k2: 3 + Math.floor(rand() * 3),        // 3..5 cycles per tile
      p1: rand() * Math.PI * 2,
      p2: rand() * Math.PI * 2,
      cycles: cycles,
      color: color
    };
  }
  var bands = [
    makeBand(0.50, 0.034, 1, '#5A3A5E'),
    makeBand(0.60, 0.044, 2, '#4A3256'),  // midpoint blend of the far and mid palette colors (see process.md)
    makeBand(0.71, 0.050, 3, '#3A2A4E'),
    makeBand(0.83, 0.040, 4, '#241B38')
  ];

  function ridgeY(band, X, h) {
    var t = (X / TILE) * Math.PI * 2;
    return band.base * h
      + band.a1 * h * Math.sin(band.k1 * t + band.p1)
      + band.a2 * h * Math.sin(band.k2 * t + band.p2);
  }

  function drawBand(band, phase, w, h) {
    var off = TILE * ((phase * band.cycles / LOOP) % 1);
    ctx.beginPath();
    ctx.moveTo(-6, h + 6);
    for (var x = -6; x <= w + 6; x += 6) {
      ctx.lineTo(x, ridgeY(band, x + off, h));
    }
    ctx.lineTo(w + 6, h + 6);
    ctx.closePath();
    ctx.fillStyle = band.color;
    ctx.fill();
  }

  // Trail: a quadratic curve across the front band, lower-left rising right.
  function trailPoint(s, w, h) {
    var x0 = 0.04 * w, y0 = 0.965 * h;
    var x1 = 0.42 * w, y1 = 0.895 * h;
    var x2 = 0.80 * w, y2 = 0.812 * h;
    var u = 1 - s;
    return {
      x: u * u * x0 + 2 * u * s * x1 + s * s * x2,
      y: u * u * y0 + 2 * u * s * y1 + s * s * y2
    };
  }

  function drawHiker(cx, groundY, H, flip) {
    // Tiny silhouetted hiker standing on the trail. H = figure height.
    var dir = flip ? -1 : 1;
    ctx.strokeStyle = '#1A1218';
    ctx.fillStyle = '#1A1218';
    ctx.lineCap = 'round';
    var hipY = groundY - H * 0.52;
    var shoulderY = groundY - H * 0.82;
    var hipX = cx, shoulderX = cx + dir * H * 0.06;
    // legs (mid-stride)
    ctx.lineWidth = Math.max(1.4, H * 0.13);
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(cx + dir * H * 0.20, groundY - H * 0.26);
    ctx.lineTo(cx + dir * H * 0.30, groundY);
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(cx - dir * H * 0.16, groundY - H * 0.30);
    ctx.lineTo(cx - dir * H * 0.24, groundY - H * 0.02);
    ctx.stroke();
    // torso
    ctx.lineWidth = Math.max(1.6, H * 0.17);
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(shoulderX, shoulderY);
    ctx.stroke();
    // arm
    ctx.lineWidth = Math.max(1.2, H * 0.11);
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY + H * 0.05);
    ctx.lineTo(shoulderX + dir * H * 0.18, hipY + H * 0.06);
    ctx.stroke();
    // backpack
    ctx.beginPath();
    ctx.arc(shoulderX - dir * H * 0.15, shoulderY + H * 0.16, H * 0.11, 0, Math.PI * 2);
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.arc(shoulderX + dir * H * 0.03, shoulderY - H * 0.14, H * 0.115, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBird(phase, w, h) {
    var block = phase % 20;            // one crossing every 20 s
    var dur = 9;                       // crossing lasts 9 s, then the sky rests
    if (block >= dur) return;
    var s = block / dur;
    // Quadratic bezier across the upper sky.
    var x0 = -0.06 * w, y0 = 0.30 * h;
    var x1 = 0.50 * w, y1 = 0.15 * h;
    var x2 = 1.06 * w, y2 = 0.27 * h;
    var u = 1 - s;
    var bx = u * u * x0 + 2 * u * s * x1 + s * s * x2;
    var by = u * u * y0 + 2 * u * s * y1 + s * s * y2;
    var dx = 2 * u * (x1 - x0) + 2 * s * (x2 - x1);
    var dy = 2 * u * (y1 - y0) + 2 * s * (y2 - y1);
    var ang = Math.atan2(dy, dx);
    var span = Math.min(w, h) * 0.055 + 8;   // wing half-span
    var flap = Math.sin(phase * Math.PI * 2 * 2.2);
    var wingY = -flap * span * 0.72;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(ang * 0.5);
    ctx.fillStyle = '#1A1218';
    // Two-triangle flapping sprite: wings beat together around a slim body.
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-span, wingY - span * 0.08);
    ctx.lineTo(-span * 0.14, span * 0.16);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(span, wingY - span * 0.08);
    ctx.lineTo(span * 0.14, span * 0.16);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(span * 0.46, 0);
    ctx.lineTo(-span * 0.30, -span * 0.10);
    ctx.lineTo(-span * 0.30, span * 0.12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawScene(phase, w, h) {
    phase = ((phase % LOOP) + LOOP) % LOOP;
    // Sky
    var sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#FF9E5E');
    sky.addColorStop(1, '#E85D75');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    // Sun: brightness pulses +/-3% on a 15 s period (divides the loop).
    var bright = 1 + 0.03 * Math.sin(phase * Math.PI * 2 / 15);
    var sunR = Math.min(w, h) * 0.062;
    var sunX = 0.72 * w, sunY = 0.24 * h;
    var halo = ctx.createRadialGradient(sunX, sunY, sunR * 0.4, sunX, sunY, sunR * 3.4);
    halo.addColorStop(0, 'rgba(255,209,102,' + (0.34 * bright).toFixed(3) + ')');
    halo.addColorStop(1, 'rgba(255,209,102,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(sunX - sunR * 3.4, sunY - sunR * 3.4, sunR * 6.8, sunR * 6.8);
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR * bright, 0, Math.PI * 2);
    ctx.fillStyle = '#FFD166';
    ctx.fill();

    // Mountain bands, far to near.
    for (var i = 0; i < bands.length; i++) {
      drawBand(bands[i], phase, w, h);
    }

    // Trail on the front band, with two hikers.
    ctx.beginPath();
    for (var s = 0; s <= 1.0001; s += 0.02) {
      var p = trailPoint(Math.min(s, 1), w, h);
      if (s === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = 'rgba(255,209,102,0.5)';
    ctx.lineWidth = Math.max(1.5, h * 0.0035);
    ctx.lineCap = 'round';
    ctx.stroke();

    var hikerH = h * 0.045;
    var hp1 = trailPoint(0.38, w, h);
    var hp2 = trailPoint(0.47, w, h);
    drawHiker(hp1.x, hp1.y, hikerH, false);
    drawHiker(hp2.x, hp2.y, hikerH, false);

    // Bird (drawn last, against the sky and far bands).
    drawBird(phase, w, h);
  }

  function draw(phase, w, h) {
    drawScene(phase, w, h);
    // Loop-boundary crossfade over the last 0.5 s, per the prompt's technical note:
    // blend the opening phase in over the closing phase.
    var p = ((phase % LOOP) + LOOP) % LOOP;
    if (p > LOOP - 0.5) {
      ctx.save();
      ctx.globalAlpha = (p - (LOOP - 0.5)) / 0.5;
      drawScene(p - (LOOP - 0.5), w, h);
      ctx.restore();
    }
  }

  var W = 0, H = 0;
  function resize() {
    var vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    // Phone detection per house rules (full-bleed composition: recorded, layout unchanged).
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    var isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
    canvas.__phone = isPhone;
    canvas.width = W;
    canvas.height = H;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  function frame(now) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    draw(now, W, H);
  }

  // Synchronous first frame at the constant pre-roll phase.
  frame(PREROLL);

  if (typeof requestAnimationFrame === 'function') {
    var startStamp = null;
    var tick = function (ts) {
      if (startStamp === null) startStamp = ts;
      frame(PREROLL + (ts - startStamp) / 1000);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
