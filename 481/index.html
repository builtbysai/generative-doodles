<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Wall</title>
<style>
  html, body { margin: 0; padding: 0; background: #E3A92C; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var MUSTARD = '#E3A92C';
  var TEAL = '#14453F';
  var RUST = '#C33E21';
  var CREAM = '#F4EBD3';

  // Seeded RNG (mulberry32, fixed seed)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 720, H = 720;
  var isPhone = false;
  var lastT = 5;

  function detectPhone() {
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr && scr.width && scr.height) {
      return Math.min(scr.width, scr.height) < 700;
    }
    // aspect fallback only, when screen size is unavailable
    return H > W * 1.15;
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var nw, nh;
    if (vv && vv.width && vv.height) {
      nw = Math.floor(vv.width); nh = Math.floor(vv.height);
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      nw = Math.floor(window.innerWidth); nh = Math.floor(window.innerHeight);
    } else {
      nw = W; nh = H;
    }
    if (nw > 0 && nh > 0) { W = nw; H = nh; }
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    isPhone = detectPhone();
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }

  // ---- Seeded panel composer ---------------------------------------------
  // Nine descriptors are precomputed from one seeded stream; the grid uses
  // as many as its column/row count needs. The first four types are all
  // distinct, so every wall contains figure, botanical, lettering and
  // pattern panels at least once.
  var TYPES = ['figure', 'botanical', 'lettering', 'pattern'];
  var panels = (function () {
    var rng = mulberry32(481058);
    var order = TYPES.slice();
    // seeded shuffle of the guaranteed four
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    var list = [];
    for (var k = 0; k < 9; k++) {
      var type = k < 4 ? order[k] : TYPES[Math.floor(rng() * 4)];
      var bgPick = rng();
      var bg = bgPick < 0.52 ? CREAM : (bgPick < 0.74 ? TEAL : (bgPick < 0.88 ? MUSTARD : RUST));
      list.push({
        type: type,
        bg: bg,
        seedA: 1000 + Math.floor(rng() * 900000),
        seedB: 1000 + Math.floor(rng() * 900000)
      });
    }
    return list;
  })();

  function contrastFor(bg) {
    if (bg === TEAL) return [CREAM, MUSTARD, RUST, CREAM];
    if (bg === RUST) return [CREAM, TEAL, MUSTARD, CREAM];
    if (bg === MUSTARD) return [TEAL, RUST, CREAM, TEAL];
    return [TEAL, RUST, MUSTARD, TEAL]; // cream ground
  }

  // ---- Small drawing helpers (flat fills / strokes only) ------------------
  function rect(x, y, w, h, col) {
    ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
  }
  function disc(x, y, r, col) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  function poly(points, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath(); ctx.fill();
  }
  function stroke(points, col, lw, close) {
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    if (close) ctx.closePath();
    ctx.stroke();
  }

  // ---- Botanical library ---------------------------------------------------
  function coral(x, y, angle, len, depth, col, lw) {
    if (depth <= 0 || len < 4) return;
    var x2 = x + Math.cos(angle) * len;
    var y2 = y + Math.sin(angle) * len;
    stroke([[x, y], [x2, y2]], col, Math.max(1.5, lw));
    coral(x2, y2, angle - 0.42, len * 0.72, depth - 1, col, lw * 0.75);
    coral(x2, y2, angle + 0.38, len * 0.68, depth - 1, col, lw * 0.75);
  }
  function leaf(cx, cy, len, wid, angle, fillCol, veinCol) {
    var dx = Math.cos(angle), dy = Math.sin(angle);
    var px = -dy, py = dx;
    var tipX = cx + dx * len, tipY = cy + dy * len;
    var mX = cx + dx * len * 0.5, mY = cy + dy * len * 0.5;
    ctx.fillStyle = fillCol;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.bezierCurveTo(mX + px * wid, mY + py * wid, tipX + px * wid * 0.2, tipY + py * wid * 0.2, tipX, tipY);
    ctx.bezierCurveTo(tipX - px * wid * 0.2, tipY - py * wid * 0.2, mX - px * wid, mY - py * wid, cx, cy);
    ctx.fill();
    stroke([[cx, cy], [tipX, tipY]], veinCol, Math.max(1.2, wid * 0.14));
  }
  function sun(cx, cy, r, col, rayCol) {
    disc(cx, cy, r, col);
    for (var i = 0; i < 8; i++) {
      var a = (i / 8) * Math.PI * 2;
      stroke([
        [cx + Math.cos(a) * r * 1.25, cy + Math.sin(a) * r * 1.25],
        [cx + Math.cos(a) * r * 1.8, cy + Math.sin(a) * r * 1.8]
      ], rayCol, Math.max(2, r * 0.16));
    }
  }

  // ---- Panel type: figure --------------------------------------------------
  function drawFigure(x, y, w, h, seed, cols) {
    var rng = mulberry32(seed);
    var cx = x + w * 0.5, base = y + h * 0.88;
    var u = Math.min(w, h);
    var bodyCol = cols[0], skinCol = cols[2] === cols[0] ? cols[1] : cols[2];
    var objKind = Math.floor(rng() * 4);
    var lean = (rng() - 0.5) * u * 0.06;
    // ground line
    rect(x + w * 0.14, base, w * 0.72, Math.max(2, u * 0.025), cols[1]);
    // legs
    var hipY = base - u * 0.34;
    stroke([[cx - u * 0.05, hipY], [cx - u * 0.13, base]], bodyCol, u * 0.075);
    stroke([[cx + u * 0.05, hipY], [cx + u * 0.15, base]], bodyCol, u * 0.075);
    // torso
    poly([
      [cx - u * 0.17 + lean, hipY - u * 0.3], [cx + u * 0.17 + lean, hipY - u * 0.3],
      [cx + u * 0.11, hipY + u * 0.02], [cx - u * 0.11, hipY + u * 0.02]
    ], bodyCol);
    // head and cap
    var headY = hipY - u * 0.42;
    disc(cx + lean, headY, u * 0.105, skinCol);
    rect(cx + lean - u * 0.13, headY - u * 0.15, u * 0.26, u * 0.06, cols[1]);
    // arms reaching to the held object
    var handX = cx + u * 0.34, handY = hipY - u * 0.18;
    stroke([[cx + u * 0.12 + lean, hipY - u * 0.26], [handX, handY]], bodyCol, u * 0.06);
    stroke([[cx - u * 0.12 + lean, hipY - u * 0.22], [cx - u * 0.3, hipY - u * 0.02]], bodyCol, u * 0.06);
    // held object, one idea only
    if (objKind === 0) { sun(handX, handY - u * 0.06, u * 0.09, cols[1], cols[0]); }
    else if (objKind === 1) { rect(handX - u * 0.08, handY - u * 0.14, u * 0.16, u * 0.2, cols[1]); rect(handX - u * 0.08, handY - u * 0.14, u * 0.16, u * 0.045, cols[0]); }
    else if (objKind === 2) { poly([[handX, handY - u * 0.17], [handX + u * 0.18, handY - u * 0.1], [handX, handY - u * 0.03]], cols[1]); rect(handX - u * 0.015, handY - u * 0.18, u * 0.03, u * 0.22, cols[0]); }
    else { disc(handX, handY - u * 0.05, u * 0.1, cols[1]); rect(handX - u * 0.1, handY - u * 0.17, u * 0.2, u * 0.04, cols[0]); }
  }

  // ---- Panel type: botanical ----------------------------------------------
  function drawBotanical(x, y, w, h, seed, cols) {
    var rng = mulberry32(seed);
    var kind = Math.floor(rng() * 3);
    var u = Math.min(w, h);
    var cx = x + w * 0.5;
    if (kind === 0) {
      // coral: recursive branches rising from a base pot
      rect(cx - u * 0.14, y + h * 0.82, u * 0.28, u * 0.1, cols[1]);
      var coralLen = Math.min(w * 0.32, h * 0.23);
      coral(cx, y + h * 0.84, -Math.PI / 2, coralLen, 5, cols[0], u * 0.045);
      coral(cx - u * 0.08, y + h * 0.84, -Math.PI / 2 - 0.35, coralLen * 0.7, 4, cols[1], u * 0.035);
      coral(cx + u * 0.08, y + h * 0.84, -Math.PI / 2 + 0.35, coralLen * 0.7, 4, cols[1], u * 0.035);
    } else if (kind === 1) {
      // veined leaves on a stem
      var baseY = y + h * 0.9;
      stroke([[cx, baseY], [cx, y + h * 0.18]], cols[0], u * 0.035);
      leaf(cx, baseY - u * 0.12, u * 0.34, u * 0.11, -Math.PI / 2 - 0.65, cols[0], cols[3]);
      leaf(cx, baseY - u * 0.3, u * 0.34, u * 0.11, -Math.PI / 2 + 0.65, cols[1], cols[3]);
      leaf(cx, baseY - u * 0.48, u * 0.3, u * 0.1, -Math.PI / 2 - 0.5, cols[1], cols[3]);
      leaf(cx, baseY - u * 0.62, u * 0.28, u * 0.09, -Math.PI / 2 + 0.45, cols[0], cols[3]);
    } else {
      // sun disc over small leaves
      sun(cx, y + h * 0.36, u * 0.17, cols[1], cols[0]);
      leaf(x + w * 0.22, y + h * 0.86, u * 0.26, u * 0.09, -Math.PI / 2 - 0.4, cols[0], cols[3]);
      leaf(x + w * 0.78, y + h * 0.86, u * 0.26, u * 0.09, -Math.PI / 2 + 0.4, cols[0], cols[3]);
      rect(x + w * 0.16, y + h * 0.88, w * 0.68, Math.max(2, u * 0.025), cols[1]);
    }
  }

  // ---- Panel type: lettering (glyph-like marks, never real words) ---------
  function glyphMark(cx, cy, s, kind, col) {
    var lw = s * 0.2;
    if (kind === 0) { // vertical with two cross bars
      rect(cx - lw / 2, cy - s / 2, lw, s, col);
      rect(cx - s * 0.34, cy - s * 0.32, s * 0.68, lw * 0.8, col);
      rect(cx - s * 0.28, cy + s * 0.05, s * 0.56, lw * 0.8, col);
    } else if (kind === 1) { // ring with stem
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(cx, cy - s * 0.08, s * 0.26, 0, Math.PI * 2); ctx.stroke();
      rect(cx - lw / 2, cy + s * 0.14, lw, s * 0.36, col);
    } else if (kind === 2) { // roof / caret over a bar
      poly([[cx - s * 0.36, cy + s * 0.02], [cx, cy - s * 0.36], [cx + s * 0.36, cy + s * 0.02], [cx + s * 0.2, cy + s * 0.02], [cx, cy - s * 0.16], [cx - s * 0.2, cy + s * 0.02]], col);
      rect(cx - s * 0.34, cy + s * 0.28, s * 0.68, lw * 0.85, col);
    } else if (kind === 3) { // zigzag mark
      stroke([[cx - s * 0.36, cy - s * 0.24], [cx - s * 0.12, cy + s * 0.18], [cx + s * 0.12, cy - s * 0.24], [cx + s * 0.36, cy + s * 0.18]], col, lw);
    } else if (kind === 4) { // stepped mark
      rect(cx - s * 0.36, cy - s * 0.36, s * 0.34, lw, col);
      rect(cx - s * 0.36, cy - s * 0.36, lw, s * 0.5, col);
      rect(cx - s * 0.05, cy - s * 0.05, s * 0.4, lw, col);
      rect(cx + s * 0.2, cy - s * 0.05, lw, s * 0.42, col);
    } else { // disc and post
      disc(cx, cy - s * 0.16, s * 0.17, col);
      rect(cx - lw / 2, cy + s * 0.08, lw, s * 0.3, col);
      rect(cx - s * 0.3, cy + s * 0.34, s * 0.6, lw * 0.8, col);
    }
  }
  function drawLettering(x, y, w, h, seed, cols) {
    var rng = mulberry32(seed);
    var colsN, rowsN;
    if (w < h * 0.75) { colsN = 2; rowsN = 3; }
    else if (h > w * 1.15) { colsN = 3; rowsN = 3; }
    else { colsN = 3; rowsN = 2; }
    var cw = w / colsN, ch = h / rowsN;
    for (var r = 0; r < rowsN; r++) {
      for (var c = 0; c < colsN; c++) {
        var kind = Math.floor(rng() * 6);
        var col = cols[Math.floor(rng() * 3)];
        glyphMark(x + cw * (c + 0.5), y + ch * (r + 0.5), Math.min(cw, ch) * 0.64, kind, col);
      }
    }
  }

  // ---- Panel type: pattern --------------------------------------------------
  function drawPattern(x, y, w, h, seed, cols, blend) {
    var rng = mulberry32(seed);
    var kind = Math.floor(rng() * 3);
    var u = Math.min(w, h);
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    if (kind === 0) { // chevrons, phase shifted by the crossfade blend
      var rowH = u * 0.16, shift = blend * rowH;
      var n = Math.ceil(h / rowH) + 2;
      for (var r = 0; r < n; r++) {
        var yy = y - rowH + r * rowH + shift;
        var pts = [];
        var steps = 6;
        for (var s = 0; s <= steps; s++) {
          pts.push([x + (w / steps) * s, yy + ((s % 2 === 0) ? 0 : rowH * 0.55)]);
        }
        stroke(pts, cols[r % 3], u * 0.035);
      }
    } else if (kind === 1) { // zigzag bands
      var bandH = u * 0.18, off = blend * bandH;
      var m = Math.ceil(h / bandH) + 2;
      for (var b = 0; b < m; b++) {
        var y0 = y - bandH + b * bandH + off;
        var p = [];
        var seg = 5;
        for (var q = 0; q <= seg * 2; q++) {
          p.push([x + (w / (seg * 2)) * q, y0 + ((q % 2 === 0) ? 0 : bandH * 0.6)]);
        }
        stroke(p, cols[b % 3], u * 0.05);
        disc(x + w * 0.5, y0 + bandH * 0.95, u * 0.028, cols[(b + 1) % 3]);
      }
    } else { // dot rows
      var gap = u * 0.17;
      var dxOff = blend * gap;
      var rows = Math.floor(h / gap);
      var colCount = Math.floor(w / gap);
      for (var rr = 0; rr < rows; rr++) {
        for (var cc = 0; cc < colCount; cc++) {
          var cxp = x + gap * (cc + 0.5) + ((rr % 2 === 0) ? dxOff * 0.5 : -dxOff * 0.5);
          var cyp = y + gap * (rr + 0.5);
          disc(cxp, cyp, u * 0.045, cols[(rr + cc) % 3]);
        }
      }
    }
    ctx.restore();
  }

  function drawMotif(panel, x, y, w, h, seed, blend) {
    var cols = contrastFor(panel.bg);
    if (panel.type === 'figure') drawFigure(x, y, w, h, seed, cols);
    else if (panel.type === 'botanical') drawBotanical(x, y, w, h, seed, cols);
    else if (panel.type === 'lettering') drawLettering(x, y, w, h, seed, cols);
    else drawPattern(x, y, w, h, seed, cols, blend);
  }

  // ---- Main draw -------------------------------------------------------------
  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // ground: mustard everywhere, page ground matches
    rect(0, 0, W, H, MUSTARD);

    var aspect = W / Math.max(1, H);
    var colsN, rowsN;
    if (aspect > 1.25) { colsN = 4; rowsN = 2; }
    else if (aspect < 0.8) { colsN = 3; rowsN = 3; }
    else { colsN = 3; rowsN = 3; }
    if (isPhone && aspect >= 0.8 && aspect <= 1.25) { colsN = 3; rowsN = 3; }

    var gx = Math.round(W * 0.03);          // 3% horizontal gutter
    var gy = Math.round(H * 0.03);          // 3% vertical gutter
    var pw = (W - gx * (colsN + 1)) / colsN;
    var ph = (H - gy * (rowsN + 1)) / rowsN;

    // flat border strips, full bleed, centred in the row gutters
    for (var gr = 1; gr < rowsN; gr++) {
      var stripY = gy * gr + ph * gr + (gy - Math.max(3, gy * 0.38)) / 2;
      rect(0, stripY, W, Math.max(3, gy * 0.38), TEAL);
    }

    // deterministic crossfade on the 12s loop: a cosine blend sharpened
    // with a smoothstep so each variant dwells near full strength and the
    // fixed t = 5s first frame shows one motif cleanly (weightB about 0.99)
    var phase = (((t % 12) + 12) % 12) / 12;
    var rawA = 0.5 + 0.5 * Math.cos(phase * Math.PI * 2);
    var weightA = rawA * rawA * (3 - 2 * rawA);
    var weightB = 1 - weightA;

    var idx = 0;
    for (var r = 0; r < rowsN; r++) {
      for (var c = 0; c < colsN; c++) {
        var panel = panels[idx % panels.length]; idx++;
        var x = gx + c * (pw + gx);
        var y = gy + r * (ph + gy);
        // panel ground
        rect(x, y, pw, ph, panel.bg);
        // motifs: two seeded variants, alpha crossfaded
        var pad = Math.min(pw, ph) * 0.09;
        ctx.save();
        ctx.beginPath(); ctx.rect(x + 2, y + 2, pw - 4, ph - 4); ctx.clip();
        ctx.globalAlpha = weightA;
        drawMotif(panel, x + pad, y + pad, pw - pad * 2, ph - pad * 2, panel.seedA, phase);
        ctx.globalAlpha = weightB;
        drawMotif(panel, x + pad, y + pad, pw - pad * 2, ph - pad * 2, panel.seedB, phase);
        ctx.restore();
        ctx.globalAlpha = 1;
        // hard frame on top
        ctx.strokeStyle = TEAL;
        ctx.lineWidth = Math.max(3, Math.min(pw, ph) * 0.022);
        ctx.strokeRect(x, y, pw, ph);
      }
    }
  }

  resize();
  // Deterministic first frame: constant loop phase, t = 5s.
  draw(5);

  // Watch-only loop. rAF is guarded so headless renderers (no rAF) stop
  // after the synchronous first frame above.
  if (typeof requestAnimationFrame === 'function') {
    var startStamp = null;
    var frame = function (ts) {
      if (startStamp === null) startStamp = ts;
      var elapsed = (ts - startStamp) / 1000;
      draw(5 + elapsed);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
