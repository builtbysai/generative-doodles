<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Red Ghost</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141210; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), deterministic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1281);

  // Palette: grayscale archival scene plus the single red.
  var PAPER = '#DCD6C8', LIGHT = '#B9B4AC', MID = '#7A766E',
      CHAR = '#3A3835', INK = '#141210',
      RED = '#E63B1F', EMBER = '#E87E1F';

  var W = 1200, H = 750; // design space, wide horizontal
  var vw = 0, vh = 0, scale = 1, ox = 0, oy = 0;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
    return vh > vw * 1.15;
  }

  function size() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if (!w) { w = window.innerWidth; h = window.innerHeight; }
    vw = w; vh = h;
    canvas.width = Math.round(w); canvas.height = Math.round(h);
    scale = Math.max(vw / W, vh / H);
    ox = (vw - W * scale) / 2; oy = (vh - H * scale) / 2;
    // Portrait phones crop hard under cover scaling; anchor the frame so the
    // ghost's frame-one position stays on screen instead of off the left edge.
    if (vh > vw) { ox = 0.22 * vw - 200 * scale; }
  }

  // --- Scene data, seeded once ---
  var washes = [];
  for (var i = 0; i < 14; i++) {
    washes.push({ x: rnd() * W, y: 120 + rnd() * 560, rx: 90 + rnd() * 220, ry: 30 + rnd() * 90, a: 0.05 + rnd() * 0.10, g: rnd() < 0.5 ? LIGHT : MID });
  }
  var workers = [
    { x: 210, y: 560, s: 1.00, lean: 0.42 },
    { x: 430, y: 610, s: 1.12, lean: 0.50 },
    { x: 660, y: 570, s: 0.94, lean: 0.38 },
    { x: 880, y: 620, s: 1.06, lean: 0.46 },
    { x: 1040, y: 565, s: 0.90, lean: 0.40 }
  ];
  var cropRows = [];
  for (var r = 0; r < 9; r++) {
    var y = 470 + r * 30 + (rnd() - 0.5) * 8;
    var tufts = [];
    for (var k = 0; k < 26; k++) tufts.push(30 + k * 45 + (rnd() - 0.5) * 22);
    cropRows.push({ y: y, tufts: tufts, a: 0.25 + rnd() * 0.2 });
  }
  var hatch = [];
  for (var h2 = 0; h2 < 90; h2++) {
    hatch.push({ x: rnd() * W, y: 120 + rnd() * 560, len: 14 + rnd() * 40, ang: (rnd() - 0.5) * 0.9 });
  }
  // Ghost path: diagonal lower-left to upper-right, looping.
  // x0 kept clear of the left edge so the ghost is never cropped at frame one.
  var GHOST = { x0: 200, y0: 640, x1: 1110, y1: 150 };

  // Drag state: closed-form over recorded events.
  var drags = []; // {x, y, t, up}
  var dragging = false, dragStart = null, dragCur = null, dragEnd = null;

  function pos(e) {
    var rect = { left: 0, top: 0 };
    if (canvas.getBoundingClientRect) { try { rect = canvas.getBoundingClientRect(); } catch (err) {} }
    var cx = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX)) - rect.left;
    var cy = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY)) - rect.top;
    return { x: cx, y: cy };
  }
  // Convert screen point to design space (inverse of the scene transform, ignoring tilt).
  function toDesign(p) {
    return { x: (p.x - ox) / scale, y: (p.y - oy) / scale };
  }
  function ghostPos(t) {
    var cyc = 40; // seconds for one diagonal crossing
    var s = ((t % cyc) + cyc) % cyc / cyc;
    var bob = Math.sin(t * Math.PI * 2 * 1.4) * 6;
    return {
      x: GHOST.x0 + (GHOST.x1 - GHOST.x0) * s,
      y: GHOST.y0 + (GHOST.y1 - GHOST.y0) * s + bob
    };
  }
  function ghostScreen(t) {
    var g = ghostPos(t);
    return { x: ox + g.x * scale, y: oy + g.y * scale };
  }
  function dist(a, b) {
    var dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e), t = nowT;
    var g = ghostScreen(t);
    if (dist(p, g) < 110 * scale) {
      dragging = true; dragStart = p; dragCur = p;
      drags.push({ x: p.x, y: p.y, t: t, up: false });
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    dragCur = pos(e);
    drags.push({ x: dragCur.x, y: dragCur.y, t: nowT, up: false });
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false; dragEnd = { p: dragCur || dragStart, t: nowT };
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // Quantized jitter: 8fps step, 1-2px displacement, deterministic per step.
  function stepHash(step) {
    var n = (step * 2654435761) % 4294967296;
    n = (n ^ (n >>> 13)) >>> 0;
    return n / 4294967296;
  }
  function jitter(t) {
    var step = Math.floor(t * 8);
    var a = stepHash(step), b = stepHash(step + 7919);
    return { x: (a - 0.5) * 3, y: (b - 0.5) * 3 };
  }

  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function worker(x, y, s, lean) {
    // Bent fieldworker: head down, torso leaning, arms reaching to crops.
    var u = 62 * s;
    ctx.fillStyle = CHAR;
    ctx.beginPath();
    ctx.moveTo(x - 14 * s, y);
    ctx.lineTo(x - 10 * s, y - u * 0.62);
    ctx.lineTo(x + 8 * s, y - u * 0.62);
    ctx.lineTo(x + 12 * s, y);
    ctx.closePath(); ctx.fill();
    // leaning torso
    ctx.save();
    ctx.translate(x, y - u * 0.62);
    ctx.rotate(lean);
    ctx.fillStyle = MID;
    ctx.fillRect(-11 * s, -u * 0.55, 22 * s, u * 0.55);
    // head
    ctx.fillStyle = CHAR;
    ctx.beginPath(); ctx.moveTo(16 * s, -u * 0.55); ctx.arc(16 * s, -u * 0.55, 11 * s, 0, Math.PI * 2); ctx.fill();
    // arms reaching down-forward
    ctx.strokeStyle = CHAR; ctx.lineWidth = 5 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(6 * s, -u * 0.45); ctx.lineTo(34 * s, -u * 0.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2 * s, -u * 0.40); ctx.lineTo(28 * s, 0); ctx.stroke();
    ctx.restore();
    // legs
    ctx.strokeStyle = CHAR; ctx.lineWidth = 6 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 6 * s, y); ctx.lineTo(x - 10 * s, y + 26 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 6 * s, y); ctx.lineTo(x + 12 * s, y + 26 * s); ctx.stroke();
  }

  function ghostFigure(x, y, s, alpha, pulse) {
    // Striding figure, larger than the workers, semi-transparent, glowing.
    var u = 150 * s;
    // Glow: layered flat-alpha silhouettes, no gradients.
    var glows = [[2.4, 0.05], [1.8, 0.08], [1.35, 0.12]];
    for (var gi = 0; gi < glows.length; gi++) {
      var gs = glows[gi][0], ga = glows[gi][1] * pulse;
      ctx.globalAlpha = ga * alpha;
      ctx.fillStyle = RED;
      ctx.beginPath();
      ctx.moveTo(x - 26 * s * gs, y);
      ctx.lineTo(x - 18 * s * gs, y - u * 0.6);
      ctx.lineTo(x + 18 * s * gs, y - u * 0.6);
      ctx.lineTo(x + 26 * s * gs, y);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 30 * s * gs, y - u * 0.6); ctx.arc(x + 30 * s * gs, y - u * 0.6, 22 * s * gs, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 0.85 * alpha * pulse;
    ctx.fillStyle = RED;
    ctx.beginPath();
    ctx.moveTo(x - 22 * s, y);
    ctx.lineTo(x - 15 * s, y - u * 0.62);
    ctx.lineTo(x + 15 * s, y - u * 0.62);
    ctx.lineTo(x + 22 * s, y);
    ctx.closePath(); ctx.fill();
    // torso leaning into the stride
    ctx.save();
    ctx.translate(x, y - u * 0.62);
    ctx.rotate(0.28);
    ctx.fillRect(-13 * s, -u * 0.55, 26 * s, u * 0.55);
    ctx.beginPath(); ctx.moveTo(18 * s, -u * 0.55); ctx.arc(18 * s, -u * 0.55, 15 * s, 0, Math.PI * 2); ctx.fill();
    // striding limbs
    ctx.strokeStyle = RED; ctx.lineWidth = 7 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(4 * s, -u * 0.45); ctx.lineTo(44 * s, -u * 0.15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2 * s, -u * 0.40); ctx.lineTo(-30 * s, -u * 0.05); ctx.stroke();
    ctx.restore();
    // legs mid-stride
    ctx.strokeStyle = RED; ctx.lineWidth = 8 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 8 * s, y); ctx.lineTo(x - 34 * s, y + 34 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 8 * s, y); ctx.lineTo(x + 36 * s, y + 30 * s); ctx.stroke();
    // ember core dashes
    ctx.globalAlpha = 0.9 * alpha * pulse;
    ctx.fillStyle = EMBER;
    ctx.fillRect(x - 3 * s, y - u * 0.95, 6 * s, 14 * s);
    ctx.fillRect(x - 10 * s, y - u * 0.55, 20 * s, 3 * s);
    ctx.globalAlpha = 1;
  }

  var nowT = 0;

  function draw(t) {
    nowT = t;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, vw, vh);
    var j = jitter(t);
    ctx.save();
    ctx.translate(ox + j.x * scale, oy + j.y * scale);
    ctx.scale(scale, scale);
    // Archival photograph, a little askew.
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-0.021);
    ctx.translate(-W / 2, -H / 2);
    // Paper
    ctx.fillStyle = PAPER;
    ctx.fillRect(-40, -40, W + 80, H + 80);
    // Sky wash
    ctx.fillStyle = LIGHT;
    ctx.globalAlpha = 0.35;
    ctx.fillRect(-40, -40, W + 80, 260);
    ctx.globalAlpha = 1;
    // Loose graphite washes
    for (var i = 0; i < washes.length; i++) {
      var ws = washes[i];
      ctx.globalAlpha = ws.a;
      ctx.fillStyle = ws.g;
      ctx.beginPath();
      ctx.moveTo(ws.x + ws.rx, ws.y);
      ctx.ellipse(ws.x, ws.y, ws.rx, ws.ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Distant field band
    ctx.fillStyle = MID;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(-40, 400, W + 80, 90);
    ctx.globalAlpha = 1;
    // Crop rows with tufts
    for (var r = 0; r < cropRows.length; r++) {
      var row = cropRows[r];
      ctx.strokeStyle = CHAR; ctx.globalAlpha = row.a; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, row.y); ctx.lineTo(W, row.y + 8); ctx.stroke();
      ctx.globalAlpha = row.a + 0.15;
      for (var k = 0; k < row.tufts.length; k++) {
        var tx = row.tufts[k];
        ctx.beginPath(); ctx.moveTo(tx, row.y); ctx.lineTo(tx - 3, row.y - 12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tx + 4, row.y); ctx.lineTo(tx + 7, row.y - 10); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    // Agitated graphite hatch marks
    ctx.strokeStyle = CHAR; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.4;
    for (var h3 = 0; h3 < hatch.length; h3++) {
      var hh = hatch[h3];
      ctx.beginPath();
      ctx.moveTo(hh.x, hh.y);
      ctx.lineTo(hh.x + Math.cos(hh.ang) * hh.len, hh.y + Math.sin(hh.ang) * hh.len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // Workers
    for (var w2 = 0; w2 < workers.length; w2++) {
      worker(workers[w2].x, workers[w2].y, workers[w2].s, workers[w2].lean);
    }
    // Ghost: path position, drag resistance, elastic return.
    var g = ghostPos(t);
    var gx = g.x, gy = g.y;
    var trail = [];
    if (dragging && dragStart && dragCur) {
      var dx = (dragCur.x - dragStart.x) / scale;
      var dy = (dragCur.y - dragStart.y) / scale;
      gx += dx * 0.35; gy += dy * 0.35;
      trail.push({ x: g.x, y: g.y, ex: gx, ey: gy });
    } else if (dragEnd) {
      var dt = t - dragEnd.t;
      var dec = Math.exp(-dt / 0.9);
      var ddx = (dragEnd.p.x - dragStart.x) / scale * 0.35 * dec;
      var ddy = (dragEnd.p.y - dragStart.y) / scale * 0.35 * dec;
      gx += ddx; gy += ddy;
      if (dec > 0.02) trail.push({ x: g.x, y: g.y, ex: gx, ey: gy });
    }
    // Ember streaks along the drag vector.
    if (trail.length) {
      var tr = trail[0];
      ctx.strokeStyle = EMBER; ctx.globalAlpha = 0.7; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (var s2 = 0; s2 < 5; s2++) {
        var f = 0.25 + s2 * 0.18;
        ctx.beginPath();
        ctx.moveTo(tr.x + (tr.ex - tr.x) * f, tr.y + (tr.ey - tr.y) * f - 10);
        ctx.lineTo(tr.x + (tr.ex - tr.x) * f + 18, tr.y + (tr.ey - tr.y) * f - 16);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    // Ghost pulse: slow breathing of red intensity.
    var pulse = 0.72 + 0.28 * Math.sin(t * Math.PI * 2 / 5);
    ghostFigure(gx, gy, 1.35, 1, pulse);
    ctx.restore(); // un-tilt
    ctx.restore();
    // Pin canvas size in draw (phone rule).
    canvas.style.width = Math.round(vw) + 'px';
    canvas.style.height = Math.round(vh) + 'px';
  }

  // Boot flag: frame one draws at exactly t = 0; the clock starts with the rAF loop.
  size();
  draw(0);

  var rafStart = null;
  function loop(ts) {
    if (rafStart === null) rafStart = ts;
    var t = (ts - rafStart) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

  function onResize() { size(); draw(0); }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', onResize);
  }
})();
</script>
</body>
</html>
