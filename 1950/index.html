<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1950 The Face as Light Event</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0806; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // The Face as Light Event, LR7 / PP1197, study #254 lucy-railton.
  // A cellist on a near-black stage, body dissolving into thick
  // amber stage smoke. Only the bow arm stays legible, moving in
  // slow arcs; the rest of her is light and haze. The smoke is
  // driven by the bow's energy: dense swirls when she digs in,
  // thinning to reveal her silhouette when she rests. The face
  // never appears; the performer is present through absence.
  // Watch only: the piece is withdrawal, and the interaction is
  // the watching.
  var STAGE = '#0a0806';   // stage black, page ground
  var STAGE2 = '#120d08';  // stage black, warm lift at the bottom
  var SMOKE = '#d98a2b';   // amber smoke, core
  var SMOKE_LT = '#e8a94a';// amber smoke, lit edge
  var SMOKE_DK = '#8a4d16';// amber smoke, deep shadow
  var SMOKE_HI = '#f2c078';// amber smoke, bright wisp
  var RIM = '#a8c8d8';     // faint cool backlight rim on the bow arm
  var RIM_DIM = '#6e8a99'; // cool rim, dimmed
  var SIL = '#171008';     // silhouette, warm near-black
  var SIL_EDGE = '#3a2412';// silhouette rim, warm ember
  var PLATE = '#e8c890';   // plate ink, warm amber
  var HINT_BG = '#f2c078'; // hint pill, bright amber

  // Fixed-phase first frame: FIRST_T = 14 s. At t = 14 the bow
  // angle crosses zero, mid-arc, the drone swell sits at 0.71
  // energy, so the smoke is dense but the silhouette is still
  // partly visible at 0.57 opacity. The bow arm is sharp, the
  // face is absent, the smoke reads warm.
  var FIRST_T = 14;

  // QA probe hook: ?t=<seconds> renders at that time at load.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and particle index, so every frame is a pure
  // function of t.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function wrap(v, m) { var r = v % m; return r < 0 ? r + m : r; }

  // The bowed-tone energy envelope, a closed-form sound model:
  // one generative drone whose swells run on a 26 s cycle, plus a
  // 7 s bow-stroke tremor. Range about 0.15 to 1.0. No audio is
  // played; the visuals run on this model alone.
  function energyAt(t) {
    var e = 0.55 + 0.30 * Math.sin(2 * Math.PI * (t - 2) / 26)
          + 0.10 * Math.sin(2 * Math.PI * t / 7 + 1.0);
    return clamp(e, 0, 1);
  }
  // Smoke density follows the energy directly.
  function densityAt(t) { return energyAt(t); }
  // The silhouette is inverse to the smoke: dense smoke hides
  // her, resting smoke reveals her.
  function silhouetteAt(t) { return clamp(1 - 0.6 * densityAt(t), 0.15, 1); }
  // Bow arm angle, slow arcs on the 7 s stroke cycle. Zero at
  // t = 14, mid-arc, swinging through the middle of its travel.
  function bowAngleAt(t) { return -0.5 + 0.45 * Math.sin(2 * Math.PI * t / 7); }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The stage: near-black ground, a warm lift toward the floor,
  // and a soft amber glow behind the figure that swells with
  // the drone, so the light itself breathes.
  function drawStage(t, dens) {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, STAGE);
    grad.addColorStop(1, STAGE2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    var cx = W / 2, cy = H * 0.52;
    var glowR = Math.min(W, H) * (0.34 + 0.10 * dens);
    var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    glow.addColorStop(0, hexA(SMOKE_DK, a4(0.30 + 0.25 * dens)));
    glow.addColorStop(0.6, hexA(SMOKE_DK, a4(0.10 + 0.10 * dens)));
    glow.addColorStop(1, hexA(SMOKE_DK, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);
  }

  // Smoke: 240 seeded puffs drifting on closed-form paths, plus
  // slow swirl bands. Each puff's position is a pure function of
  // t, so the smoke is reproducible frame to frame. Alpha and
  // radius grow with density; at rest the smoke thins and the
  // figure shows through. Puffs are paired arcs with a moveTo
  // before every arc, per the node-canvas quirk.
  function drawSmoke(t, dens) {
    var i, rng;
    // Slow swirl bands, wide amber arcs turning at 0.05 rad/s,
    // under the 14 Hz ceiling.
    for (i = 0; i < 5; i++) {
      rng = mulberry32(1950 * 7 + i * 331);
      var bx = rng() * W, by = H * (0.25 + rng() * 0.5);
      var br = Math.min(W, H) * (0.22 + rng() * 0.25);
      var a0 = rng() * Math.PI * 2 + t * 0.05 * (rng() < 0.5 ? 1 : -1);
      ctx.strokeStyle = hexA((i % 2 === 0) ? SMOKE : SMOKE_LT, a4(0.07 * dens + 0.02));
      ctx.lineWidth = Math.min(W, H) * 0.035 * (0.6 + 0.4 * dens);
      ctx.beginPath();
      ctx.arc(bx, by, br, a0, a0 + Math.PI * (0.9 + rng() * 0.5));
      ctx.stroke();
    }

    // Puffs.
    var n = 280;
    for (i = 0; i < n; i++) {
      rng = mulberry32(1950 * 101 + i * 7919);
      var px0 = rng(), py0 = rng(), pr = rng(), pa = rng(), pv = rng(), ph = rng();
      var speed = 6 + pv * 14; // px per second, slow drift
      var px = wrap(px0 * (W + 240) + speed * t * (ph < 0.5 ? 1 : -1) - 120, W + 240) - 120;
      var py = wrap(py0 * (H + 200) + (4 + pv * 8) * t * (ph < 0.7 ? -1 : 1) - 100, H + 200) - 100;
      // Gentle sinusoidal wobble, 0.2 rad/s.
      px += Math.sin(t * 0.2 + ph * Math.PI * 2) * 18;
      py += Math.cos(t * 0.17 + ph * Math.PI * 2) * 12;
      var rr = (14 + pr * 60) * (0.7 + 0.6 * dens);
      var col = pa < 0.55 ? SMOKE : (pa < 0.8 ? SMOKE_LT : (pa < 0.93 ? SMOKE_DK : SMOKE_HI));
      var alpha = (0.03 + pa * 0.07) * (0.3 + 0.7 * dens);
      ctx.fillStyle = hexA(col, a4(alpha));
      ctx.beginPath(); ctx.moveTo(px + rr, py); ctx.arc(px, py, rr, 0, Math.PI * 2); ctx.fill();
      // A brighter core on the lit puffs, so the smoke has
      // depth instead of flat discs.
      if (pa < 0.25) {
        ctx.fillStyle = hexA(SMOKE_HI, a4(alpha * 0.5));
        ctx.beginPath(); ctx.moveTo(px + rr * 0.45, py); ctx.arc(px, py, rr * 0.45, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // The figure: a seated cellist, small and center frame. Head,
  // torso, cello body, all one warm near-black silhouette with a
  // faint ember rim on the lit side. No face is ever drawn, not
  // even blurred: the head is a plain dark shape. Opacity is
  // inverse to smoke density.
  function drawFigure(t, silOp) {
    var cx = W / 2, cy = H * 0.52;
    var s = Math.min(W, H) / 720; // figure scale
    var headR = 26 * s;
    var headX = cx - 6 * s, headY = cy - 118 * s;
    var shoulderY = cy - 78 * s;
    var hipY = cy + 62 * s;

    ctx.fillStyle = hexA(SIL, a4(silOp));
    ctx.strokeStyle = hexA(SIL_EDGE, a4(0.5 * silOp));
    ctx.lineWidth = 1.5 * s;

    // Head: a plain dark shape, no face.
    ctx.beginPath(); ctx.moveTo(headX + headR, headY); ctx.arc(headX, headY, headR, 0, Math.PI * 2); ctx.fill();
    // Hair falling to one side, a soft dark mass.
    ctx.beginPath(); ctx.moveTo(headX + headR * 0.9, headY - headR * 0.4);
    ctx.arc(headX + headR * 0.4, headY + headR * 0.7, headR * 0.85, -Math.PI * 0.35, Math.PI * 0.75); ctx.fill();

    // Torso: shoulders to hips, a quiet seated shape.
    ctx.beginPath();
    ctx.moveTo(cx - 34 * s, shoulderY);
    ctx.quadraticCurveTo(cx - 44 * s, cy - 10 * s, cx - 30 * s, hipY);
    ctx.lineTo(cx + 30 * s, hipY);
    ctx.quadraticCurveTo(cx + 44 * s, cy - 10 * s, cx + 34 * s, shoulderY);
    ctx.quadraticCurveTo(cx, shoulderY - 14 * s, cx - 34 * s, shoulderY);
    ctx.fill();
    ctx.stroke();

    // Cello body, leaning against her left side.
    var celloX = cx - 58 * s, celloY = cy + 6 * s;
    ctx.fillStyle = hexA(SIL, a4(silOp));
    ctx.beginPath();
    ctx.moveTo(celloX, celloY - 52 * s);
    ctx.bezierCurveTo(celloX - 34 * s, celloY - 40 * s, celloX - 36 * s, celloY + 6 * s, celloX - 22 * s, celloY + 34 * s);
    ctx.bezierCurveTo(celloX - 12 * s, celloY + 52 * s, celloX + 12 * s, celloY + 52 * s, celloX + 22 * s, celloY + 34 * s);
    ctx.bezierCurveTo(celloX + 36 * s, celloY + 6 * s, celloX + 34 * s, celloY - 40 * s, celloX, celloY - 52 * s);
    ctx.fill();
    ctx.stroke();
    // Cello neck rising toward her shoulder.
    ctx.strokeStyle = hexA(SIL_EDGE, a4(0.6 * silOp));
    ctx.lineWidth = 5 * s;
    ctx.beginPath();
    ctx.moveTo(celloX, celloY - 48 * s);
    ctx.lineTo(celloX + 14 * s, celloY - 108 * s);
    ctx.stroke();

    // Ember rim on the lit side of the torso and head, so the
    // silhouette reads as a body in warm light, not a cutout.
    ctx.strokeStyle = hexA(SMOKE_LT, a4(0.35 * silOp));
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.moveTo(cx + 34 * s, shoulderY);
    ctx.quadraticCurveTo(cx + 44 * s, cy - 10 * s, cx + 30 * s, hipY);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(headX, headY, headR, -Math.PI * 0.25, Math.PI * 0.45);
    ctx.stroke();
  }

  // The bow arm: the one sharp element. Shoulder pivot, arm
  // swinging in slow arcs on the 7 s stroke cycle, the bow a
  // thin line crossing the strings. Drawn with a cool backlight
  // rim and a warm amber edge, brighter and crisper than the
  // silhouette, so it stays legible through the smoke.
  function drawBowArm(t, silOp) {
    var cx = W / 2, cy = H * 0.52;
    var s = Math.min(W, H) / 720;
    var shoulderX = cx + 30 * s, shoulderY = cy - 72 * s;
    var ang = bowAngleAt(t);
    var armLen = 96 * s;
    var dirX = Math.cos(ang - 0.35), dirY = Math.sin(ang - 0.35);
    var handX = shoulderX + dirX * armLen;
    var handY = shoulderY + dirY * armLen + 34 * s;
    // Elbow bent off the straight shoulder-to-hand line, so the
    // arm reads as an arm, not a clock hand.
    var elbowX = shoulderX + dirX * armLen * 0.45 - dirY * 20 * s;
    var elbowY = shoulderY + dirY * armLen * 0.45 + dirX * 20 * s + 12 * s;

    // Bow: a thin line through the hand, steep across the cello,
    // clearly angled away from the arm, its tilt following the
    // same stroke cycle.
    var bowAng = 1.25 + 0.30 * Math.sin(2 * Math.PI * t / 7);
    var bowLen = 120 * s;
    var bowX1 = handX - Math.cos(bowAng) * bowLen * 0.5;
    var bowY1 = handY - Math.sin(bowAng) * bowLen * 0.5;
    var bowX2 = handX + Math.cos(bowAng) * bowLen * 0.5;
    var bowY2 = handY + Math.sin(bowAng) * bowLen * 0.5;

    // Arm, upper and forearm, cool rim on top, warm edge below.
    ctx.lineCap = 'round';
    ctx.strokeStyle = hexA(RIM, a4(0.9));
    ctx.lineWidth = 7 * s;
    ctx.beginPath(); ctx.moveTo(shoulderX, shoulderY); ctx.lineTo(elbowX, elbowY); ctx.lineTo(handX, handY); ctx.stroke();
    ctx.strokeStyle = hexA(SMOKE_LT, a4(0.55));
    ctx.lineWidth = 2.5 * s;
    ctx.beginPath(); ctx.moveTo(shoulderX, shoulderY + 3 * s); ctx.lineTo(elbowX, elbowY + 3 * s); ctx.lineTo(handX, handY + 3 * s); ctx.stroke();
    // Hand, a small bright knot where the bow is held.
    ctx.fillStyle = hexA(RIM, a4(0.95));
    ctx.beginPath(); ctx.moveTo(handX + 6 * s, handY); ctx.arc(handX, handY, 6 * s, 0, Math.PI * 2); ctx.fill();

    // Bow hair, thin and bright, the sharpest line in the piece.
    ctx.strokeStyle = hexA(RIM, a4(0.95));
    ctx.lineWidth = 1.6 * s;
    ctx.beginPath(); ctx.moveTo(bowX1, bowY1); ctx.lineTo(bowX2, bowY2); ctx.stroke();
    // Bow stick, a warm line just above the hair.
    ctx.strokeStyle = hexA(SMOKE_HI, a4(0.7));
    ctx.lineWidth = 1.2 * s;
    ctx.beginPath(); ctx.moveTo(bowX1, bowY1 - 3 * s); ctx.lineTo(bowX2, bowY2 - 3 * s); ctx.stroke();
    ctx.lineCap = 'butt';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var dens = densityAt(t);
    var silOp = silhouetteAt(t);
    drawStage(t, dens);
    drawSmoke(t, dens);
    drawFigure(t, silOp);
    drawBowArm(t, silOp);

    // ---- Plates: title top-left, number and date below it, a
    // short descriptor top-right. Warm amber ink on stage black.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = PLATE;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Face as Light Event', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(PLATE, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1950 · 2007 · 05 · 15', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(PLATE, 0.6);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('a cellist, withdrawing', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom on a bright amber pill so
    // it stays legible over the smoke.
    var hint = 'Watch the body give way to light.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(HINT_BG, a4(0.85));
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = STAGE;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1950 exposes the sound model for probes.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1950 = {
      energy: energyAt,
      density: densityAt,
      silhouette: silhouetteAt,
      bowAngle: bowAngleAt,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: drone swells on a 26 s cycle, bow strokes on a
  // 7 s cycle, smoke wobble at 0.2 rad/s, swirl bands at 0.05
  // rad/s, all under the 14 Hz ceiling. Guarded so node-canvas
  // QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
