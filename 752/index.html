<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disc Float</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #E8E8E6;
    overflow: hidden;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Strict palette. Nothing outside the off-white family is ever drawn.
  var WALL = [232, 232, 230];    // #E8E8E6 wall field
  var DISC = [200, 204, 207];    // #C8CCCF disc aluminum
  var SHADOW = [154, 160, 166];  // #9AA0A6 shadow cool
  var RIM = [245, 239, 230];     // #F5EFE6 warm rim
  var GLOW = [242, 240, 234];    // #F2F0EA quatrefoil glow

  var ORBIT = 180;   // 3-minute light orbit, seamless
  var FADE = 8;      // natural-light crossfade, seconds
  var EASEBACK = 4;  // drag azimuth ease-back after release, seconds
  var HOLD = 1.2;    // long-hold threshold, seconds

  function smooth(u) {
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    return u * u * (3 - 2 * u);
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }

  function rgbString(c, a) {
    if (typeof a === 'number') {
      return 'rgba(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ',' + a + ')';
    }
    return 'rgb(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ')';
  }

  function mix(a, b, u) {
    return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
  }

  // The four light sources. Azimuths in screen space (y down): the classic
  // Irwin rig, two above and two below, at the diagonals. Each azimuth drifts
  // on an integer-ratio sine of the 180 s orbit, and each throw length
  // breathes on its own integer ratio, so the whole rig is periodic with the
  // orbit and frame one (t = 0) is the canonical diagonal state.
  var LIGHTS = [
    { base: -3 * Math.PI / 4, amp: 0.34, n: 1, len: 0.30, ln: 2 },
    { base: -Math.PI / 4,     amp: 0.28, n: 2, len: 0.26, ln: 1 },
    { base: Math.PI / 4,      amp: 0.31, n: 1, len: 0.28, ln: 3 },
    { base: 3 * Math.PI / 4,  amp: 0.36, n: 2, len: 0.24, ln: 2 }
  ];

  function lightAt(k, t, azOffset) {
    var L = LIGHTS[k];
    var az = L.base + L.amp * Math.sin(2 * Math.PI * L.n * t / ORBIT) + azOffset;
    var len = L.len * (1 + 0.16 * Math.sin(2 * Math.PI * L.ln * t / ORBIT));
    return { az: az, len: len };
  }

  // ---- Recorded interaction state -------------------------------------
  // Every visible quantity is a closed-form function of the elapsed time
  // and this event record: drag segments, releases, and light-mode events.
  var modeEvents = [];   // {t, from, to} natural-light weight transitions
  var natTarget = 0;
  var drag = null;       // {x0, y0, t0, moved, holdFired} while pointer down
  var dragOffset = 0;    // azimuth offset while dragging
  var release = null;    // {t, off} last drag release, eases back over 4 s
  var curT = 0;

  function natWeightAt(t) {
    var w = 0;
    for (var i = 0; i < modeEvents.length; i++) {
      var ev = modeEvents[i];
      if (t >= ev.t) w = ev.from + (ev.to - ev.from) * smooth((t - ev.t) / FADE);
    }
    return w;
  }

  function azOffsetAt(t) {
    if (drag) return dragOffset;
    if (release) {
      var u = (t - release.t) / EASEBACK;
      if (u >= 1) return 0;
      return release.off * (1 - smooth(u));
    }
    return 0;
  }

  function setNatTarget(to, t) {
    modeEvents.push({ t: t, from: natWeightAt(t), to: to });
    natTarget = to;
  }

  // ---- Drawing ---------------------------------------------------------

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  // A soft-edged filled ellipse built from layered alpha copies: fine
  // scale steps, alpha ramping up toward the center, so the copies
  // accumulate into a melt rather than a set of rings. No gradients,
  // no shadowBlur.
  function softBlob(cx, cy, rx, ry, color, perLayer, layers) {
    for (var i = 0; i < layers; i++) {
      var u = i / (layers - 1);
      var s = 1 - u * 0.46;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx * s, ry * s, 0, 0, Math.PI * 2);
      ctx.fillStyle = rgbString(color, perLayer * (0.5 + 0.6 * u));
      ctx.fill();
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    curT = t;

    var nat = FORCE_NAT ? 1 : natWeightAt(t);
    var lit = 1 - nat;
    var azOff = azOffsetAt(t);

    var cx = W / 2, cy = H / 2;
    // Disc diameter: 45% of frame width, capped so disc and shadow field
    // stay inside the frame height; on phones 45% of the smaller dimension.
    var dia = isPhone() ? 0.45 * Math.min(W, H) : 0.45 * Math.min(W, H * 1.42);
    var R = dia / 2;

    // Wall.
    ctx.fillStyle = rgbString(WALL);
    ctx.fillRect(0, 0, W, H);

    // Long-hold check happens against this frame's clock.
    if (drag && !drag.moved && !drag.holdFired && t - drag.t0 >= HOLD) {
      drag.holdFired = true;
      setNatTarget(natTarget === 1 ? 0 : 1, t);
    }

    if (lit > 0.001) {
      // Quatrefoil glow: four broad luminous lobes on the diagonals behind
      // the disc, overlapping so their crossings pool light into a
      // four-petalled field. Overall strength breathes once per orbit.
      var breathe = 1 + 0.12 * Math.sin(2 * Math.PI * t / ORBIT);
      var g = 0.52 * R;
      var lobes = [[-g, -g], [g, -g], [g, g], [-g, g]];
      for (var q = 0; q < 4; q++) {
        softBlob(cx + lobes[q][0], cy + lobes[q][1], 1.02 * R, 0.94 * R,
          GLOW, 0.036 * breathe * lit, 9);
      }
      // One broad faint pool underneath it all.
      softBlob(cx, cy, 1.45 * R, 1.32 * R, GLOW, 0.020 * breathe * lit, 7);

      // Cast shadows: each source throws the disc's silhouette the other
      // way. A shadow is a disc-sized soft blob displaced opposite its
      // light by the throw length; four of them, overlapping around the
      // disc, leave the bright quatrefoil standing between their arcs.
      for (var k = 0; k < 4; k++) {
        var L = lightAt(k, t, azOff);
        var sx = cx - Math.cos(L.az) * L.len * R * 2.2;
        var sy = cy - Math.sin(L.az) * L.len * R * 2.2;
        softBlob(sx, sy, 1.04 * R, 0.99 * R, SHADOW, 0.034 * lit, 10);
      }
    }

    // The disc itself. It never moves. Convexity is layered: a cool shade
    // massed low and to the right, warm light pooled high and to the left,
    // a turned rim of warm light on the upper-left edge and a cool line
    // where the edge rolls away at the lower right.
    var base = mix(DISC, WALL, nat);
    ctx.beginPath();
    ctx.ellipse(cx, cy, R, R * 0.985, 0, 0, Math.PI * 2);
    ctx.fillStyle = rgbString(base);
    ctx.fill();

    if (lit > 0.001) {
      softBlob(cx + 0.10 * R, cy + 0.14 * R, 0.93 * R, 0.90 * R, SHADOW, 0.028 * lit, 8);
      softBlob(cx - 0.17 * R, cy - 0.19 * R, 0.60 * R, 0.56 * R, RIM, 0.052 * lit, 8);
      softBlob(cx - 0.22 * R, cy - 0.24 * R, 0.32 * R, 0.29 * R, RIM, 0.065 * lit, 6);
      softBlob(cx - 0.24 * R, cy - 0.26 * R, 0.15 * R, 0.13 * R, GLOW, 0.075 * lit, 4);

      // Turned rim: warm arc upper-left, cool arc lower-right.
      ctx.beginPath();
      ctx.ellipse(cx, cy, R * 0.995, R * 0.98, 0, Math.PI * 0.95, Math.PI * 1.55);
      ctx.strokeStyle = rgbString(RIM, 0.35 * lit);
      ctx.lineWidth = Math.max(1.5, R * 0.016);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(cx, cy, R * 0.995, R * 0.98, 0, Math.PI * -0.08, Math.PI * 0.52);
      ctx.strokeStyle = rgbString(SHADOW, 0.30 * lit);
      ctx.lineWidth = Math.max(1.5, R * 0.016);
      ctx.stroke();

      // A breath of glow licking past the edge, so the rim dissolves into
      // the quatrefoil instead of ending on a hard circle.
      ctx.beginPath();
      ctx.ellipse(cx, cy, R * 1.012, R * 0.997, 0, 0, Math.PI * 2);
      ctx.strokeStyle = rgbString(GLOW, 0.16 * lit);
      ctx.lineWidth = Math.max(2, R * 0.03);
      ctx.stroke();
    }
  }

  // ---- Pointer: drag disturbs the light, hold changes it ---------------

  function pointerPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e && e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: 0, y: 0 };
  }

  function onDown(e) {
    var p = pointerPos(e);
    drag = { x0: p.x, y0: p.y, t0: curT, moved: false, holdFired: false };
    dragOffset = azOffsetAt(curT);
    release = null;
    if (canvas.setPointerCapture && e && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  }

  function onMove(e) {
    if (!drag) return;
    var p = pointerPos(e);
    var dx = p.x - drag.x0, dy = p.y - drag.y0;
    if (Math.abs(dx) + Math.abs(dy) > 8) drag.moved = true;
    if (drag.moved) {
      dragOffset = clamp(dx * 0.004, -1.0, 1.0);
      if (!drag.holdFired) { /* a drag is not a hold */ }
    }
  }

  function onUp(e) {
    if (!drag) return;
    var wasDrag = drag.moved;
    var held = drag.holdFired;
    var dur = curT - drag.t0;
    if (wasDrag) {
      release = { t: curT, off: dragOffset };
    } else if (!held && dur < 0.5 && natTarget === 1) {
      // A plain tap, only meaningful in natural-light mode: it restores
      // the four sources. In lit mode a tap does nothing at all.
      setNatTarget(0, curT);
    }
    drag = null;
  }

  if (canvas.addEventListener) {
    if (typeof window !== 'undefined' && 'PointerEvent' in window) {
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);
    } else {
      canvas.addEventListener('mousedown', onDown);
      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('mouseup', onUp);
      canvas.addEventListener('touchstart', onDown);
      canvas.addEventListener('touchmove', onMove);
      canvas.addEventListener('touchend', onUp);
    }
  }

  // Inert QA hooks (house convention): ?seed=tNN draws frame one at orbit
  // time NN seconds; ?seed=nat draws the fully dissolved natural-light
  // state. Without a parameter the piece starts at t = 0, fully lit.
  var startT = 0;
  var FORCE_NAT = false;
  var searchStr = (window.location && window.location.search) ||
    (typeof location !== 'undefined' ? location.search : '') || '';
  var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(searchStr);
  if (m) startT = parseFloat(m[1]);
  if (/[?&]seed=nat/.test(searchStr)) FORCE_NAT = true;

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(curT); });
  }
  window.addEventListener('resize', function () { resize(); draw(curT); });

  // Frame one: the synchronous draw at orbit t = 0 (canonical four-source
  // state, shadows at full strength, disc afloat on its quatrefoil).
  draw(startT);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts;
      draw(startT + (ts - t0) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
