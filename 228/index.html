<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.228 Split Infinitives</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFD923; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.228 Split Infinitives (Matthew Kluber). After the 2021 works of
// that name: three densities of orange on bright yellow. Sixty four
// tight dark orange lines at left, twenty eight looser stripes at
// centre, sixty four at right, exact counts, and a deep orange
// vertical band bisecting the middle. The paint never moves. Over it
// one additive wash of white gold light drifts left and right,
// driven by two incommensurable periods, forty seven seconds for
// position and seventy one for opacity, so the composite never
// repeats in a sitting. Kluber's encoded variables. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var YELLOW = '#FFD923', ORANGE = '#F39200', DARK = '#D95D0E', DEEP = '#C1440E';
var W = 0, H = 0, phone = false;
var T = 4, lastNow = -1; // frame one: wash partway across, lightening the centre-right

var LEFT_COUNT = 64, CENTER_COUNT = 28, RIGHT_COUNT = 64; // exact, per the work

function panel() {
  var pw = W * (phone ? 1 : 0.94);
  var ph = pw / 2;
  if (ph > H * 0.94) { ph = H * 0.94; pw = ph * 2; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
}

function drawLines(x0, w, count, thick, color, p) {
  var slot = p.h / count;
  var lh = slot * thick;
  ctx.fillStyle = color;
  for (var i = 0; i < count; i++) {
    ctx.fillRect(x0, p.y + i * slot + (slot - lh) / 2, w, Math.max(1, lh));
  }
}

function draw() {
  ctx.fillStyle = YELLOW;
  ctx.fillRect(0, 0, W, H);
  var p = panel();
  var leftW = p.w * 0.25, midW = p.w * 0.5, rightW = p.w * 0.25;
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
  // painted layer: static layout data, flat colour only
  drawLines(p.x, leftW, LEFT_COUNT, 0.46, DARK, p);
  drawLines(p.x + leftW, midW, CENTER_COUNT, 0.55, ORANGE, p);
  drawLines(p.x + leftW + midW, rightW, RIGHT_COUNT, 0.46, DARK, p);
  // the interrupt band: deep orange, bisecting the centre, over the stripes
  var bw = p.w / 8;
  ctx.fillStyle = DEEP;
  ctx.fillRect(p.x + p.w / 2 - bw / 2, p.y, bw, p.h);
  // the projection layer: one soft wash of white gold light, additive.
  // position on a 47s clock, opacity on a 71s clock; the pair never repeats.
  var wx = p.x + p.w / 2 + Math.sin(2 * Math.PI * T / 47) * p.w * 0.34;
  var alpha = 0.25 * (0.55 + 0.45 * Math.sin(2 * Math.PI * T / 71 + 1.2));
  var barW = p.w * 0.17;
  var g = ctx.createLinearGradient(wx - barW, 0, wx + barW, 0);
  g.addColorStop(0, 'rgba(255,240,200,0)');
  g.addColorStop(0.5, 'rgba(255,240,200,' + alpha.toFixed(3) + ')');
  g.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only, no controls.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
