<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№82 · Recursive Fold</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0A20; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,243,224,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to stir the folds</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function css(c){ return 'rgb('+Math.round(clamp(c[0],0,255))+','+Math.round(clamp(c[1],0,255))+','+Math.round(clamp(c[2],0,255))+')'; }
function cosPal(v, cols){ const x=((v%1)+1)%1; const seg=x* (cols.length-1); const i=Math.min(cols.length-2, Math.floor(seg)); return mixc(cols[i], cols[i+1], seg-i); }

// No.82 Recursive Fold: seeded offsets, levels=5, loop 16s
const LEVELS=5;
const IND=hexRGB('#1A1440'), CYA=hexRGB('#35D0E0'), WARM=hexRGB('#FFF3E0'), SHAD=hexRGB('#0B0A20');
let master=null, dragging=false, holdUntil=-1;
function rot(x,y,a){ const c=Math.cos(a), s=Math.sin(a); return [x*c-y*s, x*s+y*c]; }
function field(u,v,t){
  let p=[u*1.35, v*1.35-0.08];
  let lvl=0;
  for(let i=0;i<LEVELS;i++){
    const ang=(master!==null? master : Math.sin(2*Math.PI*t/16+i)*0.6) * (i%2? -0.55:0.55) + i*0.37;
    p=[Math.abs(p[0])-0.62, Math.abs(p[1])-0.48];
    p=rot(p[0],p[1],ang); lvl++;
  }
  const r=Math.hypot(p[0],p[1]);
  let col=cosPal(r*1.5 + t/16 + lvl*0.06, [IND,CYA,WARM,CYA,IND]);
  const d=Math.hypot(u,v); col=mixc(col, SHAD, smooth((d-0.75)/0.9)*0.45);
  return col;
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); const t=nowMs/1000;
  ctx.fillStyle='#0B0A20'; ctx.fillRect(0,0,w,h);
  const cell=isPhone()?9:11, cols=Math.ceil(w/cell), rows=Math.ceil(h/cell);
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    const u=((i+0.5)*cell-w/2)/(Math.min(w,h)/2), v=((j+0.5)*cell-h/2)/(Math.min(w,h)/2);
    ctx.fillStyle=css(field(u,v,t)); ctx.fillRect(i*cell,j*cell,cell+1,cell+1);
  }
  if(LEVELS!==5) console.assert(false,'levels',LEVELS);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; const [w,h]=viewportWH(); master=Math.atan2(e.clientY-h/2,e.clientX-w/2); });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const [w,h]=viewportWH(); master=Math.atan2(e.clientY-h/2,e.clientX-w/2); });
function endP(){ if(dragging){ dragging=false; holdUntil=performance.now()/1000+3; setTimeout(()=>{ master=null; },3100); } }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(5000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
