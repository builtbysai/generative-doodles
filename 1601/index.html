<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Latter From the Former</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var NEAR_BLACK = [10, 10, 10];
var BLUE = [22, 33, 62];
var GREY = [138, 138, 146];
var AMBER = [244, 162, 89];
var RUST = [181, 84, 45];
var CRIMSON = [188, 75, 81];
var GOLD = [232, 179, 58];
var TEXT = [200, 200, 208];
var PHASE = 20.0;
var ACT_S = 40.0;
var TRANS_S = 4.0;
var CYCLE_S = 3 * ACT_S + 3 * TRANS_S;
var SEED = 1601001;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function easeOut(k) { k = clamp(k, 0, 1); return 1 - (1 - k) * (1 - k); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function u() { return Math.min(VW, VH) / 100; }

/* ---- shared skeleton: one seeded parameter vector, three acts ---- */
var FLOW = (function () {
  var rng = mulberry32(SEED);
  return {
    c0: rng() * TAU,
    s1: rng() * TAU, s2: rng() * TAU, s3: rng() * TAU,
    a1: 1.1 + rng() * 0.6, a2: 0.7 + rng() * 0.5
  };
})();
function flowAngle(x, y, rt) {
  var dx = x - 0.5, dy = y - 0.5;
  var r = Math.sqrt(dx * dx + dy * dy) + 1e-6;
  var tx = -dy / r, ty = dx / r;
  var pull = (r - rt) * 1.6;
  var vx = tx - (dx / r) * pull;
  var vy = ty - (dy / r) * pull;
  var base = Math.atan2(vy, vx);
  return base + 0.7 * Math.sin(x * 5.2 + FLOW.s1) * Math.cos(y * 4.3 + FLOW.s2);
}
var N_TRACERS = 24, STEPS = 64, STEP = 0.011;
var skeleton = (function genSkeleton() {
  var rng = mulberry32(SEED + 17);
  var trs = [], i, s, x, y, pts;
  for (i = 0; i < N_TRACERS; i++) {
    x = 0.08 + rng() * 0.84;
    y = 0.08 + rng() * 0.84;
    var rt = 0.16 + rng() * 0.30;
    pts = [{ x: x, y: y }];
    for (s = 0; s < STEPS; s++) {
      var a = flowAngle(x, y, rt);
      x = x + Math.cos(a) * STEP;
      y = y + Math.sin(a) * STEP;
      if (x < 0.03 || x > 0.97 || y < 0.03 || y > 0.97) break;
      pts.push({ x: x, y: y });
    }
    trs.push({
      pts: pts,
      blue: rng() < 0.6,
      birth: rng() * 0.35,
      w: 0.0016 + rng() * 0.0016
    });
  }
  return trs;
})();
/* act two blooms: sampled points of the same skeleton, deformed by seeded jitter */
var blooms = (function genBlooms() {
  var rng = mulberry32(SEED + 43);
  var out = [], i, j, p;
  for (i = 0; i < skeleton.length; i++) {
    var tr = skeleton[i];
    for (j = 0; j < tr.pts.length; j += 5) {
      p = tr.pts[j];
      out.push({
        x: clamp(p.x + (rng() - 0.5) * 0.05, 0.02, 0.98),
        y: clamp(p.y + (rng() - 0.5) * 0.05, 0.02, 0.98),
        r: 0.006 + rng() * 0.014,
        amber: rng() < 0.55,
        birth: rng() * 0.5
      });
    }
  }
  return out;
})();
/* act three petri dots: the same skeleton points again, to be warped into the disc */
var petriDots = (function genPetriDots() {
  var rng = mulberry32(SEED + 71);
  var out = [], i, j, p;
  for (i = 0; i < skeleton.length; i++) {
    var tr = skeleton[i];
    for (j = 2; j < tr.pts.length; j += 6) {
      p = tr.pts[j];
      out.push({
        x: p.x, y: p.y,
        r: 0.005 + rng() * 0.009,
        gold: rng() < 0.5,
        birth: rng() * 0.55
      });
    }
  }
  return out;
})();
var RINGS = [0.25, 0.45, 0.65, 0.85];
var ringBirth = [0.0, 0.12, 0.24, 0.36];

function strokeTracer(tr, rect, frac, color, alpha, lwScale) {
  var n = tr.pts.length;
  var upto = Math.max(2, Math.floor(n * clamp(frac, 0, 1)));
  if (upto < 2) return;
  ctx.strokeStyle = rgba(color, alpha);
  ctx.lineWidth = Math.max(1, tr.w * rect.w * lwScale);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(rect.x + tr.pts[0].x * rect.w, rect.y + tr.pts[0].y * rect.h);
  for (var i = 1; i < upto; i++) {
    ctx.lineTo(rect.x + tr.pts[i].x * rect.w, rect.y + tr.pts[i].y * rect.h);
  }
  ctx.stroke();
}
function dot(x, y, r) {
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, TAU);
}

function drawAct1(rect, g, alpha) {
  if (alpha <= 0.001) return;
  var ge = easeOut(g);
  var i, tr, f;
  for (i = 0; i < skeleton.length; i++) {
    tr = skeleton[i];
    f = clamp((ge - tr.birth) / 0.6, 0, 1);
    if (f <= 0) continue;
    var col = tr.blue ? BLUE : GREY;
    var a = (tr.blue ? 0.95 : 0.85) * alpha;
    strokeTracer(tr, rect, f, col, a * 0.35, 3.2);
    strokeTracer(tr, rect, f, col, a, 1);
  }
  /* sparse end nodes */
  ctx.fillStyle = rgba(GREY, 0.7 * alpha);
  ctx.beginPath();
  for (i = 0; i < skeleton.length; i++) {
    tr = skeleton[i];
    f = clamp((ge - tr.birth) / 0.6, 0, 1);
    if (f < 0.95) continue;
    var p = tr.pts[tr.pts.length - 1];
    var r = Math.max(1, 0.004 * rect.w);
    dot(rect.x + p.x * rect.w, rect.y + p.y * rect.h, r);
  }
  ctx.fill();
}
function drawAct2(rect, g, alpha) {
  if (alpha <= 0.001) return;
  var ge = easeOut(g);
  var i, tr, f;
  /* the act one skeleton, recolored, still legible underneath */
  for (i = 0; i < skeleton.length; i++) {
    tr = skeleton[i];
    f = clamp((ge - tr.birth) / 0.6, 0, 1);
    if (f <= 0) continue;
    strokeTracer(tr, rect, f, AMBER, 0.30 * alpha, 1);
  }
  var b, s, rr;
  for (i = 0; i < blooms.length; i++) {
    b = blooms[i];
    s = clamp((ge - b.birth) / 0.3, 0.12, 1);
    if (s <= 0.12) continue;
    rr = b.r * rect.w * s;
    var col = b.amber ? AMBER : RUST;
    ctx.fillStyle = rgba(col, 0.30 * alpha);
    ctx.beginPath();
    dot(rect.x + b.x * rect.w, rect.y + b.y * rect.h, rr * 2.1);
    ctx.fill();
    ctx.fillStyle = rgba(col, 0.88 * alpha);
    ctx.beginPath();
    dot(rect.x + b.x * rect.w, rect.y + b.y * rect.h, rr);
    ctx.fill();
  }
}
function drawAct3(rect, g, alpha) {
  if (alpha <= 0.001) return;
  var ge = easeOut(g);
  var cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
  var R = 0.425 * rect.w;
  var i, tr, f;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.clip();
  ctx.fillStyle = rgba([26, 14, 14], 0.9 * alpha);
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  /* act two's skeleton, warped into the disc: the remnants, deformed */
  for (i = 0; i < skeleton.length; i++) {
    tr = skeleton[i];
    f = clamp((ge - tr.birth) / 0.6, 0, 1);
    if (f <= 0) continue;
    var col = (i % 2 === 0) ? CRIMSON : GOLD;
    ctx.strokeStyle = rgba(col, 0.5 * alpha);
    ctx.lineWidth = Math.max(1, tr.w * rect.w * 0.9);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    var upto = Math.max(2, Math.floor(tr.pts.length * f));
    var p0 = tr.pts[0];
    ctx.moveTo(cx + (p0.x - 0.5) * 1.84 * R, cy + (p0.y - 0.5) * 1.84 * R);
    for (var j = 1; j < upto; j++) {
      var p = tr.pts[j];
      ctx.lineTo(cx + (p.x - 0.5) * 1.84 * R, cy + (p.y - 0.5) * 1.84 * R);
    }
    ctx.stroke();
  }
  /* petri dots: act two's blooms regrown as gold and crimson colonies */
  var d, s, rr;
  for (i = 0; i < petriDots.length; i++) {
    d = petriDots[i];
    s = clamp((ge - d.birth) / 0.3, 0.12, 1);
    if (s <= 0.12) continue;
    rr = d.r * rect.w * s;
    ctx.fillStyle = rgba(d.gold ? GOLD : CRIMSON, 0.85 * alpha);
    ctx.beginPath();
    dot(cx + (d.x - 0.5) * 1.84 * R, cy + (d.y - 0.5) * 1.84 * R, rr);
    ctx.fill();
  }
  /* concentric rings sweep in, one after another */
  for (i = 0; i < RINGS.length; i++) {
    var sweep = clamp((ge - ringBirth[i]) / 0.55, 0, 1);
    if (sweep <= 0) continue;
    ctx.strokeStyle = rgba(i % 2 === 0 ? GOLD : CRIMSON, 0.75 * alpha);
    ctx.lineWidth = Math.max(1.2, 0.014 * R);
    ctx.beginPath();
    ctx.arc(cx, cy, RINGS[i] * R, -Math.PI / 2, -Math.PI / 2 + sweep * TAU);
    ctx.stroke();
  }
  ctx.restore();
  /* the petri frame itself */
  var frameA = clamp((ge - 0.05) / 0.4, 0.15, 1) * alpha;
  ctx.strokeStyle = rgba(GOLD, 0.95 * frameA);
  ctx.lineWidth = Math.max(2, 0.022 * R);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.stroke();
  ctx.strokeStyle = rgba(CRIMSON, 0.7 * frameA);
  ctx.lineWidth = Math.max(1, 0.010 * R);
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.965, 0, TAU);
  ctx.stroke();
}

/* act timeline: 40s hold, 4s growth transition, per act; 132s cycle */
function actState(t) {
  var cyc = ((t % CYCLE_S) + CYCLE_S) % CYCLE_S;
  var seg = ACT_S + TRANS_S;
  var idx = Math.floor(cyc / seg);
  var local = cyc - idx * seg;
  if (local < ACT_S) {
    return { from: idx + 1, to: idx + 1, k: 0, gFrom: local / ACT_S, gTo: 0 };
  }
  var k = smooth((local - ACT_S) / TRANS_S);
  var next = (idx + 1) % 3 + 1;
  return { from: idx + 1, to: next, k: k, gFrom: 1, gTo: k };
}
function drawAct(n, rect, g, alpha) {
  if (n === 1) drawAct1(rect, g, alpha);
  else if (n === 2) drawAct2(rect, g, alpha);
  else drawAct3(rect, g, alpha);
}
function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = 'rgb(' + NEAR_BLACK[0] + ',' + NEAR_BLACK[1] + ',' + NEAR_BLACK[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var rect = compRect();
  var st = actState(t);
  if (st.from === st.to) {
    drawAct(st.from, rect, st.gFrom, 1);
  } else {
    drawAct(st.from, rect, st.gFrom, 1 - st.k);
    drawAct(st.to, rect, st.gTo, st.k);
  }
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(TEXT, 0.62);
  ctx.fillText('The Latter From the Former', rect.x + rect.w / 2, rect.y + Math.max(6, 0.012 * rect.h));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(TEXT, 0.45);
  ctx.fillText('2006 · 05 · 31', rect.x + rect.w / 2, rect.y + Math.max(6, 0.012 * rect.h) + titlePx + 5);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(TEXT, 0.5);
  ctx.fillText('Watch only. Three acts, each grown from the last.', rect.x + rect.w / 2, rect.y + rect.h - smallPx - 10);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof window !== 'undefined') {
  window.__latter1601 = { draw: draw, actState: actState, skeleton: skeleton, blooms: blooms, petriDots: petriDots };
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
