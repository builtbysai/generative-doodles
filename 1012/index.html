<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Your Pose, Drawn</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (strict) ----------
  var COL_FIG = [46, 107, 255];    // #2E6BFF
  var COL_HOT = [157, 188, 255];   // #9DBCFF
  var COL_DIM = [26, 58, 143];     // #1A3A8F
  var COL_INK = [255, 255, 255];   // #FFFFFF
  function mix3(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function css(c, a) {
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function wrapPi(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }
  function dirx(a) { return Math.cos(a); }
  function diry(a) { return Math.sin(a); }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300, DPR = 1, CX = 150, CY = 160, SCALE = 100, IS_PHONE = false;

  function detectPhone() {
    var sw = 0, sh = 0;
    try { sw = window.screen.width || 0; sh = window.screen.height || 0; } catch (e) { }
    if (sw && sh && Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }
  function resize() {
    var w = 0, h = 0;
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width) { w = vv.width; h = vv.height; }
    if (!w) { w = window.innerWidth || 300; h = window.innerHeight || 300; }
    W = w; H = h;
    DPR = window.devicePixelRatio || 1;
    var pw = Math.round(W * DPR), ph = Math.round(H * DPR);
    if (canvas.width !== pw) canvas.width = pw;
    if (canvas.height !== ph) canvas.height = ph;
    IS_PHONE = detectPhone();
    if (IS_PHONE) SCALE = Math.min(H * 0.80, W * 0.97) / 2.1;
    else SCALE = Math.min(H * 0.88, W * 0.96) / 2.1;
    CX = W / 2;
    CY = H * 0.54;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
  }
  window.addEventListener('resize', function () { resize(); draw(); });
  try { canvas.style.touchAction = 'none'; } catch (e) { }

  // ---------- rig ----------
  var JOINTS = ['spine', 'neck', 'head', 'shL', 'elL', 'shR', 'elR', 'hipL', 'kneeL', 'hipR', 'kneeR'];
  // per-joint spring: [stiffness, damping ratio] - zeta < 1 gives lag and slight overshoot
  var SPRING = {
    spine: [26, 0.78], neck: [42, 0.62], head: [46, 0.60],
    shL: [58, 0.60], elL: [66, 0.55], shR: [58, 0.60], elR: [66, 0.55],
    hipL: [50, 0.70], kneeL: [58, 0.62], hipR: [50, 0.70], kneeR: [58, 0.62]
  };
  var DT = 1 / 120;

  // poses: joint angles (radians, relative) + root offsets
  function pose(o) {
    var p = { spine: 0, neck: 0, head: 0, shL: 2.36, elL: 0.25, shR: -2.36, elR: -0.25, hipL: -0.07, kneeL: 0.06, hipR: 0.07, kneeR: 0.06, rootX: 0, rootY: 0.98 };
    for (var k in o) p[k] = o[k];
    return p;
  }
  var POSE_NEUTRAL = pose({});
  var IDLE = [
    { p: POSE_NEUTRAL, d: 2.6 },
    { p: pose({ spine: -0.12, neck: 0.08, head: 0.05, shL: 1.57, elL: 0.20, shR: -0.67, elR: -0.15, hipL: -0.15, kneeL: 0.10, hipR: 0.18, kneeR: 0.12 }), d: 3.0 },
    { p: pose({ spine: -0.22, neck: -0.35, head: -0.10, shL: 0.40, elL: 0.35, shR: -2.90, elR: -0.50, hipL: 0.30, kneeL: 0.15, hipR: -0.25, kneeR: 0.20, rootY: 0.96 }), d: 3.0 },
    { p: pose({ spine: 0.05, shL: 2.70, elL: 0.15, shR: -2.70, elR: -0.15, hipL: -0.38, kneeL: 0.30, hipR: 0.38, kneeR: 0.30, rootY: 0.90 }), d: 2.8 },
    { p: pose({ spine: 0.38, neck: 0.15, shL: 2.90, elL: 0.90, shR: -2.90, elR: -0.90, hipL: -0.20, kneeL: 0.45, hipR: 0.20, kneeR: 0.45, rootY: 0.88 }), d: 2.6 },
    { p: pose({ spine: -0.05, neck: -0.06, shL: 0.55, elL: 0.10, shR: -0.55, elR: -0.10, hipL: -0.05, kneeL: 0.03, hipR: 0.08, kneeR: 0.03, rootY: 1.01 }), d: 3.0 }
  ];
  var IDLE_TOTAL = 0;
  for (var ii = 0; ii < IDLE.length; ii++) IDLE_TOTAL += IDLE[ii].d;
  var GEST = [
    { p: pose({ spine: 0.30, shL: 2.90, elL: 0.60, shR: -2.90, elR: -0.60, hipL: -0.30, kneeL: 0.70, hipR: 0.30, kneeR: 0.70, rootY: 0.80 }), d: 0.8 },
    { p: pose({ spine: -0.08, neck: -0.05, shL: 0.90, elL: 0.10, shR: -0.90, elR: -0.10, hipL: -0.50, kneeL: 0.10, hipR: 0.55, kneeR: 0.12, rootY: 1.06 }), d: 0.8 },
    { p: pose({ spine: 0.10, shL: 2.70, elL: 0.20, shR: -2.70, elR: -0.20, hipL: -0.35, kneeL: 0.40, hipR: 0.35, kneeR: 0.40, rootY: 0.88 }), d: 0.8 }
  ];
  function phrasePose(seq, total, t) {
    var tc = t % total;
    var i = 0;
    while (i < seq.length - 1 && tc > seq[i].d) { tc -= seq[i].d; i++; }
    var a = seq[i].p, b = seq[(i + 1) % seq.length].p;
    var u = clamp(tc / seq[i].d, 0, 1);
    var s = u * u * (3 - 2 * u);
    var out = {};
    for (var k in a) out[k] = lerp(a[k], b[k], s);
    return out;
  }

  // ---------- sim state ----------
  var seed = 1012;
  try {
    var loc = (typeof location !== 'undefined') ? location : null;
    if (loc && loc.search) {
      var m = /seed=(\d+)/.exec(loc.search);
      if (m) seed = parseInt(m[1], 10);
    }
  } catch (e) { }

  var rng = null;
  var LEN = null;              // bone lengths for this dancer
  var ang = {}, vel = {}, bsf = {};
  var root = { x: 0, y: 0.98, vx: 0, vy: 0 };
  var simTime = 0, phraseClock = 0;
  var strokes = [], strokePts = 0;
  var activeStroke = [null, null, null, null, null];
  var prevTips = null;
  var activity = 0;
  var gestureStart = -10;
  var preRolling = false;
  var drag = null;             // {chain, x, y}
  var lastRelease = -10;

  function initSim(sd) {
    rng = mulberry32(sd);
    function jit(base) { return base * (0.94 + rng() * 0.12); }
    LEN = {
      spine: jit(0.52), neck: jit(0.16), headR: jit(0.105),
      shoulderHalf: jit(0.21), hipHalf: jit(0.10),
      upper: jit(0.34), fore: jit(0.32), thigh: jit(0.44), shin: jit(0.42)
    };
    for (var i = 0; i < JOINTS.length; i++) {
      ang[JOINTS[i]] = POSE_NEUTRAL[JOINTS[i]];
      vel[JOINTS[i]] = 0;
      bsf[JOINTS[i]] = 0;
    }
    root.x = 0; root.y = 0.98; root.vx = 0; root.vy = 0;
    simTime = 0; phraseClock = 0;
    strokes = []; strokePts = 0;
    activeStroke = [null, null, null, null, null];
    prevTips = null;
    activity = 0;
    gestureStart = -10;
    drag = null;
    lastRelease = -10;
  }

  // forward kinematics from current angles + root
  function fk() {
    var spineAbs = Math.PI / 2 + ang.spine;
    var rx = root.x, ry = root.y;
    var chest = { x: rx + dirx(spineAbs) * LEN.spine, y: ry + diry(spineAbs) * LEN.spine };
    var neckAbs = spineAbs + ang.neck;
    var neckEnd = { x: chest.x + dirx(neckAbs) * LEN.neck, y: chest.y + diry(neckAbs) * LEN.neck };
    var headAbs = neckAbs + ang.head;
    var headC = { x: neckEnd.x + dirx(headAbs) * LEN.headR * 0.95, y: neckEnd.y + diry(headAbs) * LEN.headR * 0.95 };
    var shLp = { x: chest.x + dirx(spineAbs + Math.PI / 2) * LEN.shoulderHalf, y: chest.y + diry(spineAbs + Math.PI / 2) * LEN.shoulderHalf };
    var shRp = { x: chest.x + dirx(spineAbs - Math.PI / 2) * LEN.shoulderHalf, y: chest.y + diry(spineAbs - Math.PI / 2) * LEN.shoulderHalf };
    var elLp = { x: shLp.x + dirx(spineAbs + ang.shL) * LEN.upper, y: shLp.y + diry(spineAbs + ang.shL) * LEN.upper };
    var wrLp = { x: elLp.x + dirx(spineAbs + ang.shL + ang.elL) * LEN.fore, y: elLp.y + diry(spineAbs + ang.shL + ang.elL) * LEN.fore };
    var elRp = { x: shRp.x + dirx(spineAbs + ang.shR) * LEN.upper, y: shRp.y + diry(spineAbs + ang.shR) * LEN.upper };
    var wrRp = { x: elRp.x + dirx(spineAbs + ang.shR + ang.elR) * LEN.fore, y: elRp.y + diry(spineAbs + ang.shR + ang.elR) * LEN.fore };
    var pelvisUp = Math.PI / 2 + ang.spine * 0.35;
    var hipLp = { x: rx + dirx(pelvisUp + Math.PI / 2) * LEN.hipHalf, y: ry + diry(pelvisUp + Math.PI / 2) * LEN.hipHalf };
    var hipRp = { x: rx + dirx(pelvisUp - Math.PI / 2) * LEN.hipHalf, y: ry + diry(pelvisUp - Math.PI / 2) * LEN.hipHalf };
    var legL = pelvisUp + Math.PI + ang.hipL;
    var kneeLp = { x: hipLp.x + dirx(legL) * LEN.thigh, y: hipLp.y + diry(legL) * LEN.thigh };
    var ankLp = { x: kneeLp.x + dirx(legL + ang.kneeL) * LEN.shin, y: kneeLp.y + diry(legL + ang.kneeL) * LEN.shin };
    var legR = pelvisUp + Math.PI + ang.hipR;
    var kneeRp = { x: hipRp.x + dirx(legR) * LEN.thigh, y: hipRp.y + diry(legR) * LEN.thigh };
    var ankRp = { x: kneeRp.x + dirx(legR + ang.kneeR) * LEN.shin, y: kneeRp.y + diry(legR + ang.kneeR) * LEN.shin };
    return {
      root: { x: rx, y: ry }, chest: chest, neckEnd: neckEnd, headC: headC,
      shL: shLp, elL: elLp, wrL: wrLp, shR: shRp, elR: elRp, wrR: wrRp,
      hipL: hipLp, kneeL: kneeLp, ankL: ankLp, hipR: hipRp, kneeR: kneeRp, ankR: ankRp,
      spineAbs: spineAbs, pelvisUp: pelvisUp
    };
  }
  function tipList(P) { return [P.wrL, P.wrR, P.ankL, P.ankR, P.headC]; }

  // two-bone IK: returns relative angle targets for a chain, solved against current FK.
  // arms pick the lower elbow; legs pick the outward knee.
  function solveChain(P, chain, tx, ty) {
    var S, L1, L2, base, j0, j1, legSide = 0;
    if (chain === 'armL') { S = P.shL; L1 = LEN.upper; L2 = LEN.fore; base = P.spineAbs; j0 = 'shL'; j1 = 'elL'; }
    else if (chain === 'armR') { S = P.shR; L1 = LEN.upper; L2 = LEN.fore; base = P.spineAbs; j0 = 'shR'; j1 = 'elR'; }
    else if (chain === 'legL') { S = P.hipL; L1 = LEN.thigh; L2 = LEN.shin; base = P.pelvisUp + Math.PI; j0 = 'hipL'; j1 = 'kneeL'; legSide = -1; }
    else { S = P.hipR; L1 = LEN.thigh; L2 = LEN.shin; base = P.pelvisUp + Math.PI; j0 = 'hipR'; j1 = 'kneeR'; legSide = 1; }
    var dx = tx - S.x, dy = ty - S.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var maxD = L1 + L2 - 0.02;
    if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
    if (d < 0.05) { d = 0.05; }
    var baseAng = Math.atan2(dy, dx);
    var cosA = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
    var alpha = Math.acos(cosA);
    var best = null;
    for (var s = -1; s <= 1; s += 2) {
      var a1 = baseAng + s * alpha;
      var ex = S.x + dirx(a1) * L1, ey = S.y + diry(a1) * L1;
      var a2 = Math.atan2(S.y + dy - ey, S.x + dx - ex);
      var score;
      if (legSide === 0) score = -ey;                 // arms: lower elbow wins
      else score = ex * legSide;                      // legs: outward knee wins
      if (!best || score > best.score) {
        best = { score: score, t0: wrapPi(a1 - base), t1: wrapPi(a2 - a1) };
      }
    }
    var out = {};
    out[j0] = best.t0;
    out[j1] = best.t1;
    return out;
  }

  // seeded virtual performance: scripted grabs during the pre-roll only.
  // Frame one is this performance, not a visitor's input.
  function perfGrabs(t) {
    var g = [];
    if (t >= 3 && t < 7) {
      var u = (t - 3) / 4, a = u * Math.PI * 2 * 1.3 + 0.7;
      g.push({ chain: 'armR', x: 0.18 + 0.52 * Math.cos(a), y: 1.52 + 0.40 * Math.sin(a) });
    } else if (t >= 7 && t < 10.5) {
      var u2 = (t - 7) / 3.5, a2 = u2 * Math.PI * 2 * 1.2 + 2.0;
      g.push({ chain: 'armL', x: -0.15 + 0.55 * Math.cos(a2), y: 0.95 + 0.33 * Math.sin(a2) });
    } else if (t >= 10.5 && t < 13.5) {
      var u3 = (t - 10.5) / 3, a3 = u3 * Math.PI * 2 * 2;
      g.push({ chain: 'armR', x: 0.12 + 0.50 * Math.sin(a3), y: 1.50 + 0.30 * Math.sin(a3) * Math.cos(a3) });
    } else if (t >= 13.5 && t < 16.2) {
      var u4 = (t - 13.5) / 2.7, a4 = u4 * Math.PI * 2 * 1.5;
      g.push({ chain: 'legR', x: 0.42 + 0.10 * Math.sin(a4), y: 0.62 + 0.30 * Math.sin(a4 + 0.9) });
      var a5 = u4 * Math.PI * 2 * 1.1 + 1.0;
      g.push({ chain: 'armL', x: -0.30 + 0.40 * Math.cos(a5), y: 1.35 + 0.30 * Math.sin(a5) });
    }
    return g;
  }

  function stepSim(dt) {
    simTime += dt;
    if (!drag) phraseClock += dt;

    // targets: idle phrase, gesture override, then grabs
    var tgt = phrasePose(IDLE, IDLE_TOTAL, phraseClock);
    if (simTime - gestureStart < 2.4 && gestureStart > 0) {
      var gp = phrasePose(GEST, 2.4, simTime - gestureStart);
      var pr = (simTime - gestureStart) / 2.4;
      var w = Math.sin(Math.PI * clamp(pr, 0, 1)) * 0.85;
      for (var k in tgt) tgt[k] = lerp(tgt[k], gp[k], w);
    }
    var rootTX = tgt.rootX + 0.05 * Math.sin(phraseClock * 0.23 * Math.PI * 2 / 2.6);
    var rootTY = tgt.rootY + 0.02 * Math.sin(phraseClock * 0.37 * Math.PI * 2 / 2.6);

    var grabs = [];
    if (preRolling) grabs = perfGrabs(simTime);
    if (drag) grabs = [drag];

    var P = fk();
    for (var gi = 0; gi < grabs.length; gi++) {
      var gb = grabs[gi];
      if (gb.chain === 'head') {
        tgt.spine = clamp(tgt.spine + clamp(gb.x * 0.22, -0.30, 0.30), -0.55, 0.55);
        tgt.neck = clamp(tgt.neck + clamp(gb.x * 0.15, -0.25, 0.25) + clamp((1.55 - gb.y) * 0.12, -0.2, 0.2), -0.6, 0.6);
        rootTX += clamp(gb.x * 0.08, -0.07, 0.07);
      } else {
        var sol = solveChain(P, gb.chain, gb.x, gb.y);
        for (var sk in sol) tgt[sk] = sol[sk];
        if (gb.chain === 'armL' || gb.chain === 'armR') {
          tgt.spine = clamp(tgt.spine + clamp(gb.x * 0.15, -0.18, 0.18), -0.6, 0.6);
          rootTX += clamp(gb.x * 0.10, -0.08, 0.08);
        }
        if (gb.chain === 'legL' || gb.chain === 'legR') rootTY -= 0.03;
      }
    }

    // springs: joints
    for (var i = 0; i < JOINTS.length; i++) {
      var j = JOINTS[i];
      var sp = SPRING[j];
      var kk = sp[0], cc = 2 * sp[1] * Math.sqrt(sp[0]);
      vel[j] += (kk * (tgt[j] - ang[j]) - cc * vel[j]) * dt;
      ang[j] += vel[j] * dt;
      bsf[j] = lerp(bsf[j], clamp(Math.abs(vel[j]) * 0.55, 0, 1), 0.08);
    }
    // springs: root
    var rk = 20, rc = 2 * 0.8 * Math.sqrt(20);
    root.vx += (rk * (rootTX - root.x) - rc * root.vx) * dt;
    root.x += root.vx * dt;
    root.vy += (rk * (rootTY - root.y) - rc * root.vy) * dt;
    root.y += root.vy * dt;

    // tips, speeds, scribbles (true recorded tip paths)
    var P2 = fk();
    var tips = tipList(P2);
    if (!prevTips) prevTips = tips;
    var speedSum = 0;
    for (var ti = 0; ti < 5; ti++) {
      var ddx = tips[ti].x - prevTips[ti].x, ddy = tips[ti].y - prevTips[ti].y;
      var spd = Math.sqrt(ddx * ddx + ddy * ddy) / dt;
      speedSum += spd;
      var st = activeStroke[ti];
      if (!st && spd > 0.5) {
        st = { pts: [], born: simTime, wf: 0.7 + rng() * 0.6 };
        strokes.push(st);
        activeStroke[ti] = st;
        brushSound(spd);
      }
      if (st) {
        var n = st.pts.length;
        var lx = n ? st.pts[n - 2] : 1e9, ly = n ? st.pts[n - 1] : 1e9;
        var pdx = tips[ti].x - lx, pdy = tips[ti].y - ly;
        if (pdx * pdx + pdy * pdy > 0.006 * 0.006) {
          st.pts.push(tips[ti].x + (rng() - 0.5) * 0.025, tips[ti].y + (rng() - 0.5) * 0.025);
          strokePts++;
        }
        if (spd < 0.35) activeStroke[ti] = null;
      }
    }
    prevTips = tips;
    activity = lerp(activity, speedSum / 5, 0.02);

    // age out strokes (12 s memory) and cap the store
    if ((simTime * 120 | 0) % 30 === 0) {
      strokes = strokes.filter(function (s) { return simTime - s.born < 12 && s.pts.length > 2; });
      strokePts = 0;
      for (var fi = 0; fi < strokes.length; fi++) strokePts += strokes[fi].pts.length / 2;
      while (strokes.length > 260 || strokePts > 9000) {
        var dead = strokes.shift();
        strokePts -= dead.pts.length / 2;
        for (var ai = 0; ai < 5; ai++) if (activeStroke[ai] === dead) activeStroke[ai] = null;
      }
    }
  }

  function preRoll() {
    preRolling = true;
    for (var i = 0; i < 1920; i++) stepSim(DT);
    preRolling = false;
  }

  // ---------- audio (lazy, gesture-gated, guarded) ----------
  var ac = null, acMaster = null;
  function ensureAudio() {
    if (ac) { try { if (ac.resume) ac.resume(); } catch (e) { } return; }
    var AC = null;
    try { AC = window.AudioContext || window.webkitAudioContext; } catch (e) { }
    if (typeof AC !== 'function') return;
    try {
      ac = new AC();
      acMaster = ac.createGain();
      acMaster.gain.value = 0.5;
      acMaster.connect(ac.destination);
      // idle breathing tone
      var o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = 52;
      var g = ac.createGain(); g.gain.value = 0.012;
      var lfo = ac.createOscillator(); lfo.frequency.value = 0.09;
      var lg = ac.createGain(); lg.gain.value = 0.008;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(acMaster);
      o.start(); lfo.start();
    } catch (e) { ac = null; }
  }
  function brushSound(v) {
    if (!ac) return;
    try {
      var dur = 0.09, len = Math.floor(ac.sampleRate * dur);
      var buf = ac.createBuffer(1, len, ac.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = ac.createBufferSource(); src.buffer = buf;
      var f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1600 + v * 600; f.Q.value = 0.8;
      var g = ac.createGain(); g.gain.value = Math.min(0.20, 0.05 + v * 0.08);
      src.connect(f); f.connect(g); g.connect(acMaster);
      src.start();
    } catch (e) { }
  }
  function tickSound() {
    if (!ac) return;
    try {
      var o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = 180;
      var g = ac.createGain();
      g.gain.setValueAtTime(0.06, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.07);
      o.connect(g); g.connect(acMaster);
      o.start(); o.stop(ac.currentTime + 0.08);
    } catch (e) { }
  }

  // ---------- draw ----------
  function sx(x) { return CX + x * SCALE; }
  function originY() { return CY + 1.0 * SCALE; } // world y=1.0 (mid-body) sits at CY
  function sy(y) { return originY() - y * SCALE; }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    // scribbles first, under the figure
    var baseLW = Math.max(1.1, SCALE * 0.005);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var si = 0; si < strokes.length; si++) {
      var s = strokes[si];
      var age = simTime - s.born;
      if (age > 12 || s.pts.length < 4) continue;
      var al = 0.8 * (1 - age / 12);
      if (al <= 0.01) continue;
      for (var pass = 0; pass < 2; pass++) {
        ctx.beginPath();
        var ox = pass ? 1.5 : 0, oy = pass ? -1 : 0;
        for (var pi = 0; pi < s.pts.length; pi += 2) {
          var px = sx(s.pts[pi]) + ox, py = sy(s.pts[pi + 1]) + oy;
          if (pi === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = css(COL_INK, al * (pass ? 0.35 : 1));
        ctx.lineWidth = baseLW * s.wf * (pass ? 0.8 : 1);
        ctx.stroke();
      }
    }

    // figure
    var P = fk();
    var dimAmt = clamp(1 - activity * 1.1, 0, 1) * 0.9;
    var baseCol = mix3(COL_DIM, COL_FIG, 0.25 + 0.75 * (1 - dimAmt));
    var lw0 = Math.max(1.6, SCALE * 0.008);
    function bone(a, b, j) {
      var f = bsf[j] || 0;
      var c = mix3(baseCol, COL_HOT, f);
      ctx.beginPath();
      ctx.moveTo(sx(a.x), sy(a.y));
      ctx.lineTo(sx(b.x), sy(b.y));
      ctx.strokeStyle = css(c, 1);
      ctx.lineWidth = lw0 * (1 + 0.8 * f);
      ctx.stroke();
      return c;
    }
    function dot(p, j) {
      var f = bsf[j] || 0;
      var c = mix3(baseCol, COL_HOT, f);
      ctx.beginPath();
      ctx.arc(sx(p.x), sy(p.y), lw0 * 0.62 * (1 + 0.5 * f), 0, Math.PI * 2);
      ctx.fillStyle = css(c, 1);
      ctx.fill();
    }
    bone(P.root, P.chest, 'spine');
    bone(P.chest, P.neckEnd, 'neck');
    bone(P.neckEnd, P.headC, 'head');
    bone(P.chest, P.shL, 'spine');
    bone(P.shL, P.elL, 'shL');
    bone(P.elL, P.wrL, 'elL');
    bone(P.chest, P.shR, 'spine');
    bone(P.shR, P.elR, 'shR');
    bone(P.elR, P.wrR, 'elR');
    bone(P.root, P.hipL, 'hipL');
    bone(P.hipL, P.kneeL, 'hipL');
    bone(P.kneeL, P.ankL, 'kneeL');
    bone(P.root, P.hipR, 'hipR');
    bone(P.hipR, P.kneeR, 'hipR');
    bone(P.kneeR, P.ankR, 'kneeR');
    dot(P.chest, 'spine'); dot(P.neckEnd, 'neck');
    dot(P.shL, 'shL'); dot(P.elL, 'elL'); dot(P.wrL, 'elL');
    dot(P.shR, 'shR'); dot(P.elR, 'elR'); dot(P.wrR, 'elR');
    dot(P.hipL, 'hipL'); dot(P.kneeL, 'kneeL'); dot(P.ankL, 'kneeL');
    dot(P.hipR, 'hipR'); dot(P.kneeR, 'kneeR'); dot(P.ankR, 'kneeR');
    dot(P.root, 'spine');
    // head: wireframe circle
    var hf = bsf.head || 0;
    ctx.beginPath();
    ctx.arc(sx(P.headC.x), sy(P.headC.y), LEN.headR * SCALE, 0, Math.PI * 2);
    ctx.strokeStyle = css(mix3(baseCol, COL_HOT, hf), 1);
    ctx.lineWidth = lw0 * (1 + 0.8 * hf);
    ctx.stroke();
  }

  // ---------- interaction ----------
  function worldFromEvent(e) {
    var r = { left: 0, top: 0 };
    try { if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect(); } catch (err) { }
    var px = (e.clientX || 0) - r.left, py = (e.clientY || 0) - r.top;
    return { x: (px - CX) / SCALE, y: (originY() - py) / SCALE, px: px, py: py };
  }
  var pDown = null, lastTapT = -1000;
  function onDown(e) {
    ensureAudio();
    var wpt = worldFromEvent(e);
    pDown = { t: e.timeStamp || 0, x: wpt.px, y: wpt.py, moved: false };
    // pick nearest tip chain
    var P = fk();
    var tips = tipList(P);
    var chains = ['armL', 'armR', 'legL', 'legR', 'head'];
    var bestI = 0, bestD = 1e18;
    for (var i = 0; i < 5; i++) {
      var ddx = sx(tips[i].x) - wpt.px, ddy = sy(tips[i].y) - wpt.py;
      var dd = ddx * ddx + ddy * ddy;
      if (dd < bestD) { bestD = dd; bestI = i; }
    }
    pDown.chain = chains[bestI];
    pDown.wx = wpt.x; pDown.wy = wpt.y;
    try { if (canvas.setPointerCapture && e.pointerId !== undefined) canvas.setPointerCapture(e.pointerId); } catch (err) { }
  }
  function onMove(e) {
    if (!pDown) return;
    var wpt = worldFromEvent(e);
    var dx = wpt.px - pDown.x, dy = wpt.py - pDown.y;
    if (!pDown.moved && dx * dx + dy * dy > 36) pDown.moved = true;
    if (pDown.moved) drag = { chain: pDown.chain, x: wpt.x, y: wpt.y };
  }
  function onUp(e) {
    if (!pDown) return;
    var wasDrag = !!drag;
    drag = null;
    lastRelease = simTime;
    var now = e.timeStamp || 0;
    if (!pDown.moved && !wasDrag && now - pDown.t < 300) {
      if (now - lastTapT < 350) {
        // double tap: new dancer
        lastTapT = -1000;
        seed = (seed * 1103515245 + 12345) % 2147483648;
        initSim(seed);
        preRoll();
        draw();
      } else {
        lastTapT = now;
        gestureStart = simTime;
        tickSound();
      }
    }
    pDown = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  window.addEventListener('pointerup', onUp);

  // ---------- boot: deterministic frame one ----------
  resize();
  initSim(seed);
  preRoll();
  draw();

  var lastTs = -1, acc = 0;
  function frame(ts) {
    if (lastTs < 0) lastTs = ts;
    var el = (ts - lastTs) / 1000;
    lastTs = ts;
    if (el > 0.06) el = 0.06;
    if (el < 0) el = 0;
    acc += el;
    var n = 0;
    while (acc >= DT && n < 8) { stepSim(DT); acc -= DT; n++; }
    draw();
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
