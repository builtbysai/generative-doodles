<!DOCTYPE html>
<html lang="utf-8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No8923 · Night Water — Repel Test</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0d; touch-action:none; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
#stage { position:fixed; inset:0; display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// No8923 Night Water — REPEL TEST variant (the opposite of the attract test).
// Physics experiment: ripples kept. Touch repels motes (pushes them away
// from the finger). When dormant, motes drift inward toward the middle; when
// one dissolves at the center it is reborn at a random point on the edges.
// Born at the edges, flows in. Bioluminescent wake + light trails kept.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '8923', 10) || 8923;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}

const GROUND = [10, 10, 13];
let W = 0, H = 0, DPR = 1;
let motes = [];
let ripples = [];   // {x, y, age, life, maxR}
let t = 0;
let mx = 0, my = 0, tmx = 0, tmy = 0;

// Active touch/pointer currents: id -> {nx, ny, px, py, vx, vy, lastRipple}
const currents = new Map();

function compose(s){
  const rnd = mulberry32(s);
  motes = [];
  ripples = [];
  const n = 85 + ((rnd() * 40) | 0);
  for (let i = 0; i < n; i++){
    const hue = 186 + rnd() * 26;            // 186..212 blue-teal family
    const sat = 28 + rnd() * 30;
    const lit = 42 + rnd() * 26;
    motes.push({
      x: rnd(), y: rnd(),
      z: 0.25 + rnd() * 0.75,
      r: 1.2 + Math.pow(rnd(), 2.2) * 7,
      hue, sat, lit,
      alpha: 0.35 + rnd() * 0.5,
      ph: rnd() * Math.PI * 2,
      br: 0.5 + rnd() * 1.4,
      vx: (rnd() - 0.5) * 0.00035,
      vy: (rnd() - 0.5) * 0.00035,
      ix: 0, iy: 0,
      excite: 0,                             // bioluminescent charge 0..1
      fade: 1,                               // lifecycle fade for center dissolve
      ring: rnd() < 0.16,
      ringR: 2.6 + rnd() * 2.2,
    });
  }
}

// Reborn at a random point on the edges (the inward end of the cycle)
function rebirthAtEdge(m){
  const side = (Math.random() * 4) | 0;
  const p = Math.random();
  const inset = 0.02;
  if (side === 0){ m.x = inset; m.y = p; }
  else if (side === 1){ m.x = 1 - inset; m.y = p; }
  else if (side === 2){ m.x = p; m.y = inset; }
  else { m.x = p; m.y = 1 - inset; }
  m.vx = (Math.random() - 0.5) * 0.00035;
  m.vy = (Math.random() - 0.5) * 0.00035;
  m.ix = 0; m.iy = 0;
  m.excite = 0;
  m.fade = 1;
  m.ph = Math.random() * Math.PI * 2;
}

function sizeCanvas(){
  const [vw, vh] = viewportWH();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = vw; H = vh;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function normPos(e){
  return [e.clientX / W, e.clientY / H];
}

function spawnRipple(x, y, maxR, delay){
  if (ripples.length > 14) ripples.shift();
  ripples.push({ x, y, age: -delay, life: 80, maxR });
}

function stir(){
  const now = performance.now();

  // --- finger currents: carry, swirl, REPEL, ignite ---
  for (const m of motes){
    for (const c of currents.values()){
      const dx = m.x - c.nx, dy = m.y - c.ny;
      const R = 0.19;
      const d2 = dx * dx + dy * dy;
      if (d2 < R * R){
        const d = Math.sqrt(d2) || 0.0001;
        const fall = 1 - d / R;
        const f2 = fall * fall;
        const sp = Math.sqrt(c.vx * c.vx + c.vy * c.vy);
        const spN = Math.min(1, sp / 0.012);          // 0 still .. 1 fast
        // carried along with the finger
        m.ix += c.vx * f2 * (1.1 + spN * 0.9);
        m.iy += c.vy * f2 * (1.1 + spN * 0.9);
        // eddy: perpendicular swirl, grows with finger speed
        if (sp > 0.0006){
          const swAmt = sp * f2 * 0.85 * spN;
          m.ix += (-c.vy / sp) * swAmt;
          m.iy += (c.vx / sp) * swAmt;
        }
        // REPEL: gentle outward parting, like parting water
        m.ix += (dx / d) * f2 * 0.0012;
        m.iy += (dy / d) * f2 * 0.0012;
        // ignition: still touches glow, fast drags blaze
        m.excite = Math.min(1, m.excite + f2 * (0.09 + spN * 0.38));
      }
    }

    // --- ripples: radial shove + ignition as the ring passes ---
    for (const rp of ripples){
      if (rp.age < 0) continue;
      const k = rp.age / rp.life;
      const rr = rp.maxR * (1 - Math.pow(1 - k, 2)); // ease-out expansion
      const dx = m.x - rp.x, dy = m.y - rp.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      const band = Math.abs(d - rr);
      if (band < 0.028){
        const push = 1 - band / 0.028;
        const fade = 1 - k;
        m.ix += (dx / d) * push * 0.0042 * fade;
        m.iy += (dy / d) * push * 0.0042 * fade;
        m.excite = Math.min(1, m.excite + push * 0.22 * fade);
      }
    }

    // decay interaction velocity; clamp so swipes can't fling motes away
    m.ix *= 0.94; m.iy *= 0.94;
    const sp2 = m.ix * m.ix + m.iy * m.iy;
    if (sp2 > 0.0004){
      const kk = 0.02 / Math.sqrt(sp2);
      m.ix *= kk; m.iy *= kk;
    }
    // bioluminescence fades over a few seconds
    m.excite *= 0.984;
  }

  // advance pointer state; fast drags shed small ripples
  for (const c of currents.values()){
    const nvx = (c.nx - c.px), nvy = (c.ny - c.py);
    c.vx = c.vx * 0.15 + nvx * 0.85;
    c.vy = c.vy * 0.15 + nvy * 0.85;
    c.px = c.nx; c.py = c.ny;
    const sp = Math.sqrt(c.vx * c.vx + c.vy * c.vy);
    if (sp > 0.007 && now - c.lastRipple > 150){
      c.lastRipple = now;
      spawnRipple(c.nx, c.ny, 0.11, 0);
    }
  }

  // age ripples
  for (let i = ripples.length - 1; i >= 0; i--){
    ripples[i].age++;
    if (ripples[i].age > ripples[i].life) ripples.splice(i, 1);
  }
}

function frame(){
  t += 0.008;
  mx += (tmx - mx) * 0.04;
  my += (tmy - my) * 0.04;

  stir();
  const touching = currents.size > 0;

  // fade fill: calm motes smear almost invisibly, lit motes paint trails
  ctx.fillStyle = 'rgba(' + GROUND[0] + ',' + GROUND[1] + ',' + GROUND[2] + ',0.40)';
  ctx.fillRect(0, 0, W, H);

  const minD = Math.min(W, H);

  // ripples: faint luminous rings
  for (const rp of ripples){
    if (rp.age < 0) continue;
    const k = rp.age / rp.life;
    const rr = rp.maxR * (1 - Math.pow(1 - k, 2)) * minD;
    const a = 0.4 * (1 - k);
    if (a <= 0.01 || rr <= 1) continue;
    ctx.strokeStyle = 'hsla(172,60%,66%,' + a.toFixed(3) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(rp.x * W, rp.y * H, rr, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = 'hsla(172,60%,66%,' + (a * 0.35).toFixed(3) + ')';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(rp.x * W, rp.y * H, rr, 0, 6.2832); ctx.stroke();
  }

  // soft flash under each active finger
  for (const c of currents.values()){
    const px = c.nx * W, py = c.ny * H;
    const fg = ctx.createRadialGradient(px, py, 0, px, py, 110);
    fg.addColorStop(0, 'hsla(170,65%,60%,0.10)');
    fg.addColorStop(1, 'hsla(170,65%,60%,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(px, py, 110, 0, 6.2832); ctx.fill();
  }

  for (const m of motes){
    m.x += m.vx + m.ix; m.y += m.vy + m.iy;

    if (!touching){
      // DORMANT: drift inward toward the middle, dissolve, reborn at edges
      const ox = m.x - 0.5, oy = m.y - 0.5;
      const od = Math.sqrt(ox * ox + oy * oy) || 0.0001;
      m.x -= (ox / od) * 0.0005;
      m.y -= (oy / od) * 0.0005;
      if (od < 0.14) m.fade = Math.max(0, od / 0.14);
      if (m.fade <= 0.001 || od < 0.03) rebirthAtEdge(m);
    }

    if (m.x < -0.03) m.x = 1.03; if (m.x > 1.03) m.x = -0.03;
    if (m.y < -0.03) m.y = 1.03; if (m.y > 1.03) m.y = -0.03;
    m.ph += 0.008 * m.br;
    const e = m.excite;

    const breathe = 0.72 + 0.28 * Math.sin(m.ph);
    const px = m.x * W + mx * 34 * m.z;
    const py = m.y * H + my * 34 * m.z;

    // ignition shifts hue toward bioluminescent cyan and swells the mote
    const hue = m.hue + (166 - m.hue) * e;
    const sat = Math.min(m.sat + e * 28, 85);
    const lit = Math.min(m.lit + e * 34, 88);
    const rr = m.r * (0.55 + 0.65 * m.z) * (0.85 + 0.3 * breathe) * (1 + e * 0.75);
    let a = m.alpha * m.fade * (0.6 + 0.4 * breathe) * (1 + e * 1.35);
    if (a > 1) a = 1;

    // halo
    const gr = rr * 4 * (1 + e * 1.6);
    const g = ctx.createRadialGradient(px, py, 0, px, py, gr);
    g.addColorStop(0, 'hsla(' + hue.toFixed(1) + ',' + sat.toFixed(1) + '%,' + lit.toFixed(1) + '%,' + (0.32 * a).toFixed(3) + ')');
    g.addColorStop(1, 'hsla(' + hue.toFixed(1) + ',' + sat.toFixed(1) + '%,' + lit.toFixed(1) + '%,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, gr, 0, 6.2832); ctx.fill();

    // core
    ctx.fillStyle = 'hsla(' + hue.toFixed(1) + ',' + Math.min(sat + 8, 90).toFixed(1) + '%,' + Math.min(lit + 14, 90).toFixed(1) + '%,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(px, py, rr, 0, 6.2832); ctx.fill();

    // faint ring on some, brighter when lit
    if (m.ring){
      ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',' + sat.toFixed(1) + '%,' + lit.toFixed(1) + '%,' + (0.28 * a + e * 0.3).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(px, py, rr * m.ringR * (0.9 + 0.2 * breathe), 0, 6.2832); ctx.stroke();
    }
  }
  requestAnimationFrame(frame);
}

addEventListener('pointermove', function(e){
  tmx = e.clientX / W - 0.5;
  tmy = e.clientY / H - 0.5;
  const c = currents.get(e.pointerId);
  if (c){
    const p = normPos(e);
    c.nx = p[0]; c.ny = p[1];
  }
});

addEventListener('pointerdown', function(e){
  const p = normPos(e);
  currents.set(e.pointerId, { nx: p[0], ny: p[1], px: p[0], py: p[1], vx: 0, vy: 0, lastRipple: 0 });
  spawnRipple(p[0], p[1], 0.24, 0);      // touchdown pressure wave
  spawnRipple(p[0], p[1], 0.15, 14);     // trailing second ring
});

function endCurrent(e){
  currents.delete(e.pointerId);
  if (currents.size === 0){ tmx = 0; tmy = 0; }
}
addEventListener('pointerup', endCurrent);
addEventListener('pointercancel', endCurrent);

// Double-tap for a new tide (single taps only stir and ignite the water)
let lastTapT = 0, lastTapX = 0, lastTapY = 0;
addEventListener('pointerup', function(e){
  if (!e.isPrimary) return;
  const now = performance.now();
  const dt = now - lastTapT;
  const dd = Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY);
  if (dt < 350 && dd < 48){
    seed = (Math.random() * 1e9) | 0;
    compose(seed);
    lastTapT = 0;
  } else {
    lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
  }
});
addEventListener('contextmenu', function(e){ e.preventDefault(); });
addEventListener('resize', sizeCanvas);

sizeCanvas();
compose(seed);
// solid first paint so there is no flash of unpainted canvas
ctx.fillStyle = 'rgb(' + GROUND[0] + ',' + GROUND[1] + ',' + GROUND[2] + ')';
ctx.fillRect(0, 0, W, H);
frame();
</script>
</body>
</html>
