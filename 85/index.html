<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№85 · Perfect Zoom</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFFFFF; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(17,17,17,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to dive</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function css(c){ return 'rgb('+Math.round(clamp(c[0],0,255))+','+Math.round(clamp(c[1],0,255))+','+Math.round(clamp(c[2],0,255))+')'; }
function cosPal(v, cols){ const x=((v%1)+1)%1; const seg=x* (cols.length-1); const i=Math.min(cols.length-2, Math.floor(seg)); return mixc(cols[i], cols[i+1], seg-i); }

// No.85 Perfect Zoom: seeded PRNG "Perfect Zoom", 24 levels, phi scale, loop 30s
const LEVELS=24, PHI=(1+Math.sqrt(5))/2;
let dragPhase=null, dragging=false, sy0=0, holdUntil=-1;
function getPhase(t){
  if(dragging&&dragPhase!==null) return dragPhase;
  if(dragPhase!==null&&t<holdUntil) return dragPhase;
  return (t/30)%1;
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); const t=nowMs/1000;
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,w,h);
  const phone=isPhone();
  const S=phone? Math.min(w,h)*0.70 : Math.min(w,h)*0.68;
  const cx=w/2, cy=h/2, phase=getPhase(t), s=Math.pow(PHI, phase);
  ctx.strokeStyle='#111111'; ctx.lineWidth=1;
  let drawn=0;
  for(let k=0;k<LEVELS;k++){
    const half=(S/2)*s*Math.pow(1/PHI,k);
    if(half<0.7) continue;
    if(half>S*0.75) continue;
    let alpha=1;
    if(k===0) alpha=1-phase*0.9;
    if(half<3) alpha=phase;
    ctx.globalAlpha=clamp(alpha,0.06,1);
    const ang=k*8*Math.PI/180 + phase*8*Math.PI/180;
    const c=Math.cos(ang), sn=Math.sin(ang);
    const pts=[[-1,-1],[1,-1],[1,1],[-1,1]].map(p=>[cx+(p[0]*c-p[1]*sn)*half, cy+(p[0]*sn+p[1]*c)*half]);
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let q=1;q<4;q++) ctx.lineTo(pts[q][0],pts[q][1]); ctx.closePath(); ctx.stroke();
    drawn++;
  }
  ctx.globalAlpha=1;
  if(LEVELS!==24) console.assert(false,'levels',LEVELS);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; sy0=e.clientY; if(dragPhase===null) dragPhase=((performance.now()/1000)/30)%1; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; dragPhase=((dragPhase + (e.clientY-sy0)/600)%1+1)%1; sy0=e.clientY; });
function endP(){ if(dragging){ dragging=false; holdUntil=performance.now()/1000+4; } }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(7000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
