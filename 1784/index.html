<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Is One Inch</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EDDF; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F2EDDF';
var INK = '#1A1712';
var PLATE_FILL = '#EAE3CF';
var PLATE_LINE = 'rgba(26,23,18,0.4)';
var WORD_COLORS = ['#B0492F', '#3E5C8A', '#B98A2F', '#5A7A4A', '#6E5578'];
/* muted red, blue, ochre, green, violet, cycling one flat color per word */
var FRAME_T = 60.0; /* fixed phase: phrase 0, row 13, letter n, stroke half drawn */
var LETTER_T = 0.30; /* seconds per letter: stroke draw then a small pen hesitation */
var SPACE_T = 0.12; /* seconds per space: pen moves, no stroke */
var TICK_T = 0.12; /* seconds per punctuation tick in 4'33" */
var HOLD_T = 12.0; /* seconds the finished page holds before the next phrase */
var DRAW_FRAC = 0.7; /* first 70% of a letter interval draws the stroke, rest dwells */
var PHRASES = ["the silent world", "4'33\"", "surface of the moon"];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
/* Deterministic integer hash, fixed per (phrase, row, step): no Math.random(). */
function rnd(a, b, c) {
  var x = (Math.imul(a + 1, 374761393) ^ Math.imul(b + 1, 668265263) ^ Math.imul(c + 1, 1440667193)) >>> 0;
  x ^= x >>> 13;
  x = Math.imul(x, 1274126177) >>> 0;
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
/* Build the per-character step table for a phrase. Letters map to their
   alphabet position (a=1 .. z=26); digits map to their value (0 counts 10);
   punctuation becomes a short tick of length 1. Spaces move the pen. */
function buildSteps(text) {
  var steps = [], wordIdx = -1, inWord = false, i, ch, lower, d;
  for (i = 0; i < text.length; i++) {
    ch = text[i];
    if (ch === ' ') {
      steps.push({ ch: ch, kind: 'space', dur: SPACE_T, len: 0, word: -1 });
      inWord = false;
      continue;
    }
    if (!inWord) { wordIdx++; inWord = true; }
    lower = ch.toLowerCase();
    if (lower >= 'a' && lower <= 'z') {
      steps.push({ ch: ch, kind: 'letter', dur: LETTER_T, len: lower.charCodeAt(0) - 96, word: wordIdx });
    } else if (ch >= '0' && ch <= '9') {
      d = ch.charCodeAt(0) - 48;
      steps.push({ ch: ch, kind: 'digit', dur: LETTER_T, len: d === 0 ? 10 : d, word: wordIdx });
    } else {
      steps.push({ ch: ch, kind: 'tick', dur: TICK_T, len: 1, word: wordIdx });
    }
  }
  return steps;
}
var STEP_TABLES = [];
(function () {
  var i;
  for (i = 0; i < PHRASES.length; i++) STEP_TABLES.push(buildSteps(PHRASES[i]));
})();
function rowTime(p) {
  var t = 0, i;
  for (i = 0; i < STEP_TABLES[p].length; i++) t += STEP_TABLES[p][i].dur;
  return t;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var events = []; /* tap events: {t, p} each starts phrase p at piece time t */
var ROWS = 20;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
var S = 0; /* min field side, the scale unit */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;

  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';

    var mn = Math.min(window.screen.width, window.screen.height);

    F = { x: 0, y: 0, w: VW, h: VH };

    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };

     so the lattice fills the field at the same rate on desktop and phone:

  ROWS = 20;
}
function latticeTop() { return F.y + 96; }
function rowH() { return (F.h - 108) / ROWS; }
function rowBaseline(r) { return latticeTop() + r * rowH() + rowH() * 0.62; }
function phraseDuration(p) { return ROWS * rowTime(p) + HOLD_T; }
/* Closed-form schedule: which phrase, which row, how far into the row, at
   piece time t. Tap events cut the current phrase short and start the next. */
function phraseState(t) {
  var curT = 0, curP = 0, i, dur, endT, nextEv, el, rt, row;
  while (true) {
    dur = phraseDuration(curP);
    endT = curT + dur;
    nextEv = null;
    for (i = 0; i < events.length; i++) {
      if (events[i].t > curT && events[i].t <= t && events[i].t < endT) { nextEv = events[i]; break; }
    }
    if (nextEv) { curT = nextEv.t; curP = nextEv.p; continue; }
    if (t < endT) {
      el = t - curT;
      rt = rowTime(curP);
      row = Math.floor(el / rt);
      if (row >= ROWS) return { p: curP, phase: 'hold', row: ROWS - 1, rowT: el - ROWS * rt, step: -1, frac: 1 };

    }
    curT = endT;
    curP = (curP + 1) % PHRASES.length;

/* Which step of the current row is being laid at rowT seconds into the row,

function stepAt(p, rowT) {
  var steps = STEP_TABLES[p], acc = 0, i;
  for (i = 0; i < steps.length; i++) {

}
/* Stroke geometry for step j of phrase p in row r at piece time t.

function strokeGeom(p, r, j, t) {
  var steps = STEP_TABLES[p], st = steps[j];
  var slotW = F.w / steps.length;
  var ax = F.x + (j + 0.5) * slotW + (rnd(p, r, j * 3 + 1) - 0.5) * slotW * 0.25;
  var ay = rowBaseline(r) + (rnd(p, r, j * 3 + 2) - 0.5) * rowH() * 0.25;
  var ang = (rnd(p, r, j * 3 + 3) - 0.5) * 1.05 + 0.08 * Math.sin(TAU * t / 3600 + r * 0.9);
  var len = S * (0.010 + st.len * 0.0028);

}
function drawStroke(g, color, prog) {
  var px = g.ax + (g.ex - g.ax) * prog;
  var py = g.ay + (g.ey - g.ay) * prog;
  var lw = Math.max(1, 0.0022 * S);
  /* ink bleed: a wider faint pass under the crisp stroke */
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.16;
  ctx.lineWidth = lw * 2.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(g.ax, g.ay);
  ctx.lineTo(px, py);
  ctx.stroke();
  ctx.globalAlpha = 0.92;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(g.ax, g.ay);
  ctx.lineTo(px, py);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawLattice(t, st) {
  var p = st.p, steps = STEP_TABLES[p], r, j, cur, g, prog, color, head = null;
  var lastRow = st.phase === 'hold' ? ROWS - 1 : st.row;
  ctx.save();
  ctx.beginPath();
  ctx.rect(F.x, F.y, F.w, F.h);
  ctx.clip();
  for (r = 0; r <= lastRow; r++) {
    if (r < st.row || st.phase === 'hold') {
      /* completed row: every stroke fully laid */
      for (j = 0; j < steps.length; j++) {
        if (steps[j].kind === 'space') continue;
        g = strokeGeom(p, r, j, t);
        color = WORD_COLORS[steps[j].word % WORD_COLORS.length];
        drawStroke(g, color, 1);
        head = { x: g.ex, y: g.ey };
      }
    } else {
      /* current row: strokes up to the pen, current one partial */
      cur = stepAt(p, st.rowT);
      for (j = 0; j < cur.idx; j++) {
        if (steps[j].kind === 'space') continue;
        g = strokeGeom(p, r, j, t);
        color = WORD_COLORS[steps[j].word % WORD_COLORS.length];
        drawStroke(g, color, 1);
        head = { x: g.ex, y: g.ey };
      }
      if (cur.idx >= 0 && steps[cur.idx].kind !== 'space') {
        g = strokeGeom(p, r, cur.idx, t);
        color = WORD_COLORS[steps[cur.idx].word % WORD_COLORS.length];
        var drawPortion = DRAW_FRAC * steps[cur.idx].dur;
        var into = cur.frac * steps[cur.idx].dur;
        prog = clamp(into / drawPortion, 0, 1);
        prog = 1 - (1 - prog) * (1 - prog);
        drawStroke(g, color, prog);
        head = { x: g.ax + (g.ex - g.ax) * prog, y: g.ay + (g.ey - g.ay) * prog };
      }
    }
  }
  ctx.restore();
  /* reading head: a small ink pen tip at the stroke end, with a faint
     vertical guide hairline across the current row */
  if (head) {
    ctx.strokeStyle = 'rgba(26,23,18,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(head.x, rowBaseline(st.row) - rowH() * 0.55);
    ctx.lineTo(head.x, rowBaseline(st.row) + rowH() * 0.55);
    ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(head.x, head.y, Math.max(2, 0.004 * S), 0, TAU);
    ctx.fill();
  }
  return head;
}
function drawCaption(st) {
  var text = PHRASES[st.p];
  var px = isPhone ? 12 : 13;
  ctx.font = px + 'px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  /* measure the whole caption so it centres, then draw word by word in
     each word's flat color */
  var words = text.split(' ');
  var spaceW = ctx.measureText(' ').width;
  var totalW = 0, i;
  for (i = 0; i < words.length; i++) totalW += ctx.measureText(words[i]).width;
  totalW += spaceW * (words.length - 1);
  var x = F.x + (F.w - totalW) / 2;
  var y = F.y + 66;
  for (i = 0; i < words.length; i++) {
    ctx.fillStyle = WORD_COLORS[i % WORD_COLORS.length];
    ctx.fillText(words[i], x, y);
    x += ctx.measureText(words[i]).width + spaceW;
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('A Is One Inch').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('A Is One Inch').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 30').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('A Is One Inch', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2006 · 11 · 30', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap for the next phrase.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
var audioCtx = null;
var lastTickKey = '';
function maybeTick(st) {
  if (!audioCtx) return;
  var cur = stepAt(st.p, st.rowT);
  var key = st.p + ':' + st.row + ':' + cur.idx;
  if (key === lastTickKey) return;
  lastTickKey = key;
  if (st.phase !== 'draw' || STEP_TABLES[st.p][cur.idx].kind === 'space') return;
  try {
    if (audioCtx.state === 'suspended') return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1400;
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.09);
  } catch (e) { /* audio is optional; the piece works fully muted */ }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = phraseState(phaseT);
  drawLattice(phaseT, st);
  drawCaption(st);
  drawPlates();
  maybeTick(st);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    state: function () {
      var st = phraseState(phaseT);
      var cur = st.phase === 'draw' ? stepAt(st.p, st.rowT) : { idx: -1, frac: 1 };
      var head = null;
      if (st.phase === 'draw' && cur.idx >= 0 && STEP_TABLES[st.p][cur.idx].kind !== 'space') {
        var g = strokeGeom(st.p, st.row, cur.idx, phaseT);
        var prog = clamp((cur.frac * STEP_TABLES[st.p][cur.idx].dur) / (DRAW_FRAC * STEP_TABLES[st.p][cur.idx].dur), 0, 1);
        prog = 1 - (1 - prog) * (1 - prog);
        head = { x: g.ax + (g.ex - g.ax) * prog, y: g.ay + (g.ey - g.ay) * prog, anchorX: g.ax, anchorY: g.ay, angle: g.ang, len: g.len };
      }
      return { phrase: st.p, phraseText: PHRASES[st.p], phase: st.phase, row: st.row, rows: ROWS, rowT: st.rowT, rowTime: rowTime(st.p), stepIdx: cur.idx, stepChar: cur.idx >= 0 ? STEP_TABLES[st.p][cur.idx].ch : '', stepFrac: cur.frac, head: head };

    rowTime: function (p) { return rowTime(p); },

/* ---- frame one: fixed phase t = 60 s ---- */

phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);

  window.addEventListener('pointerdown', function () {
    /* tap switches to the next source phrase early; never reloads */
    var st = phraseState(phaseT);
    events.push({ t: phaseT, p: (st.p + 1) % PHRASES.length });

    var prevTs = null, clockT = 0;

}
</script>
