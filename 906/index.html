<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>little flowfeilds</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F5EFE0; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var GROUND = '#F5EFE0';
  var INDIGO = '#2E3A8C';
  var MUSTARD = '#D9A441';
  var MAROON = '#7A2A35';
  var EDGE = '#E2D7BE';
  var BAND_COLORS = [INDIGO, MUSTARD, MAROON];

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(90667);

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 9999;
    var sh = (window.screen && window.screen.height) || 9999;
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(50, Math.floor(w));
    H = Math.max(50, Math.floor(h));
    canvas.width = W;
    canvas.height = H;
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- flow field ----------
  // A field is a set of seeded sine phases. Velocity at a point combines
  // a tangential circulation (the fingerprint swirl) with a curl-like
  // wobble from summed sines, so streaks loop and fold inside the disc.
  function makeField(seed) {
    var r = mulberry32(seed);
    var terms = [];
    for (var i = 0; i < 4; i++) {
      terms.push({
        fx: 1.5 + r() * 3.0,
        fy: 1.5 + r() * 3.0,
        px: r() * Math.PI * 2,
        py: r() * Math.PI * 2,
        amp: 0.5 + r() * 0.9
      });
    }
    return {
      terms: terms,
      swirl: 0.75 + r() * 0.5,        // circulation strength
      spin: (r() - 0.5) * 0.05,       // slow pattern drift (rad/s)
      wob: 0.55 + r() * 0.4           // wobble weight
    };
  }

  // Velocity at a point (disc-local units): a tangential circulation plus
  // the curl of a summed-sine stream function. The stream function keeps
  // the flow divergence-free, so agents stay spread across the disc
  // instead of collapsing into the middle. Two fields can be blended
  // (vector lerp) during a reseed.
  function fieldVel(fa, fb, blend, x, y, t, out) {
    velOf(fa, x, y, t, out);
    if (fb && blend > 0) {
      var vx2 = velOf(fb, x, y, t, _tmp);
      out.x = out.x + (vx2.x - out.x) * blend;
      out.y = out.y + (vx2.y - out.y) * blend;
      var l = Math.sqrt(out.x * out.x + out.y * out.y) || 1;
      out.x /= l; out.y /= l;
    }
    return out;
  }
  var _tmp = { x: 0, y: 0 };

  function velOf(f, x, y, t, out) {
    var r = Math.sqrt(x * x + y * y);
    // tangential circulation (unit vector, radius-preserving)
    var tx = 0, ty = 0;
    if (r > 1e-5) { tx = -y / r; ty = x / r; }
    // stream function psi = sum amp * sin(fx*x + px + drift) * sin(fy*y + py)
    // velocity = (dpsi/dy, -dpsi/dx), evaluated analytically
    var sx = 0, sy = 0, i, tm;
    for (i = 0; i < f.terms.length; i++) {
      tm = f.terms[i];
      var ax = tm.fx * x + tm.px + t * 0.05;
      var ay = tm.fy * y + tm.py - t * 0.037;
      sy += tm.amp * tm.fy * Math.sin(ax) * Math.cos(ay);
      sx += -tm.amp * tm.fx * Math.cos(ax) * Math.sin(ay);
    }
    var sl = Math.sqrt(sx * sx + sy * sy);
    if (sl > 1e-5) { sx /= sl; sy /= sl; }
    var vx = tx * f.swirl + sx * f.wob;
    var vy = ty * f.swirl + sy * f.wob;
    var l = Math.sqrt(vx * vx + vy * vy) || 1;
    // slow rotation of the whole pattern over time
    var ca = Math.cos(f.spin * t), sa = Math.sin(f.spin * t);
    out.x = (vx / l) * ca - (vy / l) * sa;
    out.y = (vx / l) * sa + (vy / l) * ca;
    return out;
  }

  // ---------- disc of agents ----------
  function makeDisc(count, seed, radiusScale) {
    var r = mulberry32(seed);
    var agents = [];
    for (var i = 0; i < count; i++) {
      var a = r() * Math.PI * 2;
      var rad = Math.sqrt(r()) * 0.96;
      agents.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad, px: 0, py: 0 });
    }
    return {
      agents: agents,
      fieldA: makeField(seed + 11),
      fieldB: null,
      blend: 0,
      blending: false,
      radiusScale: radiusScale,
      rng: r
    };
  }

  var phone = isPhone();
  var mainDisc = makeDisc(phone ? 420 : 600, 101, 1.0);
  var satDisc = null;              // satellite disc (double-tap)
  var satState = 'off';            // off | in | hold | out
  var satTimer = 0;
  var satScale = 0;

  var DT = 1 / 60;
  var SPEED = 0.22;                // disc-radii per second (slow weather)

  var _vel = { x: 0, y: 0 };
  function stepDisc(disc, R, t) {
    var agents = disc.agents;
    for (var i = 0; i < agents.length; i++) {
      var a = agents[i];
      fieldVel(disc.fieldA, disc.fieldB, disc.blend, a.x, a.y, t, _vel);
      var sp = SPEED * (0.8 + 0.2 * Math.sin(t * 0.23 + i * 0.017));
      a.px = a.x; a.py = a.y;
      a.x += _vel.x * sp * DT;
      a.y += _vel.y * sp * DT;
      var rr = Math.sqrt(a.x * a.x + a.y * a.y);
      if (rr > 0.985 || rr < 0.015) {
        // respawn anywhere inside, seeded (uniform disc distribution)
        var na = disc.rng() * Math.PI * 2;
        var nr = Math.sqrt(disc.rng()) * 0.96;
        a.x = Math.cos(na) * nr; a.y = Math.sin(na) * nr;
        a.px = a.x; a.py = a.y;
      }
    }
    if (disc.blending) {
      disc.blend += DT / 2.0;      // 2 s reseed blend
      if (disc.blend >= 1) {
        disc.blend = 0;
        disc.blending = false;
        disc.fieldA = disc.fieldB;
        disc.fieldB = null;
      }
    }
  }

  function reseed(disc, seedSalt) {
    if (disc.blending) return;
    disc.fieldB = makeField((Math.floor(rng() * 1e9) + seedSalt) >>> 0);
    disc.blending = true;
    disc.blend = 0;
    // redistribute a share of the agents so the new weather reads as regrown
    for (var i = 0; i < disc.agents.length; i += 3) {
      var a = disc.agents[i];
      var na = disc.rng() * Math.PI * 2;
      var nr = Math.sqrt(disc.rng()) * 0.9;
      a.x = Math.cos(na) * nr; a.y = Math.sin(na) * nr;
      a.px = a.x; a.py = a.y;
    }
  }

  // ---------- interaction state ----------
  var simTime = 0;
  var offset = { x: 0, y: 0 };          // current disc offset (px)
  var offsetTarget = { x: 0, y: 0 };    // spring target while dragging
  var dragging = false;
  var downPos = null;
  var downTime = 0;
  var lastTapTime = -10;
  var moved = false;

  // ---------- audio (lazy, gesture-only, guarded) ----------
  var AC = null, shimmerGain = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    var Ctor = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!Ctor) return;
    try {
      AC = new Ctor();
      shimmerGain = AC.createGain();
      shimmerGain.gain.value = 0.0;
      var osc = AC.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = 5230;
      var lfo = AC.createOscillator();
      lfo.frequency.value = 0.13;
      var lfoGain = AC.createGain();
      lfoGain.gain.value = 0.006;
      lfo.connect(lfoGain);
      lfoGain.connect(shimmerGain.gain);
      osc.connect(shimmerGain);
      shimmerGain.connect(AC.destination);
      shimmerGain.gain.value = 0.012;
      osc.start();
      lfo.start();
    } catch (e) { AC = null; }
  }
  function tick() {
    if (!AC) return;
    try {
      var t = AC.currentTime;
      var o = AC.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(2600, t);
      o.frequency.exponentialRampToValueAtTime(1900, t + 0.09);
      var g = AC.createGain();
      g.gain.setValueAtTime(0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + 0.13);
    } catch (e) {}
  }

  function onTap() {
    var now = simTime;
    if (now - lastTapTime < 0.35) {
      // double-tap: the second field
      lastTapTime = -10;
      if (satState === 'off') {
        satDisc = makeDisc(phone ? 200 : 300, 707, 0.6);
        preroll(satDisc);
        satState = 'in';
        satTimer = 0;
      }
    } else {
      lastTapTime = now;
      reseed(mainDisc, 55);
      if (satDisc && satState !== 'off') reseed(satDisc, 91);
      tick();
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    dragging = true;
    moved = false;
    downPos = { x: e.clientX, y: e.clientY };
    downTime = simTime;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || !downPos) return;
    var dx = e.clientX - downPos.x;
    var dy = e.clientY - downPos.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    var maxOff = Math.min(W, H) * 0.04;
    var ox = dx * 0.25, oy = dy * 0.25;
    var len = Math.sqrt(ox * ox + oy * oy);
    if (len > maxOff) { ox = ox / len * maxOff; oy = oy / len * maxOff; }
    offsetTarget.x = ox;
    offsetTarget.y = oy;
  });
  function endPointer(e) {
    if (!dragging) return;
    dragging = false;
    offsetTarget.x = 0;
    offsetTarget.y = 0;
    if (!moved && simTime - downTime < 0.4) onTap();
    downPos = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- simulation ----------
  function step() {
    simTime += DT;
    var R = Math.min(W, H) * 0.125;
    stepDisc(mainDisc, R, simTime);
    // shy-disc spring: ease offset toward target (0 after release)
    offset.x += (offsetTarget.x - offset.x) * 0.08;
    offset.y += (offsetTarget.y - offset.y) * 0.08;
    // satellite lifecycle
    if (satState === 'in') {
      satTimer += DT;
      satScale = Math.min(1, satTimer / 0.6);
      stepDisc(satDisc, R * 0.6, simTime);
      if (satScale >= 1) { satState = 'hold'; satTimer = 0; }
    } else if (satState === 'hold') {
      satTimer += DT;
      stepDisc(satDisc, R * 0.6, simTime);
      if (satTimer >= 8) { satState = 'out'; satTimer = 0; }
    } else if (satState === 'out') {
      satTimer += DT;
      satScale = Math.max(0, 1 - satTimer / 1.0);
      stepDisc(satDisc, R * 0.6, simTime);
      if (satScale <= 0) { satState = 'off'; satDisc = null; }
    }
  }

  function preroll(disc) {
    for (var i = 0; i < 360; i++) stepDisc(disc, 1, i * DT);
  }
  preroll(mainDisc);
  // keep the global clock aligned with the pre-roll so frame one is the
  // synchronous draw of the pre-rolled state
  simTime = 0;

  // ---------- drawing ----------
  function drawDisc(disc, cx, cy, R, alphaScale) {
    // soft rim disc
    ctx.globalAlpha = 0.55 * alphaScale;
    ctx.fillStyle = EDGE;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // clip streaks to the disc
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.995, 0, Math.PI * 2);
    ctx.clip();
    var dip = disc.blending ? (1 - 0.55 * Math.sin(Math.min(1, disc.blend) * Math.PI)) : 1;
    ctx.globalAlpha = alphaScale * dip;
    ctx.lineWidth = Math.max(1, R * 0.016);
    ctx.lineCap = 'round';
    var agents = disc.agents;
    var band = 0, lastBand = -1;
    ctx.beginPath();
    for (var i = 0; i < agents.length; i++) {
      var a = agents[i];
      var vx = a.x - a.px, vy = a.y - a.py;
      var ang = Math.atan2(vy, vx);
      var norm = (ang + Math.PI) / (Math.PI * 2);   // 0..1
      band = Math.floor(norm * 3) % 3;
      var vlen = Math.sqrt(vx * vx + vy * vy) || 1;
      var hl = 0.030;                                // streak half-length, disc radii
      var ux = vx / vlen, uy = vy / vlen;
      var x1 = cx + (a.x - ux * hl) * R, y1 = cy + (a.y - uy * hl) * R;
      var x2 = cx + (a.x + ux * hl) * R, y2 = cy + (a.y + uy * hl) * R;
      if (band !== lastBand) {
        ctx.stroke();
        ctx.beginPath();
        ctx.strokeStyle = BAND_COLORS[band];
        lastBand = band;
      }
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
    }
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = alphaScale;
    ctx.strokeStyle = EDGE;
    ctx.lineWidth = Math.max(1, R * 0.02);
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var R = Math.min(W, H) * 0.125;   // disc diameter = 25% of smaller dimension
    var cx = W / 2 + offset.x;
    var cy = H / 2 + offset.y;
    if (satDisc && satState !== 'off') {
      var sR = R * 0.6 * satScale;
      var sx = cx + R * 1.55 * satScale;
      var sy = cy - R * 1.15 * satScale;
      if (sR > 1) drawDisc(satDisc, sx, sy, sR, satScale);
    }
    drawDisc(mainDisc, cx, cy, R, 1);
  }

  draw();  // frame one: synchronous, deterministic

  // ---------- main loop (fixed timestep) ----------
  var acc = 0, lastTs = null;
  function frame(ts) {
    if (lastTs === null) lastTs = ts;
    var elapsed = (ts - lastTs) / 1000;
    lastTs = ts;
    if (elapsed > 0.25) elapsed = 0.25;
    acc += elapsed;
    while (acc >= DT) { step(); acc -= DT; }
    draw();
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(frame);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
