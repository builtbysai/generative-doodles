<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tailor</title>
<style>
  html, body { margin: 0; padding: 0; background: #17161A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  /* Seeded PRNG (mulberry32). No Math.random anywhere. */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, panel = null, offcuts = [], LOOP = 60;
  var drags = []; /* {x, y, dx, dy, t} in panel coords, recorded events only */
  var pointer = null, lastPos = null;

  function isPhone() {
    try {
      var s = window.screen;
      if (s && s.width && s.height) return Math.min(s.width, s.height) < 700;
    } catch (e) {}
    return H > W * 1.15;
  }

  function size() {
    var vv = null;
    try { vv = window.visualViewport; } catch (e) {}
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = Math.round(w); canvas.height = Math.round(h);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    buildPanel();
  }

  /* Portrait panel: full-bleed on phones, centered portrait shape on desktop. */
  function buildPanel() {
    var px, py, pw, ph;
    if (isPhone()) { px = 0; py = 0; pw = W; ph = H; }
    else {
      ph = H * 0.92;
      pw = ph * 0.68;
      if (pw > W * 0.9) { pw = W * 0.9; ph = pw / 0.68; }
      px = (W - pw) / 2; py = (H - ph) / 2;
    }
    panel = { x: px, y: py, w: pw, h: ph };
  }

  /* Offcut polygon from pattern-piece anatomy: concave armhole curves,
     a notched neckline, long straight selvedge edges. */
  function makeOffcut(rng, cx, cy, r, red) {
    var n = 6 + Math.floor(rng() * 3); /* 6-8 vertices */
    var pts = [];
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + (rng() - 0.5) * 0.5;
      var rr = r * (0.72 + rng() * 0.5);
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.9]);
    }
    /* Mark edges: 1-2 concave, 1 notched. */
    var concave = {};
    var c1 = Math.floor(rng() * n);
    concave[c1] = true;
    if (rng() < 0.7) concave[(c1 + 3) % n] = true;
    var notch = Math.floor(rng() * n);
    return { pts: pts, cx: cx, cy: cy, concave: concave, notch: notch, red: red,
             fillA: red ? 0.38 : 0.16 + rng() * 0.12 };
  }

  function traceOffcut(o) {
    var pts = o.pts, n = pts.length;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 0; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n];
      if (o.concave[i]) {
        var mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
        var ccx = mx + (o.cx - mx) * 0.45, ccy = my + (o.cy - my) * 0.45;
        ctx.quadraticCurveTo(ccx, ccy, q[0], q[1]);
      } else if (o.notch === i) {
        var nx = (p[0] + q[0]) / 2 + (o.cx - (p[0] + q[0]) / 2) * 0.35;
        var ny = (p[1] + q[1]) / 2 + (o.cy - (p[1] + q[1]) / 2) * 0.35;
        ctx.lineTo(nx, ny);
        ctx.lineTo(q[0], q[1]);
      } else {
        ctx.lineTo(q[0], q[1]);
      }
    }
    ctx.closePath();
  }

  /* Generate the offcut set for a loop index. Deterministic per loop. */
  function generate(loop) {
    var rng = mulberry32(1296 + loop * 7919);
    var p = panel, u = Math.min(p.w, p.h);
    var list = [];
    var N = 10;
    /* Anchor angles around the periphery; offcuts 0 and 1 share a
       neighbourhood so they overlap like pinned pattern layers. */
    for (var i = 0; i < N; i++) {
      var ang;
      if (i === 1) ang = list[0].ang + 0.22;
      else ang = (i / N) * Math.PI * 2 + (rng() - 0.5) * 0.35;
      var rx = p.w * 0.40, ry = p.h * 0.40;
      var ax = p.x + p.w / 2 + Math.cos(ang) * rx;
      var ay = p.y + p.h / 2 + Math.sin(ang) * ry;
      var r = u * (0.10 + rng() * 0.05);
      /* Clamp anchors so the whole offcut stays inside the panel. */
      var rMax = r * 1.22 * 1.1;
      ax = Math.max(p.x + rMax, Math.min(p.x + p.w - rMax, ax));
      ay = Math.max(p.y + rMax, Math.min(p.y + p.h - rMax, ay));
      var o = makeOffcut(rng, ax, ay, r, i === 3);
      o.ang = ang; o.ax = ax; o.ay = ay; o.rMax = rMax;
      o.ox = (rng() - 0.5) * p.w * 0.06; /* orbit ellipse radii */
      o.oy = (rng() - 0.5) * p.h * 0.06;
      o.period = 42 + rng() * 30;
      o.phase = rng() * Math.PI * 2;
      o.rotBase = (rng() - 0.5) * 0.5;
      list.push(o);
    }
    return list;
  }

  function smooth(a, b, x) {
    if (x <= a) return 0;
    if (x >= b) return 1;
    var t = (x - a) / (b - a);
    return t * t * (3 - 2 * t);
  }

  function draw(t) {
    var loop = Math.floor(t / LOOP);
    if (!offcuts._loop || offcuts._loop !== loop) {
      offcuts = generate(loop);
      offcuts._loop = loop;
    }
    var p = panel;
    ctx.fillStyle = '#17161A';
    ctx.fillRect(0, 0, W, H);
    /* Panel ground: same charcoal, so the portrait shape reads on desktop
       through the offcut field alone; phone is full-bleed already. */
    var cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    var cyclePhase = (t % LOOP) / LOOP;
    var refuser = loop % offcuts.length;
    /* Refusal bump: approach 0.25-0.45, hold, retreat 0.55-0.75. */
    var bump = smooth(0.25, 0.45, cyclePhase) * (1 - smooth(0.55, 0.75, cyclePhase));

    for (var i = 0; i < offcuts.length; i++) {
      var o = offcuts[i];
      var th = o.phase + (Math.PI * 2 * t) / o.period;
      var x = o.ax + Math.cos(th) * o.ox;
      var y = o.ay + Math.sin(th) * o.oy;
      if (i === refuser) {
        x += (cx - x) * 0.10 * bump;
        y += (cy - y) * 0.10 * bump;
      }
      /* Drag perturbation: closed-form over recorded drag events. */
      var dx = 0, dy = 0;
      for (var d = 0; d < drags.length; d++) {
        var e = drags[d];
        var age = t - e.t;
        if (age < 0 || age > 4) continue;
        var ddx = x - e.x, ddy = y - e.y;
        var dist = Math.sqrt(ddx * ddx + ddy * ddy) + 1;
        var fall = 1 / (1 + dist / (p.w * 0.25));
        var decay = Math.exp(-age / 1.2);
        dx += e.dx * fall * decay * 0.35;
        dy += e.dy * fall * decay * 0.35;
      }
      x += dx; y += dy;
      /* Keep offcuts out of the empty middle third. */
      var hw = p.w * 0.18, hh = p.h * 0.23;
      if (Math.abs(x - cx) < hw && Math.abs(y - cy) < hh) {
        var sx = (x >= cx) ? 1 : -1, sy = (y >= cy) ? 1 : -1;
        if (Math.abs(x - cx) / hw < Math.abs(y - cy) / hh) x = cx + sx * hw;
        else y = cy + sy * hh;
      }
      var rot = o.rotBase + Math.sin((Math.PI * 2 * t) / LOOP + o.phase) * 0.06;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.translate(-o.ax, -o.ay);
      /* Fill: translucent linen, or the single red interrupt. */
      ctx.fillStyle = o.red ? '#7A2E2B' : '#D8CFC0';
      ctx.globalAlpha = o.fillA;
      traceOffcut(o);
      ctx.fill();
      ctx.globalAlpha = 1;
      /* Brass contour thread. */
      ctx.strokeStyle = '#B8935A';
      ctx.lineWidth = Math.max(1, p.w * 0.002);
      traceOffcut(o);
      ctx.stroke();
      /* Inner seam: dashed, inset toward centroid. */
      ctx.save();
      ctx.translate(o.ax, o.ay);
      ctx.scale(0.8, 0.8);
      ctx.translate(-o.ax, -o.ay);
      ctx.strokeStyle = '#6B6257';
      ctx.setLineDash([6, 5]);
      ctx.lineWidth = Math.max(1, p.w * 0.0015);
      traceOffcut(o);
      ctx.stroke();
      ctx.restore();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    try { ctx.setLineDash([]); } catch (e) {}
  }

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var x = (e.clientX !== undefined ? e.clientX : e.touches[0].clientX) - r.left;
    var y = (e.clientY !== undefined ? e.clientY : e.touches[0].clientY) - r.top;
    return { x: x, y: y };
  }

  function now() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - T0) / 1000;
    return 0;
  }

  var T0 = 0, armed = false;
  function loop(ts) {
    if (!armed) { T0 = ts; armed = true; }
    var t = (ts - T0) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }

  canvas.addEventListener('pointerdown', function (e) {
    pointer = pos(e); lastPos = pointer;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pointer) return;
    var q = pos(e);
    drags.push({ x: q.x, y: q.y, dx: q.x - lastPos.x, dy: q.y - lastPos.y, t: now() });
    if (drags.length > 40) drags.shift();
    lastPos = q;
  });
  function endDrag() { pointer = null; lastPos = null; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  function onResize() {
    size();
    draw(armed ? now() : 0);
  }
  var vv = null;
  try { vv = window.visualViewport; } catch (e) {}
  if (vv && vv.addEventListener) vv.addEventListener('resize', onResize);
  window.addEventListener('resize', onResize);

  size();
  draw(0); /* Boot flag: frame one is exactly t = 0. */
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
