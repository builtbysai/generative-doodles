<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quipu Field</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0D0B09; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): raw-wool cord fiber, four knot categories
  // (red, brown, charcoal, ochre), dark void. Nothing else.
  var FIBER = '#E8DDC8';
  var KNOT_RED = '#A83232';
  var KNOT_BROWN = '#5C3A21';
  var KNOT_CHAR = '#2A2A2A';
  var KNOT_OCHRE = '#C07A3A';
  var GROUND = '#0D0B09';
  var KNOT_COLORS = [KNOT_RED, KNOT_BROWN, KNOT_CHAR, KNOT_OCHRE];

  var BASE_SEED = 689001;
  var N_CORDS = 120;        // desktop record count
  var N_CORDS_PHONE = 84;   // thinned on phones, center-weighted
  var BREATH_S = 26;        // master breath period, seconds
  var FORCE_T = -1;         // QA hook: -1 = live clock, else fixed elapsed

  // QA seed hook: ?seed=tNN pins the elapsed time (headless phase checks).
  try {
    if (typeof location !== 'undefined' && location.search) {
      var qm = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
      if (qm) FORCE_T = parseFloat(qm[1]);
    }
  } catch (e) { /* live mode */ }

  // Seeded RNG (mulberry32). The whole census is generated from this
  // one stream at init and never changes: the data is stable.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ------------------------------------------------------------------
  // The census. Each cord is one record:
  //   anchor u     : horizontal position, triangular (center-weighted)
  //                  so the field gathers like a sheaf
  //   lenFrac      : cord length, 0.40..0.95 of frame height
  //   phase/omega  : pendulum sway, omega from length (longer = slower)
  //   clusters[]   : knot clusters down the cord. Per cluster:
  //                    v   = position along the cord (the sequence axis)
  //                    cat = category, shown as knot colour
  //                    mag = magnitude 1..5, shown as bead size + count
  // No legend is drawn anywhere: the unreadability is the point.
  // ------------------------------------------------------------------
  var cords = [];
  (function buildCensus() {
    var rng = mulberry32(BASE_SEED);
    var i, j;
    for (i = 0; i < N_CORDS; i++) {
      // Triangular distribution peaked at the centre.
      var u = 0.5 + (rng() + rng() - 1) * 0.52;
      u = clamp(u, 0.015, 0.985);
      var lenFrac = 0.40 + 0.55 * rng();
      var nCl = 3 + Math.floor(rng() * 7); // 3..9 clusters
      var clusters = [];
      for (j = 0; j < nCl; j++) {
        var cr = rng();
        var cat = cr < 0.30 ? 0 : (cr < 0.58 ? 1 : (cr < 0.78 ? 2 : 3));
        clusters.push({
          v: 0.08 + 0.89 * rng(),
          cat: cat,
          mag: 1 + Math.floor(rng() * 5),
          fuzzSeed: rng() * Math.PI * 2
        });
      }
      clusters.sort(function (a, b) { return a.v - b.v; });
      cords.push({
        u: u,
        lenFrac: lenFrac,
        phase: rng() * Math.PI * 2,
        omega: (Math.PI * 2 / 13.5) / Math.sqrt(lenFrac / 0.65),
        tipFrac: 0.034 + 0.030 * rng(),   // tip sway, fraction of length
        waveFrac: 0.010 + 0.008 * rng(),  // travelling undulation
        alpha: 0.50 + 0.45 * rng(),       // fibre tone variation
        clusters: clusters
      });
    }
    // Draw/keep order: centre cords last (on top). Phones keep the
    // innermost N_CORDS_PHONE records, preserving the sheaf density.
    cords.sort(function (a, b) {
      return Math.abs(b.u - 0.5) - Math.abs(a.u - 0.5);
    });
  })();

  // ------------------------------------------------------------------
  // Geometry and motion. Everything is a closed-form function of the
  // anchored elapsed time t (seconds since load). No integration, no
  // verlet: frame one is exactly draw(0).
  //
  // A cord hangs from (u*W, -2). Its lateral offset at depth v is a
  // pendulum term growing as v^1.6 (pinned at the top, free at the
  // tip) plus a small travelling wave, all scaled by the master
  // breath: sway amplitude swells and settles over BREATH_S seconds.
  // ------------------------------------------------------------------
  var W = 0, H = 0, S = 0, isPhone = false;
  var lastElapsed = 0;

  function breathMul(t) {
    return 0.80 + 0.35 * Math.sin((Math.PI * 2 * t) / BREATH_S - Math.PI / 2);
  }

  // Drag samples: pointer positions with the anchored time they were
  // recorded. A sample parts nearby cords; its push decays as a pure
  // function of (t - sample.t), wool-soft (tau ~2.4 s, gone by ~7 s).
  var samples = [];
  var dragging = false;

  function dragOffset(x, y, t) {
    var ox = 0;
    var R = S * 0.17;
    var R2 = R * R;
    for (var i = 0; i < samples.length; i++) {
      var sm = samples[i];
      var age = t - sm.t;
      if (age < 0 || age > 7) continue;
      var dx = x - sm.x, dy = y - sm.y;
      var d2 = dx * dx + dy * dy;
      if (d2 >= R2) continue;
      var d = Math.sqrt(d2) || 1;
      var fall = 1 - d / R;
      fall *= fall;
      ox += (dx / d) * fall * Math.exp(-age / 2.4) * S * 0.055;
    }
    var cap = S * 0.09;
    return clamp(ox, -cap, cap);
  }

  // Point on cord c at depth v (0 top .. 1 tip), time t.
  function cordPoint(c, v, t, out) {
    var lenPx = c.lenFrac * H;
    var sway = lenPx * c.tipFrac * Math.sin(c.omega * t + c.phase) * breathMul(t);
    var wave = lenPx * c.waveFrac *
      Math.sin(v * 2.6 - t * c.omega * 1.63 + c.phase * 1.7) * v * v;
    var x = c.u * W + sway * Math.pow(v, 1.6) + wave;
    var y = -2 + v * lenPx;
    x += dragOffset(x, y, t);
    out[0] = x; out[1] = y;
  }

  var SEG = 14; // samples per cord curve
  var pt = [0, 0];

  function drawCord(c, t) {
    var lenPx = c.lenFrac * H;
    var w0 = Math.max(1.1, S * 0.0023);
    var pts = [];
    var i, v;
    for (i = 0; i <= SEG; i++) {
      v = i / SEG;
      cordPoint(c, v, t, pt);
      pts.push([pt[0], pt[1]]);
    }
    // Tapering stroke: three passes, narrower toward the tip.
    ctx.strokeStyle = FIBER;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var groups = [[0, 5, w0], [5, 10, w0 * 0.78], [10, SEG, w0 * 0.55]];
    for (var g = 0; g < groups.length; g++) {
      ctx.globalAlpha = c.alpha * (g === 0 ? 0.85 : 0.95);
      ctx.lineWidth = groups[g][2];
      ctx.beginPath();
      for (i = groups[g][0]; i <= groups[g][1]; i++) {
        if (i === groups[g][0]) ctx.moveTo(pts[i][0], pts[i][1]);
        else ctx.lineTo(pts[i][0], pts[i][1]);
      }
      ctx.stroke();
    }
    // Knots: clusters of beads. Bead size grows with magnitude; beads
    // step along the cord and alternate sides like a wound binding.
    for (var k = 0; k < c.clusters.length; k++) {
      var cl = c.clusters[k];
      var beadR = S * (0.0026 + 0.00055 * cl.mag);
      var dvStep = (beadR * 1.8) / lenPx;
      ctx.fillStyle = KNOT_COLORS[cl.cat];
      for (var b = 0; b < cl.mag; b++) {
        var vv = cl.v + (b - (cl.mag - 1) / 2) * dvStep;
        if (vv < 0.02 || vv > 0.995) continue;
        cordPoint(c, vv, t, pt);
        var side = (b % 2 === 0) ? 1 : -1;
        var bx = pt[0] + side * beadR * 0.38;
        var by = pt[1];
        // Fibre fuzz: a few short radial strokes under the bead.
        ctx.globalAlpha = c.alpha * 0.5;
        ctx.strokeStyle = KNOT_COLORS[cl.cat];
        ctx.lineWidth = Math.max(0.6, beadR * 0.22);
        ctx.beginPath();
        for (var f = 0; f < 4; f++) {
          var fa = cl.fuzzSeed + f * 1.83 + b * 0.7;
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + Math.cos(fa) * beadR * 1.5,
                     by + Math.sin(fa) * beadR * 1.5);
        }
        ctx.stroke();
        ctx.globalAlpha = Math.min(1, c.alpha + 0.25);
        ctx.fillStyle = KNOT_COLORS[cl.cat];
        ctx.beginPath();
        ctx.arc(bx, by, beadR, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    lastElapsed = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var n = isPhone ? N_CORDS_PHONE : N_CORDS;
    // Cords are sorted edge-first, centre last: phones keep the LAST n
    // entries, i.e. the innermost records, preserving the sheaf.
    var start = cords.length - n;
    for (var i = start; i < cords.length; i++) drawCord(cords[i], t);
    // Prune spent drag samples (their push is a function of age).
    if (samples.length && t - samples[0].t > 8) {
      samples = samples.filter(function (sm) { return t - sm.t <= 8; });
    }
  }

  // ------------------------------------------------------------------
  // Pointer: drag through the field to part the cords, corridor-style.
  // ------------------------------------------------------------------
  function evtPos(e) {
    var r = null;
    if (canvas.getBoundingClientRect) {
      try { r = canvas.getBoundingClientRect(); } catch (err) { r = null; }
    }
    var x = (e.clientX !== undefined) ? e.clientX : 0;
    var y = (e.clientY !== undefined) ? e.clientY : 0;
    if (r) { x -= r.left; y -= r.top; }
    return [x, y];
  }

  function addSample(e) {
    var p = evtPos(e);
    samples.push({ x: p[0], y: p[1], t: lastElapsed });
    if (samples.length > 300) samples.splice(0, samples.length - 300);
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      addSample(e);
      if (canvas.setPointerCapture && e.pointerId !== undefined) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
      }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      addSample(e);
    });
    var endDrag = function () { dragging = false; };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', endDrag);
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    S = Math.min(W, H);
    if (window.screen) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = H > W * 1.15;
    }
    draw(lastElapsed);
  }

  resize();
  draw(FORCE_T >= 0 ? FORCE_T : 0);

  if (typeof window.requestAnimationFrame === 'function') {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var raf = function () {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : t0;
      draw(FORCE_T >= 0 ? FORCE_T : (now - t0) / 1000);
      window.requestAnimationFrame(raf);
    };
    window.requestAnimationFrame(raf);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
