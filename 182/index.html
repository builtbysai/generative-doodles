<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.182 Kogame Curvature</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#17171B; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font:12px system-ui, sans-serif; color:#B9B4A6; opacity:0.55;
    pointer-events:none; letter-spacing:0.04em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag to bend, tap to reshuffle</div>
<script>
(function () {
'use strict';
// No.182 Kogame Curvature (Goodman-Strauss). A woven field of paper
// strips in seven flat colours, over-under-over; at every crossing a
// small ground-coloured polygon punches the hole, and the number of
// its sides is the curvature: 5 sides cup the weave up like a sphere,
// 6 lie flat, 7 flare it hyperbolic. Dragging right steps the holes
// under the finger 5 to 6 to 7 (left reverses) and the surface
// buckles locally; a tap reshuffles the strip colour order. Untouched,
// a slow 60 second morph cycles flat to flare to cup to flat.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#17171B';
var STRIPS = ['#D9481C', '#F2B233', '#1FA88A', '#2E3A9B', '#7B2D8B', '#6A994E', '#23232A'];
var W = 0, H = 0;
var NX = 13, NY = 10;           // cells across / down
var px = 10, py = 10;           // cell pitch
var seed = 182182;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;

function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, r) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ---- colour order -------------------------------------------------
var permH = [], permV = [];
function reseedColors(s) {
  var r = rng(s);
  permH = shuffle([0, 1, 2, 3, 4, 5, 6], r);
  permV = shuffle([0, 1, 2, 3, 4, 5, 6], r);
}
reseedColors(seed);

// ---- curvature field ----------------------------------------------
// cur[i][j]: current continuous curvature, +1 = cup (5 holes),
// 0 = flat (6), -1 = flare (7). usr[i][j]: drag override target or null.
var cur = [], usr = [];
function buildField() {
  cur = []; usr = [];
  for (var i = 0; i < NX; i++) {
    cur.push([]); usr.push([]);
    for (var j = 0; j < NY; j++) { cur[i].push(0); usr[i].push(null); }
  }
}
// base landscape: a cupped hill upper middle, a hyperbolic flare
// lower left, flat plain elsewhere (smooth modes + two blobs)
function landscape(i, j) {
  var u = i / (NX - 1), v = j / (NY - 1);
  var base = 0.15 * Math.sin(u * Math.PI * 1.25 + 0.4) * Math.cos(v * Math.PI * 0.9 + 0.2);
  var cup = Math.exp(-(((u - 0.64) * (u - 0.64)) / 0.045 + ((v - 0.30) * (v - 0.30)) / 0.06));
  var flare = Math.exp(-(((u - 0.28) * (u - 0.28)) / 0.05 + ((v - 0.74) * (v - 0.74)) / 0.055));
  return Math.max(-1, Math.min(1, base + 1.18 * cup - 1.18 * flare));
}
// idle morph bias: flat (0) -> flare (-0.55) -> cup (+0.55) -> flat,
// keyframed over the 60s cycle, cosine eased between keys
var MORPH_KEYS = [0, -0.55, 0.55, 0];
function morphBias(t) {
  var ph = (t % 60) / 60 * 3;
  var k = Math.floor(ph) % 3, f = ph - Math.floor(ph);
  var e = 0.5 - 0.5 * Math.cos(f * Math.PI);
  return MORPH_KEYS[k] + (MORPH_KEYS[k + 1] - MORPH_KEYS[k]) * e;
}
var morphHoldUntil = -1; // seconds; drag pauses the morph
function targetC(i, j, t) {
  if (usr[i][j] !== null) return usr[i][j];
  var b = (t < morphHoldUntil) ? morphBias(morphHoldUntil) : morphBias(t);
  return Math.max(-1, Math.min(1, landscape(i, j) * 0.85 + b));
}
function holeCount(i, j) {
  var c = Math.max(-1, Math.min(1, cur[i][j]));
  return 6 - Math.round(c); // +1 cup -> 5, 0 flat -> 6, -1 flare -> 7
}
// smooth curvature at fractional cell coords (for the height field)
function curvAt(fx, fy) {
  var i0 = Math.max(0, Math.min(NX - 2, Math.floor(fx)));
  var j0 = Math.max(0, Math.min(NY - 2, Math.floor(fy)));
  var ax = Math.max(0, Math.min(1, fx - i0)), ay = Math.max(0, Math.min(1, fy - j0));
  var a = cur[i0][j0], b = cur[i0 + 1][j0], c = cur[i0][j0 + 1], d = cur[i0 + 1][j0 + 1];
  return (a * (1 - ax) + b * ax) * (1 - ay) + (c * (1 - ax) + d * ax) * ay;
}
// warp a flat point by the height field: raised (cupped) areas lift
// toward the viewer and swell slightly; flares sink and spread
function warp(x, y) {
  var z = curvAt(x / px - 0.5, y / py - 0.5); // -1..1
  var amp = py * 1.05;
  var sx = x + (x - W / 2) * z * 0.16;
  var sy = y - z * amp * 0.72 + (y - H / 2) * z * 0.05;
  return [sx, sy, z];
}

function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var portrait = H > W * 1.15;
  var nx = portrait ? 9 : 13, ny = portrait ? 14 : 10;
  if (nx !== NX || ny !== NY || !cur.length) {
    NX = nx; NY = ny; buildField();
    // pre-roll the field to its developed state so frame one is settled
    for (var i = 0; i < NX; i++) for (var j = 0; j < NY; j++) cur[i][j] = targetC(i, j, 25);
  }
  px = W / NX; py = H / NY;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- strip drawing --------------------------------------------------
// one strip segment across cell (i,j): fam 0 = horizontal band of row j,
// fam 1 = vertical band of column i. Corners warped; shade from slope.
function segQuad(i, j, fam) {
  var gapX = px * 0.16, gapY = py * 0.16;
  var x0, y0, x1, y1;
  if (fam === 0) { x0 = i * px; x1 = (i + 1) * px; y0 = j * py + gapY; y1 = (j + 1) * py - gapY; }
  else { y0 = j * py; y1 = (j + 1) * py; x0 = i * px + gapX; x1 = (i + 1) * px - gapX; }
  return [warp(x0, y0), warp(x1, y0), warp(x1, y1), warp(x0, y1)];
}
function fillQuad(q, color) {
  ctx.beginPath();
  ctx.moveTo(q[0][0], q[0][1]);
  ctx.lineTo(q[1][0], q[1][1]);
  ctx.lineTo(q[2][0], q[2][1]);
  ctx.lineTo(q[3][0], q[3][1]);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}
function shadeQuad(q, fam) {
  // shadow where the surface slopes away from the light (upper left)
  var zc = (q[0][2] + q[1][2] + q[2][2] + q[3][2]) / 4;
  var slope = fam === 0 ? (q[1][2] - q[0][2]) : (q[3][2] - q[0][2]);
  var a = Math.max(0, Math.min(0.24, (0.06 - slope * 1.1) * 0.45 + (zc < 0 ? -zc * 0.16 : 0)));
  if (a > 0.01) {
    ctx.globalAlpha = a;
    fillQuad(q, GROUND);
    ctx.globalAlpha = 1;
  }
}
function drawSeg(i, j, fam, over) {
  var q = segQuad(i, j, fam);
  var col = STRIPS[(fam === 0 ? permH[j % 7] : permV[i % 7])];
  if (over) {
    // ground gap pass: a slightly larger ground quad beneath the over strip
    var cx = (q[0][0] + q[2][0]) / 2, cy = (q[0][1] + q[2][1]) / 2;
    var big = q.map(function (p) { return [cx + (p[0] - cx) * 1.10, cy + (p[1] - cy) * 1.16, p[2]]; });
    fillQuad(big, GROUND);
  }
  fillQuad(q, col);
  shadeQuad(q, fam);
}
function drawHole(i, j) {
  var c = warp((i + 0.5) * px, (j + 0.5) * py);
  var h = holeCount(i, j);
  var r = Math.min(px, py) * 0.20;
  var rot = -Math.PI / 2 + (i + j) * 0.22;
  ctx.beginPath();
  for (var k = 0; k < h; k++) {
    var a = rot + k / h * Math.PI * 2;
    var X = c[0] + r * Math.cos(a), Y = c[1] + r * Math.sin(a);
    if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
  ctx.fillStyle = GROUND;
  ctx.fill();
}

var OFFSET = 25; // seconds into the morph: frame one is a settled mixed landscape
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var t = now / 1000 + OFFSET;
  // ease curvature toward targets (spring-ish, ~3/s)
  var stepK = 0.045;
  for (var i = 0; i < NX; i++) for (var j = 0; j < NY; j++) {
    var tg = targetC(i, j, t);
    cur[i][j] += (tg - cur[i][j]) * stepK;
  }
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var i2, j2;
  // under segments first, then over segments (alternating per crossing)
  for (var pass = 0; pass < 2; pass++) {
    for (j2 = 0; j2 < NY; j2++) for (i2 = 0; i2 < NX; i2++) {
      var hTop = ((i2 + j2) % 2 === 0);
      if ((pass === 1) === hTop) drawSeg(i2, j2, 0, pass === 1);
      if ((pass === 1) === !hTop) drawSeg(i2, j2, 1, pass === 1);
    }
  }
  for (j2 = 0; j2 < NY; j2++) for (i2 = 0; i2 < NX; i2++) drawHole(i2, j2);
}

// ---- interaction ------------------------------------------------------
var dragging = false, downAt = 0, downX = 0, downY = 0, lastX = 0, accum = 0, stepped = false;
function cellAt(x, y) {
  return [Math.max(0, Math.min(NX - 1, Math.floor(x / px))), Math.max(0, Math.min(NY - 1, Math.floor(y / py)))];
}
function stepHoles(cx, cy, dir) {
  // step the hole count under the finger: right raises h (toward 7),
  // left lowers it (toward 5); falloff over a ~2.2 cell radius
  for (var i = 0; i < NX; i++) for (var j = 0; j < NY; j++) {
    var d = Math.sqrt((i - cx) * (i - cx) + (j - cy) * (j - cy));
    if (d > 2.2) continue;
    var base = usr[i][j] !== null ? usr[i][j] : (6 - Math.round(Math.max(-1, Math.min(1, landscape(i, j) * 0.85 + morphBias(performance.now() / 1000 + OFFSET)))));
    // convert hole count to curvature target: h=5 -> +1, 6 -> 0, 7 -> -1
    var nh = Math.max(5, Math.min(7, base + dir));
    usr[i][j] = 6 - nh;
  }
}
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; stepped = false; accum = 0;
  downAt = e.timeStamp; downX = lastX = e.clientX; downY = e.clientY;
  morphHoldUntil = e.timeStamp / 1000 + OFFSET + 4;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var dx = e.clientX - lastX; lastX = e.clientX;
  accum += dx;
  morphHoldUntil = e.timeStamp / 1000 + OFFSET + 4;
  var thresh = px * 0.55;
  if (Math.abs(accum) >= thresh) {
    var cell = cellAt(e.clientX, e.clientY);
    stepHoles(cell[0], cell[1], accum > 0 ? 1 : -1);
    stepped = true;
    accum = 0;
  }
});
canvas.addEventListener('pointerup', function (e) {
  dragging = false;
  var moved = Math.sqrt((e.clientX - downX) * (e.clientX - downX) + (e.clientY - downY) * (e.clientY - downY));
  if (!stepped && e.timeStamp - downAt < 350 && moved < 8) {
    seed = (seed * 1103515245 + 12345) >>> 0;
    reseedColors(seed);
  }
});
canvas.addEventListener('pointercancel', function () { dragging = false; });

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
