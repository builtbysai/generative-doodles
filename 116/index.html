<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№116 · Driftsquare</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EDE4; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(26,21,18,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scrub the drift</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

// No.116 Driftsquare: one square stroked 400 times. Centres walk a small ring
// while the rotation twists by pi/88 per step, so the overlapping edges build a
// twisted ribbon loop out of pure moire density. One ink, one paper, nothing else.
// The drift advances on a seamless 40s loop; horizontal drag scrubs it directly.
const INK='#1A1512', PAPER='#F2EDE4';
const COUNT=400, LOOP=40;
let dragging=false, dragX0=0, scrub0=0, scrub=0;

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const tSec=nowMs/1000;
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,w,h);
  const S=Math.min(w,h);
  const cx=w/2, cy=h/2;
  const drift=((tSec%LOOP)/LOOP)*Math.PI*2 + scrub;
  const side=S*0.335;              // stack occupies about 70% of frame incl. ring
  const ringR=S*0.150;
  ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.globalAlpha=0.05;
  for(let i=0;i<COUNT;i++){
    const u=i/(COUNT-1);
    const pa=drift*0.6 + u*Math.PI*2;
    const x=cx+Math.cos(pa)*ringR;
    const y=cy+Math.sin(pa)*ringR;
    const ang=drift + i*(Math.PI/88);
    ctx.save();
    ctx.translate(x,y); ctx.rotate(ang);
    ctx.strokeRect(-side/2,-side/2,side,side);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  if(COUNT!==400) console.assert(false,'squares',COUNT);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; dragX0=e.clientX; scrub0=scrub; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const [w]=viewportWH(); scrub=scrub0+(e.clientX-dragX0)/w*Math.PI*2; });
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(2400);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
