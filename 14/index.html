<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№14 · Burst</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0c; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,240,228,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.85); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another burst</div>
<script>
'use strict';
// No14 Burst.
// Radial hairlines from a single off-center origin on near-black.
// Every ray's length is set by one angular function (two layered
// sines plus seeded jitter), so the burst swells and pinches around
// the circle instead of exploding evenly. Warm white throughout,
// except the contiguous sector where the function peaks, which is
// gold. A seed is accepted only if its peak sector is a modest slice
// of the circle, so the gold reads as a wedge, not a flood.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '14', 10) || 14;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0a0a0c';

function lenAt(p, a) {
  return 0.52
    + 0.30 * Math.sin(a * p.k1 + p.p1)
    + 0.18 * Math.sin(a * p.k2 + p.p2);
}

function compose(s) {
  const rnd = mulberry32(s);
  const p = {
    ox: 0.36 + rnd() * 0.28,
    oy: 0.36 + rnd() * 0.28,
    k1: 2 + ((rnd() * 3) | 0),
    k2: 3 + ((rnd() * 4) | 0),
    p1: rnd() * Math.PI * 2,
    p2: rnd() * Math.PI * 2,
    jr: rnd
  };
  // find the peak angle and the width of the gold band around it
  let peakA = 0, peakV = -1;
  for (let i = 0; i < 720; i++) {
    const a = (i / 720) * Math.PI * 2;
    const v = lenAt(p, a);
    if (v > peakV) { peakV = v; peakA = a; }
  }
  p.peakA = peakA;
  p.peakV = peakV;
  p.halfBand = 0.16 + rnd() * 0.14;      // radians each side of peak
  p.ok = peakV > 0.88 && p.halfBand < 0.34;
  return p;
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function angDiff(a, b) {
  let d = Math.abs(a - b) % (Math.PI * 2);
  return d > Math.PI ? Math.PI * 2 - d : d;
}

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;
  const cx = ox + p.ox * RX, cy = oy + p.oy * RY;
  const reach = Math.hypot(Math.max(cx - ox, ox + RX - cx), Math.max(cy - oy, oy + RY - cy));

  const RAYS = 330;
  const jrnd = mulberry32((seed ^ 0x27d4eb) >>> 0);
  ctx.lineWidth = Math.max(0.7, Math.min(RX, RY) / 1000);
  for (let i = 0; i < RAYS; i++) {
    const a = (i / RAYS) * Math.PI * 2;
    const len = Math.max(0.06, lenAt(p, a) + (jrnd() - 0.5) * 0.05) * reach * 0.98;
    const gold = angDiff(a, p.peakA) < p.halfBand;
    ctx.strokeStyle = gold ? 'rgba(212,175,55,0.85)' : 'rgba(245,240,228,0.55)';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
    ctx.stroke();
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
