<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Eye</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#000000';
var GOLD = [216, 169, 78];
var KNOT = [255, 246, 224];
var PLATE = '#16130c';
var PLATE_LINE = 'rgba(216,169,78,0.45)';
var TITLE_INK = '#f5ead0';
var HINT_INK = '#e8c87a';
var FIRST_T = 6.0;
var SPIN = 0.045;
var THREADS = 54;
var PARTICLES = 240;
var KNOT_DOTS = 140;
/* Golden threads wind around a knot that pulls every point inward.
   Thread angles are closed-form parametric functions of piece time
   (wound, crossing, never uniform spokes); particle positions are a
   closed-form function of piece time and a fixed seed table, so frame
   one is a fixed developed state: threads already crossing, knot
   glowing, points mid-spiral. The knot glow is additive alpha from
   drawn points only, never a gradient or sprite. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mix(a, b, f) {
  return [Math.round(a[0] + (b[0] - a[0]) * f),
    Math.round(a[1] + (b[1] - a[1]) * f),
    Math.round(a[2] + (b[2] - a[2]) * f)];
}
/* Fixed seed tables: thread windings and particle journeys. */
var rng = mulberry32(1667);
var threadParams = [];
var i;
for (i = 0; i < THREADS; i++) {
  threadParams.push({
    a0: rng() * TAU,
    windAmp: 0.35 + rng() * 0.65,
    windFreq: 1.5 + rng() * 3.0,
    windPhase: rng() * TAU,
    curve: 0.25 + rng() * 0.75,
    dir: rng() < 0.5 ? 1 : -1,
    alpha: 0.10 + rng() * 0.22,
    width: 0.7 + rng() * 0.9
  });
}
var particleParams = [];
for (i = 0; i < PARTICLES; i++) {
  particleParams.push({
    phase: rng(),
    rate: 0.014 + rng() * 0.030,
    a0: rng() * TAU,
    rOut: 0.55 + rng() * 0.45,
    turns: 1.2 + rng() * 1.8,
    dir: rng() < 0.5 ? 1 : -1,
    size: 0.8 + rng() * 1.6
  });
}
var knotDots = [];
for (i = 0; i < KNOT_DOTS; i++) {
  var ka = rng() * TAU;
  var kr = Math.pow(rng(), 0.5);
  knotDots.push({ a: ka, r: kr, s: 0.6 + rng() * 1.8, tw: rng() * TAU });
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function threadAngle(p, u, t) {
  return p.a0 + SPIN * t + p.dir * p.curve * u
    + p.dir * p.windAmp * Math.sin(p.windFreq * u * TAU * 0.5 + p.windPhase + 0.12 * t);
}
function drawThreads(t, cx, cy, S, Rmax, rk) {
  var i, s, u, r, ang, x, y;
  ctx.lineCap = 'round';
  for (i = 0; i < THREADS; i++) {
    var p = threadParams[i];
    ctx.beginPath();
    for (s = 0; s <= 44; s++) {
      u = s / 44;
      r = rk * 0.7 + (Rmax - rk * 0.7) * u;
      ang = threadAngle(p, u, t);
      x = cx + Math.cos(ang) * r;
      y = cy + Math.sin(ang) * r;
      if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = rgba(GOLD, p.alpha);
    ctx.lineWidth = p.width;
    ctx.stroke();
  }
}
function drawParticles(t, cx, cy, S, Rmax, rk) {
  var i, p, u, r, ang, x, y, col, a;
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < PARTICLES; i++) {
    p = particleParams[i];
    u = (t * p.rate + p.phase) % 1;
    r = rk + (p.rOut * Rmax - rk) * Math.pow(1 - u, 1.6);
    ang = p.a0 + SPIN * t * 0.6 + p.dir * p.turns * TAU * u;
    x = cx + Math.cos(ang) * r;
    y = cy + Math.sin(ang) * r;
    col = mix(GOLD, KNOT, clamp((u - 0.7) / 0.3, 0, 1));
    a = 0.22 + 0.62 * u;
    ctx.fillStyle = rgba(col, a);
    ctx.beginPath();
    ctx.moveTo(x + p.size, y);
    ctx.arc(x, y, p.size, 0, TAU);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawKnot(t, cx, cy, S, rk) {
  var i, d, rr, x, y, f, col, a;
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < KNOT_DOTS; i++) {
    d = knotDots[i];
    f = 0.5 + 0.5 * Math.sin(t * 0.9 + d.tw);
    rr = d.r * rk * 2.4;
    x = cx + Math.cos(d.a) * rr;
    y = cy + Math.sin(d.a) * rr;
    col = mix(GOLD, KNOT, 1 - d.r);
    a = (0.05 + 0.20 * (1 - d.r)) * (0.7 + 0.3 * f);
    ctx.fillStyle = rgba(col, a);
    ctx.beginPath();
    ctx.moveTo(x + d.s, y);
    ctx.arc(x, y, d.s, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = rgba(KNOT, 0.92);
  ctx.beginPath();
  ctx.moveTo(cx + rk * 0.45, cy);
  ctx.arc(cx, cy, rk * 0.45, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Golden Eye').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Golden Eye').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 05').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Golden Eye', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 05', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var S = Math.min(VW, VH);
  var cx = VW / 2, cy = VH / 2;
  var Rmax = Math.hypot(VW, VH) * 0.55;
  var rk = 0.035 * S;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawThreads(t, cx, cy, S, Rmax, rk);
  drawParticles(t, cx, cy, S, Rmax, rk);
  drawKnot(t, cx, cy, S, rk);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    threadCount: function () { return THREADS; },
    particleCount: function () { return PARTICLES; }
  };
}
/* ---- frame one: t = FIRST_T, a developed state ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
