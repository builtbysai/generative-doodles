<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№55 · Sonic Lumina</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#101010; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,228,216,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to send a wave</div>
<script>
'use strict';

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '55', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function artRect(w,h,full){
  if (full || isPhone()) return [0,0,w,h];
  const s=Math.min(w,h); return [(w-s)/2,(h-s)/2,s,s];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}

const PAL=['#d42b1e','#f5c518','#1c9fd6','#f28ab2','#2f9e44','#ef6c00','#b030a0','#0fa3a3','#e8e4d8'];
const rng=mulberry(seed*13+9);
const G=14;
const flags=[];
for(let i=0;i<G*G;i++){ const a=Math.floor(rng()*9); let b=Math.floor(rng()*9); if(b===a)b=(b+1)%9; flags.push({a,b,rot:Math.floor(rng()*4)}); }
let touchPt=null, touchStart=0;
function drawFlag(x,y,ww,hh,f,flip){
  const A=PAL[flip? f.b : f.a], B=PAL[flip? f.a : f.b];
  ctx.fillStyle=A; ctx.fillRect(x,y,ww,hh);
  ctx.fillStyle=B; ctx.beginPath();
  const r=f.rot;
  if(r===0){ ctx.moveTo(x,y+hh); ctx.lineTo(x+ww,y+hh); ctx.lineTo(x+ww,y); }
  else if(r===1){ ctx.moveTo(x,y); ctx.lineTo(x+ww,y); ctx.lineTo(x+ww,y+hh); }
  else if(r===2){ ctx.moveTo(x,y); ctx.lineTo(x+ww,y); ctx.lineTo(x,y+hh); }
  else { ctx.moveTo(x,y); ctx.lineTo(x,y+hh); ctx.lineTo(x+ww,y+hh); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=A; ctx.beginPath(); ctx.arc(x+ww/2,y+hh/2,Math.min(ww,hh)*0.30,0,Math.PI/2); ctx.closePath(); ctx.fill();
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#101010'; ctx.fillRect(0,0,w,h);
  const [rx,ry,rw,rh]=artRect(w,h,true);
  const t=(nowMs/1000)%22;
  const diag=rw+rh; const bandC=((t/22)*diag*1.6)% (diag*1.2);
  const s=rw/G, sh=rh/G;
  const cell=Math.min(s,sh);
  // use per-axis cell so grid fills rect exactly
  for(let gy=0;gy<G;gy++) for(let gx=0;gx<G;gx++){
    const f=flags[gy*G+gx];
    const cxp=rx+(gx+0.5)*s, cyp=ry+(gy+0.5)*sh;
    let flip=false;
    const d=(cxp-rx)+(cyp-ry);
    let dd=Math.abs(d-bandC); if(dd<diag*0.14) flip=true;
    if(touchPt){
      const dist=Math.hypot(cxp-touchPt.x,cyp-touchPt.y);
      const rad=((nowMs-touchStart)/1000)*Math.min(rw,rh)*0.45;
      if(Math.abs(dist-rad)<cell*0.9) flip=true;
    }
    drawFlag(rx+gx*s,ry+gy*sh,s+0.5,sh+0.5,f,flip);
  }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(8000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',ev=>{touchPt={x:ev.clientX,y:ev.clientY}; touchStart=performance.now();});
canvas.addEventListener('pointermove',ev=>{ if(touchPt) touchPt={x:ev.clientX,y:ev.clientY}; });
function endDrag(){ touchPt=null; }
canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));

</script>
</body>
</html>
