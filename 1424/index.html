<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doris Has No Clothes</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  // Seeded PRNG (mulberry32). Never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1424000);
  // Static dressing-room dust, seeded once.
  var dust = [];
  for (var di = 0; di < 90; di++) {
    dust.push([rnd(), rnd(), 0.5 + rnd() * 1.5]);
  }
  // Round fading alphas to 4 decimals (node-canvas quirk).
  function ra(v) { return Math.round(v * 10000) / 10000; }
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + ra(a) + ')';
  }
  function dot(x, y, r, color) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }
  function ellipse(x, y, rx, ry, color) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function line(x1, y1, x2, y2, w, color) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.stroke();
  }
  function poly(pts, color) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) { ctx.lineTo(pts[i][0], pts[i][1]); }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function isPhone() {
    if (typeof window.screen !== 'undefined' && window.screen.width && window.screen.height) {
      return Math.min(window.screen.width, window.screen.height) < 700;
    }
    return H > W * 1.15;
  }
  function size() {
    var vw = W, vh = H;
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    } else if (typeof window.innerWidth !== 'undefined') {
      vw = window.innerWidth; vh = window.innerHeight;
    }
    W = vw; H = vh;
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
  }
  size();
  if (typeof window.addEventListener !== 'undefined') {
    window.addEventListener('resize', function () { size(); draw(clockT); });
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(clockT); });
    }
  }

  // ---- Costumes: garment rigs, no body mesh underneath ----
  // Each draws centered at (cx, cy) with height h; pose in [0,1]-ish params.
  // The empty interior is always a soft dark volume (#2a241e), never a mannequin.
  var COSTUMES = [
    { name: 'feathered', draw: drawFeathered },
    { name: 'wig', draw: drawWig },
    { name: 'woodpecker', draw: drawWoodpecker },
    { name: 'carpet', draw: drawCarpet },
    { name: 'skeletal', draw: drawSkeletal },
    { name: 'vestment', draw: drawVestment }
  ];

  function drawFeathered(cx, cy, h, p) {
    var s = h / 300;
    var flare = 1 + p.flare * 0.9 + Math.sin(p.t * 2.2) * 0.12; // strut
    var bob = Math.sin(p.t * 4.4) * 4 * s;
    // Feather fan: radiating feather blades around the shoulders.
    for (var i = 0; i < 11; i++) {
      var ang = -Math.PI * 0.85 + i * (Math.PI * 0.7 / 10);
      var fx = cx + Math.cos(ang) * 78 * s * flare;
      var fy = cy - 52 * s + Math.sin(ang) * 52 * s * flare + bob * 0.4;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(ang + Math.PI / 2);
      ellipse(0, 0, 9 * s, 26 * s, i % 3 === 0 ? '#b01e24' : '#e8e2d4');
      ctx.restore();
    }
    // Bodice: garment shell over a dark empty volume.
    ellipse(cx, cy + bob, 52 * s, 78 * s, '#2a241e');
    poly([[cx - 46 * s, cy - 30 * s + bob], [cx + 46 * s, cy - 30 * s + bob],
          [cx + 34 * s, cy + 88 * s + bob], [cx - 34 * s, cy + 88 * s + bob]], '#e8e2d4');
    ellipse(cx, cy + 10 * s + bob, 30 * s, 52 * s, '#2a241e');
    dot(cx, cy - 88 * s + bob, 10 * s, '#b01e24'); // crest
  }
  function drawWig(cx, cy, h, p) {
    var s = h / 300;
    var sway = Math.sin(p.t * 1.8) * 6 * s;
    // Two wig cups (bikini top made of wigs) joined by straps.
    line(cx - 40 * s, cy - 10 * s, cx - 12 * s, cy - 26 * s, 3 * s, '#c89a3e');
    line(cx + 40 * s, cy - 10 * s, cx + 12 * s, cy - 26 * s, 3 * s, '#c89a3e');
    line(cx - 40 * s, cy - 10 * s, cx - 62 * s, cy - 40 * s, 3 * s, '#c89a3e');
    line(cx + 40 * s, cy - 10 * s, cx + 62 * s, cy - 40 * s, 3 * s, '#c89a3e');
    wigCup(cx - 30 * s + sway, cy, 34 * s);
    wigCup(cx + 30 * s - sway, cy, 34 * s);
    // Empty volume between and below the cups.
    ellipse(cx, cy + 52 * s, 26 * s, 40 * s, '#2a241e');
  }
  function wigCup(x, y, r) {
    ellipse(x, y, r, r * 0.9, '#c89a3e');
    for (var i = 0; i < 9; i++) {
      var ang = Math.PI * (0.15 + i * 0.0875);
      dot(x + Math.cos(ang) * r * 0.95, y + Math.sin(ang) * r * 0.85, r * 0.22, '#c89a3e');
    }
    ellipse(x, y, r * 0.45, r * 0.4, '#2a241e');
  }
  function drawWoodpecker(cx, cy, h, p) {
    var s = h / 300;
    var tap = Math.max(0, Math.sin(p.t * 6.0)) * 8 * s; // tapping register
    shoe(cx - 42 * s, cy + 30 * s - tap, s, 1);
    shoe(cx + 42 * s, cy + 30 * s, s, -1);
    // Laces rising like legs into the empty volume.
    line(cx - 42 * s, cy + 10 * s - tap, cx - 42 * s, cy - 70 * s, 3 * s, '#7a5a38');
    line(cx + 42 * s, cy + 10 * s, cx + 42 * s, cy - 70 * s, 3 * s, '#7a5a38');
    ellipse(cx, cy - 40 * s, 20 * s, 44 * s, '#2a241e');
  }
  function shoe(x, y, s, dir) {
    poly([[x - 30 * s, y], [x + 30 * s, y], [x + 34 * s, y + 16 * s], [x - 30 * s, y + 16 * s]], '#141210');
    ellipse(x + 10 * s * dir, y - 2 * s, 26 * s, 12 * s, '#b01e24');
    dot(x + 26 * s * dir, y - 14 * s, 5 * s, '#b01e24'); // woodpecker crest
    dot(x + 20 * s * dir, y - 14 * s, 3 * s, '#e8e2d4');
  }
  function drawCarpet(cx, cy, h, p) {
    var s = h / 300;
    var tilt = Math.sin(p.t * 1.4) * 0.12;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt);
    // Shaved head: bare top, carpet squares below.
    ellipse(0, -30 * s, 48 * s, 52 * s, '#e8e2d4');
    var sq = 15 * s;
    for (var r = -2; r <= 2; r++) {
      for (var c = -3; c <= 3; c++) {
        var px = c * sq, py = r * sq + 8 * s;
        if (px * px / (48 * s * 48 * s) + py * py / (52 * s * 52 * s) > 0.9) { continue; }
        rect(px - sq / 2, py - sq / 2, sq - 1, sq - 1,
          (r + c) % 2 === 0 ? '#7a5a38' : '#5a4028');
      }
    }
    ellipse(0, 10 * s, 24 * s, 30 * s, '#2a241e');
    ctx.restore();
  }
  function drawSkeletal(cx, cy, h, p) {
    var s = h / 300;
    var droop = 6 * s + Math.sin(p.t * 1.1) * 3 * s; // drooping register
    // Suit jacket, shoulders sagging.
    poly([[cx - 52 * s, cy - 60 * s + droop], [cx + 52 * s, cy - 60 * s + droop],
          [cx + 40 * s, cy + 90 * s], [cx - 40 * s, cy + 90 * s]], '#141210');
    // Ribcage lines on the empty volume.
    ellipse(cx, cy + 10 * s, 30 * s, 56 * s, '#2a241e');
    for (var i = 0; i < 5; i++) {
      var ry = cy - 30 * s + i * 18 * s;
      line(cx - 28 * s, ry, cx + 28 * s, ry, 2 * s, '#e8e2d4');
    }
    line(cx - 52 * s, cy - 60 * s + droop, cx - 66 * s, cy + 60 * s, 8 * s, '#141210');
    line(cx + 52 * s, cy - 60 * s + droop, cx + 66 * s, cy + 60 * s, 8 * s, '#141210');
    dot(cx, cy - 84 * s + droop, 8 * s, '#e8e2d4'); // collar bone, no head
  }
  function drawVestment(cx, cy, h, p) {
    var s = h / 300;
    var proc = Math.sin(p.t * 0.9) * 5 * s; // processing register
    poly([[cx - 46 * s, cy - 80 * s], [cx + 46 * s, cy - 80 * s],
          [cx + 58 * s, cy + 95 * s], [cx - 58 * s, cy + 95 * s]], '#e6ddc8');
    // Oversized cross.
    var cw = 16 * s, ch = 78 * s;
    rect(cx - cw / 2, cy - 60 * s + proc, cw, ch, '#b01e24');
    rect(cx - 44 * s, cy - 34 * s + proc, 88 * s, cw, '#b01e24');
    ellipse(cx, cy + 30 * s, 20 * s, 34 * s, '#2a241e');
    // Hem sway.
    line(cx - 58 * s, cy + 95 * s, cx + 58 * s, cy + 95 * s, 2 * s, '#c89a3e');
  }

  // ---- Parade state ----
  var CYCLE = 60, SLOT = 10;
  var drags = []; // {t, kind: 'stage'|'pose', idx, dx, dy}
  var stagedIdx = -1, stagedAt = -1e9;

  function paradeAt(t) {
    var ct = (t + 4) % CYCLE; // phase shift: frame one is mid-pose of costume 0
    var idx = Math.floor(ct / SLOT);
    var local = ct - idx * SLOT;
    var x, phase;
    if (local < 1.5) { // enter from the left
      var e = local / 1.5;
      x = -0.35 * W + (0.5 * W + 0.35 * W) * (e * e * (3 - 2 * e));
      phase = 'enter';
    } else if (local < 8.5) {
      x = 0.5 * W; phase = 'pose';
    } else { // exit to the right
      var f = (local - 8.5) / 1.5;
      x = 0.5 * W + (1.35 * W - 0.5 * W) * (f * f * (3 - 2 * f));
      phase = 'exit';
    }
    return { idx: idx, x: x, phase: phase, local: local };
  }
  function poseMod(t) {
    // Closed-form over the recorded drag list: recent pose drags add flare/speed, decaying tau 3s.
    var flare = 0, speed = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (d.kind !== 'pose') { continue; }
      var age = t - d.t;
      if (age < 0 || age > 12) { continue; }
      var w = Math.exp(-age / 3);
      flare += Math.min(1, Math.abs(d.dy) / 200) * w;
      speed += Math.min(1, Math.abs(d.dx) / 200) * w;
    }
    return { flare: Math.min(1, flare), speed: Math.min(1, speed) };
  }

  var clockT = 0;
  function draw(t) {
    clockT = t;
    // Stage ground.
    rect(0, 0, W, H, '#141210');
    // Dressing-room bulbs along the top.
    var nb = Math.max(5, Math.floor(W / 110));
    for (var b = 0; b < nb; b++) {
      var bx = (b + 0.5) * W / nb;
      dot(bx, 26, 7, '#f2c879');
      dot(bx, 26, 14, rgba('#f2c879', 0.18));
    }
    // Rail across the back.
    var railY = H * 0.20;
    line(0, railY, W, railY, 4, '#2a241e');
    var miniH = Math.min(90, H * 0.11);
    for (var i = 0; i < COSTUMES.length; i++) {
      var mx = (i + 0.5) * W / COSTUMES.length;
      ctx.save();
      ctx.globalAlpha = ra(0.9);
      COSTUMES[i].draw(mx, railY + miniH * 0.55, miniH, { t: t, flare: 0, speed: 0 });
      ctx.restore();
      // Rail hook.
      line(mx, railY, mx, railY + 8, 2, '#f2c879');
    }
    // Stage floor line.
    line(0, H * 0.86, W, H * 0.86, 2, '#2a241e');
    // Dust motes in the light.
    for (var d = 0; d < dust.length; d++) {
      var dx = dust[d][0] * W;
      var dy = dust[d][1] * H;
      dot(dx, dy, dust[d][2], rgba('#f2c879', 0.12));
    }
    // Center-stage costume.
    var mod = poseMod(t);
    var idx, cx, cy;
    var stageH = Math.min(H * 0.58, W * 0.62);
    cy = H * 0.55;
    if (t - stagedAt < 10 && stagedIdx >= 0) {
      idx = stagedIdx; cx = 0.5 * W; // dragged to stage: poses immediately
    } else {
      var par = paradeAt(t);
      idx = par.idx; cx = par.x;
    }
    var pose = { t: t * (1 + mod.speed * 0.8), flare: mod.flare, speed: mod.speed };
    COSTUMES[idx].draw(cx, cy, stageH, pose);
    // Audience side stays dark: vignette bars (flat alpha, never gradient).
    rect(0, H * 0.86, W, H * 0.14, rgba('#000000', 0.35));
  }

  // ---- Pointer: drag a rail costume to stage it; drag a staged costume to modulate pose ----
  var down = null;
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var x = (e.clientX - r.left) * (W / (r.width || W));
    var y = (e.clientY - r.top) * (H / (r.height || H));
    return [x, y];
  }
  function onDown(e) {
    var p = pos(e);
    down = { x: p[0], y: p[1], t: clockT };
  }
  function onMove(e) {
    if (!down) { return; }
    var p = pos(e);
    down.dx = p[0] - down.x;
    down.dy = p[1] - down.y;
  }
  function onUp(e) {
    if (!down) { return; }
    var p = pos(e);
    var dx = p[0] - down.x, dy = p[1] - down.y;
    var railY = H * 0.20;
    var moved = Math.abs(dx) + Math.abs(dy) > 12;
    if (moved) {
      if (Math.abs(down.y - railY) < 90) {
        // Dragged off the rail: stage the nearest costume immediately.
        var idx = Math.max(0, Math.min(5, Math.floor(down.x / W * 6)));
        stagedIdx = idx; stagedAt = clockT;
        drags.push({ t: clockT, kind: 'stage', idx: idx, dx: dx, dy: dy });
      } else if (Math.abs(down.x - 0.5 * W) < W * 0.3 && Math.abs(down.y - H * 0.55) < H * 0.35) {
        // Dragged the staged costume: pose modulation (feather flare / vestment pace).
        drags.push({ t: clockT, kind: 'pose', idx: stagedIdx, dx: dx, dy: dy });
      }
    }
    down = null;
  }
  if (typeof canvas.addEventListener !== 'undefined') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { down = null; });
  }

  // Frame one: synchronous constant-phase draw, clock starts only with the rAF loop.
  draw(0);
  var start = null;
  function loop(ts) {
    if (start === null) { start = ts; }
    var t = (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
