<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ancestral Altar</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0908; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a large archival portrait of an elder, sepia and soft, hangs in a
   dark room. A vertical field of teal light slowly bisects it, left to right
   and back, like a scanner made of dusk. Where the teal field crosses the
   face, fragments of sound rise: a bowed harmonic, a sung syllable, a
   breath. Between passes the room is almost silent, the portrait watching.
   The altar is never still but never hurries. */
var TAU = Math.PI * 2;
var GROUND = '#0A0908';
var WALL = '#14100D';
var FLOOR = '#060504';
var FRAME_WOOD = '#241A12';
var FRAME_WOOD_HI = '#3A2B1C';
var GOLD = '#C9A227';
var GOLD_SOFT = '#A8853A';
var SEPIA_BASE = '#8A6F4D';
var SEPIA_LIGHT = '#C9A87C';
var SEPIA_MID = '#A08055';
var SEPIA_DARK = '#5C4630';
var SEPIA_SHADOW = '#2E2116';
var TEAL = '#2E8B8B';
var TEAL_HI = '#4FB3A9';
var TEAL_DEEP = '#1E5A5A';
var PLATE = '#0D0C0B';
var PLATE_LINE = 'rgba(201,168,124,0.30)';
var TITLE_INK = '#E8DCC8';
var HINT_INK = '#9A8B74';
var FRAME_T = 74.0;        /* fixed phase for frame one: band mid-portrait */
var CYCLE = 34.0;          /* one full scan cycle, seconds */
var BAND_W = 0.11;         /* scan band width, fraction of portrait width */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- seeded grain: sparse archival flecks inside the portrait ---- */
var GRAIN = [];
(function () {
  var rng = mulberry32(1853);
  var i;
  for (i = 0; i < 90; i++) {
    GRAIN.push({
      x: rng(), y: rng(),
      r: 0.4 + rng() * 1.1,
      a: 0.03 + rng() * 0.07,
      warm: rng() > 0.5
    });
  }
})();
/* ---- abstract trigger regions: never drawn, never outlined ---- */
var ZONES = [
  { x: 0.50, y: 0.30, r: 0.13, name: 'eyes' },
  { x: 0.50, y: 0.44, r: 0.10, name: 'mouth' },
  { x: 0.30, y: 0.78, r: 0.11, name: 'hands' },
  { x: 0.70, y: 0.78, r: 0.11, name: 'hands' }
];
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The portrait is centered and large; the room barely shows at the edges. */
function portraitRect() {
  var pw = Math.min(VW * 0.80, VH * 0.58);
  var ph = pw * 1.5;
  if (ph > VH * 0.84) { ph = VH * 0.84; pw = ph / 1.5; }
  return { x: (VW - pw) / 2, y: (VH - ph) / 2, w: pw, h: ph };
}
/* Scan position: 0..1 across the portrait. Slow pass, a pause at each end,
   then the return pass. Irregular by construction, never hurried. */
function scanX(t) {
  var c = ((t % CYCLE) + CYCLE) % CYCLE;
  var f;
  if (c < 12) {
    f = c / 12;
    f = f * f * (3 - 2 * f);
  } else if (c < 16) {
    f = 1;
  } else if (c < 28) {
    f = (c - 16) / 12;
    f = f * f * (3 - 2 * f);
    f = 1 - f;
  } else {
    f = 0;
  }
  return f;
}
function drawRoom(sc, t) {
  var g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, WALL);
  g.addColorStop(0.72, GROUND);
  g.addColorStop(0.721, FLOOR);
  g.addColorStop(1, FLOOR);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
  /* barely visible wall seams and floor line */
  ctx.strokeStyle = 'rgba(201,168,124,0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(VW * 0.06, 0);
  ctx.lineTo(VW * 0.06, VH * 0.72);
  ctx.moveTo(VW * 0.94, 0);
  ctx.lineTo(VW * 0.94, VH * 0.72);
  ctx.moveTo(0, VH * 0.72);
  ctx.lineTo(VW, VH * 0.72);
  ctx.stroke();
  /* faint warm glow low on the wall, the altar's breath */
  var rg = ctx.createRadialGradient(VW / 2, VH * 0.86, 0, VW / 2, VH * 0.86, VW * 0.30);
  rg.addColorStop(0, 'rgba(201,162,39,0.05)');
  rg.addColorStop(1, 'rgba(201,162,39,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, VW, VH);
}
function drawPortrait(sc, t) {
  var pr = portraitRect();
  var i;
  /* frame: dark wood with a thin gold inner line */
  ctx.fillStyle = FRAME_WOOD;
  ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
  var fg = ctx.createLinearGradient(pr.x, pr.y, pr.x + pr.w, pr.y);
  fg.addColorStop(0, FRAME_WOOD_HI);
  fg.addColorStop(0.5, FRAME_WOOD);
  fg.addColorStop(1, FRAME_WOOD_HI);
  ctx.fillStyle = fg;
  ctx.fillRect(pr.x, pr.y, pr.w, 3);
  ctx.fillRect(pr.x, pr.y + pr.h - 3, pr.w, 3);
  ctx.fillRect(pr.x, pr.y, 3, pr.h);
  ctx.fillRect(pr.x + pr.w - 3, pr.y, 3, pr.h);
  var ix = pr.x + 8, iy = pr.y + 8, iw = pr.w - 16, ih = pr.h - 16;
  ctx.strokeStyle = rgba(GOLD, 0.55);
  ctx.lineWidth = 1;
  ctx.strokeRect(ix + 0.5, iy + 0.5, iw - 1, ih - 1);
  /* base sepia field */
  var bg = ctx.createLinearGradient(ix, iy, ix + iw, iy + ih);
  bg.addColorStop(0, SEPIA_MID);
  bg.addColorStop(0.55, SEPIA_BASE);
  bg.addColorStop(1, SEPIA_DARK);
  ctx.fillStyle = bg;
  ctx.fillRect(ix, iy, iw, ih);
  /* layered archival tones, slowly crossfading */
  var a1 = 0.16 + 0.08 * Math.sin(TAU * t / 47 + 0.6);
  var a2 = 0.14 + 0.07 * Math.sin(TAU * t / 61 + 2.1);
  var l1 = ctx.createRadialGradient(ix + iw * 0.30, iy + ih * 0.22, 0, ix + iw * 0.30, iy + ih * 0.22, iw * 0.75);
  l1.addColorStop(0, rgba(SEPIA_LIGHT, a1));
  l1.addColorStop(1, rgba(SEPIA_LIGHT, 0));
  ctx.fillStyle = l1;
  ctx.fillRect(ix, iy, iw, ih);
  var l2 = ctx.createRadialGradient(ix + iw * 0.75, iy + ih * 0.85, 0, ix + iw * 0.75, iy + ih * 0.85, iw * 0.7);
  l2.addColorStop(0, rgba(SEPIA_SHADOW, a2));
  l2.addColorStop(1, rgba(SEPIA_SHADOW, 0));
  ctx.fillStyle = l2;
  ctx.fillRect(ix, iy, iw, ih);
  /* the elder: a soft tonal study, no features, no likeness.
     Head as a warm oval dissolving into the field; shoulders below. */
  var cx = ix + iw * 0.5;
  var hy = iy + ih * 0.30;
  var hw = iw * 0.21, hh = ih * 0.16;
  var head = ctx.createRadialGradient(cx, hy, 0, cx, hy, hw * 1.9);
  head.addColorStop(0, rgba(SEPIA_LIGHT, 0.68));
  head.addColorStop(0.45, rgba(SEPIA_MID, 0.42));
  head.addColorStop(1, rgba(SEPIA_MID, 0));
  ctx.fillStyle = head;
  ctx.beginPath();
  ctx.moveTo(cx + hw * 1.9, hy);
  ctx.ellipse(cx, hy, hw * 1.9, hh * 1.9, 0, 0, TAU);
  ctx.fill();
  var headCore = ctx.createRadialGradient(cx, hy - hh * 0.1, 0, cx, hy - hh * 0.1, hw);
  headCore.addColorStop(0, rgba(SEPIA_LIGHT, 0.30));
  headCore.addColorStop(1, rgba(SEPIA_LIGHT, 0));
  ctx.fillStyle = headCore;
  ctx.beginPath();
  ctx.moveTo(cx + hw, hy - hh * 0.1);
  ctx.ellipse(cx, hy - hh * 0.1, hw, hh, 0, 0, TAU);
  ctx.fill();
  /* shoulders: a broad soft shape, darker at the edges */
  var sy = iy + ih * 0.62;
  var sh = ctx.createRadialGradient(cx, sy + ih * 0.30, 0, cx, sy + ih * 0.30, iw * 0.62);
  sh.addColorStop(0, rgba(SEPIA_DARK, 0.66));
  sh.addColorStop(0.6, rgba(SEPIA_DARK, 0.38));
  sh.addColorStop(1, rgba(SEPIA_DARK, 0));
  ctx.fillStyle = sh;
  ctx.beginPath();
  ctx.moveTo(ix, iy + ih);
  ctx.lineTo(ix, sy + ih * 0.12);
  ctx.quadraticCurveTo(cx - iw * 0.30, sy - ih * 0.10, cx, sy - ih * 0.06);
  ctx.quadraticCurveTo(cx + iw * 0.30, sy - ih * 0.10, ix + iw, sy + ih * 0.12);
  ctx.lineTo(ix + iw, iy + ih);
  ctx.closePath();
  ctx.fill();
  /* a soft wrap of cloth at the shoulders, one pale fold */
  ctx.strokeStyle = rgba(SEPIA_LIGHT, 0.18);
  ctx.lineWidth = Math.max(1, iw * 0.006);
  ctx.beginPath();
  ctx.moveTo(cx - iw * 0.22, sy + ih * 0.02);
  ctx.quadraticCurveTo(cx, sy - ih * 0.05, cx + iw * 0.22, sy + ih * 0.02);
  ctx.stroke();
  /* archival grain, seeded and still */
  for (i = 0; i < GRAIN.length; i++) {
    var gr = GRAIN[i];
    ctx.fillStyle = rgba(gr.warm ? SEPIA_LIGHT : SEPIA_SHADOW, gr.a);
    ctx.beginPath();
    ctx.moveTo(ix + gr.x * iw + gr.r, iy + gr.y * ih);
    ctx.arc(ix + gr.x * iw, iy + gr.y * ih, gr.r, 0, TAU);
    ctx.fill();
  }
  /* vignette inside the frame */
  var vg = ctx.createRadialGradient(cx, iy + ih * 0.5, ih * 0.3, cx, iy + ih * 0.5, ih * 0.75);
  vg.addColorStop(0, 'rgba(10,9,8,0)');
  vg.addColorStop(1, 'rgba(10,9,8,0.28)');
  ctx.fillStyle = vg;
  ctx.fillRect(ix, iy, iw, ih);
  /* fragments of gold at the portrait's edges */
  ctx.fillStyle = rgba(GOLD, 0.5);
  ctx.fillRect(ix + iw * 0.06, iy + 2, 2, ih * 0.10);
  ctx.fillRect(ix + iw * 0.90, iy + ih * 0.78, 2, ih * 0.12);
  ctx.fillStyle = rgba(GOLD_SOFT, 0.4);
  ctx.fillRect(ix + iw * 0.12, iy + ih - 4, iw * 0.14, 2);
  ctx.fillRect(ix + iw * 0.70, iy + 2, iw * 0.10, 2);
  /* altar ledge under the portrait, two faint candle glints */
  var ledgeY = pr.y + pr.h + Math.max(8, VH * 0.015);
  ctx.fillStyle = FRAME_WOOD;
  ctx.fillRect(pr.x + pr.w * 0.12, ledgeY, pr.w * 0.76, Math.max(3, VH * 0.006));
  var flick = 0.5 + 0.3 * Math.sin(TAU * t / 7 + 1.0) + 0.2 * Math.sin(TAU * t / 3.1 + 0.4);
  flick = clamp(flick, 0.25, 1);
  ctx.fillStyle = rgba(GOLD, 0.55 * flick);
  ctx.beginPath();
  ctx.moveTo(pr.x + pr.w * 0.30 + 2, ledgeY - 4);
  ctx.arc(pr.x + pr.w * 0.30, ledgeY - 4, 2, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(pr.x + pr.w * 0.70 + 2, ledgeY - 4);
  ctx.arc(pr.x + pr.w * 0.70, ledgeY - 4, 2, 0, TAU);
  ctx.fill();
}
function drawScan(sc, t) {
  var pr = portraitRect();
  var ix = pr.x + 8, iy = pr.y + 8, iw = pr.w - 16, ih = pr.h - 16;
  var f = scanX(reduced ? FRAME_T : t);
  var bw = iw * BAND_W;
  var bx = ix + f * iw - bw / 2;
  /* clip the field to the portrait so it never spills onto the wall */
  ctx.save();
  ctx.beginPath();
  ctx.rect(ix, iy, iw, ih);
  ctx.clip();
  /* the teal field: soft edges, bright core */
  var g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, rgba(TEAL, 0));
  g.addColorStop(0.35, rgba(TEAL, 0.22));
  g.addColorStop(0.5, rgba(TEAL_HI, 0.38));
  g.addColorStop(0.65, rgba(TEAL, 0.22));
  g.addColorStop(1, rgba(TEAL, 0));
  ctx.fillStyle = g;
  ctx.fillRect(bx, iy, bw, ih);
  /* a thin bright line at the field's leading edge */
  var leadX = bx + bw * 0.5;
  ctx.fillStyle = rgba(TEAL_HI, 0.5);
  ctx.fillRect(leadX - 1, iy, 2, ih);
  /* where the field crosses a zone, fragments of gold rise */
  var i, z;
  for (i = 0; i < ZONES.length; i++) {
    z = ZONES[i];
    var zx = ix + z.x * iw;
    var zy = iy + z.y * ih;
    var d = Math.abs(leadX - zx) / (bw * 0.9 + z.r * iw);
    if (d < 1) {
      var strength = 1 - d;
      var glow = ctx.createRadialGradient(zx, zy, 0, zx, zy, z.r * iw * 1.6);
      glow.addColorStop(0, rgba(GOLD, 0.22 * strength));
      glow.addColorStop(1, rgba(GOLD, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.moveTo(zx + z.r * iw * 1.6, zy);
      ctx.arc(zx, zy, z.r * iw * 1.6, 0, TAU);
      ctx.fill();
      /* rising motes: seeded offsets, drifting upward with the pass */
      var rng = mulberry32(1853 + i * 97);
      var j;
      for (j = 0; j < 7; j++) {
        var mx = zx + (rng() - 0.5) * z.r * iw * 1.8;
        var my = zy - ((t * 0.012 + rng() * 0.9) % 1) * ih * 0.22;
        var ma = 0.55 * strength * (1 - (zy - my) / (ih * 0.22));
        ctx.fillStyle = rgba(GOLD, ma);
        ctx.beginPath();
        ctx.moveTo(mx + 1.6, my);
        ctx.arc(mx, my, 1.6, 0, TAU);
        ctx.fill();
      }
    }
  }
  /* a faint teal wash over the whole portrait while the field passes */
  var wash = ctx.createLinearGradient(ix, 0, ix + iw, 0);
  wash.addColorStop(0, rgba(TEAL_DEEP, 0));
  wash.addColorStop(f, rgba(TEAL_DEEP, 0.06));
  wash.addColorStop(1, rgba(TEAL_DEEP, 0));
  ctx.fillStyle = wash;
  ctx.fillRect(ix, iy, iw, ih);
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Ancestral Altar').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Ancestral Altar').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 07').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Ancestral Altar', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 07', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawRoom(portraitRect(), t);
  drawPortrait(portraitRect(), t);
  drawScan(portraitRect(), t);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    scanXAt: function (t) { return scanX(t); },
    zoneCount: ZONES.length
  };
}
/* ---- frame one: fixed phase t = 74.0 s, teal field mid-portrait ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
