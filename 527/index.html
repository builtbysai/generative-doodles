<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fire Circle</title>
<style>
  html, body { margin: 0; padding: 0; background: #101014; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32, fixed seed) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(527063);

  // ---------- palette (flat fills only, no gradients anywhere) ----------
  var GROUND = '#101014', BLUE = '#3B3BF0', VIOLET = '#7A3BF0',
      FORANGE = '#FF7A1A', FPINK = '#FF4E8A', WHITE = '#FFFFFF';

  // ---------- precomputed scene data (all seeded, static) ----------
  // dim stars in the upper sky
  var stars = [];
  for (var i = 0; i < 46; i++) {
    stars.push({ x: rng(), y: rng() * 0.44, r: 0.0009 + rng() * 0.0011, al: 0.10 + rng() * 0.18, ph: rng() * Math.PI * 2, sp: 0.5 + rng() * 1.1 });
  }
  // grain specks (short strokes over the whole stage)
  var grain = [];
  for (var g = 0; g < 750; g++) {
    grain.push({ x: rng(), y: rng(), a: rng() * Math.PI, l: 2 + rng() * 4, dark: rng() < 0.55, al: 0.02 + rng() * 0.05 });
  }
  // dancers: 8 specters in an ellipse ring, alternating blue / violet
  var dancers = [];
  for (var di = 0; di < 8; di++) {
    var ang = (di / 8) * Math.PI * 2 + 0.22;
    dancers.push({
      ang: ang,
      cx: 0.5 + 0.335 * Math.cos(ang),
      gy: 0.705 + 0.105 * Math.sin(ang),
      depth: (Math.sin(ang) + 1) / 2,            // 0 back .. 1 front
      col: (di % 2 === 0) ? BLUE : VIOLET,
      maskCol: (di % 2 === 0) ? WHITE : FORANGE, // masks alternate white / orange
      accCol: (di % 2 === 0) ? FORANGE : WHITE,
      ph: rng() * Math.PI * 2,
      bobSp: 1.6 + rng() * 0.7
    });
  }
  dancers.sort(function (a, b) { return Math.sin(a.ang) - Math.sin(b.ang); }); // back first
  // flame tongues: layered teardrops, back to front
  var tongues = [
    { w: 0.168, h: 0.400, col: FORANGE, al: 0.50, ph: 0.0 },
    { w: 0.115, h: 0.335, col: FORANGE, al: 0.75, ph: 2.1 },
    { w: 0.082, h: 0.262, col: FPINK,   al: 0.80, ph: 4.2 },
    { w: 0.050, h: 0.185, col: FPINK,   al: 0.95, ph: 1.2 },
    { w: 0.026, h: 0.100, col: WHITE,   al: 0.85, ph: 3.0 }
  ];
  // sparks rising off the flame
  var sparks = [];
  for (var si = 0; si < 26; si++) {
    sparks.push({
      off: rng(), dur: 2.6 + rng() * 1.9, xo: (rng() - 0.5) * 0.10,
      ph: rng() * Math.PI * 2, r: 0.0016 + rng() * 0.0016,
      col: (si % 2 === 0) ? FORANGE : FPINK
    });
  }
  // smoke blobs drifting up the column
  var blobs = [];
  for (var bi = 0; bi < 9; bi++) {
    blobs.push({
      off: bi / 9 + (rng() - 0.5) * 0.05, dur: 8.5 + rng() * 2.5,
      ph: rng() * Math.PI * 2, drift: (rng() - 0.5) * 0.05,
      col: (bi % 2 === 0) ? VIOLET : WHITE, al: (bi % 2 === 0) ? 0.10 : 0.05
    });
  }
  // smoke faces: appear low, rise, dissolve. Face 0 offset is set so it sits
  // mid-cycle (faintly present) at the constant first-frame phase PHASE0.
  var faces = [
    { x: 0.47, dur: 14, off: 0.236, mouth: 0 },
    { x: 0.545, dur: 17, off: 0.62, mouth: 1 },
    { x: 0.425, dur: 19, off: 0.85, mouth: 2 }
  ];

  // ---------- viewport / stage ----------
  var W = 0, H = 0, SX = 0, SY = 0, SS = 0; // stage origin + size (square)
  var isPhone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SS = Math.min(w, h);
    SX = (w - SS) / 2; SY = (h - SS) / 2;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || h > w * 1.15;
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- drawing helpers (stage units: u = SS pixels) ----------
  function X(u) { return SX + u * SS; }
  function Y(u) { return SY + u * SS; }
  function circ(x, y, r, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * SS, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function ell(x, y, rx, ry, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(X(x), Y(y), rx * SS, ry * SS, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function line(x1, y1, x2, y2, wdt, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // teardrop flame tongue: base at (cx, baseY), tip swayed by tipDx
  function tongue(cx, baseY, w, h, tipDx, col, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(X(cx - w / 2), Y(baseY));
    ctx.bezierCurveTo(
      X(cx - w / 2), Y(baseY - h * 0.45),
      X(cx + tipDx - w * 0.16), Y(baseY - h * 0.72),
      X(cx + tipDx), Y(baseY - h));
    ctx.bezierCurveTo(
      X(cx + tipDx + w * 0.17), Y(baseY - h * 0.72),
      X(cx + w / 2), Y(baseY - h * 0.45),
      X(cx + w / 2), Y(baseY));
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawDancer(d, t) {
    var s = 0.60 + 0.45 * d.depth;              // scale by ring depth
    var Hd = 0.20 * s;                          // total figure height
    var bob = -Math.abs(Math.sin(t * d.bobSp + d.ph)) * 0.014 * s;
    var gy = d.gy + bob;
    var dx = 0.006 * Math.sin(t * 0.9 + d.ph) * s;  // sway of the upper body
    var cx = d.cx;
    var shY = gy - Hd * 0.66, shX = cx + dx * 0.6;  // shoulder point
    var headCY = gy - Hd * 0.84, headR = Hd * 0.155;
    var headCX = cx + dx;
    // arms raised in dance, angles breathing with the loop
    var aL = 0.055 * s + 0.010 * s * Math.sin(t * 1.7 + d.ph);
    var aR = 0.055 * s + 0.010 * s * Math.sin(t * 1.7 + d.ph + 1.4);
    var hLy = gy - Hd * (0.97 + 0.05 * Math.sin(t * 2.3 + d.ph));
    var hRy = gy - Hd * (0.97 + 0.05 * Math.sin(t * 2.3 + d.ph + 1.4));
    line(shX, shY, cx + dx - aL, hLy, 0.012 * s, d.col);
    line(shX, shY, cx + dx + aR, hRy, 0.012 * s, d.col);
    // robe: bell silhouette from base to shoulders
    ctx.globalAlpha = 1;
    ctx.fillStyle = d.col;
    ctx.beginPath();
    ctx.moveTo(X(cx - 0.052 * s), Y(gy));
    ctx.bezierCurveTo(
      X(cx - 0.050 * s), Y(gy - Hd * 0.45),
      X(cx - 0.027 * s + dx * 0.4), Y(gy - Hd * 0.60),
      X(shX - 0.020 * s), Y(shY));
    ctx.lineTo(X(shX + 0.020 * s), Y(shY));
    ctx.bezierCurveTo(
      X(cx + 0.027 * s + dx * 0.4), Y(gy - Hd * 0.60),
      X(cx + 0.050 * s), Y(gy - Hd * 0.45),
      X(cx + 0.052 * s), Y(gy));
    ctx.quadraticCurveTo(X(cx), Y(gy + 0.006 * s), X(cx - 0.052 * s), Y(gy));
    ctx.closePath(); ctx.fill();
    // head
    circ(headCX, headCY, headR, d.col);
    // mask: pale oval picked out on the silhouette
    ell(headCX, headCY + headR * 0.10, headR * 0.60, headR * 0.78, d.maskCol);
    // mask eyes (dark holes) and a small mouth curve
    circ(headCX - headR * 0.26, headCY + headR * 0.02, headR * 0.105, GROUND);
    circ(headCX + headR * 0.26, headCY + headR * 0.02, headR * 0.105, GROUND);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = GROUND; ctx.lineWidth = Math.max(1, headR * 0.10 * SS);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(X(headCX), Y(headCY + headR * 0.28), headR * 0.30 * SS, Math.PI * 0.20, Math.PI * 0.80);
    ctx.stroke();
    // accent: forehead dot in the opposite mask colour
    circ(headCX, headCY - headR * 0.42, headR * 0.13, d.accCol);
  }

  function draw(t) {
    // pin canvas css size every frame (house rule)
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // page ground
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath(); ctx.rect(SX, SY, SS, SS); ctx.clip();
    ctx.fillStyle = GROUND; ctx.fillRect(SX, SY, SS, SS);

    // dim stars
    for (var si = 0; si < stars.length; si++) {
      var st = stars[si];
      var tw = st.al * (0.7 + 0.3 * Math.sin(t * st.sp + st.ph));
      circ(st.x, st.y, st.r, WHITE, tw);
    }

    // dance-ring ellipse marked on the ground
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = VIOLET; ctx.lineWidth = Math.max(1, 0.0025 * SS);
    ctx.beginPath(); ctx.ellipse(X(0.5), Y(0.705), 0.335 * SS, 0.105 * SS, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;

    // warm pool of firelight on the ground (layered flat blobs, no gradient)
    ell(0.5, 0.705, 0.300, 0.075, FORANGE, 0.08);
    ell(0.5, 0.705, 0.200, 0.050, FORANGE, 0.10);
    ell(0.5, 0.705, 0.120, 0.032, FPINK, 0.08);

    // back-half dancers (behind the flame)
    for (var bi2 = 0; bi2 < dancers.length; bi2++) {
      if (Math.sin(dancers[bi2].ang) < 0) drawDancer(dancers[bi2], t);
    }

    // halo behind the flame (layered flat blobs)
    ell(0.5, 0.52, 0.160, 0.240, FORANGE, 0.05);
    ell(0.5, 0.52, 0.110, 0.180, FORANGE, 0.07);

    // logs at the flame base
    line(0.438, 0.688, 0.560, 0.674, 0.016, VIOLET, 0.9);
    line(0.440, 0.674, 0.562, 0.688, 0.016, VIOLET, 0.9);

    // flame tongues, layered back to front, licking upward
    var baseY = 0.685;
    for (var ti = 0; ti < tongues.length; ti++) {
      var tg = tongues[ti];
      var fl = 1 + 0.07 * Math.sin(t * 2.7 + tg.ph) + 0.04 * Math.sin(t * 6.3 + tg.ph * 1.7);
      var sway = 0.012 * Math.sin(t * 1.9 + tg.ph);
      tongue(0.5, baseY, tg.w, tg.h * fl, sway, tg.col, tg.al);
    }

    // sparks rising and fading
    for (var ski = 0; ski < sparks.length; ski++) {
      var sk = sparks[ski];
      var p = ((t / sk.dur) + sk.off) % 1;
      var sx = 0.5 + sk.xo * (1 + p * 1.6) + 0.008 * Math.sin(t * 2 + sk.ph);
      var sy = 0.66 - p * 0.34;
      circ(sx, sy, sk.r, sk.col, (1 - p) * 0.8);
    }

    // front-half dancers (occlude the flame base)
    for (var fi = 0; fi < dancers.length; fi++) {
      if (Math.sin(dancers[fi].ang) >= 0) drawDancer(dancers[fi], t);
    }

    // smoke blobs rising up the column
    for (var bli = 0; bli < blobs.length; bli++) {
      var bl = blobs[bli];
      var bp = ((t / bl.dur) + bl.off) % 1;
      var bx = 0.5 + bl.drift * bp + 0.030 * Math.sin(bp * 5 + bl.ph);
      var by = 0.34 - 0.27 * bp;
      var br = 0.020 + 0.050 * bp;
      var ba = bl.al * Math.sin(Math.PI * Math.min(bp * 1.15, 1));
      circ(bx, by, br, bl.col, ba);
    }

    // smoke faces: form, rise, dissolve
    for (var fai = 0; fai < faces.length; fai++) {
      var fa = faces[fai];
      var fc = ((t / fa.dur) + fa.off) % 1;
      var fenv = Math.pow(Math.sin(Math.PI * fc), 1.5);
      if (fenv < 0.02) continue;
      var fy = 0.31 - 0.22 * fc;
      var fa2 = fenv * 0.55;
      circ(fa.x, fy, 0.046, VIOLET, fenv * 0.22);            // wisp body
      circ(fa.x - 0.016, fy - 0.008, 0.0055, WHITE, fa2);    // eyes
      circ(fa.x + 0.016, fy - 0.008, 0.0055, WHITE, fa2);
      ctx.globalAlpha = fa2;
      ctx.strokeStyle = WHITE; ctx.lineWidth = Math.max(1, 0.0035 * SS); ctx.lineCap = 'round';
      ctx.beginPath();
      if (fa.mouth === 0) {          // gentle smile
        ctx.arc(X(fa.x), Y(fy + 0.004), 0.013 * SS, Math.PI * 0.15, Math.PI * 0.85);
      } else if (fa.mouth === 1) {   // small o
        ctx.arc(X(fa.x), Y(fy + 0.014), 0.006 * SS, 0, Math.PI * 2);
      } else {                        // calm flat line
        ctx.moveTo(X(fa.x - 0.011), Y(fy + 0.014));
        ctx.lineTo(X(fa.x + 0.011), Y(fy + 0.014));
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // grain specks (precomputed, drawn directly)
    for (var gi = 0; gi < grain.length; gi++) {
      var gr = grain[gi];
      ctx.strokeStyle = gr.dark ? 'rgba(0,0,0,' + gr.al + ')' : 'rgba(255,255,255,' + gr.al + ')';
      ctx.lineWidth = Math.max(1, 0.0013 * SS);
      ctx.beginPath();
      ctx.moveTo(X(gr.x), Y(gr.y));
      ctx.lineTo(X(gr.x + Math.cos(gr.a) * gr.l / 1080), Y(gr.y + Math.sin(gr.a) * gr.l / 1080));
      ctx.stroke();
    }

    ctx.restore();
  }

  // ---------- deterministic first frame + loop ----------
  var PHASE0 = 3.7; // constant loop phase for frame one
  draw(PHASE0);
  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    draw(PHASE0 + (now - startStamp) / 1000);
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
