<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>&#8470;8967 &middot; Bleed Ledger</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e6dcc6;
    overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
  #cap {
    position: fixed; left: 16px; bottom: 14px; max-width: 72vw;
    font: 400 13px/1.5 Georgia, "Times New Roman", serif;
    font-style: italic;
    color: rgba(74, 63, 48, 0.78);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 16px; bottom: 16px;
    font: 400 11px/1.4 Georgia, serif;
    color: rgba(74, 63, 48, 0.45);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cap">&#8470;8967 &middot; Bleed Ledger. The artist hides the pockets, the marksman sets the wounds, gravity bleeds them down. Tap to renegotiate.</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   Bleed Ledger - №8967 (2026-07-30)
   From the Tir wound map (sketchbook seed 208): every color
   trail carries its wound at the head, a pitted dark hole from
   which the streak falls. Three hands negotiate the composition:
   1. the artist places hidden pigment pockets (seeded cluster centers)
   2. a marksman sets each wound as a gaussian draw around its pocket
   3. gravity finishes each streak (vertical drag, slight turbulence)
   Colors never mix at the source: each wound is one unmixed bag.
   Every trail can be read backward from its edge to its hole.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Box-Muller gaussian from the seeded stream
function gaussian(rnd, sigma) {
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

const sm = /[?&]seed=(\d+)/.exec(location.search);
const seed = sm ? (parseInt(sm[1], 10) >>> 0) : 20804;
document.getElementById("seedtag").textContent = "seed " + seed;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;

// Pigments: single bags, never mixed at the source. Each entry is a
// base color plus a darker shade used only as tonal variation of the
// same bag (tints/shades, no cross-pigment blending).
const BAGS = [
  { name: "madder",     c: [163, 32, 47],   dark: [105, 18, 30]  },
  { name: "vermilion",  c: [201, 68, 28],   dark: [135, 40, 16]  },
  { name: "ochre",      c: [207, 154, 46],  dark: [140, 100, 26]  },
  { name: "viridian",   c: [46, 107, 80],   dark: [26, 70, 50]    },
  { name: "ultramarine",c: [43, 78, 157],   dark: [24, 48, 104]   },
  { name: "ironblack",  c: [38, 34, 28],    dark: [14, 12, 10]    },
];

function rgba(v, a) { return "rgba(" + (v[0]|0) + "," + (v[1]|0) + "," + (v[2]|0) + "," + a.toFixed(3) + ")"; }
function shade(bag, f, rnd) { // f=0 base, f=1 dark; tiny seeded wobble keeps it one bag
  const w = 1 + (rnd() - 0.5) * 0.14;
  return [ (bag.c[0] + (bag.dark[0]-bag.c[0])*f) * w,
           (bag.c[1] + (bag.dark[1]-bag.c[1])*f) * w,
           (bag.c[2] + (bag.dark[2]-bag.c[2])*f) * w ];
}

function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function irregularPath(rnd, x, y, r, wobble, n) {
  ctx.beginPath();
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rr = r * (1 + (rnd() - 0.5) * 2 * wobble);
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
  }
  ctx.moveTo((pts[0][0] + pts[n-1][0]) / 2, (pts[0][1] + pts[n-1][1]) / 2);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.closePath();
}

// ---------- the pitted wound ----------
function drawWound(rnd, x, y, rw, bag) {
  // seep halo: the wound's own color bleeding into the ground, low alpha
  for (let i = 0; i < 26; i++) {
    const a = rnd() * Math.PI * 2;
    const d = rw * (1.05 + rnd() * 0.8);
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
    const pr = rw * (0.18 + rnd() * 0.3);
    ctx.fillStyle = rgba(shade(bag, 0.3, rnd), 0.05 + rnd() * 0.05);
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
  }
  // crater body: irregular dark pit
  irregularPath(rnd, x, y, rw, 0.28, 14);
  const g = ctx.createRadialGradient(x - rw*0.2, y - rw*0.2, rw*0.1, x, y, rw*1.15);
  g.addColorStop(0, "#0b0906");
  g.addColorStop(0.72, "#171209");
  g.addColorStop(1, "rgba(30,24,15,0.0)");
  ctx.fillStyle = g;
  ctx.fill();
  // rim shadow, lower right
  ctx.strokeStyle = "rgba(20,14,8,0.55)";
  ctx.lineWidth = Math.max(1, rw * 0.16);
  ctx.beginPath();
  ctx.arc(x, y, rw * 1.02, Math.PI * 0.15, Math.PI * 0.75);
  ctx.stroke();
  // rim highlight, upper left (the light that found the hole)
  ctx.strokeStyle = "rgba(246,238,218,0.5)";
  ctx.lineWidth = Math.max(1, rw * 0.1);
  ctx.beginPath();
  ctx.arc(x, y, rw * 1.02, Math.PI * 1.15, Math.PI * 1.75);
  ctx.stroke();
  // pits inside the hole: darker than the dark, each with a hair of light
  const np = 7 + Math.floor(rnd() * 8);
  for (let i = 0; i < np; i++) {
    const a = rnd() * Math.PI * 2;
    const d = rw * 0.62 * Math.sqrt(rnd());
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
    const pr = rw * (0.08 + rnd() * 0.13);
    ctx.fillStyle = "rgba(2,2,2,0.85)";
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(240,230,205,0.28)";
    ctx.beginPath(); ctx.arc(px - pr*0.3, py - pr*0.35, pr*0.35, 0, Math.PI * 2); ctx.fill();
  }
  // satellite pits in the rim and ground: splatter from the impact
  const ns = 4 + Math.floor(rnd() * 6);
  for (let i = 0; i < ns; i++) {
    const a = rnd() * Math.PI * 2;
    const d = rw * (1.25 + rnd() * 1.1);
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
    const pr = Math.max(0.8, rw * (0.04 + rnd() * 0.07));
    ctx.fillStyle = "rgba(15,11,7,0.75)";
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- the gravity streak: drawn as many individual
// streaklets, never a smooth gradient ----------
function drawStreak(rnd, x, y, rw, bag, maxLen) {
  const len = Math.min(maxLen, rw * (8 + rnd() * 22));
  const y0 = y + rw * 1.15;
  const n = 46 + Math.floor(rnd() * 26);
  const lean = (rnd() - 0.5) * len * 0.10; // slight overall drift, seeded
  for (let s = 0; s < n; s++) {
    const core = s < 8;                       // a few dark cores near the middle
    const sx = x + gaussian(rnd, rw * 0.42);
    const wdt = (core ? 2.2 : 1.0) + rnd() * 2.2;
    const slen = len * (0.35 + Math.pow(rnd(), 1.6) * 0.65);
    const steps = 26;
    const tone = core ? 0.50 + rnd() * 0.3 : rnd() * 0.35;
    const col = shade(bag, tone, rnd);
    const a0 = (core ? 0.15 : 0.075) + rnd() * 0.08;
    let px = sx, py = y0;
    const drift = lean * (0.3 + rnd() * 0.7) / steps;
    ctx.lineCap = "round";
    for (let t = 1; t <= steps; t++) {
      const f = t / steps;
      const ny = y0 + slen * f;
      const nx = px + gaussian(rnd, 1.1) + drift;
      // fade in at the very top so nothing looks pasted on, out at the tail
      const env = Math.min(1, f / 0.10) * Math.pow(1 - f, 0.7);
      ctx.strokeStyle = rgba(col, a0 * env);
      ctx.lineWidth = Math.max(0.6, wdt * (1 - f * 0.35));
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(nx, ny); ctx.stroke();
      px = nx; py = ny;
    }
    // occasional drip bead where a streaklet gives up
    if (rnd() < 0.16) {
      const br = Math.max(1, wdt * (0.9 + rnd() * 0.8));
      ctx.fillStyle = rgba(shade(bag, 0.7, rnd), 0.5);
      ctx.beginPath(); ctx.arc(px, py + br * 0.4, br, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(10,8,5,0.5)";
      ctx.beginPath(); ctx.arc(px, py + br * 0.7, br * 0.45, 0, Math.PI * 2); ctx.fill();
    }
  }
  // fine spatter alongside the fall
  const nsp = 8 + Math.floor(rnd() * 14);
  for (let i = 0; i < nsp; i++) {
    const f = rnd();
    const px = x + gaussian(rnd, rw * 1.4);
    const py = y0 + len * f;
    ctx.fillStyle = rgba(shade(bag, rnd(), rnd), 0.10 + rnd() * 0.12);
    ctx.beginPath(); ctx.arc(px, py, 0.6 + rnd() * 1.6, 0, Math.PI * 2); ctx.fill();
  }
}

function build() {
  fit();
  const rnd = mulberry32(seed);
  const S = Math.min(W, H) / 900;              // composition scale
  const D = Math.max(S, 0.62);                 // detail floor for small screens

  // ---- ground: pale plaster ledger page ----
  ctx.fillStyle = "#e7dcc4";
  ctx.fillRect(0, 0, W, H);

  const mx = W * 0.075, my = H * 0.075;
  const px0 = mx, py0 = my, px1 = W - mx, py1 = H - my;
  const pw = px1 - px0, ph = py1 - py0;

  // faint ledger ruling
  ctx.strokeStyle = "rgba(96, 104, 112, 0.13)";
  ctx.lineWidth = 1;
  const step = Math.max(26, ph / 14);
  ctx.beginPath();
  for (let y = py0 + step; y < py1 - 4; y += step) {
    ctx.moveTo(px0, Math.round(y) + 0.5); ctx.lineTo(px1, Math.round(y) + 0.5);
  }
  ctx.stroke();

  // palette: 4 bags this round, no mixing anywhere
  const order = BAGS.slice();
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  const bags = order.slice(0, 4);

  // ---- hand one: the artist places hidden pigment pockets ----
  const K = 6;
  const pockets = [];
  for (let i = 0; i < K; i++) {
    pockets.push({
      x: px0 + pw * (0.10 + rnd() * 0.80),
      y: py0 + ph * (0.08 + rnd() * 0.74),
    });
  }

  // ---- hand two: the marksman sets wounds, gaussian around pockets ----
  const sigma = Math.hypot(pw, ph) * 0.055;
  const N = 11 + Math.floor(rnd() * 4);
  const wounds = [];
  for (let i = 0; i < N; i++) {
    const bag = bags[Math.floor(rnd() * bags.length)];
    const rw = (9 + rnd() * 11) * D;
    // the marksman keeps shooting until the hole lands somewhere readable:
    // never on top of another wound, so every crater stays visible
    let wx = 0, wy = 0, ok = false;
    for (let attempt = 0; attempt < 40 && !ok; attempt++) {
      const p = pockets[Math.floor(rnd() * K)];
      wx = p.x + gaussian(rnd, sigma);
      wy = p.y + gaussian(rnd, sigma);
      wx = Math.min(px1 - 20 * D, Math.max(px0 + 20 * D, wx));
      wy = Math.min(py1 - 60 * D, Math.max(py0 + 24 * D, wy));
      ok = wounds.every(w => Math.hypot(w.x - wx, w.y - wy) > (w.rw + rw) * 1.6);
    }
    wounds.push({ x: wx, y: wy, rw: rw, bag: bag });
  }
  // biggest wounds first so nothing hides behind a giant crater later;
  // drawn back to front, large first
  wounds.sort((a, b) => b.rw - a.rw);

  // ---- hand three: gravity finishes each streak ----
  for (const w of wounds) {
    drawWound(rnd, w.x, w.y, w.rw, w.bag);                       // the wound first
    drawStreak(rnd, w.x, w.y, w.rw, w.bag, py1 - w.y - 14 * D);   // then the fall
  }

  // paper tooth over everything
  for (let i = 0; i < 4200; i++) {
    const gx = rnd() * W, gy = rnd() * H;
    ctx.fillStyle = rnd() < 0.5 ? "rgba(60,48,30,0.030)" : "rgba(255,252,240,0.035)";
    ctx.fillRect(gx, gy, 1.2, 1.2);
  }

  // thin plate rule
  ctx.strokeStyle = "rgba(74, 63, 48, 0.55)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(px0, py0, pw, ph);
}

build();
window.addEventListener("resize", build);
canvas.addEventListener("pointerdown", () => {
  const ns = (Math.random() * 0xffffffff) >>> 0;
  const u = new URL(location.href);
  u.searchParams.set("seed", String(ns));
  location.href = u.toString();
});
</script>
</body>
</html>
