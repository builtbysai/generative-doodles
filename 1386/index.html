<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monument Edit</title>
<style>
html, body { margin: 0; padding: 0; background: #c8c4b8; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var SKY = '#c8c4b8';
var BRONZE = '#7a5a34';
var PLINTH = '#8b8578';
var CYAN = '#57e6ff';
var VINE = '#4a7c3a';
var WATER = '#2e6f9e';
var DARK = 'rgba(20, 16, 10, 0.85)';

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Seeded rotation of target forms: 0 = birds, 1 = vines, 2 = water.
var order = [0, 1, 2];
(function () {
  var r = mulberry32(1386000);
  var i, j, tmp;
  for (i = order.length - 1; i > 0; i--) {
    j = Math.floor(r() * (i + 1));
    tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
})();

var birds = [];
(function () {
  var i, r;
  for (i = 0; i < 14; i++) {
    r = mulberry32(1386000 + i * 7919);
    birds.push({ fx: r(), fy: r(), ph: r() * 6.283, sp: 4 + r() * 4 });
  }
})();

var vines = [];
(function () {
  var i, r;
  for (i = 0; i < 5; i++) {
    r = mulberry32(1386000 + 100 * 7919 + i * 7919);
    vines.push({ fx: r(), ph: r() * 6.283, amp: 6 + r() * 14 });
  }
})();

var ripples = [];
(function () {
  var i, r;
  for (i = 0; i < 6; i++) {
    r = mulberry32(1386000 + 200 * 7919 + i * 7919);
    ripples.push({ fx: r(), fy: r(), ph: r() * 6.283, sp: 14 + r() * 18 });
  }
})();

// Recorded vertical drags: each {t, shift} in seconds of sweep phase.
var drags = [];
var curT = 0;
var downY = null;

function shiftAt(t) {
  var s = 0, i, d;
  for (i = 0; i < drags.length; i++) {
    d = drags[i];
    if (t >= d.t) s += d.shift * Math.exp(-(t - d.t) / 4);
  }
  return s;
}

function onDown(e) {
  downY = e.clientY;
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (downY === null) return;
  var dy = e.clientY - downY;
  downY = e.clientY;
  drags.push({ t: curT, shift: dy * 0.02 });
  if (e.preventDefault) e.preventDefault();
}
function onUp(e) {
  downY = null;
  if (e.preventDefault) e.preventDefault();
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);

function envAt(y, scanY, bandH) {
  var d = Math.abs(y - scanY) / (bandH / 2);
  if (d >= 1) return 0;
  return 1 - d;
}

function draw(t) {
  curT = t;
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  var W = vv ? vv.width : window.innerWidth;
  var H = vv ? vv.height : window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
  var minDim = scr ? Math.min(scr.width, scr.height) : Math.min(W, H);
  var isPhone = minDim < 700 || H > W * 1.15;
  if (typeof document !== 'undefined' && document.body) {
    document.body.style.background = SKY;
  }
  void isPhone;

  var cx = W / 2;
  var sh = H * 0.40;
  var sw = Math.min(sh * 0.8, W * 0.7);
  var top = H * 0.14;
  var bx = cx - sw / 2;
  var plinthW = Math.min(sw * 1.6, W * 0.9);
  var plinthH = H * 0.06;
  var py = top + sh;
  var groundY = py + plinthH;

  // Sky and plaza.
  ctx.globalAlpha = 1;
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.10)';
  ctx.fillRect(0, groundY, W, H - groundY);

  // Plinth: base step and block.
  ctx.fillStyle = PLINTH;
  ctx.fillRect(cx - plinthW * 0.62, py + plinthH * 0.55, plinthW * 1.24, plinthH * 0.45);
  ctx.fillRect(cx - plinthW / 2, py, plinthW, plinthH * 0.62);

  // Statue silhouette: abstract figure, head + tapered torso.
  var headR = Math.min(sw, sh) * 0.085;
  var headX = cx, headY = top + sh * 0.08;
  ctx.fillStyle = BRONZE;
  ctx.beginPath();
  ctx.moveTo(headX + headR, headY);
  ctx.arc(headX, headY, headR, 0, 6.2832);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bx + sw * 0.30, top + sh * 0.22);
  ctx.lineTo(bx + sw * 0.70, top + sh * 0.22);
  ctx.lineTo(bx + sw * 0.64, top + sh * 0.48);
  ctx.lineTo(bx + sw * 0.68, top + sh * 0.97);
  ctx.lineTo(bx + sw * 0.32, top + sh * 0.97);
  ctx.lineTo(bx + sw * 0.36, top + sh * 0.48);
  ctx.closePath();
  ctx.fill();

  // Sweep state: 12 s cycle, phase-shifted so frame one sits mid-statue.
  var CYCLE = 12;
  var tEff = t + shiftAt(t);
  var cyc = (((tEff + 4) % CYCLE) + CYCLE) % CYCLE;
  var pass = Math.floor((tEff + 4) / CYCLE);
  pass = ((pass % 3) + 3) % 3;
  var form = order[pass];
  var bandH = sh * 0.30;
  var scanTop = top - bandH * 0.5;
  var scanBot = top + sh + bandH * 0.5;
  var scanY = scanTop + (cyc / CYCLE) * (scanBot - scanTop);
  var bandTop = scanY - bandH / 2;
  var bandBot = scanY + bandH / 2;

  // Erase the statue inside the band (striped alpha envelope) so the
  // target form replaces bronze only where the scan line is.
  var clipTop = Math.max(bandTop, top);
  var clipBot = Math.min(bandBot, top + sh);
  if (clipBot > clipTop) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(bx, clipTop, sw, clipBot - clipTop);
    ctx.clip();
    var strips = 32, k, sy, sa;
    for (k = 0; k < strips; k++) {
      sy = bandTop + k * bandH / strips;
      sa = 0.9 * envAt(sy + bandH / strips / 2, scanY, bandH);
      if (sa <= 0) continue;
      ctx.globalAlpha = sa;
      ctx.fillStyle = SKY;
      ctx.fillRect(bx, sy, sw, bandH / strips + 1);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // Target form, clipped strictly to the band.
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, bandTop, W, bandH);
  ctx.clip();
  var i, b, vx, vy, a;
  if (form === 0) {
    // Flock of birds: closed-form positions, flapping chevrons.
    ctx.lineWidth = 2;
    for (i = 0; i < birds.length; i++) {
      b = birds[i];
      vx = bx + b.fx * sw * 1.3 - sw * 0.15 + Math.sin(t * 0.5 + b.ph) * 6;
      vy = scanY + (b.fy - 0.5) * bandH * 0.9;
      a = 0.9 * envAt(vy, scanY, bandH);
      if (a <= 0) continue;
      var flap = Math.sin(t * b.sp + b.ph) * 4;
      ctx.globalAlpha = a;
      ctx.strokeStyle = DARK;
      ctx.beginPath();
      ctx.moveTo(vx - 7, vy + flap);
      ctx.lineTo(vx, vy);
      ctx.lineTo(vx + 7, vy + flap);
      ctx.stroke();
      ctx.fillStyle = DARK;
      ctx.fillRect(vx - 1, vy - 1, 2, 2);
    }
  } else if (form === 1) {
    // Growing vines: seeded stems with leaf ticks, clipped to the band.
    ctx.lineWidth = 2;
    for (i = 0; i < vines.length; i++) {
      var v = vines[i];
      var x0 = bx + v.fx * sw;
      ctx.globalAlpha = 0.9 * envAt(scanY, scanY, bandH);
      ctx.strokeStyle = VINE;
      ctx.beginPath();
      var yy, xx, first = true;
      for (yy = bandBot; yy >= bandTop; yy -= bandH / 8) {
        xx = x0 + Math.sin((bandBot - yy) * 0.08 + v.ph) * v.amp;
        if (first) { ctx.moveTo(xx, yy); first = false; }
        else { ctx.lineTo(xx, yy); }
      }
      ctx.stroke();
      // Leaf ticks along the stem.
      var li = 0;
      for (yy = bandBot - bandH / 16; yy >= bandTop; yy -= bandH / 8) {
        xx = x0 + Math.sin((bandBot - yy) * 0.08 + v.ph) * v.amp;
        a = 0.9 * envAt(yy, scanY, bandH);
        if (a <= 0) { li++; continue; }
        ctx.globalAlpha = a;
        ctx.strokeStyle = VINE;
        ctx.beginPath();
        if (li % 2 === 0) {
          ctx.moveTo(xx, yy); ctx.lineTo(xx + 6, yy - 5);
        } else {
          ctx.moveTo(xx, yy); ctx.lineTo(xx - 6, yy - 5);
        }
        ctx.stroke();
        li++;
      }
    }
  } else {
    // Running water: expanding ripple rings plus wave lines.
    ctx.lineWidth = 2;
    for (i = 0; i < ripples.length; i++) {
      var rp = ripples[i];
      var rx = bx + rp.fx * sw;
      var ry = bandTop + rp.fy * bandH;
      a = 0.9 * envAt(ry, scanY, bandH);
      if (a <= 0) continue;
      var rr = (t * rp.sp + rp.ph * 10) % 46;
      ctx.globalAlpha = a;
      ctx.strokeStyle = WATER;
      ctx.beginPath();
      ctx.moveTo(rx + rr, ry);
      ctx.arc(rx, ry, Math.max(rr, 0.5), 0, 6.2832);
      ctx.stroke();
      ctx.globalAlpha = a * 0.6;
      ctx.beginPath();
      ctx.moveTo(rx + rr * 0.55, ry);
      ctx.arc(rx, ry, Math.max(rr * 0.55, 0.5), 0, 6.2832);
      ctx.stroke();
    }
    ctx.lineWidth = 2;
    var w, wx;
    for (w = 0; w < 3; w++) {
      var wy = bandTop + bandH * (0.25 + w * 0.25);
      a = 0.9 * envAt(wy, scanY, bandH);
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      ctx.strokeStyle = WATER;
      ctx.beginPath();
      for (wx = bx; wx <= bx + sw; wx += 8) {
        var wyy = wy + Math.sin(wx * 0.06 + t * 2 + w * 2) * 3;
        if (wx === bx) ctx.moveTo(wx, wyy);
        else ctx.lineTo(wx, wyy);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // Scan band wash and the bright scan line itself.
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = CYAN;
  ctx.fillRect(0, bandTop, W, bandH);
  ctx.globalAlpha = 1;
  ctx.fillStyle = CYAN;
  ctx.fillRect(0, scanY - 1.5, W, 3);
}

// Frame one is drawn synchronously at a constant phase.
draw(0);

var t0 = null;
function loop(ts) {
  if (t0 === null) t0 = ts;
  draw((ts - t0) / 1000);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function onResize() {
  draw(curT);
}
var vv2 = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
if (vv2 && vv2.addEventListener) vv2.addEventListener('resize', onResize);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', onResize);
</script>
</body>
</html>
