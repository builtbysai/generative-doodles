<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>So Much Time</title>
<style>
html, body { margin: 0; padding: 0; background: #14090A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: three voices at incommensurate periods drifting in and out of
   phase; the felt phenomenon is waiting for the rare moment all three
   land together, and the held breath when they do. A child's voice
   (quick, bright), an adult voice (slower, lower), and a guitar
   (longest, patient) each loop a ribbon across a dark, still booth.
   Sometimes the three heads meet and the frame holds its breath, then
   they separate again. The viewer waits for the convergences. Watch only. */
var TAU = Math.PI * 2;
var GROUND = '#14090A';
var GROUND_HI = '#1C0C0D';
var CHILD = '#F2E6A2';
var ADULT = '#33507F';
var GUITAR = '#C07A3E';
var DUST = '#8A8580';
var PLATE = '#1E0D0E';
var PLATE_LINE = 'rgba(242,230,162,0.20)';
var TITLE_INK = '#F2E6A2';
var HINT_INK = '#A89E96';
var FRAME_T = 23.0;        /* fixed phase: heads mid drift and distinct */
var PERIODS = [7.0, 11.0, 17.0];   /* child, adult, guitar: incommensurate */
var BAND_Y = [0.30, 0.50, 0.70];   /* band centers, in field units */
var COLORS = [CHILD, ADULT, GUITAR];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* seeded dust: dim gray particles riding each band, marking each thread's path */
var DUST_P = (function () {
  var rng = mulberry32(1871), out = [], b, i;
  for (b = 0; b < 3; b++) {
    for (i = 0; i < 26; i++) {
      out.push({ band: b, u: rng(), off: (rng() - 0.5) * 0.055, r: 0.6 + rng() * 1.4 });
    }
  }
  return out;
})();
/* seeded wall specks: faint dust on the booth walls at the field edges */
var SPECKS = (function () {
  var rng = mulberry32(18711), out = [], i;
  for (i = 0; i < 40; i++) {
    out.push({ x: rng(), y: rng(), r: 0.5 + rng() * 1.0, a: 0.02 + rng() * 0.05 });
  }
  return out;
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* Phase of voice i at time t, in [0,1). Periods 7, 11, 17 are incommensurate. */
function phase(i, t) {
  var p = (t / PERIODS[i]) % 1;
  return p < 0 ? p + 1 : p;
}
/* Convergence: how tightly the three phases cluster on the circle.
   Computed from the mean resultant length of the three phase angles,
   so alignments arrive unannounced and are never faked. */
function convergence(t) {
  var sx = 0, sy = 0, i, a;
  for (i = 0; i < 3; i++) {
    a = TAU * phase(i, t);
    sx += Math.cos(a); sy += Math.sin(a);
  }
  var r = Math.sqrt(sx * sx + sy * sy) / 3;
  return Math.pow(clamp(r, 0, 1), 4);
}
/* Mean head position, in field units, for the breath glow. */
function meanHead(t, sc) {
  var sx = 0, sy = 0, i, a;
  for (i = 0; i < 3; i++) {
    a = TAU * phase(i, t);
    sx += Math.cos(a); sy += Math.sin(a);
  }
  var ang = Math.atan2(sy, sx);
  var p = ang / TAU;
  if (p < 0) p += 1;
  return { x: sc.x + p * sc.w, p: p };
}
/* Wave height of band i at field fraction u and time t. */
function waveY(i, u, t, sc) {
  var amp = sc.h * 0.038;
  return sc.y + sc.h * BAND_Y[i] + amp * Math.sin(TAU * (1.5 * u - phase(i, t)) + i * 1.9);
}
function drawBand(i, t, sc, align) {
  var p = phase(i, t);
  var headX = sc.x + p * sc.w;
  var headY = waveY(i, p, t, sc);
  var col = COLORS[i];
  var baseA = 0.16 + 0.10 * align;
  var x, u, y, n;
  /* faint full ribbon: the whole loop, always visible, low and patient */
  ctx.strokeStyle = rgba(col, baseA);
  ctx.lineWidth = Math.max(1, sc.w * 0.0022);
  ctx.beginPath();
  n = 120;
  for (x = 0; x <= n; x++) {
    u = x / n;
    y = waveY(i, u, t, sc);
    if (x === 0) ctx.moveTo(sc.x + u * sc.w, y); else ctx.lineTo(sc.x + u * sc.w, y);
  }
  ctx.stroke();
  /* bright trail: the part of the ribbon just behind the travelling head.
     Drawn in up to two segments so the wrap at the left edge never
     chords straight across the frame. */
  var trail = 0.42; /* fraction of the loop kept bright behind the head */
  ctx.strokeStyle = rgba(col, 0.55 + 0.30 * align);
  ctx.lineWidth = Math.max(1.5, sc.w * 0.004);
  function trailSeg(u0, u1) {
    var k, uu, yy, nn = 40;
    ctx.beginPath();
    for (k = 0; k <= nn; k++) {
      uu = u0 + (u1 - u0) * (k / nn);
      yy = waveY(i, uu, t, sc);
      if (k === 0) ctx.moveTo(sc.x + uu * sc.w, yy); else ctx.lineTo(sc.x + uu * sc.w, yy);
    }
    ctx.stroke();
  }
  if (p >= trail) trailSeg(p - trail, p);
  else { trailSeg(p - trail + 1, 1); trailSeg(0, p); }
  /* the head: a glowing dot marking where this voice is in its loop */
  var hr = Math.max(2.5, sc.w * 0.007);
  var g = ctx.createRadialGradient(headX, headY, 0, headX, headY, hr * 5);
  g.addColorStop(0, rgba(col, 0.55 + 0.30 * align));
  g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(headX + hr * 5, headY); ctx.arc(headX, headY, hr * 5, 0, TAU); ctx.fill();
  ctx.fillStyle = rgba(col, 0.95);
  ctx.beginPath(); ctx.moveTo(headX + hr, headY); ctx.arc(headX, headY, hr, 0, TAU); ctx.fill();
  return { x: headX, y: headY };
}
function drawDust(t, sc, align) {
  var i, d;
  for (i = 0; i < DUST_P.length; i++) {
    d = DUST_P[i];
    var p = phase(d.band, t);
    var behind = p - d.u;
    if (behind < 0) behind += 1; /* distance behind the head, in loop fractions */
    var a = 0;
    if (behind < 0.6) a = 0.28 * (1 - behind / 0.6);
    else a = 0.03;
    a *= 1 + 0.8 * align;
    if (a <= 0.005) continue;
    var px = sc.x + d.u * sc.w;
    var py = waveY(d.band, d.u, t, sc) + d.off * sc.h;
    ctx.fillStyle = rgba(DUST, a);
    ctx.beginPath();
    ctx.moveTo(px + d.r, py);
    ctx.arc(px, py, d.r, 0, TAU);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('So Much Time').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('So Much Time').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 25').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('So Much Time', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 25', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. Three voices drift in and out of phase.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var sc = fieldRect();
  var t = phaseT;
  var align = convergence(t);
  var breath = smooth(clamp((align - 0.55) / 0.40, 0, 1));
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  if (!isPhone) {
    ctx.fillStyle = GROUND_HI;
    ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
    ctx.strokeStyle = rgba(CHILD, 0.07);
    ctx.lineWidth = 1;
    ctx.strokeRect(sc.x + 0.5, sc.y + 0.5, sc.w - 1, sc.h - 1);
  }
  /* booth walls, barely visible at the edges of the field */
  var wallW = Math.max(6, sc.w * 0.018);
  ctx.fillStyle = rgba('#000000', 0.35);
  ctx.fillRect(sc.x, sc.y, wallW, sc.h);
  ctx.fillRect(sc.x + sc.w - wallW, sc.y, wallW, sc.h);
  ctx.fillStyle = rgba(CHILD, 0.05);
  ctx.fillRect(sc.x + wallW, sc.y, 1, sc.h);
  ctx.fillRect(sc.x + sc.w - wallW - 1, sc.y, 1, sc.h);
  /* seeded specks on the ground */
  var i;
  for (i = 0; i < SPECKS.length; i++) {
    var sp = SPECKS[i];
    ctx.fillStyle = rgba(DUST, sp.a);
    ctx.beginPath();
    ctx.moveTo(sc.x + sp.x * sc.w + sp.r, sc.y + sp.y * sc.h);
    ctx.arc(sc.x + sp.x * sc.w, sc.y + sp.y * sc.h, sp.r, 0, TAU);
    ctx.fill();
  }
  /* the held breath: when the three phases cluster, a soft pale glow
     gathers where the heads meet and the ribbons brighten */
  if (breath > 0.01) {
    var mh = meanHead(t, sc);
    var cy = sc.y + sc.h * 0.5;
    var gr = Math.min(sc.w, sc.h) * 0.30;
    var g = ctx.createRadialGradient(mh.x, cy, 0, mh.x, cy, gr);
    g.addColorStop(0, rgba(CHILD, 0.20 * breath));
    g.addColorStop(1, rgba(CHILD, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(mh.x + gr, cy); ctx.arc(mh.x, cy, gr, 0, TAU); ctx.fill();
  }
  /* dust first, then the three ribbons over it */
  drawDust(t, sc, align);
  drawBand(0, t, sc, align);
  drawBand(1, t, sc, align);
  drawBand(2, t, sc, align);
  drawPlates();
}
/* ---- frame one: fixed phase t = 23.0 s, heads mid drift and distinct ----
   child phase 0.29, adult phase 0.09, guitar phase 0.35: no convergence yet */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
