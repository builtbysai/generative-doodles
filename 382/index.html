<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.382 First Collection, Again</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101014; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.382 First Collection, Again (jenkbdoodles).
// After Jen K's archive mining: her own recurring motifs,
// dropped from her first collection into new designs. The
// bank is exactly ten path recipes: crescent, star, eye,
// moth, crystal, tulip, raven, dragon-scale, cactus, birch
// leaf. Each generation is a maximalist toss rebuilt from
// 5-7 of those motifs in ONE of three palette duos on
// near-black #101014: gold #C9A24B + cream #F3EBDD, teal
// #5BA3C4 + purple #B565A7, oxblood #7A2E4A + amber
// #D97E36. Generations come from a FIXED AUTHORED TABLE
// (GENS below): each entry names its motifs, its duo and
// its scatter seed. Nothing is chosen at runtime.
// The prompt's two offscreen generation buffers are
// forbidden by house rule, so the crossfade is data-only
// on this ONE canvas: on a double-tap the old generation
// is drawn as usual, then the new generation is drawn
// over it at rising alpha across 1.5s.
// Loop: a seamless 40s master loop (LOOP). Every icon
// drifts on a tiny sine path whose x and y cycle counts
// are whole numbers per loop, so frame 40s is
// pixel-identical to frame 0 at rest. Stars and crystals
// twinkle between opacity 0.6 and 1.0 on periods of 5s
// and 4s, whole divisors of the loop.
// Interaction: DOUBLE-TAP only, advancing the generation
// table with the crossfade. Single taps and drags do
// nothing; there is no click-to-reload, no text, no UI.
// Flat colour only, no shading.
// Determinism: the first frame is drawn synchronously at
// the constant phase T = 13.7 (generation 1 complete,
// drift mid-cycle, no fade running), never Date.now()
// minus an offset, and the animation advances from that
// anchor in fixed 1/60 ticks.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 40;
var TAU = Math.PI * 2;
var PAGE = '#101014';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 13.7, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var FADE_LEN = 1.5;

// ---- palette -------------------------------------------------------------
var GROUND = '#101014';
var DUOS = [
  ['#C9A24B', '#F3EBDD'], // gold + cream
  ['#5BA3C4', '#B565A7'], // teal + purple
  ['#7A2E4A', '#D97E36']  // oxblood + amber
];

// ---- seeded rng ------------------------------------------------------------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- the motif bank ---------------------------------------------------------
// Exactly ten motifs. SIZE is each motif's natural scale
// band: L large, M mid, S micro (star / crystal / scale /
// leaf fill the gaps, as stars and crystals did in her
// celestial tosses).
var BANK = ['crescent', 'star', 'eye', 'moth', 'crystal',
            'tulip', 'raven', 'scale', 'cactus', 'leaf'];
var SIZE = {
  crescent: 'L', raven: 'L',
  moth: 'M', eye: 'M', tulip: 'M', cactus: 'M',
  star: 'S', crystal: 'S', scale: 'S', leaf: 'S'
};
if (BANK.length !== 10) throw new Error('First Collection needs a bank of exactly 10 motifs');
// Per-type rotation range (radians) and mirror flip.
var ROT = {
  crescent: 0.45, raven: 0.35, moth: 0.28, eye: 0.28,
  tulip: 0.14, cactus: 0.08, star: 0.35, crystal: 0.30,
  scale: 0.30, leaf: 0.90
};
var FLIP = { raven: true, tulip: true, leaf: true, moth: true };

// ---- the generation table -----------------------------------------------------
// Fixed and authored: motifs (5-7 from the bank), duo
// (index into DUOS), scatter seed. Double-tap walks this
// table in order and wraps. The generation counter is
// internal only; no text is ever drawn.
var GENS = [
  { motifs: ['crescent', 'moth', 'eye', 'tulip', 'star', 'crystal'], duo: 0, seed: 38211 },
  { motifs: ['raven', 'cactus', 'eye', 'leaf', 'scale', 'star'], duo: 1, seed: 38222 },
  { motifs: ['crescent', 'tulip', 'moth', 'cactus', 'crystal', 'leaf'], duo: 2, seed: 38233 },
  { motifs: ['raven', 'eye', 'scale', 'star', 'leaf', 'crystal'], duo: 0, seed: 38244 },
  { motifs: ['crescent', 'tulip', 'cactus', 'moth', 'star', 'scale', 'leaf'], duo: 1, seed: 38255 },
  { motifs: ['raven', 'tulip', 'eye', 'crystal', 'leaf', 'star'], duo: 2, seed: 38266 },
  { motifs: ['crescent', 'moth', 'cactus', 'eye', 'scale', 'crystal'], duo: 0, seed: 38277 },
  { motifs: ['raven', 'tulip', 'eye', 'moth', 'leaf', 'star'], duo: 1, seed: 38288 }
];
for (var gi = 0; gi < GENS.length; gi++) {
  var g = GENS[gi];
  if (g.motifs.length < 5 || g.motifs.length > 7) throw new Error('generation must pull 5-7 motifs');
  if (g.duo < 0 || g.duo > 2) throw new Error('generation duo out of range');
  for (var gm = 0; gm < g.motifs.length; gm++) {
    if (BANK.indexOf(g.motifs[gm]) < 0) throw new Error('generation motif outside the bank');
  }
}

// ---- generation builder ---------------------------------------------------------
// Exactly 240 icons per generation, in three bands on
// seeded jittered grids: 24 large, 72 mid, 144 micro,
// anchors bleeding 50px past the design edges so the
// toss never opens a gap. Band membership comes from the
// generation's own motifs via SIZE; every authored entry
// carries at least one L, two M and two S motifs.
function buildGeneration(entry) {
  var rng = mulberry32(entry.seed);
  var duo = DUOS[entry.duo];
  var icons = [];
  function addIcon(type, x, y, r, amp, twinkle) {
    var ci = rng() < 0.5 ? 0 : 1;
    icons.push({
      type: type, x: x, y: y, r: r,
      rot: (rng() * 2 - 1) * ROT[type],
      col: duo[ci], col2: duo[1 - ci],
      flip: FLIP[type] && rng() < 0.5 ? -1 : 1,
      ax: amp * (0.6 + rng() * 0.7), ay: amp * (0.6 + rng() * 0.7),
      kx: 1 + Math.floor(rng() * 3), ky: 1 + Math.floor(rng() * 3),
      px: rng() * TAU, py: rng() * TAU,
      tw: (twinkle && (type === 'star' || type === 'crystal')) ? (rng() < 0.5 ? 8 : 10) : 0,
      twp: rng() * TAU
    });
  }
  function scatter(types, cols, rows, rMin, rMax, amp, twinkle) {
    var order = [], i, j, k, tmp;
    for (i = 0; i < cols * rows; i++) order.push(types[i % types.length]);
    for (i = order.length - 1; i > 0; i--) {
      j = Math.floor(rng() * (i + 1));
      tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    var x0 = -50, y0 = -50, cw = (DW + 100) / cols, ch = (DH + 100) / rows;
    for (k = 0; k < order.length; k++) {
      var cx = k % cols, cy = Math.floor(k / cols);
      var x = x0 + (cx + 0.5) * cw + (rng() * 2 - 1) * cw * 0.30;
      var y = y0 + (cy + 0.5) * ch + (rng() * 2 - 1) * ch * 0.30;
      addIcon(order[k], x, y, rMin + rng() * (rMax - rMin), amp, twinkle);
    }
  }
  var L = [], M = [], Sm = [], mi;
  for (mi = 0; mi < entry.motifs.length; mi++) {
    if (SIZE[entry.motifs[mi]] === 'L') L.push(entry.motifs[mi]);
    else if (SIZE[entry.motifs[mi]] === 'M') M.push(entry.motifs[mi]);
    else Sm.push(entry.motifs[mi]);
  }
  if (!L.length || M.length < 2 || Sm.length < 2) throw new Error('generation lacks a band');
  scatter(L, 6, 4, 52, 80, 8, false);        // 24 large
  scatter(M, 9, 8, 30, 45, 6, false);        // 72 mid
  scatter(Sm, 12, 12, 11, 18, 4, true);      // 144 micro
  if (icons.length !== 240) throw new Error('First Collection needs exactly 240 icons per generation');
  return icons;
}

// ---- motif recipes -------------------------------------------------------------
// Each recipe draws its motif centred on the origin at
// half-size r, in the icon's duo colours (col primary,
// col2 secondary). Direct path data only.

function drawMoon(r, col) {
  // Crescent from two arcs: the outer circle less an offset
  // inner circle, intersection angles computed exactly.
  var d = 0.45 * r, r2 = 0.78 * r;
  var x = (d * d + r * r - r2 * r2) / (2 * d);
  var y = Math.sqrt(Math.max(0, r * r - x * x));
  ctx.beginPath();
  ctx.arc(0, 0, r, Math.atan2(-y, x), Math.atan2(y, x), true);
  ctx.arc(d, 0, r2, Math.atan2(y, x - d), Math.atan2(-y, x - d), false);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
}

function drawStar(r, col) {
  var i, a, rad;
  ctx.beginPath();
  for (i = 0; i < 10; i++) {
    a = -Math.PI / 2 + i * (TAU / 10);
    rad = (i % 2 === 0) ? r : r * 0.45;
    if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
    else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
}

function drawEye(r, col, col2) {
  // Almond outline in the duo's second colour, pupil in
  // the primary with a tiny secondary centre dot.
  ctx.beginPath();
  ctx.moveTo(-r, 0);
  ctx.quadraticCurveTo(0, -r * 0.92, r, 0);
  ctx.quadraticCurveTo(0, r * 0.92, -r, 0);
  ctx.closePath();
  ctx.strokeStyle = col2;
  ctx.lineWidth = Math.max(1.6, r * 0.15);
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.32, 0, TAU);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.10, 0, TAU);
  ctx.fillStyle = col2;
  ctx.fill();
}

function drawMoth(r, col) {
  ctx.fillStyle = col;
  var s;
  for (s = -1; s <= 1; s += 2) {
    ctx.save();
    ctx.scale(s, 1);
    ctx.beginPath();
    ctx.ellipse(r * 0.46, -r * 0.10, r * 0.60, r * 0.40, -0.5, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(r * 0.40, r * 0.42, r * 0.46, r * 0.32, 0.6, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.beginPath();
  ctx.ellipse(0, r * 0.10, r * 0.17, r * 0.52, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, -r * 0.44, r * 0.17, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1.4, r * 0.09);
  ctx.lineCap = 'round';
  for (s = -1; s <= 1; s += 2) {
    ctx.beginPath();
    ctx.moveTo(s * r * 0.08, -r * 0.52);
    ctx.quadraticCurveTo(s * r * 0.45, -r * 0.95, s * r * 0.85, -r * 0.88);
    ctx.stroke();
  }
}

function drawCrystal(r, col) {
  // Diamond outline with three facet lines.
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1.4, r * 0.13);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(r * 0.60, -r * 0.30);
  ctx.lineTo(r * 0.38, r);
  ctx.lineTo(-r * 0.38, r);
  ctx.lineTo(-r * 0.60, -r * 0.30);
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-r * 0.60, -r * 0.30);
  ctx.lineTo(r * 0.60, -r * 0.30);
  ctx.moveTo(0, -r);
  ctx.lineTo(-r * 0.38, r);
  ctx.moveTo(0, -r);
  ctx.lineTo(r * 0.38, r);
  ctx.stroke();
}

function drawTulip(r, col, col2) {
  // Stem and one leaf in the secondary colour, then the
  // head: three pointed petals, the side pair swung out
  // from the flower's base, the centre petal tallest.
  ctx.strokeStyle = col2;
  ctx.lineWidth = Math.max(1.6, r * 0.11);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, r);
  ctx.quadraticCurveTo(r * 0.06, r * 0.45, 0, r * 0.08);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, r * 0.62);
  ctx.quadraticCurveTo(-r * 0.48, r * 0.52, -r * 0.55, r * 0.08);
  ctx.quadraticCurveTo(-r * 0.30, r * 0.48, 0, r * 0.50);
  ctx.closePath();
  ctx.fillStyle = col2;
  ctx.fill();
  var s;
  ctx.fillStyle = col;
  for (s = -1; s <= 1; s += 2) {
    ctx.save();
    ctx.translate(0, r * 0.10);
    ctx.rotate(s * 0.52);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-r * 0.30, -r * 0.28, -r * 0.26, -r * 0.72, 0, -r * 0.88);
    ctx.bezierCurveTo(r * 0.26, -r * 0.72, r * 0.30, -r * 0.28, 0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.beginPath();
  ctx.moveTo(0, r * 0.10);
  ctx.bezierCurveTo(-r * 0.30, -r * 0.20, -r * 0.24, -r * 0.72, 0, -r * 1.0);
  ctx.bezierCurveTo(r * 0.24, -r * 0.72, r * 0.30, -r * 0.20, 0, r * 0.10);
  ctx.closePath();
  ctx.fill();
}

function drawRaven(r, col) {
  // Flat silhouette in flight, facing left: raised wing
  // over a plump body, round head with a heavy beak, and
  // a long notched tail fan behind. Eye is a ground dot.
  ctx.fillStyle = col;
  ctx.beginPath(); // tail fan
  ctx.moveTo(r * 0.30, -r * 0.05);
  ctx.lineTo(r * 1.02, -r * 0.34);
  ctx.lineTo(r * 0.88, -r * 0.02);
  ctx.lineTo(r * 1.04, r * 0.22);
  ctx.lineTo(r * 0.40, r * 0.22);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath(); // body
  ctx.ellipse(0, r * 0.08, r * 0.52, r * 0.34, 0.18, 0, TAU);
  ctx.fill();
  ctx.beginPath(); // raised wing
  ctx.moveTo(-r * 0.18, -r * 0.10);
  ctx.bezierCurveTo(-r * 0.05, -r * 0.75, r * 0.30, -r * 1.0, r * 0.62, -r * 0.92);
  ctx.bezierCurveTo(r * 0.45, -r * 0.55, r * 0.30, -r * 0.30, r * 0.22, -r * 0.05);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath(); // head
  ctx.arc(-r * 0.52, -r * 0.22, r * 0.27, 0, TAU);
  ctx.fill();
  ctx.beginPath(); // beak
  ctx.moveTo(-r * 0.72, -r * 0.32);
  ctx.lineTo(-r * 1.04, -r * 0.16);
  ctx.lineTo(-r * 0.70, -r * 0.08);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-r * 0.58, -r * 0.28, Math.max(1.5, r * 0.055), 0, TAU);
  ctx.fillStyle = GROUND;
  ctx.fill();
}

function drawScale(r, col, col2) {
  // One dragon scale: a domed scallop with a pointed tip,
  // an inner arc and a small ring at its heart, the
  // secondary colour carrying the inner linework.
  ctx.beginPath();
  ctx.moveTo(-r, r * 0.42);
  ctx.arc(0, r * 0.42, r, Math.PI, 0);
  ctx.lineTo(0, r);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, r * 0.42, r * 0.60, Math.PI, 0);
  ctx.strokeStyle = col2;
  ctx.lineWidth = Math.max(1.3, r * 0.10);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, r * 0.30, r * 0.16, 0, TAU);
  ctx.stroke();
}

function drawCactus(r, col, col2) {
  // Saguaro drawn as one thick round-capped stroke path:
  // trunk and two arms. A tiny secondary flower sits on
  // the crown.
  ctx.strokeStyle = col;
  ctx.lineWidth = r * 0.34;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(0, r * 0.92);
  ctx.lineTo(0, -r * 0.78);
  ctx.moveTo(0, r * 0.18);
  ctx.lineTo(-r * 0.52, r * 0.18);
  ctx.lineTo(-r * 0.52, -r * 0.32);
  ctx.moveTo(0, -r * 0.02);
  ctx.lineTo(r * 0.52, -r * 0.02);
  ctx.lineTo(r * 0.52, -r * 0.48);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, -r * 0.92, r * 0.13, 0, TAU);
  ctx.fillStyle = col2;
  ctx.fill();
}

function drawLeaf(r, col, col2) {
  // Birch leaf: a pointed oval with a short stem and a
  // secondary centre vein.
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.bezierCurveTo(r * 0.72, -r * 0.38, r * 0.74, r * 0.38, 0, r * 0.92);
  ctx.bezierCurveTo(-r * 0.74, r * 0.38, -r * 0.72, -r * 0.38, 0, -r);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.74);
  ctx.lineTo(0, r * 1.04);
  ctx.strokeStyle = col2;
  ctx.lineWidth = Math.max(1.2, r * 0.09);
  ctx.lineCap = 'round';
  ctx.stroke();
}

var RECIPES = {
  crescent: drawMoon, star: drawStar, eye: drawEye, moth: drawMoth,
  crystal: drawCrystal, tulip: drawTulip, raven: drawRaven,
  scale: drawScale, cactus: drawCactus, leaf: drawLeaf
};

// ---- generation state and the crossfade --------------------------------------
// curIcons is the live generation. On a double-tap the
// current field is kept as prevIcons and the table
// advances; each tick adds TICK to the fade clock and
// the draw passes prevIcons at full alpha, then curIcons
// at fade / FADE_LEN, until the fade completes.
var genIdx = 0;
var curIcons = buildGeneration(GENS[0]);
var prevIcons = null;
var fade = FADE_LEN;
function advanceGeneration() {
  prevIcons = curIcons;
  genIdx = (genIdx + 1) % GENS.length;
  curIcons = buildGeneration(GENS[genIdx]);
  fade = 0;
}

// ---- drawing ---------------------------------------------------------------------

function drawField(icons, t) {
  var i, ic, dx, dy;
  for (i = 0; i < icons.length; i++) {
    ic = icons[i];
    dx = ic.x + ic.ax * Math.sin(TAU * (ic.kx * t / LOOP) + ic.px);
    dy = ic.y + ic.ay * Math.sin(TAU * (ic.ky * t / LOOP) + ic.py);
    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(ic.rot);
    if (ic.flip < 0) ctx.scale(-1, 1);
    if (ic.tw) ctx.globalAlpha *= 0.8 + 0.2 * Math.sin(TAU * (ic.tw * t / LOOP) + ic.twp);
    RECIPES[ic.type](ic.r, ic.col, ic.col2);
    ctx.restore();
  }
}

function draw(t) {
  if (prevIcons) {
    drawField(prevIcons, t);
    ctx.save();
    ctx.globalAlpha = Math.min(1, fade / FADE_LEN);
    drawField(curIcons, t);
    ctx.restore();
    ctx.globalAlpha = 1;
  } else {
    drawField(curIcons, t);
  }
}

// ---- sizing -------------------------------------------------------------------------

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- pointer: double-tap advances the generation ---------------------------------
// A tap is a press and release within 12 design px and
// 0.5s on the piece clock. Two taps landing within 0.45s
// of each other advance the table; after an advance the
// pairing resets, so a triple tap cannot skip two
// generations. Single taps and drags do nothing else.
var downInfo = null;
var lastTap = -10;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downInfo = { x: p.x, y: p.y, t: T };
});
canvas.addEventListener('pointerup', function (e) {
  if (!downInfo) return;
  var p = toDesign(e);
  var moved = Math.sqrt((p.x - downInfo.x) * (p.x - downInfo.x) + (p.y - downInfo.y) * (p.y - downInfo.y));
  var held = T - downInfo.t;
  downInfo = null;
  if (moved > 12 || held > 0.5) { lastTap = -10; return; }
  if (T - lastTap < 0.45) { advanceGeneration(); lastTap = -10; }
  else lastTap = T;
});
canvas.addEventListener('pointercancel', function () { downInfo = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Cover-fit: the field fills any viewport, full-bleed.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAGE;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  ctx.fillStyle = GROUND;
  ctx.fillRect(-60, -60, DW + 120, DH + 120);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK;
    if (prevIcons) {
      fade += TICK;
      if (fade >= FADE_LEN) { prevIcons = null; fade = FADE_LEN; }
    }
    acc -= TICK; guard++;
  }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
