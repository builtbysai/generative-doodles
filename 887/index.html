<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Board Is Listening</title>
<style>
  html, body { margin:0; padding:0; background:#08080A; height:100%; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.887 "The Board Is Listening" - one particle field, three nervous systems.
   A single control state (controlAt) drives the field forces, the panel
   traces and the audio gains: one source of truth. */

// ---------- seeded RNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,u){return a+(b-a)*u;}
function smoother(u){u=clamp(u,0,1);return u*u*u*(u*(u*6-15)+10);}

var COL={bg:'#08080A',stick:'#7FD8E8',brain:'#FF2E88',sound:'#FFB000',particle:'#E8E8E0'};
var INPUTS=['stick','brain','sound'];
var NAMES={stick:'STICK',brain:'BRAIN',sound:'SOUND'};

var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');

// ---------- sizing (Visual Viewport API, px pinned in draw) ----------
var W=300,H=300,DPR=1,PHONE=false;
function resize(){
  var vv=window.visualViewport;
  var w=vv?vv.width:window.innerWidth;
  var h=vv?vv.height:window.innerHeight;
  DPR=window.devicePixelRatio||1; if(DPR>2)DPR=2;
  W=w; H=h;
  canvas.width=Math.round(w*DPR); canvas.height=Math.round(h*DPR);
  var sw=window.screen?Math.min(window.screen.width,window.screen.height):9999;
  PHONE=(sw<700)||(h>w*1.15);
  buildParticles();
}
if(window.visualViewport&&window.visualViewport.addEventListener)window.visualViewport.addEventListener('resize',resize);
window.addEventListener('resize',resize);

// ---------- particles (seeded homes; motion is closed-form) ----------
var particles=[];
function buildParticles(){
  var rnd=mulberry32(887048);
  var n=PHONE?240:400;
  particles=[];
  for(var i=0;i<n;i++){
    particles.push({
      hx:0.03+rnd()*0.94, hy:0.03+rnd()*0.62,
      p1:rnd()*6.2832, p2:rnd()*6.2832, p3:rnd()*6.2832, p4:rnd()*6.2832,
      size:0.8+rnd()*1.3, alpha:0.35+rnd()*0.5
    });
  }
}

// ---------- input weights: morph segments over recorded taps ----------
var INITW={stick:1,brain:0,sound:0};
var wSegs=[{t0:-1e9,from:INITW,to:INITW}];
var currentTarget={stick:1,brain:0,sound:0};
function weightsAt(t){
  var seg=wSegs[0];
  for(var i=0;i<wSegs.length;i++){ if(wSegs[i].t0<=t) seg=wSegs[i]; else break; }
  var u=smoother((t-seg.t0)/2);
  return {stick:lerp(seg.from.stick,seg.to.stick,u),
          brain:lerp(seg.from.brain,seg.to.brain,u),
          sound:lerp(seg.from.sound,seg.to.sound,u)};
}
function setTarget(to,t){
  wSegs.push({t0:t,from:weightsAt(t),to:to});
  currentTarget=to;
}

// ---------- STICK control: autonomous wander + recorded drag segments ----------
function wander(t){
  return {x:0.42+0.13*Math.sin(t*0.09+3.6)+0.055*Math.sin(t*0.21+2.2),
          y:0.28+0.06*Math.sin(t*0.043+0.9)+0.03*Math.cos(t*0.09+2.0)};
}
var stickSegs=[]; // {samples:[{t,x,y}], tEnd}
function stickCtrl(t){
  var seg=null;
  for(var i=0;i<stickSegs.length;i++){ if(stickSegs[i].samples[0].t<=t) seg=stickSegs[i]; else break; }
  if(!seg) return wander(t);
  var s=seg.samples, last=s[s.length-1];
  if(t<=last.t){
    if(t<=s[0].t) return {x:s[0].x,y:s[0].y};
    for(var j=1;j<s.length;j++){
      if(s[j].t>=t){
        var u=(t-s[j-1].t)/Math.max(1e-4,(s[j].t-s[j-1].t));
        return {x:lerp(s[j-1].x,s[j].x,u), y:lerp(s[j-1].y,s[j].y,u)};
      }
    }
    return {x:last.x,y:last.y};
  }
  var rel=(seg.tEnd!=null)?seg.tEnd:last.t;
  var u2=(t-rel)/1.6;
  if(u2>=1) return wander(t);
  var w=wander(t), e=smoother(u2);
  return {x:lerp(last.x,w.x,e), y:lerp(last.y,w.y,e)};
}

// ---------- BRAIN control: burst trains ----------
var dragBursts=[]; // {t0, amp, seed}
var burstCount=0;
var autoBursts=[];
(function(){
  var r=mulberry32(4242), tt=2.5;
  while(tt<2400){
    autoBursts.push({t0:tt, amp:0.5+r()*0.7, seed:((tt*1000)|0)+77});
    tt+=2.2+r()*2.8;
  }
})();
function burstEnv(b,t){
  var rnd=mulberry32(b.seed), v=0;
  var n=4+((rnd()*3)|0);
  for(var k=0;k<n;k++){
    var g=k*(0.055+rnd()*0.05), w=0.45+rnd()*0.6;
    var dt=t-(b.t0+g);
    if(dt>0) v+=b.amp*w*Math.exp(-dt/0.085);
  }
  return v;
}
function brainSignal(t){
  var v=0, i, b;
  for(i=0;i<dragBursts.length;i++){ b=dragBursts[i]; if(b.t0>t) break; if(t-b.t0<2) v+=burstEnv(b,t); }
  for(i=0;i<autoBursts.length;i++){ b=autoBursts[i]; if(b.t0>t) break; if(t-b.t0<2 && weightsAt(b.t0).brain>0.4) v+=burstEnv(b,t); }
  v+=0.02*weightsAt(t).brain*(0.5+0.5*Math.sin(t*11.3)*Math.sin(t*5.7+1.3));
  return v;
}

// ---------- SOUND control: beat envelope ----------
var dragBeats=[]; // {t, amp}
function soundIntervals(){
  var out=[];
  for(var i=0;i<wSegs.length;i++){
    if(wSegs[i].to.sound>0.4){
      var a=wSegs[i].t0+2, b=(i+1<wSegs.length)?wSegs[i+1].t0:Infinity;
      if(b>a) out.push([a,b]);
    }
  }
  return out;
}
function soundSignal(t){
  var v=0, i;
  for(i=0;i<dragBeats.length;i++){ var dt=t-dragBeats[i].t; if(dt>0&&dt<1.5) v+=dragBeats[i].amp*Math.exp(-dt/0.13); }
  var iv=soundIntervals();
  for(i=0;i<iv.length;i++){
    var a=iv[i][0], b=iv[i][1];
    if(t<a) continue;
    var k0=Math.max(0,Math.ceil((t-1.5-a)/0.857)), k1=Math.floor((Math.min(t,b-1e-4)-a)/0.857);
    for(var k=k0;k<=k1;k++){ var tb=a+k*0.857; v+=0.85*Math.exp(-(t-tb)/0.13); }
  }
  return v;
}

// ---------- the one control state ----------
function controlAt(t){
  var w=weightsAt(t), sc=stickCtrl(t);
  return {w:w, sx:sc.x, sy:sc.y, brain:brainSignal(t), sound:soundSignal(t)};
}

// ---------- trace histories: sampled from controlAt, 12 s window ----------
var hist={stick:[],brain:[],sound:[]};
function pushSample(t){
  var S=controlAt(t);
  hist.stick.push([t, S.w.stick>0.4 ? S.sx : 0.5]);
  hist.brain.push([t, clamp(S.brain,0,1.15)/1.15]);
  hist.sound.push([t, clamp(S.sound,0,1)]);
  var cut=t-12.6;
  for(var k=0;k<INPUTS.length;k++){ var a=hist[INPUTS[k]]; while(a.length&&a[0][0]<cut) a.shift(); }
}
for(var pt=-12; pt<=0.0001; pt+=1/15) pushSample(pt);

// ---------- particle field ----------
function particlePos(p,t,S){
  var bx=p.hx + 0.020*Math.sin(t*0.13+p.p1) + 0.010*Math.sin(t*0.051+p.p2);
  var by=p.hy + 0.022*Math.sin(t*0.107+p.p3) + 0.011*Math.cos(t*0.063+p.p4);
  var dx=S.sx-bx, dy=S.sy-by, d2=dx*dx+dy*dy;
  var pull=S.w.stick*0.6*Math.exp(-d2/0.10);
  var x=bx+dx*pull, y=by+dy*pull, boost=pull;
  var bcx=0.5+0.3*Math.sin(t*0.21+2.0), bcy=0.33+0.16*Math.sin(t*0.17+0.7);
  var bdx=x-bcx, bdy=y-bcy, bd=Math.sqrt(bdx*bdx+bdy*bdy)+1e-4;
  var bl=S.w.brain*S.brain*0.055*Math.exp(-bd/0.13);
  x+=bdx/bd*bl; y+=bdy/bd*bl;
  boost+=S.w.brain*S.brain*Math.exp(-bd/0.13);
  var cx=x-0.5, cy=y-0.34, cd=Math.sqrt(cx*cx+cy*cy)+1e-4;
  var pu=S.w.sound*S.sound*0.03*Math.sin(cd*20.0);
  x+=cx/cd*pu; y+=cy/cd*pu;
  boost+=S.w.sound*S.sound*0.35;
  return [x,y,boost];
}
function hexRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function tintColor(S){
  var base=hexRgb(COL.particle), dom=COL.stick, dw=S.w.stick;
  if(S.w.brain>dw){dom=COL.brain;dw=S.w.brain;}
  if(S.w.sound>dw){dom=COL.sound;dw=S.w.sound;}
  var d=hexRgb(dom), m=0.28*dw;
  return 'rgb('+Math.round(lerp(base[0],d[0],m))+','+Math.round(lerp(base[1],d[1],m))+','+Math.round(lerp(base[2],d[2],m))+')';
}

// ---------- draw ----------
function draw(t){
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=COL.bg; ctx.fillRect(0,0,W,H);
  var S=controlAt(t), Sp=controlAt(t-0.12);
  var fieldH=H*0.70, panelH=H-fieldH, stripH=panelH/3;
  var U=Math.min(W,H);

  // field
  ctx.strokeStyle=tintColor(S);
  ctx.lineCap='round';
  ctx.lineWidth=Math.max(1,U*0.0022);
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    var a=particlePos(p,t,S), b=particlePos(p,t-0.12,Sp);
    var flick=1+0.35*S.w.brain*S.brain*Math.sin(t*29+p.p2*11);
    ctx.globalAlpha=clamp(p.alpha*(0.55+0.75*Math.min(a[2],1))*flick,0,1);
    ctx.beginPath();
    ctx.moveTo(b[0]*W,b[1]*H);
    ctx.lineTo(a[0]*W,a[1]*H);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  // stick control point marker
  if(S.w.stick>0.03){
    ctx.strokeStyle=COL.stick; ctx.fillStyle=COL.stick;
    ctx.globalAlpha=0.30*S.w.stick;
    ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(S.sx*W,S.sy*H,U*0.014,0,6.2832); ctx.stroke();
    ctx.globalAlpha=0.65*S.w.stick;
    ctx.beginPath(); ctx.arc(S.sx*W,S.sy*H,U*0.005,0,6.2832); ctx.fill();
  }
  // sound pulse ring
  if(S.w.sound>0.03 && S.sound>0.02){
    ctx.strokeStyle=COL.sound;
    ctx.globalAlpha=0.18*S.w.sound*Math.min(S.sound,1);
    ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(0.5*W,0.34*H,U*(0.06+0.20*(1-Math.min(S.sound,1))),0,6.2832); ctx.stroke();
  }
  ctx.globalAlpha=1;

  // panel
  ctx.fillStyle='rgba(232,228,224,0.03)'; ctx.fillRect(0,fieldH,W,panelH);
  ctx.fillStyle='rgba(232,228,224,0.16)'; ctx.fillRect(0,fieldH,W,1);
  var fs=clamp(Math.round(U*0.021),10,13);
  ctx.font='600 '+fs+'px Menlo, Consolas, monospace';
  ctx.textBaseline='alphabetic';
  var labelW=Math.max(64,W*0.14), tx0=labelW+6, tx1=W-10;
  for(var s=0;s<3;s++){
    var key=INPUTS[s], y0=fieldH+s*stripH, wgt=S.w[key];
    if(s>0){ ctx.fillStyle='rgba(232,228,224,0.08)'; ctx.fillRect(0,y0,W,1); }
    if(wgt>0.02){
      ctx.globalAlpha=0.055*wgt; ctx.fillStyle=COL[key]; ctx.fillRect(0,y0,W,stripH);
      ctx.globalAlpha=1;
    }
    ctx.fillStyle=COL[key]; ctx.globalAlpha=0.30+0.70*wgt;
    ctx.fillRect(0,y0+stripH*0.18,3,stripH*0.64);
    ctx.globalAlpha=0.45+0.55*wgt;
    ctx.fillText(NAMES[key],12,y0+stripH/2+fs*0.35);
    // trace: the input's real control value, last 12 s
    ctx.globalAlpha=0.30+0.70*wgt;
    ctx.strokeStyle=COL[key]; ctx.lineWidth=1.4;
    ctx.beginPath();
    var a=hist[key], started=false;
    for(var j=0;j<a.length;j++){
      var X=tx0+(a[j][0]-(t-12))/12*(tx1-tx0);
      var Y=y0+stripH-4-a[j][1]*(stripH-10);
      if(!started){ ctx.moveTo(X,Y); started=true; } else ctx.lineTo(X,Y);
    }
    ctx.stroke();
    ctx.globalAlpha=1;
  }
}

// ---------- audio: three voices crossfaded by the same weights ----------
var AC=null, aNodes=null;
function initAudio(){
  if(AC) { if(AC.resume) AC.resume(); return; }
  var Ctor=window.AudioContext||window.webkitAudioContext;
  if(typeof Ctor!=='function') return;
  try{
    AC=new Ctor();
    var master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    var nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    var d=nb.getChannelData(0), r=mulberry32(887);
    for(var i=0;i<d.length;i++) d[i]=r()*2-1;
    // stick: saw through lowpass
    var o1=AC.createOscillator(); o1.type='sawtooth'; o1.frequency.value=110;
    var f1=AC.createBiquadFilter(); f1.type='lowpass'; f1.frequency.value=900;
    var g1=AC.createGain(); g1.gain.value=0;
    o1.connect(f1); f1.connect(g1); g1.connect(master); o1.start();
    // brain: noise through bandpass
    var ns=AC.createBufferSource(); ns.buffer=nb; ns.loop=true;
    var f2=AC.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=1600; f2.Q.value=0.8;
    var g2=AC.createGain(); g2.gain.value=0;
    ns.connect(f2); f2.connect(g2); g2.connect(master); ns.start();
    // sound: square thump + noise hat
    var o3=AC.createOscillator(); o3.type='square'; o3.frequency.value=52;
    var g3=AC.createGain(); g3.gain.value=0;
    o3.connect(g3); g3.connect(master); o3.start();
    var ns2=AC.createBufferSource(); ns2.buffer=nb; ns2.loop=true; ns2.playbackRate.value=1.7;
    var f4=AC.createBiquadFilter(); f4.type='highpass'; f4.frequency.value=6000;
    var g4=AC.createGain(); g4.gain.value=0;
    ns2.connect(f4); f4.connect(g4); g4.connect(master); ns2.start();
    aNodes={g1:g1,f1:f1,o1:o1,g2:g2,g3:g3,g4:g4};
  }catch(e){ AC=null; aNodes=null; }
}
function updateAudio(t){
  if(!AC||!aNodes) return;
  var S=controlAt(t), ct=AC.currentTime;
  aNodes.g1.gain.setTargetAtTime(0.055*S.w.stick,ct,0.1);
  aNodes.o1.frequency.setTargetAtTime(70+S.sx*180,ct,0.1);
  aNodes.f1.frequency.setTargetAtTime(300+(1-S.sy)*1800,ct,0.1);
  aNodes.g2.gain.setTargetAtTime(0.14*S.w.brain*Math.min(S.brain,1.2),ct,0.03);
  aNodes.g3.gain.setTargetAtTime(0.16*S.w.sound*Math.min(S.sound,1),ct,0.02);
  aNodes.g4.gain.setTargetAtTime(0.05*S.w.sound*Math.pow(Math.min(S.sound,1),3),ct,0.02);
}

// ---------- pointer interaction ----------
var T0=(typeof performance!=='undefined'&&performance.now)?performance.now():0;
function nowS(){ return ((typeof performance!=='undefined'&&performance.now)?performance.now():T0)/1000 - T0/1000; }
var drag=null, curStickSeg=null, lastTap=null;
function evPos(e){
  var r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{left:0,top:0};
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function handleTap(pt,t){
  var fy=pt.y/H;
  if(fy>=0.70){
    var idx=Math.min(2,Math.floor((fy-0.70)/0.10));
    var to={stick:0,brain:0,sound:0}; to[INPUTS[idx]]=1;
    setTarget(to,t);
    lastTap={t:t,field:false};
  }else{
    if(lastTap&&lastTap.field&&(t-lastTap.t)<0.35){
      setTarget({stick:1,brain:1,sound:1},t);
      lastTap=null;
    }else{
      lastTap={t:t,field:true};
    }
  }
}
canvas.addEventListener('pointerdown',function(e){
  initAudio();
  var pt=evPos(e), t=nowS();
  drag={downT:t,downX:pt.x,downY:pt.y,moved:false,lastBurst:-9,lastBeat:-9,prevSpd:0,prevDir:null,px:pt.x/W,py:pt.y/H,pt:t};
  if(currentTarget.stick>0.5){
    curStickSeg={samples:[{t:t,x:pt.x/W,y:pt.y/H}],tEnd:null};
    stickSegs.push(curStickSeg);
  }else curStickSeg=null;
  if(canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
});
canvas.addEventListener('pointermove',function(e){
  if(!drag) return;
  var pt=evPos(e), t=nowS();
  var fx=pt.x/W, fy=pt.y/H;
  var dt=Math.max(1e-3,t-drag.pt);
  var spd=Math.sqrt((fx-drag.px)*(fx-drag.px)+(fy-drag.py)*(fy-drag.py))/dt;
  if(Math.abs(pt.x-drag.downX)+Math.abs(pt.y-drag.downY)>10) drag.moved=true;
  if(curStickSeg) curStickSeg.samples.push({t:t,x:fx,y:fy});
  if(currentTarget.brain>0.5 && spd>0.25 && t-drag.lastBurst>0.22){
    dragBursts.push({t0:t, amp:Math.min(1.2,0.4+spd*0.5),
      seed:(burstCount*7919+((spd*100)|0)*131+((Math.atan2(fy-drag.py,fx-drag.px)*57.3+360)|0)*17+13)});
    burstCount++; drag.lastBurst=t;
  }
  if(currentTarget.sound>0.5){
    var dir=Math.atan2(fy-drag.py,fx-drag.px);
    var beat=false;
    if(drag.prevDir!=null){
      var dd=Math.abs(dir-drag.prevDir); if(dd>3.1416) dd=6.2832-dd;
      if(dd>1.0 && spd>0.15 && t-drag.lastBeat>0.26) beat=true;
    }
    if(drag.prevSpd>0.3 && spd<drag.prevSpd*0.55 && t-drag.lastBeat>0.26) beat=true;
    if(beat){ dragBeats.push({t:t, amp:Math.min(1,0.35+spd*0.6)}); drag.lastBeat=t; }
    drag.prevDir=dir;
  }
  drag.prevSpd=spd; drag.px=fx; drag.py=fy; drag.pt=t;
});
function endDrag(e){
  if(!drag) return;
  var t=nowS();
  if(curStickSeg) curStickSeg.tEnd=t;
  if(!drag.moved && t-drag.downT<0.35) handleTap({x:drag.downX,y:drag.downY},t);
  drag=null; curStickSeg=null;
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

// ---------- boot ----------
resize();
draw(0);
if(typeof requestAnimationFrame==='function'){
  var frame=function(){
    var t=nowS();
    pushSample(t);
    draw(t);
    updateAudio(t);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
