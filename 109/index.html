<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№109 · Single Curve</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F7F4EC; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(26,26,24,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to spin the drawing</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.109 Single Curve (nathanmoore). Seeded PRNG "Single Curve". STATIC poster:
// the whole image is exactly ONE polyline: a noise-driven random walk with a
// fixed step, reflected inside a centred square, drawn in a single path with
// no pen lifts. Drag rotates the whole drawing around its centre; the curve
// itself is never redrawn or reseeded, and release leaves it where it stopped.
const PAPER='#F7F4EC', INK='#1A1A18';
const SEED=hashStr('Single Curve');
const rnd=mulberry(SEED);
function h1(i){ let x=Math.imul(i^SEED,2654435761); x^=x>>>15; x=Math.imul(x,2246822519); x^=x>>>13; return (x>>>0)/4294967296; }
function noise1(u){ const i=Math.floor(u), f=u-i, s=f*f*(3-2*f); return h1(i)*(1-s)+h1(i+1)*s; }
const PTS=[];
(function build(){
  let x=0.5, y=0.5, heading=rnd()*Math.PI*2;
  const STEP=0.0038, STEPS=6400, LO=0.03, HI=0.97;
  PTS.push([x,y]);
  for(let k=0;k<STEPS;k++){
    heading+=(noise1(k*0.006)-0.5)*0.34;
    x+=Math.cos(heading)*STEP; y+=Math.sin(heading)*STEP;
    if(x<LO){ x=LO+(LO-x); heading=Math.PI-heading+(rnd()-0.5)*0.3; }
    if(x>HI){ x=HI-(x-HI); heading=Math.PI-heading+(rnd()-0.5)*0.3; }
    if(y<LO){ y=LO+(LO-y); heading=-heading+(rnd()-0.5)*0.3; }
    if(y>HI){ y=HI-(y-HI); heading=-heading+(rnd()-0.5)*0.3; }
    PTS.push([x,y]);
  }
})();
if(PTS.length!==6401) console.assert(false,'points',PTS.length);

let spin=0, dragging=false, lastAng=null;
function squareRect(w,h){
  const phone=isPhone();
  const side=phone? w*0.84 : Math.min(w,h)*0.74;
  return { x:(w-side)/2, y:(h-side)/2, side, cx:w/2, cy:h/2 };
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,w,h);
  const R=squareRect(w,h);
  ctx.save();
  ctx.translate(R.cx,R.cy); ctx.rotate(spin); ctx.translate(-R.cx,-R.cy);
  ctx.strokeStyle=INK; ctx.lineWidth=1.5; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  for(let i=0;i<PTS.length;i++){
    const px=R.x+PTS[i][0]*R.side, py=R.y+PTS[i][1]*R.side;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();
  ctx.restore();
  return { R };
}
let lastR=null;
function frameStore(nowMs){ const r=drawFrame(nowMs); lastR=r.R; }
function angAt(e){ if(!lastR) return 0; return Math.atan2(e.clientY-lastR.cy, e.clientX-lastR.cx); }
canvas.addEventListener('pointerdown',e=>{ dragging=true; lastAng=angAt(e); });
canvas.addEventListener('pointermove',e=>{ if(!dragging||lastAng===null) return; const a=angAt(e); let d=a-lastAng; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; spin+=d; lastAng=a; });
function endP(){ dragging=false; lastAng=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ frameStore(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
frameStore(1000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>frameStore(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>frameStore(performance.now()));
</script>
</body>
</html>
