<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excursus Square</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #C9B896;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // ------------------------------------------------------------------
  // Palette stacks. Stack 0 is the prompt's exact stack. Later stacks
  // are generated per index from a seeded stream, always inside the
  // muted ochre / rust / cream / slate family: no neon, ever.
  // Colors are stored as HSL so the drift can move hue directly.
  // ------------------------------------------------------------------

  function hexToHsl(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255;
    var g = parseInt(hex.slice(3, 5), 16) / 255;
    var b = parseInt(hex.slice(5, 7), 16) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    var l = (mx + mn) / 2, h = 0, s = 0;
    if (mx !== mn) {
      var d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s * 100, l * 100];
  }

  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var z = s;
      z = Math.imul(z ^ (z >>> 15), z | 1);
      z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
      return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
    };
  }

  var STACK0 = ['#C9B896', '#A85B3F', '#E5D6B8', '#2E3A4A'].map(hexToHsl);

  // One generated stack: outer warm neutral, band rust/terracotta,
  // inner cream, center deep slate or deep brown. Ranges keep every
  // stack muted and keep the value ladder (light, mid, lightest, dark)
  // that makes the nesting read.
  function genStack(index) {
    var rnd = mulberry32(757031 + index * 7919);
    function pick(lo, hi) { return lo + rnd() * (hi - lo); }
    var center = rnd() < 0.55
      ? [pick(203, 224), pick(16, 30), pick(19, 28)]   // deep slate
      : [pick(19, 31), pick(24, 38), pick(17, 25)];    // deep brown
    return [
      [pick(34, 48), pick(22, 38), pick(56, 70)],      // outer
      [pick(11, 26), pick(34, 50), pick(37, 49)],      // band
      [pick(37, 50), pick(29, 45), pick(73, 83)],      // inner
      center
    ];
  }

  var stackCache = [STACK0];
  function stackAt(index) {
    while (stackCache.length <= index) {
      stackCache.push(genStack(stackCache.length));
    }
    return stackCache[index];
  }

  // ------------------------------------------------------------------
  // Chromatic drift. Master cycle 360 s. Each band's hue drifts
  // +/-8 degrees on its own period; saturation breathes +/-2 points
  // on another. All offsets are sine functions with phase 0, so at
  // t = 0 every offset is exactly 0 and frame one is the pure stack.
  // Lightness never moves: the value relationships stay stable.
  // ------------------------------------------------------------------

  var HUE_PERIOD = [360, 288, 240, 360];
  var SAT_PERIOD = [216, 360, 180, 270];

  function drifted(base, band, t) {
    var dh = 8 * Math.sin(2 * Math.PI * t / HUE_PERIOD[band]);
    var ds = 2 * Math.sin(2 * Math.PI * t / SAT_PERIOD[band]);
    var h = (base[0] + dh) % 360;
    if (h < 0) h += 360;
    var s = Math.max(0, Math.min(100, base[1] + ds));
    return [h, s, base[2]];
  }

  function hslString(c) {
    return 'hsl(' + c[0].toFixed(2) + ',' + c[1].toFixed(2) + '%,' + c[2].toFixed(2) + '%)';
  }

  function lerpHsl(a, b, u) {
    var dh = b[0] - a[0];
    if (dh > 180) dh -= 360;
    if (dh < -180) dh += 360;
    return [a[0] + dh * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
  }

  function smooth(u) {
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    return u * u * (3 - 2 * u);
  }

  // ------------------------------------------------------------------
  // Reseed state. Double-tap advances to the next stack; the base
  // colors crossfade over 4 s, then drift applies on top. Only the
  // latest reseed matters: a reseed during a fade starts the new fade
  // from the stack being faded toward (recorded simplification).
  // ------------------------------------------------------------------

  var reseeds = []; // { t: seconds, from: index, to: index }

  function baseStackAt(t) {
    if (!reseeds.length) return { stack: stackAt(0), fade: null };
    var r = reseeds[reseeds.length - 1];
    var u = (t - r.t) / 4;
    if (u >= 1) return { stack: stackAt(r.to), fade: null };
    return { stack: stackAt(r.to), fade: { from: stackAt(r.from), u: smooth(u) } };
  }

  function bandColor(band, t) {
    var bs = baseStackAt(t);
    var base = bs.stack[band];
    if (bs.fade) base = lerpHsl(bs.fade.from[band], base, bs.fade.u);
    return hslString(drifted(base, band, t));
  }

  // ------------------------------------------------------------------
  // Geometry: four nested squares, truly centered, sized on the
  // smaller frame dimension. Band 0 is a full-frame fill (the outer
  // square bleeding past the edges); bands 1..3 are inset squares.
  // ------------------------------------------------------------------

  var SIDE = [0, 0.76, 0.52, 0.30]; // fraction of min(W,H); 0 = full frame

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var m = Math.min(W, H);
    var cx = W / 2, cy = H / 2;

    // Outer band: full-frame fill, no edge, no outline.
    ctx.fillStyle = bandColor(0, t);
    ctx.fillRect(0, 0, W, H);

    for (var b = 1; b < 4; b++) {
      var side = SIDE[b] * m;
      ctx.fillStyle = bandColor(b, t);
      ctx.fillRect(cx - side / 2, cy - side / 2, side, side);
    }

    // Page ground takes the outer band's current tone.
    if (document.body && document.body.style) {
      document.body.style.background = bandColor(0, t);
    }
  }

  // ------------------------------------------------------------------
  // Double-tap reseed. Two pointerdowns within 350 ms count as one
  // reseed. The event time comes from the frame clock (lastT), so the
  // whole state stays a function of (recorded events, t).
  // ------------------------------------------------------------------

  var lastT = 0;
  var lastTapAt = -10;
  var currentIndex = 0;

  function onPointerDown() {
    var t = lastT;
    if (t - lastTapAt <= 0.35) {
      reseeds.push({ t: t, from: currentIndex, to: currentIndex + 1 });
      currentIndex += 1;
      lastTapAt = -10;
    } else {
      lastTapAt = t;
    }
  }

  if (window.addEventListener) window.addEventListener('pointerdown', onPointerDown);

  // Inert QA hook (house convention): ?seed=tNN draws at loop time
  // NN seconds. Without the parameter the piece starts at t = 0.
  var startT = 0;
  var searchStr = (window.location && window.location.search) ||
    (typeof location !== 'undefined' ? location.search : '') || '';
  var sm = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(searchStr);
  if (sm) startT = parseFloat(sm[1]);

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(startT); });
  }
  window.addEventListener('resize', function () { resize(); draw(startT); });

  // Frame one: the synchronous draw at t = 0, the exact specced stack.
  lastT = startT;
  draw(startT);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts;
      lastT = startT + (ts - t0) / 1000;
      draw(lastT);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
