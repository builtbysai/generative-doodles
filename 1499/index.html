<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A World Without Words</title>
<style>
html,body{margin:0;padding:0;background:#b8bcc0;overflow:hidden}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var SNOW='#e8e0d0', SKY='#b8bcc0', CHAR='#2a2a30', SLATE='#4a5a7a', BRICK='#a8674a', OLIVE='#2f4636', SCAR='#c1272d';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var LOOP=90, BAND_T=30, PAN_T=24;
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0, H=0, lastT=0;
function size(){
  var vw=(window.visualViewport&&window.visualViewport.width)||window.innerWidth;
  var vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  W=vw; H=vh; cv.width=W; cv.height=H;
  cv.style.width=W+'px'; cv.style.height=H+'px';
}
size();
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function smooth(s){return s*s*(3-2*s);}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h);}
function disc(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function maxPan(){return 1.2*W;}
function autoOff(lt){
  var b=Math.floor(lt/BAND_T); var ph=lt-b*BAND_T;
  if(ph<PAN_T){return maxPan()*smooth(ph/PAN_T);}
  return maxPan();
}
function bandAt(lt){return Math.floor(lt/BAND_T)%3;}
var drag={active:false,downX:0,m0:0,curX:0,upT:null,mUp:0};
function manual(t){
  if(drag.active){return clamp(drag.m0+(drag.curX-drag.downX)*0.25,-maxPan(),maxPan());}
  if(drag.upT!==null){return drag.mUp*Math.exp(-(t-drag.upT)/3);}
  return 0;
}
function pDown(x,t){var m=manual(t);drag={active:true,downX:x,m0:m,curX:x,upT:null,mUp:0};}
function pMove(x){if(drag.active){drag.curX=x;}}
function pUp(t){if(drag.active){var m=manual(t);drag.active=false;drag.upT=t;drag.mUp=m;}}
/* Seeded figure rosters: fractions of strip width, coat, phase. */
function roster(seed,count,lo,hi){
  var rnd=mulberry32(seed); var out=[]; var coats=[CHAR,SLATE,BRICK,OLIVE];
  for(var i=0;i<count;i++){
    out.push({x:lo+(hi-lo)*(i+0.5)/count+(rnd()-0.5)*0.02, coat:coats[Math.floor(rnd()*4)], ph:rnd()*Math.PI*2});
  }
  return out;
}
var band0Figs=roster(1499000,4,0.10,0.90);
var band1Figs=roster(1499000+7919,4,0.12,0.88);
var band2Figs=roster(1499000+15838,6,0.08,0.92);
function figure(x,yBase,h,coat,lt,phase,seated,headCol){
  var hc=headCol||SNOW;
  var w=h*0.30;
  if(seated){
    var yS=yBase-h*0.53;
    rect(x-w/2,yS-h*0.52,w,h*0.52,coat);
    rect(x-w/2,yS-h*0.14,w*1.7,h*0.14,coat);
    rect(x+w*1.1,yS-h*0.14,w*0.30,yBase-(yS-h*0.14),coat);
    var hy=yS-h*0.66, hr=h*0.14;
    disc(x,hy,hr,hc);
    var eo=Math.sin(2*Math.PI*lt/30+phase)*hr*0.35;
    rect(x+eo-hr*0.12,hy-hr*0.10,hr*0.24,hr*0.24,CHAR);
  } else {
    rect(x-w/2,yBase-h*0.78,w,h*0.63,coat);
    rect(x-w/2,yBase-h*0.15,w*0.36,h*0.15,coat);
    rect(x+w*0.14,yBase-h*0.15,w*0.36,h*0.15,coat);
    var hy2=yBase-h*0.88, hr2=h*0.13;
    disc(x,hy2,hr2,hc);
    var eo2=Math.sin(2*Math.PI*lt/30+phase)*hr2*0.35;
    rect(x+eo2-hr2*0.12,hy2-hr2*0.10,hr2*0.24,hr2*0.24,CHAR);
  }
}
function drawBand(b,ox,lt){
  var BH=H/3, y0=b*BH, SW=2.2*W;
  var X=function(f){return ox+f*SW;};
  if(b===0){
    rect(0,y0, W,BH, SKY);
    rect(0,y0+0.72*BH, W,0.28*BH, SNOW);
    /* platform */
    rect(0,y0+0.58*BH, W,0.14*BH, CHAR);
    /* train body */
    var ty=y0+0.16*BH, th=0.38*BH;
    rect(X(0.04),ty,0.92*SW,th,SLATE);
    rect(X(0.04),ty,0.92*SW,0.05*BH,CHAR);
    for(var i=0;i<8;i++){
      var wx=0.08+i*0.11;
      rect(X(wx),ty+0.10*BH,0.05*SW,0.16*BH,SNOW);
    }
    /* the single scarlet accent: one train door, visible at frame one */
    rect(X(0.30),ty,0.045*SW,th,SCAR);
    for(var j=0;j<band0Figs.length;j++){
      var f=band0Figs[j];
      figure(X(f.x), y0+0.58*BH, 0.30*BH, f.coat, lt, f.ph, false);
    }
  } else if(b===1){
    rect(0,y0, W,BH, SNOW);
    rect(0,y0+0.80*BH, W,0.20*BH, CHAR);
    /* window */
    rect(X(0.06),y0+0.10*BH,0.16*SW,0.30*BH,SKY);
    rect(X(0.06),y0+0.10*BH,0.16*SW,0.03*BH,CHAR);
    /* bench */
    rect(X(0.10),y0+0.62*BH,0.80*SW,0.04*BH,SLATE);
    rect(X(0.14),y0+0.66*BH,0.03*SW,0.14*BH,CHAR);
    rect(X(0.82),y0+0.66*BH,0.03*SW,0.14*BH,CHAR);
    for(var k=0;k<band1Figs.length;k++){
      var g=band1Figs[k];
      figure(X(g.x), y0+0.80*BH, 0.34*BH, g.coat, lt, g.ph, true, SKY);
    }
  } else {
    rect(0,y0, W,BH, SNOW);
    /* grey building */
    rect(X(0.08),y0+0.06*BH,0.40*SW,0.60*BH,SKY);
    rect(X(0.08),y0+0.02*BH,0.40*SW,0.05*BH,CHAR);
    rect(X(0.24),y0+0.42*BH,0.08*SW,0.24*BH,CHAR);
    rect(X(0.14),y0+0.16*BH,0.07*SW,0.14*BH,SNOW);
    rect(X(0.34),y0+0.16*BH,0.07*SW,0.14*BH,SNOW);
    /* trees */
    var tx1=X(0.56), tx2=X(0.68);
    rect(tx1-0.01*SW,y0+0.30*BH,0.02*SW,0.30*BH,OLIVE);
    disc(tx1,y0+0.28*BH,0.07*BH,OLIVE);
    rect(tx2-0.01*SW,y0+0.34*BH,0.02*SW,0.26*BH,OLIVE);
    disc(tx2,y0+0.32*BH,0.06*BH,OLIVE);
    /* road through snow */
    rect(0,y0+0.72*BH, W,0.18*BH, CHAR);
    for(var m=0;m<band2Figs.length;m++){
      var q=band2Figs[m];
      figure(X(q.x), y0+0.72*BH, 0.30*BH, q.coat, lt, q.ph, false);
    }
  }
  rect(0,y0+BH-1, W,2, CHAR);
}
function draw(t){
  lastT=t;
  var lt=((t%LOOP)+LOOP)%LOOP;
  var active=bandAt(lt);
  var off=clamp(autoOff(lt)+manual(t),0,maxPan());
  rect(0,0,W,H,SKY);
  for(var b=0;b<3;b++){
    drawBand(b, b===active ? -off : 0, lt);
  }
}
function nowElapsed(){
  if(typeof performance!=='undefined'&&performance.now){return performance.now()/1000;}
  return Date.now()/1000;
}
var t0=nowElapsed();
function elapsed(){return nowElapsed()-t0;}
if(typeof window!=='undefined'&&window.__pieceBoot!==true){
  draw(0);
}
if(cv.addEventListener){
  cv.addEventListener('pointerdown',function(e){pDown(e.clientX,elapsed());});
  cv.addEventListener('pointermove',function(e){pMove(e.clientX);});
  cv.addEventListener('pointerup',function(e){pUp(elapsed());});
  cv.addEventListener('pointercancel',function(e){pUp(elapsed());});
}
if(window.visualViewport&&window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize',function(){size();draw(lastT);});
}
if(window.addEventListener){
  window.addEventListener('resize',function(){size();draw(lastT);});
}
function loop(){
  draw(elapsed());
  if(typeof requestAnimationFrame!=='undefined'){requestAnimationFrame(loop);}
}
if(typeof requestAnimationFrame!=='undefined'){requestAnimationFrame(loop);}
if(typeof window!=='undefined'){
  window.__piece={
    drawAt:function(t){draw(t);},
    down:function(t,x){pDown(x,t);},
    move:function(x){pMove(x);},
    up:function(t){pUp(t);},
    state:function(t){
      var lt=((t%LOOP)+LOOP)%LOOP;
      return {band:bandAt(lt), autoOff:autoOff(lt), manual:manual(t), total:clamp(autoOff(lt)+manual(t),0,maxPan())};
    }
  };
}
})();
</script>
</body>
</html>
