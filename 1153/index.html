<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Favourite Songs</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Favourite Songs — Antonio Roberts study AR2 ----------
  // After "Some of my Favourite Songs" (2012): sixteen mp3s fed into a
  // custom Pure Data program that reinterpreted their binary data as
  // images. Here: a 4x4 grid of sixteen imaginary songs, each panel a
  // seeded byte stream reinterpreted as flat pixels at a per-panel bit
  // depth (1, 2, 4 or 8 bits). Nothing here is a spectrogram or a
  // waveform — the bytes are read as pictures, not as sound.
  //
  // Panels breathe in stepped brightness only (0.55 / 0.75 / 1.0, never
  // a smooth fade), each at its own phase. Once per 14-second cycle,
  // one panel "remixes": for seconds 9-12 it re-interprets its bytes
  // at a different bit depth, then settles back. Watch-only.

  var T0 = 6.3;                // fixed phase for the deterministic first frame
  var CYCLE = 14;              // seconds per loop
  var REMIX_FROM = 9, REMIX_TO = 12;
  var GRID = 4;                // 4x4 panels
  var CELLS = 28;              // cells per panel edge
  var NCELL = CELLS * CELLS;
  var DEPTHS = [1, 2, 4, 8];
  var BRIGHTS = [0.55, 0.75, 1.0];
  var BG = '#0A0A0A', GUTTER = '#000000';
  // palette as RGB triples: #FF3B00 #00E5FF #FFD800 #7CFF00 #FF2E88 #FFFFFF
  var PALETTE = [
    [255, 59, 0], [0, 229, 255], [255, 216, 0],
    [124, 255, 0], [255, 46, 136], [255, 255, 255]
  ];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp255(v) { return v < 0 ? 0 : (v > 255 ? 255 : v); }

  // ---------- byte-stream generators (one structural family each) ----------
  // family 0: noise field — dense chaotic raw bytes
  function genNoise(rng, darkCut) {
    var b = new Uint8Array(NCELL);
    for (var i = 0; i < NCELL; i++) {
      var v = Math.floor(rng() * 256);
      b[i] = v < darkCut ? 0 : v;
    }
    return b;
  }
  // family 1: run-length bursts — long constant runs in row order (or
  // column order when vertical), with sudden "loud" runs of high bytes
  function genRuns(rng, vertical) {
    var seq = new Uint8Array(NCELL);
    var i = 0;
    while (i < NCELL) {
      var r = rng();
      var loud = r < 0.30;
      var v;
      if (r < 0.16) v = 0;                                    // silent run
      else if (loud) v = 180 + Math.floor(rng() * 76);       // loud bytes
      else v = Math.floor(rng() * 190);
      var len = 2 + Math.floor(rng() * (loud ? 24 : 13));
      for (var k = 0; k < len && i < NCELL; k++, i++) {
        seq[i] = clamp255(v + Math.floor(rng() * 9) - 4);
      }
    }
    if (!vertical) return seq;
    var b = new Uint8Array(NCELL);
    for (var y = 0; y < CELLS; y++)
      for (var x = 0; x < CELLS; x++) b[y * CELLS + x] = seq[x * CELLS + y];
    return b;
  }
  // family 2: block plateaus — constant blocks, some dark, grained edges
  function genBlocks(rng) {
    var b = new Uint8Array(NCELL);
    var bs = [4, 7, 14][Math.floor(rng() * 3)];
    for (var by = 0; by < CELLS; by += bs) {
      for (var bx = 0; bx < CELLS; bx += bs) {
        var r = rng();
        var v = r < 0.24 ? 0 : (r < 0.55 ? 170 + Math.floor(rng() * 86)
                                         : Math.floor(rng() * 220));
        for (var y = by; y < Math.min(by + bs, CELLS); y++) {
          for (var x = bx; x < Math.min(bx + bs, CELLS); x++) {
            b[y * CELLS + x] = rng() < 0.12 ? Math.floor(rng() * 256) : v;
          }
        }
      }
    }
    return b;
  }
  // family 3: scanline repeats — a few row patterns cycling with a
  // period, occasionally broken by a loud flat row
  function genScanlines(rng) {
    var b = new Uint8Array(NCELL);
    var nPat = 3 + Math.floor(rng() * 4);
    var pats = [];
    var p, x, y;
    for (p = 0; p < nPat; p++) {
      var row = new Uint8Array(CELLS);
      var i = 0;
      while (i < CELLS) {
        var v = rng() < 0.2 ? 0 : Math.floor(rng() * 256);
        var len = 1 + Math.floor(rng() * 7);
        for (var k = 0; k < len && i < CELLS; k++, i++) row[i] = v;
      }
      pats.push(row);
    }
    for (y = 0; y < CELLS; y++) {
      if (rng() < 0.13) {                                    // loud flat row
        var lv = 200 + Math.floor(rng() * 56);
        for (x = 0; x < CELLS; x++) b[y * CELLS + x] = clamp255(lv + Math.floor(rng() * 7) - 3);
      } else {
        var pat = pats[y % nPat];
        var off = Math.floor(y / nPat) % 3;                  // slight drift per repeat
        for (x = 0; x < CELLS; x++) b[y * CELLS + x] = pat[(x + off) % CELLS];
      }
    }
    return b;
  }

  // ---------- panel definitions ----------
  var panels = [];
  (function buildPanels() {
    for (var idx = 0; idx < GRID * GRID; idx++) {
      var rng = mulberry32(1153000 + idx * 7919);
      var family = idx % 4;
      var bytes;
      if (family === 0) bytes = genNoise(rng, [0, 24, 48][Math.floor(rng() * 3)]);
      else if (family === 1) bytes = genRuns(rng, rng() < 0.5);
      else if (family === 2) bytes = genBlocks(rng);
      else bytes = genScanlines(rng);
      var depthIdx = (idx * 7 + 1) % 4;                      // spread of 1/2/4/8 bits
      var remixIdx = (depthIdx + 1 + Math.floor(rng() * 3)) % 4;
      if (remixIdx === depthIdx) remixIdx = (remixIdx + 1) % 4;
      panels.push({
        bytes: bytes,
        depthIdx: depthIdx,
        remixIdx: remixIdx,
        rot: idx % 6,                                        // palette rotation
        phase: rng() * 9,                                    // brightness phase (s)
        stepDur: 1.3 + rng() * 1.4,                          // brightness step length (s)
        cache: {}                                            // (depth*3+bright) -> batches
      });
    }
  })();

  // ---------- byte -> flat color, at a bit depth ----------
  function cellColor(L, depth, rot) {
    if (L === 0) return null;                                // quiet byte: panel ground
    var levels = 1 << depth;
    var ci = (L % 6 + rot) % 6;
    var tier = Math.floor(L / 6);
    var maxTier = Math.floor((levels - 1) / 6);
    var inten = maxTier === 0 ? 1 : 0.35 + 0.65 * (tier / maxTier);
    var base = PALETTE[ci];
    return [Math.round(base[0] * inten), Math.round(base[1] * inten), Math.round(base[2] * inten)];
  }

  // Pre-batched draw lists per panel: for a given depth and brightness
  // step, group cell indices by final color string once, then reuse.
  function panelBatches(p, depthIdx, brightIdx) {
    var key = depthIdx * 3 + brightIdx;
    var hit = p.cache[key];
    if (hit) return hit;
    var depth = DEPTHS[depthIdx];
    var bright = BRIGHTS[brightIdx];
    var shift = 8 - depth;
    var map = {};
    for (var i = 0; i < NCELL; i++) {
      var b = p.bytes[i];
      var L = depth === 8 ? b : (b >> shift);
      var rgb = cellColor(L, depth, p.rot);
      if (!rgb) continue;
      var col = 'rgb(' + Math.round(rgb[0] * bright) + ',' +
                         Math.round(rgb[1] * bright) + ',' +
                         Math.round(rgb[2] * bright) + ')';
      if (!map[col]) map[col] = [];
      map[col].push(i);
    }
    var batches = [];
    for (var col in map) batches.push({ color: col, cells: map[col] });
    p.cache[key] = batches;
    return batches;
  }

  // ---------- viewport / sizing ----------
  var W = 0, H = 0, DPR = 1;
  function viewSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 800);
    var h = vv ? vv.height : (window.innerHeight || 600);
    return { w: w, h: h };
  }
  function isPhone() {
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr && scr.width && scr.height) {
      if (Math.min(scr.width, scr.height) < 700) return true;
    }
    return H > W * 1.15;
  }
  function fit() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  fit();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', fit);
  }
  window.addEventListener('resize', fit);

  // ---------- time ----------
  function nowSec() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : Date.now() / 1000;
  }
  var startStamp = nowSec();
  function pieceT() { return T0 + (nowSec() - startStamp); }

  // ---------- drawing ----------
  function draw(t) {
    // pin CSS size every draw (house rule for high-DPR phones)
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // square composition, centered; near full-width on phones
    var phone = isPhone();
    var side = Math.min(W, H) * (phone ? 0.98 : 0.94);
    if (phone) side = Math.min(W * 0.98, H * 0.98);
    var gx = (W - side) / 2, gy = (H - side) / 2;
    var gut = 2;
    var panelSide = (side - gut * (GRID - 1)) / GRID;
    var cell = panelSide / CELLS;

    // black gutter field behind the panels (2px gutters + black rim)
    ctx.fillStyle = GUTTER;
    ctx.fillRect(gx - gut, gy - gut, side + gut * 2, side + gut * 2);

    var cycle = Math.floor(t / CYCLE);
    var tIn = t - cycle * CYCLE;
    var remixing = tIn >= REMIX_FROM && tIn < REMIX_TO;
    var remixPanel = ((cycle % 16) + 16) % 16;

    for (var p = 0; p < panels.length; p++) {
      var panel = panels[p];
      var px = gx + (p % GRID) * (panelSide + gut);
      var py = gy + Math.floor(p / GRID) * (panelSide + gut);

      ctx.fillStyle = BG;
      ctx.fillRect(px, py, panelSide, panelSide);

      var depthIdx = (remixing && p === remixPanel) ? panel.remixIdx : panel.depthIdx;
      var brightIdx = Math.floor((t + panel.phase) / panel.stepDur) % 3;
      var batches = panelBatches(panel, depthIdx, brightIdx);

      for (var bi = 0; bi < batches.length; bi++) {
        var batch = batches[bi];
        ctx.fillStyle = batch.color;
        ctx.beginPath();
        for (var ci2 = 0; ci2 < batch.cells.length; ci2++) {
          var cellIdx = batch.cells[ci2];
          var cx = cellIdx % CELLS, cy = Math.floor(cellIdx / CELLS);
          ctx.rect(px + cx * cell, py + cy * cell, cell + 0.6, cell + 0.6);
        }
        ctx.fill();
      }
    }
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(pieceT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
