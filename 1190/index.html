<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice Cream Truck at Channel 19</title>
<style>
  html, body { margin:0; padding:0; background:#0E0E11; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* №1190 — Ice Cream Truck at Channel 19 (Jeff Kolar JK7, Ice Cream Truck
   Songs + Channel 19, 2018). A striped truck glyph drives a 90s
   figure-eight over a city-block grid, broadcasting an 8-note music-box
   motif every 4s bar. Note-dots fly in straight lines to three fixed CB
   receivers, which replay the motif at fixed fidelities set by their
   distance class: NEAR clean, MID drops every other note, FAR stretches
   and detunes it into smeared ribbons. Dragging raises temporary
   buildings that block a receiver's line of sight and degrade its replay
   one step further. Silent — the jingle is drawn. */

// ---------- seeded hashes ----------
function ihash(a,b){var x=Math.imul(a^0x9E3779B9,0x85EBCA6B)^Math.imul(b+1,0xC2B2AE35);x^=x>>>13;x=Math.imul(x,0x27D4EB2F);x^=x>>>15;return (x>>>0)/4294967296;}

// ---------- constants ----------
var BG='#0E0E11', GRID='#222228';
var NOTE='#FFE14D';
var TRUCK='#FF8A00', AWN_W='#FFFFFF', AWN_P='#FF2B6E';
var RCOL=['#00FFC2','#C77B3F','#4D9FFF'];       // NEAR / MID / FAR
var RNAME=['NEAR','MID','FAR'];
var T0=26.4;          // frame one: bar 6 mid-flight, FAR mid-smear
var LAP=90;           // one figure-eight lap, seconds
var BAR=4;            // motif bar length, seconds
var SPEED=0.55;       // signal speed, x field width per second

// ---------- canvas / view ----------
var canvas=document.getElementById('cv');
var ctx=canvas.getContext('2d');
var W=0,H=0,phone=false,S=1;
function viewW(){ var vv=window.visualViewport; return vv?vv.width:window.innerWidth; }
function viewH(){ var vv=window.visualViewport; return vv?vv.height:window.innerHeight; }
function fit(){
  W=viewW(); H=viewH();
  canvas.width=W; canvas.height=H;
  var sw=window.screen?Math.min(window.screen.width,window.screen.height):9999;
  phone = sw<700 || H>W*1.15;
  S=Math.min(W,H)/720;
}
if(window.visualViewport){ window.visualViewport.addEventListener('resize',fit); }
window.addEventListener('resize',fit);
fit();

// ---------- receivers (fixed corners, fixed distance classes) ----------
var RCV=[
  {fx:0.90, fy:0.14, cls:0},
  {fx:0.08, fy:0.86, cls:1},
  {fx:0.92, fy:0.88, cls:2}
];
function rcvPos(r){ return [RCV[r].fx*W, RCV[r].fy*H]; }

// ---------- truck path (figure-eight, closed form) ----------
function truckPos(t){
  var u=2*Math.PI*t/LAP;
  return [W/2 + 0.34*W*Math.sin(u), H/2 + 0.30*H*Math.sin(u)*Math.cos(u)];
}
function truckHeading(t){
  var u=2*Math.PI*t/LAP;
  var dx=0.34*W*Math.cos(u), dy=0.30*H*Math.cos(2*u);
  return Math.atan2(dy,dx);
}

// ---------- motif ----------
function pitchOf(k,j){ return Math.floor(ihash(k*3+11,j*7+1)*5); } // 0..4
function arcOff(j,pitch){
  return [(j-3.5)*15*S, -(34+pitch*10)*S];
}
function originOf(k,j){
  var emit=BAR*k+0.5*j;
  var tp=truckPos(emit), off=arcOff(j,pitchOf(k,j));
  return [tp[0]+off[0], tp[1]+off[1]];
}

// ---------- buildings (drag events) ----------
var buildings=[]; // {x0,y0,x1,y1,birth} pixel coords + piece-time
function segBlocked(x0,y0,x1,y1,emitT){
  for(var b=0;b<buildings.length;b++){
    var bd=buildings[b], age=emitT-bd.birth;
    if(age<0||age>=6) continue;
    for(var s2=0;s2<=24;s2++){
      var f=s2/24, x=x0+(x1-x0)*f, y=y0+(y1-y0)*f;
      if(x>=bd.x0&&x<=bd.x1&&y>=bd.y0&&y<=bd.y1) return true;
    }
  }
  return false;
}

// ---------- drawing ----------
function drawGrid(){
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=GRID; ctx.lineWidth=1;
  var sp=Math.min(W,H)*0.125;
  ctx.beginPath();
  for(var x=sp;x<W;x+=sp){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for(var y=sp;y<H;y+=sp){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();
  // faint route trace
  ctx.strokeStyle='#23232B'; ctx.globalAlpha=0.55; ctx.lineWidth=1;
  ctx.setLineDash([2,6]);
  ctx.beginPath();
  for(var i=0;i<=128;i++){
    var p=truckPos(i/128*LAP);
    if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);
  }
  ctx.closePath(); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;
}

function drawBuildings(t){
  for(var b=0;b<buildings.length;b++){
    var bd=buildings[b], age=t-bd.birth;
    if(age<0||age>=6) continue;
    var al = age<4 ? 0.88 : 0.88*(6-age)/2;
    ctx.fillStyle='#060607'; ctx.globalAlpha=al;
    ctx.fillRect(bd.x0,bd.y0,bd.x1-bd.x0,bd.y1-bd.y0);
    ctx.strokeStyle='#2A2A30'; ctx.globalAlpha=Math.min(1,al+0.12); ctx.lineWidth=1;
    ctx.strokeRect(bd.x0+0.5,bd.y0+0.5,bd.x1-bd.x0-1,bd.y1-bd.y0-1);
  }
  ctx.globalAlpha=1;
}

function drawReceiver(r,t,active){
  var p=rcvPos(r), col=RCOL[r];
  var bw=22*S, bh=13*S;
  // base box
  ctx.fillStyle='#17171B'; ctx.fillRect(p[0]-bw/2,p[1]-bh,bw,bh);
  ctx.strokeStyle=col; ctx.globalAlpha=0.75; ctx.lineWidth=1;
  ctx.strokeRect(p[0]-bw/2+0.5,p[1]-bh+0.5,bw-1,bh-1);
  ctx.globalAlpha=1;
  // mast + dish
  ctx.strokeStyle='#8A8A93'; ctx.lineWidth=Math.max(1,1.4*S);
  ctx.beginPath(); ctx.moveTo(p[0],p[1]-bh); ctx.lineTo(p[0],p[1]-bh-20*S); ctx.stroke();
  ctx.beginPath(); ctx.arc(p[0],p[1]-bh-23*S,4.5*S,-0.6,Math.PI+0.6); ctx.stroke();
  // activity LED
  ctx.fillStyle=col; ctx.globalAlpha=active?1:0.25;
  ctx.beginPath(); ctx.arc(p[0],p[1]-bh/2,2.2*S,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  // label
  ctx.fillStyle=col; ctx.font=Math.round(10*Math.max(S,0.75))+'px monospace';
  ctx.textAlign='center';
  ctx.fillText(RNAME[r], p[0], p[1]+14*Math.max(S,0.75));
}

function draw(t){
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  drawGrid();
  drawBuildings(t);

  var speed=SPEED*W;
  var kMin=Math.max(0,Math.floor((t-11)/BAR)), kMax=Math.floor(t/BAR);
  var active=[false,false,false];

  // ----- transmissions: flights + replays -----
  for(var k=kMin;k<=kMax;k++){
    for(var j=0;j<8;j++){
      var emit=BAR*k+0.5*j;
      if(emit>t) continue;
      var org=originOf(k,j), pitch=pitchOf(k,j);
      // source motif dot (lives for its bar, anchored at emission point)
      if(t<BAR*(k+1)){
        var sa=Math.min(1,(t-emit)/0.15);
        if(t>BAR*(k+1)-0.5) sa*= (BAR*(k+1)-t)/0.5;
        ctx.fillStyle=NOTE; ctx.globalAlpha=0.95*sa;
        ctx.beginPath(); ctx.arc(org[0],org[1],3.4*S,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1;
      }
      for(var r=0;r<3;r++){
        var rp=rcvPos(r);
        var dx=rp[0]-org[0], dy=rp[1]-org[1];
        var dist=Math.sqrt(dx*dx+dy*dy);
        var travel=dist/speed, arr=emit+travel;
        var effCls=RCV[r].cls + (segBlocked(org[0],org[1],rp[0],rp[1],emit)?1:0);
        if(effCls>3) effCls=3;
        if(t<arr){
          // in flight: straight line, yellow
          var f=(t-emit)/travel;
          ctx.fillStyle=NOTE; ctx.globalAlpha=0.9;
          ctx.beginPath(); ctx.arc(org[0]+dx*f,org[1]+dy*f,2.6*S,0,Math.PI*2); ctx.fill();
          ctx.globalAlpha=1;
        } else {
          // replay at the receiver, degraded by class
          var smear = effCls>=2;
          var life = smear?3.0:2.4;
          var age=t-arr;
          if(age>=life) continue;
          if(effCls===1 && j%2===1) continue;   // MID drops every other note
          if(effCls===3 && j%2===1) continue;   // blocked FAR: gaps too
          active[r]=true;
          var fadeIn=Math.min(1,age/0.12), fadeOut=age>life-0.6?(life-age)/0.6:1;
          var off=arcOff(j,pitch);
          if(!smear){
            ctx.fillStyle=RCOL[r]; ctx.globalAlpha=fadeIn*fadeOut;
            ctx.beginPath(); ctx.arc(rp[0]+off[0],rp[1]-16*S+off[1],3.4*S,0,Math.PI*2); ctx.fill();
            ctx.globalAlpha=1;
          } else {
            // smeared ribbon: stretched, detuned, at reduced alpha
            var det=(ihash(k*5+3,j*13+7)-0.5)*22*S;
            var len=(28+ihash(k*7+1,j*3+2)*22)*S;
            var cx=rp[0]+off[0]*1.2, cy=rp[1]-16*S+off[1]*1.15+det;
            var baseA = effCls===3?0.22:0.45;
            ctx.fillStyle=RCOL[r]; ctx.globalAlpha=baseA*fadeIn*fadeOut;
            ctx.fillRect(cx-len/2,cy-2.6*S,len,5.2*S);
            ctx.globalAlpha=baseA*1.6*fadeIn*fadeOut;
            ctx.fillRect(cx-len/2,cy-0.8*S,len,1.6*S);
            ctx.globalAlpha=1;
          }
        }
      }
    }
  }

  // ----- receivers -----
  for(var r2=0;r2<3;r2++) drawReceiver(r2,t,active[r2]);

  // ----- truck -----
  var tp=truckPos(t), hd=truckHeading(t);
  ctx.save();
  ctx.translate(tp[0],tp[1]);
  ctx.rotate(hd);
  if(Math.cos(hd)<0) ctx.scale(1,-1);   // keep the glyph upright on leftward legs
  var s=S;
  // awning (striped band over the box)
  for(var a=0;a<6;a++){
    ctx.fillStyle = a%2===0?AWN_P:AWN_W;
    ctx.fillRect((-28+a*7.4)*s,-19*s,7.4*s,8*s);
  }
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(-28*s,-11.6*s,44.4*s,1.6*s);
  // body + cab
  ctx.fillStyle=TRUCK;
  ctx.fillRect(-28*s,-10*s,44*s,19*s);
  ctx.fillRect(16*s,-3*s,12*s,12*s);
  ctx.fillStyle='#D8F2FF'; ctx.globalAlpha=0.9;
  ctx.fillRect(19*s,0,7*s,6*s);         // cab window
  ctx.globalAlpha=1;
  // CH 19 band text
  ctx.fillStyle='#401F00'; ctx.font='bold '+Math.round(7*Math.max(s,0.7))+'px monospace';
  ctx.textAlign='center';
  ctx.fillText('CH 19', -6*s, 5.5*s);
  // wheels
  ctx.fillStyle='#141416';
  ctx.beginPath(); ctx.arc(-18*s,10*s,4.6*s,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(18*s,10*s,4.6*s,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3A3A40';
  ctx.beginPath(); ctx.arc(-18*s,10*s,1.8*s,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(18*s,10*s,1.8*s,0,Math.PI*2); ctx.fill();
  // antenna + pulsing tip (a note leaves every 0.5s)
  ctx.strokeStyle='#C7C7CC'; ctx.lineWidth=Math.max(1,1.3*s);
  ctx.beginPath(); ctx.moveTo(-22*s,-19*s); ctx.lineTo(-22*s,-31*s); ctx.stroke();
  var lastEmit=Math.floor(t*2)/2;
  var pulse=Math.max(0,1-(t-lastEmit)/0.45);
  ctx.fillStyle=NOTE; ctx.globalAlpha=0.35+0.65*pulse;
  ctx.beginPath(); ctx.arc(-22*s,-31*s,(2.2+2.6*pulse)*s,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
}

// ---------- pointer: drag raises buildings ----------
var dragStart=null, dragNow=null;
function pieceT(){ return T0+(performance.now()/1000-t0wall); }
function normRect(a,b){
  return {x0:Math.min(a[0],b[0]), y0:Math.min(a[1],b[1]),
          x1:Math.max(a[0],b[0]), y1:Math.max(a[1],b[1])};
}
canvas.addEventListener('pointerdown',function(e){ dragStart=[e.clientX,e.clientY]; dragNow=[e.clientX,e.clientY]; });
canvas.addEventListener('pointermove',function(e){ if(dragStart) dragNow=[e.clientX,e.clientY]; });
window.addEventListener('pointerup',function(){
  if(!dragStart||!dragNow){ dragStart=null; return; }
  var r=normRect(dragStart,dragNow);
  if(r.x1-r.x0>=8&&r.y1-r.y0>=8){
    r.birth=pieceT();
    buildings.push(r);
    if(buildings.length>12) buildings.splice(0,buildings.length-12);
  }
  dragStart=null; dragNow=null;
});

// draw wrapper that overlays the in-progress drag rect
var drawBase=draw;
draw=function(t){
  drawBase(t);
  if(dragStart&&dragNow){
    var r=normRect(dragStart,dragNow);
    ctx.fillStyle='#060607'; ctx.globalAlpha=0.88;
    ctx.fillRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);
    ctx.strokeStyle='#2A2A30'; ctx.globalAlpha=1;
    ctx.strokeRect(r.x0+0.5,r.y0+0.5,r.x1-r.x0-1,r.y1-r.y0-1);
    ctx.globalAlpha=1;
  }
};

// ---------- run ----------
var t0wall=performance.now()/1000;
draw(T0);
if(typeof requestAnimationFrame==='function'){
  var loop=function(){
    draw(T0+(performance.now()/1000-t0wall));
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
