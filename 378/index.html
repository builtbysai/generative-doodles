<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.378 Marine Building Fan</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101014; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.378 Marine Building Fan (jenkbdoodles).
// After Jen K's art-deco celestial maximalism, the
// flapper sunburst she drew from the Marine Building
// elevator doors: 36 gold ray bundles rise from an
// arc centre below the frame, spreading 140 degrees
// across near-black, with one oxblood band among
// them. Cream and gold celestial icons (crescent
// moons, stars, all-seeing eyes, crystals) sit inside
// the fan wedge, large at the rim and shrinking
// toward the arc. WATCH-ONLY: no pointer handling at
// all. The rays breathe, thickening and thinning on
// a 12s cycle, and every 20s a shimmer band sweeps
// across them: translucent cream strokes drawn
// directly over the rays in the band's angular span
// on this ONE canvas, nothing composited, no layer,
// no gradient. All jitter is fixed seeded data baked
// at load, never per-frame noise.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#101014', GOLD = '#C9A24B', DEEP = '#8A6A2E';
var CREAM = '#F3EBDD', STAR = '#E8C547', OXBLOOD = '#7A2E4A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 60;
if (LOOP !== 60) throw new Error('Marine Building Fan loop must be 60s');
var BREATH = 12; // 5 whole breath cycles per loop
if (LOOP % BREATH !== 0) throw new Error('breath must complete whole cycles per loop');
var SHIMMER = 20; // 3 whole shimmer sweeps per loop
if (LOOP % SHIMMER !== 0) throw new Error('shimmer must complete whole cycles per loop');
var TICK = 1 / 60;
var DEG = Math.PI / 180;

// ---- fan geometry --------------------------------------
// Arc centre below the frame; the wedge spans exactly
// 140 degrees, from -160 to -20 in canvas angles
// (0 = +x, positive angles turn toward +y, so -90 is
// straight up). Rays start on the base arc at radius
// R0 and end on the rim arc: at the centre angle the
// rim reaches y = 300, so the fan mass occupies the
// lower two-thirds of the frame.
var CX = 640, CY = 1120;
var A0 = -160 * DEG, A1 = -20 * DEG;
var R0 = 300, RIM = 820, RIM_SHORT = 774;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-
// looking value in the piece is baked from this at
// load and never changes between frames or renders.
var seed = 378;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- ray bundles ---------------------------------------
// Exactly 36 bundles asserted. Each bundle is three
// flat lines: a main ray with a deep-gold shadow line
// on each flank. Even bundles run to the full rim,
// odd bundles stop short, so the rim scallops. One
// contiguous band of four bundles (indices 26-29) is
// oxblood, asserted to be exactly four and in one run.
var BUNDLES = [];
(function () {
  var i, a, main, flank;
  for (i = 0; i < 36; i++) {
    a = A0 + (i + 0.5) * (A1 - A0) / 36 + (rnd() * 0.6 - 0.3) * DEG;
    BUNDLES.push({
      a: a,
      rim: (i % 2 === 0 ? RIM : RIM_SHORT) + (rnd() * 20 - 10),
      phase: i * 0.22,
      ox: i >= 26 && i <= 29
    });
  }
  if (BUNDLES.length !== 36) throw new Error('Marine Building Fan needs exactly 36 ray bundles');
  var oxCount = 0, firstOx = -1, lastOx = -1;
  for (i = 0; i < BUNDLES.length; i++) {
    if (BUNDLES[i].ox) { oxCount++; if (firstOx < 0) firstOx = i; lastOx = i; }
  }
  if (oxCount !== 4 || lastOx - firstOx !== 3) throw new Error('exactly one oxblood band of 4 bundles required');
})();

// ---- icons ---------------------------------------------
// The celestial grammar, exactly four motifs: crescent
// moon, star, all-seeing eye, crystal. Fixed authored
// count of 96, scattered by the seeded table inside
// the wedge; scale grows with radius, so icons shrink
// toward the arc and open up toward the rim. Colours
// alternate cream and star-gold from the same table.
var ICON_TYPES = ['moon', 'star', 'eye', 'crystal'];
var ICON_R = { moon: 19, star: 17, eye: 18, crystal: 17 };
var ICONS = [];
(function () {
  var i, a, r, t;
  for (i = 0; i < 96; i++) {
    a = (A0 + 4 * DEG) + rnd() * ((A1 - A0) - 8 * DEG);
    r = (R0 + 64) + rnd() * ((RIM - 36) - (R0 + 64));
    t = ICON_TYPES[Math.floor(rnd() * 4)];
    ICONS.push({
      x: CX + Math.cos(a) * r,
      y: CY + Math.sin(a) * r,
      a: a,
      r: r,
      type: t,
      s: 0.5 + 0.75 * ((r - R0) / (RIM - R0)),
      rot: (rnd() * 0.6 - 0.3),
      gold: rnd() < 0.5
    });
  }
  if (ICONS.length !== 96) throw new Error('Marine Building Fan needs exactly 96 icons');
})();

function drawMoon(R) {
  // Crescent by exact two-circle geometry: the outer
  // arc runs from bottom through the left to the top;
  // the inner circle is centred at (0.42R, 0) with
  // radius sqrt(R^2 + (0.42R)^2), so its arc passes
  // exactly through the same top and bottom points
  // and cuts back through the disc. Opens right.
  var d = 0.42 * R, rho = Math.sqrt(R * R + d * d);
  var ia = Math.atan2(R, -d); // half-angle of the inner arc endpoints
  ctx.beginPath();
  ctx.arc(0, 0, R, Math.PI * 0.5, Math.PI * 1.5, false);
  ctx.arc(d, 0, rho, -ia, ia, true);
  ctx.closePath();
  ctx.fill();
}
function drawStar(R) {
  var i, a, rr;
  ctx.beginPath();
  for (i = 0; i < 10; i++) {
    a = -Math.PI / 2 + i * Math.PI / 5;
    rr = i % 2 === 0 ? R : R * 0.45;
    if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
}
function drawEye(R) {
  // Almond filled cream, iris in the ground colour
  // with a gold ring, pupil a cream point: the all-
  // seeing eye reads at any size in the fan.
  ctx.beginPath();
  ctx.moveTo(-R, 0);
  ctx.quadraticCurveTo(0, -R * 1.05, R, 0);
  ctx.quadraticCurveTo(0, R * 1.05, -R, 0);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = GROUND;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.44, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.44, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.17, 0, Math.PI * 2); ctx.fill();
}
function drawCrystal(R) {
  // Faceted gem: crown trapezoid over a point, facet
  // lines cut in the ground colour.
  ctx.beginPath();
  ctx.moveTo(-0.6 * R, -0.3 * R);
  ctx.lineTo(-0.25 * R, -0.78 * R);
  ctx.lineTo(0.25 * R, -0.78 * R);
  ctx.lineTo(0.6 * R, -0.3 * R);
  ctx.lineTo(0, 0.82 * R);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-0.6 * R, -0.3 * R); ctx.lineTo(0.6 * R, -0.3 * R);
  ctx.moveTo(-0.25 * R, -0.78 * R); ctx.lineTo(0, 0.82 * R);
  ctx.moveTo(0.25 * R, -0.78 * R); ctx.lineTo(0, 0.82 * R);
  ctx.stroke();
}
function drawIcon(ic) {
  ctx.save();
  ctx.translate(ic.x, ic.y);
  ctx.rotate(ic.rot);
  ctx.fillStyle = ic.gold ? STAR : CREAM;
  var R = ICON_R[ic.type] * ic.s;
  if (ic.type === 'moon') drawMoon(R);
  else if (ic.type === 'star') drawStar(R);
  else if (ic.type === 'eye') drawEye(R);
  else drawCrystal(R);
  ctx.restore();
}

// ---- motion state --------------------------------------
// Constant first-frame phase: T = 30s into the 60s
// loop. The shimmer sits at phase 0.5 there, band
// centred on -90 degrees at full envelope: mid-sweep
// over the middle of the fan. The breath sits at
// phase 2.5 cycles, sine zero: ray widths at their
// base, mid-breath. Frame one is drawn synchronously
// at this constant; the rAF loop advances T from the
// same anchor in fixed ticks. Frame one never reads
// a wall clock.
var T = 30;
var lastNow = -1, acc = 0;

function breathSin(phase) {
  return Math.sin(Math.PI * 2 * ((T % BREATH) / BREATH) + phase);
}
function rayLine(a, rEnd, w, style) {
  ctx.strokeStyle = style;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(CX + Math.cos(a) * R0, CY + Math.sin(a) * R0);
  ctx.lineTo(CX + Math.cos(a) * rEnd, CY + Math.sin(a) * rEnd);
  ctx.stroke();
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2000, -2000, DW + 4000, DH + 4000);
  ctx.lineCap = 'round';
  var i, b, bs, mainW, flankW, flankOff = 0.85 * DEG;
  // Base band: a deep-gold annular sector under the
  // ray roots, its top arc struck in gold.
  ctx.beginPath();
  ctx.arc(CX, CY, R0, A0, A1);
  ctx.arc(CX, CY, R0 - 30, A1, A0, true);
  ctx.closePath();
  ctx.fillStyle = DEEP;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(CX, CY, R0, A0, A1);
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  // Rays: shadow flanks first, then mains, so each
  // bundle reads as one grouped ray.
  for (i = 0; i < BUNDLES.length; i++) {
    b = BUNDLES[i];
    bs = breathSin(b.phase);
    mainW = 3.1 + 0.95 * bs;
    flankW = 1.3 + 0.45 * bs;
    rayLine(b.a - flankOff, b.rim, flankW, b.ox ? OXBLOOD : DEEP);
    rayLine(b.a + flankOff, b.rim, flankW, b.ox ? OXBLOOD : DEEP);
    rayLine(b.a, b.rim, mainW, b.ox ? OXBLOOD : GOLD);
  }
  // Rim arcs at both bundle lengths: the scalloped
  // double rim that finishes the fan.
  ctx.beginPath(); ctx.arc(CX, CY, RIM + 2, A0, A1);
  ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, RIM_SHORT - 2, A0, A1);
  ctx.strokeStyle = DEEP; ctx.lineWidth = 2; ctx.stroke();
  // Shimmer: a band of translucent cream strokes over
  // the rays in its angular span, sweeping the wedge
  // once per 20s, envelope fading at both ends. At
  // T = 30 the band is centred, mid-sweep.
  var p = (T % SHIMMER) / SHIMMER;
  var bandC = (A0 - 4 * DEG) + p * ((A1 + 4 * DEG) - (A0 - 4 * DEG));
  var env = Math.sin(Math.PI * p);
  if (env > 0.01) {
    for (i = 0; i < BUNDLES.length; i++) {
      b = BUNDLES[i];
      var da = Math.abs(b.a - bandC);
      if (da >= 8 * DEG) continue;
      ctx.globalAlpha = (1 - da / (8 * DEG)) * env * 0.55;
      rayLine(b.a, b.rim, (3.1 + 0.95 * breathSin(b.phase)) + 1.6, CREAM);
    }
    ctx.globalAlpha = 1;
  }
  // Icons, clipped inside the fan wedge.
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(CX + Math.cos(A0) * (R0 - 6), CY + Math.sin(A0) * (R0 - 6));
  ctx.arc(CX, CY, RIM + 30, A0, A1);
  ctx.arc(CX, CY, R0 - 6, A1, A0, true);
  ctx.closePath();
  ctx.clip();
  for (i = 0; i < ICONS.length; i++) drawIcon(ICONS[i]);
  ctx.restore();
}

// ---- sizing: centred fit, page ground is the near-black --
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function step() {}

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
