<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№863 Inside the Crowd</title>
<style>
  html, body { margin: 0; padding: 0; background: #060404; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №863 Inside the Crowd, ZW1 / PP1263, study #263 zach-wolfe.
  // A live stage seen only through the audience. Dark silhouetted
  // heads fill the lower half of the frame, out of focus near the
  // lens; beyond them a performer glows red in stage light, PA
  // stacks to one side, haze drifting through the beams. Watch-only.
  var GROUND = '#060404'; // page ground, near-black

  // Fixed-phase first frame: FIRST_T = 5 s into a 24 s cycle.
  // The beat pulse is 2 s, the head sway 12 s, the haze drift
  // 24 s; every period divides 24, so the frame at FIRST_T + 24
  // equals the frame at FIRST_T.
  var FIRST_T = 5;
  var CYCLE = 24;
  var SEED = 863;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipsePath(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }

  // Palette: near-black heads, saturated red stage wash,
  // amber edge-light on smoke.
  var INK = [8, 4, 4];        // foreground heads, near-black
  var INK_SOFT = [22, 10, 10]; // out-of-focus halo around near heads
  var RED = [214, 32, 26];     // stage wash
  var RED_DEEP = [120, 14, 12];
  var RED_HOT = [255, 84, 60]; // performer glow core
  var AMBER = [232, 158, 72];   // edge-light on smoke
  var CREAM = [238, 208, 182];  // caption and hint

  // ---- Fixed head tables: three depth rows ------------------------
  // Back row: small heads, mid row: medium, front row: large and
  // out of focus near the lens, cropped at the bottom edge.
  // x, y, r are fractions of W / H; ph is the sway phase.
  var headRng = mulberry32(SEED * 19 + 5);
  var HEADS = [];
  var hi, hx;
  // Back row, 9 heads.
  for (hi = 0; hi < 9; hi++) {
    hx = 0.03 + hi * 0.115 + (headRng() - 0.5) * 0.05;
    HEADS.push({ x: hx, y: 0.585 + headRng() * 0.05, r: 0.048 + headRng() * 0.016,
      ph: headRng() * Math.PI * 2, row: 0, shade: 0.85 + headRng() * 0.15 });
  }
  // Mid row, 7 heads.
  for (hi = 0; hi < 7; hi++) {
    hx = 0.06 + hi * 0.145 + (headRng() - 0.5) * 0.05;
    HEADS.push({ x: hx, y: 0.715 + headRng() * 0.05, r: 0.072 + headRng() * 0.018,
      ph: headRng() * Math.PI * 2, row: 1, shade: 0.9 + headRng() * 0.1 });
  }
  // Front row, 5 heads, large and cropped at the bottom.
  for (hi = 0; hi < 5; hi++) {
    hx = 0.02 + hi * 0.24 + (headRng() - 0.5) * 0.06;
    HEADS.push({ x: hx, y: 0.90 + headRng() * 0.06, r: 0.115 + headRng() * 0.025,
      ph: headRng() * Math.PI * 2, row: 2, shade: 0.95 + headRng() * 0.05 });
  }

  // ---- Fixed haze table: 12 drifting smoke blobs ------------------
  var hazeRng = mulberry32(SEED * 29 + 11);
  var HAZE = [];
  var zi;
  for (zi = 0; zi < 12; zi++) {
    HAZE.push({
      y: 0.14 + hazeRng() * 0.42,
      rx: 0.06 + hazeRng() * 0.07,
      ry: 0.018 + hazeRng() * 0.016,
      rot: (hazeRng() - 0.5) * 0.4,
      ph: hazeRng(), // drift phase, 0..1 across the cycle
      warm: hazeRng() > 0.45, // amber edge-light vs red wash
      a: 0.03 + hazeRng() * 0.05
    });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    // Performer position: left of centre, between the silhouettes.
    L.perfX = 0.40;
    L.perfY = 0.40;
    L.perfH = 0.17;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Implied beat: 2 s period, quick attack, slow decay. 0..1.
  function beat(t) {
    var u = (((t - FIRST_T) / 2) % 1 + 1) % 1;
    return Math.pow(1 - u, 1.6);
  }
  // Head sway: 12 s period, almost imperceptible.
  function sway(t, ph) {
    return Math.sin(2 * Math.PI * (t - FIRST_T) / 12 + ph);
  }

  // ---- Far plane: red stage wash, beams, PA stacks, performer ----
  function drawStage(t) {
    var b = beat(t);
    var glow = 0.72 + 0.28 * b; // the red light pulses with the beat
    // Red wash, brightest around the performer, falling to black.
    var wash = ctx.createRadialGradient(W * L.perfX, H * 0.34, 0,
      W * L.perfX, H * 0.34, W * 0.75);
    wash.addColorStop(0, rgba(RED, a4(0.85 * glow)));
    wash.addColorStop(0.45, rgba(RED_DEEP, a4(0.55 * glow)));
    wash.addColorStop(1, rgba(INK, 0));
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, H * 0.62);
    // A low red floor wash under the stage.
    var floor = ctx.createLinearGradient(0, H * 0.42, 0, H * 0.62);
    floor.addColorStop(0, rgba(RED_DEEP, a4(0.35 * glow)));
    floor.addColorStop(1, rgba(RED_DEEP, 0));
    ctx.fillStyle = floor;
    ctx.fillRect(0, H * 0.42, W, H * 0.20);

    // Light beams: two wedges from the top corners converging on
    // the performer, amber at the core, red at the edge.
    var i;
    var beams = [
      { x0: 0.10, x1: 0.16, tx: L.perfX - 0.05 },
      { x0: 0.86, x1: 0.80, tx: L.perfX + 0.05 }
    ];
    for (i = 0; i < beams.length; i++) {
      var bm = beams[i];
      ctx.beginPath();
      ctx.moveTo(W * bm.x0, 0);
      ctx.lineTo(W * bm.x1, 0);
      ctx.lineTo(W * bm.tx + W * 0.03, H * L.perfY + H * 0.05);
      ctx.lineTo(W * bm.tx - W * 0.03, H * L.perfY + H * 0.05);
      ctx.closePath();
      var beamGrad = ctx.createLinearGradient(0, 0, 0, H * L.perfY);
      beamGrad.addColorStop(0, rgba(AMBER, a4(0.20 * glow)));
      beamGrad.addColorStop(1, rgba(RED, a4(0.05 * glow)));
      ctx.fillStyle = beamGrad;
      ctx.fill();
    }

    // PA stacks to the right: two dark cabinets, speaker rings
    // catching a thin amber edge from the stage light.
    var px = W * 0.815, pw = W * 0.105, ph = H * 0.155;
    var py = H * 0.115;
    var si;
    for (si = 0; si < 2; si++) {
      var cy = py + si * (ph + H * 0.012);
      ctx.fillStyle = rgb([12, 6, 6]);
      ctx.fillRect(px, cy, pw, ph);
      // Speaker rings, sized to the cabinet so they never
      // overflow it on a narrow portrait phone.
      var ringR = Math.min(pw * 0.36, ph * 0.20);
      var ringR2 = Math.min(pw * 0.36, ph * 0.26);
      ctx.strokeStyle = rgba(AMBER, a4(0.35 * glow));
      ctx.lineWidth = Math.max(1, W * 0.002);
      circle(px + pw * 0.5, cy + ph * 0.30, ringR);
      ctx.stroke();
      circle(px + pw * 0.5, cy + ph * 0.70, ringR2);
      ctx.stroke();
      // Amber edge-light on the lit side.
      ctx.strokeStyle = rgba(AMBER, a4(0.55 * glow));
      ctx.lineWidth = Math.max(1, W * 0.0025);
      ctx.beginPath();
      ctx.moveTo(px, cy);
      ctx.lineTo(px, cy + ph);
      ctx.stroke();
    }

    // The performer: a small glowing glyph, head and torso in red
    // light, rimmed amber on the lit side. A rumor between heads.
    var pxx = W * L.perfX, pyy = H * L.perfY, ph2 = H * L.perfH;
    var halo = ctx.createRadialGradient(pxx, pyy - ph2 * 0.45, 0,
      pxx, pyy - ph2 * 0.45, ph2 * 0.9);
    halo.addColorStop(0, rgba(RED_HOT, a4(0.55 * glow)));
    halo.addColorStop(0.5, rgba(RED, a4(0.22 * glow)));
    halo.addColorStop(1, rgba(RED, 0));
    ctx.fillStyle = halo;
    ctx.fillRect(pxx - ph2, pyy - ph2 * 1.4, ph2 * 2, ph2 * 2.4);
    ctx.save();
    ctx.strokeStyle = rgb(RED_HOT);
    ctx.fillStyle = rgb(RED_HOT);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Head.
    circle(pxx, pyy - ph2 * 0.88, ph2 * 0.13);
    ctx.fill();
    // Torso, leaning into the mic.
    ctx.lineWidth = Math.max(2, ph2 * 0.11);
    ctx.beginPath();
    ctx.moveTo(pxx, pyy - ph2 * 0.74);
    ctx.lineTo(pxx + ph2 * 0.06, pyy - ph2 * 0.10);
    ctx.stroke();
    // One raised arm toward the mic stand.
    ctx.lineWidth = Math.max(1.5, ph2 * 0.06);
    ctx.beginPath();
    ctx.moveTo(pxx + ph2 * 0.03, pyy - ph2 * 0.62);
    ctx.lineTo(pxx + ph2 * 0.30, pyy - ph2 * 0.78);
    ctx.stroke();
    // Mic stand.
    ctx.strokeStyle = rgba(RED_HOT, a4(0.7));
    ctx.lineWidth = Math.max(1, ph2 * 0.03);
    ctx.beginPath();
    ctx.moveTo(pxx + ph2 * 0.32, pyy - ph2 * 0.80);
    ctx.lineTo(pxx + ph2 * 0.32, pyy + ph2 * 0.05);
    ctx.stroke();
    // Amber rim on the lit side of the head.
    ctx.strokeStyle = rgba(AMBER, a4(0.8 * glow));
    ctx.lineWidth = Math.max(1, ph2 * 0.025);
    ctx.beginPath();
    ctx.moveTo(pxx + ph2 * 0.06, pyy - ph2 * 0.97);
    ctx.arc(pxx, pyy - ph2 * 0.88, ph2 * 0.13, -Math.PI * 0.4, Math.PI * 0.3);
    ctx.stroke();
    ctx.restore();
  }

  // ---- Mid plane: haze drifting through the beams -----------------
  function drawHaze(t) {
    var b = beat(t);
    var i, z;
    for (i = 0; i < HAZE.length; i++) {
      z = HAZE[i];
      // Drift across the frame once per cycle, wrapping at the
      // cycle end so FIRST_T + 24 reproduces FIRST_T exactly.
      var u = (((t - FIRST_T) / CYCLE + z.ph) % 1 + 1) % 1;
      var hx = (0.02 + 0.96 * u) * W;
      var hy = H * z.y + Math.sin(2 * Math.PI * (t - FIRST_T) / 12 + z.ph * 6.28) * H * 0.006;
      var col = z.warm ? AMBER : RED;
      var alpha = z.a * (0.75 + 0.25 * b);
      // Three overlapping lobes, each faint, so the wisp reads as
      // smoke rather than a solid disc.
      ctx.fillStyle = rgba(col, a4(alpha));
      ellipsePath(hx, hy, z.rx * W, z.ry * H, z.rot);
      ctx.fill();
      ctx.fillStyle = rgba(col, a4(alpha * 0.7));
      ellipsePath(hx + z.rx * W * 0.45, hy + z.ry * H * 0.7, z.rx * W * 0.55, z.ry * H * 0.65, z.rot);
      ctx.fill();
      ctx.fillStyle = rgba(col, a4(alpha * 0.5));
      ellipsePath(hx - z.rx * W * 0.4, hy - z.ry * H * 0.6, z.rx * W * 0.5, z.ry * H * 0.6, z.rot);
      ctx.fill();
    }
  }

  // ---- Near plane: silhouetted heads, swaying almost imperceptibly
  function drawHeads(t) {
    var i, h, hx, hy, hr, sw;
    for (i = 0; i < HEADS.length; i++) {
      h = HEADS[i];
      // Sway amplitude grows toward the lens: back row barely
      // moves, front row drifts a few pixels. Heads stay anchored
      // in their rows; the sway never clears the view.
      sw = sway(t, h.ph) * W * (0.0015 + h.row * 0.0015);
      hx = h.x * W + sw;
      hy = h.y * H;
      hr = h.r * W;
      // Out-of-focus halo for the front row: a larger, fainter
      // copy behind the head, softening its edge.
      if (h.row === 2) {
        ctx.fillStyle = rgba(INK_SOFT, a4(0.5));
        circle(hx, hy, hr * 1.12);
        ctx.fill();
      }
      var shade = [Math.round(INK[0] * h.shade), Math.round(INK[1] * h.shade), Math.round(INK[2] * h.shade)];
      ctx.fillStyle = rgb(shade);
      // Shoulders first, then the head on top. Back-row shoulders
      // stay narrow so the red wash shows between the distant
      // heads; the front rows close up into a solid crowd.
      var shoulderW = hr * (1.20 + h.row * 0.17);
      ellipsePath(hx, hy + hr * 1.55, shoulderW, hr * 0.85, 0);
      ctx.fill();
      circle(hx, hy, hr);
      ctx.fill();
      // Amber edge-light on the side facing the stage, stronger
      // on the front row where the smoke catches it. The arc is
      // started exactly at its own first point, so no chord
      // cuts across the head.
      var rimA = 0.16 + h.row * 0.10;
      var a0 = -Math.PI * 0.38, a1 = Math.PI * 0.30;
      ctx.strokeStyle = rgba(AMBER, a4(rimA));
      ctx.lineWidth = Math.max(1, hr * 0.045);
      ctx.beginPath();
      ctx.moveTo(hx + hr * Math.cos(a0), hy + hr * Math.sin(a0));
      ctx.arc(hx, hy, hr, a0, a1);
      ctx.stroke();
    }
  }

  // ---- A thin wisp of haze in front of the heads, for depth -------
  function drawForeHaze(t) {
    var u = (((t - FIRST_T) / CYCLE + 0.6) % 1 + 1) % 1;
    var hx = (0.05 + 0.9 * u) * W;
    ctx.fillStyle = rgba(AMBER, a4(0.05));
    ellipsePath(hx, H * 0.66, W * 0.16, H * 0.02, 0);
    ctx.fill();
  }

  // ---- Caption and hint, in the template's place ------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CREAM, a4(0.9));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№863 · Inside the Crowd', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CREAM, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 23', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CREAM, a4(0.85));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the haze drift.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawStage(t);
    drawHaze(t);
    drawHeads(t);
    drawForeHaze(t);
    // Vignette: the room darkens toward the edges.
    var vg = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35,
      W / 2, H * 0.45, Math.max(W, H) * 0.75);
    vg.addColorStop(0, rgba([6, 4, 4], 0));
    vg.addColorStop(1, rgba([6, 4, 4], a4(0.45)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    drawText();
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece863 exposes the beat, the sway and the cycle.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece863 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      beat: function (t) { return beat(t); },
      sway: function (t, ph) { return sway(t, ph); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 24 s cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
