<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№650 Oil Slick Gull</title>
<style>
  html, body { margin: 0; padding: 0; background: #000000; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1991 Oil Slick Gull, MC8 / PP1238, study #259 mateo-villanueva-brandt.
  // A figure coated in black oil emerging from total darkness; there is
  // no body and no oil, only one substance with two behaviours. Specular
  // highlights draw a shoulder, a turned head, a beak-like profile, then
  // the darkness takes them back. Palette: absolute black, oil-sheen
  // violet, one cold white highlight. The figure emerges from the
  // lower-left dark; negative space does the composing. The sheen creeps
  // as the figure barely moves; highlights appear and vanish.
  // Watch-only: this is the intimate end of M1 and it must not be
  // disturbed.
  var GROUND = '#000000'; // page ground, absolute black

  // Fixed-phase first frame: FIRST_T = 23 s. The cycle is 180 s: a slow
  // light drift over three minutes, with each highlight breathing on
  // its own period so highlights appear and vanish at different times.
  // Phases were chosen so that at t = 23 the shoulder highlight is
  // near full strength (0.85), the head profile is clear (0.72), the
  // beak glint is present (0.65), the back sheen is half on (0.50) and
  // the belly sheen is faint (0.35): the first frame shows the figure
  // caught by the light, legible, never pure black.
  var FIRST_T = 23;
  var CYCLE = 180;
  var SEED = 1991;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }
  function fbm(x) {
    return vnoise(x) * 0.55 + vnoise(x * 2.13 + 7.7) * 0.30 + vnoise(x * 4.31 + 3.1) * 0.15;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function mix(a, b, f) {
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: absolute black, oil-sheen violet, one cold white highlight.
  var BODY = [16, 12, 28];        // the figure, dark but legible against black
  var BODY_DEEP = [22, 16, 38];    // faint violet lift inside the body
  var WASH = [18, 14, 32];         // dark violet wash where the mass meets the dark
  var SHEEN_DEEP = [74, 52, 140];
  var SHEEN = [122, 88, 190];
  var SHEEN_PALE = [168, 150, 220];
  var COLD = [235, 242, 250];     // the one cold white highlight
  var CAPTION = [198, 203, 220];

  // Highlight breathing: period and phase per highlight. Visibility is
  // 0.5 + 0.5 * sin(2*pi*t/P + phase); phases set so t = 23 shows the
  // figure (shoulder 0.85, head 0.72, beak 0.65, back 0.50, belly 0.35).
  var HIGHLIGHTS = [
    { key: 'shoulder', period: 64, phase: -1.4826 },
    { key: 'head', period: 83, phase: -1.2855 },
    { key: 'beak', period: 47, phase: -2.7701 },
    { key: 'back', period: 110, phase: -1.3138 },
    { key: 'belly', period: 137, phase: -1.3595 }
  ];
  function visOf(hl, t) {
    return 0.5 + 0.5 * Math.sin(2 * Math.PI * t / hl.period + hl.phase);
  }

  // Creeping sheen dots: fixed seeded positions inside the body mass,
  // drifting a few pixels on slow noise, alpha pulsing gently.
  var dotRng = mulberry32(SEED * 13 + 5);
  var DOTS = [];
  (function () {
    var i;
    for (i = 0; i < 26; i++) {
      DOTS.push({
        x: 0.04 + dotRng() * 0.44,          // inside the body, lower-left
        y: 0.42 + dotRng() * 0.52,
        r: 0.0011 + dotRng() * 0.0016,      // fraction of W
        period: 40 + dotRng() * 70,
        phase: dotRng() * Math.PI * 2,
        maxA: 0.06 + dotRng() * 0.16
      });
    }
  })();

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle -----------------------------------------------------
  // light 0.56..1.00, a slow drift over CYCLE: the light finds the
  // figure and loses it again over three minutes. At FIRST_T = 23 the
  // light is at full strength, so the first frame is the found moment.
  function cycleState(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    var light = 0.78 + 0.22 * Math.sin(2 * Math.PI * p / CYCLE + 0.8);
    var v = {};
    var i;
    for (i = 0; i < HIGHLIGHTS.length; i++) {
      v[HIGHLIGHTS[i].key] = visOf(HIGHLIGHTS[i], t);
    }
    return { light: light, vis: v };
  }

  // The figure barely moves: a drift of at most 0.15% of the stage on
  // slow sines, so slow the silhouette is effectively still.
  function figureShift(t) {
    return {
      dx: 0.0015 * W * Math.sin(2 * Math.PI * t / 26 + 1.2),
      dy: 0.0010 * H * Math.sin(2 * Math.PI * t / 31 + 0.4)
    };
  }

  // The sheen creeps: highlight strokes slide a little along the body
  // on a slow sine, about 1.2% of the stage over 90 s.
  function creep(t) {
    return 0.012 * Math.sin(2 * Math.PI * t / 90 + 1.0);
  }

  // ---- Figure ----------------------------------------------------
  // One hunched mass rising from the lower-left corner: shoulder hump,
  // neck dip, turned head, beak pointing right, chest and belly falling
  // back to the bottom edge. Points are stage fractions.
  function bodyPath() {
    ctx.beginPath();
    ctx.moveTo(-0.02 * W, 1.02 * H);
    ctx.lineTo(-0.02 * W, 0.80 * H);
    ctx.quadraticCurveTo(0.00 * W, 0.62 * H, 0.07 * W, 0.55 * H);
    ctx.quadraticCurveTo(0.14 * W, 0.465 * H, 0.24 * W, 0.44 * H);   // shoulder hump
    ctx.quadraticCurveTo(0.31 * W, 0.425 * H, 0.36 * W, 0.465 * H);  // neck dip
    ctx.quadraticCurveTo(0.395 * W, 0.42 * H, 0.42 * W, 0.385 * H);  // back of head
    ctx.quadraticCurveTo(0.45 * W, 0.35 * H, 0.485 * W, 0.352 * H);  // crown
    ctx.quadraticCurveTo(0.52 * W, 0.355 * H, 0.545 * W, 0.395 * H); // forehead
    ctx.quadraticCurveTo(0.585 * W, 0.425 * H, 0.625 * W, 0.455 * H);// beak, upper edge
    ctx.quadraticCurveTo(0.65 * W, 0.472 * H, 0.66 * W, 0.485 * H);  // beak tip
    ctx.quadraticCurveTo(0.635 * W, 0.50 * H, 0.60 * W, 0.505 * H);  // beak, lower edge
    ctx.quadraticCurveTo(0.565 * W, 0.51 * H, 0.545 * W, 0.53 * H);  // throat
    ctx.quadraticCurveTo(0.52 * W, 0.60 * H, 0.505 * W, 0.68 * H);   // chest
    ctx.quadraticCurveTo(0.49 * W, 0.78 * H, 0.44 * W, 0.86 * H);    // belly
    ctx.quadraticCurveTo(0.40 * W, 0.94 * H, 0.36 * W, 1.02 * H);
    ctx.lineTo(-0.02 * W, 1.02 * H);
    ctx.closePath();
  }

  function drawFigure(t, cs) {
    var sh = figureShift(t);

    // Dark violet wash where the mass meets the dark, bottom-left.
    var wx = 0.05 * W, wy = 0.95 * H, wr = 0.50 * W;
    var wg = ctx.createRadialGradient(wx, wy, 0, wx, wy, wr);
    wg.addColorStop(0, rgba(WASH, a4(0.70)));
    wg.addColorStop(1, rgba(WASH, 0));
    ctx.fillStyle = wg;
    ctx.fillRect(wx - wr, wy - wr, wr * 2, wr * 2);

    ctx.save();
    ctx.translate(sh.dx, sh.dy);

    // Body: one substance, barely lighter than the ground.
    ctx.fillStyle = rgb(BODY);
    bodyPath();
    ctx.fill();

    // A faint violet lift inside the body near the shoulder, so the
    // mass reads as a volume rather than a hole.
    var gx = 0.26 * W, gy = 0.58 * H, gr = 0.30 * W;
    var gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    gg.addColorStop(0, rgba(BODY_DEEP, a4(0.95)));
    gg.addColorStop(1, rgba(BODY_DEEP, 0));
    ctx.fillStyle = gg;
    bodyPath();
    ctx.fill();

    // Faint constant rim: the outline is always just there, even when
    // every highlight has faded, so the figure never fully vanishes.
    ctx.strokeStyle = rgba(SHEEN_DEEP, a4(0.34));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.lineJoin = 'round';
    bodyPath();
    ctx.stroke();

    ctx.restore();
  }

  // Stroke a polyline of stage-fraction points, smoothed through
  // midpoints, with an x creep offset applied.
  function strokePoints(pts, cr, width, color, alpha) {
    if (alpha <= 0.002) { return; }
    var i, x, y;
    ctx.strokeStyle = rgba(color, a4(alpha));
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo((pts[0][0] + cr) * W, pts[0][1] * H);
    for (i = 1; i < pts.length - 1; i++) {
      x = ((pts[i][0] + pts[i + 1][0]) / 2 + cr) * W;
      y = ((pts[i][1] + pts[i + 1][1]) / 2) * H;
      ctx.quadraticCurveTo((pts[i][0] + cr) * W, pts[i][1] * H, x, y);
    }
    var last = pts[pts.length - 1];
    ctx.lineTo((last[0] + cr) * W, last[1] * H);
    ctx.stroke();
  }

  // ---- Specular highlights ---------------------------------------
  // Highlights only where the mask and the light agree: each stroke's
  // alpha is its own breathing visibility times the slow light drift.
  function drawHighlights(t, cs) {
    var cr = creep(t);
    var sh = figureShift(t);
    var light = cs.light;
    var v = cs.vis;
    ctx.save();
    ctx.translate(sh.dx, sh.dy);

    // Shoulder arc: the one cold white highlight, thin and bright.
    strokePoints(
      [[0.07, 0.66], [0.12, 0.55], [0.19, 0.47], [0.26, 0.435], [0.32, 0.455]],
      cr, Math.max(1.2, W * 0.0022), COLD, 0.80 * v.shoulder * light);

    // Head profile: crown and forehead in pale violet sheen.
    strokePoints(
      [[0.40, 0.415], [0.44, 0.375], [0.485, 0.355], [0.525, 0.385], [0.55, 0.42]],
      cr, Math.max(1.2, W * 0.002), SHEEN_PALE, 0.70 * v.head * light);

    // Beak, upper edge: cold white, the beak-like profile.
    strokePoints(
      [[0.55, 0.42], [0.585, 0.435], [0.625, 0.455], [0.655, 0.48]],
      cr, Math.max(1.2, W * 0.002), COLD, 0.85 * v.beak * light);

    // Beak, lower edge: violet sheen, dimmer, closing the profile.
    strokePoints(
      [[0.655, 0.48], [0.62, 0.50], [0.585, 0.505], [0.555, 0.50]],
      cr, Math.max(1, W * 0.0016), SHEEN, 0.45 * v.beak * light);

    // Beak tip glint: a small cold dot where the beak ends.
    var ga = 0.9 * v.beak * light;
    if (ga > 0.01) {
      var gx = (0.655 + cr) * W, gy = 0.48 * H;
      var gr = Math.max(1.5, W * 0.004);
      ctx.fillStyle = rgba(COLD, a4(ga));
      ctx.beginPath();
      ctx.moveTo(gx + gr, gy);
      ctx.arc(gx, gy, gr, 0, Math.PI * 2);
      ctx.fill();
    }

    // Back sheen band: broad soft violet inside the body, along the back.
    strokePoints(
      [[0.10, 0.70], [0.16, 0.60], [0.24, 0.52], [0.32, 0.50]],
      cr * 1.6, Math.max(3, W * 0.018), SHEEN, 0.16 * v.back * light);
    strokePoints(
      [[0.11, 0.74], [0.17, 0.64], [0.25, 0.56], [0.33, 0.54]],
      cr * 1.6, Math.max(2, W * 0.010), SHEEN_DEEP, 0.20 * v.back * light);

    // Belly sheen: a faint violet arc low on the body.
    strokePoints(
      [[0.30, 0.86], [0.36, 0.78], [0.42, 0.72]],
      cr * 1.3, Math.max(2, W * 0.009), SHEEN, 0.18 * v.belly * light);

    ctx.restore();
  }

  // ---- Creeping sheen dots ---------------------------------------
  function drawDots(t, cs) {
    var sh = figureShift(t);
    var i, d, mx, my, tw;
    for (i = 0; i < DOTS.length; i++) {
      d = DOTS[i];
      tw = 0.5 + 0.5 * Math.sin(2 * Math.PI * t / d.period + d.phase);
      var a = d.maxA * tw * cs.light;
      if (a <= 0.01) { continue; }
      mx = (d.x + (fbm(i * 1.7 + t * 0.02) - 0.5) * 0.03) * W + sh.dx;
      my = (d.y + (fbm(i * 3.1 + t * 0.015) - 0.5) * 0.02) * H + sh.dy;
      var mr = Math.max(0.7, d.r * W);
      ctx.fillStyle = rgba(SHEEN_PALE, a4(a));
      ctx.beginPath();
      ctx.moveTo(mx + mr, my);
      ctx.arc(mx, my, mr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Captions --------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var cs = cycleState(t);

    // Ground is absolute black; the stage is the whole image.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawFigure(t, cs);
    drawHighlights(t, cs);
    drawDots(t, cs);

    // Title plate, top left, and the hint, bottom center. Cold grey
    // stays readable over the black without pretending to be light.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.62));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№650 · Oil Slick Gull', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CAPTION, a4(0.45));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2007 · 06 · 25', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CAPTION, a4(0.68));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the sheen find the figure, then lose it.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer listeners. The piece is watched,
  // never driven.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1991 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1991 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return cycleState(t); },
      light: function (t) { return cycleState(t).light; },
      vis: function (key, t) {
        var i;
        for (i = 0; i < HIGHLIGHTS.length; i++) {
          if (HIGHLIGHTS[i].key === key) { return visOf(HIGHLIGHTS[i], t); }
        }
        return null;
      },
      shift: function (t) { return figureShift(t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the sheen creeps and the highlights breathe over
  // 180 s while the figure barely moves. Guarded so node-canvas QA
  // (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
