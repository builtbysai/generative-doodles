<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Piedra de Cascada</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0B; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict). GROOVE is the aged channel shade: the stone tone
  // at reduced brightness, used for cuts that are no longer fresh.
  var GROUND = '#0A0A0B';
  var STONE = '#8A8A8C';
  var FRESH = '#C9C9CC';
  var WATER = '#7FB3C8';
  var POOL = '#0E2A33';
  var GROOVE = '#55555A';

  var BASE_SEED = 650001;
  var DT = 1 / 60;          // fixed simulation step, seconds
  var PRE_STEPS = 420;      // synchronous pre-simulation at load (7 s)
  var N_PARTICLES = 600;
  var FRESH_WINDOW = 6;     // seconds a cut stays bright before aging

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  var STONE_RGB = hexRgb(STONE), GROOVE_RGB = hexRgb(GROOVE), FRESH_RGB = hexRgb(FRESH);
  function mixRgb(a, b, t) {
    return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, isPhone = false;

  // ---- Layout and carve grid ----
  var slabX = 0, slabY = 0, slabW = 0, slabH = 0, slabR = 0;
  var srcX = 0, srcY = 0;               // water source, top-center
  var poolCx = 0, poolCy = 0, poolRx = 0, poolRy = 0;
  var mouthX = 0;                       // channel mouth on the slab top
  var ph1 = 0, ph2 = 0, ph3 = 0;        // slab edge noise phases (seeded)
  var chanW1 = 0, chanW2 = 0;           // initial channel wander phases (seeded)

  var cell = 6, gx0 = 0, gy0 = 0, cols = 0, rows = 0;
  var stone = null;    // Uint8Array: cell is inside the slab
  var depth = null;    // Float32Array: carve depth 0..1
  var cutT = null;     // Float32Array: sim time of last cut (for fresh aging)
  var colTop = null;   // Float32Array: top surface y per grid column
  var outline = null;  // slab silhouette polyline

  // ---- Simulation state ----
  var simTime = 0;
  var stepsRun = 0;
  var particles = [];
  var ripples = [];    // {x, y, t}
  var pRng = null;     // particle stream RNG (respawn jitter, ripple chance)

  function edgeNoise(x, y) {
    return Math.sin(x * 0.019 + ph1) * Math.sin(y * 0.023 + ph2) * 2.6 +
           Math.sin(x * 0.043 + ph3) * 1.2;
  }
  function sdRoundBox(px, py, cx, cy, hw, hh, r) {
    var qx = Math.abs(px - cx) - (hw - r);
    var qy = Math.abs(py - cy) - (hh - r);
    var ax = Math.max(qx, 0), ay = Math.max(qy, 0);
    return Math.sqrt(ax * ax + ay * ay) + Math.min(Math.max(qx, qy), 0) - r;
  }
  function insideSlab(x, y) {
    return sdRoundBox(x, y, slabX + slabW / 2, slabY + slabH / 2, slabW / 2, slabH / 2, slabR) + edgeNoise(x, y) < 0;
  }

  function cellIndex(cxI, cyI) { return cyI * cols + cxI; }

  function computeColTop() {
    colTop = new Float32Array(cols);
    for (var i = 0; i < cols; i++) {
      var top = Infinity;
      for (var j = 0; j < rows; j++) {
        if (stone[cellIndex(i, j)]) { top = gy0 + j * cell; break; }
      }
      colTop[i] = top;
    }
  }
  function colTopAt(x) {
    var i = Math.floor((x - gx0) / cell);
    if (i < 0 || i >= cols) return Infinity;
    return colTop[i];
  }

  // Stamp a circular cut into the grid. aged=true leaves the cut old
  // (used for the initial channel); fresh cuts record the sim time.
  function stamp(px, py, radiusPx, aged) {
    var i0 = Math.max(0, Math.floor((px - radiusPx - gx0) / cell));
    var i1 = Math.min(cols - 1, Math.floor((px + radiusPx - gx0) / cell));
    var j0 = Math.max(0, Math.floor((py - radiusPx - gy0) / cell));
    var j1 = Math.min(rows - 1, Math.floor((py + radiusPx - gy0) / cell));
    for (var j = j0; j <= j1; j++) {
      for (var i = i0; i <= i1; i++) {
        var idx = cellIndex(i, j);
        if (!stone[idx]) continue;
        var cxp = gx0 + (i + 0.5) * cell, cyp = gy0 + (j + 0.5) * cell;
        var d = Math.sqrt((cxp - px) * (cxp - px) + (cyp - py) * (cyp - py));
        if (d >= radiusPx) continue;
        var nd = (Math.cos((d / radiusPx) * Math.PI) + 1) / 2 * 0.98;
        if (nd > depth[idx]) {
          if (!aged && nd > depth[idx] + 0.02) cutT[idx] = simTime;
          depth[idx] = nd;
        }
      }
    }
  }
  function stampSegment(x0, y0, x1, y1, radiusPx, aged) {
    var len = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
    var n = Math.max(1, Math.ceil(len / (cell * 0.5)));
    for (var k = 0; k <= n; k++) {
      var f = k / n;
      stamp(lerp(x0, x1, f), lerp(y0, y1, f), radiusPx, aged);
    }
  }

  function buildLayout() {
    var rng = mulberry32(BASE_SEED);
    ph1 = rng() * 6.283; ph2 = rng() * 6.283; ph3 = rng() * 6.283;
    chanW1 = rng() * 6.283; chanW2 = rng() * 6.283;

    slabW = W * (isPhone ? 0.80 : 0.44);
    slabH = H * (isPhone ? 0.38 : 0.40);
    slabX = (W - slabW) / 2;
    slabY = H * 0.30;
    slabR = Math.min(slabW, slabH) * 0.10;

    srcX = W / 2;
    srcY = H * 0.045;
    mouthX = slabX + slabW / 2;

    poolCx = W / 2;
    poolCy = H * 0.885;
    poolRx = W * (isPhone ? 0.36 : 0.17);
    poolRy = H * 0.045;

    cell = Math.max(4, Math.min(9, Math.round(slabW / 68)));
    gx0 = slabX - cell * 3;
    gy0 = slabY - cell * 3;
    cols = Math.ceil((slabW + cell * 6) / cell);
    rows = Math.ceil((slabH + cell * 6) / cell);

    stone = new Uint8Array(cols * rows);
    depth = new Float32Array(cols * rows);
    cutT = new Float32Array(cols * rows);
    var i, j;
    for (j = 0; j < rows; j++) {
      for (i = 0; i < cols; i++) {
        var idx = cellIndex(i, j);
        stone[idx] = insideSlab(gx0 + (i + 0.5) * cell, gy0 + (j + 0.5) * cell) ? 1 : 0;
        cutT[idx] = -1e9;
      }
    }

    // Silhouette: ray-march the slab SDF from its center, 720 rays.
    outline = [];
    var cx = slabX + slabW / 2, cy = slabY + slabH / 2;
    var maxR = Math.sqrt(slabW * slabW + slabH * slabH) / 2 + cell * 4;
    for (var a = 0; a < 720; a++) {
      var th = (a / 720) * Math.PI * 2;
      var dx = Math.cos(th), dy = Math.sin(th);
      var lo = 0, hi = maxR;
      for (var b = 0; b < 22; b++) {
        var mid = (lo + hi) / 2;
        if (insideSlab(cx + dx * mid, cy + dy * mid)) lo = mid; else hi = mid;
      }
      outline.push([cx + dx * lo, cy + dy * lo]);
    }

    // Initial channel: one winding groove from the top-center mouth
    // down through the slab and out its lower edge. Fully aged.
    var steps = 90;
    var prevX = 0, prevY = 0;
    for (var s = 0; s <= steps; s++) {
      var v = s / steps;                       // 0 at top, 1 at bottom
      var taper = Math.min(1, v * 3.5);        // mouth sits exactly top-center
      var u = 0.5 + taper * (0.13 * Math.sin(v * 5.2 + chanW1) + 0.05 * Math.sin(v * 11.7 + chanW2));
      var px = slabX + u * slabW;
      var py = slabY + (v * 1.12 - 0.06) * slabH;
      var rad = (s === 0 ? 3.2 : 2.1) * cell;
      if (s === 0) stamp(px, py, rad, true);
      else stampSegment(prevX, prevY, px, py, rad, true);
      prevX = px; prevY = py;
    }

    computeColTop();
  }

  // Bilinear sample of the depth grid in pixel coordinates.
  function depthAt(x, y) {
    var fx = (x - gx0) / cell - 0.5;
    var fy = (y - gy0) / cell - 0.5;
    var i0 = Math.floor(fx), j0 = Math.floor(fy);
    var tx = fx - i0, ty = fy - j0;
    function g(i, j) {
      if (i < 0 || j < 0 || i >= cols || j >= rows) return 0;
      return depth[cellIndex(i, j)];
    }
    return lerp(lerp(g(i0, j0), g(i0 + 1, j0), tx), lerp(g(i0, j0 + 1), g(i0 + 1, j0 + 1), tx), ty);
  }
  function stoneAt(x, y) {
    var i = Math.floor((x - gx0) / cell), j = Math.floor((y - gy0) / cell);
    if (i < 0 || j < 0 || i >= cols || j >= rows) return 0;
    return stone[cellIndex(i, j)];
  }
  function poolSurfY(x) {
    var f = (x - poolCx) / poolRx;
    var s = Math.sqrt(Math.max(0, 1 - f * f));
    return poolCy - poolRy * 0.55 * s;
  }

  // Centerline of the initial channel, in pixel coordinates.
  function channelPoint(v) {
    var taper = Math.min(1, v * 3.5);
    var u = 0.5 + taper * (0.13 * Math.sin(v * 5.2 + chanW1) + 0.05 * Math.sin(v * 11.7 + chanW2));
    return [slabX + u * slabW, slabY + (v * 1.12 - 0.06) * slabH];
  }

  // ---- Particles ----
  // state: 0 air, 1 channel, 2 top surface, 3 pool
  function respawn(p, initial) {
    p.x = srcX + (pRng() - 0.5) * 5;
    p.y = srcY;
    p.vx = 0; p.vy = 0;
    p.state = 0;
    p.stateT = 0;
    p.poolLife = 1.4 + pRng() * 1.8;
    p.phase = pRng() * 6.283;
    p.delay = initial ? pRng() * 2.5 : 0;
  }
  function initParticles() {
    pRng = mulberry32(BASE_SEED + 7);
    particles = [];
    for (var k = 0; k < N_PARTICLES; k++) {
      var p = {};
      respawn(p, true);
      // Distribute the first generation along the whole journey so
      // frame one is a mature flow, not a cohort: about a third start
      // inside the channel on its centerline, a fifth start resting in
      // the pool with staggered ages, the rest fall from the source.
      var pick = pRng();
      if (pick < 0.34) {
        var v = 0.04 + pRng() * 0.92;
        var pt = channelPoint(v), pt2 = channelPoint(Math.min(1, v + 0.02));
        p.x = pt[0] + (pRng() - 0.5) * cell;
        p.y = pt[1] + (pRng() - 0.5) * cell;
        var dx = pt2[0] - pt[0], dy = pt2[1] - pt[1];
        var dl = Math.sqrt(dx * dx + dy * dy) || 1;
        p.vx = (dx / dl) * 110; p.vy = (dy / dl) * 110;
        p.state = 1; p.delay = 0;
      } else if (pick < 0.54) {
        p.x = poolCx + (pRng() - 0.5) * poolRx * 1.2;
        p.y = poolSurfY(p.x);
        p.vx = 0; p.vy = 0;
        p.state = 3; p.delay = 0;
        p.stateT = pRng() * p.poolLife * 0.9;
      }
      particles.push(p);
    }
  }

  function snapToChannel(p) {
    // Find the deepest carved cell near a particle stuck in solid stone.
    var best = 0.25, bx = 0, by = 0, found = false;
    for (var r = 1; r <= 3; r++) {
      for (var a = 0; a < 8; a++) {
        var th = (a / 8) * Math.PI * 2;
        var sx = p.x + Math.cos(th) * r * cell, sy = p.y + Math.sin(th) * r * cell;
        var d = depthAt(sx, sy);
        if (d > best) { best = d; bx = sx; by = sy; found = true; }
      }
      if (found) break;
    }
    if (found) { p.x = bx; p.y = by; p.vx *= 0.4; p.vy *= 0.4; return true; }
    return false;
  }

  function stepParticle(p) {
    if (simTime < p.delay) return;
    p.stateT += DT;

    if (p.state === 0) {
      // Air: gravity, then environment checks.
      p.vy += 1500 * DT;
      if (p.vy > 950) p.vy = 950;
      p.x += p.vx * DT;
      p.y += p.vy * DT;

      var d0 = depthAt(p.x, p.y);
      if (d0 >= 0.2) {
        p.state = 1; p.stateT = 0;
        var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (sp > 220) { p.vx *= 220 / sp; p.vy *= 220 / sp; }
      } else if (stoneAt(p.x, p.y)) {
        var top = colTopAt(p.x);
        if (top !== Infinity && p.y - top < cell * 1.5) {
          p.state = 2; p.stateT = 0; p.y = top - 1.5; p.vy = 0;
        } else if (!snapToChannel(p)) {
          p.y -= p.vy * DT; p.vy = 0; // rest on the stone face, then slide next steps
          p.state = 2; p.stateT = 0;
        } else {
          p.state = 1; p.stateT = 0;
        }
      } else if (p.vy > 0 && Math.abs(p.x - poolCx) <= poolRx * 0.92 && p.y >= poolSurfY(p.x)) {
        p.state = 3; p.stateT = 0; p.y = poolSurfY(p.x);
        p.vx = 0; p.vy = 0;
        if (pRng() < 0.30) ripples.push({ x: p.x, y: p.y, t: simTime });
      } else if (p.y > poolCy + poolRy + 8) {
        respawn(p, false);
      }
    } else if (p.state === 1) {
      // Channel: steer by the carve-depth gradient weighted by its
      // magnitude (full strength at the groove walls, near zero on the
      // flat groove floor), plus an equal-weight downward pull and a
      // momentum term. Water centers in the groove but always drains.
      var dHere = depthAt(p.x, p.y);
      if (dHere < 0.02) { p.state = 0; p.stateT = 0; return; }
      var e = cell;
      var gx = (depthAt(p.x + e, p.y) - depthAt(p.x - e, p.y)) / (2 * e);
      var gy = (depthAt(p.x, p.y + e) - depthAt(p.x, p.y - e)) / (2 * e);
      var gm = Math.sqrt(gx * gx + gy * gy);
      var wg = Math.min(1, gm / 0.045);
      var dirx = 0, diry = 1;
      if (gm > 1e-5) { dirx = (gx / gm) * wg; diry = (gy / gm) * wg; }
      diry += 1.0;
      var sp0 = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (sp0 > 30) { dirx += (p.vx / sp0) * 0.35; diry += (p.vy / sp0) * 0.35; }
      var dl = Math.sqrt(dirx * dirx + diry * diry);
      dirx /= dl; diry /= dl;
      var spd = 125 + 20 * Math.sin(p.phase);
      p.vx += (dirx * spd - p.vx) * 0.16;
      p.vy += (diry * spd - p.vy) * 0.16;
      p.x += p.vx * DT;
      p.y += p.vy * DT;
      // Drifted into solid stone: snap back to the groove.
      if (depthAt(p.x, p.y) < 0.05 && stoneAt(p.x, p.y)) {
        if (!snapToChannel(p)) { p.vx *= -0.2; p.vy *= -0.2; }
      }
      if (p.stateT > 14) respawn(p, false); // seepage: keep the flow alive
    } else if (p.state === 2) {
      // Top surface: run along the slab top toward the channel mouth.
      if (Math.abs(p.x - mouthX) < cell * 0.9) {
        p.state = 1; p.stateT = 0; p.y += cell * 0.6; p.vy = 30;
        return;
      }
      if (depthAt(p.x, p.y + cell) > 0.3) { p.state = 1; p.stateT = 0; return; }
      var t2 = colTopAt(p.x);
      if (t2 === Infinity) { p.state = 0; p.stateT = 0; return; }
      p.vx += Math.sign(mouthX - p.x) * 620 * DT;
      p.vx *= 0.90;
      p.x += p.vx * DT;
      p.y = colTopAt(p.x) - 1.5;
    } else if (p.state === 3) {
      // Pool: drift to center, bob on the surface, then recycle.
      p.x += (poolCx - p.x) * 0.15 * DT;
      p.y = poolSurfY(p.x) + Math.sin(simTime * 2 + p.phase) * 0.6;
      if (p.stateT > p.poolLife) respawn(p, false);
    }
  }

  function stepSim() {
    simTime += DT;
    stepsRun++;
    for (var k = 0; k < particles.length; k++) stepParticle(particles[k]);
    if (ripples.length > 40) ripples.splice(0, ripples.length - 40);
  }

  function buildSim() {
    simTime = 0;
    stepsRun = 0;
    ripples = [];
    initParticles();
    for (var s = 0; s < PRE_STEPS; s++) stepSim();
  }

  // ---- Draw ----
  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Pool basin.
    ctx.beginPath();
    ctx.ellipse(poolCx, poolCy, poolRx, poolRy, 0, 0, Math.PI * 2);
    ctx.fillStyle = POOL;
    ctx.fill();

    // Ripples where the stream lands.
    ctx.strokeStyle = WATER;
    ctx.lineWidth = 1.2;
    for (var r = ripples.length - 1; r >= 0; r--) {
      var age = simTime - ripples[r].t;
      if (age > 1.3) { ripples.splice(r, 1); continue; }
      var rr = 2 + age * 13;
      ctx.globalAlpha = (1 - age / 1.3) * 0.5;
      ctx.beginPath();
      ctx.ellipse(ripples[r].x, ripples[r].y, rr, rr * 0.30, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Slab silhouette.
    ctx.beginPath();
    ctx.moveTo(outline[0][0], outline[0][1]);
    for (var k = 1; k < outline.length; k++) ctx.lineTo(outline[k][0], outline[k][1]);
    ctx.closePath();
    ctx.fillStyle = STONE;
    ctx.fill();

    // Carved cells, clipped to the silhouette. Aged cuts sit in the
    // groove shade deepened by depth; fresh cuts flare bright.
    ctx.save();
    ctx.clip();
    for (var j = 0; j < rows; j++) {
      for (var i = 0; i < cols; i++) {
        var idx = cellIndex(i, j);
        var d = depth[idx];
        if (d <= 0.02) continue;
        var aged = mixRgb(STONE_RGB, GROOVE_RGB, Math.min(1, d * 1.15));
        var col = aged, alpha = 0.55 + 0.45 * d;
        var ct = cutT[idx];
        if (ct > -1e8) {
          var f = clamp01(1 - (simTime - ct) / FRESH_WINDOW);
          if (f > 0) {
            col = blendCss(aged, f);
            alpha = Math.max(alpha, 0.85);
          }
        }
        ctx.globalAlpha = alpha;
        ctx.fillStyle = col;
        ctx.fillRect(gx0 + i * cell, gy0 + j * cell, cell + 1, cell + 1);
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // Hand-cut edge definition.
    ctx.beginPath();
    ctx.moveTo(outline[0][0], outline[0][1]);
    for (var m = 1; m < outline.length; m++) ctx.lineTo(outline[m][0], outline[m][1]);
    ctx.closePath();
    ctx.globalAlpha = 0.45;
    ctx.strokeStyle = GROOVE;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Water.
    ctx.fillStyle = WATER;
    for (var q = 0; q < particles.length; q++) {
      var p = particles[q];
      if (simTime < p.delay) continue;
      var rad = p.state === 3 ? 1.5 : 1.8;
      ctx.globalAlpha = p.state === 3 ? 0.85 : 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Blend an 'rgb(r,g,b)' aged groove color toward FRESH by f.
  // (Aged colors are produced by mixRgb above; parse and re-mix.)
  function blendCss(agedCss, f) {
    var m = /rgb\((\d+),(\d+),(\d+)\)/.exec(agedCss);
    if (!m) return agedCss;
    var a = [parseInt(m[1], 10), parseInt(m[2], 10), parseInt(m[3], 10)];
    return mixRgb(a, FRESH_RGB, f);
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || (sw === 9999 && H > W * 1.15);
    buildLayout();
    buildSim();
  }

  // ---- Interaction: drag on the stone is a chisel ----
  var carving = false, lastPX = 0, lastPY = 0;
  function pointerPos(ev) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [ev.clientX - r.left, ev.clientY - r.top];
  }
  canvas.addEventListener('pointerdown', function (ev) {
    var pos = pointerPos(ev);
    carving = true;
    lastPX = pos[0]; lastPY = pos[1];
    stamp(pos[0], pos[1], 2.3 * cell, false);
    computeColTop();
    draw();
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!carving) return;
    var pos = pointerPos(ev);
    stampSegment(lastPX, lastPY, pos[0], pos[1], 2.3 * cell, false);
    computeColTop();
    lastPX = pos[0]; lastPY = pos[1];
    draw();
  });
  canvas.addEventListener('pointerup', function () { carving = false; });
  canvas.addEventListener('pointercancel', function () { carving = false; });

  // ---- Anchored clock: frame one is the synchronous draw after the
  // pre-simulation; the live loop continues stepping the same sim. ----
  var t0 = null, lastTs = null, acc = 0;

  // QA hook: ?t=<seconds> advances the sim past the pre-simulation by
  // that many seconds before the synchronous frame. Inert otherwise.
  var qaT = null;
  if (typeof location !== 'undefined' && location.search) {
    var mm = /t=([0-9.]+)/.exec(location.search);
    if (mm) qaT = parseFloat(mm[1]);
  }

  function frame(ts) {
    if (t0 === null) { t0 = ts; lastTs = ts; }
    acc += Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;
    while (acc >= DT) { stepSim(); acc -= DT; }
    draw();
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
  }
  window.addEventListener('resize', function () { resize(); draw(); });

  resize();

  if (qaT !== null) {
    var extra = Math.round(qaT * 60);
    for (var s2 = 0; s2 < extra; s2++) stepSim();
    draw();
  } else {
    draw(); // frame one: water already mid-flow from the pre-simulation
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
