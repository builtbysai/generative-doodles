<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Please Respond, Ten Hands</title>
<style>
html, body { margin: 0; padding: 0; background: #111214; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#111214';
var PLATE = '#17181A';
var PLATE_LINE = 'rgba(242,237,226,0.45)';
var TITLE_INK = '#F2EDE2';
var HINT_INK = '#F2EDE2';
var FIRST_T = 30;
var HAND_PERIOD = 60;
var MORPH_LEN = 5;
var CYCLE = 600;
/* DRIVER: one algorithm passed hand to hand, each author bending it
   without ever starting over. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixHex(a, b, f) {
  var ca = hexRgb(a), cb = hexRgb(b);
  var r = Math.round(ca[0] + (cb[0] - ca[0]) * f);
  var g = Math.round(ca[1] + (cb[1] - ca[1]) * f);

}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {

  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;

  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';

/* ---- the ten hands: rule presets, lerped on handoff ----

  { name: 'grid order',  jitter: 0.00, slant: 0.00, extrude: 0.00, erosion: 0.00, annot: 0.00, wave: 0.00, scatter: 0.00, ring: 0.00, drift: 0.00, colorBreak: 0.00, markLen: 0.42, mark: '#D9A441', accent: '#F2E8D5' },
  { name: 'slant',       jitter: 0.06, slant: 0.62, extrude: 0.00, erosion: 0.00, annot: 0.05, wave: 0.00, scatter: 0.00, ring: 0.00, drift: 0.00, colorBreak: 0.08, markLen: 0.55, mark: '#2E8C8A', accent: '#F4F1EA' },
  { name: 'extrusion',   jitter: 0.04, slant: 0.20, extrude: 1.00, erosion: 0.00, annot: 0.00, wave: 0.00, scatter: 0.00, ring: 0.00, drift: 0.00, colorBreak: 0.10, markLen: 0.48, mark: '#B4502E', accent: '#3A3A38' },
  { name: 'erosion',     jitter: 0.16, slant: 0.10, extrude: 0.00, erosion: 0.55, annot: 0.00, wave: 0.00, scatter: 0.10, ring: 0.00, drift: 0.00, colorBreak: 0.12, markLen: 0.45, mark: '#2E4FA3', accent: '#EDE6D6' },
  { name: 'annotation',  jitter: 0.05, slant: 0.00, extrude: 0.00, erosion: 0.05, annot: 0.85, wave: 0.00, scatter: 0.00, ring: 0.00, drift: 0.00, colorBreak: 0.06, markLen: 0.40, mark: '#D9A441', accent: '#F2E8D5' },
  { name: 'color-break', jitter: 0.08, slant: 0.30, extrude: 0.00, erosion: 0.00, annot: 0.10, wave: 0.15, scatter: 0.00, ring: 0.00, drift: 0.00, colorBreak: 0.45, markLen: 0.50, mark: '#2E4FA3', accent: '#B4502E' },
  { name: 'wave',        jitter: 0.03, slant: 0.00, extrude: 0.00, erosion: 0.00, annot: 0.00, wave: 1.00, scatter: 0.00, ring: 0.00, drift: 0.00, colorBreak: 0.10, markLen: 0.46, mark: '#2E8C8A', accent: '#F4F1EA' },
  { name: 'scatter',     jitter: 0.60, slant: 0.35, extrude: 0.00, erosion: 0.10, annot: 0.00, wave: 0.00, scatter: 1.00, ring: 0.00, drift: 0.00, colorBreak: 0.15, markLen: 0.44, mark: '#B4502E', accent: '#EDE6D6' },
  { name: 'ring',        jitter: 0.05, slant: 0.00, extrude: 0.00, erosion: 0.00, annot: 0.15, wave: 0.00, scatter: 0.00, ring: 1.00, drift: 0.00, colorBreak: 0.08, markLen: 0.48, mark: '#2E4FA3', accent: '#EDE6D6' },
  { name: 'drift',       jitter: 0.10, slant: 0.15, extrude: 0.00, erosion: 0.05, annot: 0.30, wave: 0.40, scatter: 0.00, ring: 0.00, drift: 1.00, colorBreak: 0.10, markLen: 0.46, mark: '#D9A441', accent: '#F2E8D5' }
];
var NUM_KEYS = ['jitter', 'slant', 'extrude', 'erosion', 'annot', 'wave', 'scatter', 'ring', 'drift', 'colorBreak', 'markLen'];
/* Interpolated rule params at piece-time t. Pure function of t. */
function paramsAt(t) {

  var prev = (hand + 9) % 10;
  var f = 1;

  for (k = 0; k < NUM_KEYS.length; k++) {
    var key = NUM_KEYS[k];
    p[key] = prv[key] + (cur[key] - prv[key]) * f;

  p.mark = mixHex(prv.mark, cur.mark, f);

  p.morph = f;

}
function activeHand(t) {
  var tc = ((t % CYCLE) + CYCLE) % CYCLE;
  return Math.floor(tc / HAND_PERIOD) % 10;
}
/* ---- seeded field: one fixed mark per cell, all variation from seed 942 ---- */
var CELL = 28;
var fieldRng = mulberry32(942);
var SEEDS = null;
function buildSeeds(cols, rows) {
  var n = cols * rows, i;
  SEEDS = [];
  var r = mulberry32(942);
  for (i = 0; i < n; i++) {
    SEEDS.push({
      jx: r() - 0.5, jy: r() - 0.5,
      sx: r() - 0.5, sy: r() - 0.5,
      size: 0.7 + r() * 0.6,
      phase: r() * TAU,
      erode: r(), annot: r(), color: r()
    });
  }
  return SEEDS;
}
function drawField(t, p) {
  var cols = Math.max(8, Math.ceil(VW / CELL));
  var rows = Math.max(8, Math.ceil(VH / CELL));
  var cw = VW / cols, ch = VH / rows;
  var cell = Math.min(cw, ch);
  if (!SEEDS || SEEDS.length !== cols * rows) buildSeeds(cols, rows);
  var cx0 = VW / 2, cy0 = VH / 2;
  var ringSpacing = Math.min(VW, VH) / 7;
  var i, j, idx;
  ctx.lineCap = 'round';
  for (j = 0; j < rows; j++) {
    for (i = 0; i < cols; i++) {
      idx = j * cols + i;
      var s = SEEDS[idx];
      var x = (i + 0.5) * cw;
      var y = (j + 0.5) * ch;
      /* Jitter and scatter: seeded offsets scaled by the active rule. */
      x += s.jx * p.jitter * cell * 1.6 + s.sx * p.scatter * cell * 1.4;
      y += s.jy * p.jitter * cell * 1.6 + s.sy * p.scatter * cell * 1.4;
      /* Wave: a slow travelling sine across the field. */
      if (p.wave > 0) {
        y += p.wave * Math.sin(TAU * (i / cols) * 3 + TAU * t / 60 + s.phase * 0.2) * cell * 0.45;
      }
      /* Ring: pull each mark toward its nearest concentric ring. */
      if (p.ring > 0) {
        var dxr = x - cx0, dyr = y - cy0;
        var rr = Math.sqrt(dxr * dxr + dyr * dyr);
        if (rr > 1) {
          var target = Math.round(rr / ringSpacing) * ringSpacing;
          var pull = (target - rr) * p.ring * 0.8;
          x += dxr / rr * pull;
          y += dyr / rr * pull;
        }
      }
      /* Drift: a slow steady slide, breathing with the hand period. */
      if (p.drift > 0) {
        var breathe = 0.5 + 0.5 * Math.sin(TAU * t / 60 + s.phase);
        x += p.drift * cell * 0.55 * breathe;
        y += p.drift * cell * 0.30 * Math.sin(s.phase + TAU * t / 120);
      }
      /* Erosion: seeded marks fade to stubs under the erosion rule. */
      var alpha = 0.92;
      var lenScale = 1;
      if (s.erode < p.erosion) {
        alpha = 0.22;
        lenScale = 0.38;
      }
      /* Gentle breathing of mark length, a pure function of t. */
      var len = p.markLen * cell * s.size * lenScale * (1 + 0.12 * Math.sin(TAU * t / 60 + s.phase));
      var ang = p.slant + s.jx * 0.25 * (p.jitter + p.scatter * 0.5);
      var hx = Math.cos(ang) * len / 2, hy = Math.sin(ang) * len / 2;
      var col = (s.color < p.colorBreak) ? p.accent : p.mark;
      /* Extrusion: a dim offset copy behind the mark. */
      if (p.extrude > 0.02) {
        var ex = Math.cos(ang) * cell * 0.45 * p.extrude;
        var ey = Math.sin(ang) * cell * 0.45 * p.extrude + cell * 0.22 * p.extrude;

        ctx.globalAlpha = Number((0.28 * p.extrude).toFixed(4));
        ctx.lineWidth = Math.max(1, cell * 0.10);
        ctx.beginPath();
        ctx.moveTo(x + ex - hx, y + ey - hy);
        ctx.lineTo(x + ex + hx, y + ey + hy);
        ctx.stroke();
      }
      ctx.strokeStyle = col;
      ctx.globalAlpha = Number(alpha.toFixed(4));
      ctx.lineWidth = Math.max(1, cell * 0.11);
      ctx.beginPath();
      ctx.moveTo(x - hx, y - hy);
      ctx.lineTo(x + hx, y + hy);
      ctx.stroke();
      /* Annotation: seeded crosses beside the mark. */
      if (s.annot < p.annot) {
        var ax = x + cell * 0.42, ay = y - cell * 0.42;
        var a = cell * 0.14;
        ctx.strokeStyle = p.accent;
        ctx.globalAlpha = Number((0.75 * alpha).toFixed(4));
        ctx.lineWidth = Math.max(1, cell * 0.05);
        ctx.beginPath();
        ctx.moveTo(ax - a, ay); ctx.lineTo(ax + a, ay);

  ctx.fillRect(0, y, VW, 2);
  var k;
  for (k = 0; k < 10; k++) {
    var tx = (k + 0.5) * VW / 10;
    ctx.fillStyle = (k === hand) ? '#FFFFFF' : 'rgba(160,160,160,0.45)';
    ctx.fillRect(tx - 1, VH - 12, 2, 10);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Please Respond, Ten Hands').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Please Respond, Ten Hands').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 02').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Please Respond, Ten Hands', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 02', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 26;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var p = paramsAt(t);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawField(t, p);
  drawTimeline(t);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {

    drawAt: function (t) { draw(t); },
    paramsAt: function (t) { return paramsAt(t); },
    activeHand: function (t) { return activeHand(t); },
    handCount: function () { return HANDS.length; },
    handName: function (i) { return HANDS[i].name; }
  };
}
/* ---- frame one: t = 30, mid-way through hand 1 (grid order), first tick lit ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);

    if (t0 === null) t0 = ts;

    prevTs = ts;

</script>
