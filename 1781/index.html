<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whether There Was a Bell</title>
<style>
html, body { margin: 0; padding: 0; background: #1b1b1e; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#1b1b1e'; /* charcoal field */
var NODE = '#f2ede2'; /* warm white speaker nodes */
var NODE_HALO = 'rgba(242,237,226,0.10)';
var PAPER = '#f2efe6'; /* plotter strip paper */
var INK = '23,21,15'; /* ink-black plotter lines */
var AMBER = '201,161,92'; /* muted amber voice packet */
var TEAL = '99,168,160'; /* muted teal voice packet */
var ROSE = '201,131,125'; /* muted rose voice packet */
var FRAME_T = 60.0; /* fixed phase: reading 0, 60 s in, packets mid-route, strip partly drawn */
var READING = 90.0; /* seconds per reading; then routes are re-dealt and the strip starts fresh */
var PLATE_FILL = '#121214';
var PLATE_LINE = 'rgba(242,237,226,0.28)';
var PLATE_INK = '#f2ede2';
var HINT_INK = '#f2ede2';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(u) { return u * u * (3 - 2 * u); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* ---- node constellation: 18 speaker nodes, irregular, upper two-thirds ---- */
/* fractions of the field; y spans 0.08 to 0.62, the paper strip starts at 0.74 */
var NODES = [
  [0.10, 0.15], [0.23, 0.08], [0.36, 0.18], [0.48, 0.09], [0.62, 0.17], [0.74, 0.08],
  [0.87, 0.16], [0.93, 0.30], [0.81, 0.32], [0.68, 0.27], [0.56, 0.38], [0.43, 0.31],
  [0.30, 0.40], [0.16, 0.32], [0.09, 0.50], [0.27, 0.60], [0.50, 0.62], [0.73, 0.58]
];
function nodeXY(i) {
  return { x: F.x + NODES[i][0] * F.w, y: F.y + NODES[i][1] * F.h };
}
/* ---- routes: one per packet, re-dealt every reading ---- */
/* Reading 0 is authored outright. Later readings come from a fixed seeded
   generator (mulberry32), so every reading is a fixed authored table, never
   Math.random() at runtime, and frame one stays byte-comparable. */
var PACKETS = [
  { color: AMBER, route: [[1, 4, 9, 12, 15, 11, 5, 8, 3], [12, 11, 13, 12, 14, 11, 13, 12]] },
  { color: AMBER, route: [[6, 8, 10, 13, 14, 16, 17, 7, 2], [11, 13, 12, 14, 11, 13, 12, 12]] },
  { color: TEAL, route: [[0, 2, 5, 9, 14, 15, 17, 11, 4], [13, 12, 14, 11, 13, 12, 14, 12]] },
  { color: TEAL, route: [[7, 6, 3, 1, 0, 12, 16, 17, 8], [12, 13, 11, 14, 12, 13, 12, 12]] },
  { color: ROSE, route: [[3, 5, 8, 13, 10, 15, 17, 12, 1], [12, 14, 11, 13, 12, 14, 13, 12]] },
  { color: ROSE, route: [[4, 7, 9, 11, 14, 16, 13, 2, 5], [13, 11, 14, 12, 13, 12, 14, 13]] }
];
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function generatedRoute(reading, p) {
  var rnd = mulberry32(7919 + reading * 131 + p * 17);
  var nodes = [], legs = [], prev = -1, cur = Math.floor(rnd() * 18);
  var k, nxt;
  for (k = 0; k < 9; k++) {
    nodes.push(cur);
    do { nxt = Math.floor(rnd() * 18); } while (nxt === cur || nxt === prev);
    prev = cur; cur = nxt;
    legs.push(11 + Math.floor(rnd() * 4));
  }
  return [nodes, legs];
}
function routeFor(reading, p) {
  if (reading === 0) return PACKETS[p].route;
  return generatedRoute(reading, p);
}
function readingOf(t) { return Math.floor(t / READING); }
/* Points along one leg, with a fixed per-leg sideways bow so routes read as
   drifted paths rather than ruler lines. Closed form of (route, leg, u). */
function legPoints(a, b, legIdx, p, upto) {
  var dx = b.x - a.x, dy = b.y - a.y;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var px = -dy / len, py = dx / len;
  var bow = ((legIdx + p) % 2 === 0 ? 1 : -1) * 0.045 * len;
  var pts = [], i, s, u, off;
  var steps = 8;
  var n = Math.max(1, Math.round(steps * upto));
  for (i = 0; i <= n; i++) {
    s = i / steps;
    u = smooth(s);
    off = Math.sin(Math.PI * s) * bow;
    pts.push({ x: a.x + dx * u + px * off, y: a.y + dy * u + py * off });
  }
  return pts;
}
/* Packet state at piece time t: position, current leg, and how many legs of
   this reading it has already travelled. Closed form of t. */
function packetState(t, p) {
  var reading = readingOf(t);
  var elapsed = t - reading * READING;
  var route = routeFor(reading, p);
  var nodes = route[0], legs = route[1];
  var cum = 0, k, legStart = 0, legDur = legs[0];
  for (k = 0; k < legs.length; k++) {
    if (elapsed < cum + legs[k]) { legStart = cum; legDur = legs[k]; break; }
    cum += legs[k];
    legStart = cum; legDur = legs[k];
  }
  if (k >= legs.length) { k = legs.length - 1; legStart = cum - legs[k]; legDur = legs[k]; }
  var u = clamp((elapsed - legStart) / legDur, 0, 1);
  var a = nodeXY(nodes[k]), b = nodeXY(nodes[k + 1]);
  var pts = legPoints(a, b, k, p, u);
  var pos = pts[pts.length - 1];
  return { x: pos.x, y: pos.y, leg: k, u: u, nodes: nodes, legs: legs, reading: reading, elapsed: elapsed, target: nodes[k + 1] };
}
/* The plotter strip: paper along the bottom of the field. Node fractions map
   into it so the ink score is the same geometry, compressed, as the field. */
function stripRect() {
  return { x: F.x + 0.03 * F.w, y: F.y + 0.74 * F.h, w: F.w * 0.94, h: F.h * 0.22 };
}
function mapToStrip(fx, fy) {
  var s = stripRect();
  var my = 0.14 + ((fy - 0.05) / (0.66 - 0.05)) * 0.72;
  return { x: s.x + fx * s.w, y: s.y + clamp(my, 0.06, 0.94) * s.h };
}
function drawNodes(t) {
  var S = Math.min(F.w, F.h);
  var i, n;
  for (i = 0; i < NODES.length; i++) {
    n = nodeXY(i);
    ctx.fillStyle = NODE_HALO;
    ctx.beginPath();
    ctx.arc(n.x, n.y, Math.max(4, 0.022 * S), 0, TAU);
    ctx.fill();
    ctx.fillStyle = NODE;
    ctx.beginPath();
    ctx.arc(n.x, n.y, Math.max(2, 0.008 * S), 0, TAU);
    ctx.fill();
  }
  /* a faint ring marks each packet's current destination node */
  var p, st;
  for (p = 0; p < PACKETS.length; p++) {
    st = packetState(t, p);
    n = nodeXY(st.target);
    ctx.strokeStyle = 'rgba(' + PACKETS[p].color + ',0.55)';
    ctx.lineWidth = Math.max(1, 0.002 * S);
    ctx.beginPath();
    ctx.arc(n.x, n.y, Math.max(5, 0.016 * S), 0, TAU);
    ctx.stroke();
  }
}
function drawPackets(t) {
  var S = Math.min(F.w, F.h);
  var p, st, k, a, b, pts, j, alpha;
  for (p = 0; p < PACKETS.length; p++) {
    st = packetState(t, p);
    /* trail: every leg travelled so far in this reading, oldest faintest */
    for (k = 0; k <= st.leg; k++) {
      a = nodeXY(st.nodes[k]);
      b = nodeXY(st.nodes[k + 1]);
      pts = legPoints(a, b, k, p, k === st.leg ? st.u : 1);
      alpha = 0.14 + 0.45 * (k / Math.max(1, st.leg));
      ctx.strokeStyle = 'rgba(' + PACKETS[p].color + ',' + alpha.toFixed(4) + ')';
      ctx.lineWidth = Math.max(1, 0.003 * S);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (j = 1; j < pts.length; j++) ctx.lineTo(pts[j].x, pts[j].y);
      ctx.stroke();
    }
    /* packet head: soft glow, then a solid core */
    ctx.fillStyle = 'rgba(' + PACKETS[p].color + ',0.22)';
    ctx.beginPath();
    ctx.arc(st.x, st.y, Math.max(6, 0.02 * S), 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgb(' + PACKETS[p].color + ')';
    ctx.beginPath();
    ctx.arc(st.x, st.y, Math.max(3, 0.009 * S), 0, TAU);
    ctx.fill();
  }
}
function drawStrip(t) {
  var S = Math.min(F.w, F.h);
  var s = stripRect();
  /* paper */
  ctx.fillStyle = PAPER;
  ctx.fillRect(s.x, s.y, s.w, s.h);
  ctx.strokeStyle = 'rgba(' + INK + ',0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(s.x + 0.5, s.y + 0.5, s.w - 1, s.h - 1);
  /* ledger rules */
  var r;
  ctx.strokeStyle = 'rgba(' + INK + ',0.08)';
  for (r = 1; r <= 3; r++) {
    ctx.beginPath();
    ctx.moveTo(s.x + 6, s.y + (r / 4) * s.h);
    ctx.lineTo(s.x + s.w - 6, s.y + (r / 4) * s.h);
    ctx.stroke();
  }
  /* rail the plotter arms hang from */
  ctx.strokeStyle = 'rgba(' + INK + ',0.30)';
  ctx.beginPath();
  ctx.moveTo(s.x + 2, s.y + 2);
  ctx.lineTo(s.x + s.w - 2, s.y + 2);
  ctx.stroke();
  /* the ink score: each packet's actual travelled path, mapped into the strip */
  var p, st, k, a, b, pts, j, fx, fy, mx, my;
  for (p = 0; p < PACKETS.length; p++) {
    st = packetState(t, p);
    for (k = 0; k <= st.leg; k++) {
      a = nodeXY(st.nodes[k]);
      b = nodeXY(st.nodes[k + 1]);
      pts = legPoints(a, b, k, p, k === st.leg ? st.u : 1);
      ctx.strokeStyle = 'rgba(' + INK + ',0.75)';
      ctx.lineWidth = Math.max(1, 0.0016 * S);
      ctx.beginPath();
      for (j = 0; j < pts.length; j++) {
        fx = (pts[j].x - F.x) / F.w;
        fy = (pts[j].y - F.y) / F.h;
        mx = mapToStrip(fx, fy);
        if (j === 0) ctx.moveTo(mx.x, mx.y); else ctx.lineTo(mx.x, mx.y);
      }
      ctx.stroke();
    }
    /* plotter arm: a thin line from the rail down to this packet's pen */
    fx = (st.x - F.x) / F.w;
    fy = (st.y - F.y) / F.h;
    mx = mapToStrip(fx, fy);
    ctx.strokeStyle = 'rgba(' + INK + ',0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mx.x, s.y + 2);
    ctx.lineTo(mx.x, mx.y);
    ctx.stroke();
    /* pen head */
    ctx.fillStyle = 'rgb(' + INK + ')';
    ctx.beginPath();
    ctx.arc(mx.x, mx.y, Math.max(2, 0.004 * S), 0, TAU);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Whether There Was a Bell').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Whether There Was a Bell').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 27').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Whether There Was a Bell', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 27', plateX + 14, plateY + 7 + titlePx + 3);
  /* hint plate, top-right so it never covers the paper score */
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = VW - hintPlateW - 12;
  var hintPlateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawNodes(phaseT);
  drawPackets(phaseT);
  drawStrip(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    readingOf: function () { return readingOf(phaseT); },
    packetState: function (p) { return packetState(phaseT, p); }
  };
}
/* ---- frame one: fixed phase t = 60 s, reading 0, 60 s in ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('pointerdown', function () {
    /* optional airy noise burst, only inside the visitor gesture, gain kept low */
    try {
      if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
        var AC = typeof AudioContext !== 'undefined' ? AudioContext : webkitAudioContext;
        var ac = new AC();
        var dur = 0.6;
        var buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
        var d = buf.getChannelData(0);
        var i;
        for (i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        var src = ac.createBufferSource();
        src.buffer = buf;
        var filt = ac.createBiquadFilter();
        filt.type = 'bandpass'; filt.frequency.value = 1200; filt.Q.value = 1.2;
        var gain = ac.createGain();
        gain.gain.setValueAtTime(0.04, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
        src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
        src.start();
      }
    } catch (e) { /* audio is optional; the piece works fully muted */ }
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
