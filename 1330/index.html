<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Orpheus</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0C0A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var COOL = '#0D0C0A', MOLTEN = '#3A2A1E', GLINT = '#7A6F5C', GHOST = '#4D463B';
  var LOOP = 60, CREEP_END = 38, SOLID_END = 50, SHIFT = 20;

  var W = 0, H = 0, S = 0;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W; canvas.height = H;
    S = Math.min(W, H);
  }
  size();

  // One cycle of the pour, fully seeded. No Math.random anywhere.
  function buildCycle(idx) {
    var rng = mulberry32(1330000 + idx * 7919);
    var blobs = [], blisters = [], arcs = [], tongues = [], glints = [];
    for (var i = 0; i < 30; i++) {
      // Bases cluster along the dominant diagonal (top-left to
      // bottom-right), biased away from the top-right void corner; the
      // creep carries them down-right, never off the field.
      var along = rng() * 0.62, across = (rng() - 0.5) * 0.85;
      var bx = 0.04 + along, by = 0.04 + along;
      bx += -across * 0.32; by += across * 0.32;
      if (bx > 0.70 && by < 0.30) { bx -= 0.28; by += 0.24; }
      blobs.push({
        x: bx, y: by, r: (0.07 + rng() * 0.09),
        speed: 0.55 + rng() * 0.9, phase: rng() * 6.283,
        gloss: rng(), creep: 0.10 + rng() * 0.20
      });
    }
    for (var j = 0; j < 40; j++) {
      var b = blobs[Math.floor(rng() * blobs.length)];
      blisters.push({
        x: b.x + (rng() - 0.5) * b.r * 1.2,
        y: b.y + (rng() - 0.5) * b.r * 1.2,
        r: 0.010 + rng() * 0.018, phase: rng() * 6.283, rate: 0.5 + rng() * 0.9
      });
    }
    for (var k = 0; k < 8; k++) {
      arcs.push({
        x: 0.18 + rng() * 0.55, y: 0.22 + rng() * 0.5,
        r: 0.05 + rng() * 0.09,
        a0: rng() * 6.283, a1: 0.5 + rng() * 1.4,
        alpha: 0.14 + rng() * 0.16
      });
    }
    // Drip tongues frozen at the flow's leading edges (right, bottom),
    // with a couple trailing on the left and top.
    for (var m = 0; m < 10; m++) {
      var edge = (m < 7) ? (m % 2 === 0 ? 1 : 2) : (m % 2 === 0 ? 0 : 3);
      var tx = 0, ty = 0;
      if (edge === 0) { tx = 0.05 + rng() * 0.9; ty = 0.02; }
      if (edge === 1) { tx = 0.98; ty = 0.05 + rng() * 0.9; }
      if (edge === 2) { tx = 0.05 + rng() * 0.9; ty = 0.98; }
      if (edge === 3) { tx = 0.02; ty = 0.05 + rng() * 0.9; }
      tongues.push({ x: tx, y: ty, len: 0.08 + rng() * 0.07, w: 0.014 + rng() * 0.012 });
    }
    for (var g = 0; g < 12; g++) {
      glints.push({ x: 0.08 + rng() * 0.84, y: 0.08 + rng() * 0.84, r: 0.003 + rng() * 0.005, phase: rng() * 6.283 });
    }
    return { blobs: blobs, blisters: blisters, arcs: arcs, tongues: tongues, glints: glints };
  }

  // Drag: recorded segments, closed-form decay. Redirects flow direction.
  var drags = [];
  function flowAngle(t) {
    var base = Math.PI / 4, off = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i], age = t - d.t;
      if (age < 0 || age > 12) continue;
      off += d.ang * Math.exp(-age / 2.5);
    }
    if (off > 0.6) off = 0.6; if (off < -0.6) off = -0.6;
    return base + off;
  }

  function disc(x, y, r, style, alpha) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 6.283); ctx.closePath();
    ctx.fillStyle = style; ctx.globalAlpha = alpha; ctx.fill();
  }

  function drawField(cyc, t, alpha, frozen) {
    var ang = flowAngle(t);
    var dx = Math.cos(ang), dy = Math.sin(ang);
    var creep = frozen ? 1 : Math.min(1, t / CREEP_END);
    var front = frozen ? 1 : (t < CREEP_END ? 0 : Math.min(1, (t - CREEP_END) / (SOLID_END - CREEP_END)));
    ctx.save();
    ctx.globalAlpha = alpha;
    // Poured masses: molten rim, molten body, darkened core. The body
    // stays visibly distinct from the background; only palette colors
    // plus alpha are used, never gradients.
    for (var i = 0; i < cyc.blobs.length; i++) {
      var b = cyc.blobs[i];
      var dist = b.creep * creep * S * 0.30;
      var cx = (b.x * W) + dx * dist * b.speed;
      var cy = (b.y * H) + dy * dist * b.speed;
      var r = b.r * S * (0.75 + 0.25 * creep);
      var solid = (b.x + b.y) / 2 < front * 1.15;
      disc(cx, cy, r * 1.15, MOLTEN, alpha * (solid ? 0.40 : 0.60));
      disc(cx, cy, r, MOLTEN, alpha * (solid ? 0.28 : 0.52));
      // No per-blob core: overlapping bodies merge into one continuous
      // pour, with thicker overlaps reading as deeper material.
      // Gloss while still liquid, matte once set.
      if (!solid && b.gloss > 0.35) {
        ctx.beginPath(); ctx.moveTo(cx + r * 0.45, cy - r * 0.35);
        ctx.arc(cx, cy - r * 0.1, r * 0.45, -2.4, -0.7); ctx.closePath();
        ctx.fillStyle = MOLTEN; ctx.globalAlpha = alpha * 0.40; ctx.fill();
      }
    }
    // Ghost arcs: faces that never fully emerged.
    ctx.lineWidth = Math.max(1, S * 0.002);
    for (var k = 0; k < cyc.arcs.length; k++) {
      var a = cyc.arcs[k];
      ctx.beginPath(); ctx.arc(a.x * W, a.y * H, a.r * S, a.a0, a.a0 + a.a1);
      ctx.strokeStyle = GHOST; ctx.globalAlpha = alpha * a.alpha; ctx.stroke();
    }
    // Blisters breathing.
    for (var j = 0; j < cyc.blisters.length; j++) {
      var bl = cyc.blisters[j];
      var br = bl.r * S * (1 + 0.18 * Math.sin(6.283 * bl.rate * t + bl.phase));
      disc(bl.x * W, bl.y * H, br, MOLTEN, alpha * 0.6);
    }
    // Drip tongues, re-aimed toward the drag vector.
    for (var m = 0; m < cyc.tongues.length; m++) {
      var tg = cyc.tongues[m];
      ctx.save();
      ctx.translate(tg.x * W, tg.y * H); ctx.rotate(ang + Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(-tg.w * S, 0); ctx.lineTo(tg.w * S, 0);
      ctx.lineTo(0, tg.len * S); ctx.closePath();
      ctx.fillStyle = MOLTEN; ctx.globalAlpha = alpha * 0.60; ctx.fill();
      ctx.restore();
    }
    // Rare ceramic glints.
    for (var g = 0; g < cyc.glints.length; g++) {
      var gl = cyc.glints[g];
      var ga = 0.25 + 0.25 * Math.sin(6.283 * 0.4 * t + gl.phase);
      if (ga <= 0) continue;
      disc(gl.x * W, gl.y * H, gl.r * S, GLINT, alpha * ga);
    }
    ctx.restore();
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = COOL; ctx.fillRect(0, 0, W, H);
    // Phase-shifted so frame one opens mid-pour, per the hold-phase
    // precedent: the pour is already developed at t = 0.
    var shifted = t + SHIFT;
    var cycle = Math.floor(shifted / LOOP);
    var ph = shifted - cycle * LOOP;
    var cyc = buildCycle(cycle);
    if (ph < SOLID_END) {
      drawField(cyc, ph, 1, false);
    } else {
      // Reset crossfade on the main canvas: frozen end state under the
      // next cycle's liquid start, blended over the final 10 seconds.
      var f = (ph - SOLID_END) / (LOOP - SOLID_END);
      drawField(cyc, SOLID_END, 1 - f, true);
      drawField(buildCycle(cycle + 1), 0, f, false);
    }
    // Edges darker than center: flat-alpha bands, no gradients.
    ctx.fillStyle = COOL; ctx.globalAlpha = 0.55;
    ctx.fillRect(0, 0, W, H * 0.05); ctx.fillRect(0, H * 0.95, W, H * 0.05);
    ctx.fillRect(0, 0, W * 0.05, H); ctx.fillRect(W * 0.95, 0, W * 0.05, H);
    // The void: top-right corner kept nearly pure black.
    ctx.globalAlpha = 0.92; ctx.fillRect(W * 0.74, 0, W * 0.26, H * 0.24);
    ctx.globalAlpha = 0.55; ctx.fillRect(W * 0.70, 0, W * 0.04, H * 0.24);
    ctx.fillRect(W * 0.74, H * 0.24, W * 0.26, H * 0.04);
    ctx.globalAlpha = 1;
  }

  // Frame one is exactly t = 0, via the boot flag. The clock starts only
  // with the rAF loop.
  var booted = false;
  var startMs = 0;
  function frame(nowMs) {
    if (!booted) { booted = true; startMs = nowMs; }
    var t = (nowMs - startMs) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  }
  draw(0);

  var startX = 0, startY = 0, dragging = false;
  function onDown(x, y) { dragging = true; startX = x; startY = y; }
  function onMove(x, y) {
    if (!dragging) return;
    var dx = x - startX, dy = y - startY;
    if (Math.abs(dx) + Math.abs(dy) < 8) return;
    var now = booted ? (performance.now() - startMs) / 1000 : 0;
    drags.push({ t: now, ang: Math.atan2(dy, dx) - Math.PI / 4 });
    startX = x; startY = y;
  }
  function onUp() { dragging = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX, e.clientY); });
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  function onResize() {
    var t = 0;
    if (booted && typeof performance !== 'undefined' && performance.now) t = (performance.now() - startMs) / 1000;
    size(); draw(t);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', onResize);
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
