<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfect Symmetry</title>
<style>
html, body { margin: 0; padding: 0; background: #08080C; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var STAGE = [8, 8, 12];
var GRID = [26, 26, 36];
var YELLOW = [255, 210, 63];
var CYAN = [0, 229, 255];
var MAGENTA = [255, 61, 127];
var TEXT = [220, 220, 228];
var PHASE = 20.0;
var CYCLE_S = 12.0;
var SEED = 1605001;
var BAND_COLORS = [YELLOW, CYAN, MAGENTA, YELLOW, CYAN];
var BAND_FREQ = [110, 165, 220, 275, 330];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}

/* ---- one seeded signal, computed once per frame ----
   Five bands share one layered sine + noise source. Per band:
   amplitude envelope -> band width; spectral centroid -> fold count.
   The audio chain uses the same seeded phases and frequency ratios,
   so picture and sound cannot drift apart. */
var SIG = (function () {
  var rng = mulberry32(SEED);
  var phases = [], i;
  for (i = 0; i < 5; i++) phases.push(rng() * TAU);
  var noisePh = [rng() * TAU, rng() * TAU, rng() * TAU, rng() * TAU, rng() * TAU];
  return { phases: phases, noisePh: noisePh };
})();
function bandSignal(i, t) {
  var p = SIG.phases[i];
  /* layered sines: fundamental plus second and third harmonics */
  var s = Math.sin(TAU * 0.045 * (i + 1) * t + p)
    + 0.5 * Math.sin(TAU * 0.09 * (i + 1) * t + p * 1.7)
    + 0.25 * Math.sin(TAU * 0.135 * (i + 1) * t + p * 2.3);
  s = s / 1.75;
  /* deterministic noise shimmer, same seed family as the sines */
  var n = Math.sin(t * 7.3 + SIG.noisePh[i]) * Math.sin(t * 3.7 + SIG.noisePh[i] * 0.5);
  var amp = clamp(0.5 + 0.42 * s + 0.08 * n, 0.08, 1);
  /* spectral centroid: slow drift between low and high harmonics */
  var cent = clamp(0.5 + 0.5 * Math.sin(TAU * 0.021 * (i + 2) * t + p * 0.9), 0, 1);
  var folds = 2 + Math.floor(cent * 5.999);
  return { amp: amp, cent: cent, folds: folds };
}
function drawGrid() {
  var stepX = VW / 24, stepY = VH / 24, i;
  ctx.strokeStyle = rgba(GRID, 0.8);
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (i = 1; i < 24; i++) {
    ctx.moveTo(i * stepX, 0);
    ctx.lineTo(i * stepX, VH);
  }
  for (i = 1; i < 24; i++) {
    ctx.moveTo(0, i * stepY);
    ctx.lineTo(VW, i * stepY);
  }
  ctx.stroke();
}
function drawBand(i, t, top, slotH) {
  var sig = bandSignal(i, t);
  var col = BAND_COLORS[i];
  var cy = top + slotH * (i + 0.5);
  var maxH = slotH * 0.62;
  var thick = Math.max(2, maxH * sig.amp);
  var folds = sig.folds;
  var ph = SIG.phases[i];
  var x, y, k;
  /* staff lines: the stave the band sits on */
  ctx.strokeStyle = rgba(GRID, 1);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, cy - slotH * 0.42);
  ctx.lineTo(VW, cy - slotH * 0.42);
  ctx.moveTo(0, cy + slotH * 0.42);
  ctx.lineTo(VW, cy + slotH * 0.42);
  ctx.stroke();
  /* the band itself: width is amplitude, folds are harmonic content */
  ctx.fillStyle = rgba(col, 0.16 + 0.10 * sig.cent);
  ctx.beginPath();
  for (x = 0; x <= VW; x += 8) {
    k = x / VW;
    var wob = 0.55 + 0.45 * Math.sin(TAU * folds * k + ph);
    y = cy - thick * 0.5 * wob;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  for (x = VW; x >= 0; x -= 8) {
    k = x / VW;
    var wob2 = 0.55 + 0.45 * Math.sin(TAU * folds * k + ph);
    y = cy + thick * 0.5 * wob2;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  /* the tone line: the scored signal running down the middle */
  ctx.strokeStyle = rgba(col, 0.95);
  ctx.lineWidth = Math.max(1.5, thick * 0.10);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (x = 0; x <= VW; x += 6) {
    k = x / VW;
    y = cy + Math.sin(TAU * folds * k + ph) * thick * 0.28;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  /* fold ticks: one marker per fold, sitting on the wave crests
     (crest when TAU*folds*k + ph = PI/2 + 2*PI*m) */
  ctx.fillStyle = rgba(col, 0.9);
  ctx.beginPath();
  for (var f = 0; f < folds; f++) {
    var kk = (0.25 - ph / TAU + f) % folds;
    if (kk < 0) kk += folds;
    var fx = kk / folds * VW;
    var fy = cy + thick * 0.28;
    ctx.moveTo(fx + 5, fy);
    ctx.arc(fx, fy, 5, 0, TAU);
  }
  ctx.fill();
}
function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = 'rgb(' + STAGE[0] + ',' + STAGE[1] + ',' + STAGE[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  drawGrid();
  /* staves: 60 percent of frame height, centered, full bleed */
  var regionH = VH * 0.60;
  var top = (VH - regionH) / 2;
  var slotH = regionH / 5;
  var i;
  for (i = 0; i < 5; i++) drawBand(i, t, top, slotH);
  /* playhead: where the score is now, one 12 second cycle */
  var px = (((t % CYCLE_S) + CYCLE_S) % CYCLE_S) / CYCLE_S * VW;
  ctx.strokeStyle = rgba(TEXT, 0.35);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px, top - 6);
  ctx.lineTo(px, top + regionH + 6);
  ctx.stroke();
  var titlePx = isPhone ? 16 : 18;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(TEXT, 0.85);
  ctx.fillText('Perfect Symmetry', VW / 2, Math.max(8, VH * 0.02));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(TEXT, 0.5);
  ctx.fillText('2006 · 06 · 04', VW / 2, Math.max(8, VH * 0.02) + titlePx + 6);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(TEXT, 0.6);
  ctx.fillText('Tap once to hear it.', VW / 2, VH - smallPx - 12);
}

/* ---- audio: the same signal, heard. Lazily created inside the tap
   gesture only, never autoplay. The tap toggles the audio context
   and nothing else; the visuals never change on tap. No UI. ---- */
var audioCtx = null;
var audioMaster = null;
var audioOn = false;
function audioCtor() {
  if (typeof window !== 'undefined' && typeof window.AudioContext !== 'undefined') return window.AudioContext;
  if (typeof window !== 'undefined' && typeof window.webkitAudioContext !== 'undefined') return window.webkitAudioContext;
  if (typeof AudioContext !== 'undefined') return AudioContext;
  return null;
}
function buildAudio() {
  var AC = audioCtor();
  if (!AC) return false;
  try {
    audioCtx = new AC();
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 2400;
    audioMaster = audioCtx.createGain();
    audioMaster.gain.value = 0;
    filter.connect(audioMaster);
    audioMaster.connect(audioCtx.destination);
    var i, osc, g;
    for (i = 0; i < 5; i++) {
      osc = audioCtx.createOscillator();
      osc.type = (i % 2 === 0) ? 'sine' : 'triangle';
      osc.frequency.value = BAND_FREQ[i];
      g = audioCtx.createGain();
      g.gain.value = 0.16;
      osc.connect(g);
      g.connect(filter);
      osc.start();
    }
    return true;
  } catch (e) {
    audioCtx = null;
    audioMaster = null;
    return false;
  }
}
function toggleAudio() {
  if (!audioCtx) {
    if (!buildAudio()) return;
  }
  if (!audioCtx) return;
  try {
    if (audioOn) {
      audioMaster.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
      if (typeof audioCtx.suspend === 'function') audioCtx.suspend();
      audioOn = false;
    } else {
      if (typeof audioCtx.resume === 'function') audioCtx.resume();
      audioMaster.gain.setTargetAtTime(0.5, audioCtx.currentTime, 0.1);
      audioOn = true;
    }
  } catch (e) { /* audio stays silent; visuals unaffected */ }
}
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('pointerdown', toggleAudio);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof window !== 'undefined') {
  window.__perfect1605 = { draw: draw, bandSignal: bandSignal, toggleAudio: toggleAudio };
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
