<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Archive of Defiant Muses</title>
<style>
html, body { margin: 0; padding: 0; background: #e8e0d0; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1471000);

var WALL = '#e8e0d0', WOOD = '#6b4a2f', GLOW = '#e8a33d', VIEWER = '#2a2a30';
var TAPE_COLORS = ['#2e6f6a', '#c1272d', '#d9a441', '#5b2a4a', '#6b7686'];
var COLS = 10, ROWS = 4, TOTAL = 40;
var FILL_EVERY = 6, BASE_COUNT = 14, PLAY_EVERY = 8;

var tapes = [];
for (var i = 0; i < TOTAL; i++) {
  tapes.push({
    color: TAPE_COLORS[Math.floor(rng() * 5)],
    loop: Math.floor(rng() * 7),
    pulled: false, held: false, px: 0, py: 0, gx: 0, gy: 0
  });
}
var lastPulled = null;
var startT = null;

function layout() {
  var vw = 0, vh = 0;
  var vv = null;
  if (typeof visualViewport !== 'undefined' && visualViewport) vv = visualViewport;
  else if (typeof window !== 'undefined' && window && window.visualViewport) vv = window.visualViewport;
  if (vv) {
    vw = vv.width; vh = vv.height;
  }
  if (!vw && typeof window !== 'undefined' && window) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  W = vw; H = vh;
  canvas.width = W; canvas.height = H;
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window && window.screen) {
    sw = window.screen.width; sh = window.screen.height;
  }
  if (sw > 0 && sh > 0) PHONE = Math.min(sw, sh) < 700;
  else PHONE = H > W * 1.15;
}

function geom() {
  var mX = W * 0.04, top = H * 0.03;
  var shelfH = H * 0.66;
  var boardH = Math.max(6, H * 0.012);
  var gapX = W * 0.012, gapY = H * 0.02;
  var slotW = (W - 2 * mX - (COLS - 1) * gapX) / COLS;
  var slotH = (shelfH - top - ROWS * boardH - (ROWS - 1) * gapY) / ROWS;
  return { mX: mX, top: top, boardH: boardH, gapX: gapX, gapY: gapY, slotW: slotW, slotH: slotH };
}
function slotRect(i, g) {
  var r = Math.floor(i / COLS), c = i % COLS;
  return {
    x: g.mX + c * (g.slotW + g.gapX),
    y: g.top + r * (g.slotH + g.boardH + g.gapY),
    w: g.slotW, h: g.slotH
  };
}
function tapeRect(i, g) {
  var s = slotRect(i, g);
  var tw = s.w * 0.72, th = s.h * 0.86;
  return { x: s.x + (s.w - tw) / 2, y: s.y + s.h - th, w: tw, h: th };
}
function currentRect(i, g) {
  var t = tapes[i];
  if (t.pulled || t.held) {
    var tw = 0, th = 0;
    var s = slotRect(i, g);
    tw = s.w * 0.72; th = s.h * 0.86;
    if (t.held) { tw *= 1.15; th *= 1.15; }
    return { x: t.px, y: t.py, w: tw, h: th };
  }
  return tapeRect(i, g);
}

function presentCount(t) {
  var n = BASE_COUNT + Math.floor(t / FILL_EVERY);
  return n > TOTAL ? TOTAL : n;
}
function playingIndex(t) {
  var pc = presentCount(t);
  if (pc <= 0) return -1;
  return Math.floor(t / PLAY_EVERY) % pc;
}
function currentLoop(t) {
  if (lastPulled) return lastPulled.loop;
  var pi = playingIndex(t);
  if (pi >= 0) return tapes[pi].loop;
  return 0;
}
function currentTapeColor(t) {
  if (lastPulled) return lastPulled.color;
  var pi = playingIndex(t);
  if (pi >= 0) return tapes[pi].color;
  return TAPE_COLORS[0];
}

function R(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}
function D(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawTape(i, g) {
  var t = tapes[i];
  var r = currentRect(i, g);
  R(r.x, r.y, r.w, r.h, t.color);
  var sw = Math.max(2, r.w * 0.08);
  R(r.x + r.w * 0.12, r.y + r.h * 0.08, sw, r.h * 0.84, WALL);
}

function drawMini(id, t, vx, vy, vw, vh) {
  var lt = t % 12;
  var cx = vx + vw / 2, cy = vy + vh / 2;
  var u = Math.min(vw, vh);
  if (id === 0) {
    // DS1 walk: small figure on a rectangular circuit
    var p = (lt / 8) % 1, per = 2 * (vw * 0.6 + vh * 0.5);
    var d = p * per, fx = 0, fy = 0;
    var rw = vw * 0.6, rh = vh * 0.5, x0 = vx + vw * 0.2, y0 = vy + vh * 0.25;
    if (d < rw) { fx = x0 + d; fy = y0; }
    else if (d < rw + rh) { fx = x0 + rw; fy = y0 + (d - rw); }
    else if (d < 2 * rw + rh) { fx = x0 + rw - (d - rw - rh); fy = y0 + rh; }
    else { fx = x0; fy = y0 + rh - (d - 2 * rw - rh); }
    ctx.globalAlpha = 0.5;
    R(x0, y0, rw, 2, WALL);
    ctx.globalAlpha = 1;
    D(fx, fy - 6, 4, WALL);
    R(fx - 3, fy - 4, 6, 10, '#6b7686');
  } else if (id === 1) {
    // DS2 chore: figure at a table, arm oscillating
    var ay = Math.sin(t * 2.4) * 3;
    R(cx - 30, cy + 8, 60, 4, WOOD);
    D(cx - 10, cy - 8, 5, WALL);
    R(cx - 14, cy - 4, 8, 14, '#2e6f6a');
    R(cx + 2, cy - 2 + ay, 12, 3, WALL);
  } else if (id === 2) {
    // DS3 drift: figure with two fainter lagging reflections
    var dx = Math.sin(t * 0.5) * vw * 0.25;
    var bx = cx + dx;
    ctx.globalAlpha = 0.25;
    D(bx - 20, cy - 8, 5, WALL); R(bx - 24, cy - 4, 8, 14, WALL);
    ctx.globalAlpha = 0.5;
    D(bx - 10, cy - 8, 5, WALL); R(bx - 14, cy - 4, 8, 14, WALL);
    ctx.globalAlpha = 1;
    D(bx, cy - 8, 5, WALL); R(bx - 4, cy - 4, 8, 14, WALL);
  } else if (id === 3) {
    // DS4 swap: costume colour changes instantly every 3 s
    var cols = ['#c1272d', '#d9a441', '#2e6f6a', '#5b2a4a'];
    var cc = cols[Math.floor(t / 3) % 4];
    D(cx, cy - 10, 6, WALL);
    R(cx - 8, cy - 4, 16, 18, cc);
  } else if (id === 4) {
    // DS5 grid: tiny faces, one gold-outlined speaker
    var sp = Math.floor(t / 2.5) % 12;
    var gw = vw * 0.7, gh = vh * 0.7;
    var cw = gw / 4, ch = gh / 3, gx0 = vx + vw * 0.15, gy0 = vy + vh * 0.15;
    for (var k = 0; k < 12; k++) {
      var kx = gx0 + (k % 4) * cw, ky = gy0 + Math.floor(k / 4) * ch;
      if (k === sp) {
        ctx.fillStyle = GLOW;
        ctx.fillRect(kx + 1, ky + 1, cw - 2, ch - 2);
      }
      R(kx + 3, ky + 3, cw - 6, ch - 6, VIEWER);
      D(kx + cw / 2, ky + ch / 2 - 1, 7, WALL);
      R(kx + cw / 2 - 3, ky + ch / 2 - 5, 6, 1, VIEWER);
      R(kx + cw / 2 - 2, ky + ch / 2 + 3, 4, 1, VIEWER);
    }
  } else if (id === 5) {
    // DS6 broadcast: teal studio backdrop, rows of suited shapes, gold line sweeps at the close
    R(vx, vy, vw, vh, '#2e6f6a');
    for (var rr = 0; rr < 3; rr++) {
      for (var cc2 = 0; cc2 < 5; cc2++) {
        var sx = vx + vw * 0.15 + cc2 * vw * 0.14;
        var sy = vy + vh * 0.2 + rr * vh * 0.22;
        D(sx, sy, 4, WALL);
        R(sx - 4, sy + 4, 8, 10, '#2a2a30');
      }
    }
    if (lt > 10) {
      var lx = vx + ((lt - 10) / 2) * vw;
      R(vx, cy, lx - vx, 2, GLOW);
    }
  } else {
    // DS7 cutting room: reader + tiny TV jump-cutting abstract scenes
    D(cx - 30, cy - 8, 5, WALL);
    R(cx - 34, cy - 4, 8, 14, '#c1272d');
    var tvx = cx + 5, tvy = cy - 6, tvw = vw * 0.3, tvh = vh * 0.4;
    R(tvx, tvy, tvw, tvh, '#6b7686');
    var sc = Math.floor(t / 3) % 3;
    if (sc === 0) {
      for (var b = 0; b < 4; b++) R(tvx + 3 + b * (tvw / 4), tvy + tvh - 8 - (b % 2) * 4, tvw / 5, 6, WALL);
    } else if (sc === 1) {
      R(tvx + 3, tvy + tvh / 2, tvw - 6, 2, GLOW);
      R(tvx + tvw - 8, tvy + 3, 4, tvh - 6, WALL);
    } else {
      R(tvx + 2, tvy + 2, tvw - 4, 2, WALL);
      R(tvx + 2, tvy + tvh - 4, tvw - 4, 2, WALL);
    }
    if ((t % 3) < 0.1) R(tvx, tvy, tvw, tvh, WALL);
  }
}

function drawViewer(t, g) {
  var vx = W * 0.04, vy = H * 0.68, vw = W * 0.92, vh = H * 0.30;
  R(vx, vy, vw, vh, VIEWER);
  R(vx + 6, vy + 6, 12, 12, currentTapeColor(t));
  drawMini(currentLoop(t), t, vx + vw * 0.12, vy + vh * 0.08, vw * 0.76, vh * 0.84);
}

function draw(t) {
  if (typeof t !== 'number' || isNaN(t)) t = 0;
  layout();
  var g = geom();
  R(0, 0, W, H, WALL);
  ctx.fillStyle = WOOD;
  for (var r = 0; r < ROWS; r++) {
    var y = g.top + r * (g.slotH + g.boardH + g.gapY) + g.slotH;
    ctx.fillRect(g.mX, y, W - 2 * g.mX, g.boardH);
  }
  var pc = presentCount(t);
  var pi = playingIndex(t);
  if (pi >= 0) {
    var pr = tapeRect(pi, g);
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = GLOW;
    ctx.fillRect(pr.x - 4, pr.y - 4, pr.w + 8, pr.h + 8);
    ctx.globalAlpha = 1;
  }
  for (var i = 0; i < pc; i++) {
    if (!tapes[i].held) drawTape(i, g);
  }
  drawViewer(t, g);
  for (var j = 0; j < pc; j++) {
    if (tapes[j].held) drawTape(j, g);
  }
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}

function hitTape(x, y, t, g) {
  var pc = presentCount(t);
  for (var i = pc - 1; i >= 0; i--) {
    var r = currentRect(i, g);
    if (x >= r.x - 4 && x <= r.x + r.w + 4 && y >= r.y - 4 && y <= r.y + r.h + 4) return i;
  }
  return -1;
}
var heldIndex = -1, grabDX = 0, grabDY = 0, lastT = 0;

function pointerDown(x, y) {
  var g = geom();
  var idx = hitTape(x, y, lastT, g);
  if (idx < 0) return;
  heldIndex = idx;
  var tp = tapes[idx];
  // Measure the grab rect BEFORE setting held: currentRect switches to the
  // px/py position once held, and a fresh tape still sits at (0, 0).
  var r = currentRect(idx, g);
  tp.held = true;
  grabDX = x - r.x; grabDY = y - r.y;
  if (!tp.pulled) { tp.px = r.x; tp.py = r.y; }
}
function pointerMove(x, y) {
  if (heldIndex < 0) return;
  var tp = tapes[heldIndex];
  var g = geom();
  var s = slotRect(heldIndex, g);
  var tw = s.w * 0.72 * 1.15, th = s.h * 0.86 * 1.15;
  tp.px = Math.max(0, Math.min(W - tw, x - grabDX));
  tp.py = Math.max(0, Math.min(H - th, y - grabDY));
}
function pointerUp(x, y) {
  if (heldIndex < 0) return;
  var idx = heldIndex;
  var tp = tapes[idx];
  var g = geom();
  var s = slotRect(idx, g);
  // Measure the dragged rect BEFORE clearing held: while held, the tape is
  // drawn enlarged at px/py, so currentRect would snap back to the slot.
  var tw = s.w * 0.72 * 1.15, th = s.h * 0.86 * 1.15;
  var dcx = (tp.px + tw / 2) - (s.x + s.w / 2);
  var dcy = (tp.py + th / 2) - (s.y + s.h / 2);
  var dist = Math.sqrt(dcx * dcx + dcy * dcy);
  tp.held = false;
  heldIndex = -1;
  if (!tp.pulled && dist > g.slotH * 1.0) {
    tp.pulled = true;
    lastPulled = tp;
  } else if (tp.pulled && dist < g.slotH * 0.9) {
    tp.pulled = false;
    if (lastPulled === tp) {
      lastPulled = null;
      for (var i = 0; i < TOTAL; i++) {
        if (tapes[i].pulled) lastPulled = tapes[i];
      }
    }
  }
}

function onDown(e) {
  var x = (typeof e.offsetX !== 'undefined') ? e.offsetX : e.clientX;
  var y = (typeof e.offsetY !== 'undefined') ? e.offsetY : e.clientY;
  pointerDown(x, y);
}
function onMove(e) {
  var x = (typeof e.offsetX !== 'undefined') ? e.offsetX : e.clientX;
  var y = (typeof e.offsetY !== 'undefined') ? e.offsetY : e.clientY;
  pointerMove(x, y);
}
function onUp(e) {
  var x = (typeof e.offsetX !== 'undefined') ? e.offsetX : e.clientX;
  var y = (typeof e.offsetY !== 'undefined') ? e.offsetY : e.clientY;
  pointerUp(x, y);
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
}

function loop(ts) {
  if (typeof ts !== 'number') ts = 0;
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  lastT = t;
  draw(t);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
draw(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

if (typeof window !== 'undefined' && window) {
  window.__piece = {
    draw: function (t) { lastT = t; draw(t); },
    down: pointerDown, move: pointerMove, up: pointerUp,
    presentCount: presentCount, playingIndex: playingIndex,
    currentLoop: currentLoop, currentTapeColor: currentTapeColor,
    tapes: tapes
  };
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  var vv2 = null;
  if (typeof visualViewport !== 'undefined' && visualViewport) vv2 = visualViewport;
  else if (window.visualViewport) vv2 = window.visualViewport;
  if (vv2 && vv2.addEventListener) {
    vv2.addEventListener('resize', function () { draw(lastT); });
  }
}
})();
</script>
</body>
</html>
