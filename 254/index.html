<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.254 Chaos Poster</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#111111; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.254 Chaos Poster (tanzinchospel.art). After his 2024
// purple bomb posters CHAOS* / LITTLE BOY / FAT MAN: a
// monochrome violet graphic poster, one emblematic dome
// fragment at centre, smoke churning behind it, museum
// label typography below, the chaos compound small at
// top right, one caption line at the bottom. One hue
// family only, purple on purple. The type is the artwork.
// Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#3D1B5E', MID = '#8E63B8', HI = '#C9A9E8', TEXT = '#EDE6F5', BLACK = '#111111';
var PW = 400, PH = 500; // the poster, 4:5
var W = 0, H = 0, phone = false;
var T = 13.0, lastNow = -1; // frame one: the smoke already developed
var GROTESK = '"Liberation Sans Narrow", "Arial Narrow", "Liberation Sans", sans-serif';
var CJK = '"Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif';

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// text with letter tracking, centred on cx
function tracked(text, cx, y, font, tracking, colour) {
  ctx.font = font;
  ctx.fillStyle = colour;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  var widths = [], total = 0;
  for (var i = 0; i < text.length; i++) {
    var w = ctx.measureText(text[i]).width;
    widths.push(w);
    total += w + (i < text.length - 1 ? tracking : 0);
  }
  var x = cx - total / 2;
  for (var j = 0; j < text.length; j++) {
    ctx.fillText(text[j], x, y);
    x += widths[j] + tracking;
  }
}

// ---- smoke: three layers of seeded blob clusters, advected -------------------------
var smokeLayers = [];
(function () {
  var r = rng(25417);
  var defs = [
    { col: BLACK, a: 0.20, n: 7, rad: 52, drift: 15, sp: 0.050 },
    { col: MID,   a: 0.16, n: 8, rad: 40, drift: 21, sp: 0.073 },
    { col: HI,    a: 0.07, n: 6, rad: 27, drift: 27, sp: 0.104 }
  ];
  defs.forEach(function (d, li) {
    var blobs = [];
    for (var i = 0; i < d.n; i++) {
      var ang = (i / d.n) * Math.PI * 2 + r() * 0.8;
      var dist = 26 + r() * 74;
      blobs.push({
        bx: 200 + Math.cos(ang) * dist, by: 182 + Math.sin(ang) * dist * 0.78,
        br: d.rad * (0.6 + r() * 0.75), ph: r() * Math.PI * 2, ph2: r() * Math.PI * 2
      });
    }
    smokeLayers.push({ col: d.col, a: d.a, drift: d.drift, sp: d.sp, blobs: blobs });
  });
})();
function drawSmoke() {
  smokeLayers.forEach(function (layer) {
    ctx.fillStyle = rgba(layer.col, layer.a);
    layer.blobs.forEach(function (b) {
      var x = b.bx + Math.sin(T * layer.sp * 2 + b.ph) * layer.drift;
      var y = b.by + Math.cos(T * layer.sp * 1.6 + b.ph2) * layer.drift * 0.6;
      var rr = b.br * (1 + 0.10 * Math.sin(T * layer.sp * 3 + b.ph));
      ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
    });
  });
}

// ---- the dome fragment: flat facets and a broken base --------------------------------
var baseJag = [];
(function () {
  var r = rng(25431);
  for (var i = 0; i <= 8; i++) baseJag.push(214 + r() * 20 - (i === 4 ? 9 : 0));
})();
function drawDome() {
  var cx = 200, cy = 208, R = 104;
  // ground shadow
  ctx.fillStyle = rgba(BLACK, 0.35);
  ctx.beginPath(); ctx.ellipse(cx, 240, 116, 11, 0, 0, Math.PI * 2); ctx.fill();
  // facets: vertical slices of the hemisphere, flat tones
  var slices = 7;
  for (var i = 0; i < slices; i++) {
    var a0 = Math.PI + (i / slices) * Math.PI;
    var a1 = Math.PI + ((i + 1) / slices) * Math.PI;
    var xm = Math.cos((a0 + a1) / 2);
    var tone = 0.5 + xm * 0.42; // lit from the right
    ctx.fillStyle = mix(GROUND, HI, 0.25 + tone * 0.5);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a0, a1);
    ctx.closePath(); ctx.fill();
  }
  // the broken base: below the diameter, a jagged shard edge
  ctx.fillStyle = mix(GROUND, MID, 0.55);
  ctx.beginPath();
  ctx.moveTo(cx - R, cy);
  for (var j = 0; j <= 8; j++) ctx.lineTo(cx - R + (j / 8) * R * 2, baseJag[j]);
  ctx.lineTo(cx + R, cy);
  ctx.closePath(); ctx.fill();
  // facet seams: short ticks at the rim and one inner arc,
  // so the dome reads faceted, not fanned
  ctx.strokeStyle = rgba(GROUND, 0.55);
  ctx.lineWidth = 1.4;
  for (var k = 1; k < slices; k++) {
    var a = Math.PI + (k / slices) * Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * R * 0.80, cy + Math.sin(a) * R * 0.80);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.58, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.30, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  // rim light along the right arc
  ctx.strokeStyle = rgba(HI, 0.95);
  ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.arc(cx, cy, R - 2, -Math.PI * 0.46, Math.PI * 0.06); ctx.stroke();
  // one dark crater facet
  ctx.fillStyle = rgba(BLACK, 0.5);
  ctx.beginPath(); ctx.arc(cx - 34, cy - 44, 13, 0, Math.PI * 2); ctx.fill();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, PW, PH);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, PW, PH); ctx.clip();
  drawSmoke();
  drawDome();
  ctx.restore();
  // hairline poster rule
  ctx.strokeStyle = rgba(MID, 0.6);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(7.5, 7.5, PW - 15, PH - 15);

  // the chaos compound, small at top right
  ctx.font = '27px ' + CJK;
  ctx.fillStyle = HI;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('混沌', 348, 40);

  // title and museum label
  tracked('CHAOS*', 200, 322, '700 43px ' + GROTESK, 7, TEXT);
  ctx.fillStyle = rgba(MID, 0.9);
  ctx.fillRect(96, 344, 208, 1.6);
  tracked('STUDY IN PURPLE, NO. 1', 200, 366, '15px ' + GROTESK, 2.6, rgba(TEXT, 0.88));
  tracked('REALTIME RENDER, SINGLE PASS', 200, 388, '15px ' + GROTESK, 2.6, rgba(TEXT, 0.88));
  tracked('LADAKH / 2024', 200, 410, '15px ' + GROTESK, 2.6, rgba(TEXT, 0.88));
  // one caption line at the bottom
  tracked('rendered in real time, regretted at leisure.', 200, 468, '14px ' + GROTESK, 0.8, rgba(TEXT, 0.72));
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, W, H);
  // the poster keeps its 4:5, centred, black around it
  var S = Math.min(W / PW, H / PH) * 0.965;
  ctx.setTransform(S, 0, 0, S, (W - PW * S) / 2, (H - PH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
