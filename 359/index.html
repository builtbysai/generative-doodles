<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.359 Six Colorways</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5EEDC; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.359 Six Colorways (betterloveart).
// After Suchita Prakash's colourway merchandising habit: one hero
// motif set (sunflower + moth + oak spray) rendered six times as a
// 3x2 contact sheet, each cell in a different flat palette from her
// caption-grounded list. The hero set is JS data, generated once per
// sheet from a fixed authored set table (4 sets); the palettes are a
// fixed table of exactly 6. Cells breathe gently in place on a
// shared seamless 24s loop (LOOP): a scale breath per cell on its
// own phase, the moth's wings flapping on 3 whole cycles per loop,
// the sunflower swaying on 1, so frame 24s is pixel-identical to
// frame 0 at rest. TAP a cell promotes that colourway to full-bleed
// (that colourway becomes the piece); DOUBLE-TAP on the full view
// returns to the sheet with the next hero set from the table, and
// DOUBLE-TAP on the sheet itself also advances the hero set. A
// single tap is held for the full 350ms double-tap window before it
// commits, so a double-tap never half-promotes a cell. Flat colour
// only, one canvas, no labels, no text, no chrome.
// Determinism: the first frame is drawn synchronously at the
// constant phase T = 5.7 (the SHEET, fully developed, breathing
// mid-cycle), never Date.now() minus an offset, and the animation
// advances from that anchor in fixed 1/60 ticks.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 24;
var TAU = Math.PI * 2;
var CREAM = '#F5EEDC';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 5.7, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- the six caption-grounded palettes, as data ------------------
// Roles: ground, petal (outer ring), inner (inner ring), disc, dot
// (disc seeds and wing spots, usually the ground knocked out), moth,
// leaf, stem, acorn, cap. Single-ink colourways (2, 3, 4) put every
// motif role on the one ink and knock details out in the ground.
var PALETTES = [
  // 1 amber / berry / forest on cream
  { ground: '#F5EEDC', petal: '#E8A93D', inner: '#A61C3C', disc: '#A61C3C', dot: '#F5EEDC', moth: '#2E5B3F', leaf: '#2E5B3F', stem: '#2E5B3F', acorn: '#E8A93D', cap: '#A61C3C' },
  // 2 neon pink on black
  { ground: '#0D0D12', petal: '#FF2E88', inner: '#FF2E88', disc: '#FF2E88', dot: '#0D0D12', moth: '#FF2E88', leaf: '#FF2E88', stem: '#FF2E88', acorn: '#FF2E88', cap: '#FF2E88' },
  // 3 cobalt / white
  { ground: '#274C9B', petal: '#F7FAFF', inner: '#F7FAFF', disc: '#F7FAFF', dot: '#274C9B', moth: '#F7FAFF', leaf: '#F7FAFF', stem: '#F7FAFF', acorn: '#F7FAFF', cap: '#F7FAFF' },
  // 4 beetroot / carrot
  { ground: '#6E2B5B', petal: '#E07B39', inner: '#E07B39', disc: '#E07B39', dot: '#6E2B5B', moth: '#E07B39', leaf: '#E07B39', stem: '#E07B39', acorn: '#E07B39', cap: '#E07B39' },
  // 5 wheat / denim / clay
  { ground: '#E3C878', petal: '#B96A4B', inner: '#7A93A6', disc: '#7A93A6', dot: '#E3C878', moth: '#B96A4B', leaf: '#7A93A6', stem: '#7A93A6', acorn: '#B96A4B', cap: '#7A93A6' },
  // 6 plum / ink / parchment
  { ground: '#3D2B45', petal: '#E8DCC3', inner: '#E8DCC3', disc: '#14141C', dot: '#E8DCC3', moth: '#E8DCC3', leaf: '#E8DCC3', stem: '#E8DCC3', acorn: '#E8DCC3', cap: '#14141C' }
];
if (PALETTES.length !== 6) throw new Error('Six Colorways needs exactly 6 palettes');

// ---- the hero motif sets, as data ---------------------------------
// Positions are unit coords inside the hero box; sun.r and moth.s
// are fractions of the box's smaller side. The same set is drawn in
// every cell; only the palette changes. Oak is a quadratic stem
// (p0, p1, p2) with alternating scalloped leaves and hanging acorns.
var SETS = [
  { sun: { x: 0.33, y: 0.35, r: 0.295, petals: 12 }, moth: { x: 0.75, y: 0.29, s: 0.205, tilt: -0.12 },
    oak: { p0: [0.08, 0.96], p1: [0.30, 0.50], p2: [0.68, 0.74], leaves: 5, acorns: 2 } },
  { sun: { x: 0.65, y: 0.33, r: 0.255, petals: 10 }, moth: { x: 0.25, y: 0.27, s: 0.175, tilt: 0.16 },
    oak: { p0: [0.90, 0.96], p1: [0.64, 0.48], p2: [0.28, 0.72], leaves: 4, acorns: 3 } },
  { sun: { x: 0.50, y: 0.30, r: 0.275, petals: 14 }, moth: { x: 0.19, y: 0.64, s: 0.165, tilt: 0.28 },
    oak: { p0: [0.52, 0.99], p1: [0.74, 0.68], p2: [0.95, 0.58], leaves: 4, acorns: 2 } },
  { sun: { x: 0.27, y: 0.44, r: 0.235, petals: 11 }, moth: { x: 0.71, y: 0.60, s: 0.225, tilt: -0.22 },
    oak: { p0: [0.05, 0.26], p1: [0.32, 0.04], p2: [0.70, 0.15], leaves: 5, acorns: 2 } }
];
if (SETS.length < 2) throw new Error('Six Colorways needs a hero set table');

// ---- sheet geometry ------------------------------------------------
var MARGIN = 40, GUT = 14;
var SHEETW = DW - MARGIN * 2, SHEETH = DH - MARGIN * 2;
var CELLW = (SHEETW - GUT * 2) / 3, CELLH = (SHEETH - GUT) / 2;
var PAD = 26;
function cellRect(i) {
  var col = i % 3, row = Math.floor(i / 3);
  return { x: MARGIN + col * (CELLW + GUT), y: MARGIN + row * (CELLH + GUT), w: CELLW, h: CELLH };
}

// ---- state ----------------------------------------------------------
var mode = 'sheet';           // 'sheet' or 'full'
var cellIdx = 0;              // promoted cell in full view
var setIdx = 0;               // current hero set
var pendingTap = null;        // { time, cell } held for the 350ms window
var downPos = null;

// ---- motif painters ---------------------------------------------------
// All marks are path data from the set table, drawn directly each
// frame on the single canvas. No offscreen canvas, no gradients,
// no shadowBlur, no filters.

function petal(L, Wd) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(Wd, -L * 0.45, 0, -L);
  ctx.quadraticCurveTo(-Wd, -L * 0.45, 0, 0);
  ctx.closePath();
  ctx.fill();
}

function drawSunflower(cx, cy, R, pal, rot) {
  var n = SETS[setIdx].sun.petals, i, a;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.fillStyle = pal.petal;
  for (i = 0; i < n; i++) {
    ctx.save();
    ctx.rotate((i / n) * TAU);
    petal(R, R * 0.30);
    ctx.restore();
  }
  ctx.fillStyle = pal.inner;
  for (i = 0; i < n; i++) {
    ctx.save();
    ctx.rotate(((i + 0.5) / n) * TAU);
    petal(R * 0.60, R * 0.24);
    ctx.restore();
  }
  ctx.fillStyle = pal.disc;
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.34, 0, TAU);
  ctx.fill();
  ctx.fillStyle = pal.dot;
  for (i = 0; i < 6; i++) {
    a = (i / 6) * TAU + 0.3;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * R * 0.19, Math.sin(a) * R * 0.19, R * 0.042, 0, TAU);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.05, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function disc(cx, cy, rx, ry, rot) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.scale(rx, ry);
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawMoth(cx, cy, s, pal, flap, tilt) {
  var side, wob = 0.86 + 0.14 * flap;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  ctx.fillStyle = pal.moth;
  for (side = -1; side <= 1; side += 2) {
    disc(side * s * 0.52, -s * 0.20, s * 0.56, s * 0.34 * wob, side * -0.5);
    disc(side * s * 0.44, s * 0.30, s * 0.42, s * 0.26 * wob, side * 0.6);
  }
  disc(0, 0.02 * s, s * 0.15, s * 0.42, 0);
  ctx.beginPath();
  ctx.arc(0, -s * 0.44, s * 0.115, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = pal.moth;
  ctx.lineWidth = s * 0.05;
  ctx.lineCap = 'round';
  for (side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.moveTo(side * s * 0.05, -s * 0.50);
    ctx.quadraticCurveTo(side * s * 0.30, -s * 0.78, side * s * 0.52, -s * 0.72);
    ctx.stroke();
    ctx.fillStyle = pal.moth;
    ctx.beginPath();
    ctx.arc(side * s * 0.52, -s * 0.72, s * 0.055, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = pal.dot;
  for (side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.arc(side * s * 0.52, -s * 0.12, s * 0.07, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawLeaf(L, Wd) {
  // A lobed oak leaf: a pointed blade with flat lobe circles merged
  // into the same fill, so the silhouette reads as one oak leaf.
  var lobes = [[0.28, 0.52], [0.55, 0.55], [0.80, 0.40]], j, s2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(L * 0.5, -Wd, L, 0);
  ctx.quadraticCurveTo(L * 0.5, Wd, 0, 0);
  ctx.closePath();
  ctx.fill();
  for (j = 0; j < lobes.length; j++) {
    for (s2 = -1; s2 <= 1; s2 += 2) {
      ctx.beginPath();
      ctx.arc(L * lobes[j][0], s2 * Wd * lobes[j][1], Wd * 0.42, 0, TAU);
      ctx.fill();
    }
  }
}

function qpt(p0, p1, p2, t) {
  var u = 1 - t;
  return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
          u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]];
}

function drawOak(box, set, pal, U) {
  var o = set.oak;
  var p0 = [box.x + o.p0[0] * box.w, box.y + o.p0[1] * box.h];
  var p1 = [box.x + o.p1[0] * box.w, box.y + o.p1[1] * box.h];
  var p2 = [box.x + o.p2[0] * box.w, box.y + o.p2[1] * box.h];
  var L = U * 0.20, j, t, pt, dx, dy, ang, side;
  ctx.strokeStyle = pal.stem;
  ctx.lineWidth = Math.max(3, U * 0.016);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(p0[0], p0[1]);
  ctx.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]);
  ctx.stroke();
  ctx.fillStyle = pal.leaf;
  for (j = 0; j < o.leaves; j++) {
    t = o.leaves === 1 ? 0.5 : 0.16 + 0.76 * (j / (o.leaves - 1));
    pt = qpt(p0, p1, p2, t);
    dx = 2 * (1 - t) * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]);
    dy = 2 * (1 - t) * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1]);
    ang = Math.atan2(dy, dx);
    side = (j % 2 === 0) ? 1 : -1;
    ctx.save();
    ctx.translate(pt[0], pt[1]);
    ctx.rotate(ang + side * 0.7);
    drawLeaf(L, L * 0.36);
    ctx.restore();
  }
  var ats = [0.50, 0.74, 0.90], r = U * 0.045;
  for (j = 0; j < o.acorns; j++) {
    pt = qpt(p0, p1, p2, ats[j]);
    ctx.strokeStyle = pal.stem;
    ctx.lineWidth = Math.max(2, U * 0.008);
    ctx.beginPath();
    ctx.moveTo(pt[0], pt[1]);
    ctx.lineTo(pt[0], pt[1] + r * 0.7);
    ctx.stroke();
    ctx.fillStyle = pal.acorn;
    disc(pt[0], pt[1] + r * 0.7 + r * 0.85, r * 0.82, r, 0);
    ctx.fillStyle = pal.cap;
    ctx.save();
    ctx.translate(pt[0], pt[1] + r * 0.7 + r * 0.85);
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.92, Math.PI, TAU);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

// The hero set inside a box, in one palette. phase staggers the
// breathing across cells; t is the piece clock.
function drawHero(box, pal, t, phase) {
  var set = SETS[setIdx];
  var U = Math.min(box.w, box.h);
  var sway = 0.03 * Math.sin(TAU * (t / LOOP) + phase);
  var flap = Math.sin(TAU * 3 * (t / LOOP) + phase * 2);
  drawSunflower(box.x + set.sun.x * box.w, box.y + set.sun.y * box.h, set.sun.r * U, pal, sway);
  drawMoth(box.x + set.moth.x * box.w, box.y + set.moth.y * box.h, set.moth.s * U, pal, flap, set.moth.tilt);
  drawOak(box, set, pal, U);
}

// ---- states ---------------------------------------------------------

function drawSheet(t) {
  var i, r, b, cx, cy;
  for (i = 0; i < 6; i++) {
    r = cellRect(i);
    ctx.fillStyle = PALETTES[i].ground;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    b = 1 + 0.028 * Math.sin(TAU * (t / LOOP) + i * TAU / 6);
    cx = r.x + r.w / 2; cy = r.y + r.h / 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(r.x, r.y, r.w, r.h);
    ctx.clip();
    ctx.translate(cx, cy);
    ctx.scale(b, b);
    ctx.translate(-cx, -cy);
    drawHero({ x: r.x + PAD, y: r.y + PAD, w: r.w - PAD * 2, h: r.h - PAD * 2 }, PALETTES[i], t, i * TAU / 6);
    ctx.restore();
  }
}

function drawFull(t) {
  var pal = PALETTES[cellIdx];
  var box = { x: 64, y: 54, w: DW - 128, h: DH - 108 };
  var b = 1 + 0.02 * Math.sin(TAU * (t / LOOP) + cellIdx * TAU / 6);
  ctx.save();
  ctx.translate(DW / 2, DH / 2);
  ctx.scale(b, b);
  ctx.translate(-DW / 2, -DH / 2);
  drawHero(box, pal, t, cellIdx * TAU / 6);
  ctx.restore();
}

function draw(t) {
  if (mode === 'full') drawFull(t); else drawSheet(t);
}

// ---- sizing -----------------------------------------------------------

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- tap: promote a colourway. double-tap: return / next set. --------
// A tap is a press that barely moves. The first tap is held: it only
// commits (cell promotion) once the 350ms double-tap window has fully
// passed inside the tick loop. A second tap landing inside the window
// cancels the held tap: on the full view it returns to the sheet
// with the next hero set; on the sheet it advances the hero set in
// place. A committed single tap on the full view does nothing.
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
function hitCell(p) {
  var i, r;
  for (i = 0; i < 6; i++) {
    r = cellRect(i);
    if (p.x >= r.x && p.x < r.x + r.w && p.y >= r.y && p.y < r.y + r.h) return i;
  }
  return -1;
}
canvas.addEventListener('pointerdown', function (e) {
  downPos = toDesign(e);
});
canvas.addEventListener('pointerup', function (e) {
  if (!downPos) return;
  var p = toDesign(e);
  var moved = Math.sqrt((p.x - downPos.x) * (p.x - downPos.x) + (p.y - downPos.y) * (p.y - downPos.y));
  downPos = null;
  if (moved > 14) return;
  if (pendingTap && T - pendingTap.time <= 0.35) {
    pendingTap = null;
    setIdx = (setIdx + 1) % SETS.length;
    mode = 'sheet';
  } else {
    pendingTap = { time: T, cell: mode === 'sheet' ? hitCell(p) : -1 };
  }
});
canvas.addEventListener('pointercancel', function () { downPos = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Centred fit: the sheet keeps its shape at any aspect, and the
  // page ground is the sheet cream. In the full view the promoted
  // colourway's own ground takes the whole page.
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = mode === 'full' ? PALETTES[cellIdx].ground : CREAM;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK;
    if (pendingTap && T - pendingTap.time > 0.35) {
      if (mode === 'sheet' && pendingTap.cell >= 0) {
        mode = 'full';
        cellIdx = pendingTap.cell;
      }
      pendingTap = null;
    }
    acc -= TICK; guard++;
  }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
})();
</script>
</body>
</html>
