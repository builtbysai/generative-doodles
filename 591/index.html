<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Dónde Estar?</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FAF7F0; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var INK = '#1A1A1A', PAPER = '#FAF7F0', RED = '#D42B1E', WASH = '#8A9AA8';

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry32(591071);

/* ---------- precomputed paper speckle (seeded data, drawn directly) ---------- */
var speckles = [];
for (var si = 0; si < 240; si++){
  speckles.push({ x: rng()*1000, y: rng()*1000, r: 0.8 + rng()*1.5, a: 0.03 + rng()*0.05 });
}

/* ---------- the between-space: precomputed blue-grey wash blobs (doubt has the most room) ---------- */
var blobs = [];
for (var bi = 0; bi < 18; bi++){
  blobs.push({ x: 372 + rng()*256, y: 238 + rng()*360, rx: 26 + rng()*66, ry: 20 + rng()*50, a: 0.07 + rng()*0.08 });
}
blobs.push({ x: 356, y: 420, rx: 30, ry: 90, a: 0.06 });
blobs.push({ x: 644, y: 400, rx: 30, ry: 96, a: 0.06 });

/* ---------- geometry helpers ---------- */
function seg(x1,y1,x2,y2,n){ var p=[],i; n = n || Math.max(2, Math.round(Math.hypot(x2-x1, y2-y1)/11)); for(i=0;i<=n;i++) p.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n]); return p; }
function rectP(x,y,w,h){ return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]]; }
function circP(cx,cy,r,n){ var p=[],i,a; n=n||24; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function ellP(cx,cy,rx,ry,n){ var p=[],i,a; n=n||28; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); } return p; }
function arcP(cx,cy,r,a0,a1,n){ var p=[],i,a; n=n||12; for(i=0;i<=n;i++){ a=a0+(a1-a0)*i/n; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function bez(p0,p1,p2,p3,n){ var p=[],i,t,u; n=n||18; for(i=0;i<=n;i++){ t=i/n; u=1-t; p.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0], u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]); } return p; }
function wavyH(x1,x2,y,amp,per){ var p=[],x; for(x=x1;x<=x2;x+=7) p.push([x, y+Math.sin((x-x1)/per*Math.PI*2)*amp]); p.push([x2, y+Math.sin((x2-x1)/per*Math.PI*2)*amp]); return p; }
function jit(pts, amt){ var out=[],i; for(i=0;i<pts.length;i++) out.push([pts[i][0]+(rng()*2-1)*amt, pts[i][1]+(rng()*2-1)*amt]); return out; }
function S(pts, o){ o = o || {}; var p = jit(pts, o.j !== undefined ? o.j : 1.5); var len=0,i; var n=p.length, lim = o.close ? n : n-1; for(i=1;i<=lim;i++){ var a=p[i-1], b=p[i%n]; len += Math.hypot(b[0]-a[0], b[1]-a[1]); } return { pts:p, w:o.w||3, color:o.color||null, close:!!o.close, len:len }; }

/* ---------- Lisbon (local coords, origin at its ground point): hill, tiled facades, tower, the red tram ---------- */
var lisbon = [
  S(wavyH(-168, 168, 2, 3, 90), { w:3 }),
  S(seg(-168,-14, -60,-34), { w:2, j:1.2 }),
  /* tiled facade 1 */
  S(rectP(-158,-168, 84, 168), { close:true, w:3 }),
  S(seg(-136,-168, -136,0), { w:1.2, j:0.6 }), S(seg(-114,-168, -114,0), { w:1.2, j:0.6 }), S(seg(-92,-168, -92,0), { w:1.2, j:0.6 }),
  S(seg(-158,-42, -74,-42), { w:1.2, j:0.6 }), S(seg(-158,-84, -74,-84), { w:1.2, j:0.6 }), S(seg(-158,-126, -74,-126), { w:1.2, j:0.6 }),
  S(rectP(-128,-44, 26, 44), { close:true, w:2 }),
  S(rectP(-146,-140, 20, 26), { close:true, w:2 }),
  /* tiled facade 2, taller, with a balcony */
  S(rectP(-62,-214, 78, 214), { close:true, w:3 }),
  S(seg(-40,-214, -40,0), { w:1.2, j:0.6 }), S(seg(-18,-214, -18,0), { w:1.2, j:0.6 }), S(seg(4,-214, 4,0), { w:1.2, j:0.6 }),
  S(seg(-62,-54, 16,-54), { w:1.2, j:0.6 }), S(seg(-62,-108, 16,-108), { w:1.2, j:0.6 }), S(seg(-62,-162, 16,-162), { w:1.2, j:0.6 }),
  S(rectP(-52,-96, 58, 10), { close:true, w:2 }),
  S(seg(-44,-96, -44,-86), { w:1.6 }), S(seg(-24,-96, -24,-86), { w:1.6 }), S(seg(-4,-96, -4,-86), { w:1.6 }),
  S(rectP(-44,-150, 24, 30), { close:true, w:2 }),
  /* tower with merlons */
  S(rectP(28,-148, 40, 148), { close:true, w:3 }),
  S(seg(28,-148, 28,-163), { w:2.6 }), S(seg(28,-163, 41,-163), { w:2.6 }), S(seg(41,-163, 41,-148), { w:2.6 }),
  S(seg(55,-148, 55,-163), { w:2.6 }), S(seg(41,-163, 68,-163), { w:2.6 }), S(seg(68,-163, 68,-148), { w:2.6 }),
  S(rectP(40,-104, 16, 26), { close:true, w:2 }),
  S(arcP(48,-104, 8, Math.PI, 0), { w:2 }),
  /* tram wire + pantograph */
  S(wavyH(-168, 168, -100, 1.5, 140), { w:1.6, j:0.8 }),
  S(seg(86,-68, 98,-96), { w:2 }), S(seg(110,-68, 98,-96), { w:2 }),
  S(seg(86,-99, 110,-99), { w:2 }),
  /* tram roof arc + wheels (body filled separately, in red) */
  S(bez([24,-62],[60,-71],[112,-71],[148,-62]), { w:2.6 }),
  S(circP(52,-4, 7), { close:true, w:2.6 }),
  S(circP(120,-4, 7), { close:true, w:2.6 }),
  S(seg(20,5, 152,5), { w:2, j:1 })
];
var lisbonWindows = [ [34,-52,20,22], [60,-52,20,22], [86,-52,20,22], [112,-52,20,22] ];

/* ---------- Buenos Aires (local coords): cafe with awning, jacaranda, tall building, the wide avenue ---------- */
var buenosAires = [
  S(wavyH(-168, 168, 2, 3, 95), { w:3 }),
  /* cafe building */
  S(rectP(-160,-178, 118, 178), { close:true, w:3 }),
  S(seg(-166,-178, -36,-178), { w:3.4 }),
  S(rectP(-136,-58, 30, 58), { close:true, w:2.4 }),
  S(rectP(-92,-150, 44, 44), { close:true, w:2.4 }),
  S(seg(-70,-150, -70,-106), { w:1.8 }), S(seg(-92,-128, -48,-128), { w:1.8 }),
  S(seg(-44,-160, -20,-160), { w:2 }),
  S(circP(-18,-151, 5), { close:true, w:2 }),
  /* cafe table and chair */
  S(ellP(6,-16, 20, 6), { close:true, w:2.4 }),
  S(seg(6,-12, 6,0), { w:2.2 }),
  S(seg(36,-28, 36,0), { w:2.2 }), S(seg(36,-15, 48,-15), { w:2 }), S(seg(48,-15, 48,0), { w:2 }),
  /* tall building with balconies */
  S(rectP(52,-228, 104, 228), { close:true, w:3 }),
  S(rectP(66,-204, 22, 26), { close:true, w:1.8 }), S(rectP(104,-204, 22, 26), { close:true, w:1.8 }),
  S(rectP(66,-150, 22, 26), { close:true, w:1.8 }), S(rectP(104,-150, 22, 26), { close:true, w:1.8 }),
  S(rectP(66,-96, 22, 26), { close:true, w:1.8 }), S(rectP(104,-96, 22, 26), { close:true, w:1.8 }),
  S(seg(60,-118, 148,-118), { w:2 }), S(seg(60,-172, 148,-172), { w:2 }),
  /* jacaranda: trunk, branches, scribble canopy, falling dots */
  S(seg(14,0, 17,-56), { w:3.4 }), S(seg(24,0, 20,-54), { w:3 }),
  S(seg(18,-48, 0,-76), { w:2.4 }), S(seg(19,-52, 40,-78), { w:2.4 }),
  S(circP(16,-102, 32), { close:true, w:2.4 }),
  S(circP(-10,-84, 20), { close:true, w:2.2 }),
  S(circP(44,-86, 22), { close:true, w:2.2 }),
  S(circP(-2,-38, 1.8), { close:true, w:1.4 }), S(circP(34,-28, 1.8), { close:true, w:1.4 }),
  S(circP(14,-50, 1.8), { close:true, w:1.4 }), S(circP(50,-42, 1.8), { close:true, w:1.4 }),
  /* the wide avenue, converging below */
  S(seg(-168,96, -36,10), { w:2.2 }),
  S(seg(168,96, 36,10), { w:2.2 }),
  S(seg(-104,58, -92,44), { w:2 }), S(seg(104,58, 92,44), { w:2 })
];

/* ---------- the avatar (local coords, origin at the feet on the rope): clumsy, one red suitcase ---------- */
var avatar = [
  S(seg(-11,0, -1,0), { w:3 }), S(seg(3,0, 14,0), { w:3 }),
  S(seg(-2,0, -5,-46), { w:3.2 }), S(seg(4,0, 7,-46), { w:3.2 }),
  S(seg(1,-46, -2,-102), { w:3.4 }),
  S(circP(-3,-124, 17), { close:true, w:3.2 }),
  S(circP(11,-140, 5.5), { close:true, w:2.4 }),
  S(arcP(-3,-127, 16.5, Math.PI*1.08, Math.PI*1.72), { w:2.4 }),
  S(bez([-11,-115],[-7,-112.5],[-4,-117.5],[2,-115]), { w:2 }),
  S(seg(-2,-96, -36,-113), { w:3 }),
  S(seg(-31,-116, -40,-108), { w:2.2 }),
  S(seg(-1,-96, 24,-78), { w:3 }),
  S(seg(35,-66, 35,-74), { w:2.4 }), S(seg(35,-74, 59,-74), { w:2.4 }), S(seg(59,-74, 59,-66), { w:2.4 }),
  S(seg(34,-66, 34,-24), { w:1.8 }), S(seg(60,-66, 60,-24), { w:1.8 })
];

/* ---------- the rope ---------- */
var ROPE_Y0 = 648;
function ropeY(x){ var t = (x - 60)/880; return ROPE_Y0 + 2*(1-t)*t*52; }
var ropePosts = [
  S(seg(60,ROPE_Y0-26, 60,ROPE_Y0+16), { w:3.4 }),
  S(seg(50,ROPE_Y0+16, 70,ROPE_Y0+16), { w:2.6 }),
  S(seg(940,ROPE_Y0-26, 940,ROPE_Y0+16), { w:3.4 }),
  S(seg(930,ROPE_Y0+16, 950,ROPE_Y0+16), { w:2.6 })
];

/* ---------- state ---------- */
var PHASE0 = 0;                 /* fixed phase anchor: frame one never comes from a clock */
var curT = PHASE0, prevT = PHASE0;
var disp = 0, dispVel = 0;      /* pendulum displacement, normalised -1..1; rest position is centre, always */
var dragging = false, dragStartX = 0, dragStartDisp = 0;
var frag = null;                /* { side:'L'|'R', t0 } tap fragment above a city */
var FRAG_DUR = 4.6;

/* ---------- sizing ---------- */
var viewW = 300, viewH = 300, dpr = 1;
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : { width:300, height:300 };
var isPhone = Math.min(scr.width, scr.height) < 700; // aspect fallback below only if screen lies
if (!isPhone && viewH > viewW * 1.15 && Math.min(viewW, viewH) < 700) isPhone = true;

/* ---------- drawing ---------- */
function handFont(size, weight){ return 'italic ' + (weight||600) + ' ' + size + 'px "Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif'; }

function pathOf(pts, close){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function strokePartial(pts, close, budget){
  var n = pts.length, lim = close ? n : n-1, b = budget, i, a, c, dx, dy, L;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(i=1;i<=lim;i++){
    a = pts[i-1]; c = pts[i%n]; dx = c[0]-a[0]; dy = c[1]-a[1]; L = Math.hypot(dx,dy);
    if (b >= L){ ctx.lineTo(c[0], c[1]); b -= L; }
    else { var f = L ? b/L : 0; ctx.lineTo(a[0]+dx*f, a[1]+dy*f); b = 0; break; }
  }
  ctx.stroke();
  return b;
}
function drawStrokes(strokes, p, fallbackColor){
  var total = 0, i;
  for(i=0;i<strokes.length;i++) total += strokes[i].len;
  var budget = p * total, st;
  for(i=0;i<strokes.length;i++){
    st = strokes[i];
    if (budget <= 0) break;
    ctx.strokeStyle = st.color || fallbackColor || INK; ctx.lineWidth = st.w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (budget >= st.len){ pathOf(st.pts, st.close); ctx.stroke(); budget -= st.len; }
    else { strokePartial(st.pts, st.close, budget); budget = 0; }
  }
}
function fillPath(pts, color){
  ctx.save(); ctx.fillStyle = color; pathOf(pts, true); ctx.fill(); ctx.restore();
}
function wrapText(text, maxW, size){
  ctx.font = handFont(size, 600);
  var words = text.split(' '), lines = [], cur = '', i, test;
  for(i=0;i<words.length;i++){
    test = cur ? cur + ' ' + words[i] : words[i];
    if (cur && ctx.measureText(test).width > maxW){ lines.push(cur); cur = words[i]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function avatarX(){ return 500 + disp * 185; }

function drawLisbon(alpha){
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(195, ROPE_Y0);
  drawStrokes(lisbon, 1, INK);
  /* the tram: the vignette's one red thing */
  fillPath(rectP(24,-62, 124, 56), RED);
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round'; pathOf(rectP(24,-62, 124, 56), true); ctx.stroke(); ctx.restore();
  for(var i=0;i<lisbonWindows.length;i++){
    var w = lisbonWindows[i];
    fillPath(rectP(w[0], w[1], w[2], w[3]), PAPER);
    ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 1.8; pathOf(rectP(w[0], w[1], w[2], w[3]), true); ctx.stroke(); ctx.restore();
  }
  ctx.fillStyle = INK; ctx.font = handFont(29, 600); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('LISBOA', 0, 128);
  ctx.restore();
}

function drawBuenosAires(alpha){
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(805, ROPE_Y0);
  drawStrokes(buenosAires, 1, INK);
  /* cafe awning: ink outline, scalloped lower edge */
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-164,-104); ctx.lineTo(-38,-104); ctx.lineTo(-38,-90);
  for(var ax = -38; ax > -164; ax -= 18) ctx.arc(ax - 9, -90, 9, 0, Math.PI, false);
  ctx.lineTo(-164,-104); ctx.stroke();
  ctx.lineWidth = 1.6;
  for(var sx = -146; sx < -44; sx += 18){ ctx.beginPath(); ctx.moveTo(sx,-103); ctx.lineTo(sx,-92); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = INK; ctx.font = handFont(29, 600); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('BUENOS AIRES', 0, 128);
  ctx.restore();
}

function drawAvatar(){
  var ax = avatarX(), ay = ropeY(ax);
  var sway = 0.045 * Math.sin(curT * Math.PI * 2 / 7.3);
  var lean = disp * 0.20 + sway;
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(lean);
  /* the suitcase: the figure's one red thing */
  fillPath(rectP(22,-66, 50, 42), RED);
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.8; ctx.lineJoin = 'round'; pathOf(rectP(22,-66, 50, 42), true); ctx.stroke(); ctx.restore();
  fillPath(rectP(30,-52, 12, 10), PAPER);
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 1.6; pathOf(rectP(30,-52, 12, 10), true); ctx.stroke(); ctx.restore();
  drawStrokes(avatar, 1, INK);
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(-9,-126, 1.7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3,-126, 1.7, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawFrag(){
  if (!frag) return;
  var age = curT - frag.t0;
  var a = Math.max(0, Math.min(1, age/0.35)) * Math.max(0, Math.min(1, (FRAG_DUR - age)/0.9));
  if (a <= 0) return;
  var isL = frag.side === 'L';
  var text = isL ? '¡Que sé yo qué estoy haciendo!' : '¡Estoy viviendo!';
  var cx = isL ? 195 : 805;
  var lines = wrapText(text, 320, 27);
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = INK; ctx.font = handFont(27, 600);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for(var i=0;i<lines.length;i++) ctx.fillText(lines[i], cx, 148 + i*34);
  ctx.restore();
}

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var s = Math.min(viewW/1000, viewH/1000);
  var ox = (viewW - 1000*s)/2, oy = (viewH - 1000*s)/2;
  ctx.setTransform(dpr*s, 0, 0, dpr*s, dpr*ox, dpr*oy);
  var i, b;
  for(i=0;i<speckles.length;i++){ var sp = speckles[i]; ctx.save(); ctx.globalAlpha = sp.a; ctx.fillStyle = INK; ctx.fillRect(sp.x, sp.y, sp.r, sp.r); ctx.restore(); }
  /* the between-space wash: doubt gets the most room */
  for(i=0;i<blobs.length;i++){
    b = blobs[i];
    ctx.save(); ctx.globalAlpha = b.a; ctx.fillStyle = WASH;
    ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx, b.ry, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
  var aL = 1 - 0.65 * Math.max(0, Math.min(1, disp));
  var aBA = 1 - 0.65 * Math.max(0, Math.min(1, -disp));
  drawLisbon(aL);
  drawBuenosAires(aBA);
  drawStrokes(ropePosts, 1, INK);
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(60, ROPE_Y0); ctx.quadraticCurveTo(500, ROPE_Y0 + 104, 940, ROPE_Y0); ctx.stroke(); ctx.restore();
  drawAvatar();
  drawFrag();
  ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = INK; ctx.font = handFont(21, 600);
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillText('drag · tap', 972, 952); ctx.restore();
}

/* ---------- sizing listeners (Visual Viewport API + window) ---------- */
function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

/* ---------- interaction: drag the avatar and it leans; release and it swings home to centre; tap a city for its words ---------- */
function toStage(e){
  var r = { left:0, top:0 };
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var cx = (e.clientX - r.left), cy = (e.clientY - r.top);
  var s = Math.min(viewW/1000, viewH/1000);
  return { x: (cx - (viewW - 1000*s)/2)/s, y: (cy - (viewH - 1000*s)/2)/s };
}
var pdown = null;
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e);
  var ax = avatarX(), ay = ropeY(ax);
  var nearAvatar = Math.abs(p.x - ax) < (isPhone ? 105 : 88) && p.y > ay - 195 && p.y < ay + 30;
  pdown = { x:p.x, y:p.y, moved:false, avatar: nearAvatar };
  if (nearAvatar){ dragging = true; dragStartX = p.x; dragStartDisp = disp; dispVel = 0; }
});
canvas.addEventListener('pointermove', function(e){
  if (!pdown) return;
  var p = toStage(e);
  if (Math.abs(p.x - pdown.x) > 8 || Math.abs(p.y - pdown.y) > 8) pdown.moved = true;
  if (dragging){
    disp = Math.max(-1, Math.min(1, dragStartDisp + (p.x - dragStartX)/220));
    dispVel = 0;
    draw();
  }
});
function endPointer(e){
  if (!pdown) return;
  var wasDrag = pdown.moved || dragging;
  var px = pdown.x;
  pdown = null;
  if (dragging){ dragging = false; draw(); return; }
  if (wasDrag) { draw(); return; }
  /* a tap: a city's words, or quiet in the between-space */
  if (px < 350) frag = { side:'L', t0: curT };
  else if (px > 650) frag = { side:'R', t0: curT };
  else frag = null;
  draw();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ pdown = null; dragging = false; });
if (typeof window !== 'undefined') window.addEventListener('pointerup', function(){ pdown = null; dragging = false; });

/* ---------- tick: pendulum physics; the rest position is centre and it always comes back ---------- */
function tick(t){
  var dt = Math.min(0.05, Math.max(0, t - prevT));
  prevT = t; curT = t;
  if (!dragging && dt > 0){
    var acc = -2.6 * disp - 0.5 * dispVel;
    dispVel += acc * dt;
    disp += dispVel * dt;
  }
  if (frag && (t - frag.t0) > FRAG_DUR) frag = null;
}

/* ---------- go: synchronous first frame (centred, both cities equal), then the loop ---------- */
resize();
var baseTs = null;
function loop(ts){
  if (baseTs === null){ baseTs = ts; curT = PHASE0; prevT = PHASE0; }
  tick(PHASE0 + (ts - baseTs)/1000);
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
</script>
</body>
