<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Drip Drum</title>
<style>
html, body { margin: 0; padding: 0; background: #070708; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#070708';
var SILVER_TOP = '#C9CACD';
var SILVER_BOT = '#838487';
var WATER = '#6D7175';
var WATER_DARK = '#565A5E';
var GLINT = '#F4F6F7';
var RIM = '#D8D9DB';
var PLATE = '#141416';
var PLATE_LINE = 'rgba(200,201,204,0.35)';
var TITLE_INK = '#EDEDEF';
var HINT_INK = '#C9CACD';
var PEDAL = '#0D0D0E';
var PEDAL_EDGE = 'rgba(200,201,204,0.28)';
var FALL = 0.9;            /* seconds a drip takes to fall from release to impact */
var PEDAL_CYCLE = 26;      /* seconds between pedal tips */
var TIP_LEN = 8;           /* seconds a tip lasts: ramp, hold, release */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1828);
/* ---- drip schedule: fixed-seed irregular rhythm, never a melody.
   Intervals 1.4 to 3.2 s. Each drip lands near the pan center with a
   small seeded offset. Pitch factor at impact follows the pedal. ---- */
var DRIPS = [];
(function () {
  var t = 0.6, i, ix, iy;
  for (i = 0; i < 48; i++) {
    t += 1.4 + rng() * 1.8;
    ix = (rng() - 0.5) * 0.30;
    iy = (rng() - 0.5) * 0.30;
    DRIPS.push({ t: t, ix: ix, iy: iy });
  }
})();
/* ---- hammered texture: seeded dimples across the pan face ---- */
var DIMPLES = [];
(function () {
  var i, a, r;
  for (i = 0; i < 240; i++) {
    a = rng() * TAU;
    r = Math.sqrt(rng());
    DIMPLES.push({ x: Math.cos(a) * r, y: Math.sin(a) * r * 0.34, rad: 0.004 + rng() * 0.011, light: rng() > 0.5, a: 0.05 + rng() * 0.09 });
  }
})();
function smooth(u) { return u * u * (3 - 2 * u); }
function pedalAngle(t) {
  var u = ((t % PEDAL_CYCLE) + PEDAL_CYCLE) % PEDAL_CYCLE;
  if (u >= TIP_LEN) return 0;
  if (u < 2) return smooth(u / 2);
  if (u < 6) return 1;
  return 1 - smooth((u - 6) / 2);
}
function pitchAt(t) { return 1 + 0.45 * pedalAngle(t); }
/* frame one: 0.35 s before the sixth drip lands, so two earlier rings
   are mid-expansion and a drip is about to fall. */
var FRAME_T = DRIPS[5].t - 0.35;
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function S() { return Math.min(VW, VH); }
function PS() { return isPhone ? Math.min(VH * 0.62, VW * 1.6) : S(); }
function panGeo() {
  var s = PS();
  return {
    cx: VW / 2,
    cy: isPhone ? VH * 0.56 : VH * 0.60,
    rx: 0.36 * s,
    ry: 0.122 * s,
    s: s
  };
}
function ringSpeed(ti, rx) {
  /* higher pitch bends the rings tighter: slower expansion, closer spacing */
  return rx * 0.22 / pitchAt(ti);
}
function ringCount(t) {
  var p = panGeo(), n = 0, i, age, maxR;
  for (i = 0; i < DRIPS.length; i++) {
    age = t - DRIPS[i].t;
    if (age < 0) continue;
    maxR = p.rx * 0.95;
    if (ringSpeed(DRIPS[i].t, p.rx) * age < maxR) n++;
  }
  return n;
}
function nextDrip(t) {
  var i;
  for (i = 0; i < DRIPS.length; i++) if (DRIPS[i].t > t) return DRIPS[i];
  return null;
}
function drawPan(p, t) {
  var i, d, x, y;
  /* faint wash of light behind the pan, darkness at the edges */
  var wash = ctx.createRadialGradient(p.cx, p.cy, 0, p.cx, p.cy, Math.max(VW, VH) * 0.55);
  wash.addColorStop(0, rgba(SILVER_TOP, 0.05));
  wash.addColorStop(0.7, rgba(SILVER_TOP, 0.015));
  wash.addColorStop(1, rgba(SILVER_TOP, 0));
  ctx.fillStyle = wash;
  ctx.fillRect(0, 0, VW, VH);
  /* pan body: hammered aluminum, light from above */
  var body = ctx.createLinearGradient(p.cx, p.cy - p.ry, p.cx, p.cy + p.ry);
  body.addColorStop(0, SILVER_TOP);
  body.addColorStop(0.55, '#A9AAAD');
  body.addColorStop(1, SILVER_BOT);
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(p.cx + p.rx, p.cy);
  ctx.ellipse(p.cx, p.cy, p.rx, p.ry, 0, 0, TAU);
  ctx.fill();
  /* hammered dimples */
  for (i = 0; i < DIMPLES.length; i++) {
    d = DIMPLES[i];
    x = p.cx + d.x * p.rx * 0.94;
    y = p.cy + d.y * p.rx * 0.94;
    ctx.fillStyle = rgba(d.light ? GLINT : '#3A3B3D', d.a);
    ctx.beginPath();
    ctx.moveTo(x + d.rad * p.rx, y);
    ctx.ellipse(x, y, d.rad * p.rx, d.rad * p.rx * 0.4, 0, 0, TAU);
    ctx.fill();
  }
  /* rim highlight, top edge catches the light */
  ctx.strokeStyle = rgba(RIM, 0.85);
  ctx.lineWidth = Math.max(p.s * 0.004, 1.25);
  ctx.beginPath();
  ctx.moveTo(p.cx + p.rx, p.cy);
  ctx.ellipse(p.cx, p.cy, p.rx, p.ry, 0, 0, TAU);
  ctx.stroke();
  /* water surface inside the pan, darker and still */
  var water = ctx.createRadialGradient(p.cx, p.cy - p.ry * 0.3, 0, p.cx, p.cy, p.rx * 0.95);
  water.addColorStop(0, WATER);
  water.addColorStop(1, WATER_DARK);
  ctx.fillStyle = water;
  ctx.beginPath();
  ctx.moveTo(p.cx + p.rx * 0.88, p.cy);
  ctx.ellipse(p.cx, p.cy, p.rx * 0.88, p.ry * 0.82, 0, 0, TAU);
  ctx.fill();
  /* a cold glint across the water */
  ctx.fillStyle = rgba(GLINT, 0.10);
  ctx.beginPath();
  ctx.moveTo(p.cx - p.rx * 0.55, p.cy - p.ry * 0.28);
  ctx.ellipse(p.cx - p.rx * 0.30, p.cy - p.ry * 0.30, p.rx * 0.34, p.ry * 0.20, -0.12, 0, TAU);
  ctx.fill();
}
function drawRings(p, t) {
  var i, age, rad, maxR, a, ix, iy;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(p.cx + p.rx * 0.88, p.cy);
  ctx.ellipse(p.cx, p.cy, p.rx * 0.88, p.ry * 0.82, 0, 0, TAU);
  ctx.clip();
  for (i = 0; i < DRIPS.length; i++) {
    age = t - DRIPS[i].t;
    if (age < 0) continue;
    maxR = p.rx * 0.95;
    rad = ringSpeed(DRIPS[i].t, p.rx) * age;
    if (rad >= maxR) continue;
    a = 0.55 * (1 - rad / maxR);
    ix = p.cx + DRIPS[i].ix * p.rx;
    iy = p.cy + DRIPS[i].iy * p.ry;
    ctx.strokeStyle = rgba(GLINT, a);
    ctx.lineWidth = Math.max(p.s * 0.0028, 1);
    ctx.beginPath();
    ctx.moveTo(ix + rad, iy);
    ctx.ellipse(ix, iy, rad, rad * 0.34, 0, 0, TAU);
    ctx.stroke();
    /* a second, fainter echo ring trailing the first */
    if (rad > p.rx * 0.06) {
      ctx.strokeStyle = rgba(GLINT, a * 0.45);
      ctx.beginPath();
      ctx.moveTo(ix + rad * 0.82, iy);
      ctx.ellipse(ix, iy, rad * 0.82, rad * 0.82 * 0.34, 0, 0, TAU);
      ctx.stroke();
    }
    /* fresh splash crown, only just after impact */
    if (age < 0.25) {
      var sa = 1 - age / 0.25;
      ctx.strokeStyle = rgba(GLINT, 0.7 * sa);
      ctx.lineWidth = Math.max(p.s * 0.002, 0.75);
      var k;
      for (k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(ix + k * p.rx * 0.03 - p.rx * 0.012, iy - p.ry * 0.05 * sa);
        ctx.ellipse(ix + k * p.rx * 0.03, iy - p.ry * 0.05 * sa, p.rx * 0.012, p.ry * 0.05 * sa + 0.5, 0, Math.PI, TAU);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}
function drawDrip(p, t) {
  var d = nextDrip(t);
  if (!d) return;
  var rel = d.t - FALL;
  if (t < rel) return;
  var u = (t - rel) / FALL;             /* 0 at release, 1 at impact */
  var ix = p.cx + d.ix * p.rx;
  var iy = p.cy + d.iy * p.ry;
  var y0 = p.cy - p.s * 0.62;           /* enters from above the frame */
  var y = y0 + (iy - y0) * u * u;       /* accelerating fall */
  var len = Math.max(p.s * 0.006, 2) * (1 + u * 1.6);
  ctx.fillStyle = rgba(GLINT, 0.9);
  ctx.beginPath();
  ctx.moveTo(ix + p.s * 0.0022, y);
  ctx.ellipse(ix, y, p.s * 0.0022, len / 2, 0, 0, TAU);
  ctx.fill();
  /* faint trail above the drop */
  ctx.fillStyle = rgba(GLINT, 0.18);
  ctx.beginPath();
  ctx.moveTo(ix + p.s * 0.0012, y - len);
  ctx.ellipse(ix, y - len, p.s * 0.0012, len * 0.9, 0, 0, TAU);
  ctx.fill();
}
function drawPedal(p, t) {
  var ang = pedalAngle(t);
  var s = p.s;
  var bx = VW * 0.90, by = VH * 0.90;
  var armLen = s * 0.10;
  ctx.save();
  ctx.translate(bx, by);
  /* base, a low dark block at the frame edge */
  ctx.fillStyle = PEDAL;
  ctx.fillRect(-s * 0.012, -s * 0.008, s * 0.024, s * 0.016);
  ctx.strokeStyle = PEDAL_EDGE;
  ctx.lineWidth = 1;
  ctx.strokeRect(-s * 0.012 + 0.5, -s * 0.008 + 0.5, s * 0.024 - 1, s * 0.016 - 1);
  /* lever arm, tips down as the pedal presses */
  ctx.rotate(-0.22 + ang * 0.30);
  ctx.fillStyle = PEDAL;
  ctx.fillRect(-armLen, -s * 0.006, armLen, s * 0.012);
  ctx.strokeStyle = PEDAL_EDGE;
  ctx.strokeRect(-armLen + 0.5, -s * 0.006 + 0.5, armLen - 1, s * 0.012 - 1);
  /* pivot */
  ctx.fillStyle = PEDAL;
  ctx.beginPath();
  ctx.moveTo(s * 0.009, 0);
  ctx.ellipse(0, 0, s * 0.009, s * 0.009, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = PEDAL_EDGE;
  ctx.beginPath();
  ctx.moveTo(s * 0.009, 0);
  ctx.ellipse(0, 0, s * 0.009, s * 0.009, 0, 0, TAU);
  ctx.stroke();
  ctx.restore();
  /* pedal angle readout, a thin tick that slides with the tip */
  var tx = VW * 0.90 - s * 0.055;
  ctx.fillStyle = rgba(GLINT, 0.10 + 0.25 * ang);
  ctx.fillRect(tx, VH * 0.90 - s * 0.028 - ang * s * 0.012, Math.max(s * 0.002, 1), s * 0.056);
}
var soundRect = null;
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Water Drip Drum').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Water Drip Drum').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 13').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Water Drip Drum', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 13', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  /* sound toggle, bottom right */
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  var sndPlateW = sndW + 24;
  var sndPlateH = smallPx + 14;
  var sndPlateX = VW - sndPlateW - 12;
  var sndPlateY = VH - sndPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(sndPlateX, sndPlateY, sndPlateW, sndPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(sndPlateX + 0.5, sndPlateY + 0.5, sndPlateW - 1, sndPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, sndPlateX + 12, sndPlateY + 7);
  soundRect = { x: sndPlateX, y: sndPlateY, w: sndPlateW, h: sndPlateH };
}
function draw() {
  size();
  var p = panGeo();
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawPan(p, t);
  drawRings(p, t);
  drawDrip(p, t);
  drawPedal(p, t);
  drawPlates();
}
/* ---- sound: closed-form model only. Real WebAudio starts lazily
   inside the first tap on the sound toggle, never autoplay. ---- */
var soundOn = false;
var audioCtx = null, droneGain = null, lastPingIdx = -1;
function ensureAudio() {
  if (audioCtx) return true;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    audioCtx = new AC();
    var drone = audioCtx.createOscillator();
    drone.type = 'sine';
    drone.frequency.value = 55;
    var drone2 = audioCtx.createOscillator();
    drone2.type = 'sine';
    drone2.frequency.value = 55.4;
    droneGain = audioCtx.createGain();
    droneGain.gain.value = 0.0;
    drone.connect(droneGain);
    drone2.connect(droneGain);
    droneGain.connect(audioCtx.destination);
    drone.start();
    drone2.start();
  } catch (e) { audioCtx = null; return false; }
  return true;
}
function playPing(ti) {
  if (!audioCtx) return;
  var f = 620 * pitchAt(ti);
  var o = audioCtx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(f, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(f * 0.55, audioCtx.currentTime + 0.5);
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.7);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.75);
}
function toggleSound() {
  soundOn = !soundOn;
  if (soundOn) {
    if (ensureAudio()) {
      if (audioCtx.resume) audioCtx.resume();
      if (droneGain) droneGain.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + 1.5);
    } else {
      soundOn = false;
    }
  } else if (audioCtx && droneGain) {
    droneGain.gain.linearRampToValueAtTime(0.0, audioCtx.currentTime + 0.5);
  }
  draw();
}
function onTap(e) {
  if (!soundRect) return;
  var x = 0, y = 0;
  if (e.clientX !== undefined) { x = e.clientX; y = e.clientY; }
  else if (e.touches && e.touches[0]) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
  if (x >= soundRect.x && x <= soundRect.x + soundRect.w && y >= soundRect.y && y <= soundRect.y + soundRect.h) toggleSound();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    frameT: function () { return FRAME_T; },
    ringCount: function () { return ringCount(phaseT); },
    nextDripIn: function () { var d = nextDrip(phaseT); return d ? d.t - phaseT : -1; },
    pedalAngle: function () { return pedalAngle(phaseT); },
    dripCount: function () { return DRIPS.length; }
  };
  if (canvas.addEventListener) {
    canvas.addEventListener('click', onTap);
    canvas.addEventListener('touchend', onTap);
  }
}
/* ---- frame one: fixed phase, 0.35 s before the sixth drip lands ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt * (reduced ? 0.05 : 1);
      phaseT = (FRAME_T + clockT) % 86400;
      if (soundOn && audioCtx) {
        var i;
        for (i = 0; i < DRIPS.length; i++) {
          if (DRIPS[i].t > phaseT - dt && DRIPS[i].t <= phaseT && i !== lastPingIdx) {
            lastPingIdx = i;
            playPing(DRIPS[i].t);
          }
        }
      }
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
