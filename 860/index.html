<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№860 Fly in the Face</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a0e06; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №860 Fly in the Face, CK6 / PP1260, study #262 colton-kempf.
  // Extreme closeness: hands cueing vinyl on a turntable in warm
  // lamplight, a performer's face half-filling the frame, the
  // camera so near the subject can feel it. Trust, not trickery.
  // The subject fills the frame edge to edge; no context, no room.
  // Drag pushes the camera nearer, toward the haptic edge where the
  // image almost touches. Release lets it settle back. The
  // closeness is a contract: the subject never flinches. Audio is
  // visual-only in this gallery: the turning vinyl IS the cue, no
  // real WebAudio, per the Franke rule.
  var GROUND = '#1a0e06'; // page ground, warm shadow

  // Fixed-phase first frame: FIRST_T = 10 s into a 60 s cycle.
  // Every motion period (60, 30, 20, 15, 12, 10, 6 s) divides the
  // 60 s cycle, so the frame at FIRST_T + 60 equals the frame at
  // FIRST_T and the ending loops back to a beginning. Dolly is
  // interaction state only: at rest it is 0, so the loop closes.
  var FIRST_T = 10;
  var CYCLE = 60;
  var SEED = 860;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // ---- Dolly: the draggable camera --------------------------------
  // dolly 0 = resting distance, 1 = the haptic edge, almost touching.
  // target follows the drag; on release the target returns to 0 and
  // dolly eases back. Easing happens only in the animation loop and
  // in pointer handlers, never inside draw(), so draw(t) stays a
  // pure function of t and the current dolly value: two draws at
  // the same t and dolly are pixel-identical.
  var dolly = 0, dollyTarget = 0, dragging = false;
  var dragStartX = 0, dragStartY = 0, dragDist = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipsePath(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }

  // Palette: warm lamplight amber, skin tones, vinyl black.
  var SHADOW = [26, 14, 6];
  var SHADOW_DEEP = [12, 6, 3];
  var AMBER = [255, 178, 92];
  var AMBER_SOFT = [238, 150, 70];
  var AMBER_DEEP = [176, 96, 40];
  var SKIN = [198, 138, 96];
  var SKIN_LIGHT = [232, 178, 132];
  var SKIN_DEEP = [138, 80, 48];
  var SKIN_SHADOW = [96, 54, 32];
  var VINYL = [8, 6, 7];
  var VINYL_RIM = [60, 46, 44];
  var LIP = [164, 74, 52];
  var LIP_DEEP = [120, 48, 36];
  var CREAM = [244, 226, 200];
  var HAIR = [16, 10, 8];

  // ---- Fixed grain table: 220 warm specks, static ------------------
  var grainRng = mulberry32(SEED * 17 + 7);
  var GRAIN = [];
  var gi;
  for (gi = 0; gi < 220; gi++) {
    GRAIN.push({
      x: grainRng(), y: grainRng(),
      r: 0.001 + grainRng() * 0.0022,
      a: 0.03 + grainRng() * 0.07,
      warm: grainRng() > 0.5
    });
  }

  // ---- Fixed groove table: 9 groove rings on the vinyl ------------
  var grooveRng = mulberry32(SEED * 23 + 3);
  var GROOVES = [];
  for (gi = 0; gi < 9; gi++) {
    GROOVES.push(0.42 + gi * 0.062 + (grooveRng() - 0.5) * 0.02);
  }

  // ---- Fixed fingertip table: 5 fingertips on the record edge -----
  var tipRng = mulberry32(SEED * 31 + 11);
  var TIPS = [];
  for (gi = 0; gi < 5; gi++) {
    TIPS.push({ a: -0.5 + gi * 0.24 + (tipRng() - 0.5) * 0.06, r: 0.014 + tipRng() * 0.006 });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function X(f) { return f * W; }
  function Y(f) { return f * H; }

  // ---- Dolly helpers ------------------------------------------------
  // Camera focus: the face, right of center. Zoom grows with dolly;
  // focus breathing (a slow 6 s swell) is felt only near the haptic
  // edge, scaled by dolly so the resting frame is steady.
  function dollyScale(t) {
    var breathe = 0.012 * dolly * Math.sin(2 * Math.PI * (t - FIRST_T) / 6);
    return 1 + 0.45 * dolly + breathe;
  }
  function breatheGlow(t) {
    // Soft lamplight swell at closest range, 6 s period.
    return 0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / 6 - 0.9);
  }
  function pointerPos(e) {
    var x = 0, y = 0;
    try {
      if (typeof e.clientX === 'number') { x = e.clientX; y = e.clientY; }
      else if (e.touches && e.touches[0]) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
    } catch (err) {}
    return { x: x, y: y };
  }
  function onDown(e) {
    dragging = true;
    var p = pointerPos(e);
    dragStartX = p.x; dragStartY = p.y; dragDist = 0;
    try { if (e.preventDefault) { e.preventDefault(); } } catch (err) {}
  }
  function onMove(e) {
    if (!dragging) { return; }
    var p = pointerPos(e);
    var dx = p.x - dragStartX, dy = p.y - dragStartY;
    dragDist = Math.sqrt(dx * dx + dy * dy);
    // 320 px of drag reaches the haptic edge.
    dollyTarget = clamp(dragDist / 320, 0, 1);
    dolly += (dollyTarget - dolly) * 0.25;
    draw(lastT);
    try { if (e.preventDefault) { e.preventDefault(); } } catch (err) {}
  }
  function onUp() {
    dragging = false;
    dollyTarget = 0; // release lets the camera settle back
  }

  // ---- Base: warm shadow with lamplight wash -----------------------
  function drawBase(t) {
    ctx.fillStyle = rgb(SHADOW);
    ctx.fillRect(0, 0, W, H);
    // Warm lamplight from the upper left, pooling over the hands.
    var lg = ctx.createRadialGradient(X(0.22), Y(0.18), 0, X(0.22), Y(0.18), W * 0.85);
    lg.addColorStop(0, rgba(AMBER, a4(0.42)));
    lg.addColorStop(0.55, rgba(AMBER_SOFT, a4(0.16)));
    lg.addColorStop(1, rgba(AMBER_SOFT, 0));
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, W, H);
    // Deep warm shadow low right, so the face sits in half light.
    var dg = ctx.createRadialGradient(X(0.95), Y(0.95), 0, X(0.95), Y(0.95), W * 0.7);
    dg.addColorStop(0, rgba(SHADOW_DEEP, a4(0.5)));
    dg.addColorStop(1, rgba(SHADOW_DEEP, 0));
    ctx.fillStyle = dg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- The face: half-filling the frame, never flinching -----------
  // A large three-quarter face cropped by the right and top edges.
  // Slow breathing (30 s) shifts it a hair; the closed eye never
  // opens, the mouth never moves. Abstract, warm, soft-edged.
  function drawFace(t) {
    var breathe = Math.sin(2 * Math.PI * (t - FIRST_T) / 30) * H * 0.004;
    var cx = X(0.74), cy = Y(0.44) + breathe;
    var rx = W * 0.44, ry = H * 0.58;
    // Face mass: warm skin gradient, lit from the lamp side.
    var sg = ctx.createRadialGradient(cx - rx * 0.35, cy - ry * 0.3, rx * 0.1,
      cx, cy, rx * 1.15);
    sg.addColorStop(0, rgb(SKIN_LIGHT));
    sg.addColorStop(0.45, rgb(SKIN));
    sg.addColorStop(0.85, rgb(SKIN_DEEP));
    sg.addColorStop(1, rgb(SKIN_SHADOW));
    ctx.fillStyle = sg;
    ellipsePath(cx, cy, rx, ry, 0.08);
    ctx.fill();
    // Hair: dark mass along the top and right, cropped by the edge.
    ctx.fillStyle = rgba(HAIR, a4(0.96));
    ctx.beginPath();
    ctx.moveTo(X(0.44), Y(-0.06));
    ctx.quadraticCurveTo(X(0.72), Y(-0.02), X(1.02), Y(0.06));
    ctx.lineTo(X(1.02), Y(0.30));
    ctx.quadraticCurveTo(X(0.86), Y(0.16), X(0.66), Y(0.10));
    ctx.quadraticCurveTo(X(0.50), Y(0.04), X(0.44), Y(-0.06));
    ctx.closePath();
    ctx.fill();
    // Amber rim light on the hair edge.
    ctx.strokeStyle = rgba(AMBER, a4(0.5));
    ctx.lineWidth = Math.max(1.5, W * 0.003);
    ctx.beginPath();
    ctx.moveTo(X(0.66), Y(0.10));
    ctx.quadraticCurveTo(X(0.86), Y(0.16), X(1.02), Y(0.30));
    ctx.stroke();
    // The cheekbone is lit by the gradient alone; no separate
    // shadow shape, so nothing reads as a second form on the face.
    // Closed eye: one calm curve, lashes as small ticks. It never opens.
    var ex = cx - rx * 0.30, ey = cy - ry * 0.18;
    ctx.strokeStyle = rgba(SKIN_SHADOW, a4(0.85));
    ctx.lineWidth = Math.max(1.5, W * 0.0035);
    ctx.beginPath();
    ctx.moveTo(ex - W * 0.055, ey);
    ctx.quadraticCurveTo(ex, ey + H * 0.018, ex + W * 0.055, ey - H * 0.004);
    ctx.stroke();
    // Eyebrow: a soft thick arc above the closed eye.
    ctx.strokeStyle = rgba(HAIR, a4(0.75));
    ctx.lineWidth = Math.max(2, W * 0.008);
    ctx.beginPath();
    ctx.moveTo(ex - W * 0.06, ey - H * 0.035);
    ctx.quadraticCurveTo(ex, ey - H * 0.055, ex + W * 0.06, ey - H * 0.038);
    ctx.stroke();
    // Lashes: five small ticks under the eye curve.
    ctx.strokeStyle = rgba(HAIR, a4(0.6));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    var li;
    for (li = 0; li < 5; li++) {
      var lx = ex - W * 0.04 + li * W * 0.02;
      var ly = ey + H * 0.012 + Math.sin(li * 1.3) * H * 0.002;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx - W * 0.002, ly + H * 0.010);
      ctx.stroke();
    }
    // Nose: one broad soft wedge, barely brighter than the skin,
    // with a faint shadow along its far side. No dot, no hard edge.
    var nx = ex + W * 0.045, ny = ey + H * 0.03, nl = H * 0.085;
    ctx.fillStyle = rgba(SKIN_LIGHT, a4(0.20));
    ctx.beginPath();
    ctx.moveTo(nx - W * 0.016, ny);
    ctx.quadraticCurveTo(nx + W * 0.018, ny + nl * 0.5, nx + W * 0.008, ny + nl);
    ctx.quadraticCurveTo(nx - W * 0.012, ny + nl, nx - W * 0.018, ny + nl * 0.5);
    ctx.quadraticCurveTo(nx - W * 0.018, ny + nl * 0.15, nx - W * 0.016, ny);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgba(SKIN_SHADOW, a4(0.16));
    ctx.beginPath();
    ctx.moveTo(nx + W * 0.012, ny + nl * 0.35);
    ctx.quadraticCurveTo(nx + W * 0.020, ny + nl * 0.8, nx + W * 0.008, ny + nl);
    ctx.quadraticCurveTo(nx + W * 0.004, ny + nl * 0.65, nx + W * 0.006, ny + nl * 0.35);
    ctx.closePath();
    ctx.fill();
    // Lips: still, warm, slightly parted in the middle.
    var mx = cx - rx * 0.22, my = cy + ry * 0.34;
    ctx.fillStyle = rgba(LIP, a4(0.9));
    ctx.beginPath();
    ctx.moveTo(mx - W * 0.055, my);
    ctx.quadraticCurveTo(mx, my - H * 0.018, mx + W * 0.055, my);
    ctx.quadraticCurveTo(mx, my + H * 0.006, mx - W * 0.055, my);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgba(LIP_DEEP, a4(0.9));
    ctx.beginPath();
    ctx.moveTo(mx - W * 0.05, my + H * 0.004);
    ctx.quadraticCurveTo(mx, my + H * 0.020, mx + W * 0.05, my + H * 0.004);
    ctx.quadraticCurveTo(mx, my + H * 0.010, mx - W * 0.05, my + H * 0.004);
    ctx.closePath();
    ctx.fill();
    // Warm highlight on the lower lip.
    ctx.fillStyle = rgba(AMBER, a4(0.35));
    ellipsePath(mx + W * 0.01, my + H * 0.011, W * 0.02, H * 0.004, 0);
    ctx.fill();
    // Jaw and neck falling out of the bottom edge.
    ctx.fillStyle = rgba(SKIN_DEEP, a4(0.55));
    ctx.beginPath();
    ctx.moveTo(cx - rx * 0.55, cy + ry * 0.55);
    ctx.quadraticCurveTo(cx, cy + ry * 0.78, cx + rx * 0.5, cy + ry * 0.5);
    ctx.lineTo(X(1.02), Y(1.02));
    ctx.lineTo(X(0.30), Y(1.02));
    ctx.closePath();
    ctx.fill();
  }

  // ---- Turntable: vinyl black, hands cueing -------------------------
  // The platter turns one full revolution per 60 s cycle, so the
  // groove highlights at FIRST_T + 60 match the frame at FIRST_T.
  // Two abstract hands rest on the record; fingertips touch the
  // grooves. A slow 20 s sway keeps the hands alive without
  // breaking the cue.
  function drawTurntable(t) {
    var cx = X(0.27), cy = Y(0.80);
    var r = W * 0.30;
    var sway = Math.sin(2 * Math.PI * (t - FIRST_T) / 20) * W * 0.006;
    var rot = 2 * Math.PI * (t - FIRST_T) / CYCLE;
    ctx.save();
    ctx.globalAlpha = a4(0.95);
    // Platter: vinyl black disc, squashed by perspective.
    ctx.fillStyle = rgba(VINYL, a4(0.94));
    ellipsePath(cx, cy, r, r * 0.42, 0);
    ctx.fill();
    // Amber rim where the lamplight catches the edge.
    ctx.strokeStyle = rgba(AMBER, a4(0.45));
    ctx.lineWidth = Math.max(1.5, W * 0.003);
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.9, cy - r * 0.12);
    ctx.ellipse(cx, cy, r, r * 0.42, 0, Math.PI * 1.05, Math.PI * 1.75);
    ctx.stroke();
    // Groove rings, with one rotating highlight spoke per ring so
    // the turn is visible: the spoke angle rides the 60 s cycle.
    ctx.strokeStyle = rgba(CREAM, a4(0.13));
    ctx.lineWidth = Math.max(1, W * 0.001);
    var gi2;
    for (gi2 = 0; gi2 < GROOVES.length; gi2++) {
      ellipsePath(cx, cy, r * GROOVES[gi2], r * 0.42 * GROOVES[gi2], 0);
      ctx.stroke();
    }
    // Rotating sheen: a soft wedge that turns with the record, one
    // full revolution per 60 s cycle so the loop closes.
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    var sheen = ctx.createLinearGradient(-r, 0, r, 0);
    sheen.addColorStop(0, rgba(AMBER, 0));
    sheen.addColorStop(0.5, rgba(AMBER, a4(0.10)));
    sheen.addColorStop(1, rgba(AMBER, 0));
    ctx.fillStyle = sheen;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(r * 0.9, -r * 0.18);
    ctx.lineTo(r * 0.9, r * 0.18);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    // Label: warm amber center.
    ctx.fillStyle = rgba(AMBER_SOFT, a4(0.85));
    ellipsePath(cx, cy, r * 0.30, r * 0.13, 0);
    ctx.fill();
    ctx.fillStyle = rgba(AMBER_DEEP, a4(0.9));
    ellipsePath(cx, cy, r * 0.30, r * 0.13, 0);
    ctx.stroke();
    ctx.fillStyle = rgba(SHADOW_DEEP, a4(0.9));
    ellipsePath(cx, cy, r * 0.07, r * 0.03, 0);
    ctx.fill();
    // Spindle dot.
    ctx.fillStyle = rgba(CREAM, a4(0.7));
    circle(cx, cy, Math.max(1, W * 0.003));
    ctx.fill();
    // Tonearm from the platter's right edge.
    ctx.strokeStyle = rgba(VINYL_RIM, a4(0.95));
    ctx.lineWidth = Math.max(2, W * 0.004);
    ctx.beginPath();
    ctx.moveTo(cx + r * 1.05, cy - r * 0.34);
    ctx.lineTo(cx + r * 0.42, cy - r * 0.06);
    ctx.stroke();
    ctx.fillStyle = rgba(VINYL_RIM, a4(0.95));
    circle(cx + r * 1.05, cy - r * 0.34, W * 0.012);
    ctx.fill();
    // First hand: palm resting on the record's near edge, fingers
    // reaching toward the label, fingertips peeking from under the
    // palm. Warm skin, amber-lit on top. All in one rotated frame
    // so fingers, palm and tips stay aligned.
    ctx.save();
    ctx.translate(cx - r * 0.02 + sway, cy - r * 0.16);
    ctx.rotate(-0.28);
    // Three fingers reaching down toward the label.
    ctx.fillStyle = rgba(SKIN, a4(0.92));
    var fgi;
    for (fgi = 0; fgi < 3; fgi++) {
      ctx.save();
      ctx.translate(-r * 0.16 + fgi * r * 0.14, r * 0.10);
      ctx.rotate(0.25 + fgi * 0.12);
      ellipsePath(0, 0, r * 0.055, r * 0.11, 0);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = rgba(SKIN, a4(0.92));
    ellipsePath(0, 0, r * 0.38, r * 0.14, 0);
    ctx.fill();
    ctx.fillStyle = rgba(SKIN_LIGHT, a4(0.45));
    ellipsePath(0, -r * 0.04, r * 0.30, r * 0.07, 0);
    ctx.fill();
    // Fingertips: five small caps just below the palm's lower edge,
    // at the ends of the fingers, kept close to skin tone so they
    // read as knuckle ends, not beads.
    var fi;
    for (fi = 0; fi < TIPS.length; fi++) {
      var tp = TIPS[fi];
      var tx = -r * 0.30 + fi * r * 0.14;
      var ty = r * 0.13 + Math.sin(tp.a * 3) * r * 0.012;
      ctx.fillStyle = rgba(SKIN, a4(0.75));
      circle(tx, ty, tp.r * W * 0.6);
      ctx.fill();
    }
    ctx.restore();
    // Second hand: fingers curled at the record's far edge, holding
    // the cue steady.
    ctx.save();
    ctx.translate(cx + r * 0.55, cy + r * 0.16);
    ctx.rotate(0.5);
    ctx.fillStyle = rgba(SKIN_DEEP, a4(0.9));
    ellipsePath(0, 0, r * 0.30, r * 0.11, 0);
    ctx.fill();
    ctx.fillStyle = rgba(AMBER_SOFT, a4(0.4));
    ellipsePath(0, -r * 0.03, r * 0.22, r * 0.05, 0);
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  // ---- Lamplight breathing at the closest range ---------------------
  function drawCloseGlow(t) {
    if (dolly < 0.02) { return; }
    var g = breatheGlow(t);
    var cx = X(0.68), cy = Y(0.42);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.55);
    rg.addColorStop(0, rgba(AMBER, a4(0.10 * dolly * (0.6 + 0.4 * g))));
    rg.addColorStop(1, rgba(AMBER, 0));
    ctx.fillStyle = rg;
    ctx.fillRect(cx - W * 0.55, cy - W * 0.55, W * 1.1, W * 1.1);
    ctx.restore();
  }

  // ---- Grain and vignette -------------------------------------------
  function drawGrain() {
    var i, g;
    for (i = 0; i < GRAIN.length; i++) {
      g = GRAIN[i];
      ctx.fillStyle = g.warm ? rgba(AMBER, a4(g.a)) : rgba(CREAM, a4(g.a));
      circle(X(g.x), Y(g.y), g.r * W);
      ctx.fill();
    }
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.40,
      W / 2, H / 2, Math.max(W, H) * 0.80);
    vg.addColorStop(0, rgba(SHADOW_DEEP, 0));
    vg.addColorStop(1, rgba(SHADOW_DEEP, a4(0.5)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- Caption and hint, in the template's place ----------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CREAM, a4(0.92));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№860 · Fly in the Face', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CREAM, a4(0.62));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 20', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CREAM, a4(0.88));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to draw nearer.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // The camera: zoom toward the face as the dolly advances.
    ctx.save();
    var s = dollyScale(t);
    var fx = X(0.68), fy = Y(0.42);
    ctx.translate(fx, fy);
    ctx.scale(s, s);
    ctx.translate(-fx, -fy);
    drawBase(t);
    drawTurntable(t);
    drawFace(t);
    drawCloseGlow(t);
    ctx.restore();
    drawGrain();
    drawText();
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // Pointer and touch drag: drag pushes the camera nearer, release
  // lets it settle back. No click-to-reload, no reseed.
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);
      canvas.addEventListener('touchstart', onDown);
      canvas.addEventListener('touchmove', onMove);
      canvas.addEventListener('touchend', onUp);
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece860 exposes the dolly and the loop.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece860 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      dolly: function () { return dolly; },
      setDolly: function (v) { dolly = clamp(v, 0, 1); dollyTarget = dolly; },
      dollyScale: function (t) { return dollyScale(t); },
      breatheGlow: function (t) { return breatheGlow(t); },
      release: function () { dragging = false; dollyTarget = 0; },
      easeStep: function () { dolly += (dollyTarget - dolly) * 0.06; return dolly; },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 60 s intimate cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      if (!dragging) { dolly += (dollyTarget - dolly) * 0.06; }
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
