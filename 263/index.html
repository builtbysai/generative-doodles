<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.263 Chadar Balance</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#2E5B7E; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.263 Chadar Balance (Stanzin Tsepel). After his 2023
// chadar-trek scrap piece: a laden porter of rusted parts,
// glowing red headlamp, chain icicles dangling from the
// torso, a weathered jerrycan on his back, balanced high
// on tilted diamond plates of thin formed ice. The whole
// group sways a degree and a half on a 25 second loop,
// chains swinging out of phase. A held breath. It never
// falls. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var RUST = '#6E3B1F', PATINA = '#2E2A24', LAMP = '#E0392B', TRUNK = '#4E5B4A', ICE = '#A9C3D4', DEEPBLUE = '#2E5B7E';
var DW = 880, DH = 1240; // vertical composition
var W = 0, H = 0, phone = false;
var T = 3.5, lastNow = -1; // frame one: mid sway, the chains lagging

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- the ice plates ------------------------------------------------------------
var plates = [
  { cx: 440, cy: 618, w: 320, h: 92, rot: -0.07, a: 0.62 }, // the standing plate
  { cx: 285, cy: 726, w: 225, h: 70, rot: 0.14, a: 0.5 },
  { cx: 600, cy: 716, w: 245, h: 76, rot: -0.16, a: 0.52 },
  { cx: 385, cy: 836, w: 265, h: 82, rot: 0.09, a: 0.44 },
  { cx: 545, cy: 928, w: 205, h: 64, rot: -0.11, a: 0.38 },
  { cx: 430, cy: 1048, w: 155, h: 50, rot: 0.17, a: 0.3 }
];
function drawPlate(p) {
  ctx.save();
  ctx.translate(p.cx, p.cy);
  ctx.rotate(p.rot);
  ctx.fillStyle = rgba(ICE, p.a);
  ctx.beginPath();
  ctx.moveTo(-p.w / 2, 0); ctx.lineTo(0, -p.h / 2); ctx.lineTo(p.w / 2, 0); ctx.lineTo(0, p.h / 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgba(ICE, Math.min(1, p.a + 0.25));
  ctx.lineWidth = 1.6;
  ctx.stroke();
  // a specular streak across the upper face
  ctx.strokeStyle = rgba(ICE, 0.55);
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(-p.w * 0.30, -p.h * 0.10); ctx.lineTo(p.w * 0.16, -p.h * 0.26); ctx.stroke();
  ctx.restore();
}

// ---- the porter's chains ---------------------------------------------------------
// each chain: an anchor on the torso, a length, a phase lag behind the sway
var chains = [
  { ax: -20, ay: -82, len: 64, lag: 0.9 },
  { ax: -7, ay: -78, len: 78, lag: 1.25 },
  { ax: 8, ay: -78, len: 70, lag: 1.6 },
  { ax: 21, ay: -84, len: 56, lag: 1.95 }
];
function drawChain(ch) {
  var sway = Math.sin(T * Math.PI * 2 / 25 - ch.lag) * 0.16; // radians, lagging the body
  var ex = ch.ax + Math.sin(sway) * ch.len;
  var ey = ch.ay + Math.cos(sway) * ch.len;
  var mx = ch.ax + Math.sin(sway) * ch.len * 0.45;
  var my = ch.ay + Math.cos(sway) * ch.len * 0.5;
  var n = Math.max(5, Math.round(ch.len / 8));
  ctx.lineWidth = 1.7;
  for (var i = 0; i < n; i++) {
    var t0 = i / n, t1 = (i + 1) / n;
    var x0 = (1 - t0) * (1 - t0) * ch.ax + 2 * (1 - t0) * t0 * mx + t0 * t0 * ex;
    var y0 = (1 - t0) * (1 - t0) * ch.ay + 2 * (1 - t0) * t0 * my + t0 * t0 * ey;
    var x1 = (1 - t1) * (1 - t1) * ch.ax + 2 * (1 - t1) * t1 * mx + t1 * t1 * ex;
    var y1 = (1 - t1) * (1 - t1) * ch.ay + 2 * (1 - t1) * t1 * my + t1 * t1 * ey;
    ctx.strokeStyle = rgba(i % 2 ? RUST : PATINA, 0.95);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.beginPath(); ctx.arc(x0, y0, 2.3, 0, Math.PI * 2); ctx.stroke();
  }
  // the icicle tip
  ctx.fillStyle = rgba(ICE, 0.85);
  ctx.beginPath(); ctx.moveTo(ex - 2.6, ey); ctx.lineTo(ex + 2.6, ey); ctx.lineTo(ex, ey + 8); ctx.closePath(); ctx.fill();
}

// ---- the porter ------------------------------------------------------------------
// drawn in local space: origin at the feet, on the apex plate
function drawPorter() {
  var sway = Math.sin(T * Math.PI * 2 / 25) * 0.0262; // plus/minus 1.5 degrees
  ctx.save();
  ctx.translate(440, 592);
  ctx.rotate(sway);
  // jerrycan pack, riding behind the torso
  ctx.fillStyle = TRUNK;
  ctx.fillRect(-56, -170, 34, 64);
  ctx.fillStyle = rgba(PATINA, 0.55);
  ctx.fillRect(-56, -170, 34, 9);
  ctx.fillStyle = PATINA;
  ctx.fillRect(-48, -180, 16, 10); // the cap
  ctx.strokeStyle = rgba(PATINA, 0.8);
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-39, -168); ctx.lineTo(-24, -140); ctx.stroke(); // strap
  // legs, planted wide on the plate
  ctx.fillStyle = PATINA;
  ctx.beginPath(); ctx.moveTo(-17, -80); ctx.lineTo(-3, -80); ctx.lineTo(-5, -2); ctx.lineTo(-20, -2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(5, -80); ctx.lineTo(19, -80); ctx.lineTo(22, -2); ctx.lineTo(8, -2); ctx.closePath(); ctx.fill();
  ctx.fillRect(-25, -7, 22, 7); ctx.fillRect(4, -7, 24, 7); // boots
  // torso: a rusted trunk of a coat
  ctx.fillStyle = RUST;
  ctx.beginPath(); ctx.moveTo(-27, -162); ctx.lineTo(27, -162); ctx.lineTo(21, -76); ctx.lineTo(-21, -76); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(PATINA, 0.35);
  ctx.beginPath(); ctx.moveTo(4, -162); ctx.lineTo(27, -162); ctx.lineTo(21, -76); ctx.lineTo(3, -76); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgba(PATINA, 0.75);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -160); ctx.lineTo(1, -80); ctx.stroke(); // the seam
  // arms, braced against the load
  ctx.strokeStyle = PATINA;
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-24, -152); ctx.lineTo(-36, -96); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(24, -152); ctx.lineTo(37, -98); ctx.stroke();
  // head
  ctx.fillStyle = PATINA;
  ctx.beginPath(); ctx.arc(0, -180, 14.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = RUST; // the headwrap band
  ctx.beginPath(); ctx.arc(0, -183, 14.5, Math.PI * 1.05, Math.PI * 1.95); ctx.lineTo(14, -176); ctx.lineTo(-14, -176); ctx.closePath(); ctx.fill();
  // the headlamp: layered glow, then the lamp itself
  ctx.fillStyle = rgba(LAMP, 0.13);
  ctx.beginPath(); ctx.arc(1, -184, 17, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(LAMP, 0.3);
  ctx.beginPath(); ctx.arc(1, -184, 10, 0, Math.PI * 2); ctx.fill();
  // a faint beam thrown forward and down
  ctx.fillStyle = rgba(LAMP, 0.05);
  ctx.beginPath(); ctx.moveTo(3, -182); ctx.lineTo(64, -96); ctx.lineTo(20, -84); ctx.closePath(); ctx.fill();
  ctx.fillStyle = LAMP;
  ctx.beginPath(); ctx.arc(1, -184, 5.2, 0, Math.PI * 2); ctx.fill();
  // the chains hang last, over the legs
  for (var i = 0; i < chains.length; i++) drawChain(chains[i]);
  ctx.restore();
}

function draw() {
  // deep blue backdrop
  ctx.fillStyle = DEEPBLUE;
  ctx.fillRect(0, 0, DW, DH);
  // vignette: the corners fall toward patina dark, in wide soft layers
  // whose edges stay off-frame
  ctx.fillStyle = rgba(PATINA, 0.10);
  ctx.beginPath(); ctx.ellipse(-190, -170, 620, 460, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(DW + 190, -170, 620, 460, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-190, DH + 190, 660, 500, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(DW + 190, DH + 190, 660, 500, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = rgba(PATINA, 0.08);
  ctx.beginPath(); ctx.ellipse(440, -260, 560, 300, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(440, DH + 260, 600, 320, 0, 0, Math.PI * 2); ctx.fill();
  // a cold halo of open air around the figure
  ctx.fillStyle = rgba(ICE, 0.035);
  ctx.beginPath(); ctx.ellipse(440, 490, 400, 450, 0, 0, Math.PI * 2); ctx.fill();
  // the jagged stack of thin ice, then the porter on top of it
  for (var i = plates.length - 1; i >= 0; i--) drawPlate(plates[i]);
  drawPorter();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = DEEPBLUE;
  ctx.fillRect(0, 0, W, H);
  // contain-fit: the vertical composition keeps its shape, centred,
  // the page ground around it the same deep blue
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
