<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№13 · Pack</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ecdc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(60,54,44,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(242,236,220,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another pack</div>
<script>
'use strict';
// No13 Pack.
// Circle packing under one strict rule: circles are offered largest
// first, each at a seeded random spot, and a circle is placed only if
// it overlaps nothing already placed and stays inside the square.
// Radii descend until the offers run out. Flat Bauhaus colors (black,
// red, yellow, blue) on cream, fully opaque, no strokes: the packing
// density and the size falloff are the composition. A seed is only
// accepted if the final coverage lands in a set band, so the square
// is neither choked nor sparse.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '13', 10) || 13;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f2ecdc';
const COLORS = ['#1d1a14', '#b3402a', '#d9a821', '#2b4d9b', '#1d1a14', '#2b4d9b'];

function compose(s) {
  const rnd = mulberry32(s);
  const circles = [];
  let area = 0;
  const GAP = 0.004;
  let misses = 0;
  for (let offer = 0; offer < 2600 && misses < 500; offer++) {
    const t = offer / 2600;
    const r = 0.155 * Math.pow(0.07, t) * (0.75 + rnd() * 0.45);
    const x = r + rnd() * (1 - 2 * r);
    const y = r + rnd() * (1 - 2 * r);
    let ok = true;
    for (const c of circles) {
      if (Math.hypot(c.x - x, c.y - y) < c.r + r + GAP) { ok = false; break; }
    }
    if (ok) {
      circles.push({ x, y, r, ci: (rnd() * COLORS.length) | 0 });
      area += Math.PI * r * r;
      misses = 0;
    } else {
      misses++;
    }
  }
  return { circles, coverage: area, ok: area > 0.42 && area < 0.78 };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best || Math.abs(p.coverage - 0.58) < Math.abs(best.coverage - 0.58)) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h) * 0.92;
  const ox = (w - S) / 2, oy = (h - S) / 2;
  for (const c of p.circles) {
    ctx.fillStyle = COLORS[c.ci];
    ctx.beginPath();
    ctx.arc(ox + c.x * S, oy + c.y * S, c.r * S, 0, Math.PI * 2);
    ctx.fill();
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
