<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equal Rights Grid</title>
<style>
html, body { margin: 0; padding: 0; background: #FAF7F0; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#FAF7F0';
var RED = '#E30613';
var YELLOW = '#FFD500';
var BLUE = '#0038D0';
var INK = '#111111';
var PLATE = '#FAF7F0';
var PLATE_LINE = '#111111';
var PERIOD = 24;
var FRAME_T = 6.0;
var COLS = 12, ROWS = 9, CELLS = 108, PER_COLOR = 36;
var COLORS = [RED, YELLOW, BLUE];
var COLOR_NAMES = ['R', 'Y', 'B'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1814);
var phaseT = FRAME_T;
/* ---- the grid as data: each cell holds an assigned color and a tilt ---- */
var CELLS_DATA = [];
(function () {
  var i;
  for (i = 0; i < CELLS; i++) {
    CELLS_DATA.push({
      assigned: i % 3,
      tilt: (rng() - 0.5) * 0.42
    });
  }
})();
/* ---- the chance procedure: seeded, fixed. Four color swaps, one recolor,
   one re-tilted row. The swaps are tally-neutral; the single recolor is
   the disturbance, and the re-balance restores it. ---- */
var SWAPS = [];
(function () {
  var used = {}, a, b, k;
  for (k = 0; k < 4; k++) {
    do { a = Math.floor(rng() * CELLS); } while (used[a]);
    used[a] = true;
    do { b = Math.floor(rng() * CELLS); } while (used[b] || CELLS_DATA[b].assigned === CELLS_DATA[a].assigned);
    used[b] = true;
    SWAPS.push([a, b]);
  }
})();
var RECOLOR_CELL = 40;
var TILT_ROW = 4;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- pure function of phase time: filled count and disturbance amount ---- */
function filledCount(t) {
  if (t < 12) return Math.floor((t / 12) * CELLS);
  return CELLS;
}
/* disturb: 0 before the event, 1 while it holds, easing back to 0 by t=24 */
function disturbAmt(t) {
  if (t < 14) return 0;
  if (t < 18) return 1;
  if (t < 21) return 1;
  if (t < 24) return 1 - (t - 21) / 3;
  return 0;
}
/* recolor: wrong color while the disturbance holds, restored at t=21 */
function recolorOn(t) { return t >= 14 && t < 21; }
function cellColor(i, t) {
  var c = CELLS_DATA[i].assigned;
  var d = disturbAmt(t);
  if (d > 0) {
    var s, j;
    for (s = 0; s < SWAPS.length; s++) {
      if (SWAPS[s][0] === i) c = CELLS_DATA[SWAPS[s][1]].assigned;
      else if (SWAPS[s][1] === i) c = CELLS_DATA[SWAPS[s][0]].assigned;
    }
    if (i === RECOLOR_CELL && recolorOn(t)) c = (c + 1) % 3;
  }
  return c;
}
function cellTilt(i, t) {
  var tilt = CELLS_DATA[i].tilt;
  var row = Math.floor(i / COLS);
  if (row === TILT_ROW) tilt += disturbAmt(t) * 0.45;
  return tilt;
}
function tallies(t) {
  var n = filledCount(t);
  var counts = [0, 0, 0];
  var i;
  for (i = 0; i < n; i++) counts[cellColor(i, t)]++;
  return { filled: n, counts: counts };
}
function drawBlob(cx, cy, rx, ry, tilt, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(rx, 0);
  ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  ctx.fill();
  /* egg tip: a small offset cap so the blob reads as an egg, not a disc */
  ctx.beginPath();
  ctx.moveTo(rx * 0.55, 0);
  ctx.ellipse(rx * 0.28, 0, rx * 0.42, ry * 0.62, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function draw() {
  size();
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  var cw = VW / COLS, ch = VH / ROWS;
  var n = filledCount(phaseT);
  var i, col, row, cx, cy;
  var bR = Math.min(cw, ch);
  for (i = 0; i < n; i++) {
    col = i % COLS; row = Math.floor(i / COLS);
    cx = (col + 0.5) * cw; cy = (row + 0.5) * ch;
    drawBlob(cx, cy, cw * 0.38, Math.min(ch * 0.30, cw * 0.55), cellTilt(i, phaseT), COLORS[cellColor(i, phaseT)]);
  }
  /* thin black grid lines over the field */
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (i = 0; i <= COLS; i++) { ctx.moveTo(i * cw + 0.5, 0); ctx.lineTo(i * cw + 0.5, VH); }
  for (i = 0; i <= ROWS; i++) { ctx.moveTo(0, i * ch + 0.5); ctx.lineTo(VW, i * ch + 0.5); }
  ctx.stroke();
  drawPlates();
}
function drawPlates() {
  var tal = tallies(phaseT);
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  var pad = 12;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  /* counter plate width first: measure the tally row as actually drawn
     (chip + gap + label, per color) so nothing is clipped at the edge */
  var countStr = 'COUNT ' + String(tal.filled).padStart(3, '0') + ' / 108';
  var chip = smallPx - 2;
  ctx.font = 'bold ' + smallPx + 'px monospace';
  var countW = ctx.measureText(countStr).width;
  var rowW = 0, k;
  for (k = 0; k < 3; k++) {
    rowW += chip + 4 + ctx.measureText(COLOR_NAMES[k] + ' ' + tal.counts[k]).width + 8;
  }
  rowW -= 8;
  var cPlateW = Math.max(countW, rowW) + 28;
  var cPlateH = smallPx * 2 + 22;
  /* title plate, top left: shrink until both plates fit side by side */
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var titleW = ctx.measureText('Equal Rights Grid').width;
  while (titlePx > 10 && (titleW + 28 + pad * 2 + 12 + cPlateW > VW || titleW > VW - 220)) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
    titleW = ctx.measureText('Equal Rights Grid').width;
  }
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 30').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var px = pad, py = pad;
  ctx.fillStyle = PLATE;
  ctx.fillRect(px, py, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 0.5, py + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Equal Rights Grid', px + 14, py + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2006 · 12 · 30', px + 14, py + 7 + titlePx + 3);
  /* counter plate, top right: running count and the three tallies */
  var cx0 = VW - cPlateW - pad, cy0 = pad;
  ctx.fillStyle = PLATE;
  ctx.fillRect(cx0, cy0, cPlateW, cPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(cx0 + 0.5, cy0 + 0.5, cPlateW - 1, cPlateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + smallPx + 'px monospace';
  ctx.fillText(countStr, cx0 + 14, cy0 + 7);
  /* tally row with color chips */
  var tx = cx0 + 14, ty = cy0 + 7 + smallPx + 4;
  for (k = 0; k < 3; k++) {
    ctx.fillStyle = COLORS[k];
    ctx.fillRect(tx, ty, chip, chip);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1;
    ctx.strokeRect(tx + 0.5, ty + 0.5, chip - 1, chip - 1);
    tx += chip + 4;
    ctx.fillStyle = INK;
    ctx.font = 'bold ' + smallPx + 'px monospace';
    var s = COLOR_NAMES[k] + ' ' + tal.counts[k];
    ctx.fillText(s, tx, ty);
    tx += ctx.measureText(s).width + 8;
  }
  /* hint plate, bottom left */
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hPlateW = hintW + 24;
  var hPlateH = smallPx + 14;
  var hx = pad, hy = VH - hPlateH - pad;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hx, hy, hPlateW, hPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hx + 0.5, hy + 0.5, hPlateW - 1, hPlateH - 1);
  ctx.fillStyle = INK;
  ctx.fillText(hint, hx + 12, hy + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    talliesAt: function (t) { return tallies(t); },
    gridInfo: function () {
      return { cols: COLS, rows: ROWS, cells: CELLS, perColor: PER_COLOR,
        swaps: SWAPS, recolorCell: RECOLOR_CELL, tiltRow: TILT_ROW };
    },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 6.0 s, grid half filled, tallies 18/18/18 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
