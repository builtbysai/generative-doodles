<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8470;8962 &middot; Reverse Lookup</title>
<style>
  :root{ --ink:#14161c; --paper:#f2ead8; --verm:#e2482e; --brass:#c9a24a; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--paper);
       -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  #plate{position:absolute;top:14px;left:18px;pointer-events:none;user-select:none;
    font-size:13px;letter-spacing:.14em;color:rgba(242,234,216,.62);text-transform:uppercase}
  #plate b{color:var(--paper);font-weight:700}
  #rule{position:absolute;top:36px;left:18px;pointer-events:none;user-select:none;
    font-size:11px;letter-spacing:.08em;color:rgba(242,234,216,.42);max-width:60vw;line-height:1.5}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="plate"><b>&#8470;8962</b> &middot; Reverse Lookup</div>
  <div id="rule">the system inverts its own table &middot; grammar: never three in a row of one temperature</div>
</div>
<script>
"use strict";
/* Seed 266 "Reverse Lookup": the piece inverts its own parameter table.
   Drag across the spectrum: the piece finds the nearest table entries by
   hue, ranks them by simplicity, then applies the system grammar. The
   grammar veto is drawn in red, struck through, with its reason named;
   the surviving simplest entry wins and is stamped into the history. */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromURL(){
  const m = /[?&]seed=(\d+)/.exec(location.search);
  return m ? (parseInt(m[1],10) >>> 0) : ((Math.random()*1e9)|0);
}
let SEED = seedFromURL();
let rnd = mulberry32(SEED);

// the system table: 16 entries, hue / saturation / lightness / temperature / name
const ANCHORS = [0,60,120,180,240,300];
const TABLE = [
  ['Ember',   8, 72, 52, 'warm'], ['Clay',   24, 48, 46, 'warm'],
  ['Honey',   44, 78, 58, 'warm'], ['Moss',   84, 42, 40, 'cool'],
  ['Fern',   128, 46, 42, 'cool'], ['Tide',   172, 52, 48, 'cool'],
  ['Slate',  208, 34, 44, 'cool'], ['Dusk',   248, 48, 50, 'cool'],
  ['Plum',   288, 52, 46, 'cool'], ['Rose',   330, 62, 58, 'warm'],
  ['Rust',    16, 66, 44, 'warm'], ['Copper',  32, 70, 52, 'warm'],
  ['Kelp',   104, 38, 36, 'cool'], ['Ash',    220, 18, 60, 'cool'],
  ['Bone',    52, 30, 78, 'warm'], ['Ivory',   40, 22, 88, 'warm']
].map(e=>{
  const hd = Math.min(...ANCHORS.map(a=>Math.abs(((e[1]-a+540)%360)-180)));
  const simplicity = Math.round(hd + Math.abs(e[2]-62)*0.6);
  return {name:e[0], h:e[1], s:e[2], l:e[3], temp:e[4], simp:simplicity,
          css:'hsl('+e[1]+','+e[2]+'%,'+e[3]+'%)'};
});
TABLE.sort((a,b)=> a.simp-b.simp);
TABLE.forEach((e,i)=> e.rank = i+1);

let W=0,H=0,DPR=1;
let px=-1, py=-1, dragging=false;
let history=[];   // last picks, for the grammar
let lookup=null;  // current lookup result

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

function hueDist(a,b){
  const d = Math.abs(a-b)%360;
  return d>180 ? 360-d : d;
}

function doLookup(x){
  const targetHue = Math.max(0, Math.min(359.9, x/W*360));
  const cands = TABLE.map(e=>({e:e, d:hueDist(e.h, targetHue)}))
    .sort((a,b)=> a.d-b.d).slice(0,4)
    .sort((a,b)=> a.e.rank-b.e.rank);   // ranked by simplicity
  // grammar: never three in a row of one temperature
  const last2 = history.slice(-2).map(h=>h.temp);
  let winner = null, vetoed = [];
  for(const c of cands){
    if(last2.length===2 && last2[0]===c.e.temp && last2[1]===c.e.temp){
      vetoed.push({c:c, reason:'would make 3 '+c.e.temp+' in a row'});
    } else if(!winner){
      winner = c;
    }
  }
  if(!winner){ winner = cands[0]; vetoed = []; }  // grammar exhausted: simplest wins
  lookup = {targetHue:targetHue, cands:cands, winner:winner, vetoed:vetoed};
  if(history.length===0 || history[history.length-1] !== winner.e){
    history.push(winner.e);
    if(history.length>10) history.shift();
  }
}

function draw(now){
  const t = now/1000;
  ctx.fillStyle = '#14161c';
  ctx.fillRect(0,0,W,H);

  const stripY = H*0.16, stripH = Math.max(56, H*0.13);

  // the spectrum strip
  const g = ctx.createLinearGradient(0,0,W,0);
  for(let h=0;h<=360;h+=15) g.addColorStop(h/360, 'hsl('+h+',64%,54%)');
  ctx.fillStyle = g;
  ctx.fillRect(0, stripY, W, stripH);
  ctx.strokeStyle = 'rgba(242,234,216,0.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, stripY+0.5, W-1, stripH-1);
  ctx.fillStyle = 'rgba(242,234,216,0.55)';
  ctx.font = '400 11px "Avenir Next","Segoe UI",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('drag across the spectrum · the table answers', W/2, stripY+stripH+20);

  // pointer marker
  if(lookup){
    const mx = lookup.targetHue/360*W;
    ctx.strokeStyle = '#f2ead8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mx, stripY-8); ctx.lineTo(mx, stripY+stripH+8); ctx.stroke();
  }

  const panelY = stripY+stripH+44;
  if(!lookup){
    ctx.fillStyle = 'rgba(242,234,216,0.4)';
    ctx.font = '400 14px "Avenir Next","Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('touch the spectrum to begin the lookup', W/2, panelY+40);
  } else {
    const win = lookup.winner.e;
    // winner swatch
    const sw = Math.min(W*0.86, 460), sh = Math.max(72, H*0.11);
    const sx = W/2-sw/2, sy = panelY;
    ctx.fillStyle = win.css;
    ctx.fillRect(sx, sy, sw, sh);
    ctx.strokeStyle = 'rgba(242,234,216,0.6)'; ctx.lineWidth = 1;
    ctx.strokeRect(sx+0.5, sy+0.5, sw-1, sh-1);
    ctx.fillStyle = 'rgba(20,22,28,0.78)';
    ctx.font = '700 '+Math.max(15,Math.min(20,sw*0.045))+'px "Avenir Next","Segoe UI",sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(win.name+'  ·  simplicity rank '+win.rank+' of 16', sx+16, sy+sh/2-2);
    ctx.font = '400 12px "Avenir Next","Segoe UI",sans-serif';
    ctx.fillText('hsl('+win.h+', '+win.s+'%, '+win.l+'%) · '+win.temp, sx+16, sy+sh/2+20);

    // the ranked ladder with vetoes
    let ly = sy+sh+26;
    ctx.font = '400 13px "Avenir Next","Segoe UI",sans-serif';
    ctx.fillStyle = 'rgba(242,234,216,0.5)';
    ctx.textAlign = 'left';
    ctx.fillText('ranked by simplicity:', sx, ly);
    ly += 22;
    for(const c of lookup.cands){
      const v = lookup.vetoed.find(v=> v.c === c);
      const isWin = (c === lookup.winner);
      // chip
      ctx.fillStyle = c.e.css;
      ctx.fillRect(sx, ly-12, 34, 16);
      ctx.strokeStyle = 'rgba(242,234,216,0.4)'; ctx.lineWidth = 1;
      ctx.strokeRect(sx+0.5, ly-11.5, 33, 15);
      const label = '#'+c.e.rank+' '+c.e.name+'  ('+c.d.toFixed(1)+'° away)';
      if(v){
        ctx.fillStyle = '#e2482e';
        ctx.fillText(label, sx+44, ly);
        const tw = ctx.measureText(label).width;
        ctx.strokeStyle = '#e2482e'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx+44, ly-4); ctx.lineTo(sx+44+tw, ly-4); ctx.stroke();
        ctx.font = '400 11px "Avenir Next","Segoe UI",sans-serif';
        ctx.fillText('vetoed: '+v.reason, sx+44, ly+16);
        ctx.font = '400 13px "Avenir Next","Segoe UI",sans-serif';
        ly += 40;
      } else {
        ctx.fillStyle = isWin ? '#c9a24a' : 'rgba(242,234,216,0.75)';
        ctx.fillText(label+(isWin ? '  ← answer' : ''), sx+44, ly);
        ly += 26;
      }
      if(ly > H-96) break;
    }
  }

  // history strip
  const hy = H - Math.max(44, H*0.075);
  ctx.fillStyle = 'rgba(242,234,216,0.4)';
  ctx.font = '400 11px "Avenir Next","Segoe UI",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('history', 18, hy-8);
  let hx = 18;
  for(const h of history.slice(-10)){
    ctx.fillStyle = h.css;
    ctx.fillRect(hx, hy, 30, 22);
    ctx.strokeStyle = 'rgba(242,234,216,0.35)'; ctx.lineWidth = 1;
    ctx.strokeRect(hx+0.5, hy+0.5, 29, 21);
    hx += 36;
    if(hx > W-40) break;
  }

  requestAnimationFrame(draw);
}

function onPoint(e){
  px = e.clientX; py = e.clientY;
  doLookup(px);
}
canvas.addEventListener('pointerdown', e=>{ dragging=true; canvas.setPointerCapture(e.pointerId); onPoint(e); });
canvas.addEventListener('pointermove', e=>{ if(dragging) onPoint(e); });
canvas.addEventListener('pointerup', ()=>{ dragging=false; });
canvas.addEventListener('pointercancel', ()=>{ dragging=false; });

resize();
doLookup(W*0.35);   // an honest starting answer, dragging updates it
requestAnimationFrame(draw);
</script>
</body>
</html>
