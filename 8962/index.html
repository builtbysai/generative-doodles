<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reverse Lookup — No.8962</title>
<!-- phantom-fill-8962 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#111110; color:#e8e4da; overflow:hidden; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display:flex; flex-direction:column; padding:20px 26px 0;
    -webkit-user-select:none; user-select:none;
  }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  header h1 { font-size:12px; font-weight:400; letter-spacing:.34em; text-transform:uppercase; white-space:nowrap; }
  header .meta { font-size:11px; letter-spacing:.16em; opacity:.45; white-space:nowrap; }
  .rule { height:1px; background:rgba(232,228,218,.22); margin:14px 0 0; }

  /* The spectrum: the query instrument. Drag across it. */
  #spectrum {
    position:relative; height:104px; margin-top:22px; cursor:ew-resize;
    background:linear-gradient(90deg,
      hsl(0,72%,55%), hsl(30,72%,55%), hsl(60,72%,55%), hsl(90,72%,55%),
      hsl(120,72%,55%), hsl(150,72%,55%), hsl(180,72%,55%), hsl(210,72%,55%),
      hsl(240,72%,55%), hsl(270,72%,55%), hsl(300,72%,55%), hsl(330,72%,55%),
      hsl(360,72%,55%));
    border:1px solid rgba(232,228,218,.35); touch-action:none;
  }
  #cursor {
    position:absolute; top:-9px; bottom:-9px; width:2px; background:#f5f1e6;
    box-shadow:0 0 0 1px rgba(0,0,0,.55); pointer-events:none;
  }
  #cursor::before {
    content:""; position:absolute; top:-1px; left:-4px;
    border:5px solid transparent; border-top:6px solid #f5f1e6;
  }
  .ticks { display:flex; justify-content:space-between; margin-top:7px;
    font-size:10px; letter-spacing:.14em; opacity:.45; }

  /* Query readout. */
  #readout { display:flex; align-items:baseline; gap:16px; margin-top:18px; }
  #qnum { font-family:Georgia, "Times New Roman", serif; font-size:52px; line-height:1;
    letter-spacing:-.01em; }
  #qchip { width:26px; height:26px; border:1px solid rgba(232,228,218,.5); flex:none; }
  #qname { font-size:11px; letter-spacing:.24em; text-transform:uppercase; opacity:.75; }
  #qhint { margin-left:auto; font-size:10px; letter-spacing:.14em; opacity:.4;
    text-align:right; line-height:1.7; }

  /* The ledger: palette ranked by simplicity, vetoes struck through. */
  #ledger-head, .row { display:grid;
    grid-template-columns:2.2em 1.5em 1fr 4.5em 4.5em 5.5em 4em; align-items:center; }
  #ledger-head { margin-top:20px; padding-bottom:7px;
    border-bottom:1px solid rgba(232,228,218,.3);
    font-size:10px; letter-spacing:.2em; text-transform:uppercase; opacity:.5; }
  #ledger { position:relative; flex:1; margin-top:2px; }
  .row {
    position:absolute; left:0; right:0; height:31px; cursor:pointer;
    border-bottom:1px solid rgba(232,228,218,.08);
    transition:top .45s cubic-bezier(.22,1,.36,1), opacity .3s;
    font-size:12px; letter-spacing:.06em;
  }
  .row:hover { background:rgba(232,228,218,.06); }
  .row .rank { opacity:.45; font-size:11px; }
  .row .sw { width:13px; height:13px; border:1px solid rgba(0,0,0,.4); }
  .row .nm { letter-spacing:.14em; text-transform:uppercase; font-size:11px; }
  .row .hu, .row .iv, .row .sc { text-align:right; font-size:11px; opacity:.8; }
  .row .tag { text-align:right; font-size:10px; letter-spacing:.18em; opacity:0; }
  .row.veto { opacity:.55; }
  .row.veto .nm, .row.veto .hu, .row.veto .iv, .row.veto .sc {
    text-decoration:line-through; text-decoration-thickness:1px; }
  .row.veto .tag { opacity:1; color:#e0684f; }
  .row.top1 .nm { color:#f5f1e6; font-weight:700; }

  .label { display:flex; justify-content:space-between; align-items:baseline;
    padding:12px 0 16px; font-size:11px; letter-spacing:.18em; }
  .label .t { text-transform:uppercase; letter-spacing:.28em; opacity:.85; white-space:nowrap; }
  .label .n { opacity:.45; text-align:right; }

  @media (max-width:640px) {
    body { padding:14px 14px 0; }
    header h1 { font-size:11px; letter-spacing:.22em; }
    header .meta { font-size:10px; letter-spacing:.08em; }
    #spectrum { height:76px; margin-top:16px; }
    #qnum { font-size:36px; }
    #qhint { display:none; }
    #ledger-head, .row { grid-template-columns:1.8em 1.2em 1fr 3.6em 3.6em 4.2em 3.4em; }
    .label { font-size:10px; letter-spacing:.1em; }
    .label .t { letter-spacing:.18em; }
  }
</style>
</head>
<body>
<header>
  <h1>Reverse Lookup</h1>
  <span class="meta">No. 8962 &middot; 2026 &middot; 07 &middot; 26</span>
</header>
<div class="rule"></div>

<div id="spectrum" title="Drag to set the query hue"><div id="cursor"></div></div>
<div class="ticks"><span>0&deg; RED</span><span>60&deg;</span><span>120&deg;</span><span>180&deg;</span><span>240&deg;</span><span>300&deg;</span><span>360&deg;</span></div>

<div id="readout">
  <span id="qnum">214&deg;</span>
  <span id="qchip"></span>
  <span id="qname">Cobalt</span>
  <span id="qhint">ranked by harmonic interval from the query<br>
  within 6&deg; of a dissonant step &rarr; vetoed</span>
</div>

<div id="ledger-head"><span>#</span><span></span><span>Colour</span><span>Hue</span><span>Int.</span><span>Simpl.</span><span></span></div>
<div id="ledger"></div>

<div class="label"><span class="t">Reverse Lookup</span><span class="n">No. 8962 &middot; drag the spectrum &middot; click a colour to look it up</span></div>

<script>
(function () {
  // Palette: twelve fixed hues, paint names, spread across the wheel.
  const PAL = [
    { name: 'Vermilion',  h: 8   },
    { name: 'Amber',      h: 36  },
    { name: 'Ochre',      h: 47  },
    { name: 'Chartreuse', h: 78  },
    { name: 'Sage',       h: 108 },
    { name: 'Emerald',    h: 140 },
    { name: 'Teal',       h: 176 },
    { name: 'Cobalt',     h: 214 },
    { name: 'Ultramarine',h: 244 },
    { name: 'Violet',     h: 272 },
    { name: 'Magenta',    h: 312 },
    { name: 'Rose',       h: 342 }
  ];
  const SIMPLE = [0, 30, 60, 90, 120, 150, 180];   // harmonic intervals
  const DISSON = [15, 45, 75, 105, 135, 165];      // dissonant steps
  const ANCHORS = [[0,'Red'],[60,'Yellow'],[120,'Green'],[180,'Cyan'],[240,'Blue'],[300,'Magenta']];
  let ROW_H = 31;

  const spectrum = document.getElementById('spectrum');
  const cursor = document.getElementById('cursor');
  const qnum = document.getElementById('qnum');
  const qchip = document.getElementById('qchip');
  const qname = document.getElementById('qname');
  const ledger = document.getElementById('ledger');

  let query = 214; // start on Cobalt

  function angDiff(a, b) { // signed, -180..180
    let d = (a - b) % 360;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    return d;
  }
  function nearestGap(abs, table) {
    let best = 180;
    for (const t of table) best = Math.min(best, Math.abs(abs - t));
    return best;
  }
  function anchorName(h) {
    let best = ANCHORS[0], bd = 180;
    for (const a of ANCHORS) {
      const d = Math.abs(angDiff(h, a[0]));
      if (d < bd) { bd = d; best = a; }
    }
    return best[1];
  }

  // Build rows once; re-rank by moving them.
  const rows = PAL.map(function (c) {
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = '<span class="rank"></span><span class="sw"></span>' +
      '<span class="nm"></span><span class="hu"></span><span class="iv"></span>' +
      '<span class="sc"></span><span class="tag">VETO</span>';
    el.querySelector('.sw').style.background = 'hsl(' + c.h + ',72%,55%)';
    el.querySelector('.nm').textContent = c.name;
    el.querySelector('.hu').textContent = c.h + '°';
    el.addEventListener('click', function () { setQuery(c.h); });
    ledger.appendChild(el);
    return { c: c, el: el };
  });

  function rank() {
    const scored = rows.map(function (r) {
      const iv = angDiff(r.c.h, query);
      const abs = Math.abs(iv);
      return { r: r, iv: iv, score: nearestGap(abs, SIMPLE),
               veto: nearestGap(abs, DISSON) <= 6 };
    });
    // Vetoed sink to the bottom, struck through; the rest rank by simplicity.
    scored.sort(function (a, b) {
      if (a.veto !== b.veto) return a.veto ? 1 : -1;
      return a.score - b.score || Math.abs(a.iv) - Math.abs(b.iv);
    });
    scored.forEach(function (s, i) {
      const el = s.r.el;
      el.style.top = (i * ROW_H) + 'px';
      el.style.height = ROW_H + 'px';
      el.classList.toggle('veto', s.veto);
      el.classList.toggle('top1', i === 0 && !s.veto);
      el.querySelector('.rank').textContent = String(i + 1).padStart(2, '0');
      el.querySelector('.iv').textContent =
        (s.iv > 0 ? '+' : s.iv < 0 ? '−' : '±') + Math.abs(Math.round(s.iv)) + '°';
      el.querySelector('.sc').textContent = s.score.toFixed(1) + '°';
    });
    window.__rankOrder = scored.map(function (s) { return s.r.c.name; });
    window.__vetoes = scored.filter(function (s) { return s.veto; })
                            .map(function (s) { return s.r.c.name; });
  }

  function setQuery(h) {
    query = ((Math.round(h) % 360) + 360) % 360;
    cursor.style.left = (query / 360 * 100) + '%';
    qnum.innerHTML = query + '&deg;';
    qchip.style.background = 'hsl(' + query + ',72%,55%)';
    qname.textContent = 'near ' + anchorName(query);
    rank();
  }

  // Drag across the spectrum.
  let dragging = false;
  function hueFromEvent(e) {
    const r = spectrum.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 360;
  }
  spectrum.addEventListener('pointerdown', function (e) {
    dragging = true;
    spectrum.setPointerCapture(e.pointerId);
    setQuery(hueFromEvent(e));
  });
  spectrum.addEventListener('pointermove', function (e) {
    if (dragging) setQuery(hueFromEvent(e));
  });
  spectrum.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') setQuery(query - 1);
    if (e.key === 'ArrowRight') setQuery(query + 1);
  });

  function layoutRows() {
    const h = ledger.clientHeight;
    ROW_H = Math.max(28, Math.min(44, Math.floor(h / 12)));
    rank();
  }
  window.addEventListener('resize', layoutRows);

  setQuery(query);
  layoutRows();
})();
</script>
</body>
</html>
