<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hanan Pacha</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #070912; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict, six tones, no more)
  var COSMIC = '#070912';   // cosmic black: top edge, underworld, page ground
  var INDIGO = '#1A1F3D';   // deep indigo stratum
  var LAPIS  = '#2B3A7A';   // lapis stratum, the lower sky
  var MASS   = '#E8E2D0';   // condor mass, pale, always at low alpha
  var GOLD   = '#D9A441';   // gold dust
  var CINNABAR = '#C0392B'; // one small disc only

  var BASE_SEED = 658001;
  var LOOP = 48; // seconds, one full glide

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, isPhone = false;

  // ------------------------------------------------------------------
  // Sky strata. Three flat bands (cosmic top edge, deep indigo, lapis
  // below) separated by ragged ridge lines. A ridge is a sum of sine
  // waves over x/W whose phases advance by whole cycles per loop:
  //   y = base + A * sin(2*pi*(k*x/W - m*p) + phi),  m integer
  // so each boundary drifts sideways at its own slow rate and the
  // pattern at phase 1 is exactly the pattern at phase 0. No
  // gradients anywhere: the bands are flat fills, the raggedness is
  // in the boundary geometry.
  // ------------------------------------------------------------------
  var ridges = []; // {baseF, waves:[{aF, k, m, phi}]}
  var dust = [];   // {xf, yf, r, a, driftA, driftP, cycles}

  function buildSky() {
    var rng = mulberry32(BASE_SEED);
    function ridge(baseF, defs) {
      var waves = [];
      for (var i = 0; i < defs.length; i++) {
        waves.push({
          aF: defs[i][0] * (0.85 + rng() * 0.3),
          k: defs[i][1],
          m: defs[i][2],
          phi: rng() * Math.PI * 2
        });
      }
      return { baseF: baseF, waves: waves };
    }
    ridges = [
      ridge(0.10, [[0.010, 3.0, 1], [0.006, 6.5, 2]]),  // cosmic / indigo
      ridge(0.38, [[0.016, 1.6, 1], [0.007, 3.7, 2]]),  // indigo / lapis
      ridge(0.80, [[0.012, 2.4, 1], [0.005, 5.1, 2]])   // lapis / underworld
    ];
    dust = [];
    for (var i = 0; i < 84; i++) {
      dust.push({
        xf: rng(),
        yf: 0.03 + rng() * 0.74,
        r: 0.7 + rng() * 1.5,
        a: 0.22 + rng() * 0.45,
        driftA: 3 + rng() * 9,               // px of slow sway
        driftP: rng() * Math.PI * 2,
        cycles: rng() < 0.5 ? 1 : 2          // whole cycles per loop
      });
    }
  }

  function ridgeY(r, x, p) {
    var y = r.baseF * H;
    for (var i = 0; i < r.waves.length; i++) {
      var w = r.waves[i];
      y += w.aF * H * Math.sin(2 * Math.PI * (w.k * (x / W) - w.m * p) + w.phi);
    }
    return y;
  }

  function fillBand(rTop, rBot, color, p) {
    ctx.fillStyle = color;
    ctx.beginPath();
    var step = Math.max(6, W / 160);
    var x, y;
    if (rTop) { y = ridgeY(rTop, 0, p); ctx.moveTo(0, y); for (x = step; x <= W; x += step) ctx.lineTo(x, ridgeY(rTop, x, p)); ctx.lineTo(W, ridgeY(rTop, W, p)); }
    else { ctx.moveTo(0, 0); ctx.lineTo(W, 0); }
    if (rBot) { ctx.lineTo(W, ridgeY(rBot, W, p)); for (x = W - step; x >= 0; x -= step) ctx.lineTo(x, ridgeY(rBot, x, p)); ctx.lineTo(0, ridgeY(rBot, 0, p)); }
    else { ctx.lineTo(W, H); ctx.lineTo(0, H); }
    ctx.closePath();
    ctx.fill();
  }

  // ------------------------------------------------------------------
  // The condor presence. Not an outline bird: a wingspan read as a
  // lighter mass against the dark. The mass is seeded blotches
  // (irregular discs, pale, low alpha, layered so the core gathers
  // density) laid along two wing midlines and a body lens, over a
  // very faint silhouette wash. From each wing's spine, individual
  // feather barbs fan out: thin bezier strokes whose angle ripples
  // by a degree or two on a 3 s cycle, phase-staggered along the
  // wing, so a slow ripple travels the feathers instead of a flap.
  //
  // The presence crosses on a 48 s phase-locked loop. Its alpha
  // envelope fades it out as it leaves at the right during the last
  // fifth, while a second instance of the same seeded presence fades
  // in at the left edge on the same schedule, so phase 1 is phase 0
  // exactly: the glide never cuts.
  // ------------------------------------------------------------------
  var blotches = []; // {side:-1|0|1, u, off, rF, a, jag:[7]}
  var barbs = [];    // {side, u, lenF, ang, jit}
  var BARBS_PER_WING = 26;

  function buildCondor() {
    var rng = mulberry32(BASE_SEED + 7);
    blotches = [];
    var side, i, u;
    for (side = -1; side <= 1; side += 2) {
      for (i = 0; i < 40; i++) {
        u = (i + 0.5) / 40 + (rng() - 0.5) * 0.03;
        var jag = [];
        for (var j = 0; j < 9; j++) jag.push(0.80 + rng() * 0.40);
        blotches.push({
          side: side, u: Math.max(0.02, Math.min(0.99, u)),
          off: (rng() - 0.5) * 0.9,
          rF: 0.45 + rng() * 0.9,
          a: 0.075 + rng() * 0.065,
          jag: jag
        });
      }
    }
    for (i = 0; i < 16; i++) { // body: a compact mass hanging below the wing line
      var jagb = [];
      for (var jb = 0; jb < 9; jb++) jagb.push(0.80 + rng() * 0.40);
      blotches.push({
        side: 0, u: (rng() - 0.5) * 0.09,
        off: (rng() - 0.5) * 0.55,
        rF: 0.55 + rng() * 0.7,
        a: 0.09 + rng() * 0.07,
        jag: jagb
      });
    }
    barbs = [];
    for (side = -1; side <= 1; side += 2) {
      for (i = 0; i < BARBS_PER_WING; i++) {
        u = 0.05 + 0.93 * (i / (BARBS_PER_WING - 1));
        barbs.push({
          side: side, u: u,
          lenF: 0.8 + rng() * 0.4,
          jit: (rng() - 0.5) * 0.10
        });
      }
    }
  }

  // Wing midline in bird-local px (half-span s, center cy0). The
  // wings rise from the body in a shallow gull dihedral, flatten
  // toward the tips, and droop a touch at the very end.
  function wingPoint(side, u, s, cy0) {
    var lift = 0.075 * H * Math.pow(Math.sin(Math.PI * 0.5 * u), 1.1);
    var droop = u > 0.85 ? 0.02 * H * Math.pow((u - 0.85) / 0.15, 2) : 0;
    return [side * s * u, cy0 - lift + droop];
  }
  function chord(u) { return H * (0.088 * (1 - 0.62 * u) + 0.010); }

  function envelopeA(p) {
    if (p < 0.12) return 0.5 + 0.5 * (p / 0.12);
    if (p < 0.74) return 1;
    if (p < 0.95) return 1 - (p - 0.74) / 0.21;
    return 0;
  }
  function envelopeB(p) { // the next presence condensing at the left
    if (p < 0.90) return 0;
    return 0.5 * ((p - 0.90) / 0.10);
  }
  function centerX(p) { return W * (-0.16 + 1.34 * p); }

  function blobPath(cx, cy, r, jag) {
    ctx.beginPath();
    for (var j = 0; j < 9; j++) {
      var ang = (j / 9) * Math.PI * 2;
      var rr = r * jag[j];
      var x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr * 0.82;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function drawPresence(cx, alphaScale, t, p) {
    if (alphaScale <= 0.003) return;
    var s = W * 0.35; // half-span: the wingspan spans ~70% of width
    var cy0 = H * 0.40 + 0.01 * H * Math.sin(2 * Math.PI * 2 * p);
    var i, b, pt;

    // Faint silhouette wash under the blotches: two wing shapes and
    // the body lens, flat pale at very low alpha.
    ctx.fillStyle = MASS;
    ctx.globalAlpha = 0.075 * alphaScale;
    for (var side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      var steps = 18;
      for (i = 0; i <= steps; i++) {
        pt = wingPoint(side, i / steps, s, cy0);
        var lx = cx + pt[0], ly = pt[1] - chord(i / steps) * 0.5;
        if (i === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
      }
      for (i = steps; i >= 0; i--) {
        pt = wingPoint(side, i / steps, s, cy0);
        ctx.lineTo(cx + pt[0], pt[1] + chord(i / steps) * 0.5);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.beginPath();
    ctx.ellipse(cx, cy0 + H * 0.024, W * 0.048, H * 0.046, 0, 0, Math.PI * 2);
    ctx.fill();

    // Blotch mass, drawn twice per blotch (full radius, then a
    // smaller denser core) so the pale gathers softly.
    for (var pass = 0; pass < 2; pass++) {
      var shrink = pass === 0 ? 1 : 0.6;
      for (i = 0; i < blotches.length; i++) {
        b = blotches[i];
        var bx, by, br;
        if (b.side === 0) {
          bx = cx + b.u * W;
          by = cy0 + H * 0.026 + b.off * H * 0.022;
          br = H * 0.040 * b.rF;
        } else {
          pt = wingPoint(b.side, b.u, s, cy0);
          bx = cx + pt[0];
          by = pt[1] + b.off * chord(b.u) * 0.62;
          br = chord(b.u) * 0.62 * b.rF;
        }
        ctx.globalAlpha = b.a * alphaScale;
        blobPath(bx, by, br * shrink, b.jag);
        ctx.fill();
      }
    }

    // Feather barbs fanning from each wing spine.
    ctx.strokeStyle = MASS;
    ctx.lineCap = 'round';
    for (i = 0; i < barbs.length; i++) {
      b = barbs[i];
      pt = wingPoint(b.side, b.u, s, cy0);
      var rx = cx + pt[0], ry = pt[1] + chord(b.u) * 0.30;
      var baseAng = (74 - 30 * b.u) * Math.PI / 180; // from +x axis, downward
      var fan = Math.pow(b.u, 3) * 0.38; // primaries spread hard at the tips
      var flutter = 0.031 * Math.sin(2 * Math.PI * (t / 3) - b.u * 5.0 + (b.side < 0 ? 0.7 : 0));
      var ang = baseAng - fan + b.jit * (0.6 + b.u) + flutter;
      var dx = Math.cos(ang) * b.side, dy = Math.sin(ang);
      var len = H * (0.034 + 0.085 * Math.pow(b.u, 1.6)) * b.lenF;
      var ex = rx + dx * len, ey = ry + dy * len;
      var mx = rx + dx * len * 0.5 - dy * len * 0.10;
      var my = ry + dy * len * 0.5 + dx * len * 0.10;
      ctx.globalAlpha = 0.15 * alphaScale;
      ctx.lineWidth = Math.max(1, H * 0.0016);
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.quadraticCurveTo(mx, my, ex, ey);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var p = (t % LOOP) / LOOP;
    if (p < 0) p += 1;

    ctx.fillStyle = COSMIC;
    ctx.fillRect(0, 0, W, H);
    fillBand(ridges[1], ridges[2], LAPIS, p);
    fillBand(ridges[0], ridges[1], INDIGO, p);

    // Gold dust, slowest of all: a small sinusoidal sway, whole
    // cycles per loop, so the field at phase 1 is the field at 0.
    ctx.fillStyle = GOLD;
    for (var i = 0; i < dust.length; i++) {
      var d = dust[i];
      var dx = d.driftA * Math.sin(2 * Math.PI * d.cycles * p + d.driftP);
      var dy = d.driftA * 0.4 * Math.cos(2 * Math.PI * d.cycles * p + d.driftP * 1.7);
      ctx.globalAlpha = d.a;
      ctx.beginPath();
      ctx.arc(d.xf * W + dx, d.yf * H + dy, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // The one cinnabar disc, high right.
    ctx.fillStyle = CINNABAR;
    ctx.beginPath();
    ctx.arc(W * 0.86, H * 0.15, Math.max(6, Math.min(W, H) * 0.018), 0, Math.PI * 2);
    ctx.fill();

    // The presence, and its successor condensing at the left edge
    // while the first dissolves at the right.
    drawPresence(centerX(p), envelopeA(p), t, p);
    var aB = envelopeB(p);
    if (aB > 0.003) drawPresence(centerX(p - 1), aB, t, p);
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || (sw >= 9999 && H > W * 1.15);
  }

  // Anchored elapsed clock from rAF timestamps: offset plus elapsed
  // since load. Frame one is drawn synchronously at t = 0.
  var t0 = null, lastTs = null;

  function frame(ts) {
    if (t0 === null) t0 = ts;
    lastTs = ts;
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  function redraw() {
    draw(lastTs !== null && t0 !== null ? (lastTs - t0) / 1000 : 0);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); redraw(); });
  }
  window.addEventListener('resize', function () { resize(); redraw(); });

  buildSky();
  buildCondor();
  resize();

  // QA hook: ?seed=t<seconds> freezes the piece at that elapsed time
  // so a mid-loop state can be rendered headlessly. Inert otherwise.
  var forcedT = null;
  if (typeof location !== 'undefined' && location.search) {
    var m = /t=([0-9.]+)/.exec(location.search) || /seed=t?([0-9.]+)/.exec(location.search);
    if (m) forcedT = parseFloat(m[1]);
  }
  if (forcedT !== null) {
    draw(forcedT);
  } else {
    draw(0); // frame one: presence entering at the left edge, phase 0
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
