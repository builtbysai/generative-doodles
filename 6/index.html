<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№6 · Scanline</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#060807; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(120,255,160,0.40); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.85); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another scanline</div>
<script>
'use strict';
// No6 Scanline.
// A disc drawn the way a terminal would: horizontal scanlines only,
// each line exactly as long as the circle's chord at that height, in
// one phosphor green on black. Brightness is the only modelling: rows
// brighten toward a seeded light band above center and fall off toward
// the limb, so the flat rows stack into a ball. Nothing is shaded,
// gradient-filled or outlined; the chord lengths do all the work
// (brief concept 6, scanline sun).

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '6', 10) || 6;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#060807';

function compose(s) {
  const rnd = mulberry32(s);
  const lightY = -0.45 + rnd() * 0.5;           // light band position in disc units
  const rows = 64 + ((rnd() * 20) | 0);        // 64..83 scanlines
  return { lightY, rows, ok: lightY > -0.5 && lightY < 0.1 };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.40;

  ctx.lineCap = 'round';
  for (let j = 0; j < p.rows; j++) {
    const t = -1 + ((j + 0.5) / p.rows) * 2;    // -1..1 across the disc
    const half = Math.sqrt(Math.max(0, 1 - t * t));
    if (half < 0.02) continue;
    const dLight = Math.abs(t - p.lightY);
    const bright = Math.max(0.10, 1 - dLight * 0.85);
    ctx.strokeStyle = `rgba(57,255,106,${(0.25 + bright * 0.75).toFixed(3)})`;
    ctx.lineWidth = Math.max(1, (2 * R / p.rows) * 0.62);
    ctx.beginPath();
    ctx.moveTo(cx - half * R, cy + t * R);
    ctx.lineTo(cx + half * R, cy + t * R);
    ctx.stroke();
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
