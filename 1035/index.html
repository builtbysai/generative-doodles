<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter the White</title>
<style>
  html, body { margin: 0; padding: 0; background: #0C1A1C; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  var TAU = Math.PI * 2;
  var LOOP = 50;              // seamless 50 s loop
  var T0 = 12;                // fixed frame-one phase, seconds

  // Palette (strict)
  var GALLERY = '#0C1A1C';
  var POD     = '#F4F2ED';
  var MOUTH   = '#FFEFD0';
  var HOLO    = '#7FD4FF';
  var CYL     = '#BFE9FF';
  var RINGTOP = '#FFFFFF';
  var SHADOW  = '#061012';

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, isPhone = false, FLOOR = 0.84;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 800);
    var h = vv ? vv.height : (window.innerHeight || 600);
    W = Math.max(50, Math.round(w));
    H = Math.max(50, Math.round(h));
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var smin = (sw && sh) ? Math.min(sw, sh) : 0;
    if (smin) isPhone = smin < 700;
    else isPhone = H > W * 1.15;      // aspect fallback only
    layout();
  }

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- state ----------
  var seed = 1035196;
  var pods = [];       // computed by layout() from seed-derived params
  var cyls = [];
  var podParams = [];  // seed-derived, layout-independent
  var cylParams = [];

  function deriveParams() {
    var rnd = mulberry32(seed);
    podParams = [];
    for (var i = 0; i < 3; i++) {
      podParams.push({
        xJit: (rnd() - 0.5) * 0.05,          // fraction of W
        swayPhase: rnd() * TAU,
        swayDir: i % 2 === 0 ? 1 : -1,
        driftPhX: rnd() * TAU,
        driftPhY: rnd() * TAU,
        turnPhase: rnd() * TAU,
        headR: 0.16 + rnd() * 0.03,          // figure proportions, of opening height
        shoulder: 0.30 + rnd() * 0.05,
        tone: 170 + Math.floor(rnd() * 60)   // airy tone base Hz
      });
    }
    cylParams = [];
    for (var j = 0; j < 3; j++) {
      cylParams.push({
        xJit: (rnd() - 0.5) * 0.02,
        hFrac: 0.30 + rnd() * 0.10,          // of pod height
        pulsePh: rnd() * TAU
      });
    }
  }

  // Per-pod interaction state (event-driven, closed-form in t)
  var interact = [
    { dragOff: 0, relT: -1e9, relOff: 0, clearT: -1e9 },
    { dragOff: 0, relT: -1e9, relOff: 0, clearT: -1e9 },
    { dragOff: 0, relT: -1e9, relOff: 0, clearT: -1e9 }
  ];

  function layout() {
    if (!podParams.length) deriveParams();
    pods = [];
    cyls = [];
    FLOOR = isPhone ? 0.70 : 0.84;
    var floorY = H * FLOOR;
    var podH = isPhone ? H * 0.36 : H * 0.60;
    var podW = isPhone ? Math.min(podH * 0.44, W * 0.28) : podH * 0.42;
    var centers;
    if (isPhone) centers = [0.185, 0.5, 0.815];
    else centers = [0.195, 0.455, 0.715];
    for (var i = 0; i < 3; i++) {
      var cx = W * centers[i] + W * podParams[i].xJit;
      pods.push({
        cx: cx, w: podW, h: podH,
        top: floorY - podH, floorY: floorY,
        openW: podW * 0.52, openH: podH * 0.68
      });
    }
    // The booth line: three smaller cylinders.
    var cylH = podH;
    if (isPhone) {
      var cw = podW * 0.30;
      var cylFloor = H * 0.93;
      for (var j = 0; j < 3; j++) {
        var hh = cylH * cylParams[j].hFrac * 0.8;
        cyls.push({
          cx: W * (0.36 + j * 0.14) + W * cylParams[j].xJit,
          w: cw, h: hh,
          top: cylFloor - hh, floorY: cylFloor
        });
      }
    } else {
      var cw2 = podW * 0.34;
      for (var k = 0; k < 3; k++) {
        cyls.push({
          cx: W * (0.90 + (k - 1) * 0.048) + W * cylParams[k].xJit,
          w: cw2, h: cylH * cylParams[k].hFrac,
          top: floorY - cylH * cylParams[k].hFrac, floorY: floorY
        });
      }
    }
  }

  // ---------- path helpers (no gradients, no shadowBlur, no filter) ----------
  function rrect(x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function ellipse(cx, cy, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU);
  }

  function layeredGlow(cx, cy, rx, ry, color, layers, aMax) {
    for (var i = layers; i >= 1; i--) {
      var f = i / layers;
      ctx.globalAlpha = aMax * (1 - f * 0.72);
      ctx.fillStyle = color;
      ellipse(cx, cy, rx * (0.45 + 0.55 * f), ry * (0.45 + 0.55 * f));
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- figure (minimal human silhouette, layered alpha shapes) ----------
  function drawFigure(cx, baseY, hgt, turnScale, alpha, p) {
    // hgt: figure height in px. baseY: feet line. turnScale: horizontal squash from turning.
    var headR = hgt * p.headR * 0.5;
    var headCY = baseY - hgt + headR;
    var shoulderW = hgt * p.shoulder * turnScale;
    var hipW = shoulderW * 0.62;
    var shoulderY = headCY + headR * 1.55;
    var hipY = baseY - hgt * 0.34;

    ctx.fillStyle = HOLO;
    // soft outer pass
    ctx.globalAlpha = alpha * 0.30;
    ellipse(cx, (shoulderY + baseY) / 2, shoulderW * 0.72, (baseY - shoulderY) / 2);
    ctx.fill();
    ellipse(cx, headCY, headR * 1.35, headR * 1.35);
    ctx.fill();
    // core pass
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(cx - shoulderW / 2, shoulderY);
    ctx.quadraticCurveTo(cx, shoulderY - hgt * 0.05, cx + shoulderW / 2, shoulderY);
    ctx.lineTo(cx + hipW / 2, hipY);
    ctx.quadraticCurveTo(cx + hipW * 0.42, baseY, cx + hipW * 0.30, baseY);
    ctx.lineTo(cx - hipW * 0.30, baseY);
    ctx.quadraticCurveTo(cx - hipW * 0.42, baseY, cx - hipW / 2, hipY);
    ctx.closePath();
    ctx.fill();
    ellipse(cx, headCY, headR, headR * 1.08);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ---------- pods ----------
  function podRotation(i, t) {
    // machined sway: +-8 degrees, period LOOP/2, plus drag offset (closed-form decay)
    var base = 8 * Math.sin(TAU * t / 25 + podParams[i].swayPhase) * podParams[i].swayDir;
    var st = interact[i];
    var off = st.dragOff;
    if (st.relT > -1e8) {
      var dt = t - st.relT;
      if (dt >= 0) off = st.relOff * Math.exp(-dt / 1.1) * Math.cos(dt * 3.2) ;
    }
    return base + off;
  }

  function clearEnvelope(i, t) {
    // 1 = fully present; dips to 0 across ~1.5 s after a clear tap, then reforms
    var ct = interact[i].clearT;
    if (ct < -1e8) return 1;
    var dt = t - ct;
    if (dt < 0 || dt > 1.6) return 1;
    if (dt < 0.7) return 1 - dt / 0.7;
    return (dt - 0.7) / 0.9;
  }

  function drawPod(i, t) {
    var pod = pods[i], p = podParams[i];
    var rot = podRotation(i, t);                    // degrees
    var rotN = rot / 8;                             // -1..1 nominal
    var squash = 1 - 0.045 * Math.abs(Math.sin(rot * Math.PI / 180));
    var cx = pod.cx;
    var w = pod.w * squash;
    var x = cx - w / 2, y = pod.top;

    // ground shadow (layered alpha)
    ctx.fillStyle = SHADOW;
    for (var s = 3; s >= 1; s--) {
      ctx.globalAlpha = 0.16 + (3 - s) * 0.10;
      ellipse(cx, pod.floorY + pod.h * 0.012, (w / 2) * (0.8 + s * 0.16), pod.h * 0.028 * (0.7 + s * 0.2));
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // body
    ctx.fillStyle = POD;
    rrect(x, y, w, pod.h, w * 0.30);
    ctx.fill();
    // side shade band (shifts with rotation, like a turning cylinder)
    var bandW = w * 0.20;
    var bandX = x + w * (0.66 + 0.10 * rotN) - bandW / 2;
    ctx.save();
    rrect(x, y, w, pod.h, w * 0.30);
    ctx.clip();
    ctx.fillStyle = SHADOW;
    ctx.globalAlpha = 0.10;
    ctx.fillRect(bandX, y, bandW, pod.h);
    ctx.globalAlpha = 0.06;
    ctx.fillRect(x, y, w * 0.10, pod.h);
    // base plinth line
    ctx.globalAlpha = 0.14;
    ctx.fillRect(x, pod.floorY - pod.h * 0.035, w, pod.h * 0.035);
    ctx.restore();
    ctx.globalAlpha = 1;

    // opening: shifts slightly with rotation (the mouth turns with the body)
    var ow = pod.openW * squash;
    var oh = pod.openH;
    var ocx = cx + rotN * w * 0.055;
    var oy = y + pod.h * 0.16;
    var ox = ocx - ow / 2;

    // warm glow spilling from the mouth (layered alpha, no gradient)
    layeredGlow(ocx, oy + oh * 0.46, ow * 0.85, oh * 0.62, MOUTH, 4, 0.20);

    // doorway (dark interior)
    ctx.fillStyle = SHADOW;
    rrect(ox, oy, ow, oh, ow * 0.30);
    ctx.fill();
    // inner warm wash at the back of the doorway
    ctx.save();
    rrect(ox, oy, ow, oh, ow * 0.30);
    ctx.clip();
    layeredGlow(ocx, oy + oh * 0.40, ow * 0.52, oh * 0.38, MOUTH, 3, 0.38);

    // hologram: turns WITH the pod (rotN in its turn phase) plus its own drift
    var env = clearEnvelope(i, t);
    if (env > 0.01) {
      var driftX = Math.sin(TAU * t / 12.5 + p.driftPhX) * ow * 0.10;
      var bobY = Math.sin(TAU * t / 10 + p.driftPhY) * oh * 0.016;
      var ownTurn = Math.cos(TAU * t / 25 + p.turnPhase);          // -1..1
      var turn = 0.45 + 0.55 * Math.abs(ownTurn * 0.65 + rotN * 0.35);
      var figH = oh * 0.80;
      drawFigure(ocx + driftX, oy + oh * 0.94 + bobY, figH, turn, 0.52 * env, p);
    }
    ctx.restore();

    // doorway rim light (warm, thin)
    ctx.strokeStyle = MOUTH;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = Math.max(1, w * 0.012);
    rrect(ox, oy, ow, oh, ow * 0.30);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- booth line cylinders ----------
  function drawCyl(j, t) {
    var c = cyls[j], p = cylParams[j];
    var pulse = 0.5 + 0.5 * Math.sin(TAU * t / 6.25 + p.pulsePh);
    // shadow
    ctx.fillStyle = SHADOW;
    ctx.globalAlpha = 0.30;
    ellipse(c.cx, c.floorY + c.h * 0.03, c.w * 0.75, c.h * 0.05);
    ctx.fill();
    ctx.globalAlpha = 1;
    // body
    ctx.fillStyle = CYL;
    ctx.globalAlpha = 0.55 + 0.25 * pulse;
    rrect(c.cx - c.w / 2, c.top, c.w, c.h, c.w * 0.28);
    ctx.fill();
    ctx.globalAlpha = 1;
    // glow halo
    layeredGlow(c.cx, c.top + c.h * 0.4, c.w * 0.95, c.h * 0.55, CYL, 3, 0.10 + 0.08 * pulse);
    // illuminated ring top
    ctx.fillStyle = RINGTOP;
    ctx.globalAlpha = 0.65 + 0.35 * pulse;
    ellipse(c.cx, c.top + c.h * 0.015, c.w * 0.42, c.w * 0.13);
    ctx.fill();
    ctx.globalAlpha = 0.35;
    ellipse(c.cx, c.top + c.h * 0.015, c.w * 0.56, c.w * 0.19);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ---------- frame ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    ctx.fillStyle = GALLERY;
    ctx.fillRect(0, 0, W, H);
    // quiet floor band
    ctx.fillStyle = SHADOW;
    ctx.globalAlpha = 0.35;
    ctx.fillRect(0, H * FLOOR, W, H * (1 - FLOOR));
    ctx.globalAlpha = 1;
    var i;
    for (i = 0; i < cyls.length; i++) drawCyl(i, t);
    for (i = 0; i < pods.length; i++) drawPod(i, t);
    updateAudio(t);
  }

  // ---------- audio (lazy, gesture-only, guarded) ----------
  var AC = null, servoOsc = null, servoGain = null, toneOscs = [];
  function initAudio() {
    if (AC) return;
    var Ctor = (typeof window !== 'undefined') ? (window.AudioContext || window.webkitAudioContext) : null;
    if (typeof Ctor !== 'function') return;
    try {
      AC = new Ctor();
      // servo bed
      servoOsc = AC.createOscillator();
      servoGain = AC.createGain();
      var lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 240;
      servoOsc.type = 'sawtooth'; servoOsc.frequency.value = 54;
      servoGain.gain.value = 0;
      servoOsc.connect(lp); lp.connect(servoGain); servoGain.connect(AC.destination);
      servoOsc.start();
      // airy hologram tones
      for (var i = 0; i < 3; i++) {
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = 'sine'; o.frequency.value = podParams[i].tone;
        g.gain.value = 0.012;
        o.connect(g); g.connect(AC.destination);
        o.start();
        toneOscs.push({ o: o, g: g });
      }
    } catch (e) { AC = null; }
  }
  function shimmer() {
    if (!AC) return;
    try {
      var now = AC.currentTime;
      for (var i = 0; i < 5; i++) {
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(1400 + i * 260, now);
        o.frequency.exponentialRampToValueAtTime(300 + i * 60, now + 1.1);
        g.gain.setValueAtTime(0.05, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
        o.connect(g); g.connect(AC.destination);
        o.start(now); o.stop(now + 1.25);
      }
    } catch (e) {}
  }
  var lastRot = [0, 0, 0];
  function updateAudio(t) {
    if (!AC || !servoGain) return;
    try {
      var v = 0;
      for (var i = 0; i < 3; i++) {
        var r = podRotation(i, t);
        v = Math.max(v, Math.abs(r - lastRot[i]));
        lastRot[i] = r;
      }
      var target = Math.min(0.05, v * 0.6);
      servoGain.gain.setTargetAtTime(target, AC.currentTime, 0.08);
    } catch (e) {}
  }

  // ---------- interaction ----------
  var startPerf = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function pieceT() {
    if (typeof performance !== 'undefined' && performance.now) {
      return T0 + (performance.now() - startPerf) / 1000;
    }
    return T0;
  }

  var drag = null;      // {pod, lastX, moved, downT, downX, downY}
  var lastTap = { t: -1e9, pod: -1 };

  function nearestPod(x) {
    var best = -1, bd = 1e18;
    for (var i = 0; i < pods.length; i++) {
      var d = Math.abs(x - pods[i].cx);
      if (d < bd) { bd = d; best = i; }
    }
    return (best >= 0 && bd < pods[best].w * 0.9) ? best : -1;
  }

  function onDown(e) {
    initAudio();
    if (AC && AC.state === 'suspended' && AC.resume) AC.resume();
    var x = e.clientX, y = e.clientY;
    var i = nearestPod(x);
    drag = { pod: i, lastX: x, downX: x, downY: y, moved: 0, downT: pieceT() };
    if (i >= 0) {
      interact[i].relT = -1e9;
      interact[i].dragOff = currentDragOff(i, pieceT());
    }
  }
  function currentDragOff(i, t) {
    var st = interact[i];
    if (st.relT > -1e8) {
      var dt = t - st.relT;
      return dt >= 0 ? st.relOff * Math.exp(-dt / 1.1) * Math.cos(dt * 3.2) : st.dragOff;
    }
    return st.dragOff;
  }
  function onMove(e) {
    if (!drag || drag.pod < 0) return;
    var dx = e.clientX - drag.lastX;
    drag.lastX = e.clientX;
    drag.moved += Math.abs(dx);
    var st = interact[drag.pod];
    st.dragOff = Math.max(-22, Math.min(22, st.dragOff + dx * 0.06));
  }
  function onUp(e) {
    if (!drag) return;
    var t = pieceT();
    var i = drag.pod;
    if (i >= 0) {
      var st = interact[i];
      st.relOff = st.dragOff;
      st.relT = t;
    }
    var quick = (t - drag.downT) < 0.4;
    var still = Math.abs(e.clientX - drag.downX) < 8 && Math.abs(e.clientY - drag.downY) < 8;
    if (quick && still && i >= 0) {
      if (t - lastTap.t < 0.35) {
        // double-tap: new gallery
        seed = (seed * 1103515245 + 12345) % 2147483648;
        deriveParams();
        for (var k = 0; k < 3; k++) {
          interact[k].clearT = -1e9; interact[k].dragOff = 0; interact[k].relT = -1e9;
        }
        layout();
        lastTap = { t: -1e9, pod: -1 };
      } else {
        interact[i].clearT = t;
        shimmer();
        lastTap = { t: t, pod: i };
      }
    }
    drag = null;
    draw(pieceT());
  }

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceT()); });
    }
    window.addEventListener('resize', function () { resize(); draw(pieceT()); });
  }

  // ---------- run ----------
  deriveParams();
  resize();
  draw(T0);   // synchronous frame one at the fixed phase

  if (typeof requestAnimationFrame === 'function') {
    var raf = function () {
      draw(pieceT());
      requestAnimationFrame(raf);
    };
    requestAnimationFrame(raf);
  }
})();
</script>
</body>
</html>
