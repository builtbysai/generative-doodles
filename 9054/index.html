<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№9054 · Dusk Shore</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a1620; overflow: hidden;
               display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges;
           height: 100vh; max-width: 100vw; aspect-ratio: 2/3; }
  .cap { position: fixed; left: 14px; bottom: 10px; font: italic 12px Georgia, serif;
         color: #5a6a72; user-select: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" width="160" height="240"></canvas>
<div class="cap">№9054 · Dusk Shore · click for another evening</div>
<script>
// Dusk Shore v2: top-down surf. Wave sets march toward the beach as
// parallel foam bands, break into lace, and swash up the sand before
// receding. The water visibly moves up and down.
let seed = 42;
const q = new URLSearchParams(location.search);
if (q.has('seed')) seed = parseInt(q.get('seed'), 10) || 42;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const GW = 160, GH = 240;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let rnd, waves, glints, figures, foamPatches;
const SHORE_BASE = 168;

function shoreAt(x, t) {
  return SHORE_BASE
    + Math.sin(x * 0.09 + t * 0.4) * 6
    + Math.sin(x * 0.023 + 1.7) * 9;
}

function init() {
  rnd = mulberry32(seed);
  waves = [];
  foamPatches = [];
  // wave sets: each wave travels down, breaks, swashes, dies
  const nw = 7;
  for (let i = 0; i < nw; i++) {
    waves.push(newWave(-i * 40 - rnd() * 15));
  }
  glints = [];
  for (let i = 0; i < 80; i++) {
    glints.push({
      x: (80 + (rnd() - 0.5) * 100) | 0,
      y: (rnd() * 100) | 0,
      ph: rnd() * Math.PI * 2, sp: 1 + rnd() * 3
    });
  }
  figures = [];
  const nf = 4 + ((rnd() * 3) | 0);
  for (let i = 0; i < nf; i++) {
    figures.push({ x: 20 + rnd() * 120, dark: rnd() > 0.25, ph: rnd() * Math.PI * 2 });
  }
}

function newWave(y) {
  return {
    y: y,                       // front position (moves down = toward shore)
    speed: 22 + rnd() * 8,      // px per second
    state: 'approach',          // approach -> break -> swash -> gone
    swash: 0,                   // how far foam pushes onto sand
    swashDir: 1,
    foam: 0,                    // foam intensity 0..1
    seedOff: rnd() * 100
  };
}

function waterColor(y, shoreY) {
  const t = Math.min(1, Math.max(0, y / shoreY));
  const c1 = [13, 38, 54], c2 = [24, 84, 100], c3 = [52, 158, 134];
  let a, b, f;
  if (t < 0.55) { a = c1; b = c2; f = t / 0.55; }
  else { a = c2; b = c3; f = (t - 0.55) / 0.45; }
  return [a[0] + (b[0] - a[0]) * f | 0, a[1] + (b[1] - a[1]) * f | 0, a[2] + (b[2] - a[2]) * f | 0];
}

// lace-like foam edge using hash noise
function foamNoise(x, y, s) {
  const h = Math.sin(x * 12.9898 + y * 78.233 + s * 37.7) * 43758.5453;
  return h - Math.floor(h);
}

let start = null;
function frame(ts) {
  if (!start) start = ts;
  const t = (ts - start) / 1000;
  const dt = Math.min(0.05, (ts - (frame._p || ts)) / 1000);
  frame._p = ts;

  const img = ctx.createImageData(GW, GH);
  const d = img.data;
  const shore = [];
  for (let x = 0; x < GW; x++) shore[x] = shoreAt(x, t);

  // update waves
  for (let i = 0; i < waves.length; i++) {
    const w = waves[i];
    if (w.state === 'approach') {
      w.y += w.speed * dt;
      const breakY = SHORE_BASE - 34;
      if (w.y >= breakY) { w.state = 'break'; w.foam = 0; }
    } else if (w.state === 'break') {
      w.foam += dt * 1.1;
      w.y += w.speed * 0.3 * dt;
      if (w.foam >= 1) { w.state = 'swash'; w.swash = 0; w.swashDir = 1; }
    } else if (w.state === 'swash') {
      // foam pushes onto sand, then recedes
      w.swash += w.swashDir * dt * 26;
      w.foam -= dt * 0.35;
      if (w.swash > 24) w.swashDir = -1;
      if (w.swash <= 0 && w.swashDir < 0) { w.state = 'gone'; }
    } else if (w.state === 'gone') {
      waves[i] = newWave(-10 - rnd() * 30);
    }
  }

  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const idx = (y * GW + x) * 4;
      const sy = shore[x];
      if (y < sy - 2) {
        const c = waterColor(y, sy);
        const sh = Math.sin(x * 0.3 + t * 2 + y * 0.12) * 6;
        d[idx] = Math.max(0, c[0] + sh);
        d[idx + 1] = Math.max(0, c[1] + sh);
        d[idx + 2] = Math.max(0, c[2] + sh);
        d[idx + 3] = 255;
      } else if (y < sy + 2) {
        const fl = Math.sin(x * 0.5 + t * 4) > -0.2 ? 255 : 230;
        d[idx] = fl; d[idx + 1] = fl; d[idx + 2] = fl - 8; d[idx + 3] = 255;
      } else {
        const g = (foamNoise(x, y, seed) - 0.5) * 14;
        const wet = Math.max(0, 1 - (y - sy) / 30);
        d[idx] = 232 - wet * 44 + g;
        d[idx + 1] = 214 - wet * 36 + g;
        d[idx + 2] = 178 - wet * 28 + g;
        d[idx + 3] = 255;
      }
    }
  }

  // draw wave fronts: bright foam bands with lace edges
  for (const w of waves) {
    if (w.state === 'approach') {
      if (w.y < 2) continue; // don't draw above frame
      // bright white line from the start, thickens near shore
      const prox = Math.min(1, Math.max(0, w.y / (SHORE_BASE - 34)));
      const bright = 200 + prox * 55;
      const yy = w.y | 0;
      for (let x = 0; x < GW; x++) {
        const wy = (yy + Math.sin(x * 0.08 + w.seedOff) * 3) | 0;
        if (wy < 2 || wy >= GH || wy > shore[x] - 4) continue;
        for (let dy = -2; dy <= 2; dy++) {
          const py = wy + dy;
          if (py < 0 || py >= GH) continue;
          const i = (py * GW + x) * 4;
          const n = foamNoise(x, py, w.seedOff);
          if (dy === 0 || (Math.abs(dy) <= 2 && n > 0.35)) {
            d[i] = bright; d[i+1] = Math.min(255, bright + 8); d[i+2] = Math.min(255, bright + 14);
          }
        }
      }
    } else if (w.state === 'break' || w.state === 'swash') {
      // turbulent foam band: wide, textured, bright
      const bandW = 6 + w.foam * 14;
      const yy = w.y | 0;
      for (let x = 0; x < GW; x++) {
        const wy = (yy + Math.sin(x * 0.08 + w.seedOff) * 4) | 0;
        for (let dy = -bandW; dy <= bandW; dy++) {
          const py = wy + dy;
          if (py < 0 || py >= GH || py > shore[x] - 2) continue;
          const n = foamNoise(x, py, w.seedOff + t * 2);
          const edge = 1 - Math.abs(dy) / bandW;
          if (n < edge * w.foam) {
            const i = (py * GW + x) * 4;
            const wh = 225 + n * 30;
            d[i] = wh; d[i+1] = wh; d[i+2] = wh - 6;
          }
        }
      }
      // swash: foam tongue pushing onto sand
      if (w.state === 'swash' && w.swash > 0) {
        for (let x = 0; x < GW; x++) {
          const sy = shore[x] | 0;
          const reach = (w.swash * 1.4 * (0.7 + 0.3 * Math.sin(x * 0.1 + w.seedOff))) | 0;
          for (let dy = 0; dy < reach; dy++) {
            const py = sy + 2 + dy;
            if (py >= GH) continue;
            const n = foamNoise(x, py, w.seedOff + 99);
            const fade = 1 - dy / Math.max(1, reach);
            if (n < fade * w.foam * 0.9) {
              const i = (py * GW + x) * 4;
              const wh = 235 + n * 20;
              d[i] = wh; d[i+1] = wh; d[i+2] = wh - 8;
            }
          }
        }
      }
    }
  }

  // sun glitter
  for (const g of glints) {
    const tw = Math.sin(t * g.sp + g.ph);
    if (tw < 0.55 || g.y > shore[g.x] - 30) continue;
    const i = (g.y * GW + g.x) * 4;
    const warm = 200 + tw * 55;
    d[i] = warm; d[i+1] = warm * 0.82 | 0; d[i+2] = warm * 0.45 | 0;
  }

  ctx.putImageData(img, 0, 0);

  // figures bobbing at the waterline
  for (const f of figures) {
    const sy = shore[f.x | 0];
    const bob = Math.sin(t * 2 + f.ph) > 0 ? 0 : 1;
    const fx = f.x | 0, fy = (sy + 4 + bob) | 0;
    ctx.fillStyle = f.dark ? '#1a1a22' : '#d8a83a';
    ctx.fillRect(fx - 1, fy, 3, 1);
    ctx.fillRect(fx, fy + 1, 1, 2);
  }

  requestAnimationFrame(frame);
}

init();
requestAnimationFrame(frame);

window.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  init();
});
</script>
</body>
</html>
