<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№9054 · Dusk Shore</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a1620; overflow: hidden;
               display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges;
           height: 100vh; max-width: 100vw; aspect-ratio: 2/3; }
  .cap { position: fixed; left: 14px; bottom: 10px; font: italic 12px Georgia, serif;
         color: #5a6a72; user-select: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" width="160" height="240"></canvas>
<div class="cap">№9054 · Dusk Shore · click for another evening</div>
<script>
// Dusk Shore v11: the missing thing was dusk itself. A low sun lays a golden
// glitter path on the water; the water gets a real rippled surface; wave
// fronts gain tonal presence (dark troughs, lifted crests, never white);
// the vector-white shoreline is replaced by a wash lightening into damp dark
// sand; the sand gets grain. No foam anywhere: glints are warm gold, tiny,
// and scattered, reading as light, not surf.
let seed = 42;
const q = new URLSearchParams(location.search);
if (q.has('seed')) seed = parseInt(q.get('seed'), 10) || 42;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const GW = 160, GH = 240;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// palette from the reference swatches
const SAND = [231, 214, 196];   // #e7d6c4
const SAGE = [145, 153, 140];   // #91998c
const TEAL_LT = [123, 175, 182]; // #7bafb6
const TEAL_MD = [82, 136, 143];  // #52888f
const TEAL_DK = [46, 86, 91];    // #2e565b

let rnd, sandTex, fronts, glitX;

function sstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

// layered wave fronts: diagonal lines at different depths, drifting shoreward.
// foam clusters along these lines, nearer fronts overlapping farther ones.
function initFronts() {
  fronts = [];
  const n = 4;
  for (let i = 0; i < n; i++) {
    fronts.push({
      y: 62 + i * 32 + rnd() * 8,   // staggered depths, top stays clean
      speed: 6 + rnd() * 3,
      slope: 0.28 + (rnd() - 0.5) * 0.08, // diagonal like the reference
      wob: rnd() * 10,
      seedOff: rnd() * 100
    });
  }
}
function frontY(f, x, t) {
  return f.y + x * f.slope + Math.sin(x * 0.04 + f.wob + t * 0.2) * 4;
}

function shoreAt(x, t) {
  return 202
    + Math.sin(x * 0.055 + t * 0.25) * 6
    + Math.sin(x * 0.016 + 2.1) * 9
    + x * 0.05;
}

function initSand() {
  sandTex = [];
  for (let y = 0; y < GH; y++) {
    sandTex[y] = [];
    for (let x = 0; x < GW; x++) {
      const rip = Math.sin((x * 0.6 + y * 1.0) * 0.3) * 0.5 + 0.5;
      sandTex[y][x] = rip * 0.55 + rnd() * 0.45;
    }
  }
}

function init() {
  rnd = mulberry32(seed);
  initSand();
  initFronts();
  glitX = 88 + rnd() * 26; // sun glitter column, off-center
}

function hash(x, y, s) {
  const h = Math.sin(x * 12.9898 + y * 78.233 + s * 37.719) * 43758.5453;
  return h - Math.floor(h);
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s);
  const c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

let start = null;
function frame(ts) {
  if (!start) start = ts;
  const t = (ts - start) / 1000;
  const dt = Math.min(0.05, (ts - (frame._p || ts)) / 1000);
  frame._p = ts;

  const img = ctx.createImageData(GW, GH);
  const d = img.data;

  // update wave fronts: drift shoreward, wrap around
  for (const f of fronts) {
    f.y += f.speed * dt;
    if (f.y > 185) f.y = 55 + rnd() * 12;
  }

  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const idx = (y * GW + x) * 4;
      const sy = shoreAt(x, t);
      let r, g, b;
      if (y < sy - 2) {
        // glassy teal water: dark top -> light toward shore
        const zt = Math.min(1, y / sy);
        r = TEAL_DK[0] + (TEAL_LT[0] - TEAL_DK[0]) * Math.pow(zt, 1.3);
        g = TEAL_DK[1] + (TEAL_LT[1] - TEAL_DK[1]) * Math.pow(zt, 1.3);
        b = TEAL_DK[2] + (TEAL_LT[2] - TEAL_DK[2]) * Math.pow(zt, 1.3);
        // dusk deepens the far water slightly toward blue
        const far = Math.max(0, 1 - zt / 0.3);
        r -= far * 7; g -= far * 2; b += far * 4;
        // sand glowing through the shallows
        if (zt > 0.62) {
          const sh = (zt - 0.62) / 0.38;
          const st = sandTex[y][x];
          r += (SAND[0] * 0.5 - r * 0.5) * sh * st * 0.55;
          g += (SAND[1] * 0.5 - g * 0.5) * sh * st * 0.55;
          b += (SAND[2] * 0.5 - b * 0.5) * sh * st * 0.55;
        }
        // real surface: two octaves of drifting ripple, plus fine cross-chop
        const t1 = vnoise(x * 0.07, y * 0.09 + t * 0.35, 11);
        const t2 = vnoise(x * 0.23 + t * 0.5, y * 0.21 - t * 0.3, 23);
        const tex = (t1 - 0.5) * 17 + (t2 - 0.5) * 9;
        r += tex; g += tex; b += tex;
        // layered wave fronts: dark trough on the seaward side, lifted crest
        for (let fi = 0; fi < fronts.length; fi++) {
          const fy = frontY(fronts[fi], x, t);
          const dd = Math.abs(y - fy);
          if (dd < 9 && fy > 42) {
            const k = (1 - dd / 9) * (0.55 + fi * 0.18);
            const lift = y < fy ? -13 * k : 17 * k;
            r += lift; g += lift; b += lift * 0.92;
          }
        }
        // wash lightening as the water runs up to the shore (no foam: pale aqua)
        const wash = Math.max(0, 1 - (sy - 2 - y) / 18);
        if (wash > 0) {
          r += (196 - r) * wash * 0.5;
          g += (218 - g) * wash * 0.5;
          b += (210 - b) * wash * 0.5;
        }
        // DUSK: golden glitter path. Warm, tiny, scattered: reads as low sun,
        // never as surf. Widens toward the far water, brightest near the top
        // where the sun sits just out of frame; eases in from the canvas edge.
        const spread = 9 + (1 - Math.min(1, y / 185)) * 15;
        const gx = (x - (glitX + Math.sin(t * 0.12) * 4)) / spread;
        const column = Math.exp(-gx * gx);
        if (column > 0.02) {
          const depthFade = Math.max(0, 1 - y / 185);
          const topIn = sstep(0, 22, y);
          const n = vnoise(x * 0.45, y * 0.45 - t * 1.9, 31);
          const sparkle = sstep(0.64, 0.95, n);
          const core = Math.exp(-gx * gx * 3) * depthFade * topIn;
          const glow = column * depthFade * topIn;
          r += glow * 16 + sparkle * glow * 150 + core * 60;
          g += glow * 10 + sparkle * glow * 95 + core * 38;
          b += glow * 3 + sparkle * glow * 32 + core * 12;
        }
      } else if (y < sy + 9) {
        // damp sand: dark, cool, with a wet sheen at the water's edge.
        // edge wobbles so it never reads as a stripe.
        const st = sandTex[y][x];
        const wob = (vnoise(x * 0.3, 7.7, 41) - 0.5) * 7;
        const edge = Math.max(0, 1 - (y - sy + wob * 0.4) / 9);
        r = SAND[0] - 54 + (st - 0.5) * 18 + edge * 16;
        g = SAND[1] - 48 + (st - 0.5) * 18 + edge * 18;
        b = SAND[2] - 40 + (st - 0.5) * 16 + edge * 15;
      } else {
        const st = sandTex[y][x];
        const wet = Math.max(0, 1 - (y - sy) / 32);
        const speck = (hash(x, y, 3) - 0.5) * 14;
        r = SAND[0] - wet * 30 + (st - 0.5) * 22 + speck;
        g = SAND[1] - wet * 26 + (st - 0.5) * 22 + speck;
        b = SAND[2] - wet * 22 + (st - 0.5) * 20 + speck;
      }
      d[idx] = r; d[idx+1] = g; d[idx+2] = b; d[idx+3] = 255;
    }
  }

  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}

init();
requestAnimationFrame(frame);

window.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  init();
});
</script>
</body>
</html>
