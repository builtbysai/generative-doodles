<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№9054 · Dusk Shore</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a1620; overflow: hidden;
               display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges;
           height: 100vh; max-width: 100vw; aspect-ratio: 2/3; }
  .cap { position: fixed; left: 14px; bottom: 10px; font: italic 12px Georgia, serif;
         color: #5a6a72; user-select: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" width="160" height="240"></canvas>
<div class="cap">№9054 · Dusk Shore · click for another evening</div>
<script>
// Dusk Shore v5: rebuilt around the reference — calm glassy teal water,
// and FOAM as the star: big billowing organic patches with bubbly cellular
// texture, feathery edges, trailing wisps. Discrete foam events erupt,
// billow, drift shoreward, and dissipate. Lacy wash along the shoreline.
let seed = 42;
const q = new URLSearchParams(location.search);
if (q.has('seed')) seed = parseInt(q.get('seed'), 10) || 42;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const GW = 160, GH = 240;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// palette from the reference swatches
const SAND = [231, 214, 196];   // #e7d6c4
const SAGE = [145, 153, 140];   // #91998c
const TEAL_LT = [123, 175, 182]; // #7bafb6
const TEAL_MD = [82, 136, 143];  // #52888f
const TEAL_DK = [46, 86, 91];    // #2e565b

let rnd, foamEvents, sandTex;

function shoreAt(x, t) {
  return 202
    + Math.sin(x * 0.055 + t * 0.25) * 6
    + Math.sin(x * 0.016 + 2.1) * 9
    + x * 0.05;
}

function initSand() {
  sandTex = [];
  for (let y = 0; y < GH; y++) {
    sandTex[y] = [];
    for (let x = 0; x < GW; x++) {
      const rip = Math.sin((x * 0.6 + y * 1.0) * 0.3) * 0.5 + 0.5;
      sandTex[y][x] = rip * 0.55 + rnd() * 0.45;
    }
  }
}

// a foam event: erupts at (x,y), billows outward, drifts shoreward, dissipates
function newFoam(x, y, size) {
  return {
    x: x, y: y,
    size: size,               // max radius
    age: 0,
    life: 7 + rnd() * 4,      // seconds
    seedOff: rnd() * 100,
    driftX: (rnd() - 0.5) * 6,
    driftY: 8 + rnd() * 5,    // shoreward drift
    born: 0
  };
}

function init() {
  rnd = mulberry32(seed);
  initSand();
  foamEvents = [];
  // pre-populate so the scene starts alive: several events at various ages
  const presets = [
    [45, 70, 52, 2.5], [105, 95, 62, 4.0], [75, 130, 46, 1.0],
    [30, 150, 54, 5.5], [120, 160, 44, 3.0], [60, 40, 40, 6.0]
  ];
  for (const [x, y, s, age] of presets) {
    const f = newFoam(x, y, s);
    f.age = age;
    foamEvents.push(f);
  }
}

function hash(x, y, s) {
  const h = Math.sin(x * 12.9898 + y * 78.233 + s * 37.719) * 43758.5453;
  return h - Math.floor(h);
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s);
  const c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

let start = null;
function frame(ts) {
  if (!start) start = ts;
  const t = (ts - start) / 1000;
  const dt = Math.min(0.05, (ts - (frame._p || ts)) / 1000);
  frame._p = ts;

  const img = ctx.createImageData(GW, GH);
  const d = img.data;

  // update foam events
  for (const f of foamEvents) {
    f.age += dt;
    f.x += f.driftX * dt;
    f.y += f.driftY * dt;
  }
  foamEvents = foamEvents.filter(f => f.age < f.life);
  // spawn new events periodically (a wave breaks every few seconds somewhere)
  if (rnd() < dt * 0.7 && foamEvents.length < 8) {
    const x = 15 + rnd() * (GW - 30);
    const y = 30 + rnd() * 130;
    foamEvents.push(newFoam(x, y, 38 + rnd() * 30));
  }

  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const idx = (y * GW + x) * 4;
      const sy = shoreAt(x, t);
      let r, g, b;
      if (y < sy - 2) {
        // glassy teal water: dark top -> light toward shore, very subtle texture
        const zt = Math.min(1, y / sy);
        r = TEAL_DK[0] + (TEAL_LT[0] - TEAL_DK[0]) * Math.pow(zt, 1.3);
        g = TEAL_DK[1] + (TEAL_LT[1] - TEAL_DK[1]) * Math.pow(zt, 1.3);
        b = TEAL_DK[2] + (TEAL_LT[2] - TEAL_DK[2]) * Math.pow(zt, 1.3);
        // sand glowing through the shallows
        if (zt > 0.62) {
          const sh = (zt - 0.62) / 0.38;
          const st = sandTex[y][x];
          r += (SAND[0] * 0.5 - r * 0.5) * sh * st * 0.55;
          g += (SAND[1] * 0.5 - g * 0.5) * sh * st * 0.55;
          b += (SAND[2] * 0.5 - b * 0.5) * sh * st * 0.55;
        }
        // whisper of surface texture
        const tex = vnoise(x * 0.08, y * 0.08 + t * 0.25, 11);
        const shm = (tex - 0.5) * 10;
        r += shm; g += shm; b += shm;
      } else if (y < sy + 2) {
        r = 246; g = 245; b = 240;
      } else {
        const st = sandTex[y][x];
        const wet = Math.max(0, 1 - (y - sy) / 32);
        r = SAND[0] - wet * 32 + (st - 0.5) * 15;
        g = SAND[1] - wet * 28 + (st - 0.5) * 15;
        b = SAND[2] - wet * 24 + (st - 0.5) * 13;
      }
      d[idx] = r; d[idx+1] = g; d[idx+2] = b; d[idx+3] = 255;
    }
  }

  // draw foam events: billowing patches with bubbly core, feathery edge
  for (const f of foamEvents) {
    const ageK = f.age / f.life;                    // 0 -> 1
    // growth: rapid bloom then slow expand; dissipation: holes grow
    const growK = Math.min(1, f.age / 1.8);
    const R = f.size * (0.35 + 0.65 * growK);
    const density = (1 - ageK * 0.85);               // foam thins with age
    const x0 = Math.max(0, Math.floor(f.x - R - 8));
    const x1 = Math.min(GW - 1, Math.ceil(f.x + R + 8));
    const y0 = Math.max(0, Math.floor(f.y - R - 8));
    const y1 = Math.min(GH - 1, Math.ceil(f.y + R + 8));
    for (let py = y0; py <= y1; py++) {
      for (let px = x0; px <= x1; px++) {
        const dx = px - f.x, dy = py - f.y;
        // organic shape: radius modulated by noise (billows and wisps)
        const ang = Math.atan2(dy, dx);
        const wob = vnoise(Math.cos(ang) * 1.5 + 5, Math.sin(ang) * 1.5 + f.seedOff, 3);
        const wob2 = vnoise(px * 0.05, py * 0.05 + f.age * 0.6, f.seedOff + 9);
        const edge = R * (0.55 + 0.7 * wob) * (0.8 + 0.4 * wob2);
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > edge) continue;
        const inner = 1 - dist / edge;               // 1 center -> 0 edge
        // chunky bubbles: coarse noise for big cells, fine for wisps
        const bubBig = vnoise(px * 0.14, py * 0.14, f.seedOff);
        const bubFine = vnoise(px * 0.4, py * 0.4, f.seedOff + 2);
        const cell = vnoise(px * 0.06 + f.age * 0.7, py * 0.06, f.seedOff + 4);
        // dense knotted core -> bubbly mid -> feathery rim
        let thresh, bub;
        if (inner > 0.55) {
          // core: nearly solid white, only deepest creases show water
          bub = bubBig;
          thresh = density * (0.82 + 0.18 * cell);
        } else if (inner > 0.25) {
          // mid: big bubble cells with real holes
          bub = bubBig * 0.7 + bubFine * 0.3;
          thresh = density * (0.35 + 0.5 * inner) * (0.5 + 0.5 * cell);
        } else {
          // rim: wispy feathers
          bub = bubFine;
          thresh = density * inner * 2.2 * (0.4 + 0.6 * cell);
        }
        if (bub < thresh) {
          const i = (py * GW + px) * 4;
          // foam slightly shadowed in creases (bub high = crease)
          const shade = 228 + (1 - bub / Math.max(0.001, thresh)) * 27;
          const wh = Math.min(255, shade);
          const op = Math.min(1, density * 1.5 + 0.25);
          d[i] = d[i] * (1 - op) + wh * op;
          d[i+1] = d[i+1] * (1 - op) + wh * op;
          d[i+2] = d[i+2] * (1 - op) + (wh - 5) * op;
        }
      }
    }
  }

  // shoreline wash: lacy band where waves meet sand, breathing with time
  const washT = (Math.sin(t * 0.55) * 0.5 + 0.5); // slow breathing
  for (let x = 0; x < GW; x++) {
    const sy = shoreAt(x, t) | 0;
    const reach = 6 + washT * 16;
    for (let dy = -10; dy < reach; dy++) {
      const py = sy + dy;
      if (py < 0 || py >= GH) continue;
      const n = vnoise(x * 0.18, py * 0.18 + t * 0.5, 21);
      const n2 = vnoise(x * 0.05, py * 0.05, 22);
      const band = dy < 0 ? 1 - Math.abs(dy) / 10 : 1 - dy / Math.max(1, reach);
      const thresh = Math.max(0, band) * (0.35 + 0.5 * n2) * (0.6 + 0.4 * washT);
      if (n < thresh) {
        const i = (py * GW + x) * 4;
        const wh = 232 + n * 23;
        const op = Math.min(1, band * 1.3);
        d[i] = d[i] * (1 - op) + wh * op;
        d[i+1] = d[i+1] * (1 - op) + wh * op;
        d[i+2] = d[i+2] * (1 - op) + (wh - 5) * op;
      }
    }
  }

  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}

init();
requestAnimationFrame(frame);

window.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  init();
});
</script>
</body>
</html>
