<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something That Behaves Autonomously</title>
<style>
html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#050505';
var SILVER = '#E8E8E0';
var VIOLET = '#8A5AE8';
var TEAL = '#2E9A8A';
var AMBER = '#D9A441';
var STEP_DT = 0.1;                  // seconds per CA step (10 steps per second)
var RK = 4;                         // ring-kernel radius, in cells
var MU = 0.20, SIGMA = 0.045;       // Lenia growth-function centre and width
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var cols = 0, rows = 0, cell = 12;
var state = null, next = null, scratch = null;
var neigh = null;                   // precomputed toroidal neighbour indices
var stepCount = 0;
var kernel = [];                    // {dx, dy, w} ring weights, normalised to sum 1
var placedW = 0, placedH = 0;
var pointer = null;                 // {x, y} in px while a drag is active

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// Ring kernel: weights peak on a ring of radius ~2.9 cells, near zero at
// the centre and outside the ring. Built once; never changes.
function buildKernel() {
  kernel = [];
  var sum = 0, dx, dy, d, w;
  for (dy = -RK; dy <= RK; dy++) {
    for (dx = -RK; dx <= RK; dx++) {
      d = Math.sqrt(dx * dx + dy * dy);
      if (d > RK + 0.5) continue;
      w = Math.exp(-((d - 2.9) * (d - 2.9)) / (2 * 1.1 * 1.1));
      kernel.push({ dx: dx, dy: dy, w: w });
      sum += w;
    }
  }
  for (var i = 0; i < kernel.length; i++) kernel[i].w /= sum;
}
// Fixed-seed fractal-noise field: a low-amplitude value-noise floor plus
// five authored creature blobs, each about 15% of the frame across.
// The blobs are sums of a few Gaussian bumps, so they read as colonies
// from the first frame, not as flat discs.
function buildField() {
  var rnd = mulberry32(1583);
  cell = Math.max(10, Math.min(VW, VH) / 64);
  cols = Math.max(24, Math.ceil(VW / cell));
  rows = Math.max(24, Math.ceil(VH / cell));
  state = new Float32Array(cols * rows);
  next = new Float32Array(cols * rows);
  scratch = new Float32Array(cols * rows);
  // Precompute toroidal neighbour indices once per field size so the
  // step loop does no modulo arithmetic per tap.
  neigh = new Int32Array(cols * rows * kernel.length);
  for (y = 0; y < rows; y++) {
    for (x = 0; x < cols; x++) {
      for (var ki = 0; ki < kernel.length; ki++) {
        var sx = x + kernel[ki].dx, sy = y + kernel[ki].dy;
        sx = ((sx % cols) + cols) % cols;
        sy = ((sy % rows) + rows) % rows;
        neigh[(y * cols + x) * kernel.length + ki] = sy * cols + sx;
      }
    }
  }
  stepCount = 0;
  var i, x, y, gx, gy;
  // Coarse value-noise floor: 8x8 random lattice, bilinearly sampled.
  var gw = 9, gh = 9, lat = [];
  for (i = 0; i < gw * gh; i++) lat.push(rnd());
  for (y = 0; y < rows; y++) {
    for (x = 0; x < cols; x++) {
      var fx = (x / cols) * (gw - 1), fy = (y / rows) * (gh - 1);
      var x0 = Math.floor(fx), y0 = Math.floor(fy);
      var tx = fx - x0, ty = fy - y0;
      var x1 = Math.min(x0 + 1, gw - 1), y1 = Math.min(y0 + 1, gh - 1);
      var a = lat[y0 * gw + x0], b = lat[y0 * gw + x1];
      var c = lat[y1 * gw + x0], d = lat[y1 * gw + x1];
      var v = (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
      state[y * cols + x] = v * 0.06;
    }
  }
  // Five creature blobs at authored positions, slight seeded jitter.
  var centres = [
    [0.24, 0.30], [0.68, 0.24], [0.55, 0.68], [0.82, 0.66], [0.38, 0.55]
  ];
  var rCells = 0.075 * Math.min(VW, VH) / cell;   // ~4.8 cells
  for (i = 0; i < centres.length; i++) {
    var cx = (centres[i][0] + (rnd() - 0.5) * 0.04) * cols;
    var cy = (centres[i][1] + (rnd() - 0.5) * 0.04) * rows;
    var bumps = 3 + Math.floor(rnd() * 3);
    var b, bx, by, br;
    for (b = 0; b < bumps; b++) {
      bx = cx + (rnd() - 0.5) * rCells * 1.4;
      by = cy + (rnd() - 0.5) * rCells * 1.4;
      br = rCells * (0.45 + rnd() * 0.35);
      var amp = 0.55 + rnd() * 0.35;
      var x0b = Math.max(0, Math.floor(bx - br * 2)), x1b = Math.min(cols - 1, Math.ceil(bx + br * 2));
      var y0b = Math.max(0, Math.floor(by - br * 2)), y1b = Math.min(rows - 1, Math.ceil(by + br * 2));
      for (gy = y0b; gy <= y1b; gy++) {
        for (gx = x0b; gx <= x1b; gx++) {
          var ddx = gx - bx, ddy = gy - by;
          var g = amp * Math.exp(-(ddx * ddx + ddy * ddy) / (2 * br * br));
          var idx = gy * cols + gx;
          state[idx] = Math.min(0.95, state[idx] + g);
        }
      }
    }
  }
  placedW = VW; placedH = VH;
}
// One Lenia step: ring-kernel convolution, then the growth function.
// Toroidal wrap so creatures drifting off an edge reappear opposite.
function stepCA() {
  var x, y, k, u, g, idx;
  var px = -1, py = -1, pr = 0;
  if (pointer) { px = pointer.x / cell; py = pointer.y / cell; pr = 6; }
  for (y = 0; y < rows; y++) {
    for (x = 0; x < cols; x++) {
      u = 0;
      var base = (y * cols + x) * kernel.length;
      for (k = 0; k < kernel.length; k++) {
        u += kernel[k].w * state[neigh[base + k]];
      }
      var du = (u - MU) / SIGMA;
      g = 2 * Math.exp(-0.5 * du * du) - 1;
      idx = y * cols + x;
      var v = state[idx] + 0.12 * g;
      if (v < 0) v = 0; else if (v > 1) v = 1;
      // A held finger keeps suppressing the field beneath it, so the
      // creatures scatter and only reform once the finger leaves.
      if (pointer) {
        var ddx = x - px, ddy = y - py;
        var dd = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dd < pr) v *= 1 - 0.10 * (1 - dd / pr);
      }
      next[idx] = v;
    }
  }
  var tmp = state; state = next; next = tmp;
  stepCount++;
}
function advanceTo(t) {
  var target = Math.floor(t / STEP_DT + 0.000001);
  while (stepCount < target) stepCA();
}
// Drag scatter: shove field mass radially away from the finger, so the
// creatures burst apart; the CA growth reforms them once released.
function scatter(px, py) {
  if (!state) return;
  var cx = px / cell, cy = py / cell, R = 6;
  var i;
  for (i = 0; i < cols * rows; i++) scratch[i] = state[i];
  var x0 = Math.max(0, Math.floor(cx - R)), x1 = Math.min(cols - 1, Math.ceil(cx + R));
  var y0 = Math.max(0, Math.floor(cy - R)), y1 = Math.min(rows - 1, Math.ceil(cy + R));
  var x, y;
  for (y = y0; y <= y1; y++) {
    for (x = x0; x <= x1; x++) {
      var dx = x - cx, dy = y - cy;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d >= R || d < 0.001) continue;
      var fall = 1 - d / R;
      var idx = y * cols + x;
      var amt = state[idx] * fall * 0.6;
      if (amt <= 0.001) continue;
      scratch[idx] -= amt;
      var ux = dx / d, uy = dy / d;
      var tx = Math.round(x + ux * 2), ty = Math.round(y + uy * 2);
      tx = ((tx % cols) + cols) % cols;
      ty = ((ty % rows) + rows) % rows;
      scratch[ty * cols + tx] = Math.min(1, scratch[ty * cols + tx] + amt * 0.9);
    }
  }
  var tmp = state; state = scratch; scratch = tmp;
}
function fringeColor(x, y) {
  var h = (x * 31 + y * 17) % 3;
  if (h === 0) return VIOLET;
  if (h === 1) return TEAL;
  return AMBER;
}
function draw(t) {
  lastT = t;
  size();
  if (!state || placedW !== VW || placedH !== VH) buildField();
  advanceTo(t);
  var minDim = Math.min(VW, VH);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  // Faint grid, every six cells.
  var gx, gy;
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (gx = 0; gx <= cols; gx += 6) {
    ctx.moveTo(gx * cell, 0); ctx.lineTo(gx * cell, VH);
  }
  for (gy = 0; gy <= rows; gy += 6) {
    ctx.moveTo(0, gy * cell); ctx.lineTo(VW, gy * cell);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Creatures as additive glitter: bright silver cores, iridescent
  // fringes at the edges, shimmering on a slow phase per cell.
  ctx.globalCompositeOperation = 'lighter';
  var x, y, idx, v, al, r, ph;
  for (y = 0; y < rows; y++) {
    for (x = 0; x < cols; x++) {
      idx = y * cols + x;
      v = state[idx];
      if (v < 0.15) continue;
      ph = ((x * 7 + y * 13) % 29) / 29 * TAU;
      var shimmer = 0.75 + 0.25 * Math.sin(TAU * t / 3 + ph);
      al = (v - 0.12) * 1.5 * shimmer;
      if (al > 0.9) al = 0.9;
      if (al < 0.02) continue;
      var cxp = (x + 0.5) * cell, cyp = (y + 0.5) * cell;
      r = cell * 0.55 * (0.6 + 0.4 * v);
      if (v > 0.55) {
        // Halo then core for the bright interior.
        ctx.globalAlpha = Number((al * 0.22).toFixed(4));
        ctx.fillStyle = SILVER;
        ctx.beginPath();
        ctx.moveTo(cxp + r * 1.6, cyp);
        ctx.arc(cxp, cyp, r * 1.6, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = Number(al.toFixed(4));
        ctx.beginPath();
        ctx.moveTo(cxp + r, cyp);
        ctx.arc(cxp, cyp, r, 0, TAU);
        ctx.fill();
      } else {
        ctx.globalAlpha = Number(al.toFixed(4));
        ctx.fillStyle = fringeColor(x, y);
        ctx.beginPath();
        ctx.moveTo(cxp + r, cyp);
        ctx.arc(cxp, cyp, r, 0, TAU);
        ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  if (typeof window !== 'undefined') {
    var active = 0, sum = 0, mx = 0;
    for (var i = 0; i < cols * rows; i++) {
      if (state[i] > 0.15) active++;
      sum += state[i];
      if (state[i] > mx) mx = state[i];
    }
    window.__p1583 = {
      t: t, steps: stepCount, cols: cols, rows: rows,
      active: active, mean: Number((sum / (cols * rows)).toFixed(4)),
      max: Number(mx.toFixed(4)), phone: isPhone()
    };
  }
}
function onDown(e) {
  pointer = { x: e.clientX, y: e.clientY };
  scatter(e.clientX, e.clientY);
  draw(lastT);
}
function onMove(e) {
  if (!pointer) return;
  pointer = { x: e.clientX, y: e.clientY };
  scatter(e.clientX, e.clientY);
  draw(lastT);
}
function onUp() {
  pointer = null;
}
buildKernel();
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof document !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
