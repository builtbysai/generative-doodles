<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Follow the Ribbon</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#7A4A2B; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function phase(t, a, b) { return clamp01((t - a) / (b - a)); }
function smooth(u) { return u * u * (3 - 2 * u); }
function cross(ax, ay, bx, by) { return ax * by - ay * bx; }
function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ---- the 4.6.12 base, grown by contact --------------------------------
// Every vertex of the tiling touches a square, a hexagon and a
// dodecagon, so around any polygon the neighbours alternate between
// the other two kinds. The patch is grown by breadth-first contact
// from one dodecagon: across each edge, the alternating rule names
// the neighbour, and shared-edge geometry places it. Edge length 1.
function ROf(n) { return 1 / (2 * Math.sin(Math.PI / n)); }
function apOf(n) { return 1 / (2 * Math.tan(Math.PI / n)); }
function typeAcross(n, j, label) {
  var even = ((j + label) % 2 === 0);
  if (n === 12) return even ? 6 : 4;
  if (n === 6) return even ? 12 : 4;
  return even ? 12 : 6;                        // n === 4
}
function labelFor(nNew, nOld) {
  // the new polygon's edge 0 is the shared edge; its label must make
  // the rule name the polygon we came from across that edge
  for (var l = 0; l < 2; l++) if (typeAcross(nNew, 0, l) === nOld) return l;
  return 0;
}
function growTiling(patchR) {
  var seed = { x: 0, y: 0, n: 12, rot: -Math.PI / 2 - Math.PI / 12, label: 0 };
  var polys = [seed], seen = {}, queue = [seed];
  seen[Math.round(0) + ',' + Math.round(0) + ',12'] = true;
  while (queue.length) {
    var p = queue.shift();
    for (var j = 0; j < p.n; j++) {
      var th = p.rot + Math.PI / p.n + j * 2 * Math.PI / p.n;
      var mx = p.x + Math.cos(th) * apOf(p.n), my = p.y + Math.sin(th) * apOf(p.n);
      var nn = typeAcross(p.n, j, p.label);
      var nx = mx + Math.cos(th) * apOf(nn), ny = my + Math.sin(th) * apOf(nn);
      if (Math.hypot(nx, ny) > patchR) continue;
      var key = Math.round(nx * 30) + ',' + Math.round(ny * 30) + ',' + nn;
      if (seen[key]) continue;
      seen[key] = true;
      var np = { x: nx, y: ny, n: nn, rot: th + Math.PI - Math.PI / nn, label: labelFor(nn, p.n) };
      polys.push(np); queue.push(np);

// ---- the five moves on the grown base ---------------------------------
var segs = [], crossings = [], ribbonW = 10;
var pathSegs = [], pathSamples = [], pathCross = [], pathTotal = 1;
function polyPts(cx, cy, n, R, rot) {
  var pts = [], k, a;
  for (k = 0; k < n; k++) {

}
function rayHit(mx, my, dx, dy, pts) {
  var best = Infinity, i, A, B, ex, ey, den, u, v;
  for (i = 0; i < pts.length; i++) {
    A = pts[i]; B = pts[(i + 1) % pts.length];
    ex = B[0] - A[0]; ey = B[1] - A[1];
    den = cross(dx, dy, ex, ey);
    if (Math.abs(den) < 1e-9) continue;
    u = cross(A[0] - mx, A[1] - my, ex, ey) / den;
    v = cross(A[0] - mx, A[1] - my, dx, dy) / den;

}
function segLen(s) { return Math.hypot(s.x2 - s.x1, s.y2 - s.y1); }

function build() {
  segs = []; crossings = []; pathSegs = []; pathSamples = []; pathCross = [];
  if (!W || !H) return;
  var aPx = Math.max(38, Math.min(100, Math.min(W, H) * 0.105));
  ribbonW = aPx * 0.15;
  var patchR = 0.5 * Math.hypot(W, H) / aPx + ROf(12) + 1.5;
  var world = growTiling(patchR);
  var cx = W / 2, cy = H / 2;
  var polys = world.map(function (p) {
    return { pts: polyPts(cx + p.x * aPx, cy + p.y * aPx, p.n, ROf(p.n) * aPx, p.rot), n: p.n };
  });

  // Every chord is discovered twice, once from each of its endpoint
  // midpoints, so chords are deduplicated on their endpoints: the
  // route may pick either copy, and a surviving twin would repaint
  // it in shadow.
  var chordSeen = {};
  polys.forEach(function (p, pi) {
    var beta = (90 - 180 / p.n) * Math.PI / 180;
    p.pts.forEach(function (A, k) {
      var B = p.pts[(k + 1) % p.pts.length];
      var mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
      var tx = B[0] - A[0], ty = B[1] - A[1], tl = Math.hypot(tx, ty);
      tx /= tl; ty /= tl;
      var cen = [0, 0];
      p.pts.forEach(function (P) { cen[0] += P[0] / p.n; cen[1] += P[1] / p.n; });
      var nx = cen[0] - mx, ny = cen[1] - my, nl = Math.hypot(nx, ny);
      nx /= nl; ny /= nl;
      [1, -1].forEach(function (sgn) {
        var dx = Math.cos(beta) * sgn * tx + Math.sin(beta) * nx;
        var dy = Math.cos(beta) * sgn * ty + Math.sin(beta) * ny;
        var u = rayHit(mx, my, dx, dy, p.pts);
        if (!isFinite(u)) return;
        var ex = mx + dx * u, ey = my + dy * u;
        var k1 = Math.round(mx * 2) + ',' + Math.round(my * 2);
        var k2 = Math.round(ex * 2) + ',' + Math.round(ey * 2);
        var ck = k1 < k2 ? k1 + '|' + k2 : k2 + '|' + k1;
        if (chordSeen[ck]) return;
        chordSeen[ck] = true;
        segs.push({ x1: mx, y1: my, x2: ex, y2: ey,
                    poly: pi, path: false, cross: [] });
      });
    });
  });
  // crossings inside each (convex) polygon, over/under alternating
  var byPoly = {};
  segs.forEach(function (s, si) { (byPoly[s.poly] = byPoly[s.poly] || []).push(si); });
  Object.keys(byPoly).forEach(function (pk) {
    var list = byPoly[pk], a, b, i2, j2;
    for (a = 0; a < list.length; a++) for (b = a + 1; b < list.length; b++) {
      i2 = list[a]; j2 = list[b];
      var s1 = segs[i2], s2 = segs[j2];
      if ((s1.x1 === s2.x1 && s1.y1 === s2.y1) || (s1.x1 === s2.x2 && s1.y1 === s2.y2) ||
          (s1.x2 === s2.x1 && s1.y2 === s2.y1) || (s1.x2 === s2.x2 && s1.y2 === s2.y2)) continue;
      var d1x = s1.x2 - s1.x1, d1y = s1.y2 - s1.y1;
      var d2x = s2.x2 - s2.x1, d2y = s2.y2 - s2.y1;
      var den = cross(d1x, d1y, d2x, d2y);
      if (Math.abs(den) < 1e-9) continue;
      var u = cross(s2.x1 - s1.x1, s2.y1 - s1.y1, d2x, d2y) / den;
      var v = cross(s2.x1 - s1.x1, s2.y1 - s1.y1, d1x, d1y) / den;
      if (u > 0.03 && u < 0.97 && v > 0.03 && v < 0.97) {
        var ci = crossings.length;
        crossings.push({ a: i2, b: j2, ua: u, ub: v });
        s1.cross.push(ci); s2.cross.push(ci);
      }
    }
  });
  segs.forEach(function (s, si) {
    var arr = s.cross.map(function (ci) {
      var c = crossings[ci];
      return { ci: ci, u: (c.a === si) ? c.ua : c.ub };
    });
    arr.sort(function (p, q) { return p.u - q.u; });
    arr.forEach(function (e, ord) {
      if (crossings[e.ci].a === si) crossings[e.ci].ordA = ord;
      else crossings[e.ci].ordB = ord;
    });
  });
  crossings.forEach(function (c) {
    var aOver = (c.ordA % 2 === 0), bOver = (c.ordB % 2 === 0);
    c.overA = (aOver === bOver) ? true : aOver;
  });
  findPath();
}

// ---- the one ribbon: longest honest route across the network ---------
function findPath() {
  // graph nodes are chord endpoints; chords sharing an endpoint are
  // one continuous ribbon passing through it
  var nodes = {}, adj = {};
  function key(x, y) { return Math.round(x / 3) + ',' + Math.round(y / 3); }
  segs.forEach(function (s, si) {
    var k1 = key(s.x1, s.y1), k2 = key(s.x2, s.y2);
    if (!nodes[k1]) { nodes[k1] = { x: s.x1, y: s.y1, sumx: 0, sumy: 0, cnt: 0 }; adj[k1] = []; }
    if (!nodes[k2]) { nodes[k2] = { x: s.x2, y: s.y2, sumx: 0, sumy: 0, cnt: 0 }; adj[k2] = []; }
    nodes[k1].sumx += s.x1; nodes[k1].sumy += s.y1; nodes[k1].cnt++;
    nodes[k2].sumx += s.x2; nodes[k2].sumy += s.y2; nodes[k2].cnt++;
    adj[k1].push({ to: k2, seg: si });
    adj[k2].push({ to: k1, seg: si });
  });
  Object.keys(nodes).forEach(function (k) {
    nodes[k].x = nodes[k].sumx / nodes[k].cnt;
    nodes[k].y = nodes[k].sumy / nodes[k].cnt;
  });
  function inEnd(k) { var nd = nodes[k]; return nd.x > W * 0.70 && nd.y < H * 0.34; }
  var startKeys = Object.keys(nodes).filter(function (k) {
    var nd = nodes[k]; return nd.x < W * 0.32 && nd.y > H * 0.60;
  });
  // The route is found in two moves. First a Dijkstra search over
  // directed chord states, where turning costs extra, so the
  // backbone flows across the field the way a strap runs: mostly
  // straight through each junction, from the entry corner to the
  // exit corner. Then the route is deliberately lengthened: short
  // cuts along it are replaced by longer detours that avoid every
  // other route node, so the ribbon winds through the whole field
  // without ever crossing or touching itself.
  function dijkstra() {
    var dist = {}, prev = {}, done = {}, heap = [];
    function push(item) {
      heap.push(item);
      var i = heap.length - 1;
      while (i > 0) {

        if (heap[p][0] <= heap[i][0]) break;
        var tmp = heap[p]; heap[p] = heap[i]; heap[i] = tmp; i = p;
      }
    }
    function pop() {
      var top = heap[0], last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        var i = 0;
        for (;;) {
          var l = 2 * i + 1, r = l + 1, m = i;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === i) break;
          var tmp = heap[m]; heap[m] = heap[i]; heap[i] = tmp; i = m;
        }
      }
      return top;
    }
    startKeys.forEach(function (k) {
      dist[k + '|-1'] = 0;
      push([0, k, -1]);
    });
    var goal = null;
    while (heap.length) {
      var item = pop(), d = item[0], u = item[1], inSeg = item[2];
      var uid = u + '|' + inSeg;
      if (done[uid]) continue;
      done[uid] = true;
      if (inSeg !== -1 && inEnd(u)) { goal = uid; break; }
      var inDir = null;
      if (inSeg >= 0 && prev[uid]) {
        var pn = nodes[prev[uid].node], un = nodes[u];
        var dl = Math.hypot(un.x - pn.x, un.y - pn.y) || 1;
        inDir = [(un.x - pn.x) / dl, (un.y - pn.y) / dl];
      }
      adj[u].forEach(function (e) {
        var tn = nodes[e.to], un2 = nodes[u];
        var ol = Math.hypot(tn.x - un2.x, tn.y - un2.y) || 1;
        var ox = (tn.x - un2.x) / ol, oy = (tn.y - un2.y) / ol;
        var turnCost = inDir ? 1.5 * (1 - (inDir[0] * ox + inDir[1] * oy)) : 0;
        var nd2 = 1 + turnCost + hash(e.seg * 13) * 0.3;
        var vid = e.to + '|' + e.seg;
        if (dist[vid] === undefined || d + nd2 < dist[vid]) {
          dist[vid] = d + nd2;
          prev[vid] = { node: u, seg: e.seg, state: uid };
          push([dist[vid], e.to, e.seg]);

    if (!goal) return null;
    var nodePath = [], segPath = [], st = goal;
    while (st) {
      nodePath.unshift(st.split('|')[0]);

  function routeLen(route) {

      var onRoute = {};
      route.nodes.forEach(function (k) { onRoute[k] = true; });
      var i = Math.floor(hash(attempt * 31 + route.nodes.length) * (route.nodes.length - 3));
      var span = 2 + Math.floor(hash(attempt * 57 + 7) * 4);
      var j = Math.min(route.nodes.length - 1, i + span);
      if (j - i < 2) continue;
      var A = route.nodes[i], B = route.nodes[j];
      var seen = {}, par = {}, q = [A];
      seen[A] = true;
      while (q.length) {

          if (seen[e.to]) return;
          if (e.to !== B && onRoute[e.to]) return;
          seen[e.to] = true; par[e.to] = { from: u, seg: e.seg };
          q.push(e.to);

      while (cur2 !== A) {
        mid.unshift(cur2);
        midSegs.unshift(par[cur2].seg);
        cur2 = par[cur2].from;

      mid.pop(); midSegs.pop();            // B itself stays as route[j]

function strokeRange(s, a, b) {

function drawWovenPass(bezel, splitEnv) {

    ctx.lineWidth = bezel ? ribbonW + 3 : ribbonW;

    blocked.forEach(function (iv) {
      if (iv[0] > cur) strokeRange(s, cur, Math.min(iv[0], len));
      cur = Math.max(cur, iv[1]);

    if (cur < len) strokeRange(s, cur, len);

    var over = c.overA ? segs[c.a] : segs[c.b];
    if (splitOn && over.path) {
      var mid = (over.pStart + over.pEnd) / 2 / pathTotal;
      if (mid > 0.345 && mid < 0.655) return;
    }
    var len = segLen(over);
    var u = (c.overA ? c.ua : c.ub) * len;
    ctx.strokeStyle = bezel ? '#C9A227' : (over.path ? 'rgba(127,209,185,0.55)' : '#4A2C17');
    ctx.lineWidth = bezel ? ribbonW + 3 : ribbonW;

// stroke the sampled route between params s0..s1; side 0 = the
// centreline, +/-1 = the twin strands at the current split
function strokeSamples(s0, s1, side, env, style, width) {
  if (s1 <= s0 || !pathSamples.length) return;
  ctx.strokeStyle = style;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  var started = false;
  pathSamples.forEach(function (p) {
    if (p.s < s0 - 0.001 || p.s > s1 + 0.001) return;
    var off = 0;
    if (side !== 0) {
      var ramp = smooth(phase(p.s, 0.36, 0.42)) * (1 - smooth(phase(p.s, 0.58, 0.64)));
      off = side * env * ramp * ribbonW * 0.36;
    }
    var x = p.x + (-p.dy) * off, y = p.y + p.dx * off;
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);

  if (started) ctx.stroke();
}
function drawStrands(env) {
  var gapP = ribbonW * 0.55 / pathTotal;
  [-1, 1].forEach(function (side) {
    // this strand passes under at alternate crossings of the route
    var cuts = [0.345];
    pathCross.forEach(function (pc, idx) {
      if (pc < 0.345 || pc > 0.655) return;
      if ((idx % 2 === 0) === (side < 0)) cuts.push(pc);
    });
    cuts.push(0.655);
    for (var pass = 0; pass < 2; pass++) {
      for (var i = 0; i < cuts.length - 1; i++) {
        var a = cuts[i] + (i > 0 ? gapP : 0), b = cuts[i + 1] - (i < cuts.length - 2 ? gapP : 0);
        if (pass === 0) strokeSamples(a, b, side, env, '#C9A227', ribbonW * 0.62 + 2.5);
        else strokeSamples(a, b, side, env, 'rgba(127,209,185,0.55)', ribbonW * 0.62);
      }
    }
  });
}

var LOOP = 24, OFFSET = 5;
function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#7A4A2B'; ctx.fillRect(0, 0, W, H);
  if (!segs.length) return;
  var t = ((now / 1000 + OFFSET) % LOOP + LOOP) % LOOP;
  var splitEnv = Math.sin(Math.PI * phase(t, 10.5, 15.5));
  drawWovenPass(true, splitEnv);
  drawWovenPass(false, splitEnv);
  if (splitEnv > 0.02) drawStrands(splitEnv);
  // the glow: a flat, fully lit segment of the ribbon itself,
  // walking the route end to end over the loop
  var head = -0.09 + (t / LOOP) * 1.18;
  var g0 = Math.max(0, head - 0.09), g1 = Math.min(1, head);
  if (g1 > g0) {
    if (splitEnv > 0.02 && g1 > 0.345 && g0 < 0.655) {
      strokeSamples(g0, Math.min(g1, 0.345), 0, splitEnv, 'rgba(127,209,185,1)', ribbonW + 1.5);
      strokeSamples(Math.max(g0, 0.655), g1, 0, splitEnv, 'rgba(127,209,185,1)', ribbonW + 1.5);
      [-1, 1].forEach(function (side) {
