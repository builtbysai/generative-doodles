<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice Mirror</title>
<style>
html, body { margin: 0; padding: 0; background: #D2D9DD; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND_TOP = '#EDF1F2';
var GROUND_BOT = '#D2D9DD';
var PATCH = '#B9CBD6';
var WATER = '#22303A';
var WATER_SOFT = '#2E4150';
var RING = '#FFFFFF';
var CRACK_FRESH = '#6FC7E8';
var CRACK_SET = '#A9BCC6';
var BUBBLE = '#FFFFFF';
var PLATE = '#F4F7F8';
var PLATE_LINE = 'rgba(70,90,100,0.55)';
var TITLE_INK = '#1E2A33';
var HINT_INK = '#4A5A64';
var FRAME_T = 60.0;
var P_RING = 26.0;
var EVENT_GAP = 21.0;
var CRACK_FADE = 18.0;
var SHUDDER_T = 2.5;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function lerpHex(h1, h2, u) {
  var a = hexRgb(h1), b = hexRgb(h2);
  var r = Math.round(a[0] + (b[0] - a[0]) * u);
  var g = Math.round(a[1] + (b[1] - a[1]) * u);
  var bl = Math.round(a[2] + (b[2] - a[2]) * u);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var RX = 0, RY = 0, RW = 0, RH = 0;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- driver: the frozen mere as an instrument. Low pulses travel
   under the ice as slow pressure rings, and the surface answers in
   rare, sudden crack events, each spidering a few fine bright lines
   that fade as they set, so the web grows denser minute by minute.
   The rings run on a 26 s cycle; crack events arrive about every
   21 s, sparse against the slow rings. ---- */
var FISSURES = [];
var POOLS = [];
var BUBBLES = [];
var PATCHES = [];
var NODES = [];
var EVENTS = [];
(function () {
  var rng = mulberry32(1766);
  var i, j, k;
  /* tonal patches in the ice ground */
  for (i = 0; i < 4; i++) {
    PATCHES.push({ x: rng(), y: rng(), r: 0.25 + rng() * 0.30, a: 0.06 + rng() * 0.06 });
  }
  /* trapped air bubbles */
  for (i = 0; i < 46; i++) {
    BUBBLES.push({
      x: rng(), y: rng(),
      r: 0.0015 + rng() * 0.0035,
      a: 0.16 + rng() * 0.24
    });
  }
  /* base fissure network: long random-walk cracks, dark water showing through */
  for (i = 0; i < 6; i++) {
    var pts = [];
    var x = rng(), y = rng();
    var ang = rng() * TAU;
    var steps = 42 + Math.floor(rng() * 30);
    for (j = 0; j < steps; j++) {
      pts.push([x, y]);
      ang += (rng() - 0.5) * 0.55;
      var st = 0.018 + rng() * 0.014;
      x += Math.cos(ang) * st;
      y += Math.sin(ang) * st;
      if (x < -0.05 || x > 1.05 || y < -0.05 || y > 1.05) break;
    }
    if (pts.length > 8) {
      FISSURES.push({ pts: pts, w: 0.0035 + rng() * 0.003 });
      if (rng() < 0.8) {
        var mid = pts[Math.floor(pts.length * (0.3 + rng() * 0.4))];
        POOLS.push({ x: mid[0], y: mid[1], rx: 0.012 + rng() * 0.016, ry: 0.006 + rng() * 0.008, rot: rng() * TAU });
      }
    }
  }
  /* pressure-ring nodes beneath the ice */
  var nodeSpots = [[0.24, 0.30], [0.72, 0.24], [0.62, 0.72], [0.28, 0.78]];
  for (i = 0; i < 4; i++) {
    NODES.push({
      x: nodeSpots[i][0] + (rng() - 0.5) * 0.06,
      y: nodeSpots[i][1] + (rng() - 0.5) * 0.06,
      off: i * 0.25 + rng() * 0.05,
      maxR: 0.16 + rng() * 0.06
    });
  }
  /* crack events: fixed schedule, one about every 21 s, precomputed to 1200 s */
  var t = 6.0;
  var ev = 0;
  while (t < 1200) {
    var cx = 0.08 + rng() * 0.84;
    var cy = 0.10 + rng() * 0.80;
    var branches = [];
    var nb = 6 + Math.floor(rng() * 4);
    for (j = 0; j < nb; j++) {
      var bpts = [[cx, cy]];
      var ba = (j / nb) * TAU + (rng() - 0.5) * 0.7;
      var bx = cx, by = cy;
      var segs = 3 + Math.floor(rng() * 3);
      for (k = 0; k < segs; k++) {
        ba += (rng() - 0.5) * 0.8;
        var bl = 0.012 + rng() * 0.022;
        bx += Math.cos(ba) * bl;
        by += Math.sin(ba) * bl;
        bpts.push([bx, by]);
      }
      branches.push(bpts);
    }
    EVENTS.push({ t: t, x: cx, y: cy, branches: branches });
    t += EVENT_GAP + (rng() - 0.5) * 8;
    ev++;
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) { RX = 0; RY = 0; RW = VW; RH = VH; }
  else {
    var s = Math.min(VW, VH);
    RX = (VW - s) / 2; RY = (VH - s) / 2; RW = s; RH = s;
  }
}
function drawGround() {
  var grad = ctx.createLinearGradient(0, RY, 0, RY + RH);
  grad.addColorStop(0, GROUND_TOP);
  grad.addColorStop(1, GROUND_BOT);
  ctx.fillStyle = grad;
  ctx.fillRect(RX, RY, RW, RH);
  var i;
  for (i = 0; i < PATCHES.length; i++) {
    var p = PATCHES[i];
    var px = RX + p.x * RW, py = RY + p.y * RH, pr = p.r * RW;
    var g = ctx.createRadialGradient(px, py, 0, px, py, pr);
    g.addColorStop(0, rgba(PATCH, p.a));
    g.addColorStop(1, rgba(PATCH, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(px + pr, py);
    ctx.arc(px, py, pr, 0, TAU);
    ctx.fill();
  }
  for (i = 0; i < BUBBLES.length; i++) {
    var b = BUBBLES[i];
    var bx = RX + b.x * RW, by = RY + b.y * RH, br = Math.max(1, b.r * RW);
    ctx.fillStyle = rgba(BUBBLE, b.a);
    ctx.beginPath();
    ctx.moveTo(bx + br, by);
    ctx.arc(bx, by, br, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = rgba(BUBBLE, b.a * 0.7);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx + br, by);
    ctx.arc(bx, by, br, 0, TAU);
    ctx.stroke();
  }
}
function drawFissures() {
  var i, j;
  for (i = 0; i < FISSURES.length; i++) {
    var f = FISSURES[i];
    var w = Math.max(1.5, f.w * RW);
    ctx.strokeStyle = WATER;
    ctx.lineWidth = w;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (j = 0; j < f.pts.length; j++) {
      var px = RX + f.pts[j][0] * RW, py = RY + f.pts[j][1] * RH;
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    /* faint lit edge along the water line */
    ctx.strokeStyle = rgba('#FFFFFF', 0.22);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (j = 0; j < f.pts.length; j++) {
      var qx = RX + f.pts[j][0] * RW, qy = RY + f.pts[j][1] * RH;
      if (j === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);
    }
    ctx.stroke();
  }
  for (i = 0; i < POOLS.length; i++) {
    var p = POOLS[i];
    var cx = RX + p.x * RW, cy = RY + p.y * RH;
    ctx.fillStyle = rgba(WATER_SOFT, 0.85);
    ctx.beginPath();
    ctx.moveTo(cx + p.rx * RW, cy);
    ctx.ellipse(cx, cy, p.rx * RW, p.ry * RH, p.rot, 0, TAU);
    ctx.fill();
  }
}
function drawRings(t) {
  var i;
  for (i = 0; i < NODES.length; i++) {
    var n = NODES[i];
    var prog = ((t / P_RING + n.off) % 1);
    var cx = RX + n.x * RW, cy = RY + n.y * RH;
    var rr = (0.015 + prog * n.maxR) * RW;
    var fa = (0.38 * (1 - prog)).toFixed(4);
    ctx.strokeStyle = 'rgba(255,255,255,' + fa + ')';
    ctx.lineWidth = Math.max(1, RW * 0.002);
    ctx.beginPath();
    ctx.moveTo(cx + rr, cy);
    ctx.ellipse(cx, cy, rr, rr * 0.62, 0, 0, TAU);
    ctx.stroke();
    /* faint trailing ring */
    var prog2 = (prog + 0.85) % 1;
    var rr2 = (0.015 + prog2 * n.maxR) * RW;
    var fa2 = (0.16 * (1 - prog2)).toFixed(4);
    ctx.strokeStyle = 'rgba(255,255,255,' + fa2 + ')';
    ctx.lineWidth = Math.max(1, RW * 0.0015);
    ctx.beginPath();
    ctx.moveTo(cx + rr2, cy);
    ctx.ellipse(cx, cy, rr2, rr2 * 0.62, 0, 0, TAU);
    ctx.stroke();
  }
}
function drawCracks(t) {
  var i, j, k;
  for (i = 0; i < EVENTS.length; i++) {
    var ev = EVENTS[i];
    if (ev.t > t) break;
    var age = t - ev.t;
    var fresh = clamp(1 - age / CRACK_FADE, 0, 1);
    var col = lerpHex(CRACK_FRESH, CRACK_SET, 1 - fresh);
    var alpha = (0.55 + 0.40 * fresh).toFixed(4);
    var shud = age < SHUDDER_T ? (1 - age / SHUDDER_T) : 0;
    ctx.strokeStyle = col;
    ctx.globalAlpha = parseFloat(alpha);
    ctx.lineWidth = Math.max(1, RW * 0.0012);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (j = 0; j < ev.branches.length; j++) {
      var br = ev.branches[j];
      ctx.beginPath();
      for (k = 0; k < br.length; k++) {
        var jx = 0, jy = 0;
        if (shud > 0) {
          jx = Math.sin(t * 37 + k * 2.3 + j * 1.1) * 1.4 * shud;
          jy = Math.cos(t * 31 + k * 1.7 + j * 0.9) * 1.4 * shud;
        }
        var px = RX + br[k][0] * RW + jx, py = RY + br[k][1] * RH + jy;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Ice Mirror').width > RW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Ice Mirror').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 12').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = RX + 12, plateY = RY + 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Ice Mirror', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 12', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = RX + 12;
  var hintPlateY = RY + RH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND_BOT;
  ctx.fillRect(0, 0, VW, VH);
  drawGround();
  drawFissures();
  drawRings(phaseT);
  drawCracks(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    eventCountAt: function (t) {
      var n = 0, i;
      for (i = 0; i < EVENTS.length; i++) if (EVENTS[i].t <= t) n++;
      return n;
    },
    fissureCount: function () { return FISSURES.length; },
    nodeCount: function () { return NODES.length; },
    ringPeriod: function () { return P_RING; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, three crack events already set,
   rings mid-expansion from all four nodes, web reading at first frame ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
