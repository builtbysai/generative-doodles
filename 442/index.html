<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mountain of Stools</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #BFE3B4; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- deterministic rng (fixed seed, authored once) ----------
  var seed = 44207;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  // ---------- viewport ----------
  var W = 0, H = 0, DPR = 1;
  function viewW() { return (window.visualViewport && window.visualViewport.width) ? window.visualViewport.width : window.innerWidth; }
  function viewH() { return (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight; }
  function isPhone() {
    var sw = (window.screen && window.screen.width) ? window.screen.width : W;
    var sh = (window.screen && window.screen.height) ? window.screen.height : H;
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }
  function resize() {
    W = viewW(); H = viewH();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', function () { resize(); draw(phaseNow()); });
  window.addEventListener('resize', function () { resize(); draw(phaseNow()); });

  // ---------- precomputed rock ridge shapes (fractions of W/H) ----------
  function ridge(baseY, amp, step) {
    var pts = [], x;
    for (x = -0.05; x <= 1.051; x += step) {
      pts.push([x, baseY + (rnd() - 0.5) * amp + Math.sin(x * 9.1 + baseY * 40) * amp * 0.35]);
    }
    return pts;
  }
  var ridgeA = ridge(0.355, 0.020, 0.045);   // back ridge at the horizon
  var ridgeB = ridge(0.560, 0.045, 0.05);    // mid rock shelf
  var ridgeC = ridge(0.795, 0.040, 0.05);    // front rock shelf

  // cloud bands: [cx, cy, w, h, speed, alpha]
  var clouds = [
    [0.18, 0.10, 0.62, 0.035, 0.004, 0.16],
    [0.66, 0.155, 0.78, 0.045, 0.003, 0.12],
    [0.38, 0.245, 0.55, 0.030, 0.005, 0.14],
    [0.85, 0.275, 0.48, 0.026, 0.006, 0.10]
  ];

  // stools: [cx, baseY, height, kind]  kind: 0 solid, 1 wireframe; painter order by baseY
  var stools = [
    { cx: 0.18, base: 0.600, h: 0.42, wire: false, sway: false },
    { cx: 0.37, base: 0.640, h: 0.50, wire: true,  sway: false },
    { cx: 0.82, base: 0.680, h: 0.55, wire: false, sway: false },
    { cx: 0.55, base: 0.860, h: 0.72, wire: false, sway: true  },
    { cx: 0.10, base: 0.900, h: 0.40, wire: false, sway: false }
  ];

  // ---------- drag / parallax state ----------
  var pan = 0, panTarget = 0, dragging = false, lastX = 0;
  function px(e) { return (e.touches && e.touches.length) ? e.touches[0].clientX : e.clientX; }
  canvas.addEventListener('pointerdown', function (e) { dragging = true; lastX = px(e); });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var x = px(e); panTarget += (x - lastX); lastX = x;
    var lim = W * 0.14; if (panTarget > lim) panTarget = lim; if (panTarget < -lim) panTarget = -lim;
  });
  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('touchstart', function (e) { dragging = true; lastX = px(e); }, { passive: true });
  canvas.addEventListener('touchmove', function (e) {
    if (!dragging) return; var x = px(e); panTarget += (x - lastX); lastX = x;
    var lim = W * 0.14; if (panTarget > lim) panTarget = lim; if (panTarget < -lim) panTarget = -lim;
  }, { passive: true });
  canvas.addEventListener('touchend', endDrag);

  // ---------- helpers ----------
  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  function quad(a, b, c, d, fill) {
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- one stool, drawn as real furniture, just enormous ----------
  function drawStool(s, t) {
    var h = s.h * H, cx = s.cx * W, base = s.base * H;
    var seatW = 0.58 * h, seatTh = 0.085 * h;
    var seatTop = base - h;
    var bx = 0.030 * h, by = -0.045 * h;              // back-edge offset (perspective)
    var legIn = 0.065 * h;                            // leg inset from seat edge
    var fx = seatW / 2 - 0.018 * h;                   // front foot half-spread
    var tw = 0.052 * h, fw = 0.038 * h;                // leg width top / foot
    ctx.save();
    if (s.sway) {
      var ang = Math.sin(t * Math.PI * 2 / 18) * Math.PI / 180; // 1 degree sway
      ctx.translate(cx, base); ctx.rotate(ang); ctx.translate(-cx, -base);
    }
    // long soft shadow across the rocks (sun is upper left, shadows run right)
    var shLen = h * 0.95, shDrop = h * 0.10;
    var shG = ctx.createLinearGradient(cx, 0, cx + shLen, 0);
    shG.addColorStop(0, 'rgba(24,19,38,0.20)'); shG.addColorStop(1, 'rgba(24,19,38,0)');
    quad([cx - fx * 0.8, base - 2], [cx + shLen, base + shDrop - h * 0.018],
         [cx + shLen, base + shDrop + h * 0.018], [cx + fx * 0.8, base + 2], shG);

    function leg(x0, y0, x1, y1, w0, w1, fill, strokeOnly) {
      var dx = x1 - x0, dy = y1 - y0, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / len, ny = dx / len;
      var p = [[x0 + nx * w0, y0 + ny * w0], [x0 - nx * w0, y0 - ny * w0],
               [x1 - nx * w1, y1 - ny * w1], [x1 + nx * w1, y1 + ny * w1]];
      poly(p);
      if (strokeOnly) {
        ctx.fillStyle = 'rgba(160,113,74,0.06)'; ctx.fill();
        ctx.strokeStyle = '#A0714A'; ctx.lineWidth = Math.max(2.2, h * 0.009); ctx.stroke();
      }
      else { ctx.fillStyle = fill; ctx.fill(); }
    }
    var footY = base, backFootY = base + by;
    var topY = seatTop + seatTh * 0.8;
    // back legs first (darker)
    leg(cx - seatW / 2 + legIn + bx, topY + by, cx - fx + bx, backFootY, tw, fw, '#4E3421', s.wire);
    leg(cx + seatW / 2 - legIn + bx, topY + by, cx + fx + bx, backFootY, tw, fw, '#4E3421', s.wire);
    if (!s.wire) {
      // side stretchers
      quad([cx - seatW / 2 + legIn, base - h * 0.30], [cx - seatW / 2 + legIn + bx, base - h * 0.30 + by],
           [cx - seatW / 2 + legIn + bx, base - h * 0.335 + by], [cx - seatW / 2 + legIn, base - h * 0.335], '#54381F');
      quad([cx + seatW / 2 - legIn, base - h * 0.30], [cx + seatW / 2 - legIn + bx, base - h * 0.30 + by],
           [cx + seatW / 2 - legIn + bx, base - h * 0.335 + by], [cx + seatW / 2 - legIn, base - h * 0.335], '#54381F');
    }
    // front legs
    leg(cx - seatW / 2 + legIn, topY, cx - fx, footY, tw, fw, '#6B4A2E', s.wire);
    leg(cx + seatW / 2 - legIn, topY, cx + fx, footY, tw, fw, '#6B4A2E', s.wire);
    if (!s.wire) {
      // front stretcher
      var sy = base - h * 0.30;
      var lg = ctx.createLinearGradient(0, sy, 0, sy + h * 0.032);
      lg.addColorStop(0, '#7A5636'); lg.addColorStop(1, '#54381F');
      rrect(cx - fx + fw * 0.4, sy, (fx - fw * 0.4) * 2, h * 0.032, h * 0.012);
      ctx.fillStyle = lg; ctx.fill();
      // seat: front band, then top face
      var sg = ctx.createLinearGradient(0, seatTop, 0, seatTop + seatTh);
      sg.addColorStop(0, '#7A5636'); sg.addColorStop(1, '#573D24');
      rrect(cx - seatW / 2, seatTop, seatW, seatTh, h * 0.022);
      ctx.fillStyle = sg; ctx.fill();
      var tg = ctx.createLinearGradient(0, seatTop + by, 0, seatTop);
      tg.addColorStop(0, '#B08254'); tg.addColorStop(1, '#96683C');
      poly([[cx - seatW / 2, seatTop], [cx - seatW / 2 + bx, seatTop + by],
            [cx + seatW / 2 + bx, seatTop + by], [cx + seatW / 2, seatTop]]);
      ctx.fillStyle = tg; ctx.fill();
      ctx.strokeStyle = 'rgba(160,113,74,0.85)'; ctx.lineWidth = Math.max(1, h * 0.004); ctx.stroke();
      // wood grain on the top face
      ctx.strokeStyle = 'rgba(84,56,31,0.20)'; ctx.lineWidth = Math.max(1, h * 0.003);
      for (var gI = 1; gI <= 2; gI++) {
        var gy = seatTop + by + (seatTh * 0.4) * gI * 0.5;
        ctx.beginPath();
        ctx.moveTo(cx - seatW * 0.36 + bx * gI * 0.5, gy);
        ctx.quadraticCurveTo(cx, gy - h * 0.006, cx + seatW * 0.36 + bx * gI * 0.5, gy);
        ctx.stroke();
      }
      // warm edge light on the front band
      ctx.strokeStyle = 'rgba(160,113,74,0.55)'; ctx.lineWidth = Math.max(1, h * 0.004);
      ctx.beginPath(); ctx.moveTo(cx - seatW / 2 + h * 0.02, seatTop + seatTh - 1); ctx.lineTo(cx + seatW / 2 - h * 0.02, seatTop + seatTh - 1); ctx.stroke();
    }
    ctx.restore();
  }

  function drawFigure(x, baseY, fh, lean) {
    ctx.fillStyle = '#1A1626';
    var hr = fh * 0.16;
    ctx.beginPath(); ctx.arc(x, baseY - fh + hr, hr, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - fh * 0.20 + lean, baseY - fh * 0.80);
    ctx.quadraticCurveTo(x + lean, baseY - fh * 0.88, x + fh * 0.20 + lean, baseY - fh * 0.80);
    ctx.lineTo(x + fh * 0.13, baseY - fh * 0.28);
    ctx.lineTo(x + fh * 0.16, baseY);
    ctx.lineTo(x + fh * 0.05, baseY);
    ctx.lineTo(x, baseY - fh * 0.24);
    ctx.lineTo(x - fh * 0.05, baseY);
    ctx.lineTo(x - fh * 0.16, baseY);
    ctx.lineTo(x - fh * 0.13, baseY - fh * 0.28);
    ctx.closePath(); ctx.fill();
  }

  // ---------- main draw at loop phase t (seconds) ----------
  var OFFSET = 3.7;
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var u = Math.min(W, H);
    var horizon = 0.35 * H;
    pan += (panTarget - pan) * 0.12;

    // sky (parallax 0.10)
    var skyOff = pan * 0.10;
    var sky = ctx.createLinearGradient(0, 0, 0, horizon * 1.25);
    sky.addColorStop(0, '#BFE3B4'); sky.addColorStop(1, '#F5E7A0');
    ctx.fillStyle = sky;
    ctx.fillRect(-Math.abs(skyOff) - 2, 0, W + Math.abs(skyOff) * 2 + 4, horizon * 1.25);

    // sun + breathing glow (parallax 0.25)
    var sunX = 0.27 * W + pan * 0.25, sunY = 0.175 * H, sunR = 0.082 * u;
    var breath = 1 + 0.1 * Math.sin(t * Math.PI * 2 / 12);
    var glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.4, sunX, sunY, sunR * 2.6 * breath);
    glow.addColorStop(0, 'rgba(253,243,227,0.55)'); glow.addColorStop(1, 'rgba(253,243,227,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR * 2.6 * breath, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FDF3E3';
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.fill();

    // drifting cloud bands (sky parallax)
    for (var ci = 0; ci < clouds.length; ci++) {
      var cl = clouds[ci];
      var cxp = (((cl[0] + t * cl[4]) % 1.4) - 0.2) * W + skyOff;
      ctx.fillStyle = 'rgba(253,243,227,' + cl[5] + ')';
      ctx.beginPath();
      ctx.ellipse(cxp, cl[1] * H, cl[2] * W * 0.5, cl[3] * H, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // back rock ridge, its top edge rippling with heat shimmer (parallax 0.40)
    var i, pts;
    ctx.fillStyle = '#5A5178';
    ctx.beginPath();
    for (i = 0; i < ridgeA.length; i++) {
      var ax = ridgeA[i][0] * W + pan * 0.40;
      var ay = ridgeA[i][1] * H + Math.sin(ridgeA[i][0] * 46 + t * 1.7) * 1.6 + Math.sin(ridgeA[i][0] * 15 - t * 0.9) * 1.2;
      if (i === 0) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
    }
    ctx.lineTo(W + pan * 0.40 + W * 0.05, 0.62 * H); ctx.lineTo(-W * 0.05 + pan * 0.40, 0.62 * H);
    ctx.closePath(); ctx.fill();

    // back stools stand on the ridge shelf
    drawStool(stools[0], t);
    drawStool(stools[1], t);

    // violet wash band over the ridge base
    var wash = ctx.createLinearGradient(0, 0.42 * H, 0, 0.62 * H);
    wash.addColorStop(0, 'rgba(107,91,142,0)');
    wash.addColorStop(1, 'rgba(107,91,142,0.35)');
    ctx.fillStyle = wash; ctx.fillRect(0, 0.42 * H, W, 0.20 * H);

    // mid rock shelf (parallax 0.65)
    pts = [];
    ctx.fillStyle = '#4A4460';
    ctx.beginPath();
    for (i = 0; i < ridgeB.length; i++) {
      var bxp = ridgeB[i][0] * W + pan * 0.65;
      if (i === 0) ctx.moveTo(bxp, ridgeB[i][1] * H); else ctx.lineTo(bxp, ridgeB[i][1] * H);
    }
    ctx.lineTo(W + pan * 0.65 + W * 0.05, 0.86 * H); ctx.lineTo(-W * 0.05 + pan * 0.65, 0.86 * H);
    ctx.closePath(); ctx.fill();
    // facet shading on the mid shelf
    ctx.fillStyle = 'rgba(107,91,142,0.20)';
    poly([[-0.02 * W + pan * 0.65, 0.60 * H], [0.30 * W + pan * 0.65, 0.575 * H], [0.42 * W + pan * 0.65, 0.70 * H], [0.10 * W + pan * 0.65, 0.74 * H]]);
    ctx.fill();
    ctx.fillStyle = 'rgba(26,22,38,0.18)';
    poly([[0.58 * W + pan * 0.65, 0.60 * H], [0.86 * W + pan * 0.65, 0.63 * H], [0.98 * W + pan * 0.65, 0.78 * H], [0.70 * W + pan * 0.65, 0.76 * H]]);
    ctx.fill();

    // right stool, then the giant centre stool
    drawStool(stools[2], t);
    drawStool(stools[3], t);

    // front rock shelf (parallax 1.0)
    ctx.fillStyle = '#3B3550';
    ctx.beginPath();
    for (i = 0; i < ridgeC.length; i++) {
      var cxp2 = ridgeC[i][0] * W + pan;
      if (i === 0) ctx.moveTo(cxp2, ridgeC[i][1] * H); else ctx.lineTo(cxp2, ridgeC[i][1] * H);
    }
    ctx.lineTo(W + pan + W * 0.05, H); ctx.lineTo(-W * 0.05 + pan, H);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(107,91,142,0.16)';
    poly([[-0.02 * W + pan, 0.83 * H], [0.34 * W + pan, 0.815 * H], [0.46 * W + pan, 0.92 * H], [0.12 * W + pan, 0.95 * H]]);
    ctx.fill();

    // two tiny figures between the centre stool's legs, standing on the front shelf
    var fh = 0.028 * H, fbase = 0.865 * H;
    drawFigure(0.512 * W, fbase, fh, 0);
    drawFigure(0.543 * W, fbase, fh * 0.92, fh * 0.03);

    // smallest stool, front left, standing on the front shelf
    drawStool(stools[4], t);
  }

  // ---------- loop: first frame at a constant phase, rAF anchored ----------
  var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  function clockNow() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }
  function phaseNow() { return OFFSET + (clockNow() - startStamp) / 1000; }
  draw(OFFSET);
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () { draw(phaseNow()); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
