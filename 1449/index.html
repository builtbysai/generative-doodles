<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hundred Beauties, One Contour</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f2ead8; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var PAPER = '#f2ead8', INK = '#1a1a1a';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1449000);
  // Seeded spider anchor positions on the empress robe (stable every loop).
  var spiderSpots = [];
  for (var si = 0; si < 5; si++) {
    spiderSpots.push({ x: -0.30 + rnd() * 0.60, y: 0.10 + rnd() * 0.52, s: 0.8 + rnd() * 0.5 });
  }

  var W = 0, H = 0, isPhone = false;
  function sizeCanvas() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width && window.visualViewport.height) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth && window.innerHeight) {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1280; h = 900; }
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width; sh = window.screen.height; }
    var minDim = Math.min(sw || w, sh || h);
    isPhone = (minDim > 0 && minDim < 700) || (h > w * 1.15);
    try { if (typeof document !== 'undefined' && document.body) document.body.style.background = PAPER; } catch (e) {}
  }
  sizeCanvas();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { sizeCanvas(); draw(clockT); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { sizeCanvas(); draw(clockT); });
    }
  }

  function a4(x) { return Math.round(x * 10000) / 10000; }
  function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }
  function easeOut(t) { return 1 - (1 - t) * (1 - t); }
  function easeIn(t) { return t * t; }

  function rect(x, y, w, h, fill, strokeW) {
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (strokeW) { ctx.lineWidth = strokeW; ctx.strokeStyle = INK; ctx.stroke(); }
  }
  function disc(x, y, r, fill, strokeW) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (strokeW) { ctx.lineWidth = strokeW; ctx.strokeStyle = INK; ctx.stroke(); }
  }
  function line(x1, y1, x2, y2, color, width) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  function poly(points, fill, strokeW) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (strokeW) { ctx.lineWidth = strokeW; ctx.strokeStyle = INK; ctx.stroke(); }
  }

  // Parade timing (closed form). One slot = 7.5 s: enter 1.2, tableau 3.0,
  // gesture 1.5, exit 1.8. Frame one (t=0) sits at tableau start of figure 0.
  var SLOT = 7.5, CYCLE = 22.5, OFFSET = 1.2;
  function paradeState(t) {
    var p = t + OFFSET;
    var idx = Math.floor(p / SLOT) % 3;
    var local = p - Math.floor(p / SLOT) * SLOT;
    var phase = 'enter', x = 0, g = 0;
    var cx = W / 2, fw = figureW();
    if (local < 1.2) {
      phase = 'enter';
      var e = easeOut(local / 1.2);
      x = cx + (1 - e) * (-(cx + fw));
    } else if (local < 4.2) {
      phase = 'tableau'; x = cx;
    } else if (local < 5.7) {
      phase = 'gesture'; x = cx;
      g = Math.sin(Math.PI * (local - 4.2) / 1.5);
    } else {
      phase = 'exit';
      var e2 = easeIn((local - 5.7) / 1.8);
      x = cx + e2 * (W - cx + fw);
    }
    return { idx: idx, phase: phase, x: x, g: g, local: local };
  }
  function figureW() { return H * 0.80 * 0.46; }
  function figureH() { return H * 0.80; }

  // Shared silhouette: head, torso, arms, legs, strong black contour.
  // u is the unit (figure height / 100); cx, top are the figure origin.
  function drawFigure(idx, cx, top, u, g) {
    var fh = 100 * u;
    var cy = top + fh * 0.52; // vertical centre of the figure
    // Ground shadow (single flat ellipse, own path).
    ctx.save();
    ctx.translate(cx, top + fh * 1.02);
    ctx.scale(1, 0.18);
    ctx.beginPath();
    ctx.moveTo(30 * u, 0);
    ctx.arc(0, 0, 30 * u, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(26,26,26,0.18)';
    ctx.fill();
    ctx.restore();

    var headR = 7 * u, headX = cx, headY = top + 10 * u;
    var shoulderY = top + 22 * u, hipY = top + 58 * u, footY = top + 98 * u;
    var skin = '#e8c8a8';

    if (idx === 1) {
      // Empress: ring of turbaned skulls behind the robe base.
      for (var k = 0; k < 7; k++) {
        var sx = cx + (k - 3) * 11 * u, sy = top + 92 * u;
        disc(sx, sy, 4.2 * u, '#efe8d8', 2);
        poly([[sx - 3.4 * u, sy - 3 * u], [sx + 3.4 * u, sy - 3 * u],
              [sx + 2.2 * u, sy - 6.5 * u], [sx - 2.2 * u, sy - 6.5 * u]], '#1a7a6a', 0);
      }
    }

    // Legs (sailor + pirate) / robe (empress).
    if (idx === 1) {
      poly([[cx - 13 * u, shoulderY], [cx + 13 * u, shoulderY],
            [cx + 20 * u, footY - 2 * u], [cx - 20 * u, footY - 2 * u]], '#d81a2a', 3);
    } else if (idx === 2) {
      rect(cx - 9 * u, hipY, 7 * u, footY - hipY, '#f2f2ee', 2);
      rect(cx + 2 * u, hipY, 7 * u, footY - hipY, '#f2f2ee', 2);
      line(cx - 9 * u, footY, cx - 2 * u, footY, INK, 2);
      line(cx + 2 * u, footY, cx + 9 * u, footY, INK, 2);
    } else {
      rect(cx - 9 * u, hipY, 7 * u, footY - hipY, skin, 2);
      rect(cx + 2 * u, hipY, 7 * u, footY - hipY, skin, 2);
      line(cx - 9 * u, footY, cx - 2 * u, footY, INK, 2);
      line(cx + 2 * u, footY, cx + 9 * u, footY, INK, 2);
    }

    // Torso / bodice.
    if (idx === 0) {
      poly([[cx - 11 * u, shoulderY], [cx + 11 * u, shoulderY],
            [cx + 8 * u, hipY], [cx - 8 * u, hipY]], '#b81a2a', 3);
      // Bodice lacing marks.
      line(cx - 3 * u, shoulderY + 6 * u, cx + 3 * u, shoulderY + 6 * u, '#e8a81a', 1.5);
      line(cx - 3 * u, shoulderY + 12 * u, cx + 3 * u, shoulderY + 12 * u, '#e8a81a', 1.5);
    } else if (idx === 2) {
      poly([[cx - 11 * u, shoulderY], [cx + 11 * u, shoulderY],
            [cx + 8 * u, hipY], [cx - 8 * u, hipY]], '#1a2a5a', 3);
      // Sailor stripes.
      for (var s = 0; s < 3; s++) {
        rect(cx - 10 * u, shoulderY + (5 + s * 7) * u, 20 * u, 2.5 * u, '#f2f2ee', 0);
      }
    }
    // Empress torso is the robe (already drawn); add a gold sash line.
    if (idx === 1) {
      line(cx - 12 * u, shoulderY + 14 * u, cx + 12 * u, shoulderY + 14 * u, '#e8a81a', 2);
    }

    // Arms: same silhouette for all three; attributes differ.
    var armSwing = 0;
    var armL = 16 * u, armR = 16 * u;
    var handLX = cx - 14 * u, handLY = shoulderY + 30 * u;
    var handRX = cx + 14 * u, handRY = shoulderY + 30 * u;
    if (idx === 0) {
      // Pirate queen: right hand lifts the cigarette during the gesture.
      handRY = shoulderY + 30 * u - g * 16 * u;
      handRX = cx + 12 * u - g * 3 * u;
    } else if (idx === 2) {
      // Sailor: left arm flexes during the gesture.
      handLY = shoulderY + 30 * u - g * 10 * u;
      handLX = cx - 12 * u + g * 2 * u;
    }
    line(cx - 11 * u, shoulderY + 2 * u, handLX, handLY, skin, 5 * u);
    line(cx + 11 * u, shoulderY + 2 * u, handRX, handRY, skin, 5 * u);
    // Contour over the arms.
    line(cx - 11 * u, shoulderY + 2 * u, handLX, handLY, INK, 1.5);
    line(cx + 11 * u, shoulderY + 2 * u, handRX, handRY, INK, 1.5);
    disc(handLX, handLY, 2.6 * u, skin, 2);
    disc(handRX, handRY, 2.6 * u, skin, 2);

    // Tattoos.
    if (idx === 0) {
      // Tattooed arms: small ink diamonds along both forearms.
      for (var t = 0; t < 3; t++) {
        var ty = shoulderY + (10 + t * 8) * u;
        disc(cx - 13 * u, ty, 1.4 * u, '#2a2a4a', 0);
        disc(cx + 13 * u, ty, 1.4 * u, '#2a2a4a', 0);
      }
      // Gold hoop earring.
      disc(cx + headR + 1 * u, headY + 2 * u, 1.8 * u, '#e8a81a', 1.5);
    }
    if (idx === 2) {
      // Heart tattoo on the left arm, anchor tattoo on the right arm.
      var hy = shoulderY + 16 * u;
      disc(cx - 13 * u - 1.6 * u, hy, 1.8 * u, '#c81a2a', 0);
      disc(cx - 13 * u + 1.6 * u, hy, 1.8 * u, '#c81a2a', 0);
      poly([[cx - 13 * u - 3 * u, hy + 1 * u], [cx - 13 * u + 3 * u, hy + 1 * u],
            [cx - 13 * u, hy + 5 * u]], '#c81a2a', 0);
      var ay = shoulderY + 16 * u;
      line(cx + 13 * u, ay - 3 * u, cx + 13 * u, ay + 4 * u, '#5a6a7a', 2);
      line(cx + 13 * u - 3 * u, ay - 1 * u, cx + 13 * u + 3 * u, ay - 1 * u, '#5a6a7a', 2);
      disc(cx + 13 * u, ay + 4 * u, 1.6 * u, '#5a6a7a', 0);
    }

    // Spiders on the empress robe.
    if (idx === 1) {
      for (var sp = 0; sp < spiderSpots.length; sp++) {
        var spot = spiderSpots[sp];
        var px = cx + spot.x * 36 * u, py = top + (22 + spot.y * 62) * u;
        var pr = 2.2 * u * spot.s;
        disc(px, py, pr, '#141414', 0);
        for (var leg = 0; leg < 4; leg++) {
          var la = -0.9 + leg * 0.6;
          line(px, py, px + Math.cos(la) * pr * 2.2, py + Math.sin(la) * pr * 2.2, '#141414', 1);
          line(px, py, px - Math.cos(la) * pr * 2.2, py + Math.sin(la) * pr * 2.2, '#141414', 1);
        }
      }
    }

    // Head: same contour for all three; gesture turns the empress head.
    var hx = headX + (idx === 1 ? g * 3 * u : 0);
    disc(hx, headY, headR, skin, 3);
    // Simple face: two dot eyes, no photorealism.
    disc(hx - 2.5 * u, headY - 1 * u, 0.9 * u, INK, 0);
    disc(hx + 2.5 * u, headY - 1 * u, 0.9 * u, INK, 0);
    line(hx - 2 * u, headY + 3.5 * u, hx + 2 * u, headY + 3.5 * u, INK, 1.5);

    if (idx === 0) {
      // Pirate hat: wide brim + crown.
      poly([[hx - 11 * u, headY - 5 * u], [hx + 11 * u, headY - 5 * u],
            [hx + 6 * u, headY - 11 * u], [hx - 6 * u, headY - 11 * u]], INK, 2);
      line(hx - 11 * u, headY - 5 * u, hx + 11 * u, headY - 5 * u, '#e8a81a', 1.5);
      // Drooping cigarette: from the mouth, sagging down; lifted by the
      // gesture hand (g moves its tip toward the mouth).
      var cigX = hx + 3 * u, cigY = headY + 3.5 * u;
      var tipY = cigY + 7 * u - g * 6 * u;
      line(cigX, cigY, cigX + 4 * u, tipY, '#f2f2ee', 2);
      disc(cigX + 4 * u, tipY, 1 * u, '#e8a81a', 0);
      // A wisp of smoke, own arcs.
      ctx.beginPath();
      ctx.moveTo(cigX + 4 * u, tipY - 2 * u);
      ctx.arc(cigX + 5 * u, tipY - 4 * u, 1.5 * u, Math.PI, Math.PI * 2);
      ctx.strokeStyle = '#5a5a5a'; ctx.lineWidth = 1; ctx.stroke();
    } else if (idx === 1) {
      // Empress crown + turban wrap.
      poly([[hx - 6 * u, headY - 6 * u], [hx + 6 * u, headY - 6 * u],
            [hx + 4 * u, headY - 11 * u], [hx - 4 * u, headY - 11 * u]], '#e8a81a', 2);
    } else {
      // Sailor cap.
      poly([[hx - 6 * u, headY - 6 * u], [hx + 6 * u, headY - 6 * u],
            [hx + 5 * u, headY - 9 * u], [hx - 5 * u, headY - 9 * u]], '#f2f2ee', 2);
    }
  }

  // ---- Interaction state (closed form over recorded events) ----
  var drag = null;          // { mode: 'scrub'|'pause', startX, startY, x, y, t }
  var timeOffset = 0;       // committed parade-time shift from scrub drags
  var liveBoost = 0;        // in-progress scrub boost
  var paused = false, pauseParade = 0, pauseT = 0;

  function paradeTime(t) {
    if (paused) return pauseParade;
    return t + timeOffset + liveBoost;
  }
  function figureAt(t, x, y) {
    var st = paradeState(paradeTime(t));
    var fh = figureH(), fw = figureW();
    var top = H * 0.10;
    return (Math.abs(x - st.x) < fw * 0.75 && y > top - 5 && y < top + fh + 10);
  }
  function onDown(x, y, t) {
    if (figureAt(t, x, y)) {
      drag = { mode: 'pause', startX: x, startY: y, x: x, y: y };
      pauseParade = paradeTime(t); // capture BEFORE setting paused (paradeTime returns pauseParade while paused)
      paused = true;
      pauseT = t;
    } else {
      drag = { mode: 'scrub', startX: x, startY: y, x: x, y: y };
    }
  }
  function onMove(x, y, t) {
    if (!drag) return;
    drag.x = x; drag.y = y;
    if (drag.mode === 'scrub') {
      liveBoost = clamp((x - drag.startX) * 0.02, -CYCLE, CYCLE);
    }
  }
  function onUp(x, y, t) {
    if (!drag) return;
    if (drag.mode === 'scrub') {
      timeOffset += liveBoost;
      liveBoost = 0;
    } else {
      paused = false;
      timeOffset = pauseParade - t;
    }
    drag = null;
  }

  var clockT = 0;
  function draw(t) {
    clockT = t;
    sizeCanvasQuiet();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    var st = paradeState(paradeTime(t));
    var fh = figureH(), u = fh / 100;
    var top = H * 0.10;
    drawFigure(st.idx, st.x, top, u, st.g);
  }
  // Keep canvas size in sync without resetting style work each frame.
  var lastW = -1, lastH = -1;
  function sizeCanvasQuiet() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width && window.visualViewport.height) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && window.innerWidth && window.innerHeight) {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1280; h = 900; }
    if (w !== lastW || h !== lastH) {
      W = w; H = h;
      canvas.width = w; canvas.height = h;
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      lastW = w; lastH = h;
    }
  }

  // Pointer handlers (browser). The harness has no pointer events; the
  // probe hook below drives the same functions with explicit times.
  function evtPos(e) {
    var r = { x: 0, y: 0 };
    if (e && typeof e.clientX === 'number') { r.x = e.clientX; r.y = e.clientY; }
    else if (e && typeof e.offsetX === 'number') { r.x = e.offsetX; r.y = e.offsetY; }
    return r;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      var p = evtPos(e); onDown(p.x, p.y, clockT); draw(clockT);
    });
    canvas.addEventListener('pointermove', function (e) {
      var p = evtPos(e); onMove(p.x, p.y, clockT); draw(clockT);
    });
    canvas.addEventListener('pointerup', function (e) {
      var p = evtPos(e); onUp(p.x, p.y, clockT); draw(clockT);
    });
  }

  // Probe hook (vm harness): drive the piece's own draw + handlers.
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      down: onDown, move: onMove, up: onUp,
      state: function (t) { return paradeState(paradeTime(t)); }
    };
  }

  // Frame one: constant phase, synchronous.
  draw(0);

  // rAF loop, plain function declaration behind a typeof guard.
  var startMs = null;
  function loop(now) {
    if (startMs === null) startMs = now;
    var t = (now - startMs) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
