<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghosttown, Never Twice</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070F; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function () {
  'use strict';

  // ---------- deterministic hashes (seeded only; no Math.random) ----------
  function h2(a, b) {
    var x = ((a * 374761393 + b * 668265263) ^ 0x5bf03635) >>> 0;
    x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- constants ----------
  var T0 = 40;              // fixed first-frame phase: 40 s into era 0
  var ERA_LEN = 180;        // a town lives 3 minutes
  var DISSOLVE = 2;         // then 2 s of static
  var HORIZON = 0.60;       // ground top, fraction of H
  var N_WISPS = 26;

  var COL = {
    sky: '#05070F', ground: '#0E0C14', moon: '#EDE8D8',
    sil1: '#141019', sil2: '#1E1420',
    fence: '#6B4F35', gold: '#D9A441', wisp: '#7DFFB2',
    statik: ['#8A8A93', '#A9A9B1', '#6F6F76', '#3C3C42']
  };

  // ---------- era timeline (pure function of t + summon list) ----------
  var summons = []; // absolute piece-times at which a moon-hold completed
  function eraTimeline(t) {
    var eras = [];
    var sorted = summons.slice().sort(function (a, b) { return a - b; });
    var si = 0, start = 0, idx = 0;
    while (start <= t + ERA_LEN) {
      while (si < sorted.length && sorted[si] <= start) si++; // stale / in-dissolve summons ignored
      var until = start + ERA_LEN;
      if (si < sorted.length && sorted[si] > start && sorted[si] < until) {
        until = sorted[si]; // the summon ends this era early
        si++;
      }
      eras.push({ index: idx, start: start, townUntil: until, end: until + DISSOLVE });
      start = until + DISSOLVE;
      idx++;
      if (idx > 100000) break;
    }
    return eras;
  }
  function eraAt(eras, t) {
    for (var i = 0; i < eras.length; i++) {
      if (t < eras[i].end) return eras[i];
    }
    return eras[eras.length - 1];
  }

  // ---------- town generator (pure function of era) ----------
  function townLayout(era) {
    var rng = mulberry32(1194000 + era * 7919);
    var buildings = [];
    var windows = [];
    function addWindow(b, xF, yF, wF, hF, lit) {
      var win = { x: xF, y: yF, w: wF, h: hF, lit: lit };
      b.windows.push(win); windows.push(win);
    }
    function genCluster(x0, x1) {
      var x = x0;
      while (true) {
        var wF = 0.055 + rng() * 0.05;
        if (x + wF > x1) break;
        var pick = rng();
        var type = pick < 0.14 ? 'tower' : pick < 0.30 ? 'church' : pick < 0.54 ? 'saloon' : pick < 0.77 ? 'store' : 'house';
        var base = HORIZON + (rng() - 0.5) * 0.008;
        var b = { type: type, x: x, w: wF, base: base, fill: (buildings.length % 2 === 0) ? COL.sil1 : COL.sil2, windows: [] };
        if (type === 'store') {
          b.bodyTop = base - (0.115 + rng() * 0.035);
          b.top = b.bodyTop - 0.008;
          var ns = Math.floor(rng() * 3.4);
          for (var i = 0; i < ns; i++)
            addWindow(b, x + wF * (0.2 + 0.6 * rng()), b.bodyTop + 0.045 + rng() * 0.03, 0.007, 0.011, rng() < 0.55);
        } else if (type === 'house') {
          b.bodyTop = base - (0.10 + rng() * 0.03);
          b.top = b.bodyTop - 0.045;
          var nh = Math.floor(rng() * 2.6);
          for (var j = 0; j < nh; j++)
            addWindow(b, x + wF * (0.2 + 0.6 * rng()), b.bodyTop + 0.03 + rng() * 0.025, 0.007, 0.011, rng() < 0.55);
        } else if (type === 'saloon') {
          b.bodyTop = base - (0.14 + rng() * 0.04);
          b.top = b.bodyTop - 0.034; // sign board rises above the front
          var nl = 1 + Math.floor(rng() * 2.6);
          for (var k = 0; k < nl; k++)
            addWindow(b, x + wF * (0.16 + 0.68 * rng()), b.bodyTop + 0.055 + rng() * 0.035, 0.007, 0.011, rng() < 0.6);
        } else if (type === 'church') {
          b.bodyTop = base - (0.125 + rng() * 0.02);
          b.roofTop = b.bodyTop - 0.055;
          b.steepleX = x + wF * (0.16 + rng() * 0.2);
          b.steepleW = 0.016 + rng() * 0.005;
          b.top = b.roofTop - 0.075;
          addWindow(b, x + wF * (0.42 + rng() * 0.16), b.bodyTop + 0.035, 0.006, 0.03, rng() < 0.7);
          if (rng() < 0.6)
            addWindow(b, b.steepleX + b.steepleW * 0.25, b.roofTop - 0.045, 0.005, 0.014, rng() < 0.6);
        } else { // tower
          b.legH = 0.16 + rng() * 0.03;
          b.tankH = 0.075 + rng() * 0.015;
          b.tankBot = base - b.legH;
          b.tankTop = b.tankBot - b.tankH;
          b.bodyTop = b.tankTop;
          b.top = b.tankTop - 0.03;
          addWindow(b, x + wF * 0.5 - 0.0035, b.tankTop + b.tankH * 0.35, 0.007, 0.011, rng() < 0.75);
        }
        buildings.push(b);
        x += wF + (rng() * 0.018 - 0.004);
      }
    }
    genCluster(0.03, 0.42);
    genCluster(0.58, 0.97);
    // guarantee a water tower and a church in every town
    var hasTower = false, hasChurch = false, i, b2;
    for (i = 0; i < buildings.length; i++) {
      if (buildings[i].type === 'tower') hasTower = true;
      if (buildings[i].type === 'church') hasChurch = true;
    }
    if (!hasTower) { b2 = buildings[1 % buildings.length]; b2.type = 'tower'; b2.legH = 0.17; b2.tankH = 0.08; b2.tankBot = b2.base - b2.legH; b2.tankTop = b2.tankBot - b2.tankH; b2.bodyTop = b2.tankTop; b2.top = b2.tankTop - 0.03; }
    if (!hasChurch) { b2 = buildings[(buildings.length - 2 + buildings.length) % buildings.length]; if (b2.type !== 'church' && b2.type !== 'tower') { b2.type = 'church'; b2.roofTop = b2.bodyTop - 0.055; b2.steepleX = b2.x + b2.w * 0.2; b2.steepleW = 0.018; b2.top = b2.roofTop - 0.075; } }
    // guarantee enough windows for the wisps to rise from
    var guard = 0;
    while (windows.length < 9 && guard < 40) {
      b2 = buildings[guard % buildings.length];
      if (b2.type !== 'tower')
        addWindow(b2, b2.x + b2.w * (0.2 + 0.6 * rng()), b2.bodyTop + 0.04 + rng() * 0.03, 0.007, 0.011, rng() < 0.6);
      guard++;
    }
    // lit windows first: wisps prefer lit windows
    windows.sort(function (a, b) { return (b.lit ? 1 : 0) - (a.lit ? 1 : 0); });
    // fences: one run each side, foreground
    var fences = [
      { x0: 0.05 + rng() * 0.04, x1: 0.26 + rng() * 0.06, y: 0.70 + rng() * 0.02 },
      { x0: 0.66 + rng() * 0.05, x1: 0.90 + rng() * 0.05, y: 0.725 + rng() * 0.02 }
    ];
    // gold glints on the sand, static per era
    var glints = [];
    for (i = 0; i < 46; i++)
      glints.push({ x: rng(), y: 0.63 + rng() * 0.34, s: 0.8 + rng() * 1.4, a: 0.2 + rng() * 0.4 });
    return { buildings: buildings, windows: windows, fences: fences, glints: glints };
  }

  // ---------- wisps & spirit count (pure functions of era, i, t) ----------
  function wispLife(era, i) { return 13 + h2(era * 31 + 7, i * 13 + 1) * 9; }
  function spiritCount(eras, t) {
    var total = 0;
    for (var e = 0; e < eras.length; e++) {
      var er = eras[e];
      if (t < er.start) break;
      var local = Math.min(t, er.townUntil) - er.start;
      if (local < 0) local = 0;
      for (var i = 0; i < N_WISPS; i++)
        total += Math.floor((local + i * 7) / wispLife(er.index, i));
      if (t < er.end) break;
    }
    return total;
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var isPhone = false;
  if (typeof window !== 'undefined' && window.screen) {
    isPhone = Math.min(window.screen.width || 9999, window.screen.height || 9999) < 700;
  }
  function fit() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 1280);
    var h = vv ? vv.height : (window.innerHeight || 800);
    if (!isPhone && h > w * 1.15) isPhone = true; // aspect fallback
    DPR = Math.min((typeof window !== 'undefined' && window.devicePixelRatio) || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';   // pin CSS size in draw path
    canvas.style.height = h + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  fit();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(currentT()); });
    }
    window.addEventListener('resize', function () { fit(); draw(currentT()); });
  }

  // ---------- time ----------
  function pieceNow() { return T0 + (performance.now() - startStamp) / 1000; }
  var startStamp = (typeof performance !== 'undefined') ? performance.now() : 0;
  function currentT() { return pieceNow(); }

  // ---------- pointer: drag = wind; hold on moon = summon ----------
  var samples = [];        // {t, x, y} while pointer is down
  var pointerDown = false;
  var moonHold = null;     // {t, x, y, fired}
  function moonGeom() {
    return { cx: W * 0.88, cy: H * 0.15, r: clamp(Math.min(W, H) * 0.042, 12, 40) };
  }
  function windAt(t) {
    if (!samples.length) return { x: 0, y: 0 };
    var n = samples.length, last = samples[n - 1], prev = null;
    for (var i = n - 2; i >= 0; i--) {
      if (last.t - samples[i].t > 0.02) { prev = samples[i]; break; }
    }
    if (!prev) return { x: 0, y: 0 };
    var dt = last.t - prev.t;
    var vx = (last.x - prev.x) / dt, vy = (last.y - prev.y) / dt;
    var mag = Math.sqrt(vx * vx + vy * vy), cap = 260;
    if (mag > cap) { vx *= cap / mag; vy *= cap / mag; }
    var f;
    if (pointerDown) f = 0.5;
    else {
      var age = t - last.t;
      if (age > 3.5) return { x: 0, y: 0 };
      f = 0.5 * Math.exp(-age / 1.1);
    }
    return { x: vx * f, y: vy * f };
  }
  if (typeof window !== 'undefined' && canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (ev) {
      var t = pieceNow();
      pointerDown = true;
      samples.push({ t: t, x: ev.clientX, y: ev.clientY });
      var m = moonGeom();
      var dx = ev.clientX - m.cx, dy = ev.clientY - m.cy;
      moonHold = (dx * dx + dy * dy <= (m.r * 1.35) * (m.r * 1.35)) ? { t: t, x: ev.clientX, y: ev.clientY, fired: false } : null;
    });
    canvas.addEventListener('pointermove', function (ev) {
      if (!pointerDown) return;
      var t = pieceNow();
      var lastS = samples[samples.length - 1];
      if (!lastS || t - lastS.t > 0.03) {
        samples.push({ t: t, x: ev.clientX, y: ev.clientY });
        if (samples.length > 90) samples.shift();
      }
      if (moonHold) {
        var dx = ev.clientX - moonHold.x, dy = ev.clientY - moonHold.y;
        if (dx * dx + dy * dy > 144) moonHold = null; // moved off: no summoning
      }
    });
    function endPointer() { pointerDown = false; moonHold = null; }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('pointerleave', endPointer);
  }
  // the summon fires the moment a moon-hold completes 2 s (browser loop only)
  function checkSummon() {
    if (moonHold && !moonHold.fired && pointerDown) {
      var t = pieceNow();
      if (t - moonHold.t >= 2) {
        summons.push(moonHold.t + 2);
        moonHold.fired = true;
      }
    }
  }

  // ---------- drawing ----------
  function drawBuilding(b, ox, alpha) {
    var x = b.x * W + ox, w = b.w * W, base = b.base * H;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = b.fill;
    if (b.type === 'store') {
      var top = b.bodyTop * H;
      ctx.fillRect(x - 0.004 * W, top - 0.007 * H, w + 0.008 * W, 0.009 * H); // parapet
      ctx.fillRect(x, top, w, base - top);
      ctx.beginPath(); // awning lip
      ctx.moveTo(x - 0.006 * W, top + 0.032 * H); ctx.lineTo(x + w + 0.006 * W, top + 0.032 * H);
      ctx.lineTo(x + w + 0.002 * W, top + 0.042 * H); ctx.lineTo(x - 0.002 * W, top + 0.042 * H);
      ctx.closePath(); ctx.fill();
    } else if (b.type === 'house') {
      var ht = b.bodyTop * H;
      ctx.fillRect(x, ht, w, base - ht);
      ctx.beginPath();
      ctx.moveTo(x - 0.008 * W, ht); ctx.lineTo(x + w + 0.008 * W, ht); ctx.lineTo(x + w / 2, b.top * H);
      ctx.closePath(); ctx.fill();
    } else if (b.type === 'saloon') {
      var st = b.bodyTop * H;
      ctx.fillRect(x, st, w, base - st);
      ctx.fillRect(x - 0.003 * W, b.top * H, w + 0.006 * W, st - b.top * H); // sign board
      ctx.fillRect(x - 0.006 * W, st + 0.045 * H, w + 0.012 * W, 0.006 * H); // porch line
    } else if (b.type === 'church') {
      var ct = b.bodyTop * H;
      ctx.fillRect(x, ct, w, base - ct);
      ctx.beginPath();
      ctx.moveTo(x - 0.006 * W, ct); ctx.lineTo(x + w + 0.006 * W, ct); ctx.lineTo(x + w / 2, b.roofTop * H);
      ctx.closePath(); ctx.fill();
      var sx = b.steepleX * W + ox, sw = b.steepleW * W;
      ctx.fillRect(sx, b.roofTop * H - 0.045 * H, sw, 0.05 * H); // steeple tower
      ctx.beginPath();
      ctx.moveTo(sx - 0.003 * W, b.roofTop * H - 0.045 * H);
      ctx.lineTo(sx + sw + 0.003 * W, b.roofTop * H - 0.045 * H);
      ctx.lineTo(sx + sw / 2, b.top * H);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(sx + sw / 2 - 0.0012 * W, b.top * H - 0.012 * H, 0.0024 * W, 0.012 * H); // cross
      ctx.fillRect(sx + sw / 2 - 0.004 * W, b.top * H - 0.009 * H, 0.008 * W, 0.0022 * W);
    } else { // tower
      var tb = b.tankBot * H, tt = b.tankTop * H;
      ctx.fillRect(x + 0.004 * W, tb, 0.005 * W, base - tb);           // legs
      ctx.fillRect(x + w - 0.009 * W, tb, 0.005 * W, base - tb);
      ctx.strokeStyle = b.fill; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 0.006 * W, tb); ctx.lineTo(x + w - 0.006 * W, base);
      ctx.moveTo(x + w - 0.006 * W, tb); ctx.lineTo(x + 0.006 * W, base);
      ctx.stroke();
      ctx.fillRect(x - 0.004 * W, tt, w + 0.008 * W, tb - tt);          // tank
      ctx.beginPath();
      ctx.moveTo(x - 0.006 * W, tt); ctx.lineTo(x + w + 0.006 * W, tt); ctx.lineTo(x + w / 2, b.top * H);
      ctx.closePath(); ctx.fill();
    }
    // windows
    for (var i = 0; i < b.windows.length; i++) {
      var win = b.windows[i];
      var wx = win.x * W + ox, wy = win.y * H, ww = Math.max(3, win.w * W), wh = Math.max(4, win.h * H);
      if (win.lit) {
        ctx.globalAlpha = alpha * 0.16; ctx.fillStyle = COL.gold;
        ctx.fillRect(wx - 2, wy - 2, ww + 4, wh + 4);
        ctx.globalAlpha = alpha * 0.85;
        ctx.fillRect(wx, wy, ww, wh);
      } else {
        ctx.globalAlpha = alpha * 0.55; ctx.fillStyle = COL.sky;
        ctx.fillRect(wx, wy, ww, wh);
      }
    }
    ctx.restore();
  }

  function drawTown(layout, era, t, ox, alpha, wind) {
    var i;
    // glints
    ctx.save();
    ctx.fillStyle = COL.gold;
    for (i = 0; i < layout.glints.length; i++) {
      var g = layout.glints[i];
      ctx.globalAlpha = alpha * g.a;
      ctx.fillRect(g.x * W + ox, g.y * H, g.s, g.s);
    }
    ctx.restore();
    // buildings
    for (i = 0; i < layout.buildings.length; i++) drawBuilding(layout.buildings[i], ox, alpha);
    // fences
    ctx.save();
    ctx.strokeStyle = COL.fence;
    ctx.globalAlpha = alpha * 0.6;
    ctx.lineWidth = 2;
    for (i = 0; i < layout.fences.length; i++) {
      var f = layout.fences[i];
      var fx0 = f.x0 * W + ox, fx1 = f.x1 * W + ox, fy = f.y * H, postH = 0.028 * H;
      ctx.beginPath();
      ctx.moveTo(fx0, fy - postH * 0.55); ctx.lineTo(fx1, fy - postH * 0.55);
      ctx.moveTo(fx0, fy - postH * 0.2); ctx.lineTo(fx1, fy - postH * 0.2);
      ctx.stroke();
      ctx.beginPath();
      for (var px = fx0; px <= fx1; px += 0.022 * W) {
        ctx.moveTo(px, fy); ctx.lineTo(px, fy - postH);
      }
      ctx.stroke();
    }
    ctx.restore();
    // wisps rising from the windows of this era's town
    var local = t - era.start;
    if (local >= 0 && layout.windows.length) {
      var minWH = Math.min(W, H);
      for (i = 0; i < N_WISPS; i++) {
        var life = wispLife(era.index, i);
        var age = (local + i * 7) % life;
        var prog = age / life;
        var spawn = layout.windows[i % layout.windows.length];
        var ph = h2(era.index * 17 + 3, i * 7 + 5) * Math.PI * 2;
        var rise = (0.16 + 0.20 * h2(era.index * 17 + 4, i * 3 + 2)) * H * prog;
        var sx = spawn.x * W + ox + Math.sin(age * 0.8 + ph) * 0.006 * W * (0.4 + prog) + wind.x * 0.16 * prog;
        var sy = spawn.y * H - rise;
        var fadeIn = Math.min(1, prog / 0.1);
        var fadeOut = prog > 0.7 ? (1 - prog) / 0.3 : 1;
        var a = 0.5 * fadeIn * fadeOut * alpha;
        if (a <= 0.01) continue;
        var size = minWH * (0.004 + 0.003 * h2(era.index * 17 + 5, i * 11 + 6));
        ctx.save();
        ctx.fillStyle = COL.wisp;
        ctx.globalAlpha = a * 0.35;
        ctx.beginPath(); ctx.moveTo(sx + size * 2.6, sy); ctx.arc(sx, sy, size * 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.moveTo(sx + size, sy); ctx.arc(sx, sy, size, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawStatic(coverage, eraIdx, t) {
    var rh = 9, tw = 24;
    var step = Math.floor(t * 14);
    ctx.save();
    for (var row = 0; row * rh < H; row++) {
      var shift = (h2(eraIdx * 91 + 3, row * 7 + step % 5) - 0.5) * 26 * coverage;
      for (var col = -1; col * tw < W + tw; col++) {
        var hv = h2(eraIdx * 131 + row * 17 + step * 7, col * 29 + step * 101);
        if (hv >= coverage) continue;
        var shade = COL.statik[Math.floor(h2(eraIdx * 57 + row * 3, col * 13 + step) * 4)];
        ctx.globalAlpha = 0.55 + 0.4 * h2(eraIdx * 71 + row, col * 7 + step * 3);
        ctx.fillStyle = shade;
        ctx.fillRect(col * tw + shift, row * rh, tw - 1, rh - 1);
      }
    }
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var eras = eraTimeline(t);
    var era = eraAt(eras, t);
    var wind = windAt(t);
    var ox = 0.02 * W * Math.sin(2 * Math.PI * t / 47); // the town breathes

    // sky + ground
    ctx.fillStyle = COL.sky;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = COL.ground;
    ctx.fillRect(0, HORIZON * H, W, H - HORIZON * H);

    // moon, fixed upper-right
    var m = moonGeom();
    ctx.save();
    ctx.fillStyle = COL.moon;
    ctx.beginPath(); ctx.moveTo(m.cx + m.r, m.cy); ctx.arc(m.cx, m.cy, m.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8F8A7C';
    ctx.globalAlpha = 0.18;
    ctx.beginPath(); ctx.moveTo(m.cx - m.r * 0.25 + m.r * 0.28, m.cy - m.r * 0.3); ctx.arc(m.cx - m.r * 0.25, m.cy - m.r * 0.3, m.r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.13;
    ctx.beginPath(); ctx.moveTo(m.cx + m.r * 0.3 + m.r * 0.18, m.cy + m.r * 0.38); ctx.arc(m.cx + m.r * 0.3, m.cy + m.r * 0.38, m.r * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // hold progress ring (only while a visitor holds the moon)
    if (moonHold && !moonHold.fired && pointerDown) {
      var prog = clamp((t - moonHold.t) / 2, 0, 1);
      ctx.save();
      ctx.strokeStyle = COL.moon;
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(m.cx, m.cy, m.r + 6, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // town(s)
    var dissolving = t >= era.townUntil && t < era.end;
    if (dissolving) {
      var u = (t - era.townUntil) / DISSOLVE; // 0..1
      var up = Math.min(u / 0.45, 1);
      var down = u > 0.55 ? 1 - (u - 0.55) / 0.45 : 1;
      var coverage = Math.min(up, down);
      var nextEra = eras[eras.indexOf(era) + 1] || { index: era.index + 1, start: era.end, townUntil: era.end + ERA_LEN, end: era.end + ERA_LEN + DISSOLVE };
      drawTown(townLayout(nextEra.index), nextEra, t, ox, clamp((u - 0.5) / 0.5, 0, 1) * 0.95, wind);
      drawTown(townLayout(era.index), era, t, ox, 1 - up * 0.95, wind);
      drawStatic(coverage, era.index, t);
    } else {
      drawTown(townLayout(era.index), era, t, ox, 1, wind);
    }

    // dust motes near the ground, bent by the same wind
    ctx.save();
    ctx.fillStyle = COL.gold;
    for (var i = 0; i < 40; i++) {
      var bx = h2(5, i * 3 + 1) * W + t * (2 + h2(5, i * 3 + 2) * 5) + wind.x * 0.08;
      var dxp = ((bx % (W + 30)) + W + 30) % (W + 30) - 15;
      var dyp = H * (0.66 + 0.30 * h2(5, i * 3 + 3)) + Math.sin(t * 0.6 + i * 1.7) * 2;
      ctx.globalAlpha = 0.08 + 0.09 * h2(5, i * 3 + 4);
      ctx.fillRect(dxp, dyp, 1.4, 1.4);
    }
    ctx.restore();

    // spirit counter
    ctx.save();
    ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = COL.wisp;
    ctx.fillText('spirits ' + spiritCount(eras, t), 14, H - 14);
    ctx.restore();
  }

  // ---------- run ----------
  draw(T0); // synchronous fixed-phase first frame
  if (typeof requestAnimationFrame === 'function') {
    var loopFn = function () {
      checkSummon();
      draw(pieceNow());
      requestAnimationFrame(loopFn);
    };
    requestAnimationFrame(loopFn);
  }
})();
</script>
</body>
