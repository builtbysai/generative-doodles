<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toy City</title>
<style>
  html, body { margin: 0; padding: 0; background: #BFE6F5; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Toy City (EXPANSION #88 okazzsp, block 8)
// A skyline of toy buildings on pale sky blue. Every tower is a stack of
// flat shapes (rectangles, squares, circles, diamonds, arches) finished
// with a triangle, semicircle, or diamond roof; wide rectangles carry
// window-dot grids, some blocks carry checkerboard bands. The city
// builds one shape at a time, left to right, each shape dropping in from
// just above its slot; it holds while the window dots twinkle; then it
// sinks below the baseline and rebuilds from a new seed. No outlines,
// no perspective, no shadows, no text.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  sky: '#BFE6F5',
  blocks: ['#EF476F', '#FFC300', '#118AB2', '#06D6A0', '#F78FB3', '#22223B', '#FFFFFF']
};
// Contrast partner for decorations, palette tones only.
function contrastOf(color) {
  if (color === '#FFC300' || color === '#F78FB3' || color === '#FFFFFF') return '#22223B';
  return '#FFFFFF';
}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, isPhone = false;

var T = 60;          // seconds per loop
var BUILD_END = 36;  // shapes drop in over 0..36
var HOLD_END = 51;   // twinkle hold 36..51 (15 s)
var SINK_END = 56;   // city sinks 51..56; empty sky 56..60

// ---------------------------------------------------------------------------
// Epoch state. Frame one is cycle 0 at loop t=0, drawn synchronously.
// A tap starts a new epoch; each 60 s cycle advances the seed, so the
// rebuilt city after a sink is a fresh city with no stored state.
// ---------------------------------------------------------------------------
var baseSeed = 72788;
var epochIndex = 0;
var epochStart = 0;
var forcedT = -1;
(function () {
  try {
    var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(location.search || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (e) { /* inert hook, QA only */ }
})();

// ---------------------------------------------------------------------------
// City generation. Everything is derived from (seed, W, H, isPhone) by a
// mulberry32 stream, so a seed fully determines the city at a given size.
// Shape heights are kept in tower-width units (hU); slots stack flush
// from the baseline. Build order is towers left to right, shapes bottom
// to top, flattened into one list with cumulative slot offsets.
// ---------------------------------------------------------------------------
var cityCache = { key: '', towers: null, flat: null, maxTowerPx: 0 };

function pickColor(rng, avoid) {
  var c;
  do { c = COL.blocks[Math.floor(rng() * COL.blocks.length)]; } while (c === avoid);
  return c;
}

function genCity(seed) {
  var rng = mulberry32(seed);
  var n = isPhone ? 10 : 12;
  // Tower widths: base fraction of W jittered +-10%, renormalized to
  // fill the frame exactly; base fractions sit inside 6-11% of W.
  var fr = [], sum = 0, i, j;
  for (i = 0; i < n; i++) { fr.push((1 / n) * (0.9 + rng() * 0.2)); sum += fr[i]; }
  for (i = 0; i < n; i++) fr[i] /= sum;

  var towers = [], seen = {};
  var xFrac = 0;
  for (i = 0; i < n; i++) {
    var wPx = fr[i] * W;
    var targetU = (0.35 + rng() * 0.6) * H / wPx; // tower height 35-95% of H
    var shapes = [], cumU = 0, prevColor = '';
    var guard = 0;
    while (cumU < targetU && guard++ < 40) {
      var r = rng();
      var type, hU;
      if (r < 0.45) { type = 'rect'; hU = 0.4 + rng() * 0.5; }
      else if (r < 0.65) { type = 'square'; hU = 1.0; }
      else if (r < 0.77) { type = 'circle'; hU = 1.0; }
      else if (r < 0.87) { type = 'diamond'; hU = 0.8; }
      else { type = 'arch'; hU = 1.05 + rng() * 0.25; }
      if (shapes.length >= 3 && cumU + hU > targetU) break;
      var color = pickColor(rng, prevColor);
      var deco = 'plain';
      if (type === 'rect' && hU < 0.8) {          // wide rectangles only
        var d = rng();
        deco = d < 0.42 ? 'windows' : (d < 0.68 ? 'checker' : 'plain');
      } else if (type === 'rect' || type === 'square') {
        deco = rng() < 0.22 ? 'checker' : 'plain';
      }
      var sh = { type: type, hU: hU, color: color, deco: deco, cumU: cumU,
                 dots: null, checkCols: 4, checkRows: 2 };
      if (deco === 'windows') {
        var cols = 3 + Math.floor(rng() * 3);      // 3-5
        var rows = 1 + Math.floor(rng() * 3);      // 1-3
        var dots = [];
        for (j = 0; j < cols * rows; j++) {
          dots.push({ phase: rng(), period: 1.6 + rng() * 3.2 });
        }
        sh.dots = { cols: cols, rows: rows, list: dots };
      }
      if (deco === 'checker') {
        sh.checkCols = 4;
        sh.checkRows = Math.max(1, Math.round(hU * 4));
      }
      shapes.push(sh);
      cumU += hU;
      prevColor = color;
    }
    var rr = rng();
    var roofType = rr < 0.4 ? 'tri' : (rr < 0.75 ? 'semi' : 'diamond');
    var roofHU = roofType === 'tri' ? 0.55 : (roofType === 'semi' ? 0.5 : 0.75);
    shapes.push({ type: roofType, hU: roofHU, color: pickColor(rng, prevColor),
                  deco: 'plain', cumU: cumU, dots: null, checkCols: 4, checkRows: 2 });
    // Guarantee: no two towers repeat. A signature collision reseeds the
    // stack by nudging the stream; in practice collisions never occur.
    var sig = shapes.map(function (s) { return s.type + s.color + s.deco; }).join('|');
    if (seen[sig]) {
      shapes[0].color = pickColor(rng, shapes[1] ? shapes[1].color : '');
      sig = shapes.map(function (s) { return s.type + s.color + s.deco; }).join('|');
    }
    seen[sig] = true;
    towers.push({ xFrac: xFrac, wFrac: fr[i], shapes: shapes });
    xFrac += fr[i];
  }

  var flat = [], maxTowerPx = 0;
  for (i = 0; i < towers.length; i++) {
    var tw = towers[i], twPx = tw.wFrac * W, topPx = 0;
    for (j = 0; j < tw.shapes.length; j++) {
      flat.push({ tower: tw, shape: tw.shapes[j] });
      topPx = Math.max(topPx, (tw.shapes[j].cumU + tw.shapes[j].hU) * twPx);
    }
    maxTowerPx = Math.max(maxTowerPx, topPx);
  }
  return { towers: towers, flat: flat, maxTowerPx: maxTowerPx };
}

function getCity(seed) {
  var key = seed + '|' + W + 'x' + H + '|' + (isPhone ? 'p' : 'd');
  if (cityCache.key !== key) {
    var c = genCity(seed);
    cityCache = { key: key, towers: c.towers, flat: c.flat, maxTowerPx: c.maxTowerPx };
  }
  return cityCache;
}

// ---------------------------------------------------------------------------
// Shape drawing. (x, y) is the slot's top-left, w/h its size in px.
// ---------------------------------------------------------------------------
function drawShapeBody(type, x, y, w, h, color) {
  ctx.fillStyle = color;
  if (type === 'rect' || type === 'square') {
    ctx.fillRect(x, y, w, h);
  } else if (type === 'circle') {
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) / 2, 0, Math.PI * 2);
    ctx.fill();
  } else if (type === 'diamond') {
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y);
    ctx.lineTo(x + w, y + h / 2);
    ctx.lineTo(x + w / 2, y + h);
    ctx.lineTo(x, y + h / 2);
    ctx.closePath();
    ctx.fill();
  } else if (type === 'arch') {
    var r = w / 2;
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, 0);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();
  } else if (type === 'tri') {
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();
  } else if (type === 'semi') {
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h, w / 2, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
  }
}

function drawDeco(sh, x, y, w, h, t, twinkle) {
  if (sh.deco === 'checker') {
    ctx.fillStyle = contrastOf(sh.color);
    var cw = w / sh.checkCols, ch = h / sh.checkRows;
    for (var ry = 0; ry < sh.checkRows; ry++) {
      for (var rx = 0; rx < sh.checkCols; rx++) {
        if ((rx + ry) % 2 === 0) ctx.fillRect(x + rx * cw, y + ry * ch, cw, ch);
      }
    }
  } else if (sh.deco === 'windows' && sh.dots) {
    ctx.fillStyle = contrastOf(sh.color);
    var cols = sh.dots.cols, rows = sh.dots.rows;
    var dotR = Math.max(1, Math.min(w, h) * 0.055);
    for (var k = 0; k < sh.dots.list.length; k++) {
      var dc = k % cols, dr = Math.floor(k / cols);
      var on = true;
      if (twinkle) {
        var d = sh.dots.list[k];
        on = ((t / d.period + d.phase) % 1) < 0.62;
      }
      if (!on) continue;
      ctx.beginPath();
      ctx.arc(x + w * (dc + 0.5) / cols, y + h * (dr + 0.5) / rows, dotR, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }
function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

function draw(t, cycle) {
  if (W === 0 || H === 0) return;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  var seed = baseSeed + epochIndex * 7919 + cycle * 104729;
  var city = getCity(seed);
  var flat = city.flat;
  var N = flat.length;
  var slotDur = BUILD_END / N;
  var dropDur = Math.min(0.5, slotDur * 1.1);

  var sinkOff = 0;
  if (t >= HOLD_END) {
    var sp = Math.min(1, Math.max(0, (t - HOLD_END) / (SINK_END - HOLD_END)));
    sinkOff = easeInOut(sp) * (city.maxTowerPx + H * 0.1);
  }
  var twinkle = t >= BUILD_END && t < HOLD_END;

  ctx.fillStyle = COL.sky;
  ctx.fillRect(0, 0, W, H);

  for (var i = 0; i < N; i++) {
    var item = flat[i], tw = item.tower, sh = item.shape;
    var wPx = tw.wFrac * W;
    var hPx = sh.hU * wPx;
    var x = tw.xFrac * W;
    var raw = (t - i * slotDur) / dropDur;
    if (t < BUILD_END && raw < 0) continue; // slot not started yet
    var p = t >= BUILD_END ? 1 : Math.min(1, Math.max(0, raw));
    var dropOff = (1 - easeOutCubic(p)) * (hPx + H * 0.05);
    var yTop = H - (sh.cumU + sh.hU) * wPx + sinkOff - dropOff;
    if (yTop > H || yTop + hPx < 0) continue;
    drawShapeBody(sh.type, x, yTop, wPx, hPx, sh.color);
    drawDeco(sh, x, yTop, wPx, hPx, t, twinkle);
  }
}

// ---------------------------------------------------------------------------
// Sizing and main loop.
// ---------------------------------------------------------------------------
function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = Math.round(vw);
  H = Math.round(vh);
  canvas.width = W;
  canvas.height = H;
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  // Before the loop starts, every draw is frame one at exactly t=0.
  if (forcedT >= 0) draw(forcedT % T, Math.floor(forcedT / T));
  else draw(loopStarted ? currentT() : 0, loopStarted ? currentCycle() : 0);
}

var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
epochStart = startStamp;
function elapsed() {
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
  return (now - epochStart) / 1000;
}
function currentT() { return elapsed() % T; }
function currentCycle() { return Math.floor(elapsed() / T); }

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

// TAP reseeds immediately: a new epoch, a new city from t=0.
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function () {
    epochIndex += 1;
    epochStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : startStamp;
    draw(0, 0);
  });
}

// Frame one: synchronous draw at loop t=0 (deterministic; never clock-derived).
var loopStarted = false;
resize();

if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    loopStarted = true;
    if (forcedT < 0) draw(currentT(), currentCycle());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
