<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1911 The Letter Before the Anthem</title>
<style>
  html, body { margin: 0; padding: 0; background: #ddd2b8; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var PAPER = '#f1ead8';      // bone paper
  var PAPER_GROUND = '#ddd2b8'; // darker bone, page ground outside the sheet
  var PAPER_EDGE = '#b9ab8a';  // sheet edge on desktop
  var INK = '#2b2620';        // iron-gall ink
  var INK_FAINT = '#8a7f6d';  // ruled lines, faint ink
  var INK_DIM = '#6e6558';    // secondary ink
  var ANTHEM_BG = '#7c1712';  // deep red
  var ANTHEM_DARK = '#1a0d0b';// near-black red
  var NOTE = '#efe6d0';       // bone note heads
  var CHORD = '#e8dcc2';      // chord-stack dots
  var CAPTION = '#cfc9bd';    // pale grey caption line

  // The letter, original lines written for this piece. No real anthem
  // lyrics, no real names, no slogans. The final line is the caption that
  // returns between anthem repetitions.
  var LINES = [
    'He was nineteen when the hills took him in.',
    'He carried no flag, only a coat and a name.',
    'His letters home came folded small, in pencil.',
    'He wrote that the night was cold, the valley kind.',
    'Remember me the way the song remembers.'
  ];
  var CAPTION_LINE = LINES[LINES.length - 1];

  // Fixed-phase first frame: t = 12.0 s. The letter writes one line per
  // 4.8 s (3.4 s of writing, 1.4 s of pause), so at 12.0 s lines one and
  // two are complete and line three is about two thirds written, with the
  // pen still on the page. Frame one is byte-reproducible: every written
  // character is a pure function of t.
  var FIRST_T = 12.0;

  // Closed-form schedule, pure function of t. Letter 0 to 24 s, dissolve
  // 24 to 28 s, anthem cycles of 16 s from 28 s (12 s of music, 4 s of
  // caption). No wall clock, no unseeded randomness.
  var LINE_WRITE = 3.4;
  var LINE_STEP = 4.8;
  var DISSOLVE_START = 24;
  var DISSOLVE_END = 28;
  var ANTHEM_START = 28;
  var MUSIC_LEN = 12;
  var ANTHEM_CYCLE = 16;

  // Fixed folk-like melody: twelve scale degrees, one per second of the
  // music window. The same melody every repetition; only the harmony moves.
  var MELODY = [0, 2, 4, 5, 4, 2, 0, -2, 0, 2, 4, 7];

  // Harmonizer progression table: semitone voicings above the bass for
  // each repetition. Each repetition reaches further from the original:
  // a close major triad, then a minor triad with an octave, then an
  // added ninth, then a wide stack reaching two octaves.
  var VOICINGS = [
    [0, 4, 7],
    [0, 3, 7, 12],
    [0, 4, 7, 11, 14],
    [0, 3, 6, 10, 15, 19],
    [0, 4, 8, 11, 15, 19, 24]
  ];

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      stageH = vh * 0.94;
      stageW = Math.min(vw * 0.72, stageH * 0.92);
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Letter progress for line i at time t: 0 to 1.
  function lineProgress(i, t) {
    return clamp((t - i * LINE_STEP) / LINE_WRITE, 0, 1);
  }
  // Letter alpha: 1 through the writing, fading out over the dissolve.
  function letterAlpha(t) {
    if (t < DISSOLVE_START) { return 1; }
    if (t >= DISSOLVE_END) { return 0; }
    return 1 - (t - DISSOLVE_START) / (DISSOLVE_END - DISSOLVE_START);
  }
  // Anthem alpha: 0 through the writing, fading in over the dissolve.
  function anthemAlpha(t) {
    if (t < DISSOLVE_START) { return 0; }
    if (t >= DISSOLVE_END) { return 1; }
    return (t - DISSOLVE_START) / (DISSOLVE_END - DISSOLVE_START);
  }

  // Fit the letter font so the longest line clears the margins.
  function letterFontSize() {
    var margin = W * 0.10;
    var fs = Math.round(clamp(W * 0.042, 15, 30));
    ctx.font = 'italic 500 ' + fs + 'px Georgia, "Times New Roman", serif';
    var widest = 0;
    for (var i = 0; i < LINES.length; i++) {
      widest = Math.max(widest, ctx.measureText(LINES[i]).width);
    }
    while (widest > W - margin * 2 && fs > 11) {
      fs -= 1;
      ctx.font = 'italic 500 ' + fs + 'px Georgia, "Times New Roman", serif';
      widest = 0;
      for (var j = 0; j < LINES.length; j++) {
        widest = Math.max(widest, ctx.measureText(LINES[j]).width);
      }
    }
    return fs;
  }

  function drawLetter(t, la) {
    var margin = W * 0.10;
    var fs = letterFontSize();
    var lineH = fs * 2.15;
    var top = H * 0.30;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    // Faint ruled lines under each line of the letter.
    ctx.strokeStyle = hexA(INK_FAINT, 0.45 * la);
    ctx.lineWidth = 1;
    for (var r = 0; r < LINES.length; r++) {
      var ry = top + r * lineH + fs * 0.42;
      ctx.beginPath(); ctx.moveTo(margin, ry); ctx.lineTo(W - margin, ry); ctx.stroke();
    }

    // The letter writes itself, character by character, line by line.
    // A small ink pen dot sits at the end of the line still being written.
    ctx.font = 'italic 500 ' + fs + 'px Georgia, "Times New Roman", serif';
    var pen = null;
    for (var i = 0; i < LINES.length; i++) {
      var p = lineProgress(i, t);
      if (p <= 0) { continue; }
      var n = Math.floor(p * LINES[i].length);
      if (p >= 1) { n = LINES[i].length; }
      var y = top + i * lineH + (hash(i + 3) - 0.5) * 3;
      var shown = LINES[i].substring(0, n);
      ctx.fillStyle = hexA(INK, la);
      ctx.fillText(shown, margin, y);
      if (p > 0 && p < 1) {
        var px = margin + ctx.measureText(shown).width;
        pen = { x: px + 4, y: y - fs * 0.28 };
      }
    }
    if (pen) {
      ctx.fillStyle = hexA(INK, la);
      ctx.beginPath(); ctx.moveTo(pen.x + 3.2, pen.y); ctx.arc(pen.x, pen.y, 3.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawAnthem(t, aa) {
    var rep = Math.floor((t - ANTHEM_START) / ANTHEM_CYCLE);
    var phase = (t - ANTHEM_START) - rep * ANTHEM_CYCLE;
    var voicing = VOICINGS[Math.min(rep, VOICINGS.length - 1)];
    var inCaption = phase >= MUSIC_LEN;
    var capA = inCaption ? clamp((phase - MUSIC_LEN) / 0.8, 0, 1) : 0;
    var staffA = aa * (inCaption ? lerp(1, 0.30, capA) : 1);
    var scale = clamp(Math.min(W, H) / 520, 0.62, 1.35);

    // Staff: five lines, the ensemble's ground. During the dissolve the
    // staff fades in from the letter's margins.
    var sp = H * 0.045;
    var staffMid = H * 0.42;
    var staffTop = staffMid - 2 * sp;
    var staffBottom = staffMid + 2 * sp;
    var x0 = W * 0.10, x1 = W * 0.90;
    ctx.strokeStyle = hexA(ANTHEM_DARK, 0.85 * staffA);
    ctx.lineWidth = 1.4 * scale;
    for (var s = 0; s < 5; s++) {
      var sy = staffTop + s * sp;
      ctx.beginPath(); ctx.moveTo(x0, sy); ctx.lineTo(x1, sy); ctx.stroke();
    }

    // Melody notes, one per second, drawn as they are reached. The note
    // being played now is larger and brighter; played notes stay on the
    // staff in bone, so the melody accumulates across the window.
    var nowX = x0;
    if (!inCaption) {
      nowX = lerp(x0, x1, clamp(phase / MUSIC_LEN, 0, 1));
      ctx.strokeStyle = hexA(NOTE, 0.55 * staffA);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(nowX, staffTop - sp * 0.4); ctx.lineTo(nowX, staffBottom + sp * 0.4); ctx.stroke();
    }
    for (var j = 0; j < MELODY.length; j++) {
      if (phase < j) { continue; }
      var nx = lerp(x0, x1, j / MELODY.length + 0.5 / MELODY.length);
      var ny = staffMid - MELODY[j] * sp * 0.5;
      var isNow = !inCaption && Math.floor(phase) === j;
      var r = (isNow ? 8.5 : 6) * scale;
      ctx.fillStyle = hexA(NOTE, (isNow ? 1 : 0.88) * staffA);
      ctx.beginPath(); ctx.moveTo(nx + r, ny); ctx.arc(nx, ny, r, 0, Math.PI * 2); ctx.fill();
      // Stem up from the note head.
      ctx.strokeStyle = hexA(NOTE, 0.8 * staffA);
      ctx.lineWidth = 1.4 * scale;
      ctx.beginPath(); ctx.moveTo(nx + r * 0.8, ny); ctx.lineTo(nx + r * 0.8, ny - sp * 1.1); ctx.stroke();
      // Chord stack under the note: this repetition's voicing, as a
      // column of dots below the staff, widening with each repetition.
      for (var v = 0; v < voicing.length; v++) {
        var cy = staffBottom + 16 * scale + voicing[v] * 5.5 * scale;
        ctx.fillStyle = hexA(CHORD, 0.75 * staffA);
        ctx.beginPath(); ctx.moveTo(nx + 3 * scale, cy); ctx.arc(nx, cy, 3 * scale, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Repetition count, small, under the staff: which return of the anthem
    // this is, so the drift away from the original is countable.
    var repLabel = 'Return ' + (rep + 1);
    var rfs = Math.round(clamp(W * 0.032, 12, 18));
    ctx.font = rfs + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(CAPTION, 0.7 * staffA);
    ctx.fillText(repLabel, x0, staffBottom + 16 * scale + voicing[voicing.length - 1] * 5.5 * scale + 34 * scale);

    // Caption: the letter's final line, quiet, between repetitions.
    if (inCaption) {
      var cfs = Math.round(clamp(W * 0.04, 15, 28));
      ctx.font = 'italic 500 ' + cfs + 'px Georgia, "Times New Roman", serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = hexA(CAPTION, capA * aa);
      ctx.fillText(CAPTION_LINE, W / 2, H * 0.62);
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var la = letterAlpha(t);
    var aa = anthemAlpha(t);

    // Anthem ground first: deep red, crossfading in as the letter dissolves.
    if (aa > 0) {
      ctx.fillStyle = hexA(ANTHEM_BG, aa);
      ctx.fillRect(0, 0, W, H);
    }

    // Bone paper sheet, full-bleed on phones, a centered sheet on desktop.
    if (la > 0) {
      ctx.fillStyle = hexA(PAPER, la);
      ctx.fillRect(0, 0, W, H);
      if (!isPhone) {
        ctx.strokeStyle = hexA(PAPER_EDGE, la);
        ctx.lineWidth = 1;
        ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
      }
      drawLetter(t, la);
    }

    if (aa > 0) {
      drawAnthem(t, aa);
    }

    // Title plate, top-left: ink on the letter, pale grey on the anthem.
    // The hint sits centered at the bottom in the same two inks.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(INK, la);
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Letter Before the Anthem', 18, 34);
    ctx.fillStyle = hexA(INK_DIM, la);
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1911 · 2007 · 04 · 06', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(CAPTION, aa);
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Letter Before the Anthem', 18, 34);
    ctx.fillStyle = hexA(CAPTION, 0.85 * aa);
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1911 · 2007 · 04 · 06', 18, 34 + fs2 + 8);
    ctx.textAlign = 'center';
    ctx.fillStyle = hexA(INK_DIM, 0.9 * la);
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the letter write itself.', W / 2, H - 20);
    ctx.fillStyle = hexA(CAPTION, 0.85 * aa);
    ctx.fillText('Watch the letter write itself.', W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs near 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
