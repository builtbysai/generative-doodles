<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roofwalker</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #5B8CB0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32). All randomness happens once, at load.
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(47402);

  var TAU = Math.PI * 2;
  var LOOP = 45;          // seconds, seamless
  var FIRST_T = 15;       // constant pre-roll phase for frame one

  // Palette (prompt GN2; skin tone from the study palette)
  var SKY_TOP = '#5B8CB0', SKY_BOT = '#7FA8B8';
  var CLOUD = '242,237,224';              // #F2EDE0
  var ROOF = '#C62F33', WALL = '#EFE3C8';
  var DRESS = '#D9A03F', COLLAR = '#FFFFFF', HAIR = '#3B2A24';
  var SKIN = '#EBC9A8';

  function shade(hex, f) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.round(((n >> 16) & 255) * f);
    var g = Math.round(((n >> 8) & 255) * f);
    var b = Math.round((n & 255) * f);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // Clouds: seeded groups of flattened soft blobs, drifting on slow
  // seeded paths and slowly reforming. Every period divides the 45s
  // loop so the loop is seamless. Blob alpha is kept low per blob;
  // overlap builds the volume, up to about 0.7 in the densest cores.
  var DRIFT_PERIODS = [45, 22.5, 45, 15, 22.5];
  var MORPH_PERIODS = [15, 22.5, 11.25, 15, 9];
  var clouds = [];
  for (var ci = 0; ci < 5; ci++) {
    var c = {
      fx: 0.10 + rng() * 0.78,
      fy: 0.06 + rng() * 0.36,
      s: 0.11 + rng() * 0.09,
      amp: 0.010 + rng() * 0.018,
      period: DRIFT_PERIODS[ci],
      phase: rng() * TAU,
      morph: MORPH_PERIODS[ci],
      mphase: rng() * TAU,
      blobs: []
    };
    var nb = 5 + Math.floor(rng() * 3);
    for (var bi = 0; bi < nb; bi++) {
      c.blobs.push({
        bx: (rng() * 2 - 1) * 0.95,
        by: (rng() * 2 - 1) * 0.34,
        br: 0.42 + rng() * 0.48,
        a: 0.10 + rng() * 0.15
      });
    }
    clouds.push(c);
  }

  // Grain: precomputed seeded dots, redrawn identically every frame.
  var grain = [];
  for (var gi = 0; gi < 1200; gi++) {
    grain.push({
      x: rng(), y: rng(),
      r: 0.5 + rng() * 1.1,
      a: 0.025 + rng() * 0.045,
      dark: rng() < 0.5
    });
  }

  var W = 0, H = 0, DPR = 1, PHONE = false, lastT = FIRST_T;

  function resize() {
    var vv = window.visualViewport;
    W = (vv && vv.width) || window.innerWidth || 0;
    H = (vv && vv.height) || window.innerHeight || 0;
    DPR = window.devicePixelRatio || 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = H > W * 1.15;
    }
    draw(lastT);
  }

  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }

  function draw(t) {
    lastT = t;
    if (!W || !H) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // Scene unit is the frame height on every device, so the
    // composition keeps its shape on phones.
    var S = H;
    var groundY = H * 0.72;

    // Sky: dusty blue deepening to the top
    var sky = ctx.createLinearGradient(0, 0, 0, groundY);
    sky.addColorStop(0, SKY_TOP);
    sky.addColorStop(1, SKY_BOT);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Clouds: flattened radial-gradient blobs, alpha-animated by the
    // morph breathing of each group.
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      var cx = (c.fx + c.amp * Math.sin(TAU * t / c.period + c.phase)) * W;
      var cy = c.fy * H;
      var m = 0.88 + 0.12 * Math.sin(TAU * t / c.morph + c.mphase);
      var base = c.s * S * m;
      for (var j = 0; j < c.blobs.length; j++) {
        var b = c.blobs[j];
        var bx = cx + b.bx * base * 1.7;
        var by = cy + b.by * base;
        var br = Math.max(1, b.br * base);
        ctx.save();
        ctx.translate(bx, by);
        ctx.scale(1, 0.52);
        var gr = ctx.createRadialGradient(0, 0, 0, 0, 0, br);
        gr.addColorStop(0, 'rgba(' + CLOUD + ',' + b.a.toFixed(3) + ')');
        gr.addColorStop(1, 'rgba(' + CLOUD + ',0)');
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(0, 0, br, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    }

    // Ground band: a deepened shade of the sky's top blue (the palette
    // names no ground colour, so it stays inside the palette family).
    ctx.fillStyle = shade(SKY_TOP, 0.80);
    ctx.fillRect(0, groundY, W, H - groundY);

    // House and woman. The disproportion is the drawing: the woman is
    // 40% of frame height and exactly four times the house's height.
    var wh = 0.40 * S;
    var houseH = wh / 4;
    var houseW = houseH * 1.9;
    var roofH = houseH * 0.50;
    var cx = W * 0.58;
    var baseY = H * 0.90;
    var ridgeY = baseY - houseH;
    var eaveHalf = houseW * 0.58;

    // Soft shadow grounding the little house
    ctx.fillStyle = 'rgba(28,48,68,0.18)';
    ctx.beginPath();
    ctx.ellipse(cx, baseY + houseH * 0.06, houseW * 0.80, houseH * 0.11, 0, 0, TAU);
    ctx.fill();

    // Walls
    ctx.fillStyle = WALL;
    ctx.fillRect(cx - houseW / 2, ridgeY + roofH, houseW, houseH - roofH);
    // Door and window, kept tiny
    ctx.fillStyle = HAIR;
    ctx.fillRect(cx - houseW * 0.30, baseY - (houseH - roofH) * 0.64, houseW * 0.15, (houseH - roofH) * 0.64);
    ctx.fillStyle = SKY_BOT;
    ctx.fillRect(cx + houseW * 0.16, ridgeY + roofH + (houseH - roofH) * 0.20, houseW * 0.15, (houseH - roofH) * 0.34);
    // Roof
    ctx.fillStyle = ROOF;
    ctx.beginPath();
    ctx.moveTo(cx, ridgeY);
    ctx.lineTo(cx + eaveHalf, ridgeY + roofH);
    ctx.lineTo(cx - eaveHalf, ridgeY + roofH);
    ctx.closePath();
    ctx.fill();

    // Woman, bare feet planted on the ridge, each foot following the
    // roof slope at its own x.
    function roofY(fx) { return ridgeY + (Math.abs(fx - cx) / eaveHalf) * roofH; }
    var fxL = cx - 0.075 * wh, fxR = cx + 0.075 * wh;
    var fyL = roofY(fxL), fyR = roofY(fxR);
    var feetY = (fyL + fyR) / 2;
    var headR = wh * 0.105;
    var headCy = feetY - wh + headR * 1.05;
    var shoulderY = feetY - wh * 0.78;
    var hemBaseY = feetY - wh * 0.17;

    // Breeze: 15s cycle (divides the 45s loop); at the constant first
    // frame t = 15s the hem sits exactly mid-lift.
    var breeze = Math.sin(TAU * t / 15);
    var lift = (0.5 + 0.5 * breeze) * 0.035 * wh;
    var hemSway = breeze * 0.012 * wh;
    // Hair sway: 22.5s, almost imperceptible.
    var sway = Math.sin(TAU * t / 22.5) * 0.004 * wh;

    // Legs (bare), from the hem down to each foot on the slope
    ctx.strokeStyle = SKIN;
    ctx.lineCap = 'round';
    ctx.lineWidth = wh * 0.052;
    ctx.beginPath();
    ctx.moveTo(cx - 0.068 * wh, hemBaseY);
    ctx.lineTo(fxL, fyL - 0.010 * wh);
    ctx.moveTo(cx + 0.068 * wh, hemBaseY);
    ctx.lineTo(fxR, fyR - 0.010 * wh);
    ctx.stroke();
    // Bare feet
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.ellipse(fxL + 0.012 * wh, fyL - 0.004 * wh, 0.050 * wh, 0.017 * wh, 0, 0, TAU);
    ctx.ellipse(fxR + 0.012 * wh, fyR - 0.004 * wh, 0.050 * wh, 0.017 * wh, 0, 0, TAU);
    ctx.fill();

    // Hair falling behind the shoulders (drawn before the dress so
    // the dress overlaps its lower edge)
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.ellipse(cx + sway, (headCy + shoulderY) / 2 + wh * 0.012, headR * 1.06, (shoulderY - headCy) * 0.68, 0, 0, TAU);
    ctx.fill();

    // Dress: A-line, the hem lifting on the trailing (left) side in
    // the breeze while the leading side barely moves.
    var hemL = { x: cx - 0.250 * wh + hemSway, y: hemBaseY - lift };
    var hemR = { x: cx + 0.250 * wh + hemSway * 0.5, y: hemBaseY - lift * 0.30 };
    ctx.fillStyle = DRESS;
    ctx.beginPath();
    ctx.moveTo(cx - 0.120 * wh, shoulderY);
    ctx.quadraticCurveTo(cx - 0.185 * wh, (shoulderY + hemBaseY) / 2, hemL.x, hemL.y);
    ctx.quadraticCurveTo(cx, hemBaseY + 0.024 * wh - lift * 0.6, hemR.x, hemR.y);
    ctx.quadraticCurveTo(cx + 0.185 * wh, (shoulderY + hemBaseY) / 2, cx + 0.120 * wh, shoulderY);
    ctx.quadraticCurveTo(cx, shoulderY - 0.030 * wh, cx - 0.120 * wh, shoulderY);
    ctx.fill();

    // Arms relaxed at her sides, angled outward clear of the dress,
    // with small hands
    ctx.strokeStyle = DRESS;
    ctx.lineWidth = wh * 0.058;
    ctx.beginPath();
    ctx.moveTo(cx - 0.125 * wh, shoulderY + 0.020 * wh);
    ctx.lineTo(cx - 0.272 * wh, feetY - 0.330 * wh);
    ctx.moveTo(cx + 0.125 * wh, shoulderY + 0.020 * wh);
    ctx.lineTo(cx + 0.272 * wh, feetY - 0.330 * wh);
    ctx.stroke();
    ctx.fillStyle = SKIN;
    circle(cx - 0.276 * wh, feetY - 0.315 * wh, wh * 0.030); ctx.fill();
    circle(cx + 0.276 * wh, feetY - 0.315 * wh, wh * 0.030); ctx.fill();

    // Neck and face
    ctx.fillStyle = SKIN;
    ctx.fillRect(cx - 0.032 * wh, headCy + headR * 0.6, 0.064 * wh, 0.085 * wh);
    circle(cx, headCy + headR * 0.10, headR * 0.94); ctx.fill();
    // Hair cap over the top of the head
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = headR * 0.55;
    ctx.beginPath();
    ctx.arc(cx + sway * 0.6, headCy + headR * 0.10, headR * 0.88, Math.PI * 1.02, Math.PI * 1.98);
    ctx.stroke();
    // Closed eyes: two short calm strokes. No nose, no mouth.
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = Math.max(1.1, wh * 0.008);
    ctx.beginPath();
    var ew = wh * 0.036, ey = headCy + headR * 0.22;
    ctx.moveTo(cx - headR * 0.40 - ew / 2, ey);
    ctx.quadraticCurveTo(cx - headR * 0.40, ey + ew * 0.38, cx - headR * 0.40 + ew / 2, ey);
    ctx.moveTo(cx + headR * 0.40 - ew / 2, ey);
    ctx.quadraticCurveTo(cx + headR * 0.40, ey + ew * 0.38, cx + headR * 0.40 + ew / 2, ey);
    ctx.stroke();

    // Peter-pan collar: two white rounded halves at the neck
    ctx.fillStyle = COLLAR;
    ctx.beginPath();
    ctx.ellipse(cx - 0.042 * wh, shoulderY + 0.016 * wh, 0.044 * wh, 0.019 * wh, 0.35, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 0.042 * wh, shoulderY + 0.016 * wh, 0.044 * wh, 0.019 * wh, -0.35, 0, TAU);
    ctx.fill();

    // Grain over everything, identical every frame
    var gs = S / 900;
    for (var k = 0; k < grain.length; k++) {
      var d = grain[k];
      ctx.fillStyle = d.dark
        ? 'rgba(38,56,74,' + d.a.toFixed(3) + ')'
        : 'rgba(255,252,240,' + d.a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(d.x * W, d.y * H, Math.max(0.4, d.r * gs), 0, TAU);
      ctx.fill();
    }
  }

  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    draw(FIRST_T + (now - startStamp) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();
  draw(FIRST_T);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
