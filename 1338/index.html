<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gesture</title>
<style>
html, body { margin: 0; padding: 0; background: #14100C; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

  var W = 0, H = 0, lastT = 0;
  var drags = [];
  var dragging = false, lastPX = 0, lastPY = 0;

  function isPhone() {
    var sw = 0, sh = 0;
    try {
      if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width; sh = window.screen.height; }
    } catch (e) {}
    if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
    return H > W * 1.15;
  }

  function size() {
    var w = 0, h = 0;
    try {
      if (typeof window !== 'undefined' && window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
    } catch (e) {}
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    try { canvas.style.touchAction = 'none'; } catch (e) {}
    try { if (document.body) document.body.style.background = '#14100C'; } catch (e) {}
  }
  size();

  // Seeded crowd: simplified figures, no faces, no bodies beyond coats and head dots.
  var rng = mulberry32(1338000);
  var coats = ['#5C4A3A', '#2E4A5A', '#7A2E2E', '#4A4238', '#3E3A44'];
  var figures = [];
  for (var i = 0; i < 120; i++) {
    var depth = rng();
    var fy = 0.30 + depth * 0.66;
    var fs = (0.028 + depth * 0.075) * Math.min(1280, Math.max(W, H));
    figures.push({
      x: rng(), y: fy, s: fs,
      coat: coats[Math.floor(rng() * coats.length)],
      lean: (rng() - 0.5) * 0.24, hat: rng() < 0.3
    });
  }
  // Mini crowd for the stamp, fixed seed.
  var rng2 = mulberry32(1338001);
  var minis = [];
  for (var j = 0; j < 26; j++) {
    minis.push({ x: rng2(), y: 0.35 + rng2() * 0.6, s: 0.10 + rng2() * 0.16, coat: coats[Math.floor(rng2() * coats.length)] });
  }

  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCrowd(alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    // Backdrop: building band above, asphalt below.
    ctx.fillStyle = '#2A2622';
    ctx.fillRect(0, 0, W, H * 0.34);
    ctx.fillStyle = '#211D1A';
    var bw = W / 7;
    for (var b = 0; b < 7; b++) {
      var bh = H * (0.10 + ((b * 37) % 10) / 10 * 0.16);
      ctx.fillRect(b * bw + bw * 0.06, H * 0.34 - bh, bw * 0.88, bh);
    }
    ctx.fillStyle = '#3A3A3C';
    ctx.fillRect(0, H * 0.34, W, H * 0.66);
    ctx.fillStyle = '#333336';
    ctx.fillRect(0, H * 0.62, W, H * 0.012);
    // Figures, far to near.
    var sorted = figures.slice().sort(function (a, b) { return a.s - b.s; });
    for (var i = 0; i < sorted.length; i++) {
      var f = sorted[i];
      var fx = f.x * W, fy = f.y * H, fs = f.s;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(f.lean);
      ctx.fillStyle = f.coat;
      ctx.beginPath();
      ctx.moveTo(-fs * 0.32, 0);
      ctx.lineTo(fs * 0.32, 0);
      ctx.lineTo(fs * 0.24, -fs * 1.7);
      ctx.lineTo(-fs * 0.24, -fs * 1.7);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      dot(fx, fy - fs * 1.95, fs * 0.30, '#8A6A52');
      if (f.hat) {
        ctx.fillStyle = '#241F1C';
        ctx.fillRect(fx - fs * 0.34, fy - fs * 2.28, fs * 0.68, fs * 0.14);
      }
    }
    ctx.restore();
  }

  function drawMiniCrowd(x, y, w, h) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.fillStyle = '#3A3A3C';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#2A2622';
    ctx.fillRect(x, y, w, h * 0.34);
    for (var i = 0; i < minis.length; i++) {
      var m = minis[i];
      var mx = x + m.x * w, my = y + m.y * h, ms = m.s * h;
      ctx.fillStyle = m.coat;
      ctx.fillRect(mx - ms * 0.3, my - ms * 1.7, ms * 0.6, ms * 1.7);
      dot(mx, my - ms * 1.95, ms * 0.3, '#8A6A52');
    }
    ctx.restore();
  }

  // Gesture: two intertwined forearms as parametric double-curves, bronze in
  // layered flat-alpha tones. Local coords, unit u, centered at (cx, cy).
  function armPath(cx, cy, u, flip) {
    ctx.beginPath();
    if (!flip) {
      ctx.moveTo(cx - 0.58 * u, cy + 0.46 * u);
      ctx.bezierCurveTo(cx - 0.22 * u, cy + 0.14 * u, cx + 0.22 * u, cy - 0.04 * u, cx + 0.58 * u, cy - 0.36 * u);
    } else {
      ctx.moveTo(cx + 0.52 * u, cy + 0.50 * u);
      ctx.bezierCurveTo(cx + 0.14 * u, cy + 0.20 * u, cx - 0.20 * u, cy - 0.10 * u, cx - 0.52 * u, cy - 0.42 * u);
    }
  }
  function strokeArm(cx, cy, u, flip, width, color, ox, oy) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    armPath(cx + ox, cy + oy, u, flip);
    ctx.stroke();
  }
  function drawGesture(cx, cy, u, glow, shimmer, detailA) {
    if (detailA === undefined) detailA = 1;
    // Arm A (lower-left to upper-right), then arm B crossing over it.
    var tones = [
      ['#6B4A2E', 0.30], ['#A67B4F', 0.21], ['#D9B380', 0.12]
    ];
    for (var k = 0; k < tones.length; k++) {
      strokeArm(cx, cy, u, false, tones[k][1] * u, tones[k][0], 0, 0);
      strokeArm(cx, cy, u, true, tones[k][1] * u, tones[k][0], 0, 0);
    }
    // Highlight pass, breathing with shimmer.
    var hi = 0.5 + 0.5 * shimmer;
    ctx.globalAlpha = 0.55 + 0.45 * hi;
    strokeArm(cx, cy, u, false, 0.045 * u, '#F0D9AE', -0.03 * u, -0.04 * u);
    strokeArm(cx, cy, u, true, 0.045 * u, '#F0D9AE', -0.03 * u, -0.04 * u);
    ctx.globalAlpha = 1;
    // Pearl bracelet on arm A near its lower end: small dots along the curve.
    // Wedding band on arm B: a small ring arc. Both fade out as the gesture
    // scales to monumental size, so they never read as stray giant shapes.
    ctx.save();
    ctx.globalAlpha = detailA;
    var bx = cx - 0.44 * u, by = cy + 0.33 * u;
    for (var p = 0; p < 5; p++) {
      dot(bx + p * 0.055 * u, by - p * 0.045 * u, 0.028 * u, '#EDE4D3');
    }
    ctx.strokeStyle = '#C9973B';
    ctx.lineWidth = 0.03 * u;
    ctx.beginPath();
    ctx.moveTo(cx + 0.30 * u, cy + 0.28 * u);
    ctx.arc(cx + 0.30 * u, cy + 0.28 * u, 0.055 * u, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    // Extra glow during the highlight sweep.
    if (glow > 0) {
      ctx.globalAlpha = glow * 0.35;
      strokeArm(cx, cy, u, false, 0.38 * u, '#F0D9AE', 0, 0);
      strokeArm(cx, cy, u, true, 0.38 * u, '#F0D9AE', 0, 0);
      ctx.globalAlpha = 1;
    }
  }

  function panAt(t) {
    var px = 0, py = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      var age = t - d.t;
      if (age < 0) continue;
      var decay = Math.exp(-age / 2.5);
      px += d.dx * decay; py += d.dy * decay;
    }
    return { x: px, y: py };
  }

  var T_SCENE = 4, T_HIGH = 7, T_ISO = 13, T_HOLD = 23, T_COL = 27, T_LOOP = 30;

  function draw(t) {
    lastT = t;
    var lt = t % T_LOOP;
    ctx.fillStyle = '#14100C';
    ctx.fillRect(0, 0, W, H);

    var unit = 0.34 * Math.min(W, H);
    var natX = W * 0.5, natY = H * 0.48;
    var fullU = Math.max(W * 1.4 / 1.24, H * 1.4 / 1.04);
    var pan = panAt(t);
    var maxPanX = Math.max(0, (fullU * 1.24 - W) / 2) * 0.6;
    var maxPanY = Math.max(0, (fullU * 1.04 - H) / 2) * 0.6;
    var panX = clamp(pan.x, -maxPanX, maxPanX);
    var panY = clamp(pan.y, -maxPanY, maxPanY);

    var crowdA = 1, gx = natX, gy = natY, gu = unit, glow = 0, shimmer = 0, stampA = 0;
    if (lt < T_SCENE) {
      // Scene: crowd fully composed, gesture resting inside it.
    } else if (lt < T_HIGH) {
      var hu = smooth((lt - T_SCENE) / (T_HIGH - T_SCENE));
      glow = hu;
    } else if (lt < T_ISO) {
      var iu = smooth((lt - T_HIGH) / (T_ISO - T_HIGH));
      crowdA = 1 - iu;
      gu = lerp(unit, fullU, iu);
      gx = lerp(natX, W * 0.5 + panX, iu);
      gy = lerp(natY, H * 0.5 + panY, iu);
      glow = 1 - iu * 0.5;
    } else if (lt < T_HOLD) {
      crowdA = 0;
      gu = fullU;
      gx = W * 0.5 + panX; gy = H * 0.5 + panY;
      shimmer = Math.sin((lt - T_ISO) * Math.PI * 2 / 6);
      stampA = smooth((lt - T_ISO) / 1);
    } else if (lt < T_COL) {
      var cu = smooth((lt - T_HOLD) / (T_COL - T_HOLD));
      crowdA = cu;
      gu = lerp(fullU, unit, cu);
      gx = lerp(W * 0.5 + panX, natX, cu);
      gy = lerp(H * 0.5 + panY, natY, cu);
      stampA = 1 - cu;
    } else {
      // Closing scene hold before the loop restarts.
    }

    if (crowdA > 0) drawCrowd(crowdA);
    var detailA = 1 - smooth((gu - unit) / (fullU - unit));
    drawGesture(gx, gy, gu, glow, shimmer, detailA);

    // Highlight sweep band, drawn over scene and gesture.
    if (lt >= T_SCENE && lt < T_HIGH) {
      var hu2 = smooth((lt - T_SCENE) / (T_HIGH - T_SCENE));
      var sweepX = lerp(natX - 0.7 * unit, natX + 0.7 * unit, hu2);
      ctx.fillStyle = 'rgba(240,217,174,0.10)';
      ctx.fillRect(sweepX - 0.12 * unit, natY - 0.7 * unit, 0.24 * unit, 1.4 * unit);
    }

    if (stampA > 0) {
      var sw = W * 0.18, sh = H * 0.20;
      if (isPhone()) { sw = W * 0.30; sh = H * 0.16; }
      var sx = W - sw - W * 0.03, sy = H - sh - H * 0.04;
      ctx.save();
      ctx.globalAlpha = stampA;
      ctx.fillStyle = '#EDE4D3';
      ctx.fillRect(sx - 3, sy - 3, sw + 6, sh + 6);
      drawMiniCrowd(sx, sy, sw, sh);
      ctx.restore();
    }
  }

  try {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true; lastPX = e.clientX; lastPY = e.clientY;
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
      lastPX = e.clientX; lastPY = e.clientY;
      drags.push({ dx: dx, dy: dy, t: lastT });
    });
    var endDrag = function () { dragging = false; };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
  } catch (e) {}

  function onResize() { size(); draw(lastT); }
  try {
    if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('resize', onResize);
    }
  } catch (e) {}

  // Frame one: synchronous, exactly t = 0, before any clock starts.
  draw(0);

  // Live clock starts only with the rAF loop.
  if (typeof requestAnimationFrame === 'function') {
    var t0 = 0;
    try { t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); } catch (e) { t0 = Date.now(); }
    var loop = function (ts) {
      var now = ts;
      try { now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : now; } catch (e) {}
      draw((now - t0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
