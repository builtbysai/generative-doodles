<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Loops, One Room</title>
<style>
html, body { margin: 0; padding: 0; background: #0E0C0A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PHI = 1.618033988749895;
var GROUND = '#0E0C0A';
var TAPE = '#A97B4F';
var OXIDE = '#C6BFAF';
var BLOOM = '#D8C49A';
var PLATE = '#161210';
var PLATE_LINE = 'rgba(198,191,175,0.30)';
var TITLE_INK = '#E8E0D0';
var HINT_INK = 'rgba(232,224,208,0.75)';
var FAINT = 'rgba(198,191,175,0.06)';
/* loop periods in seconds; ratio is irrational, so the loops never align */
var PERIOD_A = 47;
var PERIOD_B = 47 * PHI;
var CYCLES_A = 3;
var CYCLES_B = 3 * PHI;
var PHASE_A0 = 0.6;
var PHASE_B0 = 2.4;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* knock schedule, seeded once: sparse ticks on the bottom edge,
   each with a short decay envelope. Frame one shows none. */
var rng = mulberry32(1736);
var knocks = [];
(function initKnocks() {
  var t = 5 + rng() * 8, i;
  for (i = 0; i < 48; i++) {
    knocks.push({ t: t, x: 0.42 + rng() * 0.54 });
    t += 5 + rng() * 11;
  }
})();
var simTime = 0;
/* trace y at fraction u (0..1 across the trace span) for a given time */
function traceY(baseline, amp, cycles, phase0, period, u, t) {
  return baseline + amp * Math.sin(TAU * cycles * u + phase0 + TAU * t / period);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* field-like composition: full-bleed on phones, square on desktop */
function layout() {
  var rx, ry, rw, rh;
  if (isPhone) {
    rx = 0; ry = 0; rw = VW; rh = VH;
  } else {
    var side = Math.min(VW, VH);
    rx = (VW - side) / 2; ry = (VH - side) / 2; rw = side; rh = side;
  }
  var pad = rw * 0.06;
  return {
    rx: rx, ry: ry, rw: rw, rh: rh,
    x0: rx + pad, x1: rx + rw - pad,
    yA: ry + rh * 0.32, yB: ry + rh * 0.68,
    ampA: rh * 0.22, ampB: rh * 0.19
  };
}
function drawTrace(L, color, baseline, amp, cycles, phase0, period, t) {
  var N = 480, i, u, x, y;
  var lw = isPhone ? 1.2 : 1.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  /* soft glow pass, then the core line */
  ctx.strokeStyle = rgba(color, 0.16);
  ctx.lineWidth = lw * 3.2;
  ctx.beginPath();
  for (i = 0; i <= N; i++) {
    u = i / N;
    x = L.x0 + u * (L.x1 - L.x0);
    y = traceY(baseline, amp, cycles, phase0, period, u, t);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.strokeStyle = rgba(color, 0.95);
  ctx.lineWidth = lw;
  ctx.beginPath();
  for (i = 0; i <= N; i++) {
    u = i / N;
    x = L.x0 + u * (L.x1 - L.x0);
    y = traceY(baseline, amp, cycles, phase0, period, u, t);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}
/* crossings of the two traces, found from sign changes of their gap */
function findCrossings(L, t) {
  var N = 480, i, u, dPrev, d, out = [];
  function gap(uu) {
    var ya = traceY(L.yA, L.ampA, CYCLES_A, PHASE_A0, PERIOD_A, uu, t);
    var yb = traceY(L.yB, L.ampB, CYCLES_B, PHASE_B0, PERIOD_B, uu, t);
    return ya - yb;
  }
  dPrev = gap(0);
  for (i = 1; i <= N; i++) {
    u = i / N;
    d = gap(u);
    if ((dPrev < 0 && d >= 0) || (dPrev > 0 && d <= 0)) {
      var f = dPrev / (dPrev - d);
      var uc = (i - 1 + f) / N;
      out.push({ u: uc, x: L.x0 + uc * (L.x1 - L.x0) });
    }
    dPrev = d;
  }
  return out;
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var L = layout();
  var t = simTime;
  var i;
  /* faint baseline rules, barely there, to read the traces as tape tracks */
  ctx.strokeStyle = FAINT;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(L.x0, L.yA + 0.5); ctx.lineTo(L.x1, L.yA + 0.5);
  ctx.moveTo(L.x0, L.yB + 0.5); ctx.lineTo(L.x1, L.yB + 0.5);
  ctx.stroke();
  drawTrace(L, TAPE, L.yA, L.ampA, CYCLES_A, PHASE_A0, PERIOD_A, t);
  drawTrace(L, OXIDE, L.yB, L.ampB, CYCLES_B, PHASE_B0, PERIOD_B, t);
  /* interference blooms where the traces cross, growing and fading slowly */
  var xs = findCrossings(L, t);
  var R = Math.max(18, L.rh * 0.045);
  for (i = 0; i < xs.length; i++) {
    var cx = xs[i].x;
    var cy = (traceY(L.yA, L.ampA, CYCLES_A, PHASE_A0, PERIOD_A, xs[i].u, t) +
              traceY(L.yB, L.ampB, CYCLES_B, PHASE_B0, PERIOD_B, xs[i].u, t)) / 2;
    var a = 0.09 + 0.05 * Math.sin(TAU * t / 29 + i * 2.399);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    g.addColorStop(0, rgba(BLOOM, a));
    g.addColorStop(0.55, rgba(BLOOM, a * 0.45));
    g.addColorStop(1, rgba(BLOOM, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.fill();
    ctx.fillStyle = rgba(BLOOM, 0.5);
    ctx.beginPath();
    ctx.arc(cx, cy, isPhone ? 1.5 : 2, 0, TAU);
    ctx.fill();
  }
  /* knock marks: sparse ticks on the bottom edge with a short decay */
  for (i = 0; i < knocks.length; i++) {
    var age = t - knocks[i].t;
    if (age >= 0 && age < 2) {
      var ka = 0.8 * Math.exp(-age / 0.45);
      ctx.fillStyle = rgba(TAPE, ka);
      var kx = knocks[i].x * VW;
      ctx.fillRect(kx - 1, VH - 30, 2, 14);
    }
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  while (titlePx > 9 && ctx.measureText('Two Loops, One Room').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  }
  var titleW = ctx.measureText('Two Loops, One Room').width;
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var dateW = ctx.measureText('2006 · 10 · 13').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  ctx.fillText('Two Loops, One Room', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 13', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. The loops never align.';
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { simTime = t; draw(); },
    simTime: function () { return simTime; },
    crossings: function () { return findCrossings(layout(), simTime).length; }
  };
}
/* ---- frame one: fixed phase, simTime 0, no knock yet ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) { simTime += dt; draw(); }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
