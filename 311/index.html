<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.311 Embellish &amp; Cast</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#2A241E; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.311 Embellish & Cast (Xanthe Caesia).
// Three stages left to right on a workbench: one plain plaster
// mould, one embellished form with the ink pass drawn on, and
// three slip-cast copies in glaze. Tap the middle stage to
// draw on the next of eight authored embellishment variants
// (the casts re-form to match); tap the right stage to advance
// the authored colorway triple. Stage words are hand-lettered
// stroke paths only. Tapping never reloads.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PLASTER = '#EDE8DC', INK = '#2B2620';
var OXBLOOD = '#7E2F26', KILN = '#6E6A63', BLACK = '#1C1A17';
var GROUND = '#2A241E';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 6, lastNow = -1, acc = 0; // start mid-drift in the 24s light loop
var TICK = 1 / 60;

// ---- authored data ----------------------------------------------------
// 4 curated plaster profiles; this batch starts on the first.
var PROFILES = [
  { rim: 0.66, neck: 0.52, shoulder: 0.94, belly: 1.00, base: 0.60 },
  { rim: 0.58, neck: 0.46, shoulder: 0.84, belly: 0.92, base: 0.54 },
  { rim: 0.74, neck: 0.56, shoulder: 0.98, belly: 1.00, base: 0.66 },
  { rim: 0.62, neck: 0.62, shoulder: 0.88, belly: 0.96, base: 0.58 }
];
if (PROFILES.length !== 4) throw new Error('Embellish & Cast needs exactly 4 profiles');
// 8 authored embellishment variants. Exactly one applique each.
var VARIANTS = [
  { band: 'double',     rim: 'crimp',   feet: 'bun',   applique: 'sprig' },
  { band: 'dots',       rim: 'wave',    feet: 'block', applique: 'moon' },
  { band: 'crosshatch', rim: 'zigzag',  feet: 'ball',  applique: 'heart' },
  { band: 'stripes',    rim: 'bead',    feet: 'taper', applique: 'spiral' },
  { band: 'diamonds',   rim: 'flute',   feet: 'stub',  applique: 'flower' },
  { band: 'wave',       rim: 'notch',   feet: 'ring',  applique: 'star' },
  { band: 'solid',      rim: 'ripple',  feet: 'peg',   applique: 'leaf' },
  { band: 'dashes',     rim: 'scallop', feet: 'flat',  applique: 'diamond' }
];
if (VARIANTS.length !== 8) throw new Error('Embellish & Cast needs exactly 8 variants');
VARIANTS.forEach(function (v) { if (!v.applique) throw new Error('variant missing its one applique'); });
// Authored colorway triples, all inside the glaze families.
// First triple is the May 2022 set: oxblood, kiln grey, black.
var COLORWAYS = [
  [OXBLOOD, KILN, BLACK],
  [KILN, BLACK, OXBLOOD],
  [BLACK, OXBLOOD, KILN],
  [OXBLOOD, BLACK, KILN],
  [KILN, OXBLOOD, BLACK],
  [BLACK, KILN, OXBLOOD]
];
COLORWAYS.forEach(function (c) { if (c.length !== 3) throw new Error('colorway must be a triple'); });
var MOULDS = 1, EMBELLISHED = 1, CASTS = 3;
if (MOULDS !== 1 || EMBELLISHED !== 1 || CASTS !== 3) throw new Error('stage counts must be 1 / 1 / 3');

var variantIdx = 0, colorwayIdx = 0;
var drawOnT0 = -9; // draw-on animation start; long past at frame one

// Deterministic speckle per cast, fixed seed LCG, no Math.random.
function speckle(seed, n) {
  var pts = [], s = seed, i;
  for (i = 0; i < n; i++) {
    s = (s * 16807) % 2147483647; var a = s / 2147483647;
    s = (s * 16807) % 2147483647; var b = s / 2147483647;
    pts.push([a * 2 - 1, b]);
  }
  return pts;
}
var SPECK = [speckle(31101, 26), speckle(31102, 26), speckle(31103, 26)];

// ---- helpers ----------------------------------------------------------
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fill(); } else { ctx.stroke(); } }
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- hand-lettered stage words: stroke paths only ---------------------
function glyphPath(ch, x, y, w, h) {
  var mx = x + w * 0.5, i, px, py;
  ctx.beginPath();
  if (ch === 'a') {
    ctx.ellipse(mx, y + h * 0.62, w * 0.38, h * 0.36, 0, 0, Math.PI * 2);
    ctx.moveTo(x + w * 0.88, y + h * 0.28); ctx.lineTo(x + w * 0.88, y + h);
  } else if (ch === 'b') {
    ctx.moveTo(x + w * 0.14, y); ctx.lineTo(x + w * 0.14, y + h);
    ctx.moveTo(x + w * 0.14, y + h * 0.55);
    ctx.ellipse(mx + w * 0.08, y + h * 0.68, w * 0.36, h * 0.30, 0, 0, Math.PI * 2);
  } else if (ch === 'c') {
    for (i = 0; i <= 10; i++) { var a = -0.87 - (i / 10) * 4.36; px = mx + Math.cos(a) * w * 0.40; py = y + h * 0.55 + Math.sin(a) * h * 0.42; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
  } else if (ch === 'd') {
    ctx.ellipse(mx - w * 0.06, y + h * 0.62, w * 0.38, h * 0.36, 0, 0, Math.PI * 2);
    ctx.moveTo(x + w * 0.86, y); ctx.lineTo(x + w * 0.86, y + h);
  } else if (ch === 'e') {
    ctx.moveTo(x + w * 0.10, y + h * 0.50); ctx.lineTo(x + w * 0.88, y + h * 0.50);
    for (i = 0; i <= 10; i++) { var a2 = -0.87 - (i / 10) * 4.36; px = mx + Math.cos(a2) * w * 0.40; py = y + h * 0.55 + Math.sin(a2) * h * 0.42; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
  } else if (ch === 'h') {
    ctx.moveTo(x + w * 0.14, y); ctx.lineTo(x + w * 0.14, y + h);
    ctx.moveTo(x + w * 0.14, y + h * 0.58);
    ctx.quadraticCurveTo(x + w * 0.5, y + h * 0.22, x + w * 0.86, y + h * 0.52);
    ctx.lineTo(x + w * 0.86, y + h);
  } else if (ch === 'i') {
    ctx.moveTo(mx, y + h * 0.36); ctx.lineTo(mx, y + h);
    ctx.moveTo(mx, y + h * 0.08); ctx.lineTo(mx, y + h * 0.12);
  } else if (ch === 'l') {
    ctx.moveTo(x + w * 0.42, y); ctx.quadraticCurveTo(x + w * 0.30, y + h * 0.7, x + w * 0.40, y + h * 0.96);
    ctx.quadraticCurveTo(x + w * 0.52, y + h * 1.02, x + w * 0.72, y + h * 0.94);
  } else if (ch === 'm') {
    ctx.moveTo(x + w * 0.06, y + h * 0.30); ctx.lineTo(x + w * 0.06, y + h);
    ctx.moveTo(x + w * 0.06, y + h * 0.55);
    ctx.quadraticCurveTo(x + w * 0.28, y + h * 0.22, x + w * 0.48, y + h * 0.52); ctx.lineTo(x + w * 0.48, y + h);
    ctx.moveTo(x + w * 0.48, y + h * 0.55);
    ctx.quadraticCurveTo(x + w * 0.68, y + h * 0.22, x + w * 0.92, y + h * 0.52); ctx.lineTo(x + w * 0.92, y + h);
  } else if (ch === 'o') {
    ctx.ellipse(mx, y + h * 0.58, w * 0.40, h * 0.40, 0, 0, Math.PI * 2);
  } else if (ch === 's') {
    ctx.moveTo(x + w * 0.82, y + h * 0.34);
    ctx.bezierCurveTo(x + w * 0.55, y + h * 0.10, x + w * 0.14, y + h * 0.26, x + w * 0.30, y + h * 0.52);
    ctx.bezierCurveTo(x + w * 0.46, y + h * 0.76, x + w * 0.92, y + h * 0.66, x + w * 0.70, y + h * 0.94);
    ctx.bezierCurveTo(x + w * 0.52, y + h * 1.06, x + w * 0.22, y + h * 1.0, x + w * 0.12, y + h * 0.86);
  } else if (ch === 't') {
    ctx.moveTo(mx, y + h * 0.14); ctx.quadraticCurveTo(mx - w * 0.06, y + h * 0.66, mx + w * 0.02, y + h * 0.94);
    ctx.quadraticCurveTo(mx + w * 0.08, y + h * 1.02, x + w * 0.78, y + h * 0.94);
    ctx.moveTo(x + w * 0.14, y + h * 0.36); ctx.lineTo(x + w * 0.86, y + h * 0.36);
  } else if (ch === 'u') {
    ctx.moveTo(x + w * 0.10, y + h * 0.28); ctx.lineTo(x + w * 0.10, y + h * 0.62);
    ctx.quadraticCurveTo(x + w * 0.12, y + h, x + w * 0.48, y + h * 0.98);
    ctx.quadraticCurveTo(x + w * 0.82, y + h * 0.96, x + w * 0.88, y + h * 0.60);
    ctx.moveTo(x + w * 0.88, y + h * 0.28); ctx.lineTo(x + w * 0.88, y + h);
  }
}
function drawWord(word, cx, y, totalW, h, col, lw) {
  var cw = totalW / word.length, i;
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (i = 0; i < word.length; i++) {
    glyphPath(word[i], cx - totalW / 2 + i * cw + cw * 0.13, y, cw * 0.74, h);
    ctx.stroke();
  }
}

// ---- vase form ----------------------------------------------------------
function vasePath(cx, baseY, w, h, p) {
  var topY = baseY - h;
  ctx.beginPath();
  ctx.moveTo(cx - w * p.rim / 2, topY);
  ctx.bezierCurveTo(cx - w * p.neck / 2, topY + h * 0.16, cx - w * p.shoulder / 2, topY + h * 0.34, cx - w * p.belly / 2, topY + h * 0.58);
  ctx.bezierCurveTo(cx - w * p.belly / 2, topY + h * 0.82, cx - w * p.base / 2, baseY - h * 0.04, cx - w * p.base / 2, baseY);
  ctx.lineTo(cx + w * p.base / 2, baseY);
  ctx.bezierCurveTo(cx + w * p.base / 2, baseY - h * 0.04, cx + w * p.belly / 2, topY + h * 0.82, cx + w * p.belly / 2, topY + h * 0.58);
  ctx.bezierCurveTo(cx + w * p.shoulder / 2, topY + h * 0.34, cx + w * p.neck / 2, topY + h * 0.16, cx + w * p.rim / 2, topY);
  ctx.closePath();
}
// width of the form at a given fraction down from the top (approx, for band layout)
function widthAt(p, w, f) {
  var t;
  if (f < 0.34) { t = f / 0.34; return w * (p.neck + (p.shoulder - p.neck) * t) ; }
  if (f < 0.58) { t = (f - 0.34) / 0.24; return w * (p.shoulder + (p.belly - p.shoulder) * t); }
  t = (f - 0.58) / 0.42; return w * (p.belly + (p.base - p.belly) * t * t);
}

function drawFeet(cx, baseY, w, style, col, prog) {
  if (prog <= 0) return;
  var y = baseY, a = -w * 0.20, b = w * 0.20;
  // contrast edge so ink feet read against the dark bench
  var edge = (col === INK) ? PLASTER : INK;
  ctx.fillStyle = col; st(col, 3);
  function footStroke() { ctx.globalAlpha = prog * 0.55; st(edge, 1.6); ctx.stroke(); ctx.globalAlpha = prog; ctx.fillStyle = col; }
  if (style === 'bun') {
    ctx.globalAlpha = prog;
    ctx.beginPath(); ctx.arc(cx + a, y + 4, w * 0.10, 0, Math.PI); ctx.closePath(); ctx.fill(); footStroke();
    ctx.beginPath(); ctx.arc(cx + b, y + 4, w * 0.10, 0, Math.PI); ctx.closePath(); ctx.fill(); footStroke();
    ctx.globalAlpha = 1;
  } else if (style === 'block') {
    ctx.globalAlpha = prog; ctx.fillRect(cx + a - w * 0.09, y, w * 0.18, 16); ctx.strokeRect(cx + a - w * 0.09, y, w * 0.18, 16); ctx.fillRect(cx + b - w * 0.09, y, w * 0.18, 16); ctx.strokeRect(cx + b - w * 0.09, y, w * 0.18, 16); ctx.globalAlpha = 1;
  } else if (style === 'ball') {
    ctx.globalAlpha = prog; circ(cx + a, y + 9, w * 0.085, true); circ(cx + a, y + 9, w * 0.085, false); circ(cx + b, y + 9, w * 0.085, true); circ(cx + b, y + 9, w * 0.085, false); ctx.globalAlpha = 1;
    ctx.fillStyle = col;
  } else if (style === 'taper') {
    ctx.globalAlpha = prog;
    ctx.beginPath(); ctx.moveTo(cx + a - w * 0.10, y); ctx.lineTo(cx + a + w * 0.10, y); ctx.lineTo(cx + a + w * 0.05, y + 18); ctx.lineTo(cx + a - w * 0.05, y + 18); ctx.closePath(); ctx.fill(); footStroke();
    ctx.beginPath(); ctx.moveTo(cx + b - w * 0.10, y); ctx.lineTo(cx + b + w * 0.10, y); ctx.lineTo(cx + b + w * 0.05, y + 18); ctx.lineTo(cx + b - w * 0.05, y + 18); ctx.closePath(); ctx.fill(); footStroke();
    ctx.globalAlpha = 1;
  } else if (style === 'stub') {
    ctx.globalAlpha = prog; ctx.fillRect(cx + a - w * 0.07, y, w * 0.14, 10); ctx.fillRect(cx + b - w * 0.07, y, w * 0.14, 10); ctx.globalAlpha = 1;
  } else if (style === 'ring') {
    ctx.globalAlpha = prog * 0.4; st(edge, 9); ctx.beginPath(); ctx.ellipse(cx, y + 7, w * 0.30, 8, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = prog; st(col, 5);
    ctx.beginPath(); ctx.ellipse(cx, y + 7, w * 0.30, 8, 0, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  } else if (style === 'peg') {
    ctx.globalAlpha = prog * 0.4; st(edge, 10);
    line(cx + a, y, cx + a, y + 16); line(cx, y, cx, y + 16); line(cx + b, y, cx + b, y + 16);
    ctx.globalAlpha = prog; st(col, 6);
    line(cx + a, y, cx + a, y + 16); line(cx, y, cx, y + 16); line(cx + b, y, cx + b, y + 16); ctx.globalAlpha = 1;
  } else { // flat: a low plinth line
    ctx.globalAlpha = prog * 0.4; st(edge, 9); line(cx - w * 0.34, y + 8, cx + w * 0.34, y + 8);
    ctx.globalAlpha = prog; st(col, 5); line(cx - w * 0.34, y + 8, cx + w * 0.34, y + 8); ctx.globalAlpha = 1;
  }
}

function drawRim(cx, topY, w, style, col, prog, lw) {
  var rw = w * PROFILES[0].rim / 2, n, i, x, y;
  st(col, lw);
  if (style === 'crimp' || style === 'scallop' || style === 'ripple') {
    n = style === 'crimp' ? 9 : (style === 'scallop' ? 7 : 11);
    var upto = Math.floor(n * prog);
    for (i = 0; i < upto; i++) {
      x = cx - rw + (2 * rw) * (i / n);
      // full bumps straddling the rim so they read on the form itself
      ctx.beginPath(); ctx.ellipse(x + rw / n, topY + 1, rw / n, rw / n * 0.82, 0, 0, Math.PI * 2); ctx.stroke();
    }
  } else if (style === 'wave' ) {
    ctx.beginPath();
    n = 40; var upto2 = Math.floor(n * prog);
    for (i = 0; i <= upto2; i++) { x = cx - rw + 2 * rw * (i / n); y = topY + 5 + Math.sin(i / n * Math.PI * 6) * 5; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.stroke();
  } else if (style === 'zigzag') {
    ctx.beginPath(); n = 8; var upto3 = Math.floor(n * prog);
    ctx.moveTo(cx - rw, topY + 1);
    for (i = 0; i < upto3; i++) { x = cx - rw + 2 * rw * ((i + 0.5) / n); ctx.lineTo(x, topY + 13); ctx.lineTo(cx - rw + 2 * rw * ((i + 1) / n), topY + 1); }
    ctx.stroke();
  } else if (style === 'bead') {
    n = 9; var upto4 = Math.floor(n * prog);
    ctx.fillStyle = col;
    for (i = 0; i < upto4; i++) { x = cx - rw + 2 * rw * ((i + 0.5) / n); circ(x, topY + 1, lw * 1.5, true); }
  } else if (style === 'flute') {
    n = 9; var upto5 = Math.floor(n * prog);
    for (i = 0; i < upto5; i++) { x = cx - rw + 2 * rw * ((i + 0.5) / n); line(x, topY - 2, x, topY + 16); }
  } else if (style === 'notch') {
    n = 7; var upto6 = Math.floor(n * prog);
    for (i = 0; i < upto6; i++) { x = cx - rw + 2 * rw * ((i + 0.5) / n); line(x - 5, topY + 1, x, topY + 11); line(x, topY + 11, x + 5, topY + 1); }
  }
  // rim lip line itself, revealed left to right
  st(col, lw);
  line(cx - rw, topY + 2, cx - rw + 2 * rw * prog, topY + 2);
}

function drawBand(cx, topY, w, h, p, style, col, prog, lw) {
  var f = 0.46, bw = widthAt(p, w, f) / 2, y = topY + h * f, bh = h * 0.13, i, x;
  st(col, lw);
  if (style === 'double') {
    line(cx - bw * prog, y, cx + bw * prog, y); line(cx - bw * prog, y + bh * 0.55, cx + bw * prog, y + bh * 0.55);
  } else if (style === 'solid') {
    ctx.globalAlpha = 0.9 * prog; ctx.fillStyle = col;
    ctx.fillRect(cx - bw, y - bh * 0.3, 2 * bw, bh * 0.8); ctx.globalAlpha = 1;
  } else if (style === 'dots') {
    var n = 9, upto = Math.floor(n * prog); ctx.fillStyle = col;
    for (i = 0; i < upto; i++) { x = cx - bw * 0.86 + 2 * bw * 0.86 * (i / (n - 1)); circ(x, y + bh * 0.25, lw * 1.4, true); }
  } else if (style === 'dashes') {
    var n2 = 8, upto2 = Math.floor(n2 * prog);
    for (i = 0; i < upto2; i++) { x = cx - bw * 0.88 + 2 * bw * 0.88 * (i / n2); line(x, y + bh * 0.25, x + bw * 0.14, y + bh * 0.25); }
  } else if (style === 'crosshatch') {
    line(cx - bw, y - bh * 0.3, cx + bw, y - bh * 0.3); line(cx - bw, y + bh * 0.8, cx + bw, y + bh * 0.8);
    var n3 = 8, upto3 = Math.floor(n3 * prog);
    for (i = 0; i < upto3; i++) { x = cx - bw * 0.9 + 2 * bw * 0.9 * (i / n3); line(x, y + bh * 0.75, x + bh * 0.45, y - bh * 0.25); }
  } else if (style === 'stripes') {
    line(cx - bw, y - bh * 0.3, cx + bw, y - bh * 0.3); line(cx - bw, y + bh * 0.8, cx + bw, y + bh * 0.8);
    var n4 = 9, upto4 = Math.floor(n4 * prog);
    for (i = 0; i < upto4; i++) { x = cx - bw * 0.88 + 2 * bw * 0.88 * (i / (n4 - 1)); line(x, y - bh * 0.25, x, y + bh * 0.75); }
  } else if (style === 'diamonds') {
    var n5 = 5, upto5 = Math.floor(n5 * prog);
    for (i = 0; i < upto5; i++) {
      x = cx - bw * 0.76 + 2 * bw * 0.76 * (i / (n5 - 1)); var yy = y + bh * 0.25, r = bh * 0.42;
      ctx.beginPath(); ctx.moveTo(x, yy - r); ctx.lineTo(x + r, yy); ctx.lineTo(x, yy + r); ctx.lineTo(x - r, yy); ctx.closePath(); ctx.stroke();
    }
  } else if (style === 'wave') {
    ctx.beginPath(); var n6 = 36, upto6 = Math.floor(n6 * prog);
    for (i = 0; i <= upto6; i++) { x = cx - bw + 2 * bw * (i / n6); var y2 = y + bh * 0.25 + Math.sin(i / n6 * Math.PI * 8) * bh * 0.28; if (i === 0) ctx.moveTo(x, y2); else ctx.lineTo(x, y2); }
    ctx.stroke();
  }
}

function drawApplique(cx, cy, r, kind, col, prog, lw) {
  if (prog <= 0) return;
  var rr = r * (0.4 + 0.6 * prog);
  st(col, lw); ctx.fillStyle = col;
  if (kind === 'sprig') {
    ctx.beginPath(); ctx.moveTo(cx, cy + rr); ctx.quadraticCurveTo(cx + rr * 0.15, cy, cx, cy - rr); ctx.stroke();
    var leaves = [[-1, -0.35], [1, -0.05], [-1, 0.28]], i;
    for (i = 0; i < leaves.length; i++) {
      var lx = cx + leaves[i][0] * rr * 0.42, ly = cy + leaves[i][1] * rr;
      ctx.beginPath(); ctx.ellipse(lx, ly, rr * 0.30, rr * 0.15, leaves[i][0] * 0.6, 0, Math.PI * 2); ctx.fill();
    }
  } else if (kind === 'moon') {
    ctx.beginPath(); ctx.arc(cx, cy, rr * 0.85, Math.PI * 0.35, Math.PI * 1.65); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + rr * 0.38, cy, rr * 0.68, Math.PI * 1.5, Math.PI * 0.5, true); ctx.stroke();
  } else if (kind === 'heart') {
    ctx.beginPath();
    ctx.moveTo(cx, cy + rr * 0.85);
    ctx.bezierCurveTo(cx - rr * 1.15, cy + rr * 0.05, cx - rr * 0.55, cy - rr * 0.9, cx, cy - rr * 0.3);
    ctx.bezierCurveTo(cx + rr * 0.55, cy - rr * 0.9, cx + rr * 1.15, cy + rr * 0.05, cx, cy + rr * 0.85);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'spiral') {
    ctx.beginPath();
    for (var i2 = 0; i2 <= 40; i2++) { var a = i2 / 40 * Math.PI * 5, rad = rr * (i2 / 40); var px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad; if (i2 === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
    ctx.stroke();
  } else if (kind === 'flower') {
    for (var i3 = 0; i3 < 5; i3++) { var a3 = i3 / 5 * Math.PI * 2 - Math.PI / 2; circ(cx + Math.cos(a3) * rr * 0.52, cy + Math.sin(a3) * rr * 0.52, rr * 0.36, false); }
    circ(cx, cy, rr * 0.18, true);
  } else if (kind === 'star') {
    ctx.beginPath();
    ctx.moveTo(cx, cy - rr); ctx.quadraticCurveTo(cx + rr * 0.16, cy - rr * 0.16, cx + rr, cy);
    ctx.quadraticCurveTo(cx + rr * 0.16, cy + rr * 0.16, cx, cy + rr);
    ctx.quadraticCurveTo(cx - rr * 0.16, cy + rr * 0.16, cx - rr, cy);
    ctx.quadraticCurveTo(cx - rr * 0.16, cy - rr * 0.16, cx, cy - rr);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'leaf') {
    ctx.beginPath();
    ctx.moveTo(cx, cy + rr);
    ctx.bezierCurveTo(cx - rr * 0.95, cy + rr * 0.2, cx - rr * 0.6, cy - rr * 0.75, cx, cy - rr);
    ctx.bezierCurveTo(cx + rr * 0.6, cy - rr * 0.75, cx + rr * 0.95, cy + rr * 0.2, cx, cy + rr);
    ctx.closePath(); ctx.stroke();
    line(cx, cy + rr * 0.85, cx, cy - rr * 0.8);
  } else { // diamond
    ctx.beginPath(); ctx.moveTo(cx, cy - rr); ctx.lineTo(cx + rr * 0.72, cy); ctx.lineTo(cx, cy + rr); ctx.lineTo(cx - rr * 0.72, cy); ctx.closePath(); ctx.stroke();
    line(cx - rr * 0.72, cy, cx + rr * 0.72, cy);
  }
}

// One form. decorCol draws band / rim / applique; prog is draw-on reveal.
function drawForm(cx, baseY, w, h, fillCol, decorCol, opts) {
  var p = PROFILES[0];
  var prog = opts.prog;
  // soft contact shadow
  ctx.globalAlpha = 0.35; ctx.fillStyle = BLACK;
  ctx.beginPath(); ctx.ellipse(cx, baseY + 20, w * 0.52, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  if (opts.variant) {
    // pool of studio light on the bench so the feet read
    ctx.globalAlpha = 0.13; ctx.fillStyle = PLASTER;
    ctx.beginPath(); ctx.ellipse(cx, baseY + 13, w * 0.60, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    drawFeet(cx, baseY, w, opts.variant.feet, decorCol, prog);
  }
  vasePath(cx, baseY, w, h, p);
  ctx.fillStyle = fillCol; ctx.fill();
  ctx.save();
  vasePath(cx, baseY, w, h, p); ctx.clip();
  if (opts.speck) {
    ctx.fillStyle = decorCol;
    for (var i = 0; i < opts.speck.length; i++) {
      var sx = cx + opts.speck[i][0] * w * 0.42, sy = baseY - h + opts.speck[i][1] * h * 0.92 + h * 0.04;
      ctx.globalAlpha = 0.28; circ(sx, sy, 2.2, true);
    }
    ctx.globalAlpha = 1;
  }
  if (opts.mouldSeam) {
    ctx.globalAlpha = 0.35; st(INK, 2.5);
    line(cx, baseY - h + 6, cx, baseY - 6);
    line(cx - w * 0.47, baseY - h * 0.42, cx + w * 0.47, baseY - h * 0.42);
    ctx.globalAlpha = 1;
  }
  if (opts.variant) {
    drawBand(cx, baseY - h, w, h, p, opts.variant.band, decorCol, prog, opts.lw);
    drawApplique(cx, baseY - h * 0.30, w * 0.16, opts.variant.applique, decorCol, prog, opts.lw);
  }
  ctx.restore();
  vasePath(cx, baseY, w, h, p);
  st(INK, opts.lw + 0.6); ctx.stroke();
  if (opts.variant) drawRim(cx, baseY - h, w, opts.variant.rim, decorCol, prog, opts.lw);
  // inner rim opening
  ctx.globalAlpha = 0.5; ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(cx, baseY - h + 2, w * p.rim / 2 - 4, 6, 0, 0, Math.PI); ctx.fill();
  ctx.globalAlpha = 1;
}

function draw() {
  var v = VARIANTS[variantIdx];
  var prog = clamp01((T - drawOnT0) / 1.25);
  var ease = prog * prog * (3 - 2 * prog);
  ctx.fillStyle = GROUND; ctx.fillRect(0, 0, DW, DH);
  // workbench slab
  ctx.fillStyle = BLACK; ctx.fillRect(40, 652, 1200, 26);
  ctx.globalAlpha = 0.5; st(PLASTER, 2); line(40, 652, 1240, 652); ctx.globalAlpha = 1;
  // soft studio light drift, 24s loop, layered translucency only
  var ph = (T % 24) / 24, drift = Math.sin(ph * Math.PI * 2);
  ctx.save();
  ctx.fillStyle = PLASTER;
  var lx = 640 + drift * 330;
  ctx.globalAlpha = 0.030; ctx.beginPath(); ctx.moveTo(lx - 300, 0); ctx.lineTo(lx - 60, 0); ctx.lineTo(lx + 140, 900); ctx.lineTo(lx - 100, 900); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.022; ctx.beginPath(); ctx.moveTo(lx - 60, 0); ctx.lineTo(lx + 90, 0); ctx.lineTo(lx + 290, 900); ctx.lineTo(lx + 140, 900); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.015; ctx.beginPath(); ctx.moveTo(lx + 90, 0); ctx.lineTo(lx + 210, 0); ctx.lineTo(lx + 410, 900); ctx.lineTo(lx + 290, 900); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
  // Stage 1: exactly 1 plain plaster mould, sitting on the bench
  drawForm(215, 650, 190, 330, PLASTER, INK, { prog: 1, variant: null, mouldSeam: true, lw: 3 });
  // Stage 2: exactly 1 embellished form, ink pass on plaster, on its feet
  drawForm(535, 634, 190, 330, PLASTER, INK, { prog: ease, variant: v, lw: 3.4 });
  // Stage 3: exactly 3 cast copies, re-formed to match, current colorway
  var cw = COLORWAYS[colorwayIdx];
  var castScale = 0.965 + 0.035 * ease;
  var castX = [862, 1002, 1142], ci;
  for (ci = 0; ci < CASTS; ci++) {
    ctx.save();
    ctx.translate(castX[ci], 634); ctx.scale(castScale, castScale); ctx.translate(-castX[ci], -634);
    drawForm(castX[ci], 634, 132, 244, cw[ci], PLASTER, { prog: ease, variant: v, speck: SPECK[ci], lw: 2.6 });
    ctx.restore();
  }
  // hand-lettered stage words
  ctx.globalAlpha = 0.92;
  drawWord('mould', 215, 706, 118, 30, PLASTER, 3);
  drawWord('embellish', 535, 706, 196, 30, PLASTER, 3);
  drawWord('cast', 1002, 706, 92, 30, PLASTER, 3);
  ctx.globalAlpha = 1;
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e), x = p[0], y = p[1];
  if (y < 240 || y > 780) return;
  if (x >= 400 && x <= 680) {
    variantIdx = (variantIdx + 1) % VARIANTS.length;
    drawOnT0 = T;
  } else if (x >= 760 && x <= 1245) {
    colorwayIdx = (colorwayIdx + 1) % COLORWAYS.length;
  }
});

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
