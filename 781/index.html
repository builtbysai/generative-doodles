<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Room</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #6E97C4;
  }
  canvas {
    display: block;
    margin: 0;
    padding: 0;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Palette (strict): room blues, rectangle, bleed, silhouette.
  var DEEP = [110, 151, 196];  // #6E97C4
  var LIGHT = [143, 179, 217]; // #8FB3D9
  var RECT = [244, 250, 255];  // #F4FAFF
  var BLEED = [220, 232, 255]; // #DCE8FF
  var INK = [16, 19, 24];      // #101318

  // Breathing: seamless 54 s loop. breathAt(t) is a master sine in
  // [-1, 1]; at t = 0 it is exactly 0, the mid-swell of the cycle.
  var LOOP = 54;

  function breathAt(t) {
    return Math.sin((t / LOOP) * Math.PI * 2);
  }

  function mix(a, b, u) {
    return [
      a[0] + (b[0] - a[0]) * u,
      a[1] + (b[1] - a[1]) * u,
      a[2] + (b[2] - a[2]) * u
    ];
  }

  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }

  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(4) + ')';
  }

  function clamp01(v) {
    return v < 0 ? 0 : (v > 1 ? 1 : v);
  }

  var viewW = 0;
  var viewH = 0;
  var isPhone = false;

  function measure() {
    var vv = window.visualViewport;
    viewW = vv ? vv.width : window.innerWidth;
    viewH = vv ? vv.height : window.innerHeight;
    var sw = window.screen ? window.screen.width : viewW;
    var sh = window.screen ? window.screen.height : viewH;
    isPhone = Math.min(sw, sh) < 700 || viewH > viewW * 1.15;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Scene geometry, all fractions of the frame, precomputed per draw
  // from the measured viewport. The floor line sits at the lower
  // third; the rectangle hangs centered on the rear wall above it.
  function geometry(w, h) {
    var floorY = h * 0.70;
    var rectW = w * 0.40;
    var rectH = h * 0.36;
    var rectCx = w * 0.50;
    var rectCy = h * 0.34;
    return {
      floorY: floorY,
      rectX: rectCx - rectW / 2,
      rectY: rectCy - rectH / 2,
      rectW: rectW,
      rectH: rectH,
      rectCx: rectCx,
      rectCy: rectCy
    };
  }

  // One glow stack: nested flat rects of the bleed color at low
  // alpha around a core rect, widest and faintest first. Used for the
  // rectangle itself and, flipped and squashed, for its reflection,
  // so the reflection is the same geometry, honestly mirrored.
  function glowStack(cx, cyTop, gw, gh, squash, alphaScale, coreAlpha) {
    var layers = 6;
    for (var i = layers; i >= 1; i--) {
      var grow = i / layers;
      var lw = gw * (1 + grow * 0.55);
      var lh = gh * (1 + grow * 0.55) * squash;
      var a = 0.028 * (1 - grow * 0.45) * alphaScale;
      ctx.fillStyle = rgba(BLEED, a);
      ctx.fillRect(cx - lw / 2, cyTop - (lh - gh * squash) / 2, lw, lh);
    }
    ctx.fillStyle = rgba(RECT, coreAlpha * alphaScale);
    ctx.fillRect(cx - gw / 2, cyTop, gw, gh * squash);
  }

  function drawSilhouette(g, w, h) {
    // One small seated figure, side profile facing the rectangle,
    // base on the floor line, left of the rectangle. Static forever:
    // no parameter of t reaches this path.
    var fx = g.rectX - w * 0.085;
    var fy = g.floorY;
    var u = h / 100; // figure unit: total height about 13 units
    ctx.fillStyle = rgb(INK);
    // Seat block the figure rests on.
    ctx.fillRect(fx - 2.4 * u, fy - 4.0 * u, 4.6 * u, 4.0 * u);
    // Head.
    ctx.beginPath();
    ctx.arc(fx - 0.3 * u, fy - 11.3 * u, 1.6 * u, 0, Math.PI * 2);
    ctx.fill();
    // Torso, thigh, shin as one filled profile: back down from the
    // neck, chest to the lap, thigh forward to the knee, shin
    // dropping to the floor, then back along the underside.
    ctx.beginPath();
    ctx.moveTo(fx - 1.7 * u, fy - 10.2 * u);
    ctx.lineTo(fx + 1.1 * u, fy - 9.8 * u);
    ctx.lineTo(fx + 0.9 * u, fy - 5.2 * u);
    ctx.lineTo(fx + 4.3 * u, fy - 4.9 * u);
    ctx.lineTo(fx + 4.4 * u, fy - 3.6 * u);
    ctx.lineTo(fx + 3.7 * u, fy - 3.5 * u);
    ctx.lineTo(fx + 3.7 * u, fy - 0.2 * u);
    ctx.lineTo(fx + 2.6 * u, fy - 0.2 * u);
    ctx.lineTo(fx + 2.5 * u, fy - 3.4 * u);
    ctx.lineTo(fx - 1.4 * u, fy - 3.6 * u);
    ctx.closePath();
    ctx.fill();
  }

  function draw(t) {
    var w = viewW;
    var h = viewH;
    if (!w || !h) return;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    var g = geometry(w, h);
    var b = breathAt(t); // -1..1, 0 at t = 0

    // Rectangle brightness: plus/minus 6 percent around full.
    var coreAlpha = 0.97 + 0.03 * b;
    var bleedScale = 1 + 0.35 * b;
    // Room blue counter-phase: as the rectangle swells, the room
    // deepens; as it recedes, the room lifts.
    var roomShift = -0.055 * b;

    // Rear wall: fine horizontal bands stepping between the two room
    // blues, lightest around the rectangle's height. No gradients:
    // many thin flat bands read as atmosphere.
    var bandH = 2;
    for (var y = 0; y < g.floorY; y += bandH) {
      var d = Math.abs(y - g.rectCy) / h;
      var fall = Math.max(0, 1 - d / 0.52);
      var m = clamp01(0.18 + 0.62 * fall + roomShift);
      ctx.fillStyle = rgb(mix(DEEP, LIGHT, m));
      ctx.fillRect(0, y, w, bandH + 1);
    }

    // Central luminosity: nested soft ellipses of the light blue at
    // low alpha behind the rectangle, so the wall glows from its
    // middle rather than reading as architecture.
    var lumLayers = 7;
    for (var i = lumLayers - 1; i >= 0; i--) {
      var f = (i + 1) / lumLayers;
      ctx.fillStyle = rgba(LIGHT, 0.05 * (1 - f * 0.5));
      ctx.beginPath();
      ctx.ellipse(g.rectCx, g.rectCy, w * 0.52 * f, h * 0.34 * f, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // The rectangle and its bleed, floating in the blue, unbounded:
    // no frame lines, nothing drawn at its corners.
    glowStack(g.rectCx, g.rectY, g.rectW, g.rectH, 1, bleedScale, coreAlpha);

    // Polished floor: bands stepping from a lighter tone at the wall
    // base down to the deep blue, counter-phased with the room.
    for (var fy2 = g.floorY; fy2 < h; fy2 += bandH) {
      var v = (fy2 - g.floorY) / (h - g.floorY);
      var fm = clamp01(0.42 - 0.38 * v + roomShift);
      ctx.fillStyle = rgb(mix(DEEP, LIGHT, fm));
      ctx.fillRect(0, fy2, w, bandH + 1);
    }

    // Honest reflection: the same glow-stack geometry mirrored
    // across the floor line, squashed vertically to 55 percent, at
    // 40 percent alpha, breathing with the same function as its
    // source. The mirrored bleed tops sit just under the floor line,
    // exactly where the rectangle's own bottom edge reflects.
    var squash = 0.55;
    var reflTop = g.floorY + (g.floorY - (g.rectY + g.rectH)) * squash;
    glowStack(g.rectCx, reflTop, g.rectW, g.rectH, squash, 0.40 * bleedScale, coreAlpha);

    // The seated figure, dwarfed, at the rectangle's left.
    drawSilhouette(g, w, h);
  }

  function resize() {
    measure();
    draw(lastT);
  }

  var lastT = 0;
  measure();
  draw(0);

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  // Watch-only: no pointer interaction of any kind.
  if (typeof window.requestAnimationFrame === 'function') {
    var start = null;
    var frame = function (ts) {
      if (start === null) start = ts;
      lastT = (ts - start) / 1000;
      draw(lastT);
      window.requestAnimationFrame(frame);
    };
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
