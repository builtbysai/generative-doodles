<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1952 The Moor Is the Score</title>
<style>
  html, body { margin: 0; padding: 0; background: #b3a077; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // The Moor Is the Score, TC1 / PP1199, study #255 tom-challenger.
  // An antique hand-colored map fills the frame: contour lines, a
  // packhorse track, a church, and a 21st-century internet cable
  // drawn in red. The lines slowly lift off the paper and become
  // glowing playable curves; small cursor-performers travel the
  // routes, sounding tones as they move. Three named sites take
  // turns as the map: Thieves Clough Bridge, Redbrook Pump House,
  // Worlow Quarry. Drag along a contour to travel it: drag a route
  // and the cursor-performer follows your path, playing the line;
  // release and it continues on its own. The score is played by
  // traveling it. No turn-by-turn map UI, no GPS pins; the map
  // reads as a score, not navigation.
  var PARCH = '#e9dcbd';    // parchment
  var PARCH_DK = '#dccda4'; // darker parchment, washes
  var GROUND = '#b3a077';   // ground outside the square on desktop
  var INK = '#4a3f2a';      // brown map ink
  var INK_SOFT = '#6d5c3d'; // softer brown ink
  var GREEN = '#5a7a3a';    // hand-color green
  var OCHRE = '#b07f2e';    // hand-color ochre
  var BLUE = '#4a6a8a';     // hand-color blue
  var PHOS = '#f5f7ff';     // phosphor white, lifted lines
  var RED = '#c22a1e';      // red-pen red, the cable
  var RED_LIT = '#e0402e';  // lit red cable
  var PILL = '#4a3f2a';     // hint pill, map ink

  // Fixed-phase first frame: FIRST_T = 8 s. At t = 8 the first
  // site is Thieves Clough Bridge, the contours have lifted a
  // little, the three performers are already traveling (contour
  // performer a quarter round its loop, track performer past the
  // first bend, cable performer near its second node), and the
  // cable glows red against the parchment.
  var FIRST_T = 8;
  var SEED = 1952;
  var SITE_PERIOD = 180; // a site holds the map for three minutes

  var SITES = [
    { name: 'Thieves Clough Bridge', hill: [0.62, 0.36], church: [0.30, 0.30],
      track: [[0.04, 0.94], [0.20, 0.74], [0.27, 0.48], [0.30, 0.30]],
      cable: [[0.96, 0.08], [0.78, 0.22], [0.78, 0.46], [0.60, 0.62], [0.44, 0.80]] },
    { name: 'Redbrook Pump House', hill: [0.34, 0.56], church: [0.68, 0.28],
      track: [[0.06, 0.14], [0.30, 0.30], [0.54, 0.32], [0.68, 0.28]],
      cable: [[0.92, 0.92], [0.70, 0.76], [0.54, 0.60], [0.38, 0.56]] },
    { name: 'Worlow Quarry', hill: [0.56, 0.30], church: [0.25, 0.66],
      track: [[0.96, 0.86], [0.70, 0.80], [0.44, 0.72], [0.25, 0.66]],
      cable: [[0.08, 0.08], [0.26, 0.20], [0.42, 0.36], [0.56, 0.52]] }
  ];

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load,
  // ?site=<0..2> forces a site at load, ?seed= varies the texture
  // seed. Read at load only.
  var seedParam = 0, probeT = null, probeSite = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = qs.match(/[?&]seed=(-?\d+)/); if (m) { seedParam = parseInt(m[1], 10) || 0; }
    var mt = qs.match(/[?&]t=([0-9.]+)/); if (mt) { probeT = parseFloat(mt[1]); }
    var ms = qs.match(/[?&]site=(\d+)/); if (ms) { probeSite = parseInt(ms[1], 10) || 0; }
  } catch (e) {}
  var FIELD_SEED = seedParam ? (SEED + seedParam * 101) : SEED;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and a fixed salt, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function siteIndex(t) {
    if (probeSite !== null) { return probeSite % SITES.length; }
    return Math.floor(t / SITE_PERIOD) % SITES.length;
  }

  // Catmull-Rom sampling of a control-point polyline into N
  // points in normalized coordinates.
  function sampleCurve(pts, n, closed) {
    var out = [], i, j, p0, p1, p2, p3, f, k;
    var count = closed ? pts.length : pts.length - 1;
    for (i = 0; i < count; i++) {
      p1 = pts[i];
      p2 = closed ? pts[(i + 1) % pts.length] : pts[i + 1];
      p0 = closed ? pts[(i - 1 + pts.length) % pts.length] : (i === 0 ? pts[0] : pts[i - 1]);
      p3 = closed ? pts[(i + 2) % pts.length] : (i + 2 < pts.length ? pts[i + 2] : pts[pts.length - 1]);
      var segs = Math.max(1, Math.round(n / count));
      for (j = 0; j < segs; j++) {
        f = j / segs;
        var f2 = f * f, f3 = f2 * f;
        out.push([
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * f + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * f2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * f3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * f + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * f2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * f3)
        ]);
      }
    }
    return out;
  }

  // One contour loop around the hill: a wobbly closed ring.
  function contourLoop(site, ring, n) {
    var rng = mulberry32(FIELD_SEED + site * 131 + ring * 17);
    var ph1 = rng() * Math.PI * 2, ph2 = rng() * Math.PI * 2;
    var a1 = 0.10 + rng() * 0.06, a2 = 0.05 + rng() * 0.04;
    var cx = SITES[site].hill[0], cy = SITES[site].hill[1];
    var R = 0.075 + ring * 0.055;
    var out = [], i, a, r;
    for (i = 0; i < n; i++) {
      a = (i / n) * Math.PI * 2;
      r = R * (1 + a1 * Math.sin(3 * a + ph1) + a2 * Math.sin(5 * a + ph2));
      out.push([cx + Math.cos(a) * r * 1.15, cy + Math.sin(a) * r * 0.85]);
    }
    return out;
  }

  // Routes for the current site, sampled once per site change.
  // route 0: a contour loop (closed), route 1: the packhorse
  // track (open, dashed), route 2: the red cable (open).
  var routeCache = { site: -1, routes: null };
  function routesFor(site) {
    if (routeCache.site === site && routeCache.routes) { return routeCache.routes; }
    var contour = contourLoop(site, 3, 140);
    var track = sampleCurve(SITES[site].track, 120, false);
    var cable = sampleCurve(SITES[site].cable, 120, false);
    routeCache = { site: site, routes: [contour, track, cable] };
    return routeCache.routes;
  }

  // Performers: one per route. u(t) is a pure function of t plus
  // a base set at the last release, so frame one is reproducible
  // and a drag visibly moves the performer and re-bases travel.
  // Closed loop wraps; open routes ping-pong.
  var travel = [
    { base: 0.25, t0: 0, speed: 0.022, closed: true },
    { base: 0.30, t0: 0, speed: 0.016, closed: false },
    { base: 0.45, t0: 0, speed: 0.020, closed: false }
  ];
  function pingpong(x) {
    var f = x - Math.floor(x);
    return f < 0.5 ? f * 2 : 2 - 2 * f;
  }
  function routeU(i, t) {
    var tr = travel[i];
    var x = tr.base + tr.speed * (t - tr.t0);
    return tr.closed ? (x - Math.floor(x)) : pingpong(x);
  }
  function pointAt(route, u) {
    var n = route.length;
    var f = u * (n - 1);
    var i = Math.floor(f), g = f - i;
    if (i >= n - 1) { return route[n - 1]; }
    var a = route[i], b = route[i + 1];
    return [a[0] + (b[0] - a[0]) * g, a[1] + (b[1] - a[1]) * g];
  }
  // Nearest sample on a route to a normalized point; returns u.
  function nearestU(route, nx, ny) {
    var best = 0, bestD = 1e9, i, dx, dy, d;
    for (i = 0; i < route.length; i++) {
      dx = route[i][0] - nx; dy = route[i][1] - ny;
      d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return { u: best / (route.length - 1), dist: Math.sqrt(bestD) };
  }

  // Interaction state: the route being dragged, if any.
  var dragging = null; // { route, u }
  var dragMoved = false;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Parchment ground with a faint fiber grain and a darker edge.
  function drawParchment() {
    ctx.fillStyle = PARCH;
    ctx.fillRect(0, 0, W, H);
    var rng = mulberry32(FIELD_SEED * 3 + 5);
    var i;
    for (i = 0; i < 260; i++) {
      var x = rng() * W, y = rng() * H, l = 6 + rng() * 22;
      ctx.strokeStyle = hexA(rng() > 0.5 ? PARCH_DK : '#f4ead0', a4(0.10 + rng() * 0.12));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + l, y + (rng() - 0.5) * 3);
      ctx.stroke();
    }
    // Darker edge, like an old sheet.
    ctx.strokeStyle = hexA(INK_SOFT, a4(0.35));
    ctx.lineWidth = 2;
    ctx.strokeRect(4, 4, W - 8, H - 8);
    ctx.strokeStyle = hexA(INK_SOFT, a4(0.15));
    ctx.lineWidth = 6;
    ctx.strokeRect(9, 9, W - 18, H - 18);
  }

  // Soft hand-color washes: green moor, ochre field, blue water.
  function drawWashes(site) {
    var rng = mulberry32(FIELD_SEED + site * 57 + 11);
    var spots = [
      { c: GREEN, x: 0.22, y: 0.72, rx: 0.20, ry: 0.13 },
      { c: OCHRE, x: 0.78, y: 0.22, rx: 0.17, ry: 0.11 },
      { c: BLUE, x: 0.82, y: 0.78, rx: 0.13, ry: 0.09 },
      { c: GREEN, x: 0.45, y: 0.18, rx: 0.15, ry: 0.09 }
    ];
    var i;
    for (i = 0; i < spots.length; i++) {
      var s = spots[i];
      var jx = (rng() - 0.5) * 0.06, jy = (rng() - 0.5) * 0.06;
      ctx.fillStyle = hexA(s.c, a4(0.10));
      ctx.beginPath();
      ctx.moveTo((s.x + jx) * W + s.rx * W, (s.y + jy) * H);
      ctx.ellipse((s.x + jx) * W, (s.y + jy) * H, s.rx * W, s.ry * H, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Contour lines around the hill. The middle rings lift a little
  // off the paper and shimmer phosphor white.
  function drawContours(site, t, routes) {
    var ring;
    for (ring = 0; ring < 7; ring++) {
      var loop = contourLoop(site, ring, 90);
      var lift = (ring >= 2 && ring <= 4) ? 2.5 + 1.5 * Math.sin(t * 0.25 + ring * 1.3) : 0;
      var i;
      if (lift > 0.3) {
        ctx.strokeStyle = hexA(PHOS, a4(0.30));
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        for (i = 0; i <= loop.length; i++) {
          var p = loop[i % loop.length];
          if (i === 0) { ctx.moveTo(p[0] * W, p[1] * H - lift); } else { ctx.lineTo(p[0] * W, p[1] * H - lift); }
        }
        ctx.closePath();
        ctx.stroke();
      }
      ctx.strokeStyle = hexA(ring === 3 ? INK : INK_SOFT, a4(ring === 3 ? 0.85 : 0.55));
      ctx.lineWidth = ring === 3 ? 2 : 1.2;
      ctx.beginPath();
      for (i = 0; i <= loop.length; i++) {
        var q = loop[i % loop.length];
        if (i === 0) { ctx.moveTo(q[0] * W, q[1] * H); } else { ctx.lineTo(q[0] * W, q[1] * H); }
      }
      ctx.closePath();
      ctx.stroke();
    }
    // Hill label and height marks.
    var hx = SITES[site].hill[0] * W, hy = SITES[site].hill[1] * H;
    ctx.fillStyle = hexA(INK_SOFT, a4(0.8));
    ctx.font = 'italic ' + Math.round(11 * clamp(W / 560, 0.85, 1.1)) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.fillText('432', hx, hy - 6);
    ctx.textAlign = 'left';
  }

  // Stroke a sampled route, optionally dashed, optionally lifted
  // with a phosphor or red glow.
  function strokeRoute(route, color, width, lift, glow, dashed) {
    var i, p;
    if (dashed) { try { ctx.setLineDash([7, 6]); } catch (e) {} }
    if (glow) {
      ctx.strokeStyle = hexA(color, a4(0.16));
      ctx.lineWidth = width + 6;
      ctx.beginPath();
      for (i = 0; i < route.length; i++) {
        p = route[i];
        if (i === 0) { ctx.moveTo(p[0] * W, p[1] * H - lift); } else { ctx.lineTo(p[0] * W, p[1] * H - lift); }
      }
      ctx.stroke();
      ctx.strokeStyle = hexA(color, a4(0.45));
      ctx.lineWidth = width + 2.5;
      ctx.beginPath();
      for (i = 0; i < route.length; i++) {
        p = route[i];
        if (i === 0) { ctx.moveTo(p[0] * W, p[1] * H - lift); } else { ctx.lineTo(p[0] * W, p[1] * H - lift); }
      }
      ctx.stroke();
    }
    ctx.strokeStyle = hexA(color, a4(0.95));
    ctx.lineWidth = width;
    ctx.beginPath();
    for (i = 0; i < route.length; i++) {
      p = route[i];
      if (i === 0) { ctx.moveTo(p[0] * W, p[1] * H - lift); } else { ctx.lineTo(p[0] * W, p[1] * H - lift); }
    }
    ctx.stroke();
    if (dashed) { try { ctx.setLineDash([]); } catch (e) {} }
  }

  // The church: a small tower with a pitched roof, a nave, a door.
  function drawChurch(site) {
    var cx = SITES[site].church[0] * W, cy = SITES[site].church[1] * H;
    var s = clamp(W / 560, 0.8, 1.2);
    ctx.strokeStyle = INK;
    ctx.fillStyle = PARCH;
    ctx.lineWidth = 1.6;
    // Nave.
    ctx.fillRect(cx - 16 * s, cy - 4 * s, 26 * s, 14 * s);
    ctx.strokeRect(cx - 16 * s, cy - 4 * s, 26 * s, 14 * s);
    // Pitched roof.
    ctx.beginPath();
    ctx.moveTo(cx - 18 * s, cy - 4 * s);
    ctx.lineTo(cx - 3 * s, cy - 14 * s);
    ctx.lineTo(cx + 12 * s, cy - 4 * s);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Tower.
    ctx.fillRect(cx - 26 * s, cy - 22 * s, 10 * s, 32 * s);
    ctx.strokeRect(cx - 26 * s, cy - 22 * s, 10 * s, 32 * s);
    // Tower cap.
    ctx.beginPath();
    ctx.moveTo(cx - 27 * s, cy - 22 * s);
    ctx.lineTo(cx - 21 * s, cy - 30 * s);
    ctx.lineTo(cx - 15 * s, cy - 22 * s);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Door and window.
    ctx.fillStyle = INK;
    ctx.fillRect(cx - 6 * s, cy + 2 * s, 5 * s, 8 * s);
    ctx.fillRect(cx - 23 * s, cy - 12 * s, 3 * s, 6 * s);
    // Label.
    ctx.fillStyle = hexA(INK, a4(0.85));
    ctx.font = 'italic ' + Math.round(11 * clamp(W / 560, 0.85, 1.1)) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('church', cx - 26 * s, cy + 24 * s);
  }

  // Small red squares where the cable changes direction.
  function drawCableNodes(route) {
    var i;
    ctx.fillStyle = RED;
    for (i = 0; i < route.length; i += 30) {
      var p = route[i];
      ctx.fillRect(p[0] * W - 2.5, p[1] * H - 2.5, 5, 5);
    }
  }

  // A performer: a glowing dot riding a line, with a tone ring
  // that expands and fades as it sounds, and a short stem that
  // rises and falls with the tone.
  function drawPerformer(px, py, color, t, phase) {
    var s = clamp(W / 560, 0.8, 1.2);
    var ringF = (t * 0.5 + phase) % 1;
    var rr = 5 + ringF * 16 * s;
    ctx.strokeStyle = hexA(color, a4(0.5 * (1 - ringF)));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px + rr, py);
    ctx.arc(px, py, rr, 0, Math.PI * 2);
    ctx.stroke();
    // Stem, the sounding mark.
    var stem = 6 + 5 * Math.sin(t * 1.4 + phase * 6.28);
    ctx.strokeStyle = hexA(color, a4(0.8));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px, py - 4);
    ctx.lineTo(px, py - 4 - stem);
    ctx.stroke();
    // The dot itself.
    ctx.fillStyle = hexA('#ffffff', a4(0.95));
    ctx.beginPath();
    ctx.moveTo(px + 4.5, py);
    ctx.arc(px, py, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(px + 2.5, py);
    ctx.arc(px, py, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Compass rose, bottom-left, and a small scale bar.
  function drawFurniture() {
    var s = clamp(W / 560, 0.8, 1.2);
    var cx = 44 * s + 10, cy = H - 44 * s - 10;
    ctx.strokeStyle = hexA(INK, a4(0.8));
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 16 * s); ctx.lineTo(cx, cy + 16 * s);
    ctx.moveTo(cx - 16 * s, cy); ctx.lineTo(cx + 16 * s, cy);
    ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 20 * s); ctx.lineTo(cx - 3.5, cy - 6 * s); ctx.lineTo(cx + 3.5, cy - 6 * s);
    ctx.closePath();
    ctx.fill();
    ctx.font = Math.round(10 * s) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.fillText('N', cx, cy - 24 * s);
    ctx.textAlign = 'left';
    // Scale bar, bottom-right.
    var bx = W - 90 * s - 14, by = H - 22;
    ctx.strokeStyle = hexA(INK, a4(0.8));
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx, by); ctx.lineTo(bx + 80 * s, by);
    ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(bx, by - 4); ctx.lineTo(bx, by + 4);
    ctx.moveTo(bx + 80 * s, by - 4); ctx.lineTo(bx + 80 * s, by + 4);
    ctx.stroke();
    ctx.fillStyle = hexA(INK, a4(0.8));
    ctx.font = Math.round(10 * s) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.fillText('1 mile', bx + 40 * s, by - 8);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var site = siteIndex(t);
    var routes = routesFor(site);

    drawParchment();
    drawWashes(site);
    drawContours(site, t, routes);

    // The routes on the paper first, faint, then lifted and
    // glowing. The contour route lifts slowly, the track lifts a
    // little less, the red cable lifts highest and glows red.
    var liftC = 5 + 3 * Math.sin(t * 0.22);
    var liftT = 4 + 2.5 * Math.sin(t * 0.22 + 1.1);
    var liftR = 7 + 3.5 * Math.sin(t * 0.22 + 2.2);
    // Paper shadows of the routes.
    ctx.strokeStyle = hexA(INK_SOFT, a4(0.25));
    ctx.lineWidth = 1.2;
    var i, p;
    for (i = 0; i < routes[0].length; i++) {
      p = routes[0][i];
      if (i === 0) { ctx.beginPath(); ctx.moveTo(p[0] * W, p[1] * H); } else { ctx.lineTo(p[0] * W, p[1] * H); }
    }
    ctx.closePath();
    ctx.stroke();
    drawChurch(site);
    // Lifted playable curves. The track keeps an ochre dashed
    // line on the paper with its phosphor lift above it; the cable
    // keeps a red-pen line on the paper with its lit lift above.
    strokeRoute(routes[0], PHOS, 1.8, liftC, true, false);
    strokeRoute(routes[1], OCHRE, 2, 0, false, true);
    strokeRoute(routes[1], PHOS, 1.2, liftT, true, true);
    strokeRoute(routes[2], RED, 1.8, 0, false, false);
    strokeRoute(routes[2], RED_LIT, 2.2, liftR, true, false);
    drawCableNodes(routes[2].map(function (q) { return [q[0], q[1] - liftR / H]; }));

    // Performers, one per route. A dragged performer rides at
    // the pointer instead of its clock position.
    var cols = [PHOS, OCHRE, RED_LIT];
    for (i = 0; i < 3; i++) {
      var u = (dragging && dragging.route === i) ? dragging.u : routeU(i, t);
      var pt = pointAt(routes[i], u);
      var lift = [liftC, liftT, liftR][i];
      drawPerformer(pt[0] * W, pt[1] * H - lift, cols[i], t, i * 0.33);
    }

    drawFurniture();

    // ---- Plates: title top-left, number and date below it, the
    // current site top-right with a short descriptor. Ink on
    // parchment, so the plates read like the map's own lettering.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Moor Is the Score', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.8);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1952 · 2007 · 05 · 17', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(INK, 0.65);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('the map is the score', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.font = fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(SITES[site].name, W - 18, 18 + fsTitle * 0.8 + fsSmall + 8 + fsSmall + 6);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom on a dark ink pill so it
    // stays legible over the parchment.
    var hint = 'Drag a contour to travel it.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(PILL, a4(0.85));
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = PARCH;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function perfT() { return lastT; }

  function canvasPos(e) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function toNorm(p) { return { x: p.x / W, y: p.y / H }; }

  // The nearest route to a pointer point, within reach.
  function pickRoute(nx, ny, t) {
    var site = siteIndex(t);
    var routes = routesFor(site);
    var best = -1, bestD = 0.07, bestU = 0, i;
    for (i = 0; i < 3; i++) {
      var r = nearestU(routes[i], nx, ny);
      if (r.dist < bestD) { bestD = r.dist; best = i; bestU = r.u; }
    }
    return best < 0 ? null : { route: best, u: bestU };
  }

  // Drag API shared by pointer handlers and the QA hooks.
  function dragStart(nx, ny, t) {
    var pick = pickRoute(nx, ny, t);
    if (!pick) { return false; }
    dragging = pick;
    dragMoved = false;
    return true;
  }
  function dragMove(nx, ny, t) {
    if (!dragging) { return false; }
    var routes = routesFor(siteIndex(t));
    var r = nearestU(routes[dragging.route], nx, ny);
    dragging.u = r.u;
    dragMoved = true;
    return true;
  }
  function dragEnd(t) {
    if (!dragging) { return false; }
    if (dragMoved) {
      // Re-base travel so the performer continues from the
      // dragged position at the current clock time.
      travel[dragging.route].base = dragging.u;
      travel[dragging.route].t0 = t;
    }
    dragging = null;
    return true;
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      var p = toNorm(canvasPos(e));
      if (!dragStart(p.x, p.y, perfT())) { return; }
      try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      draw(reduced ? FIRST_T : perfT());
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var p = toNorm(canvasPos(e));
      dragMove(p.x, p.y, perfT());
      draw(reduced ? FIRST_T : perfT());
    });
    window.addEventListener('pointerup', function () {
      if (!dragging) { return; }
      dragEnd(perfT());
      draw(reduced ? FIRST_T : perfT());
    });
    window.addEventListener('pointercancel', function () { dragging = null; });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1952 exposes the drag API, the current site,
  // and the performer positions.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1952 = {
      dragStart: dragStart,
      dragMove: dragMove,
      dragEnd: dragEnd,
      site: function (t) { return SITES[siteIndex(t)].name; },
      performer: function (i, t) {
        var routes = routesFor(siteIndex(t));
        var u = (dragging && dragging.route === i) ? dragging.u : routeU(i, t);
        return pointAt(routes[i], u);
      },
      routeU: routeU,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: contours and routes lift on a slow sine of about
  // 0.035 Hz, performers travel at about 0.02 of a route per
  // second, tone rings expand at 0.5 Hz, all well under the 14 Hz
  // ceiling. Guarded so node-canvas QA (no requestAnimationFrame)
  // still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
