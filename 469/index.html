<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Blackout</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#E3D5BC; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  // Palette: the five prompt colors and nothing else. The fissure glow is
  // the fist red at half alpha; groove lines on the fist are the earth
  // color at low alpha, so no sixth color ever appears.
  var GROUND = '#E3D5BC';  // muted beige field
  var EARTH = '#2A2118';   // cracked dark earth, also the crack lines
  var RED = '#D9261C';     // the fist, the only red
  var BLACK = '#1A1A1A';   // skyline silhouette
  var LIT = '#F2C14E';     // lit windows

  var LOOP = 48;      // three acts of 16s: rise, hold, sink
  var PHASE0 = 24;    // fixed pre-roll: mid-hold, fist at full height

  // Seeded RNG (mulberry32). Used once, at load, to fix the fissure paths.
  // The cracks are a property of the seed, never of Math.random, so every
  // load and every QA render agree byte for byte.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Fissures: jagged polylines radiating from the fist's base, stored as
  // cumulative points in unit space (multiples of S) relative to the base.
  // Angles fan across the downward hemisphere and out to both sides, so
  // the cracks spread over the dark earth and lick onto the beige at the
  // mound's shoulders. A few cracks branch once, halfway out.
  var cracks = [];
  (function buildCracks() {
    var rng = mulberry32(469);
    var baseAngles = [-0.42, 0.18, 0.72, 1.18, 1.62, 2.05, 2.62, 3.05, 3.55, 4.05, 4.62, 5.15, 5.72, 6.10];
    for (var i = 0; i < baseAngles.length; i++) {
      var ang = baseAngles[i] + (rng() - 0.5) * 0.22;
      var steps = 6 + Math.floor(rng() * 6);
      var stepLen = 0.030 + rng() * 0.016;
      var pts = [[0, 0]], x = 0, y = 0, a = ang;
      for (var j = 0; j < steps; j++) {
        a += (rng() - 0.5) * 0.62;
        // gentle downward bias: the cracks creep across the ground plane
        a += (Math.PI / 2 - a) * 0.06;
        x += Math.cos(a) * stepLen;
        y += Math.sin(a) * stepLen * 0.72;
        if (y < -0.045) y = -0.045; // never climb the fist: stay on the ground
        pts.push([x, y]);
      }
      cracks.push(pts);
      // one branch on the longer cracks
      if (steps >= 9 && rng() > 0.35) {
        var mid = pts[Math.floor(steps / 2)];
        var bx = mid[0], by = mid[1], ba = ang + (rng() > 0.5 ? 0.7 : -0.7);
        var bpts = [[bx, by]];
        var bsteps = 3 + Math.floor(rng() * 3);
        for (var k = 0; k < bsteps; k++) {
          ba += (rng() - 0.5) * 0.6;
          bx += Math.cos(ba) * stepLen * 0.9;
          by += Math.sin(ba) * stepLen * 0.65;
          bpts.push([bx, by]);
        }
        cracks.push(bpts);
      }
    }
  })();

  function smooth(x) { return x * x * (3 - 2 * x); }

  // Loop state from loop time t (seconds).
  function liftAt(t) {
    var lt = t % LOOP;
    if (lt < 16) return smooth(lt / 16);          // act 1: rise
    if (lt < 32) return 1;                        // act 2: hold
    return 1 - smooth((lt - 32) / 16);            // act 3: sink
  }

  function drawSkyline(S) {
    var yb = 0.36 * H; // baseline of the silhouette band
    ctx.fillStyle = BLACK;
    // grounding strip the whole band stands on
    ctx.fillRect(0, yb - 0.012 * H, W, 0.012 * H);
    // left: factory block and two smokestacks
    ctx.fillRect(0.025 * W, yb - 0.052 * H, 0.185 * W, 0.052 * H);
    ctx.fillRect(0.055 * W, yb - 0.205 * H, 0.024 * W, 0.205 * H);
    ctx.fillRect(0.050 * W, yb - 0.218 * H, 0.034 * W, 0.016 * H);
    ctx.fillRect(0.118 * W, yb - 0.165 * H, 0.028 * W, 0.165 * H);
    ctx.fillRect(0.112 * W, yb - 0.178 * H, 0.040 * W, 0.016 * H);
    ctx.fillRect(0.165 * W, yb - 0.105 * H, 0.020 * W, 0.105 * H);
    // center: three leaning utility poles with crossarms and sagging wires
    var poles = [
      { x: 0.375 * W, lean: -0.010 * W, top: yb - 0.148 * H },
      { x: 0.470 * W, lean: 0.012 * W, top: yb - 0.158 * H },
      { x: 0.565 * W, lean: -0.006 * W, top: yb - 0.142 * H }
    ];
    ctx.strokeStyle = BLACK;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(2.5, 0.006 * S);
    var tops = [];
    for (var i = 0; i < poles.length; i++) {
      var p = poles[i], tx = p.x + p.lean;
      ctx.beginPath(); ctx.moveTo(p.x, yb); ctx.lineTo(tx, p.top); ctx.stroke();
      // crossarm near the top, following the lean
      ctx.beginPath();
      ctx.moveTo(tx - 0.030 * W, p.top + 0.012 * H);
      ctx.lineTo(tx + 0.030 * W, p.top + 0.004 * H);
      ctx.stroke();
      tops.push([tx, p.top + 0.008 * H]);
    }
    // sagging wires between pole tops, and dropping off both ends
    ctx.lineWidth = Math.max(1.5, 0.0035 * S);
    function wire(x1, y1, x2, y2, sag) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo((x1 + x2) / 2, Math.max(y1, y2) + sag, x2, y2);
      ctx.stroke();
    }
    wire(tops[0][0], tops[0][1], tops[1][0], tops[1][1], 0.034 * H);
    wire(tops[1][0], tops[1][1], tops[2][0], tops[2][1], 0.030 * H);
    wire(0.300 * W, yb - 0.100 * H, tops[0][0], tops[0][1], 0.012 * H);
    wire(tops[2][0], tops[2][1], 0.638 * W, yb - 0.095 * H, 0.012 * H);
    // right: small houses on the baseline
    var houses = [
      { x: 0.665 * W, w: 0.095 * W, h: 0.058 * H, rh: 0.036 * H },
      { x: 0.775 * W, w: 0.105 * W, h: 0.070 * H, rh: 0.042 * H },
      { x: 0.895 * W, w: 0.085 * W, h: 0.052 * H, rh: 0.032 * H }
    ];
    for (var j = 0; j < houses.length; j++) {
      var hs = houses[j];
      ctx.fillStyle = BLACK;
      ctx.fillRect(hs.x, yb - hs.h, hs.w, hs.h);
      ctx.beginPath();
      ctx.moveTo(hs.x - 0.008 * W, yb - hs.h);
      ctx.lineTo(hs.x + hs.w / 2, yb - hs.h - hs.rh);
      ctx.lineTo(hs.x + hs.w + 0.008 * W, yb - hs.h);
      ctx.closePath(); ctx.fill();
    }
    return houses;
  }

  function drawWindows(houses, t) {
    // a few lit windows; the middle one flickers, the others burn steady
    var wins = [
      { h: 0, dx: 0.030, dy: 0.020, a: 0.95 },
      { h: 1, dx: 0.058, dy: 0.028, a: -1 },  // flicker
      { h: 1, dx: 0.022, dy: 0.030, a: 0.70 },
      { h: 2, dx: 0.034, dy: 0.018, a: 0.85 }
    ];
    var ww = 0.013 * W, wh = 0.017 * H, yb = 0.36 * H;
    for (var i = 0; i < wins.length; i++) {
      var wn = wins[i], hs = houses[wn.h];
      var alpha = wn.a;
      if (alpha < 0) {
        // flicker: full at the fixed first frame (t = 24), dipping after
        alpha = 0.62 + 0.38 * Math.cos((t - 24) * Math.PI * 2 / 2.3);
        if (Math.floor(t * 9) % 17 === 0) alpha *= 0.45; // occasional dropout
      }
      ctx.fillStyle = LIT;
      ctx.globalAlpha = Math.max(0.15, Math.min(1, alpha));
      ctx.fillRect(hs.x + wn.dx * W, yb - hs.h + wn.dy * H, ww, wh);
    }
    ctx.globalAlpha = 1;
  }

  function drawFist(cx, topY, S) {
    var u = S;
    ctx.save();
    ctx.translate(cx, topY);
    // silhouette: a chunky mass, wider than it is tall above the wrist,
    // with a nearly flat top: four SHALLOW knuckle bumps, because the
    // fingers are curled over, not standing up. Deep scallops read as a
    // glove; a clenched fist reads as weight.
    ctx.fillStyle = RED;
    ctx.beginPath();
    ctx.moveTo(-0.105 * u, 0.440 * u);
    ctx.lineTo(-0.168 * u, 0.290 * u);
    ctx.quadraticCurveTo(-0.198 * u, 0.200 * u, -0.196 * u, 0.110 * u);
    ctx.quadraticCurveTo(-0.195 * u, 0.055 * u, -0.185 * u, 0.034 * u);
    // shallow knuckle bumps across the top, middle two a touch higher
    ctx.quadraticCurveTo(-0.138 * u, 0.002 * u, -0.092 * u, 0.030 * u);
    ctx.quadraticCurveTo(-0.046 * u, -0.004 * u, 0.000 * u, 0.028 * u);
    ctx.quadraticCurveTo(0.046 * u, -0.004 * u, 0.092 * u, 0.030 * u);
    ctx.quadraticCurveTo(0.138 * u, 0.002 * u, 0.185 * u, 0.034 * u);
    ctx.quadraticCurveTo(0.195 * u, 0.055 * u, 0.196 * u, 0.110 * u);
    ctx.quadraticCurveTo(0.198 * u, 0.200 * u, 0.168 * u, 0.290 * u);
    ctx.lineTo(0.105 * u, 0.440 * u);
    ctx.closePath();
    ctx.fill();
    // knuckle band: short vertical grooves between the knuckles, ending
    // at the fold where the fingers curl over the palm
    ctx.strokeStyle = 'rgba(42,33,24,0.32)';
    ctx.lineWidth = Math.max(1.5, 0.008 * u);
    ctx.lineCap = 'round';
    var gx = [-0.092, 0.000, 0.092];
    for (var i = 0; i < gx.length; i++) {
      ctx.beginPath();
      ctx.moveTo(gx[i] * u, 0.038 * u);
      ctx.lineTo(gx[i] * u, 0.118 * u);
      ctx.stroke();
    }
    // the fold seam under the knuckle band
    ctx.strokeStyle = 'rgba(42,33,24,0.22)';
    ctx.beginPath();
    ctx.moveTo(-0.172 * u, 0.148 * u);
    ctx.quadraticCurveTo(0, 0.182 * u, 0.172 * u, 0.148 * u);
    ctx.stroke();
    // thumb: a thick mass laid diagonally across the curled fingers.
    // Same red as the fist, so only its grooves show: the long top edge
    // where it leaves the fingers, and the rounded tip at the lower
    // left. The heel carries no line: it merges into the palm.
    ctx.save();
    ctx.translate(-0.030 * u, 0.280 * u);
    ctx.rotate(-0.34);
    ctx.strokeStyle = 'rgba(42,33,24,0.42)';
    ctx.lineWidth = Math.max(1.5, 0.009 * u);
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.128 * u, 0.058 * u, 0, Math.PI * 0.80, Math.PI * 1.95);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(42,33,24,0.25)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.128 * u, 0.058 * u, 0, Math.PI * 0.55, Math.PI * 0.88);
    ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  // The earth's jagged top edge: a low mound heaped around the fist's
  // base, falling away to a rough line at the sides. Points come from a
  // fixed-seed stream, generated once per frame and shared by the fill
  // and the fissure clip, so the two always agree.
  function earthEdge() {
    var rng = mulberry32(1234);
    var seg = 56, pts = [];
    for (var i = 0; i <= seg; i++) {
      var fx = i / seg;
      var mound = Math.exp(-Math.pow((fx - 0.5) * 4.4, 2)) * 0.045 * H;
      pts.push([fx * W, 0.862 * H - mound + (rng() - 0.5) * 0.010 * H]);
    }
    return pts;
  }

  function earthPath(pts) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (var i = 0; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.lineTo(W, H);
    ctx.closePath();
  }

  function drawEarth(pts) {
    ctx.fillStyle = EARTH;
    earthPath(pts);
    ctx.fill();
  }

  // Paint one crack up to the revealed fraction of its length, in the
  // current stroke style. The walker is shared by all three passes.
  function strokeCrack(pts, cx, baseY, S, reveal) {
    var total = 0, j;
    for (j = 1; j < pts.length; j++) {
      total += Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]);
    }
    var budget = total * reveal;
    ctx.beginPath();
    ctx.moveTo(cx + pts[0][0] * S, baseY + pts[0][1] * S);
    for (j = 1; j < pts.length; j++) {
      var dx = pts[j][0] - pts[j - 1][0], dy = pts[j][1] - pts[j - 1][1];
      var segLen = Math.hypot(dx, dy);
      if (budget >= segLen) {
        ctx.lineTo(cx + pts[j][0] * S, baseY + pts[j][1] * S);
        budget -= segLen;
      } else {
        var f = segLen > 0 ? budget / segLen : 0;
        ctx.lineTo(cx + (pts[j - 1][0] + dx * f) * S, baseY + (pts[j - 1][1] + dy * f) * S);
        break;
      }
    }
    ctx.stroke();
  }

  function paintCracks(cx, baseY, S, reveal, glowAlpha) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var pass, i;
    // pass 0: the red glow, wide and faint
    ctx.strokeStyle = 'rgba(217,38,28,' + (glowAlpha * 0.5).toFixed(3) + ')';
    ctx.lineWidth = Math.max(2, 0.010 * S);
    for (i = 0; i < cracks.length; i++) strokeCrack(cracks[i], cx, baseY, S, reveal);
    // pass 1: the dark crack core
    ctx.strokeStyle = EARTH;
    ctx.lineWidth = Math.max(1.2, 0.0045 * S);
    for (i = 0; i < cracks.length; i++) strokeCrack(cracks[i], cx, baseY, S, reveal);
    // pass 2: a thin bright glow line along the core
    ctx.strokeStyle = 'rgba(217,38,28,' + glowAlpha.toFixed(3) + ')';
    ctx.lineWidth = Math.max(1.2, 0.0035 * S);
    for (i = 0; i < cracks.length; i++) strokeCrack(cracks[i], cx, baseY, S, reveal);
  }

  function drawCracks(cx, baseY, S, reveal, glowAlpha, edgePts) {
    if (reveal <= 0.01) return;
    // The fissures live in the earth and nowhere else: clip them to the
    // earth's own outline. They can never streak across the fist or
    // float on the beige field; they radiate from the fist's base
    // across the mound face and out through the dark ground.
    ctx.save();
    earthPath(edgePts);
    ctx.clip();
    paintCracks(cx, baseY, S, reveal, glowAlpha);
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var S = Math.min(W, H);
    var lift = liftAt(t);
    var lt = t % LOOP;

    // field
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // skyline band, behind everything
    var houses = drawSkyline(S);
    drawWindows(houses, t);

    // fist: wrist buried at 0.92H, top reaching mid-frame at full lift;
    // sinks 0.30H back into the earth as lift falls
    var cx = W / 2;
    var wristY = 0.92 * H + (1 - lift) * 0.30 * H;
    var fistTop = wristY - 0.440 * S;
    drawFist(cx, fistTop, S);

    // earth over the wrist and the sunken fist
    var edgePts = earthEdge();
    drawEarth(edgePts);

    // fissures: reveal tracks the climb; glow breathes faintly in the hold
    var pulse = (lt >= 16 && lt < 32) ? 0.46 + 0.14 * Math.sin((lt - 16) * Math.PI * 2 / 8) : 0.5;
    var glow = lift * pulse;
    drawCracks(cx, 0.852 * H, S, lift, glow, edgePts);
  }

  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loopFn = function (now) {
      draw(PHASE0 + (now - start) / 1000);
      requestAnimationFrame(loopFn);
    };
    requestAnimationFrame(loopFn);
  }
})();
</script>
</body>
</html>
