<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Hands, One Camera</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e0d0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (prompt only, no other color).
  var CREAM = '#e8e0d0';
  var CHARCOAL = '#2a2a30';
  var GOLD = '#d9a441';
  var SKIN1 = '#f2ead8';
  var SKIN2 = '#e0c4a0';
  var CLOTH1 = '#4a5a7a';
  var CLOTH2 = '#6b4a3a';

  var LOOP = 24;          // sway loop, seconds; every sine runs on lt = t % LOOP
  var SCENE_LOOP = 12;    // miniature scene loop, divides LOOP
  var TAU = 1.5;          // spring-return time constant after drag release

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1486000);
  // Per-figure seeded phases for the miniature scene (bob + mouth).
  var FIG_PHASE = [];
  for (var i = 0; i < 4; i++) { FIG_PHASE.push(rnd() * 2 * Math.PI); }

  // Viewport sizing: Visual Viewport API first, window fallback.
  var W = 0, H = 0, PHONE = false;
  function sizeViewport() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w, h;
    if (vv && vv.width && vv.height) { w = vv.width; h = vv.height; }
    else { w = window.innerWidth; h = window.innerHeight; }
    W = w; H = h;
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : w;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : h;
    var minDim = Math.min(sw, sh);
    if (minDim < 700) { PHONE = true; }
    else if (h > w * 1.15) { PHONE = true; }
    else { PHONE = false; }
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
  }

  // Drag state: closed-form over the recorded event list.
  // segments: [{t0, t1, off0, rate}] — offset decays exponentially after release.
  var dragEvents = [];   // {kind:'down'|'move'|'up', t, x}
  var dragging = false;
  var dragStartX = 0, dragStartOff = 0, dragOff = 0;
  var lastRelease = null; // {t, off}

  function offsetAt(t) {
    // Walk recorded events to compute the drag offset at time t.
    var off = 0, rel = null, dragX0 = 0, dragOff0 = 0, isDown = false;
    for (var k = 0; k < dragEvents.length; k++) {
      var e = dragEvents[k];
      if (e.t > t) { break; }
      if (e.kind === 'down') { isDown = true; dragX0 = e.x; dragOff0 = off; rel = null; }
      else if (e.kind === 'move' && isDown) { off = dragOff0 + (e.x - dragX0); }
      else if (e.kind === 'up') { isDown = false; rel = { t: e.t, off: off }; }
    }
    if (!isDown && rel) { off = rel.off * Math.exp(-(t - rel.t) / TAU); }
    return off;
  }
  function clampOff(v, limit) { return Math.max(-limit, Math.min(limit, v)); }

  function pointerDown(x, y, t) {
    // Only grabs that start on (or near) the camera box shift it.
    var g = geometry();
    if (!g) { return; }
    if (x >= g.camX - g.camW * 0.75 && x <= g.camX + g.camW * 0.75 &&
        y >= g.camY - g.camH * 0.9 && y <= g.camY + g.camH * 0.9) {
      dragging = true;
      dragStartX = x;
      dragStartOff = offsetAt(t);
      dragEvents.push({ kind: 'down', t: t, x: x });
    }
  }
  function pointerMove(x, t) {
    if (!dragging) { return; }
    dragEvents.push({ kind: 'move', t: t, x: x });
    dragOff = offsetAt(t);
  }
  function pointerUp(t) {
    if (!dragging) { return; }
    dragging = false;
    dragEvents.push({ kind: 'up', t: t, x: 0 });
    lastRelease = { t: t, off: offsetAt(t) };
  }

  function geometry() {
    if (!W || !H) { return null; }
    var u = Math.min(W, H);
    var camW = Math.min(W * 0.34, u * 0.52);
    var camH = camW * 0.62;
    return { camW: camW, camH: camH, camX: W / 2, camY: H * 0.30, u: u };
  }

  function disc(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  // Draw one hand: a palm bar from the frame edge to the camera side,
  // with three finger bumps at the camera end. Grip scales thickness.
  function drawHand(x0, x1, yTop, thick, skin) {
    var y = yTop;
    var h = thick;
    var xA = Math.min(x0, x1), xB = Math.max(x0, x1);
    rect(xA, y, xB - xA, h, skin);
    // Finger bumps at the camera end.
    var fw = Math.max(6, h * 0.9);
    var fx = (x1 > x0) ? xB - fw : xA;
    for (var f = 0; f < 3; f++) {
      rect(fx, y - h * 0.28 + f * h * 0.42, fw, h * 0.30, skin);
    }
  }

  function draw(t) {
    if (!W || !H) { sizeViewport(); }
    var g = geometry();
    var lt = t % LOOP;                       // loop-local time: all sines live here
    var st = lt % SCENE_LOOP;                // miniature scene time
    var sway = Math.sin(2 * Math.PI * lt / LOOP);
    var swayX = sway * W * 0.03;
    var swayY = Math.sin(2 * Math.PI * lt / LOOP) * H * 0.008;

    // Drag offset, clamped to a sane range so the camera never leaves the frame.
    var limit = W * 0.30;
    var off = clampOff(offsetAt(t), limit);
    var camX = g.camX + swayX + off;
    var camY = g.camY + swayY;

    // Grip alternation: values sum to a constant (1), so the camera is
    // never held by one pair alone and never dropped.
    var gripL = 0.5 + 0.25 * Math.sin(2 * Math.PI * lt / LOOP);
    var gripR = 1 - gripL;

    // Ground.
    rect(0, 0, W, H, CREAM);

    // Camera: charcoal box, gold lens, small charcoal pupil dot.
    var cw = g.camW, ch = g.camH;
    var left = camX - cw / 2, top = camY - ch / 2;
    rect(left, top, cw, ch, CHARCOAL);
    // Viewfinder bump on top.
    rect(camX - cw * 0.14, top - ch * 0.16, cw * 0.28, ch * 0.16, CHARCOAL);
    disc(camX, camY, cw * 0.22, GOLD);
    disc(camX, camY, cw * 0.10, CHARCOAL);

    // Hands: two pairs at camera height, entering from both edges.
    // Left pair reaches from x=0 to the camera's left edge (stretches as the
    // camera moves right); right pair mirrors. Thickness follows grip.
    var base = Math.max(10, g.u * 0.030);
    var gap = ch * 0.34;
    // Left pair (skin tones alternate).
    drawHand(0, left, camY - gap - base * (0.6 + gripL), base * (0.6 + gripL), SKIN1);
    drawHand(0, left, camY + gap - base * (0.6 + gripL) * 0.5, base * (0.6 + gripL), SKIN2);
    // Right pair.
    drawHand(W, left + cw, camY - gap - base * (0.6 + gripR), base * (0.6 + gripR), SKIN2);
    drawHand(W, left + cw, camY + gap - base * (0.6 + gripR) * 0.5, base * (0.6 + gripR), SKIN1);

    // Miniature scene below, seen as if through the lens: a framed panel
    // with four seated figures; the speaker cycles every 3 s of scene time.
    var sw = Math.min(W * 0.72, g.u * 1.05);
    var sh = sw * 0.42;
    var sx = W / 2 - sw / 2, sy = H * 0.56;
    rect(sx, sy, sw, sh, CHARCOAL);
    var pad = sw * 0.04;
    rect(sx + pad, sy + pad, sw - pad * 2, sh - pad * 2, CREAM);
    var innerW = sw - pad * 2, innerH = sh - pad * 2;
    var innerX = sx + pad, innerY = sy + pad;
    // Bench line.
    rect(innerX + innerW * 0.06, innerY + innerH * 0.72, innerW * 0.88, Math.max(2, innerH * 0.02), CLOTH2);
    var speaker = Math.floor(st / 3) % 4;
    var nFig = 4;
    for (var i = 0; i < nFig; i++) {
      var fx = innerX + innerW * (0.14 + i * 0.24);
      var fw = innerW * 0.13;
      var fh = innerH * 0.46;
      var fy = innerY + innerH * 0.72 - fh;
      var cloth = (i % 2 === 0) ? CLOTH1 : CLOTH2;
      // Torso.
      rect(fx, fy, fw, fh, cloth);
      // Head with loop-local bob; speaker tilts and talks.
      var bob = Math.sin(2 * Math.PI * lt / LOOP + FIG_PHASE[i]) * innerH * 0.02;
      var isSpk = (i === speaker);
      var tilt = isSpk ? 0.10 * Math.sin(2 * Math.PI * st / 3) : 0.05;
      var hx = fx + fw / 2, hy = fy - innerH * 0.10 + bob;
      disc(hx, hy, innerH * 0.10, SKIN1);
      // Eye dot (filled rect, node-canvas safe).
      rect(hx - innerH * 0.02, hy - innerH * 0.01, Math.max(2, innerH * 0.02), Math.max(2, innerH * 0.02), CHARCOAL);
      // Mouth line: speaker's shifts and widens, listeners hold still.
      var mw = innerH * (isSpk ? (0.07 + 0.03 * Math.sin(2 * Math.PI * st / 1.5)) : 0.06);
      rect(hx - mw / 2, hy + innerH * 0.05 + tilt * innerH * 0.10, mw, Math.max(2, innerH * 0.015), CHARCOAL);
      // Seated leg: horizontal thigh + vertical shin.
      rect(fx, fy + fh * 0.72, fw * 1.35, fh * 0.16, cloth);
      rect(fx + fw * 1.35 - fw * 0.16, fy + fh * 0.72, fw * 0.16, innerH * 0.72 - (fy + fh * 0.72 - innerY) + fh * 0.0, cloth);
    }

    // Pin canvas size in CSS pixels (phone house rule).
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // Real pointer wiring (guarded so the QA renderer, which has no canvas
  // events, simply never fires them).
  var lastT = 0;
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (ev) {
      pointerDown(ev.clientX || 0, ev.clientY || 0, lastT);
    });
    canvas.addEventListener('pointermove', function (ev) {
      pointerMove(ev.clientX || 0, lastT);
    });
    canvas.addEventListener('pointerup', function () { pointerUp(lastT); });
    canvas.addEventListener('pointercancel', function () { pointerUp(lastT); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    var onResize = function () { sizeViewport(); draw(lastT); };
    window.addEventListener('resize', onResize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  }

  // Probe surface for the QA harness.
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      pointerDown: pointerDown,
      pointerMove: pointerMove,
      pointerUp: pointerUp,
      offsetAt: offsetAt,
      loop: LOOP
    };
  }

  // Frame one: synchronous, constant phase.
  sizeViewport();
  draw(0);

  // rAF loop, plain function declaration, typeof-guarded.
  var startMs = null;
  function loop(ts) {
    if (startMs === null) { startMs = ts; }
    var t = (ts - startMs) / 1000;
    lastT = t;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
