<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subharchord</title>
<style>
html, body { margin: 0; padding: 0; background: #146666; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a turquoise Subharchord control panel seen straight on, edge to
   edge, like the instrument is looking at you. Eight chunky German-labelled
   toggle switches summon subharmonic drone stacks; three filter sliders sit
   below. A ghostly face smudge haunts the glass above the panel. The viewer
   flips the switches; switching is the instrument's only gesture. */
var TAU = Math.PI * 2;
var GROUND = '#146666';
var PANEL = '#1B7F7E';
var PANEL_DARK = '#146666';
var PANEL_LINE = 'rgba(20,60,60,0.55)';
var CREAM = '#F2EAD8';
var CREAM_DIM = '#D8CDB2';
var BAT = '#141414';
var SLOT = '#0E3A3A';
var LAMP_ON = '#F5B942';
var LAMP_OFF = '#3A2E1E';
var GLASS = '#0F4A4C';
var PLATE = '#0D2E2E';
var PLATE_LINE = 'rgba(242,234,216,0.30)';
var TITLE_INK = '#F2EAD8';
var HINT_INK = '#C9BFA8';
var FRAME_T = 60.0;        /* fixed phase for frame one */
var SWITCHES = [
  { label: 'OBOE',           f: 220.0 },
  { label: 'FRANZ-KRUMMHORN', f: 174.6 },
  { label: 'FAGOTT',         f: 110.0 },
  { label: 'TROMP',          f: 146.8 },
  { label: 'POSAUNE',        f: 98.0 },
  { label: 'KLARON',         f: 196.0 },
  { label: 'SAX',            f: 164.8 },
  { label: 'KORNETT',        f: 207.7 }
];
var SLIDERS = [
  { label: 'TIEFE', v: 0.62 },
  { label: 'MITTE', v: 0.45 },
  { label: 'HÖHE',  v: 0.30 }
];
/* Fixed first frame: OBOE, FAGOTT and POSAUNE are on, the rest off. */
var switchOn = [true, false, true, false, true, false, false, false];
var switchAnim = [1, 0, 1, 0, 1, 0, 1, 0];   /* 1 = bat up (on), 0 = bat down */

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);

    return ((t ^ t >>> 14) >>> 0) / 4294967296;

}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {

  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var soundOn = false;
var audioCtx = null;
var stacks = {};   /* per-switch audio nodes, built lazily */
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
var switchRects = [];
var sliderRects = [];
var pointerDown = false;
var lastFlipped = -1;
/* ---- seeded ghost: one indistinct smudge in the glass, no features ---- */
var GHOST = (function () {
  var rng = mulberry32(1847);
  var i, blobs = [];
  for (i = 0; i < 5; i++) {
    blobs.push({
      x: 0.42 + rng() * 0.16,
      y: 0.18 + rng() * 0.55,
      rx: 0.05 + rng() * 0.05,
      ry: 0.10 + rng() * 0.16,
      a: 0.07 + rng() * 0.05

  }
  return blobs;
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';

  }
}
function layout() {
  var pad = isPhone ? 14 : 22;
  var glassH = Math.round(VH * 0.15);
  var bottomBar = (isPhone ? 11 : 12) + 14 + 24;   /* hint/sound plate height + margins */
  var sliderBandH = isPhone ? 168 : 108;
  var sliderTop = VH - bottomBar - sliderBandH;
  var swArea = {
    x: pad, y: glassH + pad,

  var rows = isPhone ? 8 : 4;
  var cellW = swArea.w / cols;
  var cellH = swArea.h / rows;

  switchRects = [];

    col = isPhone ? 0 : (i % 2);
    row = isPhone ? i : Math.floor(i / 2);

      x: swArea.x + col * cellW,
      y: swArea.y + row * cellH,
      w: cellW, h: cellH,
      slotX: swArea.x + col * cellW + 8,
      slotY: swArea.y + row * cellH + cellH / 2 - 26,
      slotW: 30, slotH: 52

  sliderRects = [];
  var slArea = { x: pad, y: sliderTop + 6, w: VW - pad * 2, h: sliderBandH - 12 };

        x: slArea.x, y: slArea.y + i * (slArea.h / 3),
        w: slArea.w, h: slArea.h / 3,
        trackX: slArea.x + 8, trackW: slArea.w - 16,
        trackY: slArea.y + i * (slArea.h / 3) + 34

    }
  } else {
    for (i = 0; i < 3; i++) {
      sliderRects.push({
        x: slArea.x + i * (slArea.w / 3), y: slArea.y,
        w: slArea.w / 3, h: slArea.h,

function drawGlass(L) {

  for (i = 0; i < GHOST.length; i++) {
    b = GHOST[i];
    cx = b.x * VW; cy = b.y * L.glassH;
    rx = b.rx * VW; ry = b.ry * L.glassH;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(rx / ry, 1);
    g = ctx.createRadialGradient(0, 0, 0, 0, 0, ry);
    g.addColorStop(0, 'rgba(226,220,205,' + b.a.toFixed(4) + ')');
    g.addColorStop(1, 'rgba(226,220,205,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(ry, 0);
    ctx.arc(0, 0, ry, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  /* faint diagonal glare across the glass */
  ctx.save();
  ctx.strokeStyle = 'rgba(242,234,216,0.07)';
  ctx.lineWidth = Math.max(6, VW * 0.012);
  ctx.beginPath();
  ctx.moveTo(VW * 0.62, -4);
  ctx.lineTo(VW * 0.86, L.glassH + 4);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = PANEL_LINE;
  ctx.fillRect(0, L.glassH - 1, VW, 2);

function drawSwitch(i, t) {

  var S = SWITCHES[i];
  var on = switchOn[i];
  var anim = switchAnim[i];
  /* bat angle: up when on, down when off, snapping between */
  var ang = (anim - 0.5) * 1.1;   /* radians from vertical */
  var cx = r.slotX + r.slotW / 2;
  var cy = r.slotY + r.slotH / 2;
  var lampPulse = on ? (0.75 + 0.25 * Math.sin(TAU * t / 6 + i * 1.3)) : 0;
  /* slot */
  ctx.fillStyle = SLOT;
  ctx.fillRect(r.slotX, r.slotY, r.slotW, r.slotH);
  ctx.strokeStyle = 'rgba(242,234,216,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(r.slotX + 0.5, r.slotY + 0.5, r.slotW - 1, r.slotH - 1);
  /* bat: a thick black lever pivoting at the slot centre */
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  ctx.fillStyle = BAT;
  ctx.fillRect(-5, -24, 10, 48);
  ctx.fillStyle = 'rgba(242,234,216,0.18)';
  ctx.fillRect(-5, -24, 3, 48);
  ctx.restore();
  /* pivot screw */
  ctx.fillStyle = '#2A2A2A';
  ctx.beginPath();
  ctx.moveTo(cx + 4, cy);
  ctx.arc(cx, cy, 4, 0, TAU);
  ctx.fill();
  /* lamp */
  var lampX = r.slotX + r.slotW + 16;
  var lampY = cy - 14;
  if (on) {
    ctx.fillStyle = rgba(LAMP_ON, 0.22 * lampPulse);
    ctx.beginPath();
    ctx.moveTo(lampX + 11, lampY);
    ctx.arc(lampX, lampY, 11, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = on ? LAMP_ON : LAMP_OFF;
  ctx.beginPath();
  ctx.moveTo(lampX + 5, lampY);
  ctx.arc(lampX, lampY, 5, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(242,234,216,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(lampX + 5, lampY);
  ctx.arc(lampX, lampY, 5, 0, TAU);
  ctx.stroke();
  /* label, cream, never translated */
  var fs = isPhone ? 15 : 17;
  ctx.font = 'bold ' + fs + 'px monospace';
  while (fs > 9 && ctx.measureText(S.label).width > r.w - (r.slotW + 44)) {
    fs -= 1;
    ctx.font = 'bold ' + fs + 'px monospace';
  }
  ctx.fillStyle = CREAM;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(S.label, r.slotX + r.slotW + 30, cy + 8);
}
function drawSlider(i) {
  var r = sliderRects[i];
  var S = SLIDERS[i];
  var fs = isPhone ? 12 : 13;
  ctx.font = 'bold ' + fs + 'px monospace';
  ctx.fillStyle = CREAM_DIM;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(S.label, r.trackX, r.y + 6);
  /* track */
  ctx.fillStyle = SLOT;
  ctx.fillRect(r.trackX, r.trackY, r.trackW, 8);
  ctx.strokeStyle = 'rgba(242,234,216,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(r.trackX + 0.5, r.trackY + 0.5, r.trackW - 1, 7);
  /* fill to the knob */
  var kx = r.trackX + S.v * r.trackW;
  ctx.fillStyle = CREAM;
  ctx.fillRect(r.trackX, r.trackY + 1, Math.max(2, kx - r.trackX), 6);
  /* knob */
  ctx.fillStyle = '#E8E0CC';
  ctx.fillRect(kx - 5, r.trackY - 7, 10, 22);
  ctx.strokeStyle = '#141414';
  ctx.lineWidth = 1;
  ctx.strokeRect(kx - 5.5, r.trackY - 7.5, 11, 23);

function drawScrews(L) {
  var pts = [

    [L.pad, L.sliderTop - 10], [VW - L.pad, L.sliderTop - 10]
  ];
  var i;
  for (i = 0; i < pts.length; i++) {
    ctx.fillStyle = 'rgba(20,60,60,0.8)';
    ctx.beginPath();
    ctx.moveTo(pts[i][0] + 5, pts[i][1]);
    ctx.arc(pts[i][0], pts[i][1], 5, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(242,234,216,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pts[i][0] - 3, pts[i][1]);

  ctx.textBaseline = 'top';

  while (titlePx > 9 && ctx.measureText('Subharchord').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Subharchord').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 01').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;

  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Subharchord', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 01', plateX + 14, plateY + 7 + titlePx + 3);

  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;

  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);

  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);

/* ---- sound: subharmonic divide-down stacks, built only on gesture ---- */
