<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tarp &amp; Tempo</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2B2E33; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  // Seeded PRNG (mulberry32) - never Math.random, so every load is identical.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1299);

  // Weathered-panel patches: fixed seeded layout (fraction across, fraction down, size fraction).
  var patches = [];
  for (var i = 0; i < 5; i++) {
    patches.push({
      fx: 0.15 + rnd() * 0.7,
      fy: 0.12 + rnd() * 0.72,
      s: 0.055 + rnd() * 0.05
    });
  }

  // Drag-gust event list: {t, vx}. Closed-form decay; never frame-integrated.
  var gusts = [];
  var dragging = false, lastX = 0;

  function size() {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
  }

  // Shared wind field: slow sine gusts, closed form in t.
  function windBase(t) {
    return 0.5 * Math.sin(2 * Math.PI * t / 13)
         + 0.3 * Math.sin(2 * Math.PI * t / 7 + 1.3)
         + 0.2 * Math.sin(2 * Math.PI * t / 23 + 2.1);
  }

  // Drag-gust contribution at time t, optionally delayed by `delay` seconds
  // (the new panel answers a gust slightly later than the weathered one).
  function gustAt(t, delay) {
    var g = 0;
    for (var i = 0; i < gusts.length; i++) {
      var dt = t - delay - gusts[i].t;
      if (dt < 0) continue;
      g += gusts[i].vx * Math.exp(-dt / 1.5);
    }
    return g;
  }

  // Loop progress over the 45 s learning loop; the new panel converges toward
  // the weathered panel's parameters but never reaches them (the half-beat lag
  // is the point).
  function loopP(t) { return (t % 45) / 45; }

  // Billow displacement of a panel's centerline at height fraction f (0 top, 1 bottom).
  // panel: 'old' | 'new'. Closed form in t and f only.
  function billow(panel, f, t) {
    var p = loopP(t);
    var amp, period, lag;
    if (panel === 'old') { amp = 0.035; period = 9; lag = 0; }
    else {
      amp = 0.018 + (0.032 - 0.018) * p;
      period = 12 + (9.6 - 12) * p;
      lag = 1.2 - (1.2 - 0.45) * p;
    }
    var tt = t - lag;
    var wave = 0.6 * Math.sin(2 * Math.PI * (tt / period) + f * 2.2)
             + 0.4 * Math.sin(2 * Math.PI * (tt / (period * 0.61)) + f * 4.1 + 1.7);
    var disp = amp * W * Math.pow(f, 1.2) * wave;
    disp += (windBase(t) * 0.012 * W + gustAt(t, panel === 'new' ? 0.4 : 0) * 0.02) * Math.pow(f, 1.2);
    return disp;
  }

  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 2 * Math.PI);
    ctx.fill();
  }

  // Draw one panel. cxFrac: center as fraction of W; wFrac: width fraction.
  function drawPanel(panel, cxFrac, wFrac, t) {
    var cx = cxFrac * W;
    var w = wFrac * W;
    var y0 = 0.10 * H, y1 = 0.74 * H;
    var steps = 26;
    var i, f, y, d;

    // Main cloth body: left edge top to bottom, bottom edge, right edge
    // bottom to top. (An earlier pass traced only the bottom edge and let
    // closePath cut a diagonal across the panel.)
    ctx.beginPath();
    for (i = 0; i <= steps; i++) {
      f = i / steps; y = y0 + f * (y1 - y0); d = billow(panel, f, t);
      var lx = cx - w / 2 + d;
      if (i === 0) ctx.moveTo(lx, y); else ctx.lineTo(lx, y);
    }
    // Bottom edge: weathered frays with a zigzag, new hems clean.
    for (i = 0; i <= steps; i++) {
      f = i / steps; d = billow(panel, 1, t);
      var jag = (panel === 'old' && i % 2 === 1) ? -0.012 * H : 0;
      ctx.lineTo(cx - w / 2 + (w * i) / steps + d, y1 + jag);
    }
    // Right edge, bottom to top.
    for (i = steps; i >= 0; i--) {
      f = i / steps; y = y0 + f * (y1 - y0); d = billow(panel, f, t);
      ctx.lineTo(cx + w / 2 + d * 0.9, y);
    }
    ctx.closePath();
    ctx.fillStyle = panel === 'old' ? '#6E6A52' : '#AEB6B9';
    ctx.fill();

    // Fold shading: flat-alpha strips following the billow.
    var folds = [0.22, 0.5, 0.78];
    for (var k = 0; k < folds.length; k++) {
      var f0 = folds[k] - 0.05, f1 = folds[k] + 0.05;
      ctx.beginPath();
      for (i = 0; i <= steps; i++) {
        f = i / steps; y = y0 + f * (y1 - y0); d = billow(panel, f, t);
        var x = cx + (f0 - 0.5) * w + d;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      for (i = steps; i >= 0; i--) {
        f = i / steps; y = y0 + f * (y1 - y0); d = billow(panel, f, t);
        ctx.lineTo(cx + (f1 - 0.5) * w + d, y);
      }
      ctx.closePath();
      ctx.fillStyle = panel === 'old' ? 'rgba(20,22,16,0.16)' : 'rgba(60,70,78,0.14)';
      ctx.fill();
    }

    // Weathered patches: stitched squares, deforming with the billow.
    if (panel === 'old') {
      for (var pi = 0; pi < patches.length; pi++) {
        var pt = patches[pi];
        var py = y0 + pt.fy * (y1 - y0);
        var pd = billow(panel, pt.fy, t);
        var ps = pt.s * W;
        var px = cx + (pt.fx - 0.5) * w + pd - ps / 2;
        ctx.fillStyle = '#7C7F66';
        ctx.fillRect(px, py - ps / 2, ps, ps);
        ctx.strokeStyle = '#E8E0D0';
        ctx.lineWidth = Math.max(1, W * 0.0015);
        ctx.setLineDash([Math.max(3, W * 0.006), Math.max(3, W * 0.005)]);
        ctx.strokeRect(px, py - ps / 2, ps, ps);
        ctx.setLineDash([]);
      }
    }

    // New panel: clean hem strip, a thin band hugging the bottom edge.
    if (panel === 'new') {
      ctx.beginPath();
      for (i = 0; i <= steps; i++) {
        f = i / steps; d = billow(panel, f, t);
        var hx = cx - w / 2 + d;
        if (i === 0) ctx.moveTo(hx, y1 - 0.018 * H); else ctx.lineTo(hx, y1 - 0.018 * H);
      }
      for (i = steps; i >= 0; i--) {
        f = i / steps; d = billow(panel, f, t);
        ctx.lineTo(cx + w / 2 + d * 0.9, y1);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fill();
    }

    return { cx: cx, w: w, y0: y0, y1: y1 };
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.clearRect(0, 0, W, H);

    // Storm-sky ground.
    ctx.fillStyle = '#2B2E33';
    ctx.fillRect(0, 0, W, H);

    // Rope line across the bottom third, slight sag, behind the panels.
    ctx.strokeStyle = '#8A6F4D';
    ctx.lineWidth = Math.max(2, W * 0.004);
    ctx.beginPath();
    ctx.moveTo(0, 0.68 * H);
    ctx.quadraticCurveTo(0.5 * W, 0.705 * H, W, 0.68 * H);
    ctx.stroke();
    dot(0.20 * W, 0.691 * H, Math.max(2, W * 0.004), '#8A6F4D');
    dot(0.80 * W, 0.691 * H, Math.max(2, W * 0.004), '#8A6F4D');

    var oldP = drawPanel('old', 0.20, 0.26, t);
    var newP = drawPanel('new', 0.80, 0.26, t);

    // Moire shimmer in the gap: peaks when the two silhouettes align.
    var midF = 0.55;
    var dOld = billow('old', midF, t);
    var dNew = billow('new', midF, t);
    var align = 1 - Math.min(1, Math.abs(dOld - dNew) / (0.05 * W));
    var alpha = 0.04 + 0.10 * align;
    ctx.strokeStyle = 'rgba(216,222,221,' + alpha.toFixed(3) + ')';
    ctx.lineWidth = Math.max(1, W * 0.0012);
    var gapL = oldP.cx + oldP.w / 2 + 0.01 * W;
    var gapR = newP.cx - newP.w / 2 - 0.01 * W;
    for (var li = 0; li < 9; li++) {
      var gy = 0.16 * H + li * 0.065 * H;
      ctx.beginPath();
      ctx.moveTo(gapL, gy);
      ctx.lineTo(gapR, gy + 0.03 * H);
      ctx.stroke();
    }
  }

  function pos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }

  function onDown(e) {
    var p = pos(e);
    dragging = true; lastX = p.x;
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pos(e);
    var vx = p.x - lastX;
    if (Math.abs(vx) > 0.5) {
      gusts.push({ t: curT, vx: vx });
      if (gusts.length > 40) gusts.shift();
    }
    lastX = p.x;
  }
  function onUp() { dragging = false; }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);

  var curT = 0;
  var started = false;
  var T0 = 0;

  // Plain function declaration (not a named function expression): the rAF
  // loop must exist as a callable binding before requestAnimationFrame runs.
  function loop(ts) {
    if (!started) { started = true; T0 = ts; }
    curT = (ts - T0) / 1000;
    draw(curT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }

  size();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { size(); draw(curT); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { size(); draw(curT); });
  }

  // Boot flag: the synchronous first frame draws at exactly t = 0.
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
