<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanguine Stage</title>
<style>
  html, body { margin: 0; padding: 0; background: #100E0D; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');

  /* Seeded PRNG (mulberry32). No Math.random anywhere. */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1333000);

  /* Seeded layout jitter, fixed at load. */
  var J = [];
  for (var i = 0; i < 40; i++) { J.push(rng()); }

  /* Piece state: closed-form functions of piece time + recorded events. */
  var boot = true;          /* frame one = draw(0) exactly */
  var currentT = 0;
  var orbit = 0;            /* accumulated drag orbit, clamped */
  var dragging = false;
  var lastX = 0, lastY = 0;
  var downX = 0, downY = 0, downT = 0;
  var phraseStart = -100;   /* piano-touch phrase start (piece time) */
  var soundOn = false;      /* default silent, visible toggle */
  var actx = null;
  var pianoRect = { x: 0, y: 0, w: 0, h: 0 };
  var toggleRect = { x: 0, y: 0, w: 0, h: 0 };

  function viewport() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1280; h = 900; }
    return { w: w, h: h };
  }
  function isPhone(w, h) {
    try {
      if (typeof window !== 'undefined' && window.screen &&
          typeof window.screen.width === 'number') {
        var m = Math.min(window.screen.width, window.screen.height);
        if (m > 0) { return m < 700; }
      }
    } catch (e) {}
    return h > w * 1.15;
  }
  function size() {
    var v = viewport();
    cv.width = Math.max(1, Math.round(v.w));
    cv.height = Math.max(1, Math.round(v.h));
    cv.style.width = v.w + 'px';
    cv.style.height = v.h + 'px';
    draw(currentT);
  }

  function ellipse(x, y, rx, ry, fill) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function rect(x, y, w, h, fill) {
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
  }
  function smoothstep(a, b, x) {
    var u = (x - a) / (b - a);
    if (u < 0) { u = 0; } if (u > 1) { u = 1; }
    return u * u * (3 - 2 * u);
  }

  /* Performance window: every 90 s idle, lights shift, masks sway, then settle. */
  function perfEnv(t) {
    var c = t % 90;
    if (c < 60 || c > 78) { return 0; }
    return smoothstep(60, 64, c) * (1 - smoothstep(74, 78, c));
  }
  /* Phrase key-dip pattern: three notes at 0, 0.5, 1.0 s, each dipping 0.4 s. */
  function keyDip(phraseT, keyIndex) {
    if (phraseT < 0 || phraseT > 3.2) { return 0; }
    var on = phraseT - keyIndex * 0.5;
    if (on < 0 || on > 0.4) { return 0; }
    return Math.sin((on / 0.4) * Math.PI);
  }

  function draw(t) {
    var v = viewport();
    var W = v.w, H = v.h;
    var S = Math.min(W, H);
    var phone = isPhone(W, H);
    var cx = W / 2;
    var perf = perfEnv(t);
    /* Touch phrase (piano tap) and repeating performance phrase. */
    var touchPhrase = t - phraseStart;
    var perfPhrase = -1;
    if (perf > 0.05) { perfPhrase = ((t % 90) - 60) % 4; }

    /* Ground. */
    rect(0, 0, W, H, '#100E0D');
    rect(0, H * 0.86, W, H * 0.14, '#1A1714');
    /* Stage platform. */
    var platW = phone ? W * 0.92 : W * 0.78;
    var platX = cx - platW / 2;
    rect(platX, H * 0.82, platW, H * 0.045, '#221E1A');
    rect(platX, H * 0.82, platW, 2, '#2E2822');

    /* Orbit parallax factors per layer (drag orbits the camera). */
    var shBack = orbit * 10, shMid = orbit * 22, shFront = orbit * 38;

    /* ---- Back scaffold frame (grandfather-era heavy steel at base). ---- */
    var scL = cx - W * 0.38 + shBack, scR = cx + W * 0.38 + shBack;
    var scT = H * 0.10, scB = H * 0.82;
    var bar = Math.max(3, S * 0.012);
    rect(scL, scT, scR - scL, bar, '#141312');
    rect(scL, scT, bar, scB - scT, '#141312');
    rect(scR - bar, scT, bar, scB - scT, '#141312');
    /* Heavy base bars: grandfather-era steel. */
    rect(scL, scB - bar * 2.2, scR - scL, bar * 2.2, '#0B0A09');
    /* Inner uprights. */
    var inL = cx - W * 0.19 + shBack, inR = cx + W * 0.19 + shBack;
    rect(inL, scT, bar * 0.8, scB - scT, '#141312');
    rect(inR, scT, bar * 0.8, scB - scT, '#141312');
    /* Mid horizontal bar. */
    rect(scL, H * 0.46, scR - scL, bar * 0.7, '#141312');

    /* ---- Grow light bars (son-era) with flat-alpha glow, slow pulse. ---- */
    var lightYs = [H * 0.13, H * 0.30];
    var lightCols = ['#E8D5E0', '#E8D5E0'];
    for (var li = 0; li < 2; li++) {
      var ly = lightYs[li];
      var pulse = 0.55 + 0.25 * Math.sin(t * 0.8 + li * 1.7) + perf * 0.3;
      if (pulse > 1) { pulse = 1; }
      var lw = W * 0.30, lx = cx - lw / 2 + shMid;
      /* Glow: layered flat-alpha ellipses, never a gradient. */
      ellipse(cx + shMid, ly, lw * 0.62, H * 0.030, 'rgba(232,213,224,' + (0.10 * pulse).toFixed(3) + ')');
      ellipse(cx + shMid, ly, lw * 0.45, H * 0.020, 'rgba(232,213,224,' + (0.16 * pulse).toFixed(3) + ')');
      rect(lx, ly - 2, lw, 4, lightCols[li]);
      /* Light row brightens on piano touch / performance phrase. */
      var glow = 0;
      if (touchPhrase >= 0 && touchPhrase < 3.2) { glow = Math.max(glow, 0.5 * Math.exp(-touchPhrase / 1.2)); }
      if (perf > 0.05) { glow = Math.max(glow, 0.35 * perf); }
      if (glow > 0.01) {
        ellipse(cx + shMid, ly, lw * 0.55, H * 0.026, 'rgba(232,213,224,' + glow.toFixed(3) + ')');
      }
    }

    /* ---- African-mask silhouettes on the uprights (father-era). ---- */
    var maskSway = 1 + perf * 1.8;
    function mask(mx, my, mw, mh, phase) {
      var sw = Math.sin(t * 0.6 + phase) * 2 * maskSway;
      ctx.save();
      ctx.translate(mx + sw, my);
      ellipse(0, 0, mw / 2, mh / 2, '#2E2018');
      /* Eye slits and mouth slit only: silhouette, never a detailed face. */
      rect(-mw * 0.26, -mh * 0.10, mw * 0.16, 2, '#0E0C09');
      rect(mw * 0.10, -mh * 0.10, mw * 0.16, 2, '#0E0C09');
      rect(-mw * 0.10, mh * 0.26, mw * 0.20, 2, '#0E0C09');
      ctx.restore();
    }
    mask(scL + bar + W * 0.05, H * 0.34, S * 0.055, S * 0.10, 0);
    mask(scR - bar - W * 0.05, H * 0.34, S * 0.055, S * 0.10, 2.1);
    mask(inL - W * 0.02, H * 0.56, S * 0.045, S * 0.085, 4.2);

    /* ---- Cascading plants (sway, closed-form sine). ---- */
    function plant(px, py, len, phase, flip) {
      var sway = Math.sin(t * 0.7 + phase) * (4 + perf * 6);
      ctx.strokeStyle = '#446030';
      ctx.lineWidth = Math.max(1.5, S * 0.004);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.quadraticCurveTo(px + sway, py + len * 0.5, px + sway * 1.6, py + len);
      ctx.stroke();
      var leaves = 5;
      for (var k = 0; k < leaves; k++) {
        var u = (k + 1) / (leaves + 1);
        var lx2 = px + sway * (0.4 + u * 1.2) + (flip ? 1 : -1) * (k % 2 ? 8 : -8);
        var ly2 = py + len * u;
        ellipse(lx2, ly2, S * 0.018, S * 0.010, k % 2 ? '#446030' : '#5A7A42');
      }
    }
    plant(scL + W * 0.10 + shMid, H * 0.14, H * 0.20, 0.5, false);
    plant(scR - W * 0.10 + shMid, H * 0.14, H * 0.24, 2.4, true);
    plant(inR + W * 0.04 + shMid, H * 0.30, H * 0.16, 4.0, false);

    /* ---- Pedestals + shea-butter busts (warm glow, flat alpha). ---- */
    function bust(bx, by, bs) {
      /* Pedestal. */
      rect(bx - bs * 0.32, by, bs * 0.64, H * 0.10, '#1F1B18');
      /* Glow halo. */
      ellipse(bx, by - bs * 0.42, bs * 0.85, bs * 0.45, 'rgba(224,169,46,0.10)');
      ellipse(bx, by - bs * 0.42, bs * 0.60, bs * 0.32, 'rgba(224,169,46,0.14)');
      /* Cranium: rough-carved, featureless but for brow + nose hint. */
      ellipse(bx, by - bs * 0.42, bs * 0.42, bs * 0.50, '#E0A92E');
      ellipse(bx, by - bs * 0.30, bs * 0.30, bs * 0.34, '#E8B93C');
      /* Brow ridge + nose hint. */
      rect(bx - bs * 0.26, by - bs * 0.52, bs * 0.52, bs * 0.05, '#8A5F1A');
      ctx.beginPath();
      ctx.moveTo(bx, by - bs * 0.48);
      ctx.lineTo(bx + bs * 0.07, by - bs * 0.28);
      ctx.lineTo(bx - bs * 0.02, by - bs * 0.28);
      ctx.closePath();
      ctx.fillStyle = '#8A5F1A';
      ctx.fill();
      /* Thumb-print dents: small flat squares, never arcs batches. */
      rect(bx - bs * 0.20, by - bs * 0.62, bs * 0.06, bs * 0.06, '#8A5F1A');
      rect(bx + bs * 0.14, by - bs * 0.70, bs * 0.05, bs * 0.05, '#8A5F1A');
    }
    var bustY = H * 0.72;
    var bustS = phone ? S * 0.10 : S * 0.085;
    bust(cx - W * 0.24 + shMid, bustY, bustS);
    bust(cx + W * 0.24 + shMid, bustY, bustS * 0.85);

    /* ---- Stacked books (father-era, spines color/pattern only). ---- */
    var bookCols = ['#2A2620', '#3E2F23', '#1F3A2E', '#4A2E1E'];
    function bookStack(sx, sy, n, bw, bh) {
      for (var b = 0; b < n; b++) {
        var col = bookCols[(b + Math.floor(J[10 + b] * 4)) % 4];
        rect(sx, sy - (b + 1) * bh, bw, bh - 1, col);
        rect(sx, sy - (b + 1) * bh + bh * 0.3, bw, 1, 'rgba(232,213,224,0.15)');
      }
    }
    bookStack(cx - W * 0.33 + shMid, H * 0.82, 4, W * 0.055, H * 0.022);
    bookStack(cx + W * 0.28 + shMid, H * 0.82, 3, W * 0.05, H * 0.022);

    /* ---- Piano at the visual center (son-era). ---- */
    var pw = phone ? W * 0.46 : W * 0.36;
    var ph = H * 0.13;
    var px = cx - pw / 2 + shMid;
    var py = H * 0.66;
    pianoRect = { x: px, y: py, w: pw, h: ph };
    /* Body + lid hint. */
    rect(px, py, pw, ph, '#0B0A09');
    rect(px - pw * 0.02, py - ph * 0.12, pw * 1.04, ph * 0.14, '#0B0A09');
    /* Legs. */
    rect(px + pw * 0.06, py + ph, pw * 0.03, H * 0.05, '#0B0A09');
    rect(px + pw * 0.91, py + ph, pw * 0.03, H * 0.05, '#0B0A09');
    /* Keys: ivory strip with dips for the phrase notes. */
    var keys = 12;
    var kw = pw / keys;
    for (var ki = 0; ki < keys; ki++) {
      var dip = 0;
      if (touchPhrase >= 0 && touchPhrase < 3.2) {
        dip = Math.max(dip, keyDip(touchPhrase, ki % 3));
      }
      if (perfPhrase >= 0) {
        dip = Math.max(dip, keyDip(perfPhrase, ki % 3));
      }
      var ky = py + ph - H * 0.022 - dip * H * 0.008;
      rect(px + ki * kw + 1, ky, kw - 2, H * 0.022, '#EFE9DA');
      if (ki % 2 === 0) {
        rect(px + ki * kw + kw * 0.55, py + ph - H * 0.022, kw * 0.45, H * 0.012, '#0B0A09');
      }
    }

    /* ---- Ceramic vessels (foreground objects, drawn after the piano). ---- */
    function vessel(vx, vy, vw, vh, col) {
      ctx.beginPath();
      ctx.moveTo(vx - vw * 0.30, vy);
      ctx.lineTo(vx - vw * 0.42, vy + vh * 0.55);
      ctx.lineTo(vx + vw * 0.42, vy + vh * 0.55);
      ctx.lineTo(vx + vw * 0.30, vy);
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill();
      ellipse(vx, vy, vw * 0.30, vh * 0.08, col);
    }
    vessel(cx - W * 0.205 + shMid, H * 0.75, S * 0.06, H * 0.06, '#7A4A30');
    vessel(cx + W * 0.205 + shMid, H * 0.77, S * 0.05, H * 0.05, '#C9B8A6');

    /* ---- Pianist's shadow on the floor: a soft shape, never a figure. ---- */
    var shadowPulse = 0;
    if (touchPhrase >= 0 && touchPhrase < 3.2) { shadowPulse = Math.sin(touchPhrase * 6) * 0.5 + 0.5; }
    if (perfPhrase >= 0) { shadowPulse = Math.max(shadowPulse, 0.6); }
    var shX = cx + shMid + Math.sin(t * 0.9) * 4 * (0.3 + shadowPulse);
    ellipse(shX, H * 0.845, pw * 0.30, H * 0.012, 'rgba(0,0,0,' + (0.35 + 0.25 * shadowPulse).toFixed(3) + ')');

    /* ---- Front scaffold frame (foreground layer, strongest orbit shift). ---- */
    rect(scL - shBack + shFront, scT, bar * 0.9, scB - scT, '#0B0A09');
    rect(scR - shBack + shFront - bar * 0.9, scT, bar * 0.9, scB - scT, '#0B0A09');
    rect(scL - shBack + shFront, H * 0.60, (scR - scL), bar * 0.6, '#0B0A09');

    /* ---- Sound toggle (shapes only, bottom-right). ---- */
    var tg = Math.max(18, S * 0.045);
    var tx = W - tg * 1.6, ty = H - tg * 1.6;
    toggleRect = { x: tx - 4, y: ty - 4, w: tg + 8, h: tg + 8 };
    ctx.beginPath();
    ctx.moveTo(tx, ty + tg * 0.35);
    ctx.lineTo(tx + tg * 0.30, ty + tg * 0.35);
    ctx.lineTo(tx + tg * 0.55, ty + tg * 0.10);
    ctx.lineTo(tx + tg * 0.55, ty + tg * 0.90);
    ctx.lineTo(tx + tg * 0.30, ty + tg * 0.65);
    ctx.lineTo(tx, ty + tg * 0.65);
    ctx.closePath();
    ctx.fillStyle = '#E8D5E0';
    ctx.fill();
    if (soundOn) {
      ctx.strokeStyle = '#E8D5E0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(tx + tg * 0.62, ty + tg * 0.5, tg * 0.16, -0.9, 0.9);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(tx + tg * 0.62, ty + tg * 0.5, tg * 0.30, -0.9, 0.9);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#E8D5E0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tx + tg * 0.62, ty + tg * 0.22);
      ctx.lineTo(tx + tg * 0.95, ty + tg * 0.78);
      ctx.stroke();
    }
  }

  function playPhrase() {
    if (!soundOn) { return; }
    try {
      var AC = null;
      if (typeof window !== 'undefined') {
        AC = window.AudioContext || window.webkitAudioContext;
      }
      if (!AC) { return; }
      if (!actx) { actx = new AC(); }
      if (actx.state === 'suspended') { actx.resume(); }
      var notes = [261.63, 329.63, 392.00];
      for (var i = 0; i < notes.length; i++) {
        (function (f, off) {
          var o = actx.createOscillator();
          var g = actx.createGain();
          o.type = 'triangle';
          o.frequency.value = f;
          var t0 = actx.currentTime + off;
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.05);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
          o.connect(g);
          g.connect(actx.destination);
          o.start(t0);
          o.stop(t0 + 1.0);
        })(notes[i], i * 0.45);
      }
    } catch (e) {}
  }

  function onDown(e) {
    var r = cv.getBoundingClientRect ? cv.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX || 0) - r.left;
    var y = (e.clientY || 0) - r.top;
    dragging = true; lastX = x; lastY = y;
    downX = x; downY = y; downT = currentT;
  }
  function onMove(e) {
    if (!dragging) { return; }
    var r = cv.getBoundingClientRect ? cv.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX || 0) - r.left;
    var dx = x - lastX;
    lastX = x;
    orbit += dx * 0.002;
    if (orbit > 0.6) { orbit = 0.6; }
    if (orbit < -0.6) { orbit = -0.6; }
  }
  function onUp(e) {
    dragging = false;
    var r = cv.getBoundingClientRect ? cv.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX || 0) - r.left;
    var y = (e.clientY || 0) - r.top;
    var moved = Math.abs(x - downX) + Math.abs(y - downY);
    if (moved > 12) { return; } /* it was a drag, not a tap */
    if (x >= toggleRect.x && x <= toggleRect.x + toggleRect.w &&
        y >= toggleRect.y && y <= toggleRect.y + toggleRect.h) {
      soundOn = !soundOn;
      draw(currentT);
      return;
    }
    if (x >= pianoRect.x && x <= pianoRect.x + pianoRect.w &&
        y >= pianoRect.y && y <= pianoRect.y + pianoRect.h) {
      phraseStart = currentT;
      playPhrase();
      draw(currentT);
    }
  }
  try {
    if (cv.addEventListener) {
      cv.addEventListener('pointerdown', onDown);
      cv.addEventListener('pointermove', onMove);
      cv.addEventListener('pointerup', onUp);
    }
  } catch (e) {}

  function onResize() { size(); }
  try {
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.addEventListener) {
        window.visualViewport.addEventListener('resize', onResize);
      }
      window.addEventListener('resize', onResize);
    }
  } catch (e) {}

  /* Boot: frame one = draw(0) exactly; the clock starts with the rAF loop. */
  draw(0);
  boot = false;
  if (typeof requestAnimationFrame !== 'undefined') {
    var start = null;
    function loop(ts) {
      if (start === null) { start = ts; }
      currentT = (ts - start) / 1000;
      draw(currentT);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
