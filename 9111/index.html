<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>9111 — The X-Ray Rowhouse</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0e1218;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
// №9111 "The X-Ray Rowhouse" — after study #204 (Elissa Blount Moorhead), prompt EM1 (PP791).
// Driver: five dark house outlines hold wandering light-marks; one house at a time is the
// bright focus, cycling every 20-40s. Drag a house to hold its focus; drag a light-mark to
// move it inside its own house. Watch-first.
var cv = document.getElementById("c"), ctx = cv.getContext("2d");
var W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); layout(); }
window.addEventListener("resize", resize);

// seeded rng
var seed = 9111;
function rnd(){ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648; }

var houses=[], focusIdx=0, focusTimer=0, FOCUS_MIN=20, FOCUS_MAX=40;
var dragHouse=-1, dragMark=null;

function layout(){
  houses=[];
  var n=5, baseY=H*0.86, topLim=H*0.30;
  var slot=W/n;
  for(var i=0;i<n;i++){
    var hw=slot*0.34, hh=H*(0.34+rnd()*0.14);
    var cx=slot*(i+0.5), x0=cx-hw, y0=baseY-hh;
    var roofH=hh*0.32;
    var marks=[];
    var nm=3+Math.floor(rnd()*2);
    for(var m=0;m<nm;m++){
      marks.push({
        x:x0+rnd()*hw*2, y:y0+roofH*0.4+rnd()*(hh-roofH*0.4),
        wx:x0+rnd()*hw*2, wy:y0+roofH*0.4+rnd()*(hh-roofH*0.4),
        wt:2+rnd()*6, kind:m%3, // 0 dot drift, 1 rocking line, 2 pulsing circle
        cool:(m===nm-1), ph:rnd()*6.28, sp:0.25+rnd()*0.5
      });
    }
    houses.push({x0:x0,y0:y0,hw:hw,hh:hh,roofH:roofH,marks:marks,bright:1});
  }
}

function pickFocus(){
  var ni; do{ ni=Math.floor(rnd()*houses.length); }while(ni===focusIdx);
  focusIdx=ni;
  focusTimer=FOCUS_MIN+rnd()*(FOCUS_MAX-FOCUS_MIN);
}

function houseAt(x,y){
  for(var i=houses.length-1;i>=0;i--){ var h=houses[i];
    if(x>h.x0-h.hw*0.3 && x<h.x0+h.hw*2+h.hw*0.3 && y>h.y0-h.roofH && y<h.y0+h.hh*2) return i; }
  return -1;
}
function markAt(h,x,y){
  var best=null,bd=1e9;
  h.marks.forEach(function(mk){ var d=Math.hypot(mk.x-x,mk.y-y); if(d<bd){bd=d;best=mk;} });
  return bd<34?best:null;
}

cv.addEventListener("pointerdown",function(e){
  var r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  var hi=houseAt(x,y);
  if(hi>=0){
    var mk=markAt(houses[hi],x,y);
    if(mk){ dragMark={h:hi,m:mk}; }
    else { dragHouse=hi; }
    cv.setPointerCapture(e.pointerId);
  }
});
cv.addEventListener("pointermove",function(e){
  if(dragMark){
    var r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    var h=houses[dragMark.h], mk=dragMark.m;
    mk.x=Math.max(h.x0+6,Math.min(h.x0+h.hw*2-6,x));
    mk.y=Math.max(h.y0+6,Math.min(h.y0+h.hh*2-6,y));
    mk.wx=mk.x; mk.wy=mk.y;
  }
});
function endDrag(){ dragHouse=-1; dragMark=null; }
cv.addEventListener("pointerup",endDrag);
cv.addEventListener("pointercancel",endDrag);

var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  // focus cycle (drag on a house holds it)
  if(dragHouse<0){ focusTimer-=dt; if(focusTimer<=0) pickFocus(); }
  var fi = dragHouse>=0?dragHouse:focusIdx;
  ctx.fillStyle="#0e1218"; ctx.fillRect(0,0,W,H);
  houses.forEach(function(h,i){
    var target=(i===fi)?1.6:0.55;
    if(dragHouse>=0 && i!==dragHouse) target=0.35;
    h.bright+=(target-h.bright)*Math.min(1,dt*2);
    var b=h.bright;
    // house outline
    ctx.strokeStyle="rgba(58,67,80,"+(0.55*b+0.25)+")";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(h.x0,h.y0+h.hh*2); ctx.lineTo(h.x0,h.y0);
    ctx.lineTo(h.x0+h.hw,h.y0-h.roofH); ctx.lineTo(h.x0+h.hw*2,h.y0);
    ctx.lineTo(h.x0+h.hw*2,h.y0+h.hh*2); ctx.closePath(); ctx.stroke();
    // light-marks
    h.marks.forEach(function(mk){
      mk.wt-=dt;
      if(mk.wt<=0 && !dragMark){
        mk.wx=h.x0+8+rnd()*(h.hw*2-16);
        mk.wy=h.y0+8+rnd()*(h.hh*2-16);
        mk.wt=2+rnd()*6;
      }
      var sp=mk.sp*(i===fi?1.8:0.8)*dt*40;
      if(!(dragMark&&dragMark.m===mk)){
        mk.x+=(mk.wx-mk.x)*Math.min(1,dt*sp*0.4);
        mk.y+=(mk.wy-mk.y)*Math.min(1,dt*sp*0.4);
      }
      mk.ph+=dt*sp*0.35;
      var col=mk.cool?"90,122,114":"232,176,75";
      if(mk.kind===2) col=mk.cool?"90,122,114":"232,224,208";
      var a=Math.min(1,0.35+0.65*b);
      if(mk.kind===0){
        ctx.fillStyle="rgba("+col+","+a+")";
        ctx.beginPath(); ctx.arc(mk.x,mk.y,3,0,6.29); ctx.fill();
      }else if(mk.kind===1){
        var an=Math.sin(mk.ph)*0.5;
        ctx.strokeStyle="rgba("+col+","+a+")"; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.moveTo(mk.x-8*Math.cos(an),mk.y-8*Math.sin(an));
        ctx.lineTo(mk.x+8*Math.cos(an),mk.y+8*Math.sin(an)); ctx.stroke();
      }else{
        var pr=4+2.5*Math.sin(mk.ph*2);
        ctx.strokeStyle="rgba("+col+","+a+")"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(mk.x,mk.y,Math.max(1.5,pr),0,6.29); ctx.stroke();
      }
    });
  });
  requestAnimationFrame(frame);
}
resize();
pickFocus();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
