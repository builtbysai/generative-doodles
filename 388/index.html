<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.388 Vulnerable</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#4A5A6A; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.388 Vulnerable (maryna-lagereva, EXPANSION #41 ML4).
// A watercolor conservation card in her @forplanetocean
// register: a yelkouan shearwater glides over a blue
// wash sea, its pale reflection rippling below, ink
// underdrawing showing through the paint. Beneath the
// vignette sits her signature data strip: a five-band
// conservation status bar (LC, NT, VU, EN, CR) with VU
// lit in orange, and one fact line. The art and the
// data are one object. WATCH-ONLY: no pointer handling
// at all. The designed text (the five segment labels
// and the fact line) IS the artwork here, drawn on the
// canvas in a serif face, and nothing else is written.
// Watercolor is built the flat way: stacked translucent
// fills with darker pooled-edge strokes, a fixed grain
// dot table, no gradients, no filters. The reflection
// is the bird's own path data redrawn flipped and
// sine-displaced in horizontal bands on this ONE
// canvas: no sprite, no offscreen canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var SKY = '#C9DCEC', SEA = '#6FA8C9', POOLED = '#4E87A8';
var BIRD = '#7A5C3E', INK = '#2E2A26', REFL = '#A9C8DC';
var SLATE = '#4A5A6A', VUCOL = '#E8862E';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 36;
if (LOOP !== 36) throw new Error('Vulnerable loop must be 36s');
var FLAP = 6; // one wing rise-fall per 6s, 6 whole flaps per loop
if (LOOP % FLAP !== 0) throw new Error('flap must complete whole cycles per loop');
var BLOOM = 12; // wash edge-darkening pulse, 3 per loop
if (LOOP % BLOOM !== 0) throw new Error('bloom must complete whole cycles per loop');
var TICK = 1 / 60;

// ---- card geometry (design space) ----------------------
// Centred card. Vignette is the top 70% of the card,
// the status strip the bottom 30%.
var CX = 90, CY = 60, CW = 1100, CH = 780;
var VIG_H = Math.round(CH * 0.7); // 546
var STRIP_Y = CY + VIG_H; // 606
var HY = 400; // horizon: sky above, sea below, inside the vignette
var BX = 620, BY = 238; // bird centre, upper third of the vignette
var FACT = "Puffinus yelkouan - a burrow-nesting shearwater of the Mediterranean, declining.";
var SEG_LABELS = ['LC', 'NT', 'VU', 'EN', 'CR'];
if (SEG_LABELS.length !== 5) throw new Error('status bar needs exactly five segments');
var VU_INDEX = 2;
var BAR_X = 150, BAR_Y = 664, BAR_W = 980, BAR_H = 56;
var SEG_W = BAR_W / 5;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-
// looking value is baked from this at load and never
// changes between frames or renders.
var seed = 388;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// Sky wash pools: large flat ellipses of sky colour laid
// over the pale base at low alpha, so the wash reads
// uneven like real watercolor.
var SKY_POOLS = [];
(function () {
  var i;
  for (i = 0; i < 5; i++) {
    SKY_POOLS.push({
      x: CX + 120 + rnd() * (CW - 240),
      y: CY + 40 + rnd() * (HY - CY - 80),
      rx: 180 + rnd() * 260,
      ry: 40 + rnd() * 60,
      a: 0.28 + rnd() * 0.22
    });
  }
})();
// Sea wash pools: same treatment inside the sea band.
var SEA_POOLS = [];
(function () {
  var i;
  for (i = 0; i < 4; i++) {
    SEA_POOLS.push({
      x: CX + 140 + rnd() * (CW - 280),
      y: HY + 30 + rnd() * (STRIP_Y - HY - 60),
      rx: 200 + rnd() * 300,
      ry: 22 + rnd() * 30,
      a: 0.1 + rnd() * 0.1
    });
  }
})();
// Sea ripple strokes: short horizontal lines, each with
// its own phase, sliding gently on the 12s bloom cycle.
var RIPPLES = [];
(function () {
  var i;
  for (i = 0; i < 14; i++) {
    RIPPLES.push({
      x: CX + 60 + rnd() * (CW - 200),
      y: HY + 18 + rnd() * (STRIP_Y - HY - 36),
      len: 26 + rnd() * 64,
      ph: rnd() * Math.PI * 2,
      deep: i % 3 === 0
    });
  }
})();
// Paper grain: a fixed dot table over the whole
// vignette, ink at 0.06 alpha. Never re-seeded.
var GRAIN = [];
(function () {
  var i;
  for (i = 0; i < 380; i++) {
    GRAIN.push({
      x: CX + rnd() * CW,
      y: CY + rnd() * VIG_H,
      r: 0.8 + rnd() * 1.1
    });
  }
  if (GRAIN.length !== 380) throw new Error('grain table must hold 380 dots');
})();

// ---- bird path data ------------------------------------
// The bird is layered bezier shapes traced by these
// functions in bird-local coordinates (origin at the
// body centre, head to the right). The same functions
// draw the bird and, under a flipped transform, its
// reflection. f is the flap value in [-1, 1]: wing
// tips and control points interpolate between the
// raised and lowered poses.
function wingPath(side, f) {
  ctx.beginPath();
  ctx.moveTo(side * 6, -12);
  ctx.quadraticCurveTo(side * 128, -44 + f * 40, side * 264, -70 + f * 92);
  ctx.quadraticCurveTo(side * 150, -16 + f * 44, side * 8, 10);
  ctx.closePath();
}
function tailPath() {
  ctx.beginPath();
  ctx.moveTo(-94, -8);
  ctx.lineTo(-136, -20);
  ctx.lineTo(-144, -2);
  ctx.lineTo(-137, 14);
  ctx.lineTo(-93, 9);
  ctx.closePath();
}
function bodyPath() {
  ctx.beginPath();
  ctx.moveTo(-100, 2);
  ctx.quadraticCurveTo(-40, -24, 52, -16);
  ctx.quadraticCurveTo(84, -14, 92, -6);
  ctx.quadraticCurveTo(98, 3, 87, 9);
  ctx.quadraticCurveTo(40, 21, -30, 16);
  ctx.quadraticCurveTo(-80, 12, -100, 2);
  ctx.closePath();
}
function bellyPath() {
  ctx.beginPath();
  ctx.moveTo(-64, 7);
  ctx.quadraticCurveTo(0, 25, 70, 5);
  ctx.quadraticCurveTo(2, 12, -64, 7);
  ctx.closePath();
}
function beakPath() {
  ctx.beginPath();
  ctx.moveTo(91, -7);
  ctx.lineTo(119, -2);
  ctx.lineTo(91, 4);
  ctx.closePath();
}
// One full bird pass. fill is the flat colour for
// wings, tail and body; belly shows the pale patch
// unless flat is set (reflection pass); inkStroke > 0
// adds the ink outline at that alpha. All alphas are
// scaled by the caller's globalAlpha, so the
// underdrawing pass and the reflection bands can set
// their own strength outside.
function drawBirdShapes(f, fill, belly, inkStroke) {
  var base = ctx.globalAlpha;
  wingPath(-1, f);
  ctx.fillStyle = fill;
  ctx.globalAlpha = base * 0.8;
  ctx.fill();
  ctx.globalAlpha = base;
  tailPath();
  ctx.fillStyle = fill;
  ctx.fill();
  bodyPath();
  ctx.fillStyle = fill;
  ctx.fill();
  if (belly) {
    bellyPath();
    ctx.fillStyle = SKY;
    ctx.globalAlpha = base * 0.8;
    ctx.fill();
    ctx.globalAlpha = base;
  }
  wingPath(1, f);
  ctx.fillStyle = fill;
  ctx.fill();
  if (inkStroke > 0) {
    ctx.strokeStyle = INK;
    ctx.globalAlpha = base * inkStroke;
    ctx.lineWidth = 2;
    wingPath(-1, f); ctx.stroke();
    tailPath(); ctx.stroke();
    bodyPath(); ctx.stroke();
    wingPath(1, f); ctx.stroke();
    beakPath();
    ctx.fillStyle = INK;
    ctx.globalAlpha = base * 0.85;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(79, -5, 2.4, 0, Math.PI * 2);
    ctx.fillStyle = INK;
    ctx.globalAlpha = base;
    ctx.fill();
  }
  ctx.globalAlpha = base;
}

// ---- card helpers --------------------------------------
function cardPath() {
  var r = 12;
  ctx.beginPath();
  ctx.moveTo(CX + r, CY);
  ctx.lineTo(CX + CW - r, CY);
  ctx.quadraticCurveTo(CX + CW, CY, CX + CW, CY + r);
  ctx.lineTo(CX + CW, CY + CH - r);
  ctx.quadraticCurveTo(CX + CW, CY + CH, CX + CW - r, CY + CH);
  ctx.lineTo(CX + r, CY + CH);
  ctx.quadraticCurveTo(CX, CY + CH, CX, CY + CH - r);
  ctx.lineTo(CX, CY + r);
  ctx.quadraticCurveTo(CX, CY, CX + r, CY);
  ctx.closePath();
}

// ---- motion state --------------------------------------
// Constant first-frame phase: T = 9s into the 36s
// loop. The flap sine sits exactly at its neutral
// crossing (wings mid-glide), the VU pulse is at half
// strength, and the bloom is mid-pulse. Frame one is
// drawn synchronously at this constant; the rAF loop
// advances T from the same anchor in fixed ticks.
// Frame one never reads a wall clock.
var T = 9;
var lastNow = -1, acc = 0;

function step() {}

function draw() {
  // Page ground: the slate of the card's own strip,
  // a quiet tone of the card, running under everything.
  ctx.fillStyle = SLATE;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);

  var flap = Math.sin(Math.PI * 2 * (T / FLAP));
  var bob = 3 * Math.sin(Math.PI * 2 * (T / FLAP) + 0.6);
  var birdY = BY + bob;
  var bloom = 0.5 + 0.5 * Math.sin(Math.PI * 2 * (T / BLOOM) - Math.PI / 2);
  var vuPulse = 0.5 + 0.5 * Math.sin(Math.PI * 2 * (T / LOOP));

  ctx.save();
  cardPath();
  ctx.clip();

  // Vignette base: the pale reflection colour, over
  // which the sky wash is stacked.
  ctx.fillStyle = REFL;
  ctx.fillRect(CX, CY, CW, VIG_H);
  // Sky: stacked translucent flat fills of sky colour.
  ctx.fillStyle = SKY;
  ctx.globalAlpha = 0.82;
  ctx.fillRect(CX, CY, CW, HY - CY);
  ctx.globalAlpha = 1;
  var i, p;
  for (i = 0; i < SKY_POOLS.length; i++) {
    p = SKY_POOLS[i];
    ctx.globalAlpha = p.a;
    ctx.fillStyle = SKY;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Sea: base wash plus pooled layers.
  ctx.fillStyle = SEA;
  ctx.fillRect(CX, HY, CW, STRIP_Y - HY);
  for (i = 0; i < SEA_POOLS.length; i++) {
    p = SEA_POOLS[i];
    ctx.globalAlpha = p.a;
    ctx.fillStyle = i % 2 === 0 ? POOLED : REFL;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Pooled edges: the horizon line and the sea's lower
  // edge in the darker pigment, their alpha breathing
  // with the bloom cycle.
  ctx.strokeStyle = POOLED;
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.4 + 0.3 * bloom;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(CX + 8, HY);
  ctx.lineTo(CX + CW - 8, HY);
  ctx.stroke();
  ctx.globalAlpha = 0.25 + 0.2 * bloom;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(CX + 8, STRIP_Y - 10);
  ctx.lineTo(CX + CW - 8, STRIP_Y - 10);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Reflection: the bird's own path data, flipped
  // about the horizon with the vertical squash water
  // gives a reflection (0.55), drawn in five
  // horizontal bands, each band sine-displaced
  // sideways on the flap cycle and fading as it
  // deepens.
  var BANDS = 5, bandH = (STRIP_Y - HY) / BANDS, SQ = 0.55;
  for (i = 0; i < BANDS; i++) {
    var shift = 6 * Math.sin(Math.PI * 2 * (T / FLAP) + i * 1.05);
    ctx.save();
    ctx.beginPath();
    ctx.rect(CX, HY + i * bandH, CW, bandH + 1);
    ctx.clip();
    ctx.globalAlpha = 0.55 - i * 0.05;
    ctx.translate(BX + shift, HY + (HY - birdY) * SQ);
    ctx.scale(1, -SQ);
    drawBirdShapes(flap, REFL, false, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // Ripple strokes over the reflection and the sea.
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  for (i = 0; i < RIPPLES.length; i++) {
    var rp = RIPPLES[i];
    var rx = rp.x + 5 * Math.sin(Math.PI * 2 * (T / BLOOM) + rp.ph);
    ctx.strokeStyle = rp.deep ? POOLED : REFL;
    ctx.globalAlpha = rp.deep ? 0.26 : 0.3;
    ctx.beginPath();
    ctx.moveTo(rx, rp.y);
    ctx.lineTo(rx + rp.len, rp.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // The bird: ink underdrawing first, offset a few
  // pixels so it shows past the paint, then the brown
  // layered shapes with their ink outline.
  ctx.save();
  ctx.translate(BX + 3, birdY + 3.5);
  ctx.globalAlpha = 0.38;
  drawBirdShapes(flap, INK, false, 0);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.translate(BX, birdY);
  drawBirdShapes(flap, BIRD, true, 0.5);
  ctx.restore();

  // Paper grain over the whole vignette.
  ctx.fillStyle = INK;
  ctx.globalAlpha = 0.06;
  for (i = 0; i < GRAIN.length; i++) {
    ctx.beginPath();
    ctx.arc(GRAIN[i].x, GRAIN[i].y, GRAIN[i].r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Status strip.
  ctx.fillStyle = SLATE;
  ctx.fillRect(CX, STRIP_Y, CW, CH - VIG_H);
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(CX, STRIP_Y);
  ctx.lineTo(CX + CW, STRIP_Y);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Bar bed.
  ctx.fillStyle = INK;
  ctx.globalAlpha = 0.3;
  ctx.fillRect(BAR_X, BAR_Y, BAR_W, BAR_H);
  ctx.globalAlpha = 1;
  // VU halo, pulsing once per loop.
  var vuX = BAR_X + VU_INDEX * SEG_W;
  ctx.fillStyle = VUCOL;
  ctx.globalAlpha = 0.16 + 0.2 * vuPulse;
  ctx.fillRect(vuX - 6, BAR_Y - 6, SEG_W + 12, BAR_H + 12);
  ctx.globalAlpha = 1;
  // VU segment, lit orange, with a pale sheen that
  // follows the same pulse.
  ctx.fillStyle = VUCOL;
  ctx.fillRect(vuX, BAR_Y, SEG_W, BAR_H);
  ctx.fillStyle = SKY;
  ctx.globalAlpha = 0.14 * vuPulse;
  ctx.fillRect(vuX, BAR_Y, SEG_W, BAR_H);
  ctx.globalAlpha = 1;
  // Segment dividers.
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 2;
  for (i = 1; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(BAR_X + i * SEG_W, BAR_Y);
    ctx.lineTo(BAR_X + i * SEG_W, BAR_Y + BAR_H);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // Segment labels: pale on the slate bands, ink on
  // the lit VU band. Designed text, serif.
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 27px Georgia, "Times New Roman", serif';
  for (i = 0; i < 5; i++) {
    ctx.fillStyle = i === VU_INDEX ? INK : SKY;
    ctx.fillText(SEG_LABELS[i], BAR_X + (i + 0.5) * SEG_W, BAR_Y + BAR_H / 2 + 1);
  }
  // The fact line: one line of species text, pale on
  // the slate strip, designed text.
  ctx.font = 'italic 29px Georgia, "Times New Roman", serif';
  ctx.fillStyle = SKY;
  ctx.fillText(FACT, CX + CW / 2, 792);

  ctx.restore();

  // Card border.
  cardPath();
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- sizing: centred fit, card keeps its shape ---------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
