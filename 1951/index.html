<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1951 Sweets as Score</title>
<style>
  html, body { margin: 0; padding: 0; background: #2e2e2c; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Sweets as Score, LR8 / PP1198, study #254 lucy-railton.
  // A stark white tabletop in a dim room. Before the show, objects
  // wait along the table's edges: a fan, a horsehair whip, a small
  // synth, bright foil-wrapped sweets. Drag an object onto the
  // surface and it earns its voice: the fan breathes a soft wash,
  // the whip flicks a sharp transient, the synth holds a drone
  // ring. Drag a sweet to the center and the next movement begins:
  // the voices re-tune around it and the pile of unwrapped sweets
  // grows by one. The table is the score; the objects are the
  // notation. Placement IS the compositional vocabulary, so the
  // table stays rigorous: at most three voices, at most four
  // movements, and every object earns its place.
  var INK = '#2b2b28';      // plate ink, near black
  var PLATE = '#efece2';    // top plate ink, warm off-white on the dark room
  var INK_DIM = '#6f6d66';  // muted ink, fan grey
  var TABLE = '#f7f5ef';    // table white
  var TABLE_SH = '#e4e1d6'; // table edge shadow
  var ROOM_TOP = '#454542'; // dim neutral room, top
  var ROOM_BOT = '#2e2e2c'; // dim neutral room, bottom
  var SHADOW = '#b9b7ae';   // soft grey object shadow
  var SHADOW_DK = '#8f8d84';// darker soft grey shadow
  var RED = '#d9261c';      // sweet foil, bright red
  var GREEN = '#1f9e4d';    // sweet foil, bright green
  var ORANGE = '#e8700a';   // sweet foil, bright orange
  var WHIP = '#1f1e1c';     // whip, near black horsehair
  var SYNTH = '#232320';    // synth body, dark
  var KEY = '#f2efe6';      // synth keys, bone white
  var PILL = '#e4e1d6';     // hint pill, table shadow white

  // Fixed-phase first frame: FIRST_T = 9 s. At t = 9 the fan and
  // the synth are already placed and voicing, the green sweet has
  // been eaten so movement 2 is underway, the unwrapped pile holds
  // one sweet, and the whip and the red and orange sweets wait in
  // the edge tray. The fan breath is mid-exhale, the synth ring is
  // open, the table reads at once.
  var FIRST_T = 9;
  var SEED = 1951;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load,
  // ?place=<object>:<x>:<y> places one object at load with
  // normalized coordinates (whip, fan, synth, or sweet, which eats
  // the next uneaten sweet when dropped in the center zone).
  // ?seed= varies the texture seed. Read at load only.
  var seedParam = 0, probeT = null, probePlace = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = qs.match(/[?&]seed=(-?\d+)/); if (m) { seedParam = parseInt(m[1], 10) || 0; }
    var mt = qs.match(/[?&]t=([0-9.]+)/); if (mt) { probeT = parseFloat(mt[1]); }
    var mp = qs.match(/[?&]place=([a-z]+):([0-9.]+):([0-9.]+)/); if (mp) { probePlace = { type: mp[1], x: parseFloat(mp[2]), y: parseFloat(mp[3]) }; }
  } catch (e) {}
  var FIELD_SEED = seedParam ? (SEED + seedParam * 101) : SEED;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and a fixed salt, so every frame is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The table, in normalized coordinates. A trapezoid seen from
  // above at a slight angle: the far edge is narrower, the near
  // edge meets the frame. The room shows around the top and sides.
  var TABLE_TOP_Y = 0.12, TABLE_TOP_L = 0.10, TABLE_TOP_R = 0.90;
  var CENTER = { x: 0.5, y: 0.55 };
  var CENTER_RX = 0.10, CENTER_RY = 0.085;

  function tableLeftAt(y) {
    var f = (y - TABLE_TOP_Y) / (1 - TABLE_TOP_Y);
    if (f < 0) { f = 0; } if (f > 1) { f = 1; }
    return TABLE_TOP_L * (1 - f);
  }
  function tableRightAt(y) {
    var f = (y - TABLE_TOP_Y) / (1 - TABLE_TOP_Y);
    if (f < 0) { f = 0; } if (f > 1) { f = 1; }
    return TABLE_TOP_R + (1 - TABLE_TOP_R) * f;
  }
  function inTable(nx, ny) {
    if (ny < TABLE_TOP_Y || ny > 1) { return false; }
    return nx >= tableLeftAt(ny) && nx <= tableRightAt(ny);
  }
  function inCenter(nx, ny) {
    // Match the drawn ring, whose radii are based on min(W, H).
    var m = Math.min(W, H);
    var dx = (nx - CENTER.x) / (CENTER_RX * m / W);
    var dy = (ny - CENTER.y) / (CENTER_RY * m / H);
    return dx * dx + dy * dy <= 1;
  }

  // State. Placed voices and the movement count are the only
  // state, and they only change through interaction (or the
  // ?place= hook at load), so frame one is a pure function of
  // FIRST_T and the fixed opening state.
  var SWEETS = [
    { color: GREEN, name: 'green', eaten: true },   // eaten before frame one
    { color: RED, name: 'red', eaten: false },
    { color: ORANGE, name: 'orange', eaten: false }
  ];
  var placed = {
    fan: { x: 0.30, y: 0.32, on: true },
    synth: { x: 0.68, y: 0.38, on: true },
    whip: { x: 0.11, y: 0.55, on: false }   // waits on the left edge
  };
  var tray = {
    whip: { x: 0.11, y: 0.55 },
    sweetRed: { x: 0.38, y: 0.90 },
    sweetOrange: { x: 0.62, y: 0.90 }
  };
  var movement = 2;          // movement 1 already played, green sweet eaten
  var eatenCount = 1;        // the pile holds one unwrapped sweet
  var MAX_MOVEMENT = 4;      // three sweets, so four movements at most

  // Re-tuning: each new movement tightens the breath, widens the
  // drone rings, and quickens the whip's flick, so the ensemble
  // audibly re-tunes around the sweet at the center.
  function breathPeriod() { return 4.6 - 0.3 * (movement - 1); }
  function ringSpacing() { return 15 + 3.5 * (movement - 1); }
  function flickInterval() { return 5.3 - 0.4 * (movement - 1); }

  // Placement, shared by pointer drag, the ?place= hook, and the
  // probe API. Returns true when the drop changed the state.
  function placeObject(type, nx, ny) {
    if (type === 'sweet') {
      var i, s = null;
      for (i = 0; i < SWEETS.length; i++) {
        if (!SWEETS[i].eaten) { s = SWEETS[i]; break; }
      }
      if (!s) { return false; }
      if (movement >= MAX_MOVEMENT) { return false; }
      if (inCenter(nx, ny)) {
        s.eaten = true;
        eatenCount++;
        movement++;
        return true;
      }
      return false; // a sweet dropped off-center returns to the tray
    }
    if (type === 'fan' || type === 'whip' || type === 'synth') {
      if (!inTable(nx, ny)) { return false; }
      var p = placed[type];
      p.x = nx; p.y = ny; p.on = true;
      return true;
    }
    return false;
  }

  // Interaction state: the object being dragged, if any.
  var dragging = null; // { type, x, y } in normalized coords
  var dragMoved = false;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function lerp(a, b, f) { return a + (b - a) * f; }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The room: dim neutral, darker toward the bottom, so the white
  // table reads as a lit surface in a dark room.
  function drawRoom() {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, ROOM_TOP);
    grad.addColorStop(1, ROOM_BOT);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // The table: a white trapezoid with a soft grey shadow along its
  // far edge, seen from above at a slight angle.
  function drawTable() {
    var x0 = tableLeftAt(1) * W, x1 = tableRightAt(1) * W;
    var tx0 = TABLE_TOP_L * W, tx1 = TABLE_TOP_R * W, ty = TABLE_TOP_Y * H;
    ctx.fillStyle = hexA(SHADOW_DK, a4(0.35));
    ctx.beginPath();
    ctx.moveTo(tx0 - 6, ty + 6);
    ctx.lineTo(tx1 + 6, ty + 6);
    ctx.lineTo(x1 + 6, H);
    ctx.lineTo(x0 - 6, H);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = TABLE;
    ctx.beginPath();
    ctx.moveTo(tx0, ty);
    ctx.lineTo(tx1, ty);
    ctx.lineTo(x1, H);
    ctx.lineTo(x0, H);
    ctx.closePath();
    ctx.fill();
    // A faint seam along the far edge, the table's back rim.
    ctx.strokeStyle = hexA(TABLE_SH, a4(0.9));
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tx0, ty); ctx.lineTo(tx1, ty);
    ctx.stroke();
  }

  // The center: a thin ring marking where a sweet begins the next
  // movement, and four small movement dots beside it, filled for
  // the movements already played.
  function drawCenter(t) {
    var cx = CENTER.x * W, cy = CENTER.y * H;
    var m = Math.min(W, H);
    var rx = CENTER_RX * m, ry = CENTER_RY * m;
    var pulse = 0.5 + 0.5 * Math.sin(t * 0.8);
    ctx.strokeStyle = hexA(INK_DIM, a4(0.35 + 0.15 * pulse));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    var i;
    for (i = 0; i < MAX_MOVEMENT; i++) {
      var dx = cx - (MAX_MOVEMENT - 1) * 11 + i * 22;
      var dy = cy + ry + 16;
      ctx.fillStyle = (i < movement) ? INK : hexA(INK_DIM, a4(0.35));
      ctx.beginPath(); ctx.moveTo(dx + 4, dy); ctx.arc(dx, dy, 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  // The pile of unwrapped sweets: one crumpled foil wrapper and
  // one small round sweet per movement played, clustered just
  // left of the center ring.
  function drawPile() {
    var px = (CENTER.x - 0.16) * W, py = (CENTER.y + 0.02) * H;
    var rng = mulberry32(FIELD_SEED * 7 + 13);
    var i;
    for (i = 0; i < eatenCount; i++) {
      var ox = px + (rng() - 0.5) * 26;
      var oy = py + (rng() - 0.5) * 14;
      var col = SWEETS[i].color;
      // Crumpled wrapper: a small foil diamond.
      ctx.fillStyle = hexA(col, a4(0.9));
      ctx.beginPath();
      ctx.moveTo(ox, oy - 7); ctx.lineTo(ox + 7, oy); ctx.lineTo(ox, oy + 7); ctx.lineTo(ox - 7, oy);
      ctx.closePath();
      ctx.fill();
      // The unwrapped sweet itself: a small round dot.
      ctx.fillStyle = hexA(col, a4(0.95));
      ctx.beginPath(); ctx.moveTo(ox + 12, oy + 4); ctx.arc(ox + 9, oy + 4, 3.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // A soft grey shadow ellipse under an object at (nx, ny).
  function drawShadow(nx, ny, rw, rh) {
    ctx.fillStyle = hexA(SHADOW, a4(0.5));
    ctx.beginPath();
    ctx.ellipse(nx * W + 4, ny * H + 5, rw, rh, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // The fan: a folding fan of thin ribs spreading from a pivot,
  // drawn in muted ink. When placed, its breath wash is a soft
  // grey ellipse that swells and fades on the breath period, and
  // the ribs open and close slightly with the same breath.
  function drawFan(t) {
    var p = placed.fan;
    var px = p.x * W, py = p.y * H;
    var s = clamp(W / 560, 0.8, 1.2);
    var R = 34 * s;
    drawShadow(p.x, p.y, R * 0.9, R * 0.28);
    if (p.on) {
      var br = 0.5 + 0.5 * Math.sin((2 * Math.PI * t) / breathPeriod());
      var washR = R * (1.15 + 0.45 * br);
      ctx.fillStyle = hexA(SHADOW, a4(0.10 + 0.10 * br));
      ctx.beginPath(); ctx.moveTo(px + washR, py); ctx.arc(px, py, washR, 0, Math.PI * 2); ctx.fill();
    }
    var spread = 1.9 + (p.on ? 0.18 * Math.sin((2 * Math.PI * t) / breathPeriod()) : 0);
    var i, n = 9;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.5;
    for (i = 0; i < n; i++) {
      var a = -Math.PI / 2 - spread / 2 + (spread * i) / (n - 1);
      var ex = px + Math.cos(a) * R, ey = py + Math.sin(a) * R;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke();
    }
    // The fan's outer arc, joining the rib tips.
    ctx.strokeStyle = hexA(INK, a4(0.85));
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py, R, -Math.PI / 2 - spread / 2, -Math.PI / 2 + spread / 2);
    ctx.stroke();
    // Pivot dot.
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.moveTo(px + 4, py); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
  }

  // The horsehair whip: a dark handle and a long thin curved
  // lash. When placed, it flicks on a seeded schedule: a sharp
  // curved stroke flashes from the lash tip and fades within half
  // a second, a transient mark, never a held shape.
  function drawWhip(t) {
    var p = placed.whip;
    var px = p.x * W, py = p.y * H;
    var s = clamp(W / 560, 0.8, 1.2);
    var L = 52 * s;
    drawShadow(p.x, p.y, L * 0.7, 7 * s);
    // Handle.
    ctx.strokeStyle = WHIP;
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(px - 14 * s, py + 10 * s); ctx.lineTo(px + 6 * s, py - 2 * s); ctx.stroke();
    // Lash, a thin curve.
    ctx.strokeStyle = hexA(WHIP, a4(0.9));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px + 6 * s, py - 2 * s);
    ctx.quadraticCurveTo(px + 26 * s, py - 18 * s, px + L, py - 8 * s);
    ctx.stroke();
    if (p.on) {
      var iv = flickInterval();
      var k = Math.floor((t - 3) / iv);
      if (k >= 0) {
        var start = 3 + k * iv;
        var f = (t - start) / 0.5;
        if (f >= 0 && f <= 1) {
          var env = 1 - f;
          var tipX = px + L, tipY = py - 8 * s;
          ctx.strokeStyle = hexA(WHIP, a4(0.85 * env));
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(tipX, tipY);
          ctx.quadraticCurveTo(tipX + 22 * s, tipY - 14 * s, tipX + 34 * s, tipY + 2 * s);
          ctx.stroke();
          // The crack: a small sharp star at the tip at the peak.
          ctx.fillStyle = hexA(WHIP, a4(0.9 * env));
          ctx.beginPath();
          ctx.moveTo(tipX + 34 * s, tipY + 2 * s - 6);
          ctx.lineTo(tipX + 34 * s + 3, tipY + 2 * s);
          ctx.lineTo(tipX + 34 * s, tipY + 2 * s + 6);
          ctx.lineTo(tipX + 34 * s - 3, tipY + 2 * s);
          ctx.closePath();
          ctx.fill();
        }
      }
    }
  }

  // The small synth: a dark body, bone-white keys, one knob.
  // When placed, its drone is a set of concentric rings that
  // expand slowly and fade, spaced by the movement's tuning.
  function drawSynth(t) {
    var p = placed.synth;
    var px = p.x * W, py = p.y * H;
    var s = clamp(W / 560, 0.8, 1.2);
    var bw = 64 * s, bh = 40 * s;
    drawShadow(p.x, p.y, bw * 0.6, bh * 0.4);
    if (p.on) {
      var sp = ringSpacing() * s;
      var phase = (t * 6) % sp;
      var i;
      for (i = 0; i < 3; i++) {
        var r = 26 * s + i * sp + phase;
        var al = 0.35 * (1 - (r - 26 * s) / (3 * sp));
        if (al > 0.02) {
          ctx.strokeStyle = hexA(INK_DIM, a4(al));
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(px + r, py); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.stroke();
        }
      }
    }
    // Body.
    ctx.fillStyle = SYNTH;
    ctx.fillRect(px - bw / 2, py - bh / 2, bw, bh);
    // Keys.
    var k;
    for (k = 0; k < 7; k++) {
      ctx.fillStyle = KEY;
      ctx.fillRect(px - bw / 2 + 4 + k * 8 * s, py + bh / 2 - 14 * s, 6 * s, 10 * s);
    }
    // Knob.
    ctx.fillStyle = hexA(KEY, a4(0.9));
    ctx.beginPath(); ctx.moveTo(px + bw / 2 - 10 + 4, py - bh / 2 + 8); ctx.arc(px + bw / 2 - 10, py - bh / 2 + 8, 4, 0, Math.PI * 2); ctx.fill();
  }

  // A foil-wrapped sweet: a bright foil center with twisted ends.
  function drawSweet(nx, ny, color, scale) {
    var px = nx * W, py = ny * H;
    var s = clamp(W / 560, 0.8, 1.2) * (scale || 1);
    drawShadow(nx, ny, 16 * s, 5 * s);
    ctx.fillStyle = hexA(color, a4(0.95));
    // Twisted ends.
    ctx.beginPath();
    ctx.moveTo(px - 20 * s, py - 6 * s); ctx.lineTo(px - 10 * s, py); ctx.lineTo(px - 20 * s, py + 6 * s);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px + 20 * s, py - 6 * s); ctx.lineTo(px + 10 * s, py); ctx.lineTo(px + 20 * s, py + 6 * s);
    ctx.closePath(); ctx.fill();
    // Foil center.
    ctx.beginPath(); ctx.moveTo(px + 11 * s, py); ctx.arc(px, py, 11 * s, 0, Math.PI * 2); ctx.fill();
    // Gloss.
    ctx.fillStyle = hexA('#ffffff', a4(0.5));
    ctx.beginPath(); ctx.moveTo(px - 2 * s, py - 5 * s); ctx.arc(px - 4 * s, py - 4 * s, 3.5 * s, 0, Math.PI * 2); ctx.fill();
  }

  // The edge tray: the objects still waiting, drawn along the
  // table's edges, each with its soft shadow. The whip waits on
  // the left edge; the uneaten sweets wait along the bottom edge.
  function drawTray() {
    if (!placed.whip.on) { drawWhipAt(tray.whip.x, tray.whip.y); }
    if (!SWEETS[1].eaten) { drawSweet(tray.sweetRed.x, tray.sweetRed.y, RED, 1); }
    if (!SWEETS[2].eaten) { drawSweet(tray.sweetOrange.x, tray.sweetOrange.y, ORANGE, 1); }
  }
  // The whip drawn at its tray slot, without a voice.
  function drawWhipAt(nx, ny) {
    var save = placed.whip;
    placed.whip = { x: nx, y: ny, on: false };
    drawWhip(lastT);
    placed.whip = save;
  }

  // The object currently being dragged, drawn at the pointer.
  function drawDragged() {
    if (!dragging) { return; }
    if (dragging.type === 'sweet') {
      var s = null, i;
      for (i = 0; i < SWEETS.length; i++) {
        if (!SWEETS[i].eaten) { s = SWEETS[i]; break; }
      }
      if (s) { drawSweet(dragging.x, dragging.y, s.color, 1.15); }
    } else if (dragging.type === 'fan') {
      var save = placed.fan;
      placed.fan = { x: dragging.x, y: dragging.y, on: false };
      drawFan(lastT);
      placed.fan = save;
    } else if (dragging.type === 'whip') {
      drawWhipAt(dragging.x, dragging.y);
    } else if (dragging.type === 'synth') {
      var save2 = placed.synth;
      placed.synth = { x: dragging.x, y: dragging.y, on: false };
      drawSynth(lastT);
      placed.synth = save2;
    }
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawRoom();
    drawTable();
    drawCenter(t);
    drawPile();
    if (placed.fan.on) { drawFan(t); }
    if (placed.synth.on) { drawSynth(t); }
    if (placed.whip.on) { drawWhip(t); }
    drawTray();
    drawDragged();

    // ---- Plates: title top-left, number and date below it, a
    // short descriptor and the movement top-right. The plates sit
    // on the dark room above the table, so they use the light plate
    // ink; the hint pill sits on the white table and keeps dark ink.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = PLATE;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Sweets as Score', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(PLATE, 0.8);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1951 · 2007 · 05 · 16', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(PLATE, 0.65);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('the table is the score', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.fillStyle = hexA(PLATE, 0.8);
    ctx.font = fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Movement ' + movement + ' of ' + MAX_MOVEMENT, W - 18, 18 + fsTitle * 0.8 + fsSmall + 8 + fsSmall + 6);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom on a pale pill so it stays
    // legible over the white table.
    var hint = 'Drag objects onto the table to voice them.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(PILL, a4(0.85));
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function perfT() { return lastT; }

  function canvasPos(e) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function toNorm(p) { return { x: p.x / W, y: p.y / H }; }

  // The nearest draggable object within reach of a pointer point,
  // in normalized coordinates: a placed voice can be picked up
  // again, a tray object can be picked up from its slot.
  function pickAt(nx, ny) {
    var best = null, bestD = 0.07;
    function consider(type, ox, oy) {
      var d = Math.sqrt((nx - ox) * (nx - ox) + (ny - oy) * (ny - oy));
      if (d < bestD) { bestD = d; best = type; }
    }
    if (placed.fan.on) { consider('fan', placed.fan.x, placed.fan.y); }
    if (placed.whip.on) { consider('whip', placed.whip.x, placed.whip.y); }
    if (placed.synth.on) { consider('synth', placed.synth.x, placed.synth.y); }
    if (!placed.whip.on) { consider('whip', tray.whip.x, tray.whip.y); }
    if (!SWEETS[1].eaten) { consider('sweet', tray.sweetRed.x, tray.sweetRed.y); }
    if (!SWEETS[2].eaten) { consider('sweet', tray.sweetOrange.x, tray.sweetOrange.y); }
    return best;
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      var p = toNorm(canvasPos(e));
      var type = pickAt(p.x, p.y);
      if (!type) { return; }
      dragging = { type: type, x: p.x, y: p.y };
      dragMoved = false;
      try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      draw(reduced ? FIRST_T : perfT());
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var p = toNorm(canvasPos(e));
      dragging.x = p.x; dragging.y = p.y;
      dragMoved = true;
      draw(reduced ? FIRST_T : perfT());
    });
    window.addEventListener('pointerup', function () {
      if (!dragging) { return; }
      if (dragMoved) { placeObject(dragging.type, dragging.x, dragging.y); }
      dragging = null;
      draw(reduced ? FIRST_T : perfT());
    });
    window.addEventListener('pointercancel', function () { dragging = null; });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1951 exposes placement, movement, and state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1951 = {
      place: placeObject,
      movement: function () { return movement; },
      eaten: function () { return eatenCount; },
      placedCount: function () {
        var n = 0;
        if (placed.fan.on) { n++; }
        if (placed.whip.on) { n++; }
        if (placed.synth.on) { n++; }
        return n;
      },
      breathPeriod: breathPeriod,
      ringSpacing: ringSpacing,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  // Apply the ?place= hook after resize(), so inCenter() sees the
  // real stage size; before the first frame either way.
  if (probePlace) { placeObject(probePlace.type, probePlace.x, probePlace.y); }
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: fan breath at about 0.22 Hz, synth rings drifting
  // at 6 px/s, whip flicks on a seeded schedule, all well under
  // the 14 Hz ceiling. Guarded so node-canvas QA (no
  // requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
