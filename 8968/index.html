<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&#8470;8968 &middot; Stage Voicing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #d9922e; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; touch-action: none; }
  #plate {
    position: fixed; left: 20px; top: 18px;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #1d1712; opacity: 0.66; pointer-events: none;
    user-select: none; -webkit-user-select: none;
    transition: color 0.8s linear;
  }
  #plate .t { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; }
  #plate .g { font-size: 11px; letter-spacing: 0.08em; margin-top: 4px; opacity: 0.85; }
  #plate .h { font-size: 11px; letter-spacing: 0.08em; margin-top: 3px; opacity: 0.55; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="plate">
  <div class="t">&#8470;8968 &middot; Stage Voicing</div>
  <div class="g" id="gelname"></div>
  <div class="h">drag to scrub the light &middot; click for a new scene</div>
</div>
<script>
"use strict";
/* Stage Voicing: a stage-light instrument. One flat curated gel color floods
   the whole field while a handful of dark flat shapes hold their ground.
   The SAME shapes must read differently under each light: that is the drama.
   The gel cycle runs on its own slow clock; click re-voices the figure;
   drag scrubs the light by hand. No outlines, no gradients, no texture. */

var SEED = 58;
var INK = "#1d1712";
var PAPER = "#f2ead8";

/* Eight curated stage gels. Theatrical, not garish: each one genuinely
   re-voices the dark figure. Hold 7s, crossfade 3s, endless 80s loop. */
var GELS = [
  { name: "amber",       hex: "#d9922e" },
  { name: "steel blue",  hex: "#5f7fa6" },
  { name: "rose",        hex: "#b96a7e" },
  { name: "moss",        hex: "#7d8a58" },
  { name: "violet",      hex: "#6f5f92" },
  { name: "teal",        hex: "#4f9a94" },
  { name: "rust",        hex: "#b0532c" },
  { name: "midnight",    hex: "#3a4166" }
];
var HOLD = 7, FADE = 3;
var SLOT = HOLD + FADE;
var CYCLE = GELS.length * SLOT;

/* Shape vocabulary (all flat, filled, never stroked):
   c: disc {x,y,r}            e: ellipse {x,y,rx,ry}
   r: bar {x,y,w,h,rot}       t: triangle {p:[[x,y]x3]}
   h: half disc {x,y,r}       cut:true draws in the current gel color */
function c(x,y,r,cut){ return {t:"c",x:x,y:y,r:r,cut:!!cut}; }
function e(x,y,rx,ry){ return {t:"e",x:x,y:y,rx:rx,ry:ry}; }
function r(x,y,w,h,rot){ return {t:"r",x:x,y:y,w:w,h:h,rot:rot||0}; }
function t(p){ return {t:"t",p:p}; }
function h(x,y,rad){ return {t:"h",x:x,y:y,r:rad}; }

/* Scene 0: the hero voicing. Tree, hill, sun, six dark shapes in a 200x140
   box. Big enough to hold the frame at any viewport. */
var HERO = { name: "tree, hill, sun", box: [200,140], shapes: [
  e(100,150,100,36),            /* hill */
  c(150,34,13),                 /* sun */
  r(60,84,7,58,0),              /* trunk */
  c(60,44,16), c(46,56,10.5), c(74,56,10.5)  /* canopy */
]};

/* Scenes 1-16: the hand-voiced motifs, 100x100 box, as before. */
var MOTIFS = [
{ name:"perched bird", shapes:[
  e(50,60,17,14), c(63,44,9.5),
  t([[70.5,41],[79,44.5],[70.5,48]]),
  t([[35,54],[21,45],[28,62]]),
  r(48,75.5,2.6,9,0), r(55,75.5,2.6,9,0)
]},
{ name:"seated cat", shapes:[
  e(50,63,20,15), c(50,40,11),
  t([[41,34],[43,22],[50,31]]), t([[59,34],[57,22],[50,31]]),
  r(66,68,4.5,18,-50)
]},
{ name:"fish", shapes:[
  e(48,55,24,12),
  t([[70,55],[86,45],[86,65]]),
  t([[48,44],[56,32],[62,45]]),
  c(38,52,2.6,true)
]},
{ name:"mushroom", shapes:[
  h(50,46,20), r(44,46,12,26,0),
  c(42,36,3,true), c(56,39,2.4,true)
]},
{ name:"tree", shapes:[
  r(47,58,6,28,0),
  c(50,34,17), c(37,45,11), c(63,45,11)
]},
{ name:"walker", shapes:[
  c(51,22,7.5), r(47,38,7,24,0),
  r(50,42,4,18,18),
  r(42.5,62,4.5,26,13), r(51.5,62,4.5,26,-13)
]},
{ name:"sailboat", shapes:[
  t([[52,28],[52,56],[72,56]]),
  r(50.5,42,3,32,0),
  t([[32,62],[70,62],[58,76]])
]},
{ name:"dog", shapes:[
  e(46,58,23,12), c(68,46,10),
  t([[61,42],[57,31],[65,38]]),
  r(34,68,3.2,12,0), r(46,68,3.2,12,0), r(58,68,3.2,12,0),
  r(24,50,3,14,30)
]},
{ name:"butterfly", shapes:[
  c(40,41,13), c(60,41,13),
  c(42,61,8.5), c(58,61,8.5),
  r(47.5,41,5,30,0)
]},
{ name:"rabbit", shapes:[
  e(44,62,20,14), c(64,48,9.5),
  r(59,30,4.5,24,-7), r(67,30,4.5,24,7),
  c(25,58,4.5)
]},
{ name:"owl", shapes:[
  c(50,56,18),
  t([[37,46],[40,34],[47,44]]), t([[63,46],[60,34],[53,44]]),
  c(43,52,3.6,true), c(57,52,3.6,true),
  t([[47,58],[53,58],[50,63]])
]},
{ name:"turtle", shapes:[
  h(46,56,20), e(70,52,7,5),
  r(36,64,5,8,-20), r(56,64,5,8,20),
  t([[26,56],[18,60],[26,64]])
]},
{ name:"paper plane", shapes:[
  t([[50,30],[30,68],[50,58]]),
  t([[50,30],[70,68],[50,58]])
]},
{ name:"umbrella", shapes:[
  h(50,42,23), r(49,16,2,8,0), r(49,42,2.4,30,0),
  r(45,60,9,2.4,9,0), r(41,55.5,2.4,9,0)
]},
{ name:"chair", shapes:[
  r(34,30,5,32,0), r(34,50,28,5,0),
  r(22,68,4,26,0), r(44,68,4,26,0)
]},
{ name:"gull", shapes:[
  e(50,55,12,5.5),
  t([[46,54],[20,38],[38,58]]),
  t([[54,54],[80,38],[62,58]])
]}
];

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(a,b){ return ((a*2654435761) ^ (b*40503)) >>> 0; }

/* Fixed scene order: hero first, then every motif once, each voiced
   deterministically from seed 58 (mirror flip, small jitter, scale). */
var SCENES = (function(){
  var list = [{ motif: HERO, flip: false, jx: 0, jy: 0, sc: 1 }];
  for (var i = 0; i < MOTIFS.length; i++){
    var r = mulberry32(hash2(SEED, i + 1));
    list.push({
      motif: MOTIFS[i],
      flip: r() < 0.5,
      jx: (r()*2-1)*5, jy: (r()*2-1)*4,
      sc: 0.94 + r()*0.14
    });
  }
  return list;
})();

function hexRgb(hex){
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
var GEL_RGB = GELS.map(function(g){ return hexRgb(g.hex); });

function gelAt(pos){
  pos = ((pos % CYCLE) + CYCLE) % CYCLE;
  var i = Math.floor(pos / SLOT);
  var within = pos - i * SLOT;
  var cur = GEL_RGB[i], nxt = GEL_RGB[(i+1) % GELS.length];
  var k = within < HOLD ? 0 : (within - HOLD) / FADE;
  k = k*k*(3-2*k);
  return {
    index: i,
    fading: within >= HOLD,
    rgb: [cur[0]+(nxt[0]-cur[0])*k, cur[1]+(nxt[1]-cur[1])*k, cur[2]+(nxt[2]-cur[2])*k]
  };
}
function css(rgb){
  return "rgb(" + Math.round(rgb[0]) + "," + Math.round(rgb[1]) + "," + Math.round(rgb[2]) + ")";
}
function luminance(rgb){
  return (0.2126*rgb[0] + 0.7152*rgb[1] + 0.0722*rgb[2]) / 255;
}

var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");
var gelLabel = document.getElementById("gelname");
var plate = document.getElementById("plate");

var sceneIndex = 0;
var gelPos = 0;          /* seconds into the 80s gel cycle */
var scrubbing = false;   /* pointer drag in progress */
var downX = 0, downY = 0, downPos = 0, moved = false;

function drawShape(sh, gelCss){
  ctx.fillStyle = sh.cut ? gelCss : INK;
  if (sh.t === "c"){
    ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.r, 0, 7); ctx.fill();
  } else if (sh.t === "e"){
    ctx.beginPath(); ctx.ellipse(sh.x, sh.y, sh.rx, sh.ry, 0, 0, 7); ctx.fill();
  } else if (sh.t === "r"){
    ctx.save(); ctx.translate(sh.x, sh.y); ctx.rotate(sh.rot*Math.PI/180);
    ctx.fillRect(-sh.w/2, -sh.h/2, sh.w, sh.h); ctx.restore();
  } else if (sh.t === "t"){
    ctx.beginPath(); ctx.moveTo(sh.p[0][0], sh.p[0][1]);
    ctx.lineTo(sh.p[1][0], sh.p[1][1]); ctx.lineTo(sh.p[2][0], sh.p[2][1]);
    ctx.closePath(); ctx.fill();
  } else if (sh.t === "h"){
    ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.r, Math.PI, 0);
    ctx.closePath(); ctx.fill();
  }
}

function drawFigure(spec, gelCss, w, hgt){
  var box = spec.motif.box || [100,100];
  var bw = box[0], bh = box[1];
  var u;
  var cx, cy;
  if (spec.motif === HERO){
    /* hero holds the frame: 80% of width, bottom-anchored on the hill */
    u = Math.min(w*0.80/bw, hgt*0.90/bh);
    cx = w/2; cy = hgt*0.97 - bh*u/2;
  } else {
    u = Math.min(w, hgt) / 120 * spec.sc;
    cx = w/2 + spec.jx*u; cy = hgt*0.52 + spec.jy*u;
  }
  ctx.save();
  ctx.translate(cx, cy);
  if (spec.flip) ctx.scale(-1, 1);
  ctx.scale(u, u);
  ctx.translate(-bw/2, -bh/2);
  var shapes = spec.motif.shapes;
  for (var k = 0; k < shapes.length; k++) drawShape(shapes[k], gelCss);
  ctx.restore();
}

function frame(){
  var g = gelAt(gelPos);
  var gelCss = css(g.rgb);
  var w = cv.width, hgt = cv.height;
  document.body.style.background = gelCss;
  ctx.fillStyle = gelCss;
  ctx.fillRect(0, 0, w, hgt);
  drawFigure(SCENES[sceneIndex % SCENES.length], gelCss, w, hgt);
  var name = GELS[g.index].name;
  var label = "gel " + (g.index+1) + " of " + GELS.length + " \u00b7 " + name +
              (g.fading ? " \u00b7 fading" : "");
  if (gelLabel.textContent !== label) gelLabel.textContent = label;
  plate.style.color = luminance(g.rgb) < 0.28 ? PAPER : INK;
}

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(window.innerWidth * dpr);
  cv.height = Math.round(window.innerHeight * dpr);
}

/* Dev-only review modes (query params, never linked in the UI):
   ?grid=1 draws all 17 scenes in a curation grid.
   ?scene=N starts on scene N (0 = hero).
   ?gel=N starts the gel cycle on gel N. */
function drawGrid(){
  var w = cv.width, hgt = cv.height;
  var cols = 5, rows = 4;
  var cw = w/cols, ch = hgt/rows;
  ctx.fillStyle = "#cfc6b4"; ctx.fillRect(0,0,w,hgt);
  for (var i = 0; i < SCENES.length; i++){
    var stage = GELS[i % GELS.length].hex;
    var gx = (i % cols) * cw, gy = Math.floor(i/cols) * ch;
    ctx.fillStyle = stage; ctx.fillRect(gx, gy, cw, ch);
    var spec = SCENES[i];
    var box = spec.motif.box || [100,100], bw = box[0], bh = box[1];
    var u = Math.min(cw*0.8/bw, ch*0.8/bh);
    ctx.save();
    ctx.translate(gx + cw/2, gy + ch/2);
    ctx.scale(u, u);
    ctx.translate(-bw/2, -bh/2);
    var shapes = spec.motif.shapes;
    for (var k = 0; k < shapes.length; k++) drawShape(shapes[k], stage);
    ctx.restore();
    ctx.fillStyle = INK; ctx.globalAlpha = 0.7;
    ctx.font = "11px sans-serif";
    ctx.fillText(i + " " + spec.motif.name, gx + 8, gy + 20);
    ctx.globalAlpha = 1;
  }
}

var params = new URLSearchParams(location.search);
var gridMode = params.get("grid") === "1";
resize();

if (gridMode){
  drawGrid();
} else {
  var sn = parseInt(params.get("scene") || "0", 10);
  if (sn >= 0 && sn < SCENES.length) sceneIndex = sn;
  var gn = parseInt(params.get("gel") || "0", 10);
  if (gn >= 0 && gn < GELS.length) gelPos = gn * SLOT;

  var last = performance.now();
  function tick(now){
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!scrubbing) gelPos = (gelPos + dt) % CYCLE;
    frame();
    requestAnimationFrame(tick);
  }

  function advance(){
    sceneIndex = (sceneIndex + 1) % SCENES.length;
  }

  /* Pointer: a still tap advances the scene; a drag scrubs the gel. */
  cv.addEventListener("pointerdown", function(ev){
    scrubbing = true; moved = false;
    downX = ev.clientX; downY = ev.clientY; downPos = gelPos;
    cv.setPointerCapture(ev.pointerId);
  });
  cv.addEventListener("pointermove", function(ev){
    if (!scrubbing) return;
    var dx = ev.clientX - downX, dy = ev.clientY - downY;
    if (Math.abs(dx) + Math.abs(dy) > 8) moved = true;
    if (moved) gelPos = (((downPos + dx / window.innerWidth * CYCLE * 0.5) % CYCLE) + CYCLE) % CYCLE;
  });
  function endPointer(){
    if (!scrubbing) return;
    scrubbing = false;
    if (!moved) advance();
  }
  cv.addEventListener("pointerup", endPointer);
  cv.addEventListener("pointercancel", function(){ scrubbing = false; });
  window.addEventListener("keydown", function(ev){
    if (ev.code === "Space" || ev.code === "ArrowRight"){ ev.preventDefault(); advance(); }
  });
  window.addEventListener("resize", resize);

  requestAnimationFrame(tick);
}
</script>
</body>
</html>
