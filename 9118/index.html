<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<!-- piece-9118-sinking-hour -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Sinking Hour</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #10142a; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #note {
    position: fixed; left: 14px; bottom: 12px; z-index: 2;
    font: 12px/1.4 Georgia, 'Times New Roman', serif; letter-spacing: 0.12em;
    color: rgba(255, 244, 224, 0.62); text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>

<body>
<canvas id="c"></canvas>
<div id="note">No. 9118 &middot; The Sinking Hour</div>
<script>
'use strict';
/* ===== driver core (verbatim from work/9118/driver.js) ===== */
// №9118 "The Sinking Hour" — driver core. Pure functions, no DOM.
// Shared verbatim between the node harness and the piece (index.html embeds this block).
'use strict';

const A_START = 38;      // degrees, sun altitude at cycle start
const A_END = -6;        // degrees, sun altitude at end (below horizon)
const CYCLE_S = 180;     // seconds for one full descent

// Seeded PRNG (mulberry32)
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Sun altitude in degrees at time t (seconds since cycle start).
function sunAltitude(t) {
  if (t <= 0) return A_START;
  if (t >= CYCLE_S) return A_END;
  const u = t / CYCLE_S;
  const eased = (1 - Math.cos(Math.PI * u)) / 2;
  return A_START + (A_END - A_START) * eased;
}

// Shadow length cast by a ridge of height h (px) at solar altitude a (degrees).
function shadowLength(h, a) {
  const amin = Math.max(a, 1.5) * Math.PI / 180;
  return h / Math.tan(amin);
}

// Wind speed in px/s at altitude a. Wind grows as the sun sinks.
function windSpeed(a) {
  return 40 + 3 * (A_START - a);
}

// Airborne-sand density factor at altitude a.
function streakDensity(a) {
  return 1 + (A_START - a) / 20;
}

// Sky palette indexed by altitude. Stops: [a, zenithRGB, horizonRGB]
const SKY_STOPS = [
  [38, [159, 195, 221], [234, 217, 174]],
  [24, [110, 140, 190], [240, 188, 110]],
  [12, [88, 105, 160],  [239, 148, 85]],
  [4,  [70, 80, 130],   [233, 115, 63]],
  [0,  [58, 64, 110],   [226, 98, 50]],
  [-6, [25, 29, 61],    [90, 55, 80]],
];

function lerp(a, b, u) { return a + (b - a) * u; }

function skyPalette(a) {
  const s = SKY_STOPS;
  if (a >= s[0][0]) return { zenith: s[0][1].slice(), horizon: s[0][2].slice() };
  for (let i = 0; i < s.length - 1; i++) {
    const a0 = s[i][0], a1 = s[i + 1][0];
    if (a <= a0 && a >= a1) {
      const u = (a0 - a) / (a0 - a1);
      const z = [0, 1, 2].map(k => Math.round(lerp(s[i][1][k], s[i + 1][1][k], u)));
      const h = [0, 1, 2].map(k => Math.round(lerp(s[i][2][k], s[i + 1][2][k], u)));
      return { zenith: z, horizon: h };
    }
  }
  const last = s[s.length - 1];
  return { zenith: last[1].slice(), horizon: last[2].slice() };
}

// Warmth index of a color: (R - B) / 255
function warmth(rgb) { return (rgb[0] - rgb[2]) / 255; }

// Sun screen position (px) at time t for a canvas of W x H.
// Descends along a gentle arc toward a setting point right of center.
function sunPos(t, W, H) {
  const a = sunAltitude(t);
  const u = (A_START - a) / (A_START - A_END); // 0 -> 1 across the cycle
  const x0 = 0.60 * W, y0 = 0.28 * H;
  const x1 = 0.76 * W, y1 = 0.74 * H; // sinks behind the near dune ridge
  return [lerp(x0, x1, u), lerp(y0, y1, u)];
}

// Vertical squash of the sun disc (atmospheric refraction) at altitude a.
function sunSquash(a) {
  if (a >= 10) return 1;
  if (a <= 0) return 0.55;
  return 1 - 0.45 * (1 - a / 10);
}

// Star visibility 0..1 (only once the sun is below the horizon).
function starAlpha(a) {
  return Math.min(1, Math.max(0, -a / 6));
}

// Dune field: nLayers ridges. Each layer: { baseY, amp1, f1, p1, amp2, f2, p2, tone }
// ridgeY(layer, x, W) gives the crest line in px.
function duneField(seed, nLayers) {
  const rnd = mulberry32(seed);
  const layers = [];
  for (let i = 0; i < nLayers; i++) {
    const depth = i / Math.max(1, nLayers - 1); // 0 = far, 1 = near
    layers.push({
      baseY: 0.52 + 0.36 * depth,
      amp1: (0.018 + 0.030 * depth),
      f1: 1.5 + rnd() * 2.5,
      p1: rnd() * Math.PI * 2,
      amp2: (0.006 + 0.014 * depth),
      f2: 4 + rnd() * 5,
      p2: rnd() * Math.PI * 2,
      tone: depth,
    });
  }
  return layers;
}

function ridgeY(layer, x, W, H) {
  return H * (layer.baseY
    + layer.amp1 * Math.sin((x / W) * Math.PI * 2 * layer.f1 + layer.p1)
    + layer.amp2 * Math.sin((x / W) * Math.PI * 2 * layer.f2 + layer.p2));
}

// Wind streak particle step. dt seconds. gust = {x, y, vx, vy, r} or null.
// Streaks always blow downwind (+x), with small vertical wobble.
function streakStep(p, dt, a, gust) {
  const v = windSpeed(a) * p.sf;
  let vx = v, vy = p.wob * Math.cos(p.ph);
  if (gust) {
    const dx = p.x - gust.x, dy = p.y - gust.y;
    const d2 = dx * dx + dy * dy;
    const infl = Math.exp(-d2 / (gust.r * gust.r));
    vx += gust.vx * infl;
    vy += gust.vy * infl;
  }
  // Driver guarantee: the prevailing wind always wins — streaks never stall,
  // reverse, or tilt more than 10° from horizontal.
  if (vx < 0.2 * v) vx = 0.2 * v;
  const maxVy = vx * 0.1763; // tan(10 deg)
  if (vy > maxVy) vy = maxVy; else if (vy < -maxVy) vy = -maxVy;
  p.x += vx * dt;
  p.y += vy * dt;
  p.ph += dt * 2;
  return p;
}

if (typeof module !== 'undefined') {
  module.exports = {
    A_START, A_END, CYCLE_S, mulberry32, sunAltitude, shadowLength,
    windSpeed, streakDensity, skyPalette, warmth, sunPos, sunSquash,
    starAlpha, duneField, ridgeY, streakStep, SKY_STOPS,
  };
}

/* ===== end driver core ===== */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildSky();
  for (const s of stars) { s.x = Math.random() * W; s.y = Math.random() * H * 0.48; }
  for (const p of streaks) { p.x = Math.min(p.x, W); p.y = Math.min(p.y, H); }
}
window.addEventListener('resize', resize);

// --- state ---
let seed = (Math.random() * 1e9) | 0;
let layers = [];
let tCycle = 0;                 // seconds into the dusk cycle
const NLAYERS = 5;
const streaks = [];
const stars = [];
let gust = null;                // {x, y, vx, vy, r, life}
let skyCache = null;

function reseed(newSeed) {
  seed = newSeed;
  layers = duneField(seed, NLAYERS);
  tCycle = 0;
  const rnd = mulberry32(seed ^ 0x9e37);
  streaks.length = 0;
  for (let i = 0; i < 420; i++) {
    streaks.push({
      x: rnd() * W, y: H * (0.56 + rnd() * 0.41),
      sf: 0.6 + rnd() * 0.8, wob: (rnd() - 0.5) * 26, ph: rnd() * 6.283,
      on: true,
    });
  }
  stars.length = 0;
  for (let i = 0; i < 130; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.48, r: 0.5 + Math.random() * 1.3, tw: Math.random() * 6.283 });
  }
}

function buildSky() { skyCache = null; }

function mix(c1, c2, u) {
  return [Math.round(c1[0] + (c2[0] - c1[0]) * u),
          Math.round(c1[1] + (c2[1] - c1[1]) * u),
          Math.round(c1[2] + (c2[2] - c1[2]) * u)];
}
function css(c, a) {
  return a === undefined ? 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'
                         : 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}

function drawSky(pal) {
  // full-height gradient sampled from the altitude palette; dunes cover the rest
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const stops = 12;
  for (let i = 0; i <= stops; i++) {
    const u = i / stops;
    g.addColorStop(u, css(mix(pal.zenith, pal.horizon, Math.pow(u, 1.35))));
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(a, t) {
  const sa = starAlpha(a);
  if (sa <= 0.01) return;
  for (const s of stars) {
    const tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.7 + s.tw));
    ctx.fillStyle = 'rgba(235,240,255,' + (sa * tw * 0.9).toFixed(3) + ')';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
}

function drawSun(a, t) {
  const p = sunPos(tCycle, W, H);
  const sq = sunSquash(a);
  const u = Math.min(1, Math.max(0, (A_START - a) / (A_START - 0))); // 0 high -> 1 at horizon
  const core = mix([255, 250, 232], [255, 122, 42], Math.pow(u, 0.8));
  const R = Math.min(W, H) * 0.055;
  // halo
  const haloR = R * (3.2 + 2.2 * u);
  const g = ctx.createRadialGradient(p[0], p[1], R * 0.4, p[0], p[1], haloR);
  g.addColorStop(0, css(core, 0.5));
  g.addColorStop(1, css(core, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p[0], p[1], haloR, 0, 6.283); ctx.fill();
  // disc, vertically squashed near the horizon (refraction)
  ctx.save();
  ctx.translate(p[0], p[1]);
  ctx.scale(1, sq);
  ctx.fillStyle = css(mix(core, [255, 255, 255], 0.25 * (1 - u)));
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.fill();
  ctx.restore();
}

function duneFill(layer, pal) {
  // far dunes: hazy, sky-tinted; near dunes: dark warm earth
  const d = layer.tone;
  const haze = mix(pal.horizon, pal.zenith, 0.35);
  const earth = [mix([96, 62, 44], [30, 20, 34], Math.min(1, Math.max(0, (10 - currentAlt) / 16)))][0];
  return mix(haze, earth, 0.25 + 0.75 * d);
}

function ridgePath(layer) {
  ctx.beginPath();
  const step = Math.max(4, W / 220);
  ctx.moveTo(-4, H + 4);
  for (let x = -4; x <= W + 4; x += step) ctx.lineTo(x, ridgeY(layer, x, W, H));
  ctx.lineTo(W + 4, H + 4);
  ctx.closePath();
}

function findCrests(layer) {
  // local maxima of the ridge with some prominence, spaced apart
  const step = 6, pts = [];
  for (let x = 0; x <= W; x += step) pts.push([x, ridgeY(layer, x, W, H)]);
  const crests = [];
  for (let i = 2; i < pts.length - 2; i++) {
    const y = pts[i][1];
    if (y < pts[i-1][1] && y < pts[i-2][1] && y <= pts[i+1][1] && y <= pts[i+2][1]) {
      const prom = Math.max(pts[i-2][1], pts[i+2][1]) - y;
      if (prom > H * 0.008) crests.push({ x: pts[i][0], y: y });
    }
  }
  return crests.filter((c, i) => i === 0 || c.x - crests[i-1].x > W * 0.03);
}

function drawDunes(pal, a) {
  for (let i = 0; i < layers.length; i++) {
    const layer = layers[i];
    ridgePath(layer);
    ctx.fillStyle = css(duneFill(layer, pal));
    ctx.fill();
    // crest highlight on the sunward side
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = css(mix(pal.horizon, [255, 255, 255], 0.35), 0.35);
    ctx.lineWidth = 2;
    ctx.beginPath();
    const step = Math.max(4, W / 220);
    for (let x = -4; x <= W + 4; x += step) {
      const y = ridgeY(layer, x, W, H);
      if (x === -4) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // lee-side shadow: a band hugging the ridge, deep at the crest and
    // tapering to the tip — its length is the driver's shadow function,
    // so shadows visibly race leftward as the sun sinks
    const hPx = H * (layer.amp1 + layer.amp2) * 2;
    const L = Math.min(W * 0.55, shadowLength(hPx, a));
    const alpha = 0.16 + 0.18 * Math.min(1, (A_START - a) / (A_START - A_END));
    ctx.fillStyle = 'rgba(16,12,28,' + alpha.toFixed(3) + ')';
    for (const c of findCrests(layer)) {
      const N = 24;
      ctx.beginPath();
      for (let k = 0; k <= N; k++) {
        const x = c.x - L * (k / N);
        const y = ridgeY(layer, x, W, H);
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      for (let k = N; k >= 0; k--) {
        const x = c.x - L * (k / N);
        const y = ridgeY(layer, x, W, H) + 4 + 30 * (1 - k / N);
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawStreaks(a, dt) {
  const target = Math.round(150 * streakDensity(a));
  const v = windSpeed(a);
  ctx.lineCap = 'round';
  for (let i = 0; i < streaks.length; i++) {
    const p = streaks[i];
    p.on = i < target;
    if (!p.on) continue;
    const x0 = p.x, y0 = p.y;
    streakStep(p, dt, a, gust);
    if (p.x > W + 40) { p.x = -40; p.y = H * (0.56 + Math.random() * 0.41); }
    if (p.y > H + 20) p.y = H * 0.90;
    if (p.y < H * 0.54) p.y = H * 0.90;
    const spd = Math.hypot(p.x - x0, p.y - y0) / Math.max(dt, 1e-4);
    const len = Math.min(90, spd * 0.055);
    const al = 0.06 + 0.30 * Math.min(1, spd / 190);
    ctx.strokeStyle = 'rgba(255,226,170,' + al.toFixed(3) + ')';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - len, p.y);
    ctx.stroke();
  }
}

// --- interaction: drag stirs the wind, tap reseeds and restarts the sun ---
let pdown = null;
canvas.addEventListener('pointerdown', (e) => {
  pdown = { x: e.clientX, y: e.clientY, t: performance.now(), lx: e.clientX, ly: e.clientY, moved: 0 };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!pdown) return;
  const dx = e.clientX - pdown.lx, dy = e.clientY - pdown.ly;
  pdown.moved += Math.abs(dx) + Math.abs(dy);
  pdown.lx = e.clientX; pdown.ly = e.clientY;
  if (pdown.moved > 12) {
    gust = { x: e.clientX, y: e.clientY, vx: dx * 22, vy: dy * 22, r: 150, life: 1 };
  }
});
function endPointer(e) {
  if (!pdown) return;
  const dtms = performance.now() - pdown.t;
  if (dtms < 350 && pdown.moved < 14) {
    reseed((Math.random() * 1e9) | 0);   // tap: new dunes, sun back to the top
  }
  pdown = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', () => { pdown = null; });

// --- main loop ---
let currentAlt = A_START;
let lastMs = performance.now();
function frame(nowMs) {
  let dt = (nowMs - lastMs) / 1000;
  lastMs = nowMs;
  if (dt > 0.1) dt = 0.1;
  tCycle += dt;
  const a = sunAltitude(tCycle);
  currentAlt = a;
  const pal = skyPalette(a);

  if (gust) {
    gust.life -= dt * 1.4;
    gust.vx *= (1 - dt * 1.2); gust.vy *= (1 - dt * 1.2);
    if (gust.life <= 0) gust = null;
  }

  drawSky(pal);
  drawStars(a, tCycle);
  drawSun(a, tCycle);
  drawDunes(pal, a);
  drawStreaks(a, dt);

  requestAnimationFrame(frame);
}

resize();
reseed((Math.random() * 1e9) | 0);
requestAnimationFrame(frame);
</script>
</body>
</html>
