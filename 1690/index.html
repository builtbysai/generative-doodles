<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tectonics Study</title>
<style>
html, body { margin: 0; padding: 0; background: #B9BCC0; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#B9BCC0';
var WALL = '#B9BCC0';
var WALL_SIDE = '#A8ABB0';
var FLOOR = '#9A9DA2';
var MADDER = '#A63A2E';
var INDIGO = '#2E3A6E';
var SAFFRON = '#D9A13B';
var CREAM = '#E8DCC0';
var BLACK = '#141210';
var PLATE = '#141210';
var PLATE_LINE = 'rgba(232,220,192,0.45)';
var TITLE_INK = '#E8DCC0';
var HINT_INK = '#E8DCC0';
var FIRST_T = 30;
/* DRIVER: a minimal grey gallery room recurses inside its own framed
   picture. A camera slowly pushes toward the frame on a smooth 90 s
   in-out cycle; every 90 s the rug reseeds to a new ornamental
   pattern, crossfaded over 2 s so the camera never jumps. The room
   is drawn recursively as a function: each framed picture contains
   the same room at a smaller scale, six passes deep. */
var PERIOD = 90;
var FADE_S = 2;
var MAX_DEPTH = 5;
var BASE_SEED = 937;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rugSeedAt(t) {
  var cyc = Math.floor(t / PERIOD);
  return BASE_SEED + cyc * 7919;
}
function rugPrevSeedAt(t) {
  var cyc = Math.floor(t / PERIOD);
  return BASE_SEED + (cyc - 1) * 7919;
}
function rugFadeAt(t) {
  var tc = ((t % PERIOD) + PERIOD) % PERIOD;
  return smooth(clamp(tc / FADE_S, 0, 1));
}
function zoomAt(t) {
  var tc = ((t % PERIOD) + PERIOD) % PERIOD;
  return 1 + 0.30 * (0.5 - 0.5 * Math.cos(TAU * tc / PERIOD));
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Centered geometric piece: square field on desktop, full-bleed on phones. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, s: s, w: s, h: s };
}
/* ---- rug: seeded ornamental tile generator, drawn in perspective bands ---- */
function rugWidthAt(v) {
  /* v: 0 at rug top (near horizon), 1 at rug bottom (foreground). */
  return 0.34 + 0.28 * v;
}
function drawRugPattern(r, seed) {
  var rng = mulberry32(seed);
  var x = r.x, y = r.y, w = r.w, h = r.h;
  var horizonY = y + h * 0.42;
  var topY = horizonY + h * 0.05;
  var botY = y + h * 0.97;
  var cx = x + w / 2;
  var accent = rng() < 0.5 ? SAFFRON : CREAM;
  var medAccent = rng() < 0.5 ? INDIGO : SAFFRON;
  /* Rug outline as a trapezoid path. */
  function rugPath() {
    var wt = rugWidthAt(0) * w, wb = rugWidthAt(1) * w;
    ctx.beginPath();
    ctx.moveTo(cx - wt / 2, topY);
    ctx.lineTo(cx + wt / 2, topY);
    ctx.lineTo(cx + wb / 2, botY);
    ctx.lineTo(cx - wb / 2, botY);
    ctx.closePath();
  }
  rugPath();
  ctx.fillStyle = MADDER;
  ctx.fill();
  /* Field: diamond lattice in perspective bands, clipped to the rug. */
  ctx.save();
  rugPath();
  ctx.clip();
  var BANDS = 16, b, v0, v1, y0, y1, wmid, n, i, dx, dy;
  for (b = 0; b < BANDS; b++) {
    v0 = b / BANDS; v1 = (b + 1) / BANDS;
    y0 = topY + (botY - topY) * v0;
    y1 = topY + (botY - topY) * v1;
    wmid = rugWidthAt((v0 + v1) / 2) * w;
    /* Border bands: indigo at both ends, saffron guard stripe inside. */
    if (b === 0 || b === BANDS - 1) {
      ctx.fillStyle = INDIGO;
      ctx.fillRect(cx - wmid / 2, y0, wmid, y1 - y0 + 1);
      continue;
    }
    if (b === 1 || b === BANDS - 2) {
      ctx.fillStyle = SAFFRON;
      ctx.fillRect(cx - wmid / 2, y0, wmid, y1 - y0 + 1);
      continue;
    }
    /* Field bands: row of small diamonds, spacing grows toward viewer. */
    dy = (y1 - y0) * 0.42;
    n = Math.max(2, Math.round(wmid / (w * 0.055)));
    for (i = 0; i < n; i++) {
      dx = (i + 0.5) / n;
      var px = cx + (dx - 0.5) * wmid;
      var py = (y0 + y1) / 2;
      var rr = Math.max(1.5, w * 0.016 * (0.7 + 0.6 * (v0 + v1) / 2));
      var col = (i + b) % 3 === 0 ? CREAM : ((i + b) % 3 === 1 ? INDIGO : accent);
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(px, py - rr);
      ctx.lineTo(px + rr, py);
      ctx.lineTo(px, py + rr);
      ctx.lineTo(px - rr, py);
      ctx.closePath();
      ctx.fill();
    }
  }
  /* Center medallion: nested diamonds at the rug's middle. */
  var my = topY + (botY - topY) * 0.52;
  var mw = rugWidthAt(0.52) * w;
  var mr = mw * 0.30;
  ctx.fillStyle = CREAM;
  ctx.beginPath();
  ctx.moveTo(cx, my - mr);
  ctx.lineTo(cx + mr, my);
  ctx.lineTo(cx, my + mr);
  ctx.lineTo(cx - mr, my);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = medAccent;
  ctx.beginPath();
  ctx.moveTo(cx, my - mr * 0.62);
  ctx.lineTo(cx + mr * 0.62, my);
  ctx.lineTo(cx, my + mr * 0.62);
  ctx.lineTo(cx - mr * 0.62, my);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = SAFFRON;
  ctx.beginPath();
  ctx.moveTo(cx, my - mr * 0.28);
  ctx.lineTo(cx + mr * 0.28, my);
  ctx.lineTo(cx, my + mr * 0.28);
  ctx.lineTo(cx - mr * 0.28, my);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  /* Rug outline stroke, so levels stay crisp against the floor. */
  rugPath();
  ctx.strokeStyle = INDIGO;
  ctx.lineWidth = Math.max(1, w * 0.004);
  ctx.stroke();
}
function drawRug(r, seedNow, seedPrev, fade) {
  if (fade >= 0.999) {
    drawRugPattern(r, seedNow);
    return;
  }
  if (fade <= 0.001) {
    drawRugPattern(r, seedPrev);
    return;
  }
  ctx.globalAlpha = Number((1 - fade).toFixed(4));
  drawRugPattern(r, seedPrev);
  ctx.globalAlpha = Number(fade.toFixed(4));
  drawRugPattern(r, seedNow);
  ctx.globalAlpha = 1;
}
/* ---- the room, drawn recursively: each framed picture holds the room again ---- */
function drawRoom(r, depth, t, seedNow, seedPrev, fade) {
  var x = r.x, y = r.y, w = r.w, h = r.h;
  var horizonY = y + h * 0.42;
  ctx.fillStyle = WALL;
  ctx.fillRect(x, y, w, h);
  /* Faint corner shading for depth. */
  ctx.fillStyle = WALL_SIDE;
  ctx.globalAlpha = 0.35;
  ctx.fillRect(x, y, w * 0.03, h);
  ctx.fillRect(x + w * 0.97, y, w * 0.03, h);
  ctx.globalAlpha = 1;
  /* Floor. */
  ctx.fillStyle = FLOOR;
  ctx.fillRect(x, horizonY, w, y + h - horizonY);
  /* Skirting line where wall meets floor. */
  ctx.strokeStyle = 'rgba(20,18,16,0.35)';
  ctx.lineWidth = Math.max(1, h * 0.002);
  ctx.beginPath();
  ctx.moveTo(x, horizonY + 0.5);
  ctx.lineTo(x + w, horizonY + 0.5);
  ctx.stroke();
  /* Rug, leading from the foreground to the frame. */
  drawRug(r, seedNow, seedPrev, fade);
  /* Framed picture on the far wall, center third of the room. */
  var fw = w / 3;
  var fh = fw * 0.78;
  var fx = x + (w - fw) / 2;
  var fy = horizonY - fh * 0.86;
  var frameT = Math.max(2, w * 0.012);
  var matT = Math.max(2, w * 0.010);
  ctx.fillStyle = BLACK;
  ctx.fillRect(fx, fy, fw, fh);
  ctx.fillStyle = CREAM;
  ctx.fillRect(fx + frameT, fy + frameT, fw - 2 * frameT, fh - 2 * frameT);
  var ix = fx + frameT + matT;
  var iy = fy + frameT + matT;
  var iw = fw - 2 * (frameT + matT);
  var ih = fh - 2 * (frameT + matT);
  if (depth < MAX_DEPTH) {
    drawRoom({ x: ix, y: iy, w: iw, h: ih }, depth + 1, t, seedNow, seedPrev, fade);
  } else {
    /* Deepest visible level: a flat grey panel with a rug sliver. */
    ctx.fillStyle = WALL;
    ctx.fillRect(ix, iy, iw, ih);
    ctx.fillStyle = FLOOR;
    ctx.fillRect(ix, iy + ih * 0.42, iw, ih * 0.58);
    ctx.fillStyle = MADDER;
    var sw = iw * 0.5;
    ctx.beginPath();
    ctx.moveTo(ix + (iw - sw * 0.55) / 2, iy + ih * 0.48);
    ctx.lineTo(ix + (iw + sw * 0.55) / 2, iy + ih * 0.48);
    ctx.lineTo(ix + (iw + sw) / 2, iy + ih * 0.97);
    ctx.lineTo(ix + (iw - sw) / 2, iy + ih * 0.97);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = BLACK;
    ctx.fillRect(ix + iw * 0.42, iy + ih * 0.10, iw * 0.16, ih * 0.20);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Tectonics Study').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Tectonics Study').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 28').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Tectonics Study', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 28', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var fr = fieldRect();
  var seedNow = rugSeedAt(t);
  var seedPrev = rugPrevSeedAt(t);
  var fade = rugFadeAt(t);
  var zoom = zoomAt(t);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* Camera push-in, zoomed about the frame center (room center, upper third). */
  var zx = fr.x + fr.w / 2;
  var zy = fr.y + fr.h * 0.30;
  ctx.save();
  ctx.translate(zx, zy);
  ctx.scale(zoom, zoom);
  ctx.translate(-zx, -zy);
  drawRoom(fr, 0, t, seedNow, seedPrev, fade);
  ctx.restore();
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    zoomAt: function (t) { return zoomAt(t); },
    rugSeedAt: function (t) { return rugSeedAt(t); },
    rugFadeAt: function (t) { return rugFadeAt(t); },
    levelCount: function () { return MAX_DEPTH + 1; },
    firstT: function () { return FIRST_T; }
  };
}
/* ---- frame one: t = 30, thirty seconds into the 90 s cycle ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
