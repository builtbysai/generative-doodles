<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calian, Species Study</title>
<style>
html, body { margin: 0; padding: 0; background: #05070f; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#05070f';
var PLATE = '#e8ecf2';
var INK = '#0a0e18';

var GRID = 64;
var CELL = WORLD / GRID;
var PHASE = 90;
var DT = 0.25;
var PERIOD = 150;
var SEED = 16610730;
var ZBASE = 1.9;
var ZMIN = 0.5;
var ZMAX = 8;
var SPECIES = [

  { name: 'rose', rgb: [205, 105, 125] },

  { name: 'teal', rgb: [63, 168, 160] },

var NSPECIES = 5;
var NSEEDS = 30;
var NTHREADS = 80;

var INK_RGB = hexRgb(INK);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;

}

/* ---- seeded layout: per-cell jitter, filament angles, noise lattice ---- */

      for (i = 0; i < GRID * GRID; i++) if (sp[i] !== 0) alive[sp[i]] = true;
      return Object.keys(alive).length;
    },
    occupied: function () {
      var n = 0, i;
      for (i = 0; i < GRID * GRID; i++) if (sp[i] !== 0) n++;
      return n;
    },
    colonies: function () { return countColonies(); },
    stats: function () {
      return { seeds: seedCells, echoes: echoes, spores: spores, simT: simT };
    },
    gridSignature: function () {
      var s = 0, i;
      for (i = 0; i < GRID * GRID; i++) s = (s + sp[i] * 1000 + Math.round(st[i] * 100)) % 1000000007;
      return s;
    },
    zoomLevels: function () { return 3; },
    camState: function () { return { x: cam.x, y: cam.y, zm: cam.zm }; },
    zoomAtProbe: function (mx, my, f) { zoomAt(mx, my, f); return cam.zm; }
  };
}
/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
