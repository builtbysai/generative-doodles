<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Murmur of the Cells</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0A26; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
/* DRIVER: one grid, two senses. The sound IS the grid made audible:
   a visible bloom spreading and the chord thickening are the same
   event, a cell changing state past a threshold. */
var GROUND = '#0A0A26';
var GREEN = [57, 255, 122];
var AMBER = [255, 179, 71];
var VIOLET = [157, 123, 255];
var STATE_COLS = [GREEN, AMBER, VIOLET];
var HUE_FREQ = [329.63, 261.63, 392.00];
var SEED = 1641001;
/* Brian's Brain on a fixed grid: 0 off, 1 on, 2 dying.
   on -> dying, dying -> off, off -> on with exactly 2 live neighbours.
   Portrait viewports get the transposed grid so cells stay near-square
   instead of stretching into vertical slivers. */
var COLS = 120, ROWS = 68;
(function orientGrid() {
  var w = 0, h = 0;
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.width) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;
    }
  }
  if (w > 0 && h > w) { COLS = 68; ROWS = 120; }
})();
var STEP_DT = 0.15, PHASE = 6.0;
var NLAT = 20;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Full-bleed grid: the composition is the whole viewport, phones and
   desktop alike. No frame, no UI beyond the title and hint plates. */
function compRect() {
  return { x: 0, y: 0, w: VW, h: VH };
}
/* ---- cellular automaton: fixed seed, pure function of step ---- */
var classGrid = new Uint8Array(COLS * ROWS);
var cur = new Uint8Array(COLS * ROWS);
var nxt = new Uint8Array(COLS * ROWS);
var caStep = 0;
function seedGrids() {
  var rng = mulberry32(SEED);
  var i;
  for (i = 0; i < COLS * ROWS; i++) {
    classGrid[i] = Math.floor(rng() * 3);
    cur[i] = rng() < 0.12 ? 1 : 0;
  }
  caStep = 0;
}
seedGrids();
/* 20x20 sounding lattice, fixed positions over the grid. */
var latX = [], latY = [], flashTime = [], flashHue = [];
(function buildLattice() {
  var i, j;
  for (j = 0; j < NLAT; j++) {
    for (i = 0; i < NLAT; i++) {
      latX.push(Math.floor((i + 0.5) * COLS / NLAT));
      latY.push(Math.floor((j + 0.5) * ROWS / NLAT));
      flashTime.push(-1);
      flashHue.push(0);
    }
  }
})();
function liveNeighbours(x, y) {
  var n = 0, dx, dy, nx, ny;
  for (dy = -1; dy <= 1; dy++) {
    for (dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      nx = (x + dx + COLS) % COLS;
      ny = (y + dy + ROWS) % ROWS;
      if (cur[ny * COLS + nx] === 1) n++;
    }
  }
  return n;
}
/* Advance one CA generation; returns the sounding triggers of the step
   (lattice points whose state change crossed the threshold). */
function advanceStep(stepTime) {
  var x, y, idx, n, s, trigs = [];
  for (y = 0; y < ROWS; y++) {
    for (x = 0; x < COLS; x++) {
      idx = y * COLS + x;
      s = cur[idx];
      if (s === 1) nxt[idx] = 2;
      else if (s === 2) nxt[idx] = 0;
      else {
        n = liveNeighbours(x, y);
        nxt[idx] = (n === 2) ? 1 : 0;
      }
    }
  }
  var tmp = cur; cur = nxt; nxt = tmp;
  caStep++;
  var p, li, delta, bright;
  for (p = 0; p < NLAT * NLAT; p++) {
    li = latY[p] * COLS + latX[p];
    /* Delta of the lattice point between generations: birth is a full
       change (1.0), on-to-dying a strong change (0.6), dying-to-off a
       weak one (0.3). Threshold 0.5: births and on-deaths sound. */
    if (cur[li] === 1 && nxt[li] === 0) delta = 1.0;
    else if (cur[li] === 2 && nxt[li] === 1) delta = 0.6;
    else delta = 0;
    if (delta >= 0.5) {
      bright = 0.4 + 0.6 * (liveNeighbours(latX[p], latY[p]) / 8);
      trigs.push({ p: p, delta: delta, bright: bright, hue: classGrid[li] });
      flashTime[p] = stepTime;
      flashHue[p] = classGrid[li];
    }
  }
  return trigs;
}
/* Bring the CA to step n. Rewinds from the seed if asked for an
   earlier step, so draw(t) stays a pure function of piece time. */
function ensureStep(n, sound) {
  var adv = 0, trigs, i;
  if (n < caStep) {
    seedGrids();
    for (i = 0; i < flashTime.length; i++) { flashTime[i] = -1; }
  }
  while (caStep < n) {
    trigs = advanceStep((caStep + 1) * STEP_DT);
    adv++;
    if (sound && adv <= 2) soundTriggers(trigs);
  }
}
/* ---- audio: lazy WebAudio, created inside the tap only ---- */
var AC = null, masterGain = null, padOsc = [], padGain = null;
var audioOn = false, activeVoices = 0, chordIdx = -1;
/* Human-theory harmony layer: Am9, Fmaj7, Cmaj7, G6, one chord
   every 8 seconds of piece time, fixed authored table. */
var CHORDS = [
  [110.00, 164.81, 246.94],
  [87.31, 130.81, 164.81],
  [130.81, 164.81, 246.94],
  [98.00, 123.47, 164.81]
];
function initAudio() {
  if (audioOn) return;
  var Ctor = null;
  if (typeof window !== 'undefined') {
    if (typeof window.AudioContext !== 'undefined') Ctor = window.AudioContext;
    else if (typeof window.webkitAudioContext !== 'undefined') Ctor = window.webkitAudioContext;
  }
  if (!Ctor) return;
  try {
    AC = new Ctor();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.9;
    masterGain.connect(AC.destination);
    var filt = AC.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 900;
    filt.connect(masterGain);
    padGain = AC.createGain();
    padGain.gain.value = 0.0;
    padGain.connect(filt);
    var i, o, g;
    for (i = 0; i < 3; i++) {
      o = AC.createOscillator();
      o.type = 'sine';
      o.frequency.value = CHORDS[0][i];
      g = AC.createGain();
      g.gain.value = 0.33;
      o.connect(g); g.connect(padGain);
      o.start();
      padOsc.push(o);
    }
    padGain.gain.setTargetAtTime(0.05, AC.currentTime, 1.5);
    /* The wave sound: white noise through a bandpass, released by
       the tap, swelling gently and settling as a low bed. */
    var len = AC.sampleRate * 2;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    var nrng = mulberry32(1641777);
    for (i = 0; i < len; i++) d[i] = nrng() * 2 - 1;
    var noise = AC.createBufferSource();
    noise.buffer = buf; noise.loop = true;
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.6;
    var ng = AC.createGain();
    ng.gain.value = 0.0;
    ng.gain.setTargetAtTime(0.025, AC.currentTime + 0.2, 1.2);
    noise.connect(bp); bp.connect(ng); ng.connect(masterGain);
    noise.start();
    audioOn = true;
    chordIdx = 0;
    if (AC.resume) AC.resume();
  } catch (e) { AC = null; audioOn = false; }
}
function triggerVoice(trig) {
  if (!audioOn || !AC || activeVoices >= 24) return;
  var base = HUE_FREQ[trig.hue];
  var freq = base * (trig.bright > 0.7 ? 2 : 1);
  var px = (latX[trig.p] + 0.5) / COLS;
  var o = AC.createOscillator();
  o.type = 'triangle';
  o.frequency.value = freq;
  var g = AC.createGain();
  var t0 = AC.currentTime;
  var atk = 0.005 + 0.02 * (1 - trig.bright);
  var dec = 0.25 + 0.55 * trig.bright;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.06 + 0.05 * trig.bright, t0 + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + atk + dec);
  o.connect(g);
  if (typeof AC.createStereoPanner === 'function') {
    var pan = AC.createStereoPanner();
    pan.pan.value = clamp(px * 2 - 1, -1, 1);
    g.connect(pan); pan.connect(masterGain);
  } else {
    g.connect(masterGain);
  }
  o.start(t0);
  o.stop(t0 + atk + dec + 0.05);
  activeVoices++;
  o.onended = function () { activeVoices--; };
}
function soundTriggers(trigs) {
  var i, top;
  /* Loudest changes first; at most 10 voices per generation. */
  trigs.sort(function (a, b) { return b.delta - a.delta; });
  top = Math.min(trigs.length, 10);
  for (i = 0; i < top; i++) triggerVoice(trigs[i]);
}
function updateChord(t) {
  if (!audioOn || !AC) return;
  var ci = Math.floor(t / 8) % CHORDS.length;
  if (ci === chordIdx) return;
  chordIdx = ci;
  var i, now = AC.currentTime;
  for (i = 0; i < 3; i++) {
    padOsc[i].frequency.setTargetAtTime(CHORDS[ci][i], now, 0.8);
  }
}
/* ---- drawing ---- */
function drawCell(x, y, s, col) {
  var cw = VW / COLS, ch = VH / ROWS;
  var px = x * cw, py = y * ch;
  var inset = Math.min(cw, ch) * 0.07;
  if (s === 1) {
    ctx.fillStyle = 'rgb(' + col[0] + ',' + col[1] + ',' + col[2] + ')';
  } else {
    ctx.fillStyle = rgba(col, 0.35);
  }
  ctx.fillRect(px + inset, py + inset, cw - inset * 2, ch - inset * 2);
}
function drawCircle(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function drawFlashes(t, rect) {
  var cw = VW / COLS, ch = VH / ROWS;
  var p, age, a, cx, cy, r;
  for (p = 0; p < NLAT * NLAT; p++) {
    if (flashTime[p] < 0) continue;
    age = t - flashTime[p];
    if (age < 0 || age > 0.5) continue;
    a = 1 - age / 0.5;
    cx = (latX[p] + 0.5) * cw;
    cy = (latY[p] + 0.5) * ch;
    r = Math.min(cw, ch) * (0.55 + 1.6 * age / 0.5);
    /* The bloom: a white flash that spreads outward and fades, the
       visible half of the same sounding event. */
    ctx.fillStyle = rgba([255, 255, 255], a * 0.9);
    drawCircle(cx, cy, Math.min(cw, ch) * 0.55);
    ctx.fill();
    ctx.strokeStyle = rgba([255, 255, 255], a * 0.45);
    ctx.lineWidth = 1;
    drawCircle(cx, cy, r);
    ctx.stroke();
  }
}
function drawText(rect) {
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  var titlePx = isPhone ? 15 : 19;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Murmur of the Cells').width > rect.w - 48) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Murmur of the Cells').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 10').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = cxm - plateW / 2, plateY = 10;
  ctx.fillStyle = rgba([10, 10, 38], 0.78);
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba([124, 255, 178], 0.4);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = '#8AFFC0';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Murmur of the Cells', cxm, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba([138, 255, 192], 0.75);
  ctx.fillText('2006 · 07 · 10', cxm, plateY + 7 + titlePx + 3);
  var hint = audioOn ? 'The grid is speaking.' : 'Tap to let the grid speak.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = rect.y + rect.h - hintPlateH - 10;
  ctx.fillStyle = rgba([10, 10, 38], 0.78);
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = audioOn ? rgba([124, 255, 178], 0.85) : rgba([124, 255, 178], 0.4);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba([185, 255, 217], 0.9);
  ctx.fillText(hint, cxm, hintPlateY + 7);
}
/* ---- the only interaction: tap to begin the sound ---- */
function onPointerDown(e) {
  initAudio();
  if (e && e.preventDefault) e.preventDefault();
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('mousedown', onPointerDown);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function draw(t) {
  size();
  var rect = compRect();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var step = Math.floor(t / STEP_DT);
  ensureStep(step, audioOn);
  updateChord(t);
  var x, y, idx, s;
  for (y = 0; y < ROWS; y++) {
    for (x = 0; x < COLS; x++) {
      idx = y * COLS + x;
      s = cur[idx];
      if (s !== 0) drawCell(x, y, s, STATE_COLS[classGrid[idx]]);
    }
  }
  drawFlashes(t, rect);
  drawText(rect);
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    latticeCount: function () { return NLAT * NLAT; },
    stepAt: function (t) { return Math.floor(t / STEP_DT); },
    liveCount: function () {
      var n = 0, i;
      for (i = 0; i < COLS * ROWS; i++) if (cur[i] === 1) n++;
      return n;
    },
    audioOn: function () { return audioOn; },
    drawAt: function (t) { draw(t); }
  };
}
/* ---- frame one: fixed phase, fixed seed, no wall clock ---- */
size();
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
