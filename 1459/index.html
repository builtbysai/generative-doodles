<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Five Episodes, One Orlando</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #d8d2c4; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random: frame one must be reproducible.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1459000);
  // Seeded decorative values, fixed at load so every render agrees.
  var shelfItems = [];
  for (var si = 0; si < 5; si++) { shelfItems.push(rnd()); }
  var bannerSway = [];
  for (var bi = 0; bi < 4; bi++) { bannerSway.push(rnd()); }

  function r4(x) { return Math.round(x * 10000) / 10000; }
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + r4(a) + ')';
  }

  var INK = '#1a1a1a';
  var IVORY = '#f2ead8';
  var SCARLET = '#c1272d';
  var GOLD = '#d9a441';
  var TEAL = '#2e6f6a';

  // Five eras: flat background tone, props, and a wholesale costume.
  var ERAS = [
    { bg: '#d8d2c4', name: 'store' },
    { bg: '#3a2e28', name: 'hall' },
    { bg: '#1e1e24', name: 'chamber' },
    { bg: '#7a1f2b', name: 'sideshow' },
    { bg: '#e8c9a8', name: 'square' }
  ];

  var W = 0, H = 0;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    if (w !== W || h !== H) { W = w; H = h; canvas.width = w; canvas.height = h; }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', size);
      window.visualViewport.addEventListener('scroll', size);
    }
    window.addEventListener('resize', size);
  }

  // State: era index is discrete; drag scrubs a float that snaps on release.
  var era = 0;
  var eraFloat = 0;
  var dragging = false;
  var dragStartX = 0;
  var dragStartFloat = 0;
  var rippleStart = -10; // piece time when the last era change happened

  function isPhone() {
    if (typeof window !== 'undefined' && window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) { return true; }
    }
    return H > W * 1.15;
  }

  // ---- drawing helpers (dots as filled rects or own-beginPath arcs) ----
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }
  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function poly(points, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) { ctx.lineTo(points[i][0], points[i][1]); }
    ctx.closePath();
    ctx.fill();
  }
  function outlineRect(x, y, w, h, color, lw) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.strokeRect(x, y, w, h);
  }

  // Ripple displacement: applied to the figure layer ONLY, never the background.
  // t is piece time in seconds.
  function rippleAmp(t) {
    var dt = t - rippleStart;
    if (dt < 0 || dt > 0.8) { return 0; }
    return r4((1 - dt / 0.8) * 7);
  }
  function offX(y, t) {
    var a = rippleAmp(t);
    if (a === 0) { return 0; }
    return a * Math.sin(y * 0.045 + (t - rippleStart) * 22);
  }

  // ---- era backgrounds and props (flat panels, never gradients) ----
  function drawBackground(e, w, h) {
    var u = Math.min(w, h);
    rect(0, 0, w, h, ERAS[e].bg);
    // Ground line + soft shadow under the figure (ink at flat alpha).
    ctx.fillStyle = rgba(INK, 0.14);
    ctx.beginPath();
    ctx.moveTo(w / 2 - 0.16 * u, h * 0.86);
    ctx.ellipse(w / 2, h * 0.86, 0.16 * u, 0.018 * h, 0, 0, Math.PI * 2);
    ctx.fill();
    if (e === 0) {
      // Department store: shelves with auctioned myth items, podium.
      rect(w * 0.08, h * 0.30, w * 0.20, h * 0.012, TEAL);
      rect(w * 0.72, h * 0.30, w * 0.20, h * 0.012, TEAL);
      for (var i = 0; i < 5; i++) {
        var sx = w * (0.10 + i * 0.035) + shelfItems[i] * w * 0.01;
        rect(sx, h * 0.235 - shelfItems[i] * h * 0.02, w * 0.018, h * 0.065, i % 2 ? GOLD : SCARLET);
      }
      // Podium at right.
      poly([[w * 0.76, h * 0.62], [w * 0.88, h * 0.62], [w * 0.86, h * 0.78], [w * 0.78, h * 0.78]], SCARLET);
      rect(w * 0.80, h * 0.56, w * 0.04, h * 0.06, GOLD);
    } else if (e === 1) {
      // Medieval hall: stone arches and banners.
      outlineRect(w * 0.06, h * 0.18, w * 0.16, h * 0.55, GOLD, Math.max(2, u * 0.006));
      outlineRect(w * 0.78, h * 0.18, w * 0.16, h * 0.55, GOLD, Math.max(2, u * 0.006));
      rect(w * 0.10, h * 0.20, w * 0.08, h * 0.30, SCARLET);
      rect(w * 0.82, h * 0.20, w * 0.08, h * 0.30, TEAL);
    } else if (e === 2) {
      // Inquisition chamber: tall arch, two candles.
      outlineRect(w * 0.10, h * 0.12, w * 0.80, h * 0.68, GOLD, Math.max(2, u * 0.005));
      rect(w * 0.16, h * 0.62, w * 0.012, h * 0.14, GOLD);
      rect(w * 0.82, h * 0.62, w * 0.012, h * 0.14, GOLD);
      dot(w * 0.166, h * 0.60, Math.max(3, u * 0.008), GOLD);
      dot(w * 0.826, h * 0.60, Math.max(3, u * 0.008), GOLD);
    } else if (e === 3) {
      // Carnival sideshow: tent stripes and bunting.
      for (var k = 0; k < 8; k++) {
        poly([[w * 0.05 + k * w * 0.115, h * 0.10], [w * 0.05 + (k + 1) * w * 0.115, h * 0.10], [w * 0.05 + (k + 0.5) * w * 0.115, h * 0.20]], k % 2 ? IVORY : SCARLET);
      }
      for (var b = 0; b < 4; b++) {
        var bx = w * (0.12 + b * 0.22);
        poly([[bx, h * 0.24], [bx + w * 0.06, h * 0.24], [bx + w * 0.03, h * 0.30 + bannerSway[b] * h * 0.02]], b % 2 ? GOLD : TEAL);
      }
    } else {
      // Festival square: bunting and a market stall awning.
      for (var f = 0; f < 6; f++) {
        var fx = w * (0.08 + f * 0.15);
        poly([[fx, h * 0.16], [fx + w * 0.07, h * 0.16], [fx + w * 0.035, h * 0.23]], f % 3 === 0 ? SCARLET : (f % 3 === 1 ? GOLD : TEAL));
      }
      poly([[w * 0.70, h * 0.30], [w * 0.94, h * 0.30], [w * 0.90, h * 0.38], [w * 0.74, h * 0.38]], SCARLET);
      rect(w * 0.72, h * 0.38, w * 0.008, h * 0.30, GOLD);
      rect(w * 0.92, h * 0.38, w * 0.008, h * 0.30, GOLD);
    }
  }

  // ---- the figure: body constant, costume layer per era ----
  // Geometry in fractions of H; figure spans 0.15H..0.85H (70% of frame height).
  function drawFigure(e, t, w, h) {
    var cx = w / 2;
    var u = Math.min(w, h);
    var ox = function (y) { return offX(y, t); };
    var hr = h * 0.055;             // head radius
    var hy = h * 0.215;             // head center y
    var shoulderY = h * 0.285;
    var waistY = h * 0.52;
    var hemY = h * 0.85;
    var torsoW = u * 0.11;

    // Shadow is in the background layer; figure starts with legs/arms (body).
    // Legs (constant stance, ivory skin at ankles only; trousers drawn by costume).
    var legW = u * 0.038;
    var legTop = h * 0.52;
    var legBot = h * 0.84;
    // Arms: constant pose, slightly away from the torso.
    var armW = u * 0.032;
    var armTop = shoulderY + h * 0.01;
    var armBot = h * 0.60;

    // Costume backs (gowns/robes cover legs wholesale).
    if (e === 1) {
      // Medieval gown: long teal trapezoid, scarlet trim, gold belt.
      poly([[cx + ox(shoulderY) - torsoW * 0.9, shoulderY], [cx + ox(shoulderY) + torsoW * 0.9, shoulderY],
            [cx + ox(hemY) + torsoW * 1.5, hemY], [cx + ox(hemY) - torsoW * 1.5, hemY]], TEAL);
      rect(cx + ox(waistY) - torsoW * 1.05, waistY, torsoW * 2.1, h * 0.018, GOLD);
      rect(cx + ox(shoulderY) - torsoW * 0.9, shoulderY, torsoW * 1.8, h * 0.012, SCARLET);
    } else if (e === 2) {
      // Inquisitor black robe with hood and gold pendant.
      poly([[cx + ox(shoulderY) - torsoW * 0.85, shoulderY], [cx + ox(shoulderY) + torsoW * 0.85, shoulderY],
            [cx + ox(hemY) + torsoW * 1.35, hemY], [cx + ox(hemY) - torsoW * 1.35, hemY]], INK);
      rect(cx + ox(waistY) - torsoW * 0.95, waistY, torsoW * 1.9, h * 0.014, SCARLET);
      dot(cx + ox(h * 0.40), h * 0.40, Math.max(3, u * 0.009), GOLD);
    } else if (e === 3) {
      // Sideshow spangles: scarlet bodice + teal sash, spangle dots.
      poly([[cx + ox(shoulderY) - torsoW, shoulderY], [cx + ox(shoulderY) + torsoW, shoulderY],
            [cx + ox(waistY) + torsoW * 0.8, waistY], [cx + ox(waistY) - torsoW * 0.8, waistY]], SCARLET);
      rect(cx + ox(waistY) - torsoW * 0.8, waistY, torsoW * 1.6, h * 0.02, TEAL);
      dot(cx + ox(h * 0.36), h * 0.36, Math.max(2, u * 0.006), GOLD);
      dot(cx + ox(h * 0.36) - torsoW * 0.5, h * 0.42, Math.max(2, u * 0.006), GOLD);
      dot(cx + ox(h * 0.36) + torsoW * 0.5, h * 0.42, Math.max(2, u * 0.006), GOLD);
      dot(cx + ox(h * 0.36), h * 0.48, Math.max(2, u * 0.006), GOLD);
    } else if (e === 4) {
      // Festival finery: gold dress with scarlet sash and teal trim.
      poly([[cx + ox(shoulderY) - torsoW * 0.95, shoulderY], [cx + ox(shoulderY) + torsoW * 0.95, shoulderY],
            [cx + ox(hemY) + torsoW * 1.45, hemY], [cx + ox(hemY) - torsoW * 1.45, hemY]], GOLD);
      rect(cx + ox(waistY) - torsoW * 1.1, waistY, torsoW * 2.2, h * 0.02, SCARLET);
      rect(cx + ox(hemY - h * 0.02) - torsoW * 1.45, hemY - h * 0.02, torsoW * 2.9, h * 0.012, TEAL);
    }

    // Legs for non-gown eras (modern suit: teal trousers; sideshow/finery keep legs).
    if (e === 0 || e === 3 || e === 4) {
      var trouser = (e === 0) ? TEAL : (e === 3 ? SCARLET : GOLD);
      rect(cx + ox(legTop) - legW * 1.25, legTop, legW, legBot - legTop, trouser);
      rect(cx + ox(legTop) + legW * 0.25, legTop, legW, legBot - legTop, trouser);
      // Shoes: flat rects.
      rect(cx + ox(legBot) - legW * 1.25, legBot, legW, h * 0.014, INK);
      rect(cx + ox(legBot) + legW * 0.25, legBot, legW, h * 0.014, INK);
    }

    // Arms (constant pose; sleeves take the costume colour).
    var sleeve = (e === 0) ? SCARLET : (e === 1 ? TEAL : (e === 2 ? INK : (e === 3 ? SCARLET : GOLD)));
    rect(cx + ox(armTop) - torsoW - armW, armTop, armW, armBot - armTop, sleeve);
    rect(cx + ox(armTop) + torsoW, armTop, armW, armBot - armTop, sleeve);
    // Hands: ivory dots (filled rects, never bare arcs without moveTo).
    rect(cx + ox(armBot) - torsoW - armW, armBot, armW, armW * 0.8, IVORY);
    rect(cx + ox(armBot) + torsoW, armBot, armW, armW * 0.8, IVORY);

    // Torso for the modern suit (era 0): scarlet blazer, ivory shirt, gold tie.
    if (e === 0) {
      rect(cx + ox(shoulderY) - torsoW, shoulderY, torsoW * 2, waistY - shoulderY, SCARLET);
      poly([[cx + ox(shoulderY) - torsoW * 0.28, shoulderY], [cx + ox(shoulderY) + torsoW * 0.28, shoulderY],
            [cx + ox(shoulderY), shoulderY + h * 0.09]], IVORY);
      rect(cx + ox(shoulderY) - u * 0.008, shoulderY + h * 0.01, u * 0.016, h * 0.075, GOLD);
      rect(cx + ox(waistY) - torsoW, waistY, torsoW * 2, h * 0.014, INK);
    }

    // Head and face: NEVER change across eras (same stance, same face).
    dot(cx + ox(hy), hy, hr, IVORY);
    // Hair cap: constant, flat ink shape above the face.
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(cx + ox(hy - hr) - hr, hy - hr * 0.2);
    ctx.arc(cx + ox(hy), hy, hr, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
    // Eyes and mouth: constant, as filled rects.
    var eyeY = hy + hr * 0.1;
    rect(cx + ox(eyeY) - hr * 0.45, eyeY, hr * 0.16, hr * 0.16, INK);
    rect(cx + ox(eyeY) + hr * 0.29, eyeY, hr * 0.16, hr * 0.16, INK);
    rect(cx + ox(hy + hr * 0.55) - hr * 0.3, hy + hr * 0.55, hr * 0.6, hr * 0.10, INK);

    // Era headpieces (part of the costume, not the face).
    if (e === 1) {
      // Gold circlet + scarlet veil sides.
      rect(cx + ox(hy - hr) - hr * 0.9, hy - hr * 0.95, hr * 1.8, hr * 0.22, GOLD);
      rect(cx + ox(hy) - hr * 1.05, hy - hr * 0.7, hr * 0.22, hr * 1.1, SCARLET);
      rect(cx + ox(hy) + hr * 0.83, hy - hr * 0.7, hr * 0.22, hr * 1.1, SCARLET);
    } else if (e === 2) {
      // Hood up: ink hood framing the face.
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.moveTo(cx + ox(hy) - hr * 1.15, hy + hr * 0.9);
      ctx.arc(cx + ox(hy), hy, hr * 1.15, Math.PI * 0.95, Math.PI * 2.05);
      ctx.closePath();
      ctx.fill();
      // Re-draw face and hair cap over the hood so the face itself never changes:
      // face dot first, hair cap over its top half, then the features.
      dot(cx + ox(hy), hy, hr, IVORY);
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.moveTo(cx + ox(hy - hr) - hr, hy - hr * 0.2);
      ctx.arc(cx + ox(hy), hy, hr, Math.PI, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      rect(cx + ox(eyeY) - hr * 0.45, eyeY, hr * 0.16, hr * 0.16, INK);
      rect(cx + ox(eyeY) + hr * 0.29, eyeY, hr * 0.16, hr * 0.16, INK);
      rect(cx + ox(hy + hr * 0.55) - hr * 0.3, hy + hr * 0.55, hr * 0.6, hr * 0.10, INK);
    } else if (e === 3) {
      // Gold headpiece band with spangles.
      rect(cx + ox(hy - hr) - hr * 0.95, hy - hr * 0.9, hr * 1.9, hr * 0.24, GOLD);
      dot(cx + ox(hy - hr * 0.8), hy - hr * 0.78, Math.max(2, u * 0.006), SCARLET);
      dot(cx + ox(hy - hr * 0.8) + hr * 0.9, hy - hr * 0.78, Math.max(2, u * 0.006), SCARLET);
    } else if (e === 4) {
      // Festival crown: gold points.
      poly([[cx + ox(hy - hr) - hr * 0.8, hy - hr * 0.7], [cx + ox(hy - hr) - hr * 0.4, hy - hr * 1.25], [cx + ox(hy - hr), hy - hr * 0.7]], GOLD);
      poly([[cx + ox(hy - hr) - hr * 0.1, hy - hr * 0.7], [cx + ox(hy - hr) + hr * 0.35, hy - hr * 1.25], [cx + ox(hy - hr) + hr * 0.8, hy - hr * 0.7]], GOLD);
    }
  }

  // ---- frame ----
  var booted = false;
  function draw(t) {
    size();
    var w = W, h = H;
    // Page ground takes the piece's own background colour.
    if (typeof document !== 'undefined' && document.body && document.body.style) {
      document.body.style.background = ERAS[era].bg;
    }
    drawBackground(era, w, h);
    drawFigure(era, t, w, h);
  }

  // Synchronous first frame at a constant phase (era 0, store, modern suit).
  draw(0);
  booted = true;

  // ---- interaction: drag horizontally to scrub eras, snap on release ----
  function setEraFromFloat(f) {
    var clamped = Math.max(0, Math.min(4, f));
    var idx = Math.round(clamped);
    if (idx !== era) {
      era = idx;
      rippleStart = lastT;
    }
    eraFloat = clamped;
  }
  var lastT = 0;
  function onDown(ev) {
    dragging = true;
    dragStartX = (ev.clientX !== undefined) ? ev.clientX : 0;
    dragStartFloat = eraFloat;
    if (ev.preventDefault) { ev.preventDefault(); }
  }
  function onMove(ev) {
    if (!dragging) { return; }
    var x = (ev.clientX !== undefined) ? ev.clientX : 0;
    setEraFromFloat(dragStartFloat + (x - dragStartX) / (W * 0.18));
    draw(lastT);
  }
  function onUp() {
    if (!dragging) { return; }
    dragging = false;
    eraFloat = era; // snap to the displayed era; release holds the era
    draw(lastT);
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // rAF loop: plain function declaration; typeof-guarded (node-canvas has no rAF).
  var startMs = null;
  function loop(ts) {
    if (startMs === null) { startMs = ts; }
    lastT = (ts - startMs) / 1000;
    draw(lastT);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }

  // QA hooks (used by the probe harness; harmless in the shipped piece).
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      era: function () { return era; },
      setEra: function (i) { era = i; eraFloat = i; rippleStart = lastT; draw(lastT); },
      dragTo: function (x0, x1) {
        onDown({ clientX: x0, preventDefault: function () {} });
        onMove({ clientX: x1 });
        onUp();
      },
      setTime: function (t) { lastT = t; }
    };
  }
})();
</script>
</body>
</html>
