<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incroci: Five Dates Each</title>
<style>
  html, body { margin: 0; padding: 0; background: #F4F0E4; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* Incroci: Five Dates Each — 99 strangers, five dates each, painted as
   wobbled black polylines across three rails (day / month / year).
   Frame one is a synchronous draw at a fixed paint offset (t = 33 s,
   about 55% through the painting). All later state is a closed-form
   function of piece time plus the recorded tap/drag event lists. */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

var PAPER="#F4F0E4", INK="#1A1A1A", GLOW="#D9A441", RAIL="#8A8578", CAP="#23211C";
var NCONTRIB=99, NDATES=5;
var PAINT=60, HOLD=15, FADE=6, CYCLE=PAINT+HOLD+FADE;
var PHASE0=33; /* frame one: 55% through the painting */
var YEAR_MIN=1938, YEAR_MAX=2028, NOW_YEAR=2026;

var canvas=document.getElementById("c");
var ctx=canvas.getContext("2d");

function isPhone(){
  try{
    var sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0;
    if(sw&&sh&&Math.min(sw,sh)<700) return true;
  }catch(e){}
  var w=viewW(), h=viewH();
  return h>w*1.15 && w<700;
}
function viewW(){ return (window.visualViewport&&window.visualViewport.width)||window.innerWidth||800; }
function viewH(){ return (window.visualViewport&&window.visualViewport.height)||window.innerHeight||600; }

/* ---------------- contributor synthesis (seeded) ---------------- */
var STAGE_NAMES=[["first word","the beginning"],["left home","the move"],["the wedding","a child"],["the storm","the loss"]];

function genContributors(seed){
  var rnd=mulberry32(seed);
  var out=[];
  for(var i=0;i<NCONTRIB;i++){
    var by=1940+Math.floor(rnd()*71);           /* 1940..2010 */
    var bm=1+Math.floor(rnd()*12);
    var bd=1+Math.floor(rnd()*31);
    var span=NOW_YEAR-by;
    var fr=[0.05,0.30,0.55,0.85];
    var dates=[{d:bd,m:bm,y:by}];
    var prevY=by;
    for(var k=0;k<4;k++){
      var y=by+Math.max(1,Math.round(span*fr[k]+(rnd()*4-2)));
      if(y<prevY) y=prevY;
      if(y>NOW_YEAR) y=NOW_YEAR;
      prevY=y;
      dates.push({d:1+Math.floor(rnd()*31), m:1+Math.floor(rnd()*12), y:y});
    }
    var names=[];
    for(var s=0;s<4;s++) names.push(STAGE_NAMES[s][Math.floor(rnd()*2)]);
    out.push({
      dates:dates, names:names,
      weight:1.5+rnd()*2.0,
      /* wobble parameters per date, in normalized units */
      wob: dates.map(function(){
        return {
          c1:(rnd()*2-1), c2:(rnd()*2-1),          /* control-point offsets */
          p1:rnd()*6.2832, p2:rnd()*6.2832,
          f1:2+Math.floor(rnd()*3), f2:4+Math.floor(rnd()*4),
          a1:0.6+rnd()*0.7, a2:0.3+rnd()*0.5
        };
      })
    });
  }
  return out;
}

/* ---------------- state ---------------- */
var generation=0;
var contributors=genContributors(938001);
var clockStart=nowMs(), clockOffset=PHASE0;
var taps=[];        /* {type:'select', idx, t} resolved at draw from selection */
var selection=null; /* {idx, t} piece-time of tap */
var smears=[];      /* {x,y,dx,dy,t} recorded drag samples, normalized coords */
var lastTapReal=0, lastTapPos=null;

function nowMs(){ return (typeof performance!=="undefined"&&performance.now)?performance.now():0; }
function pieceT(){ return clockOffset+(nowMs()-clockStart)/1000; }

/* ---------------- geometry ---------------- */
function rails(W,H){
  var top=H*0.07, bot=H*0.86;
  return {
    dayX:W*0.14, monY:H*0.50, yearX:W*0.86,
    top:top, bot:bot,
    monX0:W*0.30, monX1:W*0.70
  };
}
function dayY(d,R){ return R.top+(d-1)/30*(R.bot-R.top); }
function monX(m,R){ return R.monX0+(m-1)/11*(R.monX1-R.monX0); }
function yearY(y,R){ return R.top+(y-YEAR_MIN)/(YEAR_MAX-YEAR_MIN)*(R.bot-R.top); }

var ptsCache={key:"",data:null};
function buildPoints(W,H){
  var key=W+"x"+H+"g"+generation;
  if(ptsCache.key===key) return ptsCache.data;
  var R=rails(W,H), amp=Math.min(W,H)*0.0045;
  var data=contributors.map(function(c){
    return c.dates.map(function(dt,di){
      var w=c.wob[di];
      var A={x:R.dayX, y:dayY(dt.d,R)};
      var B={x:monX(dt.m,R), y:R.monY};
      var C={x:R.yearX, y:yearY(dt.y,R)};
      var cA={x:(A.x+B.x)/2 + w.c1*W*0.03, y:(A.y+B.y)/2 + w.c2*H*0.05};
      var cB={x:(B.x+C.x)/2 - w.c2*W*0.03, y:(B.y+C.y)/2 + w.c1*H*0.05};
      var pts=[], SEG=32;
      for(var i=0;i<=SEG*2;i++){
        var u=i/(SEG*2), x,y;
        if(u<=0.5){
          var s=u*2, iu=1-s;
          x=iu*iu*A.x+2*iu*s*cA.x+s*s*B.x;
          y=iu*iu*A.y+2*iu*s*cA.y+s*s*B.y;
        }else{
          var s2=(u-0.5)*2, iu2=1-s2;
          x=iu2*iu2*B.x+2*iu2*s2*cB.x+s2*s2*C.x;
          y=iu2*iu2*B.y+2*iu2*s2*cB.y+s2*s2*C.y;
        }
        /* hand wobble: perpendicular ripple, zero at the three anchors */
        var env=Math.sin(Math.PI*(u<=0.5?u*2:(u-0.5)*2)); /* zero at all three rail anchors */
        var wob=(Math.sin(u*6.2832*w.f1+w.p1)*w.a1+Math.sin(u*6.2832*w.f2+w.p2)*w.a2)*amp*env;
        /* perpendicular of the whole path is roughly vertical-ish; offset on y for
           the first span and mixed for the second — use a fixed diagonal normal */
        x+=wob*0.6; y+=wob*0.8;
        pts.push({x:x,y:y});
      }
      return pts;
    });
  });
  ptsCache={key:key,data:data};
  return data;
}

/* paint schedule: date j of contributor i */
function paintStart(i,j){ return (i*NDATES+j)/(NCONTRIB*NDATES)*(PAINT-2); }
var STROKE=1.4;
function paintFrac(i,j,lt){
  var f=(lt-paintStart(i,j))/STROKE;
  return f<0?0:(f>1?1:f);
}

/* smudge: closed-form offset field from recorded drag samples */
function smudgeAt(x,y,t){
  var ox=0, oy=0;
  for(var k=0;k<smears.length;k++){
    var s=smears[k], dt=t-s.t;
    if(dt<0||dt>4) continue;
    var dx=x-s.x, dy=y-s.y, d2=dx*dx+dy*dy;
    var infl=Math.exp(-d2/(2*0.006))*Math.exp(-dt/1.4)*0.8;
    ox+=s.dx*infl; oy+=s.dy*infl;
  }
  var m=Math.sqrt(ox*ox+oy*oy), MAX=0.05;
  if(m>MAX){ ox*=MAX/m; oy*=MAX/m; }
  return {x:ox,y:oy};
}

/* ---------------- audio (lazy, gesture-only) ---------------- */
var AC=null, noiseGain=null, chimedSet={};
function ensureAudio(){
  if(AC) return;
  try{
    if(typeof AudioContext==="undefined"&&typeof webkitAudioContext==="undefined") return;
    var Ctor=typeof AudioContext!=="undefined"?AudioContext:webkitAudioContext;
    AC=new Ctor();
    var len=AC.sampleRate*2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    var last=0;
    for(var i=0;i<len;i++){ var w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3; }
    var src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    var bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=900; bp.Q.value=0.6;
    noiseGain=AC.createGain(); noiseGain.gain.value=0;
    src.connect(bp); bp.connect(noiseGain); noiseGain.connect(AC.destination);
    src.start();
  }catch(e){ AC=null; }
}
var lastChime=0;
function chime(t){
  if(!AC||!noiseGain) return;
  if(t-lastChime<0.3) return;
  lastChime=t;
  try{
    var o=AC.createOscillator(), g=AC.createGain();
    o.type="sine"; o.frequency.value=1560+Math.random()*240;
    var rt=AC.currentTime;
    g.gain.setValueAtTime(0.0,rt);
    g.gain.linearRampToValueAtTime(0.035,rt+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,rt+0.7);
    o.connect(g); g.connect(AC.destination);
    o.start(rt); o.stop(rt+0.75);
  }catch(e){}
}

/* ---------------- drawing ---------------- */
function fmt2(n){ return (n<10?"0":"")+n; }

function draw(t){
  var W=viewW(), H=viewH();
  if(canvas.width!==W||canvas.height!==H){ canvas.width=W; canvas.height=H; }
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);

  var R=rails(W,H);
  var lt=((t%CYCLE)+CYCLE)%CYCLE;
  var globalA=1;
  if(lt>PAINT+HOLD) globalA=1-(lt-PAINT-HOLD)/FADE;
  var paintT=Math.min(lt,PAINT);

  var allPts=buildPoints(W,H);
  var scale=Math.min(W,H)/720;
  var selActive=selection&&(t-selection.t)<10;
  var selIdx=selActive?selection.idx:-1;

  /* crossing glow counts among fully painted dates */
  var dayC={}, monC={}, yrC={}, i, j;
  for(i=0;i<NCONTRIB;i++) for(j=0;j<NDATES;j++){
    if(paintFrac(i,j,paintT)>=1){
      var dt=contributors[i].dates[j];
      dayC[dt.d]=(dayC[dt.d]||0)+1;
      monC[dt.m]=(monC[dt.m]||0)+1;
      yrC[dt.y]=(yrC[dt.y]||0)+1;
    }
  }
  var shimmer=(lt>=PAINT&&lt<=PAINT+HOLD)?(0.85+0.15*Math.sin(t*1.6)):1;
  function glow(x,y,count,phase){
    if(count<2) return;
    var a=Math.min(0.42,0.035*count)*globalA*shimmer*(0.9+0.1*Math.sin(t*1.6+phase));
    if(a<=0.004) return;
    var r=(3+count*0.55)*scale+2;
    ctx.fillStyle=GLOW;
    ctx.globalAlpha=a*0.35; ctx.beginPath(); ctx.arc(x,y,r*2.1,0,6.2832); ctx.fill();
    ctx.globalAlpha=a*0.6;  ctx.beginPath(); ctx.arc(x,y,r*1.35,0,6.2832); ctx.fill();
    ctx.globalAlpha=a;      ctx.beginPath(); ctx.arc(x,y,r*0.7,0,6.2832); ctx.fill();
    ctx.globalAlpha=1;
    if(AC&&count>=6){
      var key=Math.round(x)+":"+Math.round(y)+":g"+generation+":c"+Math.floor(t/CYCLE);
      if(!chimedSet[key]){ chimedSet[key]=1; chime(t); }
    }
  }
  for(var d=1;d<=31;d++) glow(R.dayX, dayY(d,R), dayC[d]||0, d*0.7);
  for(var m=1;m<=12;m++) glow(monX(m,R), R.monY, monC[m]||0, m*1.3);
  for(var yk in yrC) glow(R.yearX, yearY(+yk,R), yrC[yk], (+yk)*0.31);

  /* polylines */
  var anyPainting=false;
  for(i=0;i<NCONTRIB;i++){
    var c=contributors[i];
    for(j=0;j<NDATES;j++){
      var f=paintFrac(i,j,paintT);
      if(f<=0) continue;
      if(f<1) anyPainting=true;
      var pts=allPts[i][j];
      var n=Math.max(2,Math.ceil(f*(pts.length-1)));
      var isSel=(i===selIdx);
      var a=0.72*globalA;
      if(selActive) a=isSel?0.97:(0.16*globalA);
      ctx.strokeStyle=INK; ctx.globalAlpha=a;
      ctx.lineWidth=(c.weight+(isSel?1.6:0))*scale;
      ctx.lineJoin="round"; ctx.lineCap="round";
      ctx.beginPath();
      for(var p=0;p<n;p++){
        var pt=pts[p];
        var sm=smudgeAt(pt.x/W,pt.y/H,t);
        var X=pt.x+sm.x*W, Y=pt.y+sm.y*H;
        if(p===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
      }
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

  /* rails last, so all three anchors stay legible over the painted mass */
  ctx.strokeStyle=RAIL; ctx.lineWidth=Math.max(1,1.5*scale); ctx.globalAlpha=0.85;
  ctx.beginPath();
  ctx.moveTo(R.dayX,R.top); ctx.lineTo(R.dayX,R.bot);
  ctx.moveTo(R.monX0,R.monY); ctx.lineTo(R.monX1,R.monY);
  ctx.moveTo(R.yearX,R.top); ctx.lineTo(R.yearX,R.bot);
  ctx.stroke();
  ctx.beginPath();
  var tk=5*scale+2;
  [[R.dayX,R.top],[R.dayX,R.bot],[R.yearX,R.top],[R.yearX,R.bot]].forEach(function(p){
    ctx.moveTo(p[0]-tk,p[1]); ctx.lineTo(p[0]+tk,p[1]);
  });
  ctx.moveTo(R.monX0,R.monY-tk); ctx.lineTo(R.monX0,R.monY+tk);
  ctx.moveTo(R.monX1,R.monY-tk); ctx.lineTo(R.monX1,R.monY+tk);
  ctx.stroke();
  ctx.globalAlpha=1;

  /* brush sound follows painting activity */
  if(noiseGain){
    try{ noiseGain.gain.setTargetAtTime(anyPainting?0.05:0.0, AC.currentTime, 0.2); }catch(e){}
  }

  /* bottom line + caption */
  var hand='"Segoe Print","Bradley Hand","Comic Sans MS",cursive';
  ctx.fillStyle=CAP; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  if(selActive){
    var cc=contributors[selIdx], b=cc.dates[0];
    var cap="born "+fmt2(b.d)+"."+fmt2(b.m)+"."+b.y+
      " · "+cc.names[0]+" "+cc.dates[1].y+
      " · "+cc.names[1]+" "+cc.dates[2].y+
      " · "+cc.names[2]+" "+cc.dates[3].y+
      " · "+cc.names[3]+" "+cc.dates[4].y;
    ctx.font=(15*scale+3)+"px "+hand;
    var capY=H*0.925;
    if(ctx.measureText(cap).width>W*0.94){
      /* wrap on the middle separator */
      var parts=cap.split(" · ");
      var line1=parts.slice(0,3).join(" · "), line2=parts.slice(3).join(" · ");
      ctx.fillText(line1,W/2,capY-16*scale-4);
      ctx.fillText(line2,W/2,capY);
    }else{
      ctx.fillText(cap,W/2,capY);
    }
  }
  ctx.font=(16*scale+3)+"px "+hand;
  ctx.fillText("99 strangers, 5 dates each", W/2, H*0.965);

  if(typeof requestAnimationFrame!=="undefined"&&draw._live){
    requestAnimationFrame(function(){ draw(pieceT()); });
  }
}

/* ---------------- interaction ---------------- */
var pDown=null;
function ptOf(e){
  var r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left), y:(e.clientY-r.top)};
}
function nearestContributor(x,y,W,H){
  var allPts=buildPoints(W,H), best=-1, bd=1e18;
  for(var i=0;i<NCONTRIB;i++) for(var j=0;j<NDATES;j++){
    var pts=allPts[i][j];
    for(var p=0;p<pts.length;p+=2){
      var dx=pts[p].x-x, dy=pts[p].y-y, d2=dx*dx+dy*dy;
      if(d2<bd){ bd=d2; best=i; }
    }
  }
  return best;
}
canvas.addEventListener("pointerdown",function(e){
  ensureAudio();
  if(AC&&AC.state==="suspended"){ try{AC.resume();}catch(err){} }
  pDown={x:e.clientX,y:e.clientY,t:pieceT(),moved:false,lx:e.clientX,ly:e.clientY};
});
canvas.addEventListener("pointermove",function(e){
  if(!pDown) return;
  var dx=e.clientX-pDown.lx, dy=e.clientY-pDown.ly;
  if(Math.abs(e.clientX-pDown.x)+Math.abs(e.clientY-pDown.y)>7) pDown.moved=true;
  if(pDown.moved){
    var W=viewW(), H=viewH();
    smears.push({x:e.clientX/W, y:e.clientY/H, dx:dx/W, dy:dy/H, t:pieceT()});
    if(smears.length>48) smears.splice(0,smears.length-48);
  }
  pDown.lx=e.clientX; pDown.ly=e.clientY;
});
canvas.addEventListener("pointerup",function(e){
  if(!pDown) return;
  var wasDrag=pDown.moved;
  pDown=null;
  if(wasDrag) return;
  var rt=nowMs();
  var pos=ptOf(e);
  if(lastTapReal&&rt-lastTapReal<350&&lastTapPos&&Math.abs(pos.x-lastTapPos.x)<30&&Math.abs(pos.y-lastTapPos.y)<30){
    /* double tap: new strangers, repaint */
    generation++;
    contributors=genContributors(938001+generation*7919);
    ptsCache.key="";
    smears=[]; selection=null; chimedSet={};
    clockStart=nowMs(); clockOffset=0;
    lastTapReal=0; lastTapPos=null;
    return;
  }
  lastTapReal=rt; lastTapPos=pos;
  var idx=nearestContributor(pos.x,pos.y,viewW(),viewH());
  if(idx>=0) selection={idx:idx, t:pieceT()};
});
canvas.addEventListener("pointercancel",function(){ pDown=null; });

function onResize(){ draw(pieceT()); }
if(window.visualViewport&&window.visualViewport.addEventListener) window.visualViewport.addEventListener("resize",onResize);
window.addEventListener("resize",onResize);

/* frame one: synchronous, fixed phase; then go live if rAF exists */
draw(PHASE0);
draw._live=true;
if(typeof requestAnimationFrame!=="undefined"){
  requestAnimationFrame(function(){ draw(pieceT()); });
}
</script>
</body>
</html>
