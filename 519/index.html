<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Garden</title>
<style>
  html, body { margin: 0; padding: 0; background: #F7F2E4; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var DW = 1080, DH = 1080;              // design stage, square logic
  var PHASE0 = 2.35;                     // constant first-frame phase, seconds
  var CREAM = '#F7F2E4';                 // ground
  var SPROUT = '#1A5A3A';                // sprout ink / creature body
  var INK = '#20301F';                   // creature face, hint
  var PALETTE = ['#E6392B', '#F0A02B', '#2AA6A0', '#F0608E',
                 '#8A5FB0', '#2B4FB0', '#E8722A'];
  var LETTER_CHARS = ['Z', 'B', 'K', 'V', 'M', 'O', 'F', 'R', 'P', 'T'];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- hand-drawn glyph alphabet ----------
  // Each glyph: list of strokes; each stroke a list of [x, y] in a 100x100 box
  // (y down, 0 = cap top, 100 = baseline). Arcs are pre-flattened polylines.
  function arcPts(cx, cy, rx, ry, a0, a1, n) {
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var a = a0 + (a1 - a0) * (i / n);
      pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
    }
    return pts;
  }
  var GLYPHS = {
    A: [[[6, 96], [50, 6], [94, 96]], [[27, 62], [73, 62]]],
    B: [[[24, 6], [24, 96]],
        arcPts(24, 28, 30, 22, -Math.PI / 2, Math.PI / 2, 10),
        arcPts(24, 68, 34, 26, -Math.PI / 2, Math.PI / 2, 10)],
    C: [arcPts(54, 50, 42, 46, 0.96, Math.PI * 2 - 0.96, 20)],
    D: [[[24, 6], [24, 96]], arcPts(24, 50, 52, 46, -Math.PI / 2, Math.PI / 2, 14)],
    E: [[[76, 8], [24, 8], [24, 96], [78, 96]], [[24, 50], [64, 50]]],
    F: [[[78, 8], [24, 8], [24, 96]], [[24, 48], [62, 48]]],
    G: [arcPts(54, 50, 42, 46, 0.96, Math.PI * 2 - 0.96, 20),
        [[58, 56], [94, 56], [94, 82]]],
    H: [[[22, 6], [22, 96]], [[78, 6], [78, 96]], [[22, 51], [78, 51]]],
    K: [[[24, 6], [24, 96]], [[76, 8], [26, 52]], [[34, 44], [78, 96]]],
    L: [[[26, 6], [26, 94], [78, 94]]],
    M: [[[10, 96], [10, 8], [50, 58], [90, 8], [90, 96]]],
    N: [[[14, 96], [14, 8], [86, 96], [86, 8]]],
    O: [arcPts(50, 50, 40, 46, 0, Math.PI * 2, 24)],
    P: [[[24, 96], [24, 6]], arcPts(24, 28, 32, 22, -Math.PI / 2, Math.PI / 2, 10)],
    R: [[[24, 96], [24, 6]], arcPts(24, 28, 32, 22, -Math.PI / 2, Math.PI / 2, 10),
        [[44, 48], [78, 96]]],
    S: [[[80, 20], [62, 6], [36, 8], [20, 22], [26, 38], [48, 47],
         [70, 55], [82, 70], [72, 88], [46, 96], [22, 86]]],
    T: [[[8, 10], [92, 10]], [[50, 10], [50, 96]]],
    U: [[[16, 6], [15, 50], [22, 78], [38, 93], [50, 95], [62, 93],
         [78, 78], [85, 50], [84, 6]]],
    V: [[[8, 6], [50, 96], [92, 6]]],
    Z: [[[14, 10], [86, 10], [14, 92], [88, 92]]]
  };

  function segDist(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay;
    var len2 = dx * dx + dy * dy;
    var t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    if (t < 0) t = 0; if (t > 1) t = 1;
    var ex = ax + dx * t - px, ey = ay + dy * t - py;
    return Math.sqrt(ex * ex + ey * ey);
  }

  // ---------- scene ----------
  var seed = 519007;
  try {
    var m = /[?&]seed=(\d+)/.exec(location.search || '');
    if (m) seed = parseInt(m[1], 10) >>> 0;
  } catch (e) { /* fixed seed stands */ }

  var scene = null;
  function buildScene(s) {
    var rng = mulberry32(s);
    var i, j;

    // --- letter placement: seeded rejection sampling, no overlaps ---
    var chars = LETTER_CHARS.slice();
    for (i = chars.length - 1; i > 0; i--) {
      j = Math.floor(rng() * (i + 1));
      var tc = chars[i]; chars[i] = chars[j]; chars[j] = tc;
    }
    var count = 10;
    var placed = [];
    for (var n = 0; n < count; n++) {
      var size = 148 + rng() * 66;                    // 148..214 stage px tall
      var r = size * 0.60;
      var px = 0, py = 0, ok = false;
      for (var attempt = 0; attempt < 3000 && !ok; attempt++) {
        px = r + 26 + rng() * (DW - 2 * r - 52);
        py = r + 34 + rng() * (DH - 2 * r - 60);
        ok = true;
        for (var q = 0; q < placed.length; q++) {
          var ddx = px - placed[q].x, ddy = py - placed[q].y;
          var need = r + placed[q].r + 26;
          if (ddx * ddx + ddy * ddy < need * need) { ok = false; break; }
        }
      }
      if (!ok) continue;
      placed.push({ ch: chars[n], x: px, y: py, size: size, r: r,
                    rot: (rng() * 2 - 1) * 0.13, phase: n * 0.7 + rng() * 0.2 });
    }

    // --- colours: no two adjacent letters share a colour ---
    for (i = 0; i < placed.length; i++) {
      var order = PALETTE.slice();
      for (j = order.length - 1; j > 0; j--) {
        var k = Math.floor(rng() * (j + 1));
        var tp = order[j]; order[j] = order[k]; order[k] = tp;
      }
      var banned = {};
      for (j = 0; j < placed.length; j++) {
        if (j === i || !placed[j].color) continue;
        var ax = placed[i].x - placed[j].x, ay = placed[i].y - placed[j].y;
        var adj = (placed[i].r + placed[j].r) * 1.9;
        if (ax * ax + ay * ay < adj * adj) banned[placed[j].color] = true;
      }
      var col = order[0];
      for (j = 0; j < order.length; j++) {
        if (!banned[order[j]]) { col = order[j]; break; }
      }
      placed[i].color = col;
    }

    // --- per-letter hand wobble + crayon specks masked onto the strokes ---
    var LW = 17;                                      // stroke width, glyph units
    for (i = 0; i < placed.length; i++) {
      var L = placed[i];
      L.strokes = GLYPHS[L.ch].map(function (stroke) {
        return stroke.map(function (pt) {
          return [pt[0] + (rng() * 2 - 1) * 1.7, pt[1] + (rng() * 2 - 1) * 1.7];
        });
      });
      L.specks = [];
      var guard = 0;
      while (L.specks.length < 110 && guard++ < 2600) {
        var sx = -6 + rng() * 112, sy = -6 + rng() * 112;
        var best = 1e9;
        for (var s2 = 0; s2 < L.strokes.length; s2++) {
          var st = L.strokes[s2];
          for (var p2 = 0; p2 + 1 < st.length; p2++) {
            var dd = segDist(sx, sy, st[p2][0], st[p2][1], st[p2 + 1][0], st[p2 + 1][1]);
            if (dd < best) best = dd;
          }
        }
        if (best <= LW / 2 - 1.2) {
          L.specks.push([sx, sy, 1.1 + rng() * 1.9, rng() < 0.55 ? 0 : 1]);
        }
      }
      L.hx = L.x; L.hy = L.y;                          // home = placement
    }

    // --- sprouts in the gaps: jittered grid, kept clear of every letter ---
    var sprouts = [];
    var pitch = 104;
    for (var gy = pitch * 0.5; gy < DH - 20; gy += pitch) {
      for (var gx = pitch * 0.5; gx < DW - 20; gx += pitch) {
        if (rng() < 0.14) continue;
        var jx = gx + (rng() * 2 - 1) * 30;
        var jy = gy + (rng() * 2 - 1) * 30;
        if (jx < 200 && jy < 96) continue;             // keep the hint corner clear
        var clear = true;
        for (i = 0; i < placed.length; i++) {
          var cx = jx - placed[i].x, cy = jy - placed[i].y;
          var needS = placed[i].r + 30;
          if (cx * cx + cy * cy < needS * needS) { clear = false; break; }
        }
        if (!clear) continue;
        sprouts.push({ x: jx, y: jy, kind: Math.floor(rng() * 4),
                       rot: rng() * Math.PI * 2, sc: 0.8 + rng() * 0.45 });
      }
    }

    // --- ground crayon grain ---
    var groundSpecks = [];
    for (i = 0; i < 460; i++) {
      groundSpecks.push([rng() * DW, rng() * DH, 1.2 + rng() * 2.0]);
    }

    return { letters: placed, sprouts: sprouts, groundSpecks: groundSpecks };
  }
  scene = buildScene(seed);

  // ---------- viewport ----------
  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    return [w, h];
  }
  function isPhone() {
    var sz = viewSize(), w = sz[0], h = sz[1];
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }
  var lastScale = 1, lastOx = 0, lastOy = 0;

  // ---------- drawing ----------
  function bobOf(L, t) { return Math.sin(t * 1.15 + L.phase) * 6; }

  function drawLetter(L, t, lifted) {
    var bob = (drag && drag.L === L) ? 0 : bobOf(L, t);
    ctx.save();
    ctx.translate(L.x, L.y + bob);
    ctx.rotate(L.rot);
    var sc = L.size / 100;
    ctx.scale(sc, sc);
    ctx.translate(-50, -50);
    ctx.strokeStyle = L.color;
    ctx.fillStyle = L.color;
    ctx.lineWidth = 17;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // two slightly offset passes for the hand-drawn body
    var offs = [[0, 0], [1.6, -1.2]];
    for (var p = 0; p < 2; p++) {
      ctx.save();
      ctx.translate(offs[p][0], offs[p][1]);
      for (var s = 0; s < L.strokes.length; s++) {
        var stroke = L.strokes[s];
        ctx.beginPath();
        for (var i = 0; i < stroke.length; i++) {
          if (i === 0) ctx.moveTo(stroke[i][0], stroke[i][1]);
          else ctx.lineTo(stroke[i][0], stroke[i][1]);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
    // crayon grain on the letter body
    for (var q = 0; q < L.specks.length; q++) {
      var sp = L.specks[q];
      ctx.globalAlpha = sp[3] === 0 ? 0.10 : 0.13;
      ctx.fillStyle = sp[3] === 0 ? '#141414' : CREAM;
      ctx.fillRect(sp[0], sp[1], sp[2], sp[2]);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (lifted) { /* dragged letter drawn last by caller order */ }
    return bob;
  }

  function drawSprout(sp) {
    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.rotate(sp.rot);
    ctx.scale(sp.sc, sp.sc);
    ctx.strokeStyle = SPROUT;
    ctx.fillStyle = SPROUT;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (sp.kind === 0) {                                // dot cluster
      var dots = [[0, -8], [-9, 6], [9, 6]];
      for (var i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.arc(dots[i][0], dots[i][1], 4.4, 0, Math.PI * 2); ctx.fill();
      }
    } else if (sp.kind === 1) {                         // asterisk star
      ctx.lineWidth = 4;
      for (var r2 = 0; r2 < 5; r2++) {
        var a = r2 / 5 * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(-Math.cos(a) * 12, -Math.sin(a) * 12);
        ctx.lineTo(Math.cos(a) * 12, Math.sin(a) * 12);
        ctx.stroke();
      }
    } else if (sp.kind === 2) {                         // spiral
      ctx.lineWidth = 3.6;
      ctx.beginPath();
      for (var th = 0; th <= Math.PI * 3.4; th += 0.3) {
        var rr = 1.5 + th * 1.15;
        var x = Math.cos(th) * rr, y = Math.sin(th) * rr;
        if (th === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    } else {                                            // tiny leaf on a stem
      ctx.lineWidth = 3.4;
      ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, -2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.quadraticCurveTo(13, -8, 10, -20);
      ctx.quadraticCurveTo(1, -14, 0, -2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 4);
      ctx.quadraticCurveTo(-12, -1, -10, -13);
      ctx.quadraticCurveTo(-1, -8, 0, 4);
      ctx.fill();
    }
    ctx.restore();
  }

  // tallest = the letter whose top edge sits highest on the stage right now
  function tallestLetter(t) {
    var best = null, bestTop = 1e18;
    for (var i = 0; i < scene.letters.length; i++) {
      var L = scene.letters[i];
      var bob = (drag && drag.L === L) ? 0 : bobOf(L, t);
      var top = L.y + bob - L.size * 0.52;
      if (top < bestTop) { bestTop = top; best = L; }
    }
    return { L: best, top: bestTop };
  }

  function drawCreature(t) {
    var host = tallestLetter(t);
    var L = host.L;
    var bob = (drag && drag.L === L) ? 0 : bobOf(L, t);
    var cxp = L.x, cyp = L.y + bob - L.size * 0.52;
    ctx.save();
    ctx.translate(cxp, cyp);
    // little feet
    ctx.strokeStyle = SPROUT;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-11, -2); ctx.lineTo(-11, 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(11, -2); ctx.lineTo(11, 3); ctx.stroke();
    // rounded body: two dots and a bent line for a face, nothing more
    ctx.fillStyle = SPROUT;
    ctx.beginPath();
    ctx.moveTo(-21, -4);
    ctx.quadraticCurveTo(-22, -34, 0, -35);
    ctx.quadraticCurveTo(22, -34, 21, -4);
    ctx.quadraticCurveTo(10, 2, 0, 2);
    ctx.quadraticCurveTo(-10, 2, -21, -4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.arc(-7, -21, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -21, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = CREAM;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(-5, -13);
    ctx.quadraticCurveTo(0, -9.5, 5, -13);
    ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    var sz = viewSize(), w = sz[0], h = sz[1];
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var phone = isPhone(); // square stage letterboxes on phones; ground stays the cream
    void phone;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, w, h);

    var s = Math.min(w / DW, h / DH);
    var ox = (w - DW * s) / 2, oy = (h - DH * s) / 2;
    lastScale = s; lastOx = ox; lastOy = oy;
    ctx.setTransform(s, 0, 0, s, ox, oy);

    // ground crayon grain
    ctx.globalAlpha = 0.045;
    ctx.fillStyle = '#141414';
    for (var i = 0; i < scene.groundSpecks.length; i++) {
      var g = scene.groundSpecks[i];
      ctx.fillRect(g[0], g[1], g[2], g[2]);
    }
    ctx.globalAlpha = 1;

    // sprouts in the gaps
    for (i = 0; i < scene.sprouts.length; i++) drawSprout(scene.sprouts[i]);

    // letters, dragged one last so it rides on top
    for (i = 0; i < scene.letters.length; i++) {
      if (drag && drag.L === scene.letters[i]) continue;
      drawLetter(scene.letters[i], t, false);
    }
    if (drag) drawLetter(drag.L, t, true);

    // the tiny creature on the tallest letter
    drawCreature(t);

    // hint
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = INK;
    ctx.font = '600 ' + Math.round(25 * s) + 'px "Comic Sans MS", "Segoe Print", cursive, sans-serif';
    ctx.fillText('drag', ox + 26 * s, oy + 44 * s);
    ctx.globalAlpha = 1;
  }

  // ---------- spacing: homes, springs, collision shuffle ----------
  function clampToStage(L) {
    var mx = L.r + 14, my = L.r + 18;
    if (L.x < mx) L.x = mx; if (L.x > DW - mx) L.x = DW - mx;
    if (L.y < my) L.y = my; if (L.y > DH - my) L.y = DH - my;
  }
  function resolveSpacing() {
    var letters = scene.letters;
    for (var pass = 0; pass < 3; pass++) {
      for (var i = 0; i < letters.length; i++) {
        for (var j = i + 1; j < letters.length; j++) {
          var A = letters[i], B = letters[j];
          var dx = B.x - A.x, dy = B.y - A.y;
          var need = A.r + B.r + 18;
          var d2 = dx * dx + dy * dy;
          if (d2 >= need * need) continue;
          var d = Math.sqrt(d2) || 0.01;
          var push = (need - d) / d;
          var aDrag = drag && drag.L === A, bDrag = drag && drag.L === B;
          if (aDrag && !bDrag) { B.x += dx * push; B.y += dy * push; }
          else if (bDrag && !aDrag) { A.x -= dx * push; A.y -= dy * push; }
          else {
            A.x -= dx * push * 0.5; A.y -= dy * push * 0.5;
            B.x += dx * push * 0.5; B.y += dy * push * 0.5;
          }
        }
      }
      for (var q = 0; q < letters.length; q++) {
        if (!(drag && drag.L === letters[q])) clampToStage(letters[q]);
      }
    }
  }
  function stepHomes(dt) {
    var f = Math.min(1, dt * 4.5);
    for (var i = 0; i < scene.letters.length; i++) {
      var L = scene.letters[i];
      if (drag && drag.L === L) continue;
      L.x += (L.hx - L.x) * f;
      L.y += (L.hy - L.y) * f;
    }
    resolveSpacing();
  }

  // ---------- interaction: drag rearranges, tap reseeds ----------
  var drag = null;
  var downInfo = null;
  var elapsed = 0;

  function toStage(ev) {
    var x = 0, y = 0;
    try {
      var r = canvas.getBoundingClientRect();
      x = ev.clientX - r.left; y = ev.clientY - r.top;
    } catch (e) {
      x = ev.clientX || 0; y = ev.clientY || 0;
    }
    return [(x - lastOx) / lastScale, (y - lastOy) / lastScale];
  }
  function reseed() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    scene = buildScene(seed);
    drag = null; downInfo = null;
    draw(PHASE0 + elapsed);
  }
  canvas.addEventListener('pointerdown', function (ev) {
    var p = toStage(ev);
    var now = ev && typeof ev.timeStamp === 'number' ? ev.timeStamp : 0;
    downInfo = { x: p[0], y: p[1], t: now, moved: false };
    for (var i = scene.letters.length - 1; i >= 0; i--) {
      var L = scene.letters[i];
      var dx = p[0] - L.x, dy = p[1] - (L.y + bobOf(L, PHASE0 + elapsed));
      if (Math.sqrt(dx * dx + dy * dy) < L.r * 1.02) {
        drag = { L: L, gx: dx, gy: dy };
        try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* not vital */ }
        return;
      }
    }
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!downInfo) return;
    var p = toStage(ev);
    var mdx = p[0] - downInfo.x, mdy = p[1] - downInfo.y;
    if (mdx * mdx + mdy * mdy > 100) downInfo.moved = true;
    if (!drag) return;
    drag.L.x = p[0] - drag.gx;
    drag.L.y = p[1] - drag.gy;
    clampToStage(drag.L);
    resolveSpacing();
    draw(PHASE0 + elapsed);
  });
  function endPointer(ev) {
    var wasDrag = drag, info = downInfo;
    drag = null; downInfo = null;
    if (wasDrag) { wasDrag.L.hx = wasDrag.L.x; wasDrag.L.hy = wasDrag.L.y; }
    if (info && !info.moved) {
      var now = ev && typeof ev.timeStamp === 'number' ? ev.timeStamp : 0;
      if (now - info.t < 500) { reseed(); return; }
    }
    draw(PHASE0 + elapsed);
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function () {
    if (drag) { drag.L.hx = drag.L.x; drag.L.hy = drag.L.y; }
    drag = null; downInfo = null;
  });

  // ---------- resize + loop ----------
  function onResize() { draw(PHASE0 + elapsed); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    window.addEventListener('resize', onResize);
  }

  draw(PHASE0); // synchronous deterministic first frame

  var startStamp = null;
  var lastStamp = null;
  function tick(now) {
    if (startStamp === null) { startStamp = now; lastStamp = now; }
    elapsed = (now - startStamp) / 1000;
    var dt = Math.min(0.05, (now - lastStamp) / 1000);
    lastStamp = now;
    stepHomes(dt);
    draw(PHASE0 + elapsed);
    requestAnimationFrame(tick);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
</body>
</html>
