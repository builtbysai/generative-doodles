<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>How the Music Looks</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var COL = {
    bg: '#050505',
    line: [232, 232, 224],   // #E8E8E0
    fil:  [138, 138, 134],   // #8A8A86
    bloom:[184, 169, 255],   // #B8A9FF
    white:[255, 255, 255]    // #FFFFFF
  };

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function sstep(a, b, v) { var u = clamp01((v - a) / (b - a)); return u * u * (3 - 2 * u); }
  function mixc(c1, c2, u) { // returns an [r,g,b] array; css() stringifies
    return [c1[0] + (c2[0] - c1[0]) * u,
            c1[1] + (c2[1] - c1[1]) * u,
            c1[2] + (c2[2] - c1[2]) * u];
  }
  function css(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }

  // ---------- QA hook: ?seed=0.9 forces a constant P (renderer passes ?seed=) ----------
  var FORCE_P = -1;
  try {
    var qs = (typeof location !== 'undefined' && location.search) || '';
    var m = /seed=([0-9]*\.?[0-9]+)/.exec(qs);
    if (m) { var fv = parseFloat(m[1]); if (fv > 0 && fv <= 1) FORCE_P = fv; }
  } catch (e) { /* no location: live page */ }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1, PHONE = false;

  function viewSize() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) { w = window.innerWidth; h = window.innerHeight; }
    }
    if (!w) { w = 720; h = 720; }
    return { w: w, h: h };
  }
  function resize() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // phone detection: physical screen min dimension, aspect only as fallback
    if (typeof window !== 'undefined' && window.screen && window.screen.width) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = H > W * 1.15;
    }
    buildStrands();
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }

  // ---------- strands (seeded) ----------
  var MAXS = 44, strands = [];
  function buildStrands() {
    MAXS = PHONE ? 30 : 44;
    strands = [];
    var rng = mulberry32(885046);
    for (var i = 0; i < MAXS; i++) {
      var off = (rng() + rng() + rng()) / 1.5 - 1; // center-bunched in [-1,1]
      strands.push({
        off: off,
        k: 1.2 + rng() * 3.2,          // spatial cycles across width
        om: 0.08 + rng() * 0.4,        // temporal rate
        ph: rng() * Math.PI * 2,
        amp: 0.5 + rng() * 0.9,
        act: (i / MAXS) * 0.92         // P at which this strand separates
      });
    }
  }

  // ---------- progression P: closed-form state ----------
  // Autonomous arc: full rise about 90 s, exhale about 90 s, phase-set so P(0)=0.14.
  var ARC_T = 180, ARC_PH = 22; // seconds
  function pAuto(t) { return 0.5 * (1 - Math.cos(2 * Math.PI * (t + ARC_PH) / ARC_T)); }

  // Conductor offset: list of approach segments {t0, o0, target, tau}.
  // offsetAt(t) evaluates the latest segment analytically; inertia is an
  // approach segment whose target is the flick asymptote, followed by a
  // slow approach back to 0 (the hand leaves, the piece resumes its arc).
  var segs = [{ t0: -1e9, o0: 0, target: 0, tau: 1 }];
  function offsetAt(t) {
    var s = segs[0];
    for (var i = segs.length - 1; i >= 0; i--) { if (segs[i].t0 <= t) { s = segs[i]; break; } }
    return s.target + (s.o0 - s.target) * Math.exp(-(t - s.t0) / s.tau);
  }
  function pushSeg(t, target, tau) {
    segs.push({ t0: t, o0: offsetAt(t), target: target, tau: tau });
    if (segs.length > 64) segs.splice(1, segs.length - 40);
  }

  // Holds (double-tap): {t0, t1, value}; P frozen in [t0,t1], 1 s blend after.
  var holds = [];
  function pUnder(t) { return clamp01(pAuto(t) + offsetAt(t)); }
  function progAt(t) {
    if (FORCE_P >= 0) return FORCE_P;
    for (var i = 0; i < holds.length; i++) {
      var hd = holds[i];
      if (t >= hd.t0 && t <= hd.t1) return hd.value;
      if (t > hd.t1 && t <= hd.t1 + 1) {
        var u = sstep(0, 1, (t - hd.t1) / 1);
        return hd.value + (pUnder(t) - hd.value) * u;
      }
    }
    return pUnder(t);
  }

  // ---------- feedback F: snare events (taps + autonomous pulse schedule) ----------
  var taps = []; // {t, amp}
  var autoJit = [];
  (function () { var r = mulberry32(4471); for (var i = 0; i < 512; i++) autoJit.push((r() * 2 - 1) * 1.5); })();
  function autoTime(k) { return 6 + k * 9 + autoJit[k % autoJit.length]; }
  function feedbackAt(t, P) {
    var f = 0, i, dt;
    for (i = 0; i < taps.length; i++) {
      dt = t - taps[i].t;
      if (dt > 0 && dt < 6) f += taps[i].amp * Math.exp(-dt / 0.8);
    }
    // autonomous snare pulses share the same schedule the audio plays
    var k = Math.max(0, Math.floor((t - 6) / 9) - 1);
    for (i = 0; i < 4; i++) {
      var tk = autoTime(k + i);
      dt = t - tk;
      if (dt > 0 && dt < 6) f += (0.22 + 0.45 * P) * Math.exp(-dt / 0.8);
    }
    return Math.min(1.2, f);
  }

  // ---------- shared low-end envelope: drives visual brightness AND drone gain ----------
  function lowEnd(t, P) {
    return clamp01((0.30 + 0.70 * P) * (0.78 + 0.22 * Math.sin(2 * Math.PI * t / 7.3)));
  }

  // ---------- drawing ----------
  function strandY(s, x, t, P, cy, spread) {
    var u = x / W;
    return cy + s.off * spread +
      Math.sin(u * s.k * Math.PI * 2 + s.ph + t * s.om) * (H * 0.012) * (0.5 + P) * s.amp +
      Math.sin(u * 0.9 * Math.PI * 2 + t * 0.11 + s.ph * 2.0) * (H * 0.006) * s.amp;
  }
  function drawStrands(t, P, L, yOff, alphaMul) {
    var cy = H * 0.46;
    var spread = H * (0.02 + 0.38 * Math.pow(P, 0.8));
    var vMix = sstep(0.65, 0.95, P);          // violet near culmination
    var satMix = sstep(0.8, 1, P);            // toward white at saturation
    var steps = PHONE ? 60 : 90;
    for (var i = strands.length - 1; i >= 0; i--) {
      var s = strands[i];
      var a = (i === 0) ? 1 : sstep(s.act, s.act + 0.07, P);
      if (a <= 0.003) continue;
      var baseA = (i === 0 ? 0.95 : 0.42 + 0.38 * a) * a;
      var alpha = baseA * (0.22 + 0.78 * L) * alphaMul;
      if (alpha <= 0.004) continue;
      var col = (i === 0)
        ? mixc(COL.line, COL.white, satMix)
        : mixc(mixc(COL.fil, COL.bloom, vMix), COL.white, satMix * 0.6);
      ctx.strokeStyle = css(col);
      ctx.globalAlpha = alpha;
      ctx.lineWidth = (i === 0 ? 2.2 : 1.1) + P * 1.1;
      ctx.beginPath();
      for (var j = 0; j <= steps; j++) {
        var x = (j / steps) * W;
        var y = strandY(s, x, t, P, cy, spread) + yOff;
        if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, W, H);

    var P = progAt(t);
    var L = lowEnd(t, P);
    var F = feedbackAt(t, P);

    // feedback bloom: analytic ghost echoes of the strands (snare controls feedback)
    if (F > 0.03) {
      for (var g = 3; g >= 1; g--) {
        var yo = (g % 2 === 0 ? 1 : -1) * Math.ceil(g / 2) * F * H * 0.045;
        drawStrands(t, P, L, yo, 0.16 * Math.min(1, F) * (1 - g / 5));
      }
    }
    drawStrands(t, P, L, 0, 1);

    // grain saturation at high P, seeded per frame index
    var gAmt = sstep(0.62, 1, P);
    if (gAmt > 0.01) {
      var n = Math.floor(gAmt * (PHONE ? 450 : 900));
      var fr = Math.floor(t * 24);
      var rng = mulberry32((fr + 1) * 1013904223 % 2147483647);
      ctx.fillStyle = '#FFFFFF';
      for (var j = 0; j < n; j++) {
        var gx = rng() * W, gy = rng() * H, ga = 0.08 + rng() * 0.4 * gAmt;
        ctx.globalAlpha = ga * (0.3 + 0.7 * L);
        ctx.fillRect(gx, gy, 1.6, 1.6);
      }
      ctx.globalAlpha = 1;
    }

    // progression arc (no words): thin curve + marker at P
    var ax0 = W * 0.14, ax1 = W * 0.86, ay = H * 0.945, acy = H * 0.885;
    ctx.strokeStyle = '#8A8A86';
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ax0, ay);
    ctx.quadraticCurveTo(W * 0.5, acy, ax1, ay);
    ctx.stroke();
    // end ticks
    ctx.beginPath();
    ctx.moveTo(ax0, ay - 3); ctx.lineTo(ax0, ay + 3);
    ctx.moveTo(ax1, ay - 3); ctx.lineTo(ax1, ay + 3);
    ctx.stroke();
    var u = P, iu = 1 - u;
    var mx = iu * iu * ax0 + 2 * iu * u * (W * 0.5) + u * u * ax1;
    var my = iu * iu * ay + 2 * iu * u * acy + u * u * ay;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#E8E8E0';
    ctx.beginPath();
    ctx.arc(mx, my, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ---------- clock: rAF timestamp is the only time source ----------
  var startTs = -1, lastT = 0;
  function frame(ts) {
    if (startTs < 0) startTs = ts;
    lastT = (ts - startTs) / 1000;
    draw(lastT);
    audioTick(lastT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  }

  // ---------- audio: lazy, guarded, driven by the same closed-form state ----------
  var AC = null, aDroneGain = null, aShimGain = null, aFbGain = null, aNoiseBuf = null, aNextAuto = 0, aOn = false;
  function audioInit() {
    if (aOn) return;
    try {
      var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext :
                 (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if (!Ctor) return;
      AC = new Ctor();
      var master = AC.createGain(); master.gain.value = 0.9;
      var comp = AC.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 12; comp.knee.value = 6;
      master.connect(comp); comp.connect(AC.destination);

      // noise buffer (seeded, so the bed is the same every visit)
      var len = AC.sampleRate * 2;
      aNoiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      var d = aNoiseBuf.getChannelData(0), r = mulberry32(90210);
      for (var i = 0; i < len; i++) d[i] = r() * 2 - 1;

      // drone: two detuned lows through a lowpass; gain IS lowEnd(t,P)
      var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
      aDroneGain = AC.createGain(); aDroneGain.gain.value = 0;
      var o1 = AC.createOscillator(); o1.type = 'sine'; o1.frequency.value = 54;
      var o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = 54 * 1.007;
      o1.connect(lp); o2.connect(lp); lp.connect(aDroneGain); aDroneGain.connect(master);
      o1.start(); o2.start();

      // granular shimmer: looped noise through bandpass, gain follows P^2
      var shim = AC.createBufferSource(); shim.buffer = aNoiseBuf; shim.loop = true;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 4200; bp.Q.value = 0.7;
      aShimGain = AC.createGain(); aShimGain.gain.value = 0;
      shim.connect(bp); bp.connect(aShimGain); aShimGain.connect(master);
      shim.start();

      // snare feedback loop: delay whose feedback gain follows F(t) (KLSR rule)
      var dly = AC.createDelay(1); dly.delayTime.value = 0.27;
      aFbGain = AC.createGain(); aFbGain.gain.value = 0.2;
      var dFil = AC.createBiquadFilter(); dFil.type = 'lowpass'; dFil.frequency.value = 2600;
      dly.connect(dFil); dFil.connect(aFbGain); aFbGain.connect(dly);
      dly.connect(master);
      AC._snareIn = dly; AC._master = master;
      aOn = true;
    } catch (e) { AC = null; aOn = false; }
  }
  function snareHit(tSec, amp) {
    if (!aOn || !AC) return;
    try {
      var src = AC.createBufferSource(); src.buffer = aNoiseBuf;
      src.playbackRate.value = 0.9 + amp * 0.3;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 0.9;
      var g = AC.createGain();
      var now = AC.currentTime;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(Math.max(0.002, 0.4 * amp), now + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      src.connect(bp); bp.connect(g); g.connect(AC._master); g.connect(AC._snareIn);
      src.start(); src.stop(now + 0.25);
    } catch (e) { /* audio is an enhancement only */ }
  }
  function audioTick(t) {
    if (!aOn || !AC) return;
    try {
      var P = progAt(t), L = lowEnd(t, P), F = feedbackAt(t, P);
      var now = AC.currentTime;
      aDroneGain.gain.setTargetAtTime(0.22 * L, now, 0.1);
      aShimGain.gain.setTargetAtTime(0.13 * P * P + 0.03 * F, now, 0.1);
      aFbGain.gain.setTargetAtTime(0.12 + 0.5 * Math.min(1, F), now, 0.08);
      while (autoTime(aNextAuto) <= t) { snareHit(t, 0.3 + 0.5 * P); aNextAuto++; }
    } catch (e) { /* ignore */ }
  }

  // ---------- interaction: recorded events only ----------
  var dragging = false, dragStartX = 0, dragGrabP = 0, lastX = 0, lastMoveT = 0, lastVel = 0;
  var downT = 0, downX = 0, downY = 0, moved = false;
  var pendingTap = null, lastTapT = -10;

  function evPos(e) {
    var x = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var y = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: x, y: y };
  }
  function onDown(e) {
    audioInit();
    if (AC && AC.resume) { try { AC.resume(); } catch (err) {} }
    var p = evPos(e);
    dragging = true; moved = false;
    dragStartX = p.x; lastX = p.x; lastMoveT = lastT; lastVel = 0;
    dragGrabP = progAt(lastT);
    downT = lastT; downX = p.x; downY = p.y;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = evPos(e);
    if (Math.abs(p.x - downX) > 6 || Math.abs(p.y - downY) > 6) moved = true;
    var dt = Math.max(0.001, lastT - lastMoveT);
    lastVel = (p.x - lastX) / W / dt; // in P-units per second, roughly
    lastX = p.x; lastMoveT = lastT;
    if (moved) {
      // desired total P from the grab point; the offset segment aims at it
      var wantP = clamp01(dragGrabP + (p.x - dragStartX) / (0.6 * W));
      pushSeg(lastT, wantP - pAuto(lastT), 0.35);
    }
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var quick = (lastT - downT) < 0.35;
    if (!moved && quick) {
      // tap or double-tap (deferred 0.32 s for disambiguation, house pattern)
      if (lastT - lastTapT < 0.35 && pendingTap) {
        var ix = taps.indexOf(pendingTap);
        if (ix >= 0) taps.splice(ix, 1); // cancel the pending snare
        pendingTap = null;
        holds.push({ t0: lastT + 0.32, t1: lastT + 0.32 + 6, value: progAt(lastT) });
        lastTapT = -10;
      } else {
        var ev = { t: lastT + 0.32, amp: 1.0 };
        taps.push(ev);
        pendingTap = ev;
        lastTapT = lastT;
        if (aOn) setTimeout(function () { if (taps.indexOf(ev) >= 0) snareHit(lastT, 1.0); }, 320);
      }
      return;
    }
    if (moved) {
      // release with inertia: flick asymptote, then slow return to the arc
      var oNow = offsetAt(lastT);
      var asymptote = clamp(oNow + lastVel * 1.6, -1.2, 1.2);
      pushSeg(lastT, asymptote, 1.6);
      var tBack = lastT + 5.6;
      segs.push({ t0: tBack, o0: asymptote + (oNow - asymptote) * Math.exp(-5.6 / 1.6), target: 0, tau: 22 });
    }
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  // ---------- go ----------
  resize();
  draw(0); // frame one: synchronous, fixed phase, P = 0.14 in the build
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
