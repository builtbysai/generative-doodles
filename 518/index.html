<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus of Faces</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F7F2E4; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (flat fills only, no gradients anywhere)
  var YELLOW = '#F2B705', CREAM = '#F7F2E4', GREEN = '#2A6B3A',
      GREY = '#3A3A3A';
  var LETTER_COLORS = ['#E6392B', '#2B4FB0', '#F0608E', '#2AA6A0', '#8A5FB0'];
  var BODY_TONES = ['#DFA903', '#E8B104', '#D29E02'];
  var GREEN_TONES = ['#255F33', '#317344', '#1F5229'];
  var GROUND_GRAIN = '#E7DCC0';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Pre-vetted invented words (5 letters each, no real word in any language
  // we could check). The shipped seed spells ZUVIK.
  var WORDS = ['ZUVIK', 'FRULO', 'TOZMI', 'KUDRA', 'PELVO', 'NARZU', 'BAVEN', 'WODEF'];

  // Hand-drawn glyph strokes in a unit box (x right, y down), slightly wobbly.
  var GLYPHS = {
    A: [[[0.08,0.92],[0.48,0.10],[0.90,0.90]], [[0.26,0.60],[0.72,0.58]]],
    B: [[[0.14,0.06],[0.14,0.94]], [[0.14,0.08],[0.58,0.10],[0.66,0.30],[0.14,0.48]], [[0.14,0.48],[0.64,0.50],[0.70,0.72],[0.14,0.94]]],
    D: [[[0.16,0.05],[0.16,0.95]], [[0.16,0.07],[0.58,0.12],[0.86,0.48],[0.58,0.86],[0.16,0.93]]],
    E: [[[0.80,0.08],[0.16,0.06],[0.16,0.94],[0.82,0.92]], [[0.16,0.50],[0.62,0.48]]],
    F: [[[0.82,0.08],[0.16,0.06],[0.16,0.95]], [[0.17,0.49],[0.60,0.47]]],
    I: [[[0.50,0.08],[0.50,0.92]], [[0.28,0.08],[0.72,0.08]], [[0.28,0.92],[0.72,0.92]]],
    K: [[[0.16,0.05],[0.16,0.95]], [[0.80,0.08],[0.20,0.52]], [[0.34,0.64],[0.84,0.94]]],
    L: [[[0.18,0.05],[0.18,0.92],[0.80,0.90]]],
    M: [[[0.08,0.94],[0.10,0.08],[0.50,0.58],[0.88,0.10],[0.90,0.94]]],
    N: [[[0.14,0.94],[0.14,0.08],[0.84,0.90],[0.84,0.06]]],
    O: [[[0.50,0.06],[0.80,0.20],[0.88,0.55],[0.62,0.90],[0.34,0.92],[0.12,0.58],[0.20,0.20],[0.50,0.06]]],
    P: [[[0.16,0.95],[0.16,0.06]], [[0.16,0.08],[0.62,0.10],[0.78,0.32],[0.60,0.52],[0.16,0.50]]],
    R: [[[0.16,0.95],[0.16,0.06]], [[0.16,0.08],[0.60,0.10],[0.76,0.32],[0.58,0.52],[0.16,0.50]], [[0.44,0.54],[0.84,0.94]]],
    T: [[[0.10,0.08],[0.90,0.08]], [[0.50,0.08],[0.50,0.94]]],
    U: [[[0.14,0.06],[0.16,0.66],[0.34,0.90],[0.64,0.90],[0.84,0.64],[0.86,0.08]]],
    V: [[[0.08,0.06],[0.48,0.94],[0.90,0.08]]],
    W: [[[0.06,0.06],[0.24,0.92],[0.50,0.36],[0.74,0.92],[0.94,0.08]]],
    Z: [[[0.12,0.08],[0.86,0.08],[0.14,0.92],[0.88,0.92]]]
  };

  var BASE_SEED = 518006;
  var seed = BASE_SEED;
  var cfg = null;

  var BUS_W = 0.75, BUS_H = 0.36;
  var BUS_Y = 0.30;                 // top of body, stage units
  var WHEEL_R = 0.047;
  var WHEEL_Y = BUS_Y + BUS_H + 0.012;
  var CYCLE = 1.75;                 // bus width + stage width
  var PERIOD = 42;                  // seconds per crossing
  var PHASE0 = PERIOD / 2;          // at phase 0.5 the bus is centred

  function buildConfig(s) {
    var rng = mulberry32(s);
    var word = WORDS[Math.floor(rng() * WORDS.length)];
    // colour order: a shuffled copy so every letter gets a different colour
    var cols = LETTER_COLORS.slice();
    for (var i = cols.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = cols[i]; cols[i] = cols[j]; cols[j] = tmp;
    }
    var nWin = 5;
    // face variants 0..3, no two adjacent equal
    var faces = [];
    var prev = -1;
    for (i = 0; i < nWin; i++) {
      var v;
      do { v = Math.floor(rng() * 4); } while (v === prev);
      faces.push(v); prev = v;
    }
    // blink timers: period 4.6..7.4s, phase chosen so every eye is OPEN
    // at t = PHASE0 (blink occupies the last 0.24s of each cycle)
    var blinks = [];
    for (i = 0; i < nWin; i++) {
      var per = 4.6 + rng() * 2.8;
      var fracWanted = 0.25 + rng() * 0.45;         // safely inside the open span
      var phase = fracWanted * per - PHASE0;
      blinks.push({ per: per, phase: phase });
    }
    // per-letter crayon jitter
    var jit = [];
    for (i = 0; i < word.length; i++) {
      jit.push({ dx: (rng() - 0.5) * 0.05, dy: (rng() - 0.5) * 0.06, rot: (rng() - 0.5) * 0.10 });
    }
    // ribbon squiggle phase offsets
    return {
      word: word, cols: cols, faces: faces, blinks: blinks, jit: jit,
      nWin: nWin, ribPhase: rng() * Math.PI * 2, ribCol: LETTER_COLORS[Math.floor(rng() * LETTER_COLORS.length)]
    };
  }
  cfg = buildConfig(seed);

  // ---- precomputed crayon texture (seeded arrays, drawn directly) ----
  var groundGrain = [], greenHatch = [], bodyGrain = [];
  (function buildTexture() {
    var rng = mulberry32(818283);
    var i;
    for (i = 0; i < 150; i++) {
      groundGrain.push({ x: rng(), y: rng(), len: 0.006 + rng() * 0.010, ang: -0.4 + (rng() - 0.5) * 0.6 });
    }
    for (i = 0; i < 260; i++) {                 // heavy hatch on the green edge
      greenHatch.push({
        x: rng(), y: rng(), len: 0.010 + rng() * 0.016,
        ang: -0.55 + (rng() - 0.5) * 0.55,
        tone: GREEN_TONES[Math.floor(rng() * GREEN_TONES.length)]
      });
    }
    var rng2 = mulberry32(518777);
    for (i = 0; i < 170; i++) {                 // grain in bus-local coords
      bodyGrain.push({
        x: rng2() * BUS_W, y: rng2() * BUS_H,
        len: 0.008 + rng2() * 0.012, ang: -0.4 + (rng2() - 0.5) * 0.6,
        tone: BODY_TONES[Math.floor(rng2() * BODY_TONES.length)]
      });
    }
  })();

  // ---- interaction state ----
  var leans = [];                                // per window: {start, dx, dy} or null
  for (var li = 0; li < 8; li++) leans.push(null);
  var downT = 0, lastTapT = -10, downWasTap = false;

  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw(simT);
  }

  function isPhone() {
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    if (sw < 700) return true;
    return H > W * 1.15;
  }

  function circle(x, y, r, fill) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  }
  function line(x1, y1, x2, y2, col, lw) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function busLeft(t) {
    var frac = ((t / PERIOD) % 1 + 1) % 1;
    return -BUS_W + frac * CYCLE;
  }

  function windowGeom(i) {
    var n = cfg.nWin;
    var margin = 0.055, gap = 0.028;
    var wW = (BUS_W - margin * 2 - gap * (n - 1)) / n;
    return { x: margin + i * (wW + gap), y: 0.045, w: wW, h: 0.115 };
  }

  function blinkScale(t, i) {
    var b = cfg.blinks[i];
    var p = (((t + b.phase) % b.per) + b.per) % b.per;
    var closed = b.per - 0.24;
    if (p < closed) return 1;
    var k = (p - closed) / 0.24;
    var tri = k < 0.5 ? k * 2 : 2 - k * 2;
    return 1 - 0.92 * tri;
  }

  function drawFace(cx, cy, r, variant, bScale, ink) {
    // head
    circle(cx, cy, r, CREAM);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = ink; ctx.lineWidth = r * 0.10; ctx.stroke();
    var ey = cy - r * 0.16, ed = r * 0.36, er = r * 0.13;
    if (variant === 0) {                        // two dot eyes + smile
      ctx.beginPath(); ctx.ellipse(cx - ed, ey, er, er * bScale, 0, 0, Math.PI * 2);
      ctx.fillStyle = ink; ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + ed, ey, er, er * bScale, 0, 0, Math.PI * 2);
      ctx.fillStyle = ink; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy + r * 0.14, r * 0.34, Math.PI * 0.2, Math.PI * 0.8);
      ctx.strokeStyle = ink; ctx.lineWidth = r * 0.10; ctx.lineCap = 'round'; ctx.stroke();
    } else if (variant === 1) {                 // one big eye + flat mouth
      ctx.beginPath(); ctx.ellipse(cx, ey, er * 1.35, er * 1.35 * bScale, 0, 0, Math.PI * 2);
      ctx.fillStyle = ink; ctx.fill();
      line(cx - r * 0.30, cy + r * 0.36, cx + r * 0.30, cy + r * 0.36, ink, r * 0.10);
    } else if (variant === 2) {                 // sleepy arcs + tiny mouth
      ctx.beginPath(); ctx.arc(cx - ed, ey + r * 0.04, er * 1.15, Math.PI * 1.12, Math.PI * 1.88);
      ctx.strokeStyle = ink; ctx.lineWidth = r * 0.10; ctx.lineCap = 'round'; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + ed, ey + r * 0.04, er * 1.15, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
      circle(cx, cy + r * 0.38, r * 0.07, ink);
    } else {                                    // surprised: dot eyes + O mouth
      ctx.beginPath(); ctx.ellipse(cx - ed, ey, er, er * bScale, 0, 0, Math.PI * 2);
      ctx.fillStyle = ink; ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + ed, ey, er, er * bScale, 0, 0, Math.PI * 2);
      ctx.fillStyle = ink; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy + r * 0.34, r * 0.17, 0, Math.PI * 2);
      ctx.strokeStyle = ink; ctx.lineWidth = r * 0.10; ctx.stroke();
    }
  }

  function drawLetter(ch, x, y, size, col, jit, lwU) {
    var g = GLYPHS[ch];
    if (!g) return;
    ctx.save();
    ctx.translate(x + jit.dx * size, y + jit.dy * size);
    ctx.rotate(jit.rot);
    ctx.strokeStyle = col;
    ctx.lineWidth = size * 0.13 * lwU;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (var pass = 0; pass < 2; pass++) {      // double pass = crayon body
      var ox = pass === 0 ? 0 : size * 0.022, oy = pass === 0 ? 0 : size * 0.016;
      for (var s = 0; s < g.length; s++) {
        var pts = g[s];
        ctx.beginPath();
        ctx.moveTo((pts[0][0] - 0.5) * size + ox, (pts[0][1] - 0.5) * size + oy);
        for (var p = 1; p < pts.length; p++) {
          ctx.lineTo((pts[p][0] - 0.5) * size + ox, (pts[p][1] - 0.5) * size + oy);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawBus(left, t, lwU) {
    ctx.save();
    ctx.translate(left, BUS_Y);

    // body
    rrect(0, 0, BUS_W, BUS_H, 0.055);
    ctx.fillStyle = YELLOW; ctx.fill();
    ctx.save();
    rrect(0, 0, BUS_W, BUS_H, 0.055); ctx.clip();
    ctx.globalAlpha = 0.65;
    ctx.lineCap = 'round';
    for (var i = 0; i < bodyGrain.length; i++) {
      var bg = bodyGrain[i];
      ctx.strokeStyle = bg.tone;
      ctx.lineWidth = 0.0028 * lwU;
      ctx.beginPath();
      ctx.moveTo(bg.x, bg.y);
      ctx.lineTo(bg.x + Math.cos(bg.ang) * bg.len, bg.y + Math.sin(bg.ang) * bg.len);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    rrect(0, 0, BUS_W, BUS_H, 0.055);
    ctx.strokeStyle = GREY; ctx.lineWidth = 0.0045 * lwU; ctx.stroke();

    // front details (bus faces right): headlight + bumper
    circle(BUS_W - 0.028, 0.235, 0.013, CREAM);
    ctx.beginPath(); ctx.arc(BUS_W - 0.028, 0.235, 0.013, 0, Math.PI * 2);
    ctx.strokeStyle = GREY; ctx.lineWidth = 0.003 * lwU; ctx.stroke();
    rrect(BUS_W - 0.018, 0.315, 0.026, 0.030, 0.008);
    ctx.fillStyle = GREY; ctx.fill();
    rrect(-0.008, 0.315, 0.026, 0.030, 0.008);
    ctx.fillStyle = GREY; ctx.fill();

    // windows with faces
    for (i = 0; i < cfg.nWin; i++) {
      var wg = windowGeom(i);
      rrect(wg.x, wg.y, wg.w, wg.h, 0.018);
      ctx.fillStyle = CREAM; ctx.fill();
      ctx.strokeStyle = GREY; ctx.lineWidth = 0.0038 * lwU; ctx.stroke();
      var lean = leans[i];
      var age = lean ? t - lean.start : 99;
      var leaning = age >= 0 && age < 2.4;
      var fcx = wg.x + wg.w / 2, fcy = wg.y + wg.h / 2 + 0.006, fr = wg.h * 0.40;
      if (!leaning) {
        ctx.save();
        rrect(wg.x, wg.y, wg.w, wg.h, 0.018); ctx.clip();
        drawFace(fcx, fcy, fr, cfg.faces[i], blinkScale(t, i), GREY);
        ctx.restore();
      }
    }
    // leaning faces draw over the frame, popped up and looking around
    for (i = 0; i < cfg.nWin; i++) {
      var ln = leans[i];
      if (!ln) continue;
      var a = t - ln.start;
      if (a < 0 || a >= 2.4) { if (a >= 2.4) leans[i] = null; continue; }
      var wg2 = windowGeom(i);
      var env = a < 0.25 ? a / 0.25 : (a > 1.9 ? Math.max(0, (2.4 - a) / 0.5) : 1);
      var look = Math.sin(a * 5.2) * 0.30;      // looks around while out
      var popX = wg2.x + wg2.w / 2 + ln.dx * 0.030 * env + look * wg2.w * 0.16 * env;
      var popY = wg2.y + wg2.h / 2 + 0.006 - 0.052 * env + ln.dy * 0.014 * env;
      ctx.save();
      ctx.translate(popX, popY);
      ctx.rotate(look * 0.35 * env);
      drawFace(0, 0, wg2.h * 0.42, cfg.faces[i], blinkScale(t, i), GREY);
      ctx.restore();
    }

    // invented word, hand-drawn letters along the body, clear of the windows
    var word = cfg.word;
    var lSize = 0.105;
    var totalW = word.length * 0.082;
    var startX = (BUS_W - totalW) / 2 + 0.041;
    var baseY = 0.245;
    for (i = 0; i < word.length; i++) {
      drawLetter(word[i], startX + i * 0.082, baseY, lSize, cfg.cols[i], cfg.jit[i], lwU);
    }

    // ribbon squiggle along the lower body
    ctx.beginPath();
    var ribY = 0.322, ribAmp = 0.0085;
    for (var rx = 0.03; rx <= BUS_W - 0.03; rx += 0.006) {
      var ry = ribY + Math.sin(rx * 46 + cfg.ribPhase) * ribAmp;
      if (rx === 0.03) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
    }
    ctx.strokeStyle = cfg.ribCol; ctx.lineWidth = 0.006 * lwU; ctx.lineCap = 'round'; ctx.stroke();

    // wheels: exactly 3, asterisk hubs (6 rays) rotating with travel
    var dist = ((t / PERIOD) % 1 + 1) % 1 * CYCLE;
    var wang = dist / WHEEL_R;
    var wheelX = [0.115, 0.375, 0.635];
    for (i = 0; i < 3; i++) {
      var wx = wheelX[i], wy = BUS_H + 0.012;
      circle(wx, wy, WHEEL_R, GREY);
      circle(wx, wy, WHEEL_R * 0.52, YELLOW);
      ctx.strokeStyle = GREY;
      ctx.lineWidth = 0.005 * lwU;
      for (var r6 = 0; r6 < 6; r6++) {
        var aa = wang + r6 * Math.PI / 3;
        line(wx, wy, wx + Math.cos(aa) * WHEEL_R * 0.46, wy + Math.sin(aa) * WHEEL_R * 0.46, GREY, 0.005 * lwU);
      }
      circle(wx, wy, 0.006, GREY);
    }
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var lwU = isPhone() ? 1.25 : 1;
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S, S);

    // faint grain on the cream ground
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = GROUND_GRAIN;
    ctx.lineWidth = 0.0022 * lwU;
    ctx.lineCap = 'round';
    for (var i = 0; i < groundGrain.length; i++) {
      var cg = groundGrain[i];
      ctx.beginPath();
      ctx.moveTo(cg.x, cg.y);
      ctx.lineTo(cg.x + Math.cos(cg.ang) * cg.len, cg.y + Math.sin(cg.ang) * cg.len);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // dark green full-bleed crayon edge on the right side
    ctx.fillStyle = GREEN;
    ctx.fillRect(0.865, 0, 0.135, 1);
    ctx.save();
    ctx.beginPath(); ctx.rect(0.865, 0, 0.135, 1); ctx.clip();
    ctx.globalAlpha = 0.6;
    ctx.lineCap = 'round';
    for (i = 0; i < greenHatch.length; i++) {
      var hs = greenHatch[i];
      var hx = 0.865 + hs.x * 0.135;
      ctx.strokeStyle = hs.tone;
      ctx.lineWidth = 0.0028 * lwU;
      ctx.beginPath();
      ctx.moveTo(hx, hs.y);
      ctx.lineTo(hx + Math.cos(hs.ang) * hs.len, hs.y + Math.sin(hs.ang) * hs.len);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // the bus, drawn twice for a seamless wrap
    var left = busLeft(t);
    drawBus(left, t, lwU);
    drawBus(left - CYCLE, t, lwU);
    drawBus(left + CYCLE, t, lwU);

    ctx.restore();
  }

  var startStamp = null, lastNow = 0;
  function frame(now) {
    if (startStamp === null) { startStamp = now; lastNow = now; }
    lastNow = now;
    simT = PHASE0 + (now - startStamp) / 1000;
    draw(simT);
    if (typeof window.requestAnimationFrame === 'function') {
      window.requestAnimationFrame(frame);
    }
  }

  function toStage(e) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left - OX) / S,
      y: (e.clientY - rect.top - OY) / S
    };
  }

  function reseed() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    cfg = buildConfig(seed);
    leans = [null, null, null, null, null, null, null, null];
    draw(simT);
  }

  function onDown(e) {
    downT = e.timeStamp || 0;
    downWasTap = false;
    var p = toStage(e);
    // hit-test windows on either wrap copy
    var left = busLeft(simT);
    for (var copy = -1; copy <= 1; copy++) {
      var bx = left + copy * CYCLE;
      for (var i = 0; i < cfg.nWin; i++) {
        var wg = windowGeom(i);
        var wx = bx + wg.x, wy = BUS_Y + wg.y;
        if (p.x >= wx && p.x <= wx + wg.w && p.y >= wy && p.y <= wy + wg.h) {
          var cx = wx + wg.w / 2, cy = wy + wg.h / 2;
          var dx = (p.x - cx) / wg.w, dy = (p.y - cy) / wg.h;
          var dl = Math.sqrt(dx * dx + dy * dy) || 1;
          leans[i] = { start: simT, dx: dx / dl, dy: dy / dl };
          draw(simT);
          return;
        }
      }
    }
    downWasTap = true;
  }
  function onUp(e) {
    var now = e.timeStamp || 0;
    if (downWasTap && now - downT < 300) {
      if (now - lastTapT < 400) {               // double-tap: reseed
        lastTapT = -10;
        reseed();
      } else {
        lastTapT = now;
      }
    }
    downWasTap = false;
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  function onResize() { resize(); }
  window.addEventListener('resize', onResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

  resize();          // sets size and draws frame one via draw(simT = PHASE0)
  draw(PHASE0);      // frame one: synchronous, constant phase, bus centred
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
