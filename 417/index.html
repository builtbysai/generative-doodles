<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.417 Scooter Girl</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#D9A419; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.417 Scooter Girl (kittyo.illustration, EXPANSION
// #45). After Kitty O'Rourke's earliest piece
// (2021-08-15): a woman mid-push on a kick-scooter
// over a flat mustard ground - orange-tinted
// sunglasses, an orange tee with a white daisy,
// purple pants with a pink abstract pattern, a mesh
// net bag stuffed with bright flowers hanging from
// the handlebar, and her spotted dachshund trotting
// beside the front wheel, red collar, tail wagging.
// DRAG horizontally and the scene rolls: the speckle
// field scrolls at 0.5 parallax with wrap, the wheels
// spin with the ground, her hair streams with the
// roll speed and the dog's legs cycle in opposite
// phases. Release and the roll springs gently back
// to exactly zero, settling into the ambient 24s
// loop: tail wag (6 whole cycles), daisy sway (3),
// bag flowers bob (2). Black outlines on every shape
// are her grammar in this set; the speckle field is
// the ground's own texture and carries no outline.
// No text anywhere in this piece (KIT1: she does not
// sign these). Palette resolutions where the prompt
// names no colour: skin takes the palette cream, the
// hair and the scooter take the outline black.
// Frame one is drawn at the constant phase T = 5.0s
// (tail at full wag, daisy mid-sway, dog legs at
// their constant mid-trot offset); the clock is
// anchored there and advances in fixed 1/60 ticks,
// never from a wall clock. Flat colour only, one
// canvas, no offscreen canvas, no gradients, no
// shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Ground mustard with darker speckle; sunglasses and
// tee orange; daisy white; pants purple with pink
// pattern; bag mesh cream; flowers pink, green and
// yellow; dachshund tan with brown spots; collar red;
// outlines black. Nothing else.
var GROUND = '#D9A419', SPECK = '#B8860B';
var INK = '#1A1A1A';
var ORANGE = '#F26A1B', WHITE = '#FFFFFF';
var PURPLE = '#7B2D8E', PPINK = '#FF9ECF';
var CREAM = '#FCE8D5';
var FPINK = '#FF4FA3', FGREEN = '#2E7D4F', FYEL = '#FFE066';
var TAN = '#C68A4A', BROWN = '#7A4A1A', RED = '#E63329';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;
if (LOOP !== 24) throw new Error('Scooter Girl loop must be 24s');
var TICK = 1 / 60;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
function makeRng(seedStart) {
  var s = seedStart;
  return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// Speckle: exactly 500 fixed dots asserted, scattered
// over the whole design field. They scroll with the
// roll at 0.5 parallax, wrapped modulo the field width
// so the scroll is seamless.
var rngSpeck = makeRng(417500);
var SPECKLE = [];
for (var si = 0; si < 500; si++) {
  SPECKLE.push({
    x: rngSpeck() * DW, y: rngSpeck() * DH,
    r: 1 + Math.floor(rngSpeck() * 3),
    a: 0.35 + Math.floor(rngSpeck() * 3) * 0.22
  });
}
if (SPECKLE.length !== 500) throw new Error('speckle must be exactly 500');

// Flowers spilling from the bag across the lower
// third: a fixed authored trail of dropped heads and
// leaves, from under the bag toward the dog. Static -
// only the flowers still in the bag bob.
var SPILL = [
  { x: 700, y: 806, s: 1.00, c: FPINK }, { x: 742, y: 838, s: 0.80, c: FYEL },
  { x: 668, y: 852, s: 0.85, c: FYEL },  { x: 792, y: 812, s: 0.90, c: FPINK },
  { x: 838, y: 850, s: 0.75, c: FPINK }, { x: 632, y: 824, s: 0.70, c: FPINK },
  { x: 884, y: 826, s: 0.80, c: FYEL },  { x: 596, y: 856, s: 0.75, c: FYEL },
  { x: 930, y: 856, s: 0.70, c: FPINK }, { x: 556, y: 830, s: 0.65, c: FPINK },
  { x: 716, y: 872, s: 0.65, c: FYEL },  { x: 866, y: 878, s: 0.60, c: FYEL },
  { x: 516, y: 862, s: 0.60, c: FPINK }, { x: 968, y: 838, s: 0.60, c: FYEL },
  { x: 660, y: 786, s: 0.60, c: FPINK }, { x: 806, y: 786, s: 0.65, c: FYEL }
];
var SPILL_LEAVES = [
  { x: 722, y: 824, r: 0.5 }, { x: 812, y: 838, r: 2.4 }, { x: 612, y: 842, r: 1.2 },
  { x: 902, y: 842, r: 3.6 }, { x: 686, y: 866, r: 2.9 }, { x: 540, y: 848, r: 0.2 },
  { x: 946, y: 868, r: 1.8 }, { x: 760, y: 862, r: 4.4 }
];

// Flowers riding in the bag: five heads at the mouth,
// bobbing together on 2 whole cycles per loop, each
// with its own constant phase.
var BAG_FLOWERS = [
  { dx: -24, dy: -6, s: 0.95, c: FPINK, ph: 0.0 },
  { dx: 0,   dy: -16, s: 1.05, c: FYEL,  ph: 1.3 },
  { dx: 24,  dy: -6, s: 0.95, c: FPINK, ph: 2.6 },
  { dx: -12, dy: 6,  s: 0.80, c: FYEL,  ph: 3.9 },
  { dx: 13,  dy: 7,  s: 0.80, c: FPINK, ph: 5.2 }
];

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellO(x, y, rx, ry, rot, color, lw) {
  ell(x, y, rx, ry, rot, color);
  ctx.strokeStyle = INK; ctx.lineWidth = lw || 3.5;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.stroke();
}
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function segO(x1, y1, x2, y2, w, color) {
  seg(x1, y1, x2, y2, w + 6, INK);
  seg(x1, y1, x2, y2, w, color);
}
function poly(color, pts, outline) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
  if (outline) { ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.stroke(); }
}
// Forward kinematics: point at angle ang (from straight
// down, positive forward), distance len from a joint.
function fk(x, y, ang, len) {
  return { x: x + len * Math.sin(ang), y: y + len * Math.cos(ang) };
}

// A tapered limb/garment segment along its own
// direction: local +y is the segment axis (joint at
// origin), reached by rotate(-ang). The shape is
// filled and outlined, then patternFn runs INSIDE a
// clip of that same shape in local coords, so the
// pattern stays glued to the segment.
function segment(jx, jy, ang, len, w0, w1, color, patternFn) {
  ctx.save();
  ctx.translate(jx, jy);
  ctx.rotate(-ang);
  ctx.beginPath();
  ctx.moveTo(-w0 / 2, 0);
  ctx.lineTo(w0 / 2, 0);
  ctx.lineTo(w1 / 2, len);
  ctx.lineTo(-w1 / 2, len);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
  ctx.stroke();
  if (patternFn) {
    ctx.save();
    ctx.clip();
    patternFn(len);
    ctx.restore();
  }
  ctx.restore();
}
// The pants' pink abstract pattern: chunky blobs and
// dashes, in segment-local coords (clip only).
function pantsPattern(len) {
  ctx.fillStyle = PPINK;
  var blobs = [[-8, 22, 9], [10, 52, 7], [-12, 84, 8], [6, 116, 9], [-6, 148, 7], [12, 178, 8]];
  for (var i = 0; i < blobs.length; i++) {
    if (blobs[i][1] > len - 12) break;
    ctx.beginPath();
    ctx.arc(blobs[i][0], blobs[i][1], blobs[i][2], 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.save();
  ctx.rotate(0.5);
  ctx.fillRect(-20, 34, 26, 7);
  ctx.fillRect(-24, 100, 26, 7);
  ctx.fillRect(-18, 162, 26, 7);
  ctx.restore();
}

// ---- flowers -------------------------------------------
// One flat flower head: five petals around a centre,
// black outlines. Petal and centre colours swap by
// kind: pink petals with a yellow centre, or yellow
// petals with a pink centre.
function flower(x, y, s, col, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.scale(s, s);
  var centre = col === FPINK ? FYEL : FPINK;
  for (var p = 0; p < 5; p++) {
    var a = p / 5 * Math.PI * 2;
    ellO(Math.cos(a) * 11, Math.sin(a) * 11, 8.5, 8.5, 0, col, 3);
  }
  ellO(0, 0, 6, 6, 0, centre, 3);
  ctx.restore();
}
function leaf(x, y, s, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.quadraticCurveTo(10, -3, 0, 14);
  ctx.quadraticCurveTo(-10, -3, 0, -14);
  ctx.closePath();
  ctx.fillStyle = FGREEN;
  ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
}

// ---- the scooter ---------------------------------------
// Deck and column in the outline black; white hubs.
// Wheels spin with the ground travel: angle =
// ground / radius, so tyre, spokes and ground agree.
function wheel(x, y, r, ang) {
  ctx.save();
  ctx.translate(x, y);
  ellO(0, 0, r, r, 0, INK, 3.5);
  ctx.rotate(ang);
  for (var sp = 0; sp < 3; sp++) {
    var a = sp / 3 * Math.PI;
    seg(Math.cos(a) * -(r - 7), Math.sin(a) * -(r - 7), Math.cos(a) * (r - 7), Math.sin(a) * (r - 7), 4, CREAM);
  }
  ctx.restore();
  ellO(x, y, 7, 7, 0, WHITE, 3);
}
var REAR_W = { x: 268, y: 716, r: 30 };
var FRONT_W = { x: 622, y: 710, r: 36 };
var DECK_Y = 700;
var GRIP = { x: 614, y: 462 };

function drawScooter(ground) {
  // Steering column from the front wheel up to the bar.
  segO(FRONT_W.x - 6, FRONT_W.y - 20, GRIP.x, GRIP.y + 8, 9, INK);
  // Deck.
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(282, DECK_Y - 6, 330, 13, 6); else ctx.rect(282, DECK_Y - 6, 330, 13);
  ctx.fillStyle = INK;
  ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.stroke();
  // Handlebar: a short cross bar at the grip.
  segO(GRIP.x - 6, GRIP.y - 12, GRIP.x + 14, GRIP.y + 10, 8, INK);
  wheel(REAR_W.x, REAR_W.y, REAR_W.r, ground / REAR_W.r);
  wheel(FRONT_W.x, FRONT_W.y, FRONT_W.r, ground / FRONT_W.r);
}

// ---- the net bag ---------------------------------------
// Hangs from the handlebar on a strap; the sack is
// cream with a speckle-brown mesh crosshatch clipped
// inside it, and the bag flowers ride its mouth. The
// whole bag bobs on 2 whole cycles per loop.
function drawBag(lt) {
  var bob = Math.sin(2 * Math.PI * 2 * lt / LOOP) * 4;
  var topX = 648, topY = 548 + bob;
  seg(GRIP.x + 8, GRIP.y + 6, topX - 8, topY - 40, 6, INK);
  seg(GRIP.x + 8, GRIP.y + 6, topX + 10, topY - 40, 6, INK);
  ctx.save();
  ctx.translate(topX, topY);
  // Sack body.
  ctx.beginPath();
  ctx.moveTo(-38, -42);
  ctx.quadraticCurveTo(-52, 10, -30, 52);
  ctx.quadraticCurveTo(0, 74, 30, 52);
  ctx.quadraticCurveTo(52, 10, 38, -42);
  ctx.closePath();
  ctx.fillStyle = CREAM;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = SPECK; ctx.lineWidth = 2;
  var d;
  for (d = -90; d < 100; d += 15) {
    ctx.beginPath(); ctx.moveTo(d, -50); ctx.lineTo(d + 40, 78); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d + 40, -50); ctx.lineTo(d, 78); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(-38, -42);
  ctx.quadraticCurveTo(-52, 10, -30, 52);
  ctx.quadraticCurveTo(0, 74, 30, 52);
  ctx.quadraticCurveTo(52, 10, 38, -42);
  ctx.closePath();
  ctx.stroke();
  // Flowers at the mouth, bobbing with the bag.
  for (var i = 0; i < BAG_FLOWERS.length; i++) {
    var bf = BAG_FLOWERS[i];
    var fb = Math.sin(2 * Math.PI * 2 * lt / LOOP + bf.ph) * 3;
    flower(bf.dx, -46 + bf.dy + fb, bf.s, bf.c, bf.ph);
  }
  leaf(-30, -30, 0.8, -0.7);
  leaf(32, -28, 0.8, 0.8);
  ctx.restore();
}

// ---- the woman -----------------------------------------
var HIP = { x: 474, y: 448 };
var SHOULDER = { x: 516, y: 342 };
var HEAD = { x: 544, y: 288 };

function drawWoman(lt, stream) {
  // Pushing leg first (behind): hip back through the
  // knee to a toe on the ground behind the rear wheel.
  var pushKnee = { x: 420, y: 566 };
  var pushToe = { x: 356, y: 706 };
  segment(HIP.x - 6, HIP.y, Math.atan2(pushKnee.x - (HIP.x - 6), pushKnee.y - HIP.y), 128, 46, 38, PURPLE, pantsPattern);
  segment(pushKnee.x, pushKnee.y, Math.atan2(pushToe.x - pushKnee.x, pushToe.y - pushKnee.y), 146, 38, 30, PURPLE, pantsPattern);
  ellO(pushToe.x + 10, pushToe.y + 12, 20, 9, 0.3, INK, 3);

  // Torso: the orange tee, a leaning quad, with the
  // white daisy swaying on the chest (3 whole cycles
  // per loop).
  poly(ORANGE, [SHOULDER.x - 34, SHOULDER.y + 6, SHOULDER.x + 30, SHOULDER.y - 4,
                HIP.x + 34, HIP.y + 8, HIP.x - 36, HIP.y + 2], true);
  var sway = Math.sin(2 * Math.PI * 3 * lt / LOOP) * 0.16;
  ctx.save();
  ctx.translate(508, 398);
  ctx.rotate(sway);
  for (var p = 0; p < 8; p++) {
    var pa = p / 8 * Math.PI * 2;
    ellO(Math.cos(pa) * 13, Math.sin(pa) * 13, 8, 8, 0, WHITE, 3);
  }
  ellO(0, 0, 7, 7, 0, FYEL, 3);
  ctx.restore();

  // Standing leg: hip down to a foot flat on the deck.
  var standKnee = { x: 492, y: 572 };
  var standAnkle = { x: 486, y: 690 };
  segment(HIP.x + 6, HIP.y + 2, Math.atan2(standKnee.x - (HIP.x + 6), standKnee.y - (HIP.y + 2)), 126, 46, 38, PURPLE, pantsPattern);
  segment(standKnee.x, standKnee.y, Math.atan2(standAnkle.x - standKnee.x, standAnkle.y - standKnee.y), 120, 38, 30, PURPLE, pantsPattern);
  ellO(standAnkle.x + 10, standAnkle.y + 8, 21, 9, 0, INK, 3);

  // Arm: orange sleeve, then skin to the grip.
  var elbow = { x: 566, y: 408 };
  segO(SHOULDER.x + 8, SHOULDER.y + 12, elbow.x, elbow.y, 24, ORANGE);
  segO(elbow.x, elbow.y, GRIP.x, GRIP.y, 17, CREAM);
  ellO(GRIP.x, GRIP.y, 10, 10, 0, CREAM, 3);

  // Hair: a black mass behind the head whose tail
  // streams with the roll speed, over a gentle ambient
  // sway (2 whole cycles per loop).
  var swayA = Math.sin(2 * Math.PI * 2 * lt / LOOP + 0.8) * 0.05;
  ctx.save();
  ctx.translate(HEAD.x - 8, HEAD.y - 6);
  ctx.rotate(stream + swayA);
  ctx.beginPath();
  ctx.moveTo(6, -34);
  ctx.quadraticCurveTo(-44, -40, -58, 2);
  ctx.quadraticCurveTo(-88, 10, -104, 34);
  ctx.quadraticCurveTo(-70, 40, -56, 30);
  ctx.quadraticCurveTo(-50, 58, -22, 62);
  ctx.quadraticCurveTo(-38, 34, -30, 12);
  ctx.quadraticCurveTo(-24, -16, 10, -20);
  ctx.closePath();
  ctx.fillStyle = INK;
  ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.restore();

  // Head: cream skin, simple face, the orange-tinted
  // sunglasses across the eyes.
  ellO(HEAD.x, HEAD.y, 35, 37, 0, CREAM, 3.5);
  ctx.beginPath();
  ctx.arc(HEAD.x - 2, HEAD.y - 8, 36, Math.PI * 0.95, Math.PI * 1.85);
  ctx.lineTo(HEAD.x - 2, HEAD.y - 8);
  ctx.closePath();
  ctx.fillStyle = INK;
  ctx.fill();
  // Smile.
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(HEAD.x + 14, HEAD.y + 12, 7, Math.PI * 0.15, Math.PI * 0.8); ctx.stroke();
  // Sunglasses: one full lens in profile, a sliver of
  // the far lens, temple arm back to the ear.
  seg(HEAD.x - 24, HEAD.y - 8, HEAD.x + 2, HEAD.y - 6, 5, INK);
  ellO(HEAD.x + 16, HEAD.y - 4, 16, 14, 0.1, ORANGE, 3.5);
  ellO(HEAD.x - 8, HEAD.y - 5, 7, 12, 0.1, ORANGE, 3);
}

// ---- the dachshund -------------------------------------
// Long tan body with brown spots, red collar, tail
// wagging on 6 whole cycles per loop. Legs cycle with
// the ground travel: diagonal pairs in opposite
// phases, so at rest (with the constant phase offset)
// the dog stands mid-trot.
var DOG = { x: 806, y: 636 };
function drawDog(lt, legPhase) {
  var hipY = DOG.y + 26;
  // Far legs (brown) swing against the near legs.
  dogLeg(DOG.x - 62, hipY, legPhase + Math.PI, BROWN);
  dogLeg(DOG.x + 58, hipY, legPhase, BROWN);
  // Tail, wagging from the rear of the body.
  var wag = Math.sin(2 * Math.PI * 6 * lt / LOOP) * 0.35;
  ctx.save();
  ctx.translate(DOG.x - 88, DOG.y - 12);
  ctx.rotate(-0.55 + wag);
  ctx.beginPath();
  ctx.moveTo(2, -6);
  ctx.quadraticCurveTo(-22, -22, -28, -50);
  ctx.quadraticCurveTo(-12, -24, 8, 4);
  ctx.closePath();
  ctx.fillStyle = TAN;
  ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.restore();
  // Body: a long capsule.
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(DOG.x - 92, DOG.y - 30, 184, 62, 31); else ctx.rect(DOG.x - 92, DOG.y - 30, 184, 62);
  ctx.fillStyle = TAN;
  ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
  ctx.stroke();
  // Spots, clipped inside the body.
  ctx.save();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(DOG.x - 92, DOG.y - 30, 184, 62, 31); else ctx.rect(DOG.x - 92, DOG.y - 30, 184, 62);
  ctx.clip();
  ell(DOG.x - 48, DOG.y - 8, 20, 13, 0.3, BROWN);
  ell(DOG.x + 6, DOG.y + 12, 24, 14, -0.2, BROWN);
  ell(DOG.x + 52, DOG.y - 14, 15, 10, 0.4, BROWN);
  ctx.restore();
  // Near legs (tan).
  dogLeg(DOG.x - 58, hipY, legPhase, TAN);
  dogLeg(DOG.x + 64, hipY, legPhase + Math.PI, TAN);
  // Head at the front: skull, long snout, floppy ear,
  // the red collar at the neck.
  poly(RED, [DOG.x + 74, DOG.y - 30, DOG.x + 94, DOG.y - 26, DOG.x + 92, DOG.y + 22, DOG.x + 72, DOG.y + 24], true);
  ellO(DOG.x + 104, DOG.y - 18, 30, 27, 0, TAN, 3.5);
  ellO(DOG.x + 136, DOG.y - 2, 24, 13, 0.25, TAN, 3.5);
  ellO(DOG.x + 156, DOG.y - 5, 7, 6, 0, INK, 3);
  ellO(DOG.x + 112, DOG.y - 22, 5, 5, 0, INK, 2.5);
  ellO(DOG.x + 92, DOG.y - 16, 13, 22, 0.35, BROWN, 3.5);
}
function dogLeg(x, y, phase, color) {
  var swing = Math.sin(phase) * 0.5;
  var foot = fk(x, y, swing, 62);
  segO(x, y, foot.x, foot.y - 8, 13, color);
  ellO(foot.x + 7, foot.y - 4, 12, 6, 0, color, 3);
}

// ---- the scene ------------------------------------------
function drawScene(lt, ground, stream) {
  // Ground: flat mustard, everywhere including the
  // letterbox (full-bleed field).
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);

  // Speckle field: exactly 500 dots, scrolled by the
  // ground travel at 0.5 parallax (ground is already
  // the halved travel) and wrapped over the field.
  var i, sx;
  for (i = 0; i < SPECKLE.length; i++) {
    var sd = SPECKLE[i];
    sx = ((sd.x - ground) % DW + DW) % DW;
    ctx.globalAlpha = sd.a;
    ctx.fillStyle = SPECK;
    ctx.beginPath();
    ctx.arc(sx, sd.y, sd.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawScooter(ground);
  drawWoman(lt, stream);
  drawBag(lt);

  // The dog trots beside the front wheel; its leg
  // phase is the ground travel plus a constant offset,
  // so frame one stands mid-trot.
  drawDog(lt, ground * 0.045 + 0.9);

  // The spilled flowers across the lower third.
  for (i = 0; i < SPILL_LEAVES.length; i++) leaf(SPILL_LEAVES[i].x, SPILL_LEAVES[i].y, 0.85, SPILL_LEAVES[i].r);
  for (i = 0; i < SPILL.length; i++) flower(SPILL[i].x, SPILL[i].y, SPILL[i].s, SPILL[i].c, SPILL[i].x * 0.37);
}

function draw() { drawScene(T % LOOP, groundNow, streamNow); }

// ---- piece state ----------------------------------------
// Constant first-frame phase: T = 5.0s into the 24s
// loop (tail at full wag, daisy mid-sway, bag flowers
// lifted). The clock advances in fixed 1/60 ticks from
// there, never from a wall clock.
//
// The roll: dragX follows the pointer while dragging
// (clamped); on release a damped spring returns it to
// exactly zero (velocity and offset snap at the end).
// ground = 0.5 * dragX is the ground travel the
// speckle, wheels and dog legs all read, so they can
// never disagree. stream is the smoothed roll speed
// the hair reads.
var T = 5.0;
var lastNow = -1, acc = 0;
var dragX = 0, dragV = 0, dragging = false;
var groundNow = 0, streamNow = 0, lastGround = 0;

function step() {
  if (!dragging) {
    dragV += (-dragX * 0.045 - dragV * 0.16);
    dragX += dragV;
    if (Math.abs(dragX) < 0.05 && Math.abs(dragV) < 0.05) { dragX = 0; dragV = 0; }
  }
  groundNow = 0.5 * dragX;
  var vel = (groundNow - lastGround) / TICK;
  lastGround = groundNow;
  streamNow += ((Math.max(-260, Math.min(260, vel)) / 260 * 0.55) - streamNow) * 0.08;
  if (!dragging && dragX === 0 && Math.abs(streamNow) < 0.001) streamNow = 0;
  T += TICK;
}

// ---- pointer: drag horizontally to roll ---------------
function toDesign(ev) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cx = (ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0)) - r.left;
  return { x: (cx - OX) / S };
}
var lastPX = 0;
function onDown(ev) {
  dragging = true; dragV = 0;
  lastPX = toDesign(ev).x;
  if (ev.preventDefault) ev.preventDefault();
}
function onMove(ev) {
  if (!dragging) return;
  var p = toDesign(ev);
  var dx = p.x - lastPX;
  lastPX = p.x;
  dragX = Math.max(-480, Math.min(480, dragX + dx));
  if (ev.preventDefault) ev.preventDefault();
}
function onUp() { dragging = false; }
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('touchcancel', onUp);
}

// ---- sizing: cover fit, full-bleed field ---------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
