<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candle Room</title>
<style>
  html, body { margin: 0; padding: 0; background: #0C0C0C; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette (strict) ----------
  var ROOM = '#0C0C0C';
  var COLUMN = '#E8E8E8';
  var SILVER = '#B0B0B0';
  var FLAME_CORE = '#FFB43C';
  var FLAME_EDGE = '#FF7A1A';
  var BRONZE = '#5E4128';
  var RUST = '#8A4A1F';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- viewport sizing (Visual Viewport API) ----------
  function viewSize() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    return { w: w, h: h };
  }
  function isPhone(w, h) {
    var sw = 9999;
    if (window.screen) sw = Math.min(window.screen.width, window.screen.height);
    return sw < 700 || h > w * 1.15;
  }

  var W = 0, H = 0, DPR = 1, PHONE = false;
  function resize() {
    var s = viewSize();
    W = Math.max(1, Math.round(s.w));
    H = Math.max(1, Math.round(s.h));
    DPR = window.devicePixelRatio || 1;
    PHONE = isPhone(W, H);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    buildScene();
  }

  // ---------- flicker: closed-form sum of seeded sines ----------
  var rngFlicker = mulberry32(813001);
  var FL = [];
  for (var i = 0; i < 6; i++) {
    FL.push({
      f: 0.6 + rngFlicker() * 2.6,        // Hz
      a: 0.35 + rngFlicker() * 0.65,      // weight
      p: rngFlicker() * Math.PI * 2       // phase
    });
  }
  var flAmpSum = 0;
  for (i = 0; i < FL.length; i++) flAmpSum += FL[i].a;

  function flicker(t) {
    var s = 0;
    for (var k = 0; k < FL.length; k++) {
      s += FL[k].a * Math.sin(2 * Math.PI * FL[k].f * t + FL[k].p);
    }
    return s / flAmpSum; // -1..1
  }
  function flameIntensity(t) {
    return 0.84 + 0.16 * flicker(t * 1.0);
  }
  function flameSway(t) {
    // slow positional wander of the flame, closed-form
    return 0.55 * Math.sin(2 * Math.PI * 0.23 * t + 1.7) +
           0.30 * Math.sin(2 * Math.PI * 0.61 * t + 0.4) +
           0.15 * flicker(t * 0.7);
  }

  // ---------- gust: recorded drag impulses, closed-form decay ----------
  var impulses = []; // {t0, vx} in units of flame-widths per second-ish
  function gustAt(t) {
    var g = 0;
    for (var k = 0; k < impulses.length; k++) {
      var dt = t - impulses[k].t0;
      if (dt >= 0) g += impulses[k].vx * Math.exp(-dt / 2.2) * (0.75 + 0.25 * Math.sin(dt * 3.1));
    }
    return g;
  }

  // ---------- static scene detail (seeded, rebuilt on resize) ----------
  var scene = null;
  function buildScene() {
    var rng = mulberry32(813777);
    var minD = Math.min(W, H);

    // bronze curtain slats with rust streaks (back wall, centre)
    var slats = [];
    var slatCount = 15;
    for (var s = 0; s < slatCount; s++) {
      var streaks = [];
      var nSt = 2 + Math.floor(rng() * 3);
      for (var j = 0; j < nSt; j++) {
        var sy0 = rng() * 0.7;
        streaks.push({
          off: rng(),               // horizontal offset within slat
          y0: sy0,                  // start down the slat
          len: (0.15 + rng() * 0.45) * (1 - sy0), // never past the slat's foot
          a: 0.10 + rng() * 0.22    // alpha
        });
      }
      slats.push({ streaks: streaks, tone: 0.85 + rng() * 0.3 });
    }

    // fog patches on each silver canvas (seeded soft ellipses)
    function fogSet() {
      var fog = [];
      for (var m = 0; m < 9; m++) {
        fog.push({
          x: rng(), y: rng(),
          r: 0.18 + rng() * 0.30,
          a: 0.04 + rng() * 0.07,
          light: rng() > 0.5
        });
      }
      return fog;
    }

    // floor speckle (very faint concrete grain)
    var grain = [];
    for (var g = 0; g < 130; g++) {
      grain.push({ x: rng(), y: rng(), r: 0.6 + rng() * 1.8, a: 0.015 + rng() * 0.03 });
    }

    scene = { slats: slats, fogL: fogSet(), fogR: fogSet(), grain: grain, minD: minD };
  }

  // ---------- helpers ----------
  function ellipse(x, y, rx, ry, color, alpha) {
    if (rx <= 0 || ry <= 0 || alpha <= 0) return;
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function rect(x, y, w, h, color, alpha) {
    if (w <= 0 || h <= 0 || alpha <= 0) return;
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 1;
  }
  function falloff(d, scale) {
    // inverse-square-ish falloff, d in px
    var q = d / scale;
    return 1 / (1 + q * q);
  }

  // ---------- layout ----------
  function layout() {
    var minD = Math.min(W, H);
    var horizon = H * 0.60;
    var wallL = W * 0.13, wallR = W * 0.87, wallT = H * 0.07;
    var flame = {
      x: W * 0.47,
      y: H * 0.855,
      h: minD * (PHONE ? 0.085 : 0.070),
      w: minD * 0.020
    };
    var colW = W * 0.075;
    var colL = { x: W * 0.245, w: colW, top: H * 0.13, bot: horizon + H * 0.05 };
    var colR = { x: W * 0.685, w: colW, top: H * 0.13, bot: horizon + H * 0.05 };
    var canW = W * 0.125, canH = H * 0.31;
    var canL = { x: colL.x + colL.w / 2 - canW / 2, y: H * 0.185, w: canW, h: canH };
    var canR = { x: colR.x + colR.w / 2 - canW / 2, y: H * 0.185, w: canW, h: canH };
    var curtain = { x: W * 0.435, w: W * 0.135, top: H * 0.165, bot: H * 0.545 };
    var beam = { x: wallL, w: wallR - wallL, y: H * 0.145, h: H * 0.022 };
    return {
      minD: minD, horizon: horizon,
      wallL: wallL, wallR: wallR, wallT: wallT,
      flame: flame, colL: colL, colR: colR,
      canL: canL, canR: canR, curtain: curtain, beam: beam
    };
  }

  // ---------- silver canvas with warm candle patch ----------
  function drawCanvas(cv, fog, flamePos, inten, t, gust) {
    var cx = cv.x + cv.w / 2, cy = cv.y + cv.h / 2;
    var d = Math.sqrt(Math.pow(cx - flamePos.x, 2) + Math.pow(cy - flamePos.y, 2));
    var fall = falloff(d, scene.minD * 0.85);

    // everything on the face is clipped to the panel: the light lives ON the silver
    ctx.save();
    ctx.beginPath();
    ctx.rect(cv.x, cv.y, cv.w, cv.h);
    ctx.clip();
    // panel base: foggy silver, mostly dark
    rect(cv.x, cv.y, cv.w, cv.h, SILVER, 0.16 + 0.10 * fall * inten);
    // fog patches
    for (var m = 0; m < fog.length; m++) {
      var f = fog[m];
      ellipse(cv.x + f.x * cv.w, cv.y + f.y * cv.h,
              f.r * cv.w, f.r * cv.h * 0.8,
              f.light ? SILVER : ROOM, f.a + (f.light ? 0.03 * fall : 0));
    }
    // warm patch: positioned by the flame's place, swings with gust
    var px = cx + (flamePos.x - cx) * 0.28 + gust * cv.w * 0.16;
    var py = cy + (flamePos.y - cy) * 0.20;
    var pr = cv.w * (0.55 + 0.25 * fall);
    var glow = fall * inten;
    ellipse(px, py, pr * 1.25, pr * 0.95, FLAME_EDGE, 0.10 * glow + 0.02);
    ellipse(px, py, pr, pr * 0.78, FLAME_EDGE, 0.16 * glow + 0.02);
    ellipse(px, py, pr * 0.55, pr * 0.42, FLAME_CORE, 0.22 * glow + 0.015);
    ctx.restore();
    // thin frame edge catching light on the flame side
    var edgeA = 0.10 + 0.25 * glow;
    if (flamePos.x < cx) rect(cv.x, cv.y, 2, cv.h, SILVER, edgeA);
    else rect(cv.x + cv.w - 2, cv.y, 2, cv.h, SILVER, edgeA);
    rect(cv.x, cv.y, cv.w, 2, SILVER, 0.08 + 0.10 * glow);
  }

  // ---------- main draw: pure function of t and recorded impulses ----------
  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var L = layout();
    var inten = flameIntensity(t);
    var gust = gustAt(t);
    // live flame position: base + wander + gust lean growing with height
    var flameBaseX = L.flame.x + flameSway(t) * L.minD * 0.006;
    var flameBaseY = L.flame.y;
    var lean = gust * L.flame.h * 0.9 + flameSway(t) * L.flame.h * 0.10;
    var flamePos = { x: flameBaseX + lean * 0.4, y: flameBaseY - L.flame.h * 0.5 };

    // room
    rect(0, 0, W, H, ROOM, 1);

    // floor: faint concrete plane below horizon, slightly lifted by column tone
    ctx.globalAlpha = 1;
    ctx.fillStyle = COLUMN;
    ctx.globalAlpha = 0.045;
    ctx.beginPath();
    ctx.moveTo(L.wallL, L.horizon);
    ctx.lineTo(L.wallR, L.horizon);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    // floor grain
    for (var g = 0; g < scene.grain.length; g++) {
      var gr = scene.grain[g];
      ellipse(gr.x * W, L.horizon + gr.y * (H - L.horizon), gr.r * 2.2, gr.r, COLUMN, gr.a);
    }
    // warm pool on the floor around the flame
    var poolFall = inten;
    ellipse(flameBaseX, flameBaseY + L.flame.h * 0.35, L.minD * 0.30, L.minD * 0.10, FLAME_EDGE, 0.05 * poolFall);
    ellipse(flameBaseX, flameBaseY + L.flame.h * 0.30, L.minD * 0.17, L.minD * 0.055, FLAME_EDGE, 0.07 * poolFall);
    ellipse(flameBaseX, flameBaseY + L.flame.h * 0.22, L.minD * 0.09, L.minD * 0.028, FLAME_CORE, 0.08 * poolFall);

    // back wall: barely-there lift so the wall plane reads
    rect(L.wallL, L.wallT, L.wallR - L.wallL, L.horizon - L.wallT, COLUMN, 0.022);

    // beam
    rect(L.beam.x, L.beam.y, L.beam.w, L.beam.h, COLUMN, 0.07);

    // bronze slatted curtain under the beam
    var cu = L.curtain;
    var slatW = cu.w / scene.slats.length;
    for (var s = 0; s < scene.slats.length; s++) {
      var sx = cu.x + s * slatW;
      var scx = sx + slatW / 2;
      var sd = Math.abs(scx - flamePos.x);
      var sFall = falloff(sd, L.minD * 0.7);
      var sl = scene.slats[s];
      rect(sx + 0.5, cu.top, slatW - 1, cu.bot - cu.top, BRONZE, (0.30 + 0.25 * sFall * inten) * sl.tone);
      // rust streaks
      for (var j = 0; j < sl.streaks.length; j++) {
        var st = sl.streaks[j];
        rect(sx + 1 + st.off * (slatW - 2.5), cu.top + st.y0 * (cu.bot - cu.top),
             1.3, st.len * (cu.bot - cu.top), RUST, st.a * (0.7 + 0.5 * sFall));
      }
      // warm crawl on the flame side of each slat
      ellipse(scx, cu.top + (cu.bot - cu.top) * 0.45, slatW * 0.9, (cu.bot - cu.top) * 0.42,
              FLAME_EDGE, 0.10 * sFall * inten);
    }

    // columns (dim white structure)
    function drawColumn(col) {
      var ccx = col.x + col.w / 2;
      var cd = Math.abs(ccx - flamePos.x);
      var cFall = falloff(cd, L.minD * 0.8);
      rect(col.x, col.top, col.w, col.bot - col.top, COLUMN, 0.13 + 0.10 * cFall * inten);
      // warm wash on the flame-facing edge, clipped to the column
      var ex = flamePos.x < ccx ? col.x : col.x + col.w;
      ctx.save();
      ctx.beginPath();
      ctx.rect(col.x, col.top, col.w, col.bot - col.top);
      ctx.clip();
      ellipse(ex, col.top + (col.bot - col.top) * 0.55, col.w * 0.55, (col.bot - col.top) * 0.34,
              FLAME_EDGE, 0.09 * cFall * inten);
      ctx.restore();
      // capital shadow line
      rect(col.x - 2, col.top, col.w + 4, 3, COLUMN, 0.10);
    }
    drawColumn(L.colL);
    drawColumn(L.colR);

    // silvered canvases on the columns
    drawCanvas(L.canL, scene.fogL, flamePos, inten, t, gust);
    drawCanvas(L.canR, scene.fogR, flamePos, inten, t, gust);

    // ambient halo around the flame (layered alpha, no gradient)
    var fh = L.flame.h * (0.92 + 0.14 * flicker(t * 1.3));
    ellipse(flameBaseX + lean * 0.5, flameBaseY - fh * 0.5, fh * 1.9, fh * 1.55, FLAME_EDGE, 0.045 * inten);
    ellipse(flameBaseX + lean * 0.5, flameBaseY - fh * 0.5, fh * 1.1, fh * 0.9, FLAME_EDGE, 0.06 * inten);
    ellipse(flameBaseX + lean * 0.5, flameBaseY - fh * 0.5, fh * 0.62, fh * 0.52, FLAME_CORE, 0.07 * inten);

    // the flame itself: stacked ellipses along a leaning curve
    var segs = 7;
    for (var q = 0; q < segs; q++) {
      var u = q / (segs - 1);              // 0 base .. 1 tip
      var fy = flameBaseY - u * fh;
      var fx = flameBaseX + lean * u * u;  // lean grows toward the tip
      var fw = L.flame.w * (1 - u * 0.72) * (0.9 + 0.2 * inten);
      var fhh = fh / segs * 1.5;
      var col = u < 0.45 ? FLAME_CORE : FLAME_EDGE;
      var al = u < 0.45 ? 0.55 + 0.35 * inten : 0.40 + 0.30 * inten;
      ellipse(fx, fy - fhh * 0.4, fw, fhh, col, al);
    }
    // bright heart
    ellipse(flameBaseX + lean * 0.08, flameBaseY - fh * 0.22, L.flame.w * 0.5, fh * 0.20, FLAME_CORE, 0.95);
  }

  // ---------- pointer: drag = air disturbance ----------
  var dragging = false, lastX = 0, lastY = 0, lastT = 0, dragLean = 0;
  function nowSec() { return performance.now() / 1000; }
  function evPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    var p = evPos(e);
    lastX = p.x; lastY = p.y; lastT = nowSec();
    dragLean = 0;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = evPos(e);
    var t = nowSec();
    var dt = Math.max(0.016, t - lastT);
    var vx = (p.x - lastX) / dt; // px per second
    dragLean = vx / Math.max(1, W) * 2.4;
    lastX = p.x; lastY = p.y; lastT = t;
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    // release the gust: flame leans away, then settles over a few seconds
    impulses.push({ t0: nowSec() - startTime, vx: dragLean * 1.6 });
    if (impulses.length > 12) impulses.splice(0, impulses.length - 12);
    dragLean = 0;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- run ----------
  var startTime = nowSec();
  // while dragging, fold the live drag lean in as a standing impulse
  function liveGust(t) {
    if (dragging) return dragLean;
    return 0;
  }
  var baseGustAt = gustAt;
  gustAt = function (t) { return baseGustAt(t) + liveGust(t); };

  resize();
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  draw(0); // frame one: synchronous, fixed phase of the seeded flicker

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(nowSec() - startTime);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
