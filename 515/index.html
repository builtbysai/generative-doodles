<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Cat</title>
<style>
  html, body { margin: 0; padding: 0; background: #141414; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var DW = 1080, DH = 1080;              // design stage, square logic
  var PHASE0 = 3.1;                      // constant first-frame loop phase, seconds
  var GROUND = '#141414';                // near-black sky and page ground
  var BODY = '#E89A1B';                  // ochre
  var BURST = '#2B3A8C';                  // dark blue asterisks, both layers
  var TAIL = '#F0608E';                   // pink ribbon tail
  var INK = '#141414';                    // two-dot face ink
  var FOOT_COLORS = ['#F0608E', '#2B4FB0', '#F2F2E4'];
  var GRAIN_TONES = ['#D98C12', '#F0A226', '#C97F0D', '#E89A1B'];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- fixed geometry (design units) ----------
  var BODY_RECT = { x: 150, y: 430, w: 790, h: 270, r: 120 };  // length 790
  var HEAD = { cx: 172, cy: 578, r: 49 };                       // diameter 98 = 1/8 of body length
  var LEG_W = 64, LEG_TOP = 630, LEG_BOT = 905;
  var LEG_X = [238, 402, 692, 838];                            // four column legs
  var FOOT = { rx: 60, ry: 25, cy: 908 };                      // feet wider than the legs
  var TAIL_BASE = { x: 928, y: 520 };                          // right hip

  // ---------- scene (seeded) ----------
  var seed = 515003;
  try {
    var m = /[?&]seed=(\d+)/.exec(location.search || '');
    if (m) seed = parseInt(m[1], 10) >>> 0;
  } catch (e) { /* fixed seed stands */ }

  var scene = null;
  function buildScene(s) {
    var rng = mulberry32(s);
    var i, bursts = [], specks = [], stars = [], feet = [];
    // body asterisk field: scattered in the silhouette bbox, clipped at draw
    var nB = 44 + Math.floor(rng() * 8);                       // 44-51 bursts
    for (i = 0; i < nB; i++) {
      bursts.push({
        x: 105 + rng() * 845,
        y: 415 + rng() * 505,
        r: 13 + rng() * 13,                                  // radius 13-26
        rot: rng() * Math.PI,
        ph: rng() * Math.PI * 2
      });
    }
    // crayon grain: precomputed specks drawn directly each frame
    for (i = 0; i < 850; i++) {
      specks.push({
        x: 105 + rng() * 845,
        y: 415 + rng() * 505,
        s: 2 + rng() * 2.6,
        c: GRAIN_TONES[Math.floor(rng() * GRAIN_TONES.length)]
      });
    }
    // background asterisks: top band only, so they never touch the body
    for (i = 0; i < 13; i++) {
      stars.push({
        x: rng() * DW,
        y: 34 + rng() * 216,                                 // y 34-250, body top is 430
        r: 38 + rng() * 32,                                  // 2-3x the body bursts
        rot: rng() * Math.PI
      });
    }
    for (i = 0; i < 4; i++) feet.push(FOOT_COLORS[Math.floor(rng() * 3)]);
    return { bursts: bursts, specks: specks, stars: stars, feet: feet };
  }
  scene = buildScene(seed);

  // ---------- viewport ----------
  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    }
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    return [w, h];
  }
  function isPhone() {
    var sz = viewSize(), w = sz[0], h = sz[1];
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  // ---------- shape helpers ----------
  function roundRectPath(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
  }
  function drawEllipse(cx, cy, rx, ry) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, ry / rx);
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // the whole animal silhouette as one path: body + legs + head + ears
  function bodyPath() {
    ctx.beginPath();
    roundRectPath(BODY_RECT.x, BODY_RECT.y, BODY_RECT.w, BODY_RECT.h, BODY_RECT.r);
    for (var i = 0; i < LEG_X.length; i++) ctx.rect(LEG_X[i], LEG_TOP, LEG_W, LEG_BOT - LEG_TOP);
    ctx.moveTo(HEAD.cx + HEAD.r, HEAD.cy);
    ctx.arc(HEAD.cx, HEAD.cy, HEAD.r, 0, Math.PI * 2);
    // two small ochre ear triangles on the head
    ctx.moveTo(132, 538); ctx.lineTo(146, 494); ctx.lineTo(164, 530); ctx.closePath();
    ctx.moveTo(176, 528); ctx.lineTo(196, 490); ctx.lineTo(206, 534); ctx.closePath();
  }
  // 8-ray asterisk burst
  function asterisk(x, y, r, rot) {
    ctx.beginPath();
    for (var k = 0; k < 8; k++) {
      var a = rot + k * Math.PI / 4;
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.lineWidth = Math.max(3, r * 0.30);
    ctx.stroke();
  }

  // ---------- main draw ----------
  function draw(t) {
    var sz = viewSize(), w = sz[0], h = sz[1];
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var phone = isPhone(); // square stage fit keeps the composition shape on phones
    void phone;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, w, h);

    var s = Math.min(w / DW, h / DH);
    var ox = (w - DW * s) / 2, oy = (h - DH * s) / 2;
    ctx.setTransform(s, 0, 0, s, ox, oy);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // background asterisks: big, dim, drifting left and wrapping
    ctx.strokeStyle = BURST;
    ctx.globalAlpha = 0.75;
    var span = DW + 180;
    for (var i = 0; i < scene.stars.length; i++) {
      var st = scene.stars[i];
      var sx = ((st.x - t * 5) % span + span) % span - 90;
      asterisk(sx, st.y, st.r, st.rot);
    }
    ctx.globalAlpha = 1;

    // the animal: one flat ochre silhouette
    bodyPath();
    ctx.fillStyle = BODY;
    ctx.fill();

    // crayon grain + asterisk field, clipped to the silhouette
    ctx.save();
    bodyPath();
    ctx.clip();
    for (i = 0; i < scene.specks.length; i++) {
      var sp = scene.specks[i];
      ctx.fillStyle = sp.c;
      ctx.globalAlpha = 0.5;
      ctx.fillRect(sp.x, sp.y, sp.s, sp.s * 0.7);
    }
    ctx.strokeStyle = BURST;
    for (i = 0; i < scene.bursts.length; i++) {
      var b = scene.bursts[i];
      // traveling pulse: alpha 0.7-1.0, wave runs along the body by x
      ctx.globalAlpha = 0.85 + 0.15 * Math.sin(t * 1.1 - b.x * 0.008 + b.ph);
      asterisk(b.x, b.y, b.r, b.rot);
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // pink ribbon tail: from the right hip, arcing over the back, swaying
    var swayX = Math.sin(t * 0.5) * 18;
    var swayY = Math.sin(t * 0.37 + 1.2) * 10;
    ctx.strokeStyle = TAIL;
    ctx.lineWidth = 36;
    ctx.beginPath();
    ctx.moveTo(TAIL_BASE.x, TAIL_BASE.y);
    ctx.quadraticCurveTo(880 + swayX, 292 + swayY, 636, 398 + swayY * 0.5);
    ctx.stroke();

    // oversized round feet, one flat color each
    for (i = 0; i < 4; i++) {
      ctx.fillStyle = scene.feet[i];
      drawEllipse(LEG_X[i] + LEG_W / 2, FOOT.cy, FOOT.rx, FOOT.ry);
    }

    // two-dot face on the tiny head, her whole grammar
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(HEAD.cx - 15, HEAD.cy - 8, 5.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(HEAD.cx + 15, HEAD.cy - 8, 5.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3.6;
    ctx.beginPath();
    ctx.moveTo(HEAD.cx - 9, HEAD.cy + 14);
    ctx.quadraticCurveTo(HEAD.cx, HEAD.cy + 21, HEAD.cx + 9, HEAD.cy + 13);
    ctx.stroke();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  // ---------- interaction: double-tap reseeds bursts and foot colors ----------
  function reseed() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    scene = buildScene(seed);
    draw(PHASE0 + elapsed);
  }
  var lastTap = -1;
  canvas.addEventListener('pointerdown', function (ev) {
    var now = ev && typeof ev.timeStamp === 'number' ? ev.timeStamp : 0;
    if (lastTap >= 0 && now - lastTap < 350) { lastTap = -1; reseed(); }
    else lastTap = now;
  });
  canvas.addEventListener('dblclick', function () { lastTap = -1; reseed(); });

  // ---------- resize + loop ----------
  var elapsed = 0;
  function onResize() { draw(PHASE0 + elapsed); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    window.addEventListener('resize', onResize);
  }

  draw(PHASE0); // synchronous deterministic first frame

  var startStamp = null;
  function tick(now) {
    if (startStamp === null) startStamp = now;
    elapsed = (now - startStamp) / 1000;
    draw(PHASE0 + elapsed);
    requestAnimationFrame(tick);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
</body>
</html>
