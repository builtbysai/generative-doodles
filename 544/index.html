<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breaking Point</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #A8C8CC; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  var BLUE = '#A8C8CC', TERRA = '#D89A80', INK = '#161616', WHITE = '#FFFFFF';
  var SKINS = ['#EFD9C4', '#E8B48F', '#C98A6B'];
  // "One step darker" tint per skin: next palette tone at high alpha;
  // the darkest tone steps down with the palette's own black at low alpha.
  var TINTS = [
    { c: '#E8B48F', a: 0.9 },
    { c: '#C98A6B', a: 0.9 },
    { c: '#161616', a: 0.18 }
  ];

  var PHASE0 = 1.3;     // constant first-frame phase: breath mid-swing, all faces blank
  var BREATH = 7;       // seconds per shared breath cycle
  var BEAT = 6;         // seconds per anger beat

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(544065);

  // ---- layout (1080 x 1080 design space): 4 cols x 3 rows, full-bleed ----
  var COLS = 4, ROWS = 3, CW = 1080 / COLS, CH = 1080 / ROWS; // 270 x 360

  // ---- faces: parametric masks, seeded once, fixed forever ----
  var FACES = [];
  for (var i = 0; i < COLS * ROWS; i++) {
    FACES.push({
      skin: Math.floor(rng() * 3),
      hair: Math.floor(rng() * 8),              // 8 cap variants
      hairWhite: rng() < 0.35,
      eyeGap: 30 + rng() * 12,                  // half eye spacing
      rx: 76 + rng() * 10,
      ry: 98 + rng() * 12
    });
  }

  // ---- anger state: one face at a time ----
  var angryIdx = -1, beatStart = 0;

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ramp(t, a, b) { return clamp01((t - a) / (b - a)); }

  // Staged beat factors for beat-local time bt (seconds into the 6s beat).
  function beatFactors(bt) {
    var release = 1 - ramp(bt, 4.6, 5.6);                    // shared exhale
    var veinPulse = 0;
    if (bt > 1.5 && bt < 3.6) {
      var b1 = clamp01((bt - 1.7) / 0.6), b2 = clamp01((bt - 2.6) / 0.6);
      veinPulse = Math.max(Math.sin(b1 * Math.PI), Math.sin(b2 * Math.PI)); // two ticks
    }
    return {
      brow: ramp(bt, 0, 0.7) * release,                      // 0.0-0.7 slash in
      mouth: ramp(bt, 0.7, 1.5) * release,                   // 0.7-1.5 tighten
      vein: veinPulse,                                       // 1.7 + 2.6 ticks
      tint: ramp(bt, 2.3, 3.3) * (1 - ramp(bt, 4.6, 6.0))    // 2.3-3.3 in, 4.6-6.0 out
    };
  }

  // ---- drawing ----
  function traceHead(cx, cy, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  }

  function drawHair(f, cx, cy) {
    var rx = f.rx, ry = f.ry;
    ctx.fillStyle = f.hairWhite ? WHITE : INK;
    ctx.strokeStyle = f.hairWhite ? WHITE : INK;
    switch (f.hair) {
      case 0: // flat cap
        ctx.beginPath();
        ctx.moveTo(cx - rx, cy - ry * 0.30);
        ctx.quadraticCurveTo(cx, cy - ry * 1.45, cx + rx, cy - ry * 0.30);
        ctx.quadraticCurveTo(cx, cy - ry * 0.52, cx - rx, cy - ry * 0.30);
        ctx.closePath(); ctx.fill();
        break;
      case 1: // side sweep: diagonal lower edge, high on one side, never near the eyes
        ctx.beginPath();
        ctx.moveTo(cx - rx, cy - ry * 0.30);
        ctx.quadraticCurveTo(cx - rx * 0.2, cy - ry * 1.5, cx + rx, cy - ry * 0.48);
        ctx.quadraticCurveTo(cx, cy - ry * 0.62, cx - rx, cy - ry * 0.30);
        ctx.closePath(); ctx.fill();
        break;
      case 2: // bun
        ctx.beginPath();
        ctx.moveTo(cx - rx, cy - ry * 0.30);
        ctx.quadraticCurveTo(cx, cy - ry * 1.45, cx + rx, cy - ry * 0.30);
        ctx.quadraticCurveTo(cx, cy - ry * 0.52, cx - rx, cy - ry * 0.30);
        ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy - ry - 4, 20, 0, Math.PI * 2); ctx.fill();
        break;
      case 3: // bob: side panels end above the eye line, scooped lower edge
        ctx.beginPath();
        ctx.moveTo(cx - rx, cy - ry * 0.12);
        ctx.quadraticCurveTo(cx, cy - ry * 1.5, cx + rx, cy - ry * 0.12);
        ctx.quadraticCurveTo(cx, cy - ry * 0.50, cx - rx, cy - ry * 0.12);
        ctx.closePath(); ctx.fill();
        break;
      case 4: // curls: five bumps along the top arc
        for (var k = 0; k < 5; k++) {
          var a = Math.PI * (1.08 + 0.21 * k);
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * rx * 0.90, cy + Math.sin(a) * ry * 0.90, 17, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      case 5: // fringe: zigzag lower edge, arc top
        ctx.beginPath();
        ctx.moveTo(cx - rx * 0.85, cy - ry * 0.30);
        for (var j = 1; j <= 6; j++) {
          ctx.lineTo(cx - rx * 0.85 + j * (rx * 1.7 / 6), cy - ry * 0.30 + (j % 2 ? 16 : 0));
        }
        ctx.quadraticCurveTo(cx, cy - ry * 1.5, cx - rx * 0.85, cy - ry * 0.30);
        ctx.closePath(); ctx.fill();
        break;
      case 6: // bald band: one thin arc near the top
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx * 0.84, ry * 0.84, 0, Math.PI * 1.18, Math.PI * 1.82);
        ctx.stroke();
        break;
      case 7: // twin puffs
        ctx.beginPath(); ctx.arc(cx - rx * 0.55, cy - ry * 0.80, 21, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + rx * 0.55, cy - ry * 0.80, 21, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx - rx, cy - ry * 0.34);
        ctx.quadraticCurveTo(cx, cy - ry * 1.4, cx + rx, cy - ry * 0.34);
        ctx.quadraticCurveTo(cx, cy - ry * 0.55, cx - rx, cy - ry * 0.34);
        ctx.closePath(); ctx.fill();
        break;
    }
  }

  function drawFace(idx, t) {
    var f = FACES[idx];
    var col = idx % COLS, row = Math.floor(idx / COLS);
    var cx = col * CW + CW / 2, cy = row * CH + CH / 2;
    var rx = f.rx, ry = f.ry, eyeY = cy - 6;

    // shared breath: the whole face breathes as one, same phase for all twelve
    var bs = 1 + 0.010 * Math.sin(2 * Math.PI * t / BREATH);
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(bs, bs); ctx.translate(-cx, -cy);

    traceHead(cx, cy, rx, ry);
    ctx.fillStyle = SKINS[f.skin];
    ctx.fill();

    var bf = null;
    if (idx === angryIdx) {
      var bt = t - beatStart;
      if (bt >= 0 && bt < BEAT) bf = beatFactors(bt);
      else if (bt >= BEAT) angryIdx = -1;
    }
    if (bf && bf.tint > 0) {
      var tn = TINTS[f.skin];
      ctx.save();
      ctx.globalAlpha = tn.a * bf.tint;
      traceHead(cx, cy, rx, ry);
      ctx.fillStyle = tn.c;
      ctx.fill();
      ctx.restore();
    }

    drawHair(f, cx, cy);

    // symbol face: dot eyes, one line mouth
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(cx - f.eyeGap, eyeY, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + f.eyeGap, eyeY, 6.5, 0, Math.PI * 2); ctx.fill();

    var mLen = 34, mW = 5;
    if (bf) { mLen = 34 - 14 * bf.mouth; mW = 5 + 3.5 * bf.mouth; }
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    ctx.lineWidth = mW;
    ctx.beginPath();
    ctx.moveTo(cx - mLen / 2, cy + ry * 0.38);
    ctx.lineTo(cx + mLen / 2, cy + ry * 0.38);
    ctx.stroke();

    if (bf) {
      // eyebrows slash in: inner ends drop toward the centre
      if (bf.brow > 0) {
        var by = eyeY - 30, p = bf.brow;
        ctx.lineWidth = 7;
        ctx.beginPath(); // left brow: outer -> inner (lower)
        ctx.moveTo(cx - f.eyeGap - 15, by - 6);
        ctx.lineTo(cx - f.eyeGap - 15 + 30 * p, by - 6 + 11 * p);
        ctx.stroke();
        ctx.beginPath(); // right brow: outer -> inner (lower)
        ctx.moveTo(cx + f.eyeGap + 15, by - 6);
        ctx.lineTo(cx + f.eyeGap + 15 - 30 * p, by - 6 + 11 * p);
        ctx.stroke();
      }
      // forehead vein: ticks twice, a small bent vessel at the temple
      if (bf.vein > 0.02) {
        var vx = cx + rx * 0.40, vy = cy - ry * 0.52, vs = 0.7 + 0.5 * bf.vein;
        ctx.save();
        ctx.translate(vx, vy); ctx.scale(vs, vs);
        ctx.lineWidth = 5; ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -11); ctx.lineTo(2, 0); ctx.lineTo(-3, 9);
        ctx.moveTo(2, 0); ctx.lineTo(10, 4);
        ctx.stroke();
        ctx.restore();
      }
    }
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = BLUE;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    // grounds: alternating flat panels, full-bleed
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        ctx.fillStyle = (r + c) % 2 === 0 ? BLUE : TERRA;
        ctx.fillRect(c * CW, r * CH, CW, CH);
      }
    }
    for (var i = 0; i < COLS * ROWS; i++) drawFace(i, t);

    // thin black gutters and edge
    ctx.strokeStyle = INK;
    ctx.lineWidth = 5;
    ctx.beginPath();
    for (var gx = 1; gx < COLS; gx++) { ctx.moveTo(gx * CW, 0); ctx.lineTo(gx * CW, 1080); }
    for (var gy = 1; gy < ROWS; gy++) { ctx.moveTo(0, gy * CH); ctx.lineTo(1080, gy * CH); }
    ctx.stroke();
    ctx.strokeRect(0, 0, 1080, 1080);

    // hint
    ctx.save();
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = INK;
    ctx.font = '26px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('tap', 1062, 1064);
    ctx.restore();

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is dusty blue) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      // the grid keeps its shape and spans the full phone width
      S = W;
      OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H);
      OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  // ---- tap: start (or transfer) the anger beat ----
  var lastTapStamp = -1;
  function onTap(e) {
    if (e.timeStamp !== undefined && e.timeStamp - lastTapStamp < 400) return;
    lastTapStamp = e.timeStamp || 0;
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var px = (e.clientX - rect.left - OX) / S * 1080;
    var py = (e.clientY - rect.top - OY) / S * 1080;
    if (px < 0 || px >= 1080 || py < 0 || py >= 1080) return;
    var idx = Math.floor(py / CH) * COLS + Math.floor(px / CW);
    angryIdx = idx;         // tapping another face transfers the break
    beatStart = simT;       // tapping the angry face restarts its beat
    draw(simT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onTap);
    canvas.addEventListener('touchstart', onTap);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
