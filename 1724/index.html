<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nested Glass</title>
<style>
html, body { margin: 0; padding: 0; background: #221E1C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#221E1C';
var CENTER = '#171414';
var PLATE = '#141110';
var PLATE_LINE = 'rgba(232,160,168,0.55)';
var TITLE_INK = '#F5E9E6';
var HINT_INK = '#E8A0A8';
var PERIOD = 16;
var FRAME_T = 3.0;
var SQUARES = 10;
/* rose ramp, outer to inner: deep rose through blush */
var ROSE = [
  '#A63D52',
  '#B94E64',
  '#C25A6E',
  '#CF6E80',
  '#D97B8C',
  '#E08A99',
  '#E8A0A8',
  '#EDB3B8',
  '#F2C4C9',
  '#F6D6D9'
];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: centered square on every screen (centered geometric piece) ---- */
function stageRect() {
  var s = Math.min(VW, VH) * 0.92;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var cx = st.x + st.w / 2, cy = st.y + st.h / 2;
  /* dark center panel the squares nest over */
  ctx.fillStyle = CENTER;
  ctx.fillRect(st.x, st.y, st.w, st.h);
  var t = phaseT;
  var i, ph, breathe, half, alpha;
  for (i = 0; i < SQUARES; i++) {
    /* phase offsets staggered evenly across the cycle, outer first */
    ph = TAU * (t / PERIOD + i / SQUARES);
    /* scale breaths +/-8% around the base half-size */
    breathe = 1 + 0.08 * Math.sin(ph);
    /* base half-size: largest 0.46 of stage, innermost 0.055, evenly spaced */
    half = st.w * (0.46 - i * (0.405 / (SQUARES - 1))) * breathe;
    /* alpha breaths between 0.10 and 0.42, out of phase with the scale */
    alpha = 0.26 + 0.16 * Math.sin(ph + Math.PI / 2);
    ctx.fillStyle = rgba(ROSE[i], alpha);
    ctx.fillRect(cx - half, cy - half, half * 2, half * 2);
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Nested Glass').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Nested Glass').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 01').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Nested Glass', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 01', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the squares breathe.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    squareCount: function () { return SQUARES; },
    period: function () { return PERIOD; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 3.0s of a 16s period ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
