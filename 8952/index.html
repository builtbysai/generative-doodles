<!DOCTYPE html>
<!-- phantom-fill-8952 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clang — №8952</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#f2ede1;color:#141210;font-family:Georgia,serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  .hud{position:absolute;z-index:2;pointer-events:none}
  #title{top:22px;left:26px}
  #title h1{font-size:17px;letter-spacing:.4em;font-weight:400}
  #title p{font-size:11px;letter-spacing:.14em;color:#7a7263;margin-top:6px;font-family:"Courier New",monospace}
  #clock{top:20px;right:26px;text-align:right;font-family:"Courier New",monospace}
  #t{font-size:38px;line-height:1}
  #t span{font-size:14px;color:#7a7263}
  #clangNo{font-size:11px;letter-spacing:.3em;color:#8c2f1b;margin-top:6px}
  #marks{left:26px;bottom:44px;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.12em;color:#7a7263;line-height:1.9}
  #marks b{color:#141210;font-weight:400}
  #start{position:absolute;right:26px;bottom:44px;z-index:3;background:none;border:1px solid #141210;color:#141210;font-family:"Courier New",monospace;font-size:12px;letter-spacing:.3em;padding:12px 24px;cursor:pointer}
  #start:hover{background:#141210;color:#f2ede1}
  #timeline{position:absolute;left:0;right:0;bottom:0;height:26px;z-index:2;border-top:1px solid rgba(20,18,16,.25)}
  #elapsed{position:absolute;left:0;top:0;bottom:0;background:rgba(140,47,27,.18);width:0}
  .clangMark{position:absolute;top:0;bottom:0;width:2px;background:#8c2f1b}
  .clangMark i{position:absolute;top:4px;left:5px;font-style:normal;font-family:"Courier New",monospace;font-size:10px;color:#8c2f1b;letter-spacing:.1em;white-space:nowrap}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud" id="title"><h1>CLANG</h1><p>№8952 — SIXTEEN AGENTS. SEVEN INK MARKS. A 54-SECOND ARC.<br>THREE CLANGS PUNCTUATE IT. TIME IS THE SCORE.</p></div>
<div class="hud" id="clock"><div id="t">0.0<span> / 54s</span></div><div id="clangNo">—</div></div>
<div class="hud" id="marks">MARKS&nbsp; <b id="markList">DOT · STROKE · HOOK · SPLASH · RING · SLASH · BLOT</b><br>AGENTS&nbsp; <b>16</b> &nbsp;·&nbsp; CLANGS AT <b>18 · 36 · 54</b></div>
<button id="start">BEGIN THE ARC</button>
<div id="timeline"><div id="elapsed"></div>
  <div class="clangMark" style="left:33.33%"><i>CLANG I · 18s</i></div>
  <div class="clangMark" style="left:66.66%"><i>CLANG II · 36s</i></div>
  <div class="clangMark" style="left:99.6%"><i>III</i></div>
</div>
<script>
(function(){
  "use strict";
  var cv=document.getElementById('stage'),ctx=cv.getContext('2d'),W,H;
  function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
  size();addEventListener('resize',size);
  var DURATION=54, CLANGS=[18,36,54];
  var AC=null, master=null, muted=false, running=false, t0=0, fired=[false,false,false], clangCount=0;
  var tEl=document.getElementById('t'), cEl=document.getElementById('clangNo'),
      elEl=document.getElementById('elapsed'), startBtn=document.getElementById('start');
  // --- sixteen agents, seven marks ---
  var MARKS=['DOT','STROKE','HOOK','SPLASH','RING','SLASH','BLOT'];
  var agents=[];
  function seed(){
    agents=[];
    for(var i=0;i<16;i++){
      agents.push({x:Math.random(),y:0.15+Math.random()*0.7,a:Math.random()*Math.PI*2,
        sp:0.0009+Math.random()*0.0016,mark:i%7,size:4+Math.random()*12,age:Math.random()*60});
    }
    ctx.clearRect(0,0,W,H);
  }
  seed();
  function drawMark(ag){
    var x=ag.x*W,y=ag.y*H,s=ag.size*devicePixelRatio;
    ctx.fillStyle='rgba(20,18,16,0.5)';ctx.strokeStyle='rgba(20,18,16,0.55)';
    ctx.lineWidth=Math.max(1,s*0.14);
    switch(ag.mark){
      case 0: ctx.beginPath();ctx.arc(x,y,s*0.3,0,Math.PI*2);ctx.fill();break;
      case 1: ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x+s,y+Math.sin(ag.age)*s*0.2);ctx.stroke();break;
      case 2: ctx.beginPath();ctx.arc(x,y,s*0.5,0.3,Math.PI*1.4);ctx.stroke();break;
      case 3: for(var k=0;k<7;k++){ctx.beginPath();ctx.arc(x+(Math.random()-0.5)*s*2,y+(Math.random()-0.5)*s*2,s*0.12,0,Math.PI*2);ctx.fill();}break;
      case 4: ctx.beginPath();ctx.arc(x,y,s*0.5,0,Math.PI*2);ctx.stroke();break;
      case 5: ctx.beginPath();ctx.moveTo(x-s,y-s);ctx.lineTo(x+s,y+s);ctx.stroke();break;
      case 6: ctx.beginPath();ctx.ellipse(x,y,s*0.6,s*0.4,ag.a,0,Math.PI*2);ctx.fill();break;
    }
  }
  // --- clang: struck metal via inharmonic FM partials ---
  function clang(n){
    if(!AC)return;
    var t=AC.currentTime;
    var partials=[1,2.76,5.4,8.9];
    partials.forEach(function(p,i){
      var o=AC.createOscillator(),g=AC.createGain(),base=180*(n===3?0.75:1);
      o.type='sine';o.frequency.value=base*p*(1+(Math.random()-0.5)*0.01);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.5/(i+1),t+0.005);
      g.gain.exponentialRampToValueAtTime(0.0001,t+2.2-i*0.3);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+2.5);
    });
    clangCount++;
    cEl.textContent='CLANG '+['I','II','III'][n-1]+' — '+clangCount+' OF 3';
    // ink shockwave: every agent jumps to the next mark
    agents.forEach(function(ag){ag.mark=(ag.mark+1)%7;ag.a+=Math.PI/2;});
    document.getElementById('markList').textContent=MARKS.map(function(m,i){
      return i===agents[0].mark?('['+m+']'):m;
    }).join(' · ');
  }
  startBtn.addEventListener('click',function(){
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
    }
    if(!running){seed();fired=[false,false,false];clangCount=0;cEl.textContent='—';
      t0=performance.now();running=true;startBtn.textContent='MUTE';}
    else if(muted){muted=false;master.gain.value=0.9;startBtn.textContent='MUTE';AC.resume();}
    else{muted=true;master.gain.value=0;startBtn.textContent='UNMUTE';}
  });
  function suspend(){if(AC&&AC.state==='running')AC.suspend();}
  function resume(){if(AC&&AC.state==='suspended'&&!muted)AC.resume();}
  document.addEventListener('visibilitychange',function(){document.hidden?suspend():resume();});
  addEventListener('blur',suspend);addEventListener('focus',resume);
  addEventListener('pagehide',suspend);addEventListener('beforeunload',suspend);
  // --- the arc: agents drift, marks cycle every 6s, clangs at 18/36/54 ---
  var lastCycle=0;
  function frame(now){
    if(running){
      var t=(now-t0)/1000;
      if(t>=DURATION){t=DURATION;running=false;startBtn.textContent='RUN IT AGAIN';}
      tEl.innerHTML=t.toFixed(1)+'<span> / 54s</span>';
      elEl.style.width=(t/DURATION*100)+'%';
      CLANGS.forEach(function(c,i){if(!fired[i]&&t>=c){fired[i]=true;clang(i+1);}});
      var cyc=Math.floor(t/6);
      if(cyc!==lastCycle){lastCycle=cyc;agents.forEach(function(ag){ag.mark=(ag.mark+1)%7;});}
      agents.forEach(function(ag){
        ag.a+=(Math.random()-0.5)*0.12;
        ag.x+=Math.cos(ag.a)*ag.sp;ag.y+=Math.sin(ag.a)*ag.sp*0.8;ag.age++;
        if(ag.x<0.02||ag.x>0.98){ag.a=Math.PI-ag.a+(Math.random()-0.5)*1.4;}
        if(ag.y<0.15||ag.y>0.85){ag.a=-ag.a+(Math.random()-0.5)*1.4;}
        if(Math.floor(ag.age)%10===0)drawMark(ag);
      });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
