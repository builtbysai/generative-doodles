<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flying Through the Lists</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var BLACK = '#0A0A0A';
  var CHALK = '#F2EFE8';
  var GREY  = '#4A4A48';
  var EMBER = '#D8B25A';

  // ---------- word set (Chalkroom register, prompt-specced) ----------
  var PHRASES = [
    'ANGELS OF ARTIFICE',
    'SAY TO MYSELF',
    'OCEAN',
    'SUGAR CANDY BABY',
    'MONO TASKING',
    'DEAR OLD ANDERS',
    'THE MOON IS A',
    'LISTEN'
  ];

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(a, b) {
    var h = (a * 374761393 + b * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ---------- flight model constants ----------
  var T_CYCLE = 48;        // seconds for one word to travel far -> near
  var D_FAR = 9.0, D_NEAR = 1.1;
  var L_COLLECT = 0.90;    // u-level of the collection plane
  var BASE_SEED = 851104;
  var N_INST = 13;

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, PHONE = false;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 720);
    var h = vv ? vv.height : (window.innerHeight || 720);
    W = Math.max(50, Math.round(w));
    H = Math.max(50, Math.round(h));
    canvas.width = W;
    canvas.height = H;
    var sw = (typeof window !== 'undefined' && window.screen) ? Math.min(window.screen.width || 9999, window.screen.height || 9999) : 9999;
    PHONE = (sw < 700) || (H > W * 1.15);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }
  resize();

  // ---------- field generation (per epoch, seeded) ----------
  function makeField(seed) {
    var rng = mulberry32(seed);
    // stratified phase ladder: at t=0 the words sit at well-spread depths
    var ladder = [0.04, 0.11, 0.18, 0.25, 0.32, 0.39, 0.46, 0.53, 0.60, 0.67, 0.73, 0.79, 0.84];
    for (var s = ladder.length - 1; s > 0; s--) {
      var r = Math.floor(rng() * (s + 1));
      var tmp = ladder[s]; ladder[s] = ladder[r]; ladder[r] = tmp;
    }
    // loose grid of anchor points so instances do not pile up at center
    var anchors = [];
    var colsX = [-1.95, -1.0, 0.0, 1.0, 1.95];
    var rowsY = [-1.5, -0.55, 0.45, 1.45];
    for (var gx = 0; gx < colsX.length; gx++) for (var gy = 0; gy < rowsY.length; gy++) anchors.push({ x: colsX[gx], y: rowsY[gy] });
    for (s = anchors.length - 1; s > 0; s--) {
      r = Math.floor(rng() * (s + 1));
      tmp = anchors[s]; anchors[s] = anchors[r]; anchors[r] = tmp;
    }
    var insts = [];
    for (var i = 0; i < N_INST; i++) {
      var phrase = PHRASES[i % PHRASES.length];
      var anchor = anchors[i % anchors.length];
      var inst = {
        idx: i,
        phrase: phrase,
        p: ladder[i % ladder.length] + (rng() * 2 - 1) * 0.015,
        wx: anchor.x + (rng() * 2 - 1) * 0.3,
        wy: anchor.y + (rng() * 2 - 1) * 0.22,
        rot: (rng() * 2 - 1) * 0.04,            // whole-word tilt
        letters: []
      };
      for (var j = 0; j < phrase.length; j++) {
        inst.letters.push({
          ch: phrase.charAt(j),
          rot: (rng() * 2 - 1) * 0.11,
          dy: (rng() * 2 - 1) * 0.075,
          scl: 0.92 + rng() * 0.16,
          drip: rng() < 0.20 ? 0.35 + rng() * 0.9 : 0,   // drip length in em, 0 = none
          dripBend: (rng() * 2 - 1) * 0.12
        });
      }
      insts.push(inst);
    }
    // Frame-one anchor: instance 2 ("OCEAN") starts near, large, toward the left edge.
    var hero = insts[2];
    hero.p = 0.855;
    hero.wx = -1.42;
    hero.wy = -0.28;
    // the hero is the only near word at frame one: swap any other late phase back
    for (var q = 0; q < insts.length; q++) {
      if (q !== 2 && insts[q].p > 0.80) {
        for (var q2 = 0; q2 < insts.length; q2++) {
          if (q2 !== 2 && q2 !== q && insts[q2].p < 0.30) {
            var tp = insts[q].p; insts[q].p = insts[q2].p; insts[q2].p = tp; break;
          }
        }
      }
    }
    return insts;
  }

  // ---------- recorded interaction ----------
  var steerSamples = [];   // {t, x, y, kind:'down'|'move'|'up'} in world units
  var rawTaps = [];        // {t, x, y} in px

  function nowSec() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return 0;
  }
  var T0 = nowSec();
  function pieceTime() { return nowSec() - T0; }

  // steering offset as a closed-form function of recorded samples and t
  function steerAt(t) {
    var sx = 0, sy = 0, mode = 'free', lastX = 0, lastY = 0, lastT = 0, prev = null;
    for (var i = 0; i < steerSamples.length; i++) {
      var s = steerSamples[i];
      if (s.t > t) break;
      if (s.kind === 'down') { mode = 'drag'; sx = s.x; sy = s.y; lastX = s.x; lastY = s.y; lastT = s.t; prev = null; }
      else if (s.kind === 'move' && mode === 'drag') { prev = { x: lastX, y: lastY, t: lastT }; lastX = s.x; lastY = s.y; lastT = s.t; sx = s.x; sy = s.y; }
      else if (s.kind === 'up') { mode = 'decay'; lastX = sx; lastY = sy; lastT = s.t; }
    }
    if (mode === 'drag') {
      if (prev && t > prev.t && lastT > prev.t) {
        var f = Math.min(1, (t - prev.t) / (lastT - prev.t));
        return { x: prev.x + (lastX - prev.x) * f, y: prev.y + (lastY - prev.y) * f };
      }
      return { x: lastX, y: lastY };
    }
    if (mode === 'decay') {
      var k = Math.exp(-(t - lastT) / 1.4);
      return { x: lastX * k, y: lastY * k };
    }
    return { x: 0, y: 0 };
  }

  // taps -> epochs (double-tap reseeds) and bursts, derived deterministically
  function deriveTimeline() {
    var epochs = [{ start: 0, seed: BASE_SEED, field: null }];
    var bursts = [];
    var pending = null;
    for (var i = 0; i < rawTaps.length; i++) {
      var tap = rawTaps[i];
      if (pending && (tap.t - pending.t) <= 0.32) {
        // double tap: cancel pending burst, reseed
        bursts = bursts.filter(function (b) { return b.tapRef !== pending; });
        epochs.push({ start: tap.t, seed: BASE_SEED + epochs.length * 7919, field: null });
        pending = null;
      } else {
        var b = { t: tap.t, x: tap.x, y: tap.y, tapRef: tap, word: -1, cycle: -1, bx: 0, by: 0, resolved: false };
        bursts.push(b);
        pending = tap;
      }
    }
    return { epochs: epochs, bursts: bursts };
  }
  function epochAt(tl, t) {
    var ep = tl.epochs[0];
    for (var i = 0; i < tl.epochs.length; i++) if (tl.epochs[i].start <= t) ep = tl.epochs[i];
    if (!ep.field) ep.field = makeField(ep.seed);
    return ep;
  }

  // ---------- projection ----------
  function depthAt(inst, tE, t) {
    var u = ((inst.p + (t - tE) / T_CYCLE) % 1 + 1) % 1;
    return { u: u, d: D_FAR - u * (D_FAR - D_NEAR) };
  }
  function project(wx, wy, d, steer) {
    var m = Math.min(W, H);
    // position divisor softened (d^0.82) so far words stay spread across the
    // field instead of collapsing into one central knot; size still uses true d
    var f = 0.52 * m / Math.pow(d, 0.82);
    return { x: W / 2 + (wx - steer.x) * f, y: H / 2 + (wy - steer.y) * f };
  }
  function fontAt(d, phrase) {
    var lenF = phrase ? Math.pow(9 / Math.max(9, phrase.length), 0.55) : 1;
    return Math.min(W, H) * 0.235 / d * lenF;
  }
  function alphaAt(d) { return Math.max(0.16, Math.min(0.95, 1.18 - d / 9.0)); }

  function cycleOf(inst, tE, t) { return Math.floor(inst.p + (t - tE) / T_CYCLE); }

  // crossing time of the collection plane for cycle k
  function crossingTime(inst, tE, k) { return tE + (L_COLLECT - inst.p + k) * T_CYCLE; }

  // derived collections for an epoch up to time t
  function collectionsAt(ep, tl, t) {
    var out = [];
    var tE = ep.start;
    for (var i = 0; i < ep.field.length; i++) {
      var inst = ep.field[i];
      var k0 = Math.max(0, Math.ceil(inst.p - L_COLLECT));
      for (var k = k0; ; k++) {
        var tc = crossingTime(inst, tE, k);
        if (tc > t) break;
        if (tc < tE) continue;
        // burst in the same cycle before the crossing cancels the collection
        var burstCancelled = false;
        for (var bi = 0; bi < tl.bursts.length; bi++) {
          var b = tl.bursts[bi];
          if (b.t >= tE && b.t < tc && b.resolved && b.word === inst.idx && b.cycle === k) { burstCancelled = true; break; }
        }
        if (burstCancelled) continue;
        var dP = D_FAR - L_COLLECT * (D_FAR - D_NEAR);
        var st = steerAt(tc);
        var pos = project(inst.wx, inst.wy, dP, st);
        var dx = pos.x - W / 2, dy = pos.y - H / 2;
        if (Math.sqrt(dx * dx + dy * dy) < 0.30 * Math.min(W, H)) {
          out.push({ phrase: inst.phrase, tc: tc, word: inst.idx, cycle: k, x: pos.x, y: pos.y, d: dP });
        }
      }
    }
    out.sort(function (a, b) { return a.tc - b.tc; });
    return out;
  }

  // resolve a burst event against the field state at its time (deterministic)
  function resolveBurst(ep, tl, b) {
    if (b.resolved) return;
    b.resolved = true;
    var tE = ep.start;
    if (b.t < tE) return;
    var st = steerAt(b.t);
    var best = -1, bestDist = 1e12, bestPos = null, bestCycle = -1;
    var cols = collectionsAt(ep, tl, b.t);
    for (var i = 0; i < ep.field.length; i++) {
      var inst = ep.field[i];
      var k = cycleOf(inst, tE, b.t);
      var gone = false;
      for (var ci = 0; ci < cols.length; ci++) if (cols[ci].word === inst.idx && cols[ci].cycle === k) { gone = true; break; }
      if (gone) continue;
      var dp = depthAt(inst, tE, b.t);
      if (dp.u > 0.985) continue;
      var pos = project(inst.wx, inst.wy, dp.d, st);
      var dx = pos.x - b.x, dy = pos.y - b.y;
      var dist = dx * dx + dy * dy;
      if (dist < bestDist) { bestDist = dist; best = inst.idx; bestPos = pos; bestCycle = k; }
    }
    b.word = best; b.cycle = bestCycle;
    if (bestPos) { b.bx = bestPos.x; b.by = bestPos.y; }
  }

  // ---------- chalk word drawing ----------
  var FONT_STACK = '"Chalkboard SE","Segoe Print","Bradley Hand","Comic Sans MS",cursive';
  function setFont(px) { ctx.font = '600 ' + px.toFixed(1) + 'px ' + FONT_STACK; }

  function drawWord(inst, x, y, fontPx, color, alpha) {
    setFont(fontPx);
    ctx.textBaseline = 'middle';
    var widths = [], total = 0, i, L;
    for (i = 0; i < inst.letters.length; i++) {
      L = inst.letters[i];
      var wdt = (L.ch === ' ') ? fontPx * 0.42 : ctx.measureText(L.ch).width;
      widths.push(wdt);
      total += wdt + fontPx * 0.07;
    }
    total -= fontPx * 0.07;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(inst.rot);
    var cx = -total / 2;
    var off = Math.max(0.7, fontPx * 0.018);
    for (i = 0; i < inst.letters.length; i++) {
      L = inst.letters[i];
      var lw = widths[i];
      if (L.ch !== ' ') {
        ctx.save();
        ctx.translate(cx + lw / 2, L.dy * fontPx);
        ctx.rotate(L.rot);
        ctx.scale(L.scl, L.scl);
        ctx.textAlign = 'center';
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha * 0.45;
        ctx.fillText(L.ch, off, off * 0.6);
        ctx.globalAlpha = alpha * 0.28;
        ctx.fillText(L.ch, -off, off * 0.4);
        ctx.globalAlpha = alpha * 0.30;
        ctx.fillText(L.ch, off * 0.4, -off * 0.8);
        ctx.globalAlpha = alpha;
        ctx.fillText(L.ch, 0, 0);
        // chalk drip hanging from the letter
        if (L.drip > 0) {
          var dl = L.drip * fontPx;
          ctx.globalAlpha = alpha * 0.55;
          ctx.strokeStyle = color;
          ctx.lineWidth = Math.max(0.6, fontPx * 0.045);
          ctx.beginPath();
          ctx.moveTo(0, fontPx * 0.34);
          ctx.quadraticCurveTo(L.dripBend * fontPx, fontPx * 0.34 + dl * 0.6, L.dripBend * fontPx * 1.6, fontPx * 0.34 + dl);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(L.dripBend * fontPx * 1.6, fontPx * 0.34 + dl + fontPx * 0.03, Math.max(0.7, fontPx * 0.05), 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        }
        ctx.restore();
      }
      cx += lw + fontPx * 0.07;
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // background chalk dust, static seeds, slow drift (closed form)
  var dust = [];
  (function () {
    var rng = mulberry32(4242);
    for (var i = 0; i < 42; i++) dust.push({ x: rng(), y: rng(), r: 0.6 + rng() * 1.3, ph: rng() * Math.PI * 2, sp: 0.5 + rng() });
  })();

  // ---------- main draw: pure function of (events, t) ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    var tl = deriveTimeline();
    var ep = epochAt(tl, t);
    var tE = ep.start;
    var steer = steerAt(t);

    // bursts that belong to this epoch
    var epBursts = [];
    for (var bi = 0; bi < tl.bursts.length; bi++) {
      var bb = tl.bursts[bi];
      if (bb.t >= tE && (tl.epochs.indexOf(ep) === tl.epochs.length - 1 || bb.t < tl.epochs[tl.epochs.indexOf(ep) + 1].start)) {
        resolveBurst(ep, tl, bb);
        epBursts.push(bb);
      }
    }
    var cols = collectionsAt(ep, tl, t);
    var collectedKeys = {};
    for (var ci = 0; ci < cols.length; ci++) collectedKeys[cols[ci].word + ':' + cols[ci].cycle] = cols[ci];
    var burstKeys = {};
    for (bi = 0; bi < epBursts.length; bi++) if (epBursts[bi].word >= 0) burstKeys[epBursts[bi].word + ':' + epBursts[bi].cycle] = epBursts[bi];

    // dust
    ctx.fillStyle = GREY;
    for (var di = 0; di < dust.length; di++) {
      var ds = dust[di];
      var dxx = ((ds.x + 0.004 * t * ds.sp) % 1) * W;
      var dyy = ds.y * H + Math.sin(t * 0.11 * ds.sp + ds.ph) * 6;
      ctx.globalAlpha = 0.13;
      ctx.beginPath();
      ctx.arc(dxx, dyy, ds.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // words, far to near
    var order = ep.field.slice().sort(function (a, b) {
      return depthAt(b, tE, t).d - depthAt(a, tE, t).d;
    });
    for (var oi = 0; oi < order.length; oi++) {
      var inst = order[oi];
      var k = cycleOf(inst, tE, t);
      var key = inst.idx + ':' + k;
      if (burstKeys[key] && burstKeys[key].t <= t) continue;         // burst away this cycle
      if (collectedKeys[key] && collectedKeys[key].tc <= t) continue; // collected this cycle
      var dp = depthAt(inst, tE, t);
      var pos = project(inst.wx, inst.wy, dp.d, steer);
      var fp = fontAt(dp.d, inst.phrase);
      if (pos.x < -fp * 6 || pos.x > W + fp * 6 || pos.y < -fp * 2 || pos.y > H + fp * 2) continue;
      drawWord(inst, pos.x, pos.y, fp, CHALK, alphaAt(dp.d));
    }

    // collect flashes: ember, frozen at the crossing point, brief
    for (ci = 0; ci < cols.length; ci++) {
      var c = cols[ci];
      var age = t - c.tc;
      if (age >= 0 && age < 0.55) {
        var cinst = ep.field[c.word];
        drawWord(cinst, c.x, c.y, fontAt(c.d, cinst.phrase), EMBER, 0.9 * (1 - age / 0.55));
      }
    }

    // burst dust motes
    for (bi = 0; bi < epBursts.length; bi++) {
      var b = epBursts[bi];
      if (b.word < 0) continue;
      var bage = t - b.t;
      if (bage < 0 || bage > 1.4) continue;
      var scale = Math.min(W, H) / 720;
      for (var mi = 0; mi < 26; mi++) {
        var a1 = hash2(b.word * 131 + b.cycle * 17 + 3, mi * 7 + 1) * Math.PI * 2;
        var spd = (14 + hash2(b.word + 9, mi * 13 + 5) * 55) * scale;
        var mx = b.bx + Math.cos(a1) * spd * bage;
        var my = b.by + Math.sin(a1) * spd * bage + 16 * scale * bage * bage;
        ctx.globalAlpha = 0.75 * (1 - bage / 1.4);
        ctx.fillStyle = (mi % 4 === 0) ? CHALK : GREY;
        ctx.beginPath();
        ctx.arc(mx, my, (0.7 + hash2(mi, b.cycle + 2) * 1.5) * scale + 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // litany list along the right edge
    if (cols.length) {
      var show = cols.slice(-11);
      var lf = Math.max(10, Math.min(W, H) * (PHONE ? 0.034 : 0.027));
      setFont(lf);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'alphabetic';
      var ly = lf * 1.7;
      for (var li = 0; li < show.length; li++) {
        var isNew = (li === show.length - 1) && (t - show[li].tc < 6);
        var fromNewest = show.length - 1 - li;
        ctx.fillStyle = isNew ? EMBER : CHALK;
        ctx.globalAlpha = isNew ? 0.95 : Math.max(0.30, 0.85 - fromNewest * 0.09);
        ctx.fillText(show[li].phrase, W - lf * 0.8, ly);
        ctx.globalAlpha = 0.25;
        ctx.fillText(show[li].phrase, W - lf * 0.8 + 1, ly + 0.5);
        ly += lf * 1.55;
      }
      ctx.globalAlpha = 1;
    }
    return cols.length;
  }

  // ---------- audio: lazy pluck on collect ----------
  var audioCtx = null, audioTried = false;
  function ensureAudio() {
    if (audioTried) return;
    audioTried = true;
    try {
      var AC = (typeof AudioContext !== 'undefined') ? AudioContext :
               (typeof window !== 'undefined' && window.webkitAudioContext) ? window.webkitAudioContext : null;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }
  function pluck(n) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
      var freqs = [329.6, 392.0, 440.0, 523.3];
      var f = freqs[Math.abs(n) % freqs.length];
      var tA = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      g.gain.setValueAtTime(0.0001, tA);
      g.gain.exponentialRampToValueAtTime(0.13, tA + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, tA + 0.42);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(tA); osc.stop(tA + 0.45);
    } catch (e) { /* silent */ }
  }

  // ---------- pointer interaction ----------
  var pDown = null;
  function toSteer(px, py) {
    return {
      x: Math.max(-1.6, Math.min(1.6, (px / W - 0.5) * 3.2)),
      y: Math.max(-1.2, Math.min(1.2, (py / H - 0.5) * 2.4))
    };
  }
  function evPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    var p = evPos(e), s = toSteer(p.x, p.y), t = pieceTime();
    pDown = { t: t, x: p.x, y: p.y, moved: false };
    steerSamples.push({ t: t, x: s.x, y: s.y, kind: 'down' });
  });
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', function (e) {
      if (!pDown) return;
      var p = evPos(e);
      if (Math.abs(p.x - pDown.x) + Math.abs(p.y - pDown.y) > 9) pDown.moved = true;
      if (pDown.moved) {
        var s = toSteer(p.x, p.y);
        steerSamples.push({ t: pieceTime(), x: s.x, y: s.y, kind: 'move' });
      }
    });
    window.addEventListener('pointerup', function (e) {
      if (!pDown) return;
      var t = pieceTime();
      var p = evPos(e), s = toSteer(p.x, p.y);
      steerSamples.push({ t: t, x: s.x, y: s.y, kind: 'up' });
      if (!pDown.moved && (t - pDown.t) < 0.4) rawTaps.push({ t: t, x: pDown.x, y: pDown.y });
      pDown = null;
    });
  }

  // ---------- run ----------
  draw(0); // deterministic frame one
  var lastColCount = -1, lastEpochStart = 0;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      var t = pieceTime();
      var n = draw(t);
      var tl = deriveTimeline();
      var ep = epochAt(tl, t);
      if (ep.start !== lastEpochStart) { lastEpochStart = ep.start; lastColCount = -1; }
      if (lastColCount >= 0 && n > lastColCount) pluck(n);
      if (n >= 0) lastColCount = n;
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
