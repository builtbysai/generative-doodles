<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№851 Golden West</title>
<style>
  html, body { margin: 0; padding: 0; background: #7ea6cf; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №851 Golden West, IA5 / PP1251, study #261 iso-attrill.
  // A roadside Americana scene in Kodak color: a "Golden West CAFE"
  // sign left, a red car mid-frame, a white barn right, long shadows,
  // visible film grain, big sky. The scene pans slowly as if seen
  // from a passing car. TAP advances to the next frame of the roll
  // (never reseed); grain shimmers continuously. No people, no audio,
  // no clean digital look, no HDR.
  var GROUND = '#7ea6cf'; // page ground, the frame-0 sky colour

  // Fixed-phase first frame: FIRST_T = 8 s. The pan is a closed-form
  // drift with a 64 s period, zero at t = 8, so frame 0 is mid-pan.
  // Grain shimmer runs on a 2.7 s closed-form cycle. Frames come from
  // a fixed authored table; tap advances the index with a 0.6 s
  // lateral wipe. Double-tap during the wipe is ignored.
  var FIRST_T = 8;
  var PAN_PERIOD = 64;
  var PAN_AMP = 0.035; // stage-width fraction
  var WIPE_DUR = 0.6;
  var SEED = 851;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // ---- Fixed authored frame table: 8 frames of the roll ------------
  // Each frame is a fixed composition variant with its own palette
  // shift. skyTop/skyBot/field/fieldDark are [r,g,b]; warm is the
  // Kodak gold tint alpha; sun is [x,y] in stage fractions; carX is
  // the car centre; door 1 = barn door open; lit 1 = loft window
  // lit; cloudShift shifts the cloud band; panPhase is the pan
  // offset for this frame; tilt is the sign tilt in degrees; shadow
  // scales the long-shadow length.
  var FRAMES = [
    { skyTop: [126, 166, 207], skyBot: [240, 212, 154], field: [195, 154, 69],  fieldDark: [168, 127, 54],  warm: 0.05, sun: [0.16, 0.22], carX: 0.47, door: 0, lit: 0, cloudShift: 0.00,  panPhase: 0.0, tilt: -0.5, shadow: 1.00 },
    { skyTop: [116, 152, 194], skyBot: [242, 207, 142], field: [200, 156, 72],  fieldDark: [172, 130, 56],  warm: 0.09, sun: [0.13, 0.25], carX: 0.50, door: 0, lit: 0, cloudShift: 0.06,  panPhase: 0.8, tilt: 0.5,  shadow: 1.15 },
    { skyTop: [138, 176, 216], skyBot: [238, 217, 168], field: [187, 146, 66],  fieldDark: [160, 120, 52],  warm: 0.03, sun: [0.20, 0.18], carX: 0.44, door: 1, lit: 0, cloudShift: -0.05, panPhase: 1.6, tilt: -1.0, shadow: 0.90 },
    { skyTop: [111, 146, 189], skyBot: [244, 200, 126], field: [207, 159, 69],  fieldDark: [178, 132, 54],  warm: 0.12, sun: [0.11, 0.28], carX: 0.52, door: 0, lit: 1, cloudShift: 0.10,  panPhase: 2.4, tilt: 0.0,  shadow: 1.30 },
    { skyTop: [147, 182, 218], skyBot: [243, 221, 176], field: [198, 160, 82],  fieldDark: [170, 132, 64],  warm: 0.02, sun: [0.24, 0.15], carX: 0.46, door: 1, lit: 1, cloudShift: -0.10, panPhase: 3.2, tilt: 0.5,  shadow: 0.80 },
    { skyTop: [104, 136, 180], skyBot: [246, 194, 115], field: [210, 162, 74],  fieldDark: [182, 136, 58],  warm: 0.15, sun: [0.09, 0.31], carX: 0.49, door: 0, lit: 0, cloudShift: 0.14,  panPhase: 4.0, tilt: -0.5, shadow: 1.45 },
    { skyTop: [125, 159, 198], skyBot: [236, 210, 156], field: [196, 154, 82],  fieldDark: [168, 128, 62],  warm: 0.10, sun: [0.18, 0.20], carX: 0.45, door: 0, lit: 1, cloudShift: 0.02,  panPhase: 4.8, tilt: 1.0,  shadow: 1.10 },
    { skyTop: [95, 131, 176],  skyBot: [240, 193, 132], field: [189, 148, 64],  fieldDark: [162, 122, 50],  warm: 0.13, sun: [0.14, 0.30], carX: 0.51, door: 1, lit: 0, cloudShift: -0.03, panPhase: 5.6, tilt: 0.0,  shadow: 1.35 }
  ];
  var N_FRAMES = FRAMES.length;

  // Palette constants shared by every frame (Kodak golds, sky blue,
  // barn white, asphalt grey, car red).
  var SUN_CORE = [250, 214, 110];
  var SUN_GLOW = [242, 182, 74];
  var CLOUD = [250, 244, 228];
  var MESA = [154, 125, 104];
  var MESA_FAR = [168, 144, 122];
  var ROAD = [111, 106, 102];
  var ROAD_EDGE = [140, 134, 128];
  var ROAD_LINE = [232, 221, 192];
  var VERGE = [138, 111, 48];
  var BARN_WHITE = [242, 237, 226];
  var BARN_SHADE = [207, 200, 184];
  var BARN_ROOF = [107, 90, 74];
  var BARN_DOOR = [138, 74, 50];
  var BARN_DARK = [42, 32, 24];
  var LIT_WIN = [247, 215, 116];
  var CAR_RED = [179, 55, 42];
  var CAR_DARK = [142, 42, 32];
  var CAR_GLASS = [168, 196, 208];
  var CAR_CHROME = [226, 228, 224];
  var SIGN_CREAM = [244, 232, 200];
  var SIGN_RED = [169, 50, 38];
  var SIGN_GREEN = [47, 93, 80];
  var SIGN_POST = [96, 78, 58];
  var FENCE = [110, 88, 60];
  var POLE = [92, 76, 56];
  var SHADOW = [74, 58, 40];
  var WARM_TINT = [214, 164, 80];
  var GRAIN_DARK = [40, 30, 20];
  var GRAIN_LIGHT = [255, 240, 210];

  // Cloud band: fixed authored positions, shifted per frame.
  var CLOUDS = [
    { x: 0.30, y: 0.10, w: 0.20, h: 0.022, a: 0.85 },
    { x: 0.62, y: 0.16, w: 0.16, h: 0.018, a: 0.75 },
    { x: 0.08, y: 0.24, w: 0.13, h: 0.016, a: 0.70 },
    { x: 0.82, y: 0.07, w: 0.14, h: 0.015, a: 0.80 },
    { x: 0.45, y: 0.30, w: 0.11, h: 0.013, a: 0.60 }
  ];

  // Film grain: a fixed table of dots from a fixed seed. Never
  // Math.random(). Alpha shimmers as a closed-form function of time.
  var grainRng = mulberry32(SEED * 13 + 5);
  var GRAIN_N = 550;
  var GRAIN = [];
  var gi;
  for (gi = 0; gi < GRAIN_N; gi++) {
    GRAIN.push({
      x: grainRng(), y: grainRng(),
      s: 1 + grainRng() * 1.6,
      ph: grainRng() * Math.PI * 2,
      light: grainRng() > 0.55
    });
  }

  // Grass tufts in the verge: fixed authored positions.
  var tuftRng = mulberry32(SEED * 29 + 11);
  var TUFTS = [];
  var ti;
  for (ti = 0; ti < 26; ti++) {
    TUFTS.push({ x: tuftRng(), y: 0.935 + tuftRng() * 0.05, h: 0.006 + tuftRng() * 0.010 });
  }

  var L = {};
  function layout() {
    L.fsSign = Math.round(clamp(W * 0.030, 10, 26));
    L.fsCafe = Math.round(clamp(W * 0.048, 16, 42));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Scene fractions (stage space). The scene is drawn oversized by
  // PAN_AMP on each side so the slow pan never exposes the ground.
  var HORIZON = 0.60;
  var FIELD_BOT = 0.80;
  var ROAD_BOT = 0.93;
  function X(f) { return f * W; }
  function Y(f) { return f * H; }

  function panOf(f, t) {
    return PAN_AMP * W * Math.sin(2 * Math.PI * (t - FIRST_T) / PAN_PERIOD + f.panPhase);
  }

  // ---- Sky, sun, clouds, mesa ------------------------------------
  function drawSky(f, t) {
    var over = PAN_AMP * W + 4;
    var g = ctx.createLinearGradient(0, 0, 0, Y(HORIZON));
    g.addColorStop(0, rgb(f.skyTop));
    g.addColorStop(0.72, rgb(f.skyBot));
    g.addColorStop(1, rgb(f.skyBot));
    ctx.fillStyle = g;
    ctx.fillRect(-over, 0, W + over * 2, Y(HORIZON) + 1);

    // Low sun: warm glow, then a soft disc. Sun sits low, left.
    var sx = X(f.sun[0]), sy = Y(f.sun[1]);
    var sr = 0.045 * W;
    var glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 4.2);
    glow.addColorStop(0, rgba(SUN_GLOW, a4(0.55)));
    glow.addColorStop(0.55, rgba(SUN_GLOW, a4(0.18)));
    glow.addColorStop(1, rgba(SUN_GLOW, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(sx - sr * 4.2, sy - sr * 4.2, sr * 8.4, sr * 8.4);
    ctx.fillStyle = rgb(SUN_CORE);
    ctx.beginPath();
    ctx.moveTo(sx + sr, sy);
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
    // A faint haze band hugging the horizon.
    ctx.fillStyle = rgba(CLOUD, a4(0.35));
    ctx.fillRect(-over, Y(HORIZON) - H * 0.03, W + over * 2, H * 0.03);

    // Flat cream cloud bands, drifting slowly with the pan cycle.
    var ci, c, cx, cy;
    for (ci = 0; ci < CLOUDS.length; ci++) {
      c = CLOUDS[ci];
      cx = X(c.x + f.cloudShift + 0.01 * Math.sin(2 * Math.PI * t / PAN_PERIOD + ci * 1.7));
      cy = Y(c.y);
      ctx.fillStyle = rgba(CLOUD, a4(c.a));
      ctx.beginPath();
      ctx.moveTo(cx - c.w * W / 2, cy);
      ctx.ellipse(cx, cy, c.w * W / 2, c.h * H, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Distant flat-top mesas, hazed, sitting on the horizon.
    ctx.fillStyle = rgba(MESA_FAR, a4(0.75));
    ctx.beginPath();
    ctx.moveTo(-over, Y(HORIZON));
    ctx.lineTo(-over, Y(0.565));
    ctx.lineTo(X(0.10), Y(0.565));
    ctx.lineTo(X(0.13), Y(0.545));
    ctx.lineTo(X(0.24), Y(0.545));
    ctx.lineTo(X(0.27), Y(0.565));
    ctx.lineTo(X(0.34), Y(0.565));
    ctx.lineTo(X(0.36), Y(0.575));
    ctx.lineTo(X(0.52), Y(0.575));
    ctx.lineTo(X(0.55), Y(0.555));
    ctx.lineTo(X(0.66), Y(0.555));
    ctx.lineTo(X(0.69), Y(0.575));
    ctx.lineTo(W + over, Y(0.575));
    ctx.lineTo(W + over, Y(HORIZON));
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgba(MESA, a4(0.85));
    ctx.beginPath();
    ctx.moveTo(X(0.30), Y(HORIZON));
    ctx.lineTo(X(0.30), Y(0.575));
    ctx.lineTo(X(0.34), Y(0.575));
    ctx.lineTo(X(0.36), Y(0.560));
    ctx.lineTo(X(0.44), Y(0.560));
    ctx.lineTo(X(0.46), Y(0.575));
    ctx.lineTo(X(0.52), Y(0.575));
    ctx.lineTo(X(0.52), Y(HORIZON));
    ctx.closePath();
    ctx.fill();
  }

  // ---- Field, fence, road, verge ----------------------------------
  function drawGround(f) {
    var over = PAN_AMP * W + 4;
    // Gold field with faint mow stripes.
    ctx.fillStyle = rgb(f.field);
    ctx.fillRect(-over, Y(HORIZON), W + over * 2, Y(FIELD_BOT) - Y(HORIZON));
    var si;
    for (si = 0; si < 5; si++) {
      if (si % 2 === 0) { continue; }
      ctx.fillStyle = rgba(f.fieldDark, a4(0.22));
      ctx.fillRect(-over, Y(HORIZON + si * 0.04), W + over * 2, H * 0.04);
    }
    // A worn track across the field, left to the barn.
    ctx.fillStyle = rgba(f.fieldDark, a4(0.18));
    ctx.beginPath();
    ctx.moveTo(-over, Y(0.76));
    ctx.lineTo(W + over, Y(0.72));
    ctx.lineTo(W + over, Y(0.745));
    ctx.lineTo(-over, Y(0.785));
    ctx.closePath();
    ctx.fill();

    // Fence line across the field, behind the road.
    ctx.strokeStyle = rgba(FENCE, a4(0.75));
    ctx.lineWidth = Math.max(1, W * 0.002);
    var fy = Y(0.70);
    ctx.beginPath();
    ctx.moveTo(-over, fy - H * 0.012);
    ctx.lineTo(W + over, fy - H * 0.012);
    ctx.moveTo(-over, fy + H * 0.004);
    ctx.lineTo(W + over, fy + H * 0.004);
    ctx.stroke();
    var pi;
    for (pi = 0; pi <= 12; pi++) {
      var px = X(0.02 + pi * 0.08);
      ctx.fillStyle = rgba(FENCE, a4(0.8));
      ctx.fillRect(px, fy - H * 0.022, Math.max(1.5, W * 0.003), H * 0.038);
    }

    // Asphalt road with edge lines and a dashed centre line.
    ctx.fillStyle = rgb(ROAD);
    ctx.fillRect(-over, Y(FIELD_BOT), W + over * 2, Y(ROAD_BOT) - Y(FIELD_BOT));
    ctx.fillStyle = rgb(ROAD_EDGE);
    ctx.fillRect(-over, Y(FIELD_BOT), W + over * 2, Math.max(1, H * 0.006));
    ctx.fillRect(-over, Y(ROAD_BOT) - H * 0.006, W + over * 2, Math.max(1, H * 0.006));
    ctx.fillStyle = rgb(ROAD_LINE);
    var di;
    for (di = 0; di < 7; di++) {
      var dx = X(0.03 + di * 0.15);
      ctx.fillRect(dx, Y(0.862), W * 0.06, Math.max(1, H * 0.008));
    }

    // Foreground verge, darker gold, with grass tufts.
    ctx.fillStyle = rgb(VERGE);
    ctx.fillRect(-over, Y(ROAD_BOT), W + over * 2, H - Y(ROAD_BOT));
    ctx.strokeStyle = rgba([90, 70, 28], a4(0.7));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    var tu;
    for (tu = 0; tu < TUFTS.length; tu++) {
      var tx = X(TUFTS[tu].x), ty = Y(TUFTS[tu].y), th = TUFTS[tu].h * H;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx - th * 0.25, ty - th);
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx + th * 0.25, ty - th);
      ctx.stroke();
    }
  }

  // Long shadows stretch right and slightly down from the low sun.
  function shadowPoly(x0, y0, x1, y1, len, lift) {
    ctx.fillStyle = rgba(SHADOW, a4(0.28));
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x1 + len, y1 + lift);
    ctx.lineTo(x0 + len, y0 + lift);
    ctx.closePath();
    ctx.fill();
  }

  // ---- The Golden West CAFE sign (prompt-required artwork text) ---
  // Board proportions derive from its width, so the sign keeps its
  // shape on a tall phone stage as well as on the square desktop.
  function drawSign(f) {
    var bx0 = X(0.07), bx1 = X(0.295);
    var by0 = Y(0.315);
    var bw = bx1 - bx0, bh = bw * 0.88;
    var by1 = by0 + bh;
    var tilt = f.tilt * Math.PI / 180;
    var cx = (bx0 + bx1) / 2, cy = (by0 + by1) / 2;
    var shLen = 0.20 * W * f.shadow;

    // One long shadow of the whole sign, cast right across the field.
    shadowPoly(bx0, Y(0.60), bx1, Y(0.60), shLen, H * 0.028);

    // Posts.
    ctx.fillStyle = rgb(SIGN_POST);
    ctx.fillRect(bx0 + bw * 0.10, by1, Math.max(2, W * 0.008), Y(0.615) - by1);
    ctx.fillRect(bx1 - bw * 0.10 - Math.max(2, W * 0.008), by1, Math.max(2, W * 0.008), Y(0.615) - by1);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt);
    // Board: cream, dark green border, thin inner rule.
    ctx.fillStyle = rgb(SIGN_GREEN);
    ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
    ctx.fillStyle = rgb(SIGN_CREAM);
    ctx.fillRect(-bw / 2 + Math.max(2, W * 0.006), -bh / 2 + Math.max(2, W * 0.006),
      bw - Math.max(4, W * 0.012), bh - Math.max(4, W * 0.012));
    ctx.strokeStyle = rgba(SIGN_GREEN, a4(0.7));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.strokeRect(-bw / 2 + Math.max(3, W * 0.010), -bh / 2 + Math.max(3, W * 0.010),
      bw - Math.max(6, W * 0.020), bh - Math.max(6, W * 0.020));
    // The sign copy: GOLDEN WEST over CAFE, deep red, bold sans.
    // Font sizes are fitted by measure so the words never touch the
    // board edge at any stage size.
    ctx.fillStyle = rgb(SIGN_RED);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var fs1 = L.fsSign, fs2 = L.fsCafe;
    ctx.font = '700 ' + fs1 + 'px Arial, "Liberation Sans", sans-serif';
    var w1 = ctx.measureText('GOLDEN WEST').width;
    if (w1 > bw * 0.86) { fs1 = Math.floor(fs1 * bw * 0.86 / w1); }
    ctx.font = '700 ' + fs1 + 'px Arial, "Liberation Sans", sans-serif';
    ctx.fillText('GOLDEN WEST', 0, -bh * 0.22);
    ctx.font = '700 ' + fs2 + 'px Arial, "Liberation Sans", sans-serif';
    var w2 = ctx.measureText('CAFE').width;
    if (w2 > bw * 0.55) { fs2 = Math.floor(fs2 * bw * 0.55 / w2); }
    ctx.font = '700 ' + fs2 + 'px Arial, "Liberation Sans", sans-serif';
    ctx.fillText('CAFE', 0, bh * 0.22);
    // Two small stars flanking CAFE, painted, not type.
    var starY = bh * 0.22, starR = Math.max(1.5, W * 0.005);
    ctx.fillStyle = rgb(SIGN_GREEN);
    ctx.beginPath();
    ctx.moveTo(-bw * 0.32 + starR, starY);
    ctx.arc(-bw * 0.32, starY, starR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bw * 0.32 + starR, starY);
    ctx.arc(bw * 0.32, starY, starR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.textAlign = 'left';
  }

  // ---- The red car, mid-frame, on the road -------------------------
  // Body proportions derive from body length, so the car keeps its
  // shape on a tall phone stage as well as on the square desktop.
  function drawCar(f) {
    var cx = X(f.carX);
    var baseY = Y(0.885); // wheels touch the asphalt
    var L = 0.24 * W;     // body length
    var bodyH = L * 0.22;
    var cabH = L * 0.16;
    var shLen = 0.30 * W * f.shadow;

    // Long shadow, stretched right, low sun.
    ctx.fillStyle = rgba(SHADOW, a4(0.30));
    ctx.beginPath();
    ctx.moveTo(cx - L * 0.52, baseY);
    ctx.lineTo(cx + L * 0.52, baseY);
    ctx.lineTo(cx + L * 0.52 + shLen, baseY + H * 0.014);
    ctx.lineTo(cx - L * 0.52 + shLen, baseY + H * 0.014);
    ctx.closePath();
    ctx.fill();

    var x0 = cx - L / 2, x1 = cx + L / 2;
    var topY = baseY - bodyH - cabH;
    // Body: a 1950s sedan, facing left. One closed path, red.
    ctx.fillStyle = rgb(CAR_RED);
    ctx.beginPath();
    ctx.moveTo(x0, baseY - bodyH * 0.30);
    ctx.lineTo(x0, baseY - bodyH * 0.62);
    ctx.quadraticCurveTo(x0, baseY - bodyH * 0.85, x0 + L * 0.10, baseY - bodyH * 0.88);
    ctx.lineTo(x0 + L * 0.24, baseY - bodyH * 0.90);
    ctx.quadraticCurveTo(x0 + L * 0.30, topY + cabH * 0.55, x0 + L * 0.36, topY);
    ctx.quadraticCurveTo(x0 + L * 0.50, topY - cabH * 0.12, x0 + L * 0.62, topY);
    ctx.quadraticCurveTo(x0 + L * 0.70, topY + cabH * 0.55, x0 + L * 0.76, baseY - bodyH * 0.90);
    ctx.lineTo(x0 + L * 0.90, baseY - bodyH * 0.88);
    ctx.quadraticCurveTo(x1, baseY - bodyH * 0.85, x1, baseY - bodyH * 0.62);
    ctx.lineTo(x1, baseY - bodyH * 0.30);
    ctx.quadraticCurveTo(x1, baseY - bodyH * 0.10, x0 + L * 0.94, baseY - bodyH * 0.08);
    ctx.lineTo(x0 + L * 0.06, baseY - bodyH * 0.08);
    ctx.quadraticCurveTo(x0, baseY - bodyH * 0.10, x0, baseY - bodyH * 0.30);
    ctx.closePath();
    ctx.fill();
    // Lower body shade.
    ctx.fillStyle = rgba(CAR_DARK, a4(0.55));
    ctx.fillRect(x0 + L * 0.02, baseY - bodyH * 0.22, L * 0.96, bodyH * 0.14);
    // Windows: pale glass with a warm sky reflection.
    ctx.fillStyle = rgb(CAR_GLASS);
    ctx.beginPath();
    ctx.moveTo(x0 + L * 0.335, topY + cabH * 0.22);
    ctx.lineTo(x0 + L * 0.385, topY + cabH * 0.14);
    ctx.lineTo(x0 + L * 0.485, topY + cabH * 0.14);
    ctx.lineTo(x0 + L * 0.485, topY + cabH * 0.72);
    ctx.lineTo(x0 + L * 0.335, topY + cabH * 0.72);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x0 + L * 0.515, topY + cabH * 0.14);
    ctx.lineTo(x0 + L * 0.615, topY + cabH * 0.14);
    ctx.lineTo(x0 + L * 0.665, topY + cabH * 0.22);
    ctx.lineTo(x0 + L * 0.665, topY + cabH * 0.72);
    ctx.lineTo(x0 + L * 0.515, topY + cabH * 0.72);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgba(SUN_CORE, a4(0.35));
    ctx.fillRect(x0 + L * 0.36, topY + cabH * 0.16, L * 0.05, cabH * 0.5);
    // Chrome side trim and bumpers.
    ctx.fillStyle = rgb(CAR_CHROME);
    ctx.fillRect(x0 + L * 0.04, baseY - bodyH * 0.52, L * 0.92, Math.max(1, H * 0.003));
    ctx.fillRect(x0 - L * 0.015, baseY - bodyH * 0.34, L * 0.03, Math.max(2, H * 0.008));
    ctx.fillRect(x1 - L * 0.015, baseY - bodyH * 0.34, L * 0.03, Math.max(2, H * 0.008));
    // Wheels: dark tyres, pale hubcaps.
    var wy = baseY - bodyH * 0.02;
    var wr = Math.max(3, L * 0.068);
    var wx1 = x0 + L * 0.22, wx2 = x0 + L * 0.78;
    ctx.fillStyle = rgb([32, 30, 28]);
    ctx.beginPath();
    ctx.moveTo(wx1 + wr, wy);
    ctx.arc(wx1, wy, wr, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(wx2 + wr, wy);
    ctx.arc(wx2, wy, wr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(CAR_CHROME);
    ctx.beginPath();
    ctx.moveTo(wx1 + wr * 0.45, wy);
    ctx.arc(wx1, wy, wr * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(wx2 + wr * 0.45, wy);
    ctx.arc(wx2, wy, wr * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- The white barn, right ---------------------------------------
  // Barn proportions derive from its width, so it keeps its shape on
  // a tall phone stage as well as on the square desktop.
  function drawBarn(f) {
    var bx0 = X(0.70), bx1 = X(0.93);
    var baseY = Y(0.795);
    var bw = bx1 - bx0;
    var wallH = bw * 0.72;
    var roofH = bw * 0.40;
    var wallTop = baseY - wallH;
    var ridgeY = wallTop - roofH;
    var shLen = 0.16 * W * f.shadow;

    // Long shadow, cast right off the field edge.
    ctx.fillStyle = rgba(SHADOW, a4(0.26));
    ctx.beginPath();
    ctx.moveTo(bx0, baseY);
    ctx.lineTo(bx1, baseY);
    ctx.lineTo(bx1 + shLen, baseY + H * 0.012);
    ctx.lineTo(bx0 + shLen, baseY + H * 0.012);
    ctx.closePath();
    ctx.fill();

    // Walls: white, with faint vertical plank lines and a shaded
    // right face.
    ctx.fillStyle = rgb(BARN_WHITE);
    ctx.fillRect(bx0, wallTop, bw, baseY - wallTop);
    ctx.strokeStyle = rgba(BARN_SHADE, a4(0.5));
    ctx.lineWidth = Math.max(1, W * 0.0012);
    var pi;
    for (pi = 1; pi < 9; pi++) {
      var px = bx0 + bw * pi / 9;
      ctx.beginPath();
      ctx.moveTo(px, wallTop);
      ctx.lineTo(px, baseY);
      ctx.stroke();
    }
    ctx.fillStyle = rgba(BARN_SHADE, a4(0.45));
    ctx.fillRect(bx1 - bw * 0.14, wallTop, bw * 0.14, baseY - wallTop);

    // Gambrel roof: two slopes each side meeting at the ridge,
    // filled solid, dark grey-brown, eaves slightly overhanging.
    ctx.fillStyle = rgb(BARN_ROOF);
    ctx.beginPath();
    ctx.moveTo(bx0 - W * 0.008, wallTop);
    ctx.lineTo(bx0 + bw * 0.16, ridgeY + roofH * 0.55);
    ctx.lineTo(bx0 + bw * 0.32, ridgeY);
    ctx.lineTo(bx1 - bw * 0.32, ridgeY);
    ctx.lineTo(bx1 - bw * 0.16, ridgeY + roofH * 0.55);
    ctx.lineTo(bx1 + W * 0.008, wallTop);
    ctx.closePath();
    ctx.fill();

    // Loft window, high on the gable: warm when lit, dark otherwise.
    var lw = bw * 0.10, lh = wallH * 0.16;
    ctx.fillStyle = f.lit ? rgb(LIT_WIN) : rgb(BARN_DARK);
    ctx.fillRect(bx0 + bw * 0.45, wallTop + wallH * 0.10, lw, lh);
    ctx.strokeStyle = rgba(BARN_SHADE, a4(0.8));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(bx0 + bw * 0.45 + lw / 2, wallTop + wallH * 0.10);
    ctx.lineTo(bx0 + bw * 0.45 + lw / 2, wallTop + wallH * 0.10 + lh);
    ctx.stroke();

    // Door: closed is a red-brown slab with an X brace; open is a
    // dark opening with the door swung to the side.
    var dw = bw * 0.24, dh = wallH * 0.55;
    var dx = bx0 + bw * 0.38, dy = baseY - dh;
    if (f.door === 1) {
      ctx.fillStyle = rgb(BARN_DARK);
      ctx.fillRect(dx, dy, dw, dh);
      ctx.fillStyle = rgb(BARN_DOOR);
      ctx.fillRect(dx + dw + W * 0.004, dy + H * 0.004, dw * 0.42, dh - H * 0.004);
      ctx.fillStyle = rgba([30, 22, 16], a4(0.5));
      ctx.fillRect(dx + dw * 0.12, dy + dh * 0.55, dw * 0.3, dh * 0.4);
    } else {
      ctx.fillStyle = rgb(BARN_DOOR);
      ctx.fillRect(dx, dy, dw, dh);
      ctx.strokeStyle = rgba(BARN_DARK, a4(0.7));
      ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.beginPath();
      ctx.moveTo(dx, dy);
      ctx.lineTo(dx + dw, dy + dh);
      ctx.moveTo(dx + dw, dy);
      ctx.lineTo(dx, dy + dh);
      ctx.stroke();
      ctx.fillStyle = rgb(BARN_DARK);
      ctx.beginPath();
      ctx.moveTo(dx + dw * 0.5 + Math.max(1.5, W * 0.003), dy + dh * 0.45);
      ctx.arc(dx + dw * 0.5, dy + dh * 0.45, Math.max(1.5, W * 0.003), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Telephone pole and wires ------------------------------------
  function drawPole(f) {
    var px = X(0.635);
    var topY = Y(0.30), baseY = Y(0.795);
    ctx.strokeStyle = rgba(POLE, a4(0.85));
    ctx.lineWidth = Math.max(2, W * 0.004);
    ctx.beginPath();
    ctx.moveTo(px, baseY);
    ctx.lineTo(px, topY);
    ctx.stroke();
    ctx.lineWidth = Math.max(1.5, W * 0.003);
    ctx.beginPath();
    ctx.moveTo(px - W * 0.035, topY + H * 0.03);
    ctx.lineTo(px + W * 0.035, topY + H * 0.03);
    ctx.stroke();
    // Wires sag from the crossarm to the sign and to the barn.
    ctx.strokeStyle = rgba(POLE, a4(0.55));
    ctx.lineWidth = Math.max(1, W * 0.0012);
    ctx.beginPath();
    ctx.moveTo(px - W * 0.035, topY + H * 0.03);
    ctx.quadraticCurveTo(X(0.45), Y(0.40), X(0.295), Y(0.33));
    ctx.moveTo(px + W * 0.035, topY + H * 0.03);
    ctx.quadraticCurveTo(X(0.68), Y(0.40), X(0.72), Y(0.55));
    ctx.stroke();
  }

  // ---- One full scene for frame f at time t ------------------------
  function drawScene(f, t) {
    var px = panOf(f, t);
    ctx.save();
    ctx.translate(px, 0);
    drawSky(f, t);
    drawGround(f);
    drawSign(f);
    drawBarn(f);
    drawPole(f);
    drawCar(f);
    ctx.restore();
  }

  // ---- Film grain and warm tint, over the whole stage --------------
  function drawGrain(f, t) {
    // Kodak gold tint for this frame of the roll.
    ctx.fillStyle = rgba(WARM_TINT, a4(f.warm * 0.5));
    ctx.fillRect(0, 0, W, H);
    // Grain: fixed dots, closed-form shimmer, never Math.random().
    var i, g, a;
    for (i = 0; i < GRAIN_N; i++) {
      g = GRAIN[i];
      a = 0.05 + 0.09 * (0.5 + 0.5 * Math.sin(2 * Math.PI * t / 2.7 + g.ph));
      ctx.fillStyle = rgba(g.light ? GRAIN_LIGHT : GRAIN_DARK, a4(a));
      ctx.fillRect(g.x * W, g.y * H, g.s, g.s);
    }
    // Soft vignette, film-like, never HDR.
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42,
      W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, rgba([60, 40, 20], 0));
    vg.addColorStop(1, rgba([60, 40, 20], a4(0.16)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- Frame state: tap advances the roll with a lateral wipe ------
  var idx = 0;
  var nextIdx = 0;
  var wiping = false;
  var wipeStart = 0;

  function onTap() {
    if (wiping) { return; } // double-tap during the wipe is ignored
    nextIdx = (idx + 1) % N_FRAMES;
    wipeStart = lastT;
    wiping = true;
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Ground is the frame-0 sky colour; the scene fills the stage.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    if (wiping) {
      var p = (t - wipeStart) / WIPE_DUR;
      if (p >= 1) {
        idx = nextIdx;
        wiping = false;
        drawScene(FRAMES[idx], t);
      } else {
        var bx = W * (1 - smooth(p));
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, bx, H);
        ctx.clip();
        drawScene(FRAMES[idx], t);
        ctx.restore();
        ctx.save();
        ctx.beginPath();
        ctx.rect(bx, 0, W - bx, H);
        ctx.clip();
        drawScene(FRAMES[nextIdx], t);
        ctx.restore();
        // Bright wipe edge, like the frame line of the roll.
        ctx.fillStyle = rgba([250, 244, 228], a4(0.85));
        ctx.fillRect(bx - Math.max(1, W * 0.002), 0, Math.max(2, W * 0.004), H);
      }
      drawGrain(FRAMES[nextIdx], t);
    } else {
      drawScene(FRAMES[idx], t);
      drawGrain(FRAMES[idx], t);
    }

    // Caption, top left, and the hint, bottom center, in the
    // template's place: dark brown on the pale sky, cream on
    // the dark grass strip at the bottom.
    var fsCap = Math.round(clamp(W * 0.020, 11, 15));
    var fsDate = Math.round(clamp(W * 0.016, 9, 12));
    var fsHint = Math.round(clamp(W * 0.022, 12, 16));
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba([58, 48, 38], a4(0.8));
    ctx.font = '600 ' + fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№851 · Golden West', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba([58, 48, 38], a4(0.6));
    ctx.font = fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 11', W * 0.04, H * 0.055 + fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba([250, 244, 228], a4(0.9));
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Tap to advance the roll.', W / 2, H - fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Tap advances the roll. Pointer only: one handler, no double fire.
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      try { if (e && typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      onTap();
      draw(lastT);
    });
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece851 exposes the roll state and the tap.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece851 = {
      firstT: FIRST_T,
      frames: N_FRAMES,
      index: function () { return idx; },
      wiping: function () { return wiping; },
      tap: function () { onTap(); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: a 64 s pan and a 2.7 s grain shimmer, closed-form.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
