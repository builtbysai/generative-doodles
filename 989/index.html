<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ride the Stage</title>
<style>
  html, body { margin:0; padding:0; background:#07080C; height:100%; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

/* Ride the Stage - No.989 (study 121 motoi-ishibashi, PP150 "border").
   A top-down stage. Six real dancer-dots phrase across it. Four rider
   platforms glide with omniwheel motion (strafe, diagonal, spin in place),
   each carrying a viewport that shows a mixed feed: the real stage near
   the platform plus ghost dancers on different phrases. When a viewport
   overlaps a real dancer, the nearest ghost syncs to it for a moment.
   Backdrop panels slide along hidden rails between phrases.
   Deterministic: seeded RNG, fixed 120 Hz platform sim, closed-form
   dancers and panels. Frame one is the synchronous draw after exactly
   3600 pre-roll steps (30 s of stage time). */

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- seeded RNG ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- palette ---------- */
var COL = {
  stage:   '#07080C',
  dancer:  '#F5F2EA',
  plat:    '#1A1D24',
  platEdge:'#4FD6FF',
  view:    '#0E1118',
  ghost:   '#4FD6FF',
  panel:   '#14161C',
  panelEdge:'#3A3D46',
  sync:    '#FFD88A'
};

/* ---------- sizing (Visual Viewport API) ---------- */
var W = 0, H = 0, DPR = 1, S = 0, OX = 0, OY = 0, PHONE = false, PF = 1;
function resize(){
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = w; H = h;
  canvas.width = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  if (window.screen) {
    PHONE = Math.min(window.screen.width, window.screen.height) < 700;
  } else {
    PHONE = h > w * 1.15;
  }
  PF = PHONE ? 1.22 : 1;
  S = Math.min(w, h);
  OX = (w - S) / 2;
  OY = (h - S) / 2;
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', function(){ resize(); draw(); });
}
window.addEventListener('resize', function(){ resize(); draw(); });
resize();

function X(u){ return OX + u * S; }
function Y(u){ return OY + u * S; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function smooth(a){ return a * a * (3 - 2 * a); }

/* ---------- world state ---------- */
var BASE_SEED = 989150;
var dancers = [], platforms = [], panels = [], panelMoves = [], flashes = [];
var simT = 0, simRnd = null;
var boarded = -1, boardedUntil = -1;
var nextNoteAt = 4, noteIdx = 0;

function dancerPos(d, t){
  var x = d.cx + d.ax1 * Math.sin(d.wx1 * t + d.px1) + d.ax2 * Math.sin(d.wx2 * t + d.px2);
  var y = d.cy + d.ay1 * Math.sin(d.wy1 * t + d.py1) + d.ay2 * Math.sin(d.wy2 * t + d.py2);
  return { x: clamp(x, 0.05, 0.95), y: clamp(y, 0.05, 0.95) };
}
function ghostPos(g, t){
  var x = 0.5 + g.ax * Math.sin(g.wx * t + g.px) + g.ax2 * Math.sin(g.wx2 * t + g.px2);
  var y = 0.5 + g.ay * Math.sin(g.wy * t + g.py) + g.ay2 * Math.sin(g.wy2 * t + g.py2);
  return { x: clamp(x, 0.06, 0.94), y: clamp(y, 0.06, 0.94) };
}

function buildWorld(seed){
  var rnd = mulberry32(seed);
  simRnd = mulberry32(seed ^ 0x9E37);
  simT = 0;
  flashes = [];
  boarded = -1; boardedUntil = -1;
  nextNoteAt = 34; noteIdx = 0;

  var scaleNotes = [0, 3, 5, 7, 10, 12];
  dancers = [];
  for (var i = 0; i < 6; i++){
    dancers.push({
      cx: 0.24 + rnd() * 0.52, cy: 0.24 + rnd() * 0.52,
      ax1: 0.08 + rnd() * 0.10, ax2: 0.03 + rnd() * 0.05,
      ay1: 0.08 + rnd() * 0.10, ay2: 0.03 + rnd() * 0.05,
      wx1: 0.25 + rnd() * 0.35, wx2: 0.60 + rnd() * 0.70,
      wy1: 0.25 + rnd() * 0.35, wy2: 0.60 + rnd() * 0.70,
      px1: rnd() * 6.2832, px2: rnd() * 6.2832,
      py1: rnd() * 6.2832, py2: rnd() * 6.2832,
      note: 196 * Math.pow(2, scaleNotes[i] / 12)
    });
  }

  platforms = [];
  for (var j = 0; j < 4; j++){
    var ghosts = [];
    for (var k = 0; k < 3; k++){
      ghosts.push({
        ax: 0.16 + rnd() * 0.20, ax2: 0.05 + rnd() * 0.09,
        ay: 0.16 + rnd() * 0.20, ay2: 0.05 + rnd() * 0.09,
        wx: 0.45 + rnd() * 0.60, wx2: 0.90 + rnd() * 0.90,
        wy: 0.45 + rnd() * 0.60, wy2: 0.90 + rnd() * 0.90,
        px: rnd() * 6.2832, px2: rnd() * 6.2832,
        py: rnd() * 6.2832, py2: rnd() * 6.2832
      });
    }
    platforms.push({
      x: 0.20 + rnd() * 0.60, y: 0.20 + rnd() * 0.60,
      vx: 0, vy: 0,
      ang: rnd() * 6.2832, av: 0,
      tx: 0.15 + rnd() * 0.70, ty: 0.15 + rnd() * 0.70,
      state: 'glide', stateT: 0,
      nextSpin: 8 + rnd() * 14, spinDir: 1, spinDur: 2,
      lastSync: -99, syncUntil: -1, syncDancer: -1,
      ghosts: ghosts
    });
  }
  /* guarantee one platform is mid-spin at frame one (t = 30) */
  platforms[0].nextSpin = 29.2;
  platforms[0].spinDur = 2.4;
  platforms[0].spinDir = 1;

  panels = [
    { rail: 'top',    slot: 0.08, w: 0.24 },
    { rail: 'top',    slot: 0.58, w: 0.24 },
    { rail: 'bottom', slot: 0.34, w: 0.26 }
  ];
  panelMoves = [];
  var cur = [panels[0].slot, panels[1].slot, panels[2].slot];
  for (var m = 0; m < 40; m++){
    var idx = m % 3;
    var to = 0.04 + rnd() * 0.66;
    panelMoves.push({ t: 27 + m * 20, dur: 4, idx: idx, from: cur[idx], to: to });
    cur[idx] = to;
  }
}
function panelSlot(pi, t){
  var p = panels[pi], slot = p.slot;
  for (var i = 0; i < panelMoves.length; i++){
    var mv = panelMoves[i];
    if (mv.idx !== pi) continue;
    if (t < mv.t) break;
    if (t < mv.t + mv.dur) return mv.from + (mv.to - mv.from) * smooth((t - mv.t) / mv.dur);
    slot = mv.to;
  }
  return slot;
}

/* ---------- fixed-step sim (platforms, 120 Hz) ---------- */
var DT = 1 / 120;
function newTarget(p){
  p.tx = 0.12 + simRnd() * 0.76;
  p.ty = 0.12 + simRnd() * 0.76;
}
function step(silent){
  var prevT = simT;
  simT += DT;
  var i, j, p;
  for (i = 0; i < platforms.length; i++){
    p = platforms[i];
    if (p.state === 'glide'){
      var dx = p.tx - p.x, dy = p.ty - p.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var dvx = 0, dvy = 0;
      if (dist > 0.001){
        var sp = Math.min(0.055, dist * 1.5);
        dvx = dx / dist * sp; dvy = dy / dist * sp;
      }
      var blend = Math.min(1, DT * 2.2);
      p.vx += (dvx - p.vx) * blend;
      p.vy += (dvy - p.vy) * blend;
      p.x = clamp(p.x + p.vx * DT, 0.06, 0.94);
      p.y = clamp(p.y + p.vy * DT, 0.06, 0.94);
      p.ang += p.av * DT;
      p.av += (0 - p.av) * DT * 1.5;
      if (dist < 0.03) newTarget(p);
      if (simT >= p.nextSpin){
        p.state = 'spin'; p.stateT = 0;
        if (!(i === 0 && simT < 31)) { p.spinDur = 1.6 + simRnd() * 1.4; p.spinDir = simRnd() < 0.5 ? -1 : 1; }
      }
    } else { /* spin in place: position holds, body rotates */
      p.stateT += DT;
      var damp = Math.min(1, DT * 3);
      p.vx += (0 - p.vx) * damp;
      p.vy += (0 - p.vy) * damp;
      p.x = clamp(p.x + p.vx * DT, 0.06, 0.94);
      p.y = clamp(p.y + p.vy * DT, 0.06, 0.94);
      var env = Math.sin(Math.min(1, p.stateT / p.spinDur) * Math.PI);
      p.ang += p.spinDir * 2.4 * env * DT;
      if (p.stateT >= p.spinDur){
        p.state = 'glide';
        p.nextSpin = simT + 9 + simRnd() * 9;
        newTarget(p);
      }
    }
    /* ghost sync: viewport overlaps a real dancer */
    if (simT - p.lastSync > 6){
      for (j = 0; j < dancers.length; j++){
        var dp = dancerPos(dancers[j], simT);
        var sx = dp.x - p.x, sy = dp.y - p.y;
        if (sx * sx + sy * sy < 0.105 * 0.105){
          p.lastSync = simT;
          p.syncUntil = simT + 1.5;
          p.syncDancer = j;
          flashes.push({ t: simT, x: dp.x, y: dp.y });
          if (!silent) audioChime();
          break;
        }
      }
    }
  }
  while (flashes.length && simT - flashes[0].t > 1.2) flashes.shift();
  if (boarded >= 0 && simT > boardedUntil) boarded = -1;
  /* panel slide rumble + melodic line triggers (live steps only) */
  if (!silent && AC){
    for (i = 0; i < panelMoves.length; i++){
      if (prevT < panelMoves[i].t && simT >= panelMoves[i].t) audioRumble();
    }
    if (simT >= nextNoteAt){
      audioNote(dancers[noteIdx % dancers.length].note);
      noteIdx++;
      nextNoteAt = simT + 2.4;
    }
  }
}

/* ---------- drawing ---------- */
function rr(x, y, w, h, r){
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function dot(x, y, r){
  ctx.beginPath();
  ctx.arc(x, y, r, 0, 6.2832);
  ctx.fill();
}
/* mixed feed: real dancers near platform (white) + ghosts (cyan).
   Window half-extent `win` in stage units, drawn into rect (rx,ry,rw,rh) device px. */
function drawFeed(p, rx, ry, rw, rh, win, dotR){
  ctx.save();
  ctx.beginPath();
  ctx.rect(rx, ry, rw, rh);
  ctx.clip();
  ctx.fillStyle = COL.view;
  ctx.fillRect(rx, ry, rw, rh);
  var i, g;
  for (i = 0; i < dancers.length; i++){
    var dp = dancerPos(dancers[i], simT);
    var mx = (dp.x - p.x) / (2 * win) + 0.5;
    var my = (dp.y - p.y) / (2 * win) + 0.5;
    if (mx < 0 || mx > 1 || my < 0 || my > 1) continue;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = COL.dancer;
    dot(rx + mx * rw, ry + my * rh, dotR);
  }
  for (i = 0; i < p.ghosts.length; i++){
    g = p.ghosts[i];
    var gp;
    if (i === 0 && p.syncUntil > simT && p.syncDancer >= 0){
      var sd = dancerPos(dancers[p.syncDancer], simT);
      gp = { x: (sd.x - p.x) / (2 * win) + 0.5, y: (sd.y - p.y) / (2 * win) + 0.5 };
      if (gp.x < 0.04 || gp.x > 0.96 || gp.y < 0.04 || gp.y > 0.96) gp = ghostPos(g, simT);
    } else {
      gp = ghostPos(g, simT);
    }
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = COL.ghost;
    dot(rx + gp.x * rw, ry + gp.y * rh, dotR);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function draw(){
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COL.stage;
  ctx.fillRect(0, 0, W, H);
  var i, j;

  /* backdrop panels on their rails */
  for (i = 0; i < panels.length; i++){
    var p = panels[i];
    var slot = panelSlot(i, simT);
    var py = p.rail === 'top' ? 0.012 : 0.936;
    ctx.fillStyle = COL.panel;
    ctx.strokeStyle = COL.panelEdge;
    ctx.lineWidth = 1;
    rr(X(slot), Y(py), p.w * S, 0.052 * S, 3);
    ctx.fill(); ctx.stroke();
  }

  /* dancer trails (same closed-form phrase, sampled back in time) */
  for (i = 0; i < dancers.length; i++){
    var d = dancers[i];
    for (j = 14; j >= 1; j--){
      var tp = dancerPos(d, simT - j * 0.14);
      ctx.globalAlpha = 0.15 * (1 - j / 15);
      ctx.fillStyle = COL.dancer;
      dot(X(tp.x), Y(tp.y), (0.0042 * S) * PF * (1 - j / 22));
    }
    ctx.globalAlpha = 1;
  }
  /* sync flashes */
  for (i = 0; i < flashes.length; i++){
    var f = flashes[i];
    var age = (simT - f.t) / 0.9;
    if (age < 0 || age > 1) continue;
    ctx.globalAlpha = 0.75 * (1 - age);
    ctx.strokeStyle = COL.sync;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(X(f.x), Y(f.y), (0.012 + age * 0.045) * S, 0, 6.2832);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* dancers */
  for (i = 0; i < dancers.length; i++){
    var pos = dancerPos(dancers[i], simT);
    ctx.fillStyle = COL.dancer;
    dot(X(pos.x), Y(pos.y), 0.0075 * S * PF);
  }

  /* platforms with their viewports */
  var bw = 0.078 * S * PF, bh = 0.054 * S * PF;
  var vw = 0.058 * S * PF, vh = 0.036 * S * PF;
  for (i = 0; i < platforms.length; i++){
    var pl = platforms[i];
    ctx.save();
    ctx.translate(X(pl.x), Y(pl.y));
    ctx.rotate(pl.ang);
    ctx.fillStyle = COL.plat;
    ctx.strokeStyle = COL.platEdge;
    ctx.lineWidth = boarded === i ? 2 : 1.2;
    rr(-bw / 2, -bh / 2, bw, bh, 5);
    ctx.fill(); ctx.stroke();
    /* omniwheel ticks at the corners */
    ctx.fillStyle = COL.platEdge;
    ctx.globalAlpha = 0.8;
    var cw = 0.010 * S * PF, chh = 0.005 * S * PF;
    ctx.fillRect(-bw / 2 + 3, -bh / 2 + 3, cw, chh);
    ctx.fillRect(bw / 2 - 3 - cw, -bh / 2 + 3, cw, chh);
    ctx.fillRect(-bw / 2 + 3, bh / 2 - 3 - chh, cw, chh);
    ctx.fillRect(bw / 2 - 3 - cw, bh / 2 - 3 - chh, cw, chh);
    ctx.globalAlpha = 1;
    drawFeed(pl, -vw / 2, -vh / 2, vw, vh, 0.16, Math.max(1.1, 0.0032 * S * PF));
    ctx.strokeStyle = COL.platEdge;
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 0.8;
    ctx.strokeRect(-vw / 2, -vh / 2, vw, vh);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* boarded: the ridden viewport takes over a corner, larger */
  if (boarded >= 0 && simT < boardedUntil){
    var bp = platforms[boarded];
    var iw = 0.42 * S, ih = 0.32 * S;
    var ix = OX + 0.03 * S, iy = OY + S - 0.03 * S - ih;
    drawFeed(bp, ix, iy, iw, ih, 0.24, Math.max(1.8, 0.006 * S * PF));
    ctx.strokeStyle = COL.platEdge;
    ctx.lineWidth = 1.6;
    ctx.strokeRect(ix, iy, iw, ih);
    ctx.fillStyle = COL.plat;
    ctx.strokeStyle = COL.platEdge;
    ctx.lineWidth = 1;
    var mw = 0.030 * S * PF, mh = 0.021 * S * PF;
    rr(ix + iw / 2 - mw / 2, iy + ih / 2 - mh / 2, mw, mh, 3);
    ctx.fill(); ctx.stroke();
  }
}

/* ---------- audio (lazy, gesture-gated, guarded) ---------- */
var AC = null, humOsc = null, humGain = null, masterGain = null;
function ensureAudio(){
  if (AC){ if (AC.resume) { try { AC.resume(); } catch (e) {} } return; }
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  try {
    AC = new Ctor();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(AC.destination);
    /* stage bed: low air (looped brown-ish noise through a lowpass) */
    var len = AC.sampleRate * 2;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var data = buf.getChannelData(0);
    var last = 0;
    for (var i = 0; i < len; i++){
      var wht = Math.random() * 2 - 1;
      last = (last + 0.02 * wht) / 1.02;
      data[i] = last * 3;
    }
    var src = AC.createBufferSource();
    src.buffer = buf; src.loop = true;
    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 300;
    var ng = AC.createGain(); ng.gain.value = 0.05;
    src.connect(lp); lp.connect(ng); ng.connect(masterGain);
    src.start();
    /* wheel hum: pitch follows mean platform speed */
    humOsc = AC.createOscillator();
    humOsc.type = 'triangle'; humOsc.frequency.value = 55;
    humGain = AC.createGain(); humGain.gain.value = 0;
    humOsc.connect(humGain); humGain.connect(masterGain);
    humOsc.start();
  } catch (e) { AC = null; }
}
function tone(freq, dur, gain, type, when){
  if (!AC) return;
  try {
    var t0 = AC.currentTime + (when || 0);
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function audioChime(){ tone(880, 0.5, 0.07, 'sine'); tone(1318, 0.7, 0.05, 'sine', 0.07); }
function audioNote(freq){ tone(freq, 0.9, 0.06, 'sine'); tone(freq * 2, 0.4, 0.02, 'sine'); }
function audioRumble(){ tone(46, 1.4, 0.12, 'sine'); tone(58, 1.1, 0.06, 'triangle'); }
function updateHum(){
  if (!AC || !humOsc) return;
  try {
    var sp = 0;
    for (var i = 0; i < platforms.length; i++) sp += Math.sqrt(platforms[i].vx * platforms[i].vx + platforms[i].vy * platforms[i].vy);
    sp /= platforms.length;
    humOsc.frequency.value = 48 + sp * 900;
    humGain.gain.value = 0.015 + Math.min(0.05, sp * 0.8);
  } catch (e) {}
}

/* ---------- interaction ---------- */
var downInfo = null, driveIdx = -1, lastTapMs = -9999, seedOffset = 0;
function stageCoords(ev){
  var r = canvas.getBoundingClientRect();
  var px = (ev.clientX - r.left), py = (ev.clientY - r.top);
  return { u: (px - OX) / S, v: (py - OY) / S, px: px, py: py };
}
function nowMs(){
  return (window.performance && window.performance.now) ? window.performance.now() : 0;
}
canvas.addEventListener('pointerdown', function(ev){
  ensureAudio();
  var sc = stageCoords(ev);
  downInfo = { u: sc.u, v: sc.v, px: sc.px, py: sc.py, dragging: false };
  driveIdx = -1;
  if (ev.preventDefault) ev.preventDefault();
});
canvas.addEventListener('pointermove', function(ev){
  if (!downInfo) return;
  var sc = stageCoords(ev);
  var moved = Math.abs(sc.px - downInfo.px) + Math.abs(sc.py - downInfo.py);
  if (!downInfo.dragging && moved > 7) downInfo.dragging = true;
  if (downInfo.dragging){
    if (driveIdx < 0){
      var best = -1, bd = 1e9;
      for (var i = 0; i < platforms.length; i++){
        var dx = platforms[i].x - sc.u, dy = platforms[i].y - sc.v;
        var dd = dx * dx + dy * dy;
        if (dd < bd){ bd = dd; best = i; }
      }
      driveIdx = best;
      boarded = best;
      boardedUntil = simT + 15;
    }
    var p = platforms[driveIdx];
    p.state = 'glide';
    p.tx = clamp(sc.u, 0.08, 0.92);
    p.ty = clamp(sc.v, 0.08, 0.92);
    boardedUntil = simT + 15;
  }
});
function endPointer(ev){
  if (!downInfo) return;
  var wasDrag = downInfo.dragging;
  var sc = stageCoords(ev);
  downInfo = null;
  driveIdx = -1;
  if (wasDrag) return;
  /* tap */
  var t = nowMs();
  if (t - lastTapMs < 350){
    /* double-tap: a new ride */
    lastTapMs = -9999;
    seedOffset++;
    buildWorld(BASE_SEED + seedOffset * 7919);
    for (var i = 0; i < 3600; i++) step(true);
    draw();
    return;
  }
  lastTapMs = t;
  for (var i = 0; i < platforms.length; i++){
    var dx = platforms[i].x - sc.u, dy = platforms[i].y - sc.v;
    if (dx * dx + dy * dy < 0.07 * 0.07){
      boarded = i;
      boardedUntil = simT + 15;
      return;
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ downInfo = null; driveIdx = -1; });

/* ---------- boot: build, pre-roll exactly 3600 steps, draw frame one ---------- */
buildWorld(BASE_SEED);
for (var s = 0; s < 3600; s++) step(true);
draw();

/* ---------- live loop (guarded: QA renderer has no rAF) ---------- */
if (typeof window.requestAnimationFrame === 'function'){
  var lastMs = 0, acc = 0;
  var frame = function(ms){
    if (!lastMs) lastMs = ms;
    var el = (ms - lastMs) / 1000;
    lastMs = ms;
    if (el > 0.25) el = 0.25;
    acc += el;
    var n = 0;
    while (acc >= DT && n < 24){ step(false); acc -= DT; n++; }
    if (n >= 24) acc = 0;
    updateHum();
    draw();
    window.requestAnimationFrame(frame);
  };
  window.requestAnimationFrame(frame);
}

})();
</script>
