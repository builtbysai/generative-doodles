<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.130 · The Proxy</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A0A0A; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,226,212,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag a pole to bend the field</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function nowMs(){ return (typeof Date!=='undefined'&&Date.now)?Date.now():0; }

// No.130 The Proxy: an invisible dipole field on near-black, never drawn.
// Thousands of tiny dash filings align, chain and clump to reveal it:
// nested arcs near the poles, chains, voids and strays elsewhere.
// After Kepes: the field is known only by proxy, through its filings.
const GROUND='#0A0A0A', INK='#E8E2D4';
const rng=mulberry32(301);
let W=0,H=0, frameNo=0;
let poles=[{x:0,y:0,q:1},{x:0,y:0,q:-1}];
let poleInit=false;
let filings=[];
let dragPole=-1, dragOffX=0, dragOffY=0;
let lastTapMs=-9999, tapX=0, tapY=0;
let releaseMs=-99999, scatterMs=-99999;

const COUNT=5200;
function fieldAt(x,y){
  let fx=0, fy=0;
  for(let i=0;i<2;i++){
    const p=poles[i];
    let dx=x-p.x, dy=y-p.y;
    let d2=dx*dx+dy*dy;
    if(d2<144) d2=144; // soften the core so filings arc around, not into, the bar
    const d=Math.sqrt(d2);
    const s=p.q/(d2*d); // q * r / |r|^3
    fx+=dx*s; fy+=dy*s;
  }
  return Math.atan2(fy,fx);
}
function wrapPiPi(a){ // wrap an angle difference for undirected dashes into [-PI/2, PI/2]
  while(a>Math.PI/2) a-=Math.PI;
  while(a<-Math.PI/2) a+=Math.PI;
  return a;
}
function scatterFilings(){
  filings=[];
  for(let i=0;i<COUNT;i++){
    filings.push({
      x: rng()*W, y: rng()*H,
      a: rng()*Math.PI,
      len: 3.6+rng()*1.4,
      alpha: 0.15+rng()*0.78,
      dir: rng()<0.5?-1:1,
      speed: 0.14+rng()*0.30
    });
  }
}
function chainPass(){
  // spatial hash, cell 12px: nudge a random subset toward the mean
  // (double-angle) direction of neighbours within ~12px
  const cell=12, hash={};
  for(let i=0;i<filings.length;i++){
    const f=filings[i];
    const k=((f.x/cell)|0)+','+((f.y/cell)|0);
    if(!hash[k]) hash[k]=[];
    hash[k].push(i);
  }
  const tries=1400;
  for(let t=0;t<tries;t++){
    const idx=(rng()*filings.length)|0;
    const f=filings[idx];
    const cx=(f.x/cell)|0, cy=(f.y/cell)|0;
    let sc=0, ss=0, n=0;
    for(let gx=cx-1;gx<=cx+1;gx++) for(let gy=cy-1;gy<=cy+1;gy++){
      const lst=hash[gx+','+gy]; if(!lst) continue;
      for(let j=0;j<lst.length;j++){
        const o=filings[lst[j]]; if(o===f) continue;
        const dx=o.x-f.x, dy=o.y-f.y;
        if(dx*dx+dy*dy>144) continue;
        sc+=Math.cos(2*o.a); ss+=Math.sin(2*o.a); n++;
      }
    }
    if(n>=2){
      const mean=0.5*Math.atan2(ss,sc);
      f.a+=wrapPiPi(mean-f.a)*0.45;
    }
  }
}
function settleBoost(){
  // extra turbulence right after a drag release or a re-scatter,
  // decaying over about 10 seconds so the cloud visibly re-settles
  const t=nowMs();
  let b=0;
  const dr=t-releaseMs; if(dr>=0&&dr<10000) b=Math.max(b,1-dr/10000);
  const ds=t-scatterMs; if(ds>=0&&ds<10000) b=Math.max(b,1-ds/10000);
  if(dragPole>=0) b=Math.max(b,0.7);
  return b;
}
function stepSim(boost){
  const turb=0.05+boost*0.22;
  const relax=0.16-boost*0.07;
  for(let i=0;i<filings.length;i++){
    const f=filings[i];
    const fa=fieldAt(f.x,f.y);
    f.a+=wrapPiPi(fa-f.a)*relax+(rng()-0.5)*turb;
    // drift slowly along the field direction so the texture lives
    const sp=f.speed*(1+boost*1.6);
    f.x+=Math.cos(f.a)*sp*f.dir+(rng()-0.5)*0.14;
    f.y+=Math.sin(f.a)*sp*f.dir+(rng()-0.5)*0.14;
    if(f.x<-6) f.x+=W+12; if(f.x>W+6) f.x-=W+12;
    if(f.y<-6) f.y+=H+12; if(f.y>H+6) f.y-=H+12;
  }
  frameNo++;
  if(frameNo%4===0) chainPass();
}
function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}
function drawFrame(){
  const wh=viewportWH(); const w=wh[0], h=wh[1];
  if(!poleInit||w!==W||h!==H){
    const ow=W||w, oh=H||h;
    if(poleInit){ poles[0].x*=w/ow; poles[0].y*=h/oh; poles[1].x*=w/ow; poles[1].y*=h/oh; }
    else { poles[0].x=w*0.365; poles[0].y=h*0.44; poles[1].x=w*0.635; poles[1].y=h*0.57; poleInit=true; }
    W=w; H=h;
    if(!filings.length) scatterFilings();
  }
  prep(w,h);
  stepSim(settleBoost());
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h);
  // filings, bucketed by alpha so the frame stays cheap
  ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.lineCap='round';
  const buckets=[[],[],[],[],[]];
  for(let i=0;i<filings.length;i++){
    const f=filings[i];
    const b=clamp((f.alpha*5)|0,0,4);
    buckets[b].push(f);
  }
  const alphas=[0.22,0.38,0.54,0.72,0.92];
  for(let b=0;b<5;b++){
    const lst=buckets[b]; if(!lst.length) continue;
    ctx.globalAlpha=alphas[b];
    ctx.beginPath();
    for(let i=0;i<lst.length;i++){
      const f=lst[i], c=Math.cos(f.a)*f.len*0.5, s=Math.sin(f.a)*f.len*0.5;
      ctx.moveTo(f.x-c,f.y-s); ctx.lineTo(f.x+c,f.y+s);
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  // pole bars: small dark rounded rects with a thin light edge
  for(let i=0;i<2;i++){
    const p=poles[i], bw=46, bh=15;
    roundRectPath(p.x-bw/2,p.y-bh/2,bw,bh,7);
    ctx.fillStyle='#171410'; ctx.fill();
    ctx.strokeStyle='rgba(232,226,212,0.75)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba(232,226,212,0.55)';
    ctx.beginPath(); ctx.arc(p.x,p.y,1.6,0,6.283); ctx.fill();
  }
  return {};
}
function frame(){ return drawFrame(); }

function ptr(e){ return [e.clientX,e.clientY]; }
canvas.addEventListener('pointerdown',e=>{
  const p=ptr(e), x=p[0], y=p[1], t=nowMs();
  if(t-lastTapMs<340&&Math.abs(x-tapX)<30&&Math.abs(y-tapY)<30){
    // double-tap: re-scatter the filings (specced reseed exception)
    scatterFilings(); scatterMs=t; lastTapMs=-9999; dragPole=-1; return;
  }
  lastTapMs=t; tapX=x; tapY=y;
  for(let i=0;i<2;i++){
    const dx=x-poles[i].x, dy=y-poles[i].y;
    if(dx*dx+dy*dy<34*34){ dragPole=i; dragOffX=poles[i].x-x; dragOffY=poles[i].y-y; return; }
  }
});
canvas.addEventListener('pointermove',e=>{
  if(dragPole<0) return;
  const p=ptr(e);
  poles[dragPole].x=clamp(p[0]+dragOffX,24,W-24);
  poles[dragPole].y=clamp(p[1]+dragOffY,24,H-24);
});
function endDrag(){ if(dragPole>=0){ dragPole=-1; releaseMs=nowMs(); } }
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

// init and pre-warm: settle about 120 frames before the first frame so
// the opening view shows formed arcs, not a random scatter
(function init(){
  const wh=viewportWH(); W=wh[0]; H=wh[1];
  poles[0].x=W*0.365; poles[0].y=H*0.44;
  poles[1].x=W*0.635; poles[1].y=H*0.57;
  poleInit=true;
  scatterFilings();
  for(let i=0;i<120;i++) stepSim(0.3);
})();
frame();
function loop(){ frame(); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame());
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame());
</script>
</body>
</html>
