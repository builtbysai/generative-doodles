<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Where Images Are Born</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5F0E6; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette ----------
  var PAPER = '#F5F0E6';
  var WALNUT = '#3B2A1E';
  var GOLD = '#D9A441';
  var CREAM = '#EFE3C8';
  var RED = '#A63A2E';

  // ---------- seeded rng ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300;

  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && typeof window.innerWidth === 'number') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = W; h = H; }
    return { w: Math.max(50, Math.floor(w)), h: Math.max(50, Math.floor(h)) };
  }

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999; sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var s = viewSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    layout();
  }

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }

  // ---------- blot model ----------
  // A blot is a seeded radial wash. Its contour is a harmonic radius
  // function r(theta); every creature reading is anchored to a point ON
  // that contour, so the line literally grows out of the stain's edge.
  var K = 72; // contour samples

  function makeBlot(cfg) {
    var rng = mulberry32(cfg.seed);
    var harm = [];
    for (var i = 0; i < 5; i++) {
      harm.push({ n: 2 + i, amp: 0.05 + rng() * 0.09, ph: rng() * Math.PI * 2 });
    }
    var flecks = [];
    var nf = cfg.flecks || 0;
    for (var j = 0; j < nf; j++) {
      flecks.push({ a: rng() * Math.PI * 2, fr: 0.25 + rng() * 0.5, s: 0.05 + rng() * 0.08, rot: rng() * Math.PI });
    }
    return {
      seed: cfg.seed,
      nx: cfg.nx, ny: cfg.ny, baseR: cfg.r,       // normalized layout
      color: cfg.color, depth: cfg.depth,          // depth ~ wash strength
      harm: harm, flecks: flecks,
      hooded: !!cfg.hooded,
      baseType: cfg.type,                          // frame-one reading
      baseAnchor: cfg.anchor,
      readingIndex: 0,
      bornAt: -10,                                  // elapsed time of birth (seeded blots: long born)
      phase: rng() * Math.PI * 2,
      cx: 0, cy: 0, R: 0                            // pixel layout, set in layout()
    };
  }

  function blotRadiusAt(b, theta) {
    var m = 1;
    for (var i = 0; i < b.harm.length; i++) {
      m += b.harm[i].amp * Math.sin(b.harm[i].n * theta + b.harm[i].ph);
    }
    return b.R * m;
  }

  function contourPoint(b, theta) {
    var r = blotRadiusAt(b, theta);
    return { x: b.cx + Math.cos(theta) * r, y: b.cy + Math.sin(theta) * r, r: r };
  }

  // frame-one composition: hand-placed, asymmetric, seeded jitter
  var layoutRng = mulberry32(609001);
  function jit(v) { return v + (layoutRng() - 0.5) * 0.03; }

  var blots = [
    makeBlot({ seed: 609101, nx: jit(0.30), ny: jit(0.62), r: 0.135, color: WALNUT, depth: 1.0,  flecks: 3, hooded: true,  type: 'hood',     anchor: -0.85 }),
    makeBlot({ seed: 609102, nx: jit(0.68), ny: jit(0.30), r: 0.115, color: WALNUT, depth: 0.8,  flecks: 2, hooded: false, type: 'fox',      anchor: -1.35 }),
    makeBlot({ seed: 609103, nx: jit(0.83), ny: jit(0.67), r: 0.100, color: GOLD,   depth: 0.75, flecks: 3, hooded: false, type: 'bird',     anchor: -1.9 }),
    makeBlot({ seed: 609104, nx: jit(0.16), ny: jit(0.21), r: 0.105, color: WALNUT, depth: 0.7,  flecks: 0, hooded: false, type: 'dancer',   anchor: -1.1 }),
    makeBlot({ seed: 609105, nx: jit(0.52), ny: jit(0.83), r: 0.120, color: WALNUT, depth: 0.85, flecks: 2, hooded: false, type: 'longneck', anchor: -1.45 }),
    makeBlot({ seed: 609106, nx: jit(0.56), ny: jit(0.11), r: 0.090, color: GOLD,   depth: 0.7,  flecks: 2, hooded: false, type: 'fish',     anchor: 0.15 })
  ];

  var TYPES = ['fox', 'bird', 'dancer', 'longneck', 'fish', 'horned'];
  var eventCount = 0; // deterministic interaction seed stream

  function layout() {
    var m = Math.min(W, H);
    for (var i = 0; i < blots.length; i++) {
      var b = blots[i];
      b.cx = b.nx * W; b.cy = b.ny * H; b.R = b.baseR * m;
    }
  }

  // ---------- readings ----------
  // A reading is fully derived from (blot seed, readingIndex): creature
  // type, anchor angle on the contour, flip, scale. Same blot, new
  // reading on tap. The hooded blot always reads as the hooded figure,
  // so the single red hood exists exactly once all session.
  function readingFor(b) {
    var rng = mulberry32(b.seed * 7 + b.readingIndex * 131 + 17);
    var type, anchor, flip, scale;
    if (b.readingIndex === 0) {
      type = b.hooded ? 'hood' : b.baseType;
      anchor = b.baseAnchor; flip = 1; scale = 1;
    } else {
      // later readings stay on the blot's upper arc, so a profile read
      // from the edge never hangs upside down
      anchor = -Math.PI / 2 + Math.sin(b.readingIndex * 1.7 + (b.seed % 7)) * 1.02 + (rng() - 0.5) * 0.2;
      flip = rng() > 0.5 ? 1 : -1;
      scale = 0.85 + rng() * 0.3;
      if (b.hooded) { type = 'hood'; scale = 0.95 + rng() * 0.2; }
      else {
        var idx = TYPES.indexOf(b.baseType);
        type = TYPES[(idx + b.readingIndex) % TYPES.length];
      }
    }
    return { type: type, anchor: anchor, flip: flip, scale: scale };
  }

  // Catmull-Rom sampling: turns hand-set control points into a smooth,
  // washy contour (Serra's readings are curves, not wire). Tips stay
  // pointed where control points crowd.
  function smooth(pts, per) {
    if (pts.length < 3) return pts;
    var out = [];
    var P = [pts[0]].concat(pts, [pts[pts.length - 1]]);
    for (var i = 1; i < P.length - 2; i++) {
      for (var j = 0; j < per; j++) {
        var t = j / per, t2 = t * t, t3 = t2 * t;
        var x = 0.5 * ((2 * P[i][0]) + (-P[i - 1][0] + P[i + 1][0]) * t +
          (2 * P[i - 1][0] - 5 * P[i][0] + 4 * P[i + 1][0] - P[i + 2][0]) * t2 +
          (-P[i - 1][0] + 3 * P[i][0] - 3 * P[i + 1][0] + P[i + 2][0]) * t3);
        var y = 0.5 * ((2 * P[i][1]) + (-P[i - 1][1] + P[i + 1][1]) * t +
          (2 * P[i - 1][1] - 5 * P[i][1] + 4 * P[i + 1][1] - P[i + 2][1]) * t2 +
          (-P[i - 1][1] + 3 * P[i][1] - 3 * P[i + 1][1] + P[i + 2][1]) * t3);
        out.push([x, y]);
      }
    }
    out.push(pts[pts.length - 1].slice());
    return out;
  }
  function circlePts(cx, cy, r, n) {
    var out = [];
    for (var i = 0; i <= n; i++) {
      var a = i / n * Math.PI * 2;
      out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    return out;
  }

  // Creature contour paths. Two frames, both anchored ON the blot's
  // actual contour:
  //  - tangent frame (fox, bird, dancer, longneck, horned, hood): the
  //    reading is an open profile whose two feet stand on the contour;
  //    local +x runs along the edge, local -y points outward, and the
  //    stain itself closes the shape underneath.
  //  - radial frame (fish): local +x points outward, the fish swims
  //    straight out of the stain.
  function creaturePaths(type) {
    switch (type) {
      case 'fox': return { tangent: true, lines: [smooth([
        [-0.36, 0.03], [-0.31, -0.18], [-0.25, -0.24], [-0.19, -0.50], [-0.11, -0.25],
        [-0.03, -0.27], [0.04, -0.52], [0.11, -0.26], [0.22, -0.20], [0.40, -0.10],
        [0.24, 0.0], [0.13, 0.05], [0.07, 0.14], [0.01, 0.06],
        [0.10, 0.09], [0.24, 0.05], [0.34, 0.03]
      ], 4)], dots: [[0.08, -0.15]] };
      case 'bird': return { tangent: true, lines: [smooth([
        [-0.32, 0.03], [-0.28, -0.20], [-0.12, -0.31], [0.06, -0.27], [0.16, -0.19],
        [0.48, -0.11], [0.17, -0.05], [0.07, 0.05], [0.15, 0.09], [0.28, 0.03]
      ], 4), smooth([
        [-0.10, -0.28], [-0.22, -0.42], [-0.28, -0.34]
      ], 4)], dots: [[0.03, -0.17]] };
      case 'dancer': return { tangent: true, lines: [
        smooth([[0, 0.03], [0.02, -0.20], [0.05, -0.36], [0.16, -0.54]], 5),
        smooth([[0.14, -0.48], [0.32, -0.60], [0.48, -0.55]], 5),
        smooth([[0.05, -0.36], [-0.20, -0.45], [-0.38, -0.40]], 5),
        circlePts(0.21, -0.65, 0.07, 14)
      ], dots: [] };
      case 'longneck': return { tangent: true, lines: [smooth([
        [-0.22, 0.03], [-0.14, -0.32], [-0.06, -0.64], [0.0, -0.90], [0.05, -1.02],
        [0.15, -1.09], [0.38, -1.01], [0.19, -0.90], [0.12, -0.68], [0.14, -0.36],
        [0.20, 0.03]
      ], 5), smooth([
        [0.07, -1.03], [0.02, -1.20], [0.13, -1.08]
      ], 4)], dots: [[0.17, -0.99]] };
      case 'fish': return { tangent: false, lines: [smooth([
        [0, 0], [0.20, -0.16], [0.46, -0.22], [0.70, -0.12], [0.93, -0.31],
        [0.85, 0], [0.93, 0.31], [0.68, 0.14], [0.42, 0.22], [0.16, 0.14], [0, 0.05]
      ], 5), smooth([
        [0.24, -0.13], [0.32, 0], [0.24, 0.13]
      ], 4)], dots: [[0.15, -0.03]] };
      case 'horned': return { tangent: true, lines: [smooth([
        [-0.32, 0.03], [-0.28, -0.24], [-0.06, -0.37], [0.20, -0.33], [0.33, -0.13],
        [0.27, 0.05], [0.33, 0.03]
      ], 5), smooth([
        [-0.17, -0.32], [-0.28, -0.56], [-0.14, -0.68], [-0.06, -0.50]
      ], 5), smooth([
        [0.13, -0.34], [0.19, -0.60], [0.33, -0.66], [0.30, -0.44]
      ], 5)], dots: [[0.02, -0.15]] };
      case 'hood': return { tangent: true, lines: [smooth([
        [-0.27, 0], [-0.25, -0.30], [-0.17, -0.55], [-0.14, -0.72], [0, -0.84],
        [0.14, -0.72], [0.17, -0.55], [0.25, -0.30], [0.27, 0]
      ], 5), [[-0.27, 0], [0.27, 0]]
      ], dots: [], hood: smooth([
        [-0.14, -0.72], [0, -0.84], [0.14, -0.72], [0.11, -0.50], [0, -0.56],
        [-0.11, -0.50]
      ], 5), face: [0, -0.615, 0.082] };
    }
    return { lines: [], dots: [] };
  }

  function pathLength(pts) {
    var L = 0;
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      L += Math.sqrt(dx * dx + dy * dy);
    }
    return L;
  }

  // draw a polyline up to fraction `prog` of its length
  function strokePartial(pts, prog) {
    if (prog <= 0) return;
    var total = pathLength(pts), target = total * prog;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    var acc = 0;
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      var seg = Math.sqrt(dx * dx + dy * dy);
      if (acc + seg <= target) {
        ctx.lineTo(pts[i][0], pts[i][1]); acc += seg;
      } else {
        var f = seg > 0 ? (target - acc) / seg : 0;
        ctx.lineTo(pts[i - 1][0] + dx * f, pts[i - 1][1] + dy * f);
        acc = target; break;
      }
    }
    ctx.stroke();
  }

  // ---------- drawing ----------
  function drawBlotWash(b, t, grow) {
    var deepen = 1 + 0.10 * Math.sin(t * 0.45 + b.phase);
    var boost = b.color === WALNUT ? 1.25 : 1.0; // walnut reads as ink, gold stays light
    var layers = [
      { fr: 1.00, off: 0.00, a: 0.16 * boost },
      { fr: 0.80, off: 0.03, a: 0.20 * boost },
      { fr: 0.55, off: -0.02, a: 0.24 * boost },
      { fr: 0.32, off: 0.01, a: 0.22 * boost }
    ];
    ctx.fillStyle = b.color;
    for (var li = 0; li < layers.length; li++) {
      var L = layers[li];
      ctx.globalAlpha = Math.min(0.85, L.a * b.depth * deepen);
      ctx.beginPath();
      for (var i = 0; i <= K; i++) {
        var th = (i % K) / K * Math.PI * 2;
        var rr = blotRadiusAt(b, th) * L.fr * grow;
        var px = b.cx + Math.cos(th + L.off) * rr;
        var py = b.cy + Math.sin(th + L.off) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }
    // wax-resist flecks: pale cream cuts inside the wash
    if (b.flecks.length) {
      ctx.fillStyle = CREAM;
      for (var j = 0; j < b.flecks.length; j++) {
        var f = b.flecks[j];
        var fx = b.cx + Math.cos(f.a) * b.R * f.fr * grow;
        var fy = b.cy + Math.sin(f.a) * b.R * f.fr * grow;
        var fs = b.R * f.s * grow;
        ctx.globalAlpha = 0.55 * deepen;
        ctx.beginPath();
        for (var q = 0; q < 5; q++) {
          var qa = f.rot + q / 5 * Math.PI * 2;
          var qx = fx + Math.cos(qa) * fs * (q % 2 ? 0.6 : 1);
          var qy = fy + Math.sin(qa) * fs * (q % 2 ? 0.6 : 1);
          if (q === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);
        }
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawReading(b, t, prog) {
    var rd = readingFor(b);
    var paths = creaturePaths(rd.type);
    var P = contourPoint(b, rd.anchor);
    // tangent readings stand on the contour (local -y = outward, flip
    // mirrors along the edge); radial readings swim straight out
    // (local +x = outward, flip mirrors across the radius)
    var rot = paths.tangent ? rd.anchor + Math.PI / 2 : rd.anchor;
    var s = b.R * (rd.type === 'hood' ? 0.98 : 1.08) * rd.scale;
    var cos = Math.cos(rot), sin = Math.sin(rot);
    // breathing shimmer: 1-2 px drift perpendicular to the contour
    var shim = Math.sin(t * 0.8 + b.phase * 2.1) * 1.4;
    var ox = -Math.sin(rd.anchor) * shim, oy = Math.cos(rd.anchor) * shim;
    var fx = paths.tangent ? rd.flip : 1;
    var fy = paths.tangent ? 1 : rd.flip;
    function xf(lx, ly) {
      var x = lx * s * fx, y = ly * s * fy;
      return [P.x + ox + x * cos - y * sin, P.y + oy + x * sin + y * cos];
    }
    ctx.strokeStyle = WALNUT;
    ctx.lineWidth = Math.max(1.1, b.R * 0.022);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalAlpha = 0.92;
    var li, pts;
    for (li = 0; li < paths.lines.length; li++) {
      pts = paths.lines[li].map(function (p) { return xf(p[0], p[1]); });
      strokePartial(pts, prog);
    }
    if (prog > 0.85) {
      ctx.fillStyle = WALNUT;
      for (li = 0; li < paths.dots.length; li++) {
        var d = xf(paths.dots[li][0], paths.dots[li][1]);
        ctx.beginPath(); ctx.arc(d[0], d[1], Math.max(1.2, b.R * 0.028), 0, Math.PI * 2); ctx.fill();
      }
    }
    if (paths.hood && prog > 0.4) {
      ctx.globalAlpha = Math.min(1, (prog - 0.4) / 0.4);
      ctx.fillStyle = RED;
      ctx.beginPath();
      paths.hood.forEach(function (p, i) {
        var w = xf(p[0], p[1]);
        if (i === 0) ctx.moveTo(w[0], w[1]); else ctx.lineTo(w[0], w[1]);
      });
      ctx.closePath(); ctx.fill();
      // face: a small paper opening inside the hood
      var fc = xf(paths.face[0], paths.face[1]);
      ctx.fillStyle = PAPER;
      ctx.beginPath(); ctx.arc(fc[0], fc[1], paths.face[2] * s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < blots.length; i++) {
      var b = blots[i];
      var age = t - b.bornAt;
      var grow = 1, prog = 1;
      if (age < 1.0) { // stepped bloom for dragged stains
        var st = Math.floor(age / 0.25);
        grow = [0.35, 0.6, 0.85, 1][Math.min(3, Math.max(0, st))];
        prog = 0;
      } else if (age < 1.9) { // then the reading is drawn out
        prog = Math.floor(((age - 1.0) / 0.9) * 6) / 6;
      }
      if (b.readStart !== undefined && b.readStart !== null && age >= 1.9) {
        var rp = (t - b.readStart) / 0.8;
        prog = rp >= 1 ? 1 : Math.floor(rp * 6) / 6;
      }
      drawBlotWash(b, t, grow);
      if (prog > 0) drawReading(b, t, prog);
    }
  }

  // ---------- interaction ----------
  function blotAt(x, y) {
    for (var i = blots.length - 1; i >= 0; i--) {
      var b = blots[i];
      var dx = x - b.cx, dy = y - b.cy;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < b.R * 1.15) return b;
      // creature zone: near the current reading's anchor, outward
      var rd = readingFor(b);
      var P = contourPoint(b, rd.anchor);
      var cx2 = P.x + Math.cos(rd.anchor) * b.R * 0.5;
      var cy2 = P.y + Math.sin(rd.anchor) * b.R * 0.5;
      var dx2 = x - cx2, dy2 = y - cy2;
      if (Math.sqrt(dx2 * dx2 + dy2 * dy2) < b.R * 0.75) return b;
    }
    return null;
  }

  var drag = null;
  function evtPos(e) {
    if (e.clientX !== undefined) return { x: e.clientX, y: e.clientY };
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: 0, y: 0 };
  }

  function onDown(e) {
    var p = evtPos(e);
    drag = { sx: p.x, sy: p.y, lx: p.x, ly: p.y, path: [p], startBlot: blotAt(p.x, p.y), moved: 0 };
  }

  function onMove(e) {
    if (!drag) return;
    var p = evtPos(e);
    var dx = p.x - drag.lx, dy = p.y - drag.ly;
    drag.moved += Math.sqrt(dx * dx + dy * dy);
    drag.lx = p.x; drag.ly = p.y;
    drag.path.push(p);
    if (drag.path.length > 60) drag.path.shift();
  }

  function onUp(e) {
    if (!drag) return;
    var d = drag; drag = null;
    var p = evtPos(e);
    var now = elapsed();
    if (d.moved < 8) { // tap
      var b = d.startBlot || blotAt(p.x, p.y);
      if (b) { b.readingIndex += 1; b.readStart = now; }
      return;
    }
    // drag: lay a new stain from empty paper only
    if (d.startBlot) return;
    if (blots.length >= 9) return;
    var cx = 0, cy = 0, i;
    for (i = 0; i < d.path.length; i++) { cx += d.path[i].x; cy += d.path[i].y; }
    cx /= d.path.length; cy /= d.path.length;
    var spread = 0;
    for (i = 0; i < d.path.length; i++) {
      var ddx = d.path[i].x - cx, ddy = d.path[i].y - cy;
      spread = Math.max(spread, Math.sqrt(ddx * ddx + ddy * ddy));
    }
    eventCount += 1;
    var rng = mulberry32(609900 + eventCount * 977);
    var m = Math.min(W, H);
    var nb = makeBlot({
      seed: 610000 + eventCount * 977,
      nx: cx / W, ny: cy / H,
      r: Math.max(0.055, Math.min(0.14, (spread * 0.9 + 26) / m)),
      color: eventCount % 3 === 2 ? GOLD : WALNUT,
      depth: 0.65 + rng() * 0.3,
      flecks: Math.floor(rng() * 3),
      hooded: false,
      type: TYPES[(eventCount - 1) % TYPES.length],
      anchor: rng() * Math.PI * 2
    });
    nb.bornAt = now;
    blots.push(nb);
    layout();
  }

  if (canvas.addEventListener) {
    if (typeof window !== 'undefined' && window.PointerEvent) {
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', function () { drag = null; });
    } else {
      canvas.addEventListener('mousedown', onDown);
      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('mouseup', onUp);
      canvas.addEventListener('touchstart', onDown);
      canvas.addEventListener('touchmove', onMove);
      canvas.addEventListener('touchend', onUp);
    }
  }

  // ---------- time: frame one is synchronous at fixed phase 0 ----------
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      return Math.max(0, (performance.now() - T0) / 1000);
    }
    return 0;
  }

  resize();
  draw(0); // frame one: all six blots, readings complete, phase 0

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(elapsed());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
