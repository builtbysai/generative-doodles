<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Someone</title>
<style>
html,body{margin:0;padding:0;background:#F4EFE6;overflow:hidden;width:100%;height:100%}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// For Someone — raven-chacon RC2 (PP584), doodle №1361.
// A one-page graphic score as portrait: a face-like constellation of lines,
// dots, shapes and numerology on paper, ringed by 13 small glyph-studies.
// Touch voices a glyph; drag rotates the score. Never click-to-reload.
// No readable English anywhere on screen: the instruction line is invented
// pseudo-script, never letterforms. All tones only inside a touch gesture.

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var PAPER = '#F4EFE6', INK = '#111111', OCHRE = '#9E3B26', TURQ = '#3E7C8C';
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var W = 0, H = 0;

function sizeCanvas() {
  var vw = null, vh = null;
  try {
    if (typeof window !== 'undefined' && window.visualViewport) {
      vw = window.visualViewport.width; vh = window.visualViewport.height;
    }
  } catch (e) {}
  if (!vw) {
    try { vw = window.innerWidth; vh = window.innerHeight; } catch (e2) {}
  }
  if (!vw) { vw = 720; vh = 720; }
  W = vw; H = vh;
  cv.width = W; cv.height = H;
}
sizeCanvas();
try {
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { sizeCanvas(); draw(curT); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { sizeCanvas(); draw(curT); });
    }
  }
} catch (e) {}

function isPhone() {
  try {
    if (typeof window !== 'undefined' && window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) { return true; }
    }
  } catch (e) {}
  try { return H > W * 1.15; } catch (e2) { return false; }
}

// Seeded grain flecks (fractions of the field, drawn every frame).
var grain = (function () {
  var r = mulberry32(1361000), out = [], i;
  for (i = 0; i < 140; i++) {
    out.push({ fx: r(), fy: r(), rr: 0.6 + r() * 1.1, a: 0.04 + r() * 0.06 });
  }
  return out;
})();

// Ring glyph-studies: 13 designs. Size per glyph from a seeded stream so the
// tone mapping (pitch by index, length by size) is reproducible.
var RING = (function () {
  var out = [], i;
  for (i = 0; i < 13; i++) {
    var r = mulberry32(1361000 + i * 7919);
    out.push({ type: i, sizeN: r(), col: (i % 3 === 0) ? OCHRE : (i % 3 === 1) ? TURQ : INK });
  }
  return out;
})();

// Portrait constellation glyphs: fixed design, coords in face-radius units.
// Dot clusters carry numerology (counts 1, 2, 3, 5, 7) as dot groups, not digits.
var FACE = [
  { k: 'arc', x: 0, y: -0.52, s: 0.72, c: INK },          // brow arc
  { k: 'dots', x: -0.38, y: -0.20, s: 0.10, c: INK, n: 3 }, // left eye cluster
  { k: 'dots', x: 0.38, y: -0.20, s: 0.10, c: INK, n: 5 },  // right eye cluster
  { k: 'line', x: 0.02, y: -0.08, s: 0.30, c: INK, a: 0.35 }, // nose line
  { k: 'arc', x: 0, y: 0.28, s: 0.42, c: INK },           // mouth curve
  { k: 'tri', x: -0.64, y: 0.14, s: 0.13, c: OCHRE },     // left cheek mark
  { k: 'arc', x: 0.64, y: 0.14, s: 0.13, c: TURQ },       // right cheek mark
  { k: 'dots', x: 0, y: 0.58, s: 0.09, c: INK, n: 2 },    // chin dots
  { k: 'dots', x: -0.30, y: -0.72, s: 0.08, c: TURQ, n: 7 }, // forehead dots
  { k: 'dots', x: 0.34, y: -0.70, s: 0.08, c: OCHRE, n: 1 }  // forehead single
];

// Poetic instruction line: invented pseudo-script marks, seeded order.
var LINE = (function () {
  var r = mulberry32(1361999), kinds = ['arc', 'chev', 'dots', 'bardot', 'tri', 'wave'], out = [], i;
  for (i = 0; i < 14; i++) {
    out.push({ k: kinds[Math.floor(r() * kinds.length)], c: (i % 5 === 0) ? OCHRE : (i % 5 === 2) ? TURQ : INK });
  }
  return out;
})();

// Interaction state: closed-form functions of piece time and recorded events.
var dragRot = 0;            // cumulative rotation from drags (radians)
var downX = 0, downY = 0, downT = 0, moved = 0, isDown = false;
var voices = [];            // {x, y, t0} flash events, in field coords (recomputed per draw from stored glyph ref)
var voiceEvents = [];       // {glyph: 'ring'|'face', idx, t0}
var audioCtx = null;

function ensureAudio() {
  if (audioCtx) { return audioCtx; }
  try {
    var AC = (typeof AudioContext !== 'undefined') ? AudioContext :
      (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
    if (!AC) { return null; }
    audioCtx = new AC();
  } catch (e) { audioCtx = null; }
  return audioCtx;
}

// Glyph -> tone mapping (documented in process.md):
// ring glyph i: freq = 261.63 * 2^((i-6)/12), duration = 0.6 + sizeN * 1.2 s,
// waveform sine for even i, triangle for odd i. Face glyphs: same index rule
// at half frequency, 1.0 s, sine.
function voice(glyph, idx, sizeN) {
  voiceEvents.push({ glyph: glyph, idx: idx, t0: curT });
  if (voiceEvents.length > 24) { voiceEvents.shift(); }
  var ac = ensureAudio();
  if (!ac) { return; }
  try {
    var f, dur, wave;
    if (glyph === 'ring') {
      f = 261.63 * Math.pow(2, (idx - 6) / 12);
      dur = 0.6 + sizeN * 1.2;
      wave = (idx % 2 === 0) ? 'sine' : 'triangle';
    } else {
      f = 261.63 * Math.pow(2, (idx - 6) / 12) / 2;
      dur = 1.0;
      wave = 'sine';
    }
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = wave; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur + 0.1);
  } catch (e) {}
}

function layout() {
  var u = Math.min(W, H);
  var cx = W / 2, cy = H / 2;
  return { u: u, cx: cx, cy: cy, fr: u * 0.26, rr: u * 0.44 };
}

function rotAt(t) { return t * Math.PI * 2 / 300 + dragRot; }

function ringPos(i, L, t) {
  var a = -Math.PI / 2 + i * Math.PI * 2 / 13 + rotAt(t);
  return { x: L.cx + Math.cos(a) * L.rr, y: L.cy + Math.sin(a) * L.rr, s: (0.030 + RING[i].sizeN * 0.025) * L.u };
}

function facePos(g, L, t) {
  var rot = rotAt(t), cs = Math.cos(rot), sn = Math.sin(rot);
  var x = g.x * L.fr, y = g.y * L.fr;
  return { x: L.cx + x * cs - y * sn, y: L.cy + x * sn + y * cs, s: g.s * L.fr };
}

function dot(x, y, r, col) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();
}

function line(x1, y1, x2, y2, col, w) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.stroke();
}

// One glyph mark, drawn with a fresh subpath per element (node-canvas quirk:
// batched ellipse/arc subpaths render as connected polygons).
function drawMark(type, x, y, s, col) {
  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  ctx.lineWidth = Math.max(1, s * 0.14);
  var i, a;
  if (type === 0) { // three-dot triangle
    dot(x, y - s * 0.6, s * 0.22, col);
    dot(x - s * 0.6, y + s * 0.5, s * 0.22, col);
    dot(x + s * 0.6, y + s * 0.5, s * 0.22, col);
  } else if (type === 1) { // two parallel lines
    line(x - s * 0.7, y - s * 0.25, x + s * 0.7, y - s * 0.25, col, Math.max(1, s * 0.14));
    line(x - s * 0.7, y + s * 0.25, x + s * 0.7, y + s * 0.25, col, Math.max(1, s * 0.14));
  } else if (type === 2) { // triangle outline
    ctx.beginPath();
    ctx.moveTo(x, y - s * 0.7);
    ctx.lineTo(x + s * 0.7, y + s * 0.55);
    ctx.lineTo(x - s * 0.7, y + s * 0.55);
    ctx.closePath();
    ctx.stroke();
  } else if (type === 3) { // arc
    ctx.beginPath();
    ctx.arc(x, y, s * 0.7, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
  } else if (type === 4) { // cross bars
    line(x - s * 0.7, y, x + s * 0.7, y, col, Math.max(1, s * 0.14));
    line(x, y - s * 0.7, x, y + s * 0.7, col, Math.max(1, s * 0.14));
  } else if (type === 5) { // chevron
    ctx.beginPath();
    ctx.moveTo(x - s * 0.7, y - s * 0.5);
    ctx.lineTo(x, y + s * 0.5);
    ctx.lineTo(x + s * 0.7, y - s * 0.5);
    ctx.stroke();
  } else if (type === 6) { // circle with center dot
    ctx.beginPath();
    ctx.arc(x, y, s * 0.7, 0, Math.PI * 2);
    ctx.stroke();
    dot(x, y, s * 0.2, col);
  } else if (type === 7) { // zigzag
    ctx.beginPath();
    ctx.moveTo(x - s * 0.8, y + s * 0.4);
    ctx.lineTo(x - s * 0.4, y - s * 0.4);
    ctx.lineTo(x, y + s * 0.4);
    ctx.lineTo(x + s * 0.4, y - s * 0.4);
    ctx.lineTo(x + s * 0.8, y + s * 0.4);
    ctx.stroke();
  } else if (type === 8) { // bar with dot above
    line(x - s * 0.7, y + s * 0.3, x + s * 0.7, y + s * 0.3, col, Math.max(1, s * 0.14));
    dot(x, y - s * 0.5, s * 0.2, col);
  } else if (type === 9) { // diamond outline
    ctx.beginPath();
    ctx.moveTo(x, y - s * 0.7);
    ctx.lineTo(x + s * 0.7, y);
    ctx.lineTo(x, y + s * 0.7);
    ctx.lineTo(x - s * 0.7, y);
    ctx.closePath();
    ctx.stroke();
  } else if (type === 10) { // crescent
    ctx.beginPath();
    ctx.arc(x, y, s * 0.7, Math.PI * 0.35, Math.PI * 1.65);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + s * 0.25, y, s * 0.45, Math.PI * 0.5, Math.PI * 1.5);
    ctx.stroke();
  } else if (type === 11) { // square spiral
    ctx.beginPath();
    ctx.moveTo(x - s * 0.7, y + s * 0.7);
    ctx.lineTo(x - s * 0.7, y - s * 0.7);
    ctx.lineTo(x + s * 0.7, y - s * 0.7);
    ctx.lineTo(x + s * 0.7, y + s * 0.3);
    ctx.lineTo(x - s * 0.1, y + s * 0.3);
    ctx.stroke();
  } else { // dot ring
    for (i = 0; i < 5; i++) {
      a = i * Math.PI * 2 / 5 - Math.PI / 2;
      dot(x + Math.cos(a) * s * 0.6, y + Math.sin(a) * s * 0.6, s * 0.18, col);
    }
  }
}

function drawFaceGlyph(g, p) {
  var s = p.s, col = g.c;
  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  ctx.lineWidth = Math.max(1, s * 0.10);
  var i, a;
  if (g.k === 'arc') {
    ctx.beginPath();
    ctx.arc(p.x, p.y, s, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
  } else if (g.k === 'line') {
    var dx = Math.cos(g.a) * s, dy = Math.sin(g.a) * s;
    line(p.x - dx, p.y - dy, p.x + dx, p.y + dy, col, Math.max(1, s * 0.12));
  } else if (g.k === 'tri') {
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - s);
    ctx.lineTo(p.x + s, p.y + s * 0.7);
    ctx.lineTo(p.x - s, p.y + s * 0.7);
    ctx.closePath();
    ctx.stroke();
  } else if (g.k === 'dots') {
    for (i = 0; i < g.n; i++) {
      a = i * Math.PI * 2 / Math.max(1, g.n) - Math.PI / 2;
      var rr = (g.n === 1) ? 0 : s * 0.7;
      dot(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr, Math.max(1, s * 0.28), col);
    }
  }
}

function drawLineMark(m, x, y, s) {
  var col = m.c;
  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  ctx.lineWidth = Math.max(1, s * 0.14);
  if (m.k === 'arc') {
    ctx.beginPath();
    ctx.arc(x, y, s * 0.6, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
  } else if (m.k === 'chev') {
    ctx.beginPath();
    ctx.moveTo(x - s * 0.6, y - s * 0.4);
    ctx.lineTo(x, y + s * 0.4);
    ctx.lineTo(x + s * 0.6, y - s * 0.4);
    ctx.stroke();
  } else if (m.k === 'dots') {
    dot(x - s * 0.4, y, s * 0.18, col);
    dot(x + s * 0.4, y, s * 0.18, col);
  } else if (m.k === 'bardot') {
    line(x - s * 0.6, y, x + s * 0.6, y, col, Math.max(1, s * 0.14));
    dot(x, y - s * 0.55, s * 0.18, col);
  } else if (m.k === 'tri') {
    ctx.beginPath();
    ctx.moveTo(x, y - s * 0.6);
    ctx.lineTo(x + s * 0.6, y + s * 0.5);
    ctx.lineTo(x - s * 0.6, y + s * 0.5);
    ctx.closePath();
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(x - s * 0.7, y + s * 0.3);
    ctx.lineTo(x - s * 0.35, y - s * 0.3);
    ctx.lineTo(x, y + s * 0.3);
    ctx.lineTo(x + s * 0.35, y - s * 0.3);
    ctx.lineTo(x + s * 0.7, y + s * 0.3);
    ctx.stroke();
  }
}

function draw(t) {
  var L = layout();
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  // Grain flecks.
  var i, g;
  for (i = 0; i < grain.length; i++) {
    g = grain[i];
    ctx.globalAlpha = g.a;
    dot(g.fx * W, g.fy * H, g.rr, INK);
  }
  ctx.globalAlpha = 1;
  // Portrait constellation (rotates with the score).
  for (i = 0; i < FACE.length; i++) {
    drawFaceGlyph(FACE[i], facePos(FACE[i], L, t));
  }
  // Ring of 13 glyph-studies.
  for (i = 0; i < 13; i++) {
    var p = ringPos(i, L, t);
    drawMark(RING[i].type, p.x, p.y, p.s, RING[i].col);
  }
  // Voice flashes: expanding ring, exponential decay.
  for (i = 0; i < voiceEvents.length; i++) {
    var v = voiceEvents[i], age = t - v.t0;
    if (age < 0 || age > 1.6) { continue; }
    var vp;
    if (v.glyph === 'ring') {
      var rp = ringPos(v.idx, L, t);
      vp = { x: rp.x, y: rp.y, s: rp.s };
    } else {
      var fp = facePos(FACE[v.idx], L, t);
      vp = { x: fp.x, y: fp.y, s: fp.s };
    }
    ctx.globalAlpha = Math.exp(-age / 0.55) * 0.8;
    ctx.beginPath();
    ctx.arc(vp.x, vp.y, vp.s * (1.2 + age * 1.4), 0, Math.PI * 2);
    ctx.strokeStyle = OCHRE;
    ctx.lineWidth = Math.max(1, L.u * 0.003);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // Poetic instruction line (fixed, below the score).
  var ly = L.cy + L.u * 0.36, lw = L.u * 0.52, ms = L.u * 0.016;
  for (i = 0; i < LINE.length; i++) {
    var lx = L.cx - lw / 2 + (i + 0.5) * (lw / LINE.length);
    drawLineMark(LINE[i], lx, ly, ms);
  }
  // Pin the canvas element (phone rule: backing store must not double).
  try {
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
  } catch (e) {}
}

// Pointer handling: tap (< 12 px) voices a glyph; drag rotates the score.
function hitTest(x, y, t) {
  var L = layout(), i;
  for (i = 0; i < 13; i++) {
    var p = ringPos(i, L, t);
    var dx = x - p.x, dy = y - p.y;
    if (dx * dx + dy * dy < (p.s + 12) * (p.s + 12)) { return { glyph: 'ring', idx: i, sizeN: RING[i].sizeN }; }
  }
  for (i = 0; i < FACE.length; i++) {
    var fp = facePos(FACE[i], L, t);
    var fdx = x - fp.x, fdy = y - fp.y, fr = fp.s + 10;
    if (fdx * fdx + fdy * fdy < fr * fr) { return { glyph: 'face', idx: i, sizeN: 0.5 }; }
  }
  return null;
}

function onDown(e) {
  var x, y;
  try {
    var r = cv.getBoundingClientRect ? cv.getBoundingClientRect() : { left: 0, top: 0 };
    x = (e.clientX || 0) - (r.left || 0);
    y = (e.clientY || 0) - (r.top || 0);
  } catch (err) { x = e.clientX || 0; y = e.clientY || 0; }
  isDown = true; downX = x; downY = y; moved = 0; downT = curT;
  lastX = x; lastY = y;
}
var lastX = 0, lastY = 0;
function onMove(e) {
  if (!isDown) { return; }
  var x, y;
  try {
    var r = cv.getBoundingClientRect ? cv.getBoundingClientRect() : { left: 0, top: 0 };
    x = (e.clientX || 0) - (r.left || 0);
    y = (e.clientY || 0) - (r.top || 0);
  } catch (err) { x = e.clientX || 0; y = e.clientY || 0; }
  var dx = x - lastX, dy = y - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  dragRot += dx * 0.005;
  lastX = x; lastY = y;
}
function onUp(e) {
  if (!isDown) { return; }
  isDown = false;
  if (moved < 12) {
    var hit = hitTest(downX, downY, curT);
    if (hit) { voice(hit.glyph, hit.idx, hit.sizeN); draw(curT); }
  }
}
try {
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', function () { isDown = false; });
} catch (e) {}

// Boot: frame one is draw(0); the clock starts only with the rAF loop.
var curT = 0;
var startMs = 0;
draw(0);
function loop(ts) {
  if (!startMs) { startMs = ts; }
  curT = (ts - startMs) / 1000;
  draw(curT);
  if (typeof requestAnimationFrame === 'function') { requestAnimationFrame(loop); }
}
if (typeof requestAnimationFrame === 'function') { requestAnimationFrame(loop); }
</script>
</body>
</html>
