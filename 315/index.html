<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.315 Ditzy Field</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EAD8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.315 Ditzy Field (Coral Cockatoo).
// A full field of one motif only, the gum blossom, scattered at
// micro scale in vermilion on cream paper. Print silhouette glyph:
// an operculum cap over a radial stamen burst, no petals, solid ink.
// Idle is a 30s seamless loop: a slow diagonal swell wave crosses
// the field and returns, so frame 30s matches frame 0 exactly.
// Drag presses the motifs under the finger up to full size on a
// local spring; they ease back when the pointer lifts. The swell
// is local only, never a zoom of the field. One canvas, no text.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F2EAD8', INK = '#C73E1D';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
// Start mid loop so the swell wave is already mid-field on frame one.
var T = 15, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var LOOP = 30;

// ---- seeded rng (static data generation only) -----------------------
function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- the single motif species, asserted ------------------------------
var SPECIES = ['gum blossom'];
if (SPECIES.length !== 1) throw new Error('Ditzy Field needs exactly 1 motif species');

// Stamen fan of the glyph: one fixed count for every motif, so the
// species stays one species everywhere in the field.
var STAMENS = 18;
var STAMEN_ANG = [];
(function () {
  var r = rng(31518), i;
  for (i = 0; i < STAMENS; i++) {
    STAMEN_ANG.push((i / STAMENS) * Math.PI * 2 + (r() - 0.5) * 0.14);
  }
})();
if (STAMEN_ANG.length !== STAMENS) throw new Error('glyph stamen count drifted');

// ---- jittered rotated scatter, no uniform grid -----------------------
// Seeded poisson-ish scatter: a coarse lattice heavily jittered and
// rotated per motif, extended past the design edges so the cover-fit
// field stays full-bleed at any aspect.
var MOTIFS = [];
(function () {
  var r = rng(90215), step = 38, x, y, jx, jy;
  for (y = -step; y < DH + step; y += step) {
    for (x = -step; x < DW + step; x += step) {
      jx = (r() - 0.5) * step * 0.92;
      jy = (r() - 0.5) * step * 0.92;
      MOTIFS.push({
        x: x + jx, y: y + jy,
        rot: r() * Math.PI * 2,
        varr: 0.82 + r() * 0.36,
        p: 0, v: 0
      });
    }
  }
})();
if (MOTIFS.length < 600 || MOTIFS.length > 1200) throw new Error('scatter count out of range');

// Diagonal projection for the travelling swell wave. One full wave
// cycle crosses the field per loop, an integer number of cycles per
// 30s, so the idle loop is seamless.
function waveAt(x, y) {
  var proj = (x * 0.832 + y * 0.555) / 1550;
  var ph = (proj - T / LOOP) * Math.PI * 2;
  var c = 0.5 + 0.5 * Math.cos(ph);
  return Math.pow(c, 3); // one raised crest band, wide calm between
}

// ---- interaction state ----------------------------------------------
var pointer = null; // {x, y} in design coords while pressing
var PRESS_R = 125;

function pressTarget(m) {
  if (!pointer) return 0;
  var dx = m.x - pointer.x, dy = m.y - pointer.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d >= PRESS_R) return 0;
  var f = 1 - d / PRESS_R;
  return f * f * (3 - 2 * f); // smoothstep falloff
}

// ---- drawing ---------------------------------------------------------
// One gum blossom glyph centred on the origin at radius R, rotated.
// Cap first as a solid dome, stamens bursting radially under and
// around it, cup disc at the heart. A thin paper gap separates the
// cap from the burst so the cap reads at micro scale. Solid ink
// only, full opacity, two colours in the whole piece.
function drawGlyph(R, rot) {
  var i, a, ca, sa, x0, y0, x1, y1;
  ctx.save();
  ctx.rotate(rot);
  // stamen burst: filaments radiating out with dot tips
  ctx.strokeStyle = INK;
  ctx.lineWidth = Math.max(0.9, R * 0.10);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (i = 0; i < STAMENS; i++) {
    a = STAMEN_ANG[i]; ca = Math.cos(a); sa = Math.sin(a);
    x0 = ca * R * 0.30; y0 = sa * R * 0.30;
    x1 = ca * R * 0.84; y1 = sa * R * 0.84;
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  }
  ctx.stroke();
  ctx.fillStyle = INK;
  for (i = 0; i < STAMENS; i++) {
    a = STAMEN_ANG[i];
    ctx.beginPath();
    ctx.arc(Math.cos(a) * R * 0.95, Math.sin(a) * R * 0.95, R * 0.13, 0, Math.PI * 2);
    ctx.fill();
  }
  // cup at the heart of the burst
  ctx.beginPath(); ctx.arc(0, 0, R * 0.34, 0, Math.PI * 2); ctx.fill();
  // paper gap, then the operculum cap dome sitting on the cup
  ctx.strokeStyle = PAPER;
  ctx.lineWidth = Math.max(0.7, R * 0.09);
  ctx.beginPath(); ctx.arc(0, -R * 0.02, R * 0.40, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.arc(0, -R * 0.06, R * 0.40, Math.PI, Math.PI * 2);
  ctx.closePath(); ctx.fill();
  // cap knob
  ctx.beginPath(); ctx.arc(0, -R * 0.50, R * 0.11, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(-90, -90, DW + 180, DH + 180);
  var i, m, R;
  for (i = 0; i < MOTIFS.length; i++) {
    m = MOTIFS[i];
    R = 10.5 * m.varr * (1 + waveAt(m.x, m.y) * 1.05 + m.p * 2.6);
    ctx.save();
    ctx.translate(m.x, m.y);
    drawGlyph(R, m.rot);
    ctx.restore();
  }
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  pointer = { x: p[0], y: p[1] };
});
canvas.addEventListener('pointermove', function (e) {
  if (!pointer) return;
  var p = toDesign(e);
  pointer.x = p[0]; pointer.y = p[1];
});
function endPointer() { pointer = null; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);

function tick() {
  var i, m, target;
  // critically damped-ish springs: press swells fast, eases back soft
  var K = 170, C = 19;
  for (i = 0; i < MOTIFS.length; i++) {
    m = MOTIFS[i];
    target = pressTarget(m);
    if (target === 0 && m.p === 0 && m.v === 0) continue;
    m.v += (K * (target - m.p) - C * m.v) * TICK;
    m.p += m.v * TICK;
    if (!pointer && Math.abs(m.p) < 0.001 && Math.abs(m.v) < 0.001) { m.p = 0; m.v = 0; }
  }
}

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: field compositions fill the viewport at any aspect,
  // full-bleed on phones, overflow cropped symmetrically
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK; acc -= TICK; guard++;
    tick();
  }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
