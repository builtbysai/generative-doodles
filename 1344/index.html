<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Day Desk / Night Table</title>
<style>
  html, body { margin: 0; padding: 0; background: #2B2620; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Palette, verbatim from the prompt.
  var DAY_GROUND = '#3E4A5C', TILE = '#7A8BA0', THUD = '#2A323E';
  var AMBER = '#F5C86E', PAD = '#E8C96A', GRAPHITE = '#2A2A2E';
  var SPLIT = '#8A8A8A', NIGHT_GROUND = '#2B2620';

  // Loop: day 20s, wash 2s, night 20s, wash 2s = 44s. (The prompt's phase
  // timings sum to 44s; the "48s" total is the prompt's own loose count.)
  var LOOP = 44, PHASE = 8; // frame one opens 8s into the day phase.
  var W = 0, H = 0, phone = false;

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var minDim = Math.min(window.screen.width, window.screen.height);
    phone = minDim < 700 || (H > W * 1.15);
  }

  // Seeded data: stamp glyphs (48 cells) and pad strokes (400).
  var rng = mulberry32(1344000);
  var GLYPHS = [];
  for (var i = 0; i < 48; i++) {
    var g = Math.floor(rng() * 3), marks = [];
    if (g === 0) { marks = [[0.25, 0.3, 0.75, 0.3], [0.3, 0.62, 0.7, 0.62]]; }
    else if (g === 1) { marks = [[0.5, 0.5, 0.28], [0.28, 0.72, 0.72, 0.28]]; }
    else { marks = [[0.5, 0.28, 0.5, 0.72], [0.28, 0.5, 0.72, 0.5]]; }
    GLYPHS.push({ kind: g, marks: marks, jx: (rng() - 0.5) * 0.08, jy: (rng() - 0.5) * 0.08 });
  }

  // 1D value noise for the mountain ridgelines.
  function hash1(n, seed) {
    var s = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x, seed) {
    var i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return hash1(i, seed) * (1 - u) + hash1(i + 1, seed) * u;
  }
  function ridgeY(x01, seed, base, amp) {
    var y = vnoise(x01 * 4, seed) * 0.6 + vnoise(x01 * 9, seed + 7) * 0.4;
    return base - y * amp;
  }

  var STROKES = [];
  (function () {
    var r2 = mulberry32(1344001);
    for (var k = 0; k < 400; k++) {
      var ridge = k % 3;
      var x01 = r2();
      var base = [0.42, 0.58, 0.74][ridge], amp = [0.16, 0.20, 0.22][ridge];
      STROKES.push({ x01: x01, ridge: ridge, y01: ridgeY(x01, 1344 + ridge, base, amp) + (r2() - 0.5) * 0.05, len: 6 + r2() * 12, ang: (r2() - 0.5) * 0.9 });
    }
  })();

  function nightFactor(ct) {
    if (ct < 20) return 0;
    if (ct < 22) return (ct - 20) / 2;
    if (ct < 42) return 1;
    return 1 - (ct - 42) / 2;
  }
  function dayStampAlpha(i, ct) {
    var land = i * 1.2;
    if (ct < land) return 0;
    var a = Math.min(1, (ct - land) / 0.3);
    var row = Math.floor(i / 6), rc = (row * 6 + 5) * 1.2 + 6;
    if (ct > rc) a *= Math.max(0, 1 - (ct - rc) / 2);
    return a;
  }
  function stampAlpha(i, ct) {
    var base = dayStampAlpha(i, 20);
    if (ct < 20) return dayStampAlpha(i, ct);
    if (ct < 22) return base * (1 - 0.65 * (ct - 20) / 2);
    if (ct < 42) return base * 0.35;
    return base * 0.35 * (1 - (ct - 42) / 2);
  }
  function strokeCount(ct) {
    if (ct < 22) return 0;
    if (ct < 38) return Math.floor((ct - 22) / 16 * 400);
    if (ct < 42) return 400;
    return Math.floor(400 * (1 - (ct - 42) / 2));
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function draw(ct) {
    var nf = nightFactor(ct), half = W / 2;
    // One room: cool day ground left, dark warm night ground right.
    ctx.fillStyle = DAY_GROUND;
    ctx.fillRect(0, 0, half, H);
    ctx.fillStyle = NIGHT_GROUND;
    ctx.fillRect(half, 0, W - half, H);
    // Light split: cool light on the day side, amber light on the night side.
    ctx.fillStyle = 'rgba(122,139,160,' + (0.07 * (1 - nf)).toFixed(3) + ')';
    ctx.fillRect(0, 0, half, H);
    ctx.fillStyle = 'rgba(245,200,110,' + (0.10 * nf).toFixed(3) + ')';
    ctx.fillRect(half, 0, W - half, H);

    // Day grid: 6 cols x 8 rows in the upper two-thirds of the left half.
    var gw = half * 0.8, gx = half * 0.1, gy = H * 0.08, gh = H * 0.66;
    var cw = gw / 6, ch = gh / 8, ts = Math.min(cw, ch) * 0.78;
    for (var i = 0; i < 48; i++) {
      var a = stampAlpha(i, ct);
      if (a <= 0) continue;
      var col = i % 6, row = Math.floor(i / 6);
      var cx = gx + col * cw + (cw - ts) / 2, cy = gy + row * ch + (ch - ts) / 2;
      ctx.globalAlpha = a;
      ctx.fillStyle = THUD;
      rr(cx + 3, cy + 4, ts, ts, 4); ctx.fill();
      ctx.fillStyle = TILE;
      rr(cx, cy, ts, ts, 4); ctx.fill();
      var g = GLYPHS[i];
      ctx.strokeStyle = THUD; ctx.lineWidth = Math.max(1, ts * 0.05);
      ctx.beginPath();
      for (var m = 0; m < g.marks.length; m++) {
        var mk = g.marks[m];
        if (g.kind === 1 && m === 0) {
          ctx.moveTo(cx + (mk[0] + g.jx) * ts + mk[2], cy + (mk[1] + g.jy) * ts);
          ctx.arc(cx + (mk[0] + g.jx) * ts, cy + (mk[1] + g.jy) * ts, mk[2], 0, Math.PI * 2);
        } else {
          ctx.moveTo(cx + (mk[0] + g.jx) * ts, cy + (mk[1] + g.jy) * ts);
          ctx.lineTo(cx + (mk[2] + g.jx) * ts, cy + (mk[3] + g.jy) * ts);
        }
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Night pad: landscape-aspect, centered in the right half, ~70% of it.
    var pw = half * 0.7, ph = pw * 0.62;
    var px = half + (half - pw) / 2, py = H * 0.5 - ph / 2;
    var padA = 0.25 + 0.75 * nf;
    ctx.globalAlpha = padA;
    ctx.fillStyle = PAD;
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = 'rgba(42,42,46,0.18)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var ly = py + 14; ly < py + ph - 4; ly += 14) { ctx.moveTo(px + 6, ly); ctx.lineTo(px + pw - 6, ly); }
    ctx.stroke();
    // Mountain landscape: strokes resolve as the night phase spends its budget.
    var n = strokeCount(ct);
    ctx.strokeStyle = GRAPHITE; ctx.lineWidth = Math.max(1, pw * 0.004);
    ctx.beginPath();
    for (var s = 0; s < n; s++) {
      var st = STROKES[s];
      var sx = px + st.x01 * pw, sy = py + st.y01 * ph;
      var dx = Math.cos(st.ang) * st.len / 2, dy = Math.sin(st.ang) * st.len / 2;
      ctx.moveTo(sx - dx, sy - dy);
      ctx.lineTo(sx + dx, sy + dy);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Bulb glow, top-right of the night half: layered flat-alpha ellipses,
    // never a drawn lamp, never a gradient.
    var bx = W - half * 0.18, by = H * 0.12;
    var glowA = 0.10 + 0.45 * nf;
    ctx.fillStyle = 'rgba(245,200,110,' + (glowA * 0.25).toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(bx, by, half * 0.30, half * 0.20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(245,200,110,' + (glowA * 0.5).toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(bx, by, half * 0.18, half * 0.12, 0, 0, Math.PI * 2); ctx.fill();

    // Split line, pencil gray.
    ctx.fillStyle = SPLIT;
    ctx.fillRect(Math.floor(half) - 1, 0, 2, H);

    // Changeover wash: flat-alpha band sweeping across the split.
    var wp = -1;
    if (ct >= 20 && ct < 22) wp = (ct - 20) / 2;
    if (ct >= 42 && ct < 44) wp = (ct - 42) / 2;
    if (wp >= 0) {
      var bandW = W * 0.25, bandX = -bandW + wp * (W + bandW);
      ctx.fillStyle = 'rgba(245,200,110,0.16)';
      ctx.fillRect(bandX, 0, bandW, H);
      ctx.fillStyle = 'rgba(245,200,110,' + (0.08 * Math.sin(Math.PI * wp)).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  size();
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { size(); draw(lastCt); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { size(); draw(lastCt); });
  }
  var lastCt = PHASE;
  var start = -1;
  function loop(now) {
    if (start < 0) start = now;
    var el = (now - start) / 1000;
    lastCt = (el + PHASE) % LOOP;
    draw(lastCt);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  draw(PHASE);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
