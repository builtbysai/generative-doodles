<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Festejan las Gallinas</title>
<style>
  html, body { margin: 0; padding: 0; background: #D9A08F; overflow: hidden; }
  canvas { display: block; cursor: pointer; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var TAU = Math.PI * 2;
function frac(x) { return x - Math.floor(x); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// ---------- palette (strict, exact, maria-j-luque block 7) ----------
var ROSE = "#D9A08F";     // dusty-rose cloth ground
var MAGENTA = "#C93A72";  // center chicken
var BLUEGRAY = "#9AA5B1"; // flanker chickens, needle
var YELLOW = "#E8B93C";   // beaks, feet, seed stitches
var TURQ = "#3FA7A0";     // stitched stars
var THREAD = "#2A2320";   // dark thread

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone() {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0 && mn < 700) return true;
  return H > W * 1.15;
}

function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  draw(currentPhase());
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
}
window.addEventListener("resize", resize);

// ---------- animation state ----------
// Watch-only seamless loop: the three chickens peck in turn, stars glint
// twice per loop. All motion is anchored to a fixed phase offset, never
// to the wall clock. The colophon TEXT is the single sanctioned Date
// exception: it is read from new Date() once at load (and again only
// when the colophon band is tapped), per the artist's rule that the
// colophon records the real moment of the work.
var LOOP = 6;             // seconds per full peck cycle
var PHASE0 = 0;           // fixed first-frame phase: every head up
var startStamp = null;

function currentPhase() {
  if (startStamp === null) return PHASE0;
  var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  return PHASE0 + (now - startStamp) / 1000;
}

// ---------- the colophon (her signature) ----------
// Pattern: "17 DE AGOSTO DE 2026. ROSARIO", with the real load date.
var MESES = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO",
             "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];
function colophonString(d) {
  return d.getDate() + " DE " + MESES[d.getMonth()] + " DE " + d.getFullYear() + ". ROSARIO";
}
var colophonText = colophonString(new Date());  // read once, at load
var colophonStart = -1000;  // phase when the current stitch-in began; far past = fully stitched
var RESTITCH_PER_CHAR = 0.055;                  // seconds per letter while re-stitching

// per-letter wobble, fixed by seed so the lettering never flickers
function charWobble(i) {
  var r = mulberry32(583100 + i * 37);
  return { dx: (r() - 0.5) * 2.6, dy: (r() - 0.5) * 3.0, rot: (r() - 0.5) * 0.055, s: 0.94 + r() * 0.12 };
}

// lay the colophon out once per string: shrink to fit, center it
var colophonLayout = null;
function layoutColophon() {
  var size = 44;
  var widths = [], total = 0, i, w;
  while (size > 18) {
    ctx.font = "700 " + size + "px 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive";
    total = 0; widths = [];
    for (i = 0; i < colophonText.length; i++) {
      w = ctx.measureText(colophonText[i]).width + size * 0.09;
      widths.push(w); total += w;
    }
    if (total <= 900) break;
    size -= 2;
  }
  colophonLayout = { size: size, widths: widths, total: total };
}

// ---------- precomputed seeded cloth detail ----------
// faint woven speckle in dark thread, very low alpha
var speckle = [];
(function () {
  var r = mulberry32(583001);
  for (var i = 0; i < 260; i++) {
    speckle.push({ x: r() * 1000, y: r() * 1000, a: 0.025 + r() * 0.04, l: 3 + r() * 4 });
  }
})();
// seed stitches scattered lower-center, where the beaks point
var seeds = [];
(function () {
  var r = mulberry32(583002);
  for (var i = 0; i < 46; i++) {
    var ang = r() * TAU, rad = Math.sqrt(r());
    seeds.push({
      x: 500 + Math.cos(ang) * rad * 205,
      y: 692 + Math.sin(ang) * rad * 48,
      rot: r() * Math.PI, l: 9 + r() * 6
    });
  }
})();
// stitched stars, upper third
var stars = [];
(function () {
  var r = mulberry32(583003);
  var spots = [[150, 150], [300, 105], [470, 165], [640, 100], [790, 160], [880, 240], [215, 265], [700, 275]];
  for (var i = 0; i < spots.length; i++) {
    stars.push({ x: spots[i][0], y: spots[i][1], s: 15 + r() * 13, off: r() * LOOP });
  }
})();

// ---------- parallax (drag) ----------
var parX = 0, parY = 0, parTX = 0, parTY = 0;
var dragging = false, dragMoved = false, downX = 0, downY = 0, lastX = 0, lastY = 0;

function stagePoint(e) {
  var S = Math.min(W, H) / 1000;
  return { x: (e.clientX - W / 2) / S + 500, y: (e.clientY - H / 2) / S + 500 };
}
canvas.addEventListener("pointerdown", function (e) {
  dragging = true; dragMoved = false;
  downX = lastX = e.clientX; downY = lastY = e.clientY;
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  var dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 7) dragMoved = true;
  var S = Math.min(W, H) / 1000;
  parTX = clamp(parTX + dx / S * 0.55, -16, 16);
  parTY = clamp(parTY + dy / S * 0.55, -10, 10);
});
function endPointer(e) {
  if (!dragging) return;
  dragging = false;
  if (!dragMoved && e && typeof e.clientX === "number") {
    var p = stagePoint(e);
    // tap on the colophon band: re-stitch it with the current real date
    if (p.y > 838 && p.y < 985 && p.x > 20 && p.x < 980) {
      colophonText = colophonString(new Date());
      colophonLayout = null;
      colophonStart = currentPhase();
    }
  }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", function () { dragging = false; });

// ---------- stitch helpers ----------
function stitchPath(build) {
  ctx.beginPath();
  build();
  ctx.setLineDash([8, 5.5]);
  ctx.lineWidth = 3.2;
  ctx.strokeStyle = THREAD;
  ctx.stroke();
  ctx.setLineDash([]);
}
function dashSeg(x1, y1, x2, y2, color, wdt) {
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = wdt;
  ctx.lineCap = "round";
  ctx.stroke();
}

// ---------- the pecking ----------
// Each chicken pecks once per loop in its own third of the cycle:
// a quick dip down to the seeds with a small second nod, then up.
function peckAmount(phase, idx) {
  var local = frac((phase - idx * (LOOP / 3)) / LOOP) * LOOP; // 0..LOOP
  var win = 1.15;
  if (local >= win) return 0;
  var u = local / win; // 0..1 through the peck
  var dip = Math.pow(Math.sin(Math.PI * u), 1.4);
  var nod = 0.16 * Math.sin(Math.PI * 3 * u) * Math.sin(Math.PI * u);
  return Math.max(0, dip + nod);
}

// ---------- the chickens ----------
// Appliqué body with running-stitch outline, drawn facing `flip` (1 = right).
// `peck` (0..1) rotates the head down around the neck pivot toward the seeds.
function drawChicken(cx, cy, sc, flip, color, peck) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(flip * sc, sc);

  // feet (yellow stitches on the cloth)
  dashSeg(-26, 96, -30, 118, THREAD, 3);
  dashSeg(24, 96, 28, 118, THREAD, 3);
  dashSeg(-42, 122, -14, 122, YELLOW, 5);
  dashSeg(-30, 118, -30, 126, YELLOW, 5);
  dashSeg(12, 122, 40, 122, YELLOW, 5);
  dashSeg(28, 118, 28, 126, YELLOW, 5);

  // tail feathers
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-78, -18);
  ctx.quadraticCurveTo(-128, -66, -118, -20);
  ctx.quadraticCurveTo(-132, -30, -124, 8);
  ctx.quadraticCurveTo(-104, -2, -96, 26);
  ctx.quadraticCurveTo(-84, 8, -74, 22);
  ctx.closePath();
  ctx.fill();
  stitchPath(function () {
    ctx.moveTo(-78, -18);
    ctx.quadraticCurveTo(-128, -66, -118, -20);
    ctx.quadraticCurveTo(-132, -30, -124, 8);
    ctx.quadraticCurveTo(-104, -2, -96, 26);
    ctx.quadraticCurveTo(-84, 8, -74, 22);
  });

  // body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 18, 96, 80, 0, 0, TAU);
  ctx.fill();
  stitchPath(function () { ctx.ellipse(0, 18, 96, 80, 0, 0, TAU); });

  // wing
  ctx.beginPath();
  ctx.ellipse(-8, 30, 52, 38, -0.35, 0, TAU);
  stitchPath(function () { ctx.ellipse(-8, 30, 52, 38, -0.35, 0, TAU); });

  // head group (pecks around the neck pivot)
  ctx.save();
  ctx.translate(58, -38);
  ctx.rotate(peck * 0.62);
  ctx.translate(-58, 38);
  ctx.translate(58, -38);

  // comb
  ctx.fillStyle = color;
  var bumps = [[-16, -34], [2, -42], [20, -34]];
  for (var i = 0; i < bumps.length; i++) {
    ctx.beginPath(); ctx.arc(bumps[i][0], bumps[i][1], 11, 0, TAU); ctx.fill();
  }
  stitchPath(function () {
    for (var j = 0; j < bumps.length; j++) { ctx.moveTo(bumps[j][0] + 11, bumps[j][1]); ctx.arc(bumps[j][0], bumps[j][1], 11, 0, TAU); }
  });
  // head
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
  stitchPath(function () { ctx.arc(0, 0, 40, 0, TAU); });
  // beak (yellow appliqué)
  ctx.fillStyle = YELLOW;
  ctx.beginPath();
  ctx.moveTo(30, -6); ctx.lineTo(66, 4); ctx.lineTo(30, 14); ctx.closePath();
  ctx.fill();
  stitchPath(function () { ctx.moveTo(30, -6); ctx.lineTo(66, 4); ctx.lineTo(30, 14); ctx.closePath(); });
  // wattle
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(34, 24, 8, 13, 0.2, 0, TAU); ctx.fill();
  // eye
  ctx.fillStyle = THREAD;
  ctx.beginPath(); ctx.arc(12, -6, 4.6, 0, TAU); ctx.fill();

  ctx.restore(); // head
  ctx.restore(); // chicken
}

// ---------- stars ----------
function glintPulse(phase, off) {
  var t = frac((phase + off) / LOOP) * LOOP;
  var g = 0;
  var centers = [1.0, 4.0]; // two glints per loop
  for (var i = 0; i < centers.length; i++) {
    var d = Math.abs(t - centers[i]);
    if (d < 0.85) { var u = 1 - d / 0.85; g = Math.max(g, u * u); }
  }
  return g;
}
function drawStar(st, phase) {
  var g = glintPulse(phase, st.off);
  var s = st.s * (1 + 0.38 * g);
  ctx.save();
  ctx.translate(st.x, st.y);
  ctx.globalAlpha = 0.72 + 0.28 * g;
  // four-point stitched sparkle
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.quadraticCurveTo(s * 0.16, -s * 0.16, s, 0);
  ctx.quadraticCurveTo(s * 0.16, s * 0.16, 0, s);
  ctx.quadraticCurveTo(-s * 0.16, s * 0.16, -s, 0);
  ctx.quadraticCurveTo(-s * 0.16, -s * 0.16, 0, -s);
  ctx.closePath();
  ctx.setLineDash([6, 4.5]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = TURQ;
  ctx.stroke();
  ctx.setLineDash([]);
  // cross-stitch heart
  dashSeg(-s * 0.3, -s * 0.3, s * 0.3, s * 0.3, TURQ, 3);
  dashSeg(s * 0.3, -s * 0.3, -s * 0.3, s * 0.3, TURQ, 3);
  ctx.restore();
}

// ---------- the colophon ----------
function drawColophon(phase) {
  if (!colophonLayout) layoutColophon();
  var lay = colophonLayout;
  var elapsed = phase - colophonStart;
  var shown = elapsed >= colophonText.length * RESTITCH_PER_CHAR + 0.5
    ? colophonText.length
    : Math.max(0, Math.floor(elapsed / RESTITCH_PER_CHAR));

  ctx.save();
  ctx.translate(500, 918);
  ctx.rotate(-0.011); // slightly crooked, like hers

  // stitched hem line above the band
  ctx.beginPath();
  ctx.moveTo(-452, -44); ctx.lineTo(452, -44);
  ctx.setLineDash([9, 6]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = THREAD;
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = THREAD;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.font = "700 " + lay.size + "px 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive";
  var x = -lay.total / 2;
  var i, wob;
  for (i = 0; i < shown; i++) {
    wob = charWobble(i);
    ctx.save();
    ctx.translate(x + lay.widths[i] / 2 + wob.dx, wob.dy);
    ctx.rotate(wob.rot);
    ctx.scale(wob.s, wob.s);
    ctx.fillText(colophonText[i], -lay.widths[i] / 2, 0);
    ctx.restore();
    x += lay.widths[i];
  }
  // stitch ticks under the letters already sewn
  ctx.beginPath();
  var tx = -lay.total / 2;
  for (i = 0; i < shown; i++) {
    ctx.moveTo(tx + 2, lay.size * 0.62);
    ctx.lineTo(tx + lay.widths[i] - 4, lay.size * 0.62);
    tx += lay.widths[i];
  }
  ctx.setLineDash([5, 4]);
  ctx.lineWidth = 2.2;
  ctx.strokeStyle = THREAD;
  ctx.globalAlpha = 0.65;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  // the needle, only while a re-stitch is in flight
  if (shown < colophonText.length) {
    var nx = x + 16, ny = -6 + Math.sin(phase * 22) * 3;
    ctx.save();
    ctx.translate(nx, ny);
    ctx.rotate(-0.5);
    ctx.fillStyle = BLUEGRAY;
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 3.4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = ROSE;
    ctx.beginPath(); ctx.ellipse(-9, 0, 4.2, 1.7, 0, 0, TAU); ctx.fill();
    ctx.restore();
    // loose thread trailing back to the last letter
    ctx.beginPath();
    ctx.moveTo(nx - 14, ny + 3);
    ctx.quadraticCurveTo(x + 8, 16, x - 4, 6);
    ctx.strokeStyle = THREAD; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
}

// ---------- draw ----------
function draw(phase) {
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // page ground = the cloth itself
  ctx.fillStyle = ROSE;
  ctx.fillRect(0, 0, W, H);

  var S = Math.min(W, H) / 1000;
  ctx.translate(W / 2, H / 2);
  ctx.scale(S, S);
  ctx.translate(-500, -500);

  // ease parallax toward its target
  parX += (parTX - parX) * 0.08;
  parY += (parTY - parY) * 0.08;

  // cloth speckle
  ctx.strokeStyle = THREAD;
  ctx.lineCap = "round";
  var i;
  for (i = 0; i < speckle.length; i++) {
    ctx.globalAlpha = speckle[i].a;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(speckle[i].x, speckle[i].y);
    ctx.lineTo(speckle[i].x + speckle[i].l, speckle[i].y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // stitched hem around the cloth
  ctx.beginPath();
  ctx.rect(22, 22, 956, 956);
  ctx.setLineDash([10, 7]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = THREAD;
  ctx.globalAlpha = 0.75;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  // stars (far layer)
  ctx.save();
  ctx.translate(parX * 0.35, parY * 0.35);
  for (i = 0; i < stars.length; i++) drawStar(stars[i], phase);
  ctx.restore();

  // chickens (mid layer); they peck in turn: left, center, right
  ctx.save();
  ctx.translate(parX * 0.6, parY * 0.6);
  drawChicken(268, 545, 0.92, 1, BLUEGRAY, peckAmount(phase, 0));
  drawChicken(732, 545, 0.92, -1, BLUEGRAY, peckAmount(phase, 2));
  drawChicken(500, 520, 1.12, 1, MAGENTA, peckAmount(phase, 1));
  ctx.restore();

  // seed stitches (near layer, where the beaks point)
  ctx.save();
  ctx.translate(parX, parY);
  ctx.strokeStyle = YELLOW;
  ctx.lineCap = "round";
  for (i = 0; i < seeds.length; i++) {
    var sd = seeds[i];
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(sd.x - Math.cos(sd.rot) * sd.l / 2, sd.y - Math.sin(sd.rot) * sd.l / 2);
    ctx.lineTo(sd.x + Math.cos(sd.rot) * sd.l / 2, sd.y + Math.sin(sd.rot) * sd.l / 2);
    ctx.stroke();
  }
  ctx.restore();

  drawColophon(phase);

  // tiny hint inside the hem
  ctx.fillStyle = THREAD;
  ctx.globalAlpha = 0.45;
  ctx.font = "15px sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("drag", 40, 62);
  ctx.globalAlpha = 1;
}

// ---------- run ----------
// synchronous, deterministic first frame: the completed scene, heads up,
// with the colophon for the load date stitched in full
resize();

if (typeof requestAnimationFrame === "function") {
  startStamp = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  var loop = function () {
    draw(currentPhase());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
