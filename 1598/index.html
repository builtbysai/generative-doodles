// Leaf geometry: phi is the tilt of the leaf normal away from the viewer axis,

var leaves = buildLeaves();

  ctx.beginPath();
  ctx.moveTo(rx, 0);
  ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = rgba(shade(col, 0.55), 0.38);
  ctx.lineWidth = Math.max(0.8, R * 0.02);
  ctx.beginPath();

    ctx.lineTo(ex, ey);

  ctx.stroke();
  ctx.strokeStyle = rgba(EDGE, 0.28 + 0.35 * f);
  ctx.lineWidth = Math.max(1, R * 0.035);
  ctx.beginPath();

  ctx.ellipse(0, 0, rx, ry, 0, la - 1.05, la + 1.05);
  ctx.stroke();
  ctx.fillStyle = rgba(shade(col, 0.35), 0.9);
  ctx.beginPath();
  ctx.moveTo(R * 0.07, 0);
  ctx.ellipse(0, 0, R * 0.07, R * 0.07 * flat, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function drawStem(lf, bx, by, lx, ly, t) {

  ctx.lineWidth = Math.max(1.2, u() * 0.28);

  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.quadraticCurveTo(cxp, cyp, lx, ly);
  ctx.stroke();
}

  size();
  ctx.fillStyle = 'rgb(' + GROUND[0] + ',' + GROUND[1] + ',' + GROUND[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var comp = compRect();
  var R = Math.min(comp.w, comp.h) * 0.075;
  var order = [];
  for (var i = 0; i < leaves.length; i++) order.push(i);
  order.sort(function (a, b) { return leaves[a].yf - leaves[b].yf; });

    var ly = comp.y + lf.yf * comp.h + Math.sin(TAU * (t / (lf.stemPer * 0.7)) + lf.stemPh * 2) * u() * 0.5;
    var bx = comp.x + lf.xf * comp.w;
    var by = comp.y + comp.h;
    drawStem(lf, bx, by, lx, ly, t);

  for (var k2 = 0; k2 < order.length; k2++) {
    var lf2 = leaves[order[k2]];
    var lx2 = comp.x + lf2.xf * comp.w + Math.sin(TAU * (t / lf2.stemPer) + lf2.stemPh) * u() * 1.2;
    var ly2 = comp.y + lf2.yf * comp.h + Math.sin(TAU * (t / (lf2.stemPer * 0.7)) + lf2.stemPh * 2) * u() * 0.5;

  var smallPx = isPhone ? 11 : 12;

  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(TEXT, 0.62);
  ctx.fillText('The Leaf Decides', comp.x + comp.w / 2, comp.y + Math.max(6, 0.012 * comp.h));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(TEXT, 0.45);
  ctx.fillText('2006 · 05 · 28', comp.x + comp.w / 2, comp.y + Math.max(6, 0.012 * comp.h) + titlePx + 5);
  ctx.font = smallPx + 'px monospace';

  }

}
</script>
