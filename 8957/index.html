<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hover · №8957</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #ece1c9;
    overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 70vw;
    font: 400 13px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(74, 64, 48, 0.78); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 ui-rounded, system-ui, sans-serif;
    color: rgba(74, 64, 48, 0.45);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cap">Marks at the edge of seeing. They come and go on their own; your pointer steadies them. Tap for a new field.</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   Hover - No.8957 (2026-07-20)
   Seed 256 (Threshold Hover): a low drone-like ground with marks
   placed exactly at the visibility boundary, where the eye cannot
   settle whether it is seeing marks or texture. Each mark breathes
   in and out of visibility on its own slow rhythm; the flip
   between figure and field is the piece. The pointer is a steady
   hand: marks near it gain contrast and hold still.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 895701;
document.getElementById("seedtag").textContent = "seed " + seed;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

const PAPER = "#ece1c9";
let W = 0, H = 0, DPR = 1;
let rand = null;
let marks = [];
let drones = [];
let px = -9999, py = -9999; // pointer

function build() {
  rand = mulberry32(seed);
  marks = [];
  drones = [];
  // drone: large soft tonal blotches, the low ground
  for (let i = 0; i < 5; i++) {
    drones.push({
      x: rand(), y: rand(), r: 0.28 + rand() * 0.30,
      tone: rand() < 0.5 ? "100,88,64" : "120,104,78",
      a: 0.05 + rand() * 0.05,
      dx: (rand() - 0.5) * 0.05, dy: (rand() - 0.5) * 0.05,
      ph: rand() * 6.28
    });
  }
  // clusters of marks
  const nCl = 6;
  const clusters = [];
  for (let i = 0; i < nCl; i++) clusters.push({ x: rand(), y: rand(), r: 0.10 + rand() * 0.14 });
  const N = Math.round(W * H / 900);
  for (let i = 0; i < N; i++) {
    let x, y;
    if (rand() < 0.72) {
      const c = clusters[Math.floor(rand() * nCl)];
      const a = rand() * 6.2832, rr = Math.sqrt(rand()) * c.r;
      x = c.x + Math.cos(a) * rr; y = c.y + Math.sin(a) * rr * 0.8;
    } else { x = rand(); y = rand(); }
    // local flow angle from a slow field
    const fa = Math.sin(x * 9.1 + seed) * 1.4 + Math.cos(y * 7.3) * 1.1 + x * 2.2;
    marks.push({
      x: Math.min(1.02, Math.max(-0.02, x)),
      y: Math.min(1.02, Math.max(-0.02, y)),
      ang: fa,
      len: 0.008 + Math.pow(rand(), 2.2) * 0.030,
      curve: (rand() - 0.5) * 1.6,
      ph: rand() * 6.2832,
      sp: 0.35 + rand() * 0.75,
      base: 0.13 + rand() * 0.08,
      amp: 0.06 + rand() * 0.08
    });
  }
}

function draw(t) {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  // drone ground
  const S = Math.min(W, H);
  for (const d of drones) {
    const dx = d.x + Math.sin(t * 0.05 + d.ph) * d.dx * 4;
    const dy = d.y + Math.cos(t * 0.04 + d.ph) * d.dy * 4;
    const g = ctx.createRadialGradient(
      dx * W, dy * H, 0, dx * W, dy * H, d.r * S * 2);
    g.addColorStop(0, "rgba(" + d.tone + "," + d.a + ")");
    g.addColorStop(1, "rgba(" + d.tone + ",0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // marks at the threshold
  ctx.strokeStyle = "#3a3128";
  ctx.lineCap = "round";
  const lensR = Math.min(W, H) * 0.22;
  for (const m of marks) {
    let a = m.base + m.amp * Math.sin(t * m.sp + m.ph);
    if (px >= 0) {
      const d2 = (m.x * W - px) * (m.x * W - px) + (m.y * H - py) * (m.y * H - py);
      a += 0.30 * Math.exp(-d2 / (lensR * lensR));
    }
    if (a < 0.02) continue;
    ctx.globalAlpha = Math.min(0.5, a);
    ctx.lineWidth = Math.max(1, S / 700);
    const x0 = m.x * W, y0 = m.y * H;
    const L = m.len * S;
    const mx = x0 + Math.cos(m.ang) * L * 0.5;
    const my = y0 + Math.sin(m.ang) * L * 0.5;
    const cxp = mx + Math.cos(m.ang + Math.PI / 2) * m.curve * L * 0.3;
    const cyp = my + Math.sin(m.ang + Math.PI / 2) * m.curve * L * 0.3;
    const x1 = x0 + Math.cos(m.ang) * L, y1 = y0 + Math.sin(m.ang) * L;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(cxp, cyp, x1, y1);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // title
  const ts = Math.max(18, Math.min(W, H) / 24);
  ctx.fillStyle = "rgba(74,64,48,0.88)";
  ctx.font = "700 " + ts + "px ui-rounded, system-ui, sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("HOVER", 14, 34);
}

let last = 0, t0 = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (!t0) t0 = t;
  draw((t - t0) / 1000);
}

canvas.addEventListener("pointermove", function (e) { px = e.clientX; py = e.clientY; });
canvas.addEventListener("pointerdown", function (e) {
  px = e.clientX; py = e.clientY;
  seed = (seed + 1) >>> 0;
  document.getElementById("seedtag").textContent = "seed " + seed;
  build();
});
canvas.addEventListener("pointerleave", function () { px = -9999; py = -9999; });

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  build();
}
window.addEventListener("resize", resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
