<!DOCTYPE html>
<html lang="en">
<head>

<title>No.386 Cloud Dancer Tiles</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FDFCF8; }
  canvas { display:block; }

</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.386 Cloud Dancer Tiles (maryna-lagereva).
// After Maryna Lagereva's Delft whimsy: a strict
// 8x8 grid of hand-wobbled tiles in Delft blue on
// white, and the traditional windmills are gone.
// In their place, one whimsical vignette per tile
// from her observed set: cat, cupcake, wave, palm
// tree, tomato, sailboat, open book, heart. Exactly
// one tile is the Cloud Dancer joke tile: pure
// white, holding a single tiny blue cloud. STRICT
// two-colour discipline: linework #1F4E79, borders
// #163A5C, ground #FDFCF8, nothing else. WATCH-ONLY:
// a flat stepped glaze band sweeps diagonally every
// 25s, and one tile at a time redraws itself by
// stroke reveal on a fixed authored schedule, like
// a painter touching up the kiln batch. Everything
// is fixed seeded data baked at load and drawn
// directly on this ONE canvas: no layers, no
// offscreen, no gradients, no shadows.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#FDFCF8', LINE = '#1F4E79', BORDER = '#163A5C';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 100;
if (LOOP !== 100) throw new Error('Cloud Dancer Tiles loop must be 100s');
var SHIMMER = 25; // 4 whole glaze sweeps per loop
if (LOOP % SHIMMER !== 0) throw new Error('shimmer must complete whole sweeps per loop');
var REVEAL = 4; // each touch-up redraw takes 4s
var TICK = 1 / 60;
var PI = Math.PI;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-
// looking value in the piece is baked from this at
// load and never changes between frames or renders.
var seed = 386;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- stroke sampling helpers ---------------------------
// A stroke is an array of [x, y] points. Motifs are
// composed from sampled lines, arcs and beziers, so
// every motif is pure data and can be drawn whole or
// revealed by arc length for the touch-up redraws.
function lineS(x1, y1, x2, y2) { return [[x1, y1], [x2, y2]]; }
function arcS(cx, cy, r, a0, a1, n) {
  var p = [], i, a;
  for (i = 0; i <= n; i++) { a = a0 + (a1 - a0) * i / n; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return p;
}
function quadS(x0, y0, x1, y1, x2, y2, n) {
  var p = [], i, t, u;
  for (i = 0; i <= n; i++) {
    t = i / n; u = 1 - t;
    p.push([u * u * x0 + 2 * u * t * x1 + t * t * x2, u * u * y0 + 2 * u * t * y1 + t * t * y2]);
  }
  return p;
}
function bezS(x0, y0, x1, y1, x2, y2, x3, y3, n) {
  var p = [], i, t, u;
  for (i = 0; i <= n; i++) {
    t = i / n; u = 1 - t;
    p.push([u * u * u * x0 + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3,
            u * u * u * y0 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3]);
  }
  return p;
}
function join() {
  var p = [], i, j, s;
  for (i = 0; i < arguments.length; i++) {
    s = arguments[i];
    for (j = 0; j < s.length; j++) { if (p.length && j === 0) continue; p.push(s[j]); }
  }
  return p;
}
function star4(x, y, r) {
  return [[x, y - r], [x + r * 0.28, y - r * 0.28], [x + r, y], [x + r * 0.28, y + r * 0.28],
          [x, y + r], [x - r * 0.28, y + r * 0.28], [x - r, y], [x - r * 0.28, y - r * 0.28], [x, y - r]];
}
function heartPts(cx, cy, k) {
  function sc(pts) { var q = [], i; for (i = 0; i < pts.length; i++) q.push([cx + pts[i][0] * k, cy + pts[i][1] * k]); return q; }
  return join(
    sc(bezS(0, 30, -30, 16, -32, -6, -24, -16, 12)),
    sc(bezS(-24, -16, -16, -28, -4, -24, 0, -10, 10)),
    sc(bezS(0, -10, 4, -24, 16, -28, 24, -16, 10)),
    sc(bezS(24, -16, 32, -6, 30, 16, 0, 30, 12)));
}

// ---- the 8-motif library -------------------------------
// Each motif is drawn in a 100x80 box centred on the
// origin and returns 15-25 strokes (asserted below).
function motifCat() {
  return [
    arcS(0, -13, 14, 0, PI * 2, 24),
    lineS(-11, -22, -14, -35), lineS(-14, -35, -3, -27),
    lineS(3, -27, 14, -35), lineS(14, -35, 11, -22),
    quadS(-12, -2, -24, 10, -25, 30, 8),
    quadS(12, -2, 24, 10, 25, 30, 8),
    quadS(-25, 30, 0, 34, 25, 30, 6),
    bezS(25, 28, 40, 24, 42, 8, 34, -4, 10),
    quadS(-9, -13, -6, -11, -3, -13, 4),
    quadS(3, -13, 6, -11, 9, -13, 4),
    [[-2, -7], [2, -7], [0, -4]],
    quadS(-3, -3, 0, -1, 3, -3, 4),
    lineS(-15, -7, -29, -9), lineS(-15, -3, -28, -1),
    lineS(15, -7, 29, -9), lineS(15, -3, 28, -1),
    quadS(0, 0, -5, 12, 0, 24, 6),
    lineS(-13, 30, -13, 22), lineS(13, 30, 13, 22)
  ];
}
function motifCupcake() {
  return [
    lineS(-19, -4, -14, 30), lineS(19, -4, 14, 30), lineS(-14, 30, 14, 30),
    lineS(-10, -3, -7, 29), lineS(-3, -3, -2, 29), lineS(3, -3, 2, 29), lineS(10, -3, 7, 29),
    bezS(-23, -4, -14, -12, 14, -12, 23, -4, 10),
    bezS(-17, -14, -9, -21, 9, -21, 17, -14, 10),
    bezS(-10, -23, -5, -29, 5, -29, 10, -23, 8),
    bezS(-4, -27, -2, -36, 6, -38, 8, -33, 8),
    arcS(13, -28, 4.5, 0, PI * 2, 12),
    quadS(13, -32, 16, -38, 19, -39, 5),
    lineS(-14, -9, -11, -11), lineS(-4, -16, -1, -18), lineS(9, -10, 12, -12),
    lineS(14, -18, 17, -19), lineS(-9, -20, -6, -22)
  ];
}
function motifWave() {
  return [
    bezS(-40, 28, -38, -6, -24, -26, -2, -28, 12),
    arcS(8, -20, 10, PI * 0.95, PI * 2.4, 12),
    arcS(8, -20, 5, PI * 0.95, PI * 2.3, 10),
    bezS(17, -13, 26, 0, 28, 12, 26, 28, 10),
    quadS(-24, -24, -28, -31, -33, -31, 5),
    quadS(-12, -27, -14, -34, -10, -37, 5),
    quadS(0, -27, 1, -34, 5, -36, 5),
    quadS(-34, -12, -38, -17, -42, -16, 5),
    arcS(-27, 29, 10.5, PI, PI * 2, 8),
    arcS(-5, 29, 10.5, PI, PI * 2, 8),
    arcS(17, 29, 10.5, PI, PI * 2, 8),
    arcS(-16, 36, 8, PI, PI * 2, 7),
    arcS(6, 36, 8, PI, PI * 2, 7),
    arcS(28, 36, 8, PI, PI * 2, 7),
    arcS(-33, -2, 2.4, 0, PI * 2, 8),
    arcS(33, -24, 2, 0, PI * 2, 8),
    arcS(-16, -14, 1.8, 0, PI * 2, 8)
  ];
}
function motifPalm() {
  var crown = [10, -21], fronds = [], a, i;
  var tips = [[-34, -20], [-24, -34], [10, -34], [26, -34], [40, -22], [32, -20]];
  var cps = [[-24, -32], [-14, -40], [20, -40], [36, -32], [42, -14], [26, -28]];
  for (i = 0; i < 6; i++) {
    fronds.push(bezS(crown[0], crown[1], crown[0] + (cps[i][0] - crown[0]) * 0.4, cps[i][1],
                     cps[i][0], cps[i][1] + 6, tips[i][0], tips[i][1], 10));
  }
  return [
    bezS(-4, 36, -2, 12, 2, -6, 7, -20, 10),
    bezS(6, 36, 8, 12, 11, -6, 13, -20, 10),
    quadS(-3, 24, 3, 26, 8, 24, 4),
    quadS(-1, 8, 4, 10, 10, 8, 4),
    quadS(1, -6, 6, -4, 12, -6, 4)
  ].concat(fronds).concat([
    arcS(4, -18, 3.5, 0, PI * 2, 10),
    arcS(14, -16, 3, 0, PI * 2, 10),
    quadS(-14, 36, -13, 28, -16, 24, 4),
    quadS(-8, 36, -6, 29, -4, 25, 4),
    quadS(20, 36, 21, 29, 24, 25, 4),
    lineS(28, 36, 30, 30)
  ]);
}
function motifTomato() {
  var strokes = [
    arcS(0, 6, 26, 0, PI * 2, 28),
    quadS(-18, -6, -20, 10, -12, 22, 8),
    arcS(-13, -8, 6, PI * 0.7, PI * 1.5, 8),
    quadS(0, -20, 2, -28, 6, -33, 6)
  ];
  var k, ang, dirx, diry, px, py;
  for (k = 0; k < 5; k++) {
    ang = -PI / 2 + (k - 2) * 0.52;
    dirx = Math.cos(ang); diry = Math.sin(ang);
    px = -diry; py = dirx;
    strokes.push([[px * 3 + dirx * 2, -19 + py * 3 + diry * 2],
                  [dirx * 17, -19 + diry * 17],
                  [-px * 3 + dirx * 2, -19 - py * 3 + diry * 2]]);
  }
  strokes.push(quadS(19, -2, 21, 12, 13, 23, 8));
  strokes.push(arcS(-8, 6, 1.3, 0, PI * 2, 6));
  strokes.push(arcS(5, 17, 1.3, 0, PI * 2, 6));
  strokes.push(arcS(13, 4, 1.3, 0, PI * 2, 6));
  strokes.push(arcS(2, -6, 1.3, 0, PI * 2, 6));
  strokes.push(bezS(6, -33, 12, -38, 16, -34, 13, -30, 8));
  return strokes;
}
function motifBoat() {
  function gull(x, y, k) {
    function sc(pts) { var q = [], i; for (i = 0; i < pts.length; i++) q.push([x + pts[i][0] * k, y + pts[i][1] * k]); return q; }
    return join(sc(quadS(0, 0, 4, -3, 8, 0, 4)), sc(quadS(8, 0, 12, -3, 16, 0, 4)));
  }
  return [
    lineS(-30, 14, 30, 14),
    bezS(-30, 14, -22, 29, 22, 29, 30, 14, 10),
    bezS(-23, 19, -14, 25, 14, 25, 23, 19, 8),
    lineS(0, 12, 0, -32),
    [[3, -29], [3, 9], [23, 9], [3, -29]],
    [[-3, -25], [-3, 9], [-19, 9], [-3, -25]],
    lineS(0, -32, 9, -29), lineS(9, -29, 0, -26),
    lineS(9, -16, 9, 9),
    lineS(15, -5, 15, 9),
    arcS(-14, 19, 2.2, 0, PI * 2, 8),
    arcS(0, 21, 2.2, 0, PI * 2, 8),
    arcS(14, 19, 2.2, 0, PI * 2, 8),
    quadS(-34, 34, -20, 30, -6, 34, 6),
    quadS(0, 36, 12, 32, 24, 36, 6),
    quadS(-16, 38, -6, 35, 4, 38, 5),
    gull(20, -28, 0.9),
    gull(28, -20, 0.65)
  ];
}
function motifBook() {
  var leftPage = join(
    bezS(-36, -14, -20, -20, -6, -17, -1, -13, 10),
    lineS(-1, -13, -1, 20),
    bezS(-1, 20, -16, 24, -36, 18, -36, -14, 10));
  var rightPage = join(
    bezS(36, -14, 20, -20, 6, -17, 1, -13, 10),
    lineS(1, -13, 1, 20),
    bezS(1, 20, 16, 24, 36, 18, 36, -14, 10));
  return [
    leftPage, rightPage,
    quadS(-37, 20, -18, 28, -1, 24, 6),
    quadS(1, 24, 18, 28, 37, 20, 6),
    quadS(-30, -6, -20, -9, -8, -7, 5),
    quadS(-30, 2, -20, -1, -8, 1, 5),
    quadS(-30, 10, -20, 7, -9, 9, 5),
    quadS(8, -7, 20, -9, 30, -6, 5),
    quadS(8, 1, 20, -1, 30, 2, 5),
    quadS(9, 9, 20, 7, 30, 10, 5),
    lineS(24, -13, 24, 7),
    lineS(30, -13, 30, 7),
    [[24, 7], [27, 3], [30, 7]],
    star4(-26, -30, 6),
    star4(0, -34, 6),
    star4(28, -28, 6)
  ];
}
function motifHeart() {
  return [
    heartPts(0, 0, 1),
    heartPts(0, 1, 0.55),
    arcS(-14, -12, 5, PI * 0.8, PI * 1.6, 8),
    lineS(-38, -24, -33, -19), lineS(38, -24, 33, -19),
    lineS(-40, 2, -34, 2), lineS(40, 2, 34, 2),
    star4(-27, -33, 5),
    star4(30, -33, 5),
    star4(0, -37, 4.5),
    heartPts(-32, 27, 0.22),
    heartPts(32, 27, 0.22),
    arcS(-38, 14, 1.3, 0, PI * 2, 6),
    arcS(38, -10, 1.3, 0, PI * 2, 6),
    arcS(-20, -35, 1.3, 0, PI * 2, 6),
    arcS(0, 35, 4, 0, PI * 1.5, 8)
  ];
}
// The Cloud Dancer: one tiny cloud, nothing more.
function motifDancer() {
  var cloud = join(
    arcS(-8, 4, 4.5, PI, PI * 2, 7),
    arcS(0, 3, 6, PI, PI * 2, 9),
    arcS(8, 4, 4.5, PI, PI * 2, 7),
    lineS(12.5, 4, -12.5, 4));
  return [cloud, arcS(0, 1, 3, PI, PI * 2, 6)];
}
var MOTIFS = [motifCat, motifCupcake, motifWave, motifPalm, motifTomato, motifBoat, motifBook, motifHeart];
(function () {
  var i, n;
  for (i = 0; i < MOTIFS.length; i++) {
    n = MOTIFS[i]().length;
    if (n < 15 || n > 25) throw new Error('motif ' + i + ' has ' + n + ' strokes, need 15-25');
  }
})();

// ---- tiles ---------------------------------------------
// Exactly 64 tiles asserted in a fixed 8x8 grid over
// the design space. Each tile bakes its border (a
// rounded square sampled into points, every point
// jittered +-1px from fixed seed data) and its motif
// strokes (transformed into tile space, jittered
// +-0.7px), with cumulative arc lengths so a tile
// can redraw by stroke reveal. Motif assignment is
// seeded: each of the 8 motifs appears 8 times in a
// shuffled deal, then the Cloud Dancer takes its
// one fixed authored seat at index 27 (row 3, col 3).
var COLS = 8, ROWS = 8;
var CELL_W = DW / COLS, CELL_H = DH / ROWS;
var DANCER = 27;
function borderPts(x, y, w, h, r) {
  var pts = [], i, a, cx, cy;
  var corners = [
    [x + w - r, y + r, -PI / 2, 0], [x + w - r, y + h - r, 0, PI / 2],
    [x + r, y + h - r, PI / 2, PI], [x + r, y + r, PI, PI * 1.5]
  ];
  // Walk the perimeter: top edge, corner, right edge, ...
  pts.push([x + r, y]);
  pts.push([x + w / 2, y]);
  for (i = 0; i <= 4; i++) { a = corners[0][2] + (corners[0][3] - corners[0][2]) * i / 4; pts.push([corners[0][0] + Math.cos(a) * r, corners[0][1] + Math.sin(a) * r]); }
  pts.push([x + w, y + h / 2]);
  for (i = 0; i <= 4; i++) { a = corners[1][2] + (corners[1][3] - corners[1][2]) * i / 4; pts.push([corners[1][0] + Math.cos(a) * r, corners[1][1] + Math.sin(a) * r]); }
  pts.push([x + w / 2, y + h]);
  for (i = 0; i <= 4; i++) { a = corners[2][2] + (corners[2][3] - corners[2][2]) * i / 4; pts.push([corners[2][0] + Math.cos(a) * r, corners[2][1] + Math.sin(a) * r]); }
  pts.push([x, y + h / 2]);
  for (i = 0; i <= 4; i++) { a = corners[3][2] + (corners[3][3] - corners[3][2]) * i / 4; pts.push([corners[3][0] + Math.cos(a) * r, corners[3][1] + Math.sin(a) * r]); }
  return pts;
}
function bakeStroke(pts, color) {
  var cum = [0], i, dx, dy;
  for (i = 1; i < pts.length; i++) {
    dx = pts[i][0] - pts[i - 1][0]; dy = pts[i][1] - pts[i - 1][1];
    cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
  }
  return { pts: pts, color: color, cum: cum, total: cum[cum.length - 1] };
}
var TILES = [];
(function () {
  var deal = [], i, j, tmp;
  for (i = 0; i < 64; i++) deal.push(i % 8);
  for (i = deal.length - 1; i > 0; i--) { j = Math.floor(rnd() * (i + 1)); tmp = deal[i]; deal[i] = deal[j]; deal[j] = tmp; }
  var dancers = 0;
  for (i = 0; i < 64; i++) {
    var col = i % COLS, row = Math.floor(i / COLS);
    var x0 = col * CELL_W, y0 = row * CELL_H;
    var cx = x0 + CELL_W / 2, cy = y0 + CELL_H / 2;
    var strokes = [];
    var bp = borderPts(x0 + 3.5, y0 + 3.5, CELL_W - 7, CELL_H - 7, 13);
    for (j = 0; j < bp.length; j++) bp[j] = [bp[j][0] + (rnd() * 2 - 1), bp[j][1] + (rnd() * 2 - 1)];
    bp.push([bp[0][0], bp[0][1]]);
    strokes.push(bakeStroke(bp, BORDER));
    var isDancer = (i === DANCER);
    if (isDancer) dancers++;
    var raw = isDancer ? motifDancer() : MOTIFS[deal[i]]();
    var k = (isDancer ? 0.8 : 0.88) * (0.94 + rnd() * 0.08);
    var rot = (rnd() * 4 - 2) * PI / 180, cr = Math.cos(rot), sr = Math.sin(rot);
    for (j = 0; j < raw.length; j++) {
      var pts = [], m, px, py;
      for (m = 0; m < raw[j].length; m++) {
        px = raw[j][m][0] * k; py = raw[j][m][1] * k;
        pts.push([cx + px * cr - py * sr + (rnd() * 2 - 1) * 0.7,

    }

})();

// ---- touch-up schedule ---------------------------------
// FIXED authored redraw sequence: a table of tile
// indices with start times inside the 100s loop.
// Each named tile blanks and re-inks by stroke
// reveal over 4s, one at a time, like a painter
// touching up the kiln batch. Never the Dancer.
var TOUCH = [
  { at: 4, tile: 9 }, { at: 20, tile: 41 }, { at: 44, tile: 56 },
  { at: 63, tile: 18 }, { at: 82, tile: 33 }
];
function tileReveal(idx, t) {
  var i, u;
  for (i = 0; i < TOUCH.length; i++) {
    if (TOUCH[i].tile === idx && t >= TOUCH[i].at && t < TOUCH[i].at + REVEAL) {
      u = (t - TOUCH[i].at) / REVEAL;
      return u * u * (3 - 2 * u);
    }
  }
  return 1;
}

// ---- drawing -------------------------------------------
function strokeUpTo(st, upto) {
  var pts = st.pts, cum = st.cum, i;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  if (upto >= st.total) {
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  } else {
    for (i = 1; i < pts.length; i++) {
      if (cum[i] <= upto) { ctx.lineTo(pts[i][0], pts[i][1]); continue; }
      var seg = cum[i] - cum[i - 1];
      var f = seg > 0 ? (upto - cum[i - 1]) / seg : 0;
      ctx.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f,
                 pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f);
      break;
    }
  }
  ctx.stroke();
}
// The glaze: a diagonal band of FLAT stepped alpha
// (seven steps, peaking at the prompt's 0.12 white),
// sweeping along the x+y diagonal once per 25s.
// Drawn as parallelograms of constant x+y, so the
// sweep is a true diagonal with no gradient anywhere.
var SHEEN = [0.03, 0.06, 0.09, 0.12, 0.09, 0.06, 0.03];
function drawSheen(t) {
  var p = (t % SHIMMER) / SHIMMER;
  var ub = -200 + p * 2580;
  var stepW = 55, i, u0, u1;
  ctx.fillStyle = '#FFFFFF';
  for (i = 0; i < SHEEN.length; i++) {
    u0 = ub - (SHEEN.length / 2 - i) * stepW;
    u1 = u0 + stepW;
    ctx.globalAlpha = SHEEN[i];
    ctx.beginPath();
    ctx.moveTo(-700, u0 + 700);
    ctx.lineTo(1980, u0 - 1980);
    ctx.lineTo(1980, u1 - 1980);
    ctx.lineTo(-700, u1 + 700);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- motion state --------------------------------------
// Constant first-frame phase: T = 37.5s into the
// 100s loop. The glaze band sits exactly mid-sweep
// (halfway through its 25s period, crossing the
// middle of the grid), every tile is fully inked and
// no touch-up window is open. Frame one is drawn
// synchronously at this constant; the rAF loop
// advances T from the same anchor in fixed ticks.
// Frame one never reads a wall clock.
var T = 37.5;
var lastNow = -1, acc = 0;

function draw() {
  var t = T % LOOP;
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  var i, j, tile, frac, budget;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (i = 0; i < TILES.length; i++) {
    tile = TILES[i];
    frac = tileReveal(i, t);
    budget = tile.total * frac;
    for (j = 0; j < tile.strokes.length; j++) {
      if (budget <= 0) break;
      ctx.strokeStyle = tile.strokes[j].color;
      strokeUpTo(tile.strokes[j], Math.min(budget, tile.strokes[j].total));
      budget -= tile.strokes[j].total;
    }
  }
  drawSheen(t);
}

// ---- sizing: cover fit, full-bleed field ---------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
