<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№60 · One Stroke</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2eee6; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(24,24,24,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to change the ratio</div>
<script>
'use strict';
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '60', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }

const FIGS=[[3,2],[5,4],[4,3],[5,3],[2,1],[3,1]];
let dragFig=null, dragRel=-1e9;
function figFor(idx){ if(dragFig) return dragFig; return FIGS[((idx%FIGS.length)+FIGS.length)%FIGS.length]; }
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#f2eee6'; ctx.fillRect(0,0,w,h);
  const total=7, tt=(nowMs/1000)%total, idx=Math.floor((nowMs/1000)/total);
  const [a,b]=figFor(idx);
  let frac;
  if(tt<5) frac=smooth(tt/5*1)* (tt/5); else if(tt<6) frac=1; else frac=1-(tt-6)/1;
  frac=Math.max(0,Math.min(1,frac));
  if(tt<5) frac=tt/5;
  const cx=w/2, cy=h/2, A=Math.min(w,h)*0.40, B=Math.min(w,h)*0.40;
  const delta=Math.PI/2;
  const steps=3000, n=Math.floor(frac*steps);
  ctx.strokeStyle='#181818'; ctx.lineWidth=1.75; ctx.lineJoin='round'; ctx.beginPath();
  let tip=null;
  for(let i=0;i<=n;i++){
    const s=i/steps*Math.PI*2;
    const x=cx+A*Math.sin(a*s+delta), y=cy+B*Math.sin(b*s);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    tip=[x,y];
  }
  if(n>=2) ctx.stroke();
  if(tip){ ctx.fillStyle='#d84a2b'; ctx.beginPath(); ctx.arc(tip[0],tip[1],3,0,Math.PI*2); ctx.fill(); }
  return {};
}

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(4900);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);

let dragOn60=false;
canvas.addEventListener('pointerdown',ev=>{dragOn60=true; const [w,h]=viewportWH(); const a=Math.max(1,Math.min(6,Math.round(1+(ev.clientX/w)*5))); const b=Math.max(1,Math.min(6,Math.round(1+(ev.clientY/h)*5))); dragFig=[a,b];});
canvas.addEventListener('pointermove',ev=>{ if(!dragOn60) return; const [w,h]=viewportWH(); const a=Math.max(1,Math.min(6,Math.round(1+(ev.clientX/w)*5))); const b=Math.max(1,Math.min(6,Math.round(1+(ev.clientY/h)*5))); dragFig=[a,b]; });
function endDrag60(){ dragOn60=false; setTimeout(()=>{dragFig=null;},4000); }
canvas.addEventListener('pointerup',endDrag60); canvas.addEventListener('pointercancel',endDrag60);

window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
