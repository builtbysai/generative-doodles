<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1946 Tune Their Perception</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Tune Their Perception, LR3 / PP1193, study #254 lucy-railton.
  // A stage where three disciplines take turns leading: giant blocks
  // of color and black screens on a huge display, a membrane-like
  // reflector surface catching sculptural light, and a tiny cellist
  // silhouette moving between stage positions. Nobody accompanies
  // anybody; the triangle rotates. Drag vertically to nudge which
  // discipline leads; the leadership always rotates back on its own.
  var BG = '#0a0a0a';        // stage black
  var FLOOR = '#171717';     // dim stage floor, so the black silhouette reads
  var SCREEN_RED = '#e8481f';// screen orange-red
  var SCREEN_RED2 = '#ff5a26';// brighter orange-red block
  var SCREEN_DARK = '#1c0d08';// dark red ember block
  var SILVER = '#c9ccd2';    // membrane silver
  var SILVER_DIM = '#8a8f98';// dimmed silver
  var SILVER_HI = '#f2f3f5'; // silver highlight
  var TEXTW = '#ffffff';     // projected text white
  var INK = '#f5f2ee';       // plate ink, near white on black
  var HINT = '#d8d4cc';      // hint, warm grey-white

  // Fixed-phase first frame: FIRST_T = 16 s. At t = 16 the scheduler
  // is in the light section, so the reflector leads: the membrane is
  // bright with a slow light streak crossing it, the screen is dimmed
  // to a near-black frame with one ember block (cue 4, not a black
  // screen cue), and the cellist is small at the violin station
  // mid-stage. Cue 3 and cue 7 are black screens, so 16 avoids them.
  var FIRST_T = 16;

  // QA probe hooks: ?seed= varies the film cue jitter, ?lead=film,
  // ?lead=light or ?lead=cello forces the leader at load.
  var seedParam = 0, probeLead = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = qs.match(/[?&]seed=(-?\d+)/); if (m) { seedParam = parseInt(m[1], 10) || 0; }
    m = qs.match(/[?&]lead=(film|light|cello)/); if (m) { probeLead = m[1]; }
  } catch (e) {}
  var FIELD_SEED = seedParam ? (1946 + seedParam * 101) : 1946;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the piece
  // number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Film cue blocks: for each 4 s cue, a seeded set of orange-red
  // blocks on the screen. Cues 3 and 7 are black screens, the film
  // stretched thin. Nothing here depends on t except the cue index.
  function cueBlocks(cue) {
    var rng = mulberry32(FIELD_SEED * 100 + cue * 7919);
    var blocks = [];
    if (cue === 3 || cue === 7) { return blocks; } // black screen
    var n = 2 + Math.floor(rng() * 3);
    var i;
    for (i = 0; i < n; i++) {
      blocks.push({
        x: 0.05 + rng() * 0.70, y: 0.06 + rng() * 0.55,
        w: 0.12 + rng() * 0.22, h: 0.10 + rng() * 0.30,
        c: rng() < 0.55 ? SCREEN_RED : (rng() < 0.5 ? SCREEN_RED2 : SCREEN_DARK),
        ph: rng() * Math.PI * 2
      });
    }
    return blocks;
  }

  // Interaction state: vertical drag bias. Empty at load, so frame
  // one is a pure function of t and the seed.
  var dragging = false;
  var downX = 0, downY = 0, lastY = 0;
  var dragBias = 0;   // -1 (cellist) to +1 (film); 0 means scheduler rules
  var lastDrawT = FIRST_T;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function smooth(f) { return f * f * (3 - 2 * f); }

  // Leadership scheduler: 12 s sections, film, light, cello, repeat.
  // A strong vertical drag bias overrides the scheduler while it
  // lasts; the bias decays after release, so leadership rotates back.
  function baseLeader(t) { return Math.floor(t / 12) % 3; } // 0 film, 1 light, 2 cello
  function leader(t) {
    if (probeLead === 'film') { return 0; }
    if (probeLead === 'light') { return 1; }
    if (probeLead === 'cello') { return 2; }
    if (Math.abs(dragBias) > 0.3) { return dragBias > 0 ? 0 : 2; }
    return baseLeader(t);
  }
  function leaderName(t) {
    var l = leader(t);
    return l === 0 ? 'film' : (l === 1 ? 'light' : 'cello');
  }

  // Cellist stations, fractions of stage width: mic and amp, violin,
  // behind the desk. Station changes every 9 s with a 2 s smooth
  // glide, so the figure is always moving but never hurries.
  var STATIONS = [0.22, 0.50, 0.78];
  function cellistX(t) {
    var idx = Math.floor(t / 9) % 3;
    var prev = (idx + 2) % 3;
    var f = clamp((t % 9) / 2, 0, 1);
    var x = STATIONS[prev] + (STATIONS[idx] - STATIONS[prev]) * smooth(f);
    return x * W;
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The film screen: upper two thirds. Blocks from the cue timeline;
  // when film does not lead, the screen dims to near black and only
  // one ember block survives. The projected line drifts across it
  // as light, never as a caption.
  function drawScreen(t, lead) {
    var sx = 0.06 * W, sy = 0.115 * H, sw = 0.88 * W, sh = 0.49 * H;
    ctx.fillStyle = BG;
    ctx.fillRect(sx - 3, sy - 3, sw + 6, sh + 6);
    ctx.strokeStyle = hexA(SILVER_DIM, 0.5);
    ctx.lineWidth = 1;
    ctx.strokeRect(sx - 3, sy - 3, sw + 6, sh + 6);
    // Clip everything inside the screen.
    ctx.save();
    ctx.beginPath();
    ctx.rect(sx, sy, sw, sh);
    ctx.clip();
    ctx.fillStyle = '#050505';
    ctx.fillRect(sx, sy, sw, sh);
    var cue = Math.floor(t / 4) % 8;
    var blocks = cueBlocks(cue);
    var bright = (lead === 0) ? 1 : 0.20;
    var i;
    var show = (lead === 0) ? blocks : blocks.slice(0, 1);
    for (i = 0; i < show.length; i++) {
      var b = show[i];
      var jx = Math.sin(t * 0.11 + b.ph) * sw * 0.008;
      var jy = Math.cos(t * 0.09 + b.ph) * sh * 0.008;
      ctx.globalAlpha = a4(bright);
      ctx.fillStyle = b.c;
      ctx.fillRect(sx + b.x * sw + jx, sy + b.y * sh + jy, b.w * sw, b.h * sh);
      ctx.globalAlpha = 1;
    }
    // Projected text: white light drifting leftward across the
    // screen, large and soft, brighter when the film leads.
    var line = 'the light spinning on its axis, locked in its own cycle';
    var fs = Math.round(0.042 * W);
    ctx.font = 'italic ' + fs + 'px Georgia, "Times New Roman", serif';
    var tw = ctx.measureText(line).width;
    var travel = sw + tw + 80;
    var off = ((t + 40) * 16) % travel; // phase: the line sits mid-screen at FIRST_T
    var tx = sx + sw + 40 - off;
    var ty = sy + sh * 0.30 + Math.sin(t * 0.21) * sh * 0.05;
    var ta = (lead === 0) ? 0.92 : 0.55;
    ctx.fillStyle = hexA(TEXTW, a4(ta * 0.35));
    ctx.fillText(line, tx + 2, ty + 2);
    ctx.fillStyle = hexA(TEXTW, a4(ta));
    ctx.fillText(line, tx, ty);
    ctx.restore();
  }

  // The reflector: a membrane-like silver ellipse hanging mid frame,
  // with a slow light streak rotating across it. Brightest when the
  // light leads; dimmed silver otherwise.
  function drawReflector(t, lead) {
    var cx = 0.5 * W, cy = 0.685 * H;
    var rx = 0.34 * W, ry = 0.048 * H;
    var bright = (lead === 1) ? 1 : 0.45;
    // Wavy membrane edge, silver body.
    var grad = ctx.createLinearGradient(cx - rx, cy - ry, cx + rx, cy + ry);
    grad.addColorStop(0, hexA(SILVER_DIM, a4(0.85 * bright)));
    grad.addColorStop(0.5, hexA(SILVER, a4(0.95 * bright)));
    grad.addColorStop(1, hexA(SILVER_DIM, a4(0.85 * bright)));
    ctx.fillStyle = grad;
    ctx.beginPath();
    var i;
    for (i = 0; i <= 40; i++) {
      var a = (i / 40) * Math.PI * 2;
      var wob = 1 + 0.06 * Math.sin(a * 5 + t * 0.4);
      var px = cx + Math.cos(a) * rx * wob;
      var py = cy + Math.sin(a) * ry * wob;
      if (i === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
    }
    ctx.closePath();
    ctx.fill();
    // Sculptural light streak rotating slowly across the membrane.
    var sa = t * 0.06;
    var sx1 = cx - Math.cos(sa) * rx * 0.85, sy1 = cy - Math.sin(sa) * ry * 0.7;
    var sx2 = cx + Math.cos(sa) * rx * 0.85, sy2 = cy + Math.sin(sa) * ry * 0.7;
    ctx.strokeStyle = hexA(SILVER_HI, a4(0.85 * bright));
    ctx.lineWidth = Math.max(2, ry * 0.35);
    ctx.beginPath();
    ctx.moveTo(sx1, sy1);
    ctx.lineTo(sx2, sy2);
    ctx.stroke();
    // A second, fainter streak crossing at a slow offset angle.
    var sa2 = sa + 0.9;
    ctx.strokeStyle = hexA(SILVER_HI, a4(0.4 * bright));
    ctx.lineWidth = Math.max(1, ry * 0.16);
    ctx.beginPath();
    ctx.moveTo(cx - Math.cos(sa2) * rx * 0.7, cy - Math.sin(sa2) * ry * 0.6);
    ctx.lineTo(cx + Math.cos(sa2) * rx * 0.7, cy + Math.sin(sa2) * ry * 0.6);
    ctx.stroke();
  }

  // The cellist: a pure black silhouette, small, at the bottom of
  // the stage, gliding between mic and amp, violin, and the desk.
  // The bow moves faster when the cello leads. The figure never
  // grows; the sound, not the figure, takes the lead.
  function drawCellist(t, lead) {
    var x = cellistX(t);
    var floorY = 0.90 * H;
    var h = 0.065 * H; // figure height, about six percent of the stage
    // A faint warm backlight halo behind the figure, so the pure
    // black silhouette reads against the black stage without growing.
    var hg = ctx.createRadialGradient(x, floorY - h * 0.5, 0, x, floorY - h * 0.5, h * 2.2);
    hg.addColorStop(0, hexA('#c8a878', a4(lead === 2 ? 0.16 : 0.09)));
    hg.addColorStop(1, hexA('#c8a878', a4(0)));
    ctx.fillStyle = hg;
    ctx.fillRect(x - h * 2.2, floorY - h * 2.7, h * 4.4, h * 4.4);
    var bowRate = (lead === 2) ? 0.9 : 0.3;
    var bow = Math.sin(t * bowRate) * 0.35;
    // Body: a slim seated figure, head, torso, cello body.
    ctx.fillStyle = '#000000';
    ctx.beginPath(); ctx.moveTo(x + h * 0.10, floorY - h * 0.98); ctx.arc(x, floorY - h * 0.92, h * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - h * 0.10, floorY - h * 0.82);
    ctx.lineTo(x + h * 0.10, floorY - h * 0.82);
    ctx.lineTo(x + h * 0.16, floorY);
    ctx.lineTo(x - h * 0.16, floorY);
    ctx.closePath();
    ctx.fill();
    // Cello body leaning against the figure.
    ctx.beginPath(); ctx.moveTo(x + h * 0.22, floorY - h * 0.62); ctx.arc(x + h * 0.16, floorY - h * 0.42, h * 0.20, 0, Math.PI * 2); ctx.fill();
    // Bow, a thin line angled by the playing motion.
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = Math.max(1, h * 0.03);
    ctx.beginPath();
    ctx.moveTo(x + h * 0.05, floorY - h * 0.55);
    ctx.lineTo(x + h * 0.55, floorY - h * 0.55 + bow * h);
    ctx.stroke();
    // The station marker: a mic stand, a small desk, or nothing.
    var idx = Math.floor(t / 9) % 3;
    ctx.strokeStyle = hexA(SILVER_DIM, 0.8);
    ctx.lineWidth = 1;
    if (idx === 0) {
      // Mic and amp: a thin stand and a low box.
      ctx.beginPath(); ctx.moveTo(x - h * 0.9, floorY); ctx.lineTo(x - h * 0.9, floorY - h * 0.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - h * 0.9, floorY - h * 0.7); ctx.arc(x - h * 0.9, floorY - h * 0.72, h * 0.06, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = hexA(SILVER_DIM, 0.55);
      ctx.fillRect(x - h * 1.35, floorY - h * 0.28, h * 0.5, h * 0.28);
    } else if (idx === 2) {
      // Behind the desk: a low desk line in front of the figure.
      ctx.fillStyle = hexA(SILVER_DIM, 0.55);
      ctx.fillRect(x - h * 0.7, floorY - h * 0.30, h * 1.4, h * 0.30);
    }
  }

  // The generative cello-like sound model: a thin waveform along
  // the bottom, a closed-form sum of sines. Strongest when the
  // cello leads, a whisper otherwise. Visual only, no WebAudio.
  function drawSound(t, lead) {
    var y0 = 0.93 * H;
    var amp = (lead === 2) ? 7 : 2.5;
    ctx.strokeStyle = hexA(SILVER, a4(lead === 2 ? 0.8 : 0.35));
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    var x;
    for (x = 0; x <= W; x += 6) {
      var f = x / W;
      var y = y0 + Math.sin(f * 9 + t * 1.1) * amp * 0.6
        + Math.sin(f * 23 - t * 0.7) * amp * 0.3
        + Math.sin(f * 4 + t * 0.4) * amp * 0.4;
      if (x === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
  }

  function draw(t) {
    lastT = t;
    // The drag bias decays after release, about a 4 s time constant,
    // so leadership rotates back to the scheduler on its own.
    if (!dragging) {
      var dt = t - lastDrawT;
      if (dt > 0 && dt < 30) { dragBias *= Math.exp(-dt / 4); }
    }
    lastDrawT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var lead = leader(t);

    // Stage black, then the dim floor band at the bottom.
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, 0.84 * H, W, 0.16 * H);

    drawScreen(t, lead);
    drawReflector(t, lead);
    drawCellist(t, lead);
    drawSound(t, lead);

    // ---- Plates: title top-left, number and date below it.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Tune Their Perception', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1946 · 2007 · 05 · 11', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    // ---- Hint, centered at the bottom, in warm grey-white.
    var hint = 'Drag vertically to nudge the lead.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = HINT;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function perfT() { return lastT; }

  function canvasPos(e) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      var p = canvasPos(e);
      downX = p.x; downY = p.y; lastY = p.y;
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var p = canvasPos(e);
      var dy = p.y - lastY;
      lastY = p.y;
      // Drag up, toward the screen, biases the film; drag down,
      // toward the cellist, biases the cello. The middle of the
      // range leaves the scheduler alone.
      dragBias = clamp(dragBias + (-dy) / (H * 0.35), -1, 1);
      draw(reduced ? FIRST_T : perfT());
    });
    window.addEventListener('pointerup', function () { dragging = false; });
    window.addEventListener('pointercancel', function () { dragging = false; });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock, and
  // window.__piece1946 exposes the leader, the bias, and a redraw.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1946 = {
      leader: function (t) { return leaderName(t === undefined ? lastT : t); },
      bias: function () { return dragBias; },
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: the scheduler turns at 12 s per section, the film
  // cue changes every 4 s, the reflector streak turns at 0.06 rad/s,
  // the cellist glides between stations every 9 s, all far under the
  // 14 Hz ceiling. Guarded so node-canvas QA still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
