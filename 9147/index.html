<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№9147 — The X-Ray Rowhouse</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0e1218;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .cap{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:#3a4350;
    font:13px/1.4 Georgia,serif;letter-spacing:.14em;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">№9147 — THE X-RAY ROWHOUSE</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
var FIELD='#0e1218', OUTLINE='#3a4350';
var AMBER='#e8b04b', GOLD='#c9a86a', CREAM='#e8e0d0', TEAL='#5a7a72';
var houses=[], focusIdx=0, focusT=0;
var pressedHouse=-1, dragLight=null;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  buildHouses();
}
function buildHouses(){
  var n=5;
  var gap=W*0.03, totalW=W*0.94;
  var hw=(totalW-gap*(n-1))/n;
  var baseY=H*0.82;
  houses=[];
  for(var i=0;i<n;i++){
    var hh=H*(0.24+Math.random()*0.14);
    var hx=W*0.03+i*(hw+gap);
    var h={x:hx, y:baseY-hh, w:hw, h:hh, roof:hh*0.35,
      lights:[], cool:TEAL};
    // 2-3 light-marks per house
    var nL=2+Math.floor(Math.random()*2);
    for(var j=0;j<nL;j++){
      var kind=Math.random();
      h.lights.push({
        type: kind<0.4?'dot':(kind<0.7?'rocker':'pulse'),
        x:hx+hw*(0.2+Math.random()*0.6),
        y:baseY-hh*(0.2+Math.random()*0.6),
        tx:hx+hw*(0.2+Math.random()*0.6),
        ty:baseY-hh*(0.2+Math.random()*0.6),
        sp:0.08+Math.random()*0.2, // waypoints per second
        ph:Math.random()*Math.PI*2,
        col: j===0? AMBER : (Math.random()<0.5? GOLD : CREAM),
        cool: j===nL-1
      });
    }
    houses.push(h);
  }
  focusIdx=Math.floor(Math.random()*n);
  focusT=20+Math.random()*20;
}
function step(dt){
  focusT-=dt;
  if(focusT<=0){
    focusIdx=(focusIdx+1+Math.floor(Math.random()*2))%houses.length;
    focusT=20+Math.random()*20;
  }
  for(var i=0;i<houses.length;i++){
    var h=houses[i];
    var focused=(i===focusIdx);
    var boost=(i===pressedHouse)?2.2:(focused?1.6:1);
    for(var j=0;j<h.lights.length;j++){
      var L=h.lights[j];
      L.ph+=dt*(focused?1.6:1)*boost*0.9;
      // drift toward waypoint; on arrival pick a new one inside the house
      var dx=L.tx-L.x, dy=L.ty-L.y, d=Math.sqrt(dx*dx+dy*dy);
      var speed=(14+Math.random()*0)*boost; // px/s, gentle
      if(d<4){
        L.tx=h.x+h.w*(0.15+Math.random()*0.7);
        L.ty=(h.y+h.h)-(h.h)*(0.15+Math.random()*0.7);
      }else{
        L.x+=dx/d*speed*dt*3;
        L.y+=dy/d*speed*dt*3;
      }
      // clamp inside house
      L.x=Math.max(h.x+6,Math.min(h.x+h.w-6,L.x));
      L.y=Math.max(h.y+h.roof+6,Math.min(h.y+h.h-6,L.y));
      if(dragLight===L){
        // dragged light follows pointer within its house
        L.x=Math.max(h.x+6,Math.min(h.x+h.w-6,dragLight.px));
        L.y=Math.max(h.y+h.roof+6,Math.min(h.y+h.h-6,dragLight.py));
        L.tx=L.x; L.ty=L.y;
      }
    }
  }
}
function drawHouse(h,i){
  var focused=(i===focusIdx);
  var pressed=(i===pressedHouse);
  var bright=pressed?1.0:(focused?0.85:0.55);
  // outline: rect + pitched roof, no doors, no windows
  ctx.strokeStyle=OUTLINE;
  ctx.globalAlpha=bright;
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(h.x,h.y+h.h);
  ctx.lineTo(h.x,h.y+h.roof);
  ctx.lineTo(h.x+h.w/2,h.y);
  ctx.lineTo(h.x+h.w,h.y+h.roof);
  ctx.lineTo(h.x+h.w,h.y+h.h);
  ctx.closePath();
  ctx.stroke();
  ctx.globalAlpha=1;
  // focus glow
  if(focused||pressed){
    var g=ctx.createRadialGradient(h.x+h.w/2,h.y+h.h/2,10,h.x+h.w/2,h.y+h.h/2,h.w*0.9);
    g.addColorStop(0,'rgba(232,176,75,'+(pressed?0.14:0.08)+')');
    g.addColorStop(1,'rgba(232,176,75,0)');
    ctx.fillStyle=g;
    ctx.fillRect(h.x-h.w*0.4,h.y-h.roof-h.w*0.4,h.w*1.8,h.h+h.roof+h.w*0.8);
  }
  // light-marks
  for(var j=0;j<h.lights.length;j++){
    var L=h.lights[j];
    var col=L.cool?TEAL:L.col;
    var a=(focused||pressed)?0.95:0.6;
    ctx.save();
    ctx.globalAlpha=a;
    ctx.fillStyle=col;
    ctx.strokeStyle=col;
    if(L.type==='dot'){
      // a dot that drifts room to room
      ctx.beginPath(); ctx.arc(L.x,L.y,3.5,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=a*0.25;
      ctx.beginPath(); ctx.arc(L.x,L.y,9,0,Math.PI*2); ctx.fill();
    }else if(L.type==='rocker'){
      // a short line that rocks like a chair
      var ang=Math.sin(L.ph)*0.5;
      ctx.lineWidth=2.5; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(L.x-Math.cos(ang)*9,L.y-Math.sin(ang)*9);
      ctx.lineTo(L.x+Math.cos(ang)*9,L.y+Math.sin(ang)*9);
      ctx.stroke();
    }else{
      // a tiny circle that pulses
      var r=3+Math.sin(L.ph*2)*1.6;
      ctx.beginPath(); ctx.arc(L.x,L.y,Math.max(1.5,r),0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=a*0.2;
      ctx.beginPath(); ctx.arc(L.x,L.y,Math.max(3,r+5),0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}
function draw(){
  ctx.fillStyle=FIELD;
  ctx.fillRect(0,0,W,H);
  for(var i=0;i<houses.length;i++) drawHouse(houses[i],i);
}
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  step(dt); draw();
  requestAnimationFrame(frame);
}
// interaction: press a house to brighten it; drag a light-mark within its house
function pickHouse(px,py){
  for(var i=0;i<houses.length;i++){
    var h=houses[i];
    if(px>=h.x&&px<=h.x+h.w&&py>=h.y&&py<=h.y+h.h) return i;
  }
  return -1;
}
function pickLight(px,py){
  for(var i=0;i<houses.length;i++){
    var h=houses[i];
    for(var j=0;j<h.lights.length;j++){
      var L=h.lights[j];
      var dx=L.x-px, dy=L.y-py;
      if(dx*dx+dy*dy<16*16) return L;
    }
  }
  return null;
}
cv.addEventListener('pointerdown',function(e){
  var L=pickLight(e.clientX,e.clientY);
  if(L){ dragLight=L; dragLight.px=e.clientX; dragLight.py=e.clientY; return; }
  var hi=pickHouse(e.clientX,e.clientY);
  if(hi>=0) pressedHouse=hi;
});
window.addEventListener('pointermove',function(e){
  if(dragLight){ dragLight.px=e.clientX; dragLight.py=e.clientY; }
});
window.addEventListener('pointerup',function(){ pressedHouse=-1; dragLight=null; });
window.addEventListener('pointercancel',function(){ pressedHouse=-1; dragLight=null; });
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',function(){last=performance.now();});
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
