<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1940 Three Ecologies</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1712; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Three Ecologies, KD5 / PP1187, study #253 kit-downes.
  // Three bands alive at once, each with its own instrument rules and
  // its own visual grammar. Parallelism, not fusion: a bleed that
  // crosses a border is re-dressed in the neighbor's grammar.
  var BONE = '#e8e2d4';    // shared border lines, thin bone
  var INK = '#e8e2d4';     // plate ink, bone white
  var INK_DIM = '#b9b2a2'; // muted ink

  // Left, ENEMY: piano bass drums, grunge black and white, blunt.
  var L_BG = '#141414';
  var L_PAPER = '#f2f2ef';
  var L_GREY = '#8a8a86';
  var L_DARK = '#000000';
  // Center, Deadeye: Hammond organ trio, double exposure, smoky sepia.
  var C_BG0 = '#8a6a48';
  var C_BG1 = '#5d4128';
  var C_SMOKE = '#d9c1a3';
  var C_DARK = '#3a2a1c';
  var C_LIGHT = '#e8d5b5';
  // Right, Exhaust: drums reeds, archival paperwork, stamps, type.
  var R_BG = '#d8c8a2';
  var R_INK = '#2b2620';
  var R_STAMP = '#7a3b2e';
  var R_RULE = '#8a7a5c';

  // Fixed-phase first frame: FIRST_T = 12 s. At t = 12 the left to
  // center bleed started at t = 6 is three quarters across its border
  // and the center to right bleed started at t = 10 is a quarter
  // across, so frame one shows all three panels distinct and alive
  // with bleed streaks already crossing both borders.
  var FIRST_T = 12;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the piece
  // number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Seeded scatter, fixed at load: grunge splatter left, stamp slots
  // right, smoke anchor points center. Nothing here depends on t.
  var SPLATTER = [];
  var TYPE_ROWS = [];
  var SMOKE_SEED = [];
  (function buildSeeded() {
    var rng = mulberry32(1940);
    var i;
    for (i = 0; i < 46; i++) {
      SPLATTER.push({ x: rng(), y: rng(), r: 0.6 + rng() * 2.6, a: 0.15 + rng() * 0.55, w: rng() < 0.5 });
    }
    for (i = 0; i < 5; i++) {
      var dashes = [];
      var j;
      for (j = 0; j < 26; j++) { dashes.push(0.35 + rng() * 0.65); }
      TYPE_ROWS.push({ y: 0.18 + i * 0.13, dashes: dashes, gap: 0.02 + rng() * 0.02 });
    }
    for (i = 0; i < 3; i++) {
      SMOKE_SEED.push({ x: 0.2 + rng() * 0.6, y: 0.15 + rng() * 0.6, ph: rng() * Math.PI * 2, sp: 0.5 + rng() * 0.6 });
    }
  })();

  // Spontaneous bleed schedule. Each event crosses one border over
  // 8 seconds, then fades over 2. Sources cycle so every border is
  // crossed in both directions over time. At FIRST_T = 12 the first
  // two events are mid-crossing.
  var EVENTS = [
    { start: 6,  src: 0, dst: 1, kind: 'bar',   y: 0.42 },
    { start: 10, src: 1, dst: 2, kind: 'smoke', y: 0.62 },
    { start: 18, src: 2, dst: 1, kind: 'stamp', y: 0.30 },
    { start: 26, src: 1, dst: 0, kind: 'smoke', y: 0.55 },
    { start: 34, src: 0, dst: 1, kind: 'bar',   y: 0.70 },
    { start: 42, src: 2, dst: 1, kind: 'stamp', y: 0.48 },
    { start: 50, src: 1, dst: 2, kind: 'smoke', y: 0.24 }
  ];
  var BLEED_DUR = 8, BLEED_FADE = 2;

  // Drag-forced bleeds, created when a drag crosses a border.
  var forced = [];

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var dragging = false;
  var dragStartPanel = -1, dragStartX = 0, dragY = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // Layout, recomputed in resize() and read by draw().
  var L = {};
  function layout() {
    var headerH = Math.round(H * 0.095);
    var hintH = Math.round(H * 0.055);
    var panelY0 = headerH + 6;
    var panelY1 = H - hintH - 8;
    var panelW = W / 3;
    L = {
      headerH: headerH, hintH: hintH,
      panelY0: panelY0, panelY1: panelY1, panelW: panelW,
      panelH: panelY1 - panelY0
    };
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
    layout();
  }

  function panelX(i) { return i * L.panelW; }
  function panelAt(x) { return clamp(Math.floor(x / L.panelW), 0, 2); }
  function kindOf(panel) { return panel === 0 ? 'bar' : (panel === 1 ? 'smoke' : 'stamp'); }
  function borderX(a, b) { return Math.max(a, b) * L.panelW; }

  // A torn paper rectangle: a filled polygon with seeded jagged edges.
  function tornRect(x, y, w, h, seed, fill) {
    var rng = mulberry32(seed);
    var jx = function () { return (rng() - 0.5) * w * 0.06; };
    var jy = function () { return (rng() - 0.5) * h * 0.10; };
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x + jx(), y + jy());
    ctx.lineTo(x + w * 0.33 + jx(), y + jy());
    ctx.lineTo(x + w * 0.66 + jx(), y + jy());
    ctx.lineTo(x + w + jx(), y + jy());
    ctx.lineTo(x + w + jx(), y + h * 0.5 + jy());
    ctx.lineTo(x + w + jx(), y + h + jy());
    ctx.lineTo(x + w * 0.66 + jx(), y + h + jy());
    ctx.lineTo(x + w * 0.33 + jx(), y + h + jy());
    ctx.lineTo(x + jx(), y + h + jy());
    ctx.lineTo(x + jx(), y + h * 0.5 + jy());
    ctx.closePath();
    ctx.fill();
  }

  // ---- Left panel: ENEMY. Grunge black and white, blunt.
  // Clock: tL runs at 0.9x, bass pulse at 0.5 Hz, piano bars step
  // every 2 s. Everything blunt, high contrast, no soft edges.
  function drawLeft(t) {
    var x0 = panelX(0), x1 = panelX(1);
    var y0 = L.panelY0, y1 = L.panelY1, pw = x1 - x0, ph = y1 - y0;
    var tL = t * 0.9;
    ctx.fillStyle = L_BG;
    ctx.fillRect(x0, y0, pw, ph);

    // Torn white blocks, the grunge typography: abstract type marks,
    // no legible words.
    tornRect(x0 + pw * 0.08, y0 + ph * 0.16, pw * 0.55, ph * 0.10, 194001, L_PAPER);
    tornRect(x0 + pw * 0.22, y0 + ph * 0.30, pw * 0.68, ph * 0.07, 194002, hexA(L_PAPER, 0.85));
    tornRect(x0 + pw * 0.10, y0 + ph * 0.40, pw * 0.40, ph * 0.12, 194003, hexA(L_PAPER, 0.7));

    // Piano bars: vertical black and white keys stepping every 2 s.
    var step = Math.floor(tL / 2);
    var i;
    for (i = 0; i < 7; i++) {
      var on = ((step + i * 3) % 5) < 3;
      var bx = x0 + pw * 0.06 + i * pw * 0.13;
      var bh = ph * (0.07 + 0.025 * ((i * 7 + step) % 4));
      ctx.fillStyle = on ? L_PAPER : L_GREY;
      ctx.fillRect(bx, y0 + ph * 0.56, pw * 0.09, bh);
    }

    // Bass drum pulse: a blunt ring that swells at 0.5 Hz.
    var pulse = 0.5 + 0.5 * Math.sin(tL * Math.PI);
    var cx = x0 + pw * 0.30, cy = y0 + ph * 0.84;
    var r = pw * (0.10 + 0.05 * pulse);
    ctx.fillStyle = L_PAPER;
    ctx.beginPath(); ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = L_BG;
    ctx.beginPath(); ctx.moveTo(cx + r * 0.55, cy); ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(L_PAPER, a4(0.5 + 0.4 * pulse));
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx + r * 1.35, cy); ctx.arc(cx, cy, r * 1.35, 0, Math.PI * 2); ctx.stroke();

    // Grunge splatter, seeded and still.
    for (i = 0; i < SPLATTER.length; i++) {
      var s = SPLATTER[i];
      ctx.fillStyle = s.w ? hexA(L_PAPER, a4(s.a)) : hexA(L_GREY, a4(s.a));
      ctx.beginPath(); ctx.moveTo(x0 + s.x * pw + s.r, y0 + s.y * ph); ctx.arc(x0 + s.x * pw, y0 + s.y * ph, s.r, 0, Math.PI * 2); ctx.fill();
    }

    // Abstract type lines: short thick bars, like a torn headline.
    ctx.fillStyle = hexA(L_PAPER, 0.9);
    for (i = 0; i < 4; i++) {
      var ty = y0 + ph * (0.62 + i * 0.035);
      ctx.fillRect(x0 + pw * 0.62, ty, pw * (0.28 - i * 0.04), 3);
    }
  }

  // ---- Center panel: Deadeye. Sepia smoke, double exposure.
  // Clock: tC runs at 0.55x, the slowest ecology. Two translucent
  // exposures drift over each other; smoke curls breathe slowly.
  function drawCenter(t) {
    var x0 = panelX(1), x1 = panelX(2);
    var y0 = L.panelY0, y1 = L.panelY1, pw = x1 - x0, ph = y1 - y0;
    var tC = t * 0.55;
    var grad = ctx.createLinearGradient(x0, y0, x0, y1);
    grad.addColorStop(0, C_BG0);
    grad.addColorStop(1, C_BG1);
    ctx.fillStyle = grad;
    ctx.fillRect(x0, y0, pw, ph);

    // Double exposure: two large translucent discs drifting slowly.
    var i;
    for (i = 0; i < 2; i++) {
      var ex = x0 + pw * (0.35 + 0.3 * i) + Math.sin(tC * 0.35 + i * 2.1) * pw * 0.08;
      var ey = y0 + ph * (0.38 + 0.18 * i) + Math.cos(tC * 0.28 + i * 1.4) * ph * 0.06;
      var er = pw * (0.34 + 0.05 * Math.sin(tC * 0.5 + i));
      ctx.fillStyle = hexA(C_LIGHT, a4(0.16));
      ctx.beginPath(); ctx.moveTo(ex + er, ey); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
      // A dark organ-pipe silhouette inside each exposure.
      ctx.fillStyle = hexA(C_DARK, a4(0.35));
      ctx.fillRect(ex - pw * 0.05, ey - er * 0.7, pw * 0.03, er * 1.4);
      ctx.fillRect(ex + pw * 0.02, ey - er * 0.55, pw * 0.03, er * 1.1);
    }

    // Hammond trio: three pipes swaying at the organ's slow clock.
    for (i = 0; i < 3; i++) {
      var px = x0 + pw * (0.22 + i * 0.28);
      var sway = Math.sin(tC * 0.8 + i * 1.1) * ph * 0.02;
      var phgt = ph * (0.34 - i * 0.05) + sway;
      ctx.fillStyle = hexA(C_DARK, a4(0.55));
      ctx.fillRect(px, y0 + ph * 0.62 - phgt, pw * 0.09, phgt);
      ctx.fillStyle = hexA(C_SMOKE, a4(0.5));
      ctx.fillRect(px, y0 + ph * 0.62 - phgt, pw * 0.09, 3);
    }

    // Smoke curls: slow bezier wisps, each on its own phase.
    ctx.lineWidth = Math.max(1.5, pw * 0.008);
    for (i = 0; i < SMOKE_SEED.length; i++) {
      var sm = SMOKE_SEED[i];
      var sx = x0 + sm.x * pw + Math.sin(tC * sm.sp + sm.ph) * pw * 0.06;
      var sy = y0 + sm.y * ph + Math.cos(tC * sm.sp * 0.7 + sm.ph) * ph * 0.04;
      var curl = Math.sin(tC * 0.4 + sm.ph) * pw * 0.10;
      ctx.strokeStyle = hexA(C_SMOKE, a4(0.45));
      ctx.beginPath();
      ctx.moveTo(sx - pw * 0.16, sy + ph * 0.10);
      ctx.bezierCurveTo(sx - pw * 0.10 + curl, sy - ph * 0.02, sx + pw * 0.10 - curl, sy + ph * 0.02, sx + pw * 0.16, sy - ph * 0.08);
      ctx.stroke();
      ctx.strokeStyle = hexA(C_LIGHT, a4(0.25));
      ctx.beginPath();
      ctx.moveTo(sx - pw * 0.12, sy + ph * 0.16);
      ctx.bezierCurveTo(sx - pw * 0.06 + curl * 0.6, sy + ph * 0.04, sx + pw * 0.06 - curl * 0.6, sy + ph * 0.08, sx + pw * 0.12, sy - ph * 0.02);
      ctx.stroke();
    }
  }

  // ---- Right panel: Exhaust. Archival paperwork, stamps, type.
  // Clock: tR runs at 1.3x, the fastest ecology. Ruled paper, rows
  // of typewriter dashes, ink stamps that slowly rotate and fade.
  function drawRight(t) {
    var x0 = panelX(2), x1 = panelX(3);
    var y0 = L.panelY0, y1 = L.panelY1, pw = x1 - x0, ph = y1 - y0;
    var tR = t * 1.3;
    ctx.fillStyle = R_BG;
    ctx.fillRect(x0, y0, pw, ph);

    // Ruled lines.
    ctx.strokeStyle = hexA(R_RULE, a4(0.35));
    ctx.lineWidth = 1;
    ctx.beginPath();
    var i, ry;
    for (i = 0; i < 12; i++) {
      ry = y0 + ph * 0.06 + i * ph * 0.075;
      ctx.moveTo(x0 + pw * 0.05, ry);
      ctx.lineTo(x1 - pw * 0.05, ry);
    }
    ctx.stroke();

    // Typewriter rows: abstract dashes, no legible words.
    var r;
    for (r = 0; r < TYPE_ROWS.length; r++) {
      var row = TYPE_ROWS[r];
      var tx = x0 + pw * 0.07;
      var ty = y0 + row.y * ph;
      ctx.fillStyle = hexA(R_INK, a4(0.75));
      for (i = 0; i < row.dashes.length; i++) {
        var dw = row.dashes[i] * pw * 0.028;
        ctx.fillRect(tx, ty, dw, 2.5);
        tx += dw + pw * 0.008;
        if (tx > x1 - pw * 0.08) { break; }
      }
    }

    // Ink stamps: rotated double-border rectangles, slowly turning.
    var stamps = [
      { x: 0.52, y: 0.30, w: 0.62, h: 0.16, a: -0.16 },
      { x: 0.48, y: 0.68, w: 0.52, h: 0.13, a: 0.12 }
    ];
    for (i = 0; i < stamps.length; i++) {
      var st = stamps[i];
      var fade = 0.55 + 0.25 * Math.sin(tR * 0.5 + i * 2.4);
      var scx = x0 + st.x * pw, scy = y0 + st.y * ph;
      var sw = st.w * pw, sh = st.h * ph;
      ctx.save();
      ctx.translate(scx, scy);
      ctx.rotate(st.a + Math.sin(tR * 0.3 + i) * 0.03);
      ctx.strokeStyle = hexA(R_STAMP, a4(fade));
      ctx.lineWidth = 2;
      ctx.strokeRect(-sw / 2, -sh / 2, sw, sh);
      ctx.lineWidth = 1;
      ctx.strokeRect(-sw / 2 + 5, -sh / 2 + 5, sw - 10, sh - 10);
      // Stamp innards: abstract bars, not words.
      ctx.fillStyle = hexA(R_STAMP, a4(fade * 0.8));
      ctx.fillRect(-sw / 2 + 10, -sh / 2 + 9, sw * 0.5, 3);
      ctx.fillRect(-sw / 2 + 10, sh / 2 - 12, sw * 0.35, 3);
      ctx.restore();
    }

    // Coffee ring, archival wear.
    ctx.strokeStyle = hexA(R_STAMP, a4(0.22));
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0 + pw * 0.78 + pw * 0.14, y0 + ph * 0.88); ctx.arc(x0 + pw * 0.78, y0 + ph * 0.88, pw * 0.14, 0, Math.PI * 2); ctx.stroke();
  }

  // ---- Bleeds. A streak crossing a border: the source side is drawn
  // in the source ecology's grammar, the target side is re-dressed in
  // the neighbor's grammar. Same element, two grammars.
  function drawBleedSegment(panel, x0, x1, y, h, alpha, kind) {
    if (x1 <= x0 || alpha <= 0.01) { return; }
    var w = x1 - x0, cx = (x0 + x1) / 2;
    if (panel === 0) {
      // Blunt: a solid block, white when the source was a bar, black
      // with a white edge otherwise.
      ctx.fillStyle = kind === 'bar' ? hexA(L_PAPER, a4(alpha)) : hexA(L_DARK, a4(alpha));
      ctx.fillRect(x0, y - h / 2, w, h);
      ctx.strokeStyle = hexA(L_PAPER, a4(alpha * 0.8));
      ctx.lineWidth = 1;
      ctx.strokeRect(x0, y - h / 2, w, h);
    } else if (panel === 1) {
      // Smoke: a translucent sepia puff with a wisp.
      ctx.fillStyle = hexA(C_SMOKE, a4(alpha * 0.55));
      ctx.beginPath(); ctx.moveTo(cx + w / 2, y); ctx.arc(cx, y, Math.max(h * 0.7, w * 0.32), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = hexA(C_LIGHT, a4(alpha * 0.6));
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x0, y + h * 0.3);
      ctx.bezierCurveTo(cx - w * 0.2, y - h * 0.6, cx + w * 0.2, y + h * 0.6, x1, y - h * 0.3);
      ctx.stroke();
    } else {
      // Stamp: a small ink double-border mark, re-dressed as paperwork.
      ctx.strokeStyle = hexA(R_STAMP, a4(alpha));
      ctx.lineWidth = 2;
      ctx.strokeRect(x0 + 2, y - h / 2, w - 4, h);
      ctx.lineWidth = 1;
      ctx.strokeRect(x0 + 6, y - h / 2 + 3, Math.max(2, w - 12), h - 6);
      ctx.fillStyle = hexA(R_INK, a4(alpha * 0.8));
      ctx.fillRect(x0 + 8, y - 1.5, Math.max(2, w * 0.4), 3);
    }
  }

  function drawBleed(b, t) {
    var p = clamp((t - b.start) / BLEED_DUR, 0, 1);
    var alpha = 1;
    if (p >= 1) {
      alpha = 1 - clamp((t - b.start - BLEED_DUR) / BLEED_FADE, 0, 1);
      p = 1;
    }
    if (alpha <= 0.01) { return; }
    var bx = borderX(b.src, b.dst);
    var y = L.panelY0 + b.y * L.panelH;
    var len = Math.max(30, L.panelW * 0.42);
    var half = 6 + len * p;
    var h = Math.max(8, L.panelH * 0.022);
    // Source side, source grammar.
    drawBleedSegment(b.src, bx - half, bx, y, h, alpha, b.kind);
    // Target side, re-dressed in the neighbor's grammar.
    drawBleedSegment(b.dst, bx, bx + half, y, h, alpha, b.kind);
    // The crossing point itself, a thin bone tick on the border.
    ctx.fillStyle = hexA(BONE, a4(alpha));
    ctx.fillRect(bx - 1, y - h, 2, h * 2);
  }

  function activeBleeds(t) {
    var out = [];
    var i;
    for (i = 0; i < EVENTS.length; i++) {
      var ev = EVENTS[i];
      if (t >= ev.start && t <= ev.start + BLEED_DUR + BLEED_FADE) {
        out.push({ src: ev.src, dst: ev.dst, kind: ev.kind, y: ev.y, start: ev.start });
      }
    }
    for (i = 0; i < forced.length; i++) {
      var f = forced[i];
      if (t <= f.start + BLEED_DUR + BLEED_FADE) { out.push(f); }
    }
    return out;
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = '#1a1712';
    ctx.fillRect(0, 0, W, H);

    // ---- Plates: title top-left, number and date top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsLabel = Math.round(15 * clamp(W / 560, 0.85, 1.1));
    var fsSmall = Math.round(fsLabel * 0.72);
    var fsTick = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Three Ecologies', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1940 · 2007 · 05 · 05', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(INK, 0.6);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('three bands, three grammars, one border', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.textAlign = 'left';

    // ---- The three panels, each on its own clock.
    drawLeft(t);
    drawCenter(t);
    drawRight(t);

    // ---- Panel labels, inside each panel's top edge.
    var labels = [
      { name: 'ENEMY', sub: 'piano · bass · drums', color: L_PAPER },
      { name: 'Deadeye', sub: 'Hammond organ trio', color: C_LIGHT },
      { name: 'Exhaust', sub: 'drums · reeds', color: R_INK }
    ];
    var i;
    for (i = 0; i < 3; i++) {
      var lx = panelX(i) + 12;
      var ly = L.panelY0 + 10;
      ctx.fillStyle = labels[i].color;
      ctx.font = '600 ' + fsLabel + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(labels[i].name, lx, ly + fsLabel);
      ctx.fillStyle = labels[i].color === R_INK ? hexA(R_INK, 0.7) : hexA(labels[i].color, 0.7);
      ctx.font = fsSmall + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(labels[i].sub, lx, ly + fsLabel + fsSmall + 6);
    }

    // ---- Bleeds cross the borders after the panels are drawn.
    var bleeds = activeBleeds(t);
    for (i = 0; i < bleeds.length; i++) { drawBleed(bleeds[i], t); }

    // ---- Shared border lines in thin bone, over the panels.
    ctx.fillStyle = BONE;
    ctx.fillRect(panelX(1) - 1, L.panelY0, 2, L.panelH);
    ctx.fillRect(panelX(2) - 1, L.panelY0, 2, L.panelH);
    // Outer frame, same bone.
    ctx.strokeStyle = hexA(BONE, 0.9);
    ctx.lineWidth = 2;
    ctx.strokeRect(1, L.panelY0, W - 2, L.panelH);

    // ---- Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fsTick * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag across a border to force a bleed.', W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function perfT() { return lastT; }

  // Drag: the cross-contamination. A drag that crosses a border
  // forces a bleed from the panel it started in into the neighbor,
  // re-dressed in the neighbor's grammar. Chaining across the second
  // border starts a second bleed from the middle panel onward.
  function forceBleed(src, dst, yFrac, t) {
    forced.push({ src: src, dst: dst, kind: kindOf(src), y: clamp(yFrac, 0.06, 0.94), start: t });
    if (forced.length > 12) { forced.shift(); }
  }
  function dragTo(clientX, clientY) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var x = clientX - rect.left;
    var y = clientY - rect.top;
    var cur = panelAt(x);
    if (dragging && cur !== dragStartPanel) {
      var src = dragStartPanel, dst = cur;
      // Only adjacent panels share a border.
      if (Math.abs(dst - src) === 1) {
        forceBleed(src, dst, (y - L.panelY0) / L.panelH, perfT());
      }
      dragStartPanel = cur;
      dragStartX = x;
    }
    dragY = y;
    draw(reduced ? FIRST_T : perfT());
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      var rect = { left: 0, top: 0 };
      try { rect = canvas.getBoundingClientRect(); } catch (e2) {}
      dragStartX = e.clientX - rect.left;
      dragStartPanel = panelAt(dragStartX);
      dragY = e.clientY - rect.top;
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (dragging) { dragTo(e.clientX, e.clientY); }
    });
    window.addEventListener('pointerup', function () { dragging = false; });
    window.addEventListener('pointercancel', function () { dragging = false; });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA probe hook: lets the node probe read the live bleed list, force
  // a bleed, and redraw at a chosen t without a browser.
  try {
    window.__piece1940 = {
      bleeds: function (t) { return activeBleeds(typeof t === 'number' ? t : lastT); },
      forceBleed: forceBleed,
      redraw: function (t) { draw(t); },
      panelAt: panelAt,
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: each panel breathes on its own slow clock, all motion
  // under 1 Hz, well under the 14 Hz ceiling. Guarded so node-canvas
  // QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
