<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good People</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2E8D8; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var ASH = '#C9A97E';
  var GRAIN_DARK = '#8A6A42';
  var FLOOR = '#D8CBB4';
  var SHADOW = '#6B5D4A';
  var HEART = '#E91E63';
  var WALL = '#F2E8D8';
  var BEVEL_LIGHT = '#E8D3AC';

  // Ring slots: "good people" as 11 slots, slot 4 is the word gap.
  var SLOTS = ['g', 'o', 'o', 'd', null, 'p', 'e', 'o', 'p', 'l', 'e'];
  var LETTER_SLOTS = [0, 1, 2, 3, 5, 6, 7, 8, 9, 10];

  // Interaction state, all closed-form functions of recorded events and t.
  var dragSessions = [];   // {endT, deltaPx}
  var dragActive = false;
  var dragStartX = 0;
  var dragSessionDelta = 0;
  var dragDownT = 0;
  var lastTapT = -1;
  var reseedEvents = [];   // {t, idx}
  var reseedCount = 0;

  function heartSlotAt(t) {
    var idx = 0;
    for (var i = 0; i < reseedEvents.length; i++) {
      if (reseedEvents[i].t <= t) idx = reseedEvents[i].idx;
    }
    var rng = mulberry32(1323000 + idx * 7919);
    return LETTER_SLOTS[Math.floor(rng() * LETTER_SLOTS.length)];
  }

  function orbitOffset(t) {
    var off = dragActive ? dragSessionDelta : 0;
    for (var i = 0; i < dragSessions.length; i++) {
      var s = dragSessions[i];
      var age = t - s.endT;
      off += (age <= 0) ? s.deltaPx : s.deltaPx * Math.exp(-age / 2.5);
    }
    return off * 0.004;
  }

  function viewportSize() {
    var w, h;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      w = visualViewport.width; h = visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: w, h: h };
  }

  function sizeCanvas() {
    var s = viewportSize();
    canvas.width = Math.max(1, Math.round(s.w));
    canvas.height = Math.max(1, Math.round(s.h));
    canvas.style.width = Math.round(s.w) + 'px';
    canvas.style.height = Math.round(s.h) + 'px';
  }

  function isPhone() {
    var minDim = 1e9;
    try {
      if (window.screen) {
        minDim = Math.min(window.screen.width, window.screen.height);
      }
    } catch (e) { /* fall through to aspect check */ }
    if (minDim < 700) return true;
    var s = viewportSize();
    return s.h > s.w * 1.15;
  }

  function drawHeart(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.32);
    ctx.bezierCurveTo(x - s * 0.55, y - s * 0.18, x - s * 0.28, y - s * 0.55, x, y - s * 0.18);
    ctx.bezierCurveTo(x + s * 0.28, y - s * 0.55, x + s * 0.55, y - s * 0.18, x, y + s * 0.32);
    ctx.closePath();
    ctx.fillStyle = HEART;
    ctx.fill();
  }

  function draw(t) {
    var W = canvas.width, H = canvas.height;
    var S = Math.min(W, H);
    var ox = (W - S) / 2, oy = (H - S) / 2;
    var cx = W / 2;
    var cy = oy + S * 0.47;
    var Rx = S * 0.36, Ry = S * 0.19;
    var floorTop = oy + S * (2 / 3);
    var theta = (Math.PI * 2) * (t / 90) + orbitOffset(t);
    var heartSlot = heartSlotAt(t);

    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Letters are drawn back to front. Background and shadows are painted
    // afterwards with destination-over so grain (source-atop) only ever
    // touches letter ink, never the wall or floor.
    var order = [];
    for (var i = 0; i < SLOTS.length; i++) order.push(i);
    order.sort(function (a, b) {
      var sa = Math.sin(a * (Math.PI * 2 / SLOTS.length) + theta);
      var sb = Math.sin(b * (Math.PI * 2 / SLOTS.length) + theta);
      return sa - sb;
    });

    var grainRng = mulberry32(1323000);
    var letterGeom = {};
    for (var k = 0; k < order.length; k++) {
      var slot = order[k];
      var ch = SLOTS[slot];
      if (ch === null) continue;
      var a = slot * (Math.PI * 2 / SLOTS.length) + theta;
      var depth = (Math.sin(a) + 1) / 2; // 0 back, 1 front
      var scale = 0.82 + 0.18 * depth;
      var size = S * 0.115 * scale;
      var x = cx + Rx * Math.cos(a);
      var y = cy + Ry * Math.sin(a);
      letterGeom[slot] = { x: x, y: y, size: size, a: a, depth: depth };
      var font = '900 ' + Math.round(size) + 'px "Arial Black", "Liberation Sans", "DejaVu Sans", sans-serif';
      ctx.font = font;

      // Extrusion: grain-dark copy offset down-right = the monolith side.
      ctx.fillStyle = GRAIN_DARK;
      ctx.fillText(ch, x + size * 0.055, y + size * 0.075);
      // Main ash face, per-letter tone from the seeded stream.
      var tone = 0.92 + grainRng() * 0.16;
      ctx.fillStyle = shadeAsh(tone);
      ctx.fillText(ch, x, y);
      // Bevel edge highlight.
      ctx.strokeStyle = BEVEL_LIGHT;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = Math.max(1, size * 0.022);
      ctx.lineJoin = 'round';
      ctx.strokeText(ch, x, y);
      ctx.globalAlpha = 1;
      // Wood grain: wavy lines clipped to the letter box, source-atop so
      // they only land on ink already on the canvas.
      ctx.save();
      ctx.beginPath();
      ctx.rect(x - size * 0.62, y - size * 0.62, size * 1.24, size * 1.24);
      ctx.clip();
      ctx.globalCompositeOperation = 'source-atop';
      ctx.strokeStyle = GRAIN_DARK;
      ctx.lineWidth = Math.max(1, size * 0.014);
      for (var g = 0; g < 9; g++) {
        var gy = y - size * 0.5 + (g + grainRng() * 0.6) * (size / 9);
        ctx.globalAlpha = 0.10 + grainRng() * 0.12;
        ctx.beginPath();
        ctx.moveTo(x - size * 0.58, gy);
        ctx.bezierCurveTo(
          x - size * 0.2, gy + (grainRng() - 0.5) * size * 0.06,
          x + size * 0.2, gy + (grainRng() - 0.5) * size * 0.06,
          x + size * 0.58, gy);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;

      // The single pink heart, engraved on the flank of one letter,
      // visible only while that letter rides the front of the ring.
      if (slot === heartSlot && Math.sin(a) > 0.3) {
        drawHeart(x + size * 0.52, y + size * 0.10, size * 0.30);
      }
    }

    // Long soft shadows, behind the letters, across the floor only.
    ctx.globalCompositeOperation = 'destination-over';
    ctx.save();
    ctx.beginPath();
    ctx.rect(ox, floorTop, S, oy + S - floorTop);
    ctx.clip();
    for (var s2 = 0; s2 < order.length; s2++) {
      var g2 = letterGeom[order[s2]];
      if (!g2) continue;
      ctx.fillStyle = SHADOW;
      ctx.globalAlpha = 0.22;
      ctx.beginPath();
      ctx.moveTo(g2.x - g2.size * 0.45, g2.y + g2.size * 0.55);
      ctx.lineTo(g2.x + g2.size * 0.75, g2.y + g2.size * 0.55);
      ctx.lineTo(g2.x + g2.size * 1.15, g2.y + g2.size * 0.85);
      ctx.lineTo(g2.x - g2.size * 0.05, g2.y + g2.size * 0.85);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    // Gallery: warm wall everywhere, floor across the lower third.
    ctx.fillStyle = FLOOR;
    ctx.fillRect(ox, floorTop, S, oy + S - floorTop);
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, floorTop);
    ctx.fillRect(0, floorTop, ox, oy + S - floorTop);
    ctx.fillRect(ox + S, floorTop, W - (ox + S), oy + S - floorTop);
    ctx.fillRect(0, oy + S, W, H - (oy + S));
    ctx.globalCompositeOperation = 'source-over';
  }

  function shadeAsh(tone) {
    // Scale the ash base color by a seeded tone factor.
    var r = Math.round(201 * tone), g = Math.round(169 * tone), b = Math.round(126 * tone);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // Pointer: drag orbits the ring; a double-tap reseeds the heart letter.
  function onDown(e) {
    dragActive = true;
    dragStartX = e.clientX;
    dragSessionDelta = 0;
    dragDownT = currentT;
  }
  function onMove(e) {
    if (!dragActive) return;
    dragSessionDelta += (e.clientX - dragStartX);
    dragStartX = e.clientX;
  }
  function onUp(e) {
    if (!dragActive) return;
    dragActive = false;
    var moved = Math.abs(dragSessionDelta);
    dragSessions.push({ endT: currentT, deltaPx: dragSessionDelta });
    dragSessionDelta = 0;
    if (moved < 8 && (currentT - dragDownT) < 0.6) {
      if (lastTapT >= 0 && (currentT - lastTapT) < 0.4) {
        reseedCount++;
        reseedEvents.push({ t: currentT, idx: reseedCount });
        lastTapT = -1;
      } else {
        lastTapT = currentT;
      }
    }
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  var currentT = 0;
  var startT = 0;
  var started = false;

  function loop(now) {
    if (!started) { startT = now; started = true; }
    currentT = (now - startT) / 1000;
    draw(currentT);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }

  function onResize() {
    sizeCanvas();
    draw(currentT);
  }
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  sizeCanvas();
  // Frame one: exactly t = 0, drawn synchronously at load. The clock
  // starts only with the rAF loop.
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
  // Touch the phone helper so the detection path stays wired.
  void isPhone();
})();
</script>
</body>
</html>
