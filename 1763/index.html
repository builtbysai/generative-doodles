<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skylark Archive</title>
<style>
html, body { margin: 0; padding: 0; background: #D8D5CE; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#D8D5CE';
var PEAT = '#33291D';
var PEAT_DARK = '#241C13';
var PEAT_LINE = 'rgba(232,226,213,0.35)';
var INK = [27, 27, 27];
var SILVER = [176, 176, 180];
var AMBER = [198, 152, 92];
var TITLE_INK = '#E8E2D5';
var SUB_INK = '#C9BFA9';
var FRAME_T = 60.0;
var CYCLE = 120.0;
var N_TRACES = 24;
var N_FINAL = 3;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smoothstep(a, b, x) {
  var u = clamp((x - a) / (b - a), 0, 1);
  return u * u * (3 - 2 * u);
}
function mix(a, b, u) { return a + (b - a) * u; }
function rgbMix(c1, c2, u, a) {
  var r = Math.round(mix(c1[0], c2[0], u));
  var g = Math.round(mix(c1[1], c2[1], u));
  var b = Math.round(mix(c1[2], c2[2], u));
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(4) + ')';
}
/* Seeded RNG only: every trace parameter is fixed at load, so frame
   one is byte-reproducible. No Date.now(), no unseeded Math.random(). */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- driver: an archival countdown written in ascent. A pale sky
   holds thin song traces that spiral upward from a dark peat margin.
   Over one long cycle the population thins, one trace at a time, and
   the last three climb higher and warm to amber before fading; then
   the archive reseeds and the count rises again. ---- */
var rng = mulberry32(1763);
var TRACES = [];
(function buildTraces() {
  var i, j, tmp;
  /* Stratified origins, seeded-shuffled so the three final traces
     land at scattered points instead of bunching at one edge. */
  var xs = [];
  for (i = 0; i < N_TRACES; i++) xs.push((i + 0.15 + 0.7 * rng()) / N_TRACES);
  for (i = N_TRACES - 1; i > 0; i--) {
    j = Math.floor(rng() * (i + 1));
    tmp = xs[i]; xs[i] = xs[j]; xs[j] = tmp;
  }
  for (i = 0; i < N_TRACES; i++) {
    var isFinal = i >= N_TRACES - N_FINAL;
    TRACES.push({
      x0: 0.04 + 0.92 * xs[i],
      amp: 0.012 + 0.022 * rng(),
      amp2: 0.004 + 0.006 * rng(),
      freq: 2.4 + 2.6 * rng(),
      freq2: 6.0 + 5.0 * rng(),
      ph: TAU * rng(),
      ph2: TAU * rng(),
      riseDur: 9 + 7 * rng(),
      birth: i * 0.35,
      heightFrac: 0.55 + 0.30 * rng(),
      drop: isFinal ? Infinity : 12 + i * 4.6,
      isFinal: isFinal
    });
  }
})();
function cycleT(t) {
  var c = t % CYCLE;
  return c < 0 ? c + CYCLE : c;
}
/* Population at cycle time c: traces whose drop time has not passed.
   24 at the start, 13 at frame one (t = 60), 3 alone from t = 104. */
function population(c) {
  var n = 0, i;
  for (i = 0; i < N_TRACES; i++) {
    if (c < TRACES[i].drop) n++;
  }
  return n;
}
/* Per-trace visibility envelope: fades in after birth, fades out
   across the 2 s before its drop, final traces fade out 116-120 s
   as the cycle closes, everything reseeds at the wrap. */
function traceAlpha(tr, c) {
  var a = 1;
  if (c < tr.birth) return 0;
  if (c < tr.birth + 1.5) a = smoothstep(tr.birth, tr.birth + 1.5, c);
  if (tr.drop !== Infinity) {
    if (c >= tr.drop) return 0;
    if (c >= tr.drop - 2) a = Math.min(a, 1 - (c - (tr.drop - 2)) / 2);
  } else if (c >= 116) {
    a = Math.min(a, 1 - (c - 116) / 4);
  }
  return a;
}
/* Climb height: base fraction of the sky, stretched as the
   population thins, final traces stretched further still. */
function traceHeight(tr, c, pop) {
  var skyH = VH - marginH();
  var stretch = 1 + 0.30 * (1 - pop / N_TRACES);
  if (tr.isFinal) stretch *= 1.22;
  var rise = smoothstep(tr.birth, tr.birth + tr.riseDur, c);
  var h = tr.heightFrac * skyH * stretch * rise;
  return Math.min(h, skyH * 0.97);
}
function marginH() {
  return Math.max(0.07 * VH, isPhone ? 56 : 48);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function drawPlates() {
  var mh = marginH();
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Skylark Archive').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Skylark Archive').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 09').width;
  var blockW = Math.max(titleW, dateW);
  var blockH = titlePx + smallPx + 6;
  var bx = 14, by = VH - mh + (mh - blockH) / 2;
  ctx.fillStyle = PEAT_DARK;
  ctx.fillRect(bx - 6, by - 5, blockW + 12, blockH + 10);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Skylark Archive', bx, by);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = SUB_INK;
  ctx.fillText('2006 · 11 · 09', bx, by + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hx = VW - hintW - 14, hy = VH - mh + (mh - smallPx) / 2;
  ctx.fillStyle = PEAT_DARK;
  ctx.fillRect(hx - 8, hy - 6, hintW + 16, smallPx + 12);
  ctx.fillStyle = SUB_INK;
  ctx.fillText(hint, hx, hy);
}
function drawTrace(tr, t, c, pop) {
  var env = traceAlpha(tr, c);
  if (env <= 0.001) return;
  var s = Math.min(VW, VH);
  var mh = marginH();
  var horizon = VH - mh;
  var h = traceHeight(tr, c, pop);
  if (h < 4) return;
  var x0 = tr.x0 * VW;
  var amp = tr.amp * s * (1 + 0.08 * Math.sin(t * 0.11 + tr.ph));
  var amp2 = tr.amp2 * s;
  var warm = tr.isFinal ? 0.55 + 0.45 * (1 - pop / N_TRACES) : 0;
  var step = 4;
  var y, u, x, px, py;
  var first = true;
  ctx.lineWidth = clamp(0.002 * s, 1, 2);
  ctx.lineCap = 'round';
  for (y = 0; y <= h; y += step) {
    u = y / h;
    var sway = Math.sin(TAU * tr.freq * u + tr.ph + t * 0.05);
    var curl = Math.sin(TAU * tr.freq2 * u + tr.ph2 + t * 0.09);
    var grow = 0.35 + 0.65 * u;
    x = x0 + amp * grow * sway + amp2 * grow * curl;
    var yy = horizon - y;
    if (first) { px = x; py = yy; first = false; continue; }
    var midU = (u + (y - step) / h) / 2;
    var a = env * (0.85 * (1 - midU) + 0.05);
    var col;
    if (tr.isFinal) {
      col = rgbMix(INK, AMBER, warm * (0.35 + 0.65 * midU), a);
    } else {
      col = rgbMix(INK, SILVER, midU, a);
    }
    ctx.strokeStyle = col;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(x, yy);
    ctx.stroke();
    px = x; py = yy;
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var mh = marginH();
  var t = phaseT;
  var c = cycleT(t);
  var pop = population(c);
  var i;
  for (i = 0; i < N_TRACES; i++) drawTrace(TRACES[i], t, c, pop);
  /* dark peat margin band and horizon rule */
  ctx.fillStyle = PEAT;
  ctx.fillRect(0, VH - mh, VW, mh);
  ctx.fillStyle = PEAT_LINE;
  ctx.fillRect(0, VH - mh, VW, 1);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    population: function (t) { return population(cycleT(t)); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, population 13 of 24,
   visibly thinned, final traces amber and climbing high ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
