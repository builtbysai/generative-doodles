<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kündekâri Wings</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E0E10; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
var pieces = [];
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// Kündekâri: wooden pieces locked into each other with no nails.
// Eight-pointed stars on a square lattice, strap pieces bridging them
// horizontally and vertically, small diamonds closing the diagonal
// gaps. Every piece is flat wood in two tones; what moves is the
// light. Each piece carries a slight tilt, and its lit value is the
// dot of that tilt against the orbiting light azimuth, so shadows
// swing through the joints as the light goes around.
function starPts(cx, cy, Rc) {
  var pts = [], k, a, r;
  for (k = 0; k < 16; k++) {
    a = k * Math.PI / 8;
    r = (k % 2 === 0) ? Rc : Rc * 0.7654;
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return pts;
}
function hexPts(cx, cy, len, wid, vert) {
  var hl = len / 2, hw = wid / 2, pts = [];
  var raw = [[-hl + wid * 0.45, -hw], [hl - wid * 0.45, -hw], [hl, 0],
             [hl - wid * 0.45, hw], [-hl + wid * 0.45, hw], [-hl, 0]];
  raw.forEach(function (p) { pts.push(vert ? [cx + p[1], cy + p[0]] : [cx + p[0], cy + p[1]]); });
  return pts;
}
function diaPts(cx, cy, r) {
  return [[cx + r, cy], [cx, cy + r], [cx - r, cy], [cx, cy - r]];
}
function build() {
  pieces = [];
  if (!W || !H) return;
  var L = Math.min(W, H) / (PHONE ? 2.6 : 3.4);
  var Rc = L * 0.335;
  var i, j, ni = Math.ceil(W / L) + 2, nj = Math.ceil(H / L) + 2;
  for (i = -1; i < ni; i++) for (j = -1; j < nj; j++) {
    var x = i * L + L * 0.5, y = j * L + L * 0.5, id = (i + 9) * 131 + (j + 9) * 17;
    pieces.push({ pts: diaPts(x + L / 2, y + L / 2, L * 0.155), tilt: [0.3, -0.3], mag: 0.35, c: [x + L / 2, y + L / 2] });
    pieces.push({ pts: hexPts(x + L / 2, y, L * 0.66, L * 0.24, false), tilt: [0, (hash(id + 1) > 0.5 ? 0.55 : -0.55)], mag: 0.6, c: [x + L / 2, y] });
    pieces.push({ pts: hexPts(x, y + L / 2, L * 0.66, L * 0.24, true), tilt: [(hash(id + 2) > 0.5 ? 0.55 : -0.55), 0], mag: 0.6, c: [x, y + L / 2] });
    pieces.push({ pts: starPts(x, y, Rc),
                  tilt: [(hash(id + 3) - 0.5) * 0.9, (hash(id + 4) - 0.5) * 0.9], mag: 0.85, c: [x, y] });
  }
  pieces.L = L;
}
function fillPts(pts) {
  ctx.beginPath();
  pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
  ctx.closePath(); ctx.fill();
}
function strokePts(pts) {
  ctx.beginPath();
  pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
  ctx.closePath(); ctx.stroke();
}

var LOOP = 28, OFFSET = 5;   // light already a quarter turned at frame one
function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#0E0E10'; ctx.fillRect(0, 0, W, H);
  if (!pieces.length) return;
  var t = ((now / 1000 + OFFSET) % LOOP + LOOP) % LOOP;
  var orbit = Math.min(t, 22) / 22;             // 22s of orbit, 6s of hold
  var az = orbit * Math.PI * 2 - Math.PI * 0.35;
  var lx = Math.cos(az), ly = Math.sin(az);
  // the joint the light is visiting: a focal point travelling with it
  var fx = W / 2 + Math.cos(az * 0.999) * Math.min(W, H) * 0.31;
  var fy = H / 2 + Math.sin(az * 0.999) * Math.min(W, H) * 0.31;
  var hot = -1, hotD = Infinity;
  pieces.forEach(function (p, i) {
    var d = Math.hypot(p.c[0] - fx, p.c[1] - fy);
    if (d < hotD) { hotD = d; hot = i; }
  });
  pieces.forEach(function (p, i) {
    var tl = Math.hypot(p.tilt[0], p.tilt[1]) || 1;
    var dot = (p.tilt[0] / tl) * lx + (p.tilt[1] / tl) * ly;
    var b = clamp01(0.30 + 0.62 * (0.5 + 0.5 * dot) * p.mag + 0.30 * (1 - p.mag));
    if (i === hot) b = Math.min(1, b + 0.38);    // one joint catches the light
    ctx.fillStyle = '#5A3A20';
    fillPts(p.pts);
    if (b > 0.01) { ctx.globalAlpha = b; ctx.fillStyle = '#8A5A33'; fillPts(p.pts); ctx.globalAlpha = 1; }
    ctx.strokeStyle = (i === hot) ? '#8A5A33' : '#2E1F14';
    ctx.lineWidth = (i === hot) ? 2.2 : Math.max(1.4, pieces.L * 0.016);
    strokePts(p.pts);
  });
}

resize();
draw(0);
function frame(ts) {
  draw(ts || 0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
