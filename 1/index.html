<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№1 · Vortex</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0d0b14; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,234,210,0.40); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another vortex</div>
<script>
'use strict';
// No1 Vortex.
// A flow field with three to five vortex attractors, drawn in short
// rounded capsules instead of lines: each capsule is one step of a
// particle along the field, tangent to the flow, colored from a neon
// ramp (magenta, gold, cream, violet) by the speed it was moving. Where
// the field bends hard, small dots are stippled along the turn. The
// capsules read as stitched thread on near-black. Composition is
// measured: seeds are kept only when the speed spread is wide, so the
// field has both still water and fast water in it.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '1', 10) || 1;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0d0b14';
const RAMP = ['#8a6cff', '#ff3ea5', '#ffc94d', '#f5ead2']; // violet, magenta, gold, cream

function compose(s) {
  const rnd = mulberry32(s);
  const K = 3 + ((rnd() * 3) | 0);
  const vort = [];
  for (let i = 0; i < K; i++) {
    vort.push({
      x: 0.12 + rnd() * 0.76, y: 0.12 + rnd() * 0.76,
      str: (0.10 + rnd() * 0.22) * (rnd() < 0.5 ? -1 : 1),
      rad: 0.10 + rnd() * 0.15
    });
  }
  return { vort, drift: (rnd() - 0.5) * 0.05, swirl: (rnd() - 0.5) * 0.22 };
}

// Velocity at (x, y): tangential flow around each vortex, Gaussian falloff.
function velocity(p, x, y) {
  let vx = p.drift, vy = 0;
  // Weak global swirl so no region is dead still.
  vx += -(y - 0.5) * p.swirl;
  vy += (x - 0.5) * p.swirl;
  for (const v of p.vort) {
    const dx = x - v.x, dy = y - v.y;
    const d2 = dx * dx + dy * dy;
    const f = v.str * Math.exp(-d2 / (2 * v.rad * v.rad)) / (0.30 + Math.sqrt(d2));
    vx += -dy * f;
    vy += dx * f;
  }
  return [vx, vy];
}

function measure(p) {
  const rnd = mulberry32(1234567);
  let fast = 0, n = 0, sum = 0;
  for (let i = 0; i < 400; i++) {
    const [vx, vy] = velocity(p, rnd(), rnd());
    const sp = Math.hypot(vx, vy);
    sum += sp;
    if (sp > 0.55) fast++;
    n++;
  }
  return { mean: sum / n, fastFrac: fast / n };
}

function buildPiece(baseSeed) {
  let best = null, bestScore = -1;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    const m = measure(p);
    const score = m.fastFrac + m.mean;
    if (score > bestScore) { bestScore = score; best = p; }
    if (m.fastFrac > 0.05 && m.mean > 0.10) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const rnd = mulberry32((seed ^ 0x2b7e15) >>> 0);
  const unit = Math.min(RX, RY);
  ctx.lineCap = 'round';
  const CAPS = 3200;
  for (let i = 0; i < CAPS; i++) {
    const x = rnd(), y = rnd();
    const [vx, vy] = velocity(p, x, y);
    const sp = Math.hypot(vx, vy);
    if (sp < 0.004) continue;
    const lenPx = (0.006 + Math.min(0.020, sp * 0.020)) * unit;
    const ux = vx / sp, uy = vy / sp;
    const ci = Math.max(0, Math.min(RAMP.length - 1, Math.floor(Math.pow(Math.min(1, sp / 0.5), 0.6) * 3.99)));
    ctx.strokeStyle = RAMP[ci];
    ctx.globalAlpha = 0.55 + Math.min(0.45, sp * 0.5);
    ctx.lineWidth = Math.max(1.1, unit / 340);
    const px = ox + x * RX, py = oy + y * RY;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + ux * lenPx, py + uy * lenPx);
    ctx.stroke();
    // Dotted accent where the field bends: sample a point just ahead.
    const [vx2, vy2] = velocity(p, x + ux * 0.01, y + uy * 0.01);
    const turn = Math.abs(Math.atan2(vy2, vx2) - Math.atan2(vy, vx));
    if (turn > 0.55 && rnd() < 0.5) {
      ctx.fillStyle = '#f5ead2';
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(px + ux * lenPx, py + uy * lenPx, Math.max(0.7, unit / 720), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
