<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.408 Sleeve</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5E9D0; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.408 Sleeve (nina-clausonet, EXPANSION #43).
// After Nina Clausonet's commercial motif-field
// packaging (MyMuesli limited edition, WRAPPR Regal
// Collection): a tall product sleeve, like a muesli
// tube, wrapped in her flat illustration - deep navy
// ground tossed with coral tulips, cream stars,
// orange wheat stalks and small stylised women, a
// bold typography band across the middle, and a few
// motifs escaped into the cream margin around it.
// The prompt's offscreen motif strip takes the house
// treatment (the No.398 precedent): the field is a
// FIXED SCATTER TABLE drawn directly on the one
// canvas every frame, and the cylinder wrap is a
// sinusoidal x-offset applied mathematically to each
// motif - angle around the tube, x from the sine of
// that angle, horizontal squeeze from its cosine, so
// motifs compress as they round the edges. Two table
// layers turn at different rates for parallax. The
// prompt's double-tap reseed takes the fixed authored
// table treatment (the No.394/No.403 precedent):
// exactly 3 authored scatter variants, same lexicon,
// new arrangement, dealt in order and wrapping -
// nothing is random at runtime. DRAG horizontally
// rotates the sleeve: the field scrolls and squeezes,
// the whole sleeve tilts and shears a little, and
// the title band's letters squeeze slowest so the
// band stays readable longest; on release a spring
// eases the rotation back and snaps to exactly the
// resting angle. The band reads the piece title in
// flat geometric letter PATHS - filled bars and
// polygons, never font text; it is the only lettering
// in the piece. Ambient 20s loop: exactly 8 margin
// motifs, 4 of them drifting slowly upward like
// released seeds and fading, on whole cycles of the
// loop. Grain is her heavy paper grain as DATA:
// exactly 700 fixed speckle dots drawn in table order
// every frame, never a texture or filter. Frame one
// is drawn at the constant phase T = 6.5s (sleeve at
// rest, field complete, drifters mid-rise); the clock
// is anchored there and advances in fixed 1/60 ticks,
// never from a wall clock. Flat colour only, one
// canvas, no offscreen canvas, no gradients, no
// shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Sleeve navy; motifs cream, coral, orange, pink;
// margin cream. Nothing else.
var NAVY = '#1B2A5B';
var CREAM = '#F5E9D0', CORAL = '#F26B4F', ORANGE = '#F5A623', PINK = '#F2A0C0';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 20;
if (LOOP !== 20) throw new Error('Sleeve ambient loop must be 20s');
var TICK = 1 / 60;

// ---- sleeve geometry ------------------------------------
var SX = 440, SY = 52, SW = 400, SH = 796, SR = 46;
var SCX = SX + SW / 2, SCY = SY + SH / 2;
var REST_TILT = -0.02;
var CIRC = 680; // tube circumference in strip units

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
function makeRng(seedStart) {
  var s = seedStart;
  return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// The motif lexicon, in the prompt's own terms. One
// pattern cycle of 8 holds tulip 2, star 2, wheat 2,
// woman 1, dot 1; 8 cycles make exactly 64 motifs per
// variant. u is strip position around the tube, y is
// design height, rate is the parallax layer (0.8 back,
// 1.0 front), r a fixed tossed rotation.
var PATTERN = ['tulip', 'star', 'woman', 'wheat', 'dot', 'star', 'tulip', 'wheat'];
var KINDCOUNT = { tulip: 16, star: 16, wheat: 16, woman: 8, dot: 8 };
function buildVariant(v) {
  var rng = makeRng(4080 + v * 137);
  // Stratified strip positions, shuffled by the seed:
  // the 64 slots divide the tube evenly, so the tossed
  // field covers like printed packaging wrap instead
  // of clumping by chance.
  var slots = [];
  for (var si = 0; si < 64; si++) slots.push(si);
  for (var sj = 63; sj > 0; sj--) {
    var sk = Math.floor(rng() * (sj + 1));
    var st = slots[sj]; slots[sj] = slots[sk]; slots[sk] = st;
  }
  var table = [];
  for (var i = 0; i < 64; i++) {
    var kind = PATTERN[i % 8];
    table.push({
      kind: kind,
      u: (slots[i] + 0.15 + rng() * 0.7) * (CIRC / 64),
      y: 88 + rng() * 724,
      s: kind === 'dot' ? 1 : 0.95 + rng() * 0.6,
      r: (rng() - 0.5) * 0.9,
      rate: i % 2 === 0 ? 0.8 : 1.0,
      tone: rng()
    });
  }
  if (table.length !== 64) throw new Error('variant ' + v + ' must hold exactly 64 motifs');
  var counts = { tulip: 0, star: 0, wheat: 0, woman: 0, dot: 0 };
  for (var j = 0; j < table.length; j++) counts[table[j].kind]++;
  for (var k in KINDCOUNT) {
    if (counts[k] !== KINDCOUNT[k]) throw new Error('variant ' + v + ' ' + k + ' count');
  }
  return table;
}
// The fixed authored table of 3 scatter variants.
var VARIANTS = [buildVariant(0), buildVariant(1), buildVariant(2)];
if (VARIANTS.length !== 3) throw new Error('scatter table must hold exactly 3 variants');

// Margin motifs: exactly 8 escaped onto the cream.
// Four of them (drift: true) rise and fade on whole
// cycles of the 20s loop; the other four sit still.
var MARGIN = [
  { kind: 'tulip', x: 238, y: 176, s: 1.15, r: -0.15, drift: false },
  { kind: 'star',  x: 1052, y: 150, s: 1.10, r: 0.20, drift: true, k: 1, ph: 0.15 },
  { kind: 'wheat', x: 178, y: 636, s: 1.20, r: 0.10, drift: false },
  { kind: 'woman', x: 1086, y: 556, s: 1.10, r: 0.00, drift: true, k: 2, ph: 0.45 },
  { kind: 'star',  x: 302, y: 428, s: 0.95, r: -0.30, drift: true, k: 1, ph: 0.60 },
  { kind: 'tulip', x: 982, y: 762, s: 1.05, r: 0.25, drift: false },
  { kind: 'wheat', x: 1122, y: 330, s: 1.00, r: -0.20, drift: true, k: 2, ph: 0.80 },
  { kind: 'woman', x: 148, y: 330, s: 1.00, r: 0.00, drift: false }
];
if (MARGIN.length !== 8) throw new Error('margin motifs must be exactly 8');
var drifters = 0;
for (var mi = 0; mi < MARGIN.length; mi++) if (MARGIN[mi].drift) drifters++;
if (drifters !== 4) throw new Error('exactly 4 margin motifs drift');

// Paper grain: exactly 700 fixed speckle dots over the
// whole design field, drawn last, in this order.
var rngGrain = makeRng(408);
var GRAIN = [];
for (var gi = 0; gi < 700; gi++) {
  GRAIN.push({ x: rngGrain() * DW, y: rngGrain() * DH, r: 0.8 + rngGrain() * 1.4, coral: rngGrain() < 0.3 });
}
if (GRAIN.length !== 700) throw new Error('grain count');

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellA(x, y, rx, ry, rot, color, alpha) {
  ctx.globalAlpha = alpha;
  ell(x, y, rx, ry, rot, color);
  ctx.globalAlpha = 1;
}
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function poly(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}
function starPath(cx, cy, rO, rI, rot) {
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var r = i % 2 === 0 ? rO : rI;
    var a = rot + i * Math.PI / 5 - Math.PI / 2;
    var X = cx + Math.cos(a) * r, Y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rrPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ---- motif recipes (local coords, centred on 0,0) ------
// tone selects a variant colour inside the palette.
function drawMotif(kind, tone) {
  if (kind === 'tulip') {
    seg(0, 2, 1, 17, 3.2, ORANGE);
    ell(6, 10, 7, 3, 0.6, ORANGE);
    poly(CORAL, [-10, -4, -10, -16, -4, -9, 0, -18, 4, -9, 10, -16, 10, -4, 6, 3, -6, 3]);
  } else if (kind === 'star') {
    starPath(0, 0, 15, 6.8, 0);
    ctx.fillStyle = CREAM; ctx.fill();
  } else if (kind === 'wheat') {
    seg(0, 17, 0, -13, 3, ORANGE);
    seg(-1, -12, -6, -21, 1.8, ORANGE);
    seg(1, -12, 6, -21, 1.8, ORANGE);
    for (var g = 0; g < 4; g++) {
      var gy = -10 + g * 7;
      ell(-6.5, gy, 7.5, 3.2, 0.8, ORANGE);
      ell(6.5, gy, 7.5, 3.2, -0.8, ORANGE);
    }
    ell(0, -13, 3.2, 6, 0, ORANGE);
  } else if (kind === 'woman') {
    var dress = tone < 0.5 ? PINK : CORAL;
    ell(0, -23, 4, 4, 0, PINK);
    ell(0, -15, 6.5, 6.5, 0, CREAM);
    poly(dress, [-4, -9, 4, -9, 14, 19, -14, 19]);
    ell(-9, 0, 3, 7.5, 0.5, dress);
    ell(9, 0, 3, 7.5, -0.5, dress);
    seg(-4, 19, -4, 25, 3.4, CREAM);
    seg(4, 19, 4, 25, 3.4, CREAM);
  } else { // dot
    ell(0, 0, 4.2, 4.2, 0, tone < 0.5 ? CREAM : PINK);
  }
}

// Margin motifs wear margin colours: a cream star would
// vanish on the cream ground, so stars go coral there.
function drawMarginMotif(m) {
  if (m.kind === 'star') {
    starPath(0, 0, 16, 7.2, 0);
    ctx.fillStyle = CORAL; ctx.fill();
  } else {
    drawMotif(m.kind, 0.25);
  }
}

// ---- the title band: SLEEVE in flat geometric paths -----
// Letters are filled bars and polygons on a 64-tall
// grid, thickness 13. No font text anywhere.
function bar(x, y, w, h) { ctx.fillRect(x, y, w, h); }
function letterPath(ch, x, y) {
  if (ch === 'S') {
    bar(x, y, 44, 13); bar(x, y + 26, 44, 12); bar(x, y + 51, 44, 13);
    bar(x, y, 13, 32); bar(x + 31, y + 26, 13, 38);
  } else if (ch === 'L') {
    bar(x, y, 13, 64); bar(x, y + 51, 40, 13);
  } else if (ch === 'E') {
    bar(x, y, 13, 64);
    bar(x, y, 42, 13); bar(x, y + 26, 36, 12); bar(x, y + 51, 42, 13);
  } else if (ch === 'V') {
    poly(CREAM, [x, y, x + 14, y, x + 24, y + 46, x + 34, y, x + 48, y, x + 26, y + 64, x + 22, y + 64]);
  }
}
var BAND_WORD = 'SLEEVE';
var BAND_LW = [44, 40, 42, 48, 42, 42]; // S L E V E E advance widths
function drawBand(squeeze) {
  // Coral band across the middle, over the field.
  ctx.fillStyle = CORAL;
  ctx.fillRect(SX, 404, SW, 92);
  var total = 0, i;
  for (i = 0; i < BAND_LW.length; i++) total += BAND_LW[i] + 14;
  total -= 14;
  ctx.save();
  ctx.translate(SCX, 450);
  ctx.scale(squeeze, 1);
  ctx.translate(-SCX, -450);
  ctx.fillStyle = CREAM;
  var lx = SCX - total / 2;
  for (i = 0; i < BAND_WORD.length; i++) {
    letterPath(BAND_WORD[i], lx, 418);
    lx += BAND_LW[i] + 14;
  }
  ctx.restore();
}

// ---- piece state ----------------------------------------
// Constant first-frame phase: T = 6.5s into the 20s
// loop (drifters mid-rise and mid-fade, sleeve at
// rest, first scatter variant complete).
var T = 6.5;
var lastNow = -1, acc = 0;
var variant = 0;
var rot = 0, rotV = 0, rotTarget = 0;

// Optional QA probe hooks via the query string the
// house renderer passes as ?seed=... : var=N starts
// on scatter variant N, tilt=1 starts mid-drag at
// rot 0.65. Deterministic; default play is unaffected
// (variant 1, at rest).
var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
var vm = /var=(\d)/.exec(qs);
if (vm) variant = clamp(parseInt(vm[1], 10), 0, 2);
if (/tilt=1/.test(qs)) { rot = 0.65; rotTarget = 0.65; }

function step() {
  // Rotation spring; on release the target is 0 and
  // the spring snaps to exactly the resting rotation.
  rotV += ((rotTarget - rot) * 130 - rotV * 15) * TICK;
  rot += rotV * TICK;
  if (rotTarget === 0 && Math.abs(rot) < 0.0004 && Math.abs(rotV) < 0.004) { rot = 0; rotV = 0; }
}

function drawScene(lt) {
  // Page ground: margin cream, everywhere.
  ctx.fillStyle = CREAM;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);

  // Margin motifs, behind the sleeve.
  for (var i = 0; i < MARGIN.length; i++) {
    var m = MARGIN[i];
    var mx = m.x, my = m.y, ma = 1;
    if (m.drift) {
      var fr = (lt * m.k / LOOP + m.ph) % 1;
      my = m.y - fr * 130;
      mx = m.x + Math.sin(Math.PI * 2 * m.k * lt / LOOP + m.ph * 6) * 7;
      ma = Math.sin(Math.PI * fr);
    }
    ctx.save();
    ctx.globalAlpha = ma;
    ctx.translate(mx, my);
    ctx.rotate(m.r);
    ctx.scale(m.s, m.s);
    drawMarginMotif(m);
    ctx.restore();
  }

  // The sleeve, tilted as a group: resting tilt plus
  // the drag rotation and a slight shear.
  ctx.save();
  ctx.translate(SCX, SCY);
  ctx.rotate(REST_TILT + rot * 0.12);
  ctx.transform(1, 0, rot * 0.15, 1, 0, 0);
  ctx.translate(-SCX, -SCY);

  rrPath(SX, SY, SW, SH, SR);
  ctx.fillStyle = NAVY;
  ctx.fill();

  ctx.save();
  rrPath(SX, SY, SW, SH, SR);
  ctx.clip();

  // The motif field, back layer first for parallax.
  // Each motif rides the tube: its angle comes from
  // its strip position plus the rotation phase for its
  // layer; x is the sine of the angle, squeeze its
  // cosine. Back-half motifs are not drawn.
  var table = VARIANTS[variant];
  var phase = rot * 340;
  for (var pass = 0; pass < 2; pass++) {
    var rate = pass === 0 ? 0.8 : 1.0;
    for (var j = 0; j < table.length; j++) {
      var mo = table[j];
      if (mo.rate !== rate) continue;
      var sPos = (mo.u + phase * rate) % CIRC;
      if (sPos < 0) sPos += CIRC;
      var th = sPos / CIRC * Math.PI * 2;
      var cz = Math.cos(th);
      if (cz <= 0.02) continue;
      var fx = SCX + Math.sin(th) * 206;
      ctx.save();
      ctx.translate(fx, mo.y);
      ctx.scale(cz * mo.s, mo.s);
      ctx.rotate(mo.r);
      drawMotif(mo.kind, mo.tone);
      ctx.restore();
    }
  }

  // Stepped flat falloff bands at both edges, so the
  // tube reads round. Flat alpha steps, not a gradient.
  ctx.fillStyle = NAVY;
  var bands = [[26, 0.16], [18, 0.10], [12, 0.05]];
  var bd = 0;
  for (var b = 0; b < bands.length; b++) {
    ctx.globalAlpha = bands[b][1];
    ctx.fillRect(SX + bd, SY, bands[b][0], SH);
    ctx.fillRect(SX + SW - bd - bands[b][0], SY, bands[b][0], SH);
    bd += bands[b][0];
  }
  ctx.globalAlpha = 1;

  // The title band stays readable longest: its letters
  // squeeze with the cosine of the rotation, far
  // slower than the field's edge compression.
  drawBand(Math.max(0.8, Math.cos(rot * 0.8)));

  ctx.restore(); // sleeve clip
  ctx.restore(); // sleeve group

  // Paper grain over all, fixed table order.
  for (var g2 = 0; g2 < GRAIN.length; g2++) {
    var gd = GRAIN[g2];
    if (gd.coral) ellA(gd.x, gd.y, gd.r, gd.r, 0, CORAL, 0.06);
    else ellA(gd.x, gd.y, gd.r, gd.r, 0, NAVY, 0.05);
  }
}

function draw() { drawScene(T % LOOP); }

// ---- pointer: drag rotates, double-tap re-scatters ------
// A tap is a press and release close together in design
// space. Two taps within 0.4s of the piece clock
// advance the scatter variant. A horizontal drag
// rotates the sleeve; on release the spring eases it
// back to exactly the resting angle. The piece never
// reloads.
var downX = -1, downY = -1, downT = 0, lastTapT = -10, dragging = false;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T; dragging = false;
});
canvas.addEventListener('pointermove', function (e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  if (Math.sqrt(dx * dx + dy * dy) > 6) dragging = true;
  if (dragging) rotTarget = clamp((p.x - downX) / 300, -1, 1);
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  var wasDrag = dragging || moved >= 28;
  downX = -1; dragging = false; rotTarget = 0;
  if (wasDrag || held >= 0.8) return;
  if (T - lastTapT < 0.4) {
    lastTapT = -10;
    variant = (variant + 1) % VARIANTS.length;
  } else {
    lastTapT = T;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; dragging = false; rotTarget = 0; });

// ---- sizing: centred fit, page ground = margin cream ---
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
