<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>One Year Project</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0C; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- №1222 "One Year Project" — Clint Enns study block CE7 ----
  // A photo a day for a leap year: 366 generated "found photographs" in a
  // strict grid, each one damaged the way a real camera roll is damaged —
  // flash blowouts, red-eye, crooked horizons, thumbs over lenses — and each
  // one carrying its timestamp burned in, camera-LCD green. Even a perfect
  // migration of decaying media leaves artifacts; here the artifacts are the
  // point. One day is highlighted, advancing one day every ten seconds.
  // Press and hold a day to open it full-frame. Drag to scrub the year.
  // The grid is always the piece; there is no slideshow mode.

  var T0 = 23;               // fixed phase of the synchronous first frame (s)
  var DAYS = 366;            // 2004, a leap year
  var H0 = 72;               // initial highlight offset: frame one lands on day index 74

  var BG = '#0A0A0C';
  var BORDER = '#2A2A2E';
  var LCD = '#33FF66';
  var AMBER = '#FFC53D';
  var SPARE = '#101014';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;

  function isPhone(w, h) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return sw < 700 || h > w * 1.15;
  }

  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawCurrent() { draw(tNow()); }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); drawCurrent(); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); drawCurrent(); });
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---- seeded rng (mulberry32): every photograph derives from it ----
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- dates: real day-of-year math across leap-year 2004 ----
  var MONTH_DAYS = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  var MONTH_NAMES = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE',
                     'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dateOf(d) {                       // d is 0-based day index
    var rem = d, m = 0;
    while (rem >= MONTH_DAYS[m]) { rem -= MONTH_DAYS[m]; m++; }
    return { month: m + 1, day: rem + 1 };
  }

  // ---- the year's photographs: per-day shape specs, computed once ----
  // Scenes live in unit coordinates (0..1 x 0..1) so the same photograph can
  // be drawn at grid size or full-frame size. Flat shapes only.
  var PHOTO = ['#8A7F72', '#A39B8B', '#6E7B6A', '#7C8B99', '#B0A58F',
               '#5D6650', '#94867A', '#77828C', '#A8A29A', '#6B5D54'];
  var SKYT = ['#9DB4C0', '#B7C3C9', '#8FA6B5'];
  var DARKT = '#33302B';

  function daySpec(d) {
    var r = mulberry32(90210 + d * 104729);
    var s = {};
    s.type = Math.floor(r() * 6);            // 0 wall, 1 sky/roof, 2 table, 3 street, 4 doorway, 5 field
    s.tilt = (r() < 0.38) ? (r() * 2 - 1) * 3 : 0;      // crooked horizon, degrees
    s.a = PHOTO[Math.floor(r() * PHOTO.length)];
    s.b = PHOTO[Math.floor(r() * PHOTO.length)];
    s.c = PHOTO[Math.floor(r() * PHOTO.length)];
    s.sky = SKYT[Math.floor(r() * SKYT.length)];
    s.u1 = r(); s.u2 = r(); s.u3 = r(); s.u4 = r(); s.u5 = r(); s.u6 = r();
    s.person = r() < 0.30;
    s.px = 0.25 + r() * 0.5;                 // person position, unit x
    s.redeye = s.person && r() < 0.5;
    s.blow = r() < 0.22;                     // flash blowout
    s.bx = 0.2 + r() * 0.6; s.by = 0.2 + r() * 0.55; s.br = 0.22 + r() * 0.24;
    s.thumb = r() < 1 / 12;                  // thumb over the lens
    s.tcorner = Math.floor(r() * 4);
    s.hh = Math.floor(r() * 24);
    s.mm = Math.floor(r() * 60);
    var dt = dateOf(d);
    s.stamp = '2004:' + pad2(dt.month) + ':' + pad2(dt.day) + ' ' + pad2(s.hh) + ':' + pad2(s.mm);
    s.dateLine = MONTH_NAMES[dt.month - 1] + ' ' + dt.day + ', 2004 · DAY ' + (d + 1) + ' / 366';
    return s;
  }
  var SPECS = [];
  for (var di = 0; di < DAYS; di++) SPECS.push(daySpec(di));

  // ---- one photograph, drawn at any size ----
  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
  }
  function circ(cx, cy, r) {                 // paired-arc discipline: one arc, own path
    ctx.beginPath();
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawScene(s, x, y, w, h) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    // crooked horizon: rotate the whole exposure a few degrees, drawn
    // oversize underneath so the corners never show through
    ctx.translate(x + w / 2, y + h / 2);
    ctx.rotate(s.tilt * Math.PI / 180);
    ctx.translate(-w / 2, -h / 2);
    var X = function (u) { return u * w * 1.12 - w * 0.06; };
    var Y = function (v) { return v * h * 1.12 - h * 0.06; };
    var UW = w * 1.12, UH = h * 1.12;

    if (s.type === 0) {                      // wall + baseboard
      ctx.fillStyle = s.a; ctx.fillRect(X(0), Y(0), UW, UH);
      ctx.fillStyle = s.b; ctx.fillRect(X(0), Y(0.78), UW, Y(1) - Y(0.78));       // floor
      ctx.fillStyle = DARKT; ctx.fillRect(X(0), Y(0.74), UW, Math.max(1.5, h * 0.02)); // baseboard
      ctx.fillStyle = s.c;                                                        // a hung frame
      ctx.fillRect(X(0.18 + s.u1 * 0.3), Y(0.14), w * (0.2 + s.u2 * 0.14), h * (0.26 + s.u3 * 0.1));
      ctx.fillStyle = s.sky;
      ctx.fillRect(X(0.18 + s.u1 * 0.3) + w * 0.03, Y(0.14) + h * 0.04, w * (0.14 + s.u2 * 0.14), h * (0.18 + s.u3 * 0.1));
      ctx.fillStyle = s.b;                                                        // a stain
      circ(X(0.65 + s.u4 * 0.2), Y(0.4 + s.u5 * 0.2), w * 0.05);
    } else if (s.type === 1) {               // sky + roofline
      ctx.fillStyle = s.sky; ctx.fillRect(X(0), Y(0), UW, UH);
      ctx.fillStyle = '#E8E6DF';                                                  // cloud smudge
      circ(X(0.2 + s.u1 * 0.5), Y(0.18 + s.u2 * 0.12), w * 0.09);
      circ(X(0.3 + s.u1 * 0.5), Y(0.15 + s.u2 * 0.12), w * 0.07);
      ctx.fillStyle = s.a;                                                        // roof
      poly([[X(0), Y(0.72)], [X(0.35 + s.u3 * 0.2), Y(0.5)], [X(1), Y(0.72)], [X(1), Y(1)], [X(0), Y(1)]]);
      ctx.fillStyle = DARKT;                                                      // chimney
      ctx.fillRect(X(0.62 + s.u4 * 0.15), Y(0.42), w * 0.07, h * 0.2);
      ctx.fillStyle = s.c;                                                        // one lit window
      ctx.fillRect(X(0.42 + s.u5 * 0.2), Y(0.8), w * 0.07, h * 0.1);
    } else if (s.type === 2) {               // tabletop edge
      ctx.fillStyle = s.b; ctx.fillRect(X(0), Y(0), UW, UH);                      // wall behind
      ctx.fillStyle = s.a;                                                        // table plane, diagonal
      poly([[X(0), Y(0.45 + s.u1 * 0.1)], [X(1), Y(0.6 + s.u2 * 0.1)], [X(1), Y(1)], [X(0), Y(1)]]);
      ctx.fillStyle = s.c;                                                        // plate
      circ(X(0.3 + s.u3 * 0.3), Y(0.72), w * 0.1);
      ctx.fillStyle = s.b;
      circ(X(0.3 + s.u3 * 0.3), Y(0.72), w * 0.06);
      ctx.fillStyle = DARKT;                                                      // mug
      ctx.fillRect(X(0.6 + s.u4 * 0.2), Y(0.55), w * 0.09, h * 0.14);
    } else if (s.type === 3) {               // street corner
      ctx.fillStyle = s.sky; ctx.fillRect(X(0), Y(0), UW, Y(0.55) - Y(0));
      ctx.fillStyle = s.a;                                                        // building block
      ctx.fillRect(X(0), Y(0.08), w * (0.4 + s.u1 * 0.15), Y(0.62) - Y(0.08));
      ctx.fillStyle = DARKT;                                                      // windows
      for (var wi = 0; wi < 4; wi++) {
        ctx.fillRect(X(0.06 + (wi % 2) * 0.16), Y(0.18 + Math.floor(wi / 2) * 0.2), w * 0.08, h * 0.1);
      }
      ctx.fillStyle = '#55534E';                                                  // road
      ctx.fillRect(X(0), Y(0.62), UW, Y(1) - Y(0.62));
      ctx.fillStyle = '#CFC9B8';                                                  // dashes
      for (var dsh = 0; dsh < 4; dsh++) ctx.fillRect(X(0.08 + dsh * 0.26), Y(0.8), w * 0.12, Math.max(1.5, h * 0.02));
      ctx.fillStyle = DARKT;                                                      // lamp post
      ctx.fillRect(X(0.8), Y(0.3), Math.max(1.5, w * 0.015), Y(0.66) - Y(0.3));
      circ(X(0.8), Y(0.28), w * 0.03);
    } else if (s.type === 4) {               // doorway
      ctx.fillStyle = s.b; ctx.fillRect(X(0), Y(0), UW, UH);                      // dark surround
      ctx.fillStyle = s.a;                                                        // the door, ajar
      poly([[X(0.34), Y(0.06)], [X(0.6 + s.u1 * 0.08), Y(0.12)], [X(0.6 + s.u1 * 0.08), Y(0.98)], [X(0.34), Y(0.98)]]);
      ctx.fillStyle = '#D8CF9F';                                                  // light spill
      poly([[X(0.62 + s.u1 * 0.08), Y(0.12)], [X(0.86), Y(0.3)], [X(0.86), Y(0.98)], [X(0.62 + s.u1 * 0.08), Y(0.98)]]);
      ctx.fillStyle = DARKT;                                                      // knob
      circ(X(0.56 + s.u1 * 0.08), Y(0.55), Math.max(1.2, w * 0.018));
      ctx.fillStyle = s.c;                                                        // step
      ctx.fillRect(X(0.28), Y(0.94), w * 0.5, h * 0.05);
    } else {                                 // field + horizon
      ctx.fillStyle = s.sky; ctx.fillRect(X(0), Y(0), UW, Y(0.52) - Y(0));
      ctx.fillStyle = '#C9A86A';                                                  // low sun blob
      circ(X(0.68 + s.u1 * 0.15), Y(0.3), w * 0.06);
      ctx.fillStyle = s.b;                                                        // field
      ctx.fillRect(X(0), Y(0.52), UW, Y(1) - Y(0.52));
      ctx.fillStyle = DARKT;                                                      // tree
      ctx.fillRect(X(0.16 + s.u2 * 0.1) - w * 0.012, Y(0.34), w * 0.024, Y(0.56) - Y(0.34));
      circ(X(0.16 + s.u2 * 0.1), Y(0.3), w * 0.09);
      ctx.fillStyle = s.c;                                                        // fence dashes
      for (var fi = 0; fi < 5; fi++) ctx.fillRect(X(0.45 + fi * 0.11), Y(0.62), w * 0.05, Math.max(1.5, h * 0.02));
    }

    if (s.person) {                          // a figure, half out of frame as often as not
      var px = X(s.px), py = Y(0.98), ph = h * (0.34 + s.u6 * 0.14);
      ctx.fillStyle = s.c;                                                        // shoulders
      poly([[px - ph * 0.3, py], [px - ph * 0.22, py - ph * 0.45], [px + ph * 0.22, py - ph * 0.45], [px + ph * 0.3, py]]);
      ctx.fillStyle = '#B08A64';                                                  // head
      circ(px, py - ph * 0.62, ph * 0.17);
      if (s.redeye) {                                                             // red-eye
        ctx.fillStyle = '#C81E1E';
        circ(px - ph * 0.06, py - ph * 0.62, Math.max(0.8, ph * 0.028));
        circ(px + ph * 0.06, py - ph * 0.62, Math.max(0.8, ph * 0.028));
      }
    }

    if (s.blow) {                            // flash blowout: a hard white star of polygons
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      var bx = X(s.bx), by = Y(s.by), br = s.br * w;
      var pts = [];
      for (var bi = 0; bi < 8; bi++) {
        var ang = bi * Math.PI / 4 + s.u3;
        var rr = br * (bi % 2 === 0 ? 1 : 0.55);
        pts.push([bx + Math.cos(ang) * rr, by + Math.sin(ang) * rr * 0.8]);
      }
      poly(pts);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      circ(bx, by, br * 0.3);
    }
    ctx.restore();

    if (s.thumb) {                           // thumb over the lens, one corner gone soft and huge
      var tcx = (s.tcorner % 2 === 0) ? x : x + w;
      var tcy = (s.tcorner < 2) ? y : y + h;
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      ctx.fillStyle = '#C68863';
      circ(tcx, tcy, w * 0.34);
      ctx.fillStyle = 'rgba(120,72,44,0.35)';
      circ(tcx, tcy, w * 0.26);
      ctx.restore();
    }
  }

  // ---- time: anchored phase + elapsed; drags move the highlight ----
  function nowMs() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return Date.now();
  }
  var startWall = nowMs();
  function wallNow() { return (nowMs() - startWall) / 1000; }
  function tNow() { return T0 + wallNow(); }

  var scrubCommitted = 0;                    // whole days added by finished drags
  var press = null;                          // {x, y, t, day, dragged, dx}
  var overlayDay = -1;                       // day held open full-frame, or -1

  function highlightAt(t) {
    var h = (H0 + Math.floor(t / 10) + scrubCommitted + (press && press.dragged ? Math.round(press.dx / 24) : 0)) % DAYS;
    return h < 0 ? h + DAYS : h;
  }

  // ---- layout: the grid always fits the viewport ----
  var layout = null;
  function computeLayout() {
    var landscape = W >= H;
    var cols = landscape ? 22 : 14;
    var slots = cols * Math.ceil((DAYS + 8) / cols);
    var rows = Math.ceil(slots / cols);
    while (cols * rows < DAYS) rows++;
    var pad = Math.max(6, Math.min(W, H) * 0.018);
    var gap = Math.max(2, Math.min(W, H) * 0.006);
    var gw = W - pad * 2, gh = H - pad * 2;
    var cw = (gw - gap * (cols - 1)) / cols;
    var ch = (gh - gap * (rows - 1)) / rows;
    layout = { cols: cols, rows: rows, pad: pad, gap: gap, cw: cw, ch: ch };
    return layout;
  }
  function cellRect(i) {
    var L = layout;
    var cx = L.pad + (i % L.cols) * (L.cw + L.gap);
    var cy = L.pad + Math.floor(i / L.cols) * (L.ch + L.gap);
    return [cx, cy, L.cw, L.ch];
  }
  function cellAt(px, py) {
    var L = layout; if (!L) return -1;
    var fx = px - L.pad, fy = py - L.pad;
    if (fx < 0 || fy < 0) return -1;
    var ci = Math.floor(fx / (L.cw + L.gap)), ri = Math.floor(fy / (L.ch + L.gap));
    if (ci >= L.cols || ri >= L.rows) return -1;
    if (fx - ci * (L.cw + L.gap) > L.cw || fy - ri * (L.ch + L.gap) > L.ch) return -1;
    var idx = ri * L.cols + ci;
    return idx < DAYS ? idx : -1;
  }

  // ---- pointer: hold (400 ms, still) opens a day; drag scrubs the year ----
  function pointerPos(e) {
    var x = (e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0));
    var y = (e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0));
    return [x, y];
  }
  function onDown(e) {
    var p = pointerPos(e);
    press = { x: p[0], y: p[1], t: wallNow(), day: cellAt(p[0], p[1]), dragged: false, dx: 0 };
  }
  function onMove(e) {
    if (!press) return;
    var p = pointerPos(e);
    press.dx = p[0] - press.x;
    if (Math.abs(press.dx) > 8 || Math.abs(p[1] - press.y) > 8) press.dragged = true;
  }
  function onUp() {
    if (!press) return;
    if (press.dragged) scrubCommitted += Math.round(press.dx / 24);
    press = null;
    overlayDay = -1;
    drawCurrent();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    canvas.addEventListener('touchmove', onMove, { passive: true });
    canvas.addEventListener('touchend', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  // ---- drawing ----
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    computeLayout();
    var L = layout;
    var hi = highlightAt(t);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // hold-to-open state, derived from the recorded press and t
    overlayDay = -1;
    if (press && !press.dragged && press.day >= 0 && wallNow() - press.t >= 0.4) {
      overlayDay = press.day;
    }

    var total = L.cols * L.rows;
    for (var i = 0; i < total; i++) {
      var r = cellRect(i);
      if (i < DAYS) {
        ctx.fillStyle = BORDER;
        ctx.fillRect(r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2);
        drawScene(SPECS[i], r[0], r[1], r[2], r[3]);
        // the burned-in timestamp, fitted across the cell's foot
        var s = SPECS[i];
        var fs = Math.min(r[3] * 0.24, r[2] / (s.stamp.length * 0.62));
        if (fs >= 2.4) {
          ctx.font = Math.round(fs * 10) / 10 + 'px monospace';
          ctx.fillStyle = LCD;
          ctx.fillText(s.stamp, r[0] + r[2] * 0.04, r[1] + r[3] - Math.max(1.5, r[3] * 0.07));
        }
      } else {
        // the year's tail: empty mounts, chrome only
        ctx.fillStyle = BORDER;
        ctx.fillRect(r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2);
        ctx.fillStyle = SPARE;
        ctx.fillRect(r[0], r[1], r[2], r[3]);
      }
    }

    // the highlighted day
    var hr = cellRect(hi);
    ctx.strokeStyle = AMBER;
    ctx.lineWidth = Math.max(2, Math.min(W, H) * 0.004);
    ctx.strokeRect(hr[0] - 2, hr[1] - 2, hr[2] + 4, hr[3] + 4);

    // a held day, full-frame: the same photograph, large
    if (overlayDay >= 0) {
      var os = SPECS[overlayDay];
      ctx.fillStyle = 'rgba(10,10,12,0.88)';
      ctx.fillRect(0, 0, W, H);
      var ow = Math.min(W * 0.92, H * 0.78 * 4 / 3);
      var oh = ow * 3 / 4;
      if (oh > H * 0.78) { oh = H * 0.78; ow = oh * 4 / 3; }
      var ox = (W - ow) / 2, oy = (H - oh) / 2 - H * 0.04;
      ctx.fillStyle = BORDER;
      ctx.fillRect(ox - 2, oy - 2, ow + 4, oh + 4);
      drawScene(os, ox, oy, ow, oh);
      ctx.fillStyle = LCD;
      ctx.font = Math.round(Math.min(ow / (os.stamp.length * 0.62), H * 0.045)) + 'px monospace';
      ctx.fillText(os.stamp, ox + ow * 0.03, oy + oh - oh * 0.05);
      ctx.font = Math.round(H * 0.028) + 'px monospace';
      ctx.fillText(os.dateLine, ox, oy + oh + H * 0.055);
    }
  }

  resize();
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(tNow());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
