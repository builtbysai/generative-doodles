<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.247 Scaffold Configuration No. 7</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0D; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.247 Scaffold Configuration No. 7 (Avantika Bawa). After her
// 3D-printed Scaffold Configurations, Agenda Gallery 2020-21:
// six little nickel steel scaffold maquettes clustered in a
// black room, lit hard from one side, throwing interlacing
// webs of shadow across the floor and walls. The light drifts
// on a forty second loop; the maquettes never move. You feel
// Gulliver sized looking down at them. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var NICKEL = '#C9CDD4', STEEL = '#6E7B8B', ROOM = '#0B0B0D', RIM = '#E8DCC8';
var W = 0, H = 0, phone = false;
var T = 29, lastNow = -1; // frame one: light well off to the left, webs already spread

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- maquettes ------------------------------------------------------------------------
// Each maquette: a small scaffold grid (bays x levels) with a
// shallow depth offset, three-quarter view. Nodes and edges are
// computed once; the structures themselves never move.
var maquettes = [];
(function () {
  var r = rng(24707);
  // cluster slots across the floor, jittered: neighbours touch
  // but no two maquettes share the same spot
  var slots = [
    { x: 288, by: 602 }, { x: 424, by: 668 }, { x: 538, by: 598 },
    { x: 648, by: 678 }, { x: 742, by: 614 }, { x: 848, by: 664 }
  ];
  var defs = slots.map(function (sl) {
    return {
      x: sl.x + (r() - 0.5) * 36,
      baseY: sl.by + (r() - 0.5) * 22,
      s: 0.60 + r() * 0.55,
      bays: 2 + Math.floor(r() * 3),
      levels: 2 + Math.floor(r() * 2)
    };
  });
  defs.sort(function (a, b) { return a.baseY - b.baseY; });
  defs.forEach(function (d) {
    var bayW = 34 * d.s, lvlH = 33 * d.s;
    var dx = 14 * d.s, dy = -11 * d.s;
    var front = [], back = [], edges = [];
    var i, j;
    for (j = 0; j <= d.levels; j++) {
      front.push([]); back.push([]);
      for (i = 0; i <= d.bays; i++) {
        front[j].push({ x: d.x + i * bayW, y: d.baseY - j * lvlH, h: j * lvlH });
        back[j].push({ x: d.x + i * bayW + dx, y: d.baseY - j * lvlH + dy, h: j * lvlH });
      }
    }
    function edge(a, b, kind) { edges.push({ a: a, b: b, kind: kind }); }
    for (j = 0; j <= d.levels; j++) {
      for (i = 0; i <= d.bays; i++) {
        if (i < d.bays) { edge(front[j][i], front[j][i + 1], 'front'); edge(back[j][i], back[j][i + 1], 'back'); }
        if (j < d.levels) { edge(front[j][i], front[j + 1][i], 'front'); edge(back[j][i], back[j + 1][i], 'back'); }
        edge(front[j][i], back[j][i], 'depth');
      }
    }
    for (var b = 0; b < d.bays; b++) {
      for (var l = 0; l < d.levels; l++) {
        if ((b + l) % 2 === 0) edge(front[l][b], front[l + 1][b + 1], 'diag');
        else edge(front[l][b + 1], front[l + 1][b], 'diag');
      }
    }
    var topEdge = { a: front[d.levels][0], b: front[d.levels][d.bays] };
    maquettes.push({ edges: edges, topEdge: topEdge });
  });
})();

// Project a point from the light. The floor web displaces each
// node along the light's throw direction in proportion to the
// node's height above its own base: feet cast at their feet,
// tops stretch far across the floor. The wall web is a radial
// magnification from the light point, sprawled over everything.
function projFloor(p, L) {
  var dx = (600 - L.x) * 0.78, dy = 238 + (L.y - 130) * 0.4;
  var f = p.h / 110;
  return { x: p.x + dx * f, y: p.y + dy * f };
}
function projWall(p, L) {
  var M = 2.35;
  return { x: L.x + (p.x - L.x) * M, y: L.y + (p.y - L.y) * M };
}

function draw() {
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, W, H);
  var s = Math.min(W / 1200, H / 800);
  ctx.save();
  ctx.translate((W - 1200 * s) / 2, (H - 800 * s) / 2);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.rect(0, 0, 1200, 800);
  ctx.clip();

  // room: back wall, then the floor plane tipping toward the
  // viewer; both lifted a breath from pure black in the steel
  // family so the black shadow webs can read against them
  ctx.fillStyle = mix(ROOM, STEEL, 0.07);
  ctx.fillRect(0, 0, 1200, 800);
  ctx.fillStyle = mix(ROOM, STEEL, 0.22);
  ctx.beginPath();
  ctx.moveTo(-60, 800); ctx.lineTo(-60, 590); ctx.lineTo(1260, 560); ctx.lineTo(1260, 800);
  ctx.closePath(); ctx.fill();
  // wall panels: two faint vertical seams in the same steel family
  ctx.strokeStyle = mix(ROOM, STEEL, 0.20);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(398, 0); ctx.lineTo(404, 578);
  ctx.moveTo(806, 0); ctx.lineTo(800, 566);
  ctx.stroke();

  // the drifting light, off frame to one side or the other
  var L = {
    x: 600 + 405 * Math.sin(T * Math.PI * 2 / 40),
    y: 138 + 44 * Math.sin(T * Math.PI * 2 / 40 * 0.77 + 1.3)
  };

  ctx.lineCap = 'round';
  // far wall webs: giant faint projections sprawled high and wide
  ctx.strokeStyle = 'rgba(0,0,0,0.16)';
  ctx.lineWidth = 8;
  ctx.beginPath();
  maquettes.forEach(function (m) {
    m.edges.forEach(function (e) {
      var a = projWall(e.a, L), b = projWall(e.b, L);
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    });
  });
  ctx.stroke();
  // floor webs: the near shadows, thick and black on the floor plane
  ctx.strokeStyle = 'rgba(0,0,0,0.62)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  maquettes.forEach(function (m) {
    m.edges.forEach(function (e) {
      var a = projFloor(e.a, L), b = projFloor(e.b, L);
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    });
  });
  ctx.stroke();

  // the maquettes themselves: thin nickel, steel behind, one warm rim
  maquettes.forEach(function (m) {
    ctx.strokeStyle = STEEL;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    m.edges.forEach(function (e) {
      if (e.kind === 'back') { ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); }
    });
    ctx.stroke();
    ctx.strokeStyle = mix(STEEL, NICKEL, 0.35);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    m.edges.forEach(function (e) {
      if (e.kind === 'depth') { ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); }
    });
    ctx.stroke();
    ctx.strokeStyle = NICKEL;
    ctx.lineWidth = 2;
    ctx.beginPath();
    m.edges.forEach(function (e) {
      if (e.kind === 'front') { ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); }
    });
    ctx.stroke();
    ctx.strokeStyle = mix(NICKEL, STEEL, 0.45);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    m.edges.forEach(function (e) {
      if (e.kind === 'diag') { ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); }
    });
    ctx.stroke();
    // the single warm rim: the top front rail, at twenty percent
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.strokeStyle = RIM;
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(m.topEdge.a.x, m.topEdge.a.y);
    ctx.lineTo(m.topEdge.b.x, m.topEdge.b.y);
    ctx.stroke();
    ctx.restore();
  });

  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
