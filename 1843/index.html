<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound-House</title>
<style>
html, body { margin: 0; padding: 0; background: #241A10; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Sound-House: a cutaway house of five rooms, each tuned a quarter-tone off
   its neighbor. A plain hymn drifts through the rooms on a thin thread and
   bends a quarter-tone flatter or sharper at each wall. Drag to walk the
   house; the room you stand in is the tuning you hear. Nothing here is in
   equal temperament, and nothing resolves back to the grid. */
var TAU = Math.PI * 2;
var GROUND = '#241A10';
var PLASTER = '#E8D9B8';
var PLASTER_DK = '#C9B48A';
var WOOD = '#4A3220';
var WOOD_DK = '#33220F';
var WOOD_HI = '#6B4A2E';
var AMBER = '#F2C879';
var AMBER_HI = '#FFD98F';
var FLAME = '#FFB347';
var COOL = '#7FA8C9';
var WARM = '#E8A33D';
var PLATE = '#171008';
var PLATE_LINE = 'rgba(242,200,121,0.30)';
var TITLE_INK = '#F2E3C2';
var HINT_INK = '#C9B48A';
var FRAME_T = 60.0;        /* fixed phase: t = 60 s, pre-drag, center room */
var MELODY_PERIOD = 60;    /* one hymn cycle, seconds: 12 notes x 5 s */
var THREAD_PERIOD = 240;   /* thread head drift cycle, seconds */
var BASE_F = 220;          /* hymn tonic A, Hz, just intonation */
/* rooms left to right: cents offset, label, tint */
var ROOMS = [
  { cents: -100, label: '-100c', name: 'FLAT',  tint: COOL, base: 0.16 },
  { cents: -50,  label: '-50c',  name: 'FLAT',  tint: COOL, base: 0.10 },
  { cents: 0,    label: '0c',    name: 'TRUE',  tint: AMBER, base: 0.05 },
  { cents: 50,   label: '+50c',  name: 'SHARP', tint: WARM, base: 0.10 },
  { cents: 100,  label: '+100c', name: 'SHARP', tint: WARM, base: 0.16 }
];
/* hymn: twelve notes, five seconds each, just intonation over A 220 Hz.
   A plain stepwise line: A C D E F E D C A B C D. No equal temperament. */
var HYMN = [
  { name: 'A', ratio: 1 },
  { name: 'C', ratio: 6 / 5 },
  { name: 'D', ratio: 4 / 3 },
  { name: 'E', ratio: 3 / 2 },
  { name: 'F', ratio: 8 / 5 },
  { name: 'E', ratio: 3 / 2 },
  { name: 'D', ratio: 4 / 3 },
  { name: 'C', ratio: 6 / 5 },
  { name: 'A', ratio: 1 },
  { name: 'B', ratio: 9 / 8 },
  { name: 'C', ratio: 6 / 5 },
  { name: 'D', ratio: 4 / 3 }
];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hash2(x, y) {
  var s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1843);
var phaseT = FRAME_T;
var dragX = 0.5;           /* listening position, 0..1 across the house; 0.5 = center room */
var dragging = false;
var audioCtx = null;
var hymnOsc = null, hymnGain = null;
var lastNoteIdx = -1;
/* ---- seeded plaster speckles and candle flicker phases, fixed at load ---- */
var SPECKLES = [];
var FLAMES = [];
(function () {
  var r, i;
  for (r = 0; r < 5; r++) {
    for (i = 0; i < 26; i++) {
      SPECKLES.push({ room: r, fx: rng(), fy: rng(), rad: 0.6 + rng() * 1.6, a: 0.05 + rng() * 0.10 });
    }
    FLAMES.push({ ph: rng() * TAU, per: 0.9 + rng() * 0.7 });
  }
})();
function currentRoom() {
  return clamp(Math.floor(dragX * 5), 0, 4);
}
function hymnNoteAt(t) {
  var idx = Math.floor(t / 5) % 12;
  if (idx < 0) idx += 12;
  return idx;
}
function roomFreq(room, t) {
  var note = HYMN[hymnNoteAt(t)];
  var cents = ROOMS[room].cents;
  return BASE_F * note.ratio * Math.pow(2, cents / 1200);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';

function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };

}
function houseRect(sc) {
  var w = sc.w * (isPhone ? 0.96 : 0.88);
  var h = sc.h * (isPhone ? 0.52 : 0.46);
  return { x: sc.x + (sc.w - w) / 2, y: sc.y + sc.h * 0.30, w: w, h: h };

/* thread height: base line plus the tuning bend of the room under x.

   slope at each wall, so the thread visibly kinks as it crosses. */
function threadBendAt(fx) {
  var room = clamp(Math.floor(fx * 5), 0, 4);
  var local = fx * 5 - room;
  var b0 = -ROOMS[room].cents / 100;
  var b1 = room < 4 ? -ROOMS[room + 1].cents / 100 : b0;

}
function threadYAt(hs, fx) {
  return hs.y + hs.h * 0.42 + threadBendAt(fx) * hs.h * 0.055;
}
function threadS(t) {

}
function drawHouse(sc, t) {
  var hs = houseRect(sc);
  var rw = hs.w / 5;
  var cur = currentRoom();
  var i, j, rx, cx, cy;
  /* ground line under the house */
  ctx.strokeStyle = rgba(PLASTER_DK, 0.35);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sc.x + sc.w * 0.03, hs.y + hs.h + sc.h * 0.02);
  ctx.lineTo(sc.x + sc.w * 0.97, hs.y + hs.h + sc.h * 0.02);
  ctx.stroke();
  /* roof: dark wood triangle with a chimney, candle-amber ridge light */
  ctx.fillStyle = WOOD_DK;
  ctx.beginPath();
  ctx.moveTo(hs.x - hs.w * 0.02, hs.y);
  ctx.lineTo(hs.x + hs.w * 0.50, hs.y - hs.h * 0.42);
  ctx.lineTo(hs.x + hs.w * 1.02, hs.y);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = rgba(WOOD_HI, 0.7);
  ctx.lineWidth = Math.max(1, sc.w * 0.002);
  for (i = 1; i <= 3; i++) {
    var ry = hs.y - hs.h * 0.42 * (i / 4);
    var half = hs.w * 0.52 * (i / 4);
    ctx.beginPath();
    ctx.moveTo(hs.x + hs.w * 0.50 - half, ry);
    ctx.lineTo(hs.x + hs.w * 0.50 + half, ry);
    ctx.stroke();
  }
  /* chimney on the right slope */
  ctx.fillStyle = WOOD;
  ctx.fillRect(hs.x + hs.w * 0.72, hs.y - hs.h * 0.42, hs.w * 0.045, hs.h * 0.20);
  ctx.fillStyle = WOOD_DK;
  ctx.fillRect(hs.x + hs.w * 0.71, hs.y - hs.h * 0.45, hs.w * 0.065, hs.h * 0.035);
  /* room fills: warm plaster, tinted by tuning, current room lit */
  for (i = 0; i < 5; i++) {
    rx = hs.x + i * rw;
    ctx.fillStyle = PLASTER;
    ctx.fillRect(rx, hs.y, rw, hs.h);
    var alpha = ROOMS[i].base + (i === cur ? 0.12 : 0);
    ctx.fillStyle = rgba(ROOMS[i].tint, alpha);
    ctx.fillRect(rx, hs.y, rw, hs.h);
    if (i !== cur) {
      ctx.fillStyle = 'rgba(36,26,16,0.10)';
      ctx.fillRect(rx, hs.y, rw, hs.h);
    }
  }
  /* plaster speckles, seeded and fixed */
  for (j = 0; j < SPECKLES.length; j++) {
    var sp = SPECKLES[j];
    ctx.fillStyle = 'rgba(74,50,32,' + sp.a.toFixed(4) + ')';
    ctx.beginPath();
    ctx.moveTo(hs.x + sp.room * rw + sp.fx * rw + sp.rad, hs.y + sp.fy * hs.h);
    ctx.arc(hs.x + sp.room * rw + sp.fx * rw, hs.y + sp.fy * hs.h, sp.rad, 0, TAU);
    ctx.fill();
  }
  /* candle-amber wash: strongest in the room being listened to */
  for (i = 0; i < 5; i++) {
    cx = hs.x + (i + 0.5) * rw;
    cy = hs.y + hs.h * 0.72;
    var glowR = rw * (i === cur ? 0.95 : 0.55);
    var glowA = (i === cur ? 0.20 : 0.07).toFixed(4);
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    g.addColorStop(0, 'rgba(255,217,143,' + glowA + ')');
    g.addColorStop(1, 'rgba(255,217,143,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);
  }
  /* candles: one per room, flame flicker closed-form in t */
  for (i = 0; i < 5; i++) {
    cx = hs.x + (i + 0.5) * rw;
    cy = hs.y + hs.h * 0.86;
    var fl = FLAMES[i];
    var flick = 1 + 0.18 * Math.sin(TAU * t / fl.per + fl.ph);
    var fh = hs.h * 0.055 * flick;
    ctx.fillStyle = WOOD_DK;
    ctx.fillRect(cx - rw * 0.02, cy, rw * 0.04, hs.h * 0.05);
    ctx.fillStyle = '#F5E8C8';
    ctx.fillRect(cx - rw * 0.035, cy - hs.h * 0.012, rw * 0.07, hs.h * 0.012);
    ctx.fillStyle = FLAME;
    ctx.beginPath();
    ctx.moveTo(cx, cy - hs.h * 0.012 - fh);
    ctx.bezierCurveTo(cx + fh * 0.45, cy - hs.h * 0.012 - fh * 0.55, cx + fh * 0.30, cy - hs.h * 0.012, cx, cy - hs.h * 0.012);
    ctx.bezierCurveTo(cx - fh * 0.30, cy - hs.h * 0.012, cx - fh * 0.45, cy - hs.h * 0.012 - fh * 0.55, cx, cy - hs.h * 0.012 - fh);
    ctx.fill();
  }
  /* beams: top plate, posts at each wall, floor joists */
  ctx.fillStyle = WOOD;
  ctx.fillRect(hs.x - hs.w * 0.01, hs.y - hs.h * 0.02, hs.w * 1.02, hs.h * 0.035);
  ctx.fillRect(hs.x - hs.w * 0.01, hs.y + hs.h - hs.h * 0.02, hs.w * 1.02, hs.h * 0.035);
  for (i = 0; i <= 5; i++) {
    ctx.fillRect(hs.x + i * rw - sc.w * 0.003, hs.y, sc.w * 0.006, hs.h);
  }
  /* doorways: gaps in the four inner walls, staggered heights; the opening
     is shadowed so it reads as a passage, not a pillar */
  var doorTops = [0.42, 0.52, 0.42, 0.52];
  for (i = 1; i <= 4; i++) {
    var wx = hs.x + i * rw;
    var dTop = hs.y + hs.h * doorTops[i - 1];
    var dH = hs.y + hs.h - hs.h * 0.02 - dTop;
    ctx.fillStyle = PLASTER;
    ctx.fillRect(wx - rw * 0.10, dTop, rw * 0.20, dH);
    ctx.fillStyle = 'rgba(36,26,16,0.22)';
    ctx.fillRect(wx - rw * 0.10, dTop, rw * 0.20, dH);
    ctx.fillStyle = rgba(ROOMS[i].tint, 0.08);
    ctx.fillRect(wx - rw * 0.10, dTop, rw * 0.20, dH);
    ctx.fillStyle = WOOD;
    ctx.fillRect(wx - rw * 0.11, dTop - hs.h * 0.018, rw * 0.22, hs.h * 0.018);
  }
  /* small windows in the outer rooms, warm glass, below the tuning labels */
  for (i = 0; i < 5; i += 4) {
    rx = hs.x + i * rw;
    ctx.fillStyle = WOOD_DK;
    ctx.fillRect(rx + rw * 0.28, hs.y + hs.h * 0.16, rw * 0.44, hs.h * 0.20);
    ctx.fillStyle = rgba(AMBER_HI, 0.85);
    ctx.fillRect(rx + rw * 0.32, hs.y + hs.h * 0.18, rw * 0.36, hs.h * 0.16);
    ctx.strokeStyle = WOOD_DK;
    ctx.lineWidth = Math.max(1, sc.w * 0.002);
    ctx.beginPath();
    ctx.moveTo(rx + rw * 0.50, hs.y + hs.h * 0.18);
    ctx.lineTo(rx + rw * 0.50, hs.y + hs.h * 0.34);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rx + rw * 0.32, hs.y + hs.h * 0.26);
    ctx.lineTo(rx + rw * 0.68, hs.y + hs.h * 0.26);
    ctx.stroke();
  }
  /* tuning labels: cents and FLAT / TRUE / SHARP, current room bright */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (i = 0; i < 5; i++) {
    cx = hs.x + (i + 0.5) * rw;
    var fs = isPhone ? 11 : 13;
    ctx.font = 'bold ' + fs + 'px monospace';
    ctx.fillStyle = i === cur ? WOOD_DK : 'rgba(74,50,32,0.85)';
    ctx.fillText(ROOMS[i].label, cx, hs.y + hs.h * 0.055);
    ctx.font = (isPhone ? 9 : 10) + 'px monospace';
    ctx.fillStyle = i === cur ? WOOD_DK : 'rgba(74,50,32,0.70)';
    ctx.fillText(ROOMS[i].name, cx, hs.y + hs.h * 0.055 + fs + 3);
  }
  /* current-room marker: brass diamond on the roof above it, plus a warm

  var mx = hs.x + (cur + 0.5) * rw;
  var my = hs.y - hs.h * 0.42 * 0.55;
  ctx.fillStyle = AMBER_HI;
  ctx.beginPath();
  ctx.moveTo(mx, my - hs.h * 0.045);
  ctx.lineTo(mx + hs.h * 0.035, my);
  ctx.lineTo(mx, my + hs.h * 0.045);
  ctx.lineTo(mx - hs.h * 0.035, my);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = rgba(AMBER_HI, 0.9);
  ctx.lineWidth = Math.max(1.5, sc.w * 0.003);
  ctx.strokeRect(hs.x + cur * rw + 1, hs.y + 1, rw - 2, hs.h - 2);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + (isPhone ? 10 : 11) + 'px monospace';
  ctx.fillStyle = AMBER_HI;
  ctx.fillText('LISTENING', mx, hs.y + hs.h + sc.h * 0.028);

}
function drawThread(sc, hs, t) {

  /* faint full thread: the hymn's whole path through the house */
  ctx.strokeStyle = rgba(TITLE_INK, 0.35);
  ctx.lineWidth = Math.max(1, sc.w * 0.0018);
  ctx.beginPath();
  for (i = 0; i <= 60; i++) {
    fx = i / 60;
    px = hx0 + fx * hs.w;
    py = threadYAt(hs, fx);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  /* bright thread up to the head, bending at each wall */
  ctx.strokeStyle = rgba(AMBER_HI, 0.95);
  ctx.lineWidth = Math.max(1.5, sc.w * 0.0028);
  ctx.beginPath();
  for (i = 0; i <= 60; i++) {
    fx = (i / 60) * s;
    px = hx0 + fx * hs.w;
    py = threadYAt(hs, fx);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

    ctx.fillStyle = passed ? AMBER_HI : rgba(TITLE_INK, 0.55);

    ctx.moveTo(px + 3.5, py);
    ctx.arc(px, py, 3.5, 0, TAU);
    ctx.fill();

  rg.addColorStop(0, 'rgba(255,217,143,0.55)');
  rg.addColorStop(1, 'rgba(255,217,143,0)');

  ctx.fillRect(hx - 16 * pulse, hy - 16 * pulse, 32 * pulse, 32 * pulse);
  ctx.fillStyle = AMBER_HI;
  ctx.beginPath();
  ctx.moveTo(hx + 5, hy);
  ctx.arc(hx, hy, 5, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = AMBER_HI;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(hx + 4.5, hy);
  ctx.lineTo(hx + 4.5, hy - 14);

  ctx.textBaseline = 'middle';

function drawPlates() {

  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Sound-House').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Sound-House').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 28').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Sound-House', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 28', plateX + 14, plateY + 7 + titlePx + 3);

  var hint2 = 'the hymn a quarter-tone off. Drag only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = Math.max(ctx.measureText(hint1).width, ctx.measureText(hint2).width);

  var hintPlateH = smallPx * 2 + 18;

  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;

/* ---- sound: closed-form hymn model, real WebAudio only inside a drag ---- */
function ensureAudio() {

    try { audioCtx = new AudioContext(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }

function startVoices(ac) {

    hymnGain = ac.createGain();
    hymnGain.gain.value = 0.0;
    hymnGain.connect(ac.destination);
    hymnOsc = ac.createOscillator();
    hymnOsc.type = 'triangle';
    hymnOsc.frequency.value = roomFreq(currentRoom(), phaseT);
    hymnOsc.connect(hymnGain);

    try { hymnOsc.frequency.setValueAtTime(roomFreq(currentRoom(), t), audioCtx.currentTime); } catch (e) {}

function setDrag(clientX) {

}
function draw() {
  size();

  var t = phaseT;

}
