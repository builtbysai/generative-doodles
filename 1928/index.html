<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1928 Texture Collector</title>
<style>
  html, body { margin: 0; padding: 0; background: #b8bfc3; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/chris-hyson.md does not exist in the repo, so these hex
  // values are chosen from the prompt's own color names.
  var SKY_TOP = '#b8bfc3';   // winter-sky grey, high
  var SKY_MID = '#c9c4b6';   // winter-sky grey, warming toward the horizon
  var HORIZON = '#d9c49c';   // film-grain sepia haze at the horizon
  var SEA = '#4f7a6a';       // sea green
  var SEA_DEEP = '#33584a';  // sea green, deep
  var SUN = '#d99a2b';       // sun amber
  var SUN_LT = '#e8b45a';    // sun amber, light
  var BIRD = '#1c1a17';      // bird black
  var SEPIA = '#8a6f4d';     // film-grain sepia
  var GRAIN_DK = '#6b543a';  // grain, dark speckle
  var GRAIN_LT = '#e8e0cc';  // grain, light speckle
  var CLOUD = '#e8e6df';     // cloud white, warm
  var CLOUD_SH = '#c9cdd0';  // cloud shadow grey
  var STRIP = '#ddd5c0';     // swatch grid ground, muted archival paper
  var INK = '#2a2620';       // plate ink on the light sky
  var BONE = '#f5efe0';      // hint ink over the dark water

  // Fixed-phase first frame: t = 48 s. The cycle is 240 s. The collector
  // follows eight waypoints, 2.5 s of travel and a 3 s hold at each, and
  // a 1 s linger lifts one swatch, so lifts land at 2.95, 8.05, 13.55,
  // 19.15, 24.95, 30.50, 35.90, 41.65 and 46.95 s: nine swatches are
  // pinned at frame one, the sky is mid-drift, and the sun sits low
  // over the water. Frame one is byte-reproducible: every cloud, bird,
  // streak and swatch is a pure function of t and the seeded PRNG.
  var FIRST_T = 48;
  var CYCLE = 240;
  var DWELL_NEED = 1.0;
  var GRID_COLS = 8, GRID_ROWS = 2, GRID_MAX = 16;
  var HY = 0.78; // horizon, unit y
  var SY = 0.86; // swatch strip top, unit y
  var SUNX = 0.72, SUNY = 0.64;

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // QA hook: read location.search for ?sx= ?sy= (place the gaze and hand
  // it to the visitor at load) and ?seed= (vary the sky).
  var QS = {};
  try {
    var q = (typeof location !== 'undefined' && location.search) ? location.search.replace(/^\?/, '') : '';
    var parts = q.split('&');
    for (var qi = 0; qi < parts.length; qi++) {
      var kv = parts[qi].split('=');
      if (kv[0]) { QS[kv[0]] = decodeURIComponent(kv[1] || ''); }
    }
  } catch (e) {}
  var SEED = parseInt(QS.seed || '0', 10) || 0;
  var SEED_N = 1928 + SEED * 7919;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function smooth(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Clouds: three drifting blobs, base positions fixed from the seed
  // with a small seed jitter so ?seed= varies the sky.
  var CLOUDS = [];
  var GRAIN = [];
  var STREAKS = [];
  (function buildField() {
    var rng = mulberry32(SEED_N);
    var base = [
      { x: 0.30, y: 0.30, r: 0.10, s: 1.00, ph: 0.4 },
      { x: 0.58, y: 0.22, r: 0.09, s: 0.85, ph: 2.1 },
      { x: 0.82, y: 0.26, r: 0.08, s: 0.75, ph: 4.4 }
    ];
    for (var i = 0; i < base.length; i++) {
      var blobs = [];
      for (var b = 0; b < 6; b++) {
        blobs.push({
          ox: (rng() - 0.5) * 0.10 * base[i].s,
          oy: (rng() - 0.5) * 0.035 * base[i].s,
          rx: (0.030 + rng() * 0.035) * base[i].s,
          ry: (0.014 + rng() * 0.012) * base[i].s
        });
      }
      CLOUDS.push({
        x: base[i].x + (rng() - 0.5) * 0.04,
        y: base[i].y + (rng() - 0.5) * 0.02,
        r: base[i].r, s: base[i].s, ph: base[i].ph, blobs: blobs
      });
    }
    for (var g = 0; g < 320; g++) {
      GRAIN.push({
        x: rng(), y: rng() * SY, r: 0.5 + rng() * 0.8,
        ph: rng() * Math.PI * 2, lt: rng() < 0.5
      });
    }
    for (var s2 = 0; s2 < 16; s2++) {
      STREAKS.push({
        x: rng() * 0.9, y: HY + (s2 + 0.5) / 16 * (SY - HY),
        len: 0.05 + rng() * 0.13, ph: rng() * Math.PI * 2
      });
    }
  })();

  // The collector's waypoints, in unit coordinates: three clouds, two
  // bird flyways, the sun, and the water twice. The autonomous path
  // stands in for the collector's hand until the visitor takes it with
  // a drag; the grid fills only where the gaze lingered, never on a
  // timer, and a drag freezes the autonomous timeline at the takeover.
  var WAY = [
    { x: 0.30, y: 0.30 }, // cloud 1
    { x: 0.58, y: 0.22 }, // cloud 2
    { x: 0.45, y: 0.40 }, // bird flyway 1
    { x: 0.72, y: 0.64 }, // sun
    { x: 0.35, y: 0.82 }, // water
    { x: 0.82, y: 0.26 }, // cloud 3
    { x: 0.20, y: 0.44 }, // bird flyway 2
    { x: 0.80, y: 0.82 }  // water
  ];
  var STEP = 5.5, MOVE = 2.5; // per waypoint: travel then hold

  // The gaze on the autonomous path: a pure function of t.
  function gazeAt(t) {
    var k = Math.floor(t / STEP);
    var idx = ((k % WAY.length) + WAY.length) % WAY.length;
    var local = t - k * STEP;
    var prev = WAY[(idx + WAY.length - 1) % WAY.length];
    var cur = WAY[idx];
    if (local < MOVE) {
      var u = local / MOVE;
      var e = u * u * (3 - 2 * u);
      return { x: prev.x + (cur.x - prev.x) * e, y: prev.y + (cur.y - prev.y) * e };
    }
    return { x: cur.x, y: cur.y };
  }

  function cloudCenter(ci, t) {
    var c = CLOUDS[ci];
    return {
      x: c.x + 0.015 * Math.sin(t * 0.05 + c.ph),
      y: c.y + 0.006 * Math.sin(t * 0.037 + c.ph * 2)
    };
  }

  var BIRDZ = [
    { x: 0.45, y: 0.40, rx: 0.10, ry: 0.06 },
    { x: 0.20, y: 0.44, rx: 0.09, ry: 0.06 }
  ];

  // Tagged region under a unit point, by identity: cloud1..3, birds1..2,
  // sun, sea, or null. Cloud centers drift slowly with t; bird zones and
  // the sun are fixed. Identity matters: two different clouds are two
  // different lifts, so consecutive waypoints on different clouds each
  // earn a swatch.
  function regionAt(x, y, t) {
    for (var i = 0; i < CLOUDS.length; i++) {
      var cc = cloudCenter(i, t);
      var dx = (x - cc.x) / CLOUDS[i].r, dy = (y - cc.y) / (CLOUDS[i].r * 0.75);
      if (dx * dx + dy * dy <= 1) { return 'cloud' + (i + 1); }
    }
    for (var f = 0; f < BIRDZ.length; f++) {
      var bx = (x - BIRDZ[f].x) / BIRDZ[f].rx, by = (y - BIRDZ[f].y) / BIRDZ[f].ry;
      if (bx * bx + by * by <= 1) { return 'birds' + (f + 1); }
    }
    var sx = (x - SUNX) / 0.09, sy = (y - SUNY) / 0.09;
    if (sx * sx + sy * sy <= 1) { return 'sun'; }
    if (y >= 0.80) { return 'sea'; }
    return null;
  }

  // Swatch texture kind for a region identity.
  function kindOf(region) {
    if (region === 'cloud1' || region === 'cloud2' || region === 'cloud3') { return 'cloud'; }
    if (region === 'birds1' || region === 'birds2') { return 'birds'; }
    return region;
  }

  // Simulate one cycle's lifts from the autonomous path: step the gaze,
  // accumulate continuous dwell per region, lift at 1 s unless the same
  // region was just lifted, cap at sixteen cells. Pure function of the
  // cycle start, so frame one is reproducible.
  function simulateEvents(startT) {
    var evs = [];
    var region = null, dwell = 0, lastLifted = null;
    var dt = 0.05;
    for (var t = startT; t < startT + CYCLE; t += dt) {
      var g = gazeAt(t);
      var r = regionAt(g.x, g.y, t);
      if (r === region && r !== null) { dwell += dt; }
      else { region = r; dwell = (r === null) ? 0 : dt; }
      if (r !== null && dwell >= DWELL_NEED && r !== lastLifted && evs.length < GRID_MAX) {
        evs.push({ time: t, region: r });
        lastLifted = r;
        dwell = 0;
      }
    }
    return evs;
  }
  var eventCache = {};
  function eventsForCycle(ci) {
    if (!eventCache[ci]) { eventCache[ci] = simulateEvents(ci * CYCLE); }
    return eventCache[ci];
  }

  // Live state: the visitor's hand.
  var takenOver = false, takeoverT = 0, takeoverCycle = 0;
  var dragging = false;
  var gazeX = 0.5, gazeY = 0.42;
  var liveSwatches = [];
  var liveRegion = null, liveDwell = 0, liveLastLifted = null;
  var tNow = FIRST_T, lastDrawT = FIRST_T, lastCycle = 0;

  // QA placement: ?sx= ?sy= puts the gaze there and hands it to the
  // visitor at load, so a probe can place the hand on one region or
  // another and compare frames.
  if (QS.sx !== undefined && QS.sy !== undefined) {
    var qx = parseFloat(QS.sx), qy = parseFloat(QS.sy);
    if (isFinite(qx) && isFinite(qy)) {
      gazeX = clamp(qx, 0, 1); gazeY = clamp(qy, 0, 1);
      takenOver = true; takeoverT = 0; takeoverCycle = 0;
    }
  }

  function eventPoint(e) {
    var px = null, py = null;
    if (typeof e.offsetX === 'number' && typeof e.offsetY === 'number') {
      px = e.offsetX; py = e.offsetY;
    } else if (typeof e.clientX === 'number') {
      var rx = stageX, ry = stageY;
      try {
        var r = canvas.getBoundingClientRect();
        rx = r.left; ry = r.top;
      } catch (err) {}
      px = e.clientX - rx; py = e.clientY - ry;
    }
    if (px === null) { return null; }
    return { x: clamp(px / W, 0, 1), y: clamp(py / H, 0, 1) };
  }

  function takeOver(e) {
    if (!takenOver) {
      takenOver = true; takeoverT = tNow; takeoverCycle = lastCycle;
    }
    var p = eventPoint(e);
    if (p) { gazeX = p.x; gazeY = p.y; }
    liveRegion = null; liveDwell = 0;
  }

  function onDown(e) {
    if (e && typeof e.preventDefault === 'function') { e.preventDefault(); }
    dragging = true;
    takeOver(e);
    try {
      if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) {
        canvas.setPointerCapture(e.pointerId);
      }
    } catch (err) {}
  }
  function onMove(e) {
    if (!dragging) { return; }
    var p = eventPoint(e);
    if (p) { gazeX = p.x; gazeY = p.y; }
  }
  function onUp() { dragging = false; }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  function drawBird(cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx - s, cy + s * 0.35);
    ctx.lineTo(cx, cy - s * 0.25);
    ctx.lineTo(cx + s, cy + s * 0.35);
    ctx.stroke();
  }

  function drawSwatch(region, seedN, x, y, s) {
    var rng = mulberry32(1928 * 1000 + seedN * 131 + 7);
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, s, s);
    ctx.clip();
    if (region === 'cloud') {
      ctx.fillStyle = '#b9c0c4';
      ctx.fillRect(x, y, s, s);
      ctx.fillStyle = hexA(CLOUD, 0.85);
      for (var i = 0; i < 3; i++) {
        var bx = x + (0.25 + rng() * 0.5) * s;
        var by = y + (0.3 + rng() * 0.4) * s;
        var br = (0.16 + rng() * 0.10) * s;
        ctx.beginPath(); ctx.moveTo(bx + br, by); ctx.ellipse(bx, by, br, br * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      }
    } else if (region === 'birds') {
      ctx.fillStyle = '#2a2724';
      ctx.fillRect(x, y, s, s);
      ctx.strokeStyle = hexA('#d8d2c4', 0.9);
      ctx.lineWidth = Math.max(1, s * 0.03);
      for (var j = 0; j < 3; j++) {
        var cx = x + (0.25 + rng() * 0.5) * s;
        var cy = y + (0.28 + rng() * 0.44) * s;
        drawBird(cx, cy, s * 0.09);
      }
    } else if (region === 'sun') {
      var sg = ctx.createLinearGradient(x, y, x, y + s);
      sg.addColorStop(0, SUN_LT);
      sg.addColorStop(1, SUN);
      ctx.fillStyle = sg;
      ctx.fillRect(x, y, s, s);
      ctx.fillStyle = hexA('#f5d68a', 0.95);
      var dx = x + s * 0.62, dy = y + s * 0.38, dr = s * 0.16;
      ctx.beginPath(); ctx.moveTo(dx + dr, dy); ctx.arc(dx, dy, dr, 0, Math.PI * 2); ctx.fill();
    } else { // sea
      ctx.fillStyle = SEA;
      ctx.fillRect(x, y, s, s);
      ctx.strokeStyle = hexA('#7ba08d', 0.8);
      ctx.lineWidth = Math.max(1, s * 0.03);
      for (var k = 0; k < 3; k++) {
        var ly = y + (0.25 + rng() * 0.5) * s;
        var lx = x + rng() * 0.4 * s;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx + s * (0.35 + rng() * 0.3), ly);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.strokeStyle = hexA(INK, 0.5);
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, s - 1, s - 1);
  }

  function drawCover(evs, x, y, s) {
    var half = s / 2;
    for (var q = 0; q < 4; q++) {
      var reg = evs[q % evs.length].region;
      drawSwatch(kindOf(reg), 100 + q, x + (q % 2) * half, y + Math.floor(q / 2) * half, half);
    }
    ctx.strokeStyle = hexA(INK, 0.7);
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, s - 2, s - 2);
  }

  // The swatch grid along the lower edge. Returns the shown swatch count.
  function drawGrid(t, cycleIdx, ct) {
    var SH = H - SY * H;
    ctx.fillStyle = STRIP;
    ctx.fillRect(0, SY * H, W, SH);
    ctx.fillStyle = hexA(SEPIA, 0.6);
    ctx.fillRect(0, SY * H, W, 1);

    var m = Math.max(10, W * 0.03);
    var s = Math.min(SH * 0.42, (W - 2 * m) / 11.62);
    var g = s * 0.14;
    var gridX = m, gridY = SY * H + (SH - (2 * s + g)) / 2;
    var coverS = 2 * s + g, coverX = W - m - coverS, coverY = SY * H + (SH - coverS) / 2;

    var evs = eventsForCycle(cycleIdx);
    var capT = takenOver
      ? (takeoverCycle === cycleIdx ? takeoverT : cycleIdx * CYCLE - 1)
      : t;
    var shown = [];
    for (var i = 0; i < evs.length; i++) {
      if (evs[i].time <= capT) { shown.push(evs[i]); }
    }
    var total = shown.length + liveSwatches.length;
    var folding = cycleIdx > 0 && ct < 4;

    if (!folding) {
      for (var j = 0; j < total; j++) {
        var cx = gridX + (j % GRID_COLS) * (s + g);
        var cy = gridY + Math.floor(j / GRID_COLS) * (s + g);
        var reg = (j < shown.length) ? shown[j].region : liveSwatches[j - shown.length].region;
        drawSwatch(kindOf(reg), j, cx, cy, s);
      }
      ctx.strokeStyle = hexA(SEPIA, 0.35);
      ctx.lineWidth = 1;
      for (var e2 = total; e2 < GRID_MAX; e2++) {
        var ex = gridX + (e2 % GRID_COLS) * (s + g);
        var ey = gridY + Math.floor(e2 / GRID_COLS) * (s + g);
        ctx.strokeRect(ex + 0.5, ey + 0.5, s - 1, s - 1);
      }
    } else {
      var prev = eventsForCycle(cycleIdx - 1);
      var p = ct / 4;
      for (var k2 = 0; k2 < prev.length; k2++) {
        var px0 = gridX + (k2 % GRID_COLS) * (s + g);
        var py0 = gridY + Math.floor(k2 / GRID_COLS) * (s + g);
        var px = px0 + (coverX - px0) * p;
        var py = py0 + (coverY - py0) * p;
        var sc = 1 - 0.7 * p;
        ctx.save();
        ctx.globalAlpha = a4(1 - 0.6 * p);
        drawSwatch(kindOf(prev[k2].region), k2, px + (s - s * sc) / 2, py + (s - s * sc) / 2, s * sc);
        ctx.restore();
      }
    }

    if (cycleIdx > 0) {
      ctx.save();
      ctx.globalAlpha = a4(folding ? ct / 4 : 1);
      drawCover(eventsForCycle(cycleIdx - 1), coverX, coverY, coverS);
      ctx.restore();
    }
    return total;
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tNow = t;

    var cycleIdx = Math.floor(t / CYCLE);
    var ct = t - cycleIdx * CYCLE;
    if (cycleIdx !== lastCycle) {
      lastCycle = cycleIdx;
      liveSwatches = [];
      liveLastLifted = null;
      liveRegion = null;
      liveDwell = 0;
    }

    // Live dwell: while the hand is down, lingering on one region lifts
    // a swatch after a second. The autonomous path never adds live
    // swatches; its lifts come from the simulation only.
    var dt = clamp(t - lastDrawT, 0, 0.5);
    lastDrawT = t;
    if (dragging) {
      var rLive = regionAt(gazeX, gazeY, t);
      if (rLive === liveRegion && rLive !== null) { liveDwell += dt; }
      else { liveRegion = rLive; liveDwell = (rLive === null) ? 0 : dt; }
      if (rLive !== null && liveDwell >= DWELL_NEED && rLive !== liveLastLifted) {
        // Cap against the swatches actually shown, not the whole cycle's
        // simulated list: the cycle fills to sixteen, but only the lifts
        // up to the takeover time are pinned so far.
        var capT2 = takenOver
          ? (takeoverCycle === cycleIdx ? takeoverT : cycleIdx * CYCLE - 1)
          : t;
        var shownPre = 0;
        var evsNow = eventsForCycle(cycleIdx);
        for (var ei = 0; ei < evsNow.length; ei++) {
          if (evsNow[ei].time <= capT2) { shownPre++; }
        }
        if (shownPre + liveSwatches.length < GRID_MAX) {
          liveSwatches.push({ region: rLive });
          liveLastLifted = rLive;
          liveDwell = 0;
        }
      }
    }

    var g = takenOver ? { x: gazeX, y: gazeY } : gazeAt(t);
    if (!takenOver) { gazeX = g.x; gazeY = g.y; }

    // Sky: winter grey warming to a sepia haze at the horizon.
    var sky = ctx.createLinearGradient(0, 0, 0, HY * H);
    sky.addColorStop(0, SKY_TOP);
    sky.addColorStop(0.55, SKY_MID);
    sky.addColorStop(1, HORIZON);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, HY * H + 1);

    // Sun glow and disc, low over the water.
    var glowR = Math.min(W, H) * 0.24;
    var sg2 = ctx.createRadialGradient(SUNX * W, SUNY * H, 0, SUNX * W, SUNY * H, glowR);
    sg2.addColorStop(0, hexA(SUN_LT, 0.5));
    sg2.addColorStop(1, hexA(SUN_LT, 0));
    ctx.fillStyle = sg2;
    ctx.fillRect(0, 0, W, HY * H + 1);
    var sunR = Math.max(10, Math.min(W, H) * 0.045);
    ctx.fillStyle = SUN;
    ctx.beginPath(); ctx.moveTo(SUNX * W + sunR, SUNY * H); ctx.arc(SUNX * W, SUNY * H, sunR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hexA(SUN_LT, 0.8);
    ctx.beginPath(); ctx.moveTo(SUNX * W + sunR * 0.6, SUNY * H); ctx.arc(SUNX * W, SUNY * H, sunR * 0.6, 0, Math.PI * 2); ctx.fill();

    // Clouds: drifting clusters of soft ellipses.
    for (var ci = 0; ci < CLOUDS.length; ci++) {
      var cc = cloudCenter(ci, t);
      var c = CLOUDS[ci];
      ctx.fillStyle = hexA(CLOUD_SH, 0.28);
      for (var b2 = 0; b2 < c.blobs.length; b2++) {
        var bl = c.blobs[b2];
        var bx2 = (cc.x + bl.ox) * W, by2 = (cc.y + bl.oy + 0.008) * H;
        ctx.beginPath(); ctx.moveTo(bx2 + bl.rx * W, by2);
        ctx.ellipse(bx2, by2, bl.rx * W, bl.ry * H, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = hexA(CLOUD, 0.6);
      for (var b3 = 0; b3 < c.blobs.length; b3++) {
        var bl3 = c.blobs[b3];
        var bx3 = (cc.x + bl3.ox) * W, by3 = (cc.y + bl3.oy) * H;
        ctx.beginPath(); ctx.moveTo(bx3 + bl3.rx * W, by3);
        ctx.ellipse(bx3, by3, bl3.rx * W, bl3.ry * H, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Birds: two flocks orbiting their flyways, small black chevrons.
    ctx.strokeStyle = BIRD;
    ctx.lineWidth = Math.max(1, H * 0.002);
    ctx.lineCap = 'round';
    for (var f = 0; f < BIRDZ.length; f++) {
      var bz = BIRDZ[f];
      for (var bi = 0; bi < 6; bi++) {
        var ang = t * 0.15 * (1 + 0.05 * bi) + bi * 1.1 + f * 2.4;
        var pxb = (bz.x + Math.cos(ang) * bz.rx * 0.8) * W;
        var pyb = (bz.y + Math.sin(ang) * bz.ry * 0.7) * H;
        drawBird(pxb, pyb, Math.max(3, H * 0.008));
      }
    }

    // Water: sea green band with slow shimmer streaks and a sun column.
    var sea = ctx.createLinearGradient(0, HY * H, 0, SY * H);
    sea.addColorStop(0, SEA);
    sea.addColorStop(1, SEA_DEEP);
    ctx.fillStyle = sea;
    ctx.fillRect(0, HY * H, W, (SY - HY) * H + 1);
    ctx.strokeStyle = hexA('#cfe0d4', 0.0);
    for (var si = 0; si < STREAKS.length; si++) {
      var st = STREAKS[si];
      ctx.strokeStyle = hexA('#cfe0d4', a4(0.08 + 0.06 * Math.sin(t * 0.4 + st.ph)));
      ctx.lineWidth = Math.max(1, H * 0.0016);
      ctx.beginPath();
      ctx.moveTo(st.x * W, st.y * H);
      ctx.lineTo((st.x + st.len) * W, st.y * H);
      ctx.stroke();
    }
    for (var ri = 0; ri < 5; ri++) {
      var ry2 = (HY + 0.015 + ri * 0.012) * H;
      ctx.strokeStyle = hexA(SUN_LT, a4(0.10 + 0.05 * Math.sin(t * 0.5 + ri * 1.3)));
      ctx.lineWidth = Math.max(1, H * 0.002);
      ctx.beginPath();
      ctx.moveTo((SUNX - 0.05 + ri * 0.004) * W, ry2);
      ctx.lineTo((SUNX + 0.05 - ri * 0.004) * W, ry2);
      ctx.stroke();
    }

    // Film grain over the field, fixed speckles with a slow alpha flicker.
    for (var gi = 0; gi < GRAIN.length; gi++) {
      var gr = GRAIN[gi];
      ctx.fillStyle = hexA(gr.lt ? GRAIN_LT : GRAIN_DK, a4(0.05 + 0.05 * Math.sin(t * 0.8 + gr.ph)));
      ctx.fillRect(gr.x * W, gr.y * H, gr.r, gr.r);
    }

    // The swatch grid along the lower edge.
    var total = drawGrid(t, cycleIdx, ct);

    // The collector's gaze: a soft ring where the hand rests, with a
    // dwell arc that fills amber as a swatch is earned.
    var gx = g.x * W, gy = g.y * H;
    var gr2 = Math.max(14, Math.min(W, H) * 0.045);
    var gg = ctx.createRadialGradient(gx, gy, gr2 * 0.4, gx, gy, gr2 * 2.2);
    gg.addColorStop(0, hexA(BONE, 0.10));
    gg.addColorStop(1, hexA(BONE, 0));
    ctx.fillStyle = gg;
    ctx.fillRect(gx - gr2 * 2.2, gy - gr2 * 2.2, gr2 * 4.4, gr2 * 4.4);
    ctx.strokeStyle = hexA(BONE, 0.9);
    ctx.lineWidth = Math.max(1.5, H * 0.0022);
    ctx.beginPath(); ctx.moveTo(gx + gr2, gy); ctx.arc(gx, gy, gr2, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = hexA(BONE, 0.45);
    ctx.lineWidth = Math.max(1, H * 0.0012);
    ctx.beginPath(); ctx.moveTo(gx + gr2 * 0.62, gy); ctx.arc(gx, gy, gr2 * 0.62, 0, Math.PI * 2); ctx.stroke();
    if (dragging && liveDwell > 0 && liveRegion !== null) {
      ctx.strokeStyle = hexA(SUN, 0.95);
      ctx.lineWidth = Math.max(2, H * 0.003);
      ctx.beginPath();
      ctx.moveTo(gx + gr2, gy);
      ctx.arc(gx, gy, gr2, -Math.PI / 2, -Math.PI / 2 + (liveDwell / DWELL_NEED) * Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = hexA(BONE, 0.8);
    ctx.beginPath(); ctx.moveTo(gx + 2, gy); ctx.arc(gx, gy, 2, 0, Math.PI * 2); ctx.fill();

    // Plates: title top left, swatch count top right.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Texture Collector', 18, 34);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1928 · 2007 · 04 · 23', 18, 34 + fs2 + 8);

    ctx.textAlign = 'right';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(total + ' of 16 swatches', W - 18, 34);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = 'italic ' + fs2 + 'px Georgia, "Times New Roman", serif';
    var phase = (cycleIdx > 0 && ct < 4) ? 'the grid folds' : 'gathering the sky';
    ctx.fillText(phase, W - 18, 34 + fs2 + 8);
    ctx.textAlign = 'left';

    // Hint, centered just above the swatch strip, in bone over the water.
    ctx.fillStyle = hexA(BONE, 0.9);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    if (W < 560) {
      ctx.fillText('Drag to move the gaze.', W / 2, SY * H - 26);
      ctx.fillText('Linger to lift a swatch.', W / 2, SY * H - 8);
    } else {
      ctx.fillText('Drag to move the gaze. Linger to lift a swatch.', W / 2, SY * H - 14);
    }
    ctx.textAlign = 'left';
  }

  // QA hook: the probe harness drives draw() with a virtual clock.
  if (typeof window !== 'undefined') { window.__draw = draw; }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Drag only: no click-to-reload, no audio. All motion runs under 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
