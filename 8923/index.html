<!DOCTYPE html>
<html lang="utf-8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No8923 · Night Water</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0d; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// No8923 Night Water.
// Still water at night: soft blue-teal motes drift and breathe in the dark,
// a few wearing faint rings like plankton seen from below. Sparse, calm,
// deep. Click for another tide.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '8923', 10) || 8923;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}

const GROUND = '#0a0a0d';
let W = 0, H = 0, DPR = 1;
let motes = [];
let t = 0;
let mx = 0, my = 0, tmx = 0, tmy = 0;

function compose(s){
  const rnd = mulberry32(s);
  motes = [];
  const n = 85 + ((rnd() * 40) | 0);
  for (let i = 0; i < n; i++){
    // blue-teal family, matching the deep-water mood
    const hue = 186 + rnd() * 26;            // 186..212
    const sat = 28 + rnd() * 30;             // muted, not neon
    const lit = 42 + rnd() * 26;             // 42..68
    motes.push({
      x: rnd(), y: rnd(),
      z: 0.25 + rnd() * 0.75,                // depth for parallax + size
      r: 1.2 + Math.pow(rnd(), 2.2) * 7,      // few large, many small
      hue, sat, lit,
      alpha: 0.35 + rnd() * 0.5,
      ph: rnd() * Math.PI * 2,               // breathing phase
      br: 0.5 + rnd() * 1.4,                 // breathing rate
      vx: (rnd() - 0.5) * 0.00035,           // slow drift
      vy: (rnd() - 0.5) * 0.00035,
      ring: rnd() < 0.16,                    // faint ring around some
      ringR: 2.6 + rnd() * 2.2,
    });
  }
}

function sizeCanvas(){
  const [vw, vh] = viewportWH();
  const isPhone = (window.screen && Math.min(window.screen.width, window.screen.height) < 500)
    || (vw < 500 && vw < vh);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = vw; H = vh;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  return isPhone;
}

function frame(){
  t += 0.008;
  mx += (tmx - mx) * 0.04;
  my += (tmy - my) * 0.04;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  for (const m of motes){
    m.x += m.vx; m.y += m.vy;
    if (m.x < -0.03) m.x = 1.03; if (m.x > 1.03) m.x = -0.03;
    if (m.y < -0.03) m.y = 1.03; if (m.y > 1.03) m.y = -0.03;
    m.ph += 0.008 * m.br;

    const breathe = 0.72 + 0.28 * Math.sin(m.ph);
    const px = m.x * W + mx * 34 * m.z;
    const py = m.y * H + my * 34 * m.z;
    const rr = m.r * (0.55 + 0.65 * m.z) * (0.85 + 0.3 * breathe);
    const a = m.alpha * (0.6 + 0.4 * breathe);

    // soft glow
    const g = ctx.createRadialGradient(px, py, 0, px, py, rr * 4);
    g.addColorStop(0, 'hsla(' + m.hue + ',' + m.sat + '%,' + m.lit + '%,' + (0.32 * a).toFixed(3) + ')');
    g.addColorStop(1, 'hsla(' + m.hue + ',' + m.sat + '%,' + m.lit + '%,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, rr * 4, 0, 6.2832); ctx.fill();

    // core
    ctx.fillStyle = 'hsla(' + m.hue + ',' + (m.sat + 8) + '%,' + Math.min(m.lit + 14, 82) + '%,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(px, py, rr, 0, 6.2832); ctx.fill();

    // faint ring on some
    if (m.ring){
      ctx.strokeStyle = 'hsla(' + m.hue + ',' + m.sat + '%,' + m.lit + '%,' + (0.28 * a).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(px, py, rr * m.ringR * (0.9 + 0.2 * breathe), 0, 6.2832); ctx.stroke();
    }
  }
  requestAnimationFrame(frame);
}

addEventListener('pointermove', function(e){
  tmx = e.clientX / W - 0.5;
  tmy = e.clientY / H - 0.5;
});
addEventListener('click', function(){
  seed = (Math.random() * 1e9) | 0;
  compose(seed);
});
addEventListener('resize', sizeCanvas);

sizeCanvas();
compose(seed);
frame();
</script>
</body>
</html>
