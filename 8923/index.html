<!DOCTYPE html>
<html lang="utf-8">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No8923 · Night Water</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0d; touch-action:none; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
#stage { position:fixed; inset:0; display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// No8923 Night Water.
// Still water at night: soft blue-teal motes drift and breathe in the dark,
// a few wearing faint rings like plankton seen from below. Sparse, calm,
// deep. Touch the water and the motes stir around your fingers, then settle
// back to their drift. Double-tap for another tide.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '8923', 10) || 8923;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}

const GROUND = '#0a0a0d';
let W = 0, H = 0, DPR = 1;
let motes = [];
let t = 0;
let mx = 0, my = 0, tmx = 0, tmy = 0;

// Active touch/pointer currents: id -> {nx, ny, px, py, vx, vy}
const currents = new Map();

function compose(s){
  const rnd = mulberry32(s);
  motes = [];
  const n = 85 + ((rnd() * 40) | 0);
  for (let i = 0; i < n; i++){
    // blue-teal family, matching the deep-water mood
    const hue = 186 + rnd() * 26;            // 186..212
    const sat = 28 + rnd() * 30;             // muted, not neon
    const lit = 42 + rnd() * 26;             // 42..68
    motes.push({
      x: rnd(), y: rnd(),
      z: 0.25 + rnd() * 0.75,                // depth for parallax + size
      r: 1.2 + Math.pow(rnd(), 2.2) * 7,      // few large, many small
      hue, sat, lit,
      alpha: 0.35 + rnd() * 0.5,
      ph: rnd() * Math.PI * 2,               // breathing phase
      br: 0.5 + rnd() * 1.4,                 // breathing rate
      vx: (rnd() - 0.5) * 0.00035,           // slow drift
      vy: (rnd() - 0.5) * 0.00035,
      ix: 0, iy: 0,                          // interaction velocity
      ring: rnd() < 0.16,                    // faint ring around some
      ringR: 2.6 + rnd() * 2.2,
    });
  }
}

function sizeCanvas(){
  const [vw, vh] = viewportWH();
  const isPhone = (window.screen && Math.min(window.screen.width, window.screen.height) < 500)
    || (vw < 500 && vw < vh);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = vw; H = vh;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  return isPhone;
}

function normPos(e){
  return [e.clientX / W, e.clientY / H];
}

function stir(){
  // Apply each active current to nearby motes, then advance pointer state.
  for (const m of motes){
    for (const c of currents.values()){
      const dx = m.x - c.nx, dy = m.y - c.ny;
      const R = 0.17;
      const d2 = dx * dx + dy * dy;
      if (d2 < R * R){
        const d = Math.sqrt(d2) || 0.0001;
        const fall = 1 - d / R;
        const f2 = fall * fall;
        // carry along with the finger's movement (stirring)
        m.ix += c.vx * f2 * 1.4;
        m.iy += c.vy * f2 * 1.4;
        // gentle outward displacement, like parting water
        m.ix += (dx / d) * f2 * 0.0016;
        m.iy += (dy / d) * f2 * 0.0016;
      }
    }
    // decay interaction velocity back toward the base drift
    m.ix *= 0.94; m.iy *= 0.94;
    // clamp so a fast swipe can't fling motes off-screen
    const sp2 = m.ix * m.ix + m.iy * m.iy;
    if (sp2 > 0.0004){
      const k = 0.02 / Math.sqrt(sp2);
      m.ix *= k; m.iy *= k;
    }
  }
  for (const c of currents.values()){
    c.vx = (c.nx - c.px) * 0.85;   // ease toward measured velocity
    c.vy = (c.ny - c.py) * 0.85;
    c.px = c.nx; c.py = c.ny;
  }
}

function frame(){
  t += 0.008;
  mx += (tmx - mx) * 0.04;
  my += (tmy - my) * 0.04;

  stir();

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  for (const m of motes){
    m.x += m.vx + m.ix; m.y += m.vy + m.iy;
    if (m.x < -0.03) m.x = 1.03; if (m.x > 1.03) m.x = -0.03;
    if (m.y < -0.03) m.y = 1.03; if (m.y > 1.03) m.y = -0.03;
    m.ph += 0.008 * m.br;

    const breathe = 0.72 + 0.28 * Math.sin(m.ph);
    const px = m.x * W + mx * 34 * m.z;
    const py = m.y * H + my * 34 * m.z;
    const rr = m.r * (0.55 + 0.65 * m.z) * (0.85 + 0.3 * breathe);
    const a = m.alpha * (0.6 + 0.4 * breathe);

    // soft glow
    const g = ctx.createRadialGradient(px, py, 0, px, py, rr * 4);
    g.addColorStop(0, 'hsla(' + m.hue + ',' + m.sat + '%,' + m.lit + '%,' + (0.32 * a).toFixed(3) + ')');
    g.addColorStop(1, 'hsla(' + m.hue + ',' + m.sat + '%,' + m.lit + '%,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, rr * 4, 0, 6.2832); ctx.fill();

    // core
    ctx.fillStyle = 'hsla(' + m.hue + ',' + (m.sat + 8) + '%,' + Math.min(m.lit + 14, 82) + '%,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(px, py, rr, 0, 6.2832); ctx.fill();

    // faint ring on some
    if (m.ring){
      ctx.strokeStyle = 'hsla(' + m.hue + ',' + m.sat + '%,' + m.lit + '%,' + (0.28 * a).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(px, py, rr * m.ringR * (0.9 + 0.2 * breathe), 0, 6.2832); ctx.stroke();
    }
  }
  requestAnimationFrame(frame);
}

// Desktop hover parallax (touch drags also nudge it, eases back after)
addEventListener('pointermove', function(e){
  tmx = e.clientX / W - 0.5;
  tmy = e.clientY / H - 0.5;
  const c = currents.get(e.pointerId);
  if (c){
    const p = normPos(e);
    c.nx = p[0]; c.ny = p[1];
  }
});

addEventListener('pointerdown', function(e){
  const p = normPos(e);
  currents.set(e.pointerId, { nx: p[0], ny: p[1], px: p[0], py: p[1], vx: 0, vy: 0 });
});

function endCurrent(e){
  currents.delete(e.pointerId);
  // ease parallax back to center when the last finger lifts
  if (currents.size === 0){ tmx = 0; tmy = 0; }
}
addEventListener('pointerup', endCurrent);
addEventListener('pointercancel', endCurrent);

// Double-tap for a new tide (single taps only stir the water)
let lastTapT = 0, lastTapX = 0, lastTapY = 0;
addEventListener('pointerup', function(e){
  if (!e.isPrimary) return;
  const now = performance.now();
  const dt = now - lastTapT;
  const dd = Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY);
  if (dt < 350 && dd < 48){
    seed = (Math.random() * 1e9) | 0;
    compose(seed);
    lastTapT = 0;
  } else {
    lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
  }
});
addEventListener('contextmenu', function(e){ e.preventDefault(); });
addEventListener('resize', sizeCanvas);

sizeCanvas();
compose(seed);
frame();
</script>
</body>
</html>
