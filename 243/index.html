<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.243 Blue Punch</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#8A8378; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.243 Blue Punch (Avantika Bawa). After Blue Scaffolds in
// Zbayul, Ladakh 2026: a deep blue scaffold crushed into the
// floor of a V shaped gorge in browns and greys, packed so dense
// the poles interpenetrate and the top mass bulges as if about
// to burst. The fills follow her Ladakh rule, logs in sets of
// three, decreasing in size as they climb. The whole mass
// breathes on a twenty second loop, tightening and brightening
// as it inhales, relaxing dim as it exhales. Dust motes drift
// in the gorge air. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DEEP = '#1450C8', PALE = '#7FB2F0', BROWN = '#5C4A3A', GREY = '#8A8378';
var SHADOW = '#141210', SKY = '#8696A8';
var W = 0, H = 0, phone = false;
var T = 10, lastNow = -1; // frame one: mid exhale, mass relaxed and bulging

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Dust motes, seeded once.
var MOTES = [];
(function () {
  var r = rng(24311);
  for (var i = 0; i < 26; i++) {
    MOTES.push({ x: 390 + r() * 420, y: 390 + r() * 380, p: r() * 6.28, q: r() * 6.28 });
  }
})();
// Burst poles poking out of the top of the mass, seeded once.
var BURSTS = [];
(function () {
  var r = rng(24377);
  for (var i = 0; i < 6; i++) {
    BURSTS.push({ c: 0.6 + r() * 4.8, a: -0.5 + r() * 1.0, len: 34 + r() * 42 });
  }
})();

var COLS = 6, LEVELS = 6, FLOOR = 800, CX = 600;

function draw() {
  ctx.fillStyle = GREY;
  ctx.fillRect(0, 0, W, H);
  var s = Math.min(W / 1200, H / 850);
  ctx.save();
  ctx.translate((W - 1200 * s) / 2, (H - 850 * s) / 2);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.rect(0, 0, 1200, 850);
  ctx.clip();

  // sky slit
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, 1200, 60);
  // gorge walls
  ctx.fillStyle = BROWN;
  ctx.beginPath();
  ctx.moveTo(0, 40); ctx.lineTo(430, 120); ctx.lineTo(585, 850); ctx.lineTo(0, 850);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(1200, 30); ctx.lineTo(790, 110); ctx.lineTo(615, 850); ctx.lineTo(1200, 850);
  ctx.closePath();
  ctx.fill();
  // rock facets
  ctx.fillStyle = 'rgba(138,131,120,0.5)';
  ctx.beginPath();
  ctx.moveTo(60, 300); ctx.lineTo(300, 210); ctx.lineTo(470, 520); ctx.lineTo(240, 560);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(1140, 280); ctx.lineTo(920, 200); ctx.lineTo(760, 500); ctx.lineTo(990, 540);
  ctx.closePath();
  ctx.fill();
  // gorge shadow, inner edges and floor
  ctx.fillStyle = 'rgba(20,18,16,0.5)';
  ctx.beginPath();
  ctx.moveTo(430, 120); ctx.lineTo(585, 850); ctx.lineTo(520, 850); ctx.lineTo(398, 300);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(790, 110); ctx.lineTo(615, 850); ctx.lineTo(684, 850); ctx.lineTo(820, 290);
  ctx.closePath();
  ctx.fill();
  ctx.save();
  ctx.translate(CX, 806);
  ctx.scale(1, 0.16);
  ctx.beginPath();
  ctx.arc(0, 0, 300, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // breath: b = -1 full exhale .. +1 full inhale
  var b = Math.sin(2 * Math.PI * T / 20);
  var inh = (b + 1) / 2, exh = 1 - inh;
  var lh = 52 * (1 - 0.06 * inh); // levels compress a touch on the inhale
  function hw(l) {
    var f = l / LEVELS;
    var base = 232 * (1 - f) + 232 * (0.64 + 0.30 * exh) * f;
    return base + 36 * Math.sin(Math.PI * f) * (0.4 + 0.6 * exh);
  }
  function nx(c, l) { return CX + (c - COLS / 2) / (COLS / 2) * hw(l); }
  function ny(l) { return FLOOR - l * lh; }

  var poleCol = mix(DEEP, PALE, 0.10 + 0.40 * inh);
  var diagCol = mix(DEEP, PALE, 0.05 + 0.25 * inh);
  ctx.lineCap = 'round';

  // diagonals, angle offset by the compression
  var shift = (inh - 0.5) * 16;
  ctx.strokeStyle = diagCol;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  for (var c = 0; c < COLS; c++) {
    for (var l = 0; l < LEVELS; l++) {
      if ((c + l) % 2 === 0) {
        ctx.moveTo(nx(c, l), ny(l));
        ctx.lineTo(nx(c + 1, l + 1) + shift, ny(l + 1));
      } else {
        ctx.moveTo(nx(c + 1, l), ny(l));
        ctx.lineTo(nx(c, l + 1) + shift, ny(l + 1));
      }
    }
  }
  ctx.stroke();

  // verticals, extended a few units past each node so the poles
  // interpenetrate, as packed poles do
  ctx.strokeStyle = poleCol;
  ctx.lineWidth = 6;
  ctx.beginPath();
  for (var c2 = 0; c2 <= COLS; c2++) {
    for (var l2 = 0; l2 < LEVELS; l2++) {
      var x1 = nx(c2, l2), y1 = ny(l2), x2 = nx(c2, l2 + 1), y2 = ny(l2 + 1);
      var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var ex = dx / len * 7, ey = dy / len * 7;
      ctx.moveTo(x1 - ex, y1 - ey);
      ctx.lineTo(x2 + ex, y2 + ey);
    }
  }
  ctx.stroke();

  // horizontals
  ctx.lineWidth = 5;
  ctx.beginPath();
  for (var l3 = 0; l3 <= LEVELS; l3++) {
    ctx.moveTo(nx(0, l3), ny(l3));
    ctx.lineTo(nx(COLS, l3), ny(l3));
  }
  ctx.stroke();

  // log fills: sets of three per bay cell, each set shrinking
  // by 0.82 within itself and again as the sets climb
  ctx.strokeStyle = 'rgba(127,178,240,0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (var c3 = 0; c3 < COLS; c3++) {
    for (var l4 = 0; l4 < LEVELS; l4++) {
      var cellW = nx(c3 + 1, l4) - nx(c3, l4);
      var midX = (nx(c3, l4) + nx(c3 + 1, l4)) / 2;
      var topY = ny(l4 + 1) + 9;
      for (var j = 0; j < 3; j++) {
        var len2 = cellW * 0.62 * Math.pow(0.82, j) * Math.pow(0.95, l4);
        var yy = topY + j * 8;
        if (yy < ny(l4) - 4) {
          ctx.moveTo(midX - len2 / 2, yy);
          ctx.lineTo(midX + len2 / 2, yy);
        }
      }
    }
  }
  ctx.stroke();

  // burst poles above the top
  ctx.strokeStyle = mix(DEEP, PALE, 0.25 + 0.35 * inh);
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (var i2 = 0; i2 < BURSTS.length; i2++) {
    var bp = BURSTS[i2];
    var bx = nx(bp.c, LEVELS), by = ny(LEVELS);
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.sin(bp.a) * bp.len, by - Math.cos(bp.a) * bp.len);
  }
  ctx.stroke();

  // dust motes
  ctx.fillStyle = 'rgba(127,178,240,0.4)';
  for (var m = 0; m < MOTES.length; m++) {
    var mo = MOTES[m];
    var mx = mo.x + 14 * Math.sin(T * 0.11 + mo.p);
    var my = mo.y + 10 * Math.sin(T * 0.07 + mo.q);
    ctx.fillRect(mx, my, 2.4, 2.4);
  }

  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
