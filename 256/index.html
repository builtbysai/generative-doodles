<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.256 Yeti Hunter</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#14100E; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.256 Yeti Hunter (tanzinchospel.art). After his first
// ZBrush sculpt (Apr 2021): an elderly hunter's bust on
// black, long white beard, tattooed torso, dark robe, red
// sash and headwear, lit by one deep red spotlight. Built
// flat in canvas 2D: the light is a slow arc, and each
// region of skin, tattoo and beard brightens as the arc
// passes over it, so the tattooed planes catch the light
// in sequence. Dust motes hang in the beam. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var RED = '#C0392B', ROBE = '#14100E', SKIN = '#B98A5E', TAT = '#1A1A1A', BEARD = '#CFCFCF';
var DW = 1000, DH = 1100;
var W = 0, H = 0, phone = false;
var T = 4.1, lastNow = -1; // frame one: light mid arc, the right side lit

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// how lit a point is, given where the arc has swung the beam
function lightAt(x, arcX) { return clamp01(1 - Math.abs(x - arcX) / 400); }

// ---- beard strands: seeded flows from the jaw down the chest ----------------------
var beardStrands = [];
(function () {
  var r = rng(25613);
  for (var i = 0; i < 330; i++) {
    var f = (i + r() * 0.7) / 330;                 // 0 left .. 1 right of the beard
    var x0 = 372 + f * 256;
    var spread = Math.sin(f * Math.PI);            // longest at the centre
    beardStrands.push({
      x0: x0,
      y0: 428 + Math.abs(f - 0.5) * 60 + r() * 14,
      len: 190 + spread * 185 + r() * 60,
      bow: (f - 0.5) * 66 + (r() - 0.5) * 22,
      w: 1.6 + r() * 1.8
    });
  }
})();
// ---- tattoos: seeded dark strokes on the chest panels and shoulders ----------------
var tattoos = [];
(function () {
  var r = rng(25627);
  function scatter(cx, cy, w, h, n, kind) {
    for (var i = 0; i < n; i++) {
      tattoos.push({ x: cx + (r() - 0.5) * w, y: cy + (r() - 0.5) * h, s: 5 + r() * 9, rot: (r() - 0.5) * 0.9, kind: kind, rx: cx });
    }
  }
  scatter(352, 640, 120, 250, 42, 0);   // left chest: strokes
  scatter(648, 640, 120, 250, 42, 1);   // right chest: arcs
  scatter(258, 540, 110, 90, 22, 2);    // left shoulder: dots
  scatter(742, 540, 110, 90, 22, 2);    // right shoulder: dots
  for (var b = 0; b < 3; b++) {          // band rows across both panels
    for (var j = 0; j < 9; j++) {
      tattoos.push({ x: 300 + j * 13, y: 800 + b * 22, s: 6, rot: 0, kind: 3, rx: 352 });
      tattoos.push({ x: 596 + j * 13, y: 800 + b * 22, s: 6, rot: 0, kind: 3, rx: 648 });
    }
  }
})();
// ---- dust in the beam ------------------------------------------------------------------
var motes = [];
(function () {
  var r = rng(25641);
  for (var i = 0; i < 46; i++) {
    motes.push({ fx: r(), fy: r(), sz: 1.2 + r() * 1.9, ph: r() * Math.PI * 2, fall: 2.5 + r() * 4 });
  }
})();

function skinPath(cx, cy, w, h) { // a flat rounded plane of skin
  ctx.beginPath();
  ctx.ellipse(cx, cy, w, h, 0, 0, Math.PI * 2);
}

function draw() {
  ctx.fillStyle = ROBE;
  ctx.fillRect(0, 0, DW, DH);

  // the spotlight's arc: a 44 second swing, the beam's heart
  // crossing the bust; frame one catches it right of centre
  var arc = Math.sin(T * Math.PI * 2 / 44);
  var arcX = 500 + arc * 250;
  var srcX = 500 + arc * 430, srcY = -60;

  // the beam itself, layered translucent red, widest last
  var beamCols = [0.030, 0.045, 0.065];
  var beamHalf = [330, 235, 150];
  for (var b = 0; b < 3; b++) {
    ctx.fillStyle = rgba(RED, beamCols[b]);
    ctx.beginPath();
    ctx.moveTo(srcX - 26, srcY);
    ctx.lineTo(srcX + 26, srcY);
    ctx.lineTo(arcX + beamHalf[b], DH * 0.98);
    ctx.lineTo(arcX - beamHalf[b], DH * 0.98);
    ctx.closePath(); ctx.fill();
  }

  var litFace = lightAt(545, arcX);       // the face rides the arc, offset a touch
  var litL = lightAt(330, arcX), litR = lightAt(670, arcX);

  // ---- torso: robe mass first, a shape cut from the dark ---------------------
  ctx.fillStyle = mix(ROBE, TAT, 0.55);
  ctx.beginPath();
  ctx.moveTo(500, 452);
  ctx.bezierCurveTo(300, 470, 168, 560, 138, 760);
  ctx.lineTo(118, DH + 10);
  ctx.lineTo(DW - 118, DH + 10);
  ctx.lineTo(DW - 138, 760);
  ctx.bezierCurveTo(DW - 168, 560, 700, 470, 500, 452);
  ctx.closePath(); ctx.fill();
  // the robe's red-lit edges, only where the beam passes
  ctx.strokeStyle = rgba(RED, 0.16 + 0.5 * litL);
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(300, 500); ctx.bezierCurveTo(205, 585, 168, 690, 152, 830); ctx.stroke();
  ctx.strokeStyle = rgba(RED, 0.16 + 0.5 * litR);
  ctx.beginPath(); ctx.moveTo(700, 500); ctx.bezierCurveTo(795, 585, 832, 690, 848, 830); ctx.stroke();

  // ---- bare skin: neck, chest panels, shoulders --------------------------------
  var skinDim = mix(SKIN, ROBE, 0.52);
  var skinLit = mix(SKIN, RED, 0.28);
  function skinPlane(cx, cy, w, h, f) {
    skinPath(cx, cy, w, h);
    ctx.fillStyle = skinDim; ctx.fill();
    if (f > 0.02) { skinPath(cx, cy, w, h); ctx.fillStyle = rgba(skinLit, 0.16 + 0.62 * f); ctx.fill(); }
  }
  skinPlane(500, 452, 56, 52, litFace);            // neck
  skinPlane(272, 552, 78, 50, litL);               // left shoulder, tucked in
  skinPlane(728, 552, 78, 50, litR);               // right shoulder
  skinPlane(362, 655, 116, 178, litL);             // left chest panel
  skinPlane(638, 655, 116, 178, litR);             // right chest panel

  // ---- head ---------------------------------------------------------------------
  skinPath(500, 322, 104, 138);
  ctx.fillStyle = skinDim; ctx.fill();
  skinPath(500, 322, 104, 138);
  ctx.fillStyle = rgba(skinLit, 0.14 + 0.60 * litFace); ctx.fill();
  skinPath(396, 336, 17, 30); ctx.fillStyle = skinDim; ctx.fill();  // ears
  skinPath(604, 336, 17, 30); ctx.fillStyle = skinDim; ctx.fill();
  // brow shadow, closed eyes, nose: kept flat and quiet under the beard
  ctx.strokeStyle = rgba(TAT, 0.55);
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(446, 300); ctx.quadraticCurveTo(472, 293, 496, 299); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(504, 299); ctx.quadraticCurveTo(528, 293, 554, 300); ctx.stroke();
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(452, 330); ctx.quadraticCurveTo(472, 336, 492, 330); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(508, 330); ctx.quadraticCurveTo(528, 336, 548, 330); ctx.stroke();
  ctx.strokeStyle = rgba(TAT, 0.38);
  ctx.beginPath(); ctx.moveTo(501, 322); ctx.quadraticCurveTo(508, 352, 498, 362); ctx.stroke();

  // headwear: a deep red cap over the crown with its band,
  // lit on the arc's side
  ctx.fillStyle = mix(RED, ROBE, 0.38);
  ctx.beginPath();
  ctx.moveTo(398, 262);
  ctx.bezierCurveTo(404, 148, 596, 148, 602, 262);
  ctx.bezierCurveTo(530, 236, 470, 236, 398, 262);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = mix(RED, ROBE, 0.30);
  ctx.beginPath();
  ctx.moveTo(402, 268);
  ctx.bezierCurveTo(420, 178, 580, 178, 598, 268);
  ctx.bezierCurveTo(540, 240, 460, 240, 402, 268);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(RED, 0.10 + 0.38 * litFace);
  ctx.beginPath();
  ctx.moveTo(402, 268);
  ctx.bezierCurveTo(420, 178, 580, 178, 598, 268);
  ctx.bezierCurveTo(540, 240, 460, 240, 402, 268);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = mix(RED, ROBE, 0.18);             // the knot, hanging at the left
  ctx.beginPath(); ctx.ellipse(404, 292, 15, 30, 0.25, 0, Math.PI * 2); ctx.fill();

  // ---- the beard: 330 strands over the chest --------------------------------------
  ctx.lineCap = 'round';
  for (var i = 0; i < beardStrands.length; i++) {
    var st = beardStrands[i];
    var f = lightAt(st.x0, arcX);
    ctx.strokeStyle = rgba(BEARD, 0.26 + 0.68 * f);
    ctx.lineWidth = st.w;
    ctx.beginPath();
    ctx.moveTo(st.x0, st.y0);
    ctx.quadraticCurveTo(st.x0 + st.bow * 0.4, st.y0 + st.len * 0.55, st.x0 + st.bow, st.y0 + st.len);
    ctx.stroke();
  }

  // ---- tattoos, surfacing where the light is ---------------------------------------
  for (var j = 0; j < tattoos.length; j++) {
    var tt = tattoos[j];
    var tf = lightAt(tt.rx, arcX);
    ctx.strokeStyle = rgba(TAT, 0.10 + 0.82 * tf);
    ctx.fillStyle = rgba(TAT, 0.10 + 0.82 * tf);
    ctx.lineWidth = 2.4;
    ctx.save();
    ctx.translate(tt.x, tt.y);
    ctx.rotate(tt.rot);
    if (tt.kind === 0) { ctx.beginPath(); ctx.moveTo(-tt.s, 0); ctx.lineTo(tt.s, 0); ctx.stroke(); }
    else if (tt.kind === 1) { ctx.beginPath(); ctx.arc(0, 0, tt.s * 0.7, 0.3, Math.PI * 1.5); ctx.stroke(); }
    else if (tt.kind === 2) { ctx.beginPath(); ctx.arc(0, 0, tt.s * 0.32, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(-tt.s, 0); ctx.lineTo(0, -tt.s * 0.7); ctx.lineTo(tt.s, 0); ctx.stroke(); }
    ctx.restore();
  }

  // ---- the sash, a red diagonal over the robe's lower half ----------------------------
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(238, 838); ctx.lineTo(762, 838); ctx.lineTo(762, DH); ctx.lineTo(238, DH);
  ctx.closePath(); ctx.clip();
  ctx.fillStyle = mix(RED, ROBE, 0.34);
  ctx.beginPath();
  ctx.moveTo(300, DH + 6); ctx.lineTo(716, 806); ctx.lineTo(764, 858); ctx.lineTo(348, DH + 6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(RED, 0.08 + 0.30 * lightAt(560, arcX));
  ctx.beginPath();
  ctx.moveTo(300, DH + 6); ctx.lineTo(716, 806); ctx.lineTo(764, 858); ctx.lineTo(348, DH + 6);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // ---- dust motes, only inside the beam ------------------------------------------------
  for (var m = 0; m < motes.length; m++) {
    var mo = motes[m];
    var mx = arcX + (mo.fx - 0.5) * 560 + Math.sin(T * 0.3 + mo.ph) * 14;
    var my = ((mo.fy * DH + T * mo.fall) % (DH * 0.96));
    var mf = lightAt(mx, arcX);
    if (mf <= 0.03) continue;
    ctx.fillStyle = rgba(BEARD, (0.05 + 0.30 * mf) * (0.6 + 0.4 * Math.sin(T * 0.8 + mo.ph)));
    ctx.beginPath(); ctx.arc(mx, my, mo.sz, 0, Math.PI * 2); ctx.fill();
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = ROBE;
  ctx.fillRect(0, 0, W, H);
  // contain-fit: the bust keeps its shape, centred in the void
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
