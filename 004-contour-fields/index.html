<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№004 · Contour Fields — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14120d;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 600px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #a33b2e; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #f1ebdb;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #a33b2e; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№004</span> · Contour Fields</h1>
  <p>Imaginary terrain traced one contour at a time, each line drawn a little
  unsteadily so it reads as hand inked. The lines crowd together where the
  ground rises steep. <b>Click the piece for a new variation.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 424242;

const PAPER = "#f1ebdb";
const INK = "#2a251c";
const TAU = Math.PI * 2;

// small 2D value-noise
function makeNoise(rnd, size){
  size = size || 256;
  const g = new Float32Array(size * size);
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  const at = (x, y) => g[(((x % size) + size) % size) + (((y % size) + size) % size) * size];
  const sm = t => t * t * (3 - 2 * t);
  return function(x, y){
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    const u = sm(xf), v = sm(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbmFactory(noise, oct){
  return function(x, y){
    let v = 0, amp = 0.5, f = 1, norm = 0;
    for (let o = 0; o < oct; o++){
      v += amp * noise(x * f, y * f);
      norm += amp; amp *= 0.5; f *= 2.03;
    }
    return v / norm;
  };
}
// deterministic hash for per-segment variation
function hash2(x, y){
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function draw(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  canvas.width = S * dpr; canvas.height = S * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  const rnd = mulberry32(seed);
  const noise = makeNoise(rnd);
  const wobN = makeNoise(mulberry32(seed ^ 0x9e37));
  const fbm = fbmFactory(noise, 4);

  // paper
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, S, S);

  const M = S * 0.075;
  const x0 = M, y0 = M, W = S - 2 * M, H = S - 2 * M;

  // ---- scalar field: domain-warped fbm + gaussian hills ----
  const warpAmt = 0.55 + rnd() * 0.75;
  const fScale = (1.6 + rnd() * 1.3) / S;
  const wScale = (2.6 + rnd() * 1.6) / S;
  const ox1 = rnd() * 40, oy1 = rnd() * 40, ox2 = rnd() * 40, oy2 = rnd() * 40;

  const hills = [];
  const nHills = 2 + ((rnd() * 3) | 0); // 2..4
  for (let i = 0; i < nHills; i++){
    hills.push({
      x: 0.22 + rnd() * 0.56,
      y: 0.22 + rnd() * 0.56,
      r: 0.13 + rnd() * 0.20,
      h: (i === 0 ? 0.34 + rnd() * 0.22 : 0.16 + rnd() * 0.22) * (rnd() < 0.22 ? -1 : 1)
    });
  }

  const NX = 132, NY = 132;
  const field = new Float32Array((NX + 1) * (NY + 1));
  let fmin = Infinity, fmax = -Infinity;
  for (let j = 0; j <= NY; j++){
    for (let i = 0; i <= NX; i++){
      const u = i / NX, v = j / NY; // 0..1 across print area
      const qx = fbm(u * S * wScale + ox1, v * S * wScale + oy1);
      const qy = fbm(u * S * wScale + ox2, v * S * wScale + oy2);
      let f = fbm((u * S + (qx - 0.5) * S * warpAmt) * fScale + ox1,
                  (v * S + (qy - 0.5) * S * warpAmt) * fScale + oy1);
      f = f * 0.62;
      for (const h of hills){
        const dx = u - h.x, dy = v - h.y;
        f += h.h * Math.exp(-(dx * dx + dy * dy) / (h.r * h.r));
      }
      const idx = j * (NX + 1) + i;
      field[idx] = f;
      if (f < fmin) fmin = f;
      if (f > fmax) fmax = f;
    }
  }

  // ---- marching squares ----
  const NLEV = 15 + ((rnd() * 5) | 0); // 15..19 levels
  const LO = fmin + (fmax - fmin) * 0.055;
  const HI = fmax - (fmax - fmin) * 0.055;
  const cw = W / NX, ch = H / NY;

  // deterministic hand wobble, positional so shared vertices stay joined
  const wobAmp = Math.max(0.8, S * 0.0021);
  function wobX(px, py){ return (wobN(px * 0.021 + 3.7, py * 0.021 + 9.2) - 0.5) * 2 * wobAmp; }
  function wobY(px, py){ return (wobN(px * 0.019 + 13.1, py * 0.019 + 5.4) - 0.5) * 2 * wobAmp; }

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = INK;

  const skipP = 0.045; // ink-skip probability per segment
  for (let li = 0; li < NLEV; li++){
    const L = LO + (HI - LO) * (li / (NLEV - 1));
    const isIndex = (li % 5 === 2);
    const baseW = isIndex ? Math.max(1.5, S * 0.0024) : Math.max(0.9, S * 0.0013);
    const baseA = isIndex ? 0.80 : 0.60;
    // 3 alpha buckets per level: one path each (fast)
    const paths = [[], [], []];
    for (let j = 0; j < NY; j++){
      for (let i = 0; i < NX; i++){
        const a = field[j * (NX + 1) + i];
        const b = field[j * (NX + 1) + i + 1];
        const c = field[(j + 1) * (NX + 1) + i + 1];
        const d = field[(j + 1) * (NX + 1) + i];
        let idx = 0;
        if (a > L) idx |= 8;
        if (b > L) idx |= 4;
        if (c > L) idx |= 2;
        if (d > L) idx |= 1;
        if (idx === 0 || idx === 15) continue;
        // edge interpolation points (in print-area coords)
        const x = x0 + i * cw, y = y0 + j * ch;
        const top = [x + cw * ((L - a) / (b - a)), y];
        const right = [x + cw, y + ch * ((L - b) / (c - b))];
        const bottom = [x + cw * ((L - d) / (c - d)), y + ch];
        const left = [x, y + ch * ((L - a) / (d - a))];
        const segs = [];
        switch (idx){
          case 1: case 14: segs.push([left, bottom]); break;
          case 2: case 13: segs.push([bottom, right]); break;
          case 3: case 12: segs.push([left, right]); break;
          case 4: case 11: segs.push([top, right]); break;
          case 6: case 9: segs.push([top, bottom]); break;
          case 7: case 8: segs.push([left, top]); break;
          case 5: {
            const m = (a + b + c + d) / 4;
            if (m > L){ segs.push([left, top]); segs.push([right, bottom]); }
            else { segs.push([top, right]); segs.push([bottom, left]); }
            break;
          }
          case 10: {
            const m = (a + b + c + d) / 4;
            if (m > L){ segs.push([top, right]); segs.push([bottom, left]); }
            else { segs.push([left, top]); segs.push([right, bottom]); }
            break;
          }
        }
        for (const s of segs){
          const mx = (s[0][0] + s[1][0]) / 2, my = (s[0][1] + s[1][1]) / 2;
          if (hash2(mx * 0.37 + li * 11.3, my * 0.41) < skipP) continue; // ink skip
          const bucket = (hash2(mx * 1.7, my * 2.3 + li) * 3) | 0;
          paths[bucket].push(s);
        }
      }
    }
    ctx.lineWidth = baseW;
    const alphas = [baseA * 0.72, baseA * 0.92, Math.min(baseA * 1.12, 0.92)];
    for (let bI = 0; bI < 3; bI++){
      const segs = paths[bI];
      if (!segs.length) continue;
      ctx.globalAlpha = alphas[bI];
      ctx.beginPath();
      for (const s of segs){
        ctx.moveTo(s[0][0] + wobX(s[0][0], s[0][1]), s[0][1] + wobY(s[0][0], s[0][1]));
        ctx.lineTo(s[1][0] + wobX(s[1][0], s[1][1]), s[1][1] + wobY(s[1][0], s[1][1]));
      }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // ---- quiet wobbly hairline frame ----
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.28;
  ctx.lineWidth = Math.max(1, S * 0.0014);
  ctx.beginPath();
  const steps = 110, inset = M * 0.45;
  for (let e = 0; e < 4; e++){
    for (let i = 0; i <= steps; i++){
      const t = i / steps;
      let X, Y;
      const wob = (wobN(t * 9 + e * 37, inset * 0.4) - 0.5) * 4 * (S / 760);
      if (e === 0){ X = x0 - inset + t * (W + 2 * inset); Y = y0 - inset + wob; }
      else if (e === 1){ X = x0 + W + inset + wob; Y = y0 - inset + t * (H + 2 * inset); }
      else if (e === 2){ X = x0 + W + inset - t * (W + 2 * inset); Y = y0 + H + inset + wob; }
      else { X = x0 - inset + wob; Y = y0 + H + inset - t * (H + 2 * inset); }
      if (e === 0 && i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
  }
  ctx.closePath();
  ctx.stroke();
  ctx.globalAlpha = 1;

  // ---- analogue grain ----
  const rnd2 = mulberry32(seed ^ 0x51f);
  for (let i = 0; i < 4200; i++){
    const gx = rnd2() * S, gy = rnd2() * S;
    ctx.globalAlpha = 0.03 + rnd2() * 0.05;
    ctx.fillStyle = rnd2() < 0.6 ? "#4a4438" : "#ffffff";
    const gs = 0.8 + rnd2() * 1.2;
    ctx.fillRect(gx, gy, gs, gs);
  }
  ctx.globalAlpha = 1;

  // soft vignette
  const vg = ctx.createRadialGradient(S/2, S/2, S*0.40, S/2, S/2, S*0.80);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(74,64,46,0.10)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, S, S);
}

document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  draw();
});
window.addEventListener("resize", draw);
draw();
</script>
</body>
</html>
