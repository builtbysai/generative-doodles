<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squares That Tremble</title>
<style>
html, body { margin: 0; padding: 0; background: #070708; overflow: hidden; }
canvas { display: block; }
.copy { position: fixed; left: 14px; z-index: 2; pointer-events: none;
  font: 12px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif;
  color: #8AB8D8; opacity: 0.65; letter-spacing: 0.04em; }
.copy.title { top: 12px; }
.copy.hint { bottom: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="copy title">Squares That Tremble &middot; 2006 &middot; 05 &middot; 25</div>
<div class="copy hint">Tap for a new grid.</div>
<script>
(function () {
var TAU = Math.PI * 2;
var BG = [7, 7, 8];
var SAGE = [122, 184, 154];
var PALE = [184, 216, 184];
var TEAL = [78, 122, 154];
var DUSTY = [138, 184, 216];
var VIOLET = [122, 90, 154];
var STOPS = [
  [0.00, SAGE],
  [0.25, PALE],
  [0.50, TEAL],
  [0.75, DUSTY],
  [1.00, VIOLET]
];
var COLS = 12, ROWS = 16, NCELL = COLS * ROWS;
var BASE_SEED = 1595000, SEED_STEP = 7919;
var SLOT_SIZE = [0.44, 0.37, 0.30, 0.23, 0.16, 0.10];
var TWEEN_MS = 2000;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(p) {
  if (p <= 0) return 0;
  if (p >= 1) return 1;
  return p * p * (3 - 2 * p);
}
function lerp(a, b, p) { return a + (b - a) * p; }
function mix3(c1, c2, p) {
  return [lerp(c1[0], c2[0], p), lerp(c1[1], c2[1], p), lerp(c1[2], c2[2], p)];
}
function rampColor(t) {
  t = clamp01(t);
  for (var i = 0; i < STOPS.length - 1; i++) {
    var t0 = STOPS[i][0], t1 = STOPS[i + 1][0];
    if (t >= t0 && t <= t1) {
      var p = (t - t0) / (t1 - t0);
      return mix3(STOPS[i][1], STOPS[i + 1][1], p);
    }
  }
  return STOPS[STOPS.length - 1][1];
}
function shadeColor(c, s) {
  if (s >= 0) return mix3(c, [255, 255, 255], s);
  return mix3(c, [0, 0, 0], -s);
}
function rgb(c) {
  return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
}

/* Build one full grid configuration from a fixed seed. Every number in the
   config comes from the seeded RNG; unseeded randomness is never used. */
function buildConfig(seed) {
  var rng = mulberry32(seed);
  var cfg = { rampShift: (rng() * 2 - 1) * 0.12, cells: [] };
  for (var i = 0; i < NCELL; i++) {
    var n = 4 + Math.floor(rng() * 3);
    var cell = { rampJit: (rng() * 2 - 1) * 0.03, slots: [] };
    for (var k = 0; k < 6; k++) {
      var j = [];
      for (var c = 0; c < 8; c++) j.push((rng() * 2 - 1) * 0.055);
      cell.slots.push({
        size: SLOT_SIZE[k] + (rng() * 2 - 1) * 0.015,
        rot: (rng() * 2 - 1) * 0.08,
        j: j,
        shade: (rng() * 2 - 1) * 0.12,
        w: k < n ? 1 : 0
      });
    }
    cfg.cells.push(cell);
  }
  return cfg;
}
function lerpConfig(a, b, p) {
  var cfg = { rampShift: lerp(a.rampShift, b.rampShift, p), cells: [] };
  for (var i = 0; i < NCELL; i++) {
    var cell = { rampJit: lerp(a.cells[i].rampJit, b.cells[i].rampJit, p), slots: [] };
    for (var k = 0; k < 6; k++) {
      var sa = a.cells[i].slots[k], sb = b.cells[i].slots[k];
      var j = [];
      for (var c = 0; c < 8; c++) j.push(lerp(sa.j[c], sb.j[c], p));
      cell.slots.push({
        size: lerp(sa.size, sb.size, p),
        rot: lerp(sa.rot, sb.rot, p),
        j: j,
        shade: lerp(sa.shade, sb.shade, p),
        w: lerp(sa.w, sb.w, p)
      });
    }
    cfg.cells.push(cell);
  }
  return cfg;
}

/* Seed from ?seed=N (QA harness) or tap count 0 at load. */
var tapCount = 0;
if (typeof location !== 'undefined' && location.search) {
  var m = location.search.match(/seed=(\d+)/);
  if (m) tapCount = parseInt(m[1], 10);
}
var cur = buildConfig(BASE_SEED + tapCount * SEED_STEP);
var displayed = cur;
var fromCfg = null, toCfg = null, tweenStart = 0, tweening = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia &&
    typeof window.matchMedia === 'function') {
  reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0;

function isPhone() {
  if (typeof window !== 'undefined' && window.screen) {
    var minD = Math.min(window.screen.width, window.screen.height);
    if (minD < 700) return true;
    if (window.screen.height > window.screen.width * 1.15) return true;
  }
  return false;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function gridGeo() {
  var minDim = Math.min(VW, VH);
  var m = isPhone() ? 8 : 0.05 * minDim;
  var cell = Math.min((VW - 2 * m) / COLS, (VH - 2 * m) / ROWS);
  var gw = cell * COLS, gh = cell * ROWS;
  return { cell: cell, ox: (VW - gw) / 2, oy: (VH - gh) / 2 };
}

function drawSquare(cx, cy, half, rot, j) {
  var c = Math.cos(rot), s = Math.sin(rot);
  var pts = [];
  var base = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  for (var i = 0; i < 4; i++) {
    var lx = base[i][0] * half + j[i * 2] * half * 2;
    var ly = base[i][1] * half + j[i * 2 + 1] * half * 2;
    pts.push([cx + lx * c - ly * s, cy + lx * s + ly * c]);
  }
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var k = 1; k < 4; k++) ctx.lineTo(pts[k][0], pts[k][1]);
  ctx.closePath();
  ctx.stroke();
}

function draw() {
  size();
  var g = gridGeo();
  ctx.fillStyle = rgb(BG);
  ctx.fillRect(0, 0, VW, VH);
  var cfg = displayed;
  ctx.lineJoin = 'miter';
  ctx.lineWidth = Math.max(1, g.cell * 0.05);
  for (var i = 0; i < NCELL; i++) {
    var row = Math.floor(i / COLS), col = i % COLS;
    var cx = g.ox + (col + 0.5) * g.cell;
    var cy = g.oy + (row + 0.5) * g.cell;
    var cell = cfg.cells[i];
    var t = clamp01(col / (COLS - 1) + cell.rampJit + cfg.rampShift);
    var base = rampColor(t);
    for (var k = 0; k < 6; k++) {
      var sl = cell.slots[k];
      if (sl.w <= 0.01) continue;
      var a = Math.round(sl.w * 10000) / 10000;
      ctx.globalAlpha = a;
      ctx.strokeStyle = rgb(shadeColor(base, sl.shade));
      drawSquare(cx, cy, sl.size * g.cell, sl.rot, sl.j);
    }
  }
  ctx.globalAlpha = 1;
}

function reseed() {
  tapCount++;
  var target = buildConfig(BASE_SEED + tapCount * SEED_STEP);
  if (reduced) {
    cur = target; displayed = cur; tweening = false;
    draw();
    return;
  }
  fromCfg = displayed;
  toCfg = target;
  tweenStart = (typeof Date !== 'undefined' && Date.now) ? Date.now() : 0;
  tweening = true;
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(tweenLoop);
  else { cur = target; displayed = cur; tweening = false; draw(); }
}
function tweenLoop() {
  if (!tweening) return;
  var now = (typeof Date !== 'undefined' && Date.now) ? Date.now() : 0;
  var p = smooth((now - tweenStart) / TWEEN_MS);
  if (p >= 1) {
    cur = toCfg; displayed = cur; tweening = false;
    draw();
    return;
  }
  displayed = lerpConfig(fromCfg, toCfg, p);
  draw();
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(tweenLoop);
}

canvas.addEventListener('pointerdown', reseed);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', draw);
  }
  if (window.addEventListener) window.addEventListener('resize', draw);
}
draw();
})();
</script>
</body>
</html>
