<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phantom, Study for a Spectral Being</title>
<style>
html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#050505';
var PLATE = '#f2f0ea';
var INK = '#14141c';
var PHASE = 20;
var CYCLE = 48;
var DRIFT_A = 12, CONDENSE = 10, HOLD = 6, DISPERSE = 8, DRIFT_B = 12;
var NPART = 2400;
var NPOSES = 6;
var SEED = 20260727;
/* A statistical body condenses out of drifting particles, holds a
   breath, and disperses. Frame one is at t = 20 s, late condensation:
   the figure is mostly caught, with stragglers still streaming in. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var COOL = [226, 230, 235];
var WARM = [255, 233, 205];
var INK_RGB = hexRgb(INK);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Field rect: full-bleed on phones, the centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- pose table: six caught poses, index 0 at load ---- */
var POSES = [
  { side: 1, ang: -28, lean: 0.10, stance: 1.00, tilt: -0.05 },
  { side: -1, ang: -8, lean: -0.08, stance: 1.15, tilt: 0.06 },
  { side: 1, ang: 12, lean: 0.14, stance: 0.90, tilt: 0.03 },
  { side: -1, ang: 30, lean: -0.12, stance: 1.05, tilt: -0.08 },
  { side: 1, ang: 4, lean: 0.04, stance: 1.20, tilt: 0.08 },
  { side: -1, ang: -18, lean: -0.05, stance: 0.95, tilt: -0.03 }
];
/* Pose as segments in local units: origin at pelvis, y down, figure
   height 1.0 (head top -0.50 to feet +0.50). Each segment carries a
   warmth weight: torso and head warmest, legs coolest. */
function poseSegments(p) {
  var s = p.side, a = p.ang * Math.PI / 180, st = p.stance;
  var lean = function (x, y) { return x + p.lean * (y + 0.4) * 0.18; };
  var headC = { x: lean(0, -0.42) + p.tilt * 0.06, y: -0.42 };
  var neck = { x: lean(0, -0.33), y: -0.33 };
  var shE = { x: lean(s * 0.10, -0.30), y: -0.30 };
  var shH = { x: lean(-s * 0.10, -0.30), y: -0.30 };
  var hipC = { x: lean(0, 0.08), y: 0.08 };
  var hipL = { x: lean(-0.08 * st, 0.08), y: 0.08 };
  var hipR = { x: lean(0.08 * st, 0.08), y: 0.08 };
  var knL = { x: lean(-0.10 * st, 0.30), y: 0.30 };
  var knR = { x: lean(0.10 * st, 0.30), y: 0.30 };
  var ftL = { x: lean(-0.11 * st, 0.50), y: 0.50 };
  var ftR = { x: lean(0.11 * st, 0.50), y: 0.50 };
  var dir = { x: s * Math.cos(a), y: -Math.sin(a) };
  var elE = { x: shE.x + dir.x * 0.17, y: shE.y + dir.y * 0.17 };
  var haE = { x: shE.x + dir.x * 0.32, y: shE.y + dir.y * 0.32 };
  var elH = { x: lean(-s * 0.13, -0.12), y: -0.12 };
  var haH = { x: lean(-s * 0.11, 0.06), y: 0.06 };
  var segs = [];
  function seg(x1, y1, x2, y2, w) { segs.push({ x1: x1, y1: y1, x2: x2, y2: y2, w: w }); }
  seg(neck.x, neck.y, hipC.x, hipC.y, 1.2);
  seg(shH.x, shH.y, shE.x, shE.y, 0.9);
  seg(hipL.x, hipL.y, hipR.x, hipR.y, 0.8);
  seg(shE.x, shE.y, elE.x, elE.y, 1.1);
  seg(elE.x, elE.y, haE.x, haE.y, 1.1);
  seg(shH.x, shH.y, elH.x, elH.y, 0.8);
  seg(elH.x, elH.y, haH.x, haH.y, 0.8);
  seg(hipL.x, hipL.y, knL.x, knL.y, 0.9);
  seg(knL.x, knL.y, ftL.x, ftL.y, 0.9);
  seg(hipR.x, hipR.y, knR.x, knR.y, 0.9);
  seg(knR.x, knR.y, ftR.x, ftR.y, 0.9);
  return { segs: segs, head: headC, headR: 0.062 };
}
function gauss(rng) {
  var u = Math.max(rng(), 1e-9), v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}
/* ---- particles: seeded drift homes plus a sampled target point
   in every pose, so the pose is a probability field, not a mesh ---- */
var parts = [];
var targets = [];
function buildParticles() {
  var rng = mulberry32(SEED);
  var pi, i, k;
  for (pi = 0; pi < NPOSES; pi++) {
    var pose = poseSegments(POSES[pi]);
    var tot = 0, lens = [];
    var n;
    for (n = 0; n < pose.segs.length; n++) {
      var sg = pose.segs[n];
      var len = Math.sqrt((sg.x2 - sg.x1) * (sg.x2 - sg.x1) + (sg.y2 - sg.y1) * (sg.y2 - sg.y1)) * sg.w;
      lens.push(len); tot += len;
    }
    var headW = TAU * pose.headR * 1.2;
    tot += headW;
    var arr = [];
    for (i = 0; i < NPART; i++) {
      var pick = rng() * tot, acc = 0, tx = 0, ty = 0, warm = 0.5;
      if (pick < headW) {
        var th = rng() * TAU;
        var hr = pose.headR * Math.sqrt(rng());
        tx = pose.head.x + Math.cos(th) * hr;
        ty = pose.head.y + Math.sin(th) * hr;
        warm = 0.95;
      } else {
        pick -= headW;
        for (n = 0; n < pose.segs.length; n++) {
          acc += lens[n];
          if (pick <= acc) {
            sg = pose.segs[n];
            var f = rng();
            tx = lerp(sg.x1, sg.x2, f);
            ty = lerp(sg.y1, sg.y2, f);
            warm = clamp(sg.w / 1.2, 0.25, 1);
            break;
          }
        }
      }
      arr.push({
        x: tx + gauss(rng) * 0.016,
        y: ty + gauss(rng) * 0.016,
        warm: clamp(warm + (rng() - 0.5) * 0.3, 0, 1)
      });
    }
    targets.push(arr);
  }
  parts = [];
  for (i = 0; i < NPART; i++) {
    var free = rng() < 0.15;
    parts.push({
      hx: rng(), hy: rng(),
      ax: 0.008 + rng() * 0.020, ay: 0.008 + rng() * 0.020,
      w1: 0.05 + rng() * 0.10, w2: 0.05 + rng() * 0.10,
      p1: rng() * TAU, p2: rng() * TAU,
      lag: rng(), size: 0.5 + rng(),
      free: free
    });
  }
}
buildParticles();
function envelope(ph) {
  if (ph < DRIFT_A) return 0;
  if (ph < DRIFT_A + CONDENSE) return smooth((ph - DRIFT_A) / CONDENSE);
  if (ph < DRIFT_A + CONDENSE + HOLD) return 1;
  if (ph < DRIFT_A + CONDENSE + HOLD + DISPERSE) return 1 - smooth((ph - DRIFT_A - CONDENSE - HOLD) / DISPERSE);
  return 0;
}
function drawFigure(t) {
  var fr = fieldRect();
  var S = Math.min(fr.w, fr.h);
  var cx = fr.x + fr.w / 2, cy = fr.y + fr.h * 0.44;
  var Hf = 0.58 * S;
  var cycle = Math.floor(t / CYCLE);
  var ph = t - cycle * CYCLE;
  var poseIdx = ((cycle % NPOSES) + NPOSES) % NPOSES;
  var s = envelope(ph);
  var u = S / 700;
  var glowR = 0.42 * Hf;
  if (s > 0.01) {
    var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    glow.addColorStop(0, rgba([255, 236, 210], 0.10 * s));
    glow.addColorStop(1, rgba([255, 236, 210], 0));
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = glow;
    ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);
  }
  var tg = targets[poseIdx];
  var bandsH = [], bandsC = [];
  for (i = 0; i < 16; i++) { bandsH.push([]); bandsC.push([]); }
  for (i = 0; i < NPART; i++) {
    p = parts[i];
    dx = fr.x + (p.hx + p.ax * Math.sin(p.w1 * t + p.p1)) * fr.w;
    dy = fr.y + (p.hy + p.ay * Math.sin(p.w2 * t + p.p2)) * fr.h;
    px = dx; py = dy;
    if (!p.free && s > 0) {
      tx = cx + tg[i].x * Hf;
      ty = cy + tg[i].y * Hf;
      si = smooth(s * 1.9 - p.lag * 0.9);
      px = lerp(dx, tx, si);
      py = lerp(dy, ty, si);
      px += Math.sin(0.9 * t + p.p1 * 3) * 1.6 * u * si;
      py += Math.cos(0.7 * t + p.p2 * 3) * 1.6 * u * si;
    } else {
      si = 0;
    }
    alpha = 0.16 + 0.5 * si + 0.10 * p.size * 0.5;
    if (alpha > 0.85) alpha = 0.85;
    rH = (1.6 + p.size * 1.8) * u;
    rC = (0.6 + p.size * 0.7) * u;
    var wb = clamp(Math.floor(tg[i].warm * 4), 0, 3);
    var ab = clamp(Math.floor(alpha * 4), 0, 3);
    var bk = wb * 4 + ab;
    bandsH[bk].push([px, py, rH]);
    bandsC[bk].push([px, py, rC]);
  }
  ctx.globalCompositeOperation = 'lighter';
  var b, j, e, wf, af;
  for (b = 0; b < 16; b++) {
    if (bandsH[b].length === 0) continue;
    wf = (Math.floor(b / 4) + 0.5) / 4;
    af = ((b % 4) + 0.5) / 4;
    col = [
      Math.round(lerp(COOL[0], WARM[0], wf)),
      Math.round(lerp(COOL[1], WARM[1], wf)),
      Math.round(lerp(COOL[2], WARM[2], wf))
    ];
    ctx.beginPath();
    for (j = 0; j < bandsH[b].length; j++) {
      e = bandsH[b][j];
      ctx.moveTo(e[0] + e[2], e[1]);
      ctx.arc(e[0], e[1], e[2], 0, TAU);
    }
    ctx.fillStyle = rgba(col, af * 0.25);
    ctx.fill();
  }
  for (b = 0; b < 16; b++) {
    if (bandsC[b].length === 0) continue;
    wf = (Math.floor(b / 4) + 0.5) / 4;
    af = ((b % 4) + 0.5) / 4;
    col = [
      Math.round(lerp(COOL[0], WARM[0], wf)),
      Math.round(lerp(COOL[1], WARM[1], wf)),
      Math.round(lerp(COOL[2], WARM[2], wf))
    ];
    ctx.beginPath();
    for (j = 0; j < bandsC[b].length; j++) {
      e = bandsC[b][j];
      ctx.moveTo(e[0] + e[2], e[1]);
      ctx.arc(e[0], e[1], e[2], 0, TAU);
    }
    ctx.fillStyle = rgba(col, af);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Phantom, Study for a Spectral Being').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Phantom, Study for a Spectral Being').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 27').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Phantom, Study for a Spectral Being', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.8);
  ctx.fillText('2006 · 07 · 27', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(INK_RGB, 0.9);
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawFigure(t);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    particleCount: function () { return NPART; },
    cycleSeconds: function () { return CYCLE; },
    envelopeAt: function (ph) { return envelope(ph); },
    poseCount: function () { return NPOSES; }
  };
}
/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
