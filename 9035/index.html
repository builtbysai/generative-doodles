<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9035 · Erosion Field</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f2ede2; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// №9035 · Erosion Field (from seed 338, after lammetje_nl's black
// disc-field experiment). A solid irregular mass of stamped black
// discs sits on white ground. A noise field erodes the mass, knocking
// out discs in a halftone pattern that reveals a saturated color layer
// beneath. The erosion threshold breathes slowly, from barely-touched
// mass to lace. Click for a new field.
"use strict";

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seedMatch = /[?&]seed=(-?\d+)/.exec(location.search);
let SEED = seedMatch ? (parseInt(seedMatch[1], 10) >>> 0) : 9035;
let rng = mulberry32(SEED);

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;

// layers
const colorCv = document.createElement("canvas");
const massCv = document.createElement("canvas");
const massBase = document.createElement("canvas"); // pristine stamped mass
const colorMask = document.createElement("canvas"); // color layer clipped to the blob footprint
const cctx = colorCv.getContext("2d");
const mctx = massCv.getContext("2d");
const bctx = massBase.getContext("2d");
const kctx = colorMask.getContext("2d");

// ---------- seeded value noise ----------
let perm = new Uint8Array(512);
function buildPerm() {
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = (rng() * (i + 1)) | 0;
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
}
function hash2(ix, iy) { return perm[(perm[ix & 255] + iy) & 255] / 255; }
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y) {
  return vnoise(x, y) * 0.5 + vnoise(x * 2.17 + 5.2, y * 2.17 + 1.3) * 0.3 +
         vnoise(x * 4.33 + 9.1, y * 4.33 + 7.7) * 0.2;
}

function mix(a, b, k) {
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
}
// ---------- color layer: saturated field beneath ----------
function paintColor() {
  const g = cctx;
  // pick 3 saturated hues from a small curated set
  const sets = [
    [[22, 42, 158], [178, 34, 64], [232, 150, 24]],   // ultramarine / crimson / amber
    [[12, 110, 120], [200, 60, 30], [240, 200, 40]],   // teal / vermilion / gold
    [[90, 20, 140], [220, 40, 90], [250, 160, 30]],    // violet / magenta / orange
  ];
  const set = sets[(rng() * sets.length) | 0];
  const img = g.createImageData(W, H);
  const d = img.data;
  for (let y = 0; y < H; y += 2) {
    for (let x = 0; x < W; x += 2) {
      const n = fbm(x * 0.004 + SEED % 97, y * 0.004);
      const m = fbm(x * 0.011 + 40, y * 0.011 + 90);
      // soft bands between the three hues
      const t = n * 0.65 + m * 0.35;
      let c;
      if (t < 0.36) c = set[0];
      else if (t < 0.48) c = mix(set[0], set[1], (t - 0.36) / 0.12);
      else if (t < 0.56) c = set[1];
      else if (t < 0.68) c = mix(set[1], set[2], (t - 0.56) / 0.12);
      else c = set[2];
      // slight luminance variation for depth
      const lv = 0.85 + m * 0.3;
      for (let dy = 0; dy < 2 && y + dy < H; dy++)
        for (let dx = 0; dx < 2 && x + dx < W; dx++) {
          const i = ((y + dy) * W + x + dx) * 4;
          d[i] = Math.min(255, c[0] * lv); d[i + 1] = Math.min(255, c[1] * lv);
          d[i + 2] = Math.min(255, c[2] * lv); d[i + 3] = 255;
        }
    }
  }
  g.putImageData(img, 0, 0);
}

// ---------- black mass: stamped discs forming an irregular blob ----------
let massBlobs = [];
function paintMass() {
  const g = bctx;
  g.clearRect(0, 0, W, H);
  massBlobs = [];
  const cx = W * (0.3 + rng() * 0.4), cy = H * (0.3 + rng() * 0.4);
  const baseR = Math.min(W, H) * (0.28 + rng() * 0.14);
  const n = 380 + ((rng() * 160) | 0);
  g.fillStyle = "#17140f";
  for (let i = 0; i < n; i++) {
    const a = rng() * Math.PI * 2;
    const rr = Math.pow(rng(), 0.6);
    // noisy edge: radius modulated by angle noise
    const wob = 0.72 + 0.5 * fbm(Math.cos(a) * 1.7 + 9, Math.sin(a) * 1.7 + 3);
    const rad = baseR * rr * wob;
    const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
    const r = 14 + rng() * 44;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    massBlobs.push([x, y, r]);
  }
}

// ---------- erosion: halftone holes punched where noise exceeds threshold ----------
const GRID = 26; // hole lattice spacing
let holes = []; // precomputed [x, y, noise]
function computeHoles() {
  holes = [];
  const ox = rng() * 100, oy = rng() * 100;
  for (let gy = GRID / 2; gy < H; gy += GRID) {
    for (let gx = GRID / 2; gx < W; gx += GRID) {
      const jx = gx + (rng() - 0.5) * GRID * 0.5;
      const jy = gy + (rng() - 0.5) * GRID * 0.5;
      const n = fbm(jx * 0.006 + ox, jy * 0.006 + oy);
      holes.push([jx, jy, n]);
    }
  }
}

function renderMass(threshold) {
  const g = mctx;
  g.clearRect(0, 0, W, H);
  g.drawImage(massBase, 0, 0, W, H);
  g.save();
  g.globalCompositeOperation = "destination-out";
  for (const [x, y, n] of holes) {
    if (n > threshold) {
      const r = 4 + (n - threshold) * 90;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
  }
  g.restore();
}

function rebuild() {
  buildPerm();
  paintColor();
  paintMass();
  computeHoles();
  // clip the color layer to the blob footprint: color only ever
  // appears inside the mass, revealed by erosion holes
  kctx.clearRect(0, 0, W, H);
  kctx.drawImage(colorCv, 0, 0, W, H);
  kctx.globalCompositeOperation = "destination-in";
  kctx.drawImage(massBase, 0, 0, W, H);
  kctx.globalCompositeOperation = "source-over";
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.floor(window.innerWidth); H = Math.floor(window.innerHeight);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const c of [colorCv, massCv, massBase, colorMask]) { c.width = W * DPR; c.height = H * DPR; }
  cctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  kctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  rebuild();
}
window.addEventListener("resize", resize);

cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  SEED = (Math.random() * 1e9) | 0;
  rng = mulberry32(SEED);
  rebuild();
  t0 = performance.now();
  try { history.replaceState(null, "", "?seed=" + SEED); } catch (err) { /* file:// */ }
});

buildPerm();
resize();
let t0 = performance.now();

function frame(now) {
  const t = (now - t0) / 1000;
  // erosion threshold breathes: barely-touched -> lace -> back, ~48s cycle
  const th = 0.62 + 0.24 * Math.sin(t * (Math.PI * 2 / 48) - Math.PI / 2);
  renderMass(th);
  ctx.fillStyle = "#f2ede2";
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(colorMask, 0, 0, W, H);
  ctx.drawImage(massCv, 0, 0, W, H);
  ctx.fillStyle = "rgba(23,20,15,0.72)";
  ctx.font = "13px Georgia, serif";
  ctx.fillText("№9035 · Erosion Field", 18, H - 18);
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(23,20,15,0.45)";
  ctx.font = "italic 13px Georgia, serif";
  ctx.fillText("click for a new field", W - 18, H - 18);
  ctx.textAlign = "left";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
