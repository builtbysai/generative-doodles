<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Reader Completes It</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #EFE7D8; }
  canvas { display: block; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict; red exists in scene 4 only) ----------
  var PAPER = '#EFE7D8';
  var INK   = '#2A3328';
  var WASH  = '#8A8D84';
  var RED   = '#A4121C';

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, U = 0, PHONE = false;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(50, Math.floor(w));
    H = Math.max(50, Math.floor(h));
    canvas.width = W;
    canvas.height = H;
    U = Math.min(W, H) / 100; // layout unit
    var sw = (window.screen && window.screen.width) || W;
    var sh = (window.screen && window.screen.height) || H;
    PHONE = (Math.min(sw, sh) < 700) || (H > W * 1.15);
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT); });
  }
  window.addEventListener('resize', function () { resize(); draw(currentT); });

  // ---------- helpers ----------
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function sway(t, ph, amp) { return Math.sin(t * 0.9 + ph) * amp; }

  // a pine / bare tree: trunk + layered canopy blobs, lean = px offset at top
  function tree(x, baseY, hgt, lean, tone, alpha, seedPh) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = tone; ctx.fillStyle = tone;
    ctx.lineCap = 'round';
    var tw = Math.max(1.5, hgt * 0.035);
    ctx.lineWidth = tw;
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.quadraticCurveTo(x + lean * 0.3, baseY - hgt * 0.55, x + lean, baseY - hgt);
    ctx.stroke();
    // branches
    ctx.lineWidth = Math.max(1, tw * 0.45);
    for (var i = 0; i < 3; i++) {
      var by = baseY - hgt * (0.45 + i * 0.18);
      var bx = x + lean * (0.45 + i * 0.18);
      var dir = (i % 2 === 0) ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(bx + dir * hgt * 0.10, by - hgt * 0.05, bx + dir * hgt * 0.17, by - hgt * 0.13);
      ctx.stroke();
    }
    // canopy: three overlapping ink blobs near the top
    var cr = hgt * 0.20;
    var cx = x + lean, cy = baseY - hgt * 0.97;
    ctx.beginPath(); ctx.arc(cx, cy, cr, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(cx - cr * 0.75, cy + cr * 0.42, cr * 0.72, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + cr * 0.75, cy + cr * 0.42, cr * 0.72, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  function groundWash(yBase, tone, alpha, seed) {
    var rnd = mulberry32(seed);
    ctx.save();
    ctx.fillStyle = tone; ctx.globalAlpha = alpha;
    for (var i = 0; i < 46; i++) {
      var gx = rnd() * W, gy = yBase + rnd() * (H - yBase);
      var gw = (2 + rnd() * 7) * U, gh = Math.max(1, 0.35 * U);
      ctx.beginPath(); ctx.ellipse(gx, gy, gw, gh, 0, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function paperBase() {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    // faint wash mottling, fixed seed, part of frame one determinism
    var rnd = mulberry32(9911);
    ctx.save();
    ctx.fillStyle = WASH;
    for (var i = 0; i < 60; i++) {
      ctx.globalAlpha = 0.03 + rnd() * 0.03;
      ctx.beginPath();
      ctx.ellipse(rnd() * W, rnd() * H, (4 + rnd() * 12) * U, (2 + rnd() * 5) * U, rnd() * 3.14, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- SCENE 1: the forest path ----------
  function scene1(t, breath) {
    paperBase();
    var horizon = H * 0.44;
    // distant wash depths
    ctx.save(); ctx.fillStyle = WASH; ctx.globalAlpha = 0.35;
    ctx.fillRect(0, H * 0.10, W, horizon - H * 0.10);
    ctx.restore();
    ctx.save(); ctx.fillStyle = INK; ctx.globalAlpha = 0.30;
    ctx.fillRect(0, H * 0.26, W, horizon - H * 0.26);
    ctx.restore();

    // winding path: broad at the bottom, narrow at the vanishing point
    var vx = W * 0.54, vy = horizon;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(W * 0.16, H);
    ctx.bezierCurveTo(W * 0.30, H * 0.80, W * 0.40, H * 0.62, vx - U * 0.8, vy);
    ctx.lineTo(vx + U * 0.8, vy);
    ctx.bezierCurveTo(W * 0.62, H * 0.62, W * 0.74, H * 0.80, W * 0.88, H);
    ctx.closePath();
    ctx.fillStyle = PAPER; ctx.fill();
    ctx.strokeStyle = rgba(WASH, 0.7); ctx.lineWidth = Math.max(1, 0.35 * U); ctx.stroke();
    // path dashes of wash (worn stones)
    ctx.fillStyle = WASH; ctx.globalAlpha = 0.5;
    var prnd = mulberry32(417);
    for (var i = 0; i < 14; i++) {
      var py = horizon + (i + prnd() * 0.7) / 14 * (H - horizon);
      var spread = (py - horizon) / (H - horizon);
      var pcx = vx + (0.52 - vx / W) * 0; // keep centred on the path's drift
      pcx = vx + (W * 0.52 - vx) * spread + (prnd() - 0.5) * 10 * U * spread;
      ctx.beginPath(); ctx.ellipse(pcx, py, (0.5 + 2.6 * spread) * U, 0.35 * U, 0, 0, 6.2832); ctx.fill();
    }
    ctx.restore();

    // forest rows, far small to near huge, leaning gently
    var amp = (0.35 + breath * 1.3) * U;
    var rows = [
      { y: horizon + H * 0.01, h: H * 0.30, a: 0.85, n: 7, seed: 101 },
      { y: horizon + H * 0.10, h: H * 0.48, a: 0.95, n: 5, seed: 202 },
      { y: H * 1.02,          h: H * 0.78, a: 1.0,  n: 4, seed: 303 }
    ];
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r], rr = mulberry32(row.seed);
      for (var i = 0; i < row.n; i++) {
        var side = (i % 2 === 0) ? 0 : 1;
        var fx = side === 0 ? (0.02 + rr() * 0.30) * W : (0.68 + rr() * 0.30) * W;
        var lean = sway(t, rr() * 6.28, amp) * (0.5 + rr() * 0.5);
        tree(fx, row.y, row.h * (0.85 + rr() * 0.3), lean, INK, row.a, 0);
      }
    }

    // the tiny hooded figure, far down the path: ink body, PAPER hood. no red.
    var fs = (PHONE ? 1.25 : 1.0) * U;
    var fx2 = vx + U * 0.4, fy2 = horizon - U * 0.4;
    ctx.save();
    ctx.fillStyle = INK;
    ctx.beginPath(); // cloak
    ctx.moveTo(fx2, fy2 - 4.6 * fs);
    ctx.quadraticCurveTo(fx2 + 1.7 * fs, fy2 - 1.6 * fs, fx2 + 1.5 * fs, fy2);
    ctx.lineTo(fx2 - 1.5 * fs, fy2);
    ctx.quadraticCurveTo(fx2 - 1.7 * fs, fy2 - 1.6 * fs, fx2, fy2 - 4.6 * fs);
    ctx.fill();
    ctx.fillStyle = PAPER; // the hood, uncolored: the red is saved for scene 4
    ctx.beginPath();
    ctx.moveTo(fx2, fy2 - 6.1 * fs);
    ctx.quadraticCurveTo(fx2 + 1.25 * fs, fy2 - 5.2 * fs, fx2 + 1.05 * fs, fy2 - 4.0 * fs);
    ctx.lineTo(fx2 - 1.05 * fs, fy2 - 4.0 * fs);
    ctx.quadraticCurveTo(fx2 - 1.25 * fs, fy2 - 5.2 * fs, fx2, fy2 - 6.1 * fs);
    ctx.fill();
    ctx.strokeStyle = rgba(INK, 0.65); ctx.lineWidth = Math.max(0.7, 0.16 * fs); ctx.stroke();
    ctx.restore();

    groundWash(H * 0.90, INK, 0.14, 555);
  }

  // ---------- SCENE 2: the grandmother's house ----------
  function scene2(t, breath) {
    paperBase();
    ctx.save(); ctx.fillStyle = WASH; ctx.globalAlpha = 0.28;
    ctx.fillRect(0, H * 0.08, W, H * 0.42); ctx.restore();

    var amp = (0.35 + breath * 1.3) * U;
    // framing trees
    var fr = mulberry32(808);
    var i, lean;
    for (i = 0; i < 4; i++) {
      lean = sway(t, fr() * 6.28, amp);
      tree((0.03 + i * 0.055) * W, H * 1.0, H * (0.66 + fr() * 0.14), lean, INK, 0.95, 0);
    }
    for (i = 0; i < 4; i++) {
      lean = sway(t, fr() * 6.28, amp);
      tree((0.97 - i * 0.055) * W, H * 1.0, H * (0.66 + fr() * 0.14), lean, INK, 0.95, 0);
    }

    // path to the door
    var hx = W * 0.46, hy = H * 0.60, hw = W * 0.30, hh = H * 0.26;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(W * 0.30, H); ctx.lineTo(W * 0.44, hy + hh);
    ctx.lineTo(W * 0.56, hy + hh); ctx.lineTo(W * 0.82, H);
    ctx.closePath();
    ctx.fillStyle = PAPER; ctx.fill();
    ctx.strokeStyle = rgba(WASH, 0.7); ctx.lineWidth = Math.max(1, 0.3 * U); ctx.stroke();
    ctx.restore();

    // smoke, curling with the sway phase
    ctx.save();
    ctx.fillStyle = WASH;
    for (i = 0; i < 6; i++) {
      var st = i / 6;
      var sx = hx + hw * 0.76 + Math.sin(t * 0.7 + i * 1.05) * (0.5 + breath * 1.6) * U + st * 3.4 * U;
      var sy = hy - H * 0.16 - st * H * 0.20;
      ctx.globalAlpha = 0.55 - st * 0.38;
      ctx.beginPath(); ctx.arc(sx, sy, (1.1 + st * 2.3) * U, 0, 6.2832); ctx.fill();
    }
    ctx.restore();

    // house body
    ctx.save();
    ctx.fillStyle = PAPER;
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.2, 0.4 * U);
    ctx.beginPath(); ctx.rect(hx, hy, hw, hh); ctx.fill(); ctx.stroke();
    // roof
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(hx - hw * 0.10, hy);
    ctx.lineTo(hx + hw * 0.5, hy - H * 0.15);
    ctx.lineTo(hx + hw * 1.10, hy);
    ctx.closePath(); ctx.fill();
    // chimney
    ctx.fillRect(hx + hw * 0.68, hy - H * 0.185, hw * 0.15, H * 0.075);
    // door
    ctx.beginPath(); ctx.rect(hx + hw * 0.10, hy + hh * 0.38, hw * 0.24, hh * 0.62); ctx.fill();
    // the lit window: wash gray, the only glow
    ctx.fillStyle = WASH;
    ctx.beginPath(); ctx.rect(hx + hw * 0.58, hy + hh * 0.34, hw * 0.26, hh * 0.32); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(0.8, 0.2 * U); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hx + hw * 0.71, hy + hh * 0.34); ctx.lineTo(hx + hw * 0.71, hy + hh * 0.66);
    ctx.moveTo(hx + hw * 0.58, hy + hh * 0.50); ctx.lineTo(hx + hw * 0.84, hy + hh * 0.50);
    ctx.stroke();
    ctx.restore();

    groundWash(H * 0.88, INK, 0.13, 606);
  }

  // ---------- SCENE 3: the wolf's shadow ----------
  function scene3(t, breath) {
    paperBase();
    ctx.save(); ctx.fillStyle = WASH; ctx.globalAlpha = 0.26;
    ctx.fillRect(0, H * 0.06, W, H * 0.5); ctx.restore();

    // path running diagonally
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-W * 0.05, H * 0.92); ctx.lineTo(W * 0.52, H * 0.52);
    ctx.lineTo(W * 0.66, H * 0.52); ctx.lineTo(W * 1.05, H * 0.92);
    ctx.closePath();
    ctx.fillStyle = PAPER; ctx.fill();
    ctx.strokeStyle = rgba(WASH, 0.65); ctx.lineWidth = Math.max(1, 0.3 * U); ctx.stroke();
    ctx.restore();

    // trunks the shadow will fall across
    var amp = (0.3 + breath * 1.1) * U;
    var tr = mulberry32(1212);
    var i;
    for (i = 0; i < 8; i++) {
      var tx = (0.05 + i * 0.125 + tr() * 0.03) * W;
      tree(tx, H * 1.02, H * (0.6 + tr() * 0.3), sway(t, tr() * 6.28, amp), INK, 0.72, 0);
    }

    // THE SHADOW: full-strength ink, drawn twice, far darker than the woods.
    // A wolf in profile, stretched long by low light: ears, snout, legs, tail.
    var sx = W * 0.08, sy = H * 0.80, s = U * (PHONE ? 1.15 : 1.0);
    function wolfPath() {
      ctx.beginPath();
      ctx.moveTo(sx + 2 * s, sy - 6 * s);            // tail tip, raised
      ctx.lineTo(sx + 12 * s, sy - 14 * s);          // rump
      ctx.lineTo(sx + 30 * s, sy - 17 * s);          // back
      ctx.lineTo(sx + 40 * s, sy - 19 * s);          // shoulder
      ctx.lineTo(sx + 43 * s, sy - 26 * s);          // ear back
      ctx.lineTo(sx + 46 * s, sy - 20.5 * s);        // ear notch
      ctx.lineTo(sx + 49 * s, sy - 27 * s);          // ear front, pointed
      ctx.lineTo(sx + 52 * s, sy - 20 * s);          // forehead
      ctx.lineTo(sx + 62 * s, sy - 15.5 * s);        // long snout top
      ctx.lineTo(sx + 63 * s, sy - 13.5 * s);        // nose
      ctx.lineTo(sx + 53 * s, sy - 11.5 * s);        // jaw
      ctx.lineTo(sx + 47 * s, sy - 12.5 * s);        // throat
      ctx.lineTo(sx + 44 * s, sy - 6 * s);           // chest
      ctx.lineTo(sx + 45.5 * s, sy + 6 * s);         // front leg down
      ctx.lineTo(sx + 42.5 * s, sy + 6 * s);         // paw
      ctx.lineTo(sx + 40 * s, sy - 4 * s);           // leg back up
      ctx.lineTo(sx + 33 * s, sy - 3 * s);           // belly
      ctx.lineTo(sx + 30 * s, sy + 6 * s);           // hind leg down
      ctx.lineTo(sx + 27 * s, sy + 6 * s);           // paw
      ctx.lineTo(sx + 24 * s, sy - 5 * s);           // hind leg up
      ctx.lineTo(sx + 12 * s, sy - 7 * s);           // belly to tail root
      ctx.closePath();
    }
    ctx.save();
    ctx.fillStyle = INK;
    ctx.globalAlpha = 0.96; wolfPath(); ctx.fill();
    ctx.globalAlpha = 0.9;  wolfPath(); ctx.fill(); // second pass: deeper than any tree
    ctx.restore();

    groundWash(H * 0.9, WASH, 0.16, 707);
  }

  // ---------- SCENE 4: the red hood (the single red event) ----------
  function scene4(t, breath) {
    paperBase();
    ctx.save(); ctx.fillStyle = INK; ctx.globalAlpha = 0.16;
    ctx.fillRect(0, 0, W, H * 0.3); ctx.restore();

    // background branches, all ink, leaning with sway
    var amp = (0.4 + breath * 1.4) * U;
    var br = mulberry32(2020);
    var i;
    ctx.save();
    ctx.strokeStyle = INK; ctx.lineCap = 'round';
    for (i = 0; i < 5; i++) {
      var bx = (0.08 + i * 0.21 + br() * 0.05) * W;
      var bl = sway(t, br() * 6.28, amp);
      ctx.globalAlpha = 0.5 + br() * 0.25;
      ctx.lineWidth = (0.5 + br() * 0.8) * U;
      ctx.beginPath();
      ctx.moveTo(bx, H * 1.02);
      ctx.quadraticCurveTo(bx + bl, H * 0.5, bx + bl * 2.2, H * 0.04);
      ctx.stroke();
    }
    ctx.restore();

    // the great branch the hood hangs from
    var hy0 = H * 0.30, hx0 = W * 0.06, hx1 = W * 0.96;
    var sag = Math.sin(t * 0.9) * (0.25 + breath) * U;
    ctx.save();
    ctx.strokeStyle = INK; ctx.lineCap = 'round';
    ctx.lineWidth = 2.6 * U;
    ctx.beginPath();
    ctx.moveTo(hx0, hy0 - 3 * U);
    ctx.quadraticCurveTo(W * 0.52, hy0 + 6 * U + sag, hx1, hy0 - 5 * U);
    ctx.stroke();
    ctx.lineWidth = 0.8 * U;
    ctx.beginPath();
    ctx.moveTo(W * 0.66, hy0 + 1.5 * U + sag * 0.7);
    ctx.quadraticCurveTo(W * 0.76, hy0 + 6 * U, W * 0.84, hy0 + 8 * U);
    ctx.stroke();
    ctx.restore();

    // THE HOOD, close: red, fabric-textured, the only saturated shape in the piece
    var cx = W * 0.46, top = hy0 + 2.2 * U + sag * 0.8;
    var hs = U * (PHONE ? 1.1 : 1.0);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, top);                                    // hanging point
    ctx.quadraticCurveTo(cx + 3.2 * hs, top + 1.2 * hs, cx + 4.4 * hs, top + 5.2 * hs); // right swell
    ctx.quadraticCurveTo(cx + 7.6 * hs, top + 13.5 * hs, cx + 6.4 * hs, top + 23.5 * hs); // drape right
    ctx.quadraticCurveTo(cx + 3.0 * hs, top + 26.5 * hs, cx, top + 25.2 * hs);           // hem
    ctx.quadraticCurveTo(cx - 3.0 * hs, top + 26.5 * hs, cx - 6.4 * hs, top + 23.5 * hs); // hem left
    ctx.quadraticCurveTo(cx - 7.6 * hs, top + 13.5 * hs, cx - 4.4 * hs, top + 5.2 * hs);  // drape left
    ctx.quadraticCurveTo(cx - 3.2 * hs, top + 1.2 * hs, cx, top);
    ctx.closePath();
    ctx.fillStyle = RED; ctx.fill();
    // fabric weave: fine crosshatch clipped inside the cloth
    ctx.clip();
    ctx.lineWidth = Math.max(0.5, 0.13 * hs);
    var step = 1.05 * hs, k, lx, ly;
    ctx.strokeStyle = rgba(INK, 0.10);
    for (lx = cx - 9 * hs; lx < cx + 9 * hs; lx += step) {
      ctx.beginPath(); ctx.moveTo(lx, top - hs); ctx.lineTo(lx + 1.5 * hs, top + 28 * hs); ctx.stroke();
    }
    ctx.strokeStyle = rgba(PAPER, 0.12);
    for (ly = top; ly < top + 28 * hs; ly += step) {
      ctx.beginPath(); ctx.moveTo(cx - 9 * hs, ly); ctx.lineTo(cx + 9 * hs, ly + 1.2 * hs); ctx.stroke();
    }
    // fold shading in the same red, deeper passes
    ctx.strokeStyle = rgba(INK, 0.16); ctx.lineWidth = 0.5 * hs;
    for (k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(cx + k * 2.6 * hs, top + 6 * hs);
      ctx.quadraticCurveTo(cx + k * 3.1 * hs, top + 15 * hs, cx + k * 2.2 * hs, top + 24.5 * hs);
      ctx.stroke();
    }
    ctx.restore();
    // hood opening, ink dark, near the top of the cloth
    ctx.save();
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.ellipse(cx, top + 5.4 * hs, 2.5 * hs, 3.1 * hs, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();

    groundWash(H * 0.92, INK, 0.12, 909);
  }

  // ---------- SCENE 5: the dawn clearing ----------
  function scene5(t, breath) {
    paperBase();
    // pale wash sky band
    ctx.save();
    ctx.fillStyle = WASH; ctx.globalAlpha = 0.20;
    ctx.fillRect(0, 0, W, H * 0.38);
    ctx.globalAlpha = 0.12;
    ctx.fillRect(0, H * 0.38, W, H * 0.14);
    ctx.restore();
    // low dawn disc of plain paper above the treeline
    ctx.save();
    ctx.fillStyle = PAPER;
    ctx.strokeStyle = rgba(WASH, 0.8); ctx.lineWidth = Math.max(1, 0.3 * U);
    ctx.beginPath(); ctx.arc(W * 0.68, H * 0.335, 4.6 * U, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.restore();

    // small birds, drifting slowly across the sky
    ctx.save();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, 0.28 * U); ctx.lineCap = 'round';
    var brd = mulberry32(3131);
    for (var i = 0; i < 5; i++) {
      var bx = (brd() * 0.85 + 0.06) * W + Math.sin(t * 0.22 + i * 1.7) * 2.2 * U;
      var by = (0.10 + brd() * 0.16) * H + Math.sin(t * 0.5 + i * 2.3) * 0.5 * U;
      var bs = (0.9 + brd() * 0.7) * U;
      var flap = Math.sin(t * 2.2 + i * 1.3) * 0.35 * bs;
      ctx.beginPath();
      ctx.moveTo(bx - bs, by + flap);
      ctx.quadraticCurveTo(bx - bs * 0.3, by - bs * 0.55, bx, by);
      ctx.quadraticCurveTo(bx + bs * 0.3, by - bs * 0.55, bx + bs, by + flap);
      ctx.stroke();
    }
    ctx.restore();

    // sparse edge trees, calm
    var amp = (0.25 + breath) * U;
    var et = mulberry32(4242);
    var j;
    for (j = 0; j < 3; j++) tree((0.03 + j * 0.045) * W, H * 1.0, H * (0.52 + et() * 0.1), sway(t, et() * 6.28, amp), INK, 0.9, 0);
    for (j = 0; j < 3; j++) tree((0.97 - j * 0.045) * W, H * 1.0, H * (0.52 + et() * 0.1), sway(t, et() * 6.28, amp), INK, 0.9, 0);

    // the path leaving the forest
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(W * 0.40, H); ctx.lineTo(W * 0.485, H * 0.52);
    ctx.lineTo(W * 0.545, H * 0.52); ctx.lineTo(W * 0.64, H);
    ctx.closePath();
    ctx.fillStyle = PAPER; ctx.fill();
    ctx.strokeStyle = rgba(WASH, 0.65); ctx.lineWidth = Math.max(1, 0.3 * U); ctx.stroke();
    ctx.restore();

    // clearing grass: quiet wash strokes
    ctx.save();
    ctx.strokeStyle = WASH; ctx.lineCap = 'round';
    var gr = mulberry32(5151);
    for (j = 0; j < 60; j++) {
      var gx = gr() * W, gy = H * (0.60 + gr() * 0.38);
      var gl = (0.8 + gr() * 1.6) * U * (gy / H);
      ctx.globalAlpha = 0.35 + gr() * 0.3;
      ctx.lineWidth = Math.max(0.7, 0.16 * U);
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.quadraticCurveTo(gx + sway(t, gr() * 6.28, 0.2 * U), gy - gl * 0.6, gx + (gr() - 0.5) * U, gy - gl);
      ctx.stroke();
    }
    ctx.restore();

    groundWash(H * 0.86, WASH, 0.10, 111);
  }

  var SCENES = [scene1, scene2, scene3, scene4, scene5];

  // ---------- state ----------
  var sceneIdx = 0;
  var wipe = null;         // {from, to, stepT0}
  var currentT = 0;        // elapsed seconds shown (frame one = 0)
  var breathStart = -10;   // elapsed seconds when the last breath began
  var lastTapMs = -10000;
  var pendingTapMs = -1;

  function breathAmount(t) {
    var d = t - breathStart;
    if (d < 0 || d > 1.6) return 0;
    return Math.sin((d / 1.6) * Math.PI); // one soft swell, about a breath long
  }

  function draw(t) {
    currentT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var b = breathAmount(t);
    if (wipe) {
      var step = Math.min(8, Math.floor((t - wipe.stepT0) / 0.07));
      if (step >= 8) {
        sceneIdx = wipe.to;
        wipe = null;
        SCENES[sceneIdx](t, b);
        return;
      }
      // old scene full, new scene revealed left of the stepped boundary,
      // curl shadow riding the boundary. no fades: the mask is hard, the steps are time.
      SCENES[wipe.from](t, b);
      var bx = (step / 8) * (W + 8 * U) - 4 * U;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, Math.max(0, bx), H); ctx.clip();
      SCENES[wipe.to](t, b);
      ctx.restore();
      ctx.save();
      ctx.fillStyle = INK;
      ctx.globalAlpha = 0.28; ctx.fillRect(bx - 2.6 * U, 0, 2.6 * U, H);
      ctx.globalAlpha = 0.16; ctx.fillRect(bx - 5.2 * U, 0, 2.6 * U, H);
      ctx.globalAlpha = 0.30; ctx.fillRect(bx, 0, Math.max(1, 0.35 * U), H);
      ctx.restore();
      return;
    }
    SCENES[sceneIdx](t, b);
  }

  function advance(nowMs) {
    if (wipe) return;
    wipe = { from: sceneIdx, to: (sceneIdx + 1) % SCENES.length, stepT0: currentT };
  }

  function onTap(nowMs) {
    if (nowMs - lastTapMs <= 350) {
      lastTapMs = -10000;
      pendingTapMs = -1;
      advance(nowMs);
    } else {
      lastTapMs = nowMs;
      pendingTapMs = nowMs; // may become a breath if no second tap follows
    }
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function () {
      onTap((typeof performance !== 'undefined' && performance.now) ? performance.now() : 0);
    });
  }

  // ---------- run ----------
  resize();
  draw(0); // frame one: scene 1, sway phase 0, synchronous and fixed

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var loop = function (ts) {
      if (t0 === null) t0 = ts;
      var t = (ts - t0) / 1000;
      if (pendingTapMs >= 0) {
        var nowMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
        if (nowMs - pendingTapMs > 350) { breathStart = t; pendingTapMs = -1; }
      }
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
