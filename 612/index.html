<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№612 Still Life</title>
<style>
  html, body { margin: 0; padding: 0; background: #d8c9a8; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/chris-hyson.md does not exist in the repo, so these hex
  // values are chosen from the prompt's own color names.
  var PAPER = '#efe6cf';   // paper cream at the torn edges
  var PAGE = '#d8c9a8';    // faded sepia page ground
  var SEPIA = '#b49b72';   // faded sepia sky
  var SEPIA_DK = '#8a7350';// faded sepia, deeper
  var LAKE = '#6d8570';    // lake green, water near shore
  var LAKE_DK = '#3e5446'; // lake green, deep water
  var SHORE = '#4a5a48';   // far shore trees, dark lake green
  var SHORE_LT = '#6b6a4e';// far shore trees, sunlit
  var BIRD = '#2b2b26';    // the bird, soft black
  var INK = '#3a3226';     // plate ink, dark sepia
  var GRAIN_DK = '#5d4f38';// halftone grain, dark
  var GRAIN_LT = '#f4ecd6';// halftone grain, light

  // Fixed-phase first frame: t = 75 s. The bird cycle is 240 s: the bird
  // crosses the frame on a slow diagonal over the first 150 s, then rests
  // out of frame for 90 s. At t = 75 the bird is exactly mid-crossing,
  // at the centre of the frame, so the one moving subject reads at frame
  // one. Frame one is byte-reproducible: the grain, the trees, the torn
  // edge and the bird are all pure functions of t and the seeded PRNG.
  var FIRST_T = 75;
  var CYCLE = 240;
  var CROSS = 150;

  // Seeded PRNG, mulberry32. A fresh instance is built per draw from the
  // piece number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The far shore: fixed trees from the seed, each with a position along
  // the horizon, a height, a canopy radius and a tone. Built once at load.
  var TREES = [];
  (function buildTrees() {
    var rng = mulberry32(1931);
    var n = 46;
    for (var i = 0; i < n; i++) {
      TREES.push({
        x: 0.01 + (i / (n - 1)) * 0.98 + (rng() - 0.5) * 0.012,
        h: 0.030 + rng() * 0.045,
        r: 0.010 + rng() * 0.016,
        tone: rng() < 0.6 ? SHORE : SHORE_LT,
        lean: (rng() - 0.5) * 0.010
      });
    }
  })();

  // The torn border: fixed jitter per edge point from the seed, so the
  // tear shape never changes; only a slow flutter displacement moves
  // with time. One ring of points per side, inset about 3% of the frame.
  var EDGE_PTS = 26;
  var EDGE_JIT = [];
  (function buildEdge() {
    var rng = mulberry32(19310);
    for (var i = 0; i < EDGE_PTS * 4; i++) {
      EDGE_JIT.push((rng() - 0.5) * 2);
    }
  })();

  // Halftone grain: fixed dots from the seed, each with a position, a
  // radius and a breathing phase. The grain is visible but restrained:
  // small dots, low alpha, so it reads as old paper, not noise.
  var GRAIN = [];
  (function buildGrain() {
    var rng = mulberry32(19311);
    var n = 3200;
    for (var i = 0; i < n; i++) {
      GRAIN.push({
        x: rng(), y: rng(),
        r: 0.0009 + rng() * 0.0016,
        ph: rng() * Math.PI * 2,
        lt: rng() < 0.35
      });
    }
  })();

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function mixHex(h1, h2, t) {
    var r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
    var r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
    var r = Math.round(lerp(r1, r2, t)), g = Math.round(lerp(g1, g2, t)), b = Math.round(lerp(b1, b2, t));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Horizon line: the far shore sits just above a third of the frame.
  function horizonY() { return H * 0.36; }

  // The torn inner edge: for side s (0 top, 1 right, 2 bottom, 3 left)
  // and point index i, the inset from the frame edge, jittered by the
  // seed and fluttered by a slow sine, so the edge breathes almost
  // imperceptibly, as if the photograph lies in a draft.
  function edgeInset(s, i, t) {
    var base = 0.030 + EDGE_JIT[s * EDGE_PTS + i] * 0.012;
    var flutter = Math.sin(t * 0.10 + (s * EDGE_PTS + i) * 0.9) * 0.0016;
    return base + flutter;
  }

  // Walk the torn ring clockwise, calling fn(x, y, isFirst) per point.
  function traceEdge(t, fn) {
    var i, u, inset, first = true;
    function pt(x, y) { fn(x, y, first); first = false; }
    for (i = 0; i <= EDGE_PTS; i++) {
      u = i / EDGE_PTS;
      inset = edgeInset(0, Math.min(i, EDGE_PTS - 1), t);
      pt(u * W, inset * Math.min(W, H));
    }
    for (i = 1; i <= EDGE_PTS; i++) {
      u = i / EDGE_PTS;
      inset = edgeInset(1, Math.min(i, EDGE_PTS - 1), t);
      pt(W - inset * Math.min(W, H), u * H);
    }
    for (i = 1; i <= EDGE_PTS; i++) {
      u = i / EDGE_PTS;
      inset = edgeInset(2, Math.min(i, EDGE_PTS - 1), t);
      pt(W - u * W, H - inset * Math.min(W, H));
    }
    for (i = 1; i <= EDGE_PTS; i++) {
      u = i / EDGE_PTS;
      inset = edgeInset(3, Math.min(i, EDGE_PTS - 1), t);
      pt(inset * Math.min(W, H), H - u * H);
    }
  }

  // The bird: position on its slow diagonal, rising from lower left to
  // upper right. u is the crossing progress, 0 at entry, 1 at exit.
  function birdPos(u) {
    return {
      x: lerp(-0.06, 1.06, u) * W,
      y: lerp(0.66, 0.28, u) * H
    };
  }

  function drawBird(x, y, t) {
    var span = Math.min(W, H) * 0.055;
    var flap = Math.sin(t * 1.1) * 0.35; // one slow wingbeat every ~6 s
    var lift = span * 0.30;
    ctx.strokeStyle = BIRD;
    ctx.lineWidth = Math.max(1.4, Math.min(W, H) * 0.0032);
    ctx.lineCap = 'round';
    // Left wing: body to wingtip, rising and falling with the flap.
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x - span * 0.28, y - lift * (0.6 + flap), x - span * 0.5, y - lift * (0.9 + flap));
    ctx.stroke();
    // Right wing.
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + span * 0.28, y - lift * (0.6 - flap), x + span * 0.5, y - lift * (0.9 - flap));
    ctx.stroke();
    // Body: a short soft-black dash along the flight line.
    ctx.beginPath();
    ctx.moveTo(x - span * 0.10, y + span * 0.02);
    ctx.lineTo(x + span * 0.10, y - span * 0.02);
    ctx.stroke();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    var hy = horizonY();
    var S = Math.min(W, H);

    // Sky: faded sepia, lighter toward the horizon haze.
    var sky = ctx.createLinearGradient(0, 0, 0, hy);
    sky.addColorStop(0, SEPIA_DK);
    sky.addColorStop(0.7, SEPIA);
    sky.addColorStop(1, mixHex(SEPIA, PAPER, 0.45));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, hy + 1);

    // Low sun haze, upper left, barely there.
    var haze = ctx.createRadialGradient(W * 0.22, H * 0.10, 0, W * 0.22, H * 0.10, S * 0.5);
    haze.addColorStop(0, hexA(PAPER, 0.20));
    haze.addColorStop(1, hexA(PAPER, 0));
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, W, hy + 1);

    // Water: lake green, lighter at the shore, deepening toward the
    // viewer. It fills the rest of the frame edge to edge.
    var wat = ctx.createLinearGradient(0, hy, 0, H);
    wat.addColorStop(0, LAKE);
    wat.addColorStop(0.55, mixHex(LAKE, LAKE_DK, 0.5));
    wat.addColorStop(1, LAKE_DK);
    ctx.fillStyle = wat;
    ctx.fillRect(0, hy, W, H - hy);

    // Far shore: a dark band, then the trees standing on it.
    ctx.fillStyle = mixHex(SHORE, LAKE_DK, 0.35);
    ctx.fillRect(0, hy - H * 0.008, W, H * 0.016);
    var ti;
    for (ti = 0; ti < TREES.length; ti++) {
      var tr = TREES[ti];
      var tx = tr.x * W;
      var th = tr.h * H;
      var trr = tr.r * S;
      var top = hy - th;
      // Trunk, a short dark stroke.
      ctx.strokeStyle = hexA(SHORE, 0.9);
      ctx.lineWidth = Math.max(1, S * 0.002);
      ctx.beginPath();
      ctx.moveTo(tx + tr.lean * S, hy);
      ctx.lineTo(tx, top + trr * 0.6);
      ctx.stroke();
      // Canopy: two overlapping seeded blobs, so the treeline reads as
      // separate trees, not a flat hedge.
      ctx.fillStyle = hexA(tr.tone, 0.92);
      ctx.beginPath(); ctx.moveTo(tx + trr, top + trr * 0.5);
      ctx.arc(tx, top + trr * 0.5, trr, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(tx + trr * 0.7 + tr.lean * S, top + trr * 1.1);
      ctx.arc(tx + tr.lean * S, top + trr * 1.1, trr * 0.7, 0, Math.PI * 2); ctx.fill();
    }

    // Tree reflections: faint vertical streaks in the water just below
    // the shore, barely moving.
    for (ti = 0; ti < TREES.length; ti += 2) {
      var rt = TREES[ti];
      var rx = rt.x * W;
      var rl = (0.02 + (rt.h * 0.5)) * H;
      var wob = Math.sin(t * 0.08 + ti * 1.7) * S * 0.002;
      ctx.strokeStyle = hexA(rt.tone, 0.16);
      ctx.lineWidth = Math.max(1, S * 0.0025);
      ctx.beginPath();
      ctx.moveTo(rx + wob, hy + H * 0.008);
      ctx.lineTo(rx - wob, hy + H * 0.008 + rl);
      ctx.stroke();
    }

    // Water shimmer: slow horizontal strokes, low alpha, drifting with
    // a long sine so the water barely moves.
    var wi;
    for (wi = 0; wi < 26; wi++) {
      var wy = hy + (0.04 + 0.92 * (wi / 25)) * (H - hy);
      var wph = t * 0.05 + wi * 2.4;
      var wx0 = (0.06 + 0.10 * Math.sin(wph * 0.7)) * W;
      var wx1 = wx0 + (0.25 + 0.45 * (0.5 + 0.5 * Math.sin(wph))) * W;
      var wob2 = Math.sin(t * 0.07 + wi) * H * 0.0015;
      ctx.strokeStyle = hexA(PAPER, a4(0.05 + 0.05 * (0.5 + 0.5 * Math.sin(wph * 1.3))));
      ctx.lineWidth = Math.max(1, H * 0.0016);
      ctx.beginPath();
      ctx.moveTo(wx0, wy + wob2);
      ctx.lineTo(Math.min(wx1, W * 0.97), wy - wob2);
      ctx.stroke();
    }

    // Torn paper border: the cream frame is part of the image. The ring
    // is filled from the frame edge inward to the torn line, with a soft
    // shadow just inside the tear.
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    traceEdge(t, function (x, y, first) { if (first) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); } });
    ctx.closePath();
    ctx.fillStyle = PAPER;
    ctx.fill('evenodd');
    // Shadow line along the tear, inside the photograph.
    ctx.beginPath();
    traceEdge(t, function (x, y, first) {
      if (first) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
    });
    ctx.closePath();
    ctx.strokeStyle = hexA(SEPIA_DK, 0.35);
    ctx.lineWidth = Math.max(1, S * 0.002);
    ctx.stroke();

    // Halftone grain over the whole photograph: each dot breathes slowly
    // on its own phase, so the grain is the subject that stays. The
    // phase is a pure function of t, quantized to 0.5 s steps so the
    // grain shimmers instead of flickering.
    var tq = Math.floor(t * 2) / 2;
    var gi;
    for (gi = 0; gi < GRAIN.length; gi++) {
      var g = GRAIN[gi];
      var ga = 0.05 + 0.07 * (0.5 + 0.5 * Math.sin(tq * 0.5 + g.ph));
      ctx.fillStyle = hexA(g.lt ? GRAIN_LT : GRAIN_DK, a4(ga));
      var gr = g.r * S;
      var gx = g.x * W, gy = g.y * H;
      ctx.beginPath(); ctx.moveTo(gx + gr, gy); ctx.arc(gx, gy, gr, 0, Math.PI * 2); ctx.fill();
    }

    // The bird, on its long loop: crossing for the first 150 s of the
    // 240 s cycle, resting out of frame after. At FIRST_T it is
    // mid-crossing, centre frame.
    if (ph < CROSS) {
      var bp = birdPos(ph / CROSS);
      drawBird(bp.x, bp.y, t);
    }

    // Plates: title top-left, number and formula date below it. Ink is
    // dark sepia, legible on the cream border and the sepia sky alike.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Still Life', 18, 34);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№612 · 2003 · 09 · 15', 18, 34 + fs2 + 8);

    // Hint, centered at the bottom: watch only.
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.textAlign = 'center';
    var hint = 'Stay a while. The grain is the subject.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    if (W < 560) {
      ctx.fillText('Stay a while.', W / 2, H - 48);
      ctx.fillText('The grain is the subject.', W / 2, H - 30);
    } else {
      ctx.fillText(hint, W / 2, H - 40);
    }
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs under 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
