<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sail Race</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #D8D4CC; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  // Strict palette
  var WHITE = "#F4F1EA";
  var RED = "#C8102E";
  var GREEN = "#2FA84F";
  var BLUE = "#2F6BC0";
  var GROUND = "#D8D4CC";
  var HORIZON = "#B9B2A4";

  var LOOP = 48; // seconds, seamless

  // Sails: integer laps per loop so every sail returns exactly to its
  // start at t = LOOP, and unequal laps make overtakes happen naturally.
  //   red:   1 lap / loop  (48 s per crossing)
  //   green: 2 laps / loop (24 s per crossing)
  //   blue:  3 laps / loop (16 s per crossing)
  // Billow cycles per loop are also integers (3 / 4 / 5).
  var SAILS = [
    { color: RED,   lane: -1, u0: 0.33, laps: 1, billowCycles: 3, phase: 0.0 },
    { color: GREEN, lane:  0, u0: 0.47, laps: 2, billowCycles: 4, phase: 2.1 },
    { color: BLUE,  lane:  1, u0: 0.59, laps: 3, billowCycles: 5, phase: 4.2 }
  ];

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (window.screen) {
      sw = window.screen.width || 0;
      sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    DPR = window.devicePixelRatio || 1;
    W = Math.round(w);
    H = Math.round(h);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () { resize(); draw(currentT); });
  }
  window.addEventListener("resize", function () { resize(); draw(currentT); });

  // Lane geometry: three parallel diagonal lanes running bottom-left to
  // top-right. The visible lane segment runs from (0.08W, 0.92H) to
  // (0.92W, 0.12H) (starting a little higher, 0.88H, on tall phone
  // frames so the lowest lane's sail stays inside); it is extended 20
  // percent past both ends so a sail wraps around (u crossing 1 back
  // to 0) while off-frame, never with a visible pop. Lanes are offset
  // perpendicular to the travel direction.
  function layout() {
    var minDim = Math.min(W, H);
    var phone = isPhone();
    var sailH = (phone ? 0.34 : 0.38) * minDim;
    var sx = 0.08 * W, sy = (phone ? 0.88 : 0.92) * H;
    var ex = 0.92 * W, ey = 0.12 * H;
    var dx = ex - sx, dy = ey - sy;
    var dl = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / dl, uy = dy / dl;
    // Perpendicular for lane separation.
    var px = -uy, py = ux;
    var laneSep = 0.15 * minDim;
    var ext = 0.20;
    return {
      sailH: sailH,
      px: px, py: py,
      laneSep: laneSep,
      x0: sx - dx * ext, y0: sy - dy * ext,
      x1: ex + dx * ext, y1: ey + dy * ext
    };
  }

  function frac(x) { return x - Math.floor(x); }

  // Sail outline in the sail's local frame: origin at the tack (lower
  // front corner of the foot), x trailing back, y up (negative = up on
  // screen when added). The leech (head-to-clew edge) bulges outward by
  // a sine over the height fraction, its amplitude breathing on the
  // sail's own integer billow cycle.
  function sailPath(L, sail, t) {
    var S = L.sailH;
    var foot = 0.54 * S;
    var lean = 0.10 * S;
    var clewLift = 0.05 * S;
    // Billow amplitude: base bulge modulated +/- 30 percent over time.
    var bt = 2 * Math.PI * (sail.billowCycles * (t / LOOP)) + sail.phase;
    var amp = 0.16 * S * (0.78 + 0.30 * Math.sin(bt));
    var SEG = 24;
    var i, f, x, y, bx, by, nx, ny;

    ctx.beginPath();
    // Tack -> head (luff edge), slight forward bow.
    ctx.moveTo(0, 0);
    for (i = 1; i <= SEG; i++) {
      f = i / SEG;
      x = lean * f;
      y = -S * f;
      // bow perpendicular to luff, small
      bx = x + amp * 0.22 * Math.sin(Math.PI * f);
      by = y;
      ctx.lineTo(bx, by);
    }
    // Head -> clew (leech edge), main billow.
    for (i = 1; i <= SEG; i++) {
      f = i / SEG;
      x = lean + (foot - lean) * f;
      y = -S + (S - clewLift) * f;
      // outward normal to leech, pointing back and away from the cloth
      nx = 0.86; ny = 0.51;
      var b = amp * Math.sin(Math.PI * f);
      ctx.lineTo(x + nx * b, y + ny * b);
    }
    // Clew -> tack (foot), near straight with a slight sag.
    for (i = 1; i <= SEG; i++) {
      f = i / SEG;
      x = foot * (1 - f);
      y = -clewLift * (1 - f) + 0.02 * S * Math.sin(Math.PI * f);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function drawSail(L, sail, posX, posY, t, alpha) {
    var S = L.sailH;
    ctx.save();
    ctx.translate(posX, posY);
    ctx.globalAlpha = alpha;
    sailPath(L, sail, t);
    ctx.save();
    ctx.clip();
    // Horizontal stripes clipped to the sail: uniform bands of white
    // alternating with the sail's color, counted from the head down.
    var bands = 9;
    var bh = S / bands;
    var foot = 0.54 * S;
    var maxX = foot + 0.30 * S;
    for (var i = 0; i < bands; i++) {
      ctx.fillStyle = (i % 2 === 0) ? WHITE : sail.color;
      ctx.fillRect(-0.30 * S, -S + i * bh, maxX + 0.30 * S, bh + 1);
    }
    ctx.restore();
    // Quiet edge so white bands hold against the pale ground.
    sailPath(L, sail, t);
    ctx.globalAlpha = alpha * 0.4;
    ctx.strokeStyle = sail.color;
    ctx.lineWidth = Math.max(1, S * 0.006);
    ctx.stroke();
    ctx.restore();
  }

  function lanePoint(L, sail, u) {
    var off = sail.lane * L.laneSep;
    return {
      x: L.x0 + (L.x1 - L.x0) * u + L.px * off,
      y: L.y0 + (L.y1 - L.y0) * u + L.py * off
    };
  }

  // Anchor so the middle of the sail's foot sits on the lane point.
  function sailAnchor(L, sail, u) {
    var p = lanePoint(L, sail, u);
    return { x: p.x - 0.27 * L.sailH, y: p.y };
  }

  function draw(t) {
    if (W === 0 || H === 0) resize();
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var L = layout();

    // Flat ground: the sea as a field.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Horizon line at the lower third.
    var horizonY = H * (2 / 3);
    ctx.fillStyle = HORIZON;
    ctx.fillRect(0, horizonY, W, Math.max(1, H * 0.0022));

    var i, sail, u, a;

    // Wakes first: trailing stripe echoes at past lane positions,
    // alpha fading with distance behind the sail.
    for (i = 0; i < SAILS.length; i++) {
      sail = SAILS[i];
      u = frac(sail.u0 + sail.laps * (t / LOOP));
      var trail = [0.030, 0.065];
      var alphas = [0.14, 0.06];
      for (var k = 0; k < trail.length; k++) {
        var uu = u - trail[k];
        if (uu < -0.2) continue;
        a = sailAnchor(L, sail, uu);
        drawSail(L, sail, a.x, a.y, t, alphas[k]);
      }
    }

    // Sails, far lane first.
    for (i = 0; i < SAILS.length; i++) {
      sail = SAILS[i];
      u = frac(sail.u0 + sail.laps * (t / LOOP));
      a = sailAnchor(L, sail, u);
      drawSail(L, sail, a.x, a.y, t, 1);
    }
  }

  var currentT = 0;
  resize();
  draw(0);

  if (typeof requestAnimationFrame === "function") {
    var start = null;
    var frame = function (ts) {
      if (start === null) start = ts;
      currentT = ((ts - start) / 1000) % LOOP;
      draw(currentT);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
