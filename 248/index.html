<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.248 Secretariat Study</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EFE8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.248 Secretariat Study (Avantika Bawa). After her Secretariat
// series and Greyongrey prints: a hard edge abstraction of Le
// Corbusier's Chandigarh Secretariat, stacked horizontal slabs
// and a brise-soleil grid, drawn in graphite on paper. Every
// line is admirably straight but hand drawn, wobbling a percent
// or two off true, and the whole elevation is embossed once more,
// offset a breath, in the pale ghost tone. Strictly monochrome,
// a still drawing. Tap reseeds a new abstraction of the same
// building grammar.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F2EFE8', GRAPHITE = '#2B2B2B', OIL = '#141414', GHOST = '#D8D4C8';
var W = 0, H = 0, phone = false;
var taps = 0;
var strokes = []; // {pts:[{x,y}..], w, oil}

function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// One hand drawn stroke from (x1,y1) to (x2,y2): a segmented
// polyline pulled toward its straight target with low amplitude
// seeded noise, one to two percent of the length, endpoints true.
function handLine(list, r, x1, y1, x2, y2, w, oil) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.hypot(dx, dy);
  if (len < 1) return;
  var px = -dy / len, py = dx / len;
  var amp = Math.min(3.4, len * 0.013);
  var ph1 = r() * Math.PI * 2, ph2 = r() * Math.PI * 2;
  var f2 = 1.7 + r() * 1.1;
  var K = Math.max(4, Math.min(16, Math.round(len / 46)));
  var pts = [];
  for (var i = 0; i <= K; i++) {
    var t = i / K;
    var off = amp * Math.sin(Math.PI * t) * (0.62 * Math.sin(Math.PI * 2 * t + ph1) + 0.38 * Math.sin(Math.PI * 2 * f2 * t + ph2));
    pts.push({ x: x1 + dx * t + px * off, y: y1 + dy * t + py * off });
  }
  list.push({ pts: pts, w: w, oil: oil });
}

function build() {
  strokes = [];
  if (W < 10 || H < 10) return;
  var r = rng(24811 + taps * 7919);
  var u = Math.max(0.55, W / 1250); // rough design scale
  var x0 = W * 0.235, x1 = W * 1.045; // cropped by the right edge
  var y0 = H * 0.150, y1 = H * 0.850;
  var nSlabs = 6 + Math.floor(r() * 5); // 6 to 10 stacked slabs
  var weights = [], wsum = 0, i;
  for (i = 0; i < nSlabs; i++) { var wgt = 0.6 + r() * 0.9; weights.push(wgt); wsum += wgt; }
  var cellW = (30 + r() * 20) * u * 1.6;

  var ys = [y0];
  for (i = 0; i < nSlabs; i++) ys.push(y0 + (y1 - y0) * (weights.slice(0, i + 1).reduce(function (a, b) { return a + b; }, 0)) / wsum);

  for (i = 0; i < nSlabs; i++) {
    var top = ys[i], bot = ys[i + 1], hh = bot - top;
    // slab boundary line
    handLine(strokes, r, x0 - 14 * u, top, x1, top, 2.6 * u + 0.6, false);
    // deep reveal: a second dark line just under some slab tops
    if (r() < 0.45) handLine(strokes, r, x0, top + 5 * u, x1, top + 5 * u, 1.6 * u + 0.4, true);
    var open = r() < 0.22; // a recessed floor: sparse verticals
    var skip = open ? 0.62 : 0.22;
    for (var x = x0 + cellW * (0.35 + r() * 0.3); x < x1 - 4; x += cellW) {
      if (r() < skip) continue;
      var deep = r() < 0.12;
      handLine(strokes, r, x, top + 3 * u, x, bot - 3 * u, deep ? 3.1 * u : 1.5 * u + 0.4, deep);
    }
    // some brise cells get a mid rail
    if (!open && r() < 0.5) handLine(strokes, r, x0, top + hh * 0.52, x1, top + hh * 0.52, 1.2 * u + 0.3, false);
  }
  // base line and end wall
  handLine(strokes, r, x0 - 20 * u, y1, x1, y1, 4 * u + 0.8, true);
  handLine(strokes, r, x0, y0, x0, y1, 3 * u + 0.6, true);
  handLine(strokes, r, x0 - 16 * u, y0, x0 - 16 * u, y1, 1.6 * u + 0.4, false);
  // roof: the top slab runs long to the left, a rooftop block and fin
  handLine(strokes, r, x0 - 46 * u, y0, x1, y0, 3 * u + 0.6, false);
  var bx = x0 + (0.10 + r() * 0.2) * (x1 - x0), bw = (54 + r() * 50) * u, bh = (20 + r() * 14) * u;
  handLine(strokes, r, bx, y0, bx, y0 - bh, 2 * u + 0.4, false);
  handLine(strokes, r, bx, y0 - bh, bx + bw, y0 - bh, 2 * u + 0.4, false);
  handLine(strokes, r, bx + bw, y0 - bh, bx + bw, y0, 2 * u + 0.4, false);
  var fx = x0 + (0.55 + r() * 0.25) * (x1 - x0);
  handLine(strokes, r, fx, y0, fx, y0 - (30 + r() * 22) * u, 1.6 * u + 0.4, false);
  // one diagonal: the ramp, low in the elevation
  var rx = x0 + (0.30 + r() * 0.25) * (x1 - x0);
  handLine(strokes, r, rx, y1, rx + (120 + r() * 90) * u, y1 - (y1 - y0) * (0.30 + r() * 0.18), 1.8 * u + 0.4, false);
}

function drawStroke(st, dx, dy, ghostPass) {
  ctx.beginPath();
  for (var i = 0; i < st.pts.length; i++) {
    var p = st.pts[i];
    if (i === 0) ctx.moveTo(p.x + dx, p.y + dy);
    else ctx.lineTo(p.x + dx, p.y + dy);
  }
  ctx.lineWidth = st.w;
  ctx.strokeStyle = ghostPass ? GHOST : (st.oil ? OIL : GRAPHITE);
  ctx.stroke();
}

function draw() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var u = Math.max(0.55, W / 1250);
  var gx = 2 * u + 0.6, gy = -(2 * u + 0.6);
  var i;
  for (i = 0; i < strokes.length; i++) drawStroke(strokes[i], gx, gy, true); // emboss first
  for (i = 0; i < strokes.length; i++) drawStroke(strokes[i], 0, 0, false);
}

// ---- interaction: tap or double tap reseeds the grammar ------------------------------
canvas.addEventListener('pointerdown', function () {
  taps++;
  build();
  draw();
});

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
function frame() {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  draw();
}
resize();
frame();
if (typeof requestAnimationFrame === 'function') {
  var loop = function () { frame(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
