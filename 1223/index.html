<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>[pink noise]</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // [pink noise] - Clint Enns study block CE8, after Hollis Frampton's bracketing.
  // A film with no image: only subtitles describing sounds that are not there.
  // The screen is black for the full cycle. There is no sound, and no audio
  // API is used anywhere in this file, by design - absence is the spec.
  // Dragging reveals a faint waveform of the noise that is not playing; it is
  // generated from its own slow swell and never illustrates a caption.

  var BG = '#050505';
  var CARD_TEXT = 'PUT ON 3D GLASSES NOW - INSERT EARPLUGS';
  var CARD_COLOR = '#FFB000';
  var CAP_INNER = '#E8E8E8';
  var CAP_BRACKET = '#6A6A72';
  var WAVE_COLOR = '#9A8A90';
  var CARD_END = 5;        // instruction card held [0, 5)
  var T0 = 2;              // fixed first-frame phase: inside the card

  // ---------- seeded hash (deterministic; no random calls anywhere) ----------
  function hash01(n) {
    var x = ((n >>> 0) ^ 0x9E3779B9) >>> 0;
    x = Math.imul(x ^ (x >>> 16), 0x21F0AAAD);
    x = Math.imul(x ^ (x >>> 15), 0x735A2D97);
    x ^= x >>> 15;
    return (x >>> 0) / 4294967296;
  }

  // ---------- the caption sequence ----------
  // The four given captions stand at their places (opener first after the
  // card); the rest are written in the same register - domestic, specific,
  // faintly wrong. The last caption is the opener reprised, a bookend.
  var CAPS = [
    '[pink noise]',
    '[a door closes upstairs]',
    '[rain, somewhere else]',
    '[the radiator ticks]',
    '[the hum gets louder]',
    '[a fridge cycles off]',
    '[footsteps, then not]',
    '[a television through a wall]',
    '[silence, but the wrong kind]',
    '[breathing, not yours]',
    '[a tap dripping into a full sink]',
    '[the pipes knock twice]',
    '[a phone buzzing inside a drawer]',
    '[the floor settling]',
    '[a chair moves, no one in it]',
    '[wind, against the wrong window]',
    '[the fridge cycles back on]',
    '[a radio left on in an empty room]',
    '[your own pulse, in one ear]',
    '[traffic, or water, far off]',
    '[the hum gets softer]',
    '[pink noise]'
  ];

  // Schedule: each caption is preceded by a gap of 2-6 s and held 4-8 s.
  // Durations are hashed per caption (seed 1), cube-shaped so most are
  // short and a few run long; a trailing gap closes the loop.
  var SEED = 1;
  var SCHED = [];          // {text, start, end} in cycle-local seconds
  var CYCLE;
  (function buildSchedule() {
    var cur = CARD_END;
    for (var i = 0; i < CAPS.length; i++) {
      var gap = 2 + 4 * Math.pow(hash01(SEED * 7919 + i * 2), 3);
      var hold = 4 + 4 * Math.pow(hash01(SEED * 7919 + i * 2 + 1), 3);
      var start = cur + gap;
      SCHED.push({ text: CAPS[i], start: start, end: start + hold });
      cur = start + hold;
    }
    var trail = 2 + 4 * Math.pow(hash01(SEED * 7919 + 999), 3);
    CYCLE = cur + trail;   // 183.99 s
  })();

  // ---------- the waveform that is not playing ----------
  // A 1/f-ish value function of position and piece time: five summed sines,
  // amplitudes falling as 1/(k+1), phases hashed, drift slow. Its swell has
  // a ~23 s period of its own, unrelated to any caption start or end.
  var WAVE_K = 5;
  var waveFreq = [], waveAmp = [], wavePhase = [], waveDrift = [];
  (function buildWave() {
    var fr = [1.5, 3.7, 7.9, 15.3, 28.1];
    var norm = 0;
    for (var k = 0; k < WAVE_K; k++) {
      waveFreq.push(fr[k]);
      waveAmp.push(1 / (k + 1));
      wavePhase.push(hash01(5000 + k) * Math.PI * 2);
      waveDrift.push(0.05 / (k + 1));
      norm += waveAmp[k];
    }
    for (var j = 0; j < WAVE_K; j++) waveAmp[j] /= norm;
  })();
  function waveY(xn, t) {  // xn: 0..1 across the frame; returns -1..1
    var s = 0;
    for (var k = 0; k < WAVE_K; k++) {
      s += waveAmp[k] * Math.sin(Math.PI * 2 * (waveFreq[k] * xn + waveDrift[k] * t) + wavePhase[k]);
    }
    var swell = 0.6 + 0.4 * Math.sin(Math.PI * 2 * t / 23 + 1.3);
    return s * swell;
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, isPhone = false;

  function fit() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    isPhone = (Math.min(sw, sh) < 700) || (h > w * 1.15);
  }
  fit();

  // ---------- pointer state: recorded events, visibility is closed-form --
  // vis rises over 0.30 s while the pointer is held, falls over 0.50 s after
  // release; the waveform alpha is vis * 0.35, never more.
  var pEvents = [];        // {t, down}
  var lastT = T0;
  function visAt(t) {
    var v = 0, prev = null;
    for (var i = 0; i < pEvents.length; i++) {
      var e = pEvents[i];
      if (e.t > t) break;
      if (prev !== null) {
        var dt = e.t - prev.t;
        v += prev.down ? dt / 0.30 : -dt / 0.50;
        if (v > 1) v = 1; if (v < 0) v = 0;
      }
      prev = e;
    }
    if (prev !== null) {
      var dt2 = t - prev.t;
      v += prev.down ? dt2 / 0.30 : -dt2 / 0.50;
      if (v > 1) v = 1; if (v < 0) v = 0;
    }
    return v;
  }
  function record(down) {
    pEvents.push({ t: lastT, down: down });
    if (pEvents.length > 512) pEvents.splice(0, pEvents.length - 512);
    draw(lastT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function () { record(true); });
    canvas.addEventListener('pointerup', function () { record(false); });
    canvas.addEventListener('pointercancel', function () { record(false); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerup', function () { record(false); });
    window.addEventListener('resize', function () { fit(); draw(lastT); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { fit(); draw(lastT); });
    }
  }

  // ---------- text ----------
  function fitFont(text, maxFs, weight) {
    var fs = maxFs;
    ctx.font = weight + ' ' + fs + 'px ui-monospace, Menlo, Consolas, monospace';
    var tw = ctx.measureText(text).width;
    var maxW = W * 0.92;
    if (tw > maxW && tw > 0) {
      fs = Math.max(11, Math.floor(fs * maxW / tw));
      ctx.font = weight + ' ' + fs + 'px ui-monospace, Menlo, Consolas, monospace';
    }
    return fs;
  }

  function drawCaption(text, y, alpha) {
    var maxFs = isPhone ? 19 : 26;
    fitFont(text, maxFs, '500');
    ctx.textBaseline = 'middle';
    var inner = text.slice(1, -1);
    var wOpen = ctx.measureText('[').width;
    var wInner = ctx.measureText(inner).width;
    var wClose = ctx.measureText(']').width;
    var x = W / 2 - (wOpen + wInner + wClose) / 2;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = CAP_BRACKET;
    ctx.fillText('[', x, y);
    ctx.fillStyle = CAP_INNER;
    ctx.fillText(inner, x + wOpen, y);
    ctx.fillStyle = CAP_BRACKET;
    ctx.fillText(']', x + wOpen + wInner, y);
    ctx.globalAlpha = 1;
  }

  function drawCard(y) {
    var maxFs = isPhone ? 24 : 32;
    fitFont(CARD_TEXT, maxFs, '600');
    ctx.textBaseline = 'middle';
    ctx.fillStyle = CARD_COLOR;
    var tw = ctx.measureText(CARD_TEXT).width;
    ctx.fillText(CARD_TEXT, W / 2 - tw / 2, y);
  }

  // ---------- draw ----------
  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var lt = t % CYCLE;

    if (lt < CARD_END) {
      drawCard(H * 0.5);
    } else {
      for (var i = 0; i < SCHED.length; i++) {
        var s = SCHED[i];
        if (lt >= s.start && lt < s.end) {
          var a = Math.min(1, (lt - s.start) / 0.4, (s.end - lt) / 0.4);
          if (a > 0) drawCaption(s.text, H * 0.72, a);
          break;
        }
      }
    }

    // The waveform: only while a visitor drags the black. Decorrelated by
    // construction - its own phases, its own 23 s swell, no caption input.
    var vis = visAt(t);
    if (vis > 0) {
      ctx.globalAlpha = vis * 0.35;
      ctx.strokeStyle = WAVE_COLOR;
      ctx.lineWidth = Math.max(1, H * 0.002);
      ctx.beginPath();
      var midY = H * 0.5, amp = H * 0.16, step = Math.max(3, W / 220);
      for (var x = 0; x <= W; x += step) {
        var y = midY + waveY(x / W, t) * amp;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- first frame at fixed phase, then rAF anchored ----------
  draw(T0);
  if (typeof requestAnimationFrame !== 'undefined') {
    var startTs = null;
    var loop = function (ts) {
      if (startTs === null) startTs = ts;
      draw(T0 + (ts - startTs) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
