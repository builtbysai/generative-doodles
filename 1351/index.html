<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinetic Scroll</title>
<style>html,body{margin:0;padding:0;background:#171512;overflow:hidden;height:100%}canvas{display:block;touch-action:none}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

var GROUND = '#171512';
var PLY = '#A87F4E';
var PLYEDGE = '#7A5A34';
var ACRYLIC = 'rgba(207,224,232,0.40)';
var HATCH = '#8AA0B0';
var COTTON = '#EFE8D8';
var COTTONDARK = '#D8CDB2';
var PIGMENTS = ['#2E5A7A', '#C86A3A', '#3E6B4A'];
var THREADCOLORS = ['#A02C2C', '#2E5A7A', '#3E6B4A'];

var SEGLEN = 260;
var O0 = 320; /* scroll offset at frame one: scroll partially revealed */

var W = 0, H = 0;
function isPhone(){
  if (typeof window !== 'undefined' && window.screen){
    var m = Math.min(window.screen.width, window.screen.height);
    if (m < 700){ return true; }
  }
  return H > W * 1.15;
}
function size(){
  var vw = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.width : window.innerWidth;
  var vh = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.height : window.innerHeight;
  W = vw; H = vh;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
size();
if (typeof window !== 'undefined' && window.addEventListener){
  if (window.visualViewport && window.visualViewport.addEventListener){ window.visualViewport.addEventListener('resize', function(){ size(); draw(currentT); }); }
  window.addEventListener('resize', function(){ size(); draw(currentT); });
}

/* Geometry, recomputed per draw so resizes stay correct. */
function geom(){
  var fw, fh;
  if (isPhone()){ fw = 0.92 * W; fh = fw * 0.62; }
  else { fw = 0.84 * W; fh = Math.min(0.84 * H, fw * 0.62); }
  var fx = (W - fw) / 2, fy = (H - fh) / 2;
  var edge = Math.max(8, Math.round(Math.min(fw, fh) * 0.02));
  var ix = fx + edge, iy = fy + edge, iw = fw - 2 * edge, ih = fh - 2 * edge;
  var panW = iw / 3;
  var gap = Math.max(4, Math.round(panW * 0.03));
  var pw = (panW - 2 * gap) / 3;
  var sx = ix + panW, sw = iw - panW, sy = iy, sh = ih;
  return {fx:fx, fy:fy, fw:fw, fh:fh, edge:edge, ix:ix, iy:iy, iw:iw, ih:ih,
          panW:panW, gap:gap, pw:pw, sx:sx, sw:sw, sy:sy, sh:sh};
}

/* Recorded pointer events only. Closed-form motor: each move event
   contributes a capped displacement that eases in with tau 0.35 s, so the
   offset is a pure function of the event list and piece time — never
   frame-integrated state. Idle > 2 s means every contribution has
   saturated and the scroll holds. */
var moves = []; /* {t, dx} */
var taps = 0;
var downPos = null;
var lastMoveT = -100;
var currentT = 0;

function offsetAt(t){
  var off = O0;
  for (var i = 0; i < moves.length; i++){
    var m = moves[i];
    if (t <= m.t){ continue; }
    off += m.dx * (1 - Math.exp(-(t - m.t) / 0.35));
  }
  return off;
}
function threadColor(){
  return THREADCOLORS[taps % THREADCOLORS.length];
}
function needleMoving(t){
  return (t - lastMoveT) < 2;
}

function onMove(e){
  var x = (typeof e.clientX === 'number') ? e.clientX : 0;
  if (lastMoveT >= 0 && typeof onMove.prevX === 'number'){
    var dx = x - onMove.prevX;
    if (dx !== 0){
      var capped = Math.max(-90, Math.min(90, dx * 0.6));
      moves.push({t: currentT, dx: capped});
    }
  }
  onMove.prevX = x;
  lastMoveT = currentT;
}
function onDown(e){
  downPos = {x: (typeof e.clientX === 'number') ? e.clientX : 0,
             y: (typeof e.clientY === 'number') ? e.clientY : 0};
}
function onUp(e){
  if (downPos){
    var dx = ((typeof e.clientX === 'number') ? e.clientX : 0) - downPos.x;
    var dy = ((typeof e.clientY === 'number') ? e.clientY : 0) - downPos.y;
    if (Math.sqrt(dx * dx + dy * dy) < 12){ taps++; }
  }
  downPos = null;
}
if (canvas.addEventListener){
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointerup', onUp);
}

/* One scroll segment: pure function of (row, segment index). The scroll
   is endless because content is never stored — any scroll-space position
   maps to a segment, so revealed sections recycle as new seeded bands. */
function segment(row, k){
  var rng = mulberry32(1351000 + row * 7919 + k * 104729);
  var home = PIGMENTS[row % 3];
  var col = home;
  if (rng() < 0.25){ col = PIGMENTS[Math.floor(rng() * 3)]; }
  var flecks = [];
  for (var f = 0; f < 14; f++){
    flecks.push({x: rng(), y: rng(), s: rng() < 0.5 ? 1 : 2,
                 a: 0.05 + rng() * 0.12, dark: rng() < 0.5});
  }
  return {col: col, a: 0.80 + rng() * 0.20, flecks: flecks,
          accent: rng() < 0.4, accentX: rng(), accentA: 0.15 + rng() * 0.2};
}

/* Etched marks for one acrylic panel: pure function of panel index. */
function panelEtch(pi){
  var rng = mulberry32(1351000 + pi * 7919 + 77);
  var marks = [];
  for (var m = 0; m < 5; m++){
    marks.push({x: 0.15 + rng() * 0.7, y: 0.12 + rng() * 0.76,
                r: 3 + rng() * 9, kind: Math.floor(rng() * 3)});
  }
  return {marks: marks, hatchN: 6 + Math.floor(rng() * 4), hatchOff: rng()};
}

function draw(t){
  currentT = t;
  var g = geom();
  var off = offsetAt(t);
  var needleX = g.sx + 0.55 * g.sw;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  /* Soft shadow: one flat-alpha offset rect, never shadowBlur. */
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(g.fx + 10, g.fy + 12, g.fw, g.fh);

  /* Plywood frame + edge. */
  ctx.fillStyle = PLYEDGE;
  ctx.fillRect(g.fx, g.fy, g.fw, g.fh);
  ctx.fillStyle = PLY;
  ctx.fillRect(g.ix, g.iy, g.iw, g.ih);

  /* Acrylic panels: 3 vertical, left third. */
  for (var pi = 0; pi < 3; pi++){
    var px = g.ix + g.gap + pi * (g.pw + g.gap);
    ctx.fillStyle = ACRYLIC;
    ctx.fillRect(px, g.iy, g.pw, g.ih);
    var et = panelEtch(pi);
    ctx.strokeStyle = HATCH;
    ctx.lineWidth = 1;
    for (var h = 0; h < et.hatchN; h++){
      var hx = px + ((h + et.hatchOff) / et.hatchN) * g.pw;
      ctx.beginPath();
      ctx.moveTo(hx, g.iy + 6);
      ctx.lineTo(hx + g.pw * 0.12, g.iy + g.ih - 6);
      ctx.stroke();
    }
    for (var mi = 0; mi < et.marks.length; mi++){
      var mk = et.marks[mi];
      var mx = px + mk.x * g.pw, my = g.iy + mk.y * g.ih;
      ctx.beginPath();
      if (mk.kind === 0){ ctx.arc(mx, my, mk.r, 0, Math.PI * 2); }
      else if (mk.kind === 1){ ctx.moveTo(mx - mk.r, my); ctx.lineTo(mx + mk.r, my); }
      else { ctx.moveTo(mx, my - mk.r); ctx.lineTo(mx, my + mk.r); }
      ctx.stroke();
    }
    ctx.fillStyle = HATCH;
    for (var d = 0; d < 6; d++){
      var rngd = mulberry32(1351000 + pi * 7919 + d * 31);
      ctx.fillRect(px + rngd() * g.pw, g.iy + rngd() * g.ih, 2, 2);
    }
  }

  /* Scroll: cotton ground, right two-thirds. */
  ctx.fillStyle = COTTON;
  ctx.fillRect(g.sx, g.sy, g.sw, g.sh);

  /* Pigment stripes: 3 horizontal rows, seeded segments per row. */
  var rowH = g.sh / 3;
  var firstK = Math.floor(off / SEGLEN) - 1;
  var lastK = Math.floor((off + g.sw) / SEGLEN) + 1;
  for (var row = 0; row < 3; row++){
    var ry = g.sy + row * rowH;
    for (var k = firstK; k <= lastK; k++){
      var seg = segment(row, k);
      var segX0 = g.sx + (k * SEGLEN - off);
      var segX1 = segX0 + SEGLEN;
      var cx0 = Math.max(segX0, g.sx), cx1 = Math.min(segX1, g.sx + g.sw);
      if (cx1 <= cx0){ continue; }
      ctx.fillStyle = seg.col;
      ctx.globalAlpha = seg.a;
      ctx.fillRect(cx0, ry + 2, cx1 - cx0, rowH - 4);
      ctx.globalAlpha = 1;
      if (seg.accent){
        ctx.fillStyle = seg.col;
        ctx.globalAlpha = seg.accentA;
        var ax = segX0 + seg.accentX * SEGLEN;
        if (ax >= g.sx && ax < g.sx + g.sw){ ctx.fillRect(ax, ry + 2, 3, rowH - 4); }
        ctx.globalAlpha = 1;
      }
      for (var f = 0; f < seg.flecks.length; f++){
        var fl = seg.flecks[f];
        var fx2 = segX0 + fl.x * SEGLEN;
        if (fx2 < g.sx || fx2 >= g.sx + g.sw){ continue; }
        ctx.fillStyle = fl.dark ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.30)';
        ctx.globalAlpha = fl.a;
        ctx.fillRect(fx2, ry + 2 + fl.y * (rowH - 4), fl.s, fl.s);
        ctx.globalAlpha = 1;
      }
    }
  }

  /* Rolled left edge of the scroll. */
  ctx.fillStyle = COTTONDARK;
  ctx.fillRect(g.sx, g.sy, 10, g.sh);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(g.sx + 10, g.sy, 2, g.sh);

  /* Thread: long basting curve across the scroll, stitched only up to
     the needle — the needle station sits at 55% of the scroll width, so
     frame one shows the thread stitched partway. Dashes live in
     scroll-space, so stitches travel with the cloth as it feeds. */
  var cy = g.sy + g.sh / 2;
  var amp = g.sh * 0.28;
  ctx.strokeStyle = threadColor();
  ctx.lineWidth = Math.max(2, Math.round(g.sh * 0.008));
  ctx.lineCap = 'round';
  var step = 8;
  var prevX = null, prevY = null;
  for (var x = g.sx; x <= needleX; x += step){
    var u = off + (x - g.sx);
    var y = cy + amp * Math.sin(u * 0.006 + 1.2);
    var inDash = (u % 40) < 26;
    if (prevX !== null && inDash){
      ctx.beginPath();
      ctx.moveTo(prevX, prevY);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
    prevX = x; prevY = y;
  }

  /* Needle at its station: slanted when feeding, at rest when parked. */
  var moving = needleMoving(t);
  var ny = cy + amp * Math.sin((off + (needleX - g.sx)) * 0.006 + 1.2);
  var ang = moving ? -0.35 : 0.15;
  var nl = Math.max(14, g.sh * 0.05);
  ctx.strokeStyle = '#C9D2D8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(needleX - Math.cos(ang) * nl, ny - Math.sin(ang) * nl);
  ctx.lineTo(needleX + Math.cos(ang) * nl, ny + Math.sin(ang) * nl);
  ctx.stroke();
  ctx.fillStyle = threadColor();
  ctx.beginPath();
  ctx.arc(needleX, ny, 3, 0, Math.PI * 2);
  ctx.fill();

  /* Scroll bottom edge + frame inner rule. */
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  ctx.fillRect(g.sx, g.sy + g.sh - 2, g.sw, 2);
}

/* Frame one: synchronous, constant phase, before any clock starts. */
draw(0);

function loop(ts){
  var t = ts / 1000;
  draw(t);
  if (typeof requestAnimationFrame === 'function'){ requestAnimationFrame(loop); }
}
if (typeof requestAnimationFrame === 'function'){ requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
