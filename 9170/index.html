<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eae5df">
<title>One Line &mdash; Generative Doodle No.9170</title>
<style>
  html, body { margin: 0; height: 100%; background: #eae5df; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; touch-action: none; cursor: pointer; }
  .frame { background: #c9b39b; box-shadow: 0 18px 40px rgba(60,45,35,.18), 0 3px 8px rgba(60,45,35,.12); flex: none; }
  .inner { box-shadow: inset 0 0 0 2px rgba(90,70,55,.55); }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="frame" id="f1"><div class="inner"><canvas id="c1"></canvas></div></div>
</div>
<script>
'use strict';
// One Line — Generative Doodle No.9170
// One framed canvas on a wall, after the photo Hans sent: a dusty blush
// ground and one unbroken white line that wanders, loops and crosses itself.
// The finished drawing is shown at once, no animation; tap for a new one.
// <!-- one-line-9170 -->
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}


// One unbroken line, built as a tour of big round loops: the line visits
// 5-6 loop sites across the panel, circles once around each, and travels
// to the next in a long graceful arc. That is the reference's structure:
// a few large loops, gently overlapping, sparsely laid, never a scribble.
// The turn rate ramps smoothly between loop and travel, so the line can
// never kink; loop centres and radii are constrained so the line stays
// inside the margin with no steering at all.
function genPath(seed, W, H) {
  const rnd = mulberry32(seed);
  const m = Math.min(W, H), step = m * 0.0038;
  // Loop sites: one per cell of a 2x3 grid over the panel, jittered, visited
  // in shuffled order. The grid guarantees the loops spread across the whole
  // canvas (no clustered seeds, no empty halves); the shuffle makes the
  // travel arcs cross the panel diagonally, laying crossings over the loops.
  const nLoops = 5 + Math.floor(rnd() * 2);
  const cells = [];
  for (let c = 0; c < 2; c++) for (let r = 0; r < 3; r++) cells.push([c, r]);
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = cells[i]; cells[i] = cells[j]; cells[j] = t;
  }
  const centers = cells.slice(0, nLoops).map(([c, r]) => [
    W * (0.30 + c * 0.40 + (rnd() - 0.5) * 0.08),
    H * (0.26 + r * 0.24 + (rnd() - 0.5) * 0.08)
  ]);
  const loops = centers.map((c) => {
    // Cap the radius by the room the centre has: a site near the edge gets
    // a smaller loop, leaving space for the entry transient to settle onto
    // the circle without touching the margin.
    const edgeDist = Math.min(c[0], W - c[0], c[1], H - c[1]);
    return {
      R: Math.max(m * 0.10, Math.min(m * (0.17 + rnd() * 0.06), edgeDist - m * 0.10)),
      dir: rnd() < 0.5 ? 1 : -1,
      revs: 1.1 + rnd() * 0.3
    };
  });
  const pPhase1 = rnd() * TAU, pPhase2 = rnd() * TAU;
  const pts = [], pressure = [];
  // Start on the first loop's edge, heading tangentially: at the point
  // right of the centre, the tangent for dir +1 is straight down (+y).
  let x = centers[0][0] + loops[0].R, y = centers[0][1];
  let heading = loops[0].dir > 0 ? Math.PI / 2 : -Math.PI / 2;
  let curTurn = 0, i = 0;
  const push = () => {
    pts.push([x, y]);
    pressure.push(0.82 + 0.36 * (0.5 + 0.5 * Math.sin(i * 0.013 + pPhase1)) * (0.5 + 0.5 * Math.sin(i * 0.041 + pPhase2)));
    i++;
  };
  push();
  let clamps = 0;
  // Soft wall backstop (both phases): within 8% of the margin and heading
  // outward, steer toward the panel centre. Settled loops stay 10%+ from
  // the margin, so this only fires on transients (e.g. a travel arc leaving
  // a loop toward the nearest wall) and never distorts a loop.
  const wallTurn = () => {
    const wz = m * 0.08;
    const nearL = x - W * 0.05, nearR = W * 0.95 - x, nearT = y - H * 0.05, nearB = H * 0.95 - y;
    const edgeD = Math.min(nearL, nearR, nearT, nearB);
    if (edgeD >= wz) return 0;
    let outward = false;
    if (edgeD === nearL && Math.cos(heading) < 0) outward = true;
    if (edgeD === nearR && Math.cos(heading) > 0) outward = true;
    if (edgeD === nearT && Math.sin(heading) < 0) outward = true;
    if (edgeD === nearB && Math.sin(heading) > 0) outward = true;
    if (!outward) return 0;
    const want = Math.atan2(H / 2 - y, W / 2 - x);
    let diff = want - heading;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    return clamp(diff * 0.30, -0.25, 0.25);
  };
  const advance = () => {
    x += Math.cos(heading) * step;
    y += Math.sin(heading) * step;
    const ox = x, oy = y;
    x = clamp(x, W * 0.05, W * 0.95); y = clamp(y, H * 0.05, H * 0.95);
    if (x !== ox || y !== oy) clamps++;
    push();
  };
  for (let k = 0; k < centers.length; k++) {
    // LOOP around centers[k]: a feedback controller, not a blind turn rate.
    // The desired heading is tangential to the circle, tilted inward when
    // the line is outside the radius and outward when inside, so the line
    // settles onto the circle around the intended centre whatever its entry
    // position and heading were. (A fixed turn rate would circle wherever
    // the entry geometry put it, including off the panel.)
    const C = centers[k], L = loops[k];
    const targetSwept = L.revs * TAU;
    let swept = 0, prevAng = Math.atan2(y - C[1], x - C[0]), guard = 0;
    while (swept < targetSwept && guard < 3000) {
      guard++;
      const dx = x - C[0], dy = y - C[1];
      const dist = Math.hypot(dx, dy) || 1;
      const ux = dx / dist, uy = dy / dist;
      const err = dist - L.R;
      // Tangent (dir picks the sense) plus a radial correction.
      let tx = -uy * L.dir - 0.05 * err * ux;
      let ty = ux * L.dir - 0.05 * err * uy;
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      const want = Math.atan2(ty, tx);
      let diff = want - heading;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      const targetTurn = clamp(diff * 0.1, -0.10, 0.10);
      curTurn += (targetTurn - curTurn) * 0.08;
      heading += curTurn + wallTurn();
      advance();
      const ang = Math.atan2(y - C[1], x - C[0]);
      let dAng = ang - prevAng;
      while (dAng > Math.PI) dAng -= TAU;
      while (dAng < -Math.PI) dAng += TAU;
      swept += dAng * L.dir;
      prevAng = ang;
    }
    // TRAVEL to the next loop site (skip after the last loop). Aim at the
    // near-side point of the next circle, not its centre: the line glides
    // onto the circle tangent-ready, instead of orbiting the centre and
    // starting the loop from wherever the guard gives up.
    if (k < centers.length - 1) {
      const nc = centers[k + 1], nR = loops[k + 1].R;
      guard = 0;
      while (Math.hypot(nc[0] - x, nc[1] - y) > nR * 1.15 && guard < 1500) {
        guard++;
        const ddx = x - nc[0], ddy = y - nc[1];
        const dd = Math.hypot(ddx, ddy) || 1;
        const aimX = nc[0] + (ddx / dd) * nR, aimY = nc[1] + (ddy / dd) * nR;
        const want = Math.atan2(aimY - y, aimX - x);
        let diff = want - heading;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const targetTurn = clamp(diff * 0.15, -0.10, 0.10);
        curTurn += (targetTurn - curTurn) * 0.08;
        heading += curTurn + wallTurn();
        advance();
      }
    }
  }
  return { pts, pressure, clamps };
}

const GROUND = '#d5c3c3';
const LINE = '#f7f1ea';
const CORE = '#fffdf9';

function makeGround(w, h, dpr, seed) {
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = GROUND; g.fillRect(0, 0, w, h);
  const rnd = mulberry32(seed ^ 0x9e3779b9);
  const n = Math.round(w * h / 220);
  for (let i = 0; i < n; i++) {
    const v = rnd();
    g.fillStyle = v < 0.5 ? 'rgba(120,95,95,0.05)' : 'rgba(255,244,238,0.06)';
    const r = 0.5 + rnd() * 1.4;
    g.beginPath(); g.arc(rnd() * w, rnd() * h, r, 0, TAU); g.fill();
  }
  return cv;
}

function Panel(canvas) {
  this.cv = canvas;
  this.g = canvas.getContext('2d');
  this.seed = 0;
  this.path = null;
  this.lineLayer = null;
  this.groundLayer = null;
  this.w = 0; this.h = 0; this.dpr = 1;
}
Panel.prototype.resize = function (w, h, dpr) {
  this.w = w; this.h = h; this.dpr = dpr;
  this.cv.width = Math.max(1, Math.round(w * dpr));
  this.cv.height = Math.max(1, Math.round(h * dpr));
  this.cv.style.width = w + 'px'; this.cv.style.height = h + 'px';
  this.lineLayer = document.createElement('canvas');
  this.lineLayer.width = this.cv.width; this.lineLayer.height = this.cv.height;
};
Panel.prototype.reseed = function (seed) {
  this.seed = seed;
  this.path = genPath(seed, this.w, this.h);
  this.groundLayer = makeGround(this.w, this.h, this.dpr, seed);
  const lg = this.lineLayer.getContext('2d');
  lg.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  lg.clearRect(0, 0, this.w, this.h);
  // Stroke the whole line at once: the piece IS the finished drawing.
  for (let i = 0; i < this.path.pts.length - 1; i++) this.strokeSeg(i);
  this.paint();
};
Panel.prototype.strokeSeg = function (i) {
  const p = this.path.pts, pr = this.path.pressure;
  const w0 = Math.min(this.w, this.h) * 0.016 * pr[i];
  const lg = this.lineLayer.getContext('2d');
  lg.lineCap = 'round'; lg.lineJoin = 'round';
  const x0 = p[i][0], y0 = p[i][1], x1 = p[i + 1][0], y1 = p[i + 1][1];
  lg.strokeStyle = 'rgba(247,241,234,0.28)'; lg.lineWidth = w0 * 1.6;
  lg.beginPath(); lg.moveTo(x0, y0); lg.lineTo(x1, y1); lg.stroke();
  lg.strokeStyle = LINE; lg.globalAlpha = 0.92; lg.lineWidth = w0;
  lg.beginPath(); lg.moveTo(x0, y0); lg.lineTo(x1, y1); lg.stroke();
  lg.strokeStyle = CORE; lg.globalAlpha = 0.5; lg.lineWidth = w0 * 0.45;
  lg.beginPath(); lg.moveTo(x0, y0); lg.lineTo(x1, y1); lg.stroke();
  lg.globalAlpha = 1;
};
Panel.prototype.paint = function () {
  const g = this.g;
  g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  g.clearRect(0, 0, this.w, this.h);
  g.drawImage(this.groundLayer, 0, 0, this.w, this.h);
  g.drawImage(this.lineLayer, 0, 0, this.w, this.h);
};

const c1 = document.getElementById('c1');
const f1 = document.getElementById('f1');
const stage = document.getElementById('stage');
const panel = new Panel(c1);
let seed = (Math.random() * 1e9) | 0;

function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const vmin = Math.min(vw, vh);
  const pad = clamp(vmin * 0.012, 6, 12);
  stage.style.padding = (vmin * 0.03) + 'px';
  f1.style.padding = pad + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  // One portrait panel (aspect 0.80), as large as the viewport allows.
  const availW = vw * 0.92 - 2 * pad, availH = vh * 0.92 - 2 * pad;
  const h = Math.min(availH, availW / 0.80);
  const w = h * 0.80;
  panel.resize(w, h, dpr);
}

layout();
panel.reseed(seed);

let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  // Same seed: the same drawing, rescaled to the new size.
  resizeTimer = setTimeout(() => { layout(); panel.reseed(seed); }, 200);
});

stage.addEventListener('pointerdown', () => {
  seed = (Math.random() * 1e9) | 0;
  panel.reseed(seed);
});

// Test hooks (harness only): path generator + panel state.
window.__genPath = genPath;
window.__panel = panel;
window.__panels = [panel];
</script>
</body>
</html>
