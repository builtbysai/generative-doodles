<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.366 Lobster Stripefield</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1E3A5C; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.366 Lobster Stripefield (jmarie.creates).
// After Julianne Haness's "Modern Nautical" lobsters and her
// "Swans and Stripes" series ("they needed some bold stripes"):
// bold horizontal stripe bands as the whole ground field, with
// hand-drawn lobsters stamped along the stripe boundaries,
// centred on the boundary line so each one overlaps both bands.
// The lobster is ONE hand-authored vector (tail fan, segmented
// abdomen, thorax, rostrum, stalked eyes, two unequal claws,
// four leg pairs, two antenna pairs), replayed from a fixed
// placement table at mixed facings, tilts and scales.
// The whole field drifts horizontally like a tide: the drift
// travels exactly one lobster period (640 design px) per 36s
// loop, so frame 36s is pixel-identical to frame 0. The bands
// are uniform along x, so the slide is carried by the riders
// parented to their band edges. Frame one is drawn at the
// constant phase T = 11.0s, drift mid-slide; the animation
// clock is anchored to that constant plus elapsed time, never
// a wall-clock offset. Drag pans the oversized repeat and the
// position persists on release. Double-tap flips between
// exactly two authored stripe palettes: nautical navy/cream
// with coral-red lobsters, and a sunset coral/teal variant
// with navy lobsters. Flat colour only, crisp rectangles,
// stripes never wavy.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var XPERIOD = 640, YPERIOD = 920;   // lobster period / band tile height
var LOOP = 36;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 11.0, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var palIdx = 0;
var userPanX = 0, userPanY = 0;

// ---- the two authored palettes --------------------------------
// stripes s1/s2, lobster body, darker detail ink.
var PALETTES = [
  { s1: '#1E3A5C', s2: '#F5EEDC', lob: '#C9403B', ink: '#7E211C' },  // nautical
  { s1: '#E2703A', s2: '#2E7E7B', lob: '#1E3A5C', ink: '#0E1F33' }   // sunset
];

// ---- stripe bands: fixed widths, alternating colours ----------
// Six bands per tile (even count, so every tile starts on s1 and
// the alternation never breaks at a seam). Heights sum to 920.
var BANDS = [150, 120, 180, 140, 200, 130];
var BOUNDS = [0, 150, 270, 450, 590, 790];  // boundary y per band top

// ---- lobster placement table ----------------------------------
// Per lobster: boundary index b (its y is BOUNDS[b] in tile
// coords), x inside the 640 period, facing fx, vertical flip fy,
// tilt in degrees, scale s. Ten per tile.
var LOBS = [
  { b: 0, x: 90,  fx: 1,  fy: 1,  tilt: -8,  s: 0.95 },
  { b: 0, x: 430, fx: -1, fy: 1,  tilt: 6,   s: 0.85 },
  { b: 1, x: 250, fx: 1,  fy: -1, tilt: 14,  s: 1.00 },
  { b: 1, x: 560, fx: -1, fy: 1,  tilt: -16, s: 0.78 },
  { b: 2, x: 520, fx: -1, fy: -1, tilt: -10, s: 0.90 },
  { b: 2, x: 60,  fx: 1,  fy: 1,  tilt: 6,   s: 0.80 },
  { b: 3, x: 330, fx: -1, fy: 1,  tilt: 4,   s: 1.05 },
  { b: 3, x: 40,  fx: 1,  fy: -1, tilt: 18,  s: 0.72 },
  { b: 4, x: 140, fx: 1,  fy: -1, tilt: -12, s: 0.90 },
  { b: 4, x: 470, fx: 1,  fy: 1,  tilt: 10,  s: 0.85 }
];
(function () {
  var i, sum = 0;
  if (PALETTES.length !== 2) throw new Error('need exactly 2 palettes');
  if (BANDS.length !== 6) throw new Error('need exactly 6 bands per tile');
  for (i = 0; i < BANDS.length; i++) sum += BANDS[i];
  if (sum !== YPERIOD) throw new Error('band heights must sum to the tile height');
  if (BOUNDS.length !== BANDS.length) throw new Error('need one boundary per band');
  for (i = 0; i < BANDS.length; i++) {
    var want = i === 0 ? 0 : BOUNDS[i - 1] + BANDS[i - 1];
    if (BOUNDS[i] !== want) throw new Error('boundaries must be the band tops');
  }
  if (LOBS.length !== 10) throw new Error('need exactly 10 lobsters per tile');
  for (i = 0; i < LOBS.length; i++) {
    if (LOBS[i].b < 0 || LOBS[i].b >= BANDS.length) throw new Error('lobster boundary out of range');
    if (LOBS[i].x < 0 || LOBS[i].x >= XPERIOD) throw new Error('lobster x out of period');
    if (Math.abs(LOBS[i].tilt) > 20) throw new Error('lobster tilt out of range');
    if (LOBS[i].fx !== 1 && LOBS[i].fx !== -1) throw new Error('facing must be a sign');
    if (LOBS[i].fy !== 1 && LOBS[i].fy !== -1) throw new Error('flip must be a sign');
  }
})();

// ---- the lobster ------------------------------------------------
// Local coords: origin at body centre, +x toward the head.
// Span: tail fan tip -170, antenna tips +236, claws to about
// y +/-78. Body fill pal.lob, detail pal.ink throughout.
function legPath(bx, side) {
  ctx.beginPath();
  ctx.moveTo(bx, side * 22);
  ctx.lineTo(bx - 10, side * 48);
  ctx.lineTo(bx - 26, side * 70);
}
function clawShape(pal) {
  // palm
  ctx.beginPath();
  ctx.ellipse(20, 0, 27, 14, 0, 0, Math.PI * 2);
  ctx.fillStyle = pal.lob;
  ctx.fill();
  ctx.strokeStyle = pal.ink;
  ctx.lineWidth = 2.2;
  ctx.stroke();
  // fixed finger, long and tapering forward
  ctx.beginPath();
  ctx.moveTo(38, -8);
  ctx.quadraticCurveTo(62, -16, 88, -19);
  ctx.lineTo(56, 1);
  ctx.quadraticCurveTo(42, -2, 38, -8);
  ctx.closePath();
  ctx.fillStyle = pal.lob;
  ctx.fill();
  ctx.stroke();
  // movable thumb, curving well away so the pincer gapes open
  ctx.beginPath();
  ctx.moveTo(40, 2);
  ctx.quadraticCurveTo(58, 16, 76, 30);
  ctx.lineTo(48, 10);
  ctx.quadraticCurveTo(40, 8, 40, 2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // palm knuckle dot
  ctx.beginPath();
  ctx.arc(16, 0, 3, 0, Math.PI * 2);
  ctx.fillStyle = pal.ink;
  ctx.globalAlpha = 0.55;
  ctx.fill();
  ctx.globalAlpha = 1;
}
function drawLobster(pal) {
  var side, i, bx;
  // antennae, long pair and short pair, bases hidden by the head
  ctx.strokeStyle = pal.ink;
  ctx.lineCap = 'round';
  ctx.lineWidth = 3.4;
  ctx.beginPath();
  ctx.moveTo(78, -6);
  ctx.quadraticCurveTo(150, -52, 236, -64);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(78, 6);
  ctx.quadraticCurveTo(150, 46, 230, 66);
  ctx.stroke();
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(82, -3);
  ctx.quadraticCurveTo(138, -24, 196, -30);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(82, 3);
  ctx.quadraticCurveTo(138, 26, 192, 34);
  ctx.stroke();
  // legs: four pairs, body-colour stroke with an ink centre line
  for (side = -1; side <= 1; side += 2) {
    for (i = 0; i < 4; i++) {
      bx = 30 - i * 26;
      legPath(bx, side);
      ctx.strokeStyle = pal.lob;
      ctx.lineWidth = 7;
      ctx.stroke();
      legPath(bx, side);
      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = 1.6;
      ctx.globalAlpha = 0.7;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  // tail fan: three lobes fanning back from the abdomen base
  ctx.fillStyle = pal.lob;
  ctx.strokeStyle = pal.ink;
  ctx.lineWidth = 2;
  var fan = [-0.55, 0, 0.55], fi;
  for (fi = 0; fi < 3; fi++) {
    ctx.save();
    ctx.translate(-146, 0);
    ctx.rotate(fan[fi]);
    ctx.beginPath();
    ctx.ellipse(-14, 0, 20, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  // abdomen: tapered form with segment arcs
  ctx.beginPath();
  ctx.moveTo(-148, -16);
  ctx.quadraticCurveTo(-90, -30, -30, -24);
  ctx.quadraticCurveTo(-22, 0, -30, 24);
  ctx.quadraticCurveTo(-90, 30, -148, 16);
  ctx.quadraticCurveTo(-156, 0, -148, -16);
  ctx.closePath();
  ctx.fillStyle = pal.lob;
  ctx.fill();
  ctx.strokeStyle = pal.ink;
  ctx.lineWidth = 2.2;
  ctx.stroke();
  var segX = [-118, -92, -66, -42], segH = [25, 27.5, 27, 25], si;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.8;
  for (si = 0; si < 4; si++) {
    ctx.beginPath();
    ctx.moveTo(segX[si], -segH[si]);
    ctx.quadraticCurveTo(segX[si] - 7, 0, segX[si], segH[si]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // thorax: the bulky front section
  ctx.beginPath();
  ctx.moveTo(-34, -25);
  ctx.quadraticCurveTo(8, -37, 52, -29);
  ctx.quadraticCurveTo(76, -14, 74, 0);
  ctx.quadraticCurveTo(76, 14, 52, 29);
  ctx.quadraticCurveTo(8, 37, -34, 25);
  ctx.quadraticCurveTo(-42, 0, -34, -25);
  ctx.closePath();
  ctx.fillStyle = pal.lob;
  ctx.fill();
  ctx.strokeStyle = pal.ink;
  ctx.lineWidth = 2.4;
  ctx.stroke();
  // thorax detail: centre line and two groove arcs, kept faint
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-28, 0);
  ctx.quadraticCurveTo(10, -3, 58, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(2, -30);
  ctx.quadraticCurveTo(12, 0, 2, 30);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(30, -31);
  ctx.quadraticCurveTo(40, 0, 30, 31);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // rostrum spike between the eyes
  ctx.beginPath();
  ctx.moveTo(68, -7);
  ctx.lineTo(100, 0);
  ctx.lineTo(68, 7);
  ctx.closePath();
  ctx.fillStyle = pal.lob;
  ctx.fill();
  ctx.strokeStyle = pal.ink;
  ctx.lineWidth = 2;
  ctx.stroke();
  // eye stalks and eyes
  ctx.strokeStyle = pal.ink;
  ctx.lineWidth = 3.4;
  for (side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.moveTo(64, side * 11);
    ctx.lineTo(79, side * 16);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(82, side * 17, 4.6, 0, Math.PI * 2);
    ctx.fillStyle = pal.ink;
    ctx.fill();
  }
  // claw arms, then the claws: upper claw the crusher (bigger,
  // rounder), lower the cutter (slimmer)
  for (side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.moveTo(46, side * 20);
    ctx.lineTo(90, side * 40);
    ctx.strokeStyle = pal.lob;
    ctx.lineWidth = 13;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(46, side * 20);
    ctx.lineTo(90, side * 40);
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = 1.6;
    ctx.globalAlpha = 0.55;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(96, side * 44);
    ctx.rotate(side * 0.42);
    ctx.scale(side < 0 ? 1.14 : 0.94, side);
    clawShape(pal);
    ctx.restore();
  }
}

// ---- drawing ------------------------------------------------------
function draw() {
  var pal = PALETTES[palIdx];
  var px = userPanX, py = userPanY;
  var drift = ((T % LOOP) / LOOP) * XPERIOD;
  var tx, ty, i, lb, sx, sy;
  // bands: crisp full-width rectangles, alternating colours,
  // tiled vertically over the pan range
  var tyMin = Math.floor(py / YPERIOD) - 1, tyMax = Math.floor((py + DH) / YPERIOD) + 1;
  for (ty = tyMin; ty <= tyMax; ty++) {
    for (i = 0; i < BANDS.length; i++) {
      sy = ty * YPERIOD + BOUNDS[i] - py;
      if (sy > DH || sy + BANDS[i] < 0) continue;
      ctx.fillStyle = i % 2 === 0 ? pal.s1 : pal.s2;
      ctx.fillRect(0, sy, DW, BANDS[i]);
    }
  }
  // lobsters: parented to their band boundary, riding the drift,
  // tiled over both periods around the pan
  var txMin = Math.floor((px - drift - 470) / XPERIOD), txMax = Math.floor((px - drift + DW + 470) / XPERIOD);
  for (ty = tyMin; ty <= tyMax; ty++) {
    for (tx = txMin; tx <= txMax; tx++) {
      for (i = 0; i < LOBS.length; i++) {
        lb = LOBS[i];
        sx = tx * XPERIOD + lb.x + drift - px;
        sy = ty * YPERIOD + BOUNDS[lb.b] - py;
        if (sx < -470 || sx > DW + 470 || sy < -210 || sy > DH + 210) continue;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(lb.tilt * Math.PI / 180);
        ctx.scale(lb.fx * lb.s, lb.fy * lb.s);
        drawLobster(pal);
        ctx.restore();
      }
    }
  }
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag pans (persists); double-tap flips the palette --------
var dragging = false, dragMoved = false, downX = 0, downY = 0, lastDX = 0, lastDY = 0;
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true; dragMoved = false;
  downX = p.x; downY = p.y; lastDX = p.x; lastDY = p.y;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p.x - lastDX, dy = p.y - lastDY;
  lastDX = p.x; lastDY = p.y;
  if (Math.abs(p.x - downX) + Math.abs(p.y - downY) > 8) dragMoved = true;
  if (dragMoved) {
    userPanX -= dx; userPanY -= dy;
    if (userPanX > XPERIOD) userPanX = XPERIOD;
    if (userPanX < -XPERIOD) userPanX = -XPERIOD;
    if (userPanY > YPERIOD) userPanY = YPERIOD;
    if (userPanY < -YPERIOD) userPanY = -YPERIOD;
  }
});
canvas.addEventListener('pointerup', function (e) {
  if (!dragging) return;
  dragging = false;
  if (dragMoved) return;
  var p = toDesign(e);
  var nearLast = Math.abs(p.x - lastTapX) + Math.abs(p.y - lastTapY) < 60;
  if (T - lastTapT < 0.38 && nearLast) {
    palIdx = (palIdx + 1) % PALETTES.length;
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = p.x; lastTapY = p.y;
  }
});
canvas.addEventListener('pointercancel', function () { dragging = false; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK;
    acc -= TICK; guard++;
  }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
