<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minotauro</title>
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var BLACK = '#111111', YELLOW = '#F2D800', PINK = '#F23D8A', WHITE = '#FFFFFF';
  var DESIGN = 1080;
  var PHASE0 = 4.1; // constant first-frame phase: breath mid-scale, snort at rest

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var seed = 51107;
  try {
    var m = /[?&]seed=(\d+)/.exec((typeof location !== 'undefined' && location.search) || '');
    if (m) seed = parseInt(m[1], 10) || seed;
  } catch (e) {}

  // ---------- seeded layout ----------
  function buildLayout(s) {
    var rng = mulberry32(s);
    var L = {};
    // horns: tips break the top edge, curves jitter per seed
    L.hornA = { bx: 215, by: 105, tipX: 108 + rng() * 34, tipY: -34 - rng() * 14, bow: 0.85 + rng() * 0.3 };
    L.hornB = { bx: 352, by: 80, tipX: 408 + rng() * 44, tipY: -30 - rng() * 14, bow: 0.85 + rng() * 0.3 };
    L.bootShift = Math.round(rng() * 48 - 24);        // boots slide along x per seed
    L.strapRows = 2 + Math.floor(rng() * 2);          // 2 or 3 dotted strap rows
    L.snotExpr = Math.floor(rng() * 3);               // snout expression variant 0,1,2
    L.tailCurl = 0.85 + rng() * 0.4;
    // riso grain: precomputed specks in the three inks, drawn directly (no offscreen canvas)
    L.grain = [];
    var inks = [BLACK, BLACK, PINK, YELLOW];
    for (var i = 0; i < 850; i++) {
      L.grain.push({
        x: rng() * DESIGN, y: rng() * DESIGN,
        r: 0.8 + rng() * 1.7,
        ink: inks[Math.floor(rng() * inks.length)],
        a: 0.05 + rng() * 0.08
      });
    }
    return L;
  }
  var L = buildLayout(seed);

  // ---------- view ----------
  var view = { w: 0, h: 0, dpr: 1, phone: false };
  function measure() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) || null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    view.w = w; view.h = h;
    view.dpr = window.devicePixelRatio || 1;
    var sw = window.screen ? window.screen.width : w;
    var sh = window.screen ? window.screen.height : h;
    view.phone = Math.min(sw, sh) < 700 || h > w * 1.15;
    var bw = Math.max(1, Math.round(w * view.dpr));
    var bh = Math.max(1, Math.round(h * view.dpr));
    if (canvas.width !== bw) canvas.width = bw;
    if (canvas.height !== bh) canvas.height = bh;
  }

  // ---------- creature parts (design units, 1080 square) ----------

  function massPath() {
    ctx.beginPath();
    ctx.moveTo(560, -5);
    ctx.bezierCurveTo(680, 0, 790, 45, 880, 130);       // arched back, right side
    ctx.bezierCurveTo(965, 210, 1015, 330, 1008, 455);  // haunch
    ctx.bezierCurveTo(1002, 575, 950, 690, 905, 758);
    ctx.bezierCurveTo(878, 806, 870, 872, 868, 928);    // rear leg, back edge
    ctx.lineTo(866, 962);
    ctx.lineTo(744, 968);                               // rear hoof bottom
    ctx.bezierCurveTo(742, 908, 744, 848, 730, 796);    // rear leg, front edge
    ctx.bezierCurveTo(664, 830, 578, 824, 514, 774);    // belly sag
    ctx.bezierCurveTo(474, 826, 470, 900, 474, 960);    // front leg, back edge
    ctx.lineTo(472, 966);
    ctx.lineTo(358, 972);                               // front hoof bottom
    ctx.bezierCurveTo(354, 908, 360, 836, 350, 764);    // front leg, front edge
    ctx.bezierCurveTo(342, 684, 328, 612, 300, 562);    // chest to throat
    ctx.bezierCurveTo(235, 545, 150, 510, 95, 460);     // jaw
    ctx.bezierCurveTo(30, 400, -8, 320, 6, 250);        // muzzle bulge crosses left edge
    ctx.bezierCurveTo(48, 178, 140, 128, 222, 84);      // crown
    ctx.bezierCurveTo(300, 40, 420, 0, 560, -5);        // over the top, touches top edge
    ctx.closePath();
  }

  function hornPath(h) {
    // tapered crescent from base (bx,by) to tip (tipX,tipY)
    var bx = h.bx, by = h.by, tx = h.tipX, ty = h.tipY;
    var mx = (bx + tx) / 2, my = (by + ty) / 2;
    var dx = tx - bx, dy = ty - by;
    var px = -dy * 0.22 * h.bow, py = dx * 0.22 * h.bow; // outward bow
    ctx.beginPath();
    ctx.moveTo(bx - 30, by + 16);
    ctx.quadraticCurveTo(mx + px - 6, my + py, tx, ty);
    ctx.quadraticCurveTo(mx + px + 26, my + py + 30, bx + 34, by + 4);
    ctx.closePath();
  }

  function bootPath(x, y) {
    // chunky boot: shaft at right, toe pointing left; local box 130 x 108
    ctx.beginPath();
    ctx.moveTo(x + 46, y);
    ctx.lineTo(x + 130, y);
    ctx.lineTo(x + 130, y + 60);
    ctx.bezierCurveTo(x + 130, y + 88, x + 124, y + 108, x + 104, y + 108);
    ctx.lineTo(x + 18, y + 108);
    ctx.bezierCurveTo(x + 2, y + 108, x - 4, y + 96, x + 2, y + 82);
    ctx.bezierCurveTo(x + 8, y + 70, x + 26, y + 64, x + 46, y + 58);
    ctx.closePath();
  }

  function drawBoot(x, y) {
    ctx.fillStyle = PINK;
    bootPath(x, y);
    ctx.fill();
    // dotted straps: rows of white dots across the shaft
    ctx.fillStyle = WHITE;
    for (var r = 0; r < L.strapRows; r++) {
      for (var i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(x + 60 + i * 15, y + 16 + r * 17, 4.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function draw(t) {
    measure();
    var w = view.w, h = view.h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = WHITE;
    ctx.fillRect(0, 0, w, h);

    var stage = Math.min(w, h);
    var ox = (w - stage) / 2, oy = (h - stage) / 2;
    var s = stage / DESIGN;
    ctx.translate(ox, oy);
    ctx.scale(s, s);

    // misregistration: yellow layer +3, pink layer -3 (design px), drifting slowly
    var offY = 3 + 1.8 * Math.sin(t * 0.45);
    var offP = -3 + 1.8 * Math.sin(t * 0.38 + 1.3);

    // breathing: whole creature scales 0.99..1.01 about the body pivot
    var br = 1 + 0.01 * Math.sin(t * (Math.PI * 2 / 7.3));
    ctx.save();
    ctx.translate(560, 520);
    ctx.scale(br, br);
    ctx.translate(-560, -520);

    // tail (part of the black mass read)
    ctx.strokeStyle = BLACK;
    ctx.lineCap = 'round';
    ctx.lineWidth = 17;
    ctx.beginPath();
    ctx.moveTo(985, 470);
    ctx.quadraticCurveTo(1050, 560, 1046, 636 * L.tailCurl + 110);
    ctx.stroke();
    ctx.fillStyle = BLACK;
    ctx.beginPath();
    ctx.ellipse(1046, 636 * L.tailCurl + 128, 13, 20, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // the mass: one black silhouette (head, arched back, bent legs)
    massPath();
    ctx.fillStyle = BLACK;
    ctx.fill();

    // ear
    ctx.beginPath();
    ctx.ellipse(362, 192, 30, 17, -0.45, 0, Math.PI * 2);
    ctx.fill();

    // horns (yellow layer, drawn over the crown so both crescents read in full;
    // bases stay tucked inside the silhouette, swaying at their bases)
    var sway = 0.02 * Math.sin(t * (Math.PI * 2 / 5.9) + 0.7);
    ctx.fillStyle = YELLOW;
    var horns = [L.hornA, L.hornB];
    for (var hi = 0; hi < horns.length; hi++) {
      ctx.save();
      ctx.translate(horns[hi].bx + offY, horns[hi].by + offY * 0.4);
      ctx.rotate(sway * (hi === 0 ? 1 : -0.8));
      ctx.translate(-horns[hi].bx, -horns[hi].by);
      hornPath(horns[hi]);
      ctx.fill();
      ctx.restore();
    }

    // arm reaching down to the purse (black, part of the creature)
    ctx.lineWidth = 30;
    ctx.beginPath();
    ctx.moveTo(952, 700);
    ctx.quadraticCurveTo(905, 770, 868, 812);
    ctx.stroke();

    // boots (pink layer) on both bent legs
    drawBoot(330 + L.bootShift + offP, 872);
    drawBoot(716 - L.bootShift * 0.6 + offP, 872);

    // envelope purse (white, thin black outline), bottom-right, 1/5 canvas wide
    ctx.save();
    ctx.translate(945, 890);
    ctx.rotate(-0.06);
    ctx.fillStyle = WHITE;
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.rect(-100, -66, 200, 132);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath(); // flap
    ctx.moveTo(-100, -66);
    ctx.lineTo(0, 6);
    ctx.lineTo(100, -66);
    ctx.stroke();
    ctx.fillStyle = BLACK; // clasp
    ctx.beginPath();
    ctx.arc(0, 12, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // hoof gripping the purse corner
    ctx.fillStyle = BLACK;
    ctx.beginPath();
    ctx.arc(860, 818, 25, 0, Math.PI * 2);
    ctx.fill();

    // snout (pink layer)
    ctx.fillStyle = PINK;
    ctx.beginPath();
    ctx.ellipse(205 + offP, 418, 98, 64, 0, 0, Math.PI * 2);
    ctx.fill();
    // nostrils (size follows the seeded expression)
    var nr = L.snotExpr === 1 ? 7.5 : (L.snotExpr === 2 ? 4.5 : 5.5);
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(148 + offP, 426, nr, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(202 + offP, 434, nr, 0, Math.PI * 2); ctx.fill();
    // mouth: arc / flat line / small open oval by expression
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = 4.5;
    if (L.snotExpr === 0) {
      ctx.beginPath(); ctx.arc(178 + offP, 458, 15, 0.25, Math.PI - 0.9); ctx.stroke();
    } else if (L.snotExpr === 1) {
      ctx.beginPath(); ctx.moveTo(162 + offP, 466); ctx.lineTo(196 + offP, 466); ctx.stroke();
    } else {
      ctx.fillStyle = BLACK;
      ctx.beginPath(); ctx.ellipse(180 + offP, 464, 9, 6.5, 0, 0, Math.PI * 2); ctx.fill();
    }

    // eyes: tiny pink rings with white centres, on the black head
    var eyes = [[205, 318], [285, 306]];
    for (var ei = 0; ei < eyes.length; ei++) {
      ctx.strokeStyle = PINK;
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(eyes[ei][0], eyes[ei][1], 11, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = WHITE;
      ctx.beginPath(); ctx.arc(eyes[ei][0], eyes[ei][1], 4, 0, Math.PI * 2); ctx.fill();
    }

    // snort: two expanding pink ring puffs from the nostrils, ~5s cycle
    var cyc = 5.0;
    var p = (((t % cyc) + cyc) % cyc) / cyc;
    ctx.strokeStyle = PINK;
    for (var k = 0; k < 2; k++) {
      var pk = p - k * 0.16;
      if (pk >= 0 && pk <= 0.55) {
        var fr = pk / 0.55;
        var rr = 8 + fr * 44;
        ctx.globalAlpha = (1 - fr) * 0.85;
        ctx.lineWidth = 5 - fr * 2;
        ctx.beginPath();
        ctx.arc(148 + offP - 16 - rr * 0.5, 426 + 6 + rr * 0.12, rr, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    ctx.restore(); // end breathing group

    // riso grain over everything: precomputed specks, drawn directly each frame
    for (var gi = 0; gi < L.grain.length; gi++) {
      var g = L.grain[gi];
      ctx.globalAlpha = g.a;
      ctx.fillStyle = g.ink;
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- run ----------
  var tCur = PHASE0;
  draw(tCur); // synchronous first frame at the constant phase

  function reseed() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    L = buildLayout(seed);
    try { if (typeof history !== 'undefined' && history.replaceState) history.replaceState(null, '', '?seed=' + seed); } catch (e) {}
    draw(tCur);
  }
  var lastTap = 0;
  canvas.addEventListener('dblclick', reseed);
  canvas.addEventListener('pointerdown', function (ev) {
    var now = ev && ev.timeStamp ? ev.timeStamp : 0;
    if (now && lastTap && now - lastTap < 350) { reseed(); lastTap = 0; }
    else lastTap = now;
  });

  function onResize() { draw(tCur); }
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', onResize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  }

  if (typeof requestAnimationFrame === 'function') {
    var startTs = null;
    var loop = function (ts) {
      if (startTs === null) startTs = ts;
      tCur = PHASE0 + (ts - startTs) / 1000;
      draw(tCur);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
