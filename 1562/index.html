<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every Cell Is Watching</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; }
canvas { display: block; }
#cap {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 10px 14px 12px; pointer-events: none;
  font-family: Georgia, 'Times New Roman', serif;
  color: #F5F1E6; text-align: center;
  text-shadow: 0 1px 3px rgba(10,10,10,0.9), 0 0 8px rgba(10,10,10,0.7);
}
#cap .t { font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; }
#cap .d { font-size: 11px; letter-spacing: 0.22em; margin-top: 3px; opacity: 0.85; }
#cap .h { font-size: 12px; font-style: italic; margin-top: 3px; opacity: 0.9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">
  <div class="t">Every Cell Is Watching</div>
  <div class="d">2006 &middot; 04 &middot; 22</div>
  <div class="h">Watch the field blink.</div>
</div>
<script>
var TAU = Math.PI * 2;
var BLACK = '#0A0A0A';
var WHITE = '#F5F1E6';
var GRID = 12;
var BLINK_PERIOD = 9;      // seconds per blink wave sweep
var WANDER_AMP = 0.16;     // pupil wander radius, fraction of cell size
var EYE_DX = 0.22;         // eye offset from cell center, fraction of cell size
var EYE_R = 0.105;         // pupil radius, fraction of cell size
var WOB = 0.03;            // perspective wobble amplitude, fraction of cell size
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function h32(a, b, c) {
  var h = a | 0;
  h = Math.imul(h ^ (b | 0), 2654435761);
  h = Math.imul(h ^ (c | 0), 40503);
  h ^= h >>> 13;
  h = Math.imul(h, 0x5bd1e995);
  h ^= h >>> 15;
  return h >>> 0;
}
// Seeded per-cell phases, pure function of (row, col). No Math.random anywhere.
function cellPhases(r, c) {
  var rng = mulberry32(h32(1562, r * GRID + c, 0xE1E5));
  return { p1: rng() * TAU, p2: rng() * TAU, p3: rng() * TAU, p4: rng() * TAU,
           f1: 0.22 + rng() * 0.18, f2: 0.19 + rng() * 0.16 };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, startT = null;
function isPhone() {
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width; sh = window.screen.height; }
  if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
  return VH > VW * 1.15;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
// Frame geometry: field-like full-bleed rect on phones, square centered on desktop.
function frame() {
  if (isPhone()) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
// Wobbled corner of grid node (i, j), closed-form function of t: the grid breathes.
function node(f, i, j, t) {
  var cw = f.w / GRID, ch = f.h / GRID;
  var x = f.x + i * cw, y = f.y + j * ch;
  var a = WOB * cw;
  x += a * Math.sin(0.32 * t + i * 0.55 + j * 0.31);
  y += a * Math.sin(0.27 * t + j * 0.48 - i * 0.29);
  return [x, y];
}
// Blink amount for cell (r, c) at time t: a wavefront sweeps diagonally
// across the grid once per BLINK_PERIOD seconds; cells near the front blink.
function blinkAt(r, c, t) {
  var d = (r + c) / (2 * (GRID - 1));      // 0 at top-left, 1 at bottom-right
  var ph = (t % BLINK_PERIOD) / BLINK_PERIOD;
  var front = ph * 1.3 - 0.15;             // wavefront position along the diagonal
  var g = (d - front) / 0.07;
  return Math.exp(-g * g);
}
function draw(t) {
  size();
  var f = frame();
  var cw = f.w / GRID, ch = f.h / GRID;
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, VW, VH);
  // Checkerboard cells as wobbled quads.
  for (var r = 0; r < GRID; r++) {
    for (var c = 0; c < GRID; c++) {
      var black = ((r + c) % 2 === 0);
      var p00 = node(f, c, r, t), p10 = node(f, c + 1, r, t);
      var p11 = node(f, c + 1, r + 1, t), p01 = node(f, c, r + 1, t);
      ctx.fillStyle = black ? BLACK : WHITE;
      ctx.beginPath();
      ctx.moveTo(p00[0], p00[1]);
      ctx.lineTo(p10[0], p10[1]);
      ctx.lineTo(p11[0], p11[1]);
      ctx.lineTo(p01[0], p01[1]);
      ctx.closePath();
      ctx.fill();
    }
  }
  // Eyes in the black cells only: two white dots per cell, wandering on
  // slow Lissajous paths, blinking in a wave. Eyes only, no mouths or noses.
  for (var r2 = 0; r2 < GRID; r2++) {
    for (var c2 = 0; c2 < GRID; c2++) {
      if ((r2 + c2) % 2 !== 0) continue;
      var ph = cellPhases(r2, c2);
      var cx = f.x + (c2 + 0.5) * cw;
      var cy = f.y + (r2 + 0.5) * ch;
      // Cell center breathes with the same wobble (average of corner offsets).
      var wob = WOB * cw;
      cx += wob * Math.sin(0.32 * t + (c2 + 0.5) * 0.55 + (r2 + 0.5) * 0.31);
      cy += wob * Math.sin(0.27 * t + (r2 + 0.5) * 0.48 - (c2 + 0.5) * 0.29);
      var blink = blinkAt(r2, c2, t);
      var sy = Math.max(0.06, 1 - 0.94 * blink);   // slit when the wave passes
      var rad = EYE_R * Math.min(cw, ch);
      var ox = EYE_DX * cw, oy = 0;
      // Pupil wander: slow Lissajous, same phase pair for both eyes of a cell.
      var wx = WANDER_AMP * cw * Math.sin(ph.f1 * t + ph.p1);
      var wy = WANDER_AMP * ch * Math.sin(ph.f2 * t + ph.p2);
      var eyes = [[cx - ox + wx, cy + oy + wy], [cx + ox + wx, cy + oy + wy]];
      ctx.fillStyle = WHITE;
      for (var e = 0; e < 2; e++) {
        ctx.beginPath();
        ctx.moveTo(eyes[e][0] + rad, eyes[e][1]);
        ctx.ellipse(eyes[e][0], eyes[e][1], rad, rad * sy, 0, 0, TAU);
        ctx.fill();
      }
    }
  }
  if (typeof window !== 'undefined') {
    window.__p1562 = { t: t, grid: GRID, blinkPeriod: BLINK_PERIOD };
  }
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
