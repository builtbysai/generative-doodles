<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Polygons in Contact</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EFE9DA; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font:12px system-ui, sans-serif; color:#1A1A1A; opacity:0.55;
    pointer-events:none; letter-spacing:0.04em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap to change the tiling family</div>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }
function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// Hankin's polygons in contact, as Bonner reclaimed it: a lightly
// drawn polygonal tiling in pencil, and inside each tile a small
// star motif. The motifs are not contained by their tiles: at
// every shared edge the motif rays meet at a contact point on the
// boundary and a short red link crosses it, so the finished
// pattern is one tapestry woven across the tiling. Tap cycles the
// tiling family: 4.8.8, 3.6.3.6, 3.4.6.4, then a decagon,
// pentagon and hexagon mix. Each family has a fixed seed, and its
// motifs re-bloom with a one second grow when the family changes.
var FAMILY = 0, growStart = -10000;
var tiles = [];   // {x, y, sides, R, rot, seed}
var links = [];   // {x, y, ang} contact points on shared edges

function poly(cx, cy, R, n, rot, out) {
  out = out || [];
  for (var i = 0; i < n; i++) {
    var a = rot + i * Math.PI * 2 / n;
    out.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
  }
  return out;
}
function star(cx, cy, R, n, q, rot) {
  var rIn = R * Math.cos(q * Math.PI / n) / Math.cos((q - 1) * Math.PI / n);
  ctx.beginPath();
  for (var i = 0; i < 2 * n; i++) {
    var a = rot + i * Math.PI / n, r = (i % 2 === 0) ? R : rIn;
    var x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function build() {
  tiles = []; links = [];
  if (!W || !H) return;
  var M = Math.min(W, H);
  var cx0 = W / 2, cy0 = H / 2;
  var i, j, x, y;
  if (FAMILY === 0) {            // 4.8.8: octagons + squares
    var S = M * 0.235, Ro = S * 0.541, Rs = S * 0.207;
    for (i = -3; i <= 3; i++) for (j = -3; j <= 3; j++) {
      tiles.push({ x: cx0 + i * S, y: cy0 + j * S, sides: 8, R: Ro, rot: Math.PI / 8, seed: tiles.length });
      tiles.push({ x: cx0 + (i + 0.5) * S, y: cy0 + (j + 0.5) * S, sides: 4, R: Rs, rot: 0, seed: tiles.length });
    }
  } else if (FAMILY === 1) {     // 3.6.3.6: hexagons + triangles
    var S2 = M * 0.19, Rh = S2 * 0.577, Rt = S2 * 0.30;
    for (i = -4; i <= 4; i++) for (j = -4; j <= 4; j++) {
      x = cx0 + i * S2 + (j % 2 ? S2 / 2 : 0); y = cy0 + j * S2 * 0.866;
      tiles.push({ x: x, y: y, sides: 6, R: Rh, rot: 0, seed: tiles.length });
      tiles.push({ x: x + S2 / 2, y: y + S2 * 0.29, sides: 3, R: Rt, rot: Math.PI / 2, seed: tiles.length });
      tiles.push({ x: x + S2 / 2, y: y - S2 * 0.29, sides: 3, R: Rt, rot: -Math.PI / 2, seed: tiles.length });
    }
  } else if (FAMILY === 2) {     // 3.4.6.4: hexagons + squares + triangles
    var S3 = M * 0.21, Rh3 = S3 * 0.5, Rs3 = S3 * 0.26, Rt3 = S3 * 0.24;
    for (i = -4; i <= 4; i++) for (j = -4; j <= 4; j++) {
      x = cx0 + i * S3 + (j % 2 ? S3 / 2 : 0); y = cy0 + j * S3 * 0.866;
      tiles.push({ x: x, y: y, sides: 6, R: Rh3, rot: Math.PI / 6, seed: tiles.length });
      tiles.push({ x: x + S3 * 0.52, y: y, sides: 4, R: Rs3, rot: Math.PI / 4, seed: tiles.length });
      tiles.push({ x: x, y: y + S3 * 0.47, sides: 3, R: Rt3, rot: -Math.PI / 2, seed: tiles.length });
    }
  } else {                       // decagon / pentagon / hexagon mix
    var S4 = M * 0.27, Rd = S4 * 0.52, Rp = S4 * 0.30, Rh4 = S4 * 0.30;
    for (i = -3; i <= 3; i++) for (j = -3; j <= 3; j++) {
      x = cx0 + i * S4 + (j % 2 ? S4 / 2 : 0); y = cy0 + j * S4 * 0.92;
      tiles.push({ x: x, y: y, sides: 10, R: Rd, rot: Math.PI / 10, seed: tiles.length });
      tiles.push({ x: x + S4 * 0.5, y: y + S4 * 0.46, sides: 5, R: Rp, rot: -Math.PI / 2, seed: tiles.length });
      tiles.push({ x: x + S4 * 0.5, y: y - S4 * 0.46, sides: 6, R: Rh4, rot: 0, seed: tiles.length });
    }
  }
  // contact links: neighbouring tiles whose boundaries nearly
  // touch get a shared contact point at the midpoint between
  // centres, marked across the boundary.
  for (i = 0; i < tiles.length; i++) for (j = i + 1; j < tiles.length; j++) {
    var a = tiles[i], b = tiles[j];
    var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d < (a.R + b.R) * 1.25 && d > 1) {
      links.push({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, ang: Math.atan2(dy, dx) });
    }
  }
}

var downAt = 0, downX = 0, downY = 0;
canvas.addEventListener('pointerdown', function (e) { downAt = performance.now(); downX = e.clientX; downY = e.clientY; });
canvas.addEventListener('pointerup', function (e) {
  var dt = performance.now() - downAt;
  var moved = Math.sqrt((e.clientX - downX) * (e.clientX - downX) + (e.clientY - downY) * (e.clientY - downY));
  if (dt < 500 && moved < 12) { FAMILY = (FAMILY + 1) % 4; growStart = performance.now(); build(); }
});

function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#EFE9DA'; ctx.fillRect(0, 0, W, H);
  var growBase = (now - growStart) / 1000;
  var i, t, p;
  // pencil tiling
  ctx.strokeStyle = '#B9B2A0'; ctx.lineWidth = 1.2;
  for (i = 0; i < tiles.length; i++) {
    t = tiles[i]; p = poly(t.x, t.y, t.R, t.sides, t.rot);
    ctx.beginPath();
    p.forEach(function (v, k) { if (k === 0) ctx.moveTo(v[0], v[1]); else ctx.lineTo(v[0], v[1]); });
    ctx.closePath(); ctx.stroke();
  }
  // cross-boundary links at the contact points
  ctx.strokeStyle = '#B03A2E'; ctx.lineWidth = 1.6;
  for (i = 0; i < links.length; i++) {
    var L = links[i], g = smooth(growBase - hash(i) * 0.25);
    if (g <= 0) continue;
    var r = Math.min(W, H) * 0.012 * g;
    ctx.beginPath();
    ctx.moveTo(L.x - r * Math.cos(L.ang), L.y - r * Math.sin(L.ang));
    ctx.lineTo(L.x + r * Math.cos(L.ang), L.y + r * Math.sin(L.ang));
    ctx.stroke();
    ctx.beginPath(); ctx.arc(L.x, L.y, 1.6 * g, 0, Math.PI * 2);
    ctx.fillStyle = '#B03A2E'; ctx.fill();
  }
  // motifs blooming inside each tile
  ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 1.4;
  for (i = 0; i < tiles.length; i++) {
    t = tiles[i];
    var gt = smooth(growBase - hash(t.seed * 7 + 1) * 0.3);
    if (gt <= 0) continue;
    var n = t.sides, q = n >= 8 ? 3 : (n >= 5 ? 2 : 1);
    star(t.x, t.y, t.R * 0.52 * gt, n, q, t.rot + hash(t.seed) * 0.4);
    ctx.stroke();
  }
}

var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
growStart = start - 5000;   // first family opens fully grown
function frame(now) {
  draw(typeof now === 'number' ? now : start);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
resize();
draw(start);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
