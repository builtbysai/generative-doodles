<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Deconstructive Linguist</title>
<style>
  html, body { margin:0; padding:0; background:#0A0C10; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
"use strict";
var SEED = 30;
var LOOP = 100;          // seconds per loop
var T0 = 14;             // fixed first-frame phase (loop 0, t = 14s)
var ROWS_VIS = 28;       // hex rows on screen
var FILE_ROWS = 96;      // virtual file rows
var COLS = 16;           // bytes per row
var BANDS = 28;          // image slice bands; band = fileRow % BANDS

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = 0, H = 0, portrait = false;
var hexPane = {x:0,y:0,w:0,h:0}, imgPane = {x:0,y:0,w:0,h:0};

// ---------- seeded hash (integer mix -> [0,1)) ----------
function hash01(a,b,c){
  var n = (SEED>>>0) ^ 0x9e3779b9;
  n = Math.imul(n ^ (a+0x101), 0x85ebca6b); n ^= n>>>13;
  n = Math.imul(n ^ (b+0x201), 0xc2b2ae35); n ^= n>>>16;
  n = Math.imul(n ^ (c+0x301), 0x27d4eb2d); n ^= n>>>15;
  return (n>>>0)/4294967296;
}

// ---------- edit-event schedule for one loop ----------
// Event k: starts s_k (gaps 6-12s, first gap 4-9s), edits a run of 3-8 bytes
// on file row r_k (always a row visible at fire time). band = r_k % BANDS.
var overrides = {};      // "loop:k" -> visitor-chosen file row (hex-side drag)
function schedule(loop){
  var evs = [], s = 0;
  for (var k = 0; k < 40; k++){
    var gap = (k === 0) ? 4 + 5*hash01(loop,k,101) : 6 + 6*hash01(loop,k,101);
    s += gap; if (s > 94) break;
    var scrollOff = Math.floor(s/6) % FILE_ROWS;
    var visRow = Math.floor(hash01(loop,k,102)*ROWS_VIS);
    var row = (scrollOff + visRow) % FILE_ROWS;
    var key = loop + ':' + k;
    if (overrides[key] !== undefined) row = overrides[key];
    var col = Math.floor(hash01(loop,k,103)*11);
    var len = 3 + Math.floor(hash01(loop,k,104)*6); if (col + len > COLS) len = COLS - col;
    var red = col + Math.floor(hash01(loop,k,105)*len);
    var peak = (hash01(loop,k,106) < 0.5 ? -1 : 1) * (12 + 24*hash01(loop,k,107));
    evs.push({k:k, s:s, row:row, col:col, len:len, red:red, peak:peak, band: row % BANDS});
  }
  return evs;
}

// Byte value as a pure function of (loop, fileRow, col, loopTime):
// base value, cycling intermediates during an edit, settled value after.
function byteState(loop, fileRow, col, lt, evs){
  var idx = fileRow * COLS + col;
  var val = Math.floor(hash01(loop*7+1, idx, 401) * 256);
  var state = 0, ev = null; // 0 normal, 1 flashing(amber), 2 settled, 3 red
  for (var i = 0; i < evs.length; i++){
    var e = evs[i];
    if (e.row !== fileRow || col < e.col || col >= e.col + e.len) continue;
    if (lt < e.s) continue;
    if (lt < e.s + 1.2){
      val = Math.floor(hash01(e.k, idx, 500 + Math.floor((lt - e.s)/0.12)) * 256);
      state = 1; ev = e;
    } else {
      val = Math.floor(hash01(e.k, idx, 601) * 256);
      state = (col === e.red && lt < e.s + 4.2) ? 3 : 2; ev = e;
    }
  }
  return {v: val, state: state, ev: ev};
}

// Shear offset of one image band at loop time lt: sum of event contributions.
// Effect starts 0.6s after the hex edit, ramps in 0.25s, holds 2.5s, then a
// 15% residual that decays to exactly 0 at lt = LOOP (loop closure).
function bandOffset(band, lt, evs){
  var off = 0;
  for (var i = 0; i < evs.length; i++){
    var e = evs[i];
    if (e.band !== band) continue;
    var es = e.s + 0.6;
    if (lt < es) continue;
    var age = lt - es;
    if (age < 2.5){
      off += e.peak * Math.min(1, age / 0.25);
    } else {
      var span = LOOP - (es + 2.5);
      var f = span > 0 ? Math.pow(Math.max(0, (LOOP - lt) / span), 1.5) : 0;
      off += e.peak * 0.15 * f;
    }
  }
  return off;
}

// ---------- layout ----------
function isPhone(){
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  return Math.min(sw, sh) < 700;
}
function fit(){
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  cv.width = W; cv.height = H;
  portrait = H > W || (isPhone() && H > W * 1.15);
  if (portrait){
    var hh = Math.floor(H/2);
    hexPane = {x:0, y:0, w:W, h:hh};
    imgPane = {x:0, y:hh, w:W, h:H - hh};
  } else {
    var hw = Math.floor(W/2);
    hexPane = {x:0, y:0, w:hw, h:H};
    imgPane = {x:hw, y:0, w:W - hw, h:H};
  }
}

// ---------- the image the bytes become (drawn per band, offset) ----------
function drawScene(p){
  var x = p.x, y = p.y, w = p.w, h = p.h;
  ctx.fillStyle = '#1B4FD8';
  ctx.fillRect(x - 80, y, w + 160, h);
  // moon
  ctx.fillStyle = '#DCE9FF';
  ctx.beginPath(); ctx.arc(x + w*0.74, y + h*0.20, h*0.065, 0, Math.PI*2); ctx.fill();
  // clouds (flat pale blobs)
  ctx.fillStyle = 'rgba(191,212,255,0.55)';
  ctx.beginPath(); ctx.arc(x + w*0.24, y + h*0.26, h*0.035, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w*0.30, y + h*0.28, h*0.045, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w*0.55, y + h*0.14, h*0.03, 0, Math.PI*2); ctx.fill();
  // distant hills
  ctx.fillStyle = '#14379E';
  ctx.beginPath();
  ctx.moveTo(x - 80, y + h*0.70);
  ctx.lineTo(x + w*0.25, y + h*0.60);
  ctx.lineTo(x + w*0.55, y + h*0.68);
  ctx.lineTo(x + w*0.85, y + h*0.61);
  ctx.lineTo(x + w + 80, y + h*0.70);
  ctx.lineTo(x + w + 80, y + h*0.72);
  ctx.lineTo(x - 80, y + h*0.72);
  ctx.closePath(); ctx.fill();
  // ground
  ctx.fillStyle = '#0A1E5E';
  ctx.fillRect(x - 80, y + h*0.70, w + 160, h*0.30);
  // house, left
  ctx.fillStyle = '#0B1030';
  ctx.fillRect(x + w*0.10, y + h*0.55, w*0.16, h*0.15);
  ctx.beginPath();
  ctx.moveTo(x + w*0.08, y + h*0.55);
  ctx.lineTo(x + w*0.18, y + h*0.47);
  ctx.lineTo(x + w*0.28, y + h*0.55);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,176,0,0.85)';
  ctx.fillRect(x + w*0.155, y + h*0.60, w*0.03, h*0.04);
  // standing figure, centre
  var fx = x + w*0.54, gy = y + h*0.88, fh = h*0.36;
  ctx.fillStyle = '#0D0D12';
  // legs
  ctx.fillRect(fx - fh*0.10, gy - fh*0.34, fh*0.075, fh*0.34);
  ctx.fillRect(fx + fh*0.03, gy - fh*0.34, fh*0.075, fh*0.34);
  // body (coat trapezoid)
  ctx.beginPath();
  ctx.moveTo(fx - fh*0.13, gy - fh*0.34);
  ctx.lineTo(fx - fh*0.10, gy - fh*0.78);
  ctx.lineTo(fx + fh*0.10, gy - fh*0.78);
  ctx.lineTo(fx + fh*0.13, gy - fh*0.34);
  ctx.closePath(); ctx.fill();
  // arm
  ctx.fillRect(fx + fh*0.10, gy - fh*0.76, fh*0.055, fh*0.30);
  // head (skin tone)
  ctx.fillStyle = '#C8A080';
  ctx.beginPath(); ctx.arc(fx, gy - fh*0.88, fh*0.105, 0, Math.PI*2); ctx.fill();
}

// ---------- pointer state ----------
var dragging = false, lastPX = 0, lastPY = 0;
var smears = [];        // {t, y, dx} image-side drag samples (piece-time)
var selRow = -1;        // file row chosen on hex side (highlight)
var selKey = null;      // "loop:k" the selection feeds
function pieceNow(){ return T0 + (performance.now() - startStamp)/1000; }
function inHex(px, py){ return portrait ? (py < hexPane.h) : (px < imgPane.x); }
function hexRowAt(py, lt){
  var top = hexPane.y + 30, rh = (hexPane.h - 38) / ROWS_VIS;
  var i = Math.floor((py - top) / rh);
  if (i < 0 || i >= ROWS_VIS) return -1;
  return (Math.floor(lt/6) % FILE_ROWS + i) % FILE_ROWS;
}
function onDown(px, py){
  dragging = true; lastPX = px; lastPY = py;
  var t = pieceNow(), loop = Math.floor(t / LOOP), lt = t % LOOP;
  if (inHex(px, py)){
    var r = hexRowAt(py, lt);
    if (r >= 0){
      var evs = schedule(loop), key = null;
      for (var i = 0; i < evs.length; i++){ if (evs[i].s > lt){ key = loop + ':' + evs[i].k; break; } }
      if (!key) key = (loop + 1) + ':0';
      overrides[key] = r; selRow = r; selKey = key;
    }
  }
}
function onMove(px, py){
  if (!dragging) return;
  var t = pieceNow();
  if (inHex(px, py)){
    var loop = Math.floor(t / LOOP), lt = t % LOOP;
    var r = hexRowAt(py, lt);
    if (r >= 0 && selKey){ overrides[selKey] = r; selRow = r; }
  } else {
    var dx = px - lastPX;
    if (dx !== 0) smears.push({t: t, y: py, dx: dx});
    if (smears.length > 240) smears.splice(0, smears.length - 240);
  }
  lastPX = px; lastPY = py;
}
function onUp(){ dragging = false; }
cv.addEventListener('pointerdown', function(e){ onDown(e.clientX, e.clientY); });
cv.addEventListener('pointermove', function(e){ onMove(e.clientX, e.clientY); });
window.addEventListener('pointerup', onUp);
cv.addEventListener('touchstart', function(e){ var t = e.touches[0]; onDown(t.clientX, t.clientY); }, {passive:true});
cv.addEventListener('touchmove', function(e){ var t = e.touches[0]; onMove(t.clientX, t.clientY); }, {passive:true});
window.addEventListener('touchend', onUp);

function smearOffset(band, bandCY, bh, t){
  var off = 0;
  for (var i = 0; i < smears.length; i++){
    var s = smears[i], age = t - s.t;
    if (age < 0 || age > 2) continue;
    off += s.dx * 0.5 * Math.exp(-age/0.9) * Math.exp(-Math.abs(bandCY - s.y) / (2.2 * bh));
  }
  return Math.max(-42, Math.min(42, off));
}

// ---------- main draw ----------
function draw(t){
  var loop = Math.floor(t / LOOP), lt = t % LOOP;
  var evs = schedule(loop);
  ctx.fillStyle = '#0A0C10';
  ctx.fillRect(0, 0, W, H);

  // ----- hex side -----
  var p = hexPane;
  ctx.fillStyle = '#6A7078';
  ctx.font = '11px "Courier New", monospace';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText('BYTES', p.x + 12, p.y + 14);
  var top = p.y + 30, areaH = p.h - 38, rh = areaH / ROWS_VIS;
  var fs = Math.min(rh * 0.62, (p.w - 20) / 31.8);
  if (fs < 7) fs = 7;
  var charW = fs * 0.6;
  ctx.font = fs.toFixed(1) + 'px "Courier New", monospace';
  var blockW = 53 * charW;
  var bx = p.x + Math.max(10, (p.w - blockW) / 2);
  var scrollOff = Math.floor(lt / 6) % FILE_ROWS;
  // amber wash behind active edit runs
  for (var i = 0; i < ROWS_VIS; i++){
    var fileRow = (scrollOff + i) % FILE_ROWS;
    var ry = top + i * rh;
    if (fileRow === selRow){
      ctx.strokeStyle = 'rgba(255,176,0,0.65)';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx - 4, ry + 1, blockW + 8, rh - 2);
    }
    for (var j = 0; j < evs.length; j++){
      var e = evs[j];
      if (e.row === fileRow && lt >= e.s && lt < e.s + 1.2){
        ctx.fillStyle = 'rgba(255,176,0,0.13)';
        ctx.fillRect(bx + (5 + e.col * 3) * charW - 2, ry + 1, e.len * 3 * charW + 2, rh - 2);
      }
    }
    // address
    ctx.fillStyle = '#565D66';
    var addr = (fileRow * COLS).toString(16).toUpperCase();
    while (addr.length < 4) addr = '0' + addr;
    ctx.fillText(addr, bx, ry + rh/2);
    // bytes
    for (var c = 0; c < COLS; c++){
      var st = byteState(loop, fileRow, c, lt, evs);
      ctx.fillStyle = st.state === 1 ? '#FFB000' : (st.state === 3 ? '#FF2B2B' : '#9AA0A6');
      var hex = st.v.toString(16).toUpperCase();
      if (hex.length < 2) hex = '0' + hex;
      ctx.fillText(hex, bx + (5 + c * 3) * charW, ry + rh/2);
    }
  }

  // ----- image side -----
  var q = imgPane, bh = q.h / BANDS;
  for (var b = 0; b < BANDS; b++){
    var off = bandOffset(b, lt, evs) + smearOffset(b, q.y + (b + 0.5) * bh, bh, t);
    ctx.save();
    ctx.beginPath();
    ctx.rect(q.x, q.y + b * bh, q.w, bh + 1);
    ctx.clip();
    ctx.translate(off, 0);
    drawScene(q);
    ctx.restore();
    if (Math.abs(off) > 1.5){
      ctx.fillStyle = 'rgba(0,229,255,0.5)';
      ctx.fillRect(q.x, q.y + b * bh, q.w, 2);
      ctx.fillStyle = 'rgba(255,43,141,0.4)';
      ctx.fillRect(q.x, q.y + (b + 1) * bh - 2, q.w, 2);
    }
    // magenta bloom for long rewrites
    for (var m = 0; m < evs.length; m++){
      var ev = evs[m];
      if (ev.band === b && ev.len >= 6 && lt >= ev.s + 0.6 && lt < ev.s + 2.6){
        ctx.fillStyle = 'rgba(255,43,141,0.16)';
        ctx.fillRect(q.x, q.y + b * bh, q.w, bh);
        ctx.fillStyle = 'rgba(255,43,141,0.22)';
        ctx.beginPath();
        ctx.ellipse(q.x + q.w * 0.5 + off, q.y + (b + 0.5) * bh, q.w * 0.22, bh * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  // label over sky
  ctx.fillStyle = 'rgba(4,6,12,0.45)';
  ctx.fillRect(q.x + 6, q.y + 6, 52, 16);
  ctx.fillStyle = '#8A93A8';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText('IMAGE', q.x + 12, q.y + 14);

  // ----- divider -----
  ctx.fillStyle = '#2A2A2E';
  if (portrait) ctx.fillRect(0, hexPane.h, W, 2);
  else ctx.fillRect(imgPane.x, 0, 2, H);

  // canvas CSS size pinned every draw (house rule)
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
}

// ---------- run ----------
fit();
draw(T0);
var startStamp = performance.now();
function frame(){
  draw(pieceNow());
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
function refit(){ fit(); draw(pieceNow()); }
if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);
window.addEventListener('resize', refit);
})();
</script>
</body>
</html>
