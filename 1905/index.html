<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1905 Costumes</title>
<style>
  html, body { margin: 0; padding: 0; background: #c9c2b4; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette from the prompt: studio warm grey, costume tags in saturated
  // signal colors: carrier amber, accompanist teal, noise-floor violet.
  var GROUND = '#c9c2b4';     // studio warm grey
  var GROUND_DEEP = '#b7aea0'; // floor band
  var FLOOR_LINE = '#a89e8d';
  var INK = '#3a352e';         // plate and captions
  var INK_DIM = '#6b6357';
  var FIGURE = '#4a443c';      // players
  var FIGURE_SOFT = '#6e675c';
  var AMBER = '#e8a317';       // theme-carrier
  var AMBER_DEEP = '#b97f0b';
  var TEAL = '#1f8a8c';        // accompanist
  var TEAL_DEEP = '#146668';
  var VIOLET = '#7b5fc7';      // noise-floor
  var VIOLET_DEEP = '#5b439e';

  // Roles. Four players, three named roles, so the accompanist tag is
  // worn by two players at once. The assignment rotates one seat every
  // ROT seconds; the first 8 seconds of each rotation crossfade.
  var ROT = 150;               // one rotation every two and a half minutes
  var XFADE = 8;               // crossfade length, seconds
  var ROLES = ['carrier', 'accompanist', 'noise', 'accompanist'];
  var ROLE_LABEL = { carrier: 'THEME-CARRIER', accompanist: 'ACCOMPANIST', noise: 'NOISE-FLOOR' };
  var ROLE_COLOR = { carrier: AMBER, accompanist: TEAL, noise: VIOLET };
  var ROLE_DEEP = { carrier: AMBER_DEEP, accompanist: TEAL_DEEP, noise: VIOLET_DEEP };
  var ROLE_TEXT = { carrier: INK, accompanist: '#f4f1ea', noise: '#f4f1ea' };

  // Fixed-phase first frame: t = 20 s, twelve seconds after the first
  // rotation's 8-second crossfade has finished, so the roles are settled
  // and each player wears exactly one tag. At frame one: drums wears
  // THEME-CARRIER, guitar ACCOMPANIST, sax NOISE-FLOOR, trombone
  // ACCOMPANIST. The whole state is a pure function of t, so frame one
  // is byte-reproducible.
  var FIRST_T = 20;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(u) { return u * u * (3 - 2 * u); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha

  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      // Field-like composition: square stage on desktop, page ground is
      // the piece's own warm grey.
      stageH = Math.min(vh * 0.92, vw * 0.94);
      stageW = stageH;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  // Role assignment for rotation r: the role array shifts one seat.
  function assignment(r) {
    var out = [];
    var i;
    for (i = 0; i < 4; i++) {
      out.push(ROLES[((i - r) % 4 + 4) % 4]);
    }
    return out;
  }

  // Rotation state at time t: from/to assignments and crossfade u (0 to 1).
  function rotationAt(t) {
    var r = Math.floor(t / ROT);
    var phase = t - r * ROT;
    if (phase < XFADE) {
      return { from: assignment(r - 1), to: assignment(r), u: smooth(phase / XFADE), swapping: true };
    }
    return { from: assignment(r), to: assignment(r), u: 1, swapping: false };
  }

  // Posture per role: carrier leans in, accompanist stands upright with a
  // slow sway, noise-floor leans back and thins out.
  function posture(role, t, i) {
    if (role === 'carrier') { return { lean: 0.11, alpha: 1, sway: 0.02 * Math.sin(t * 0.5 + i) }; }
    if (role === 'accompanist') { return { lean: 0.01, alpha: 1, sway: 0.05 * Math.sin(t * 0.35 + i * 2.1) }; }
    return { lean: -0.09, alpha: 0.72, sway: 0.015 * Math.sin(t * 0.22 + i * 1.3) };
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawTag(cx, cy, role, alpha, s) {
    var label = ROLE_LABEL[role];
    var fs = Math.round(12 * s);
    ctx.font = '600 ' + fs + 'px "Helvetica Neue", Arial, sans-serif';
    var tw = ctx.measureText(label).width;
    var padX = 9 * s, padY = 5 * s;
    var w = tw + padX * 2, h = fs + padY * 2;
    var x = cx - w / 2, y = cy - h / 2;
    ctx.fillStyle = hexA(ROLE_COLOR[role], a4(0.92 * alpha));
    roundRect(x, y, w, h, 4 * s);
    ctx.fill();
    ctx.strokeStyle = hexA(ROLE_DEEP[role], a4(0.8 * alpha));
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = hexA(ROLE_TEXT[role], a4(alpha));
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy + 0.5);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // Role behaviours, drawn behind and around each player.
  function drawRoleField(x, baseY, s, role, a, t, i) {
    var j, px, py, rr;
    if (role === 'carrier') {
      // Lead line: an amber ribbon arcing up from the player's raised hand,
      // always bending toward the middle of the room.
      var dir = x < W / 2 ? 1 : -1;
      ctx.strokeStyle = hexA(AMBER, a4(0.85 * a));
      ctx.lineWidth = 3 * s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      var hx = x + 30 * s * dir, hy = baseY - 118 * s;
      ctx.moveTo(hx, hy);
      for (j = 1; j <= 24; j++) {
        var u = j / 24;
        px = hx + dir * u * 110 * s;
        py = hy - Math.sin(u * Math.PI * 1.4) * 46 * s - Math.sin(u * 9 + t * 0.9 + i) * 6 * s;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
      // A small glowing head note at the line's end.
      var ex = hx + dir * 110 * s, ey = hy - Math.sin(Math.PI * 1.4) * 46 * s - Math.sin(9 + t * 0.9 + i) * 6 * s;
      var halo = ctx.createRadialGradient(ex, ey, 1, ex, ey, 22 * s);
      halo.addColorStop(0, hexA(AMBER, a4(0.5 * a)));
      halo.addColorStop(1, hexA(AMBER, 0));
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.moveTo(ex + 22 * s, ey);
      ctx.arc(ex, ey, 22 * s, 0, Math.PI * 2);
      ctx.fill();
    } else if (role === 'accompanist') {
      // Harmonic pad: three soft teal bars stacked behind the player.
      for (j = 0; j < 3; j++) {
        var bw = (100 - j * 18) * s * (1 + 0.05 * Math.sin(t * 0.4 + i + j * 1.7));
        var by = baseY - (96 + j * 22) * s;
        ctx.fillStyle = hexA(TEAL, a4((0.28 - j * 0.06) * a));
        roundRect(x - bw / 2, by - 5 * s, bw, 10 * s, 5 * s);
        ctx.fill();
      }
    } else {
      // Granular noise bed: a drifting cloud of violet specks.
      for (j = 0; j < 46; j++) {
        var ang = hash(i * 100 + j * 3 + 1) * Math.PI * 2;
        var rad = (26 + hash(i * 100 + j * 7 + 2) * 74) * s;
        var drift = Math.sin(t * 0.25 + j * 1.9) * 5 * s;
        px = x + Math.cos(ang) * rad + drift;
        py = baseY - 70 * s + Math.sin(ang) * rad * 0.62 + Math.cos(t * 0.2 + j) * 4 * s;
        rr = (1.2 + hash(i * 100 + j * 11 + 3) * 2.2) * s;
        ctx.fillStyle = hexA(VIOLET, a4((0.25 + 0.5 * hash(i * 100 + j * 5 + 4)) * a));
        ctx.beginPath();
        ctx.moveTo(px + rr, py);
        ctx.arc(px, py, rr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawPlayer(x, baseY, s, kind, lean, alpha, t, i, facing) {
    var breathe = 1 + 0.012 * Math.sin(t * 0.3 + i * 2.4);
    var topShift = lean * 120 * s;
    var headR = 13 * s * breathe;
    var headX = x + topShift;
    var headY = baseY - 122 * s;
    var shoulderY = baseY - 100 * s;
    var hipY = baseY - 16 * s;

    ctx.save();
    ctx.globalAlpha = a4(alpha);

    // Torso: a tapered column leaning with the role.
    ctx.fillStyle = FIGURE;
    ctx.beginPath();
    ctx.moveTo(x - 20 * s + topShift * 0.4, shoulderY);
    ctx.quadraticCurveTo(x - 26 * s, (shoulderY + hipY) / 2, x - 22 * s, hipY);
    ctx.lineTo(x + 22 * s, hipY);
    ctx.quadraticCurveTo(x + 26 * s, (shoulderY + hipY) / 2, x + 20 * s + topShift * 0.4, shoulderY);
    ctx.quadraticCurveTo(x + topShift * 0.5, shoulderY - 12 * s, x - 20 * s + topShift * 0.4, shoulderY);
    ctx.closePath();
    ctx.fill();

    // Head.
    ctx.fillStyle = FIGURE_SOFT;
    ctx.beginPath();
    ctx.moveTo(headX + headR, headY);
    ctx.arc(headX, headY, headR, 0, Math.PI * 2);
    ctx.fill();

    // Instrument.
    ctx.strokeStyle = FIGURE;
    ctx.fillStyle = FIGURE;
    ctx.lineCap = 'round';
    if (kind === 'drums') {
      // Two drums in front, sticks raised.
      ctx.lineWidth = 3 * s;
      ctx.beginPath();
      ctx.moveTo(headX - 6 * s, shoulderY + 26 * s);
      ctx.lineTo(headX - 34 * s, shoulderY + 8 * s);
      ctx.moveTo(headX + 6 * s, shoulderY + 26 * s);
      ctx.lineTo(headX + 38 * s, shoulderY + 4 * s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 34 * s + 15 * s, baseY - 26 * s);
      ctx.arc(x - 34 * s, baseY - 26 * s, 15 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + 34 * s + 13 * s, baseY - 24 * s);
      ctx.arc(x + 34 * s, baseY - 24 * s, 13 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = hexA(GROUND, 0.85);
      ctx.lineWidth = 1.5 * s;
      ctx.beginPath();
      ctx.moveTo(x - 34 * s + 15 * s, baseY - 26 * s);
      ctx.arc(x - 34 * s, baseY - 26 * s, 15 * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 34 * s + 13 * s, baseY - 24 * s);
      ctx.arc(x + 34 * s, baseY - 24 * s, 13 * s, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 'guitar') {
      // Guitar body and neck, held across the torso.
      ctx.save();
      ctx.translate(x + topShift * 0.5, shoulderY + 46 * s);
      ctx.rotate(-0.5 * facing);
      ctx.beginPath();
      ctx.moveTo(16 * s, 0);
      ctx.arc(0, 0, 16 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(10 * s, -3 * s, 52 * s, 6 * s);
      ctx.restore();
    } else if (kind === 'sax') {
      // Saxophone: curved body held diagonally, bell flaring low.
      ctx.save();
      ctx.translate(x + topShift * 0.5, shoulderY + 34 * s);
      ctx.rotate(0.35 * facing);
      // Body: thick curved stroke from mouthpiece down to the bell.
      ctx.lineWidth = 7 * s;
      ctx.beginPath();
      ctx.moveTo(4 * s, -52 * s);
      ctx.quadraticCurveTo(10 * s, -10 * s, -2 * s, 22 * s);
      ctx.quadraticCurveTo(-8 * s, 36 * s, 6 * s, 42 * s);
      ctx.stroke();
      // Bell flare at the bottom of the curve.
      ctx.beginPath();
      ctx.moveTo(-4 * s, 30 * s);
      ctx.lineTo(16 * s, 34 * s);
      ctx.lineTo(22 * s, 50 * s);
      ctx.lineTo(2 * s, 52 * s);
      ctx.closePath();
      ctx.fill();
      // Neck and mouthpiece reaching up toward the player's mouth.
      ctx.lineWidth = 4 * s;
      ctx.beginPath();
      ctx.moveTo(4 * s, -52 * s);
      ctx.quadraticCurveTo(2 * s, -64 * s, -10 * s, -66 * s);
      ctx.stroke();
      // Keys: small pale dots down the body.
      ctx.fillStyle = hexA(GROUND, 0.9);
      var kd;
      for (kd = 0; kd < 4; kd++) {
        ctx.beginPath();
        ctx.arc(2 * s, -34 * s + kd * 14 * s, 2.2 * s, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    } else {
      // Trombone: long slide extending forward, bell flaring at the end.
      var dir = facing;
      var mouthX = headX + 10 * s * dir;
      var mouthY = headY + 6 * s;
      // Upper slide tube.
      ctx.lineWidth = 4 * s;
      ctx.beginPath();
      ctx.moveTo(mouthX, mouthY);
      ctx.lineTo(mouthX + 62 * s * dir, mouthY + 10 * s);
      ctx.stroke();
      // Lower slide tube.
      ctx.lineWidth = 3 * s;
      ctx.beginPath();
      ctx.moveTo(mouthX, mouthY + 7 * s);
      ctx.lineTo(mouthX + 58 * s * dir, mouthY + 16 * s);
      ctx.stroke();
      // Bell flare at the far end of the slide.
      var bellX = mouthX + 62 * s * dir;
      var bellY = mouthY + 10 * s;
      ctx.beginPath();
      ctx.moveTo(bellX - 4 * s * dir, bellY - 12 * s);
      ctx.lineTo(bellX + 16 * s * dir, bellY - 20 * s);
      ctx.lineTo(bellX + 16 * s * dir, bellY + 22 * s);
      ctx.lineTo(bellX - 4 * s * dir, bellY + 12 * s);
      ctx.closePath();
      ctx.fill();
      // Slide brace.
      ctx.lineWidth = 2 * s;
      ctx.beginPath();
      ctx.moveTo(mouthX + 40 * s * dir, mouthY + 2 * s);
      ctx.lineTo(mouthX + 40 * s * dir, mouthY + 15 * s);
      ctx.stroke();
    }
    ctx.restore();
  }

  var KINDS = ['drums', 'guitar', 'sax', 'trombone'];
  var LABELS = ['drums', 'guitar', 'sax', 'trombone'];
  var FACING = [1, 1, -1, -1];

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Studio warm grey.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var s = clamp(Math.min(W, H) / 560, 0.6, 1.45);
    var baseY = H * 0.76;
    var arcY = H * 0.82;

    // Floor band and the loose arc the quartet stands on.
    ctx.fillStyle = GROUND_DEEP;
    ctx.fillRect(0, H * 0.78, W, H * 0.22);
    ctx.strokeStyle = hexA(FLOOR_LINE, 0.8);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(W * 0.06, arcY);
    ctx.quadraticCurveTo(W * 0.5, arcY - H * 0.10, W * 0.94, arcY);
    ctx.stroke();

    var rot = rotationAt(t);
    var xs = [0.16, 0.385, 0.615, 0.84];
    var i, x, roleFrom, roleTo, pFrom, pTo, lean, alpha;

    // Role fields first, so players stand in front of their own sound.
    for (i = 0; i < 4; i++) {
      x = W * xs[i];
      roleFrom = rot.from[i]; roleTo = rot.to[i];
      if (rot.swapping && roleFrom !== roleTo) {
        drawRoleField(x, baseY, s, roleFrom, 1 - rot.u, t, i);
        drawRoleField(x, baseY, s, roleTo, rot.u, t, i);
      } else {
        drawRoleField(x, baseY, s, roleTo, 1, t, i);
      }
    }

    // Players with crossfaded posture.
    for (i = 0; i < 4; i++) {
      x = W * xs[i];
      roleFrom = rot.from[i]; roleTo = rot.to[i];
      pFrom = posture(roleFrom, t, i);
      pTo = posture(roleTo, t, i);
      if (rot.swapping && roleFrom !== roleTo) {
        lean = lerp(pFrom.lean, pTo.lean, rot.u) + lerp(pFrom.sway, pTo.sway, rot.u);
        alpha = lerp(pFrom.alpha, pTo.alpha, rot.u);
      } else {
        lean = pTo.lean + pTo.sway;
        alpha = pTo.alpha;
      }
      drawPlayer(x, baseY, s, KINDS[i], lean, alpha, t, i, FACING[i]);
    }

    // Costume tags hovering above each player like name cards.
    for (i = 0; i < 4; i++) {
      x = W * xs[i];
      roleFrom = rot.from[i]; roleTo = rot.to[i];
      var tagY = baseY - 158 * s;
      if (rot.swapping && roleFrom !== roleTo) {
        // Outgoing tag rises and fades; incoming tag rises into place and
        // stays legible throughout the swap.
        drawTag(x, tagY - 26 * s * rot.u, roleFrom, a4(0.85 * (1 - rot.u)), s);
        drawTag(x, tagY + 26 * s * (1 - rot.u), roleTo, a4(0.55 + 0.45 * rot.u), s);
      } else {
        drawTag(x, tagY, roleTo, 1, s);
      }
    }

    // The chime: a soft ring above the tags while they swap.
    if (rot.swapping) {
      var chimeY = baseY - 248 * s;
      var chimeR = (10 + rot.u * 46) * s;
      ctx.strokeStyle = hexA(INK_DIM, a4(0.5 * (1 - rot.u)));
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(W / 2 + chimeR, chimeY);
      ctx.arc(W / 2, chimeY, chimeR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = hexA(INK_DIM, a4(0.6 * (1 - rot.u)));
      ctx.beginPath();
      ctx.moveTo(W / 2 + 3, chimeY);
      ctx.arc(W / 2, chimeY, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Instrument captions under each player.
    ctx.fillStyle = hexA(INK_DIM, 0.95);
    ctx.font = Math.round(12 * s) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    for (i = 0; i < 4; i++) {
      ctx.fillText(LABELS[i], W * xs[i], baseY + 26 * s);
    }
    ctx.textAlign = 'left';

    // Title plate, drawn on the canvas, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 640, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Costumes', 18, 34);
    ctx.fillStyle = INK_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1905 · 2007 · 03 · 31', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(INK_DIM, 0.9);
    ctx.fillText('Watch the roles rotate.', 18, H - 20);
  }

  // Watch only: no pointer, touch, or key handlers. Nobody assigns roles;
  // the rotation does it on its own timer.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
