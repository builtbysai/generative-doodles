<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.195 FRESH FISH CRATE</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0E11; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.195 FRESH FISH CRATE (Amanda Willshire). A fish built the way
// she builds them: fourteen flat steel layers, each a slightly
// different silhouette, stacked front to back like a topographic
// contour map, gold where the heat took the front layers, rust red
// in the fins. It arrives in a wooden crate stenciled FRESH FISH
// CRATE whose lid swings away in the first seconds; after that the
// fish owns the frame. Drag and the stack explodes apart along its
// depth axis into the separated contour set; let go and it settles
// back with weight. Double-tap and a different fish takes its place.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0B0E11', GOLD = '#C9A227', STEEL = '#6B7280';
var RUST = '#8B2500', DEEP = '#3B1F0E', WOOD = '#7A5C3E', PAINT = '#E8E4DA';
var W = 0, H = 0, phone = false;
var seed = 195195;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(a, b, x) { var k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); }

// ---- parametric silhouettes: [u along length 0 nose..1 tail, v half-depth] ----
var FISH = [
  { name: 'trout', depth: 0.155, pts: [
    [0, 0], [0.05, -0.36], [0.16, -0.64], [0.32, -0.82], [0.5, -0.88], [0.66, -0.8],
    [0.78, -0.62], [0.85, -0.5], [1, -0.98], [0.935, 0], [1, 0.98], [0.85, 0.5],
    [0.78, 0.62], [0.66, 0.8], [0.5, 0.88], [0.32, 0.82], [0.16, 0.64], [0.05, 0.36]] },
  { name: 'bass', depth: 0.235, pts: [
    [0, 0], [0.05, -0.42], [0.16, -0.74], [0.32, -0.94], [0.5, -1], [0.66, -0.9],
    [0.78, -0.7], [0.86, -0.52], [1, -0.6], [1, 0.6], [0.86, 0.52],
    [0.78, 0.7], [0.66, 0.9], [0.5, 1], [0.32, 0.94], [0.16, 0.74], [0.05, 0.42]] },
  { name: 'tarpon', depth: 0.125, pts: [
    [0, 0.06], [0.05, -0.3], [0.16, -0.56], [0.32, -0.74], [0.5, -0.8], [0.66, -0.74],
    [0.78, -0.6], [0.85, -0.5], [1, -1.12], [0.93, 0], [1, 1.12], [0.85, 0.5],
    [0.78, 0.6], [0.66, 0.74], [0.5, 0.8], [0.32, 0.74], [0.16, 0.56], [0.05, 0.34], [0, 0.14]] }
];
var LAYERS = 14;
var kindIdx = 0;
var T = 3.2, lastNow = -1;   // the crate moment starts nearly past
var swimPh = 0;
var explodeK = 0, explodeV = 0, explodeTarget = 0;
var flipT = 9;

function fishGeom() {
  var L = phone ? W * 0.86 : W * 0.70;
  var f = FISH[kindIdx];
  return {
    L: L, hd: L * f.depth,
    cx: W / 2, cy: H * (phone ? 0.48 : 0.55)
  };
}
function layerColor(i) {
  if (i >= 11) return GOLD;
  if (i >= 5) return STEEL;
  return DEEP;
}
function layerPath(i, g) {
  var f = FISH[kindIdx];
  var scale = 1 - (LAYERS - 1 - i) * 0.014;
  var ex = (i - 6.5) * (2.6 + explodeK * g.L * 0.045);
  var ey = (i - 6.5) * (-1.5 - explodeK * g.L * 0.020);
  var flip = flipT < 0.45 ? 1 - 0.3 * Math.sin(3.1416 * (flipT / 0.45)) : 1;
  ctx.beginPath();
  for (var j = 0; j < f.pts.length; j++) {
    var u = f.pts[j][0], v = f.pts[j][1];
    var bend = Math.sin(swimPh - u * 2.6 - i * 0.10) * Math.pow(u, 1.5) * g.hd * 0.38;
    var px = g.cx + (u - 0.5) * g.L * scale * flip + ex;
    var py = g.cy + v * g.hd * scale + bend + ey;
    if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function drawFins(g) {
  var ex = (LAYERS - 1 - 6.5) * (2.6 + explodeK * g.L * 0.045);
  var ey = (LAYERS - 1 - 6.5) * (-1.5 - explodeK * g.L * 0.020);
  var flip = flipT < 0.45 ? 1 - 0.3 * Math.sin(3.1416 * (flipT / 0.45)) : 1;
  function P(u, v) {
    var bend = Math.sin(swimPh - u * 2.6 - 13 * 0.10) * Math.pow(u, 1.5) * g.hd * 0.38;
    return [g.cx + (u - 0.5) * g.L * flip + ex, g.cy + v * g.hd + bend + ey];
  }
  ctx.fillStyle = RUST;
  // tail fin wash
  var tail = [[0.85, -0.5], [1, -0.98], [0.935, 0], [1, 0.98], [0.85, 0.5], [0.88, 0]];
  if (kindIdx === 1) tail = [[0.86, -0.52], [1, -0.6], [1, 0.6], [0.86, 0.52], [0.89, 0]];
  if (kindIdx === 2) tail = [[0.85, -0.5], [1, -1.12], [0.93, 0], [1, 1.12], [0.85, 0.5], [0.88, 0]];
  ctx.beginPath();
  for (var j = 0; j < tail.length; j++) { var q = P(tail[j][0], tail[j][1]); if (j === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]); }
  ctx.closePath(); ctx.globalAlpha = 0.6; ctx.fill(); ctx.globalAlpha = 1;
  // dorsal fin
  var d = [P(0.34, -0.8), P(0.44, -1.12), P(0.56, -0.82)];
  ctx.beginPath(); ctx.moveTo(d[0][0], d[0][1]); ctx.lineTo(d[1][0], d[1][1]); ctx.lineTo(d[2][0], d[2][1]); ctx.closePath(); ctx.fill();
  // pectoral fin
  var p = [P(0.2, 0.55), P(0.3, 0.95), P(0.34, 0.6)];
  ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); ctx.lineTo(p[1][0], p[1][1]); ctx.lineTo(p[2][0], p[2][1]); ctx.closePath(); ctx.fill();
  // eye on the front layer
  var e = P(0.09, -0.12);
  ctx.beginPath(); ctx.arc(e[0], e[1], Math.max(2, g.L * 0.006), 0, 6.284);
  ctx.fillStyle = GROUND; ctx.fill();
}

// ---- crate ---------------------------------------------------------------------
function drawCrate(g) {
  if (T >= 4.35) return;
  var cw = g.L * 1.08, ch = g.hd * 3.2;
  var x0 = g.cx - cw / 2, y0 = g.cy - ch / 2;
  var frameA = 1 - smooth(3.9, 4.3, T);
  ctx.save();
  // side and bottom planks of the open crate
  ctx.globalAlpha = frameA;
  ctx.fillStyle = WOOD;
  var bw = Math.max(8, cw * 0.035);
  ctx.fillRect(x0, y0, bw, ch);
  ctx.fillRect(x0 + cw - bw, y0, bw, ch);
  ctx.fillRect(x0, y0 + ch - bw, cw, bw);
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
  ctx.strokeRect(x0 + 0.5, y0 + 0.5, cw - 1, ch - 1);
  ctx.beginPath(); ctx.moveTo(x0, y0 + ch * 0.5); ctx.lineTo(x0 + bw, y0 + ch * 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0 + cw - bw, y0 + ch * 0.5); ctx.lineTo(x0 + cw, y0 + ch * 0.5); ctx.stroke();
  // the lid, hinged along the crate's top edge: the edge stays fixed
  // and the panel swings from hanging closed (down over the fish) to
  // flipped up and away, drawn in its own basis so the stencil rides it
  var lidK = smooth(0, 3.6, T);
  var a = lidK * 2.9;
  var dirX = Math.sin(a) * 0.3, dirY = Math.cos(a);
  ctx.globalAlpha = frameA * (1 - smooth(3.4, 4.1, T) * 0.6);
  ctx.save();
  ctx.transform(1, 0, dirX, dirY, g.cx, y0);
  ctx.fillStyle = WOOD;
  ctx.fillRect(-cw / 2, 0, cw, ch);
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.strokeRect(-cw / 2 + 0.5, 0.5, cw - 1, ch - 1);
  ctx.beginPath();
  ctx.moveTo(-cw / 2, ch * 0.33); ctx.lineTo(cw / 2, ch * 0.33);
  ctx.moveTo(-cw / 2, ch * 0.66); ctx.lineTo(cw / 2, ch * 0.66);
  ctx.stroke();
  ctx.fillStyle = PAINT;
  ctx.font = '700 ' + Math.round(ch * 0.17) + 'px "Arial Narrow", Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = frameA * 0.92;
  // the stencil is painted so it reads upright once the lid has
  // flipped over the top, the way a flung-open crate lid settles
  ctx.save();
  ctx.translate(0, ch * 0.5);
  ctx.scale(1, -1);
  ctx.fillText('FRESH FISH CRATE', 0, 0);
  ctx.restore();
  ctx.restore();
  ctx.restore();
}

// ---- input -------------------------------------------------------------------------
var dragging = false, dragStart = null, lastTapT = -9, lastTapX = 0, lastTapY = 0;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging || !dragStart) return;
  var dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  explodeTarget = clamp(Math.sqrt(dx * dx + dy * dy) / 240, 0, 1);
});
function endPointer(e) {
  if (!dragging) return;
  dragging = false;
  explodeTarget = 0;
  var now = (e.timeStamp || 0) / 1000;
  var moved = dragStart ? Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) : 99;
  if (moved < 10) {
    if (Math.abs(e.clientX - lastTapX) < 60 && Math.abs(e.clientY - lastTapY) < 60 && now - lastTapT < 0.34) {
      kindIdx = (kindIdx + 1) % FISH.length;
      flipT = 0;
      lastTapT = -9;
    } else {
      lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
    }
  }
  dragStart = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { dragging = false; explodeTarget = 0; dragStart = null; });

// ---- resize ----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- draw ----------------------------------------------------------------------------------
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && now > 0) {
    var dt = Math.min(0.05, (now - lastNow) / 1000);
    T += dt;
    swimPh += dt * 1.7;
    flipT += dt;
    // heavy spring toward the explode target: stiff, damped, a breath of overshoot
    var acc = (explodeTarget - explodeK) * 60 - explodeV * 11;
    explodeV += acc * dt;
    explodeK += explodeV * dt;
    if (explodeK < -0.05) { explodeK = -0.05; explodeV = 0; }
    if (explodeK > 1.05) { explodeK = 1.05; explodeV = 0; }
  }
  lastNow = now;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var g = fishGeom();
  // a whisper of water depth under the fish
  var wg = ctx.createRadialGradient(g.cx, g.cy, 10, g.cx, g.cy, g.L * 0.62);
  wg.addColorStop(0, 'rgba(107,114,128,0.07)');
  wg.addColorStop(1, 'rgba(107,114,128,0)');
  ctx.fillStyle = wg;
  ctx.fillRect(0, 0, W, H);
  for (var i = 0; i < LAYERS; i++) {
    layerPath(i, g);
    ctx.fillStyle = layerColor(i);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  drawFins(g);
  drawCrate(g);
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
