<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.271 The Clouds That Kept Us Grounded</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#7A8BA0; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.271 The Clouds That Kept Us Grounded (Shupiwe Chongwe).
// After her Leh sky forms: raw burnished stoneware clouds,
// soft, heavy and low-slung, resting nearly still above a
// dark Ladakhi ground, made in response to days spent
// staring at the sky in Leh. The clouds drift almost
// imperceptibly on a slow sine and the low sun breathes
// across their burnished surfaces. Watch only: stillness
// is the point, so there are no interaction handlers.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var STONE = '#8A5A3B', HIGH = '#D8C4A8', GROUND = '#2E2620', SKY = '#7A8BA0', GOLD = '#D9A85C';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var T = 18, lastNow = -1; // frame one: the sheen is mid-travel on the largest form

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

// ---- the six cloud-forms ------------------------------------------------------------
// Each form is one flat silhouette: a low, wide base lobe plus a
// row of overlapping lobes along its top, all filled in a single
// path so the cluster reads as one heavy stoneware mass, never
// as separate cartoon puffs. Lobe tables are jittered per form
// from a fixed seed so every form is kin but not a copy.
var LOBES = [
  [0, 28, 190, 52],
  [-118, 10, 108, 54],
  [118, 8, 106, 53],
  [-72, -36, 86, 60],
  [28, -46, 94, 66],
  [128, -26, 70, 48],
  [-158, -18, 66, 44],
  [62, 24, 122, 48]
];
var forms = [];
(function () {
  var defs = [
    { cx: 225, cy: 180, sc: 0.90, seed: 27111, ph: 0.0 },
    { cx: 640, cy: 160, sc: 1.02, seed: 27123, ph: 1.7 },
    { cx: 1055, cy: 185, sc: 0.90, seed: 27137, ph: 3.1 },
    { cx: 565, cy: 295, sc: 0.85, seed: 27149, ph: 4.4 },
    { cx: 360, cy: 445, sc: 0.95, seed: 27161, ph: 2.3 },
    { cx: 830, cy: 450, sc: 1.08, seed: 27173, ph: 5.5 }
  ];
  for (var f = 0; f < defs.length; f++) {
    var d = defs[f], r = rng(d.seed), lobes = [];
    for (var i = 0; i < LOBES.length; i++) {
      lobes.push({
        dx: LOBES[i][0] + (r() - 0.5) * 18,
        dy: LOBES[i][1] + (r() - 0.5) * 12,
        rx: LOBES[i][2] * (0.94 + r() * 0.12),
        ry: LOBES[i][3] * (0.94 + r() * 0.12)
      });
    }
    forms.push({ cx: d.cx, cy: d.cy, sc: d.sc, ph: d.ph, lobes: lobes });
  }
})();
// ---- the dark ground's fleck texture --------------------------------------------------
var flecks = [];
(function () {
  var r = rng(27189);
  var cols = [HIGH, STONE, GOLD, HIGH, STONE];
  for (var i = 0; i < 700; i++) {
    flecks.push({
      x: r() * DW, y: 610 + r() * (DH - 622),
      s: 0.8 + r() * 2.2, a: 0.04 + r() * 0.09,
      col: cols[Math.floor(r() * cols.length)]
    });
  }
  for (var j = 0; j < 60; j++) {
    flecks.push({
      x: r() * DW, y: 606 + r() * 46,
      s: 1.2 + r() * 2.6, a: 0.08 + r() * 0.10,
      col: cols[Math.floor(r() * cols.length)]
    });
  }
})();

function formPath(fm, cx, cy) {
  // One solid underlay first, so no sky can show through the
  // junctions where lobes meet; then each lobe filled as its
  // own path (overpaint union, no winding-rule holes).
  ctx.beginPath();
  ctx.ellipse(cx, cy + 12 * fm.sc, 208 * fm.sc, 64 * fm.sc, 0, 0, Math.PI * 2);
  ctx.fill();
  for (var i = 0; i < fm.lobes.length; i++) {
    var L = fm.lobes[i];
    ctx.beginPath();
    ctx.ellipse(cx + L.dx * fm.sc, cy + L.dy * fm.sc, L.rx * fm.sc, L.ry * fm.sc, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function draw() {
  // the low sun: its angle oscillates over about 60 seconds,
  // carrying the sheen across the burnished surfaces
  var sun = Math.sin(T * Math.PI * 2 / 60 + 0.7);
  // ---- the Leh sky at dusk ---------------------------------------------------------
  ctx.fillStyle = SKY;
  ctx.fillRect(-10, -10, DW + 20, 612);
  // two very faint horizontal tone bands, mixed from the palette
  ctx.fillStyle = rgba(HIGH, 0.055);
  ctx.fillRect(-10, 116, DW + 20, 56);
  ctx.fillStyle = rgba(GOLD, 0.045);
  ctx.fillRect(-10, 376, DW + 20, 40);
  // ---- the dark ground, lower third --------------------------------------------------
  ctx.fillStyle = GROUND;
  ctx.fillRect(-10, 602, DW + 20, DH - 592);
  for (var g = 0; g < flecks.length; g++) {
    var fl = flecks[g];
    ctx.fillStyle = rgba(fl.col, fl.a);
    ctx.fillRect(fl.x, fl.y, fl.s, fl.s * 0.7);
  }
  // ---- the cloud-forms, upper two-thirds ---------------------------------------------
  for (var f = 0; f < forms.length; f++) {
    var fm = forms[f];
    // lateral drift: a slow sine, about 120 second period,
    // about 25 design px at most, the forms never leave the frame
    var cx = fm.cx + 25 * Math.sin(T * Math.PI * 2 / 120 + fm.ph);
    var cy = fm.cy + 4 * Math.sin(T * Math.PI * 2 / 120 + fm.ph + 1.3);
    // the silhouette: underlay plus every lobe, flat stoneware
    ctx.fillStyle = STONE;
    formPath(fm, cx, cy);
    // weight at the base: a low shade held inside the silhouette
    ctx.fillStyle = rgba(GROUND, 0.045);
    ctx.beginPath();
    ctx.ellipse(cx, cy + 42 * fm.sc, 120 * fm.sc, 20 * fm.sc, 0, 0, Math.PI * 2);
    ctx.fill();
    // the burnished sheen: a broad soft wash high on the form,
    // following the sun
    ctx.fillStyle = rgba(HIGH, 0.08);
    ctx.beginPath();
    ctx.ellipse(cx + sun * 40 * fm.sc, cy - 30 * fm.sc, 150 * fm.sc, 32 * fm.sc, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(GOLD, 0.06);
    ctx.beginPath();
    ctx.ellipse(cx + sun * 54 * fm.sc, cy - 20 * fm.sc, 96 * fm.sc, 24 * fm.sc, 0, 0, Math.PI * 2);
    ctx.fill();
    // the highlight pass: smaller offset ellipses on the dome
    // lobes only (indices 3 to 6), riding with the sun
    for (var i = 3; i < fm.lobes.length && i < 7; i++) {
      var L = fm.lobes[i];
      ctx.fillStyle = rgba(HIGH, 0.15);
      ctx.beginPath();
      ctx.ellipse(
        cx + (L.dx + sun * 22) * fm.sc,
        cy + (L.dy - L.ry * 0.30) * fm.sc,
        L.rx * 0.48 * fm.sc, L.ry * 0.32 * fm.sc, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // thin low-sun gold arcs hugging the top of each dome lobe,
    // their centres sweeping as the sun angle moves
    var arcC = -Math.PI / 2 + sun * 0.85;
    ctx.strokeStyle = rgba(GOLD, 0.42 + 0.20 * Math.abs(sun));
    ctx.lineWidth = 2.6;
    for (var a = 3; a < fm.lobes.length && a < 7; a++) {
      var AL = fm.lobes[a];
      ctx.beginPath();
      ctx.ellipse(cx + AL.dx * fm.sc, cy + AL.dy * fm.sc,
        (AL.rx - 1) * fm.sc, (AL.ry - 1) * fm.sc, 0, arcC - 0.5, arcC + 0.5);
      ctx.stroke();
    }
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only, the slowest piece in the set.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: the sky and the dark ground fill the frame edge to edge
  var S = Math.max(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
