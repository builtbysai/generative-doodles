<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Voice Draws a Path in My Body</title>
<style>
html, body { margin: 0; padding: 0; background: #FAF7F2; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* The Voice Draws a Path in My Body: a large, soft body-shaped field in
   warm blush tones fills the frame, drawn like a contour map. A single
   ink line draws itself continuously across it, as if exhaled: it
   thickens where the field is warm (chest), thins to a hairline at the
   edges (limbs), pools into small ink blots at phrase ends. The line
   never lifts; it is one unbroken breath that takes about two minutes
   to cross the body. When it reaches the far edge it fades and a new
   breath begins from the throat point. Watch only. */
var TAU = Math.PI * 2;
var GROUND = '#FAF7F2';
var INK = '#1A1715';
var ROSE_PALE = '#F3D3C8';
var BLUSH = '#EBC0B2';
var BLUSH_WARM = '#E8AFA0';
var CHEST_GLOW = '#E89B88';
var THROAT = '#8E1F2A';
var PLATE = '#FFFFFF';
var PLATE_LINE = 'rgba(26,23,21,0.25)';
var TITLE_INK = '#1A1715';
var HINT_INK = '#6B5A52';
var BREATH = 120;         /* one breath crosses the body in two minutes */
var FRAME_T = 40.0;       /* fixed phase: line partway across, blots pooled */
var SEED0 = 1883;         /* fixed seed for the first breath, thumb stable */
var PHRASE_ENDS = [24, 48, 72, 96, 120]; /* blots pool at phrase ends */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- body geometry: a soft vertical mass, wider at the chest ---- */
var geom = null; /* {cx, cy, U, throatX, throatY, chestX, chestY} */
function bodyPath() {
  /* local coords, unit U, centered on the body center */
  var U = geom.U;
  ctx.beginPath();
  ctx.moveTo(0, -0.40 * U);
  ctx.bezierCurveTo(0.13 * U, -0.38 * U, 0.20 * U, -0.28 * U, 0.21 * U, -0.15 * U);
  ctx.bezierCurveTo(0.215 * U, -0.02 * U, 0.18 * U, 0.08 * U, 0.15 * U, 0.15 * U);
  ctx.bezierCurveTo(0.13 * U, 0.26 * U, 0.10 * U, 0.36 * U, 0, 0.40 * U);
  ctx.bezierCurveTo(-0.10 * U, 0.36 * U, -0.13 * U, 0.26 * U, -0.15 * U, 0.15 * U);
  ctx.bezierCurveTo(-0.18 * U, 0.08 * U, -0.215 * U, -0.02 * U, -0.21 * U, -0.15 * U);
  ctx.bezierCurveTo(-0.20 * U, -0.28 * U, -0.13 * U, -0.38 * U, 0, -0.40 * U);
  ctx.closePath();
}
function warmthAt(x, y) {
  /* radial warmth map: throat hot, chest warm, edges and limbs cool */
  var U = geom.U;
  var dx = (x - geom.throatX) / (0.55 * U);
  var dy = (y - geom.throatY) / (0.55 * U);
  var d = Math.sqrt(dx * dx + dy * dy);
  var ex = (x - geom.cx) / (0.21 * U);
  var ey = (y - geom.cy) / (0.40 * U);
  var r = Math.sqrt(ex * ex + ey * ey);
  var w = 1.10 - d * 0.9 - Math.max(0, r - 0.7) * 1.2;
  return clamp(w, 0.12, 1);
}
function fieldR(x, y) {
  var U = geom.U;
  var ex = (x - geom.cx) / (0.21 * U);
  var ey = (y - geom.cy) / (0.40 * U);
  return Math.sqrt(ex * ex + ey * ey);
}
/* ---- one breath: a flow-field follower, pure function of its seed ---- */
/* The follower starts at the throat, drifts downward through a seeded
   smooth-noise field, and is steered back toward the center when it
   nears the edge of the body mass. Speed follows a 2-minute breath
   envelope, slow at the start, fullest mid breath. Blots pool at phrase
   ends and wherever the follower dwells. The whole breath is generated
   once from its seed, so frame one is reproducible. */
var breathCache = {};
function genBreath(idx) {
  if (breathCache[idx]) return breathCache[idx];
  var seed = SEED0 + idx * 7919;
  var rng = mulberry32(seed);
  var U = geom.U;
  /* smooth value-noise grid over the field, seeded, bilinear + smoothstep */
  var GN = 24, grid = [], gi;
  for (gi = 0; gi < (GN + 1) * (GN + 1); gi++) grid.push(rng());
  function noise(nx, ny) {
    var gx = clamp(nx, 0, 1) * GN, gy = clamp(ny, 0, 1) * GN;
    var ix = Math.floor(gx), iy = Math.floor(gy);
    var fx = gx - ix, fy = gy - iy;
    if (ix >= GN) ix = GN - 1;
    if (iy >= GN) iy = GN - 1;
    var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    var a = grid[iy * (GN + 1) + ix], b = grid[iy * (GN + 1) + ix + 1];
    var c = grid[(iy + 1) * (GN + 1) + ix], d = grid[(iy + 1) * (GN + 1) + ix + 1];
    return lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
  }
  var dt = 1 / 30;
  var pts = [];
  var blots = [];
  var x = geom.throatX, y = geom.throatY;
  var heading = Math.PI / 2;
  var t = 0;
  var slowTime = 0, lastBlotT = -10;
  var pi;
  while (t <= BREATH) {
    var env = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(TAU * (t / BREATH) - Math.PI / 2));
    var nx = (x - (geom.cx - 0.24 * U)) / (0.48 * U);
    var ny = (y - (geom.cy - 0.44 * U)) / (0.88 * U);
    var target = Math.PI / 2 + (noise(nx, ny) - 0.5) * 2.2;
    var r = fieldR(x, y);
    if (r > 0.88) target = Math.atan2(geom.cy - y, geom.cx - x);
    var diff = target - heading;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    heading += clamp(diff, -0.12, 0.12);
    var speed = 0.021 * U * env;
    var step = speed * dt;
    x += Math.cos(heading) * step;
    y += Math.sin(heading) * step;
    if (fieldR(x, y) > 0.98) { /* pulled back inside the mass, never outside */
      x = geom.cx + (x - geom.cx) * 0.96;
      y = geom.cy + (y - geom.cy) * 0.96;
    }
    pts.push({ x: x, y: y, t: t, w: warmthAt(x, y) });
    /* phrase-end blots */
    for (pi = 0; pi < PHRASE_ENDS.length; pi++) {
      if (t >= PHRASE_ENDS[pi] && t - dt < PHRASE_ENDS[pi]) {
        blots.push({ x: x, y: y, t: PHRASE_ENDS[pi], w: warmthAt(x, y) });
        lastBlotT = PHRASE_ENDS[pi];
      }
    }
    /* dwell blots: the follower lingers where the breath slows */
    if (step < 0.0004 * U) {
      slowTime += dt;
      if (slowTime > 2.0 && t - lastBlotT > 6) {
        blots.push({ x: x, y: y, t: t, w: warmthAt(x, y) });
        lastBlotT = t;
        slowTime = 0;
      }
    } else {
      slowTime = 0;
    }
    t += dt;
  }
  var out = { pts: pts, blots: blots };
  breathCache[idx] = out;
  return out;
}
/* ---- WebAudio: one sustained vocal-like tone, lazy, gesture only ---- */
/* The tone is a filtered sawtooth with slow formant drift. Its gain and
   formant follow the line's width, a closed-form function of phaseT,
   so the sound model runs even with audio off. Real WebAudio is created
   only inside the sound-toggle gesture, never autoplay. */
var audioCtx = null, audioReady = false;
var audioOsc = null, audioGain = null, audioFormant = null;
var soundOn = false;
var soundRect = null;
function ensureAudio() {
  if (audioCtx) return;
  try {
    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    audioCtx = new AC();
    audioOsc = audioCtx.createOscillator();
    audioOsc.type = 'sawtooth';
    audioOsc.frequency.value = 196;
    var lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    audioFormant = audioCtx.createBiquadFilter();
    audioFormant.type = 'bandpass'; audioFormant.frequency.value = 800; audioFormant.Q.value = 4;
    audioGain = audioCtx.createGain();
    audioGain.gain.value = 0.0001;
    audioOsc.connect(lp); lp.connect(audioFormant); audioFormant.connect(audioGain);
    audioGain.connect(audioCtx.destination);
    audioOsc.start();
    audioReady = true;
  } catch (e) { audioCtx = null; audioReady = false; }
}
function headWarmth() {
  var breath = Math.floor(phaseT / BREATH);
  var lt = phaseT - breath * BREATH;
  var b = genBreath(breath);
  var i, head = b.pts[0];
  for (i = 0; i < b.pts.length; i++) {
    if (b.pts[i].t > lt) break;
    head = b.pts[i];
  }
  return head ? head.w : 0.5;
}
function updateAudio() {
  if (!audioCtx || !audioReady || !soundOn) return;
  try {
    var w = headWarmth();
    var now = audioCtx.currentTime;
    var vib = 3 * Math.sin(TAU * (phaseT / BREATH));
    audioOsc.frequency.setTargetAtTime(196 + vib, now, 0.1);
    var formant = 800 + 300 * Math.sin(TAU * (phaseT / BREATH) + 1.3);
    audioFormant.frequency.setTargetAtTime(formant, now, 0.1);
    audioGain.gain.setTargetAtTime(0.02 + 0.10 * w, now, 0.1);
  } catch (e) { /* audio is a garnish; a failure must never break the picture */ }
}
function toggleSound() {
  soundOn = !soundOn;
  ensureAudio();
  if (audioCtx && audioReady) {
    try {
      if (audioCtx.resume) audioCtx.resume();
      var now = audioCtx.currentTime;
      if (soundOn) {
        updateAudio();
      } else {
        audioGain.gain.setTargetAtTime(0.0001, now, 0.05);
      }
    } catch (e) { /* ignore */ }
  }
  draw();
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  breathCache = {};
}
/* Centered soft-mass composition: full-bleed on phones, a centered
   square on desktop, the ground taking the piece's own paper white. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function drawField() {
  var U = geom.U;
  var cx = geom.cx, cy = geom.cy;
  /* outer pale rose mass */
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = ROSE_PALE;
  bodyPath();
  ctx.fill();
  /* mid blush layer, slightly smaller, toward the chest */
  ctx.translate(0, -0.05 * U);
  ctx.scale(0.72, 0.72);
  ctx.fillStyle = BLUSH;
  bodyPath();
  ctx.fill();
  /* warm blush heart, smaller still */
  ctx.scale(0.62, 0.62);
  ctx.translate(0, -0.04 * U);
  ctx.fillStyle = BLUSH_WARM;
  bodyPath();
  ctx.fill();
  ctx.restore();
  /* chest glow: warmth radiating from the chest */
  var cg = ctx.createRadialGradient(geom.chestX, geom.chestY, 0, geom.chestX, geom.chestY, U * 0.22);
  cg.addColorStop(0, rgba(CHEST_GLOW, 0.45));
  cg.addColorStop(1, rgba(CHEST_GLOW, 0));
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(geom.chestX + U * 0.22, geom.chestY);
  ctx.arc(geom.chestX, geom.chestY, U * 0.22, 0, TAU);
  ctx.fill();
  /* contour lines, like a contour map, faint ink */
  ctx.save();
  ctx.translate(cx, cy - 0.05 * U);
  var ci, cs = [0.9, 0.68, 0.46, 0.26];
  for (ci = 0; ci < cs.length; ci++) {
    ctx.save();
    ctx.scale(cs[ci], cs[ci]);
    ctx.strokeStyle = rgba(INK, 0.07);
    ctx.lineWidth = Math.max(0.7, U * 0.0012);
    bodyPath();
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  /* throat point: deep red, where every breath begins */
  var tg = ctx.createRadialGradient(geom.throatX, geom.throatY, 0, geom.throatX, geom.throatY, U * 0.03);
  tg.addColorStop(0, rgba(THROAT, 0.55));
  tg.addColorStop(1, rgba(THROAT, 0));
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(geom.throatX + U * 0.03, geom.throatY);
  ctx.arc(geom.throatX, geom.throatY, U * 0.03, 0, TAU);
  ctx.fill();
  ctx.fillStyle = THROAT;
  ctx.beginPath();
  ctx.moveTo(geom.throatX + U * 0.008, geom.throatY);
  ctx.arc(geom.throatX, geom.throatY, U * 0.008, 0, TAU);
  ctx.fill();
}
function drawBreath(breathIdx, lt) {
  var b = genBreath(breathIdx);
  var U = geom.U;
  var fade = clamp(lt / 2, 0, 1) * clamp((BREATH - lt) / 5, 0, 1);
  if (fade <= 0) return;
  /* blots first, so the line pools over them */
  var bi;
  for (bi = 0; bi < b.blots.length; bi++) {
    var bl = b.blots[bi];
    if (bl.t > lt) continue;
    var br = U * lerp(0.004, 0.011, bl.w);
    var bg = ctx.createRadialGradient(bl.x, bl.y, 0, bl.x, bl.y, br);
    bg.addColorStop(0, rgba(INK, 0.85 * fade));
    bg.addColorStop(0.7, rgba(INK, 0.55 * fade));
    bg.addColorStop(1, rgba(INK, 0));
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(bl.x + br, bl.y);
    ctx.arc(bl.x, bl.y, br, 0, TAU);
    ctx.fill();
  }
  /* the line itself, segment by segment so width follows warmth */
  var i;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (i = 1; i < b.pts.length; i++) {
    var p0 = b.pts[i - 1], p1 = b.pts[i];
    if (p1.t > lt) break;
    var w = (p0.w + p1.w) / 2;
    ctx.strokeStyle = rgba(INK, (0.50 + 0.45 * w) * fade);
    ctx.lineWidth = Math.max(0.7, U * lerp(0.0012, 0.0085, w));
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
  }
  /* soft head glow where the breath is now */
  var head = null;
  for (i = 0; i < b.pts.length; i++) {
    if (b.pts[i].t > lt) break;
    head = b.pts[i];
  }
  if (head) {
    var hg = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, U * 0.018);
    hg.addColorStop(0, rgba(INK, 0.20 * fade));
    hg.addColorStop(1, rgba(INK, 0));
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(head.x + U * 0.018, head.y);
    ctx.arc(head.x, head.y, U * 0.018, 0, TAU);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Voice Draws a Path in My Body').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Voice Draws a Path in My Body').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 09').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Voice Draws a Path in My Body', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 09', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. One breath crosses the body.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound on' : 'Sound off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  var sndPlateW = sndW + 24;
  var sndPlateH = smallPx + 14;
  var sndPlateX = VW - sndPlateW - 12;
  var sndPlateY = VH - sndPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(sndPlateX, sndPlateY, sndPlateW, sndPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(sndPlateX + 0.5, sndPlateY + 0.5, sndPlateW - 1, sndPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, sndPlateX + 12, sndPlateY + 7);
  soundRect = { x: sndPlateX, y: sndPlateY, w: sndPlateW, h: sndPlateH };
}
function draw() {
  size();
  var sc = fieldRect();
  var U = isPhone ? Math.min(VW * 1.9, VH * 0.72) : Math.min(sc.w, sc.h);
  var cx = sc.x + sc.w / 2;
  var cy = sc.y + sc.h * 0.52;
  geom = {
    cx: cx, cy: cy, U: U,
    throatX: cx, throatY: cy - 0.34 * U,
    chestX: cx, chestY: cy - 0.10 * U
  };
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.beginPath();
  ctx.rect(sc.x, sc.y, sc.w, sc.h);
  ctx.clip();
  drawField();
  var breath = Math.floor(phaseT / BREATH);
  var lt = phaseT - breath * BREATH;
  drawBreath(breath, lt);
  ctx.restore();
  drawPlates();
}
/* ---- frame one: fixed phase t = 40 s, seed 1883, breath 0, one blot
   pooled at the 24 s phrase end and the line partway across the body ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (canvas && typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', function (ev) {
    if (ev && ev.preventDefault) ev.preventDefault();
    if (!soundRect) return;
    var px = 0, py = 0;
    if (ev && typeof ev.clientX === 'number') { px = ev.clientX; py = ev.clientY; }
    else if (ev && typeof ev.offsetX === 'number') { px = ev.offsetX; py = ev.offsetY; }
    if (px >= soundRect.x && px <= soundRect.x + soundRect.w &&
        py >= soundRect.y && py <= soundRect.y + soundRect.h) {
      toggleSound();
    }
    /* anywhere else: watch only, the line is never steered */
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (soundOn) updateAudio();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
