<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9040 · Crows on a Wire</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e9e2d0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; cursor: pointer; }
  .cap {
    position: fixed; left: 18px; bottom: 14px; pointer-events: none;
    color: #6b6250; font: italic 12.5px/1.5 Georgia, serif; opacity: 0.85;
  }
  .cap b { color: #3d382c; font-weight: normal; font-style: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><b>№9040 · Crows on a Wire</b>, five on the wire and one just leaving, click for another morning</div>
<script>
'use strict';
/*
  Crows on a Wire: five crow silhouettes perched on a sagging wire in the
  lower third, a sixth caught mid-takeoff just above, loose ink strokes
  trailing for motion. Big empty sky. A moment you actually saw.
*/

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '1701', 10) || 1701;
let rand = mulberry32(seed);

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const U = 1000; // virtual units, viewport-invariant composition
const INK = '58,52,44';

function fit() {
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const s = Math.min(window.innerWidth, window.innerHeight) * 0.94;
  cv.width = s * DPR; cv.height = s * DPR;
  cv.style.width = s + 'px'; cv.style.height = s + 'px';
  ctx.setTransform(cv.width / U, 0, 0, cv.width / U, 0, 0);
}
window.addEventListener('resize', () => { fit(); draw(); });

// value noise for hand wobble
function makeNoise(r) {
  const p = new Array(256);
  for (let i = 0; i < 256; i++) p[i] = r();
  return function (x) {
    const xi = Math.floor(x), xf = x - xi;
    const a = p[xi & 255], b = p[(xi + 1) & 255];
    const u = xf * xf * (3 - 2 * xf);
    return a + (b - a) * u;
  };
}

function draw() {
  rand = mulberry32(seed);
  const noise = makeNoise(rand);
  const R = (a, b) => a + rand() * (b - a);
  const ink = (a) => 'rgba(' + INK + ',' + a.toFixed(3) + ')';

  // ---- paper ----
  const paper = ctx.createLinearGradient(0, 0, U, U);
  paper.addColorStop(0, '#f3eee1');
  paper.addColorStop(0.6, '#efe8d6');
  paper.addColorStop(1, '#e9e1cc');
  ctx.fillStyle = paper;
  ctx.fillRect(0, 0, U, U);

  const MX = 90, MY = 90, PW = U - 2 * MX, PH = U - 2 * MY;

  ctx.save();
  ctx.beginPath(); ctx.rect(MX, MY, PW, PH); ctx.clip();

  // ---- the wire: gentle catenary-ish sag, lower third ----
  const edgeY = MY + PH * R(0.58, 0.66);
  const sag = R(46, 88);
  const midX = MX + PW / 2, halfSpan = PW / 2 + 60;
  // wy: edgeY at the margins, edgeY + sag at center
  const wy = (x) => edgeY + sag * (1 - Math.pow(Math.max(-1, Math.min(1, (x - midX) / halfSpan)), 2));

  ctx.strokeStyle = ink(0.85);
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = MX - 50; x <= MX + PW + 50; x += 8) {
    const y = wy(x) + (noise(x * 0.02) - 0.5) * 4;
    x <= MX - 50 + 1 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  // faint second pass for hand feel
  ctx.strokeStyle = ink(0.25);
  ctx.lineWidth = 6;
  ctx.beginPath();
  for (let x = MX - 50; x <= MX + PW + 50; x += 8) {
    const y = wy(x) + 3 + (noise(x * 0.02 + 40) - 0.5) * 4;
    x <= MX - 50 + 1 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // ---- helpers ----
  function wobEllipse(cx, cy, rx, ry, rot, amp, seedOff) {
    ctx.beginPath();
    const n = 30;
    for (let i = 0; i <= n; i++) {
      const a = i / n * Math.PI * 2;
      const w = 1 + (noise(i * 0.9 + seedOff) - 0.5) * amp;
      const ex = Math.cos(a) * rx * w, ey = Math.sin(a) * ry * w;
      const px = cx + ex * Math.cos(rot) - ey * Math.sin(rot);
      const py = cy + ex * Math.sin(rot) + ey * Math.cos(rot);
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  // perched crow, facing dir (+1 right, -1 left). Feet at (fx, fy) on the wire.
  function perchedCrow(fx, fy, s, dir, pose, nOff) {
    ctx.fillStyle = ink(0.95);
    const hunch = pose.hunch; // 0 upright .. 1 tucked
    // body center sits above the wire
    const bx = fx, by = fy - s * (0.52 - hunch * 0.12);
    const tilt = dir * (0.06 + hunch * 0.1);
    wobEllipse(bx, by, s * 0.5, s * (0.30 - hunch * 0.04), tilt, 0.16, nOff);
    // head
    const hx = bx + dir * s * (0.38 - hunch * 0.12);
    const hy = by - s * (0.30 - hunch * 0.16) + pose.headDip * s;
    wobEllipse(hx, hy, s * 0.20, s * 0.19, 0, 0.18, nOff + 31);
    // beak
    const bbx = hx + dir * s * 0.17;
    ctx.beginPath();
    ctx.moveTo(bbx, hy - s * 0.07);
    ctx.lineTo(bbx + dir * s * 0.22, hy + s * 0.015 + (noise(nOff + 7) - 0.5) * s * 0.04);
    ctx.lineTo(bbx, hy + s * 0.09);
    ctx.closePath(); ctx.fill();
    // tail: tapered quad sweeping back and down
    const tx = bx - dir * s * 0.42;
    const ty = by + s * 0.10;
    const tLen = s * R(0.55, 0.72), tDrop = s * R(0.28, 0.45);
    const tW = s * 0.13;
    ctx.beginPath();
    ctx.moveTo(tx, ty - tW);
    ctx.lineTo(tx - dir * tLen + (noise(nOff + 11) - 0.5) * s * 0.08, ty + tDrop);
    ctx.lineTo(tx - dir * tLen + (noise(nOff + 13) - 0.5) * s * 0.08, ty + tDrop + tW * 0.7);
    ctx.lineTo(tx, ty + tW);
    ctx.closePath(); ctx.fill();
    // legs and feet gripping the wire
    ctx.strokeStyle = ink(0.95);
    ctx.lineWidth = Math.max(2, s * 0.045);
    for (const lx of [-0.06, 0.14]) {
      const sx = bx + dir * lx * s, sy = by + s * 0.24;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + dir * s * 0.02, fy - 2); ctx.stroke();
      // toes
      ctx.lineWidth = Math.max(1.5, s * 0.03);
      for (const ta of [-0.5, 0, 0.5]) {
        ctx.beginPath(); ctx.moveTo(sx + dir * s * 0.02, fy - 2);
        ctx.lineTo(sx + dir * s * 0.02 + ta * s * 0.09, fy + 3); ctx.stroke();
      }
      ctx.lineWidth = Math.max(2, s * 0.045);
    }
  }

  // ---- five crows on the wire ----
  const poses = [
    { hunch: 0.15, headDip: 0 },   // alert
    { hunch: 0.85, headDip: 0.10 },// hunched
    { hunch: 0.45, headDip: 0.22 },// preening, head bowed
    { hunch: 0.10, headDip: -0.04 },// tall alert
    { hunch: 0.70, headDip: 0.06 },// sleepy
  ];
  const dir0 = rand() < 0.5 ? 1 : -1;
  for (let i = 0; i < 5; i++) {
    const slot = (i + 0.5) / 5;
    const fx = MX + PW * (slot + R(-0.055, 0.055));
    const fy = wy(fx);
    const s = R(64, 96);
    const dir = (i === 3) ? -dir0 : dir0; // one contrarian
    perchedCrow(fx, fy, s, dir, poses[i], i * 97 + 3);
  }

  // ---- the sixth, mid-takeoff ----
  {
    const nOff = 777;
    const fx = MX + PW * R(0.3, 0.7);
    const s = R(84, 100);
    const dir = dir0;
    const cy = wy(fx) - s * R(2.1, 2.6);
    const cx = fx + R(-30, 30);
    ctx.fillStyle = ink(0.95);
    // body, horizontal
    wobEllipse(cx, cy, s * 0.46, s * 0.21, dir * 0.08, 0.16, nOff);
    // head + beak
    const hx = cx + dir * s * 0.42, hy = cy - s * 0.10;
    wobEllipse(hx, hy, s * 0.18, s * 0.17, 0, 0.18, nOff + 31);
    ctx.beginPath();
    ctx.moveTo(hx + dir * s * 0.15, hy - s * 0.06);
    ctx.lineTo(hx + dir * s * 0.36, hy + s * 0.01);
    ctx.lineTo(hx + dir * s * 0.15, hy + s * 0.08);
    ctx.closePath(); ctx.fill();
    // fanned tail
    for (let ft = -1; ft <= 1; ft++) {
      const ta = ft * 0.28 + dir * 0.1;
      const tx = cx - dir * s * 0.40, ty = cy + s * 0.05;
      const tl = s * 0.55;
      ctx.beginPath();
      ctx.moveTo(tx, ty - s * 0.06);
      ctx.lineTo(tx - dir * Math.cos(ta) * tl, ty + Math.sin(ta) * tl + s * 0.12);
      ctx.lineTo(tx, ty + s * 0.06);
      ctx.closePath(); ctx.fill();
    }
    // wings raised: broad shapes with notched trailing edges
    for (const wside of [1, -1]) {
      const shx = cx + wside * s * 0.02, shy = cy - s * 0.10;
      const wLen = s * R(0.95, 1.1), wWid = s * 0.34;
      const tipX = shx + wside * s * 0.28 + dir * s * 0.10;
      const tipY = shy - wLen;
      ctx.beginPath();
      ctx.moveTo(shx - wside * wWid * 0.4, shy + s * 0.05);
      // leading edge up to tip
      ctx.quadraticCurveTo(shx + wside * s * 0.1, shy - wLen * 0.55, tipX, tipY);
      // trailing edge back down with primary notches
      const notches = 4;
      for (let k = 1; k <= notches; k++) {
        const t = k / notches;
        const nx = tipX + (shx + wside * wWid * 0.55 - tipX) * t;
        const ny = tipY + (shy + s * 0.02 - tipY) * t;
        const nw = (k % 2 ? 1 : 0.82) * (1 - t * 0.35);
        ctx.lineTo(nx + (noise(nOff + k * 17 + wside * 40) - 0.5) * s * 0.06,
                   ny - (1 - nw) * s * 0.10);
      }
      ctx.closePath(); ctx.fill();
    }
    // loose motion strokes trailing below
    ctx.strokeStyle = ink(0.4);
    ctx.lineCap = 'round';
    for (let mI = 0; mI < 4; mI++) {
      const my = cy + s * (0.55 + mI * 0.28);
      const mx = cx - dir * s * R(0.1, 0.5) + R(-20, 20);
      const mLen = s * R(0.5, 0.9);
      ctx.lineWidth = R(2.5, 5);
      ctx.globalAlpha = R(0.25, 0.5);
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.quadraticCurveTo(mx + dir * mLen * 0.5, my + R(-14, 14),
                           mx + dir * mLen, my + R(-22, 22));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // ---- wobbly plate frame ----
  ctx.strokeStyle = 'rgba(70,62,50,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const fr = 64, fw = 40;
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (U - 2 * fr) * t + (noise(t * 9.1) - 0.5) * 5;
    const y = fr + (noise(t * 7.3 + 40) - 0.5) * 5;
    s2 ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr + (noise(t * 8.2 + 80) - 0.5) * 5;
    const y = fr + (U - 2 * fr) * t + (noise(t * 6.1 + 120) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr - (U - 2 * fr) * t + (noise(t * 7.7 + 160) - 0.5) * 5;
    const y = U - fr + (noise(t * 9.4 + 200) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (noise(t * 6.6 + 240) - 0.5) * 5;
    const y = U - fr - (U - 2 * fr) * t + (noise(t * 8.8 + 280) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  // ---- grain ----
  const gr = mulberry32(seed + 5);
  ctx.fillStyle = 'rgba(60,52,40,1)';
  for (let i = 0; i < 5200; i++) {
    ctx.globalAlpha = 0.025 + gr() * 0.06;
    const r = 0.6 + gr() * 1.6;
    ctx.beginPath();
    ctx.arc(gr() * U, gr() * U, r, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- vignette ----
  const v = ctx.createRadialGradient(U / 2, U / 2, U * 0.32, U / 2, U / 2, U * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(40,30,18,0.16)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, U, U);
}

cv.addEventListener('click', () => {
  const s = 1000 + Math.floor(Math.random() * 900000);
  location.search = '?seed=' + s;
});

fit();
draw();
</script>
</body>
</html>
