<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№93 · Tunnel Run</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#141210; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,239,224,0.65); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">press to speed the tunnel</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.93 Tunnel Run: seeded PRNG "Tunnel Run", 24 rounded squares, seamless 6s loop, press speeds to 3x
const N=24;
const trnd=mulberry(hashStr('Tunnel Run'));
let vt=null, lastMs=null, speed=1, pressing=false;
function rr(x,y,s,rad){ const h=s/2; ctx.beginPath(); ctx.moveTo(x-h+rad,y-h); ctx.lineTo(x+h-rad,y-h); ctx.arcTo(x+h,y-h,x+h,y-h+rad,rad); ctx.lineTo(x+h,y+h-rad); ctx.arcTo(x+h,y+h,x+h-rad,y+h,rad); ctx.lineTo(x-h+rad,y+h); ctx.arcTo(x-h,y+h,x-h,y+h-rad,rad); ctx.lineTo(x-h,y-h+rad); ctx.arcTo(x-h,y-h,x-h+rad,y-h,rad); ctx.closePath(); }
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  if(vt===null){ vt=nowMs/1000; lastMs=nowMs; }
  const dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  const target=pressing?3:1; speed+=(target-speed)*Math.min(1,dt*6);
  vt+=dt*speed;
  ctx.fillStyle='#141210'; ctx.fillRect(0,0,w,h);
  const cx=w/2, cy=h/2;
  const diagHalf=Math.hypot(w,h)/2;
  const S=Math.min(w,h);
  let items=[];
  for(let i=0;i<N;i++){ const p=((vt/6)+(i/N))%1; items.push([p,i]); }
  items.sort((a,b)=>a[0]-b[0]);
  for(const [p,i] of items){
    const ease=p*p*p;
    const half=diagHalf*(0.015+0.80*ease);
    if(half<1) continue;
    ctx.strokeStyle=(i%2===0)?'#FF6B4A':'#F5EFE0';
    ctx.lineWidth=Math.max(1, S*(0.002+0.016*ease));
    rr(cx,cy,half*2,half*0.36); ctx.stroke();
  }
  if(N!==24) console.assert(false,'squares',N);
  return {};
}
canvas.addEventListener('pointerdown',()=>{ pressing=true; });
function endP(){ pressing=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP); canvas.addEventListener('pointerleave',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(2500);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
