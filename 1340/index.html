<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad-Speak</title>
<style>
  html, body { margin: 0; padding: 0; background: #F5F2EA; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (verbatim from the prompt)
  var GROUND = '#F5F2EA', RED = '#C0392B', SWOOSH = '#14120F',
      INK = '#1A1A1A', GOLD = '#C9973B', GRAYBAR = '#B9B2A4',
      BRONZE = '#A67B4F', BRONZE_DARK = '#6B4A2E', BRONZE_LIGHT = '#D9B380';

  // Fixed deck, fixed order, never shuffled.
  var DECK = [
    'Love Overrules',
    'Hurt people, hurt people',
    'No matter what',
    'Keep the faith baby',
    'Community is currency',
    'We must accept finite disappointment',
    'Never lose infinite hope',
    'Are we in time or is time within us'
  ];
  var SENTENCE_S = 8; // 1s wipe-in + 6s hold + 1s wipe-out

  // Recorded tap events (pointerup times in piece seconds). Closed-form state.
  var taps = [];
  var booted = false;
  var clockStart = 0; // set on first rAF tick; frame one is always draw(0)

  function viewport() {
    var w, h;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      w = visualViewport.width; h = visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
  }

  function sizeCanvas() {
    var v = viewport();
    canvas.width = v.w; canvas.height = v.h;
    canvas.style.width = v.w + 'px';
    canvas.style.height = v.h + 'px';
    return v;
  }

  // Closed-form sentence state at piece time t, given recorded taps.
  // Each tap advances to the next sentence and restarts the 8s phase.
  function stateAt(t) {
    var s = 0, segStart = 0;
    for (var i = 0; i < taps.length; i++) {
      var tau = taps[i];
      if (tau > t) break;
      s = (s + Math.floor((tau - segStart) / SENTENCE_S) + 1) % DECK.length;
      segStart = tau;
    }
    var p = (t - segStart) % SENTENCE_S;
    s = (s + Math.floor((t - segStart) / SENTENCE_S)) % DECK.length;
    return { sentence: DECK[s], phase: p };
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawFist(cx, cy, s) {
    // Bronze fist holding nothing: palm, four finger bumps, thumb. Flat tones only.
    ctx.fillStyle = BRONZE_DARK;
    rr(cx - s * 0.46, cy - s * 0.30, s * 0.92, s * 0.78, s * 0.16);
    ctx.fill();
    ctx.fillStyle = BRONZE;
    rr(cx - s * 0.42, cy - s * 0.26, s * 0.84, s * 0.70, s * 0.14);
    ctx.fill();
    // Fingers: four vertical bumps above the palm.
    for (var i = 0; i < 4; i++) {
      var fx = cx - s * 0.38 + i * s * 0.20;
      ctx.fillStyle = BRONZE;
      rr(fx, cy - s * 0.52, s * 0.17, s * 0.34, s * 0.08);
      ctx.fill();
      ctx.fillStyle = BRONZE_LIGHT;
      rr(fx + s * 0.02, cy - s * 0.50, s * 0.13, s * 0.10, s * 0.05);
      ctx.fill();
    }
    // Thumb across the palm.
    ctx.fillStyle = BRONZE;
    rr(cx - s * 0.48, cy + s * 0.02, s * 0.42, s * 0.20, s * 0.10);
    ctx.fill();
    ctx.fillStyle = BRONZE_LIGHT;
    rr(cx - s * 0.44, cy + s * 0.04, s * 0.16, s * 0.08, s * 0.04);
    ctx.fill();
    // Knuckle shading.
    ctx.fillStyle = BRONZE_DARK;
    ctx.fillRect(cx - s * 0.38, cy - s * 0.20, s * 0.76, s * 0.03);
  }

  function draw(t) {
    var v = { w: canvas.width, h: canvas.height };
    var W = v.w, H = v.h;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Billboard: centered, generous margins, same proportions at any size.
    var bx = W * 0.06, by = H * 0.07, bw = W * 0.88, bh = H * 0.86;
    ctx.fillStyle = GROUND;
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(2, bh * 0.004);
    ctx.strokeRect(bx, by, bw, bh);

    // Headline zone (top). Frame one: VOID.
    var hx = bx + bw * 0.05, hy = by + bh * 0.05, hw = bw * 0.90, hh = bh * 0.20;
    var st = stateAt(t);
    var p = st.phase;
    // Clear the zone to ground, then paint the revealed portion.
    ctx.fillStyle = GROUND;
    ctx.fillRect(hx, hy, hw, hh);
    var reveal = null; // [x0, x1] of visible text, null = none
    var barX = null;
    if (p >= 1 && p < 7) {
      reveal = [hx, hx + hw];
    } else if (p < 1) {
      var f = p / 1;
      barX = hx + hw * f;
      reveal = [hx, barX];
    } else {
      var g = (p - 7) / 1;
      barX = hx + hw * g;
      reveal = [barX, hx + hw];
    }
    if (reveal && reveal[1] > reveal[0]) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(reveal[0], hy, reveal[1] - reveal[0], hh);
      ctx.clip();
      // Fit the sentence to the zone width.
      var size = hh * 0.52;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var fontFor = function (s) {
        return '800 ' + s + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
      };
      ctx.font = fontFor(size);
      try { ctx.letterSpacing = '2px'; } catch (e) {}
      while (size > 10 && ctx.measureText(st.sentence).width > hw * 0.96) {
        size -= 1;
        ctx.font = fontFor(size);
      }
      ctx.fillStyle = INK;
      ctx.fillText(st.sentence, hx + hw / 2, hy + hh / 2);
      ctx.restore();
    }
    if (barX !== null) {
      ctx.fillStyle = RED;
      ctx.fillRect(barX - bw * 0.008, hy, bw * 0.016, hh);
    }

    // Brand-red rule under the headline zone.
    ctx.fillStyle = RED;
    ctx.fillRect(bx + bw * 0.05, hy + hh + bh * 0.02, bw * 0.90, Math.max(2, bh * 0.006));

    // Body copy as gray bars, left column.
    var barW = bw * 0.32, barH = Math.max(3, bh * 0.018), gap = bh * 0.028;
    var barX0 = bx + bw * 0.08, barY0 = by + bh * 0.42;
    ctx.fillStyle = GRAYBAR;
    for (var i = 0; i < 5; i++) {
      var wdt = barW * (i === 4 ? 0.62 : 1);
      ctx.fillRect(barX0, barY0 + i * (barH + gap), wdt, barH);
    }

    // Swoosh-like generic curve, drawn once, never changes.
    ctx.strokeStyle = SWOOSH;
    ctx.lineWidth = Math.max(3, bh * 0.018);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx + bw * 0.06, by + bh * 0.66);
    ctx.bezierCurveTo(
      bx + bw * 0.30, by + bh * 0.52,
      bx + bw * 0.62, by + bh * 0.72,
      bx + bw * 0.94, by + bh * 0.46
    );
    ctx.stroke();

    // Hero: bronze fist holding nothing, right third.
    drawFist(bx + bw * 0.68, by + bh * 0.55, Math.min(bw, bh) * 0.30);

    // Logo plate, bottom-right: gold plate, blank disc.
    var px = bx + bw * 0.80, py = by + bh * 0.84, pw = bw * 0.13, ph = bh * 0.10;
    ctx.fillStyle = GOLD;
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = GROUND;
    ctx.beginPath();
    ctx.moveTo(px + pw / 2 + Math.min(pw, ph) * 0.28, py + ph / 2);
    ctx.arc(px + pw / 2, py + ph / 2, Math.min(pw, ph) * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }

  function nowT() {
    if (!booted) return 0;
    return (performance.now() - clockStart) / 1000;
  }

  function loop(now) {
    if (!booted) {
      booted = true;
      clockStart = now;
    }
    draw((now - clockStart) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }

  // Pointer: tap (small movement) advances to the next sentence.
  var downPos = null;
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      downPos = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener('pointerup', function (e) {
      if (!downPos) return;
      var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
      downPos = null;
      if (Math.sqrt(dx * dx + dy * dy) < 12) {
        taps.push(nowT());
        draw(nowT());
      }
    });
  }

  function onResize() {
    sizeCanvas();
    draw(nowT());
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', onResize);
    if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
      visualViewport.addEventListener('resize', onResize);
    }
  }

  sizeCanvas();
  draw(0); // frame one: billboard complete, headline VOID
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
