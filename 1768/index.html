<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Threshold</title>
<style>
html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#000000';
var LIGHT = '#8fae97'; /* the one grey-green light */
var PLATE_INK = '#6d7f72'; /* dim grey-green for plates */
var FRAME_T = 60.0; /* fixed phase: one ring mid-flight at frame one */
var POINT_U = 0.53; /* slightly off-center */
var POINT_V = 0.47;
var RING_LIFE = 30.0; /* seconds until a ring has fully decayed */
var RING_RMAX = 0.38; /* ring radius at full life, in field-min units; fades before mid-screen */
var GRAIN_N = 6000;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1768);
var phaseT = FRAME_T;
var simT = 0;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
/* seeded grain: fixed positions and alphas, never per-frame random */
var GRAIN = [];
(function () {
  var i;
  for (i = 0; i < GRAIN_N; i++) {
    GRAIN.push({ u: rng(), v: rng(), a: 0.015 + rng() * 0.045 });
  }
})();
/* ring birth schedule: first ring at 48 s, then drifting gaps of 150 to 270 s.
   Generated once from the fixed seed, so the schedule is a pure function of piece time. */
var RING_BIRTHS = [48];
(function () {
  var t = 48, i;
  for (i = 0; i < 24; i++) {
    t += 150 + rng() * 120;
    RING_BIRTHS.push(t);
  }
})();
var rings = []; /* { born: simT } */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
function fx(u) { return F.x + u * F.w; }
function fy(v) { return F.y + v * F.h; }
/* slow irregular breath, closed form: two incommensurate periods, phase-modulated.
   Returns 0..1; intensity never exceeds its authored ceiling. */
function breath(t) {
  var s = Math.sin(TAU * t / 23 + 0.9 * Math.sin(TAU * t / 47 + 0.6) + 1.811);
  return 0.5 + 0.5 * s;
}
function stepSim(dt) {
  simT += dt;
  var i;
  for (i = 0; i < RING_BIRTHS.length; i++) {
    if (RING_BIRTHS[i] > simT - dt && RING_BIRTHS[i] <= simT) {
      rings.push({ born: RING_BIRTHS[i] });
    }
  }
  for (i = rings.length - 1; i >= 0; i--) {
    if (simT - rings[i].born > RING_LIFE) rings.splice(i, 1);
  }
}
function drawGrain() {
  var i, g;
  for (i = 0; i < GRAIN.length; i++) {
    g = GRAIN[i];
    ctx.fillStyle = rgba(LIGHT, g.a);
    ctx.fillRect(fx(g.u), fy(g.v), 1, 1);
  }
}
function drawPoint() {
  var px = fx(POINT_U), py = fy(POINT_V);
  var inten = 0.55 + 0.45 * breath(phaseT); /* 0.55..1.00, never brighter than authored */
  var r0 = Math.max(3, Math.min(F.w, F.h) * 0.006);
  /* radial falloff as concentric low-alpha bands, never a gradient object */
  var bands = [
    { r: 1.00, a: 0.030 },
    { r: 0.80, a: 0.055 },
    { r: 0.62, a: 0.090 },
    { r: 0.46, a: 0.140 },
    { r: 0.32, a: 0.210 },
    { r: 0.20, a: 0.300 }
  ];
  var i, b;
  for (i = 0; i < bands.length; i++) {
    b = bands[i];
    ctx.beginPath();
    ctx.moveTo(px + r0 * b.r, py);
    ctx.arc(px, py, r0 * b.r, 0, TAU);
    ctx.fillStyle = rgba(LIGHT, b.a * inten);
    ctx.fill();
  }
  /* core: one small dot, paired arc, still faint */
  ctx.beginPath();
  ctx.moveTo(px + r0 * 0.12, py);
  ctx.arc(px, py, r0 * 0.12, 0, TAU);
  ctx.fillStyle = rgba(LIGHT, 0.3800 * inten);
  ctx.fill();
}
function drawRings() {
  var i, r, age, rad, fade, alpha;
  var m = Math.min(F.w, F.h);
  var px = fx(POINT_U), py = fy(POINT_V);
  for (i = 0; i < rings.length; i++) {
    r = rings[i];
    age = simT - r.born;
    if (age <= 0 || age >= RING_LIFE) continue;
    rad = (age / RING_LIFE) * RING_RMAX * m;
    fade = 1 - age / RING_LIFE;
    alpha = 0.16 * Math.pow(fade, 1.6);
    ctx.beginPath();
    ctx.moveTo(px + rad, py);
    ctx.arc(px, py, rad, 0, TAU);
    ctx.strokeStyle = rgba(LIGHT, alpha);
    ctx.lineWidth = Math.max(1, 1 + 2 * fade);
    ctx.stroke();
    /* faint outer echo band, one breath behind */
    ctx.beginPath();
    ctx.moveTo(px + rad * 1.06, py);
    ctx.arc(px, py, rad * 1.06, 0, TAU);
    ctx.strokeStyle = rgba(LIGHT, alpha * 0.35);
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 18;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Threshold').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  /* plates are text only, very dim, so they never fight the near-black field */
  ctx.fillStyle = rgba(PLATE_INK, 0.4200);
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Threshold', 14, 12);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(PLATE_INK, 0.3400);
  ctx.fillText('2006 · 11 · 14', 14, 12 + titlePx + 4);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(PLATE_INK, 0.3000);
  ctx.fillText('Watch only.', 14, VH - smallPx - 12);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawGrain();
  drawRings();
  drawPoint();
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    breath: breath,
    breathAt60: function () { return +breath(60).toFixed(4); },
    ringBirths: function () { return RING_BIRTHS.slice(0, 6); },
    ringsAlive: function () { return rings.length; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60 s, sim pre-run 0 to 60 s in 1/30 s steps ---- */
size();
/* pre-run the simulation so frame one holds one ring mid-flight */
(function () {
  var steps = Math.round(FRAME_T * 30);
  var s;
  for (s = 0; s < steps; s++) stepSim(1 / 30);
  phaseT = FRAME_T;
})();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0, acc = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      acc += dt;
      while (acc >= 1 / 30) { stepSim(1 / 30); acc -= 1 / 30; }
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
