<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sound Sculpture — №1098</title>
<style>
  html, body { margin: 0; padding: 0; background: #030305; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
/* №1098 "Sound Sculpture" — onformative OF3 (unnamed soundsculpture, 2012, with Daniel Franke).
   A dancer drawn only as a point cloud. Points only: no skeleton lines, no mesh.
   Everything is a closed-form function of t and the active seed variant.
   TAP reseeds: camera radius, pose order and point density shift; the dancer stays. */

var canvas = document.getElementById('stage');
var ctx = canvas.getContext('2d');

var GROUND = '#030305';
var LOOP = 60;          /* seconds */
var PHASE0 = 24;        /* fixed first-frame phase: mid-pose, three-quarter camera */
var BASE_POINTS = 2600; /* max point pool; variant density trims how many are drawn */

/* ---------------- seeded rng ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function smooth(x) { return x * x * (3 - 2 * x); }
function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

/* ---------------- skeleton data (endpoints only; never drawn) ----------------
   Body space: y up, metres. Pelvis at y = 1.02. Rotations in degrees.
   chain: pelvis -> spine -> chest -> neck -> head
          chest -> shoulder -> elbow -> wrist   (x2)
          pelvis -> hip -> knee -> ankle       (x2)
   rx = pitch, ry = yaw, rz = roll, applied parent-first (yaw, pitch, roll). */
var BONES = {
  spine: 0.16, chest: 0.24, neck: 0.10, headR: 0.115,
  upperArm: 0.30, foreArm: 0.28, thigh: 0.44, shin: 0.44,
  shoulderW: 0.21, hipW: 0.10
};
/* Pose fields:
   rootY rootLean(root pitch) rootYaw rootRoll
   spine:[rx,ry,rz] chest:[rx,ry,rz] neck:[rx,ry,rz] head:[rx,ry,rz]
   aL/aR: [shoulder rx,ry,rz]  eL/eR: elbow rx
   lL/lR: [hip rx,ry,rz]       kL/kR: knee rx (positive = bend back) */
var POSES = [
  { name: 'reach',    rootY: 1.02, rootLean: -4, rootYaw: 0,   rootRoll: 0,
    spine: [-6, 0, 0],  chest: [-8, 10, 0],  neck: [-4, -8, 0], head: [-6, 0, 0],
    aL: [-148, 0, 42],  eL: -18, aR: [-25, 0, 35],  eR: -55,
    lL: [-12, 0, -4],   kL: 8,   lR: [10, 0, 5],    kR: 14 },
  { name: 'arabesque', rootY: 1.06, rootLean: 14, rootYaw: 18, rootRoll: 0,
    spine: [10, 8, 0],  chest: [8, 6, -4],   neck: [-8, -6, 0], head: [-8, 0, 4],
    aL: [-95, 0, -55],  eL: -10, aR: [-95, 0, 55],  eR: -10,
    lL: [-6, 0, -3],    kL: 4,   lR: [82, 0, 6],    kR: 6 },
  { name: 'crouch',   rootY: 0.72, rootLean: 26, rootYaw: -12, rootRoll: 0,
    spine: [18, -6, 0], chest: [14, -4, 4],  neck: [-12, 6, 0], head: [-14, 0, 0],
    aL: [-70, 0, -30],  eL: -95, aR: [-60, 0, 40],  eR: -80,
    lL: [-95, 0, -8],   kL: 105, lR: [-88, 0, 10],  kR: 98 },
  { name: 'extension', rootY: 1.10, rootLean: -10, rootYaw: 0, rootRoll: -4,
    spine: [-10, 0, -2], chest: [-12, 0, -4], neck: [-8, 0, -4], head: [-12, 0, -4],
    aL: [-165, 0, 30],  eL: -6,  aR: [-165, 0, 30], eR: -6,
    lL: [-14, 0, -5],   kL: 6,   lR: [16, 0, 7],    kR: 10 },
  { name: 'spiral',   rootY: 1.00, rootLean: 6, rootYaw: 42, rootRoll: 0,
    spine: [4, 26, 0],  chest: [2, 30, 0],   neck: [-2, -20, 0], head: [0, -14, 0],
    aL: [-120, 0, -70], eL: -30, aR: [-30, 0, 95],  eR: -70,
    lL: [-20, 0, -6],   kL: 26,  lR: [24, 0, 8],    kR: 34 },
  { name: 'leap',     rootY: 1.28, rootLean: -14, rootYaw: 8, rootRoll: 0,
    spine: [-10, 4, 0], chest: [-10, 2, 0],  neck: [-6, -2, 0], head: [-8, 0, 0],
    aL: [-140, 0, -45], eL: -22, aR: [-105, 0, 60], eR: -12,
    lL: [-52, 0, -6],   kL: 30,  lR: [44, 0, 8],    kR: 55 },
  { name: 'floor',    rootY: 0.46, rootLean: 58, rootYaw: -20, rootRoll: 6,
    spine: [30, -10, 2], chest: [22, -8, 4],  neck: [-16, 8, 0], head: [-18, 0, 0],
    aL: [-155, 0, -35], eL: -14, aR: [-40, 0, 55],  eR: -95,
    lL: [-105, 0, -10], kL: 60,  lR: [30, 0, 14],   kR: 120 },
  { name: 'bow',      rootY: 0.94, rootLean: 34, rootYaw: 0, rootRoll: 0,
    spine: [22, 0, 0], chest: [20, 0, 0],   neck: [8, 0, 0],   head: [16, 0, 0],
    aL: [30, 0, -18],   eL: -12, aR: [30, 0, 18],   eR: -12,
    lL: [-8, 0, -4],    kL: 5,   lR: [8, 0, 4],     kR: 5 }
];
var NSEG = 10;             /* seconds per pose slot */
var HOLD = [0.32, 0.68];   /* within a slot: ease in, hold, ease out */

/* ---------------- variants (seeded compositions) ---------------- */
function makeVariant(seed) {
  var rnd = mulberry32(seed);
  var order = [0, 1, 2, 3, 4, 5, 6, 7];
  var i, j, tmp;
  for (i = order.length - 1; i > 0; i--) { j = (rnd() * (i + 1)) | 0; tmp = order[i]; order[i] = order[j]; order[j] = tmp; }
  return {
    order: order,
    camR: 3.1 + rnd() * 0.9,          /* 3.1 .. 4.0 m */
    density: 0.62 + rnd() * 0.38,     /* fraction of the pool drawn */
    phase: rnd() * Math.PI * 2        /* sampling-cloud phase */
  };
}
var variants = [makeVariant(7101), makeVariant(4242), makeVariant(90210)];

/* tap events: recorded absolute times (piece-clock seconds) */
var taps = [];
function activeVariantAt(t) {
  /* unattended: variant advances every 20 s; taps add to the index.
     changes blend over 1 s so the camera never jumps. */
  var base = Math.floor(t / 20);
  var extra = 0, i;
  for (i = 0; i < taps.length; i++) if (taps[i] <= t) extra++;
  var idx = base + extra;
  var boundary = (Math.floor(t / 20) + 1) * 20; /* next auto boundary */
  var lastChange = -1e9;
  /* most recent change time <= t (auto boundary or tap) */
  var cand = Math.floor(t / 20) * 20;
  if (cand <= t && cand > lastChange) lastChange = cand;
  for (i = 0; i < taps.length; i++) if (taps[i] <= t && taps[i] > lastChange) lastChange = taps[i];
  var blend = clamp01((t - lastChange) / 1.0);
  blend = smooth(blend);
  return { idx: idx, prev: idx - 1, blend: blend, boundary: boundary };
}
function variantParams(idx) {
  var k = ((idx % variants.length) + variants.length) % variants.length;
  /* extend deterministically if taps run past the seeded trio */
  while (variants.length <= k) variants.push(makeVariant(1000 + variants.length * 7919));
  return variants[k];
}
function mixVariant(t) {
  var a = activeVariantAt(t);
  var va = variantParams(a.idx), vb = variantParams(a.prev);
  if (a.blend >= 1 || a.idx === a.prev) return va;
  /* order is discrete: crossfade handled by blending camera + density only;
     pose order swaps at blend midpoint via the pose sampler's own mix. */
  return {
    orderA: vb.order, orderB: va.order, mix: a.blend,
    camR: vb.camR + (va.camR - vb.camR) * a.blend,
    density: vb.density + (va.density - vb.density) * a.blend,
    phase: va.phase
  };
}

/* ---------------- pose sampling ---------------- */
function poseAt(order, t) {
  var slot = Math.floor(t / NSEG) % 8;
  var f = (t - Math.floor(t / NSEG) * NSEG) / NSEG;
  var cur = POSES[order[slot]];
  var nxt = POSES[order[(slot + 1) % 8]];
  var m;
  if (f < HOLD[0]) m = 0;
  else if (f > HOLD[1]) m = smooth((f - HOLD[1]) / (1 - HOLD[1]));
  else m = 0;
  /* ease also at slot start from previous pose */
  var prv = POSES[order[(slot + 7) % 8]];
  var out = {}, k;
  if (f < HOLD[0]) {
    var e = smooth(f / HOLD[0]);
    for (k in cur) out[k] = mixVal(prv[k], cur[k], e);
    return out;
  }
  if (m > 0) { for (k in cur) out[k] = mixVal(cur[k], nxt[k], m); return out; }
  return cur;
}
function mixVal(a, b, e) {
  if (typeof a === 'number') return a + (b - a) * e;
  if (Array.isArray(a)) { var r = []; for (var i = 0; i < a.length; i++) r.push(a[i] + (b[i] - a[i]) * e); return r; }
  return b;
}
function currentPose(t, vp) {
  if (vp.orderA) {
    var pa = poseAt(vp.orderA, t), pb = poseAt(vp.orderB, t), out = {}, k;
    for (k in pb) out[k] = mixVal(pa[k], pb[k], vp.mix);
    return out;
  }
  return poseAt(vp.order, t);
}

/* ---------------- forward kinematics ---------------- */
function rot(v, rx, ry, rz) {
  var x = v[0], y = v[1], z = v[2], c, s, t;
  c = Math.cos(ry); s = Math.sin(ry); t = x * c + z * s; z = -x * s + z * c; x = t;      /* yaw */
  c = Math.cos(rx); s = Math.sin(rx); t = y * c - z * s; z = y * s + z * c; y = t;      /* pitch */
  c = Math.cos(rz); s = Math.sin(rz); t = x * c - y * s; y = x * s + y * c; x = t;      /* roll */
  return [x, y, z];
}
function D(a) { return a * Math.PI / 180; }
function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function mul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }

function joints(p) {
  var J = {};
  var pelvis = [0, p.rootY, 0];
  var lean = [D(p.rootLean), D(p.rootYaw), D(p.rootRoll)];
  function seg(from, dir, len, e) { return add(from, mul(rot(dir, D(e[0]), D(e[1]), D(e[2])), len)); }
  J.pelvis = pelvis;
  J.spineT = seg(pelvis, [0, 1, 0], BONES.spine, [p.spine[0] + p.rootLean, p.spine[1] + p.rootYaw, p.spine[2] + p.rootRoll]);
  /* accumulate torso angles */
  var sp = [p.spine[0] + p.rootLean, p.spine[1] + p.rootYaw, p.spine[2] + p.rootRoll];
  var ch = [sp[0] + p.chest[0], sp[1] + p.chest[1], sp[2] + p.chest[2]];
  var nk = [ch[0] + p.neck[0], ch[1] + p.neck[1], ch[2] + p.neck[2]];
  var hd = [nk[0] + p.head[0], nk[1] + p.head[1], nk[2] + p.head[2]];
  J.chest = add(J.spineT, mul(rot([0, 1, 0], D(ch[0]), D(ch[1]), D(ch[2])), BONES.chest));
  J.neck = add(J.chest, mul(rot([0, 1, 0], D(nk[0]), D(nk[1]), D(nk[2])), BONES.neck));
  J.head = add(J.neck, mul(rot([0, 1, 0], D(hd[0]), D(hd[1]), D(hd[2])), BONES.headR * 0.6));
  J.headTop = add(J.neck, mul(rot([0, 1, 0], D(hd[0]), D(hd[1]), D(hd[2])), BONES.headR * 1.9));
  var side = rot([1, 0, 0], D(ch[0]), D(ch[1]), D(ch[2]));
  J.shL = add(J.chest, mul(side, -BONES.shoulderW));
  J.shR = add(J.chest, mul(side, BONES.shoulderW));
  function arm(sh, a, e, sgn) {
    var dir = rot([sgn, 0, 0], D(a[0]), D(a[1]), D(a[2]));
    /* hang reference: rotate the side-pointing arm by shoulder pitch about z-ish axis:
       shoulder rx pitches the arm forward/back in body space: blend side dir toward down */
    var down = rot([0, -1, 0], D(ch[0]), D(ch[1]), D(ch[2]));
    var fwd = rot([0, 0, 1], D(ch[0]), D(ch[1]), D(ch[2]));
    /* compose: arm dir = down rotated by (rx about side axis) then rz spreads sideways */
    var pitch = D(a[0]);
    var d1 = add(mul(down, Math.cos(pitch)), mul(fwd, Math.sin(pitch)));
    var spread = D(a[2]);
    var d2 = add(mul(d1, Math.cos(spread)), mul(side, sgn * Math.sin(spread)));
    var el = add(sh, mul(d2, BONES.upperArm));
    var bend = D(e);
    var d3 = add(mul(d2, Math.cos(bend)), mul(fwd, -Math.sin(bend) * 0.9 + 0.0));
    d3 = add(d3, mul(fwd, Math.sin(bend) * 0.0));
    var wr = add(el, mul(norm(d3), BONES.foreArm));
    return [el, wr];
  }
  function norm(v) { var l = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  var aL = arm(J.shL, p.aL, p.eL, -1), aR = arm(J.shR, p.aR, p.eR, 1);
  J.elL = aL[0]; J.wrL = aL[1]; J.elR = aR[0]; J.wrR = aR[1];
  var hipSide = rot([1, 0, 0], D(p.rootLean), D(p.rootYaw), D(p.rootRoll));
  J.hipL = add(pelvis, mul(hipSide, -BONES.hipW));
  J.hipR = add(pelvis, mul(hipSide, BONES.hipW));
  function leg(hip, l, k, sgn) {
    var down = rot([0, -1, 0], D(p.rootLean), D(p.rootYaw), D(p.rootRoll));
    var fwd = rot([0, 0, 1], D(p.rootLean), D(p.rootYaw), D(p.rootRoll));
    var side = rot([1, 0, 0], D(p.rootLean), D(p.rootYaw), D(p.rootRoll));
    var pitch = D(l[0]);
    var d1 = add(mul(down, Math.cos(pitch)), mul(fwd, Math.sin(pitch)));
    var d2 = add(mul(d1, Math.cos(D(l[2]))), mul(side, sgn * Math.sin(D(l[2]))));
    var kn = add(hip, mul(d2, BONES.thigh));
    var bend = D(k);
    var d3 = add(mul(d2, Math.cos(bend)), mul(fwd, -Math.sin(bend)));
    var an = add(kn, mul(norm(d3), BONES.shin));
    return [kn, an];
  }
  var lL = leg(J.hipL, p.lL, p.kL, -1), lR = leg(J.hipR, p.lR, p.kR, 1);
  J.knL = lL[0]; J.anL = lL[1]; J.knR = lR[0]; J.anR = lR[1];
  return J;
}

/* ---------------- point cloud sampling ----------------
   Segments with sampling weights (share of pool) and tube radii. */
var SEGMENTS = [
  ['pelvis', 'spineT', 0.10, 0.085], ['spineT', 'chest', 0.13, 0.095],
  ['chest', 'neck', 0.07, 0.075], ['neck', 'head', 0.03, 0.05],
  ['shL', 'elL', 0.075, 0.045], ['elL', 'wrL', 0.07, 0.038],
  ['shR', 'elR', 0.075, 0.045], ['elR', 'wrR', 0.07, 0.038],
  ['hipL', 'knL', 0.10, 0.065], ['knL', 'anL', 0.095, 0.048],
  ['hipR', 'knR', 0.10, 0.065], ['knR', 'anR', 0.095, 0.048]
];
var JOINTS_BLOBS = [
  ['head', 0.09, 0.105], ['neck', 0.02, 0.05], ['chest', 0.05, 0.10], ['pelvis', 0.04, 0.09],
  ['shL', 0.015, 0.05], ['shR', 0.015, 0.05], ['elL', 0.012, 0.04], ['elR', 0.012, 0.04],
  ['wrL', 0.012, 0.032], ['wrR', 0.012, 0.032],
  ['hipL', 0.012, 0.05], ['hipR', 0.012, 0.05], ['knL', 0.012, 0.045], ['knR', 0.012, 0.045],
  ['anL', 0.012, 0.032], ['anR', 0.012, 0.032]
];
var samples = [];
(function buildSamples() {
  var rnd = mulberry32(26001);
  /* allocate counts by weight */
  var totalW = 0, i, j;
  for (i = 0; i < SEGMENTS.length; i++) totalW += SEGMENTS[i][2];
  for (i = 0; i < JOINTS_BLOBS.length; i++) totalW += JOINTS_BLOBS[i][1];
  var idx = 0;
  function pushSample(kind, a, b, u, r1, r2) {
    samples.push({ kind: kind, a: a, b: b, u: u, th: r1 * Math.PI * 2, rr: Math.sqrt(r2) });
  }
  for (i = 0; i < SEGMENTS.length; i++) {
    var n = Math.round(BASE_POINTS * SEGMENTS[i][2] / totalW);
    for (j = 0; j < n && idx < BASE_POINTS; j++, idx++)
      pushSample(0, SEGMENTS[i][0], SEGMENTS[i][1], rnd(), rnd(), rnd());
  }
  for (i = 0; i < JOINTS_BLOBS.length; i++) {
    var m = Math.round(BASE_POINTS * JOINTS_BLOBS[i][1] / totalW);
    for (j = 0; j < m && idx < BASE_POINTS; j++, idx++)
      pushSample(1, JOINTS_BLOBS[i][0], JOINTS_BLOBS[i][2], rnd(), rnd(), rnd());
  }
  while (samples.length < BASE_POINTS)
    pushSample(0, 'spineT', 'chest', rnd(), rnd(), rnd());
  /* seeded shuffle so density trims thin the whole body evenly */
  var sh = mulberry32(777);
  for (i = samples.length - 1; i > 0; i--) { j = (sh() * (i + 1)) | 0; var t = samples[i]; samples[i] = samples[j]; samples[j] = t; }
})();

function samplePoint(s, J, phase) {
  if (s.kind === 1) {
    var c = J[s.a], R = s.b;
    var th = s.th + phase * 0.3, ph = s.u * Math.PI;
    var rr = R * s.rr;
    return [c[0] + rr * Math.sin(ph) * Math.cos(th),
            c[1] + rr * Math.cos(ph),
            c[2] + rr * Math.sin(ph) * Math.sin(th)];
  }
  var A = J[s.a], B = J[s.b], u = s.u;
  var px = A[0] + (B[0] - A[0]) * u, py = A[1] + (B[1] - A[1]) * u, pz = A[2] + (B[2] - A[2]) * u;
  /* tube radius: find segment radius by name match */
  var rad = 0.05;
  for (var i = 0; i < SEGMENTS.length; i++)
    if (SEGMENTS[i][0] === s.a && SEGMENTS[i][1] === s.b) { rad = SEGMENTS[i][3]; break; }
  /* perpendicular frame from segment direction */
  var dx = B[0] - A[0], dy = B[1] - A[1], dz = B[2] - A[2];
  var dl = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1; dx /= dl; dy /= dl; dz /= dl;
  var ax = Math.abs(dy) < 0.9 ? 0 : 1, ay = Math.abs(dy) < 0.9 ? 1 : 0, az = 0;
  var ux = dy * az - dz * ay, uy = dz * ax - dx * az, uz = dx * ay - dy * ax;
  var ul = Math.sqrt(ux * ux + uy * uy + uz * uz) || 1; ux /= ul; uy /= ul; uz /= ul;
  var vx = dy * uz - dz * uy, vy = dz * ux - dx * uz, vz = dx * uy - dy * ux;
  var taper = 0.75 + 0.25 * Math.sin(u * Math.PI);
  var r = rad * taper * (0.35 + 0.65 * s.rr);
  var th2 = s.th + phase;
  var ox = (ux * Math.cos(th2) + vx * Math.sin(th2)) * r;
  var oy = (uy * Math.cos(th2) + vy * Math.sin(th2)) * r;
  var oz = (uz * Math.cos(th2) + vz * Math.sin(th2)) * r;
  return [px + ox, py + oy, pz + oz];
}

/* ---------------- layout / viewport ---------------- */
var viewW = 0, viewH = 0, isPhone = false;
function resize() {
  var vv = window.visualViewport;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  var sw = window.screen ? window.screen.width : viewW;
  var sh = window.screen ? window.screen.height : viewH;
  isPhone = Math.min(sw, sh) < 700 || viewH > viewW * 1.15;
  var dpr = window.devicePixelRatio || 1;
  if (isPhone) dpr = Math.min(dpr, 2);
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
if (window.visualViewport && window.visualViewport.addEventListener)
  window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);
resize();

/* ---------------- draw ---------------- */
function draw(t) {
  var w = viewW, h = viewH;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  var vp = mixVariant(t);
  var pose = currentPose(t, vp);
  var J = joints(pose);
  var camR = vp.camR || 3.4;
  var density = vp.density || 0.8;
  var phase = vp.phase || 0;

  /* camera: one slow full orbit per 60 s loop, gentle height breathing */
  var yaw = (t / LOOP) * Math.PI * 2 + 0.7;
  var camH = 1.25 + 0.18 * Math.sin(t / LOOP * Math.PI * 2 * 2);
  var targetY = 1.02;
  var sideLen = Math.min(w, h);
  var focal = sideLen * 1.55; /* perspective scale: figure reads full-height */
  var cy = h / 2 + sideLen * 0.02, cx = w / 2;

  var count = Math.floor(BASE_POINTS * density);
  var sy = Math.sin(yaw), cyw = Math.cos(yaw);
  var nearZ = 1e9, farZ = -1e9, i, p, rel, d;
  var proj = [];
  for (i = 0; i < count; i++) {
    p = samplePoint(samples[i], J, phase);
    rel = [p[0], p[1] - targetY, p[2]];
    /* orbit: rotate around Y */
    var rx = rel[0] * cyw - rel[2] * sy;
    var rz = rel[0] * sy + rel[2] * cyw;
    d = camR - rz; /* distance in front of camera */
    if (d < 0.4) d = 0.4;
    var scale = focal / d;
    var sx = cx + rx * scale;
    var sy2 = cy - (p[1] - camH) * scale;
    proj.push([sx, sy2, d]);
    if (d < nearZ) nearZ = d;
    if (d > farZ) farZ = d;
  }
  var zRange = (farZ - nearZ) || 1;
  for (i = 0; i < proj.length; i++) {
    var q = proj[i];
    if (q[0] < -4 || q[0] > w + 4 || q[1] < -4 || q[1] > h + 4) continue;
    var zn = (q[2] - nearZ) / zRange;      /* 0 near, 1 far */
    var alpha = 0.95 - zn * 0.62;
    var size = zn < 0.45 ? 2 : 1.5;
    if (sideLen < 500) size = zn < 0.45 ? 1.8 : 1.3;
    if (zn < 0.5) {
      ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
    } else {
      var a2 = alpha * 0.9;
      ctx.fillStyle = 'rgba(191,216,230,' + a2.toFixed(3) + ')';
    }
    ctx.fillRect(q[0] - size / 2, q[1] - size / 2, size, size);
  }
}

/* ---------------- interaction: tap = reseed ---------------- */
var startTime = null;
function pieceTime() {
  if (startTime === null) return PHASE0;
  return PHASE0 + (Date.now() - startTime) / 1000;
}
canvas.addEventListener('pointerdown', function () { taps.push(pieceTime()); });
canvas.addEventListener('touchstart', function () { taps.push(pieceTime()); });

/* first frame: synchronous, fixed phase */
draw(PHASE0);
if (typeof requestAnimationFrame === 'function') {
  startTime = Date.now();
  var loopFn = function () { draw(pieceTime()); requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
</script>
</body>
