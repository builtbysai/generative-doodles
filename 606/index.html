<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strip Book</title>
<style>
  html, body { margin: 0; padding: 0; background: #F5F0E6; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var PAPER = '#F5F0E6';
  var SAGE = '#A8B89A';
  var PEACH = '#E8C4A8';
  var INK = '#1A1A1A';
  var NAVY = '#2B4A6F';
  var CREAM = '#F5F0E6';
  var ORANGE = '#E09A5A';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded RNG (mulberry32), fixed seed: the whole session is reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(606073);

  // ---- Precomputed scene data (normalized book coordinates) ----
  var stars = [];        // night perforated stars, paper colored
  for (var i = 0; i < 95; i++) stars.push({ u: rng(), v: rng(), r: 0.6 + rng() * 1.5 });
  var sparks = [];       // night orange stars
  for (i = 0; i < 9; i++) sparks.push({ u: 0.04 + rng() * 0.92, v: 0.03 + rng() * 0.6, r: 5 + rng() * 5 });
  var ferns = [          // day, strip 2
    { u: 0.10, h: 0.150, lean: -0.010 },
    { u: 0.47, h: 0.168, lean: 0.012 },
    { u: 0.84, h: 0.142, lean: -0.014 }
  ];
  var hangPods = [       // day, strip 2
    { u: 0.28, drop: 0.052 },
    { u: 0.63, drop: 0.066 },
    { u: 0.71, drop: 0.044 }
  ];
  var tuftU = [0.06, 0.20, 0.55, 0.76, 0.93];
  var speckles = [];     // faint paper grain over the whole page
  for (i = 0; i < 140; i++) speckles.push({ u: rng(), v: rng(), r: 0.5 + rng() * 0.9 });

  // ---- State ----
  var flipped = [false, false, false, false, false]; // false = day, true = night
  var anims = [null, null, null, null, null];        // { start } per strip
  var FLIP_MS = 460;                                  // stepped flick duration
  var currentT = 0;

  // ---- Viewport / layout ----
  var vw = 0, vh = 0, dpr = 1;
  var bx = 0, by = 0, bw = 0, bh = 0;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || vw;
    var sh = (window.screen && window.screen.height) || vh;
    if (Math.min(sw, sh) < 700) return true;
    return vh > vw * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    vw = vv ? vv.width : (window.innerWidth || 300);
    vh = vv ? vv.height : (window.innerHeight || 300);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';

    var phone = isPhone();
    var margin = phone ? 10 : 26;
    var AR = 1.28; // book width / height; the book keeps its shape on phones
    bw = Math.min(vw - margin * 2, (vh - margin * 2) * AR);
    bh = bw / AR;
    if (bh > vh - margin * 2) { bh = vh - margin * 2; bw = bh * AR; }
    bx = (vw - bw) / 2;
    by = (vh - bh) / 2;
  }

  function onResize() { resize(); draw(currentT); }
  if (window.addEventListener) window.addEventListener('resize', onResize);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }

  // ---- Shape helpers (book coords: X(u), Y(v) in px) ----
  function X(u) { return bx + u * bw; }
  function Y(v) { return by + v * bh; }

  function tuft(u, vBase, s, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.4, bh * 0.004);
    ctx.lineCap = 'round';
    for (var k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(X(u), Y(vBase));
      ctx.quadraticCurveTo(X(u) + k * s * 0.4, Y(vBase) - s * 0.7, X(u) + k * s, Y(vBase) - s);
      ctx.stroke();
    }
  }

  function fern(f) {
    var baseX = X(f.u), baseY = Y(0.40);
    var topX = X(f.u + f.lean), topY = Y(0.40 - f.h);
    ctx.strokeStyle = SAGE;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1.8, bh * 0.005);
    ctx.beginPath();
    ctx.moveTo(baseX, baseY);
    ctx.quadraticCurveTo(X(f.u + f.lean * 0.3), Y(0.40 - f.h * 0.55), topX, topY);
    ctx.stroke();
    ctx.lineWidth = Math.max(1.3, bh * 0.0038);
    for (var t = 0.16; t < 0.98; t += 0.11) {
      var px = (1 - t) * (1 - t) * baseX + 2 * (1 - t) * t * X(f.u + f.lean * 0.3) + t * t * topX;
      var py = (1 - t) * (1 - t) * baseY + 2 * (1 - t) * t * Y(0.40 - f.h * 0.55) + t * t * topY;
      var len = bh * 0.034 * (1 - t * 0.72);
      ctx.beginPath();
      ctx.moveTo(px, py); ctx.lineTo(px - len, py - len * 0.38);
      ctx.moveTo(px, py); ctx.lineTo(px + len, py - len * 0.38);
      ctx.stroke();
    }
  }

  function hangPod(p) {
    ctx.strokeStyle = SAGE;
    ctx.lineWidth = Math.max(1.4, bh * 0.004);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(X(p.u), Y(0.20));
    ctx.lineTo(X(p.u), Y(0.20 + p.drop));
    ctx.stroke();
    ctx.fillStyle = PEACH;
    ctx.beginPath();
    ctx.ellipse(X(p.u), Y(0.20 + p.drop + 0.028), bh * 0.020, bh * 0.028, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(X(p.u), Y(0.20 + p.drop + 0.040), Math.max(1.2, bh * 0.004), 0, Math.PI * 2);
    ctx.fill();
  }

  function elephant(gx, gy, H) {
    ctx.fillStyle = INK;
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1.5, H * 0.03);
    ctx.beginPath();
    ctx.moveTo(gx - H * 0.50, gy - H * 0.62);
    ctx.quadraticCurveTo(gx - H * 0.63, gy - H * 0.44, gx - H * 0.56, gy - H * 0.27);
    ctx.stroke();
    var lw = H * 0.11, lh = H * 0.30;
    var offs = [-0.34, -0.10, 0.22];
    for (var j = 0; j < offs.length; j++) ctx.fillRect(gx + offs[j] * H - lw / 2, gy - lh, lw, lh);
    ctx.beginPath();
    ctx.ellipse(gx, gy - H * 0.58, H * 0.52, H * 0.33, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(gx + H * 0.52, gy - H * 0.66, H * 0.27, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = H * 0.115;
    ctx.beginPath();
    ctx.moveTo(gx + H * 0.70, gy - H * 0.58);
    ctx.quadraticCurveTo(gx + H * 0.87, gy - H * 0.40, gx + H * 0.80, gy - H * 0.10);
    ctx.stroke();
    ctx.fillStyle = PAPER;
    ctx.beginPath();
    ctx.ellipse(gx + H * 0.34, gy - H * 0.62, H * 0.115, H * 0.165, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = PAPER;
    ctx.beginPath();
    ctx.arc(gx + H * 0.60, gy - H * 0.70, Math.max(1.4, H * 0.028), 0, Math.PI * 2);
    ctx.fill();
  }

  function elephantAsleep(gx, gy, H) {
    ctx.fillStyle = INK;
    ctx.fillRect(gx - H * 0.40, gy - H * 0.10, H * 0.30, H * 0.10);
    ctx.fillRect(gx + H * 0.16, gy - H * 0.10, H * 0.30, H * 0.10);
    ctx.beginPath();
    ctx.ellipse(gx, gy - H * 0.30, H * 0.55, H * 0.29, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(gx + H * 0.55, gy - H * 0.24, H * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    ctx.lineWidth = H * 0.10;
    ctx.beginPath();
    ctx.moveTo(gx + H * 0.74, gy - H * 0.18);
    ctx.quadraticCurveTo(gx + H * 0.93, gy - H * 0.06, gx + H * 0.78, gy - H * 0.015);
    ctx.stroke();
    ctx.lineWidth = Math.max(1.3, H * 0.028);
    ctx.beginPath();
    ctx.moveTo(gx - H * 0.55, gy - H * 0.36);
    ctx.quadraticCurveTo(gx - H * 0.66, gy - H * 0.26, gx - H * 0.60, gy - H * 0.16);
    ctx.stroke();
    ctx.strokeStyle = CREAM;
    ctx.lineWidth = Math.max(1.2, H * 0.02);
    ctx.beginPath();
    ctx.ellipse(gx + H * 0.40, gy - H * 0.28, H * 0.11, H * 0.15, 0, Math.PI * 0.2, Math.PI * 1.0);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(gx + H * 0.61, gy - H * 0.26, H * 0.05, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
  }

  function bird(u, v, s) {
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.6, bh * 0.0045);
    ctx.lineCap = 'round';
    var cx = X(u), cy = Y(v), w = bh * 0.030 * s;
    ctx.beginPath();
    ctx.moveTo(cx - w, cy);
    ctx.quadraticCurveTo(cx - w * 0.45, cy - w * 0.62, cx, cy);
    ctx.quadraticCurveTo(cx + w * 0.45, cy - w * 0.62, cx + w, cy);
    ctx.stroke();
  }

  function creature(u, vBase, s, color) {
    var cx = X(u), gy = Y(vBase);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(cx, gy - s * 0.40, s * 0.50, s * 0.40, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(cx - s * 0.32, gy - s * 0.10, s * 0.16, s * 0.10);
    ctx.fillRect(cx + s * 0.16, gy - s * 0.10, s * 0.16, s * 0.10);
    ctx.fillStyle = (color === INK) ? PAPER : INK;
    ctx.beginPath();
    ctx.arc(cx - s * 0.16, gy - s * 0.46, Math.max(1.2, s * 0.055), 0, Math.PI * 2);
    ctx.arc(cx + s * 0.16, gy - s * 0.46, Math.max(1.2, s * 0.055), 0, Math.PI * 2);
    ctx.fill();
  }

  function sparkle(cx, cy, r) {
    ctx.fillStyle = ORANGE;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.quadraticCurveTo(cx, cy, cx + r, cy);
    ctx.quadraticCurveTo(cx, cy, cx, cy + r);
    ctx.quadraticCurveTo(cx, cy, cx - r, cy);
    ctx.quadraticCurveTo(cx, cy, cx, cy - r);
    ctx.fill();
  }

  // ---- The two scenes: one generator each, sliced by the strip clip ----
  function drawDay() {
    ctx.fillStyle = PAPER;
    ctx.fillRect(bx, by, bw, bh);
    // sun
    ctx.fillStyle = PEACH;
    ctx.beginPath();
    ctx.arc(X(0.15), Y(0.10), bh * 0.048, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.4, bh * 0.004);
    ctx.lineCap = 'round';
    for (var a = 0; a < 8; a++) {
      var ang = a * Math.PI / 4 + 0.2;
      ctx.beginPath();
      ctx.moveTo(X(0.15) + Math.cos(ang) * bh * 0.062, Y(0.10) + Math.sin(ang) * bh * 0.062);
      ctx.lineTo(X(0.15) + Math.cos(ang) * bh * 0.080, Y(0.10) + Math.sin(ang) * bh * 0.080);
      ctx.stroke();
    }
    bird(0.64, 0.085, 1.0);
    bird(0.79, 0.135, 0.7);
    // strip 2: ferns and hanging pods
    for (i = 0; i < ferns.length; i++) fern(ferns[i]);
    for (i = 0; i < hangPods.length; i++) hangPod(hangPods[i]);
    // strip 3: the elephant pair on their ground
    ctx.fillStyle = 'rgba(26,26,26,0.10)';
    ctx.beginPath();
    ctx.ellipse(X(0.36), Y(0.588), bw * 0.115, bh * 0.010, 0, 0, Math.PI * 2);
    ctx.ellipse(X(0.635), Y(0.588), bw * 0.070, bh * 0.008, 0, 0, Math.PI * 2);
    ctx.fill();
    elephant(X(0.345), Y(0.585), bh * 0.185);
    elephant(X(0.625), Y(0.585), bh * 0.120);
    for (i = 0; i < tuftU.length; i++) tuft(tuftU[i], 0.598, bh * 0.026, SAGE);
    // strip 4: creature band
    creature(0.16, 0.775, bh * 0.062, SAGE);
    creature(0.38, 0.775, bh * 0.052, PEACH);
    creature(0.80, 0.775, bh * 0.058, INK);
    tuft(0.27, 0.782, bh * 0.030, SAGE);
    tuft(0.52, 0.782, bh * 0.026, SAGE);
    tuft(0.93, 0.782, bh * 0.030, SAGE);
    // a small peach flower
    ctx.strokeStyle = SAGE;
    ctx.lineWidth = Math.max(1.4, bh * 0.004);
    ctx.beginPath();
    ctx.moveTo(X(0.66), Y(0.782));
    ctx.quadraticCurveTo(X(0.655), Y(0.735), X(0.66), Y(0.712));
    ctx.stroke();
    ctx.fillStyle = PEACH;
    for (a = 0; a < 5; a++) {
      var pa = a * Math.PI * 2 / 5 - Math.PI / 2;
      ctx.beginPath();
      ctx.arc(X(0.66) + Math.cos(pa) * bh * 0.011, Y(0.706) + Math.sin(pa) * bh * 0.011, bh * 0.0095, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(X(0.66), Y(0.706), bh * 0.006, 0, Math.PI * 2);
    ctx.fill();
    // strip 5: ground band, sage hill, pods, stones
    ctx.fillStyle = SAGE;
    ctx.beginPath();
    ctx.moveTo(bx, Y(0.905));
    ctx.quadraticCurveTo(X(0.30), Y(0.845), X(0.58), Y(0.885));
    ctx.quadraticCurveTo(X(0.82), Y(0.915), X(1.0), Y(0.875));
    ctx.lineTo(bx + bw, by + bh);
    ctx.lineTo(bx, by + bh);
    ctx.closePath();
    ctx.fill();
    var risePods = [0.22, 0.55, 0.86];
    for (i = 0; i < risePods.length; i++) {
      ctx.strokeStyle = INK;
      ctx.lineWidth = Math.max(1.3, bh * 0.0035);
      ctx.beginPath();
      ctx.moveTo(X(risePods[i]), Y(0.97));
      ctx.lineTo(X(risePods[i]), Y(0.895));
      ctx.stroke();
      ctx.fillStyle = PEACH;
      ctx.beginPath();
      ctx.ellipse(X(risePods[i]), Y(0.878), bh * 0.016, bh * 0.022, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.ellipse(X(0.40), Y(0.945), bh * 0.020, bh * 0.009, 0, 0, Math.PI * 2);
    ctx.ellipse(X(0.72), Y(0.962), bh * 0.015, bh * 0.007, 0, 0, Math.PI * 2);
    ctx.fill();
    tuft(0.08, 0.93, bh * 0.028, INK);
    tuft(0.95, 0.90, bh * 0.024, INK);
  }

  function drawNight() {
    ctx.fillStyle = NAVY;
    ctx.fillRect(bx, by, bw, bh);
    // perforated stars: punched paper dots
    ctx.fillStyle = CREAM;
    for (var j = 0; j < stars.length; j++) {
      ctx.beginPath();
      ctx.arc(X(stars[j].u), Y(stars[j].v), stars[j].r * (bh / 520), 0, Math.PI * 2);
      ctx.fill();
    }
    for (j = 0; j < sparks.length; j++) sparkle(X(sparks[j].u), Y(sparks[j].v), sparks[j].r * (bh / 520));
    // moon, upper right
    ctx.fillStyle = CREAM;
    ctx.beginPath();
    ctx.arc(X(0.74), Y(0.115), bh * 0.050, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = NAVY;
    ctx.beginPath();
    ctx.arc(X(0.74) + bh * 0.022, Y(0.115) - bh * 0.014, bh * 0.044, 0, Math.PI * 2);
    ctx.fill();
    // the elephant pair, asleep
    ctx.fillStyle = 'rgba(245,240,230,0.14)';
    ctx.beginPath();
    ctx.ellipse(X(0.42), Y(0.590), bw * 0.125, bh * 0.009, 0, 0, Math.PI * 2);
    ctx.ellipse(X(0.685), Y(0.590), bw * 0.075, bh * 0.007, 0, 0, Math.PI * 2);
    ctx.fill();
    elephantAsleep(X(0.40), Y(0.588), bh * 0.170);
    elephantAsleep(X(0.672), Y(0.588), bh * 0.105);
    // sleep marks
    ctx.fillStyle = CREAM;
    ctx.font = 'italic 600 ' + Math.round(bh * 0.030) + 'px Georgia, serif';
    ctx.fillText('z', X(0.40) + bh * 0.155, Y(0.588) - bh * 0.135);
    ctx.font = 'italic 600 ' + Math.round(bh * 0.042) + 'px Georgia, serif';
    ctx.fillText('z', X(0.40) + bh * 0.185, Y(0.588) - bh * 0.185);
    // night ground: ink hill with punched dots
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(bx, Y(0.915));
    ctx.quadraticCurveTo(X(0.32), Y(0.862), X(0.60), Y(0.898));
    ctx.quadraticCurveTo(X(0.84), Y(0.925), X(1.0), Y(0.888));
    ctx.lineTo(bx + bw, by + bh);
    ctx.lineTo(bx, by + bh);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = CREAM;
    var dots = [[0.14, 0.955], [0.34, 0.935], [0.52, 0.962], [0.78, 0.945], [0.90, 0.968]];
    for (j = 0; j < dots.length; j++) {
      ctx.beginPath();
      ctx.arc(X(dots[j][0]), Y(dots[j][1]), Math.max(1.1, bh * 0.0035), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Flip geometry: stepped squash steps, face swaps at the middle ----
  var SQUASH = [0.80, 0.60, 0.40, 0.20, 0.06, 0.20, 0.40, 0.60, 0.80, 1.0];
  function stripFrame(i2, t) {
    var a = anims[i2];
    if (!a) return { sy: 1, face: flipped[i2] };
    var el = (t - a.start) * 1000;
    if (el >= FLIP_MS) { anims[i2] = null; return { sy: 1, face: flipped[i2] }; }
    var step = Math.floor(el / (FLIP_MS / SQUASH.length));
    if (step >= SQUASH.length) step = SQUASH.length - 1;
    return { sy: SQUASH[step], face: step < SQUASH.length / 2 ? !flipped[i2] : flipped[i2] };
  }

  // ---- Draw ----
  function draw(t) {
    currentT = t;
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // page ground: the paper tone, with faint grain
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, vw, vh);
    ctx.fillStyle = 'rgba(26,26,26,0.05)';
    for (var s = 0; s < speckles.length; s++) {
      ctx.beginPath();
      ctx.arc(speckles[s].u * vw, speckles[s].v * vh, speckles[s].r, 0, Math.PI * 2);
      ctx.fill();
    }

    // stacked page edges behind the book
    ctx.fillStyle = 'rgba(26,26,26,0.05)';
    ctx.fillRect(bx + 5, by + 6, bw, bh);
    ctx.fillStyle = 'rgba(26,26,26,0.04)';
    ctx.fillRect(bx + 2.5, by + 3, bw, bh);
    ctx.fillStyle = PAPER;
    ctx.fillRect(bx, by, bw, bh);

    var stripH = bh / 5;
    var pulse = (Math.floor(t / 1.5) % 2 === 0) ? 0 : 1; // breathing, stepped
    var seamAlpha = 0.16 + pulse * 0.05;

    for (var i2 = 0; i2 < 5; i2++) {
      var top = by + i2 * stripH;
      var fr = stripFrame(i2, t);
      ctx.save();
      ctx.beginPath();
      ctx.rect(bx, top, bw, stripH);
      ctx.clip();
      if (fr.sy !== 1) {
        var cy = top + stripH / 2;
        ctx.translate(0, cy);
        ctx.scale(1, fr.sy);
        ctx.translate(0, -cy);
        ctx.beginPath();
        ctx.rect(bx, top, bw, stripH);
        ctx.clip();
      }
      if (fr.face) drawNight(); else drawDay();
      ctx.restore();

      // squash shading on the moving strip, flat translucent ink
      if (fr.sy !== 1) {
        ctx.fillStyle = 'rgba(26,26,26,' + (0.14 * (1 - fr.sy)).toFixed(3) + ')';
        ctx.fillRect(bx, top, bw, stripH);
        // moving curl shadow cast onto the strip below
        if (i2 < 4) {
          ctx.fillStyle = 'rgba(26,26,26,' + (0.20 * (1 - fr.sy)).toFixed(3) + ')';
          ctx.fillRect(bx, top + stripH, bw, stripH * 0.45 * (1 - fr.sy) + 2);
        }
      }
      // resting curl shadow under each seam, breathing in steps
      if (i2 < 4) {
        ctx.fillStyle = 'rgba(26,26,26,' + (0.05 + pulse * 0.02).toFixed(3) + ')';
        ctx.fillRect(bx, top + stripH, bw, 3 + pulse);
        ctx.fillStyle = 'rgba(26,26,26,' + seamAlpha.toFixed(3) + ')';
        ctx.fillRect(bx, top + stripH - 0.5, bw, 1);
      }
    }

    // spine at left, with two stitch marks
    var spineW = Math.max(9, bw * 0.016);
    ctx.fillStyle = 'rgba(26,26,26,0.07)';
    ctx.fillRect(bx, by, spineW, bh);
    ctx.fillStyle = 'rgba(26,26,26,0.28)';
    ctx.fillRect(bx + spineW - 1, by, 1, bh);
    ctx.fillRect(bx + spineW * 0.28, by + bh * 0.30, spineW * 0.44, 2);
    ctx.fillRect(bx + spineW * 0.28, by + bh * 0.68, spineW * 0.44, 2);

    // book border
    ctx.strokeStyle = 'rgba(26,26,26,0.55)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);

    // hint
    ctx.fillStyle = 'rgba(26,26,26,0.38)';
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('tap', vw - 14, vh - 12);
    ctx.textAlign = 'left';
  }

  // ---- Interaction: tap a strip to flick it over ----
  function onTap(x, y) {
    if (x < bx || x > bx + bw || y < by || y > by + bh) return;
    var i2 = Math.floor((y - by) / (bh / 5));
    if (i2 < 0 || i2 > 4) return;
    if (anims[i2]) return; // already flicking
    flipped[i2] = !flipped[i2];
    anims[i2] = { start: currentT };
    draw(currentT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      onTap(e.clientX || 0, e.clientY || 0);
    });
  }

  // ---- Boot: one synchronous first frame at fixed phase 0, then the loop ----
  resize();
  draw(0);
  var startTs = null;
  function frame(ts) {
    if (startTs === null) startTs = ts;
    draw((ts - startTs) / 1000 + 0);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
