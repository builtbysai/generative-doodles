<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1912 Muscle Memory Dies</title>
<style>
  html, body { margin: 0; padding: 0; background: #221710; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var BG = '#221710';        // dark rehearsal brown, page ground
  var WOOD = '#2e1f13';      // fretboard wood
  var WOOD_EDGE = '#3a2718'; // neck edge, slightly lighter brown
  var WOOD_DARK = '#1a110a'; // darkness the frets recede into
  var STRING = '#c9c2b4';    // string silver
  var FRET = '#a89c88';      // fret wire, warm silver
  var GHOST = '#c0392b';     // wrong-note ghost red
  var AMBER = '#d89a3a';     // correction settling into warm amber
  var AMBER_DIM = '#8a6a2e'; // dim amber for the old trail
  var PAPER = '#e8dcc4';     // title text, warm paper
  var HINT = '#b09a78';      // hint, muted warm tan
  var HAND = '#4a3220';      // fretting hand, dark warm brown
  var HAND_LIT = '#6a4a2e';  // hand rim light

  // Fixed-phase first frame: t = 9.6 s. The first detune hits at t = 8.42 s
  // (string 3, +0.33 semitones, peg turns a fraction). At 9.6 s the player
  // is 1.18 s into the recovery: the note is still bending from the old
  // position toward the new tuning, the red ghost of the wrong note is
  // still visible, and the third peg sits freshly turned. Every event,
  // note and ghost is a pure function of t, so frame one is
  // byte-reproducible.
  var FIRST_T = 9.6;

  // Detune schedule: irregular gaps, never on a beat. Event k lands at
  // t = 3 s plus cumulative gaps of 5 + 4 * hash(k) seconds. Each event
  // picks one string and shifts its tuning by a fraction of a semitone.
  // The tuning table is a pure function of t: sum of all event shifts on
  // each string up to t.
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function eventAt(k) {
    var t = 3.0;
    for (var i = 1; i <= k; i++) { t += 5 + 4 * hash(i); }
    return t;
  }
  function eventString(k) { return Math.floor(hash(k * 7 + 3) * 4); }
  function eventAmt(k) {
    var a = 0.12 + 0.22 * hash(k * 13 + 5);
    return (hash(k * 3 + 1) > 0.5 ? 1 : -1) * a;
  }
  function eventIndex(t) {
    var k = 0;
    while (eventAt(k + 1) <= t) { k++; }
    return k;
  }
  // Tuning offsets (semitones) for the four strings at time t.
  function tuningAt(t) {
    var tun = [0, 0, 0, 0];
    var k = eventIndex(t);
    for (var i = 0; i <= k; i++) {
      if (eventAt(i) <= t) { tun[eventString(i)] += eventAmt(i); }
    }
    return tun;
  }
  // Cumulative peg rotation for string s at time t (radians).
  function pegAngle(s, t) {
    var ang = 0;
    var k = eventIndex(t);
    for (var i = 0; i <= k; i++) {
      if (eventAt(i) <= t && eventString(i) === s) { ang += eventAmt(i) * 0.9; }
    }
    return ang;
  }

  // The phrase: one note every 0.55 s, string and fret from seeded hashes.
  // The line is never scripted to miss; the misses are systemic, because
  // every note position is computed from the tuning table.
  var NOTE_DUR = 0.55;
  function noteAt(n) {
    return {
      str: Math.floor(hash(n * 7 + 5) * 4),
      fret: 1 + Math.floor(hash(n * 3 + 11) * 12)
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.88, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Neck geometry, in a frame rotated -32 degrees so the neck runs
  // diagonally from the lower-left darkness up to the headstock at the
  // upper-right corner. All coordinates below are in rotated space.
  var ROT = -0.56;
  function neckGeom() {
    var L = W * 1.30;
    var nutX = L * 0.16;
    var farX = -L * 0.50;
    var headX = L * 0.50;
    var hn = H * 0.075;   // neck half-width at the nut
    var hf = H * 0.042;   // neck half-width at the far end (receding)
    var hh = H * 0.105;   // headstock half-width
    return { L: L, nutX: nutX, farX: farX, headX: headX, hn: hn, hf: hf, hh: hh };
  }
  // Fret distance from the nut, standard 12th-root-of-2 spacing.
  function fretDist(g, fret) {
    return 0.62 * g.L * (1 - Math.pow(2, -fret / 12));
  }
  // Neck half-width at x (tapering from nut toward the far end).
  function halfWidthAt(g, x) {
    if (x >= g.nutX) { return lerp(g.hn, g.hh, clamp((x - g.nutX) / (g.headX - g.nutX), 0, 1)); }
    return lerp(g.hn, g.hf, clamp((g.nutX - x) / (g.nutX - g.farX), 0, 1));
  }
  // String y at position x: strings converge as the neck narrows.
  function stringYAt(g, s, x) {
    var hw = halfWidthAt(g, x);
    return -hw + (s + 0.5) * (2 * hw / 4);
  }
  // Note position in rotated space. VIS magnifies the tuning shift so the
  // miss reads at gallery size; the shift itself is systemic, computed
  // from the tuning table, never scripted.
  var VIS = 2.5;
  function notePos(g, str, fret, tuning) {
    var d = fretDist(g, fret + tuning * VIS);
    var x = g.nutX - d;
    return { x: x, y: stringYAt(g, str, x) };
  }

  function drawNeck(g) {
    // Fretboard: a tapered plank from the far darkness to the headstock.
    ctx.fillStyle = WOOD;
    ctx.beginPath();
    ctx.moveTo(g.farX, -g.hf);
    ctx.lineTo(g.nutX, -g.hn);
    ctx.lineTo(g.headX, -g.hh);
    ctx.lineTo(g.headX, g.hh);
    ctx.lineTo(g.nutX, g.hn);
    ctx.lineTo(g.farX, g.hf);
    ctx.closePath(); ctx.fill();
    // Neck edge highlight along the top side.
    ctx.strokeStyle = hexA(WOOD_EDGE, 0.9);
    ctx.lineWidth = Math.max(1, H * 0.004);
    ctx.beginPath(); ctx.moveTo(g.farX, -g.hf); ctx.lineTo(g.nutX, -g.hn); ctx.lineTo(g.headX, -g.hh); ctx.stroke();
    // Nut: a pale bar across the neck.
    ctx.strokeStyle = hexA(STRING, 0.85);
    ctx.lineWidth = Math.max(2, H * 0.008);
    ctx.beginPath(); ctx.moveTo(g.nutX, -g.hn); ctx.lineTo(g.nutX, g.hn); ctx.stroke();
    // Frets, receding into darkness toward the far end: spacing shrinks
    // and the wires fade as they go.
    for (var i = 1; i <= 16; i++) {
      var fx = g.nutX - fretDist(g, i);
      if (fx < g.farX) { break; }
      var fade = i <= 10 ? 1 : 1 - (i - 10) / 6 * 0.75;
      var hw = halfWidthAt(g, fx);
      ctx.strokeStyle = hexA(FRET, a4(0.85 * fade));
      ctx.lineWidth = Math.max(1, H * 0.004);
      ctx.beginPath(); ctx.moveTo(fx, -hw); ctx.lineTo(fx, hw); ctx.stroke();
    }
    // Fret markers: small dots at frets 3, 5, 7, 9, 12.
    var marks = [3, 5, 7, 9, 12];
    for (var m = 0; m < marks.length; m++) {
      var mx = g.nutX - fretDist(g, marks[m]);
      var fadeM = marks[m] <= 10 ? 1 : 0.5;
      ctx.fillStyle = hexA(FRET, a4(0.55 * fadeM));
      ctx.beginPath(); ctx.moveTo(mx + H * 0.008, 0);
      ctx.arc(mx, 0, H * 0.008, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawStrings(g, t) {
    // Four strings, silver, running the frame's length. The string being
    // played carries a faint wobble just after its note onset.
    var n = Math.floor(t / NOTE_DUR);
    var cur = noteAt(n);
    var onsetAge = t - n * NOTE_DUR;
    for (var s = 0; s < 4; s++) {
      ctx.strokeStyle = hexA(STRING, s === cur.str ? 0.95 : 0.7);
      ctx.lineWidth = Math.max(1, H * (s === 0 ? 0.0045 : 0.003));
      ctx.beginPath();
      var steps = 24;
      for (var i = 0; i <= steps; i++) {
        var x = lerp(g.farX, g.headX, i / steps);
        var y = stringYAt(g, s, x);
        if (s === cur.str && onsetAge < 0.5 && x < g.nutX) {
          y += Math.sin((x - g.farX) * 0.05 + t * 40) * H * 0.004 * (1 - onsetAge / 0.5);
        }
        if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
      }
      ctx.stroke();
    }
  }

  function drawPegs(g, t) {
    // Four tuning pegs at the headstock, two per side, like small hands.
    // Each peg has turned by its string's cumulative detune; the peg that
    // turned most recently carries a brief amber ring.
    var k = eventIndex(t);
    var lastEv = eventAt(k);
    var lastStr = eventString(k);
    for (var s = 0; s < 4; s++) {
      var side = (s < 2) ? -1 : 1;
      var col = (s % 2 === 0) ? 0 : 1;
      var px = g.nutX + (g.headX - g.nutX) * (0.30 + col * 0.42);
      var py = side * (halfWidthAt(g, px) + H * 0.028);
      var ang = pegAngle(s, t);
      // Stem from the headstock edge to the peg.
      ctx.strokeStyle = hexA(STRING, 0.8);
      ctx.lineWidth = Math.max(1.5, H * 0.005);
      ctx.beginPath();
      ctx.moveTo(px, side * halfWidthAt(g, px));
      ctx.lineTo(px, py);
      ctx.stroke();
      // Paddle, rotated by its cumulative turns.
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(ang);
      ctx.fillStyle = WOOD_EDGE;
      ctx.strokeStyle = hexA(STRING, 0.6);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-H * 0.016, -H * 0.010);
      ctx.lineTo(H * 0.016, -H * 0.010);
      ctx.lineTo(H * 0.020, H * 0.010);
      ctx.lineTo(-H * 0.020, H * 0.010);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      // Fresh-turn ring on the peg that moved last.
      if (s === lastStr && t - lastEv < 2.0) {
        var ra = 1 - (t - lastEv) / 2.0;
        ctx.strokeStyle = hexA(AMBER, a4(0.7 * ra));
        ctx.lineWidth = Math.max(1, H * 0.003);
        ctx.beginPath(); ctx.moveTo(px + H * 0.030, py);
        ctx.arc(px, py, H * 0.030, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }

  function drawGhosts(g, t) {
    // Ghost traces: at every detune inside the last 4 s, the note playing
    // at that moment is drawn again at the position its old tuning
    // demanded, in red, decaying.
    var k = eventIndex(t);
    for (var i = Math.max(0, k - 3); i <= k; i++) {
      var evT = eventAt(i);
      var age = t - evT;
      if (age < 0 || age > 4) { continue; }
      var tunBefore = tuningAt(evT - 0.001);
      var nEv = Math.floor(evT / NOTE_DUR);
      var noteEv = noteAt(nEv);
      var p = notePos(g, noteEv.str, noteEv.fret, tunBefore[noteEv.str]);
      var a = (1 - age / 4) * 0.7;
      var r = H * 0.014 + age * H * 0.004;
      ctx.strokeStyle = hexA(GHOST, a4(a));
      ctx.lineWidth = Math.max(1, H * 0.003);
      ctx.beginPath(); ctx.moveTo(p.x + r, p.y); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = hexA(GHOST, a4(a * 0.8));
      ctx.beginPath(); ctx.moveTo(p.x + H * 0.005, p.y);
      ctx.arc(p.x, p.y, H * 0.005, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawTrail(g, t) {
    // The melodic line: the last six notes, amber, fading back. Each
    // note sits at the position its tuning had settled to by the end of
    // its own span, so a bent note lands on the trail at its corrected
    // place while its ghost stays red at the miss.
    var n = Math.floor(t / NOTE_DUR);
    var tunNow = tuningAt(t);
    var pts = [];
    for (var m = Math.max(0, n - 5); m <= n; m++) {
      var note = noteAt(m);
      var tunEnd = tuningAt(m * NOTE_DUR + NOTE_DUR);
      pts.push(notePos(g, note.str, note.fret, tunEnd[note.str]));
    }
    for (var j = 0; j < pts.length - 1; j++) {
      var a = 0.15 + 0.55 * (j / (pts.length - 1));
      ctx.strokeStyle = hexA(AMBER_DIM, a4(a));
      ctx.lineWidth = Math.max(1, H * 0.003);
      ctx.beginPath();
      ctx.moveTo(pts[j].x, pts[j].y);
      ctx.lineTo(pts[j + 1].x, pts[j + 1].y);
      ctx.stroke();
    }
    // Small amber dots at the settled notes.
    for (var d = 0; d < pts.length - 1; d++) {
      ctx.fillStyle = hexA(AMBER, a4(0.25 + 0.5 * (d / (pts.length - 1))));
      ctx.beginPath(); ctx.moveTo(pts[d].x + H * 0.004, pts[d].y);
      ctx.arc(pts[d].x, pts[d].y, H * 0.004, 0, Math.PI * 2); ctx.fill();
    }
    void tunNow;
  }

  function drawCurrentNote(g, t) {
    // The note being played now. If a detune landed during this note, the
    // finger starts at the old-tuning position and bends toward the new
    // one over 1.2 s; the ear corrects, the hand follows.
    var n = Math.floor(t / NOTE_DUR);
    var onset = n * NOTE_DUR;
    var note = noteAt(n);
    var tunNow = tuningAt(t);
    var posNew = notePos(g, note.str, note.fret, tunNow[note.str]);
    var pos = posNew;
    var k = eventIndex(t);
    for (var i = 0; i <= k; i++) {
      var evT = eventAt(i);
      if (evT > onset && evT <= t && eventString(i) === note.str) {
        var tunBefore = tuningAt(evT - 0.001);
        var posOld = notePos(g, note.str, note.fret, tunBefore[note.str]);
        var bend = smooth((t - evT) / 1.2);
        pos = { x: lerp(posOld.x, posNew.x, bend), y: lerp(posOld.y, posNew.y, bend) };
        break;
      }
    }
    // Amber halo and core, pulsing faintly with the note's age.
    var age = t - onset;
    var pulse = 1 + 0.12 * Math.sin(age * Math.PI * 2 * 2);
    ctx.fillStyle = hexA(AMBER, 0.18);
    ctx.beginPath(); ctx.moveTo(pos.x + H * 0.030 * pulse, pos.y);
    ctx.arc(pos.x, pos.y, H * 0.030 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = AMBER;
    ctx.beginPath(); ctx.moveTo(pos.x + H * 0.011, pos.y);
    ctx.arc(pos.x, pos.y, H * 0.011, 0, Math.PI * 2); ctx.fill();
    // Fresh-onset ring, gone within half a second.
    if (age < 0.4) {
      ctx.strokeStyle = hexA(AMBER, a4(0.6 * (1 - age / 0.4)));
      ctx.lineWidth = Math.max(1, H * 0.002);
      var rr = H * 0.012 + age * H * 0.05;
      ctx.beginPath(); ctx.moveTo(pos.x + rr, pos.y); ctx.arc(pos.x, pos.y, rr, 0, Math.PI * 2); ctx.stroke();
    }
    return pos;
  }

  function drawFrettingHand(g, pos, t) {
    // The fretting hand reaches from below the neck; its middle fingertip
    // lands exactly on the bending note, so the hand itself shows the
    // miss and the correction. Small palm, three fingers spread across
    // neighbouring frets, dark warm brown with an amber rim on the side
    // facing the strings.
    var px = pos.x + H * 0.006;
    var py = pos.y + H * 0.058;
    var wob = Math.sin(t * 1.4) * H * 0.002;
    ctx.fillStyle = HAND;
    // Palm, smaller than the first pass so it reads as a hand, not a disc.
    ctx.beginPath(); ctx.moveTo(px + H * 0.030, py);
    ctx.arc(px, py, H * 0.030, 0, Math.PI * 2); ctx.fill();
    // Fingers: capsules from the palm rim to the strings, spread across
    // neighbouring frets, the middle one pressing the note.
    var fingers = [
      { dx: -0.022, dy: -0.045, len: 0.058 },
      { dx: 0.000, dy: -0.052, len: 0.062 },
      { dx: 0.022, dy: -0.045, len: 0.056 }
    ];
    ctx.strokeStyle = HAND;
    ctx.lineCap = 'round';
    for (var f = 0; f < fingers.length; f++) {
      var fx0 = px + fingers[f].dx * H + wob;
      var fy0 = py - H * 0.022;
      var fx1 = pos.x + fingers[f].dx * H;
      var fy1 = pos.y + H * 0.002;
      ctx.lineWidth = H * 0.013;
      ctx.beginPath(); ctx.moveTo(fx0, fy0); ctx.lineTo(fx1, fy1); ctx.stroke();
    }
    // Thumb, braced on the neck's far side.
    ctx.lineWidth = H * 0.012;
    ctx.beginPath(); ctx.moveTo(px - H * 0.024, py - H * 0.006);
    ctx.lineTo(px - H * 0.038, py - H * 0.032); ctx.stroke();
    // Rim light along the knuckle edge.
    ctx.strokeStyle = hexA(HAND_LIT, 0.9);
    ctx.lineWidth = Math.max(1, H * 0.0025);
    ctx.beginPath();
    ctx.moveTo(px - H * 0.026, py - H * 0.014);
    ctx.quadraticCurveTo(px, py - H * 0.030, px + H * 0.026, py - H * 0.014);
    ctx.stroke();
    // Fingertip dot on the note, amber.
    ctx.fillStyle = AMBER;
    ctx.beginPath(); ctx.moveTo(pos.x + H * 0.006, pos.y);
    ctx.arc(pos.x, pos.y, H * 0.006, 0, Math.PI * 2); ctx.fill();
  }

  function drawPluckingHand(g, t) {
    // The plucking hand works down in the darkness near the far end,
    // mostly silhouette: a small dark palm tucked against the strings,
    // thumb and finger short and thick, bobbing slowly.
    var hx = g.nutX - fretDist(g, 13);
    var hy = stringYAt(g, 2.5, hx) + H * 0.045;
    var bob = Math.sin(t * Math.PI * 2 * 0.9) * H * 0.006;
    ctx.fillStyle = hexA(HAND, 0.6);
    ctx.beginPath(); ctx.moveTo(hx + H * 0.028, hy);
    ctx.arc(hx, hy, H * 0.028, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(HAND, 0.6);
    ctx.lineCap = 'round';
    ctx.lineWidth = H * 0.015;
    ctx.beginPath(); ctx.moveTo(hx - H * 0.014, hy - H * 0.018);
    ctx.lineTo(hx - H * 0.020, hy - H * 0.048 + bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx + H * 0.012, hy - H * 0.018);
    ctx.lineTo(hx + H * 0.018, hy - H * 0.046 - bob); ctx.stroke();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Dark rehearsal ground.
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var g = neckGeom();
    var cx = W / 2, cy = H / 2;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ROT);
    drawNeck(g);
    drawStrings(g, t);
    drawGhosts(g, t);
    drawTrail(g, t);
    var pos = drawCurrentNote(g, t);
    drawFrettingHand(g, pos, t);
    drawPluckingHand(g, t);
    drawPegs(g, t);
    ctx.restore();

    // Darkness swallows the frets at the lower edge: a soft radial
    // shadow over the lower-left, in unrotated space.
    var grad = ctx.createRadialGradient(W * 0.08, H * 0.95, 0, W * 0.08, H * 0.95, W * 0.55);
    grad.addColorStop(0, hexA(WOOD_DARK, 0.85));
    grad.addColorStop(0.6, hexA(WOOD_DARK, 0.35));
    grad.addColorStop(1, hexA(WOOD_DARK, 0));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = PAPER;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Muscle Memory Dies', 18, 34);
    ctx.fillStyle = HINT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1912 · 2007 · 04 · 07', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(HINT, 0.95);
    ctx.textAlign = 'center';
    ctx.fillText('Watch the hands re-learn the neck as the tuning drifts.', W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs near 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
