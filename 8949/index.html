<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ten Times Exact · №8949</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #101014; overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 72vw;
    font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(235, 230, 215, 0.66); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 system-ui, sans-serif;
    color: rgba(235, 230, 215, 0.38);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #begin {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(16, 16, 20, 0.55); cursor: pointer; z-index: 5;
  }
  #begin span {
    font: 500 17px/1.6 system-ui, sans-serif; color: #ece7d8;
    border: 1px solid rgba(236, 231, 216, 0.5); border-radius: 999px;
    padding: 12px 26px; background: rgba(16,16,20,0.6);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cap">Ten exact repetitions of one spoken phrase. The sound never changes. Listen for when it starts to sing.</div>
<div id="seedtag"></div>
<div id="begin"><span>tap to begin the ten loops</span></div>
<script>
"use strict";
/* ============================================================
   Ten Times Exact — №8949 (2026-07-12), seed 244
   From the speech-to-song study: ten exact repetitions flip a
   spoken phrase into song, while a 2/3 semitone drift kills it.
   One speech-like motif is rendered once into a single buffer.
   The same buffer plays ten times, byte for byte. Across the ten
   loops the visuals quantize from a smooth pitch contour into
   stepped notation on a staff, while the audio never changes.
   The loop counter and the buffer checksum prove it. The flip
   happens in the listener.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 244;
const rnd = mulberry32(seed);
document.getElementById("seedtag").textContent = "seed " + seed;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize); resize();

/* ---------- the motif: 8 syllables, fixed prosody ---------- */
const SYL = 8;
const prosody = [0, 2, 4, 1, -1, -3, -2, -5];      // semitones over the phrase
const formants = [                                 // F1, F2 per syllable
  [700, 1220], [500, 1500], [600, 1800], [800, 1100],
  [500, 1700], [650, 1300], [450, 2000], [700, 1000]
];
const F0 = 140, SYL_DUR = 0.19;

async function renderMotif() {
  const sr = 44100, dur = SYL * SYL_DUR + 0.05;
  const off = new OfflineAudioContext(1, Math.ceil(sr * dur), sr);
  for (let s = 0; s < SYL; s++) {
    const t0 = s * SYL_DUR;
    const f0a = F0 * Math.pow(2, prosody[s] / 12);
    const f0b = F0 * Math.pow(2, (prosody[s] + (rnd() - 0.5) * 0.6) / 12);
    const osc = off.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(f0a, t0);
    osc.frequency.linearRampToValueAtTime(f0b, t0 + SYL_DUR);
    const g = off.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.025);
    g.gain.setValueAtTime(0.5, t0 + SYL_DUR - 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + SYL_DUR);
    const bp1 = off.createBiquadFilter(); bp1.type = "bandpass";
    bp1.frequency.value = formants[s][0]; bp1.Q.value = 6;
    const bp2 = off.createBiquadFilter(); bp2.type = "bandpass";
    bp2.frequency.value = formants[s][1]; bp2.Q.value = 8;
    const g2 = off.createGain(); g2.gain.value = 0.6;
    osc.connect(g); g.connect(bp1); g.connect(bp2);
    bp1.connect(off.destination); bp2.connect(g2); g2.connect(off.destination);
    osc.start(t0); osc.stop(t0 + SYL_DUR + 0.01);
  }
  return await off.startRendering();
}

function checksum(buf) {
  const d = buf.getChannelData(0);
  let h = 2166136261 >>> 0;
  const step = Math.max(1, Math.floor(d.length / 4000));
  for (let i = 0; i < d.length; i += step) {
    h ^= (d[i] * 32767) | 0; h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16).padStart(8, "0");
}

/* ---------- contour model (what the visuals quantize) ---------- */
const CONTOUR_N = 160;
const contour = [];
for (let i = 0; i < CONTOUR_N; i++) {
  const x = i / (CONTOUR_N - 1) * SYL;
  const s = Math.min(SYL - 1, Math.floor(x)), f = x - s;
  const v = prosody[s] * (1 - f) + prosody[Math.min(SYL - 1, s + 1)] * f;
  contour.push(v + Math.sin(x * Math.PI * 2.3) * 0.35);
}
const CMIN = -7, CMAX = 6;

let audioCtx = null, motifBuf = null, bufHash = "";
let running = false, loopIdx = 0, loopStart = 0;
const LOOPS = 10, motifDur = SYL * SYL_DUR + 0.05;

function drawFrame(now) {
  ctx.clearRect(0, 0, W, H);
  const pad = Math.min(W, H) * 0.06;
  const topY = H * 0.16, botY = H * 0.72;
  const cx0 = pad * 1.6, cx1 = W - pad * 1.6;

  // title
  ctx.fillStyle = "rgba(236,231,216,0.92)";
  ctx.font = "600 " + Math.round(Math.min(W, H) * 0.032) + "px system-ui, sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("№8949 · Ten Times Exact", pad, pad * 1.7);

  // loop counter
  ctx.textAlign = "right";
  ctx.font = "700 " + Math.round(Math.min(W, H) * 0.075) + "px system-ui, sans-serif";
  ctx.fillStyle = running ? "rgba(240,200,120,0.95)" : "rgba(236,231,216,0.35)";
  ctx.fillText((running ? loopIdx + 1 : 0) + " / " + LOOPS, W - pad, pad * 2.2);
  ctx.textAlign = "left";

  const q = running ? (loopIdx + 1) / LOOPS : 0;   // quantization 0..1
  // staff lines fade in with q
  ctx.strokeStyle = "rgba(150,170,220," + (0.06 + 0.34 * q).toFixed(3) + ")";
  ctx.lineWidth = 1;
  for (let l = 0; l < 5; l++) {
    const y = botY - 60 + l * 15 - q * 0;
    ctx.beginPath(); ctx.moveTo(cx0, y); ctx.lineTo(cx1, y); ctx.stroke();
  }
  // contour, progressively quantized
  const steps = Math.round(64 - 56 * q);
  const snap = q;
  ctx.lineWidth = Math.max(1.5, Math.min(W, H) * 0.004);
  ctx.strokeStyle = "rgba(240,200,120,0.9)";
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const ci = Math.round(i / steps * (CONTOUR_N - 1));
    let v = contour[ci];
    v = v * (1 - snap) + Math.round(v) * snap;
    const x = cx0 + (cx1 - cx0) * i / steps;
    const y = botY - 30 - (v - CMIN) / (CMAX - CMIN) * 150;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  // note heads at syllable centers, snapped to semitone staff positions
  for (let s = 0; s < SYL; s++) {
    let v = prosody[s];
    v = v * (1 - snap) + Math.round(v) * snap;
    const x = cx0 + (cx1 - cx0) * (s + 0.5) / SYL;
    const y = botY - 30 - (v - CMIN) / (CMAX - CMIN) * 150;
    ctx.fillStyle = "rgba(150,170,220," + (0.25 + 0.65 * q).toFixed(3) + ")";
    ctx.beginPath(); ctx.ellipse(x, y, 7, 5, -0.2, 0, Math.PI * 2); ctx.fill();
  }
  // status line
  ctx.font = "400 " + Math.round(Math.min(W, H) * 0.024) + "px system-ui, sans-serif";
  ctx.fillStyle = "rgba(236,231,216,0.75)";
  let msg;
  if (!motifBuf) msg = "rendering the phrase...";
  else if (!running) msg = "one buffer rendered. buffer " + bufHash + ". tap to play it ten times.";
  else if (loopIdx < LOOPS - 1) msg = "loop " + (loopIdx + 1) + " of " + LOOPS + ". buffer " + bufHash + ". the sound has not changed.";
  else msg = "ten times exact. buffer " + bufHash + ", unchanged. if it sings now, the change happened in you. tap to replay.";
  ctx.fillText(msg, pad, H * 0.83);
  requestAnimationFrame(drawFrame);
}

async function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    motifBuf = await renderMotif();
    bufHash = checksum(motifBuf);
  }
  if (audioCtx.state === "suspended") await audioCtx.resume();
}

function playTen() {
  if (running || !motifBuf) return;
  running = true; loopIdx = 0;
  const t0 = audioCtx.currentTime + 0.1;
  for (let i = 0; i < LOOPS; i++) {
    const src = audioCtx.createBufferSource();
    src.buffer = motifBuf;
    src.connect(audioCtx.destination);
    src.onended = () => { loopIdx = i + 1; if (loopIdx >= LOOPS) running = false; };
    src.start(t0 + i * motifDur);
  }
}

document.getElementById("begin").addEventListener("click", async (e) => {
  e.currentTarget.style.display = "none";
  await ensureAudio();
  playTen();
});
canvas.addEventListener("click", async () => {
  const b = document.getElementById("begin");
  if (b.style.display !== "none") { b.style.display = "none"; }
  await ensureAudio();
  playTen();
});
ensureAudio();
requestAnimationFrame(drawFrame);
</script>
</body>
</html>
