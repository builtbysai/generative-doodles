<!DOCTYPE html>
<!-- phantom-fill-8949 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ten Times Exact — №8949</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#f4efe4;color:#1c1a16;font-family:Georgia,serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  .hud{position:absolute;z-index:2;pointer-events:none}
  #title{top:22px;left:26px}
  #title h1{font-size:16px;letter-spacing:.3em;font-weight:400}
  #title p{font-size:11px;letter-spacing:.15em;color:#7a7263;margin-top:6px;font-family:"Courier New",monospace}
  #count{top:20px;right:26px;text-align:right;font-family:"Courier New",monospace}
  #playNo{font-size:40px;line-height:1}
  #playNo span{font-size:16px;color:#7a7263}
  #hash{font-size:11px;color:#7a7263;margin-top:6px;letter-spacing:.08em}
  #same{font-size:11px;letter-spacing:.3em;color:#1c7a4d;margin-top:4px}
  #foot{left:26px;bottom:24px;font-size:11px;letter-spacing:.15em;color:#7a7263;font-family:"Courier New",monospace;line-height:1.8}
  #start{position:absolute;right:26px;bottom:24px;z-index:3;background:#1c1a16;color:#f4efe4;border:none;font-family:"Courier New",monospace;font-size:12px;letter-spacing:.3em;padding:13px 24px;cursor:pointer}
  #start:hover{background:#1c7a4d}
  #progress{position:absolute;left:0;bottom:0;height:4px;background:#1c7a4d;width:0;z-index:3;transition:width .4s}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud" id="title"><h1>TEN TIMES EXACT</h1><p>№8949 — ONE RECORDING, TEN PLAYS, BYTE-IDENTICAL.<br>THE PICTURE TURNS INTO NOTATION WHILE YOU LISTEN.</p></div>
<div class="hud" id="count"><div id="playNo">0<span> / 10</span></div><div id="hash">BUFFER —</div><div id="same"></div></div>
<div class="hud" id="foot">YOUR EARS FLIP BEFORE YOUR EYES DO.<br>PLAY 1: A PICTURE. PLAY 10: A SCORE.</div>
<button id="start">PLAY — TEN TIMES</button>
<div id="progress"></div>
<script>
(function(){
  "use strict";
  var cv=document.getElementById('stage'),ctx=cv.getContext('2d'),W,H;
  function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
  size();addEventListener('resize',size);
  // --- the recording: rendered ONCE, offline, into a single buffer ---
  var AC=null, buffer=null, checksum='', play=0, playing=false, muted=false, src=null;
  var MELODY=[60,64,67,72,67,64,60,55,60,64,67,64]; // midi, 12 notes
  var playEl=document.getElementById('playNo'),hashEl=document.getElementById('hash'),
      sameEl=document.getElementById('same'),progEl=document.getElementById('progress'),
      startBtn=document.getElementById('start');
  function midiToFreq(m){return 440*Math.pow(2,(m-69)/12);}
  function renderRecording(){
    // Offline render: one buffer, 4.8s, piano-ish plucks. Rendered once, never re-rendered.
    var sr=44100, off=new OfflineAudioContext(1,sr*5,sr);
    MELODY.forEach(function(m,i){
      var t=i*0.38+0.1, o=off.createOscillator(), g=off.createGain();
      o.type='sine';o.frequency.value=midiToFreq(m);
      var o2=off.createOscillator(), g2=off.createGain();
      o2.type='triangle';o2.frequency.value=midiToFreq(m)*2;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.5,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
      g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(0.12,t+0.01);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.connect(g);g.connect(off.destination);o2.connect(g2);g2.connect(off.destination);
      o.start(t);o.stop(t+1);o2.start(t);o2.stop(t+0.6);
    });
    return off.startRendering();
  }
  function hashBuffer(buf){
    var d=buf.getChannelData(0), h=2166136261;
    for(var i=0;i<d.length;i+=7){h^=(d[i]*32767)|0;h=Math.imul(h,16777619);}
    return ('0000000'+(h>>>0).toString(16)).slice(-8).toUpperCase();
  }
  function morph(){return play===0?0:(play-1)/9;} // 0 = picture, 1 = score
  function doPlay(){
    if(play>=10){playing=false;startBtn.textContent='PLAY AGAIN — TEN TIMES';return;}
    play++;playing=true;
    playEl.innerHTML=play+'<span> / 10</span>';
    sameEl.textContent=play>1?'IDENTICAL TO PLAY 1':'';
    progEl.style.width=(play/10*100)+'%';
    src=AC.createBufferSource();src.buffer=buffer;
    var g=AC.createGain();g.gain.value=muted?0:0.9;
    src.connect(g);g.connect(AC.destination);src.start();
    src.onended=function(){setTimeout(doPlay,900);};
  }
  startBtn.addEventListener('click',function(){
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      startBtn.textContent='RENDERING…';
      renderRecording().then(function(buf){
        buffer=buf;checksum=hashBuffer(buf);
        hashEl.textContent='BUFFER #'+checksum+' — RENDERED ONCE';
        startBtn.textContent='MUTE';
        doPlay();
      });
    }else if(play>=10){play=0;doPlay();startBtn.textContent='MUTE';}
    else if(muted){muted=false;startBtn.textContent='MUTE';AC.resume();}
    else{muted=true;startBtn.textContent='UNMUTE';}
  });
  function suspend(){if(AC&&AC.state==='running')AC.suspend();}
  function resume(){if(AC&&AC.state==='suspended'&&!muted)AC.resume();}
  document.addEventListener('visibilitychange',function(){document.hidden?suspend():resume();});
  addEventListener('blur',suspend);addEventListener('focus',resume);
  addEventListener('pagehide',suspend);addEventListener('beforeunload',suspend);
  // --- render: picture -> notation, driven by morph() ---
  var blobs=[];
  for(var b=0;b<26;b++)blobs.push({x:Math.random(),y:Math.random(),r:0.03+Math.random()*0.09,
    c:['#c96f4a','#4a7a96','#8a9a5b','#d9a441','#6b5b95','#3e6b57'][b%6],a:0.5+Math.random()*0.4});
  function draw(){
    ctx.clearRect(0,0,W,H);
    var m=morph(), cx=W/2, cy=H/2;
    // picture layer (fades out as m grows)
    ctx.globalAlpha=1-m;
    blobs.forEach(function(bl){
      ctx.beginPath();
      ctx.arc(bl.x*W,bl.y*H,bl.r*Math.min(W,H),0,Math.PI*2);
      ctx.fillStyle=bl.c;ctx.globalAlpha=(1-m)*bl.a;ctx.fill();
    });
    ctx.globalAlpha=(1-m)*0.8;
    ctx.strokeStyle='#1c1a16';ctx.lineWidth=1.5*devicePixelRatio;
    ctx.beginPath();
    for(var x=0;x<=W;x+=8*devicePixelRatio){
      var y=cy+Math.sin(x/W*Math.PI*6)*H*0.08+Math.sin(x/W*Math.PI*13)*H*0.03;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    // notation layer (fades in as m grows)
    ctx.globalAlpha=m;
    var staffW=Math.min(W*0.8,900*devicePixelRatio), sx=cx-staffW/2, sy=cy-H*0.12;
    var gap=14*devicePixelRatio;
    ctx.strokeStyle='#1c1a16';ctx.lineWidth=1*devicePixelRatio;
    for(var l=0;l<5;l++){ctx.beginPath();ctx.moveTo(sx,sy+l*gap);ctx.lineTo(sx+staffW,sy+l*gap);ctx.stroke();}
    MELODY.forEach(function(md,i){
      var nx=sx+staffW*(i+0.6)/MELODY.length;
      var ny=sy+(72-md)*gap/2;
      ctx.beginPath();ctx.ellipse(nx,ny,6*devicePixelRatio,4.5*devicePixelRatio,-0.4,0,Math.PI*2);
      ctx.fillStyle='#1c1a16';ctx.fill();
      ctx.beginPath();ctx.moveTo(nx+5*devicePixelRatio,ny-2*devicePixelRatio);
      ctx.lineTo(nx+5*devicePixelRatio,ny-30*devicePixelRatio);ctx.stroke();
    });
    // clef-ish swirl
    ctx.beginPath();ctx.arc(sx+14*devicePixelRatio,sy+2*gap,10*devicePixelRatio,0.5,Math.PI*1.8);
    ctx.stroke();
    ctx.globalAlpha=1;
    // caption tracks the flip
    ctx.fillStyle='rgba(28,26,22,0.65)';ctx.textAlign='center';
    ctx.font=(12*devicePixelRatio)+'px "Courier New",monospace';
    var cap=m<0.15?'A PICTURE':m<0.5?'A PICTURE, REMEMBERING ITSELF':m<0.85?'NOTATION, EMERGING':'A SCORE';
    ctx.fillText(cap,cx,H-70*devicePixelRatio);
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
