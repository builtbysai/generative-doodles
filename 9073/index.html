<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9073 · Raster</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#ece3cc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(74,62,42,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(236,227,204,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another raster</div>
<script>
'use strict';
// No9073 Raster.
// Dots as atoms on a strict grid, one rule for their size: each dot
// measures two interference fields, rings spreading from two unseen
// centers, and grows where the fields agree. Where they cancel, the
// dot shrinks to a pinprick. The grid never moves; only the radii
// breathe, and the picture is the interference itself, a halftone of
// two ring systems arguing. Composition is measured: a seed is kept
// only when at least 15 percent of dots are near full size and at
// least 15 percent are near pinpricks, so the argument has both sides.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9073', 10) || 9073;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#ece3cc';
const INK = '#26221b';

function compose(s, aspect) {
  const rnd = mulberry32(s);
  const c1 = { x: 0.15 + rnd() * 0.45, y: 0.15 + rnd() * 0.45 };
  const c2 = { x: 0.45 + rnd() * 0.45, y: 0.45 + rnd() * 0.45 };
  const f1 = 26 + rnd() * 22, f2 = 26 + rnd() * 22;
  const ph = rnd() * Math.PI * 2;
  return { c1, c2, f1, f2, ph, aspect };
}

function field(p, u, v) {
  const a = p.aspect;
  const d1 = Math.hypot((u - p.c1.x) * a, v - p.c1.y);
  const d2 = Math.hypot((u - p.c2.x) * a, v - p.c2.y);
  const s = Math.sin(d1 * p.f1) * 0.5 + Math.sin(d2 * p.f2 + p.ph) * 0.5;
  return Math.max(0, Math.min(1, 0.5 + s));       // 0..1 agreement
}

function measure(p) {
  let big = 0, small = 0, n = 0;
  for (let i = 0; i <= 24; i++) for (let j = 0; j <= 24; j++) {
    const f = field(p, i / 24, j / 24);
    if (f > 0.78) big++;
    if (f < 0.22) small++;
    n++;
  }
  return { big: big / n, small: small / n };
}

function buildPiece(baseSeed, aspect) {
  let best = null, bestScore = -1;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0, aspect);
    const m = measure(p);
    const score = Math.min(m.big, 0.3) + Math.min(m.small, 0.3);
    if (score > bestScore) { bestScore = score; best = p; }
    if (m.big >= 0.15 && m.small >= 0.15) return p;
  }
  return best;
}

let piece = null, pieceAspect = 0;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;
  const aspect = RX / RY;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece || Math.abs(aspect - pieceAspect) > 0.01) {
    piece = buildPiece(seed, aspect);
    pieceAspect = aspect;
  }
  const p = piece;

  ctx.fillStyle = INK;
  const cell = RX / 46;
  const rows = Math.ceil(RY / cell);
  for (let j = 0; j < rows; j++) {
    const v = (j + 0.5) / rows;
    for (let i = 0; i < 46; i++) {
      const u = (i + 0.5) / 46;
      const f = field(p, u, v);
      const r = cell * 0.48 * Math.pow(f, 0.8);
      if (r < 0.4) continue;
      ctx.beginPath();
      ctx.arc(ox + u * RX, oy + v * RY, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function redraw() { piece = null; draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
