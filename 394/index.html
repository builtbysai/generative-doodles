<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.394 Triple Prompt</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F6EFD9; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.394 Triple Prompt (galitskaya-illustration).
// After Anna Galitskaya's Wonderful Winter Week rules:
// every deal draws one garment, one animal, one thing,
// and the piece IS the intersection, the animal wearing
// the garment and holding the thing. The deals come
// from a FIXED AUTHORED TRIPLE TABLE of eight, never a
// runtime pick: each of the eight animals, eight
// garments and eight things from her lexicons is used
// exactly once (asserted at load). Frame one is table
// entry 1, the jaguar in its knitted scarf holding the
// festive headband. DOUBLE-TAP deals the next triple
// through a 0.6s dressing wipe: a teal band sweeps the
// design space on fixed ticks, the new character
// revealed behind it, the old one still standing ahead
// of it. DRAG tilts and sways the character toward the
// pointer; on release it springs back to exactly
// upright. Under each deal an ambient 12s loop runs on
// whole cycles: the character breathes 0.98-1.02 and
// blinks at two fixed slots in the loop. Flat round
// kidlit shapes on warm paper; palette closed at the
// five specced hexes, each used flat or at flat alpha
// steps (the elephant's grey is the figure ink at a
// flat alpha over the ground). No text anywhere. All
// spot and stripe data is baked from a fixed seed at
// load; no offscreen canvas, no gradients, no filters,
// no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#F6EFD9', INK = '#33302B', TEAL = '#2E8B8B';
var RUST = '#C0562F', MUSTARD = '#E8A93D';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 12;
if (LOOP !== 12) throw new Error('Triple Prompt ambient loop must be 12s');
var TICK = 1 / 60;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: spot and stripe
// placements are baked from this at load and never
// change between frames or renders.
var seed = 394;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellA(x, y, rx, ry, rot, color, alpha) {
  ctx.globalAlpha = alpha;
  ell(x, y, rx, ry, rot, color);
  ctx.globalAlpha = 1;
}
function ellS(x, y, rx, ry, rot, color, lw, alpha) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function circ(x, y, r, color) { ell(x, y, r, r, 0, color); }
function dome(cx, cy, rx, ry, color) {
  // Top half of an ellipse, closed along its diameter.
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx - rx, cy);
  ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, Math.PI * 2);
  ctx.closePath();
  ctx.fill();
}
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function segA(x1, y1, x2, y2, w, color, alpha) {
  ctx.globalAlpha = alpha;
  seg(x1, y1, x2, y2, w, color);
  ctx.globalAlpha = 1;
}
function curve(x1, y1, cx, cy, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}
function traceBlob(pts, keepPath) {
  // pts: [moveX, moveY, then c1x,c1y,c2x,c2y,x,y per bezier segment]
  if (!keepPath) ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i + 5 < pts.length; i += 6) {
    ctx.bezierCurveTo(pts[i], pts[i + 1], pts[i + 2], pts[i + 3], pts[i + 4], pts[i + 5]);
  }
  ctx.closePath();
}
function blob(color, pts) {
  ctx.fillStyle = color;
  traceBlob(pts);
  ctx.fill();
}
function pathEll(x, y, rx, ry, rot) {
  // Append an ellipse as a subpath of the current path.
  ctx.moveTo(x + rx, y);
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
}
function poly(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i + 1 < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}
function star(cx, cy, r, color) {
  var pts = [];
  for (var i = 0; i < 10; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 5;
    var rr = (i % 2 === 0) ? r : r * 0.45;
    pts.push(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  poly(color, pts);
}
// Eyes blink: the blink factor B (0 open, 1 shut) is set
// once per frame from the fixed slots in the 12s loop.
var B = 0;
function eye(x, y, r, color) {
  ell(x, y, r, Math.max(0.8, r * (1 - B * 0.92)), 0, color || INK);
}

// ---- lexicons and the authored triple table ------------
// Her three lexicons, eight each, verbatim from the
// study. The table deals each animal, garment and
// thing exactly once; entry 1 echoes her observed
// deal (knitted accessory + jaguar + festive headband).
var ANIMALS = ['jaguar', 'hedgehog', 'snow monkey', 'lama', 'kitten', 'elephant', 'tabby cat', 'white cat'];
var GARMENTS = ['knitted accessory', 'checkered coat', 'wool skirt', 'poncho', 'mushroom cap', 'tutu', 'overalls', 'frog hat'];
var THINGS = ['festive headband', 'presents', 'Christmas card', 'Christmas mug', 'tulip', 'telescope', 'umbrella', 'watering can'];
var TRIPLES = [
  { animal: 'jaguar',     garment: 'knitted accessory', thing: 'festive headband' },
  { animal: 'elephant',   garment: 'tutu',              thing: 'watering can' },
  { animal: 'kitten',     garment: 'mushroom cap',      thing: 'Christmas mug' },
  { animal: 'lama',       garment: 'poncho',            thing: 'telescope' },
  { animal: 'hedgehog',   garment: 'checkered coat',    thing: 'presents' },
  { animal: 'tabby cat',  garment: 'overalls',          thing: 'umbrella' },
  { animal: 'snow monkey', garment: 'wool skirt',       thing: 'tulip' },
  { animal: 'white cat',  garment: 'frog hat',          thing: 'Christmas card' }
];
if (ANIMALS.length !== 8 || GARMENTS.length !== 8 || THINGS.length !== 8) throw new Error('Triple Prompt lexicons must hold exactly 8 each');
if (TRIPLES.length !== 8) throw new Error('Triple Prompt needs exactly 8 authored triples');
(function () {
  var seen = { animal: {}, garment: {}, thing: {} }, i, t;
  for (i = 0; i < TRIPLES.length; i++) {
    t = TRIPLES[i];
    if (ANIMALS.indexOf(t.animal) < 0) throw new Error('triple animal outside the lexicon: ' + t.animal);
    if (GARMENTS.indexOf(t.garment) < 0) throw new Error('triple garment outside the lexicon: ' + t.garment);
    if (THINGS.indexOf(t.thing) < 0) throw new Error('triple thing outside the lexicon: ' + t.thing);
    if (seen.animal[t.animal] || seen.garment[t.garment] || seen.thing[t.thing]) throw new Error('triple table must use each lexicon entry exactly once');
    seen.animal[t.animal] = 1; seen.garment[t.garment] = 1; seen.thing[t.thing] = 1;
  }
})();

// ---- baked ornament data -------------------------------
// Jaguar rosettes and tabby stripes, placed from the
// fixed seed at load, identical in every frame.
var JAG_SPOTS = [];
(function () {
  var i, a, rr, x, y, tries;
  for (i = 0; i < 15; i++) {
    tries = 0;
    do {
      a = rnd() * Math.PI * 2;
      rr = 0.45 + rnd() * 0.5;
      x = Math.cos(a) * 104 * rr;
      y = 45 + Math.sin(a) * 108 * rr;
      tries++;
    } while (tries < 12 && Math.abs(x) < 72 && y > 34 && y < 152);
    JAG_SPOTS.push([x, y, 6 + rnd() * 5]);
  }
  for (i = 0; i < 6; i++) {
    a = rnd() * Math.PI * 2;
    rr = 0.55 + rnd() * 0.38;
    x = Math.cos(a) * 66 * rr;
    y = -118 + Math.sin(a) * 62 * rr;
    if (y > -96) continue;
    JAG_SPOTS.push([x, y, 4.5 + rnd() * 3.5]);
  }
  if (JAG_SPOTS.length < 15) throw new Error('jaguar needs its baked rosettes');
})();
var TABBY_STRIPES = [];
(function () {
  var i;
  for (i = 0; i < 6; i++) {
    var side = (i % 2 === 0) ? -1 : 1;
    var y = -6 + Math.floor(i / 2) * 44 + rnd() * 10;
    TABBY_STRIPES.push([side * (86 + rnd() * 8), y, side * (58 + rnd() * 8), y + 16]);
  }
})();

// ---- species base bodies -------------------------------
// Local coords: origin at the body's centre, the
// ground line at y = +205. Each base draws the body,
// head shape, ears, tail, arms and feet; faces are a
// separate pass so garments can sit between the two.
// Anchors per species follow the bodies below.
function baseJaguar() {
  curve(-102, 92, -164, 84, -186, 30, 20, MUSTARD);
  circ(-188, 26, 11, INK);
  ell(0, 45, 118, 122, 0, MUSTARD);
  ell(0, 92, 74, 68, 0, GROUND);
  for (var i = 0; i < JAG_SPOTS.length; i++) {
    var s = JAG_SPOTS[i];
    ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(s[0], s[1], s[2], 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ell(-62, 180, 34, 15, 0, MUSTARD);
  ell(62, 180, 34, 15, 0, MUSTARD);
  seg(-100, 30, -128, 110, 24, MUSTARD);
  seg(98, 26, 126, -6, 24, MUSTARD);
  circ(-56, -182, 24, MUSTARD); circ(56, -182, 24, MUSTARD);
  circ(-56, -182, 11, GROUND); circ(56, -182, 11, GROUND);
  circ(0, -118, 78, MUSTARD);
}
function baseHedgehog() {
  ell(-52, 184, 26, 11, 0, GROUND);
  ell(52, 184, 26, 11, 0, GROUND);
  ell(0, 48, 126, 124, 0, INK);
  var rim = [[-108, 8], [-96, -38], [-66, -68], [-30, -84], [8, -86], [46, -76], [78, -54], [100, -22], [112, 16]];
  for (var i = 0; i < rim.length; i++) circ(rim[i][0], rim[i][1], 27, INK);
  ell(0, -2, 62, 74, 0, GROUND);
  seg(-84, 60, -102, 96, 15, GROUND);
  seg(80, 62, 92, 84, 15, GROUND);
}
function baseSnowMonkey() {
  curve(100, 120, 168, 108, 186, 58, 16, MUSTARD);
  circ(188, 52, 10, GROUND);
  ell(0, 48, 112, 118, 0, MUSTARD);
  ell(0, 96, 70, 62, 0, GROUND);
  ell(-56, 180, 30, 13, 0, MUSTARD);
  ell(56, 180, 30, 13, 0, MUSTARD);
  seg(-94, 34, -118, 108, 22, MUSTARD);
  seg(94, 26, 118, 2, 22, MUSTARD);
  circ(-66, -128, 20, MUSTARD); circ(66, -128, 20, MUSTARD);
  circ(-66, -128, 9, GROUND); circ(66, -128, 9, GROUND);
  circ(0, -118, 74, MUSTARD);
  ell(0, -112, 52, 56, 0, GROUND);
}
function baseLama() {
  ell(-48, 168, 16, 42, 0, GROUND);
  ell(48, 168, 16, 42, 0, GROUND);
  ell(-48, 202, 18, 9, 0, INK);
  ell(48, 202, 18, 9, 0, INK);
  ell(0, 60, 100, 105, 0, GROUND);
  ellS(0, 60, 100, 105, 0, INK, 3, 0.22);
  ell(0, -110, 30, 80, 0, GROUND);
  seg(52, 120, 96, 66, 15, GROUND);
  ell(-30, -262, 11, 26, -0.3, GROUND);
  ell(30, -262, 11, 26, 0.3, GROUND);
  ell(0, -216, 40, 52, 0, GROUND);
  ellS(0, -216, 40, 52, 0, INK, 3, 0.22);
}
function baseKitten() {
  curve(-84, 110, -142, 96, -160, 40, 15, MUSTARD);
  circ(-162, 34, 9, GROUND);
  ell(0, 52, 96, 106, 0, MUSTARD);
  ell(0, 84, 52, 56, 0, GROUND);
  ell(-50, 172, 28, 12, 0, MUSTARD);
  ell(50, 172, 28, 12, 0, MUSTARD);
  seg(-80, 40, -102, 104, 20, MUSTARD);
  seg(80, 32, 104, 4, 20, MUSTARD);
  poly(MUSTARD, [-58, -142, -50, -196, -16, -158]);
  poly(MUSTARD, [58, -142, 50, -196, 16, -158]);
  poly(GROUND, [-48, -148, -44, -178, -24, -154]);
  poly(GROUND, [48, -148, 44, -178, 24, -154]);
  circ(0, -102, 68, MUSTARD);
  // Forehead stripes live in the base so a hat sits
  // over their tops.
  segA(-13, -126, -11, -112, 4, INK, 0.7);
  segA(0, -130, 0, -116, 4, INK, 0.7);
  segA(13, -126, 11, -112, 4, INK, 0.7);
}
function baseElephant() {
  // The whole grey silhouette (ears, body, head, feet,
  // raised foreleg, trunk) is ONE path filled in a
  // single pass at one flat alpha, so overlapping
  // parts never double-darken into patches.
  ctx.beginPath();
  pathEll(-118, -52, 44, 62, 0.2);
  pathEll(118, -52, 44, 62, -0.2);
  pathEll(0, 42, 132, 128, 0);
  pathEll(0, -52, 88, 80, 0);
  pathEll(-70, 188, 36, 15, 0);
  pathEll(70, 188, 36, 15, 0);
  pathEll(124, 34, 30, 16, -0.5);
  // The trunk joins the same single fill, hanging to
  // the waistline where the tutu takes over.
  traceBlob([-19, -28,
    8, -14, 20, 24, 15, 58,
    13, 74, 10, 84, 0, 84,
    -11, 84, -15, 72, -16, 54,
    -17, 24, -18, -8, -19, -28], true);
  ctx.globalAlpha = 0.62;
  ctx.fillStyle = INK;
  ctx.fill();
  ctx.globalAlpha = 1;
  circ(-82, 184, 4.5, GROUND); circ(-70, 187, 4.5, GROUND); circ(-58, 184, 4.5, GROUND);
  circ(58, 184, 4.5, GROUND); circ(70, 187, 4.5, GROUND); circ(82, 184, 4.5, GROUND);
}
function baseTabby() {
  curve(-88, 112, -152, 100, -168, 44, 17, MUSTARD);
  segA(-160, 78, -138, 84, 17, INK, 0.75);
  segA(-166, 56, -144, 60, 17, INK, 0.75);
  ell(0, 48, 104, 114, 0, MUSTARD);
  ell(0, 88, 56, 60, 0, GROUND);
  for (var i = 0; i < TABBY_STRIPES.length; i++) {
    var s = TABBY_STRIPES[i];
    segA(s[0], s[1], s[2], s[3], 9, INK, 0.7);
  }
  ell(-54, 174, 30, 13, 0, MUSTARD);
  ell(54, 174, 30, 13, 0, MUSTARD);
  seg(-86, 36, -108, 106, 21, MUSTARD);
  seg(86, 30, 110, 6, 21, MUSTARD);
  poly(MUSTARD, [-62, -150, -54, -208, -18, -166]);
  poly(MUSTARD, [62, -150, 54, -208, 18, -166]);
  poly(GROUND, [-52, -156, -48, -188, -26, -162]);
  poly(GROUND, [52, -156, 48, -188, 26, -162]);
  circ(0, -110, 72, MUSTARD);
}
function baseWhiteCat() {
  // A white cat on cream paper is held together by
  // its ink outline: limbs are ink strokes washed
  // with ground, silhouettes get a firm ink edge.
  segA(-88, 112, -152, 100, 22, INK, 0.5);
  curve(-88, 112, -152, 100, -168, 44, 15, GROUND);
  ell(0, 48, 104, 114, 0, GROUND);
  ellS(0, 48, 104, 114, 0, INK, 3.2, 0.7);
  ell(-54, 176, 30, 13, 0, GROUND);
  ell(54, 176, 30, 13, 0, GROUND);
  ellS(-54, 176, 30, 13, 0, INK, 2.4, 0.5);
  ellS(54, 176, 30, 13, 0, INK, 2.4, 0.5);
  segA(-86, 36, -108, 106, 23, INK, 0.5);
  seg(-86, 36, -108, 106, 15, GROUND);
  segA(86, 30, 110, 6, 23, INK, 0.5);
  seg(86, 30, 110, 6, 15, GROUND);
  poly(GROUND, [-62, -150, -54, -208, -18, -166]);
  poly(GROUND, [62, -150, 54, -208, 18, -166]);
  poly(MUSTARD, [-52, -156, -48, -188, -26, -162]);
  poly(MUSTARD, [52, -156, 48, -188, 26, -162]);
  circ(0, -110, 72, GROUND);
  ellS(0, -110, 72, 72, 0, INK, 3.2, 0.7);
}

// ---- species faces (drawn after the garment) -----------
function faceJaguar() {
  ell(0, -88, 40, 27, 0, GROUND);
  ell(0, -102, 13, 9, 0, INK);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, -84, 12, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
  eye(-30, -128, 7); eye(30, -128, 7);
}
function faceHedgehog() {
  eye(-25, -14, 6.5); eye(25, -14, 6.5);
  ell(0, 40, 11, 8, 0, INK);
  circ(-42, 22, 7, MUSTARD); circ(42, 22, 7, MUSTARD);
}
function faceSnowMonkey() {
  ell(0, -84, 30, 20, 0, GROUND);
  eye(-24, -126, 6.5); eye(24, -126, 6.5);
  circ(-6, -92, 3, INK); circ(6, -92, 3, INK);
  ctx.strokeStyle = INK; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, -78, 9, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
}
function faceLama() {
  ell(0, -194, 24, 18, 0, MUSTARD);
  eye(-17, -224, 5.5); eye(17, -224, 5.5);
  circ(-6, -198, 2.8, INK); circ(6, -198, 2.8, INK);
  segA(-16, -248, -8, -240, 3.4, INK, 0.7);
  segA(0, -252, 4, -242, 3.4, INK, 0.7);
  segA(16, -248, 10, -240, 3.4, INK, 0.7);
}
function faceKitten() {
  ell(0, -78, 30, 19, 0, GROUND);
  ell(0, -90, 8, 6, 0, INK);
  eye(-25, -108, 6.5); eye(25, -108, 6.5);
  segA(-38, -84, -66, -90, 2.4, INK, 0.7);
  segA(-38, -76, -64, -70, 2.4, INK, 0.7);
  segA(38, -84, 66, -90, 2.4, INK, 0.7);
  segA(38, -76, 64, -70, 2.4, INK, 0.7);
}
function faceElephant() {
  eye(-50, -74, 7, INK); eye(50, -74, 7, INK);
  poly(GROUND, [-34, 10, -22, 12, -27, 38]);
  poly(GROUND, [34, 10, 22, 12, 27, 38]);
  segA(-13, 62, 11, 62, 3.4, INK, 0.65);
}
function faceTabby() {
  ell(0, -84, 32, 20, 0, GROUND);
  ell(0, -96, 8.5, 6, 0, INK);
  eye(-27, -116, 6.5); eye(27, -116, 6.5);
  segA(-15, -166, -13, -148, 4.4, INK, 0.75);
  segA(0, -170, 0, -152, 4.4, INK, 0.75);
  segA(15, -166, 13, -148, 4.4, INK, 0.75);
  segA(-40, -90, -70, -96, 2.4, INK, 0.7);
  segA(-40, -82, -68, -76, 2.4, INK, 0.7);
  segA(40, -90, 70, -96, 2.4, INK, 0.7);
  segA(40, -82, 68, -76, 2.4, INK, 0.7);
}
function faceWhiteCat() {
  poly(MUSTARD, [-7, -94, 7, -94, 0, -84]);
  eye(-27, -116, 6.5); eye(27, -116, 6.5);
  ctx.strokeStyle = INK; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, -78, 10, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
  segA(-40, -90, -70, -96, 2.4, INK, 0.7);
  segA(-40, -82, -68, -76, 2.4, INK, 0.7);
  segA(40, -90, 70, -96, 2.4, INK, 0.7);
  segA(40, -82, 68, -76, 2.4, INK, 0.7);
}
var BASES = { 'jaguar': baseJaguar, 'hedgehog': baseHedgehog, 'snow monkey': baseSnowMonkey, 'lama': baseLama, 'kitten': baseKitten, 'elephant': baseElephant, 'tabby cat': baseTabby, 'white cat': baseWhiteCat };
var FACES = { 'jaguar': faceJaguar, 'hedgehog': faceHedgehog, 'snow monkey': faceSnowMonkey, 'lama': faceLama, 'kitten': faceKitten, 'elephant': faceElephant, 'tabby cat': faceTabby, 'white cat': faceWhiteCat };
// Anchors per species: head centre and radius, the
// neck line garments hang from, the waist line and its
// half-width, and the paw the thing is anchored to.
var ANCHORS = {
  'jaguar':      { hx: 0, hy: -118, hr: 78, neck: -54,  waist: 92, wrx: 104, px: 128, py: -8, paw: MUSTARD, pawA: 1 },
  'hedgehog':    { hx: 0, hy: -2,   hr: 66, neck: 52,   waist: 96, wrx: 106, px: 94,  py: 86, paw: GROUND,  pawA: 1 },
  'snow monkey': { hx: 0, hy: -118, hr: 74, neck: -52,  waist: 94, wrx: 100, px: 120, py: 0,  paw: MUSTARD, pawA: 1 },
  'lama':        { hx: 0, hy: -216, hr: 44, neck: -148, waist: 96, wrx: 92,  px: 98,  py: 62, paw: INK,     pawA: 1 },
  'kitten':      { hx: 0, hy: -102, hr: 68, neck: -44,  waist: 90, wrx: 90,  px: 106, py: 2,  paw: MUSTARD, pawA: 1 },

// ---- one dealt character --------------------------------
// Drawn in local coords (origin at body centre, ground
// at +205): base body, garment over it, face over the

// ---- deck state ------------------------------------------
// Constant first-frame phase: T = 5.3s into the 12s
// loop (breath mid-swing, eyes open, no blink slot
// near), table entry 1 up, no wipe running. Frame one
// is drawn synchronously at this constant; the rAF
// loop advances T from the same anchor in fixed
// ticks. Frame one never reads a wall clock.
var T = 5.3;

// Drag tilt: springs back to exactly upright.

  var slots = [2.2, 8.6], b = 0, i, d;

  }
  return b;
}

function step() {
  if (wipeT < 1) wipeT = Math.min(1, wipeT + TICK / WIPE_LEN);
  tiltVel += (tiltTarget - tilt) * 0.12;
  tiltVel *= 0.78;
  tilt += tiltVel;
  if (!dragging && tiltTarget === 0 && Math.abs(tilt) < 0.0005 && Math.abs(tiltVel) < 0.0005) {
    tilt = 0; tiltVel = 0;
  }
}

function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

function drawFigure(triple, lt) {
  var br = 1 + 0.02 * Math.sin(Math.PI * 2 * lt / LOOP);
  var cs = phone ? 1.3 : 1.12;
  ctx.save();
  ctx.translate(DW / 2, 678);
  ellA(0, 4, 176, 24, 0, INK, 0.10);
  ctx.rotate(tilt);
  ctx.scale(br * cs, br * cs);
  ctx.translate(0, -205);
  drawCharacter(triple);
  ctx.restore();
}

function draw() {
  var lt = T % LOOP;
  B = blinkFactor(lt);
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  if (wipeT >= 1) {
    drawFigure(TRIPLES[dealIdx], lt);

  }
  // Dressing wipe: a teal band sweeps left to right on
  // fixed ticks; the new deal is revealed behind the
  // band, the old deal still stands ahead of it.
  var p = easeInOut(wipeT);
  var bx = -40 + (DW + 80) * p;
  ctx.save();
  ctx.beginPath(); ctx.rect(-2400, -2400, bx + 2400, DH + 4800); ctx.clip();
  drawFigure(TRIPLES[dealIdx], lt);
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.rect(bx, -2400, DW - bx + 2400, DH + 4800); ctx.clip();
  drawFigure(TRIPLES[prevIdx], lt);
  ctx.restore();
  ctx.fillStyle = TEAL;
  ctx.fillRect(bx - 6, 130, 12, 640);
  segA(bx - 6, 130, bx - 6, 770, 2.4, INK, 0.5);
  segA(bx + 6, 130, bx + 6, 770, 2.4, INK, 0.5);
}

// ---- pointer: double-tap deals, drag tilts ---------------
// A tap is a press and release close together in
// design space. Two taps within 0.4s of the piece
// clock deal the next triple in the table, wrapping
// after the eighth back to the first. A longer press
// that moves is a drag: the character tilts toward
// the pointer and springs upright on release. The
// piece never reloads.

  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };

  dragging = false;
  tiltTarget = 0;

  if (T - lastTapT < 0.4) {

    if (wipeT >= 1) {

// ---- sizing: centred fit, page ground = ground tone ----
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);

  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;

window.addEventListener('resize', resize);

function frame(time) {

  canvas.style.height = H + 'px';
