<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9022 · Accumulation — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14110c;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 620px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #d9a441; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #100e0a;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #d9a441; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9022</span> · Accumulation</h1>
  <p>Sixteen thousand grains of light, dropped one by one until a landscape
  gathers out of the dust. <b>Click the piece for a new sky.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 20260924;
const tParam = parseFloat(params.get("t"));
const motifParam = (params.get("motif") || "").toLowerCase();
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const TAU = Math.PI * 2;
const VU = 1000;
const BG = "#100e0a";
const REVEAL_MS = 5200;
const TARGET_DOTS = 16000;

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

// 2D value noise + fbm, seeded
function makeNoise2D(rnd){
  const perm = new Uint8Array(512);
  const p0 = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p0[i] = i;
  for (let i = 255; i > 0; i--){
    const j = (rnd() * (i + 1)) | 0;
    const t = p0[i]; p0[i] = p0[j]; p0[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = p0[i & 255];
  const g = new Float32Array(256);
  for (let i = 0; i < 256; i++) g[i] = rnd();
  const fade = t => t * t * (3 - 2 * t);
  return function(x, y){
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const aa = g[perm[perm[X] + Y] & 255], ab = g[perm[perm[X] + Y + 1] & 255];
    const ba = g[perm[perm[X + 1] + Y] & 255], bb = g[perm[perm[X + 1] + Y + 1] & 255];
    const u = fade(xf), v = fade(yf);
    const x1 = aa + (ba - aa) * u, x2 = ab + (bb - ab) * u;
    return x1 + (x2 - x1) * v;
  };
}
function makeFbm(noise){
  return function(x, y){
    return 0.55 * noise(x, y) + 0.30 * noise(x * 2.13 + 7.7, y * 2.13 + 3.1)
         + 0.15 * noise(x * 4.31 + 13.7, y * 4.31 + 9.2);
  };
}
// deterministic cell hash for stars
function hash2(ix, iy, s){
  let h = (ix * 374761393 + iy * 668265263 + s * 974634211) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// ---- motif density fields: density(x, y) -> 0..1 ----
function buildMotifs(rnd, fbm, seedNum){
  const ridgeSeed = rnd() * 100, forestSeed = rnd() * 100;
  const ridges = [
    { base: 350 + rnd() * 50, amp: 110 + rnd() * 60, tone: 0.40, off: ridgeSeed },
    { base: 540 + rnd() * 50, amp: 120 + rnd() * 60, tone: 0.66, off: ridgeSeed + 31 },
    { base: 730 + rnd() * 50, amp: 130 + rnd() * 60, tone: 1.00, off: ridgeSeed + 67 }
  ];
  const trunks = [];
  const nTrunks = 7 + ((rnd() * 4) | 0);
  for (let i = 0; i < nTrunks; i++){
    trunks.push({
      x: 70 + (i + 0.2 + rnd() * 0.6) * (860 / nTrunks),
      w: 13 + rnd() * 20, top: 260 + rnd() * 340,
      ph: rnd() * TAU, cr: 60 + rnd() * 70
    });
  }
  const waveSeed = rnd() * 100;

  function stars(x, y, limit){
    if (y > limit) return 0;
    const cx = Math.floor(x / 46), cy = Math.floor(y / 46);
    const h = hash2(cx, cy, seedNum);
    if (h < 0.986) return 0;
    const sx = cx * 46 + hash2(cx, cy, seedNum + 1) * 46;
    const sy = cy * 46 + hash2(cx, cy, seedNum + 2) * 46;
    const d = Math.hypot(x - sx, y - sy);
    return d < 2.6 ? 1 : 0;
  }

  const motifs = {
    moon(x, y){
      let d = 0.02;
      const r = Math.hypot(x - 500, y - 290);
      if (r < 150) d = Math.max(d, r < 128 ? 1 : 1 - (r - 128) / 22);
      else if (r < 270) d = Math.max(d, 0.30 * (1 - (r - 150) / 120)); // halo
      if (y > 560 && y < 990){
        const env = Math.exp(-Math.pow((x - 500) / 250, 2)) * (1 - (y - 560) / 460);
        const bands = 0.5 + 0.5 * Math.sin(y * 0.045 + 4 * fbm(x * 0.004, y * 0.004));
        d = Math.max(d, 0.75 * env * (0.3 + 0.7 * bands));
      }
      return Math.max(d, stars(x, y, 500));
    },
    ridges(x, y){
      let d = 0.02;
      for (const r of ridges){
        const ry = r.base + (fbm(x * 0.005, r.off) - 0.5) * 2 * r.amp;
        const band = Math.abs(y - ry);
        if (band < 105) d = Math.max(d, r.tone * Math.pow(1 - band / 105, 1.3));
      }
      // foreground mass below the nearest ridge
      const fr = ridges[2];
      const fy = fr.base + (fbm(x * 0.005, fr.off) - 0.5) * 2 * fr.amp;
      if (y > fy) d = Math.max(d, 0.5 * clamp(1 - (y - fy) / 240, 0, 1));
      return Math.max(d, stars(x, y, 300));
    },
    wave(x, y){
      let d = 0.02;
      // great curling face: arc of a large circle centered below the frame
      const ccx = 500 + (fbm(3.7, waveSeed) - 0.5) * 260;
      const ccy = 1090, R = 620 + (fbm(9.1, waveSeed) - 0.5) * 120;
      const dist = Math.hypot(x - ccx, y - ccy);
      const band = Math.abs(dist - R);
      if (band < 115){
        d = Math.max(d, Math.pow(clamp(1 - band / 115, 0, 1), 0.75));
        if (dist > R + 28 && fbm(x * 0.018, y * 0.018) > 0.60) d = Math.max(d, 0.65);
      } else if (dist > R + 115 && dist < R + 280){
        d = Math.max(d, 0.16 * (1 - (dist - R - 115) / 165)); // trough shadow
      }
      if (y > 865) d = Math.max(d, 0.38 * clamp((y - 865) / 135, 0, 1) + 0.10);
      return Math.max(d, stars(x, y, 260));
    },
    forest(x, y){
      let d = 0.02;
      for (const t of trunks){
        const tx = t.x + 18 * Math.sin(y * 0.008 + t.ph);
        if (Math.abs(x - tx) < t.w / 2 && y > t.top && y < 1005) d = Math.max(d, 0.85);
        const cd = Math.hypot(x - t.x, y - (t.top - 30));
        if (cd < t.cr) d = Math.max(d, 0.6 * Math.pow(1 - cd / t.cr, 0.7));
      }
      if (y > 905) d = Math.max(d, 0.45 * clamp((y - 905) / 95, 0, 1));
      return Math.max(d, stars(x, y, 240));
    }
  };
  return motifs;
}

let points = [], motifName = "";
function generate(){
  const rnd = mulberry32(seed);
  const fbm = makeFbm(makeNoise2D(mulberry32(seed ^ 0x9e37)));
  const motifs = buildMotifs(rnd, fbm, seed);
  const names = ["moon", "ridges", "wave", "forest"];
  const weights = [0.36, 0.30, 0.14, 0.20];
  let pick = rnd(), acc = 0;
  motifName = names[0];
  for (let i = 0; i < names.length; i++){
    acc += weights[i];
    if (pick <= acc){ motifName = names[i]; break; }
  }
  if (motifParam && names.includes(motifParam)) motifName = motifParam;
  const density = motifs[motifName];

  points = [];
  const jrnd = mulberry32(seed ^ 0x51f7);
  let tries = 0;
  while (points.length < TARGET_DOTS && tries < 500000){
    tries++;
    const x = rnd() * VU, y = rnd() * VU;
    let d = density(x, y);
    d *= 0.85 + 0.3 * fbm(x * 0.01, y * 0.01); // organic texture
    if (rnd() < d){
      const amber = jrnd() < 0.12;
      points.push({
        x, y,
        a: 0.08 + 0.16 * d,
        s: 1.0 + jrnd() * 1.8 + 0.8 * d,
        c: amber ? "232,201,143" : "234,223,198"
      });
    }
  }
  // shuffle so the reveal has no spatial bias
  for (let i = points.length - 1; i > 0; i--){
    const j = (jrnd() * (i + 1)) | 0;
    const t = points[i]; points[i] = points[j]; points[j] = t;
  }
}

let ctx, K, drawn = 0, rafId = 0, startT = 0;

function setupCanvas(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  K = S / VU;
  canvas.width = S * dpr; canvas.height = S * dpr;
  ctx = canvas.getContext("2d");
  ctx.setTransform(dpr * K, 0, 0, dpr * K, 0, 0);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, VU, VU);
}

function drawBatch(upto){
  for (; drawn < upto && drawn < points.length; drawn++){
    const p = points[drawn];
    ctx.fillStyle = `rgba(${p.c},${p.a.toFixed(3)})`;
    ctx.fillRect(p.x, p.y, p.s, p.s);
  }
}

function finishFrame(){
  // whisper of vignette to seat the composition
  const vg = ctx.createRadialGradient(500, 500, 360, 500, 500, 780);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.35)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VU, VU);
}

function drawAll(){
  cancelAnimationFrame(rafId);
  drawBatch(points.length);
  finishFrame();
}

function animate(){
  cancelAnimationFrame(rafId);
  const step = now => {
    if (!startT) startT = now;
    const prog = clamp((now - startT) / REVEAL_MS, 0, 1);
    drawBatch(Math.floor(prog * points.length));
    if (prog < 1) rafId = requestAnimationFrame(step);
    else finishFrame();
  };
  rafId = requestAnimationFrame(step);
}

function render(frozenT){
  generate();
  setupCanvas();
  drawn = 0; startT = 0;
  if (Number.isFinite(frozenT)){
    drawBatch(Math.floor(clamp(frozenT, 0, 1) * points.length));
    if (frozenT >= 1) finishFrame();
    return;
  }
  if (reduced) drawAll();
  else animate();
}

window.addEventListener("resize", () => {
  generate();
  setupCanvas();
  drawn = 0;
  drawAll();
});
document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  render();
});
render(Number.isFinite(tParam) ? tParam : undefined);
</script>
</body>
</html>
