<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№8993 · What Isn't There - Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #161310;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    padding: 12px 16px;
    gap: 10px;
  }
  header { text-align: center; max-width: 620px; flex: 0 0 auto; }
  header .kicker {
    font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 8px;
  }
  header h1 { font-size: 23px; font-weight: normal; margin-bottom: 6px; }
  header h1 .num { color: #b0552f; }
  header p { color: #8f8875; font-size: 13px; line-height: 1.55; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    flex: 0 0 auto;
    width: min(92vw, calc((100vh - 190px) * 0.75));
    aspect-ratio: 3 / 4;
    background: #ece3cf;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { flex: 0 0 auto; color: #6b6455; font-size: 12px; font-style: italic; }
  footer a { color: #b0552f; text-decoration: none; }
  /* thumbnail mode: exact 720x720 stage, no chrome */
  body.thumb-mode { padding: 0; gap: 0; }
  body.thumb-mode header, body.thumb-mode footer { display: none; }
  body.thumb-mode #stage {
    width: 720px; height: 720px;
    max-width: none; max-height: none; box-shadow: none; flex: none;
  }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№8993</span> · What Isn't There</h1>
  <p>A poster printed in reverse: one slab of ink, and every word in it is
  carved out, erased, punched through. Nothing was printed here.
  <b>Click the piece for a new variation.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var params = new URLSearchParams(location.search);
if (params.get("thumb")) document.body.classList.add("thumb-mode");

var seed = parseInt(params.get("seed") || "777", 10) || 777;
var canvas = document.getElementById("c");
var stage = document.getElementById("stage");

function fitCanvas(){
  var r = stage.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(2, Math.round(r.width * dpr));
  canvas.height = Math.max(2, Math.round(r.height * dpr));
}

function draw(){
  fitCanvas();
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;
  var rng = mulberry32(seed);

  // Poster is a 3:4 sheet fitted inside the canvas box
  var pw = Math.min(W, H * 0.75), ph = pw * 4 / 3;
  var ox = (W - pw) / 2, oy = (H - ph) / 2;
  var S = pw / 600; // poster drawn in 600x800 local units

  // Wall color behind the sheet
  ctx.fillStyle = "#161310";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(S, S);

  // ---- paper ----
  var pt = 236 + Math.floor(rng() * 10) - 5;
  ctx.fillStyle = "rgb(" + pt + "," + (pt - 5) + "," + (pt - 30) + ")";
  ctx.fillRect(0, 0, 600, 800);

  // paper grain
  for (var g = 0; g < 2600; g++){
    ctx.fillStyle = rng() < 0.5 ? "rgba(120,100,70,0.06)" : "rgba(255,252,240,0.07)";
    ctx.fillRect(rng() * 600, rng() * 800, 1.4, 1.4);
  }

  // ---- ink slab: solid ink with ragged edges, grainy like a punched print ----
  var mx = 46 + rng() * 14;
  var top = 58 + rng() * 22;
  var bot = 712 + rng() * 26;
  // smooth ragged-edge noise: sum of sines with seeded phases
  var ph1 = rng() * 6.28, ph2 = rng() * 6.28, ph3 = rng() * 6.28;
  var amp = 5 + rng() * 7;
  function edgeL(y){ return Math.sin(y * 0.021 + ph1) * amp + Math.sin(y * 0.053 + ph2) * amp * 0.45; }
  function edgeR(y){ return Math.sin(y * 0.017 + ph3) * amp + Math.sin(y * 0.047 + ph1) * amp * 0.45; }
  function inSlab(x, y){
    return y > top - 14 && y < bot + 14 &&
           x > mx + edgeL(y) - 14 && x < 600 - mx + edgeR(y) + 14;
  }

  ctx.fillStyle = "#1a1512";
  ctx.beginPath();
  ctx.moveTo(mx + edgeL(top), top);
  for (var ey0 = top; ey0 <= bot; ey0 += 6) ctx.lineTo(mx + edgeL(ey0), ey0);
  for (var ey1 = bot; ey1 >= top; ey1 -= 6) ctx.lineTo(600 - mx + edgeR(ey1), ey1);
  ctx.closePath();
  ctx.fill();

  // grain over the ink: light and dark flecks so the slab feels printed
  for (var td = 0; td < 9000; td++){
    var tx = mx - 14 + rng() * (600 - 2 * mx + 28);
    var ty = top - 14 + rng() * (bot - top + 28);
    if (!inSlab(tx, ty)) continue;
    ctx.fillStyle = rng() < 0.45 ? "rgba(235,220,195,0.07)" : "rgba(0,0,0,0.28)";
    ctx.beginPath();
    ctx.arc(tx, ty, 0.7 + rng() * 1.4, 0, 6.2832);
    ctx.fill();
  }

  // ---- erasure begins: everything from here is removal ----
  // NOTE: destination-out erases proportionally to the SOURCE ALPHA, so the
  // fill style must be fully opaque here. The texture loop above leaves a
  // translucent fillStyle behind; without this reset every erasure would
  // only partially lift the ink.
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "#000";
  ctx.globalAlpha = 1;

  // punched hole row near the top of the slab
  var hy = top + 66 + rng() * 18;
  var hr = 9 + rng() * 2.5;
  var hsp = 48 + rng() * 10;
  var hx0 = mx + 40 + rng() * 10;
  for (var hx = hx0; hx < 600 - mx - 30; hx += hsp){
    ctx.beginPath();
    ctx.arc(hx, hy + (rng() - 0.5) * 4, hr, 0, 6.2832);
    ctx.fill();
  }

  // ---- headline metrics first (no rng here): band zones must clear the
  // actual rendered headline block, whose size depends on the real font.
  // A band once landed on the top of READ THE because the zone below was
  // a hardcoded guess. Derive the bounds from measured sizes instead.
  function textSize(text, targetW, weight, spacing){
    var reserve = spacing * Math.max(0, text.length - 1);
    try { ctx.letterSpacing = spacing + "px"; } catch (e) {}
    var size = 200;
    ctx.font = weight + " " + size + "px \"Arial Black\", Arial, \"Helvetica Neue\", sans-serif";
    var w = ctx.measureText(text).width || 1;
    try { ctx.letterSpacing = "0px"; } catch (e) {}
    return Math.max(8, Math.floor(size * (targetW - reserve) / w));
  }
  var s1 = textSize("READ THE", 436, "900", -1);
  var s2 = textSize("GAPS", 452, "900", 0);
  // cy jitters add at most +14, so bound with the max cy values
  var headTop = 362 - s1 * 0.45;
  var headBot = 526 + s2 * 0.45;

  // erased horizontal bands (kept clear of the measured headline block)
  var nbands = 3 + Math.floor(rng() * 2);
  var zones = [[top + 118, headTop - 48], [Math.max(584, headBot + 16), bot - 110]];
  var placed = [];
  for (var b = 0; b < nbands; b++){
    var z = zones[b % 2];
    if (z[1] - z[0] < 40) continue; // zone too short for a band here
    var by = 0, bh = 0, ok = false;
    for (var tries = 0; tries < 12 && !ok; tries++){
      by = z[0] + rng() * (z[1] - z[0]);
      bh = 10 + rng() * 24;
      ok = true;
      for (var q = 0; q < placed.length; q++){
        if (Math.abs(by - placed[q].y) < bh + placed[q].h + 20) { ok = false; break; }
      }
    }
    if (!ok) continue;
    placed.push({y: by, h: bh});
    var bx = mx - 6 + rng() * 40;
    var bw = (600 - 2 * mx + 12) * (0.55 + rng() * 0.45);
    if (rng() < 0.3) { bx = mx - 6; bw = 600 - 2 * mx + 12; }
    ctx.fillRect(bx, by, bw, bh);
    // chew the band edges so the erasure reads as rubbed, not ruled
    for (var n = 0; n < 14; n++){
      var nx = bx + rng() * bw;
      ctx.beginPath();
      ctx.arc(nx, by + (rng() < 0.5 ? 0 : bh), 2 + rng() * 5, 0, 6.2832);
      ctx.fill();
    }
  }

  // the headline, carved: read it in what is not there
  function carveText(text, cx, cy, targetW, weight, condense, spacing){
    // letter spacing must be set before measuring, or the text overflows.
    // measureText does not include letter-spacing, so reserve it by hand.
    try { ctx.letterSpacing = spacing + "px"; } catch (e) {}
    var size = 200;
    var reserve = spacing * Math.max(0, text.length - 1);
    ctx.font = weight + " " + size + "px \"Arial Black\", Arial, \"Helvetica Neue\", sans-serif";
    var w = ctx.measureText(text).width;
    size = Math.floor(size * (targetW - reserve) / w);
    ctx.font = weight + " " + size + "px \"Arial Black\", Arial, \"Helvetica Neue\", sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    // hand-erased edges: soft jittered passes, then one crisp pass
    for (var p = 0; p < 3; p++){
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.translate(cx + (rng() - 0.5) * 7, cy + (rng() - 0.5) * 7);
      ctx.scale(condense, 1);
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.translate(cx, cy);
    ctx.scale(condense, 1);
    ctx.fillText(text, 0, 0);
    ctx.restore();
    try { ctx.letterSpacing = "0px"; } catch (e) {}
    ctx.globalAlpha = 1;
  }

  carveText("READ THE", 300, 348 + rng() * 14, 436, "900", 0.86, -1);
  carveText("GAPS", 300, 512 + rng() * 14, 452, "900", 0.84, 0);
  carveText("no words were printed here", 300, bot - 52, 400, "600", 1, 5);

  // scattered erasure speckle across the slab
  for (var s = 0; s < 150; s++){
    var sy = top + rng() * (bot - top);
    var sx = mx + edgeL(sy) + rng() * (600 - 2 * mx + edgeR(sy) - edgeL(sy));
    ctx.globalAlpha = 0.35 + rng() * 0.5;
    ctx.beginPath();
    ctx.arc(sx, sy, 0.8 + rng() * 2.4, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ragged erasure bites along the slab's left and right edges
  for (var e = 0; e < 60; e++){
    var ey = top + rng() * (bot - top);
    var ex = rng() < 0.5 ? mx + edgeL(ey) : 600 - mx + edgeR(ey);
    ctx.globalAlpha = 0.5 + rng() * 0.5;
    ctx.beginPath();
    ctx.arc(ex + (rng() - 0.5) * 10, ey, 2 + rng() * 6, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.globalCompositeOperation = "source-over";
  ctx.restore();
}

draw();

var rT = null;
window.addEventListener("resize", function(){
  if (rT) clearTimeout(rT);
  rT = setTimeout(draw, 150);
});

stage.addEventListener("click", function(){
  seed = (Math.random() * 1e9) | 0;
  var u = new URL(location.href);
  u.searchParams.set("seed", String(seed));
  history.replaceState(null, "", u);
  draw();
});
</script>
</body>
</html>
