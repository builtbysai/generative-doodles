<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mismatched Karaoke</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: #14101A; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- deterministic seeded random (integer hash only) ----------
  function hash(n) {
    var x = (n * 2654435761) >>> 0;
    x ^= x >>> 13; x = (x * 1274126177) >>> 0; x ^= x >>> 16;
    return x / 4294967295;
  }
  function seeded(a, b) { return hash(a * 1000003 + b * 9176 + 7); }

  // ---------- viewport ----------
  var W = 0, H = 0, phone = false;
  function size() {
    var vw = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.width : window.innerWidth;
    var vh = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = Math.round(vw); canvas.height = Math.round(vh);
    canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
    var minDim = Math.min(window.screen.width, window.screen.height);
    phone = (minDim < 700) || (H > W * 1.15);
    if (typeof document !== 'undefined' && document.body) document.body.style.background = '#14101A';
  }
  size();
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', size);
    visualViewport.addEventListener('scroll', size);
  }
  window.addEventListener('resize', size);

  // ---------- song data: original nonsense verses, never copyrighted ----------
  // Each verse: English line, romanized Korean line, and mistranslation ladders.
  // Level 0 is close, level 1 is off, level 2 is gloriously wrong.
  var VERSES = [
    { en: ["the moon rides a yellow bus to Denver", "the moon missed its stop and stayed for pie", "the moon bought a ticket it cannot read"],
      kr: ["dal-i noseo beoseu-reul tago Denver-e ga", "dal-i jeongnyujang-e seo tteok-eul meokda", "dal-i pyo-reul sasseuna ilkji mothanda"] },
    { en: ["my shoes remember every road in Seoul", "my shoes took the long way home again", "my shoes are tired of my own two feet"],
      kr: ["nae sinbal-eun Seoul-ui modeun gil-eul gieokhanda", "nae sinbal-eun meon gil-eulo jip-e ganda", "nae sinbal-eun nae bal-e jigyeotda"] },
    { en: ["the river hums a song nobody taught it", "the river keeps the tune and loses the words", "the river sings to the laundry on the line"],
      kr: ["gang-i amudo gareuchiji anheun norae-reul heung-eorinda", "gang-i gokjo-neun namgigo gasa-neun ilheobeorinda", "gang-i 빨랫줄-e norae-reul bureunda"] },
    { en: ["we counted stars and lost count at seven", "we counted stars and named the seventh one bus", "we counted stars and the stars counted us"],
      kr: ["uri-neun byeol-eul semyeo ilgop-eseo nohchyeotda", "uri-neun byeol-eul semyeo ilgop beonjjae-e beoseu-rago bulleotda", "uri-neun byeol-eul semyeo byeol-i uri-reul semyeotda"] }
  ];
  // Fix verse 3 Korean line: keep romanization consistent (no Hangul mixing).
  VERSES[2].kr[2] = "gang-i ppallaetjul-e norae-reul bureunda";

  var VERSE_DUR = 24; // seconds per verse
  var corrections = {}; // verseIndex -> count of "corrections"
  var scrub = 0; // accumulated drag scrub, event-driven only

  function wordsOf(s) { return s.split(' '); }

  // syllable-ish hops: split a word into vowel-cluster hops for the bouncing ball
  function hopsOf(word) {
    var m = word.toLowerCase().match(/[^aeiouy]*[aeiouy]+[^aeiouy]*/g);
    if (!m || m.length === 0) return [word];
    return m;
  }
  function hopList(line) {
    var out = [];
    var ws = wordsOf(line);
    for (var i = 0; i < ws.length; i++) {
      var hs = hopsOf(ws[i]);
      for (var j = 0; j < hs.length; j++) out.push({ word: i, text: hs[j] });
    }
    return out;
  }

  // ---------- pointer: tap corrects (mistranslates harder), drag scrubs ----------
  var downX = 0, downY = 0, downT = 0, dragging = false, lastX = 0;
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e); downX = p.x; downY = p.y; lastX = p.x; dragging = false; downT = performance.now();
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pos(e);
    if (Math.abs(p.x - downX) > 8 || Math.abs(p.y - downY) > 8) dragging = true;
    if (dragging) { scrub += (p.x - lastX) * 1.5; }
    lastX = p.x;
  });
  canvas.addEventListener('pointerup', function (e) {
    var p = pos(e);
    var moved = Math.abs(p.x - downX) + Math.abs(p.y - downY);
    if (!dragging && moved < 12) {
      // tap: if inside the subtitle band, "correct" the current verse
      var bandTop = H * 0.66;
      if (p.y >= bandTop) {
        var t = elapsed();
        var vi = Math.floor(t / VERSE_DUR) % VERSES.length;
        corrections[vi] = (corrections[vi] || 0) + 1;
      }
    }
    dragging = false;
  });

  // ---------- time: fixed phase at load, rAF anchored to load ----------
  var loadT = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance === 'undefined' || !performance.now) return 0;
    return (performance.now() - loadT) / 1000;
  }

  // ---------- lane drawing ----------
  function drawColorado(y0, y1, off) {
    var lh = y1 - y0;
    ctx.fillStyle = '#A8C4CE'; ctx.fillRect(0, y0, W, lh); // big sky
    // sun: flat disc
    var sunX = W * 0.78, sunY = y0 + lh * 0.28, sunR = lh * 0.16;
    ctx.fillStyle = '#F2D24B';
    ctx.beginPath(); ctx.moveTo(sunX + sunR, sunY); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.fill();
    // ground
    ctx.fillStyle = '#C9A86A'; ctx.fillRect(0, y0 + lh * 0.72, W, lh * 0.28);
    // mesas: repeating seeded segments
    var segW = 340, start = Math.floor(off / segW) - 1;
    for (var i = start; i * segW < off + W + segW; i++) {
      var x = i * segW - off;
      var h1 = seeded(i, 11), h2 = seeded(i, 23);
      var mh = lh * (0.22 + h1 * 0.22);
      var mw = segW * (0.35 + h2 * 0.3);
      var my = y0 + lh * 0.72 - mh;
      ctx.fillStyle = (i % 2 === 0) ? '#A85438' : '#7E3B28';
      ctx.beginPath();
      ctx.moveTo(x, y0 + lh * 0.72);
      ctx.lineTo(x + mw * 0.18, my);
      ctx.lineTo(x + mw * 0.82, my);
      ctx.lineTo(x + mw, y0 + lh * 0.72);
      ctx.closePath(); ctx.fill();
      // flat cap highlight
      ctx.fillStyle = '#C97A52';
      ctx.fillRect(x + mw * 0.18, my, mw * 0.64, lh * 0.03);
    }
  }

  function drawSeoul(y0, y1, off) {
    var lh = y1 - y0;
    ctx.fillStyle = '#241F33'; ctx.fillRect(0, y0, W, lh); // night sky
    // small stars: flat dots
    for (var s = 0; s < 26; s++) {
      var sx = seeded(s, 5) * W, sy = y0 + seeded(s, 9) * lh * 0.4;
      ctx.fillStyle = '#EDEDE6';
      ctx.fillRect(sx, sy, 2, 2);
    }
    // ground
    ctx.fillStyle = '#1A1626'; ctx.fillRect(0, y0 + lh * 0.78, W, lh * 0.22);
    var segW = 300, start = Math.floor(off / segW) - 1;
    for (var i = start; i * segW < off + W + segW; i++) {
      var x = i * segW - off;
      var h1 = seeded(i, 31), h2 = seeded(i, 47);
      var pw = segW * (0.4 + h1 * 0.3);
      var ph = lh * (0.3 + h2 * 0.25);
      var py = y0 + lh * 0.78 - ph;
      // palace body
      ctx.fillStyle = '#3A3350';
      ctx.fillRect(x, py, pw, ph);
      // upturned roof: flat trapezoid + corner flicks
      ctx.fillStyle = '#2E5FA3';
      ctx.beginPath();
      ctx.moveTo(x - pw * 0.08, py + ph * 0.12);
      ctx.lineTo(x + pw * 0.5, py - ph * 0.18);
      ctx.lineTo(x + pw * 1.08, py + ph * 0.12);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#E0457B';
      ctx.fillRect(x + pw * 0.1, py + ph * 0.35, pw * 0.12, ph * 0.4);
      ctx.fillStyle = '#45C8E0';
      ctx.fillRect(x + pw * 0.7, py + ph * 0.3, pw * 0.1, ph * 0.45);
    }
  }

  // ---------- main draw ----------
  function draw(t) {
    ctx.fillStyle = '#14101A'; ctx.fillRect(0, 0, W, H);
    var laneH = H * 0.33;
    var divY = laneH;
    var coOff = ((t * 22 + scrub) % 340 + 340) % 340;
    var seOff = ((t * 17 + scrub) % 300 + 300) % 300;
    // lanes scroll with a full-world offset so segments tile
    var coWorld = (t * 22 + scrub);
    var seWorld = (t * 17 + scrub);
    drawColorado(0, laneH, ((coWorld % 340) + 340) % 340);
    // divider
    ctx.fillStyle = '#EDEDE6'; ctx.fillRect(0, divY, W, 2);
    drawSeoul(laneH + 2, laneH * 2 + 2, ((seWorld % 300) + 300) % 300);

    // subtitle band
    var bandTop = H * 0.66;
    ctx.fillStyle = '#1E1A2A'; ctx.fillRect(0, bandTop, W, H - bandTop);
    ctx.fillStyle = '#E0457B'; ctx.fillRect(0, bandTop, W, 2);

    var loopCount = Math.floor(t / VERSE_DUR);
    var vi = loopCount % VERSES.length;
    var vt = t % VERSE_DUR;
    var corr = corrections[vi] || 0;
    var level = Math.min(2, corr + Math.floor(loopCount / 3));
    var enLine = VERSES[vi].en[level];
    var krLine = VERSES[vi].kr[level];
    // Korean desync grows with loop count and corrections
    var desync = loopCount * 2 + corr * 1.5;
    var krT = ((vt - desync) % VERSE_DUR + VERSE_DUR) % VERSE_DUR;

    var fs = phone ? Math.max(13, W * 0.032) : Math.max(16, Math.min(30, W * 0.02));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    // English line with bouncing ball
    var enHops = hopList(enLine);
    var enY = bandTop + (H - bandTop) * 0.32;
    ctx.font = 'bold ' + fs + 'px Georgia, serif';
    ctx.fillStyle = '#F2D24B';
    ctx.fillText(enLine, W / 2, enY);
    // ball position: hop index from clock
    var hopDur = VERSE_DUR / enHops.length;
    var hopIdx = Math.min(enHops.length - 1, Math.floor(vt / hopDur));
    var hopPhase = (vt % hopDur) / hopDur;
    var textW = ctx.measureText(enLine).width;
    var startX = W / 2 - textW / 2;
    var ballX = startX + (hopIdx + hopPhase) / enHops.length * textW;
    var ballY = enY - fs * 1.15 - Math.abs(Math.sin(Math.PI * hopPhase)) * fs * 0.5;
    ctx.fillStyle = '#F2D24B';
    var br = fs * 0.28;
    ctx.beginPath(); ctx.moveTo(ballX + br, ballY); ctx.arc(ballX, ballY, br, 0, Math.PI * 2); ctx.fill();

    // Korean line, desynced: current hop underlined in cyan
    var krHops = hopList(krLine);
    var krY = bandTop + (H - bandTop) * 0.62;
    ctx.font = fs * 0.92 + 'px Georgia, serif';
    ctx.fillStyle = '#EDEDE6';
    ctx.fillText(krLine, W / 2, krY);
    var krHopDur = VERSE_DUR / krHops.length;
    var krHopIdx = Math.min(krHops.length - 1, Math.floor(krT / krHopDur));
    var krTextW = ctx.measureText(krLine).width;
    var krStartX = W / 2 - krTextW / 2;
    var krBallX = krStartX + (krHopIdx + 0.5) / krHops.length * krTextW;
    ctx.fillStyle = '#45C8E0';
    ctx.fillRect(krBallX - fs * 0.3, krY + fs * 0.7, fs * 0.6, 2);

    // hint
    ctx.font = Math.max(11, fs * 0.55) + 'px Georgia, serif';
    ctx.fillStyle = 'rgba(237,237,230,0.55)';
    ctx.fillText('tap a line to correct it · drag to scrub', W / 2, bandTop + (H - bandTop) * 0.88);
  }

  draw(0);
  function loop() {
    draw(elapsed());
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
