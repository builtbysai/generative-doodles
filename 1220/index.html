<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rotterdam Tower</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0E1A; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: ew-resize; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- №1220 "Rotterdam Tower" — Clint Enns study block CE5 ----
  // A fixed-frame observation of a tower in a low-fi game engine: flat-shaded
  // blocks, a skybox with a visible seam, a compressed Liberty City night.
  // The framing never moves. Nothing happens, on purpose. Drag sideways to
  // scrub time; the tower stays, the lights change.

  var T0 = 190;                // fixed phase of the synchronous first frame (seconds into the cycle)
  var CYCLE = 868;             // 14:28 — the full cycle, his Rotterdam Tower runtime
  var SPAN_MIN = 396;          // game minutes in the cycle: 8:06 PM -> 2:42 AM (6h36m)
  var START_MIN = 20 * 60 + 6; // 20:06 in minutes from midnight

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;

  function isPhone(w, h) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return sw < 700 || h > w * 1.15;
  }

  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawCurrent() { draw(uNow()); }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); drawCurrent(); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); drawCurrent(); });
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---- seeded rng (mulberry32): all layout/light data derives from it ----
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1220);

  // ---- stars: seeded points in the sky, revealed as darkness steps in ----
  var STARS = [];
  for (var si = 0; si < 140; si++) {
    STARS.push({ x: rng(), y: rng() * 0.78, b: 0.25 + rng() * 0.75, s: rng() < 0.12 ? 2 : 1 });
  }

  // ---- windows: each has a hashed lights-on game time; some go dark after 1 AM ----
  // g = game minutes since 20:06, range [0, 396]. 1 AM is g = 294.
  function makeWindows(cols, rows) {
    var ws = [];
    for (var i = 0; i < cols * rows; i++) {
      var never = rng() < 0.12;
      var on = 4 + rng() * 126;                    // lights come on across the early evening
      var off = (rng() < 0.40) ? 294 + rng() * 90 : -1; // 40% thin out after 1 AM
      var tv = rng() < 0.10;                       // a few burn cool white instead of sodium
      ws.push({ never: never, on: on, off: off, tv: tv });
    }
    return ws;
  }
  var TOWER_WIN = makeWindows(8, 20);   // main slab front: 8 x 20
  var SET_WIN = makeWindows(4, 4);      // setback front: 4 x 4
  var NB_WIN_L = makeWindows(3, 6);     // neighbour blocks
  var NB_WIN_R = makeWindows(3, 5);

  function winLit(w, g) {
    if (w.never) return false;
    if (g < w.on) return false;
    if (w.off >= 0 && g >= w.off) return false;
    return true;
  }

  // ---- cars: seeded schedule in cycle seconds; a crossing every ~50-90 s ----
  var CARS = [];
  (function () {
    var crng = mulberry32(122001);
    var s = 14;
    while (s < CYCLE - 8) {
      CARS.push({ start: s, dir: (CARS.length % 2 === 0) ? 1 : -1 });
      s += 6 + 50 + crng() * 40;   // 6 s crossing + 50-90 s gap
    }
  })();
  var CAR_DUR = 6;

  // ---- sky: four flat deepening steps from dusk to full night by 21:30 ----
  // Each step: [main face, top skybox face, top-right skybox face, star visibility]
  var SKY = [
    ['#3A4A7A', '#46588C', '#3F5180', 0.00],   // g < 18   dusk
    ['#27335C', '#303E6C', '#2A3862', 0.30],   // g < 40
    ['#182242', '#1F2A4F', '#1B2647', 0.60],   // g < 62
    ['#0F1529', '#141B33', '#11182D', 0.85],   // g < 84
    ['#0A0E1A', '#0D1220', '#0B0F1C', 1.00]    // g >= 84  full night
  ];
  function skyStep(g) {
    if (g < 18) return 0;
    if (g < 40) return 1;
    if (g < 62) return 2;
    if (g < 84) return 3;
    return 4;
  }

  // ---- time: anchored phase + elapsed, plus the visitor's scrub offset ----
  function nowMs() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return Date.now();
  }
  var startWall = nowMs();
  var scrubCommitted = 0;      // seconds of cycle time added by finished drags
  var dragState = null;        // {startX, dx} while a scrub drag is live

  function wallNow() { return (nowMs() - startWall) / 1000; }
  function uNow() {
    var off = scrubCommitted + (dragState ? dragState.dx * 0.8 : 0);
    var u = (T0 + wallNow() + off) % CYCLE;
    return u < 0 ? u + CYCLE : u;
  }

  function pointerPos(e) {
    var x = (e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0));
    var y = (e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0));
    return [x, y];
  }
  function onDown(e) {
    var p = pointerPos(e);
    dragState = { startX: p[0], dx: 0 };
  }
  function onMove(e) {
    if (!dragState) return;
    var p = pointerPos(e);
    dragState.dx = p[0] - dragState.startX;
  }
  function onUp() {
    if (!dragState) return;
    scrubCommitted += dragState.dx * 0.8;   // the cycle resumes from the scrubbed point
    dragState = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    canvas.addEventListener('touchmove', onMove, { passive: true });
    canvas.addEventListener('touchend', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  // ---- drawing ----
  function drawWindows(wins, cols, rows, x0, y0, x1, y1, g) {
    var cw = (x1 - x0) / cols, ch = (y1 - y0) / rows;
    var ww = Math.max(2, cw * 0.52), wh = Math.max(2, ch * 0.5);
    var lit = 0;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var w = wins[r * cols + c];
        var x = x0 + c * cw + (cw - ww) / 2;
        var y = y0 + r * ch + (ch - wh) / 2;
        if (winLit(w, g)) {
          ctx.fillStyle = w.tv ? '#E8ECF0' : '#FF9E2C';
          lit++;
        } else {
          ctx.fillStyle = '#43434B';
        }
        ctx.fillRect(x, y, ww, wh);
      }
    }
    return lit;
  }

  function draw(u) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var g = (u / CYCLE) * SPAN_MIN;                 // game minutes since 20:06
    var totalMin = START_MIN + Math.floor(g);       // minutes from midnight
    var step = skyStep(g);
    var sky = SKY[step];

    var groundTop = H * 0.80;
    var base = H * 0.94;                            // where buildings sit
    var seamY = H * 0.12;
    var seamX = W * 0.78;

    // -- skybox: flat faces with the seam left visible --
    ctx.fillStyle = sky[0];
    ctx.fillRect(0, 0, W, groundTop);
    ctx.fillStyle = sky[1];
    ctx.fillRect(0, 0, seamX, seamY);
    ctx.fillStyle = sky[2];
    ctx.fillRect(seamX, 0, W - seamX, seamY);
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.fillRect(0, seamY, W, 1);                   // the horizontal seam
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(seamX, 0, 1, groundTop);           // the vertical seam

    // -- stars --
    if (sky[3] > 0) {
      for (var si = 0; si < STARS.length; si++) {
        var st = STARS[si];
        var a = sky[3] * st.b;
        if (a <= 0.03) continue;
        ctx.fillStyle = 'rgba(232,236,240,' + a.toFixed(3) + ')';
        ctx.fillRect(st.x * W, st.y * groundTop, st.s, st.s);
      }
    }

    // -- ground and street --
    ctx.fillStyle = '#0C0C10';
    ctx.fillRect(0, groundTop, W, H - groundTop);
    ctx.fillStyle = '#12121A';
    ctx.fillRect(0, H * 0.925, W, H * 0.075);

    // -- tower geometry --
    var tw = clamp(W * 0.20, 84, 230);              // front face width
    var depth = tw * 0.38;                          // side face slant
    var lift = depth * 0.4;                         // side face rises by this much
    var fx0 = W / 2 - tw / 2, fx1 = fx0 + tw;
    var slabTop = base - H * 0.58;
    var setW = tw * 0.62;
    var sx0 = fx0 + tw * 0.14, sx1 = sx0 + setW;
    var setTop = slabTop - H * 0.09;
    var sDepth = depth * 0.7, sLift = lift * 0.7;

    // -- hard shadow on the ground, thrown left, length breathing with the hour --
    var shadowLen = tw * (1.1 + 0.7 * Math.sin((g / SPAN_MIN) * Math.PI));
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.moveTo(fx0, base);
    ctx.lineTo(fx0 - shadowLen, base + H * 0.018);
    ctx.lineTo(fx1 + depth, base + H * 0.018);
    ctx.lineTo(fx1 + depth, base);
    ctx.closePath();
    ctx.fill();

    // -- neighbour blocks (static skyline) --
    ctx.fillStyle = '#23232C';
    ctx.fillRect(W * 0.055, base - H * 0.30, W * 0.155, H * 0.30);
    ctx.fillStyle = '#1B1B23';
    ctx.fillRect(W * 0.815, base - H * 0.235, W * 0.14, H * 0.235);
    drawWindows(NB_WIN_L, 3, 6, W * 0.075, base - H * 0.28, W * 0.19, base - H * 0.03, g);
    drawWindows(NB_WIN_R, 3, 5, W * 0.83, base - H * 0.215, W * 0.94, base - H * 0.03, g);

    // -- tower: flat-shaded boxes --
    // main slab: side, top, front
    ctx.fillStyle = '#565660';
    ctx.beginPath();
    ctx.moveTo(fx1, slabTop); ctx.lineTo(fx1 + depth, slabTop - lift);
    ctx.lineTo(fx1 + depth, base - lift); ctx.lineTo(fx1, base);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7A7A82';
    ctx.beginPath();
    ctx.moveTo(fx0, slabTop); ctx.lineTo(fx0 + depth, slabTop - lift);
    ctx.lineTo(fx1 + depth, slabTop - lift); ctx.lineTo(fx1, slabTop);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6A6A72';
    ctx.fillRect(fx0, slabTop, tw, base - slabTop);
    // setback block
    ctx.fillStyle = '#565660';
    ctx.beginPath();
    ctx.moveTo(sx1, setTop + (slabTop - setTop)); // side starts at slabTop level on front edge
    ctx.lineTo(sx1, setTop);
    ctx.lineTo(sx1 + sDepth, setTop - sLift);
    ctx.lineTo(sx1 + sDepth, slabTop - sLift);
    ctx.lineTo(sx1, slabTop);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7A7A82';
    ctx.beginPath();
    ctx.moveTo(sx0, setTop); ctx.lineTo(sx0 + sDepth, setTop - sLift);
    ctx.lineTo(sx1 + sDepth, setTop - sLift); ctx.lineTo(sx1, setTop);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6A6A72';
    ctx.fillRect(sx0, setTop, setW, slabTop - setTop);
    // antenna + sodium warning dot
    var antX = sx0 + setW * 0.5;
    ctx.fillStyle = '#4A4A52';
    ctx.fillRect(antX - 1, setTop - H * 0.055, 2, H * 0.055);
    ctx.fillStyle = (Math.floor(u * 0.6) % 2 === 0) ? '#FF9E2C' : 'rgba(255,158,44,0.25)';
    ctx.fillRect(antX - 2, setTop - H * 0.055 - 4, 4, 4);

    // -- windows --
    var litMain = drawWindows(TOWER_WIN, 8, 20, fx0 + tw * 0.07, slabTop + H * 0.02, fx1 - tw * 0.07, base - H * 0.015, g);
    var litSet = drawWindows(SET_WIN, 4, 4, sx0 + setW * 0.09, setTop + H * 0.012, sx1 - setW * 0.09, slabTop - H * 0.008, g);
    var litFrac = (litMain + litSet) / (TOWER_WIN.length + SET_WIN.length);

    // -- sodium glow pooling at the base (flat wash, no bloom) --
    if (litFrac > 0.02) {
      ctx.fillStyle = 'rgba(255,158,44,' + (0.17 * litFrac).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(fx0 - tw * 0.25, base);
      ctx.lineTo(fx1 + depth + tw * 0.25, base);
      ctx.lineTo(fx1 + depth + tw * 0.65, H);
      ctx.lineTo(fx0 - tw * 0.65, H);
      ctx.closePath(); ctx.fill();
    }

    // -- the car: the biggest event this frame allows --
    for (var ci = 0; ci < CARS.length; ci++) {
      var car = CARS[ci];
      if (u < car.start || u > car.start + CAR_DUR) continue;
      var p = (u - car.start) / CAR_DUR;
      var carW = clamp(W * 0.055, 30, 70);
      var carH = carW * 0.34;
      var carY = H * 0.962 - carH;
      var carX = car.dir > 0 ? (-carW - 20) + p * (W + 2 * carW + 40)
                             : (W + 20) - p * (W + 2 * carW + 40);
      ctx.fillStyle = '#2A2A33';
      ctx.fillRect(carX, carY + carH * 0.38, carW, carH * 0.62);
      ctx.fillRect(carX + carW * 0.22, carY, carW * 0.52, carH * 0.45);
      var frontX = car.dir > 0 ? carX + carW - 3 : carX;
      var rearX = car.dir > 0 ? carX : carX + carW - 3;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(frontX, carY + carH * 0.55, 3, 3);
      ctx.fillRect(frontX, carY + carH * 0.8, 3, 3);
      ctx.fillStyle = '#FF9E2C';
      ctx.fillRect(rearX, carY + carH * 0.55, 3, 3);
      ctx.fillRect(rearX, carY + carH * 0.8, 3, 3);
    }

    // -- the clock: Liberty City time, stepping once per game minute --
    var hh = Math.floor(totalMin / 60) % 24;
    var mm = totalMin % 60;
    var ap = hh >= 12 ? 'PM' : 'AM';
    var h12 = hh % 12; if (h12 === 0) h12 = 12;
    var label = 'LIBERTY CITY ' + (h12 < 10 ? '0' : '') + h12 + ':' + (mm < 10 ? '0' : '') + mm + ' ' + ap;
    var fs = Math.round(clamp(W * 0.016, 12, 19));
    ctx.font = fs + 'px monospace';
    var twd = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(5,6,10,0.72)';
    ctx.fillRect(10, H - fs - 20, twd + 16, fs + 12);
    ctx.fillStyle = '#C8CCD4';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(label, 18, H - 14);
  }

  resize();
  draw(T0);   // synchronous fixed-phase first frame

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(uNow());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
