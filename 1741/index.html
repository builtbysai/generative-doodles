<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waver</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0A08; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0B0A08';
var PLATE = '#141210';
var PLATE_LINE = 'rgba(243,235,216,0.30)';
var TITLE_INK = '#F3EBD8';
var HINT_INK = 'rgba(243,235,216,0.75)';
var BONE = '#E8E2D4';
var WARM = '#F3EBD8';
var ROWS = 7;
var COLS = 48;
var TAKE_LEN = 180;
var DIM_LEN = 0.9;
var SEED0 = 1741;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* deterministic per-tick hash, so no tick ever lands exactly on the grid */
function tickHash(c, r, salt) {
  var h = (c * 374761393 + r * 668265263 + salt * 2246822519) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return ((h >>> 0) / 4294967296);
}
function cssHex(hex, a) {
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* optional ?seed=N query param: QA only, shifts the take seed base */
var seedBase = SEED0;
try {
  var locSearch = '';
  try { locSearch = (typeof location !== 'undefined' && location.search) || ''; } catch (e) { locSearch = ''; }
  var seedM = /[?&]seed=(\d+)/.exec(locSearch);
  if (seedM) seedBase = SEED0 + parseInt(seedM[1], 10) * 7919;
} catch (e) { seedBase = SEED0; }
var simTime = 0;
var takeIndex = 0;
var takeStart = 0;
var phases = null;
var prevPhases = null;
function makePhases(take) {
  var rng = mulberry32(seedBase + take * 7919);
  var p = [];
  var r;
  for (r = 0; r < ROWS; r++) {
    p.push({
      a1: 0.22 + rng() * 0.14,
      a2: 0.08 + rng() * 0.08,
      p1: rng() * TAU,
      p2: rng() * TAU,
      p3: rng() * TAU,
      b1: 0.10 + rng() * 0.10,
      b2: 0.05 + rng() * 0.06
    });
  }
  return p;
}
function startTake(take) {
  prevPhases = phases;
  takeIndex = take;
  takeStart = simTime;
  phases = makePhases(take);
}
phases = makePhases(0);
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* field: full-bleed on phones, a centered square on desktop.
   Both keep clear of the title plate at top left and the hint
   plate at bottom left, so no tick hides behind a plate. */
function field() {
  if (isPhone) return { x: 0, y: 64, w: VW, h: VH - 104 };
  var s = Math.min(VW, VH) * 0.94;
  var fx = (VW - s) / 2, fy = (VH - s) / 2;
  if (fx < 124 && fy < 64) {
    s = VH - 136;
    fx = (VW - s) / 2; fy = (VH - s) / 2;
  }
  return { x: fx, y: fy, w: s, h: s };
}
/* dim factor: a brief dip at the start of each take, never a cut */
function dimAt(t) {
  var u = (t - takeStart) / DIM_LEN;
  if (u <= 0 || u >= 1) return 1;
  return 1 - 0.7 * Math.sin(Math.PI * u);
}
/* tick offset for one row at nominal x: low-frequency wander plus a
   per-tick hash nudge, so no tick ever snaps exactly to the grid */
function wander(ph, x, lam1, lam2) {
  return ph.a1 * Math.sin(TAU * x / lam1 + ph.p1) +
         ph.a2 * Math.sin(TAU * x / lam2 + ph.p2);
}
function drawTicks(ph, F, colW, rowH, color, alpha) {
  var r, c, x0, y0, ox, oy, jx, jy, th, tw;
  ctx.fillStyle = cssHex(color, alpha);
  for (r = 0; r < ROWS; r++) {
    y0 = F.y + (r + 0.5) * rowH;
    for (c = 0; c < COLS; c++) {
      x0 = F.x + (c + 0.5) * colW;
      ox = wander(ph[r], x0 - F.x, F.w * 0.38, F.w * 0.13) * colW +
           (tickHash(c, r, 11) - 0.5) * 2.4;
      oy = (ph[r].b1 * Math.sin(TAU * (x0 - F.x) / (F.w * 0.29) + ph[r].p3) +
            ph[r].b2 * Math.sin(TAU * (x0 - F.x) / (F.w * 0.11) + ph[r].p1)) * rowH +
           (tickHash(c, r, 23) - 0.5) * 2.0;
      th = rowH * 0.52;
      tw = Math.max(1.5, colW * 0.14);
      ctx.fillRect(x0 + ox - tw / 2, y0 + oy - th / 2, tw, th);
    }
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var F = field();
  var colW = F.w / COLS, rowH = F.h / ROWS;
  var r, c;
  /* ghosted grid lines behind the field, so the waver is readable */
  ctx.strokeStyle = 'rgba(232,226,212,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (c = 0; c <= COLS; c++) {
    var gx = F.x + c * colW;
    ctx.moveTo(gx, F.y);
    ctx.lineTo(gx, F.y + F.h);
  }
  for (r = 0; r <= ROWS; r++) {
    var gy = F.y + r * rowH;
    ctx.moveTo(F.x, gy);
    ctx.lineTo(F.x + F.w, gy);
  }
  ctx.stroke();
  /* fading ghost of the previous take, in bone white, so the new
     waver reads against the one it replaces */
  var ghostAge = simTime - takeStart;
  if (prevPhases && ghostAge < 1.5) {
    drawTicks(prevPhases, F, colW, rowH, BONE, 0.35 * (1 - ghostAge / 1.5));
  }
  /* the current take, in slightly warmer white */
  drawTicks(phases, F, colW, rowH, WARM, 0.95);
  drawPlates();
  /* the take-change dimming, laid over the whole frame */
  var dim = dimAt(simTime);
  if (dim < 1) {
    ctx.fillStyle = 'rgba(0,0,0,' + ((1 - dim) * 0.7).toFixed(4) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  while (titlePx > 9 && ctx.measureText('Waver').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  }
  var titleW = ctx.measureText('Waver').width;
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var dateW = ctx.measureText('2006 · 10 · 18').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  ctx.fillText('Waver', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 18', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap for a new take.';
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function newTake() {
  startTake(takeIndex + 1);
  draw();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { simTime = t; draw(); },
    newTake: function () { newTake(); },
    takeIndex: function () { return takeIndex; },
    dimAt: dimAt,
    simTime: function () { return simTime; }
  };
}
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('pointerdown', newTake);
}
/* ---- frame one: take 0, fixed seed, fixed phase ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) {
        simTime += dt;
        if (simTime - takeStart >= TAKE_LEN) startTake(takeIndex + 1);
        draw();
      }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
