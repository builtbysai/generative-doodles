<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report: Limitations</title>
<style>
  html, body { margin: 0; padding: 0; background: #3a3a3a; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');

  // Seeded PRNG (mulberry32). All randomness flows from fixed seeds, never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Deterministic grain value for one block at one quantized time index.
  function grainHash(bx, by, q) {
    var r = mulberry32(1365000 + bx * 7919 + by * 104729 + q * 1299709);
    return r();
  }

  var LOOP = 228;          // 3:48 loop, seconds
  var PAGE_SPAN = 22.8;    // one page-flash slot per page of the 10-page score
  var BLOCK = 8;           // grain block size, px
  var touches = [];        // recorded touch flashes: {x, y, t0, seed}
  var nowT = 0;            // current piece time, seconds
  var W = 0, H = 0;

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (typeof window !== 'undefined' ? window.innerWidth : 800);
    var h = vv ? vv.height : (typeof window !== 'undefined' ? window.innerHeight : 600);
    W = Math.max(1, Math.floor(w)); H = Math.max(1, Math.floor(h));
    cv.width = W; cv.height = H;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  size();

  // One invented pseudo-script glyph. Every shape gets its own path
  // (node-canvas renders batched arcs as connected polygons).
  function glyph(type, x, y, s, color) {
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1, s * 0.12);
    ctx.lineCap = 'square';
    ctx.beginPath();
    if (type === 0) { ctx.moveTo(x - s * 0.5, y); ctx.lineTo(x + s * 0.5, y); }
    else if (type === 1) { ctx.moveTo(x - s * 0.4, y + s * 0.3); ctx.lineTo(x, y - s * 0.3); ctx.lineTo(x + s * 0.4, y + s * 0.3); }
    else if (type === 2) { ctx.arc(x, y + s * 0.2, s * 0.4, Math.PI, 0); }
    else if (type === 3) {
      ctx.fillRect(x - s * 0.35, y - s * 0.1, s * 0.2, s * 0.2);
      ctx.fillRect(x + s * 0.15, y - s * 0.1, s * 0.2, s * 0.2);
    }
    else if (type === 4) {
      ctx.moveTo(x - s * 0.45, y + s * 0.25); ctx.lineTo(x - s * 0.15, y - s * 0.25);
      ctx.lineTo(x + s * 0.15, y + s * 0.25); ctx.lineTo(x + s * 0.45, y - s * 0.25);
    }
    else if (type === 5) {
      for (var i = -1; i <= 1; i++) for (var j = -1; j <= 1; j++)
        ctx.fillRect(x + i * s * 0.3 - s * 0.08, y + j * s * 0.3 - s * 0.08, s * 0.16, s * 0.16);
    }
    else if (type === 6) {
      ctx.moveTo(x, y - s * 0.4); ctx.lineTo(x + s * 0.4, y + s * 0.3); ctx.lineTo(x - s * 0.4, y + s * 0.3); ctx.closePath();
    }
    else if (type === 7) { ctx.moveTo(x - s * 0.4, y); ctx.lineTo(x + s * 0.4, y); ctx.moveTo(x, y - s * 0.4); ctx.lineTo(x, y + s * 0.4); }
    else if (type === 8) { ctx.arc(x, y, s * 0.35, 0, Math.PI * 2); ctx.fillRect(x - s * 0.08, y - s * 0.08, s * 0.16, s * 0.16); }
    else { ctx.moveTo(x - s * 0.45, y); ctx.lineTo(x - s * 0.15, y); ctx.moveTo(x - s * 0.05, y); ctx.lineTo(x + s * 0.25, y); ctx.moveTo(x + s * 0.35, y); ctx.lineTo(x + s * 0.45, y); }
    if (type === 2 || type === 6 || type === 8) { ctx.stroke(); } else { ctx.stroke(); }
  }

  // A faint paper score page covered in invented pseudo-script glyphs.
  function scorePage(cx, cy, pw, ph, seed, alpha) {
    var rng = mulberry32(seed);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#E4E0D6';
    ctx.fillRect(cx - pw / 2, cy - ph / 2, pw, ph);
    var cols = 8, rows = 5;
    var gx = pw / (cols + 1), gy = ph / (rows + 1);
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var t = Math.floor(rng() * 10);
        var s = Math.min(gx, gy) * 0.55;
        glyph(t, cx - pw / 2 + gx * (c + 1), cy - ph / 2 + gy * (r + 1), s, '#2B2B2B');
      }
    }
    ctx.restore();
  }

  function draw(tau) {
    nowT = tau;
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }

    // Full-bleed grain field. Grain is a seeded function of (block, quantized time index),
    // never per-frame random: the same quantum always paints the same field.
    var q = Math.floor(tau / 0.5);
    for (var by = 0; by * BLOCK < H; by++) {
      for (var bx = 0; bx * BLOCK < W; bx++) {
        var h = grainHash(bx, by, q);
        var v = 58 + Math.floor(h * 62);
        if (h > 0.985) v = 138;
        else if (h < 0.015) v = 40;
        ctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
        ctx.fillRect(bx * BLOCK, by * BLOCK, BLOCK, BLOCK);
      }
    }

    // Clock page-flash: one page of the 10-page score, at fixed intervals.
    // Phase-shifted +1.2 s so frame one already shows page 1 mid-flash.
    var tp = (tau + 1.2) % LOOP;
    var page = Math.floor(tp / PAGE_SPAN);
    var u = tp - page * PAGE_SPAN;
    var env = 0;
    if (u < 0.6) env = u / 0.6;
    else if (u < 2.2) env = 1;
    else if (u < 3.2) env = 1 - (u - 2.2) / 1.0;
    if (env > 0) {
      scorePage(W / 2, H / 2, Math.min(W * 0.72, 560), Math.min(H * 0.52, 360),
        1365000 + page * 7919, 0.30 * env);
    }

    // Touch flashes: momentary score-page reveals, overlays only. They change
    // nothing else — the clock, grain, and scan-line run on regardless.
    for (var i = 0; i < touches.length; i++) {
      var age = tau - touches[i].t0;
      if (age < 0 || age >= 2.5) continue;
      var a = 0.35 * (1 - age / 2.5);
      var px = Math.min(Math.max(touches[i].x, Math.min(W * 0.3, 210)), W - Math.min(W * 0.3, 210));
      var py = Math.min(Math.max(touches[i].y, Math.min(H * 0.21, 140)), H - Math.min(H * 0.21, 140));
      scorePage(px, py, Math.min(W * 0.6, 420), Math.min(H * 0.42, 280), touches[i].seed, a);
    }

    // Thin red scan-line marks elapsed time across the 3:48 loop.
    // A line, not a progress bar: no track, no percentage, no fill.
    var sx = ((tau % LOOP) / LOOP) * W;
    ctx.fillStyle = '#D43A2F';
    ctx.fillRect(Math.floor(sx), 0, 2, H);
  }

  function onPointer(e) {
    var r = (cv.getBoundingClientRect) ? cv.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX || 0) - r.left;
    var y = (e.clientY || 0) - r.top;
    touches.push({ x: x, y: y, t0: nowT, seed: 1365000 + touches.length * 7919 + Math.floor(x + y) });
    if (touches.length > 8) touches.shift();
  }
  if (cv.addEventListener) cv.addEventListener('pointerdown', onPointer);

  function onResize() { size(); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener)
      window.visualViewport.addEventListener('resize', onResize);
    if (window.addEventListener) window.addEventListener('resize', onResize);
  }

  // Frame one is drawn synchronously at a constant phase; the clock starts
  // only with the rAF loop (plain function declaration, typeof-guarded).
  draw(0);
  function loop(ts) {
    draw(ts / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
