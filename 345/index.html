<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.345 Night Visitors</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0B08; }
  canvas { display:block; touch-action:none; cursor:grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.345 Night Visitors (emibeebuzz).
// After Emi Bee's hidden-motif damask: an antique ogee
// lattice in bone on near-black that reads as pure damask
// from afar, with sixteen ghosts, bats and owls hidden
// inside it in the same ink and lineweight, resolving only
// on a close look. The lattice breathes on a 16s seamless
// loop; the creatures' ember eyes blink in one fixed
// authored sequence inside the same 16s, so frame 16s is
// pixel-identical to frame 0. Drag pans and zooms to hunt:
// the lattice is authored at 1.4x frame so it always
// covers, zoom clamps to 1x-2.5x, and the explored view
// persists on release. Nothing here is runtime random:
// the lattice, the creature table and the blink order are
// all fixed data below.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0D0B08', BONE = '#E8DCC8', EMBER = '#E4572E';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
// Constant first-frame phase: 5.275s into the 16s loop puts
// the lattice at a developed breath and blink slot 5 at its
// midpoint. The rAF loop advances T from this anchor by
// fixed ticks only; frame one never reads a wall clock.
var T = 5.275, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var LOOP = 16;
if (LOOP !== 16) throw new Error('Night Visitors loop must be 16s');

// ---- world: lattice authored at 1.4x frame, centred on 0,0 --
var WW = 1792, WH = 1260; // world width / height (1.4 * 1280 x 1.4 * 900)

// ---- ogee lattice grid --------------------------------------
// Rows at y = 180*m, half-drop offset 80 on odd rows. The
// offset pattern is symmetric under both mirrors by
// construction (row -m carries the same offset as row m,
// and an 80-offset row mirrors onto itself), so the whole
// lattice is strictly mirror-symmetric on both axes.
var CELL_W = 150, CELL_H = 200, DX = 160, DY = 180;
function rowOff(m) { return (((m % 2) + 2) % 2 === 1) ? 80 : 0; }
var CELLS = [];
for (var rm = -3; rm <= 3; rm++) {
  var off = rowOff(rm);
  for (var rk = -6; rk <= 6; rk++) {
    var cx = rk * DX + off;
    if (cx < -920 || cx > 920) continue;
    CELLS.push([cx, rm * DY]);
  }
}

// ---- hidden creatures: exactly 16, mirrored pairs -----------
// [type, x, y, sx, sy] as fixed data. Every entry sits on a
// lattice cell centre; each type's placements are closed
// under both mirrors (asserted below). 6 ghosts, 6 bats,
// 4 owls. They are drawn in the same bone ink and lineweight
// as the lattice; ember appears only as their eyes.
var CREATURES = [
  ['ghost',  240, -180,  1,  1],
  ['ghost', -240, -180, -1,  1],
  ['ghost',  240,  180,  1, -1],
  ['ghost', -240,  180, -1, -1],
  ['ghost',    0, -360,  1,  1],
  ['ghost',    0,  360,  1, -1],
  ['bat',    400,  180,  1,  1],
  ['bat',   -400,  180, -1,  1],
  ['bat',    400, -180,  1, -1],
  ['bat',   -400, -180, -1, -1],
  ['bat',    160,    0,  1,  1],
  ['bat',   -160,    0, -1,  1],
  ['owl',    160,  360,  1,  1],
  ['owl',   -160,  360, -1,  1],
  ['owl',    160, -360,  1, -1],
  ['owl',   -160, -360, -1, -1]
];
// Blink order: a fixed authored sequence over the 16
// creatures. The creature in slot s blinks starting at
// s seconds into the loop, one blink per second.
var ORDER = [7, 2, 13, 4, 10, 0, 15, 5, 11, 3, 8, 14, 1, 12, 6, 9];
var BLINK_LEN = 0.55;
var SLOT_OF = [];
(function () {
  if (CREATURES.length !== 16) throw new Error('must hide exactly 16 creatures');
  var counts = { ghost: 0, bat: 0, owl: 0 };
  var keys = {};
  for (var i = 0; i < 16; i++) {
    var c = CREATURES[i];
    counts[c[0]]++;
    keys[c[0] + '|' + c[1] + '|' + c[2]] = true;
    // every creature must sit on a lattice cell centre
    var m = Math.round(c[2] / DY);
    if (m * DY !== c[2] || (c[1] - rowOff(m)) % DX !== 0) throw new Error('creature off lattice at ' + i);
  }
  if (counts.ghost !== 6 || counts.bat !== 6 || counts.owl !== 4) throw new Error('creature counts must be 6/6/4');
  // mirror closure on both axes, per type
  for (var j = 0; j < 16; j++) {
    var d = CREATURES[j];
    var mirrors = [[-d[1], d[2]], [d[1], -d[2]], [-d[1], -d[2]]];
    for (var q = 0; q < 3; q++) {
      if (!keys[d[0] + '|' + mirrors[q][0] + '|' + mirrors[q][1]]) throw new Error('creature set not mirror-symmetric at ' + j);
    }
  }
  if (ORDER.length !== 16) throw new Error('blink order must cover 16 slots');
  var seen = {};
  for (var s = 0; s < 16; s++) {
    if (seen[ORDER[s]]) throw new Error('blink order repeats a creature');
    seen[ORDER[s]] = true;
    SLOT_OF[ORDER[s]] = s;
  }
})();
var CREATURE_CELLS = {};
for (var ci = 0; ci < 16; ci++) CREATURE_CELLS[CREATURES[ci][1] + ',' + CREATURES[ci][2]] = true;
// Node diamonds never land on a creature centre (the node
// grid and the cell centres share points); the creature set
// is mirror-closed, so the skipped nodes stay symmetric.

// ---- drawing: the ogee cell ---------------------------------
// One hand-authored ogee outline (four-way symmetric by
// construction), an inner ogee, and a symmetric medallion.
// The same routine stamps every cell, so the tiling is the
// mirror-symmetric repeat of a single authored cell.
function ogeePath(cx, cy, sc) {
  var hw = 75 * sc, hh = 100 * sc;
  ctx.beginPath();
  ctx.moveTo(cx, cy - hh);
  ctx.bezierCurveTo(cx + 26 * sc, cy - 96 * sc, cx + 52 * sc, cy - 78 * sc, cx + 63 * sc, cy - 44 * sc);
  ctx.bezierCurveTo(cx + 72 * sc, cy - 16 * sc, cx + 70 * sc, cy + 14 * sc, cx + 58 * sc, cy + 42 * sc);
  ctx.bezierCurveTo(cx + 46 * sc, cy + 70 * sc, cx + 24 * sc, cy + 90 * sc, cx, cy + hh);
  ctx.bezierCurveTo(cx - 24 * sc, cy + 90 * sc, cx - 46 * sc, cy + 70 * sc, cx - 58 * sc, cy + 42 * sc);
  ctx.bezierCurveTo(cx - 70 * sc, cy + 14 * sc, cx - 72 * sc, cy - 16 * sc, cx - 63 * sc, cy - 44 * sc);
  ctx.bezierCurveTo(cx - 52 * sc, cy - 78 * sc, cx - 26 * sc, cy - 96 * sc, cx, cy - hh);
  ctx.closePath();
  ctx.stroke();
}
function petal(cx, cy, dx, dy) {
  var px = -dy, py = dx;
  ctx.beginPath();
  ctx.moveTo(cx + dx * 44, cy + dy * 44);
  ctx.quadraticCurveTo(cx + dx * 37 + px * 7, cy + dy * 37 + py * 7, cx + dx * 26, cy + dy * 26);
  ctx.quadraticCurveTo(cx + dx * 37 - px * 7, cy + dy * 37 - py * 7, cx + dx * 44, cy + dy * 44);
  ctx.stroke();
}
function medallion(cx, cy) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - 26);
  ctx.lineTo(cx + 19, cy);
  ctx.lineTo(cx, cy + 26);
  ctx.lineTo(cx - 19, cy);
  ctx.closePath();
  ctx.stroke();
  petal(cx, cy, 0, -1); petal(cx, cy, 1, 0); petal(cx, cy, 0, 1); petal(cx, cy, -1, 0);
  ctx.beginPath();
  ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
  ctx.stroke();
  var dots = [[30, 30], [30, -30], [-30, 30], [-30, -30]];
  for (var i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(cx + dots[i][0], cy + dots[i][1], 3, 0, Math.PI * 2);
    ctx.stroke();
  }
}
function nodeDiamond(x, y) {
  ctx.beginPath();
  ctx.moveTo(x, y - 8);
  ctx.lineTo(x + 6, y);
  ctx.lineTo(x, y + 8);
  ctx.lineTo(x - 6, y);
  ctx.closePath();
  ctx.stroke();
}

// ---- drawing: the creatures ---------------------------------
// All local paths are centred on 0,0 and replayed under the
// stored mirror transform, so a mirrored copy is a true
// mirror. Eyes are the only ember in the piece.
function eye(x, y, r, open) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, Math.max(0.16, open));
  ctx.fillStyle = EMBER;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function ghostPath() {
  ctx.beginPath();
  ctx.moveTo(-23, 28);
  ctx.lineTo(-23, -4);
  ctx.bezierCurveTo(-23, -24, -13, -30, 0, -30);
  ctx.bezierCurveTo(13, -30, 23, -24, 23, -4);
  ctx.lineTo(23, 28);
  ctx.quadraticCurveTo(15.33, 19, 7.67, 28);
  ctx.quadraticCurveTo(0, 19, -7.67, 28);
  ctx.quadraticCurveTo(-15.33, 19, -23, 28);
  ctx.closePath();
  ctx.stroke();
}
function batPath() {
  // body
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.bezierCurveTo(8, -14, 10, -6, 10, 2);
  ctx.bezierCurveTo(10, 11, 6, 16, 0, 16);
  ctx.bezierCurveTo(-6, 16, -10, 11, -10, 2);
  ctx.bezierCurveTo(-10, -6, -8, -14, 0, -14);
  ctx.closePath();
  ctx.stroke();
  // ears
  ctx.beginPath();
  ctx.moveTo(-6.5, -11.5); ctx.lineTo(-8.5, -20); ctx.lineTo(-2.5, -13.5);
  ctx.moveTo(6.5, -11.5); ctx.lineTo(8.5, -20); ctx.lineTo(2.5, -13.5);
  ctx.stroke();
  // scalloped wings, both sides
  for (var s = -1; s <= 1; s += 2) {
    ctx.beginPath();
    ctx.moveTo(s * 9, -6);
    ctx.bezierCurveTo(s * 18, -14, s * 26, -15, s * 33, -11);
    ctx.bezierCurveTo(s * 28, -6, s * 27, -3, s * 28, 1);
    ctx.bezierCurveTo(s * 23, 0, s * 21, 2, s * 21, 6);
    ctx.bezierCurveTo(s * 16, 4, s * 12, 6, s * 9, 10);
    ctx.stroke();
  }
}
function owlPath() {
  ctx.beginPath();
  ctx.moveTo(0, -27);
  ctx.bezierCurveTo(15, -27, 22, -15, 22, 2);
  ctx.bezierCurveTo(22, 19, 13, 29, 0, 29);
  ctx.bezierCurveTo(-13, 29, -22, 19, -22, 2);
  ctx.bezierCurveTo(-22, -15, -15, -27, 0, -27);
  ctx.closePath();
  ctx.stroke();
  // ear tufts
  ctx.beginPath();
  ctx.moveTo(-15, -21); ctx.lineTo(-20, -30);
  ctx.moveTo(15, -21); ctx.lineTo(20, -30);
  ctx.stroke();
  // face discs
  ctx.beginPath(); ctx.arc(-8, -6, 8.5, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(8, -6, 8.5, 0, Math.PI * 2); ctx.stroke();
  // beak
  ctx.beginPath();
  ctx.moveTo(-3.5, 3); ctx.lineTo(3.5, 3); ctx.lineTo(0, 8); ctx.closePath();
  ctx.stroke();
  // belly arcs
  ctx.beginPath(); ctx.arc(0, 13, 11, Math.PI * 0.22, Math.PI * 0.78); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 19, 6, Math.PI * 0.22, Math.PI * 0.78); ctx.stroke();
  // wing lines
  ctx.beginPath();
  ctx.moveTo(-20, -2); ctx.bezierCurveTo(-14, 6, -14, 14, -18, 20);
  ctx.moveTo(20, -2); ctx.bezierCurveTo(14, 6, 14, 14, 18, 20);
  ctx.stroke();
}
function openness(idx, tm) {
  var local = tm - SLOT_OF[idx];
  if (local < 0 || local >= BLINK_LEN) return 1;
  var u = local / BLINK_LEN;
  return 1 - 0.9 * Math.pow(Math.sin(Math.PI * u), 1.5);
}
function drawCreature(idx, tm) {
  var c = CREATURES[idx];
  var open = openness(idx, tm);
  ctx.save();
  ctx.translate(c[1], c[2]);
  ctx.scale(c[3], c[4]);
  ctx.strokeStyle = BONE;
  ctx.lineWidth = 2.2;
  if (c[0] === 'ghost') {
    ghostPath();
    eye(-8, -9, 2.8, open);
    eye(8, -9, 2.8, open);
  } else if (c[0] === 'bat') {
    batPath();
    eye(-3.5, -2, 2.2, open);
    eye(3.5, -2, 2.2, open);
  } else {
    owlPath();
    eye(-8, -6, 3.1, open);
    eye(8, -6, 3.1, open);
  }
  ctx.restore();
}

// ---- view: pan / zoom hunt state -----------------------------
var z = 1, zT = 1, panX = 0, panY = 0;
function breath(tm) { return 1 + 0.022 * Math.sin(2 * Math.PI * tm / LOOP); }
function clampPan() {
  var zEff = z * 0.978; // breath minimum, so the frame is covered at every phase
  var mx = Math.max(0, WW / 2 - (DW / 2) / zEff);
  var my = Math.max(0, WH / 2 - (DH / 2) / zEff);
  if (panX > mx) panX = mx; if (panX < -mx) panX = -mx;
  if (panY > my) panY = my; if (panY < -my) panY = -my;
}

function draw() {
  var tm = T % LOOP;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var b = breath(tm);
  ctx.save();
  ctx.translate(DW / 2, DH / 2);
  ctx.scale(z * b, z * b);
  ctx.translate(-panX, -panY);
  ctx.strokeStyle = BONE;
  ctx.lineWidth = 2.2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  // node diamonds at the lattice joints (symmetric set:
  // 80a x 90b points with a+b odd mirror onto themselves)
  ctx.lineWidth = 1.8;
  for (var a = -11; a <= 11; a++) {
    for (var bb = -6; bb <= 6; bb++) {
      if (((a + bb) % 2 + 2) % 2 !== 1) continue;
      if (CREATURE_CELLS[(a * 80) + ',' + (bb * 90)]) continue;
      nodeDiamond(a * 80, bb * 90);
    }
  }
  ctx.lineWidth = 2.2;
  for (var i = 0; i < CELLS.length; i++) {
    var cx = CELLS[i][0], cy = CELLS[i][1];
    ogeePath(cx, cy, 1);
    ogeePath(cx, cy, 0.64);
    if (!CREATURE_CELLS[cx + ',' + cy]) medallion(cx, cy);
  }
  for (var j = 0; j < 16; j++) drawCreature(j, tm);
  ctx.restore();
}

// ---- sizing: full-bleed field, cover-fit ---------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag: pan with one pointer, pinch zoom with two --------
// Pointer positions are converted to design coords via the
// stored cover transform. The explored view persists on
// release: no snap home, no reload, and the creature set and
// blink order never change.
var pointers = {};
var grab = null, pinch = null;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function pointerList() {
  var out = [];
  for (var id in pointers) out.push(pointers[id]);
  return out;
}
canvas.addEventListener('pointerdown', function (e) {
  pointers[e.pointerId] = toDesign(e);
  var pts = pointerList();
  if (pts.length === 1) {
    grab = { x: pts[0][0], y: pts[0][1], panX: panX, panY: panY };
    pinch = null;
  } else if (pts.length === 2) {
    pinch = {
      dist: Math.hypot(pts[0][0] - pts[1][0], pts[0][1] - pts[1][1]),
      mx: (pts[0][0] + pts[1][0]) / 2, my: (pts[0][1] + pts[1][1]) / 2,
      zT: zT, panX: panX, panY: panY
    };
    grab = null;
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!pointers[e.pointerId]) return;
  pointers[e.pointerId] = toDesign(e);
  var pts = pointerList();
  var zb = Math.max(0.5, z * breath(T % LOOP));
  if (grab && pts.length === 1) {
    panX = grab.panX - (pts[0][0] - grab.x) / zb;
    panY = grab.panY - (pts[0][1] - grab.y) / zb;
    clampPan();
  } else if (pinch && pts.length === 2) {
    var dist = Math.hypot(pts[0][0] - pts[1][0], pts[0][1] - pts[1][1]);
    var mx = (pts[0][0] + pts[1][0]) / 2, my = (pts[0][1] + pts[1][1]) / 2;
    if (pinch.dist > 0) zT = Math.min(2.5, Math.max(1, pinch.zT * dist / pinch.dist));
    panX = pinch.panX - (mx - pinch.mx) / zb;
    panY = pinch.panY - (my - pinch.my) / zb;
    clampPan();
  }
});
function endPointer(e) {
  delete pointers[e.pointerId];
  var pts = pointerList();
  pinch = null;
  if (pts.length === 1) grab = { x: pts[0][0], y: pts[0][1], panX: panX, panY: panY };
  else grab = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', function (e) {
  if (e.preventDefault) e.preventDefault();
  var p = toDesign(e);
  var b = breath(T % LOOP);
  var wx = panX + (p[0] - DW / 2) / (z * b);
  var wy = panY + (p[1] - DH / 2) / (z * b);
  zT = Math.min(2.5, Math.max(1, zT * Math.exp(-e.deltaY * 0.0012)));
  z = zT;
  panX = wx - (p[0] - DW / 2) / (z * b);
  panY = wy - (p[1] - DH / 2) / (z * b);
  clampPan();
});

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  z += (zT - z) * 0.18;
  if (Math.abs(zT - z) < 0.001) z = zT;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
