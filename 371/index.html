<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.371 Hummingbird Trailing</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F1EBDC; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.371 Hummingbird Trailing (al_kovalyova_design).
// After Olena Kovalova's Timeless Nursery: William-Morris-style
// trailing vines on cream - four winding stems with alternating
// lanceolate leaves, seed clusters and curling tendrils, and
// fine-line hummingbirds hovering at the vine nodes. The field
// is authored on a 900px vertical period and drifts slowly
// downward: over the 36s master loop the scroll travels exactly
// one whole period, so the trailing is seamless at rest. Each
// bird hovers on a sine bob (21 whole bob cycles per loop) with
// a two-frame wing flutter locked to the bob phase (three
// wingbeats per bob cycle). TAP a bird and it darts along an
// eased arc to the NEXT node on its own authored route table,
// never a random one; tap is a state change only, separated
// from drag by a movement threshold. DRAG pans the trailing
// field vertically, clamped, the field authored oversized so
// the pan never opens an edge; the pan persists on release.
// Frame one is drawn at the constant phase T = 13.25s, vines
// developed and birds mid-hover; the animation clock is
// anchored to that constant plus elapsed time, never a
// wall-clock offset. Flat colour only (the study's watercolor
// washes rendered as flat muted fills), one canvas, no
// gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var PERIOD = 900;           // vertical field period; DH === PERIOD
var LAM = 450;              // vine sway wavelength; PERIOD % LAM === 0
var LOOP = 36;              // seconds, seamless master loop
var BOBCYC = 21;            // whole hover-bob cycles per loop
var GROUND = '#F1EBDC';
var SAGE = '#8FA88F';
var MAUVE = '#9B7E86';
var TERRA = '#C4704E';
var SEED = '#7A5C44';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 13.25, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var panY = 0;
var PANY = 240;

// ---- vine columns ------------------------------------------------
// Four columns (spec: 3-5). baseX spread across the design
// width; swayAmp and phase per column; stations every 75px down
// the period, odd columns offset by 37px so the columns stagger.
var COLS = [
  { x: 170,  amp: 44, ph: 0.0 },
  { x: 480,  amp: 52, ph: 1.9 },
  { x: 800,  amp: 48, ph: 4.1 },
  { x: 1100, amp: 42, ph: 2.8 }
];
var NST = 12;               // stations per column per period
function stationY(c, k) { return k * 75 + (c % 2 === 1 ? 37 : 0); }
function vineX(c, fieldY) {
  var col = COLS[c];
  return col.x + col.amp * Math.sin(Math.PI * 2 * fieldY / LAM + col.ph);
}
// Deterministic per-station variation, pure function of indices.
function vary(a, b) {
  var v = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;
  return v - Math.floor(v);
}

// ---- birds -------------------------------------------------------
// Each bird owns a route table of [column, station] nodes and
// starts hovering at route[0]. side: which side of the stem the
// bird hovers on; the beak always points back toward the vine.
// fx/fy: current position in field coords (fy unwrapped during
// flight; rendering wraps it).
var BIRDS = [
  { route: [[0, 2], [0, 5], [0, 8], [0, 11], [0, 6]], idx: 0, side: 1,  bobOff: 0.00, fx: 0, fy: 0, fly: null },
  { route: [[1, 9], [1, 4], [1, 1], [1, 7], [1, 10]], idx: 0, side: -1, bobOff: 0.37, fx: 0, fy: 0, fly: null },
  { route: [[2, 3], [2, 8], [2, 5], [2, 0], [2, 10]], idx: 0, side: 1,  bobOff: 0.61, fx: 0, fy: 0, fly: null },
  { route: [[3, 6], [3, 11], [3, 2], [3, 7], [3, 4]], idx: 0, side: -1, bobOff: 0.83, fx: 0, fy: 0, fly: null }
];
function nodePos(b) {
  var n = b.route[b.idx];
  var fy = stationY(n[0], n[1]);
  return { x: vineX(n[0], fy) + b.side * 62, y: fy - 8 };
}
(function () {
  var i, j, b;
  if (PERIOD % LAM !== 0) throw new Error('sway wavelength must divide the period');
  if (COLS.length < 3 || COLS.length > 5) throw new Error('need 3-5 vine columns');
  if (NST * 75 !== PERIOD) throw new Error('stations must tile the period exactly');
  if (BIRDS.length !== 4) throw new Error('need exactly 4 birds');
  for (i = 0; i < BIRDS.length; i++) {
    b = BIRDS[i];
    if (b.route.length < 4) throw new Error('each route needs at least 4 nodes');
    for (j = 0; j < b.route.length; j++) {
      if (b.route[j][0] < 0 || b.route[j][0] >= COLS.length) throw new Error('route column out of range');
      if (b.route[j][1] < 0 || b.route[j][1] >= NST) throw new Error('route station out of range');
    }
    var p = nodePos(b);
    b.fx = p.x; b.fy = p.y;
  }
})();

// ---- time --------------------------------------------------------
function phase() { return ((T % LOOP) + LOOP) % LOOP / LOOP; }
function scrollY() { return phase() * PERIOD + panY; }
function wrapY(y) { return ((y % PERIOD) + PERIOD) % PERIOD; }

// ---- flight ------------------------------------------------------
// A tap starts a flight to the next route node. The path is an
// eased lerp in field coords with the vertical delta taken the
// short way around the period, plus an upward arc lift.
var FLYDUR = 0.85;
function startFlight(b) {
  var from = { x: b.fx, y: b.fy };
  b.idx = (b.idx + 1) % b.route.length;
  var to = nodePos(b);
  var dy = to.y - from.y;
  dy = ((dy + PERIOD * 1.5) % PERIOD) - PERIOD / 2;
  b.fly = { t0: T, fx: from.x, fy: from.y, tx: to.x, dy: dy };
}
function updateBird(b) {
  if (!b.fly) return;
  var u = (T - b.fly.t0) / FLYDUR;
  if (u >= 1) {
    var p = nodePos(b);
    b.fx = p.x; b.fy = p.y; b.fly = null;
    return;
  }
  var e = u * u * (3 - 2 * u);
  b.fx = b.fly.fx + (b.fly.tx - b.fly.fx) * e;
  b.fy = b.fly.fy + b.fly.dy * e - Math.sin(Math.PI * e) * 26;
}
// Hover bob for bird b at its current position: amplitude eases
// down mid-flight. Wing pose is two-frame, locked to 3x the bob.
function birdPose(b) {
  var bobPh = Math.PI * 2 * (BOBCYC * phase() + b.bobOff);
  var amp = 7;
  if (b.fly) {
    var u = Math.min(1, (T - b.fly.t0) / FLYDUR);
    amp = 7 * (1 - 0.7 * Math.sin(Math.PI * u));
  }
  return {
    bobY: amp * Math.sin(bobPh),
    wingUp: Math.sin(bobPh * 3) >= 0
  };
}

// ---- leaves, clusters, tendrils ----------------------------------
// Lanceolate leaf: pointed oval from the origin along +x,
// flat sage fill, 1px cream centre vein.
function drawLeaf(len, wid) {
  ctx.fillStyle = SAGE;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.5, -wid / 2, len, 0);
  ctx.quadraticCurveTo(len * 0.5, wid / 2, 0, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = GROUND;
  ctx.globalAlpha = 0.75;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(5, 0);
  ctx.lineTo(len - 7, 0);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
// Seed cluster: a short drooping stem arc and six seed dots
// bunched at its end.
var SEEDOFF = [[0, 0], [-7, -4], [7, -3], [-4, 6], [5, 5], [0, -8]];
function drawCluster() {
  ctx.strokeStyle = SAGE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(3, 12, 1, 24);
  ctx.stroke();
  ctx.fillStyle = SEED;
  var i, r;
  for (i = 0; i < SEEDOFF.length; i++) {
    r = 3.2 + (i % 3) * 0.7;
    ctx.beginPath();
    ctx.arc(1 + SEEDOFF[i][0], 26 + SEEDOFF[i][1], r, 0, Math.PI * 2);
    ctx.fill();
  }
}
// Tendril: a small one-and-a-half-turn curl.
function drawTendril() {
  ctx.strokeStyle = SAGE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, 8, Math.PI * 0.15, Math.PI * 1.9);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(1.5, -0.5, 4, Math.PI * 0.4, Math.PI * 2.1);
  ctx.stroke();
}
function drawStation(c, k, ys) {
  var fy = stationY(c, k);
  var x = vineX(c, fy);
  var side = ((k + c) % 2 === 0) ? 1 : -1;
  var len = 62 + 22 * vary(k, c);
  var wid = 21 + 6 * vary(c, k + 40);
  ctx.save();
  ctx.translate(x, ys);
  // leaf, angled down and out from the stem
  ctx.save();
  ctx.rotate(side === 1 ? 0.55 : Math.PI - 0.55);
  drawLeaf(len, wid);
  ctx.restore();
  // seed cluster on the opposite side at every fourth station
  if (k % 4 === 2) {
    ctx.save();
    ctx.translate(-side * 4, 2);
    ctx.scale(-side, 1);
    drawCluster();
    ctx.restore();
  }
  // tendril curl on the leaf side at every third station
  if (k % 3 === 1) {
    ctx.save();
    ctx.translate(side * 9, 8);
    ctx.scale(side, 1);
    drawTendril();
    ctx.restore();
  }
  ctx.restore();
}

// ---- stems ---------------------------------------------------------
function drawStem(c, sc) {
  ctx.strokeStyle = SAGE;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  var ys, fy, x;
  for (ys = -36; ys <= DH + 36; ys += 12) {
    fy = ys - sc;
    x = vineX(c, fy);
    if (ys === -36) ctx.moveTo(x, ys); else ctx.lineTo(x, ys);
  }
  ctx.stroke();
}

// ---- the bird ------------------------------------------------------
// Local coords, origin at body centre, facing +x. Drawn at about
// 165x95 design px: slim forked tail, teardrop body, terracotta
// gorget, needle beak, two thin swept wings in two authored
// flutter poses (raised / pressed) chosen by the bob phase.
// Two authored wing poses (the two-frame flutter): raised, a
// slim blade sweeping up and back from the shoulder; pressed,
// a blade swept down and back with its root at the body line.
function wingPath(up) {
  ctx.beginPath();
  if (up) {
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-10, -34, -28, -58);
    ctx.quadraticCurveTo(-40, -52, -42, -46);
    ctx.quadraticCurveTo(-24, -18, -8, -2);
  } else {
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-22, 8, -48, 20);
    ctx.quadraticCurveTo(-54, 10, -50, 2);
    ctx.quadraticCurveTo(-24, -4, -8, -2);
  }
  ctx.closePath();
}
function drawBird(b, x, y) {
  var pose = birdPose(b);
  ctx.save();
  ctx.translate(x, y + pose.bobY);
  ctx.scale(b.side === 1 ? -1 : 1, 1); // beak toward the vine
  // far wing, behind the body: same pose, smaller, paler
  ctx.save();
  ctx.translate(4, -4);
  ctx.scale(0.78, 0.78);
  ctx.fillStyle = MAUVE;
  ctx.globalAlpha = 0.45;
  wingPath(pose.wingUp);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
  // slim forked tail
  ctx.fillStyle = MAUVE;
  ctx.beginPath();
  ctx.moveTo(-33, -5);
  ctx.lineTo(-78, -11);
  ctx.lineTo(-71, 0);
  ctx.lineTo(-78, 13);
  ctx.lineTo(-33, 7);
  ctx.closePath();
  ctx.fill();
  // body: horizontal teardrop, fine seed outline
  ctx.beginPath();
  ctx.moveTo(-36, -3);
  ctx.bezierCurveTo(-16, -13, 12, -14, 30, -9);
  ctx.bezierCurveTo(40, -6, 42, 0, 38, 5);
  ctx.bezierCurveTo(28, 14, -8, 15, -28, 9);
  ctx.bezierCurveTo(-36, 6, -38, 2, -36, -3);
  ctx.closePath();
  ctx.fillStyle = MAUVE;
  ctx.fill();
  ctx.strokeStyle = SEED;
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.globalAlpha = 1;
  // near wing
  ctx.save();
  ctx.translate(0, -6);
  ctx.fillStyle = MAUVE;
  wingPath(pose.wingUp);
  ctx.fill();
  ctx.restore();
  // terracotta gorget
  ctx.fillStyle = TERRA;
  ctx.beginPath();
  ctx.moveTo(24, -6);
  ctx.quadraticCurveTo(38, -4, 39, 3);
  ctx.quadraticCurveTo(32, 10, 23, 8);
  ctx.quadraticCurveTo(19, 1, 24, -6);
  ctx.closePath();
  ctx.fill();
  // eye and needle beak
  ctx.fillStyle = SEED;
  ctx.beginPath();
  ctx.arc(29, -4, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = SEED;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(40, -1);
  ctx.lineTo(80, -4);
  ctx.stroke();
  ctx.restore();
}

// ---- drawing -------------------------------------------------------
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var sc = scrollY();
  var c, k, i, y0, dy, b;
  for (c = 0; c < COLS.length; c++) drawStem(c, sc);
  for (c = 0; c < COLS.length; c++) {
    for (k = 0; k < NST; k++) {
      y0 = wrapY(stationY(c, k) + sc);
      for (dy = -PERIOD; dy <= PERIOD; dy += PERIOD) {
        if (y0 + dy > -130 && y0 + dy < DH + 130) drawStation(c, k, y0 + dy);
      }
    }
  }
  for (i = 0; i < BIRDS.length; i++) {
    b = BIRDS[i];
    updateBird(b);
    y0 = wrapY(b.fy + sc);
    for (dy = -PERIOD; dy <= PERIOD; dy += PERIOD) {
      if (y0 + dy > -130 && y0 + dy < DH + 130) drawBird(b, b.fx, y0 + dy);
    }
  }
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag pans vertically; tap (below the movement threshold)
// sends the tapped bird to its next route node -------------------
var dragging = false, dragMoved = false, downX = 0, downY = 0, lastDY = 0;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true; dragMoved = false;
  downX = p.x; downY = p.y; lastDY = p.y;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dy = p.y - lastDY;
  lastDY = p.y;
  if (Math.abs(p.x - downX) + Math.abs(p.y - downY) > 8) dragMoved = true;
  if (dragMoved) {
    panY += dy;
    if (panY > PANY) panY = PANY;
    if (panY < -PANY) panY = -PANY;
  }
});
canvas.addEventListener('pointerup', function (e) {
  if (!dragging) return;
  dragging = false;
  if (dragMoved) return;
  var p = toDesign(e);
  var sc = scrollY();
  var i, b, y0, dy, d, best = null, bestD = 88;
  for (i = 0; i < BIRDS.length; i++) {
    b = BIRDS[i];
    if (b.fly) continue;
    y0 = wrapY(b.fy + sc);
    for (dy = -PERIOD; dy <= PERIOD; dy += PERIOD) {
      d = Math.hypot(p.x - b.fx, p.y - (y0 + dy));
      if (d < bestD) { bestD = d; best = b; }
    }
  }
  if (best) startFlight(best);
});
canvas.addEventListener('pointercancel', function () { dragging = false; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK;
    acc -= TICK; guard++;
  }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
